unit: 3
description: |
  45 questions · about 75 minutes · every topic of Period 3 (3.1 to 3.13) with about a fifth of the items reviewing
  Periods 1 and 2, five source-based multiple-choice sets in the style of the AP exam, one short-answer question on a
  historian's interpretation, one on a visual source, and a document-based question (7 points) on how far the
  Revolution changed American society. Multiple choice, select-all and true/false items are graded at once;
  fill-in-the-blank items are matched automatically; the free-response items are graded by your teacher against
  the scoring notes.
questions:
  # ---- Set 1: the Declaratory Act (3.3, 3.2, 3.1)
  - slug: apush-u03-exam-q01
    type: multiple_choice
    topic_code: "3.3"
    source: "Primary source: Declaratory Act (1766), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "That the said colonies and plantations in America have been, are, and of right ought to be, subordinate unto, and dependent upon the imperial crown and parliament of Great Britain; and that the King's majesty, by and with the advice and consent of the lords spiritual and temporal, and commons of Great Britain, in parliament assembled, . . . of right ought to have, full power and authority to make laws and statutes of sufficient force and validity to bind the colonies and people of America, subjects of the crown of Great Britain, in all cases whatsoever . . ."

      — An Act for the better securing the dependency of His Majesty's dominions in America upon the crown and parliament of Great Britain (the Declaratory Act), March 1766
    prompt: |
      Parliament passed the act excerpted above at the same time that it
    options:
      - "passed the Townshend Acts"
      - "repealed the Stamp Act"
      - "issued the Proclamation of 1763"
      - "closed the port of Boston"
    option_explanations:
      - |
        The Townshend Acts came a year later, in 1767; they were an application of the principle the Declaratory Act asserted.
      - |
        Correct. Faced with colonial boycotts and pressure from British merchants, Parliament repealed the Stamp Act in March 1766, but in the same session asserted through this act that it had not surrendered its authority.
      - |
        The Proclamation of 1763 was issued by the king three years earlier and concerned western lands, not parliamentary authority.
      - |
        The Boston Port Act was one of the Coercive Acts of 1774, a response to the Tea Party.
    answer: 1
    explanation: |
      Historical situation and chronology: the Declaratory Act is the 'principle' half of the 1766 retreat.

  - slug: apush-u03-exam-q02
    type: multiple_choice
    topic_code: "3.3"
    source: "Primary source: Declaratory Act (1766), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "That the said colonies and plantations in America have been, are, and of right ought to be, subordinate unto, and dependent upon the imperial crown and parliament of Great Britain; and that the King's majesty, by and with the advice and consent of the lords spiritual and temporal, and commons of Great Britain, in parliament assembled, . . . of right ought to have, full power and authority to make laws and statutes of sufficient force and validity to bind the colonies and people of America, subjects of the crown of Great Britain, in all cases whatsoever . . ."

      — An Act for the better securing the dependency of His Majesty's dominions in America upon the crown and parliament of Great Britain (the Declaratory Act), March 1766
    prompt: |
      Colonial leaders who had protested the Stamp Act would most likely have disagreed with the act's claim because they believed that
    options:
      - "only assemblies elected by the colonists could tax them"
      - "Parliament had no authority over the colonies in any matter, including trade"
      - "the colonies should be represented in the French Estates-General"
      - "the king, not Parliament, should levy colonial taxes"
    option_explanations:
      - |
        Correct. The Stamp Act Congress had resolved that no taxes could be constitutionally imposed on the colonists except by their own legislatures. 'In all cases whatsoever' claimed exactly the power they denied.
      - |
        In 1766 most colonial leaders still accepted Parliament's authority to regulate imperial trade; the denial of all parliamentary authority came only in the mid-1770s.
      - |
        The Estates-General was a French institution with no relation to the British colonies.
      - |
        Colonists did not want the king to tax them; English constitutional tradition required consent of representatives for taxation by anyone.
    answer: 0
    explanation: |
      Point of view and claims: the dispute in 1766 was specifically over taxation and consent, not over all authority.

  - slug: apush-u03-exam-q03
    type: multiple_choice
    topic_code: "3.2"
    source: "Primary source: Declaratory Act (1766), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "That the said colonies and plantations in America have been, are, and of right ought to be, subordinate unto, and dependent upon the imperial crown and parliament of Great Britain; and that the King's majesty, by and with the advice and consent of the lords spiritual and temporal, and commons of Great Britain, in parliament assembled, . . . of right ought to have, full power and authority to make laws and statutes of sufficient force and validity to bind the colonies and people of America, subjects of the crown of Great Britain, in all cases whatsoever . . ."

      — An Act for the better securing the dependency of His Majesty's dominions in America upon the crown and parliament of Great Britain (the Declaratory Act), March 1766
    prompt: |
      The British government's determination to assert its authority over the colonies in the 1760s was most directly a result of
    options:
      - "the success of the Albany Plan of Union in uniting the colonies"
      - "the debt and expanded territory that followed the Seven Years' War"
      - "the Spanish conquest of the Ohio Valley"
      - "colonial support for France during the Seven Years' War"
    option_explanations:
      - |
        The Albany Plan was rejected by every colonial assembly and never took effect.
      - |
        Correct. Britain emerged from the war with roughly double its earlier debt and a vast new territory to garrison; ministers decided that the colonies must contribute and that imperial authority must be tightened.
      - |
        Spain never conquered the Ohio Valley; Britain gained the region from France in 1763.
      - |
        The colonists fought on the British side against France; British complaints were about colonial smuggling and slowness to contribute, not support for France.
    answer: 1
    explanation: |
      Causation (3.2 → 3.3): the war's results are the root cause of the new imperial policy.

  - slug: apush-u03-exam-q04
    type: multiple_choice
    topic_code: "3.1"
    source: "Primary source: Declaratory Act (1766), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "That the said colonies and plantations in America have been, are, and of right ought to be, subordinate unto, and dependent upon the imperial crown and parliament of Great Britain; and that the King's majesty, by and with the advice and consent of the lords spiritual and temporal, and commons of Great Britain, in parliament assembled, . . . of right ought to have, full power and authority to make laws and statutes of sufficient force and validity to bind the colonies and people of America, subjects of the crown of Great Britain, in all cases whatsoever . . ."

      — An Act for the better securing the dependency of His Majesty's dominions in America upon the crown and parliament of Great Britain (the Declaratory Act), March 1766
    prompt: |
      The conflict over authority reflected in the excerpt was intensified by the fact that before 1763
    options:
      - "colonial assemblies had become accustomed to controlling taxation and officials' salaries under a policy of loose imperial oversight"
      - "the colonies had already declared independence once, in 1754"
      - "Parliament had regularly imposed direct taxes on the colonies without protest"
      - "the colonies had been governed directly by members of Parliament living in America"
    option_explanations:
      - |
        Correct. Salutary neglect allowed assemblies to act like miniature Houses of Commons; the claim to bind them 'in all cases whatsoever' threatened powers they had exercised for generations.
      - |
        No colony declared independence in 1754; that year saw the Albany Congress and the start of war with France.
      - |
        Parliament had laid no direct taxes on the colonies before the Stamp Act of 1765, which is why the Stamp Act was seen as an innovation.
      - |
        No members of Parliament governed the colonies; royal governors and elected assemblies did.
    answer: 0
    explanation: |
      Contextualization (3.1): Period 2's habits of self-government made Period 3's assertion of authority explosive.

  - slug: apush-u03-exam-q05
    type: multiple_choice
    topic_code: "3.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following was a significant effect of the Seven Years' War on American Indians in the Great Lakes region?
    options:
      - "They gained a European ally in Spain to replace France."
      - "They were granted citizenship in the British Empire by the Treaty of Paris."
      - "They abandoned the fur trade entirely."
      - "The loss of French power led to Pontiac's War against British forts and settlers."
    option_explanations:
      - |
        Spain received Louisiana west of the Mississippi and was not a practical ally for the nations of the Great Lakes.
      - |
        The treaty made no provision for Native peoples, who were not parties to it.
      - |
        The fur trade continued, now with British traders; Native nations remained central to it.
      - |
        Correct. With France gone, British commanders ended diplomatic gifts and settlers moved west; in 1763 a coalition associated with Pontiac attacked British posts across the region.
    answer: 3
    explanation: |
      Causation (3.2): a European peace produced a Native war.

  - slug: apush-u03-exam-q06
    type: multiple_choice
    topic_code: "3.3"
    source: "general knowledge"
    points: 1
    prompt: |
      The committees of correspondence created in Massachusetts and Virginia in 1772–1773 were significant because they
    options:
      - "created networks that coordinated resistance among towns and colonies and laid the groundwork for the Continental Congress"
      - "wrote the Articles of Confederation"
      - "collected the duties imposed by the Townshend Acts"
      - "negotiated the Treaty of Paris"
    option_explanations:
      - |
        Correct. The committees spread news of British actions and coordinated responses; when the Coercive Acts came, they made the rapid organisation of the First Continental Congress possible.
      - |
        The Articles were drafted by the Second Continental Congress in 1777.
      - |
        Customs officials collected duties; the committees opposed them.
      - |
        The Treaty of Paris (1783) was negotiated by diplomats appointed by Congress: Franklin, John Adams and John Jay.
    answer: 0
    explanation: |
      3.3: organisational infrastructure is a cause of united resistance.

  - slug: apush-u03-exam-q07
    type: multiple_choice
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Review. The Atlantic trading system of the eighteenth century in which colonial products such as tobacco, rice and sugar were exchanged for manufactured goods and enslaved Africans is best described as
    options:
      - "a trade conducted mainly overland across North America"
      - "a network of exchanges linking Britain, Africa, the Caribbean and North America under mercantilist rules"
      - "a system run by the Spanish encomienda"
      - "a free-trade zone in which colonists could sell to any nation"
    option_explanations:
      - |
        The Atlantic economy depended on ocean shipping, not overland routes.
      - |
        Correct. The so-called triangular trade, governed by the Navigation Acts, tied colonial agriculture and the slave trade to British manufacturing and shipping.
      - |
        The encomienda was a Spanish system of Native labour, not the framework of British Atlantic trade.
      - |
        The Navigation Acts required many 'enumerated' goods to go to Britain; free trade was precisely what mercantilism forbade.
    answer: 1
    explanation: |
      Review of 2.4: the Atlantic economy is the background to the conflicts over trade regulation in Period 3.

  - slug: apush-u03-exam-q08
    type: multiple_choice
    topic_code: "3.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following best explains why the Coercive Acts of 1774 unified the colonies rather than isolating Massachusetts?
    options:
      - "Other colonies feared that if Parliament could alter one colony's charter and close its port, it could do the same to any colony."
      - "The acts imposed a new stamp tax on every colony."
      - "The acts ended the slave trade, angering the southern colonies."
      - "The acts were passed by the Continental Congress, which all colonies had to obey."
    option_explanations:
      - |
        Correct. The Massachusetts Government Act threatened self-government everywhere; other colonies sent supplies to Boston and delegates to Philadelphia.
      - |
        The Stamp Act had been repealed in 1766; the Coercive Acts were aimed at Massachusetts.
      - |
        The acts did not touch the slave trade, so southern anger cannot explain the unity they produced.
      - |
        The Coercive Acts were passed by Parliament; the Continental Congress was the colonial response to them.
    answer: 0
    explanation: |
      Causation: the intended effect (isolation) and the actual effect (union) diverged.

  # ---- Set 2: Common Sense (3.4, 3.6, review 2.7)
  - slug: apush-u03-exam-q09
    type: multiple_choice
    topic_code: "3.4"
    source: "Primary source: Thomas Paine, Common Sense (1776), Project Gutenberg"
    points: 1
    stimulus: |
      "Society in every state is a blessing, but government even in its best state is but a necessary evil; in its worst state an intolerable one; for when we suffer, or are exposed to the same miseries by a government, which we might expect in a country without government, our calamity is heightened by reflecting that we furnish the means by which we suffer. Government, like dress, is the badge of lost innocence; the palaces of kings are built on the ruins of the bowers of paradise."

      — Thomas Paine, Common Sense, Philadelphia, January 1776
    prompt: |
      The view of government in the excerpt is most consistent with which political idea of the Revolutionary era?
    options:
      - "Government should be limited and exists to protect people from the dangers of an unchecked state as well as from one another."
      - "A strong central government is the best guarantee of liberty."
      - "Mercantilist regulation produces national wealth."
      - "Kings are appointed by God and should be obeyed without question."
    option_explanations:
      - |
        Correct. Distrust of government power and belief in limited, consent-based government run through Locke, the radical Whigs and the Revolution, and later shape the Articles of Confederation.
      - |
        Paine calls government at best 'a necessary evil'; a strong central government was the Federalists' answer to the Articles a decade later, not Paine's position here.
      - |
        The excerpt concerns the nature of government, not trade policy.
      - |
        Paine ridicules kings ('the palaces of kings are built on the ruins of the bowers of paradise'); divine right is what he attacks.
    answer: 0
    explanation: |
      Making connections (3.4): suspicion of power is a thread from Paine to the Articles.

  - slug: apush-u03-exam-q10
    type: multiple_choice
    topic_code: "3.4"
    source: "Primary source: Thomas Paine, Common Sense (1776), Project Gutenberg"
    points: 1
    stimulus: |
      "Society in every state is a blessing, but government even in its best state is but a necessary evil; in its worst state an intolerable one; for when we suffer, or are exposed to the same miseries by a government, which we might expect in a country without government, our calamity is heightened by reflecting that we furnish the means by which we suffer. Government, like dress, is the badge of lost innocence; the palaces of kings are built on the ruins of the bowers of paradise."

      — Thomas Paine, Common Sense, Philadelphia, January 1776
    prompt: |
      Common Sense had a large impact on public opinion in 1776 mainly because it
    options:
      - "was written by George Washington"
      - "was distributed by the British army to encourage Loyalists"
      - "was an official statement of the Continental Congress"
      - "was written in plain, vivid language for ordinary readers and argued for a complete break with monarchy"
    option_explanations:
      - |
        Thomas Paine, a recent English immigrant, wrote it; it was published anonymously at first.
      - |
        It was a Patriot work urging independence; the British army had no reason to spread it.
      - |
        It was a private, initially anonymous pamphlet, not a congressional document.
      - |
        Correct. Paine avoided legal argument in favour of simple images and biblical references accessible to artisans and farmers; the pamphlet sold over 100,000 copies and was read aloud in taverns and camps.
    answer: 3
    explanation: |
      Sourcing (audience and purpose): style and audience explain the effect.

  - slug: apush-u03-exam-q11
    type: multiple_choice
    topic_code: "3.6"
    source: "Primary source: Thomas Paine, Common Sense (1776), Project Gutenberg"
    points: 1
    stimulus: |
      "Society in every state is a blessing, but government even in its best state is but a necessary evil; in its worst state an intolerable one; for when we suffer, or are exposed to the same miseries by a government, which we might expect in a country without government, our calamity is heightened by reflecting that we furnish the means by which we suffer. Government, like dress, is the badge of lost innocence; the palaces of kings are built on the ruins of the bowers of paradise."

      — Thomas Paine, Common Sense, Philadelphia, January 1776
    prompt: |
      Distrust of government power like that in the excerpt most directly influenced which feature of the first state constitutions written after 1776?
    options:
      - "The abolition of all elections"
      - "Weak governors with limited powers and strong elected legislatures"
      - "Governors appointed by the Continental Congress"
      - "Hereditary upper houses modelled on the House of Lords"
    option_explanations:
      - |
        The state constitutions rested on elections and expanded representation; they did not abolish elections.
      - |
        Correct. Having blamed royal governors and the king for tyranny, most states created executives with short terms and few powers; Pennsylvania (1776) had no single governor at all.
      - |
        Governors were chosen within each state, usually by the legislature or by voters, not by Congress.
      - |
        No state created a hereditary chamber; republicanism rejected hereditary privilege.
    answer: 1
    explanation: |
      3.6: revolutionary ideals shaped new institutions.

  - slug: apush-u03-exam-q12
    type: multiple_choice
    topic_code: "2.7"
    source: "Primary source: Thomas Paine, Common Sense (1776), Project Gutenberg"
    points: 1
    stimulus: |
      "Society in every state is a blessing, but government even in its best state is but a necessary evil; in its worst state an intolerable one; for when we suffer, or are exposed to the same miseries by a government, which we might expect in a country without government, our calamity is heightened by reflecting that we furnish the means by which we suffer. Government, like dress, is the badge of lost innocence; the palaces of kings are built on the ruins of the bowers of paradise."

      — Thomas Paine, Common Sense, Philadelphia, January 1776
    prompt: |
      Review. Paine's use of biblical imagery ('lost innocence', 'the bowers of paradise') to make a political argument would have resonated with colonial readers in part because of which earlier development?
    options:
      - "The Great Awakening, which had made religious language and itinerant persuasion familiar to ordinary colonists"
      - "The Columbian Exchange, which introduced European crops to the Americas"
      - "The Pueblo Revolt, which drove the Spanish out of New Mexico"
      - "The Half-Way Covenant, which ended Protestant worship in New England"
    option_explanations:
      - |
        Correct. Revivalists such as Whitefield had addressed mass audiences in vivid, scriptural language and encouraged them to judge authority for themselves; Paine adopted a similar persuasive style for politics.
      - |
        The Columbian Exchange concerned plants, animals and disease, not political or religious rhetoric.
      - |
        The Pueblo Revolt (1680) took place in Spanish New Mexico and had no bearing on the reading habits of British colonists.
      - |
        The Half-Way Covenant (1662) adjusted church membership rules; it did not end Protestant worship.
    answer: 0
    explanation: |
      Review of 2.7 (continuity in culture): the revival's style prepared an audience for revolutionary persuasion.

  - slug: apush-u03-exam-q13
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following was the most important consequence of the American victory at Saratoga in 1777?
    options:
      - "The formal entry of France into the war as an ally of the United States"
      - "The immediate surrender of all British forces in North America"
      - "The ratification of the Articles of Confederation"
      - "The return of Loyalist property"
    option_explanations:
      - |
        Correct. Saratoga persuaded France that the Americans could win; the alliance of February 1778 brought money, troops and a navy that proved decisive at Yorktown.
      - |
        The war continued for four more years, including the British southern campaign.
      - |
        The Articles were not ratified until 1781, and Saratoga did not cause their ratification.
      - |
        Loyalist property was addressed (weakly) in the Treaty of Paris of 1783, not after Saratoga.
    answer: 0
    explanation: |
      Causation (3.5): Saratoga is a diplomatic turning point.

  - slug: apush-u03-exam-q14
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Enslaved African Americans during the Revolutionary War most often
    options:
      - "sought freedom by whatever means the war offered, including escaping to British lines or enlisting with either army"
      - "were uniformly loyal to their Patriot owners"
      - "were freed by the Declaration of Independence"
      - "were barred by both sides from any military role"
    option_explanations:
      - |
        Correct. Thousands answered Dunmore's and later British offers of freedom, while others, especially in the North, served in Patriot units in exchange for freedom. Their choices depended on which side offered liberty.
      - |
        Tens of thousands fled to the British, and many seized the disruption of war to escape; there was no uniform loyalty to owners.
      - |
        The Declaration freed no one; slavery remained legal in every state in 1776.
      - |
        Both sides used Black soldiers and labourers; Dunmore's Ethiopian Regiment and Rhode Island's Black regiment are examples.
    answer: 0
    explanation: |
      Multiple perspectives (3.5): enslaved people acted on their own interest in liberty.

  - slug: apush-u03-exam-q15
    type: multiple_choice
    topic_code: "3.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following best describes the effect of revolutionary ideals on the status of women in the period 1776–1800?
    options:
      - "Women's legal status changed little, but new ideas about their civic role encouraged greater education for girls."
      - "Coverture laws were abolished, allowing married women to own property."
      - "Women were barred from all public activities, including boycotts."
      - "Women gained full voting rights in all states."
    option_explanations:
      - |
        Correct. Republican Motherhood gave women a role in nurturing virtuous citizens and justified female academies, but it did not grant political rights.
      - |
        Coverture continued well into the nineteenth century; married women generally could not own property in their own names.
      - |
        Women were central to boycotts and continued public roles in churches, charities and writing.
      - |
        Only New Jersey allowed some propertied women to vote, between 1776 and 1807; no other state did.
    answer: 0
    explanation: |
      Continuity and change (3.6): ideals produced new roles but not new rights.

  - slug: apush-u03-exam-q16
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Review. The Spanish colonial system of the sixteenth century differed from British colonization in North America in the eighteenth century chiefly in that the Spanish
    options:
      - "avoided any intermarriage with Native peoples"
      - "relied on large-scale coerced Native labour and created a hierarchical caste system, while the British relied increasingly on enslaved Africans and family farms and largely excluded Native peoples from their settlements"
      - "never used African slavery"
      - "established elected assemblies in every colony"
    option_explanations:
      - |
        Intermarriage was common in Spanish America, producing the mestizo population at the centre of the casta system.
      - |
        Correct. Spain built its empire on the encomienda, repartimiento and a racial caste system (the casta system), incorporating Native people as labourers; British colonists generally sought Native land rather than Native labour.
      - |
        Spain imported large numbers of enslaved Africans, especially to the Caribbean and parts of South America.
      - |
        Spanish America was governed by royal officials such as viceroys; elected assemblies were a British feature.
    answer: 1
    explanation: |
      Review of 1.4–1.5 (comparison of colonial systems).

  # ---- Set 3: the Treaty of Paris, 1783 (3.5, 3.7, 3.12)
  - slug: apush-u03-exam-q17
    type: multiple_choice
    topic_code: "3.5"
    source: "Primary source: Treaty of Paris (1783), Articles 1 and 2, National Archives, Milestone Documents"
    points: 1
    stimulus: |
      "His Britannic Majesty acknowledges the said United States, viz., New Hampshire, Massachusetts Bay, Rhode Island and Providence Plantations, Connecticut, New York, New Jersey, Pennsylvania, Delaware, Maryland, Virginia, North Carolina, South Carolina and Georgia, to be free sovereign and Independent States . . .

      [The western boundary runs] . . . Thence by a Line to be drawn along the Middle of the said river Mississippi . . ."

      — Definitive Treaty of Peace between the United States and Great Britain, Articles 1 and 2, signed at Paris, September 3, 1783 (bracketed words added)
    prompt: |
      The boundaries established in the treaty were most significant because they
    options:
      - "returned Florida to Britain"
      - "doubled the territory of the United States by including the land between the Appalachians and the Mississippi"
      - "guaranteed the land rights of American Indians west of the Appalachians"
      - "gave the United States control of Canada"
    option_explanations:
      - |
        Britain returned Florida to Spain, not to itself, in the separate settlement of 1783.
      - |
        Correct. The new nation's claims ran west to the Mississippi, roughly doubling the area of the original colonies and creating the national domain that the Confederation organised in 1785 and 1787.
      - |
        The treaty did not mention American Indians at all, though they occupied most of the ceded region.
      - |
        Canada remained British; the northern border followed the Great Lakes.
    answer: 1
    explanation: |
      3.5: the peace terms set up the western questions of the next two decades.

  - slug: apush-u03-exam-q18
    type: multiple_choice
    topic_code: "3.7"
    source: "Primary source: Treaty of Paris (1783), Articles 1 and 2, National Archives, Milestone Documents"
    points: 1
    stimulus: |
      "His Britannic Majesty acknowledges the said United States, viz., New Hampshire, Massachusetts Bay, Rhode Island and Providence Plantations, Connecticut, New York, New Jersey, Pennsylvania, Delaware, Maryland, Virginia, North Carolina, South Carolina and Georgia, to be free sovereign and Independent States . . .

      [The western boundary runs] . . . Thence by a Line to be drawn along the Middle of the said river Mississippi . . ."

      — Definitive Treaty of Peace between the United States and Great Britain, Articles 1 and 2, signed at Paris, September 3, 1783 (bracketed words added)
    prompt: |
      The Confederation Congress's most lasting response to the territorial gains described in the excerpt was
    options:
      - "the Louisiana Purchase"
      - "the Land Ordinance of 1785 and the Northwest Ordinance of 1787"
      - "the Proclamation of 1763"
      - "the Compromise of 1790"
    option_explanations:
      - |
        The Louisiana Purchase (1803) acquired land west of the Mississippi, under the Constitution.
      - |
        Correct. The ordinances surveyed the Northwest into townships, set aside land for schools, created territorial government and a path to equal statehood, and banned slavery north of the Ohio.
      - |
        The Proclamation of 1763 was a British royal act, issued twenty years earlier.
      - |
        The Compromise of 1790 concerned assumption of state debts and the location of the capital.
    answer: 1
    explanation: |
      Causation (3.5 → 3.7): new territory demanded new policy.

  - slug: apush-u03-exam-q19
    type: multiple_choice
    topic_code: "3.12"
    source: "Primary source: Treaty of Paris (1783), Articles 1 and 2, National Archives, Milestone Documents"
    points: 1
    stimulus: |
      "His Britannic Majesty acknowledges the said United States, viz., New Hampshire, Massachusetts Bay, Rhode Island and Providence Plantations, Connecticut, New York, New Jersey, Pennsylvania, Delaware, Maryland, Virginia, North Carolina, South Carolina and Georgia, to be free sovereign and Independent States . . .

      [The western boundary runs] . . . Thence by a Line to be drawn along the Middle of the said river Mississippi . . ."

      — Definitive Treaty of Peace between the United States and Great Britain, Articles 1 and 2, signed at Paris, September 3, 1783 (bracketed words added)
    prompt: |
      Which of the following developments of the 1790s most directly resulted from the fact that the Native nations living between the Appalachians and the Mississippi had not agreed to the treaty's terms?
    options:
      - "The XYZ Affair"
      - "The Neutrality Proclamation"
      - "The Whiskey Rebellion"
      - "The Northwest Indian War, ending in the Battle of Fallen Timbers and the Treaty of Greenville"
