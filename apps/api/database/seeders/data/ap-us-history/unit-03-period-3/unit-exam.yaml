  - slug: apush-u03-exam-q43
    type: short_answer
    topic_code: "3.8"
    source: "Interpretation written for this course, in the tradition of the Progressive (economic) interpretation of the Constitution"
    points: 3
    stimulus: |
      Interpretation (written for this course, in the tradition associated with the Progressive historians' economic interpretation of the Constitution):

      "The Constitution is best understood as the work of men of property who feared that state legislatures, responding to indebted farmers, would undermine contracts and the value of public securities. By creating a national government able to tax, pay its debts in full and forbid the states to issue paper money, the framers protected the interests of creditors and merchants against popular majorities."
    prompt: |
      Using the excerpt, answer (a), (b) and (c).

      (a) Briefly describe the author's argument about the motives behind the Constitution.

      (b) Briefly explain ONE specific historical development from 1781 to 1791 that supports the author's argument.

      (c) Briefly explain ONE specific historical development from 1781 to 1791 that challenges the author's argument.
    answer: |
      (a) The author argues that the framers were driven mainly by economic self-interest as property holders and creditors, designing a government to protect property and contracts from democratic majorities in the states.

      (b) Shays' Rebellion (1786–1787), in which indebted farmers closed courts to stop foreclosures, alarmed creditors and helped bring about the convention; the Constitution then barred states from issuing paper money or impairing contracts, and Hamilton's funding plan (1790) paid public securities at full value, rewarding the creditors and speculators who held them.

      (c) The framers also responded to non-economic problems such as the Confederation's inability to conduct foreign policy or defend the frontier, and they built in protections for liberty; the ratification debate led to the Bill of Rights (1791), and Madison, a leading framer, opposed paying speculators at full value in 1790. Some supporters of the Constitution, such as urban artisans, were not wealthy creditors.
    explanation: |
      Three points, one per part.

      (a) 1 pt for describing the argument: the Constitution reflected the economic interests of property holders and creditors, protecting property against popular majorities. Zero for 'the Constitution created a stronger government' without the claim about motives.

      (b) 1 pt for a supporting development, explained: Shays' Rebellion; state paper-money and debt-relief laws; Article I, Section 10 (no state paper money, no impairing contracts); the taxing power and funding of the debt; Hamilton's funding and assumption; the wealth and creditor status of many delegates.

      (c) 1 pt for a challenging development, explained: foreign-policy and defence weaknesses (British forts, the Mississippi, Barbary pirates); the convention's compromises over representation and slavery reflecting sectional rather than class interests; the Bill of Rights; Madison's opposition to discrimination in favour of speculators; broad support for ratification among artisans and some small farmers; opposition to the Constitution by some wealthy Anti-Federalists such as George Mason.

      Skills: analysing a secondary source; claims and evidence. Development must fall within 1781–1791.

  - slug: apush-u03-exam-q44
    type: short_answer
    topic_code: "3.3"
    source: "Paul Revere, 'The Bloody Massacre perpetrated in King Street', engraving, Boston, 1770 (described; original in the Library of Congress and other collections)"
    points: 3
    stimulus: |
      Non-text source (described): an engraving published in Boston by Paul Revere in March 1770, a few weeks after British soldiers fired into a crowd on King Street on March 5. The print shows a straight line of red-coated soldiers firing in unison on the order of an officer with a raised sword, at a small group of well-dressed, unarmed townspeople. Several victims lie bleeding in the street. A building behind the soldiers is labelled 'Butcher's Hall'. Verses beneath the image mourn the dead and condemn the soldiers. The print was widely sold and copied.
    prompt: |
      Using the source, answer (a), (b) and (c).

      (a) Briefly describe ONE way the engraving represents the events of March 5, 1770.

      (b) Briefly explain ONE purpose the engraving was intended to serve.

      (c) Briefly explain ONE way the events of 1770 to 1774 led to increased colonial resistance to British policies.
    answer: |
      (a) The engraving shows the soldiers as an organised firing squad deliberately shooting on command into a peaceful, respectable crowd, and labels the customs house 'Butcher's Hall', presenting the event as cold-blooded murder.

      (b) Revere, a Boston silversmith and Son of Liberty, intended to rouse anger against the soldiers stationed in Boston since 1768 and against British policy, and to win sympathy beyond Massachusetts. It was propaganda that omitted the crowd's taunting of the soldiers and its throwing of snowballs and objects, and did not show that victims included working men such as Crispus Attucks.

      (c) After the Tea Act of 1773, Bostonians destroyed the East India Company's tea, and Parliament responded in 1774 with the Coercive Acts closing Boston's port and curtailing self-government. Other colonies saw a threat to all, sent delegates to the First Continental Congress, and adopted a coordinated boycott (the Continental Association).
    explanation: |
      Three points, one per part.

      (a) 1 pt for describing how the image represents the event: soldiers firing in an orderly line on command; unarmed and respectable victims; the 'Butcher's Hall' label; blood and the dead; a one-sided view. Must refer to features of the image.

      (b) 1 pt for explaining purpose: propaganda to inflame opinion against British troops and policy; to win support for the Patriot cause or for removing troops; to influence how the event was remembered or the soldiers' trial. Accept explanation that it distorted the event (omitting the crowd's provocation).

      (c) 1 pt for an explained development 1770–1774: committees of correspondence (1772); the Gaspée affair (1772); the Tea Act and Boston Tea Party (1773); the Coercive Acts and Quebec Act (1774); the First Continental Congress and Continental Association (1774). Must explain how it increased resistance.

      Skills: sourcing (purpose, point of view) of a visual source; causation.

  - slug: apush-u03-exam-q45
    type: long_answer
    topic_code: "3.6"
    source: "Primary sources: Abigail Adams to John Adams (1776), Founders Online; Northwest Ordinance (1787), National Archives; U.S. Constitution (1787), National Archives; Washington to the Hebrew Congregation in Newport (1790), Founders Online; Banneker to Jefferson (1791), Founders Online; Crèvecoeur, Letters from an American Farmer (1782), Project Gutenberg; Treaty of Greenville (1795), Avalon Project"
    points: 7
    stimulus: |
      Document 1
      Source: Abigail Adams, letter to her husband John Adams, a delegate to the Continental Congress, March 31, 1776.
      "I desire you would Remember the Ladies, and be more generous and favourable to them than your ancestors. Do not put such unlimited power into the hands of the Husbands. Remember all Men would be tyrants if they could."

      Document 2
      Source: J. Hector St. John de Crèvecoeur, a French-born farmer in New York, Letters from an American Farmer, published in London, 1782.
      "What then is the American, this new man? He is either an European, or the descendant of an European, hence that strange mixture of blood, which you will find in no other country. . . . Here individuals of all nations are melted into a new race of men, whose labours and posterity will one day cause great changes in the world."

      Document 3
      Source: Northwest Ordinance, Article 6, adopted by the Confederation Congress, July 13, 1787.
      "There shall be neither slavery nor involuntary servitude in the said territory, otherwise than in the punishment of crimes whereof the party shall have been duly convicted . . ."

      Document 4
      Source: Constitution of the United States, Article I, Section 2, 1787.
      "Representatives and direct Taxes shall be apportioned among the several States . . . according to their respective Numbers, which shall be determined by adding to the whole Number of free Persons, including those bound to Service for a Term of Years, and excluding Indians not taxed, three fifths of all other Persons."
    prompt: |
      Document 5
      Source: President George Washington, letter to the Hebrew Congregation in Newport, Rhode Island, August 18, 1790.
      "It is now no more that toleration is spoken of, as if it was by the indulgence of one class of people, that another enjoyed the exercise of their inherent natural rights. For happily the Government of the United States, which gives to bigotry no sanction, to persecution no assistance requires only that they who live under its protection should demean themselves as good citizens, in giving it on all occasions their effectual support."

      Document 6
      Source: Benjamin Banneker, a free Black mathematician and almanac-maker from Maryland, letter to Secretary of State Thomas Jefferson, August 19, 1791.
      "Sir how pitiable is it to reflect, that altho you were so fully convinced of the benevolence of the Father of mankind, and of his equal and impartial distribution of those rights and privileges which he had conferred upon them, that you should at the Same time counteract his mercies, in detaining by fraud and violence so numerous a part of my brethren under groaning captivity and cruel oppression . . ."

      Document 7
      Source: Treaty of Greenville, Article I, between the United States and the Wyandot, Delaware, Shawnee, Miami and other nations, August 3, 1795. (In Article III the nations ceded most of present-day Ohio.)
      "Henceforth all hostilities shall cease; peace is hereby established, and shall be perpetual; and a friendly intercourse shall take place between the said United States and Indian tribes."

      Document-based question. Suggested reading time 15 minutes; writing time 45 minutes.

      Evaluate the extent to which the American Revolution changed American society in the period from 1775 to 1800.

      In your response you should do the following.
      - Respond to the prompt with a historically defensible thesis or claim that establishes a line of reasoning.
      - Describe a broader historical context relevant to the prompt.
      - Support an argument in response to the prompt using at least four documents.
      - Use at least one additional piece of specific historical evidence (beyond that found in the documents) relevant to an argument about the prompt.
      - For at least two documents, explain how or why the document's point of view, purpose, historical situation, and/or audience is relevant to an argument.
      - Use evidence to support, qualify, or modify an argument that addresses the prompt.
    answer: |
      Thesis: The Revolution changed American society by putting natural rights and consent at the centre of public life, which produced real gains in religious liberty and began the end of slavery in the North; but for most women, enslaved people in the South and American Indians, the period brought continuity or even loss, so the change was significant in principle but limited in practice.

      Context: Before 1775 colonial society was hierarchical: established churches in most colonies, slavery legal everywhere, property qualifications for voting, coverture for women, and a frontier where Native nations played the French and British against each other. The imperial crisis of 1763–1776 spread the language of natural rights and consent.

      Body 1 (real change in principle and religion): Doc 5 (Washington's letter, written as president to a Jewish congregation, to reassure a minority of its place) describes rights as inherent, not tolerated; outside evidence: the Virginia Statute for Religious Freedom (1786) and the First Amendment. Doc 2 presents a new, mixed American identity (sourcing: written for European readers to promote opportunity).

      Body 2 (slavery: change and continuity): Doc 3 bans slavery north of the Ohio; northern gradual emancipation (Pennsylvania 1780) is further change. But Doc 4 protects slaveholders' power, and Doc 6 (Banneker, using the Declaration's own principles to address its author) shows that Black Americans saw the gap; the cotton gin (1793) expanded slavery.

      Body 3 (limits): Doc 1 shows women applying revolutionary ideals without legal result; Republican Motherhood gave a civic role but not rights. Doc 7 shows Native nations losing land despite promises of perpetual peace.

      Conclusion: The Revolution transformed the principles of American society more than its structure.
    explanation: |
      Scored on the DBQ rubric (7 points).

      Thesis/claim (0–1): 1 pt for a defensible thesis that establishes a line of reasoning about the extent of change (e.g. changed principles and religion, began northern emancipation, but left women's status, southern slavery and Native dispossession largely unchanged or worse). Must be in the introduction or conclusion. Zero for restating the prompt or a claim with no reasoning.

      Contextualization (0–1): 1 pt for describing the broader context: colonial social hierarchy before 1775 (established churches, slavery, coverture, deference to elites); the imperial crisis and the spread of natural-rights ideas; the Enlightenment and the Great Awakening; the war itself. Must be more than a phrase and must connect to the argument.

      Evidence from the documents (0–2): 1 pt for accurately describing the content of at least three documents in relation to the topic. 2 pts for using at least four documents to support an argument (not merely quoting or summarising).

      Evidence beyond the documents (0–1): 1 pt for one specific, relevant piece of evidence not in the documents, used in an argument. Examples: Pennsylvania's Gradual Abolition Act (1780); the Quock Walker cases; Virginia's manumission law (1782); the Virginia Statute for Religious Freedom (1786); the Bill of Rights; New Jersey women's voting (1776–1807); Republican Motherhood; Richard Allen and the AME church; the cotton gin (1793); Joseph Brant; Fallen Timbers (1794); the slave trade clause; property qualifications for voting; Shays' Rebellion. Must be different from evidence used to earn contextualization.

      Analysis and reasoning (0–2):
      - Sourcing, 1 pt: for at least two documents, explain how point of view, purpose, historical situation or audience is relevant to the argument. For example: Doc 1 is a private letter to a lawmaker, so it shows aspiration rather than law; Doc 2 was written for European readers to promote America; Doc 5 is the president reassuring a religious minority, giving official weight to religious liberty; Doc 6 turns Jefferson's own words against him; Doc 7 is a treaty written after a military defeat, so 'perpetual' peace reflects the victors' terms.
      - Complexity, 1 pt: demonstrate a complex understanding through sophisticated argumentation or effective use of evidence, e.g. explaining both change and continuity; distinguishing regions (North vs South) or groups; showing how revolutionary ideals were used by excluded groups even when they failed; connecting to later developments (abolitionism, Seneca Falls, Indian Removal); corroborating or qualifying with multiple documents. It must be part of the argument, not a single sentence.

      Common errors: treating the Revolution as either wholly transformative or wholly conservative; summarising documents in order without an argument; sourcing that only restates the citation ('Washington was the president').
