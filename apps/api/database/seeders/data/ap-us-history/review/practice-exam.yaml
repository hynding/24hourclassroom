        Correct. The Slaughterhouse Cases (1873) and the Civil Rights Cases (1883) shrank the amendment's protections, and Plessy (1896) upheld segregation, while Northern withdrawal after 1877 left Southern states free to deny Black rights.
      - |
        Constitutional amendments cannot be repealed by a political deal. The Compromise of 1877 withdrew federal troops; the amendment stayed in the Constitution.
      - |
        The Fifteenth Amendment (1870) extended Reconstruction's protections to voting. It was later evaded too, but its ratification did not limit the Fourteenth.
      - |
        The Freedmen's Bureau was wound down by 1872; it did not become permanent.
    answer: 0
    explanation: |
      Continuity and change. The amendment's words stayed the same; what changed was how courts read them and whether the federal government enforced them.

