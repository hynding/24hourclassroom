      Unemployment in the United States, percent of the civilian labor force (rounded)

      | Year | 1929 | 1931 | 1933 | 1935 | 1937 | 1938 | 1940 | 1941 | 1942 | 1944 |
      |---|---|---|---|---|---|---|---|---|---|---|
      | Unemployed (%) | 3 | 16 | 25 | 20 | 14 | 19 | 15 | 10 | 5 | 1 |

      Source: U.S. Bureau of the Census, Historical Statistics of the United States, Colonial Times to 1970, series D 86. These estimates count workers on federal emergency relief jobs as unemployed.
    prompt: |
      Which claim about the New Deal is best supported by the data from 1933 to 1938?
    options:
      - "Unemployment fell substantially under the New Deal but stayed high, and it rose again in 1938 after federal spending was cut back."
      - "New Deal programs ended mass unemployment by 1935."
      - "Unemployment rose steadily throughout Franklin Roosevelt's first two terms."
      - "The New Deal had no relationship to the level of unemployment."
    option_explanations:
      - |
        Correct. Recovery was real but incomplete. When Roosevelt cut spending to balance the budget in 1937, the economy slumped again (the Roosevelt recession), which many economists read as evidence that federal spending had been driving recovery.
      - |
        Unemployment was still 20% in 1935; mass unemployment persisted throughout the decade.
      - |
        The figures fall from 25% to 14% between 1933 and 1937 before rising in 1938; the trend is not a steady rise.
      - |
        The timing of the 1937-1938 slump, right after spending cuts, suggests a relationship; the claim of no relationship ignores the data.
    answer: 0
    explanation: |
      Argumentation with data. Make a claim that fits every number in the range, including the 1938 reversal; avoid absolutes like ended or no relationship.

