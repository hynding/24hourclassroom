    topic_code: "4.2"
    source: "Primary source: Andrew Jackson, Veto Message on the Bank Recharter Bill (July 10, 1832), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. In the full enjoyment of the gifts of Heaven and the fruits of superior industry, economy, and virtue, every man is equally entitled to protection by law; but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society-the farmers, mechanics, and laborers-who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

      — President Andrew Jackson, message to the Senate, July 10, 1832
    prompt: |
      The ideas in the excerpt most closely resemble the arguments made in the 1790s by
    options:
      - "Alexander Hamilton in defense of a national bank and federal assumption of state debts."
      - "Thomas Jefferson and his followers, who opposed the first Bank of the United States as favoring creditors and merchants."
      - "John Jay in defending the treaty he negotiated with Britain."
      - "Federalists who supported the Alien and Sedition Acts."
    option_explanations:
      - |
        Hamilton's program is what Jackson's argument opposes: a bank tying wealthy investors to the national government.
      - |
        Correct. Jefferson argued that the first Bank was unconstitutional and served speculators at the expense of farmers. Jackson's Democrats saw themselves as heirs of that agrarian, strict-construction tradition.
      - |
