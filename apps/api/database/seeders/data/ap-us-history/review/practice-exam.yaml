      - "Northern states refused to admit Maine to the Union."
      - "Southern states rejected the compromise and seceded in 1821."
      - "The line applied only to the Louisiana Purchase, so later acquisitions such as Texas and the Mexican Cession reopened the question of slavery's expansion."
    option_explanations:
      - |
        The Court did not rule on the compromise line until Dred Scott v. Sandford in 1857, thirty-seven years later.
      - |
        Maine was admitted as a free state in 1820, as the compromise provided.
      - |
        No state seceded until South Carolina did in December 1860. The compromise held for over three decades.
