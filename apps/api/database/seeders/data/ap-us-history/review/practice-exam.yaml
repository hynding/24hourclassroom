  # ---- Set O: primary source, Reagan's First Inaugural Address (9.2, 9.4, 9.3)
  - slug: apush-review-practice-q53
    type: multiple_choice
    topic_code: "9.2"
    source: "Primary source: Ronald Reagan, Inaugural Address (January 20, 1981), The American Presidency Project, UC Santa Barbara"
    points: 1
    stimulus: |
      "In this present crisis, government is not the solution to our problem; government is the problem. From time to time we've been tempted to believe that society has become too complex to be managed by self-rule, that government by an elite group is superior to government for, by, and of the people. ... It is my intention to curb the size and influence of the Federal establishment and to demand recognition of the distinction between the powers granted to the Federal Government and those reserved to the States or to the people. All of us need to be reminded that the Federal Government did not create the States; the States created the Federal Government."

      — President Ronald Reagan, Inaugural Address, January 20, 1981
    prompt: |
      The ideas in the excerpt most directly reflect which development of the 1970s and 1980s?
    options:
      - "The rise of the New Left's demand for participatory democracy."
      - "Broad public support for expanding the Great Society."
      - "The decline of evangelical Christians' involvement in politics."
      - "The growth of a conservative movement that called for lower taxes, deregulation and a smaller federal role in domestic life."
    option_explanations:
      - |
        The New Left of the 1960s criticized institutions from the left and pressed for more equality, not for a smaller federal government on states' rights grounds.
      - |
        Reagan's election reflected growing skepticism of Great Society programs, not support for expanding them.
      - |
        Evangelical involvement in politics grew in this period through groups such as the Moral Majority, founded in 1979.
      - |
        Correct. Reacting to inflation, high taxes, the expansion of federal programs and social changes of the 1960s, a coalition of economic conservatives, the religious right and anti-communists made limited government a winning platform in 1980.
    answer: 3
    explanation: |
      Contextualization. Reagan's words sum up the conservative resurgence that defines the start of Period 9.

  - slug: apush-review-practice-q54
    type: multiple_choice
    topic_code: "9.4"
    source: "Primary source: Ronald Reagan, Inaugural Address (January 20, 1981), The American Presidency Project, UC Santa Barbara"
    points: 1
    stimulus: |
      "In this present crisis, government is not the solution to our problem; government is the problem. From time to time we've been tempted to believe that society has become too complex to be managed by self-rule, that government by an elite group is superior to government for, by, and of the people. ... It is my intention to curb the size and influence of the Federal establishment and to demand recognition of the distinction between the powers granted to the Federal Government and those reserved to the States or to the people. All of us need to be reminded that the Federal Government did not create the States; the States created the Federal Government."

      — President Ronald Reagan, Inaugural Address, January 20, 1981
    prompt: |
      A historian evaluating how far the goals in the excerpt were achieved in the 1980s would most likely point out that
    options:
      - "income tax rates were cut sharply and some industries were deregulated, but federal spending and deficits grew as defense spending rose and major entitlement programs remained."
      - "the size of the federal workforce fell to its level of the 1920s."
      - "Social Security and Medicare were eliminated."
      - "the federal government was abolished in most areas of domestic policy."
    option_explanations:
      - |
        Correct. The 1981 tax act cut top rates sharply and deregulation continued, but a large military buildup and popular entitlements meant spending did not shrink, and the national debt roughly tripled during the decade. Supporters and critics still debate the balance.
      - |
        Federal civilian employment stayed broadly level in the 1980s; it did not return to 1920s levels.
      - |
        Both programs survived; a 1983 bipartisan reform raised payroll taxes to keep Social Security solvent.
      - |
        The federal government kept its domestic role; Reagan reduced the growth of some programs but did not abolish them.
    answer: 0
    explanation: |
      Argumentation: evaluate the extent. A strong answer weighs what changed against what stayed the same instead of choosing an absolute.

