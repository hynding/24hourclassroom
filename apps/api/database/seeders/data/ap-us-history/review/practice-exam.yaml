  # ---- Set N: primary source, Brown v. Board of Education (8.6, 8.10, 8.11, 8.9)
  - slug: apush-review-practice-q49
    type: multiple_choice
    topic_code: "8.6"
    source: "Primary source: Brown v. Board of Education of Topeka, 347 U.S. 483 (1954), Justia U.S. Supreme Court"
    points: 1
    stimulus: |
      "Today, education is perhaps the most important function of state and local governments. ... To separate them from others of similar age and qualifications solely because of their race generates a feeling of inferiority as to their status in the community that may affect their hearts and minds in a way unlikely ever to be undone. ... We conclude that, in the field of public education, the doctrine of "separate but equal" has no place. Separate educational facilities are inherently unequal."

      — Chief Justice Earl Warren, opinion of a unanimous Supreme Court, Brown v. Board of Education of Topeka, May 17, 1954
    prompt: |
      The decision most directly reversed the principle established in which earlier case?
    options:
      - "Schenck v. United States (1919)."
      - "Plessy v. Ferguson (1896)."
      - "Marbury v. Madison (1803)."
      - "Korematsu v. United States (1944)."
    option_explanations:
      - |
        Schenck concerned free speech in wartime (the clear and present danger test), not segregation.
      - |
        Correct. Plessy upheld state-mandated segregation under the separate-but-equal doctrine. The NAACP's legal campaign, led by Thurgood Marshall, chipped away at it for two decades before Brown rejected it in public education.
      - |
        Marbury established judicial review, the power the Court used in Brown. It was not overturned.
      - |
        Korematsu upheld Japanese American internment during the war. Brown did not address it.
    answer: 1
    explanation: |
      Continuity and change. Brown reversed Plessy's reading of the Fourteenth Amendment's equal protection clause; know both ends of the arc.

  - slug: apush-review-practice-q50
    type: multiple_choice
    topic_code: "8.10"
    source: "Primary source: Brown v. Board of Education of Topeka, 347 U.S. 483 (1954), Justia U.S. Supreme Court"
    points: 1
    stimulus: |
      "Today, education is perhaps the most important function of state and local governments. ... To separate them from others of similar age and qualifications solely because of their race generates a feeling of inferiority as to their status in the community that may affect their hearts and minds in a way unlikely ever to be undone. ... We conclude that, in the field of public education, the doctrine of "separate but equal" has no place. Separate educational facilities are inherently unequal."

      — Chief Justice Earl Warren, opinion of a unanimous Supreme Court, Brown v. Board of Education of Topeka, May 17, 1954
    prompt: |
      The slow pace of school desegregation after the decision most directly contributed to which development in the 1960s?
    options:
      - "The decision of civil rights organizations to abandon all court cases."
      - "Growing use of nonviolent direct action, such as sit-ins and Freedom Rides, and pressure on Congress for civil rights legislation."
      - "The end of the civil rights movement by 1960."
      - "The Supreme Court's reversal of Brown in 1964."
    option_explanations:
      - |
        The NAACP continued to litigate; legal action and direct action worked alongside each other.
      - |
        Correct. Massive resistance in the South showed that court rulings alone would not end segregation. Activists turned to sit-ins, Freedom Rides and marches, and the Civil Rights Act of 1964 gave the federal government tools, including withholding school funds, to enforce desegregation.
      - |
        The movement grew rather than ended in the 1960s, from the Greensboro sit-ins in 1960 to the Selma campaign of 1965.
      - |
        Brown was never reversed. The Court later pressed for faster desegregation, as in Green v. County School Board (1968).
    answer: 1
    explanation: |
      Causation. The gap between a ruling and its enforcement explains a shift in strategy, which is a causation chain from the 1950s into the 1960s.

