  # ---- Set M: primary source, the Truman Doctrine (8.2, 8.3, 8.8, 8.7)
  - slug: apush-review-practice-q45
    type: multiple_choice
    topic_code: "8.2"
    source: "Primary source: Harry S. Truman, Address Before a Joint Session of Congress (March 12, 1947), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "At the present moment in world history nearly every nation must choose between alternative ways of life. ... One way of life is based upon the will of the majority, and is distinguished by free institutions, representative government, free elections, guarantees of individual liberty, freedom of speech and religion, and freedom from political oppression. The second way of life is based upon the will of a minority forcibly imposed upon the majority. It relies upon terror and oppression, a controlled press and radio; fixed elections, and the suppression of personal freedoms. I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures. ... The seeds of totalitarian regimes are nurtured by misery and want. They spread and grow in the evil soil of poverty and strife."

      — President Harry S. Truman, address to a joint session of Congress requesting aid for Greece and Turkey, March 12, 1947
    prompt: |
      The excerpt most directly reflects which new direction in American foreign policy?
    options:
      - "A decision to roll back Soviet control of Eastern Europe by military invasion."
      - "The transfer of responsibility for Greece and Turkey to the United Nations."
      - "The policy of containing the spread of communism by supporting governments threatened by Soviet pressure or communist insurgents."
      - "A return to the neutrality laws of the 1930s."
    option_explanations:
      - |
        Containment aimed to stop further expansion, not to roll back existing Soviet control by force; the United States did not intervene in Eastern Europe.
      - |
        Truman asked Congress for direct American aid because Britain could no longer support Greece and Turkey; he did not hand the problem to the United Nations.
      - |
        Correct. Building on George Kennan's analysis, the Truman Doctrine committed the United States to containing communist expansion, beginning with $400 million in aid for Greece and Turkey.
      - |
        The neutrality acts tried to keep the United States out of foreign wars; Truman asked Congress to commit American aid to a conflict abroad, the opposite of neutrality.
    answer: 2
    explanation: |
      Contextualization. The Truman Doctrine (1947) is the starting point of containment, the policy that frames the whole Cold War in Period 8.

  - slug: apush-review-practice-q46
    type: multiple_choice
    topic_code: "8.3"
    source: "Primary source: Harry S. Truman, Address Before a Joint Session of Congress (March 12, 1947), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "At the present moment in world history nearly every nation must choose between alternative ways of life. ... One way of life is based upon the will of the majority, and is distinguished by free institutions, representative government, free elections, guarantees of individual liberty, freedom of speech and religion, and freedom from political oppression. The second way of life is based upon the will of a minority forcibly imposed upon the majority. It relies upon terror and oppression, a controlled press and radio; fixed elections, and the suppression of personal freedoms. I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures. ... The seeds of totalitarian regimes are nurtured by misery and want. They spread and grow in the evil soil of poverty and strife."

      — President Harry S. Truman, address to a joint session of Congress requesting aid for Greece and Turkey, March 12, 1947
    prompt: |
      The division of the world into two opposed ways of life, as in the excerpt, most directly contributed to which domestic development?
    options:
      - "Efforts to root out suspected communists at home, including federal loyalty reviews and the investigations of the House Un-American Activities Committee."
      - "The repeal of the Taft-Hartley Act."
      - "The end of the draft immediately after the Second World War."
      - "A sharp decline in military spending in the early 1950s."
    option_explanations:
      - |
        Correct. Days after this speech Truman created a loyalty program for federal employees, and HUAC, the Hollywood blacklist, the Rosenberg trial and McCarthy's accusations followed as fear of internal subversion grew.
      - |
        Taft-Hartley (1947) restricted unions, partly by requiring union officers to swear they were not communists. It was not repealed.
      - |
        The draft lapsed briefly in 1947 but was restored in 1948 because of Cold War tensions.
      - |
        Military spending rose sharply after the Korean War began in 1950 and remained high under NSC-68's recommendations.
    answer: 0
    explanation: |
      Causation: foreign policy and domestic consequences. The Cold War's framing of a global struggle helped produce the Second Red Scare at home.

  - slug: apush-review-practice-q47
    type: multiple_choice
    topic_code: "8.8"
    source: "Primary source: Harry S. Truman, Address Before a Joint Session of Congress (March 12, 1947), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "At the present moment in world history nearly every nation must choose between alternative ways of life. ... One way of life is based upon the will of the majority, and is distinguished by free institutions, representative government, free elections, guarantees of individual liberty, freedom of speech and religion, and freedom from political oppression. The second way of life is based upon the will of a minority forcibly imposed upon the majority. It relies upon terror and oppression, a controlled press and radio; fixed elections, and the suppression of personal freedoms. I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures. ... The seeds of totalitarian regimes are nurtured by misery and want. They spread and grow in the evil soil of poverty and strife."

      — President Harry S. Truman, address to a joint session of Congress requesting aid for Greece and Turkey, March 12, 1947
    prompt: |
      The principle Truman announced was later used most directly to justify which of the following?
    options:
      - "American military involvement in Vietnam to prevent a communist victory in Southeast Asia."
      - "The Good Neighbor Policy toward Latin America."
      - "The withdrawal of American forces from Europe in the 1950s."
      - "The recognition of the People's Republic of China in 1949."
    option_explanations:
      - |
        Correct. Presidents from Eisenhower to Nixon cited containment and the domino theory to explain support for South Vietnam and, after 1964, the commitment of more than half a million troops.
      - |
        The Good Neighbor Policy was Franklin Roosevelt's 1930s approach to Latin America and predates the Cold War.
      - |
        American forces stayed in Europe as part of NATO, formed in 1949, a direct application of containment.
      - |
        The United States refused to recognize the People's Republic until 1979; containment pointed the other way in 1949.
    answer: 0
    explanation: |
      Continuity and change. Containment, first stated for Greece and Turkey, was extended to Asia in Korea and Vietnam; following an idea forward is a continuity skill.

  - slug: apush-review-practice-q48
    type: multiple_choice
    topic_code: "8.7"
    source: "Primary source: Harry S. Truman, Address Before a Joint Session of Congress (March 12, 1947), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "At the present moment in world history nearly every nation must choose between alternative ways of life. ... One way of life is based upon the will of the majority, and is distinguished by free institutions, representative government, free elections, guarantees of individual liberty, freedom of speech and religion, and freedom from political oppression. The second way of life is based upon the will of a minority forcibly imposed upon the majority. It relies upon terror and oppression, a controlled press and radio; fixed elections, and the suppression of personal freedoms. I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures. ... The seeds of totalitarian regimes are nurtured by misery and want. They spread and grow in the evil soil of poverty and strife."

      — President Harry S. Truman, address to a joint session of Congress requesting aid for Greece and Turkey, March 12, 1947
    prompt: |
      Truman's claim that totalitarian regimes grow out of "misery and want" most directly anticipated which policy?
    options:
      - "The policy of massive retaliation with nuclear weapons."
      - "The Neutrality Act of 1935."
      - "The Marshall Plan, which provided billions of dollars to rebuild the economies of Western Europe."
      - "The Berlin Airlift's military escort of supply convoys through East Germany."
    option_explanations:
      - |
        Massive retaliation, associated with Eisenhower and Dulles, relied on nuclear threat rather than economic aid.
      - |
        The Neutrality Act of 1935 aimed to keep the United States out of foreign wars, the opposite of Truman's commitment.
      - |
        Correct. Announced in June 1947, the European Recovery Program sent roughly $13 billion to Western Europe on the theory that prosperity would reduce communism's appeal and build trading partners.
      - |
        The airlift (1948-1949) flew supplies over a Soviet blockade by air precisely to avoid armed convoys on the ground. It was a response to a blockade, not to poverty.
    answer: 2
