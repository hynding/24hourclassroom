  # ---- Set K: secondary source on American empire, 1898-1920 (7.2, 7.3, 7.1, 7.5)
  - slug: apush-review-practice-q37
    type: multiple_choice
    topic_code: "7.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course, in the tradition of historians who stress economic motives for expansion): The war with Spain in 1898 is often told as a sudden burst of national excitement, whipped up by sensational newspapers after the battleship Maine exploded in Havana harbor. That story is too simple. For two decades American manufacturers and farmers had worried that the home market could no longer absorb everything they produced; naval strategists argued that a great power needed a modern fleet and coaling stations around the world; and Protestant missionaries spoke of a duty to carry their faith and institutions abroad. The decision to keep the Philippines after the war turned these impulses into a colonial empire, and it provoked a fierce debate at home. Anti-imperialists, an unlikely coalition of industrialists, labor leaders and writers, argued that ruling a people without their consent betrayed the Declaration of Independence, though some opponents also feared bringing non-white peoples into the nation. The Philippine-American War that followed, in which Filipino forces fought for their independence, showed how far the reality of empire stood from its promise.
    prompt: |
      Which of the following would best support the author's argument about economic motives for expansion?
    options:
      - "The Open Door notes of 1899-1900, which sought equal access for American trade in China."
      - "The publication of exaggerated stories of Spanish atrocities in Cuba by competing New York newspapers."
      - "The creation of the Rough Riders volunteer regiment."
      - "The Teller Amendment, which pledged that the United States would not annex Cuba."
    option_explanations:
      - |
        Correct. Secretary of State John Hay's Open Door notes aimed to keep the China market open to American goods, a direct expression of the search for overseas markets the author describes.
      - |
        Yellow journalism is the explanation the author calls too simple. It supports the conventional story, not the economic one.
      - |
        The Rough Riders reflect enthusiasm for war and Theodore Roosevelt's ambitions; they are not evidence of a search for markets.
      - |
        The Teller Amendment limited territorial ambitions in Cuba; it shows restraint, not economic expansion.
    answer: 0
    explanation: |
      Claims and evidence. Evidence must match the specific claim: economic motives require evidence about markets and trade.

