      — President Abraham Lincoln, Second Inaugural Address, March 4, 1865
    prompt: |
      Which wartime policy most directly made the "interest" Lincoln describes a target of the Union war effort?
    options:
      - "The suspension of the writ of habeas corpus in Maryland."
      - "The Homestead Act of 1862."
      - "The Morrill Land-Grant College Act of 1862."
      - "The Emancipation Proclamation of 1863, which declared enslaved people in areas in rebellion free and opened Union military service to Black men."
    option_explanations:
      - |
        Suspending habeas corpus was aimed at Confederate sympathizers and kept Maryland, a slave state, in the Union; it did not attack slavery.
      - |
        The Homestead Act encouraged free-labor settlement in the West, but it did not touch slavery where it existed.
      - |
        The Morrill Act funded public colleges with federal land, a Republican economic policy unrelated to slavery.
      - |
