  # ---- Set L: table, unemployment 1929-1944 (7.9, 7.10, 7.12, 7.15)
  - slug: apush-review-practice-q41
    type: multiple_choice
    topic_code: "7.9"
    source: "U.S. Bureau of the Census, Historical Statistics of the United States, Colonial Times to 1970, series D 86 (unemployment as a percentage of the civilian labor force)"
    points: 1
