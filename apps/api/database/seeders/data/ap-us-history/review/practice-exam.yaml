  - slug: apush-review-practice-q36
    type: multiple_choice
    topic_code: "6.11"
    source: "Library of Congress, Prints and Photographs: Joseph Keppler, The Bosses of the Senate, Puck (1889)"
    points: 1
    stimulus: |
      Image described in words: A colour cartoon by Joseph Keppler titled The Bosses of the Senate, published in the humor magazine Puck on January 23, 1889. Small, seated senators fill the floor of the Senate chamber. Towering over them at the back of the room stand enormous figures with bodies shaped like bulging moneybags, each labelled with the name of a trust: Standard Oil, sugar, copper, steel beam, iron, coal and others. A doorway marked as the entrance for monopolists stands wide open; the public gallery, marked as the people's entrance, is shown closed. A sign on the wall rewrites a famous line from Lincoln's Gettysburg Address to call this a Senate of, by and for the monopolists.
    prompt: |
      Which of the following reflects a reform effort in the 1890s that shared the cartoonist's concerns?
    options:
      - "The Supreme Court's decision in United States v. E. C. Knight, which limited the reach of antitrust law."
      - "The Dawes Severalty Act's division of reservation land into individual allotments."
