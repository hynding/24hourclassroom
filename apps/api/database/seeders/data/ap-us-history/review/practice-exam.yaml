  - slug: apush-review-practice-q24
    type: multiple_choice
    topic_code: "5.9"
    source: "Primary source: Abraham Lincoln, Second Inaugural Address (March 4, 1865), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
