  # ---- Set F: primary source, Jackson's Bank Veto message (4.8, 4.7, 4.5, 4.2)
  - slug: apush-review-practice-q18
    type: multiple_choice
    topic_code: "4.8"
    source: "Primary source: Andrew Jackson, Veto Message on the Bank Recharter Bill (July 10, 1832), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. In the full enjoyment of the gifts of Heaven and the fruits of superior industry, economy, and virtue, every man is equally entitled to protection by law; but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society-the farmers, mechanics, and laborers-who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

      — President Andrew Jackson, message to the Senate, July 10, 1832
    prompt: |
      The excerpt was written to explain Jackson's decision to
    options:
      - "veto a bill to recharter the Second Bank of the United States."
      - "remove the Cherokee and other Southeastern nations to lands west of the Mississippi."
      - "sign the Specie Circular requiring payment in gold or silver for public lands."
      - "threaten military force against South Carolina's nullification of the tariff."
    option_explanations:
      - |
        Correct. Jackson vetoed the recharter in July 1832, calling the Bank a privileged monopoly that served wealthy and foreign investors. The veto became the central issue of that year's election.
      - |
        The Indian Removal Act was passed in 1830. Jackson defended removal in other messages, in terms of national security and settlement, not in terms of exclusive privileges for the rich.
      - |
        The Specie Circular was issued in 1836 and was an executive order, not a message explaining a decision about legislation.
      - |
        Jackson's Proclamation to the People of South Carolina came in December 1832 and argued about the nature of the Union, not about privilege and wealth.
    answer: 0
    explanation: |
      Sourcing: historical situation. A message about the law granting exclusive privileges to make the rich richer, dated July 1832, is the Bank veto.

  - slug: apush-review-practice-q19
    type: multiple_choice
    topic_code: "4.7"
    source: "Primary source: Andrew Jackson, Veto Message on the Bank Recharter Bill (July 10, 1832), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. In the full enjoyment of the gifts of Heaven and the fruits of superior industry, economy, and virtue, every man is equally entitled to protection by law; but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society-the farmers, mechanics, and laborers-who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

      — President Andrew Jackson, message to the Senate, July 10, 1832
    prompt: |
      Jackson's appeal to "the farmers, mechanics, and laborers" best reflects which development of the 1820s and 1830s?
    options:
      - "The extension of the vote to all adult women in most states."
      - "The decline of popular interest in national elections."
      - "The adoption of a constitutional amendment guaranteeing voting rights regardless of race."
      - "The end of property requirements for voting for most white men and the rise of mass party politics."
    option_explanations:
      - |
        No state allowed women to vote in this period; New Jersey had ended its brief experiment in 1807. Women's suffrage became a demand at Seneca Falls in 1848.
      - |
        Turnout rose dramatically: from roughly a quarter of eligible voters in 1824 to over half in 1828 and around four-fifths in 1840.
      - |
        The Fifteenth Amendment came in 1870. In the Jacksonian era several states actually stripped free Black men of the vote while widening it for white men.
      - |
        Correct. Most states dropped property qualifications for white men, conventions replaced caucuses, and parties courted ordinary voters. Jackson's language speaks to that new mass electorate.
    answer: 3
    explanation: |
      Contextualization. Jackson's populist language makes sense in an era when ordinary white men had become the decisive electorate; note too who was still excluded.

  - slug: apush-review-practice-q20
    type: multiple_choice
