week: 34
description: |
  A full-length practice version of the May 2027 AP U.S. History exam, built to the real paper's shape. The real
  exam is fully digital in the Bluebook app and runs 3 hours 15 minutes in two sections. Section I, Part A is 55
  multiple-choice questions in 55 minutes (40% of the score), always in sets of 3 or 4 on one source: a primary
  text, a historian's interpretation, an image or map described here in words, or a chart or table. Section I,
  Part B is 3 required short-answer questions in 40 minutes (20%), each built on a source: SAQ 1 on a secondary
  text, SAQ 2 on a primary text, SAQ 3 on a non-text source; no two come from the same period. Section II is the
  document-based question (7 documents, 60 minutes including a 15-minute reading period, 25%, scored out of 7;
  from 2027 its evidence may come from across the course) and one long essay question (a single broad prompt
  with a short introductory statement and no choice, 40 minutes, 15%, scored out of 6). Multiple-choice items
  follow the Course and Exam Description's period weights: Periods 1 and 9 lightest, Period 2 a little more,
  Periods 3 to 8 the bulk. In the app, items 1-55 (1 point each) are graded at once; items 56-58 (3 points
  each), item 59 (the DBQ, 7 points) and item 60 (the LEQ, 6 points) are graded by your teacher against the
  scoring notes attached to each. The paper is therefore out of 77 points and the halves weigh differently from
  exam day, when the free-response questions are 60% of the score; score Section I and Section II separately to
  see where you stand. Sit it in one block if you can: 55 minutes for items 1-55, 40 minutes for items 56-58, a
  short break, then 100 minutes for items 59 and 60 (spend the first 15 reading the documents and planning).
