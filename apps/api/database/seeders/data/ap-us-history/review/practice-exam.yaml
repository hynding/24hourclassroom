    prompt: |
      Lincoln's confidence that the nation would soon need to "bind up the nation's wounds" is best explained by which military context in early 1865?
    options:
      - "Confederate victories at Fredericksburg and Chancellorsville had forced Union armies to retreat."
      - "Britain and France had just recognized the Confederacy and offered to mediate."
      - "Union victories, including the capture of Atlanta and Sherman's march through Georgia and the Carolinas, had made Confederate defeat likely."
      - "The Union had just suffered defeat at the First Battle of Bull Run."
    option_explanations:
      - |
        Fredericksburg (1862) and Chancellorsville (1863) were Confederate victories, but they came two years earlier, before Gettysburg and Vicksburg turned the war.
      - |
