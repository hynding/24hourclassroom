  # ---- Set J: image described in words, "The Bosses of the Senate" (6.6, 6.13, 6.12, 6.11)
  - slug: apush-review-practice-q33
    type: multiple_choice
    topic_code: "6.6"
    source: "Library of Congress, Prints and Photographs: Joseph Keppler, The Bosses of the Senate, Puck (1889)"
    points: 1
    stimulus: |
      Image described in words: A colour cartoon by Joseph Keppler titled The Bosses of the Senate, published in the humor magazine Puck on January 23, 1889. Small, seated senators fill the floor of the Senate chamber. Towering over them at the back of the room stand enormous figures with bodies shaped like bulging moneybags, each labelled with the name of a trust: Standard Oil, sugar, copper, steel beam, iron, coal and others. A doorway marked as the entrance for monopolists stands wide open; the public gallery, marked as the people's entrance, is shown closed. A sign on the wall rewrites a famous line from Lincoln's Gettysburg Address to call this a Senate of, by and for the monopolists.
    prompt: |
      The cartoon most directly reflects concern about which development of the late nineteenth century?
    options:
      - "The growth of large business combinations that came to dominate industries such as oil, steel and sugar refining."
      - "The rapid growth of labor unions in heavy industry."
      - "The federal government's ownership of the major railroads."
      - "The decline of manufacturing as farming expanded on the Great Plains."
    option_explanations:
      - |
        Correct. Trusts and holding companies such as John D. Rockefeller's Standard Oil used horizontal integration to control most of their markets, and critics feared their wealth bought political power.
      - |
        Unions grew but remained small and were often defeated; the cartoon's giants are trusts, not unions.
      - |
        The railroads were privately owned, built with large federal land grants. Public ownership was a Populist demand, not a reality.
      - |
        Manufacturing output grew enormously in the Gilded Age; the United States became the world's leading industrial producer by the 1890s.
    answer: 0
    explanation: |
      Sourcing an image. Read the labels: each moneybag is a trust, so the cartoon's subject is concentrated corporate power.

  - slug: apush-review-practice-q34
    type: multiple_choice
    topic_code: "6.13"
    source: "Library of Congress, Prints and Photographs: Joseph Keppler, The Bosses of the Senate, Puck (1889)"
    points: 1
    stimulus: |
      Image described in words: A colour cartoon by Joseph Keppler titled The Bosses of the Senate, published in the humor magazine Puck on January 23, 1889. Small, seated senators fill the floor of the Senate chamber. Towering over them at the back of the room stand enormous figures with bodies shaped like bulging moneybags, each labelled with the name of a trust: Standard Oil, sugar, copper, steel beam, iron, coal and others. A doorway marked as the entrance for monopolists stands wide open; the public gallery, marked as the people's entrance, is shown closed. A sign on the wall rewrites a famous line from Lincoln's Gettysburg Address to call this a Senate of, by and for the monopolists.
    prompt: |
      Which feature of politics at the time made the Senate an especially likely target of the cartoonist's criticism?
    options:
      - "Women had won the right to vote in Senate elections in most states."
      - "The Senate had no role in approving treaties or appointments."
      - "Senators were appointed for life by the president."
      - "Senators were chosen by state legislatures, which critics said made them easy for party machines and corporate interests to influence."
    option_explanations:
      - |
        Women could not vote in most states until the Nineteenth Amendment in 1920; a few western states were exceptions. Senate elections were not popular votes at all.
      - |
        The Senate had (and has) the power to ratify treaties and confirm appointments, which made its loyalties more important, not less.
      - |
        Senators served six-year terms and were never appointed by the president. The Constitution gave their selection to state legislatures.
      - |
        Correct. Before the Seventeenth Amendment (1913), state legislatures chose senators, and wealthy men and corporate allies could secure seats through party bosses, earning the Senate the nickname of a millionaires' club.
    answer: 3
    explanation: |
      Contextualization. The cartoon's point depends on how senators were chosen; knowing indirect election explains why reformers targeted it.

