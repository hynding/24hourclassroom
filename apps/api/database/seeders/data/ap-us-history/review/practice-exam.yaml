  # ---- Set A: secondary source on the Columbian Exchange (1.4, 1.5, 1.6)
  - slug: apush-review-practice-q01
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course): The exchange of plants, animals and microbes that followed 1492 reshaped both sides of the Atlantic more deeply than any treaty or battle. Maize and potatoes eventually fed growing populations in Europe, Africa and Asia, while horses, cattle and pigs transformed American landscapes and, for some Native peoples of the Plains, whole ways of life. Yet the exchange was never an even trade. Smallpox, measles and influenza, against which American populations had no acquired immunity, killed a large share of Native peoples within a few generations, and Spanish colonizers turned the resulting labor shortage into a rationale for coerced labor: first the encomienda, which granted colonists the labor and tribute of Native communities, and then a growing traffic in enslaved Africans. To see the Columbian Exchange only as an ecological event is to miss how quickly Europeans built systems of power on top of it.
    prompt: |
      Which of the following developments most directly supports the author's claim that the exchange reshaped both sides of the Atlantic?
    options:
      - "Spanish monarchs completed the Reconquista by capturing Granada in 1492."
      - "Portuguese navigators developed the caravel and new sailing techniques to explore the African coast."
      - "The introduction of American crops such as maize and potatoes contributed to population growth in Europe and Africa."
      - "The Protestant Reformation divided European states and intensified rivalries among them."
    option_explanations:
      - |
        The fall of Granada is part of the European context for 1492 (a crusading monarchy with resources to spare), but it happened before any exchange and is not evidence of its effects.
      - |
        The caravel is a cause of European exploration, not a result of the exchange. It explains how contact began, so it cannot show that the exchange reshaped anything afterward.
      - |
        Correct. American crops travelling east are the half of the exchange that changed the Eastern Hemisphere; paired with the livestock and diseases that travelled west, they show that both sides of the Atlantic were transformed.
      - |
        The Reformation shaped European competition for colonies, but it was a religious and political development in Europe, not a transfer of plants, animals or microbes across the Atlantic.
    answer: 2
    explanation: |
      Claims and evidence. To support a claim about two-way change, choose evidence that shows the effect running in the direction the passage spends less time on: American crops transforming Europe, Africa and Asia.

  - slug: apush-review-practice-q02
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course): The exchange of plants, animals and microbes that followed 1492 reshaped both sides of the Atlantic more deeply than any treaty or battle. Maize and potatoes eventually fed growing populations in Europe, Africa and Asia, while horses, cattle and pigs transformed American landscapes and, for some Native peoples of the Plains, whole ways of life. Yet the exchange was never an even trade. Smallpox, measles and influenza, against which American populations had no acquired immunity, killed a large share of Native peoples within a few generations, and Spanish colonizers turned the resulting labor shortage into a rationale for coerced labor: first the encomienda, which granted colonists the labor and tribute of Native communities, and then a growing traffic in enslaved Africans. To see the Columbian Exchange only as an ecological event is to miss how quickly Europeans built systems of power on top of it.
    prompt: |
      Which of the following best explains why Spanish colonizers came to rely on the forms of coerced labor the author describes?
    options:
      - "The Spanish crown forbade colonists from owning land, so they could profit only by hiring out laborers."
      - "Native peoples in the Caribbean and Mexico welcomed Spanish rule and volunteered as laborers in exchange for protection."
      - "Catholic missionaries insisted that Native converts be moved to Spain to work on royal estates."
      - "Spanish colonists sought profits from silver mining and sugar production, which required large labor forces that disease had depleted."
    option_explanations:
      - |
        Colonists did acquire land, and the crown granted encomiendas as rewards for conquest. The labor systems grew out of the drive to extract wealth, not out of a ban on landholding.
      - |
        Native peoples resisted Spanish conquest and labor demands in many ways, from flight to open revolt. Coerced labor existed precisely because voluntary labor was not forthcoming on the terms colonists wanted.
      - |
        Missionaries such as Bartolomé de Las Casas criticized the abuse of Native workers; they did not ship converts to Spain. Coerced labor was organized in the Americas, where the mines and fields were.
      - |
        Correct. The mines of Potosí and Zacatecas and the sugar plantations of the Caribbean demanded huge numbers of workers. As epidemics shrank Native populations, colonists turned to the encomienda and then to enslaved Africans.
    answer: 3
    explanation: |
      Causation. The passage names the immediate cause (a labor shortage after epidemics); the best answer adds the underlying economic cause that made labor so valuable: silver and sugar.

  - slug: apush-review-practice-q03
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course): The exchange of plants, animals and microbes that followed 1492 reshaped both sides of the Atlantic more deeply than any treaty or battle. Maize and potatoes eventually fed growing populations in Europe, Africa and Asia, while horses, cattle and pigs transformed American landscapes and, for some Native peoples of the Plains, whole ways of life. Yet the exchange was never an even trade. Smallpox, measles and influenza, against which American populations had no acquired immunity, killed a large share of Native peoples within a few generations, and Spanish colonizers turned the resulting labor shortage into a rationale for coerced labor: first the encomienda, which granted colonists the labor and tribute of Native communities, and then a growing traffic in enslaved Africans. To see the Columbian Exchange only as an ecological event is to miss how quickly Europeans built systems of power on top of it.
    prompt: |
      A historian who wanted to qualify the author's emphasis on European power would most likely point to which of the following?
    options:
      - "The Valladolid debate of 1550-1551 concerned whether Native Americans could be enslaved."
      - "Some Native peoples adopted European horses, metal tools and trade goods selectively and used them to strengthen their own power and autonomy."
      - "European diseases spread ahead of explorers and weakened Native societies before direct contact."
      - "The Spanish caste system ranked people by ancestry, placing peninsulares at the top."
    option_explanations:
      - |
        The Valladolid debate shows Spaniards arguing among themselves about how to treat Native peoples. It concerns European policy, so it does not challenge an argument about European power.
      - |
        Correct. Peoples such as the Comanche and Lakota turned the horse into a source of military and economic power, and many Native nations traded on their own terms. That evidence of Native agency qualifies a story told only as European domination.
      - |
        Disease running ahead of Europeans strengthens the author's account of an uneven exchange; it does not show Native peoples shaping the outcome themselves.
      - |
        The caste system is evidence for the author's argument, not against it: it is one of the systems of power Spaniards built on top of conquest and demographic collapse.
    answer: 1
    explanation: |
      Argumentation: qualifying a claim. A qualification is evidence that complicates the argument without denying it. Native adaptation and agency is the standard way historians qualify a story of pure European domination.

  # ---- Set B: map described in words, the Atlantic economy c. 1750 (2.3, 2.4, 2.6, 2.8)
  - slug: apush-review-practice-q04
    type: multiple_choice
    topic_code: "2.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      Map described in words (drawn for this course): The Atlantic world around 1750. Arrows run from British ports (London, Bristol, Liverpool) south to the West African coast, labelled textiles, guns, metal goods. From West Africa a heavy arrow crosses the Atlantic to the British West Indies and the southern mainland colonies, labelled enslaved Africans. From the West Indies, arrows run to Britain (sugar) and to New England (molasses). From New England ports, arrows run to the West Indies (fish, lumber, livestock, provisions) and to West Africa (rum). From the Chesapeake, an arrow to Britain is labelled tobacco; from the Carolinas and Georgia, rice and indigo. A note in the margin says that under the Navigation Acts certain enumerated goods, including tobacco and sugar, could be shipped only to England or to other English colonies.
    prompt: |
      The exports from the Chesapeake and the Carolinas shown on the map most directly reflect which development?
    options:
      - "The growth of plantation economies producing staple crops for export with the labor of enslaved people."
      - "The rise of family farms producing mainly for local markets."
      - "The spread of manufacturing in southern towns to supply British markets."
      - "The decline of the southern colonies' trade with Britain after 1700."
    option_explanations:
      - |
        Correct. Tobacco, rice and indigo were staple cash crops grown on plantations for Atlantic markets, and by 1750 their production depended overwhelmingly on enslaved African labor.
      - |
        Family farms producing for local markets were typical of much of New England and the backcountry, not of the export economy the map shows leaving the Chesapeake and the Lower South.
      - |
        The southern colonies had very little manufacturing; mercantilist policy expected them to ship raw materials and buy British manufactures. The map shows crops, not goods.
      - |
        The arrows show a large and growing trade between the southern colonies and Britain. Tobacco exports in particular rose across the first half of the 1700s.
    answer: 0
    explanation: |
      Contextualization and sourcing a map. Read the labels as evidence of an economy: staple crops flowing to Britain identify a plantation society built on enslaved labor.

  - slug: apush-review-practice-q05
    type: multiple_choice
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      Map described in words (drawn for this course): The Atlantic world around 1750. Arrows run from British ports (London, Bristol, Liverpool) south to the West African coast, labelled textiles, guns, metal goods. From West Africa a heavy arrow crosses the Atlantic to the British West Indies and the southern mainland colonies, labelled enslaved Africans. From the West Indies, arrows run to Britain (sugar) and to New England (molasses). From New England ports, arrows run to the West Indies (fish, lumber, livestock, provisions) and to West Africa (rum). From the Chesapeake, an arrow to Britain is labelled tobacco; from the Carolinas and Georgia, rice and indigo. A note in the margin says that under the Navigation Acts certain enumerated goods, including tobacco and sugar, could be shipped only to England or to other English colonies.
    prompt: |
      The note about the Navigation Acts best reflects which British goal?
    options:
      - "To end the Atlantic slave trade by restricting the movement of ships."
      - "To give colonial assemblies control over imperial trade policy."
      - "To encourage the colonies to develop self-sufficient economies independent of Britain."
      - "To ensure that colonial trade enriched the mother country, in keeping with mercantilist ideas."
    option_explanations:
      - |
        British merchants dominated the slave trade in the 1700s and the Navigation Acts protected their share of it. Parliament did not abolish the British slave trade until 1807.
      - |
        Trade policy was made by Parliament and enforced by royal officials. Colonial assemblies had no say over it, which became a grievance after 1763.
      - |
        The acts did the opposite: they tied colonial producers to British shippers, merchants and markets so that the colonies would depend on Britain.
      - |
        Correct. Mercantilism held that colonies existed to supply raw materials and buy manufactures so that the mother country's wealth and power grew. Routing enumerated goods through England captured that profit and customs revenue.
    answer: 3
    explanation: |
      Sourcing: purpose. Ask whom a law was written to benefit. The Navigation Acts served the empire's economic power, the core of mercantilism.

  - slug: apush-review-practice-q06
    type: multiple_choice
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Map described in words (drawn for this course): The Atlantic world around 1750. Arrows run from British ports (London, Bristol, Liverpool) south to the West African coast, labelled textiles, guns, metal goods. From West Africa a heavy arrow crosses the Atlantic to the British West Indies and the southern mainland colonies, labelled enslaved Africans. From the West Indies, arrows run to Britain (sugar) and to New England (molasses). From New England ports, arrows run to the West Indies (fish, lumber, livestock, provisions) and to West Africa (rum). From the Chesapeake, an arrow to Britain is labelled tobacco; from the Carolinas and Georgia, rice and indigo. A note in the margin says that under the Navigation Acts certain enumerated goods, including tobacco and sugar, could be shipped only to England or to other English colonies.
    prompt: |
      The heavy arrow from West Africa is best understood in the context of which change in the British mainland colonies after about 1680?
    options:
      - "New England colonies became the main destination of enslaved Africans brought to North America."
      - "Most enslaved Africans in the mainland colonies gained freedom after completing fixed terms of service."
      - "Chesapeake planters shifted from relying mainly on indentured servants to relying mainly on enslaved Africans, and colonies passed slave codes defining slavery as hereditary and race-based."
      - "The British government banned slavery in its mainland colonies while permitting it in the West Indies."
    option_explanations:
      - |
        Slavery was legal in every British colony, but New England's share of enslaved people was small. The great majority went to the West Indies and the southern colonies, as the map's arrow shows.
      - |
        Fixed terms of service describe indentured servitude. Slave codes made the status of enslaved Africans lifelong and passed it to their children.
      - |
        Correct. Falling supplies of English servants, fears raised by Bacon's Rebellion (1676) and expanding access to the slave trade led planters to turn to enslaved Africans, and colonial laws made slavery a lifelong, inherited status tied to race.
      - |
        No such ban existed. Slavery was legal throughout British North America in 1750 and grew fastest in the Chesapeake and the Lower South.
    answer: 2
    explanation: |
      Contextualization. The map shows the trade at its height; the context is the shift from servitude to racial slavery that made the southern colonies a central market for it.

  - slug: apush-review-practice-q07
    type: multiple_choice
    topic_code: "2.8"
    source: "general knowledge"
    points: 1
    stimulus: |
      Map described in words (drawn for this course): The Atlantic world around 1750. Arrows run from British ports (London, Bristol, Liverpool) south to the West African coast, labelled textiles, guns, metal goods. From West Africa a heavy arrow crosses the Atlantic to the British West Indies and the southern mainland colonies, labelled enslaved Africans. From the West Indies, arrows run to Britain (sugar) and to New England (molasses). From New England ports, arrows run to the West Indies (fish, lumber, livestock, provisions) and to West Africa (rum). From the Chesapeake, an arrow to Britain is labelled tobacco; from the Carolinas and Georgia, rice and indigo. A note in the margin says that under the Navigation Acts certain enumerated goods, including tobacco and sugar, could be shipped only to England or to other English colonies.
    prompt: |
      Which comparison between the economies of New England and the Chesapeake is best supported by the map?
    options:
      - "Both regions depended chiefly on exporting a single staple crop directly to Britain."
      - "New England was excluded from Atlantic trade by the Navigation Acts, while the Chesapeake was not."
      - "New England relied more on shipping, fishing and provisioning other colonies, while the Chesapeake shipped a staple crop directly to Britain."
      - "The Chesapeake built more ships and employed more sailors than New England."
    option_explanations:
      - |
        The map gives New England no staple crop sent to Britain. Its arrows carry fish, lumber, provisions and rum to other parts of the Atlantic.
      - |
        The Navigation Acts allowed colonial-built ships and colonial merchants to trade within the empire, and New England merchants did so extensively, as the map's arrows show.
      - |
        Correct. New England's thin soils and long winters pushed it toward commerce, shipbuilding and supplying the sugar islands, while the Chesapeake's tobacco went straight to British markets.
      - |
        Shipbuilding and seafaring were New England specialities. Chesapeake tobacco largely travelled in British-owned ships.
    answer: 2
    explanation: |
      Comparison. A good comparison names a difference and grounds it in the source: here, the direction and contents of each region's trade.

  # ---- Set C: image described in words, Franklin's "Join, or Die" (3.2, 3.1, 3.3)
  - slug: apush-review-practice-q08
    type: multiple_choice
    topic_code: "3.2"
    source: "Library of Congress, Prints and Photographs: Benjamin Franklin, Join, or Die, Pennsylvania Gazette (1754)"
    points: 1
    stimulus: |
      Image described in words: A woodcut printed by Benjamin Franklin in his newspaper, the Pennsylvania Gazette, on May 9, 1754. It shows a snake cut into eight pieces. From head to tail the pieces are labelled with initials: N.E. (New England), N.Y., N.J., P. (Pennsylvania), M. (Maryland), V. (Virginia), N.C. and S.C. Beneath the snake are the words JOIN, or DIE. The image accompanied a report on French forces seizing the forks of the Ohio River.
    prompt: |
      The image was most directly created in the context of which development?
    options:
      - "Colonial protests against Parliament's Stamp Act."
      - "Rivalry between Britain and France, and their American Indian allies, for control of the Ohio River valley."
      - "The religious revivals of the First Great Awakening."
      - "Disputes between the colonies and Spain over Florida."
    option_explanations:
      - |
        The Stamp Act came in 1765, eleven years after the image first appeared. Colonists did reprint the snake then, but the original was not about taxation.
      - |
        Correct. In 1754 French troops took the forks of the Ohio and fighting began between Virginia militia and the French, opening the Seven Years' War. Franklin's image answered that threat.
      - |
        The Great Awakening crossed colonial boundaries, but the snake's message is about common defense, and it ran beside news of French military advances.
      - |
        The image's report concerned the French on the Ohio, not Spanish Florida, and the threat it answered came from the west, not the south.
    answer: 1
    explanation: |
      Contextualization: historical situation. Date the source first. May 1754 places it at the opening of the Seven Years' War in the Ohio valley.

  - slug: apush-review-practice-q09
    type: multiple_choice
    topic_code: "3.1"
    source: "Library of Congress, Prints and Photographs: Benjamin Franklin, Join, or Die, Pennsylvania Gazette (1754)"
    points: 1
    stimulus: |
      Image described in words: A woodcut printed by Benjamin Franklin in his newspaper, the Pennsylvania Gazette, on May 9, 1754. It shows a snake cut into eight pieces. From head to tail the pieces are labelled with initials: N.E. (New England), N.Y., N.J., P. (Pennsylvania), M. (Maryland), V. (Virginia), N.C. and S.C. Beneath the snake are the words JOIN, or DIE. The image accompanied a report on French forces seizing the forks of the Ohio River.
    prompt: |
      The immediate response to Franklin's call for unity in 1754 is best described by which of the following?
    options:
      - "Delegates at the Albany Congress endorsed a plan of union, but colonial assemblies, protective of their own powers, rejected it."
      - "The colonies declared their independence from Britain to fight France on their own terms."
      - "The colonies adopted the Albany Plan of Union and formed a permanent intercolonial council."
      - "Parliament created a single royal government for all the mainland colonies."
    option_explanations:
      - |
        Correct. Franklin's plan for a grand council under a president-general won the Albany delegates' approval but was turned down by every colonial assembly, each unwilling to give up control of taxes and defense.
      - |
        Independence was more than twenty years away. In 1754 the colonists saw themselves as loyal British subjects fighting alongside the British army.
      - |
        The Albany Plan was proposed and endorsed by the delegates, but no colony ratified it, so no permanent council was ever created.
      - |
        Parliament made no such change. British officials also disliked the Albany Plan because it would have strengthened the colonies collectively.
    answer: 0
    explanation: |
      Contextualization and continuity. The rejection of the Albany Plan shows how weak intercolonial identity was in 1754, which makes the cooperation of the 1770s a real change.

  - slug: apush-review-practice-q10
    type: multiple_choice
    topic_code: "3.3"
    source: "Library of Congress, Prints and Photographs: Benjamin Franklin, Join, or Die, Pennsylvania Gazette (1754)"
    points: 1
    stimulus: |
      Image described in words: A woodcut printed by Benjamin Franklin in his newspaper, the Pennsylvania Gazette, on May 9, 1754. It shows a snake cut into eight pieces. From head to tail the pieces are labelled with initials: N.E. (New England), N.Y., N.J., P. (Pennsylvania), M. (Maryland), V. (Virginia), N.C. and S.C. Beneath the snake are the words JOIN, or DIE. The image accompanied a report on French forces seizing the forks of the Ohio River.
    prompt: |
      When colonial printers revived the snake image in the 1760s and 1770s, they were most likely using it to
    options:
      - "encourage colonists to enlist in the British army against France."
      - "argue that the colonies should expand west of the Proclamation Line of 1763."
      - "rally support for joint resistance to British taxation and imperial policies such as the Stamp Act and the Coercive Acts."
      - "promote the ratification of the Articles of Confederation."
    option_explanations:
      - |
        The war with France ended in 1763. The later uses came during the imperial crisis, when the danger the colonists saw was British policy.
      - |
        Colonists did resent the Proclamation Line, but the snake's message is unity among the colonies, not westward settlement.
      - |
        Correct. After 1763, the image's call to unite against a common danger was turned against Parliament itself, appearing in protests against the Stamp Act and again as the colonies coordinated resistance in 1774.
      - |
        The Articles were drafted in 1777 and ratified in 1781. The revivals of the image the question refers to came during the resistance of the 1760s and 1770s.
    answer: 2
    explanation: |
      Continuity and change. The same image served a new purpose as the enemy changed from France to Parliament: a good example of how sourcing (date and audience) changes meaning.

  # ---- Set D: primary source, The Federalist No. 10 (3.8, 3.9, 3.7, 3.10)
  - slug: apush-review-practice-q11
    type: multiple_choice
    topic_code: "3.8"
    source: "Primary source: James Madison, The Federalist No. 10 (1787), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "But the most common and durable source of factions has been the various and unequal distribution of property. ... Extend the sphere, and you take in a greater variety of parties and interests; you make it less probable that a majority of the whole will have a common motive to invade the rights of other citizens; or if such a common motive exists, it will be more difficult for all who feel it to discover their own strength, and to act in unison with each other. ... In the extent and proper structure of the Union, therefore, we behold a republican remedy for the diseases most incident to republican government."

      — James Madison, writing as Publius, The Federalist No. 10, published in a New York newspaper, November 1787
    prompt: |
      Madison's argument in the excerpt was most directly a response to which of the following?
    options:
      - "Southern demands that the Constitution abolish the slave trade at once."
      - "Loyalist claims that the colonies could not survive outside the British Empire."
      - "Federalist proposals to restore a monarchy in the United States."
      - "Anti-Federalist arguments that a republic could survive only in a small territory where government stayed close to the people."
    option_explanations:
      - |
        Southern delegates protected the slave trade; the Constitution barred Congress from banning it before 1808. The excerpt concerns faction, not the slave trade.
      - |
        Loyalism was a question of 1775-1783. By 1787 independence was settled, and Madison was arguing over what kind of union should govern the new nation.
      - |
        Madison was himself a Federalist, and no serious faction proposed a monarchy. The essay defends republican government.
      - |
        Correct. Drawing on Montesquieu, Anti-Federalists argued that a large republic would become distant and tyrannical. Madison turned the argument around: a large republic contains so many interests that no single faction can dominate.
    answer: 3
    explanation: |
      Sourcing: purpose and audience. The Federalist essays were written to persuade New Yorkers to ratify; each one answers an Anti-Federalist objection. Name the objection and the purpose follows.

  - slug: apush-review-practice-q12
    type: multiple_choice
    topic_code: "3.9"
    source: "Primary source: James Madison, The Federalist No. 10 (1787), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "But the most common and durable source of factions has been the various and unequal distribution of property. ... Extend the sphere, and you take in a greater variety of parties and interests; you make it less probable that a majority of the whole will have a common motive to invade the rights of other citizens; or if such a common motive exists, it will be more difficult for all who feel it to discover their own strength, and to act in unison with each other. ... In the extent and proper structure of the Union, therefore, we behold a republican remedy for the diseases most incident to republican government."

      — James Madison, writing as Publius, The Federalist No. 10, published in a New York newspaper, November 1787
    prompt: |
      Which feature of the Constitution most clearly reflects the concern Madison expresses about majorities invading the rights of other citizens?
    options:
      - "The separation of powers among three branches, with checks and balances and staggered terms of office."
      - "The power of Congress to coin money and regulate commerce."
      - "The provision allowing new states to be admitted to the Union."
      - "The requirement that the president be a natural-born citizen."
    option_explanations:
      - |
        Correct. Dividing power among branches with different constituencies and terms (two years, six years, four years, life) makes it hard for a temporary majority faction to capture the whole government at once.
      - |
        These powers answered the economic weaknesses of the Articles. They strengthen the national government rather than restrain a majority within it.
      - |
        Admitting new states extends the sphere geographically, but the clause was about western lands; the structural restraints on majorities are the checks and balances.
      - |
        The citizenship requirement guarded against foreign influence over the presidency, not against a domestic majority faction.
    answer: 0
    explanation: |
      Making connections. Link an argument to the institution designed to carry it out: Madison's fear of majority faction is built into separation of powers and checks and balances.

  - slug: apush-review-practice-q13
    type: multiple_choice
    topic_code: "3.7"
    source: "Primary source: James Madison, The Federalist No. 10 (1787), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "But the most common and durable source of factions has been the various and unequal distribution of property. ... Extend the sphere, and you take in a greater variety of parties and interests; you make it less probable that a majority of the whole will have a common motive to invade the rights of other citizens; or if such a common motive exists, it will be more difficult for all who feel it to discover their own strength, and to act in unison with each other. ... In the extent and proper structure of the Union, therefore, we behold a republican remedy for the diseases most incident to republican government."

      — James Madison, writing as Publius, The Federalist No. 10, published in a New York newspaper, November 1787
    prompt: |
      Madison's worry about factions acting on "the various and unequal distribution of property" was heightened most directly by which development under the Articles of Confederation?
    options:
      - "State legislatures passing paper-money and debt-relief laws, and the armed debtor uprising known as Shays' Rebellion."
      - "The Northwest Ordinance's ban on slavery north of the Ohio River."
      - "The Articles' grant to Congress of a power to tax individuals directly."
      - "The Supreme Court's decisions striking down state laws."
    option_explanations:
      - |
        Correct. Creditors such as Madison watched indebted farmers push states to print paper money and delay debts, and in 1786-1787 Massachusetts farmers closed courts by force. These looked like a propertyless majority invading the rights of a minority.
      - |
        The Northwest Ordinance is usually counted a success of the Confederation Congress. It organized western land, and it was not a conflict between debtors and creditors.
      - |
        The Articles gave Congress no power to tax at all; it could only request money from the states. That weakness is a reason for the Convention, not an example of faction.
      - |
        There was no national Supreme Court under the Articles. The federal judiciary was created by the Constitution.
    answer: 0
    explanation: |
      Contextualization. Federalist 10's abstract language about property and majorities has a concrete setting: debtor relief laws and Shays' Rebellion.

  - slug: apush-review-practice-q14
    type: multiple_choice
    topic_code: "3.10"
    source: "Primary source: James Madison, The Federalist No. 10 (1787), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "But the most common and durable source of factions has been the various and unequal distribution of property. ... Extend the sphere, and you take in a greater variety of parties and interests; you make it less probable that a majority of the whole will have a common motive to invade the rights of other citizens; or if such a common motive exists, it will be more difficult for all who feel it to discover their own strength, and to act in unison with each other. ... In the extent and proper structure of the Union, therefore, we behold a republican remedy for the diseases most incident to republican government."

      — James Madison, writing as Publius, The Federalist No. 10, published in a New York newspaper, November 1787
    prompt: |
      Which development of the 1790s most clearly departed from the hopes Madison expressed in the excerpt?
    options:
      - "Washington's Proclamation of Neutrality in 1793."
      - "The admission of Vermont and Kentucky as states."
      - "The adoption of the Bill of Rights in 1791."
      - "The rise of organized political parties, the Federalists and the Democratic-Republicans, divided over Hamilton's financial program and foreign policy."
    option_explanations:
      - |
        Neutrality was contested, but the proclamation itself was a foreign-policy decision, not evidence that national factions had formed.
      - |
        Admitting new states extended the sphere, which Madison thought would make factions less dangerous. It fits his argument rather than departing from it.
      - |
        The Bill of Rights protected individual liberties against the new government. It addressed Anti-Federalist fears and is consistent with Madison's concern for minority rights; he drafted it.
      - |
        Correct. Within a few years, national parties had formed around Hamilton's bank, debt assumption and the French Revolution, with Madison himself leading the opposition: precisely the kind of combined faction the essay hoped a large republic would prevent.
    answer: 3
    explanation: |
      Continuity and change over time. The essay predicts that a large republic will make national factions hard to form; the first party system shows that prediction failing within a decade.
  # ---- Set E: map described in words, the Missouri Compromise (4.3, 4.13, 4.14)
  - slug: apush-review-practice-q15
    type: multiple_choice
    topic_code: "4.3"
    source: "National Archives, Milestone Documents: Missouri Compromise (1820)"
    points: 1
    stimulus: |
      Map described in words (drawn for this course): The United States after the Missouri Compromise of 1820. States are shaded as free or slave; before the compromise there were eleven of each. Missouri is shaded as a slave state and Maine, separated from Massachusetts, as a free state. A line at latitude 36°30′ runs west from Missouri's southern border across the rest of the Louisiana Purchase. North of the line the unorganized territory is labelled slavery prohibited; south of it, in the region that became Arkansas Territory, the label reads slavery permitted. Spanish territory (Mexico after 1821) lies to the southwest, and the Oregon Country in the far northwest is labelled joint British and American occupation.
    prompt: |
      The compromise shown on the map was most directly a response to which of the following?
    options:
      - "A dispute over whether admitting Missouri as a slave state would upset the balance between free and slave states in the Senate."
      - "Debates over whether to annex the Republic of Texas."
      - "Conflict between the United States and Spain over the boundaries of Florida."
      - "Southern opposition to the protective tariff passed in 1828."
    option_explanations:
      - |
        Correct. When Missouri applied for statehood in 1819, the Tallmadge Amendment proposed gradual emancipation there. The equal number of free and slave states made Missouri's admission a fight over control of the Senate, settled by pairing it with Maine.
      - |
        Texas won independence from Mexico in 1836 and was annexed in 1845. The Missouri crisis was about territory already acquired in the Louisiana Purchase.
      - |
        The Adams-Onís Treaty of 1819 settled the Florida question with Spain. It concerned diplomacy, not the admission of states.
      - |
        The Tariff of Abominations came eight years later and produced the Nullification Crisis, a different sectional conflict.
    answer: 0
    explanation: |
      Causation and contextualization. The map's eleven-and-eleven balance is the clue: the crisis was about political power in the Senate as much as about slavery in Missouri.

  - slug: apush-review-practice-q16
    type: multiple_choice
    topic_code: "4.13"
    source: "National Archives, Milestone Documents: Missouri Compromise (1820)"
    points: 1
    stimulus: |
      Map described in words (drawn for this course): The United States after the Missouri Compromise of 1820. States are shaded as free or slave; before the compromise there were eleven of each. Missouri is shaded as a slave state and Maine, separated from Massachusetts, as a free state. A line at latitude 36°30′ runs west from Missouri's southern border across the rest of the Louisiana Purchase. North of the line the unorganized territory is labelled slavery prohibited; south of it, in the region that became Arkansas Territory, the label reads slavery permitted. Spanish territory (Mexico after 1821) lies to the southwest, and the Oregon Country in the far northwest is labelled joint British and American occupation.
    prompt: |
      The southern pressure to open new western lands to slavery reflected on the map is best explained by which development?
    options:
      - "The rapid expansion of cotton cultivation after the invention of the cotton gin, which drove settlers and an internal slave trade into the Southwest."
      - "The arrival of large numbers of European immigrants in the Deep South."
      - "The decline of cotton production after the War of 1812."
      - "The gradual abolition of slavery in Virginia and Maryland in the 1810s."
    option_explanations:
      - |
        Correct. Short-staple cotton could be grown profitably across the interior South once the gin made it easy to clean. Planters moved into Alabama, Mississippi and beyond, and hundreds of thousands of enslaved people were sold or forced south and west.
      - |
        Most European immigrants settled in the North and the Midwest, where wage work and free land were available; few went to the slave South.
      - |
        Cotton production rose steeply after 1815 as British textile mills demanded more raw cotton. A decline would have reduced, not increased, the push for new land.
      - |
        Virginia and Maryland did not abolish slavery. Instead they became major sellers of enslaved people to the cotton states through the domestic slave trade.
    answer: 0
    explanation: |
      Causation. The expansion of slavery was driven by an economic engine: cotton, the gin and world demand, carried west by the domestic slave trade.

