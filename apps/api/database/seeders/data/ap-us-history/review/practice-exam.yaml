  # ======================================================================
  # Section I, Part B: 3 short-answer questions, each on a source.
  # SAQ 1 secondary text (Period 4) · SAQ 2 primary text (Period 3) · SAQ 3 non-text (Period 8)
  # ======================================================================
  - slug: apush-review-practice-q56
    type: short_answer
    topic_code: "4.6"
    source: "general knowledge"
    points: 3
    stimulus: |
      Interpretation (written for this course, reflecting historians who describe a market revolution in the early republic): Between 1815 and 1850, canals, steamboats and the first railroads tied farms and villages into regional and national markets. Families that had once produced much of what they needed began raising crops for sale and buying cloth, clocks, shoes and tools made elsewhere. For merchants, bankers and many commercial farmers this brought new prosperity. For artisans whose skills were undercut by factories, and for the young women who left farms to tend looms in the textile mills, it meant work governed by the clock, the foreman and the wage. The market revolution was not simply an economic boom; it changed how Americans worked, where they lived and what they believed about independence and success.
    prompt: |
      Using the excerpt, answer (a), (b) and (c).

      (a) Briefly describe ONE historical development from the period 1815 to 1850 that supports the author's argument that the market revolution changed how Americans worked.

      (b) Briefly explain ONE way in which a historian could challenge or qualify the author's argument, using a specific piece of evidence from the period 1815 to 1850.

      (c) Briefly explain how ONE government policy or decision in the period 1815 to 1850 contributed to the changes the author describes.
    answer: |
      (a) The Lowell mills in Massachusetts recruited young farm women to work in water-powered textile factories from the 1820s. They lived in company boardinghouses, worked long hours set by the factory bell and were paid wages, a sharp break from household production on family farms. When wages were cut in the 1830s, some of them struck, showing how the wage relationship changed their working lives.

      (b) A historian could qualify the argument by pointing out that the South's economy changed far less in how most people worked: the market revolution expanded cotton production, but the labor was done by enslaved people under a system that was older than the market revolution and became more entrenched, not replaced by wage work. Many backcountry and frontier farmers also continued largely self-sufficient farming well into the period.

      (c) The Supreme Court's decision in Gibbons v. Ogden (1824) held that only Congress could regulate interstate commerce, striking down New York's steamboat monopoly. Opening the rivers to competing steamboat lines lowered freight costs and helped bind farms into the national market the author describes.
    explanation: |
      Three points, one per part. The skills: (a) claims and evidence, (b) argumentation (qualifying a secondary source), (c) causation.

      (a) 1 pt for describing a specific development from 1815 to 1850 showing a change in how Americans worked. Acceptable: the Lowell or Waltham mill system and the mill girls; the shift from artisan workshops to factories and the decline of the apprentice-journeyman-master system; the putting-out system in shoemaking (Lynn, Massachusetts); the growth of wage labor and early labor organizations or strikes (the Lowell strikes of 1834 and 1836, the ten-hour movement); Irish immigrants working on canals and railroads; commercial farming for distant markets (wheat in the Old Northwest, using John Deere's steel plow or McCormick's reaper). The answer must describe the change, not just name it.

      (b) 1 pt for explaining a challenge or qualification with specific evidence. Acceptable: the South's labor system remained slavery, which expanded with cotton (the cotton gin, the internal slave trade); many farm families stayed largely self-sufficient, especially in the backcountry and frontier; most Americans still lived on farms in 1850; change was regional, concentrated in the Northeast; alternative emphasis on the Second Great Awakening or reform movements as the main source of changed beliefs; prosperity was widely shared enough that workers welcomed new opportunities (Lowell women who valued wages and independence). Restating the author's claim or disagreeing without evidence earns zero.

      (c) 1 pt for explaining how a specific policy or decision contributed. Acceptable: the Erie Canal (built by New York State, 1817-1825); the National Road (federally funded); Henry Clay's American System, the Tariff of 1816 protecting New England textiles, or the Second Bank of the United States (chartered 1816) providing credit; Gibbons v. Ogden (1824); McCulloch v. Maryland (1819) upholding the Bank; Dartmouth College v. Woodward (1819) protecting contracts and corporate charters; state charters for corporations and banks; Commonwealth v. Hunt (1842) declaring unions lawful. The response must say how the policy contributed to the changes, not just identify it.

      Zero for a part: a development outside 1815-1850 (for example, Gilded Age industrialization); a vague answer such as people worked in factories with no description of the change; a policy named with no explanation of its effect.

  - slug: apush-review-practice-q57
    type: short_answer
    topic_code: "3.6"
    source: "Primary source: Abigail Adams to John Adams, 31 March 1776, Founders Online, National Archives"
    points: 3
    stimulus: |
      "I long to hear that you have declared an independancy—and by the way in the new Code of Laws which I suppose it will be necessary for you to make I desire you would Remember the Ladies, and be more generous and favourable to them than your ancestors. Do not put such unlimited power into the hands of the Husbands. Remember all Men would be tyrants if they could. If perticuliar care and attention is not paid to the Laidies we are determined to foment a Rebelion, and will not hold ourselves bound by any Laws in which we have no voice, or Representation."

      — Abigail Adams, letter to her husband John Adams, a delegate to the Continental Congress, March 31, 1776 (original spelling)
    prompt: |
      Using the excerpt, answer (a), (b) and (c).

      (a) Briefly describe the historical situation in which Adams wrote this letter.

      (b) Briefly explain ONE way in which the letter reflects the ideas of the American Revolution.

      (c) Briefly explain ONE way in which the status of women in the United States changed OR stayed the same in the period from 1776 to 1830.
    answer: |
      (a) Adams wrote in March 1776, after fighting had begun at Lexington and Concord and as the Continental Congress, where her husband served, was moving toward independence. Thomas Paine's Common Sense, published in January, had made the case for breaking with Britain, and colonists expected Congress and the states to write new laws and constitutions.

      (b) Adams turns the patriots' own argument against them: just as colonists refused to obey laws passed by a Parliament in which they had no representation, she says women will not consider themselves bound by laws in which they have no voice. Her warning that all men would be tyrants if they could echoes the revolutionary fear of unchecked power.

      (c) Women's legal status largely stayed the same. Under coverture a married woman's property and earnings belonged to her husband, and the new state constitutions (except New Jersey, until 1807) did not let women vote. What changed was the idea of republican motherhood: women were praised as the educators of virtuous citizens, which encouraged the founding of female academies and greater education for women.
    explanation: |
      Three points, one per part. The skills: (a) sourcing (historical situation), (b) analysing a primary source's ideas, (c) continuity and change.

      (a) 1 pt for describing the historical situation of spring 1776. Acceptable: the Revolutionary War had begun (Lexington and Concord, April 1775; Bunker Hill; the siege of Boston, which the British evacuated in March 1776); the Second Continental Congress was debating independence; Paine's Common Sense (January 1776) had turned opinion toward independence; Congress would soon advise states to form new governments. A general statement such as the colonists were angry at Britain earns zero; the response must place the letter in 1775-1776.

      (b) 1 pt for explaining a connection to revolutionary ideas. Acceptable: no taxation (or laws) without representation; consent of the governed; Enlightenment ideas of natural rights and resistance to tyranny (Locke); the republican fear that unchecked power corrupts; the idea that a new code of laws could remake society. The response must connect a specific phrase or idea in the letter to the revolutionary argument, not simply say she wanted rights.

      (c) 1 pt for explaining a change or a continuity, 1776-1830. Acceptable continuity: coverture remained in force; women could not vote (New Jersey's propertied women lost the vote in 1807); women were excluded from public office and most professions. Acceptable change: republican motherhood raised the value placed on women's education and founded female academies (for example, Emma Willard's Troy Female Seminary, 1821); women's participation in boycotts and wartime production; growing involvement in churches and benevolent societies during the Second Great Awakening; the first steps of the market revolution taking young women into mill work. Answers about the Seneca Falls Convention (1848) are outside the date range and earn the point only if used to show that by 1848 the demands Adams raised were still unmet.

      Zero for a part: restating the excerpt; claiming women gained the vote after the Revolution; events outside the time range without connection.

  - slug: apush-review-practice-q58
    type: short_answer
    topic_code: "8.11"
    source: "general knowledge"
    points: 3
    stimulus: |
      Map described in words (drawn for this course): The Equal Rights Amendment and the states, 1972-1982. Congress sent the amendment, which said that equality of rights under the law shall not be denied or abridged on account of sex, to the states in March 1972 with a seven-year deadline, later extended to June 30, 1982. Ratification required 38 states. The map shades the 35 states whose legislatures ratified by 1977; most ratified in 1972 or 1973. Fifteen states are left unshaded because they did not ratify before the deadline: Alabama, Arizona, Arkansas, Florida, Georgia, Illinois, Louisiana, Mississippi, Missouri, Nevada, North Carolina, Oklahoma, South Carolina, Utah and Virginia. Hatching marks five ratifying states whose legislatures later voted to rescind their ratification (Idaho, Kentucky, Nebraska, South Dakota and Tennessee); whether a state could rescind was legally disputed.
    prompt: |
      Using the map described above, answer (a), (b) and (c).

      (a) Briefly describe ONE regional pattern shown on the map.

      (b) Briefly explain ONE historical development that contributed to the pattern you described in (a) or to the amendment's failure to win ratification by 1982.

      (c) Briefly explain ONE way in which women's legal or economic status changed in the period 1964 to 1980 despite the outcome shown on the map.
    answer: |
      (a) Most of the states that did not ratify were in the South (Alabama, Georgia, Mississippi, the Carolinas, Louisiana, Florida, Virginia, Arkansas, Oklahoma) or the Mountain West (Utah, Nevada, Arizona), while the Northeast, the Pacific coast and most of the Midwest ratified, many in 1972-1973.

      (b) A conservative grassroots campaign led by Phyllis Schlafly's STOP ERA organization argued that the amendment would harm homemakers, end legal protections for women and could make women subject to the military draft. It drew on churchgoing women and the growing New Right, and it was strongest in the South and Mountain West, where it persuaded legislators to block ratification and some states to vote to rescind.

      (c) Title IX of the Education Amendments of 1972 barred sex discrimination in federally funded education programs, which opened college admissions and school athletics to women on a much larger scale. Women also entered the paid workforce in rising numbers, and the Civil Rights Act of 1964 (Title VII) gave them a legal basis to challenge job discrimination through the Equal Employment Opportunity Commission.
    explanation: |
      Three points, one per part. The skills: (a) analysing a non-text source (describing a pattern), (b) causation, (c) continuity and change. Answers must stay descriptive and balanced: credit both supporters' and opponents' arguments without editorializing.

      (a) 1 pt for describing a regional pattern drawn from the map. Acceptable: non-ratifying states concentrated in the South and the Mountain West; ratifying states concentrated in the Northeast, Midwest and Pacific coast; most ratifications came early (1972-1973) and momentum stalled; several states rescinded; the amendment ended three states short of 38. Listing states without describing a pattern earns zero.

      (b) 1 pt for explaining a development that contributed. Acceptable: Phyllis Schlafly and STOP ERA; opponents' arguments about the draft, single-sex facilities, alimony and the status of homemakers; the rise of the New Right and religious conservatives (later the Moral Majority); the backlash against 1960s social change; the politics of Roe v. Wade (1973) becoming linked to the ERA in many voters' minds; the Republican Party dropping its support for the ERA from its platform in 1980; states' rights arguments in the South. Supporters' efforts (NOW's campaigns, the deadline extension) are acceptable if tied to explaining the outcome.

      (c) 1 pt for explaining a change. Acceptable: Title VII of the Civil Rights Act of 1964 and EEOC enforcement; the Equal Pay Act of 1963 (accept as context); Title IX (1972); Roe v. Wade (1973) described neutrally as a ruling on reproductive rights; Reed v. Reed (1971) applying equal protection to sex discrimination; the Equal Credit Opportunity Act (1974); rising women's workforce participation and college enrollment; NOW's founding (1966) and second-wave feminism; Betty Friedan's book The Feminine Mystique (1963) as a spur to the movement. The response must explain the change, not only name a law.

      Zero for a part: a pattern not supported by the map; claims that the ERA was ratified; events after 1980 in part (c); partisan judgments offered in place of explanation.

  # ======================================================================
  # Section II: the DBQ (7 points) and one LEQ (6 points)
  # ======================================================================
  - slug: apush-review-practice-q59
    type: long_answer
    topic_code: "7.4"
    source: "Primary sources: Sherman Anti-Trust Act (1890) and Sixteenth Amendment (1913), National Archives; Theodore Roosevelt, First Annual Message (1901), American Presidency Project; Lochner v. New York (1905) and Muller v. Oregon (1908), Justia; Woodrow Wilson, First Inaugural Address (1913), Avalon Project; Lewis Hine, National Child Labor Committee photographs, Library of Congress"
    points: 7
    stimulus: |
      Document-based question. Documents 1-4 (documents 5-7 and the question are below).

      Document 1. Source: Sherman Anti-Trust Act, passed by Congress and signed by President Benjamin Harrison, July 2, 1890.
      "Every contract, combination in the form of trust or otherwise, or conspiracy, in restraint of trade or commerce among the several States, or with foreign nations, is hereby declared to be illegal."

      Document 2. Source: President Theodore Roosevelt, First Annual Message to Congress, December 3, 1901.
      "Great corporations exist only because they are created and safeguarded by our institutions; and it is therefore our right and our duty to see that they work in harmony with these institutions. ... The first essential in determining how to deal with the great industrial combinations is knowledge of the facts--publicity. In the interest of the public, the Government should have the right to inspect and examine the workings of the great corporations engaged in interstate business."

      Document 3. Source: Justice Rufus Peckham, opinion of the Court (5-4), Lochner v. New York, 1905, striking down a New York law limiting bakers to ten hours of work a day.
      "The general right to make a contract in relation to his business is part of the liberty of the individual protected by the Fourteenth Amendment of the Federal Constitution. ... Statutes of the nature of that under review, limiting the hours in which grown and intelligent men may labor to earn their living, are mere meddlesome interferences with the rights of the individual"

      Document 4. Source: Justice David Brewer, opinion of a unanimous Court, Muller v. Oregon, 1908, upholding an Oregon law limiting women in factories and laundries to ten hours of work a day.
      "That woman's physical structure and the performance of maternal functions place her at a disadvantage in the struggle for subsistence is obvious. This is especially true when the burdens of motherhood are upon her. ... as healthy mothers are essential to vigorous offspring, the physical wellbeing of woman becomes an object of public interest and care in order to preserve the strength and vigor of the race."
    prompt: |
      Evaluate the extent to which the Progressive movement changed the role of the federal government in the American economy in the period from 1890 to 1920.

      In your response you should do the following.
      - Respond to the prompt with a historically defensible thesis or claim that establishes a line of reasoning.
      - Describe a broader historical context relevant to the prompt.
      - Support an argument in response to the prompt using at least four documents.
      - Use at least one additional piece of specific historical evidence (beyond that found in the documents) relevant to an argument about the prompt.
      - For at least two documents, explain how or why the document's point of view, purpose, historical situation, and/or audience is relevant to an argument.
      - Use evidence to support, qualify or modify an argument that addresses the prompt.

      Document 5. Source: Description of a photograph taken by Lewis Hine for the National Child Labor Committee, a private reform organization, at a coal mine in Pennsylvania, 1911 (Library of Congress). Described in words: rows of boys, many of whom look about ten to fourteen years old, sit hunched on wooden boards above coal chutes inside a dark, dust-filled breaker, picking slate and rock out of the coal by hand. Their faces and clothes are black with coal dust. An adult supervisor stands behind them.

      Document 6. Source: Sixteenth Amendment to the U.S. Constitution, proposed by Congress in 1909 and ratified in 1913.
      "The Congress shall have power to lay and collect taxes on incomes, from whatever source derived, without apportionment among the several States, and without regard to any census or enumeration."

      Document 7. Source: President Woodrow Wilson, First Inaugural Address, March 4, 1913.
      "... if men and women and children be not shielded in their lives, their very vitality, from the consequences of great industrial and social processes which they can not alter, control, or singly cope with. Society must see to it that it does not itself crush or weaken or damage its own constituent parts."
      (The sentence opens by declaring that there can be no equality of opportunity, the first essential of justice, unless people are so shielded.)
    answer: |
      Thesis: Between 1890 and 1920 the Progressive movement turned the federal government from a largely passive referee into an active regulator of big business and finance, but its reach stopped at the factory door: protecting workers' hours and children was left mostly to the states and limited by the courts.

      Contextualization: After the Civil War, industrial capitalism produced giant trusts, dangerous workplaces and child labor; Gilded Age governments generally followed laissez-faire, and the Populists' demands of the 1890s for regulation and an income tax set the agenda Progressives took up.

      Body 1, regulating business (change): Doc 1 shows Congress outlawing trusts in 1890, though weakly enforced at first (E. C. Knight, 1895). Doc 2: Roosevelt claims a duty to inspect corporations; his purpose is to persuade a Congress wary of executive power, and he followed through with the Northern Securities suit and the Bureau of Corporations. Outside evidence: the Meat Inspection and Pure Food and Drug Acts (1906), the Federal Reserve Act (1913) and Clayton Act and FTC (1914).

      Body 2, new federal power over money (change): Doc 6 gives Congress an income tax, reversing Pollock (1895) and funding a larger national state; Doc 7 shows Wilson's purpose of justifying federal action as a matter of equal opportunity before a new Democratic Congress.

      Body 3, limits for workers (continuity): Doc 3 shows the Court defending liberty of contract, with the point of view of a majority committed to laissez-faire; Doc 4 upheld only state laws, and only by treating women as dependants; Doc 5 shows children still working in 1911, and the federal Keating-Owen Act (1916) was struck down in Hammer v. Dagenhart (1918).

      Complexity: The federal government changed most in regulating corporations and finance, while protections for labor came from states and private reformers and faced the courts, so the change was real but uneven.
    explanation: |
      Seven points. College Board DBQ rubric applied to this prompt.

      A. Thesis/claim, 1 pt: a historically defensible claim that evaluates the extent of change and establishes a line of reasoning, in the introduction or conclusion. Acceptable: a claim that the federal role expanded greatly in regulating business and finance but much less in protecting workers; or that change was limited because courts and laissez-faire ideas constrained reform. Zero: restating the prompt, or the Progressives changed the government a lot with no line of reasoning.

      B. Contextualization, 1 pt: describes a broader context before, during or continuing after 1890-1920, in more than a phrase. Acceptable: Gilded Age industrialization and trusts (Standard Oil, Carnegie Steel); laissez-faire and Social Darwinism; the Populist platform of 1892; labor conflict (Homestead, Pullman); urbanization and immigration; muckraking journalism. A passing mention earns zero.

      C. Evidence from the documents, up to 2 pts: 1 pt for accurately describing the content of at least three documents; 2 pts for using at least four documents to support an argument. Quoting without explaining does not count as use.

      D. Evidence beyond the documents, 1 pt: one specific piece of evidence not in the documents, used in an argument. Acceptable: Interstate Commerce Act (1887) or Hepburn Act (1906); United States v. E. C. Knight (1895); Northern Securities (1904); Meat Inspection Act and Pure Food and Drug Act (1906) and Upton Sinclair's The Jungle; Federal Reserve Act (1913); Clayton Antitrust Act and Federal Trade Commission (1914); Keating-Owen Act (1916) and Hammer v. Dagenhart (1918); Seventeenth Amendment (1913); Pollock v. Farmers' Loan and Trust (1895); the Triangle Shirtwaist fire (1911) and state factory laws; the Square Deal, New Nationalism, New Freedom; the War Industries Board in the First World War. Evidence must differ from the evidence used for contextualization.

      E. Sourcing, 1 pt: for at least two documents, explains how or why the point of view, purpose, historical situation or audience is relevant to the argument. Examples: Doc 2's audience is a Congress dominated by business-friendly Republicans, so Roosevelt frames regulation as a modest duty to obtain facts; Doc 3's point of view is a Court majority committed to liberty of contract, showing the judiciary as a brake on reform; Doc 4's purpose and historical situation (the Brandeis brief's social-science evidence) explain why protection was accepted only for women and on grounds of motherhood; Doc 5 was made for a reform group, so its purpose was to move public opinion toward child-labor laws; Doc 7's historical situation is the first Democratic president since Cleveland, with a Democratic Congress, ready to pass the tariff, banking and antitrust laws of the New Freedom.

      F. Complex understanding, 1 pt: demonstrates a complex understanding through sophisticated argumentation and/or effective use of evidence. Ways to earn it: explaining both change and continuity (business and finance versus labor); explaining multiple causes (reformers, presidents, courts, war); weighing federal versus state action; corroborating or qualifying with several documents (for example, Docs 3, 4 and 5 together show the limits of reform); connecting to a later period (the New Deal and West Coast Hotel, 1937, which ended the Lochner era). It must run through the essay, not be a single sentence.

      Common errors: treating the Sherman Act as an immediate success; reading Muller as a victory for women's equality without noting its reasoning; attributing state laws to the federal government; describing documents in order without an argument.

  - slug: apush-review-practice-q60
    type: long_answer
    topic_code: "2.3"
    source: "general knowledge"
    points: 6
    prompt: |
      Long essay question.

      Between 1607 and 1754, English colonists founded settlements along the Atlantic coast of North America for different reasons and in very different environments. Historians have compared how the colonies' economies, labor systems, religious life, political institutions and relations with American Indians developed, and how the ties of the Atlantic economy and the British Empire drew them together.

      Evaluate the extent to which the British colonies in North America developed distinct regional societies in the period from 1607 to 1754.

      In your response you should do the following.
      - Respond to the prompt with a historically defensible thesis or claim that establishes a line of reasoning.
      - Describe a broader historical context relevant to the prompt.
      - Support an argument in response to the prompt using specific and relevant examples of evidence.
      - Use historical reasoning (for example, comparison, causation, continuity and change) to frame or structure an argument that addresses the prompt.
      - Use evidence to support, qualify or modify an argument that addresses the prompt.
    answer: |
      Thesis: By 1754 the British mainland colonies had developed strongly distinct regional societies, because geography, founding purposes and labor systems differed: New England built religious, town-based communities of family farms and commerce; the Middle Colonies became diverse, tolerant grain exporters; and the Chesapeake and Lower South became plantation societies dependent on enslaved Africans. Yet common English law, representative assemblies, the Atlantic economy and the Great Awakening also drew them together, so their differences sat within a shared British American identity.

      Context: England colonized later than Spain and France, through joint-stock companies and proprietors, amid religious conflict at home and competition for Atlantic trade.

      Body 1, New England: Puritan settlement in families (Massachusetts Bay, 1630), town meetings, Congregational churches and schools; thin soil led to small farms, fishing, shipbuilding and trade with the West Indies; conflict with Native peoples (Pequot War, King Philip's War).

      Body 2, the Chesapeake and the Lower South: tobacco (Jamestown, John Rolfe), indentured servants then enslaved Africans after Bacon's Rebellion; slave codes; rice in South Carolina with an African majority (Stono Rebellion, 1739); Anglican establishment, dispersed settlement.

      Body 3, the Middle Colonies: Pennsylvania's Quaker toleration and William Penn's dealings with the Lenape; New York's Dutch legacy; German and Scots-Irish immigration; wheat and flour exports through Philadelphia and New York.

      Body 4, the ties that bound: the Navigation Acts and mercantilism; colonial assemblies such as the House of Burgesses; the Great Awakening crossing regions (George Whitefield); the Enlightenment; Anglicization of elites.

      Conclusion: Regional distinctiveness was greatest in labor and economy and smaller in politics and culture.
    explanation: |
      Six points. College Board LEQ rubric applied to this prompt. The reasoning process the prompt invites is comparison; causation (why the regions differed) also works.

      A. Thesis/claim, 1 pt: a historically defensible claim that evaluates the extent of regional distinctiveness and establishes a line of reasoning. Acceptable: the colonies were highly distinct because of geography, labor and religion, though imperial and Atlantic ties created some unity; or regional differences were real but were becoming less important by 1754 as trade, the Great Awakening and British culture drew colonists together. Zero: restating the prompt, or a claim with no line of reasoning (the colonies were different in many ways).

      B. Contextualization, 1 pt: describes a broader context relevant to the prompt. Acceptable: European competition for North America and Spain's head start; the English Reformation and religious conflict driving dissenters abroad; the commercial revolution and joint-stock companies; mercantilism; the Native societies already living on the Atlantic coast. Must be more than a phrase.

      C. Evidence, up to 2 pts: 1 pt for identifying at least two specific, relevant examples; 2 pts for using specific evidence to support an argument. Acceptable: Jamestown and the Virginia Company; tobacco and John Rolfe; headright system; Bacon's Rebellion (1676); Virginia slave codes (1705); the House of Burgesses (1619); the Mayflower Compact; Massachusetts Bay and John Winthrop; town meetings; the Half-Way Covenant; Roger Williams and Anne Hutchinson; the Pequot War (1636-1638) and King Philip's War (1675-1676); the Salem witch trials; Pennsylvania's Frame of Government and Quaker toleration; New Netherland becoming New York (1664); the Carolina rice economy and the Stono Rebellion (1739); Georgia's founding (1732); the triangular trade and Navigation Acts; salutary neglect; the Great Awakening (Jonathan Edwards, George Whitefield); the Zenger trial (1735); German and Scots-Irish migration.

      D. Analysis and reasoning, up to 2 pts: 1 pt for using historical reasoning (comparison, causation, or continuity and change) to frame or structure the argument, for example comparing two or more regions on labor or religion, or explaining how environment and founding purpose caused the differences. 1 pt for a complex understanding, demonstrated by sophisticated argumentation (explaining both similarity and difference among regions; explaining multiple causes; noting diversity within a region, such as backcountry versus tidewater; connecting to Period 3, when shared grievances overcame regional divisions) or effective use of evidence (well-chosen evidence from all three regions, corroborated across categories). The complexity point must be developed through the essay, not asserted in one sentence.

      Common errors: treating all colonies as alike; describing regions one after another without comparing them; confusing Spanish or French colonies with British ones; anachronism (cotton as a colonial staple; the Revolution as the outcome of 1754 regional differences without argument).
