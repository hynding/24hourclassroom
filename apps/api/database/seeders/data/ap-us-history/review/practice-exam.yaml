    source: "Primary source: Andrew Jackson, Veto Message on the Bank Recharter Bill (July 10, 1832), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. In the full enjoyment of the gifts of Heaven and the fruits of superior industry, economy, and virtue, every man is equally entitled to protection by law; but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society-the farmers, mechanics, and laborers-who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

      — President Andrew Jackson, message to the Senate, July 10, 1832
    prompt: |
      Jackson's position in the excerpt would most likely have been opposed by supporters of which program?
    options:
      - "The Monroe Doctrine's warning against European colonization in the Western Hemisphere."
      - "The temperance movement's campaign to limit the sale of alcohol."
      - "John C. Calhoun's theory that states could nullify federal laws."
      - "Henry Clay's American System of a national bank, a protective tariff and federally funded internal improvements."
    option_explanations:
      - |
        The Monroe Doctrine concerned foreign policy and had broad support. It has no bearing on the Bank question.
      - |
        Temperance was a moral reform movement. Its supporters were found in both parties and had no common position on the Bank.
      - |
        Nullifiers distrusted federal economic power, including the tariff. They were, if anything, closer to Jackson's suspicion of the Bank than opposed to it.
      - |
        Correct. Clay and the Whigs saw the Bank as essential to a national market economy of credit, roads and canals. They pushed the early recharter to force the issue, and Clay ran against Jackson on it in 1832.
    answer: 3
    explanation: |
      Making connections. The market revolution produced a debate about the federal government's role in the economy; the Bank veto and the American System are the two sides of it.

