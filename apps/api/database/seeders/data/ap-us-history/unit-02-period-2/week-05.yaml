    - slug: apush-u02-w05-q23
      type: short_answer
      topic_code: "2.6"
      source: "Interpretation written for this course; general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course), in the tradition of historians who see slavery and freedom developing together in Virginia:

        "In 1650 a Virginia planter might own a few servants, English and African, who worked the same tobacco fields and sometimes ran away together. By 1720 the same plantation would be worked almost entirely by enslaved Africans held for life. The change was not inevitable. Planters chose it after the 1670s, when poor white men who had finished their indentures demanded land and, in Bacon's Rebellion, took up arms. Enslaving Africans solved the planters' labor problem, and laws that gave poor whites a privileged status above all Black people solved their political one."
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the author's argument about the causes of the shift to slavery in Virginia.
        (b) Briefly explain ONE specific piece of historical evidence, not mentioned in the excerpt, that supports the author's argument.
        (c) Briefly explain ONE other cause of the shift to slavery in the Chesapeake that the author does not emphasise.
      answer: |
        (a) The author argues that the shift to slavery was a deliberate choice by planters, made largely to solve a political problem: after Bacon's Rebellion showed the danger of armed, landless former servants, planters turned to enslaved Africans and used racial laws to give poor whites a stake in the system.

        (b) Virginia's slave code of 1705 drew sharp legal lines by race: it defined enslaved people as property and gave white servants protections, such as freedom dues, that were denied to Black people, which shows the law dividing poor whites from Africans as the author argues.

        (c) Economic and demographic changes also mattered: fewer English people emigrated as wages rose in England, the end of the Royal African Company's monopoly in 1698 increased the supply of enslaved Africans, and falling death rates made buying a lifetime of labor more profitable than a few years of a servant's.
      explanation: |
        Three points, one per part.

        (a) 1 pt: describes the argument: planters chose slavery after Bacon's Rebellion to solve labor and political problems; racial law divided poor whites from Black people. Zero for "slavery grew because of tobacco" with no reference to the author's political argument.

        (b) 1 pt: specific evidence not in the excerpt that supports the argument, e.g. the 1662 law making slavery hereditary through the mother; the 1667 law that baptism did not free; the 1705 slave code; laws barring Black people from bearing arms or testifying against whites; the rising share of Africans in the Chesapeake after 1680. Must explain how it supports the claim.

        (c) 1 pt: explains another cause, e.g. falling English emigration and rising English wages; increased supply of enslaved Africans after 1698; improved life expectancy; the example of Barbados; enslaved people's perpetual status and inherited condition as an investment. Zero for repeating Bacon's Rebellion.

    - slug: apush-u02-w05-q24
      type: short_answer
      topic_code: "2.7"
      source: "Interpretation written for this course; general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course):

        "When George Whitefield preached in the open air to crowds of thousands, he was doing more than saving souls. He was teaching colonists that the individual conscience, not the parish minister or the established church, was the final judge of religious truth. Farmers, servants, women and enslaved people heard that their experience of God counted as much as a learned clergyman's. A generation later, many of the same people would apply that lesson to Parliament."
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe ONE claim the author makes about the effects of the Great Awakening.
        (b) Briefly explain ONE piece of historical evidence from 1730 to 1754 that supports the author's claim.
        (c) Briefly explain ONE way a historian might challenge or qualify the author's claim.
      answer: |
        (a) The author claims the Great Awakening taught ordinary colonists to trust their own conscience over established authority, an attitude that later shaped resistance to Parliament.

        (b) The split between New Lights and Old Lights shows the claim at work: congregations broke away from ministers they judged unconverted, as Gilbert Tennent urged in his 1740 sermon on the danger of an unconverted ministry, and new churches and colleges such as Princeton were founded outside the old establishments.

        (c) A historian could argue that the Enlightenment, not revivalism, did more to shape revolutionary ideas: leaders such as Franklin, Jefferson and Adams drew on John Locke's natural rights and on English political thought, and many revival converts were more concerned with salvation than politics; the revivals also faded by the mid-1740s, decades before the Revolution.
      explanation: |
        Three points, one per part.

        (a) 1 pt: describes a claim, e.g. the revival elevated individual conscience over clergy and established churches; it reached ordinary people including women and enslaved people; it laid groundwork for later political resistance.

        (b) 1 pt: specific evidence from 1730–1754, e.g. New Light / Old Light splits; Tennent's sermon (1740); itinerant preaching across colonies; Edwards's Northampton revival; new denominations and colleges; Black conversions. Must explain how it supports the claim.

        (c) 1 pt: a reasoned challenge, e.g. Enlightenment ideas (Locke, Franklin) as the stronger influence on revolutionary thought; the revival's mainly spiritual aims; its decline after the 1740s; the persistence of established churches; the time gap before the imperial crisis. Zero for simply disagreeing without evidence.

    - slug: apush-u02-w05-q25
      type: long_answer
      topic_code: "2.8"
      source: "general knowledge"
      points: 6
      prompt: |
        From 1607 to 1754, Spanish, French and British colonists all came into sustained contact with American Indians. Their relationships ranged from trade and alliance to missionary work, labor demands and war, and Native nations responded with diplomacy, accommodation and armed resistance.

        Evaluate the extent of similarity in how Spanish, French and British colonists interacted with American Indians from 1607 to 1754.
      answer: |
        Thesis: The three empires shared assumptions of European superiority and depended on Native trade and alliances, but their interactions differed more than they resembled each other, because their goals and numbers differed: Spain sought converts and labor, France sought furs and allies, and Britain sought land, so Britain's relations were the most violent and displacing.

        Context: Period 1 had already shown the pattern of conquest, encomienda and epidemic disease; by 1607 Native populations were reduced but still controlled most of the continent, and European rivals were competing to claim it.

        Body 1 (similarities): all relied on Native trade and allies (Powhatan corn at Jamestown; Huron furs; Pueblo allies after 1692); all justified colonization with religion (Virginia charter 1606; Jesuits; Franciscans); all fought Native wars.
        Body 2 (Spain vs France): Spanish missions and labor demands provoked the Pueblo Revolt (1680), then accommodation; French intermarriage, coureurs de bois and alliances against the Haudenosaunee.
        Body 3 (Britain): land-hungry settlement led to the Powhatan wars (1622, 1644), the Pequot War, Metacom's War and Bacon's Rebellion; little intermarriage; Native enslavement and the Yamasee War.
        Complexity: Native agency shaped all three: Haudenosaunee play-off diplomacy after 1701 forced Britain and France to compete for alliance; and British relations were not uniform (Penn's dealings with the Lenape).
      explanation: |
        Six points, College Board LEQ rubric applied to this prompt.

        Thesis/claim (0–1): a defensible claim about the extent of similarity that sets up a line of reasoning, e.g. "shared assumptions and dependence on trade, but differed fundamentally because of goals and numbers". Zero for restating the prompt.

        Contextualization (0–1): describes broader context, e.g. Period 1 conquest and encomienda; epidemic disease; European imperial rivalry and the Reformation; Native political structures before contact. Must be more than a phrase.

        Evidence (0–2): 1 pt for two specific examples (Pueblo Revolt; Spanish missions; encomienda and repartimiento; coureurs de bois; Jesuits; métis; Huron alliance; Beaver Wars; Powhatan wars; Pequot War; Metacom's War; Bacon's Rebellion; Yamasee War; Penn and the Lenape; Great Peace of Montreal and Haudenosaunee neutrality). 2 pts when they support an argument about the extent of similarity.

        Analysis and reasoning (0–2): 1 pt for using comparison to frame the argument, explaining why interactions were similar or different. 1 pt for complex understanding, e.g. weighing both similarities and differences; showing change over time within an empire (Spanish accommodation after 1692); centring Native agency and play-off diplomacy; noting variation within the British colonies.

        Zero overall for separate narratives of each empire with no comparison.
