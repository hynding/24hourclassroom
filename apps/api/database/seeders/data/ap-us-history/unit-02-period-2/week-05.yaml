week: 5
unit: 2
title: "Native Resistance, Slavery and Colonial Society"
topics: ["2.5", "2.6", "2.7", "2.8"]
guide: guides/week-05.md
guide_description: |
  How American Indians resisted, accommodated and reshaped colonization (the Powhatan wars, the Pequot War,
  Metacom's War, the Pueblo Revolt, the Beaver Wars and play-off diplomacy); how slavery became the foundation of
  the southern and Caribbean colonies and how enslaved people resisted; and how the Enlightenment, the Great
  Awakening, immigration and Anglicization shaped colonial society. Worked examples: sourcing Equiano with HIPP, a
  causation chain from Bacon's Rebellion to the slave codes, and a comparison thesis for the period.
flashcards_description: |
  33 cards on Native resistance and diplomacy, the growth of slavery and resistance to it, the Great Awakening and
  Enlightenment, immigration and the comparisons that sum up Period 2.

flashcards:
  - front: Anglo-Powhatan attacks of 1622 and 1644 → cause and result
    back: |
      Led by Opechancanough, the Powhatan struck the spreading tobacco settlements in 1622, killing about a quarter of the colonists, and again in 1644. English reprisals and the 1646 treaty broke Powhatan power and pushed survivors onto shrinking lands.
    topic_code: "2.5"
  - front: Pequot War (1636–1637) → what happened and significance
    back: |
      Puritan forces and their Narragansett and Mohegan allies destroyed the Pequot, most infamously by burning the fortified village at Mystic in 1637 and killing hundreds of people inside. It opened southern New England to English expansion.
    topic_code: "2.5"
  - front: Metacom's War / King Philip's War (1675–1676) → causes and effects
    back: |
      The Wampanoag leader Metacom (called King Philip by the English) led a coalition against English expansion, legal pressure and missionary encroachment. Thousands died on both sides, many Native survivors were sold into slavery in the West Indies, and Native power in southern New England was broken.
    topic_code: "2.5"
  - front: Pueblo Revolt (1680) → leader, causes, results
    back: |
      Popé (Po'pay) led a coordinated uprising of many Pueblo towns against Spanish suppression of their religion, forced labor, tribute and drought-era hardship. About four hundred Spaniards, including twenty-one Franciscans, were killed, and the Spanish were driven out of New Mexico for twelve years.
    topic_code: "2.5"
  - front: Spanish return to New Mexico (1692) → how Spanish policy changed afterward
    back: |
      Diego de Vargas reconquered New Mexico, but the Spanish then tolerated more Pueblo religious practice, eased labor demands and relied on the Pueblos as allies against Apache and Comanche raiders. The revolt forced a measure of accommodation.
    topic_code: "2.5"
  - front: Beaver Wars (mid-1600s) → who and why
    back: |
      The Haudenosaunee (Iroquois), armed by Dutch traders, fought the Huron (Wendat) and other nations to control the fur trade and to take captives to replace people lost to disease. European trade and epidemics intensified Native warfare.
    topic_code: "2.5"
  - front: Haudenosaunee neutrality after 1701 → strategy and why it worked
    back: |
      After the Great Peace of Montreal (1701) the Haudenosaunee stayed neutral between Britain and France, trading with both and playing one off against the other. It preserved their lands and influence until the Seven Years' War.
    topic_code: "2.5"
  - front: Bacon's Rebellion (1676) → causes
    back: |
      Landless former servants and frontier farmers in Virginia, led by Nathaniel Bacon, wanted Governor William Berkeley to let them attack American Indians and seize their land, and they resented the wealthy planters' control of land and government. They attacked Native peoples and burned Jamestown.
    topic_code: "2.5"
  - front: Bacon's Rebellion → long-term effect on labor in Virginia
    back: |
      Planters feared armed, landless poor whites, so they turned increasingly to enslaved Africans, who could be held for life and whose children were also enslaved. The rebellion helped speed the shift from indentured servitude to racial slavery in the Chesapeake.
    topic_code: "2.6"
  - front: Yamasee War (1715–1717) → significance
    back: |
      The Yamasee and allied nations rose against South Carolina traders over debts, abuses and the Native slave trade. The war nearly destroyed the colony and ended much of the Carolina trade in enslaved American Indians.
    topic_code: "2.5"
  - front: Atlantic slave trade → scale and where most captives went
    back: |
      Roughly twelve and a half million Africans were forced onto ships between the 1500s and the 1860s, and about ten and a half million survived to land. Most went to Brazil and the Caribbean; under 400,000, about one in twenty-five, landed in mainland North America.
    topic_code: "2.6"
  - front: Middle Passage → what it was
    back: |
      The forced voyage of enslaved Africans across the Atlantic, typically lasting weeks to months, in crowded, filthy holds where disease, abuse and despair killed many. Captives resisted through shipboard revolts, hunger strikes and suicide.
    topic_code: "2.6"
  - front: Why did Chesapeake planters shift from indentured servants to enslaved Africans (c. 1680–1720)?
    back: |
      Fewer English migrants as wages rose in England; freed servants demanding land (Bacon's Rebellion); the end of the Royal African Company's monopoly in 1698, which increased the supply of enslaved people; and longer life expectancy, which made buying a lifetime of labor pay.
    topic_code: "2.6"
  - front: Virginia law of 1662 (status follows the mother) → significance
    back: |
      Virginia declared that a child's status, slave or free, followed the mother's. It made slavery hereditary and gave enslavers a financial interest in enslaved women's children, including those fathered by white men.
    topic_code: "2.6"
  - front: Virginia slave code of 1705 → what it did
    back: |
      It gathered earlier laws into a single code that defined enslaved people as property, restricted their movement, allowed harsh punishment, and drew sharp legal lines between white servants and Black people. Race now defined legal status.
    topic_code: "2.6"
  - front: Stono Rebellion (1739) → what happened and response
    back: |
      About twenty enslaved men near the Stono River in South Carolina, many probably from Kongo, seized weapons and marched south toward Spanish Florida, which offered freedom; others joined before militia crushed the revolt. South Carolina responded with the harsh Negro Act of 1740.
    topic_code: "2.6"
  - front: Fort Mose (1738) → what it was and why it mattered
    back: |
      A settlement of free Black people near St. Augustine, created by Spanish Florida for people who escaped slavery in the British colonies. Spain used freedom as a weapon against South Carolina, and it drew enslaved people southward.
    topic_code: "2.6"
  - front: Everyday resistance by enslaved people → five forms
    back: |
      Working slowly, breaking tools, feigning illness, running away (sometimes for days, sometimes for good), and keeping African names, music, religion and family ties. Open revolt was rare and deadly; daily resistance was constant.
    topic_code: "2.6"
  - front: Gullah culture → where and what it shows
    back: |
      The culture and creole language of enslaved Africans in the South Carolina and Georgia Lowcountry, where a Black majority and large rice plantations allowed African languages, foodways and beliefs to survive and blend. It shows enslaved people rebuilding culture under slavery.
    topic_code: "2.6"
  - front: Slavery in the northern colonies → how it differed from the South
    back: |
      Slavery was legal in every colony, but in the North enslaved people were fewer, often worked as domestic servants, artisans and dock laborers in cities such as New York, and lived in small numbers per household. New York saw a revolt in 1712 and a feared conspiracy in 1741.
    topic_code: "2.6"
  - front: Great Awakening (1730s–1740s) → what it was
    back: |
      A wave of Protestant revivals across the colonies stressing emotional preaching, personal conversion and the individual's direct relationship with God. It drew huge crowds of every class, women and men, free and enslaved.
    topic_code: "2.7"
  - front: Jonathan Edwards → role in the Great Awakening
    back: |
      A Massachusetts Congregationalist minister whose revival in Northampton in the mid-1730s and sermon "Sinners in the Hands of an Angry God" (1741) urged listeners to recognise their sin and seek God's grace at once.
    topic_code: "2.7"
  - front: George Whitefield → why he mattered
    back: |
      An English Anglican evangelist who toured the colonies from 1739, preaching outdoors to crowds in the thousands from Georgia to New England. He was the first celebrity known across all the colonies, and Benjamin Franklin printed his sermons.
    topic_code: "2.7"
  - front: New Lights vs Old Lights → the split
    back: |
      New Lights embraced revivals and emotional conversion; Old Lights defended educated clergy, reason and established order. The split divided congregations and taught colonists they could challenge established authority.
    topic_code: "2.7"
  - front: Great Awakening → three long-term effects
    back: |
      New denominations (Baptists, Methodists later) and new colleges such as Princeton (1746); a habit of questioning established authority; and the first shared experience across the colonies. It also brought many enslaved Africans into Protestant Christianity.
    topic_code: "2.7"
  - front: Enlightenment in the colonies → key ideas and figures
    back: |
      Reason, science and natural rights. John Locke argued that government rests on consent and protects life, liberty and property. Benjamin Franklin embodied the movement through his library, his scientific experiments and Poor Richard's Almanack.
    topic_code: "2.7"
  - front: Anglicization → meaning in the 1700s
    back: |
      The colonies growing more like Britain: imported British goods and fashions, the Anglican church and British-style assemblies, newspapers and coffeehouses. Colonists saw themselves as Britons sharing English liberties.
    topic_code: "2.7"
  - front: Zenger trial (1735) → significance
    back: |
      The New York printer John Peter Zenger was tried for seditious libel after criticising the royal governor. The jury acquitted him because what he printed was true, an early step toward freedom of the press in America.
    topic_code: "2.7"
  - front: Scots-Irish and German immigrants (1700s) → where they settled and why
    back: |
      Scots-Irish (Ulster Presbyterians) fled rents and poor harvests; Germans fled war and poverty in the Rhineland. Many entered through Philadelphia and settled the Pennsylvania backcountry and the Appalachian valleys south, making the colonies more diverse.
    topic_code: "2.7"
  - front: Pennsylvania Charter of Privileges (1701) → religious provisions
    back: |
      William Penn guaranteed that no one who acknowledged one God and lived quietly under the government would be molested for their beliefs, and that Christians could hold office. Broader than Maryland's 1649 act, it helped attract diverse immigrants.
    topic_code: "2.7"
  - front: Salem witch trials (1692) → causes historians cite
    back: |
      Social and economic tension between Salem Village and the more commercial Salem Town, fear from frontier war with the Wabanaki and the French, Puritan belief in the devil's power, and anxieties about women's place. Nineteen people were hanged.
    topic_code: "2.7"
  - front: Compare Spanish and British American racial systems in Period 2
    back: |
      Spain recognised many mixed categories (the casta system), and some people of mixed ancestry could rise. British colonies drew a sharper line between white and Black, and their laws made slavery hereditary and racial.
    topic_code: "2.8"
  - front: Compare British, French and Spanish relations with American Indians (Period 2 summary)
    back: |
      Spain: missions and labor demands, revolt, then accommodation. France: trade, alliances and intermarriage. Britain: settlement and displacement, punctuated by wars over land, with trade and diplomacy on the frontier.
    topic_code: "2.8"

quiz:
  description: |
    25 questions · about 35 minutes · about 70% this week (topics 2.5 to 2.8: American Indian resistance, slavery,
    colonial society and comparison in Period 2) and 30% review of weeks 3–4 and Period 1. Multiple choice,
    select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Equiano on the Middle Passage (2.6, review 2.4)
    - slug: apush-u02-w05-q01
      type: multiple_choice
      topic_code: "2.6"
      source: "Primary source: Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789), Project Gutenberg"
      points: 1
      stimulus: |
        "The stench of the hold while we were on the coast was so intolerably loathsome, that it was dangerous to remain there for any time ... but now that the whole ship's cargo were confined together, it became absolutely pestilential. The closeness of the place, and the heat of the climate, added to the number in the ship, which was so crowded that each had scarcely room to turn himself, almost suffocated us. ... This wretched situation was again aggravated by the galling of the chains, now become insupportable; and the filth of the necessary tubs, into which the children often fell, and were almost suffocated. The shrieks of the women, and the groans of the dying, rendered the whole a scene of horror almost inconceivable."

        — Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano, published in London, 1789
      prompt: |
        The conditions described in the excerpt are best understood in the context of which of the following?
      options:
        - "The movement of Scots-Irish immigrants into the Pennsylvania backcountry"
        - "The Great Migration of Puritan families to New England"
        - "The Middle Passage, the forced transport of enslaved Africans across the Atlantic to the Americas"
        - "The voyages of indentured servants from England to the Chesapeake"
      option_explanations:
        - |
          Scots-Irish immigrants were free migrants who came by sea to Philadelphia and then moved overland; the excerpt describes captives.
        - |
          Puritan families travelled as free passengers in the 1630s, with their goods; nothing in their experience matches chains and a "cargo" of people.
        - |
          Correct. Equiano describes the hold of a slave ship: chains, overcrowding, disease and death. These were the conditions of the Middle Passage endured by millions of captive Africans.
        - |
          Servants' voyages were often harsh, but servants were not chained in a hold, and the excerpt's "ship's cargo" of chained people describes slavery, not indenture.
      answer: 2
      explanation: |
        Contextualization: identify the historical situation of a source from its details.

    - slug: apush-u02-w05-q02
      type: multiple_choice
      topic_code: "2.6"
      source: "Primary source: Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789), Project Gutenberg; general knowledge"
      points: 1
      stimulus: |
        "The stench of the hold while we were on the coast was so intolerably loathsome, that it was dangerous to remain there for any time ... but now that the whole ship's cargo were confined together, it became absolutely pestilential. The closeness of the place, and the heat of the climate, added to the number in the ship, which was so crowded that each had scarcely room to turn himself, almost suffocated us. ... This wretched situation was again aggravated by the galling of the chains, now become insupportable; and the filth of the necessary tubs, into which the children often fell, and were almost suffocated. The shrieks of the women, and the groans of the dying, rendered the whole a scene of horror almost inconceivable."

        — Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano, published in London, 1789
      prompt: |
        Which of the following best describes the purpose of Equiano's narrative, published in 1789?
      options:
        - "To encourage British investors to buy shares in slave-trading companies"
        - "To recruit Africans to migrate voluntarily to the Americas"
        - "To defend the Navigation Acts against colonial smugglers"
        - "To persuade British readers to support ending the Atlantic slave trade by showing its cruelty from a survivor's point of view"
      option_explanations:
        - |
          The vivid horror of the excerpt would discourage, not encourage, investment in the trade. The point of view is that of a victim.
        - |
          The excerpt describes forced transport in chains; no reader could take it as an invitation.
        - |
          The Navigation Acts are unrelated to the narrative's subject; Equiano wrote about the slave trade's human cost.
        - |
          Correct. Equiano published in London as the British campaign against the slave trade gathered strength. His first-person testimony was aimed at readers who could pressure Parliament.
      answer: 3
      explanation: |
        Sourcing (purpose and audience): an autobiography published in London in 1789 was part of the British abolition campaign. Historians also debate whether Equiano was born in Africa, as he wrote, or in South Carolina, as some records suggest; either way the narrative matches other accounts of the Middle Passage.

    - slug: apush-u02-w05-q03
      type: multiple_choice
      topic_code: "2.4"
      source: "Primary source: Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789), Project Gutenberg; general knowledge"
      points: 1
      stimulus: |
        "The stench of the hold while we were on the coast was so intolerably loathsome, that it was dangerous to remain there for any time ... but now that the whole ship's cargo were confined together, it became absolutely pestilential. The closeness of the place, and the heat of the climate, added to the number in the ship, which was so crowded that each had scarcely room to turn himself, almost suffocated us. ... This wretched situation was again aggravated by the galling of the chains, now become insupportable; and the filth of the necessary tubs, into which the children often fell, and were almost suffocated. The shrieks of the women, and the groans of the dying, rendered the whole a scene of horror almost inconceivable."

        — Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano, published in London, 1789
      prompt: |
        Review. The voyage described in the excerpt was part of an Atlantic economy in which
      options:
        - "enslaved people were sent mainly to New England to work on large farms."
        - "African rulers had no role in the trade."
        - "only Spanish ships were permitted to carry enslaved Africans."
        - "New England merchants, Caribbean sugar planters and British manufacturers were all linked to the trade in enslaved people."
      option_explanations:
        - |
          Most captives went to the Caribbean and Brazil; in British North America they were concentrated in the plantation South.
        - |
          African states and merchants sold captives, often taken in wars, to European traders on the coast; the trade depended on that exchange, though Europeans drove the demand.
        - |
          British, Portuguese, Dutch, French and colonial ships all carried enslaved people; the Navigation Acts required English or colonial ships in English colonial trade.
        - |
          Correct. Rum, provisions, cloth and guns went to Africa, captives to the Caribbean and the southern colonies, and sugar and molasses back north and east. The slave trade tied every region of the British Atlantic together (week 4).
      answer: 3
      explanation: |
        Making connections (week 4 review): place one voyage within the whole system of trade.

    # ---- Stimulus set B: population data (2.6, review 2.3)
    - slug: apush-u02-w05-q04
      type: multiple_choice
      topic_code: "2.6"
      source: "U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970, Series Z 1–19 (estimated population of the American colonies), rounded"
      points: 1
      stimulus: |
        Estimated population of the British mainland colonies (rounded)

        | Year | Total population | Black population (almost all enslaved) | Black share of total |
        |---|---|---|---|
        | 1650 | 50,000 | 1,600 | about 3% |
        | 1700 | 251,000 | 28,000 | about 11% |
        | 1750 | 1,171,000 | 236,000 | about 20% |

        Source: U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970, Series Z 1–19.
      prompt: |
        Which of the following conclusions is best supported by the data?
      options:
        - "The Black population grew faster than the total population between 1650 and 1750."
        - "Enslaved people were a majority of the colonial population by 1750."
        - "The Black population was smaller in 1750 than in 1700."
        - "The total population declined between 1700 and 1750."
      option_explanations:
        - |
          Correct. The Black share rose from about 3% to about 20%, so the Black population grew faster than the total, mainly through the forced importation of enslaved Africans.
        - |
          The Black share in 1750 is about one-fifth, not a majority. (South Carolina alone had a Black majority, which the colony-wide figure hides.)
        - |
          The Black population rose from about 28,000 to about 236,000.
        - |
          The total rose more than fourfold, from about 251,000 to about 1,171,000.
      answer: 0
      explanation: |
        Analyzing data: compare rates of change by tracking the share, not just the raw numbers.

    - slug: apush-u02-w05-q05
      type: multiple_choice
      topic_code: "2.6"
      source: "U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970, Series Z 1–19 (estimated population of the American colonies), rounded; general knowledge"
      points: 1
      stimulus: |
        Estimated population of the British mainland colonies (rounded)

        | Year | Total population | Black population (almost all enslaved) | Black share of total |
        |---|---|---|---|
        | 1650 | 50,000 | 1,600 | about 3% |
        | 1700 | 251,000 | 28,000 | about 11% |
        | 1750 | 1,171,000 | 236,000 | about 20% |

        Source: U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970, Series Z 1–19.
      prompt: |
        Which of the following most directly contributed to the change in the Black share of the population between 1700 and 1750?
      options:
        - "The Great Awakening's encouragement of migration from Africa"
        - "The arrival of large numbers of free African merchants in northern ports"
        - "The abolition of slavery in the New England colonies"
        - "Southern planters' shift from indentured servants to enslaved Africans, together with the expansion of rice and tobacco plantations"
      option_explanations:
        - |
          The Great Awakening was a religious revival; it did not cause migration from Africa, and almost all Africans arrived in chains.
        - |
          The table notes the Black population was almost all enslaved; free Black migration was tiny.
        - |
          Slavery remained legal in every colony in 1750; abolition in New England came after the Revolution.
        - |
          Correct. After about 1680 Chesapeake planters bought enslaved Africans instead of servants, and Carolina rice planters relied on them from the start. Rising demand and supply (the end of the Royal African Company's monopoly in 1698) drove the increase.
      answer: 3
      explanation: |
        Causation: explain a trend in data with a specific historical development.

    - slug: apush-u02-w05-q06
      type: multiple_choice
      topic_code: "2.3"
      source: "U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970, Series Z 1–19 (estimated population of the American colonies), rounded; general knowledge"
      points: 1
      stimulus: |
        Estimated population of the British mainland colonies (rounded)

        | Year | Total population | Black population (almost all enslaved) | Black share of total |
        |---|---|---|---|
        | 1650 | 50,000 | 1,600 | about 3% |
        | 1700 | 251,000 | 28,000 | about 11% |
        | 1750 | 1,171,000 | 236,000 | about 20% |

        Source: U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970, Series Z 1–19.
      prompt: |
        Review. The data would be most useful to a historian investigating which of the following?
      options:
        - "Differences among the colonial regions, if the figures were broken down by colony"
        - "Wages paid to indentured servants"
        - "The religious beliefs of colonists"
        - "The number of American Indians living in the colonies' interior"
      option_explanations:
        - |
          Correct. Colony-wide totals hide large regional differences (week 4): South Carolina had a Black majority, Virginia a large minority, New England a few percent. Breaking the series down by colony would show how labor systems differed by region.
        - |
          The table contains no wage data, and servants were paid in passage, keep and freedom dues rather than wages.
        - |
          Population counts say nothing about belief. Church records or sermons would be needed.
        - |
          These colonial estimates count colonists and enslaved people, not independent Native nations beyond colonial borders.
      answer: 0
      explanation: |
        Sourcing a data source (limits and uses), with week 4 review of regional difference.

    # ---- Stimulus set C: the Pueblo Revolt (2.5, 2.8, review 2.2)
    - slug: apush-u02-w05-q07
      type: multiple_choice
      topic_code: "2.5"
      source: "Interpretation written for this course; general knowledge"
      points: 1
      stimulus: |
        Interpretation (written for this course):

        "The Pueblo Revolt of August 1680 was no spontaneous riot. Popé and other leaders sent runners carrying knotted cords to towns hundreds of miles apart, each knot counting down the days, and the rising came almost at once across the colony. Its targets were chosen: churches, friars and the symbols of a religion that had been forced on the Pueblos while their own ceremonies were banned. When the Spanish returned in 1692 they did not simply restore the old order. The friars were more cautious, the labor demands lighter, and the Pueblos were treated as allies against Apache and Comanche raids."
      prompt: |
        According to the author, which of the following was a major cause of the Pueblo Revolt?
      options:
        - "English settlers moving onto Pueblo lands"
        - "The Pueblos' desire to trade with the French"
        - "A dispute between rival Pueblo towns over water rights"
        - "Spanish suppression of Pueblo religious practices"
      option_explanations:
        - |
          There were no English settlers in New Mexico; the conflict was between the Pueblos and Spain.
        - |
          The French were far away in Canada and the Mississippi Valley in 1680; the passage does not mention them.
        - |
          The author stresses coordination among towns against the Spanish, not rivalry between them.
        - |
          Correct. The author says the revolt targeted churches and friars because a foreign religion had been forced on the Pueblos while their own ceremonies were banned.
      answer: 3
      explanation: |
        Identify an author's causal claim in a secondary source.

    - slug: apush-u02-w05-q08
      type: multiple_choice
      topic_code: "2.8"
      source: "Interpretation written for this course; general knowledge"
      points: 1
      stimulus: |
        Interpretation (written for this course):

        "The Pueblo Revolt of August 1680 was no spontaneous riot. Popé and other leaders sent runners carrying knotted cords to towns hundreds of miles apart, each knot counting down the days, and the rising came almost at once across the colony. Its targets were chosen: churches, friars and the symbols of a religion that had been forced on the Pueblos while their own ceremonies were banned. When the Spanish returned in 1692 they did not simply restore the old order. The friars were more cautious, the labor demands lighter, and the Pueblos were treated as allies against Apache and Comanche raids."
      prompt: |
        The outcome of the Pueblo Revolt differed most from the outcome of Metacom's War (1675–1676) in New England in that
      options:
        - "the Pueblos were allied with the English, while Metacom was allied with the Spanish"
        - "the Pueblo Revolt ended with a French victory, while Metacom's War ended with a Dutch victory"
        - "the Pueblos won lasting concessions from the Spanish, while Metacom's defeat broke Native power in southern New England"
        - "the Pueblos were sold into slavery in the Caribbean, while Metacom's followers kept their lands"
      option_explanations:
        - |
          The Pueblos fought Spain and Metacom fought the English colonies; these alliances are invented.
        - |
          Neither war involved French or Dutch victories; they were wars against Spain and against the New England colonies.
        - |
          Correct. Although the Spanish returned, they tolerated more Pueblo practice and eased demands. After Metacom's War, English colonists killed or sold many survivors into Caribbean slavery and took their land.
        - |
          This reverses the outcomes: Metacom's defeated followers were sold into slavery, and the Pueblos kept their towns.
      answer: 2
      explanation: |
        Comparison (2.8): compare outcomes of Native resistance in two empires and explain why they differed (the small Spanish population needed Pueblo allies; English colonists were numerous and wanted land).

    - slug: apush-u02-w05-q09
      type: multiple_choice
      topic_code: "2.2"
      source: "Interpretation written for this course; general knowledge"
      points: 1
      stimulus: |
        Interpretation (written for this course):

        "The Pueblo Revolt of August 1680 was no spontaneous riot. Popé and other leaders sent runners carrying knotted cords to towns hundreds of miles apart, each knot counting down the days, and the rising came almost at once across the colony. Its targets were chosen: churches, friars and the symbols of a religion that had been forced on the Pueblos while their own ceremonies were banned. When the Spanish returned in 1692 they did not simply restore the old order. The friars were more cautious, the labor demands lighter, and the Pueblos were treated as allies against Apache and Comanche raids."
      prompt: |
        Review. The Spanish policies that provoked the revolt were most consistent with which goal of Spanish colonization in North America?
      options:
        - "Converting American Indians to Catholicism and drawing on their labor and tribute"
        - "Creating a fur-trading partnership based on intermarriage"
        - "Building a large settler population of English-speaking farmers"
