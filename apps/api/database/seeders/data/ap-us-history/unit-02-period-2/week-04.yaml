week: 4
unit: 2
title: "The Regions of British North America and the Atlantic Economy"
topics: ["2.3", "2.4"]
guide: guides/week-04.md
guide_description: |
  How environment, religion and labor made New England, the Middle Colonies, the Chesapeake, the Lower South and
  the British West Indies into distinct societies, how colonists built traditions of self-government, and how
  mercantilism and the Navigation Acts tied them into an Atlantic economy. Worked examples: a regional comparison
  table turned into a thesis, an SAQ on the Fundamental Orders answered part by part, and a causation chain from
  the Navigation Acts to the Dominion of New England and salutary neglect.
flashcards_description: |
  32 cards on the colonial regions, colonial self-government, mercantilism, the Navigation Acts and the Atlantic
  trading system.

flashcards:
  - front: New England colonies → economy, society, religion in one line each
    back: |
      Economy: small family farms, fishing, timber, shipbuilding and Atlantic trade. Society: compact towns of families with a balanced sex ratio and long lives. Religion: Puritan Congregationalism, with church and town closely linked.
    topic_code: "2.3"
  - front: Middle Colonies → which colonies and what made them distinctive
    back: |
      New York, New Jersey, Pennsylvania and Delaware. Fertile soil grew wheat and other grains for export (the "breadbasket"), and the region was the most ethnically and religiously diverse in British America: English, Dutch, Germans, Scots-Irish, Quakers and others.
    topic_code: "2.3"
  - front: Chesapeake colonies → economy and labor
    back: |
      Virginia and Maryland grew tobacco for export on dispersed riverfront plantations. In the 1600s most labor came from English indentured servants; by the early 1700s enslaved Africans had become the main labor force.
    topic_code: "2.3"
  - front: Lower South (Carolinas and Georgia) → crops and labor
    back: |
      Rice and, from the 1740s, indigo, grown on plantations worked by enslaved Africans who formed a majority of South Carolina's population by the early 1700s. Many early Carolina planters came from Barbados and brought its slave system with them.
    topic_code: "2.3"
  - front: British West Indies (Barbados, Jamaica) → why they mattered most to the empire
    back: |
      Sugar made the Caribbean islands the most valuable English colonies. Planters worked enslaved Africans to death at a terrible rate and relied on mainland colonies for food, timber and horses, which tied New England and the Middle Colonies into the slave economy.
    topic_code: "2.3"
  - front: Headright system (Virginia, 1618) → how it worked and its effect
    back: |
      Anyone who paid a person's passage to Virginia received fifty acres per head. It rewarded planters who imported servants (and later enslaved people) with land, concentrating land and labor in the hands of the wealthy.
    topic_code: "2.3"
  - front: Indentured servitude → terms and why it declined in the Chesapeake
    back: |
      A servant traded four to seven years of labor for passage, food and shelter, and sometimes "freedom dues" at the end. It declined after the 1670s as English wages rose, fewer people emigrated, freed servants demanded land (Bacon's Rebellion) and enslaved Africans became more available.
    topic_code: "2.3"
  - front: House of Burgesses (1619) → what it was and its significance
    back: |
      Virginia's elected assembly, the first representative legislature in English America. Only property-owning men voted, but it established that colonists would make local laws through their own representatives.
    topic_code: "2.3"
  - front: Fundamental Orders of Connecticut (1639) → significance
    back: |
      A frame of government adopted by the river towns of Windsor, Hartford and Wethersfield. Often called the first written constitution in English America, it created an elected governor and assembly by the towns' own agreement.
    topic_code: "2.3"
  - front: New England town meeting → what it shows
    back: |
      Adult male church members (later most property-owning men) met to decide local matters such as land division, taxes and schools. It built a habit of local self-government and participation that colonists later defended against Parliament.
    topic_code: "2.3"
  - front: Roger Williams (Rhode Island, 1636) → why banished and what he founded
    back: |
      A minister banished from Massachusetts Bay for arguing that civil government should not enforce religion and that colonists must buy land fairly from American Indians. He founded Providence, and Rhode Island became a refuge with separation of church and state and broad religious freedom.
    topic_code: "2.3"
  - front: Anne Hutchinson → challenge and outcome
    back: |
      She held meetings in her Boston home that criticised ministers and taught that salvation came through an inner experience of grace, not good works. Tried and banished in 1638, she challenged both Puritan religious authority and expectations of women.
    topic_code: "2.3"
  - front: Halfway Covenant (1662) → problem it solved and what it shows
    back: |
      Children of baptised but unconverted Puritans could be baptised and become partial church members. It responded to falling numbers of conversion experiences in the second generation, a sign of declining religious zeal in New England.
    topic_code: "2.3"
  - front: Maryland Toleration Act (1649) → what it protected and its limit
    back: |
      Passed in Lord Baltimore's colony, a Catholic refuge with a Protestant majority, it protected the free exercise of religion for people who professed belief in Jesus Christ. It did not protect non-Christians, and it was repealed for a time when Protestants took control.
    topic_code: "2.3"
  - front: William Penn's "Holy Experiment" (1681) → what it was
    back: |
      Penn, a Quaker, received Pennsylvania as a proprietary grant from Charles II. He offered religious freedom, representative government, fair dealing with the Lenape (Delaware) and cheap land, attracting English, Welsh, German and Scots-Irish settlers.
    topic_code: "2.3"
  - front: Quakers (Society of Friends) → beliefs that shaped Pennsylvania
    back: |
      Belief in an "inner light" in every person, pacifism, no paid clergy, a larger role for women in worship, and opposition to oaths. These led to religious tolerance and, over time, some of the earliest colonial opposition to slavery.
    topic_code: "2.3"
  - front: Georgia (1732) → founder and two purposes
    back: |
      James Oglethorpe and the trustees founded Georgia as a buffer between South Carolina and Spanish Florida and as a fresh start for poor but respectable English families. The trustees banned slavery in 1735, but planters pressed for it and it was legalised in 1751.
    topic_code: "2.3"
  - front: Why did New England colonists live longer than Chesapeake colonists in the 1600s?
    back: |
      New England had a cold climate with clean water and fewer mosquito-borne diseases; the Chesapeake's warm, swampy lowlands bred malaria and typhoid. Families in New England could see grandchildren; in the Chesapeake many children lost a parent.
    topic_code: "2.3"
  - front: Compare the reasons people migrated to New England and to the Chesapeake
    back: |
      New England: religious families seeking to build a godly community, many with modest property. Chesapeake: mostly young, single, poor men seeking work and land, many as indentured servants. Different motives produced different societies.
    topic_code: "2.3"
  - front: Mercantilism → definition
    back: |
      The economic theory that a nation's power depends on accumulating wealth (especially gold and silver) through a favourable balance of trade. Colonies existed to supply raw materials and buy the mother country's manufactured goods.
    topic_code: "2.4"
  - front: Navigation Acts (1651, 1660, 1663, 1696) → three main rules
    back: |
      Trade with English colonies had to be carried in English or colonial ships with mostly English crews; "enumerated" goods such as sugar and tobacco could be shipped only to England; and most European goods bound for the colonies had to pass through England first.
    topic_code: "2.4"
  - front: Enumerated goods → definition and examples
    back: |
      Colonial products that the Navigation Act of 1660 allowed to be shipped only to England or other English colonies, starting with sugar, tobacco, cotton, indigo, ginger and dyewoods. England captured the profits of re-exporting them to Europe.
    topic_code: "2.4"
  - front: Dominion of New England (1686–1689) → what and why it failed
    back: |
      James II merged the New England colonies (later New York and New Jersey too) under Governor Sir Edmund Andros, abolishing their assemblies and enforcing the Navigation Acts. When news of the Glorious Revolution reached Boston in 1689, colonists overthrew Andros and the Dominion collapsed.
    topic_code: "2.4"
  - front: Glorious Revolution (1688–1689) → effect on the colonies
    back: |
      Parliament replaced James II with William and Mary. Colonists rose against James's governors in Boston, New York and Maryland, assemblies were restored, and colonists came to see Parliament's victory over royal power as a defence of English liberties that they shared.
    topic_code: "2.4"
  - front: Salutary neglect → meaning and when
    back: |
      The British practice, especially under Prime Minister Robert Walpole (1720s to early 1740s), of loosely enforcing trade laws so long as the colonies stayed loyal and profitable. It let colonial assemblies grow strong and smuggling flourish.
    topic_code: "2.4"
  - front: Molasses Act (1733) → what it did and what happened
    back: |
      It taxed molasses that colonists imported from French and other foreign Caribbean islands, to protect British sugar planters. Colonial merchants evaded it through widespread smuggling, a sign of salutary neglect.
    topic_code: "2.4"
  - front: Triangular trade → the classic route and a caution
    back: |
      Rum from New England to West Africa, enslaved Africans to the West Indies, sugar and molasses back to New England. Historians caution that actual trade was a web of many routes, but the model shows how the colonies were tied to the slave trade.
    topic_code: "2.4"
  - front: Atlantic economy → what each region supplied
    back: |
      New England: fish, timber, ships and shipping services. Middle Colonies: wheat and flour. Chesapeake: tobacco. Lower South: rice and indigo. West Indies: sugar. Britain: manufactured goods and credit. West Africa: enslaved people, through African and European traders.
    topic_code: "2.4"
  - front: Consumer revolution (1700s) → what changed
    back: |
      Rising colonial incomes and cheap British goods let colonists buy imported cloth, ceramics, tea and furniture. Shared consumption tied colonists more closely to British culture (Anglicization) and also to British credit.
    topic_code: "2.4"
  - front: Navigation Acts → one way colonists benefited
    back: |
      Colonial-built and colonial-owned ships counted as English, so New England shipbuilding and shipping thrived, and colonial goods were protected inside the empire's market. The acts were a burden for some but a boon for others.
    topic_code: "2.4"
  - front: Which theme? Colonial assemblies controlling taxes and governors' salaries
    back: |
      Politics and Power (PCE): colonial assemblies modelled themselves on the House of Commons and used the power of the purse against royal governors, building the self-government that Britain would challenge after 1763.
    topic_code: "2.3"
  - front: Iron Act (1750), Hat Act (1732), Wool Act (1699) → common purpose
    back: |
      Each restricted colonial manufacturing or export of a product that competed with British makers. They show the mercantilist idea that colonies should supply raw materials and buy British manufactures.
    topic_code: "2.4"

