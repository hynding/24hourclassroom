  questions:
    # ---- Stimulus set A: Navigation Act of 1660 (2.4, review 1.4)
    - slug: apush-u02-w04-q01
      type: multiple_choice
      topic_code: "2.4"
      source: "Primary source: An Act for the Encourageing and increasing of Shipping and Navigation (12 Charles II c. 18, 1660), legislation.gov.uk"
      points: 1
      stimulus: |
        "... from thence forward noe Goods or Commodities whatsoever shall be Imported into or Exported out of any Lands Islelands Plantations or Territories to his Majesty belonging or in his possession ... in Asia Africa or America in any other Ship or Ships Vessell or Vessells whatsoever but in such Ships or Vessells as doe truely and without fraude belong onely to the people of England or Ireland Dominion of Wales or Towne of Berwicke upon Tweede, or are of the built of, and belonging to any of the said Lands Islands Plantations or Territories as the Proprietors and right Owners therof and wherof the Master and three fourthes of the Mariners at least are English ..."

        — Act of Parliament (the Navigation Act), 1660
      prompt: |
        The excerpt most directly reflects which economic idea?
      options:
        - "Laissez-faire capitalism, in which government avoids regulating commerce"
        - "Mercantilism, in which colonies serve to enrich the mother country through controlled trade"
        - "Subsistence farming, in which families produce only what they consume"
        - "Free trade, in which merchants of all nations may trade wherever they choose"
      option_explanations:
        - |
          Laissez-faire is the absence of regulation; the excerpt is detailed regulation of which ships and crews may trade.
        - |
          Correct. By reserving colonial trade for English and colonial ships and crews, Parliament aimed to keep the profits of carrying and selling colonial goods inside the empire, the core of mercantilist policy.
        - |
          Subsistence farming describes household production, not imperial trade law. The act concerns exports and imports across the Atlantic.
        - |
          The act does the opposite: it bars foreign ships from colonial trade. Free trade would let Dutch or French ships carry colonial goods.
      answer: 1
      explanation: |
        Sourcing (purpose): Parliament wanted to drive Dutch carriers out of English colonial trade. Mercantilism is the idea behind that purpose.

    - slug: apush-u02-w04-q02
      type: multiple_choice
      topic_code: "2.4"
      source: "Primary source: An Act for the Encourageing and increasing of Shipping and Navigation (12 Charles II c. 18, 1660), legislation.gov.uk"
      points: 1
      stimulus: |
        "... from thence forward noe Goods or Commodities whatsoever shall be Imported into or Exported out of any Lands Islelands Plantations or Territories to his Majesty belonging or in his possession ... in Asia Africa or America in any other Ship or Ships Vessell or Vessells whatsoever but in such Ships or Vessells as doe truely and without fraude belong onely to the people of England or Ireland Dominion of Wales or Towne of Berwicke upon Tweede, or are of the built of, and belonging to any of the said Lands Islands Plantations or Territories as the Proprietors and right Owners therof and wherof the Master and three fourthes of the Mariners at least are English ..."

        — Act of Parliament (the Navigation Act), 1660
      prompt: |
        Which colonial group was most likely to benefit from the provision in the excerpt?
      options:
        - "Dutch merchants who had carried much of English colonial trade before 1660"
        - "New England shipbuilders and merchants, because ships built and owned in the colonies counted as English"
        - "French fur traders on the St. Lawrence"
        - "Chesapeake tobacco planters who wanted to sell directly to Dutch merchants"
      option_explanations:
        - |
          The Dutch were the main target. The act was meant to squeeze them out of English colonial commerce, and it contributed to the Anglo-Dutch wars.
        - |
          Correct. Because the act counts ships "of the built of, and belonging to" the colonies as lawful carriers, New England's shipyards and merchant fleet gained a protected market inside the empire.
        - |
          The act governed English possessions; French traders were rivals excluded from English colonial trade, not beneficiaries.
        - |
          Planters lost the option of selling to the Dutch, who often paid more and charged less for shipping. This group was burdened, not helped.
      answer: 1
      explanation: |
        Sourcing and analysis (effects on different groups): an imperial law burdened some colonists and benefited others. Read the qualifying clause about colonial ships closely.

    - slug: apush-u02-w04-q03
      type: multiple_choice
      topic_code: "1.4"
      source: "Primary source: An Act for the Encourageing and increasing of Shipping and Navigation (12 Charles II c. 18, 1660), legislation.gov.uk; general knowledge"
      points: 1
      stimulus: |
        "... from thence forward noe Goods or Commodities whatsoever shall be Imported into or Exported out of any Lands Islelands Plantations or Territories to his Majesty belonging or in his possession ... in Asia Africa or America in any other Ship or Ships Vessell or Vessells whatsoever but in such Ships or Vessells as doe truely and without fraude belong onely to the people of England or Ireland Dominion of Wales or Towne of Berwicke upon Tweede, or are of the built of, and belonging to any of the said Lands Islands Plantations or Territories as the Proprietors and right Owners therof and wherof the Master and three fourthes of the Mariners at least are English ..."

        — Act of Parliament (the Navigation Act), 1660
      prompt: |
        Review. The policy in the excerpt was most similar to which earlier policy of the Spanish empire?
      options:
        - "The Treaty of Tordesillas dividing the world with Portugal"
        - "The Valladolid debate over the treatment of American Indians"
        - "The requirement that trade between Spain and its American colonies pass through licensed ports and fleets controlled by the crown"
        - "The introduction of horses and cattle to the Americas"
      option_explanations:
        - |
          Tordesillas divided territorial claims between two crowns; it did not regulate who could carry colonial trade.
        - |
          Valladolid was a moral and legal debate about Native peoples, not a trade law.
        - |
          Correct. Spain channelled American trade through Seville and royal convoy fleets to keep silver and colonial commerce under crown control. England's Navigation Acts applied the same mercantilist logic a century later.
        - |
          The spread of livestock was part of the Columbian Exchange, an ecological process rather than a policy of trade control.
      answer: 2
      explanation: |
        Comparison and continuity (Period 1 review): both empires treated colonial trade as a royal or national monopoly to be guarded from rivals.

    # ---- Stimulus set B: Maryland Toleration Act (2.3, review 2.2)
    - slug: apush-u02-w04-q04
      type: multiple_choice
      topic_code: "2.3"
      source: "Primary source: Maryland Toleration Act (1649), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "And whereas the inforceing of the conscience in matters of Religion hath frequently fallen out to be of dangerous Consequence in those commonwealthes where it hath been practised, And for the more quiett and peaceable governement of this Province, and the better to preserve mutuall Love and amity amongst the Inhabitants thereof, Be it Therefore also by the Lord Proprietary with the advise and consent of this Assembly Ordeyned and enacted ... that noe person or persons whatsoever within this Province ... professing to beleive in Jesus Christ, shall from henceforth bee any waies troubled, Molested or discountenanced for or in respect of his or her religion nor in the free exercise thereof ..."

        — Act Concerning Religion, passed by the Maryland Assembly, 1649
      prompt: |
        Which of the following best explains the historical situation in which the act was passed?
      options:
        - "Maryland had just been conquered from the Dutch."
        - "Maryland's Quaker founder wanted to abolish all established churches."
        - "Maryland was founded as a refuge for English Catholics, but Protestants made up a growing majority of its settlers."
        - "Maryland was governed by Puritan ministers who wished to convert Catholics."
      option_explanations:
        - |
          The Dutch colony England conquered was New Netherland in 1664. Maryland was granted to Lord Baltimore in 1632.
        - |
          The Quaker founder was William Penn of Pennsylvania, chartered in 1681.
        - |
          Correct. Lord Baltimore, a Catholic proprietor, needed Protestant settlers to make the colony pay, while England itself was in civil war between king and a Puritan-led Parliament. Toleration protected the Catholic minority by protecting all Christians.
        - |
          Maryland was governed by the Catholic Lord Baltimore and an assembly. Puritans did briefly seize power after 1654 and suspended the act, which shows the danger the act tried to prevent.
      answer: 2
      explanation: |
        Sourcing (historical situation): a toleration law makes sense once you see who governed Maryland and who settled it.

    - slug: apush-u02-w04-q05
      type: multiple_choice
      topic_code: "2.3"
      source: "Primary source: Maryland Toleration Act (1649), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "And whereas the inforceing of the conscience in matters of Religion hath frequently fallen out to be of dangerous Consequence in those commonwealthes where it hath been practised, And for the more quiett and peaceable governement of this Province, and the better to preserve mutuall Love and amity amongst the Inhabitants thereof, Be it Therefore also by the Lord Proprietary with the advise and consent of this Assembly Ordeyned and enacted ... that noe person or persons whatsoever within this Province ... professing to beleive in Jesus Christ, shall from henceforth bee any waies troubled, Molested or discountenanced for or in respect of his or her religion nor in the free exercise thereof ..."

        — Act Concerning Religion, passed by the Maryland Assembly, 1649
      prompt: |
        Which of the following best describes a limitation of the toleration in the excerpt?
      options:
        - "It applied only to enslaved Africans."
        - "It protected only Christians, leaving Jews and other non-Christians outside its protection."
        - "It allowed the governor to compel colonists to attend Catholic Mass."
        - "It protected only members of the Church of England."
      option_explanations:
        - |
          The act concerns all inhabitants' religion; it says nothing about enslaved people in particular.
        - |
          Correct. Protection is conditioned on professing belief in Jesus Christ. Toleration in 1649 meant tolerance among Christians, not religious freedom for all.
        - |
          The excerpt forbids compelling anyone in religion; the stated danger is "inforceing of the conscience".
        - |
          The excerpt protects anyone "professing to beleive in Jesus Christ", which includes Catholics and Protestant dissenters, not just Anglicans.
      answer: 1
      explanation: |
        Close reading and argumentation: a qualification in the text ("professing to beleive in Jesus Christ") limits a broad-sounding claim. Avoid reading modern religious liberty into a 1649 law.

    - slug: apush-u02-w04-q06
      type: multiple_choice
      topic_code: "2.2"
      source: "Primary source: Maryland Toleration Act (1649), Avalon Project, Yale Law School; general knowledge"
      points: 1
      stimulus: |
        "And whereas the inforceing of the conscience in matters of Religion hath frequently fallen out to be of dangerous Consequence in those commonwealthes where it hath been practised, And for the more quiett and peaceable governement of this Province, and the better to preserve mutuall Love and amity amongst the Inhabitants thereof, Be it Therefore also by the Lord Proprietary with the advise and consent of this Assembly Ordeyned and enacted ... that noe person or persons whatsoever within this Province ... professing to beleive in Jesus Christ, shall from henceforth bee any waies troubled, Molested or discountenanced for or in respect of his or her religion nor in the free exercise thereof ..."

        — Act Concerning Religion, passed by the Maryland Assembly, 1649
      prompt: |
        Review. The practical tolerance described in the excerpt was most similar to the situation in which other colony of the mid-1600s?
      options:
        - "Massachusetts Bay, where dissenters such as Anne Hutchinson were banished"
        - "New Mexico, where Spanish friars suppressed Pueblo religious ceremonies"
        - "New Netherland, where the Dutch tolerated a mix of religious groups largely to keep commerce flowing"
        - "New France, where only Catholics were allowed to settle"
      option_explanations:
        - |
          Massachusetts Bay enforced Puritan orthodoxy and expelled dissenters, the opposite of toleration.
        - |
          The Spanish suppressed Pueblo religion, one of the grievances that led to the Pueblo Revolt of 1680.
        - |
          Correct. New Amsterdam's mixed population of Reformed, Lutheran, Jewish and other residents was tolerated, often grudgingly, because the West India Company valued trade over uniformity. Like Maryland, toleration was practical rather than idealistic.
        - |
          The French crown restricted settlement in New France to Catholics after 1627, the reverse of toleration.
      answer: 2
      explanation: |
        Comparison (week 3 review): in both Maryland and New Netherland, toleration served practical goals: peace among settlers and profit.

    # ---- Stimulus set C: salutary neglect (2.4, review 2.1)
    - slug: apush-u02-w04-q07
      type: multiple_choice
      topic_code: "2.4"
      source: "Interpretation written for this course; general knowledge"
      points: 1
      stimulus: |
        Interpretation (written for this course):

        "On paper, the British Atlantic of the early 1700s was a tightly managed machine. Navigation Acts dictated which ships could carry which goods to which ports, and the Molasses Act of 1733 taxed sugar products from foreign islands. In practice, customs posts were few, officers were underpaid and often bribed, and London ministers cared more about keeping the colonies loyal and buying British goods than about collecting small duties. Colonial merchants learned to trade with the French and Dutch islands almost openly, and colonial assemblies learned to govern themselves."
      prompt: |
        The practice described in the excerpt is most commonly called
      options:
        - "the encomienda system"
        - "the Halfway Covenant"
        - "the headright system"
        - "salutary neglect"
      option_explanations:
        - |
          Encomienda was a Spanish grant of Native labor and tribute in Period 1.
        - |
          The Halfway Covenant (1662) changed Puritan church membership rules; it has nothing to do with trade enforcement.
        - |
          The headright system granted land in Virginia to those who paid for settlers' passage. It concerns land and labor, not imperial enforcement.
        - |
          Correct. Salutary neglect, associated especially with Robert Walpole's ministry, meant lax enforcement of trade laws while the colonies stayed loyal and profitable.
      answer: 3
      explanation: |
        Identify a historical concept from a description. Know the term and its consequences: smuggling and strong assemblies.

    - slug: apush-u02-w04-q08
      type: multiple_choice
      topic_code: "2.4"
      source: "Interpretation written for this course; general knowledge"
      points: 1
      stimulus: |
        Interpretation (written for this course):

        "On paper, the British Atlantic of the early 1700s was a tightly managed machine. Navigation Acts dictated which ships could carry which goods to which ports, and the Molasses Act of 1733 taxed sugar products from foreign islands. In practice, customs posts were few, officers were underpaid and often bribed, and London ministers cared more about keeping the colonies loyal and buying British goods than about collecting small duties. Colonial merchants learned to trade with the French and Dutch islands almost openly, and colonial assemblies learned to govern themselves."
      prompt: |
        Which of the following developments from earlier in the period represents the strongest exception to the pattern the author describes?
      options:
        - "The growth of tobacco exports from the Chesapeake"
        - "The Dominion of New England (1686–1689), which abolished colonial assemblies and tried to enforce the Navigation Acts strictly"
        - "The founding of the House of Burgesses in 1619"
        - "The founding of Pennsylvania as a proprietary colony"
      option_explanations:
        - |
          Growing exports fit the picture of a profitable, loyal colonial economy and are no exception.
        - |
          Correct. Under James II, Governor Andros ruled New England without an elected assembly and pressed trade enforcement. The colonists' overthrow of the Dominion in 1689 helped make later ministers cautious.
        - |
          The House of Burgesses is an example of colonial self-government, which fits the author's pattern rather than breaking it.
        - |
          Penn's charter gave the colony an elected assembly and broad liberties, which fits the pattern of colonial self-government.
      answer: 1
      explanation: |
        Continuity and change: identify a period when imperial control tightened, and see how its failure helped produce the looser practice that followed.

    - slug: apush-u02-w04-q09
      type: multiple_choice
      topic_code: "2.1"
      source: "Interpretation written for this course; general knowledge"
      points: 1
      stimulus: |
        Interpretation (written for this course):

        "On paper, the British Atlantic of the early 1700s was a tightly managed machine. Navigation Acts dictated which ships could carry which goods to which ports, and the Molasses Act of 1733 taxed sugar products from foreign islands. In practice, customs posts were few, officers were underpaid and often bribed, and London ministers cared more about keeping the colonies loyal and buying British goods than about collecting small duties. Colonial merchants learned to trade with the French and Dutch islands almost openly, and colonial assemblies learned to govern themselves."
      prompt: |
        Review. The degree of colonial self-government described in the excerpt most clearly distinguished the British colonies from which of the following?
      options:
        - "New France and the Spanish borderlands, which were ruled by royal officials without elected colonial assemblies"
        - "The Haudenosaunee Confederacy, which had no form of government"
        - "The Dutch Republic, which had no merchants"
        - "Barbados, which had no colonial assembly at all"
      option_explanations:
        - |
          Correct. France and Spain governed their American colonies through crown-appointed governors, intendants and viceroys. British colonists' habit of electing assemblies was a key difference between the empires.
        - |
          The Haudenosaunee had a sophisticated confederacy governed by a Grand Council of sachems. This option repeats a false stereotype.
        - |
          The Dutch Republic was Europe's great merchant power. This option is factually wrong.
        - |
          Barbados had an elected assembly from 1639; like the mainland colonies, it was part of the British pattern.
      answer: 0
      explanation: |
        Comparison (week 3 review): political structures differed across empires as much as economic goals did.

    # ---- Single items: this week
    - slug: apush-u02-w04-q10
      type: multiple_choice
      topic_code: "2.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains why New England developed compact towns rather than dispersed plantations in the 1600s?
      options:
