    - slug: apush-u02-w04-q23
      type: short_answer
      topic_code: "2.3"
      source: "Primary source: Fundamental Orders of Connecticut (1639), Avalon Project, Yale Law School"
      points: 3
      stimulus: |
        "For as much as it hath pleased Almighty God by the wise disposition of his divine providence so to order and dispose of things that we the Inhabitants and Residents of Windsor, Hartford and Wethersfield are now cohabiting and dwelling in and upon the River of Connectecotte and the lands thereunto adjoining; and well knowing where a people are gathered together the word of God requires that to maintain the peace and union of such a people there should be an orderly and decent Government established according to God, ... do therefore associate and conjoin ourselves to be as one Public State or Commonwealth ..."

        — Fundamental Orders of Connecticut, 1639 (modernised spelling as printed by the Avalon Project)
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe ONE purpose of the document as expressed in the excerpt.
        (b) Briefly explain ONE way the religious beliefs of the authors shaped the document.
        (c) Briefly explain ONE way the document reflects a broader pattern in the development of the British colonies from 1607 to 1754.
      answer: |
        (a) The document's purpose is to create an orderly government for the river towns of Windsor, Hartford and Wethersfield by the settlers' own agreement, so that they could keep "peace and union" among themselves.

        (b) The authors were Puritans who believed that God's word required ordered government; they describe their settlement as an act of providence and promise a government "according to God", echoing the Puritan idea of a covenant binding a godly community.

        (c) It reflects the growth of colonial self-government: like the Mayflower Compact (1620), the House of Burgesses (1619) and New England town meetings, it shows English colonists creating their own representative institutions, a habit strengthened by distance from England and later by salutary neglect.
      explanation: |
        Three points, one per part.

        (a) 1 pt: describes a purpose, e.g. to establish government for the three towns; to preserve peace and union; to unite the towns as one commonwealth. Zero for purposes not in the excerpt (e.g. "to declare independence").

        (b) 1 pt: explains a religious influence, e.g. providence, government "according to God", covenant theology, Puritan community ideals. Must connect belief to the document, not just say "they were religious".

        (c) 1 pt: explains a broader pattern with specific support, e.g. self-government by compact (Mayflower Compact), representative assemblies (House of Burgesses), town meetings, Puritan migration from Massachusetts to Connecticut, assemblies growing in power under salutary neglect. Zero for patterns outside 1607–1754 unless explicitly linked back to them.

    - slug: apush-u02-w04-q24
      type: short_answer
      topic_code: "2.4"
      source: "general knowledge"
      points: 3
      stimulus: |
        Description of a non-text source: a teaching diagram of Atlantic trade around 1750. Arrows run from Britain to the North American colonies (labelled "cloth, tools, ceramics, tea"), from New England to the British and French West Indies ("fish, timber, horses, flour"), from the West Indies to New England ("molasses, sugar"), from New England to West Africa ("rum"), from West Africa to the West Indies and the Chesapeake and Carolina ("enslaved Africans"), and from the Chesapeake and Carolina to Britain ("tobacco, rice, indigo"). A note at the bottom says the arrows show common routes, not a fixed triangle.
      prompt: |
        Using the diagram described above, answer (a), (b) and (c).

        (a) Briefly describe ONE way the diagram shows that the economies of the northern and southern colonies were connected through Atlantic trade.
        (b) Briefly explain ONE way British policy attempted to regulate the trade shown in the diagram between 1660 and 1754.
        (c) Briefly explain ONE way the trade shown in the diagram affected the development of slavery in the Americas.
      answer: |
        (a) New England shipped fish, timber and flour to feed and build the West Indian sugar plantations and carried rum to West Africa, so northern merchants profited from the same plantation system that grew tobacco and rice in the South.

        (b) The Navigation Acts required colonial trade to be carried in English or colonial ships and required enumerated goods such as tobacco, sugar and indigo to be shipped only to England, while the Molasses Act of 1733 taxed molasses from the French islands to favour British planters.

        (c) The demand for sugar, tobacco and rice drove the forced migration of enslaved Africans; as colonial trade grew, planters in the West Indies, the Chesapeake and the Carolinas bought more enslaved people, making slavery the foundation of the most valuable colonial economies.
      explanation: |
        Three points, one per part.

        (a) 1 pt: describes a connection visible in the diagram, e.g. northern provisions sustaining West Indian plantations; New England rum traded for enslaved people; northern shipping carrying southern goods. Must connect North and South (or North and the West Indies) through trade.

        (b) 1 pt: explains a specific policy: Navigation Acts (English ships and crews; enumerated goods; goods routed through England), the Molasses Act (1733), restrictions on colonial manufacturing (Wool, Hat, Iron Acts), the Dominion of New England's enforcement. Zero for post-1763 laws such as the Stamp Act.

        (c) 1 pt: explains an effect on slavery, e.g. rising demand for enslaved labor on cash-crop plantations; the scale of the slave trade to the Caribbean; northern merchants' profit from and involvement in the slave trade; South Carolina's African majority. Zero for vague answers ("trade made slavery worse") with no mechanism.

    - slug: apush-u02-w04-q25
      type: long_answer
      topic_code: "2.3"
      source: "general knowledge"
      points: 6
      prompt: |
        English colonists settled both New England and the Chesapeake in the early seventeenth century, yet the two regions developed very differently. Historians have explained the differences by pointing to the environment, the motives and backgrounds of the colonists, religion, and labor systems.

        Evaluate the extent of difference between the development of New England and the Chesapeake from 1607 to 1754.
      answer: |
        Thesis: New England and the Chesapeake differed sharply in economy, society and religion because they were settled by different kinds of people for different reasons in different environments; yet both built strong traditions of self-government and both were drawn into the slave-based Atlantic economy, so the difference was great but not complete.

        Context: England's population growth, enclosure and religious conflict between the Church of England and Puritans pushed both waves of migration; joint-stock companies financed them; Native nations such as the Powhatan and the Wampanoag already occupied both regions.

        Body 1 (economy and environment): Chesapeake tobacco, dispersed plantations, headright system, soil exhaustion; New England small farms, fishing, timber, shipbuilding, trade.
        Body 2 (society and labor): Chesapeake young male indentured servants, high death rates, shift to enslaved Africans after Bacon's Rebellion (1676) and slave codes; New England family migration, long lives, compact towns, schools.
        Body 3 (religion and politics): Puritan covenant communities, town meetings, Halfway Covenant; Anglican establishment in Virginia, Maryland's Toleration Act; but both had elected assemblies (House of Burgesses 1619; Massachusetts General Court).
        Complexity: similarities in self-government and in ties to slavery (New England merchants in the West Indies trade); the regions converged somewhat in the 1700s through Anglicization and trade.
      explanation: |
        Six points, College Board LEQ rubric applied to this prompt.

        Thesis/claim (0–1): a defensible claim about the extent of difference with a line of reasoning, e.g. "differed greatly in economy and society because of environment and motives, though both developed self-government". Zero for restating the prompt.

        Contextualization (0–1): describes relevant broader context, e.g. English population pressure and enclosure; the Reformation and Puritan conflict with the Church of England; joint-stock companies; Native societies and the Columbian Exchange; European imperial rivalry. Must be developed, not a passing phrase.

        Evidence (0–2): 1 pt for two specific examples (tobacco and John Rolfe; headright system; indentured servants; Bacon's Rebellion; Virginia slave laws of 1662 and 1705; Great Migration; Mayflower Compact; Massachusetts Bay; town meetings; Halfway Covenant; Fundamental Orders; House of Burgesses; Maryland Toleration Act). 2 pts when the examples support an argument about the extent of difference.

        Analysis and reasoning (0–2): 1 pt for using comparison to structure the argument (explaining why the regions differed). 1 pt for complex understanding, e.g. explaining both similarities and differences; showing change over time (convergence through trade and Anglicization, or divergence as slavery grew in the Chesapeake); weighing multiple causes (environment versus religion versus labor); linking New England to the slave economy through trade.

        Zero overall for two separate descriptions with no comparison.
