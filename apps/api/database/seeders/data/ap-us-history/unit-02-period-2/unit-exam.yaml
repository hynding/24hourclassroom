    points: 6
    prompt: |
      Between 1607 and 1754 slavery grew from a marginal practice in British North America into the foundation of the southern and Caribbean economies, and it was legal in every colony. Historians explain its growth by pointing to economic demand, the supply of labor, colonial law, ideas about race, and events such as Bacon's Rebellion.

      Evaluate the relative importance of the causes of the growth of slavery in the British colonies from 1607 to 1754.
    answer: |
      Thesis: The demand for labor created by export crops such as tobacco, rice and sugar was the most important cause of slavery's growth, but planters turned to enslaved Africans rather than servants only when the supply of servants fell, Bacon's Rebellion made poor whites seem dangerous, and colonial law made slavery racial and hereditary; economics created the demand, while politics and law determined that it would be met by African slavery.

      Context: the Atlantic slave trade already supplied Spanish and Portuguese America in Period 1, after disease devastated Native populations; English colonists entered an Atlantic world where African slavery was established.

      Body 1 (demand): tobacco after Rolfe (c. 1612), headrights rewarding imported labor; Barbados sugar and its slave code; Carolina rice and West African expertise.
      Body 2 (supply and politics): indentured servitude dominant until the 1670s; declining English emigration; Bacon's Rebellion 1676; end of the Royal African Company's monopoly 1698.
      Body 3 (law and race): Virginia 1662 (status follows mother), 1667 (baptism does not free), 1705 slave code; South Carolina's Negro Act after Stono (1739).
      Complexity: weigh causes across regions (slavery in northern ports via the Atlantic trade; Georgia's ban and reversal in 1751 shows demand overriding ideals), and enslaved people's resistance prompting harsher laws.
    explanation: |
      Six points, College Board LEQ rubric applied to this prompt.

      Thesis/claim (0–1): a defensible claim that ranks or weighs causes and sets up a line of reasoning, e.g. "economic demand was most important, but supply and politics determined that the labor would be enslaved Africans". Zero for listing causes without evaluating relative importance.

      Contextualization (0–1): describes broader context, e.g. Period 1 Spanish and Portuguese slavery and the Atlantic trade; Native population collapse; the Caribbean sugar revolution; English mercantilism and Atlantic markets. Must be developed.

      Evidence (0–2): 1 pt for two specific examples (tobacco and John Rolfe; headright system; Barbados planters in Carolina; rice and West African knowledge; Bacon's Rebellion; Royal African Company and 1698; Virginia laws of 1662, 1667, 1705; Stono Rebellion and the Negro Act of 1740; Georgia's ban and its repeal in 1751; New York's enslaved population and the 1712 revolt). 2 pts when they support an argument about relative importance.

      Analysis and reasoning (0–2): 1 pt for causation explicitly framed (explaining how and why each cause operated, and which mattered more). 1 pt for complex understanding, e.g. distinguishing long-term from short-term causes; showing how causes interacted; comparing regions (Chesapeake, Lower South, North); considering the role of enslaved people's resistance; explaining continuity with Period 1 slavery.

      Zero overall for a narrative of slavery's history without evaluating causes.
