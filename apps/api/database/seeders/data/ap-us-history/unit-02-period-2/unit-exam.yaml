unit: 2
description: |
  45 questions · about 75 minutes · every topic of Period 2 (2.1 to 2.8) with about a fifth of the items reviewing
  Period 1, five stimulus sets of three or four multiple-choice items (a compact, a law, two historians'
  interpretations written for this course), select-all, true/false and fill-in-the-blank items, one short-answer
  question (3 points) and one long essay question (6 points). Multiple choice, select-all and true/false items are
  graded at once; fill-in-the-blank items are matched automatically; the two free-response items are graded by
  your teacher against the scoring notes.
questions:
  # ---- Stimulus set 1: Mayflower Compact (2.3, 2.2, 2.7, 2.8)
  - slug: apush-u02-exam-q01
    type: multiple_choice
    topic_code: "2.3"
    source: "Primary source: Agreement Between the Settlers at New Plymouth (Mayflower Compact, 1620), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "Having undertaken for the Glory of God, and Advancement of the Christian Faith, and the Honour of our King and Country, a Voyage to plant the first Colony in the northern Parts of Virginia; Do by these Presents, solemnly and mutually, in the Presence of God and one another, covenant and combine ourselves together into a civil Body Politick, for our better Ordering and Preservation, and Furtherance of the Ends aforesaid: And by Virtue hereof do enact, constitute, and frame, such just and equal Laws, Ordinances, Acts, Constitutions, and Officers, from time to time, as shall be thought most meet and convenient for the general Good of the Colony; unto which we promise all due Submission and Obedience."

      — Agreement signed by male passengers aboard the Mayflower, November 1620
    prompt: |
      The excerpt is best used as evidence of which development in the British colonies?
    options:
      - "The colonists' rejection of loyalty to the English king"
      - "The spread of the encomienda system into New England"
      - "The growth of traditions of self-government based on the consent of the governed"
      - "The establishment of royal control over every colony from its founding"
    option_explanations:
      - |
        The signers explicitly act for "the Honour of our King and Country" and remained loyal subjects.
      - |
        Encomienda was a Spanish labor system in Period 1 and was never used in New England.
      - |
        Correct. The signers agree to make "just and equal Laws" for themselves and to obey them. Together with the House of Burgesses and town meetings, it shows colonists governing themselves by agreement.
      - |
        The colonists created authority among themselves, without royal officials. Royal control of Plymouth came only when it was absorbed into Massachusetts in 1691.
    answer: 2
    explanation: |
      Using a source as evidence for a broader pattern: colonial self-government (2.3).

  - slug: apush-u02-exam-q02
    type: multiple_choice
    topic_code: "2.2"
    source: "Primary source: Agreement Between the Settlers at New Plymouth (Mayflower Compact, 1620), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "Having undertaken for the Glory of God, and Advancement of the Christian Faith, and the Honour of our King and Country, a Voyage to plant the first Colony in the northern Parts of Virginia; Do by these Presents, solemnly and mutually, in the Presence of God and one another, covenant and combine ourselves together into a civil Body Politick, for our better Ordering and Preservation, and Furtherance of the Ends aforesaid: And by Virtue hereof do enact, constitute, and frame, such just and equal Laws, Ordinances, Acts, Constitutions, and Officers, from time to time, as shall be thought most meet and convenient for the general Good of the Colony; unto which we promise all due Submission and Obedience."

      — Agreement signed by male passengers aboard the Mayflower, November 1620
    prompt: |
      Which of the following best explains why the passengers drew up the agreement?
    options:
      - "They intended to declare independence from England."
      - "The English crown had ordered every colony to write a constitution before landing."
      - "They were negotiating a treaty with the Wampanoag."
      - "They had landed outside the area of their patent and needed a basis for government and order among Separatists and non-Separatists alike."
    option_explanations:
      - |
        The text affirms loyalty to the king. Independence was more than a century and a half away.
      - |
        No such royal order existed; the compact was a local response to local circumstances.
      - |
        No Native leaders signed the compact. The Pilgrims' agreement with Massasoit came later, in 1621.
      - |
        Correct. The Mayflower reached Cape Cod, north of the Virginia Company's lands. With some passengers ("strangers") threatening to go their own way, the leaders bound everyone into a body politic.
    answer: 3
    explanation: |
      Sourcing (historical situation): the place the ship landed explains why an agreement was needed.

  - slug: apush-u02-exam-q03
    type: multiple_choice
    topic_code: "2.7"
    source: "Primary source: Agreement Between the Settlers at New Plymouth (Mayflower Compact, 1620), Avalon Project, Yale Law School; general knowledge"
    points: 1
    stimulus: |
      "Having undertaken for the Glory of God, and Advancement of the Christian Faith, and the Honour of our King and Country, a Voyage to plant the first Colony in the northern Parts of Virginia; Do by these Presents, solemnly and mutually, in the Presence of God and one another, covenant and combine ourselves together into a civil Body Politick, for our better Ordering and Preservation, and Furtherance of the Ends aforesaid: And by Virtue hereof do enact, constitute, and frame, such just and equal Laws, Ordinances, Acts, Constitutions, and Officers, from time to time, as shall be thought most meet and convenient for the general Good of the Colony; unto which we promise all due Submission and Obedience."

      — Agreement signed by male passengers aboard the Mayflower, November 1620
    prompt: |
      The idea of government by agreement in the excerpt is most similar to which later development in colonial thought?
    options:
      - "The Halfway Covenant's change to church membership rules"
      - "The Enlightenment idea, associated with John Locke, that legitimate government rests on the consent of the governed"
      - "The mercantilist belief that colonies exist to enrich the mother country"
      - "The divine right of kings, the belief that monarchs answer only to God"
    option_explanations:
      - |
        The Halfway Covenant concerned baptism and church membership, not civil government.
      - |
        Correct. Locke's Two Treatises (1689) argued that people form governments by consent to protect their rights. Colonists who knew compacts and covenants found Locke's ideas familiar.
      - |
        Mercantilism is an economic doctrine about trade and wealth; it says nothing about the source of political authority.
      - |
        Divine right locates authority in the king alone, the opposite of authority created by mutual agreement.
    answer: 1
    explanation: |
      Making connections: continuity between Puritan covenant ideas and Enlightenment political thought (2.7).

  - slug: apush-u02-exam-q04
    type: multiple_choice
    topic_code: "2.8"
    source: "Primary source: Agreement Between the Settlers at New Plymouth (Mayflower Compact, 1620), Avalon Project, Yale Law School; general knowledge"
    points: 1
    stimulus: |
      "Having undertaken for the Glory of God, and Advancement of the Christian Faith, and the Honour of our King and Country, a Voyage to plant the first Colony in the northern Parts of Virginia; Do by these Presents, solemnly and mutually, in the Presence of God and one another, covenant and combine ourselves together into a civil Body Politick, for our better Ordering and Preservation, and Furtherance of the Ends aforesaid: And by Virtue hereof do enact, constitute, and frame, such just and equal Laws, Ordinances, Acts, Constitutions, and Officers, from time to time, as shall be thought most meet and convenient for the general Good of the Colony; unto which we promise all due Submission and Obedience."

      — Agreement signed by male passengers aboard the Mayflower, November 1620
    prompt: |
      The kind of local self-government described in the excerpt differed most from the government of which colonies?
    options:
      - "Connecticut, which adopted the Fundamental Orders"
      - "New Spain and New France, which were governed by crown-appointed officials without elected colonial legislatures"
      - "Virginia, which had an elected House of Burgesses"
      - "Pennsylvania, which had an elected assembly under Penn's charters"
    option_explanations:
      - |
        The Fundamental Orders (1639) are another example of self-government by compact.
      - |
        Correct. Spanish viceroys and governors and French governors and intendants ruled by royal authority. The British habit of colonial assemblies was a defining contrast between the empires.
      - |
        Virginia's House of Burgesses (1619) is an example of the same British pattern, not a contrast.
      - |
        Pennsylvania's elected assembly fits the British pattern of representative government.
    answer: 1
    explanation: |
      Comparison (2.8): political institutions differed across empires.

  # ---- Stimulus set 2: Native diplomacy (2.5, 2.1)
  - slug: apush-u02-exam-q05
    type: multiple_choice
    topic_code: "2.5"
    source: "Interpretation written for this course; general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course):

      "After decades of war, the Haudenosaunee made peace with New France and its Native allies at Montreal in 1701 and, almost at the same moment, renewed their alliance with the English at Albany. Critics then and since have called this double-dealing. It was better described as strategy. By refusing to become any empire's client, the Five Nations made both empires court them with gifts, trade and promises, and kept colonists of both off their lands for half a century. The strategy depended on there being two rival empires to play against each other."
    prompt: |
      The strategy the author describes is best characterised as
    options:
      - "a complete military alliance with France against Britain"
      - "a plan to migrate west of the Mississippi River"
      - "a policy of neutrality and play-off diplomacy between rival European empires"
      - "a decision to adopt European farming and give up the fur trade"
    option_explanations:
      - |
        The author stresses that the Haudenosaunee refused to become any empire's client; a full French alliance is the opposite.
      - |
        The strategy was designed to keep the Haudenosaunee on their own lands, not to move.
      - |
        Correct. Making peace with France while keeping ties to Britain let the Haudenosaunee extract gifts and trade from both and protect their lands.
      - |
        The passage concerns diplomacy, not a change in economy, and the Haudenosaunee remained central to the fur trade.
    answer: 2
    explanation: |
      Identify an author's argument and the historical concept it describes (Native agency, 2.5).

  - slug: apush-u02-exam-q06
    type: multiple_choice
    topic_code: "2.5"
    source: "Interpretation written for this course; general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course):

      "After decades of war, the Haudenosaunee made peace with New France and its Native allies at Montreal in 1701 and, almost at the same moment, renewed their alliance with the English at Albany. Critics then and since have called this double-dealing. It was better described as strategy. By refusing to become any empire's client, the Five Nations made both empires court them with gifts, trade and promises, and kept colonists of both off their lands for half a century. The strategy depended on there being two rival empires to play against each other."
    prompt: |
      Based on the author's final sentence, which later development would most threaten the strategy described?
    options:
      - "The growth of the Great Awakening"
      - "The elimination of French power in North America after the Seven Years' War"
      - "The founding of Jamestown"
      - "The passage of the Maryland Toleration Act"
    option_explanations:
      - |
        A religious revival among colonists did not remove the rivalry on which the strategy depended.
      - |
        Correct. Once Britain drove France from mainland North America in 1763, Native nations could no longer play one empire against the other, which helps explain Pontiac's War that same year.
      - |
        Jamestown (1607) came long before 1701 and is not a "later development".
      - |
        The 1649 Maryland act concerned religious toleration among Christians in one colony and predates the strategy.
    answer: 1
    explanation: |
      Causation and making connections across periods: the strategy needed two empires, so the end of one undermined it.

  - slug: apush-u02-exam-q07
    type: multiple_choice
    topic_code: "2.1"
    source: "Interpretation written for this course; general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course):

      "After decades of war, the Haudenosaunee made peace with New France and its Native allies at Montreal in 1701 and, almost at the same moment, renewed their alliance with the English at Albany. Critics then and since have called this double-dealing. It was better described as strategy. By refusing to become any empire's client, the Five Nations made both empires court them with gifts, trade and promises, and kept colonists of both off their lands for half a century. The strategy depended on there being two rival empires to play against each other."
    prompt: |
      The excerpt best supports which broader claim about Period 2?
    options:
      - "American Indian nations played no role in European imperial rivalries."
      - "The Haudenosaunee were the only Native nation to resist colonization."
      - "European competition for North America created opportunities as well as dangers for American Indian nations."
      - "Europeans always negotiated with American Indians as equals and respected their land claims."
    option_explanations:
      - |
        The excerpt shows the Haudenosaunee at the centre of imperial rivalry.
      - |
        Many Native nations resisted, from the Powhatan to the Pueblos; nothing in the passage claims uniqueness.
      - |
        Correct. Rivalry among empires let skilled Native diplomats gain leverage, even as war, disease and settlement threatened them.
      - |
        The author says both empires courted the Haudenosaunee out of need, not respect, and colonists pressed on Native lands everywhere.
    answer: 2
    explanation: |
      Contextualization (2.1): connect a specific case to the period's larger pattern.

  # ---- Stimulus set 3: Navigation Act (2.4, 2.3)
  - slug: apush-u02-exam-q08
    type: multiple_choice
    topic_code: "2.4"
    source: "Primary source: An Act for the Encourageing and increasing of Shipping and Navigation (12 Charles II c. 18, 1660), legislation.gov.uk"
    points: 1
    stimulus: |
      "... from thence forward noe Goods or Commodities whatsoever shall be Imported into or Exported out of any Lands Islelands Plantations or Territories to his Majesty belonging or in his possession ... in Asia Africa or America in any other Ship or Ships Vessell or Vessells whatsoever but in such Ships or Vessells as doe truely and without fraude belong onely to the people of England or Ireland Dominion of Wales or Towne of Berwicke upon Tweede, or are of the built of, and belonging to any of the said Lands Islands Plantations or Territories as the Proprietors and right Owners therof and wherof the Master and three fourthes of the Mariners at least are English ..."

      — Act of Parliament (the Navigation Act), 1660
    prompt: |
      Which European rival was the act chiefly intended to exclude from English colonial trade?
    options:
      - "The Portuguese, who owned the English colonies in the Caribbean"
      - "The Dutch, whose merchant fleet carried much of Europe's commerce in the mid-1600s"
      - "The Haudenosaunee, who operated an ocean-going fleet"
      - "The Spanish, who controlled the Chesapeake tobacco trade"
    option_explanations:
      - |
        The English Caribbean colonies, such as Barbados and Jamaica, were English, not Portuguese.
      - |
        Correct. Dutch shippers were the great carriers of the age and had handled much colonial tobacco and sugar. The acts helped provoke the Anglo-Dutch wars, in one of which England took New Netherland (1664).
      - |
        The Haudenosaunee were an inland confederacy with no ocean-going fleet; the act concerned European rivals.
      - |
        Spain had no role in the Chesapeake trade, which was English.
    answer: 1
    explanation: |
      Historical situation: mid-century commercial rivalry with the Dutch.

  - slug: apush-u02-exam-q09
    type: multiple_choice
    topic_code: "2.4"
    source: "Primary source: An Act for the Encourageing and increasing of Shipping and Navigation (12 Charles II c. 18, 1660), legislation.gov.uk; general knowledge"
    points: 1
    stimulus: |
      "... from thence forward noe Goods or Commodities whatsoever shall be Imported into or Exported out of any Lands Islelands Plantations or Territories to his Majesty belonging or in his possession ... in Asia Africa or America in any other Ship or Ships Vessell or Vessells whatsoever but in such Ships or Vessells as doe truely and without fraude belong onely to the people of England or Ireland Dominion of Wales or Towne of Berwicke upon Tweede, or are of the built of, and belonging to any of the said Lands Islands Plantations or Territories as the Proprietors and right Owners therof and wherof the Master and three fourthes of the Mariners at least are English ..."

      — Act of Parliament (the Navigation Act), 1660
    prompt: |
      Which of the following was the most common colonial response to laws like this one in the first half of the 1700s?
    options:
      - "Petitioning Spain for protection"
      - "Armed rebellion and a declaration of independence"
      - "Abandoning overseas trade for subsistence farming"
      - "Evasion through smuggling, made easier by lax enforcement known as salutary neglect"
    option_explanations:
      - |
        Spain was a rival empire; British colonists did not seek its protection.
      - |
        The colonists' armed rising of 1689 was against the Dominion of New England, not a war for independence; nothing comparable occurred in 1700–1754.
      - |
        Colonial trade expanded rapidly in the 1700s; colonists did not abandon it.
      - |
        Correct. Colonial merchants traded with foreign islands and evaded duties, and British ministers, chiefly concerned with loyalty and markets, rarely cracked down.
    answer: 3
    explanation: |
      Causation: policy and response, and the concept of salutary neglect.

  - slug: apush-u02-exam-q10
    type: multiple_choice
    topic_code: "2.3"
    source: "Primary source: An Act for the Encourageing and increasing of Shipping and Navigation (12 Charles II c. 18, 1660), legislation.gov.uk; general knowledge"
    points: 1
    stimulus: |
      "... from thence forward noe Goods or Commodities whatsoever shall be Imported into or Exported out of any Lands Islelands Plantations or Territories to his Majesty belonging or in his possession ... in Asia Africa or America in any other Ship or Ships Vessell or Vessells whatsoever but in such Ships or Vessells as doe truely and without fraude belong onely to the people of England or Ireland Dominion of Wales or Towne of Berwicke upon Tweede, or are of the built of, and belonging to any of the said Lands Islands Plantations or Territories as the Proprietors and right Owners therof and wherof the Master and three fourthes of the Mariners at least are English ..."

      — Act of Parliament (the Navigation Act), 1660
    prompt: |
      Which colonial region's economy depended most heavily on the shipping and shipbuilding that the act protected?
    options:
      - "Spanish New Mexico"
      - "The Chesapeake backcountry"
      - "New England"
      - "The Lower South"
    option_explanations:
      - |
        New Mexico was a Spanish inland colony and was not covered by an English act.
      - |
        The Chesapeake backcountry grew tobacco and grain; it was not a shipping centre.
      - |
        Correct. With thin soil but abundant timber and good harbours, New England built ships, fished and carried goods for the whole Atlantic world.
      - |
        The Lower South grew rice and indigo on plantations; its goods were mostly carried by British and northern ships.
    answer: 2
    explanation: |
      Comparison of regions (2.3) linked to the Atlantic economy (2.4).

  # ---- Stimulus set 4: Anglicization and the consumer revolution (2.7, 2.4)
  - slug: apush-u02-exam-q11
    type: multiple_choice
    topic_code: "2.7"
    source: "Interpretation written for this course; general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course):

      "A visitor to a Philadelphia merchant's house in 1750 might drink tea from English porcelain, sit on a chair copied from a London pattern and read a newspaper filled with news from London. In 1650 the same visitor would have found wooden bowls and homemade cloth. In a century the colonies had become, in their tastes and in their own minds, more British, not less. Yet the goods came on credit, and the habit of consuming British goods could become, in a crisis, a weapon: what people had learned to buy, they could also refuse to buy."
    prompt: |
      The process the author describes in the first three sentences is best described as
    options:
      - "salutary neglect"
      - "Anglicization, the growing cultural and economic similarity of the colonies to Britain"
      - "the Great Migration"
      - "the Columbian Exchange"
    option_explanations:
      - |
        Salutary neglect concerns the lax enforcement of trade laws, not changing tastes and identity.
      - |
        Correct. Through trade, print and imitation of British fashions, eighteenth-century colonists became more like Britons in taste and identity.
      - |
        The Great Migration was the movement of Puritans to New England in the 1630s, a migration rather than a cultural process.
      - |
        The Columbian Exchange was the transfer of plants, animals and diseases after 1492, a Period 1 process.
    answer: 1
    explanation: |
      Identify a historical process from a description (2.7).

  - slug: apush-u02-exam-q12
    type: multiple_choice
    topic_code: "2.4"
    source: "Interpretation written for this course; general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course):

      "A visitor to a Philadelphia merchant's house in 1750 might drink tea from English porcelain, sit on a chair copied from a London pattern and read a newspaper filled with news from London. In 1650 the same visitor would have found wooden bowls and homemade cloth. In a century the colonies had become, in their tastes and in their own minds, more British, not less. Yet the goods came on credit, and the habit of consuming British goods could become, in a crisis, a weapon: what people had learned to buy, they could also refuse to buy."
    prompt: |
      The economic relationship the author describes was most consistent with which British policy goal?
    options:
      - "The aim of ending colonial trade with Britain"
      - "The aim of making the colonies Britain's main manufacturing centre"
      - "The mercantilist aim of making the colonies a market for British manufactured goods"
      - "The aim of establishing free trade between the colonies and France"
    option_explanations:
      - |
        The passage describes growing trade with Britain, which British policy encouraged.
      - |
        British law limited colonial manufacturing (the Wool, Hat and Iron Acts) to protect British makers.
      - |
        Correct. Mercantilists wanted colonies to supply raw materials and buy British manufactures. Colonists buying porcelain, furniture and cloth on credit was the system working as intended.
      - |
        The Navigation Acts restricted trade with foreign rivals such as France.
    answer: 2
    explanation: |
      Making connections between culture (2.7) and economic policy (2.4).

  - slug: apush-u02-exam-q13
    type: multiple_choice
    topic_code: "2.7"
    source: "Interpretation written for this course; general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course):

      "A visitor to a Philadelphia merchant's house in 1750 might drink tea from English porcelain, sit on a chair copied from a London pattern and read a newspaper filled with news from London. In 1650 the same visitor would have found wooden bowls and homemade cloth. In a century the colonies had become, in their tastes and in their own minds, more British, not less. Yet the goods came on credit, and the habit of consuming British goods could become, in a crisis, a weapon: what people had learned to buy, they could also refuse to buy."
    prompt: |
      A historian who wanted to qualify the author's claim that the colonies had become "more British" would most likely point to
    options:
      - "the growing numbers of German, Scots-Irish and African people in the colonies, which made colonial society more diverse than Britain's"
      - "the spread of London newspapers in colonial cities"
      - "the colonists' imports of British tea and porcelain"
      - "the growth of colonial assemblies modelled on the House of Commons"
    option_explanations:
      - |
        Correct. Immigration and the slave trade made the colonies far more ethnically and religiously mixed than Britain; Pennsylvania's Germans, for instance, kept their own language and churches.
      - |
        News from London supports the author's picture of growing British identity.
      - |
        British tea and porcelain support the author's claim rather than qualifying it.
      - |
        Assemblies modelled on the Commons show colonists imitating British institutions, which supports the claim.
    answer: 0
    explanation: |
      Argumentation: find evidence that complicates a claim (2.7, diversity and immigration).

  # ---- Stimulus set 5: Period 1 review
  - slug: apush-u02-exam-q14
    type: multiple_choice
    topic_code: "1.4"
    source: "Interpretation written for this course; general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course):

      "The most consequential travellers of the sixteenth century were not conquistadors but the plants, animals and microbes that crossed the Atlantic with them. Smallpox reached the Aztec capital before Spanish victory did; horses spread north from Mexico faster than Spanish soldiers; and sugar, carried west from the Atlantic islands, created a hunger for labor that Native populations, shattered by disease, could not satisfy. Every colony founded after 1607 was built in a world those travellers had already remade."
    prompt: |
      Review. The author's argument is most directly about the effects of
    options:
      - "the Columbian Exchange"
      - "the Protestant Reformation"
      - "the Navigation Acts"
      - "the Great Awakening"
    option_explanations:
      - |
        Correct. The transatlantic movement of diseases, animals and crops after 1492 is the Columbian Exchange, and the author argues it mattered more than the conquerors.
      - |
        The Reformation was a religious division within European Christianity; the passage concerns plants, animals and disease.
      - |
        The Navigation Acts began in 1651 and regulated trade; they are not the subject of the passage.
      - |
        The Great Awakening was an eighteenth-century religious revival.
    answer: 0
    explanation: |
      Period 1 review: identify the process behind an argument.

  - slug: apush-u02-exam-q15
    type: multiple_choice
    topic_code: "1.5"
    source: "Interpretation written for this course; general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course):

      "The most consequential travellers of the sixteenth century were not conquistadors but the plants, animals and microbes that crossed the Atlantic with them. Smallpox reached the Aztec capital before Spanish victory did; horses spread north from Mexico faster than Spanish soldiers; and sugar, carried west from the Atlantic islands, created a hunger for labor that Native populations, shattered by disease, could not satisfy. Every colony founded after 1607 was built in a world those travellers had already remade."
    prompt: |
      Review. The "hunger for labor" mentioned in the excerpt most directly led to which development in Period 1?
    options:
      - "The adoption of town meetings in Spanish colonies"
      - "The growth of the transatlantic slave trade bringing enslaved Africans to the Americas"
      - "The end of sugar cultivation in the Americas"
      - "The founding of the Virginia Company"
    option_explanations:
      - |
        Town meetings were a New England institution; Spanish colonies were ruled by royal officials.
      - |
        Correct. As Native populations collapsed, the Spanish and Portuguese turned to enslaved Africans for plantations and mines, beginning the forced migration that would later supply British colonies.
      - |
        Sugar cultivation expanded enormously and became the most profitable plantation crop.
      - |
        The Virginia Company was chartered in 1606 for English colonization, not as a result of Spanish labor needs.
    answer: 1
    explanation: |
      Period 1 review: causation from disease and sugar to African slavery.

  - slug: apush-u02-exam-q16
    type: multiple_choice
    topic_code: "1.7"
    source: "Interpretation written for this course; general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course):

      "The most consequential travellers of the sixteenth century were not conquistadors but the plants, animals and microbes that crossed the Atlantic with them. Smallpox reached the Aztec capital before Spanish victory did; horses spread north from Mexico faster than Spanish soldiers; and sugar, carried west from the Atlantic islands, created a hunger for labor that Native populations, shattered by disease, could not satisfy. Every colony founded after 1607 was built in a world those travellers had already remade."
    prompt: |
      Review. Which of the following developments best illustrates the author's point that horses spread "faster than Spanish soldiers"?
    options:
      - "The growth of the New England fishing industry"
      - "The decline of the fur trade in New France"
      - "The rise of mounted, horse-based societies such as the Comanche on the Great Plains"
      - "The founding of Quebec"
    option_explanations:
      - |
        Fishing in New England had nothing to do with horses spreading from Mexico.
      - |
        The French fur trade grew rather than declined in the 1600s, and it is unrelated to the horse.
      - |
        Correct. Through trade and capture, horses reached the southern and central Plains by the late 1600s and transformed hunting, warfare and trade for nations such as the Comanche and later the Lakota, far beyond Spanish control.
      - |
        Quebec was a French settlement founded in 1608; it has no connection to the spread of horses.
    answer: 2
    explanation: |
      Period 1 review (causation): an unintended consequence of the Columbian Exchange that shaped Period 2 relations.

  # ---- Singles
