  - slug: apush-u02-exam-q44
    type: short_answer
    topic_code: "2.3"
    source: "general knowledge"
    points: 3
    stimulus: |
      Description of a non-text source: a thematic map of British North America about 1750 shaded by main exports. New England is labelled "fish, timber, ships, rum" and dotted with towns and ports; the Middle Colonies are labelled "wheat, flour" with Philadelphia and New York marked as large ports; the Chesapeake is labelled "tobacco" with plantations along tidewater rivers and few towns; the Carolina and Georgia Lowcountry is labelled "rice, indigo" with Charles Town as its port. A legend uses darker shading to show areas where enslaved people made up more than a third of the population; the darkest shading covers the South Carolina Lowcountry and Virginia's tidewater.
    prompt: |
      Using the map described above, answer (a), (b) and (c).

      (a) Briefly describe ONE difference between the economies of two regions shown on the map.
      (b) Briefly explain ONE reason for the difference you described in (a).
      (c) Briefly explain ONE way the pattern of slavery shown on the map is connected to the regions' economies.
    answer: |
      (a) The Chesapeake exported tobacco from plantations spread along the rivers, while New England exported fish, timber, ships and rum from many towns and ports.

      (b) Environment shaped the difference: the Chesapeake's long growing season and navigable rivers suited a plantation cash crop shipped straight from riverfront docks, while New England's short season and thin, rocky soil discouraged staple crops and pushed colonists toward the sea and trade; family migration and Puritan town life reinforced the contrast.

      (c) Slavery was concentrated where labor-hungry export crops were grown: tobacco planters in tidewater Virginia and rice planters in the Lowcountry relied on enslaved Africans, while New England's small family farms needed little bound labor, so enslaved people were a smaller share of the population there.
    explanation: |
      Three points, one per part.

      (a) 1 pt: an accurate economic difference between two named regions, using the map (e.g. tobacco plantations vs grain farms; rice vs fish and shipping; dispersed plantations vs towns and ports).

      (b) 1 pt: explains a cause: environment and climate, soil, rivers and ports; migrant motives (families vs single servants); religion and town settlement; markets in the West Indies or Britain. Must explain the difference given in (a).

      (c) 1 pt: connects slavery to export agriculture, e.g. labor-intensive tobacco, rice and indigo; the Barbados model in Carolina; the shift from servants to slaves in the Chesapeake; northern economies' smaller need for bound labor (while noting slavery was legal there). Zero for "the South had slaves because it was the South".

  - slug: apush-u02-exam-q45
    type: long_answer
    topic_code: "2.6"
