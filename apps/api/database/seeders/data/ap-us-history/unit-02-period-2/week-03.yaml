    - slug: apush-u02-w03-q22
      type: short_answer
      topic_code: "2.1"
      source: "Interpretation written for this course; general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course), in the spirit of historians who stress American Indian agency:

        "It is tempting to tell the history of seventeenth-century North America as a story of European empires moving across an empty board. But for most of the century the board belonged to Native nations. The Haudenosaunee, the Powhatan and the Pueblos decided whom to trade with, whom to fight and whose missionaries to admit. Europeans succeeded where they found Native allies and failed where they did not, and Native leaders were as skilled as any European minister at setting one empire against another."
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the author's main argument about American Indians in the seventeenth century.
        (b) Briefly explain how ONE specific historical development from 1607 to 1754 supports the author's argument.
        (c) Briefly explain how ONE specific historical development from 1607 to 1754 could be used to challenge or qualify the author's argument.
      answer: |
        (a) The author argues that American Indian nations were active, powerful decision-makers who shaped colonization through their own choices of trade partners, allies and enemies, rather than passive victims of European expansion.

        (b) The Haudenosaunee traded furs with the Dutch at Fort Orange and used Dutch guns to fight the Huron and other rivals in the Beaver Wars; by the early 1700s they pursued a policy of neutrality between Britain and France, playing the two empires against each other to protect their lands.

        (c) In New England and the Chesapeake, English colonists' numbers and land hunger overwhelmed Native nations: the Pequot War (1636–1637) and the Powhatan wars of 1622 and 1644 ended in Native defeat and loss of land, showing that where English settlement was dense, Native choices could not hold back colonization.
      explanation: |
        Three points, one per part.

        (a) 1 pt: describes the argument that Native nations had agency and power (controlled trade, alliances, the fate of colonies). Zero for "Indians were victims of Europeans" or a description of Europeans only.

        (b) 1 pt: a specific development explained as support, e.g. Haudenosaunee use of the Dutch and later the British and French; Powhatan feeding then besieging Jamestown on their own terms; the Huron–French alliance; the Pueblo Revolt of 1680 expelling the Spanish; Native leaders admitting or rejecting Jesuit missionaries. Must connect the example to Native choice or power, not just name it.

        (c) 1 pt: a specific development explained as a challenge or qualification, e.g. epidemic disease weakening Native nations before they could choose; English victory in the Pequot War or Metacom's War; the defeat of the Powhatan after 1622 and 1644; the Spanish reconquest of New Mexico in 1692. Must explain how it limits Native agency.

        Zero for any part: examples outside 1607–1754, restating the excerpt without new evidence, or evidence that does not match the part (support offered as a challenge).

    - slug: apush-u02-w03-q23
      type: short_answer
      topic_code: "2.2"
      source: "general knowledge"
      points: 3
      stimulus: |
        Description of a non-text source: a map of European claims in North America around 1700. Spanish claims are shaded across Florida, Texas and New Mexico, marked by scattered mission and presidio symbols. French claims form a long band from the mouth of the St. Lawrence through the Great Lakes and down the Mississippi to the Gulf of Mexico, with forts and trading posts but few towns. English colonies are a narrow, densely dotted strip along the Atlantic coast from Maine to Carolina, with dozens of towns marked. Large areas between the claims are labelled with the names of American Indian nations, including the Haudenosaunee, Cherokee, Creek and Comanche.
      prompt: |
        Using the map described above, answer (a), (b) and (c).

        (a) Briefly describe ONE difference between the French and English colonies shown on the map.
        (b) Briefly explain ONE reason for the difference you described in (a).
        (c) Briefly explain ONE way the presence of American Indian nations between the European claims affected relations among the empires before 1754.
      answer: |
        (a) French claims covered an enormous area along the St. Lawrence, Great Lakes and Mississippi but contained few towns, while the English colonies covered a narrow coastal strip with many dense settlements.

        (b) France wanted furs and depended on Native hunters, so it built trading posts and forts along water routes and sent few settlers; England wanted land for farming, and its growing population and joint-stock companies sent thousands of colonists, often in families, who clustered on the coast.

        (c) Because Native nations such as the Haudenosaunee controlled the land and trade between the empires, Europeans competed for their alliance; Native leaders in turn played the British and French against each other, so imperial rivalry was fought through Native alliances and frontier warfare.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an accurate difference read from the map, e.g. size of territory vs density of settlement; trading posts and forts vs towns; interior river routes vs Atlantic coast. Zero for differences the map cannot show unless correctly explained with outside knowledge.

        (b) 1 pt: explains a cause, e.g. French fur-trade goals and small emigration vs English demand for land, population pressure, religious migration and company or proprietary sponsorship. Must link cause to the difference given in (a).

        (c) 1 pt: explains an effect of Native nations' position, e.g. competition for alliances and trade; Native play-off diplomacy (Haudenosaunee neutrality after 1701); Native nations acting as buffers or as allies in imperial wars. Zero for a statement that Native peoples were irrelevant or merely "in the way".

    - slug: apush-u02-w03-q24
      type: long_answer
      topic_code: "2.2"
      source: "general knowledge"
      points: 6
      prompt: |
        In the seventeenth century, Spain, France, the Netherlands and England all built colonies in North America. They differed in their goals, in the number and kind of colonists they sent, and in how they dealt with American Indians. You might consider economic aims, religion, labor, settlement patterns or alliances.

        Evaluate the extent of difference between the ways Spain, France and England pursued their colonial goals in North America from 1607 to 1754.
      answer: |
        Thesis: Although all three empires shared a mix of economic, religious and political motives and assumed European superiority, they differed greatly in method, because their goals differed: Spain sought conversion and labor, France sought furs through alliances, and England sought land for a large settler population.

        Context: Spain's sixteenth-century conquests in Mexico and Peru made it rich and spurred rivals; by 1600 England, France and the Netherlands were ready to claim North America themselves, while Native nations still controlled most of the continent and were reeling from epidemic disease.

        Body 1 (Spain): missions and presidios in New Mexico and Florida; Franciscans; encomienda and repartimiento labor demands on the Pueblos; Santa Fe c. 1610; few settlers.
        Body 2 (France): Quebec 1608; fur trade; coureurs de bois and intermarriage (métis); Jesuits living among the Huron; alliances against the Haudenosaunee; small population.
        Body 3 (England): Jamestown 1607 and tobacco; Great Migration of Puritan families; headrights and indentured servants; wars over land (Powhatan 1622, Pequot 1636–37); rapid growth and little intermarriage.
        Complexity: similarity in motives (the 1606 Virginia charter's missionary language) and in dependence on Native trade early on (Jamestown's corn from the Powhatan), so the difference was one of degree that widened as English numbers grew.
      explanation: |
        Six points, College Board LEQ rubric applied to this prompt.

        Thesis/claim (0–1): a historically defensible claim that establishes a line of reasoning about the extent of difference, e.g. "differed greatly in methods because their goals differed, despite shared motives". Zero for restating the prompt or for "they were similar and different" with no reasoning.

        Contextualization (0–1): describes a broader context before, during or after the period, e.g. Spain's Period 1 conquests and wealth; the Reformation and European rivalries; Native population collapse from disease; English population pressure and enclosure. Must be more than a phrase.

        Evidence (0–2): 1 pt for at least two specific, relevant examples (Santa Fe, missions, encomienda; Quebec, coureurs de bois, Jesuits, Huron alliance; Jamestown, tobacco, Great Migration, headrights, Pequot War, Powhatan wars; New Netherland as further comparison). 2 pts when the examples are used to support an argument about the extent of difference.

        Analysis and reasoning (0–2): 1 pt for using comparison to frame the argument (explaining why methods differed, not just listing them). 1 pt for a complex understanding, e.g. explaining similarities as well as differences; showing how differences changed over time as English numbers grew; considering Native agency in shaping each empire's methods; corroborating with multiple variables (economics, religion, demography). The complexity point must be part of the argument, not a single sentence.

        Zero overall for a narrative of each empire with no comparison or claim.
