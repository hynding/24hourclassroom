week: 3
unit: 2
title: "Colonizing North America: Spain, France, the Dutch and England"
topics: ["2.1", "2.2"]
guide: guides/week-03.md
guide_description: |
  Why the Spanish, French, Dutch and English built such different colonies in North America after 1607, and how
  their goals (wealth and conversion, furs and alliances, trade, land for settlers) shaped relations with American
  Indians. Worked examples: a contextualization paragraph for Period 2, a comparison chain across the four empires,
  and a sourcing (HIPP) reading of the First Charter of Virginia and the Mayflower Compact.
flashcards_description: |
  30 cards on the goals and methods of Spanish, French, Dutch and English colonization, the first English
  settlements, and the comparisons the exam asks you to make.

flashcards:
  - front: Jamestown (1607) → who founded it and why it nearly failed
    back: |
      The Virginia Company of London, a joint-stock company seeking profit, planted Jamestown on the James River in 1607. Disease, a brackish water supply, hunting for gold instead of planting food, and conflict with the Powhatan nearly destroyed it; the "starving time" of 1609–1610 killed most of the colonists.
    topic_code: "2.2"
  - front: Joint-stock company → what it was and why it mattered for English colonization
    back: |
      A business in which many investors pooled money by buying shares and shared profit and risk. The Virginia Company and the Massachusetts Bay Company were joint-stock companies, so English colonization was privately financed, unlike Spain's crown-directed empire.
    topic_code: "2.2"
  - front: John Rolfe and tobacco (c. 1612) → significance for Virginia
    back: |
      Rolfe grew a sweeter West Indian tobacco that sold well in England. Tobacco gave Virginia a cash crop and a reason to exist, but it also created a hunger for land (pushing onto Powhatan territory) and for labor (indentured servants, later enslaved Africans).
    topic_code: "2.2"
  - front: Powhatan Confederacy → who they were in 1607
    back: |
      An alliance of some thirty Algonquian-speaking peoples of the Chesapeake under the paramount chief Wahunsenacah (Powhatan). They traded corn to the starving English at first, then fought them as tobacco planters took their land.
    topic_code: "2.2"
  - front: Plymouth (1620) → who, why, and how it differed from Jamestown
    back: |
      Separatist Pilgrims, who believed the Church of England was beyond reform, settled Plymouth after landing on Cape Cod in 1620. Unlike Jamestown's young single men seeking profit, Plymouth was settled by families seeking a godly community.
    topic_code: "2.2"
  - front: Mayflower Compact (1620) → what it created and its significance
    back: |
      Before landing, the Mayflower's male passengers agreed to "covenant and combine" into a "civil Body Politick" and to obey the laws it made. It is an early example of self-government by mutual consent in English America.
    hint: A covenant applied to government.
    topic_code: "2.2"
  - front: Massachusetts Bay Colony (1630) → who and what goal
    back: |
      Puritans led by John Winthrop, who wanted to purify the Church of England rather than leave it, founded Massachusetts Bay. They hoped to build a model Christian commonwealth that, in Winthrop's image, the whole world would watch like a city on a hill, and came in families during the Great Migration of the 1630s.
    topic_code: "2.2"
  - front: Great Migration (1630s) → scale and character
    back: |
      About twenty thousand English Puritans moved to New England in roughly a decade, mostly as families with some property. The balanced sex ratio and healthy climate let New England grow largely by natural increase afterwards.
    topic_code: "2.2"
  - front: Santa Fe (c. 1610) → significance
    back: |
      The Spanish capital of New Mexico, founded after Juan de Oñate's expedition of 1598. It anchored a colony of missions, soldiers and a few settlers living among the Pueblo peoples, whose labor and tribute the Spanish demanded.
    topic_code: "2.2"
  - front: Spanish missions in New Mexico and Florida → purpose
    back: |
      Franciscan friars built missions to convert American Indians to Catholicism and to settle them into Spanish ways of life and labor. Missions were the Spanish empire's main tool on its northern frontier, where there was little gold to attract settlers.
    topic_code: "2.2"
  - front: Quebec (1608) → founder and the purpose of New France
    back: |
      Samuel de Champlain founded Quebec on the St. Lawrence in 1608. New France was built for the fur trade and for Catholic missions, not for mass settlement, and it depended on alliances with the Huron (Wendat), Algonquin and other American Indian nations.
    topic_code: "2.2"
  - front: Coureurs de bois → who they were and why they mattered
    back: |
      French fur traders, literally "runners of the woods", who lived and travelled among American Indians, learned their languages and often married into their communities. They show how French colonization relied on cooperation with Native trading partners.
    topic_code: "2.2"
  - front: Jesuit missionaries in New France → method compared with Spanish missions
    back: |
      Jesuits lived in Native villages, learned Native languages and tried to convert people without forcing them into Spanish-style labor systems. Spanish Franciscans more often relocated converts and demanded their labor.
    topic_code: "2.2"
  - front: Métis → definition and what it shows about New France
    back: |
      People of mixed French and American Indian ancestry, born of marriages between traders and Native women. Their numbers show how far the small French population integrated into Native societies.
    topic_code: "2.2"
  - front: New Netherland → founded for what, centred where
    back: |
      A Dutch West India Company colony along the Hudson River, centred on New Amsterdam (Manhattan) and Fort Orange (Albany). Its purpose was trade, especially furs bought from the Haudenosaunee (Iroquois) and Mahican.
    topic_code: "2.2"
  - front: New Amsterdam's character in the 1650s → why historians call it cosmopolitan
    back: |
      The port housed Dutch, Walloons, Germans, Scandinavians, English, free and enslaved Africans and, from 1654, a small Jewish community. The Dutch tolerated religious difference largely for the sake of commerce.
    topic_code: "2.2"
  - front: Patroonship → what the Dutch tried and why it mostly failed
    back: |
      A large Hudson Valley land grant whose owner (the patroon) had to bring tenant settlers. Few Dutch wanted to emigrate as tenants when the Netherlands was prosperous, so New Netherland stayed thinly settled.
    topic_code: "2.2"
  - front: 1664, New Amsterdam becomes New York → cause and result
    back: |
      An English fleet sent by the Duke of York took New Netherland without a fight from Governor Peter Stuyvesant in 1664, during the Anglo-Dutch commercial wars. England gained the Hudson Valley and a diverse, trade-minded population.
    topic_code: "2.2"
  - front: Spain, France, the Dutch, England → one-word goal for each
    back: |
      Spain: conversion and wealth (and defending its silver empire). France: furs. The Dutch: trade. England: land for settlers. Each goal predicts how many colonists came and how they treated American Indians.
    topic_code: "2.1"
  - front: Why did England send far more colonists than France or the Netherlands?
    back: |
      England had a growing population, enclosure and rising rents that pushed people off the land, religious dissenters seeking refuge, and joint-stock companies and proprietors who profited from settlement. France and the Netherlands restricted or failed to attract emigrants.
    topic_code: "2.1"
  - front: Contextualizing Period 2 (1607–1754) → the big picture in two sentences
    back: |
      After 1607 several European empires competed for North America with different goals, numbers and methods. Those differences shaped how colonists treated American Indians and Africans and how each colonial society developed.
    topic_code: "2.1"
  - front: English colonists and American Indians → the relationship compared with the French
    back: |
      English colonists wanted land for farms and families, so they pushed Native peoples off it and rarely intermarried. The French wanted trading partners and allies, so they lived among Native peoples, intermarried and joined their diplomacy.
    topic_code: "2.1"
  - front: Why did Europeans compete for American Indian alliances?
    back: |
      Native nations controlled the fur supply, the trade routes and much of the military power of the interior. Europeans armed allies against rivals, and Native leaders in turn played empires off against one another to keep their independence.
    topic_code: "2.1"
  - front: Spanish frontier vs Spanish core → where Period 2 Spain differs from Period 1 Spain
    back: |
      In Period 1 Spain conquered rich, dense empires in Mexico and Peru. In Period 2 its North American frontier (New Mexico, Florida) was poor, thinly settled and defensive, held by missions and soldiers to protect the silver routes.
    topic_code: "2.1"
  - front: First Charter of Virginia (1606) → stated purposes
    back: |
      King James I licensed the Virginia Company to colonise and named the spread of the Christian religion among Native peoples as a purpose alongside profit. The charter is an example of mixed religious and economic motives.
    topic_code: "2.2"
  - front: Which theme? The French alliance with the Huron against the Haudenosaunee
    back: |
      America in the World (WOR) and Politics and Power (PCE): European rivalries were fought through Native alliances, and Native nations used Europeans for their own wars and trade.
    topic_code: "2.1"
  - front: Starving time (1609–1610) → cause and lesson
    back: |
      Jamestown's population fell from several hundred to about sixty in a winter of famine and disease, worsened by a Powhatan siege. The colony survived only with new settlers and supplies, and the lesson was that it needed food crops and a reliable export.
    topic_code: "2.2"
  - front: Compare Spanish and English colonial labor systems in the early 1600s
    back: |
      Spain drew on Native labor through encomienda and later repartimiento, plus enslaved Africans. Early English colonies used family labor (New England) or English indentured servants (Chesapeake), with Native labor marginal and African slavery growing later.
    topic_code: "2.2"
  - front: Dutch–Haudenosaunee fur trade → effect on Native politics
    back: |
      Dutch guns and goods at Fort Orange strengthened the Haudenosaunee (Iroquois), who fought neighbouring nations for control of the beaver trade in the Beaver Wars. European trade reshaped warfare among Native nations.
    topic_code: "2.2"
  - front: Continuity from Period 1 to Period 2 → one example
    back: |
      European rivalry over American wealth and land continued, and so did Spanish missions and labor demands on American Indians. What changed was that England, France and the Netherlands now built lasting colonies of their own.
    topic_code: "2.1"

quiz:
  description: |
    24 questions · about 35 minutes · about 70% this week (topics 2.1 and 2.2, the competing European empires in
    North America) and 30% review of Period 1 (Native societies, exploration, the Columbian Exchange and the
    Spanish colonial system). Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long essay are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: First Charter of Virginia (2.2, 2.1)
    - slug: apush-u02-w03-q01
      type: multiple_choice
      topic_code: "2.2"
      source: "Primary source: The First Charter of Virginia (April 10, 1606), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "We, greatly commending, and graciously accepting of, their Desires for the Furtherance of so noble a Work, which may, by the Providence of Almighty God, hereafter tend to the Glory of his Divine Majesty, in propagating of Christian Religion to such People, as yet live in Darkness and miserable Ignorance of the true Knowledge and Worship of God, and may in time bring the Infidels and Savages, living in those parts, to human Civility, and to a settled and quiet Government ..."

        — The First Charter of Virginia, granted by King James I to the Virginia Company, April 10, 1606
      prompt: |
        The purpose stated in the excerpt is best understood in the context of which of the following?
      options:
        - "The English crown's plan to grant American Indians full rights as English subjects"
        - "English efforts to justify colonization by presenting it as a religious mission, much as Spain had done"
        - "The desire of Separatist Pilgrims to escape persecution by the Church of England"
        - "A Protestant campaign to drive Catholic Spain out of the Chesapeake region"
      option_explanations:
        - |
          The charter calls Native peoples "Infidels and Savages" to be brought to "Civility"; it promises them no rights. It reflects European assumptions of cultural superiority, not inclusion.
        - |
          Correct. Like Spanish monarchs a century earlier, James I wrapped a commercial venture in the language of converting Native peoples. The charter's stated mission gave a profit-seeking company religious legitimacy.
        - |
          The Pilgrims sailed in 1620 under a different patent and were not the Virginia Company's investors. The charter is a royal grant to a joint-stock company, not a dissenters' statement.
        - |
          Spain had no settlement in the Chesapeake in 1606; its North American outposts were in Florida and soon New Mexico. The charter says nothing about expelling a rival.
      answer: 1
      explanation: |
        Contextualization: place the document in the longer pattern of European colonizers justifying expansion through religion (Period 1) while pursuing profit.

    - slug: apush-u02-w03-q02
      type: multiple_choice
      topic_code: "2.2"
      source: "Primary source: The First Charter of Virginia (April 10, 1606), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "We, greatly commending, and graciously accepting of, their Desires for the Furtherance of so noble a Work, which may, by the Providence of Almighty God, hereafter tend to the Glory of his Divine Majesty, in propagating of Christian Religion to such People, as yet live in Darkness and miserable Ignorance of the true Knowledge and Worship of God, and may in time bring the Infidels and Savages, living in those parts, to human Civility, and to a settled and quiet Government ..."

        — The First Charter of Virginia, granted by King James I to the Virginia Company, April 10, 1606
      prompt: |
        Which of the following best describes how the actual development of the Virginia colony in its first two decades differed from the purpose stated in the excerpt?
      options:
        - "The colony abandoned agriculture and lived entirely by trading furs with the French."
        - "The colony converted most of the Powhatan people to Christianity within ten years."
        - "The colony became a refuge for Catholics fleeing persecution in England."
        - "The colony focused on growing tobacco for profit and expanded onto Powhatan lands, leading to war rather than conversion."
      option_explanations:
        - |
          Virginia's economy rested on tobacco planting, and the French were far to the north on the St. Lawrence. This option confuses the Chesapeake with New France.
        - |
          Missionary work in early Virginia was minimal. Pocahontas's conversion and marriage to John Rolfe was an exception, not the start of mass conversion.
        - |
          The Catholic refuge was Maryland, chartered in 1632 for Lord Baltimore. Virginia was officially Anglican.
        - |
          Correct. Once Rolfe's tobacco sold in England after about 1612, settlers spread along the rivers for land. The Powhatan attacks of 1622 and 1644 and English reprisals show conquest, not conversion, became the pattern.
      answer: 3
      explanation: |
        Comparison of stated intent with outcome, a sourcing skill: a charter's purpose is what its authors wanted readers (the king's subjects and investors) to believe, not a description of what happened.

    - slug: apush-u02-w03-q03
      type: multiple_choice
      topic_code: "2.1"
      source: "Primary source: The First Charter of Virginia (April 10, 1606), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "We, greatly commending, and graciously accepting of, their Desires for the Furtherance of so noble a Work, which may, by the Providence of Almighty God, hereafter tend to the Glory of his Divine Majesty, in propagating of Christian Religion to such People, as yet live in Darkness and miserable Ignorance of the true Knowledge and Worship of God, and may in time bring the Infidels and Savages, living in those parts, to human Civility, and to a settled and quiet Government ..."

        — The First Charter of Virginia, granted by King James I to the Virginia Company, April 10, 1606
      prompt: |
        The excerpt most clearly reflects which broader feature of European colonization in Period 2?
      options:
        - "European monarchs paid for every colonial venture directly from royal treasuries."
        - "Only Spain claimed a religious motive for colonizing the Americas."
        - "Europeans generally regarded American Indian societies as equal partners in government."
        - "Colonizing powers mixed economic, religious and political motives and assumed European cultural superiority."
      option_explanations:
        - |
          James I issued a charter to private investors; the crown did not pay. English colonies were funded by joint-stock companies and proprietors.
        - |
          The excerpt itself is an English Protestant claim of a religious mission, and French Jesuits made similar claims. Religious motives were not unique to Spain.
        - |
          The language of "Darkness" and bringing Native peoples to "Civility" shows the opposite assumption, that Native societies were inferior and needed European order.
        - |
          Correct. The charter joins God's glory, the spread of Christianity and "settled and quiet Government" to a commercial grant, and it treats Native cultures as lacking civility. Both features recur across Spanish, French and English colonization.
      answer: 3
      explanation: |
        Contextualization and making connections: use one document to identify a pattern shared by several empires (2.1).

    # ---- Stimulus set B: an interpretation comparing empires (2.1, 2.2, review 1.5)
    - slug: apush-u02-w03-q04
      type: multiple_choice
      topic_code: "2.1"
      source: "Interpretation written for this course; general knowledge"
      points: 1
      stimulus: |
        Interpretation (written for this course):

        "The European empires that competed for North America after 1600 can be sorted by what each wanted from the land. Spain, which already drew silver from Mexico and Peru, held its northern frontier with missions and garrisons and asked American Indians for souls, labor and tribute. France and the Netherlands wanted furs, which only Native hunters and traders could supply, so they sent few settlers and depended on alliances. England wanted the land itself. Its colonists came in thousands, many in families, and every new farm was a field that a Native town no longer controlled."
      prompt: |
        Which of the following pieces of evidence would best support the author's argument about England?
      options:
        - "English settlement in New England and the Chesapeake grew rapidly and repeatedly provoked wars over land, such as the Pequot War and the Powhatan wars."
        - "Dutch merchants at Fort Orange bought beaver pelts from the Haudenosaunee."
        - "Spanish friars founded missions among the Pueblo peoples of New Mexico."
        - "French fur traders frequently married into Huron and Algonquin communities."
      option_explanations:
        - |
          Correct. Rapid English population growth and repeated wars over land (Powhatan 1622 and 1644, Pequot 1636–1637) directly support the claim that England wanted the land itself.
        - |
          This supports the claim about the Dutch reliance on Native traders. It says nothing about English land hunger.
        - |
          This supports the claim about Spain's missions. Evidence must match the specific claim it is meant to support.
        - |
          This supports the author's claim about France, not England. It is accurate evidence placed under the wrong part of the argument.
      answer: 0
      explanation: |
        Claims and evidence: an argument with several parts needs evidence for each part. Match the evidence to England's distinctive goal.

    - slug: apush-u02-w03-q05
      type: multiple_choice
      topic_code: "2.2"
      source: "Interpretation written for this course; general knowledge"
      points: 1
      stimulus: |
        Interpretation (written for this course):

        "The European empires that competed for North America after 1600 can be sorted by what each wanted from the land. Spain, which already drew silver from Mexico and Peru, held its northern frontier with missions and garrisons and asked American Indians for souls, labor and tribute. France and the Netherlands wanted furs, which only Native hunters and traders could supply, so they sent few settlers and depended on alliances. England wanted the land itself. Its colonists came in thousands, many in families, and every new farm was a field that a Native town no longer controlled."
      prompt: |
        A historian who wanted to challenge or complicate the author's argument about France would most likely point out that
      options:
        - "French colonists along the St. Lawrence also farmed land in long river lots, and French alliances drew them into Native wars, such as the conflicts with the Haudenosaunee."
        - "The French founded Quebec in 1608 as a base for the fur trade."
        - "New France's population remained small compared with the English colonies."
        - "French Jesuits learned Native languages and lived in Native villages."
      option_explanations:
        - |
          Correct. The habitants did farm the St. Lawrence valley, and French alliances were not merely commercial: they committed France to Native wars. This shows the French relationship was more than a fur-for-goods exchange.
        - |
          This restates the author's own evidence for French goals. Complicating an argument requires evidence that cuts against or qualifies it.
        - |
          A small population is exactly what the author's argument predicts, so this supports rather than complicates the claim.
        - |
          Jesuits living among Native peoples fits the author's picture of a France dependent on cooperation. It does not complicate it.
      answer: 0
      explanation: |
        Argumentation: corroborate, qualify or modify a claim. A complication is evidence that shows the claim is too simple, not evidence that repeats it.

    - slug: apush-u02-w03-q06
      type: multiple_choice
      topic_code: "1.5"
      source: "Interpretation written for this course; general knowledge"
      points: 1
      stimulus: |
        Interpretation (written for this course):

        "The European empires that competed for North America after 1600 can be sorted by what each wanted from the land. Spain, which already drew silver from Mexico and Peru, held its northern frontier with missions and garrisons and asked American Indians for souls, labor and tribute. France and the Netherlands wanted furs, which only Native hunters and traders could supply, so they sent few settlers and depended on alliances. England wanted the land itself. Its colonists came in thousands, many in families, and every new farm was a field that a Native town no longer controlled."
      prompt: |
        Review. The Spanish demand for "labor and tribute" described in the passage most directly continued which Period 1 practice?
      options:
        - "The headright system, which granted land to colonists who paid for passage"
        - "The encomienda system, which granted Spanish colonists the labor and tribute of American Indians in return for supposed protection and Christian instruction"
        - "The Portuguese practice of trading with West African kingdoms for gold"
        - "The Treaty of Tordesillas, which divided the non-European world between Spain and Portugal"
      option_explanations:
        - |
          Headrights were an English Chesapeake practice from 1618 and concerned land for those who brought settlers. They had nothing to do with Spanish labor demands.
        - |
          Correct. Encomienda (from the early 1500s) gave colonists the right to Native labor and tribute. On the New Mexico frontier the Spanish used encomienda and repartimiento demands in much the same way.
        - |
          Portuguese West African trade preceded the Atlantic slave trade but was not a system of extracting labor from American Indians.
        - |
          Tordesillas (1494) settled claims between two crowns; it did not organise labor. It is a diplomatic agreement, not a labor system.
      answer: 1
      explanation: |
        Continuity and change over time: Spanish methods on the northern frontier in Period 2 grew directly out of the encomienda system of Period 1.

    # ---- Single items: this week
    - slug: apush-u02-w03-q07
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains why French colonists in the 1600s more often intermarried with American Indians than English colonists did?
      options:
        - "New France had few colonists, most of them men, and its fur economy depended on living and trading among Native communities."
        - "French law required all colonists to marry American Indian spouses."
        - "American Indians in the Northeast refused to trade with any Europeans except the French."
        - "The Catholic Church in France encouraged colonists to abandon Christianity and adopt Native religions."
      option_explanations:
        - |
          Correct. With a small, overwhelmingly male colonial population and a trade that required living among suppliers, French traders married into Native families, creating kinship ties that strengthened trade and alliance.
        - |
          No such law existed. Intermarriage grew from the conditions of the fur trade, not from royal command.
        - |
          Northeastern Native nations traded with the Dutch and English as well, as the Haudenosaunee trade at Fort Orange shows.
        - |
          The church sent Jesuits to convert Native peoples, the reverse of encouraging colonists to abandon Christianity.
      answer: 0
      explanation: |
        Causation: the economic goal (furs) and the demographic fact (few colonists, mostly men) together explain the social pattern (intermarriage).

    - slug: apush-u02-w03-q08
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following statements about New Netherland is most accurate?
      options:
        - "It was the largest European colony in North America by population in 1660."
        - "It was founded by religious dissenters seeking to build a model Puritan commonwealth."
        - "It was a commercial colony of the Dutch West India Company, built around the fur trade and notable for the diversity of its population."
        - "It was transferred to Spain in exchange for Florida."
      option_explanations:
        - |
          New Netherland stayed small because few Dutch wanted to leave a prosperous homeland; Virginia and New England were far larger.
        - |
          That describes Massachusetts Bay. The Dutch colony was a trading venture run by a company, not a religious experiment.
        - |
          Correct. New Netherland existed to make money for the West India Company, especially from furs, and New Amsterdam's mixed population of Europeans and Africans reflected the Dutch Republic's commercial outlook.
        - |
          England took New Netherland in 1664 and renamed it New York. Spain was never involved.
      answer: 2
      explanation: |
        Comparison: identify the distinctive goal and character of one European colony against the others.

    - slug: apush-u02-w03-q09
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The success of tobacco cultivation in Virginia after about 1612 most directly led to which of the following?
      options:
        - "The founding of the first public school system in North America"
        - "A decline in English interest in the colony"
        - "Growing conflict with the Powhatan peoples as colonists spread out to claim land, and rising demand for bound labor"
        - "Close trading alliances between Virginia and New France"
      option_explanations:
        - |
          Public schooling developed in New England, where Puritans wanted everyone able to read the Bible; dispersed tobacco plantations worked against schools.
        - |
          Tobacco profits made Virginia attractive to investors and migrants; interest rose rather than fell.
        - |
          Correct. Tobacco exhausted soil and rewarded those with the most land and workers, so planters spread along the rivers onto Powhatan lands (provoking the 1622 and 1644 wars) and imported indentured servants and, increasingly, enslaved Africans.
        - |
          Virginia and New France had no close trade relationship; they were rival empires hundreds of miles apart.
      answer: 2
      explanation: |
        Causation: a cash crop has both an environmental-territorial effect (land hunger) and a labor effect. Both run through the rest of Unit 2.

    - slug: apush-u02-w03-q10
      type: multiple_choice
      topic_code: "2.2"
      source: "Primary source: Agreement Between the Settlers at New Plymouth (Mayflower Compact, 1620), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "Having undertaken for the Glory of God, and Advancement of the Christian Faith, and the Honour of our King and Country, a Voyage to plant the first Colony in the northern Parts of Virginia; Do by these Presents, solemnly and mutually, in the Presence of God and one another, covenant and combine ourselves together into a civil Body Politick, for our better Ordering and Preservation, and Furtherance of the Ends aforesaid ..."

        — Agreement signed aboard the Mayflower, November 1620
      prompt: |
        The agreement in the excerpt is most significant as an example of
      options:
        - "a royal decree establishing direct rule by the English crown"
        - "a treaty between English colonists and the Wampanoag"
        - "colonists creating a government by mutual consent in the absence of an existing authority"
        - "a joint-stock company's plan to divide profits among investors"
      option_explanations:
        - |
          The signers created authority themselves; they acknowledged the king but no royal decree is involved. The document's force came from mutual agreement.
        - |
          The compact was signed by passengers aboard ship before any agreement with the Wampanoag; Native peoples were not parties.
        - |
          Correct. Having landed outside the Virginia Company's grant, the passengers bound themselves into a "civil Body Politick" by covenant. It is an early instance of self-government by consent in English America.
        - |
          The text concerns "Ordering and Preservation" and laws, not profits. It is a political covenant, not a business plan.
      answer: 2
      explanation: |
        Sourcing (purpose and historical situation): the passengers had no legal charter for where they landed, so they created their own government.

    # ---- Review of Period 1
    - slug: apush-u02-w03-q11
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which of the following was the most significant effect of the Columbian Exchange on American Indian populations in the 1500s and 1600s?
      options:
        - "Catastrophic population decline caused largely by Eurasian diseases such as smallpox, to which they had no acquired immunity"
        - "The immediate end of American Indian trade networks"
        - "The introduction of maize into American Indian diets"
        - "A sharp rise in Native populations because of new European food crops"
      option_explanations:
        - |
          Correct. Smallpox, measles and influenza killed a large majority of the population in many regions, often before Europeans arrived in person, and shaped every later encounter.
        - |
          Native trade networks adapted and often carried European goods inland; they did not end at once.
        - |
          Maize was native to the Americas and was carried to Europe and Africa, not the other way round.
        - |
          Wheat and livestock did spread, but their effect was far outweighed by disease mortality; populations collapsed rather than rose.
      answer: 0
      explanation: |
        Causation (Period 1 review): disease was the single largest demographic effect of contact and frames the weakness of many Native nations faced with Period 2 colonists.

    - slug: apush-u02-w03-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Before European contact, the Pueblo peoples of the Southwest were best known for which of the following?
      options:
        - "Nomadic buffalo hunting on horseback"
        - "Large fishing villages without agriculture on the Pacific coast"
        - "A confederation of five nations governed by a Grand Council"
        - "Permanent villages of multistory adobe buildings supported by irrigated maize farming"
      option_explanations:
        - |
          Horses arrived with the Spanish; mounted buffalo hunting developed on the Great Plains after contact.
        - |
          That describes Northwest Coast peoples such as the Chinook, who relied on abundant salmon.
        - |
          That is the Haudenosaunee (Iroquois) Confederacy of the Northeast.
        - |
          Correct. In an arid region, the Pueblos irrigated maize, beans and squash and built compact adobe towns. That settled agricultural life made them targets for Spanish mission and labor demands in Period 2.
      answer: 3
      explanation: |
        Comparison (Period 1 review): environment shaped Native ways of life, and those ways of life shaped how Europeans tried to use Native peoples later.

    - slug: apush-u02-w03-q13
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which of the following best explains why European states sponsored voyages of exploration in the late 1400s and 1500s?
      options:
        - "They had been invited by American Indian leaders to establish trading posts."
        - "They needed new markets for goods produced in factories."
        - "They sought new sources of wealth and trade routes to Asia, competed with rival monarchies, and wanted to spread Christianity."
        - "They wanted to escape overpopulation caused by the Black Death."
      option_explanations:
        - |
          Europeans did not know of the Americas before 1492, so no invitation was possible.
        - |
          Factory production belongs to the Industrial Revolution of the late 1700s and after, not the age of exploration.
        - |
          Correct. Wealth, rivalry among new nation-states and religious zeal ("God, gold and glory") together drove exploration, aided by new ships and navigational tools.
        - |
          The Black Death of the 1340s reduced Europe's population; it did not create overpopulation that drove exploration.
      answer: 2
      explanation: |
        Causation (Period 1 review): several causes worked together. The same motives reappear in Period 2 colonization.

    - slug: apush-u02-w03-q14
      type: multi_select
      topic_code: "2.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were characteristic of French colonization in North America in the 1600s.
      options:
        - "Dependence on the fur trade"
        - "Catholic missionary work by Jesuits"
        - "Alliances with American Indian nations such as the Huron (Wendat) and Algonquin"
        - "Plantations worked mainly by indentured servants growing tobacco"
        - "Large-scale migration of English-style farming families"
      option_explanations:
        - |
          Correct. Beaver pelts were the economic reason for New France, bought from Native hunters through traders and coureurs de bois.
        - |
          Correct. Jesuits learned Native languages and lived in Native villages to win converts.
        - |
          Correct. France allied with the Huron and Algonquin, including against the Haudenosaunee, because those nations supplied furs and fighting strength.
        - |
          Tobacco plantations with indentured servants describe the English Chesapeake. New France's economy was the fur trade and small-scale farming.
        - |
          France sent few settlers, and English families went to English colonies. Mass family migration characterised New England, not New France.
      answer: [0, 1, 2]
      explanation: |
        Comparison: sort the features of colonization by empire. French goals (furs, converts) explain French methods (alliances, missions, few settlers).

    - slug: apush-u02-w03-q15
      type: multi_select
      topic_code: "1.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Review. Select ALL of the following that were responses to the Spanish treatment of American Indians in the 1500s.
      options:
        - "Bartolomé de Las Casas argued that American Indians should not be enslaved or abused."
        - "The Valladolid debate (1550–1551) set Las Casas against Juan Ginés de Sepúlveda over whether Native peoples could rightly be subjugated."
        - "The Mayflower Compact guaranteed American Indians the right to vote."
        - "The Spanish crown's New Laws of 1542 sought to limit the encomienda system."
      option_explanations:
        - |
          Correct. Las Casas, a Dominican friar and former encomendero, denounced the cruelty of the conquest and defended Native humanity.
        - |
          Correct. The Valladolid debate was a formal disputation on the morality of conquest and Native rights, reflecting European debates over how to treat Native peoples.
        - |
          The Mayflower Compact (1620) was an English agreement among colonists and said nothing about American Indians or voting.
        - |
          Correct. Partly in response to reformers such as Las Casas, the crown issued the New Laws to curb encomienda abuses, though colonists resisted enforcement.
      answer: [0, 1, 3]
      explanation: |
        Making connections (Period 1 review): Spanish debates over the treatment of Native peoples are the background for Spanish frontier policy in Period 2.

    - slug: apush-u02-w03-q16
      type: true_false
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: Epidemic disease, more than warfare, was the leading cause of the collapse of American Indian populations in the century after 1492.
      answer: true
      explanation: |
        True. Historians agree that smallpox, measles and other Eurasian diseases killed far more people than battles did, often spreading ahead of Europeans themselves. War, enslavement and displacement worsened the toll by weakening communities. Causation (Period 1 review).

    - slug: apush-u02-w03-q17
      type: true_false
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: By the early 1700s, New France had a larger European population than the English colonies along the Atlantic coast.
      answer: false
      explanation: |
        False. New France stayed small, a few tens of thousands at most, while the English mainland colonies grew past a quarter of a million by 1700 and more than a million by 1750. England's large settler population is the key difference when you compare the empires (2.1).

    - slug: apush-u02-w03-q18
      type: true_false
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: The encomienda system gave Spanish colonists legal ownership of American Indian lands.
      answer: false
      explanation: |
        False. Encomienda granted colonists the labor and tribute of a group of American Indians in return for protection and Christian instruction; it was a grant of people's labor, not of land. Land grants were separate, and the later hacienda system was based on landholding. Period 1 review.

