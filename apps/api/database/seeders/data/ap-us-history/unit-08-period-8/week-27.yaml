week: 27
unit: 8
title: "The Early Cold War and the Red Scare"
topics: ["8.1", "8.2", "8.3"]
guide: guides/week-27.md
guide_description: |
  How the wartime alliance with the Soviet Union broke down, how containment became policy through the Truman
  Doctrine, the Marshall Plan, NATO and NSC-68, and how the Korean War made the Cold War global and militarised.
  The second half covers the Second Red Scare from the federal loyalty program to McCarthy's fall. Worked examples:
  a contextualization paragraph for Period 8, the Truman Doctrine sourced with HIPP, and a comparison of the two Red
  Scares.
flashcards_description: |
  32 cards on containment and its tools, the crises of 1948–1953, nuclear strategy under Eisenhower, and the people,
  laws and cases of the Second Red Scare.

flashcards:
  - front: Period 8 (1945–1980) → the one-sentence context
    back: |
      The United States left World War II as the world's strongest economy and the only atomic power, and spent the next 35 years in a global rivalry with the Soviet Union while a long boom, new rights movements and, later, Vietnam, Watergate and stagflation tested Americans' faith in their government.
    topic_code: "8.1"
  - front: Why did the U.S.–Soviet wartime alliance break down after 1945?
    back: |
      The two powers wanted incompatible postwar orders: Stalin wanted a buffer of friendly governments in Eastern Europe after two German invasions; the United States wanted self-determination, open markets and free elections there. Disputes over Poland, Germany, reparations and the atomic bomb turned distrust into rivalry.
    topic_code: "8.2"
  - front: Iron Curtain (1946) → who used the image and what it described
    back: |
      Winston Churchill, in a speech at Fulton, Missouri, in March 1946, with Truman on the platform. It described the line dividing Soviet-dominated Eastern Europe from the West, and helped prepare American opinion for a confrontational policy.
    topic_code: "8.2"
  - front: George Kennan's Long Telegram (February 1946) → argument
    back: |
      A State Department cable from the U.S. embassy in Moscow arguing that Soviet hostility came from Russian insecurity and Communist ideology, so negotiation alone would not work; Soviet expansion had to be met with firm, patient counter-pressure. It became the intellectual root of containment.
    topic_code: "8.2"
  - front: Containment → definition and who it is associated with
    back: |
      The policy of preventing the spread of Soviet power and communism beyond where it already existed, rather than rolling it back by war. Associated with George Kennan and adopted by Truman; every president from Truman to Reagan practised some version of it.
    topic_code: "8.2"
  - front: Truman Doctrine (March 1947) → occasion and principle
    back: |
      Truman asked Congress for $400 million in aid for Greece and Turkey after Britain said it could no longer support them. He declared that the United States must support free peoples resisting subjugation by armed minorities or outside pressures, turning a regional aid request into a global commitment.
    hint: Greece and Turkey, $400 million.
    topic_code: "8.2"
  - front: Marshall Plan (European Recovery Program, 1948–1952) → purpose and scale
    back: |
      About $13 billion in American aid to rebuild Western European economies, proposed by Secretary of State George Marshall in 1947. It aimed to remove the poverty that made communism attractive and to restore trading partners for American goods. The Soviet Union refused it for itself and its satellites.
    topic_code: "8.2"
  - front: Berlin Blockade and Airlift (1948–1949) → cause and outcome
    back: |
      When the Western powers moved to merge their zones of Germany and introduce a new currency, Stalin cut land access to West Berlin. American and British planes flew in food and fuel for about eleven months until the Soviets lifted the blockade in May 1949. Germany was then split into two states.
    topic_code: "8.2"
  - front: NATO (1949) → what it was and why it was a break with tradition
    back: |
      The North Atlantic Treaty Organization, a mutual-defence pact in which an attack on one member is an attack on all. It was the first peacetime military alliance the United States had joined since the French alliance of 1778, ending the tradition of avoiding entangling alliances.
    topic_code: "8.2"
  - front: Warsaw Pact (1955) → what it was
    back: |
      The Soviet Union's military alliance with its Eastern European satellites, formed after West Germany joined NATO. With NATO, it fixed the division of Europe into two armed blocs for the rest of the Cold War.
    topic_code: "8.2"
  - front: The two shocks of 1949 → what happened and the effect
    back: |
      The Soviet Union tested an atomic bomb (August) and Mao Zedong's Communists won the Chinese civil war (October). The American nuclear monopoly was over and the most populous country was Communist; Republicans charged that Truman had "lost China," feeding the Red Scare and the push for a military buildup.
    topic_code: "8.2"
  - front: NSC-68 (1950) → recommendation and significance
    back: |
      A secret National Security Council report that described the Soviet Union as bent on world domination and called for a massive, permanent military buildup, conventional and nuclear. The Korean War made its recommendations politically possible: defense spending roughly tripled in the early 1950s.
    topic_code: "8.2"
  - front: National Security Act (1947) → what it created
    back: |
      It reorganised the military under a single secretary (renamed the Department of Defense in 1949) and created the National Security Council and the Central Intelligence Agency. It is the institutional foundation of the permanent national security state.
    topic_code: "8.2"
  - front: Korean War (1950–1953) → cause, course and outcome
    back: |
      North Korea invaded South Korea in June 1950; a U.S.-led United Nations force pushed north, China intervened in late 1950, and the war stalemated near the 38th parallel. An armistice in July 1953 left Korea divided, about 36,000 Americans dead, and containment now a military policy in Asia.
    topic_code: "8.2"
  - front: Truman fires MacArthur (April 1951) → why it matters
    back: |
      General Douglas MacArthur publicly pressed to widen the Korean War into China; Truman relieved him for insubordination. The episode upheld civilian control of the military and the idea of limited war, though MacArthur returned home to a hero's welcome.
    topic_code: "8.2"
  - front: Limited war → meaning in the Cold War
    back: |
      Fighting to achieve a restricted goal (restoring South Korea, not conquering North Korea or China) without using every weapon, so as to avoid a nuclear world war. Korea and Vietnam were both limited wars, which frustrated Americans used to total victory.
    topic_code: "8.2"
  - front: Eisenhower's New Look and "massive retaliation" (1953–1954)
    back: |
      Eisenhower and Secretary of State John Foster Dulles leaned on nuclear weapons and air power, which were cheaper than large armies, and warned that aggression could bring massive nuclear retaliation. The aim was security without bankrupting the economy; the risk was that every crisis could go nuclear.
    topic_code: "8.2"
  - front: Brinkmanship → who and what
    back: |
      John Foster Dulles's approach of being willing to go to the brink of war to force the other side to back down. Critics saw it as reckless; supporters said it deterred Soviet and Chinese moves in the 1950s.
    topic_code: "8.2"
  - front: Sputnik (October 1957) → effect on the United States
    back: |
      The Soviet satellite convinced many Americans they had fallen behind in science and missiles. Congress created NASA (1958) and passed the National Defense Education Act (1958) to fund science, mathematics and foreign-language education: the Cold War reshaping schools.
    topic_code: "8.2"
  - front: Executive Order 9835 (March 1947) → what Truman's loyalty program did
    back: |
      It ordered a loyalty investigation of every federal civilian employee and applicant, and allowed membership in organisations the Attorney General designated as subversive to count against them. Several million workers were screened; a few thousand resigned or were dismissed, often on vague evidence.
    topic_code: "8.3"
  - front: HUAC and the Hollywood Ten (1947)
    back: |
      The House Un-American Activities Committee investigated alleged Communist influence in the film industry. Ten writers and directors who refused to answer questions were jailed for contempt of Congress, and studios created a blacklist that kept hundreds out of work.
    topic_code: "8.3"
  - front: Alger Hiss case (1948–1950) → what happened and why it mattered
    back: |
      Former Communist Whittaker Chambers accused Hiss, a former State Department official, of spying for the Soviets. Hiss was convicted of perjury in 1950. The case made Congressman Richard Nixon's reputation and lent credibility to claims that Communists had penetrated the New Deal government.
    topic_code: "8.3"
  - front: Julius and Ethel Rosenberg (executed 1953)
    back: |
      Convicted of conspiring to pass atomic secrets to the Soviet Union and executed in 1953. Later evidence confirmed Julius's espionage; Ethel's role remains disputed. The case symbolised both real Soviet espionage and the era's harshness.
    topic_code: "8.3"
  - front: Joseph McCarthy's Wheeling speech (February 1950)
    back: |
      The Wisconsin senator claimed to hold a list of Communists in the State Department. He never produced it, but his accusations made him the face of the Second Red Scare; "McCarthyism" came to mean reckless accusation without evidence.
    topic_code: "8.3"
  - front: Army–McCarthy hearings (1954) → outcome
    back: |
      Televised hearings on McCarthy's charges against the Army let millions watch his bullying tactics. His popularity collapsed, and in December 1954 the Senate voted to censure him. The Red Scare's worst phase ended, though loyalty programs and blacklists lasted longer.
    topic_code: "8.3"
  - front: McCarran Internal Security Act (1950) → provisions
    back: |
      Passed over Truman's veto, it required Communist organisations to register with the government and allowed detention of suspected subversives in a national emergency. Truman argued it threatened freedom of speech and thought.
    topic_code: "8.3"
  - front: Dennis v. United States (1951) → ruling and significance
    back: |
      The Supreme Court upheld the convictions of Communist Party leaders under the Smith Act for conspiring to advocate the violent overthrow of the government. It showed how far the courts would let Cold War fears limit free speech; later rulings narrowed it.
    topic_code: "8.3"
  - front: The Lavender Scare → what it was
    back: |
      The parallel purge of gay and lesbian federal employees, who were labelled security risks open to blackmail. Eisenhower's Executive Order 10450 (1953) made "sexual perversion" grounds for dismissal; thousands lost their jobs.
    topic_code: "8.3"
  - front: Margaret Chase Smith's Declaration of Conscience (June 1950)
    back: |
      A Senate speech by the Maine Republican, joined by six other Republican senators, condemning the smear tactics of her own party's McCarthy without naming him, and defending the rights to criticise, hold unpopular beliefs and protest. An early, rare act of political courage.
    topic_code: "8.3"
  - front: Compare the First Red Scare (1919–1920) and the Second (1947–1954)
    back: |
      Both followed a world war and fixed on Communist subversion, and both curbed civil liberties. The first was short and aimed mainly at immigrants and radicals (Palmer Raids, deportations); the second lasted longer, was institutionalised in loyalty programs and congressional committees, and reached government officials, teachers and Hollywood.
    topic_code: "8.3"
  - front: Cause → effect. Real Soviet espionage → the Red Scare
    back: |
      Soviet spies really had operated in the Manhattan Project and the government (later confirmed by decoded Venona cables). That made fears plausible, but the response swept far beyond spies to people with past left-wing ties, unpopular opinions or none at all.
    topic_code: "8.3"
  - front: Which theme? The Marshall Plan and NATO
    back: |
      America in the World (WOR) first: they bound Western Europe to the United States economically and militarily. Also Work, Exchange, and Technology (WXT), because recovering European markets bought American goods.
    topic_code: "8.2"

quiz:
  description: |
    24 questions · about 40 minutes · about 65% this week (the origins of the Cold War, containment, Korea, the Second
    Red Scare) and about a third review of Period 7 (World War II, the First Red Scare, interwar policy, the New Deal).
    Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: the Truman Doctrine (8.2)
    - slug: apush-u08-w27-q01
      type: multiple_choice
      topic_code: "8.2"
      source: "Primary source: Harry S. Truman, Address before a Joint Session of Congress (March 12, 1947), Avalon Project"
      points: 1
      stimulus: &w27truman |
        "One way of life is based upon the will of the majority, and is distinguished by free institutions, representative government, free elections, guarantees of individual liberty, freedom of speech and religion, and freedom from political oppression.

        The second way of life is based upon the will of a minority forcibly imposed upon the majority. It relies upon terror and oppression, a controlled press and radio; fixed elections, and the suppression of personal freedoms.

        I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures. ...

        I believe that our help should be primarily through economic and financial aid which is essential to economic stability and orderly political processes."

        — President Harry S. Truman, address to a joint session of Congress, March 12, 1947
      prompt: |
        Which of the following most directly prompted the speech excerpted above?
      options:
        - "North Korea's invasion of South Korea"
        - "The Soviet Union's blockade of the Western sectors of Berlin"
        - "Britain's announcement that it could no longer afford to support the governments of Greece and Turkey"
        - "The Soviet Union's successful test of an atomic bomb"
      option_explanations:
        - |
          The Korean War began in June 1950. By then the Truman Doctrine was three years old and NSC-68 was already drafted.
        - |
          The Berlin Blockade began in June 1948, more than a year after this speech; it tested containment but did not prompt its announcement.
        - |
          Correct. In February 1947 Britain told Washington it could no longer fund Greece's fight against Communist-led insurgents or Turkey's resistance to Soviet pressure; Truman asked Congress for $400 million to take over that role.
        - |
          The Soviet atomic test came in August 1949. It ended the American monopoly but came well after the doctrine was announced.
      answer: 2
      explanation: |
        Historical situation (sourcing). Date the document first: March 1947 places it before Berlin, the Soviet bomb and Korea, which leaves the Greek and Turkish crisis as the immediate trigger.

    - slug: apush-u08-w27-q02
      type: multiple_choice
      topic_code: "8.2"
      source: "Primary source: Harry S. Truman, Address before a Joint Session of Congress (March 12, 1947), Avalon Project"
      points: 1
      stimulus: *w27truman
      prompt: |
        Truman's purpose in describing "two ways of life" was most likely to
      options:
        - "announce that the United States would use military force to free the nations of Eastern Europe from Soviet control"
        - "persuade a cost-conscious Congress and public to accept a broad, open-ended commitment by presenting aid to two countries as part of a worldwide struggle between freedom and tyranny"
        - "reassure the Soviet Union that the United States accepted its sphere of influence in Eastern Europe"
        - "explain to Congress why the United States would rely on the United Nations rather than act alone"
      option_explanations:
        - |
          Containment meant stopping further expansion, not rolling back existing Soviet control; the United States did not intervene when the Soviets crushed uprisings in East Germany (1953) or Hungary (1956).
        - |
          Correct. A Republican Congress elected in 1946 wanted lower spending. Framing the request as a moral, global contest turned a specific aid bill into a lasting doctrine.
        - |
          The speech does the opposite: it casts the Soviet system as a way of life built on terror and oppression, which is not reassurance.
        - |
          Truman proposed direct American aid outside the United Nations, a point his critics noticed at the time.
      answer: 1
      explanation: |
        Purpose and audience (sourcing). Ask who the speech was for (Congress, which had to vote the money, and the public behind it) and what the rhetoric was designed to make them do.

    - slug: apush-u08-w27-q03
      type: multiple_choice
      topic_code: "8.2"
      source: "Primary source: Harry S. Truman, Address before a Joint Session of Congress (March 12, 1947), Avalon Project"
      points: 1
      stimulus: *w27truman
      prompt: |
        The final paragraph of the excerpt anticipated which later development most directly?
      options:
        - "The decision to fight a limited war in Korea"
        - "The policy of massive retaliation"
        - "The creation of the North Atlantic Treaty Organization"
        - "The European Recovery Program (Marshall Plan)"
      option_explanations:
        - |
          Korea was a military commitment made in 1950 under very different circumstances; it is the opposite of aid that is primarily economic.
        - |
          Massive retaliation was Eisenhower's nuclear strategy of the mid-1950s, a reliance on weapons rather than on economic aid.
        - |
          NATO (1949) was a military alliance; the paragraph stresses economic and financial aid, not collective defence.
        - |
          Correct. Truman's emphasis on economic aid as the path to stability was carried to all of Western Europe three months later, when George Marshall proposed the recovery program that Congress funded in 1948.
      answer: 3
      explanation: |
        Making connections (continuity). The Truman Doctrine stated the principle and the Marshall Plan applied it on a continental scale: containment through economic strength first.

    - slug: apush-u08-w27-q04
      type: multiple_choice
      topic_code: "8.2"
      source: "Primary source: George C. Marshall, Speech at Harvard University (June 5, 1947), National Archives Milestone Documents"
      points: 1
      stimulus: |
        "Our policy is directed not against any country or doctrine but against hunger, poverty, desperation, and chaos."

        — Secretary of State George C. Marshall, speech at Harvard University, June 5, 1947
      prompt: |
        Despite Marshall's statement, the Soviet Union rejected the aid program he proposed chiefly because
      options:
        - "the program offered aid only to countries that had fought on the Allied side"
        - "Congress had already ruled out any aid to Communist governments in the original offer"
        - "the United States required recipients to join NATO before receiving aid"
        - "Soviet leaders saw it as a way to bind Eastern Europe to Western markets and American influence"
      option_explanations:
        - |
          Former enemies were included: western Germany and Italy were major recipients.
        - |
          The original offer did not exclude the Soviet bloc; that is why the Soviet refusal was a choice that sharpened the division of Europe.
        - |
          NATO did not exist until 1949, and Marshall Plan aid never required membership; neutral Sweden and Switzerland took part.
        - |
          Correct. The offer was formally open to all of Europe, but it required economic cooperation and openness to trade; Stalin saw a threat to Soviet control and made his satellites refuse.
      answer: 3
      explanation: |
        Point of view and causation. A program framed as humanitarian also served American strategic and economic goals, which is exactly what the Soviets objected to. The refusal hardened the economic division of Europe.

    - slug: apush-u08-w27-q05
      type: multiple_choice
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        NSC-68 (1950) differed from earlier statements of containment chiefly in that it
      options:
        - "argued that economic aid alone could contain the Soviet Union"
        - "proposed negotiating a settlement that would divide the world into recognised spheres of influence"
        - "called for a large and permanent military buildup, treating any Communist gain anywhere as a threat to American security"
        - "recommended withdrawing American forces from Europe to concentrate on Asia"
      option_explanations:
        - |
          That is closer to the Marshall Plan's logic in 1947; NSC-68 argued that economic tools were no longer enough.
        - |
          NSC-68 rejected accommodation; it described the Soviet Union as bent on world domination, which leaves no room for an agreed division of spheres.
        - |
          Correct. Kennan's containment was selective and largely political and economic; NSC-68 militarised and globalised it, and the Korean War made Congress willing to fund it.
        - |
          The report sought more strength everywhere, including Europe, where American troops were soon increased under NATO.
      answer: 2
      explanation: |
        Continuity and change. Containment survived as the goal, but the means shifted from mainly economic to mainly military, a change that shaped budgets for decades.

    - slug: apush-u08-w27-q06
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best describes the position of the United States at the start of Period 8 in 1945?
      options:
        - "Exhausted economically and dependent on British loans to rebuild its industry"
        - "Committed to a return to the isolationism of the 1930s, with no interest in international organisations"
        - "Equal in military strength to the Soviet Union and Britain, with which it shared nuclear technology"
        - "The world's leading industrial and financial power, sole possessor of the atomic bomb, and a founder of the United Nations"
      option_explanations:
        - |
          The war ended the Depression in the United States; American industry was intact and produced roughly half the world's manufactured goods, while Britain was the debtor.
        - |
          The United States hosted the UN's founding conference in San Francisco and joined the World Bank and IMF; the Senate's rejection of the League was not repeated.
        - |
          The United States held an atomic monopoly until 1949 and did not share bomb technology with the Soviet Union; it also cut off most nuclear cooperation with Britain in 1946.
        - |
          Correct. Untouched by bombing, with booming industry and a monopoly on the bomb until 1949, the United States was positioned to lead the postwar world, which is the context for every Period 8 foreign-policy question.
      answer: 3
      explanation: |
        Contextualization. Period 8 opens with American power at a peak; questions about containment, the boom and later the limits of power all start here.

    # ---- Stimulus set: Margaret Chase Smith's Declaration of Conscience (8.3)
    - slug: apush-u08-w27-q07
      type: multiple_choice
      topic_code: "8.3"
      source: "Primary source: Margaret Chase Smith, Declaration of Conscience, Congressional Record (June 1, 1950), U.S. Senate Historical Office"
      points: 1
      stimulus: &w27smith |
        "Those of us who shout the loudest about Americanism in making character assassinations are all too frequently those who, by our own words and acts, ignore some of the basic principles of Americanism

        The right to criticize.
        The right to hold unpopular beliefs.
        The right to protest.
        The right of independent thought. ...

        But I do not want to see the Republican party ride to political victory on the Four Horsemen of Calumny—Fear, Ignorance, Bigotry, and Smear."

        — Senator Margaret Chase Smith (Republican, Maine), speech in the U.S. Senate, June 1, 1950
      prompt: |
        Smith's speech was most directly a response to
      options:
        - "the Supreme Court's decision upholding the convictions of Communist Party leaders"
        - "the House Un-American Activities Committee's investigation of the film industry in 1947"
        - "Senator Joseph McCarthy's accusations, beginning in February 1950, that Communists had infiltrated the State Department"
        - "the Army–McCarthy hearings and the Senate's vote to censure McCarthy"
      option_explanations:
        - |
          Dennis v. United States was decided in 1951, a year after this speech, and Smith's target is fellow politicians' tactics, not a court.
        - |
          The Hollywood hearings were three years earlier and a House matter; Smith's reference to her party riding to victory points to the 1950 election season and the Senate.
        - |
          Correct. Four months after the Wheeling speech, Smith, joined by six Republican colleagues, attacked the smear tactics of her own party's most famous senator without naming him.
        - |
          Those events came in 1954, four years later; Smith's speech was one of the first criticisms, not a reaction to McCarthy's fall.
      answer: 2
      explanation: |
        Historical situation (sourcing). The date, the chamber and "character assassinations" all point to McCarthy's first months in the spotlight.

    - slug: apush-u08-w27-q08
      type: multiple_choice
      topic_code: "8.3"
      source: "Primary source: Margaret Chase Smith, Declaration of Conscience, Congressional Record (June 1, 1950), U.S. Senate Historical Office"
      points: 1
      stimulus: *w27smith
      prompt: |
        Smith's point of view is significant chiefly because she was
      options:
        - "a Republican criticising tactics that were helping her own party politically"
        - "a member of the Communist Party defending its right to organise"
        - "a Supreme Court justice explaining a constitutional ruling"
        - "a Democrat attacking the opposing party in an election year"
      option_explanations:
        - |
          Correct. Speaking against her own party's interest made her criticism credible and costly; she says plainly that she does not want Republicans to win by fear and smear.
        - |
          Smith was a staunch anti-Communist; her objection was to smears, not to fighting communism.
        - |
          Smith was a senator, speaking on the Senate floor, as the attribution shows.
        - |
          Smith was a Republican from Maine; a partisan Democratic attack would carry far less weight than criticism from inside McCarthy's party.
      answer: 0
      explanation: |
        Point of view (sourcing). A source that argues against the speaker's own interest is often especially revealing, and examiners reward noticing it.

    - slug: apush-u08-w27-q09
      type: multiple_choice
      topic_code: "8.3"
      source: "Primary source: Margaret Chase Smith, Declaration of Conscience, Congressional Record (June 1, 1950), U.S. Senate Historical Office"
      points: 1
      stimulus: *w27smith
      prompt: |
        The concerns Smith expressed were most clearly borne out by which of the following developments of the early 1950s?
      options:
        - "Thousands of federal workers, teachers and entertainers lost jobs through loyalty reviews and blacklists, often without evidence of disloyalty"
        - "The Supreme Court struck down all Cold War restrictions on political speech by 1952"
        - "Congress repealed the federal loyalty program in response to her speech"
        - "The Communist Party became a significant electoral force in several states"
      option_explanations:
        - |
          Correct. Loyalty boards, the Hollywood blacklist, state loyalty oaths and the Lavender Scare punished people for associations and opinions, exactly the rights to unpopular beliefs and independent thought that Smith named.
        - |
          The Court upheld restrictions in Dennis (1951) and only began narrowing them later in the decade, for example in Yates (1957).
        - |
          The loyalty program was expanded, not repealed: Eisenhower's Executive Order 10450 of 1953 broadened the grounds for dismissal.
        - |
          The party's membership fell steeply in the 1950s under prosecution and public hostility; it was never an electoral force.
      answer: 0
      explanation: |
        Using a source as evidence for a claim (argumentation). Match the rights Smith names to what actually happened to people who held unpopular views.

    - slug: apush-u08-w27-q10
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains why fears of Communist subversion gained wide public credibility between 1948 and 1950?
      options:
        - "President Truman publicly accused New Deal officials of spying for the Soviet Union"
        - "A series of events (the Hiss case, the Soviet atomic test, Mao's victory in China and the arrest of atomic spies) seemed to show that the United States was losing the Cold War through betrayal"
        - "The Communist Party won several seats in Congress in 1948"
        - "The Supreme Court ruled that the Communist Party was a foreign government"
      option_explanations:
        - |
          Truman created the loyalty program partly to blunt Republican attacks, but he denounced McCarthy's charges and vetoed the McCarran Act.
        - |
          Correct. In about eighteen months Americans saw a former New Deal official accused of espionage, the end of the atomic monopoly, the "loss" of China and the arrest of Klaus Fuchs and the Rosenbergs. Betrayal seemed the simplest explanation for setbacks abroad.
        - |
          No Communist was elected to Congress in 1948; the party's influence was in decline.
        - |
          No such ruling exists; Dennis (1951) upheld convictions of individual party leaders for conspiracy to advocate overthrow.
      answer: 1
      explanation: |
        Causation. Distinguish the real events (espionage existed) from the exaggerated conclusions politicians drew from them.

    - slug: apush-u08-w27-q11
      type: multi_select
      topic_code: "8.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were direct responses by the United States to the events of 1949–1950 (the Soviet atomic test, the Communist victory in China and the invasion of South Korea).
      options:
        - "Approval of the development of a hydrogen bomb"
        - "A steep increase in defense spending along the lines recommended by NSC-68"
        - "The creation of the Marshall Plan"
        - "The commitment of American troops to defend South Korea under a United Nations mandate"
        - "The proclamation of the Truman Doctrine"
      option_explanations:
        - |
          Correct. Truman approved a crash program for the "super" in January 1950, months after the Soviet test; the first American thermonuclear device was exploded in 1952.
        - |
          Correct. NSC-68 was drafted in early 1950; after Korea began, defense spending roughly tripled within a few years.
        - |
          The Marshall Plan was proposed in 1947 and funded in 1948, before these events.
        - |
          Correct. Truman sent American forces within days of the North Korean invasion in June 1950, with Security Council authorisation (the Soviets were boycotting the Council).
        - |
          The Truman Doctrine dates from March 1947, before all three events.
      answer: [0, 1, 3]
      explanation: |
        Chronological reasoning and causation. Sort the policies by date: 1947–1948 tools were mainly economic; the 1949–1950 shocks produced military answers.

    - slug: apush-u08-w27-q12
      type: multi_select
      topic_code: "8.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were part of the Second Red Scare (about 1947–1954).
      options:
        - "The federal employee loyalty program created by Executive Order 9835"
        - "The Palmer Raids and mass deportation of immigrant radicals"
        - "The Hollywood blacklist that followed the House Un-American Activities Committee hearings"
        - "The dismissal of gay and lesbian federal employees as supposed security risks"
        - "The internment of Japanese Americans"
      option_explanations:
        - |
          Correct. Truman's 1947 order screened millions of federal workers for loyalty, institutionalising the search for subversives.
        - |
          The Palmer Raids belong to the First Red Scare of 1919–1920, after World War I.
        - |
          Correct. After the Hollywood Ten were cited for contempt in 1947, studios refused to employ people suspected of Communist ties.
        - |
          Correct. The Lavender Scare ran alongside McCarthyism; Executive Order 10450 (1953) made sexual orientation grounds for dismissal.
        - |
          Japanese American internment (1942–1945) was a World War II policy driven by wartime racial fears, not anti-communism.
      answer: [0, 2, 3]
      explanation: |
        Comparison and periodisation. Keep the two Red Scares and wartime internment in their own boxes; each had different targets and causes.

    - slug: apush-u08-w27-q13
      type: true_false
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Senator Joseph McCarthy's influence declined sharply after televised hearings in 1954 exposed his tactics to a national audience, and the Senate voted to censure him that December.
      answer: true
      explanation: |
        True. The Army–McCarthy hearings let roughly 20 million viewers watch his bullying; his approval fell, and the Senate censured him 67–22 in December 1954. He died in 1957. The new medium of television (a Period 8 theme) helped both make and break him.

    - slug: apush-u08-w27-q14
      type: true_false
      topic_code: "7.14"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. At the Yalta Conference in February 1945, Stalin agreed to permit free elections in Poland, and the Soviet failure to honour that promise became an early source of postwar distrust.
      answer: true
      explanation: |
        True. Yalta's Declaration on Liberated Europe promised free elections; the Soviet-backed government in Poland made sure they were not free. Continuity: wartime diplomacy (7.14) set the terms of the Cold War's first quarrel.

    - slug: apush-u08-w27-q15
      type: fill_blank
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        In 1949 the United States joined ____, its first peacetime military alliance since the 1778 treaty with France, pledging that an armed attack on one member would be treated as an attack on all.
      answer: ["NATO", "the North Atlantic Treaty Organization", "North Atlantic Treaty Organization", "the North Atlantic Treaty", "North Atlantic Treaty", "N.A.T.O."]
      explanation: |
        The North Atlantic Treaty Organization. Its mutual-defence clause is Article 5. The Soviet answer was the Warsaw Pact (1955).

    - slug: apush-u08-w27-q16
      type: fill_blank
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. In ____ v. United States (1944), the Supreme Court upheld the wartime removal of Japanese Americans from the West Coast as a military necessity.
      answer: ["Korematsu", "Korematsu v. United States"]
      explanation: |
        Korematsu. Fred Korematsu's conviction was vacated in 1983, and the 1988 Civil Liberties Act apologised and paid reparations. Connect it to this week: national-security fears curbed civil liberties in both the war and the Red Scare.

    - slug: apush-u08-w27-q17
      type: multiple_choice
      topic_code: "7.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which of the following best describes a difference between the First Red Scare (1919–1920) and the Second Red Scare (1947–1954)?
      options:
        - "Only the second involved the federal government"
        - "The first was driven by fear of fascism; the second by fear of communism"
        - "The first targeted mainly immigrants and labour radicals and was over within about two years; the second reached into government, schools and entertainment and was institutionalised in loyalty programs and congressional committees"
        - "The first ended because the Supreme Court declared deportations unconstitutional"
      option_explanations:
        - |
          Attorney General A. Mitchell Palmer's Justice Department ran the 1919–1920 raids, so the federal government was central to both.
        - |
          Both Red Scares were aimed at communism and radicalism; fascism was not the concern in 1919.
        - |
          Correct. The Palmer Raids and deportations of 1919–1920 aimed at immigrant radicals and faded quickly; the postwar version lasted years and touched native-born professionals and officials.
        - |
          The First Red Scare faded when predicted uprisings (May Day 1920) failed to occur and public opinion turned, not because of a court ruling.
      answer: 2
      explanation: |
        Comparison. A good comparison names a similarity (both followed a war, both curbed civil liberties) and a difference (scale, duration, targets).

    - slug: apush-u08-w27-q18
      type: multiple_choice
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The decision to join NATO in 1949 marked the clearest break with which earlier American policy?
      options:
        - "Lend-Lease aid to Britain"
        - "The Neutrality Acts of the 1930s and the long tradition of avoiding permanent alliances"
        - "The Open Door policy in China"
        - "The Good Neighbor Policy toward Latin America"
      option_explanations:
        - |
          Lend-Lease (1941) was already a step away from neutrality, so NATO continued its logic rather than breaking with it.
        - |
          Correct. The Neutrality Acts tried to keep the United States out of European wars; NATO committed it in advance to fight for Europe, reversing an approach that went back to Washington's Farewell Address.
        - |
          The Open Door sought equal trade access in China; it is unrelated to binding military alliances in Europe.
        - |
          The Good Neighbor Policy concerned non-intervention in Latin America; it did not address alliances with European powers.
      answer: 1
      explanation: |
        Continuity and change across periods. Interwar isolationism (7.11) is the baseline against which postwar internationalism is measured.

    - slug: apush-u08-w27-q19
      type: multiple_choice
      topic_code: "7.13"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which of the following was an argument made at the time for using atomic bombs against Japan in August 1945?
      options:
        - "The Soviet Union had asked the United States to use the bombs"
        - "The bombs would make an invasion of the Japanese home islands, expected to be extremely costly, unnecessary"
        - "Japan had already offered unconditional surrender and needed only a demonstration"
        - "The bombs would allow the United States to share nuclear technology with its allies"
      option_explanations:
        - |
          The Soviets were told only vaguely of a powerful new weapon; some historians argue the bomb was used partly to impress them, the opposite of their request.
        - |
          Correct. Truman and Secretary of War Stimson justified the bombs as the way to end the war without an invasion that planners expected to cost very large numbers of casualties.
        - |
          Japan had not offered unconditional surrender; its government was divided, and the surrender came only after both bombs and the Soviet declaration of war.
        - |
          The United States guarded its monopoly; sharing technology was never the rationale.
      answer: 1
      explanation: |
        Historical interpretation. Historians still debate the decision (military necessity versus diplomacy toward the Soviets); know the arguments on each side and that the bomb opened the nuclear age that defines Period 8.

    - slug: apush-u08-w27-q20
      type: multiple_choice
      topic_code: "7.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which New Deal legacy most directly continued into Period 8?
      options:
        - "The Supreme Court's hostility to federal economic regulation"
        - "The expectation that the federal government would regulate the economy and provide a basic social safety net, such as Social Security"
        - "The National Recovery Administration's industrial codes"
        - "The Civilian Conservation Corps as a permanent agency"
      option_explanations:
        - |
          The Court accepted broad federal regulation after 1937; resistance did not continue into Period 8.
        - |
          Correct. Social Security, banking regulation, labour rights and the idea of federal responsibility for the economy outlasted the New Deal; Eisenhower expanded Social Security rather than repealing it.
        - |
          The Supreme Court struck down the NRA in 1935 (Schechter), so its codes did not survive into the postwar era.
        - |
          The CCC was ended in 1942; the war made it unnecessary.
      answer: 1
      explanation: |
        Continuity and change. The liberal consensus of the 1950s and the Great Society both built on the New Deal's expanded idea of government.

    - slug: apush-u08-w27-q21
      type: multiple_choice
      topic_code: "7.14"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Compared with its response to the League of Nations after World War I, the Senate's response to the United Nations Charter in 1945 shows that
      options:
        - "most Americans and their leaders now accepted that the United States should take a leading part in international organisations"
        - "the United Nations, unlike the League, had no power over its members"
        - "isolationists in the Senate had become stronger by 1945"
        - "the United States joined the UN only after a decade of delay"
      option_explanations:
        - |
          Correct. The Senate rejected the League in 1919–1920 but approved the UN overwhelmingly in July 1945; the war convinced most leaders that isolation had failed.
        - |
          The UN Security Council can authorise force, as it did in Korea; this also misses the point about American attitudes.
        - |
          The Senate ratified the Charter 89–2, the opposite of isolationist strength.
        - |
          The United States hosted the founding conference and joined at once in 1945.
      answer: 0
      explanation: |
        Comparison across periods. The contrast with 1919 is a standard way to show how World War II changed America's role in the world.

    - slug: apush-u08-w27-q22
      type: short_answer
      topic_code: "8.2"
      source: "general knowledge"
      points: 3
      stimulus: |
        Interpretation A (written for this course, in the spirit of the "orthodox" view of the 1950s): The Cold War was a defensive response by the United States to Soviet expansion. Stalin broke his promises at Yalta, imposed Communist governments on Eastern Europe and probed for weakness in Iran, Turkey, Greece and Berlin. American leaders reluctantly built alliances and armies because nothing else would stop him.

        Interpretation B (written for this course, in the spirit of the "revisionist" view of the 1960s): The Cold War grew as much from American as from Soviet choices. The United States wanted an open world economy for its exports and investment, used its atomic monopoly and economic power to pressure a devastated Soviet Union, and treated Soviet demands for security in Eastern Europe as proof of limitless ambition.
      prompt: |
        Using the two interpretations above, answer (a), (b) and (c).

        (a) Briefly describe ONE major difference between Interpretation A and Interpretation B.
        (b) Briefly explain how ONE specific historical event or development from 1945 to 1950 not directly mentioned in the excerpts could be used to support Interpretation A.
        (c) Briefly explain how ONE specific historical event or development from 1945 to 1950 not directly mentioned in the excerpts could be used to support Interpretation B.
      answer: |
        (a) Interpretation A places responsibility for the Cold War on Soviet expansion and sees American policy as a reluctant defence, while Interpretation B argues that American economic aims and pressure helped cause the conflict and that Soviet actions were partly defensive.

        (b) The Berlin Blockade of 1948 supports A: the Soviets cut off land access to West Berlin to force the Western powers out, and the United States responded with an airlift rather than force, which looks like defensive containment of Soviet pressure.

        (c) The Marshall Plan supports B: it was designed partly to revive Western European markets for American goods and required economic openness, which Soviet leaders saw as a way to pull Eastern Europe out of their sphere, so they refused it and tightened control.
      explanation: |
        Three points, one per part.

        (a) 1 pt for a clear difference, e.g. who bears responsibility (Soviet versus shared or American), or the motive for U.S. policy (defence versus economic expansion), or how Soviet actions are read (aggressive versus security-driven). Merely summarising one interpretation earns nothing.

        (b) 1 pt for a specific event that supports A, explained: Soviet control of Poland and the rigged elections; the Czechoslovak coup of 1948; the Berlin Blockade; Soviet pressure on Iran (1946) or Turkey; the Soviet atomic test with espionage help; the Kennan Long Telegram as evidence of how American officials perceived Soviet aims. Yalta, Greece and Turkey are in the excerpt, so they need a new specific angle.

        (c) 1 pt for a specific event that supports B, explained: the Marshall Plan's economic aims; the abrupt end of Lend-Lease to the Soviets in 1945; American refusal of a large reconstruction loan; the atomic monopoly and "atomic diplomacy"; the Truman Doctrine's sweeping language; the merger of the western zones of Germany and the new currency that triggered the blockade.

        Zero: events after 1950 without explanation, events that do not fit the interpretation claimed, or no explanation linking the event to the interpretation.

    - slug: apush-u08-w27-q23
      type: short_answer
      topic_code: "7.12"
      source: "general knowledge"
      points: 3
      stimulus: |
        Source (described): A widely reproduced wartime poster shows a woman worker in a factory, sleeves rolled up and flexing her arm, under a slogan announcing that women can do the job. Such images were produced to recruit women into defense industries during World War II.
      prompt: |
        Review. Using the source described above, answer (a), (b) and (c).

        (a) Briefly describe ONE purpose of the poster.
        (b) Briefly explain ONE way World War II mobilisation changed opportunities for women or African Americans.
        (c) Briefly explain ONE way those wartime changes were limited or reversed in the years immediately after 1945.
      answer: |
        (a) The poster aimed to persuade women to take industrial jobs vacated by men who joined the armed forces, presenting factory work as patriotic and within women's abilities.

        (b) Wartime demand drew millions of women into paid work, including skilled and well-paid defense jobs; similarly, the threatened March on Washington led Roosevelt to issue Executive Order 8802, banning discrimination in defense industries, and African Americans moved north and west for defense work.

        (c) After the war many women were laid off or pressured to leave industrial jobs for returning veterans, and the postwar culture celebrated domesticity; the wartime Fair Employment Practices Committee was allowed to lapse in 1946, so the protection against job discrimination ended.
      explanation: |
        Three points, one per part.

        (a) 1 pt for a purpose: recruiting women into war production; making factory work seem respectable and patriotic; boosting morale. Description of the image alone does not earn the point.

        (b) 1 pt for a specific change explained: women's entry into defense industry jobs (about 6 million more women in the workforce); WACs and WAVES; Executive Order 8802 and the FEPC; the Second Great Migration to industrial cities; the Double V campaign.

        (c) 1 pt for a specific limitation or reversal: layoffs of women at demobilisation; unequal pay during the war; postwar emphasis on domesticity and the baby boom; the end of the FEPC; continued segregation in the military until 1948 and racial violence against returning Black veterans.

        Zero: answers that only restate the poster, or that describe changes from the 1960s rather than the war years.

    - slug: apush-u08-w27-q24
      type: long_answer
      topic_code: "8.3"
      source: "general knowledge"
      points: 6
      prompt: |
        Long essay. In the decade after World War II, the rivalry with the Soviet Union shaped not only American foreign policy but also American politics and civil liberties at home. Historians have pointed to loyalty programs, congressional investigations, court decisions and the careers of politicians who made anti-communism their cause, and to the critics who resisted them.

        Evaluate the extent to which fear of communism changed American political life and civil liberties from 1945 to 1955.
      answer: |
        Thesis: Between 1945 and 1955 fear of communism substantially changed American political life, institutionalising loyalty testing and narrowing the range of acceptable dissent, although the excesses of McCarthyism produced a backlash that limited its reach by the mid-1950s.

        Context: Soviet control of Eastern Europe, the 1949 shocks (the Soviet bomb and China) and real cases of espionage made Americans fearful, building on an older anti-radical tradition dating to the First Red Scare.

        Body 1 (government institutions): Executive Order 9835 (1947) screened millions of federal workers; the McCarran Act (1950) forced registration of Communist groups; Executive Order 10450 (1953) widened grounds for dismissal, including the Lavender Scare.

        Body 2 (politics and culture): HUAC's 1947 hearings and the Hollywood blacklist; the Hiss case made Nixon; McCarthy's Wheeling speech and accusations intimidated critics; teachers faced loyalty oaths; unions expelled Communist members.

        Body 3 (limits): Margaret Chase Smith's Declaration of Conscience (1950), Truman's veto of the McCarran Act, the televised Army–McCarthy hearings and censure in 1954; later Court decisions such as Yates (1957) narrowed the Smith Act.

        Complexity: the change was large but uneven, and it was partly driven by real espionage, which is why liberals as well as conservatives accepted loyalty testing.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (1 pt): a historically defensible claim that answers "to what extent" with a line of reasoning, e.g. "significantly, through loyalty programs and investigations, though McCarthy's fall limited it." A restatement of the prompt earns nothing.

        Contextualization (1 pt): a broader situation before or during the period, explained: the breakdown of the wartime alliance and Soviet domination of Eastern Europe; the 1949 shocks; the First Red Scare and the Smith Act (1940) as precedents; real espionage cases. A passing phrase does not earn it.

        Evidence (2 pts): 1 pt for two specific, relevant examples; 2 pts for using them to support the argument. Acceptable: Executive Order 9835; HUAC and the Hollywood Ten; the Hiss case; the Rosenbergs; McCarthy's Wheeling speech; the McCarran Act; Dennis v. United States (1951); loyalty oaths for teachers; the Lavender Scare and Executive Order 10450; the CIO's expulsion of left-led unions; Margaret Chase Smith; the Army–McCarthy hearings and censure.

        Analysis and reasoning (2 pts): 1 pt for using a reasoning process to frame the argument (continuity and change in civil liberties, causation from foreign events to domestic fear, or comparison with 1919–1920); 1 pt for complex understanding, e.g. weighing real espionage against exaggerated fear, explaining both change and continuity, considering how different groups (federal workers, gay Americans, entertainers, unions) experienced it, or explaining the backlash as well as the scare.

        Common errors: placing internment or the Palmer Raids in the Second Red Scare; treating McCarthy as the whole story (the loyalty program predates him); describing without evaluating "extent".
