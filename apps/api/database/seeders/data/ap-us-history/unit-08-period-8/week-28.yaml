week: 28
unit: 8
title: "Postwar Prosperity, Culture and Early Civil Rights"
topics: ["8.4", "8.5", "8.6"]
guide: guides/week-28.md
guide_description: |
  Why the postwar economy boomed and who shared in it: the GI Bill, suburbs, highways, the Sun Belt and organised
  labour's bargain with big business. Then the culture of the 1950s (consumerism, television, religion, family,
  conformity and its critics) and the first victories of the civil rights movement, from Executive Order 9981 to
  Brown, Montgomery and Little Rock. Worked examples: reading a births table, sourcing Brown v. Board, and a
  "to what extent" thesis on postwar prosperity.
flashcards_description: |
  33 cards on the postwar boom, suburbanization and its exclusions, 1950s culture and its critics, and the people,
  cases and campaigns of the civil rights movement before 1960.

flashcards:
  - front: GI Bill (Servicemen's Readjustment Act, 1944) → benefits and effects
    back: |
      Gave World War II veterans tuition for college or vocational training, low-interest home and business loans, and unemployment pay. Millions went to college and bought homes, building the postwar middle class. Because benefits were administered locally, Black veterans in the South were often denied them.
    topic_code: "8.4"
  - front: Why did the American economy boom after 1945?
    back: |
      Pent-up wartime savings and demand, cheap energy, Cold War defense spending, federal support for housing, highways and education, a growing population, and the absence of serious foreign competition while Europe and Japan rebuilt.
    topic_code: "8.4"
  - front: The baby boom (1946–1964) → scale and effects
    back: |
      Annual births rose from about 2.6 million in 1940 to a peak of about 4.3 million in 1957. The boom drove demand for houses, schools, toys and later colleges, and its huge generation shaped youth culture in the 1960s.
    topic_code: "8.4"
  - front: Levittown (1947) → what it represents
    back: |
      William Levitt's mass-produced suburb on Long Island, built with assembly-line methods and sold with federally backed mortgages. It became the symbol of affordable suburban home ownership, and its original deeds barred sale to Black buyers.
    topic_code: "8.4"
  - front: FHA and VA mortgages → how federal policy shaped suburbs and race
    back: |
      Federally insured loans with low down payments made buying cheaper than renting, but underwriting rules favoured new, white suburbs and rated Black and mixed neighbourhoods as poor risks (redlining). Federal policy therefore helped build both suburban prosperity and residential segregation.
    topic_code: "8.4"
  - front: Federal-Aid Highway Act (1956) → what it built and why
    back: |
      Eisenhower's law funded a 41,000-mile interstate highway system, justified partly by national defense (evacuation and troop movement). It sped suburbanization, trucking and car culture, and often routed highways through Black and poor urban neighbourhoods.
    topic_code: "8.4"
  - front: Sun Belt → what it is and why it grew after 1945
    back: |
      The South and Southwest, from Florida to California. Defense plants and military bases, air conditioning, cheap land, low taxes and weak unions drew people and industry from the Northeast and Midwest; political power shifted with them.
    topic_code: "8.4"
  - front: Taft-Hartley Act (1947) → what it did to labour
    back: |
      Passed by a Republican Congress over Truman's veto after a wave of strikes in 1946. It banned the closed shop, let states pass right-to-work laws, allowed the president to impose cooling-off periods, and required union officers to swear they were not Communists.
    topic_code: "8.4"
  - front: The postwar labour bargain (UAW and General Motors, 1950)
    back: |
      Unions accepted management control of production in return for rising wages tied to productivity and cost of living, pensions and health insurance. Union members joined the middle class, but private benefits replaced a push for national health insurance.
    topic_code: "8.4"
  - front: AFL-CIO merger (1955) → significance
    back: |
      The craft-based AFL and the industrial CIO reunited, marking organised labour's peak of about a third of nonfarm workers. Membership as a share of the workforce declined from then on.
    topic_code: "8.4"
  - front: Bracero Program (1942–1964)
    back: |
      A U.S.–Mexico agreement that brought several million temporary contracts for Mexican farm workers. Growers wanted the cheap labour; workers often faced poor conditions and broken contracts. A 1954 federal campaign of mass deportation of undocumented Mexicans ran alongside it.
    topic_code: "8.4"
  - front: Truman's Fair Deal → what passed and what did not
    back: |
      Truman proposed national health insurance, federal aid to education, civil rights laws and repeal of Taft-Hartley. A conservative coalition of Republicans and Southern Democrats blocked most of it; a higher minimum wage, expanded Social Security and public housing (1949) passed.
    topic_code: "8.4"
  - front: Eisenhower's "Modern Republicanism" → what he kept
    back: |
      Eisenhower balanced budgets where he could but did not roll back the New Deal: he expanded Social Security, raised the minimum wage, created the Department of Health, Education and Welfare (1953) and built the interstates. Evidence of a bipartisan liberal consensus.
    topic_code: "8.4"
  - front: Television in the 1950s → spread and effect
    back: |
      Household ownership went from a small minority in 1950 to most homes by 1960. Television created a shared national culture, sold consumer goods, shaped politics (the Army–McCarthy hearings, the 1960 debates) and later brought civil rights violence into living rooms.
    topic_code: "8.5"
  - front: The 1950s religious revival → evidence
    back: |
      Church membership rose, the evangelist Billy Graham drew huge crowds, Congress added "under God" to the Pledge of Allegiance (1954) and made "In God We Trust" the national motto (1956). Religion was presented as what separated America from "godless" communism.
    topic_code: "8.5"
  - front: The ideal of domesticity in the 1950s vs reality
    back: |
      Magazines and television celebrated the suburban housewife and the breadwinner father, and women married younger. Yet the share of women in paid work, including married women, kept rising through the decade: the gap between ideal and reality fed later feminism.
    topic_code: "8.5"
  - front: Critics of 1950s conformity → who and what
    back: |
      Sociologists and writers warned that corporate life and suburbia bred conformity and lost individuality (books such as The Organization Man and The Lonely Crowd); others attacked advertising and the affluent society's neglect of public needs. Their arguments seeded 1960s dissent.
    topic_code: "8.5"
  - front: The Beat Generation → who and what they rejected
    back: |
      Writers such as Jack Kerouac and Allen Ginsberg who rejected materialism, conformity and sexual conventions in the mid-1950s. Small in number, they influenced the counterculture of the 1960s.
    topic_code: "8.5"
  - front: Rock and roll in the 1950s → why adults worried
    back: |
      Built on Black rhythm and blues, it reached white teenagers through radio and records, with stars such as Elvis Presley and Chuck Berry. Critics saw it as encouraging delinquency and racial mixing; teenagers' spending made them a new market.
    topic_code: "8.5"
  - front: Jackie Robinson (1947) → significance
    back: |
      Joined the Brooklyn Dodgers, integrating Major League Baseball. A visible break in the colour line seven years before Brown, showing that integration of a national institution was possible.
    topic_code: "8.6"
  - front: To Secure These Rights (1947) → what it was
    back: |
      The report of Truman's President's Committee on Civil Rights, which documented lynching, disenfranchisement and segregation and recommended federal anti-lynching law, voting protections and an end to segregation. Congress acted on almost none of it, so Truman used executive power.
    topic_code: "8.6"
  - front: Executive Order 9981 (July 1948) → what it did
    back: |
      Truman ordered equality of treatment and opportunity in the armed services without regard to race. Integration came slowly and was largely complete during the Korean War. It showed civil rights could advance by executive action when Congress was blocked.
    topic_code: "8.6"
  - front: Dixiecrats (1948) → who and why
    back: |
      Southern Democrats who walked out of the Democratic convention over its civil rights plank and ran Strom Thurmond for president on the States' Rights ticket. They carried four Deep South states: the first crack in the Solid South.
    topic_code: "8.6"
  - front: NAACP legal strategy → who led it and how it worked
    back: |
      Charles Hamilton Houston and Thurgood Marshall of the NAACP Legal Defense Fund attacked segregation case by case, first in graduate and law schools (where states could not plausibly provide equal facilities), then against the principle of separate but equal itself.
    topic_code: "8.6"
  - front: Mendez v. Westminster (1947) → significance
    back: |
      A federal court case brought by Mexican American families that ended the segregation of Mexican American children in Orange County, California schools. Thurgood Marshall filed a brief; it foreshadowed Brown.
    topic_code: "8.6"
  - front: Hernandez v. Texas (1954) → ruling
    back: |
      The Supreme Court ruled unanimously that the Fourteenth Amendment protected Mexican Americans from systematic exclusion from juries; equal protection was not limited to Black and white. Decided two weeks before Brown.
    topic_code: "8.6"
  - front: Brown v. Board of Education (1954) → ruling and its weakness
    back: |
      A unanimous Supreme Court under Chief Justice Earl Warren held that segregated public schools violated the Fourteenth Amendment, overturning Plessy v. Ferguson for education. The 1955 implementation decision (Brown II) set no deadline, which let Southern states delay for years.
    topic_code: "8.6"
  - front: Emmett Till (1955) → why his murder mattered
    back: |
      A 14-year-old Chicago boy murdered in Mississippi for allegedly whistling at a white woman; an all-white jury acquitted the killers. His mother's open-casket funeral and the photographs published in the Black press galvanised a generation of activists.
    topic_code: "8.6"
  - front: Montgomery Bus Boycott (1955–1956) → how it began and how it ended
    back: |
      Began when Rosa Parks, an NAACP activist, was arrested for refusing to give up her seat; local Black women's groups and ministers organised a 381-day boycott led by Martin Luther King Jr. It ended when the Supreme Court affirmed Browder v. Gayle (1956), striking down bus segregation.
    topic_code: "8.6"
  - front: Southern Manifesto (1956) → who and what
    back: |
      A declaration signed by 101 Southern members of Congress calling Brown a clear abuse of judicial power and pledging to use all lawful means to reverse it. It gave political cover to massive resistance.
    topic_code: "8.6"
  - front: Little Rock Nine (1957) → what happened and why it mattered
    back: |
      Arkansas Governor Orval Faubus used the National Guard to block nine Black students from Central High School. After a mob gathered, Eisenhower sent the 101st Airborne to enforce the court order: the first federal troops sent to the South to protect Black citizens' rights since Reconstruction.
    topic_code: "8.6"
  - front: Civil Rights Act of 1957 → content and significance
    back: |
      The first federal civil rights law since Reconstruction. It created a Civil Rights Commission and a Civil Rights Division in the Justice Department to pursue voting cases, but weak enforcement left Southern disenfranchisement largely intact.
    topic_code: "8.6"
  - front: SCLC (1957) → who and how
    back: |
      The Southern Christian Leadership Conference, founded by Martin Luther King Jr. and other Black ministers after Montgomery to coordinate nonviolent direct action through churches across the South.
    topic_code: "8.6"

quiz:
  description: |
    24 questions · about 40 minutes · about two thirds this week (the postwar economy, 1950s culture, early civil
    rights) and a third review of week 27 (containment and the Red Scare) and Period 7 (the Great Migration, the
    Depression and the New Deal). Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long essay are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set: Brown v. Board of Education (8.6)
    - slug: apush-u08-w28-q01
      type: multiple_choice
      topic_code: "8.6"
      source: "Primary source: Brown v. Board of Education of Topeka, 347 U.S. 483 (1954), Justia"
      points: 1
      stimulus: &w28brown |
        "Today, education is perhaps the most important function of state and local governments. ...

        To separate them from others of similar age and qualifications solely because of their race generates a feeling of inferiority as to their status in the community that may affect their hearts and minds in a way unlikely ever to be undone. ...

        We conclude that, in the field of public education, the doctrine of "separate but equal" has no place. Separate educational facilities are inherently unequal."

        — Chief Justice Earl Warren, opinion of a unanimous Supreme Court, Brown v. Board of Education of Topeka, May 17, 1954
      prompt: |
        The decision excerpted above most directly reversed the reasoning of which earlier ruling?
      options:
        - "Schechter Poultry Corp. v. United States (1935)"
        - "Dred Scott v. Sandford (1857)"
        - "Korematsu v. United States (1944)"
        - "Plessy v. Ferguson (1896)"
      option_explanations:
        - |
          Schechter struck down the National Recovery Administration on commerce and delegation grounds; it has nothing to do with segregation.
        - |
          Dred Scott denied that Black Americans could be citizens; the Fourteenth Amendment had already overturned it in 1868.
        - |
          Korematsu upheld Japanese American removal in wartime; Brown did not address it.
        - |
          Correct. Plessy upheld state-mandated segregation so long as facilities were "separate but equal." Brown rejected that doctrine for public education, finding segregation itself unequal.
      answer: 3
      explanation: |
        Making connections across periods. Brown's famous final sentence answers the phrase "separate but equal," which comes from Plessy (Period 6).

    - slug: apush-u08-w28-q02
      type: multiple_choice
      topic_code: "8.6"
      source: "Primary source: Brown v. Board of Education of Topeka, 347 U.S. 483 (1954), Justia"
      points: 1
      stimulus: *w28brown
      prompt: |
        The second paragraph of the excerpt reflects the Court's reliance on which kind of evidence presented by the NAACP?
      options:
        - "Testimony from Southern governors about public opinion"
        - "Comparisons of spending on Black and white schools in each state"
        - "The debates of the Congress that wrote the Fourteenth Amendment"
        - "Psychological and social-science research on the effects of segregation on children"
      option_explanations:
        - |
          Southern officials defended segregation; their views are not the basis of the passage about children's hearts and minds.
        - |
          The Court assumed for argument that tangible facilities might be equal; its reasoning turns on intangible harm, not dollars.
        - |
          The Court found the historical record of the amendment's framers inconclusive and set it aside.
        - |
          Correct. The NAACP's lawyers, led by Thurgood Marshall, introduced studies such as the Clarks' doll tests; the Court cited social-science findings in a footnote to support its conclusion about a feeling of inferiority.
      answer: 3
      explanation: |
        Sourcing (purpose and argument). The Court's case is about the effect of segregation on children, not about buildings, which is why it overturned the principle rather than ordering equal spending.

    - slug: apush-u08-w28-q03
      type: multiple_choice
      topic_code: "8.6"
      source: "Primary source: Brown v. Board of Education of Topeka, 347 U.S. 483 (1954), Justia"
      points: 1
      stimulus: *w28brown
      prompt: |
        Which of the following best describes the immediate effect of the decision in most of the Deep South?
      options:
        - "The Supreme Court withdrew the decision in 1955"
        - "Massive resistance: state laws, school closures and political pledges to block integration, so that very few Black children in the Deep South attended integrated schools by the early 1960s"
        - "Congress passed legislation to enforce the decision within months"
        - "Rapid integration of public schools within two years"
      option_explanations:
        - |
          Brown II (1955) concerned implementation; it did not withdraw the ruling.
        - |
          Correct. The Southern Manifesto, pupil-placement laws, Virginia's school closures and defiance at Little Rock delayed compliance; Brown II (1955) set no deadline.
        - |
          Congress passed no school desegregation enforcement until 1964; the 1957 act dealt mainly with voting.
        - |
          Integration in the Deep South was minimal for a decade; real change came only after the Civil Rights Act of 1964 tied federal funds to desegregation.
      answer: 1
      explanation: |
        Causation and its limits. A landmark ruling changed the law, but enforcement depended on presidents, Congress and continued activism.

    # ---- Stimulus set: births table (8.4, with review)
    - slug: apush-u08-w28-q04
      type: multiple_choice
      topic_code: "8.4"
      source: "National Center for Health Statistics, Vital Statistics of the United States; U.S. Census Bureau, Historical Statistics of the United States"
      points: 1
      stimulus: &w28births |
        Registered births in the United States, selected years (millions, rounded)

        | Year | Births |
        |---|---|
        | 1940 | 2.6 |
        | 1946 | 3.4 |
        | 1950 | 3.6 |
        | 1957 | 4.3 |
        | 1964 | 4.0 |
        | 1970 | 3.7 |
        | 1975 | 3.1 |

        Source: National Center for Health Statistics; U.S. Census Bureau, Historical Statistics of the United States.
      prompt: |
        Which of the following most directly contributed to the trend in births between 1946 and 1957?
      options:
        - "A large increase in immigration from Europe under the national-origins quotas"
        - "The widespread availability of the birth control pill"
        - "Rising unemployment that encouraged families to stay at home"
        - "Postwar prosperity, earlier marriage and federal support for home ownership after years of depression and war"
      option_explanations:
        - |
          The quotas of 1924 kept European immigration low until 1965; births in the table are to residents, and the boom was driven by native-born families.
        - |
          The pill was approved in 1960 and is associated with the decline after 1957, not the rise.
        - |
          Unemployment stayed low in the postwar boom; economic hardship lowers birth rates, as the 1930s showed.
        - |
          Correct. Couples who had postponed families during the Depression and war married younger and had more children, encouraged by rising incomes, GI Bill benefits and affordable suburban homes.
      answer: 3
      explanation: |
        Causation from data. Name the trend (a rise of almost a million births a year), then explain it with specific causes.

    - slug: apush-u08-w28-q05
      type: multiple_choice
      topic_code: "8.4"
      source: "National Center for Health Statistics, Vital Statistics of the United States; U.S. Census Bureau, Historical Statistics of the United States"
      points: 1
      stimulus: *w28births
      prompt: |
        The trend shown in the table between 1946 and 1964 most directly contributed to which development of the 1960s?
      options:
        - "The end of suburban growth"
        - "A labour shortage that ended the Bracero Program"
        - "A large, young generation whose numbers gave weight to youth culture, campus protest and the counterculture"
        - "A shrinking college population and the closing of universities"
      option_explanations:
        - |
          Suburbs kept growing through the 1960s and 1970s.
        - |
          The Bracero Program ended in 1964 mainly because of pressure from labour and Mexican American activists and mechanisation, not a labour shortage.
        - |
          Correct. By the mid-1960s roughly a third of Americans were under 18 or close to it; their sheer numbers made youth a market and a political force, from rock music to antiwar protest.
        - |
          Enrolments rose sharply in the 1960s as baby boomers reached college age, aided by federal education spending.
      answer: 2
      explanation: |
        Causation across time. Demographic change is a long-term cause: the 1950s boom is part of the explanation for the 1960s youth culture (8.12).

    - slug: apush-u08-w28-q06
      type: multiple_choice
      topic_code: "7.9"
      source: "National Center for Health Statistics, Vital Statistics of the United States; U.S. Census Bureau, Historical Statistics of the United States"
      points: 1
      stimulus: *w28births
      prompt: |
        Review. The relatively low figure for 1940 is best explained by
      options:
        - "the effects of the 1918 influenza pandemic"
        - "the absence of millions of men overseas in combat"
        - "the deportation of most immigrants during the Red Scare of 1919–1920"
        - "the effects of the Great Depression, which led many couples to delay marriage and children"
      option_explanations:
        - |
          The 1918 pandemic was more than two decades earlier and does not explain a low birth count in 1940.
        - |
          The United States did not enter the war until December 1941, so mass deployment had not begun in 1940.
        - |
          Several hundred radicals were deported in 1919–1920, a tiny number with no measurable effect on births twenty years later.
        - |
          Correct. Birth rates fell through the 1930s as unemployment and insecurity led people to postpone marriage and families; 1940 still reflects that low.
      answer: 3
      explanation: |
        Contextualization with review of 7.9. The baby boom only makes sense against the low baseline of the Depression years.

    # ---- Stimulus set: Eisenhower on Little Rock (8.6, with review)
    - slug: apush-u08-w28-q07
      type: multiple_choice
      topic_code: "8.6"
      source: "Primary source: Dwight D. Eisenhower, Radio and Television Address on the Situation in Little Rock (September 24, 1957), American Presidency Project"
      points: 1
      stimulus: &w28littlerock |
        "Our personal opinions about the decision have no bearing on the matter of enforcement; the responsibility and authority of the Supreme Court to interpret the Constitution are very clear. ...

        Mob rule cannot be allowed to override the decisions of our courts. ...

        At a time when we face grave situations abroad because of the hatred that Communism bears toward a system of government based on human rights, it would be difficult to exaggerate the harm that is being done to the prestige and influence, and indeed to the safety, of our nation and the world."

        — President Dwight D. Eisenhower, national radio and television address, September 24, 1957
      prompt: |
        Eisenhower's address explained his decision to
      options:
        - "order the desegregation of the armed forces"
        - "send federal troops to enforce a court order integrating Central High School in Little Rock, Arkansas"
        - "sign the Civil Rights Act of 1964"
        - "propose a constitutional amendment banning school segregation"
      option_explanations:
        - |
          Truman ordered military desegregation in 1948 (Executive Order 9981).
        - |
          Correct. After Governor Orval Faubus used the Arkansas National Guard to block nine Black students and a mob gathered, Eisenhower sent the 101st Airborne Division and federalised the Guard.
        - |
          The 1964 act was signed by Lyndon Johnson, seven years later.
        - |
          Eisenhower never proposed such an amendment; he relied on enforcing Brown as the law.
      answer: 1
      explanation: |
        Historical situation. Date and place (September 1957, the Court's decision, mob rule) identify the Little Rock crisis.

    - slug: apush-u08-w28-q08
      type: multiple_choice
      topic_code: "8.6"
      source: "Primary source: Dwight D. Eisenhower, Radio and Television Address on the Situation in Little Rock (September 24, 1957), American Presidency Project"
      points: 1
      stimulus: *w28littlerock
      prompt: |
        The first sentence of the excerpt suggests that Eisenhower's main justification for acting was
      options:
        - "his strong personal commitment to rapid racial integration"
        - "his duty to uphold the authority of the federal courts and the rule of law, whatever his own views"
        - "a desire to win Black votes in the 1958 elections"
        - "pressure from Southern governors who asked for federal help"
      option_explanations:
        - |
          Eisenhower was privately cautious about Brown; he says his personal opinions have no bearing, which points away from a moral crusade.
        - |
          Correct. He frames the decision as enforcement of the Constitution as the Court interprets it, and as resistance to mob rule, not as an endorsement of integration.
        - |
          The address is framed around law and national prestige; nothing in it appeals to Black voters.
        - |
          Faubus was defying the courts; he did not ask for federal troops, and other Southern governors condemned the deployment.
      answer: 1
      explanation: |
        Point of view and purpose. A president speaking to a national audience, including white Southerners, chose the language of law and order rather than of civil rights to justify an unpopular step.

    - slug: apush-u08-w28-q09
      type: multiple_choice
      topic_code: "8.2"
      source: "Primary source: Dwight D. Eisenhower, Radio and Television Address on the Situation in Little Rock (September 24, 1957), American Presidency Project"
      points: 1
      stimulus: *w28littlerock
      prompt: |
        Review. The final paragraph of the excerpt best illustrates how
      options:
        - "the Marshall Plan required the United States to integrate its schools"
        - "the Cold War gave American leaders a foreign-policy reason to oppose segregation, because racial violence damaged the nation's image in the competition for world opinion"
        - "the United Nations had ordered the United States to desegregate"
        - "the Red Scare led Eisenhower to accuse civil rights activists of communism"
      option_explanations:
        - |
          Marshall Plan aid had no conditions about American domestic policy.
        - |
          Correct. Soviet propaganda used American racism to win over newly independent nations in Africa and Asia; Eisenhower links Little Rock to the "grave situations abroad" of the Cold War.
        - |
          The UN issued no such order; Eisenhower speaks of prestige and influence, not legal obligation.
        - |
          Some segregationists did call civil rights activists Communists, but Eisenhower here argues the opposite: the mob helps the Communists.
      answer: 1
      explanation: |
        Making connections (review of 8.2). The Cold War both constrained civil rights (the Red Scare) and pushed it forward (the international image argument). Both belong in a complex argument.

    - slug: apush-u08-w28-q10
      type: multiple_choice
      topic_code: "8.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best describes how federal housing policy affected American society after 1945?
      options:
        - "It made home ownership affordable for millions of white families while largely excluding Black families through redlining and the acceptance of restrictive covenants, deepening residential segregation"
        - "It had little effect, because most homes were bought without mortgages"
        - "It encouraged integrated urban neighbourhoods by funding apartment buildings in city centres"
        - "It reserved most new suburban housing for veterans of colour"
      option_explanations:
        - |
          Correct. FHA and VA loans built the suburbs, but underwriting rules marked Black and mixed areas as risky, and developers such as Levitt sold only to white buyers. Home equity became the main source of family wealth, so the gap persisted.
        - |
          Low-down-payment, long-term federally insured mortgages are precisely why home ownership jumped from about 44% of households in 1940 to about 62% in 1960.
        - |
          Federal mortgage insurance favoured new suburban single-family homes, not integrated city apartments; urban renewal often displaced Black neighbourhoods.
        - |
          Veterans of colour were frequently denied GI Bill housing benefits, especially in the South.
      answer: 0
      explanation: |
        Causation and complexity. The same policy produced the middle-class suburb and the segregated metropolitan area; good essays explain both effects.

    - slug: apush-u08-w28-q11
      type: multiple_choice
      topic_code: "8.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The Taft-Hartley Act of 1947 is best understood as
      options:
        - "a law establishing the first federal minimum wage"
        - "an extension of the Wagner Act that strengthened unions' right to organise"
        - "a program that funded college tuition for veterans"
        - "a response by a Republican Congress to the strike wave of 1946 that limited union tactics, permitted state right-to-work laws and required non-Communist oaths from union officers"
      option_explanations:
        - |
          The first federal minimum wage came in the Fair Labor Standards Act of 1938.
        - |
          Taft-Hartley amended the Wagner Act to restrict unions; labour called it a slave-labour bill.
        - |
          Tuition for veterans came from the GI Bill of 1944, a separate wartime law.
        - |
          Correct. Passed over Truman's veto, it banned the closed shop and secondary boycotts and let states outlaw union-shop agreements, helping keep unions weak in the growing South.
      answer: 3
      explanation: |
        Continuity and change in labour relations: New Deal gains survived, but Taft-Hartley set limits that shaped the Sun Belt's economy.

    - slug: apush-u08-w28-q12
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following most directly challenged the 1950s ideal of a conformist, consumer-oriented suburban culture?
      options:
        - "The expansion of television networks"
        - "The rise of the evangelist Billy Graham"
        - "The addition of the words under God to the Pledge of Allegiance"
        - "Writers of the Beat Generation and social critics who argued that corporate and suburban life stifled individuality"
      option_explanations:
        - |
          Television spread a shared mainstream culture and advertising, reinforcing consumer values.
        - |
          Graham's revivals were part of the mainstream culture of faith and anti-communism.
        - |
          The 1954 change to the Pledge reflected the mainstream religious revival and Cold War piety, not a challenge to it.
        - |
          Correct. Beat writers rejected materialism and convention, and books on the "organisation man" and the "lonely crowd" warned that conformity was eroding individualism. Their critique fed the 1960s counterculture.
      answer: 3
      explanation: |
        Comparison within a period. 1950s culture was not monolithic; note dissenting voices alongside the dominant ideal.

    - slug: apush-u08-w28-q13
      type: multiple_choice
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which of the following best explains why the Korean War ended in 1953 without a clear victory for either side?
      options:
        - "The Soviet Union sent its army to defend North Korea"
        - "After Chinese intervention produced a stalemate near the 38th parallel, both sides accepted an armistice rather than escalate, consistent with the idea of limited war"
        - "The United Nations expelled North Korea"
        - "The United States used nuclear weapons, forcing a ceasefire"
      option_explanations:
        - |
          The Soviet Union supplied weapons and some pilots covertly; China, not the Soviet army, fought on the ground.
        - |
          Correct. Two years of stalemate, disputes over prisoners of war and a new president committed to ending the war led to the July 1953 armistice, leaving Korea divided.
        - |
          North Korea was not a UN member; expulsion was neither possible nor relevant.
        - |
          Nuclear weapons were not used in Korea, though Eisenhower hinted he might use them to break the deadlock.
      answer: 1
      explanation: |
        Causation (review of 8.2). Limited war meant accepting an outcome short of victory to avoid a wider, possibly nuclear war.

    - slug: apush-u08-w28-q14
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which of the following was a way the Second Red Scare affected the labour movement?
      options:
        - "The AFL was banned for its alleged Communist ties"
        - "Unions were required by Taft-Hartley to have officers sign non-Communist affidavits, and the CIO expelled unions accused of Communist leadership"
        - "Congress made strikes illegal in all industries"
        - "Union membership collapsed to below 5% of the workforce by 1955"
      option_explanations:
        - |
          The AFL was strongly anti-Communist and was never banned; it merged with the CIO in 1955.
        - |
          Correct. Section 9(h) of Taft-Hartley required the affidavits for a union to use the National Labor Relations Board, and in 1949–1950 the CIO expelled about eleven left-led unions.
        - |
          Strikes remained legal; Taft-Hartley allowed cooling-off periods in national emergencies, not a general ban.
        - |
          Union membership peaked at about a third of nonfarm workers in the mid-1950s.
      answer: 1
      explanation: |
        Making connections between 8.3 and 8.4. Anti-communism helped push labour toward the moderate bargain of the 1950s.

    - slug: apush-u08-w28-q15
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Great Migration of African Americans from the rural South to Northern and Western cities, which began during World War I and accelerated during World War II, most directly contributed to the postwar civil rights movement by
      options:
        - "leading most Black Americans to join the Republican Party after 1945"
        - "ending segregation in the South by reducing its Black population to a small minority"
        - "creating concentrated Black urban communities whose votes in Northern states gave civil rights political weight in national elections"
        - "causing Congress to pass a federal anti-lynching law in 1922"
      option_explanations:
        - |
          Black voters shifted toward the Democrats in the 1930s under the New Deal and stayed there.
        - |
          Millions remained in the South, where segregation continued until the 1960s.
        - |
          Correct. Black voters in cities such as Chicago, Detroit and New York were a swing bloc in close states; Truman's 1948 civil rights moves and the Democrats' platform were partly aimed at them.
        - |
          The Dyer anti-lynching bill passed the House in 1922 but was blocked by a Senate filibuster.
      answer: 2
      explanation: |
        Causation across periods (7.6 to 8.6). Migration changed where Black Americans could vote, and so changed national politics.

    - slug: apush-u08-w28-q16
      type: multi_select
      topic_code: "8.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that contributed to population and economic growth in the Sun Belt after 1945.
      options:
        - "Federal defense spending on bases, aerospace plants and research"
        - "The spread of residential and workplace air conditioning"
        - "Strong union protections that made Southern labour more expensive"
        - "Interstate highways and cheap land"
        - "The end of all federal farm subsidies"
      option_explanations:
        - |
          Correct. Cold War contracts flowed to California, Texas, Florida and Georgia, creating whole defense-industry economies.
        - |
          Correct. Air conditioning made hot climates comfortable for year-round work and retirement.
        - |
          The opposite: right-to-work laws allowed under Taft-Hartley kept unions weak and labour cheaper in the South, attracting employers.
        - |
          Correct. Highways and inexpensive land supported sprawling suburbs and new industry.
        - |
          Farm subsidies continued throughout the period and are not a Sun Belt growth factor.
      answer: [0, 1, 3]
      explanation: |
        Causation with multiple causes. The Sun Belt's rise shifted population, congressional seats and later political power southward and westward.

    - slug: apush-u08-w28-q17
      type: multi_select
      topic_code: "8.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were strategies or achievements of the civil rights movement BEFORE 1960.
      options:
        - "A community-wide bus boycott in Montgomery, Alabama"
        - "Lawsuits by the NAACP Legal Defense Fund against segregated schools"
        - "The March on Washington for Jobs and Freedom"
        - "Mexican American lawsuits against school segregation and jury exclusion"
        - "The Freedom Rides on interstate buses"
      option_explanations:
        - |
          Correct. The 1955–1956 boycott sustained mass, nonviolent economic pressure for over a year.
        - |
          Correct. The NAACP's litigation strategy, culminating in Brown (1954), was the movement's main tool in the 1940s and early 1950s.
        - |
          The March on Washington was in August 1963.
        - |
          Correct. Mendez v. Westminster (1947) and Hernandez v. Texas (1954) show that civil rights struggles before 1960 were not only Black and white.
        - |
          The Freedom Rides tested bus-terminal integration in 1961, after this period.
      answer: [0, 1, 3]
      explanation: |
        Periodisation. The early movement relied on the courts and on local community organising; mass confrontational direct action spread after 1960 (week 30).

    - slug: apush-u08-w28-q18
      type: true_false
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Although popular culture in the 1950s celebrated the full-time housewife, the proportion of married women working for wages rose during the decade.
      answer: true
      explanation: |
        True. Women's participation in paid work grew throughout the 1950s, especially among married women in clerical, sales and service jobs, often to pay for the consumer goods of suburban life. The gap between the domestic ideal and reality is a key context for 1960s feminism (8.11).

    - slug: apush-u08-w28-q19
      type: true_false
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Soviet Union accepted Marshall Plan aid for itself but refused to let its Eastern European satellites take part.
      answer: false
      explanation: |
        False. The Soviet Union refused the aid for itself and also made its satellites refuse, and then created its own economic bloc (Comecon, 1949). The refusal sharpened the economic division of Europe.

    - slug: apush-u08-w28-q20
      type: fill_blank
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The Montgomery Bus Boycott began in December 1955 after ____, a seamstress and secretary of the local NAACP branch, was arrested for refusing to give up her seat to a white passenger.
      answer: ["Rosa Parks", "Parks", "Rosa Louise Parks", "Rosa McCauley Parks"]
      explanation: |
        Rosa Parks. She was an experienced activist, not simply a tired seamstress; the boycott was organised overnight by Jo Ann Robinson's Women's Political Council and local ministers, who chose Martin Luther King Jr. to lead it.

    - slug: apush-u08-w28-q21
      type: fill_blank
      topic_code: "7.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Taft-Hartley Act of 1947 amended the National Labor Relations Act of 1935, usually called the ____ Act, which had guaranteed workers the right to organise and bargain collectively.
      answer: ["Wagner", "Wagner Act", "the Wagner Act"]
      explanation: |
        The Wagner Act, a New Deal law (7.10). Taft-Hartley kept its basic guarantee of collective bargaining while restricting union tactics: continuity and change.

    - slug: apush-u08-w28-q22
      type: short_answer
      topic_code: "8.5"
      source: "general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course): The 1950s are remembered as an age of conformity, but that memory is drawn from white, middle-class suburbs and from television. Beneath the surface the decade was restless: teenagers built a culture of their own around rock and roll, married women went to work in growing numbers, writers attacked the emptiness of affluence, and Black Southerners organised the challenges that would explode in the 1960s.
      prompt: |
        Using the interpretation above, answer (a), (b) and (c).

        (a) Briefly describe the author's argument about American culture in the 1950s.
        (b) Briefly explain how ONE specific historical development from 1945 to 1960 not mentioned in the passage supports the author's argument.
        (c) Briefly explain how ONE specific historical development from 1945 to 1960 could be used to challenge the author's argument.
      answer: |
        (a) The author argues that the image of 1950s conformity is incomplete because it reflects only the white middle class; in fact the decade contained significant dissent and change that prepared the way for the 1960s.

        (b) The Beat Generation supports the argument: writers such as Allen Ginsberg and Jack Kerouac openly rejected materialism and sexual convention in the mid-1950s, and their ideas later influenced the counterculture.

        (c) The religious revival challenges it: church membership grew, Congress added "under God" to the Pledge in 1954, and millions attended Billy Graham's crusades, which suggests most Americans embraced shared values rather than restlessness.
      explanation: |
        Three points, one per part.

        (a) 1 pt: the argument, not the topic. Accept: the decade was less conformist than remembered; dissent and change lay beneath the surface; the memory reflects one group.

        (b) 1 pt for a specific development NOT in the passage, explained as support: the Beats; critics of corporate conformity; the Montgomery Bus Boycott (it is in the passage only as "Black Southerners organised," so a specific event with explanation counts); Mendez or Hernandez; the Kinsey reports; Elvis and the moral panic over rock and roll (counts if tied to a specific episode); Brown v. Board.

        (c) 1 pt for a development that shows consensus or conformity, explained: suburban growth and Levittown; television's shared culture; the religious revival and the Pledge; the Red Scare's chilling of dissent; the baby boom and early marriage; Eisenhower's broad popularity.

        Zero: restating the passage; examples after 1960 without explanation; examples with no link to the argument.

    - slug: apush-u08-w28-q23
      type: short_answer
      topic_code: "8.2"
      source: "general knowledge"
      points: 3
      stimulus: |
        Source (described): A short educational film made for schools in the early 1950s with support from the Federal Civil Defense Administration shows an animated turtle that pulls into its shell when danger appears, then shows children in a classroom diving under their desks and covering their heads when they see a bright flash.
      prompt: |
        Review. Using the source described above, answer (a), (b) and (c).

        (a) Briefly describe the historical situation in which the film was made.
        (b) Briefly explain ONE purpose of the film.
        (c) Briefly explain ONE other way the Cold War affected American education or daily life in the 1950s.
      answer: |
        (a) The film was made after the Soviet Union tested an atomic bomb in 1949, ending the American monopoly, and during the Korean War and the race to build hydrogen bombs, when Americans feared a nuclear attack on their cities.

        (b) Its purpose was to reassure children and parents that simple actions could help them survive an attack, keeping public morale steady and building support for civil defense rather than panic.

        (c) After Sputnik in 1957, Congress passed the National Defense Education Act, which funded science, mathematics and foreign-language teaching and student loans, because leaders believed the country was falling behind the Soviets.
      explanation: |
        Three points, one per part.

        (a) 1 pt: the Soviet atomic test (1949), the end of the monopoly, the arms race and H-bomb, Korea, or fear of nuclear attack, described specifically. "The Cold War" alone is too vague.

        (b) 1 pt: to prepare or reassure the public; to create a sense that nuclear war was survivable; to win support for civil defense; to teach a drill. Must be a purpose, not a description.

        (c) 1 pt: the National Defense Education Act (1958); the space race and NASA; fallout shelters; loyalty oaths for teachers; the interstate highways justified for defense; Cold War themes in films and television; religious language in civic life. Must be explained.

        Zero: answers that place the film in World War II or that only describe the turtle.

    - slug: apush-u08-w28-q24
      type: long_answer
      topic_code: "8.4"
      source: "general knowledge"
      points: 6
      prompt: |
        Long essay. The years from 1945 to 1960 brought the greatest sustained economic expansion in American history. Historians have examined who gained from it, through rising wages, home ownership, education and consumer goods, and who was left out, by race, region, gender and class.

        Evaluate the extent to which the economic prosperity of 1945 to 1960 was shared by all Americans.
      answer: |
        Thesis: Postwar prosperity raised living standards for a broad majority, creating a mass middle class, but federal policies and private discrimination channelled its greatest benefits to white, male-headed suburban families, leaving many African Americans, Mexican Americans, rural Southerners and the urban poor largely outside it.

        Context: After the Depression and wartime rationing, pent-up demand, Cold War spending and the absence of foreign competition fuelled growth.

        Body 1 (widely shared): GI Bill education and housing; union contracts like the 1950 UAW–GM agreement brought pensions and health insurance; home ownership rose from about 44% to about 62% of households; television, cars and appliances spread.

        Body 2 (exclusions): FHA redlining and Levittown's whites-only sales; Black veterans denied GI Bill benefits in the South; braceros' poor conditions and the 1954 deportation campaign; Appalachia and inner cities; urban renewal and highways cut through Black neighbourhoods.

        Body 3 (gender): women's wages lower and many pushed out of industrial jobs after the war, though women's employment rose.

        Complexity: the gap was not static; exclusion fuelled the civil rights movement, and Michael Harrington's later exposé of persistent poverty helped prompt the War on Poverty.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (1 pt): a defensible claim about extent with a line of reasoning, e.g. "widely but unequally shared, because federal policy favoured white suburbs." "It was shared by some and not others" without reasoning does not earn it.

        Contextualization (1 pt): the Depression and wartime sacrifice; wartime savings; America's unique postwar position; Cold War defense spending; the New Deal state. Must be explained, not mentioned.

        Evidence (2 pts): 1 pt for two specific examples; 2 for using them to support the argument. Acceptable: GI Bill; FHA/VA loans; Levittown; Federal-Aid Highway Act (1956); the 1950 UAW–GM contract; AFL-CIO merger; Sun Belt growth; baby boom; television and consumer credit; redlining; the Bracero Program; the 1954 deportation campaign; Taft-Hartley; Appalachian and rural poverty; women's labour force participation; Puerto Rican migration to New York; termination and relocation of American Indians.

        Analysis and reasoning (2 pts): 1 pt for using a reasoning process (comparison of groups, causation from policy to outcome, or continuity and change across the period); 1 pt for complex understanding, such as explaining how one policy both expanded and restricted opportunity, considering several groups, or connecting the inequality to later movements.

        Common errors: describing 1950s culture without addressing who shared prosperity; claiming that no Black families gained (a Black middle class grew in Northern cities); using evidence from the 1960s Great Society as if it were 1950s.
