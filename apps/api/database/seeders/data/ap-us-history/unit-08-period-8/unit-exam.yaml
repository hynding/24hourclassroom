  - slug: apush-u08-exam-q42
    type: short_answer
    topic_code: "8.8"
    source: "Primary source: Richard Nixon, Address to the Nation on the War in Vietnam (November 3, 1969), American Presidency Project"
    points: 3
    stimulus: |
      "In the previous administration, we Americanized the war in Vietnam. In this administration, we are Vietnamizing the search for peace."

      — President Richard Nixon, televised address to the nation, November 3, 1969
    prompt: |
      Using the excerpt above, answer (a), (b) and (c).

      (a) Briefly describe the policy Nixon refers to as Vietnamizing.
      (b) Briefly explain ONE way the policy in the excerpt differed from the policy of the previous administration.
      (c) Briefly explain ONE way the Vietnam War affected American politics or society between 1969 and 1975.
    answer: |
      (a) Vietnamization meant gradually withdrawing American ground troops while training and equipping the South Vietnamese army to take over the fighting, backed by American air power.

      (b) Johnson had escalated the war by sending more than half a million American troops after the Gulf of Tonkin Resolution, while Nixon reduced U.S. troop levels to about 25,000 by late 1972.

      (c) The war undermined trust in government: the Pentagon Papers (1971) showed officials had misled the public, and Congress passed the War Powers Resolution in 1973 to limit presidential war-making.
    explanation: |
      Three points, one per part.

      (a) 1 pt: withdrawal of U.S. ground troops combined with building up South Vietnamese forces to fight on their own.

      (b) 1 pt: a specific contrast with Johnson: escalation versus withdrawal; Americanised ground war versus reliance on South Vietnamese forces and air power; Johnson's troop levels versus Nixon's reductions. Accept that Nixon also widened the war in Cambodia and Laos if contrasted.

      (c) 1 pt, explained: Kent State and Jackson State; the Pentagon Papers; the War Powers Resolution; the end of the draft (1973); the Twenty-sixth Amendment; declining trust in government; the silent majority and conservative realignment.

      Zero: describing Johnson's escalation as Vietnamization; effects outside 1969–1975 without explanation.

  - slug: apush-u08-exam-q43
    type: short_answer
    topic_code: "8.11"
    source: "general knowledge"
    points: 3
    stimulus: |
      Interpretation (written for this course): The movements of the late 1960s and 1970s were less a break with the civil rights movement than its continuation. Women, Mexican Americans, American Indians and gay Americans borrowed its language of equal rights, its tactics of nonviolent protest and its strategy of turning to federal courts and laws. What was new was the variety of goals, from cultural pride to economic power, which made a single coalition impossible.
    prompt: |
      Using the interpretation above, answer (a), (b) and (c).

      (a) Briefly describe the author's argument.
      (b) Briefly explain how ONE specific historical development from 1963 to 1980 supports the author's argument.
      (c) Briefly explain how ONE specific historical development from 1963 to 1980 challenges the author's argument.
    answer: |
      (a) The author argues that later rights movements continued the African American civil rights movement's methods and language, though their diverse goals kept them from forming one coalition.

      (b) The United Farm Workers supports this: Chávez and Huerta used nonviolent marches, fasting and a consumer boycott modelled on the civil rights movement to win contracts for Mexican American and Filipino American farm workers in 1970.

      (c) The occupation of Wounded Knee in 1973 challenges it: AIM's armed occupation and its demand for treaty rights and tribal sovereignty were not based on nonviolence or on integration into American society, but on a distinct national identity.
    explanation: |
      Three points, one per part.

      (a) 1 pt: continuity of methods and language with the civil rights movement, plus diversity of goals.

      (b) 1 pt for a specific development, explained as support: NOW's use of Title VII; Title IX; the UFW boycott; Chicano student walkouts; Hernandez and Mendez as legal precedents (if tied to the period's activism); the Bilingual Education Act; gay rights ordinances modelled on civil rights laws.

      (c) 1 pt for a specific development, explained as a challenge: AIM's armed occupation at Wounded Knee and focus on sovereignty; Black Power's rejection of integration; radical feminists' focus on personal and cultural change; the ERA campaign's constitutional route; the Stonewall uprising as a spontaneous riot rather than planned nonviolence.

      Zero: restating the passage; examples outside 1963–1980; no explanation.

  - slug: apush-u08-exam-q44
    type: long_answer
    topic_code: "8.10"
    source: "Primary sources: Executive Order 9981 (1948) and Civil Rights Act of 1964, National Archives; Brown v. Board of Education (1954), Justia; Southern Manifesto, Congressional Record (1956), via Teaching American History; Eisenhower, Little Rock address (1957), Kennedy, civil rights address (1963), Johnson, The American Promise (1965), American Presidency Project; Kerner Commission report (1968), via Teaching American History"
    points: 7
    stimulus: |
      Document 1. Executive Order 9981, President Harry S. Truman, July 26, 1948:
      "It is hereby declared to be the policy of the President that there shall be equality of treatment and opportunity for all persons in the armed services without regard to race, color, religion or national origin. This policy shall be put into effect as rapidly as possible, having due regard to the time required to effectuate any necessary changes without impairing efficiency or morale."

      Document 2. Chief Justice Earl Warren, opinion of a unanimous Supreme Court, Brown v. Board of Education, 1954:
      "We conclude that, in the field of public education, the doctrine of "separate but equal" has no place. Separate educational facilities are inherently unequal."

      Document 3. Declaration of Constitutional Principles (the Southern Manifesto), signed by 101 Southern members of Congress, Congressional Record, March 12, 1956:
      "We regard the decisions of the Supreme Court in the school cases as a clear abuse of judicial power. ... We pledge ourselves to use all lawful means to bring about a reversal of this decision which is contrary to the Constitution and to prevent the use of force in its implementation."

      Document 4. President Dwight D. Eisenhower, national address on Little Rock, September 24, 1957:
      "Our personal opinions about the decision have no bearing on the matter of enforcement; the responsibility and authority of the Supreme Court to interpret the Constitution are very clear. ... Mob rule cannot be allowed to override the decisions of our courts."
    prompt: |
      Document-based question. Use Documents 1–4 above and Documents 5–7 below.

      Document 5. President John F. Kennedy, national radio and television address, June 11, 1963, the day Alabama's governor tried to block the integration of the state university:
      "We are confronted primarily with a moral issue. It is as old as the scriptures and is as clear as the American Constitution. The heart of the question is whether all Americans are to be afforded equal rights and equal opportunities, whether we are going to treat our fellow Americans as we want to be treated."

      Document 6. President Lyndon B. Johnson, address to a joint session of Congress, March 15, 1965, eight days after state troopers attacked voting-rights marchers in Selma, Alabama:
      "Every American citizen must have an equal right to vote. ... Their cause must be our cause too. Because it is not just Negroes, but really it is all of us, who must overcome the crippling legacy of bigotry and injustice."

      Document 7. Report of the National Advisory Commission on Civil Disorders (the Kerner Commission), appointed by President Johnson after the urban riots of 1967, published 1968:
      "This is our basic conclusion: Our nation is moving toward two societies, one black, one white—separate and unequal. ... Segregation and poverty have created in the racial ghetto a destructive environment totally unknown to most white Americans."

      Evaluate the extent to which the federal government advanced the civil rights of African Americans from 1945 to 1968.

      In your response you should: respond to the prompt with a historically defensible thesis or claim that establishes a line of reasoning; describe a broader historical context relevant to the prompt; support an argument using at least four documents; use at least one additional piece of specific historical evidence beyond the documents; explain how or why the point of view, purpose, historical situation and/or audience of at least two documents is relevant to an argument; and demonstrate a complex understanding of the issue.
    answer: |
      Thesis: Between 1945 and 1968 the federal government advanced African American civil rights substantially, dismantling legal segregation and disenfranchisement, but it usually acted only after grassroots protest and televised violence forced it to, and it did little to address the economic and residential inequality that the Kerner Commission described.

      Context: World War II's fight against fascism, the Double V campaign, the Great Migration's creation of Northern Black voting blocs and Cold War competition for world opinion made Jim Crow an embarrassment and a political liability.

      Paragraph 1 (1945–1957, executive and judicial action under pressure): Doc 1, Truman desegregated the military, though "as rapidly as possible" allowed delay; his purpose included winning Northern Black votes in 1948. Doc 2, Brown overturned Plessy. Doc 3 shows Southern members of Congress organising resistance; their purpose was to give massive resistance constitutional respectability. Doc 4, Eisenhower sent troops but stressed law, not justice, speaking to a national audience including white Southerners.

      Paragraph 2 (1960–1965, legislation after protest): Doc 5, Kennedy acted after Birmingham's televised violence; Doc 6, Johnson responded to Selma; outside evidence: the Civil Rights Act of 1964 and Voting Rights Act of 1965, after which Black registration in Mississippi rose to about 60%.

      Paragraph 3 (limits): Doc 7 shows that legal equality did not end segregation and poverty in Northern cities; FHA redlining had helped create those ghettos.

      Complexity: the federal government both advanced and obstructed civil rights (housing policy, FBI surveillance of King), and its greatest actions were responses to the movement.
    explanation: |
      Scored on the seven-point DBQ rubric.

      Thesis/claim (1 pt): a historically defensible claim that evaluates extent and establishes a line of reasoning, e.g. "significantly in law, but reactively and incompletely in practice." Must be in the introduction or conclusion; a restatement of the prompt earns nothing.

      Contextualization (1 pt): a broader context, explained: World War II and the Double V campaign; Executive Order 8802; the Great Migration and Black voting power in the North; the Cold War and decolonisation (America's image abroad); the long NAACP legal campaign; Jim Crow and disenfranchisement since the 1890s.

      Evidence from the documents (2 pts): 1 pt for accurately describing the content of at least three documents; 2 pts for using at least four documents to support an argument (not just quoting them). Doc 1: executive action, but gradual. Doc 2: judicial overturning of Plessy. Doc 3: congressional resistance, showing federal division. Doc 4: enforcement framed as law and order. Doc 5: moral framing after Birmingham. Doc 6: presidential leadership on voting after Selma. Doc 7: limits of legal change; urban inequality.

      Evidence beyond the documents (1 pt): one specific piece of evidence not in the documents, used in the argument: Civil Rights Act of 1964; Voting Rights Act of 1965; Civil Rights Act of 1957; Brown II (1955) and its lack of a deadline; Montgomery and Browder v. Gayle; Freedom Rides and federal marshals; Birmingham; the March on Washington; Freedom Summer and the MFDP; Twenty-fourth Amendment; Fair Housing Act (1968); FHA redlining; FBI surveillance of King; Thurgood Marshall's appointment (1967); Dixiecrats (1948); Emmett Till.

      Sourcing (1 pt): for at least two documents, explain how point of view, purpose, historical situation or audience is relevant to the argument. Examples: Doc 1's timing before the 1948 election; Doc 3's authors facing segregationist voters; Doc 4's audience of white Southerners explains its emphasis on law rather than justice; Doc 5 delivered the day of the University of Alabama standoff after Birmingham; Doc 6 eight days after Selma, by a Southern president persuading Congress; Doc 7 a federal commission whose findings Johnson largely ignored.

      Complex understanding (1 pt): demonstrated through the argument, e.g. explaining both the advances and their limits; showing that federal action followed grassroots pressure; distinguishing the branches (courts led, Congress lagged, presidents varied); showing that federal policy also created inequality (housing); or using all seven documents to support a nuanced argument.

      Common errors: summarising documents in order without an argument; quoting King or Malcolm X directly (describe them); treating the Kerner report as a law; ignoring the Southern Manifesto as evidence of federal division.
