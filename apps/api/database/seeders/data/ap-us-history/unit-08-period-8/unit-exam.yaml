unit: 8
description: |
  44 questions · about 80 minutes · every topic of Period 8 (8.1 to 8.15) with about a fifth of the items reviewing
  earlier periods. Six source-based multiple-choice sets, standalone multiple choice, select-all, true/false and
  fill-in-the-blank items are graded at once; one short-answer question and one document-based question (7 points,
  seven documents) are graded by your teacher against the scoring notes.
questions:
  # ---- Set 1: Executive Order 9835 (8.3, review 7.8)
  - slug: apush-u08-exam-q01
    type: multiple_choice
    topic_code: "8.3"
    source: "Primary source: Executive Order 9835 (March 21, 1947), Harry S. Truman Library"
    points: 1
    stimulus: &exam9835 |
      "There shall be a loyalty investigation of every person entering the civilian employment of any department or agency of the executive branch of the Federal Government. ...

      The standard for the refusal of employment or the removal from employment in an executive department or agency on grounds relating to loyalty shall be that, on all the evidence, reasonable grounds exists for belief that the person involved is disloyal to the Government of the United States."

      Among the activities and associations the order allowed loyalty boards to consider: "Membership in, affiliation with or sympathetic association with any foreign or domestic organization, association, movement, group or combination of persons, designated by the Attorney General as totalitarian, fascist, communist, or subversive"

      — Executive Order 9835, signed by President Harry S. Truman, March 21, 1947
    prompt: |
      Which of the following most directly contributed to the issuing of this order?
    options:
      - "Growing tension with the Soviet Union and Republican charges that the Truman administration was soft on communism"
      - "Senator Joseph McCarthy's Wheeling speech"
      - "The execution of Julius and Ethel Rosenberg"
      - "The Army–McCarthy hearings"
    option_explanations:
      - |
        Correct. Issued nine days after the Truman Doctrine speech, after Republicans won Congress in 1946 partly by attacking the administration's record on communism, the order sought to answer that charge.
      - |
        McCarthy's speech came in February 1950, three years later; the loyalty program prepared the ground for him rather than responding to him.
      - |
        The Rosenbergs were arrested in 1950 and executed in 1953, after the order.
      - |
        Those hearings took place in 1954, seven years later.
    answer: 0
    explanation: |
      Historical situation (sourcing). The order's date places it at the start of the Cold War, before McCarthy.

  - slug: apush-u08-exam-q02
    type: multiple_choice
    topic_code: "8.3"
    source: "Primary source: Executive Order 9835 (March 21, 1947), Harry S. Truman Library"
    points: 1
    stimulus: *exam9835
    prompt: |
      Critics of the program argued that the standard described in the excerpt threatened civil liberties chiefly because it
    options:
      - "gave accused employees the right to confront all witnesses against them"
      - "applied only to employees of state governments"
      - "allowed dismissal on the basis of association and belief rather than proof of disloyal acts, using a list of organisations drawn up by the Attorney General"
      - "required a criminal conviction before an employee could be dismissed"
    option_explanations:
      - |
        The lack of a right to confront accusers was one of the main complaints against the program.
      - |
        The order covered the federal executive branch; states later adopted their own programs.
      - |
        Correct. "Sympathetic association" with a listed group could count against a worker, and accused employees often could not learn who had informed on them.
      - |
        The standard is "reasonable grounds" for belief in disloyalty, far below the proof needed for a criminal conviction.
    answer: 2
    explanation: |
      Argumentation. Use the wording of a source ("reasonable grounds," "sympathetic association") as evidence for a claim about its effects.

  - slug: apush-u08-exam-q03
    type: multiple_choice
    topic_code: "7.8"
    source: "Primary source: Executive Order 9835 (March 21, 1947), Harry S. Truman Library"
    points: 1
    stimulus: *exam9835
    prompt: |
      Review. The order is most similar to which earlier development?
    options:
      - "The Pendleton Civil Service Act of 1883"
      - "The Wagner Act of 1935"
      - "The Palmer Raids and deportations of suspected radicals in 1919–1920"
      - "The Sedition Act of 1798's protection of free speech"
    option_explanations:
      - |
        The Pendleton Act created merit-based hiring to curb patronage; it did not test political loyalty.
      - |
        The Wagner Act protected union organising; it had nothing to do with loyalty.
      - |
        Correct. Both followed a world war and targeted people for suspected radical beliefs and associations rather than proven acts, curbing civil liberties in the name of national security.
      - |
        The Sedition Act of 1798 restricted, rather than protected, criticism of the government, so the option misdescribes it.
    answer: 2
    explanation: |
      Comparison across periods (7.8 and 8.3). A similarity plus a difference: the second scare targeted government employees and lasted longer.

  # ---- Set 2: Kennedy's inaugural address (8.7, 8.8)
  - slug: apush-u08-exam-q04
    type: multiple_choice
    topic_code: "8.7"
    source: "Primary source: John F. Kennedy, Inaugural Address (January 20, 1961), American Presidency Project"
    points: 1
    stimulus: &examjfk |
      "Let every nation know, whether it wishes us well or ill, that we shall pay any price, bear any burden, meet any hardship, support any friend, oppose any foe to assure the survival and the success of liberty. ...

      And so, my fellow Americans: ask not what your country can do for you—ask what you can do for your country."

      — President John F. Kennedy, inaugural address, January 20, 1961
    prompt: |
      The first paragraph of the excerpt best reflects which approach to foreign policy?
    options:
      - "Détente and arms control with the Soviet Union"
      - "Reliance on the United Nations to settle all disputes"
      - "A return to isolationism after the Korean War"
      - "A global commitment to containment, backed by a willingness to use a wide range of tools anywhere in the world"
    option_explanations:
      - |
        Détente came under Nixon; Kennedy's early policy was more confrontational, though he signed the Test Ban Treaty in 1963.
      - |
        The speech pledges American action; the UN is not its focus.
      - |
        The speech promises more involvement, not less.
      - |
        Correct. "Any price, any burden" is the language of open-ended commitment, which Kennedy backed with flexible response, counterinsurgency forces and the Peace Corps.
    answer: 3
    explanation: |
      Contextualization. Kennedy took office after Sputnik and the U-2 incident, promising a more vigorous Cold War policy.

  - slug: apush-u08-exam-q05
    type: multiple_choice
    topic_code: "8.7"
    source: "Primary source: John F. Kennedy, Inaugural Address (January 20, 1961), American Presidency Project"
    points: 1
    stimulus: *examjfk
    prompt: |
      Which of the following initiatives of the Kennedy administration most directly reflects the second paragraph of the excerpt?
    options:
      - "The naval quarantine of Cuba"
      - "The Peace Corps, which sent American volunteers to work in developing countries"
      - "The Limited Test Ban Treaty"
      - "The Bay of Pigs invasion"
    option_explanations:
      - |
        The quarantine was a military response to Soviet missiles.
      - |
        Correct. The Peace Corps (1961) asked young Americans to serve abroad, turning the call to service into a program that also served Cold War goals.
      - |
        The treaty was a diplomatic agreement on nuclear testing.
      - |
        The Bay of Pigs was a covert CIA operation using Cuban exiles, not a call to citizen service.
    answer: 1
    explanation: |
      Claims and evidence. Match a specific statement in a source to a specific policy.

  - slug: apush-u08-exam-q06
    type: multiple_choice
    topic_code: "8.8"
    source: "Primary source: John F. Kennedy, Inaugural Address (January 20, 1961), American Presidency Project"
    points: 1
    stimulus: *examjfk
    prompt: |
      Critics of the Vietnam War later argued that commitments like the one expressed in the first paragraph
    options:
      - "were abandoned immediately after Kennedy's death"
      - "were never put into practice by any president"
      - "required Congress to declare war before any military action"
      - "led the United States to support unpopular governments and fight wars whose costs outweighed any American interest"
    option_explanations:
      - |
        Johnson kept and expanded Kennedy's commitments, especially in Vietnam.
      - |
        Kennedy expanded advisers in Vietnam to about 16,000, and Johnson escalated further; the commitment was acted on.
      - |
        The speech says nothing about declarations of war, and none was sought for Vietnam.
      - |
        Correct. Critics such as Senator J. William Fulbright argued that open-ended pledges led the United States into Vietnam in support of governments with little popular backing.
    answer: 3
    explanation: |
      Continuity and change. The confidence of 1961 became the late-1960s debate over the limits of American power and the War Powers Resolution of 1973.

  # ---- Set 3: Eisenhower's domino press conference (8.8, review 8.2)
  - slug: apush-u08-exam-q07
    type: multiple_choice
    topic_code: "8.8"
    source: "Primary source: Dwight D. Eisenhower, The President's News Conference (April 7, 1954), American Presidency Project"
    points: 1
    stimulus: &examdomino |
      "Finally, you have broader considerations that might follow what you would call the "falling domino" principle. You have a row of dominoes set up, you knock over the first one, and what will happen to the last one is the certainty that it will go over very quickly. So you could have a beginning of a disintegration that would have the most profound influences."

      — President Dwight D. Eisenhower, news conference, April 7, 1954, answering a question about the importance of Indochina
    prompt: |
      Eisenhower made this statement during
    options:
      - "the French struggle to hold Dien Bien Phu against the Viet Minh"
      - "the Tet Offensive"
      - "the fall of Saigon"
      - "the Cuban Missile Crisis"
    option_explanations:
      - |
        Correct. In April 1954 French forces were besieged at Dien Bien Phu; they surrendered in May, and the Geneva Accords followed in July.
      - |
        The Tet Offensive came in January 1968, fourteen years after this news conference.
      - |
        Saigon fell to North Vietnam in April 1975, two decades after this remark.
      - |
        The Cuban Missile Crisis came in 1962 and concerned Cuba, not Indochina.
    answer: 0
    explanation: |
      Historical situation. The date and the reference to Indochina place the remark at the end of the French war.

  - slug: apush-u08-exam-q08
    type: multiple_choice
    topic_code: "8.8"
    source: "Primary source: Dwight D. Eisenhower, The President's News Conference (April 7, 1954), American Presidency Project"
    points: 1
    stimulus: *examdomino
    prompt: |
      The reasoning in the excerpt was most directly used to justify
    options:
      - "the withdrawal of U.S. advisers from Southeast Asia"
      - "recognition of the People's Republic of China"
      - "U.S. support for the government of South Vietnam after 1954 and the later escalation of the war"
      - "the decision not to sign the Geneva Accords so that Vietnam could be reunited by elections"
    option_explanations:
      - |
        The domino theory argued for staying, not leaving.
      - |
        Recognition of Communist China came in 1979, and the domino theory treated China as part of the threat.
      - |
        Correct. Four presidents cited the danger that losing South Vietnam would topple its neighbours, from aid to Diem through Johnson's escalation.
      - |
        The United States declined to sign the accords and backed the cancellation of the 1956 elections because it expected Ho Chi Minh to win them, the opposite of seeking reunification.
    answer: 2
    explanation: |
      Causation. An idea can be a cause: the domino theory turned a regional conflict into a test of containment.

  - slug: apush-u08-exam-q09
    type: multiple_choice
    topic_code: "8.2"
    source: "Primary source: Dwight D. Eisenhower, The President's News Conference (April 7, 1954), American Presidency Project"
    points: 1
    stimulus: *examdomino
    prompt: |
      The view expressed in the excerpt is most consistent with which earlier statement of policy?
    options:
      - "The Good Neighbor Policy"
      - "Washington's Farewell Address warning against permanent alliances"
      - "The Neutrality Acts of the 1930s"
      - "NSC-68's description of the Soviet Union as seeking world domination, making Communist gains anywhere a threat"
    option_explanations:
      - |
        The Good Neighbor Policy concerned non-intervention in Latin America.
      - |
        Washington's warning counselled restraint, the opposite of a global commitment.
      - |
        The Neutrality Acts aimed to keep the United States out of foreign wars.
      - |
        Correct. NSC-68 (1950) treated the Cold War as global and indivisible; the domino theory applied that logic to Southeast Asia.
    answer: 3
    explanation: |
      Continuity (8.2). Containment's assumptions carried from Europe in 1947–1950 to Asia in the 1950s and 1960s.

  # ---- Set 4: Civil Rights Act of 1964 (8.10, 8.11, review 5.10)
  - slug: apush-u08-exam-q10
    type: multiple_choice
    topic_code: "8.10"
    source: "Primary source: Civil Rights Act of 1964, Titles II and VII, National Archives Milestone Documents"
    points: 1
    stimulus: &examcra |
      Title II: "All persons shall be entitled to the full and equal enjoyment of the goods, services, facilities, and privileges, advantages, and accommodations of any place of public accommodation, as defined in this section, without discrimination or segregation on the ground of race, color, religion, or national origin."

      Title VII, Section 703(a), makes it unlawful for an employer "to fail or refuse to hire or to discharge any individual, or otherwise to discriminate against any individual with respect to his compensation, terms, conditions, or privileges of employment, because of such individual's race, color, religion, sex, or national origin"

      — Civil Rights Act of 1964, signed by President Lyndon B. Johnson, July 2, 1964
    prompt: |
      Which of the following most directly led to the passage of this law?
    options:
      - "The Kerner Commission's report on urban riots"
      - "The Supreme Court's decision in Plessy v. Ferguson"
      - "The Selma march"
      - "Nonviolent protest campaigns such as Birmingham and the March on Washington, Kennedy's proposal of the bill, and Johnson's push for it after Kennedy's assassination"
    option_explanations:
      - |
        The Kerner report came in 1968, four years after the act.
      - |
        Plessy upheld segregation in 1896; the act attacked what Plessy had allowed.
      - |
        Selma (1965) led to the Voting Rights Act, after this law.
      - |
        Correct. Televised violence in Birmingham prompted Kennedy's June 1963 bill; the March on Washington built support; Johnson used Kennedy's memory and his legislative skill to break the Senate filibuster.
    answer: 3
    explanation: |
      Causation with multiple causes: grassroots protest, presidential leadership and a changing national mood.

  - slug: apush-u08-exam-q11
    type: multiple_choice
    topic_code: "8.11"
    source: "Primary source: Civil Rights Act of 1964, Titles II and VII, National Archives Milestone Documents"
    points: 1
    stimulus: *examcra
    prompt: |
      The inclusion of "sex" in Title VII but not in Title II most directly contributed to which later development?
    options:
      - "The ratification of the Nineteenth Amendment"
      - "The repeal of the Equal Pay Act"
      - "The founding of the National Organization for Women in 1966 to press the government to enforce the ban on sex discrimination in employment"
      - "The Supreme Court's decision in Brown v. Board of Education"
    option_explanations:
      - |
        The Nineteenth Amendment (1920) came more than forty years earlier.
      - |
        The Equal Pay Act (1963) was not repealed.
      - |
        Correct. Frustrated that the Equal Employment Opportunity Commission did not take sex discrimination seriously, Betty Friedan and others founded NOW to enforce Title VII.
      - |
        Brown (1954) preceded the act and concerned race in schools.
    answer: 2
    explanation: |
      Making connections (8.10 to 8.11). A law written mainly for racial equality became a tool for the women's movement.

  - slug: apush-u08-exam-q12
    type: multiple_choice
    topic_code: "5.10"
    source: "Primary source: Civil Rights Act of 1964, Titles II and VII, National Archives Milestone Documents"
    points: 1
    stimulus: *examcra
    prompt: |
      Review. Title II revived a goal that Congress had pursued in which earlier law, later struck down by the Supreme Court?
    options:
      - "The Civil Rights Act of 1875, which banned discrimination in public accommodations"
      - "The Homestead Act of 1862"
      - "The Chinese Exclusion Act"
      - "The Morrill Land-Grant Act"
    option_explanations:
      - |
        Correct. The 1875 act guaranteed equal access to inns, theatres and public conveyances; in the Civil Rights Cases (1883) the Court ruled that the Fourteenth Amendment did not reach private businesses. In 1964 Congress relied on the commerce clause instead.
      - |
        The Homestead Act offered public land to settlers; it did not concern discrimination.
      - |
        The Chinese Exclusion Act (1882) restricted immigration, the opposite of an anti-discrimination law.
      - |
        The Morrill Act funded colleges with land grants.
    answer: 0
    explanation: |
      Continuity and change across periods (5.10 and 8.10). The Second Reconstruction finished business the first had left undone.

  # ---- Set 5: Nixon on the environment (8.13, 8.14)
  - slug: apush-u08-exam-q13
    type: multiple_choice
    topic_code: "8.13"
    source: "Primary source: Richard Nixon, Annual Message to the Congress on the State of the Union (January 22, 1970), American Presidency Project"
    points: 1
    stimulus: &examnixonenv |
      "The great question of the seventies is, shall we surrender to our surroundings, or shall we make our peace with nature and begin to make reparations for the damage we have done to our air, to our land, and to our water? ...

      Clean air, clean water, open spaces—these should once again be the birthright of every American."

      — President Richard Nixon, State of the Union address, January 22, 1970
    prompt: |
      Which of the following most directly contributed to the concerns Nixon expressed?
    options:
      - "The Dust Bowl of the 1930s"
      - "Highly publicised events such as the 1969 Santa Barbara oil spill and the fire on the Cuyahoga River, together with growing public awareness after Silent Spring"
      - "The 1979 accident at Three Mile Island"
      - "The Arab oil embargo of 1973"
    option_explanations:
      - |
        The Dust Bowl was forty years earlier and shaped New Deal conservation, not the 1970 agenda.
      - |
        Correct. Pollution had become visible and televised, and a popular movement was building toward the first Earth Day in April 1970.
      - |
        Three Mile Island happened nine years after this speech.
      - |
        The embargo came in 1973, after the speech, and turned attention to energy supply.
    answer: 1
    explanation: |
      Historical situation. Date the source and look for causes before it, not after.

  - slug: apush-u08-exam-q14
    type: multiple_choice
    topic_code: "8.13"
    source: "Primary source: Richard Nixon, Annual Message to the Congress on the State of the Union (January 22, 1970), American Presidency Project"
    points: 1
    stimulus: *examnixonenv
    prompt: |
      Which of the following best describes federal environmental policy in the years immediately after this speech?
    options:
      - "The federal government banned the use of automobiles in major cities"
      - "Environmental regulation was left entirely to the states"
      - "Congress and the president, with bipartisan support, created the EPA and passed the Clean Air, Clean Water and Endangered Species Acts"
      - "Congress repealed most existing conservation laws"
    option_explanations:
      - |
        The Clean Air Act set emissions standards for cars; it did not ban them.
      - |
        The new laws set national standards enforced by a new federal agency.
      - |
        Correct. Between 1970 and 1973 a Republican president and a Democratic Congress built the modern framework of environmental law.
      - |
        The opposite happened: federal regulation expanded sharply.
    answer: 2
    explanation: |
      Continuity and change. Environmental protection joined the list of federal responsibilities expanded in Period 8.

  - slug: apush-u08-exam-q15
    type: multiple_choice
    topic_code: "8.14"
    source: "Primary source: Richard Nixon, Annual Message to the Congress on the State of the Union (January 22, 1970), American Presidency Project"
    points: 1
    stimulus: *examnixonenv
    prompt: |
      By the late 1970s, the goals in the speech came into growing tension with which other national concern?
    options:
      - "The energy crisis and stagflation, which led some to argue that environmental rules raised costs and limited energy production"
      - "The Red Scare"
      - "The baby boom"
      - "The Korean War"
    option_explanations:
      - |
        Correct. Oil shocks and high inflation made business and many voters see regulation as a burden, an argument the New Right and Ronald Reagan pressed in 1980.
      - |
        The Red Scare peaked in the early 1950s and had faded long before the late 1970s.
      - |
        The baby boom ended in 1964 and was not a national concern competing with regulation.
      - |
        The Korean War ended in 1953, a generation before the late 1970s.
    answer: 0
    explanation: |
      Making connections (8.13 and 8.14). The economic troubles of the 1970s changed the politics of regulation.

  # ---- Set 6: Poverty rates (8.9, 8.14)
  - slug: apush-u08-exam-q16
    type: multiple_choice
    topic_code: "8.9"
    source: "U.S. Census Bureau, Current Population Survey, historical poverty tables"
    points: 1
    stimulus: &exampoverty |
      Percentage of Americans below the official poverty line, selected years

      | Year | All persons | Persons aged 65 and over |
      |---|---|---|
      | 1959 | 22.4 | 35.2 |
      | 1964 | 19.0 | n/a |
      | 1969 | 12.1 | n/a |
      | 1973 | 11.1 | n/a |
      | 1979 | 11.7 | 15.2 |

      Source: U.S. Census Bureau, Current Population Survey, historical poverty tables (n/a: not shown here).
    prompt: |
      Which of the following best explains the change in the poverty rate between 1964 and 1973?
    options:
      - "The oil embargo of 1973"
      - "A sharp fall in the birth rate during the 1950s"
      - "The end of the Bracero Program"
      - "Continued economic growth combined with Great Society programs such as the War on Poverty, Medicare, Medicaid and expanded Social Security and food aid"
    option_explanations:
      - |
        The embargo began late in 1973 and raised prices, which hurt the poor.
      - |
        Birth rates rose in the 1950s (the baby boom), and births do not explain a fall in poverty a decade later.
      - |
        The Bracero Program's end affected farm labour in a few regions; it cannot explain a national decline.
      - |
        Correct. Strong growth in the 1960s raised wages, and federal programs expanded transfers to the poor and elderly; the rate fell by about eight points.
    answer: 3
    explanation: |
      Causation from data. Name the trend with numbers (19.0% to 11.1%), then explain it with specific causes.

  - slug: apush-u08-exam-q17
    type: multiple_choice
    topic_code: "8.9"
    source: "U.S. Census Bureau, Current Population Survey, historical poverty tables"
    points: 1
    stimulus: *exampoverty
    prompt: |
      The change in poverty among Americans aged 65 and over between 1959 and 1979 is most directly explained by
    options:
      - "The Taft-Hartley Act"
      - "The Immigration and Nationality Act of 1965"
      - "Medicare and repeated increases in Social Security benefits, which were indexed to inflation in the 1970s"
      - "The GI Bill"
    option_explanations:
      - |
        Taft-Hartley restricted unions; it did not provide income to the elderly.
      - |
        The 1965 immigration law changed who could enter the country, not the income of the elderly.
      - |
        Correct. Medicare (1965) covered health costs and Social Security benefits rose sharply and were indexed in 1972; elderly poverty fell from about 35% to about 15%.
      - |
        The GI Bill helped veterans with education and housing, mainly younger men.
    answer: 2
    explanation: |
      Evidence and argumentation. The table lets you argue that the Great Society's most lasting success was among the elderly.

  - slug: apush-u08-exam-q18
    type: multiple_choice
    topic_code: "8.14"
    source: "U.S. Census Bureau, Current Population Survey, historical poverty tables"
    points: 1
    stimulus: *exampoverty
    prompt: |
      The pattern in the "All persons" column after 1973 is best explained by
    options:
      - "a new war on poverty launched by President Ford"
      - "the abolition of Medicare in 1975"
      - "rapid wage growth for unskilled workers"
      - "slower growth, stagflation and the loss of industrial jobs in the 1970s"
    option_explanations:
      - |
        Ford focused on inflation ("Whip Inflation Now") and did not launch a new anti-poverty program.
      - |
        Medicare was never abolished; it has continued since its creation in 1965.
      - |
        Real wages for less-skilled workers stagnated in the 1970s.
      - |
        Correct. The steady postwar decline stopped: oil shocks, inflation and deindustrialisation in the Rust Belt held the rate around 11–12%.
    answer: 3
    explanation: |
      Continuity and change. The end of the postwar boom is visible in the data: a long decline gives way to a plateau.

  # ---- Standalone multiple choice
  - slug: apush-u08-exam-q19
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following best describes a major theme that runs through Period 8 (1945–1980)?
    options:
      - "Debates over the proper scope of federal power at home and the extent of American commitments abroad, set against prosperity that faltered in the 1970s"
      - "The absence of social movements until the 1970s"
      - "A return to isolationism after World War II"
      - "The steady decline of the federal government's role in the economy"
    option_explanations:
      - |
        Correct. Containment, the liberal consensus, the rights movements and the backlash of the 1970s all turn on these debates.
      - |
        The civil rights movement was active from the 1940s, and the 1960s were the decade of mass movements.
      - |
        The United States joined the UN and NATO and fought in Korea and Vietnam.
      - |
        Federal responsibility grew, from Cold War spending to the Great Society and environmental regulation.
    answer: 0
    explanation: |
      Contextualization (8.1). Period 8 questions usually test one of these tensions.

  - slug: apush-u08-exam-q20
    type: multiple_choice
    topic_code: "8.4"
    source: "general knowledge"
    points: 1
    prompt: |
      The Servicemen's Readjustment Act of 1944 (the GI Bill) most directly contributed to which postwar development?
    options:
      - "A fall in college enrolments"
      - "The growth of a college-educated, home-owning middle class"
      - "The decline of suburbs"
      - "The end of racial discrimination in housing"
    option_explanations:
      - |
        Enrolments surged as veterans entered college.
      - |
        Correct. Millions of veterans attended college or job training and bought homes with VA-guaranteed loans.
      - |
        VA-guaranteed loans helped fuel suburban growth rather than any decline.
      - |
        Local administration often denied benefits to Black veterans, and housing discrimination continued.
    answer: 1
    explanation: |
      Causation. Federal policy, not just market forces, built the postwar middle class.

  - slug: apush-u08-exam-q21
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Television's spread in the 1950s most directly contributed to
    options:
      - "the end of radio as a medium"
      - "a fall in the influence of national advertising"
      - "the decline of consumer spending"
      - "a more uniform national popular culture and new ways of advertising consumer goods and conducting politics"
    option_explanations:
      - |
        Radio adapted, notably with rock and roll for teenagers, rather than ending.
      - |
        National advertising grew with network television.
      - |
        Consumer spending rose, helped by television advertising.
      - |
        Correct. Shared programs, advertising, televised hearings and later the 1960 debates made TV central to culture and politics.
    answer: 3
    explanation: |
      Causation (8.5). Technology shapes culture: compare radio and film in the 1920s (7.7).

  - slug: apush-u08-exam-q22
    type: multiple_choice
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
