    - slug: apush-u08-w29-q23
      type: short_answer
      topic_code: "8.8"
      source: "general knowledge"
      points: 3
      stimulus: |
        Interpretation A (written for this course): The Vietnam War was a mistake rooted in Cold War assumptions. American leaders saw a nationalist, anti-colonial struggle as a move in a global Communist plan, backed an unpopular government in Saigon, and escalated a war they privately doubted they could win rather than accept a loss of credibility.

        Interpretation B (written for this course): The Vietnam War was a defensible attempt to keep South Vietnam independent. North Vietnam was a Communist state backed by the Soviet Union and China, and the American commitment bought time for other Southeast Asian nations to stabilise. The war was lost less on the battlefield than through limits on the military and declining support at home.
      prompt: |
        Using the two interpretations above, answer (a), (b) and (c).

        (a) Briefly describe ONE major difference between Interpretation A and Interpretation B.
        (b) Briefly explain how ONE specific historical event or development from 1954 to 1975 could be used to support Interpretation A.
        (c) Briefly explain how ONE specific historical event or development from 1954 to 1975 could be used to support Interpretation B.
      answer: |
        (a) A sees the war as a mistake caused by misreading Vietnamese nationalism as part of a global Communist plan, while B sees it as a reasonable effort to contain real Communist expansion that failed mainly because of restraints and domestic opposition.

        (b) The Pentagon Papers support A: the secret study revealed that officials across several administrations had doubts about the war's prospects that they concealed from the public while escalating.

        (c) The 1975 conquest of South Vietnam, followed by Communist victories in Laos and Cambodia, supports B's claim that the threat was real and regional; supporters also point to Tet, where Communist forces suffered a military defeat even as American opinion turned against the war.
      explanation: |
        Three points, one per part.

        (a) 1 pt for a real difference: cause (misjudged nationalism versus real Communist threat); judgement (mistake versus defensible); reason for failure (flawed premise versus restraints and home-front collapse).

        (b) 1 pt for specific evidence for A, explained: Ho Chi Minh's long nationalist struggle against France; the cancelled 1956 elections; Diem's unpopularity and the 1963 Buddhist crisis; the doubtful second Gulf of Tonkin attack; the Pentagon Papers; the Sino-Soviet split showing communism was not monolithic.

        (c) 1 pt for specific evidence for B, explained: Soviet and Chinese aid to North Vietnam; the Tet Offensive as a Communist military defeat; restrictions on bombing and ground operations; the fall of Laos and Cambodia in 1975; the Khmer Rouge atrocities; refugees fleeing after 1975.

        Zero: describing either interpretation without evidence; evidence outside 1954–1975 with no link; evidence that contradicts the interpretation claimed.

    - slug: apush-u08-w29-q24
      type: short_answer
      topic_code: "8.2"
      source: "general knowledge"
      points: 3
      stimulus: |
        Source (described): A political cartoon from the early 1950s shows Uncle Sam standing on a world map holding back a large red wave labelled with the hammer and sickle. Small figures labelled with the names of countries in Europe and Asia shelter behind him.
      prompt: |
        Review. Using the source described above, answer (a), (b) and (c).

        (a) Briefly describe the point of view expressed in the cartoon.
        (b) Briefly explain ONE specific policy from 1947 to 1953 that reflected the view expressed in the cartoon.
        (c) Briefly explain ONE way the policy reflected in the cartoon was later criticised or challenged between 1953 and 1975.
      answer: |
        (a) The cartoon presents the United States as the protector of free nations holding back a tide of Soviet communism that would otherwise flood Europe and Asia, the logic of containment.

        (b) The Truman Doctrine of 1947 reflected that view: Truman asked Congress for aid to Greece and Turkey and pledged support for free peoples resisting outside pressure, casting the United States as the barrier against Communist expansion.

        (c) The Vietnam War produced sharp criticism of containment: antiwar activists and some senators, such as J. William Fulbright, argued that treating every Communist movement as part of one Soviet wave led the United States into an unwinnable war against Vietnamese nationalism.
      explanation: |
        Three points, one per part.

        (a) 1 pt: containment; the United States as protector; communism as an expanding, unified threat. Description of the image without a point of view does not score.

        (b) 1 pt for a specific 1947–1953 policy, explained: Truman Doctrine; Marshall Plan; Berlin Airlift; NATO; NSC-68; the Korean War.

        (c) 1 pt for a specific criticism or challenge, explained: Eisenhower's farewell warning about the military-industrial complex; opposition to the Vietnam War and Fulbright's hearings; the Sino-Soviet split undermining the idea of a single Communist bloc; Nixon's détente and opening to China; the War Powers Resolution.

        Zero: a policy outside the stated dates; criticism that is not explained.

    - slug: apush-u08-w29-q25
      type: long_answer
      topic_code: "8.9"
      source: "general knowledge"
      points: 6
      prompt: |
        Long essay. In the mid-1960s Lyndon Johnson and a Democratic Congress passed more domestic legislation than any government since the New Deal, while the Supreme Court expanded individual rights. Historians have compared these years with the 1930s and have weighed what the Great Society achieved against the backlash it provoked and the costs of the Vietnam War.

        Evaluate the extent to which the Great Society changed the role of the federal government in American life from 1963 to 1975.
      answer: |
        Thesis: The Great Society substantially expanded the federal government's role, extending the New Deal's commitment to economic security into health care, education, civil rights and immigration, but the Vietnam War's costs and a conservative backlash limited its reach by the 1970s, even as its core programs endured.

        Context: The long postwar boom, Kennedy's assassination and the civil rights movement created a moment of liberal confidence and huge Democratic majorities after 1964.

        Body 1 (change): Medicare and Medicaid; the Economic Opportunity Act; ESEA and Head Start; the Civil Rights Act of 1964 and Voting Rights Act; the 1965 immigration act; HUD; the poverty rate falling from about 19% to about 11%.

        Body 2 (continuity): it built on the New Deal (Medicare within Social Security), relied on economic growth rather than redistribution, and left many programs to the states.

        Body 3 (limits): Vietnam diverted money and attention; urban riots and white backlash; Nixon's 1968 victory; the 1970s stagflation; yet Nixon expanded some programs (food stamps, the Environmental Protection Agency).

        Complexity: the federal role grew under both parties into the 1970s, so the change outlasted its political base.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (1 pt): a defensible claim about the extent of change with a line of reasoning, e.g. "a major expansion that endured despite backlash."

        Contextualization (1 pt): the New Deal's precedent; the postwar boom and the rediscovery of poverty; the civil rights movement; Kennedy's assassination and the 1964 landslide. Must be explained.

        Evidence (2 pts): 1 pt for two specific examples; 2 for using them to support the argument. Acceptable: Economic Opportunity Act (1964); Job Corps, VISTA, Community Action; Head Start; Medicare and Medicaid (1965); ESEA (1965); Higher Education Act (1965); Immigration and Nationality Act (1965); HUD; NEA and NEH; Civil Rights Act (1964); Voting Rights Act (1965); Warren Court decisions; Goldwater's 1964 campaign; urban riots; Nixon's 1968 law-and-order campaign; the Environmental Protection Agency (1970); the poverty rate falling from about 19% (1964) to about 11% (1973).

        Analysis and reasoning (2 pts): 1 pt for a reasoning process (continuity and change compared with the New Deal; causation of the backlash); 1 pt for complex understanding, e.g. explaining both the expansion and its limits, comparing the Great Society with the New Deal in depth, or showing how Vietnam and the economy constrained it.

        Common errors: treating the Civil Rights Act as the only Great Society law; claiming the War on Poverty ended poverty; ignoring the role of the courts; confusing Great Society and New Deal programs.
