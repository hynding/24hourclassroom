week: 29
unit: 8
title: "World Power, Vietnam and the Great Society"
topics: ["8.7", "8.8", "8.9"]
guide: guides/week-29.md
guide_description: |
  The global Cold War from covert action in Iran and Guatemala through Cuba, détente and Camp David; the Vietnam War
  from the Geneva Accords to the fall of Saigon, and the debate it set off at home; and Lyndon Johnson's Great
  Society with the Warren Court's rights revolution and the conservative reaction. Worked examples: sourcing the
  Gulf of Tonkin Resolution, a causation chain from Tet to Vietnamization, and comparing the Great Society with the
  New Deal.
flashcards_description: |
  34 cards on Cold War crises and diplomacy from 1953 to 1979, the Vietnam War and the antiwar movement, and the
  laws and court cases of the Great Society era.

flashcards:
  - front: CIA covert action in Iran (1953) and Guatemala (1954)
    back: |
      The CIA helped overthrow Iran's prime minister Mohammad Mossadegh, who had nationalised the oil industry, and Guatemala's elected president Jacobo Árbenz, whose land reform threatened the United Fruit Company. Cheap, deniable containment, but it bred long-term resentment, notably in Iran in 1979.
    topic_code: "8.7"
  - front: Eisenhower Doctrine (1957) → what it promised
    back: |
      After the Suez Crisis, Eisenhower pledged economic and military aid, including troops, to Middle Eastern nations threatened by communism. He sent Marines to Lebanon in 1958 under it. Containment extended to the Middle East and its oil.
    topic_code: "8.7"
  - front: Suez Crisis (1956) → U.S. position and significance
    back: |
      Britain, France and Israel attacked Egypt after Nasser nationalised the Suez Canal. Eisenhower forced them to withdraw, opposing his own allies. It marked the end of British and French dominance in the Middle East and the rise of the United States there.
    topic_code: "8.7"
  - front: U-2 incident (May 1960)
    back: |
      The Soviets shot down an American spy plane and captured its pilot, Francis Gary Powers. Eisenhower's initial cover story collapsed, and a planned Paris summit with Khrushchev broke up.
    topic_code: "8.7"
  - front: Decolonization and the Cold War → why it mattered to U.S. policy
    back: |
      Dozens of new nations emerged in Asia and Africa after 1945. Both superpowers competed for their loyalty with aid, propaganda and sometimes covert intervention; many leaders chose non-alignment. American segregation was a liability in that competition.
    topic_code: "8.7"
  - front: Eisenhower's farewell address (January 1961) → warning
    back: |
      Eisenhower warned that a permanent arms industry joined to a huge military establishment, the military-industrial complex, could gain unwarranted influence over government, and that only an alert citizenry could keep security and liberty in balance. Striking from a former general.
    topic_code: "8.7"
  - front: Kennedy's flexible response → how it differed from massive retaliation
    back: |
      Kennedy built up conventional forces and special forces (such as the Green Berets) so the United States could answer threats at every level, from guerrilla war to nuclear war, rather than relying on the nuclear threat. It made intervention in places like Vietnam more thinkable.
    topic_code: "8.7"
  - front: Bay of Pigs (April 1961) → what happened
    back: |
      About 1,400 CIA-trained Cuban exiles landed in Cuba expecting to spark a rising against Fidel Castro; they were defeated within days. A humiliation for Kennedy that pushed Castro closer to the Soviet Union.
    topic_code: "8.7"
  - front: Berlin Wall (August 1961) → why it was built and what it symbolised
    back: |
      East Germany built it to stop the flight of its population to the West through Berlin. It became the most visible symbol of the Cold War division of Europe until it fell in 1989.
    topic_code: "8.7"
  - front: Cuban Missile Crisis (October 1962) → how it was resolved
    back: |
      U.S. spy planes found Soviet nuclear missiles in Cuba. Kennedy imposed a naval quarantine; after thirteen days Khrushchev withdrew the missiles in exchange for a U.S. pledge not to invade Cuba and a secret promise to remove American missiles from Turkey. The closest approach to nuclear war.
    topic_code: "8.7"
  - front: Effects of the Cuban Missile Crisis → two
    back: |
      A Washington–Moscow hotline (1963) and the Limited Test Ban Treaty (1963), which banned nuclear tests in the atmosphere, underwater and in space. Both sides also built up their arsenals, the Soviets determined never to be outgunned again.
    topic_code: "8.7"
  - front: Peace Corps (1961) → what it was
    back: |
      Kennedy's program sending American volunteers to teach and work in developing countries: idealism and Cold War soft power at once.
    topic_code: "8.7"
  - front: Détente → meaning and examples (Nixon and Kissinger)
    back: |
      A relaxation of Cold War tension through negotiation. Nixon visited China in February 1972 and signed the SALT I and Anti-Ballistic Missile treaties with the Soviet Union that May. Realpolitik: playing the two Communist powers against each other.
    topic_code: "8.7"
  - front: Camp David Accords (1978) → who and what
    back: |
      Jimmy Carter brought Egypt's Anwar Sadat and Israel's Menachem Begin together; Egypt recognised Israel and Israel returned the Sinai Peninsula. The peace treaty was signed in 1979; Carter's greatest diplomatic success.
    topic_code: "8.7"
  - front: Iran hostage crisis (1979–1981) → cause and effect
    back: |
      After a revolution overthrew the U.S.-backed Shah, militants seized the American embassy in Tehran in November 1979 and held 52 Americans for 444 days. A failed rescue in 1980 and the long humiliation helped defeat Carter.
    topic_code: "8.7"
  - front: Geneva Accords (1954) → what they did to Vietnam
    back: |
      After the Viet Minh defeated the French at Dien Bien Phu, Vietnam was temporarily divided at the 17th parallel, with national elections planned for 1956. The United States did not sign, backed Ngo Dinh Diem in the South, and the elections were never held.
    topic_code: "8.8"
  - front: Domino theory (Eisenhower, April 1954)
    back: |
      Eisenhower's argument at a press conference that if Indochina fell to communism, its neighbours would fall in turn like a row of dominoes. It justified U.S. commitment to South Vietnam for twenty years.
    topic_code: "8.8"
  - front: Gulf of Tonkin Resolution (August 1964) → what it authorised and why it mattered
    back: |
      After reported attacks on U.S. destroyers off North Vietnam (the second attack probably never happened), Congress authorised the president to take all necessary measures to repel attacks and prevent aggression. It passed 416–0 and 88–2 and became Johnson's legal basis for a full-scale war without a declaration.
    topic_code: "8.8"
  - front: Escalation, 1965 → Rolling Thunder and ground troops
    back: |
      Johnson began sustained bombing of North Vietnam (Operation Rolling Thunder) and sent combat troops in March 1965. U.S. forces grew to over half a million by 1968, fighting a war of attrition against the Viet Cong and North Vietnamese army.
    topic_code: "8.8"
  - front: Credibility gap → meaning
    back: |
      The growing distance between the Johnson administration's optimistic public claims of progress in Vietnam and what reporters and televised images showed. It eroded trust in government.
    topic_code: "8.8"
  - front: Tet Offensive (January 1968) → military vs political result
    back: |
      Communist forces attacked cities across South Vietnam, even the U.S. embassy grounds in Saigon. Militarily they were repulsed with heavy losses; politically it was a turning point, convincing many Americans the war could not be won soon. In March Johnson announced he would not seek re-election.
    topic_code: "8.8"
  - front: Vietnamization (1969) → Nixon's policy
    back: |
      Withdrawing American ground troops gradually while training and equipping the South Vietnamese army to fight on its own, combined with heavy bombing and pressure on North Vietnam. U.S. troop levels fell from about 540,000 to about 25,000 by late 1972.
    topic_code: "8.8"
  - front: Nixon's silent majority speech (November 1969)
    back: |
      Nixon appealed over the heads of antiwar protesters to the "great silent majority" of Americans to support his gradual withdrawal policy. It identified a political constituency of middle-class, patriotic voters that conservatives would court for decades.
    topic_code: "8.8"
  - front: Cambodia, Kent State and Jackson State (1970)
    back: |
      Nixon's announcement of an invasion of Cambodia set off nationwide campus protests. Ohio National Guardsmen killed four students at Kent State and police killed two at Jackson State in Mississippi. Hundreds of campuses shut down.
    topic_code: "8.8"
  - front: My Lai massacre (1968, revealed 1969)
    back: |
      U.S. soldiers killed several hundred unarmed Vietnamese villagers. When it became public in late 1969, it intensified doubts about the war's conduct; only one officer was convicted.
    topic_code: "8.8"
  - front: Pentagon Papers (1971) → what they showed and the court case
    back: |
      Daniel Ellsberg leaked a secret Defense Department history showing that successive administrations had misled the public about Vietnam. In New York Times Co. v. United States the Supreme Court refused to stop publication.
    topic_code: "8.8"
  - front: End of the Vietnam War → 1973 and 1975
    back: |
      The Paris Peace Accords (January 1973) ended direct U.S. involvement and returned American prisoners. North Vietnam conquered the South in April 1975. About 58,000 Americans and millions of Vietnamese, Cambodians and Laotians died.
    topic_code: "8.8"
  - front: War Powers Resolution (1973) → provisions
    back: |
      Passed over Nixon's veto, it requires the president to report to Congress within 48 hours of sending troops into hostilities and to withdraw them within 60 days (plus 30) unless Congress authorises the action. Congress reasserting its war powers after Vietnam.
    topic_code: "8.8"
  - front: War on Poverty (1964) → main law and programs
    back: |
      Johnson's Economic Opportunity Act created the Office of Economic Opportunity, the Job Corps, VISTA and Community Action programs with maximum feasible participation of the poor; Head Start followed. The official poverty rate fell from about 19% in 1964 to about 11% in 1973.
    topic_code: "8.9"
  - front: Medicare and Medicaid (1965)
    back: |
      Medicare provides health insurance for Americans over 65 through Social Security; Medicaid funds health care for the poor through the states. The biggest expansion of the welfare state since the New Deal.
    topic_code: "8.9"
  - front: Elementary and Secondary Education Act (1965)
    back: |
      The first large-scale federal aid to public schools, aimed at districts with many poor children. It sidestepped the old church–state dispute by funding students rather than schools.
    topic_code: "8.9"
  - front: Immigration and Nationality Act of 1965 (Hart-Celler) → what it changed
    back: |
      Abolished the national-origins quotas of 1924 in favour of family reunification and skills. It led, unexpectedly for its sponsors, to large new immigration from Asia and Latin America and transformed the population by Period 9.
    topic_code: "8.9"
  - front: Warren Court → four rights decisions of the 1960s
    back: |
      Gideon v. Wainwright (1963, right to a lawyer), Miranda v. Arizona (1966, warnings before questioning), Engel v. Vitale (1962, no official school prayer) and Reynolds v. Sims (1964, one person, one vote). Liberals praised them; conservatives attacked judicial activism.
    topic_code: "8.9"
  - front: Barry Goldwater (1964) → why his defeat still mattered
    back: |
      The Arizona Republican ran against the New Deal state and civil rights legislation and lost in a landslide, but carried five Deep South states and built a conservative movement of activists and donors that later elected Reagan.
    topic_code: "8.9"

quiz:
  description: |
    25 questions · about 40 minutes · about two thirds this week (Cold War crises and diplomacy, the Vietnam War, the
    Great Society) and a third review of weeks 27–28 (containment, prosperity, early civil rights) and Period 7
    (debates over empire). Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long essay are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Stimulus set: Eisenhower's farewell address (8.7, with review)
    - slug: apush-u08-w29-q01
      type: multiple_choice
      topic_code: "8.7"
      source: "Primary source: Dwight D. Eisenhower, Farewell Address (January 17, 1961), National Archives Milestone Documents"
      points: 1
      stimulus: &w29ike |
        "This conjunction of an immense military establishment and a large arms industry is new in the American experience. ...

        In the councils of government, we must guard against the acquisition of unwarranted influence, whether sought or unsought, by the military-industrial complex. The potential for the disastrous rise of misplaced power exists and will persist.

        We must never let the weight of this combination endanger our liberties or democratic processes. ... Only an alert and knowledgeable citizenry can compel the proper meshing of the huge industrial and military machinery of defense with our peaceful methods and goals, so that security and liberty may prosper together."

        — President Dwight D. Eisenhower, farewell address to the nation, January 17, 1961
      prompt: |
        The "immense military establishment" Eisenhower described was most directly a result of
      options:
        - "the demobilisation that followed World War II"
        - "the Neutrality Acts of the 1930s"
        - "the permanent Cold War buildup that followed NSC-68 and the Korean War"
        - "the Vietnam War's escalation in 1965"
      option_explanations:
        - |
          Demobilisation shrank the armed forces after 1945; the buildup came later, after 1950.
        - |
          The Neutrality Acts tried to keep the United States out of war; they produced no large arms industry.
        - |
          Correct. NSC-68 called for a permanent buildup and the Korean War funded it; defense took roughly half the federal budget through the 1950s, sustaining a standing arms industry for the first time in peacetime.
        - |
          The speech is from January 1961, four years before escalation in Vietnam.
      answer: 2
      explanation: |
        Contextualization. Eisenhower calls the arrangement "new in the American experience": before 1950 the country had always demobilised after its wars.

    - slug: apush-u08-w29-q02
      type: multiple_choice
      topic_code: "8.7"
      source: "Primary source: Dwight D. Eisenhower, Farewell Address (January 17, 1961), National Archives Milestone Documents"
      points: 1
      stimulus: *w29ike
      prompt: |
        Eisenhower's warning carries particular weight as a source because
      options:
        - "he was responding to a Soviet proposal for disarmament"
        - "he was a five-star general and two-term president who had himself presided over the arms buildup"
        - "he was speaking as the leader of the opposition party"
        - "he was a pacifist who had opposed the use of force throughout his career"
      option_explanations:
        - |
          The address is a reflective farewell to the American people, not a reply to a Soviet proposal.
        - |
          Correct. The warning came from someone with unmatched military authority who had relied on the defense establishment as president, which makes it hard to dismiss as naïve or partisan.
        - |
          Eisenhower was the outgoing Republican president, not an opposition leader.
        - |
          Eisenhower commanded the Allied invasion of Europe and relied on nuclear deterrence as president; he was no pacifist.
      answer: 1
      explanation: |
        Point of view (sourcing). When a speaker criticises something he helped build, the speaker's position becomes part of the argument.

    - slug: apush-u08-w29-q03
      type: multiple_choice
      topic_code: "8.4"
      source: "Primary source: Dwight D. Eisenhower, Farewell Address (January 17, 1961), National Archives Milestone Documents"
      points: 1
      stimulus: *w29ike
      prompt: |
        Review. Which of the following economic developments of the 1950s best illustrates the "conjunction" Eisenhower described?
      options:
        - "The decline of the Bracero Program"
        - "The rise of television advertising"
        - "The rapid growth of aerospace and electronics industries in California and the Sun Belt on defense contracts"
        - "The merger of the AFL and the CIO"
      option_explanations:
        - |
          The Bracero Program was a farm labour agreement with Mexico and continued until 1964; it is unrelated to arms production.
        - |
          Television advertising transformed consumer culture, not the defense economy.
        - |
          Correct. Firms such as aircraft and missile makers in Southern California grew on Pentagon contracts, tying whole regional economies and their congressional delegations to defense spending.
        - |
          The 1955 merger reshaped labour, but it is not an example of military and industrial interests joining.
      answer: 2
      explanation: |
        Making connections (review of 8.4). Defense spending was one of the engines of the boom and of Sun Belt growth.

    # ---- Stimulus set: the Gulf of Tonkin Resolution (8.8)
    - slug: apush-u08-w29-q04
      type: multiple_choice
      topic_code: "8.8"
      source: "Primary source: Tonkin Gulf Resolution (August 7, 1964), National Archives Milestone Documents"
      points: 1
      stimulus: &w29tonkin |
        "That the Congress approves and supports the determination of the President, as Commander in Chief, to take all necessary measures to repel any armed attack against the forces of the United States and to prevent further aggression. ...

        Consonant with the Constitution of the United States and the Charter of the United Nations and in accordance with its obligations under the Southeast Asia Collective Defense Treaty, the United States is, therefore, prepared, as the President determines, to take all necessary steps, including the use of armed force, to assist any member or protocol state of the Southeast Asia Collective Defense Treaty requesting assistance in defense of its freedom. ...

        This resolution shall expire when the President shall determine that the peace and security of the area is reasonably assured by international conditions created by action of the United Nations or otherwise, except that it may be terminated earlier by concurrent resolution of the Congress."

        — Joint Resolution of Congress, passed August 7, 1964
      prompt: |
        The resolution was passed in response to
      options:
        - "reports that North Vietnamese patrol boats had attacked U.S. destroyers off the coast of North Vietnam"
        - "the assassination of Ngo Dinh Diem"
        - "the Tet Offensive"
        - "the French defeat at Dien Bien Phu"
      option_explanations:
        - |
          Correct. Johnson reported attacks on the USS Maddox and USS Turner Joy in early August 1964; the second attack very probably did not occur, but Congress acted within days.
        - |
          Diem was killed in a coup in November 1963; the coup deepened instability but did not prompt this resolution.
        - |
          Tet came in January 1968, more than three years later.
        - |
          Dien Bien Phu fell in 1954, ten years earlier; the United States did not then commit troops.
      answer: 0
      explanation: |
        Historical situation (sourcing). Johnson presented the resolution as a measured response to an attack, months before the 1964 election, in which he ran as the candidate of restraint.

    - slug: apush-u08-w29-q05
      type: multiple_choice
      topic_code: "8.8"
      source: "Primary source: Tonkin Gulf Resolution (August 7, 1964), National Archives Milestone Documents"
      points: 1
      stimulus: *w29tonkin
      prompt: |
        Critics later argued that the resolution was most significant because it
      options:
        - "ended the draft"
        - "gave the president broad discretion to wage a large-scale war without a formal declaration, with Congress's role reduced to repealing it"
        - "required the president to obtain a declaration of war before sending ground troops"
        - "placed U.S. forces in Vietnam under United Nations command"
      option_explanations:
        - |
          The draft continued until 1973 and expanded during the war.
        - |
          Correct. Johnson used it to justify escalation to over half a million troops. Congress repealed it in 1971, and in 1973 passed the War Powers Resolution to prevent a repeat.
        - |
          The text does the opposite: it authorises "all necessary steps, including the use of armed force," "as the President determines."
        - |
          The resolution mentions the UN Charter as justification but places nothing under UN command; Vietnam was not a UN operation like Korea.
      answer: 1
      explanation: |
        Argumentation and continuity and change. Track the shift of war-making power from Congress to the president and Congress's attempt to take it back.

    - slug: apush-u08-w29-q06
      type: multiple_choice
      topic_code: "8.8"
      source: "Primary source: Tonkin Gulf Resolution (August 7, 1964), National Archives Milestone Documents"
      points: 1
      stimulus: *w29tonkin
      prompt: |
        The resolution's reference to defending member states of the Southeast Asia Collective Defense Treaty reflects which assumption of American policy?
      options:
        - "Détente: that the United States should negotiate spheres of influence with the Soviet Union"
        - "The Good Neighbor Policy toward Latin America"
        - "The domino theory: that the fall of South Vietnam would lead to Communist takeovers across Southeast Asia"
        - "Isolationism: that the United States should defend only the Western Hemisphere"
      option_explanations:
        - |
          Détente came under Nixon after 1969 and stressed negotiation, not commitments to fight.
        - |
          The Good Neighbor Policy concerned the Western Hemisphere and non-intervention.
        - |
          Correct. Treating Vietnam as part of a regional alliance (SEATO, 1954) expressed the belief, stated by Eisenhower in 1954, that one Communist victory would topple neighbours in turn.
        - |
          Isolationism would reject any commitment in Southeast Asia; this document makes one.
      answer: 2
      explanation: |
        Making connections. The domino theory linked a small country to the global logic of containment.

    # ---- Stimulus set: Johnson's Great Society speech (8.9, with review)
    - slug: apush-u08-w29-q07
      type: multiple_choice
      topic_code: "8.9"
      source: "Primary source: Lyndon B. Johnson, Remarks at the University of Michigan (May 22, 1964), American Presidency Project"
      points: 1
      stimulus: &w29gs |
        "For in your time we have the opportunity to move not only toward the rich society and the powerful society, but upward to the Great Society.

        The Great Society rests on abundance and liberty for all. It demands an end to poverty and racial injustice, to which we are totally committed in our time. But that is just the beginning.

        The Great Society is a place where every child can find knowledge to enrich his mind and to enlarge his talents. ... It is a place where the city of man serves not only the needs of the body and the demands of commerce but the desire for beauty and the hunger for community."

        — President Lyndon B. Johnson, commencement address at the University of Michigan, May 22, 1964
      prompt: |
        Which of the following laws most directly put into effect the goal expressed in the third paragraph?
      options:
        - "The Taft-Hartley Act"
        - "The Elementary and Secondary Education Act of 1965 and the creation of Head Start"
        - "The War Powers Resolution"
        - "The Federal-Aid Highway Act of 1956"
      option_explanations:
        - |
          Taft-Hartley (1947) restricted unions; it has nothing to do with education.
        - |
          Correct. ESEA sent federal money to schools serving poor children, and Head Start prepared low-income preschoolers, both aimed at letting every child "find knowledge to enrich his mind."
        - |
          The War Powers Resolution (1973) concerned presidential war-making.
        - |
          The highway act preceded the speech by eight years and concerned roads.
      answer: 1
      explanation: |
        Claims and evidence. Match a stated goal to the specific legislation that implemented it.

    - slug: apush-u08-w29-q08
      type: multiple_choice
      topic_code: "8.9"
      source: "Primary source: Lyndon B. Johnson, Remarks at the University of Michigan (May 22, 1964), American Presidency Project"
      points: 1
      stimulus: *w29gs
      prompt: |
        The Great Society differed from the New Deal chiefly in that it
      options:
        - "was a response to a severe economic depression"
        - "was launched in a time of prosperity and aimed at those left out of it, addressing race, health, education and the quality of life as well as income"
        - "opposed any expansion of federal power"
        - "relied on private charity rather than federal programs"
      option_explanations:
        - |
          That describes the New Deal. The Great Society was proposed amid the long boom; the speech itself says it "rests on abundance."
        - |
          Correct. Johnson assumed growth would continue and could pay for programs aimed at poverty, civil rights, health care (Medicare and Medicaid), education and even beauty and community, a broader agenda than the New Deal's focus on recovery and relief.
        - |
          The Great Society was the largest expansion of federal responsibility since the New Deal.
        - |
          Both programs relied on federal action; the Great Society created new federal agencies such as HUD and the Office of Economic Opportunity.
      answer: 1
      explanation: |
        Comparison across periods (7.10 and 8.9). A strong comparison names both a similarity (expanded federal role) and a difference (context of abundance; civil rights and quality of life).

    - slug: apush-u08-w29-q09
      type: multiple_choice
      topic_code: "8.4"
      source: "Primary source: Lyndon B. Johnson, Remarks at the University of Michigan (May 22, 1964), American Presidency Project"
      points: 1
      stimulus: *w29gs
      prompt: |
        Review. Johnson's confidence that the Great Society could rest "on abundance" was most directly based on
      options:
        - "a decline in defense spending after the Korean War to below prewar levels"
        - "the oil shortages of the 1970s"
        - "the success of the Marshall Plan in ending poverty in the United States"
        - "two decades of sustained economic growth that had created a mass middle class and growing federal revenues"
      option_explanations:
        - |
          Defense spending remained far above prewar levels throughout the 1950s and 1960s.
        - |
          The oil shocks came in 1973 and 1979, and they ended the age of easy growth.
        - |
          The Marshall Plan rebuilt Western Europe; it was not a domestic anti-poverty program.
        - |
          Correct. Since 1945 the economy had grown almost continuously; Johnson and his economists believed growth would generate the revenue to fund new programs without sacrifice.
      answer: 3
      explanation: |
        Contextualization (review of 8.4). The postwar boom is the essential context for the optimism of 1964, and the 1970s slowdown is the context for its retreat.

    - slug: apush-u08-w29-q10
      type: multiple_choice
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The Cuban Missile Crisis of October 1962 ended when
      options:
        - "the Soviet Union withdrew its missiles in exchange for a U.S. pledge not to invade Cuba and a secret agreement to remove American missiles from Turkey"
        - "Fidel Castro was overthrown by Cuban exiles"
        - "the United Nations Security Council voted to expel Cuba"
        - "the United States invaded Cuba and removed the missiles by force"
      option_explanations:
        - |
          Correct. Negotiation through public and secret channels let both leaders back down; the Turkish missile part was kept secret for years.
        - |
          Castro remained in power until 2008; the exile invasion at the Bay of Pigs had failed in 1961.
        - |
          The UN served as a forum for debate but did not resolve the crisis.
        - |
          Kennedy chose a naval quarantine rather than an air strike or invasion, leaving room for a negotiated outcome.
      answer: 0
      explanation: |
        Causation. Know both the resolution and its effects: the hotline and the Limited Test Ban Treaty of 1963.

    - slug: apush-u08-w29-q11
      type: multiple_choice
      topic_code: "8.8"
      source: "general knowledge"
      points: 1
      prompt: |
        The Tet Offensive of 1968 is considered a turning point in the Vietnam War chiefly because
      options:
        - "although American and South Vietnamese forces repelled it, it convinced many Americans that official claims of progress were false and that victory was not near"
        - "it destroyed the U.S. military's ability to fight"
        - "it led directly to the signing of the Paris Peace Accords within weeks"
        - "it was the first time American ground troops fought in Vietnam"
      option_explanations:
        - |
          Correct. Television images of fighting in Saigon after months of official optimism widened the credibility gap; in March, Johnson halted most bombing and announced he would not seek re-election.
        - |
          U.S. forces inflicted heavy losses on the attackers; Tet was a military defeat for the Viet Cong.
        - |
          The Paris Peace Accords were signed in January 1973, five years later.
        - |
          U.S. combat troops had been fighting since 1965.
      answer: 0
      explanation: |
        Causation and complexity: a battlefield victory can be a political defeat. That distinction is exactly what earns the complexity point in essays.

    - slug: apush-u08-w29-q12
      type: multiple_choice
      topic_code: "8.8"
      source: "Primary source: Richard Nixon, Address to the Nation on the War in Vietnam (November 3, 1969), American Presidency Project"
      points: 1
      stimulus: |
        "And so tonight—to you, the great silent majority of my fellow Americans—I ask for your support. ...

        Let us be united for peace. Let us also be united against defeat. Because let us understand: North Vietnam cannot defeat or humiliate the United States. Only Americans can do that."

        — President Richard Nixon, televised address to the nation, November 3, 1969
      prompt: |
        Nixon's purpose in this address was most likely to
      options:
        - "announce the immediate withdrawal of all American forces from Vietnam"
        - "ask Congress for a formal declaration of war against North Vietnam"
        - "announce the end of the draft"
        - "build public support for his gradual policy of Vietnamization by appealing to Americans who did not join antiwar protests"
      option_explanations:
        - |
          Nixon rejected immediate withdrawal in this speech, calling instead for patience while U.S. forces were withdrawn gradually.
        - |
          Nixon never sought a declaration of war; he was reducing, not expanding, the ground war.
        - |
          The draft ended in 1973; the speech concerns support for his war policy.
        - |
          Correct. Weeks after huge Moratorium protests, Nixon set a "silent majority" against the protesters, implying that dissent itself could cause defeat. His approval rose sharply after the speech.
      answer: 3
      explanation: |
        Audience and purpose (sourcing). The speech names its audience explicitly, and the political use of that audience shaped conservative politics for decades.

    - slug: apush-u08-w29-q13
      type: multiple_choice
      topic_code: "8.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best describes the Supreme Court's decisions under Chief Justice Earl Warren in the 1960s?
      options:
        - "They narrowed the rights of criminal defendants and expanded police powers"
        - "They overturned Brown v. Board of Education"
        - "They expanded individual rights, including the rights of the accused, equal representation and the separation of church and state, provoking conservative criticism of judicial activism"
        - "They struck down the Civil Rights Act of 1964 as beyond Congress's power"
      option_explanations:
        - |
          The Warren Court did the opposite: Gideon guaranteed lawyers to poor defendants and Miranda required warnings before questioning.
        - |
          Warren wrote Brown, and the Court reaffirmed it repeatedly.
        - |
          Correct. Gideon, Miranda, Reynolds v. Sims and Engel v. Vitale expanded rights; critics put up signs calling for Warren's impeachment and conservatives campaigned against the Court.
        - |
          The Court upheld the 1964 act under the commerce clause in Heart of Atlanta Motel v. United States (1964).
      answer: 2
      explanation: |
        Continuity and change in the role of the courts, and a cause of the conservative backlash of the late 1960s.

    - slug: apush-u08-w29-q14
      type: multiple_choice
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Kennedy's strategy of flexible response differed from Eisenhower's reliance on massive retaliation chiefly because it
      options:
        - "withdrew U.S. troops from Europe"
        - "abandoned nuclear weapons entirely"
        - "relied on the United Nations to resolve all conflicts"
        - "built up conventional and counterinsurgency forces so the United States could respond to limited wars without threatening nuclear war"
      option_explanations:
        - |
          U.S. troops remained in Europe under NATO throughout the Cold War, including after the 1961 Berlin crisis.
        - |
          Kennedy expanded the nuclear arsenal too; flexible response added options rather than removing nuclear ones.
        - |
          Kennedy acted unilaterally in Cuba and Vietnam; the UN played a supporting role.
        - |
          Correct. Massive retaliation was cheap but offered only all-or-nothing responses; flexible response, built on conventional and special forces, made it easier to fight guerrilla wars such as Vietnam.
      answer: 3
      explanation: |
        Continuity and change (review of 8.2). Containment's goal stayed; its military means shifted with each administration.

    - slug: apush-u08-w29-q15
      type: multiple_choice
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Civil Rights Act of 1957 was significant chiefly because it
      options:
        - "integrated the armed forces"
        - "ended segregation in public accommodations throughout the South"
        - "was the first federal civil rights law since Reconstruction, creating a Civil Rights Commission and a Justice Department division to pursue voting cases, though its enforcement was weak"
        - "abolished literacy tests in all states"
      option_explanations:
        - |
          Executive Order 9981 (1948) ordered integration of the armed forces.
        - |
          Public accommodations were desegregated by the Civil Rights Act of 1964.
        - |
          Correct. Its symbolic importance was large; its practical effect on Black voter registration was small, which is why stronger laws followed in 1960, 1964 and 1965.
        - |
          The Voting Rights Act of 1965 suspended literacy tests in covered states; a 1970 amendment banned them nationwide.
      answer: 2
      explanation: |
        Continuity and change (review of 8.6). The 1957 act is the first step in a sequence; know what came after it and why.

    - slug: apush-u08-w29-q16
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which earlier conflict most resembled the Vietnam War in that American forces fought a long counterinsurgency against a nationalist movement in Asia, prompting domestic protest over the war's methods and purpose?
      options:
        - "The Philippine–American War (1899–1902)"
        - "World War I"
        - "The Mexican–American War"
        - "The War of 1812"
      option_explanations:
        - |
          Correct. U.S. forces fought Emilio Aguinaldo's independence movement in a brutal guerrilla war, and anti-imperialists at home condemned it, much as antiwar activists later condemned Vietnam.
        - |
          World War I was a conventional war in Europe against Germany.
        - |
          The Mexican–American War was a conventional war of conquest in North America, though it did prompt protest.
        - |
          The War of 1812 was fought against Britain in North America; it was not a counterinsurgency in Asia.
      answer: 0
      explanation: |
        Comparison across periods (7.3 and 8.8). Similarities: guerrilla war, nationalist enemy, domestic dissent. Difference: the Philippines became a colony; Vietnam was a war to contain communism.

    - slug: apush-u08-w29-q17
      type: multi_select
      topic_code: "8.9"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were enacted as part of Lyndon Johnson's Great Society.
      options:
        - "Medicare and Medicaid"
        - "The Immigration and Nationality Act of 1965, which ended the national-origins quotas"
        - "The Social Security Act"
        - "The Economic Opportunity Act, which created the Job Corps and Community Action programs"
        - "The GI Bill"
      option_explanations:
        - |
          Correct. Signed in July 1965, they extended health coverage to the elderly and the poor.
        - |
          Correct. Hart-Celler replaced the 1924 quotas with preferences for family and skills, transforming immigration.
        - |
          The Social Security Act dates from 1935 and the New Deal; Medicare was added to it in 1965.
        - |
          Correct. Passed in 1964 as the core of the War on Poverty.
        - |
          The GI Bill was passed in 1944 under Franklin Roosevelt.
      answer: [0, 1, 3]
      explanation: |
        Periodisation. Keep New Deal (1930s), wartime (1940s) and Great Society (1964–1966) laws distinct.

    - slug: apush-u08-w29-q18
      type: multi_select
      topic_code: "8.8"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that contributed to growing opposition to the Vietnam War in the United States between 1965 and 1971.
      options:
        - "The draft, which fell heavily on working-class and minority young men while college students could obtain deferments"
        - "Television coverage that brought combat and casualties into American homes"
        - "The Soviet Union's withdrawal of support from North Vietnam"
        - "Revelations such as the My Lai massacre and the Pentagon Papers"
        - "Rising casualties with no clear sign of victory"
      option_explanations:
        - |
          Correct. Inequities in the draft, and the draft itself, mobilised students, Black leaders and families.
        - |
          Correct. Vietnam was the first war televised nightly, and images such as those from Tet widened the credibility gap.
        - |
          The Soviet Union and China continued to supply North Vietnam throughout the war.
        - |
          Correct. Both damaged public faith in the war's conduct and in official honesty.
        - |
          Correct. U.S. deaths reached about 300 a week in 1968 while officials promised progress.
      answer: [0, 1, 3, 4]
      explanation: |
        Causation with multiple causes. Strong essays rank causes rather than listing them, and note that many Americans also supported the war or wanted it fought harder.

    - slug: apush-u08-w29-q19
      type: true_false
      topic_code: "8.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Congress passed the War Powers Resolution of 1973 over President Nixon's veto, requiring the president to withdraw forces from hostilities within 60 days (with a possible 30-day extension) unless Congress authorised their use.
      answer: true
      explanation: |
        True. The text says that within sixty calendar days the president "shall terminate any use of United States Armed Forces" unless Congress has declared war or authorised it. It was Congress's attempt to reclaim war powers it had ceded in the Gulf of Tonkin Resolution.

    - slug: apush-u08-w29-q20
      type: true_false
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The religious revival of the 1950s was unrelated to the Cold War.
      answer: false
      explanation: |
        False. Leaders presented faith as what distinguished the United States from atheistic communism: Congress added "under God" to the Pledge of Allegiance in 1954 and adopted "In God We Trust" as the national motto in 1956.

    - slug: apush-u08-w29-q21
      type: fill_blank
      topic_code: "8.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Created in 1965, ____ provides federal health insurance for Americans aged 65 and older through the Social Security system.
      answer: ["Medicare"]
      explanation: |
        Medicare. Its companion, Medicaid, funds health care for low-income people through the states. Both are among the Great Society's most lasting programs.

    - slug: apush-u08-w29-q22
      type: fill_blank
      topic_code: "8.6"
