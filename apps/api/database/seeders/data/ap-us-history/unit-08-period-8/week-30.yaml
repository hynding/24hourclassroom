week: 30
unit: 8
title: "Civil Rights Expanded, Youth Culture and a Society in Transition"
topics: ["8.10", "8.11", "8.12", "8.13", "8.14", "8.15"]
guide: guides/week-30.md
guide_description: |
  The civil rights movement's peak from the sit-ins to the Voting Rights Act, its turn toward Black Power and the
  urban North, and the movements it inspired among women, Latinos, American Indians, Asian Americans and gay
  Americans. Then the New Left and counterculture, the environmental laws of 1969–1973, and the troubled 1970s of
  Watergate, stagflation and the energy crisis, closing with a continuity-and-change review of Period 8. Worked
  examples: sourcing Johnson's voting-rights message, a continuity-and-change thesis for the period, and an SAQ on
  the 1970s.
flashcards_description: |
  34 cards on the 1960s civil rights campaigns and laws, the movements for women, Latinos, American Indians and gay
  Americans, youth culture, environmental policy, and Watergate, stagflation and the energy crisis.

flashcards:
  - front: Greensboro sit-ins (February 1960) → what and why they mattered
    back: |
      Four Black college students sat at a whites-only Woolworth's lunch counter in Greensboro, North Carolina, and returned daily. Sit-ins spread to dozens of cities within weeks, shifting the movement toward student-led direct action.
    topic_code: "8.10"
  - front: SNCC (1960) → founding and approach
    back: |
      The Student Nonviolent Coordinating Committee, founded at a conference organised by Ella Baker, who urged students to keep their independence from older organisations. It favoured grassroots, group-centred organising, especially voter registration in rural Mississippi.
    topic_code: "8.10"
  - front: Freedom Rides (1961) → goal and result
    back: |
      Interracial CORE volunteers rode buses through the South to test Supreme Court rulings against segregated interstate travel. Mobs burned a bus in Anniston and beat riders in Birmingham and Montgomery; the Kennedy administration sent marshals, and the Interstate Commerce Commission banned segregation in terminals that autumn.
    topic_code: "8.10"
  - front: Birmingham campaign (1963) → strategy and effect
    back: |
      SCLC campaign in the most segregated big city in the South. When police commissioner Bull Connor turned dogs and fire hoses on marching children, national television coverage shocked the country, and Kennedy proposed a civil rights bill. King's letter from the city jail, defending direct action against calls for patience, became a classic (read it, but it is not public domain).
    topic_code: "8.10"
  - front: Kennedy's civil rights address (June 11, 1963)
    back: |
      After Alabama's governor tried to block the integration of the state university, Kennedy told the nation that civil rights was primarily a moral issue and announced legislation that became the Civil Rights Act of 1964.
    topic_code: "8.10"
  - front: March on Washington (August 1963) → who, what, significance
    back: |
      About 250,000 people marched for jobs and freedom, organised by A. Philip Randolph and Bayard Rustin with the major civil rights groups. King's speech there became the movement's best-known statement of an integrated America; the march built pressure for the civil rights bill.
    topic_code: "8.10"
  - front: Civil Rights Act of 1964 → main provisions
    back: |
      Banned discrimination in public accommodations (Title II) and in employment by race, colour, religion, sex or national origin (Title VII, enforced by a new Equal Employment Opportunity Commission), and allowed federal funds to be cut off from segregated programs. Broke a Senate filibuster of record length.
    topic_code: "8.10"
  - front: Freedom Summer and the MFDP (1964)
    back: |
      Hundreds of mostly white Northern student volunteers joined SNCC workers registering voters in Mississippi; three activists (James Chaney, Andrew Goodman and Michael Schwerner) were murdered. The Mississippi Freedom Democratic Party, with Fannie Lou Hamer, challenged the all-white state delegation at the Democratic convention and was offered only two token seats.
    topic_code: "8.10"
  - front: Selma and the Voting Rights Act (1965)
    back: |
      State troopers beat marchers on the Edmund Pettus Bridge on March 7, 1965 (Bloody Sunday). Johnson asked Congress for a voting rights law; the act suspended literacy tests and sent federal examiners to register voters in covered states. Black registration in Mississippi rose from under 7% to about 60% within a few years.
    topic_code: "8.10"
  - front: Malcolm X → views and significance (describe, do not quote)
    back: |
      A minister of the Nation of Islam who rejected nonviolence as the only method and integration as the goal, stressing Black self-respect, self-defence and separation. After leaving the Nation in 1964 he moved toward internationalism; he was assassinated in 1965. A major influence on Black Power.
    topic_code: "8.10"
  - front: Black Power (1966) → meaning and who popularised it
    back: |
      Stokely Carmichael of SNCC popularised the slogan in 1966: Black communities should control their own institutions and politics, take pride in Black identity and not depend on white allies. SNCC expelled white members; the Black Panther Party (Oakland, 1966) combined armed self-defence with community programs.
    topic_code: "8.10"
  - front: Urban uprisings and the Kerner Commission (1965–1968)
    back: |
      Riots in Watts (1965), Newark and Detroit (1967) and over a hundred cities after King's assassination (1968). Johnson's Kerner Commission blamed white racism, segregation and poverty, warning that the nation was moving toward two separate and unequal societies.
    topic_code: "8.10"
  - front: Feminine Mystique (1963) and NOW (1966) → Betty Friedan's role
    back: |
      Friedan's book described the dissatisfaction of educated suburban housewives confined to domestic roles. In 1966 she helped found the National Organization for Women to push for equal employment, including enforcement of Title VII's ban on sex discrimination. Liberal feminism.
    topic_code: "8.11"
  - front: Title IX (1972) → what it requires
    back: |
      Part of the Education Amendments of 1972: no person may be excluded on the basis of sex from any education program receiving federal money. Best known for transforming girls' and women's athletics.
    topic_code: "8.11"
  - front: Equal Rights Amendment → passage and defeat
    back: |
      Congress sent the ERA to the states in 1972. Thirty-five of the needed 38 states ratified, but a conservative campaign led by Phyllis Schlafly argued it would end protections for women, such as exemption from the draft, and it failed by the 1982 deadline.
    topic_code: "8.11"
  - front: Roe v. Wade (1973) → ruling and political effect
    back: |
      The Supreme Court held that a constitutional right to privacy covered a woman's decision to have an abortion in the early stages of pregnancy. It became the central issue of a new religious conservatism; the Court overruled it in 2022.
    topic_code: "8.11"
  - front: César Chávez, Dolores Huerta and the United Farm Workers
    back: |
      Chávez and Huerta organised Mexican American farm workers in California; with Filipino American workers led by Larry Itliong they struck grape growers in Delano from 1965 and organised a national consumer boycott, winning union contracts in 1970. Nonviolence, fasting and the boycott were their tools.
    topic_code: "8.11"
  - front: Chicano movement → examples
    back: |
      Mexican American activism for civil rights and cultural pride: student walkouts in East Los Angeles high schools (1968) against poor schools, the Brown Berets, the La Raza Unida Party (1970), and campaigns for bilingual education and Chicano studies.
    topic_code: "8.11"
  - front: American Indian Movement (AIM) → actions
    back: |
      Founded in Minneapolis in 1968. Red Power activists occupied Alcatraz Island (1969–1971), the Bureau of Indian Affairs building (1972) and Wounded Knee, South Dakota (1973), demanding treaty rights and self-determination.
    topic_code: "8.11"
  - front: From termination to self-determination (1953 → 1975)
    back: |
      In the 1950s Congress tried to end the federal relationship with tribes (termination) and moved Indians to cities (relocation). Activism and Nixon's 1970 message reversed course; the Indian Self-Determination and Education Assistance Act (1975) let tribes run federal programs themselves.
    topic_code: "8.11"
  - front: Stonewall (June 1969) → significance
    back: |
      A police raid on the Stonewall Inn, a gay bar in New York City, set off days of resistance. It is the conventional starting point of the gay liberation movement; the first pride marches followed in 1970.
    topic_code: "8.11"
  - front: Port Huron Statement (1962) and SDS (describe)
    back: |
      Students for a Democratic Society's founding manifesto criticised racism, the arms race and the apathy of affluent society, and called for participatory democracy. It defined the New Left, which moved from campus reform to opposing the Vietnam War.
    topic_code: "8.12"
  - front: New Left vs counterculture → difference
    back: |
      The New Left was political: it organised to change policies on civil rights, the war and university governance. The counterculture (hippies) was cultural: it rejected mainstream values through music, drugs, communal living and sexual freedom. They overlapped but often disagreed about whether politics or personal liberation mattered more.
    topic_code: "8.12"
  - front: Tinker v. Des Moines (1969) → ruling
    back: |
      The Supreme Court (7–2) held that students who wore black armbands to protest the Vietnam War were protected by the First Amendment unless their expression substantially disrupted school. Students do not lose their constitutional rights at school.
    topic_code: "8.12"
  - front: Twenty-sixth Amendment (1971)
    back: |
      Lowered the voting age to 18 in all elections, ratified in about three months. The argument that those old enough to be drafted should be old enough to vote drove it.
    topic_code: "8.12"
  - front: Silent Spring (1962) → why it mattered (describe)
    back: |
      Rachel Carson's book documented how pesticides such as DDT harmed birds and ecosystems and threatened human health. It built public concern that fed the environmental laws of the 1970s; DDT was banned for most uses in 1972.
    topic_code: "8.13"
  - front: Earth Day and the EPA (1970)
    back: |
      About 20 million Americans took part in the first Earth Day (April 22, 1970). That December Nixon created the Environmental Protection Agency by reorganisation, after signing the National Environmental Policy Act, which requires environmental impact statements.
    topic_code: "8.13"
  - front: Major environmental laws, 1970–1973
    back: |
      Clean Air Act (1970), Clean Water Act (1972, passed over Nixon's veto), Endangered Species Act (1973). Bipartisan majorities made environmental protection a permanent federal responsibility.
    topic_code: "8.13"
  - front: Oil embargo of 1973 → cause and effects
    back: |
      Arab members of OPEC cut off oil to the United States for supporting Israel in the October 1973 war. Prices roughly quadrupled, causing shortages, gasoline lines and a 55 mph speed limit, and exposing American dependence on imported oil.
    topic_code: "8.13"
  - front: Watergate (1972–1974) → what happened and outcome
    back: |
      Men linked to Nixon's re-election committee were caught breaking into Democratic headquarters. Nixon helped cover it up; when the Supreme Court in United States v. Nixon (1974) ordered him to release tapes proving it, he resigned on August 9, 1974, the only president to do so.
    topic_code: "8.14"
  - front: Stagflation → meaning and causes
    back: |
      High inflation and high unemployment at once, which the postwar economic consensus said should not happen. Causes: Vietnam spending without tax increases, oil shocks, and rising foreign competition. Inflation passed 13% in 1979–1980.
    topic_code: "8.14"
  - front: Carter's "crisis of confidence" address (July 1979)
    back: |
      Amid gasoline lines and inflation, Carter told Americans that the nation faced a crisis of confidence and urged sacrifice and energy conservation. Critics called it the malaise speech; it came to symbolise a presidency that seemed unable to master the economy.
    topic_code: "8.14"
  - front: The New Right of the 1970s → its sources
    back: |
      Opposition to busing and affirmative action (Boston's busing conflict, 1974; the Bakke case, 1978), the tax revolt (California's Proposition 13, 1978), religious conservatives mobilised against Roe and the ERA (the Moral Majority, 1979) and anti-communists who rejected détente. Together they set up Reagan's 1980 victory.
    topic_code: "8.14"
  - front: Continuity and change in Period 8 → one-sentence thesis
    back: |
      Between 1945 and 1980 containment and a large federal government persisted, but confidence in both eroded: the liberal consensus that built them was challenged from the left by rights movements and antiwar protest and from the right by a growing conservative movement, while the economy shifted from boom to stagflation.
    topic_code: "8.15"

quiz:
  description: |
    25 questions · about 40 minutes · about two thirds this week (civil rights in the 1960s, the movements it
    inspired, youth culture, environmental policy, the 1970s and continuity and change in Period 8) and a third
    review of weeks 27–29 (prosperity, early civil rights, détente, Vietnam, the Great Society). Multiple choice,
    select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: Johnson's voting-rights message (8.10)
    - slug: apush-u08-w30-q01
      type: multiple_choice
      topic_code: "8.10"
      source: "Primary source: Lyndon B. Johnson, Special Message to the Congress: The American Promise (March 15, 1965), American Presidency Project"
      points: 1
      stimulus: &w30promise |
        "At times history and fate meet at a single time in a single place to shape a turning point in man's unending search for freedom. So it was at Lexington and Concord. So it was a century ago at Appomattox. So it was last week in Selma, Alabama. ...

        Every American citizen must have an equal right to vote. ...

        There is no Negro problem. There is no Southern problem. There is no Northern problem. There is only an American problem. ...

        Their cause must be our cause too. Because it is not just Negroes, but really it is all of us, who must overcome the crippling legacy of bigotry and injustice."

        — President Lyndon B. Johnson, televised address to a joint session of Congress, March 15, 1965
      prompt: |
        The events "last week in Selma, Alabama" that Johnson referred to were
      options:
        - "the integration of the University of Alabama"
        - "the first sit-in at a lunch counter"
        - "the beating of peaceful voting-rights marchers by state troopers on the Edmund Pettus Bridge"
        - "the bombing of a church that killed four Black girls"
      option_explanations:
        - |
          The University of Alabama was integrated in June 1963 after Governor Wallace's stand in the schoolhouse door.
        - |
          The first famous sit-in was in Greensboro, North Carolina, in February 1960.
        - |
          Correct. On March 7, 1965 (Bloody Sunday), Alabama troopers attacked marchers heading for Montgomery to demand the vote; televised images led Johnson to address Congress eight days later.
        - |
          The 16th Street Baptist Church bombing happened in Birmingham in September 1963, not in Selma in 1965.
      answer: 2
      explanation: |
        Historical situation (sourcing). Johnson spoke while the Selma campaign was still under way, using national outrage to push a voting rights bill.

    - slug: apush-u08-w30-q02
      type: multiple_choice
      topic_code: "8.10"
      source: "Primary source: Lyndon B. Johnson, Special Message to the Congress: The American Promise (March 15, 1965), American Presidency Project"
      points: 1
      stimulus: *w30promise
      prompt: |
        Johnson's comparison of Selma with Lexington, Concord and Appomattox was most likely intended to
      options:
        - "suggest that the civil rights movement had become a violent revolution"
        - "reassure Southern members of Congress that no new law was needed"
        - "present the voting rights struggle as part of the nation's founding and defining story, making support for it a patriotic duty"
        - "argue that the South should be occupied by federal troops as during Reconstruction"
      option_explanations:
        - |
          The marchers at Selma were nonviolent; the violence came from state troopers. Johnson presented their cause as a moral one.
        - |
          Johnson was asking for a new law; the speech is an argument for legislation.
        - |
          Correct. Linking Selma to the Revolution and the Civil War cast Black voting rights as the fulfilment of American freedom rather than a sectional or racial demand, which helped win over Northern and moderate legislators.
        - |
          Johnson asked for a law enforced by federal registrars, not military occupation.
      answer: 2
      explanation: |
        Purpose (sourcing). Presidents speaking to Congress and the nation use historical analogy to make a contested policy feel like a national tradition.

    - slug: apush-u08-w30-q03
      type: multiple_choice
      topic_code: "8.10"
      source: "Primary source: Lyndon B. Johnson, Special Message to the Congress: The American Promise (March 15, 1965), American Presidency Project"
      points: 1
      stimulus: *w30promise
      prompt: |
        Which of the following was the most direct result of the developments Johnson addressed?
      options:
        - "The ratification of the Fifteenth Amendment"
        - "The Voting Rights Act of 1965, which suspended literacy tests and sent federal examiners to register voters in Southern states"
        - "The end of all racial inequality in voting by 1966"
        - "The Supreme Court's ruling in Plessy v. Ferguson"
      option_explanations:
        - |
          The Fifteenth Amendment was ratified in 1870; the 1965 law enforced what it had promised.
        - |
          Correct. Signed in August 1965, it transformed Southern politics: Black registration in Mississippi rose from under 7% to about 60% within a few years.
        - |
          The law made a dramatic difference, but disputes over districting, enforcement and voting rules continued long afterward.
        - |
          Plessy (1896) upheld segregation; it is the opposite of a result of the voting rights campaign.
      answer: 1
      explanation: |
        Causation. Grassroots protest, televised violence and presidential leadership together produced the law; essays should show how they combined.

    # ---- Stimulus set: the Kerner Commission (8.10, with review)
    - slug: apush-u08-w30-q04
      type: multiple_choice
      topic_code: "8.10"
      source: "Primary source: Report of the National Advisory Commission on Civil Disorders (1968), via Teaching American History"
      points: 1
      stimulus: &w30kerner |
        "This is our basic conclusion: Our nation is moving toward two societies, one black, one white—separate and unequal. ...

        Segregation and poverty have created in the racial ghetto a destructive environment totally unknown to most white Americans."

        — Report of the National Advisory Commission on Civil Disorders (the Kerner Commission), appointed by President Johnson, 1968
      prompt: |
        The commission was appointed in response to
      options:
        - "urban riots in Newark, Detroit and other cities in the summer of 1967"
        - "the murder of civil rights workers during Freedom Summer"
        - "the Watergate break-in"
        - "the Montgomery Bus Boycott"
      option_explanations:
        - |
          Correct. After deadly uprisings in 1967 (Detroit's left 43 dead), Johnson named Illinois Governor Otto Kerner to lead an inquiry into their causes.
        - |
          The 1964 murders of Chaney, Goodman and Schwerner led to a federal investigation, not this commission.
        - |
          Watergate began in 1972, four years after the report.
        - |
          The Montgomery boycott (1955–1956) was a disciplined, nonviolent protest in the South, more than a decade earlier.
      answer: 0
      explanation: |
        Historical situation (sourcing). The report shifts attention from Southern legal segregation to Northern and Western urban inequality.

    - slug: apush-u08-w30-q05
      type: multiple_choice
      topic_code: "8.10"
      source: "Primary source: Report of the National Advisory Commission on Civil Disorders (1968), via Teaching American History"
      points: 1
      stimulus: *w30kerner
      prompt: |
        The conditions the commission described most directly encouraged which development in the civil rights movement after 1965?
      options:
        - "A shift of focus toward economic inequality, Northern cities and Black self-determination, including the Black Power movement"
        - "The abandonment of all political activity by civil rights groups"
        - "A return to the litigation strategy of the 1930s"
        - "A campaign for the Twenty-fourth Amendment"
      option_explanations:
        - |
          Correct. With legal segregation outlawed, activists turned to housing, jobs and police; King campaigned in Chicago in 1966 and planned the Poor People's Campaign, while Black Power stressed community control.
        - |
          Activism continued and broadened, into electoral politics, community programs and economic campaigns.
        - |
          Litigation continued, but the defining new direction was economic and urban, not a return to the 1930s.
        - |
          The Twenty-fourth Amendment, banning poll taxes in federal elections, was ratified in 1964, before this period.
      answer: 0
      explanation: |
        Continuity and change in the movement's goals: from desegregation and voting in the South to economic justice and power in the cities.

    - slug: apush-u08-w30-q06
      type: multiple_choice
      topic_code: "8.4"
      source: "Primary source: Report of the National Advisory Commission on Civil Disorders (1968), via Teaching American History"
      points: 1
      stimulus: *w30kerner
      prompt: |
        Review. Which postwar development most directly contributed to the separation the commission described?
      options:
        - "The end of the national-origins quotas in 1965"
        - "The Marshall Plan"
        - "Federal mortgage and highway policies that helped white families move to suburbs while redlining and restrictive practices kept Black families in older city neighbourhoods"
        - "The Bracero Program"
      option_explanations:
        - |
          The 1965 immigration law came too late to explain conditions in 1967, and it did not create segregated neighbourhoods.
        - |
          The Marshall Plan rebuilt Western Europe; it did not shape American housing patterns.
        - |
          Correct. FHA and VA lending, suburban exclusion and highways built through Black districts concentrated poverty in central cities as jobs and tax revenue left (review of 8.4).
        - |
          The Bracero Program concerned Mexican agricultural labour, mostly in the Southwest.
      answer: 2
      explanation: |
        Causation across the period. The prosperity of the 1950s and the urban crisis of the 1960s were connected by the same federal policies.

    # ---- Stimulus set: Carter's crisis of confidence (8.14, 8.13, review)
    - slug: apush-u08-w30-q07
      type: multiple_choice
      topic_code: "8.14"
      source: "Primary source: Jimmy Carter, Address to the Nation on Energy and National Goals (July 15, 1979), American Presidency Project"
      points: 1
      stimulus: &w30carter |
        "It is a crisis of confidence. It is a crisis that strikes at the very heart and soul and spirit of our national will. ...

        The erosion of our confidence in the future is threatening to destroy the social and the political fabric of America. ...

        In a nation that was proud of hard work, strong families, close-knit communities, and our faith in God, too many of us now tend to worship self-indulgence and consumption. Human identity is no longer defined by what one does, but by what one owns."

        — President Jimmy Carter, televised address to the nation, July 15, 1979
      prompt: |
        Which of the following best explains the "erosion of our confidence" that Carter described?
      options:
        - "The economic depression that followed the stock market crash"
        - "A decade of shocks including the Vietnam War, Watergate, stagflation and energy shortages"
        - "The Soviet Union's launch of Sputnik"
        - "The defeat of the Equal Rights Amendment in 1982"
      option_explanations:
        - |
          The crash of 1929 and the Depression came half a century earlier.
        - |
          Correct. Defeat in Vietnam, a president's resignation, inflation above 10% with high unemployment, and gasoline lines in 1973 and again in 1979 undermined faith in government and in continued prosperity.
        - |
          Sputnik (1957) caused alarm but was followed by two decades of growth and the moon landing.
        - |
          The ERA's deadline passed in 1982, three years after this speech.
      answer: 1
      explanation: |
        Contextualization. Carter's speech is a summary of the 1970s; its date (1979) and themes point to Vietnam, Watergate, stagflation and energy.

    - slug: apush-u08-w30-q08
      type: multiple_choice
      topic_code: "8.13"
      source: "Primary source: Jimmy Carter, Address to the Nation on Energy and National Goals (July 15, 1979), American Presidency Project"
      points: 1
      stimulus: *w30carter
      prompt: |
        Carter's address was originally planned as a speech on energy policy. Which of the following was a policy response of the 1970s to the energy crisis?
      options:
        - "Creation of the Department of Energy, a national 55 mph speed limit and fuel-efficiency standards for cars"
        - "The abolition of the Environmental Protection Agency"
        - "The construction of the interstate highway system"
        - "A federal ban on all oil imports"
      option_explanations:
        - |
          Correct. After the 1973 embargo Congress set a 55 mph limit (1974) and fuel-economy standards (1975), and Carter created the Department of Energy (1977) and pushed conservation and alternative fuels.
        - |
          The EPA, created in 1970, continued; environmental protection and energy policy sometimes conflicted but the agency survived.
        - |
          The interstate system was authorised in 1956, before the energy crisis, and encouraged oil consumption.
        - |
          The United States depended on imports; banning them would have deepened the shortage.
      answer: 0
      explanation: |
        Causation (8.13). The oil shocks of 1973 and 1979 forced the first serious federal energy policy and exposed limits on American power.

    - slug: apush-u08-w30-q09
      type: multiple_choice
      topic_code: "8.5"
      source: "Primary source: Jimmy Carter, Address to the Nation on Energy and National Goals (July 15, 1979), American Presidency Project"
      points: 1
      stimulus: *w30carter
      prompt: |
        Review. Carter's criticism of "self-indulgence and consumption" most closely echoes earlier critics of which development?
      options:
        - "The New Deal's public works programs"
        - "The Second Great Awakening's reform movements"
        - "The Progressive Era's trust-busting"
        - "The consumer and suburban culture of the 1950s, which social critics had attacked for materialism and conformity"
      option_explanations:
        - |
          New Deal public works were a response to unemployment, not to excessive consumption.
        - |
          The Second Great Awakening's reformers attacked sin and slavery in the antebellum era; the connection is remote.
        - |
          Trust-busting attacked corporate monopoly, not consumers' values.
        - |
          Correct. Writers of the 1950s and the Beats had warned that affluence and consumerism were hollowing out American character (review of 8.5); Carter makes a similar argument in a decade of scarcity.
      answer: 3
      explanation: |
        Making connections (continuity). Anxiety about affluence runs from the 1950s through the 1970s, though the economic context reversed.

    - slug: apush-u08-w30-q10
      type: multiple_choice
      topic_code: "8.11"
      source: "general knowledge"
      points: 1
      prompt: |
        César Chávez and Dolores Huerta's United Farm Workers won contracts from California grape growers in 1970 chiefly by
      options:
        - "leading armed occupations of farms"
        - "combining a long strike with a nationwide consumer boycott of table grapes and nonviolent tactics such as marches and fasts"
        - "persuading Congress to extend the National Labor Relations Act to farm workers"
        - "relying on the Bracero Program to supply union members"
      option_explanations:
        - |
          The UFW was committed to nonviolence, modelled partly on King and Gandhi.
        - |
          Correct. The Delano strike began in 1965 with Filipino American workers; the boycott enlisted millions of consumers and pressured growers into signing in 1970.
        - |
          Farm workers remained excluded from the National Labor Relations Act; that exclusion is why the boycott was needed.
        - |
          The UFW opposed the Bracero Program, which growers used to undercut wages; its end in 1964 made organising possible.
      answer: 1
      explanation: |
        Comparison: the UFW borrowed nonviolent direct action from the Black freedom struggle and applied it to labour and Mexican American rights.

    - slug: apush-u08-w30-q11
      type: multiple_choice
      topic_code: "8.11"
      source: "Primary source: Richard Nixon, Special Message to the Congress on Indian Affairs (July 8, 1970), American Presidency Project"
      points: 1
      stimulus: |
        "The time has come to break decisively with the past and to create the conditions for a new era in which the Indian future is determined by Indian acts and Indian decisions. ...

        This, then, must be the goal of any new national policy toward the Indian people: to strengthen the Indian's sense of autonomy without threatening his sense of community."

        — President Richard Nixon, special message to Congress on Indian affairs, July 8, 1970
      prompt: |
        The policy Nixon proposed was a reversal of which earlier federal approach?
      options:
        - "The return of land to tribes after the Dawes Act"
        - "Termination and relocation, which in the 1950s sought to end the federal relationship with tribes and move Indians to cities"
        - "The Indian Reorganization Act's encouragement of tribal governments"
        - "The recognition of tribal sovereignty in the Constitution"
      option_explanations:
        - |
          The Dawes Act (1887) took land from tribes; there was no general return of land afterward.
        - |
          Correct. Termination ended federal recognition of more than a hundred tribes and bands and relocation moved thousands to cities with little support; Nixon called for self-determination instead, leading to the 1975 Self-Determination Act.
        - |
          The 1934 Indian Reorganization Act had supported tribal governments; Nixon's policy was closer to it than a reversal of it.
        - |
          Nixon built on, rather than reversed, the long-standing federal relationship with tribes.
      answer: 1
      explanation: |
        Continuity and change in federal Indian policy, shaped by Red Power activism such as the occupation of Alcatraz (1969–1971).

    - slug: apush-u08-w30-q12
      type: multiple_choice
      topic_code: "8.12"
      source: "Primary source: Tinker v. Des Moines Independent Community School District, 393 U.S. 503 (1969), Justia"
      points: 1
      stimulus: |
        "It can hardly be argued that either students or teachers shed their constitutional rights to freedom of speech or expression at the schoolhouse gate. ...

        In our system, state-operated schools may not be enclaves of totalitarianism."

        — Justice Abe Fortas, opinion of the Court (7–2), Tinker v. Des Moines Independent Community School District, 1969
      prompt: |
        The case arose when students were suspended for
      options:
        - "organising a sit-in at a segregated lunch counter"
        - "wearing black armbands to school to protest the Vietnam War"
        - "refusing to recite the Pledge of Allegiance during World War II"
        - "distributing religious literature in class"
      option_explanations:
        - |
          Sit-ins were protests against private businesses' segregation, not school discipline cases.
        - |
          Correct. Mary Beth Tinker, her brother John and a friend wore armbands in December 1965; the Court held that silent, non-disruptive protest was protected speech.
        - |
          That describes West Virginia v. Barnette (1943), a wartime case about the Pledge, not Tinker.
        - |
          Tinker concerned political protest, not religious speech.
      answer: 1
      explanation: |
        Making connections (8.12 and 8.8). Youth protest against the war reached high schools, and the Court extended First Amendment protections to students.

    - slug: apush-u08-w30-q13
      type: multiple_choice
      topic_code: "8.15"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best represents a CONTINUITY in American life across Period 8 (1945–1980)?
      options:
        - "The persistence of containment as the organising goal of U.S. foreign policy, from Truman to Carter"
        - "Uninterrupted economic growth with low inflation"
        - "Universal public trust in the federal government"
        - "Legal segregation in the South"
      option_explanations:
        - |
          Correct. Methods changed (aid, alliances, nuclear deterrence, limited war, détente), but every president aimed to contain Soviet power; Carter's response to Afghanistan in 1979–1980 shows it still in force.
        - |
          Growth gave way to stagflation in the 1970s, a major change.
        - |
          Trust in government fell sharply after Vietnam and Watergate.
        - |
          Legal segregation was dismantled between 1954 and 1965, one of the period's great changes.
      answer: 0
      explanation: |
        Continuity and change (8.15). For any period, identify what persisted as well as what changed; a strong thesis does both.

    - slug: apush-u08-w30-q14
      type: multiple_choice
      topic_code: "8.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Vietnam War most directly contributed to which development in American youth culture?
      options:
        - "The growth of the New Left and campus protest movements, and the ratification of the Twenty-sixth Amendment lowering the voting age to 18"
        - "The rise of 1950s suburban conformity"
        - "The baby boom"
        - "The decline of rock music"
      option_explanations:
        - |
          Correct. The draft and the war turned SDS and other campus groups into a mass antiwar movement, and the argument that 18-year-olds could be drafted but not vote led to the 1971 amendment.
        - |
          Suburban conformity belongs to the 1950s, before large-scale U.S. involvement in Vietnam.
        - |
          The baby boom began in 1946, well before the war, and was a cause of the youth culture rather than a result.
        - |
          Rock music flourished in the 1960s, often carrying antiwar themes.
      answer: 0
      explanation: |
        Causation (review of 8.8). Foreign policy shaped domestic culture and even the Constitution.

    - slug: apush-u08-w30-q15
      type: multiple_choice
      topic_code: "8.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which of the following best explains why many white working-class and suburban voters turned against Great Society liberalism by 1968?
      options:
        - "They wanted the federal government to spend more on the War on Poverty"
        - "They believed it had failed to expand Social Security"
        - "Urban riots, rising crime, busing and taxes led many to see liberal programs as rewarding disorder and benefiting others at their expense"
        - "The Great Society had cut Medicare benefits"
      option_explanations:
        - |
          The backlash wanted less, not more, anti-poverty spending.
        - |
          Social Security grew under the Great Society; that was not a grievance.
        - |
          Correct. George Wallace and Richard Nixon both appealed to such voters in 1968 with law-and-order themes; this backlash fed the New Right of the 1970s.
        - |
          Medicare was created in 1965 and remained popular.
      answer: 2
      explanation: |
        Causation (review of 8.9). Link the backlash to specific events and to the realignment that followed.

    - slug: apush-u08-w30-q16
      type: multi_select
      topic_code: "8.11"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were achievements or major actions of the women's movement between 1963 and 1973.
      options:
        - "The inclusion of sex in Title VII of the Civil Rights Act of 1964"
        - "The founding of the National Organization for Women"
        - "Ratification of the Equal Rights Amendment"
        - "Title IX of the Education Amendments of 1972"
        - "The Nineteenth Amendment"
      option_explanations:
        - |
          Correct. The ban on employment discrimination by sex gave women a legal tool, though the EEOC was slow to enforce it until pressed.
        - |
          Correct. NOW (1966) lobbied and litigated for equal opportunity.
        - |
          The ERA passed Congress in 1972 but was never ratified by the required 38 states.
        - |
          Correct. Title IX banned sex discrimination in federally funded education.
        - |
          The Nineteenth Amendment gave women the vote in 1920 (Period 7).
      answer: [0, 1, 3]
      explanation: |
        Periodisation and evidence. The second-wave feminist movement won laws and court rulings but not a constitutional amendment.

    - slug: apush-u08-w30-q17
      type: multi_select
      topic_code: "8.13"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following environmental measures adopted between 1969 and 1973.
      options:
        - "The National Environmental Policy Act"
        - "The creation of the Environmental Protection Agency"
        - "The Clean Water Act"
        - "The Endangered Species Act"
        - "The creation of the National Park Service"
      option_explanations:
        - |
          Correct. Signed on January 1, 1970, it requires environmental impact statements for federal projects.
        - |
          Correct. Nixon created the EPA by executive reorganisation in December 1970.
        - |
          Correct. Passed in 1972 over Nixon's veto, which he based on its cost.
        - |
          Correct. Signed by Nixon in December 1973 to protect threatened species and their habitats.
        - |
          The National Park Service was created in 1916, during the Progressive Era.
      answer: [0, 1, 2, 3]
      explanation: |
        Causation (8.13). Oil spills, a burning river, Silent Spring and Earth Day created a bipartisan consensus for regulation in a few remarkable years.

    - slug: apush-u08-w30-q18
      type: true_false
      topic_code: "8.11"
      source: "general knowledge"
      points: 1
      prompt: |
        The Equal Rights Amendment was ratified by the required three quarters of the states before its deadline and became the Twenty-seventh Amendment.
      answer: false
      explanation: |
        False. Thirty-five states ratified by 1977, three short of the 38 needed, and a campaign led by Phyllis Schlafly helped stop it; the extended deadline passed in 1982. (The actual Twenty-seventh Amendment, ratified in 1992, concerns congressional pay.)

    - slug: apush-u08-w30-q19
      type: true_false
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Soviet invasion of Afghanistan in December 1979 effectively ended the period of détente.
      answer: true
      explanation: |
        True. Carter withdrew the SALT II treaty from Senate consideration, imposed a grain embargo, announced a boycott of the 1980 Moscow Olympics and declared that the United States would defend the Persian Gulf (the Carter Doctrine).

    - slug: apush-u08-w30-q20
      type: fill_blank
      topic_code: "8.11"
      source: "Primary source: Education Amendments of 1972, Title IX (20 U.S.C. 1681), Cornell Legal Information Institute"
      points: 1
      prompt: |
        Title ____ of the Education Amendments of 1972 provides that no person shall, on the basis of sex, be excluded from participation in any education program or activity receiving federal financial assistance.
      answer: ["IX", "9", "nine"]
      explanation: |
        Title IX. Its best-known effect was on athletics: girls' participation in high school sports rose many times over in the following decades.

    - slug: apush-u08-w30-q21
      type: fill_blank
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. In 1978 President Carter brought Egypt's Anwar Sadat and Israel's Menachem Begin together at the presidential retreat to negotiate the ____ Accords, which led to a peace treaty between the two countries.
      answer: ["Camp David", "Camp David Accords"]
      explanation: |
        Camp David. Egypt recognised Israel and Israel returned the Sinai Peninsula. It was Carter's major diplomatic success, soon overshadowed by the Iran hostage crisis.

    - slug: apush-u08-w30-q22
      type: short_answer
      topic_code: "8.14"
      source: "general knowledge"
      points: 3
      stimulus: |
        Source (described): A widely published news photograph from late 1973 shows a long line of cars stretching down a street toward a gas station, with a hand-lettered sign at the pumps announcing that the station has no gas today.
      prompt: |
        Using the source described above, answer (a), (b) and (c).

        (a) Briefly describe the historical situation that produced the scene in the photograph.
        (b) Briefly explain ONE economic effect of the development shown in the photograph in the 1970s.
        (c) Briefly explain ONE political effect of the economic problems of the 1970s.
      answer: |
        (a) In October 1973 Arab oil-producing nations in OPEC imposed an embargo on the United States for supporting Israel in the Yom Kippur War. Oil prices roughly quadrupled and gasoline ran short, producing lines at stations.

        (b) Higher energy prices fed stagflation, a combination of high inflation and high unemployment: prices rose across the economy while industries such as autos struggled, and inflation passed 13% by 1979–1980.

        (c) Economic distress weakened faith in the liberal consensus and helped elect Ronald Reagan in 1980; voters blamed Carter for inflation and gas lines, and the tax revolt shown by California's Proposition 13 in 1978 signalled anger at government.
      explanation: |
        Three points, one per part.

        (a) 1 pt: the 1973 OAPEC/OPEC oil embargo tied to the October 1973 Arab–Israeli war, or dependence on imported oil. Accept the 1979 shock if the student explains it, though the photograph is from 1973.

        (b) 1 pt: stagflation; inflation; rising unemployment; decline of heavy industry and the Rust Belt; the rise of fuel-efficient foreign cars; the 55 mph speed limit and fuel standards (policy effects accepted if tied to the economy).

        (c) 1 pt: loss of confidence in government; Carter's 1979 address and his defeat in 1980; the tax revolt (Proposition 13); the rise of the New Right and Reagan; arguments for deregulation.

        Zero: answers about the 1930s Depression; describing the photograph only; effects with no explanation.

    - slug: apush-u08-w30-q23
      type: short_answer
      topic_code: "8.6"
      source: "general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course): The civil rights movement did not begin with Rosa Parks or end with the Voting Rights Act. Its roots lay in decades of litigation, wartime activism and Black migration, and its most important victories came only when local people organised at great risk to themselves and forced reluctant national leaders to act.
      prompt: |
        Review. Using the interpretation above, answer (a), (b) and (c).

        (a) Briefly describe the author's argument about the civil rights movement.
        (b) Briefly explain how ONE specific development from 1940 to 1960 supports the author's argument.
        (c) Briefly explain how ONE specific development from 1960 to 1968 supports or challenges the author's argument.
      answer: |
        (a) The author argues that the movement had long roots before the 1950s and that local grassroots organising, not national leaders, drove its main successes by pressuring presidents and Congress.

        (b) The NAACP's long legal campaign supports it: from the 1930s Charles Hamilton Houston and Thurgood Marshall attacked segregated graduate schools, laying the foundation for Brown v. Board in 1954, decades before the Montgomery boycott.

        (c) Selma supports it: local activists and SNCC had been organising voter registration in Dallas County for years, and only after troopers attacked marchers on Bloody Sunday did Johnson send a voting rights bill to Congress.
      explanation: |
        Three points, one per part.

        (a) 1 pt: long roots and grassroots pressure on reluctant national leaders. Must state the argument, not the topic.

        (b) 1 pt for a 1940–1960 development, explained as support: the March on Washington Movement and Executive Order 8802; the Double V campaign; the Great Migration; NAACP litigation and Brown; Mendez; Executive Order 9981 after Randolph's pressure; Montgomery's organisation by the Women's Political Council.

        (c) 1 pt for a 1960–1968 development, explained as support or challenge: support from Greensboro, SNCC, the Freedom Rides forcing Kennedy to act, Birmingham prompting the civil rights bill, Freedom Summer, Selma; challenge from Johnson's own initiative and skill in passing the 1964 act, or Supreme Court decisions acting ahead of public opinion.

        Zero: restating the passage; developments outside the dates; no explanation.

    - slug: apush-u08-w30-q24
      type: long_answer
      topic_code: "8.11"
      source: "general knowledge"
      points: 6
      prompt: |
        Long essay. Inspired in part by the African American freedom struggle, many other groups organised in the 1960s and 1970s: women, Mexican Americans, American Indians, Asian Americans and gay and lesbian Americans. Historians have compared their goals and tactics and weighed their achievements against the opposition they met.

        Evaluate the extent to which the movements for rights that followed the African American civil rights movement achieved their goals from 1960 to 1980.
      answer: |
        Thesis: The rights movements of the 1960s and 1970s won significant legal and political gains, especially for women and American Indians, by adapting the strategies of the Black freedom struggle, but their success was partial because the economic downturn and a growing conservative movement blocked broader goals such as the Equal Rights Amendment.

        Context: The civil rights movement's victories in 1964–1965, the youth movement and the expansion of federal power under the Great Society showed what organised pressure and federal law could achieve.

        Body 1 (women): Title VII's sex provision, NOW, Title IX, Roe v. Wade; but the ERA failed after Phyllis Schlafly's STOP ERA campaign.

        Body 2 (Latinos and American Indians): the UFW's grape boycott won contracts in 1970; the East Los Angeles walkouts; the Bilingual Education Act (1968); Alcatraz and Wounded Knee; Nixon's 1970 message and the Self-Determination Act (1975).

        Body 3 (gay Americans and limits): Stonewall (1969) began gay liberation and some cities passed anti-discrimination ordinances, but backlash campaigns in the late 1970s repealed several.

        Complexity: gains were greatest where movements could use existing federal law and bipartisan support, and smallest where they challenged deeply held cultural values, which mobilised the New Right.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (1 pt): a defensible claim about the extent of achievement with a line of reasoning.

        Contextualization (1 pt): the Black freedom struggle as model; the Great Society's expansion of federal power; postwar changes in women's work; termination and relocation; the youth movement and the New Left. Explained, not mentioned.

        Evidence (2 pts): 1 pt for two specific examples; 2 for using them to support the argument. Acceptable: The Feminine Mystique (described); NOW; Title VII; Equal Pay Act (1963); Title IX; Roe v. Wade; ERA and Schlafly; UFW and Chávez, Huerta, Itliong; Chicano walkouts; La Raza Unida; Hernandez v. Texas as precedent; Bilingual Education Act; AIM; Alcatraz; Wounded Knee (1973); Nixon's 1970 message; Indian Self-Determination Act (1975); Stonewall; the Asian American movement; Hart-Celler as background.

        Analysis and reasoning (2 pts): 1 pt for a reasoning process (comparison between movements, or with the Black civil rights movement; causation of successes and failures; continuity and change); 1 pt for complex understanding, such as comparing several movements' outcomes, explaining both achievements and backlash, or distinguishing legal from economic and cultural change.

        Common errors: treating all movements as one; listing groups without evaluating outcomes; quoting copyrighted works (describe them instead); placing Roe or Title IX in the 1960s.

    - slug: apush-u08-w30-q25
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The career of Richard Nixon connects the early and late parts of Period 8 most clearly because he
      options:
        - "served as Eisenhower's secretary of state and negotiated the Korean armistice"
        - "led the Army–McCarthy hearings and later signed the Civil Rights Act of 1964"
        - "rose to national prominence through the anti-Communist Hiss case in 1948 and left office in 1974 because of the Watergate scandal"
        - "wrote the Truman Doctrine and later ended the Vietnam War by declaring victory"
      option_explanations:
        - |
          Nixon was Eisenhower's vice president; John Foster Dulles was secretary of state.
        - |
          Nixon did not lead the Army–McCarthy hearings, and Lyndon Johnson signed the 1964 act.
        - |
          Correct. As a young HUAC member Nixon pursued Alger Hiss, built a reputation as an anti-Communist, became vice president under Eisenhower, and as president pursued détente before resigning over Watergate.
        - |
          The Truman Doctrine was Truman's, drafted by State Department officials; Nixon withdrew from Vietnam under the Paris Accords without declaring victory.
      answer: 2
      explanation: |
        Continuity and change across the period (review of 8.3). Nixon's career runs from the Red Scare to détente and Watergate, a useful thread for a period essay.
