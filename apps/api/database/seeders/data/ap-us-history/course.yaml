# The AP U.S. History course map. Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\Curriculum\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: AP U.S. History
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: AP U.S. History
slug: apush
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full school year of AP United States History, 1491 to the present, one
  week at a time: a study guide, flashcards and a quiz every week, a summary
  and an exam at the end of each of the nine periods, and an exam-prep guide
  and full practice exam in the 2027 format (55 multiple choice, three
  source-based short answers, a document-based question and a long essay)
  before the May exam. Original material written around the College Board
  Course and Exam Description, with primary sources quoted from public-domain
  documents.
  Free to copy, adapt and share under CC BY 4.0, crediting 24 Hour
  Classroom.
teacher: { name: "AP U.S. History Teacher", email: apush@example.com }
student: { name: "AP U.S. History Student", email: apush-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# The exam is Friday 2027-05-07 (College Board AP Central, exam dates);
# weeks 33-34 review, 35 buffer, 36 exam week.
start_date: 2026-08-31
exam_date: 2027-05-07
subject: social-studies
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The 2027 exam format, the DBQ and LEQ rubrics, the historical thinking skills and reasoning processes, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["AP U.S. History Course and Exam Description", public domain]
attribution: |
  Original study material written for this course and organised around the
  College Board AP U.S. History Course and Exam Description. Quoted primary
  sources are in the public domain (U.S. government works, or published
  before 1931), checked against the National Archives, the Library of
  Congress or the Avalon Project at Yale Law School.
# The eight course themes, by their CED codes; guides tag topics with them.
themes:
  NAT: American and National Identity
  WXT: Work, Exchange, and Technology
  GEO: Geography and the Environment
  MIG: Migration and Settlement
  PCE: Politics and Power
  WOR: America in the World
  ARC: American and Regional Culture
  SOC: Social Structures
