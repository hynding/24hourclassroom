  - slug: apush-u09-exam-q45
    type: short_answer
    topic_code: "9.2"
    source: "Secondary interpretation written for this course"
    points: 3
    stimulus: |
      Interpretation (written for this course): "The conservative movement won the argument but not the budget. After 1980 both parties spoke the language of lower taxes, personal responsibility and suspicion of Washington, and a Democratic president declared the era of big government over. Yet Social Security and Medicare grew, the federal debt rose, and Washington took on new tasks. Conservatism changed what Americans expected from government more than it changed what government did."
    prompt: |
      Using the excerpt, answer (a), (b) and (c).

      (a) Briefly describe the author's argument about the conservative movement.
      (b) Briefly explain how ONE specific historical development from 1980 to 2000 not mentioned in the excerpt could be used to support the author's argument.
      (c) Briefly explain how ONE specific historical development from 1980 to 2000 could be used to challenge the author's argument.
    answer: |
      (a) The author argues that conservatism succeeded in changing political ideas and rhetoric across both parties but did not much reduce the actual size or responsibilities of the federal government.

      (b) The Americans with Disabilities Act (1990), signed by the Republican George H. W. Bush, created major new federal civil rights obligations for employers and public facilities, showing that Washington kept taking on new tasks even under conservative leadership.

      (c) The 1996 welfare law ended the federal entitlement to cash assistance (AFDC) and replaced it with time-limited block grants with work requirements, a real change in what government did, not just in rhetoric; tax cuts in 1981 and 1986 also permanently lowered top rates.
    explanation: |
      Three points, one per part.

      (a) 1 pt: accurately describes the claim that conservatism changed expectations and rhetoric more than the size or role of government. Zero for describing only one detail of the excerpt.

      (b) 1 pt: a specific development not in the excerpt, explained as support: the ADA (1990); the 1983 Social Security rescue; the defense buildup; the Clean Air Act Amendments (1990); the Department of Education surviving despite calls to abolish it; Clinton's 1993 tax increase; Clinton's vetoes in the 1995–1996 budget fights. Zero for repeating Social Security, Medicare or the debt without new specifics.

      (c) 1 pt: a specific development explained as a challenge: welfare reform (1996); ERTA (1981) or the Tax Reform Act (1986) cutting top rates; deregulation of airlines, trucking or banking; PATCO and labor's decline; the rightward shift of the Supreme Court. Zero without an explanation of how it challenges the claim.

  - slug: apush-u09-exam-q46
    type: long_answer
    topic_code: "9.7"
    source: "general knowledge"
    points: 6
    prompt: |
      Between 1980 and 2008 the American economy shifted from manufacturing toward services and information, became more connected to the rest of the world, and saw both new prosperity and widening inequality. Historians and economists debate which causes mattered most. In your response you might consider technology, globalization and trade policy, government taxation and regulation, immigration, or the decline of organized labor.

      Evaluate the relative importance of the causes of change in the United States economy from 1980 to 2008.
    answer: |
      Thesis: Technological change was the most important cause of the economy's transformation from 1980 to 2008, because computers, automation and the Internet reshaped nearly every industry; globalization, which technology made possible, was the second, while government policy on taxes, regulation and trade accelerated these trends rather than starting them.

      Context: the postwar boom (1945–1970) rested on unionized mass manufacturing; the 1970s brought stagflation, oil shocks and early deindustrialization, setting the stage for change.

      Body 1 (technology): the IBM PC (1981); the World Wide Web and commercial Internet (1990s); automation in steel and autos; the dot-com boom; growth of high-skill service jobs.

      Body 2 (globalization): container shipping and global supply chains; NAFTA (1994); the WTO (1995) and China's entry (2001); Rust Belt job losses; cheaper consumer goods.

      Body 3 (policy): ERTA 1981 and the Tax Reform Act 1986; deregulation of airlines, trucking and finance (Garn–St Germain 1982, Gramm–Leach–Bliley 1999); PATCO and union decline from 20.1% (1983) to 13.5% (2000); the 2008 financial crisis as a result partly of deregulation and risky lending, debated.

      Complexity: the causes interacted; policy choices of both parties shaped how technology's and trade's gains were distributed, and supporters and critics still weigh them differently.
    explanation: |
      Six points (LEQ rubric).

      Thesis/claim (1 pt): a defensible claim that ranks or weighs causes and establishes a line of reasoning, e.g. technology mattered most, with globalization and policy as accelerants. Zero for listing causes without weighing them.

      Contextualization (1 pt): describes the broader context, such as the postwar manufacturing economy and union strength, the 1970s stagflation and oil shocks, or the 2008 financial crisis and its aftermath, in more than a phrase.

      Evidence (2 pts): 1 pt for two specific examples; 2 pts for using specific evidence to support the argument. Acceptable: IBM PC, Macintosh, the World Wide Web, the dot-com boom and bust; automation; NAFTA; WTO; China's WTO entry; Rust Belt and Sun Belt; ERTA 1981; Tax Reform Act 1986; deregulation (Airline Deregulation Act 1978, Garn–St Germain 1982, Gramm–Leach–Bliley 1999); savings and loan crisis; PATCO; BLS union data; the 1965, 1986 and 1990 immigration laws and immigrant labor; budget surpluses 1998–2001; the Great Recession and TARP.

      Analysis and reasoning (2 pts): 1 pt for causation reasoning that explains why some causes mattered more than others (not just that each was a cause); 1 pt for complex understanding, for example explaining interaction among causes, distinguishing long-term from short-term causes, weighing effects on different groups or regions, or presenting the arguments of supporters and critics of trade and deregulation in their own terms with evidence.

      Zero for analysis: a list of causes with no judgment of relative importance.
