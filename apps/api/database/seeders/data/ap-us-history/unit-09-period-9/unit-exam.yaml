      - |
        Population and immigration grew in Period 9.
    answer: 2
    explanation: |
      Skill: contextualization. Hold all three strands of Period 9 in mind when writing context for any essay on the period.

  - slug: apush-u09-exam-q18
    type: multiple_choice
    topic_code: "9.2"
    source: "general knowledge"
    points: 1
    prompt: |
      The term Reagan Democrats refers to
    options:
      - "Democratic activists who organized the nuclear freeze movement"
      - "Southern Democrats who opposed the Civil Rights Act of 1964 and later became Democratic governors"
      - "white working-class voters, many in the industrial North, who had supported Democrats but voted for Reagan in 1980 and 1984"
      - "Democratic members of Congress who served in Reagan's cabinet"
    option_explanations:
      - |
        Nuclear freeze activists opposed Reagan's defense policies.
      - |
        Southern realignment is related, but the term most often describes Northern blue-collar and ethnic voters.
      - |
        Correct. Drawn by anticommunism, social conservatism, patriotism and frustration with the 1970s economy, these voters gave Reagan his landslides, though many kept voting for Democrats in local races.
      - |
        Reagan's cabinet was Republican; the term refers to voters, not officials.
    answer: 2
    explanation: |
      Skill: contextualization. The New Right's coalition crossed old party lines.

  - slug: apush-u09-exam-q19
    type: multiple_choice
    topic_code: "9.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Reagan's response to the 1981 strike by air traffic controllers (PATCO) is most significant because it
    options:
      - "ended the right of private-sector workers to unionize"
      - "was overturned by the Supreme Court"
      - "led to the nationalization of the airline industry"
      - "signaled a tougher stance toward unions that many private employers followed, contributing to labor's decline"
    option_explanations:
      - |
        Private-sector workers kept their legal right to organize under the Wagner Act.
      - |
        The Supreme Court did not overturn the firings; the dismissals and the union's decertification stood.
      - |
        Airlines had been deregulated in 1978 and remained private; the strikers were federal employees.
      - |
        Correct. Firing more than 11,000 strikers who refused to return and decertifying their union showed that strikers could be permanently replaced; supporters saw the president enforcing a law against federal strikes, while unions saw a blow to bargaining power.
    answer: 3
    explanation: |
      Skill: causation. A single event can mark and accelerate a longer trend.

  - slug: apush-u09-exam-q20
    type: multiple_choice
    topic_code: "9.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Reagan's appointments to the Supreme Court, including Sandra Day O'Connor, Antonin Scalia and Anthony Kennedy, most directly resulted in
    options:
