    topic_code: "3.10"
    source: "general knowledge"
    points: 1
    prompt: |
      Review. The debate over the USA PATRIOT Act most closely parallels which debate in the early republic?
    options:
      - "The debate over the location of the national capital"
      - "The controversy over the Alien and Sedition Acts of 1798, passed during a crisis with France"
      - "The Missouri Compromise debate"
      - "The debate over the Louisiana Purchase"
    option_explanations:
      - |
        The capital's location was a sectional bargain, not a security-versus-liberty debate.
      - |
        Correct. In both cases a government facing a foreign threat expanded its powers over noncitizens and dissent, and critics (Jefferson and Madison's Virginia and Kentucky Resolutions in 1798) argued that liberty was endangered.
