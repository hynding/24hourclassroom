      - "the immediate overturning of Brown v. Board of Education"
      - "a Court composed entirely of former senators"
      - "a Court with a more conservative majority on many issues"
    option_explanations:
      - |
        Judicial review continued; the Court still struck down laws.
      - |
        Brown v. Board of Education (1954) was never overturned by the Reagan-era Court or any later one.
      - |
        None of these justices had been senators.
      - |
        Correct. With William Rehnquist elevated to Chief Justice, the appointments moved the Court rightward, though O'Connor and Kennedy often acted as moderate swing votes.
    answer: 3
    explanation: |
      Skill: causation. Judicial appointments were among the conservative movement's most lasting achievements, and also a reason confirmation fights intensified after the 1987 Bork nomination.

  - slug: apush-u09-exam-q21
    type: multiple_choice
    topic_code: "9.2"
    source: "general knowledge"
    points: 1
    prompt: |
      The Contract with America (1994) is significant primarily because
    options:
      - "it ended the Cold War"
      - "it was a treaty with Canada and Mexico"
      - "it created the Department of Homeland Security"
      - "it helped Republicans win control of both houses of Congress for the first time in four decades"
    option_explanations:
      - |
        The Cold War ended between 1989 and 1991.
      - |
        The trade agreement with Canada and Mexico was NAFTA, not the Contract with America.
      - |
        Homeland Security was created in 2002, after the September 11 attacks.
      - |
        Correct. Led by Newt Gingrich, the platform promised votes on a balanced-budget amendment, welfare reform and tax cuts; Republicans won the House for the first time since the 1952 election, and budget battles with Clinton followed.
    answer: 3
    explanation: |
