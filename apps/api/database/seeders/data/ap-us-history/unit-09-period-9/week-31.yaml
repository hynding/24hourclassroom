    - slug: apush-u09-w31-q11
      type: multiple_choice
      topic_code: "9.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The founding of organizations such as the Moral Majority in 1979 most directly reflected which development?
      options:
        - "The decline of religious participation in the South"
        - "A movement among mainline Protestant churches to support the nuclear freeze"
        - "The political mobilization of evangelical Christians around issues such as abortion, school prayer and the Equal Rights Amendment"
        - "The efforts of Catholic bishops to expand the welfare state"
      option_explanations:
        - |
          Evangelical churches were growing in the South and Sun Belt in this period; the Moral Majority drew on that strength rather than on any decline.
        - |
          Many mainline churches did support the freeze, but the Moral Majority opposed it and aligned with Reagan's defense policies.
        - |
          Correct. Jerry Falwell's Moral Majority and similar groups registered evangelical voters and pushed social issues into national politics, making religious conservatives a key part of the Republican coalition.
        - |
