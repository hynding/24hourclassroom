week: 31
unit: 9
title: "Reagan, Conservatism and the End of the Cold War"
topics: ["9.1", "9.2", "9.3"]
guide: guides/week-31.md
guide_description: |
  How the troubles of the 1970s (stagflation, the energy crisis, Watergate, the Iran hostage crisis) set the stage for
  Period 9; who made up the conservative coalition that elected Ronald Reagan, what it achieved and where it was
  limited; and how the Cold War ended, with the competing explanations historians give. Worked examples: a
  contextualization paragraph for 1980, an SAQ on two interpretations of the Cold War's end answered part by part, and
  a thesis built from an LEQ prompt on conservatism.
flashcards_description: |
  33 cards on the 1970s background, the New Right and Reaganomics, the limits of the conservative agenda, and the
  diplomacy and debates surrounding the end of the Cold War.

flashcards:
  - front: Stagflation of the 1970s → what it was and why it opened the door to Reagan
    back: |
      High inflation and high unemployment at the same time, worsened by the oil shocks of 1973 and 1979. Keynesian tools seemed unable to fix both at once, which discredited the postwar liberal economic consensus and gave an opening to conservatives promising tax cuts, deregulation and tight money.
    topic_code: "9.1"
  - front: Carter's crisis of confidence speech (July 15, 1979) → message and political effect
    back: |
      Jimmy Carter told Americans the nation faced "a crisis of confidence" in its own future and urged sacrifice, especially on energy. Many voters heard it as pessimism (critics nicknamed it the "malaise" speech, a word Carter did not use), and Reagan's 1980 campaign answered it with optimism.
    topic_code: "9.1"
  - front: Iran hostage crisis (November 1979 – January 1981) → political significance
    back: |
      Iranian revolutionaries seized the U.S. embassy in Tehran and held 52 Americans for 444 days; a 1980 rescue mission failed. The crisis made the Carter administration look powerless abroad and fed the 1980 demand for a more assertive foreign policy. The hostages were released minutes after Reagan was sworn in.
    topic_code: "9.1"
  - front: Proposition 13 (California, 1978) → why historians call it the start of a tax revolt
    back: |
      A ballot measure that capped property taxes at 1% of assessed value and made new taxes harder to pass. Its landslide victory showed the power of middle-class anger at taxes and government spending, a theme the national conservative movement rode into 1980.
    topic_code: "9.1"
  - front: Ronald Reagan before 1980 → the career that made him a conservative leader
    back: |
      Film actor and president of the Screen Actors Guild; a New Deal Democrat who turned conservative in the 1950s; national attention for his 1964 televised speech for Barry Goldwater; governor of California 1967–1975. He nearly took the 1976 Republican nomination from Gerald Ford.
    topic_code: "9.2"
  - front: Election of 1980 → result and the coalition behind it
    back: |
      Reagan won 489 electoral votes to Carter's 49, with independent John Anderson taking about 7% of the popular vote; Republicans also won the Senate. The coalition joined economic conservatives, religious conservatives, anticommunist hawks, and many white working-class "Reagan Democrats."
    topic_code: "9.2"
  - front: Moral Majority (1979) → founder and goals
    back: |
      Founded by the Baptist minister Jerry Falwell to mobilize evangelical and fundamentalist Christians in politics. It opposed abortion, the Equal Rights Amendment and gay rights, supported school prayer, and registered voters for conservative candidates. A sign of the religious right's arrival as a political force.
    topic_code: "9.2"
  - front: New Right of the 1970s and 1980s → what was new about it
    back: |
      A conservatism that joined free-market economics and anticommunism to social and religious issues (abortion, school prayer, family values), built its own institutions (think tanks such as the Heritage Foundation, direct-mail fundraising, Christian broadcasting), and drew votes from the South, the Sun Belt and suburbs.
    topic_code: "9.2"
  - front: Which themes? The religious right's entry into presidential politics around 1980
    back: |
      Politics and Power (PCE): new voters and organizations reshaped the Republican coalition. American and Regional Culture (ARC): debates over religion, family and morality moved to the center of national politics, with especially strong support in the South.
    topic_code: "9.2"
  - front: Reaganomics (supply-side economics) → the theory and its critics
    back: |
      Supporters argued that cutting tax rates, especially at the top, and reducing regulation would spur investment, work and growth, so that prosperity would spread to everyone. Critics called it "trickle-down" economics, warned it would widen inequality and deficits, and pointed to cuts in programs for the poor.
    topic_code: "9.2"
  - front: Economic Recovery Tax Act of 1981 → what it did
    back: |
      Reagan's first major law: it cut individual income tax rates by about a quarter over three years and lowered the top rate from 70% to 50%. Passed with the votes of many conservative Southern Democrats ("Boll Weevils") in the Democratic-controlled House.
    topic_code: "9.2"
  - front: Tax Reform Act of 1986 → why it is an example of bipartisan conservatism
    back: |
      A Republican president and a Democratic House agreed to cut the top rate to 28% while closing many loopholes and removing millions of low-income Americans from the income tax rolls. It shows that 1980s tax policy was negotiated, not imposed by one party.
    topic_code: "9.2"
  - front: PATCO strike (1981) → Reagan's response and its significance for labor
    back: |
      When about 13,000 federal air traffic controllers struck illegally, Reagan fired more than 11,000 who refused to return and decertified their union. Supporters saw a president enforcing the law; unions saw a signal that encouraged private employers to take a harder line, part of organized labor's long decline.
    topic_code: "9.2"
  - front: Deregulation, Carter to Reagan → examples
    back: |
      It began under Carter (Airline Deregulation Act of 1978, trucking in 1980) and widened under Reagan, who loosened rules on savings and loan banks (Garn–St Germain Act, 1982), broadcasting and some environmental enforcement. Supporters credited it with lower prices and more competition; critics with risky behavior and weaker protections.
    topic_code: "9.2"
  - front: Savings and loan crisis (late 1980s) → cause and consequence
    back: |
      After deregulation let savings and loan banks make riskier investments while their deposits stayed federally insured, hundreds failed when real estate and other bets went bad. The federal cleanup cost taxpayers more than $100 billion and fed a lasting debate about how much to regulate finance.
    topic_code: "9.2"
  - front: Federal debt under Reagan → what happened and why
    back: |
      Tax cuts plus a large defense buildup, without matching spending cuts, produced the largest peacetime deficits to that point; the gross federal debt nearly tripled during the 1980s. Supporters argued the buildup won the Cold War; critics said the debt burdened future generations.
    topic_code: "9.2"
  - front: Social Security Amendments of 1983 → what they show about the limits of conservatism
    back: |
      A bipartisan commission's plan, signed by Reagan, rescued Social Security by raising payroll taxes, taxing some benefits and gradually raising the retirement age from 65 to 67. The largest New Deal program was reformed and preserved rather than dismantled, a sign of how entrenched popular programs were.
    topic_code: "9.2"
  - front: Sandra Day O'Connor (1981) → significance
    back: |
      Reagan's first Supreme Court appointment and the first woman to serve on the Court. She became a moderate conservative swing vote; with later appointments (William Rehnquist as Chief Justice, Antonin Scalia, Anthony Kennedy) Reagan moved the Court rightward.
    topic_code: "9.2"
  - front: Robert Bork nomination (1987) → why it mattered
    back: |
      The Senate rejected Reagan's Supreme Court nominee 58–42 after hearings over his views on civil rights, privacy and abortion. It marked the beginning of intensely contested confirmation fights; Anthony Kennedy was confirmed instead.
    topic_code: "9.2"
  - front: James Watt and the Sagebrush Rebellion → the 1980s environmental debate
    back: |
      Western ranchers and officials (the Sagebrush Rebellion) wanted federal lands opened to grazing, mining and drilling or turned over to the states. Reagan's Interior Secretary James Watt favored development; environmental groups opposed him and their memberships grew. Both sides claimed to speak for the West.
    topic_code: "9.2"
  - front: Conservatives vs liberals on the Great Society in the 1980s → compare the arguments
    back: |
      Conservatives argued that welfare programs created dependency, high taxes discouraged work, and federal rules intruded on states and families. Liberals argued the programs had reduced poverty among the elderly and poor, and that cuts fell hardest on vulnerable people. Both claimed to defend opportunity.
    topic_code: "9.2"
  - front: Evil empire speech (March 8, 1983) → audience and message
    back: |
      Reagan told the National Association of Evangelicals in Orlando not to treat the superpowers as morally equal or support a nuclear freeze, calling the Soviet Union "an evil empire." It framed the Cold War as a moral struggle and rejected the détente of the 1970s.
    topic_code: "9.3"
  - front: Strategic Defense Initiative (1983) → what it proposed and the debate
    back: |
      Reagan's plan for a system to shoot down incoming ballistic missiles, nicknamed "Star Wars" by critics. Supporters saw a way out of deterrence by mutual destruction and leverage over Moscow; critics doubted it could work, feared it would spur a new arms race, and objected to its cost.
    topic_code: "9.3"
  - front: Reagan Doctrine → definition and examples
    back: |
      Support for anticommunist insurgents fighting Soviet-backed governments rather than merely containing communism: aid to the mujahideen in Afghanistan, the Contras in Nicaragua and rebels in Angola. Supporters called it rolling back Soviet power; critics pointed to human rights abuses and secret wars.
    topic_code: "9.3"
  - front: Boland Amendment (1982, tightened 1984) → what it barred
    back: |
      Limits Congress attached to spending bills that barred U.S. intelligence agencies from using funds to support the Contras fighting Nicaragua's Sandinista government. It reflected congressional caution about Central American involvement after Vietnam, and set up the Iran-Contra affair.
    topic_code: "9.3"
  - front: Iran-Contra affair (revealed 1986) → what happened and the questions it raised
    back: |
      Members of Reagan's National Security Council staff secretly sold arms to Iran, hoping to free hostages in Lebanon, and diverted proceeds to the Contras despite the Boland Amendment. Investigations led to convictions of several officials (some later overturned or pardoned) and renewed debate over executive power and accountability.
    topic_code: "9.3"
  - front: Grenada and Lebanon (October 1983) → compare the two interventions
    back: |
      In Lebanon a truck bomb killed 241 U.S. service members in Beirut, and U.S. forces were withdrawn in early 1984. Days later the U.S. invaded Grenada, ousting a Marxist government quickly with public support. Both show Reagan's preference for limited, short uses of force after Vietnam.
    topic_code: "9.3"
  - front: Mikhail Gorbachev → glasnost and perestroika
    back: |
      Soviet leader from 1985. Glasnost (openness) relaxed censorship; perestroika (restructuring) tried to reform the stagnant command economy. He cut military spending, pulled troops out of Afghanistan and, crucially, did not use force to stop the revolutions of 1989 in Eastern Europe.
    topic_code: "9.3"
  - front: Intermediate-Range Nuclear Forces (INF) Treaty (1987) → why it was a turning point
    back: |
      Signed by Reagan and Gorbachev in Washington in December 1987, it eliminated an entire class of nuclear missiles, with on-site inspections. It showed that the leader who called the USSR an evil empire could negotiate deep arms reductions once Soviet leadership changed.
    topic_code: "9.3"
  - front: Tear down this wall (June 12, 1987) → context of Reagan's Berlin speech
    back: |
      At the Brandenburg Gate in West Berlin, Reagan challenged Gorbachev to prove his reforms were real by opening the Berlin Wall. The line was a rhetorical test of glasnost; the wall actually opened two years later because of East German protests and policy decisions in the East.
    topic_code: "9.3"
  - front: Fall of the Berlin Wall (November 9, 1989) → significance
    back: |
      After mass protests and a flood of East Germans leaving through Hungary, East German authorities opened the border crossings and crowds began tearing down the wall. It symbolized the collapse of communist rule across Eastern Europe in 1989 and led to German reunification in October 1990.
    topic_code: "9.3"
  - front: Dissolution of the Soviet Union (December 1991) → how it happened
    back: |
      After a failed hard-line coup in August 1991, the Soviet republics declared independence; Gorbachev resigned on December 25 and the USSR ceased to exist, replaced by fifteen states. The Cold War's bipolar order ended, leaving the United States the sole superpower.
    topic_code: "9.3"
  - front: Who ended the Cold War? → the two main explanations
    back: |
      One view credits American pressure: Reagan's buildup, SDI and the Reagan Doctrine strained a weak Soviet economy. Another credits forces inside the Soviet bloc: economic stagnation, Gorbachev's choices and popular movements such as Poland's Solidarity. Strong answers weigh both and note Reagan's later diplomacy.
    topic_code: "9.3"

quiz:
  description: |
    25 questions · about 40 minutes · about 70% this week (9.1 to 9.3: the 1970s background, Reagan and the conservative
    movement, the end of the Cold War) and 30% review of the New Deal, the Gilded Age debate over government, the Cold
    War, Vietnam and the 1970s. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long essay are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Set A: Reagan's first inaugural address (9.2, 9.1, 9.2, review 7.10)
    - slug: apush-u09-w31-q01
      type: multiple_choice
      topic_code: "9.2"
      source: "Primary source: Ronald Reagan, Inaugural Address (January 20, 1981), The American Presidency Project (UC Santa Barbara)"
      points: 1
      stimulus: |
        "The economic ills we suffer have come upon us over several decades. ... In this present crisis, government is not the solution to our problem; government is the problem. From time to time we've been tempted to believe that society has become too complex to be managed by self-rule, that government by an elite group is superior to government for, by, and of the people. ...

        It is my intention to curb the size and influence of the Federal establishment and to demand recognition of the distinction between the powers granted to the Federal Government and those reserved to the States or to the people. All of us need to be reminded that the Federal Government did not create the States; the States created the Federal Government."

        — Ronald Reagan, Inaugural Address, January 20, 1981
      prompt: |
        The ideas expressed in the excerpt most directly reflect which of the following developments?
      options:
        - "Growing public support for federal enforcement of civil rights in the South"
        - "The growth of a conservative movement that challenged the expansion of federal power since the 1930s"
        - "The revival of Progressive-era demands for expert regulation of business"
        - "A bipartisan consensus that federal programs should grow to meet new social problems"
      option_explanations:
        - |
          Reagan's appeal to the powers reserved to the states echoes states'-rights language, not a call for stronger federal enforcement of civil rights.
        - |
          Correct. Reagan blamed "several decades" of growing government for the nation's problems and promised to curb the federal establishment, the core argument of the conservative movement that had grown since the 1960s against the New Deal and Great Society state.
        - |
          Progressives trusted experts and regulation; Reagan criticizes government by an elite group and wants a smaller federal role, the opposite of the Progressive impulse.
        - |
          The excerpt rejects, rather than reflects, the idea that federal programs should keep growing; the postwar liberal consensus is precisely what Reagan was arguing against.
      answer: 1
      explanation: |
        Skill: contextualization and claims in sources. Read the excerpt against the long arc of federal growth from the New Deal through the Great Society; the speech is a statement of the conservative counter-argument that won in 1980.

    - slug: apush-u09-w31-q02
      type: multiple_choice
      topic_code: "9.1"
      source: "Primary source: Ronald Reagan, Inaugural Address (January 20, 1981), The American Presidency Project (UC Santa Barbara)"
      points: 1
      stimulus: |
        "The economic ills we suffer have come upon us over several decades. ... In this present crisis, government is not the solution to our problem; government is the problem. From time to time we've been tempted to believe that society has become too complex to be managed by self-rule, that government by an elite group is superior to government for, by, and of the people. ...

        It is my intention to curb the size and influence of the Federal establishment and to demand recognition of the distinction between the powers granted to the Federal Government and those reserved to the States or to the people. All of us need to be reminded that the Federal Government did not create the States; the States created the Federal Government."

        — Ronald Reagan, Inaugural Address, January 20, 1981
      prompt: |
        Which of the following best describes the historical situation in which Reagan referred to a "present crisis"?
      options:
        - "A postwar boom in which low unemployment and stable prices made voters confident in government"
        - "A depression in which a quarter of the workforce was unemployed and banks were failing nationwide"
        - "A wartime emergency in which the federal government rationed goods and controlled wages"
        - "A period of high inflation, high unemployment and energy shocks that weakened faith in established economic policies"
      option_explanations:
        - |
          That describes the 1950s and early 1960s. By 1980 the postwar boom had ended and confidence in government had fallen after Vietnam and Watergate.
        - |
          This describes the Great Depression of the 1930s. Unemployment around 1980 was high but nowhere near Depression levels, and the banking system was not collapsing.
        - |
          Rationing and wage controls belong to the World War II home front (Nixon briefly imposed wage and price controls in 1971, but there was no war mobilization in 1981).
        - |
          Correct. Stagflation, the oil shocks of 1973 and 1979, and inflation above 10 percent in 1979–1980 had undermined the Keynesian policies of the postwar decades, creating the opening Reagan used to argue for smaller government.
      answer: 3
      explanation: |
        Skill: sourcing (historical situation). The "crisis" was stagflation layered on a decade of lost trust; that is the standard contextualization for the start of Period 9.

    - slug: apush-u09-w31-q03
      type: multiple_choice
      topic_code: "9.2"
      source: "Primary source: Ronald Reagan, Inaugural Address (January 20, 1981), The American Presidency Project (UC Santa Barbara)"
      points: 1
      stimulus: |
        "The economic ills we suffer have come upon us over several decades. ... In this present crisis, government is not the solution to our problem; government is the problem. From time to time we've been tempted to believe that society has become too complex to be managed by self-rule, that government by an elite group is superior to government for, by, and of the people. ...

        It is my intention to curb the size and influence of the Federal establishment and to demand recognition of the distinction between the powers granted to the Federal Government and those reserved to the States or to the people. All of us need to be reminded that the Federal Government did not create the States; the States created the Federal Government."

        — Ronald Reagan, Inaugural Address, January 20, 1981
      prompt: |
        Which of the following policies of the Reagan administration was most consistent with the goals expressed in the excerpt?
      options:
        - "The Social Security Amendments of 1983, which raised payroll taxes"
        - "The large increase in defense spending during the early 1980s"
        - "The Immigration Reform and Control Act of 1986, which created new federal penalties for employers"
        - "The Economic Recovery Tax Act of 1981, which cut income tax rates across the board"
      option_explanations:
        - |
          The 1983 amendments preserved and financed the largest federal social program by raising taxes, an example of the limits on the conservative agenda rather than its fulfillment.
        - |
          The defense buildup reflected Reagan's anticommunism, but it enlarged federal spending rather than curbing the federal establishment, so it sits uneasily with the excerpt's goals.
        - |
          IRCA added a new federal enforcement duty (employer sanctions) and a legalization program, so it expanded rather than curbed federal activity.
        - |
          Correct. Cutting tax rates (the top rate fell from 70 to 50 percent) was the central policy expression of the belief that government took too much from the private economy.
      answer: 3
      explanation: |
        Skill: making connections between a source and policy. Note the tension the distractors expose: Reagan cut taxes and some domestic programs but also expanded defense and preserved Social Security, one reason federal spending did not fall.

    - slug: apush-u09-w31-q04
      type: multiple_choice
      topic_code: "7.10"
      source: "Primary source: Ronald Reagan, Inaugural Address (January 20, 1981), The American Presidency Project (UC Santa Barbara)"
      points: 1
      stimulus: |
        "The economic ills we suffer have come upon us over several decades. ... In this present crisis, government is not the solution to our problem; government is the problem. From time to time we've been tempted to believe that society has become too complex to be managed by self-rule, that government by an elite group is superior to government for, by, and of the people. ...

        It is my intention to curb the size and influence of the Federal establishment and to demand recognition of the distinction between the powers granted to the Federal Government and those reserved to the States or to the people. All of us need to be reminded that the Federal Government did not create the States; the States created the Federal Government."

        — Ronald Reagan, Inaugural Address, January 20, 1981
      prompt: |
        Review. The argument in the excerpt most directly challenged a principle that became widely accepted during which earlier period?
      options:
        - "The Gilded Age, when courts struck down many state regulations of business"
        - "The New Deal, when the federal government took on responsibility for economic security and recovery"
        - "Reconstruction, when the federal government enforced new civil rights amendments in the South"
        - "The Era of Good Feelings, when a single party dominated national politics"
      option_explanations:
        - |
          Gilded Age courts and politicians largely favored limited government and laissez-faire, so Reagan's argument resembles that era's dominant view rather than challenging it.
        - |
          Correct. The New Deal established that Washington should manage the economy and provide a safety net (Social Security, labor protections, public works). Reagan's claim that government is the problem attacked that principle directly.
        - |
          Reconstruction did expand federal power over the states, but the principle Reagan attacked (federal management of the economy) is a New Deal legacy, and his "several decades" points to the twentieth century.
        - |
          The Era of Good Feelings concerned party politics, not the scope of federal economic responsibility.
      answer: 1
      explanation: |
        Skill: continuity and change over time. Period 9's conservative movement is best understood as a reaction to the New Deal order built in Period 7 and expanded in Period 8.

    # ---- Set B: the evil empire speech (9.3, 9.3, review 8.2)
    - slug: apush-u09-w31-q05
      type: multiple_choice
      topic_code: "9.3"
      source: "Primary source: Ronald Reagan, Remarks at the Annual Convention of the National Association of Evangelicals, Orlando, Florida (March 8, 1983), The American Presidency Project (UC Santa Barbara)"
      points: 1
      stimulus: |
        "So, in your discussions of the nuclear freeze proposals, I urge you to beware the temptation of pride—the temptation of blithely declaring yourselves above it all and label both sides equally at fault, to ignore the facts of history and the aggressive impulses of an evil empire, to simply call the arms race a giant misunderstanding and thereby remove yourself from the struggle between right and wrong and good and evil. ...

        I believe that communism is another sad, bizarre chapter in human history whose last pages even now are being written."

        — Ronald Reagan, remarks to the National Association of Evangelicals, Orlando, Florida, March 8, 1983
      prompt: |
        Reagan's purpose in addressing this audience was most likely to
      options:
        - "announce a new arms-control treaty with the Soviet Union"
        - "persuade religious leaders not to endorse a freeze on nuclear weapons that would treat the two superpowers as equally to blame"
        - "urge Congress to cut defense spending in favor of domestic programs"
        - "ask churches to resettle refugees from Eastern Europe"
      option_explanations:
        - |
          No treaty is mentioned; the INF Treaty came four years later, after Gorbachev took power. In 1983 Reagan was resisting, not announcing, arms limits on Soviet terms.
        - |
          Correct. The nuclear freeze movement had strong support in many churches in 1982–1983. Speaking to evangelicals, Reagan framed the Cold War as a moral struggle so that religious voters would reject a freeze that, in his view, equated the U.S. with the USSR.
        - |
          The excerpt is addressed to a religious convention, not Congress, and Reagan was seeking higher, not lower, defense spending.
        - |
          Refugee resettlement does not appear in the excerpt; the subject is the nuclear freeze and the moral character of the Soviet state.
      answer: 1
      explanation: |
        Skill: sourcing (purpose and audience). Matching the audience (evangelical leaders) to the issue (a freeze resolution debated in churches) reveals the purpose.

    - slug: apush-u09-w31-q06
      type: multiple_choice
      topic_code: "9.3"
      source: "Primary source: Ronald Reagan, Remarks at the Annual Convention of the National Association of Evangelicals, Orlando, Florida (March 8, 1983), The American Presidency Project (UC Santa Barbara)"
      points: 1
      stimulus: |
        "So, in your discussions of the nuclear freeze proposals, I urge you to beware the temptation of pride—the temptation of blithely declaring yourselves above it all and label both sides equally at fault, to ignore the facts of history and the aggressive impulses of an evil empire, to simply call the arms race a giant misunderstanding and thereby remove yourself from the struggle between right and wrong and good and evil. ...

        I believe that communism is another sad, bizarre chapter in human history whose last pages even now are being written."

        — Ronald Reagan, remarks to the National Association of Evangelicals, Orlando, Florida, March 8, 1983
      prompt: |
        Which of the following policies in Reagan's first term most directly reflected the view of the Soviet Union expressed in the excerpt?
      options:
        - "A major military buildup and the proposal of a space-based missile defense system"
        - "Withdrawing U.S. troops from Western Europe"
        - "Recognizing the Soviet-backed government of Afghanistan"
        - "Lifting the grain embargo that Carter had imposed on the Soviet Union"
      option_explanations:
        - |
          Correct. Treating the USSR as an aggressive "evil empire" led to large increases in defense spending and, two weeks after this speech, the Strategic Defense Initiative (March 23, 1983).
        - |
          Reagan deployed new intermediate-range missiles to Western Europe in 1983 rather than withdrawing forces.
        - |
          The Reagan administration aided the Afghan mujahideen fighting the Soviet-backed government, the opposite of recognition.
        - |
          Reagan did lift the grain embargo in 1981, largely to help American farmers; it was a domestic political decision that cut against, rather than expressed, his hard line toward Moscow.
      answer: 0
      explanation: |
        Skill: making connections between rhetoric and policy. The early Reagan years paired moral rhetoric with rearmament and the Reagan Doctrine.

    - slug: apush-u09-w31-q07
      type: multiple_choice
      topic_code: "8.2"
      source: "Primary source: Ronald Reagan, Remarks at the Annual Convention of the National Association of Evangelicals, Orlando, Florida (March 8, 1983), The American Presidency Project (UC Santa Barbara)"
      points: 1
      stimulus: |
        "So, in your discussions of the nuclear freeze proposals, I urge you to beware the temptation of pride—the temptation of blithely declaring yourselves above it all and label both sides equally at fault, to ignore the facts of history and the aggressive impulses of an evil empire, to simply call the arms race a giant misunderstanding and thereby remove yourself from the struggle between right and wrong and good and evil. ...

        I believe that communism is another sad, bizarre chapter in human history whose last pages even now are being written."

        — Ronald Reagan, remarks to the National Association of Evangelicals, Orlando, Florida, March 8, 1983
      prompt: |
        Review. The approach to the Soviet Union in the excerpt most directly departed from which policy of the 1970s?
      options:
        - "Massive retaliation, which threatened nuclear response to any Soviet aggression"
        - "Rollback, which aimed to liberate Eastern Europe by force"
        - "The Truman Doctrine, which pledged aid to nations resisting communist pressure"
        - "Détente, which sought to ease tensions through arms-control agreements, trade and summit diplomacy"
      option_explanations:
        - |
          Massive retaliation was Eisenhower's 1950s doctrine, and its confrontational stance is closer to Reagan's than a departure from it.
        - |
          Rollback was a 1950s Republican slogan never put into practice by force; the 1970s policy Reagan rejected was détente.
        - |
          The Truman Doctrine (1947) is the origin of containment, and Reagan built on it rather than departing from it; it is also not a 1970s policy.
        - |
          Correct. Under Nixon, Ford and (at first) Carter, détente produced SALT I, the 1972 Moscow summit and expanded trade; Reagan's moral language rejected the idea that the superpowers were merely rivals to be managed.
      answer: 3
      explanation: |
        Skill: continuity and change. Reagan's first term marks a change from détente; his second term, with the INF Treaty, returned to negotiation on new terms.

    # ---- Set C: the elections of 1980 and 1984 (9.2, review 8.14, 9.2)
    - slug: apush-u09-w31-q08
      type: multiple_choice
      topic_code: "9.2"
      source: "National Archives, Electoral College Historical Election Results (1980, 1984)"
      points: 1
      stimulus: |
        Presidential election results, 1980 and 1984 (popular vote rounded to the nearest tenth of a percent)

        | Year | Candidate (party) | Popular vote | Electoral votes | States carried |
        |---|---|---|---|---|
        | 1980 | Ronald Reagan (Republican) | 50.7% | 489 | 44 |
        | 1980 | Jimmy Carter (Democrat) | 41.0% | 49 | 6 and D.C. |
        | 1980 | John Anderson (Independent) | 6.6% | 0 | 0 |
        | 1984 | Ronald Reagan (Republican) | 58.8% | 525 | 49 |
        | 1984 | Walter Mondale (Democrat) | 40.6% | 13 | 1 (Minnesota) and D.C. |

        Source: National Archives, Electoral College results; Federal Election Commission
      prompt: |
        The data in the table best support which of the following conclusions?
      options:
        - "Third-party candidates decided the outcome of both elections."
        - "Reagan built a broad coalition that extended well beyond the Republican Party's traditional voters."
        - "Reagan's support was concentrated almost entirely in the Northeast."
        - "Voters in 1984 rejected the policies of Reagan's first term."
      option_explanations:
        - |
          Anderson won no electoral votes in 1980, and Reagan's 1980 popular margin over Carter (almost ten points) exceeded Anderson's share; there was no significant third party in 1984.
        - |
          Correct. Winning 49 states in 1984 required votes from many Democrats and independents, including the white working-class voters called Reagan Democrats, alongside traditional Republicans and newly mobilized religious conservatives.
        - |
          Carrying 44 and then 49 states cannot be a regional pattern; Reagan won in every region, including the formerly Democratic South.
        - |
          Reagan's vote share rose from about 51 to about 59 percent, an endorsement rather than a rejection.
      answer: 1
      explanation: |
        Skill: analyzing quantitative data and making claims. A landslide of this size means the coalition crossed party lines.

