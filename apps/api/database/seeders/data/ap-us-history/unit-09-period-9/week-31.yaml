    - slug: apush-u09-w31-q18
      type: multi_select
      topic_code: "9.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Historians debate why the Cold War ended. Select ALL of the factors that historians commonly cite as contributing to its end.
      options:
        - "The U.S. military buildup of the 1980s, which increased pressure on the Soviet economy"
        - "Mikhail Gorbachev's reforms and his decision not to use force against the revolutions of 1989"
        - "Long-term stagnation of the Soviet command economy and the costs of the war in Afghanistan"
        - "Popular movements in Eastern Europe such as Poland's Solidarity trade union"
        - "A U.S. invasion of East Germany in 1989"
        - "A Soviet military victory in Afghanistan that exhausted its army"
      option_explanations:
        - |
