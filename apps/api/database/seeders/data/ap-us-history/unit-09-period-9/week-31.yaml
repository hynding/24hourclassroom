    - slug: apush-u09-w31-q23
      type: short_answer
      topic_code: "9.3"
      source: "Secondary interpretations written for this course"
      points: 3
      stimulus: |
        Interpretation A (written for this course; a view associated with historians who emphasize American policy): "The Soviet collapse was above all the result of sustained American pressure. The military buildup of the 1980s, the Strategic Defense Initiative and aid to anticommunist fighters in Afghanistan forced a stagnant Soviet economy into a competition it could not afford. Moscow's leaders chose reform because they had run out of alternatives."

        Interpretation B (written for this course; a view associated with historians who emphasize forces inside the Soviet bloc): "The Cold War ended chiefly because of choices made in the East. Mikhail Gorbachev decided to open Soviet society, cut military spending and refuse to use force against the revolutions of 1989. The people of Eastern Europe, from Poland's Solidarity union to the crowds in Berlin, brought down their own governments."
      prompt: |
        Using the two interpretations above, answer (a), (b) and (c).

        (a) Briefly describe ONE major difference between Interpretation A and Interpretation B.
        (b) Briefly explain how ONE specific historical event or development from 1980 to 1991 that is not explicitly mentioned in the excerpts could be used to support Interpretation A.
        (c) Briefly explain how ONE specific historical event or development from 1980 to 1991 that is not explicitly mentioned in the excerpts could be used to support Interpretation B.
      answer: |
        (a) Interpretation A argues that the decisive cause was external: American pressure made the Soviet system unaffordable. Interpretation B argues that the decisive causes were internal to the Soviet bloc: Gorbachev's choices and popular movements in Eastern Europe.

        (b) The Reagan Doctrine's aid to the Afghan mujahideen, including Stinger missiles from 1986, raised the cost of the Soviet war in Afghanistan; Gorbachev withdrew Soviet forces in 1989, which supports A's claim that U.S. pressure strained Soviet resources.

        (c) In 1989 Gorbachev allowed Hungary to open its border with Austria and did not send troops when the East German government collapsed, unlike the Soviet invasions of Hungary (1956) and Czechoslovakia (1968). The peaceful end of communist rule depended on that Soviet choice, which supports B.
      explanation: |
        Three points, one per part.

        (a) 1 pt: identifies a real difference: external U.S. pressure (A) versus internal Soviet and Eastern European causes (B); or Reagan's policies as decisive versus Gorbachev and ordinary people as decisive. Zero for summarizing only one interpretation.

        (b) 1 pt: a specific development not named in A, with an explanation of how it supports A. Acceptable: the Reagan Doctrine in Nicaragua or Angola; Stinger missiles to the mujahideen; deployment of Pershing II missiles in Western Europe (1983); the Reykjavik summit (1986), where Reagan's refusal to give up SDI is said to have pressed Gorbachev; falling oil prices in the mid-1980s cutting Soviet revenue (if linked to pressure). Zero for repeating SDI, the buildup or Afghanistan aid without new specifics.

        (c) 1 pt: a specific development not named in B, explained. Acceptable: glasnost and perestroika in detail; the Soviet withdrawal from Afghanistan (1988–1989) as Gorbachev's choice; Poland's 1989 Round Table and elections; Hungary opening its border; the Baltic independence movements; the failed August 1991 coup. Zero for restating Solidarity or Berlin without additional specifics.

    - slug: apush-u09-w31-q24
      type: short_answer
      topic_code: "8.14"
      source: "Primary source: Jimmy Carter, Address to the Nation on Energy and National Goals (July 15, 1979), Miller Center, University of Virginia"
      points: 3
      stimulus: |
        "It is a crisis of confidence. It is a crisis that strikes at the very heart and soul and spirit of our national will. We can see this crisis in the growing doubt about the meaning of our own lives and in the loss of a unity of purpose for our Nation. ...

        In a nation that was proud of hard work, strong families, close-knit communities, and our faith in God, too many of us now tend to worship self-indulgence and consumption. Human identity is no longer defined by what one does, but by what one owns."

        — President Jimmy Carter, televised address, July 15, 1979
      prompt: |
        Review. Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe ONE historical development of the 1970s that contributed to the "crisis of confidence" Carter described.
        (b) Briefly explain ONE way Ronald Reagan's 1980 campaign offered a different response to the nation's problems than the one in the excerpt.
        (c) Briefly explain ONE way a development of 1979–1980 other than this speech contributed to Carter's defeat in the 1980 election.
      answer: |
        (a) Stagflation: the oil shocks of 1973 and 1979 drove inflation into double digits while unemployment stayed high, and gasoline lines in 1979 made the energy crisis felt daily.

        (b) Carter asked Americans to accept limits and sacrifice and located the problem partly in the people's own values; Reagan answered with optimism, arguing that the problem was government itself and that tax cuts and deregulation would restore growth.

        (c) The Iran hostage crisis, beginning in November 1979, and the failed rescue mission of April 1980 made the administration appear unable to protect Americans abroad, which strengthened Reagan's argument for a more assertive foreign policy.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a specific 1970s development linked to lost confidence: stagflation; the 1973 OPEC embargo or the 1979 oil shock; Vietnam's outcome; Watergate and Nixon's resignation; deindustrialization. Zero for a development after 1979 or with no link to confidence.

        (b) 1 pt: a contrast explained, e.g. optimism versus Carter's call for sacrifice; government as the cause rather than national character; tax cuts and deregulation versus conservation and energy limits; a harder line on the Soviet Union. Zero for describing Reagan's program without contrasting it to the excerpt.

        (c) 1 pt: a 1979–1980 development explained: the Iran hostage crisis or failed rescue mission; the Soviet invasion of Afghanistan and Carter's grain embargo and Olympic boycott; inflation above 13 percent in 1980; Ted Kennedy's primary challenge dividing Democrats. Zero for the speech itself or for events after the election.

    - slug: apush-u09-w31-q25
      type: long_answer
      topic_code: "9.2"
      source: "general knowledge"
      points: 6
      prompt: |
        In the 1980s and 1990s a conservative movement won the presidency and, from 1995, both houses of Congress, promising to reduce taxes, regulation and the size of government and to restore traditional values. Historians disagree about how far it changed the federal government's role. In your response you might consider taxation and spending, regulation, social programs, the federal courts, or national defense.

        Evaluate the extent to which the conservative movement changed the role of the federal government in American life from 1980 to 2000.
      answer: |
        Thesis: From 1980 to 2000 the conservative movement changed the direction of debate, lowering tax rates, loosening regulation and reshaping the courts and welfare, but it did not reduce the overall size of the federal government, because popular programs such as Social Security and Medicare proved too entrenched and defense spending rose.

        Context: the New Deal and Great Society had built an activist federal state; stagflation, Vietnam and Watergate eroded trust in it, and a New Right of economic, religious and anticommunist conservatives organized against it.

        Body 1 (change): ERTA 1981 cut the top rate from 70 to 50 percent and the 1986 act to 28 percent; deregulation of airlines, trucking and banking; O'Connor, Scalia and Kennedy moved the Court right; the 1996 welfare law ended the AFDC entitlement.

        Body 2 (continuity): the 1983 Social Security reform preserved the system; Medicare grew; the debt nearly tripled under Reagan; a Democratic House and later Clinton bargained over every budget; the ADA (1990) expanded federal civil rights protection under a Republican president.

        Complexity: conservatism succeeded more in changing assumptions than spending; Clinton's statement that the era of big government was over shows Democrats adapting to it, while his defense of Medicare and education shows the limits.
      explanation: |
        Six points (LEQ rubric).

        Thesis/claim (1 pt): a historically defensible claim that establishes a line of reasoning about the extent of change, in the introduction or conclusion. Example: conservatism changed tax policy and the courts but left the core of the welfare state intact. Zero for restating the prompt or "it changed a lot."

        Contextualization (1 pt): describes the broader context before, during or after 1980–2000, for example the New Deal and Great Society state; stagflation and 1970s distrust after Vietnam and Watergate; the rise of the New Right since Goldwater. Must be more than a phrase.

        Evidence (2 pts): 1 pt for two specific, relevant examples; 2 pts for using specific evidence to support the argument. Acceptable: ERTA 1981; Tax Reform Act 1986; PATCO; deregulation (airlines, trucking, Garn–St Germain); the savings and loan crisis; Social Security Amendments 1983; the defense buildup and deficits; O'Connor, Scalia, Kennedy, the Bork fight; the Contract with America (1994); the 1996 welfare law (PRWORA, TANF); the Americans with Disabilities Act (1990); Clinton's 1993 tax increase and balanced budgets of 1998–2001.

        Analysis and reasoning (2 pts): 1 pt for using continuity and change (or causation) to frame the argument, explaining what changed and what persisted; 1 pt for complex understanding, for example weighing change against continuity, explaining why some programs survived (their popularity among the middle class), comparing with the New Deal's reshaping of government, or considering the perspectives of both supporters and critics in their own terms.

        Zero for analysis: a list of events with no judgment of extent.
