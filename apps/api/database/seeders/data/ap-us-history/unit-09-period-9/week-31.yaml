      answer: 2
      explanation: |
        Skill: causation and contextualization. The religious right was a reaction to the social changes of the 1960s and 1970s, including Roe v. Wade (1973) and the ERA campaign.

    - slug: apush-u09-w31-q12
      type: multiple_choice
      topic_code: "9.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The Iran-Contra affair, revealed in 1986, raised which of the following constitutional questions?
      options:
        - "Whether the president needed Senate approval to appoint a national security adviser"
        - "Whether states could nullify federal foreign-policy decisions"
        - "Whether executive-branch officials could carry out a foreign policy that Congress had prohibited through its power of the purse"
        - "Whether the Supreme Court could review treaties signed by the president"
      option_explanations:
        - |
          The national security adviser does not require Senate confirmation, and that question was not at issue in the affair.
        - |
          No state attempted to nullify anything; the conflict was between the executive and Congress.
        - |
          Correct. Officials on the National Security Council staff sold arms to Iran and diverted proceeds to the Nicaraguan Contras despite the Boland Amendment's ban on such aid, raising questions of accountability and separation of powers.
        - |
          No treaty was involved; the arms sales and Contra aid were covert operations.
      answer: 2
      explanation: |
        Skill: making connections. Compare with Watergate (8.14) and the War Powers Resolution: post-Vietnam Congress tried to restrain executive power in foreign affairs, and Iran-Contra tested those limits.

    - slug: apush-u09-w31-q13
      type: multiple_choice
      topic_code: "8.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The War Powers Resolution (1973), which Reagan-era officials considered when deploying troops to Lebanon and Grenada, was passed primarily in response to
      options:
        - "the U.S. experience in the Vietnam War, when presidents committed large forces without a declaration of war"
        - "the Korean War armistice, which left U.S. troops in South Korea"
        - "the Cuban Missile Crisis, when Kennedy blockaded Cuba without consulting Congress"
        - "the Iran hostage crisis, when Carter launched a failed rescue mission"
      option_explanations:
        - |
          Correct. After the Gulf of Tonkin Resolution allowed a vast undeclared war, Congress passed the War Powers Resolution over Nixon's veto to require notice within 48 hours and limit deployments without congressional approval to 60 days (plus a 30-day withdrawal period).
        - |
          The Korean War was also undeclared, but the 1973 law was a direct response to Vietnam, which was still under way when it passed.
        - |
          The Cuban Missile Crisis did not involve a prolonged deployment of combat troops, and it was not the trigger for the 1973 law.
        - |
          The hostage crisis began in 1979, six years after the War Powers Resolution was passed.
      answer: 0
      explanation: |
        Skill: causation. Vietnam's legacy shaped how Reagan used force: short, limited operations (Grenada) and proxy support (the Reagan Doctrine) rather than large ground wars.

    - slug: apush-u09-w31-q14
      type: multiple_choice
      topic_code: "6.12"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Supporters of 1980s tax cuts and deregulation made an argument most similar to which earlier position?
      options:
        - "Populists of the 1890s, who demanded government ownership of the railroads"
        - "Progressives, who argued that expert commissions should regulate big business"
        - "Defenders of laissez-faire in the Gilded Age, who argued that government interference with business hindered growth"
        - "New Dealers, who argued that government spending could restore demand during a depression"
      option_explanations:
        - |
          Populists wanted more government intervention in the economy (railroad ownership, a graduated income tax), the opposite of deregulation.
        - |
          Progressives built the regulatory state that 1980s deregulators sought to trim.
        - |
          Correct. Like Gilded Age advocates of laissez-faire, 1980s conservatives held that markets left largely alone produce the most growth. Unlike them, they accepted a permanent federal safety net such as Social Security.
        - |
          Keynesian demand management was the policy supply-siders rejected; they emphasized incentives to produce rather than government spending.
      answer: 2
      explanation: |
        Skill: comparison across periods. Note the similarity and the difference; the difference (acceptance of the safety net) is what earns the complexity point in an essay.

    - slug: apush-u09-w31-q15
      type: multiple_choice
      topic_code: "9.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The Intermediate-Range Nuclear Forces (INF) Treaty of 1987 was significant because it
      options:
        - "was the first agreement to eliminate an entire category of nuclear weapons, with on-site inspections"
        - "ended the Korean War"
        - "froze the number of nuclear weapons at their 1972 levels"
        - "dissolved the Warsaw Pact"
      option_explanations:
        - |
          Correct. Reagan and Gorbachev agreed to destroy all ground-launched missiles with ranges of about 500 to 5,500 km, verified by inspectors, a far deeper step than earlier treaties that only capped growth.
        - |
          The Korean War ended in an armistice in 1953 and has nothing to do with the INF Treaty.
        - |
          Capping (not eliminating) weapons describes SALT I in 1972, a détente-era agreement.
        - |
          The Warsaw Pact dissolved in 1991 after the revolutions of 1989, not through the INF Treaty.
      answer: 0
      explanation: |
        Skill: comparison and continuity. The INF Treaty shows Reagan's shift from confrontation to negotiation once Gorbachev's reforms began.

