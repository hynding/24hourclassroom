    - slug: apush-u09-w32-q23
      type: short_answer
      topic_code: "9.4"
      source: "Bureau of Labor Statistics, Union Members in 2000, news release (January 18, 2001)"
      points: 3
      stimulus: |
        Union membership in the United States (share of wage and salary workers who were union members)

        | Group | Rate |
        |---|---|
        | All workers, 1983 (first year of comparable data) | 20.1% |
        | All workers, 2000 | 13.5% |
        | Government workers, 2000 | 37.5% |
        | Private-sector workers, 2000 | 9.0% |

        Source: U.S. Department of Labor, Bureau of Labor Statistics, Union Members in 2000 (news release, January 18, 2001)
      prompt: |
        Using the table, answer (a), (b) and (c).

        (a) Briefly describe ONE pattern shown in the table.
        (b) Briefly explain ONE economic development from 1980 to 2000 that contributed to the pattern you described in (a).
        (c) Briefly explain ONE political or legal development from 1980 to 2000 that contributed to the decline of organized labor.
      answer: |
        (a) Union membership fell by about a third, from 20.1 percent of workers in 1983 to 13.5 percent in 2000, and by 2000 it was concentrated in government jobs (37.5 percent) while only 9 percent of private-sector workers were union members.

        (b) Deindustrialization: unionized manufacturing jobs in steel and autos were lost to automation, foreign competition and plant relocations to the Sun Belt and abroad, while the growing service sector (retail, restaurants, technology) had few unions.

        (c) President Reagan's firing of more than 11,000 striking air traffic controllers in 1981 and the decertification of their union (PATCO) signaled that striking workers could be replaced, and many employers took a harder line against unions afterward.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an accurate pattern with data: overall decline from 20.1 to 13.5 percent; the gap between government (37.5) and private (9.0) workers. Zero for misreading the numbers (for example, saying most workers were unionized).

        (b) 1 pt: an economic development explained as a cause: deindustrialization; automation; globalization and imports; NAFTA (if linked to manufacturing jobs); growth of service and technology industries with low unionization; movement of jobs to Sun Belt states with right-to-work laws. Zero for naming a development without linking it to union decline.

        (c) 1 pt: a political or legal development explained: PATCO (1981); appointments to the National Labor Relations Board seen as friendlier to employers; right-to-work laws in Sun Belt states; the failure of labor-backed legislation in Congress; free-trade agreements opposed by unions. Accept a balanced framing (supporters saw these as protecting flexibility and the public; unions saw them as weakening bargaining). Zero for developments before 1980 unless linked to the period.

    - slug: apush-u09-w32-q24
      type: short_answer
      topic_code: "9.7"
      source: "Secondary interpretation written for this course"
      points: 3
      stimulus: |
        Interpretation (written for this course): "The forces that most changed American life between 1980 and 2008 did not originate in Washington. Personal computers, the Internet and container shipping knit the national economy into a global one. Presidents of both parties signed trade agreements and deregulated industries, but they were mostly accelerating changes already under way. The results were cheaper goods and new industries for many Americans, and lost jobs and shrinking towns for others."
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the argument the author makes about the causes of change from 1980 to 2008.
        (b) Briefly explain how ONE specific historical development from the period could be used to support the author's argument.
        (c) Briefly explain how ONE specific historical development from the period could be used to challenge the author's argument.
      answer: |
        (a) The author argues that technology and global economic integration, not government decisions, were the main causes of change; policy mostly sped up trends already under way.

        (b) The spread of the Internet in the 1990s, building on a Defense Department research network but driven by private companies such as online retailers and software firms, transformed work and commerce largely through private innovation.

        (c) Government policy also caused major change: NAFTA (1994) and China's entry into the World Trade Organization (2001), which the U.S. supported, were political decisions that exposed manufacturing to new competition; and the federal response to the 2008 financial crisis (TARP) shows how much Washington could shape the economy.
      explanation: |
        Three points, one per part.

        (a) 1 pt: accurately describes the claim that technological and global forces, rather than government policy, were the main causes, with policy as an accelerant. Zero for describing only the effects in the last sentence.

        (b) 1 pt: a specific development explained as support: personal computers (IBM PC 1981, Macintosh 1984); the World Wide Web and the dot-com boom; automation in manufacturing; container shipping and global supply chains; offshoring of production. Zero without an explanation of how it supports the argument.

        (c) 1 pt: a specific development explained as a challenge: NAFTA; the WTO and permanent normal trade relations with China (2000); Reagan's tax cuts and deregulation; the Gramm–Leach–Bliley Act (1999); the Internet's origins in federal research funding; TARP and the response to the 2008 crisis; immigration laws of 1965, 1986 and 1990. Zero without explaining how it challenges the claim.

    - slug: apush-u09-w32-q25
      type: long_answer
      topic_code: "9.6"
      source: "general knowledge"
      points: 6
      prompt: |
        The collapse of the Soviet Union in 1991 removed the rival that had organized American foreign policy for more than forty years. In the years that followed, the United States fought wars in the Persian Gulf, intervened in the Balkans, and after September 11, 2001, fought in Afghanistan and Iraq. In your response you might consider goals, the use of military force, alliances and international institutions, or debates at home.

        Evaluate the extent to which the end of the Cold War changed the goals of U.S. foreign policy from 1989 to 2008.
      answer: |
        Thesis: The end of the Cold War changed the main threat U.S. policy addressed, from Soviet communism to regional aggression and then terrorism, but the underlying goals of preserving American security, promoting democracy and open markets, and leading alliances continued, as did domestic debates over when to use force.

        Context: containment (Truman Doctrine, NATO, Korea, Vietnam) had organized U.S. policy since 1947; Reagan's buildup and Gorbachev's reforms ended it, leaving the U.S. the sole superpower.

        Body 1 (change): the Gulf War (1991) used a UN coalition including former Soviet cooperation against a regional aggressor; humanitarian interventions in Somalia, Bosnia and Kosovo had no Cold War rationale; after 9/11 the war on terrorism targeted non-state networks and, in Iraq, preventive war.

        Body 2 (continuity): NATO survived and expanded eastward; Clinton promoted free trade (NAFTA, WTO) as Cold War presidents had promoted open markets; democracy promotion continued in Bush's justification for Iraq; debates over executive power and intervention echoed Vietnam.

        Complexity: the goals stayed constant while the means and enemies changed; supporters of the Iraq War saw it as defending security, critics as overreach; both argued in terms of long-standing American aims.
      explanation: |
        Six points (LEQ rubric).

        Thesis/claim (1 pt): a defensible claim about the extent of change in goals that sets up a line of reasoning, for example that enemies and methods changed while core goals continued. Zero for restating the prompt.

        Contextualization (1 pt): describes the Cold War framework before 1989 (containment, the arms race, proxy wars, Reagan and Gorbachev) or the post-2008 context, in more than a phrase.

        Evidence (2 pts): 1 pt for two specific examples; 2 pts for using specific evidence to support the argument. Acceptable: the fall of the Berlin Wall; the dissolution of the USSR; Bush's new world order speech; the Gulf War; Somalia (1992–1993); Rwanda (1994, non-intervention); Bosnia and the Dayton Accords (1995); Kosovo (1999); NATO expansion (1999, 2004); NAFTA and the WTO; the September 11 attacks; the Afghanistan war (2001); the Bush Doctrine of preemption; the Iraq War (2003); the PATRIOT Act and Department of Homeland Security.

        Analysis and reasoning (2 pts): 1 pt for using continuity and change (or causation) to structure the argument; 1 pt for complex understanding, for example distinguishing goals from methods, explaining both continuity and change, corroborating with multiple perspectives (supporters' and critics' arguments over Iraq or humanitarian intervention, each in their own terms), or comparing with an earlier turning point such as 1945 or 1947.

        Zero for analysis: narrating events without judging the extent of change.
