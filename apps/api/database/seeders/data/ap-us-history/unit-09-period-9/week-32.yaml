week: 32
unit: 9
title: "A Changing Economy and the Challenges of a New Century"
topics: ["9.4", "9.5", "9.6", "9.7"]
guide: guides/week-32.md
guide_description: |
  The shift from an industrial to a service and information economy (technology, globalization, deindustrialization
  and the decline of unions); the new immigration after 1965 and the policy debates it produced; the post-Cold War
  world from the Gulf War to September 11, 2001 and the debates over security and liberty that followed; and how to
  write causation arguments for Period 9. Worked examples: reading a Census table, a causation chain from the 1965
  immigration law to the debates of the 1990s, and an SAQ on union membership answered part by part.
flashcards_description: |
  34 cards on the technology and service economy, globalization and trade, immigration law and demographic change,
  post-Cold War interventions, September 11 and its aftermath, and the politics of the 1990s.

flashcards:
  - front: Deindustrialization and the Rust Belt (1970s–1990s) → causes and effects
    back: |
      Factory jobs in steel, autos and textiles declined as automation, foreign competition and companies moving to lower-wage regions or countries cut employment. Industrial cities of the Northeast and Midwest lost population and tax revenue; displaced workers often found lower-paying service jobs.
    topic_code: "9.4"
  - front: Sun Belt growth after 1970 → why the South and West grew
    back: |
      Air conditioning, lower taxes and wages, weaker unions, defense and aerospace spending and retirees seeking warm weather drew people and jobs to the South and Southwest. Their growing population shifted House seats and electoral votes toward those states, which tended to favor conservative candidates.
    topic_code: "9.4"
  - front: Personal computer and the Internet → the information revolution of the 1980s and 1990s
    back: |
      The IBM PC (1981) and Apple Macintosh (1984) brought computing into offices and homes. The Internet, which grew out of a Defense Department research network, became public with the World Wide Web in the early 1990s and was opened to commerce by the mid-1990s, reshaping work, communication and retail.
    topic_code: "9.4"
  - front: Service and information economy → what replaced manufacturing jobs
    back: |
      By the 1990s most Americans worked in services: health care, retail, finance, education, software and other knowledge work. High-skill service jobs paid well, while many lower-skill service jobs paid less and offered fewer benefits than the union factory jobs they replaced.
    topic_code: "9.4"
  - front: Union membership, 1983 to 2000 (Bureau of Labor Statistics) → the trend
    back: |
      The share of wage and salary workers in unions fell from 20.1% in 1983 to 13.5% in 2000. By 2000 the rate was 37.5% for government workers but only 9.0% in the private sector, reflecting the decline of unionized manufacturing.
    topic_code: "9.4"
  - front: North American Free Trade Agreement (NAFTA, 1994) → supporters vs critics
    back: |
      Phased out most tariffs among the U.S., Canada and Mexico; negotiated under George H. W. Bush and passed under Bill Clinton with more House Republican than Democratic votes. Supporters promised cheaper goods, larger export markets and growth; critics, including many unions and environmental groups, warned of lost manufacturing jobs and weaker standards.
    topic_code: "9.4"
  - front: World Trade Organization (1995) → role in globalization
    back: |
      Successor to the postwar General Agreement on Tariffs and Trade, the WTO set and enforced rules for international trade. China joined in 2001. Supporters credited freer trade with growth and cheaper goods; protests such as those at the 1999 Seattle meeting criticized its effects on workers and the environment.
    topic_code: "9.4"
  - front: Globalization → definition and the debate in Period 9
    back: |
      The growing integration of the world's economies through trade, investment, migration and communication. Supporters stress lower prices, new markets and rising living standards abroad; critics stress lost factory jobs, pressure on wages and communities left behind. Both sides make empirical claims a strong essay can weigh.
    topic_code: "9.4"
  - front: Dot-com boom and bust (late 1990s – 2001) → what happened
    back: |
      Investors poured money into new Internet companies, driving stock prices to record highs in the late 1990s; many firms had little profit, and the bubble burst in 2000–2001, followed by a mild recession. The boom also helped produce federal budget surpluses.
    topic_code: "9.4"
  - front: Federal budget surpluses (1998–2001) → causes
    back: |
      Strong economic growth raised tax revenue, while deficit-reduction laws of 1990 (under George H. W. Bush) and 1993 (under Clinton) and spending limits negotiated with the Republican Congress restrained spending. The surpluses ended after the 2001 recession, tax cuts and post-9/11 spending.
    topic_code: "9.4"
  - front: Gramm–Leach–Bliley Act (1999) → what it changed
    back: |
      A bipartisan law that repealed key parts of the New Deal's Glass–Steagall Act separating commercial banking from investment banking and insurance. Supporters said it modernized finance; after the 2008 crisis critics argued it encouraged risky, oversized institutions, a claim others dispute.
    topic_code: "9.4"
  - front: Great Recession (2007–2009) → in brief
    back: |
      A collapse in housing prices and risky mortgage lending set off a financial crisis in 2008; Congress passed the Troubled Asset Relief Program to stabilize banks. It was the worst downturn since the 1930s and renewed debate over regulation and government's economic role.
    topic_code: "9.4"
  - front: Rising income inequality after 1980 → explanations historians and economists weigh
    back: |
      Gains went disproportionately to those with the highest incomes. Explanations include technology rewarding education and skills, globalization, the decline of unions, and changes in tax policy. People disagree over how much each mattered and whether government should respond.
    topic_code: "9.4"
  - front: Immigration and Nationality Act of 1965 → its long-term effect in Period 9
    back: |
      By ending the national-origins quotas of the 1920s and emphasizing family reunification and skills, it opened the way for large-scale immigration from Latin America and Asia. Its sponsors did not expect it to change the sources of immigration so dramatically.
    topic_code: "9.5"
  - front: Immigration Reform and Control Act (IRCA, 1986) → its two halves
    back: |
      Signed by Reagan: it made it unlawful for employers knowingly to hire unauthorized immigrants (employer sanctions) and offered legal status to undocumented immigrants who had lived in the U.S. continuously since before 1982, plus certain farmworkers. About 2.7 million people gained legal status.
    topic_code: "9.5"
  - front: Immigration Act of 1990 → what it did
    back: |
      Signed by George H. W. Bush, it raised the annual ceiling on legal immigration, expanded employment-based visas for skilled workers and created the diversity visa lottery for countries with low recent immigration.
    topic_code: "9.5"
  - front: Proposition 187 (California, 1994) → what it proposed and what happened
    back: |
      A ballot measure to bar undocumented immigrants from public services, including public schools and non-emergency health care. Voters passed it, but federal courts blocked it and it never took effect. Supporters cited state costs; opponents argued it would harm children and encourage discrimination.
    topic_code: "9.5"
  - front: Illegal Immigration Reform and Immigrant Responsibility Act (1996) → significance
    back: |
      A federal law that expanded the grounds for deportation, increased Border Patrol resources and limited judicial review in many deportation cases. Along with the 1996 welfare law's limits on benefits for many legal immigrants, it marked a shift toward enforcement.
    topic_code: "9.5"
  - front: Foreign-born population, 1970 vs 2000 (U.S. Census Bureau)
    back: |
      9.6 million (4.7% of the population) in 1970, 31.1 million (11.1%) in 2000. The share was still below the peak of nearly 15% around 1890–1910. In 1960 three-quarters of the foreign born were from Europe; by 2009 over 80% were from Latin America or Asia.
    topic_code: "9.5"
  - front: Census 2000 and the Latino population → why it was a milestone
    back: |
      The 2000 census counted Hispanic or Latino Americans at about 12.5% of the population, roughly equal to African Americans, and Latinos soon became the largest minority group. Their growth reshaped politics, culture and the economy, especially in the Southwest, Florida and large cities.
    topic_code: "9.5"
  - front: Immigration debate of the 1990s and 2000s → the arguments on each side
    back: |
      Those favoring more restriction and enforcement stressed the rule of law, border security, costs to public services and competition for low-wage jobs. Those favoring openness or legalization stressed immigrants' economic contributions, family unity, humanitarian concerns and the nation's immigrant heritage. Congress repeatedly failed to pass comprehensive reform.
    topic_code: "9.5"
  - front: Aging baby boomers → the policy debate they raised
    back: |
      As the large postwar generation approached retirement, the ratio of workers to retirees fell, raising questions about the long-term funding of Social Security and Medicare. Proposals ranged from partial privatization to higher taxes or benefit changes; none passed.
    topic_code: "9.5"
  - front: Persian Gulf War (1990–1991) → causes and outcome
    back: |
      After Iraq under Saddam Hussein invaded Kuwait in August 1990, George H. W. Bush built a UN-authorized coalition of about 35 nations. Operation Desert Storm (January–February 1991) expelled Iraq from Kuwait in six weeks; Saddam stayed in power, and U.S. forces remained in the Persian Gulf region.
    topic_code: "9.6"
  - front: New world order (Bush, September 11, 1990) → what he meant
    back: |
      Addressing Congress after Iraq's invasion of Kuwait, George H. W. Bush described a post-Cold War era in which nations, including the former rivals, would cooperate through the United Nations to stop aggression and uphold international law.
    topic_code: "9.6"
  - front: Somalia, Bosnia and Kosovo (1992–1999) → the humanitarian intervention debate
    back: |
      U.S. troops entered Somalia to protect famine relief; after 18 Americans died in Mogadishu in 1993 they were withdrawn. NATO air power and U.S. diplomacy ended the Bosnian war (Dayton Accords, 1995) and drove Serbian forces from Kosovo (1999). Debates followed over when the U.S. should use force where no direct threat existed.
    topic_code: "9.6"
  - front: September 11, 2001 attacks → what happened
    back: |
      Nineteen al-Qaeda hijackers seized four airliners, striking the World Trade Center and the Pentagon; a fourth plane crashed in Pennsylvania after passengers fought back. Nearly 3,000 people were killed, the deadliest foreign attack on U.S. soil.
    topic_code: "9.6"
  - front: USA PATRIOT Act (October 2001) → purpose and debate
    back: |
      Expanded government powers of surveillance, information sharing and investigation of suspected terrorists. Supporters said it closed gaps that had allowed the 9/11 plot; critics from both left and right warned it threatened privacy and civil liberties. Parts were later revised.
    topic_code: "9.6"
  - front: Department of Homeland Security (2002) → why it was created
    back: |
      Congress merged about 22 federal agencies, including the Coast Guard, customs, immigration enforcement and the new Transportation Security Administration, into one cabinet department to coordinate defense against terrorism at home. The largest reorganization of the federal government since the late 1940s.
    topic_code: "9.6"
  - front: War in Afghanistan (2001) and Iraq War (2003) → justifications and debates
    back: |
      Afghanistan (October 2001): to destroy al-Qaeda and topple the Taliban government that sheltered it, with broad support. Iraq (March 2003): justified by claims about weapons of mass destruction and ties to terrorism; no stockpiles were found, and the long occupation divided Americans.
    topic_code: "9.6"
  - front: Guantánamo Bay and the detention cases → the civil liberties question
    back: |
      Suspected enemy combatants were held at the U.S. base in Cuba without ordinary trials. In Hamdi v. Rumsfeld (2004) and Boumediene v. Bush (2008) the Supreme Court ruled that detainees had rights to challenge their detention, balancing wartime security against due process.
    topic_code: "9.6"
  - front: Kyoto Protocol (1997) → the U.S. climate debate
    back: |
      An international agreement to limit greenhouse-gas emissions. The Senate voted 95–0 in 1997 for a resolution opposing any treaty that exempted developing countries or harmed the U.S. economy; the Clinton administration signed Kyoto but never submitted it for ratification, and the Bush administration rejected it in 2001.
    topic_code: "9.6"
  - front: Bush v. Gore (2000) → what the Court decided
    back: |
      In a disputed Florida count, the Supreme Court halted the statewide recount, leaving George W. Bush the winner of Florida and an Electoral College majority, although Al Gore won the national popular vote. The case showed how close and divided national politics had become.
    topic_code: "9.6"
  - front: Contract with America (1994) → what it promised and what followed
    back: |
      A Republican campaign platform led by Newt Gingrich promising votes on a balanced-budget amendment, welfare reform, tax cuts and term limits. Republicans won both houses of Congress for the first time since the 1950s; budget clashes with Clinton led to government shutdowns in 1995–1996.
    topic_code: "9.2"
  - front: New Democrats and the Personal Responsibility Act of 1996 → how conservatism reshaped the center
    back: |
      Clinton, a centrist New Democrat, signed a Republican-written welfare law that replaced the AFDC entitlement with block grants (TANF), time limits and work requirements. Supporters saw a move from dependence to work; critics feared harm to poor children.
    topic_code: "9.2"

quiz:
  description: |
    25 questions · about 40 minutes · about 70% this week (9.4 to 9.7: the changing economy, immigration, the post-Cold
    War world and September 11, causation in Period 9) and 30% review of week 31 (conservatism and the end of the Cold
    War), Gilded Age immigration, the Great Society and the postwar economy. Multiple choice, select-all and true/false
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long essay
    are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: the foreign-born population (9.5, review 8.9, review 6.8)
    - slug: apush-u09-w32-q01
      type: multiple_choice
      topic_code: "9.5"
      source: "U.S. Census Bureau, The Foreign-Born Population in the United States: 2009, American Community Survey Brief ACSBR/09-15 (2010)"
      points: 1
      stimulus: |
        Foreign-born population of the United States, 1970–2009

        | Year | Foreign born (millions) | Share of total population |
        |---|---|---|
        | 1970 | 9.6 | 4.7% |
        | 1980 | 14.1 | 6.2% |
        | 1990 | 19.8 | 7.9% |
        | 2000 | 31.1 | 11.1% |
        | 2009 | 38.5 | 12.5% |

        In 1960, 75 percent of the foreign born had been born in Europe. In 2009, over 80 percent had been born in Latin America or Asia.

        Source: U.S. Census Bureau, American Community Survey Brief ACSBR/09-15 (2010)
      prompt: |
        Which of the following conclusions is best supported by the data?
      options:
        - "The foreign-born population roughly tripled between 1970 and 2000, and its origins shifted from Europe toward Latin America and Asia."
        - "By 2000 most residents of the United States had been born abroad."
        - "Immigration declined steadily after 1970 as the economy shifted to services."
        - "The foreign-born share of the population fell between 1980 and 1990."
      option_explanations:
        - |
          Correct. The number grew from 9.6 to 31.1 million (more than three times) and the share more than doubled, while the note shows the shift in regions of birth from Europe to Latin America and Asia.
        - |
          The share in 2000 was 11.1 percent, about one in nine residents, far from a majority.
        - |
          Every row rises; the number and share of foreign-born residents grew in each decade shown.
        - |
          The share rose from 6.2 to 7.9 percent between 1980 and 1990.
      answer: 0
      explanation: |
        Skill: analyzing quantitative data. Read both columns and the note: the trend is growth in size and a change in sources.

    - slug: apush-u09-w32-q02
      type: multiple_choice
      topic_code: "8.9"
      source: "U.S. Census Bureau, The Foreign-Born Population in the United States: 2009, American Community Survey Brief ACSBR/09-15 (2010)"
      points: 1
      stimulus: |
        Foreign-born population of the United States, 1970–2009

        | Year | Foreign born (millions) | Share of total population |
        |---|---|---|
        | 1970 | 9.6 | 4.7% |
        | 1980 | 14.1 | 6.2% |
        | 1990 | 19.8 | 7.9% |
        | 2000 | 31.1 | 11.1% |
        | 2009 | 38.5 | 12.5% |

        In 1960, 75 percent of the foreign born had been born in Europe. In 2009, over 80 percent had been born in Latin America or Asia.

        Source: U.S. Census Bureau, American Community Survey Brief ACSBR/09-15 (2010)
      prompt: |
        Review. Which earlier policy most directly contributed to the change in the regions of birth described in the note?
      options:
        - "The Immigration Act of 1924, which set quotas based on national origins"
        - "The Immigration and Nationality Act of 1965, which abolished the national-origins quota system"
        - "The Chinese Exclusion Act of 1882"
        - "The Bracero Program of 1942–1964"
      option_explanations:
        - |
          The 1924 quotas favored Northern and Western Europe; they are why the 1960 foreign-born population was mostly European, not why it changed.
        - |
          Correct. Passed as part of the Great Society, the 1965 law replaced national-origins quotas with a system based on family ties and skills, opening the door to large-scale immigration from Asia and Latin America.
        - |
          Chinese exclusion barred Asian immigrants and was repealed in 1943; it reduced, rather than increased, Asian immigration.
        - |
          The Bracero Program brought temporary Mexican farmworkers, but it ended in 1964, before the rapid growth shown in the table.
      answer: 1
      explanation: |
        Skill: causation across periods. A Period 8 reform is the main legal cause of Period 9's new immigration; economic and political conditions abroad were further causes.

    - slug: apush-u09-w32-q03
      type: multiple_choice
      topic_code: "6.8"
      source: "U.S. Census Bureau, The Foreign-Born Population in the United States: 2009, American Community Survey Brief ACSBR/09-15 (2010)"
      points: 1
      stimulus: |
        Foreign-born population of the United States, 1970–2009

        | Year | Foreign born (millions) | Share of total population |
        |---|---|---|
        | 1970 | 9.6 | 4.7% |
        | 1980 | 14.1 | 6.2% |
        | 1990 | 19.8 | 7.9% |
        | 2000 | 31.1 | 11.1% |
        | 2009 | 38.5 | 12.5% |

        In 1960, 75 percent of the foreign born had been born in Europe. In 2009, over 80 percent had been born in Latin America or Asia.

        Source: U.S. Census Bureau, American Community Survey Brief ACSBR/09-15 (2010)
      prompt: |
        Review. Compared with immigration between 1880 and 1920, immigration in the period shown in the table was
      options:
        - "different because no Americans called for restricting immigration after 1970"
        - "similar because most immigrants in both periods came from Northern and Western Europe"
        - "similar in provoking debates over assimilation, labor competition and restriction, but different in that most immigrants came from Latin America and Asia rather than Southern and Eastern Europe"
        - "different because the foreign-born share of the population was much higher after 1970 than in 1910"
      option_explanations:
        - |
          Restriction was debated vigorously after 1970, including Proposition 187 in 1994 and federal enforcement laws in 1986 and 1996.
        - |
          The 1880–1920 wave came mainly from Southern and Eastern Europe, and the post-1970 wave mainly from Latin America and Asia.
        - |
          Correct. Both waves brought nativist responses and policy fights (the Gilded Age had Chinese exclusion and literacy-test campaigns; Period 9 had IRCA, Proposition 187 and enforcement laws), but the sending regions differed.
        - |
          The foreign-born share was nearly 15 percent around 1890–1910, higher than the 11 to 12.5 percent reached in 2000–2009.
      answer: 2
      explanation: |
        Skill: comparison. A good comparison names a similarity and a difference; the share comparison is a frequent trap.

    # ---- Set B: Immigration Reform and Control Act of 1986 (9.5, 9.5, 9.7)
    - slug: apush-u09-w32-q04
      type: multiple_choice
      topic_code: "9.5"
      source: "Primary source: Immigration Reform and Control Act of 1986, Pub. L. 99-603, sec. 101, codified at 8 U.S.C. § 1324a, Legal Information Institute (Cornell Law School)"
      points: 1
      stimulus: |
        "It is unlawful for a person or other entity—
        (A) to hire, or to recruit or refer for a fee, for employment in the United States an alien knowing the alien is an unauthorized alien (as defined in subsection (h)(3)) with respect to such employment, ..."

        — Immigration Reform and Control Act of 1986 (Public Law 99-603), section 101, as codified at 8 U.S.C. § 1324a(a)(1)
      prompt: |
        The provision in the excerpt was most directly intended to
      options:
        - "increase the number of visas available to skilled workers"
        - "end the national-origins quota system"
        - "create a guest-worker program for Mexican agricultural laborers"
        - "reduce unauthorized immigration by penalizing employers who knowingly hired unauthorized workers"
      option_explanations:
        - |
          Expanding skilled-worker visas was a feature of the Immigration Act of 1990, not this provision, which restricts hiring.
        - |
          National-origins quotas were abolished in 1965, two decades before this law.
        - |
          The excerpt prohibits a kind of hiring; it does not create a worker program. (The Bracero Program had ended in 1964.)
        - |
          Correct. Employer sanctions aimed to remove the job magnet that drew unauthorized immigrants, shifting part of enforcement from the border to the workplace.
      answer: 3
      explanation: |
        Skill: sourcing (purpose). Statutes state their purpose through what they prohibit; the target here is the employer, not the immigrant.

    - slug: apush-u09-w32-q05
      type: multiple_choice
      topic_code: "9.5"
      source: "Primary source: Immigration Reform and Control Act of 1986, Pub. L. 99-603, sec. 101, codified at 8 U.S.C. § 1324a, Legal Information Institute (Cornell Law School)"
      points: 1
      stimulus: |
        "It is unlawful for a person or other entity—
        (A) to hire, or to recruit or refer for a fee, for employment in the United States an alien knowing the alien is an unauthorized alien (as defined in subsection (h)(3)) with respect to such employment, ..."

        — Immigration Reform and Control Act of 1986 (Public Law 99-603), section 101, as codified at 8 U.S.C. § 1324a(a)(1)
      prompt: |
        In addition to the provision in the excerpt, the Immigration Reform and Control Act of 1986 also
      options:
        - "barred all immigration from Latin America for ten years"
        - "denied citizenship to children born in the United States to undocumented parents"
        - "offered legal status to undocumented immigrants who had lived in the United States continuously since before 1982"
        - "built a continuous wall along the entire border with Mexico"
      option_explanations:
        - |
          No such ban was enacted; immigration from Latin America continued to grow after 1986.
        - |
          Birthright citizenship rests on the Fourteenth Amendment, and IRCA did not change it.
        - |
          Correct. IRCA was a compromise: enforcement through employer sanctions paired with legalization for long-term residents and some farmworkers. About 2.7 million people gained legal status.
        - |
          IRCA built no border wall; barriers on parts of the border came later, especially after laws in 1996 and 2006.
      answer: 2
      explanation: |
        Skill: contextualization. IRCA, signed by Reagan, joined enforcement and legalization, a compromise that later reform debates kept returning to.

    - slug: apush-u09-w32-q06
      type: multiple_choice
      topic_code: "9.7"
      source: "Primary source: Immigration Reform and Control Act of 1986, Pub. L. 99-603, sec. 101, codified at 8 U.S.C. § 1324a, Legal Information Institute (Cornell Law School)"
      points: 1
      stimulus: |
        "It is unlawful for a person or other entity—
        (A) to hire, or to recruit or refer for a fee, for employment in the United States an alien knowing the alien is an unauthorized alien (as defined in subsection (h)(3)) with respect to such employment, ..."

        — Immigration Reform and Control Act of 1986 (Public Law 99-603), section 101, as codified at 8 U.S.C. § 1324a(a)(1)
      prompt: |
        Which of the following was a result of the law in the years after 1986?
      options:
        - "Most employers stopped hiring immigrants of any status."
        - "Unauthorized immigration largely ended, so immigration disappeared as a political issue."
        - "Congress repealed the employer sanctions within a year."
        - "Unauthorized immigration continued to grow, as enforcement was limited and fraudulent documents were common, leading to further debates and enforcement laws in the 1990s."
      option_explanations:
        - |
          Legal immigrants and citizens of immigrant origin continued to be hired in large numbers; the law targeted only knowing employment of unauthorized workers.
        - |
          Immigration remained a major issue, as Proposition 187 (1994) and the 1996 federal enforcement law show.
        - |
          Employer sanctions remained law; the excerpt itself is quoted from the current U.S. Code.
        - |
          Correct. Because employers only had to check documents that looked genuine and enforcement funding was modest, the job magnet persisted; the unauthorized population grew, prompting the 1996 Illegal Immigration Reform and Immigrant Responsibility Act and more border enforcement.
      answer: 3
      explanation: |
        Skill: causation (intended and unintended effects). Policies often fall short of their aims, and the shortfall becomes a cause of the next round of debate.

    # ---- Set C: Clinton's 1996 State of the Union (review 9.2 ×3)
    - slug: apush-u09-w32-q07
      type: multiple_choice
      topic_code: "9.2"
      source: "Primary source: Bill Clinton, State of the Union Address (January 23, 1996), Miller Center, University of Virginia"
      points: 1
      stimulus: |
        "We know big government does not have all the answers. We know there's not a program for every problem. We know, and we have worked to give the American people a smaller, less bureaucratic government in Washington. And we have to give the American people one that lives within its means. The era of big government is over. But we cannot go back to the time when our citizens were left to fend for themselves."

        — President Bill Clinton, State of the Union Address, January 23, 1996
      prompt: |
        Review. The excerpt best illustrates which development?
      options:
        - "The revival of New Deal liberalism in the Democratic Party"
        - "The Republican Party's abandonment of tax cuts"
        - "A bipartisan agreement to expand the welfare state"
        - "The influence of conservative critiques of federal power on the Democratic Party by the 1990s"
      option_explanations:
        - |
          A Democratic president announcing that the era of big government is over is a retreat from, not a revival of, New Deal liberalism.
        - |
          Republicans in 1996 were pressing for tax cuts and smaller budgets; the excerpt is about the Democratic president's position.
        - |
          The excerpt promises smaller government; the 1996 welfare law that followed narrowed rather than expanded federal welfare.
        - |
          Correct. Clinton, a New Democrat, adopted much of the language of limited government that Reagan had popularized, showing how far conservatism had shifted the political center.
      answer: 3
      explanation: |
        Skill: making connections and continuity and change. Reagan's 1981 claim that government is the problem (week 31) reappears in qualified form in Clinton's 1996 address.

    - slug: apush-u09-w32-q08
      type: multiple_choice
      topic_code: "9.2"
      source: "Primary source: Bill Clinton, State of the Union Address (January 23, 1996), Miller Center, University of Virginia"
      points: 1
      stimulus: |
        "We know big government does not have all the answers. We know there's not a program for every problem. We know, and we have worked to give the American people a smaller, less bureaucratic government in Washington. And we have to give the American people one that lives within its means. The era of big government is over. But we cannot go back to the time when our citizens were left to fend for themselves."

        — President Bill Clinton, State of the Union Address, January 23, 1996
      prompt: |
        Review. Which of the following best describes the historical situation in which Clinton gave this address?
      options:
        - "The Soviet Union had just invaded Western Europe."
        - "Congress had just passed a constitutional amendment requiring a balanced budget."
        - "The country was in the deepest economic depression since the 1930s."
        - "Republicans had won control of both houses of Congress in 1994 and had clashed with Clinton over the budget, leading to government shutdowns."
      option_explanations:
        - |
          The Soviet Union had dissolved in 1991, and there was no such invasion.
        - |
          The House passed a balanced-budget amendment in 1995, but it failed in the Senate and was never sent to the states.
        - |
          The economy was growing in 1996; the deep downturn came in 2007–2009.
        - |
          Correct. After the 1994 midterms and the Contract with America, the Republican Congress and Clinton fought over spending, producing shutdowns in late 1995 and early 1996; the address positioned Clinton between the two sides.
      answer: 3
      explanation: |
        Skill: sourcing (historical situation). Divided government after 1994 explains why a Democratic president spoke this way.

    - slug: apush-u09-w32-q09
      type: multiple_choice
      topic_code: "9.2"
      source: "Primary source: Bill Clinton, State of the Union Address (January 23, 1996), Miller Center, University of Virginia"
      points: 1
      stimulus: |
        "We know big government does not have all the answers. We know there's not a program for every problem. We know, and we have worked to give the American people a smaller, less bureaucratic government in Washington. And we have to give the American people one that lives within its means. The era of big government is over. But we cannot go back to the time when our citizens were left to fend for themselves."

        — President Bill Clinton, State of the Union Address, January 23, 1996
      prompt: |
        Review. The final sentence of the excerpt most directly reflects which continuity from earlier periods?
      options:
