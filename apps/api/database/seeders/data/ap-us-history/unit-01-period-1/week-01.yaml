    # ---- Short answer (SAQ)
    - slug: apush-u01-w01-q22
      type: short_answer
      topic_code: "1.2"
      source: "Primary source: Thomas Harriot, A Briefe and True Report of the New Found Land of Virginia (1588; 1590 edition), Project Gutenberg"
      points: 3
      stimulus: |
        "Their townes are but small, & neere the sea coast but few, some containing but 10. or 12. houses: some 20. the greatest that we haue seene haue bene but of 30. houses: if they be walled it is only done with barks of trees made fast to stakes, or els with poles onely fixed vpright and close one by another."

        — Thomas Harriot, A Briefe and True Report of the New Found Land of Virginia, 1588, describing Carolina Algonquian towns he visited in 1585–86 (original spelling)
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe ONE feature of Carolina Algonquian society shown in the excerpt.
        (b) Briefly explain ONE way that Harriot's purpose or point of view might have shaped this description.
        (c) Briefly explain ONE way that Native societies in another region of North America before 1492 differed from the society described in the excerpt.
      answer: |
        (a) The Algonquians lived in small permanent towns of about 10 to 30 houses, some protected by palisades of poles or bark fastened to stakes, which shows a settled, farming people who needed to defend their villages.
        (b) Harriot was promoting an English colony to investors. Describing the towns as small, few and lightly walled made the Native population seem manageable and the land open for settlement, so his emphasis may understate the region's population.
        (c) Mississippian peoples such as those at Cahokia built a city of thousands with large earthen platform mounds, a far larger and more hierarchical settlement than these small coastal towns; or, Great Plains peoples were mostly mobile hunters who did not live in fixed towns at all.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a feature drawn from the excerpt and described, e.g. small permanent towns (10–30 houses); palisades for defence; few towns near the coast; houses built of poles. "They lived in towns" alone earns the point only if it adds a detail.

        (b) 1 pt: links purpose, audience or point of view to the content. Accept: promotional purpose made the land look open and the people few or unthreatening; as an English outsider he judged towns by English standards; his visit was brief and coastal, so he may generalise from a few towns. Zero for "he was biased" with no explanation of how.

        (c) 1 pt: a specific, accurate contrast with another region: Mississippian towns and mounds (Cahokia); Pueblo multistorey adobe towns with irrigation; mobile Plains or Great Basin bands; Northwest villages without farming. Zero for a contrast with Europeans or for an inaccurate claim (e.g. Plains peoples on horseback in 1491).

    - slug: apush-u01-w01-q23
      type: short_answer
      topic_code: "1.1"
      source: "general knowledge"
      points: 3
      stimulus: |
        Map description: A map titled "The Atlantic World, about 1490" shows the coasts of Western Europe, West Africa and the Americas. Arrows trace Portuguese voyages down the African coast to the Cape of Good Hope (1488). Labels mark the Ottoman Empire controlling the eastern Mediterranean, the Kingdom of Granada (conquered by Castile and Aragon, 1492), the West African states of Mali, Songhai, Benin and Kongo, the Portuguese post at Elmina (1482), and Portuguese sugar islands at Madeira and São Tomé. The Americas appear on the far left with the Mexica (Aztec) and Inca empires and the Mississippian region labelled; no route crosses the ocean between the continents.
      prompt: |
        Using the map description, answer (a), (b) and (c).

        (a) Briefly describe ONE development shown on the map that encouraged Europeans to seek new routes across the ocean.
        (b) Briefly explain ONE reason the Portuguese sugar islands are historically significant for the Americas.
        (c) Briefly explain ONE way that the absence of any ocean route between the Americas and the other continents in 1490 is significant for the history that followed.
      answer: |
        (a) The Ottoman Empire controlled the eastern Mediterranean and the land routes to Asia, so Portuguese and Spanish rulers looked for an all-sea route to spices and silks that bypassed Ottoman and Venetian middlemen.
        (b) Madeira and São Tomé combined sugar, plantations and enslaved African workers. This plantation model was carried across the Atlantic to Brazil and the Caribbean, shaping the labor systems of the Americas.
        (c) Because the hemispheres had been separated for thousands of years, Native Americans had no immunity to Old World diseases such as smallpox, so contact after 1492 brought catastrophic epidemics; the separation also meant that crops and animals had never been exchanged, which made the Columbian Exchange so transformative.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a development from the map with its link to exploration: Ottoman control of eastern trade; Portuguese success rounding Africa (Dias, 1488); the conquest of Granada freeing Spain's resources and zeal; trade with West African states for gold. Zero for a development not on the map or not linked to exploration.

        (b) 1 pt: the islands as a model of cash-crop plantations worked by enslaved Africans later transplanted to Brazil and the Caribbean. Accept a focus on the beginnings of the Atlantic slave trade. Zero for saying the islands grew American crops.

        (c) 1 pt: an accurate consequence of long separation: no immunity to Old World diseases and resulting epidemics; plants and animals never exchanged before (no horses, cattle, wheat in the Americas; no maize, potatoes in Europe); Europeans' surprise at an unknown continent. Zero for vague answers ("they did not know each other").

    # ---- Long essay (LEQ)
    - slug: apush-u01-w01-q24
      type: long_answer
      topic_code: "1.2"
      source: "general knowledge"
      points: 6
      prompt: |
        Native American societies in North America before 1492 were remarkably diverse. Historians explain that diversity in several ways, including environment and resources, the spread of maize agriculture, and the social and political choices of different peoples.

        Evaluate the extent to which the natural environment shaped the development of Native American societies in North America before 1492.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: The natural environment set the basic possibilities for Native societies before 1492, determining whether a people farmed, fished or followed game, but it did not decide everything: the diffusion of maize and the choices peoples made about kinship and government produced different societies even where environments were alike.

        Context: Over thousands of years people spread across North America from Asia and adapted to environments from desert to rain forest; maize, domesticated in Mexico, spread north and east only gradually.

        Body 1 (environment as cause): dry Great Basin and Plains favoured mobile hunting and gathering (bison on foot); rich Northwest fisheries supported permanent villages and plank houses without farming; California acorns did the same.

        Body 2 (maize as cause interacting with environment): irrigation let Pueblo peoples build multistorey towns in desert country; fertile Mississippi floodplains fed Cahokia's mounds and chiefdoms; the Three Sisters supported Northeastern villages.

        Body 3 (limits of environment): the Haudenosaunee and their Algonquian neighbours shared forests but organised differently; the Iroquois league and matrilineal clans were political and cultural choices; peoples reshaped environments by burning and irrigation.

        Conclusion: environment was the strongest single influence on economy, but culture and the spread of maize shaped how societies were organised.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a historically defensible claim that answers "to what extent" and suggests a line of reasoning, in the introduction or conclusion. Example: environment largely determined economy and settlement, though maize diffusion and cultural choices also mattered. Zero for restating the prompt or "environment shaped societies in many ways".

        Contextualization (0–1): describes a broader context relevant to the prompt, more than a passing phrase: e.g. migration and settlement across the continent over thousands of years; domestication of maize in Mesoamerica and its slow diffusion; the size and diversity of the Americas' population before contact. Zero for context only about Europeans arriving.

        Evidence (0–2): 1 pt for at least two specific, relevant examples, e.g. Pueblo irrigation and adobe towns; Cahokia and Mississippian mounds; Plains bison hunting on foot; Great Basin mobility; Northwest salmon villages and plank houses; California acorn economies; Three Sisters agriculture in the Northeast; Haudenosaunee longhouses and the Five Nations league; controlled burning. 2 pts when the examples are used to support the argument, explaining how each shows the environment's influence or its limits.

        Analysis and reasoning (0–2): 1 pt for using a reasoning process to frame the argument: causation (environment and maize as causes of economy and settlement), or comparison (contrasting regions with similar or different environments). 1 pt for a complex understanding, e.g. weighing environment against maize diffusion or political choices; showing that peoples transformed environments as well as adapting to them; explaining why similar environments produced different societies; corroborating with multiple regions. This point must be earned through sustained argument, not a single sentence.

        Common errors: placing horses on the Plains before contact; treating all Native peoples as the same; writing mostly about Europeans; claiming that only farming societies were settled.
