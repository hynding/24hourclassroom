week: 1
unit: 1
title: "Native American Societies and the World Before 1492"
topics: ["1.1", "1.2"]
guide: guides/week-01.md
guide_description: |
  What North America looked like in 1491: how the spread of maize from Mexico reshaped the Southwest and the
  Mississippi Valley, why peoples of the Great Basin and Great Plains stayed mobile, and how the Northeast, the
  Atlantic seaboard, the Pacific Northwest and California built societies around their environments. It also sets
  the stage in Europe and West Africa on the eve of contact. Worked examples: sourcing Thomas Harriot's 1588 report,
  a contextualization paragraph, and turning an LEQ prompt into a defensible thesis.
flashcards_description: |
  30 cards on the regions and peoples of North America before 1492, maize and the Three Sisters, Cahokia and Chaco
  Canyon, and the European and West African world on the eve of contact.

flashcards:
  - front: Period 1 (1491–1607) → what the AP exam calls it and how much it weighs
    back: |
      The first of nine periods in AP U.S. History, worth about 4–6% of the exam. It runs from the eve of contact to the founding of Jamestown, and its questions are about Native societies, European exploration and conquest, the Columbian Exchange and the Spanish colonial system.
    topic_code: "1.1"
  - front: Maize cultivation spreads north from Mexico → three effects in North America
    back: |
      A reliable, storable crop supported larger populations and permanent villages; it encouraged irrigation and other ways of reshaping the land; and surplus food allowed more complex, ranked societies with specialised leaders and priests. The Southwest and the Mississippi Valley show all three.
    hint: settlement, irrigation, social diversification
    topic_code: "1.2"
  - front: The Three Sisters → which crops and why plant them together
    back: |
      Maize, beans and squash. Beans climb the maize stalks and add nitrogen to the soil; broad squash leaves shade out weeds and hold moisture. The trio fed many farming peoples of the Northeast, the Atlantic seaboard and the Mississippi Valley.
    topic_code: "1.2"
  - front: Ancestral Puebloans (Chaco Canyon, c. 850–1150) → how they adapted to the arid Southwest
    back: |
      They grew maize with irrigation ditches, dams and terraces that captured scarce rain, and built multistorey stone and adobe great houses linked by roads. Their towns show that maize could support dense, organised settlement even in desert country.
    topic_code: "1.2"
  - front: Pueblo peoples of the Southwest in the 1500s → economy and housing
    back: |
      Settled farmers (Hopi, Zuni and the Rio Grande pueblos) who grew irrigated maize, beans, squash and cotton and lived in compact, multistorey adobe or stone towns. Spanish explorers called them pueblos, "towns", because they looked so permanent.
    topic_code: "1.2"
  - front: Cahokia (c. 1050–1350) → where, what, why it matters
    back: |
      The largest Mississippian city, near present-day St. Louis, with earthen platform mounds (Monks Mound is the biggest) and a population often estimated at 10,000–20,000 at its height. It shows that maize agriculture in the Mississippi Valley supported towns, chiefdoms and long-distance trade.
    topic_code: "1.2"
  - front: Mississippian culture → three hallmarks
    back: |
      Maize-based farming in river valleys, ceremonial platform mounds topped by temples or chiefs' houses, and ranked chiefdoms that collected tribute and traded over long distances. Many Mississippian societies had declined or reorganised before Europeans arrived.
    topic_code: "1.2"
  - front: Great Basin and Great Plains peoples before 1492 → why mobile?
    back: |
      Dry, unpredictable environments made large-scale farming hard, so most groups moved seasonally to hunt (bison on the Plains, on foot) and gather seeds and roots. Some Plains peoples farmed in river valleys, but mobility was the main adaptation.
    topic_code: "1.2"
  - front: Plains bison hunting before the horse → how was it done?
    back: |
      On foot, often by driving herds into corrals or over cliffs (buffalo jumps), with dogs hauling travois. Horses arrived only with the Spanish and transformed Plains life in the 1600s and 1700s, after this period.
    hint: No horses yet in 1491.
    topic_code: "1.2"
  - front: Pacific Northwest peoples (e.g. Chinook) → permanent villages without farming
    back: |
      Abundant salmon, shellfish, game and forest resources let them build large cedar plank houses and stay in permanent villages without agriculture. Wealth was displayed and redistributed in ceremonies such as the potlatch.
    topic_code: "1.2"
  - front: California peoples before contact → economy and diversity
    back: |
      Dozens of language groups lived by fishing, hunting and gathering, especially acorns, which they leached and stored. Rich resources supported permanent villages and one of the densest populations north of Mexico without farming.
    topic_code: "1.2"
  - front: Northeast and Atlantic seaboard peoples → mixed economy
    back: |
      They combined farming (maize, beans, squash) with hunting, fishing and gathering, living in permanent or semi-permanent villages that moved every few years as fields wore out. Women usually farmed and men hunted, fished and cleared land.
    topic_code: "1.2"
  - front: Haudenosaunee (Iroquois) longhouse → what it tells you about their society
    back: |
      A long bark-covered house shared by several related families of one clan, traced through the mother's line. It reflects a settled farming people organised by matrilineal kinship, in which clan mothers held real authority, including choosing chiefs.
    topic_code: "1.2"
  - front: Iroquois Confederacy (Five Nations) → members and purpose
    back: |
      Mohawk, Oneida, Onondaga, Cayuga and Seneca, joined in a league to end wars among themselves and to decide common questions in council. Its founding date is debated (estimates range from the 1100s to the 1500s), but it was in place when Europeans arrived.
    topic_code: "1.2"
  - front: Matrilineal society → definition and a Period 1 example
    back: |
      A society that traces descent and inheritance through the mother's line. The Haudenosaunee are the classic example: clan membership and longhouse residence followed the mother, and clan mothers named the chiefs.
    topic_code: "1.2"
  - front: Aztec Tenochtitlan in 1491 → why it matters for U.S. history
    back: |
      The Mexica capital on Lake Texcoco was one of the largest cities in the world, the centre of a tribute empire. Its wealth drew Cortés in 1519, and its conquest made Spain the dominant power in the Americas for a century.
    topic_code: "1.1"
  - front: How many people lived in North America in 1491? → what to say on the exam
    back: |
      Estimates for the land north of Mexico vary widely, from a few million to more than ten million, and the Americas as a whole held tens of millions. The safe claim is that the continent was home to many, diverse, long-established societies, not an empty wilderness.
    topic_code: "1.1"
  - front: Native peoples reshaping the land before contact → two examples
    back: |
      Controlled burning of Eastern forests and grasslands to clear undergrowth and improve hunting, and irrigation canals and terraces in the Southwest. Both show Native peoples transforming environments, not just adapting to them.
    topic_code: "1.2"
  - front: Native ideas about land before contact → how they differed from European ideas
    back: |
      Most Native societies treated land as held in common by a community for use, with rights to hunt, fish or farm a place, rather than as a commodity owned outright and sold by individuals. The clash with European property ideas runs through the colonial era.
    topic_code: "1.2"
  - front: Reconquista ends, 1492 → why it matters for the Americas
    back: |
      Ferdinand and Isabella captured Granada, the last Muslim kingdom in Iberia, in January 1492. A newly united, crusading Spain had soldiers, a monarchy hungry for revenue and religious zeal to export, and in the same year it funded Columbus.
    topic_code: "1.1"
  - front: Fall of Constantinople, 1453 → link to Atlantic exploration
    back: |
      The Ottoman conquest put a powerful state across the land routes to Asian spices and silk and pushed prices up. Western Europeans looked for sea routes to Asia that bypassed Ottoman and Venetian middlemen.
    topic_code: "1.1"
  - front: Prince Henry "the Navigator" of Portugal → what Portugal pioneered
    back: |
      Portuguese princes and sailors in the 1400s sponsored voyages down the West African coast, mapped winds and currents, and developed the caravel. Portugal reached the Cape of Good Hope (Dias, 1488) and India (da Gama, 1498) by sea.
    topic_code: "1.1"
  - front: Caravel, astrolabe, magnetic compass → why they mattered in the 1400s
    back: |
      The small, fast caravel, with lateen sails, could sail closer to the wind; the astrolabe and compass let navigators find latitude and direction far from land. Together they made long ocean voyages and return trips practical.
    topic_code: "1.1"
  - front: Atlantic island sugar plantations (Madeira, São Tomé) → why historians call them a rehearsal
    back: |
      In the 1400s Portugal grew sugar on Atlantic islands, increasingly with enslaved Africans. The combination of a cash crop, plantation production and African slave labor was later carried to Brazil and the Caribbean.
    topic_code: "1.1"
  - front: West Africa in the 1400s → states Europeans met
    back: |
      Kingdoms and empires such as Mali, Songhai, Benin and Kongo traded gold, ivory and people across the Sahara and then with Portuguese ships on the coast. Slavery existed in many African societies, but the Atlantic trade would change its scale and character.
    topic_code: "1.1"
  - front: Elmina (São Jorge da Mina), 1482 → what it was
    back: |
      A Portuguese fortified trading post on the Gold Coast of West Africa. It shows Europe's first expansion into Africa was by trade with African rulers, not conquest, and it later became a centre of the Atlantic slave trade.
    topic_code: "1.1"
  - front: 'God, gold and glory → the three European motives for exploration'
    back: |
      Spreading Christianity, finding new sources of wealth, and winning prestige and power for monarchs and adventurers. The CED words them as new sources of wealth, the desire to spread Christianity, and the quest for military and economic advantage.
    topic_code: "1.1"
  - front: Thomas Harriot, A Briefe and True Report (1588) → who, what, why use it carefully
    back: |
      An English scientist with Raleigh's 1585–86 Roanoke expedition who described Carolina Algonquian farming, towns and religion. It is valuable first-hand evidence, but its purpose was to promote English colonization to investors, so it is written for an English audience through English assumptions.
    topic_code: "1.2"
  - front: Compare Pueblo and Plains societies around 1500
    back: |
      Both adapted to dry western environments. Pueblo peoples farmed irrigated maize and lived in permanent multistorey towns; most Plains peoples hunted bison on foot and moved with the seasons. Same broad region, different resources, different societies.
    topic_code: "1.2"
  - front: Which theme? Maize, irrigation and the size of a village
    back: |
      Geography and the Environment (GEO), with Migration and Settlement (MIG): the questions of how people adapted to and transformed their environments, and where and how densely they settled, are at the heart of topic 1.2.
    topic_code: "1.2"

quiz:
  description: |
    24 questions · about 35 minutes · all on this week (topics 1.1 and 1.2: the world before contact and Native
    American societies), with no review yet because this is week 1. Multiple choice, select-all and true/false items
    are graded at once; fill-in-the-blank items are matched automatically; the two short answers and the long essay
    are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Harriot on Algonquian farming (1.2)
    - slug: apush-u01-w01-q01
      type: multiple_choice
      topic_code: "1.2"
      source: "Primary source: Thomas Harriot, A Briefe and True Report of the New Found Land of Virginia (1588; 1590 edition), Project Gutenberg"
      points: 1
      stimulus: |
        "Then their setting or sowing is after this maner. First for their corne, beginning in one corner of the plot, with a pecker they make a hole, wherein they put foure graines with that care they touch not one another, (about an inch asunder) and couer them with the moulde againe: and so through out the whole plot, making such holes and vsing them after such maner: but with this regard that they bee made in rankes, euery ranke differing from other halfe a fadome or a yarde, and the holes also in euery ranke, as much. By this meanes there is a yarde spare ground betwene euery hole: where according to discretion here and there, they set as many Beanes and Peaze . . ."

        — Thomas Harriot, English member of the Roanoke expedition, describing the Carolina Algonquians, A Briefe and True Report of the New Found Land of Virginia, 1588 (original spelling)
      prompt: |
        The farming method described in the excerpt is best understood as evidence of which development in North America before European contact?
      options:
        - "The dependence of eastern peoples on bison hunting"
        - "The spread of maize cultivation from present-day Mexico into eastern North America"
        - "The rise of large-scale plantation agriculture worked by enslaved laborers"
        - "The introduction of European crops by Spanish missionaries"
      option_explanations:
        - |
          The excerpt is about planting fields; bison hunting was the economy of the Great Plains, not of the Carolina coast.
        - |
          Correct. Maize ("corne") planted with beans in the same field is the Three Sisters system, the end of a long diffusion of maize from Mesoamerica that let eastern peoples live in settled farming villages.
        - |
          These are household and village fields worked by the community; plantation agriculture with enslaved labor arrived with Europeans later.
        - |
          Harriot saw this in 1585–86 among peoples who had had almost no contact with Spain; maize and beans are American crops, so nothing here was introduced from Europe.
      answer: 1
      explanation: |
        Skill: contextualization. Connect a specific practice in a source (planting maize and beans together) to the broader process the CED names: the spread of maize from Mexico supported settlement across much of North America.

    - slug: apush-u01-w01-q02
      type: multiple_choice
      topic_code: "1.2"
      source: "Primary source: Thomas Harriot, A Briefe and True Report of the New Found Land of Virginia (1588; 1590 edition), Project Gutenberg"
      points: 1
      stimulus: |
        "Then their setting or sowing is after this maner. First for their corne, beginning in one corner of the plot, with a pecker they make a hole, wherein they put foure graines with that care they touch not one another, (about an inch asunder) and couer them with the moulde againe: and so through out the whole plot, making such holes and vsing them after such maner: but with this regard that they bee made in rankes, euery ranke differing from other halfe a fadome or a yarde, and the holes also in euery ranke, as much. By this meanes there is a yarde spare ground betwene euery hole: where according to discretion here and there, they set as many Beanes and Peaze . . ."

        — Thomas Harriot, English member of the Roanoke expedition, describing the Carolina Algonquians, A Briefe and True Report of the New Found Land of Virginia, 1588 (original spelling)
      prompt: |
        Harriot wrote his report to persuade English investors and settlers to support a colony in Virginia. Which of the following best explains why that purpose affects how a historian should use this excerpt?
      options:
        - "It makes the excerpt useless, because any promotional writing is fiction."
        - "It means Harriot must have been hostile to the Algonquians and exaggerated their faults."
        - "Harriot had reason to stress how fertile and productive the land was, so his descriptions of abundance may be emphasised for an English audience, though his account of planting methods is still useful evidence."
        - "It shows that the Algonquians themselves wrote the report to attract English trade."
      option_explanations:
        - |
          Promotional purpose calls for caution, not dismissal. Harriot was an eyewitness and a careful observer; historians use such sources while weighing what the author wanted readers to believe.
        - |
          A promoter of colonization needed the land to look inviting and its people manageable; nothing in the purpose requires hostility, and the excerpt is admiring and precise.
        - |
          Correct. Purpose and audience shape emphasis: a writer recruiting investors highlights fertile soil and easy harvests. The concrete details of how seeds were spaced are less likely to be distorted and remain good evidence.
        - |
          Harriot was an English scientist on the Roanoke expedition writing in English for English readers; the Algonquians left no written record of this kind.
      answer: 2
      explanation: |
        Skill: sourcing (purpose and audience). A source's purpose tells you what it is likely to emphasise; the best answer limits the claim rather than throwing the source away.

    - slug: apush-u01-w01-q03
      type: multiple_choice
      topic_code: "1.2"
      source: "Primary source: Thomas Harriot, A Briefe and True Report of the New Found Land of Virginia (1588; 1590 edition), Project Gutenberg"
      points: 1
      stimulus: |
        "Then their setting or sowing is after this maner. First for their corne, beginning in one corner of the plot, with a pecker they make a hole, wherein they put foure graines with that care they touch not one another, (about an inch asunder) and couer them with the moulde againe: and so through out the whole plot, making such holes and vsing them after such maner: but with this regard that they bee made in rankes, euery ranke differing from other halfe a fadome or a yarde, and the holes also in euery ranke, as much. By this meanes there is a yarde spare ground betwene euery hole: where according to discretion here and there, they set as many Beanes and Peaze . . ."

        — Thomas Harriot, English member of the Roanoke expedition, describing the Carolina Algonquians, A Briefe and True Report of the New Found Land of Virginia, 1588 (original spelling)
      prompt: |
        The way of life implied by the excerpt most closely resembles that of which other group of North American peoples before 1492?
      options:
        - "The Mississippian peoples of the Mississippi River Valley, who lived in permanent villages supported by maize"
        - "The bison hunters of the Great Plains, who moved with the herds on foot"
        - "The salmon-fishing villages of the Pacific Northwest, who did not farm"
        - "The mobile hunter-gatherers of the Great Basin"
      option_explanations:
        - |
          Correct. Like the Carolina Algonquians, Mississippian peoples combined maize farming with hunting and gathering and lived in permanent villages and towns; both reflect the spread of maize through the East.
        - |
          Plains peoples were largely mobile hunters before the horse; the excerpt describes a settled farming routine.
        - |
          Northwest peoples were also settled, but their villages rested on fishing and gathering rather than on fields of maize and beans, so the comparison fails on the economy.
        - |
          Great Basin peoples moved seasonally to gather seeds and hunt small game in a dry environment; they did not plant maize fields in ranks.
      answer: 0
      explanation: |
        Skill: comparison. Identify what the source shows (settled maize farming) and find the region whose economy shared that feature.

    # ---- Stimulus set B: a secondary interpretation (1.1, 1.2)
    - slug: apush-u01-w01-q04
      type: multiple_choice
      topic_code: "1.1"
      source: "Interpretation written for this course"
      points: 1
      stimulus: |
        Interpretation (written for this course): For a long time, many textbooks described North America in 1491 as a thinly peopled wilderness whose inhabitants lived lightly on an untouched land. More recent scholarship, drawing on archaeology and environmental history, paints a different picture. Native peoples numbered in the millions north of Mexico, spoke hundreds of languages and had built societies as different from one another as the cities of the Mississippi Valley and the fishing villages of the Northwest coast. They burned forests to open hunting grounds, dug irrigation canals in the desert and bred maize into hundreds of local varieties. The continent Europeans called "new" was an old, humanized landscape.
      prompt: |
        Which of the following would most directly support the interpretation's main claim?
      options:
        - "European maps of the 1500s showing large blank areas in the interior of North America"
        - "Spanish explorers' reports of seeing large herds of wild animals"
        - "The absence of Native written records from most of North America"
        - "Archaeological evidence of irrigation canals in the Southwest and platform mounds at Cahokia"
      option_explanations:
        - |
          Blank spaces on European maps show what Europeans did not know, not what was there; they are a weak basis for any claim about Native societies.
        - |
          Herds of animals could be read as evidence of untouched wilderness, the older view; by itself it does not show human shaping of the land.
        - |
          The lack of writing in most regions explains why historians rely on archaeology, but it does not support or prove the claim about populous, transformed landscapes.
        - |
          Correct. Canals and monumental earthworks are physical proof that Native societies transformed their environments and supported dense settlement, which is exactly the claim of a humanized landscape.
      answer: 3
      explanation: |
        Skill: claims and evidence. Ask what the claim is (the land was populous and shaped by people) and pick evidence that shows people shaping it.

    - slug: apush-u01-w01-q05
      type: multiple_choice
      topic_code: "1.2"
      source: "Interpretation written for this course"
      points: 1
      stimulus: |
        Interpretation (written for this course): For a long time, many textbooks described North America in 1491 as a thinly peopled wilderness whose inhabitants lived lightly on an untouched land. More recent scholarship, drawing on archaeology and environmental history, paints a different picture. Native peoples numbered in the millions north of Mexico, spoke hundreds of languages and had built societies as different from one another as the cities of the Mississippi Valley and the fishing villages of the Northwest coast. They burned forests to open hunting grounds, dug irrigation canals in the desert and bred maize into hundreds of local varieties. The continent Europeans called "new" was an old, humanized landscape.
      prompt: |
        A historian who wanted to challenge or qualify the interpretation would most likely point out that
      options:
        - "maize was grown in the Southwest before 1492"
        - "the Iroquois Confederacy existed before Europeans arrived"
        - "population estimates for 1491 rest on indirect evidence and vary widely, so the size of Native populations is uncertain"
        - "Pacific Northwest peoples lived in permanent villages"
      option_explanations:
        - |
          Early maize farming in the Southwest is evidence for the interpretation, not against it.
        - |
          A complex political league before contact supports the picture of developed societies; it does not challenge it.
        - |
          Correct. Estimates for North America north of Mexico range from a few million to more than ten million because they are reconstructed from archaeology and later records; a careful critic would qualify the claim about numbers while accepting much else.
        - |
          Permanent villages supported by rich fisheries are one of the interpretation's own examples of diversity.
      answer: 2
      explanation: |
        Skill: argumentation (qualifying a claim). The strongest counter-argument targets the weakest evidence: population numbers for 1491 are estimates with wide ranges.

    - slug: apush-u01-w01-q06
      type: multiple_choice
      topic_code: "1.1"
      source: "Interpretation written for this course"
      points: 1
      stimulus: |
        Interpretation (written for this course): For a long time, many textbooks described North America in 1491 as a thinly peopled wilderness whose inhabitants lived lightly on an untouched land. More recent scholarship, drawing on archaeology and environmental history, paints a different picture. Native peoples numbered in the millions north of Mexico, spoke hundreds of languages and had built societies as different from one another as the cities of the Mississippi Valley and the fishing villages of the Northwest coast. They burned forests to open hunting grounds, dug irrigation canals in the desert and bred maize into hundreds of local varieties. The continent Europeans called "new" was an old, humanized landscape.
      prompt: |
        The interpretation's description of the older view of North America as an "untouched" wilderness is most relevant to understanding which later development?
      options:
        - "The spread of maize from Mexico into the Southwest"
        - "The decline of Cahokia before 1400"
        - "Europeans' later justifications for taking Native land on the grounds that it was not being used or improved"
        - "The founding of the Iroquois Confederacy"
      option_explanations:
        - |
          The spread of maize happened long before any European view of America existed; it is part of the evidence against the wilderness picture, not a consequence of it.
        - |
          Cahokia's decline was a Native development before contact; European ideas about wilderness had nothing to do with it.
        - |
          Correct. The idea that Native peoples left the land empty or unimproved was used by English colonists and later Americans to argue that settlers had a right to it; knowing the idea's history helps explain its political uses.
        - |
          The confederacy was a Native political creation; it was not shaped by later European myths.
      answer: 2
      explanation: |
        Skill: making connections. Ideas about the past have consequences: picturing America as empty made dispossession easier to justify, a thread that runs from Period 2 to Period 6.

    # ---- Stand-alone multiple choice
    - slug: apush-u01-w01-q07
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains why most peoples of the Great Basin and Great Plains before 1492 had mobile ways of life?
      options:
        - "Spanish settlers had already pushed them off farmland."
        - "Dry environments and scattered resources made large-scale farming difficult, so groups moved seasonally to hunt and gather."
        - "They had horses, which made constant travel easy."
        - "Their religions forbade the building of permanent houses."
      option_explanations:
        - |
          Before 1492 there were no Spanish settlers in North America; mobility was an adaptation to environment, not a response to colonization.
        - |
          Correct. In arid country with unpredictable rain and widely spread food sources, following seasonal resources (bison, seeds, roots) was more reliable than farming.
        - |
          Horses reached the Plains only after the Spanish brought them; before 1492 Plains peoples travelled on foot with dogs.
        - |
          There is no evidence of such a rule; mobility followed from the environment, and some Plains peoples did live in earth lodges in river valleys.
      answer: 1
      explanation: |
        Skill: causation. Topic 1.2 asks you to explain how environment shaped economy and settlement; mobility in the dry interior is the CED's example.

    - slug: apush-u01-w01-q08
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Peoples of the Pacific Northwest such as the Chinook differed from most farming societies of the Northeast in that they
      options:
        - "relied mainly on bison hunting on horseback"
        - "were organised into a five-nation league"
        - "lived in permanent villages supported mainly by fishing, hunting and gathering rather than agriculture"
        - "built cities with populations larger than Tenochtitlan"
      option_explanations:
        - |
          There were no horses in North America before the Spanish, and the Northwest coast was a fishing, not a bison, economy.
        - |
          The five-nation league was the Haudenosaunee (Iroquois) Confederacy of the Northeast.
        - |
          Correct. Salmon runs, shellfish and forest resources were rich enough to support settled villages with large cedar plank houses without farming, which overturns the idea that only agriculture can support permanence.
        - |
          Northwest villages were substantial but nowhere near the size of the Mexica capital, which was one of the largest cities in the world.
      answer: 2
      explanation: |
        Skill: comparison. Permanence does not require farming if the environment is rich enough; that is the Northwest's lesson.

    - slug: apush-u01-w01-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The earthen mounds and large population of Cahokia (c. 1050–1350) are best explained by
      options:
        - "the arrival of migrants from the Iroquois Confederacy"
        - "the domestication of horses and cattle"
        - "maize agriculture in the fertile Mississippi floodplain, which produced food surpluses that supported a ranked society and monumental building"
        - "trade with Spanish merchants on the Gulf Coast"
      option_explanations:
        - |
          Cahokia was a Mississippian city in the Midwest, not a creation of the Northeastern Haudenosaunee, and it peaked earlier.
        - |
          The Americas had no horses or cattle before the Columbian Exchange; Mississippian farming relied on human labour.
        - |
          Correct. Surplus maize fed a large population and supported chiefs and priests who could organise the labour to build Monks Mound and other earthworks.
        - |
          Cahokia flourished centuries before any European reached North America; its trade networks were entirely Native.
      answer: 2
      explanation: |
        Skill: causation. Food surplus is the cause; dense settlement, social ranking and monumental building are the effects.

    - slug: apush-u01-w01-q10
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which development in Europe most directly encouraged the Portuguese and Spanish to seek sea routes to Asia in the 1400s?
      options:
        - "The founding of Jamestown"
        - "The Industrial Revolution"
        - "Ottoman control of the eastern Mediterranean after the fall of Constantinople, which raised the cost of Asian goods reaching Europe by land"
        - "The Protestant Reformation"
      option_explanations:
        - |
          Jamestown (1607) closes Period 1; it was a result of European expansion, not a cause of the search for routes to Asia.
        - |
          Industrialization came in the late 1700s and 1800s, centuries later.
        - |
          Correct. Ottoman and Venetian middlemen controlled the old routes to spices and silks; an Atlantic route promised to cut them out.
        - |
          Luther's challenge began in 1517, after the sea-route voyages of Dias, Columbus and da Gama; it shaped later colonization, not the original search.
      answer: 2
      explanation: |
        Skill: contextualization. The search for Atlantic routes makes sense against the commercial geography of the eastern Mediterranean in the late 1400s.

    - slug: apush-u01-w01-q11
