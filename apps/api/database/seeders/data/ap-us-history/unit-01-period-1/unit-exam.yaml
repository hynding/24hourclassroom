      - "Native leaders' demands to be represented at the Spanish court"
      - "disagreement among Spaniards about the legitimacy of conquest and of the treatment of Native peoples"
    option_explanations:
      - |
        The debate concerned the treatment of Native peoples, not the boundary between Iberian empires.
      - |
        Both participants were Spaniards; English criticism came later, often by reprinting Las Casas.
      - |
        No Native representatives argued at Valladolid; the debate was about them, not with them.
      - |
        Correct. Two Spanish scholars argued before a royal panel; the debate shows that Spain's own intellectuals and clergy disputed the morality of empire.
    answer: 3
    explanation: |
      Skill: contextualization. The debate is the CED's chief example of Europeans contesting the conquest.

