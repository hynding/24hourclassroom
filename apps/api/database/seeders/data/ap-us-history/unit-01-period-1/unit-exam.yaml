      (a) Briefly describe ONE feature of Algonquian society shown in the image.
      (b) Briefly explain ONE way that the environment shaped the society shown in the image.
      (c) Briefly explain ONE way the purpose of the English expedition might have influenced how White depicted Secotan.
    answer: |
      (a) The town is a permanent settlement of bark houses surrounded by maize fields, which shows a settled farming society that combined agriculture with communal life and religious ceremonies.
      (b) The fertile, well-watered coastal plain let the Algonquians grow maize in fields beside the town, harvesting at different times in a long growing season; farming in turn allowed a permanent village rather than a mobile way of life.
      (c) The expedition was meant to attract English investors and settlers, so White may have shown an orderly, productive and peaceful town with abundant crops to suggest that Virginia was fertile and its people friendly and manageable.
    explanation: |
      Three points, one per part.

      (a) 1 pt: a feature from the image, described: permanent town; bark houses; maize agriculture with several plantings; communal meals; religious ceremonies. Zero for a feature not in the description.

      (b) 1 pt: a link between environment and society: fertile soil and rainfall supporting maize; a long growing season allowing staggered plantings; forests providing bark and poles for houses; a coastal setting with fish and game supplementing crops. Must explain how the environment shaped the society.

      (c) 1 pt: connects the expedition's promotional purpose, audience or English point of view to the image: an idealised, orderly picture to attract investors; European artistic conventions shaping the scene; an outsider's selective view. Zero for "he was biased" without explanation.

  - slug: apush-u01-exam-q45
    type: long_answer
    topic_code: "1.4"
    source: "general knowledge"
    points: 6
    prompt: |
      After 1492 the Columbian Exchange carried plants, animals, diseases, people and precious metals across the Atlantic in both directions. Historians have examined its effects through several lines of analysis, including demographic, economic, environmental and social change.

      Evaluate the extent to which the Columbian Exchange transformed societies in the Americas and Europe from 1492 to 1607.

      In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
    answer: |
      Thesis: The Columbian Exchange transformed Native American societies far more deeply than European ones before 1607: epidemics and livestock shattered Native populations and environments and made Spanish conquest and new labor systems possible, while in Europe American silver reshaped economies and rivalries but basic social structures continued.

      Context: The hemispheres had been separate for thousands of years. European states, seeking wealth and converts and equipped with new ships, crossed the Atlantic after 1492, and Spain built an empire in the Caribbean, Mexico and Peru.

      Body 1 (Americas, demographic): smallpox in Tenochtitlan (1520) and in the Andes before Pizarro; population declines by most estimates of 80–90% in many regions; Harriot's report of deaths after English visits.

      Body 2 (Americas, economic and social): cattle, pigs and sheep on Native fields; wheat and sugar; encomienda and mita; enslaved Africans; the casta system and religious syncretism.

      Body 3 (Europe): Potosí silver (1545) financing Spain and contributing to inflation; trade with Asia; new crops whose full effect on European diets and population came after 1607 (continuity in the short run).

      Conclusion: transformation in the Americas, significant economic change but greater continuity in Europe within the period.
    explanation: |
      Scored on the six-point LEQ rubric.

      Thesis/claim (0–1): a defensible claim that evaluates the extent of transformation, ideally distinguishing between the Americas and Europe or between kinds of change. Zero for a claim that only restates the prompt.

      Contextualization (0–1): describes a relevant broader context: the long separation of the hemispheres; European motives and technologies; the Reconquista and Iberian rivalry; the diversity of Native societies before 1492. Must be more than a phrase.

      Evidence (0–2): 1 pt for at least two specific examples: smallpox, measles or influenza epidemics; Tenochtitlan in 1520; the Inca civil war; population decline; horses, cattle and pigs; wheat and sugarcane; maize, potatoes, tomatoes, cacao and tobacco; Potosí silver (1545) and the mita; the price revolution; the encomienda and the turn to African slavery; the casta system; Harriot's account of epidemics at Roanoke. 2 pts when the evidence supports the argument about the extent of transformation.

      Analysis and reasoning (0–2): 1 pt for using causation, comparison (Americas and Europe) or continuity and change to frame the argument. 1 pt for complex understanding, e.g. distinguishing short- and long-term effects (American crops' main effect on European population came later); weighing biological against human causes; explaining both change and continuity; considering several societies (Native, European, African).

      Common errors: treating the exchange as only food; placing horse cultures on the Plains before 1607; ignoring Africans; ignoring human decisions that made disease worse.
