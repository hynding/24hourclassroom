unit: 1
description: |
  45 questions · about 75 minutes · every topic of Period 1 (1.1 to 1.7). Because this is the first unit there is no
  earlier period to review, so the whole exam is Period 1, with five source-based multiple-choice sets in the AP
  style (primary sources, interpretations written for this course and a described map), select-all, true/false and
  fill-in-the-blank items, two short-answer questions (3 points each) and one long essay question (6 points).
  Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
  automatically; the free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: Columbus promises the monarchs (1.3, 1.5, 1.7, 1.6)
  - slug: apush-u01-exam-q01
    type: multiple_choice
    topic_code: "1.3"
    source: "Primary source: Christopher Columbus, letter on the first voyage (1493), trans. Cecil Jane (1930), Early Americas Digital Archive, University of Maryland"
    points: 1
    stimulus: |
      "I will give them as much gold as they may need . . . moreover, I will give them spices and cotton, as much as their highnesses shall command; and mastic, as much as they shall order to be shipped . . . and aloe, as much as they shall order to be shipped; and slaves, as many as they shall order to be shipped . . ."

      — Christopher Columbus, letter on his first voyage, 1493, referring to Ferdinand and Isabella of Spain ("them", "their highnesses")
    prompt: |
      The excerpt most directly reflects which motive for European exploration?
    options:
      - "The wish to escape overpopulation in Spanish cities"
      - "A desire to establish religious freedom for persecuted minorities"
      - "The search for new sources of wealth to enrich the Crown and its sponsors"
      - "Scientific curiosity about American plants with no thought of profit"
    option_explanations:
      - |
        Spain was not sending settlers to relieve overpopulation; the letter says nothing about migration.
      - |
        Religious freedom was not a Spanish aim; Spain had just expelled its Jews and sought religious unity under Catholicism.
      - |
        Correct. Gold, spices, cotton, mastic, aloe and slaves are all commodities; Columbus is promising his sponsors a return on their investment.
      - |
        The plants Columbus lists are valuable trade goods, and he promises them "as much as they shall order to be shipped", the language of commerce, not science.
    answer: 2
    explanation: |
      Skill: sourcing (purpose). Columbus is reporting to and persuading his sponsors; his list is a promise of profit, the "gold" in God, gold and glory.

  - slug: apush-u01-exam-q02
    type: multiple_choice
    topic_code: "1.5"
    source: "Primary source: Christopher Columbus, letter on the first voyage (1493), trans. Cecil Jane (1930), Early Americas Digital Archive, University of Maryland"
    points: 1
    stimulus: |
      "I will give them as much gold as they may need . . . moreover, I will give them spices and cotton, as much as their highnesses shall command; and mastic, as much as they shall order to be shipped . . . and aloe, as much as they shall order to be shipped; and slaves, as many as they shall order to be shipped . . ."

      — Christopher Columbus, letter on his first voyage, 1493, referring to Ferdinand and Isabella of Spain ("them", "their highnesses")
    prompt: |
      Columbus's offer of "slaves" foreshadowed which development in the Spanish Caribbean over the following decades?
    options:
      - "A system of free wage labor on Caribbean sugar plantations"
      - "The rise of indentured servitude among English migrants"
      - "The use of coerced Native labor through enslavement and the encomienda, followed by the importation of enslaved Africans"
      - "The end of all forced labor in the Spanish empire by 1510"
    option_explanations:
      - |
        Caribbean sugar was worked by enslaved Africans, not wage earners.
      - |
        Indentured servitude belongs to the English Chesapeake of the 1600s, not the Spanish Caribbean.
      - |
        Correct. Columbus himself shipped Taíno captives to Spain; colonists then forced Native people to work under the encomienda, and as those populations collapsed they turned to enslaved Africans.
      - |
        Coerced labor expanded rather than ended; the New Laws of 1542 limited it on paper decades later and were only partly enforced.
    answer: 2
    explanation: |
      Skill: causation and continuity. From the first letter, the Spanish imagined the Americas as a source of coerced labor; the labor system of topic 1.5 grew from that assumption.

  - slug: apush-u01-exam-q03
    type: multiple_choice
    topic_code: "1.7"
    source: "Primary source: Christopher Columbus, letter on the first voyage (1493), trans. Cecil Jane (1930), Early Americas Digital Archive, University of Maryland"
    points: 1
    stimulus: |
      "I will give them as much gold as they may need . . . moreover, I will give them spices and cotton, as much as their highnesses shall command; and mastic, as much as they shall order to be shipped . . . and aloe, as much as they shall order to be shipped; and slaves, as many as they shall order to be shipped . . ."

      — Christopher Columbus, letter on his first voyage, 1493, referring to Ferdinand and Isabella of Spain ("them", "their highnesses")
    prompt: |
      Which of the following was the most significant long-term economic result of the hopes expressed in the excerpt?
    options:
      - "Cotton from Hispaniola started the Industrial Revolution in the 1500s."
      - "Silver from mines such as Potosí and Zacatecas enriched Spain and flowed through Europe and Asia, contributing to inflation and to the growth of global trade."
      - "The Caribbean became the main source of spices for Europe."
      - "Spain found no precious metals in the Americas and abandoned its colonies."
    option_explanations:
      - |
        Industrialization came in the late 1700s; it was not caused by sixteenth-century Caribbean cotton.
      - |
        Correct. Columbus's gold was disappointing, but the silver of Mexico and Peru from the 1540s made Spain the richest power in Europe, fed a price revolution and paid for trade with China.
      - |
        Spices came mainly from Asia; the Portuguese, and later the Dutch, controlled that trade.
      - |
        Spain found enormous quantities of silver and some gold, and its American empire lasted three centuries.
    answer: 1
    explanation: |
      Skill: causation (long-term effects). The Columbian Exchange reshaped the world economy chiefly through American silver.

  - slug: apush-u01-exam-q04
    type: multiple_choice
    topic_code: "1.6"
    source: "Primary source: Christopher Columbus, letter on the first voyage (1493), trans. Cecil Jane (1930), Early Americas Digital Archive, University of Maryland"
    points: 1
    stimulus: |
      "I will give them as much gold as they may need . . . moreover, I will give them spices and cotton, as much as their highnesses shall command; and mastic, as much as they shall order to be shipped . . . and aloe, as much as they shall order to be shipped; and slaves, as many as they shall order to be shipped . . ."

      — Christopher Columbus, letter on his first voyage, 1493, referring to Ferdinand and Isabella of Spain ("them", "their highnesses")
    prompt: |
      Which person most directly challenged the attitude toward Native people reflected in the excerpt?
    options:
      - "Juan Ginés de Sepúlveda"
      - "Hernán Cortés"
      - "Juan de Oñate"
      - "Bartolomé de las Casas"
    option_explanations:
      - |
        Sepúlveda defended conquest and forced labor at the Valladolid debate, arguing that Native people were natural inferiors.
      - |
        Cortés conquered the Mexica Empire and distributed its people in encomiendas; he shared, rather than challenged, the view of Native people as a source of labor and wealth.
      - |
        Oñate conquered New Mexico in 1598 and brutally punished Acoma Pueblo; he was no critic of conquest.
      - |
        Correct. Las Casas, a former encomendero turned Dominican friar, condemned enslavement and forced labor and argued that Native people must be converted peacefully.
    answer: 3
    explanation: |
      Skill: making connections. Treating people as commodities provoked a critique from within Spain itself.

  # ---- Stimulus set B: Harriot on Algonquian religion (1.2, 1.6, 1.1)
  - slug: apush-u01-exam-q05
    type: multiple_choice
    topic_code: "1.2"
    source: "Primary source: Thomas Harriot, A Briefe and True Report of the New Found Land of Virginia (1588; 1590 edition), Project Gutenberg"
    points: 1
    stimulus: |
      "They beleeue that there are many Gods which they call Montóac, but of different sortes and degrees; one onely chiefe and great God, which hath bene from all eternitie. Who as they affirme when hee purposed to make the worlde, made first other goddes of a principall order to bee as meanes and instruments . . ."

      — Thomas Harriot, English member of the Roanoke expedition, describing the religion of the Carolina Algonquians, A Briefe and True Report of the New Found Land of Virginia, 1588 (original spelling)
    prompt: |
      The excerpt provides evidence that Carolina Algonquian society before sustained European contact
    options:
      - "had already converted to Catholicism through contact with Spain"
      - "had no religious beliefs until missionaries arrived"
      - "had a complex system of religious belief with its own account of the creation of the world"
      - "worshipped European monarchs as gods"
    option_explanations:
      - |
        The beliefs described are not Christian, and the Carolina coast had seen almost no Spanish missionaries.
      - |
        Harriot describes a developed religion with many gods and a creation account; it existed before any missionary.
      - |
        Correct. Ranked gods, an eternal chief god and a story of creation show an elaborate belief system, part of the cultural diversity of topic 1.2.
      - |
        Nothing in the excerpt refers to Europeans; it describes Algonquian ideas about the gods and creation.
    answer: 2
    explanation: |
      Skill: claims and evidence. Use the details of a source (ranked gods, creation) as evidence of a complex society.

  - slug: apush-u01-exam-q06
    type: multiple_choice
    topic_code: "1.6"
    source: "Primary source: Thomas Harriot, A Briefe and True Report of the New Found Land of Virginia (1588; 1590 edition), Project Gutenberg"
    points: 1
    stimulus: |
      "They beleeue that there are many Gods which they call Montóac, but of different sortes and degrees; one onely chiefe and great God, which hath bene from all eternitie. Who as they affirme when hee purposed to make the worlde, made first other goddes of a principall order to bee as meanes and instruments . . ."

      — Thomas Harriot, English member of the Roanoke expedition, describing the religion of the Carolina Algonquians, A Briefe and True Report of the New Found Land of Virginia, 1588 (original spelling)
    prompt: |
      Which of the following best describes a limitation of the excerpt as evidence of Algonquian beliefs?
    options:
      - "The excerpt was written by an Algonquian priest and is therefore biased."
      - "Harriot never met any Algonquians."
      - "The excerpt describes the Aztecs rather than the Algonquians."
      - "Harriot, a Christian outsider relying on interpreters, may have described Algonquian ideas in terms of Christian categories such as one eternal chief god."
    option_explanations:
      - |
        The author is the Englishman Harriot; no Algonquian wrote this text.
      - |
        Harriot lived among the Carolina Algonquians in 1585–86; his access was real, though limited.
      - |
        The Mexica (Aztecs) lived in central Mexico; Harriot describes the peoples of the Carolina coast.
      - |
        Correct. Point of view matters: an English Christian, learning through translation, would look for familiar patterns and might shape what he heard to fit them.
    answer: 3
    explanation: |
      Skill: sourcing (point of view). An observer's own beliefs shape what he notices and how he translates it.

  - slug: apush-u01-exam-q07
    type: multiple_choice
    topic_code: "1.1"
    source: "Primary source: Thomas Harriot, A Briefe and True Report of the New Found Land of Virginia (1588; 1590 edition), Project Gutenberg"
    points: 1
    stimulus: |
      "They beleeue that there are many Gods which they call Montóac, but of different sortes and degrees; one onely chiefe and great God, which hath bene from all eternitie. Who as they affirme when hee purposed to make the worlde, made first other goddes of a principall order to bee as meanes and instruments . . ."

      — Thomas Harriot, English member of the Roanoke expedition, describing the religion of the Carolina Algonquians, A Briefe and True Report of the New Found Land of Virginia, 1588 (original spelling)
    prompt: |
      Harriot's report was part of English efforts in the 1580s to
    options:
      - "convert the Aztecs to Protestant Christianity"
      - "enforce the Treaty of Tordesillas"
      - "build an empire in Mexico to rival Spain's"
      - "encourage investment in a colony in North America, challenging Spanish dominance in the Americas"
    option_explanations:
      - |
        Harriot wrote about the Carolina Algonquians, not the Mexica, and his report is promotional rather than missionary.
      - |
        England was not a party to the treaty and rejected a division of the world that excluded it.
      - |
        England never attempted to conquer Mexico; its efforts focused on the North American coast north of Spanish Florida.
      - |
        Correct. Raleigh's Roanoke venture, which Harriot promoted, was England's first attempt at a colony; England, excluded by Tordesillas, wanted a share of American wealth and a base against Spain.
    answer: 3
    explanation: |
      Skill: contextualization. Place the source in the rivalry among European states that runs through Period 1.

  # ---- Stimulus set C: an interpretation of the Columbian Exchange (1.4, 1.7, 1.2)
  - slug: apush-u01-exam-q08
    type: multiple_choice
    topic_code: "1.4"
    source: "Interpretation written for this course"
    points: 1
    stimulus: |
      Interpretation (written for this course): The most important consequences of 1492 were biological. Ships carried not just soldiers and priests but seeds, livestock and germs. Smallpox, measles and influenza killed far more Native people than Spanish swords did, emptying villages before many Europeans ever saw them. Pigs, cattle and horses spread across the land, eating Native crops and changing whole ecosystems. In the other direction, maize and potatoes would one day feed growing populations in Europe, Africa and China. Historians who take this view argue that the conquest is best understood as an ecological event in which human choices mattered less than the organisms that crossed the ocean with them.
    prompt: |
      Which of the following provides the strongest support for the interpretation?
    options:
      - "Columbus believed he had reached Asia."
      - "England's colony at Roanoke failed."
      - "Spanish expeditions north of Mexico found epidemics had sometimes reduced populations before the Spaniards arrived."
      - "Spain and Portugal signed the Treaty of Tordesillas in 1494."
    option_explanations:
      - |
        Columbus's geographic mistake is a matter of human belief, not biology.
      - |
        Roanoke's failure involved supply, leadership and Native relations, not clear evidence of biological causes.
      - |
        Correct. Disease travelling ahead of Europeans, as in the Andes before Pizarro and in parts of the Southeast, shows organisms acting independently of human choice, which is the interpretation's core claim.
      - |
        A diplomatic treaty is a human choice; it does not support an ecological explanation.
    answer: 2
    explanation: |
      Skill: claims and evidence. Match evidence to the specific claim: here, biology acting ahead of human decisions.

  - slug: apush-u01-exam-q09
    type: multiple_choice
    topic_code: "1.7"
    source: "Interpretation written for this course"
    points: 1
    stimulus: |
      Interpretation (written for this course): The most important consequences of 1492 were biological. Ships carried not just soldiers and priests but seeds, livestock and germs. Smallpox, measles and influenza killed far more Native people than Spanish swords did, emptying villages before many Europeans ever saw them. Pigs, cattle and horses spread across the land, eating Native crops and changing whole ecosystems. In the other direction, maize and potatoes would one day feed growing populations in Europe, Africa and China. Historians who take this view argue that the conquest is best understood as an ecological event in which human choices mattered less than the organisms that crossed the ocean with them.
    prompt: |
      A historian who disagreed with the interpretation would most likely emphasise
    options:
      - "the spread of potatoes in Europe"
      - "the arrival of horses in the Americas"
      - "the spread of smallpox through Tenochtitlan in 1520"
      - "deliberate Spanish policies such as the encomienda, forced labor in mines and violent conquest, which worsened the effects of disease"
    option_explanations:
      - |
        Potatoes in Europe are an example used by the interpretation itself.
      - |
        Horses are part of the biological exchange the interpretation stresses.
      - |
        The smallpox epidemic is the interpretation's best evidence, not a counter to it.
      - |
        Correct. Critics argue that human decisions, overwork, displacement and violence, made populations far more vulnerable to disease; the catastrophe was not simply natural.
    answer: 3
    explanation: |
      Skill: argumentation. The counter-argument restores human agency: disease and policy worked together.

  - slug: apush-u01-exam-q10
    type: multiple_choice
    topic_code: "1.4"
    source: "Interpretation written for this course"
    points: 1
    stimulus: |
      Interpretation (written for this course): The most important consequences of 1492 were biological. Ships carried not just soldiers and priests but seeds, livestock and germs. Smallpox, measles and influenza killed far more Native people than Spanish swords did, emptying villages before many Europeans ever saw them. Pigs, cattle and horses spread across the land, eating Native crops and changing whole ecosystems. In the other direction, maize and potatoes would one day feed growing populations in Europe, Africa and China. Historians who take this view argue that the conquest is best understood as an ecological event in which human choices mattered less than the organisms that crossed the ocean with them.
    prompt: |
      The spread of horses described in the interpretation most significantly affected which group in the centuries that followed?
    options:
      - "English settlers at Roanoke, who brought the first horses to America"
      - "Pacific Northwest peoples, who used horses to catch salmon"
      - "The Mexica of Tenochtitlan, who used horses to defeat Cortés"
      - "Peoples of the Great Plains, many of whom became mounted bison hunters"
    option_explanations:
      - |
        The Spanish brought horses to the Americas from Columbus's second voyage (1493); Roanoke came nearly a century later.
      - |
        Salmon fishing did not depend on horses, and the Northwest coast was little affected by them in this period.
      - |
        The Mexica had no horses; Spanish cavalry was one of Cortés's advantages.
      - |
        Correct. Horses spreading north from Spanish New Mexico transformed Plains peoples' hunting, warfare, trade and mobility, especially after 1680.
    answer: 3
    explanation: |
      Skill: causation and continuity and change. A Period 1 cause (the horse) had its greatest effect in later periods on the Plains.

  - slug: apush-u01-exam-q11
    type: multiple_choice
    topic_code: "1.2"
    source: "Interpretation written for this course"
    points: 1
    stimulus: |
      Interpretation (written for this course): The most important consequences of 1492 were biological. Ships carried not just soldiers and priests but seeds, livestock and germs. Smallpox, measles and influenza killed far more Native people than Spanish swords did, emptying villages before many Europeans ever saw them. Pigs, cattle and horses spread across the land, eating Native crops and changing whole ecosystems. In the other direction, maize and potatoes would one day feed growing populations in Europe, Africa and China. Historians who take this view argue that the conquest is best understood as an ecological event in which human choices mattered less than the organisms that crossed the ocean with them.
    prompt: |
      The interpretation's reference to maize is best explained by the fact that before 1492 maize had
    options:
      - "been grown only in the Pacific Northwest"
      - "been a wild plant that no Native society cultivated"
      - "been brought to the Americas by the Norse"
      - "been domesticated in Mexico and spread across much of North America, supporting settled farming societies"
    option_explanations:
      - |
        Northwest coastal peoples relied on fishing and gathering; maize was grown in the Southwest, Mississippi Valley and East.
      - |
        Maize was a fully domesticated crop, the result of deliberate cultivation and breeding by Native farmers.
      - |
        The Norse brought no crops that took root; maize is native to the Americas.
      - |
        Correct. Thousands of years of Native breeding produced a crop productive enough to support Pueblo towns, Cahokia and Eastern villages, and later to feed people on other continents.
    answer: 3
    explanation: |
      Skill: making connections. The crops that crossed to Europe were Native achievements from topic 1.2.

  # ---- Stimulus set D: a described map of Spanish North America (1.4, 1.3, 1.6)
  - slug: apush-u01-exam-q12
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      Map description: A map titled "Spanish Expeditions and Settlements North of Mexico, 1513–1598" shows the present-day southern United States. Routes are drawn for Ponce de León (Florida, 1513), the Narváez expedition and Cabeza de Vaca (Florida to the Gulf Coast, then overland across Texas to northern Mexico, 1528–1536), Hernando de Soto (from Florida through the Southeast and across the Mississippi River, 1539–1542), and Francisco Vázquez de Coronado (from northern Mexico through Zuni and the Rio Grande pueblos to present-day Kansas, 1540–1542). Two settlements are marked: St. Augustine (1565) on the Atlantic coast of Florida and San Gabriel in New Mexico (1598), with Acoma Pueblo labelled nearby.
    prompt: |
      The routes shown on the map were most directly motivated by
    options:
      - "a plan to establish trading posts for the French fur trade"
      - "Spanish hopes of finding wealthy empires like those of the Aztecs and Inca"
      - "a Spanish policy of avoiding contact with Native peoples"
      - "the search for land for English Protestant refugees"
    option_explanations:
      - |
        The fur trade was French and centred on the St. Lawrence, not on these southern routes.
      - |
        Correct. After Mexico and Peru, Spanish leaders hoped for more cities of gold; Coronado sought the fabled Seven Cities of Cíbola and Quivira.
      - |
        These expeditions sought out Native towns, often seizing food and captives; they did not avoid contact.
      - |
        These were Spanish Catholic expeditions; English Protestant settlement came later and farther north.
    answer: 1
    explanation: |
      Skill: contextualization. The early conquests set expectations that drove northern exploration.

  - slug: apush-u01-exam-q13
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      Map description: A map titled "Spanish Expeditions and Settlements North of Mexico, 1513–1598" shows the present-day southern United States. Routes are drawn for Ponce de León (Florida, 1513), the Narváez expedition and Cabeza de Vaca (Florida to the Gulf Coast, then overland across Texas to northern Mexico, 1528–1536), Hernando de Soto (from Florida through the Southeast and across the Mississippi River, 1539–1542), and Francisco Vázquez de Coronado (from northern Mexico through Zuni and the Rio Grande pueblos to present-day Kansas, 1540–1542). Two settlements are marked: St. Augustine (1565) on the Atlantic coast of Florida and San Gabriel in New Mexico (1598), with Acoma Pueblo labelled nearby.
    prompt: |
      Spain founded St. Augustine in 1565 mainly to
    options:
      - "serve as the capital of New Spain"
      - "protect the routes of Spanish treasure fleets and remove a nearby French Protestant outpost"
      - "begin large-scale tobacco farming"
      - "serve as a base for trade with the Iroquois"
    option_explanations:
      - |
        The capital of New Spain was Mexico City, built on the ruins of Tenochtitlan.
      - |
        Correct. Treasure fleets sailed home along the Florida coast; Pedro Menéndez de Avilés founded St. Augustine and destroyed the French settlement at Fort Caroline.
      - |
        Commercial tobacco farming is associated with English Virginia after 1612.
      - |
        The Iroquois lived far to the north; their European partners were the Dutch, French and English.
    answer: 1
    explanation: |
      Skill: causation. European rivalry and the silver trade explain Spain's first lasting settlement in what became the United States.

  - slug: apush-u01-exam-q14
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Map description: A map titled "Spanish Expeditions and Settlements North of Mexico, 1513–1598" shows the present-day southern United States. Routes are drawn for Ponce de León (Florida, 1513), the Narváez expedition and Cabeza de Vaca (Florida to the Gulf Coast, then overland across Texas to northern Mexico, 1528–1536), Hernando de Soto (from Florida through the Southeast and across the Mississippi River, 1539–1542), and Francisco Vázquez de Coronado (from northern Mexico through Zuni and the Rio Grande pueblos to present-day Kansas, 1540–1542). Two settlements are marked: St. Augustine (1565) on the Atlantic coast of Florida and San Gabriel in New Mexico (1598), with Acoma Pueblo labelled nearby.
    prompt: |
      The label for Acoma Pueblo near the 1598 settlement in New Mexico is most relevant to which development?
    options:
      - "Peaceful acceptance of Spanish rule by all Pueblo peoples"
      - "The first English settlement in the Southwest"
      - "Pueblo resistance to Juan de Oñate, which Spanish forces crushed with great brutality in 1599"
      - "The founding of the Iroquois Confederacy"
    option_explanations:
      - |
        Pueblo peoples resisted Spanish demands from the start; Acoma is the best-known example.
      - |
        There were no English settlements in the Southwest; New Mexico was Spanish.
      - |
        Correct. When Acoma resisted Oñate's demands, his soldiers destroyed the pueblo, killed hundreds and sentenced survivors to servitude and mutilation, an episode that foreshadowed the Pueblo Revolt of 1680.
      - |
        The Iroquois league was a Northeastern confederacy with no connection to New Mexico.
    answer: 2
    explanation: |
      Skill: making connections. Native resistance and Spanish violence in 1599 set the pattern of conflict in New Mexico for Period 2.

  # ---- Stand-alone multiple choice
  - slug: apush-u01-exam-q15
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which environmental factor best explains why Ancestral Puebloan and Pueblo peoples built irrigation works?
    options:
      - "The need to transport goods by canal to the Atlantic coast"
      - "Frozen ground that prevented planting"
      - "An arid climate with scarce, unpredictable rain, which made capturing and directing water necessary for maize farming"
      - "Heavy year-round rainfall that flooded their fields"
    option_explanations:
      - |
        Southwestern water works were for farming, not long-distance transport.
      - |
        Frozen soil was not the constraint; water was.
      - |
        Correct. Ditches, dams and terraces caught rain and runoff so that maize, beans and squash could grow in desert country.
      - |
        The Southwest is dry; the problem was too little water, not too much.
    answer: 2
    explanation: |
      Skill: causation. Environment created the problem; irrigation was the Pueblo solution that made settled life possible.

  - slug: apush-u01-exam-q16
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following was a direct consequence of Portugal's voyages along the West African coast in the 1400s?
    options:
      - "The conquest of the Mexica Empire"
      - "The founding of Jamestown"
      - "Portuguese trading posts such as Elmina and Atlantic island sugar plantations worked by enslaved Africans"
      - "The Protestant Reformation"
    option_explanations:
      - |
        The Mexica were conquered by Spaniards in 1519–1521, not by the Portuguese.
      - |
        Jamestown (1607) was English and over a century later.
      - |
        Correct. Portuguese voyages produced coastal trade with African states, forts such as Elmina (1482), and sugar plantations on Madeira and São Tomé that used enslaved African labor.
      - |
        The Reformation was a religious movement within Europe beginning in 1517; it did not result from African voyages.
    answer: 2
    explanation: |
      Skill: causation. Portugal's African enterprise created institutions, trade with Africa and plantation slavery, that crossed the Atlantic.

  - slug: apush-u01-exam-q17
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which development most directly made long-distance Atlantic voyages practical in the late 1400s?
    options:
      - "Improvements in ships and navigation, such as the caravel, the magnetic compass and the astrolabe"
      - "The domestication of the horse in the Americas"
      - "The invention of the telegraph"
      - "The steam engine"
    option_explanations:
      - |
        Correct. Ships that could sail against the wind and instruments that found latitude and direction let sailors go far from land and return.
      - |
        Horses were brought to the Americas by Europeans, after the voyages began.
      - |
        The telegraph is a nineteenth-century invention.
      - |
