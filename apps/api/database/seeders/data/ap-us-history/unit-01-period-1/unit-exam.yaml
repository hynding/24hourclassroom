      Two positions at the Valladolid debate, 1550–1551 (summaries written for this course, not quotations)

      Position 1, Juan Ginés de Sepúlveda: Some peoples are by nature suited to be ruled by others. The inhabitants of the Indies practised customs Europeans considered barbaric, such as human sacrifice, and lacked what Europeans considered true civilization. War against them is therefore just, and placing them under Spanish rule benefits them by bringing order and Christianity.

      Position 2, Bartolomé de las Casas: The peoples of the Indies are rational human beings with their own governments, laws, cities and arts. No people may be conquered on the grounds of their customs. Christianity must be spread only by peaceful persuasion and good example, and the wars and forced labor imposed on them are unjust.
    prompt: |
