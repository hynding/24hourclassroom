week: 2
unit: 1
title: "Exploration, Conquest and the Columbian Exchange"
topics: ["1.3", "1.4", "1.5", "1.6", "1.7"]
guide: guides/week-02.md
guide_description: |
  Why Europeans crossed the Atlantic and what happened when they did: Columbus and the Treaty of Tordesillas, the
  conquests of the Aztec and Inca empires, the Columbian Exchange of crops, animals and diseases, the encomienda,
  African slavery and the casta system, and the ways Native peoples, Africans and Europeans resisted, adapted and
  argued, from the Valladolid debate to Roanoke. Worked examples: sourcing Las Casas, an SAQ answered part by part,
  and a causation chain from silver to world trade.
flashcards_description: |
  32 cards on the voyages of exploration, the Spanish conquests and northern expeditions, the Columbian Exchange,
  Spanish colonial labor systems and the casta system, and the cultural encounters of the 1500s.

flashcards:
  - front: Columbus's first voyage, 1492 → sponsor, landfall, what he thought he had found
    back: |
      Funded by Ferdinand and Isabella of Spain, Columbus sailed west to reach Asia and landed on October 12, 1492, on an island in the Bahamas its Taíno inhabitants called Guanahani. He believed until his death that he had reached the edge of Asia, which is why Europeans called the people "Indians".
    topic_code: "1.3"
  - front: Columbus's 1493 letter on the first voyage → why it mattered in Europe
    back: |
      Printed in Spanish in 1493 and quickly translated, it spread news of islands, gold and gentle, unarmed people across Europe. It was promotional: it promised the monarchs gold, spices and slaves, and it encouraged further voyages.
    topic_code: "1.3"
  - front: Treaty of Tordesillas, 1494 → terms and one long-term effect
    back: |
      Spain and Portugal divided newly found lands along a north-south line 370 leagues west of the Cape Verde Islands: west to Castile, east to Portugal. Because Brazil bulges east of that line, Portugal claimed it after 1500, which is why Brazilians speak Portuguese.
    topic_code: "1.3"
  - front: John Cabot, 1497 → who sponsored him and what it led to
    back: |
      An Italian navigator sailing for Henry VII of England, he reached Newfoundland or nearby coasts. The voyage became the basis for later English claims to North America, though England did not plant lasting colonies until 1607.
    topic_code: "1.3"
  - front: Jacques Cartier, 1534–1542 → where and what France gained
    back: |
      A French navigator who explored the Gulf of St. Lawrence and the St. Lawrence River, reaching Iroquoian towns at Stadacona and Hochelaga. His voyages grounded French claims to Canada and the later fur trade.
    topic_code: "1.3"
  - front: Spain, Portugal, France and England in the 1500s → who did what first
    back: |
      Spain conquered and settled the Caribbean, Mexico and Peru; Portugal traded along Africa and Asia and settled Brazil; France explored the St. Lawrence and fished the Grand Banks; England sent Cabot, later privateers, and the failed Roanoke colony. Lasting French and English colonies came after 1600.
    topic_code: "1.3"
  - front: Hernán Cortés and the fall of Tenochtitlan, 1519–1521 → four reasons the Spanish won
    back: |
      Tens of thousands of Native allies, above all Tlaxcalans who resented Mexica rule; a smallpox epidemic in 1520 that killed many defenders, including the emperor Cuitláhuac; steel weapons, horses and guns; and the interpreter Malintzin (La Malinche). Allies and disease mattered most.
    topic_code: "1.4"
  - front: Malintzin (La Malinche) → who she was and why she mattered
    back: |
      A Nahua woman given to Cortés in 1519 who spoke Nahuatl and Maya and learned Spanish. As interpreter and adviser she was essential to Spanish diplomacy with Native allies. Later Mexicans have seen her as a traitor, a victim or a founding mother of mestizo Mexico.
    topic_code: "1.6"
  - front: Francisco Pizarro and the Inca, 1532–1533 → why a few hundred Spaniards prevailed
    back: |
      Epidemic disease had already killed the Inca ruler Huayna Capac and set off a civil war between his sons; Pizarro captured the victor, Atahualpa, at Cajamarca in 1532, took a huge ransom in gold and silver and executed him in 1533.
    topic_code: "1.4"
  - front: Columbian Exchange → definition
    back: |
      The transfer of plants, animals, people, diseases and ideas between the Eastern and Western Hemispheres after 1492. The term was coined by the historian Alfred Crosby in 1972. It transformed diets, environments and populations on every continent.
    topic_code: "1.4"
  - front: Columbian Exchange → from the Americas to Europe, Africa and Asia
    back: |
      Maize, potatoes, sweet potatoes, tomatoes, beans, squash, chili peppers, cacao, peanuts and tobacco, plus silver and gold. Maize and potatoes, high in calories, later helped populations grow in Europe, Africa and China.
    topic_code: "1.4"
  - front: Columbian Exchange → from Europe and Africa to the Americas
    back: |
      Horses, cattle, pigs, sheep, chickens; wheat, rice, sugarcane, bananas and coffee; and diseases including smallpox, measles and influenza (with malaria and yellow fever arriving from Africa). Livestock and diseases reshaped Native life more than any crop.
    topic_code: "1.4"
  - front: Virgin-soil epidemics → why smallpox was so deadly in the Americas
    back: |
      Native Americans had been isolated from Old World diseases for thousands of years, so no one had acquired immunity. Smallpox, measles and influenza swept through whole populations at once, killing adults who farmed, fought and led, and populations in many regions fell by most estimates by 80–90% or more within a century.
    topic_code: "1.4"
  - front: Potosí silver strike, 1545 → effects on the world economy
    back: |
      A mountain of silver in the Andes (in present-day Bolivia), worked by Native labor drafted through the mita, made Spain rich, flooded Europe with silver that fed inflation, and paid for trade with China through the Manila galleons. A clear case of the Columbian Exchange shifting the world economy.
    topic_code: "1.4"
  - front: American silver in Europe → what it did to the economy
    back: |
      The flow of silver contributed to sixteenth-century inflation (the price revolution), financed Spain's wars and helped the shift from feudal to commercial, capitalist economies in Western Europe as merchants and joint-stock ventures grew.
    topic_code: "1.7"
  - front: Spanish expeditions into North America, 1513–1542 → four names
    back: |
      Ponce de León (Florida, 1513); the Narváez expedition, survived by Cabeza de Vaca, who walked from Texas to Mexico (1528–1536); Hernando de Soto (the Southeast, 1539–1542); Francisco Vázquez de Coronado (the Southwest and Plains, 1540–1542). They found no new Aztec empires but spread disease and violence.
    topic_code: "1.4"
  - front: St. Augustine, 1565 → significance
    back: |
      Founded by Pedro Menéndez de Avilés to guard Spanish treasure fleets and destroy a nearby French Protestant outpost, it is the oldest continuously occupied European-founded city in the present-day United States.
    topic_code: "1.4"
  - front: Juan de Oñate and Acoma, 1598–1599 → what happened
    back: |
      Oñate led colonists into New Mexico in 1598 and claimed the Pueblo lands for Spain. When Acoma Pueblo resisted, his soldiers destroyed it, killed hundreds and sentenced survivors to servitude and maiming. The brutality foreshadowed the Pueblo Revolt of 1680.
    topic_code: "1.6"
  - front: Encomienda system → definition and purpose
    back: |
      A Spanish crown grant that gave a colonist the right to demand tribute and labor from the Native people of a district, in return for protecting them and teaching them Christianity. In practice it often meant forced labor and abuse. It answered the colonies' demand for labor.
    topic_code: "1.5"
  - front: New Laws of 1542 → what the Crown tried to do and how colonists reacted
    back: |
      Charles V's laws banned the enslavement of Native people and limited the encomienda, ending grants on the holder's death. Colonists resisted so fiercely, including a revolt in Peru, that parts were softened in 1545; labor drafts such as the repartimiento took its place over time.
    topic_code: "1.5"
  - front: Mita in Spanish Peru → origin and use
    back: |
      An Inca system of rotating labor service, adapted by the Spanish to draft Native men from Andean villages to work the silver mines at Potosí. Mortality was high; it shows the Spanish building on existing Native institutions.
    topic_code: "1.5"
  - front: Why did Spanish and Portuguese colonies turn to enslaved Africans? → cause and effect
    back: |
      Native populations were collapsing from disease and overwork, and the Crown restricted Native slavery; sugar plantations needed huge labor forces. From the early 1500s Africans were shipped to the Caribbean and Brazil, beginning the transatlantic slave trade that carried millions across the Atlantic.
    topic_code: "1.5"
  - front: Spanish casta system → what it was and its basic categories
    back: |
      A hierarchy that ranked people by ancestry and birthplace: peninsulares (born in Spain) at the top, then criollos (Spanish descent, born in the Americas), then people of mixed ancestry such as mestizos (Spanish and Native) and mulattoes (Spanish and African), then Native people and enslaved Africans.
    topic_code: "1.5"
  - front: Compare Spanish and later English colonization in Period 1 terms → one key difference
    back: |
      Spanish colonists, mostly men, intermarried with Native and African people and built a hierarchy that recognised mixed ancestry (the casta system); later English colonies brought more families and drew sharper lines of separation. Use this contrast when Period 2 asks for comparison.
    topic_code: "1.5"
  - front: Bartolomé de las Casas → who he was and what he argued
    back: |
      A former encomienda holder who became a Dominican friar and denounced Spanish cruelty, above all in A Brief Account of the Destruction of the Indies (written 1542, published 1552). He argued that Native people were rational human beings who must be converted peacefully. Protestant rivals later used his book as anti-Spanish propaganda (the Black Legend).
    topic_code: "1.6"
  - front: Valladolid debate, 1550–1551 → the two sides
    back: |
      Juan Ginés de Sepúlveda argued that Native people were natural inferiors who could be justly conquered and ruled; Las Casas argued that they were fully rational people with their own societies who must be brought to Christianity by peaceful persuasion. No formal verdict was given, but the debate shows Spaniards themselves contesting conquest.
    topic_code: "1.6"
  - front: Requerimiento (1513) → what it was and why historians cite it
    back: |
      A Spanish legal text read aloud, in Spanish, to Native people, demanding that they accept the authority of the Pope and the Spanish Crown or face war and enslavement. Paraphrased here. It shows how conquerors gave conquest a legal and religious justification that its audience could not understand.
    topic_code: "1.6"
  - front: Religious syncretism in the Spanish colonies → definition and example
    back: |
      The blending of religious traditions. Native and African converts often kept older beliefs alongside Catholic practice; devotion to the Virgin of Guadalupe, said by tradition to have appeared to a Nahua man near Mexico City in 1531, became a shared Native and Spanish symbol.
    topic_code: "1.6"
  - front: Native responses to Europeans in the 1500s → three patterns
    back: |
      Armed resistance (Acoma, the Calusa and others against Spanish expeditions); alliance with Europeans against rival peoples (the Tlaxcalans with Cortés); and selective adaptation, taking up European goods, animals and religious practices on Native terms.
    topic_code: "1.6"
  - front: Roanoke colony, 1585–1590 → what happened and why it matters
    back: |
      Walter Raleigh's attempts to plant an English colony on the Carolina coast. The first group went home in 1586; the 1587 settlers had vanished by 1590 (the Lost Colony). England learned that colonies needed steady supply, profit and workable relations with Native peoples.
    topic_code: "1.7"
  - front: Thomas Harriot on the deaths after English visits → what he observed and what it shows
    back: |
      Harriot noted that people in Algonquian towns began to die quickly, in numbers from twenty to over a hundred, soon after the English left. Unknowingly he recorded epidemic disease spreading from Europeans to people with no immunity.
    topic_code: "1.4"
  - front: Causation in Period 1 → the chain from transatlantic voyages to the Atlantic world
    back: |
      Voyages → the Columbian Exchange (crops, animals, disease) → Native population collapse and Spanish conquest → labor shortages filled by the encomienda and then by enslaved Africans → silver and sugar wealth that reshaped European economies and rivalries, setting the stage for English, French and Dutch colonies after 1607.
    topic_code: "1.7"

quiz:
  description: |
    25 questions · about 35 minutes · about 70% this week (exploration, conquest, the Columbian Exchange, the Spanish
    colonial system and cultural interaction, topics 1.3 to 1.7) and 30% review of week 1 (the world before 1492 and
    Native American societies). Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long essay are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Stimulus set A: Columbus's letter (1.3, 1.2, 1.6)
    - slug: apush-u01-w02-q01
      type: multiple_choice
      topic_code: "1.3"
      source: "Primary source: Christopher Columbus, letter on the first voyage (1493), trans. Cecil Jane (1930), Early Americas Digital Archive, University of Maryland"
      points: 1
      stimulus: |
        "The people of this island and of all the other islands which I found and of which I have information, all go naked, men and women, as their mothers bore them, although some of the women cover a single place with the leaf of a plant or with a net of cotton which they make for the purpose. They have no iron or steel or weapons, nor are they fitted to use them. This is not because they are not well built and of handsome stature, but because they are very marvellously timorous. It is true that, after they have been reassured and have lost this fear, they are so guileless and so generous with all that they possess, that no one would believe it who has not seen it."

        — Christopher Columbus, letter describing his first voyage, written in 1493 to Luis de Santángel, an official of the Spanish court, and printed that year
      prompt: |
        Columbus's description of the islanders was most likely intended to
      options:
        - "describe the Aztec Empire to European readers"
        - "argue that the islanders should be left alone because their way of life was superior"
        - "warn the Spanish monarchs that the islands were too dangerous to settle"
        - "persuade his royal sponsors that the islands could be easily controlled and that further voyages were worth funding"
      option_explanations:
        - |
          Columbus met Taíno islanders in the Caribbean; Spaniards did not reach the Aztec (Mexica) Empire until 1519.
        - |
          The letter admires their generosity but does so to show how easily they could be won over; elsewhere it promises the monarchs gold and slaves from the same islands.
        - |
          Columbus stresses that the people have no weapons and are timid, the opposite of a warning; he wanted more ships, not fewer.
        - |
          Correct. Writing to an official close to the monarchs, Columbus presents a people who are unarmed, fearful and generous, an easy field for conversion, trade and rule; the letter is a report and a sales pitch for further support.
      answer: 3
      explanation: |
        Skill: sourcing (purpose and audience). Ask who the letter was written to and what Columbus needed from them; the description of the people serves that purpose.

    - slug: apush-u01-w02-q02
      type: multiple_choice
      topic_code: "1.2"
      source: "Primary source: Christopher Columbus, letter on the first voyage (1493), trans. Cecil Jane (1930), Early Americas Digital Archive, University of Maryland"
      points: 1
      stimulus: |
        "The people of this island and of all the other islands which I found and of which I have information, all go naked, men and women, as their mothers bore them, although some of the women cover a single place with the leaf of a plant or with a net of cotton which they make for the purpose. They have no iron or steel or weapons, nor are they fitted to use them. This is not because they are not well built and of handsome stature, but because they are very marvellously timorous. It is true that, after they have been reassured and have lost this fear, they are so guileless and so generous with all that they possess, that no one would believe it who has not seen it."

        — Christopher Columbus, letter describing his first voyage, written in 1493 to Luis de Santángel, an official of the Spanish court, and printed that year
      prompt: |
        Review. A historian of Native societies would most likely caution that Columbus's description
      options:
        - "reflects a brief first encounter seen through European expectations; the Taíno in fact lived in farming villages under chiefs (caciques) and did use weapons such as clubs and spears"
        - "is accurate for all Native peoples of North America, including the Iroquois and Mississippians"
        - "proves that Caribbean peoples had no agriculture, government or warfare"
        - "shows that the islanders had already met Spanish traders before 1492"
      option_explanations:
        - |
          Correct. Columbus spent weeks among a few coastal groups, did not speak their language and judged by European standards (no iron meant no weapons); archaeology and later accounts show settled, organised Taíno societies.
        - |
          Week 1's main lesson is diversity: one Caribbean encounter cannot describe the Haudenosaunee confederacy or the mound-building chiefdoms of the Mississippi Valley.
        - |
          The letter is silent on farming and government, but silence is not proof; the Taíno grew cassava and maize and were organised into chiefdoms.
        - |
          The letter describes a first meeting; their fear at first sight suggests no earlier contact with Spaniards.
      answer: 0
      explanation: |
        Skill: sourcing and claims and evidence. Week 1 showed that Native societies were complex and varied; first-contact descriptions tell you as much about the observer as the observed.

    - slug: apush-u01-w02-q03
      type: multiple_choice
      topic_code: "1.6"
      source: "Primary source: Christopher Columbus, letter on the first voyage (1493), trans. Cecil Jane (1930), Early Americas Digital Archive, University of Maryland"
      points: 1
      stimulus: |
        "The people of this island and of all the other islands which I found and of which I have information, all go naked, men and women, as their mothers bore them, although some of the women cover a single place with the leaf of a plant or with a net of cotton which they make for the purpose. They have no iron or steel or weapons, nor are they fitted to use them. This is not because they are not well built and of handsome stature, but because they are very marvellously timorous. It is true that, after they have been reassured and have lost this fear, they are so guileless and so generous with all that they possess, that no one would believe it who has not seen it."

        — Christopher Columbus, letter describing his first voyage, written in 1493 to Luis de Santángel, an official of the Spanish court, and printed that year
      prompt: |
        Ideas like those expressed in the excerpt most directly contributed to which development in the decades after 1493?
      options:
        - "Spain's decision to abandon the Caribbean after 1500"
        - "A Native American alliance against the Spanish across the whole Caribbean"
        - "The spread of maize cultivation from Mexico into the American Southwest"
        - "Spanish colonists' belief that Native people could be made to work and convert, which supported the encomienda system"
      option_explanations:
        - |
          Spain did the reverse, building Hispaniola into the base for its empire in the Caribbean and beyond.
        - |
          Taíno resistance was real but local; there was no unified alliance, and the excerpt's ideas would not have produced one.
        - |
          Maize spread northward from Mexico centuries before 1492; European ideas had no part in it.
        - |
          Correct. Picturing islanders as gentle, unarmed and easily led fed the assumption that they could be put to work and converted; on Hispaniola that assumption became forced labor under the encomienda.
      answer: 3
      explanation: |
        Skill: causation (ideas as causes). European perceptions of Native peoples shaped the institutions Spain built; topic 1.6 asks you to connect the two.

    # ---- Stimulus set B: the Treaty of Tordesillas (1.3, 1.1, 1.7)
    - slug: apush-u01-w02-q04
      type: multiple_choice
      topic_code: "1.3"
      source: "Primary source: Treaty of Tordesillas (1494), trans. in F. G. Davenport, European Treaties Bearing on the History of the United States (1917), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        ". . . that a boundary or straight line be determined and drawn north and south, from pole to pole, on the said ocean sea, from the Arctic to the Antarctic pole. This boundary or line shall be drawn straight, as aforesaid, at a distance of three hundred and seventy leagues west of the Cape Verde Islands, . . . And all lands, both islands and mainlands, found and discovered already, or to be found and discovered hereafter, by the said King of Portugal and by his vessels on this side of the said line . . . shall belong to, and remain in the possession of, and pertain forever to, the said King of Portugal and his successors."

        — Treaty between Spain and Portugal concluded at Tordesillas, June 7, 1494
      prompt: |
        The treaty excerpted was most directly a response to
      options:
        - "the Protestant Reformation's challenge to papal authority"
        - "the conquest of the Inca Empire"
        - "the English settlement of Jamestown"
        - "Columbus's return in 1493 with news of lands across the Atlantic, which raised the question of which Iberian crown could claim them"
      option_explanations:
        - |
          Luther's challenge began in 1517; in 1494 both crowns were Catholic and had sought papal backing for their claims.
        - |
          Pizarro's conquest of the Inca came in 1532–1533, nearly forty years later.
        - |
          Jamestown was founded in 1607, more than a century after the treaty.
        - |
          Correct. Portugal had a long head start in Atlantic exploration; Columbus's voyage for Castile created a rival claim, and the two crowns negotiated a dividing line in 1494.
      answer: 3
      explanation: |
        Skill: contextualization. Place the document in time: two years after 1492, the immediate problem was competing Iberian claims.

    - slug: apush-u01-w02-q05
      type: multiple_choice
      topic_code: "1.1"
      source: "Primary source: Treaty of Tordesillas (1494), trans. in F. G. Davenport, European Treaties Bearing on the History of the United States (1917), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        ". . . that a boundary or straight line be determined and drawn north and south, from pole to pole, on the said ocean sea, from the Arctic to the Antarctic pole. This boundary or line shall be drawn straight, as aforesaid, at a distance of three hundred and seventy leagues west of the Cape Verde Islands, . . . And all lands, both islands and mainlands, found and discovered already, or to be found and discovered hereafter, by the said King of Portugal and by his vessels on this side of the said line . . . shall belong to, and remain in the possession of, and pertain forever to, the said King of Portugal and his successors."

        — Treaty between Spain and Portugal concluded at Tordesillas, June 7, 1494
      prompt: |
        Review. Portugal's interest in protecting the lands and seas east of the line is best explained by its earlier
      options:
        - "voyages down the West African coast, trading posts such as Elmina, and the search for a sea route around Africa to Asia"
        - "colonies in New England"
        - "alliance with the Iroquois Confederacy"
        - "conquest of the Aztec Empire"
      option_explanations:
        - |
          Correct. Through the 1400s Portugal had mapped the African coast, built forts such as Elmina (1482) and reached the Cape of Good Hope (1488); the treaty protected that route and its future trade with India.
        - |
          New England was colonized by the English in the 1600s; Portugal had no colonies there.
        - |
          Portugal had no presence in the Northeast of North America; the Iroquois dealt with the French, Dutch and English later.
        - |
          The Aztec Empire was conquered by Spain, not Portugal, and not until 1521.
      answer: 0
      explanation: |
        Skill: contextualization, reviewing week 1. Portugal's African voyages explain why it cared most about the eastern side of the line.

    - slug: apush-u01-w02-q06
      type: multiple_choice
      topic_code: "1.7"
      source: "Primary source: Treaty of Tordesillas (1494), trans. in F. G. Davenport, European Treaties Bearing on the History of the United States (1917), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        ". . . that a boundary or straight line be determined and drawn north and south, from pole to pole, on the said ocean sea, from the Arctic to the Antarctic pole. This boundary or line shall be drawn straight, as aforesaid, at a distance of three hundred and seventy leagues west of the Cape Verde Islands, . . . And all lands, both islands and mainlands, found and discovered already, or to be found and discovered hereafter, by the said King of Portugal and by his vessels on this side of the said line . . . shall belong to, and remain in the possession of, and pertain forever to, the said King of Portugal and his successors."

        — Treaty between Spain and Portugal concluded at Tordesillas, June 7, 1494
      prompt: |
        Which of the following best describes a limitation of the treaty in the 1500s?
      options:
        - "It was never signed by the Spanish monarchs."
        - "It required Spain to share American silver with Portugal."
        - "It gave all of South America to Portugal."
        - "Other European powers, such as France and England, did not accept a division that excluded them and sent their own explorers and privateers."
      option_explanations:
        - |
          Ferdinand and Isabella ratified it; it was a binding agreement between the two crowns.
        - |
          The treaty divided lands, not revenues; Spain kept the silver of Mexico and Peru.
        - |
          Only the eastern bulge of South America (Brazil) fell on Portugal's side; most of the continent lay on the Spanish side.
        - |
          Correct. The treaty bound only its two signers. France (Verrazzano, Cartier) and England (Cabot, later Drake and Raleigh) ignored it, and their challenge grew into the colonial rivalry of Period 2.
      answer: 3
      explanation: |
        Skill: causation and making connections. The treaty settled one rivalry and left others open; excluded powers became the colonizers of North America after 1607.

    # ---- Stimulus set C: Las Casas (1.5, 1.6, 1.4)
    - slug: apush-u01-w02-q07
      type: multiple_choice
      topic_code: "1.5"
      source: "Primary source: Bartolomé de las Casas, A Brief Account of the Destruction of the Indies (1552; English translation 1689), Project Gutenberg"
      points: 1
      stimulus: |
        "The Spaniards first assaulted the innocent Sheep, so qualified by the Almighty, as is premention'd, like most cruel Tygers, Wolves and Lions hunger-starv'd, studying nothing, for the space of Forty Years, after their first landing, but the Massacre of these Wretches, whom they have so inhumanely and barbarously butcher'd and harass'd with several kinds of Torments, never before known, or heard . . ."

        — Bartolomé de las Casas, Dominican friar and former encomienda holder, A Brief Account of the Destruction of the Indies, written in 1542 and published in 1552 (English translation of 1689)
      prompt: |
        The conditions Las Casas condemns were most closely connected to which Spanish colonial institution?
      options:
        - "Indentured servitude of English laborers"
        - "The headright system"
        - "The encomienda, which granted colonists the labor and tribute of Native communities"
        - "The town meeting"
      option_explanations:
        - |
          English indentured servitude belongs to the Chesapeake colonies of the 1600s, not to Spanish America.
        - |
          The headright system granted land to settlers in English Virginia after 1618; it is Period 2.
        - |
          Correct. The encomienda put Native people under colonists who demanded labor in mines and fields; Las Casas, once an encomendero himself, saw its abuses on Hispaniola and Cuba.
        - |
          Town meetings were a New England form of local government in the 1600s, not part of the Spanish system.
      answer: 2
      explanation: |
        Skill: contextualization. Tie the abuses in the source to the labor system that made them possible.

    - slug: apush-u01-w02-q08
      type: multiple_choice
      topic_code: "1.6"
      source: "Primary source: Bartolomé de las Casas, A Brief Account of the Destruction of the Indies (1552; English translation 1689), Project Gutenberg"
      points: 1
      stimulus: |
        "The Spaniards first assaulted the innocent Sheep, so qualified by the Almighty, as is premention'd, like most cruel Tygers, Wolves and Lions hunger-starv'd, studying nothing, for the space of Forty Years, after their first landing, but the Massacre of these Wretches, whom they have so inhumanely and barbarously butcher'd and harass'd with several kinds of Torments, never before known, or heard . . ."

        — Bartolomé de las Casas, Dominican friar and former encomienda holder, A Brief Account of the Destruction of the Indies, written in 1542 and published in 1552 (English translation of 1689)
      prompt: |
        Which of the following most directly challenged the views expressed by Las Casas?
      options:
        - "Native accounts of the conquest written after 1521"
        - "The New Laws of 1542, which limited the encomienda"
        - "The argument of Juan Ginés de Sepúlveda that Native peoples were natural inferiors whom Spain could justly conquer and rule"
        - "The teachings of Dominican friars who preached against forced labor"
      option_explanations:
        - |
          Native accounts generally confirmed the violence of conquest; they did not defend it.
        - |
          The New Laws were in part a result of reformers' arguments like Las Casas's; they agreed with him rather than challenged him.
        - |
