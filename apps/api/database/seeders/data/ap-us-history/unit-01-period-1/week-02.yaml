    # ---- Short answer (SAQ)
    - slug: apush-u01-w02-q23
      type: short_answer
      topic_code: "1.6"
      source: "Primary source: Thomas Harriot, A Briefe and True Report of the New Found Land of Virginia (1588; 1590 edition), Project Gutenberg"
      points: 3
      stimulus: |
        "Most thinges they sawe with vs, as Mathematicall instruments, sea compasses, the vertue of the loadstone in drawing yron, a perspectiue glasse whereby was shewed manie strange sightes, burning glasses, wildefire woorkes, gunnes, bookes, writing and reading, spring clocks that seeme to goe of themselues, and manie other thinges that wee had, were so straunge vnto them, and so farre exceeded their capacities to comprehend the reason and meanes how they should be made and done, that they thought they were rather the works of gods then of men, or at the leastwise they had bin giuen and taught vs of the gods."

        — Thomas Harriot, A Briefe and True Report of the New Found Land of Virginia, 1588, describing Carolina Algonquian reactions to the English in 1585–86 (original spelling)
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe Harriot's view of the Algonquians as expressed in the excerpt.
        (b) Briefly explain ONE reason a historian should be cautious about Harriot's claim regarding what the Algonquians thought.
        (c) Briefly explain ONE way that Native Americans in the 1500s adapted to or resisted European newcomers.
      answer: |
        (a) Harriot sees the Algonquians as amazed by English technology and unable to understand it, so that they credited the English with godlike power; he assumes English culture is superior.
        (b) Harriot is an English outsider reporting what he believes the Algonquians thought, through translators and his own assumptions; his purpose was to show investors that Native people would be awed and easy to manage, so he had reason to exaggerate their wonder.
        (c) Many Native groups selectively adopted European goods such as metal tools while keeping their own beliefs; others resisted by force, as Acoma Pueblo did against Oñate in 1599; some, like the Tlaxcalans, allied with Europeans to defeat their own enemies.
      explanation: |
        Three points, one per part.

        (a) 1 pt: describes Harriot's view: the Algonquians were awed by English objects and technology and thought them the work of gods; implies a belief in English superiority. Zero for summarising the list of objects without stating his view.

        (b) 1 pt: explains a sourcing limitation: he reports others' thoughts as an outsider; language barriers; a promotional purpose (making Native people seem awed and manageable for investors); European assumptions of superiority. Zero for "he was biased" with no explanation.

        (c) 1 pt: a specific, accurate example of adaptation or resistance in the 1500s: trade for metal goods; religious syncretism; alliances such as the Tlaxcalans with Cortés; armed resistance at Acoma (1599), by the Calusa in Florida, or against de Soto's expedition. Also accept Algonquian hostility that helped end the Roanoke colonies. Zero for examples after 1607 without a link (e.g. the Pueblo Revolt alone, 1680) or for vague answers.

    - slug: apush-u01-w02-q24
      type: short_answer
      topic_code: "1.5"
      source: "general knowledge"
      points: 3
      stimulus: |
        Image description: A set of sixteen small paintings made in New Spain (Mexico) in the 1700s, arranged in a grid. Each panel shows a father, a mother and a child in a domestic scene, with a caption naming the parents' ancestry and the child's category, for example "Spaniard and Indian woman produce a mestizo" or "Spaniard and Black woman produce a mulatto". Families in the upper panels wear fine clothes in well-furnished rooms; families in the lower panels wear plainer clothes and work at manual trades. Paintings of this kind are known as casta paintings.
      prompt: |
        Using the image description, answer (a), (b) and (c).

        (a) Briefly describe ONE feature of Spanish colonial society reflected in the paintings.
        (b) Briefly explain ONE historical development in the 1500s that helped produce the society the paintings depict.
        (c) Briefly explain ONE way that the Spanish colonial labor system affected Native Americans or Africans in the 1500s.
      answer: |
        (a) The paintings show a hierarchy based on ancestry: people of Spanish descent appear wealthier and higher in status, while those of mixed, Native or African ancestry rank lower, which reflects the casta system.
        (b) Spanish colonists in the 1500s were mostly men, and many had children with Native and African women, producing a large mixed population that the Spanish classified and ranked; the forced migration of enslaved Africans added a third group.
        (c) Under the encomienda, Native people were forced to provide labor and tribute to Spanish colonists, which with disease contributed to a catastrophic population decline; as Native populations fell, the Spanish imported enslaved Africans to work sugar plantations and mines.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a feature such as ranking by ancestry or race; Spaniards at the top; recognition of mixed ancestry with named categories; wealth and occupation linked to category. Zero for a description of the art without a social meaning.

        (b) 1 pt: an accurate development of the 1500s: a mostly male Spanish migration and unions with Native and African women; the transatlantic slave trade to Spanish America; conquest and the imposition of Spanish rule; Spanish ideas of "purity of blood" carried from Iberia. Zero for developments after 1600 without a link to the 1500s.

        (c) 1 pt: an accurate effect of the encomienda, repartimiento, mita or African slavery: forced labor and tribute; high mortality in mines; population decline worsened by overwork; replacement of Native labor with enslaved Africans; resistance and flight. Zero for confusing these systems with English indentured servitude.

    # ---- Long essay (LEQ)
    - slug: apush-u01-w02-q25
      type: long_answer
      topic_code: "1.7"
      source: "general knowledge"
      points: 6
      prompt: |
        In the century after 1492, a few thousand Spaniards came to rule millions of people in the Americas. Historians explain this outcome through several lines of analysis, including disease, Native alliances and divisions, European technology and motives, and the institutions Spain built.

        Evaluate the relative importance of the causes of Spanish success in establishing an empire in the Americas from 1492 to 1607.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: Epidemic disease and Native allies were the most important causes of Spanish success, because they destroyed and divided the empires the Spanish faced; technology and religious zeal mattered less, and institutions such as the encomienda turned conquest into lasting rule.

        Context: Spain emerged from the Reconquista in 1492 united and militant, seeking wealth and converts; the Americas held large, diverse societies, from Caribbean chiefdoms to the Mexica and Inca empires, isolated from Old World diseases.

        Body 1 (disease): smallpox in Tenochtitlan in 1520 killed defenders and the emperor Cuitláhuac; epidemics killed Huayna Capac and triggered the Inca civil war before Pizarro arrived; populations fell sharply, weakening resistance.

        Body 2 (Native allies and divisions): Tlaxcalans and other subject peoples fought alongside Cortés; Pizarro exploited the Atahualpa-Huáscar war; Malintzin's interpreting.

        Body 3 (technology, motives, institutions): steel, horses and guns gave tactical edges; Reconquista zeal and the hunt for gold drove men such as Cortés; the encomienda, missions, silver mines at Potosí and the casta system made conquest permanent.

        Counterpoint: where disease and allies were absent, the Spanish often failed (de Soto, Coronado).
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim that ranks or weighs causes, in the introduction or conclusion. Example: disease and Native allies mattered more than technology. Zero for a list of causes with no evaluation of relative importance.

        Contextualization (0–1): describes relevant broader context: the Reconquista and Spanish motives (God, gold, glory); the separation of the hemispheres; the size and diversity of American societies; Portuguese and Spanish rivalry and Tordesillas. Must be more than one phrase.

        Evidence (0–2): 1 pt for two or more specific examples: smallpox in Tenochtitlan (1520); the Tlaxcalan alliance; Malintzin; Cortés (1519–1521); Pizarro and Atahualpa at Cajamarca (1532); the Inca civil war; horses and steel; encomienda; Potosí (1545) and the mita; the New Laws (1542); St. Augustine (1565); Oñate and Acoma (1598–1599); failed expeditions of de Soto and Coronado. 2 pts when the evidence is used to support the argument about which causes mattered most.

        Analysis and reasoning (0–2): 1 pt for using causation to frame the argument (distinguishing causes and showing how they produced the outcome). 1 pt for complex understanding, e.g. explaining how causes interacted (disease weakened empires so alliances formed); distinguishing short-term conquest from long-term rule; using contrary evidence such as failed northern expeditions; considering Native agency rather than portraying Native peoples only as victims.

        Common errors: crediting technology alone; describing Native peoples as passive; confusing the Aztec and Inca conquests; drifting into English colonization after 1607.
