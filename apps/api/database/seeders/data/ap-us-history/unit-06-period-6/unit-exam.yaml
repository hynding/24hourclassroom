    prompt: |
      Boarding schools such as the Carlisle Indian Industrial School aimed to preserve Native languages and religious traditions.
    answer: false
    explanation: |
      False. Boarding schools aimed to erase tribal identity: children were separated from their families, given English names, forbidden to speak their languages and trained in farming and trades. Pratt described the goal as killing the Indian identity in the child in order to save the man (paraphrased). Students nonetheless often preserved languages and culture in secret. Skill: evaluating claims about assimilation policy (6.3).

  - slug: apush-u06-exam-q41
