    answer: 0
    explanation: |
      Skill: historical perspective (6.9). Be able to explain the machine from the immigrant's and the reformer's point of view.

  - slug: apush-u06-exam-q37
    type: multi_select
    topic_code: "6.6"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Select ALL of the following that contributed to the concentration of economic power in large corporations between 1870 and 1898.
    options:
      - "Trusts and holding companies that placed many firms under one management"
      - "Investment bankers such as J. P. Morgan who financed mergers and reorganized railroads"
      - "Railroad rebates that gave large shippers lower rates than small ones"
      - "Vigorous federal enforcement of the Sherman Antitrust Act against manufacturers"
      - "Economic depressions that bankrupted weaker competitors"
    option_explanations:
      - |
        Correct. The Standard Oil Trust (1882) and New Jersey's holding-company law (1889) were the legal tools of combination.
      - |
        Correct. Morgan's banking house reorganized bankrupt railroads after 1893 and financed great mergers.
      - |
        Correct. Rebates let Standard Oil undersell rivals until the Interstate Commerce Act banned them (weakly).
      - |
        The Sherman Act was barely enforced against manufacturers in the 1890s, and E. C. Knight (1895) limited it. This option is false.
      - |
        Correct. The depressions after 1873 and 1893 drove weaker firms out or into mergers, leaving survivors stronger.
    answer: [0, 1, 2, 4]
    explanation: |
      Skill: causation (multiple causes, 6.6). Concentration came from legal devices, finance, market power and the business cycle together.

  - slug: apush-u06-exam-q38
