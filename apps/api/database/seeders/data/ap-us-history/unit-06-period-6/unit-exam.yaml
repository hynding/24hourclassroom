  - slug: apush-u06-exam-q43
    type: short_answer
    topic_code: "6.6"
    source: "Interpretations written for this course, representing the 'robber baron' and 'industrial statesman' schools of thought"
    points: 3
    stimulus: |
      Interpretation 1 (written for this course, representing the 'robber baron' view associated with historians and journalists of the 1900s–1930s):

      The great industrialists of the Gilded Age built their fortunes less by efficiency than by power. They crushed competitors with secret rebates and price wars, broke unions with Pinkertons and injunctions, bought legislatures, and left workers in poverty while they built palaces.

      Interpretation 2 (written for this course, representing the 'industrial statesman' view associated with business historians of the mid-twentieth century):

      The great industrialists of the Gilded Age were builders. By organizing production on a national scale and adopting new technology, they cut the price of steel, kerosene and transportation dramatically, created millions of jobs and made the United States the world's leading industrial power, and many gave fortunes back to the public.
    prompt: |
      Using the interpretations above, answer (a), (b) and (c).

      (a) Briefly describe ONE major difference between Interpretation 1 and Interpretation 2.
      (b) Briefly explain how ONE specific historical event or development from 1865 to 1898 could be used to support Interpretation 1.
      (c) Briefly explain how ONE specific historical event or development from 1865 to 1898 could be used to support Interpretation 2.
    answer: |
      (a) Interpretation 1 sees the industrialists as exploiters whose wealth came from coercion, corruption and monopoly; Interpretation 2 sees them as innovators whose organization lowered prices and built the national economy.
      (b) Standard Oil supports Interpretation 1: Rockefeller used secret railroad rebates and predatory price cuts to force rival refiners to sell, gaining control of about 90 percent of American refining by the 1880s.
      (c) Carnegie Steel supports Interpretation 2: by adopting the Bessemer process and vertical integration Carnegie cut the cost of steel rails dramatically, supplying the railroads and skyscrapers of a new economy, and he later gave away most of his fortune to fund libraries and universities.
    explanation: |
      Skill: analyzing historical interpretations. One point per part.

      (a) 1 point for a real difference: exploitation and power versus innovation and efficiency; harm to workers and competitors versus benefits to consumers and the nation. Zero for describing only one interpretation.

      (b) 1 point for specific evidence explained: Standard Oil's rebates and price wars, the Homestead lockout and Pinkertons (1892), Pullman's wage cuts and company town (1894), Crédit Mobilier and railroad corruption, Jay Gould's stock manipulation, the 'Bosses of the Senate' image of corporate control, low wages and child labor. Zero for naming a businessman without an action.

      (c) 1 point for specific evidence explained: falling prices of steel and kerosene, Carnegie's vertical integration, Edison's and Westinghouse's electrical systems, Swift's refrigerated cars, the growth of jobs and national markets, Carnegie's libraries, Rockefeller's gifts to the University of Chicago, Morgan's reorganization of railroads. Zero for evidence that supports Interpretation 1 instead.

  - slug: apush-u06-exam-q44
    type: short_answer
    topic_code: "6.9"
    source: "Described non-text source: Thomas Nast, 'The Tammany Tiger Loose,' Harper's Weekly (November 11, 1871), Library of Congress Prints and Photographs"
    points: 3
    stimulus: |
      Non-text source (described): a cartoon by Thomas Nast in Harper's Weekly, November 11, 1871, just before a New York election. The scene is a Roman arena. A huge tiger, its collar labeled Tammany, stands over a fallen woman representing the Republic, whose broken sword and torn ballot lie nearby. In the imperial box above, a heavy figure clearly meant to be William 'Boss' Tweed sits as a Roman emperor, surrounded by his associates, watching with satisfaction. The crowd fills the stands.
    prompt: |
      Using the source described above, answer (a), (b) and (c).

      (a) Briefly describe the point of view of the cartoonist toward Tammany Hall.
      (b) Briefly explain ONE reason many urban immigrants nevertheless supported political machines such as Tammany Hall in the period 1865–1898.
      (c) Briefly explain ONE response by reformers or government to political corruption in the period 1865–1898.
    answer: |
      (a) Nast portrays Tammany as a savage beast destroying republican government itself, with Tweed as a decadent tyrant enjoying the spectacle; machine politics is a mortal threat to democracy.
      (b) Machines helped immigrants who had nowhere else to turn: Tammany ward bosses found newcomers jobs on city projects, brought food and coal in hard times, helped with naturalization and the courts, and asked only for votes.
      (c) The Pendleton Civil Service Act (1883) began to replace the spoils system with merit examinations for federal jobs, a response to the assassination of President Garfield by a disappointed office seeker.
    explanation: |
      Skill: sourcing a cartoon (point of view) and historical perspective. One point per part.

      (a) 1 point for point of view drawn from the image: Tammany as a destructive beast, Tweed as a tyrant, the Republic and the ballot as victims. Zero for describing the picture without its meaning.

      (b) 1 point for a specific reason explained: jobs and services, help with naturalization and the law, ethnic loyalty (Irish American leadership), absence of public welfare, recognition and respect from party leaders. Zero for 'they were tricked' without explanation.

      (c) 1 point for a specific response explained: the prosecution and conviction of Tweed (1873), the Pendleton Act (1883), the Mugwump revolt (1884), the secret (Australian) ballot adopted by many states from 1888, good-government and municipal reform leagues, settlement-house reformers lobbying for better city services. Zero for a response outside the period without connection.

  # ---- Document-based question (7 points)
  - slug: apush-u06-exam-q45
    type: long_answer
    topic_code: "6.12"
    source: "Primary sources: Munn v. Illinois (1877) and United States v. E. C. Knight Co. (1895), Justia; Henry George, Progress and Poverty (1879) and William Graham Sumner, What Social Classes Owe to Each Other (1883), Project Gutenberg; Interstate Commerce Act (1887), National Archives; Cleveland's Texas Seed Bill veto (1887) and the People's Party Platform (1892), The American Presidency Project"
    points: 7
    stimulus: |
      Document 1
      Source: Chief Justice Morrison Waite, majority opinion, Munn v. Illinois, 1877 (upholding an Illinois law regulating grain-elevator rates)

      "Property does become clothed with a public interest when used in a manner to make it of public consequence and affect the community at large. When, therefore, one devotes his property to a use in which the public has an interest, he, in effect, grants to the public an interest in that use, and must submit to be controlled by the public for the common good, to the extent of the interest he has thus created."

      Document 2
      Source: Henry George, journalist and economist, Progress and Poverty, 1879

      "Where the conditions to which material progress everywhere tends are most fully realized—that is to say, where population is densest, wealth greatest, and the machinery of production and exchange most highly developed—we find the deepest poverty, the sharpest struggle for existence, and the most of enforced idleness. ... This association of poverty with progress is the great enigma of our times."

      Document 3
      Source: William Graham Sumner, professor of political and social science at Yale, What Social Classes Owe to Each Other, 1883

      "In all these schemes and projects the organized intervention of society through the State is either planned or hoped for, and the State is thus made to become the protector and guardian of certain classes. The agents who are to direct the State action are, of course, the reformers and philanthropists. Their schemes, therefore, may always be reduced to this type—that A and B decide what C shall do for D."

      Document 4
      Source: Interstate Commerce Act, passed by Congress and signed by President Grover Cleveland, February 4, 1887, Section 1

      "All charges made for any service rendered or to be rendered in the transportation of passengers or property as aforesaid, or in connection therewith, or for the receiving, delivering, storage, or handling of such property, shall be reasonable and just; and every unjust and unreasonable charge for such service is prohibited and declared to be unlawful."
    prompt: |
      Document 5
      Source: President Grover Cleveland, message vetoing a bill to provide $10,000 of seed to drought-stricken farmers in Texas, February 16, 1887

      "I can find no warrant for such an appropriation in the Constitution, and I do not believe that the power and duty of the General Government ought to be extended to the relief of individual suffering which is in no manner properly related to the public service or benefit. ... Federal aid in such cases encourages the expectation of paternal care on the part of the Government and weakens the sturdiness of our national character ..."

      Document 6
      Source: Platform of the People's Party, adopted at Omaha, Nebraska, July 4, 1892

      "We believe that the power of government—in other words, of the people—should be expanded (as in the case of the postal service) as rapidly and as far as the good sense of an intelligent people and the teachings of experience shall justify, to the end that oppression, injustice and poverty, shall eventually cease in the land. ... Transportation being a means of exchange and a public necessity, the government should own and operate the railroads ..."

      Document 7
      Source: Chief Justice Melville Fuller, majority opinion, United States v. E. C. Knight Co., 1895 (holding that the Sherman Antitrust Act did not apply to the American Sugar Refining Company's control of sugar refining)

      "Doubtless the power to control the manufacture of a given thing involves, in a certain sense, the control of its disposition, but this is a secondary, and not the primary, sense, and although the exercise of that power may result in bringing the operation of commerce into play, it does not control it, and affects it only incidentally and indirectly. Commerce succeeds to manufacture, and is not a part of it."

      Directions: Using the seven documents (Documents 1 to 4 appear above Documents 5 to 7) and your knowledge of the period, write an essay that responds to the prompt. Develop an argument with a historically defensible thesis, describe a broader historical context, support the argument with evidence from at least four documents and at least one additional piece of specific historical evidence beyond the documents, explain how the point of view, purpose, historical situation or audience of at least two documents is relevant to the argument, and demonstrate a complex understanding of the topic.

      Evaluate the extent to which ideas about the proper role of government in the American economy changed from 1865 to 1898.
    answer: |
      Thesis: Between 1865 and 1898 Americans moved from a broad consensus that government should promote but not regulate the economy toward a sharp debate in which farmers, workers and reformers demanded regulation and even public ownership; ideas changed considerably, but practice changed far less, because presidents and courts kept enforcing a limited, pro-property view of government.

      Context: After the Civil War the federal government had subsidized railroads, raised tariffs and given away western land (Homestead and Pacific Railway Acts), while the rise of national corporations, falling crop prices and the depressions of 1873 and 1893 left farmers and workers vulnerable.

      Body 1 (new ideas demanding regulation and reform): Doc 1 (Munn: property 'clothed with a public interest'), Doc 2 (George's 'enigma' of poverty amid progress), Doc 4 (ICA: rates must be 'reasonable and just'), Doc 6 (Omaha: expand government 'as rapidly and as far as' experience allows; own the railroads). Outside evidence: the Grange and Granger laws; the Sherman Act (1890).

      Body 2 (continuity of limited government): Doc 3 (Sumner's 'A and B decide what C shall do for D'), Doc 5 (Cleveland: no 'paternal care'), Doc 7 (E. C. Knight: manufacturing is not commerce). Outside evidence: In re Debs (1895) and Pollock (1895).

      Sourcing: Cleveland, a Bourbon Democrat facing rising farmer protest, wrote to Congress to set a precedent against relief (Doc 5); the Omaha Platform was written by indebted farmers for voters in a campaign year (Doc 6).

      Complexity: government was never truly 'hands off', since it gave land, tariffs and troops to business; the real change was the demand that it act for farmers and workers, which the Progressives would partly fulfil after 1900.
    explanation: |
      DBQ rubric applied to this prompt (7 points).

      Thesis/claim (1): a historically defensible claim about the extent of change in ideas about government's economic role, with a line of reasoning, in the introduction or conclusion. Restating the prompt or 'ideas changed and stayed the same' with no weighing earns nothing.

      Contextualization (1): describes the broader context before or during the period, such as Civil War-era Republican economic policy (tariffs, the Homestead and Pacific Railway Acts, national banking), the rise of national corporations and trusts, the depressions of 1873 and 1893, the debate between Social Darwinism and reform. Must be more than a phrase and connected to the argument.

      Evidence from the documents (up to 2): 1 point for accurately describing the content of at least three documents. 2 points for using at least four documents to support the argument (for example, Docs 1, 4 and 6 as evidence of growing support for regulation; Docs 3, 5 and 7 as evidence of persisting limits). Quoting without explaining earns only the first point.

      Evidence beyond the documents (1): one specific piece of relevant evidence not in the documents, used to support the argument: the Grange and Granger laws, Wabash v. Illinois (1886), the Sherman Antitrust Act (1890), the Pendleton Act (1883), the McKinley Tariff (1890), In re Debs (1895), Pollock v. Farmers' Loan and Trust (1895), Coxey's Army (1894), Bryan's 'Cross of Gold' campaign (1896), Social Gospel or settlement-house reformers. It must be different from evidence used for contextualization.

      Analysis and reasoning (2): 1 point for sourcing: explaining how or why the point of view, purpose, historical situation or audience of at least two documents is relevant to the argument. Examples: Cleveland (Doc 5) as a Bourbon Democrat committed to limited government and the gold standard, writing to Congress to set a precedent; Sumner (Doc 3) as an academic Social Darwinist whose audience was educated readers worried about reformers; the Omaha Platform (Doc 6) as a campaign document of indebted farmers in a depression-bound year; Fuller (Doc 7) as a Court protective of property and state authority; Waite (Doc 1) ruling as Granger pressure peaked. 1 point for complex understanding, demonstrated through sophisticated argumentation or effective use of evidence, for example explaining both change and continuity, noting that government actively aided business even while refusing aid to farmers, explaining how court decisions limited new laws, connecting to the Progressive Era or to Jacksonian anti-monopoly ideas, or corroborating and qualifying documents against one another.

      A response that summarizes the documents in order without an argument about the extent of change cannot earn the reasoning points.
