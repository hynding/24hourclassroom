  - slug: apush-u06-exam-q33
    type: multiple_choice
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Review. The idea of Manifest Destiny in the 1840s contributed to the conflicts of Period 6 in the West mainly because it
    options:
      - "limited American settlement to the area east of the Mississippi"
      - "justified American expansion across land held by Native nations and Mexico as inevitable and providential"
      - "called for immigration from Asia to settle the Pacific coast"
      - "required the United States to share western land equally with Native nations"
    option_explanations:
      - |
        It envisioned expansion to the Pacific, not a limit at the Mississippi.
      - |
        Correct. Manifest Destiny gave moral cover to the Mexican Cession and later to the conquest of the Plains; Turner's frontier thesis in 1893 echoed its confidence.
      - |
        It assumed Anglo-American settlement; Asian immigrants later faced exclusion.
      - |
        Its advocates assumed Native peoples would give way, not share the land.
    answer: 1
    explanation: |
      Skill: making connections (continuity of ideas from 5.2 to 6.3).

  - slug: apush-u06-exam-q34
    type: multiple_choice
    topic_code: "3.12"
    source: "general knowledge"
    points: 1
    prompt: |
      Review. The rectangular grid of townships and sections used to survey and sell western land in Period 6 originated in
    options:
      - "the Kansas-Nebraska Act of 1854"
      - "the Treaty of Paris of 1763"
      - "the Land Ordinance of 1785, adopted under the Articles of Confederation"
      - "the Dawes Act of 1887"
    option_explanations:
      - |
        The Kansas-Nebraska Act organized territories and applied popular sovereignty to slavery; the survey system was older.
      - |
        The 1763 treaty ended the Seven Years' War; it set no land-survey system.
      - |
        Correct. The 1785 ordinance divided the Northwest Territory into six-mile-square townships of 36 one-square-mile sections; the same system governed homesteads (a quarter section, 160 acres) and allotments a century later.
      - |
        The Dawes Act used the existing survey grid ('one-quarter of a section'); it did not create it.
    answer: 2
    explanation: |
      Skill: continuity across periods (3.12 to 6.2). The early republic's land system shaped how the West was divided and sold.

  - slug: apush-u06-exam-q35
    type: multiple_choice
    topic_code: "5.9"
    source: "National Archives, Milestone Documents: Homestead Act (1862) and Pacific Railway Act (1862)"
    points: 1
    prompt: |
      Review. Which Civil War-era legislation most directly shaped the settlement of the West after 1865?
    options:
      - "The Homestead Act and the Pacific Railway Act of 1862"
      - "The Tariff of Abominations"
      - "The Fugitive Slave Act of 1850"
      - "The Kansas-Nebraska Act of 1854"
    option_explanations:
      - |
        Correct. Free land for settlers and land grants and loans for a transcontinental railroad, passed once Southern opposition left Congress, set the framework for western development.
      - |
        The Tariff of Abominations (1828) belongs to the Jacksonian era and the nullification crisis.
      - |
        The Fugitive Slave Act concerned escaped enslaved people and was effectively dead after 1861.
      - |
        The Kansas-Nebraska Act came before the war and concerned slavery in the territories.
    answer: 0
    explanation: |
      Skill: causation across periods (5.9 to 6.2).

  - slug: apush-u06-exam-q36
    type: multiple_choice
    topic_code: "6.9"
    source: "general knowledge"
    points: 1
    prompt: |
      Political machines such as New York's Tammany Hall are best described as
    options:
      - "party organizations that provided jobs and services to urban immigrants in exchange for votes, financed in part by graft"
      - "nativist societies that sought to keep immigrants from voting"
      - "reform groups dedicated to ending corruption in city government"
      - "federal agencies responsible for processing immigrants"
    option_explanations:
      - |
        Correct. Machines offered practical help that government did not, and paid for it with kickbacks, franchises and padded contracts; the Tweed Ring was the most notorious example.
      - |
