    - slug: apush-u06-w20-q21
      type: short_answer
      topic_code: "6.9"
      source: "Interpretation written for this course, contrasting reform and immigrant perspectives on political machines"
      points: 3
      stimulus: |
        Interpretation (written for this course, representing historians who have reassessed urban political machines since the mid-twentieth century):

        Reformers of the Gilded Age saw the urban political machine as a parasite that stole from taxpayers and corrupted democracy, and the thefts were real. But for the immigrants who crowded into the industrial cities, the machine was often the only institution that answered when they needed a job, a doctor, a ton of coal or a word with the judge. In a society that offered almost no public welfare, the machine was a crude, corrupt and personal substitute for it, and immigrants who voted for it were making a rational choice.
      prompt: |
        Using the interpretation above, answer (a), (b) and (c).

        (a) Briefly describe ONE claim the author makes about political machines.
        (b) Briefly explain how ONE specific historical development from 1865 to 1898 supports the author's claim.
        (c) Briefly explain how ONE specific historical development from 1865 to 1898 could be used to support the reformers' view of machines.
      answer: |
        (a) The author claims that machines, though corrupt, served as an informal welfare system for immigrants who received almost no help from government, so supporting them was rational.
        (b) The massive new immigration to cities such as New York and Chicago supports it: newcomers who spoke little English needed jobs and housing, and Tammany Hall's ward bosses found them work on city projects and helped them through naturalization, in return for votes.
        (c) The Tweed Ring supports the reformers: Boss Tweed's Tammany organization stole tens of millions of dollars from New York through padded contracts, exposed by Thomas Nast's cartoons and The New York Times, and Tweed was convicted in 1873.
      explanation: |
        Skill: analyzing a secondary interpretation and using evidence. One point per part.

        (a) 1 point for an accurate claim: machines were a substitute welfare system; immigrants' support was rational; corruption was real but not the whole story. Zero for 'machines were corrupt' alone, since that is the reformers' view.

        (b) 1 point for specific evidence explained: Tammany Hall's ward services, jobs on city payrolls and public works, help with naturalization, the scale of new immigration and lack of public welfare, ethnic leadership in machines (Irish Americans in Tammany). Zero for naming a city with no explanation.

        (c) 1 point for specific evidence explained: the Tweed Ring, kickbacks and padded contracts, sale of franchises for streetcars and utilities, election fraud, Nast's cartoons, the civil-service and good-government campaigns. Zero for evidence from the Progressive Era unless tied back to this period.

    - slug: apush-u06-w20-q22
      type: short_answer
      topic_code: "6.7"
      source: "Described non-text source: T. de Thulstrup, 'The Anarchist Riot in Chicago,' Harper's Weekly (May 15, 1886), Library of Congress Prints and Photographs"
      points: 3
      stimulus: |
        Non-text source (described): an engraving published in Harper's Weekly, a widely read national magazine, on May 15, 1886, titled "The Anarchist Riot in Chicago: A Dynamite Bomb Exploding Among the Police." In the center a bomb explodes in a burst of light among ranks of uniformed police in Haymarket Square. Police officers fall while others fire revolvers into the crowd. On a wagon at the edge of the scene a bearded speaker raises his arm as if urging the crowd on. The crowd is drawn as a dark, disorderly mass.
      prompt: |
        Using the source described above, answer (a), (b) and (c).

        (a) Briefly describe the point of view of the image toward the Haymarket rally.
        (b) Briefly explain ONE way the event in the image affected the labor movement.
        (c) Briefly explain ONE other development from 1877 to 1898 that shows how government responded to labor conflict.
      answer: |
        (a) The image presents the rally as a violent anarchist plot: the crowd is a dark mob, the speaker seems to incite it and the police are victims, so it frames labor protest as dangerous radicalism rather than a demand for the eight-hour day.
        (b) After Haymarket the public associated unions with anarchism and violence; the Knights of Labor, though not responsible, lost members rapidly, and the more cautious, skilled-craft AFL became the dominant labor organization.
        (c) In the Pullman Strike of 1894 the federal government obtained an injunction against the American Railway Union and President Cleveland sent troops to Chicago, breaking the strike; the Supreme Court upheld the injunction in In re Debs (1895).
      explanation: |
        Skill: sourcing a non-text source (point of view) and causation. One point per part.

        (a) 1 point for point of view supported by details: labor protest shown as anarchist violence, police as victims, crowd as a mob. Zero for describing the picture without interpreting it.

        (b) 1 point for a specific effect explained: decline of the Knights of Labor; rise of the AFL; the hanging of four anarchists and a 'red scare' against radicals; the eight-hour movement set back; employers' increased use of the anarchist label. Zero for an effect with no connection to Haymarket.

        (c) 1 point for a specific government response explained: federal troops in the Great Railroad Strike of 1877; state militia at Homestead (1892); injunctions and troops in the Pullman Strike (1894) and In re Debs (1895); Governor Altgeld's pardon of the surviving Haymarket defendants (1893) as a contrasting response. Zero for a response outside the period.

    - slug: apush-u06-w20-q23
      type: long_answer
      topic_code: "6.8"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1865 and 1898 millions of immigrants from Europe and Asia and migrants from the American countryside moved into the nation's growing cities. Historians have examined how these newcomers changed American cities, work, politics and culture, and how other Americans responded.

        Evaluate the extent to which immigration and migration changed American society in the period from 1865 to 1898.
      answer: |
        Thesis: Immigration and internal migration changed American society to a great extent, transforming the size and character of cities, supplying the labor for industrialization and reshaping urban politics, although they also provoked a nativist response that preserved older hierarchies of race and religion.

        Context: The first great wave of Irish and German immigrants (1840s–1850s) had already stirred Know-Nothing nativism; after 1865 industrialization, railroads and cheap steamship travel created a demand for labor and a means to meet it.

        Body 1 (cities and work): Chicago grew from about 300,000 to 1.7 million (1870–1900); immigrants filled steel mills, packinghouses and garment shops; tenements and ethnic enclaves (Riis, How the Other Half Lives).

        Body 2 (politics and culture): machines such as Tammany Hall built power on immigrant votes; Catholic parishes, synagogues and ethnic newspapers multiplied; settlement houses (Hull House, 1889) and Americanization efforts.

        Body 3 (limits, continuity): Chinese Exclusion Act (1882), the American Protective Association (1887), the Immigration Restriction League (1894); Protestant middle-class culture and racial hierarchy persisted; Lazarus's welcome versus restriction.

        Complexity: immigrants were not passive; they built institutions and unions, and the conflict they provoked set up the restrictive quotas of the 1920s.
      explanation: |
        LEQ rubric applied to this prompt (6 points).

        Thesis/claim (1): a defensible claim about the extent of change with a line of reasoning. 'Immigration changed society' without a measure of extent does not earn it.

        Contextualization (1): the broader situation, such as earlier Irish and German immigration and Know-Nothing nativism, industrialization's demand for labor, push factors in Europe (pogroms, rural poverty) and Asia, or steamship and rail travel.

        Evidence (2): 1 point for two specific examples (new immigrants from southern and eastern Europe, Ellis Island 1892, Chicago's growth, tenements, Riis, Tammany Hall, Hull House, Chinese Exclusion Act, American Protective Association, Immigration Restriction League, Exodusters or rural migrants). 2 points when they are used to support the argument about extent.

        Analysis and reasoning (2): 1 point for using continuity and change (or causation) to frame the argument. 1 point for complex understanding, for example weighing change against continuity, explaining both immigrant and nativist perspectives, connecting to the 1840s or the 1920s, or treating immigrants as agents who built their own institutions.

        A list of immigrant groups with no judgment about the extent of change cannot earn the reasoning points.
