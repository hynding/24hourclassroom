    - slug: apush-u06-w20-q17
      type: true_false
      topic_code: "6.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Most immigrants arriving in the United States between 1890 and 1910 came from northern and western Europe, as in earlier decades.
      answer: false
      explanation: |
        False. By the 1890s southern and eastern Europeans (Italians, Poles, Russian Jews, Slovaks, Hungarians, Greeks) made up the majority of arrivals. This 'new immigration' was more Catholic, Orthodox and Jewish and more often from peasant backgrounds, which fed nativist arguments. Skill: continuity and change.

    - slug: apush-u06-w20-q18
      type: true_false
      topic_code: "5.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Wartime federal policies of the Civil War, such as higher protective tariffs, the National Banking Acts and railroad subsidies, helped lay the foundation for rapid industrial growth after 1865.
