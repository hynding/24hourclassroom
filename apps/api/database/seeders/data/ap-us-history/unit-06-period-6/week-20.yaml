week: 20
unit: 6
title: "Labor, Immigration and the Gilded Age City"
topics: ["6.7", "6.8", "6.9", "6.10"]
guide: guides/week-20.md
guide_description: |
  Wage work in industrial America and the unions and strikes it produced (the Knights of Labor, the AFL, 1877,
  Haymarket, Homestead and Pullman); the 'new immigration' from southern and eastern Europe and Asia and the
  migration from farm to city; nativism, exclusion, machines and settlement houses as responses; and the new urban
  middle class and its culture. Worked examples: comparing the Knights and the AFL, sourcing Riis and the Chinese
  Exclusion Act, and a continuity-and-change paragraph on immigration.
flashcards_description: |
  32 cards on industrial work and unions, the great strikes, the new immigrants and the growth of cities, nativism
  and political machines, and the white-collar middle class and its leisure.

flashcards:
  - front: Wage labor in the Gilded Age → three conditions
    back: |
      Ten- to twelve-hour days and six-day weeks; dangerous factories, mines and railroads with no compensation for injury; frequent wage cuts and layoffs in depressions. Mechanization replaced skilled craftsmen with semiskilled machine tenders.
    topic_code: "6.7"
  - front: Women and children in Gilded Age industry → where they worked
    back: |
      Women worked in textile and garment shops, as domestic servants and, increasingly, as clerks and typists; children worked in Southern textile mills, coal-mine breakers and city street trades. Both were paid far less than men.
    topic_code: "6.7"
  - front: National Labor Union (1866) → goal and fate
    back: |
      The first national labor federation, led by William Sylvis, pressed for an eight-hour day and admitted many trades. It faded after the Panic of 1873, but it set the pattern of national organizing.
    topic_code: "6.7"
  - front: Great Railroad Strike of 1877 → cause and response
    back: |
      After repeated wage cuts in the depression following 1873, railroad workers struck from Baltimore to St. Louis; riots followed and about 100 people died. President Hayes sent federal troops, the first major use of the army against strikers.
    topic_code: "6.7"
  - front: Knights of Labor → membership and goals
    back: |
      Founded 1869, led from 1879 by Terence Powderly. Open to skilled and unskilled workers, women and African Americans (though it excluded the Chinese). It sought an eight-hour day, cooperatives and an end to the wage system; it peaked at about 700,000 members in 1886.
    topic_code: "6.7"
  - front: Haymarket Square, Chicago (May 4, 1886) → events and consequence
    back: |
      At a rally for the eight-hour day after police killed strikers at the McCormick works, a bomb killed police officers and police fired into the crowd. Eight anarchists were convicted on thin evidence and four hanged. The public linked labor with radicalism and the Knights of Labor declined.
    topic_code: "6.7"
  - front: American Federation of Labor (1886) → structure and strategy
    back: |
      Samuel Gompers' federation of skilled craft unions. 'Pure and simple' unionism: higher wages, shorter hours and better conditions through collective bargaining and strikes, with no plan to replace capitalism. It excluded most unskilled workers, women and African Americans in practice, and survived where the Knights did not.
    topic_code: "6.7"
  - front: Compare the Knights of Labor and the AFL
    back: |
      Knights: one big union of all producers, broad reform goals, opposed strikes in principle. AFL: a federation of skilled crafts, narrow bread-and-butter goals, willing to strike. The AFL's narrowness made it more durable but left most industrial workers unorganized.
    topic_code: "6.7"
  - front: Homestead Strike (1892) → what happened
    back: |
      At Carnegie's Homestead, Pennsylvania steel works, manager Henry Clay Frick cut wages and locked out the skilled union. A gun battle with 300 Pinkerton guards killed workers and guards; the state militia came in and the union was broken. Steel stayed non-union for decades.
    topic_code: "6.7"
  - front: Pullman Strike (1894) → cause, leader and outcome
    back: |
      The Pullman company cut wages without cutting rents in its company town. Eugene Debs's American Railway Union boycotted Pullman cars, halting western rail traffic. A federal injunction, partly based on the Sherman Act, and federal troops sent by Cleveland broke the strike; Debs went to jail.
    topic_code: "6.7"
  - front: In re Debs (1895) → holding
    back: |
      The Supreme Court upheld the injunction against the Pullman strikers as a legitimate use of federal power over interstate commerce and the mail. Injunctions became employers' strongest legal weapon against strikes.
    topic_code: "6.7"
  - front: Employers' weapons against unions → list five
    back: |
      Lockouts, blacklists, yellow-dog contracts (promises not to join a union), strikebreakers, private guards such as the Pinkertons, and court injunctions backed by state militias or federal troops.
    topic_code: "6.7"
  - front: Molly Maguires → who and significance
    back: |
      A secret society of Irish coal miners in Pennsylvania accused of violence in the 1870s; twenty were hanged after trials built on Pinkerton infiltration. The case linked unions, immigrants and violence in the public mind.
    topic_code: "6.7"
  - front: The 'new immigration' (about 1880–1920) → who came
    back: |
      Italians, Poles, Slovaks, Hungarians, Greeks and Russian and Eastern European Jews, mostly Catholic, Orthodox or Jewish and often from peasant backgrounds, joined by Chinese and later Japanese immigrants in the West and Mexicans in the Southwest.
    topic_code: "6.8"
  - front: Push and pull factors of the new immigration
    back: |
      Push: rural poverty and land shortage, population growth, religious persecution such as the pogroms against Russian Jews after 1881. Pull: industrial jobs, cheap steamship passage, letters and money from relatives already in America.
    topic_code: "6.8"
  - front: Ellis Island (1892) → what it was
    back: |
      The federal immigration station in New York Harbor that replaced the state-run Castle Garden. Most European immigrants passed through it, inspected for disease and for exclusion categories such as those 'likely to become a public charge'.
    topic_code: "6.8"
  - front: Ethnic enclaves → what they provided
    back: |
      Neighborhoods such as Little Italy or New York's Lower East Side offered housing, jobs through countrymen, churches and synagogues, foreign-language newspapers and mutual-aid societies. They eased arrival and kept old-world culture alive.
    topic_code: "6.8"
  - front: Chicago's growth, 1870–1900 → numbers and why
    back: |
      From about 300,000 people in 1870 to about 1.7 million in 1900, despite the fire of 1871. A rail hub for grain, lumber and meat, Chicago drew immigrants and rural migrants and became the symbol of the industrial city.
    topic_code: "6.8"
  - front: Rural-to-urban migration → who moved and why
    back: |
      Farm children of native-born families and African Americans from the rural South moved to cities for wages, schools and excitement, pushed by falling crop prices and farm mechanization. The urban share of Americans rose from about a quarter in 1870 to about two-fifths in 1900.
    topic_code: "6.8"
  - front: Dumbbell tenement → what and why it mattered
    back: |
      A New York design (1879) for five- or six-story buildings with a narrow air shaft between them; tiny, dark rooms, shared toilets and dense crowding. Tenement conditions became the focus of reformers like Jacob Riis.
    topic_code: "6.8"
  - front: Political machine → how it worked
    back: |
      A party organization run by a boss that traded jobs, favors, coal, bail money and help with the law for votes, and paid for it all with graft from city contracts and franchises. Machines served immigrants whom no one else served, at a high cost in corruption.
    topic_code: "6.9"
  - front: William 'Boss' Tweed and Tammany Hall → what and how it ended
    back: |
      Tweed's Democratic machine in New York stole tens of millions of dollars in the late 1860s, much of it through padded construction contracts. Exposed by The New York Times and Thomas Nast's cartoons, Tweed was convicted in 1873; Tammany survived him.
    topic_code: "6.9"
  - front: Nativism in the Gilded Age → three examples
    back: |
      The Workingmen's Party of California's anti-Chinese campaign ('The Chinese must go', 1877); the anti-Catholic American Protective Association (1887); the Immigration Restriction League (1894), which pushed for a literacy test aimed at southern and eastern Europeans.
    topic_code: "6.9"
  - front: Chinese Exclusion Act (1882) → terms and significance
    back: |
      Suspended the immigration of Chinese laborers for ten years and barred Chinese immigrants from naturalization. Renewed in 1892 and made permanent in 1902, it was the first federal law to bar a group by nationality, and was repealed only in 1943.
    topic_code: "6.9"
  - front: Rock Springs massacre (1885) → what and significance
    back: |
      White miners in Rock Springs, Wyoming Territory, killed at least 28 Chinese miners and burned their homes in a dispute over wages and jobs. Violence like this accompanied the legal campaign for exclusion across the West.
    topic_code: "6.9"
  - front: Immigration Act of 1882 (general) → what it added
    back: |
      Passed the same year as Chinese exclusion, it imposed a head tax on arriving immigrants and barred convicts, the mentally ill and anyone 'likely to become a public charge'. The start of federal regulation of who could enter.
    topic_code: "6.9"
  - front: Americanization → meaning in the Gilded Age
    back: |
      Efforts by schools, settlement houses, employers and patriotic groups to teach immigrants English, civics and American customs. Some saw it as opportunity; others as pressure to abandon language, religion and culture.
    topic_code: "6.9"
  - front: The new middle class → who belonged
    back: |
      Salaried clerks, managers, salesmen, engineers, teachers, doctors and lawyers working for corporations, cities and professions. Office work and the professions grew fast, and young single women filled typing, bookkeeping and sales jobs.
    topic_code: "6.10"
  - front: Department stores and mail-order catalogs → significance
    back: |
      Macy's, Marshall Field and Wanamaker's in the cities and Montgomery Ward (1872) and later Sears catalogs in the countryside created a national consumer culture of fixed prices, advertising and mass-produced goods.
    topic_code: "6.10"
  - front: Gilded Age leisure → four examples
    back: |
      Professional baseball (National League, 1876), vaudeville theaters, amusement parks such as Coney Island, the bicycle craze of the 1890s; plus city parks like Olmsted's Central Park and the Chautauqua lecture circuit for self-improvement.
    topic_code: "6.10"
  - front: Women's colleges and the 'New Woman' → significance
    back: |
      Vassar (1861), Wellesley and Smith (1875) and Bryn Mawr (1885) educated middle-class women, many of whom entered teaching, social work and reform. The 'New Woman' of the 1890s was educated, independent and often unmarried, challenging the separate-spheres ideal.
    topic_code: "6.10"
  - front: Thorstein Veblen, The Theory of the Leisure Class (1899) → key term
    back: |
      Conspicuous consumption: the rich spend lavishly to display status, not for use. The phrase sums up the Gilded Age elite of Fifth Avenue mansions and Newport 'cottages'.
    topic_code: "6.10"

quiz:
  description: |
    23 questions · about 35 minutes · about 70% this week (labor, immigration and migration, responses to
    immigration, and the new middle class) and 30% review of weeks 18 and 19 and of earlier periods (western
    railroads, technology and industrial capitalism, Plessy, Civil War economic policy, antebellum immigration and
    reform). Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long essay are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set A: the Chinese Exclusion Act (6.9, review 6.2)
    - slug: apush-u06-w20-q01
      type: multiple_choice
      topic_code: "6.9"
      source: "Primary source: Chinese Exclusion Act (1882), National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "Whereas in the opinion of the Government of the United States the coming of Chinese laborers to this country endangers the good order of certain localities within the territory thereof: Therefore, Be it enacted by the Senate and House of Representatives of the United States of America in Congress assembled, That from and after the expiration of ninety days next after the passage of this act, and until the expiration of ten years next after the passage of this act, the coming of Chinese laborers to the United States be, and the same is hereby, suspended ... "

        Section 14: "That hereafter no State court or court of the United States shall admit Chinese to citizenship ..."

        — An Act to Execute Certain Treaty Stipulations Relating to Chinese (Chinese Exclusion Act), May 6, 1882
      prompt: |
        Which of the following most directly contributed to the passage of the act in the excerpt?
      options:
        - "The success of the Knights of Labor in organizing Chinese workers"
        - "A shortage of labor for western railroads in the 1880s"
        - "A request from the Chinese government to stop emigration"
        - "Pressure from white workers and politicians in the West, especially California, who blamed Chinese laborers for low wages and unemployment"
      option_explanations:
        - |
          The Knights of Labor excluded Chinese workers and supported exclusion; they did not organize them.
        - |
          A labor shortage would have argued for more immigration, not less. The act came as railroad construction jobs dried up and white workers competed with Chinese workers.
        - |
          China did not ask for exclusion; the United States renegotiated the Burlingame Treaty in 1880 to allow it to limit Chinese immigration.
        - |
          Correct. After the depression of the 1870s, Denis Kearney's Workingmen's Party of California and both national parties competing for western votes blamed Chinese workers for low wages; racial hostility and economic fear produced the law.
      answer: 3
      explanation: |
        Skill: contextualization and causation. Exclusion combined economic competition after the 1870s depression with racial nativism; strong answers name both.

    - slug: apush-u06-w20-q02
      type: multiple_choice
      topic_code: "6.9"
      source: "Primary source: Chinese Exclusion Act (1882), National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "Whereas in the opinion of the Government of the United States the coming of Chinese laborers to this country endangers the good order of certain localities within the territory thereof: Therefore, Be it enacted by the Senate and House of Representatives of the United States of America in Congress assembled, That from and after the expiration of ninety days next after the passage of this act, and until the expiration of ten years next after the passage of this act, the coming of Chinese laborers to the United States be, and the same is hereby, suspended ... "

        Section 14: "That hereafter no State court or court of the United States shall admit Chinese to citizenship ..."

        — An Act to Execute Certain Treaty Stipulations Relating to Chinese (Chinese Exclusion Act), May 6, 1882
      prompt: |
        The act in the excerpt was historically significant chiefly because it
      options:
        - "ended all immigration to the United States for ten years"
        - "was the first federal law to bar immigration of a group on the basis of nationality"
        - "was struck down by the Supreme Court soon after its passage"
        - "granted citizenship to Chinese immigrants already in the country"
      option_explanations:
        - |
          It suspended only Chinese laborers; European immigration rose to record levels in the 1880s.
        - |
          Correct. Earlier federal law had excluded categories such as convicts; this act singled out one nationality, was renewed in 1892, made permanent in 1902 and repealed only in 1943. It became a model for the restrictive quotas of the 1920s.
        - |
          The Court upheld exclusion, for example in Chae Chan Ping v. United States (1889).
        - |
          Section 14 did the opposite, forbidding courts to naturalize Chinese immigrants. (Children born in the United States were citizens by birth, as United States v. Wong Kim Ark confirmed in 1898.)
      answer: 1
      explanation: |
        Skill: causation (significance). A law matters for what it starts: federal immigration restriction by race and nationality begins here.

    - slug: apush-u06-w20-q03
      type: multiple_choice
      topic_code: "6.2"
      source: "Primary source: Chinese Exclusion Act (1882), National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "Whereas in the opinion of the Government of the United States the coming of Chinese laborers to this country endangers the good order of certain localities within the territory thereof: Therefore, Be it enacted by the Senate and House of Representatives of the United States of America in Congress assembled, That from and after the expiration of ninety days next after the passage of this act, and until the expiration of ten years next after the passage of this act, the coming of Chinese laborers to the United States be, and the same is hereby, suspended ... "

        Section 14: "That hereafter no State court or court of the United States shall admit Chinese to citizenship ..."

        — An Act to Execute Certain Treaty Stipulations Relating to Chinese (Chinese Exclusion Act), May 6, 1882
      prompt: |
        Review. Which earlier development best illustrates the irony of the act, given the contribution of Chinese workers to the West?
      options:
        - "The Treaty of Fort Laramie's guarantee of land to Chinese miners"
        - "The construction of the Central Pacific Railroad across the Sierra Nevada, carried out largely by Chinese laborers"
        - "The settlement of Kansas by Chinese Exodusters"
        - "The Homestead Act's grants of land to Chinese farmers"
      option_explanations:
        - |
          The Fort Laramie Treaty (1868) concerned the Lakota and the United States, not Chinese miners.
        - |
          Correct. Thousands of Chinese workers, a large majority of the Central Pacific's workforce, blasted the line through the Sierra Nevada in the 1860s; little more than a decade after the golden spike, Congress barred new Chinese laborers.
        - |
          The Exodusters were African Americans from the South who moved to Kansas in 1879.
        - |
          Homesteading required declaring intent to become a citizen, which the naturalization law of the time largely closed to Chinese immigrants.
      answer: 1
      explanation: |
        Skill: making connections (week 18 to week 20). Chinese labor built the western economy (6.2); exclusion (6.9) shows how welcome depended on the needs of the moment.

    # ---- Stimulus set B: Jacob Riis (6.8, 6.10, review 4.11)
    - slug: apush-u06-w20-q04
      type: multiple_choice
      topic_code: "6.8"
      source: "Primary source: Jacob A. Riis, How the Other Half Lives (1890), Project Gutenberg"
      points: 1
      stimulus: |
        "Long ago it was said that 'one half of the world does not know how the other half lives.' That was true then. It did not know because it did not care. ... To-day three-fourths of its [New York's] people live in the tenements, and the nineteenth century drift of the population to the cities is sending ever-increasing multitudes to crowd them. The fifteen thousand tenant houses that were the despair of the sanitarian in the past generation have swelled into thirty-seven thousand, and more than twelve hundred thousand persons call them home."

        — Jacob A. Riis, How the Other Half Lives: Studies Among the Tenements of New York, 1890
      prompt: |
        The conditions Riis describes were most directly the result of
      options:
        - "federal programs that built public housing in New York"
        - "the movement of immigrants and rural Americans into industrial cities faster than decent housing could be built"
        - "laws requiring immigrants to live in tenement districts"
        - "the decline of manufacturing in New York City"
      option_explanations:
        - |
          There was no federal public housing until the 1930s; private landlords built the tenements.
        - |
          Correct. Riis names 'the nineteenth century drift of the population to the cities' as the cause. Immigrants and rural migrants poured into New York for jobs, and landlords packed them into cheap tenements.
        - |
          No law required immigrants to live in tenements; poverty, low wages and the need to live near work did.
        - |
          New York's manufacturing, especially garment work, was growing; jobs drew the crowds.
      answer: 1
      explanation: |
        Skill: causation. Use the source's own explanation and connect it to the broader process of urbanization and the new immigration.

    - slug: apush-u06-w20-q05
      type: multiple_choice
      topic_code: "6.10"
      source: "Primary source: Jacob A. Riis, How the Other Half Lives (1890), Project Gutenberg"
      points: 1
      stimulus: |
        "Long ago it was said that 'one half of the world does not know how the other half lives.' That was true then. It did not know because it did not care. ... To-day three-fourths of its [New York's] people live in the tenements, and the nineteenth century drift of the population to the cities is sending ever-increasing multitudes to crowd them. The fifteen thousand tenant houses that were the despair of the sanitarian in the past generation have swelled into thirty-seven thousand, and more than twelve hundred thousand persons call them home."

        — Jacob A. Riis, How the Other Half Lives: Studies Among the Tenements of New York, 1890
      prompt: |
        Riis's intended audience was most likely
      options:
        - "European governments considering emigration restrictions"
        - "tenement residents, whom he urged to organize rent strikes"
        - "middle-class and wealthy readers whom he hoped to move to support housing reform"
        - "factory owners, whom he urged to build company towns"
      option_explanations:
        - |
          Riis wrote in English for an American public about New York; he did not address European governments.
        - |
          The book describes tenement dwellers rather than addressing them, and it called for reform from above, not tenant organizing.
        - |
          Correct. 'The other half' is seen from outside; Riis, a police reporter, wrote and photographed for comfortable readers who 'did not know because it did not care', to shame them into action. His book helped bring the New York Tenement House Act of 1901.
        - |
          Riis urged better housing laws and model tenements, not company towns, which had their own critics, as the Pullman strike showed.
      answer: 2
      explanation: |
        Skill: sourcing (audience and purpose). 'Did not care' is an accusation aimed at the reader: the rising middle class (6.10) that reformers hoped to mobilize.

    - slug: apush-u06-w20-q06
      type: multiple_choice
      topic_code: "4.11"
      source: "Primary source: Jacob A. Riis, How the Other Half Lives (1890), Project Gutenberg"
      points: 1
      stimulus: |
        "Long ago it was said that 'one half of the world does not know how the other half lives.' That was true then. It did not know because it did not care. ... To-day three-fourths of its [New York's] people live in the tenements, and the nineteenth century drift of the population to the cities is sending ever-increasing multitudes to crowd them. The fifteen thousand tenant houses that were the despair of the sanitarian in the past generation have swelled into thirty-seven thousand, and more than twelve hundred thousand persons call them home."

        — Jacob A. Riis, How the Other Half Lives: Studies Among the Tenements of New York, 1890
      prompt: |
        Review. Riis's method of exposing conditions to stir public conscience most closely resembles which earlier reform effort?
      options:
        - "The Second Bank of the United States' regulation of state banks"
        - "Dorothea Dix's reports to state legislatures in the 1840s describing the treatment of the mentally ill in jails and almshouses"
        - "Jefferson's purchase of Louisiana"
        - "The Federalists' campaign for the Alien and Sedition Acts"
      option_explanations:
        - |
          The Bank's restraint of state banks was financial policy, not moral reform.
        - |
          Correct. Dix investigated and documented conditions, then presented the evidence to lawmakers and the public to demand asylums. Riis used journalism and photography in the same way: exposure as a tool of reform.
        - |
          The Louisiana Purchase was territorial expansion, unrelated to reform by exposure.
        - |
          The Alien and Sedition Acts restricted immigrants and critics of the government; they were not an effort to expose social conditions.
      answer: 1
      explanation: |
        Skill: making connections (continuity). Antebellum reformers (4.11) and Gilded Age urban reformers shared a faith that facts, vividly presented, would move the public; Progressive muckrakers inherited it.

    # ---- Stimulus set C: Emma Lazarus (6.8, 6.9, review 4.6)
    - slug: apush-u06-w20-q07
      type: multiple_choice
      topic_code: "6.8"
      source: "Primary source: Emma Lazarus, 'The New Colossus' (1883), National Park Service, Statue of Liberty National Monument"
      points: 1
      stimulus: |
        "'Keep, ancient lands, your storied pomp!' cries she
        With silent lips. 'Give me your tired, your poor,
        Your huddled masses yearning to breathe free,
        The wretched refuse of your teeming shore.
        Send these, the homeless, tempest-tost to me,
        I lift my lamp beside the golden door!'"

        — Emma Lazarus, "The New Colossus," written in 1883 for a fundraiser for the pedestal of the Statue of Liberty
      prompt: |
        By the 1890s the largest share of the immigrants arriving at the 'golden door' of New York came from
      options:
        - "southern and eastern Europe, including Italy, Austria-Hungary and the Russian Empire"
        - "China and Japan"
        - "Great Britain and Scandinavia only"
        - "Mexico and Central America"
      option_explanations:
        - |
          Correct. The 'new immigration' shifted the main sources from northern and western Europe to Italy, Poland, the Russian Empire (including many Jews fleeing pogroms) and Austria-Hungary.
        - |
          Asian immigrants arrived mainly on the West Coast, and Chinese laborers had been excluded since 1882.
        - |
          British and Scandinavian immigrants continued to arrive, but by the 1890s they were outnumbered by southern and eastern Europeans.
        - |
          Mexican immigration grew mainly after 1900 and entered across the southwestern border, not through New York.
      answer: 0
      explanation: |
        Skill: contextualization. Know who the 'huddled masses' were in each decade; the change in sources is what made nativists anxious.

    - slug: apush-u06-w20-q08
      type: multiple_choice
      topic_code: "6.9"
      source: "Primary source: Emma Lazarus, 'The New Colossus' (1883), National Park Service, Statue of Liberty National Monument"
      points: 1
      stimulus: |
        "'Keep, ancient lands, your storied pomp!' cries she
        With silent lips. 'Give me your tired, your poor,
        Your huddled masses yearning to breathe free,
        The wretched refuse of your teeming shore.
        Send these, the homeless, tempest-tost to me,
        I lift my lamp beside the golden door!'"

        — Emma Lazarus, "The New Colossus," written in 1883 for a fundraiser for the pedestal of the Statue of Liberty
      prompt: |
        The view of immigration in the poem most directly contrasts with the goals of which group?
      options:
        - "Immigrant mutual-aid societies"
        - "The Immigration Restriction League, founded in 1894 to press for a literacy test aimed at reducing immigration from southern and eastern Europe"
        - "The Knights of Labor's campaign for an eight-hour day"
        - "Settlement-house workers such as Jane Addams"
      option_explanations:
        - |
          Mutual-aid societies were organized by immigrants themselves to help newcomers, the opposite of restriction.
        - |
          Correct. Lazarus welcomes 'the wretched refuse'; the League's founders, many from old New England families, argued that such immigrants were undesirable and should be screened out.
        - |
          The eight-hour campaign concerned working hours, not who could enter the country (though the Knights did support Chinese exclusion).
        - |
          Settlement workers helped immigrants adapt and generally shared Lazarus's welcome, even if they also promoted Americanization.
      answer: 1
      explanation: |
        Skill: comparison of perspectives. The same years produced the most famous welcome in American literature and an organized movement to close the door.

    - slug: apush-u06-w20-q09
      type: multiple_choice
      topic_code: "4.6"
      source: "Primary source: Emma Lazarus, 'The New Colossus' (1883), National Park Service, Statue of Liberty National Monument"
      points: 1
      stimulus: |
        "'Keep, ancient lands, your storied pomp!' cries she
        With silent lips. 'Give me your tired, your poor,
        Your huddled masses yearning to breathe free,
        The wretched refuse of your teeming shore.
        Send these, the homeless, tempest-tost to me,
        I lift my lamp beside the golden door!'"

        — Emma Lazarus, "The New Colossus," written in 1883 for a fundraiser for the pedestal of the Statue of Liberty
      prompt: |
        Review. Which earlier wave of immigration provoked a nativist reaction most similar to the one the 'new immigrants' faced?
      options:
        - "The arrival of Loyalist refugees after the Revolution"
        - "The forced migration of enslaved Africans in the eighteenth century"
        - "The arrival of Irish and German Catholic immigrants in the 1840s and 1850s, which gave rise to the Know-Nothing Party"
        - "The arrival of English Puritans in the 1630s"
      option_explanations:
        - |
          Loyalists mostly left the United States after the Revolution, for Canada and Britain.
        - |
          Forced migration under slavery is not a case of voluntary immigration provoking nativism; it is a different history.
        - |
          Correct. Famine-era Irish and German Catholics were accused of crime, drunkenness, loyalty to the pope and taking jobs, the same charges later aimed at Italians, Poles and Jews. Anti-Catholicism links the Know-Nothings to the American Protective Association.
        - |
          Puritans founded the dominant colonial culture; there was no established American nativism to react against them.
      answer: 2
      explanation: |
        Skill: continuity and change. Nativism recurs: each wave's newcomers are cast as unassimilable, until a later wave replaces them as the target.

    - slug: apush-u06-w20-q10
      type: multiple_choice
      topic_code: "6.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best describes a difference between the Knights of Labor and the American Federation of Labor?
      options:
        - "The Knights supported Chinese immigration, while the AFL opposed it."
        - "The Knights relied mainly on strikes, while the AFL opposed strikes in principle."
        - "The Knights admitted only skilled white men, while the AFL welcomed all workers regardless of race and sex."
        - "The Knights sought to organize nearly all workers and reform the wage system, while the AFL organized skilled craft workers for higher wages and shorter hours."
      option_explanations:
        - |
          Both organizations supported Chinese exclusion.
        - |
          This also reverses them: Powderly distrusted strikes, while AFL unions used them as a main weapon.
        - |
          This reverses them. The Knights were the inclusive organization; AFL unions often excluded women, African Americans and the unskilled.
        - |
          Correct. Under Powderly the Knights admitted skilled and unskilled workers, women and African Americans and dreamed of cooperatives replacing wage labor; Gompers' AFL pursued 'pure and simple' bread-and-butter goals for craft unions.
      answer: 3
      explanation: |
        Skill: comparison. Inclusive and visionary versus narrow and durable: that contrast explains why the AFL outlasted the Knights after Haymarket.

    - slug: apush-u06-w20-q11
      type: multiple_choice
      topic_code: "6.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The outcome of the Pullman Strike of 1894 demonstrated that
      options:
        - "the Sherman Antitrust Act was most often enforced against large corporations"
        - "industrial unions could defeat large corporations with the help of the federal government"
        - "railroad workers had won the right to collective bargaining under federal law"
        - "the federal government was willing to use court injunctions and troops to end strikes that disrupted interstate commerce"
      option_explanations:
        - |
          In the 1890s the Sherman Act was used effectively against unions while E. C. Knight sheltered the Sugar Trust.
        - |
          The American Railway Union was crushed, and the federal government was on the company's side.
        - |
          Federal protection of collective bargaining came with the Wagner Act in 1935 (railway workers in 1926).
        - |
          Correct. Attorney General Richard Olney obtained an injunction, partly under the Sherman Act; President Cleveland sent troops to Chicago over Governor Altgeld's objections; Debs was jailed; and the Court upheld it all in In re Debs (1895).
      answer: 3
      explanation: |
        Skill: causation (effects). Pullman showed how state power (courts and the army) set the limits of labor action in the Gilded Age, and it turned Eugene Debs toward socialism.

    - slug: apush-u06-w20-q12
      type: multiple_choice
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The spread of new machinery in late nineteenth-century factories most directly affected workers by
      options:
        - "replacing many skilled craftsmen with semiskilled machine operators who were easier to replace and paid less"
        - "giving workers ownership of the machines they operated"
        - "ending the need for factory labor"
        - "increasing demand for skilled artisans in every trade"
      option_explanations:
        - |
          Correct. Mechanization deskilled work in shoes, steel, meatpacking and many other trades, weakened craftsmen's bargaining power and made workers interchangeable, one reason for the labor conflict of the period.
        - |
          Machines were owned by employers; workers' loss of control over tools is part of the shift to wage labor.
        - |
          Factories employed more workers than ever; machines changed the work rather than eliminating it.
        - |
          Some new skills appeared, but the main trend was the opposite: machines broke craft work into simple repetitive tasks.
      answer: 0
      explanation: |
        Skill: making connections between technology (6.5) and labor (6.7). Strikes were often about who controlled the pace and organization of work, not wages alone.

    - slug: apush-u06-w20-q13
      type: multiple_choice
      topic_code: "6.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Urban political machines such as New York's Tammany Hall gained the support of many immigrants chiefly because they
      options:
        - "campaigned for the restriction of immigration"
        - "provided jobs, food, coal and help with the law in exchange for votes, at a time when cities offered few social services"
        - "refused to accept money from businesses seeking city contracts"
        - "were run by Protestant reformers opposed to corruption"
      option_explanations:
        - |
          Machines depended on immigrant votes and opposed restriction.
        - |
          Correct. Ward bosses offered practical help to newcomers who had nowhere else to turn and asked only for loyalty at the polls; graft from contracts and franchises paid for it.
        - |
          Machines thrived on payments from businesses seeking contracts and franchises; this was the source of 'graft'.
        - |
          Reformers were usually the machines' opponents; Tammany was a Democratic organization led largely by Irish Americans.
      answer: 1
      explanation: |
        Skill: historical perspective. To reformers machines meant corruption; to immigrants they meant help. A strong essay explains both.

    - slug: apush-u06-w20-q14
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Critics pointed to the Homestead Strike of 1892 as evidence of a contradiction in Andrew Carnegie's public philosophy because
      options:
        - "Carnegie refused to give any money to libraries or universities"
        - "Carnegie preached the responsible use of wealth while his company cut wages, locked out its union and hired armed Pinkerton guards"
        - "Carnegie argued that workers should share equally in profits"
        - "Carnegie supported government ownership of steel mills"
      option_explanations:
        - |
          Carnegie gave away most of his fortune, funding thousands of libraries; the contradiction lay elsewhere.
        - |
          Correct. Carnegie had written of the rich as trustees for the public good and had spoken in favor of workers' right to organize; at Homestead his manager Henry Clay Frick broke the union by force while Carnegie stayed in Scotland.
        - |
          The Gospel of Wealth defended unequal fortunes as the result of competition; it did not call for equal profit-sharing.
        - |
          Carnegie was a private industrialist who never supported government ownership.
      answer: 1
      explanation: |
        Skill: evaluating a source's claims against actions. Pair the Gospel of Wealth (6.6) with Homestead (6.7) to show the gap between ideology and practice.

    - slug: apush-u06-w20-q15
      type: multi_select
      topic_code: "6.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that employers in the Gilded Age used to defeat strikes or prevent unions.
      options:
        - "Court injunctions ordering strikers back to work"
        - "Blacklists of union members shared among employers"
        - "Yellow-dog contracts in which workers promised not to join a union"
        - "Federal laws guaranteeing the right to organize"
        - "Private armed guards and strikebreakers"
      option_explanations:
        - |
          Correct. Injunctions, as in the Pullman Strike, turned a strike into contempt of court.
        - |
          Correct. Blacklisted workers could not find jobs in their trade.
        - |
          Correct. These contracts became common; the Norris-La Guardia Act made them unenforceable in federal courts only in 1932.
        - |
          No such law existed in this period; the right to organize was protected only from the 1930s. This option is false.
        - |
          Correct. Pinkerton agents at Homestead and strikebreakers recruited from among the unemployed or new immigrants were common.
      answer: [0, 1, 2, 4]
      explanation: |
        Skill: categorizing evidence. Employers had private, legal and governmental weapons; unions had few legal protections until the New Deal.

