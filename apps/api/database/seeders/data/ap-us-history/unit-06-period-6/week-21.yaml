    - slug: apush-u06-w21-q21
      type: short_answer
      topic_code: "6.12"
      source: "Primary source: Grover Cleveland, veto message on the Texas Seed Bill (1887), The American Presidency Project (UC Santa Barbara)"
      points: 3
      stimulus: |
        "I can find no warrant for such an appropriation in the Constitution, and I do not believe that the power and duty of the General Government ought to be extended to the relief of individual suffering which is in no manner properly related to the public service or benefit. A prevalent tendency to disregard the limited mission of this power and duty should, I think, be steadfastly resisted, to the end that the lesson should be constantly enforced that though the people support the Government the Government should not support the people."

        — President Grover Cleveland, veto of a bill to distribute $10,000 of seed to drought-stricken farmers in Texas, February 16, 1887
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe Cleveland's view of the proper role of the federal government.
        (b) Briefly explain ONE historical development from 1865 to 1898 that challenged Cleveland's view.
        (c) Briefly explain ONE way the federal government in the same period acted in a manner inconsistent with Cleveland's stated principle of limited government.
      answer: |
        (a) Cleveland held that the federal government had a limited mission: it could not constitutionally spend public money to relieve individual hardship, and aid would weaken self-reliance, so the people should support the government and not the reverse.
        (b) The Populist movement challenged it: the Omaha Platform of 1892 declared that the power of government should be expanded to end 'oppression, injustice and poverty' and demanded the subtreasury, a graduated income tax and government ownership of railroads.
        (c) The federal government had given railroads millions of acres of land and loans under the Pacific Railway Acts and kept high protective tariffs that benefited manufacturers, so it did support particular interests, just not drought-stricken farmers.
      explanation: |
        Skill: sourcing (point of view) and argumentation. One point per part.

        (a) 1 point for an accurate description: limited, constitutionally restricted government; no federal relief for individual suffering; fear of dependence. Zero for 'Cleveland did not like farmers'.

        (b) 1 point for a specific development explained: the Grange and Granger laws, the Farmers' Alliances and subtreasury plan, the Omaha Platform (1892), Coxey's Army (1894) asking for public works, Bryan's 1896 campaign, Henry George or Edward Bellamy, the Social Gospel. Zero for a development after 1898 unless clearly linked.

        (c) 1 point for a specific inconsistent federal action explained: railroad land grants and loans, the Homestead Act's free land, protective tariffs (McKinley Tariff, 1890), Union veterans' pensions, federal troops and injunctions in the 1877 and Pullman strikes, the Interstate Commerce Act (1887). Zero for state actions presented as federal.

    - slug: apush-u06-w21-q22
      type: short_answer
      topic_code: "6.13"
      source: "Interpretations written for this course, representing two schools of thought on the Populists"
      points: 3
      stimulus: |
        Interpretation 1 (written for this course, representing a view associated with mid-twentieth-century historians who were critical of the Populists):

        The Populists looked backward. Frightened by a modern economy they did not understand, they blamed conspiracies of bankers and railroads for problems caused by world markets, and pinned their hopes on the magic of silver.

        Interpretation 2 (written for this course, representing a view associated with historians writing from the 1970s on):

        The Populists looked forward. Through the cooperatives of the Farmers' Alliances they learned to analyze the economy and built a democratic movement that proposed practical remedies (the subtreasury, the income tax, regulation of railroads) that later governments adopted.
      prompt: |
        Using the interpretations above, answer (a), (b) and (c).

        (a) Briefly describe ONE major difference between the two interpretations.
        (b) Briefly explain how ONE specific historical development from 1877 to 1898 could be used to support Interpretation 1.
        (c) Briefly explain how ONE specific historical development from 1877 to 1898 could be used to support Interpretation 2.
      answer: |
        (a) Interpretation 1 sees the Populists as nostalgic and irrational, blaming conspiracies; Interpretation 2 sees them as forward-looking democrats with a sophisticated program that later became policy.
        (b) The focus on free silver supports Interpretation 1: by 1896 the movement had narrowed to a single monetary remedy, and the Omaha Platform's language about bankers and a ruined nation could be read as conspiracy thinking rather than analysis of falling world crop prices.
        (c) The graduated income tax supports Interpretation 2: proposed in the Omaha Platform of 1892, it became law in 1913 with the Sixteenth Amendment, as did the direct election of senators, showing the program anticipated Progressive reform.
      explanation: |
        Skill: analyzing historical interpretations. One point per part.

        (a) 1 point for a real difference: backward- versus forward-looking; irrational versus rational; conspiracy versus economic analysis. Zero for summarizing one interpretation only.

        (b) 1 point for evidence explained as supporting Interpretation 1: the fixation on free silver in 1896, the Omaha Platform's rhetoric about corruption and a ruined nation, nativist or antisemitic language among some Populists, the agrarian ideal of the independent farmer, Tom Watson's later turn to racism. Zero for unexplained naming.

        (c) 1 point for evidence explained as supporting Interpretation 2: Alliance cooperatives and lecturers, the subtreasury plan, the graduated income tax and direct election of senators later adopted, the secret ballot, interracial organizing efforts, the influence on Progressive and New Deal policy. Zero for evidence that does not fit the interpretation.

    - slug: apush-u06-w21-q23
      type: long_answer
      topic_code: "6.14"
      source: "general knowledge"
      points: 6
      prompt: |
        Historians have debated whether the Populist movement of the 1890s was something new in American politics or a continuation of older traditions of agrarian protest and reform. Consider the movement's goals, its supporters and its methods, and compare it with earlier movements.

        Evaluate the extent to which the Populist movement of the 1890s represented continuity with earlier American reform and protest movements.
      answer: |
        Thesis: The Populist movement largely continued older American traditions, the Jeffersonian ideal of the independent producer, Jacksonian hostility to concentrated money power and the Grange's demand for railroad regulation, but it changed those traditions by calling for a greatly expanded federal government, which made it a bridge to the Progressive Era.

        Context: Industrialization, railroads and world markets made farmers dependent on distant forces; deflation and falling crop prices from the 1870s to the 1890s deepened debt; the major parties largely ignored them.

        Body 1 (continuity of ideals): Jefferson's yeoman farmer; Jackson's Bank War against the 'money power'; the free-labor producer ideology; Greenbackers' inflationism in the 1870s.

        Body 2 (continuity of methods): the Grange's cooperatives and Granger laws (Munn, 1877); the Farmers' Alliances' cooperatives and lecturers; third-party politics like the Liberty and Free Soil parties.

        Body 3 (change): the Omaha Platform's call to expand the power of government 'as rapidly and as far as' experience allowed; government ownership of railroads and telegraphs; a graduated income tax; the subtreasury; a national third party winning over a million votes (1892); fusion with Democrats in 1896.

        Complexity: the Populists looked back in their ideals and forward in their means; many demands became law in the Progressive Era.
      explanation: |
        LEQ rubric applied to this prompt (6 points).

        Thesis/claim (1): a defensible claim about the extent of continuity, with a line of reasoning. 'The Populists were both new and old' without weighing earns nothing.

        Contextualization (1): the broader situation, such as falling crop prices and deflation, railroad and banking power, the crop-lien system in the South, the major parties' agreement on gold and limited regulation, or the Panic of 1893.

        Evidence (2): 1 point for two specific examples (the Grange, Munn v. Illinois, the Greenback Party, Farmers' Alliances, the subtreasury plan, the Omaha Platform, James Weaver's 1892 vote, Bryan and fusion in 1896, Tom Watson, Jacksonian Bank War, Jefferson's agrarian ideal). 2 points when the examples are used to support the argument about continuity.

        Analysis and reasoning (2): 1 point for using continuity and change over time to frame the argument (explicit comparison with earlier movements). 1 point for complex understanding, for example weighing continuity against change, explaining both sympathetic and critical interpretations of the Populists, connecting forward to the Progressive Era or New Deal, or analyzing the Populists' interracial experiment and its collapse.

        A narrative of the Populist movement without comparison to earlier movements cannot earn the reasoning points.
