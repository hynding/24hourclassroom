week: 21
unit: 6
title: "Reform, the Role of Government and Gilded Age Politics"
topics: ["6.11", "6.12", "6.13", "6.14"]
guide: guides/week-21.md
guide_description: |
  Gilded Age reformers (the Social Gospel, settlement houses, temperance and woman suffrage, Henry George and Edward
  Bellamy); the argument between laissez-faire and an active state in the courts and Congress (Munn, Wabash, the
  Interstate Commerce Act, the Sherman Act); the politics of patronage, tariffs and money; and the Populist revolt
  through the election of 1896. Worked examples: a DBQ-style sourcing of Cleveland's 1887 veto, a thesis on the
  Populists, and a continuity-and-change chart for the whole of Period 6.
flashcards_description: |
  32 cards on Gilded Age reformers, the debate over the role of government, the parties and issues of Gilded Age
  politics, the Populists and the election of 1896, and continuity and change across Period 6.

flashcards:
  - front: Social Gospel → what it taught
    back: |
      Protestant ministers such as Washington Gladden argued that Christians must reform society, not only save souls: fair wages, decent housing and an end to child labor were religious duties. It linked churches to labor and urban reform.
    topic_code: "6.11"
  - front: Hull House (1889) → founders and model
    back: |
      Jane Addams and Ellen Gates Starr's settlement house in an immigrant neighborhood of Chicago. Educated residents lived among the poor, ran kindergartens, clubs and classes, studied conditions and lobbied for laws on child labor, sanitation and factory safety.
    topic_code: "6.11"
  - front: Why were settlement houses led largely by college-educated women?
    back: |
      Women's colleges produced graduates barred from most professions and from politics; settlement work offered purposeful careers and a public role justified as 'social housekeeping'. Many later led Progressive reform.
    topic_code: "6.11"
  - front: Woman's Christian Temperance Union (1874) → leader and scope
    back: |
      Under Frances Willard (president from 1879) the WCTU became the largest women's organization in the country. Its 'Do Everything' policy joined temperance to woman suffrage, labor reform and prison reform.
    topic_code: "6.11"
  - front: National American Woman Suffrage Association (1890) → origin
    back: |
      The merger of the two rival suffrage organizations that had split in 1869 over the Fifteenth Amendment. Led by Elizabeth Cady Stanton and Susan B. Anthony, then Carrie Chapman Catt, it pursued both state campaigns and a federal amendment.
    topic_code: "6.11"
  - front: Woman suffrage in the West by 1896 → which states
    back: |
      Wyoming (territory 1869, state 1890), Colorado (1893), Utah and Idaho (1896). Western states led partly because women were scarce and valued, partly through Populist and Mormon politics. The East held out until the Nineteenth Amendment (1920).
    topic_code: "6.11"
  - front: Henry George, Progress and Poverty (1879) → problem and solution
    back: |
      George asked why poverty deepened as wealth grew, blaming the private capture of rising land values. His 'single tax' on land rents would fund government and end speculation. The book sold millions and nearly made him mayor of New York (1886).
    topic_code: "6.11"
  - front: Edward Bellamy, Looking Backward (1888) → plot and influence
    back: |
      A Bostonian wakes in the year 2000 to find a cooperative society in which the nation owns industry and everyone shares equally. The utopian novel inspired 'Nationalist' clubs and fed the Populist platform.
    topic_code: "6.11"
  - front: Laissez-faire in the Gilded Age → the claim and the contradiction
    back: |
      Defenders argued government should leave the economy alone. Yet the same government gave railroads land, protected industry with high tariffs, used troops and injunctions against strikers and kept the gold standard: 'hands off' applied mainly to regulation and relief.
    topic_code: "6.12"
  - front: William Graham Sumner, What Social Classes Owe to Each Other (1883) → argument
    back: |
      The Yale professor argued that reformers who used the state to help one class forced a 'forgotten man' to pay for it. In his formula, A and B decide what C shall do for D. Social classes owe each other nothing but mutual respect for rights.
    topic_code: "6.12"
  - front: Munn v. Illinois (1877) → holding
    back: |
      The Supreme Court upheld an Illinois Granger law setting grain-elevator rates: property 'clothed with a public interest' may be regulated for the common good. A high point for state regulation.
    topic_code: "6.12"
  - front: Wabash v. Illinois (1886) → holding and consequence
    back: |
      The Court ruled that states could not regulate railroad rates on interstate shipments, even within their own borders, because only Congress could regulate interstate commerce. It forced federal action the next year.
    topic_code: "6.12"
  - front: Interstate Commerce Act (1887) → provisions and limits
    back: |
      Required railroad rates to be 'reasonable and just', banned rebates, pools and charging more for a short haul than a long one, and created the Interstate Commerce Commission, the first federal regulatory agency. The courts soon stripped it of real rate-setting power.
    topic_code: "6.12"
  - front: Cleveland's veto of the Texas Seed Bill (1887) → his reasoning
    back: |
      Cleveland refused $10,000 for seed for drought-stricken Texas farmers: he found no constitutional warrant and warned that though the people support the government, the government should not support the people. A classic statement of limited government.
    topic_code: "6.12"
  - front: Pollock v. Farmers' Loan and Trust (1895) → holding
    back: |
      The Supreme Court struck down the federal income tax in the Wilson-Gorman Tariff of 1894 as an unapportioned direct tax. Overcome by the Sixteenth Amendment (1913). An example of courts limiting government's economic role.
    topic_code: "6.12"
  - front: Gilded Age party politics → four features
    back: |
      Evenly matched parties and razor-close presidential elections; very high voter turnout, often around 80 percent outside the South; loyalties built on region, religion and ethnicity; and patronage (the spoils system) as the fuel of party organization.
    topic_code: "6.13"
  - front: Republicans versus Democrats in the Gilded Age → bases and issues
    back: |
      Republicans: the Northeast and Midwest, Protestants, Union veterans; high tariffs, sound money, 'waving the bloody shirt'. Democrats: the white South, Catholic immigrants in cities; lower tariffs, limited government, states' rights.
    topic_code: "6.13"
  - front: Stalwarts, Half-Breeds and Mugwumps → who
    back: |
      Stalwarts (Roscoe Conkling) defended patronage; Half-Breeds (James G. Blaine) accepted modest reform; Mugwumps were reform Republicans who bolted to the Democrat Grover Cleveland in 1884 over Blaine's reputation for corruption.
    topic_code: "6.13"
  - front: Garfield's assassination (1881) → consequence
    back: |
      Charles Guiteau, a disappointed office seeker, shot President Garfield, who died in September 1881. Public outrage at the spoils system produced the Pendleton Act, signed by Garfield's successor Chester Arthur, a former Stalwart.
    topic_code: "6.13"
  - front: Pendleton Civil Service Act (1883) → what it did
    back: |
      Created a Civil Service Commission and required competitive exams for a share of federal jobs (about a tenth at first), forbidding firing those employees for political reasons or forcing them to donate. Presidents extended it over time.
    topic_code: "6.13"
  - front: The tariff in Gilded Age politics → McKinley Tariff (1890)
    back: |
      Republicans defended high protective tariffs as protecting American wages and industry; Democrats and farmers attacked them as raising prices. The McKinley Tariff pushed average rates to around half the value of imports and contributed to Republican losses in 1890 and 1892.
    topic_code: "6.13"
  - front: The money question → gold, greenbacks and silver
    back: |
      Debtors and farmers wanted inflation through greenbacks or free coinage of silver to raise prices and ease debts; creditors and business wanted the gold standard. The 'Crime of '73' (ending silver coinage), Bland-Allison (1878) and the Sherman Silver Purchase Act (1890) mark the fight.
    topic_code: "6.13"
  - front: Farmers' Alliances and the subtreasury plan → what they proposed
    back: |
      Alliances of the 1880s (Southern, Northern and the Colored Farmers' Alliance) organized cooperatives and proposed federal warehouses where farmers could store crops and borrow against them at low interest until prices rose. Its rejection pushed them into politics.
    topic_code: "6.13"
  - front: Omaha Platform of the People's Party (1892) → main demands
    back: |
      Free and unlimited coinage of silver at 16 to 1, a graduated income tax, government ownership of railroads, telegraphs and telephones, postal savings banks; resolutions also backed the direct election of senators, the secret ballot and shorter hours for workers.
    topic_code: "6.13"
  - front: James B. Weaver's 1892 campaign → result
    back: |
      The People's Party candidate won over a million popular votes and 22 electoral votes, the strongest third-party showing in decades, carrying states in the West. Populists also elected governors and members of Congress.
    topic_code: "6.13"
  - front: Panic of 1893 and Coxey's Army (1894) → what happened
    back: |
      Railroad and bank failures began the worst depression yet, with unemployment in 1894 estimated at roughly 12 to 18 percent. Jacob Coxey led a march of unemployed men to Washington asking for public works; leaders were arrested for walking on the Capitol grass.
    topic_code: "6.13"
  - front: William Jennings Bryan, 'Cross of Gold' speech (1896) → effect
    back: |
      At the Democratic convention in Chicago Bryan attacked the gold standard on behalf of the 'producing masses' and won the nomination. The Populists also nominated him, fusing the two parties and ending the People's Party as an independent force.
    topic_code: "6.13"
  - front: Election of 1896 → outcome and significance
    back: |
      William McKinley, backed by Mark Hanna's record fund-raising from business, defeated Bryan by winning the industrial Northeast and Midwest, including many urban workers. A realigning election: Republicans dominated national politics until 1932.
    topic_code: "6.13"
  - front: Why did Bryan and the Populists lose in 1896?
    back: |
      Free silver offered little to urban workers, who feared higher food prices; Catholic immigrants distrusted Bryan's evangelical style; business poured money into McKinley's campaign; and many Southern whites resisted Populist interracial appeals.
    topic_code: "6.13"
  - front: Tom Watson and interracial Populism → what was tried and what followed
    back: |
      Georgia Populist Tom Watson urged Black and white farmers to see a common economic interest. Democrats answered with fraud, violence and race-baiting; after the defeat, Southern disfranchisement intensified and Watson himself turned to racist politics.
    topic_code: "6.13"
  - front: Continuity across Period 6 (1865–1898) → three examples
    back: |
      Agriculture remained the largest single occupation; white supremacy persisted in a new legal form (Jim Crow); and Americans kept debating free labor, the meaning of citizenship and the proper size of government, as they had before the Civil War.
    topic_code: "6.14"
  - front: Change across Period 6 (1865–1898) → three examples
    back: |
      A national industrial economy dominated by corporations; a population increasingly urban and immigrant; and the first federal regulation (the ICC, the Sherman Act) and mass protest movements (Knights of Labor, Populists) that set the agenda for the Progressives.
    topic_code: "6.14"

quiz:
  description: |
    23 questions · about 35 minutes · about 70% this week (Gilded Age reform, the debate over the role of
    government, party politics, the Populists and the election of 1896, and continuity and change across Period 6)
    and 30% review of weeks 18 to 20 and of Period 5 (western farmers and the Grange, Social Darwinism, labor, the
    New South, nativism and Civil War finance). Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long essay are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: the Omaha Platform (6.13, 6.12, review 6.2)
    - slug: apush-u06-w21-q01
      type: multiple_choice
      topic_code: "6.13"
      source: "Primary source: People's Party (Omaha) Platform, July 4, 1892, The American Presidency Project (UC Santa Barbara)"
      points: 1
      stimulus: |
        "... we meet in the midst of a nation brought to the verge of moral, political, and material ruin. Corruption dominates the ballot-box, the Legislatures, the Congress, and touches even the ermine of the bench. ... The fruits of the toil of millions are boldly stolen to build up colossal fortunes for a few, unprecedented in the history of mankind; and the possessors of these, in turn despise the Republic and endanger liberty. From the same prolific womb of governmental injustice we breed the two great classes—tramps and millionaires. ...

        We believe that the power of government—in other words, of the people—should be expanded (as in the case of the postal service) as rapidly and as far as the good sense of an intelligent people and the teachings of experience shall justify, to the end that oppression, injustice and poverty, shall eventually cease in the land. ...

        We demand free and unlimited coinage of silver and gold at the present legal ratio of 16 to 1. ... Transportation being a means of exchange and a public necessity, the government should own and operate the railroads ..."

        — Platform of the People's Party, adopted at Omaha, Nebraska, July 4, 1892
      prompt: |
        The platform in the excerpt drew its strongest support from
      options:
        - "indebted farmers in the South and on the Great Plains"
        - "railroad executives seeking federal subsidies"
        - "Northern urban Catholic immigrants loyal to Democratic machines"
        - "eastern bankers and bondholders"
      option_explanations:
        - |
          Correct. Farmers squeezed by falling crop prices, mortgage and crop-lien debt and railroad rates built the Farmers' Alliances, which became the People's Party. Its strength lay in Kansas, Nebraska, the Dakotas, Colorado and much of the cotton South.
        - |
          The platform demanded government ownership of the railroads, hardly a goal of railroad executives.
        - |
          Urban immigrant workers largely stayed with the major parties; the Populists' rural, evangelical style and silver policy won them few city votes.
        - |
          Creditors opposed free silver, which would have inflated the currency and reduced the real value of debts owed to them.
      answer: 0
      explanation: |
        Skill: sourcing (historical situation and point of view). Read the demands (silver, railroads) as the grievances of debtors and shippers, which identifies the authors' constituency.

    - slug: apush-u06-w21-q02
      type: multiple_choice
      topic_code: "6.12"
      source: "Primary source: People's Party (Omaha) Platform, July 4, 1892, The American Presidency Project (UC Santa Barbara)"
      points: 1
      stimulus: |
        "... we meet in the midst of a nation brought to the verge of moral, political, and material ruin. Corruption dominates the ballot-box, the Legislatures, the Congress, and touches even the ermine of the bench. ... The fruits of the toil of millions are boldly stolen to build up colossal fortunes for a few, unprecedented in the history of mankind; and the possessors of these, in turn despise the Republic and endanger liberty. From the same prolific womb of governmental injustice we breed the two great classes—tramps and millionaires. ...

        We believe that the power of government—in other words, of the people—should be expanded (as in the case of the postal service) as rapidly and as far as the good sense of an intelligent people and the teachings of experience shall justify, to the end that oppression, injustice and poverty, shall eventually cease in the land. ...

        We demand free and unlimited coinage of silver and gold at the present legal ratio of 16 to 1. ... Transportation being a means of exchange and a public necessity, the government should own and operate the railroads ..."

        — Platform of the People's Party, adopted at Omaha, Nebraska, July 4, 1892
      prompt: |
        The view of government expressed in the excerpt most directly challenged
      options:
        - "the New Deal's creation of a welfare state"
        - "the laissez-faire belief that government should not interfere in the economy or redistribute wealth"
        - "the Progressive Era's expansion of federal regulation"
        - "the abolitionists' moral case against slavery"
      option_explanations:
        - |
          The New Deal came in the 1930s, decades later; this is anachronistic.
        - |
          Correct. Expanding government 'as rapidly and as far as' experience allowed, owning railroads and inflating the currency rejected the laissez-faire orthodoxy of Sumner, the courts and both major parties' leadership.
        - |
          The Progressive Era came after 1900 and adopted several Populist ideas (the income tax, direct election of senators); the platform anticipated it rather than challenging it.
        - |
          Slavery had been abolished nearly thirty years earlier; the platform is about economic power, not slavery.
      answer: 1
      explanation: |
        Skill: contextualization (the debate over the role of government, 6.12). Place the Populists against the dominant ideas of their own time, not against later movements they helped inspire.

    - slug: apush-u06-w21-q03
      type: multiple_choice
      topic_code: "6.2"
      source: "Primary source: People's Party (Omaha) Platform, July 4, 1892, The American Presidency Project (UC Santa Barbara)"
      points: 1
      stimulus: |
        "... we meet in the midst of a nation brought to the verge of moral, political, and material ruin. Corruption dominates the ballot-box, the Legislatures, the Congress, and touches even the ermine of the bench. ... The fruits of the toil of millions are boldly stolen to build up colossal fortunes for a few, unprecedented in the history of mankind; and the possessors of these, in turn despise the Republic and endanger liberty. From the same prolific womb of governmental injustice we breed the two great classes—tramps and millionaires. ...

        We believe that the power of government—in other words, of the people—should be expanded (as in the case of the postal service) as rapidly and as far as the good sense of an intelligent people and the teachings of experience shall justify, to the end that oppression, injustice and poverty, shall eventually cease in the land. ...

        We demand free and unlimited coinage of silver and gold at the present legal ratio of 16 to 1. ... Transportation being a means of exchange and a public necessity, the government should own and operate the railroads ..."

        — Platform of the People's Party, adopted at Omaha, Nebraska, July 4, 1892
      prompt: |
        Review. The demand for government ownership of railroads grew most directly out of which earlier experience of western farmers?
      options:
        - "The ban on railroad land grants in the Pacific Railway Act"
        - "The refusal of railroads to build any lines west of the Mississippi"
        - "Dependence on railroads that charged high rates where they held a monopoly, which the Grange had tried to regulate through state laws in the 1870s"
        - "The federal government's successful operation of the transcontinental railroad since 1869"
      option_explanations:
        - |
          The Pacific Railway Act granted land to railroads; it did not ban grants.
        - |
          Railroads built tens of thousands of miles west of the Mississippi; the complaint was their power, not their absence.
        - |
          Correct. Farmers who had borrowed to grow cash crops depended on a single line to reach market; the Granger laws (upheld in Munn, 1877) and the weak Interstate Commerce Act (1887) had not fixed the problem, so the Populists went further.
        - |
          The Union Pacific and Central Pacific were private corporations, subsidized but not run by the government.
      answer: 2
      explanation: |
        Skill: making connections (causation across weeks). Week 18's commercial farmers (6.2) became week 21's Populists; the railroad plank is the bridge.

    # ---- Stimulus set B: Sumner and George (6.12, 6.11, review 6.6)
    - slug: apush-u06-w21-q04
      type: multiple_choice
      topic_code: "6.12"
      source: "Primary sources: William Graham Sumner, What Social Classes Owe to Each Other (1883); Henry George, Progress and Poverty (1879); both Project Gutenberg"
      points: 1
      stimulus: |
        Source 1: "In all these schemes and projects the organized intervention of society through the State is either planned or hoped for, and the State is thus made to become the protector and guardian of certain classes. The agents who are to direct the State action are, of course, the reformers and philanthropists. Their schemes, therefore, may always be reduced to this type—that A and B decide what C shall do for D."

        — William Graham Sumner, professor at Yale, What Social Classes Owe to Each Other, 1883

        Source 2: "Where the conditions to which material progress everywhere tends are most fully realized—that is to say, where population is densest, wealth greatest, and the machinery of production and exchange most highly developed—we find the deepest poverty, the sharpest struggle for existence, and the most of enforced idleness. ... This association of poverty with progress is the great enigma of our times."

        — Henry George, Progress and Poverty, 1879
      prompt: |
        Sumner's argument in Source 1 was most likely intended to
      options:
        - "support the Populist demand for government ownership of railroads"
        - "call on philanthropists to lead a federal program of poor relief"
        - "argue that the State should protect the working class through labor laws"
        - "oppose reforms that used government to transfer resources from one group to another"
      option_explanations:
        - |
          Government ownership is the kind of intervention Sumner opposed; he was a leading advocate of laissez-faire.
        - |
          Sumner criticizes exactly this: reformers and philanthropists directing state action.
        - |
          He objects to the State becoming 'the protector and guardian of certain classes', which is what labor laws would do.
        - |
          Correct. In Sumner's formula A and B (reformers) decide what C (the 'forgotten man' who pays) must do for D (the poor). He argued that such state action was unjust to C and that classes owe one another only respect for rights.
      answer: 3
      explanation: |
        Skill: sourcing (purpose) and claims. Identify the variables in Sumner's formula and the side each represents; that tells you the purpose.

    - slug: apush-u06-w21-q05
      type: multiple_choice
      topic_code: "6.11"
      source: "Primary sources: William Graham Sumner, What Social Classes Owe to Each Other (1883); Henry George, Progress and Poverty (1879); both Project Gutenberg"
      points: 1
      stimulus: |
        Source 1: "In all these schemes and projects the organized intervention of society through the State is either planned or hoped for, and the State is thus made to become the protector and guardian of certain classes. The agents who are to direct the State action are, of course, the reformers and philanthropists. Their schemes, therefore, may always be reduced to this type—that A and B decide what C shall do for D."

        — William Graham Sumner, professor at Yale, What Social Classes Owe to Each Other, 1883

        Source 2: "Where the conditions to which material progress everywhere tends are most fully realized—that is to say, where population is densest, wealth greatest, and the machinery of production and exchange most highly developed—we find the deepest poverty, the sharpest struggle for existence, and the most of enforced idleness. ... This association of poverty with progress is the great enigma of our times."

        — Henry George, Progress and Poverty, 1879
      prompt: |
        The ideas in Source 2 most directly contributed to
      options:
        - "reform movements that proposed government action, such as George's 'single tax' on land values, to reduce inequality"
        - "the adoption of the gold standard"
        - "the end of immigration to American cities"
        - "the spread of Social Darwinism among business leaders"
      option_explanations:
        - |
          Correct. George's book sold millions; his single-tax clubs, his near-victory in New York's 1886 mayoral race and his influence on later reformers made poverty amid plenty a political question.
        - |
          The gold standard was favored by creditors and conservatives; George's critique pointed toward reform, not monetary orthodoxy.
        - |
          George's analysis concerned land and poverty; it had nothing to do with stopping immigration, which continued to rise.
        - |
          George's argument challenged Social Darwinism by showing that poverty grew alongside progress, not because of individual unfitness.
      answer: 0
      explanation: |
        Skill: causation (effects of ideas). Pair George with Bellamy as the period's best-selling critics of industrial inequality (6.11).

    - slug: apush-u06-w21-q06
      type: multiple_choice
      topic_code: "6.6"
      source: "Primary sources: William Graham Sumner, What Social Classes Owe to Each Other (1883); Henry George, Progress and Poverty (1879); both Project Gutenberg"
      points: 1
      stimulus: |
        Source 1: "In all these schemes and projects the organized intervention of society through the State is either planned or hoped for, and the State is thus made to become the protector and guardian of certain classes. The agents who are to direct the State action are, of course, the reformers and philanthropists. Their schemes, therefore, may always be reduced to this type—that A and B decide what C shall do for D."

        — William Graham Sumner, professor at Yale, What Social Classes Owe to Each Other, 1883

        Source 2: "Where the conditions to which material progress everywhere tends are most fully realized—that is to say, where population is densest, wealth greatest, and the machinery of production and exchange most highly developed—we find the deepest poverty, the sharpest struggle for existence, and the most of enforced idleness. ... This association of poverty with progress is the great enigma of our times."

        — Henry George, Progress and Poverty, 1879
      prompt: |
        Review. Sumner's position in Source 1 is most closely associated with which broader set of ideas used to defend industrial capitalism?
      options:
        - "Mercantilism, which held that colonies existed to enrich the mother country"
        - "Social Darwinism, which treated competition as natural selection and wealth as a sign of fitness"
        - "The Social Gospel, which called on churches to reform society"
        - "Republican motherhood, which assigned women a civic role in the home"
      option_explanations:
        - |
          Mercantilism concerned colonial trade in the seventeenth and eighteenth centuries, not industrial inequality.
        - |
          Correct. Sumner was the leading American Social Darwinist; like Herbert Spencer, he held that state interference with competition harmed society.
        - |
          The Social Gospel answered Social Darwinism; ministers such as Washington Gladden argued that Christians must use their influence to reform society.
        - |
          Republican motherhood is a Revolutionary-era idea about women and civic virtue, unrelated to this argument.
      answer: 1
      explanation: |
        Skill: making connections. Week 19's defenses of capitalism (6.6) reappear here as arguments about what government may do (6.12).

    # ---- Stimulus set C: Bryan's Cross of Gold (6.13, review 5.9)
    - slug: apush-u06-w21-q07
      type: multiple_choice
      topic_code: "6.13"
      source: "Primary source: William Jennings Bryan, address to the Democratic National Convention (1896), as quoted by the Library of Congress National Recording Registry"
      points: 1
      stimulus: |
        "Having behind us the producing masses of this nation and the world, supported by the commercial interests, the laboring interests, and the toilers everywhere, we will answer their demand for a gold standard by saying to them: You shall not press down upon the brow of labor this crown of thorns. You shall not crucify mankind upon a cross of gold."

        — William Jennings Bryan, address to the Democratic National Convention, Chicago, July 9, 1896
      prompt: |
        Bryan's call to reject the gold standard was most directly aimed at
      options:
        - "ending protective tariffs on manufactured goods"
        - "abolishing paper money"
        - "expanding the money supply through the free coinage of silver so that crop prices would rise and debts would be easier to repay"
        - "restoring the Bank of the United States"
      option_explanations:
        - |
          Democrats did favor lower tariffs, but this passage is entirely about the gold standard.
        - |
          Silverites wanted more money in circulation, not less.
        - |
          Correct. Deflation had cut crop prices for decades while debts stayed fixed; coining silver freely at 16 to 1 would inflate the currency, a direct benefit to indebted farmers and a loss to creditors.
        - |
          No serious candidate proposed reviving the Bank in 1896; the issue was the metal backing the currency.
      answer: 2
      explanation: |
        Skill: contextualization. The 'cross of gold' is a metaphor for deflation's burden on debtors; tie it to the money question that ran from the greenbacks to 1896.

    - slug: apush-u06-w21-q08
      type: multiple_choice
      topic_code: "6.13"
      source: "Primary source: William Jennings Bryan, address to the Democratic National Convention (1896), as quoted by the Library of Congress National Recording Registry"
      points: 1
      stimulus: |
        "Having behind us the producing masses of this nation and the world, supported by the commercial interests, the laboring interests, and the toilers everywhere, we will answer their demand for a gold standard by saying to them: You shall not press down upon the brow of labor this crown of thorns. You shall not crucify mankind upon a cross of gold."

        — William Jennings Bryan, address to the Democratic National Convention, Chicago, July 9, 1896
      prompt: |
        Which of the following best describes the outcome of the 1896 campaign in which Bryan carried this message?
      options:
        - "The election was decided by the House of Representatives."
        - "The People's Party nominated its own candidate and won the election."
        - "Bryan won the presidency with the support of eastern industrial workers."
        - "William McKinley won by carrying the industrial Northeast and Midwest, beginning a long period of Republican dominance."
      option_explanations:
        - |
          McKinley won a clear electoral majority; the House decided the elections of 1800 and 1824, not 1896.
        - |
          The Populists endorsed Bryan rather than running their own presidential candidate, which ended their independence as a party.
        - |
          Bryan lost. Many urban workers feared that free silver would raise food prices and cost jobs, and stayed with McKinley.
        - |
          Correct. Backed by Mark Hanna's unprecedented fund-raising, McKinley promised prosperity and sound money; the result realigned national politics, and Republicans controlled the presidency for most of the next 36 years.
      answer: 3
      explanation: |
        Skill: causation (effects) and continuity and change. 1896 ends the evenly balanced politics of the Gilded Age and the Populist challenge.

    - slug: apush-u06-w21-q09
      type: multiple_choice
      topic_code: "5.9"
      source: "Primary source: William Jennings Bryan, address to the Democratic National Convention (1896), as quoted by the Library of Congress National Recording Registry"
      points: 1
      stimulus: |
        "Having behind us the producing masses of this nation and the world, supported by the commercial interests, the laboring interests, and the toilers everywhere, we will answer their demand for a gold standard by saying to them: You shall not press down upon the brow of labor this crown of thorns. You shall not crucify mankind upon a cross of gold."

        — William Jennings Bryan, address to the Democratic National Convention, Chicago, July 9, 1896
      prompt: |
        Review. The debate over currency in which Bryan spoke had roots in which Civil War policy?
      options:
        - "The Morrill Land-Grant College Act"
        - "The suspension of habeas corpus"
        - "The Union's issue of 'greenbacks', paper money not backed by gold, to finance the war"
        - "The Emancipation Proclamation"
      option_explanations:
        - |
          The Morrill Act funded colleges with public land; it did not touch the currency.
        - |
          Suspending habeas corpus was a wartime civil-liberties measure with no bearing on the money supply.
        - |
          Correct. The Legal Tender Act (1862) created greenbacks. After the war creditors pushed to retire them and return to gold (the Specie Resumption Act of 1875), while debtors and the Greenback Party fought to keep them; silver later replaced greenbacks as the inflationists' cause.
        - |
          The Proclamation concerned slavery, not currency.
      answer: 2
      explanation: |
        Skill: continuity and change. The money question runs from wartime greenbacks (5.9) through the Greenback Party to free silver and 1896.

    - slug: apush-u06-w21-q10
      type: multiple_choice
      topic_code: "6.13"
      source: "National Archives, Milestone Documents: Pendleton Act (1883)"
      points: 1
      prompt: |
        The Pendleton Civil Service Act of 1883 was passed largely in response to
      options:
        - "the Panic of 1893"
        - "the assassination of President James Garfield by a disappointed office seeker"
        - "the Haymarket bombing"
        - "the Supreme Court's decision in Munn v. Illinois"
      option_explanations:
        - |
          The Panic of 1893 came a decade after the act and concerned the economy, not federal hiring.
        - |
          Correct. Garfield's death in 1881 at the hands of Charles Guiteau, who believed he deserved a government job, turned public opinion against the spoils system; the act required competitive exams for some federal posts.
        - |
          Haymarket occurred in 1886, three years after the act.
        - |
          Munn concerned state regulation of grain elevators, not federal hiring.
      answer: 1
      explanation: |
        Skill: causation. A single shocking event can open a window for a reform that had been building (the Mugwumps and civil-service reformers had pushed for years).

    - slug: apush-u06-w21-q11
      type: multiple_choice
      topic_code: "6.2"
      source: "Supreme Court, Munn v. Illinois, 94 U.S. 113 (1877), Justia"
      points: 1
      prompt: |
        Review. In Munn v. Illinois (1877) the Supreme Court upheld a state law, passed under pressure from the Grange, that
      options:
        - "gave railroads ownership of all land within ten miles of their tracks"
        - "set a minimum price for wheat"
        - "regulated the rates charged by grain elevators because their business was 'clothed with a public interest'"
        - "banned the Grange from political activity"
      option_explanations:
        - |
          Land grants came from Congress under the Pacific Railway Acts, not from Illinois law, and Munn did not concern them.
        - |
          The law capped storage rates; it did not fix crop prices.
        - |
          Correct. Chief Justice Waite held that property used in a way that affects the community at large 'must submit to be controlled by the public for the common good'. Western farmers' organizing (6.2) produced a landmark of the regulatory state (6.12).
        - |
          The Court upheld a Granger law; it did not restrict the Grange.
      answer: 2
      explanation: |
        Skill: making connections. Munn marks the high point of state regulation; Wabash (1886) then limited it, leading to the Interstate Commerce Act (1887).

    - slug: apush-u06-w21-q12
      type: multiple_choice
      topic_code: "6.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Jane Addams's Hull House and similar settlement houses of the 1880s and 1890s are best described as
      options:
        - "government agencies that processed new immigrants"
        - "factories owned by philanthropists to employ immigrants"
        - "churches that required immigrants to convert to Protestantism"
        - "centers where educated, mostly middle-class reformers lived among immigrants, offered services and studied conditions to press for reform"
      option_explanations:
        - |
          Federal processing took place at Ellis Island; settlement houses were private.
        - |
          Settlement houses were community centers, not businesses.
        - |
          Settlements were generally nonsectarian and did not require conversion, though many residents were motivated by the Social Gospel.
        - |
          Correct. Residents ran kindergartens, classes and clubs, investigated sanitation, child labor and sweatshops, and lobbied city and state governments; many later became Progressive leaders.
      answer: 3
