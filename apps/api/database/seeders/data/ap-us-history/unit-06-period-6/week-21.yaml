    - slug: apush-u06-w21-q13
      type: multiple_choice
      topic_code: "6.14"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best represents a continuity between the period before the Civil War and the period 1865–1898?
      options:
        - "A largely rural population with few large cities"
        - "The absence of federal involvement in western development"
        - "The dominance of small artisan workshops in American manufacturing"
        - "The persistence of white supremacy in the South, maintained after slavery's end through sharecropping, disfranchisement and segregation"
      option_explanations:
        - |
          Urbanization accelerated sharply; the urban share rose from about a quarter in 1870 to about two-fifths in 1900.
        - |
          The federal government was deeply involved in the West before and after the war: land surveys, the army and, after 1862, homesteads and railroad grants.
        - |
          This changed dramatically: large factories and corporations replaced small shops as the center of manufacturing.
        - |
          Correct. Emancipation ended slavery, but a racial hierarchy continued in new legal and economic forms; this is the most striking continuity across the Civil War divide.
      answer: 3
      explanation: |
        Skill: continuity and change over time (6.14). Strong answers identify what persisted beneath dramatic change; Period 6 is usually taught as change, so continuity earns the complexity point.

    - slug: apush-u06-w21-q14
      type: multiple_choice
      topic_code: "6.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Populists' attempt to build a farmer-labor alliance in the 1890s was weakened most by the fact that
      options:
        - "the American Federation of Labor merged with the People's Party in 1892"
        - "industrial workers had already won the eight-hour day"
        - "labor unions had been banned by federal law since 1877"
        - "many urban industrial workers saw free silver and higher crop prices as threats to their wages and food costs"
      option_explanations:
        - |
          The AFL never merged with the Populists; Gompers kept the federation out of third-party politics.
        - |
          The eight-hour day was still a goal for most workers; it was achieved broadly only in the twentieth century.
        - |
          Unions were not banned, though courts and injunctions restricted strikes.
        - |
          Correct. Inflation that helped debtors would raise prices for wage earners; the AFL under Gompers avoided partisan alliances; and many immigrant workers distrusted rural evangelical politics.
      answer: 3
      explanation: |
        Skill: comparison and making connections. Farmers and workers both opposed concentrated wealth, but their economic interests diverged on money and prices (6.7 and 6.13).

    - slug: apush-u06-w21-q15
      type: multi_select
      topic_code: "6.13"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were characteristic of national politics between 1877 and 1896.
      options:
        - "Very close presidential elections and frequent divided control of Congress"
        - "High voter turnout, often around 80 percent of eligible voters outside the South"
        - "Party loyalties shaped strongly by region, religion and ethnicity"
        - "A single dominant party that won every presidential election"
        - "Intense debates over tariffs, currency and civil service reform"
      option_explanations:
        - |
          Correct. Garfield won the popular vote in 1880 by under 10,000 votes, and in 1888 Benjamin Harrison won the presidency while losing the popular vote.
        - |
          Correct. Parades, party newspapers and fierce loyalty produced some of the highest turnout in American history.
        - |
          Correct. Republicans drew on Northern Protestants and Union veterans; Democrats on the white South and Catholic immigrants.
        - |
          Democrats won in 1884 and 1892 and Republicans in 1880, 1888 and 1896; no party dominated until after 1896. This option is false.
        - |
          Correct. The tariff, silver versus gold and the spoils system were the leading national issues.
      answer: [0, 1, 2, 4]
      explanation: |
        Skill: contextualization. Gilded Age politics looks issue-poor only from a distance; it was close, intense and fought over tariffs, money and patronage.

    - slug: apush-u06-w21-q16
