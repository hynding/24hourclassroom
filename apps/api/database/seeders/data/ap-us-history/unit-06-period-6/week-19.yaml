    - slug: apush-u06-w19-q14
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Compared with the market revolution of the early nineteenth century, industrialization after 1865 was distinguished most by
      options:
        - "the end of wage labor"
