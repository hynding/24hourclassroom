    - slug: apush-u06-w19-q21
      type: short_answer
      topic_code: "6.4"
      source: "Interpretation written for this course, representing the colonial-economy view of the New South"
      points: 3
      stimulus: |
        Interpretation (written for this course, representing a view of the New South as a colonial economy, associated with historians writing from the 1950s on):

        The 'New South' of the 1880s and 1890s was new mainly in its slogans. Mills and furnaces rose, but they were financed largely from the North, paid the lowest wages in the country and shipped raw or half-finished goods to Northern factories. The region's real economy remained cotton grown by tenants and sharecroppers bound by debt, and the political order that made this possible rested on the exclusion of Black Southerners and many poor whites from power.
      prompt: |
        Using the interpretation above, answer (a), (b) and (c).

        (a) Briefly describe the argument of the interpretation.
        (b) Briefly explain how ONE specific historical development from 1877 to 1898 supports the interpretation.
        (c) Briefly explain how ONE specific historical development from 1877 to 1898 could be used to challenge or qualify the interpretation.
      answer: |
        (a) The interpretation argues that the New South changed little: industry was outside-owned and low-wage, most Southerners still grew cotton under debt, and the system depended on political exclusion.
        (b) The crop-lien system supports it: merchants advanced supplies against the next cotton crop at high interest, and as prices fell farmers sank deeper into debt and had to keep planting cotton, so the old staple economy persisted.
        (c) Birmingham's steel industry and the Piedmont textile mills qualify it: whole new industrial towns appeared, Southern railroad mileage grew quickly, and James B. Duke's American Tobacco Company was a Southern-based national corporation, so some real industrial change did occur.
      explanation: |
        Skill: analyzing a secondary interpretation and using evidence. One point per part.

        (a) 1 point for accurately describing the argument (change was mostly rhetoric; outside ownership, low wages, cotton and debt, political exclusion). Zero for quoting the passage without explaining it.

        (b) 1 point for specific supporting evidence explained: sharecropping or crop liens, falling cotton prices, Northern ownership of mills or railroads, low mill wages and child labor, convict leasing, disfranchisement (Mississippi Plan 1890, poll taxes, literacy tests), the failure of Southern per-capita income to catch up. Zero for unexplained naming.

        (c) 1 point for specific evidence that challenges or qualifies: Birmingham steel, Piedmont textiles, Duke's tobacco empire, Southern railroad growth, Grady's boosterism attracting investment, the rise of a Southern urban middle class, Tuskegee and Black-owned businesses. Zero for evidence from outside the period without a link to it.

    - slug: apush-u06-w19-q22
      type: short_answer
      topic_code: "6.6"
      source: "Described non-text source: Joseph Keppler, 'The Bosses of the Senate,' Puck (1889), Library of Congress Prints and Photographs"
      points: 3
      stimulus: |
        Non-text source (described): 'The Bosses of the Senate,' a color cartoon by Joseph Keppler in the humor magazine Puck, 1889. In the Senate chamber, small senators sit at their desks. Behind them, filling the back of the room, stand enormous men with bulging money-bag bodies, each labeled with a trust or industry (steel, copper, oil, sugar and others). A sign on the wall parodies Lincoln's Gettysburg Address, describing the Senate as one of, by and for the monopolists. The door marked as the people's entrance is shut and locked, while the monopolists' entrance stands wide open.
      prompt: |
        Using the source described above, answer (a), (b) and (c).

        (a) Briefly describe the point of view expressed in the cartoon.
        (b) Briefly explain ONE development from 1865 to 1898 that helps explain why the cartoonist held this view.
        (c) Briefly explain ONE response by the federal government or reformers to the concerns shown in the cartoon.
      answer: |
        (a) The cartoonist sees government as captured by big business: the trusts tower over the senators and control the Senate, while ordinary people are shut out of their own government.
        (b) In the 1880s trusts such as Standard Oil (1882) and the Sugar Trust controlled whole industries, and senators were chosen by state legislatures that corporations could influence; railroad rebates and campaign money made the link between wealth and power visible.
        (c) Congress passed the Sherman Antitrust Act (1890), declaring combinations in restraint of trade illegal, although courts weakened it in United States v. E. C. Knight (1895).
      explanation: |
        Skill: sourcing a cartoon (point of view) and contextualization. One point per part.

        (a) 1 point for the point of view: big business controls or corrupts government; the public is excluded. Zero for describing objects without interpreting them.

        (b) 1 point for a specific development explained: the rise of trusts (Standard Oil, the Sugar Trust), railroad rebates and pools, indirect election of senators by state legislatures, corporate campaign contributions, wealth concentration under Carnegie, Rockefeller and Morgan, Crédit Mobilier-style scandals. Zero for 'there was corruption' without an example.

        (c) 1 point for a specific response: Sherman Antitrust Act (1890), Interstate Commerce Act (1887), Granger laws and Munn v. Illinois (1877), the Populist Omaha Platform's call for direct election of senators and government ownership of railroads, later the Seventeenth Amendment (1913) if tied back to this concern. Zero for a response with no link to monopoly power.

    - slug: apush-u06-w19-q23
      type: long_answer
      topic_code: "6.6"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1865 and 1898 the United States became the world's leading industrial economy. Historians have explained that transformation by pointing to new technologies, new forms of business organization, government policy, and abundant labor and natural resources.

        Evaluate the relative importance of the causes of the rise of industrial capitalism in the United States in the period from 1865 to 1898.
      answer: |
        Thesis: New forms of business organization were the most important cause of industrial capitalism's rise, because vertical and horizontal integration, trusts and investment banking let entrepreneurs exploit new technologies, cheap immigrant labor and government favors on a national scale; technology made growth possible, but organization turned it into giant corporate power.

        Context: The market revolution had already built factories and regional markets; the Civil War expanded federal power, banking and railroad subsidies; after 1865 a continental rail network created a national market.

        Body 1 (organization, most important): Carnegie Steel's vertical integration; Standard Oil's horizontal integration and the trust of 1882; railroad pools; Morgan's reorganizations after 1893; New Jersey holding companies (1889).

        Body 2 (technology): Bessemer steel, electricity (Edison, Westinghouse), the telephone, refrigerated cars; these created industries but required capital and management to scale.

        Body 3 (government and labor): protective tariffs, railroad land grants, courts that limited regulation (E. C. Knight); millions of immigrants providing low-wage labor; abundant coal, iron and oil.

        Complexity: the same organizational power that drove growth produced monopoly, labor conflict and depressions (1873, 1893), prompting the Sherman Act and the Populist and labor movements.
      explanation: |
        LEQ rubric applied to this prompt (6 points).

        Thesis/claim (1): a defensible claim that weighs causes, with a line of reasoning. Listing four causes with no ranking does not earn it.

        Contextualization (1): the broader situation, for example the market revolution's factories and canals, Civil War economic legislation and banking, Republican control of national policy, the closing of the West, global demand for American goods. More than a passing phrase.

        Evidence (2): 1 point for two or more specific examples (Carnegie Steel, Standard Oil Trust, J. P. Morgan, Bessemer process, Edison's Pearl Street station, Bell's telephone, Swift's refrigerated cars, McKinley Tariff, Pacific Railway land grants, new immigrants, Sherman Act). 2 points when the examples are used to support the argument about relative importance.

        Analysis and reasoning (2): 1 point for using causation to structure the argument, weighing causes against each other. 1 point for complex understanding, for example showing how causes interacted (technology plus organization), explaining multiple perspectives (captains of industry versus robber barons), connecting to the market revolution or the Progressive Era, or qualifying the argument with consequences such as monopolies and panics.

        A narrative of inventions that never addresses relative importance cannot earn the reasoning points.
