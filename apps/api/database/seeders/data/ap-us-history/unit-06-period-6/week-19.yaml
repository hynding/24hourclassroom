        - "a decline in the importance of technology"
        - "the scale of enterprise: national corporations, heavy industry such as steel and oil, and a national rail-based market"
      option_explanations:
        - |
          Wage labor grew enormously after 1865; most industrial workers were wage earners.
        - |
          Factories already existed in the market revolution, for example the Lowell textile mills of the 1820s.
        - |
          Technology mattered more, not less: steel, electricity, the telephone and refrigeration all belong to Period 6.
