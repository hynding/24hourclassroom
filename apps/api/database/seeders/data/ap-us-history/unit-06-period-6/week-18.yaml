week: 18
unit: 6
title: "The West: Railroads, Settlement and Conflict"
topics: ["6.1", "6.2", "6.3"]
guide: guides/week-18.md
guide_description: |
  How Period 6 begins: the railroads, federal land policy, mining, ranching and commercial farming that tied the
  trans-Mississippi West to national and world markets, and the wars, reservations, boarding schools and allotment
  that dispossessed American Indians. Worked examples: a contextualization paragraph for any Period 6 prompt, a
  sourcing reading of the Dawes Act, and a causation chain from the transcontinental railroad to Wounded Knee.
flashcards_description: |
  32 cards on Period 6 context, railroads and federal land policy, mining, ranching and farming in the West, the
  Plains wars, reservation and assimilation policy, and the Turner thesis.

flashcards:
  - front: Period 6 (1865–1898) → the one-sentence context
    back: |
      The United States became an industrial, urban and continental nation: railroads and corporations built a national market, millions of immigrants and rural migrants filled the cities and the West, and Americans fought over what government owed workers, farmers, African Americans and American Indians in that new order.
    topic_code: "6.1"
  - front: Why does Period 6 start in 1865 and end in 1898?
    back: |
      It opens as the Civil War ends and the nation's energies turn to industry and the West; it closes with the Spanish–American War, when the United States looks overseas for markets and territory. The boundaries are a convenience: industrialization was well under way before 1865.
    topic_code: "6.1"
  - front: Pacific Railway Act (1862) → what it gave and to whom
    back: |
      Federal land grants along the route and government loans (bonds) per mile of track to the Union Pacific and Central Pacific to build a transcontinental line. It shows that western growth was driven by federal subsidy, not by private enterprise alone.
    topic_code: "6.2"
  - front: Promontory Summit, Utah, May 10, 1869 → significance
    back: |
      The Union Pacific (built west largely by Irish and other European immigrant workers and Civil War veterans) met the Central Pacific (built east largely by Chinese workers). The first transcontinental line cut a months-long journey to about a week and opened the West to national markets.
    hint: The golden spike.
    topic_code: "6.2"
  - front: Railroad land grants → scale and effect
    back: |
      Congress and the states granted railroads well over 100 million acres. Railroads sold the land to settlers, advertised in Europe for buyers, and so became colonizers of the West as well as carriers.
    topic_code: "6.2"
  - front: Railroad standard time (1883) → cause and significance
    back: |
      On November 18, 1883 the railroads divided the country into time zones to replace hundreds of local sun times that made schedules chaotic. A private industry reorganized daily life for the whole nation; Congress made the zones law only in 1918.
    topic_code: "6.2"
  - front: Comstock Lode (1859) and the mining frontier → how mining changed
    back: |
      Nevada's silver strike began as individual prospecting but quickly became corporate, deep-shaft mining with wage workers, eastern and British capital and company towns. Mining booms created instant cities (Virginia City) and then ghost towns when the ore ran out.
    topic_code: "6.2"
  - front: The long drive and the Chisholm Trail → what and why
    back: |
      From 1867 cowboys (many Mexican American and African American) drove Texas longhorns north to Kansas railheads such as Abilene for shipment to Chicago packinghouses. Railroads plus eastern meat demand made the cattle kingdom.
    topic_code: "6.2"
  - front: What ended the open-range cattle boom in the late 1880s?
    back: |
      Overgrazing, falling beef prices, the brutal winter of 1886–87 that killed huge numbers of cattle, and barbed wire that let homesteaders and ranchers fence the range. Ranching survived as fenced, corporate stock raising.
    topic_code: "6.2"
  - front: Barbed wire (Glidden patent, 1874) → effect on the Plains
    back: |
      Cheap fencing in a land without timber. It let farmers protect crops and let large ranchers enclose water and grass, ending the open range and sharpening conflicts among ranchers, farmers, sheepherders and Hispano villagers whose common lands were fenced.
    topic_code: "6.2"
  - front: Bonanza farms and mechanized agriculture → what they show
    back: |
      Huge wheat operations in the Dakotas used steel plows, reapers and threshers, hired seasonal labor and sold on world markets. Western farming became commercial and capital-intensive, which also made farmers dependent on railroads, banks and world prices.
    topic_code: "6.2"
  - front: Why did western farmers feel squeezed by the 1880s?
    back: |
      They borrowed to buy land and machines, then faced falling crop prices (world overproduction and deflation), high railroad rates where one line had a monopoly, grain-elevator charges and mortgage interest. That grievance drives the Grange, the Farmers' Alliances and the Populists.
    topic_code: "6.2"
  - front: The Grange (Patrons of Husbandry, 1867) → what it became
    back: |
      Founded by Oliver Kelley as a social and educational club for isolated farm families, it grew into a movement for cooperatives and state "Granger laws" regulating railroad and grain-elevator rates, upheld in Munn v. Illinois (1877).
    topic_code: "6.2"
  - front: Destruction of the bison → numbers and consequence
    back: |
      Tens of millions of bison lived on the Plains before the Civil War; commercial hide hunting, railroads and army encouragement cut them to a few hundred by the late 1880s. For Plains nations such as the Lakota and Comanche it destroyed the economic base of independent life.
    topic_code: "6.3"
  - front: Sand Creek Massacre (1864) → what and significance
    back: |
      Colorado militia under John Chivington attacked a camp of Cheyenne and Arapaho people who believed they were under army protection, killing well over a hundred, mostly women, children and elderly. A congressional inquiry condemned it; it hardened Plains resistance.
    topic_code: "6.3"
  - front: Treaty of Fort Laramie (1868) → terms and fate
    back: |
      Ended Red Cloud's War: the U.S. abandoned forts on the Bozeman Trail and set apart the Great Sioux Reservation, including the Black Hills, for the Lakota. After gold was found in the Black Hills (1874) miners poured in and the U.S. seized the land in 1877.
    topic_code: "6.3"
  - front: Indian Appropriations Act of 1871 → the change in policy
    back: |
      Congress stopped recognizing Native nations as independent powers with which to make treaties; from then on Indian policy was made by statute and executive order. A legal shift from diplomacy to domestic control.
    topic_code: "6.3"
  - front: Little Bighorn (June 1876) → what happened and the consequence
    back: |
      Lakota and Cheyenne warriors, among them Crazy Horse and followers of Sitting Bull, destroyed George Custer's command in Montana Territory. The victory provoked a massive army campaign that forced most Lakota onto reservations within a year.
    topic_code: "6.3"
  - front: Chief Joseph and the Nez Perce (1877) → what happened
    back: |
      Ordered onto a reduced reservation in Idaho, a band of Nez Perce fled some 1,100+ miles toward Canada, outmaneuvering the army before surrendering in Montana, just short of the border. They were sent to Indian Territory, far from their homeland.
    topic_code: "6.3"
  - front: Ghost Dance → what it was and how the government reacted
    back: |
      A religious movement spread by the Paiute prophet Wovoka about 1889–90, promising renewal of the world and the return of the dead and the bison. Federal agents read it as a threat; the attempt to arrest Sitting Bull led to his killing, and to Wounded Knee.
    topic_code: "6.3"
  - front: Wounded Knee (December 29, 1890) → significance
    back: |
      U.S. cavalry killed roughly 150 to 300 Lakota men, women and children in South Dakota while disarming Big Foot's band. It is treated as the end of large-scale armed resistance on the Plains, the same year the census declared the frontier line gone.
    topic_code: "6.3"
  - front: Carlisle Indian Industrial School (1879) → goal and method
    back: |
      Richard Henry Pratt's off-reservation boarding school in Pennsylvania, model for many more. Children were taken from families, given English names, forbidden their languages and religions, and drilled in farming and trades. The goal was to erase tribal identity.
    topic_code: "6.3"
  - front: Helen Hunt Jackson, A Century of Dishonor (1881) → argument and effect
    back: |
      A catalog of broken treaties and federal fraud, sent to every member of Congress. It stirred humanitarian reformers, the "Friends of the Indian", whose answer was assimilation and allotment: sympathy that led to the Dawes Act.
    topic_code: "6.3"
  - front: Dawes Severalty Act (1887) → mechanism
    back: |
      Broke reservations into individual allotments (160 acres to a family head), held in trust for 25 years; "surplus" land was sold to whites. Allottees who left tribal life were declared citizens. Native-held land fell from about 138 million acres in 1887 to about 48 million by 1934.
    hint: Severalty = individual ownership.
    topic_code: "6.3"
  - front: Compare the Indian Removal Act (1830) and the Dawes Act (1887)
    back: |
      Both served white demand for Native land. Removal moved whole nations west and left them to govern themselves; Dawes aimed to dissolve the nation itself by turning communal land into private farms and Indians into individual citizens. Expulsion versus forced assimilation.
    topic_code: "6.3"
  - front: Elk v. Wilkins (1884) → holding
    back: |
      The Supreme Court held that John Elk, born under tribal allegiance, was not a citizen under the Fourteenth Amendment even after leaving his tribe. Citizenship for American Indians came piecemeal (Dawes, 1887) until the Indian Citizenship Act of 1924.
    topic_code: "6.3"
  - front: Exodusters (1879) → who and why
    back: |
      Tens of thousands of African Americans left the post-Reconstruction South for Kansas, encouraged by leaders such as Benjamin "Pap" Singleton. They fled violence, sharecropping debt and the loss of political rights after 1877.
    topic_code: "6.3"
  - front: Californios and Tejanos after 1848 → what happened to their land
    back: |
      Despite treaty promises of property rights, many lost land to the costly proof-of-title process under the California Land Act of 1851, to squatters, lawyers and taxes, and to fencing. In New Mexico Las Gorras Blancas cut fences (1889–90) to defend common grazing lands.
    topic_code: "6.3"
  - front: Yellowstone (1872) → first of what, and why it matters
    back: |
      The first national park, set aside by Congress. With John Muir's Sierra Club (1892) it marks the start of a conservation and preservation impulse that sat beside, and argued with, the rapid exploitation of western resources.
    topic_code: "6.3"
  - front: Superintendent of the Census, 1890 → the famous announcement
    back: |
      The census bulletin reported that settlement had so broken up the unsettled area that there could hardly be said to be a frontier line any longer. Frederick Jackson Turner built his 1893 thesis on that statement.
    topic_code: "6.3"
  - front: Frederick Jackson Turner, "The Significance of the Frontier in American History" (1893) → thesis
    back: |
      Delivered in Chicago during the World's Columbian Exposition: an area of free land and its westward recession explain American development, producing individualism and democracy. Later historians criticize it for ignoring Native peoples, Mexicans, women and the federal government's role.
    topic_code: "6.3"
  - front: Which themes does the West in Period 6 test most? (GEO, MIG, PCE)
    back: |
      GEO: railroads and technology conquer distance and aridity; MIG: settlers, immigrants, Exodusters and Chinese workers move in; PCE: the federal government subsidizes railroads, distributes land and makes war and policy toward American Indians.
    topic_code: "6.1"

quiz:
  description: |
    23 questions · about 35 minutes · about 70% this week (Period 6 context, the economic development of the West,
    and its social and cultural consequences, above all for American Indians) and 30% review of Period 5 and earlier
    (Civil War economic policy, Reconstruction and its end, Manifest Destiny, the Mexican Cession and Indian
    removal). Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long essay are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set A: Turner's frontier thesis (6.1, 6.3, review 5.2)
    - slug: apush-u06-w18-q01
      type: multiple_choice
      topic_code: "6.3"
      source: "Primary source: Frederick Jackson Turner, The Frontier in American History (1920), Project Gutenberg"
      points: 1
      stimulus: |
        "In a recent bulletin of the Superintendent of the Census for 1890 appear these significant words: 'Up to and including 1880 the country had a frontier of settlement, but at present the unsettled area has been so broken into by isolated bodies of settlement that there can hardly be said to be a frontier line. In the discussion of its extent, its westward movement, etc., it can not, therefore, any longer have a place in the census reports.' This brief official statement marks the closing of a great historic movement. Up to our own day American history has been in a large degree the history of the colonization of the Great West. The existence of an area of free land, its continuous recession, and the advance of American settlement westward, explain American development."

        — Frederick Jackson Turner, "The Significance of the Frontier in American History," paper read to the American Historical Association in Chicago, 1893
      prompt: |
        Turner's argument in the excerpt is most open to criticism because it
      options:
        - "treats the West as empty 'free land' and so leaves out the American Indian nations and Mexican communities already living there"
        - "denies that Americans moved west in significant numbers during the nineteenth century"
        - "argues that eastern cities rather than the West shaped American democracy"
        - "exaggerates the importance of the federal census as a source of information about settlement"
      option_explanations:
        - |
          Correct. 'Free land' was land taken by war, treaty and allotment from Native nations and, in the Southwest, from Mexicans and Mexican Americans. Historians since the 1980s have treated the West as a place of conquest and contact, not an empty line moving across a map.
        - |
          Turner says the opposite: westward settlement is the centre of his explanation of American history. A criticism must target something he actually claims.
        - |
          Turner argues the frontier, not the East, explains American development. This option reverses his position, so it cannot be the flaw in it.
        - |
          Turner uses the census bulletin as a trigger for his argument, but critics have not faulted him mainly for trusting the census; the line it described was real enough. The deeper problem is what 'free land' assumes.
      answer: 0
      explanation: |
        Skill: analyzing an author's argument and point of view. Ask what a source assumes as well as what it says. Turner's 'free land' quietly erases the people whose dispossession made the land available, which is exactly the subject of topic 6.3.

    - slug: apush-u06-w18-q02
      type: multiple_choice
      topic_code: "6.1"
      source: "Primary source: Frederick Jackson Turner, The Frontier in American History (1920), Project Gutenberg"
      points: 1
      stimulus: |
        "In a recent bulletin of the Superintendent of the Census for 1890 appear these significant words: 'Up to and including 1880 the country had a frontier of settlement, but at present the unsettled area has been so broken into by isolated bodies of settlement that there can hardly be said to be a frontier line. In the discussion of its extent, its westward movement, etc., it can not, therefore, any longer have a place in the census reports.' This brief official statement marks the closing of a great historic movement. Up to our own day American history has been in a large degree the history of the colonization of the Great West. The existence of an area of free land, its continuous recession, and the advance of American settlement westward, explain American development."

        — Frederick Jackson Turner, "The Significance of the Frontier in American History," paper read to the American Historical Association in Chicago, 1893
      prompt: |
        Which development of the period 1865–1893 best explains why settlement had broken up the 'unsettled area' as the census bulletin described?
      options:
        - "The expansion of a railroad network, subsidized by federal land grants, that carried settlers west and their crops and cattle east"
        - "The end of immigration from Europe after the Civil War"
        - "The decline of commercial agriculture and the return of most farmers to subsistence farming"
        - "The success of the Ghost Dance movement in reopening Native lands to settlement"
      option_explanations:
        - |
          Correct. Track mileage multiplied several times between 1865 and 1893, and railroads sold their granted land to settlers and connected new farms and ranches to Chicago and eastern markets. Rail made dense settlement of the interior possible.
        - |
          Immigration rose after the Civil War, and many immigrants (Scandinavians and Germans on the northern Plains, for example) settled the West. The premise is false.
        - |
          The trend ran the other way: western agriculture became more commercial, mechanized and tied to world markets in these years.
        - |
          The Ghost Dance was a Native religious movement of renewal, suppressed by the government in 1890; it did not open land to settlers.
      answer: 0
      explanation: |
        Skill: contextualization and causation. A source's claim (the frontier line has gone) needs the broader process behind it: the railroad, federal land policy and market agriculture together filled the West between 1865 and 1890.

    - slug: apush-u06-w18-q03
      type: multiple_choice
      topic_code: "5.2"
      source: "Primary source: Frederick Jackson Turner, The Frontier in American History (1920), Project Gutenberg"
      points: 1
      stimulus: |
        "In a recent bulletin of the Superintendent of the Census for 1890 appear these significant words: 'Up to and including 1880 the country had a frontier of settlement, but at present the unsettled area has been so broken into by isolated bodies of settlement that there can hardly be said to be a frontier line. In the discussion of its extent, its westward movement, etc., it can not, therefore, any longer have a place in the census reports.' This brief official statement marks the closing of a great historic movement. Up to our own day American history has been in a large degree the history of the colonization of the Great West. The existence of an area of free land, its continuous recession, and the advance of American settlement westward, explain American development."

        — Frederick Jackson Turner, "The Significance of the Frontier in American History," paper read to the American Historical Association in Chicago, 1893
      prompt: |
        Review. Turner's view of westward expansion most closely resembles which earlier idea?
      options:
        - "The belief in Manifest Destiny that the United States was meant to spread democratic institutions across the continent"
        - "The Federalist argument that a strong central bank was necessary for national development"
        - "The Monroe Doctrine's warning against European colonization in the Western Hemisphere"
        - "The abolitionist argument that slavery violated the principles of the Declaration of Independence"
      option_explanations:
        - |
          Correct. In the 1840s supporters of Manifest Destiny claimed that continental expansion was providential and would spread American democracy. Turner gives a scholarly version of the same story: expansion across the continent made Americans democratic and individualistic.
        - |
          Hamilton's case for a national bank concerned credit and commerce. It says nothing about the frontier as the source of national character.
        - |
          The Monroe Doctrine (1823) concerned European powers in the hemisphere, not the meaning of American settlement of the continent.
        - |
          Abolitionism is a moral argument about slavery. Turner's thesis is about land and settlement and is silent on slavery.
      answer: 0
      explanation: |
        Skill: making connections (continuity over time). Turner's celebration of the frontier continues the expansionist confidence of the 1840s, now looking back on a finished process rather than forward to a destiny.

    # ---- Stimulus set B: the Dawes Act (6.3, review 4.8)
    - slug: apush-u06-w18-q04
      type: multiple_choice
      topic_code: "6.3"
      source: "Primary source: General Allotment (Dawes) Act (1887), National Archives, Milestone Documents"
      points: 1
      stimulus: |
        Section 1: "That in all cases where any tribe or band of Indians has been, or shall hereafter be, located upon any reservation created for their use, either by treaty stipulation or by virtue of an act of Congress or executive order setting apart the same for their use, the President of the United States be, and he hereby is, authorized, whenever in his opinion any reservation or any part thereof of such Indians is advantageous for agricultural and grazing purposes, to cause said reservation, or any part thereof, to be surveyed, or resurveyed if necessary, and to allot the lands in said reservation in severalty to any Indian located thereon in quantities as follows: To each head of a family, one-quarter of a section; ..."

        Section 6: "... every Indian born within the territorial limits of the United States who has voluntarily taken up, within said limits, his residence separate and apart from any tribe of Indians therein, and has adopted the habits of civilized life, is hereby declared to be a citizen of the United States ..."

        — An Act to Provide for the Allotment of Lands in Severalty to Indians (Dawes Act), February 8, 1887
      prompt: |
        The provisions in the excerpt were most directly intended to
      options:
        - "restore the treaty-making relationship between the United States and Native nations"
        - "protect reservation boundaries against white settlement by guaranteeing tribal land titles"
        - "compensate Native nations for land taken during the Plains wars"
        - "assimilate American Indians by replacing communal landholding and tribal membership with individual farms and citizenship"
      option_explanations:
        - |
          Congress had ended treaty-making in 1871. The Dawes Act is itself an example of the new approach: policy imposed by statute without the consent of the nations affected.
        - |
          Allotment did the opposite of protecting tribal title: it dissolved the communal reservation, and the 'surplus' land left after allotments was sold to non-Indians.
        - |
          The act contains no compensation scheme. Payments for surplus land went into federal trust accounts that the government controlled, often badly.
        - |
          Correct. Severalty means individual ownership. Allotments went to individuals, and citizenship was offered to those who left the tribe and adopted 'the habits of civilized life.' Reformers saw this as uplift; the result was cultural pressure and massive land loss.
      answer: 3
      explanation: |
        Skill: sourcing (purpose). The text names its tools (survey, allot, declare citizens) and its standard (the 'habits of civilized life'). Read those words to identify the purpose: assimilation through private property.

    - slug: apush-u06-w18-q05
      type: multiple_choice
      topic_code: "6.3"
      source: "Primary source: General Allotment (Dawes) Act (1887), National Archives, Milestone Documents"
      points: 1
      stimulus: |
        Section 1: "That in all cases where any tribe or band of Indians has been, or shall hereafter be, located upon any reservation created for their use, either by treaty stipulation or by virtue of an act of Congress or executive order setting apart the same for their use, the President of the United States be, and he hereby is, authorized, whenever in his opinion any reservation or any part thereof of such Indians is advantageous for agricultural and grazing purposes, to cause said reservation, or any part thereof, to be surveyed, or resurveyed if necessary, and to allot the lands in said reservation in severalty to any Indian located thereon in quantities as follows: To each head of a family, one-quarter of a section; ..."

        Section 6: "... every Indian born within the territorial limits of the United States who has voluntarily taken up, within said limits, his residence separate and apart from any tribe of Indians therein, and has adopted the habits of civilized life, is hereby declared to be a citizen of the United States ..."

        — An Act to Provide for the Allotment of Lands in Severalty to Indians (Dawes Act), February 8, 1887
      prompt: |
        Which of the following was a direct effect of the policy in the excerpt over the next several decades?
      options:
        - "A sharp decline in Native-held land, from roughly 138 million acres in 1887 to about 48 million by the 1930s"
        - "The immediate grant of U.S. citizenship to all American Indians"
        - "The end of federal supervision of Indian affairs"
        - "A large increase in the total land held by American Indians"
      option_explanations:
        - |
          Correct. Roughly two-thirds of the land base was lost under allotment, which is why the Indian Reorganization Act of 1934 ended the policy.
        - |
          Citizenship under the act was conditional on allotment or leaving tribal life. General citizenship came only with the Indian Citizenship Act of 1924.
        - |
          Federal control grew: the Bureau of Indian Affairs held allotments in trust, ran schools and managed money. Allotment deepened supervision rather than ending it.
        - |
          Native landholding collapsed. Surplus land was sold, and allotments passed out of Native hands once trust periods ended, through sales, tax forfeiture and fraud.
      answer: 0
      explanation: |
        Skill: causation (effects). The Dawes Act is the textbook case of a reform whose stated purpose (uplift through ownership) and actual effect (dispossession) diverged. Be able to give the acreage figures in rounded form.

    - slug: apush-u06-w18-q06
      type: multiple_choice
      topic_code: "4.8"
      source: "Primary source: General Allotment (Dawes) Act (1887), National Archives, Milestone Documents"
      points: 1
      stimulus: |
        Section 1: "That in all cases where any tribe or band of Indians has been, or shall hereafter be, located upon any reservation created for their use, either by treaty stipulation or by virtue of an act of Congress or executive order setting apart the same for their use, the President of the United States be, and he hereby is, authorized, whenever in his opinion any reservation or any part thereof of such Indians is advantageous for agricultural and grazing purposes, to cause said reservation, or any part thereof, to be surveyed, or resurveyed if necessary, and to allot the lands in said reservation in severalty to any Indian located thereon in quantities as follows: To each head of a family, one-quarter of a section; ..."

        Section 6: "... every Indian born within the territorial limits of the United States who has voluntarily taken up, within said limits, his residence separate and apart from any tribe of Indians therein, and has adopted the habits of civilized life, is hereby declared to be a citizen of the United States ..."

        — An Act to Provide for the Allotment of Lands in Severalty to Indians (Dawes Act), February 8, 1887
      prompt: |
        Review. How did the policy in the excerpt differ from the Indian removal policy of the 1830s?
      options:
        - "Removal ended conflict over Native land, while allotment renewed it."
        - "Removal relocated whole nations beyond white settlement, while allotment sought to dissolve the nations themselves by breaking up their common land."
        - "Removal was carried out by state governments, while allotment was a federal policy."
        - "Removal sought to assimilate Native people as individuals, while allotment sought to move whole nations west."
      option_explanations:
        - |
          Removal did not end conflict: the Second Seminole War followed, and settlers soon pressed onto Indian Territory itself.
        - |
          Correct. Both policies served settler demand for land, but by 1887 there was no 'west' left to move anyone to, so the government switched from separating Native nations to absorbing their members and their land.
        - |
          Removal was a federal policy too: Jackson signed the act, and the army carried out the Trail of Tears, even after the Supreme Court in Worcester v. Georgia (1832) recognized Cherokee sovereignty.
        - |
          This reverses the two policies. The Indian Removal Act of 1830 moved the Cherokee, Choctaw, Creek and others west as nations; Dawes aimed at individuals.
      answer: 1
      explanation: |
        Skill: comparison. Name a similarity (both transferred Native land to white settlers with federal power) and the key difference (relocation of nations versus dissolution of nations). That pairing is what a comparison LEQ rewards.

    - slug: apush-u06-w18-q07
      type: multiple_choice
      topic_code: "6.2"
      source: "U.S. Census Bureau, Historical Statistics of the United States (railroad mileage), rounded"
      points: 1
      stimulus: |
        Railroad track in operation in the United States, miles (rounded)

        | Year | Miles of track |
        |---|---|
        | 1860 | about 31,000 |
        | 1870 | about 53,000 |
        | 1880 | about 93,000 |
        | 1890 | about 164,000 |
        | 1900 | about 193,000 |

        Source: U.S. Census Bureau, Historical Statistics of the United States
      prompt: |
        Which conclusion is best supported by the table together with your knowledge of the period?
      options:
        - "Railroad growth was steady and even in every decade."
        - "The fastest growth came in the 1880s, when track mileage rose by roughly 70,000 miles as lines spread across the West and South."
        - "Most railroad mileage existed before the Civil War."
        - "Railroad building stopped during the 1880s because the West had been fully settled."
      option_explanations:
        - |
          The decade increases range from about 22,000 to about 71,000 miles; growth was uneven, peaking in the 1880s and slowing in the depressed 1890s.
        - |
          Correct. 93,000 to 164,000 is the largest absolute increase. The 1880s brought new transcontinentals (Northern Pacific 1883, Santa Fe and Southern Pacific connections) and dense networks in the Plains and the New South.
        - |
          Only about 31,000 of the 193,000 miles of 1900 existed in 1860, roughly a sixth. Most of the network was built in Period 6.
        - |
          The 1880s were the biggest decade in the table, not a pause. Building slowed after 1893, a depression year, which is why the 1890s show less growth.
      answer: 1
      explanation: |
        Skill: analyzing quantitative data. Compute the change per decade, not just the totals, then connect the peak to events you know: western lines and the Panic of 1893.

    - slug: apush-u06-w18-q08
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following most directly contributed to the end of the open-range cattle industry on the Great Plains in the late 1880s?
      options:
        - "Overgrazing, the severe winter of 1886–87 and the spread of barbed-wire fencing"
        - "A collapse in eastern demand for beef as Americans moved to cities"
        - "A federal ban on cattle drives from Texas"
        - "The completion of the first transcontinental railroad in 1869"
      option_explanations:
        - |
          Correct. Too many cattle on the grass, a falling beef price, catastrophic losses in the winter of 1886–87 and the fencing of the range by homesteaders and large ranchers together ended the open range.
        - |
          Urban demand for beef grew, helped by refrigerated railcars. Overproduction, not falling demand, was the problem.
        - |
