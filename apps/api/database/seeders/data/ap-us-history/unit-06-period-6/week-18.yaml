    - slug: apush-u06-w18-q20
      type: short_answer
      topic_code: "6.3"
      source: "Interpretation written for this course, representing the 'New Western History' of the 1980s and after"
      points: 3
      stimulus: |
        Interpretation (written for this course, representing the "New Western History" associated with historians writing since the 1980s):

        The trans-Mississippi West was not a frontier where civilization met emptiness. It was a place of conquest, where many peoples (Lakota, Comanche, Navajo, Mexican American, Chinese, Anglo American and others) competed for land, water and labor, and where the federal government and eastern corporations held the decisive power. The region's history did not end in 1890; the same struggles over land and resources continued long after the census declared the frontier line gone.
      prompt: |
        Using the interpretation above, answer (a), (b) and (c).

        (a) Briefly describe ONE major difference between this interpretation and Frederick Jackson Turner's frontier thesis of 1893.
        (b) Briefly explain how ONE specific historical event or development from 1865 to 1898 could be used to support the interpretation.
        (c) Briefly explain how ONE specific historical event or development from 1865 to 1898 could be used to support Turner's view rather than this interpretation.
      answer: |
        (a) Turner treated the West as 'free land' whose settlement produced American individualism and democracy, a story that ends in 1890; this interpretation sees the West as a contested place of conquest among many peoples, with the federal government and corporations in control, and a story that continues after 1890.
        (b) The Dawes Act (1887) supports it: Congress, not individual settlers, broke up reservations and opened 'surplus' land, and Native-held land fell from about 138 million to about 48 million acres. That is conquest by federal policy, not settlement of empty land.
        (c) The Homestead Act and the spread of family farms across the Plains support Turner: hundreds of thousands of families claimed land, built communities and set up territorial and state governments, and western territories such as Wyoming extended voting rights to women, which Turner would read as frontier democracy.
      explanation: |
        Skill: analyzing secondary interpretations and argumentation. One point per part.

        (a) 1 point for a real difference: empty or 'free' land versus contested, conquered land; individual pioneers versus federal and corporate power; a story that ends in 1890 versus one that continues. Zero for restating either view without contrasting them.

        (b) 1 point for specific evidence explained as supporting conquest or federal or corporate power: the Plains wars (Sand Creek, Little Bighorn, Wounded Knee), the Fort Laramie Treaty and the seizure of the Black Hills, the Dawes Act, boarding schools, railroad land grants, corporate mining, the Chinese Exclusion Act, loss of Californio land. Zero for naming an event with no explanation of how it supports the claim.

        (c) 1 point for specific evidence explained as supporting Turner: homesteading and family farms, new territorial governments, woman suffrage in Wyoming (1869) or Utah, the Grange and western democratic movements, the self-reliance of mining camps. Zero for evidence that actually supports the interpretation instead.

    - slug: apush-u06-w18-q21
      type: short_answer
      topic_code: "6.2"
      source: "Described non-text source: a period railroad land-grant map, general knowledge"
      points: 3
      stimulus: |
        Non-text source (described): a map published by a western railroad company in the 1870s to advertise its land for sale. A thick line marks the company's main track running west from the Missouri River. On both sides of the line a checkerboard of shaded squares stretches for many miles: the alternate sections granted to the railroad by Congress. The legend offers the land to settlers 'on long credit at low prices' and lists the distances to Chicago and to eastern ports. Small drawings in the margins show a farmhouse, a church, a schoolhouse and a grain elevator beside the track.
      prompt: |
        Using the source described above, answer (a), (b) and (c).

        (a) Briefly describe ONE purpose of the map.
        (b) Briefly explain ONE way the federal government contributed to the development shown on the map.
        (c) Briefly explain ONE way the development shown on the map affected an existing population of the West.
      answer: |
        (a) The map was advertising: the railroad wanted to sell its granted land to settlers (including European immigrants), because farms along the line would produce freight and repay the company's investment. The drawings of a church and school sell a settled, respectable future.
        (b) Congress granted the railroad the alternate sections in the checkerboard, and under the Pacific Railway Acts it also lent government bonds per mile. Without that land the company would have had nothing to sell and much less credit.
        (c) Railroads brought hide hunters, settlers and soldiers into Plains hunting grounds; the slaughter of the bison and the loss of land forced the Lakota and other Plains nations onto reservations.
      explanation: |
        Skill: sourcing a non-text source (purpose) and causation. One point per part.

        (a) 1 point for a purpose tied to the map's features: selling land, attracting settlers or immigrants, building freight traffic, promoting the region. Zero for merely describing the picture.

        (b) 1 point for a specific federal action explained: land grants (the checkerboard), government loans or bonds under the Pacific Railway Acts, army protection, the Homestead Act bringing settlers to the region. Zero for 'the government helped' with no mechanism.

        (c) 1 point for a specific effect on an existing group: Plains nations losing bison and land, conflicts leading to war or reservations, Hispano or Mexican American communities losing common lands to fencing and sale, earlier ranchers squeezed by farmers. Zero for effects on the settlers alone.

    - slug: apush-u06-w18-q22
      type: long_answer
      topic_code: "6.2"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1865 and 1898 the trans-Mississippi West was transformed by railroads, mining, ranching and commercial farming, by federal land and Indian policy, and by the migration of millions of people. Historians have weighed economic, political and technological forces in explaining that transformation.

        Evaluate the relative importance of the causes of the economic transformation of the trans-Mississippi West in the period from 1865 to 1898.
      answer: |
        Thesis: Federal policy was the most important cause of the West's transformation, because land grants, homestead law and military conquest created the conditions that private capital and new technology then exploited; markets and machines mattered, but they followed the path the government cleared.

        Context: Before the Civil War the trans-Mississippi West was largely held by Native nations and Mexican-descended communities; wartime Republican legislation in 1862 and the industrializing East's demand for food, metals and markets set the stage.

        Body 1 (federal policy, most important): Pacific Railway Acts (land grants and bonds), Homestead Act, army campaigns and the reservation system, Fort Laramie and the seizure of the Black Hills, the Dawes Act opening 'surplus' land.

        Body 2 (railroads and technology): track mileage roughly tripled from 1870 to 1890; refrigerated cars, barbed wire, steel plows and reapers; standard time zones. These depended on federal subsidy.

        Body 3 (capital and markets): eastern and British investment in mining and cattle; Chicago packinghouses; world wheat markets; the vulnerability that followed (falling prices, debt, the Grange).

        Complexity: the same forces that built the economy dispossessed American Indians and left farmers dependent on railroads and banks, which explains the protest movements of the 1880s and 1890s.
      explanation: |
        LEQ rubric applied to this prompt (6 points).

        Thesis/claim (1): a historically defensible claim that ranks or weighs causes, with a line of reasoning, in the introduction or conclusion. 'There were many causes' earns nothing; 'Federal policy mattered most because...' does.

        Contextualization (1): describes the broader situation before or during the period, such as Civil War Republican legislation, the Mexican Cession, the industrializing Northeast's demand for raw materials, or the Native nations' control of the Plains before the 1860s. Must be more than a phrase.

        Evidence (2): 1 point for at least two specific, relevant examples (Pacific Railway Act, Homestead Act, transcontinental railroad 1869, Comstock Lode, Chisholm Trail, barbed wire, refrigerated railcars, bonanza farms, Fort Laramie Treaty, Dawes Act, the Grange). 2 points if the examples are used to support the argument about relative importance.

        Analysis and reasoning (2): 1 point for using causation to frame the argument (explaining how each cause produced change, and weighing causes against each other). 1 point for complex understanding, for example explaining how causes interacted (technology depended on subsidy), addressing a counter-argument (Turner's individual pioneers), connecting to another period (1862 legislation, later Populism), or explaining both the economic gains and the dispossession they required.

        A response that only describes the West without weighing causes cannot earn the reasoning points.

    - slug: apush-u06-w18-q23
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Homestead Act's promise of 160 acres to anyone who would live on and improve the land for five years most directly reflected which ideology of the 1850s?
      options:
        - "The states' rights doctrine of John C. Calhoun"
        - "The free-labor ideology of the Republican Party, which prized independent, landowning workers over slave labor"
        - "The nativism of the Know-Nothing Party"
        - "The positive-good defense of slavery"
      option_explanations:
        - |
          Calhoun's doctrine protected slaveholders' rights against federal power; Southern Democrats opposed free homesteads because they would fill the West with free-state farmers.
        - |
          Correct. Republicans argued that free men should be able to rise from wage labor to independent ownership; free western land was the escape valve that made that promise real, and they wanted the territories reserved for it.
        - |
          The Know-Nothings opposed immigrants and Catholics. The Homestead Act was open to immigrants who declared intent to become citizens, the opposite of nativism.
        - |
          The positive-good argument defended slavery as beneficial; the Homestead Act embodied the opposing free-soil vision.
      answer: 1
      explanation: |
        Skill: making connections (continuity). The free-labor ideology of the sectional crisis (5.5) became western land policy once the South left Congress, so Period 6's western settlement carried a Period 5 idea.
