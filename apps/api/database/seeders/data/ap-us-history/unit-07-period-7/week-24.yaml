        Skill: causation. The quota system wrote nativist ideas about race and nationality into law until 1965.
    - slug: apush-u07-w24-q13
      type: multiple_choice
      topic_code: "6.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The 1924 act's exclusion of Asian immigrants is best seen as a continuation of which earlier policy?
      options:
        - "The Chinese Exclusion Act of 1882 and the 'Gentlemen's Agreement' limiting Japanese immigration (1907)"
        - "The Dawes Act of 1887"
        - "The Homestead Act of 1862"
        - "The Morrill Land-Grant Act of 1862"
      option_explanations:
        - |
          Correct. Exclusion began with the Chinese in 1882 and extended to the Japanese by informal agreement in 1907; the 1924 act completed the ban on Asian immigration.
        - |
          The Dawes Act divided reservation land into individual allotments; it concerned American Indians, not immigrants.
        - |
          The Homestead Act gave land to settlers; it was not an immigration restriction.
        - |
          The Morrill Act granted federal land to fund agricultural and mechanical colleges; it did not restrict immigration.
      answer: 0
      explanation: |
        Skill: continuity and change. Nativist exclusion moved from the Chinese (1882) to the Japanese (1907) to all Asians and most southern and eastern Europeans (1924).
    - slug: apush-u07-w24-q14
