    - slug: apush-u07-w24-q16
      type: multiple_choice
      topic_code: "6.13"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. American farmers in the 1920s faced problems most similar to those that had produced which earlier movement?
      options:
        - "The Second Great Awakening"
        - "The abolitionist movement"
        - "The Anti-Federalist opposition to the Constitution"
        - "The Populist movement of the 1890s, driven by overproduction, falling crop prices and debt"
      option_explanations:
