    - slug: apush-u07-w24-q23
      type: short_answer
      topic_code: "7.8"
      source: "Primary source: Warren G. Harding, \"Readjustment\" (1920), Nation's Forum recording, Library of Congress"
      points: 3
      stimulus: |
        "America's present need is not heroics but healing; not nostrums but normalcy; not revolution but restoration; not agitation but adjustment; not surgery but serenity; not the dramatic but the dispassionate; not experiment but equipoise; not submergence in internationality but sustainment in triumphant nationality."

        — Senator Warren G. Harding, speech recorded in 1920, during his campaign for president (as summarised in the Library of Congress catalogue record)
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the historical situation in which Harding made this statement.

        (b) Briefly explain ONE way the policies of the Republican administrations of the 1920s reflected Harding's message.

        (c) Briefly explain ONE way the 1920s did NOT bring a return to the 'normalcy' Harding promised.
      answer: |
        (a) Harding spoke in 1920, after the First World War, the bitter fight over the Treaty of Versailles, the strikes and race riots of 1919, the Red Scare and soaring inflation; many Americans were tired of Wilson's crusades at home and abroad.

        (b) The United States stayed out of the League of Nations ('not submergence in internationality'), and the Harding and Coolidge administrations cut taxes under Andrew Mellon, raised the tariff in 1922 and reduced regulation of business.

        (c) Instead of restoring the past, the decade brought rapid change: the automobile, radio and movies created a new mass culture, young women challenged traditional roles, and the Harlem Renaissance and the conflicts over the Klan, Prohibition and evolution showed a society in turmoil rather than serenity.
      explanation: |
        One point per part.

        (a) 1 pt for describing the situation in 1919–1920: the end of the war, the treaty fight, strikes, the Red Scare, race riots, inflation and postwar recession, weariness with Progressive and Wilsonian reform. Describing 'the 1920s' in general earns zero.

        (b) 1 pt for a specific policy explained: rejection of the League; Mellon's tax cuts; the Fordney–McCumber Tariff; reduced antitrust enforcement; immigration restriction (as 'triumphant nationality'); vetoes of farm relief.

        (c) 1 pt for a specific way the decade was not 'normal': new technology and mass culture; the 'new woman'; the Harlem Renaissance; cultural conflicts (Scopes, the Klan); Teapot Dome; active diplomacy (Washington Naval Conference, Dawes Plan, Kellogg–Briand Pact); the speculative boom and crash.

        Skill: sourcing (historical situation and purpose) and continuity and change.
    - slug: apush-u07-w24-q24
      type: short_answer
      topic_code: "7.8"
      source: "general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course): "The conflicts of the 1920s were not really about alcohol, evolution or immigration. They were about who owned the nation. The 1920 census showed for the first time that more Americans lived in towns and cities than in the countryside, and small-town Protestant Americans, sensing that the future belonged to the cities, used law to defend their way of life."
      prompt: |
        Using the interpretation, answer (a), (b) and (c).

        (a) Briefly describe the interpretation's main argument.

        (b) Briefly explain ONE specific development from the 1920s that supports the interpretation.

        (c) Briefly explain ONE specific development from the 1920s that complicates or challenges the interpretation.
      answer: |
        (a) It argues that the decade's cultural battles were at root a struggle between a declining rural, Protestant America and a rising urban, immigrant and secular one over who would define national identity.

        (b) The Scopes trial pitted Tennessee's anti-evolution law, backed by rural fundamentalists and William Jennings Bryan, against Clarence Darrow and urban modernists; the Immigration Act of 1924 likewise wrote rural and nativist fears of city immigrants into law.

        (c) The second Klan was strong in cities such as Indianapolis, Detroit and Denver, and Prohibition was supported by many urban Progressives and opposed by rural Catholics, so the conflict did not divide neatly between city and country; racial conflict, as in the Chicago riot of 1919, also crossed the rural-urban line.
      explanation: |
        One point per part.

        (a) 1 pt for describing the rural versus urban (or traditional versus modern) explanation of the decade's conflicts.

        (b) 1 pt for specific supporting evidence explained: the Scopes trial and anti-evolution laws; Prohibition's rural, Protestant base; the 1924 quotas; the Klan's '100% Americanism'; the 1928 election in which the urban Catholic Al Smith lost the rural South and West.

        (c) 1 pt for specific complicating evidence explained: the Klan's urban strength; urban Progressive support for Prohibition; conflicts over race and gender that do not fit the rural-urban model; economic causes (farm depression) as well as cultural ones; consensus on consumerism across regions.

        Skill: argumentation with a secondary source.
    - slug: apush-u07-w24-q25
      type: long_answer
      topic_code: "7.8"
      source: "general knowledge"
      points: 6
      prompt: |
        The 1920s are often remembered as a decade of prosperity and modern culture. In developing your argument, you might consider new technologies and consumer goods, migration and immigration, religion and science, race relations, the roles of women, or government policy.

        Evaluate the extent to which American society and culture changed in the 1920s compared with the period 1890 to 1919.
      answer: |
        Thesis: American culture changed significantly in the 1920s, as automobiles, radio, film and consumer credit created a national mass culture and the Harlem Renaissance and the 'new woman' challenged older hierarchies, but these changes provoked a powerful defence of continuity: immigration restriction, Prohibition, the second Klan and fundamentalism extended older nativist and Protestant traditions.

        Context: industrialisation and immigration of 1890–1914; Progressive moral reform; the war and the Great Migration.

        Body 1 (change): Ford and the automobile; radio networks; Hollywood; installment credit; advertising.

        Body 2 (change): Harlem Renaissance (Hughes), Garvey, flappers, Nineteenth Amendment's first decade, Lost Generation.

        Body 3 (continuity): 1924 Immigration Act extending Chinese Exclusion; Prohibition as the culmination of temperance; second Klan; Scopes and evangelical Protestantism; women still mostly excluded from equal pay.

        Complexity: the change was uneven by region, class and race (rural electrification, farm depression).
      explanation: |
        Six points, College Board LEQ rubric applied to this prompt.

        Thesis/claim (1): a defensible claim about the extent of cultural and social change, establishing a line of reasoning (e.g. 'significant change in mass culture, provoking a reaction that preserved older values').

        Contextualization (1): industrialisation, urbanisation and 'new' immigration before 1914; Progressive reform; the First World War and its aftermath (Great Migration, Red Scare, suffrage).

        Evidence (2): 1 pt for two specific examples (Model T, radio/KDKA, The Jazz Singer, installment buying, Harlem Renaissance figures, Garvey, flappers, Scopes trial, Immigration Act of 1924, Prohibition, second Klan, Sacco and Vanzetti, Sheppard–Towner Act). 2 pts for using them to support an argument about extent of change.

        Analysis and reasoning (2): 1 pt for using continuity and change to frame the argument against the earlier period. 1 pt for complex understanding: e.g. explaining both change and continuity; showing that change and reaction were linked (modernity provoked traditionalism); distinguishing experiences by race, region, gender or class; connecting to later developments (the Depression, the New Deal coalition).

        Zero for a list of 1920s features with no comparison to 1890–1919.
