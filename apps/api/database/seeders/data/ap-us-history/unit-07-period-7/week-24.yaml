week: 24
unit: 7
title: "The 1920s"
topics: ["7.7", "7.8"]
guide: guides/week-24.md
guide_description: |
  The new consumer economy of automobiles, electricity, radio, film and credit, and the Republican policies that
  championed business; then the decade's cultural battles over immigration, religion and science, Prohibition, the
  Klan, women's roles and the Harlem Renaissance. Worked examples: an SAQ on the Scopes trial, a comparison of
  Du Bois, Garvey and Hughes, and a continuity-and-change thesis on nativism from 1882 to 1924.
flashcards_description: |
  32 cards on the business politics, technologies and mass culture of the 1920s and on its conflicts over
  immigration, religion, race, Prohibition and the "new woman".
flashcards:
  - front: Harding's "normalcy" (1920) → what voters were choosing
    back: |
      Warren Harding promised calm after war, strikes, the Red Scare and Wilson's crusades: lower taxes, high tariffs,
      less regulation and no League of Nations. He won over 60% of the popular vote in the first presidential election
      after the Nineteenth Amendment.
    topic_code: "7.8"
  - front: Teapot Dome scandal → who and what
    back: |
      Harding's Interior Secretary, Albert Fall, secretly leased federal oil reserves at Teapot Dome, Wyoming, and Elk
      Hills, California, to private oilmen in return for loans and gifts. He became the first cabinet member jailed
      for crimes in office. The worst of several scandals in a corrupt administration.
    topic_code: "7.8"
  - front: Andrew Mellon's tax policy → argument and effect
    back: |
      Treasury Secretary 1921–1932. He cut income tax rates, especially at the top, arguing that the wealthy would
      invest the savings and create jobs. Federal debt fell, but income became more concentrated, one weakness behind
      the crash.
    topic_code: "7.7"
  - front: Fordney–McCumber Tariff (1922) → effect at home and abroad
    back: |
      Raised tariffs to among the highest levels in U.S. history to protect industry and farmers. Europeans found it
      harder to sell in the United States and so to repay war debts, and other nations raised their own tariffs.
    topic_code: "7.7"
  - front: Coolidge's address to newspaper editors (1925) → the famous line, correctly quoted
    back: |
      "After all, the chief business of the American people is business." Often misquoted as "the business of America
      is business". In the same speech he added that the accumulation of wealth could not be justified as the chief
      end of existence.
    topic_code: "7.7"
  - front: Henry Ford's moving assembly line (1913) and Model T → effect on price and wages
    back: |
      Moving the work past stationary workers cut the time to build a car from about twelve hours to about ninety
      minutes. The Model T's price fell to under $300 by the mid-1920s, and Ford's $5 day (1914) let workers buy the
      cars they built.
    topic_code: "7.7"
  - front: The automobile in the 1920s → four effects
    back: |
      It drove the steel, rubber, glass and oil industries; produced roads, gas stations and motels; let suburbs grow
      beyond streetcar lines; and gave young people privacy and independence, which worried moralists. By 1929 there
      were over 20 million cars on the roads.
    topic_code: "7.7"
  - front: Radio in the 1920s → KDKA and the effect on national culture
    back: |
      Pittsburgh's KDKA broadcast the 1920 election results; by the end of the decade networks (NBC, CBS) carried the
      same shows, sports and advertising into millions of homes. Radio created a shared national culture and a new
      tool of politics.
    topic_code: "7.7"
  - front: Hollywood and The Jazz Singer (1927) → movies and mass culture
    back: |
      Weekly movie attendance reached tens of millions; stars such as Charlie Chaplin set fashions and values. The Jazz
      Singer, the first feature with synchronised dialogue, began the sound era. Critics feared movies undermined
      morals, leading to industry self-censorship.
    topic_code: "7.7"
  - front: Installment buying → how it fuelled the 1920s boom and its risk
    back: |
      Buying on credit ('a dollar down, a dollar a week') let families buy cars, radios and appliances before saving the
      price. Demand grew, but so did household debt; when incomes fell after 1929 spending collapsed.
    topic_code: "7.7"
  - front: Bruce Barton, The Man Nobody Knows (1925) → what it shows about the decade
    back: |
      A best-seller by an advertising executive presenting Jesus as a successful businessman and master salesman. It
      captures the decade's celebration of business and advertising's new cultural authority.
    topic_code: "7.7"
  - front: Electrification in the 1920s → who had it and who did not
    back: |
      Most urban homes gained electricity, and with it irons, vacuum cleaners, washing machines and refrigerators.
      Most farm families did not, because private utilities found rural lines unprofitable, a gap the New Deal's Rural
      Electrification Administration later closed.
    topic_code: "7.7"
  - front: The farm depression of the 1920s → cause and failed remedy
    back: |
      Wartime demand ended, Europe recovered, and mechanised farms overproduced, so prices collapsed and debts mounted.
      Congress twice passed the McNary–Haugen bill to have the government buy surpluses, and Coolidge vetoed it twice.
      Agriculture was depressed before the crash.
    topic_code: "7.7"
  - front: Emergency Quota Act (1921) and Immigration Act of 1924 → how the quotas worked
    back: |
      The 1921 act limited each nationality to 3% of its numbers in the 1910 census; the 1924 Johnson–Reed Act cut that
      to 2% of the 1890 census, before most southern and eastern Europeans had arrived, and barred immigrants
      ineligible for citizenship, meaning Asians. Immigration from Italy, Poland and Russia collapsed.
    topic_code: "7.8"
  - front: Western Hemisphere exemption and the Border Patrol (1924) → Mexican immigration
    back: |
      The quotas did not apply to the Western Hemisphere, because southwestern growers wanted Mexican labor, so Mexican
      immigration continued; the same year Congress created the Border Patrol, and crossing outside official ports
      became a crime in 1929.
    topic_code: "7.8"
  - front: Sacco and Vanzetti (executed 1927) → why the case became a symbol
    back: |
      Two Italian-born anarchists were convicted of a 1920 robbery-murder in Massachusetts on disputed evidence, before
      a judge openly hostile to radicals. Worldwide protests could not stop their execution. The case symbolised the
      links between nativism and antiradicalism.
    topic_code: "7.8"
  - front: Second Ku Klux Klan (1915–1920s) → targets, membership, decline
    back: |
      Refounded in 1915 and inspired by The Birth of a Nation, it targeted African Americans, Catholics, Jews and
      immigrants in the name of '100% Americanism' and Protestant morality. Membership reached millions by the
      mid-1920s, strong in the Midwest (Indiana) as well as the South, then collapsed after scandal.
    topic_code: "7.8"
  - front: Scopes trial (1925) → law, lawyers and meaning
    back: |
      Teacher John Scopes was tried for violating Tennessee's Butler Act, which banned teaching that humans descended
      from lower animals. Clarence Darrow defended him; William Jennings Bryan helped prosecute. Scopes was convicted
      and fined $100 (overturned on a technicality), but the trial dramatised the clash of fundamentalism and
      modernism.
    topic_code: "7.8"
  - front: Fundamentalism vs modernism → compare
    back: |
      Fundamentalists insisted on the literal truth of the Bible and resisted Darwinism and liberal theology; modernists
      reconciled faith with science and historical criticism. The split ran through Protestant denominations and
      mapped roughly onto rural versus urban America.
    topic_code: "7.8"
  - front: Prohibition (1920–1933) → Volstead Act, effects, repeal
    back: |
      The Eighteenth Amendment and the Volstead Act banned the manufacture and sale of alcohol. Drinking fell but did
      not stop: speakeasies, bootlegging and organised crime (Al Capone in Chicago) flourished, and enforcement was
      uneven. The Twenty-first Amendment repealed it in 1933.
    topic_code: "7.8"
  - front: Harlem Renaissance → four figures and what united them
    back: |
      Langston Hughes and Claude McKay (poetry), Zora Neale Hurston (fiction and folklore), Alain Locke (The New Negro,
      1925), with jazz musicians such as Duke Ellington. Made possible by the Great Migration, it asserted Black pride
      and a distinct African American culture.
    topic_code: "7.8"
  - front: Langston Hughes, "The Negro Artist and the Racial Mountain" (1926) → argument
    back: |
      Hughes urged Black artists to stop imitating white standards and to express their own experience: "We younger
      Negro artists who create now intend to express our individual dark-skinned selves without fear or shame." A
      manifesto of the Harlem Renaissance's pride and independence.
    topic_code: "7.8"
  - front: Marcus Garvey and the UNIA → message and appeal
    back: |
      A Jamaican immigrant whose Universal Negro Improvement Association preached Black pride, economic self-reliance
      and a return to Africa, with parades, Black-owned businesses and the Black Star Line. Millions were drawn to it
      in the early 1920s. Convicted of mail fraud in 1923, he was deported in 1927.
    topic_code: "7.8"
  - front: Du Bois vs Garvey in the 1920s → compare
    back: |
      Du Bois and the NAACP sought integration and equal rights within the United States through law and protest;
      Garvey preached separation, Black nationalism and an African homeland. They attacked each other bitterly, but
      both drew on the new confidence of migrant communities.
    topic_code: "7.8"
  - front: Jazz Age → why jazz spread nationally in the 1920s
    back: |
      Musicians such as Louis Armstrong carried New Orleans jazz north with the Great Migration to Chicago and New
      York; records and radio spread it. To many young whites it meant freedom; to critics it meant moral decline.
      Its spread across the colour line was a cultural crossing in a segregated society.
    topic_code: "7.8"
  - front: Flappers and the "new woman" → change and its limits
    back: |
      Young urban women cut their hair, wore shorter skirts, smoked and danced in public, and more women held office
      and clerical jobs. But most married women did not work for wages, pay was unequal, and the new freedom mostly
      reached the young, white, urban middle class.
    topic_code: "7.8"
  - front: Sheppard–Towner Act (1921) → significance for women and federal power
    back: |
      The first federal social-welfare programme for mothers and infants, passed partly because politicians feared the
      new women's vote. It funded prenatal and child health clinics until Congress let it lapse in 1929 under pressure
      from the American Medical Association.
    topic_code: "7.8"
  - front: Equal Rights Amendment (1923) → who proposed it and why women divided
    back: |
      Alice Paul's National Woman's Party proposed it. Many women reformers opposed it, fearing it would wipe out the
      protective labor laws (like the one upheld in Muller v. Oregon) they had won. It was not passed by Congress until
      1972.
    topic_code: "7.8"
  - front: Lost Generation → who and what they expressed
    back: |
      Writers such as Ernest Hemingway and F. Scott Fitzgerald, disillusioned by the war and by materialism, some living
      as expatriates in Paris. Fitzgerald's The Great Gatsby (1925) portrayed the emptiness of wealth and pleasure.
    topic_code: "7.8"
  - front: Indian Citizenship Act (1924) → what it did and did not do
    back: |
      Granted citizenship to all American Indians born in the United States, many of whom had served in the war. It did
      not guarantee voting rights; several states kept barring Native Americans from voting for decades.
    topic_code: "7.8"
  - front: Al Smith and the election of 1928 → why it mattered
    back: |
      The Democrat Al Smith, Catholic, urban, son of immigrants and opposed to Prohibition, lost badly to Herbert Hoover,
      and anti-Catholic prejudice played a part. But he won the largest cities, a sign of the urban, ethnic coalition
      that would back the New Deal.
    topic_code: "7.8"
  - front: Which themes organise the 1920s conflicts? → rural/urban, native/immigrant, tradition/modernity
    back: |
      ARC and NAT: battles over religion and science (Scopes), alcohol (Prohibition), immigration (quotas), race (the
      Klan, the Harlem Renaissance) and gender (the new woman) all pitted defenders of an older, rural, Protestant
      nation against a newer urban, ethnic and secular one.
    topic_code: "7.8"
quiz:
  description: |
    25 questions · about 35 minutes · about 68% this week (the 1920s economy and technology, and the decade's cultural
    and political conflicts) and 32% review of Periods 4 and 6 and of weeks 22–23 (revivalism, laissez-faire,
    nativism, Populism, the Platt Amendment and the First World War home front). Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Coolidge, 1925 (7.7, 7.7, 6.12)
    - slug: apush-u07-w24-q01
      type: multiple_choice
      topic_code: "7.7"
      source: "Primary source: Calvin Coolidge, Address to the American Society of Newspaper Editors, January 17, 1925, The American Presidency Project"
      points: 1
      stimulus: |
        "After all, the chief business of the American people is business. They are profoundly concerned with producing, buying, selling, investing and prospering in the world. ... Of course, the accumulation of wealth can not be justified as the chief end of existence."

        — President Calvin Coolidge, address to the American Society of Newspaper Editors, January 17, 1925
      prompt: |
        Coolidge's view in the excerpt was most strongly shaped by which development of the early 1920s?
      options:
        - "A sharp rise in union membership and strikes after 1922"
        - "The collapse of the stock market"
        - "A boom in consumer goods such as automobiles, radios and electrical appliances"
        - "A new federal programme of public works"
      option_explanations:
        - |
          Union membership fell during the 1920s, after the failed strikes of 1919 and the employers' 'American Plan' against closed shops.
        - |
          The crash came in October 1929, nearly five years after this speech.
        - |
          Correct. After a brief postwar recession, industrial output, wages for many workers and the mass consumption of cars and appliances grew rapidly, seeming to confirm that business served the nation.
        - |
          The Republican administrations of the 1920s limited federal spending; large public works came with the New Deal.
      answer: 2
      explanation: |
        Skill: contextualization. A speaker's confidence reflects the moment: 1925 was the middle of the boom.
    - slug: apush-u07-w24-q02
      type: multiple_choice
      topic_code: "7.7"
      source: "Primary source: Calvin Coolidge, Address to the American Society of Newspaper Editors, January 17, 1925, The American Presidency Project"
      points: 1
      stimulus: |
        "After all, the chief business of the American people is business. They are profoundly concerned with producing, buying, selling, investing and prospering in the world. ... Of course, the accumulation of wealth can not be justified as the chief end of existence."

        — President Calvin Coolidge, address to the American Society of Newspaper Editors, January 17, 1925
      prompt: |
        Which policy of the Republican administrations of the 1920s best reflects the attitude in the excerpt?
      options:
        - "The creation of Social Security"
        - "Strict enforcement of antitrust laws against large corporations"
        - "Andrew Mellon's reductions in income tax rates for high earners and the high Fordney–McCumber Tariff"
        - "Federal ownership of the electrical power industry"
      option_explanations:
        - |
          Social Security was a New Deal law of 1935.
        - |
          Antitrust enforcement weakened in the 1920s, and the Federal Trade Commission became friendlier to business.
        - |
          Correct. Mellon argued that tax cuts for the wealthy would fuel investment, and the 1922 tariff protected U.S. manufacturers: policies designed to help business prosper.
        - |
          Republicans opposed public power; Coolidge vetoed George Norris's plan for federal operation of the Muscle Shoals dam, later the core of the TVA.
      answer: 2
      explanation: |
        Skill: making connections between a source and policy. The 'business government' of Harding, Coolidge and Mellon.
    - slug: apush-u07-w24-q03
      type: multiple_choice
      topic_code: "6.12"
      source: "Primary source: Calvin Coolidge, Address to the American Society of Newspaper Editors, January 17, 1925, The American Presidency Project"
      points: 1
      stimulus: |
        "After all, the chief business of the American people is business. They are profoundly concerned with producing, buying, selling, investing and prospering in the world. ... Of course, the accumulation of wealth can not be justified as the chief end of existence."

        — President Calvin Coolidge, address to the American Society of Newspaper Editors, January 17, 1925
      prompt: |
        Review. The excerpt shows the most continuity with which Gilded Age idea?
      options:
        - "The belief, associated with laissez-faire and the 'Gospel of Wealth', that private enterprise drives national progress and that government should not interfere with it"
        - "The Social Gospel's demand for public relief of the poor"
        - "The Knights of Labor's goal of replacing wage labor with cooperatives"
        - "The Populist call for government ownership of railroads"
      option_explanations:
        - |
          Correct. Like Andrew Carnegie and the defenders of laissez-faire in the 1880s, Coolidge saw business as the engine of progress, while (like Carnegie) allowing that wealth was not life's highest end.
        - |
          The Social Gospel criticised the excesses of capitalism and pushed for reform.
        - |
          The Knights' cooperative vision rejected the wage system Coolidge celebrated.
        - |
          Railroad nationalisation was a challenge to private enterprise, the opposite of Coolidge's view.
      answer: 0
      explanation: |
        Skill: continuity and change. The 1920s revived Gilded Age confidence in business after the Progressive and wartime expansion of government.

    # ---- Set B: Tennessee's Butler Act, 1925 (7.8, 7.8, 4.10)
    - slug: apush-u07-w24-q04
      type: multiple_choice
      topic_code: "7.8"
      source: "Primary source: Tennessee Butler Act (1925), University of Minnesota Law Library, Clarence Darrow Digital Collection"
      points: 1
      stimulus: |
        "That it shall be unlawful for any teacher in any of the Universities, Normals and all other public schools of the State which are supported in whole or in part by the public school funds of the State, to teach any theory that denies the story of the Divine Creation of man as taught in the Bible, and to teach instead that man has descended from a lower order of animals."

        — Tennessee, Butler Act, Section 1, March 1925
      prompt: |
        The law excerpted above was most directly a response to
      options:
        - "the arrival of large numbers of Catholic immigrants in rural Tennessee"
        - "the spread of modernist ideas, including Darwinian evolution, in schools and universities"
        - "a Supreme Court ruling requiring the teaching of evolution"
        - "the Harlem Renaissance's influence on southern culture"
      option_explanations:
        - |
          Few immigrants settled in rural Tennessee, and the law concerns science teaching, not Catholicism.
        - |
          Correct. As high school enrollment soared, more students met biology textbooks teaching evolution; fundamentalists saw this as an attack on biblical faith and moral order.
        - |
          There was no such ruling; the Supreme Court did not strike down a ban on teaching evolution until 1968.
        - |
          The law addresses teaching about human origins, not Black culture.
      answer: 1
      explanation: |
        Skill: sourcing (historical situation). The Butler Act was one of several southern laws of the 1920s against teaching evolution, and led to the Scopes trial that summer.
    - slug: apush-u07-w24-q05
      type: multiple_choice
      topic_code: "7.8"
      source: "Primary source: Tennessee Butler Act (1925), University of Minnesota Law Library, Clarence Darrow Digital Collection"
      points: 1
      stimulus: |
        "That it shall be unlawful for any teacher in any of the Universities, Normals and all other public schools of the State which are supported in whole or in part by the public school funds of the State, to teach any theory that denies the story of the Divine Creation of man as taught in the Bible, and to teach instead that man has descended from a lower order of animals."

        — Tennessee, Butler Act, Section 1, March 1925
      prompt: |
        The supporters of the law were most similar in their goals to the supporters of which other development of the 1920s?
      options:
        - "The flapper's challenge to older standards of dress and behaviour"
        - "The expansion of the movie industry"
        - "The Harlem Renaissance"
        - "Prohibition and the immigration quotas, defended as ways to protect a traditional Protestant American culture"
      option_explanations:
        - |
          Flappers represented the urban modernism the law's supporters opposed.
        - |
          Movies were widely attacked by traditionalists as a threat to morality.
        - |
          The Harlem Renaissance celebrated new forms of Black culture, a modern movement.
        - |
          Correct. Fundamentalists, prohibitionists and nativists often overlapped, all defending an older, rural, Protestant vision of the nation against urban, immigrant and secular change; the revived Klan drew on all three.
      answer: 3
      explanation: |
        Skill: comparison. The 1920s 'culture wars' shared a common defensive impulse.
    - slug: apush-u07-w24-q06
      type: multiple_choice
      topic_code: "4.10"
      source: "Primary source: Tennessee Butler Act (1925), University of Minnesota Law Library, Clarence Darrow Digital Collection"
      points: 1
      stimulus: |
        "That it shall be unlawful for any teacher in any of the Universities, Normals and all other public schools of the State which are supported in whole or in part by the public school funds of the State, to teach any theory that denies the story of the Divine Creation of man as taught in the Bible, and to teach instead that man has descended from a lower order of animals."

        — Tennessee, Butler Act, Section 1, March 1925
      prompt: |
        Review. The religious outlook behind the law drew most directly on which earlier tradition?
      options:
        - "Transcendentalism's view of God in nature"
        - "Deism, as practised by many of the Founders"
        - "The Catholic Church's teaching authority"
        - "The evangelical Protestantism spread by the revivals of the Second Great Awakening"
      option_explanations:
        - |
          Transcendentalists such as Emerson rejected traditional doctrine in favour of personal intuition.
        - |
          Deists rejected biblical revelation as literal truth, the opposite of the law's premise.
        - |
          The law's 'story ... as taught in the Bible' reflects Protestant reliance on scripture, not church authority; many fundamentalists were also anti-Catholic.
        - |
          Correct. The evangelical, Bible-centred Protestantism of the early nineteenth-century revivals had made the South and rural Midwest strongholds of a faith that 1920s fundamentalists defended.
      answer: 3
      explanation: |
        Skill: continuity across periods. Evangelical Protestantism (4.10) remained a political force, from reform crusades in the 1830s to Prohibition and the anti-evolution laws of the 1920s.

    # ---- Set C: Langston Hughes, 1926 (7.8, 7.6, 7.8)
    - slug: apush-u07-w24-q07
      type: multiple_choice
      topic_code: "7.8"
      source: "Primary source: Langston Hughes, \"The Negro Artist and the Racial Mountain,\" The Nation, June 23, 1926 (reproduced at thenation.com)"
      points: 1
      stimulus: |
        "We younger Negro artists who create now intend to express our individual dark-skinned selves without fear or shame. If white people are pleased we are glad. If they are not, it doesn't matter. We know we are beautiful. And ugly too."

        — Langston Hughes, "The Negro Artist and the Racial Mountain," The Nation, June 23, 1926
      prompt: |
        The excerpt is best understood as an expression of which cultural movement?
      options:
        - "Booker T. Washington's strategy of accommodation"
        - "The Social Gospel movement"
        - "The Lost Generation's disillusionment with the war"
        - "The Harlem Renaissance's assertion of Black artistic independence and pride"
      option_explanations:
        - |
          Washington urged patience and acceptance of white expectations; Hughes rejects caring whether white people are pleased.
        - |
          The Social Gospel was a Protestant reform movement concerned with urban poverty.
        - |
          The Lost Generation writers (Hemingway, Fitzgerald) were mostly white and focused on postwar disillusion, not racial identity.
        - |
          Correct. Hughes speaks for 'younger Negro artists' claiming the right to portray Black life on their own terms, the core of the Harlem Renaissance.
      answer: 3
      explanation: |
        Skill: sourcing (point of view and purpose). Hughes wrote for a national, largely white, liberal readership, yet declared independence from its approval.
    - slug: apush-u07-w24-q08
      type: multiple_choice
      topic_code: "7.6"
      source: "Primary source: Langston Hughes, \"The Negro Artist and the Racial Mountain,\" The Nation, June 23, 1926 (reproduced at thenation.com)"
      points: 1
      stimulus: |
        "We younger Negro artists who create now intend to express our individual dark-skinned selves without fear or shame. If white people are pleased we are glad. If they are not, it doesn't matter. We know we are beautiful. And ugly too."

        — Langston Hughes, "The Negro Artist and the Racial Mountain," The Nation, June 23, 1926
      prompt: |
        Review. Which earlier development most directly made the movement Hughes represented possible?
      options:
        - "The end of segregation in northern schools"
        - "The passage of a federal anti-lynching law in 1922"
        - "The Immigration Act of 1924"
        - "The Great Migration, which concentrated hundreds of thousands of African Americans in northern cities such as New York"
      option_explanations:
        - |
          Northern schools were often segregated in practice, and no general desegregation occurred in this period.
        - |
          The Dyer anti-lynching bill passed the House in 1922 but was blocked by a Senate filibuster; no federal anti-lynching law passed until 2022.
        - |
          The 1924 act restricted European and Asian immigration; it did not create Harlem's community.
        - |
          Correct. Wartime migration created large, confident Black communities, with Harlem the largest, that supported publishers, theaters, clubs and audiences.
      answer: 3
      explanation: |
        Skill: causation across weeks (7.6 to 7.8). The Great Migration is the demographic foundation of the Harlem Renaissance.
    - slug: apush-u07-w24-q09
      type: multiple_choice
      topic_code: "7.8"
      source: "Primary source: Langston Hughes, \"The Negro Artist and the Racial Mountain,\" The Nation, June 23, 1926 (reproduced at thenation.com)"
      points: 1
      stimulus: |
        "We younger Negro artists who create now intend to express our individual dark-skinned selves without fear or shame. If white people are pleased we are glad. If they are not, it doesn't matter. We know we are beautiful. And ugly too."

        — Langston Hughes, "The Negro Artist and the Racial Mountain," The Nation, June 23, 1926
      prompt: |
        Marcus Garvey's Universal Negro Improvement Association shared Hughes's emphasis on racial pride but differed from most Harlem Renaissance writers in that Garvey
      options:
        - "urged African Americans to accept segregation and focus on vocational training"
        - "opposed all forms of Black business ownership"
        - "worked mainly through lawsuits to end segregation"
        - "called for Black economic independence and a return to Africa rather than equality within American society"
      option_explanations:
        - |
          That was Booker T. Washington's strategy a generation earlier.
        - |
          Garvey promoted Black business ownership.
        - |
          Lawsuits were the NAACP's method, which Garvey dismissed.
        - |
          Correct. Garvey's Black nationalism stressed separation, Black-owned businesses such as the Black Star Line and an African homeland, while Hughes and the NAACP sought a place in American life.
      answer: 3
      explanation: |
        Skill: comparison. Racial pride took different political forms: integrationist (NAACP, Du Bois), cultural (Hughes) and nationalist (Garvey).

    - slug: apush-u07-w24-q10
      type: multiple_choice
      topic_code: "7.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following was the most significant economic effect of the mass-produced automobile in the 1920s?
      options:
        - "It caused a decline in consumer credit."
        - "It reduced demand for steel and oil."
        - "It stimulated related industries such as steel, rubber, glass and petroleum, and encouraged road building and suburban growth."
        - "It ended the need for railroads to carry freight."
      option_explanations:
        - |
          Cars were the main item bought on installment credit, which expanded.
        - |
          The opposite: cars were the largest consumers of steel, rubber and petroleum products.
        - |
          Correct. The auto industry was the decade's leading sector; its spending rippled through supplier industries and gas stations, and state and federal road programmes grew.
        - |
          Railroads remained the main freight carriers until long-distance trucking grew after the Second World War.
      answer: 2
      explanation: |
        Skill: causation (effects). The automobile was the engine of the 1920s boom.
    - slug: apush-u07-w24-q11
      type: multiple_choice
      topic_code: "7.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Radio and motion pictures in the 1920s most directly contributed to
      options:
        - "the strengthening of distinct regional dialects and customs"
        - "the growth of a shared national mass culture of entertainment, sports stars and advertising"
        - "a decline in the influence of advertising"
        - "the end of racial segregation in public entertainment"
      option_explanations:
        - |
          Mass media tended to weaken regional differences, a common worry of the time.
        - |
          Correct. Network radio and Hollywood film brought the same programmes, heroes (Babe Ruth, Charles Lindbergh) and products to the whole country.
        - |
          Radio was paid for by advertising, which grew enormously.
        - |
          Theaters remained segregated in the South and often in practice in the North.
      answer: 1
      explanation: |
        Skill: causation. New communications technologies created a national culture (7.7), which in turn sharpened the clash with traditionalists (7.8).
    - slug: apush-u07-w24-q12
      type: multiple_choice
      topic_code: "7.8"
      source: "general knowledge"
      points: 1
      prompt: |
        The Immigration Act of 1924 based its national quotas on the census of 1890 primarily in order to
      options:
        - "reduce immigration from southern and eastern Europe, which had mostly arrived after 1890"
        - "increase immigration from Asia"
        - "end immigration from Mexico"
        - "encourage the immigration of skilled workers from Germany"
      option_explanations:
        - |
          Correct. Using the 1890 census shrank the quotas for Italians, Poles, Russian Jews and other 'new immigrants' and favoured northern and western Europeans.
        - |
          The act barred immigrants 'ineligible for citizenship', which in practice excluded Asians altogether.
        - |
          Western Hemisphere immigration, including from Mexico, had no quota because western growers wanted Mexican labor.
        - |
          Germans did benefit relatively, but the purpose was to cut 'new' immigration, not recruit skilled Germans.
