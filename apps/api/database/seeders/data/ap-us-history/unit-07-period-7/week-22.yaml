      explanation: |
        Skill: causation and making connections. Gilded Age urban growth (6.8) generated the investigative journalism and reform campaigns of the Progressive Era (7.4).
    - slug: apush-u07-w22-q21
      type: short_answer
      topic_code: "7.4"
      source: "Primary source: W. E. B. Du Bois, The Souls of Black Folk (1903), Project Gutenberg"
      points: 3
      stimulus: |
        "Mr. Washington represents in Negro thought the old attitude of adjustment and submission ..."

        "One ever feels his twoness,—an American, a Negro; two souls, two thoughts, two unreconciled strivings; two warring ideals in one dark body, whose dogged strength alone keeps it from being torn asunder."

        — W. E. B. Du Bois, The Souls of Black Folk, 1903
      prompt: |
        Using the excerpts, answer (a), (b) and (c).

        (a) Briefly describe Du Bois's point of view about Booker T. Washington's strategy.

        (b) Briefly explain ONE way African Americans organized to challenge segregation or disfranchisement between 1900 and 1920.

        (c) Briefly explain ONE way the Progressive movement failed to address, or reinforced, racial inequality.
      answer: |
        (a) Du Bois rejected Washington's accommodationism. He saw Washington's acceptance of segregation and stress on vocational training as "adjustment and submission" at a time when African Americans were losing the vote, and argued instead for full civil and political rights and higher education.

        (b) In 1909 Du Bois, Ida B. Wells and white reformers founded the NAACP, which challenged disfranchisement in court (winning Guinn v. United States in 1915 against Oklahoma's grandfather clause) and publicised lynching in The Crisis.

        (c) Under Woodrow Wilson, a Progressive Democrat, federal departments were segregated and Black civil servants demoted, and many southern Progressives backed disfranchisement as a 'reform' to clean up elections, so Progressive reform often excluded African Americans.
      explanation: |
        One point per part.

        (a) 1 pt for describing Du Bois's view: he criticised Washington's acceptance of segregation/accommodation and demanded civil rights, voting rights or higher education. Restating the quotation with no description earns zero; describing Washington's view alone earns zero.

        (b) 1 pt for a specific organization or method explained: Niagara Movement (1905), NAACP (1909) and its lawsuits (Guinn v. United States, 1915; Buchanan v. Warley, 1917), Ida B. Wells's anti-lynching campaign, The Crisis, Black women's clubs (National Association of Colored Women). Naming an organization without saying what it did earns zero.

        (c) 1 pt for a specific explanation: Wilson's segregation of federal offices; southern Progressives' disfranchisement laws; reformers' neglect of lynching (no federal anti-lynching law passed); eugenics; Progressive support for The Birth of a Nation's message (Wilson screened it at the White House in 1915). A general statement that 'Progressives were racist' without an example earns zero.

        Skill: sourcing (point of view) and contextualization.
    - slug: apush-u07-w22-q22
      type: short_answer
      topic_code: "7.2"
      source: "general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course): "American expansion after 1898 is best explained by markets. Manufacturers and farmers produced more than Americans could buy, the depression of 1893 made the surplus feel like a crisis, and policymakers wanted bases and open doors for trade far more than they wanted to govern other peoples. The talk of mission and civilization was the language in which economic interest was sold to voters."

        This interpretation reflects a view associated with the 'Wisconsin school' of diplomatic historians.
      prompt: |
        Using the interpretation, answer (a), (b) and (c).

        (a) Briefly describe the argument the interpretation makes about the causes of U.S. expansion.

        (b) Briefly explain ONE piece of historical evidence that supports the interpretation.

        (c) Briefly explain ONE piece of historical evidence that challenges or complicates the interpretation.
      answer: |
        (a) It argues that economic motives, the need for overseas markets for surplus goods after the depression of 1893, were the main cause of expansion, and that idealistic or racial language was a cover for them.

        (b) The Open Door notes (1899–1900) sought equal access to China's market without annexation, and the Philippines were valued as a gateway to Asian trade with coaling stations for the fleet, showing that trade access drove policy.

        (c) Ideas about racial hierarchy and a 'civilizing mission' (Beveridge's speeches, the 'white man's burden') and strategic arguments such as Mahan's case for sea power also drove expansion; and the yellow press and public outrage over the Maine pushed McKinley to war in 1898 more than business, much of which feared war would disrupt recovery.
      explanation: |
        One point per part.

        (a) 1 pt for describing the claim that economic interests (markets, surplus production, trade access) were the primary cause of expansion. Saying only 'it is about imperialism' earns zero.

        (b) 1 pt for specific supporting evidence explained: Open Door notes; overproduction and the Panic/depression of 1893; Hawaiian sugar planters and the overthrow of Liliuokalani; Philippines as a stepping-stone to China; dollar diplomacy under Taft; customs receiverships in the Dominican Republic.

        (c) 1 pt for specific evidence that challenges it: Mahan's strategic arguments; Social Darwinism, Anglo-Saxonism and missionary impulses; yellow journalism and humanitarian sympathy for Cuban rebels; many business leaders opposed war in 1898; anti-imperialists such as Carnegie were businessmen. Evidence must be explained, not just named.

        Skill: argumentation with secondary sources (claims and evidence).
    - slug: apush-u07-w22-q23
      type: long_answer
      topic_code: "7.4"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1890 and 1920, reformers known as Progressives sought to address the problems created by industrialization, urbanization and political corruption. In developing your argument, you might consider the work of journalists and social reformers, political reforms in the states, federal economic regulation, constitutional amendments, or the limits of reform.

        Evaluate the extent to which the Progressive movement changed the role of the federal government in American life in the period from 1890 to 1920.
      answer: |
        Thesis: Progressives changed the federal government's role to a significant extent, turning it from a largely passive referee into a regulator of business, food safety, money and natural resources, but the change was limited because enforcement stayed weak, the courts still protected 'freedom of contract' for most workers, and reform rarely reached African Americans or immigrants as equals.

        Context: Gilded Age laissez-faire, trusts, the depression of 1893, urban poverty, Populist demands.

        Body 1 (change): Roosevelt's Northern Securities suit and Hepburn Act; Meat Inspection and Pure Food and Drug Acts (1906) after The Jungle; national forests and conservation.

        Body 2 (change): Wilson's Federal Reserve (1913), Clayton Act and FTC (1914); the Sixteenth and Seventeenth Amendments; the Keating-Owen child labor act (1916); wartime agencies.

        Body 3 (limits/continuity): Hammer v. Dagenhart (1918) struck down the child labor law; most labor regulation was state-level (Muller, 1908); Wilson segregated federal offices; the Nineteenth Amendment came only in 1920.

        Complexity: Progressives accepted big business (New Nationalism) more than they broke it up, laying foundations the New Deal built on.
      explanation: |
        Six points, College Board LEQ rubric applied to this prompt.

        Thesis/claim (1): a historically defensible claim that establishes a line of reasoning about the extent of change, e.g. 'significantly changed by creating regulatory agencies, but limited by courts and a narrow idea of who counted as the people.' A restatement of the prompt earns zero.

        Contextualization (1): describes the broader context before or during the period, explained in relation to the prompt: industrial consolidation and trusts, Gilded Age laissez-faire and Social Darwinism, urban growth and immigration, the depression of 1893, the Populist revolt, muckraking journalism. A one-sentence passing reference does not earn it.

        Evidence (2): 1 pt for identifying two specific, relevant examples (e.g. Meat Inspection Act, Hepburn Act, Federal Reserve Act, Clayton Act, FTC, Sixteenth/Seventeenth/Eighteenth/Nineteenth Amendments, Northern Securities case, national forests, Keating-Owen Act, Children's Bureau, 1912). 2 pts for using specific evidence to support the argument about extent of change.

        Analysis and reasoning (2): 1 pt for using a reasoning process (continuity and change most naturally: comparing the federal role before and after) to frame the argument. 1 pt for complex understanding, e.g. weighing change against continuity; distinguishing state from federal reform; explaining how Progressives' racial and nativist limits shaped who benefited; connecting to later New Deal expansion; using multiple perspectives (business leaders who welcomed regulation to stabilise markets, as in the 'corporate liberal' interpretation).

        Zero for evidence that is outside the period (e.g. Social Security), or a narrative of reforms with no argument about extent.
