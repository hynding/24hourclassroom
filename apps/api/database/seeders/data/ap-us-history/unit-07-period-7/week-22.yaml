week: 22
unit: 7
title: "Empire and the Progressives"
topics: ["7.1", "7.2", "7.3", "7.4"]
guide: guides/week-22.md
guide_description: |
  How the closing of the continental frontier, the search for markets and a new navalism turned the United States
  outward after 1890; the imperialism debate, the Spanish–American War and the Philippine–American War; and the
  Progressives' attack on monopoly, corruption and unsafe work at home. Worked examples: a contextualization
  paragraph for Period 7, the Du Bois–Washington comparison as an SAQ answered part by part, and a thesis on how far
  Progressives changed the federal government.
flashcards_description: |
  31 cards on the context of Period 7, the imperialism debate, the war of 1898 and its aftermath, and the people,
  laws and limits of the Progressive movement.
flashcards:
  - front: Period 7 (1890–1945) → the three big shifts the CED asks you to explain
    back: |
      An industrial nation became an urban, mass-consumer society; the federal government took on far larger
      responsibility for the economy and social welfare (Progressives, then the New Deal); and the United States
      moved from regional power to world power through empire, two world wars and the founding of the UN.
    topic_code: "7.1"
  - front: Frederick Jackson Turner's frontier thesis (1893) → argument and link to empire
    back: |
      Turner argued that the frontier had shaped American democracy and individualism and that, by the 1890 census,
      it had closed. Expansionists drew the conclusion that new frontiers, markets and outlets for energy would now
      have to be found overseas.
    topic_code: "7.2"
  - front: Alfred Thayer Mahan, The Influence of Sea Power upon History (1890) → argument
    back: |
      A navy captain's argument that great powers rest on sea power: a modern steel fleet, overseas coaling stations
      and a canal across Central America. It shaped naval building in the 1890s and the drive for Hawaii, Guam, the
      Philippines and the Panama Canal.
    topic_code: "7.2"
  - front: Overthrow of Queen Liliuokalani (1893) → who, and what followed
    back: |
      American sugar planters and businessmen, backed by U.S. Marines from a visiting warship, deposed the Hawaiian
      queen after she tried to restore royal power. President Cleveland refused to annex the islands; Congress
      annexed Hawaii by joint resolution in 1898, during the war with Spain.
    topic_code: "7.2"
  - front: Anti-Imperialist League (1898–1899) → who joined and their three arguments
    back: |
      An unusual coalition: Mark Twain, Andrew Carnegie, Jane Addams, Samuel Gompers and many old abolitionists.
      Arguments: empire violates the consent of the governed and the Declaration of Independence; it breeds
      militarism; and (from some members) annexing nonwhite peoples or their cheap labor threatens American workers
      and racial order.
    hint: Principle, militarism, and sometimes racism.
    topic_code: "7.2"
  - front: Albert Beveridge, "The March of the Flag" (1898) → argument
    back: |
      The Indiana Republican argued that the consent of the governed applies only to peoples capable of
      self-government, so the United States could rightly rule former Spanish colonies as it already governed
      American Indians and territories. A classic statement of the racial and commercial case for empire.
    topic_code: "7.2"
  - front: Open Door notes (1899–1900) → John Hay's aim in China
    back: |
      Secretary of State John Hay asked the powers with spheres of influence in China to give all nations equal trading
      rights there and (after the Boxer Rebellion) to respect China's territorial integrity. The aim was access to
      markets without the cost of colonies.
    topic_code: "7.2"
  - front: USS Maine and yellow journalism (1898) → cause → effect
    back: |
      Hearst's and Pulitzer's papers dramatised Spanish brutality in Cuba; when the Maine exploded in Havana harbor
      in February 1898 they blamed Spain (the cause was never proven, and a coal-bunker fire is now thought likely).
      Public outrage helped push McKinley and Congress to war in April.
    topic_code: "7.3"
  - front: Teller Amendment (1898) vs Platt Amendment (1901) → compare
    back: |
      The Teller Amendment, attached to the war resolution, promised the United States would not annex Cuba. The
      Platt Amendment, written into Cuba's constitution and a 1903 treaty, gave the United States a right to
      intervene in Cuba and a naval station (Guantánamo). Independence promised, then limited.
    topic_code: "7.3"
  - front: Treaty of Paris (1898) → what the United States gained
    back: |
      Spain gave up Cuba and ceded Puerto Rico, Guam and the Philippines (for $20 million). The Senate ratified it
      narrowly in February 1899 after a fierce debate over whether a republic could hold colonies.
    topic_code: "7.3"
  - front: Philippine–American War (1899–1902) → Emilio Aguinaldo, tactics, cost
    back: |
      Filipino nationalists under Aguinaldo, who had declared independence from Spain, fought U.S. annexation. The
      U.S. Army answered guerrilla war with concentration of civilians and harsh reprisals. More than 4,000 American
      soldiers and, by common estimates, at least 200,000 Filipinos (mostly civilians, many from disease and hunger)
      died.
    topic_code: "7.3"
  - front: Insular Cases, Downes v. Bidwell (1901) → ruling and significance
    back: |
      The Supreme Court held that Puerto Rico belonged to the United States but was not part of it for the revenue
      clauses of the Constitution. Constitutional rights did not automatically follow the flag into "unincorporated"
      territories, so the islands could be governed as colonies.
    topic_code: "7.2"
  - front: Roosevelt Corollary to the Monroe Doctrine (1904) → claim and first use
    back: |
      Theodore Roosevelt claimed that chronic wrongdoing in a Western Hemisphere nation might force the United States
      to exercise an international police power. It turned Monroe's warning to Europe into a U.S. right to intervene,
      first used to run the Dominican Republic's customs houses (1905).
    topic_code: "7.2"
  - front: Panama Canal Zone (1903) → how the United States got it
    back: |
      When Colombia's senate rejected a canal treaty, Roosevelt backed a Panamanian revolt with U.S. warships,
      recognised Panama within days and signed the Hay–Bunau-Varilla Treaty giving the United States a zone in
      perpetuity. The canal opened in 1914.
    topic_code: "7.2"
  - front: Big stick (Roosevelt) vs dollar diplomacy (Taft) → compare
    back: |
      Roosevelt relied on naval power and the threat of intervention; Taft encouraged U.S. bankers to invest in Latin
      America and East Asia, expecting loans to bring stability and influence. Both treated the Caribbean as a U.S.
      sphere and both led to Marines landing (Nicaragua, 1912).
    topic_code: "7.2"
  - front: Muckrakers → three writers and their targets
    back: |
      Investigative journalists in mass-circulation magazines: Ida Tarbell (Standard Oil's methods), Lincoln Steffens
      (city machines, The Shame of the Cities) and Upton Sinclair (Chicago meatpacking). Roosevelt coined the name
      as a criticism, but their exposés built public support for reform.
    topic_code: "7.4"
  - front: Upton Sinclair, The Jungle (1906) → cause → effect
    back: |
      A socialist novel meant to expose the exploitation of immigrant packinghouse workers; readers fixed instead on
      filthy meat. Within months Congress passed the Meat Inspection Act and the Pure Food and Drug Act (1906), early
      federal consumer protection.
    topic_code: "7.4"
  - front: Initiative, referendum and recall → what each does
    back: |
      Initiative: voters petition to put a proposed law on the ballot. Referendum: voters approve or reject a law.
      Recall: voters remove an official before the term ends. Progressives (first in Oregon and Wisconsin) used them
      to take power from party machines and corporate lobbies.
    topic_code: "7.4"
  - front: Seventeenth Amendment (1913) → change and Populist roots
    back: |
      Senators would be elected directly by the people instead of by state legislatures, which corporations and
      machines could buy. The Populists' Omaha Platform (1892) had demanded it; Progressives achieved it.
    topic_code: "7.4"
  - front: Sixteenth Amendment (1913) → change and significance
    back: |
      Allowed a federal income tax without apportionment among the states. A modest graduated tax followed in 1913;
      it later financed two world wars and the modern federal government, replacing tariffs as the main revenue.
    topic_code: "7.4"
  - front: Muller v. Oregon (1908) and the Brandeis brief → ruling and the double edge
    back: |
      The Court upheld a ten-hour limit for women in laundries, persuaded by Louis Brandeis's brief of social and
      medical data. A Progressive victory over freedom of contract, but grounded in women's supposed physical
      weakness and maternal role, which later justified unequal treatment.
    topic_code: "7.4"
  - front: Triangle Shirtwaist Factory fire (1911) → cause → effect
    back: |
      146 garment workers, most of them young Jewish and Italian immigrant women, died in New York, many trapped by
      locked doors. New York passed dozens of fire-safety and factory laws, and the fire energised the International
      Ladies' Garment Workers' Union and urban liberals such as Al Smith and Frances Perkins.
    topic_code: "7.4"
  - front: Roosevelt's Square Deal → the three Cs
    back: |
      Control of corporations (Northern Securities trust-busting, the Hepburn Act regulating railroads), consumer
      protection (meat and drug laws) and conservation (national forests, monuments, the Newlands Act). The president
      as steward of the public interest, not a referee for business.
    topic_code: "7.4"
  - front: Election of 1912 → four candidates and the two Progressive programmes
    back: |
      Wilson (Democrat, New Freedom: break up trusts, restore competition), Theodore Roosevelt (Progressive "Bull
      Moose", New Nationalism: accept big business but regulate it with a strong federal state), Taft (Republican)
      and Eugene Debs (Socialist, about 6% of the vote). Wilson won as the Republicans split.
    topic_code: "7.4"
  - front: Wilson's New Freedom laws (1913–1914) → three
    back: |
      The Underwood Tariff (lower rates, with an income tax), the Federal Reserve Act (a central banking system of
      twelve regional banks to manage money and credit) and the Clayton Antitrust Act with the Federal Trade
      Commission (clearer antitrust rules, a regulator of unfair competition).
    topic_code: "7.4"
  - front: Gifford Pinchot vs John Muir → conservation compared with preservation
    back: |
      Pinchot, Roosevelt's chief forester, wanted resources managed scientifically for wise long-term use; Muir and
      the Sierra Club wanted wilderness preserved for its own sake. They split over damming Hetch Hetchy valley for
      San Francisco's water, approved in 1913.
    topic_code: "7.4"
  - front: W. E. B. Du Bois vs Booker T. Washington → compare their strategies
    back: |
      Washington (Atlanta Compromise, 1895) urged vocational education and economic progress while accepting
      segregation for the time being. Du Bois (The Souls of Black Folk, 1903) demanded full civil and political
      rights and higher education for a "talented tenth", and helped found the Niagara Movement (1905) and NAACP
      (1909).
    topic_code: "7.4"
  - front: Ida B. Wells → work and significance
    back: |
      A Memphis journalist who, from 1892, documented lynching with evidence and showed that most victims had not
      been accused of rape, the usual pretext. Her pamphlets (Southern Horrors, 1892) and campaigning made lynching a
      national and international issue; she was a founder of the NAACP.
    topic_code: "7.4"
  - front: NAACP (1909) → founders and strategy
    back: |
      Founded by Black and white reformers including Du Bois, Wells and Mary White Ovington. It fought segregation and
      disfranchisement through lawsuits (Guinn v. United States struck down Oklahoma's grandfather clause in 1915),
      lobbying for anti-lynching laws and its magazine The Crisis.
    topic_code: "7.4"
  - front: The limits of Progressivism → which groups it left out or harmed?
    back: |
      Wilson's administration segregated federal offices; many Progressives backed literacy tests, immigration
      restriction and eugenic sterilisation laws; southern Progressives combined reform with disfranchisement. Reform
      for the "people" often meant native-born white, middle-class people. Theme: SOC and NAT.
    topic_code: "7.4"
  - front: Who were the Progressives, and how did they differ from the Populists?
    back: |
      Mostly urban, middle-class and college-educated (journalists, lawyers, women's clubs, social workers), trusting
      experts and efficient government. Populists were mostly indebted farmers. Progressives took up Populist demands
      such as direct election of senators and an income tax and broadened them.
    topic_code: "7.4"
quiz:
  description: |
    23 questions · about 35 minutes · about 65% this week (the context of Period 7, the imperialism debate, the
    Spanish–American War and the Progressives) and 35% review of Periods 3, 4 and 6 (the Declaration, the Monroe
    Doctrine, laissez-faire, Populism and Gilded Age reform). Multiple choice, select-all and true/false items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long essay are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Anti-Imperialist League platform (7.2, 3.4, 7.3)
    - slug: apush-u07-w22-q01
      type: multiple_choice
      topic_code: "7.2"
      source: "Primary source: Platform of the American Anti-Imperialist League (1899), Internet Modern History Sourcebook, Fordham University"
      points: 1
      stimulus: |
        "We hold that the policy known as imperialism is hostile to liberty and tends toward militarism, an evil from which it has been our glory to be free. ... We insist that the subjugation of any people is "criminal aggression" and open disloyalty to the distinctive principles of our Government. We earnestly condemn the policy of the present National Administration in the Philippines."

        — Platform of the American Anti-Imperialist League, October 1899
      prompt: |
        The platform was most directly a response to which of the following?
      options:
        - "The Open Door notes requesting equal trading rights in China"
        - "The decision to annex the Philippines and suppress the Filipino independence movement"
        - "The construction of the Panama Canal under U.S. control"
        - "The annexation of Hawaii by a joint resolution of Congress"
      option_explanations:
        - |
          The Open Door notes sought trade access without colonies, which anti-imperialists generally found less objectionable than annexation and military rule.
        - |
          Correct. In 1899 the McKinley administration had taken the Philippines under the Treaty of Paris and was fighting Aguinaldo's nationalists; "subjugation" and "the policy ... in the Philippines" point straight at that war.
        - |
          The canal zone was acquired in 1903, four years after this platform; it cannot be the historical situation the document responds to.
        - |
          Hawaii's annexation (1898) was opposed by some of the same people, but the platform names the Philippines and the administration's current policy there, not Hawaii.
      answer: 1
      explanation: |
        Skill: sourcing (historical situation). Date the document, then find the event of that moment its words name: 1899 plus "the Philippines" plus "subjugation" means the Philippine–American War.
    - slug: apush-u07-w22-q02
      type: multiple_choice
      topic_code: "3.4"
      source: "Primary source: Platform of the American Anti-Imperialist League (1899), Internet Modern History Sourcebook, Fordham University"
      points: 1
      stimulus: |
        "We hold that the policy known as imperialism is hostile to liberty and tends toward militarism, an evil from which it has been our glory to be free. ... We insist that the subjugation of any people is "criminal aggression" and open disloyalty to the distinctive principles of our Government. We earnestly condemn the policy of the present National Administration in the Philippines."

        — Platform of the American Anti-Imperialist League, October 1899
      prompt: |
        Review. The "distinctive principles of our Government" the authors invoke most directly drew on which earlier set of ideas?
      options:
        - "The Social Gospel's call for churches to address urban poverty"
        - "The doctrine of nullification advanced by John C. Calhoun"
        - "The Enlightenment principle, stated in the Declaration of Independence, that just government rests on the consent of the governed"
        - "The mercantilist theory that colonies exist to enrich the home country"
      option_explanations:
        - |
          The Social Gospel was a Gilded Age religious reform movement; the platform's argument is political and constitutional, not about urban poverty.
        - |
          Nullification concerned a state's power to void federal law, an argument about federalism, not about ruling other peoples.
        - |
          Correct. The League's platform leaned on the Declaration's claim that governments derive their just powers from the consent of the governed, the revolutionary idea (topic 3.4) that ruling Filipinos without consent seemed to betray.
        - |
          Mercantilism is the logic the anti-imperialists rejected; it justified colonies, which is the policy they condemned.
      answer: 2
      explanation: |
        Skill: making connections across periods. Anti-imperialists argued that the republic would betray its founding Enlightenment principles, linking 1899 to 1776.
    - slug: apush-u07-w22-q03
      type: multiple_choice
      topic_code: "7.3"
      source: "Primary source: Platform of the American Anti-Imperialist League (1899), Internet Modern History Sourcebook, Fordham University"
      points: 1
      stimulus: |
        "We hold that the policy known as imperialism is hostile to liberty and tends toward militarism, an evil from which it has been our glory to be free. ... We insist that the subjugation of any people is "criminal aggression" and open disloyalty to the distinctive principles of our Government. We earnestly condemn the policy of the present National Administration in the Philippines."

        — Platform of the American Anti-Imperialist League, October 1899
      prompt: |
        Which of the following best explains why the authors failed to prevent the policy they condemned?
      options:
        - "The Senate ratified the Treaty of Paris, and in 1900 voters re-elected McKinley, who defended expansion as a source of markets, strategic bases and national prestige."
        - "Spain refused to sell the Philippines, so the United States had no choice but to occupy the islands by force."
        - "Most Democrats in Congress supported annexation of the Philippines in order to gain Filipino votes."
        - "The Supreme Court ruled in 1899 that the Constitution required Congress to annex any territory taken in war."
      option_explanations:
        - |
          Correct. The treaty passed the Senate narrowly in February 1899, and McKinley defeated Bryan in 1900, prosperity and victory outweighing the moral case against empire.
        - |
          Spain did cede the Philippines, for $20 million, in the Treaty of Paris (1898); the force was used against Filipino nationalists, not Spain.
        - |
          Filipinos could not vote in U.S. elections, and the Democratic nominee, William Jennings Bryan, campaigned against imperialism in 1900.
        - |
          No such ruling exists. The Insular Cases (1901) concerned which constitutional rights applied in new territories, after annexation, not whether annexation was required.
      answer: 0
      explanation: |
        Skill: causation. The anti-imperialists lost in the Senate and at the polls; expansion was popular because it promised markets and bases and seemed to confirm national greatness.

    # ---- Set B: the Roosevelt Corollary (4.4, 7.2, 7.2)
    - slug: apush-u07-w22-q04
      type: multiple_choice
      topic_code: "4.4"
      source: "Primary source: Theodore Roosevelt, Annual Message to Congress, December 6, 1904, National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "It is not true that the United States feels any land hunger or entertains any projects as regards the other nations of the Western Hemisphere save such as are for their welfare. ... Any country whose people conduct themselves well can count upon our hearty friendship. ... Chronic wrongdoing, or an impotence which results in a general loosening of the ties of civilized society, may in America, as elsewhere, ultimately require intervention by some civilized nation, and in the Western Hemisphere the adherence of the United States to the Monroe Doctrine may force the United States, however reluctantly, in flagrant cases of such wrongdoing or impotence, to the exercise of an international police power."

        — President Theodore Roosevelt, Annual Message to Congress, December 6, 1904
      prompt: |
        Review. Compared with the Monroe Doctrine of 1823, the policy in the excerpt differed most in that it
      options:
        - "promised that the United States would stay out of European wars"
        - "warned European powers against new colonies in the Americas for the first time"
        - "renounced any U.S. interest in Latin American trade"
        - "claimed a right for the United States itself to intervene in the internal affairs of Western Hemisphere nations"
      option_explanations:
        - |
          Non-involvement in Europe's wars was also part of Monroe's message, so it is a continuity, not the difference the question asks for.
        - |
          The warning against new European colonisation was the heart of the 1823 doctrine itself; Roosevelt built on it rather than introducing it.
        - |
          The corollary followed debt crises that threatened U.S. and European investors; it protected trade and investment rather than renouncing interest in them.
        - |
          Correct. Monroe told Europe to keep out; Roosevelt's corollary added that the United States would police the hemisphere itself, turning a defensive doctrine into a justification for U.S. intervention.
      answer: 3
      explanation: |
        Skill: comparison and continuity and change. Same doctrine, new purpose: from keeping Europe out (1823) to licensing U.S. intervention (1904).
    - slug: apush-u07-w22-q05
      type: multiple_choice
      topic_code: "7.2"
      source: "Primary source: Theodore Roosevelt, Annual Message to Congress, December 6, 1904, National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "It is not true that the United States feels any land hunger or entertains any projects as regards the other nations of the Western Hemisphere save such as are for their welfare. ... Any country whose people conduct themselves well can count upon our hearty friendship. ... Chronic wrongdoing, or an impotence which results in a general loosening of the ties of civilized society, may in America, as elsewhere, ultimately require intervention by some civilized nation, and in the Western Hemisphere the adherence of the United States to the Monroe Doctrine may force the United States, however reluctantly, in flagrant cases of such wrongdoing or impotence, to the exercise of an international police power."

        — President Theodore Roosevelt, Annual Message to Congress, December 6, 1904
      prompt: |
        The policy described in the excerpt most directly led to which of the following in the next two decades?
      options:
        - "The withdrawal of U.S. forces from Puerto Rico and Guam"
        - "A treaty in which European powers formally recognised Latin American neutrality"
        - "U.S. annexation of Mexico's northern states after the Mexican Revolution"
        - "Repeated U.S. military interventions and customs receiverships in Caribbean and Central American nations"
      option_explanations:
        - |
          Puerto Rico and Guam remained U.S. territories; Puerto Ricans were made U.S. citizens in 1917.
        - |
          No such treaty existed; the corollary was a unilateral U.S. claim, not a multilateral agreement.
        - |
          Wilson sent troops into Mexico (Veracruz in 1914, the Pershing expedition in 1916) but annexed no Mexican territory.
        - |
          Correct. The United States took over Dominican customs collection in 1905 and sent Marines to Nicaragua (1912), Haiti (1915) and the Dominican Republic (1916), some for many years.
      answer: 3
      explanation: |
        Skill: causation (effects). The corollary became the stated rationale for two decades of Caribbean interventions, the policy later softened by Franklin Roosevelt's Good Neighbor policy.
    - slug: apush-u07-w22-q06
      type: multiple_choice
      topic_code: "7.2"
      source: "Primary source: Theodore Roosevelt, Annual Message to Congress, December 6, 1904, National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "It is not true that the United States feels any land hunger or entertains any projects as regards the other nations of the Western Hemisphere save such as are for their welfare. ... Any country whose people conduct themselves well can count upon our hearty friendship. ... Chronic wrongdoing, or an impotence which results in a general loosening of the ties of civilized society, may in America, as elsewhere, ultimately require intervention by some civilized nation, and in the Western Hemisphere the adherence of the United States to the Monroe Doctrine may force the United States, however reluctantly, in flagrant cases of such wrongdoing or impotence, to the exercise of an international police power."

        — President Theodore Roosevelt, Annual Message to Congress, December 6, 1904
      prompt: |
        Roosevelt's references to "civilized society" and a "civilized nation" best reflect which assumption common among supporters of expansion?
      options:
        - "That Latin American nations should be admitted to the Union as states"
        - "That economic aid, not force, was the only legitimate tool of foreign policy"
        - "That the United States should form a permanent military alliance with Britain"
        - "That Anglo-Saxon nations had a duty and right to supervise peoples they judged less advanced"
      option_explanations:
        - |
          Expansionists rarely proposed statehood for Latin American nations; the Insular Cases' idea of unincorporated territory reflected the opposite assumption.
        - |
          The excerpt explicitly reserves the right to use an "international police power", so it does not limit policy to aid.
        - |
          Roosevelt admired Britain, but the United States made no formal alliance with it until the Second World War era; the excerpt is about the hemisphere.
        - |
          Correct. Ideas of racial hierarchy and the "civilizing mission" (Social Darwinism applied to nations, Kipling's 'white man's burden') framed intervention as a duty of advanced peoples.
      answer: 3
      explanation: |
        Skill: sourcing (point of view) and contextualization. Word choice reveals the cultural assumptions behind the policy: a hierarchy of 'civilized' and 'uncivilized' nations.

    # ---- Set C: Muller v. Oregon (7.4, 6.12, 7.4)
    - slug: apush-u07-w22-q07
      type: multiple_choice
      topic_code: "7.4"
      source: "Primary source: Muller v. Oregon, 208 U.S. 412 (1908), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: |
        "That woman's physical structure and the performance of maternal functions place her at a disadvantage in the struggle for subsistence is obvious. ... and, as healthy mothers are essential to vigorous offspring, the physical wellbeing of woman becomes an object of public interest and care in order to preserve the strength and vigor of the race."

        — Justice David Brewer, opinion of the Court, Muller v. Oregon, 1908
      prompt: |
        The decision excerpted above upheld an Oregon law that
      options:
        - "limited the number of hours women could work in factories and laundries"
        - "banned the employment of children under fourteen"
        - "required equal pay for women and men doing the same work"
        - "gave women the right to vote in state elections"
      option_explanations:
        - |
          Correct. Muller challenged a ten-hour limit for women in laundries; the Court upheld it, relying in part on Louis Brandeis's brief of social and medical evidence.
        - |
          Child labor laws were a major Progressive cause, but this case concerned adult women's working hours.
        - |
          Equal pay for equal work did not become federal law until 1963; the opinion stresses women's difference, not equality.
        - |
          Oregon did adopt women's suffrage, by initiative, but not until 1912, and the case concerns labor, not voting.
      answer: 0
      explanation: |
        Skill: contextualization. Muller is the leading example of Progressive protective labor legislation surviving the courts.
    - slug: apush-u07-w22-q08
      type: multiple_choice
      topic_code: "6.12"
      source: "Primary source: Muller v. Oregon, 208 U.S. 412 (1908), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: |
        "That woman's physical structure and the performance of maternal functions place her at a disadvantage in the struggle for subsistence is obvious. ... and, as healthy mothers are essential to vigorous offspring, the physical wellbeing of woman becomes an object of public interest and care in order to preserve the strength and vigor of the race."

        — Justice David Brewer, opinion of the Court, Muller v. Oregon, 1908
      prompt: |
        Review. The ruling departed most clearly from which Gilded Age principle?
      options:
        - "The belief that the federal government should own the railroads"
        - "The belief that tariffs should be high to protect American industry"
        - "The belief that government should not interfere with the freedom of employers and workers to set the terms of labor contracts"
        - "The belief that silver should be coined freely to expand the money supply"
      option_explanations:
        - |
          Federal ownership of railroads was a Populist demand that the Gilded Age mainstream rejected; Muller says nothing about it.
        - |
          The protective tariff was a Republican policy of the period, but the case concerns state labor regulation, not trade.
        - |
          Correct. Laissez-faire courts had protected 'liberty of contract' (most famously in Lochner v. New York, 1905, striking down bakers' hour limits); Muller allowed the state to regulate, though only for women.
        - |
          Free silver was the Populist and Bryan Democratic currency demand, unrelated to working hours.
      answer: 2
      explanation: |
        Skill: continuity and change. Laissez-faire and 'freedom of contract' (topic 6.12) gave way, case by case, to a state willing to regulate work. Muller's exception for women shows the change was partial.
    - slug: apush-u07-w22-q09
      type: multiple_choice
      topic_code: "7.4"
      source: "Primary source: Muller v. Oregon, 208 U.S. 412 (1908), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: |
        "That woman's physical structure and the performance of maternal functions place her at a disadvantage in the struggle for subsistence is obvious. ... and, as healthy mothers are essential to vigorous offspring, the physical wellbeing of woman becomes an object of public interest and care in order to preserve the strength and vigor of the race."

        — Justice David Brewer, opinion of the Court, Muller v. Oregon, 1908
      prompt: |
        A historian arguing that Progressive reforms could reinforce traditional gender roles would most likely cite the excerpt because it
      options:
        - "justified protecting women workers by emphasising motherhood and physical weakness rather than equal rights"
        - "was written by a female justice who opposed suffrage"
        - "rejected all forms of labor regulation as unconstitutional"
        - "required employers to hire women in equal numbers to men"
      option_explanations:
        - |
          Correct. The reasoning rests on 'maternal functions' and women's 'disadvantage', so the same logic later justified barring women from some jobs and paying them less.
        - |
          No woman sat on the Supreme Court until 1981; Justice David Brewer wrote the opinion.
        - |
          The ruling upheld regulation; it did not reject it.
        - |
          Nothing in the case concerns hiring quotas.
      answer: 0
      explanation: |
        Skill: claims and evidence. A source can support an argument for a reason its author did not intend: Muller protected women workers while defining them by motherhood.

    - slug: apush-u07-w22-q10
      type: multiple_choice
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best describes a major change across the whole of Period 7 (1890–1945)?
      options:
        - "Political power shifted from cities to the countryside as farm populations grew."
        - "Immigration rose steadily every decade from 1890 to 1945."
        - "The United States moved from a largely rural, regionally focused nation to an urban industrial world power with a much larger federal government."
        - "The federal government shrank as states took over economic regulation."
      option_explanations:
        - |
          Farm population fell as a share of the nation; cities and suburbs gained people and political weight.
        - |
          Immigration peaked around 1907–1914, then fell sharply with the First World War, the quota laws of 1921 and 1924 and the Depression.
        - |
          Correct. The 1920 census was the first to count more urban than rural Americans, and the period runs from the Spanish–American War to victory in the Second World War, with the federal government growing at each stage.
        - |
          The opposite happened: Progressive regulation, wartime agencies and the New Deal greatly expanded federal power.
      answer: 2
      explanation: |
        Skill: contextualization. Period 7's big story is urbanisation, a larger federal role, and the rise to world power.
    - slug: apush-u07-w22-q11
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The initiative, the referendum, the recall and the direct primary were all intended primarily to
      options:
        - "strengthen state legislatures at the expense of governors"
        - "transfer control of elections from the states to the federal government"
        - "reduce the influence of party bosses and corporate interests by giving voters more direct power"
        - "restrict voting to taxpayers and property owners"
      option_explanations:
        - |
          The reforms bypassed legislatures, which reformers distrusted, rather than strengthening them.
        - |
          These were state-level reforms; elections remained under state control.
        - |
          Correct. Progressives such as Wisconsin's Robert La Follette believed machines and lobbies had captured legislatures; these devices let voters write laws, approve them, remove officials and choose nominees directly.
        - |
          Their goal was more direct democracy for existing voters, although some Progressives elsewhere supported literacy tests that did restrict the electorate.
      answer: 2
      explanation: |
        Skill: causation. Progressive political reform aimed to restore 'the people's' control over government captured by machines and money.
    - slug: apush-u07-w22-q12
      type: multiple_choice
      topic_code: "6.13"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which demand of the Populists' Omaha Platform of 1892 was achieved by constitutional amendment in the Progressive Era?
      options:
        - "The direct election of United States senators"
        - "The free and unlimited coinage of silver"
        - "Government ownership of the railroads and telegraph"
        - "A subtreasury system of federal crop loans to farmers"
      option_explanations:
        - |
          Correct. The Seventeenth Amendment (1913) ended election of senators by state legislatures; the Sixteenth (income tax) also fulfilled a Populist demand.
        - |
          Free silver died with Bryan's defeat in 1896 and the Gold Standard Act of 1900.
        - |
          Railroads stayed private; the federal government regulated them instead (Hepburn Act, 1906), except during temporary wartime control in 1917–1920.
        - |
          Federal farm credit came later and in other forms (the Federal Farm Loan Act of 1916, New Deal agencies), and never by constitutional amendment.
      answer: 0
      explanation: |
        Skill: continuity and change. Populism lost elections but many of its demands won later, through middle-class Progressives (topic 6.13 to 7.4).
    - slug: apush-u07-w22-q13
      type: multiple_choice
      topic_code: "6.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Jane Addams's Hull House (1889) in Chicago is best understood as an example of
      options:
        - "a government agency funded by the Department of Labor"
        - "a political machine providing jobs in return for votes"
        - "a company town built by an employer to control workers"
        - "a settlement house in which middle-class reformers lived among immigrants and offered services such as classes and child care"
      option_explanations:
        - |
          The Department of Labor was not created until 1913, and Hull House was privately funded.
        - |
          Machines did trade services for votes, but Hull House was nonpartisan and often opposed Chicago's machine.
        - |
          Company towns such as Pullman were employer projects; Hull House was an independent reform institution.
        - |
          Correct. Settlement houses offered kindergartens, English and citizenship classes and public baths, and their residents (many college-educated women) gathered data that fed Progressive campaigns for child labor and housing laws.
      answer: 3
      explanation: |
        Skill: making connections. Gilded Age settlement work (6.11) trained the women who led many Progressive reforms (7.4).
    - slug: apush-u07-w22-q14
      type: multi_select
      topic_code: "7.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were federal laws or amendments adopted during the Progressive Era (about 1900–1920).
      options:
        - "The Pure Food and Drug Act"
        - "The Federal Reserve Act"
        - "The Sherman Antitrust Act"
        - "The Clayton Antitrust Act"
        - "The Social Security Act"
        - "The Sixteenth Amendment"
      option_explanations:
        - |
          Correct. Passed in 1906, with the Meat Inspection Act, after The Jungle and years of exposés of adulterated food and patent medicines.
        - |
          Correct. Passed in 1913 under Wilson, it created twelve regional reserve banks and a Federal Reserve Board to manage money and credit.
        - |
          The Sherman Act dates from 1890, a Gilded Age law that was weakly enforced until Roosevelt revived it against Northern Securities (1902–1904).
        - |
          Correct. Passed in 1914, it listed specific unfair practices and exempted unions from antitrust prosecution, at least on paper.
        - |
          The Social Security Act was a New Deal law of 1935, a generation after the Progressive Era.
        - |
          Correct. Ratified in 1913, it allowed a federal income tax.
      answer: [0, 1, 3, 5]
      explanation: |
        Skill: chronology and contextualization. Progressive federal reform clusters under Roosevelt (1906) and Wilson (1913–1914); the Sherman Act is earlier and Social Security later.
    - slug: apush-u07-w22-q15
      type: multi_select
      topic_code: "7.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were results of the Spanish–American War and the peace that followed.
      options:
        - "The United States acquired Puerto Rico, Guam and the Philippines."
        - "Cuba became a U.S. state in 1902."
        - "Filipino nationalists fought a war against U.S. rule."
        - "Cuba's independence was limited by the Platt Amendment."
        - "Spain ceded Hawaii to the United States."
      option_explanations:
        - |
          Correct. The Treaty of Paris (1898) transferred all three from Spain.
        - |
          Cuba was never annexed; the Teller Amendment had renounced annexation, and Cuba became a nominally independent republic under U.S. supervision.
        - |
          Correct. The Philippine–American War (1899–1902, with fighting continuing for years in some islands) cost far more lives than the war with Spain.
        - |
          Correct. The Platt Amendment gave the United States a right to intervene and a naval base at Guantánamo Bay.
        - |
          Hawaii was never Spanish. It was an independent kingdom, then a republic controlled by American planters, annexed by joint resolution in 1898.
      answer: [0, 2, 3]
      explanation: |
        Skill: causation (effects). The 'splendid little war' with Spain lasted months; its consequences (colonies, a colonial war and a Cuban protectorate) lasted decades.
    - slug: apush-u07-w22-q16
      type: true_false
      topic_code: "7.2"
      source: "Primary source: Downes v. Bidwell, 182 U.S. 244 (1901), Justia U.S. Supreme Court Center"
      points: 1
      prompt: |
        In the Insular Cases, such as Downes v. Bidwell (1901), the Supreme Court held that the full Constitution applied automatically in Puerto Rico and the Philippines once the United States acquired them.
      answer: false
      explanation: |
        False. The Court held that Puerto Rico was "a territory appurtenant and belonging to the United States, but not a part of the United States within the revenue clauses of the Constitution." Rights did not automatically follow the flag into these unincorporated territories, so Congress could govern them as colonies. Skill: claims and evidence.
    - slug: apush-u07-w22-q17
      type: true_false
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. When James Monroe announced the Monroe Doctrine in 1823, the United States had the naval power to enforce it against any European state.
      answer: false
      explanation: |
        False. In 1823 the U.S. Navy was small, and the doctrine was effectively backed by Britain's Royal Navy, which also wanted Spain's former colonies open to trade. Only after the naval build-up of the 1890s could Theodore Roosevelt make the doctrine an instrument of U.S. power. Skill: continuity and change.
    - slug: apush-u07-w22-q18
      type: fill_blank
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Upton Sinclair's 1906 novel ____, about immigrant workers in Chicago's meatpacking plants, helped bring about the Meat Inspection Act and the Pure Food and Drug Act.
      answer: ["The Jungle", "Jungle"]
      explanation: |
        The Jungle. Sinclair meant to win sympathy for exploited workers; readers reacted mostly to the unsanitary meat, and Roosevelt pushed both laws through Congress within months. Skill: causation.
    - slug: apush-u07-w22-q19
      type: fill_blank
      topic_code: "6.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The first federal law to bar immigration on the basis of nationality, passed in 1882, was the ____ Act.
      answer: ["Chinese Exclusion", "Chinese Exclusion Act"]
      explanation: |
        The Chinese Exclusion Act. Nativist pressure, strongest among western workers, produced the first nationality-based ban (6.9); the same logic grew into the quota laws of the 1920s. Skill: continuity and change.
    - slug: apush-u07-w22-q20
      type: multiple_choice
      topic_code: "6.8"
      source: "Primary source: Jacob A. Riis, How the Other Half Lives (1890), Project Gutenberg"
      points: 1
      stimulus: |
        "The tenements to-day are New York, harboring three-fourths of its population."

        — Jacob A. Riis, How the Other Half Lives: Studies Among the Tenements of New York, 1890
      prompt: |
        Review. Riis's book and photographs most directly contributed to which development?
      options:
        - "Federal construction of public housing in the 1890s"
        - "Campaigns for housing codes and urban reform that became part of the Progressive movement"
        - "The movement of most immigrants to farms in the Great Plains"
        - "The end of immigration from southern and eastern Europe"
      option_explanations:
        - |
          Federal public housing began with the New Deal (the Housing Act of 1937), not in the 1890s.
        - |
          Correct. Riis's exposés helped pass New York's Tenement House Act of 1901 and made him a model for the muckrakers; Theodore Roosevelt, as police commissioner, toured tenements with him.
        - |
          Most new immigrants settled in industrial cities, where the jobs were; that concentration is the subject of the book.
        - |
          Immigration from southern and eastern Europe kept rising until the First World War and was cut only by the quota laws of the 1920s.
