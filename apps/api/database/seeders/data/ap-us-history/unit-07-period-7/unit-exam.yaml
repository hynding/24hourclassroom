      Evaluate the extent to which the New Deal changed the relationship between the federal government and the American people in the period from 1929 to 1941.

      In your response you should do the following: respond to the prompt with a historically defensible thesis or claim that establishes a line of reasoning; describe a broader historical context relevant to the prompt; support an argument using at least four documents; use at least one additional piece of specific historical evidence beyond the documents; for at least two documents, explain how or why the document's point of view, purpose, historical situation and/or audience is relevant to the argument; and demonstrate a complex understanding of the historical development that is the focus of the prompt.
    answer: |
      Thesis: The New Deal transformed the relationship between the federal government and the American people, replacing Hoover's 'rugged individualism' (Doc 1) with a federal responsibility for jobs, workers' rights and old-age security (Docs 5, 6, 7), but the change was limited by constitutional challenges (Doc 4), by persistent unemployment until war spending (Doc 3), and by exclusions that left many African American, Mexican American and women workers outside the new protections.

      Context: Gilded Age and 1920s laissez-faire; Progressive regulation; the crash, bank failures and 25% unemployment.

      Body 1, from voluntarism to federal action: Doc 1 (sourcing: a campaign speech at the height of the boom) versus Doc 2 (Roosevelt's war metaphor for an audience in panic); the bank holiday and FDIC (outside evidence).

      Body 2, new rights and protections: Docs 5 and 6 (Wagner Act, Social Security), Doc 7 (purpose: after the 1936 landslide, preparing to confront the Court); CIO and Flint sit-down strike.

      Body 3, limits: Doc 4 (a unanimous Court, including liberals, so not just partisanship) and the Court-packing fight; Doc 3 (the 1937–1938 recession); Social Security exclusions.

      Complexity: change in expectations was permanent even where economic results were incomplete; continuity in preserving private capitalism.
    explanation: |
      Seven points, College Board DBQ rubric applied to this prompt.

      Thesis/claim (1): a historically defensible claim about the extent of change, with a line of reasoning, in the introduction or conclusion. Example: 'The New Deal fundamentally changed the federal government's responsibility for citizens' economic security, though constitutional, political and racial limits kept the change partial.' Restating the prompt earns zero.

      Contextualization (1): describes the broader context, explained in relation to the prompt: the laissez-faire tradition and 1920s 'business government'; Progressive regulation as precedent; the crash, bank failures, Hoovervilles, the Dust Bowl; the rise of fascism and communism abroad as alternatives that shaped American fears. Must be more than a phrase.

      Evidence from the documents (2): 1 pt for accurately describing the content of at least three documents; 2 pts for using at least four documents to support the argument (e.g. Docs 1 and 2 to show a change in philosophy; Docs 5–7 to show new federal responsibilities; Docs 3 and 4 to show limits).

      Evidence beyond the documents (1): one specific, relevant piece of evidence not in the documents, explained in relation to the argument: bank holiday and Emergency Banking Act, FDIC, CCC, WPA, TVA, AAA and the eviction of sharecroppers, Flint sit-down strike and the CIO, Court-packing plan, Fair Labor Standards Act, Indian Reorganization Act, Huey Long, the Liberty League, the New Deal coalition, Mary McLeod Bethune.

      Analysis and reasoning (2):
      - Sourcing (1): for at least two documents, explain how point of view, purpose, historical situation or audience is relevant to the argument. Examples: Doc 1 was a 1928 campaign speech given at the height of prosperity, so Hoover's confidence in individualism reflects a moment before the crash; Doc 2's audience was a nation in banking panic, so the war metaphor aimed to justify unprecedented executive power; Doc 3's definition (relief workers counted as unemployed) makes New Deal years look worse than alternative series; Doc 4 was unanimous, so opposition to the NRA was not merely conservative; Doc 7 came after a landslide, as Roosevelt prepared to challenge the Court.
      - Complex understanding (1): demonstrated through the argument, e.g. explaining both change and continuity; explaining multiple causes or perspectives (left and right critics); showing different experiences by race, gender or region; connecting the New Deal to Progressive precedents or to the wartime and postwar state. Must be part of the argument, not a single sentence.

      Zero for a summary of documents in order without an argument, or for evidence beyond the documents that is outside the period or inaccurate.
