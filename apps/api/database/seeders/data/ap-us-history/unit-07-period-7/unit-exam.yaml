unit: 7
description: |
  45 questions · about 80 minutes · every topic of Period 7 (7.1 to 7.15) with about a fifth of the items reviewing
  Periods 3 to 6, six source-based multiple-choice sets, one short-answer question with a secondary source and one
  with a primary source (3 points each), and a document-based question on the New Deal (7 points). Multiple choice,
  select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the
  free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Set 1: Beveridge, 1898 (7.2, 7.3, 5.2)
  - slug: apush-u07-exam-q01
    type: multiple_choice
    topic_code: "7.2"
    source: "Primary source: Albert J. Beveridge, \"The March of the Flag\" (1898), Voices of Democracy, University of Maryland"
    points: 1
    stimulus: |
      "The opposition tells us that we ought not to govern a people without their consent. I answer, the rule of liberty that all just government derives its authority from the consent of the governed, applies only to those who are capable of self-government. ... We govern the Indians without their consent; we govern our territories without their consent; we govern our children without their consent."

      — Albert J. Beveridge, Republican candidate for the U.S. Senate from Indiana, campaign speech, September 16, 1898
    prompt: |
      Beveridge's argument was most directly a response to
    options:
      - "critics who argued that ruling former Spanish colonies would violate the principle of government by consent"
      - "Populists who demanded the free coinage of silver"
      - "Germans who opposed U.S. neutrality"
      - "Progressives who demanded the direct election of senators"
    option_explanations:
      - |
        Correct. Beveridge answers 'the opposition', the anti-imperialists who invoked the Declaration of Independence against annexing Spain's former colonies.
      - |
        Free silver was an 1896 issue about money, unrelated to governing colonies.
      - |
        U.S. neutrality in the First World War was nearly two decades away.
      - |
        The Seventeenth Amendment campaign concerned domestic democracy, not colonial rule.
    answer: 0
    explanation: |
      Skill: sourcing (historical situation and purpose). The speech is one side of the imperialism debate of 1898–1900.
  - slug: apush-u07-exam-q02
    type: multiple_choice
    topic_code: "7.3"
    source: "Primary source: Albert J. Beveridge, \"The March of the Flag\" (1898), Voices of Democracy, University of Maryland"
    points: 1
    stimulus: |
      "The opposition tells us that we ought not to govern a people without their consent. I answer, the rule of liberty that all just government derives its authority from the consent of the governed, applies only to those who are capable of self-government. ... We govern the Indians without their consent; we govern our territories without their consent; we govern our children without their consent."

      — Albert J. Beveridge, Republican candidate for the U.S. Senate from Indiana, campaign speech, September 16, 1898
    prompt: |
      The ideas in the excerpt were most directly put into practice when the United States
    options:
      - "fought to suppress the Filipino independence movement after annexing the Philippines"
      - "joined the League of Nations"
      - "admitted Puerto Rico as a state"
      - "granted immediate independence to Cuba without conditions"
    option_explanations:
      - |
        Correct. The Philippine–American War (1899–1902) imposed U.S. rule on Filipinos who had declared their own independence, exactly the government without consent Beveridge defended.
      - |
        The United States never joined the League.
      - |
        Puerto Rico became an unincorporated territory, not a state.
      - |
        Cuba's independence was conditioned by the Platt Amendment, and the Teller Amendment had ruled out annexation anyway.
    answer: 0
    explanation: |
      Skill: causation (ideas to policy).
  - slug: apush-u07-exam-q03
    type: multiple_choice
    topic_code: "5.2"
    source: "Primary source: Albert J. Beveridge, \"The March of the Flag\" (1898), Voices of Democracy, University of Maryland"
    points: 1
    stimulus: |
      "The opposition tells us that we ought not to govern a people without their consent. I answer, the rule of liberty that all just government derives its authority from the consent of the governed, applies only to those who are capable of self-government. ... We govern the Indians without their consent; we govern our territories without their consent; we govern our children without their consent."

      — Albert J. Beveridge, Republican candidate for the U.S. Senate from Indiana, campaign speech, September 16, 1898
    prompt: |
      Review. Beveridge's reasoning shows the most continuity with which earlier idea?
    options:
      - "Manifest Destiny, the belief that Americans were destined to spread their institutions across the continent, often justified by claims of racial superiority"
      - "The Federalist argument for a strong central bank"
      - "The Seneca Falls Declaration's demand for women's suffrage"
      - "Abolitionists' demand for immediate emancipation"
    option_explanations:
      - |
        Correct. Like the advocates of Manifest Destiny in the 1840s, Beveridge claimed a providential mission to expand and treated other peoples (Mexicans, American Indians, now Filipinos) as unfit for self-government.
      - |
        The national bank debate concerned federal economic power, not expansion.
      - |
        Seneca Falls extended the Declaration's principles to women; Beveridge narrowed them.
      - |
        Abolitionists argued for universal rights, the opposite of Beveridge's restriction of consent.
    answer: 0
    explanation: |
      Skill: continuity and change across periods (5.2 to 7.2). Overseas empire extended the logic of continental expansion.

  # ---- Set 2: Du Bois, 1903 (7.4, 6.4, 7.8)
  - slug: apush-u07-exam-q04
    type: multiple_choice
    topic_code: "7.4"
    source: "Primary source: W. E. B. Du Bois, The Souls of Black Folk (1903), Project Gutenberg"
    points: 1
    stimulus: |
      "The Problem of the Twentieth Century is the problem of the color-line."

      "One ever feels his twoness,—an American, a Negro; two souls, two thoughts, two unreconciled strivings; two warring ideals in one dark body, whose dogged strength alone keeps it from being torn asunder."

      — W. E. B. Du Bois, The Souls of Black Folk, 1903
    prompt: |
      Du Bois's ideas most directly contributed to the founding of which organization?
    options:
      - "The Tuskegee Institute"
      - "The Southern Christian Leadership Conference"
      - "The National Association for the Advancement of Colored People (1909)"
      - "The Universal Negro Improvement Association"
    option_explanations:
      - |
        Booker T. Washington led Tuskegee (1881), the institution of the vocational strategy Du Bois criticised.
      - |
        The SCLC was founded in 1957 by Martin Luther King Jr. and others, in Period 8.
      - |
        Correct. Du Bois's Niagara Movement (1905) and the interracial NAACP (1909), where he edited The Crisis, pursued full civil and political rights.
      - |
        Marcus Garvey founded the UNIA; Du Bois was one of his sharpest critics.
    answer: 2
    explanation: |
      Skill: causation. Du Bois's challenge to accommodation led to organised civil rights activism in the Progressive Era.
  - slug: apush-u07-exam-q05
    type: multiple_choice
    topic_code: "6.4"
    source: "Primary source: W. E. B. Du Bois, The Souls of Black Folk (1903), Project Gutenberg"
    points: 1
    stimulus: |
      "The Problem of the Twentieth Century is the problem of the color-line."

      "One ever feels his twoness,—an American, a Negro; two souls, two thoughts, two unreconciled strivings; two warring ideals in one dark body, whose dogged strength alone keeps it from being torn asunder."

      — W. E. B. Du Bois, The Souls of Black Folk, 1903
    prompt: |
      Review. Which development of the 1890s best explains Du Bois's concern with the 'color-line'?
    options:
      - "The creation of the Freedmen's Bureau"
      - "The spread of Jim Crow segregation and disfranchisement in the South, upheld by Plessy v. Ferguson (1896)"
      - "The ratification of the Fifteenth Amendment"
      - "The end of sharecropping in the South"
    option_explanations:
      - |
        The Freedmen's Bureau operated from 1865 to 1872.
      - |
        Correct. Southern states wrote segregation and voting restrictions (poll taxes, literacy tests) into law in the 1890s, and the Court's 'separate but equal' doctrine sanctioned them.
      - |
        The Fifteenth Amendment was ratified in 1870 and was being evaded, not newly ratified, in the 1890s.
      - |
        Sharecropping persisted in the South for decades, into the mid-twentieth century.
    answer: 1
    explanation: |
      Skill: contextualization (6.4 to 7.4). The New South's racial order is the setting for Du Bois's book.
  - slug: apush-u07-exam-q06
    type: multiple_choice
    topic_code: "7.8"
    source: "Primary source: W. E. B. Du Bois, The Souls of Black Folk (1903), Project Gutenberg"
    points: 1
    stimulus: |
      "The Problem of the Twentieth Century is the problem of the color-line."

      "One ever feels his twoness,—an American, a Negro; two souls, two thoughts, two unreconciled strivings; two warring ideals in one dark body, whose dogged strength alone keeps it from being torn asunder."

      — W. E. B. Du Bois, The Souls of Black Folk, 1903
    prompt: |
      The idea of 'twoness' in the excerpt was most fully explored in the 1920s by
    options:
      - "the leaders of the second Ku Klux Klan"
      - "the Lost Generation writers in Paris"
      - "writers and artists of the Harlem Renaissance, such as Langston Hughes"
      - "fundamentalist preachers in the rural South"
    option_explanations:
      - |
        The Klan denied that African Americans could be full Americans at all.
      - |
        The Lost Generation writers explored postwar disillusion, not Black identity.
      - |
        Correct. Harlem Renaissance writers examined what it meant to be both Black and American, and asserted pride in a distinct African American culture.
      - |
        Fundamentalists were concerned with defending biblical faith against modernism.
    answer: 2
    explanation: |
      Skill: continuity across the period (7.4 to 7.8).

  # ---- Set 3: the Fourteen Points (7.5, 7.5, 7.14, 3.10)
  - slug: apush-u07-exam-q07
    type: multiple_choice
    topic_code: "7.5"
    source: "Primary source: Woodrow Wilson, Fourteen Points (January 8, 1918), National Archives, Milestone Documents"
    points: 1
    stimulus: |
      "I. Open covenants of peace, openly arrived at, after which there shall be no private international understandings of any kind but diplomacy shall proceed always frankly and in the public view.

      II. Absolute freedom of navigation upon the seas, outside territorial waters, alike in peace and in war, except as the seas may be closed in whole or in part by international action for the enforcement of international covenants. ...

      XIV. A general association of nations must be formed under specific covenants for the purpose of affording mutual guarantees of political independence and territorial integrity to great and small states alike."

      — President Woodrow Wilson, address to Congress, January 8, 1918
    prompt: |
      Point II most directly reflected Wilson's response to
    options:
      - "German submarine warfare and the British blockade, which had violated neutral shipping rights"
      - "Japanese expansion in Manchuria"
      - "the Panama Canal's tolls"
      - "the Washington Naval Conference"
    option_explanations:
      - |
        Correct. Disputes over neutral rights at sea, above all the U-boat campaign, had drawn the United States into the war.
      - |
        Japan seized Manchuria in 1931, thirteen years later.
      - |
        Canal tolls were a minor dispute with Britain settled in 1914.
      - |
        The Washington Conference (1921–1922) came after the war.
    answer: 0
    explanation: |
      Skill: contextualization.
