  - slug: apush-u07-exam-q43
    type: short_answer
    topic_code: "7.15"
    source: "general knowledge"
    points: 3
    stimulus: |
      Interpretation (written for this course): "The New Deal was the Progressive movement's second act. The same faith in experts, the same willingness to regulate business, even some of the same people (Frances Perkins had investigated the Triangle fire) carried over from 1912 to 1933. What changed was the scale of the crisis, not the ideas."
    prompt: |
      Using the interpretation, answer (a), (b) and (c).

      (a) Briefly describe the interpretation's argument about the relationship between Progressivism and the New Deal.

      (b) Briefly explain ONE piece of historical evidence that supports the interpretation.

      (c) Briefly explain ONE piece of historical evidence that challenges the interpretation.
    answer: |
      (a) It argues that the New Deal continued the Progressive movement's ideas (expert government and business regulation) and that only the size of the Depression made it larger.

      (b) Progressive regulatory agencies such as the Federal Trade Commission and the Federal Reserve were models for New Deal agencies such as the SEC, and the NRA's government-business cooperation copied the War Industries Board of 1917–1918, run under the Progressive Woodrow Wilson.

      (c) The New Deal went beyond regulation to direct provision: Social Security and the WPA made the federal government responsible for individuals' welfare, something most Progressives had left to states and private charity; and the Wagner Act sided with unions, which many Progressives had distrusted.
    explanation: |
      One point per part.

      (a) 1 pt for describing the continuity argument (the New Deal as an extension of Progressivism, differing in scale).

      (b) 1 pt for specific supporting evidence explained: continuity of personnel (Perkins, Roosevelt himself as Wilson's assistant navy secretary); FTC and Fed as precedents; War Industries Board as model for NRA; conservation linking Theodore Roosevelt and the CCC/TVA; Progressive state labor laws (Muller) as precursors of the FLSA.

      (c) 1 pt for specific challenging evidence explained: Social Security and federal relief; deficit spending; the Wagner Act and the CIO; the New Deal coalition including immigrants and African Americans whom many Progressives had sought to restrict; some old Progressives (e.g. in the Liberty League or as critics in Congress) opposed the New Deal.

      Skill: comparison (7.15) and argumentation with a secondary source.
  - slug: apush-u07-exam-q44
    type: short_answer
    topic_code: "7.12"
    source: "Primary source: Executive Order 8802 (1941), National Archives, Milestone Documents"
    points: 3
    stimulus: |
      "I do hereby reaffirm the policy of the United States that there shall be no discrimination in the employment of workers in defense industries or government because of race, creed, color, or national origin ..."

      — President Franklin D. Roosevelt, Executive Order 8802, June 25, 1941
    prompt: |
      Using the excerpt, answer (a), (b) and (c).

      (a) Briefly describe the historical situation in which Roosevelt issued the order.

      (b) Briefly explain ONE way the Second World War created new opportunities for African Americans.

      (c) Briefly explain ONE way African Americans continued to face discrimination during the war.
    answer: |
      (a) In 1941 defense industries were expanding rapidly but excluding Black workers; A. Philip Randolph threatened to lead a mass march on Washington, and Roosevelt issued the order and created the Fair Employment Practices Committee to prevent it.

      (b) Defense jobs in the North and West drew hundreds of thousands of African Americans out of the South in a second Great Migration, raising incomes and building political strength in northern cities.

      (c) The armed forces remained segregated, Black servicemen were often assigned to labor units, and white workers and residents attacked Black migrants, as in the Detroit riot of 1943.
    explanation: |
      One point per part.

      (a) 1 pt for the situation: defense build-up before Pearl Harbor; job discrimination in war industries; Randolph's March on Washington Movement. Saying only 'during World War II' earns zero.

      (b) 1 pt for a specific opportunity explained: defense jobs and wartime migration; FEPC complaints; military service such as the Tuskegee Airmen; NAACP growth and the Double V campaign.

      (c) 1 pt for specific discrimination explained: segregated military and blood supply; FEPC's weak enforcement; Detroit riot (1943); continued Jim Crow in the South; hate strikes by white workers.

      Skill: sourcing (historical situation) and continuity and change.
