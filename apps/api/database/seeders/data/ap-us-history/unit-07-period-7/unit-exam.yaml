  # ---- Set 5: Kellogg–Briand Pact, 1928 (7.11, 7.11, 7.14)
  - slug: apush-u07-exam-q14
    type: multiple_choice
    topic_code: "7.11"
    source: "Primary source: General Treaty for Renunciation of War as an Instrument of National Policy (Kellogg–Briand Pact), August 27, 1928, Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "The High Contracting Parties solemnly declare in the names of their respective peoples that they condemn recourse to war for the solution of international controversies, and renounce it, as an instrument of national policy in their relations with one another."

      — Article I, General Treaty for Renunciation of War (Kellogg–Briand Pact), signed at Paris, August 27, 1928
    prompt: |
      The treaty excerpted above most directly reflected which widespread attitude of the 1920s?
    options:
      - "Enthusiasm for a new war against the Soviet Union"
      - "Support for collective military action through the League"
      - "Revulsion against the destruction of the First World War and a hope that war could be outlawed without binding alliances"
      - "Demand for U.S. annexation of European colonies"
    option_explanations:
      - |
        There was no popular demand for war with the Soviet Union.
      - |
        The United States had rejected the League's collective security.
      - |
        Correct. Peace movements were strong after the war, and the pact appealed to Americans precisely because it committed signers to nothing enforceable.
      - |
        No significant movement demanded that the United States annex European colonies.
    answer: 2
    explanation: |
      Skill: contextualization.
  - slug: apush-u07-exam-q15
    type: multiple_choice
    topic_code: "7.11"
    source: "Primary source: General Treaty for Renunciation of War as an Instrument of National Policy (Kellogg–Briand Pact), August 27, 1928, Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "The High Contracting Parties solemnly declare in the names of their respective peoples that they condemn recourse to war for the solution of international controversies, and renounce it, as an instrument of national policy in their relations with one another."

      — Article I, General Treaty for Renunciation of War (Kellogg–Briand Pact), signed at Paris, August 27, 1928
    prompt: |
      The main weakness of the treaty, revealed in the 1930s, was that it
    options:
      - "was rejected by the U.S. Senate"
      - "required the United States to join the League of Nations"
      - "banned the United States from trading with Britain"
      - "had no means of enforcement, so signers such as Japan, Italy and Germany could ignore it"
    option_explanations:
      - |
        The Senate ratified it by a vote of 85–1 in January 1929; rejection was not the problem.
      - |
        It created no organization and required no membership, so it could not draw the nation into the League.
      - |
        The pact said nothing about trade; its subject was the renunciation of war.
      - |
        Correct. Japan in Manchuria (1931), Italy in Ethiopia (1935) and Germany in Europe all broke its promise without penalty.
    answer: 3
    explanation: |
      Skill: causation (effects and limits).
  - slug: apush-u07-exam-q16
    type: multiple_choice
    topic_code: "7.14"
    source: "Primary source: General Treaty for Renunciation of War as an Instrument of National Policy (Kellogg–Briand Pact), August 27, 1928, Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "The High Contracting Parties solemnly declare in the names of their respective peoples that they condemn recourse to war for the solution of international controversies, and renounce it, as an instrument of national policy in their relations with one another."

      — Article I, General Treaty for Renunciation of War (Kellogg–Briand Pact), signed at Paris, August 27, 1928
    prompt: |
      Compared with the treaty in the excerpt, the United Nations Charter of 1945 differed most in that it
    options:
      - "renounced war as an instrument of national policy"
      - "was not signed by the United States"
      - "created a Security Council with power to authorise action against aggressors"
      - "applied only to European nations"
    option_explanations:
      - |
        Renouncing aggressive war was common to both, so it is not the difference.
      - |
        The United States signed and the Senate ratified the Charter.
      - |
        Correct. The UN added machinery (the Security Council, with five permanent members holding vetoes) that the pact had lacked.
      - |
        The UN was global from the start, with members from every continent.
    answer: 2
    explanation: |
      Skill: comparison (7.11 and 7.14).

  # ---- Set 6: the Platt Amendment (7.3, 7.11, 4.4)
  - slug: apush-u07-exam-q17
    type: multiple_choice
    topic_code: "7.3"
    source: "Primary source: Platt Amendment (1901; treaty 1903), National Archives, Milestone Documents"
    points: 1
    stimulus: |
      "III. That the government of Cuba consents that the United States may exercise the right to intervene for the preservation of Cuban independence, the maintenance of a government adequate for the protection of life, property, and individual liberty ...

      VII. That to enable the United States to maintain the independence of Cuba, and to protect the people thereof, as well as for its own defense, the government of Cuba will sell or lease to the United States lands necessary for coaling or naval stations ..."

      — Platt Amendment, attached to the Army Appropriations Act of 1901 and written into a U.S.–Cuban treaty of 1903
    prompt: |
      The provisions in the excerpt most directly modified the promise made in
    options:
      - "the Roosevelt Corollary"
      - "the Teller Amendment of 1898, which pledged that the United States would not annex Cuba"
      - "the Treaty of Guadalupe Hidalgo"
      - "the Open Door notes"
    option_explanations:
      - |
        The Roosevelt Corollary came in 1904, after the Platt Amendment.
      - |
        Correct. Cuba was not annexed, as Teller promised, but its independence was limited by a U.S. right to intervene and a naval base.
      - |
        Guadalupe Hidalgo (1848) ended the Mexican–American War.
      - |
        The Open Door notes concerned equal trading rights in China, not Cuba.
    answer: 1
    explanation: |
      Skill: continuity and change.
