      — President Woodrow Wilson, address to Congress, January 8, 1918
    prompt: |
      Opponents of the Treaty of Versailles in the Senate objected most strongly to the 'mutual guarantees' in Point XIV because they
    options:
      - "opposed freedom of the seas"
      - "believed such guarantees could commit the United States to war without the consent of Congress"
      - "wanted the United States to annex German colonies"
      - "wanted harsher reparations on Austria-Hungary"
    option_explanations:
      - |
        Freedom of the seas was not the focus of the Senate debate.
      - |
        Correct. Article X of the League Covenant embodied these guarantees; Lodge's reservations insisted that only Congress could commit U.S. forces.
      - |
        Senators did not seek colonies from the treaty; the issue was sovereignty.
      - |
        Reparations were not the core Senate objection.
    answer: 1
    explanation: |
      Skill: causation (why the treaty failed).
  - slug: apush-u07-exam-q09
    type: multiple_choice
    topic_code: "7.14"
    source: "Primary source: Woodrow Wilson, Fourteen Points (January 8, 1918), National Archives, Milestone Documents"
    points: 1
    stimulus: |
      "I. Open covenants of peace, openly arrived at, after which there shall be no private international understandings of any kind but diplomacy shall proceed always frankly and in the public view.

      II. Absolute freedom of navigation upon the seas, outside territorial waters, alike in peace and in war, except as the seas may be closed in whole or in part by international action for the enforcement of international covenants. ...

      XIV. A general association of nations must be formed under specific covenants for the purpose of affording mutual guarantees of political independence and territorial integrity to great and small states alike."

      — President Woodrow Wilson, address to Congress, January 8, 1918
    prompt: |
      The goal in Point XIV was most fully realised by the United States when it
    options:
      - "helped found the United Nations in 1945 with Senate approval"
      - "signed the Kellogg–Briand Pact in 1928"
      - "issued the Stimson Doctrine in 1932"
      - "passed the Neutrality Acts in the 1930s"
    option_explanations:
      - |
        Correct. The UN, approved by the Senate 89–2, was the 'general association of nations' Wilson had wanted, with a veto that answered the concerns of 1919.
      - |
        Kellogg–Briand renounced war but created no organization and no guarantees.
      - |
        The Stimson Doctrine was a unilateral refusal to recognise conquests.
      - |
        The Neutrality Acts moved away from collective security.
    answer: 0
    explanation: |
      Skill: comparison (7.5 and 7.14; topic 7.15).
  - slug: apush-u07-exam-q10
    type: multiple_choice
    topic_code: "3.10"
    source: "Primary source: Woodrow Wilson, Fourteen Points (January 8, 1918), National Archives, Milestone Documents"
    points: 1
    stimulus: |
      "I. Open covenants of peace, openly arrived at, after which there shall be no private international understandings of any kind but diplomacy shall proceed always frankly and in the public view.

      II. Absolute freedom of navigation upon the seas, outside territorial waters, alike in peace and in war, except as the seas may be closed in whole or in part by international action for the enforcement of international covenants. ...

      XIV. A general association of nations must be formed under specific covenants for the purpose of affording mutual guarantees of political independence and territorial integrity to great and small states alike."

      — President Woodrow Wilson, address to Congress, January 8, 1918
    prompt: |
      Review. Wilson's proposal in Point XIV departed most sharply from the foreign policy advice of
    options:
      - "the Seneca Falls Declaration"
      - "George Washington's Farewell Address, which warned against permanent alliances"
      - "Thomas Paine's Common Sense, which urged independence from Britain"
      - "the Emancipation Proclamation"
    option_explanations:
      - |
        Seneca Falls concerned women's rights, not foreign policy.
      - |
        Correct. Washington urged the nation to avoid permanent alliances; a league with mutual guarantees was a permanent commitment, which is why critics invoked Washington in 1919.
      - |
        Paine argued for independence and trade with all nations, but his pamphlet is not a statement on alliances in the way the Farewell Address is.
      - |
        The Emancipation Proclamation was a wartime measure on slavery.
    answer: 1
    explanation: |
      Skill: continuity and change across periods (3.10 to 7.5).

  # ---- Set 4: Harding, 1920 (7.8, 7.7, 7.11)
  - slug: apush-u07-exam-q11
    type: multiple_choice
    topic_code: "7.8"
    source: "Primary source: Warren G. Harding, \"Readjustment\" (1920), Nation's Forum recording, Library of Congress"
    points: 1
    stimulus: |
      "America's present need is not heroics but healing; not nostrums but normalcy; not revolution but restoration; not agitation but adjustment; not surgery but serenity; not the dramatic but the dispassionate; not experiment but equipoise; not submergence in internationality but sustainment in triumphant nationality."

      — Senator Warren G. Harding, speech recorded in 1920 (as given in the Library of Congress catalogue record)
    prompt: |
      Harding's call for 'restoration' rather than 'revolution' most directly appealed to voters troubled by
    options:
      - "the attack on Pearl Harbor"
      - "the stock market crash of 1929"
      - "the strikes, bombings and Red Scare of 1919–1920"
      - "the Spanish–American War"
    option_explanations:
      - |
        Pearl Harbor was attacked in 1941, more than two decades after this speech.
      - |
        The stock market crash came in 1929, nine years after this 1920 speech.
      - |
        Correct. Postwar strikes, anarchist bombs and fear of Bolshevism made 'revolution' a vivid word in 1920.
      - |
        The war with Spain was over two decades earlier.
    answer: 2
    explanation: |
      Skill: sourcing (historical situation).
  - slug: apush-u07-exam-q12
    type: multiple_choice
    topic_code: "7.7"
    source: "Primary source: Warren G. Harding, \"Readjustment\" (1920), Nation's Forum recording, Library of Congress"
    points: 1
    stimulus: |
      "America's present need is not heroics but healing; not nostrums but normalcy; not revolution but restoration; not agitation but adjustment; not surgery but serenity; not the dramatic but the dispassionate; not experiment but equipoise; not submergence in internationality but sustainment in triumphant nationality."

      — Senator Warren G. Harding, speech recorded in 1920 (as given in the Library of Congress catalogue record)
    prompt: |
      The source survives as an early sound recording. Which development of the 1920s did most to spread political messages like this one to a mass audience?
    options:
      - "Television networks"
      - "The telegraph"
      - "Commercial radio broadcasting, beginning with KDKA's coverage of the 1920 election"
      - "The penny press"
    option_explanations:
      - |
        Television spread after the Second World War.
      - |
        The telegraph dated from the 1840s and carried messages between offices, not to mass audiences.
      - |
        Correct. Radio stations multiplied in the 1920s and networks formed by 1926–1927, letting politicians speak directly to millions, as Roosevelt later did in his fireside chats.
      - |
        The penny press was a development of the 1830s.
    answer: 2
    explanation: |
      Skill: contextualization (7.7 innovations in communication).
