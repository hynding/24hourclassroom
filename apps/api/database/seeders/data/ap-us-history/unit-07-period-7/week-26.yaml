week: 26
unit: 7
title: "World War II and Postwar Diplomacy"
topics: ["7.11", "7.12", "7.13", "7.14", "7.15"]
guide: guides/week-26.md
guide_description: |
  Interwar diplomacy from the Washington Conference to the Neutrality Acts, the step-by-step move from neutrality to
  Lend-Lease and Pearl Harbor, mobilization and its effects on women, African Americans, Mexican Americans and
  Japanese Americans, the strategy of the war in Europe and the Pacific, the atomic bomb, and the wartime conferences
  that shaped the postwar world. Worked examples: a WWI–WWII comparison, an SAQ on Japanese American incarceration,
  and a thesis weighing the decision to use the atomic bomb.
flashcards_description: |
  34 cards on interwar foreign policy, the road to Pearl Harbor, the home front, the military war, the atomic bomb and
  the wartime conferences, plus comparison cards for Period 7.
flashcards:
  - front: Washington Naval Conference (1921–1922) → Five-Power Treaty ratio
    back: |
      The United States, Britain, Japan, France and Italy agreed to limit battleship tonnage in a ratio of 5:5:3:1.75:1.75
      and to a ten-year halt on building capital ships. Proof that the 'isolationist' 1920s still saw active
      diplomacy, as long as it involved no binding alliance.
    topic_code: "7.11"
  - front: Dawes Plan (1924) → the circle of money
    back: |
      Charles Dawes arranged U.S. loans to Germany and lower reparations payments. American money went to Germany, which
      paid reparations to Britain and France, which repaid war debts to the United States, a circle that broke when
      American lending stopped after 1929.
    topic_code: "7.11"
  - front: Kellogg–Briand Pact (1928) → promise and weakness
    back: |
      Signed by over sixty nations, it condemned 'recourse to war for the solution of international controversies' and
      renounced war 'as an instrument of national policy'. It had no enforcement mechanism, so it could not stop Japan,
      Italy or Germany in the 1930s.
    topic_code: "7.11"
  - front: Stimson Doctrine (1932) → response to Japan in Manchuria
    back: |
      After Japan seized Manchuria in 1931, Secretary of State Henry Stimson announced that the United States would not
      recognise territorial changes made by force. Non-recognition without sanctions: a protest, not a deterrent.
    topic_code: "7.11"
  - front: Good Neighbor policy (1933) → what changed in Latin America
    back: |
      Franklin Roosevelt renounced armed intervention in Latin America, withdrew the Marines from Haiti (1934) and
      abrogated the Platt Amendment (1934). A reversal of the Roosevelt Corollary, aimed at goodwill and trade.
    topic_code: "7.11"
  - front: Nye Committee (1934–1936) → claim and effect
    back: |
      A Senate committee led by Gerald Nye investigated bankers and arms makers ('merchants of death') and suggested
      that profit had drawn the United States into the First World War. Its hearings built support for the Neutrality
      Acts.
    topic_code: "7.11"
  - front: Neutrality Acts (1935–1937) → three provisions
    back: |
      An embargo on arms sales to nations at war, a ban on loans to belligerents, and a prohibition on Americans
      travelling on belligerents' ships. Designed to avoid the 'mistakes' of 1914–1917, they treated victims and
      aggressors alike.
    topic_code: "7.11"
  - front: Quarantine speech (October 1937) → proposal and reaction
    back: |
      After Japan's full-scale invasion of China, Roosevelt suggested that peace-loving nations 'quarantine' aggressors,
      warning that 'war is a contagion'. The isolationist backlash was strong enough that he offered no concrete policy.
    topic_code: "7.11"
  - front: Cash-and-carry (1939) → how it helped Britain
    back: |
      After war began in Europe, Congress allowed belligerents to buy arms if they paid cash and carried them in their own
      ships. Since Britain and France controlled the Atlantic, the rule favoured them while keeping U.S. ships out of
      the war zone.
    topic_code: "7.11"
  - front: Destroyers-for-bases deal (1940) and the first peacetime draft
    back: |
      After France fell, Roosevelt traded fifty old destroyers to Britain for leases on British bases in the Western
      Hemisphere, by executive agreement; Congress passed the Selective Training and Service Act (1940), the first
      peacetime draft.
    topic_code: "7.11"
  - front: America First Committee (1940–1941) → who and argument
    back: |
      The largest isolationist organization, with Charles Lindbergh its best-known speaker. It argued that Britain could
      not win, that aid to Britain would drag the nation into war, and that hemispheric defence was enough. It
      disbanded after Pearl Harbor.
    topic_code: "7.11"
  - front: Four Freedoms (January 1941) → list them
    back: |
      Freedom of speech and expression, freedom of worship, freedom from want and freedom from fear, 'everywhere in the
      world'. Roosevelt's statement of the values the United States would defend, delivered as he asked Congress for
      Lend-Lease.
    topic_code: "7.11"
  - front: Lend-Lease Act (March 1941) → what and why significant
    back: |
      Let the president lend, lease or transfer war supplies to any nation whose defence he judged vital to the United
      States: first Britain, then China and (from late 1941) the Soviet Union. It made the United States the 'arsenal
      of democracy' and ended any pretence of neutrality.
    topic_code: "7.11"
  - front: Atlantic Charter (August 1941) → principles
    back: |
      Roosevelt and Churchill pledged no territorial gains, no territorial changes against the wishes of the peoples
      concerned, self-government for all peoples, freer trade, and a permanent system of general security. It became
      the basis of the United Nations.
    topic_code: "7.14"
  - front: Why Japan attacked Pearl Harbor (December 7, 1941) → cause chain
    back: |
      Japan's war in China and its move into French Indochina led the United States to freeze Japanese assets and embargo
      oil (summer 1941). Facing loss of oil, Japan chose to seize Southeast Asia's resources and struck the U.S.
      Pacific Fleet first. Germany declared war on the United States four days later.
    topic_code: "7.11"
  - front: War Production Board and the conversion of industry → scale
    back: |
      Civilian factories converted to tanks, planes and ships; auto plants stopped making cars. U.S. output roughly
      doubled during the war, unemployment practically vanished, and cost-plus contracts tied big business to
      government, forming the core of what was later called the military-industrial complex.
    topic_code: "7.12"
  - front: Office of Price Administration (1941–1946) → what it did
    back: |
      Set price controls and ran rationing of sugar, coffee, meat, gasoline and tires through ration books, while the
      government urged victory gardens, scrap drives and war bonds. A far more coercive home front than in 1917–1918.
    topic_code: "7.12"
  - front: '"Rosie the Riveter" → women in the wartime workforce'
    back: |
      Millions of women took industrial jobs, many in shipyards and aircraft plants, and others joined the armed forces
      in auxiliary units. Most were pushed out of industrial work when men returned, but the war changed expectations
      about married women working.
    topic_code: "7.12"
  - front: A. Philip Randolph's March on Washington Movement → Executive Order 8802 (1941)
    back: |
      Randolph, head of the Brotherhood of Sleeping Car Porters, threatened a mass march on Washington. Roosevelt issued
      Executive Order 8802 banning discrimination in defense industries and government by race, creed, color or
      national origin and set up the Fair Employment Practices Committee; the march was called off.
    topic_code: "7.12"
  - front: Double V campaign (1942) → meaning
    back: |
      Launched by the Pittsburgh Courier, a Black newspaper: victory over fascism abroad and over racism at home. NAACP
      membership grew several-fold during the war, and the Congress of Racial Equality (1942) began sit-ins in the North.
    topic_code: "7.12"
  - front: Tuskegee Airmen and the segregated military → significance
    back: |
      About a million African Americans served, in segregated units; the Tuskegee Airmen, Black fighter pilots, escorted
      bombers over Europe with a strong record. Their service fed postwar demands that led Truman to desegregate the
      armed forces in 1948.
    topic_code: "7.12"
  - front: Bracero Program (1942) → what and why
    back: |
      A U.S.–Mexico agreement bringing Mexican workers on temporary contracts to fill wartime farm and railroad labor
      shortages. Braceros often faced poor conditions and wage cheating. It lasted, in later forms, until 1964.
    topic_code: "7.12"
  - front: Zoot Suit Riots (1943) → what happened
    back: |
      In Los Angeles, white servicemen attacked young Mexican Americans wearing zoot suits, which critics saw as
      unpatriotic in a time of fabric rationing; police arrested the victims. A sign that wartime migration and
      prejudice produced violence in the West as in Detroit's race riot the same summer.
    topic_code: "7.12"
  - front: Executive Order 9066 (February 1942) → what it authorised and who it affected
    back: |
      It authorised the military to exclude 'any or all persons' from designated areas. Though it named no group, it was
      used to remove about 120,000 people of Japanese ancestry from the West Coast, roughly two-thirds of them U.S.
      citizens, to inland camps. No comparable mass removal occurred in Hawaii.
    topic_code: "7.12"
  - front: Korematsu v. United States (1944) → ruling, dissent and later reckoning
    back: |
      The Court upheld the exclusion order 6–3 as a military necessity. Justice Murphy's dissent said it fell 'into the
      ugly abyss of racism'. Congress apologised and paid $20,000 to each surviving internee in the Civil Liberties Act
      of 1988, and the Court repudiated Korematsu in 2018.
    topic_code: "7.12"
  - front: Navajo code talkers → contribution
    back: |
      Navajo Marines used their language to send coded messages in the Pacific that Japan never broke. More than 40,000
      American Indians served in the armed forces, and many more left reservations for war work, speeding
      urbanisation.
    topic_code: "7.12"
  - front: Europe first → the Allied strategy and its sequence
    back: |
      The United States and Britain agreed to defeat Germany first: North Africa (1942), Sicily and Italy (1943), the
      Normandy landings on D-Day (June 6, 1944) and the advance into Germany, while the Soviet Union bore most of the
      land war. Germany surrendered on May 8, 1945.
    topic_code: "7.13"
  - front: Battle of Midway (June 1942) → why it was the Pacific turning point
    back: |
      Having broken Japanese naval codes, the U.S. Navy ambushed Japan's fleet and sank four aircraft carriers, ending
      Japan's offensive power in the Pacific six months after Pearl Harbor.
    topic_code: "7.13"
  - front: Island hopping → the Pacific strategy
    back: |
      Rather than take every Japanese-held island, U.S. forces seized selected ones (Guadalcanal, the Marianas, Iwo Jima,
      Okinawa) to build airfields within bombing range of Japan, bypassing strongholds. Losses on Iwo Jima and Okinawa
      shaped estimates of an invasion's cost.
    topic_code: "7.13"
  - front: Manhattan Project → Hiroshima and Nagasaki (August 1945)
    back: |
      A secret program that built the atomic bomb, tested in New Mexico in July 1945. Bombs destroyed Hiroshima (August 6)
      and Nagasaki (August 9), killing well over 100,000 people by the end of 1945; the Soviet Union entered the Pacific
      war on August 8; Japan announced its surrender on August 15.
    topic_code: "7.13"
  - front: The decision to use the atomic bomb → arguments on both sides
    back: |
      For: to end the war quickly and avoid an invasion expected to cost very heavy casualties, after the toll of Iwo Jima
      and Okinawa. Against or complicating: Japan was near defeat, a demonstration or clearer terms on the emperor might
      have worked, and impressing the Soviet Union may have been a motive. Historians still debate it.
    topic_code: "7.13"
  - front: Yalta Conference (February 1945) → three agreements
    back: |
      Roosevelt, Churchill and Stalin agreed on dividing Germany into occupation zones, the Soviet Union's entry into the
      war against Japan within three months of Germany's defeat, and a United Nations conference; Stalin promised free
      elections in Eastern Europe, a promise he broke.
    topic_code: "7.14"
  - front: United Nations (1945) → structure and the contrast with 1919
    back: |
      Founded at San Francisco, with a Security Council on which five permanent members (the United States, the Soviet
      Union, Britain, France and China) hold a veto. The Senate approved the Charter 89–2, the reverse of its rejection
      of the League.
    topic_code: "7.14"
  - front: Compare the WWI and WWII home fronts → two similarities, two differences
    back: |
      Similar: federal economic agencies expanded; civil liberties were restricted in the name of security. Different:
      WWII used compulsory rationing and price controls rather than mostly voluntary campaigns, and it removed an entire
      ethnic group (Japanese Americans) rather than prosecuting individual dissenters.
    topic_code: "7.15"
quiz:
  description: |
    25 questions · about 35 minutes · about 68% this week (interwar diplomacy, the road to war, the home front, the
    military war and postwar diplomacy) and 32% review of weeks 23 and 25 (the First World War, the treaty fight, the
    wartime limits on speech and the Depression). Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long essay are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Set A: the Quarantine speech (7.11, 7.5, 7.11)
    - slug: apush-u07-w26-q01
      type: multiple_choice
      topic_code: "7.11"
      source: "Primary source: Franklin D. Roosevelt, Quarantine Speech, October 5, 1937, Miller Center"
      points: 1
      stimulus: |
        "It seems to be unfortunately true that the epidemic of world lawlessness is spreading. When an epidemic of physical disease starts to spread, the community approves and joins in a quarantine of the patients in order to protect the health of the community against the spread of the disease. ... War is a contagion, whether it be declared or undeclared."

        — President Franklin D. Roosevelt, speech in Chicago, October 5, 1937
      prompt: |
        The "epidemic of world lawlessness" Roosevelt described most directly refers to
      options:
        - "the collapse of the League of Nations' headquarters in Geneva"
        - "the Russian Revolution and the spread of communism in Europe"
        - "aggression by Japan in China, Italy in Ethiopia and Germany in Europe"
        - "the wave of strikes in American industry"
      option_explanations:
        - |
          The League's buildings did not collapse; its failure to stop aggression is the context, not a literal event.
        - |
          Roosevelt had recognised the Soviet Union in 1933; the speech targeted aggressive expansion, not revolution.
        - |
          Correct. Japan had invaded China that summer (after seizing Manchuria in 1931), Italy had conquered Ethiopia (1935–1936), and Germany had remilitarised the Rhineland (1936) while Germany and Italy intervened in Spain's civil war.
        - |
          The 1937 sit-down strikes were a domestic matter; the speech concerns international aggression.
      answer: 2
      explanation: |
        Skill: contextualization. 'Undeclared' war is a pointed reference to Japan's war in China, which Japan called an 'incident'.
    - slug: apush-u07-w26-q02
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary source: Franklin D. Roosevelt, Quarantine Speech, October 5, 1937, Miller Center"
      points: 1
      stimulus: |
        "It seems to be unfortunately true that the epidemic of world lawlessness is spreading. When an epidemic of physical disease starts to spread, the community approves and joins in a quarantine of the patients in order to protect the health of the community against the spread of the disease. ... War is a contagion, whether it be declared or undeclared."

        — President Franklin D. Roosevelt, speech in Chicago, October 5, 1937
      prompt: |
        Review. The hostile public reaction to the speech in 1937 is best explained by Americans' memory of
      options:
        - "the success of the League of Nations, which Americans had joined in 1920"
        - "the Spanish–American War, which had ended in defeat"
        - "the First World War, which many had come to see as a costly mistake driven by bankers and arms makers"
        - "the Mexican–American War, which had produced no territory"
      option_explanations:
        - |
          The United States never joined the League; the Senate rejected the Treaty of Versailles.
        - |
          The United States won the war with Spain decisively in 1898.
        - |
          Correct. Disillusion with the war, the failure of Wilson's peace and the Nye Committee's 'merchants of death' hearings had made most Americans determined not to repeat 1917.
        - |
          The Mexican–American War gained the United States a vast territory, the Mexican Cession.
      answer: 2
      explanation: |
        Skill: continuity and causation across weeks. 1930s isolationism grew out of the experience and memory of 1917–1920.
    - slug: apush-u07-w26-q03
      type: multiple_choice
      topic_code: "7.11"
      source: "Primary source: Franklin D. Roosevelt, Quarantine Speech, October 5, 1937, Miller Center"
      points: 1
      stimulus: |
        "It seems to be unfortunately true that the epidemic of world lawlessness is spreading. When an epidemic of physical disease starts to spread, the community approves and joins in a quarantine of the patients in order to protect the health of the community against the spread of the disease. ... War is a contagion, whether it be declared or undeclared."

        — President Franklin D. Roosevelt, speech in Chicago, October 5, 1937
      prompt: |
        Roosevelt's idea of a 'quarantine' implicitly challenged which feature of U.S. law in 1937?
      options:
        - "The Lend-Lease Act"
        - "The Good Neighbor policy"
        - "The Neutrality Acts, which required the same arms embargo against aggressors and their victims"
        - "The Selective Service Act of 1917"
      option_explanations:
        - |
          Lend-Lease passed in 1941, four years later, and itself overturned the neutrality laws' logic.
        - |
          The Good Neighbor policy concerned Latin America and was Roosevelt's own policy.
        - |
          Correct. The Neutrality Acts of 1935–1937 barred arms sales and loans to all belligerents equally, so the United States could not single out aggressors as the speech suggested.
        - |
          The 1917 draft had long since expired; a new draft came in 1940.
      answer: 2
      explanation: |
        Skill: making connections between a source and policy. Roosevelt was testing opinion against laws he had signed.

    # ---- Set B: the Four Freedoms and the Atlantic Charter (7.11, 7.14, 7.5)
    - slug: apush-u07-w26-q04
      type: multiple_choice
      topic_code: "7.11"
      source: "Primary sources: Franklin D. Roosevelt, Annual Message to Congress, January 6, 1941, National Archives, Milestone Documents; Atlantic Charter, August 14, 1941, Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        Source 1: "In the future days, which we seek to make secure, we look forward to a world founded upon four essential human freedoms. The first is freedom of speech and expression—everywhere in the world. The second is freedom of every person to worship God in his own way—everywhere in the world. The third is freedom from want ... The fourth is freedom from fear ..."

        — President Franklin D. Roosevelt, Annual Message to Congress, January 6, 1941

        Source 2: "First, their countries seek no aggrandizement, territorial or other; Second, they desire to see no territorial changes that do not accord with the freely expressed wishes of the peoples concerned; Third, they respect the right of all peoples to choose the form of government under which they will live ..."

        — Atlantic Charter, joint declaration of President Roosevelt and Prime Minister Winston Churchill, August 14, 1941
      prompt: |
        In the same message as Source 1, Roosevelt asked Congress to approve which policy?
      options:
        - "A programme to supply Britain and other nations fighting the Axis with weapons and goods without immediate payment"
        - "The internment of German and Italian nationals"
        - "A declaration of war on Germany"
        - "U.S. membership in the League of Nations"
      option_explanations:
        - |
          Correct. The message set out the case for what became the Lend-Lease Act (March 1941), since Britain was running out of cash under cash-and-carry.
        - |
          The message concerned aid abroad and principles, not internment.
        - |
          Roosevelt did not seek war in January 1941; Congress declared war only after Pearl Harbor.
        - |
          The League was moribund; the United States never applied to join.
      answer: 0
      explanation: |
        Skill: sourcing (purpose). The Four Freedoms gave moral purpose to a practical request: aid to Britain.
    - slug: apush-u07-w26-q05
      type: multiple_choice
      topic_code: "7.14"
      source: "Primary sources: Franklin D. Roosevelt, Annual Message to Congress, January 6, 1941, National Archives, Milestone Documents; Atlantic Charter, August 14, 1941, Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        Source 1: "In the future days, which we seek to make secure, we look forward to a world founded upon four essential human freedoms. The first is freedom of speech and expression—everywhere in the world. The second is freedom of every person to worship God in his own way—everywhere in the world. The third is freedom from want ... The fourth is freedom from fear ..."

        — President Franklin D. Roosevelt, Annual Message to Congress, January 6, 1941

        Source 2: "First, their countries seek no aggrandizement, territorial or other; Second, they desire to see no territorial changes that do not accord with the freely expressed wishes of the peoples concerned; Third, they respect the right of all peoples to choose the form of government under which they will live ..."

        — Atlantic Charter, joint declaration of President Roosevelt and Prime Minister Winston Churchill, August 14, 1941
      prompt: |
        The principles in Source 2 most directly contributed to which postwar development?
      options:
        - "A U.S. return to the Neutrality Acts"
        - "The restoration of the Platt Amendment"
        - "The annexation of former Japanese colonies by the United States as states"
        - "The founding of the United Nations in 1945"
      option_explanations:
        - |
          The United States did not return to neutrality; it led the UN and later NATO.
        - |
          The Platt Amendment had been abrogated in 1934 and was not restored.
        - |
          The United States took trust territories in the Pacific under UN supervision; none became states.
        - |
          Correct. The Atlantic Charter's call for self-determination and a system of general security was endorsed by the 'United Nations' alliance in January 1942 and became the foundation of the UN Charter.
      answer: 3
      explanation: |
        Skill: causation. Wartime statements of aims shaped the postwar order.
    - slug: apush-u07-w26-q06
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary sources: Franklin D. Roosevelt, Annual Message to Congress, January 6, 1941, National Archives, Milestone Documents; Atlantic Charter, August 14, 1941, Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        Source 1: "In the future days, which we seek to make secure, we look forward to a world founded upon four essential human freedoms. The first is freedom of speech and expression—everywhere in the world. The second is freedom of every person to worship God in his own way—everywhere in the world. The third is freedom from want ... The fourth is freedom from fear ..."

        — President Franklin D. Roosevelt, Annual Message to Congress, January 6, 1941

        Source 2: "First, their countries seek no aggrandizement, territorial or other; Second, they desire to see no territorial changes that do not accord with the freely expressed wishes of the peoples concerned; Third, they respect the right of all peoples to choose the form of government under which they will live ..."

        — Atlantic Charter, joint declaration of President Roosevelt and Prime Minister Winston Churchill, August 14, 1941
      prompt: |
        Review. The principles in Source 2 most closely resemble those of
      options:
        - "the Platt Amendment"
        - "the Zimmermann Telegram"
        - "Woodrow Wilson's Fourteen Points, especially national self-determination and a general association of nations"
        - "the Roosevelt Corollary to the Monroe Doctrine"
      option_explanations:
        - |
          The Platt Amendment limited Cuban sovereignty, contradicting the Charter's principles.
        - |
          The Zimmermann Telegram offered Mexico U.S. territory, a territorial grab.
        - |
          Correct. Roosevelt, who had served in Wilson's administration, revived Wilsonian aims (no annexations, self-determination, collective security) while trying to avoid Wilson's political mistakes.
        - |
          The Corollary claimed a right to intervene in other nations, the opposite of respecting their choice of government.
      answer: 2
      explanation: |
        Skill: comparison across the period (7.15). Wilsonian internationalism, defeated in 1919, shaped the Allied aims of 1941.

    # ---- Set C: Executive Order 9066 and Korematsu (7.12, 7.12, 7.6)
    - slug: apush-u07-w26-q07
      type: multiple_choice
      topic_code: "7.12"
      source: "Primary sources: Executive Order 9066 (1942), National Archives, Milestone Documents; Korematsu v. United States, 323 U.S. 214 (1944), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: |
        Source 1: "I hereby authorize and direct the Secretary of War and the Military Commanders whom he may from time to time designate, whenever he or any designated Commander deems such action necessary or desirable, to prescribe military areas in such places and of such extent as he or the appropriate Military Commander may determine, from which any or all persons may be excluded ..."

        — President Franklin D. Roosevelt, Executive Order 9066, February 19, 1942

        Source 2: "Korematsu was not excluded from the Military Area because of hostility to him or his race." — Justice Hugo Black, opinion of the Court

        "Such exclusion goes over "the very brink of constitutional power," and falls into the ugly abyss of racism." — Justice Frank Murphy, dissenting

        — Korematsu v. United States, December 18, 1944
      prompt: |
        Although Source 1 names no ethnic group, it was used primarily to
      options:
        - "intern all German Americans living on the East Coast"
        - "deport Mexican American farmworkers"
        - "evacuate the population of Hawaii after Pearl Harbor"
        - "remove about 120,000 people of Japanese ancestry, most of them U.S. citizens, from the West Coast to inland camps"
      option_explanations:
        - |
          Some German and Italian nationals were interned individually, but there was no mass removal of German Americans.
        - |
          Wartime policy brought Mexican workers in (the Bracero Program) rather than deporting them.
        - |
          Hawaii, where Japanese Americans were over a third of the population and essential to the economy, saw no mass removal.
        - |
          Correct. Roughly two-thirds of those removed were American-born citizens; they lost homes, farms and businesses and spent years behind barbed wire.
      answer: 3
      explanation: |
        Skill: sourcing. A neutral text can serve a targeted purpose; read the order against how it was applied.
    - slug: apush-u07-w26-q08
      type: multiple_choice
      topic_code: "7.12"
      source: "Primary sources: Executive Order 9066 (1942), National Archives, Milestone Documents; Korematsu v. United States, 323 U.S. 214 (1944), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: |
        Source 1: "I hereby authorize and direct the Secretary of War and the Military Commanders whom he may from time to time designate, whenever he or any designated Commander deems such action necessary or desirable, to prescribe military areas in such places and of such extent as he or the appropriate Military Commander may determine, from which any or all persons may be excluded ..."

        — President Franklin D. Roosevelt, Executive Order 9066, February 19, 1942

        Source 2: "Korematsu was not excluded from the Military Area because of hostility to him or his race." — Justice Hugo Black, opinion of the Court

        "Such exclusion goes over "the very brink of constitutional power," and falls into the ugly abyss of racism." — Justice Frank Murphy, dissenting

        — Korematsu v. United States, December 18, 1944
      prompt: |
        The disagreement between the two justices in Source 2 is best described as a debate over whether
      options:
        - "Japanese immigrants could become naturalised citizens"
        - "the president could seize defense factories"
        - "the exclusion was justified by military necessity or was a product of racial prejudice"
        - "Congress had the power to declare war on Japan"
      option_explanations:
        - |
          Naturalisation was barred to Japanese immigrants until 1952, but this case concerned a U.S.-born citizen's exclusion.
        - |
          Seizure of factories was a different issue, decided later in the Steel Seizure Case (1952).
        - |
          Correct. Black's majority accepted the military's claim of necessity; Murphy argued there was no evidence of disloyalty and that the order rested on racial assumptions.
        - |
          The declaration of war was not in dispute.
      answer: 2
      explanation: |
        Skill: argumentation (identifying the claim and counterclaim). In the Civil Liberties Act of 1988 Congress concluded that the incarceration had been driven largely by racial prejudice, wartime hysteria and a failure of political leadership.
    - slug: apush-u07-w26-q09
      type: multiple_choice
      topic_code: "7.6"
      source: "Primary sources: Executive Order 9066 (1942), National Archives, Milestone Documents; Korematsu v. United States, 323 U.S. 214 (1944), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: |
        Source 1: "I hereby authorize and direct the Secretary of War and the Military Commanders whom he may from time to time designate, whenever he or any designated Commander deems such action necessary or desirable, to prescribe military areas in such places and of such extent as he or the appropriate Military Commander may determine, from which any or all persons may be excluded ..."

        — President Franklin D. Roosevelt, Executive Order 9066, February 19, 1942

        Source 2: "Korematsu was not excluded from the Military Area because of hostility to him or his race." — Justice Hugo Black, opinion of the Court

        "Such exclusion goes over "the very brink of constitutional power," and falls into the ugly abyss of racism." — Justice Frank Murphy, dissenting

        — Korematsu v. United States, December 18, 1944
      prompt: |
        Review. The majority's reasoning in Korematsu is most similar to the reasoning of which First World War-era decision?
      options:
        - "Schenck v. United States (1919), which held that wartime conditions could justify restrictions that would not be allowed in peacetime"
        - "Plessy v. Ferguson (1896)"
        - "Downes v. Bidwell (1901)"
        - "Muller v. Oregon (1908)"
      option_explanations:
        - |
          Correct. In both cases the Court deferred to the government's wartime judgement, accepting limits on rights (speech in 1919, liberty itself in 1944) in the name of security.
        - |
          Plessy upheld segregation, a related question of race, but its reasoning was 'separate but equal', not wartime necessity.
        - |
          Downes concerned the Constitution's application to territories.
        - |
          Muller concerned working hours for women and was not a wartime case.
      answer: 0
      explanation: |
        Skill: comparison (7.15 across 7.6 and 7.12). War has repeatedly narrowed civil liberties, with courts deferring until afterwards.

    # ---- Set D: Truman on Hiroshima (7.13, 7.13, 7.14)
    - slug: apush-u07-w26-q10
      type: multiple_choice
      topic_code: "7.13"
      source: "Primary source: Harry S. Truman, Statement by the President Announcing the Use of the A-Bomb at Hiroshima, August 6, 1945, Harry S. Truman Library"
      points: 1
      stimulus: |
        "Sixteen hours ago an American airplane dropped one bomb on Hiroshima, an important Japanese Army base. ... It is an atomic bomb. It is a harnessing of the basic power of the universe. The force from which the sun draws its power has been loosed against those who brought war to the Far East. ... If they do not now accept our terms they may expect a rain of ruin from the air, the like of which has never been seen on this earth."

        — President Harry S. Truman, statement released August 6, 1945
      prompt: |
        The weapon described in the statement was the product of
      options:
        - "the Manhattan Project, a secret wartime effort involving scientists, the army and industry"
        - "a joint programme with the Soviet Union"
        - "the Tennessee Valley Authority's power research"
        - "research begun after the surrender of Germany"
      option_explanations:
        - |
          Correct. Begun in 1942 partly out of fear that Germany would build a bomb first, it employed well over 100,000 people at sites such as Los Alamos, Oak Ridge and Hanford.
        - |
          The project was kept secret from the Soviet Union, though Soviet spies penetrated it.
        - |
          TVA power did supply Oak Ridge, but the TVA did not develop the bomb.
        - |
          The project began in 1942; the first test was in July 1945, two months after Germany surrendered.
      answer: 0
      explanation: |
        Skill: contextualization. The bomb was the largest example of wartime cooperation among government, science and industry.
    - slug: apush-u07-w26-q11
      type: multiple_choice
      topic_code: "7.13"
      source: "Primary source: Harry S. Truman, Statement by the President Announcing the Use of the A-Bomb at Hiroshima, August 6, 1945, Harry S. Truman Library"
      points: 1
      stimulus: |
        "Sixteen hours ago an American airplane dropped one bomb on Hiroshima, an important Japanese Army base. ... It is an atomic bomb. It is a harnessing of the basic power of the universe. The force from which the sun draws its power has been loosed against those who brought war to the Far East. ... If they do not now accept our terms they may expect a rain of ruin from the air, the like of which has never been seen on this earth."

        — President Harry S. Truman, statement released August 6, 1945
      prompt: |
        Which of the following best explains Truman's description of Hiroshima as "an important Japanese Army base"?
      options:
        - "Truman did not know that Hiroshima was a city."
        - "The statement was intended to justify the attack to the American public and to pressure Japan, presenting the target in military terms."
        - "Hiroshima had no civilian population."
        - "International law at the time required the president to describe all targets as bases."
      option_explanations:
        - |
          Truman and his advisers knew the targets were cities; the target committee chose them partly to show the bomb's power.
        - |
          Correct. Hiroshima did contain a major army headquarters, but the phrase emphasised the military side of a city target for a public audience; the statement's purpose was to justify the attack and threaten more.
        - |
          Hiroshima was a city of several hundred thousand people; most of the dead were civilians.
        - |
          No rule of international law required targets to be described as bases; the wording was a choice.
      answer: 1
      explanation: |
        Skill: sourcing (purpose and audience). Official statements present events in the terms most useful to their authors.
    - slug: apush-u07-w26-q12
      type: multiple_choice
      topic_code: "7.14"
      source: "Primary source: Harry S. Truman, Statement by the President Announcing the Use of the A-Bomb at Hiroshima, August 6, 1945, Harry S. Truman Library"
      points: 1
      stimulus: |
        "Sixteen hours ago an American airplane dropped one bomb on Hiroshima, an important Japanese Army base. ... It is an atomic bomb. It is a harnessing of the basic power of the universe. The force from which the sun draws its power has been loosed against those who brought war to the Far East. ... If they do not now accept our terms they may expect a rain of ruin from the air, the like of which has never been seen on this earth."

        — President Harry S. Truman, statement released August 6, 1945
      prompt: |
        Some historians argue that a further aim of using the bomb was to strengthen the U.S. position in postwar relations with the Soviet Union. Which development of 1945 is most often cited as context for this argument?
      options:
        - "The Soviet Union's alliance with Japan"
        - "Growing disagreement at Yalta and Potsdam over the future of Poland and Eastern Europe"
        - "The Soviet Union's refusal to join the United Nations"
        - "A Soviet attack on U.S. forces in Germany"
      option_explanations:
        - |
          The Soviet Union had a neutrality pact with Japan but declared war on Japan on August 8, 1945, as promised at Yalta.
        - |
          Correct. Stalin's promises of free elections in Eastern Europe were already being broken by mid-1945, and Truman learned of the successful bomb test during the Potsdam Conference.
        - |
          The Soviet Union was a founding member of the UN with a permanent Security Council seat.
        - |
          No such attack happened; U.S. and Soviet forces met peacefully on the Elbe in April 1945.
      answer: 1
      explanation: |
        Skill: contextualization and argumentation. The 'atomic diplomacy' interpretation links the end of the Second World War to the start of the Cold War.

    - slug: apush-u07-w26-q13
      type: multiple_choice
      topic_code: "7.12"
      source: "Primary source: Executive Order 8802 (1941), National Archives, Milestone Documents"
      points: 1
      prompt: |
        "I do hereby reaffirm the policy of the United States that there shall be no discrimination in the employment of workers in defense industries or government because of race, creed, color, or national origin ..." (Executive Order 8802, June 25, 1941)

        Roosevelt issued this order most directly in response to
      options:
        - "a Supreme Court ruling that segregation was unconstitutional"
        - "the attack on Pearl Harbor"
        - "a request from southern governors"
        - "A. Philip Randolph's threat to lead a mass march of African Americans on Washington"
      option_explanations:
        - |
          The Court did not rule segregation unconstitutional until Brown v. Board of Education (1954).
        - |
          The order came in June 1941, six months before Pearl Harbor, as defense production expanded.
        - |
          Southern governors generally opposed federal action against discrimination.
        - |
          Correct. Randolph, leader of the Brotherhood of Sleeping Car Porters, planned a march of tens of thousands; Roosevelt issued the order and created the Fair Employment Practices Committee, and Randolph called off the march.
      answer: 3
      explanation: |
        Skill: causation. Organised African American pressure, using the leverage of the defense emergency, produced the first federal action against job discrimination since Reconstruction.
    - slug: apush-u07-w26-q14
      type: multiple_choice
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best describes the effect of the Second World War on women's work?
      options:
        - "Women's employment fell because of rationing."
        - "The war permanently ended the gap in pay between men and women."
        - "Women were barred from industrial work for the duration of the war."
        - "Millions of women entered industrial and other jobs, though many were pushed out when the war ended and wages remained unequal."
      option_explanations:
        - |
          Rationing affected consumption, not women's employment, which rose.
        - |
          The pay gap persisted; the Equal Pay Act came in 1963.
        - |
          The government actively recruited women into war industries ('Rosie the Riveter').
        - |
          Correct. Women's employment rose sharply, including in shipyards and aircraft plants and in military auxiliaries, but most industrial jobs went back to men in 1945–1946 and pay stayed unequal.
      answer: 3
      explanation: |
        Skill: continuity and change. The war changed opportunities and expectations more than it changed lasting structures.
    - slug: apush-u07-w26-q15
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Compared with the First World War home front, the Second World War home front was different in that the federal government
      options:
        - "relied entirely on voluntary campaigns"
        - "created no propaganda agency"
        - "used compulsory rationing and price controls through the Office of Price Administration"
        - "made no attempt to coordinate industrial production"
      option_explanations:
        - |
          Voluntarism (Hoover's meatless days) characterised the First World War; the Second relied far more on legal controls.
        - |
          The Office of War Information played a role like the First World War's Committee on Public Information.
        - |
          Correct. Ration books for sugar, meat, gasoline and tires and legal price ceilings went far beyond the voluntary campaigns of 1917–1918.
        - |
          The War Production Board coordinated production, as the War Industries Board had in 1917–1918.
      answer: 2
      explanation: |
        Skill: comparison (7.15). Similar tools (production boards, propaganda), different degrees of compulsion.
    - slug: apush-u07-w26-q16
      type: multiple_choice
      topic_code: "7.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which of the following most directly ended the high unemployment that persisted through the New Deal?
      options:
        - "The repeal of Prohibition"
        - "Massive federal spending on defense and war production from 1940 onward, together with the draft"
        - "The Supreme Court's acceptance of the Court-packing plan"
        - "The Fair Labor Standards Act of 1938"
      option_explanations:
        - |
          Repeal (1933) created some jobs and tax revenue, but unemployment stayed high for years afterwards.
        - |
          Correct. Defense orders and the draft drove unemployment from about 15% in 1940 to under 2% by 1944, an enormous demonstration of the effect of government spending.
        - |
          Congress rejected the Court-packing plan.
        - |
          The FLSA set wages and hours; it did not create jobs on a large scale.
      answer: 1
      explanation: |
        Skill: causation across weeks (7.10 to 7.12). Wartime spending did what the New Deal had not dared to do in scale.
    - slug: apush-u07-w26-q17
      type: multi_select
      topic_code: "7.12"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were effects of the Second World War on American society.
