    - slug: apush-u07-w26-q19
      type: true_false
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Like the Treaty of Versailles in 1919–1920, the United Nations Charter was rejected by the U.S. Senate in 1945.
      answer: false
      explanation: |
        False. The Senate approved the UN Charter 89–2 in July 1945. Roosevelt had learned from Wilson's failure: he involved Republicans such as Senator Arthur Vandenberg in planning, and the Security Council veto protected U.S. sovereignty, answering the fear behind the opposition to Article X in 1919. Skill: comparison.
    - slug: apush-u07-w26-q20
      type: true_false
      topic_code: "7.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The unemployment rate in the United States did not fall below 10 percent until 1941, as defense spending increased.
      answer: true
      explanation: |
        True. According to the standard series in Historical Statistics of the United States, unemployment was 14.6% in 1940 and 9.9% in 1941, the first year below 10% since 1930. Skill: analysing data and causation.
    - slug: apush-u07-w26-q21
      type: fill_blank
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      prompt: |
        The ____ Act of March 1941 allowed the president to supply war materials to any nation whose defence he judged vital to the United States, making the nation the "arsenal of democracy."
      answer: ["Lend-Lease", "Lend Lease", "Lend-Lease Act", "Lendlease"]
      explanation: |
        Lend-Lease. It replaced cash-and-carry when Britain ran short of money and, by 1945, had sent tens of billions of dollars of supplies to Britain, the Soviet Union, China and others. Skill: continuity and change (from neutrality to undeclared alliance).
    - slug: apush-u07-w26-q22
      type: fill_blank
      topic_code: "7.6"
      source: "Primary source: Schenck v. United States, 249 U.S. 47 (1919), Justia U.S. Supreme Court Center"
      points: 1
      prompt: |
        Review. In Schenck v. United States (1919), Justice Holmes upheld a conviction under the ____ Act of 1917 for distributing leaflets that urged resistance to the draft.
      answer: ["Espionage"]
      explanation: |
        Espionage. The case set the 'clear and present danger' test, an early example of the wartime deference to government repeated in Korematsu. Skill: comparison.
    - slug: apush-u07-w26-q23
      type: short_answer
      topic_code: "7.12"
      source: "general knowledge"
      points: 3
      stimulus: |
        Description of a non-text source: A photograph taken in Oakland, California, in March 1942 by Dorothea Lange for the War Relocation Authority, a federal agency, shows the storefront of a grocery owned by a Japanese American family. Across the front windows hangs a large hand-painted banner reading "I AM AN AMERICAN". The owner, a U.S. citizen, had put up the sign the day after the attack on Pearl Harbor; when the photograph was taken the store had been closed and the family was awaiting removal under the exclusion orders.
      prompt: |
        Using the source, answer (a), (b) and (c).

        (a) Briefly describe ONE perspective expressed by the sign in the photograph.

        (b) Briefly explain ONE reason the federal government ordered the removal of Japanese Americans from the West Coast in 1942.

        (c) Briefly explain ONE way Japanese Americans responded to or challenged removal and incarceration in the period 1942–1945.
      answer: |
        (a) The sign expresses the owner's insistence on his American citizenship and loyalty, rejecting the assumption that people of Japanese ancestry were enemies after Pearl Harbor.

        (b) After Pearl Harbor, fear of sabotage and invasion, long-standing anti-Asian prejudice on the West Coast (including from farm groups who competed with Japanese American growers), and military leaders' claims of necessity led Roosevelt to sign Executive Order 9066, though there was no evidence of disloyalty.

        (c) Fred Korematsu, Gordon Hirabayashi and Minoru Yasui challenged the orders in court; the Supreme Court upheld them in Korematsu v. United States (1944), but in Ex parte Endo (1944) it ruled that a loyal citizen could not be detained, leading to the closing of the camps. Many young men also served in the army's 442nd Regimental Combat Team.
      explanation: |
        One point per part.

        (a) 1 pt for describing the perspective: assertion of American identity, citizenship or loyalty; protest against suspicion of Japanese Americans. Describing the photograph's appearance only earns zero.

        (b) 1 pt for a reason explained: wartime fear after Pearl Harbor; anti-Asian racism with roots in the Chinese Exclusion Act and the 1924 exclusion; economic competition and pressure from West Coast interest groups; General DeWitt's and other officials' claims of military necessity. Saying only 'because of the war' earns zero.

        (c) 1 pt for a specific response explained: court challenges (Korematsu, Hirabayashi, Yasui, Endo); military service in the 442nd or the Military Intelligence Service; resistance to the draft from the camps (Heart Mountain); protests and the 'loyalty questionnaire' controversy; renunciation of citizenship by some at Tule Lake.

        Skill: sourcing a non-text source (Lange worked for the federal agency running the removal, yet chose an image that questioned it) and causation.
    - slug: apush-u07-w26-q24
      type: short_answer
      topic_code: "7.13"
      source: "general knowledge"
      points: 3
      stimulus: |
        Interpretation A (written for this course): "Truman used the atomic bomb for the reason he gave: to end the war as quickly as possible and save the lives of the Americans who would have died invading Japan. After Iwo Jima and Okinawa, no president could have chosen an invasion over a weapon that might make one unnecessary."

        Interpretation B (written for this course): "Japan was already defeated, blockaded and searching for terms through Moscow. Washington knew this. The bomb was used as much to end the war before the Soviet Union could share in Japan's defeat, and to impress Stalin, as to save American lives."

        Interpretation A reflects the 'orthodox' view; Interpretation B reflects a view associated with 'revisionist' historians from the 1960s on.
      prompt: |
        Using the interpretations, answer (a), (b) and (c).

        (a) Briefly describe ONE major difference between Interpretation A and Interpretation B.

        (b) Briefly explain ONE piece of historical evidence that supports Interpretation A.

        (c) Briefly explain ONE piece of historical evidence that supports Interpretation B.
      answer: |
        (a) A argues that the bomb was used for military reasons, to end the war and avoid a costly invasion, while B argues that Japan was nearly defeated and that diplomatic motives, especially limiting Soviet influence, shaped the decision.

        (b) The battles of Iwo Jima and Okinawa in 1945 cost tens of thousands of American casualties and showed that Japanese forces would fight almost to the last soldier, so planners expected an invasion of the home islands to be extremely costly.

        (c) Intercepted Japanese messages showed Japan seeking Soviet mediation to end the war in July 1945, and the United States used the bombs days before the Soviet Union entered the Pacific war on August 8, as agreed at Yalta, while tensions over Eastern Europe were rising at Potsdam.
      explanation: |
        One point per part.

        (a) 1 pt for a difference in the main argument (military necessity versus diplomatic or anti-Soviet motives; Japan's readiness to surrender). Describing only one interpretation earns zero.

        (b) 1 pt for specific evidence for A: casualties on Iwo Jima and Okinawa; kamikaze attacks; Japan's rejection of the Potsdam Declaration; planned invasion (Operation Downfall) estimates; Japan's continued resistance after Hiroshima until Nagasaki and Soviet entry.

        (c) 1 pt for specific evidence for B: Japanese peace feelers through Moscow known from decoded messages (MAGIC); the timing relative to Soviet entry; Truman's behaviour at Potsdam after the Trinity test; Secretary of State Byrnes's interest in the bomb's diplomatic weight; the possibility of modifying unconditional surrender to protect the emperor (which was in effect allowed after surrender).

        Skill: comparing secondary interpretations and corroborating with evidence.
    - slug: apush-u07-w26-q25
      type: long_answer
      topic_code: "7.15"
      source: "general knowledge"
      points: 6
      prompt: |
        The United States fought in two world wars within a generation. In developing your argument, you might consider the reasons for entering each war, the mobilization of the economy and society, the treatment of civil liberties and minorities, and the peace settlements that followed.

        Evaluate the extent to which U.S. involvement in the Second World War was similar to U.S. involvement in the First World War in the period from 1914 to 1945.
      answer: |
        Thesis: The two wars were similar in how they mobilised the economy and restricted civil liberties at home, but they differed significantly in how the United States entered them and, above all, in their outcomes: after the First World War the nation rejected the League and retreated, while after the Second it led the United Nations and became a permanent world power.

        Context: industrial rise and imperial expansion after 1890; the tradition of non-entanglement.

        Body 1 (similar): neutrality first (1914–1917; 1939–1941); trade and aid to Britain; federal boards (WIB/WPB); propaganda (CPI/OWI); restrictions on liberties (Espionage Act; EO 9066).

        Body 2 (different): direct attack at Pearl Harbor versus submarine warfare; compulsory rationing; scale of mobilization; Japanese American incarceration far beyond 1917–1918 repression.

        Body 3 (different outcome): Senate rejects Versailles; Senate approves UN 89–2; U.S. occupation of Germany and Japan.

        Complexity: Roosevelt learned from Wilson; both wars spurred migration and civil rights demands.
      explanation: |
        Six points, College Board LEQ rubric applied to this prompt.

        Thesis/claim (1): a defensible claim about the extent of similarity, establishing a line of reasoning (e.g. 'similar mobilization and repression, different entry and outcome').

        Contextualization (1): the rise to world power after 1898; the neutrality tradition; the interwar disillusion and Neutrality Acts; the Depression.

        Evidence (2): 1 pt for two specific examples from the two wars (Lusitania, Zimmermann Telegram, Fourteen Points, War Industries Board, CPI, Espionage and Sedition Acts, Schenck, Great Migration, Nineteenth Amendment; Lend-Lease, Atlantic Charter, Pearl Harbor, War Production Board, OPA, EO 8802, EO 9066, Korematsu, Bracero Program, Manhattan Project, Yalta, UN). 2 pts for using evidence from both wars to support the argument about similarity.

        Analysis and reasoning (2): 1 pt for using comparison to frame the argument (explicit similarities and differences). 1 pt for complex understanding: explaining why the outcomes differed (Roosevelt's bipartisan planning, the veto, the scale of the second war); considering multiple groups' experiences (African Americans, women, Japanese Americans, Mexican Americans); connecting to the Cold War.

        Zero for a description of one war only, or two separate narratives with no comparison.
