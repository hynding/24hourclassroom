    - slug: apush-u07-w23-q23
      type: short_answer
      topic_code: "7.6"
      source: "general knowledge"
      points: 3
      stimulus: |
        Description of a non-text source: The first panel of Jacob Lawrence's sequence of paintings The Migration of the Negro (1940–1941) shows a crowd of African American travelers, carrying bags, pressing toward a railroad station's ticket gates. Signs above the gates name northern destinations: Chicago, New York and St. Louis. Lawrence, whose parents had joined the Great Migration, painted the series from interviews, newspapers and library research in Harlem.
      prompt: |
        Using the source, answer (a), (b) and (c).

        (a) Briefly describe ONE historical development the painting depicts.

        (b) Briefly explain ONE cause of the development you described in (a) during the period 1914–1920.

        (c) Briefly explain ONE effect of the development in northern cities in the period 1917–1930.
      answer: |
        (a) The painting depicts the Great Migration, the movement of hundreds of thousands of African Americans from the rural South to northern cities such as Chicago and New York during and after the First World War.

        (b) The war cut off European immigration while war industries expanded, so northern factories needed workers and recruited southern Black labor; the Chicago Defender urged readers to escape Jim Crow, lynching and the boll weevil's devastation of cotton farming.

        (c) In northern cities competition for jobs and housing led to violence, such as the Chicago race riot of 1919, and to segregated neighbourhoods; at the same time concentrated Black communities such as Harlem supported the Harlem Renaissance and new political organizations such as Garvey's UNIA.
      explanation: |
        One point per part.

        (a) 1 pt for describing the Great Migration (or the movement of African Americans from the South to the North/cities). Describing the painting's colours or composition only earns zero.

        (b) 1 pt for a cause explained in the period: wartime labor demand and the halt of European immigration; recruitment by labor agents and the Chicago Defender; Jim Crow laws, disfranchisement, lynching; agricultural crisis (boll weevil, floods). The cause must be explained, not just named.

        (c) 1 pt for a specific effect: race riots in East St. Louis (1917) or Chicago (1919) and the Red Summer; residential segregation and restrictive covenants; the Harlem Renaissance; the growth of Marcus Garvey's UNIA or the NAACP; Black voters' growing influence in northern politics (Oscar De Priest elected to Congress from Chicago in 1928). An effect after 1930 earns zero.

        Skill: sourcing a non-text source (Lawrence painted twenty years after the events, from a migrant family's point of view) and causation.
    - slug: apush-u07-w23-q24
      type: short_answer
      topic_code: "7.5"
      source: "general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course): "The United States did not go to war in 1917 to make the world safe for democracy. It went to war because its economy was bound to the Allies by trade and credit, and because German submarines, attacking that trade, killed Americans. Wilson's idealism was sincere, but it explained the war more than it caused it."

        This interpretation reflects a view associated with the 'revisionist' historians of the 1930s, whose work encouraged the Nye Committee and the Neutrality Acts.
      prompt: |
        Using the interpretation, answer (a), (b) and (c).

        (a) Briefly describe the interpretation's argument about why the United States entered the First World War.

        (b) Briefly explain ONE piece of historical evidence that supports the interpretation.

        (c) Briefly explain ONE piece of historical evidence that challenges the interpretation.
      answer: |
        (a) It argues that economic ties to Britain and France and German submarine attacks on that trade, not democratic ideals, were the real causes of U.S. entry; idealism was the justification.

        (b) Between 1914 and 1917 U.S. exports to the Allies boomed and American banks lent them heavily, while the British blockade cut trade with Germany; Germany's decision to resume unrestricted submarine warfare in 1917 was aimed precisely at that trade.

        (c) The Zimmermann Telegram's proposal that Mexico reconquer the Southwest threatened U.S. security directly, and Wilson's Fourteen Points and fight for the League show that he pursued a democratic peace at great political cost, suggesting ideals shaped policy and not just rhetoric.
      explanation: |
        One point per part.

        (a) 1 pt for describing the argument: economic interests and submarine warfare, not idealism, caused entry. Repeating the quotation without description earns zero.

        (b) 1 pt for specific supporting evidence: trade and loans to the Allies (the Morgan bank's role), the British blockade, unrestricted submarine warfare and the sinking of U.S. merchant ships in March 1917, the Lusitania.

        (c) 1 pt for specific challenging evidence: the Zimmermann Telegram as a security threat; the Russian Revolution enabling a 'democracy versus autocracy' framing; the Fourteen Points and Wilson's League campaign; Wilson's long reluctance and the 1916 slogan, which suggest business pressure did not drive policy.

        Skill: argumentation with a secondary source; recognising the interpretation's historical situation (1930s disillusion).
    - slug: apush-u07-w23-q25
      type: long_answer
      topic_code: "7.5"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1898 and 1920 the United States became more deeply involved in world affairs than at any earlier time. In developing your argument, you might consider expansion in the Pacific and the Caribbean, neutrality and entry into the First World War, the peace settlement, or the Senate's response to it.

        Evaluate the extent to which U.S. participation in the First World War marked a turning point in American foreign policy in the period from 1898 to 1920.
      answer: |
        Thesis: U.S. participation in the First World War marked a turning point in that for the first time the nation sent a mass army to Europe and its president tried to lead a new world order, but it was less of a break than it seemed, because the Senate's rejection of the League restored the tradition of avoiding European commitments while U.S. intervention in the Caribbean continued as before.

        Context: Washington's Farewell Address and the Monroe Doctrine; 1890s expansion (Mahan, Hawaii, 1898).

        Body 1 (before): 1898 colonies, Roosevelt Corollary, interventions in Latin America: assertive but regional.

        Body 2 (turning point): entry in 1917, two million troops in France, Fourteen Points and the League as a global vision; financial power.

        Body 3 (continuity): Senate rejection over Article X; separate peace with Germany; continued occupation of Haiti and Nicaragua.

        Complexity: the war changed the U.S. economy (creditor nation) and the debate itself, setting up 1930s isolationism and the internationalism of 1941–1945.
      explanation: |
        Six points, College Board LEQ rubric applied to this prompt.

        Thesis/claim (1): a defensible claim about the extent to which the war was a turning point, with a line of reasoning (e.g. 'a turning point in scale and ambition, but continuity in the refusal of permanent commitments').

        Contextualization (1): the traditions of Washington's Farewell Address and the Monroe Doctrine; the expansionism of the 1890s; the European alliance system and the outbreak of war in 1914.

        Evidence (2): 1 pt for two specific examples (Spanish–American War, Philippines, Roosevelt Corollary, Panama Canal, dollar diplomacy, Lusitania, Zimmermann Telegram, AEF, Fourteen Points, Treaty of Versailles, Article X, Lodge reservations). 2 pts for using them to support an argument about turning point versus continuity.

        Analysis and reasoning (2): 1 pt for using continuity and change to frame the argument (comparing policy before and after 1917). 1 pt for complex understanding: e.g. distinguishing hemispheric from European policy; explaining why the change was reversed in 1919–1920; considering economic as well as diplomatic change (the United States became the world's leading creditor); multiple perspectives (internationalists, Lodge's reservationists, Irreconcilables).

        Zero for a narrative of the war with no argument about turning point, or evidence outside 1898–1920 used as the core of the argument.
