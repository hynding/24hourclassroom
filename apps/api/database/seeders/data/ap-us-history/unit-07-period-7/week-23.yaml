week: 23
unit: 7
title: "World War I"
topics: ["7.5", "7.6"]
guide: guides/week-23.md
guide_description: |
  Why Wilson's neutrality failed, what the United States contributed to the Allied victory, and why the Senate
  rejected the Treaty of Versailles; then the home front: mobilization, propaganda and the repression of dissent,
  the Great Migration, women's suffrage and the upheavals of 1919. Worked examples: a causation chain from the
  submarine to the war message, an SAQ on the Great Migration, and a comparison of the Sedition Acts of 1798 and 1918.
flashcards_description: |
  31 cards on neutrality and entry into the war, the war in France, the Fourteen Points and the treaty fight, and the
  home front from the War Industries Board to the Red Scare.
flashcards:
  - front: Wilson's neutrality appeal (August 1914) → what he asked of Americans
    back: |
      He asked them to be "impartial in thought as well as in action", partly because the nation's many German, Irish
      and British immigrants might divide over the war. Formal neutrality lasted until April 1917, but trade and
      sympathy tilted strongly toward Britain and France.
    topic_code: "7.5"
  - front: Why U.S. neutrality favoured the Allies → trade, loans and the blockade
    back: |
      Britain's naval blockade cut U.S. trade with Germany while trade and private bank loans to Britain and France
      boomed, so the U.S. economy came to depend on an Allied victory. Shared language, British propaganda and cut
      cables reinforced the tilt.
    topic_code: "7.5"
  - front: Sinking of the Lusitania (May 1915) → toll and consequence
    back: |
      A German U-boat sank the British liner off Ireland; 1,198 people died, 128 of them Americans. Wilson sent stiff
      protests rather than going to war, and Secretary of State Bryan resigned, believing the protests were not
      neutral.
    topic_code: "7.5"
  - front: Sussex pledge (1916) → what Germany promised and when it broke it
    back: |
      After a U-boat attacked the French ferry Sussex, Germany promised not to sink merchant ships without warning.
      It broke the pledge by resuming unrestricted submarine warfare on February 1, 1917, gambling it could starve
      Britain before American troops arrived.
    topic_code: "7.5"
  - front: Election of 1916 → Wilson's slogan and what it reveals
    back: |
      Democrats campaigned on "He kept us out of war", and Wilson narrowly beat Charles Evans Hughes. Five months
      later he asked for war: public opinion favoured staying out until Germany's own actions made that impossible.
    topic_code: "7.5"
  - front: Zimmermann Telegram (January 1917) → proposal and effect
    back: |
      Germany's foreign secretary proposed that if the United States entered the war, Mexico should ally with Germany
      and reconquer Texas, New Mexico and Arizona. Intercepted by British intelligence and published in March 1917, it
      turned western and southwestern opinion toward war.
    topic_code: "7.5"
  - front: Russian Revolution (March 1917) → why it mattered to Wilson's war message
    back: |
      The fall of the tsar removed the most autocratic Allied government, letting Wilson present the war as one of
      democracies against autocracy. The Bolshevik seizure of power in November 1917 and Russia's exit from the war
      later shaped the Fourteen Points and the Red Scare.
    topic_code: "7.5"
  - front: Wilson's war message (April 2, 1917) → the ideal he announced
    back: |
      He asked Congress to declare war on Germany, called submarine warfare "a warfare against mankind", and declared
      "The world must be made safe for democracy", adding that the United States sought no conquest or indemnities.
      Congress declared war on April 6.
    topic_code: "7.5"
  - front: Selective Service Act (1917) → how the army was raised
    back: |
      Conscription rather than volunteers, as in the Civil War but with no right to buy a substitute. Nearly three
      million men were drafted; about 380,000 African Americans served, most in segregated labor units, though some
      Black regiments, such as the 369th 'Harlem Hellfighters', fought under French command.
    topic_code: "7.5"
  - front: American Expeditionary Forces → commander and contribution
    back: |
      Led by General John J. Pershing, who insisted on fighting as a separate American army. Fresh U.S. troops arrived
      in large numbers in 1918, helped stop Germany's spring offensives and fought the Meuse-Argonne offensive, which
      helped force the armistice of November 11, 1918.
    topic_code: "7.5"
  - front: The 1918 influenza pandemic → U.S. toll and link to the war
    back: |
      Roughly 675,000 Americans died, more than in combat in all the century's wars; crowded training camps and troop
      ships spread it. More American soldiers died of disease, much of it influenza, than in battle.
    topic_code: "7.6"
  - front: Fourteen Points (January 1918) → four core principles
    back: |
      Open diplomacy ("open covenants of peace, openly arrived at"), freedom of the seas, lower trade barriers, and a
      general association of nations to guarantee independence. Also: arms reduction and national self-determination
      for the peoples of Austria-Hungary and the Ottoman Empire.
    topic_code: "7.5"
  - front: Treaty of Versailles (1919) → terms Wilson accepted and won
    back: |
      He accepted a war-guilt clause, heavy reparations on Germany and Allied gains of German colonies as mandates;
      he won the League of Nations covenant written into the treaty. Self-determination applied in Europe but not to
      colonial peoples.
    topic_code: "7.5"
  - front: Article X of the League Covenant → why senators objected
    back: |
      Members pledged to preserve each other's territorial integrity against aggression. Critics said it could commit
      the United States to war without a vote of Congress and violated the tradition of avoiding entangling
      alliances.
    topic_code: "7.5"
  - front: Henry Cabot Lodge vs the Irreconcilables → compare the opponents of the treaty
    back: |
      Lodge, chair of the Senate Foreign Relations Committee, would accept the treaty with reservations protecting
      Congress's war power. The Irreconcilables, such as William Borah and Hiram Johnson, rejected it in any form.
      Wilson told Democrats to vote against the Lodge version, so neither version passed.
    topic_code: "7.5"
  - front: Why the Senate rejected the Treaty of Versailles → three causes
    back: |
      Fear that Article X would entangle the nation; Wilson's refusal to compromise with Lodge (and his stroke in
      October 1919, during a speaking tour to rally the public); and partisan resentment that he took no senior
      Republican to Paris. The United States never joined the League.
    topic_code: "7.5"
  - front: War Industries Board (1917–1918) → Bernard Baruch and what it did
    back: |
      A federal agency that set production priorities, allocated raw materials, standardised products and fixed some
      prices, coordinating with business rather than nationalising it. It became a model for the New Deal's NRA and
      the Second World War's agencies.
    topic_code: "7.6"
  - front: Food Administration (1917) → Herbert Hoover's method
    back: |
      Hoover raised food production and cut civilian consumption mainly through voluntary campaigns such as meatless
      and wheatless days, plus guaranteed prices for wheat. It made Hoover famous as an efficient organiser who
      preferred voluntary cooperation to coercion.
    topic_code: "7.6"
  - front: How the United States paid for the First World War
    back: |
      About a third by taxes, including a sharply graduated income tax made possible by the Sixteenth Amendment, and
      the rest by borrowing, much of it through Liberty Bond drives that asked every citizen to lend to the
      government.
    topic_code: "7.6"
  - front: Committee on Public Information (1917) → George Creel and its methods
    back: |
      The government's propaganda agency: posters, films, pamphlets and thousands of 'Four-Minute Men' giving short
      speeches in theaters. It sold the war as a crusade and encouraged suspicion of anything German, which fed
      vigilante attacks on German Americans.
    topic_code: "7.6"
  - front: Espionage Act (1917) and Sedition Act (1918) → what they punished
    back: |
      The Espionage Act punished interfering with the draft or military and let the postmaster bar 'treasonable'
      mail. The Sedition Act made it a crime to use disloyal or abusive language about the government, flag or
      armed forces. Over 2,000 people were prosecuted, many of them socialists and pacifists.
    topic_code: "7.6"
  - front: Schenck v. United States (1919) → test the Court created
    back: |
      Upholding a socialist's conviction for urging resistance to the draft, Justice Holmes wrote that speech can be
      punished when it creates "a clear and present danger" of evils Congress may prevent. In wartime, free speech
      was narrower.
    topic_code: "7.6"
  - front: Eugene V. Debs's Canton speech (1918) → consequence
    back: |
      The Socialist leader was sentenced to ten years under the Espionage Act for a speech criticising the war; the
      Supreme Court upheld the conviction (1919). He ran for president from prison in 1920 and won over 900,000
      votes; Harding commuted his sentence in 1921.
    topic_code: "7.6"
  - front: Great Migration during the First World War → push and pull
    back: |
      Push: Jim Crow, lynching, disfranchisement and the boll weevil's damage to cotton. Pull: war-industry jobs in
      northern cities left open when European immigration stopped, and recruitment by Black newspapers such as the
      Chicago Defender. About half a million African Americans moved north between 1915 and 1920.
    topic_code: "7.6"
  - front: Red Summer and the Chicago race riot (1919) → cause and significance
    back: |
      Competition for jobs and housing and the return of Black veterans demanding respect triggered white mob attacks
      in more than two dozen cities. In Chicago, the drowning of a Black teenager who drifted toward a 'white' beach
      set off a week of violence that killed 38 people.
    topic_code: "7.6"
  - front: Alice Paul vs Carrie Chapman Catt → compare suffrage strategies
    back: |
      Catt's National American Woman Suffrage Association worked state by state and backed the war effort to win
      Wilson's support. Paul's National Woman's Party picketed the White House, and members were jailed and
      force-fed during hunger strikes. Both pressures helped pass the Nineteenth Amendment.
    topic_code: "7.6"
  - front: Nineteenth Amendment (ratified 1920) → wording and why it passed then
    back: |
      "The right of citizens of the United States to vote shall not be denied or abridged by the United States or by
      any State on account of sex." Women's war work strengthened the argument, Wilson endorsed it as a war measure
      in 1918, and Tennessee's ratification in August 1920 completed it.
    topic_code: "7.6"
  - front: First Red Scare and the Palmer Raids (1919–1920) → causes and effects
    back: |
      The Bolshevik Revolution, a wave of strikes in 1919 and anarchist bombings fed fear of radicals. Attorney
      General A. Mitchell Palmer's agents arrested thousands of suspected radicals, mostly immigrants, without
      warrants; hundreds were deported. The panic faded in 1920 but fed the immigration restriction of the 1920s.
    topic_code: "7.6"
  - front: Strikes of 1919 → Seattle, Boston police, steel
    back: |
      Over four million workers struck as wartime price controls ended and inflation soared: a Seattle general strike,
      the Boston police strike and a national steel strike. Employers and newspapers branded them as Bolshevik, and
      most failed, beginning a decade of union decline.
    topic_code: "7.6"
  - front: National War Labor Board (1918) → bargain with unions
    back: |
      It mediated disputes to prevent wartime strikes, pushing employers to accept the eight-hour day and union
      membership in return for no-strike pledges. Union membership grew during the war, then fell sharply in the
      1920s when federal support ended.
    topic_code: "7.6"
  - front: Mexican migration in the 1910s → push and pull
    back: |
      The violence of the Mexican Revolution (from 1910) pushed hundreds of thousands north, and southwestern farms,
      mines and railroads, short of labor during the war, recruited them; Mexicans were exempted from the 1917
      literacy test for farm work. A continuing theme of MIG.
    topic_code: "7.6"
quiz:
  description: |
    25 questions · about 35 minutes · about 68% this week (neutrality, entry, the war and the peace, and the home
    front) and 32% review of Periods 3 and 6 and of week 22 (Washington's Farewell Address, the Alien and Sedition
    Acts, Gilded Age labor conflict, imperialism and the Progressives). Multiple choice, select-all and true/false
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Wilson's neutrality message (7.5, 7.5, 3.10)
    - slug: apush-u07-w23-q01
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary source: Woodrow Wilson, Message to Congress on Neutrality, August 19, 1914, The American Presidency Project"
      points: 1
      stimulus: |
        "The United States must be neutral in fact as well as in name during these days that are to try men's souls. We must be impartial in thought as well as in action, must put a curb upon our sentiments as well as upon every transaction that might be construed as a preference of one party to the struggle before another."

        — President Woodrow Wilson, message to Congress, August 19, 1914
      prompt: |
        Which of the following best explains why Wilson asked Americans to be "impartial in thought" as well as in action?
      options:
        - "He feared that the United States had already promised to fight for Britain."
        - "He believed that Germany had already attacked American shipping."
        - "He planned to ask Congress for a declaration of war within weeks."
        - "He worried that a nation of immigrants from both sides of the conflict might be divided by the war."
      option_explanations:
        - |
          The United States had no alliance with Britain; it had avoided formal alliances since 1800.
        - |
          In August 1914 no U.S. ships had been sunk; the submarine crises began in 1915.
        - |
          Wilson did not ask for war until April 1917 and campaigned in 1916 on having kept the nation out of it.
        - |
          Correct. Millions of German, Austro-Hungarian, Irish and British immigrants and their children lived in the United States; Wilson feared the war would set them against each other.
      answer: 3
      explanation: |
        Skill: sourcing (historical situation and audience). Wilson's audience included a deeply divided immigrant nation.
    - slug: apush-u07-w23-q02
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary source: Woodrow Wilson, Message to Congress on Neutrality, August 19, 1914, The American Presidency Project"
      points: 1
      stimulus: |
        "The United States must be neutral in fact as well as in name during these days that are to try men's souls. We must be impartial in thought as well as in action, must put a curb upon our sentiments as well as upon every transaction that might be construed as a preference of one party to the struggle before another."

        — President Woodrow Wilson, message to Congress, August 19, 1914
      prompt: |
        Which development between 1914 and 1917 most undermined the neutrality Wilson called for?
      options:
        - "The growth of U.S. trade with and private loans to Britain and France, while the British blockade cut trade with Germany"
        - "A U.S. treaty of alliance with Russia signed in 1915"
        - "The U.S. annexation of German colonies in the Pacific"
        - "German financing of the U.S. presidential campaign of 1916"
      option_explanations:
        - |
          Correct. Exports to the Allies boomed and American banks lent them huge sums, so the economy came to depend on an Allied victory; Germany's answer, the submarine, then killed Americans.
        - |
          The United States made no alliance with Russia; when it entered the war in 1917 it called itself an 'associated power', not an ally.
        - |
          The United States annexed no German colonies; Japan and Britain's dominions took Germany's Pacific possessions.
        - |
          There is no evidence of this; Wilson won re-election on the slogan that he had kept the nation out of war.
      answer: 0
      explanation: |
        Skill: causation. Economic ties made strict neutrality impossible and set up the collision with German submarine warfare.
    - slug: apush-u07-w23-q03
      type: multiple_choice
      topic_code: "3.10"
      source: "Primary source: Woodrow Wilson, Message to Congress on Neutrality, August 19, 1914, The American Presidency Project"
      points: 1
      stimulus: |
        "The United States must be neutral in fact as well as in name during these days that are to try men's souls. We must be impartial in thought as well as in action, must put a curb upon our sentiments as well as upon every transaction that might be construed as a preference of one party to the struggle before another."

        — President Woodrow Wilson, message to Congress, August 19, 1914
      prompt: |
        Review. Wilson's position in 1914 most closely echoed which earlier statement of U.S. foreign policy?
      options:
        - "The Emancipation Proclamation's appeal to European opinion"
        - "The Ostend Manifesto's call to acquire Cuba"
        - "George Washington's Farewell Address warning against permanent alliances and foreign entanglements"
        - "The Declaration of Independence's list of grievances against George III"
      option_explanations:
        - |
          The Emancipation Proclamation helped keep Britain and France from recognising the Confederacy, but it is not a neutrality statement.
        - |
          The Ostend Manifesto (1854) urged seizing Cuba from Spain, an expansionist rather than neutral stance.
        - |
          Correct. Washington's 1796 Farewell Address and his 1793 Neutrality Proclamation in the war between Britain and revolutionary France set the tradition of avoiding Europe's quarrels that Wilson invoked.
        - |
          The Declaration justified breaking from Britain; it is not a statement about staying out of foreign wars.
      answer: 2
      explanation: |
        Skill: continuity and change across periods. The neutrality tradition from 1793 to 1914, and its abandonment in 1917, is a classic continuity-and-change frame.

    # ---- Set B: Wilson's war message (7.5, 7.5, 7.2)
    - slug: apush-u07-w23-q04
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary source: Woodrow Wilson, Address to Congress Requesting a Declaration of War Against Germany, April 2, 1917, National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "The present German submarine warfare against commerce is a warfare against mankind. It is a war against all nations. ... Neutrality is no longer feasible or desirable where the peace of the world is involved and the freedom of its peoples, and the menace to that peace and freedom lies in the existence of autocratic governments backed by organized force which is controlled wholly by their will, not by the will of their people. ... The world must be made safe for democracy. Its peace must be planted upon the tested foundations of political liberty. We have no selfish ends to serve. We desire no conquest, no dominion. We seek no indemnities for ourselves, no material compensation for the sacrifices we shall freely make."

        — President Woodrow Wilson, address to Congress, April 2, 1917
      prompt: |
        The most immediate cause of the request in this address was
      options:
        - "the armistice signed by Russia and Germany"
        - "Germany's resumption of unrestricted submarine warfare in February 1917"
        - "the sinking of the Lusitania"
        - "the assassination of Archduke Franz Ferdinand"
      option_explanations:
        - |
          Russia's separate peace with Germany came in March 1918, after the United States had entered the war.
        - |
          Correct. Germany broke the Sussex pledge on February 1, 1917, and U-boats sank several American merchant ships in March; with the Zimmermann Telegram, this ended Wilson's neutrality.
        - |
          The Lusitania was sunk in May 1915, nearly two years earlier; Wilson responded with protests, not war.
        - |
          The assassination (June 1914) started the European war but had nothing directly to do with U.S. entry three years later.
      answer: 1
      explanation: |
        Skill: causation (immediate versus long-term causes). Distinguish the trigger (renewed submarine warfare) from the background (economic ties, the Lusitania, propaganda).
    - slug: apush-u07-w23-q05
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary source: Woodrow Wilson, Address to Congress Requesting a Declaration of War Against Germany, April 2, 1917, National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "The present German submarine warfare against commerce is a warfare against mankind. It is a war against all nations. ... Neutrality is no longer feasible or desirable where the peace of the world is involved and the freedom of its peoples, and the menace to that peace and freedom lies in the existence of autocratic governments backed by organized force which is controlled wholly by their will, not by the will of their people. ... The world must be made safe for democracy. Its peace must be planted upon the tested foundations of political liberty. We have no selfish ends to serve. We desire no conquest, no dominion. We seek no indemnities for ourselves, no material compensation for the sacrifices we shall freely make."

        — President Woodrow Wilson, address to Congress, April 2, 1917
      prompt: |
        The ideas in the address are most consistent with which later statement of Wilson's war aims?
      options:
        - "The Fourteen Points, which called for open diplomacy, self-determination and a league of nations"
        - "The Treaty of Versailles's war-guilt clause and reparations on Germany"
        - "The Roosevelt Corollary's police power in the Western Hemisphere"
        - "The Neutrality Acts of the 1930s"
      option_explanations:
        - |
          Correct. The Fourteen Points (January 1918) turned the address's ideals of democracy and a peace without conquest into a programme.
        - |
          Wilson accepted these terms as the price of the League, but they contradicted his promise of a peace without indemnities.
        - |
          The corollary was Theodore Roosevelt's policy of intervention in the Americas, not a statement of war aims in Europe.
        - |
          The Neutrality Acts were a reaction against U.S. entry into the war, passed long after Wilson.
      answer: 0
      explanation: |
        Skill: making connections. The war message (1917) and the Fourteen Points (1918) express the same 'Wilsonian' idealism.
    - slug: apush-u07-w23-q06
      type: multiple_choice
      topic_code: "7.2"
      source: "Primary source: Woodrow Wilson, Address to Congress Requesting a Declaration of War Against Germany, April 2, 1917, National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "The present German submarine warfare against commerce is a warfare against mankind. It is a war against all nations. ... Neutrality is no longer feasible or desirable where the peace of the world is involved and the freedom of its peoples, and the menace to that peace and freedom lies in the existence of autocratic governments backed by organized force which is controlled wholly by their will, not by the will of their people. ... The world must be made safe for democracy. Its peace must be planted upon the tested foundations of political liberty. We have no selfish ends to serve. We desire no conquest, no dominion. We seek no indemnities for ourselves, no material compensation for the sacrifices we shall freely make."

        — President Woodrow Wilson, address to Congress, April 2, 1917
      prompt: |
        Review. A critic of Wilson in 1917 could most effectively challenge his claim to "desire no conquest, no dominion" by pointing to
      options:
        - "his support for annexing Canada"
        - "his decision to return the Philippines to Spain"
        - "his refusal to send any troops to Europe"
        - "his administration's military interventions in Haiti, the Dominican Republic and Mexico"
      option_explanations:
        - |
          No one in the administration proposed annexing Canada.
        - |
          The Philippines remained a U.S. territory; the Jones Act (1916) promised eventual independence, not return to Spain.
        - |
          The United States sent about two million soldiers to France.
        - |
          Correct. Wilson sent Marines to Haiti (1915) and the Dominican Republic (1916) and troops into Mexico (1914, 1916), extending the interventionist pattern of the Roosevelt Corollary era.
      answer: 3
      explanation: |
        Skill: argumentation (corroboration and qualification) and continuity. Wilson's idealism coexisted with continued intervention in the Caribbean (topic 7.2).

    # ---- Set C: Schenck v. United States (7.6, 7.6, 3.10)
    - slug: apush-u07-w23-q07
      type: multiple_choice
      topic_code: "7.6"
      source: "Primary source: Schenck v. United States, 249 U.S. 47 (1919), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: |
        "The most stringent protection of free speech would not protect a man in falsely shouting fire in a theatre and causing a panic. ... The question in every case is whether the words used are used in such circumstances and are of such a nature as to create a clear and present danger that they will bring about the substantive evils that Congress has a right to prevent. ... When a nation is at war, many things that might be said in time of peace are such a hindrance to its effort that their utterance will not be endured so long as men fight, and that no Court could regard them as protected by any constitutional right."

        — Justice Oliver Wendell Holmes Jr., opinion of the Court, Schenck v. United States, 1919
      prompt: |
        The case excerpted above upheld a conviction under which law?
      options:
        - "The Volstead Act"
        - "The Chinese Exclusion Act"
        - "The Espionage Act of 1917"
        - "The Sherman Antitrust Act"
      option_explanations:
        - |
          The Volstead Act (1919) enforced Prohibition.
        - |
          The Chinese Exclusion Act concerned immigration, not speech.
        - |
          Correct. Charles Schenck, a Socialist Party official, mailed leaflets urging men to resist the draft; he was convicted under the Espionage Act's ban on obstructing recruitment.
        - |
          The Sherman Act concerned monopolies (and was used against unions), not wartime speech.
      answer: 2
      explanation: |
        Skill: contextualization. Wartime laws against obstructing the war effort were tested in the courts after the armistice.
    - slug: apush-u07-w23-q08
      type: multiple_choice
      topic_code: "7.6"
      source: "Primary source: Schenck v. United States, 249 U.S. 47 (1919), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: |
        "The most stringent protection of free speech would not protect a man in falsely shouting fire in a theatre and causing a panic. ... The question in every case is whether the words used are used in such circumstances and are of such a nature as to create a clear and present danger that they will bring about the substantive evils that Congress has a right to prevent. ... When a nation is at war, many things that might be said in time of peace are such a hindrance to its effort that their utterance will not be endured so long as men fight, and that no Court could regard them as protected by any constitutional right."

        — Justice Oliver Wendell Holmes Jr., opinion of the Court, Schenck v. United States, 1919
      prompt: |
        Which of the following was most similar in purpose to the reasoning in the excerpt?
      options:
        - "The Committee on Public Information's campaign to build support for the war and the prosecution of Eugene Debs for an antiwar speech"
        - "The Senate's rejection of the Treaty of Versailles"
        - "The Nineteenth Amendment's extension of the vote to women"
        - "The National War Labor Board's support for the eight-hour day"
      option_explanations:
        - |
          Correct. Like the opinion, these efforts treated wartime unity as more important than dissent; Debs was convicted under the Espionage Act for a 1918 speech and his conviction was upheld in 1919.
        - |
          The treaty fight was about international commitments, not domestic dissent.
        - |
          Suffrage expanded political rights rather than restricting them.
        - |
          The board mediated labor disputes; it concerned working conditions, not speech.
      answer: 0
      explanation: |
        Skill: comparison. Propaganda and prosecution were two sides of the same wartime drive for conformity.
    - slug: apush-u07-w23-q09
      type: multiple_choice
      topic_code: "3.10"
      source: "Primary source: Schenck v. United States, 249 U.S. 47 (1919), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: |
        "The most stringent protection of free speech would not protect a man in falsely shouting fire in a theatre and causing a panic. ... The question in every case is whether the words used are used in such circumstances and are of such a nature as to create a clear and present danger that they will bring about the substantive evils that Congress has a right to prevent. ... When a nation is at war, many things that might be said in time of peace are such a hindrance to its effort that their utterance will not be endured so long as men fight, and that no Court could regard them as protected by any constitutional right."

        — Justice Oliver Wendell Holmes Jr., opinion of the Court, Schenck v. United States, 1919
      prompt: |
        Review. Which earlier episode most closely parallels the restrictions on speech upheld in the excerpt?
      options:
        - "The Homestead Act of 1862"
        - "The Missouri Compromise of 1820"
        - "The Bill of Rights' adoption in 1791"
        - "The Sedition Act of 1798, passed during the undeclared naval war with France"
      option_explanations:
        - |
          The Homestead Act distributed western land.
        - |
          The Missouri Compromise concerned slavery in the territories.
        - |
          The First Amendment guaranteed free speech; it is the right restricted, not a parallel restriction.
        - |
          Correct. In the Quasi-War with France the Federalists made it a crime to publish false or malicious writing against the government; critics, mostly Republicans, were prosecuted, just as wartime critics were in 1917–1919.
      answer: 3
      explanation: |
        Skill: comparison across periods. A recurring pattern: foreign war or the fear of it leads governments to restrict dissent (1798, 1918, and again in 1942 with Japanese American incarceration).

    - slug: apush-u07-w23-q10
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following most directly caused the large movement of African Americans from the South to northern cities between 1915 and 1920?
      options:
        - "A sharp drop in European immigration combined with wartime demand for industrial labor"
        - "New federal laws that guaranteed Black voting rights in the North"
        - "Federal programmes that paid southern farmers to resettle in the North"
        - "The collapse of northern manufacturing after the war ended"
      option_explanations:
        - |
          Correct. War cut immigration from Europe just as factories expanded, and northern employers and the Chicago Defender recruited southern Black workers fleeing Jim Crow and lynching.
        - |
          No new federal voting-rights law passed; northern states already allowed Black men to vote, which mattered, but it was not new.
        - |
          There was no federal resettlement programme; migration was organised through families, churches, newspapers and labor agents.
        - |
          A collapse would have discouraged migration; in fact wartime industry boomed.
      answer: 0
      explanation: |
        Skill: causation (push and pull factors). The Great Migration combines southern push (Jim Crow, violence, boll weevil) and northern pull (jobs).
    - slug: apush-u07-w23-q11
      type: multiple_choice
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which argument did senators who opposed the Treaty of Versailles in 1919 most often make?
      options:
        - "The treaty gave the United States too many colonies."
        - "The treaty was too lenient toward Germany."
        - "Article X of the League Covenant could commit the United States to war without the consent of Congress."
        - "The treaty failed to create any international organization."
      option_explanations:
        - |
          The United States took no colonies under the treaty; German colonies became League mandates of other powers.
        - |
          Some critics thought it harsh or unjust, but leniency was not the main objection in the Senate.
        - |
          Correct. Lodge's reservations aimed above all to protect Congress's power to declare war from Article X's pledge of collective security.
        - |
          The treaty did create the League of Nations; that is what senators objected to.
      answer: 2
      explanation: |
        Skill: causation. Concern for sovereignty and the tradition of non-entanglement, plus Wilson's refusal to compromise, defeated the treaty.
    - slug: apush-u07-w23-q12
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The War Industries Board (1917–1918), which coordinated production by setting priorities and prices in cooperation with business, most resembled which Progressive Era idea?
      options:
        - "Theodore Roosevelt's New Nationalism, which accepted large corporations but called for a strong federal government to regulate them"
        - "Laissez-faire economics as defended by William Graham Sumner"
        - "The Populists' demand for the free coinage of silver"
        - "The Anti-Imperialist League's opposition to a large army"
      option_explanations:
        - |
          Correct. The board worked with big business under federal direction, the partnership New Nationalism imagined; many Progressives saw the war as a chance to apply expert management.
        - |
          Sumner opposed government direction of the economy; the board was the opposite.
        - |
          Free silver concerned the money supply in the 1890s, not production planning.
        - |
          The board served a mass army; it had nothing to do with anti-imperialism.
      answer: 0
      explanation: |
        Skill: making connections. Wartime mobilization extended Progressive faith in expert, federal coordination of the economy (7.4 to 7.6), and became a model for the New Deal.
    - slug: apush-u07-w23-q13
      type: multiple_choice
      topic_code: "7.6"
      source: "Primary source: U.S. Constitution, Nineteenth Amendment (1920), National Archives, Milestone Documents"
      points: 1
      prompt: |
        "The right of citizens of the United States to vote shall not be denied or abridged by the United States or by any State on account of sex." (Nineteenth Amendment, ratified 1920)

        Which of the following most directly helped the amendment win approval when it did?
      options:
        - "The unanimous support of southern legislatures"
        - "A Supreme Court ruling that the Fourteenth Amendment required women's suffrage"
        - "The end of the temperance movement"
        - "Women's contributions to the war effort and Wilson's endorsement of suffrage as a war measure in 1918"
      option_explanations:
        - |
          Most southern legislatures rejected it, fearing federal interference with elections and Black women's votes; Tennessee was the exception that completed ratification.
        - |
          In Minor v. Happersett (1875) the Court ruled the opposite: citizenship did not confer a right to vote.
        - |
          Temperance and suffrage were allies, and Prohibition was ratified in 1919, a year before suffrage.
        - |
          Correct. War work and the contradiction of fighting for democracy abroad while denying it at home strengthened the case; Wilson, pressed by Catt's lobbying and Paul's pickets, endorsed the amendment in 1918.
      answer: 3
      explanation: |
        Skill: causation. Long-term organising met a short-term opening created by the war.
    - slug: apush-u07-w23-q14
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. How did the First World War help the Progressive campaign for national Prohibition?
      options:
        - "Grain conservation and anti-German feeling against brewers gave temperance advocates new arguments, and the Eighteenth Amendment was ratified in 1919."
        - "Soldiers in France were the main supporters of Prohibition."
        - "The war ended all opposition to alcohol among immigrants."
        - "Prohibition was required by the Treaty of Versailles."
      option_explanations:
        - |
          Correct. Saving grain for food and the German names of many brewers (Pabst, Busch) let the Anti-Saloon League present Prohibition as patriotic.
        - |
          Prohibition passed largely while soldiers were away; many returning veterans resented it.
        - |
          Many immigrant communities continued to oppose Prohibition throughout the 1920s.
        - |
          The treaty had nothing to say about alcohol.
      answer: 0
      explanation: |
        Skill: causation and making connections. A long Progressive moral reform (7.4) was completed with the help of wartime conditions (7.6).
    - slug: apush-u07-w23-q15
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The Palmer Raids of 1919–1920 were most directly a response to
      options:
        - "Germany's refusal to sign the armistice"
        - "the Senate's rejection of the League of Nations"
        - "the rise of the Ku Klux Klan in northern states"
        - "fears of radicalism after the Bolshevik Revolution, a wave of strikes and a series of anarchist bombings"
      option_explanations:
        - |
          Germany signed the armistice in November 1918 and the treaty in June 1919.
        - |
          The treaty fight was a separate issue of foreign policy.
        - |
          The Klan's northern growth came in the early 1920s, and the raids targeted leftists, not the Klan.
        - |
          Correct. Attorney General Palmer, whose own house was bombed in 1919, ordered mass arrests of suspected radicals, mostly immigrants, and hundreds were deported.
      answer: 3
      explanation: |
        Skill: contextualization. The First Red Scare grew from postwar fear of revolution and of immigrants.
    - slug: apush-u07-w23-q16
      type: multiple_choice
      topic_code: "6.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The failure of the great strikes of 1919, which employers and newspapers branded as Bolshevik, most resembled the outcome of which Gilded Age conflict?
      options:
        - "The founding of the American Federation of Labor in 1886"
        - "The passage of the Interstate Commerce Act in 1887"
        - "The election of Grover Cleveland in 1884"
        - "The Pullman Strike of 1894, broken by a federal injunction and troops after critics blamed radicals"
      option_explanations:
        - |
          The AFL's founding was an organizing success, not a strike defeat.
        - |
          The Interstate Commerce Act regulated railroads; it was not a labor conflict.
        - |
          The 1884 election was a partisan contest over corruption and the tariff, not a labor conflict.
        - |
          Correct. In both cases government power and public fear of radicalism helped employers defeat large strikes, setting labor back for years.
      answer: 3
      explanation: |
        Skill: continuity and change. Labor's gains depended on government's stance: hostile in 1894 and 1919, briefly supportive during the war (National War Labor Board), supportive again in 1935.
    - slug: apush-u07-w23-q17
      type: multi_select
      topic_code: "7.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select ALL of the following that were features of the American home front during the First World War.
      options:
        - "The Committee on Public Information's propaganda campaign"
        - "Voluntary food conservation organised by Herbert Hoover's Food Administration"
        - "Liberty Bond drives to finance the war"
        - "Mandatory rationing of gasoline and sugar through ration books"
        - "Attacks on German Americans and bans on teaching German in some states"
        - "The removal of all German Americans to internment camps"
      option_explanations:
        - |
          Correct. George Creel's committee produced posters, films and the 'Four-Minute Men'.
        - |
          Correct. 'Meatless Mondays' and 'wheatless Wednesdays' relied on persuasion more than compulsion.
        - |
          Correct. Bond drives raised most of the money the war cost, with celebrities and parades urging every family to buy.
        - |
          Ration books came in the Second World War, run by the Office of Price Administration.
        - |
