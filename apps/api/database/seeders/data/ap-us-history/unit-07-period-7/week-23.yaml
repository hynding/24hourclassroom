      answer: [0, 1, 2, 4]
      explanation: |
        Skill: comparison (WWI versus WWII home fronts). The First World War relied on persuasion and voluntarism more than the Second, but repression of dissent and of German Americans was real.
    - slug: apush-u07-w23-q18
      type: multi_select
      topic_code: "7.5"
      source: "Primary source: Woodrow Wilson, Fourteen Points (January 8, 1918), National Archives, Milestone Documents"
      points: 2
      partial_credit: true
      stimulus: |
        "I. Open covenants of peace, openly arrived at, after which there shall be no private international understandings of any kind but diplomacy shall proceed always frankly and in the public view. ... XIV. A general association of nations must be formed under specific covenants for the purpose of affording mutual guarantees of political independence and territorial integrity to great and small states alike."

        — President Woodrow Wilson, address to Congress, January 8, 1918
      prompt: |
        Select ALL of the following that were among the principles of the Fourteen Points.
      options:
