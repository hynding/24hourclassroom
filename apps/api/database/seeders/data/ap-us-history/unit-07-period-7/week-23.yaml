        - |
          Correct. Point II, a direct answer to the submarine and blockade issues that had drawn the United States into the war.
        - |
          Reparations were imposed by the Treaty of Versailles at the insistence of France and Britain; Wilson had promised a peace without indemnities.
        - |
          Correct. Point XIV, quoted, became the League of Nations.
        - |
