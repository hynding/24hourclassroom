        - "Freedom of navigation on the seas in peace and war"
        - "Heavy reparations paid by Germany to the Allies"
        - "An international organization to guarantee the independence of nations"
        - "Self-determination for the nationalities of Austria-Hungary and the Ottoman Empire"
      option_explanations:
