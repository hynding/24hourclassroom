    - slug: apush-u07-w23-q19
      type: true_false
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      prompt: |
        After a long debate, the Senate ratified the Treaty of Versailles with Henry Cabot Lodge's reservations, and the United States joined the League of Nations in 1920.
      answer: false
      explanation: |
        False. The Senate voted on the treaty in November 1919 and March 1920; it failed each time, because Wilson told Democrats to reject Lodge's reservations and the Irreconcilables opposed it in any form. The United States never joined the League and made a separate peace with Germany in 1921. Skill: causation.
    - slug: apush-u07-w23-q20
      type: true_false
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Philippine–American War that followed the war with Spain was brief and caused far fewer deaths than the Spanish–American War itself.
      answer: false
      explanation: |
        False. The war against Filipino nationalists lasted from 1899 to 1902 (longer in some islands), killed more than 4,000 U.S. soldiers and at least 200,000 Filipinos, far more than the few months of fighting with Spain in 1898. Skill: comparison.
