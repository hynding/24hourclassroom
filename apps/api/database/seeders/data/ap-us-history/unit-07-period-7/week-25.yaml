    - slug: apush-u07-w25-q23
      type: short_answer
      topic_code: "7.10"
      source: "Primary source: Franklin D. Roosevelt, Second Inaugural Address, January 20, 1937, Miller Center"
      points: 3
      stimulus: |
        "I see one-third of a nation ill-housed, ill-clad, ill-nourished. ... The test of our progress is not whether we add more to the abundance of those who have much; it is whether we provide enough for those who have too little."

        — President Franklin D. Roosevelt, Second Inaugural Address, January 20, 1937
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the view of the federal government's responsibility expressed in the excerpt.

        (b) Briefly explain ONE New Deal programme that reflected the view you described in (a).

        (c) Briefly explain ONE way opponents challenged the New Deal in the period 1933–1939.
      answer: |
        (a) Roosevelt argues that the federal government is responsible for the welfare of the poorest Americans and should judge its success by whether it provides enough for those who have too little, not by the gains of the wealthy.

        (b) The Social Security Act of 1935 created old-age pensions, unemployment insurance and aid to dependent children, giving the federal government a permanent role in protecting citizens from poverty in old age and unemployment.

        (c) The American Liberty League argued that the New Deal destroyed property rights and constitutional limits, and the Supreme Court struck down the NRA in Schechter (1935) and the AAA in Butler (1936) as exceeding federal power.
      explanation: |
        One point per part.

        (a) 1 pt for describing the view that the federal government should actively ensure a basic standard of living for the poor (a positive responsibility for welfare). Quoting without explanation earns zero.

        (b) 1 pt for a specific programme explained: Social Security; WPA or CCC (work relief); the Fair Labor Standards Act; the Farm Security Administration; the Housing Act of 1937; the Rural Electrification Administration. The programme must be linked to helping 'those who have too little'.

        (c) 1 pt for a specific challenge explained: the Liberty League; Supreme Court decisions (Schechter, Butler); the Court-packing fight and the conservative coalition of Republicans and southern Democrats after 1938; critics from the left (Long, Coughlin, Townsend) who said it did too little. Either direction earns the point if explained.

        Skill: sourcing (purpose) and contextualization; Roosevelt spoke after his 1936 landslide, as he prepared to confront the Court.
    - slug: apush-u07-w25-q24
      type: short_answer
      topic_code: "7.10"
      source: "general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course): "The New Deal was not a revolution. It saved American capitalism by repairing its banks, propping up its prices and giving workers and the elderly just enough security to keep them loyal. Banks stayed private, factories stayed private, and wealth stayed where it was. What changed was that Washington now accepted responsibility for the economy's health."
      prompt: |
        Using the interpretation, answer (a), (b) and (c).

        (a) Briefly describe the interpretation's argument about the New Deal.

        (b) Briefly explain ONE piece of historical evidence that supports the interpretation.

        (c) Briefly explain ONE piece of historical evidence that challenges the interpretation.
      answer: |
        (a) It argues that the New Deal was essentially conservative: it rescued and stabilised capitalism rather than transforming it, though it made the federal government responsible for the economy.

        (b) The Emergency Banking Act reopened private banks under federal supervision rather than nationalising them, and the AAA and NRA aimed to raise prices and profits for existing farmers and businesses; the distribution of wealth changed little in the 1930s.

        (c) The Wagner Act shifted power toward workers by guaranteeing collective bargaining, and union membership roughly tripled; Social Security created a permanent federal safety net; the TVA was public ownership of electric power. These were significant structural changes, not just repairs.
      explanation: |
        One point per part.

        (a) 1 pt for describing the claim that the New Deal preserved capitalism rather than transforming it (a conservative or limited reform).

        (b) 1 pt for specific supporting evidence explained: Emergency Banking Act; refusal to nationalise banks or industry; AAA and NRA favouring large producers; exclusions from Social Security; the 1937 budget cuts; persistence of high unemployment until wartime.

        (c) 1 pt for specific challenging evidence explained: Wagner Act and the rise of the CIO; Social Security; TVA; FLSA minimum wage; progressive taxation (Revenue Act of 1935); the permanent growth of the federal government; the shift of African American voters; contemporary critics who saw it as radical (the Liberty League).

        Skill: argumentation with a secondary source.
    - slug: apush-u07-w25-q25
      type: long_answer
      topic_code: "7.10"
      source: "general knowledge"
      points: 6
      prompt: |
        Presidents Herbert Hoover and Franklin D. Roosevelt both faced the Great Depression. In developing your argument, you might consider their beliefs about the role of government, their policies toward banks, business, farmers and the unemployed, and the results of their policies.

        Evaluate the relative importance of continuity and change in the federal government's response to the Great Depression from 1929 to 1939.
      answer: |
        Thesis: The federal response changed more than it continued. Hoover went further than earlier presidents (the RFC, public works) but refused direct relief, while Roosevelt accepted federal responsibility for the unemployed, the elderly and workers' rights, creating a permanent welfare and regulatory state; continuity lay in both men's aim of saving private capitalism and in policies, such as aid to banks and a balanced budget in 1937, that Roosevelt shared with his predecessor.

        Context: 1920s business government, laissez-faire tradition, the crash and bank failures.

        Body 1 (continuity): RFC kept and expanded; both aimed to restore business confidence; Roosevelt's 1937 budget cuts.

        Body 2 (change): direct relief (FERA, WPA), FDIC, SEC, Social Security, Wagner Act.

        Body 3 (limits of change): exclusions, segregation, persistent unemployment.

        Complexity: Hoover's activism compared with earlier presidents (Cleveland in 1893).
      explanation: |
        Six points, College Board LEQ rubric applied to this prompt.

        Thesis/claim (1): a defensible claim weighing continuity and change in the federal response, with a line of reasoning. 'Hoover did nothing and Roosevelt did everything' is a weak claim and usually leads to inaccurate evidence; it earns the point only if defensible.

        Contextualization (1): the business-friendly government of the 1920s; laissez-faire and voluntarism; the crash, bank failures and unemployment; the precedent of wartime mobilization.

        Evidence (2): 1 pt for two specific examples (RFC, Hoover Dam, Bonus Army, Smoot–Hawley, bank holiday, Emergency Banking Act, CCC, AAA, NRA, TVA, FDIC, SEC, WPA, Social Security, Wagner Act, FLSA, Court-packing, the 1937 recession). 2 pts for using them to support the argument.

        Analysis and reasoning (2): 1 pt for using continuity and change to frame the argument. 1 pt for complex understanding: e.g. showing both continuity and change; comparing Hoover with earlier presidents to show his own break with tradition; explaining that the New Deal's limits (exclusions, persistent unemployment) qualify the change; using multiple perspectives (Liberty League, Long, the Court).

        Zero for a narrative of New Deal programmes with no comparison to Hoover or argument about continuity and change.
