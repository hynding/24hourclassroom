week: 25
unit: 7
title: "The Great Depression and the New Deal"
topics: ["7.9", "7.10"]
guide: guides/week-25.md
guide_description: |
  Why the crash of 1929 became a decade-long depression, how Hoover's voluntarism and Roosevelt's New Deal answered
  it, and what the New Deal's relief, recovery and reform programmes changed and left out; its critics on the left and
  the right, its fights with the Supreme Court, and its new coalition. Worked examples: reading the unemployment
  series, an SAQ comparing Hoover and Roosevelt, and a DBQ-style sourcing paragraph.
flashcards_description: |
  33 cards on the causes of the Depression, Hoover's response, the First and Second New Deals, labor, the critics and
  the Court, and the New Deal's effects on women, African Americans, Mexican Americans and American Indians.
flashcards:
  - front: Stock market crash (October 1929) → the two worst days
    back: |
      Black Thursday (October 24) and Black Tuesday (October 29), when panicked selling overwhelmed bankers' efforts to
      prop up prices. The Dow, which peaked at about 381 in September 1929, bottomed at about 41 in July 1932, a loss of
      nearly 90%.
    topic_code: "7.9"
  - front: Buying on margin → how it worked and why it made the crash worse
    back: |
      Investors paid a fraction of a stock's price and borrowed the rest from brokers. When prices fell, brokers made
      margin calls; investors who could not pay were sold out, pushing prices lower still in a spiral.
    topic_code: "7.9"
  - front: Underlying causes of the Great Depression → five
    back: |
      Overproduction and underconsumption (wages lagged productivity); income concentrated at the top; a weak farm
      sector and heavy debt; an unregulated banking system of thousands of small banks; and a fragile international
      economy of war debts, reparations and high tariffs. The crash exposed them; it did not cause them alone.
    topic_code: "7.9"
  - front: Bank failures, 1930–1933 → scale and effect
    back: |
      About 9,000 banks failed. With no deposit insurance, depositors lost their savings, so fear spread runs to sound
      banks; the money supply shrank by about a third while the Federal Reserve did little to stop it.
    topic_code: "7.9"
  - front: Smoot–Hawley Tariff (1930) → cause → effect
    back: |
      Congress raised tariffs to protect farmers and industry despite a petition from over a thousand economists. Other
      nations retaliated, world trade collapsed and the Depression spread internationally.
    topic_code: "7.9"
  - front: Unemployment at the bottom of the Depression (1933) → figure and source
    back: |
      About one worker in four (24.9%, Historical Statistics of the United States), up from 3.2% in 1929. Millions more
      worked part time or for reduced wages; there was no federal unemployment insurance.
    topic_code: "7.9"
  - front: Hoover's response to the Depression → philosophy and actions
    back: |
      He believed in voluntary cooperation and local relief rather than federal handouts: he asked business to hold
      wages, backed public works such as the Hoover Dam and created the Reconstruction Finance Corporation, but refused
      direct federal relief to individuals. More active than his predecessors, but not enough.
    topic_code: "7.9"
  - front: Reconstruction Finance Corporation (1932) → what it did and the criticism
    back: |
      Lent federal money to banks, railroads and large businesses, hoping recovery would trickle down. Critics said it
      helped corporations while the unemployed got nothing. Roosevelt kept and expanded it.
    topic_code: "7.9"
  - front: Bonus Army (1932) → who, what happened, and the political effect
    back: |
      About 20,000 unemployed First World War veterans camped in Washington asking for early payment of a promised
      bonus. Hoover ordered them removed; troops under Douglas MacArthur used tear gas and burned the camp. The images
      damaged Hoover badly before the 1932 election.
    topic_code: "7.9"
  - front: Hoovervilles → what they were and what the name signified
    back: |
      Shantytowns of the homeless built from scrap on the edges of cities. Naming them after the president (with
      'Hoover blankets' for newspapers) showed how completely the public blamed him.
    topic_code: "7.9"
  - front: Dust Bowl (1930s) → causes and migration
    back: |
      Drought plus the ploughing of Great Plains grassland during the wheat boom left topsoil to blow away in huge dust
      storms. Hundreds of thousands of 'Okies' and 'Arkies' moved to California, where they met hostility and
      low-wage farm work. A GEO theme: human choices turned drought into disaster.
    topic_code: "7.9"
  - front: Mexican repatriation (1929–1936) → what happened
    back: |
      Local, state and federal officials pressured or deported hundreds of thousands of Mexicans and Mexican Americans,
      many of them U.S. citizens, to free jobs and relief rolls for 'Americans'. A clear case of the Depression
      intensifying nativism.
    topic_code: "7.9"
  - front: Election of 1932 → result and meaning
    back: |
      Franklin D. Roosevelt promised 'a new deal for the American people' and won 42 states against Hoover. Democrats won
      large majorities in Congress, giving him room to act. The beginning of a long Democratic era.
    topic_code: "7.10"
  - front: The three Rs of the New Deal → define with one example each
    back: |
      Relief for the needy now (Federal Emergency Relief Administration, CCC, WPA); recovery of the economy (NRA, AAA);
      reform to prevent another collapse (FDIC, SEC, Social Security, the Wagner Act).
    topic_code: "7.10"
  - front: Bank holiday, Emergency Banking Act and the first fireside chat (March 1933)
    back: |
      Roosevelt closed every bank, Congress passed the Emergency Banking Act in a day so sound banks could reopen under
      federal supervision, and his radio 'fireside chat' persuaded Americans to redeposit their money. The panic ended
      within weeks.
    topic_code: "7.10"
  - front: Glass–Steagall Act (1933) and the FDIC → reform
    back: |
      Separated commercial from investment banking and created the Federal Deposit Insurance Corporation to insure
      deposits. Bank runs, routine before 1933, almost disappeared.
    topic_code: "7.10"
  - front: Civilian Conservation Corps (1933) → who and what
    back: |
      Put about three million young unemployed men to work over its life planting trees, building trails and fighting
      erosion, sending most of their pay home. Relief and conservation together, run with Army discipline and
      segregated camps.
    topic_code: "7.10"
  - front: Agricultural Adjustment Act (1933) → method and an unintended effect
    back: |
      Paid farmers to reduce production to raise prices, funded by a processing tax. Farm incomes rose, but landowners
      often evicted tenants and sharecroppers, many of them African American, and kept the payments. The Court struck
      it down in 1936; a new AAA followed in 1938.
    topic_code: "7.10"
  - front: National Recovery Administration (1933) → codes and fate
    back: |
      Industries wrote codes of fair competition setting prices, wages and hours, and Section 7(a) promised workers the
      right to organise. It was hard to enforce and favoured big firms; the Supreme Court struck down the law behind it
      in Schechter Poultry v. United States (1935).
    topic_code: "7.10"
  - front: Tennessee Valley Authority (1933) → what and why controversial
    back: |
      A federal corporation that built dams to control floods, produce cheap electricity and develop one of the poorest
      regions. Private utilities called it socialism; supporters called it a yardstick for fair power rates.
    topic_code: "7.10"
  - front: Works Progress Administration (1935) → scale and examples
    back: |
      The largest relief programme, employing about 8.5 million people over its life on roads, bridges, schools and
      airports, and also artists, writers and actors (Federal Writers' Project, which recorded the narratives of
      formerly enslaved people).
    topic_code: "7.10"
  - front: Social Security Act (1935) → three programmes and the big exclusion
    back: |
      Old-age pensions funded by payroll taxes, unemployment insurance run with the states, and aid to dependent children
      and the disabled. Agricultural and domestic workers, a large share of African American and Mexican American
      workers, were excluded at first.
    topic_code: "7.10"
  - front: Wagner Act (National Labor Relations Act, 1935) → what it guaranteed
    back: |
      The right to organise and bargain collectively through representatives of workers' own choosing, enforced by a
      National Labor Relations Board that could punish unfair labor practices. Union membership roughly tripled by the
      end of the war.
    topic_code: "7.10"
  - front: CIO and the Flint sit-down strike (1936–1937) → significance
    back: |
      John L. Lewis's Congress of Industrial Organizations organised whole industries, including unskilled and Black
      workers. Autoworkers occupied General Motors plants in Flint for six weeks; GM recognised the United Auto Workers.
      Roosevelt refused to send troops, a contrast with 1894.
    topic_code: "7.10"
  - front: Critics from the left → Long, Coughlin, Townsend
    back: |
      Senator Huey Long's 'Share Our Wealth' plan to cap fortunes and guarantee every family an income; Father Charles
      Coughlin's radio attacks on bankers (later antisemitic); Dr Francis Townsend's plan for $200 monthly pensions.
      Their popularity pushed Roosevelt toward the Second New Deal.
    topic_code: "7.10"
  - front: American Liberty League (1934) → who and argument
    back: |
      Conservative Democrats and business leaders (including members of the du Pont family and Al Smith) who charged that
      the New Deal destroyed property rights, liberty and the Constitution. Roosevelt answered by attacking 'economic
      royalists' in 1936.
    topic_code: "7.10"
  - front: Court-packing plan (1937) → proposal and outcome
    back: |
      After the Court struck down several New Deal laws, Roosevelt proposed adding a justice for every justice over 70,
      up to six. Congress, including many Democrats, refused. But the Court began upholding New Deal laws (West Coast
      Hotel v. Parrish, NLRB v. Jones & Laughlin), and retirements soon let him appoint a majority.
    topic_code: "7.10"
  - front: Roosevelt recession (1937–1938) → cause and lesson
    back: |
      Roosevelt cut spending to balance the budget as the Federal Reserve tightened credit, and unemployment jumped from
      about 14% to about 19%. Renewed spending in 1938 helped recovery, and many concluded, as John Maynard Keynes
      argued, that deficit spending could fight depressions.
    topic_code: "7.10"
  - front: Fair Labor Standards Act (1938) → what it set
    back: |
      The first federal minimum wage (25 cents an hour) and a maximum work week (eventually 40 hours, with overtime pay),
      and a ban on most child labor in interstate commerce. The last major New Deal reform law.
    topic_code: "7.10"
  - front: Indian Reorganization Act (1934) → John Collier and what changed
    back: |
      Commissioner John Collier's 'Indian New Deal' ended allotment under the Dawes Act, returned some land to tribes,
      and encouraged tribal constitutions and self-government. Critics noted that many constitutions followed a federal
      model that ignored traditional governance.
    topic_code: "7.10"
  - front: Mary McLeod Bethune and the "Black Cabinet" → significance
    back: |
      Bethune, an educator, led the Division of Negro Affairs in the National Youth Administration and an informal group
      of Black advisers. With Eleanor Roosevelt's support they won some fairer treatment, though Roosevelt never backed
      an anti-lynching bill, fearing southern Democrats.
    topic_code: "7.10"
  - front: Frances Perkins → first and significance
    back: |
      The first woman cabinet member (Secretary of Labor, 1933–1945), a veteran of the Triangle fire investigations. She
      chaired the committee that designed Social Security and helped shape the Fair Labor Standards Act.
    topic_code: "7.10"
  - front: The New Deal coalition → five groups
    back: |
      Urban workers and union members, immigrants and their children (especially Catholics and Jews), African Americans
      in the North (who shifted from the party of Lincoln, a historic change), the white South, and many intellectuals
      and farmers. It kept Democrats dominant for a generation.
    topic_code: "7.10"
quiz:
  description: |
    25 questions · about 35 minutes · about 68% this week (the causes and effects of the Depression and the New Deal)
    and 32% review of Period 6 and weeks 22–24 (laissez-faire, the Dawes Act, the Federal Reserve, wartime
    mobilization and the 1920s). Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long essay are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Set A: the unemployment rate (7.9, 7.10, 7.9)
    - slug: apush-u07-w25-q01
      type: multiple_choice
      topic_code: "7.9"
      source: "U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970 (unemployment series, Lebergott estimates)"
      points: 1
      stimulus: |
        Unemployment as a percentage of the civilian labor force, United States, selected years

        | Year | Unemployment rate (%) |
        |---|---|
        | 1929 | 3.2 |
        | 1931 | 15.9 |
        | 1933 | 24.9 |
        | 1935 | 20.1 |
        | 1937 | 14.3 |
        | 1938 | 19.0 |
        | 1940 | 14.6 |
        | 1941 | 9.9 |

        Source: U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970 (estimates by Stanley Lebergott, which count workers on emergency relief jobs as unemployed).
      prompt: |
        Which of the following conclusions is best supported by the data?
      options:
        - "Unemployment was higher in 1941 than in 1931."
        - "Unemployment rose sharply from 1929 to 1933 and, though it fell after 1933, remained high until the defense build-up of 1940–1941."
        - "The New Deal restored full employment by 1937."
        - "Unemployment fell steadily every year from 1933 to 1941."
      option_explanations:
        - |
          The 1941 rate (9.9%) was lower than the 1931 rate (15.9%).
        - |
          Correct. The rate rose from 3.2% to 24.9%, fell to 14.3% by 1937, jumped in 1938, and dropped below 10% only in 1941 as war orders surged.
        - |
          In 1937 unemployment was still 14.3%, more than four times its 1929 level.
        - |
          The table shows a rise from 14.3% in 1937 to 19.0% in 1938.
      answer: 1
      explanation: |
        Skill: analysing quantitative data. Describe the whole pattern, including the exception (1938), and note the source's definition: these estimates count relief workers as unemployed, which makes the New Deal years look worse than series that count them as employed.
    - slug: apush-u07-w25-q02
      type: multiple_choice
      topic_code: "7.10"
      source: "U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970 (unemployment series, Lebergott estimates)"
      points: 1
      stimulus: |
        Unemployment as a percentage of the civilian labor force, United States, selected years

        | Year | Unemployment rate (%) |
        |---|---|
        | 1929 | 3.2 |
        | 1931 | 15.9 |
        | 1933 | 24.9 |
        | 1935 | 20.1 |
        | 1937 | 14.3 |
        | 1938 | 19.0 |
        | 1940 | 14.6 |
        | 1941 | 9.9 |

        Source: U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970 (estimates by Stanley Lebergott, which count workers on emergency relief jobs as unemployed).
      prompt: |
        The change between 1937 and 1938 is best explained by
      options:
        - "Roosevelt's decision to cut federal spending to balance the budget while the Federal Reserve tightened credit"
        - "the passage of the Wagner Act"
        - "the outbreak of the Second World War in Europe"
        - "the Supreme Court's decision to strike down the Social Security Act"
      option_explanations:
        - |
          Correct. The 'Roosevelt recession' followed spending cuts and tighter credit; renewed spending in 1938 helped recovery and strengthened the Keynesian case for deficits.
        - |
          The Wagner Act passed in 1935 and did not cause the 1937–1938 downturn.
        - |
          War in Europe began in September 1939, after the 1938 rise; it later increased demand for American goods.
        - |
          The Court upheld Social Security in 1937 (Helvering v. Davis), and the act was never struck down.
      answer: 0
      explanation: |
        Skill: causation. Use outside knowledge to explain an exception in the data.
    - slug: apush-u07-w25-q03
      type: multiple_choice
      topic_code: "7.9"
      source: "U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970 (unemployment series, Lebergott estimates)"
      points: 1
      stimulus: |
        Unemployment as a percentage of the civilian labor force, United States, selected years

        | Year | Unemployment rate (%) |
        |---|---|
        | 1929 | 3.2 |
        | 1931 | 15.9 |
        | 1933 | 24.9 |
        | 1935 | 20.1 |
        | 1937 | 14.3 |
        | 1938 | 19.0 |
        | 1940 | 14.6 |
        | 1941 | 9.9 |

        Source: U.S. Census Bureau, Historical Statistics of the United States, Colonial Times to 1970 (estimates by Stanley Lebergott, which count workers on emergency relief jobs as unemployed).
      prompt: |
        Which of the following best describes the federal government's response to the trend between 1929 and 1933?
      options:
        - "The federal government directly employed millions of people in public works."
        - "Congress created Social Security and unemployment insurance in 1930."
        - "President Hoover relied mainly on voluntary cooperation by business and local relief, while the Reconstruction Finance Corporation lent money to banks and businesses."
        - "The government nationalised the banking system."
      option_explanations:
        - |
          Mass federal employment came with the CWA (1933) and WPA (1935), after Hoover.
        - |
          Social Security and federal unemployment insurance came in 1935, under Roosevelt.
        - |
          Correct. Hoover urged employers to hold wages, funded some public works and created the RFC (1932), but rejected direct federal relief to the unemployed as harmful to self-reliance.
        - |
          Banks were never nationalised; Roosevelt's 1933 reforms kept them private under federal supervision.
      answer: 2
      explanation: |
        Skill: contextualization. Hoover did more than earlier presidents in downturns, but within a philosophy that limited direct federal aid.

    # ---- Set B: Roosevelt's first inaugural (7.10, 7.4, 7.6)
    - slug: apush-u07-w25-q04
      type: multiple_choice
      topic_code: "7.10"
      source: "Primary source: Franklin D. Roosevelt, Inaugural Address, March 4, 1933, The American Presidency Project"
      points: 1
      stimulus: |
        "So, first of all, let me assert my firm belief that the only thing we have to fear is fear itself—nameless, unreasoning, unjustified terror which paralyzes needed efforts to convert retreat into advance. ... Our greatest primary task is to put people to work. ... I shall ask the Congress for the one remaining instrument to meet the crisis—broad Executive power to wage a war against the emergency, as great as the power that would be given to me if we were in fact invaded by a foreign foe."

        — President Franklin D. Roosevelt, Inaugural Address, March 4, 1933
      prompt: |
        Which action in the months after this address most directly addressed the 'fear' Roosevelt described?
      options:
        - "The Fair Labor Standards Act"
        - "The repeal of the Smoot–Hawley Tariff"
        - "A national bank holiday and the Emergency Banking Act, followed by a radio fireside chat urging depositors to return their money to reopened banks"
        - "The Court-packing plan"
      option_explanations:
        - |
          The FLSA passed in 1938, five years later.
        - |
          Smoot–Hawley was not repealed; the Reciprocal Trade Agreements Act (1934) lowered some rates through bilateral deals.
        - |
          Correct. In March 1933 banks in most states were closed or failing; Roosevelt's holiday, the emergency act and his first fireside chat ended the panic within weeks.
        - |
          The Court plan came in 1937 and caused more alarm than it calmed.
      answer: 2
      explanation: |
        Skill: causation. In March 1933 the immediate crisis was the banking panic, a crisis of confidence.
    - slug: apush-u07-w25-q05
      type: multiple_choice
      topic_code: "7.4"
      source: "Primary source: Franklin D. Roosevelt, Inaugural Address, March 4, 1933, The American Presidency Project"
      points: 1
      stimulus: |
        "So, first of all, let me assert my firm belief that the only thing we have to fear is fear itself—nameless, unreasoning, unjustified terror which paralyzes needed efforts to convert retreat into advance. ... Our greatest primary task is to put people to work. ... I shall ask the Congress for the one remaining instrument to meet the crisis—broad Executive power to wage a war against the emergency, as great as the power that would be given to me if we were in fact invaded by a foreign foe."

        — President Franklin D. Roosevelt, Inaugural Address, March 4, 1933
      prompt: |
        Review. The banking crisis Roosevelt faced showed the limits of which Progressive Era reform?
      options:
        - "The Clayton Antitrust Act's exemption for labor unions"
        - "The Seventeenth Amendment"
        - "The Pure Food and Drug Act"
        - "The Federal Reserve system, created in 1913, which had failed to prevent the collapse of thousands of banks and a sharp fall in the money supply"
      option_explanations:
        - |
          The Clayton Act concerned antitrust and unions, not the banking system.
        - |
          Direct election of senators had nothing to do with banking.
        - |
          The 1906 act regulated food and medicine labelling.
        - |
          Correct. The Fed was meant to provide an elastic currency and stop panics; between 1930 and 1933 it let the money supply contract by about a third, a failure New Deal reforms (the FDIC, the Banking Act of 1935) tried to fix.
      answer: 3
      explanation: |
        Skill: continuity and change. Progressive institutions (7.4) proved inadequate to the Depression, and the New Deal rebuilt them.
    - slug: apush-u07-w25-q06
      type: multiple_choice
      topic_code: "7.6"
      source: "Primary source: Franklin D. Roosevelt, Inaugural Address, March 4, 1933, The American Presidency Project"
      points: 1
      stimulus: |
        "So, first of all, let me assert my firm belief that the only thing we have to fear is fear itself—nameless, unreasoning, unjustified terror which paralyzes needed efforts to convert retreat into advance. ... Our greatest primary task is to put people to work. ... I shall ask the Congress for the one remaining instrument to meet the crisis—broad Executive power to wage a war against the emergency, as great as the power that would be given to me if we were in fact invaded by a foreign foe."

        — President Franklin D. Roosevelt, Inaugural Address, March 4, 1933
      prompt: |
        Review. Roosevelt's comparison of the Depression to a war most likely drew on Americans' memory of
      options:
        - "the War of 1812's embargo on British trade"
        - "the mobilization of the economy by federal agencies such as the War Industries Board in 1917–1918"
        - "the Civil War's Reconstruction Acts"
        - "the Spanish–American War's naval victories"
      option_explanations:
        - |
          The embargo of 1807 preceded the War of 1812 and was a failed trade policy, not a model of mobilization.
        - |
          Correct. Many New Dealers had served in wartime agencies, and the NRA borrowed the War Industries Board's model of government-business coordination and patriotic campaigns.
        - |
          Reconstruction concerned rebuilding the South after slavery, not economic emergency powers.
        - |
          The 1898 war was short and fought by a small force; it did not mobilise the economy.
      answer: 1
      explanation: |
        Skill: making connections. The First World War (7.6) was the New Deal's only precedent for a powerful federal economy.

    # ---- Set C: Hoover, 1928 (7.9, 6.12, 7.7)
    - slug: apush-u07-w25-q07
      type: multiple_choice
      topic_code: "7.9"
      source: "Primary source: Herbert Hoover, Campaign Address in New York City, October 22, 1928, The American Presidency Project"
      points: 1
      stimulus: |
        "We were challenged with a peacetime choice between the American system of rugged individualism and a European philosophy of diametrically opposed doctrines—doctrines of paternalism and state socialism. The acceptance of these ideas would have meant the destruction of self-government through centralization of government."

        — Herbert Hoover, campaign address, New York City, October 22, 1928
      prompt: |
        The ideas in the excerpt best explain which aspect of Hoover's response to the Depression after 1929?
      options:
        - "His support for federal ownership of electric power"
        - "His refusal to provide direct federal relief payments to unemployed individuals"
        - "His decision to take the United States off the gold standard"
        - "His creation of a federal old-age pension system"
      option_explanations:
        - |
          Hoover opposed public power, consistent with the excerpt's fear of state socialism.
        - |
          Correct. Hoover feared that federal 'doles' would centralise government and destroy the self-reliance he called rugged individualism; he preferred voluntary cooperation and local charity.
        - |
          Roosevelt took the nation off the gold standard in 1933; Hoover defended gold.
        - |
          Hoover created no pension system; Social Security came in 1935.
      answer: 1
      explanation: |
        Skill: making connections between ideology and policy. A 1928 campaign statement explains a 1931 decision.
    - slug: apush-u07-w25-q08
      type: multiple_choice
      topic_code: "6.12"
      source: "Primary source: Herbert Hoover, Campaign Address in New York City, October 22, 1928, The American Presidency Project"
      points: 1
      stimulus: |
        "We were challenged with a peacetime choice between the American system of rugged individualism and a European philosophy of diametrically opposed doctrines—doctrines of paternalism and state socialism. The acceptance of these ideas would have meant the destruction of self-government through centralization of government."

        — Herbert Hoover, campaign address, New York City, October 22, 1928
      prompt: |
        Review. Hoover's argument most closely echoes which position from the late nineteenth century?
      options:
        - "The Populists' demand for government ownership of railroads"
        - "The defence of limited government and individual self-reliance by advocates of laissez-faire such as William Graham Sumner"
        - "Edward Bellamy's vision of a cooperative socialist future in Looking Backward"
        - "The Knights of Labor's call for an eight-hour day by law"
      option_explanations:
        - |
          Government ownership is the 'state socialism' Hoover rejects.
        - |
          Correct. Gilded Age defenders of laissez-faire argued that government aid undermined self-reliance; Hoover, more of an engineer-reformer, still shared their fear of centralised power.
        - |
          Bellamy's best-seller imagined exactly the kind of collectivism Hoover warns against.
        - |
          A legislated eight-hour day is government regulation of labor, which Hoover's argument resists.
      answer: 1
      explanation: |
        Skill: continuity and change. The argument against 'paternalism' links 1880s laissez-faire to 1930s critics of the New Deal.
    - slug: apush-u07-w25-q09
      type: multiple_choice
      topic_code: "7.7"
      source: "Primary source: Herbert Hoover, Campaign Address in New York City, October 22, 1928, The American Presidency Project"
      points: 1
      stimulus: |
        "We were challenged with a peacetime choice between the American system of rugged individualism and a European philosophy of diametrically opposed doctrines—doctrines of paternalism and state socialism. The acceptance of these ideas would have meant the destruction of self-government through centralization of government."

        — Herbert Hoover, campaign address, New York City, October 22, 1928
      prompt: |
        Review. Hoover's confidence in 1928 was most strongly supported by which feature of the 1920s?
      options:
        - "A steady rise in union membership"
        - "Rising farm prices throughout the decade"
        - "The growth of mass production and consumer goods, such as automobiles and appliances, under business-friendly government"
        - "Large federal budget deficits"
      option_explanations:
        - |
          Union membership fell in the 1920s, after the failed strikes of 1919 and employers' open-shop drives.
        - |
          Farm prices were depressed for most of the decade, a weakness Hoover's campaign tended to downplay.
        - |
          Correct. The consumer boom seemed to prove that private enterprise, encouraged but not directed by government, could deliver prosperity.
        - |
          Mellon ran budget surpluses and reduced the federal debt.
      answer: 2
      explanation: |
        Skill: contextualization. Hoover spoke a year before the crash, at the height of the boom.

    - slug: apush-u07-w25-q10
      type: multiple_choice
      topic_code: "7.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following was an underlying cause that made the depression after 1929 so severe and long?
      options:
        - "Large federal spending on public works in the 1920s"
        - "Very high taxes on the wealthiest Americans during the 1920s"
        - "A banking system of thousands of small, uninsured banks, so that failures spread panic and wiped out savings"
        - "A shortage of manufactured goods in the late 1920s"
      option_explanations:
        - |
          Federal spending was restrained in the 1920s.
        - |
          Mellon cut taxes on the wealthy, which helped concentrate income.
        - |
          Correct. About 9,000 banks failed between 1930 and 1933; without deposit insurance each failure destroyed savings and spending and set off runs on other banks.
        - |
          The problem was the reverse: production outran the purchasing power of most consumers.
      answer: 2
      explanation: |
        Skill: causation (long-term versus immediate causes). The crash was the trigger; structural weaknesses made the depression deep.
    - slug: apush-u07-w25-q11
      type: multiple_choice
      topic_code: "7.9"
