      source: "Primary source: Indian Reorganization Act (1934), National Archives, DocsTeach"
      points: 1
      prompt: |
        Review. The Indian Reorganization Act of 1934, passed "to grant certain rights of home rule to Indians," reversed which earlier federal policy?
      options:
        - "The Fort Laramie Treaty of 1868"
        - "The allotment of reservation land to individuals under the Dawes Act of 1887"
        - "The removal of southeastern nations under the Indian Removal Act of 1830"
        - "The Indian Citizenship Act of 1924"
      option_explanations:
        - |
          The 1868 treaty recognised Lakota lands; the IRA did not undo it.
        - |
          Correct. Allotment had cost American Indians about two-thirds of their land by 1934 and aimed to dissolve tribes; the IRA ended allotment and encouraged tribal self-government.
        - |
          Removal had been carried out a century earlier and could not be reversed; the IRA addressed reservation land and government.
        - |
          The IRA did not reverse citizenship, which remained.
      answer: 1
      explanation: |
        Skill: continuity and change. Federal Indian policy swung from assimilation through allotment (6.3) to a limited restoration of tribal self-government (7.10).
