    # ---- Short answer (SAQ)
    - slug: apush-u05-w17-q23
      type: short_answer
      topic_code: "5.11"
      source: "Primary source: United States v. Cruikshank, 92 U.S. 542 (1876), Justia U.S. Supreme Court Center"
      points: 3
      stimulus: |
        "The equality of the rights of citizens is a principle of republicanism. Every republican government is in duty bound to protect all its citizens in the enjoyment of this principle, if within its power. ...

        The Fourteenth Amendment prohibits a State from depriving any person of life, liberty, or property without due process of law, but this adds nothing to the rights of one citizen as against another."

        — Chief Justice Morrison Waite, opinion of the Court, United States v. Cruikshank (1876), a case arising from the Colfax Massacre in Louisiana (1873)
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the Court's reasoning about the Fourteenth Amendment in the excerpt.
        (b) Briefly explain ONE way the decision affected African Americans in the South.
        (c) Briefly explain ONE other development from 1868 to 1877 that, like the decision, contributed to the end of Reconstruction.
      answer: |
        (a) The Court held that the Fourteenth Amendment restrains only state governments, so it did not give the federal government power to punish private individuals, such as the white men who killed Black citizens at Colfax; protecting citizens from one another remained the job of the states.
        (b) Because Southern state and local officials rarely prosecuted white attackers, the decision left Black voters and officeholders exposed to the White League, rifle clubs and other paramilitary violence, which Democrats used to retake state governments.
        (c) The Panic of 1873 and the depression that followed turned Northern voters toward economic concerns and helped Democrats win the House in 1874, so Congress and the public lost interest in enforcing Reconstruction, which ended with the Compromise of 1877.
      explanation: |
        Three points.

        (a) 1 pt for accurately describing the state-action reasoning: the amendment limits states, not private persons, so federal prosecution of private violence was not authorised under it. Zero for "the Court supported civil rights" based only on the first sentence.

        (b) 1 pt for a specific effect with explanation: the Colfax killers went free; federal enforcement of the Enforcement Acts collapsed; paramilitary violence increased (White League, Mississippi Plan); Black political participation fell as Redeemers took power.

        (c) 1 pt for a specific development with explanation: the Slaughterhouse Cases (1873); the Panic of 1873; Democratic gains in 1874; Liberal Republicans and Northern weariness; Grant's refusal to send troops to Mississippi in 1875; the Compromise of 1877; Klan and Red Shirt violence. Zero for a development outside 1868–1877 or with no link to Reconstruction's end.

    - slug: apush-u05-w17-q24
      type: short_answer
      topic_code: "5.12"
      source: "Secondary source written for this course; general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course): "Reconstruction failed in its own time, but it did not fail completely. It ended slavery forever, wrote birthright citizenship and equal protection into the Constitution, and built Black churches, schools and colleges that outlasted its collapse. Those achievements became the legal and institutional foundation of the civil rights movement nearly a century later."

        (This view is close to that of historians who, from the 1960s on, rejected older accounts that portrayed Reconstruction as a corrupt mistake.)
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the author's argument about Reconstruction.
        (b) Briefly explain ONE piece of evidence from 1865 to 1877 that supports the author's argument.
        (c) Briefly explain ONE piece of evidence from 1865 to 1877 that a historian could use to argue that Reconstruction's failures outweighed its achievements.
      answer: |
        (a) The author argues that Reconstruction, though defeated by 1877, left lasting achievements, the abolition of slavery, constitutional citizenship and equal protection, and Black institutions, that later generations used to win civil rights.
        (b) The Fourteenth Amendment's equal protection clause, ratified in 1868, remained in the Constitution after Reconstruction ended and was later the basis for challenges to segregation; colleges such as Fisk and Howard, founded in 1866–67, trained generations of Black leaders.
        (c) By 1877 Democratic Redeemers controlled every Southern state, the Compromise of 1877 ended federal protection, and most freedpeople were sharecroppers without land, so the practical promise of equal citizenship and economic independence was broken for most Black Southerners for decades.
      explanation: |
        Three points.

        (a) 1 pt for describing the argument: Reconstruction failed in the short run but succeeded in creating lasting legal and institutional foundations. Zero for "Reconstruction failed" alone.

        (b) 1 pt for specific supporting evidence with explanation: the Thirteenth, Fourteenth or Fifteenth Amendments; the Civil Rights Act of 1866; Black colleges (Fisk, Howard, Hampton); independent Black churches; public school systems created by Reconstruction governments.

        (c) 1 pt for specific contrary evidence with explanation: Black Codes; failure of land redistribution and the return of land to planters; sharecropping and crop liens; Klan and White League violence; Slaughterhouse and Cruikshank; the Mississippi Plan; the Compromise of 1877.

    # ---- Long essay (LEQ)
    - slug: apush-u05-w17-q25
      type: long_answer
      topic_code: "5.12"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1865 and 1877 the end of slavery, three constitutional amendments and federal intervention transformed the legal status of African Americans. Historians disagree about how far that transformation reached into their daily lives.

        Evaluate the extent to which Reconstruction changed the lives of African Americans in the South from 1865 to 1877.
      answer: |
        Thesis: Reconstruction changed the legal and political status of Black Southerners profoundly, ending slavery, establishing citizenship and bringing Black men into politics, but it changed their economic lives far less, because without land most freedpeople became sharecroppers, and by 1877 terror and Northern retreat had begun to reverse even the political gains.

        Context: slavery's centrality to the Southern economy; wartime emancipation and Black military service; Johnson's lenient restoration and the Black Codes.

        Body 1 (legal and political change): Thirteenth to Fifteenth Amendments; Civil Rights Act of 1866; Reconstruction Acts; sixteen Black congressmen including Revels and Bruce; hundreds of state officials.
        Body 2 (social change): reuniting families, legal marriages, independent churches, schools and colleges with the Freedmen's Bureau.
        Body 3 (economic continuity and political reversal): no land redistribution (Field Order 15 revoked); sharecropping and crop liens; Klan violence; Slaughterhouse and Cruikshank; Redeemers and the Compromise of 1877.

        Complexity: distinguish legal from economic change and short-term from long-term significance.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): 1 pt for a defensible claim about the extent of change, e.g. "great legal and political change, limited economic change."

        Contextualization (0–1): 1 pt for describing the situation before or at the start of Reconstruction: slavery and the cotton economy; emancipation during the war; Black military service; the devastation of the South; presidential Reconstruction and the Black Codes.

        Evidence (0–2): 1 pt for two specific examples (Thirteenth, Fourteenth, Fifteenth Amendments; Freedmen's Bureau; Civil Rights Act of 1866; Reconstruction Acts; Revels and Bruce; Black churches and schools; sharecropping and crop liens; Field Order No. 15; Klan; Enforcement Acts; Slaughterhouse; Cruikshank; Compromise of 1877). 2 pts for using evidence to support an argument about extent.

        Analysis and reasoning (0–2): 1 pt for using continuity and change (or comparison) to frame the argument. 1 pt for complex understanding: e.g. explaining both change and continuity; distinguishing kinds of change (legal, political, social, economic); comparing experiences of different groups (urban and rural, men and women); connecting to long-term significance in later periods.
