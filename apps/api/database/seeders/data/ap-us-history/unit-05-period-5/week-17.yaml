    # ---- True / false
    - slug: apush-u05-w17-q19
      type: true_false
      topic_code: "5.10"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The Fifteenth Amendment prohibited states from using literacy tests and poll taxes to restrict voting.
      answer: false
      explanation: |
        False. The amendment barred denial of the vote "on account of race, color, or previous condition of servitude," but did not forbid race-neutral requirements such as literacy tests, poll taxes and residency rules. After Reconstruction, Southern states used exactly those devices to disfranchise most Black men, until the Twenty-fourth Amendment (1964) and the Voting Rights Act (1965).

    - slug: apush-u05-w17-q20
      type: true_false
      topic_code: "5.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: In 1860 Abraham Lincoln won the presidency with a majority of the national popular vote.
      answer: false
      explanation: |
        False. Lincoln won about 40% of the popular vote, a plurality in a four-way race, but a clear majority of the electoral college, all from free states. The sectional pattern of his victory, not its size, triggered secession.

    # ---- Fill in the blank
    - slug: apush-u05-w17-q21
      type: fill_blank
      topic_code: "5.10"
