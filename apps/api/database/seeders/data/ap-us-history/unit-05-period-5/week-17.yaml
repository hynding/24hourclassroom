        - "had been declared unconstitutional by the Supreme Court in 1864"
        - "freed enslaved men but not women and children"
        - "applied only to the Northern states"
      option_explanations:
        - |
          Correct. Slavery remained legal in the border states, and a wartime measure's legal force in peacetime was uncertain; an amendment ended slavery everywhere permanently.
        - |
          The Court never struck down the proclamation.
        - |
          The proclamation applied to all enslaved persons in the designated areas, regardless of sex or age.
        - |
          The proclamation applied to Confederate-held areas, not the North, which had no slavery.
      answer: 0
      explanation: |
