    - slug: apush-u05-w17-q15
      type: multiple_choice
      topic_code: "5.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Black veterans and their supporters most often used the service of about 180,000 Black Union soldiers to argue that
      options:
        - "the army should be disbanded immediately"
        - "men who had fought to save the Union had earned citizenship and the right to vote"
        - "the Confiscation Acts should be repealed"
        - "freedpeople should emigrate to Liberia"
      option_explanations:
        - |
          Disbanding the army had nothing to do with claims based on Black military service.
        - |
          Correct. Military service was a powerful argument for full citizenship; Black conventions and Radical Republicans made it repeatedly in 1865–1867.
        - |
          Black leaders wanted land and rights, not the repeal of measures that had freed people.
        - |
          Colonization was rejected by most Black leaders, who insisted on rights in the nation they had fought for.
      answer: 1
      explanation: |
        Continuity and change: wartime service became the basis of postwar claims to citizenship, a pattern that recurs after both world wars.

    - slug: apush-u05-w17-q16
      type: multiple_choice
      topic_code: "4.12"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Many Black political leaders during Reconstruction had been free before the war or had escaped slavery. This most directly reflects the importance of which antebellum development?
      options:
        - "Free African American communities in the North and the urban South, with their churches, schools and abolitionist networks"
        - "The Second Bank of the United States"
        - "The Indian Removal Act"
        - "The Lowell textile mills"
      option_explanations:
        - |
          Correct. Independent Black churches such as the AME, free Black schools and the abolitionist press trained leaders such as the free-born Francis Cardozo of Charleston and P. B. S. Pinchback of Louisiana, along with Northern-born ministers and teachers who went South after 1865.
        - |
          The Second Bank was a financial institution with no role in training Black leaders.
        - |
          Indian removal concerned Native nations in the Southeast, not Black political leadership.
        - |
          The Lowell mills employed young white New England women.
      answer: 0
      explanation: |
        Making connections between topic 4.12 and topic 5.10: the institutions free Black communities built before the war became the foundations of Reconstruction politics.

    # ---- Multi-select
    - slug: apush-u05-w17-q17
      type: multi_select
      topic_code: "5.11"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following contributed to the end of Reconstruction by 1877? Select all that apply.
      options:
        - "Violence and intimidation by the Ku Klux Klan, White League and Red Shirts"
        - "The bargain that resolved the disputed election of 1876"
        - "Supreme Court decisions such as the Slaughterhouse Cases and United States v. Cruikshank"
        - "The repeal of the Thirteenth Amendment"
        - "A massive migration of freedpeople to the North in the 1870s"
        - "The Panic of 1873 and the economic depression that followed"
      option_explanations:
        - |
          Correct. Terror drove Black and white Republicans from the polls and helped Democrats redeem state after state.
        - |
          Correct. The Compromise of 1877 ended federal support for the last Republican state governments.
        - |
          Correct. The Court narrowed the Fourteenth Amendment and federal power to punish private violence.
        - |
          The Thirteenth Amendment was never repealed; slavery stayed abolished.
        - |
          Most freedpeople stayed in the South; the Exodusters of 1879 to Kansas were a small, later movement, and the Great Migration began after 1910.
        - |
          Correct. Depression turned Northern voters' attention to their own troubles and helped Democrats win the House in 1874.
      answer: [0, 1, 2, 5]
      explanation: |
        Multiple causation: Southern violence, Northern retreat, the courts and national politics all contributed. Strong essays weigh them rather than list them.

