  # ---- Stimulus set D: the Thirteenth Amendment (5.10, review 3.9)
  - slug: apush-u05-exam-q25
    type: multiple_choice
    topic_code: "5.10"
    source: "Primary source: Thirteenth Amendment, Section 1 (ratified 1865), National Archives, Milestone Documents"
    points: 1
    stimulus: &ex13 |
      "Neither slavery nor involuntary servitude, except as a punishment for crime whereof the party shall have been duly convicted, shall exist within the United States, or any place subject to their jurisdiction."

      — Thirteenth Amendment to the Constitution, Section 1, passed by Congress January 1865, ratified December 1865
    prompt: |
      Congress proposed the amendment even though the Emancipation Proclamation was already in effect mainly because
    options:
      - "the Confederate government had requested it as a peace term"
      - "the Supreme Court had struck down the proclamation"
      - "the proclamation had applied only to the North"
      - "the proclamation was a war measure that did not cover the border states and might not have legal force after the war"
    option_explanations:
