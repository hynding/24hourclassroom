unit: 5
description: |
  46 questions · about 80 minutes · every topic of Period 5 (5.1 to 5.12) with about a fifth of the items
  reviewing Periods 1–4, five source-based stimulus sets (Lincoln's First Inaugural, the Kansas-Nebraska Act, the
  Homestead Act, the Thirteenth Amendment and the election of 1876), a short-answer question on a map (3 points)
  and a document-based question (7 points) on citizenship from Dred Scott to Cruikshank. Multiple choice,
  select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the
  free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: Lincoln's First Inaugural (5.7)
  - slug: apush-u05-exam-q01
    type: multiple_choice
    topic_code: "5.7"
    source: "Primary source: Abraham Lincoln, First Inaugural Address (March 4, 1861), Avalon Project, Yale Law School"
    points: 1
    stimulus: &exinaug |
      "I have no purpose, directly or indirectly, to interfere with the institution of slavery in the States where it exists. I believe I have no lawful right to do so, and I have no inclination to do so. ...

      I hold that in contemplation of universal law and of the Constitution the Union of these States is perpetual. ...

      In your hands, my dissatisfied fellow-countrymen, and not in mine, is the momentous issue of civil war. ... We are not enemies, but friends. We must not be enemies."

      — Abraham Lincoln, First Inaugural Address, March 4, 1861
    prompt: |
      When Lincoln delivered this address, which of the following had already occurred?
    options:
      - "Seven states of the Lower South had seceded and formed the Confederate States of America."
      - "Confederate forces had captured Fort Sumter."
      - "Congress had passed the Thirteenth Amendment."
      - "Virginia had seceded and Richmond had become the Confederate capital."
    option_explanations:
      - |
        Correct. South Carolina, Mississippi, Florida, Alabama, Georgia, Louisiana and Texas had seceded by February 1, 1861, and formed the Confederacy at Montgomery before the inauguration.
      - |
        Fort Sumter was bombarded on April 12, 1861, more than a month after the address.
      - |
        The Thirteenth Amendment passed Congress in January 1865, near the end of the war.
      - |
        Virginia seceded only after Fort Sumter and Lincoln's call for volunteers in April 1861.
    answer: 0
    explanation: |
      Historical situation: the address was aimed at a divided nation in which the Lower South had already left and the Upper South was undecided.

  - slug: apush-u05-exam-q02
    type: multiple_choice
    topic_code: "5.7"
    source: "Primary source: Abraham Lincoln, First Inaugural Address (March 4, 1861), Avalon Project, Yale Law School"
    points: 1
    stimulus: *exinaug
    prompt: |
      Lincoln's claim that the Union is "perpetual" was intended chiefly to
    options:
      - "announce an immediate invasion of the seceded states"
      - "deny that states had any constitutional right to secede"
      - "propose a new constitution for the reunited nation"
      - "endorse the theory of state sovereignty advanced by John C. Calhoun"
    option_explanations:
      - |
        Lincoln promised no invasion and said the government would not assail anyone; he left the first shot to the South.
      - |
        Correct. If the Union was perpetual, secession was legally void, and the seceded states remained in the Union; this became the legal premise of the war and of Reconstruction.
      - |
        Lincoln proposed no new constitution; he insisted the existing one bound all the states.
      - |
        Calhoun argued that the states were sovereign and could leave; Lincoln's claim is the opposite.
    answer: 1
    explanation: |
      Claims in a primary source: identify the argument a phrase serves. "Perpetual" answers the secessionists' constitutional theory.

  - slug: apush-u05-exam-q03
    type: multiple_choice
    topic_code: "5.7"
    source: "Primary source: Abraham Lincoln, First Inaugural Address (March 4, 1861), Avalon Project, Yale Law School"
    points: 1
    stimulus: *exinaug
    prompt: |
      Lincoln's promise in the first paragraph failed to reassure the seceded states mainly because
    options:
      - "the Supreme Court had just ruled that the states could abolish slavery"
      - "the seceded states wanted the federal government to abolish slavery gradually"
      - "Lincoln had campaigned on immediate abolition in the states"
      - "Southern leaders believed that a Republican administration committed to stopping slavery's expansion would eventually threaten slavery itself"
    option_explanations:
      - |
        No such ruling existed; Dred Scott had protected slavery in the territories.
      - |
        The seceded states left to protect slavery, not to see it abolished in any form.
      - |
        Lincoln's platform opposed only slavery's expansion; he never campaigned for abolition in the states.
      - |
        Correct. Secessionists argued that a party hostile to slavery, controlling patronage, the territories and eventually the courts, would put slavery on a path to extinction, as the "House Divided" speech seemed to promise.
    answer: 3
    explanation: |
      Point of view and causation: a reassurance about the present could not answer a fear about the future, which is why secession followed a promise of non-interference.

  # ---- Stimulus set B: the Kansas-Nebraska Act (5.6, review 4.3)
  - slug: apush-u05-exam-q04
    type: multiple_choice
    topic_code: "5.6"
    source: "Primary source: Kansas-Nebraska Act (1854), section 32, National Archives, Milestone Documents"
    points: 1
    stimulus: &exkn |
      "... it being the true intent and meaning of this act not to legislate slavery into any Territory or State, nor to exclude it therefrom, but to leave the people thereof perfectly free to form and regulate their domestic institutions in their own way, subject only to the Constitution of the United States ..."

      — Kansas-Nebraska Act, passed by Congress May 1854
    prompt: |
      The principle stated in the excerpt is best described as
    options:
      - "popular sovereignty"
      - "nullification"
      - "the Wilmot Proviso"
      - "free soil"
    option_explanations:
      - |
        Correct. Leaving slavery to the people of the territory was popular sovereignty, the formula of Lewis Cass and Stephen Douglas.
      - |
        Nullification was the claim that a state could void a federal law, as South Carolina tried in 1832.
      - |
        The Wilmot Proviso would have excluded slavery by act of Congress, the opposite of leaving it to settlers.
      - |
        Free soil meant Congress should bar slavery from all territories, which this act declined to do.
    answer: 0
    explanation: |
      Identifying a policy from its language, then placing it among the rival positions of 1846–1854.

  - slug: apush-u05-exam-q05
    type: multiple_choice
    topic_code: "4.3"
    source: "Primary source: Kansas-Nebraska Act (1854), section 32, National Archives, Milestone Documents"
    points: 1
    stimulus: *exkn
    prompt: |
      Review. The act angered many Northerners because Kansas and Nebraska lay in territory that had been closed to slavery by
    options:
      - "the Northwest Ordinance of 1787"
      - "the Missouri Compromise of 1820"
      - "the Compromise of 1850"
      - "the Treaty of Guadalupe Hidalgo"
    option_explanations:
      - |
        The Northwest Ordinance covered the Old Northwest, east of the Mississippi, not the Great Plains.
      - |
        Correct. The Missouri Compromise barred slavery in the Louisiana Purchase north of 36°30', where both territories lay; letting settlers decide repealed that ban.
      - |
        The Compromise of 1850 applied popular sovereignty to New Mexico and Utah but did not govern the Louisiana Purchase.
      - |
        The treaty with Mexico concerned the Southwest, not the Louisiana Purchase.
    answer: 1
    explanation: |
      Continuity and change between Periods 4 and 5: a settlement treated as near-sacred for 34 years was undone, which is why the reaction was so strong.

  - slug: apush-u05-exam-q06
    type: multiple_choice
    topic_code: "5.6"
    source: "Primary source: Kansas-Nebraska Act (1854), section 32, National Archives, Milestone Documents"
    points: 1
    stimulus: *exkn
    prompt: |
      Which of the following most directly resulted from the attempt to apply the principle in the excerpt?
    options:
      - "The revival of the Whig Party as a national force"
      - "A decline in sectional tension in Congress"
      - "The peaceful admission of Kansas as a slave state in 1855"
      - "Violent conflict between proslavery and free-state settlers and rival governments in Kansas"
    option_explanations:
      - |
        The act destroyed the Whig Party; the new Republican Party replaced it in the North.
      - |
        Tension increased, culminating in the caning of Charles Sumner in the Senate in 1856.
      - |
        Kansas was not admitted until 1861, as a free state.
      - |
        Correct. Illegal voting by Missourians, a fraudulent proslavery legislature, the sack of Lawrence and Pottawatomie made Bleeding Kansas a preview of civil war.
    answer: 3
    explanation: |
      Causation: popular sovereignty without agreed rules turned an election into a contest of force.

  # ---- Stimulus set C: the Homestead Act (5.9, review 3.7)
  - slug: apush-u05-exam-q07
    type: multiple_choice
    topic_code: "5.9"
    source: "Primary source: Homestead Act (May 20, 1862), National Archives, Milestone Documents"
    points: 1
    stimulus: &exhome |
      "... any person who is the head of a family, or who has arrived at the age of twenty-one years, and is a citizen of the United States, or who shall have filed his declaration of intention to become such, as required by the naturalization laws of the United States, and who has never borne arms against the United States Government or given aid and comfort to its enemies, shall, from and after the first January, eighteen hundred and sixty-three, be entitled to enter one quarter section or a less quantity of unappropriated public lands ..."

      — Homestead Act, signed by President Lincoln, May 20, 1862 (a quarter section is 160 acres; title required five years of residence and cultivation)
    prompt: |
      The passage of the act in 1862 is best explained by
    options:
      - "the end of westward migration during the war"
      - "the departure from Congress of Southern members who had opposed free homesteads"
      - "the need to repay foreign loans with public land"
      - "the demands of Confederate leaders for western land"
    option_explanations:
      - |
        Migration continued during the war; the act encouraged more of it.
      - |
        Correct. Southern Democrats had blocked homestead bills, fearing they would fill the West with free-soil farmers; secession removed the obstacle.
      - |
        The act gave land to settlers; it was not a scheme to repay foreign debt.
      - |
        Confederate leaders had no voice in the Union Congress, and the act excluded anyone who had borne arms against the United States.
    answer: 1
    explanation: |
      Historical situation: secession changed the balance in Congress and let Republicans enact the free-labor programme.

  - slug: apush-u05-exam-q08
    type: multiple_choice
    topic_code: "5.9"
    source: "Primary source: Homestead Act (May 20, 1862), National Archives, Milestone Documents"
    points: 1
    stimulus: *exhome
    prompt: |
      The eligibility rules in the excerpt most directly reflect which wartime goal of the Union government?
    options:
      - "Rewarding loyalty to the Union while encouraging immigrants and ordinary families to settle the West"
      - "Returning western land to American Indian nations"
      - "Reserving all western land for Union army veterans only"
      - "Restricting western land to large planters"
    option_explanations:
      - |
        Correct. The act excluded anyone who had fought against the United States, included intending citizens, and was open to heads of family, including women, so it built a loyal free-labor West.
      - |
        The act opened land taken or to be taken from Native nations to settlers, the opposite of returning it.
      - |
        Veterans received later benefits, but the act was open to any eligible citizen or intending citizen.
      - |
        The 160-acre limit and residence requirement favoured small family farms, not planters.
    answer: 0
    explanation: |
      Close reading for purpose: each eligibility clause connects to a policy goal (loyalty, immigration, free labor).

  - slug: apush-u05-exam-q09
    type: multiple_choice
    topic_code: "3.7"
    source: "Primary source: Homestead Act (May 20, 1862), National Archives, Milestone Documents"
    points: 1
    stimulus: *exhome
    prompt: |
      Review. The act's use of the "quarter section" continued a system of surveying public land first established under
    options:
      - "the Proclamation of 1763"
      - "the Indian Removal Act of 1830"
      - "the Treaty of Paris of 1783"
      - "the Land Ordinance of 1785 passed by the Confederation Congress"
    option_explanations:
      - |
        The Proclamation of 1763 forbade colonial settlement west of the Appalachians; it set no survey system.
      - |
        The Indian Removal Act exchanged eastern Native land for land west of the Mississippi; it did not create the rectangular survey.
      - |
        The Treaty of Paris fixed national boundaries but did not establish land surveying.
      - |
        Correct. The Land Ordinance divided western land into townships six miles square, each with 36 sections of 640 acres; a quarter section was 160 acres.
    answer: 3
    explanation: |
      Continuity across periods: the Articles of Confederation's land system (topic 3.7) structured western settlement for a century.

  # ---- Standalone: expansion and context (5.1–5.3)
  - slug: apush-u05-exam-q10
    type: multiple_choice
    topic_code: "5.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following best describes immigration to the United States between 1845 and 1855?
    options:
      - "Immigration nearly stopped because of the Mexican–American War."
      - "Most immigrants came from southern and eastern Europe."
      - "Immigrants settled mainly on Southern cotton plantations."
      - "Large numbers of Irish and German immigrants arrived, many of them Catholic, provoking a nativist political movement."
    option_explanations:
      - |
        Immigration surged in these years; the war did not stop it.
      - |
        Southern and eastern European immigration became dominant after 1880 (the "new immigration" of Unit 6).
      - |
        Few immigrants went to the plantation South; most settled in Northern cities and Midwestern farmland.
      - |
        Correct. The Irish famine and German hardship and revolution brought millions; the Know-Nothings rose in response.
    answer: 3
    explanation: |
      Contextualization of Period 5: immigration reshaped Northern society and politics alongside the slavery crisis.

  - slug: apush-u05-exam-q11
    type: multiple_choice
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    prompt: |
      The migration of members of the Church of Jesus Christ of Latter-day Saints to the Great Salt Lake in 1846–1847 is best understood as
    options:
      - "a search for a place where they could practise their religion free from the persecution they had faced in Missouri and Illinois"
      - "a federal program to settle the Mexican Cession"
      - "an effort to establish a slave state in the West"
      - "a response to the discovery of gold in California"
    option_explanations:
      - |
        Correct. After mob violence and the murder of Joseph Smith in 1844, Brigham Young led the Saints to land then outside the United States.
      - |
        The migration was organised by the church, not the federal government, and began before the Cession.
      - |
        Slavery was not the purpose of the migration; Utah's later status was decided under popular sovereignty in 1850.
      - |
        The Mormon trek began before the gold discovery of January 1848.
    answer: 0
    explanation: |
      Causation of migration: religious persecution as well as economic opportunity moved people west (theme MIG).

  - slug: apush-u05-exam-q12
    type: multiple_choice
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Opposition to the Mexican–American War in the United States came most strongly from
    options:
      - "Southern Democrats who wanted to annex Texas"
      - "Polk's own cabinet"
      - "Northern Whigs and abolitionists who saw it as an unjust war to expand slavery"
      - "Western settlers in Oregon"
    option_explanations:
      - |
        Southern Democrats were the war's strongest supporters; Texas had already been annexed in 1845.
      - |
        Polk's cabinet supported the war; some members wanted even more Mexican territory.
      - |
        Correct. Whigs such as Lincoln (the Spot Resolutions) and writers such as Thoreau attacked the war as presidential aggression in the interest of slavery.
      - |
        Western settlers and expansionists generally supported the war.
    answer: 2
    explanation: |
      Perspectives on war: the debate over the Mexican War rehearsed the sectional arguments of the 1850s.

  # ---- Standalone: sectional crisis (5.4, 5.5)
  - slug: apush-u05-exam-q13
    type: multiple_choice
    topic_code: "5.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which part of the Compromise of 1850 most increased antislavery feeling in the North?
    options:
      - "The settlement of the Texas boundary"
      - "The ban on the slave trade in the District of Columbia"
      - "The Fugitive Slave Act"
      - "The admission of California as a free state"
    option_explanations:
      - |
        The Texas boundary settlement was a technical matter that aroused little feeling.
      - |
        Ending the D.C. slave trade was also a Northern gain.
      - |
        Correct. It denied accused fugitives a jury or testimony and compelled citizens to help, bringing slavery's enforcement into Northern communities.
      - |
        California's free-state admission was a Northern gain that pleased antislavery voters.
    answer: 2
    explanation: |
      Causation (unintended effects): the compromise's concession to the South did more to radicalise the North than any other measure.

  - slug: apush-u05-exam-q14
    type: multiple_choice
    topic_code: "5.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Harriet Beecher Stowe's Uncle Tom's Cabin (1852) was significant chiefly because it
    options:
      - "argued that slavery was a positive good"
      - "persuaded Southern planters to free their enslaved workers"
      - "made the human cost of slavery, especially the breakup of families, vivid to a mass Northern readership"
      - "was the official platform of the Republican Party"
    option_explanations:
      - |
        The positive-good argument was the proslavery position Stowe opposed.
      - |
        White Southerners denounced the novel and wrote rebuttals; it freed no one directly.
      - |
        Correct. It sold about 300,000 copies in its first year in the United States, was adapted for the stage, and hardened Northern opposition to the Fugitive Slave Act.
      - |
        The Republican Party did not exist until 1854, and a novel was not a platform.
    answer: 2
    explanation: |
      Culture and politics (theme ARC): print culture shaped sectional opinion in the 1850s.

  - slug: apush-u05-exam-q15
    type: multiple_choice
    topic_code: "5.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following best describes the Southern economy in 1860?
    options:
      - "It was more industrialised than the Northern economy."
      - "It had abandoned cotton for tobacco after the Panic of 1857."
      - "It was prosperous and dominated by cotton, with wealth concentrated in land and about four million enslaved people, but it had little industry."
      - "It depended mainly on immigrant wage labor."
    option_explanations:
      - |
        The North had far more factories, railroads and industrial workers.
      - |
        Cotton prices recovered quickly after 1857, and cotton remained dominant.
      - |
        Correct. Cotton made planters among the richest Americans, but investment flowed into land and enslaved people rather than factories or railroads.
      - |
        Enslaved labor, not immigrant wage labor, drove Southern agriculture.
    answer: 2
    explanation: |
      Comparison of regional economies (topic 5.5): prosperity without diversification left the South weaker in a long war.

  - slug: apush-u05-exam-q16
    type: multiple_choice
    topic_code: "5.6"
    source: "general knowledge"
    points: 1
    prompt: |
      The Republican Party in 1856 differed from the Whig Party of the 1840s in that the Republicans
    options:
      - "favoured immediate abolition in the Southern states"
      - "opposed tariffs and internal improvements"
      - "drew their support almost entirely from the free states and made opposition to slavery's expansion their central principle"
      - "won strong support in the Deep South"
    option_explanations:
      - |
        Republicans opposed slavery's expansion, not slavery in the existing states.
      - |
        Republicans, like Whigs, generally favoured tariffs and internal improvements.
      - |
        Correct. The Whigs had been a national party with Southern and Northern wings; the Republicans were a purely sectional party organised around free soil.
      - |
        Republicans won no Southern states and were barely organised there.
    answer: 2
    explanation: |
      Comparison and continuity: the economic programme continued from the Whigs, but the sectional base was new.

  # ---- Standalone: war and Reconstruction (5.8–5.12)
  - slug: apush-u05-exam-q17
    type: multiple_choice
    topic_code: "5.8"
    source: "general knowledge"
    points: 1
    prompt: |
      The Union victories at Gettysburg and Vicksburg in July 1863 were significant because they
    options:
      - "led Lincoln to issue the preliminary Emancipation Proclamation"
      - "ended Confederate hopes of a successful invasion of the North and gave the Union control of the Mississippi River"
      - "caused Britain to declare war on the Confederacy"
      - "led to the immediate surrender of the Confederacy"
    option_explanations:
      - |
        The preliminary proclamation followed Antietam in September 1862.
      - |
        Correct. Lee never again invaded the North, and the fall of Vicksburg split the Confederacy and fulfilled a central aim of the Anaconda Plan.
      - |
        Britain stayed neutral throughout the war.
      - |
        The war continued for nearly two more years.
    answer: 1
    explanation: |
      Chronology and significance: know which battle connects to which political consequence.

  - slug: apush-u05-exam-q18
    type: multiple_choice
    topic_code: "5.8"
    source: "general knowledge"
    points: 1
    prompt: |
      The Confederacy's hope that Britain would intervene on its behalf failed for all of the following reasons EXCEPT
    options:
      - "new sources of cotton in Egypt and India"
      - "British reluctance, after the Emancipation Proclamation, to support a slaveholding nation"
      - "large British stockpiles of cotton from the bumper crops before the war"
      - "Britain's formal alliance with Mexico against the United States"
    option_explanations:
      - |
        Britain developed alternative supplies, reducing the leverage of King Cotton, so this was a real reason.
      - |
        Emancipation made the war a moral cause in Britain, where slavery had been abolished since the 1830s, so this was a real reason.
      - |
        Stockpiles from the record crops of 1859–60 cushioned British mills in the first years of the war, so this was a real reason.
      - |
        Correct. There was no such alliance; Britain stayed neutral and dealt with both the Union and the Confederacy unofficially.
    answer: 3
    explanation: |
      America in the world (WOR): diplomacy decided whether material advantages would be offset by foreign aid. Read EXCEPT questions carefully.

  - slug: apush-u05-exam-q19
    type: multiple_choice
    topic_code: "5.9"
    source: "general knowledge"
    points: 1
    prompt: |
      Lincoln's suspension of the writ of habeas corpus during the Civil War is best used as evidence for which claim?
    options:
      - "The war reduced the power of the federal government."
      - "The Confederacy protected civil liberties more consistently than the Union."
      - "The war expanded executive power at the expense of civil liberties."
      - "The Supreme Court strongly supported all of Lincoln's wartime measures."
    option_explanations:
      - |
        Suspension of habeas corpus is an expansion, not a reduction, of federal power.
      - |
        The Confederacy also suspended habeas corpus and conscripted aggressively.
      - |
        Correct. Thousands of civilians were detained by military authority; Chief Justice Taney protested in Ex parte Merryman, and Ex parte Milligan (1866) later limited military trials.
      - |
        Taney's protest and Milligan show judicial resistance, not uniform support.
    answer: 2
    explanation: |
      Claims and evidence: match a piece of evidence to the argument it supports.

  - slug: apush-u05-exam-q20
    type: multiple_choice
    topic_code: "5.10"
    source: "general knowledge"
    points: 1
    prompt: |
      The Black Codes passed by Southern states in 1865–1866 contributed most directly to
    options:
      - "Northern support for congressional Reconstruction, including the Civil Rights Act of 1866 and the Fourteenth Amendment"
      - "the election of Andrew Johnson in 1868"
      - "the repeal of the Thirteenth Amendment"
      - "the immediate end of federal involvement in the South"
    option_explanations:
      - |
        Correct. Laws restricting freedpeople's labor and rights convinced moderate Republicans that the South was restoring slavery by other means.
      - |
        Johnson was not elected in 1868; Grant was. Johnson had been impeached that year.
      - |
        The Thirteenth Amendment was never repealed.
      - |
        The codes provoked more federal involvement, not less.
    answer: 0
    explanation: |
      Causation: Southern actions under presidential Reconstruction produced congressional Reconstruction.

  - slug: apush-u05-exam-q21
    type: multiple_choice
    topic_code: "5.10"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following was a lasting achievement of the Reconstruction state governments in the South?
    options:
      - "The permanent redistribution of plantation land to freedpeople"
      - "The establishment of the region's first systems of public education"
      - "The abolition of the poll tax and literacy tests"
      - "The integration of all public schools"
    option_explanations:
      - |
        Land was never redistributed on a large scale.
      - |
        Correct. Biracial Republican legislatures created public school systems that survived Redemption, though usually segregated and underfunded.
      - |
        Poll taxes and literacy tests were imposed after Reconstruction to disfranchise Black men.
      - |
        Schools were almost everywhere separate; New Orleans briefly integrated some schools.
    answer: 1
    explanation: |
      Evaluating change: identify what lasted beyond 1877, a key move for a complexity point.

  - slug: apush-u05-exam-q22
    type: multiple_choice
    topic_code: "5.11"
    source: "general knowledge"
    points: 1
    prompt: |
      The Supreme Court's decisions in the Slaughterhouse Cases (1873) and United States v. Cruikshank (1876) contributed to the failure of Reconstruction by
    options:
      - "declaring the Reconstruction Acts unconstitutional and removing all troops"
      - "ruling that the Fifteenth Amendment had never been ratified"
      - "narrowing the protections of the Fourteenth Amendment and limiting federal power to punish violence against Black citizens"
      - "requiring the segregation of public accommodations"
    option_explanations:
      - |
        The Court did not strike down the Reconstruction Acts; troops were withdrawn by political decision in 1877.
      - |
        The Court accepted the Fifteenth Amendment as valid.
      - |
        Correct. Slaughterhouse read privileges or immunities narrowly; Cruikshank held that the amendment did not reach private violence, freeing the Colfax attackers.
      - |
        The Court did not require segregation; it permitted it in Plessy (1896).
    answer: 2
    explanation: |
      Causation (failure of Reconstruction): the courts were one of several forces, along with violence and Northern retreat.

  - slug: apush-u05-exam-q23
    type: multiple_choice
    topic_code: "5.12"
    source: "general knowledge"
    points: 1
    prompt: |
      The Compromise of 1850 and the Compromise of 1877 were similar in that both
    options:
      - "ended slavery in the territories"
      - "admitted new free states to the Union"
      - "were negotiated by Stephen Douglas"
      - "traded sectional concessions to preserve national political stability, at the expense of the interests of African Americans"
    option_explanations:
      - |
        Neither ended slavery in the territories; the 1850 compromise left it to popular sovereignty, and slavery was abolished in 1865.
      - |
        Only 1850 admitted a state (California); 1877 settled a presidential election.
      - |
        Douglas died in 1861; he had nothing to do with 1877.
      - |
        Correct. The 1850 compromise strengthened the Fugitive Slave Act; the 1877 bargain ended federal protection of Black rights in the South.
    answer: 3
    explanation: |
      Comparison (topic 5.12): name a real similarity and be ready to explain the difference in what was at stake.

  - slug: apush-u05-exam-q24
    type: multiple_choice
    topic_code: "5.12"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following represents the greatest change in the South between 1850 and 1877?
    options:
      - "The political dominance of the Democratic Party by 1877"
