    answer: 2
    explanation: |
      Continuity and change across periods: the Reconstruction amendments rewrote the compromises of 1787 (topic 3.9).

  # ---- Stimulus set E: the election of 1876 (5.11)
  - slug: apush-u05-exam-q28
