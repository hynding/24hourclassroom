  # ---- True / false
  - slug: apush-u05-exam-q39
    type: true_false
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: The Treaty of Guadalupe Hidalgo offered Mexicans living in the ceded territory the opportunity to become United States citizens.
    answer: true
    explanation: |
      True. Those who stayed and did not declare an intention to remain Mexican citizens within a year became eligible for U.S. citizenship, and the treaty promised to protect their property. In practice many lost land through litigation, debt and force.

  - slug: apush-u05-exam-q40
    type: true_false
    topic_code: "5.8"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: More Civil War soldiers died of disease than of wounds received in battle.
    answer: true
    explanation: |
      True. Disease, including dysentery, typhoid and pneumonia, killed about twice as many soldiers as combat. Camps were crowded and unsanitary, and medicine had not yet accepted germ theory.

  - slug: apush-u05-exam-q41
    type: true_false
    topic_code: "5.10"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: The Senate voted to remove Andrew Johnson from office in 1868.
    answer: false
    explanation: |
      False. The House impeached Johnson, but the Senate fell one vote short of the two-thirds needed to convict, so he finished his term. Moderates feared weakening the presidency and disliked his likely successor.

  - slug: apush-u05-exam-q42
    type: true_false
    topic_code: "4.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Review. True or false: The transportation and market revolution of 1800–1848 tied the Northwest (the Midwest) more closely to the Northeast than to the South, which shaped wartime loyalties.
    answer: true
    explanation: |
      True. Canals such as the Erie and, later, east–west railroads redirected Midwestern trade from the Mississippi toward Eastern cities. By 1861 the Old Northwest's economy and politics were bound to the Northeast, and it stayed with the Union.

