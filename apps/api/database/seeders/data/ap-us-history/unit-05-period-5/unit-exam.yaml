        The Confederacy did not request abolition.
      - |
        The Court never ruled against the proclamation.
      - |
        The proclamation applied to areas in rebellion, not the North.
      - |
        Correct. Slavery remained legal in Kentucky and Delaware into 1865, and Lincoln feared courts might void a wartime measure in peacetime.
    answer: 3
    explanation: |
      Historical situation: the amendment completed what the proclamation began.

  - slug: apush-u05-exam-q26
    type: multiple_choice
    topic_code: "5.11"
    source: "Primary source: Thirteenth Amendment, Section 1 (ratified 1865), National Archives, Milestone Documents"
    points: 1
    stimulus: *ex13
    prompt: |
      Southern states after Reconstruction most directly exploited which feature of the amendment?
    options:
      - "Its requirement that freedpeople receive land"
      - "Its application only to the territories"
      - "Its failure to define citizenship"
      - "The exception permitting involuntary servitude as punishment for crime, used with vagrancy laws and convict leasing"
    option_explanations:
      - |
        The amendment says nothing about land; redistribution was never adopted.
      - |
        The amendment applies throughout the United States, as the text says.
      - |
        Citizenship was addressed by the Fourteenth Amendment; the issue here is forced labor.
      - |
        Correct. Arrests for vagrancy and petty crimes fed a convict-leasing system that rented prisoners, mostly Black men, to planters, mines and railroads.
    answer: 3
    explanation: |
      Close reading: the exception clause is a short phrase with long consequences, carried into Unit 6.

  - slug: apush-u05-exam-q27
    type: multiple_choice
    topic_code: "3.9"
    source: "Primary source: Thirteenth Amendment, Section 1 (ratified 1865), National Archives, Milestone Documents"
    points: 1
    stimulus: *ex13
    prompt: |
      Review. The amendment reversed the original Constitution's accommodation of slavery, which had included
    options:
      - "a ban on the Atlantic slave trade effective in 1789"
      - "a list of states where slavery was permanently legal"
      - "the three-fifths clause and the fugitive slave clause"
      - "an explicit guarantee that slavery could expand into all territories"
    option_explanations:
      - |
        The Constitution barred Congress from banning the slave trade before 1808, not after 1789.
      - |
        No such list existed; slavery was left to the states.
      - |
        Correct. The 1787 Constitution counted three-fifths of enslaved people for representation, required the return of people escaping slavery, and protected the slave trade until 1808, all without using the word slavery.
