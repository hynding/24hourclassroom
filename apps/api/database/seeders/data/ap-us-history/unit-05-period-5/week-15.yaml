    # ---- Short answer (SAQ)
    - slug: apush-u05-w15-q23
      type: short_answer
      topic_code: "5.7"
      source: "Primary source: Declaration of the Immediate Causes Which Induce and Justify the Secession of South Carolina from the Federal Union (December 24, 1860), Avalon Project, Yale Law School"
      points: 3
      stimulus: |
        "... an increasing hostility on the part of the non-slaveholding States to the institution of slavery, has led to a disregard of their obligations ... they have denounced as sinful the institution of slavery; they have permitted open establishment among them of societies, whose avowed object is to disturb the peace and to eloign the property of the citizens of other States. ...

        A geographical line has been drawn across the Union, and all the States north of that line have united in the election of a man to the high office of President of the United States, whose opinions and purposes are hostile to slavery."

        — South Carolina secession convention, Declaration of the Immediate Causes, adopted December 24, 1860
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the main reason the document gives for secession.
        (b) Briefly explain ONE development from 1850 to 1860 that the authors would point to as evidence of the "hostility" they describe.
        (c) Briefly explain ONE way the document's purpose or audience shapes its argument.
      answer: |
        (a) South Carolina says it is leaving the Union because the free states have become hostile to slavery, have failed to honour their constitutional duties to return fugitives, tolerate abolitionist societies, and have now elected a president hostile to slavery by a purely sectional vote.
        (b) Northern resistance to the Fugitive Slave Act of 1850, including personal liberty laws and crowd rescues such as the Anthony Burns case, showed (in the authors' eyes) that Northern states refused their obligations; Lincoln's sectional victory in 1860 completed the threat.
        (c) The convention wanted to justify secession to other slave states and to the world as a lawful response to Northern violations of the Constitution, so it stresses broken "obligations" and property rights rather than presenting secession as revolution.
      explanation: |
        Three points.

        (a) 1 pt: the defence of slavery against Northern hostility, the North's failure to enforce the Constitution's fugitive clause, or the election of an antislavery president by a sectional vote. Zero for "states' rights" or "tariffs" without connection to slavery; the document's stated cause is slavery.

        (b) 1 pt for a specific development with explanation: personal liberty laws; rescues of fugitives (Shadrach Minkins, Jerry, Anthony Burns); Uncle Tom's Cabin; the rise of the Republican Party; the Northern reaction to John Brown's raid; Lincoln's election by free states alone.

        (c) 1 pt for explaining how purpose, audience or situation shapes the argument: written to persuade other Southern states to follow, to justify secession as legal and defensive, or to rally white South Carolinians, which explains its emphasis on constitutional obligation and property. Zero for a bare label ("it is biased").

    - slug: apush-u05-w15-q24
      type: short_answer
      topic_code: "5.5"
      source: "Secondary sources written for this course; general knowledge"
      points: 3
      stimulus: |
        Interpretation A (written for this course): "The Civil War was not inevitable. Ordinary Northerners and Southerners shared more than divided them. A generation of reckless politicians and agitators inflamed a manageable dispute over the territories until compromise became impossible."

        Interpretation B (written for this course): "The sections had built two incompatible societies, one resting on free labor and one on slavery. Each needed the West, and each came to see the other as a threat to its way of life. Compromise could postpone the conflict, but not prevent it."

        (A resembles the "blundering generation" view of some historians of the 1930s and 1940s; B resembles the "irrepressible conflict" view, a phrase first used by William Seward in 1858.)
      prompt: |
        Using the excerpts, answer (a), (b) and (c).

        (a) Briefly describe ONE major difference between Interpretation A and Interpretation B.
        (b) Briefly explain how ONE specific historical event or development from 1844 to 1861 not mentioned in the excerpts could be used to support Interpretation A.
        (c) Briefly explain how ONE specific historical event or development from 1844 to 1861 not mentioned in the excerpts could be used to support Interpretation B.
      answer: |
        (a) A blames political leaders and agitators for turning a solvable dispute into war, while B argues that deep economic and social differences between a free-labor North and a slave South made conflict unavoidable.
        (b) The Kansas-Nebraska Act supports A: Stephen Douglas reopened a question the Missouri Compromise had settled for 34 years, partly to win a railroad route and Southern support, and set off violence that need not have happened.
        (c) The election of 1860 supports B: the vote split entirely by section, the last national party broke apart, and the Lower South seceded because Lincoln's free-labor platform threatened the expansion slavery depended on.
      explanation: |
        Three points.

        (a) 1 pt for a real difference: politicians' choices versus structural differences; avoidable versus inevitable; agitators versus incompatible systems. Zero for describing only one interpretation.

        (b) 1 pt for specific evidence linked to A: Kansas-Nebraska and Douglas's motives; the Lecompton fraud; Brooks's caning of Sumner; fire-eaters such as William Yancey pushing the Democratic split; the Compromise of 1850 showing compromise could work.

        (c) 1 pt for specific evidence linked to B: free labor ideology versus the positive-good argument; the sectional vote on the Wilmot Proviso; the collapse of national parties; Dred Scott and the Republican response; the election of 1860; secession documents citing slavery. Zero for evidence from outside 1844–1861 or with no explanation.

    # ---- Long essay (LEQ)
    - slug: apush-u05-w15-q25
      type: long_answer
      topic_code: "5.6"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1850 and 1861 Americans tried repeatedly to settle the question of slavery in the territories through legislation, the courts and elections. Each attempt left the sections further apart.

        Evaluate the relative importance of the reasons that compromise failed in the period from 1850 to 1861.
      answer: |
        Thesis: Compromise failed above all because every new settlement over the territories, from the Fugitive Slave Act to Dred Scott, forced Northerners and Southerners to act against convictions about slavery and free labor that had hardened into incompatible ideologies; the collapse of the national parties then removed the machinery that had made earlier compromises possible.

        Context: Mexican Cession and the Wilmot Proviso; the Missouri Compromise and second party system as the old machinery; cotton expansion and Northern growth.

        Body 1 (laws that backfired): the Fugitive Slave Act and Northern resistance (Burns, personal liberty laws, Uncle Tom's Cabin); Kansas-Nebraska repealing the Missouri line.
        Body 2 (violence and the courts): Bleeding Kansas, Sumner's caning, Dred Scott ruling out congressional limits, John Brown.
        Body 3 (party collapse): Whigs and Know-Nothings dissolve; Republicans form as a Northern party; Democrats split in 1860; Lincoln wins with free states alone; secession.

        Complexity: weigh ideology against politicians' choices (Douglas, Buchanan) and show how each failure caused the next.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): 1 pt for a defensible claim that weighs reasons, e.g. "the Kansas-Nebraska Act mattered most because it destroyed the party system," or "ideological polarisation mattered more than any single law."

        Contextualization (0–1): 1 pt for describing the broader context, such as the Mexican Cession and the Wilmot Proviso, the Missouri Compromise, the second party system's cross-sectional coalitions, or the economic divergence of the regions.

        Evidence (0–2): 1 pt for two specific examples (Compromise of 1850, Fugitive Slave Act, Uncle Tom's Cabin, Kansas-Nebraska, Bleeding Kansas, Republican founding, Sumner caning, Dred Scott, Lecompton, Lincoln–Douglas debates, Harpers Ferry, the 1860 election, Crittenden Compromise). 2 pts for using evidence to support an argument about why compromise failed.

        Analysis and reasoning (0–2): 1 pt for using causation to frame the argument. 1 pt for complex understanding: e.g. explaining how the failure of one compromise caused the next, weighing structural against contingent causes, or considering the perspectives of Northern Democrats, Republicans, Southern Unionists and fire-eaters.
