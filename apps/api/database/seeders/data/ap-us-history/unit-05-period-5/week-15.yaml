week: 15
unit: 5
title: "Compromise, Sectional Conflict and Secession"
topics: ["5.4", "5.5", "5.6", "5.7"]
guide: guides/week-15.md
guide_description: |
  How the Union came apart in eleven years: the Compromise of 1850 and the Fugitive Slave Act, the economic and
  ideological gap between free-labor North and slaveholding South, the Kansas-Nebraska Act, Bleeding Kansas, Dred
  Scott, John Brown, the election of 1860 and the secession of the Lower South. Worked examples: reading the 1860
  returns, sourcing South Carolina's declaration of causes, and turning an LEQ prompt into a thesis.
flashcards_description: |
  32 cards on the Compromise of 1850, the regional economies and ideologies, the crises of the 1850s, the
  election of 1860 and secession.

flashcards:
  - front: Compromise of 1850 → the five measures
    back: |
      (1) California admitted as a free state; (2) New Mexico and Utah organised with slavery left to popular sovereignty; (3) the Texas–New Mexico boundary settled, with the federal government assuming Texas's debt; (4) the slave trade (not slavery) abolished in the District of Columbia; (5) a much stronger Fugitive Slave Act.
    hint: CA free, NM/UT decide, TX paid, DC trade ends, fugitives returned.
    topic_code: "5.4"
  - front: Henry Clay and Stephen Douglas → their roles in the Compromise of 1850
    back: |
      Clay, the aging Whig "Great Compromiser," proposed the package as one omnibus bill, which failed in July 1850. Douglas, a Democratic senator from Illinois, then broke it into separate bills and passed each with a different coalition, so very few members voted for the whole compromise.
    topic_code: "5.4"
  - front: Fugitive Slave Act (1850) → four provisions that outraged the North
    back: |
      Federal commissioners decided cases without a jury; the accused could not testify; commissioners got $10 for returning a person and $5 for freeing one; and citizens could be commanded to help catch fugitives, with fines and jail for anyone who aided an escape. Free Black northerners could be kidnapped under it.
    topic_code: "5.4"
  - front: Daniel Webster's Seventh of March speech (1850) → position and reaction
    back: |
      The Massachusetts Whig supported Clay's compromise, including the Fugitive Slave Act, as the price of preserving the Union. Northern antislavery voters, who had seen him as their champion, denounced him as a traitor; the speech shows how unpopular compromise had become in the North.
    topic_code: "5.4"
  - front: William H. Seward's "higher law" (1850)
    back: |
      The New York senator opposed the Compromise of 1850, arguing that a higher law than the Constitution forbade the extension of slavery into the territories. Southerners took it as proof that Northern leaders would not honour constitutional protections for slavery.
    topic_code: "5.4"
  - front: John C. Calhoun's last Senate speech (March 1850) → demands
    back: |
      Too ill to deliver it himself, Calhoun warned that the Union could survive only if the North stopped agitating against slavery, enforced the return of fugitives and accepted equality for the South in the territories, ideally a constitutional amendment restoring sectional balance. He died weeks later.
    topic_code: "5.4"
  - front: Uncle Tom's Cabin (1852) → author and effect
    back: |
      Harriet Beecher Stowe's novel, written in response to the Fugitive Slave Act, sold about 300,000 copies in its first year in the United States. It made slavery's cruelty, especially the separation of families, vivid to Northern readers; white Southerners denounced it as slander and wrote replies.
    topic_code: "5.5"
  - front: Anthony Burns case (Boston, 1854) → what happened and why it mattered
    back: |
      A man who had escaped slavery in Virginia was arrested in Boston; an abolitionist crowd tried to free him, and the federal government sent troops and a ship to return him at a cost of tens of thousands of dollars. It turned many moderate New Englanders against the Fugitive Slave Act.
    topic_code: "5.4"
  - front: Personal liberty laws → what and why
    back: |
      Northern state laws, several passed after 1850, that guaranteed jury trials to alleged fugitives, barred state officials and jails from helping recapture, or punished kidnapping. White Southerners pointed to them as Northern nullification of a federal law and listed them among the causes of secession.
    topic_code: "5.4"
  - front: Kansas-Nebraska Act (1854) → what it did and why Douglas wanted it
    back: |
      It organised Kansas and Nebraska territories under popular sovereignty, which repealed the Missouri Compromise ban on slavery north of 36°30'. Douglas wanted the territories organised for a central transcontinental railroad through Chicago and needed Southern votes. It destroyed the Whigs and created the Republican Party.
    topic_code: "5.6"
  - front: Bleeding Kansas (1854–1858) → three incidents
    back: |
      Thousands of Missourians crossed to vote illegally and produced a proslavery legislature; free-state settlers set up a rival government. Proslavery forces sacked the free-state town of Lawrence (May 1856); John Brown and his sons killed five proslavery settlers at Pottawatomie Creek days later. About 50–60 people died in the violence.
    topic_code: "5.6"
  - front: Caning of Charles Sumner (May 1856) → cause and reactions
    back: |
      South Carolina congressman Preston Brooks beat Senator Sumner unconscious at his Senate desk after Sumner's "Crime Against Kansas" speech insulted Brooks's relative, Senator Andrew Butler. Northerners saw Southern barbarism; many Southerners sent Brooks new canes. Violence had reached Congress itself.
    topic_code: "5.6"
  - front: Lecompton Constitution (1857) → what and the fallout
    back: |
      A proslavery constitution for Kansas written by a minority and ratified in a rigged vote. President Buchanan backed it; Douglas opposed it as a fraud on popular sovereignty. The fight split the Democratic Party North against South, and Kansas voters rejected it overwhelmingly in 1858.
    topic_code: "5.6"
  - front: Republican Party (founded 1854) → who and what it stood for
    back: |
      Formed by antislavery Whigs, Free-Soil Democrats and some Know-Nothings in reaction to the Kansas-Nebraska Act. It opposed the expansion of slavery into the territories (not slavery in the states) and championed free labor, a homestead law, tariffs and internal improvements. It was a purely Northern party.
    topic_code: "5.6"
  - front: Election of 1856 → candidates and meaning
    back: |
      Democrat James Buchanan won over Republican John C. Frémont and Know-Nothing Millard Fillmore. Frémont carried 11 free states two years after the party was founded, which showed that a purely Northern party could nearly win the presidency.
    topic_code: "5.6"
  - front: Dred Scott v. Sandford (1857) → the three rulings
    back: |
      Chief Justice Roger Taney held that (1) Black people, free or enslaved, were not citizens and could not sue in federal court; (2) residence in free territory did not make Scott free; (3) Congress had no power to bar slavery from the territories, so the Missouri Compromise had been unconstitutional. It endorsed Calhoun's position and gutted the Republican platform.
    topic_code: "5.6"
  - front: Lincoln–Douglas debates (1858) → why they mattered
    back: |
      Seven debates in the Illinois Senate race. Douglas won the seat, but Lincoln became a national figure by pressing Douglas to reconcile popular sovereignty with Dred Scott. Douglas's answer (the Freeport Doctrine) cost him Southern support for 1860.
    topic_code: "5.6"
  - front: Freeport Doctrine (1858) → Douglas's answer and its cost
    back: |
      Douglas said settlers could still keep slavery out of a territory by refusing to pass the local police laws slavery needed, whatever the Court ruled. Northerners found it evasive; Southern Democrats found it a betrayal of Dred Scott, which helped split the party in 1860.
    topic_code: "5.6"
  - front: Lincoln's "House Divided" speech (June 1858) → argument
    back: |
      Accepting the Illinois Republican Senate nomination, Lincoln said the government could not "endure, permanently half slave and half free" and that the nation would become "all one thing, or all the other." Southerners read it as a promise to destroy slavery; Lincoln meant that slavery must be put on the road to ultimate extinction by stopping its spread.
    topic_code: "5.6"
  - front: John Brown's raid on Harpers Ferry (October 1859) → aims and reactions
    back: |
      Brown and 21 men seized the federal arsenal in Virginia hoping to arm an uprising of enslaved people; marines under Robert E. Lee captured him, and he was hanged for treason against Virginia. Some Northerners mourned him as a martyr; white Southerners took the mourning as proof that the North wanted slave insurrection.
    topic_code: "5.6"
  - front: Election of 1860 → candidates and results
    back: |
      Lincoln (Republican) won 180 electoral votes and about 40% of the popular vote, all from free states. Northern Democrat Douglas, Southern Democrat John C. Breckinridge and Constitutional Union candidate John Bell split the rest. Lincoln was not on the ballot in most Southern states, yet he would have won the electoral college even if his opponents had combined.
    topic_code: "5.7"
  - front: Secession of the Lower South (December 1860–February 1861)
    back: |
      South Carolina seceded on December 20, 1860, followed by Mississippi, Florida, Alabama, Georgia, Louisiana and Texas. The seven met at Montgomery in February 1861, formed the Confederate States of America and chose Jefferson Davis as president. All seven were deep cotton states with the highest shares of enslaved people.
    topic_code: "5.7"
  - front: Crittenden Compromise (1860–1861) → proposal and fate
    back: |
      Kentucky senator John J. Crittenden proposed constitutional amendments to restore the 36°30' line to the Pacific, protecting slavery south of it in all present and future territory. Lincoln opposed any extension of slavery into the territories, Republicans blocked it, and it failed.
    topic_code: "5.7"
  - front: Fort Sumter (April 12, 1861) → why it began the war
    back: |
      Lincoln announced he would resupply the federal fort in Charleston harbour with food only. Confederates fired first and forced its surrender; Lincoln called for 75,000 volunteers, and Virginia, North Carolina, Tennessee and Arkansas then seceded rather than fight fellow slave states.
    topic_code: "5.7"
  - front: Free labor ideology → what Republicans meant by it
    back: |
      The belief that a man working for wages could save, buy land or a shop, and become independent, so a society of free labor promised mobility. Slavery degraded work and blocked opportunity for white men, so it must not spread into the West, where future free laborers would settle.
    topic_code: "5.5"
  - front: Regional economies in 1860 → three North–South contrasts
    back: |
      The North had most of the nation's factories, railroad mileage, banks and population, and a growing immigrant workforce. The South had about four million enslaved people, produced most of the world's cotton, and invested its wealth in land and enslaved people rather than industry. Both were tied together by trade, through Northern shipping and banks.
    topic_code: "5.5"
  - front: Proslavery "positive good" argument → claims and spokesmen
    back: |
      Calhoun, George Fitzhugh and others argued slavery was not a necessary evil but a positive good: a paternalist order that cared for workers better than Northern "wage slavery" and was sanctioned by the Bible and history. It hardened Southern opinion against any limit on slavery.
    topic_code: "5.5"
  - front: Hinton Rowan Helper, The Impending Crisis of the South (1857)
    back: |
      A North Carolinian's book arguing that slavery impoverished non-slaveholding white Southerners. Republicans circulated it as a campaign document, and Southern states banned it, which shows how much slaveholders feared division among white Southerners.
    topic_code: "5.5"
  - front: James Henry Hammond's King Cotton speech (Senate, 1858) → claim and flaw
    back: |
      The South Carolina senator argued that the world, especially Britain's textile mills, depended on Southern cotton and that no power would dare make war on it. The South's quick recovery from the Panic of 1857 seemed to prove it; in the war, Britain found other suppliers and the strategy of cotton diplomacy failed.
    topic_code: "5.5"
  - front: Ostend Manifesto (1854) → what and reaction
    back: |
      A confidential memo by three U.S. diplomats urging the purchase of Cuba from Spain, or its seizure if Spain refused. When it was published, Northerners denounced it as a plot to add slave territory, and the Pierce administration disavowed it.
    topic_code: "5.6"
  - front: Collapse of the second party system (1852–1856) → cause and effect
    back: |
      The Whigs split North and South over the Kansas-Nebraska Act and disappeared; nativist Know-Nothings rose and fell. By 1856 the main parties were a Northern Republican Party and a Democratic Party increasingly controlled by the South. With no national parties left except a fracturing Democracy, compromise lost its machinery.
    topic_code: "5.6"
  - front: Compare the Compromise of 1850 and the Kansas-Nebraska Act → method and result
    back: |
      Both used popular sovereignty for territories. The Compromise of 1850 applied it to new Mexican land, where the Missouri line had never reached, and bought a few years' calm. Kansas-Nebraska applied it to land already closed to slavery by the Missouri line, so it looked like a broken promise and set off violence and party realignment.
    topic_code: "5.6"

quiz:
  description: |
    25 questions · about 40 minutes · about 70% this week (the Compromise of 1850, regional differences, the
    failure of compromise and secession) and 30% review of week 14 and Period 4. Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the two short answers
    and the long essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: the Fugitive Slave Act (5.4, with review of 4.12)
    - slug: apush-u05-w15-q01
      type: multiple_choice
      topic_code: "5.4"
      source: "Primary source: Fugitive Slave Act of 1850, sections 6–8, Avalon Project, Yale Law School"
      points: 1
      stimulus: &w15fsa |
        "In no trial or hearing under this act shall the testimony of such alleged fugitive be admitted in evidence ...

        ... all good citizens are hereby commanded to aid and assist in the prompt and efficient execution of this law, whenever their services may be required, as aforesaid, for that purpose ...

        [The commissioner] shall be entitled to a fee of ten dollars in full for his services in each case ... or a fee of five dollars in cases where the proof shall not, in the opinion of such commissioner, warrant such certificate and delivery ..."

        — Fugitive Slave Act, passed by Congress as part of the Compromise of 1850
      prompt: |
        The provisions in the excerpt most directly contributed to which of the following in the 1850s?
      options:
        - "The admission of California as a slave state"
        - "Growing Northern resistance, including state personal liberty laws and crowd actions to free captured fugitives"
        - "Southern demands that the act be repealed as too weak"
        - "A decline in the number of enslaved people who attempted to escape"
      option_explanations:
        - |
          California entered as a free state in the same compromise; the act was the South's compensation for it.
        - |
          Correct. Denying the accused a voice, paying more to send people south and conscripting bystanders made the law look like an attack on Northern liberty; states passed personal liberty laws and crowds intervened in Boston, Syracuse and Christiana.
        - |
          White Southerners demanded stricter enforcement, not repeal, and complained that the North evaded the law.
        - |
          Escapes continued, and the act's main political effect was to radicalise Northern opinion rather than to change the flow of fugitives.
      answer: 1
      explanation: |
        Causation (effects). A law meant to settle the slavery issue instead brought it into Northern towns, which is why historians call the Fugitive Slave Act the compromise's most destabilising part.

    - slug: apush-u05-w15-q02
      type: multiple_choice
      topic_code: "5.4"
      source: "Primary source: Fugitive Slave Act of 1850, sections 6–8, Avalon Project, Yale Law School"
      points: 1
      stimulus: *w15fsa
      prompt: |
        Critics of the act argued that the fee schedule in the excerpt
      options:
        - "gave commissioners a financial incentive to rule that the accused person was a fugitive"
        - "was too low to attract qualified judges"
        - "paid the accused person's legal costs"
        - "applied only to escapes from Washington, D.C."
      option_explanations:
        - |
          Correct. A commissioner earned twice as much for returning a person to slavery as for releasing him, which abolitionists cited as a bribe built into the law.
        - |
          The complaint was about the incentive, not the amount; commissioners were appointed officials, not judges seeking pay.
        - |
          The fees went to the commissioner; the accused had no right to testify, let alone have costs paid.
        - |
          The act applied throughout the United States, which is why it reached Boston and Pennsylvania.
      answer: 0
      explanation: |
        Close reading of a primary source: compare the two numbers and ask whom they reward. Then connect to purpose: the act was written to make recapture fast and certain.

    - slug: apush-u05-w15-q03
      type: multiple_choice
      topic_code: "4.12"
      source: "Primary source: Fugitive Slave Act of 1850, sections 6–8, Avalon Project, Yale Law School"
      points: 1
      stimulus: *w15fsa
      prompt: |
        Review. Free African American communities in Northern cities before 1850 were especially threatened by the act because they
      options:
        - "were located almost entirely in Southern states"
        - "had already been granted full citizenship by the Constitution"
        - "had long sheltered people escaping slavery and had no protection against false claims when the accused could not testify"
        - "were mostly composed of recent immigrants from Africa"
      option_explanations:
        - |
          The free communities most affected were in Northern cities, where escapes ended and the act was now enforced.
        - |
          The Constitution did not define citizenship until the Fourteenth Amendment (1868); Dred Scott in 1857 denied that Black people could be citizens.
        - |
          Correct. Free Black communities in Philadelphia, Boston and New York aided fugitives through vigilance committees and the Underground Railroad; under the act anyone could be claimed, so thousands fled to Canada after 1850.
        - |
          The Atlantic slave trade had been banned since 1808; Northern free Black communities were overwhelmingly American-born.
      answer: 2
      explanation: |
        Continuity and change: the free Black institutions of Period 4 (churches, vigilance committees, the Underground Railroad) became front lines in Period 5.

    # ---- Stimulus set B: Dred Scott (5.6)
    - slug: apush-u05-w15-q04
      type: multiple_choice
      topic_code: "5.6"
      source: "Primary source: Dred Scott v. Sandford, 60 U.S. 393 (1857), opinion of Chief Justice Taney, Justia U.S. Supreme Court Center"
      points: 1
      stimulus: &w15dred |
        "They had for more than a century before been regarded as beings of an inferior order, and altogether unfit to associate with the white race either in social or political relations, and so far inferior that they had no rights which the white man was bound to respect ..."

        — Chief Justice Roger B. Taney, opinion of the Court, Dred Scott v. Sandford (1857), describing how the framers' generation regarded people of African descent
      prompt: |
        Taney used this reasoning chiefly to support his conclusion that
      options:
        - "slavery must be abolished gradually in the territories"
        - "people of African descent, free or enslaved, were not citizens and could not sue in federal court"
        - "Congress had the power to ban slavery north of 36°30'"
        - "Dred Scott had become free by living in Illinois"
      option_explanations:
        - |
          The decision protected slavery in the territories; it called for no abolition at all.
        - |
          Correct. Taney argued that Black people had not been part of "the people" who made the Constitution, so Scott was not a citizen and had no standing to sue.
        - |
          The Court held the opposite: Congress had no power to bar slavery from the territories, so the Missouri Compromise line was unconstitutional.
        - |
          The Court ruled that residence in free territory did not make Scott free.
      answer: 1
      explanation: |
        Claims and evidence in a primary source: identify the argument the passage serves (no citizenship) rather than the most memorable phrase.

    - slug: apush-u05-w15-q05
      type: multiple_choice
      topic_code: "5.6"
      source: "Primary source: Dred Scott v. Sandford, 60 U.S. 393 (1857), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: *w15dred
      prompt: |
        The Dred Scott decision most directly undermined the platform of which political party?
      options:
        - "The Liberty Party of the 1840s"
        - "The Republican Party, which sought to ban slavery from the federal territories"
        - "The Southern wing of the Democratic Party"
        - "The Federalist Party"
      option_explanations:
        - |
          The Liberty Party had merged into the Free-Soilers by 1848; it was not a force in 1857.
        - |
          Correct. If Congress could not bar slavery from the territories, the Republicans' central goal was unconstitutional.
        - |
          Southern Democrats welcomed the decision; it adopted Calhoun's view that slavery could go anywhere in the territories.
        - |
          The Federalists had disappeared by the 1820s.
      answer: 1
      explanation: |
        Causation: the decision did not settle the issue as Buchanan hoped. It convinced Republicans that a "slave power" controlled the Court and forced Douglas to defend popular sovereignty at Freeport.

    - slug: apush-u05-w15-q06
      type: multiple_choice
      topic_code: "5.6"
      source: "Primary source: Dred Scott v. Sandford, 60 U.S. 393 (1857), Justia U.S. Supreme Court Center"
      points: 1
      stimulus: *w15dred
      prompt: |
        The ruling on citizenship in Dred Scott was most directly reversed by
      options:
        - "the Compromise of 1877"
        - "the Fourteenth Amendment, which made all persons born or naturalized in the United States citizens"
        - "the Kansas-Nebraska Act"
        - "the Emancipation Proclamation"
      option_explanations:
        - |
          The Compromise of 1877 ended Reconstruction; it did nothing to expand citizenship.
        - |
          Correct. Ratified in 1868, the Fourteenth Amendment's first sentence defines birthright citizenship and overturned Taney's holding.
        - |
          Kansas-Nebraska came three years before the decision.
        - |
          The proclamation freed people in rebelling areas as a war measure; it did not address citizenship.
      answer: 1
      explanation: |
        Continuity and change across Unit 5: the Reconstruction amendments (week 17) answered the questions Dred Scott raised.

    # ---- Stimulus set C: election of 1860 (5.7)
    - slug: apush-u05-w15-q07
      type: multiple_choice
      topic_code: "5.7"
      source: "Election returns, 1860: National Archives, U.S. Electoral College records; popular vote rounded from standard compilations"
      points: 1
      stimulus: &w151860 |
        The presidential election of 1860 (popular vote rounded)

        | Candidate | Party | Popular vote | Electoral votes | Where electoral votes came from |
        |---|---|---|---|---|
        | Abraham Lincoln | Republican | about 40% | 180 | Free states only |
        | Stephen A. Douglas | Democratic (Northern) | about 29% | 12 | Missouri and part of New Jersey |
        | John C. Breckinridge | Democratic (Southern) | about 18% | 72 | Lower South plus Maryland, Delaware, North Carolina, Arkansas |
        | John Bell | Constitutional Union | about 13% | 39 | Virginia, Kentucky, Tennessee |

        Source: National Archives, Electoral College results; popular-vote shares rounded.
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "Lincoln won a majority of the national popular vote."
        - "The party system had divided along sectional lines, so a candidate could win the presidency with support from only one section."
        - "Border states voted overwhelmingly for Lincoln."
        - "The Democratic Party was unified behind a single candidate."
      option_explanations:
        - |
          About 40% is a plurality, not a majority; most voters chose someone else.
        - |
          Correct. Lincoln carried only free states, yet their electoral votes were enough; the Democrats split North and South, and no party now spanned both sections.
        - |
          The border states went to Bell, Breckinridge or Douglas; Lincoln won none of the slave states.
        - |
          The Democrats ran two candidates, Douglas and Breckinridge, after their convention split.
      answer: 1
      explanation: |
        Interpreting data (the 2027 exam includes quantitative sources): find the pattern in the "where" column, not just the totals.

    - slug: apush-u05-w15-q08
      type: multiple_choice
      topic_code: "5.7"
      source: "Election returns, 1860: National Archives, U.S. Electoral College records; popular vote rounded from standard compilations"
      points: 1
      stimulus: *w151860
      prompt: |
        The Democratic Party split in 1860 chiefly because
      options:
        - "Douglas supported the Lecompton Constitution and Southern delegates opposed it"
        - "the party disagreed over the tariff, not slavery"
        - "Northern Democrats wanted immediate abolition"
        - "Southern Democrats demanded a federal slave code protecting slavery in all territories, which Douglas and Northern Democrats rejected"
      option_explanations:
        - |
          The reverse: Douglas opposed the Lecompton Constitution as a fraud, which is why the South distrusted him.
        - |
          The split was over slavery in the territories; the tariff was a secondary issue.
        - |
          Northern Democrats were not abolitionists; they supported popular sovereignty and opposed Republicans.
        - |
          Correct. After Dred Scott, Southern delegates wanted Congress to protect slavery in the territories; Douglas stood by popular sovereignty and the Freeport Doctrine, so the Lower South delegates walked out at Charleston.
      answer: 3
      explanation: |
        Causation across several weeks: Kansas, Lecompton, Dred Scott and Freeport each pushed the two wings apart until the last national party broke.

    - slug: apush-u05-w15-q09
      type: multiple_choice
      topic_code: "5.7"
      source: "Election returns, 1860: National Archives, U.S. Electoral College records; popular vote rounded from standard compilations"
      points: 1
      stimulus: *w151860
      prompt: |
        The states that seceded before Lincoln's inauguration were most likely to have
      options:
        - "voted for Douglas and to have bordered free states"
        - "voted for Breckinridge and to have had the highest proportions of enslaved people in their populations"
        - "voted for Bell and to have had large manufacturing economies"
        - "voted for Lincoln"
      option_explanations:
        - |
          Douglas won only Missouri and part of New Jersey; Missouri did not secede.
        - |
          Correct. The seven Lower South states that seceded by February 1861 all voted for Breckinridge and were the cotton states where enslaved people made up roughly 30–57% of the population.
        - |
          Bell won Upper South states (Virginia, Kentucky, Tennessee), which waited until after Fort Sumter or never seceded.
        - |
          Lincoln won no slave state at all; he was not even on the ballot in most of the South.
      answer: 1
      explanation: |
        Making connections between data and a later development: the depth of a state's commitment to slavery predicts the speed of its secession.

    # ---- Regional differences and failure of compromise (5.5, 5.6)
    - slug: apush-u05-w15-q10
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Republicans' free labor ideology in the 1850s held that
      options:
        - "all workers should be organised into national labor unions"
        - "the federal government should guarantee every family a minimum income"
        - "slavery was a positive good that protected workers"
        - "a wage earner could rise through work and saving to own a farm or shop, and slavery's spread would close off that opportunity"
      option_explanations:
        - |
          National unions came after the Civil War (the National Labor Union, 1866; the Knights of Labor); free labor ideology assumed workers would rise out of wage work.
        - |
          A guaranteed income is a twentieth-century idea, unknown to 1850s Republicans.
        - |
          The positive-good argument was the proslavery position of Calhoun and Fitzhugh.
        - |
          Correct. Free labor linked antislavery politics to Northern ideals of mobility; it opposed slavery in the territories to keep the West open to free white settlers.
      answer: 3
      explanation: |
        Comparing ideologies: free labor and the positive-good defence of slavery were rival accounts of what a just society looked like, and they hardened the sectional divide.

    - slug: apush-u05-w15-q11
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The Kansas-Nebraska Act of 1854 intensified sectional conflict primarily because it
      options:
        - "transferred land from Mexico to the United States"
        - "banned slavery in Nebraska permanently"
        - "admitted Kansas as a free state"
        - "opened land north of 36°30' to slavery by applying popular sovereignty, repealing the Missouri Compromise ban"
      option_explanations:
        - |
          Kansas and Nebraska were part of the Louisiana Purchase, not the Mexican Cession.
        - |
          The act left slavery to the settlers; it banned nothing.
        - |
          Kansas was not admitted until January 1861, after Southern senators left; the 1854 act only organised the territory.
        - |
          Correct. Northerners saw the repeal of a 34-year-old compromise as a betrayal; proslavery and free-state settlers raced into Kansas, and the act shattered the Whigs.
      answer: 3
      explanation: |
        Causation: one law produced violence (Bleeding Kansas), a new party (Republicans) and the death of an old one (Whigs).

    - slug: apush-u05-w15-q12
      type: multiple_choice
      topic_code: "5.6"
      source: "Primary source: Abraham Lincoln, House Divided speech (June 16, 1858), National Park Service, Lincoln Home National Historic Site"
      points: 1
      prompt: |
        "'A house divided against itself cannot stand.' I believe this government cannot endure, permanently half slave and half free. I do not expect the Union to be dissolved — I do not expect the house to fall — but I do expect it will cease to be divided. It will become all one thing, or all the other." (Abraham Lincoln, Springfield, Illinois, June 16, 1858)

        Many white Southerners interpreted this passage as evidence that
      options:
        - "Lincoln would accept the Lecompton Constitution"
        - "Lincoln supported popular sovereignty"
        - "the North was ready to allow peaceful secession"
        - "the Republican Party intended to destroy slavery where it already existed"
      option_explanations:
        - |
          Lincoln and the Republicans opposed Lecompton as a proslavery fraud.
        - |
          Lincoln attacked popular sovereignty, arguing that Douglas's indifference to slavery helped spread it.
        - |
          Lincoln says he does not expect the Union to be dissolved; the speech gives no hint of accepting secession.
        - |
          Correct. Although Lincoln promised not to touch slavery in the states, Southerners read "all one thing" as a threat to slavery itself, and quoted the speech in 1860.
      answer: 3
      explanation: |
        Audience and point of view: the same words meant "stop slavery's spread" to Lincoln's Illinois audience and "abolition" to white Southern readers.

    - slug: apush-u05-w15-q13
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains the different reactions to John Brown's raid on Harpers Ferry in 1859?
      options:
        - "Republican leaders publicly endorsed the raid in their 1860 platform."
        - "Many Northerners admired Brown's aims or mourned his execution, which convinced white Southerners that the North supported slave insurrection."
        - "Both sections agreed that Brown was a hero."
        - "Southerners praised Brown for exposing weaknesses in federal arsenals."
      option_explanations:
        - |
          The Republican platform of 1860 condemned armed invasion of any state, and Lincoln called Brown's act wrong.
        - |
          Correct. Church bells tolled in some Northern towns on his execution day; white Southerners concluded that the North would welcome a slave revolt, and militias drilled across the South.
        - |
          White Southerners saw Brown as a terrorist and murderer; there was no consensus.
        - |
          Southerners were horrified, not grateful; the raid fed fears of insurrection.
      answer: 1
      explanation: |
        Comparison of perspectives: the same event confirmed each section's worst fears about the other.

    # ---- Review (week 14 and Period 4)
    - slug: apush-u05-w15-q14
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The debate over the Wilmot Proviso foreshadowed the crises of the 1850s chiefly because
      options:
        - "it proposed to abolish slavery in the Southern states"
        - "it was approved unanimously by both houses"
        - "congressional votes on it divided by section rather than by party"
        - "it was introduced by a Southern senator"
      option_explanations:
        - |
          It applied only to land acquired from Mexico, not to existing slave states.
        - |
          It passed only the House and failed in the Senate.
        - |
          Correct. Northern Whigs and Democrats voted for it and Southern Whigs and Democrats against, the alignment that later destroyed the national parties.
        - |
          It was introduced by David Wilmot, a Pennsylvania Democrat in the House.
      answer: 2
      explanation: |
        Continuity from week 14: territorial expansion kept producing votes in which section beat party.

    - slug: apush-u05-w15-q15
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. California's request in 1849 to enter the Union directly as a state, skipping the territorial stage, was mainly the result of
      options:
        - "the Homestead Act"
        - "the population surge of the Gold Rush"
        - "the Mormon settlement of the Great Basin"
        - "the completion of the transcontinental railroad"
      option_explanations:
        - |
          The Homestead Act passed in 1862 and did not shape California's 1849 application.
        - |
          Correct. The Gold Rush brought tens of thousands of migrants in a single year, more than enough people for statehood under a free-state constitution.
        - |
          The Mormons settled Utah, not California, and Utah did not become a state until 1896.
        - |
          The transcontinental railroad was completed in 1869, twenty years later.
      answer: 1
      explanation: |
        Causation linking week 14 to week 15: the Gold Rush is the bridge between the Mexican Cession and the Compromise of 1850.

    - slug: apush-u05-w15-q16
      type: multiple_choice
      topic_code: "4.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. South Carolina's secession in 1860 most resembled its earlier action in the Nullification Crisis (1832–1833) in that both
      options:
        - "were ended by a compromise tariff"
        - "rested on the claim that states could resist federal authority they judged unconstitutional or dangerous to their interests"
        - "were supported by President Andrew Jackson"
        - "were provoked by the election of a Whig president"
      option_explanations:
        - |
          The Compromise Tariff of 1833 ended nullification; secession was not ended by compromise.
        - |
          Correct. Calhoun's theory of state sovereignty underlay nullification of the tariff in 1832 and secession in 1860; in both cases South Carolina led.
        - |
          Jackson threatened force against nullification and supported the Force Bill.
        - |
          Jackson was a Democrat, and Lincoln a Republican; neither crisis was triggered by a Whig president.
      answer: 1
      explanation: |
        Comparison across periods: states' rights theory connects Period 4 and Period 5, but the stakes moved from the tariff to slavery itself.

    # ---- Multi-select
    - slug: apush-u05-w15-q17
      type: multi_select
      topic_code: "5.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following were parts of the Compromise of 1850? Select all that apply.
      options:
        - "The slave trade abolished in the District of Columbia"
        - "A stronger federal Fugitive Slave Act"
        - "The repeal of the Missouri Compromise line"
        - "The admission of Kansas as a slave state"
        - "California admitted as a free state"
      option_explanations:
        - |
          Correct. The buying and selling of enslaved people, though not slavery itself, was banned in the capital.
        - |
          Correct. The new act put federal power behind recapture and was the South's main gain.
        - |
          The Missouri line was repealed by the Kansas-Nebraska Act of 1854, not in 1850.
        - |
          Kansas was not organised until 1854 and entered as a free state in 1861.
        - |
          Correct. California's free-state constitution was accepted, giving free states a Senate majority.
      answer: [0, 1, 4]
      explanation: |
        Know the parts and who gained from each: the North won California and the D.C. trade; the South won the Fugitive Slave Act and the chance of slavery in New Mexico and Utah.

    - slug: apush-u05-w15-q18
      type: multi_select
      topic_code: "5.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Review. Which of the following were proposed answers, between 1846 and 1850, to the question of slavery in the land taken from Mexico? Select all that apply.
      options:
        - "Bar slavery from all of it, as the Wilmot Proviso proposed"
        - "Let the settlers decide through popular sovereignty"
        - "Return the land to Mexico"
        - "Extend the Missouri Compromise line of 36°30' to the Pacific"
        - "Abolish slavery nationwide by constitutional amendment"
      option_explanations:
        - |
          Correct. The free-soil position, backed by most Northern members of the House.
        - |
          Correct. Lewis Cass's 1848 proposal, later applied to New Mexico and Utah and then to Kansas.
        - |
          Some Whigs had opposed taking territory at all, but returning the land was never a live proposal after the treaty.
        - |
          Correct. A compromise supported by Polk and many Southerners as a way to divide the land.
        - |
          National abolition was not a serious proposal in Congress until the Thirteenth Amendment in 1864–65.
      answer: [0, 1, 3]
      explanation: |
        Recall the options of 1846–1850 (plus Calhoun's position that Congress could not bar slavery at all); each later reappears in the 1850s.

    # ---- True / false
    - slug: apush-u05-w15-q19
      type: true_false
      topic_code: "4.13"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: On the eve of the Civil War, a majority of white Southern families owned enslaved people.
      answer: false
      explanation: |
        False. In 1860 roughly one white Southern family in four owned anyone, and most owners held fewer than ten people; the share had been falling since 1830 as prices rose. Yet non-slaveholding whites largely supported the system through ties of kinship, the hope of becoming owners, and white supremacy, which is why secession drew support well beyond the planter class (topic 4.13).

    - slug: apush-u05-w15-q20
      type: true_false
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: The Know-Nothing Party collapsed after 1856 largely because its members divided over slavery, just as the Whigs had.
      answer: true
      explanation: |
        True. Nativism briefly offered an alternative to slavery as the organising issue of politics, but in 1856 Northern Know-Nothings moved to the Republicans and Southern ones to the Democrats or to the Constitutional Union Party of 1860.

    # ---- Fill in the blank
    - slug: apush-u05-w15-q21
      type: fill_blank
