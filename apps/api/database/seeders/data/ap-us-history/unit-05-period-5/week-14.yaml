week: 14
unit: 5
title: "Manifest Destiny and the Mexican–American War"
topics: ["5.1", "5.2", "5.3"]
guide: guides/week-14.md
guide_description: |
  How Period 5 opens: an expansionist creed, mass migration west and from Europe, and a war that doubled the
  nation's slavery problem along with its territory. Covers the annexation of Texas, the Oregon settlement, the
  Mormon trek and the Gold Rush, the Irish and German migrations and the nativist reaction, the causes and
  conduct of the Mexican–American War, and the Wilmot Proviso. Worked examples: a contextualization paragraph,
  sourcing Polk's war message, and a causation chain from the Treaty of Guadalupe Hidalgo to the crisis of 1850.
flashcards_description: |
  32 cards on manifest destiny, Texas and Oregon, migration and nativism, the Mexican–American War and the
  slavery question it reopened.

flashcards:
  - front: "\"Manifest destiny\" (1845) → who coined it and what it claimed"
    back: |
      The Democratic editor John L. O'Sullivan, writing about Texas and then Oregon in 1845. He argued that Providence intended the United States to spread across the continent, carrying republican government with it. The phrase turned expansion into a moral and religious mission, and it assumed that Native peoples and Mexicans would give way.
    hint: A New York Democratic journalist, not a president.
    topic_code: "5.2"
  - front: Annexation of Texas (1845) → why nine years late, how it was done
    back: |
      Texas won independence in 1836 but Jackson and Van Buren held off because annexing a large slave state would split their party and risk war with Mexico. After Polk's victory in 1844, outgoing President Tyler pushed annexation through by joint resolution of Congress (a simple majority in each house) instead of a treaty needing two-thirds of the Senate. Mexico broke off relations.
    topic_code: "5.2"
  - front: Election of 1844 → candidates, issue, significance
    back: |
      Democrat James K. Polk, an open expansionist, beat Whig Henry Clay, who hedged on Texas. The antislavery Liberty Party drew enough votes in New York to cost Clay the state and the election. Polk read the result as a mandate for Texas, Oregon and California.
    topic_code: "5.2"
  - front: James K. Polk's four goals (1845–1849)
    back: |
      Lower the tariff (Walker Tariff, 1846), restore an independent Treasury (1846), settle Oregon, and acquire California. He achieved all four in a single term and did not seek re-election, which makes him the most effective expansionist president of the century.
    topic_code: "5.2"
  - front: Oregon Treaty (1846) → the line and why compromise
    back: |
      Britain and the United States split the Oregon Country at the 49th parallel, extending the existing boundary to the Pacific (Britain kept all of Vancouver Island). Polk compromised with Britain because war with Mexico was beginning, and a war with the strongest navy in the world at the same time was unthinkable.
    topic_code: "5.2"
  - front: "\"Fifty-four forty or fight!\" → what it demanded and what happened"
    back: |
      An expansionist slogan of the 1840s demanding all of Oregon up to latitude 54°40', the southern tip of Russian Alaska. Polk settled for the 49th parallel in 1846; northern Democrats complained that he fought Mexico for southern slave territory but compromised on northern free territory.
    topic_code: "5.2"
  - front: Oregon Trail (1840s–1860s) → who went and what drove them
    back: |
      Hundreds of thousands of migrants, mostly farm families from the Midwest, crossed about 2,000 miles from Missouri to Oregon and California by wagon. Cheap fertile land, the hard times after the Panic of 1837, missionary reports and later gold drew them. Disease, not Native attack, was the leading cause of death on the trail.
    topic_code: "5.2"
  - front: Mormon migration to the Great Basin (1846–1847) → why and where
    back: |
      After mob violence in Missouri and Illinois and the murder of Joseph Smith (1844), Brigham Young led members of the Church of Jesus Christ of Latter-day Saints west to the Great Salt Lake, then Mexican territory. They built an irrigation-based, church-centred society; religious persecution, not land hunger alone, drove this migration.
    topic_code: "5.2"
  - front: California Gold Rush (1848–1849) → cause and effects
    back: |
      Gold found at Sutter's Mill in January 1848 drew tens of thousands of migrants in 1849 from the eastern states, Latin America, Europe and China. California's non-Native population rose so fast that it applied for statehood as a free state in 1849, upsetting the Senate balance and triggering the crisis that led to the Compromise of 1850.
    topic_code: "5.2"
  - front: Native Californians after the Gold Rush → what happened
    back: |
      Miners and settlers drove California Indians off land and water, and state and local militias waged campaigns of killing; state law allowed Native people, including children, to be bound to white employers. Scholarly estimates put the Native population at roughly 150,000 in 1848 and about 30,000 by 1870, one of the steepest collapses in U.S. history.
    topic_code: "5.2"
  - front: Foreign Miners' Tax (California, 1850 and 1852) → target and meaning
    back: |
      A monthly fee charged to non-citizen miners, enforced mainly against Mexican, Latin American and later Chinese miners. It drove many off the goldfields and is an early example of a law used to exclude immigrants by race, foreshadowing the Chinese Exclusion Act of 1882.
    topic_code: "5.2"
  - front: Chinese immigration to California in the 1850s → why they came, how they were received
    back: |
      Tens of thousands of men from southern China came to "Gold Mountain" to mine, then to build railroads and work in agriculture and laundries. They met special taxes, violence and exclusion from testimony against white people in California courts. Their arrival makes the West a meeting point of Atlantic and Pacific migration.
    topic_code: "5.1"
  - front: Irish immigration after 1845 → cause, where they went, how they voted
    back: |
      The potato blight and Great Famine (1845–1852) pushed more than a million Irish to the United States. Mostly poor and Catholic, they settled in eastern port cities, took unskilled jobs in construction, canals, railroads and domestic service, and became a core of the Democratic Party in northern cities.
    topic_code: "5.1"
  - front: German immigration in the 1840s–1850s → who and where
    back: |
      Economic hardship and the failed revolutions of 1848 sent well over a million Germans to the United States. Many had some money or skills and bought farms in the Midwest (Wisconsin, Missouri, Ohio valley) or settled in cities such as Milwaukee, St. Louis and Cincinnati. They were Catholic, Lutheran and freethinking, and many opposed slavery.
    topic_code: "5.1"
  - front: Know-Nothing (American) Party, 1854–1856 → beliefs and fate
    back: |
      A nativist party, grown from secret anti-Catholic societies, that wanted a 21-year wait for naturalization and Protestant, native-born officeholders. It won governorships and dozens of congressional seats in 1854–55, then split over slavery like the Whigs. Its rise shows that immigration as well as slavery broke the second party system.
    topic_code: "5.1"
  - front: Nueces River vs Rio Grande → why the boundary mattered in 1846
    back: |
      Mexico held that Texas ended at the Nueces River; Texas and the United States claimed the Rio Grande, about 150 miles further south and west. Polk ordered General Zachary Taylor into the disputed strip in early 1846. When Mexican cavalry attacked a U.S. patrol there in April, Polk told Congress that Mexico had shed American blood on American soil.
    topic_code: "5.3"
  - front: Polk's war message (May 11, 1846) → claim and response
    back: |
      Polk said war already existed "by the act of Mexico herself" and asked Congress to recognise it and fund the army. Congress declared war by large margins, but critics, including many Whigs, said the president had provoked the clash by sending troops into territory Mexico had never conceded.
    topic_code: "5.3"
  - front: Lincoln's Spot Resolutions (December 1847) → what he asked
    back: |
      First-term Whig congressman Abraham Lincoln demanded that Polk identify the exact "spot" where American blood had been shed, implying it was Mexican soil. The resolutions went nowhere and cost Lincoln support at home, but they show the Whig charge that the war was a presidential war of conquest.
    topic_code: "5.3"
  - front: Henry David Thoreau, Resistance to Civil Government (1849) → occasion and argument
    back: |
      Thoreau spent a night in jail in 1846 for refusing to pay a poll tax to a government that waged the Mexican War and protected slavery. His essay argues that conscience outranks law and that individuals should refuse to cooperate with injustice. Later known as Civil Disobedience, it influenced Gandhi and the twentieth-century civil rights movement.
    topic_code: "5.3"
  - front: Wilmot Proviso (1846) → what it proposed, what happened, why it mattered
    back: |
      Pennsylvania Democrat David Wilmot moved that slavery be barred from any territory acquired from Mexico. It passed the House repeatedly and always failed in the Senate, where the South had equal votes. Votes split by section rather than party, a sign that slavery in the territories would break the parties apart.
    hint: Never became law, yet it framed every debate to 1860.
    topic_code: "5.3"
  - front: Treaty of Guadalupe Hidalgo (1848) → four terms
    back: |
      Mexico recognised the Rio Grande as the Texas border and ceded California and New Mexico (the Mexican Cession, about 525,000 square miles); the United States paid $15 million and assumed about $3.25 million in claims of U.S. citizens against Mexico. Mexicans in the ceded lands could stay, keep their property and become U.S. citizens after a year unless they chose Mexican citizenship.
    topic_code: "5.3"
  - front: Mexican Cession → which present-day states
    back: |
      All of California, Nevada and Utah, most of Arizona, and parts of New Mexico, Colorado and Wyoming. With Texas, Mexico lost about half of its national territory between 1836 and 1848, which explains the bitterness the war left in Mexican memory.
    topic_code: "5.3"
  - front: Californios and Tejanos after 1848 → promise and reality
    back: |
      The treaty promised to protect the property of Mexicans who stayed. In practice the California Land Act of 1851 forced owners to prove old Spanish and Mexican grants in costly U.S. court proceedings that often lasted years, and in Texas violence and fraud did similar work. Much Mexican American land passed to Anglo settlers, lawyers and speculators.
    topic_code: "5.3"
  - front: Gadsden Purchase (1853) → what, how much, why
    back: |
      The United States bought a strip of southern Arizona and New Mexico from Mexico for $10 million. Southerners wanted it for the best route for a southern transcontinental railroad, so the purchase was tied to sectional rivalry over which section the West would be linked to.
    topic_code: "5.3"
  - front: Zachary Taylor and Winfield Scott → their roles in the Mexican–American War
    back: |
      Taylor won in northern Mexico (Palo Alto, Monterrey, Buena Vista) and rode the fame into the presidency as a Whig in 1848. Scott landed at Veracruz in 1847 and marched inland to take Mexico City in September, which forced Mexico to negotiate. Many later Civil War generals, Grant and Lee among them, served as junior officers.
    topic_code: "5.3"
  - front: Free-Soil Party (1848) → who joined and what it stood for
    back: |
      Antislavery Whigs, "Barnburner" Democrats and Liberty Party men nominated Martin Van Buren on the slogan "Free Soil, Free Speech, Free Labor, and Free Men." Their aim was to keep slavery out of the territories, not to abolish it in the South, largely to protect opportunity for white farmers and workers.
    topic_code: "5.3"
  - front: Popular sovereignty → who proposed it in 1848 and its appeal
    back: |
      Democrat Lewis Cass, the party's 1848 candidate, proposed letting the settlers of each territory decide on slavery. It appealed as democratic and took the issue out of Congress, but it left open when settlers could decide, and in Kansas after 1854 it produced civil war rather than peace.
    topic_code: "5.3"
  - front: John C. Calhoun's position on slavery in the territories (1847)
    back: |
      Calhoun argued that the territories were the common property of all the states, so Congress had no power to bar any citizen from taking his property, including enslaved people, into them. This position, the opposite of the Wilmot Proviso, became Southern orthodoxy and was later adopted by the Supreme Court in Dred Scott (1857).
    topic_code: "5.3"
  - front: Why did many Whigs oppose the Mexican–American War?
    back: |
      They charged that Polk provoked it and usurped Congress's war power, that conquest betrayed republican principles, and (in the North) that it was a plot to add slave states. Most Whigs still voted for supplies for the troops, which made their position look contradictory to voters.
    topic_code: "5.3"
  - front: Which themes? Manifest destiny and the Mexican–American War
    back: |
      National identity (NAT: a providential mission and who counts as American), Geography and the Environment (GEO: land, gold, routes to the Pacific), Migration and Settlement (MIG: overland migrants, Mormons, Chinese and Mexican residents) and America in the World (WOR: war with Mexico, diplomacy with Britain). Politics and Power (PCE) follows when the new land reopens slavery.
    topic_code: "5.1"
  - front: Compare the Oregon settlement and the Mexican Cession → method and sectional meaning
    back: |
      Oregon came by negotiation with Britain and a compromise line; the Southwest came by war and conquest. Oregon was free soil by climate and law; the Cession's status was undecided. Northerners noticed the contrast and many concluded the administration favoured the South.
    topic_code: "5.2"
  - front: Cause → effect, Treaty of Guadalupe Hidalgo → crisis of 1850
    back: |
      New territory (1848) → the Wilmot Proviso question becomes urgent → the Gold Rush fills California, which asks to enter as a free state (1849) → the 15–15 balance of slave and free states would break → Southern threats of secession → the Compromise of 1850.
    topic_code: "5.3"

quiz:
  description: |
    25 questions · about 40 minutes · about 70% this week (the context of Period 5, manifest destiny and the
    Mexican–American War) and 30% review of Period 4 (Indian removal, the market revolution, reform and the
    South). Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are
    matched automatically; the two short answers and the long essay are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Stimulus set A: Polk's war message (5.3)
    - slug: apush-u05-w14-q01
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: James K. Polk, Special Message to Congress on Mexican Relations (May 11, 1846), Avalon Project, Yale Law School"
      points: 1
      stimulus: &w14polk |
        "But now, after reiterated menaces, Mexico has passed the boundary of the United States, has invaded our territory and shed American blood upon the American soil. She has proclaimed that hostilities have commenced, and that the two nations are now at war.

        As war exists, and, notwithstanding all our efforts to avoid it, exists by the act of Mexico herself, we are called upon by every consideration of duty and patriotism to vindicate with decision the honor, the rights, and the interests of our country."

        — President James K. Polk, message to Congress, May 11, 1846
      prompt: |
        Which of the following best describes the purpose of Polk's message?
      options:
        - "To propose a negotiated boundary at the Nueces River"
        - "To announce that the United States would remain neutral in a conflict between Texas and Mexico"
        - "To ask Congress to annex Texas by joint resolution"
        - "To persuade Congress to recognise a state of war and to supply the means to fight it"
      option_explanations:
        - |
          The Nueces was Mexico's claimed boundary. Polk's claim that Mexico crossed "the boundary of the United States" assumes the Rio Grande line, the opposite of conceding the Nueces.
        - |
          Texas was a U.S. state by 1846, and the message calls for vindicating American rights by force, not for neutrality.
        - |
          Texas had already been annexed in 1845, under Tyler; that annexation is the background to the message, not its purpose.
        - |
          Correct. The message frames war as a fact already created by Mexico, so that Congress need only recognise it and vote men and money; Congress declared war within days.
      answer: 3
      explanation: |
        Sourcing (purpose). Ask what the author wanted the audience to do: Polk wanted a declaration and appropriations, and the claim that war "exists" made a vote against it look like abandoning the army in the field.

    - slug: apush-u05-w14-q02
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: James K. Polk, Special Message to Congress on Mexican Relations (May 11, 1846), Avalon Project, Yale Law School"
      points: 1
      stimulus: *w14polk
      prompt: |
        Polk's claim that Mexico had shed blood "upon the American soil" was most directly disputed by critics who argued that
      options:
        - "the soldiers involved were Texas militia, not U.S. Army troops"
        - "Mexico had already sold the disputed land to Great Britain"
        - "the fighting had in fact begun in Oregon"
        - "the clash took place in territory between the Nueces River and the Rio Grande that Mexico had never conceded to Texas"
      option_explanations:
        - |
          The patrol attacked in April 1846 was U.S. Army dragoons from Zachary Taylor's command, not Texas militia.
        - |
          Britain had no claim in Texas; its dispute with the United States was over Oregon, settled by treaty in June 1846.
        - |
          Oregon was disputed with Britain and settled peacefully; no fighting with Mexico occurred there.
        - |
          Correct. Mexico held that Texas ended at the Nueces; Polk had ordered Taylor's army to the Rio Grande. Lincoln's Spot Resolutions demanded the exact spot of the bloodshed to make this point.
      answer: 3
      explanation: |
        Historical situation. The message makes sense only against the boundary dispute: who owned the strip south of the Nueces decided whether Mexico or the United States was the aggressor.

    - slug: apush-u05-w14-q03
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: James K. Polk, Special Message to Congress on Mexican Relations (May 11, 1846), Avalon Project, Yale Law School"
      points: 1
      stimulus: *w14polk
      prompt: |
        Which development within three months of the message most directly showed that the war would intensify sectional conflict?
      options:
        - "The passage of the Kansas-Nebraska Act"
        - "The founding of the Republican Party"
        - "The introduction of the Wilmot Proviso to bar slavery from any land acquired from Mexico"
        - "The signing of the Treaty of Fort Laramie with Plains nations"
      option_explanations:
        - |
          The Kansas-Nebraska Act was 1854, eight years later, and dealt with Louisiana Purchase land, not the Mexican Cession.
        - |
          The Republican Party formed in 1854 in reaction to Kansas-Nebraska; it was not within months of the war message.
        - |
          Correct. In August 1846 David Wilmot proposed banning slavery in any Mexican cession; the House vote split along sectional rather than party lines, a preview of the 1850s.
        - |
          The Fort Laramie treaty came in 1851 and concerned migration routes across the Plains, not slavery.
      answer: 2
      explanation: |
        Causation and chronology. The war was barely begun before the question of what to do with conquered land split Congress by section, which is why historians date the road to the Civil War from 1846.

    # ---- Stimulus set B: Thoreau (5.3, with review of 4.11)
    - slug: apush-u05-w14-q04
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: Henry David Thoreau, On the Duty of Civil Disobedience (first published 1849 as Resistance to Civil Government), Project Gutenberg"
      points: 1
      stimulus: &w14thoreau |
        "Witness the present Mexican war, the work of comparatively a few individuals using the standing government as their tool; for, in the outset, the people would not have consented to this measure. ...

        Under a government which imprisons any unjustly, the true place for a just man is also a prison."

        — Henry David Thoreau, essay first published in 1849 as "Resistance to Civil Government"
      prompt: |
        Thoreau's argument in the excerpt is most consistent with the views of which group in the 1840s?
      options:
        - "Nativists who opposed the war because it would add Catholic Mexicans to the nation"
        - "Western settlers who demanded that the army move faster against Mexico"
        - "Northern Whigs and abolitionists who saw the war as an unjust conquest serving the expansion of slavery"
        - "Southern Democrats who wanted to annex all of Mexico"
      option_explanations:
        - |
          Some opponents did use racial and religious arguments against absorbing Mexico, but Thoreau's objection in the excerpt is moral and political: the war is unjust and was imposed by a few.
        - |
          Thoreau objects to the war itself, not its pace; he is a New England critic, not a western expansionist.
        - |
          Correct. Thoreau's claim that a small group used the government as a tool echoes the Whig and abolitionist charge that a "slave power" had manufactured the war.
        - |
          Southern Democrats supported the war; the "All Mexico" movement wanted more conquest, the opposite of Thoreau's protest.
      answer: 2
      explanation: |
        Making connections between a document and a political position. Placing a source in a camp requires matching its argument (an unjust war forced by a few) to that camp's known views.

    - slug: apush-u05-w14-q05
      type: multiple_choice
      topic_code: "4.11"
      source: "Primary source: Henry David Thoreau, On the Duty of Civil Disobedience (first published 1849 as Resistance to Civil Government), Project Gutenberg"
      points: 1
      stimulus: *w14thoreau
      prompt: |
        Review. Thoreau's call to put individual conscience above law most directly grew out of which earlier intellectual movement?
      options:
        - "The Enlightenment deism of the founding generation"
        - "The Puritan covenant theology of the seventeenth century"
        - "Social Darwinism"
        - "Transcendentalism, which held that truth is known through intuition and the individual soul"
      option_explanations:
        - |
          Deism emphasised reason and natural law; it does not explain Thoreau's stress on personal conscience and nonconformity in the 1840s.
        - |
          Puritan covenant theology bound individuals to the community and its godly laws, nearly the opposite of Thoreau's individualism.
        - |
          Social Darwinism arose after 1870 and justified competition and inequality, not individual resistance to unjust law.
        - |
          Correct. Thoreau and Emerson led the Transcendentalists, who prized self-reliance and the inner moral sense over institutions, one of the reform currents of Period 4.
      answer: 3
      explanation: |
        Contextualization across periods: the reform impulse and Transcendentalism of Period 4 (topics 4.9–4.11) supplied the ideas that critics of the Mexican War used.

    - slug: apush-u05-w14-q06
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: Henry David Thoreau, On the Duty of Civil Disobedience (first published 1849 as Resistance to Civil Government), Project Gutenberg"
      points: 1
      stimulus: *w14thoreau
      prompt: |
        Which of the following would best support Thoreau's claim that "the people would not have consented" to the war?
      options:
        - "Evidence that Congress declared war only after Polk sent troops into disputed territory and announced that war already existed"
        - "Evidence that tens of thousands of men volunteered to fight in Mexico in 1846"
        - "Evidence that the war was popular in the Mississippi valley"
        - "Evidence that Polk won the election of 1844 on an expansionist platform"
      option_explanations:
        - |
          Correct. That Congress was presented with a fait accompli supports the claim that a few officials, not the public, made the decision for war.
        - |
          Mass volunteering is evidence of popular support and would weaken, not support, Thoreau's claim.
        - |
          The war's popularity in the West and South also cuts against the claim.
        - |
          Polk's victory suggests voters did endorse expansion, which cuts against Thoreau.
      answer: 0
      explanation: |
        Claims and evidence. Decide what the claim is (the war was imposed, not chosen), then pick the evidence that supports it; three options here would be used by someone arguing the other side.

    # ---- Stimulus set C: Treaty of Guadalupe Hidalgo (5.3)
    - slug: apush-u05-w14-q07
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: Treaty of Guadalupe Hidalgo (1848), Article VIII, Avalon Project, Yale Law School"
      points: 1
      stimulus: &w14treaty |
        "Mexicans now established in territories previously belonging to Mexico, and which remain for the future within the limits of the United States, as defined by the present treaty, shall be free to continue where they now reside, or to remove at any time to the Mexican Republic, retaining the property which they possess in the said territories, or disposing thereof, and removing the proceeds wherever they please, without their being subjected, on this account, to any contribution, tax, or charge whatever."

        — Treaty of Guadalupe Hidalgo, Article VIII, signed February 2, 1848
      prompt: |
        The guarantee in the excerpt was most often undermined in the following decades by
      options:
        - "the Supreme Court's ruling that the treaty was unconstitutional"
        - "costly legal challenges to Spanish and Mexican land grants, together with fraud and violence, that transferred land to Anglo Americans"
        - "a federal law deporting all Mexican citizens from California"
        - "Mexico's refusal to accept any returning residents"
      option_explanations:
        - |
          The Court did not strike down the treaty; the problem was how its property promise was enforced in practice.
        - |
          Correct. Under the California Land Act of 1851, grant holders had to prove their titles before a federal commission and courts; years of litigation, legal fees, squatters and violence cost many Californios and Tejanos their land.
        - |
          No such deportation law was passed; most Mexican residents stayed and became U.S. citizens under the treaty.
        - |
          Some residents did move to Mexico, and the Mexican government encouraged resettlement; the property problem lay on the U.S. side.
      answer: 1
      explanation: |
        Continuity and change: a formal legal promise (property protected) versus practice (land loss through the courts, debt and force). Many APUSH questions turn on that gap.

    - slug: apush-u05-w14-q08
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: Treaty of Guadalupe Hidalgo (1848), Article VIII, Avalon Project, Yale Law School"
      points: 1
      stimulus: *w14treaty
      prompt: |
        Which other provision of the treaty settled the dispute that had triggered the war?
      options:
        - "Mexico's recognition of the Rio Grande as the boundary of Texas"
        - "The transfer of Cuba to the United States"
        - "The division of Oregon at the 49th parallel"
        - "The sale of the Gadsden strip for $10 million"
      option_explanations:
        - |
          Correct. Fighting began in the strip between the Nueces and the Rio Grande; the treaty fixed the border at the Rio Grande, as the United States had claimed.
        - |
          Cuba was Spanish, not Mexican; the Ostend Manifesto of 1854 was a failed attempt to acquire it.
        - |
          The 49th parallel came from the 1846 Oregon Treaty with Britain, a separate agreement.
        - |
          The Gadsden Purchase was a separate agreement in 1853, five years after the treaty.
      answer: 0
      explanation: |
        Knowledge of the treaty's terms: the Rio Grande border, the cession of California and New Mexico, $15 million paid and the citizenship and property articles quoted above.

    - slug: apush-u05-w14-q09
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: Treaty of Guadalupe Hidalgo (1848), Article VIII, Avalon Project, Yale Law School"
      points: 1
      stimulus: *w14treaty
      prompt: |
        The territorial terms of the treaty most directly contributed to which of the following?
      options:
        - "Renewed conflict in Congress over whether slavery would be permitted in the new territories"
        - "The admission of Texas as a free state"
        - "An immediate decline in migration to the Pacific coast"
        - "The end of the debate over slavery in the territories"
      option_explanations:
        - |
          Correct. Roughly half a million square miles of new land, with no rule on slavery, turned the Wilmot Proviso question into an immediate crisis that the Compromise of 1850 tried to settle.
        - |
          Texas had entered in 1845 as a slave state.
        - |
          Gold was discovered days before the treaty was signed; migration to California exploded in 1849.
        - |
          The treaty reopened the debate the Missouri Compromise had quieted; it did not end it.
      answer: 0
      explanation: |
        Causation: land acquisition → the question of slavery's expansion → the breakdown of compromise. This chain is the backbone of Unit 5.

    # ---- Context of Period 5 (5.1, 5.2)
    - slug: apush-u05-w14-q10
      type: multiple_choice
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains the rise of the Know-Nothing Party in the early 1850s?
      options:
        - "Large-scale Irish and German Catholic immigration provoked fears among native-born Protestants about jobs, religion and political power."
        - "Western farmers demanded free land and a transcontinental railroad."
        - "Abolitionists wanted a party committed to immediate emancipation."
        - "Southern planters wanted to reopen the Atlantic slave trade."
      option_explanations:
        - |
          Correct. Famine Irish and German immigration peaked around 1854; the American (Know-Nothing) Party called for long naturalization waits and native-born officeholders.
        - |
          Free land was the cause of the Free-Soilers and later the Republicans (Homestead Act), not the Know-Nothings.
        - |
          Immediate abolition was the goal of the Liberty Party and Garrisonian abolitionists, not the Know-Nothings.
        - |
          Some Southern radicals did propose reopening the slave trade, but that has nothing to do with a nativist party.
      answer: 0
      explanation: |
        Contextualization: Period 5 opens with mass immigration as well as expansion, and the nativist reaction helped dissolve the Whig Party.

    - slug: apush-u05-w14-q11
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The settlement of the Oregon boundary in 1846 differed from the acquisition of California chiefly in that Oregon was obtained
      options:
        - "through negotiation and compromise with Great Britain, while California was taken through war with Mexico"
        - "by purchase from Russia, while California was purchased from Spain"
        - "through war with Great Britain, while California was gained by treaty without fighting"
        - "as a slave territory, while California entered as free soil from the start"
      option_explanations:
        - |
          Correct. Polk compromised at the 49th parallel rather than fight Britain while war with Mexico was beginning; California came through conquest and the 1848 treaty.
        - |
          Russia sold Alaska in 1867; Spain had lost California to Mexican independence in 1821.
        - |
          There was no war with Britain in the 1840s; the war was with Mexico.
        - |
          Oregon's settlers banned slavery; the status of California was undecided until 1850.
      answer: 0
      explanation: |
        Comparison. Name the method (diplomacy versus war) and the sectional meaning (northern free soil versus land whose status was open).

    - slug: apush-u05-w14-q12
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which earlier diplomatic agreement first gave the United States a claim reaching the Pacific coast, the basis for its later demand for Oregon?
      options:
        - "The Webster-Ashburton Treaty (1842)"
        - "The Treaty of Ghent (1814)"
        - "The Adams-Onís Treaty (1819), in which Spain ceded Florida and gave up its claims to the Pacific Northwest"
        - "The Jay Treaty (1794)"
      option_explanations:
        - |
          The Webster-Ashburton Treaty settled the Maine–New Brunswick border in the East, not the Pacific Northwest.
        - |
          The Treaty of Ghent ended the War of 1812 by restoring prewar boundaries; it did not extend U.S. claims to the Pacific.
        - |
          Correct. John Quincy Adams's Transcontinental Treaty drew a boundary with New Spain to the Pacific, so Spain's claims north of it passed to the United States, which then contested Oregon with Britain.
        - |
          The Jay Treaty dealt with British forts in the Old Northwest and maritime trade, not the Pacific coast.
      answer: 2
      explanation: |
        Continuity across periods (topic 4.4): Adams's diplomacy in 1819 set up Polk's Oregon settlement in 1846.

    - slug: apush-u05-w14-q13
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Supporters of manifest destiny in the 1840s most commonly justified expansion by arguing that
      options:
        - "Native American nations had invited American settlement"
        - "European powers had asked the United States to administer their colonies"
        - "Providence intended the United States to spread its republican institutions across the continent"
        - "the Constitution required the nation to reach the Pacific"
      option_explanations:
        - |
          Native nations resisted encroachment; manifest destiny writers usually assumed they would vanish or be pushed aside.
        - |
          European powers, especially Britain and Mexico's allies, opposed U.S. expansion; none invited it.
        - |
          Correct. Expansionists combined religion, republican mission and assumptions of Anglo-American superiority into a claim that expansion was destined and good.
        - |
          The Constitution says nothing about continental expansion; even Jefferson doubted it authorised the Louisiana Purchase.
      answer: 2
      explanation: |
        Identify an ideology's claims. Manifest destiny is a cluster of ideas (Providence, mission, race, land), and the CED expects you to explain how it motivated migration and war.

    # ---- Review (Period 4)
    - slug: apush-u05-w14-q14
      type: multiple_choice
      topic_code: "4.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The forced removal of the Cherokee and other Southeastern nations in the 1830s most directly foreshadowed which pattern of the Period 5 West?
      options:
        - "Federal and state power used to clear Native peoples from land wanted by white settlers and miners"
        - "The negotiation of treaties that Native nations consistently refused to sign"
        - "Federal protection of Native land claims against state governments"
        - "The admission of Native nations as states"
      option_explanations:
        - |
          Correct. Removal under Jackson set the precedent for pushing Native peoples aside as settlers moved into the Plains, California and the Pacific Northwest.
        - |
          Removal was carried out through treaties, some signed by minority factions such as the Treaty of New Echota (1835); the issue was coercion, not refusal to sign.
        - |
          The Cherokee won in Worcester v. Georgia, but Jackson declined to enforce it; federal policy favoured removal, not protection.
        - |
          No Native nation was admitted as a state; Indian Territory was later absorbed into Oklahoma.
      answer: 0
      explanation: |
        Continuity and change: removal in Period 4 and dispossession in Period 5 are the same pattern applied to new places.

    - slug: apush-u05-w14-q15
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which development of the market revolution most directly made the overland migrations of the 1840s possible?
      options:
        - "Federal subsidies for automobile roads"
        - "Canals, steamboats and early railroads that carried migrants and goods cheaply to jumping-off towns on the Missouri River"
        - "The invention of the telephone"
        - "The transcontinental railroad, completed in 1869"
      option_explanations:
        - |
          Federal road subsidies for automobiles came in the twentieth century, far too late to matter here.
        - |
          Correct. The transportation revolution tied the Ohio and Mississippi valleys to the East, so families could reach Independence, Missouri, and outfit for the trail.
        - |
          The telephone dates from 1876, a generation after the overland migrations began.
        - |
          The transcontinental line came two decades after the 1840s migrations.
      answer: 1
      explanation: |
        Making connections between Period 4's economy and Period 5's migration.

    - slug: apush-u05-w14-q16
      type: multiple_choice
      topic_code: "4.13"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Southern support for annexing Texas in the 1840s is best explained by which feature of the antebellum South?
      options:
        - "The westward expansion of cotton cultivation and slavery onto new, fertile land"
        - "A rapidly growing industrial working class seeking factory jobs"
        - "Widespread Southern opposition to slavery"
        - "The South's dependence on immigrant labor"
      option_explanations:
        - |
          Correct. Cotton exhausted soil and planters moved west with enslaved people; Texas offered fertile cotton land and another slave state.
        - |
          The South industrialised far less than the North; its economy rested on staple agriculture.
        - |
          Antislavery views in the South were rare and repressed after the 1830s.
        - |
          Immigrants mostly went north; the South depended on enslaved labor.
      answer: 0
      explanation: |
        Causation across periods: the cotton boom of Period 4 created the demand for new slave territory that made expansion sectional.

    # ---- Multi-select
    - slug: apush-u05-w14-q17
      type: multi_select
      topic_code: "5.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following contributed to the outbreak of war between the United States and Mexico in 1846? Select all that apply.
      options:
        - "The U.S. annexation of Texas in 1845, which Mexico had never recognised as independent"
        - "The dispute over whether Texas ended at the Nueces River or the Rio Grande"
        - "Polk's desire to acquire California and his failed attempt to buy it through the Slidell mission"
        - "Mexico's alliance with Great Britain against the United States"
        - "Mexico's attempt to reconquer the Louisiana Purchase"
      option_explanations:
        - |
          Correct. Mexico regarded Texas as a rebel province; annexation ended diplomatic relations.
        - |
          Correct. Taylor's advance to the Rio Grande put U.S. troops in the disputed strip, where the first clash took place.
        - |
          Correct. Mexico refused to receive John Slidell, who was authorised to buy California and New Mexico; Polk then moved troops and prepared a war message.
        - |
          Mexico had no alliance with Britain; Britain and the United States settled Oregon peacefully in 1846.
        - |
          The Louisiana Purchase was French land sold in 1803; Mexico never claimed it.
      answer: [0, 1, 2]
      explanation: |
        Causation with multiple causes: long-term (Texas), immediate (the boundary clash) and motive (California). Expect an LEQ to ask you to weigh them.

    - slug: apush-u05-w14-q18
      type: multi_select
      topic_code: "4.11"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Review. Which reform movements of the 1830s and 1840s are correctly paired with a leader? Select all that apply.
      options:
        - "Women's rights: Elizabeth Cady Stanton and the Seneca Falls Convention"
        - "Immediate abolition: Henry Clay"
        - "Asylum reform: Dorothea Dix"
        - "Temperance: John C. Calhoun"
        - "Public education: Horace Mann"
      option_explanations:
        - |
          Correct. Stanton drafted the Declaration of Sentiments at Seneca Falls in 1848, the same year the Mexican War ended.
        - |
          Clay supported gradual emancipation with colonization and sectional compromise, not immediate abolition; William Lloyd Garrison is the name for immediatism.
        - |
          Correct. Dix documented the treatment of the mentally ill and lobbied states to build asylums.
        - |
          Calhoun was a South Carolina senator and theorist of states' rights and slavery, not a temperance leader.
        - |
          Correct. Mann led Massachusetts's common-school movement and promoted tax-supported public schools.
      answer: [0, 2, 4]
      explanation: |
        Recall with discrimination: Period 4 reformers supplied the moral language (and some of the people) that shaped Period 5 debates over slavery's expansion.

    # ---- True / false
    - slug: apush-u05-w14-q19
      type: true_false
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The Wilmot Proviso, which would have banned slavery from any land acquired from Mexico, became law in 1846 but was repealed by the Compromise of 1850.
      answer: false
      explanation: |
        False. The proviso passed the House several times but never passed the Senate, where slave and free states had equal votes, so it never became law. Its importance is that votes on it split by section rather than by party.

    - slug: apush-u05-w14-q20
      type: true_false
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: By the 1840s most states had dropped property qualifications for voting by white men, which helped make mass party campaigns, like the expansionist campaign of 1844, possible.
      answer: true
      explanation: |
        True. The expansion of white male suffrage in the 1820s and 1830s (topic 4.7) produced high turnout and mass parties. At the same time several states took the vote away from free Black men, so democracy expanded for some while narrowing for others.

    # ---- Fill in the blank
    - slug: apush-u05-w14-q21
      type: fill_blank
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The 1848 treaty that ended the Mexican–American War, transferring California and New Mexico to the United States for $15 million, is the Treaty of ____.
      answer: ["Guadalupe Hidalgo", "Guadalupe-Hidalgo"]
      explanation: |
        Named for the town near Mexico City where it was signed on February 2, 1848. Remember its four parts: the Rio Grande boundary, the Cession, the payment, and the citizenship and property guarantees for Mexicans who stayed.

    - slug: apush-u05-w14-q22
      type: fill_blank
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The 1820 agreement that admitted Missouri as a slave state and Maine as a free state, and barred slavery in the Louisiana Purchase north of 36°30', is called the ____.
      answer: ["Missouri Compromise", "Missouri Compromise of 1820", "the Missouri Compromise", "Compromise of 1820"]
      explanation: |
        The Missouri Compromise applied only to the Louisiana Purchase. Land taken from Mexico lay outside it, which is why the Mexican Cession reopened the whole question in 1846.

    # ---- Short answer (SAQ)
    - slug: apush-u05-w14-q23
      type: short_answer
      topic_code: "5.2"
      source: "Non-text source described: John Gast, American Progress (painting, 1872), Library of Congress Prints and Photographs"
      points: 3
      stimulus: |
        Description of a painting (not reproduced). In John Gast's American Progress (1872), a giant, glowing woman in white robes floats westward across the continent with a schoolbook in one hand, stringing a telegraph wire with the other. Below and behind her, from the bright eastern side of the canvas, come farmers with a plow, stagecoaches, wagons and railroad trains. Ahead of her, on the dark western side, American Indians and a herd of bison flee out of the frame.
      prompt: |
        Using the description of the painting, answer (a), (b) and (c).

        (a) Briefly describe ONE perspective on westward expansion expressed in the painting.
        (b) Briefly explain ONE historical development from 1844 to 1877 that supports the perspective in the painting.
        (c) Briefly explain ONE historical development from 1844 to 1877 that challenges or complicates the perspective in the painting.
      answer: |
        (a) The painting presents expansion as the providential spread of civilisation, education and technology, with the United States carrying progress westward and Native peoples receding before it, the core belief of manifest destiny.
        (b) The rapid settlement of Oregon and California in the 1840s, the Gold Rush and the building of telegraph and rail lines (the transcontinental railroad, 1869) brought farms, towns and communications west, as the painting shows.
        (c) Expansion produced violence and dispossession that the painting hides: the war with Mexico, the loss of land by Californios and Tejanos after 1848, and the killing and displacement of California Indians. It also reopened the slavery question, which led to sectional conflict and civil war rather than unified progress.
      explanation: |
        Three points, one per part.

        (a) 1 pt for an accurate description of a perspective, such as: expansion as destiny or mission; expansion as bringing civilisation, schools, farming and technology; Native Americans as obstacles fated to disappear. Zero for describing the image without naming a perspective (for example, "a woman flies west").

        (b) 1 pt for a specific development that supports the perspective, with a link: Oregon Trail settlement, the Gold Rush and California statehood, telegraph lines, the Homestead Act (1862), the Pacific Railway Act and the transcontinental railroad (1869). Zero for a development outside 1844–1877 or with no explanation.

        (c) 1 pt for a specific development that challenges or complicates it, with a link: the Mexican–American War and its critics (Whigs, Thoreau); land loss by Mexican Americans despite the Treaty of Guadalupe Hidalgo; violence against California Indians; conflict on the Plains (Sand Creek, 1864); the sectional crisis over slavery in the territories. Zero for simply saying the painting is biased without a development.

    - slug: apush-u05-w14-q24
      type: short_answer
      topic_code: "5.3"
      source: "Secondary source written for this course; general knowledge"
      points: 3
      stimulus: |
        Interpretation (written for this course): "The war with Mexico was not forced on the United States. It was the deliberate project of a president who wanted California and was willing to provoke a fight to get it. Polk sent the army into land Mexico had never surrendered, waited for a clash, and then told Congress that war already existed. The conflict was a war of conquest dressed as self-defense."

        (This interpretation is close to the view of the war's Whig critics in the 1840s and of many later historians; others stress Mexican refusal to negotiate and the long dispute over Texas.)
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the main argument of the interpretation.
        (b) Briefly explain ONE specific piece of historical evidence that supports the interpretation.
        (c) Briefly explain ONE specific piece of historical evidence that a historian could use to challenge the interpretation.
      answer: |
        (a) The author argues that Polk caused the war deliberately, provoking Mexico in order to seize California, so it was an aggressive war of conquest rather than defence.
        (b) Polk had tried to buy California through the Slidell mission and, when Mexico refused, ordered Taylor's army from the Nueces to the Rio Grande, into territory Mexico claimed; the war ended with exactly the land he had sought, California and New Mexico.
        (c) Mexico had refused to recognise Texas independence for a decade and broke relations over annexation; it refused to receive Slidell at all, and Mexican troops did cross the Rio Grande and attack first, so a historian could argue that both governments' positions made war likely.
      explanation: |
        Three points.

        (a) 1 pt for accurately describing the argument: the war was a planned war of conquest provoked by Polk. Zero for "the war was about Mexico" or for summarising only one sentence without the claim.

        (b) 1 pt for specific supporting evidence with a link: the Slidell mission's offer to buy California; Taylor's move into the Nueces–Rio Grande strip; the war message's claim that war "exists"; the Spot Resolutions; the territorial outcome of the treaty.

        (c) 1 pt for specific challenging evidence with a link: Mexico's refusal to recognise Texas or receive Slidell; Mexico's attack on Thornton's patrol; Texas's own claim to the Rio Grande since 1836; Congress's large majorities for war; popular enthusiasm in the West and South. Zero for evidence that does not bear on who caused the war.

    # ---- Long essay (LEQ)
    - slug: apush-u05-w14-q25
      type: long_answer
      topic_code: "5.2"
      source: "general knowledge"
      points: 6
      prompt: |
        In the 1840s the United States grew by more than a million square miles through annexation, negotiation and war. Historians have explained this expansion through ideology, economic interest, migration, and the politics of slavery.

        Evaluate the relative importance of the causes of United States territorial expansion in the period from 1844 to 1848.
      answer: |
        Thesis: Although the belief in manifest destiny gave expansion a popular justification, the most important cause was economic ambition, above all the Southern demand for new cotton land and the national desire for Pacific ports, which turned a vague creed into concrete policy under Polk.

        Context: Market revolution, transportation links to the Missouri, the Panic of 1837 and a cotton economy pushing west; Texas independent since 1836.

        Body 1 (ideology): O'Sullivan's manifest destiny; Polk's 1844 campaign; religious and racial assumptions; but ideology explains enthusiasm more than timing.
        Body 2 (economic and sectional interest): Texas as cotton and slave land; Southern pressure; California's harbours (San Francisco Bay) for Asian trade; Polk's Slidell offer.
        Body 3 (migration and diplomacy): Oregon Trail settlers created facts on the ground; Mormons in Utah; Polk compromised at 49° with Britain when interests were northern and war risk high.

        Complexity: show that the same ideology produced compromise in Oregon and war in Mexico, so interest and power decided outcomes; or note the Wilmot Proviso as the unintended consequence.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): 1 pt for a historically defensible claim that establishes a line of reasoning about the relative importance of causes, for example "ideology justified expansion but economic and sectional interests drove it." Zero for restating the prompt or listing causes without weighing them.

        Contextualization (0–1): 1 pt for describing the broader context before or during the period, such as the market revolution and transportation links west, the cotton boom and the expansion of slavery, Texas independence (1836), Jacksonian democracy and mass party politics, or the Panic of 1837. It must be more than a phrase.

        Evidence (0–2): 1 pt for two specific, relevant examples (manifest destiny and O'Sullivan, the 1844 election, the annexation of Texas, the Oregon Treaty, the Slidell mission, the Nueces–Rio Grande dispute, the Mormon migration, the Gold Rush, the Treaty of Guadalupe Hidalgo). 2 pts for using specific evidence to support an argument in response to the prompt.

        Analysis and reasoning (0–2): 1 pt for using causation to frame the argument (weighing causes, distinguishing long-term from immediate). 1 pt for complex understanding, for example explaining multiple causes and their interaction, comparing Oregon and Mexico, considering Mexican or Native perspectives, or connecting the expansion to the sectional crisis that followed. Complexity must be part of the argument, not a single sentence.
