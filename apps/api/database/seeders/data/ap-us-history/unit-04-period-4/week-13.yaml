          There was no such movement; Hinton Helper's antislavery appeal to non-slaveholders (1857) was banned in the South.
        - |
          Correct. Slaveholding was concentrated, yet many non-slaveholders defended slavery out of racial solidarity, economic ties to planters and hope of becoming slaveholders.
