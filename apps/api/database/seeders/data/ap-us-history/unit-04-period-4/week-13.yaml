    - slug: apush-u04-w13-q23
      type: short_answer
      topic_code: "4.13"
      source: "Secondary interpretations written for this course"
      points: 3
      stimulus: |
        Interpretation A (written for this course): "Slaveholders described themselves as patriarchs responsible for the people they held, and many believed it. Paternalism shaped how planters justified slavery and how they governed plantations, mixing cruelty with a demand for gratitude."

        Interpretation B (written for this course): "Slavery in the cotton South was above all a business. Enslaved people were bought, sold, mortgaged and insured; planters measured them by how many pounds of cotton they picked. Talk of paternal care was a rationalisation for an economic system driven by profit."
      prompt: |
        Using the interpretations, answer (a), (b) and (c).

        (a) Briefly describe ONE major difference between Interpretation A and Interpretation B.
        (b) Briefly explain how ONE specific historical development from 1800 to 1848 not directly mentioned in the excerpts could be used to support Interpretation A.
        (c) Briefly explain how ONE specific historical development from 1800 to 1848 not directly mentioned in the excerpts could be used to support Interpretation B.
      answer: |
        (a) Interpretation A argues that planters' sense of paternal responsibility genuinely shaped slavery, while Interpretation B argues that slavery was fundamentally a profit-driven business and paternalism was only a justification.
        (b) In the 1830s southern writers and politicians such as John C. Calhoun defended slavery as a positive good in which masters cared for enslaved people from cradle to grave, and many planters required religious instruction under their supervision, showing that a paternalist ideology shaped how they understood and organised slavery.
        (c) The domestic slave trade moved perhaps a million people from the Upper South to the cotton states, separating families for profit; New Orleans became a great slave market, and enslaved people were used as collateral for loans, which shows slavery operating as a market.
      explanation: |
        One point per part.
        (a) Earns the point for a specific difference: genuine paternalism versus economic motive / rationalisation. Zero for describing only one interpretation.
        (b) Earns the point for a specific development explained as support for A: the positive good argument, planter claims of care in proslavery writing, plantation religious instruction, planters' reaction of betrayal after revolts. Zero for evidence quoted from the excerpts or outside the period.
        (c) Earns the point for a specific development explained as support for B: the domestic slave trade, the separation of families by sale, slaves mortgaged and insured, the cotton boom and cotton prices, the expansion into the Deep South after removal. Zero for a vague "slavery made money."
        Skill: analysing historians' interpretations; claims and evidence.

    - slug: apush-u04-w13-q24
      type: short_answer
      topic_code: "4.10"
      source: "Secondary interpretation written for this course"
      points: 3
      stimulus: |
        Interpretation (written for this course): "The Second Great Awakening was a democratic revolution in religion. It took authority from learned ministers and established churches and handed it to ordinary believers, who chose their own faith, their own preachers and, often, their own causes. The same confidence that a farmer could choose salvation told him he could choose his president, and told his wife she could reform the world."
      prompt: |
        Using the interpretation, answer (a), (b) and (c).

        (a) Briefly describe the argument made in the interpretation.
        (b) Briefly explain ONE piece of evidence from 1800 to 1848 that supports the interpretation.
        (c) Briefly explain ONE piece of evidence from 1800 to 1848 that complicates or challenges the interpretation.
      answer: |
        (a) The author argues that the Second Great Awakening democratised religion by shifting authority from elites and established churches to ordinary people, and that this paralleled and encouraged political democracy and women's reform activism.
        (b) Methodist and Baptist preachers with little formal training drew huge camp-meeting crowds and became the largest denominations, while Finney's revivals let women pray in public and channelled converts into temperance and abolition societies led by women.
        (c) The Awakening also produced strong new hierarchies and divisions: southern evangelical churches accepted and defended slavery, the Methodist and Baptist churches split along sectional lines in 1844–1845, and revival-inspired reformers often sought to impose Protestant morality on Catholic immigrants, which was hardly democratic.
      explanation: |
        One point per part.
        (a) Earns the point for describing the claim that the Awakening shifted religious authority to ordinary people and connected to democracy. Zero for "it was about religion."
        (b) Earns the point for a specific example explained: camp meetings, Methodist and Baptist growth, untrained preachers, Finney's new measures, women's leadership in benevolent societies, independent Black churches (AME), the burned-over district, the rise of the Latter-day Saints. Zero for an example with no explanation.
        (c) Earns the point for a specific complication explained: southern churches defending slavery, the denominational splits of 1844–1845, anti-Catholic nativism, women still barred from preaching in most churches, persecution of the Latter-day Saints. Zero for a vague "not everyone was religious."
        Skill: secondary-source analysis; making connections between religion and politics.

    - slug: apush-u04-w13-q25
      type: long_answer
      topic_code: "4.14"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1820 and 1848 Americans organised to end drinking, slavery and the subordination of women, and to build schools, asylums and even new societies. Historians have pointed to religion, economic change and the ideals of the Revolution as forces behind this surge. You might consider which forces mattered most and how they interacted.

        Evaluate the relative importance of the causes of reform movements in the United States from 1820 to 1848.
      answer: |
        Thesis: The Second Great Awakening was the most important cause of reform from 1820 to 1848, because its belief in free will and perfectionism turned private conversion into public action; the market revolution mattered nearly as much by creating a middle class with the resources and anxieties to act, while Revolutionary ideals gave reformers, especially abolitionists and women, their language.

        Context: after 1815 a market economy, rapid urbanisation, immigration and the spread of democracy unsettled older communities and authorities.

        Body 1 (religion): Finney's revivals in the burned-over district, perfectionism, benevolent societies, temperance (American Temperance Society 1826), evangelical abolitionists such as Theodore Weld.

        Body 2 (economy and class): middle-class families and separate spheres gave women moral authority and leisure for reform; worries about wage workers' drinking and immigrants' children drove temperance and Mann's common schools.

        Body 3 (ideals): the Declaration of Sentiments (1848) adapted the Declaration of Independence; Garrison and Douglass invoked natural rights; Transcendentalists such as Thoreau stressed individual conscience.

        Complexity: the causes interacted, and reform's limits (the South's rejection of abolition, nativism, the division of abolitionists) show that the same forces could also produce resistance.
      explanation: |
        Thesis/claim (1 point): a defensible claim that ranks or weighs causes with a line of reasoning. Zero for listing causes without weighing them.

        Contextualization (1 point): e.g. the market revolution's social dislocation, the expansion of democracy, disestablishment of churches, urbanisation and immigration, or the earlier First Great Awakening and Revolutionary ideals.

        Evidence (2 points): 1 point for two specific examples (Finney, burned-over district, American Temperance Society, Maine law 1851 only as later effect, Dorothea Dix, Horace Mann, Garrison and The Liberator, American Anti-Slavery Society, Douglass, Grimké sisters, Seneca Falls, utopian communities such as Brook Farm or Oneida, Transcendentalism). 2 points when they are used to support the argument about relative importance.

        Analysis and reasoning (2 points): 1 point for using causation to frame the argument. 1 point for complex understanding, e.g. explaining interactions among causes, distinguishing causes of different movements (temperance versus women's rights), considering southern opposition, or analysing reform's conservative and radical strands.

        Zero overall for a description of movements that does not address causes.
