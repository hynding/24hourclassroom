week: 13
unit: 4
title: "Awakening, Reform, Slavery and the South"
topics: ["4.10", "4.11", "4.12", "4.13", "4.14"]
guide: guides/week-13.md
guide_description: |
  The Second Great Awakening and the reform impulse it released: temperance, asylums and prisons, public schools,
  utopian communities, abolition and women's rights. Then the lives of free and enslaved African Americans, the
  cotton South's society and its defence of slavery, and a causation review of the whole period. Worked examples:
  HIPP sourcing of the Seneca Falls Declaration, reading census data on slavery, and a causation thesis on reform.
flashcards_description: |
  30 cards on the Second Great Awakening, reform movements and their leaders, abolitionism, Seneca Falls, slavery
  and resistance, free Black communities, and the society and economy of the cotton South.

flashcards:
  - front: Second Great Awakening → when, where, core message
    back: |
      A wave of Protestant revivals from about 1800 to the 1840s, strongest in the frontier and in western New York's "burned-over district." Preachers stressed free will: anyone could choose salvation and work to perfect themselves and society.
    topic_code: "4.10"
  - front: Charles Grandison Finney → methods and significance
    back: |
      The leading revivalist of the 1820s–1830s, famous for his Rochester revival (1830–1831). His "new measures" (protracted meetings, the anxious bench, women praying in public) and his message of human ability drove converts into reform, especially abolition.
    topic_code: "4.10"
  - front: Camp meetings and the Methodists and Baptists → why they grew
    back: |
      Outdoor revivals lasting days, with emotional preaching to frontier crowds. Methodist circuit riders and Baptist farmer-preachers, needing little formal training, made these the largest Protestant denominations by mid-century.
    topic_code: "4.10"
  - front: Church of Jesus Christ of Latter-day Saints → founding and migration
    back: |
      Founded by Joseph Smith in western New York (1830). Persecuted in Ohio, Missouri and Illinois, where Smith was killed by a mob (1844); Brigham Young led the Mormons to the Great Salt Lake valley in 1846–1847.
    topic_code: "4.10"
  - front: Second Great Awakening → effect on women and African Americans
    back: |
      Women made up most converts and led benevolent and missionary societies, building organising skills used in reform. Black Christians built independent churches, such as Richard Allen's African Methodist Episcopal Church (organised 1816).
    topic_code: "4.10"
  - front: Perfectionism → link to reform
    back: |
      The revival belief that individuals, and therefore society, could be made free of sin. If sin was a choice, so was drunkenness or slaveholding, which made reformers impatient for immediate change.
    topic_code: "4.11"
  - front: Temperance movement → organisations and results
    back: |
      The American Temperance Society (1826) and later the Washingtonians urged abstinence; Maine passed a statewide prohibition law in 1851. Per-capita alcohol consumption fell sharply between 1830 and 1850.
    topic_code: "4.11"
  - front: Dorothea Dix → cause and achievement
    back: |
      A Massachusetts teacher who documented the jailing of mentally ill people in cages and cellars and presented her findings to the state legislature (1843), leading many states to build public asylums.
    topic_code: "4.11"
  - front: Horace Mann → what he reformed and why
    back: |
      Secretary of the Massachusetts Board of Education from 1837. He built tax-supported common schools with trained teachers, longer terms and standard curricula, arguing that education would make good citizens and reduce class divisions.
    topic_code: "4.11"
  - front: Utopian communities → three examples and what they sought
    back: |
      Brook Farm (Transcendentalist), Robert Owen's New Harmony (socialist) and the Oneida Community (complex marriage and shared property); the Shakers practised celibacy and equality of the sexes. They sought perfect societies apart from the market's competition.
    topic_code: "4.11"
  - front: William Lloyd Garrison and The Liberator (1831) → position
    back: |
      A Boston editor who demanded immediate, uncompensated emancipation and equal rights, rejected colonization, and later called the Constitution a pro-slavery compact. Co-founded the American Anti-Slavery Society (1833).
    topic_code: "4.11"
  - front: American Colonization Society (1816) → goal and Black response
    back: |
      Sought to resettle free African Americans in Africa, founding Liberia (1822). Supporters ranged from antislavery gradualists to slaveholders who wanted free Black people gone; most free Black leaders rejected it, insisting America was their country.
    topic_code: "4.12"
  - front: Frederick Douglass's Narrative (1845) → significance
    back: |
      The autobiography of a man who escaped slavery in Maryland in 1838; it exposed slavery's brutality, showed literacy as a path to freedom and made Douglass a leading abolitionist orator and, from 1847, editor of The North Star.
    topic_code: "4.12"
  - front: David Walker's Appeal (1829) → argument and reaction
    back: |
      A free Black Bostonian's pamphlet urging enslaved people to resist, by force if necessary, and condemning American hypocrisy. Southern states banned it and tightened laws against Black literacy.
    topic_code: "4.12"
  - front: Nat Turner's rebellion (1831) → events and consequences
    back: |
      In Southampton County, Virginia, Turner led enslaved people in a revolt that killed about 55 to 60 white people; whites killed many more Black people in reprisals. Virginia debated gradual emancipation in 1831–1832 and rejected it; southern states passed harsher slave codes.
    topic_code: "4.12"
  - front: Forms of resistance by enslaved people → name four
    back: |
      Running away (often temporarily, or north via the Underground Railroad), work slowdowns and breaking tools, preserving family, religion and culture, and rarely, armed revolt such as Gabriel's plot (1800), Denmark Vesey's (1822) and Nat Turner's (1831).
    topic_code: "4.12"
  - front: Free African Americans in the North before 1848 → conditions
    back: |
      About 170,000 in the North by 1840, mostly in cities; legally free but often barred from voting, juries, schools and many trades, and attacked by mobs. They built churches, mutual aid societies, newspapers and the national Black convention movement (from 1830).
    topic_code: "4.12"
  - front: Domestic slave trade → scale and effect
    back: |
      After the international trade was banned in 1808, perhaps a million enslaved people were moved from the Upper South to the cotton states between 1790 and 1860, by sale or with migrating owners, breaking families apart.
    topic_code: "4.13"
  - front: King Cotton → why cotton dominated the southern economy
    back: |
      Short-staple cotton, cleaned by the gin and grown on fresh lands of the Deep South, supplied British and New England mills. By the 1830s cotton was the nation's largest export, and enslaved people were the South's largest form of wealth.
    topic_code: "4.13"
  - front: Structure of white southern society → who owned enslaved people
    back: |
      A minority of white families held enslaved people, and only a small planter elite held twenty or more, yet planters dominated politics and culture. Most white southerners were yeoman farmers, many of whom aspired to slaveholding.
    topic_code: "4.13"
  - front: Positive good argument → who and claim
    back: |
      John C. Calhoun and other southern spokesmen in the 1830s claimed slavery was not a necessary evil but a positive good that civilised and cared for enslaved people, a hardening response to abolitionism and Nat Turner.
    topic_code: "4.13"
  - front: Gag rule (1836–1844) → what it was and who fought it
    back: |
      A House rule tabling antislavery petitions without debate. Former president John Quincy Adams fought it as a violation of the right of petition until its repeal in 1844, turning free speech into an antislavery issue.
    topic_code: "4.13"
  - front: Seneca Falls Convention (1848) → organisers and key demand
    back: |
      Elizabeth Cady Stanton and Lucretia Mott, who met as excluded women delegates at the 1840 World Anti-Slavery Convention, organised it. The Declaration of Sentiments, modelled on the Declaration of Independence, demanded rights including the vote.
    topic_code: "4.11"
  - front: Grimké sisters → significance
    back: |
      Sarah and Angelina Grimké, daughters of a South Carolina slaveholding family, became abolitionist lecturers to mixed audiences in the 1830s; criticised for speaking in public, they defended women's rights as well.
    topic_code: "4.11"
  - front: Compare Garrison's and Douglass's antislavery strategies by the late 1840s
    back: |
      Garrison rejected politics and the Constitution as corrupted by slavery and relied on moral persuasion; Douglass broke with him around 1851, embraced political action and read the Constitution as an antislavery document.
    topic_code: "4.11"
  - front: Liberty Party (1840, 1844) → significance
    back: |
      The first antislavery political party, which ran James G. Birney for president. Its 1844 vote in New York may have cost Clay the state and the election; it fed into the Free-Soil Party of 1848.
    topic_code: "4.11"
  - front: Causation in Period 4 → the market revolution's three big effects
    back: |
      It created a middle class whose values drove reform, tied the North and West together economically, and, through cotton, deepened the South's investment in slavery: one cause, sectionally divergent effects.
    topic_code: "4.14"
  - front: Causation in Period 4 → why reform movements arose, 1820–1848
    back: |
      The Second Great Awakening's perfectionism, the anxieties and opportunities of the market revolution, the new middle class and its separate-spheres moral authority for women, and Revolutionary ideals of equality all pushed Americans to reform society.
    topic_code: "4.14"
  - front: Which theme? Seneca Falls and the Declaration of Sentiments
    back: |
      American and National Identity (NAT) and Social Structures (SOC): women claimed the nation's founding language of equality for themselves and challenged the laws and customs that governed gender.
    topic_code: "4.11"
  - front: Nativism and reform → link
    back: |
      Many Protestant reformers saw Irish Catholic immigrants as threats to temperance and the common schools; anti-Catholic writing and riots in the 1830s and 1840s grew from the same evangelical culture that produced reform.
    topic_code: "4.11"

quiz:
  description: |
    25 questions · about 40 minutes · about 70% this week (the Second Great Awakening, reform, African Americans in
    the early republic, the society of the South and causation in Period 4) and 30% review of weeks 10–12 and
    earlier periods. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: Declaration of Sentiments (4.11, review 3.4)
    - slug: apush-u04-w13-q01
      type: multiple_choice
      topic_code: "4.11"
      source: "Primary source: Declaration of Sentiments, Seneca Falls Convention (1848), National Park Service, Women's Rights National Historical Park"
      points: 1
      stimulus: |
        "We hold these truths to be self-evident; that all men and women are created equal; that they are endowed by their Creator with certain inalienable rights; that among these are life, liberty, and the pursuit of happiness; that to secure these rights governments are instituted, deriving their just powers from the consent of the governed. ... The history of mankind is a history of repeated injuries and usurpations on the part of man toward woman, having in direct object the establishment of an absolute tyranny over her. ... He has never permitted her to exercise her inalienable right to the elective franchise."

        — Declaration of Sentiments, Women's Rights Convention, Seneca Falls, New York, July 1848
      prompt: |
        The authors of the excerpt most directly modelled their document on the Declaration of Independence in order to
      options:
        - "call for American women to declare independence from the United States"
        - "show their support for the Whig Party's economic program"
        - "claim that women were entitled to the same founding principles of natural rights and consent that men already enjoyed"
        - "argue that the Declaration of Independence should be repealed"
      option_explanations:
        - |
          The document seeks rights within the nation, not separation from it.
        - |
          The convention addressed rights, not tariffs or banks; party economics are irrelevant here.
        - |
          Correct. By inserting "and women" into Jefferson's words and listing grievances against "man" as the colonists had against the king, the authors argued that the nation's own principles demanded women's rights.
        - |
          It relies on the Declaration's authority; it does not reject it.
      answer: 2
      explanation: |
        Sourcing (purpose). Reformers borrowed the language of 1776 to make their claims sound American rather than radical.

    - slug: apush-u04-w13-q02
      type: multiple_choice
      topic_code: "4.11"
      source: "Primary source: Declaration of Sentiments (1848), National Park Service"
      points: 1
      stimulus: |
        "We hold these truths to be self-evident; that all men and women are created equal; that they are endowed by their Creator with certain inalienable rights; that among these are life, liberty, and the pursuit of happiness; that to secure these rights governments are instituted, deriving their just powers from the consent of the governed. ... The history of mankind is a history of repeated injuries and usurpations on the part of man toward woman, having in direct object the establishment of an absolute tyranny over her. ... He has never permitted her to exercise her inalienable right to the elective franchise."

        — Declaration of Sentiments, Women's Rights Convention, Seneca Falls, New York, July 1848
      prompt: |
        Which development most directly led to the organising of the convention that produced the excerpt?
      options:
        - "The founding of the National Woman Suffrage Association"
        - "The ratification of the Nineteenth Amendment"
        - "The end of the Mexican–American War"
        - "Women's experience in the abolitionist movement, including the exclusion of women delegates from the World Anti-Slavery Convention in London in 1840"
      option_explanations:
        - |
          The NWSA was founded in 1869, after the Civil War.
        - |
          The Nineteenth Amendment came in 1920, seventy-two years later; Seneca Falls began that campaign.
        - |
          The war's end (February 1848) was coincident, not a cause of the women's convention.
        - |
          Correct. Elizabeth Cady Stanton and Lucretia Mott met in London when the convention refused to seat women; abolition gave women skills in organising and petitioning and taught them to see their own subordination.
      answer: 3
      explanation: |
        Causation (4.11). The antislavery movement trained and radicalised the first women's rights leaders.

    - slug: apush-u04-w13-q03
      type: multiple_choice
      topic_code: "3.4"
      source: "Primary source: Declaration of Sentiments (1848), National Park Service; Declaration of Independence (1776), National Archives"
      points: 1
      stimulus: |
        "We hold these truths to be self-evident; that all men and women are created equal; that they are endowed by their Creator with certain inalienable rights; that among these are life, liberty, and the pursuit of happiness; that to secure these rights governments are instituted, deriving their just powers from the consent of the governed. ... The history of mankind is a history of repeated injuries and usurpations on the part of man toward woman, having in direct object the establishment of an absolute tyranny over her. ... He has never permitted her to exercise her inalienable right to the elective franchise."

        — Declaration of Sentiments, Women's Rights Convention, Seneca Falls, New York, July 1848
      prompt: |
        Review. The ideas in the first sentence of the excerpt originally drew most directly on which intellectual tradition?
      options:
        - "Enlightenment natural-rights philosophy, especially John Locke's theory of government by consent"
        - "The divine right of kings"
        - "Mercantilist economic theory"
        - "The Puritan idea of a covenanted community ruled by the elect"
      option_explanations:
        - |
          Correct. Jefferson's 1776 language, which the authors adapted, drew on Locke and the Enlightenment: natural rights, government created to secure them, and consent of the governed.
        - |
          Divine right justified monarchy; the Declaration rejects it.
        - |
          Mercantilism is an economic theory of colonies serving the mother country, not a theory of rights.
        - |
          Puritan covenant theology influenced colonial self-government but did not hold that all are created equal with inalienable rights.
      answer: 0
      explanation: |
        Making connections (Topic 3.4 review). Revolutionary ideals kept generating new claims, by women, by African Americans, by workers.

    # ---- Stimulus set: Frederick Douglass (4.12, review 2.6)
    - slug: apush-u04-w13-q04
      type: multiple_choice
      topic_code: "4.12"
      source: "Primary source: Frederick Douglass, Narrative of the Life of Frederick Douglass, an American Slave (1845), Project Gutenberg"
      points: 1
      stimulus: |
        "I now understood what had been to me a most perplexing difficulty—to wit, the white man's power to enslave the black man. It was a grand achievement, and I prized it highly. From that moment, I understood the pathway from slavery to freedom."

        — Frederick Douglass, Narrative of the Life of Frederick Douglass, an American Slave (1845), describing his reaction as a boy in Baltimore when his enslaver forbade his wife to continue teaching him to read
      prompt: |
        Douglass's point in the excerpt is that
      options:
        - "keeping enslaved people illiterate was a deliberate means of control, so learning to read was a step toward freedom"
        - "freedom could be achieved only through armed revolt"
        - "white southerners generally encouraged enslaved people to become literate"
        - "literacy had little value for enslaved people"
      option_explanations:
        - |
          Correct. Hearing that reading would make him unfit to be a slave, Douglass understood that ignorance sustained slavery, and so education became his "pathway" out.
        - |
          The excerpt is about knowledge as a path to freedom; Douglass escaped in 1838 by disguise and train, not revolt.
        - |
          The episode shows the reverse: his enslaver stopped his lessons, and southern laws restricted teaching enslaved people.
        - |
          He "prized it highly"; literacy was central to his freedom and career.
      answer: 0
      explanation: |
        Reading a primary source for its argument (4.12).

    - slug: apush-u04-w13-q05
      type: multiple_choice
      topic_code: "4.12"
      source: "Primary source: Frederick Douglass, Narrative (1845), Project Gutenberg; general knowledge"
      points: 1
      stimulus: |
        "I now understood what had been to me a most perplexing difficulty—to wit, the white man's power to enslave the black man. It was a grand achievement, and I prized it highly. From that moment, I understood the pathway from slavery to freedom."

        — Frederick Douglass, Narrative of the Life of Frederick Douglass, an American Slave (1845), describing his reaction as a boy in Baltimore when his enslaver forbade his wife to continue teaching him to read
      prompt: |
        Douglass's Narrative was published in 1845 primarily to
      options:
        - "encourage southern planters to treat enslaved people more kindly so slavery could continue"
        - "argue for colonization of free Black Americans in Liberia"
        - "support the annexation of Texas"
        - "persuade northern readers of slavery's brutality and of Black humanity and intelligence, advancing the abolitionist cause"
      option_explanations:
        - |
          Douglass sought abolition, not reformed slavery.
        - |
          Douglass and most Black abolitionists rejected colonization.
        - |
          Abolitionists opposed annexing Texas as an expansion of slavery.
        - |
          Correct. Published with endorsements by Garrison and Wendell Phillips, the book answered claims that a fugitive could not have written so eloquently and gave abolitionists a powerful testimony.
      answer: 3
      explanation: |
        Sourcing (purpose and audience). Slave narratives were written for a northern reading public as antislavery arguments.

    - slug: apush-u04-w13-q06
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        "I now understood what had been to me a most perplexing difficulty—to wit, the white man's power to enslave the black man. It was a grand achievement, and I prized it highly. From that moment, I understood the pathway from slavery to freedom."

        — Frederick Douglass, Narrative of the Life of Frederick Douglass, an American Slave (1845), describing his reaction as a boy in Baltimore when his enslaver forbade his wife to continue teaching him to read
      prompt: |
        Review. Restrictions on enslaved people's education, like the one Douglass describes, continued a pattern that began with which colonial development?
      options:
        - "The Navigation Acts"
        - "Slave codes such as South Carolina's Negro Act of 1740, passed after the Stono Rebellion, which among other controls barred teaching enslaved people to write"
        - "The Half-Way Covenant in New England churches"
        - "The headright system in Virginia"
      option_explanations:
        - |
          The Navigation Acts regulated colonial trade.
        - |
          Correct. Colonial slave codes defined slavery as hereditary and racial and restricted movement, assembly and literacy; South Carolina's 1740 law followed the Stono Rebellion of 1739.
        - |
          The Half-Way Covenant (1662) concerned church membership for children of Puritans.
        - |
          Headrights granted land for importing labourers; they encouraged servitude but did not regulate education.
      answer: 1
      explanation: |
        Continuity (Topic 2.6 review). Laws to control enslaved people tightened after every revolt, from Stono (1739) to Nat Turner (1831).

    # ---- Stimulus set: census data (4.13, review 4.5)
    - slug: apush-u04-w13-q07
      type: multiple_choice
      topic_code: "4.13"
      source: "U.S. Census Bureau, decennial censuses 1790–1840, as compiled in Historical Statistics of the United States"
      points: 1
      stimulus: |
        Enslaved and free African American population of the United States (rounded)

        | Census | Enslaved | Free Black |
        |---|---|---|
        | 1790 | about 700,000 | about 60,000 |
        | 1810 | about 1,190,000 | about 190,000 |
        | 1830 | about 2,010,000 | about 320,000 |
        | 1840 | about 2,490,000 | about 390,000 |

        Source: U.S. Census Bureau, decennial censuses
      prompt: |
        Which conclusion is best supported by the data?
      options:
        - "Slavery grew rapidly in absolute numbers between 1790 and 1840, even after the 1808 ban on importing enslaved people."
        - "The enslaved population grew only because of the international slave trade."
        - "The free Black population shrank between 1790 and 1840."
        - "Slavery was declining by 1840 because the free Black population was larger than the enslaved population."
      option_explanations:
        - |
          Correct. The enslaved population more than tripled; since imports were illegal after 1808, the growth after 1810 came overwhelmingly from natural increase.
        - |
          The legal international trade ended in 1808, yet the enslaved population roughly doubled between 1810 and 1840.
        - |
          The free Black population rose from about 60,000 to about 390,000.
        - |
          The free Black population was only about a sixth the size of the enslaved population in 1840.
      answer: 0
      explanation: |
        Interpreting quantitative data. Describe the trend and test each option against every row.

    - slug: apush-u04-w13-q08
      type: multiple_choice
      topic_code: "4.13"
      source: "U.S. Census Bureau, decennial censuses 1790–1840; general knowledge"
      points: 1
      stimulus: |
        Enslaved and free African American population of the United States (rounded)

        | Census | Enslaved | Free Black |
        |---|---|---|
        | 1790 | about 700,000 | about 60,000 |
        | 1810 | about 1,190,000 | about 190,000 |
        | 1830 | about 2,010,000 | about 320,000 |
        | 1840 | about 2,490,000 | about 390,000 |

        Source: U.S. Census Bureau, decennial censuses
      prompt: |
        Which of the following most directly explains the growth of the enslaved population shown in the table?
      options:
        - "The success of the American Colonization Society"
        - "The northern states' adoption of gradual emancipation laws"
        - "The expansion of short-staple cotton cultivation into the Deep South after the invention of the cotton gin, which raised the value of enslaved labour"
        - "The Missouri Compromise's ban on slavery north of 36°30′"
      option_explanations:
        - |
          The ACS resettled only a few thousand people and did not affect the enslaved population's growth.
        - |
          Northern emancipation reduced slavery in the North and helps explain the growing free Black population, not the enslaved one.
        - |
          Correct. Cotton made enslaved people enormously valuable; slaveholders had every incentive to expand the enslaved population, and the domestic slave trade moved people from the Upper South to new cotton lands.
        - |
          The compromise limited slavery's geographic spread; it did not cause growth.
      answer: 2
      explanation: |
        Causation (4.13). Connect technology, world markets and the domestic slave trade.

    - slug: apush-u04-w13-q09
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Enslaved and free African American population of the United States (rounded)

        | Census | Enslaved | Free Black |
        |---|---|---|
        | 1790 | about 700,000 | about 60,000 |
        | 1810 | about 1,190,000 | about 190,000 |
        | 1830 | about 2,010,000 | about 320,000 |
        | 1840 | about 2,490,000 | about 390,000 |

        Source: U.S. Census Bureau, decennial censuses
      prompt: |
        Review. The trend in the enslaved population was most closely connected to which northern development of the market revolution?
      options:
        - "The construction of the transcontinental railroad"
        - "The rise of the Ashcan School of painting"
        - "The decline of whaling in New England"
        - "The growth of New England textile mills such as those at Lowell, which consumed southern cotton"
      option_explanations:
        - |
          The transcontinental railroad was completed in 1869.
        - |
          The Ashcan School belongs to the early 1900s.
        - |
          Whaling peaked in the 1840s and 1850s and had no connection to the enslaved population.
        - |
          Correct. Northern mills, with British ones, created demand for raw cotton, and northern merchants, shippers and banks financed and carried it; the free-labour North was tied economically to slave-grown cotton.
      answer: 3
      explanation: |
        Making connections (Topic 4.5 review). The market revolution linked northern industry to southern slavery.

    - slug: apush-u04-w13-q10
      type: multiple_choice
      topic_code: "4.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Preachers of the Second Great Awakening such as Charles Grandison Finney differed from strict Calvinists of the colonial era in emphasising that
      options:
        - "individuals could choose salvation through their own free will and could work to perfect themselves and society"
        - "God had predestined a small elect for salvation and nothing could change it"
        - "religion should be confined to established state churches"
        - "only ordained ministers with university training could interpret scripture"
      option_explanations:
        - |
          Correct. Finney taught that sin was voluntary and conversion a choice; that optimism about human ability fed reform movements.
        - |
          That is the Calvinist predestination the revivalists moved away from.
        - |
          Revival religion flourished as states disestablished churches; it was voluntary and competitive.
        - |
          Revivalists favoured lay and untrained preachers and emotional appeals over learned authority.
      answer: 0
      explanation: |
        Comparison (4.10). Free will and perfectionism are the theological roots of reform.

    - slug: apush-u04-w13-q11
      type: multiple_choice
      topic_code: "4.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Western New York was called the "burned-over district" in the 1820s–1840s because
      options:
        - "repeated waves of revivals and new religious movements swept through it"
        - "forest fires cleared it for settlement"
        - "it was the site of the first textile mills"
        - "British troops burned its towns in the War of 1812"
      option_explanations:
        - |
          Correct. Along the Erie Canal corridor, revivals (Finney at Rochester), new faiths (the Latter-day Saints) and reform movements (abolition, women's rights at Seneca Falls) appeared in quick succession.
        - |
          The name is a metaphor for religious fervour, not literal fire.
        - |
          The first mills were in Rhode Island and Massachusetts.
        - |
          The British did burn Buffalo in 1813, but that is not the source of the nickname.
      answer: 0
      explanation: |
        Topic 4.10. Notice the link between the canal's rapid economic change and religious ferment.

    - slug: apush-u04-w13-q12
      type: multiple_choice
      topic_code: "4.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Horace Mann and Dorothea Dix were similar in that both
      options:
        - "founded utopian communities"
        - "sought to use state governments to build public institutions, schools in Mann's case and asylums in Dix's, to improve individuals and society"
        - "led armed resistance to slavery"
        - "opposed all government involvement in social welfare"
      option_explanations:
        - |
          Brook Farm, New Harmony and Oneida were founded by others; Mann and Dix worked within government.
        - |
