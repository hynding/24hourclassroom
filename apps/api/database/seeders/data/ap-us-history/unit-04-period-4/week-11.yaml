    - slug: apush-u04-w11-q15
      type: multiple_choice
      topic_code: "4.6"
      source: "U.S. Department of Homeland Security, Yearbook of Immigration Statistics (persons obtaining lawful permanent resident status by decade, from 1820)"
      points: 1
      stimulus: |
        Immigrants arriving in the United States by decade (rounded)

        | Decade | Immigrants |
        |---|---|
