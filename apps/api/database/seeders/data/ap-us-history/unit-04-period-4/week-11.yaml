week: 11
unit: 4
title: "America on the World Stage and the Market Revolution"
topics: ["4.4", "4.5", "4.6"]
guide: guides/week-11.md
guide_description: |
  The road from the Embargo to the War of 1812 and the Monroe Doctrine; how roads, canals, steamboats, factories
  and Marshall's commerce decisions knit a national market; and what the market revolution did to work, family,
  gender, class and immigration. Worked examples: a causation chain from the Embargo to the Hartford Convention,
  reading an immigration table, and an SAQ on the Lowell system.
flashcards_description: |
  30 cards on the Embargo and the War of 1812, the Monroe Doctrine, the transportation and industrial revolutions,
  McCulloch and Gibbons, and the social effects of the market revolution.

flashcards:
  - front: Embargo Act (1807) → cause and effect
    back: |
      Jefferson's answer to British and French seizures of American ships and British impressment: a ban on all American exports. It hurt Americans far more than Europe, especially New England merchants, and was repealed in 1809.
    topic_code: "4.4"
  - front: Impressment → what it was and why it angered Americans
    back: |
      The Royal Navy's practice of seizing sailors from American merchant ships, claiming they were British deserters; thousands of American citizens were taken. The Chesapeake–Leopard affair (1807) made it a national insult.
    topic_code: "4.4"
  - front: War Hawks (1811–1812) → who and what they wanted
    back: |
      Young southern and western Republicans in Congress, led by Henry Clay and John C. Calhoun, who demanded war with Britain over impressment, national honour, British aid to Native resistance in the Northwest and, for some, the conquest of Canada.
    topic_code: "4.4"
  - front: Tecumseh and Tenskwatawa → their goal and its end
    back: |
      Shawnee brothers who built a pan-Indian confederacy to stop American expansion north of the Ohio, Tenskwatawa (the Prophet) through religious revival and Tecumseh through alliance with Britain. Defeated at Tippecanoe (1811); Tecumseh died at the Thames (1813).
    topic_code: "4.4"
  - front: War of 1812 → three outcomes
    back: |
      A military draw ended by the Treaty of Ghent (1814) restoring prewar boundaries; a surge of nationalism after Jackson's victory at New Orleans (1815); and the collapse of Native resistance east of the Mississippi and of the Federalist Party.
    topic_code: "4.4"
  - front: Hartford Convention (1814–1815) → demands and consequence
    back: |
      New England Federalists met to protest the war and proposed constitutional amendments (a two-thirds vote for war and for admitting states, an end to the three-fifths bonus). News of Ghent and New Orleans arrived at once, and the party looked disloyal; it never recovered.
    topic_code: "4.4"
  - front: Treaty of Ghent (signed December 1814) → terms
    back: |
      Restored the status quo before the war: no territory changed hands and impressment was not mentioned. The Battle of New Orleans was fought in January 1815, before word of the treaty arrived.
    topic_code: "4.4"
  - front: Rush–Bagot Agreement (1817) and Convention of 1818 → what they settled
    back: |
      Demilitarised the Great Lakes, fixed the U.S.–Canada border at the 49th parallel from Lake of the Woods to the Rockies, and set joint occupation of Oregon. The start of a long Anglo-American peace.
    topic_code: "4.4"
  - front: Adams–Onís Treaty (1819) → what the U.S. gained
    back: |
      Spain ceded Florida and drew a transcontinental boundary that gave up Spanish claims to Oregon; the U.S. gave up claims to Texas. John Quincy Adams used Jackson's raid into Spanish Florida (1818) as leverage.
    topic_code: "4.4"
  - front: Monroe Doctrine (1823) → its two principles
    back: |
      The Western Hemisphere was closed to new European colonization, and the U.S. would treat European intervention in the Americas as a threat to its own "peace and safety"; in return it would stay out of European wars. Written largely by John Quincy Adams.
    topic_code: "4.4"
  - front: Monroe Doctrine → why it could be enforced in 1823
    back: |
      It could not be by American power alone; the British navy, which also wanted Latin American markets open, deterred European reconquest. The doctrine mattered more as a statement of hemispheric ambition, invoked heavily later in the century.
    topic_code: "4.4"
  - front: Market revolution → definition
    back: |
      The shift, roughly 1815–1850, from local and household production for use toward specialised production for distant markets, connected by new transportation, credit and communication. It reshaped work, family and regions.
    topic_code: "4.5"
  - front: Erie Canal (1825) → cost, route, effect
    back: |
      A 363-mile New York State canal linking the Hudson River at Albany to Lake Erie at Buffalo. Freight costs between Buffalo and New York City fell by about 90%, New York City became the nation's leading port, and the Great Lakes West was tied to the Northeast.
    hint: Built by a state, not the federal government.
    topic_code: "4.5"
  - front: National Road → what and why it matters
    back: |
      The federally funded Cumberland Road, begun in 1811 from Cumberland, Maryland, and extended west toward Ohio, Indiana and Illinois. One of the few large federal internal improvements before the Civil War.
    topic_code: "4.5"
  - front: Steamboats → inventor and effect
    back: |
      Robert Fulton's Clermont ran the Hudson in 1807. Steamboats could go upstream, so the Ohio and Mississippi carried goods both ways and western farm produce flowed to New Orleans.
    topic_code: "4.5"
  - front: Gibbons v. Ogden (1824) → holding
    back: |
      Marshall's Court struck down New York's steamboat monopoly because it conflicted with a federal licence; Congress's power over interstate commerce is broad and includes navigation. It opened rivers to competition and strengthened the national market.
    topic_code: "4.5"
  - front: McCulloch v. Maryland (1819) → two holdings
    back: |
      Congress could charter a national bank under the necessary and proper clause (implied powers), and a state could not tax a federal institution because "the power to tax involves the power to destroy." Federal supremacy and loose construction together.
    topic_code: "4.5"
  - front: Interchangeable parts → who and why it mattered
    back: |
      Associated with Eli Whitney and federal armouries such as Springfield: machine-made parts identical enough to swap. It made mass production and easy repair possible, the root of the American system of manufactures.
    topic_code: "4.5"
  - front: Samuel Slater (1790s) → significance
    back: |
      A British mechanic who memorised Arkwright's spinning machinery and built a water-powered cotton mill in Pawtucket, Rhode Island (1793), using child and family labour. The beginning of the American factory system.
    topic_code: "4.5"
  - front: Lowell system → how it worked
    back: |
      Large integrated textile mills at Lowell, Massachusetts (from the 1820s), staffed by young unmarried New England farm women who lived in supervised boardinghouses. Wages were attractive at first; wage cuts and speed-ups led to strikes in 1834 and 1836.
    topic_code: "4.6"
  - front: Cotton gin (1793) → cause → effect
    back: |
      Eli Whitney's machine removed seeds from short-staple cotton quickly. Upland cotton became hugely profitable, so slavery expanded into the Deep South instead of declining, and southern cotton fed British and New England mills.
    topic_code: "4.5"
  - front: John Deere's steel plough and McCormick's reaper (1830s) → effect
    back: |
      Deere's steel plough cut the tough prairie sod; McCormick's mechanical reaper let one farmer harvest far more grain. Together they made the Midwest a commercial grain region tied to eastern markets.
    topic_code: "4.5"
  - front: Telegraph (1844) → who and what changed
    back: |
      Samuel Morse's line from Washington to Baltimore sent messages almost instantly. Prices, news and orders now moved faster than goods, binding markets and newspapers together.
    topic_code: "4.5"
  - front: Separate spheres / cult of domesticity → definition
    back: |
      The middle-class ideal that, as paid work left the home, men belonged to the competitive public world and women to a moral, private home as wives and mothers. It confined women but also gave them a moral authority they used in reform.
    topic_code: "4.6"
  - front: Market revolution → effect on the middle class
    back: |
      Clerks, shopkeepers, managers and professionals formed a growing middle class with new values: self-discipline, education, temperance, domesticity and evangelical religion. Wage work separated them from the labouring class.
    topic_code: "4.6"
  - front: Irish immigration in the 1840s → cause, where they went, reception
    back: |
      The potato famine (from 1845) drove about a million and a half Irish to America by the mid-1850s. Mostly poor and Catholic, they settled in northeastern cities and took unskilled jobs, meeting anti-Catholic nativism.
    topic_code: "4.6"
  - front: German immigration in the 1840s → how it differed from Irish
    back: |
      Germans fled economic hardship and the failed revolutions of 1848; more had money or skills, many bought farms in the Midwest (Wisconsin, Missouri, Ohio), and they were Catholic, Protestant or Jewish.
    topic_code: "4.6"
  - front: Commonwealth v. Hunt (1842) → significance for workers
    back: |
      The Massachusetts high court ruled that a labour union was not in itself an illegal conspiracy. Early unions such as the ten-hour movement gained legal standing, though they remained weak.
    topic_code: "4.6"
  - front: Compare work in the North and South under the market revolution
    back: |
      The North built factories, wage labour and diversified farms tied to cities by canals and rails; the South poured capital into enslaved labour and cotton, with fewer cities, factories and miles of track. Both were linked in one market.
    topic_code: "4.6"
  - front: Which theme? The Erie Canal and the Great Lakes trade
    back: |
      Work, Exchange, and Technology (WXT) above all, with Geography and the Environment (GEO): a human-made waterway overcame the Appalachian barrier and re-routed the West's trade from New Orleans to New York.
    topic_code: "4.5"

quiz:
  description: |
    25 questions · about 40 minutes · about 70% this week (the Embargo and the War of 1812, the Monroe Doctrine,
    the market revolution and its social effects) and 30% review of week 10 (the Marshall Court, the American
    System, the Missouri Compromise) and Period 3. Multiple choice, select-all and true/false items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long essay are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set: the Monroe Doctrine (4.4, review 3.10)
    - slug: apush-u04-w11-q01
      type: multiple_choice
      topic_code: "4.4"
      source: "Primary source: James Monroe, Seventh Annual Message (1823), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "... the occasion has been judged proper for asserting, as a principle in which the rights and interests of the United States are involved, that the American continents, by the free and independent condition which they have assumed and maintain, are henceforth not to be considered as subjects for future colonization by any European powers. ... In the wars of the European powers in matters relating to themselves we have never taken any part, nor does it comport with our policy to do so. ... We owe it, therefore, to candor and to the amicable relations existing between the United States and those powers to declare that we should consider any attempt on their part to extend their system to any portion of this hemisphere as dangerous to our peace and safety."

        — President James Monroe, annual message to Congress, December 2, 1823
      prompt: |
        The excerpt was most directly a response to
      options:
        - "fears that European monarchies would help Spain reconquer its newly independent Latin American colonies, and Russian claims on the Pacific coast"
        - "the outbreak of the Mexican–American War"
        - "French attempts to buy back the Louisiana Territory"
        - "British impressment of American sailors"
      option_explanations:
        - |
          Correct. After Spain's colonies won independence, the conservative Holy Alliance seemed ready to restore Spanish rule, and Russia claimed the coast south toward Oregon; the message warned both off.
        - |
          The Mexican–American War began in 1846, twenty-three years later.
        - |
          France never tried to repurchase Louisiana; the European threat in 1823 came from the Holy Alliance and Russia.
        - |
          Impressment ended with the Napoleonic Wars in 1815 and is not mentioned; the message concerns the Western Hemisphere.
      answer: 0
      explanation: |
        Contextualization (4.4). Latin American independence and the restoration of monarchy in Europe frame the doctrine.

    - slug: apush-u04-w11-q02
      type: multiple_choice
      topic_code: "4.4"
      source: "Primary source: James Monroe, Seventh Annual Message (1823), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "... the occasion has been judged proper for asserting, as a principle in which the rights and interests of the United States are involved, that the American continents, by the free and independent condition which they have assumed and maintain, are henceforth not to be considered as subjects for future colonization by any European powers. ... In the wars of the European powers in matters relating to themselves we have never taken any part, nor does it comport with our policy to do so. ... We owe it, therefore, to candor and to the amicable relations existing between the United States and those powers to declare that we should consider any attempt on their part to extend their system to any portion of this hemisphere as dangerous to our peace and safety."

        — President James Monroe, annual message to Congress, December 2, 1823
      prompt: |
        In 1823 the policy described in the excerpt depended in practice on
      options:
        - "a large standing U.S. army stationed in Latin America"
        - "the British navy, since Britain also wanted Latin American markets kept open"
        - "approval by the Holy Alliance"
        - "a formal military alliance between the United States and the new Latin American republics"
      option_explanations:
        - |
          The U.S. army in 1823 was small and stationed on the frontier; the United States could not have enforced the doctrine alone.
        - |
          Correct. Britain had proposed a joint declaration; Adams insisted on a unilateral American statement, knowing British sea power would deter intervention anyway.
        - |
          The Holy Alliance was the target of the warning, not a partner.
        - |
          The United States made no such alliance; it declared a unilateral policy, which is why Latin Americans later saw the doctrine as self-interested.
      answer: 1
      explanation: |
        Analysing the gap between a declaration and the power behind it (WOR theme). The doctrine announced ambitions the U.S. would enforce only later.

    - slug: apush-u04-w11-q03
      type: multiple_choice
      topic_code: "4.4"
      source: "Primary source: James Monroe, Seventh Annual Message (1823), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "... the occasion has been judged proper for asserting, as a principle in which the rights and interests of the United States are involved, that the American continents, by the free and independent condition which they have assumed and maintain, are henceforth not to be considered as subjects for future colonization by any European powers. ... In the wars of the European powers in matters relating to themselves we have never taken any part, nor does it comport with our policy to do so. ... We owe it, therefore, to candor and to the amicable relations existing between the United States and those powers to declare that we should consider any attempt on their part to extend their system to any portion of this hemisphere as dangerous to our peace and safety."

        — President James Monroe, annual message to Congress, December 2, 1823
      prompt: |
        Which development in the decade before 1823 most strengthened the United States' position to make the claim in the excerpt?
      options:
        - "The Embargo Act (1807)"
        - "The Missouri Compromise (1820)"
        - "The Adams–Onís Treaty (1819), in which Spain ceded Florida and recognised a boundary to the Pacific"
        - "The Hartford Convention (1814–1815)"
      option_explanations:
        - |
          The Embargo was a failed attempt at economic coercion that weakened rather than strengthened American standing.
        - |
          The Missouri Compromise was a domestic settlement about slavery, not a foreign-policy gain.
        - |
          Correct. Secretary of State John Quincy Adams, the doctrine's main author, had already pushed Spain out of Florida and gained a claim reaching the Pacific, making the U.S. a continental power.
        - |
          The Hartford Convention exposed disunity and embarrassed the Federalists; it did not strengthen the nation abroad.
      answer: 2
      explanation: |
        Causation (4.4). Postwar diplomacy (Rush–Bagot, the Convention of 1818, Adams–Onís) set up the Monroe Doctrine.

    - slug: apush-u04-w11-q04
      type: multiple_choice
      topic_code: "3.10"
      source: "Primary source: James Monroe, Seventh Annual Message (1823), Avalon Project, Yale Law School; George Washington, Farewell Address (1796), general knowledge"
      points: 1
      stimulus: |
        "... the occasion has been judged proper for asserting, as a principle in which the rights and interests of the United States are involved, that the American continents, by the free and independent condition which they have assumed and maintain, are henceforth not to be considered as subjects for future colonization by any European powers. ... In the wars of the European powers in matters relating to themselves we have never taken any part, nor does it comport with our policy to do so. ... We owe it, therefore, to candor and to the amicable relations existing between the United States and those powers to declare that we should consider any attempt on their part to extend their system to any portion of this hemisphere as dangerous to our peace and safety."

        — President James Monroe, annual message to Congress, December 2, 1823
      prompt: |
        Review. The second sentence of the excerpt shows the most continuity with which earlier statement of American policy?
      options:
        - "Washington's Farewell Address (1796), which advised avoiding permanent alliances and entanglement in European quarrels"
        - "The Northwest Ordinance (1787)"
        - "The Declaration of Independence's list of grievances against the king"
        - "The Treaty of Alliance with France (1778)"
      option_explanations:
        - |
          Correct. Washington had warned against entangling the nation in Europe's quarrels and issued the Neutrality Proclamation (1793). Monroe repeats that separation while adding the claim to a separate American hemisphere.
        - |
          The Northwest Ordinance organised western territory and banned slavery there; it was not a foreign-policy statement.
        - |
          The Declaration justified separation from Britain; it set no rule about staying out of European wars.
        - |
          The French alliance was the very kind of European entanglement that Washington and later Monroe wished to avoid; the U.S. let it lapse in 1800.
      answer: 0
      explanation: |
        Continuity and change (Topic 3.10 review). Neutrality toward Europe continues from Washington; hemispheric guardianship is new.

    # ---- Stimulus set: McCulloch v. Maryland (review 4.2, 3.10; 4.5)
    - slug: apush-u04-w11-q05
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: McCulloch v. Maryland, 17 U.S. 316 (1819), Justia U.S. Supreme Court"
      points: 1
      stimulus: |
        "Let the end be legitimate, let it be within the scope of the Constitution, and all means which are appropriate, which are plainly adapted to that end, which are not prohibited, but consist with the letter and spirit of the Constitution, are Constitutional. ... That the power to tax involves the power to destroy; that the power to destroy may defeat and render useless the power to create; that there is a plain repugnance in conferring on one Government a power to control the constitutional measures of another, which other, with respect to those very measures, is declared to be supreme over that which exerts the control, are propositions not to be denied."

        — Chief Justice John Marshall, McCulloch v. Maryland, 1819
      prompt: |
        Review. The first sentence of the excerpt is an argument for
      options:
        - "the implied powers of Congress under the necessary and proper clause"
        - "the right of states to nullify federal laws"
        - "strict construction of the Constitution"
        - "limiting the Supreme Court's power of judicial review"
      option_explanations:
        - |
          Correct. Marshall adopts Hamilton's 1791 reasoning: a bank is not listed, but it is a means "plainly adapted" to enumerated ends such as taxing, borrowing and regulating commerce.
        - |
          The second sentence denies states power to control federal measures; nullification is the reverse claim.
        - |
          Strict construction allows only powers expressly listed; Marshall argues that any appropriate means to a legitimate end is allowed, the opposite view.
        - |
          Marshall is using judicial review to uphold a federal law and strike down a state tax, extending the Court's role.
      answer: 0
      explanation: |
        Review of the Marshall Court (Topic 4.2). Loose construction and federal supremacy are the two halves of McCulloch.

    - slug: apush-u04-w11-q06
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: McCulloch v. Maryland, 17 U.S. 316 (1819), Justia U.S. Supreme Court"
      points: 1
      stimulus: |
        "Let the end be legitimate, let it be within the scope of the Constitution, and all means which are appropriate, which are plainly adapted to that end, which are not prohibited, but consist with the letter and spirit of the Constitution, are Constitutional. ... That the power to tax involves the power to destroy; that the power to destroy may defeat and render useless the power to create; that there is a plain repugnance in conferring on one Government a power to control the constitutional measures of another, which other, with respect to those very measures, is declared to be supreme over that which exerts the control, are propositions not to be denied."

        — Chief Justice John Marshall, McCulloch v. Maryland, 1819
      prompt: |
        Review. Maryland's tax on the Baltimore branch of the Second Bank in 1818 is best understood in the context of
      options:
        - "popular hostility to the Second Bank as it tightened credit during the Panic of 1819"
        - "British efforts to undermine American banking"
        - "southern opposition to the Missouri Compromise"
        - "Federalist support for the bank as a source of state revenue"
      option_explanations:
        - |
          Correct. Several states taxed or tried to drive out the Second Bank's branches as it called in loans and blamed for the panic; McCulloch protected it.
        - |
          There is no evidence of British involvement; the conflict was between a state and a federally chartered bank.
        - |
          The Missouri Compromise came in 1820; the bank tax was about banking and state power, not slavery.
        - |
          The Federalists were nearly gone, and Maryland meant to burden the bank, not support it.
      answer: 0
      explanation: |
        Contextualization (Topic 4.2/4.3 review). The case was part of the 1819 backlash against the bank that Jackson would later ride.

    - slug: apush-u04-w11-q07
      type: multiple_choice
      topic_code: "3.10"
      source: "Primary source: McCulloch v. Maryland, 17 U.S. 316 (1819), Justia U.S. Supreme Court; general knowledge of the 1791 bank debate"
      points: 1
      stimulus: |
        "Let the end be legitimate, let it be within the scope of the Constitution, and all means which are appropriate, which are plainly adapted to that end, which are not prohibited, but consist with the letter and spirit of the Constitution, are Constitutional. ... That the power to tax involves the power to destroy; that the power to destroy may defeat and render useless the power to create; that there is a plain repugnance in conferring on one Government a power to control the constitutional measures of another, which other, with respect to those very measures, is declared to be supreme over that which exerts the control, are propositions not to be denied."

        — Chief Justice John Marshall, McCulloch v. Maryland, 1819
      prompt: |
        Review. Marshall's reasoning in the first sentence most closely resembles the argument made in 1791 by
      options:
        - "Alexander Hamilton, in defence of the first Bank of the United States"
        - "Thomas Jefferson, against the first Bank of the United States"
        - "the Anti-Federalists, in opposing ratification"
        - "James Madison, in the Virginia Resolutions"
      option_explanations:
        - |
          Correct. Hamilton told Washington that the necessary and proper clause allowed any means with an obvious relation to an enumerated end; Marshall wrote that argument into constitutional law.
        - |
          Jefferson argued that "necessary" meant indispensable and that the bank was therefore unconstitutional, the view Marshall rejected.
        - |
          Anti-Federalists feared the necessary and proper clause would be used exactly as Marshall used it.
        - |
          The Virginia Resolutions (1798) asserted state authority against the Alien and Sedition Acts, the opposite direction from Marshall.
      answer: 0
      explanation: |
        Making connections (Topic 3.10 review). The bank debate of 1791 was settled in law in 1819 and reopened politically by Jackson in 1832.

    # ---- Stimulus set: Gibbons v. Ogden and the transportation revolution (4.5)
    - slug: apush-u04-w11-q08
      type: multiple_choice
      topic_code: "4.5"
      source: "Primary source: Gibbons v. Ogden, 22 U.S. 1 (1824), Justia U.S. Supreme Court"
      points: 1
      stimulus: |
        "Commerce, undoubtedly, is traffic, but it is something more: it is intercourse."

        — Chief Justice John Marshall, Gibbons v. Ogden, 1824, explaining why Congress's power to regulate commerce among the states includes navigation. The case arose when New York granted a monopoly on steamboat traffic in its waters, and Thomas Gibbons, holding a federal coasting licence, ran competing boats between New Jersey and New York.
      prompt: |
        The ruling described in the excerpt most directly contributed to
      options:
        - "the end of the Second Bank of the United States"
        - "a decline in the number of steamboats on American rivers"
        - "the growth of a national market by opening rivers and harbours to competing steamboat lines"
        - "state control over interstate railroads"
      option_explanations:
        - |
          The bank's end came from Jackson's veto (1832) and removal of deposits, unrelated to this commerce case.
        - |
          Steamboat traffic boomed after 1824 as monopolies fell.
        - |
          Correct. By striking down New York's monopoly, the decision encouraged competition, lowered fares and freight rates and helped make interstate transportation national.
        - |
          The ruling expanded federal, not state, authority over interstate commerce; railroads were barely beginning in 1824.
      answer: 2
      explanation: |
        Causation (4.5). Law as infrastructure: Marshall's commerce decision helped knit the market revolution together.

    - slug: apush-u04-w11-q09
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        "Commerce, undoubtedly, is traffic, but it is something more: it is intercourse."

        — Chief Justice John Marshall, Gibbons v. Ogden, 1824, explaining why Congress's power to regulate commerce among the states includes navigation. The case arose when New York granted a monopoly on steamboat traffic in its waters, and Thomas Gibbons, holding a federal coasting licence, ran competing boats between New Jersey and New York.
      prompt: |
        Steamboats were especially important to the western economy in the 1820s and 1830s because they
      options:
        - "carried most of the transatlantic cotton trade to Britain"
        - "replaced canals as the main route between the Great Lakes and New York City"
        - "allowed goods to move upstream on the Mississippi and Ohio rivers, making two-way river trade practical"
        - "were built only by the federal government"
      option_explanations:
        - |
          Atlantic shipping was still largely by sailing vessels in this period; steamboats transformed inland rivers.
        - |
          The Erie Canal and later railroads linked the Great Lakes to New York City; steamboats complemented canals rather than replacing them.
        - |
          Correct. Flatboats could only drift downstream; steam power let manufactured goods move up the rivers and turned river cities like Cincinnati and St. Louis into hubs.
        - |
          Steamboats were private enterprises, as the Gibbons case itself shows.
      answer: 2
      explanation: |
        Explaining a development (4.5, GEO). The West's rivers became two-way highways.

    - slug: apush-u04-w11-q10
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        "Commerce, undoubtedly, is traffic, but it is something more: it is intercourse."

        — Chief Justice John Marshall, Gibbons v. Ogden, 1824, explaining why Congress's power to regulate commerce among the states includes navigation. The case arose when New York granted a monopoly on steamboat traffic in its waters, and Thomas Gibbons, holding a federal coasting licence, ran competing boats between New Jersey and New York.
      prompt: |
        Review. Gibbons v. Ogden was consistent with the Marshall Court's earlier decisions in that it
      options:
        - "overturned the principle of judicial review established in Marbury v. Madison"
        - "expanded the powers of the states at the expense of Congress"
        - "refused to rule on cases involving economic regulation"
        - "asserted federal authority over state laws and promoted a national economy"
      option_explanations:
        - |
          Gibbons relied on judicial review to strike down a state law; it extended Marbury rather than overturning it.
        - |
          The Marshall Court almost always ruled the other way, limiting state laws that clashed with federal power or contracts.
        - |
          The Court actively ruled on economic questions: banks, contracts, monopolies.
        - |
          Correct. Like Marbury (1803), Dartmouth College (1819) and McCulloch (1819), Gibbons strengthened the federal government and protected a national market against state interference.
      answer: 3
      explanation: |
        Continuity (Topic 4.2 review). Identify the pattern across the Marshall Court's decisions.

    - slug: apush-u04-w11-q11
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following was a cause of the War of 1812?
      options:
        - "French seizure of Florida"
        - "Spanish closure of the port of New Orleans"
        - "American demands to annex Texas"
        - "British impressment of American sailors and British support for Native resistance in the Northwest"
      option_explanations:
        - |
          France never held Florida in this period; Spain did until 1819.
        - |
          The New Orleans crisis of 1802 was settled by the Louisiana Purchase in 1803.
        - |
          Texas annexation became an issue only after Texas independence in 1836.
        - |
          Correct. Impressment, British orders restricting neutral trade, and British aid to Tecumseh's confederacy drove Madison and the War Hawks to declare war in June 1812.
      answer: 3
      explanation: |
        Causation (4.4). Name both maritime grievances and western frontier grievances; the War Hawks came from the South and West.

