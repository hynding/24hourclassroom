    - slug: apush-u04-w11-q16
      type: short_answer
      topic_code: "4.4"
      source: "Described map; boundaries from the Convention of 1818 and the Adams–Onís (Transcontinental) Treaty of 1819, general knowledge"
      points: 3
      stimulus: |
        Map (described): North America in 1819. The United States runs from the Atlantic to the Rocky Mountains and now includes Florida, ceded by Spain. Its northern border with British North America follows the 49th parallel from the Lake of the Woods to the Rockies (Convention of 1818). Beyond the Rockies, the Oregon Country is shaded as jointly occupied by the United States and Britain. A stepped line running from the Sabine River along the Red and Arkansas rivers and then west along the 42nd parallel to the Pacific separates U.S. territory from Spanish Mexico, which still includes Texas, New Mexico and California (Adams–Onís Treaty, 1819). Large areas on both sides of the line are labelled with the names of American Indian nations such as the Seminole, Comanche, Lakota and Osage.
      prompt: |
        Using the map, answer (a), (b) and (c).

        (a) Briefly describe ONE way the boundaries shown on the map reflect a change in the position of the United States in North America since 1803.
        (b) Briefly explain ONE development from 1812 to 1819 that helped the United States gain the boundaries shown.
        (c) Briefly explain ONE way the boundaries shown on the map did not settle conflict over territory in North America in the following decades.
      answer: |
        (a) The United States now reached from the Atlantic to the Rockies, had gained Florida from Spain and held a claim, shared with Britain, all the way to the Pacific in Oregon; in 1803 it had only just acquired Louisiana and its western border was undefined.
        (b) Andrew Jackson's 1818 invasion of Spanish Florida against the Seminole showed Spain could not defend the colony, and Secretary of State John Quincy Adams used that weakness to win the cession and a transcontinental line in the Adams–Onís Treaty.
        (c) The line left Texas to Spain (then Mexico), but American settlers moved into Texas in the 1820s and 1830s, leading to Texas independence (1836), annexation (1845) and the Mexican–American War; Oregon's joint occupation became a crisis with Britain in the 1840s. American Indian nations shown on the map were not party to the treaties and continued to resist, as in the Seminole Wars.
      explanation: |
        One point per part.
        (a) Earns the point for describing expansion or consolidation shown on the map: Florida gained, a defined border with Spain to the Pacific, the 49th parallel with Britain, a claim to Oregon. Zero for describing the map without connecting it to change.
        (b) Earns the point for a specific development explained: Jackson's Florida raid (1818), Adams's diplomacy, Spain's weakness amid Latin American independence wars, the end of the War of 1812 and the Convention of 1818 / Rush–Bagot Agreement (1817). Zero for the Louisiana Purchase alone without explaining 1812–1819.
        (c) Earns the point for a specific later conflict explained: American settlement of Texas, Texas Revolution, annexation, Mexican–American War, Oregon dispute ("Fifty-four forty or fight"), Seminole Wars and Indian removal. Zero for a vague "there were more wars."
        Skill: analysing a non-text source; continuity and change (WOR, GEO).

