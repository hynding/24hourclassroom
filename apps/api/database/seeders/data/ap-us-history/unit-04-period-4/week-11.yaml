      prompt: |
        Which of the following best explains the trend shown in the table?
      options:
        - "The discovery of gold in Georgia, which drew miners from Asia"
        - "Famine in Ireland and economic and political upheaval in the German states, combined with demand for labour in the growing American economy"
        - "The end of the Atlantic slave trade, which led Africans to migrate voluntarily"
        - "Federal laws that paid immigrants' passage to the United States"
      option_explanations:
