    - slug: apush-u04-w11-q24
      type: short_answer
      topic_code: "4.6"
      source: "Secondary interpretation written for this course"
      points: 3
      stimulus: |
        Interpretation (written for this course): "The market revolution is often told as a story of progress: canals, factories and rising incomes. For many Americans it was a story of lost independence. The artisan who once owned his tools became a wage earner; the farm daughter at Lowell traded household work for the factory bell; the farmer who now grew for distant markets was exposed to price collapses he could not control, as in 1819 and 1837. Prosperity rose overall, but so did insecurity and inequality."
      prompt: |
        Using the interpretation, answer (a), (b) and (c).

        (a) Briefly describe the argument made in the interpretation.
        (b) Briefly explain ONE specific historical development from 1815 to 1848 that supports the argument.
        (c) Briefly explain ONE specific historical development from 1815 to 1848 that could be used to challenge the argument.
      answer: |
        (a) The author argues that although the market revolution brought progress and higher average prosperity, it cost many Americans their economic independence and left them more insecure and unequal.
        (b) The Lowell mill workers' strikes in 1834 and 1836 against wage cuts and higher boardinghouse charges show wage workers losing control of their conditions; the Panics of 1819 and 1837 ruined farmers and workers who now depended on distant markets and credit.
        (c) The market revolution also opened opportunities: Lowell wages gave young women cash and some independence from their families; the Erie Canal and steamboats raised farm prices in the West and lowered the cost of manufactured goods; a new middle class of clerks and professionals grew.
      explanation: |
        One point per part.
        (a) Earns the point for describing the claim that the market revolution produced dependence, insecurity or inequality alongside progress. Zero for "it is about canals and factories."
        (b) Earns the point for a specific development explained as support: wage labour replacing artisans, Lowell strikes (1834, 1836), Panic of 1819 or 1837, the ten-hour movement, Commonwealth v. Hunt as evidence of workers organising, immigrant poverty in cities. Zero for a development outside 1815–1848 or without explanation.
        (c) Earns the point for a specific development explained as challenge: rising farm incomes from canal access, cheaper goods, independence and wages for Lowell women, middle-class growth, the Erie Canal's boom for western farmers. Zero for a vague claim that "things got better."
        Skill: analysing secondary sources; claims and evidence.

    - slug: apush-u04-w11-q25
      type: long_answer
      topic_code: "4.5"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1815 and 1848 new transportation, new technology and new ways of organising work changed how Americans produced, traded and lived. You might consider transportation and communication, manufacturing and wage labour, agriculture in the North, West and South, or the effects on families and immigrants.

        Evaluate the extent to which the market revolution changed the economy of the United States from 1815 to 1848.
      answer: |
        Thesis: The market revolution transformed the United States from a collection of local, largely self-sufficient economies into an interdependent national market, but the change was uneven: the Northeast industrialised and the Midwest commercialised its farms, while the South expanded an older system of enslaved labour producing cotton for export.

        Context: after the War of 1812, nationalist Republicans adopted Clay's American System (Second Bank, Tariff of 1816), British goods flooded American markets, and western settlement surged.

        Body 1 (transportation): the Erie Canal (1825) cut freight costs about 90% and reoriented western trade east; steamboats made rivers two-way; Gibbons v. Ogden (1824) opened them to competition; railroads and the telegraph (1844) followed.

        Body 2 (production and work): Slater's mill and the Lowell system made textiles in factories; interchangeable parts; artisans became wage earners; middle-class clerks and managers grew; Irish and German immigrants filled the labour market.

        Body 3 (agriculture and region): Deere's plough and McCormick's reaper made the Midwest a grain exporter; cotton, made profitable by the gin, linked the South to northern and British mills but deepened its reliance on slavery.

        Complexity: most Americans still farmed in 1848, and the Panics of 1819 and 1837 showed that interdependence brought vulnerability, so change was profound but not complete.
      explanation: |
        Thesis/claim (1 point): a defensible claim about the extent of economic change, with a line of reasoning (e.g. transformed the North and West but entrenched slavery in the South). Zero for restating the prompt.

        Contextualization (1 point): describes the broader situation, e.g. the post-1815 nationalism and American System, the earlier household and local economy of the 1790s, Britain's industrial lead, or westward migration after the War of 1812.

        Evidence (2 points): 1 point for two specific examples (Erie Canal, National Road, steamboats, Gibbons v. Ogden, McCulloch, Lowell system, Slater, interchangeable parts, telegraph 1844, steel plough, reaper, cotton gin, Second Bank, Panic of 1837, Irish and German immigration). 2 points when they are used to support the argument about the extent of change.

        Analysis and reasoning (2 points): 1 point for using continuity and change (or causation) to structure the argument. 1 point for complex understanding, e.g. distinguishing regional patterns, weighing what changed against what persisted (farming majority, slavery), or explaining both benefits and costs.

        Zero overall for a list of inventions with no argument about extent.
