  - slug: apush-u04-exam-q42
    type: short_answer
    topic_code: "4.7"
    source: "Secondary interpretations written for this course"
    points: 3
    stimulus: |
      Interpretation A (written for this course): "The Jacksonian era was the age of the common man. By 1840 nearly every adult white man could vote, parties organised ordinary voters as never before, and politicians from Jackson down claimed to speak for farmers and workers against privilege."

      Interpretation B (written for this course): "Jacksonian democracy was a white man's democracy. The same years that opened the vote to poor white men closed it to Black men in several states, kept it from women everywhere, and drove Native nations from their lands. Democracy expanded by drawing new lines of exclusion."
    prompt: |
      Using the interpretations, answer (a), (b) and (c).

      (a) Briefly describe ONE major difference between Interpretation A and Interpretation B.
      (b) Briefly explain how ONE specific historical development from 1820 to 1848 not mentioned in the excerpts could support Interpretation A.
      (c) Briefly explain how ONE specific historical development from 1820 to 1848 not mentioned in the excerpts could support Interpretation B.
    answer: |
      (a) Interpretation A argues that the era broadened democracy for ordinary people, while Interpretation B argues that democracy expanded only for white men and depended on excluding others.
      (b) The spread of national nominating conventions from 1831–1832 and the log-cabin campaign of 1840, which drew about four in five eligible voters to the polls, show ordinary men taking part in politics as never before.
      (c) Pennsylvania's constitution of 1838 limited voting to white men, and New York's 1821 constitution kept a $250 property requirement only for Black men; the Trail of Tears (1838–1839) shows Native nations excluded from the democratic nation altogether.
    explanation: |
      One point per part.
      (a) Earns the point for a specific difference: broad expansion for common people versus expansion defined by racial and gender exclusion. Zero for summarising one interpretation only.
      (b) Earns the point for a specific development explained as support for A: nominating conventions, popular selection of electors, rising turnout (1828, 1840), the spoils system as rotation in office, the Bank Veto's appeal to farmers and labourers, the elimination of property qualifications in a named state. Zero for developments mentioned in the excerpts without new detail.
      (c) Earns the point for a specific development explained as support for B: disfranchisement of Black men (Pennsylvania 1838, New Jersey 1807 as background), New York's 1821 property test for Black men, Indian Removal Act and Trail of Tears, the gag rule, Seneca Falls's demand for the vote. Zero for vague claims of inequality.
      Skill: comparing historical interpretations.

  - slug: apush-u04-exam-q43
    type: short_answer
    topic_code: "4.8"
    source: "Primary source: Andrew Jackson, Second Annual Message (1830), National Archives Milestone Documents"
    points: 3
    stimulus: |
      "What good man would prefer a country covered with forests and ranged by a few thousand savages to our extensive Republic, studded with cities, towns, and prosperous farms embellished with all the improvements which art can devise or industry execute, occupied by more than 12,000,000 happy people, and filled with all the blessings of liberty, civilization and religion?"

      — President Andrew Jackson, annual message to Congress, December 6, 1830
    prompt: |
      Using the excerpt, answer (a), (b) and (c).

      (a) Briefly describe Jackson's point of view about American Indians as expressed in the excerpt.
      (b) Briefly explain ONE way the historical situation of 1830 shaped Jackson's message.
      (c) Briefly explain ONE response by American Indians to the policy Jackson supported.
    answer: |
      (a) Jackson presents American Indians as "savages" whose use of the land was inferior to white settlement, and treats their removal as progress that brings civilisation and prosperity.
      (b) Congress had just passed the Indian Removal Act (May 1830) after a close fight, and Georgia was extending its laws over Cherokee land where gold had been found in 1829; Jackson was justifying the policy to Congress and the public, including northern evangelical critics.
      (c) The Cherokee resisted through the courts and petitions, winning Worcester v. Georgia (1832), though removal still came in 1838; the Seminoles resisted by war from 1835 to 1842.
    explanation: |
      One point per part.
      (a) Earns the point for describing Jackson's view that Native peoples were uncivilised and that white settlement was superior, making removal justified. Zero for quoting the excerpt without explanation.
      (b) Earns the point for explaining the situation: the Indian Removal Act (1830), Georgia's actions and the gold rush, pressure from settlers and cotton expansion, or opposition from northern reformers and National Republicans. Zero for situations after 1840.
      (c) Earns the point for a specific response explained: Cherokee lawsuits (Cherokee Nation v. Georgia, Worcester v. Georgia), petitions and memorials to Congress, the Cherokee constitution, John Ross's leadership, the Treaty Party's signing of New Echota, the Second Seminole War, the Black Hawk War (1832). Zero for "they were sad" or "they moved."
      Skill: sourcing (point of view, situation).

  - slug: apush-u04-exam-q44
    type: short_answer
    topic_code: "4.14"
    source: "general knowledge"
    points: 3
    stimulus: |
      Chart (described): a timeline of Period 4 with three parallel rows. The top row, "Economy," marks the cotton gin's spread, the Erie Canal (1825), the Lowell mills, the Panic of 1837 and the telegraph (1844). The middle row, "Politics," marks the Missouri Compromise (1820), the "corrupt bargain" (1824), the Bank Veto (1832), the nullification crisis (1832–1833) and the gag rule (1836–1844). The bottom row, "Society and culture," marks the Second Great Awakening's revivals, the American Temperance Society (1826), The Liberator (1831), Nat Turner's rebellion (1831) and the Seneca Falls Convention (1848).
    prompt: |
      Using the chart, answer (a), (b) and (c).

      (a) Briefly describe ONE way a development in the "Economy" row caused a development in the "Society and culture" row.
      (b) Briefly explain ONE way a development in the "Society and culture" row affected a development in the "Politics" row.
      (c) Briefly explain which ONE development on the chart did the most to increase sectional tension by 1848, and why.
    answer: |
      (a) The market revolution, symbolised by the Erie Canal and the Lowell mills, created a middle class and unsettled communities along the canal corridor, which became the burned-over district of revivals and reform such as temperance and women's rights.
      (b) Abolitionism after The Liberator (1831) flooded Congress with antislavery petitions, and southern representatives responded by imposing the gag rule in 1836, turning free speech into a sectional issue.
      (c) The spread of cotton cultivation did the most, because it made slavery more profitable and expansive, which drove southern defences of slavery, the Missouri crisis and the later fights over new territory.
    explanation: |
      One point per part.
      (a) Earns the point for a causal link from an economic development to a social or cultural one (canal and market change to revivalism; factories to separate spheres and women's reform; cotton expansion to slavery's growth and resistance). Zero for describing two developments without connecting them.
      (b) Earns the point for a causal link from a social development to a political one (abolition to the gag rule; Nat Turner to Virginia's emancipation debate or stricter laws; evangelical reform to the Whig Party). Zero for a link in the wrong direction without explanation.
      (c) Earns the point for a defensible choice with a reason tied to sectional conflict (the cotton gin, Missouri Compromise, nullification, The Liberator, the gag rule). Zero for a choice without explanation.
      Skill: causation (4.14); making connections across themes.

