    stimulus: |
      Document 1
      Source: Summary (written for this course) of the suffrage article of the New York State Constitution of 1821.
      The constitution removed the property requirement that had limited voting for governor and state senators. White male citizens aged 21 or over who had lived in the state for a year could vote if they paid a state or county tax, served in the militia or worked on the public highways (an 1826 amendment removed even these conditions). A man of colour, however, could vote only if he had been a citizen of the state for three years and owned a freehold estate worth $250 on which he paid taxes.

      Document 2
      Source: Alexis de Tocqueville, a French aristocrat who toured the United States in 1831–1832, Democracy in America, volume 1 (1835), translated by Henry Reeve.
      "Amongst the novel objects that attracted my attention during my stay in the United States, nothing struck me more forcibly than the general equality of conditions. I readily discovered the prodigious influence which this primary fact exercises on the whole course of society, by giving a certain direction to public opinion, and a certain tenor to the laws; by imparting new maxims to the governing powers, and peculiar habits to the governed."

      Document 3
      Source: President Andrew Jackson, message vetoing the recharter of the Second Bank of the United States, July 10, 1832.
      "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. ... when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society—the farmers, mechanics, and laborers—who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."
    prompt: |
      Document 4
      Source: President Andrew Jackson, annual message to Congress, December 6, 1830.
      "It will separate the Indians from immediate contact with settlements of whites; free them from the power of the States; enable them to pursue happiness in their own way and under their own rude institutions; will retard the progress of decay, which is lessening their numbers, and perhaps cause them gradually, under the protection of the Government, and through the influence of good counsels, to cast off their savage habits and become an interesting, civilized, and Christian community."

      Document 5
      Source: Chief Justice John Marshall, opinion of the Court, Worcester v. Georgia, 1832.
      "The Cherokee nation, then, is a distinct community, occupying its own territory, with boundaries accurately described, in which the laws of Georgia can have no force, and which the citizens of Georgia have no right to enter but with the assent of the Cherokees themselves, or in conformity with treaties and with the acts of Congress."

      Document 6
      Source: Declaration of Sentiments, Women's Rights Convention, Seneca Falls, New York, July 1848.
      "We hold these truths to be self-evident; that all men and women are created equal; that they are endowed by their Creator with certain inalienable rights ... He has never permitted her to exercise her inalienable right to the elective franchise."

      Document-based question. Using the documents above and your knowledge of United States history, evaluate the extent to which American democracy expanded from 1820 to 1848.

      In your response you should: respond to the prompt with a historically defensible thesis that establishes a line of reasoning; describe a broader historical context relevant to the prompt; support an argument using at least four documents; use at least one additional piece of specific historical evidence beyond the documents; explain how or why each of at least two documents' point of view, purpose, historical situation and/or audience is relevant to the argument; and use evidence to corroborate, qualify or modify the argument.
    answer: |
      Thesis: From 1820 to 1848 democracy expanded dramatically for white men, who gained the vote and a mass party politics that claimed to speak for them, but this expansion was limited and in some ways purchased by excluding others: free Black men lost ground, women remained voteless, and Native nations were removed from the polity altogether. Democracy therefore expanded to a large extent in participation, but only to a limited extent in who counted as a member of the people.

      Context: in the early republic, property qualifications, deference to elites and the congressional caucus had limited participation; the market revolution and western settlement created a new electorate demanding a voice.

      Body 1 (expansion for white men): Doc 1 (New York drops property tests for white men), Doc 2 (Tocqueville's equality of conditions), Doc 3 (Jackson speaks for farmers, mechanics and labourers). Outside evidence: turnout near 80% in 1840; national nominating conventions.

      Body 2 (racial exclusion): Doc 1 (the $250 test for Black men only), Doc 4 (removal justified as benevolence), Doc 5 (the Court recognised Cherokee sovereignty but Jackson did not enforce it). Outside evidence: Pennsylvania's 1838 constitution; Trail of Tears.

      Body 3 (women's challenge): Doc 6 shows women claiming the founding language and the vote, revealing how limited democracy remained by 1848.

      Sourcing: Doc 2, a French aristocrat comparing America to Europe, explains his stress on equality; Doc 3 was written for voters in an election year; Doc 4 justifies a disputed policy to Congress.

      Complexity: the same democratic ideology that empowered white men gave women and abolitionists the language to demand inclusion.
    explanation: |
      Thesis/claim (1 point): a historically defensible thesis that establishes a line of reasoning about the extent of democratic expansion (e.g. expanded greatly for white men but narrowed or stayed closed for others). Must be in the introduction or conclusion. Zero for "democracy expanded and did not expand."

      Contextualization (1 point): describes the broader context before or during 1820–1848, e.g. property qualifications and deference politics of the early republic, the first party system and the election of 1800, the market revolution creating wage earners, western states entering with broad suffrage, or the Second Great Awakening's democratic religion. Must be more than a phrase.

      Evidence from the documents (up to 3 points across the evidence category):
      - 1 point for accurately describing the content of at least three documents (e.g. Doc 1 removes property tests for white men but keeps one for Black men; Doc 2 claims equality of conditions; Doc 3 attacks privilege for farmers and labourers; Doc 4 justifies removal as civilising; Doc 5 recognises Cherokee sovereignty; Doc 6 demands women's suffrage).
      - OR 2 points for using at least four documents to support an argument about the extent of expansion.

      Evidence beyond the documents (1 point): one specific piece of relevant evidence not in the documents, e.g. 1840 turnout of about 80%, national nominating conventions (1831–1832), popular choice of presidential electors, the spoils system, the Pennsylvania Constitution of 1838, New Jersey's 1807 disfranchisement, the Trail of Tears (1838–1839), the Indian Removal Act (1830), the gag rule, the Dorr Rebellion (1842) in Rhode Island over suffrage, the Whig log-cabin campaign, or the Liberty Party. Must differ from the evidence used to earn contextualization.

      Analysis and reasoning (2 points):
      - 1 point for explaining how or why the point of view, purpose, historical situation and/or audience of at least two documents is relevant to the argument. Examples: Doc 2's author was an aristocrat writing for French readers, which explains his focus on equality compared with Europe; Doc 3 was written in an election year for a mass electorate, explaining its populist framing; Doc 4's purpose was to justify a contested policy to Congress and critics; Doc 5 came from a Federalist chief justice whose ruling the executive declined to enforce; Doc 6's authors, abolitionist women, used the Declaration of Independence to make a radical demand sound patriotic.
      - 1 point for demonstrating a complex understanding, e.g. explaining that expansion for white men and exclusion of others were linked (whiteness as the basis of citizenship), corroborating and qualifying across documents, considering multiple variables (class, race, gender, region), or explaining how democratic ideals gave excluded groups the language of protest.

      Scoring note: a response that only summarises documents in order without an argument can earn at most the descriptive document point.
