unit: 4
description: |
  45 questions · about 80 minutes · every topic of Period 4 (4.1 to 4.14) with about a fifth of the items reviewing
  Periods 1–3. Six source-based multiple-choice sets in the style of the AP exam, single multiple-choice items,
  select-all, true/false and fill-in-the-blank items, three short-answer questions (SAQs) and a document-based
  question (DBQ, 7 points) on the expansion of democracy. Multiple choice, select-all and true/false items are graded
  at once; fill-in-the-blank items are matched automatically; the free-response items are graded by your teacher
  against the scoring notes.
questions:
  # ---- Set 1: the Missouri Compromise (4.3, review 3.7)
  - slug: apush-u04-exam-q01
    type: multiple_choice
    topic_code: "4.3"
    source: "Primary source: Missouri Compromise, Act of March 6, 1820, section 8, National Archives Milestone Documents"
    points: 1
    stimulus: |
      "... in all that territory ceded by France to the United States, under the name of Louisiana, which lies north of thirty-six degrees and thirty minutes north latitude, not included within the limits of the state, contemplated by this act, slavery and involuntary servitude, otherwise than in the punishment of crimes, whereof the parties shall have been duly convicted, shall be, and is hereby, forever prohibited ..."

      — Act to authorize the people of Missouri to form a state government, March 6, 1820, section 8
    prompt: |
      The provision in the excerpt was part of a settlement that also
    options:
      - "created a stronger fugitive slave law"
      - "allowed the residents of each territory to vote on slavery"
      - "abolished slavery in the District of Columbia"
      - "admitted Maine as a free state to preserve the balance of free and slave states in the Senate"
    option_explanations:
      - |
        A stronger fugitive slave law was part of the Compromise of 1850, not 1820.
      - |
        Letting territories decide is popular sovereignty, adopted in 1850 and 1854; the 1820 act drew a congressional line instead.
      - |
        Slavery in the District was abolished in 1862; the 1850 Compromise ended only the slave trade there.
      - |
        Correct. Missouri entered as a slave state and Maine, separated from Massachusetts, as a free state, keeping twelve of each.
    answer: 3
    explanation: |
      Topic 4.3. Know the three terms of the 1820 compromise and how they differ from 1850 and 1854.

  - slug: apush-u04-exam-q02
    type: multiple_choice
    topic_code: "3.7"
    source: "National Archives, Milestone Documents: Northwest Ordinance (1787) and Missouri Compromise (1820)"
    points: 1
    stimulus: |
      "... in all that territory ceded by France to the United States, under the name of Louisiana, which lies north of thirty-six degrees and thirty minutes north latitude, not included within the limits of the state, contemplated by this act, slavery and involuntary servitude, otherwise than in the punishment of crimes, whereof the parties shall have been duly convicted, shall be, and is hereby, forever prohibited ..."

      — Act to authorize the people of Missouri to form a state government, March 6, 1820, section 8
    prompt: |
      Review. The language of the excerpt most closely echoes which earlier federal measure?
    options:
      - "The Three-Fifths Clause of the Constitution"
      - "The Land Ordinance of 1785"
      - "The Northwest Ordinance of 1787, which barred slavery in the territory north of the Ohio River"
      - "The Proclamation of 1763"
    option_explanations:
      - |
        The Three-Fifths Clause counted enslaved people for representation; it did not prohibit slavery anywhere.
      - |
        The Land Ordinance set up the survey of western land into townships; it did not address slavery.
      - |
        Correct. The Ordinance's article on slavery used nearly the same formula, prohibiting slavery and involuntary servitude except as punishment for crime; the Thirteenth Amendment would use it again in 1865.
      - |
        The Proclamation of 1763 restricted colonial settlement west of the Appalachians; it said nothing about slavery.
    answer: 2
    explanation: |
      Continuity (Topic 3.7 review). The same formula runs 1787 → 1820 → 1865.

  - slug: apush-u04-exam-q03
    type: multiple_choice
    topic_code: "4.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      "... in all that territory ceded by France to the United States, under the name of Louisiana, which lies north of thirty-six degrees and thirty minutes north latitude, not included within the limits of the state, contemplated by this act, slavery and involuntary servitude, otherwise than in the punishment of crimes, whereof the parties shall have been duly convicted, shall be, and is hereby, forever prohibited ..."

      — Act to authorize the people of Missouri to form a state government, March 6, 1820, section 8
    prompt: |
      The settlement of which the excerpt was part most directly reflected
    options:
      - "growing sectional tension over whether slavery would expand into western territories"
      - "the Federalist Party's control of Congress"
      - "a national consensus that slavery should end everywhere"
      - "the declining importance of the Senate in national politics"
    option_explanations:
      - |
        Correct. The Tallmadge Amendment split the House along sectional lines, and the compromise managed rather than resolved the conflict over slavery's expansion.
      - |
        The Federalists had collapsed; Republicans controlled Congress during the Era of Good Feelings.
      - |
        There was no such consensus; the compromise expanded slavery to Missouri while limiting it elsewhere.
      - |
        The crisis showed the Senate's importance: equal representation of states made the free–slave balance there decisive.
    answer: 0
    explanation: |
      Causation (4.3). The Missouri crisis revealed sectional fault lines beneath one-party rule.

  # ---- Set 2: the Monroe Doctrine (4.4, review 3.10)
  - slug: apush-u04-exam-q04
    type: multiple_choice
    topic_code: "4.4"
    source: "Primary source: James Monroe, Seventh Annual Message (1823), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "In the wars of the European powers in matters relating to themselves we have never taken any part, nor does it comport with our policy to do so. ... We owe it, therefore, to candor and to the amicable relations existing between the United States and those powers to declare that we should consider any attempt on their part to extend their system to any portion of this hemisphere as dangerous to our peace and safety."

      — President James Monroe, annual message to Congress, December 2, 1823
    prompt: |
      The "system" that Monroe warned European powers not to extend was most likely
    options:
      - "the Roman Catholic Church's missions in California"
      - "the monarchical political order defended by Europe's Holy Alliance, which might help Spain recover its former colonies"
      - "the Atlantic slave trade"
      - "the factory system of British textile manufacturing"
    option_explanations:
      - |
        California missions belonged to Mexico; the message addresses European governments, not churches.
      - |
        Correct. The Holy Alliance of Russia, Prussia and Austria, with restored France, had crushed revolutions in Europe; Americans feared it would turn to Latin America.
      - |
        The slave trade is not the subject of the message; the U.S. itself remained a slave society.
      - |
        The doctrine concerned colonization and political intervention, not industrial methods; Britain was in fact an informal partner.
    answer: 1
    explanation: |
      Contextualization (4.4). Read "system" in the light of European politics after 1815.

  - slug: apush-u04-exam-q05
    type: multiple_choice
    topic_code: "4.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      "In the wars of the European powers in matters relating to themselves we have never taken any part, nor does it comport with our policy to do so. ... We owe it, therefore, to candor and to the amicable relations existing between the United States and those powers to declare that we should consider any attempt on their part to extend their system to any portion of this hemisphere as dangerous to our peace and safety."

      — President James Monroe, annual message to Congress, December 2, 1823
    prompt: |
      The message best illustrates which broader goal of U.S. foreign policy from 1800 to 1848?
    options:
      - "Forming permanent military alliances with European powers"
      - "Building an overseas empire in Asia and Africa"
      - "Returning territory gained in the Louisiana Purchase to Spain"
      - "Securing dominance over the North American continent and limiting European influence in the Western Hemisphere"
    option_explanations:
      - |
        The message reaffirms the policy of avoiding European alliances.
      - |
        Overseas empire was a goal of the 1890s, not of this period.
      - |
        The U.S. expanded during this period; it returned no territory to Spain.
      - |
        Correct. The Louisiana Purchase, the War of 1812, the Adams–Onís Treaty and the Monroe Doctrine all aimed at continental security and expansion.
    answer: 3
    explanation: |
      Making connections (4.4). Tie a single document to the period's overall pattern.

  - slug: apush-u04-exam-q06
    type: multiple_choice
    topic_code: "3.10"
    source: "general knowledge"
    points: 1
    stimulus: |
      "In the wars of the European powers in matters relating to themselves we have never taken any part, nor does it comport with our policy to do so. ... We owe it, therefore, to candor and to the amicable relations existing between the United States and those powers to declare that we should consider any attempt on their part to extend their system to any portion of this hemisphere as dangerous to our peace and safety."

      — President James Monroe, annual message to Congress, December 2, 1823
    prompt: |
      Review. Monroe's claim that the United States had "never taken any part" in Europe's wars rested most directly on which earlier policy?
    options:
      - "The French alliance of 1778"
      - "The Articles of Confederation's provision for a national army"
      - "The Treaty of Paris of 1763"
      - "Washington's Proclamation of Neutrality (1793) during the war between Britain and revolutionary France"
    option_explanations:
      - |
        The 1778 alliance was a wartime necessity of the Revolution, the kind of entanglement Monroe's statement glosses over.
      - |
        The Articles created no standing national army; this is not a foreign-policy statement.
      - |
        The 1763 treaty ended a war in which the colonies fought as part of the British Empire.
      - |
        Correct. Washington declared neutrality rather than honour the French alliance in the war of 1793, and his Farewell Address warned against entangling alliances.
    answer: 3
    explanation: |
      Continuity (Topic 3.10 review). Neutrality toward Europe was a policy inherited from Washington.

  # ---- Set 3: Jackson's Bank Veto (4.8, 4.7, 4.3, 4.5)
  - slug: apush-u04-exam-q07
    type: multiple_choice
    topic_code: "4.8"
    source: "Primary source: Andrew Jackson, Veto Message on the Bank of the United States (1832), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. ... but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society—the farmers, mechanics, and laborers—who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

      — President Andrew Jackson, message vetoing the recharter of the Second Bank of the United States, July 10, 1832
    prompt: |
      Which action by Jackson most directly followed from the views expressed in the excerpt?
    options:
      - "Removing federal deposits from the Second Bank and placing them in state banks"
      - "Enforcing the Supreme Court's ruling in Worcester v. Georgia"
      - "Signing the Tariff of 1828"
      - "Proposing a constitutional amendment to create a national bank"
    option_explanations:
      - |
        Correct. After his re-election in 1832, Jackson removed federal funds from the bank (1833), ensuring its death when its charter expired in 1836.
      - |
        Jackson did not enforce Worcester; it is unrelated to banking.
      - |
        The Tariff of 1828 was signed by John Quincy Adams before Jackson took office.
      - |
        Jackson opposed the national bank; he proposed no amendment to create one.
    answer: 0
    explanation: |
      Causation (4.8). The veto led to the removal of deposits and the bank's end.

  - slug: apush-u04-exam-q08
    type: multiple_choice
    topic_code: "4.7"
    source: "Primary source: Andrew Jackson, Veto Message (1832), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. ... but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society—the farmers, mechanics, and laborers—who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

      — President Andrew Jackson, message vetoing the recharter of the Second Bank of the United States, July 10, 1832
    prompt: |
      The groups named in the excerpt were most important to Jackson's politics because they
    options:
      - "made up much of the newly enlarged electorate that the Democratic Party mobilised after property qualifications for white men were dropped"
      - "were the main shareholders of the Second Bank"
      - "had been excluded from voting by the Jacksonians"
      - "formed the base of the Whig Party"
    option_explanations:
      - |
        Correct. Farmers, artisans and labourers, newly enfranchised, formed the core of the Democratic coalition that Jackson and Van Buren built.
      - |
        Bank shareholders were largely wealthy easterners and foreigners, whom Jackson criticised.
      - |
        Jacksonian democracy expanded voting for white men, including these groups.
      - |
        The Whigs drew more on merchants, manufacturers and commercial farmers, though they too courted workers by 1840.
    answer: 0
    explanation: |
      Topic 4.7. Expanded suffrage changed who politicians spoke to and how.

  - slug: apush-u04-exam-q09
    type: multiple_choice
    topic_code: "4.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. ... but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society—the farmers, mechanics, and laborers—who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

      — President Andrew Jackson, message vetoing the recharter of the Second Bank of the United States, July 10, 1832
    prompt: |
      The institution Jackson attacked had been created in 1816 as part of
    options:
      - "a postwar nationalist economic program later called the American System"
      - "the Missouri Compromise"
      - "Jefferson's plan to pay for the Louisiana Purchase"
      - "the Federalists' response to the Whiskey Rebellion"
    option_explanations:
      - |
        Correct. After the war exposed the costs of having no national bank, Madison signed the Second Bank's charter alongside the Tariff of 1816, a program Clay called the American System.
      - |
        The Missouri Compromise concerned slavery, not banking.
      - |
        The Louisiana Purchase (1803) was financed by bonds; the first bank still existed then.
      - |
        The Whiskey Rebellion (1794) concerned the excise tax; the first bank had been created in 1791.
    answer: 0
    explanation: |
      Topic 4.3. Place the bank in the history of regional and partisan economic debate.

  - slug: apush-u04-exam-q10
    type: multiple_choice
    topic_code: "4.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. ... but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society—the farmers, mechanics, and laborers—who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

      — President Andrew Jackson, message vetoing the recharter of the Second Bank of the United States, July 10, 1832
    prompt: |
      Which economic development followed the destruction of the Second Bank?
    options:
      - "The creation of the Federal Reserve System"
      - "The immediate end of the market revolution"
      - "Speculative lending by state banks, followed by the Panic of 1837 and a depression"
      - "A long period of stable prices and full employment"
    option_explanations:
      - |
        The Federal Reserve was created in 1913.
      - |
        Canals, railroads and factories kept growing after the depression; the market revolution continued.
      - |
        Correct. Without the bank's restraint, state banks issued paper money freely; the Specie Circular (1836), falling cotton prices and British credit tightening produced the Panic of 1837.
      - |
        The late 1830s and early 1840s brought depression, not stability.
    answer: 2
    explanation: |
      Causation (4.5/4.8). Connect politics to the economy.

  # ---- Set 4: Tocqueville (4.7, 4.6, 4.12)
  - slug: apush-u04-exam-q11
    type: multiple_choice
    topic_code: "4.7"
    source: "Primary source: Alexis de Tocqueville, Democracy in America, vol. 1 (1835), trans. Henry Reeve, Project Gutenberg"
    points: 1
    stimulus: |
      "Amongst the novel objects that attracted my attention during my stay in the United States, nothing struck me more forcibly than the general equality of conditions. I readily discovered the prodigious influence which this primary fact exercises on the whole course of society, by giving a certain direction to public opinion, and a certain tenor to the laws; by imparting new maxims to the governing powers, and peculiar habits to the governed."

      — Alexis de Tocqueville, Democracy in America, volume 1 (1835), translated by Henry Reeve
    prompt: |
      The "equality of conditions" Tocqueville observed was most clearly reflected in politics by
    options:
      - "the election of senators by popular vote"
      - "the rise of mass political parties appealing to a broad electorate of white men"
      - "the abolition of the Electoral College"
      - "the extension of the vote to women in several states"
    option_explanations:
      - |
        Senators were chosen by state legislatures until 1913.
      - |
        Correct. The Democrats and later the Whigs organised conventions, rallies and newspapers for a mass electorate; turnout reached about 80% in 1840.
      - |
        The Electoral College remained, though electors were now chosen by popular vote.
      - |
        No state let women vote in this period; New Jersey had ended it in 1807.
    answer: 1
    explanation: |
      Topic 4.7. Connect a social observation to political change.

  - slug: apush-u04-exam-q12
    type: multiple_choice
    topic_code: "4.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      "Amongst the novel objects that attracted my attention during my stay in the United States, nothing struck me more forcibly than the general equality of conditions. I readily discovered the prodigious influence which this primary fact exercises on the whole course of society, by giving a certain direction to public opinion, and a certain tenor to the laws; by imparting new maxims to the governing powers, and peculiar habits to the governed."

      — Alexis de Tocqueville, Democracy in America, volume 1 (1835), translated by Henry Reeve
    prompt: |
      Which development of the 1830s and 1840s most challenges Tocqueville's description of northern society?
    options:
      - "The popularity of self-made-man ideals"
      - "The spread of public common schools"
      - "The growth of a permanent wage-earning class in factory towns and cities alongside concentrated mercantile and industrial wealth"
      - "The expansion of white male suffrage"
    option_explanations:
      - |
        The self-made-man ideal reflects belief in equality of opportunity, even if reality fell short.
      - |
        Common schools were meant to promote equality of opportunity, supporting rather than challenging him.
      - |
        Correct. The market revolution widened gaps of wealth; Lowell strikes and urban poverty show conditions far from equal.
      - |
        Wider suffrage is what Tocqueville was describing.
    answer: 2
    explanation: |
      Topic 4.6. Distinguish political equality from economic inequality.

  - slug: apush-u04-exam-q13
    type: multiple_choice
    topic_code: "4.12"
    source: "general knowledge"
    points: 1
    stimulus: |
      "Amongst the novel objects that attracted my attention during my stay in the United States, nothing struck me more forcibly than the general equality of conditions. I readily discovered the prodigious influence which this primary fact exercises on the whole course of society, by giving a certain direction to public opinion, and a certain tenor to the laws; by imparting new maxims to the governing powers, and peculiar habits to the governed."

      — Alexis de Tocqueville, Democracy in America, volume 1 (1835), translated by Henry Reeve
    prompt: |
      Which development in the North most clearly contradicts the claim of general equality as it applied to free African Americans?
    options:
      - "Northern states abolished all property requirements for Black voters."
      - "Northern states such as Pennsylvania (1838) restricted voting to white men, and free Black northerners faced segregation and mob violence."
      - "Free Black northerners were granted equal access to all public schools."
      - "Congress guaranteed free Black men the right to vote in all federal elections."
    option_explanations:
      - |
        New York kept a property test for Black men only; most states excluded Black men entirely.
      - |
        Correct. As white men gained the vote, many states took it from Black men or set special barriers, such as New York's $250 property requirement (1821); riots against Black communities struck Philadelphia and other cities.
      - |
        Schools were often segregated or closed to Black children; Boston's segregated schools were challenged in the 1840s.
      - |
        No such federal guarantee existed until the Fifteenth Amendment (1870).
    answer: 1
    explanation: |
      Topic 4.12. Free Black Americans' experience is the key qualification to "the age of the common man."

  # ---- Set 5: Frederick Douglass (4.12, 4.11, 4.13)
  - slug: apush-u04-exam-q14
    type: multiple_choice
    topic_code: "4.12"
    source: "Primary source: Frederick Douglass, Narrative of the Life of Frederick Douglass (1845), Project Gutenberg"
    points: 1
    stimulus: |
      "I now understood what had been to me a most perplexing difficulty—to wit, the white man's power to enslave the black man. It was a grand achievement, and I prized it highly. From that moment, I understood the pathway from slavery to freedom."

      — Frederick Douglass, Narrative of the Life of Frederick Douglass, an American Slave (1845)
    prompt: |
      Douglass's experience as described in the excerpt is best understood as an example of
    options:
      - "the decline of slavery in Maryland because of industrialisation"
      - "the success of the American Colonization Society"
      - "southern laws encouraging the education of enslaved people"
      - "enslaved people's efforts to gain literacy and knowledge as a form of resistance to slavery"
    option_explanations:
      - |
        Slavery in Maryland declined somewhat, but the excerpt is about knowledge and control, not economic change.
      - |
        Douglass opposed colonization; the excerpt does not concern it.
      - |
        Southern laws restricted the education of enslaved people.
      - |
        Correct. Douglass taught himself to read after his lessons were forbidden; literacy was resistance, which is why slave states restricted it.
    answer: 3
    explanation: |
      Topic 4.12. Resistance included cultural and intellectual acts.

  - slug: apush-u04-exam-q15
    type: multiple_choice
    topic_code: "4.11"
    source: "general knowledge"
    points: 1
    stimulus: |
      "I now understood what had been to me a most perplexing difficulty—to wit, the white man's power to enslave the black man. It was a grand achievement, and I prized it highly. From that moment, I understood the pathway from slavery to freedom."

      — Frederick Douglass, Narrative of the Life of Frederick Douglass, an American Slave (1845)
    prompt: |
      Abolitionists in the 1830s and 1840s used works such as Douglass's Narrative primarily to
    options:
      - "win the support of southern planters for compensated emancipation"
      - "persuade northern audiences through moral argument and personal testimony that slavery was a sin requiring immediate end"
      - "argue that free African Americans should be resettled in Africa"
      - "support the gag rule in Congress"
    option_explanations:
      - |
        Immediatists rejected compensation and had little support among planters.
      - |
        Correct. Garrisonian abolitionists relied on moral suasion: newspapers, lectures and slave narratives meant to change hearts in the North.
      - |
        Colonization was rejected by Douglass and most abolitionists after 1831.
      - |
        Abolitionists opposed the gag rule, which silenced their petitions.
    answer: 1
    explanation: |
      Topic 4.11. Know the strategies of the abolition movement.

  - slug: apush-u04-exam-q16
    type: multiple_choice
    topic_code: "4.13"
    source: "general knowledge"
    points: 1
    stimulus: |
      "I now understood what had been to me a most perplexing difficulty—to wit, the white man's power to enslave the black man. It was a grand achievement, and I prized it highly. From that moment, I understood the pathway from slavery to freedom."

      — Frederick Douglass, Narrative of the Life of Frederick Douglass, an American Slave (1845)
    prompt: |
      Southern responses to abolitionism and to revolts such as Nat Turner's in the 1830s included all of the following EXCEPT
    options:
      - "voluntary gradual emancipation laws in the cotton states"
      - "stricter laws against teaching enslaved people to read"
      - "censorship of abolitionist literature sent through the mail"
      - "defending slavery as a positive good"
    option_explanations:
      - |
        Correct. No cotton state adopted emancipation; Virginia debated it in 1831–1832 and rejected it.
      - |
        This was a real response: literacy restrictions tightened after Walker's Appeal and Turner's revolt.
      - |
        This was a real response: southern postmasters and mobs stopped abolitionist mailings in 1835.
      - |
        This was a real response: Calhoun and others declared slavery a positive good.
    answer: 0
    explanation: |
      Topic 4.13. The South hardened its defence of slavery after 1830.

  # ---- Set 6: interpretation on the market revolution and sectionalism (4.14, 4.5, 4.13)
  - slug: apush-u04-exam-q17
    type: multiple_choice
    topic_code: "4.14"
    source: "Secondary interpretation written for this course"
    points: 1
    stimulus: |
      Interpretation (written for this course): "The market revolution both united and divided the nation. Canals, steamboats and later railroads tied the farms of the Old Northwest to the cities of the Northeast, creating a free-labour economy of family farms, factories and wage work. The same market made cotton the South's fortune and the nation's leading export, and so bound the South ever more tightly to slavery. By 1848 the regions were more economically connected than ever, and more different."
    prompt: |
      Which of the following would best support the interpretation's claim that economic ties reoriented the Old Northwest toward the Northeast?
    options:
      - "The Louisiana Purchase gave western farmers control of New Orleans"
      - "The Erie Canal and later railroads diverted much western grain from the Mississippi–New Orleans route to New York"
      - "Steamboats carried western goods down the Mississippi to New Orleans"
      - "The Missouri Compromise banned slavery north of 36°30′"
    option_explanations:
      - |
        The purchase secured the southern route, which is the opposite of a reorientation toward the Northeast.
      - |
        Correct. East–west routes drew Great Lakes trade to New York, tying the Northwest's economy and politics to the Northeast.
      - |
        This describes the older north–south trade, not the new east–west ties.
      - |
        The compromise concerned slavery, not trade routes, though it reinforced free-labour development in the Northwest.
    answer: 1
    explanation: |
      Claims and evidence (4.14). Choose evidence that supports the specific claim.

  - slug: apush-u04-exam-q18
    type: multiple_choice
    topic_code: "4.5"
    source: "Secondary interpretation written for this course; general knowledge"
    points: 1
    stimulus: |
      Interpretation (written for this course): "The market revolution both united and divided the nation. Canals, steamboats and later railroads tied the farms of the Old Northwest to the cities of the Northeast, creating a free-labour economy of family farms, factories and wage work. The same market made cotton the South's fortune and the nation's leading export, and so bound the South ever more tightly to slavery. By 1848 the regions were more economically connected than ever, and more different."
    prompt: |
      Which technological development most directly made cotton "the South's fortune" as described in the interpretation?
    options:
      - "John Deere's steel plough (1837)"
      - "Samuel Morse's telegraph (1844)"
      - "Eli Whitney's cotton gin (1793), which made short-staple upland cotton profitable"
      - "Robert Fulton's steamboat (1807)"
    option_explanations:
      - |
        The steel plough opened Midwestern prairies to grain farming.
      - |
