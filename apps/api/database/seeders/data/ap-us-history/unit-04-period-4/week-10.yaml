week: 10
unit: 4
title: "Jefferson's Republic and the Rise of Parties"
topics: ["4.1", "4.2", "4.3"]
guide: guides/week-10.md
guide_description: |
  How Period 4 opens: the "Revolution of 1800", what Jefferson's Republicans changed and what they kept, the
  Marshall Court's decisions that made the federal judiciary an equal branch, the Louisiana Purchase and the
  strict-construction dilemma it posed, and the regional interests (tariffs, internal improvements, slavery) that
  collided in the Missouri Compromise. Worked examples: a contextualization paragraph for 1800, a Missouri
  Compromise SAQ answered part by part, and turning a Jeffersonian-continuity prompt into a thesis.
flashcards_description: |
  30 cards on the election of 1800, Jefferson's presidency, the Marshall Court, the Louisiana Purchase, Clay's
  American System and the Missouri Compromise.

flashcards:
  - front: Election of 1800 → why historians call it a "revolution"
    back: |
      Jefferson's Democratic-Republicans defeated John Adams's Federalists, and power passed peacefully from one party to its bitter rival for the first time. The tie between Jefferson and Aaron Burr went to the House, and the deadlock led to the Twelfth Amendment (1804).
    topic_code: "4.2"
  - front: Twelfth Amendment (1804) → what problem it fixed
    back: |
      Electors now cast separate ballots for president and vice president. Under the original Constitution Jefferson and his running mate Burr tied in 1800, throwing the election to the House for 36 ballots.
    topic_code: "4.2"
  - front: '"We are all Republicans, we are all Federalists" (1801) → speaker and purpose'
    back: |
      Thomas Jefferson in his First Inaugural Address. After a vicious campaign he asked both parties to treat their quarrel as a difference of opinion within shared republican principles, a bid to calm fears of revenge and keep the Union together.
    topic_code: "4.2"
  - front: Jefferson's "wise and frugal" government → three concrete policies
    back: |
      Repeal of the internal taxes including the whisky excise, deep cuts to the army and navy, and paying down the national debt (Albert Gallatin at the Treasury). He kept Hamilton's Bank of the United States, which showed the limits of the change.
    topic_code: "4.2"
  - front: Jeffersonian continuity → what Jefferson kept from the Federalists
    back: |
      The Bank of the United States (until its charter lapsed in 1811), the funded debt and the federal courts. Practical governing pulled the Republicans toward Federalist tools; Madison would sign a second bank in 1816.
    topic_code: "4.2"
  - front: Marbury v. Madison (1803) → holding and significance
    back: |
      Chief Justice John Marshall ruled that the section of the Judiciary Act of 1789 giving the Court power to issue Marbury's writ was unconstitutional. By striking down a federal law he established judicial review, making the Court an equal branch.
    hint: Gave up a small power to claim a big one.
    topic_code: "4.2"
  - front: John Marshall (Chief Justice 1801–1835) → his long-run pattern
    back: |
      A Federalist appointed by John Adams whose decisions consistently strengthened the federal government over the states, protected contracts and property, and promoted a national market: Marbury, Fletcher v. Peck, Dartmouth College, McCulloch, Gibbons.
    topic_code: "4.2"
  - front: Midnight judges → what they were and why they mattered
    back: |
      Federalist judges John Adams appointed under the Judiciary Act of 1801 in his last weeks in office. Republicans repealed the act in 1802, and William Marbury's undelivered commission produced Marbury v. Madison.
    topic_code: "4.2"
  - front: Louisiana Purchase (1803) → price, size, seller
    back: |
      The United States bought about 828,000 square miles from Napoleon's France for $15 million, roughly doubling the nation's size and securing the port of New Orleans and the Mississippi River for western farmers.
    topic_code: "4.2"
  - front: Louisiana Purchase → Jefferson's constitutional dilemma
    back: |
      A strict constructionist, Jefferson found no clause authorising the purchase of territory and considered an amendment, but he used the treaty power instead. Opportunity beat principle, the same broad reading he had attacked in Hamilton.
    topic_code: "4.2"
  - front: Why did Napoleon sell Louisiana in 1803?
    back: |
      His army failed to retake Saint-Domingue from the Haitian revolutionaries, ending his plan for a sugar empire fed by Louisiana, and he needed money for renewed war with Britain.
    topic_code: "4.2"
  - front: Lewis and Clark expedition (1804–1806) → purpose and results
    back: |
      Jefferson's Corps of Discovery mapped the Missouri and Columbia rivers to the Pacific, recorded plants, animals and peoples, and strengthened the U.S. claim to the Oregon Country. Sacagawea, a Shoshone woman, served as interpreter.
    topic_code: "4.2"
  - front: Federalist Party after 1800 → why it faded
    back: |
      Its base narrowed to New England merchants, it opposed popular expansion, and its opposition to the War of 1812 culminating in the Hartford Convention (1814–1815) looked disloyal. It ran its last presidential candidate in 1816.
    topic_code: "4.2"
  - front: Contextualizing Period 4 (1800–1848) → the three big shifts
    back: |
      Political: a democratic mass politics and a national two-party system. Economic: the market revolution linking regions by roads, canals, steamboats and factories. Social and sectional: reform movements and the hardening of slavery, which made sectional conflict sharper.
    topic_code: "4.1"
  - front: Which themes dominate Period 4?
    back: |
      PCE (parties, democracy, federal power), WXT (market revolution), MIG (westward and immigrant movement), SOC and ARC (reform, religion, American culture) and NAT (who counted as American). WOR appears in the War of 1812 and the Monroe Doctrine.
    topic_code: "4.1"
  - front: Henry Clay's American System → three parts
    back: |
      A protective tariff to shelter northern manufactures, a national bank to provide stable credit, and federally funded internal improvements (roads and canals) to tie the regions together. A nationalist program that later became the Whig platform.
    topic_code: "4.3"
  - front: Tariff of 1816 → purpose and regional reaction
    back: |
      The first deliberately protective tariff, passed after the War of 1812 when cheap British goods flooded in. Many southerners, including the young Calhoun, accepted it then; as cotton exporters paid the costs, the South turned against protection.
    topic_code: "4.3"
  - front: Second Bank of the United States (1816) → why the Republicans created it
    back: |
      The first bank's charter lapsed in 1811, and wartime finance without it was chaotic. Madison, once Hamilton's opponent on the bank, signed a twenty-year charter: a sign of how far the Republicans had moved toward nationalism.
    topic_code: "4.3"
  - front: Madison's Bonus Bill veto (1817) → significance
    back: |
      Madison vetoed federal funding for roads and canals, saying it needed a constitutional amendment. Internal improvements were left largely to states and private companies, which is why the Erie Canal was a New York project.
    topic_code: "4.3"
  - front: Era of Good Feelings → what it was and why the name misleads
    back: |
      James Monroe's presidency (1817–1825), when the Federalists had collapsed and one party ruled. Beneath the calm were the Panic of 1819, fights over the bank and tariff, and the Missouri crisis.
    topic_code: "4.3"
  - front: Panic of 1819 → cause and political effect
    back: |
      Land speculation, falling cotton prices and the Second Bank's tightening of credit produced foreclosures and unemployment. Debtors in the West and South blamed the bank, a resentment Andrew Jackson later harnessed.
    topic_code: "4.3"
  - front: Tallmadge Amendment (1819) → what it proposed
    back: |
      New York's James Tallmadge proposed admitting Missouri only if no more enslaved people were brought in and children born to enslaved parents were freed at 25. It passed the House on a sectional vote and failed in the Senate, starting the Missouri crisis.
    topic_code: "4.3"
  - front: Missouri Compromise (1820) → three terms
    back: |
      Missouri entered as a slave state, Maine as a free state (keeping Senate balance at 12–12), and slavery was "forever prohibited" in the rest of the Louisiana Purchase north of 36°30′.
    hint: Two states and a line.
    topic_code: "4.3"
  - front: Missouri crisis → cause → effect
    back: |
      Cause: Missouri's statehood threatened the Senate balance between free and slave states. Effect: a compromise line that held for a generation but made slavery's expansion the central sectional question, as Jefferson's "fire bell in the night" letter predicted.
    topic_code: "4.3"
  - front: '"A fire bell in the night" (1820) → who, about what'
    back: |
      Thomas Jefferson, in an April 1820 letter to John Holmes, on the Missouri question. He feared a geographical line dividing the nation on a moral question would never be erased.
    topic_code: "4.3"
  - front: Compare Federalists and Democratic-Republicans on the Constitution
    back: |
      Federalists read it loosely (implied powers, a strong central government, the bank); Republicans read it strictly (states' rights, limited federal power). In office after 1801 the Republicans often acted like loose constructionists.
    topic_code: "4.2"
  - front: Compare Federalists and Democratic-Republicans on foreign policy and economy
    back: |
      Federalists favoured Britain, commerce, manufacturing and a strong navy and finance; Republicans favoured France (at first), agriculture and the yeoman farmer. Regional bases: New England merchants versus southern and western farmers.
    topic_code: "4.2"
  - front: Northwest Ordinance (1787) → link to the Missouri Compromise
    back: |
      Congress under the Articles banned slavery north of the Ohio River; the 1820 line extended the same idea of dividing the West into free and slave zones. Both treated Congress as having power over slavery in territories.
    topic_code: "4.3"
  - front: Barbary War (1801–1805) → why it fits Jefferson's presidency
    back: |
      Jefferson sent the small navy against Tripoli rather than keep paying tribute to North African states for safe passage. Even a president who cut the military would use it to protect American commerce.
    topic_code: "4.2"
  - front: Which theme? Debates over the bank, tariff and internal improvements, 1816–1824
    back: |
      Politics and Power (PCE), tied to Work, Exchange and Technology (WXT): they were fights over how far federal power should go in shaping the economy and which region would bear the costs.
    topic_code: "4.3"

quiz:
  description: |
    25 questions · about 40 minutes · about 70% this week (the election of 1800, Jefferson's presidency, the
    Marshall Court, the Louisiana Purchase, the American System and the Missouri Compromise) and 30% review of
    Period 3 (the Constitution, the new republic and western movement). Multiple choice, select-all and true/false
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: Jefferson's First Inaugural (4.2, review 3.10)
    - slug: apush-u04-w10-q01
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Thomas Jefferson, First Inaugural Address (1801), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "But every difference of opinion is not a difference of principle. We have called by different names brethren of the same principle. We are all Republicans, we are all Federalists. If there be any among us who would wish to dissolve this Union or to change its republican form, let them stand undisturbed as monuments of the safety with which error of opinion may be tolerated where reason is left free to combat it. ... Still one thing more, fellow-citizens—a wise and frugal Government, which shall restrain men from injuring one another, shall leave them otherwise free to regulate their own pursuits of industry and improvement, and shall not take from the mouth of labor the bread it has earned."

        — Thomas Jefferson, First Inaugural Address, March 4, 1801
      prompt: |
        Jefferson's main purpose in the first part of the excerpt was most likely to
      options:
        - "reassure supporters of the defeated party that the new administration would not treat political opposition as treason"
        - "justify the repeal of the Bill of Rights' protections for speech critical of the government"
        - "announce that the Democratic-Republican and Federalist parties would merge into a single national party"
        - "warn foreign powers that the United States would go to war to defend republican government abroad"
      option_explanations:
        - |
          Correct. After the bitter election of 1800 and the Sedition Act prosecutions, Jefferson promised tolerance: even those who opposed the republic could be left "undisturbed" because free reason would answer them.
        - |
          The excerpt argues for tolerating opinion, which is the opposite of restricting speech. Republicans let the Sedition Act expire and Jefferson pardoned those convicted under it.
        - |
          Jefferson was naming shared principles, not proposing a merger. The two parties stayed separate, and the Federalists survived as an opposition until after 1815.
        - |
          Nothing in the excerpt addresses foreign powers; the audience is Americans divided by the election, and the subject is domestic unity.
      answer: 0
      explanation: |
        Sourcing (purpose). An inaugural address after a contested election speaks to the losing side. Read the purpose from the situation: a peaceful transfer of power between hostile parties.

    - slug: apush-u04-w10-q02
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Thomas Jefferson, First Inaugural Address (1801), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "But every difference of opinion is not a difference of principle. We have called by different names brethren of the same principle. We are all Republicans, we are all Federalists. If there be any among us who would wish to dissolve this Union or to change its republican form, let them stand undisturbed as monuments of the safety with which error of opinion may be tolerated where reason is left free to combat it. ... Still one thing more, fellow-citizens—a wise and frugal Government, which shall restrain men from injuring one another, shall leave them otherwise free to regulate their own pursuits of industry and improvement, and shall not take from the mouth of labor the bread it has earned."

        — Thomas Jefferson, First Inaugural Address, March 4, 1801
      prompt: |
        Which policy of Jefferson's first term most directly reflected the "wise and frugal Government" described in the excerpt?
      options:
        - "Passing the Embargo Act to stop all American exports"
        - "Chartering the Second Bank of the United States"
        - "Repealing internal taxes such as the whisky excise and cutting military spending to reduce the national debt"
        - "Raising tariffs to protect northern manufacturers"
      option_explanations:
        - |
          The Embargo (1807) came in Jefferson's second term and was the opposite of a light-handed government; it imposed heavy costs on merchants and farmers.
        - |
          The Second Bank was chartered in 1816 under Madison, and a national bank is the kind of active government Jefferson's frugality speech was steering away from.
        - |
          Correct. With Albert Gallatin at the Treasury, Jefferson ended internal taxes, shrank the army and navy and paid down the debt: government that would "not take from the mouth of labor the bread it has earned."
        - |
          Protective tariffs came after the War of 1812 (1816) and belonged to the nationalist American System, not to Jefferson's frugal first term.
      answer: 2
      explanation: |
        Claims and evidence. Match the principle in the text to a specific policy that put it into practice, and check the date of each option.

    - slug: apush-u04-w10-q03
      type: multiple_choice
      topic_code: "3.10"
      source: "Primary source: Thomas Jefferson, First Inaugural Address (1801), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "But every difference of opinion is not a difference of principle. We have called by different names brethren of the same principle. We are all Republicans, we are all Federalists. If there be any among us who would wish to dissolve this Union or to change its republican form, let them stand undisturbed as monuments of the safety with which error of opinion may be tolerated where reason is left free to combat it. ... Still one thing more, fellow-citizens—a wise and frugal Government, which shall restrain men from injuring one another, shall leave them otherwise free to regulate their own pursuits of industry and improvement, and shall not take from the mouth of labor the bread it has earned."

        — Thomas Jefferson, First Inaugural Address, March 4, 1801
      prompt: |
        Review. Jefferson's call to tolerate "error of opinion" was most directly a response to which development of the 1790s?
      options:
        - "Shays' Rebellion and the weakness of the Articles of Confederation"
        - "The Federalists' passage of the Alien and Sedition Acts and prosecutions of Republican editors"
        - "The XYZ Affair's insult to American diplomats"
        - "The Whiskey Rebellion's challenge to federal taxation"
      option_explanations:
        - |
          Shays' Rebellion (1786–1787) belongs to the Articles era and led to the Constitution, a decade before this address.
        - |
          Correct. The Sedition Act (1798) made it a crime to publish false or malicious criticism of the government, and Federalists used it against Republican printers. Jefferson's promise of tolerance answered it directly.
        - |
          The XYZ Affair (1797–1798) inflamed anti-French feeling and helped bring the Sedition Act, but the excerpt answers the repression of opinion, not the diplomatic insult itself.
        - |
          The Whiskey Rebellion (1794) was an armed tax revolt, not a dispute over opinion; Jefferson's language is about tolerating speech and political dissent.
      answer: 1
      explanation: |
        Contextualization. Place the excerpt in the partisan conflict of the late 1790s (Topic 3.10): the Quasi-War, the Alien and Sedition Acts and the Virginia and Kentucky Resolutions.

    # ---- Stimulus set: Marbury v. Madison (4.2, review 3.9)
    - slug: apush-u04-w10-q04
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Marbury v. Madison, 5 U.S. 137 (1803), Justia U.S. Supreme Court"
      points: 1
      stimulus: |
        "It is emphatically the province and duty of the Judicial Department to say what the law is. Those who apply the rule to particular cases must, of necessity, expound and interpret that rule. If two laws conflict with each other, the Courts must decide on the operation of each. ... Thus, the particular phraseology of the Constitution of the United States confirms and strengthens the principle, supposed to be essential to all written Constitutions, that a law repugnant to the Constitution is void, and that courts, as well as other departments, are bound by that instrument."

        — Chief Justice John Marshall, opinion of the Court, Marbury v. Madison, 1803
      prompt: |
        The principle asserted in the excerpt is best described as
      options:
        - "nullification, the right of a state to void a federal law within its borders"
        - "executive privilege, the president's right to withhold documents from the courts"
        - "popular sovereignty, the right of settlers to decide on slavery in a territory"
        - "judicial review, the power of courts to declare a law unconstitutional and refuse to enforce it"
      option_explanations:
        - |
          Nullification placed the judgment in a state legislature or convention (Calhoun, 1828–1832). Marshall places it in the courts, and his court used it to bind the states.
        - |
          The case concerned an undelivered judicial commission, not presidential documents; executive privilege is a much later doctrine.
        - |
          Popular sovereignty is a Period 5 idea (Cass, Douglas, 1848–1854) about slavery in the territories.
        - |
          Correct. A law "repugnant to the Constitution is void," and it is the courts' duty to say so. Marbury was the first time the Supreme Court struck down an act of Congress.
      answer: 3
      explanation: |
        Identify the concept from the text. "To say what the law is" and "a law repugnant to the Constitution is void" define judicial review.

    - slug: apush-u04-w10-q05
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Marbury v. Madison, 5 U.S. 137 (1803), Justia U.S. Supreme Court"
      points: 1
      stimulus: |
        "It is emphatically the province and duty of the Judicial Department to say what the law is. Those who apply the rule to particular cases must, of necessity, expound and interpret that rule. If two laws conflict with each other, the Courts must decide on the operation of each. ... Thus, the particular phraseology of the Constitution of the United States confirms and strengthens the principle, supposed to be essential to all written Constitutions, that a law repugnant to the Constitution is void, and that courts, as well as other departments, are bound by that instrument."

        — Chief Justice John Marshall, opinion of the Court, Marbury v. Madison, 1803
      prompt: |
        Which of the following best explains why Marshall's ruling was politically shrewd in the situation of 1803?
      options:
        - "It denied Marbury his remedy, so the Republican administration had nothing to defy, while establishing a lasting power for the Court."
        - "It ordered Jefferson to deliver Marbury's commission, which Jefferson immediately did."
        - "It repealed the Judiciary Act of 1801, which pleased the Republicans in Congress."
        - "It expanded the Court's original jurisdiction, giving the Federalist judges new cases to decide."
      option_explanations:
        - |
          Correct. Marshall said Marbury had a right to his commission but that the law giving the Court power to issue the writ was unconstitutional. Jefferson won the case and could not resist it, while the Court gained judicial review.
        - |
          Marshall did not order delivery; he held the Court lacked jurisdiction to issue the writ, and Madison never delivered the commission.
        - |
          Congress, not the Court, repealed the Judiciary Act of 1801 in 1802. Marbury struck down part of the Judiciary Act of 1789.
        - |
          The opposite: Marshall ruled Congress could not add to the Court's original jurisdiction, which narrowed it in this case.
      answer: 0
      explanation: |
        Historical situation. A Federalist Chief Justice facing a hostile Republican president and Congress chose a ruling that could not be disobeyed.

    - slug: apush-u04-w10-q06
      type: multiple_choice
      topic_code: "3.9"
      source: "Primary source: Marbury v. Madison, 5 U.S. 137 (1803), Justia U.S. Supreme Court; U.S. Constitution, Article III and Article VI, National Archives"
      points: 1
      stimulus: |
        "It is emphatically the province and duty of the Judicial Department to say what the law is. Those who apply the rule to particular cases must, of necessity, expound and interpret that rule. If two laws conflict with each other, the Courts must decide on the operation of each. ... Thus, the particular phraseology of the Constitution of the United States confirms and strengthens the principle, supposed to be essential to all written Constitutions, that a law repugnant to the Constitution is void, and that courts, as well as other departments, are bound by that instrument."

        — Chief Justice John Marshall, opinion of the Court, Marbury v. Madison, 1803
      prompt: |
        Review. Marshall's reasoning built most directly on which feature of the Constitution of 1787?
      options:
        - "The Bill of Rights' guarantee of trial by jury"
        - "The supremacy clause, which makes the Constitution the supreme law of the land, together with Article III's grant of judicial power"
        - "The Tenth Amendment's reservation of powers to the states"
        - "The Three-Fifths Clause on representation"
      option_explanations:
        - |
          The jury-trial guarantees in the Sixth and Seventh Amendments concern procedure in individual cases, not the courts' power over statutes.
        - |
          Correct. Judicial review is not named in the text, but Article VI declares the Constitution supreme and Article III gives the courts power over cases "arising under" it; Hamilton had argued as much in Federalist No. 78.
        - |
          The Tenth Amendment reserves powers to the states and was later invoked against federal power, not used to build the federal courts' authority.
        - |
          The Three-Fifths Clause concerns apportionment of representatives and direct taxes; it has nothing to do with the courts' authority.
      answer: 1
      explanation: |
        Making connections (Topic 3.9 review). A written constitution that is supreme law needs someone to apply it; the Federalist judges claimed that role.

    # ---- Stimulus set: Jefferson on New Orleans (4.2, review 3.12)
    - slug: apush-u04-w10-q07
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Thomas Jefferson to Robert R. Livingston, 18 April 1802, Founders Online, National Archives"
      points: 1
      stimulus: |
        "There is on the globe one single spot, the possessor of which is our natural & habitual enemy. it is New Orleans, through which the produce of three eighths of our territory must pass to market, and from it’s fertility it will ere long yield more than half of our whole produce and contain more than half our inhabitants. France placing herself in that door assumes to us the attitude of defiance. ... the day that France takes possession of N. Orleans fixes the sentence which is to restrain her forever within her low water mark. it seals the union of two nations who in conjunction can maintain exclusive possession of the ocean. from that moment we must marry ourselves to the British fleet & nation."

        — Thomas Jefferson, letter to Robert R. Livingston, U.S. minister to France, April 18, 1802 (spelling as in the original)
      prompt: |
        Jefferson's concern about New Orleans in the excerpt arose most directly from
      options:
        - "the danger that Britain would seize New Orleans during the Napoleonic Wars"
        - "the dependence of western farmers on the Mississippi River and the port of New Orleans to reach markets"
        - "a slave revolt in New Orleans that threatened the southern states"
        - "the collapse of the fur trade in the Pacific Northwest"
      option_explanations:
        - |
          Jefferson's fear in 1802 is of France taking possession from Spain; he actually threatens an alliance with Britain if France does so.
        - |
          Correct. Settlers west of the Appalachians floated their crops down the Mississippi; "the produce of three eighths of our territory must pass" through New Orleans, so whoever held it could strangle the West.
        - |
          The excerpt is about trade and power, not a revolt. Revolution in Saint-Domingue mattered to Napoleon's plans, but it is not Jefferson's stated concern here.
        - |
          The Pacific fur trade has nothing to do with the Mississippi outlet; the letter is about the produce of the trans-Appalachian West.
      answer: 1
      explanation: |
        Causation and geography (GEO). Rivers ran south and west of the mountains; New Orleans was the West's only practical door to the sea.

    - slug: apush-u04-w10-q08
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Thomas Jefferson to Robert R. Livingston, 18 April 1802, Founders Online, National Archives"
      points: 1
      stimulus: |
        "There is on the globe one single spot, the possessor of which is our natural & habitual enemy. it is New Orleans, through which the produce of three eighths of our territory must pass to market, and from it’s fertility it will ere long yield more than half of our whole produce and contain more than half our inhabitants. France placing herself in that door assumes to us the attitude of defiance. ... the day that France takes possession of N. Orleans fixes the sentence which is to restrain her forever within her low water mark. it seals the union of two nations who in conjunction can maintain exclusive possession of the ocean. from that moment we must marry ourselves to the British fleet & nation."

        — Thomas Jefferson, letter to Robert R. Livingston, U.S. minister to France, April 18, 1802 (spelling as in the original)
      prompt: |
        The excerpt is most useful as evidence that Jefferson
      options:
        - "opposed westward expansion because it would weaken the original states"
        - "remained committed above all to the alliance with France made during the American Revolution"
        - "was willing to subordinate his ideological sympathies to strategic and economic interests"
        - "believed the United States should acquire overseas colonies in the Caribbean"
      option_explanations:
        - |
          He predicts the West will soon hold "more than half our inhabitants" and wants its outlet secured, which assumes and welcomes expansion.
        - |
          Jefferson, long sympathetic to France, says the opposite: French possession of New Orleans would make France an "enemy" and push America toward Britain.
        - |
          Correct. The pro-French Republican threatens to "marry ourselves to the British fleet" to protect western trade, the same pragmatism that led him to buy Louisiana despite his strict reading of the Constitution.
        - |
          The concern is a port on the North American continent, not Caribbean colonies; expansion across the continent, not overseas, is the theme.
      answer: 2
      explanation: |
        Sourcing (point of view). A private diplomatic letter shows what a leader actually feared, not what he said in public; here, interest over ideology.

    - slug: apush-u04-w10-q09
      type: multiple_choice
      topic_code: "3.12"
      source: "general knowledge"
      points: 1
      stimulus: |
        "There is on the globe one single spot, the possessor of which is our natural & habitual enemy. it is New Orleans, through which the produce of three eighths of our territory must pass to market, and from it’s fertility it will ere long yield more than half of our whole produce and contain more than half our inhabitants. France placing herself in that door assumes to us the attitude of defiance. ... the day that France takes possession of N. Orleans fixes the sentence which is to restrain her forever within her low water mark. it seals the union of two nations who in conjunction can maintain exclusive possession of the ocean. from that moment we must marry ourselves to the British fleet & nation."

        — Thomas Jefferson, letter to Robert R. Livingston, U.S. minister to France, April 18, 1802 (spelling as in the original)
      prompt: |
        Review. Before 1802 the United States had secured western farmers' access to New Orleans through
      options:
        - "the Treaty of Greenville (1795) with the Western Confederacy"
        - "the Treaty of Paris of 1763"
        - "Jay's Treaty (1794) with Britain"
        - "Pinckney's Treaty (1795) with Spain, which granted navigation of the Mississippi and the right of deposit at New Orleans"
      option_explanations:
        - |
          The Treaty of Greenville forced American Indian nations to cede most of Ohio after Fallen Timbers; it opened land but not the river mouth.
        - |
          The 1763 treaty ended the Seven Years' War between European empires; the United States did not yet exist.
        - |
          Jay's Treaty dealt with British forts in the Northwest and maritime trade, not the Mississippi outlet.
        - |
          Correct. Pinckney's Treaty opened the river and the right to store goods at New Orleans. Spain's suspension of the right of deposit in 1802 and the transfer to France made the issue urgent.
      answer: 3
      explanation: |
        Continuity and change (Topic 3.12 review). Westward movement in the 1790s depended on diplomacy over the Mississippi; the Louisiana Purchase settled the question for good.

    - slug: apush-u04-w10-q10
      type: multiple_choice
      topic_code: "4.3"
      source: "Primary source: Missouri Compromise, Act of March 6, 1820, section 8, National Archives Milestone Documents"
      points: 1
      stimulus: |
        "... in all that territory ceded by France to the United States, under the name of Louisiana, which lies north of thirty-six degrees and thirty minutes north latitude, not included within the limits of the state, contemplated by this act, slavery and involuntary servitude, otherwise than in the punishment of crimes, whereof the parties shall have been duly convicted, shall be, and is hereby, forever prohibited ..."

        — Act to authorize the people of Missouri to form a state government, March 6, 1820, section 8
      prompt: |
        The provision in the excerpt was most directly a response to
      options:
        - "British demands that the United States end the Atlantic slave trade"
        - "the annexation of Texas as a slave state"
        - "a slave uprising in the Louisiana Territory"
        - "the request of Missouri, carved from the Louisiana Purchase, to enter the Union as a slave state, which would upset the balance of free and slave states in the Senate"
      option_explanations:
        - |
          The United States had already banned the import of enslaved Africans in 1808 under its own Constitution's timetable; this law concerns slavery's spread inside the country.
        - |
          Texas was annexed in 1845, a quarter-century later, and lies south of the line in any case.
        - |
          No revolt prompted the act; the crisis was a political fight in Congress over sectional power.
        - |
          Correct. Missouri's application set off the Tallmadge debate; the compromise admitted Missouri with slavery, Maine as free, and drew this line for the rest of the purchase.
      answer: 3
      explanation: |
        Causation. Sectional balance in the Senate is the key to the Missouri crisis; the 36°30′ line was the price for admitting another slave state.

    - slug: apush-u04-w10-q11
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best contextualizes the period 1800–1848 in United States history?
      options:
        - "The United States withdrew from world affairs and stopped expanding its territory."
        - "The nation developed a mass democratic political culture and a market economy, while debates over federal power and the expansion of slavery sharpened regional differences."
        - "Industrial factories replaced agriculture as the main source of employment in every region."
        - "The federal government took over the regulation of most aspects of the economy."
      option_explanations:
        - |
          The period saw the Louisiana Purchase, the War of 1812, the Monroe Doctrine and the Mexican War's beginning; it was an age of expansion.
        - |
          Correct. Wider white male suffrage and the second party system, the market revolution, and the sectional fights over tariffs, banks and slavery are the three threads of Period 4.
        - |
          Even by 1848 most Americans in every region still farmed; factories were concentrated in the Northeast.
        - |
          Federal economic activity was limited (a bank, tariffs, land sales); much development was led by states and private companies, and Jackson cut back federal involvement.
      answer: 1
      explanation: |
        Contextualization (Topic 4.1). A good context statement names the broad processes that frame a period rather than a single event.

    - slug: apush-u04-w10-q12
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Henry Clay's American System was intended primarily to
      options:
        - "make the United States economically self-sufficient by linking northern manufacturing, western agriculture and southern staples through a tariff, a national bank and internal improvements"
        - "open Asian markets to American merchants through naval expeditions"
        - "end slavery gradually by compensating slaveholders with federal land sales"
        - "reduce federal power by returning revenue to the states"
      option_explanations:
