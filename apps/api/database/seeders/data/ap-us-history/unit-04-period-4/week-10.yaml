        - |
          Opening Asian markets (such as Perry's mission to Japan in 1853–1854) is a Period 5 development unrelated to Clay's domestic program.
        - |
          Clay did support colonization of freed people abroad, but the American System was an economic program, not an emancipation plan.
        - |
          Clay's program enlarged federal economic power. The idea of distributing federal surplus to the states came later and is not the American System.
      answer: 0
      explanation: |
        Topic 4.3. Know the three parts of the American System and the regional interests each one served or burdened.

    - slug: apush-u04-w10-q13
      type: multiple_choice
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which development after the Revolution helped create the free-state versus slave-state division at stake in the Missouri crisis?
      options:
        - "The ban on slavery in the Southwest Territory"
        - "The abolition of slavery in all states by the Constitution of 1787"
        - "The adoption of gradual or immediate emancipation laws by northern states such as Pennsylvania (1780) and New York (1799)"
        - "The spread of cotton cultivation into New England"
      option_explanations:
        - |
          Congress did not ban slavery in the Southwest Territory (later Tennessee); the ban applied to the Northwest Territory.
        - |
          The Constitution protected slavery in several ways (the Three-Fifths Clause, the fugitive slave clause, a 20-year protection for the slave trade); it abolished it nowhere.
        - |
          Correct. Revolutionary ideals of liberty led northern states to end slavery, gradually or at once, so by 1804 every state north of Maryland had a legal path to emancipation and the Union had two kinds of state.
        - |
          Cotton spread into the Deep South, not New England, which built mills to spin it.
      answer: 2
      explanation: |
        Making connections (Topic 3.6 review). The ideals of 1776 changed northern law but not southern, producing the sectional map of 1820.

    - slug: apush-u04-w10-q14
      type: multiple_choice
      topic_code: "3.7"
      source: "National Archives, Milestone Documents: Northwest Ordinance (1787)"
      points: 1
      prompt: |
        Review. The Northwest Ordinance (1787) and the Missouri Compromise (1820) were similar in that both
      options:
        - "asserted Congress's power to exclude slavery from a federal territory"
        - "allowed settlers in each territory to vote on whether to permit slavery"
        - "abolished slavery in states that already permitted it"
        - "were passed under the Articles of Confederation"
      option_explanations:
        - |
          Correct. The Ordinance barred slavery north of the Ohio River and the 1820 act barred it north of 36°30′. Both assumed Congress could decide slavery in territories, the very power later denied by the Dred Scott decision (1857).
        - |
          That is popular sovereignty, a later idea (the Kansas-Nebraska Act, 1854) that replaced congressional lines.
        - |
          Neither touched slavery inside existing states; both concerned western lands not yet states.
        - |
          Only the Northwest Ordinance came under the Articles; the Missouri Compromise was an act of the Congress created by the Constitution.
      answer: 0
      explanation: |
        Comparison (Topic 3.7 review). The precedent for a congressional line runs from 1787 to 1820 and is broken in 1854.

