    - slug: apush-u04-w10-q23
      type: short_answer
      topic_code: "4.3"
      source: "Primary source: Thomas Jefferson to John Holmes, April 22, 1820, Library of Congress exhibition 'Thomas Jefferson'"
      points: 3
      stimulus: |
        "... this momentous question, like a fire bell in the night, awakened and filled me with terror. I considered it at once as the knell of the Union. ... a geographical line, coinciding with a marked principle, moral and political, once concieved and held up to the angry passions of men, will never be obliterated; and every new irritation will mark it deeper and deeper. ... we have the wolf by the ear, and we can neither hold him, nor safely let him go."

        — Thomas Jefferson, letter to John Holmes of Maine, April 22, 1820 (spelling as in the original)
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the "momentous question" that Jefferson refers to.
        (b) Briefly explain ONE reason Jefferson feared a "geographical line" more than earlier political disagreements.
        (c) Briefly explain ONE way the excerpt shows the tension between Jefferson's ideals and his position as a slaveholder.
      answer: |
        (a) The question was whether Missouri would enter the Union as a slave state and whether slavery would spread into the Louisiana Purchase; Congress settled it in 1820 by admitting Missouri with slavery, Maine as free, and banning slavery north of 36°30′.
        (b) Party fights such as Federalists against Republicans cut across regions and could change with the next election, but a line that coincided with a moral principle, slavery, divided the country permanently by section. Every new territory would reopen it, so Jefferson thought it "will never be obliterated."
        (c) The "wolf by the ear" image admits that slavery is dangerous and wrong to hold, yet Jefferson, who wrote that all men are created equal and himself held more than a hundred people in slavery, says it cannot "safely" be let go; he feared emancipation more than he condemned slavery.
      explanation: |
        One point per part.
        (a) Earns the point for identifying the admission of Missouri / spread of slavery into the West (the Missouri crisis or Compromise). Zero for a general reference to "slavery" with no link to Missouri or the territories.
        (b) Earns the point for explaining that a sectional line tied to a moral question would be permanent or would grow, unlike shifting party disputes (Jefferson's own words may be used if explained). Acceptable: Senate balance would be fought over at every new state; the North and South would see each other as enemies. Zero for restating the quote without explanation.
        (c) Earns the point for connecting the "wolf by the ear" (or "nor safely let him go") to Jefferson's dilemma: he saw slavery as a danger or evil but would not support emancipation, or authored the Declaration while enslaving people. Zero for a claim that Jefferson opposed the Missouri Compromise because he wanted abolition.
        Skill: sourcing and situation, causation.

    - slug: apush-u04-w10-q24
      type: short_answer
      topic_code: "4.2"
      source: "Secondary interpretation written for this course"
      points: 3
      stimulus: |
        Interpretation (written for this course): "The 'Revolution of 1800' changed the tone of government more than its structure. Jefferson's Republicans repealed internal taxes, shrank the military and let the Sedition Act lapse, but they kept the Bank of the United States, enforced Hamilton's funded debt and, by buying Louisiana, used federal power more boldly than any Federalist had. Within sixteen years Republican presidents had chartered a second national bank and signed a protective tariff. The opposition did not defeat Federalist policy; it absorbed it."
      prompt: |
        Using the interpretation, answer (a), (b) and (c).

        (a) Briefly describe the argument made in the interpretation.
        (b) Briefly explain ONE piece of evidence from 1801 to 1816 that supports the interpretation.
        (c) Briefly explain ONE piece of evidence from 1801 to 1816 that challenges the interpretation.
      answer: |
        (a) The interpretation argues that Jefferson's victory changed style and some priorities but that the Republicans kept, and even extended, the Federalist framework of federal power: continuity outweighed change.
        (b) Support: in 1816 Madison signed the charter of the Second Bank of the United States and the protective Tariff of 1816, policies Hamilton had championed and Republicans had once called unconstitutional.
        (c) Challenge: Jefferson really did change government's scale and direction; Gallatin paid down much of the national debt, the whisky tax was repealed, the army and navy were reduced, and the Republicans ended the Federalists' Judiciary Act of 1801. Real changes in policy and in who governed, from merchants to farmers' representatives, suggest 1800 was more than a change of tone.
      explanation: |
        One point per part.
        (a) Earns the point for stating that Republicans continued or absorbed Federalist policies / changed tone more than structure. Zero for simply saying "it is about Jefferson."
        (b) Earns the point for a specific, accurately dated piece of evidence of continuity: keeping the first bank until 1811, the Second Bank (1816), Tariff of 1816, the Louisiana Purchase as a loose-construction act, the Embargo's heavy use of federal power. Zero for evidence outside 1801–1816 or without explanation.
        (c) Earns the point for a specific piece of evidence of change: repeal of internal taxes, debt reduction, cuts to the military, repeal of the Judiciary Act of 1801, expiration of the Sedition Act and pardons, the decline of the Federalist Party. Zero for vague claims ("Jefferson was different").
        Skill: claims and evidence in secondary sources; continuity and change.

    - slug: apush-u04-w10-q25
      type: long_answer
      topic_code: "4.2"
      source: "general knowledge"
      points: 6
      prompt: |
        In 1800 Thomas Jefferson's Democratic-Republicans won control of the federal government from the Federalists, promising a limited government that would respect the rights of the states. In the years that followed, Republican presidents faced foreign crises, a growing national economy and new territory to govern. You might consider the Louisiana Purchase, the Marshall Court, the Embargo, the War of 1812 or the economic nationalism that followed it.

        Evaluate the extent to which the Democratic-Republicans' governance from 1801 to 1824 marked a change from the principles they had championed in the 1790s.
      answer: |
        Thesis: Although the Democratic-Republicans did cut taxes, debt and the military as promised, in power they largely abandoned strict construction; the Louisiana Purchase, the Embargo and the postwar nationalism of 1816 show them using broad federal power, so their governance marked a substantial change from their 1790s principles.

        Context: in the 1790s Jefferson and Madison opposed Hamilton's bank and the Alien and Sedition Acts as unconstitutional extensions of federal power and wrote the Virginia and Kentucky Resolutions.

        Body 1 (continuity with principles): repeal of internal taxes, debt reduction under Gallatin, cuts to the army and navy, repeal of the Judiciary Act of 1801, letting the Sedition Act expire.

        Body 2 (change): the Louisiana Purchase (1803) with no explicit constitutional power; the Embargo Act (1807) enforced with sweeping federal power over trade; the War of 1812.

        Body 3 (change): after 1815 the Republicans adopted the Second Bank (1816), the protective Tariff of 1816 and support for internal improvements, Clay's American System; Monroe's "Era of Good Feelings" absorbed Federalist nationalism.

        Complexity: Madison's Bonus Bill veto (1817) shows some principles survived, and the Marshall Court, not Republicans, drove much nationalism, so change was real but incomplete.
      explanation: |
        Thesis/claim (1 point): a historically defensible claim that establishes a line of reasoning about the extent of change, e.g. "largely changed" or "kept their limited-government goals in domestic finance but abandoned strict construction in expansion and economic policy." Zero for restating the prompt.

        Contextualization (1 point): describes the broader context, such as the 1790s party conflict over Hamilton's program, the Alien and Sedition Acts and the Virginia and Kentucky Resolutions, or the Napoleonic Wars that shaped foreign policy. Must be more than a phrase.

        Evidence (2 points): 1 point for two specific examples (Louisiana Purchase, Embargo Act 1807, Non-Intercourse Act 1809, War of 1812, Second Bank 1816, Tariff of 1816, Bonus Bill veto 1817, repeal of the whisky tax, Gallatin's debt reduction, Marbury v. Madison, Lewis and Clark). 2 points when the examples are used to support the argument about change versus continuity.

        Analysis and reasoning (2 points): 1 point for using continuity and change over time to frame the argument (what stayed, what shifted, and why). 1 point for complex understanding, e.g. explaining both continuity and change, explaining why practical governing pushed Republicans toward Federalist tools (war, trade, expansion), or showing that the Marshall Court drove nationalism independent of the Republicans.

        Zero overall for a narrative of Jefferson's presidency with no argument about change.
