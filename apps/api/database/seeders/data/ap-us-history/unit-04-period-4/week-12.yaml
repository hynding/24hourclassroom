    - slug: apush-u04-w12-q23
      type: short_answer
      topic_code: "4.8"
      source: "Primary source: Worcester v. Georgia, 31 U.S. 515 (1832), Justia U.S. Supreme Court"
      points: 3
      stimulus: |
        "The Cherokee nation, then, is a distinct community, occupying its own territory, with boundaries accurately described, in which the laws of Georgia can have no force, and which the citizens of Georgia have no right to enter but with the assent of the Cherokees themselves, or in conformity with treaties and with the acts of Congress."

        — Chief Justice John Marshall, Worcester v. Georgia, 1832
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the Court's claim about the relationship between the Cherokee nation and the state of Georgia.
        (b) Briefly explain ONE reason the decision did not prevent Cherokee removal.
        (c) Briefly explain ONE way the Cherokee response to removal pressure differed from earlier Native responses to American expansion.
      answer: |
        (a) The Court held that the Cherokee were a distinct political community whose territory was protected by federal treaties, so Georgia's laws had no force there and Georgians could not enter without Cherokee consent or federal authority.
        (b) The Court had no means of enforcing its ruling, and President Jackson, who supported removal, declined to enforce it; Georgia ignored the decision, and the federal government instead negotiated the minority-signed Treaty of New Echota (1835) and used the army to remove the Cherokee in 1838.
        (c) Rather than military confederation like Tecumseh's before 1813, the Cherokee used American institutions: a written constitution (1827), Sequoyah's syllabary and the Cherokee Phoenix, petitions to Congress, and lawsuits that reached the Supreme Court.
      explanation: |
        One point per part.
        (a) Earns the point for stating that the Cherokee nation was sovereign / distinct and that Georgia law did not apply in its territory, which was under federal (treaty) authority. Zero for "the Court sided with the Cherokee" with no description of the claim.
        (b) Earns the point for explaining Jackson's refusal to enforce, Georgia's defiance, the Court's lack of enforcement power, or the Treaty of New Echota and the Indian Removal Act. Zero for the claim that the Court reversed itself.
        (c) Earns the point for contrasting legal and political strategies (constitution, newspaper, syllabary, petitions, Supreme Court cases) with earlier armed resistance (Pontiac, Western Confederacy, Tecumseh, Red Sticks). Also acceptable: the Seminoles' armed resistance as a contrast within the 1830s, if explained. Zero for a description of the Trail of Tears without a comparison.
        Skill: sourcing and situation; comparison.

    - slug: apush-u04-w12-q24
      type: short_answer
      topic_code: "4.7"
      source: "Described non-text source: 'King Andrew the First', anonymous Whig lithograph, c. 1833 (Library of Congress Prints and Photographs)"
      points: 3
      stimulus: |
        Political cartoon (described): "King Andrew the First," an anonymous lithograph printed about 1833 by Jackson's opponents. Jackson stands dressed as a European monarch, with a crown, an ermine-trimmed robe and a sceptre, holding a scroll labelled "veto." Under his feet lie torn pages labelled as the Constitution of the United States and the arms of Pennsylvania, and a book labelled "Internal Improvements." The title names him King Andrew the First.
      prompt: |
        Using the cartoon, answer (a), (b) and (c).

        (a) Briefly describe the point of view expressed in the cartoon.
        (b) Briefly explain ONE action by Jackson from 1830 to 1833 that the cartoonist could cite as evidence.
        (c) Briefly explain ONE way Jackson's supporters would have defended his use of executive power.
      answer: |
        (a) The cartoonist, a Whig opponent, portrays Jackson as a tyrant who abused the veto and trampled the Constitution and the rights of states and Congress, the opposite of the democratic hero his supporters celebrated.
        (b) Jackson vetoed the recharter of the Second Bank (1832) and then removed federal deposits from it (1833) over the objection of his own treasury secretaries; he also vetoed the Maysville Road bill (1830), which the "Internal Improvements" book refers to.
        (c) Jacksonians argued that the president, elected by the whole people, was their only national representative and had a duty to protect ordinary citizens against a privileged "monster" bank and special-interest spending; the veto was a democratic check on an aristocracy of wealth.
      explanation: |
        One point per part.
        (a) Earns the point for identifying the view that Jackson acted like a monarch / abused executive power / violated the Constitution. Zero for simply describing the drawing ("Jackson is wearing a crown") without its meaning.
        (b) Earns the point for a specific action explained: Bank Veto (1832), removal of deposits (1833), Maysville Road veto (1830), the record number of vetoes, refusal to enforce Worcester v. Georgia, the spoils system. Zero for actions after 1833 unless clearly linked.
        (c) Earns the point for explaining the Jacksonian defence: the president as the people's tribune, opposition to monopoly and privilege, strict construction (internal improvements and the bank exceeded federal power), majority rule. Zero for "his supporters liked him."
        Skill: analysing a visual source; point of view; argumentation.

    - slug: apush-u04-w12-q25
      type: long_answer
      topic_code: "4.8"
      source: "general knowledge"
      points: 6
      prompt: |
        Andrew Jackson's admirers called him the champion of the common man; his enemies called him "King Andrew." His presidency involved conflicts over the national bank, the tariff and nullification, Indian removal and the power of the presidency itself. You might consider how his actions affected different groups and the balance between federal and state power.

        Evaluate the extent to which Andrew Jackson's presidency (1829–1837) strengthened the power of the federal government.
      answer: |
        Thesis: Jackson strengthened the presidency and defended federal supremacy against nullification, but he weakened federal power over the economy by destroying the national bank and blocking internal improvements, and he expanded state power over Native lands; on balance, he strengthened the executive more than the federal government as a whole.

        Context: by 1828 suffrage had expanded for white men, the Panic of 1819 had turned many against the Second Bank, and the Marshall Court had built federal power through McCulloch and Gibbons.

        Body 1 (strengthened): Nullification Proclamation (1832) and the Force Bill asserted that no state could void a federal law; the record use of the veto and removal of deposits strengthened the presidency.

        Body 2 (weakened): the Bank Veto (1832) and the Specie Circular left the economy to state banks, contributing to the Panic of 1837; the Maysville Road veto (1830) limited federal internal improvements.

        Body 3 (states over federal treaties): Jackson backed Georgia against the Cherokee and declined to enforce Worcester v. Georgia, yet the Indian Removal Act and the army that carried out removal were exercises of federal power on behalf of states.

        Complexity: Jackson's own view joined a strong presidency and a strong Union to a limited federal role in the economy; the Whigs' opposition shows contemporaries saw executive power growing.
      explanation: |
        Thesis/claim (1 point): a defensible claim about the extent to which federal power was strengthened, with a line of reasoning (e.g. the presidency was strengthened while federal economic power was reduced). Zero for restating the prompt.

        Contextualization (1 point): e.g. the expansion of white male suffrage and the election of 1828, the "corrupt bargain," the Panic of 1819 and anti-bank sentiment, the Marshall Court's nationalism, or regional conflict over tariffs since 1816.

        Evidence (2 points): 1 point for two specific examples (Bank Veto 1832, removal of deposits 1833, Specie Circular 1836, Maysville Road veto 1830, Tariff of Abominations, Nullification Proclamation and Force Bill, Compromise Tariff 1833, Indian Removal Act 1830, Worcester v. Georgia, Trail of Tears, spoils system, Webster–Hayne debate). 2 points when they are used to support the argument.

        Analysis and reasoning (2 points): 1 point for using causation or continuity and change to frame the argument. 1 point for complex understanding, e.g. distinguishing executive power from federal power, explaining why Jackson could defend the Union and states' rights at once, or analysing the effects on different groups (planters, workers, Native nations, bankers).

        Zero overall for a biography of Jackson without an argument about federal power.
