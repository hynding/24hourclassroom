week: 12
unit: 4
title: "Jacksonian Democracy and American Culture"
topics: ["4.7", "4.8", "4.9"]
guide: guides/week-12.md
guide_description: |
  How the vote spread to nearly all white men while being taken from or denied to others; Andrew Jackson's
  presidency and its fights over the Bank, nullification and Indian removal; the second party system of Democrats
  and Whigs; and the search for a distinctly American literature, art and philosophy. Worked examples: sourcing the
  Bank Veto with HIPP, a comparison of Democrats and Whigs, and an SAQ on Worcester v. Georgia.
flashcards_description: |
  30 cards on the expansion of suffrage, the elections of 1824–1840, Jackson's Bank War, nullification and Indian
  removal, the Whigs, and American Romanticism, Transcendentalism and the Hudson River School.

flashcards:
  - front: Property qualifications for voting → what happened to them, 1800–1840
    back: |
      Most states dropped property (and later taxpaying) requirements for white men, so by 1840 nearly all adult white men could vote. New western states led; older states such as New York (1821, 1826) followed in constitutional conventions.
    topic_code: "4.7"
  - front: Expanding democracy → who was excluded or lost ground, 1800–1840
    back: |
      Women everywhere; most free Black men, as New Jersey (1807) and Pennsylvania (1838) took away their vote and New York kept a $250 property requirement only for them (1821); American Indians; and enslaved people. White male democracy was often defined by race.
    topic_code: "4.7"
  - front: Election of 1824 → why it was called a "corrupt bargain"
    back: |
      Jackson led in popular and electoral votes but lacked a majority, so the House chose. Henry Clay backed John Quincy Adams, who then named Clay secretary of state; Jackson's followers called it a corrupt bargain and organised for 1828.
    topic_code: "4.7"
  - front: Election of 1828 → why it marked a new politics
    back: |
      Jackson defeated J. Q. Adams in a campaign of mass rallies, partisan newspapers and personal attacks, with turnout far above 1824. Martin Van Buren's organisation built the Democratic Party as a national machine.
    topic_code: "4.7"
  - front: Martin Van Buren → role in the second party system
    back: |
      The New York organiser who argued that permanent, disciplined parties were good for the republic, built the Democratic coalition for Jackson, served as his vice president and won the presidency in 1836.
    topic_code: "4.7"
  - front: Spoils system → definition and defence
    back: |
      Rewarding party loyalists with government jobs, named after New York senator William Marcy's remark that spoils belong to the victor. Jacksonians defended rotation in office as democratic, ending a permanent class of officeholders.
    topic_code: "4.7"
  - front: National nominating conventions (from 1831–1832) → significance
    back: |
      The Anti-Masons, then the National Republicans and Democrats, chose presidential candidates at party conventions instead of in congressional caucuses ("King Caucus"), giving rank-and-file party members a voice.
    topic_code: "4.7"
  - front: Whig Party (formed 1833–1834) → who and what they stood for
    back: |
      Opponents of "King Andrew" led by Henry Clay and Daniel Webster. They backed the American System, a strong Congress, moral reform and economic development, and drew merchants, manufacturers, evangelical Protestants and commercial farmers.
    topic_code: "4.7"
  - front: Compare Democrats and Whigs in the 1830s
    back: |
      Democrats: limited federal government, hostility to banks and monopolies, states' rights, expansion; strong among small farmers, immigrants and the South. Whigs: active government promoting a national market (bank, tariff, internal improvements) and moral reform; strong in New England and commercial areas.
    topic_code: "4.7"
  - front: Election of 1840 → "log cabin and hard cider"
    back: |
      The Whigs ran William Henry Harrison as a common man with parades, songs and slogans ("Tippecanoe and Tyler too") and beat Van Buren amid the depression after 1837. Turnout reached about 80% of eligible voters, a peak of the second party system.
    topic_code: "4.7"
  - front: Bank War → Jackson's veto (1832) and removal of deposits (1833)
    back: |
      Jackson vetoed the early recharter of the Second Bank as an unconstitutional monopoly favouring the rich and foreign stockholders, won re-election on the issue, and moved federal deposits to state "pet banks." The bank died in 1836.
    topic_code: "4.8"
  - front: Nicholas Biddle → who
    back: |
      President of the Second Bank of the United States, who, with Clay and Webster, sought early recharter in 1832 to make it an election issue. Jackson saw the move as a political attack and resolved to destroy the bank.
    topic_code: "4.8"
  - front: Specie Circular (1836) → what it did and effect
    back: |
      Jackson's order that public land be paid for in gold or silver, to curb speculation on paper money from state banks. It drained specie and helped trigger the Panic of 1837, which wrecked Van Buren's presidency.
    topic_code: "4.8"
  - front: Panic of 1837 → causes
    back: |
      Speculation fed by state bank notes after the Second Bank's death, the Specie Circular, falling cotton prices and tighter British credit. A depression lasting into the early 1840s followed.
    topic_code: "4.8"
  - front: Tariff of Abominations (1828) → why the South hated it
    back: |
      Very high protective duties that helped northern manufacturers while raising the cost of goods for southern planters, who sold cotton on a world market. It prompted Calhoun's anonymous South Carolina Exposition and Protest.
    topic_code: "4.8"
  - front: Nullification Crisis (1832–1833) → sequence
    back: |
      South Carolina's convention declared the tariffs of 1828 and 1832 void in the state. Jackson called nullification incompatible with the Union and got a Force Bill; Clay's Compromise Tariff (1833) lowered rates, and South Carolina backed down while nullifying the Force Bill.
    topic_code: "4.8"
  - front: John C. Calhoun's nullification theory → argument
    back: |
      The Union was a compact of sovereign states, so a state convention could declare a federal law unconstitutional and void within its borders. It drew on the Virginia and Kentucky Resolutions and was meant to protect a southern minority, slavery included.
    topic_code: "4.8"
  - front: Webster–Hayne debate (1830) → significance
    back: |
      Senators Daniel Webster and Robert Hayne argued over whether the Union was a compact of states or a creation of the people. Webster's reply, insisting that liberty and union could not be separated, became a nationalist creed that schoolchildren memorised.
    topic_code: "4.8"
  - front: Indian Removal Act (1830) → what it authorised
    back: |
      Congress let the president exchange lands west of the Mississippi for the lands of eastern Native nations. It passed narrowly; removal was supposed to be by treaty, but pressure, fraud and force followed.
    topic_code: "4.8"
  - front: Cherokee Nation v. Georgia (1831) and Worcester v. Georgia (1832) → holdings
    back: |
      In 1831 Marshall called the Cherokee one of the "domestic dependent nations" that could not sue as a foreign state. In 1832 he ruled Georgia's laws had no force in Cherokee territory, which was under federal treaty protection. Georgia ignored the ruling and Jackson did not enforce it.
    topic_code: "4.8"
  - front: Cherokee strategies against removal → three
    back: |
      Adapting American institutions (a written constitution in 1827, Sequoyah's syllabary, the newspaper Cherokee Phoenix), petitions and memorials to Congress, and lawsuits in federal court. Principal Chief John Ross led the resistance.
    topic_code: "4.8"
  - front: Trail of Tears (1838–1839) → what happened
    back: |
      After the minority-signed Treaty of New Echota (1835), the army forced about 16,000 Cherokees west to Indian Territory; roughly 4,000 died in camps and on the march. Choctaw, Creek, Chickasaw and Seminole removals came before and alongside it.
    topic_code: "4.8"
  - front: Second Seminole War (1835–1842) → significance
    back: |
      Seminoles, with Black allies who had escaped slavery, resisted removal from Florida in the longest and costliest of the Indian wars before the Civil War. Many were eventually removed; some stayed in the Everglades.
    topic_code: "4.8"
  - front: '"King Andrew the First" cartoon (c. 1833) → point of view'
    back: |
      A Whig cartoon showing Jackson in royal robes holding a veto, trampling the Constitution. It captured the opposition's charge that Jackson's vetoes and removal of the deposits were executive tyranny, and the Whigs took their name from British opponents of royal power.
    topic_code: "4.8"
  - front: Ralph Waldo Emerson's "The American Scholar" (1837) → argument
    back: |
      An address at Harvard calling on Americans to stop imitating Europe and think for themselves from nature and experience; Oliver Wendell Holmes called it America's intellectual declaration of independence.
    topic_code: "4.9"
  - front: Transcendentalism → core beliefs
    back: |
      A New England movement (Emerson, Henry David Thoreau, Margaret Fuller) holding that truth is found through intuition and nature rather than tradition or institutions, and that individuals should be self-reliant. It fed reform, and Thoreau's "Civil Disobedience" (1849) protested slavery and the Mexican War.
    topic_code: "4.9"
  - front: Hudson River School → what and who
    back: |
      Landscape painters led by Thomas Cole (from the 1820s) who celebrated the wild American landscape as sublime and distinctly national, sometimes with uneasy notes about its loss to settlement.
    topic_code: "4.9"
  - front: Romanticism in American literature → examples
    back: |
      Emotion, nature, the individual and the national past over Enlightenment reason: Washington Irving's tales, James Fenimore Cooper's Leatherstocking novels (The Last of the Mohicans, 1826), Edgar Allan Poe, later Hawthorne and Melville.
    topic_code: "4.9"
  - front: Noah Webster's American Dictionary (1828) → cultural significance
    back: |
      Webster standardised a distinctly American spelling and vocabulary (color, center) to give the new nation its own language and cultural independence from Britain.
    topic_code: "4.9"
  - front: Which theme? Tocqueville's Democracy in America (1835)
    back: |
      American and National Identity (NAT) and Social Structures (SOC): a French observer argued that "equality of conditions" was the defining fact of American society, while noting the place of slavery and the treatment of Native Americans.
    topic_code: "4.7"

quiz:
  description: |
    25 questions · about 40 minutes · about 70% this week (expanding democracy, Jackson and federal power, the
    second party system and American culture) and 30% review of weeks 10–11 (the Marshall Court, the American
    System, the market revolution) and earlier periods. Multiple choice, select-all and true/false items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long essay are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set: Jackson's Bank Veto (4.8, 4.7, review 4.2)
    - slug: apush-u04-w12-q01
      type: multiple_choice
      topic_code: "4.8"
      source: "Primary source: Andrew Jackson, Veto Message on the Bank of the United States (1832), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. In the full enjoyment of the gifts of Heaven and the fruits of superior industry, economy, and virtue, every man is equally entitled to protection by law; but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society—the farmers, mechanics, and laborers—who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

        — President Andrew Jackson, message vetoing the recharter of the Second Bank of the United States, July 10, 1832
      prompt: |
        Jackson's argument in the excerpt is best described as
      options:
        - "an attack on government-granted privileges that favoured the wealthy over ordinary working people"
        - "a call for the federal government to redistribute wealth equally among all citizens"
        - "an argument that only property owners should be allowed to vote"
        - "a defence of the Second Bank as a protector of farmers and labourers"
      option_explanations:
        - |
          Correct. Natural differences are acceptable, but laws granting "exclusive privileges" such as a monopoly bank charter make "the rich richer"; the farmers, mechanics and labourers are the victims.
        - |
          Jackson explicitly says equality of wealth "can not be produced by human institutions"; he objects to special favours, not to inequality as such.
        - |
          The excerpt appeals to the "humble members of society", the newly enfranchised voters of the Democratic coalition, rather than restricting the vote.
        - |
          Jackson is vetoing the bank's recharter; he presents it as the instrument of privilege.
      answer: 0
      explanation: |
        Reading a primary source for its claim. Separate what Jackson accepts (natural distinctions) from what he attacks (artificial privilege).

    - slug: apush-u04-w12-q02
      type: multiple_choice
      topic_code: "4.7"
      source: "Primary source: Andrew Jackson, Veto Message on the Bank of the United States (1832), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. In the full enjoyment of the gifts of Heaven and the fruits of superior industry, economy, and virtue, every man is equally entitled to protection by law; but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society—the farmers, mechanics, and laborers—who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

        — President Andrew Jackson, message vetoing the recharter of the Second Bank of the United States, July 10, 1832
      prompt: |
        The intended audience and purpose of the veto message are best understood in light of
      options:
        - "the approaching presidential election of 1832, in which the bank's recharter had been made a campaign issue"
        - "the Supreme Court's ruling in Worcester v. Georgia"
        - "British demands that the United States repay Revolutionary War debts"
        - "the outbreak of the Mexican–American War"
      option_explanations:
        - |
          Correct. Clay and Biddle pushed recharter four years early to embarrass Jackson before the election; Jackson wrote the veto as a campaign document for a mass electorate and won decisively.
        - |
          Worcester (1832) concerned Cherokee sovereignty, not banking.
        - |
          Revolutionary debts to Britain were settled long before; this was a domestic political fight.
        - |
          The Mexican–American War began in 1846, fourteen years after this veto, under President Polk.
      answer: 0
      explanation: |
        Sourcing (audience and purpose, 4.7). Presidential messages in the new mass democracy spoke over Congress to voters.

    - slug: apush-u04-w12-q03
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Andrew Jackson, Veto Message (1832), Avalon Project; McCulloch v. Maryland (1819), Justia"
      points: 1
      stimulus: |
        "It is to be regretted that the rich and powerful too often bend the acts of government to their selfish purposes. Distinctions in society will always exist under every just government. Equality of talents, of education, or of wealth can not be produced by human institutions. In the full enjoyment of the gifts of Heaven and the fruits of superior industry, economy, and virtue, every man is equally entitled to protection by law; but when the laws undertake to add to these natural and just advantages artificial distinctions, to grant titles, gratuities, and exclusive privileges, to make the rich richer and the potent more powerful, the humble members of society—the farmers, mechanics, and laborers—who have neither the time nor the means of securing like favors to themselves, have a right to complain of the injustice of their Government."

        — President Andrew Jackson, message vetoing the recharter of the Second Bank of the United States, July 10, 1832
      prompt: |
        Review. Jackson's veto was a challenge to which earlier decision of the Marshall Court?
      options:
        - "Dartmouth College v. Woodward, which protected corporate charters from state legislatures"
        - "Gibbons v. Ogden, which struck down a steamboat monopoly"
        - "McCulloch v. Maryland, which had upheld the constitutionality of the national bank"
        - "Marbury v. Madison, which established judicial review"
      option_explanations:
        - |
          Dartmouth protected a private charter from a state; Jackson's veto concerned a federal charter.
        - |
          Gibbons opened commerce to competition, an outcome Jacksonians generally welcomed.
        - |
          Correct. The Court had ruled the bank constitutional in 1819, but elsewhere in the message Jackson insisted each branch must judge the Constitution for itself, and he vetoed the bank anyway.
        - |
          Jackson did not attack judicial review in general; the issue was the bank.
      answer: 2
      explanation: |
        Making connections (Topic 4.2 review). The bank question runs 1791 → 1816 → 1819 → 1832.

    # ---- Stimulus set: Jackson on Indian removal (4.8, review 2.5)
    - slug: apush-u04-w12-q04
      type: multiple_choice
      topic_code: "4.8"
      source: "Primary source: Andrew Jackson, Second Annual Message (1830), National Archives Milestone Documents"
      points: 1
      stimulus: |
        "It gives me pleasure to announce to Congress that the benevolent policy of the Government, steadily pursued for nearly thirty years, in relation to the removal of the Indians beyond the white settlements is approaching to a happy consummation. ... It will separate the Indians from immediate contact with settlements of whites; free them from the power of the States; enable them to pursue happiness in their own way and under their own rude institutions; will retard the progress of decay, which is lessening their numbers, and perhaps cause them gradually, under the protection of the Government, and through the influence of good counsels, to cast off their savage habits and become an interesting, civilized, and Christian community."

        — President Andrew Jackson, annual message to Congress, December 6, 1830
      prompt: |
        Jackson's claims in the excerpt are most directly contradicted by which of the following?
      options:
        - "Many white settlers in Georgia wanted access to Cherokee land."
        - "The Cherokee had already adopted a written constitution, a syllabary, a newspaper and settled farming, and petitioned to remain on their land."
        - "Congress passed the Indian Removal Act in 1830."
        - "The federal government later established Indian Territory west of Arkansas."
      option_explanations:
        - |
          Settler demand for land supports the real motive for removal, but it does not contradict his factual claims about Native "decay."
        - |
          Correct. Jackson says removal will let Native peoples become "civilized"; the Cherokee had already done much of what he described, and still wanted to stay. Their adaptation shows his argument was a rationale for taking land.
        - |
          The act's passage is consistent with Jackson's request rather than a contradiction of his reasoning.
        - |
          Establishing Indian Territory carried out the policy; it does not undercut his claims.
      answer: 1
      explanation: |
        Claims and evidence. Test a source's argument against what was actually happening; the Cherokee case is the classic counter-evidence.

    - slug: apush-u04-w12-q05
      type: multiple_choice
      topic_code: "4.8"
      source: "Primary source: Andrew Jackson, Second Annual Message (1830), National Archives Milestone Documents"
      points: 1
      stimulus: |
        "It gives me pleasure to announce to Congress that the benevolent policy of the Government, steadily pursued for nearly thirty years, in relation to the removal of the Indians beyond the white settlements is approaching to a happy consummation. ... It will separate the Indians from immediate contact with settlements of whites; free them from the power of the States; enable them to pursue happiness in their own way and under their own rude institutions; will retard the progress of decay, which is lessening their numbers, and perhaps cause them gradually, under the protection of the Government, and through the influence of good counsels, to cast off their savage habits and become an interesting, civilized, and Christian community."

        — President Andrew Jackson, annual message to Congress, December 6, 1830
      prompt: |
        Which was the most immediate result of the policy described in the excerpt during the 1830s?
      options:
        - "The end of all armed conflict between Native nations and the United States"
        - "A federal ban on white settlement west of the Appalachians"
        - "Full U.S. citizenship for Native Americans who moved west"
        - "The forced relocation of the Cherokee, Choctaw, Creek, Chickasaw and Seminole nations to lands west of the Mississippi, with thousands of deaths"
      option_explanations:
        - |
          Removal provoked the Black Hawk War (1832) and the Second Seminole War (1835–1842).
        - |
          That resembles the Proclamation of 1763, the reverse of removal, which opened eastern land to white settlement.
        - |
          Most Native Americans did not gain citizenship until 1924.
        - |
          Correct. Removal treaties, many signed under duress, and military force moved the southeastern nations to Indian Territory; the Cherokee Trail of Tears (1838–1839) killed about a quarter of those forced west.
      answer: 3
      explanation: |
        Effects (4.8). Know the human cost of removal and the nations it affected.

    - slug: apush-u04-w12-q06
      type: multiple_choice
      topic_code: "2.5"
      source: "Primary source: Andrew Jackson, Second Annual Message (1830), National Archives; general knowledge of colonial Native policy"
      points: 1
      stimulus: |
        "It gives me pleasure to announce to Congress that the benevolent policy of the Government, steadily pursued for nearly thirty years, in relation to the removal of the Indians beyond the white settlements is approaching to a happy consummation. ... It will separate the Indians from immediate contact with settlements of whites; free them from the power of the States; enable them to pursue happiness in their own way and under their own rude institutions; will retard the progress of decay, which is lessening their numbers, and perhaps cause them gradually, under the protection of the Government, and through the influence of good counsels, to cast off their savage habits and become an interesting, civilized, and Christian community."

        — President Andrew Jackson, annual message to Congress, December 6, 1830
      prompt: |
        Review. The excerpt shows most continuity with which pattern in English colonial relations with American Indians before 1754?
      options:
        - "English colonies' consistent recognition of Native land titles in perpetuity"
        - "French reliance on trade alliances and intermarriage with Native peoples"
        - "Spanish encomienda labour systems that incorporated Native people into colonial society"
        - "English settlers' tendency to push Native peoples off land rather than incorporate them, justified by claims that Native peoples were uncivilised"
      option_explanations:
        - |
          English colonists recognised Native title only selectively and temporarily, and repeatedly overrode it.
        - |
          French fur-trade alliances and intermarriage are a contrast, not a continuity.
        - |
          The encomienda belonged to Spanish colonies and incorporated Native labour; Jackson proposes separation.
        - |
          Correct. From Virginia after 1622 and New England after King Philip's War, English colonists expanded by displacing Native nations, often describing them as savage; Jackson's language and policy continue that pattern.
      answer: 3
      explanation: |
        Continuity and change (Topic 2.5 review). Compare across periods: separation and displacement, justified by ideas of civilisation.

    # ---- Stimulus set: Tocqueville (4.7, review 4.6)
    - slug: apush-u04-w12-q07
      type: multiple_choice
      topic_code: "4.7"
      source: "Primary source: Alexis de Tocqueville, Democracy in America, vol. 1 (1835), trans. Henry Reeve, Project Gutenberg"
      points: 1
      stimulus: |
        "Amongst the novel objects that attracted my attention during my stay in the United States, nothing struck me more forcibly than the general equality of conditions. I readily discovered the prodigious influence which this primary fact exercises on the whole course of society, by giving a certain direction to public opinion, and a certain tenor to the laws; by imparting new maxims to the governing powers, and peculiar habits to the governed."

        — Alexis de Tocqueville, a French aristocrat who toured the United States in 1831–1832, Democracy in America, volume 1 (1835), translated by Henry Reeve
      prompt: |
        Which development of the 1820s and 1830s best supports Tocqueville's observation?
      options:
        - "The growth of a domestic slave trade from the Upper South to the Deep South"
        - "The elimination of property qualifications for voting by white men in most states"
        - "Indian removal from the southeastern states"
        - "Pennsylvania's 1838 constitution limiting the vote to white men"
      option_explanations:
        - |
          The domestic slave trade is evidence against general equality; Tocqueville himself wrote at length about slavery as a contradiction.
        - |
          Correct. Universal white male suffrage, popular election of more officials and mass party politics gave ordinary white men a political equality unknown in Europe.
        - |
          Removal is evidence of inequality toward Native Americans.
        - |
          Pennsylvania's racial restriction took the vote from Black men, limiting equality.
      answer: 1
      explanation: |
        Claims and evidence (4.7). Pick evidence that supports the claim, and notice which options would qualify it.

    - slug: apush-u04-w12-q08
      type: multiple_choice
      topic_code: "4.7"
      source: "Primary source: Alexis de Tocqueville, Democracy in America, vol. 1 (1835), trans. Henry Reeve, Project Gutenberg"
      points: 1
      stimulus: |
        "Amongst the novel objects that attracted my attention during my stay in the United States, nothing struck me more forcibly than the general equality of conditions. I readily discovered the prodigious influence which this primary fact exercises on the whole course of society, by giving a certain direction to public opinion, and a certain tenor to the laws; by imparting new maxims to the governing powers, and peculiar habits to the governed."

        — Alexis de Tocqueville, a French aristocrat who toured the United States in 1831–1832, Democracy in America, volume 1 (1835), translated by Henry Reeve
      prompt: |
        Tocqueville's point of view as a French aristocrat most likely shaped his observations because he
      options:
        - "wanted to encourage French emigration to the American West"
        - "had never encountered a republic before visiting the United States"
        - "was writing campaign literature for the Democratic Party"
        - "was comparing American society with the hierarchical societies of Europe, where birth and rank still mattered greatly"
      option_explanations:
        - |
          His purpose was analytical, not promotional; he wanted to understand democracy's tendencies.
        - |
          France had itself been a republic in the 1790s, and Tocqueville was well read in republican thought.
        - |
          He wrote for a French audience about the future of democracy in Europe, not for an American party.
        - |
          Correct. Coming from a nobility shaken by revolution, Tocqueville saw equality of condition as the striking fact; Americans themselves were often more aware of growing inequality of wealth.
      answer: 3
      explanation: |
        Sourcing (point of view). An outsider's comparison explains what he noticed and what he underplayed.

    - slug: apush-u04-w12-q09
      type: multiple_choice
      topic_code: "4.6"
      source: "Primary source: Alexis de Tocqueville, Democracy in America, vol. 1 (1835), trans. Henry Reeve, Project Gutenberg; general knowledge"
      points: 1
      stimulus: |
        "Amongst the novel objects that attracted my attention during my stay in the United States, nothing struck me more forcibly than the general equality of conditions. I readily discovered the prodigious influence which this primary fact exercises on the whole course of society, by giving a certain direction to public opinion, and a certain tenor to the laws; by imparting new maxims to the governing powers, and peculiar habits to the governed."

        — Alexis de Tocqueville, a French aristocrat who toured the United States in 1831–1832, Democracy in America, volume 1 (1835), translated by Henry Reeve
      prompt: |
        Review. A historian could best challenge Tocqueville's claim of "general equality of conditions" in the North by citing
      options:
        - "the absence of a hereditary nobility"
        - "the decline of established churches"
        - "the rise of wage labour and a widening gap between wealthy merchants and industrialists and urban workers"
        - "the expansion of the vote to most white men"
      option_explanations:
        - |
          The lack of nobility is one of the things Tocqueville meant by equality of conditions.
        - |
          Disestablishment of churches (Massachusetts was last, in 1833) is another sign of equality, not a challenge.
        - |
          Correct. The market revolution (Topic 4.6) concentrated wealth in northeastern cities while turning artisans into wage earners; studies of the period find inequality of wealth rising.
        - |
          Expanding suffrage supports, rather than challenges, his claim.
      answer: 2
      explanation: |
        Review of the market revolution's social effects (4.6). Political equality and economic equality are not the same thing.

    # ---- Stimulus set: Emerson (4.9, review 3.11)
    - slug: apush-u04-w12-q10
      type: multiple_choice
      topic_code: "4.9"
      source: "Primary source: Ralph Waldo Emerson, The American Scholar (1837), Project Gutenberg"
      points: 1
      stimulus: |
        "Our day of dependence, our long apprenticeship to the learning of other lands, draws to a close. The millions that around us are rushing into life cannot always be fed on the sere remains of foreign harvests. ... We have listened too long to the courtly muses of Europe."

        — Ralph Waldo Emerson, "The American Scholar," address to the Phi Beta Kappa Society at Harvard, 1837
      prompt: |
        Emerson's address is best understood as part of which broader development?
      options:
        - "The campaign to annex Canada"
        - "The effort to create a distinctly American literature, art and philosophy independent of European models"
        - "The movement to restore an established church in Massachusetts"
        - "The rise of scientific racism in American universities"
      option_explanations:
        - |
          The speech is about culture and learning, not territory.
        - |
