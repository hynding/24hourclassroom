    - slug: u02-w05-q16
      type: true_false
      topic_code: "2.B"
      source: general knowledge
      points: 1
      prompt: |
        True or false: Demonstrating an understanding of an audience means softening your claim until the audience is likely to agree with it.
      answer: false
      explanation: |
        False. Understanding an audience changes the route, not the destination. Douglass's claim is uncompromising; what he adapts is the premises, the scripture, the tone of sorrow and the order in which he reveals his subject. Softening the claim to please readers is pandering.

