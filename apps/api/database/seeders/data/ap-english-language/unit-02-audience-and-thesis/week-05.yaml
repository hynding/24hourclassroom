week: 5
unit: 2
title: Audience in Douglass's "What to the Slave Is the Fourth of July?"
topics: ["1.B", "2.B"]
texts:
  - author: Frederick Douglass
    title: What to the Slave Is the Fourth of July? (extract from the oration at Rochester, July 5, 1852, printed in My Bondage and My Freedom, 1855)
    year: 1852
    url: https://www.gutenberg.org/ebooks/202
guide: guides/week-05.md
guide_description: |
  The first week of Unit 2: what it means to understand an audience's beliefs, values and needs, and how a writer
  shows that understanding on the page. Frederick Douglass's 1852 Rochester oration as the case study: a speaker
  invited to celebrate independence who turns his listeners' own principles, scripture and pride into the ground of
  his accusation. Four close readings, a lesson on writing for a skeptical reader, a revised letter, misreadings,
  self-check.
flashcards_description: |
  30 cards on audience (primary and secondary audiences, beliefs, values and needs, common ground, shared
  premises), on writing for a skeptical reader, and on the occasion, moves and lines of Douglass's Fourth of July
  speech.

flashcards:
  - front: Skill 1.B → what it asks a reader to explain
    back: |
      How an argument shows that the writer understands the audience's beliefs, values or needs. Not just *who is the audience?* (that is 1.A) but *what in the text proves the writer knew them, and what does that knowledge do?*
    topic_code: "1.B"
  - front: Skill 2.B → what it asks a writer to do
    back: |
      Demonstrate an understanding of the audience in your own writing: choose evidence they will accept, start from premises they share, answer the objection they will raise, and pitch your tone so they keep reading.
    topic_code: "2.B"
  - front: Audience's beliefs vs values vs needs
    back: |
      Beliefs: what the audience holds to be true (the Declaration promises liberty to all). Values: what it holds to be good or important (patriotism, piety, fairness). Needs: what it wants or must have (safety, money, reassurance, a decision it can defend).
    topic_code: "1.B"
  - front: Primary (immediate) audience
    back: |
      The people a writer or speaker directly addresses: the listeners in the hall, the readers of the letter. Douglass's primary audience was the crowd at Corinthian Hall in Rochester.
    topic_code: "1.B"
  - front: Secondary (extended) audience
    back: |
      Readers or listeners beyond the immediate one whom the text also reaches or aims at: readers of a printed speech, the nation, posterity. Douglass's oration was printed as a pamphlet and later excerpted in his 1855 autobiography.
    topic_code: "1.B"
  - front: Sympathetic, neutral and skeptical audiences
    back: |
      A sympathetic audience already agrees and needs motivation; a neutral one needs information and reasons; a skeptical one needs its objections answered and its values respected. The same claim calls for different moves for each.
    topic_code: "2.B"
  - front: Common ground (in argument)
    back: |
      A belief or value the writer and the audience share, stated early so that the argument can build from it. Common ground is a premise, not a compliment: the argument must actually use it.
    topic_code: "2.B"
  - front: Shared premise → why it is powerful
    back: |
      If the audience already accepts the premise, it cannot reject the conclusion without rejecting itself. Douglass's premise (the Declaration's principles of “political freedom and of natural justice”) belonged to his listeners.
    topic_code: "1.B"
  - front: Unit 2 → its four weeks in one line each
    back: |
      Week 5: audience (Douglass). Week 6: reading a thesis and its preview of structure (Booker T. Washington). Week 7: writing a defensible thesis (Susan B. Anthony). Week 8: thesis, structure and audience together.
    topic_code: "1.B"
  - front: Douglass's Rochester oration → date and place
    back: |
      July 5, 1852, Corinthian Hall, Rochester, New York, at the invitation of the Rochester Ladies' Anti-Slavery Society. The Fourth fell on a Sunday that year, and Douglass spoke the next day.
    topic_code: "1.A"
  - front: Douglass's Rochester oration → the immediate audience
    back: |
      Several hundred listeners, most of them white Northerners, many of them already opposed to slavery. Sympathetic to the cause, they were also proud Americans celebrating independence, and that pride is what Douglass targets.
    topic_code: "1.B"
  - front: Douglass's Rochester oration → its exigence
    back: |
      An invitation to give an Independence Day address while slavery was legal in half the nation and the Fugitive Slave Act of 1850 made Northern citizens help return people who had escaped. Celebration amid bondage is the problem he names.
    topic_code: "1.A"
  - front: Frederick Douglass → who he was in 1852
    back: |
      A man who had escaped slavery in Maryland in 1838, the author of a celebrated Narrative (1845), an abolitionist orator, and editor of his own Rochester newspaper. His listeners knew his story, which gave him authority to speak “from the slave's point of view.”
    topic_code: "1.A"
  - front: Douglass's turn at "Fellow-Citizens--Pardon me"
    back: |
      In the full speech Douglass first praises the founders and the Declaration at length. Then he turns: “why am I called upon to speak here to-day?” The earlier praise is the common ground the rest of the speech stands on.
    topic_code: "1.B"
  - front: Douglass's opening questions → their target
    back: |
      “What have I, or those I represent, to do with your national independence?” The questions make the audience test its own assumption that the holiday belongs to everyone, and answer it for themselves before he does.
    topic_code: "1.B"
  - front: "\"Would to God, both for your sakes and ours\" → what it shows about audience"
    back: |
      Douglass frames the bad news as a loss to the listeners as well as to the enslaved. He speaks as someone who wishes he could celebrate, which keeps a sympathetic audience from hearing him as an enemy.
    topic_code: "1.B"
  - front: "\"I am not that man.\" → function"
    back: |
      After three questions about who could be so cold or selfish as to refuse gratitude, Douglass rules himself out. He shows he shares the audience's value (gratitude for liberty) before explaining why he cannot feel it.
    topic_code: "1.B"
  - front: "\"This Fourth of July is yours, not mine.\" → the pronouns"
    back: |
      The shift from “we” to “yours” and “mine” draws a line through the hall. The audience is made to feel, in grammar, the exclusion he is describing.
    topic_code: "1.B"
  - front: Douglass and Psalm 137
    back: |
      He quotes “By the rivers of Babylon”: captives asked by their captors to sing songs of Zion. The scripture his churchgoing audience knew casts the enslaved as captive Israel and the celebrating nation as Babylon.
    topic_code: "1.B"
  - front: "Douglass → \"My subject, then, fellow-citizens, is AMERICAN SLAVERY.\""
    back: |
      The moment the speech names its true subject, after the audience has been prepared to hear it. The capital letters in the printed text mark the stress; the “then” presents the subject as the only honest conclusion from what came before.
    topic_code: "3.A"
  - front: Douglass's "from the slave's point of view"
    back: |
      He announces the perspective he will take: “making his wrongs mine.” He gives up the comfortable position of a guest and claims the authority of the enslaved, which his own history makes credible.
    topic_code: "1.A"
  - front: Douglass's "false to the past, false to the present"
    back: |
      The tricolon ends “and solemnly binds herself to be false to the future.” The claim judges the nation by its own declarations; the evidence is the gap between what it professes and what it practises.
    topic_code: "3.A"
  - front: Douglass's imagined objector (the speech's audience anticipation)
    back: |
      “But I fancy I hear some one of my audience say” that abolitionists should “argue more, and denounce less.” Douglass voices his listeners' likely complaint about his tone before answering it, a direct sign that he knows them.
    topic_code: "1.B"
  - front: Douglass's appeal to the founders → praise or weapon?
    back: |
      Both. The praise is sincere and it is strategic: the more the audience honours the Declaration, the harder it is to excuse slavery. The audience's pride becomes his evidence.
    topic_code: "1.B"
  - front: Writing for a skeptical reader → the four moves
    back: |
      Start from a value you share; name their strongest concern fairly; give evidence they already trust; ask for something they can actually do. Each move shows understanding (2.B) rather than announcing it.
    topic_code: "2.B"
  - front: Pandering vs understanding an audience
    back: |
      Pandering tells the audience what it wants to hear and drops the claim. Understanding keeps the claim and finds the route by which this audience can accept it. Douglass never softens his claim; he chooses his route.
    topic_code: "2.B"
  - front: Tone chosen for an audience → the revision question
    back: |
      Ask: will this sentence make my reader keep reading or stop? Sarcasm, insults and sweeping blame make a skeptical reader stop. Firmness without contempt keeps the reader in the room.
    topic_code: "2.B"
  - front: Evidence chosen for an audience
    back: |
      The same claim can be supported by many facts; choose the ones this audience already respects. A school board responds to budgets and attendance figures; a parents' meeting to children's health and safety.
    topic_code: "2.B"
  - front: Concession to an audience → what it signals
    back: |
      Granting a reasonable point the audience holds (*the board is right that buses cost money*) signals fairness and that you have listened. It works only if you then answer the concern, not if you leave it standing.
    topic_code: "2.B"
  - front: AP Language Section I → audience questions on a draft
    back: |
      Writing questions often read: *The writer wants to appeal to an audience of ... Which choice best accomplishes this goal?* Pick the version that serves that audience's stated values or needs, even if another version sounds more impressive.
    topic_code: "2.B"

quiz:
  description: |
    22 questions · about 35 minutes · a set of seven questions on the opening of Douglass's Rochester oration, a
    four-question revision set on a student's letter to a school board, then questions on audience across the
    speech and in your own writing, with review of claims, evidence and the rhetorical situation from Unit 1.
    Multiple choice, select-all and true/false items are graded at once; the fill-in-the-blank items are matched
    automatically; the two short answers and the paragraph are graded by your teacher against the model answer and
    scoring notes.
  questions:
    # ---- Passage set: the turn in Douglass's oration
    - slug: u02-w05-q01
      type: multiple_choice
      topic_code: "1.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: &dg_open |
        *The following passage is from Frederick Douglass's oration delivered at Rochester, New York, on July 5, 1852, as printed in the appendix to his* My Bondage and My Freedom *(1855). Earlier in the speech Douglass had praised the nation's founders at length.*

        Fellow-Citizens--Pardon me, and allow me to ask, why am I called upon to speak here to-day? What have I, or those I represent, to do with your national independence? Are the great principles of political freedom and of natural justice, embodied in that Declaration of Independence, extended to us? and am I, therefore, called upon to bring our humble offering to the national altar, and to confess the benefits, and express devout gratitude for the blessings, resulting from your independence to us?

        Would to God, both for your sakes and ours, that an affirmative answer could be truthfully returned to these questions! Then would my task be light, and my burden easy and delightful. For who is there so cold that a nation’s sympathy could not warm him? Who so obdurate and dead to the claims of gratitude, that would not thankfully acknowledge such priceless benefits? Who so stolid and selfish, that would not give his voice to swell the hallelujahs of a nation’s jubilee, when the chains of servitude had been torn from his limbs? I am not that man. In a case like that, the dumb might eloquently speak, and the “lame man leap as an hart.”

        But, such is not the state of the case. I say it with a sad sense of the disparity between us. I am not included within the pale of this glorious anniversary! Your high independence only reveals the immeasurable distance between us. The blessings in which you this day rejoice, are not enjoyed in common. The rich inheritance of justice, liberty, prosperity, and independence, bequeathed by your fathers, is shared by you, not by me. The sunlight that brought life and healing to you, has brought stripes and death to me. This Fourth of July is *yours*, not mine. You may rejoice, I must mourn.

        [...]

        “By the rivers of Babylon, there we sat down. Yea! we wept when we remembered Zion. We hanged our harps upon the willows in the midst thereof. For there, they that carried us away captive, required of us a song; and they who wasted us required of us mirth, saying, Sing us one of the songs of Zion. How can we sing the Lord’s song in a strange land?

        [...]

        My subject, then, fellow-citizens, is AMERICAN SLAVERY. I shall see this day and its popular characteristics from the slave’s point of view. Standing there, identified with the American bondman, making his wrongs mine, I do not hesitate to declare, with all my soul, that the character and conduct of this nation never looked blacker to me than on this Fourth of July. Whether we turn to the declarations of the past, or to the professions of the present, the conduct of the nation seems equally hideous and revolting. America is false to the past, false to the present, and solemnly binds herself to be false to the future.
      prompt: |
        The questions in the first paragraph primarily serve to
      options:
        - |
          request information from the organisers about why Douglass was invited
        - |
          show that Douglass is unsure whether he should have accepted the invitation
        - |
          make the audience examine its own assumption that the holiday's blessings extend to everyone, before Douglass gives his answer
        - |
          accuse the audience directly of supporting slavery
      option_explanations:
        - |
          The questions are rhetorical: no one is expected to answer aloud, and Douglass answers them himself in the third paragraph. They are addressed to the listeners' assumptions, not to the organisers' reasons.
        - |
          Douglass does not express regret about speaking; he goes on to speak with great force. The questions create doubt in the audience, not in the speaker.
        - |
          Correct. Each question asks whether the Declaration's principles reach “us.” A listener who answers honestly must say no, so the audience reaches Douglass's conclusion a moment before he states it, which is harder to resist than being told.
        - |
          The questions stop short of accusation. The listeners are asked to think, and the direct charge against “the character and conduct of this nation” comes only later, once they have been prepared.
      answer: 2
      explanation: |
        Skill 1.B: a writer who knows the audience holds a comfortable assumption can ask questions that expose it. Rhetorical questions let listeners convict themselves.

    - slug: u02-w05-q02
      type: multiple_choice
      topic_code: "1.A"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: *dg_open
      prompt: |
        Which best describes the exigence that Douglass addresses in the passage?
      options:
        - |
          A nation celebrating its liberty while holding millions of people in slavery, and an invitation that asks a formerly enslaved man to join the celebration
        - |
          A recent decision by the organisers to stop celebrating the Fourth of July
        - |
          A dispute among abolitionists about whether to hold meetings on holidays
        - |
          A request from the audience that Douglass explain the history of the Declaration of Independence
      option_explanations:
        - |
          Correct. The problem that calls for the speech is the contradiction between the holiday and slavery, sharpened by the occasion itself: Douglass has been “called upon to speak here to-day” about “your national independence.”
        - |
          The passage presents a celebration in progress (“this glorious anniversary”); nothing suggests the holiday has been cancelled.
        - |
          No dispute among abolitionists appears in the passage. The tension is between the nation's celebration and the enslaved, not within a movement.
        - |
          Douglass refers to the Declaration's principles but does not narrate its history. The occasion asks him to celebrate, not to lecture on history.
      answer: 0
      explanation: |
        Review of 1.A: the exigence is the problem or occasion that prompts the text. Here the occasion (an Independence Day address) and the problem (slavery) collide, and that collision is the speech's reason for being.

    - slug: u02-w05-q03
      type: multiple_choice
      topic_code: "1.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: *dg_open
      prompt: |
        The second paragraph (“Would to God ... leap as an hart”) most clearly shows Douglass's understanding of his audience in that he
      options:
        - |
          flatters the listeners so that they will forgive his criticism later
        - |
          presents himself as someone who shares their value of gratitude for liberty and wishes he could join the celebration
        - |
          abandons his argument in order to recite scripture
        - |
          reminds the audience that he is a more eloquent speaker than they are
      option_explanations:
        - |
          The paragraph praises no one; it imagines a person “cold,” “obdurate” and “selfish” enough to refuse gratitude and denies being that person. That is a statement about his own values, not flattery of theirs.
        - |
          Correct. By saying his task “would be light” if the answer were yes, and that only a cold or selfish man would refuse thanks, Douglass shows he values what his audience values. His refusal will therefore read as forced on him by the facts, not as ingratitude.
        - |
          The biblical phrase “lame man leap as an hart” serves the argument: it pictures the joy he would feel if freedom were real for him. The argument continues directly in the next paragraph.
        - |
          The “dumb might eloquently speak” describes what anyone would do if the chains were gone; it is about the occasion's potential joy, not a boast about his own skill.
      answer: 1
      explanation: |
        A speaker about to refuse what an audience values can first show that he values it too. The refusal then reads as principle, not as contempt.

    - slug: u02-w05-q04
      type: multiple_choice
      topic_code: "1.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: *dg_open
      prompt: |
        In the third paragraph, the repeated contrast between “you” and “me” (as in “This Fourth of July is *yours*, not mine”) primarily serves to
      options:
        - |
          suggest that Douglass dislikes the members of his audience personally
        - |
          show that Douglass is confused about whom he is addressing
        - |
          indicate that the audience is made up of slaveholders
        - |
          make the listeners feel, through the grammar of the sentences, the exclusion from the nation's blessings that Douglass is describing
      option_explanations:
        - |
          The paragraph opens “I say it with a sad sense of the disparity between us”: sorrow, not personal dislike. The division is political, drawn by slavery, not by Douglass's feelings toward individuals.
        - |
          Douglass addresses the same listeners throughout (“Fellow-Citizens,” “you”). The pronouns are deliberate and consistent, not confused.
        - |
          The audience in Rochester, a free state, was largely antislavery. “You” means free white Americans who enjoy what “your fathers” bequeathed, not slaveholders.
        - |
          Correct. Up to now a holiday audience might hear “we” and “our” as including everyone. Douglass splits the pronouns (“shared by you, not by me”), so the audience hears itself on one side of a line it had not noticed.
      answer: 3
      explanation: |
        Pronouns are an audience tool. Who is “we,” who is “you,” and when a writer moves from one to the other can carry an argument by itself.

    - slug: u02-w05-q05
      type: multiple_choice
      topic_code: "3.A"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: *dg_open
      prompt: |
        In the last paragraph, Douglass supports his claim that the nation's conduct “never looked blacker” chiefly by pointing to
      options:
        - |
          statistics on the number of people enslaved in the United States
        - |
          the testimony of other abolitionists
        - |
          the contradiction between the nation's own declarations and professions and its conduct
        - |
          predictions about the future collapse of the Union
      option_explanations:
        - |
          The passage contains no figures. This claim rests on a different kind of evidence.
        - |
          No other abolitionist is quoted or named in the paragraph; Douglass speaks in his own voice, “identified with the American bondman.”
        - |
          Correct. “Whether we turn to the declarations of the past, or to the professions of the present,” the conduct is “hideous.” The evidence is the measure of the nation against its own words, which is why “false” is the key term.
        - |
          “Solemnly binds herself to be false to the future” describes continuing hypocrisy, not a forecast of collapse. The claim is about character, not about political consequences.
      answer: 2
      explanation: |
        Review of 3.A: identify the claim, then ask what kind of evidence supports it. Here the evidence is internal to the audience's own creed, which is also why it suits this audience.

    - slug: u02-w05-q06
      type: multiple_choice
      topic_code: "1.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: *dg_open
      prompt: |
        Douglass's quotation of the psalm beginning “By the rivers of Babylon” is especially suited to his audience because it
      options:
        - |
          introduces a text his listeners would not have known, which makes him seem learned
        - |
          draws on scripture familiar to a churchgoing audience to cast the enslaved as captives asked to sing for their captors on a day of celebration
        - |
          proves that slavery was condemned by law in ancient times
        - |
          changes the subject from slavery to religious history
      option_explanations:
        - |
          The force of the allusion depends on its being familiar. Psalm 137 was well known to a Protestant audience in 1852; Douglass needs no explanation to make it land.
        - |
          Correct. The psalm's captives are told to “Sing us one of the songs of Zion.” The parallel to Douglass, asked to celebrate a nation that enslaves his people, is exact, and it comes in the audience's own sacred language.
        - |
          The psalm is a lament, not a legal record. It supplies an analogy and an emotional frame, not legal proof.
        - |
          The psalm keeps the subject in place: the very next paragraph names “AMERICAN SLAVERY” as the subject. The allusion frames the present, not the past.
      answer: 1
      explanation: |
        Skill 1.B often turns on allusion: a reference to something the audience reveres lets the writer borrow its authority and make the listeners recognise themselves in an unflattering role.

    - slug: u02-w05-q07
      type: multi_select
      topic_code: "1.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 3
      partial_credit: true
      stimulus: *dg_open
      prompt: |
        Which choices in the passage show Douglass building on beliefs or values his audience already held? Select all that apply.
      options:
        - |
          He measures the nation against the principles “embodied in that Declaration of Independence.”
        - |
          He quotes scripture his listeners would recognise and revere.
        - |
          He concedes that slavery may be justified on economic grounds.
        - |
          He speaks of the gap between himself and his listeners “with a sad sense of the disparity” rather than with contempt.
      option_explanations:
        - |
          Correct. The Declaration was the audience's own pride on the Fourth of July. Using its principles as the standard means the listeners must either accept his judgment or disown their creed.
        - |
          Correct. Psalm 137 and the phrase “lame man leap as an hart” come from the Bible his audience read; scripture lends his charge an authority they accept.
        - |
          Douglass makes no such concession anywhere in the passage. He calls the nation's conduct “hideous and revolting”; he grants slavery no justification.
        - |
          Correct. Sorrow rather than scorn respects listeners who thought of themselves as friends of freedom; they can hear the charge without being driven out of the room.
      answer: [0, 1, 3]
      explanation: |
        The strongest audience moves are premises, not compliments: the audience's own documents, scripture and sense of fairness become the ground of the argument.

    # ---- Revision set: a student's letter to a school board
    - slug: u02-w05-q08
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: &w05_letter |
        *The following is a draft of a letter a student is writing to the members of her district's school board, who must approve any change to the school day and who have said that the budget is their main concern.*

        (1) Our high school day begins at 7:15 a.m., earlier than at any other school in the county. (2) I am writing to ask the board to move the start time to 8:30 a.m. beginning next fall. (3) Teenagers' sleep patterns shift later during adolescence, and students who must wake before six often arrive tired. (4) Last year, the school nurse recorded more than four hundred visits from students who reported exhaustion or headaches during first period. (5) Later start times have been shown to improve attendance. (6) Two neighbouring districts that made this change kept their bus costs level by reordering routes so that elementary schools start first. (7) A later start would also give students time to eat breakfast at home or at school. (8) Maybe the board just doesn't care about how students feel. (9) I hope you will consider this proposal at your next meeting.
      prompt: |
        The writer wants to open the letter in a way that establishes common ground with the board members before stating her request. Which sentence, placed before sentence 1, would best accomplish this goal?
      options:
        - |
          Like every member of this board, I want our students to arrive at school ready to learn.
        - |
          I have always wanted to write a letter to the school board.
        - |
          Everyone knows that adults do not understand what teenagers go through.
        - |
          Early mornings are the worst part of my day, and most of my friends agree.
      option_explanations:
        - |
          Correct. The sentence names a goal the board certainly holds (students ready to learn) and puts the writer on the same side, so the request that follows reads as a way to reach a shared goal.
        - |
          This sentence is about the writer, not about anything she and the board share. It delays the letter without building any common ground.
        - |
          This sentence opens with a charge against the very adults she is addressing. It divides writer and audience at the outset, the opposite of common ground.
        - |
          A personal complaint gives the board no reason to act; it frames the request as a matter of student comfort rather than a shared aim.
      answer: 0
      explanation: |
        Skill 2.B on a draft: common ground is a value the audience holds that the argument can build on. Look for the option that names the audience's goal, not the writer's feelings.

    - slug: u02-w05-q09
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *w05_letter
      prompt: |
        The writer wants to address the board's main concern directly. Which change would best accomplish this goal?
      options:
        - |
          Delete sentence 4, because the nurse's records are not about money.
        - |
          Add a sentence after sentence 9 thanking the board for its time.
        - |
          Move sentence 7 so that it follows sentence 2.
        - |
          Move sentence 6 so that it follows sentence 2, and add that the change could be made without new spending.
      option_explanations:
        - |
          The nurse's records support the claim that students are exhausted, which is the reason for the change. Removing them weakens the argument without addressing the budget.
        - |
          Thanks are courteous, but they say nothing about cost. The board's stated concern would still be unanswered.
        - |
          Breakfast is a benefit to students, not an answer to the budget question. Moving it earlier stresses a point the board has not said it cares most about.
        - |
          Correct. Sentence 6 is the only one that speaks to money (bus costs kept level). Placing it right after the request, and stating the conclusion about cost, meets the board's main concern before it can become the reason to say no.
      answer: 3
      explanation: |
        When the prompt names the audience's concern, the right revision is the one that answers that concern, early and explicitly.

    - slug: u02-w05-q10
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: *w05_letter
      prompt: |
        The writer wants to support the claim in sentence 5 with specific evidence. Which sentence, added after sentence 5, would best accomplish this goal?
      options:
        - |
          Many people believe that sleep is important for health.
        - |
          In one neighbouring district, average first-period attendance rose from 88 to 94 percent in the year after the change.
        - |
          I would definitely come to school more often if it started later.
        - |
          Attendance is something that every school should care about.
      option_explanations:
        - |
          The sentence is a general belief about health, not evidence about attendance, and “many people believe” adds no specific support.
        - |
          Correct. A specific figure from a comparable district supports the claim about attendance directly and gives the board a number it can weigh.
        - |
          One student's prediction about herself is weak evidence for a district-wide claim, and it invites the board to see the request as self-interested.
        - |
          The sentence restates why attendance matters but offers no evidence that later start times improve it.
      answer: 1
      explanation: |
        Review of 4.A: evidence must be specific and must support the exact claim. “Have been shown” needs a showing.

