    - slug: u02-w05-q19
      type: multiple_choice
      topic_code: "1.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      prompt: |
        Later in the speech Douglass says, “But I fancy I hear some one of my audience say,” that he and other abolitionists should “argue more, and denounce less.” This move most clearly shows that Douglass
      options:
        - |
          has been interrupted by a heckler and must respond on the spot
        - |
          anticipates an objection his listeners are likely to hold about his tone and chooses to answer it openly
        - |
          agrees that his speech has been too harsh and will now change its tone
        - |
          is quoting a newspaper review of an earlier speech
      option_explanations:
        - |
          “I fancy I hear” signals an imagined voice. Douglass is voicing a likely thought, not reporting a real interruption.
        - |
          Correct. Many sympathetic Northerners did think abolitionists too fierce. By putting the complaint into words and answering it, Douglass shows he knows his audience and keeps the objection from working silently against him.
        - |
          Douglass answers the objection by insisting that “where all is plain there is nothing to be argued,” and the speech grows fiercer, not milder.
        - |
          No review or publication is named; the voice is “some one of my audience,” an imagined listener in the hall.
      answer: 1
      explanation: |
        Voicing the audience's objection is one of the clearest signs of 1.B. Ask what objection is being anticipated and why this audience would hold it.

    - slug: u02-w05-q20
      type: short_answer
      topic_code: "1.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 2
      prompt: |
        In one or two sentences, identify one specific choice in the opening of Douglass's oration and explain how it shows his understanding of his audience's beliefs, values or needs.
      answer: |
        Douglass judges the nation by “the great principles of political freedom and of natural justice, embodied in that Declaration of Independence,” the document his audience was gathered to celebrate. Because the listeners revere the Declaration, they cannot dismiss his charge without disowning their own creed.
      explanation: |
        1 point: a specific, accurate choice (the rhetorical questions, the appeal to the Declaration, “Would to God, both for your sakes and ours,” “I am not that man,” the pronoun split, the psalm, the imagined objector). 1 point: an explanation linking the choice to a named belief, value or need of the audience (patriotism, piety, gratitude, fairness, a wish to see themselves as friends of liberty). Naming a device without the audience link earns at most 1.

