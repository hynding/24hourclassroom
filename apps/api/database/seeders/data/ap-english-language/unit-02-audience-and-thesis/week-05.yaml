    - slug: u02-w05-q22
      type: long_answer
      topic_code: "1.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 4
      prompt: |
        Write one well-developed analytical paragraph (about 150-200 words). Make a claim about how Douglass uses his audience's own beliefs or values to advance his argument in the opening of the oration, support it with at least two short quotations from different parts of the passage, and explain how each quotation supports your claim.
      answer: |
        Claim: Douglass turns his listeners' patriotism and piety into the grounds of his accusation, so that they cannot reject his conclusion without rejecting themselves. Evidence 1: he asks whether “the great principles of political freedom and of natural justice, embodied in that Declaration of Independence,” are “extended to us.” Commentary: the audience came to honour those principles; by making them the standard, Douglass forces listeners to see slavery as a betrayal of what they celebrate, not as a regional custom. Evidence 2: he quotes the captives “by the rivers of Babylon” who are asked to sing for their captors. Commentary: the scripture his churchgoing audience knew casts the enslaved as Israel in exile and the celebrating nation as Babylon, an identity no listener would accept willingly. Link: every standard he uses belongs to the audience, which is why the charge that “America is false to the past” lands.
      explanation: |
        4 points. Claim (1): an arguable claim about how Douglass uses a belief or value of his audience, not just “Douglass understands his audience.” Evidence (1): at least two accurate, short quotations from different parts of the passage, smoothly introduced. Commentary (2): 2 points if each quotation is explained in terms of the audience and the claim (what the audience believes, and how the words use that belief); 1 point if commentary is present but thin, only paraphrases, or explains only one quotation; 0 if the paragraph only summarises. Paragraphs that identify devices without connecting them to the audience earn at most 3.
