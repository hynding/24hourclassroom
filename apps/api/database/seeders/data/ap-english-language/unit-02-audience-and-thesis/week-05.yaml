    # ---- Across the speech and the skill
    - slug: u02-w05-q12
      type: multiple_choice
      topic_code: "1.A"
      source: general knowledge
      points: 1
      prompt: |
        Douglass delivered his oration to listeners in a Rochester hall in 1852, but it was printed as a pamphlet that year and excerpted in his autobiography in 1855. Which statement best describes these later readers?
      options:
        - |
          They are the speech's exigence.
        - |
          They are the speaker, since they read the words aloud to themselves.
        - |
          They replace the original audience, which no longer matters to analysis.
        - |
          They are a secondary audience the speech also reaches, and analysis can ask how the text works for them as well as for the listeners in the hall.
      option_explanations:
        - |
          The exigence is the problem or occasion that prompts a text (slavery amid celebration), not a group of readers.
        - |
          The speaker is Douglass. Reading a speech does not make a reader its speaker; the reader remains part of its audience.
        - |
          The immediate audience still explains many of the speech's choices, such as “Fellow-Citizens” and “your fathers.” Later readers are added, not substituted.
        - |
          Correct. A printed speech has an immediate audience and a wider one. Strong analysis notices both, and notices choices aimed at each.
      answer: 3
      explanation: |
        Review of 1.A: audience is plural more often than not. Name the immediate audience first, then any wider one the text reaches.

    - slug: u02-w05-q13
      type: multiple_choice
      topic_code: "4.A"
      source: general knowledge
      points: 1
      prompt: |
        A student writes: *Douglass understands his audience. He says, “This Fourth of July is yours, not mine.” This shows he understands his audience.* What would most improve this paragraph?
      options:
        - |
          Commentary that explains how the split between “yours” and “mine” works on listeners who thought the holiday included everyone
        - |
          A second quotation placed immediately after the first, with no explanation between them
        - |
          A sentence summarising the rest of the speech
        - |
          Replacing the quotation with a longer one from the same paragraph
      option_explanations:
        - |
          Correct. The paragraph has a claim and evidence, but its commentary only repeats the claim. Explaining what the pronouns do to this audience is what turns the quotation into proof.
        - |
          Stacking quotations without commentary makes the paragraph longer but no more convincing; the missing step is explanation, not more evidence.
        - |
          Summary is not commentary. It moves away from the quotation instead of explaining it.
        - |
          A longer quotation would still need explaining. The problem is the absence of commentary, not the length of the evidence.
      answer: 0
      explanation: |
        Review of 4.A: claim, evidence, commentary. Commentary answers “how does this evidence prove this claim?” A sentence that restates the claim is not commentary.

    - slug: u02-w05-q14
