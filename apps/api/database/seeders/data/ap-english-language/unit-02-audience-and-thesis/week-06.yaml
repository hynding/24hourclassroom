          Many strong arguments never announce their thesis. Skill 3.B asks you to describe the thesis whether it is stated or implied.
        - |
          Correct. A figurative command repeated to each audience, and an image that sums up the bargain, carry the main claim clearly enough to describe it: progress through economic cooperation where one already lives.
        - |
          The opening sentence (“One-third of the population of the South is of the Negro race”) is a fact that serves the argument; it is not the claim being defended. Thesis placement varies.
