    - slug: u02-w06-q20
      type: short_answer
      topic_code: "3.B"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 2
      prompt: |
        In one sentence, state the overarching thesis of Washington's address in your own words. In a second sentence, identify one feature of the speech that signals how the argument is organised.
      answer: |
        Washington argues that the South will prosper only if Black Southerners build on labour and skill where they are and white Southerners employ and educate them, with social separation accepted in exchange for economic cooperation. The repeated command to “cast down your bucket where you are,” addressed first to his own race and then to the white race, shows that the speech is organised by audience.
      explanation: |
        1 point: a thesis in the student's own words that covers the whole address (both audiences, economic cooperation, ideally the social-separation bargain); a summary of one section only, or a restatement of the parable without explaining it, earns 0 for this point. 1 point: a specific structural signal (the repeated command, the parallel openings “To those of my race” and “To those of the white race,” the fingers-and-hand image) with a brief statement of what it shows about the organisation.

    - slug: u02-w06-q21
      type: short_answer
      topic_code: "3.B"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 2
      prompt: |
        Near the end of the address Washington says, “The opportunity to earn a dollar in a factory just now is worth infinitely more than the opportunity to spend a dollar in an opera-house.” In two or three sentences, explain how this sentence restates the speech's thesis and why the contrast suits it.
      answer: |
        The sentence restates the thesis that economic progress must come before social equality: earning (work, skill, a place in the economy) matters more “just now” than spending in places of social privilege. The contrast between a factory and an opera-house makes the abstract bargain concrete and memorable, and “just now” signals that Washington presents the priority as a matter of timing rather than a permanent surrender.
      explanation: |
        1 point: links the sentence to the thesis (economic advancement before social or civil equality, building from where one is). 1 point: explains the effect of the contrast (concrete, memorable, ranks two kinds of opportunity) or of “just now.” Paraphrase of the sentence without connecting it to the thesis earns at most 1.

    - slug: u02-w06-q22
      type: long_answer
      topic_code: "3.B"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 4
      prompt: |
        Write one well-developed analytical paragraph (about 150-200 words). Make a claim about how the parable of the ship establishes both the thesis and the structure of Washington's address. Support it with at least two short quotations from different parts of the speech and explain how each supports your claim.
      answer: |
        Claim: Washington's parable gives his divided audience one command to remember and one pattern to follow, so the thesis and the structure arrive together. Evidence 1: the friendly vessel's answer, repeated four times: “Cast down your bucket where you are.” Commentary: the sailors die of thirst while fresh water lies beneath them; the image makes the thesis (seek progress where you already are) concrete before Washington states it plainly. Evidence 2: the applications “To those of my race” and “To those of the white race,” each ending in the same command. Commentary: by giving the identical instruction to each audience in turn, Washington organises the speech as a pair of parallel appeals and implies that both groups need the same thing, which prepares for the image that sums it up, races “as separate as the fingers, yet one as the hand.” Link: the parable is the speech in miniature.
      explanation: |
        4 points. Claim (1): an arguable claim about how the parable establishes thesis and structure, not a summary of the story. Evidence (1): at least two accurate, short quotations from different parts of the address. Commentary (2): 2 points if the commentary explains both how the parable states the main claim and how its repetition or application organises the speech; 1 point if commentary addresses only thesis or only structure, or only paraphrases; 0 if the paragraph only summarises. A paragraph that retells the parable without connecting it to the thesis earns at most 2.
