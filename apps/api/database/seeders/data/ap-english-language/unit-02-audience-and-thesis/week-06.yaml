week: 6
unit: 2
title: Thesis and Structure in Booker T. Washington's Atlanta Exposition Address
topics: ["3.B"]
texts:
  - author: Booker T. Washington
    title: Atlanta Exposition Address (delivered September 18, 1895; printed in Up from Slavery, 1901, chapter XIV)
    year: 1895
    url: https://www.gutenberg.org/ebooks/2376
guide: guides/week-06.md
guide_description: |
  How to find the overarching thesis of an argument, whether it is stated outright, built into an image or left
  implicit, and how a thesis can signal the structure that follows. Booker T. Washington's 1895 Atlanta Exposition
  address as the case study: a parable whose single command becomes the speech's claim and, applied first to one
  audience and then to another, its plan. Close readings, a lesson on finding the thesis in a draft, misreadings,
  self-check.
flashcards_description: |
  30 cards on the overarching thesis (explicit, implicit and figurative), on how a thesis previews structure, on
  topic versus thesis, and on the occasion, audiences, parable and key lines of Washington's Atlanta address.

flashcards:
  - front: Skill 3.B → what it asks a reader to do
    back: |
      Identify and describe the overarching thesis of an argument, and any sign it gives of how the argument will be organised. Two questions: what is the whole text trying to prove, and how does the thesis tell you the route?
    topic_code: "3.B"
  - front: Overarching thesis (AP Language definition)
    back: |
      The main claim the whole argument defends, the one that the other claims serve. It must be arguable: a reasonable person could disagree with it.
    topic_code: "3.B"
  - front: Topic vs thesis
    back: |
      A topic names a subject (the future of the South). A thesis makes a claim about it (the South will prosper only if Black and white Southerners cooperate economically). If you can put “I believe that” in front of it and it still says something, it may be a thesis.
    topic_code: "3.B"
  - front: Explicit (stated) thesis
    back: |
      A thesis stated outright in a sentence or two, often near the start, sometimes at the end. Easy to quote, and it often names the parts of the argument.
    topic_code: "3.B"
  - front: Implicit (implied) thesis
    back: |
      A thesis that is never stated in one sentence but is clear from the whole text. To describe it, write the sentence the writer did not, and test it against every section.
    topic_code: "3.B"
  - front: Figurative thesis
    back: |
      A thesis delivered as an image, parable or analogy that the argument then explains and applies. Washington's “Cast down your bucket where you are” is the model case.
    topic_code: "3.B"
  - front: Thesis that previews structure → what it looks like
    back: |
      It names the parts of the argument in the order they will come, or it implies a pattern (two audiences, three reasons, a problem then a solution). The preview is a promise the body must keep.
    topic_code: "3.B"
  - front: Delayed thesis → when writers use it
    back: |
      When the audience might resist the claim if it came first, the writer builds common ground, evidence or a story before stating it. Douglass's “My subject, then” is a delayed statement of subject.
    topic_code: "3.B"
  - front: Thesis test → the one-sentence summary check
    back: |
      If you can summarise the whole text in one sentence that every section supports, you have found the thesis. If a section does not fit your sentence, revise the sentence.
    topic_code: "3.B"
  - front: Thesis vs a claim within a paragraph
    back: |
      A paragraph's claim (topic sentence) supports one step of the argument. The overarching thesis is what all the paragraph claims add up to. On the exam, “the main claim of the passage” means the thesis.
    topic_code: "3.A"
  - front: Atlanta Exposition address → date, place, occasion
    back: |
      September 18, 1895, at the opening of the Cotton States and International Exposition in Atlanta, Georgia, a fair meant to display the economic progress of the South to the nation and the world.
    topic_code: "1.A"
  - front: Booker T. Washington → who he was in 1895
    back: |
      Born into slavery in Virginia, educated at Hampton Institute, and from 1881 the head of Tuskegee Institute in Alabama, a school for Black students built around industrial and agricultural training.
    topic_code: "1.A"
  - front: Atlanta address → the audiences in the hall
    back: |
      A mixed and partly hostile crowd: white Southern officials and businessmen, Black Southerners, Northern visitors and philanthropists, and the press. Washington had been warned that some came hoping he would fail.
    topic_code: "1.B"
  - front: Atlanta address → its exigence
    back: |
      A Black speaker invited, for the first time, to share the platform at a major Southern exposition, three decades after emancipation, at a moment of disfranchisement and racial violence. He had to address all his audiences at once.
    topic_code: "1.A"
  - front: “Cast down your bucket where you are” → the parable
    back: |
      A ship lost at sea signals that its crew is dying of thirst; a friendly vessel answers four times, “Cast down your bucket where you are.” The water is fresh: they are at the mouth of the Amazon. The help they sought far away was already beneath them.
    topic_code: "3.B"
  - front: Washington's bucket parable → why it works as a thesis
    back: |
      Its single command is the claim: seek progress where you already are, not elsewhere. Everything that follows applies the command, so the image holds the speech together.
    topic_code: "3.B"
  - front: Washington's “To those of my race” → the structural signal
    back: |
      The first application of the parable, addressed to Black listeners: stay in the South and build on agriculture, trades and commerce. It tells the audience that the speech will apply the command to a group at a time.
    topic_code: "3.B"
  - front: Washington's “To those of the white race” → the structural signal
    back: |
      The second application, addressed to white employers: hire the Black workers you know rather than recruiting immigrants. The repeated injunction marks the speech's second movement.
    topic_code: "3.B"
  - front: Washington's fingers-and-hand sentence
    back: |
      “In all things that are purely social we can be as separate as the fingers, yet one as the hand in all things essential to mutual progress.” The compromise of the whole speech in one image: social separation, economic cooperation.
    topic_code: "3.B"
  - front: Washington's “dignity in tilling a field as in writing a poem”
    back: |
      A claim supporting the thesis for his Black listeners: progress begins with labour and skill, “at the bottom of life,” not with politics or ornament.
    topic_code: "3.A"
  - front: Washington's appeal to employers' interest
    back: |
      He reminds white listeners of workers “whose habits you know” and who worked “without strikes and labour wars.” The appeal is to economic self-interest and to fear of unfamiliar immigrant labour.
    topic_code: "1.B"
  - front: Washington's “one-third” figures
    back: |
      Black Southerners are a third of the South's population, so they will be a third of its “ignorance and crime” or a third of its “intelligence and progress.” The figure turns the thesis into a choice the white audience must make.
    topic_code: "3.A"
  - front: Washington's “opera-house” sentence
    back: |
      “The opportunity to earn a dollar in a factory just now is worth infinitely more than the opportunity to spend a dollar in an opera-house.” Economic progress first, social equality later: the thesis restated as a contrast.
    topic_code: "3.B"
  - front: Washington's conclusion → how it returns to the thesis
    back: |
      It repeats the pledge of cooperation, then reaches “far above and beyond material benefits” to justice and obedience to law, “a new heaven and a new earth.” The thesis widens from economics to a moral hope.
    topic_code: "3.B"
  - front: “Atlanta Compromise” → where the name comes from
    back: |
      Critics, including W. E. B. Du Bois in 1903, used the name for the bargain they heard in the speech: acceptance of social separation in exchange for economic opportunity. The name is itself a reading of the thesis.
    topic_code: "1.A"
  - front: Washington on audiences (Up from Slavery)
    back: |
      “No two audiences are exactly alike.” In the chapter before the address he describes preparing for each one separately and aiming at “the heart of each individual audience.”
    topic_code: "1.B"
  - front: Finding the thesis in a draft (revision questions)
    back: |
      Look for the sentence that every other sentence supports, usually at the end of the introduction. A sentence that states a fact, asks a question or announces a topic is not the thesis.
    topic_code: "3.B"
  - front: Thesis placement → the introduction's last sentence
    back: |
      A common choice in student essays because the introduction can build context and then state the claim. It is a convention, not a rule; professional arguments may delay the thesis to the end.
    topic_code: "3.B"
  - front: “The main idea of the passage” vs “the main claim”
    back: |
      Main idea can be a topic or summary; main claim must be arguable. AP stems that say “primary purpose” or “central claim” want the thesis, phrased as something the writer is trying to prove.
    topic_code: "3.B"
  - front: Washington's tone toward his white audience
    back: |
      Conciliatory and reassuring: “patient, faithful, law-abiding, and unresentful.” Students debate whether this is strategic tact before a hostile audience or a surrender of rights; either reading must be argued from the text.
    topic_code: "1.B"

quiz:
  description: |
    22 questions · about 35 minutes · a set of seven questions on Washington's Atlanta address, a four-question
    revision set on a student's introduction, then questions on finding and describing a thesis, with review of
    audience, claims, evidence and the rhetorical situation. Multiple choice, select-all and true/false items are
    graded at once; the fill-in-the-blank items are matched automatically; the two short answers and the paragraph
    are graded by your teacher against the model answer and scoring notes.
  questions:
    # ---- Passage set: Washington's Atlanta address
    - slug: u02-w06-q01
      type: multiple_choice
      topic_code: "1.B"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 1
      stimulus: &bw_atlanta |
        *The following passage is from the address Booker T. Washington delivered at the opening of the Cotton States and International Exposition in Atlanta on September 18, 1895, as printed in his autobiography* Up from Slavery *(1901).*

        One-third of the population of the South is of the Negro race. No enterprise seeking the material, civil, or moral welfare of this section can disregard this element of our population and reach the highest success. I but convey to you, Mr. President and Directors, the sentiment of the masses of my race when I say that in no way have the value and manhood of the American Negro been more fittingly and generously recognized than by the managers of this magnificent Exposition at every stage of its progress. It is a recognition that will do more to cement the friendship of the two races than any occurrence since the dawn of our freedom.

        [...]

        A ship lost at sea for many days suddenly sighted a friendly vessel. From the mast of the unfortunate vessel was seen a signal, "Water, water; we die of thirst!" The answer from the friendly vessel at once came back, "Cast down your bucket where you are." A second time the signal, "Water, water; send us water!" ran up from the distressed vessel, and was answered, "Cast down your bucket where you are." And a third and fourth signal for water was answered, "Cast down your bucket where you are." The captain of the distressed vessel, at last heading the injunction, cast down his bucket, and it came up full of fresh, sparkling water from the mouth of the Amazon River. To those of my race who depend on bettering their condition in a foreign land or who underestimate the importance of cultivating friendly relations with the Southern white man, who is their next-door neighbour, I would say: "Cast down your bucket where you are"--cast it down in making friends in every manly way of the people of all races by whom we are surrounded.

        Cast it down in agriculture, mechanics, in commerce, in domestic service, and in the professions. [...] No race can prosper till it learns that there is as much dignity in tilling a field as in writing a poem. It is at the bottom of life we must begin, and not at the top. Nor should we permit our grievances to overshadow our opportunities.

        To those of the white race who look to the incoming of those of foreign birth and strange tongue and habits of the prosperity of the South, were I permitted I would repeat what I say to my own race: "Cast down your bucket where you are." Cast it down among the eight millions of Negroes whose habits you know, whose fidelity and love you have tested in days when to have proved treacherous meant the ruin of your firesides. Cast down your bucket among these people who have, without strikes and labour wars, tilled your fields, cleared your forests, builded your railroads and cities, and brought forth treasures from the bowels of the earth, and helped make possible this magnificent representation of the progress of the South. [...] In all things that are purely social we can be as separate as the fingers, yet one as the hand in all things essential to mutual progress.
      prompt: |
        Given that the managers of the Exposition were among his listeners, the opening paragraph's praise of them most likely serves to
      options:
        - |
          suggest that the Exposition has already solved the problems Washington will discuss
        - |
          establish goodwill with the white officials who invited him, presenting the invitation itself as evidence that the two races can cooperate
        - |
          show that Washington is more interested in the Exposition than in his own race
        - |
          criticise earlier expositions that excluded Black exhibitors
      option_explanations:
        - |
          Washington calls the recognition a beginning (“will do more to cement the friendship”), not a solution. The rest of the passage lays out what still has to be done.
        - |
          Correct. The officials who invited him were part of his immediate audience. Praising their recognition both secures their goodwill and makes the occasion itself the first piece of evidence for the cooperation he will argue for.
        - |
          He speaks as one conveying “the sentiment of the masses of my race”; the praise is offered on their behalf, not instead of them.
        - |
          No earlier exposition is mentioned. The paragraph's comparison is with “any occurrence since the dawn of our freedom,” and it is wholly positive.
      answer: 1
      explanation: |
        Review of 1.B: openings often tell you whom the speaker most needs to win. Here the praise both thanks and argues.

    - slug: u02-w06-q02
      type: multiple_choice
      topic_code: "3.B"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 1
      stimulus: *bw_atlanta
      prompt: |
        Which best describes the function of the story of the ship in the second paragraph?
      options:
        - |
          It provides a historical example of a disaster at sea that Washington witnessed.
        - |
          It entertains the audience before the serious part of the speech begins.
        - |
          It introduces a counterargument that Washington will go on to refute.
        - |
          It delivers the speech's central claim as a figurative command, which the rest of the passage explains and applies.
      option_explanations:
        - |
          Nothing marks the story as Washington's experience or as history; it is a parable, told to carry a lesson.
        - |
          The story is not a diversion. Its command is repeated throughout the passage and applied directly to both audiences.
        - |
          The parable states Washington's own position. The view he resists (bettering one's condition “in a foreign land”) appears only in the application that follows.
        - |
          Correct. “Cast down your bucket where you are” is the thesis in figurative form: seek progress where you are. The following paragraphs apply the command to agriculture, the trades and then to the white audience.
      answer: 3
      explanation: |
        Skill 3.B: a thesis can be an image. Look for the sentence or figure that every later section returns to.

    - slug: u02-w06-q03
      type: multiple_choice
      topic_code: "3.B"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 1
      stimulus: *bw_atlanta
      prompt: |
        The phrases “To those of my race” and “To those of the white race” most clearly indicate that the argument is organised
      options:
        - |
          by audience, applying the same central command first to Black listeners and then to white listeners
        - |
          chronologically, from the years of slavery to the present
        - |
          as a series of objections and replies
        - |
          from the least important point to the most important
      option_explanations:
        - |
          Correct. Each phrase opens a section, and each section repeats “Cast down your bucket where you are” for a different part of the audience. The thesis carries its own plan: one command, two applications.
        - |
          The passage does not move through history; it stays in the present and future of the South, with only brief glances backward.
        - |
          No objections are voiced and answered in these sections; each one applies the injunction rather than defending it against an opponent.
        - |
          The two applications are parallel, not ranked; the repetition of the same command treats them as equal halves of one argument.
      answer: 0
      explanation: |
        Structural signals are often repeated phrases. When the same command is addressed to two groups in turn, the speech is organised by audience.

    - slug: u02-w06-q04
      type: multiple_choice
      topic_code: "3.A"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 1
      stimulus: *bw_atlanta
      prompt: |
        In the third paragraph, the sentence “No race can prosper till it learns that there is as much dignity in tilling a field as in writing a poem” functions as
      options:
        - |
          a piece of statistical evidence about agricultural employment
        - |
          a concession that farming is less valuable than poetry
        - |
          a general claim that supports the command to “cast it down in agriculture,” giving a reason for it
        - |
          the overarching thesis of the whole address
      option_explanations:
        - |
          The sentence contains no figures. It is a general principle, not data.
        - |
          The sentence asserts equal dignity (“as much dignity”), not lesser value. It argues against looking down on manual work.
        - |
          Correct. The paragraph's command is to build on labour and the trades; this sentence gives the reason, which is why it works as a supporting claim.
        - |
          It supports one application of the thesis, addressed to one audience. The thesis must cover the whole address, including the appeal to white listeners.
      answer: 2
      explanation: |
        Review of 3.A: tell the overarching thesis apart from the claims that support it. A supporting claim serves one section; the thesis covers them all.

    - slug: u02-w06-q05
      type: multiple_choice
      topic_code: "1.B"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 1
      stimulus: *bw_atlanta
      prompt: |
        In the fourth paragraph, Washington's description of workers who have labored “without strikes and labour wars” appeals primarily to his white listeners'
      options:
        - |
          economic interest as employers and their wariness of unfamiliar immigrant labor
        - |
          desire to see the Exposition succeed internationally
        - |
          religious duty to care for the poor
        - |
          wish to change the laws governing elections
      option_explanations:
        - |
          Correct. The paragraph addresses those who “look to the incoming of those of foreign birth” for labor. Promising workers who are familiar and free of strikes speaks to employers' self-interest and fears.
        - |
          The Exposition is mentioned only as something these workers “helped make possible”; the appeal is to labor relations, not to international reputation.
        - |
          The paragraph presents Black workers as an economic asset, not as objects of charity, and says nothing about religious duty.
        - |
          Elections are not mentioned. The appeal is economic, which fits a speech that sets politics aside.
      answer: 0
      explanation: |
        Review of 1.B: ask what the listeners want. Washington frames cooperation as profitable to the employers he addresses.

    - slug: u02-w06-q06
      type: multiple_choice
      topic_code: "3.B"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 1
      stimulus: *bw_atlanta
      prompt: |
        The final sentence of the passage (“In all things that are purely social ... essential to mutual progress”) is best described as
      options:
        - |
          a digression from the argument about labor and commerce
        - |
          an admission that the two races have nothing in common
        - |
          an anecdote illustrating cooperation on a particular farm
        - |
          a compressed restatement of the speech's central position: social separation combined with economic cooperation
      option_explanations:
        - |
          The sentence gathers up the argument rather than leaving it: “mutual progress” is exactly what the bucket applications have been about.
        - |
          It says the opposite: the races are “one as the hand” in everything “essential to mutual progress.” Separation applies only to the “purely social.”
        - |
          The sentence is an image, not a story; no particular place or people are described.
        - |
          Correct. The hand-and-fingers image states the bargain the whole passage has built toward, which is why critics later treated it as the thesis of the address.
      answer: 3
      explanation: |
        Writers often restate a thesis as a memorable image at a turning point. That restatement can be the clearest evidence of what the thesis is.

    - slug: u02-w06-q07
      type: multi_select
      topic_code: "3.B"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 3
      partial_credit: true
      stimulus: *bw_atlanta
      prompt: |
        Which features of the passage help a listener follow the structure of Washington's argument? Select all that apply.
      options:
        - |
          The repetition of the command “Cast down your bucket where you are”
        - |
          The parallel openings that address first one race and then the other
        - |
          A numbered list of the three reforms Washington proposes
        - |
          A closing image that sums up the relationship the applications have described
      option_explanations:
        - |
          Correct. The repeated command ties each section back to the parable, so listeners always know which idea is being developed.
        - |
          Correct. “To those of my race” and “To those of the white race” mark the two movements of the argument.
        - |
          No numbered list appears; the structure is carried by repetition and address, not enumeration.
        - |
          Correct. The fingers-and-hand image gathers the two applications into one picture of separation and cooperation.
      answer: [0, 1, 3]
      explanation: |
        A spoken argument has to signal its structure to the ear. Repetition, parallel openings and a summarising image do that work.

    # ---- Revision set: finding and sharpening the thesis in a draft
    - slug: u02-w06-q08
      type: multiple_choice
      topic_code: "3.B"
      source: written for this course
      points: 1
      stimulus: &w06_intro |
        *The following is the draft introduction and outline of an argument a student is writing for the school newspaper about whether the high school should require a semester of personal finance for graduation.*

        (1) Last spring, a survey of our senior class found that fewer than a third could explain how interest on a credit card works. (2) Many students will sign a lease, take out a loan or open a credit card within two years of graduating. (3) Personal finance is a subject that some schools teach and others do not. (4) Our school should require a semester of personal finance because students need it. (5) What do you think about money? (6) In the first body paragraph, the writer will describe the debts recent graduates have taken on without understanding them. (7) In the second, she will explain how the course could fit into the schedule by replacing one elective semester. (8) In the third, she will answer parents who worry that the course would crowd out academic subjects.
      prompt: |
        Which sentence in the introduction (sentences 1-5) is the draft's thesis?
      options:
        - |
          Sentence 1
        - |
          Sentence 3
        - |
          Sentence 4
        - |
          Sentence 5
      option_explanations:
        - |
          Sentence 1 reports a survey result. It is evidence that will support the thesis, not a claim the essay sets out to prove.
        - |
          Sentence 3 names the topic and states a fact about schools; no one would dispute it, so it cannot be the thesis.
        - |
          Correct. Sentence 4 is the only arguable claim in the introduction: the school should require the course. Everything in the outline supports it.
        - |
          Sentence 5 is a question to the reader. A question can introduce a topic, but it makes no claim.
      answer: 2
      explanation: |
        Skill 3.B on a draft: the thesis is the arguable sentence that the rest of the essay supports. Facts, topics and questions are not theses.

    - slug: u02-w06-q09
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: *w06_intro
      prompt: |
        The writer wants to revise sentence 4 so that it previews the structure laid out in sentences 6-8. Which version best accomplishes this goal?
      options:
        - |
          Our school should require a semester of personal finance, which is a very important subject for everyone.
        - |
          Because graduates are already taking on debts they do not understand, our school should require a semester of personal finance, which could replace one elective without displacing academic courses.
        - |
          Personal finance should be required, and I will now explain why.
        - |
          Requiring personal finance is something our school should think about doing in the future.
      option_explanations:
        - |
          “Very important” is vague and previews nothing; the reader still cannot predict the three body paragraphs.
        - |
          Correct. The revision names the problem (debts graduates do not understand), the plan (replacing an elective) and the answer to parents (no academic courses displaced), in the order the outline follows.
        - |
          Announcing an explanation is not previewing it. The sentence gives the reader no sense of what the reasons are.
        - |
          “Think about doing in the future” weakens the claim to a suggestion and previews none of the body paragraphs.
      answer: 1
      explanation: |
        A thesis that previews structure names the parts of the argument in the order they will appear. Next week is devoted to writing such theses.

    - slug: u02-w06-q10
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *w06_intro
      prompt: |
        The writer wants to replace sentence 5 with a sentence that acknowledges the concern of parents who will read the newspaper. Which choice best accomplishes this goal?
      options:
        - |
          Money is boring, but it matters.
        - |
          Students should be able to choose what they learn.
        - |
          Personal finance is easier than calculus.
        - |
          Parents are right to guard the time students spend on core subjects, and a well-designed course can respect that.
      option_explanations:
        - |
          The sentence does not speak to parents at all, and calling the subject boring undercuts the writer's own proposal.
        - |
          This sentence argues against a requirement and ignores the parents' stated concern about academic time.
        - |
          Comparing difficulty may even confirm the parents' fear that the course is less rigorous; it does not acknowledge their concern.
        - |
          Correct. The sentence grants the parents' value (protecting academic time) and signals that the essay will answer it, which prepares for the third body paragraph.
      answer: 3
      explanation: |
        Review of 2.B: acknowledging a named audience's concern early shows understanding and makes the later answer more persuasive.

    - slug: u02-w06-q11
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: *w06_intro
      prompt: |
        For the first body paragraph (sentence 6), which piece of evidence would most directly support the writer's claim?
      options:
        - |
          A figure from the school's alumni survey showing how many graduates of the last five years report credit card debt they did not expect
        - |
          A quotation from a famous investor about the value of saving money
        - |
          A description of the writer's favourite elective
        - |
          The number of students enrolled in the high school this year
      option_explanations:
        - |
          Correct. The paragraph will describe debts recent graduates took on without understanding them; local survey data about exactly that is specific and relevant.
        - |
          A general maxim about saving is not evidence that graduates are taking on debts they do not understand.
        - |
          The writer's favourite elective has nothing to do with graduates' debt; it would belong, if anywhere, in the paragraph about scheduling.
        - |
          Total enrollment tells the reader nothing about graduates' financial experience.
      answer: 0
      explanation: |
        Review of 4.A: evidence must fit the claim of the paragraph it serves. Match the evidence to the paragraph's job.

    # ---- Across the address and the skill
    - slug: u02-w06-q12
      type: multiple_choice
      topic_code: "3.B"
      source: general knowledge
      points: 1
      prompt: |
        Which of the following is an overarching thesis rather than a topic or a fact?
      options:
        - |
          Booker T. Washington spoke at the Atlanta Exposition in 1895.
        - |
          This essay is about Washington's Atlanta Exposition address.
        - |
          Washington's address wins over a divided audience by presenting economic cooperation as each group's self-interest, at the cost of setting civil rights aside.
        - |
          The Atlanta Exposition address contains a parable about a ship.
      option_explanations:
        - |
          This is a fact that no one disputes. A thesis must be something the writer has to prove.
        - |
          This announces a topic. It tells the reader what the essay concerns, not what it claims.
        - |
          Correct. The sentence makes an arguable claim about how the speech works and what it costs, and it suggests a line of reasoning the essay would have to support.
        - |
          This is an accurate observation about the text, but it is not arguable and makes no claim about its significance.
      answer: 2
      explanation: |
        The thesis test: could a reasonable reader disagree? Facts, topics and observations fail; claims about meaning, effect or value pass.

    - slug: u02-w06-q13
      type: multiple_choice
      topic_code: "3.B"
      source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
      points: 1
      prompt: |
        Washington's address never contains a sentence beginning “I will argue that.” A student concludes that the address therefore has no thesis. Which response best corrects the student?
      options:
        - |
          The student is right: an argument without an announced thesis has no main claim.
        - |
          The thesis is carried by the repeated command “Cast down your bucket where you are” and restated in the fingers-and-hand image, so it can be described in one sentence even though it is never announced.
