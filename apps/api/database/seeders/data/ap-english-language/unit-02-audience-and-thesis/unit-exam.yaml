  - slug: u02-exam-q41
    type: multiple_choice
    topic_code: "4.B"
    source: general knowledge
    points: 1
    prompt: |
      An argument prompt asks whether citizens have a duty to speak out against laws they believe are unjust. Which thesis best meets the standard of skill 4.B?
    options:
      - |
        There are many laws, and some of them may be unjust.
      - |
        This essay will discuss whether citizens should speak out against unjust laws.
      - |
        Citizens have a duty to speak out against laws they believe unjust, because silence lets injustice pass as consent, as Anthony's 1873 campaign shows, and because public argument is how a republic corrects its mistakes.
      - |
        Speaking out is always right in every situation without exception.
    option_explanations:
      - |
        A general observation takes no position on the question.
      - |
        An announcement of the topic is not a thesis.
      - |
        Correct. The thesis takes a defensible position and previews two reasons, one tied to an example the writer can develop.
      - |
        The absolute claim is arguable but very hard to defend, and it previews no reasoning.
    answer: 2
    explanation: |
      A thesis for the argument essay takes a position and, ideally, names the reasoning that will support it.

