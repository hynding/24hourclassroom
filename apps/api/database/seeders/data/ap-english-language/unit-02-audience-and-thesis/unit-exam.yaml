  - slug: u02-exam-q44
    type: true_false
    topic_code: "4.B"
    source: general knowledge
    points: 1
    prompt: |
      True or false: If a thesis previews three reasons, the body paragraphs should develop those reasons in the order the thesis names them.
    answer: true
    explanation: |
      True. A preview is a promise to the reader. Developing the reasons in a different order, or adding a paragraph the thesis never mentions, breaks the promise and makes the line of reasoning harder to follow.

  - slug: u02-exam-q45
    type: short_answer
    topic_code: "3.B"
    source: general knowledge
    points: 2
    prompt: |
      Choose two of the unit's speakers (Douglass, Washington, Anthony). In two or three sentences, explain where each places the thesis and why that placement suits the audience.
    answer: |
      Anthony states her thesis in her first paragraph (“It shall be my work this evening to prove”) because her listeners were potential jurors who needed to know exactly what question they were judging. Douglass praises the founders and asks questions before naming his subject, because a sympathetic but complacent holiday crowd had to be prepared before it could hear that its celebration was a sham.
    explanation: |
      1 point: accurately locates the thesis or its presentation for two speakers (Anthony at the outset; Washington in a repeated parable; Douglass delayed until “My subject, then,” or stated last in the passage on argument). 1 point: explains each placement in terms of the audience (jurors needing clarity; a divided crowd needing a memorable command; a complacent crowd needing preparation). Accurate placement without the audience link earns 1.
