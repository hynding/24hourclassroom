unit: 2
description: |
  45 questions · about 90 minutes · every skill of Unit 2 (audience 1.B and 2.B, claims and evidence 3.A and 4.A,
  thesis and structure 3.B and 4.B). Five sets: new passages from Douglass's Rochester oration, Washington's
  Atlanta Exposition address and Anthony's 1873 speech; a revision set on a student's argument; and a speech you
  have not studied, Patrick Henry's address to the Second Virginia Convention (1775), followed by an AP-style
  rhetorical analysis essay on it. Then six questions across the unit, including a short written response.
  Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
  automatically; the short responses and the essay are graded by your teacher against the model answers and the
  6-point AP rubric.
questions:
  # ---- Set A: Douglass, the answer to the title question
  - slug: u02-exam-q01
    type: multiple_choice
    topic_code: "1.B"
    source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
    points: 1
    stimulus: &ex_dg |
      *The following passages are from Frederick Douglass's oration delivered at Rochester, New York, on July 5, 1852, as printed in his* My Bondage and My Freedom *(1855).*

      Fellow-citizens, above your national, tumultous joy, I hear the mournful wail of millions, whose chains, heavy and grievous yesterday, are to-day rendered more intolerable by the jubilant shouts that reach them. If I do forget, if I do not faithfully remember those bleeding children of sorrow this day, “may my right hand forget her cunning, and may my tongue cleave to the roof of my mouth!” To forget them, to pass lightly over their wrongs, and to chime in with the popular theme, would be treason most scandalous and shocking, and would make me a reproach before God and the world.

      [...]

      “I will not equivocate; I will not excuse;” I will use the severest language I can command; and yet not one word shall escape me that any man, whose judgment is not blinded by prejudice, or who is not at heart a slaveholder, shall not confess to be right and just.

      [...]

      What to the American slave is your Fourth of July? I answer, a day that reveals to him, more than all other days in the year, the gross injustice and cruelty to which he is the constant victim. To him, your celebration is a sham; your boasted liberty, an unholy license; your national greatness, swelling vanity; your sounds of rejoicing are empty and heartless; your denunciations of tyrants, brass-fronted impudence; your shouts of liberty and equality, hollow mockery; your prayers and hymns, your sermons and thanksgivings, with all your religious parade and solemnity, [...] are to him mere bombast, fraud, deception, impiety, and hypocrisy--a thin veil to cover up crimes which would disgrace a nation of savages. There is not a nation on the earth guilty of practices more shocking and bloody, than are the people of these United States, at this very hour.

      Go where you may, search where you will, roam through all the monarchies and despotisms of the old world, travel through South America, search out every abuse, and when you have found the last, lay your facts by the side of the every-day practices of this nation, and you will say with me, that, for revolting barbarity and shameless hypocrisy, America reigns without a rival.
    prompt: |
      In the first paragraph, the contrast between the audience's “tumultous joy” and “the mournful wail of millions” primarily serves to
    options:
      - |
        suggest that the celebration was too loud to allow the speech to be heard
      - |
        make the listeners hear, in the middle of their own festivity, the suffering their celebration ignores
      - |
        criticise the organisers for scheduling the speech on a holiday
      - |
        show that Douglass has forgotten the enslaved
    option_explanations:
      - |
        The noise is figurative; Douglass is not complaining about acoustics but about what the celebration drowns out.
      - |
        Correct. Douglass sets the audience's joy beside the cries of the enslaved and even makes the joy part of the injury (“rendered more intolerable by the jubilant shouts”). Listeners are made to hear what their festivity has kept out.
      - |
        The organisers invited him to speak at exactly this occasion; his target is the nation's celebration, not the schedule.
      - |
        He says the opposite: to forget them would be “treason most scandalous and shocking.”
    answer: 1
    explanation: |
      Skill 1.B: a writer who knows the audience's mood can turn it against itself. Here the listeners' own joy becomes evidence.

  - slug: u02-exam-q02
    type: multiple_choice
    topic_code: "1.B"
    source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
    points: 1
    stimulus: *ex_dg
    prompt: |
      The second paragraph's promise that no word will escape him that any man “whose judgment is not blinded by prejudice, or who is not at heart a slaveholder,” could deny has which effect on the audience?
    options:
      - |
        It invites listeners to judge the speech by their own standards of fairness, as neutral jurors.
      - |
        It apologises in advance for the harshness of the language to come.
      - |
        It admits that some listeners will be right to reject his claims.
      - |
        It leaves listeners who might reject his words only two descriptions of themselves, prejudiced or slaveholders at heart, which pressures them to accept what follows.
    option_explanations:
      - |
        The sentence does not leave judgment open; it defines in advance what kind of person would disagree.
      - |
        Douglass promises “the severest language I can command”; the sentence defends that language rather than apologising for it.
      - |
        Anyone who rejects his words is classed as prejudiced or a slaveholder at heart; no one who disagrees is presented as right.
      - |
        Correct. Antislavery listeners would refuse both descriptions, so the only way to keep their self-image is to grant that his severest words are “right and just.”
    answer: 3
    explanation: |
      Knowing how an audience sees itself lets a speaker close off disagreement: rejecting the claim would mean accepting an identity the listeners despise.

  - slug: u02-exam-q03
    type: multiple_choice
    topic_code: "3.B"
    source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
    points: 1
    stimulus: *ex_dg
    prompt: |
      Which sentence most directly states the central claim of the speech, the claim its title announces?
    options:
      - |
        “I answer, a day that reveals to him, more than all other days in the year, the gross injustice and cruelty to which he is the constant victim.”
      - |
        “I will use the severest language I can command.”
      - |
        “Fellow-citizens, above your national, tumultous joy, I hear the mournful wail of millions.”
      - |
        “Go where you may, search where you will.”
    option_explanations:
      - |
        Correct. The title asks what the Fourth of July is to the slave; this sentence answers that question directly, and the list that follows elaborates the answer.
      - |
        This is a promise about method and tone, not the claim the title poses.
      - |
        This sentence introduces the contrast between celebration and suffering, but it does not yet answer the title's question.
      - |
        This begins a supporting comparison with other nations; it amplifies the claim rather than stating it.
    answer: 0
    explanation: |
      When a title is a question, the sentence that answers it is usually the thesis.

  - slug: u02-exam-q04
    type: multiple_choice
    topic_code: "3.A"
    source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
    points: 1
    stimulus: *ex_dg
    prompt: |
      In the third paragraph, the series beginning “your celebration is a sham; your boasted liberty, an unholy license” contributes to the argument chiefly by
    options:
      - |
        conceding that some parts of the celebration are sincere
      - |
        providing statistical evidence of the nation's crimes
      - |
        applying the central claim to each feature of the celebration in turn, pairing what the audience values with Douglass's judgment of it
      - |
        changing the subject from the Fourth of July to foreign affairs
    option_explanations:
      - |
        Every item in the series is condemned; nothing is excepted.
      - |
        The series contains no figures; its force is in the judgments it pairs with each feature.
      - |
        Correct. Each clause names something the audience prizes (liberty, greatness, rejoicing, prayers) and then names what it is “to him.” The claim is made specific, item by item.
      - |
        The series stays with the nation's own celebration; the comparison with other nations comes only in the next paragraph.
    answer: 2
    explanation: |
      A list of parallel claims can serve as support by making a general claim concrete in every part.

  - slug: u02-exam-q05
    type: multiple_choice
    topic_code: "3.A"
    source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
    points: 1
    stimulus: *ex_dg
    prompt: |
      The claim in the final paragraph that “America reigns without a rival” is supported primarily by
    options:
      - |
        a table of comparative data from several nations
      - |
        an invitation to the audience to make the comparison themselves, confident of the result
      - |
        the testimony of travellers to South America
      - |
        a quotation from a foreign government
    option_explanations:
      - |
        No data appear; the paragraph proposes a comparison rather than reporting one.
      - |
        Correct. “Go where you may ... lay your facts by the side of the every-day practices of this nation, and you will say with me.” Douglass asks listeners to do the comparison and predicts their verdict.
      - |
        South America is named as a place the listener might search, not as a source of testimony.
      - |
        No foreign government is quoted; the only voice besides Douglass's is the listener he imagines agreeing with him.
    answer: 1
    explanation: |
      Some claims are supported not by evidence supplied but by an appeal to what the audience could verify. Identify the kind of support accurately.

  - slug: u02-exam-q06
    type: multiple_choice
    topic_code: "4.B"
    source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
    points: 1
    stimulus: *ex_dg
    prompt: |
      Which thesis for a rhetorical analysis of these passages is most defensible?
    options:
      - |
        Douglass gives a speech about the Fourth of July and slavery.
      - |
        Douglass uses many literary devices, such as lists and comparisons.
      - |
        Douglass's speech was delivered on July 5 instead of July 4.
      - |
        Douglass turns each feature of the holiday his listeners cherish into evidence of the nation's hypocrisy, and then widens the charge until America stands condemned against every nation on earth.
    option_explanations:
      - |
        This names the topic; it makes no claim about how the passage works.
      - |
        A device list says nothing about what the devices accomplish for the audience.
      - |
        A fact of context is not arguable, and it says nothing about how the passage works on its audience.
      - |
        Correct. The thesis makes a claim about the passage's strategy and previews its two movements: the item-by-item indictment, then the comparison with the world.
    answer: 3
    explanation: |
      A defensible rhetorical analysis thesis names choices and what they do, and can preview the order of the analysis.

  - slug: u02-exam-q07
    type: multiple_choice
    topic_code: "3.B"
    source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
    points: 1
    stimulus: *ex_dg
    prompt: |
      The final paragraph relates to the paragraph before it by
    options:
      - |
        extending the charge from the nation's own celebration to a comparison with every other nation, so that the claim grows from hypocrisy at home to a judgment against the world
      - |
        qualifying the previous claim by admitting that other nations are worse
      - |
        introducing an unrelated topic to close the speech
      - |
        summarising the speech's argument in neutral language
    option_explanations:
      - |
        Correct. The third paragraph judges the celebration; the fourth widens the field to “all the monarchies and despotisms of the old world” and concludes that America has no rival in barbarity and hypocrisy.
      - |
        The paragraph claims the reverse: no nation is worse.
      - |
        The comparison continues the same claim about the nation's hypocrisy; it is an amplification, not a new topic.
      - |
        “Revolting barbarity and shameless hypocrisy” is anything but neutral.
    answer: 0
    explanation: |
      Questions about how parts relate test structure (3.B). Name the relationship: extension, contrast, example, concession, conclusion.

  - slug: u02-exam-q08
    type: multi_select
    topic_code: "1.B"
    source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
    points: 3
    partial_credit: true
    stimulus: *ex_dg
    prompt: |
      Which phrases draw on the religious values of Douglass's audience? Select all that apply.
    options:
      - |
        “would make me a reproach before God and the world”
      - |
        “your prayers and hymns, your sermons and thanksgivings”
      - |
        “roam through all the monarchies and despotisms of the old world”
      - |
        “mere bombast, fraud, deception, impiety, and hypocrisy”
    option_explanations:
      - |
        Correct. Douglass judges his own duty by God's standard, which his churchgoing audience shared.
      - |
        Correct. He names the religious observances of the holiday so that their hollowness can be exposed; a pious audience would feel the charge most.
      - |
        This phrase concerns political systems abroad, not religion.
      - |
        Correct. “Impiety” charges the audience's worship itself with offending God, an accusation aimed at listeners who prized their piety.
    answer: [0, 1, 3]
    explanation: |
      An audience's religion can be a premise (God's judgment) or a target (hollow worship). Douglass uses it both ways.

  # ---- Set B: Washington, the close of the Atlanta address
  - slug: u02-exam-q09
    type: multiple_choice
    topic_code: "1.B"
    source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
    points: 1
    stimulus: &ex_bw |
      *The following passages are from the address Booker T. Washington delivered at the Cotton States and International Exposition in Atlanta on September 18, 1895, as printed in* Up from Slavery *(1901).*

      There is no defence or security for any of us except in the highest intelligence and development of all. If anywhere there are efforts tending to curtail the fullest growth of the Negro, let these efforts be turned into stimulating, encouraging, and making him the most useful and intelligent citizen. Effort or means so invested will pay a thousand per cent interest. These efforts will be twice blessed--"blessing him that gives and him that takes."

      [...]

      Nearly sixteen millions of hands will aid you in pulling the load upward, or they will pull against you the load downward. We shall constitute one-third and more of the ignorance and crime of the South, or one-third its intelligence and progress; we shall contribute one-third to the business and industrial prosperity of the South, or we shall prove a veritable body of death, stagnating, depressing, retarding every effort to advance the body politic.

      [...]

      The wisest among my race understand that the agitation of questions of social equality is the extremest folly, and that progress in the enjoyment of all the privileges that will come to us must be the result of severe and constant struggle rather than of artificial forcing. No race that has anything to contribute to the markets of the world is long in any degree ostracized. It is important and right that all privileges of the law be ours, but it is vastly more important that we be prepared for the exercises of these privileges.

      In conclusion, may I repeat that nothing in thirty years has given us more hope and encouragement, and drawn us so near to you of the white race, as this opportunity offered by the Exposition; and here bending, as it were, over the altar that represents the results of the struggles of your race and mine, both starting practically empty-handed three decades ago, I pledge that in your effort to work out the great and intricate problem which God has laid at the doors of the South, you shall have at all times the patient, sympathetic help of my race; only let this be constantly in mind, that, while from representations in these buildings of the product of field, of forest, of mine, of factory, letters, and art, much good will come, yet far above and beyond material benefits will be that higher good, that, let us pray God, will come, in a blotting out of sectional differences and racial animosities and suspicions, in a determination to administer absolute justice, in a willing obedience among all classes to the mandates of law. This, this, coupled with our material prosperity, will bring into our beloved South a new heaven and a new earth.
    prompt: |
      The phrase “will pay a thousand per cent interest” is especially suited to the white business leaders in Washington's audience because it
    options:
      - |
        reminds them of debts the South owed to Northern banks
      - |
        promises them a share of the profits of Tuskegee Institute
      - |
        frames support for Black education and development as an investment with an enormous return, in the language of their own trade
      - |
        warns them that failing to invest will lead to bankruptcy
    option_explanations:
      - |
        No debt is mentioned; the figure describes a return on investment, not an obligation.
      - |
        Tuskegee is not mentioned in the passage, and the return is to the South as a whole.
      - |
        Correct. Washington translates a moral request into a financial metaphor his listeners understand and value: helping “the fullest growth of the Negro” is good business.
      - |
        The sentence promises gain; the warning of loss comes later, in the “body of death” paragraph.
    answer: 2
    explanation: |
      Skill 1.B: a writer shows understanding of an audience by speaking in its terms. Washington's metaphor is drawn from his listeners' world.

  - slug: u02-exam-q10
    type: multiple_choice
    topic_code: "3.A"
    source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
    points: 1
    stimulus: *ex_bw
    prompt: |
      The second paragraph (“Nearly sixteen millions of hands ...”) supports Washington's argument chiefly by
    options:
      - |
        presenting a stark either-or, so that the white South's own prosperity depends on helping Black Southerners rise
      - |
        threatening violence if Black Southerners are not given the vote
      - |
        describing the history of Black labor in the South
      - |
        conceding that Black Southerners are responsible for most of the South's crime
    option_explanations:
      - |
        Correct. Each sentence offers two outcomes, upward or downward, intelligence or ignorance, prosperity or “a veritable body of death.” The white audience's interest is tied to the choice it makes.
      - |
        The paragraph speaks of economic and social outcomes, not of violence or the vote.
      - |
        The paragraph looks forward to possible futures; it does not narrate the past.
      - |
        The share of “ignorance and crime” is one possible future, set against “intelligence and progress”; it is not a concession about the present.
    answer: 0
    explanation: |
      Identify the form of a claim and its support. An either-or framing makes the audience's self-interest the evidence.

  - slug: u02-exam-q11
    type: multiple_choice
    topic_code: "3.B"
    source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
    points: 1
    stimulus: *ex_bw
    prompt: |
      The third paragraph (“The wisest among my race ...”) relates to the overarching thesis of the address in that it
    options:
      - |
        abandons the thesis in favor of a demand for immediate social equality
      - |
        introduces a new argument about international trade
      - |
        repeats word for word the parable with which the address began
      - |
        restates the address's central bargain: economic preparation and contribution first, with social equality not to be agitated for
    option_explanations:
      - |
        The paragraph calls agitation for social equality “the extremest folly”; it does not demand it.
      - |
        “The markets of the world” supports the claim that contribution ends ostracism; trade is not a new argument but a reason.
      - |
        The parable is not repeated here; the paragraph states the bargain in plain terms.
      - |
        Correct. Preparation and contribution are “vastly more important” than pressing for privileges now. This is the same bargain the fingers-and-hand image expressed.
    answer: 3
    explanation: |
      Skill 3.B: a thesis may be restated in different forms through an address. Recognising the restatement confirms what the thesis is.

  - slug: u02-exam-q12
    type: multiple_choice
    topic_code: "1.B"
    source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
    points: 1
    stimulus: *ex_bw
    prompt: |
      The sentence “It is important and right that all privileges of the law be ours, but it is vastly more important that we be prepared for the exercises of these privileges” is most likely designed to
    options:
      - |
        reject the idea that Black Southerners should ever have legal rights
      - |
        affirm legal rights in principle for listeners who wanted them affirmed, while reassuring other listeners that they would not be pressed for now
      - |
        criticise the Exposition's managers for denying legal privileges
      - |
        announce a plan to file lawsuits
    option_explanations:
      - |
        The first clause calls the privileges of law “important and right”; rights are affirmed, not rejected.
      - |
        Correct. The concessive structure speaks to two audiences at once: Black listeners hear their rights called “right”; white listeners hear that preparation, not demands, comes first.
      - |
        The managers are praised throughout the address; no one is criticised here.
      - |
        No legal action is mentioned; the sentence sets priorities, not plans.
    answer: 1
    explanation: |
      A divided audience may call for sentences that offer each part something. Notice which clause carries the emphasis (“vastly more important”).

  - slug: u02-exam-q13
    type: multiple_choice
    topic_code: "3.B"
    source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
    points: 1
    stimulus: *ex_bw
    prompt: |
      The final paragraph functions as a conclusion chiefly by
    options:
      - |
        apologising for the length of the address
      - |
        introducing a counterargument that the address leaves unanswered
      - |
        returning to the opening's gratitude for the Exposition and then widening the thesis from material progress to justice and the rule of law
      - |
        listing the exhibits in the Exposition's buildings
    option_explanations:
      - |
        There is no apology; the paragraph is a pledge and a hope.
      - |
        No counterargument is raised; the paragraph unites rather than divides.
      - |
        Correct. “May I repeat” signals a return to the opening's theme; the pledge of “patient, sympathetic help” restates the cooperation thesis; and the “higher good” of justice and law widens it to a moral vision.
      - |
        The exhibits (“field, of forest, of mine, of factory”) are mentioned only to be surpassed by “that higher good.”
    answer: 2
    explanation: |
      A strong conclusion often returns to the opening and then enlarges the thesis. Look for both moves.

  - slug: u02-exam-q14
    type: multiple_choice
    topic_code: "3.B"
    source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
    points: 1
    stimulus: *ex_bw
    prompt: |
      In the last sentence, the repetition in “This, this, coupled with our material prosperity” serves mainly to
    options:
      - |
        insist that the higher good of justice and law, joined to the economic progress the address has argued for, is what will transform the South
      - |
        signal uncertainty about which point Washington means
      - |
        correct an error in the previous sentence
      - |
        introduce a new subject
    option_explanations:
      - |
        Correct. The doubled “This” gathers up the “higher good” just described and joins it to “material prosperity,” combining the two halves of the vision in the final sentence.
      - |
        The repetition is emphatic, not hesitant; the referent (the higher good) has just been described at length.
      - |
        Nothing in the previous sentence is corrected; the repetition reinforces it.
      - |
        The sentence concludes; it introduces nothing new.
    answer: 0
    explanation: |
      Repetition at a conclusion usually marks emphasis. Identify what is being emphasised and how it relates to the thesis.

  - slug: u02-exam-q15
    type: true_false
    topic_code: "1.B"
    source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
    points: 1
    stimulus: *ex_bw
    prompt: |
      True or false: Washington's statement that “the agitation of questions of social equality is the extremest folly” was likely meant, in part, to reassure the white Southerners in his audience.
    answer: true
    explanation: |
      True. White Southern officials and businessmen feared demands for social equality. By disavowing agitation, Washington made his request for economic cooperation easier for them to accept; critics later argued that the reassurance cost too much.

  - slug: u02-exam-q16
    type: multiple_choice
    topic_code: "4.B"
    source: 'Booker T. Washington, Atlanta Exposition Address (1895)'
    points: 1
    stimulus: *ex_bw
    prompt: |
      A student is writing an essay about these passages. Which thesis is most defensible and best previews a line of reasoning?
    options:
      - |
        Washington talks about many things at the end of his speech.
      - |
        Washington's conclusion is very inspiring.
      - |
        In these passages Washington mentions the South, the Exposition and God.
      - |
        Washington persuades white business leaders by casting Black progress as a profitable investment and a choice between prosperity and decline, then disarms their fears by setting social equality aside.
    option_explanations:
      - |
        A vague statement of topic makes no claim at all.
      - |
        Vague praise is arguable only in the thinnest sense and previews nothing.
      - |
        A list of things mentioned is description, not a claim.
      - |
        Correct. The thesis names three moves in the order the passages make them (investment metaphor, either-or, reassurance about social equality) and says what they do for the audience.
    answer: 3
    explanation: |
      Skill 4.B: name the choices, their effect on this audience, and their order.

  # ---- Set C: Anthony, the "obligarchy of sex" and the pronoun objection
  - slug: u02-exam-q17
    type: multiple_choice
    topic_code: "3.A"
    source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
    points: 1
    stimulus: &ex_sba |
      *The following passages are from the address Susan B. Anthony delivered across Monroe and Ontario counties, New York, in 1873, before her trial for voting, as printed in* An Account of the Proceedings on the Trial of Susan B. Anthony *(1874). The spelling “obligarchy” is the printing's.*

      For any State to make sex a qualification that must ever result in the disfranchisement of one entire half of the people, is to pass a bill of attainder, or an *ex post facto* law, and is therefore a violation of the supreme law of the land. By it, the blessings of liberty are forever withheld from women and their female posterity. To them, this government has no just powers derived from the consent of the governed. To them this government is not a democracy. It is not a republic. It is an odious aristocracy; a hateful obligarchy of sex. The most hateful aristocracy ever established on the face of the globe. An obligarchy of wealth, where the rich govern the poor; an obligarchy of learning, where the educated govern the ignorant; or even an obligarchy of race, where the Saxon rules the African, might be endured; but this obligarchy of sex, which makes father, brothers, husband, sons, the obligarchs over the mother and sisters, the wife and daughters of every household; which ordains all men sovereigns, all women subjects, carries dissension, discord and rebellion into every home of the nation.

      [...]

      What, I ask you, is the distinctive difference between the inhabitants of a monarchical and those of a republican form of government, save that in the monarchical the people are subjects, helpless, powerless, bound to obey laws made by superiors--while in the republican, the people are citizens, individual sovereigns, all clothed with equal power, to make and unmake both their laws and law makers, and the moment you deprive a person of his right to a voice in the government, you degrade him from the status of a citizen of the republic, to that of a subject, and it matters very little to him whether his monarch be an individual tyrant, as is the Czar of Russia, or a 15,000,000 headed monster, as here in the United States; he is a powerless subject, serf or slave; not a free and independent citizen in any sense.

      But, it is urged, the use of the masculine pronouns he, his and him, in all the constitutions and laws, is proof that only men were meant to be included in their provisions. If you insist on this version of the letter of the law, we shall insist that you be consistent, and accept the other horn of the dilemma, which would compel you to exempt women from taxation for the support of the government, and from penalties for the violation of laws.
    prompt: |
      The first sentence of the passage supports Anthony's thesis chiefly by
    options:
      - |
        appealing to the audience's sympathy for women who have suffered under unjust laws
      - |
        classifying a sex qualification for voting as a kind of law the Constitution forbids, so that such a qualification is itself unconstitutional
      - |
        conceding that states have the power to set voting qualifications
      - |
        describing the history of voting qualifications in New York
    option_explanations:
      - |
        The sentence argues from legal categories, not from suffering; feeling enters later, with “every household.”
      - |
        Correct. A bill of attainder and an ex post facto law are both prohibited by the Constitution. By placing a sex qualification in those categories, Anthony makes it “a violation of the supreme law of the land.”
      - |
        She denies that a state may impose such a qualification; the sentence calls it a violation, not a power.
      - |
        No history of New York's laws is given; the argument is about constitutional principle.
    answer: 1
    explanation: |
      Skill 3.A: identify the kind of support. Here a legal classification does the work of evidence.

  - slug: u02-exam-q18
    type: multiple_choice
    topic_code: "3.A"
    source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
    points: 1
    stimulus: *ex_sba
    prompt: |
      The sequence “To them this government is not a democracy. It is not a republic. It is an odious aristocracy” functions in the argument as
    options:
      - |
        a concession that the United States is a democracy for most of its citizens
      - |
        a summary of the government's official description of itself
      - |
        a comparison of the United States with Russia
      - |
        a claim that redefines the government, from women's point of view, by the exclusion it practises, rejecting two names before giving a third
    option_explanations:
      - |
        The phrase “To them” limits the claim to women, but the point is not to concede anything; it is to deny that the government deserves its names.
      - |
        No government calls itself an aristocracy; the sentence contradicts the official description.
      - |
        Russia appears later, in a different paragraph and a different comparison.
      - |
        Correct. The short sentences strip away “democracy” and “republic” and substitute “aristocracy,” a word her republican listeners despised. The claim renames the government by what it does to women.
    answer: 3
    explanation: |
      Claims can work by redefinition. Ask what name is rejected, what name replaces it, and why the audience would feel the difference.

  - slug: u02-exam-q19
    type: multiple_choice
    topic_code: "1.B"
    source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
    points: 1
    stimulus: *ex_sba
    prompt: |
      Anthony's listeners were men who might sit on her jury. Her description of an obligarchy that “makes father, brothers, husband, sons, the obligarchs over the mother and sisters, the wife and daughters of every household” is likely to affect them because it
    options:
      - |
        turns an abstract political arrangement into the relationships of each listener's own home, casting each man as a ruler over the women of his family
      - |
        praises the men in the audience for protecting their families
      - |
        suggests that women would prefer not to vote
      - |
        argues that only unmarried women should vote
    option_explanations:
      - |
        Correct. The list names a man's roles in his family one by one. Each listener is placed inside the “obligarchy” as an obligarch, a role at odds with his republican ideals.
      - |
        The men are not praised; they are cast as “obligarchs” whose rule brings “dissension, discord and rebellion into every home.”
      - |
        Nothing suggests reluctance; the passage presents exclusion as the injury.
      - |
        Wives and daughters alike are named; no distinction by marriage is made.
    answer: 0
    explanation: |
      Skill 1.B: to move an audience, writers often translate an abstraction into the listener's own life.

  - slug: u02-exam-q20
    type: multiple_choice
    topic_code: "3.B"
    source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
    points: 1
    stimulus: *ex_sba
    prompt: |
      The final paragraph (“But, it is urged ...”) relates to Anthony's overarching thesis by
    options:
      - |
        abandoning the constitutional argument in favor of an argument about taxes
      - |
        introducing evidence that women have always been exempt from taxes
      - |
        anticipating an objection to the thesis, that masculine pronouns exclude women, and turning it into a dilemma her opponents cannot accept
      - |
        admitting that the laws were written only for men
    option_explanations:
      - |
        Taxes appear only as the unacceptable consequence of the opponents' reading; the constitutional argument continues.
      - |
        She says the opposite: women are taxed and punished, which is why the pronoun argument fails.
      - |
        Correct. “It is urged” introduces the objection. If pronouns exclude women from rights, they must exclude them from taxes and penalties too; since no one accepts that, the objection collapses and the thesis stands.
      - |
        She concedes the pronouns only “if you insist,” in order to show where that reading leads.
    answer: 2
    explanation: |
      Skill 3.B: part of an argument's structure is where it answers objections. Ask what the paragraph does for the thesis.

  - slug: u02-exam-q21
    type: multiple_choice
    topic_code: "3.A"
    source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
    points: 1
    stimulus: *ex_sba
    prompt: |
      The reasoning behind “accept the other horn of the dilemma” is that
    options:
      - |
        women should be taxed more heavily than men
      - |
        the opponents' reading of the pronouns, applied consistently, would free women from taxes and penalties, a result the opponents would never accept
      - |
        the constitutions should be rewritten to remove all pronouns
      - |
        the opponents are right about voting but wrong about taxes
    option_explanations:
      - |
        Nothing suggests heavier taxation; the point is that the same words govern both voting and taxing.
      - |
        Correct. If “he, his and him” mean men only, then laws on taxation and punishment would not apply to women. Since the opponents insist those laws do apply, they cannot read the pronouns as excluding women from voting.
      - |
        Anthony does not propose rewriting anything; she argues from the laws as written.
      - |
        The dilemma is meant to show the opponents' reading wrong in both cases, not right in one.
    answer: 1
    explanation: |
      A dilemma argument shows that an opponent's premise leads to a conclusion the opponent rejects. Identify the premise and the unwanted conclusion.

  - slug: u02-exam-q22
    type: multiple_choice
    topic_code: "1.B"
    source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
    points: 1
    stimulus: *ex_sba
