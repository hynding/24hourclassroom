  - slug: u02-exam-q39
    type: long_answer
    topic_code: "1.B"
    source: 'Patrick Henry, speech to the Second Virginia Convention (1775)'
    points: 6
    stimulus: *ex_henry
    prompt: |
      **Rhetorical analysis essay** (suggested time: 40 minutes)

      On March 23, 1775, delegates to the Second Virginia Convention met in a church in Richmond to decide how Virginia should respond to Britain's growing military presence in the colonies. Several delegates had argued for patience and further appeals for reconciliation. Patrick Henry rose to propose that Virginia raise and arm a militia. The passage above is from his speech, as reconstructed by his biographer in 1817.

      Read the passage carefully. Write an essay that analyzes the rhetorical choices Henry makes to persuade the delegates to prepare for armed resistance.

      In your response you should do the following:
      - Respond to the prompt with a thesis that analyzes the writer's rhetorical choices.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Demonstrate an understanding of the rhetorical situation.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      A strong essay might argue that Henry wins over an audience inclined to wait by first honouring his opponents and then closing every peaceful exit before revealing the only road left. Body 1: the opening grants “the patriotism, as well as abilities” of the delegates who spoke for patience and recasts silence as “treason towards my country,” so that disagreement becomes a patriotic duty. Body 2: Henry exposes hope as a “siren” and judges by “the lamp of experience,” contrasting Britain's “insidious smile” with “warlike preparations which cover our waters”; biblical allusions (eyes that see not, a betraying kiss) cast trust in Britain as blindness. Body 3: rhetorical questions and the series “We have petitioned; we have remonstrated; we have supplicated” exhaust each peaceful alternative, so that the shift to “The war is actually begun!” lands as a conclusion. Body 4: the close moves from argument to vow, “as for me, give me liberty or give me death!”, modelling the decision without insulting colleagues. Sophistication: noting that the speech's force depends on the tension between respect for opponents and urgency, or that the text is Wirt's 1817 reconstruction, shaped for later readers as well as delegates.
    explanation: |
      Scored on the 6-point AP rubric. Row A, thesis (0-1): 1 point for a defensible thesis that analyses Henry's rhetorical choices (for example, conceding his opponents' patriotism, appealing to experience and scripture, closing off peaceful alternatives, ending with a personal vow); a thesis that only restates the prompt, summarises, or lists devices without saying what they do earns 0. Row B, evidence and commentary (0-4): 4 points for specific, well-chosen evidence from across the passage with consistent commentary explaining how each choice works on these delegates (respected colleagues inclined to wait, patriotic and religious, who had lived through ten years of failed petitions); 3 points for specific evidence and commentary that explains most choices; 2 points for some specific evidence with commentary that is uneven or largely summary; 1 point for evidence that is general or commentary that only repeats it; 0 for no relevant evidence. Row C, sophistication (0-1): 1 point for complex understanding of the rhetorical situation, such as explaining how Henry balances respect and urgency, tracing the shift from argument to vow, or recognising the dual audience created by the 1817 reconstruction, or for a consistently vivid and persuasive style.

