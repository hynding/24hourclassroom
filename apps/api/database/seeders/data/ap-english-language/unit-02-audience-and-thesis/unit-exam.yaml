  - slug: u02-exam-q36
    type: multiple_choice
    topic_code: "1.B"
    source: 'Patrick Henry, speech to the Second Virginia Convention (1775)'
    points: 1
    stimulus: *ex_henry
    prompt: |
      Phrases such as “having eyes, see not,” “betrayed with a kiss” and “Peace, Peace-- but there is no peace” would have been effective with Henry's audience chiefly because they
    options:
      - |
        introduced unfamiliar ideas from foreign philosophers
      - |
        showed that Henry had studied law
      - |
        drew on biblical language the delegates knew, lending his warnings the authority of scripture and casting trust in Britain as willful blindness or betrayal
      - |
        were jokes meant to relieve the tension of the debate
    option_explanations:
      - |
        The phrases are biblical, not foreign philosophy, and their force depends on familiarity.
      - |
        They come from scripture, not from law; nothing in them displays legal training or argues from statute.
      - |
        Correct. The delegates of 1775 knew these phrases from the Bible: the blindness of those who will not see, Judas's kiss, the false prophets who cry peace. Each recasts the hopeful delegates' position in a scriptural light.
      - |
        The tone is grave throughout; the allusions intensify the warning rather than relieving it.
    answer: 2
    explanation: |
      Skill 1.B: allusions to texts the audience reveres borrow their authority. Douglass used Psalm 137 the same way.

  - slug: u02-exam-q37
    type: multiple_choice
    topic_code: "1.B"
    source: 'Patrick Henry, speech to the Second Virginia Convention (1775)'
    points: 1
    stimulus: *ex_henry
    prompt: |
      The closing sentence, “I know not what course others may take; but as for me, give me liberty or give me death!” is effective with Henry's audience chiefly because it
    options:
      - |
        stops short of dictating to his colleagues and instead models the choice he wants them to make, staking his own life on it
      - |
        threatens the delegates who disagree with him
      - |
        reveals that Henry is uncertain about his position
      - |
        summarises the economic costs of war
    option_explanations:
      - |
        Correct. Having granted his opponents' patriotism at the start, Henry ends by speaking only for himself. The personal vow puts the choice before each delegate without insulting any of them, and its starkness makes waiting look like choosing chains.
      - |
        He makes no threat; he speaks only of his own choice.
      - |
        “I know not what course others may take” concerns others, not his own certainty; the vow is absolute.
      - |
        No economic costs are mentioned; the choice is framed as liberty against death.
    answer: 0
    explanation: |
      Endings often return to the opening's relation with the audience. Henry began by respecting his opponents and ends by modelling, not ordering.

