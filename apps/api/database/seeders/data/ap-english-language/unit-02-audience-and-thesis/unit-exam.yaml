    prompt: |
      Which statement best compares how Douglass and Washington adapted their arguments to their audiences?
    options:
      - |
        Both softened their claims until no listener could object.
      - |
        Douglass confronted a sympathetic but complacent audience with its own principles, while Washington reassured a divided and partly hostile audience by appealing to its self-interest.
      - |
        Both spoke only to Black listeners.
      - |
        Washington used scripture as his main evidence, while Douglass used financial metaphors.
    option_explanations:
      - |
        Douglass's claim is uncompromising, and Washington keeps his claim for economic cooperation; neither simply removes his claim to please listeners.
      - |
        Correct. Douglass turned the Declaration and scripture against listeners who thought themselves friends of freedom; Washington framed cooperation as profitable for employers and set social equality aside.
      - |
        Douglass's Rochester audience was mostly white; Washington addressed both races and spoke to each in turn.
      - |
        The pairing is reversed: Douglass drew heavily on scripture, and Washington's metaphors of investment and interest came from business.
    answer: 1
