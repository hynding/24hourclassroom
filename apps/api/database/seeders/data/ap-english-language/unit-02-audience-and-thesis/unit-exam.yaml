    source: 'Patrick Henry, speech to the Second Virginia Convention (1775)'
    points: 1
    stimulus: *ex_henry
    prompt: |
      The questions “Shall we try argument?” and the series “We have petitioned; we have remonstrated; we have supplicated” contribute to the structure of the argument by
    options:
      - |
        introducing new alternatives that Henry recommends
      - |
        summarising the history of the colony's founding
      - |
        conceding that argument might still succeed
      - |
