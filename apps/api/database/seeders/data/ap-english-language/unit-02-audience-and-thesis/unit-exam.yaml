  - slug: u02-exam-q23
    type: short_answer
    topic_code: "4.B"
    source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
    points: 2
    stimulus: *ex_sba
    prompt: |
      Write a defensible thesis (one or two sentences) for a rhetorical analysis of this passage. Name at least two of Anthony's choices, say what they accomplish with her audience, and order them so that the thesis previews your analysis.
    answer: |
      Anthony first strips the government of the names her listeners revere, calling it not a republic but “a hateful obligarchy of sex” that reaches into every household, and then turns their own objection about pronouns into a dilemma, so that potential jurors who prize consistency and republican self-rule are left no ground for convicting her.
    explanation: |
      1 point: a defensible claim about what Anthony's choices accomplish with her audience (not a summary, a restated prompt, or a list of appeals). 1 point: at least two specific choices (the legal classification, the renaming as aristocracy, the household list, the question about citizens and subjects, the pronoun dilemma) presented in an order that previews an analysis.

  # ---- Set D: revision, a student's argument for the town newsletter
  - slug: u02-exam-q24
    type: multiple_choice
    topic_code: "3.B"
    source: written for this course
    points: 1
    stimulus: &ex_draft |
      *The following is a draft of an argument a student is writing for the town's community newsletter. Most of its readers are longtime residents, many of whom have attended the town's Fourth of July fireworks for decades.*

      (1) Every Fourth of July, our town spends about $40,000 on a twenty-minute fireworks show over Miller Pond. (2) Fireworks have been part of American celebrations since the first anniversary of independence in 1777. (3) Fireworks are loud. (4) The town should replace the fireworks with a drone light show.

      (5) Last summer, dry conditions led the fire department to stage two trucks at the pond, and a spark started a small brush fire on the east bank. (6) A drone show uses no explosives and cannot start fires. (7) Drone shows also avoid the noise that frightens pets and distresses some veterans. (8) My cousin has a dog. (9) The county animal shelter reported that calls about lost pets doubled in the week after last year's show.

      (10) A drone show would cost about the same as fireworks. (11) Several towns in our county have already switched. (12) Anyone who still wants fireworks is living in the past. (13) For all these reasons, the town should change.
    prompt: |
      Which sentence in the first paragraph is the draft's thesis?
    options:
      - |
        Sentence 4
      - |
        Sentence 1
      - |
        Sentence 2
      - |
        Sentence 3
    option_explanations:
      - |
        Correct. Sentence 4 is the only arguable claim in the paragraph, and the body paragraphs support it.
      - |
        Sentence 1 states a fact about cost; it is context, not a position.
      - |
        Sentence 2 is historical background that no one would dispute.
      - |
        Sentence 3 is a plain observation; it hints at a later point but takes no position.
    answer: 0
    explanation: |
      Skill 3.B on a draft: the thesis is the arguable claim the rest of the draft supports.

