    - slug: u02-w08-q20
      type: short_answer
      topic_code: "3.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 2
      prompt: |
        In two or three sentences, describe the central claim of the passage in which Douglass refuses to argue, and explain how the series of questions before it prepares the audience to accept it.
      answer: |
        Douglass claims that the moment calls for “scorching irony, not convincing argument,” because the case against slavery is already proved. Before saying so, he asks one question after another (must he prove the slave is a man, that man is entitled to liberty, that slavery is wrong?) and shows each point already conceded, by the slaveholders' laws or by the audience's own Declaration, so that by the time he states his claim, the demand for more argument looks like a way of avoiding the truth.
      explanation: |
        1 point: an accurate statement of the central claim (that rebuke, irony or fire, not argument, is needed because the points are already conceded). 1 point: an explanation of how the dismissed questions prepare it (each proposition shown to be granted, so further argument would be pointless or evasive). Paraphrase of the questions without linking them to the claim earns at most 1.

    - slug: u02-w08-q21
      type: short_answer
      topic_code: "4.B"
      source: general knowledge
      points: 2
      prompt: |
        Write a thesis (one or two sentences) for an essay comparing how two of the unit's speakers (Douglass, Washington, Anthony) adapt their arguments to their audiences. Your thesis should make a defensible claim about the relationship between the two speeches and preview the structure of the comparison.
      answer: |
        Washington and Anthony both face audiences with power over them, but where Washington reassures a divided crowd by presenting cooperation as profitable to everyone, Anthony confronts potential jurors with their own founding documents, so that one speech asks for goodwill and the other demands consistency.
      explanation: |
        1 point: a defensible claim about the relationship between the two speeches' audience strategies (a similarity with a significant difference, or the reverse), not two separate descriptions. 1 point: a preview of how the comparison will proceed (the points of comparison named, or a clear pattern such as similarity then difference). A thesis that only says the speeches are similar and different earns 0.

    - slug: u02-w08-q22
      type: long_answer
      topic_code: "3.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 5
      prompt: |
        Write one well-developed analytical paragraph (about 175-225 words). Make a claim about how the structure of the passage in which Douglass refuses to argue supports its central claim, and how that structure suits his audience. Support your claim with at least two short quotations from different parts of the passage and explain how each supports it.
      answer: |
        Claim: Douglass builds the passage as a string of arguments he refuses to make, so that by the time he names his method, his sympathetic but cautious listeners have no room left to ask for gentler argument. Evidence 1: answering the friendly critic who wants abolitionists to “argue more, and denounce less,” he asks, “Must I undertake to prove that the slave is a man?” and answers, “That point is conceded already.” Commentary: the slaveholders' own laws prove the point, so the argument the critic requests turns out to be unnecessary; each later question follows the same pattern, closing one exit after another. Evidence 2: “At a time like this, scorching irony, not convincing argument, is needed.” Commentary: placed after every proposition has been dismissed, the thesis arrives as a conclusion rather than a provocation. Audience link: listeners who thought of themselves as reasonable friends of freedom are led to see that asking for more proof is a way of delaying justice, which is exactly the complacency Douglass came to break.
      explanation: |
        5 points. Claim (1): an arguable claim about how the passage's structure (questions raised and dismissed, building to a statement of method) supports its central claim. Evidence (1): at least two accurate, short quotations from different parts of the passage. Commentary (2): 2 points if the commentary explains how the sequence of dismissed questions prepares the thesis, not just what each sentence says; 1 point if commentary is thin or paraphrases. Audience (1): the paragraph explains why this structure suits Douglass's listeners (sympathetic but cautious Northerners who wanted milder argument). A paragraph that discusses only devices without structure earns at most 3.
