guide: guides/week-08.md
guide_description: |
  The unit's capstone week: reading a thesis and its structure and writing one, together, with the audience in
  view. Douglass's refusal to argue the obvious as a thesis about method and a structure built from dismissed
  questions; then the three speeches of the unit compared by where and how each states its thesis. A lesson on
  matching a thesis to its body paragraphs, a revised rhetorical analysis introduction, misreadings, self-check.
flashcards_description: |
  30 cards on delayed, stated and figurative theses compared, on structures built from questions, refusals and
  syllogisms, on matching a thesis to its body, on comparison and synthesis theses, and on the passage in which
  Douglass refuses to argue.

flashcards:
  - front: Unit 2 skills 3.B and 4.B → the link between them
    back: |
      3.B reads another writer's thesis and the structure it signals; 4.B writes your own. Reading theses closely teaches you what a thesis must do: claim something arguable and tell the reader the route.
    topic_code: "4.B"
  - front: Three placements of a thesis in Unit 2's speeches
    back: |
      Stated at the outset (Anthony: “It shall be my work this evening to prove”), carried by a figure (Washington's bucket), delayed until the audience is ready (Douglass: “My subject, then”). Each placement fits its audience.
    topic_code: "3.B"
  - front: Why a speaker delays a thesis → the audience reason
    back: |
      A claim that would provoke resistance if stated first can be held back until the audience has granted the premises. Douglass praises the founders and asks questions before naming his subject.
    topic_code: "3.B"
  - front: Why a speaker states a thesis first → the audience reason
    back: |
      When the audience must judge a specific question (as Anthony's potential jurors must), stating the claim at once lets every later paragraph be heard as proof. Clarity is the strategy.
    topic_code: "3.B"
  - front: Douglass's refusal to argue → its thesis
    back: |
      “At a time like this, scorching irony, not convincing argument, is needed.” A thesis about method: the case against slavery is already proved, so what the nation needs is to be roused, not instructed.
    topic_code: "3.B"
  - front: Douglass's “where all is plain there is nothing to be argued”
    back: |
      His reply to the imagined objector who wants him to “argue more, and denounce less.” The sentence is the premise of the whole passage: the points his audience wants argued are points it already grants.
    topic_code: "3.A"
  - front: Douglass's Virginia statute evidence
    back: |
      Seventy-two crimes punishable by death for a Black man in Virginia, only two for a white man. The law punishes the slave as a responsible being, so slaveholders themselves concede “the manhood of the slave.”
    topic_code: "3.A"
  - front: Douglass's evidence from laws against teaching slaves to read
    back: |
      Southern laws forbid teaching enslaved people to read or write. No one passes such laws about animals, so the laws concede that the enslaved are people.
    topic_code: "3.A"
  - front: Douglass's series of “Must I argue” questions → structure
    back: |
      Each question raises a proposition (the slave is a man, man is entitled to liberty, slavery is wrong, slavery is not divine) and dismisses it as already conceded. The series builds to the statement of method.
    topic_code: "3.B"
  - front: Apophasis (paralipsis)
    back: |
      Emphasising something by saying you will not discuss it. Douglass's refusal to argue that slavery is wrong is itself a powerful argument that it is.
    topic_code: "3.B"
  - front: Douglass's “Is that a question for republicans?”
    back: |
      He addresses his listeners by the political identity they claim. People who believe in natural rights cannot treat the wrongfulness of slavery as an open question without contradicting themselves.
    topic_code: "1.B"
  - front: Douglass's “not light ... but fire”
    back: |
      “For it is not light that is needed, but fire; it is not the gentle shower, but thunder.” The thesis about method restated as a pair of contrasts: information versus force, gentleness versus storm.
    topic_code: "3.B"
  - front: Douglass's four parallel “the ... of the nation must be” clauses
    back: |
      Feeling quickened, conscience roused, propriety startled, hypocrisy exposed. The parallel clauses list the effects his “scorching irony” is meant to have, a preview of the denunciation that follows.
    topic_code: "3.B"
  - front: Anthony's syllogism → as a structure
    back: |
      “Are women persons?” Major premise: all persons born or naturalised here are citizens. Minor premise: women are persons. Conclusion: women are citizens whose privileges no state may abridge. The thesis becomes a chain of reasoning.
    topic_code: "3.B"
  - front: Washington's structure vs Anthony's structure
    back: |
      Washington: one command applied to two audiences in parallel. Anthony: a legal case, from first principles through founding documents to the Fourteenth Amendment. One is built by repetition, the other by logical sequence.
    topic_code: "3.B"
  - front: Thesis-body match → the revision check
    back: |
      Underline each reason in your thesis, then write the topic sentence of each body paragraph beside it. Every reason needs a paragraph; every paragraph needs a reason in the thesis. Revise whichever side is wrong.
    topic_code: "4.B"
  - front: Off-thesis paragraph → how to spot it
    back: |
      A paragraph whose topic sentence could be deleted from the essay without weakening the thesis. Biography, plot summary and general background often fail this test in rhetorical analysis.
    topic_code: "4.B"
  - front: Comparison thesis → what it must do
    back: |
      Make a claim about the relationship between two texts, not two separate claims side by side: *Both speakers build on the founding documents, but Anthony uses them as legal proof while Douglass uses them as an indictment.*
    topic_code: "4.B"
  - front: Comparison thesis → the “but” test
    back: |
      A comparison thesis usually needs a turn (but, while, whereas) that names the significant difference within a similarity, or the reverse. Without the turn it is two descriptions.
    topic_code: "4.B"
  - front: Line of reasoning (preview of Unit 3)
    back: |
      The sequence of claims that leads to the thesis. A previewing thesis names the steps; Unit 3 studies how commentary links them.
    topic_code: "4.B"
  - front: Rhetorical analysis introduction → the three parts
    back: |
      Context (writer, occasion, audience, purpose) in a sentence or two, then the thesis naming the writer's main choices and what they accomplish. The body takes the choices in the order the thesis names them.
    topic_code: "4.B"
  - front: Rhetorical analysis thesis → choices plus function
    back: |
      Not *Douglass uses questions and imagery* but *Douglass dismisses one proposition after another as already conceded, so that his audience's demand for argument looks like a demand to avoid the truth.*
    topic_code: "4.B"
  - front: Thesis and tone of the audience → Unit 2's lesson
    back: |
      The same claim can be stated softly or sharply, early or late, plainly or in a figure. The choice depends on what the audience believes and how far it must be moved. Thesis and audience are one decision.
    topic_code: "2.B"
  - front: Douglass, Washington and Anthony → their audiences compared
    back: |
      Douglass: sympathetic but complacent Northern listeners. Washington: a divided Southern crowd, partly hostile. Anthony: the men from whom her jury would come. Each thesis is shaped to its room.
    topic_code: "1.B"
  - front: Douglass, Washington and Anthony → their purposes compared
    back: |
      Douglass: to rouse the nation's conscience against slavery. Washington: to win cooperation and investment for Black economic progress. Anthony: to persuade potential jurors that she committed no crime.
    topic_code: "1.A"
  - front: Douglass's borrowed line from Garrison
    back: |
      “I will not equivocate; I will not excuse”: the promise William Lloyd Garrison made in the first issue of The Liberator (1831). Douglass quotes it without naming him, sure his antislavery audience would know it.
    topic_code: "1.B"
  - front: Synthesis thesis vs source summary
    back: |
      *Source B says homework helps* is a summary. *Homework should be limited, because its benefits shrink past an hour while its costs to sleep rise* is a thesis the sources can support.
    topic_code: "4.B"
  - front: Thesis in the conclusion → when it works
    back: |
      When the essay is built as an inquiry, the final paragraph can state the claim the evidence has earned. On the AP exam, a thesis in the conclusion is credited if it is clear and defensible, but an early thesis is safer.
    topic_code: "4.B"
  - front: “Main purpose of the passage” (3.B on Section I)
    back: |
      Stems such as *The primary purpose of the passage is to...* or *Which sentence best states the passage's central claim?* Pick the answer that covers the whole passage and is phrased as something the writer is trying to accomplish.
    topic_code: "3.B"
  - front: “Best previews the argument” (4.B on Section I)
    back: |
      The writer wants a thesis that previews the paragraphs that follow. Match each element of the option to a body paragraph; reject options that add a point the draft never makes or leave one out.
    topic_code: "4.B"

quiz:
  description: |
    22 questions · about 35 minutes · a set of seven questions on the passage in which Douglass refuses to argue
    what his audience already grants, a four-question revision set on a student's rhetorical analysis, then
    questions comparing the theses and structures of the unit's three speeches and on writing your own. Multiple
    choice, select-all and true/false items are graded at once; the fill-in-the-blank items are matched
    automatically; the two short answers and the paragraph are graded by your teacher against the model answer and
    scoring notes.
  questions:
    # ---- Passage set: Douglass refuses to argue
    - slug: u02-w08-q01
      type: multiple_choice
      topic_code: "1.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: &dg_argue |
        *The following passage is from Frederick Douglass's oration delivered at Rochester, New York, on July 5, 1852, as printed in his* My Bondage and My Freedom *(1855). Douglass has just announced that his subject is American slavery and that he will denounce it in the severest language he can command.*

        But I fancy I hear some one of my audience say, it is just in this circumstance that you and your brother abolitionists fail to make a favorable impression on the public mind. Would you argue more, and denounce less, would you persuade more and rebuke less, your cause would be much more likely to succeed. But, I submit, where all is plain there is nothing to be argued. What point in the anti-slavery creed would you have me argue? On what branch of the subject do the people of this country need light? Must I undertake to prove that the slave is a man? That point is conceded already. Nobody doubts it. The slaveholders themselves acknowledge it in the enactment of laws for their government. They acknowledge it when they punish disobedience on the part of the slave. There are seventy-two crimes in the state of Virginia, which, if committed by a black man (no matter how ignorant he be), subject him to the punishment of death; while only two of these same crimes will subject a white man to the like punishment. What is this but the acknowledgement that the slave is a moral, intellectual, and responsible being. The manhood of the slave is conceded. It is admitted in the fact that southern statute books are covered with enactments forbidding, under severe fines and penalties, the teaching of the slave to read or write.

        [...]

        Would you have me argue that man is entitled to liberty? that he is the rightful owner of his own body? You have already declared it. Must I argue the wrongfulness of slavery? Is that a question for republicans?

        [...]

        What, then, remains to be argued? Is it that slavery is not divine; that God did not establish it; that our doctors of divinity are mistaken? There is blasphemy in the thought. That which is inhuman cannot be divine. Who can reason on such a proposition! They that can, may! I cannot. The time for such argument is past.

        At a time like this, scorching irony, not convincing argument, is needed. Oh! had I the ability, and could I reach the nation’s ear, I would to-day pour out a fiery stream of biting ridicule, blasting reproach, withering sarcasm, and stern rebuke. For it is not light that is needed, but fire; it is not the gentle shower, but thunder. We need the storm, the whirlwind, and the earthquake. The feeling of the nation must be quickened; the conscience of the nation must be roused; the propriety of the nation must be startled; the hypocrisy of the nation must be exposed; and its crimes against God and man must be proclaimed and denounced.
      prompt: |
        The first two sentences of the passage (“But I fancy I hear ... much more likely to succeed”) primarily serve to
      options:
        - |
          voice an objection to Douglass's method that some listeners probably held, so that he can answer it openly
        - |
          report an actual interruption from a heckler in the hall
        - |
          concede that Douglass's speech has been unsuccessful
        - |
          introduce the views of slaveholders on abolition
      option_explanations:
        - |
          Correct. Many sympathetic Northerners thought abolitionists too harsh. By putting that complaint in the mouth of “some one of my audience,” Douglass shows that he knows it and can answer it before it quietly undermines him.
        - |
          “I fancy I hear” marks an imagined voice; Douglass is anticipating, not reporting.
        - |
          He does not concede the point; he answers it at once with “But, I submit, where all is plain there is nothing to be argued.”
        - |
          The imagined speaker wants abolitionists to succeed (“your cause would be much more likely to succeed”), so the voice is a friendly critic, not a slaveholder.
      answer: 0
      explanation: |
        Review of 1.B: an anticipated objection shows the writer's knowledge of the audience. Ask whose objection it is and why they would hold it.

    - slug: u02-w08-q02
      type: multiple_choice
      topic_code: "3.A"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: *dg_argue
      prompt: |
        Douglass's reference to the “seventy-two crimes in the state of Virginia” serves as evidence for which claim?
      options:
        - |
          Virginia's laws are harsher than those of other slave states.
        - |
          Enslaved people commit more crimes than free people.
        - |
          Slaveholders themselves acknowledge, through their laws, that the slave is a responsible human being.
        - |
          The death penalty should be abolished.
      option_explanations:
        - |
          No other state is compared; the point is about what the Virginia law reveals, not how it ranks.
        - |
          The figure counts crimes punishable by death, not crimes committed. Douglass uses it to show how the law regards the enslaved, not how they behave.
        - |
          Correct. Punishing a person for disobedience and crime treats him as “a moral, intellectual, and responsible being.” The slaveholders' own laws concede the point they pretend to dispute.
        - |
          Douglass does not argue about capital punishment as such; the unequal penalties serve as evidence about the slave's recognised humanity.
      answer: 2
      explanation: |
        Review of 3.A: match the evidence to the exact claim it supports. Here the claim (“The manhood of the slave is conceded”) comes right after the evidence.

    - slug: u02-w08-q03
      type: multiple_choice
      topic_code: "3.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: *dg_argue
      prompt: |
        Which sentence best states the central claim of the passage?
      options:
        - |
          “The slaveholders themselves acknowledge it in the enactment of laws for their government.”
        - |
          “Would you have me argue that man is entitled to liberty?”
        - |
          “There is blasphemy in the thought.”
        - |
          “At a time like this, scorching irony, not convincing argument, is needed.”
      option_explanations:
        - |
          This sentence supports one step (that the slave's manhood is conceded). It does not cover the passage's larger point about what kind of speech the moment requires.
        - |
          A question raises a proposition in order to dismiss it; it is one item in the series, not the claim the series builds toward.
        - |
          This sentence answers only the question about slavery's divinity. It is a supporting judgment, not the passage's main claim.
        - |
          Correct. Every dismissed question leads here: because the points are already conceded, the moment calls for rebuke, not proof. The sentence is the thesis of the passage, a claim about method.
      answer: 3
      explanation: |
        Skill 3.B: a thesis can come at the end of a passage, after the reasoning that earns it. Test each candidate against the whole passage.

    - slug: u02-w08-q04
      type: multiple_choice
      topic_code: "3.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: *dg_argue
      prompt: |
        Which best describes the structure of the passage?
      options:
        - |
          A chronological account of the growth of slavery, followed by a proposal
        - |
          A series of propositions raised as questions and dismissed as already settled, building to a statement of what the moment requires instead
        - |
          A comparison of two speeches by other abolitionists
        - |
          A definition of slavery followed by examples from several countries
      option_explanations:
        - |
          The passage moves through propositions, not through time. Nothing narrates slavery's history.
        - |
          Correct. Douglass takes up one proposition after another (the slave is a man, man is entitled to liberty, slavery is wrong, slavery is not divine), declares each conceded, and ends with the thesis that “scorching irony” is needed.
        - |
          No other abolitionist's speech is compared; the only other voice is the imagined listener.
        - |
          The passage never defines slavery and discusses only the United States.
      answer: 1
      explanation: |
        Structure questions ask how the parts relate. A repeated pattern (question, dismissal) that ends in a statement is a structure built toward its thesis.

    - slug: u02-w08-q05
      type: multiple_choice
      topic_code: "1.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: *dg_argue
      prompt: |
        The question “Is that a question for republicans?” is effective with Douglass's audience primarily because it
      options:
        - |
          appeals to the political identity his listeners claimed, implying that believers in natural rights cannot treat slavery's wrongfulness as an open question
        - |
          asks listeners to declare their party membership
        - |
          suggests that only members of one political party oppose slavery
        - |
          admits that the question is too difficult to settle in a speech
      option_explanations:
        - |
          Correct. Lower-case “republicans” means citizens of a republic founded on natural rights. Douglass uses the identity his audience is proud of to make their demand for argument look like a betrayal of it.
        - |
          The question is rhetorical; no one is asked to answer, and lower-case “republicans” names a political creed, not a party roll call.
        - |
          The word refers to all who believe in republican government, which is the whole celebrating audience, not one party.
        - |
          He says the opposite: the question is so plainly settled that arguing it would be absurd.
      answer: 0
      explanation: |
        Review of 1.B: addressing an audience by the identity it values can turn that value into a premise.

    - slug: u02-w08-q06
      type: multiple_choice
      topic_code: "3.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      stimulus: *dg_argue
      prompt: |
        The sentence “For it is not light that is needed, but fire; it is not the gentle shower, but thunder” functions in relation to the passage's central claim by
      options:
        - |
          introducing a new claim about the weather on the day of the speech
        - |
          contradicting the claim that argument is unnecessary
        - |
          restating the claim in figurative pairs that contrast instruction with force
        - |
          offering statistical support for the claim
      option_explanations:
        - |
          The contrasts are figurative. Light and shower stand for gentle instruction; fire and thunder for force.
        - |
          The sentence agrees with the claim: light (argument) is not what is needed.
        - |
          Correct. “Not convincing argument” becomes “not light,” and “scorching irony” becomes “fire” and “thunder.” The thesis is restated twice in images that are easier to feel than the abstract sentence.
        - |
          There are no figures in the sentence; its support is imaginative, not numerical.
      answer: 2
      explanation: |
        A restatement in figurative language reinforces a thesis. Recognising it helps you confirm which sentence is the thesis.

    - slug: u02-w08-q07
      type: multi_select
      topic_code: "3.A"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 3
      partial_credit: true
      stimulus: *dg_argue
      prompt: |
        Which propositions does Douglass present as already conceded, and therefore not in need of argument? Select all that apply.
      options:
        - |
          That the slave is a man
        - |
          That man is entitled to liberty and owns his own body
        - |
          That the nation's celebrations are sincere
        - |
          That slavery is wrong
      option_explanations:
        - |
          Correct. “That point is conceded already. Nobody doubts it,” and the slaveholders' laws prove it.
        - |
          Correct. “You have already declared it”: the audience's own Declaration affirms it.
        - |
          Douglass treats the celebrations as anything but sincere; he calls for the nation's “hypocrisy” to be exposed.
        - |
          Correct. “Must I argue the wrongfulness of slavery? Is that a question for republicans?” He treats it as settled.
      answer: [0, 1, 3]
      explanation: |
        Review of 3.A: some claims are argued, others are presented as granted. Notice which is which, and who is said to have granted them.

    # ---- Revision set: a student's rhetorical analysis
    - slug: u02-w08-q08
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: &w08_draft |
        *The following is the draft opening and the topic sentences of a rhetorical analysis a student is writing on Booker T. Washington's Atlanta Exposition address (1895).*

        Introduction: (1) In 1895 Booker T. Washington spoke at the Cotton States and International Exposition in Atlanta to a crowd of white and Black Southerners and Northern visitors. (2) His goal was to win support for the economic progress of Black Southerners at a time of growing hostility. (3) Washington uses many rhetorical strategies in his speech.

        Body paragraph 1: (4) Washington's parable of the ship gives both audiences a single command to remember.

        Body paragraph 2: (5) Washington appeals to white employers' self-interest by describing Black workers as loyal and free of strikes.

        Body paragraph 3: (6) Washington was born into slavery in Virginia and later studied at Hampton Institute.

        Body paragraph 4: (7) Washington's image of the fingers and the hand compresses his compromise into one memorable picture.
      prompt: |
        The writer wants to replace sentence 3 with a thesis that makes a defensible claim and previews the body paragraphs. Which version best accomplishes this goal?
      options:
        - |
          Washington's speech was very successful and made him famous.
        - |
          Washington uses ethos, pathos and logos to persuade his audience.
        - |
          Washington's life story explains why he gave this speech.
        - |
          Through a parable both audiences could remember, an appeal to employers' self-interest and an image that compresses his compromise, Washington wins a divided audience's support for economic cooperation.
      option_explanations:
        - |
          The sentence evaluates the speech's reception but names no choices and previews none of the body paragraphs.
        - |
          A device list could describe any speech; it makes no specific claim and matches none of the topic sentences.
        - |
          This matches only the off-topic biography paragraph and makes a claim about motive, not about rhetorical choices.
        - |
          Correct. The thesis names three choices in the order of the strong body paragraphs (parable, appeal to employers, fingers-and-hand image) and says what they accomplish for this audience.
      answer: 3
      explanation: |
        A previewing thesis must match the body paragraphs that deserve to stay. Build the thesis from the strong topic sentences.

    - slug: u02-w08-q09
      type: multiple_choice
      topic_code: "3.B"
      source: written for this course
      points: 1
      stimulus: *w08_draft
      prompt: |
        Which body paragraph does the least to support a thesis about Washington's rhetorical choices?
      options:
        - |
          Body paragraph 3 (sentence 6)
        - |
          Body paragraph 1 (sentence 4)
        - |
          Body paragraph 2 (sentence 5)
        - |
          Body paragraph 4 (sentence 7)
      option_explanations:
        - |
          Correct. Sentence 6 offers biography, not analysis of a choice in the speech. Unless the writer connects Washington's background to a specific choice and its effect, the paragraph does not support the thesis.
        - |
          The parable is a central rhetorical choice; this paragraph supports the thesis directly.
        - |
          The appeal to employers is a choice aimed at part of the audience; it belongs in the analysis.
        - |
          The closing image is a rhetorical choice with a clear function; it belongs in the analysis.
      answer: 0
      explanation: |
        Review of 3.B on a draft: every paragraph should serve the thesis. Biography and summary are the usual off-thesis paragraphs in rhetorical analysis.

    - slug: u02-w08-q10
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: *w08_draft
      prompt: |
        The writer wants to support the claim in sentence 5 with evidence from the speech. Which choice would best accomplish this goal?
      options:
        - |
          A statement that Washington was nervous before the speech
        - |
          A quotation in which Washington describes workers who have labored “without strikes and labour wars” and urges employers to hire them rather than immigrants
        - |
          The date and place of the Exposition
        - |
          A description of the applause after the speech
      option_explanations:
        - |
          Washington's nerves are context, not evidence of an appeal to employers' self-interest.
        - |
          Correct. The quotation shows the choice the paragraph claims: an appeal to employers' economic interest and their wariness of unfamiliar labor.
        - |
          The date and place belong in the introduction's context; they do not show an appeal to self-interest.
        - |
          The applause shows that the speech was well received, not how this particular appeal works.
      answer: 1
      explanation: |
        Review of 4.A: evidence for a claim about a rhetorical choice is usually a quotation showing that choice.

    - slug: u02-w08-q11
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *w08_draft
      prompt: |
        The writer's teacher, who will read the essay, has asked students to show that they understand the speech's audience. Which revision of sentence 1 would best meet this request?
      options:
        - |
          In 1895 Booker T. Washington gave a very famous speech.
        - |
          Washington was a great speaker who knew how to talk to people.
        - |
          Speeches were very common in the nineteenth century.
        - |
          In 1895 Booker T. Washington addressed a divided crowd at the Atlanta Exposition: white Southern officials wary of Black progress, Black Southerners hoping for a champion, and Northern visitors whose money and opinion mattered.
      option_explanations:
        - |
          “Very famous” says nothing about who heard the speech or what they believed.
        - |
          The sentence praises the speaker but names no audience and none of its beliefs or needs.
        - |
          A general observation about the century tells the reader nothing about this audience.
        - |
          Correct. The revision names each part of the audience and what it wanted or feared, which prepares for analysis of choices aimed at each.
      answer: 3
      explanation: |
        Review of 2.B: showing understanding of an audience means naming its beliefs, values or needs specifically.

    # ---- Across the unit
    - slug: u02-w08-q12
      type: multiple_choice
      topic_code: "3.B"
      source: general knowledge
      points: 1
      prompt: |
        Which statement best compares how the unit's three speeches present their theses?
      options:
        - |
          Anthony states her thesis at the outset, Washington carries his in a parable he repeats, and Douglass delays naming his subject until his audience has been prepared.
        - |
