week: 8
unit: 2
title: Thesis, Structure and Audience in Three Speeches
topics: ["3.B", "4.B"]
texts:
  - author: Frederick Douglass
    title: What to the Slave Is the Fourth of July? (extract from the oration at Rochester, July 5, 1852, printed in My Bondage and My Freedom, 1855)
    year: 1852
    url: https://www.gutenberg.org/ebooks/202
  - author: Booker T. Washington
    title: Atlanta Exposition Address (1895; printed in Up from Slavery, 1901)
    year: 1895
    url: https://www.gutenberg.org/ebooks/2376
  - author: Susan B. Anthony
    title: Is It a Crime for a United States Citizen to Vote? (1873; printed in An Account of the Proceedings on the Trial of Susan B. Anthony, 1874)
    year: 1873
