    - slug: u02-w08-q15
      type: true_false
      topic_code: "3.B"
      source: 'Frederick Douglass, "What to the Slave Is the Fourth of July?" (1852)'
      points: 1
      prompt: |
        True or false: Douglass's refusal to argue that the slave is a man, that man is entitled to liberty and that slavery is wrong is itself a way of arguing those points.
      answer: true
      explanation: |
        True. By insisting that each proposition is already conceded, and by showing, through the Virginia statutes and the laws against teaching slaves to read, that the slaveholders themselves concede it, Douglass makes the case while claiming not to. The device is called apophasis or paralipsis.

