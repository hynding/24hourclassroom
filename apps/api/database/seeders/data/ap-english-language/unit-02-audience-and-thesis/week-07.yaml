week: 7
unit: 2
title: Writing a Defensible Thesis with Susan B. Anthony's 1873 Speech
topics: ["4.B"]
texts:
  - author: Susan B. Anthony
    title: Is It a Crime for a United States Citizen to Vote? (address delivered in Monroe and Ontario counties before her trial, 1873; printed in An Account of the Proceedings on the Trial of Susan B. Anthony, 1874)
    year: 1873
    url: https://www.gutenberg.org/ebooks/18281
guide: guides/week-07.md
guide_description: |
  How to write a thesis that requires proof or defense and, where it helps, previews the structure of the argument.
  Susan B. Anthony's 1873 speech, given across two counties before her trial for voting, as the model: a speaker
  under indictment who opens by announcing exactly what she will prove and on what authority. A lesson on turning
  topics, facts and formulas into defensible theses, with weak and strong examples, misreadings, self-check.
flashcards_description: |
  30 cards on writing a thesis that requires defense (arguable, specific, previewing), on the faults of weak
  theses, on thesis statements for each of the three AP essays, and on the case, audience and key lines of
  Anthony's speech.

flashcards:
  - front: Skill 4.B → what it asks a writer to do
    back: |
      Write a thesis statement that requires proof or defense and that may preview the structure of the argument. Two tests: could a reasonable reader disagree, and does the sentence tell the reader where the argument is going?
    topic_code: "4.B"
  - front: “Requires proof or defense” → the test
    back: |
      Imagine a skeptical reader saying *prove it*. If the sentence is a fact, a summary or a topic, there is nothing to prove. If it is a claim someone could reasonably deny, it needs an argument.
    topic_code: "4.B"
  - front: Defensible thesis vs merely arguable thesis
    back: |
      Arguable: someone could disagree. Defensible: you can actually support it with the evidence available. A wild claim is arguable but not defensible; a fact is defensible but not arguable. A thesis must be both.
    topic_code: "4.B"
  - front: Weak thesis fault → the restated prompt
    back: |
      Repeating the prompt's words (*Anthony uses rhetorical choices to make her argument*) makes no claim of your own. On the AP rubric, a restated prompt earns no thesis point.
    topic_code: "4.B"
  - front: Weak thesis fault → the device list
    back: |
      *Anthony uses ethos, pathos and logos.* A list of labels says nothing about what the choices accomplish. Name the choices and say what they do for the purpose and audience.
    topic_code: "4.B"
  - front: Weak thesis fault → the announcement
    back: |
      *In this essay I will discuss whether voting should be required.* An announcement of topic is not a position. Replace “discuss whether” with the answer.
    topic_code: "4.B"
  - front: Weak thesis fault → too broad
    back: |
      *Voting is important in a democracy.* True, vague and unprovable in an essay. Narrow it to a specific claim about a specific question.
    topic_code: "4.B"
  - front: Weak thesis fault → vague evaluation
    back: |
      *Anthony's speech is very effective.* Effective how, for whom, by what means? Replace the vague praise with a claim about what the speech does and how.
    topic_code: "4.B"
  - front: The “because” test for a thesis
    back: |
      Add “because” and see whether reasons follow: *Voting should be compulsory because...* If no reasons can follow, the sentence is a fact or a topic. If several can, they may become your preview.
    topic_code: "4.B"
  - front: Thesis preview → list form
    back: |
      Names the reasons in the order the essay will develop them: *X, because A, B and C.* Clear and safe, especially under time pressure; the body must follow the same order.
    topic_code: "4.B"
  - front: Thesis preview → pattern form
    back: |
      Signals a pattern rather than listing reasons: *Although A, B,* previews a concession then a response; *not only A but B* previews two claims in sequence.
    topic_code: "4.B"
  - front: Rhetorical analysis thesis (Q2) → the formula to beat
    back: |
      Name the writer, the purpose and the main choices, and say what the choices do for the audience: *Anthony turns the founding documents her listeners revere into evidence that she committed no crime.*
    topic_code: "4.B"
  - front: Argument thesis (Q3) → what it must do
    back: |
      Take a clear position on the prompt's question, ideally with the reasoning that will support it. A qualified position (*yes, but only when...*) is welcome if it is still a position.
    topic_code: "4.B"
  - front: Synthesis thesis (Q1) → what it must do
    back: |
      Take a position on the issue the sources discuss, not on the sources themselves. The sources are your evidence, so the thesis names your claim, not “Source A says.”
    topic_code: "4.B"
  - front: Thesis length on the AP exam
    back: |
      One or two sentences, in one place (usually the introduction, sometimes the conclusion). A thesis split across paragraphs or buried in the middle may not be credited.
    topic_code: "4.B"
  - front: Anthony's 1873 speech → the occasion
    back: |
      Indicted for voting in the presidential election of November 5, 1872, in Rochester's 8th ward, Anthony toured Monroe County and then Ontario County before her trial, giving the same address in town after town.
    topic_code: "1.A"
  - front: Anthony's 1873 speech → her audience
    back: |
      Ordinary residents of the two counties, every man among them a possible juror. She addressed them as “Friends and Fellow-citizens,” claiming a citizenship they shared.
    topic_code: "1.B"
  - front: Anthony's 1873 speech → the opening thesis sentence
    back: |
      She will “prove” that in voting she “not only committed no crime, but, instead, simply exercised my citizen's right,” guaranteed by the National Constitution “beyond the power of any State to deny.”
    topic_code: "3.B"
  - front: Anthony's “not only ... but, instead” → what it previews
    back: |
      Two claims to be proven in order: first, that no crime was committed; second, that voting was a right she already held. The construction moves from defence to assertion.
    topic_code: "4.B"
  - front: Anthony's “beyond the power of any State to deny”
    back: |
      The phrase names the legal ground of the argument: national citizenship under the federal Constitution, not state law. It previews the long section on the Fourteenth Amendment.
    topic_code: "4.B"
  - front: Anthony's “the old dogma that governments can give rights”
    back: |
      “We throw to the winds” it, she says: rights exist before governments, which only secure them. If government does not grant rights, it cannot withhold the vote.
    topic_code: "3.A"
  - front: Anthony's reading of “We, the people”
    back: |
      “It was we, the people, not we, the white male citizens, nor yet we, the male citizens; but we, the whole people, who formed this Union.” The repetition narrows, then widens, the phrase to include women.
    topic_code: "3.A"
  - front: Anthony's “obligarchy of sex”
    back: |
      Her term (spelled so in the 1874 printing) for a government in which men rule women: “a hateful obligarchy of sex,” worse, she says, than rule by wealth, learning or race, because it enters every home.
    topic_code: "3.A"
  - front: “Are women persons?” → Anthony's syllogism
    back: |
      The Fourteenth Amendment protects the privileges of all “persons” born or naturalised here as citizens; women are persons; therefore women are citizens whose privileges, including voting, no state may abridge.
    topic_code: "3.A"
  - front: Anthony's trial → venue and verdict
    back: |
      Moved to Canandaigua in Ontario County, June 17-18, 1873. Judge Ward Hunt directed the jury to find her guilty and fined her one hundred dollars and costs.
    topic_code: "1.A"
  - front: Anthony's response to her sentence
    back: |
      “May it please your honor, I shall never pay a dollar of your unjust penalty.” She never paid, and the government never forced collection.
    topic_code: "1.A"
  - front: Anthony's use of the founders → why it suits her audience
    back: |
      Her listeners revered the Declaration and the Constitution. By building her case on their words, she made a vote for conviction look like a vote against the founders.
    topic_code: "1.B"
  - front: Moving from a topic to a thesis → three steps
    back: |
      1. Ask a question about the topic. 2. Answer it with a position. 3. Add the main reason or reasons. *Compulsory voting* → *Should voting be required?* → *Voting should not be required, because...*
    topic_code: "4.B"
  - front: Thesis and audience → one adjustment
    back: |
      A thesis for a skeptical audience may name the concession it will answer (*Although fines may seem harsh...*). The same claim, previewed for the reader who will resist it.
    topic_code: "2.B"
  - front: Revision items on a thesis (Section I)
    back: |
      Stems such as *Which version of the underlined sentence best states the main claim of the passage?* or *best previews the argument that follows.* Choose the version that is arguable and matches the body, not the most dramatic one.
    topic_code: "4.B"

quiz:
  description: |
    22 questions · about 35 minutes · a set of seven questions on the opening of Anthony's 1873 speech, a
    four-question revision set on a student's thesis, then questions on writing and judging thesis statements, with
    review of audience, thesis identification, claims and the rhetorical situation. Multiple choice, select-all and
    true/false items are graded at once; the fill-in-the-blank items are matched automatically; the two short answers
    and the introduction are graded by your teacher against the model answer and scoring notes.
  questions:
    # ---- Passage set: the opening of Anthony's speech
    - slug: u02-w07-q01
      type: multiple_choice
      topic_code: "1.A"
      source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
      points: 1
      stimulus: &sba_open |
        *The following passage is from the address Susan B. Anthony delivered in towns across Monroe and Ontario counties, New York, in 1873, while awaiting trial for having voted in the presidential election of November 1872. The text is from* An Account of the Proceedings on the Trial of Susan B. Anthony *(1874).*

        *Friends and Fellow-citizens*: I stand before you to-night, under indictment for the alleged crime of having voted at the last Presidential election, without having a lawful right to vote. It shall be my work this evening to prove to you that in thus voting, I not only committed no crime, but, instead, simply exercised my *citizen's right*, guaranteed to me and all United States citizens by the National Constitution, beyond the power of any State to deny.

        Our democratic-republican government is based on the idea of the natural right of every individual member thereof to a voice and a vote in making and executing the laws. We assert the province of government to be to secure the people in the enjoyment of their unalienable rights. We throw to the winds the old dogma that governments can give rights. Before governments were organized, no one denies that each individual possessed the right to protect his own life, liberty and property. And when 100 or 1,000,000 people enter into a free government, they do not barter away their natural rights; they simply pledge themselves to protect each other in the enjoyment of them, through prescribed judicial and legislative tribunals. They agree to abandon the methods of brute force in the adjustment of their differences, and adopt those of civilization.

        Nor can you find a word in any of the grand documents left us by the fathers that assumes for government the power to create or to confer rights. The Declaration of Independence, the United States Constitution, the constitutions of the several states and the organic laws of the territories, all alike propose to protect the people in the exercise of their God-given rights. Not one of them pretends to bestow rights.

        [...]

        It was we, the people, not we, the white male citizens, nor yet we, the male citizens; but we, the whole people, who formed this Union. And we formed it, not to give the blessings of liberty, but to secure them; not to the half of ourselves and the half of our posterity, but to the whole people--women as well as men. And it is downright mockery to talk to women of their enjoyment of the blessings of liberty while they are denied the use of the only means of securing them provided by this democratic-republican government--the ballot.
      prompt: |
        The first sentence of the passage establishes the exigence of the speech chiefly by
      options:
        - |
          describing the history of the woman suffrage movement
        - |
          announcing that the speaker has decided to run for public office
        - |
          thanking the audience for attending despite the weather
        - |
          stating the speaker's situation: she has been indicted for voting and must answer the charge
      option_explanations:
        - |
          The sentence says nothing about the movement's history; it concerns one woman and one charge.
        - |
          No candidacy is mentioned. The speaker is a defendant, not a candidate.
        - |
          The sentence opens with a formal address and moves straight to the indictment; there are no thanks or pleasantries.
        - |
          Correct. “I stand before you to-night, under indictment” names the problem that calls for the speech: a criminal charge for an act she considers a right.
      answer: 3
      explanation: |
        Review of 1.A: the exigence is often stated outright at the start. Anthony's is unusually personal: she is the case.

    - slug: u02-w07-q02
      type: multiple_choice
      topic_code: "3.B"
      source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
      points: 1
      stimulus: *sba_open
      prompt: |
        Which best states the overarching thesis that Anthony announces in the first paragraph?
      options:
        - |
          In voting she committed no crime but exercised a right that the national Constitution guarantees to every citizen and that no state may deny.
        - |
          The presidential election of 1872 was conducted unfairly.
        - |
          Women should be allowed to vote in state elections but not in national ones.
        - |
          Governments should create new rights for women through legislation.
      option_explanations:
        - |
          Correct. “It shall be my work this evening to prove to you” introduces the claim directly: no crime, a citizen's right, guaranteed nationally, “beyond the power of any State to deny.”
        - |
          Anthony does not dispute how the election was run; she disputes whether her own vote was a crime.
        - |
          She claims the right for all citizens under the national Constitution, the opposite of limiting it to state elections.
        - |
          The second paragraph rejects “the old dogma that governments can give rights.” Her claim is that the right already exists.
      answer: 0
      explanation: |
        Review of 3.B: when a writer says “It shall be my work ... to prove,” the thesis follows. Restate it completely, including the ground it names.

    - slug: u02-w07-q03
      type: multiple_choice
      topic_code: "4.B"
      source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
      points: 1
      stimulus: *sba_open
      prompt: |
        The construction “I not only committed no crime, but, instead, simply exercised my *citizen's right*” contributes to the thesis primarily by
      options:
        - |
          admitting that she may have committed a minor crime
        - |
          suggesting that the charge against her is too trivial to discuss
        - |
          previewing two claims in sequence, a defence against the charge followed by a positive assertion of right
        - |
          shifting attention from her own case to the cases of other women
      option_explanations:
        - |
          “Committed no crime” is a flat denial; nothing in the sentence concedes even a minor offence.
        - |
          She treats the charge seriously enough to devote an evening's proof to it. “Simply” describes the act of voting, not the charge.
        - |
          Correct. “Not only ... but, instead” moves from defence (no crime) to assertion (a right she already holds), telling the audience that the argument will go beyond acquittal to a claim about citizenship.
        - |
          Her case remains the centre; other women enter only as fellow citizens (“all United States citizens”), not as a change of subject.
      answer: 2
      explanation: |
        Skill 4.B: a thesis can preview structure through its grammar. Correlative constructions such as “not only ... but” promise two parts in order.

    - slug: u02-w07-q04
      type: multiple_choice
      topic_code: "3.A"
      source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
      points: 1
      stimulus: *sba_open
      prompt: |
        In the third paragraph, Anthony supports her claim that government cannot confer rights chiefly by
      options:
        - |
          quoting legal experts who disagree with her
        - |
          surveying the nation's founding and governing documents and observing that none of them claims the power to bestow rights
        - |
          describing her own experience at the polls
        - |
          comparing the United States to European monarchies
      option_explanations:
        - |
          No expert is quoted in this paragraph, and certainly none who disagrees with her.
        - |
          Correct. She lists the Declaration, the Constitution, the state constitutions and territorial laws, and concludes, “Not one of them pretends to bestow rights.” The evidence is the documents themselves.
        - |
          Her vote is mentioned only in the first paragraph; the third offers documentary evidence, not personal narrative.
        - |
          No foreign government is compared in this paragraph; it stays with American documents.
      answer: 1
      explanation: |
        Review of 3.A: identify the kind of evidence. Anthony's is the audience's own founding texts, which also serves her audience strategy.

    - slug: u02-w07-q05
      type: multiple_choice
      topic_code: "1.B"
      source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
      points: 1
      stimulus: *sba_open
      prompt: |
        Anthony's audience included men who might sit on the jury at her trial. Her use of “we” in the second paragraph (“We assert,” “We throw to the winds”) most likely serves to
      options:
        - |
          speak only for the women who voted with her
        - |
          distance herself from the principles of American government
        - |
          suggest that her listeners have already convicted her
        - |
          align herself with her listeners as fellow citizens who share the same republican principles
      option_explanations:
        - |
          The “we” of this paragraph is the nation and its political creed (“Our democratic-republican government”), not a small group of women.
        - |
          She embraces those principles; her whole argument depends on them.
        - |
          Nothing in the paragraph suggests a prior verdict; she addresses the audience as people whose judgment is still open.
        - |
          Correct. Speaking as one of “we” who hold that government only secures rights, Anthony makes her case a matter of principles the potential jurors already profess, so convicting her would mean disowning them.
      answer: 3
      explanation: |
        Review of 1.B: shared pronouns place writer and audience on one side. Ask what principle the “we” is made to hold.

    - slug: u02-w07-q06
      type: multiple_choice
      topic_code: "3.A"
      source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
      points: 1
      stimulus: *sba_open
      prompt: |
        In the last paragraph, the sequence “not we, the white male citizens, nor yet we, the male citizens; but we, the whole people” functions primarily to
      options:
        - |
          interpret the Constitution's opening words so that they must include women, by rejecting narrower readings one at a time
        - |
          admit that the framers intended to exclude women
        - |
          list the groups who voted in the 1872 election
        - |
          change the subject from rights to taxation
      option_explanations:
        - |
          Correct. Anthony takes the Preamble's phrase as evidence and rules out two restrictive readings before giving her own. The repetition makes the inclusive reading feel like the only honest one.
        - |
          She argues the opposite: “we, the whole people, who formed this Union.”
        - |
          The sequence describes who formed the Union, not who voted in 1872.
        - |
          Taxation is not mentioned here; the paragraph ends on “the ballot.”
      answer: 0
      explanation: |
        Review of 3.A: evidence often needs interpretation. Anthony's commentary on “we, the people” is what makes the quotation prove her claim.

    - slug: u02-w07-q07
      type: multi_select
      topic_code: "4.B"
      source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
      points: 3
      partial_credit: true
      stimulus: *sba_open
      prompt: |
        Which features make the thesis in Anthony's first paragraph a strong model for skill 4.B? Select all that apply.
      options:
        - |
          It takes a position that a reasonable listener (or a court) could dispute, so it requires proof.
        - |
          It names the authority on which the proof will rest, the National Constitution.
        - |
          It avoids taking a position so that no listener will be offended.
        - |
          It announces two claims, no crime and a citizen's right, that the argument will establish in turn.
      option_explanations:
        - |
          Correct. The federal government had indicted her, so her claim was very much in dispute. It is the opposite of a fact everyone accepts.
        - |
          Correct. “Guaranteed ... by the National Constitution, beyond the power of any State to deny” tells the audience what kind of evidence is coming.
        - |
          The thesis takes a bold, contested position; it does not hedge to avoid offence.
        - |
          Correct. The “not only ... but” structure previews the order of the argument.
      answer: [0, 1, 3]
      explanation: |
        A strong thesis is contestable, grounded and, where helpful, a map. Anthony's has all three in one sentence.

    # ---- Revision set: a student's thesis
    - slug: u02-w07-q08
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: &w07_draft |
        *The following is the draft introduction of an argument a student is writing for a civics class in response to the question of whether her city should allow sixteen- and seventeen-year-olds to vote in city elections. Her body paragraphs argue (a) that sixteen-year-olds already work, pay sales tax and drive under city rules, (b) that people who vote in their first eligible election tend to keep voting, and (c) that the main objection, immaturity, applies equally to many adult voters.*

        (1) Voting is one of the most important rights in a democracy. (2) Some cities in other states have lowered the voting age for local elections. (3) In 1971 the Twenty-Sixth Amendment lowered the national voting age from twenty-one to eighteen. (4) Today, many people have different opinions about whether teenagers should vote. (5) In this essay I will discuss the question of lowering the voting age in our city.
      prompt: |
        The writer wants to replace sentence 5 with a thesis that takes a clear, defensible position. Which version best accomplishes this goal?
      options:
        - |
          The voting age is an interesting topic that everyone should learn more about.
        - |
          There are many arguments on both sides of the question of lowering the voting age.
        - |
          Our city should allow sixteen- and seventeen-year-olds to vote in city elections.
        - |
          Teenagers are the smartest people in our city and deserve to run it.
      option_explanations:
        - |
          The sentence names a topic and praises it; it takes no position, so there is nothing to defend.
        - |
          This describes the debate without entering it. A thesis must choose.
        - |
          Correct. The sentence takes a clear position on the question that a reasonable reader could dispute, and the body paragraphs can defend it.
        - |
          The sentence is arguable but not defensible: no evidence could prove that teenagers are the smartest residents, and the essay argues for voting, not for running the city.
      answer: 2
      explanation: |
        Skill 4.B: a thesis must be arguable and defensible. Topics and summaries of the debate fail the first test; wild overstatement fails the second.

    - slug: u02-w07-q09
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: *w07_draft
      prompt: |
        The writer wants her thesis to preview the three body paragraphs described in the note above the draft. Which version best accomplishes this goal?
      options:
        - |
          Our city should lower the voting age for many good reasons, which I will explain below.
        - |
          Because sixteen-year-olds already live under city rules, because early voters become lifelong voters, and because the charge of immaturity applies to many adults as well, our city should let sixteen- and seventeen-year-olds vote in city elections.
        - |
          Our city should lower the voting age, since young people are the future.
        - |
          Lowering the voting age in our city would be good, bad or both, depending on how one looks at it.
      option_explanations:
        - |
          “Many good reasons” promises reasons without naming any; the reader cannot predict the body.
        - |
          Correct. The thesis takes a position and names the three reasons in the order the body paragraphs develop them: living under city rules, lasting voting habits, the immaturity objection.
        - |
          “Young people are the future” is a slogan that matches none of the three body paragraphs.
        - |
          The sentence refuses to take a position, so it is not a thesis at all.
      answer: 1
      explanation: |
        A preview must match the body. Check each reason in the thesis against the paragraph plan.

    - slug: u02-w07-q10
      type: multiple_choice
      topic_code: "3.B"
      source: written for this course
      points: 1
      stimulus: *w07_draft
      prompt: |
        As the draft now stands, which statement best describes its introduction?
      options:
        - |
          Sentence 1 is a defensible thesis that previews the argument.
        - |
          Sentence 3 is the thesis, because it contains a specific date.
        - |
          Sentence 4 states the writer's position on the question.
        - |
          The introduction has no thesis: its sentences offer a general truth, facts and an announcement of topic, but no position.
      option_explanations:
        - |
          Sentence 1 is a general truth that almost no one would dispute; it does not address the city question.
        - |
          Specificity does not make a sentence a thesis. Sentence 3 is a historical fact, useful as context.
        - |
          Sentence 4 reports that opinions differ; it does not say which opinion the writer holds.
        - |
          Correct. Every sentence either states something no one disputes or announces the topic. The reader cannot tell what the writer will argue.
      answer: 3
      explanation: |
        Review of 3.B: to find a thesis, look for a position. An introduction can be full of relevant sentences and still lack one.

    - slug: u02-w07-q11
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *w07_draft
      prompt: |
        The writer will read her essay aloud at a city council meeting, where several members have said that sixteen-year-olds are too young to vote responsibly. Which sentence, added just before her thesis, would best show an understanding of this audience?
      options:
        - |
          Members of the council are right to ask whether new voters will take the responsibility seriously, and that question deserves a direct answer.
        - |
          Council members who disagree are simply out of touch with young people.
        - |
          Everyone my age agrees with me.
        - |
          The council should stop worrying and listen to students for once.
      option_explanations:
        - |
          Correct. The sentence grants the council's concern as a fair question and promises to answer it, which prepares for the third body paragraph and keeps skeptical members listening.
        - |
          Dismissing opponents as out of touch insults the audience whose votes the writer needs.
        - |
          A claim of universal agreement is unprovable and ignores the council's concern.
        - |
          Telling the audience to stop worrying dismisses its concern instead of answering it.
      answer: 0
      explanation: |
        Review of 2.B: a thesis lands better when the reader who will resist it hears its concern acknowledged first.

    # ---- Writing and judging theses
    - slug: u02-w07-q12
      type: multiple_choice
      topic_code: "4.B"
      source: general knowledge
      points: 1
      prompt: |
        A rhetorical analysis prompt asks students to analyse the choices Anthony makes in her 1873 speech to argue that she committed no crime. Which thesis would most likely earn the thesis point?
      options:
        - |
          Susan B. Anthony gave a speech in 1873 about voting.
        - |
          Anthony makes many rhetorical choices in her speech to argue that she committed no crime.
        - |
          By grounding her defence in the founding documents her listeners revered and reading “we, the people” to include women, Anthony turns potential jurors' patriotism into a reason to acquit her.
        - |
          Anthony's speech is very persuasive and well written.
      option_explanations:
        - |
          This is a fact of context. It makes no claim about her choices or their effect.
        - |
          This restates the prompt in different order. It names no choices and makes no claim of its own.
        - |
          Correct. The thesis names specific choices, connects them to the audience and purpose, and makes a claim a reader could dispute.
        - |
          Vague praise is not an analytical claim; it names no choices and no effect on an audience.
      answer: 2
      explanation: |
        A rhetorical analysis thesis names the writer's choices and what they accomplish for this audience and purpose.

    - slug: u02-w07-q13
      type: multiple_choice
      topic_code: "4.B"
      source: general knowledge
      points: 1
      prompt: |
        A student's thesis reads: *Anthony uses ethos, pathos and logos to persuade her audience.* Which is the most accurate criticism of this thesis?
      options:
        - |
          It is too long to count as a thesis.
        - |
          It lists categories that could describe almost any argument and says nothing about what Anthony's particular choices accomplish.
        - |
          It takes too strong a position on the issue of women's suffrage.
        - |
          It should not mention the audience.
      option_explanations:
        - |
          The sentence is short. Length is not the problem; content is.
        - |
          Correct. The labels fit nearly every persuasive text. A defensible thesis names the specific choices (the founding documents, the reading of the Preamble) and the effect they have on her listeners.
        - |
          The sentence takes no position at all on suffrage or on the speech's effect; it only classifies.
        - |
          Referring to the audience is good practice in rhetorical analysis; the problem is that the audience is not connected to any specific choice.
      answer: 1
      explanation: |
        Labels are not claims. Replace each label with the specific choice and its function.

    - slug: u02-w07-q14
      type: multi_select
      topic_code: "4.B"
      source: general knowledge
      points: 3
      partial_credit: true
      prompt: |
        Which of these sentences, written for an argument essay on whether schools should replace letter grades with written evaluations, are theses that require proof or defense? Select all that apply.
      options:
        - |
          Many schools use letter grades.
        - |
          Written evaluations should replace letter grades in ninth grade, where students most need specific feedback and least need the pressure of a transcript.
        - |
          Although written evaluations take teachers more time, they give students the specific feedback that letter grades hide, so schools should adopt them in every course.
        - |
          This essay will look at grades and evaluations.
      option_explanations:
        - |
          A fact about current practice requires no defense; no one would dispute it.
        - |
          Correct. The claim is specific, arguable and previews two reasons tied to ninth grade.
        - |
          Correct. The sentence concedes a cost and still takes a clear position, previewing a concession-and-response structure.
        - |
          An announcement of topic takes no position and so has nothing to defend.
      answer: [1, 2]
      explanation: |
        The test is always the same: could a reasonable reader disagree, and could the writer support the claim?

    - slug: u02-w07-q15
      type: true_false
      topic_code: "1.A"
      source: general knowledge
      points: 1
      prompt: |
        True or false: Susan B. Anthony was indicted for voting in the presidential election of November 1872 in Rochester, New York.
      answer: true
      explanation: |
        True. She voted in Rochester's 8th ward on November 5, 1872, was indicted under a federal statute of 1870, and gave this speech in the months before her trial in June 1873.

    - slug: u02-w07-q16
      type: true_false
      topic_code: "4.B"
      source: general knowledge
      points: 1
      prompt: |
        True or false: On the AP essay rubric, a thesis that restates the prompt without making a claim of the writer's own still earns the thesis point.
      answer: false
      explanation: |
        False. The thesis point requires a defensible claim that responds to the prompt. Restating or rephrasing the prompt, or summarising the passage, earns no point.

    - slug: u02-w07-q17
      type: fill_blank
      topic_code: "4.B"
      source: general knowledge
      points: 1
      prompt: |
        A thesis must be ____: a reasonable reader could disagree with it, so it requires proof or defense.
      answer: ["arguable", "debatable", "contestable", "disputable", "defensible"]
      explanation: |
        Facts, topics and summaries cannot be disagreed with, so they cannot be theses. The AP rubric's word is “defensible”: arguable, and supportable with evidence.

    - slug: u02-w07-q18
      type: fill_blank
      topic_code: "1.A"
      source: general knowledge
      points: 1
      prompt: |
        At Anthony's trial in June 1873, Judge Ward ____ directed the jury to return a verdict of guilty.
      answer: ["Hunt", "ward hunt"]
      explanation: |
        Judge Ward Hunt of the U.S. Supreme Court, sitting as a circuit judge, refused to let the jury deliberate and fined Anthony one hundred dollars and costs, a penalty she refused to pay.

    - slug: u02-w07-q19
      type: multiple_choice
      topic_code: "1.B"
      source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
      points: 1
      prompt: |
        According to the heading in the 1874 printing, Anthony delivered this address in twenty-nine post-office districts of Monroe County and twenty-one of Ontario County before her trial. The most likely reason for this campaign was to
      options:
        - |
          raise money to pay the fine she expected to receive
        - |
          practise the speech before delivering it in a large city
        - |
          reach the men from whom her jury would be drawn and persuade them, before the trial, that her vote was lawful
        - |
          announce her candidacy for Congress
      option_explanations:
        - |
          She later refused to pay the fine at all; nothing suggests the tour was a fundraiser.
        - |
          She gave the same speech fifty times; this was a campaign, not a rehearsal.
        - |
          Correct. Jurors would come from the county, so every audience was full of potential jurors. Knowing that, she made her legal argument directly to them.
        - |
          The speech defends her vote; it does not seek office.
      answer: 2
      explanation: |
        Review of 1.B: the audience can explain the very existence of a text. Anthony's real audience was the jury pool.

    - slug: u02-w07-q20
      type: short_answer
      topic_code: "4.B"
      source: 'Susan B. Anthony, "Is It a Crime for a United States Citizen to Vote?" (1873)'
      points: 2
      prompt: |
        Write a defensible thesis (one or two sentences) for a rhetorical analysis essay on the opening of Anthony's speech. Your thesis should name at least two of her choices and say what they accomplish for her purpose and audience.
      answer: |
        Speaking to the men who might judge her, Anthony states exactly what she will prove and then builds her proof from the Declaration, the Constitution and the Preamble's “we, the people,” so that acquitting her becomes a way for her listeners to keep faith with the founders they revere.
      explanation: |
        1 point: a defensible claim about what Anthony's choices accomplish (not a restatement of the prompt, a summary, or a list of appeals). 1 point: the thesis names at least two specific choices (announcing her thesis, appealing to founding documents, the inclusive “we,” reading the Preamble, the claim that rights precede government) and connects them to her purpose or audience.

    - slug: u02-w07-q21
      type: short_answer
      topic_code: "4.B"
      source: written for this course
      points: 2
      prompt: |
        Revise this weak thesis so that it takes a defensible position and previews at least two reasons: *Homework is a topic that students and teachers often discuss.*
      answer: |
        Our school should limit homework to one hour a night, because longer assignments crowd out sleep and family time without measurably improving grades.
      explanation: |
        1 point: the revision takes a clear, arguable position on a homework question (limit, abolish, keep, redesign). 1 point: it previews at least two reasons that could become body paragraphs. A revision that remains a topic or a summary of the debate earns 0; one with a position but no reasons earns 1.

    - slug: u02-w07-q22
      type: long_answer
      topic_code: "4.B"
      source: written for this course
      points: 4
      prompt: |
        Write the introductory paragraph (about 100-150 words) of an argument essay responding to this question: *Should voting in national elections be required by law, with a small fine for those who do not vote?* Give brief, specific context, then end with a thesis that takes a defensible position and previews the structure of your argument. You may draw on Anthony's claim that the vote is the means of securing every other right, but you need not agree with her.
      answer: |
        Model: In 1873 Susan B. Anthony called the ballot “the only means” of securing liberty, and she was prosecuted for using it. A century and a half later, millions of Americans who may vote freely choose not to; in recent presidential elections a third or more of eligible citizens have stayed home. Some democracies answer this with compulsory voting and small fines. The United States should not follow them, because a vote compelled by fear of a fine expresses no real consent, because the fine would fall hardest on the poor, and because the same goal can be reached by making voting easier rather than mandatory.
      explanation: |
        4 points. Claim (2): 1 point for a thesis that takes a clear, defensible position on compulsory voting (for, against or a qualified position) rather than describing the debate; 1 point for a preview of at least two reasons or a clear pattern (such as concession then response) that could organise the essay. Evidence (1): specific, relevant context (a fact, an example, or an accurate reference to Anthony) that leads into the thesis rather than a vague opening such as *Since the dawn of time*. Commentary (1): the introduction connects its context to the thesis, so that the reader sees why the question matters and how the position answers it. An introduction with no identifiable thesis earns at most 1.
