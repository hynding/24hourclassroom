        - |
          Police records showing that crashes involving cyclists fell from 31 to 12 in the two years after the lanes opened
        - |
          The cost of building the lanes
        - |
          A photograph of the lanes on opening day
      option_explanations:
        - |
          Enjoyment is not safety. A single cyclist's feeling is testimony about the experience, not about crash rates.
        - |
          Correct. The claim is about safety, and crash records measure safety directly, with a clear source and a before-and-after comparison.
        - |
          Cost might matter to a different claim (that the lanes were a good use of money), but it says nothing about safety.
        - |
          A photograph shows that the lanes exist, not that they reduced danger.
