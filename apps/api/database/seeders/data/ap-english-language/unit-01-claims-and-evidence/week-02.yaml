    - slug: u01-w02-q20
      type: short_answer
      topic_code: "1.A"
      source: 'Thomas Jefferson and the Continental Congress, The Declaration of Independence (1776)'
      points: 2
      prompt: |
        In one or two sentences, explain how the Declaration's audience (world opinion, including foreign nations whose help the colonies needed) helps explain why the document lists so many specific grievances instead of simply announcing independence.
      answer: |
        Foreign governments and undecided readers had no reason to accept the colonists' word that the king was a tyrant, and a rebellion that looked rash or self-interested would win no allies; so Congress laid out a long, specific list of "Facts" for "a candid world" to judge, making separation look like the reasoned response to a proven pattern of abuse.
      explanation: |
        1 point: identifies something about the audience that matters (they are outsiders, impartial or skeptical, potential allies who need convincing). 1 point: explains how that audience calls for specific, numerous evidence (to prove a pattern, to appear reasonable, to meet the "Prudence" standard). A response that only restates the list of grievances earns at most 1.

    - slug: u01-w02-q21
      type: short_answer
      topic_code: "3.A"
      source: 'Thomas Jefferson and the Continental Congress, The Declaration of Independence (1776)'
      points: 2
      prompt: |
        Choose one grievance from the Declaration (for example, "For imposing taxes on us without our Consent") and, in one or two sentences, explain how it supports the claim that the king's government has become destructive of the colonists' rights.
      answer: |
        "For imposing taxes on us without our Consent" supports the claim because the preamble says governments derive "their just powers from the consent of the governed"; taxing people who have not consented is a concrete case of power used without that consent, so the grievance shows the king's government acting against the very end governments exist to serve.
      explanation: |
        1 point: identifies an accurate grievance. 1 point: explains the link between that grievance and the claim, ideally through the principle it violates (consent, representation, trial by jury, the rule of law). Repeating the grievance in other words without explaining why it matters earns at most 1.

    - slug: u01-w02-q22
      type: long_answer
      topic_code: "3.A"
      source: 'Thomas Jefferson and the Continental Congress, The Declaration of Independence (1776)'
      points: 4
      prompt: |
        Write one well-developed paragraph (about 150-200 words) explaining how the Declaration of Independence uses evidence to support its claim that the colonies are justified in separating from Britain. Identify the claim, quote at least two pieces of evidence from different parts of the document, and explain how each supports the claim.
      answer: |
        Claim: The Declaration justifies separation by meeting the standard of proof it sets for itself: not "light and transient causes," but "a long train of abuses" showing a deliberate design. Evidence 1: the grievance that the king "has kept among us, in times of peace, Standing Armies without the Consent of our legislatures." Commentary: this act violates the preamble's own principle that just powers come "from the consent of the governed," so the fact matches the rule; the repeated *He has* piles such facts against one accused ruler until they look like a plan. Evidence 2: "Our repeated Petitions have been answered only by repeated injury." Commentary: this shows that peaceful remedies were tried and failed, which answers the reader who might think separation hasty. Concluding link: by conceding that prudence forbids rash change and then supplying both a pattern of abuse and a record of patience, the Declaration makes independence look like the reasoned last resort that a candid world would accept.
      explanation: |
        4 points. Claim (1): accurately identifies the Declaration's claim (that the king's government has become a tyranny, or that separation is justified) and makes an arguable point about how evidence supports it. Evidence (1): at least two accurate quotations from different parts of the document (preamble, grievances, petitions, conclusion). Commentary (2): 2 points if each piece of evidence is explained in relation to the claim (the principle it violates, the pattern it builds, the objection it answers); 1 point if commentary is thin or explains only one piece; 0 if the paragraph only summarises or lists grievances.
