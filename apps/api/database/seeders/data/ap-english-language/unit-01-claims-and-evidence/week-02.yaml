      explanation: |
        The test for a claim: could a reasonable person disagree? If so, it needs support. Your essay theses must always be claims in this sense.

    - slug: u01-w02-q14
      type: multiple_choice
      topic_code: "3.A"
      source: general knowledge
      points: 1
      prompt: |
        A writer claims that a town's new bike lanes have made its streets safer. Which piece of evidence would most directly support this claim?
      options:
