    - slug: u01-w04-q20
      type: short_answer
      topic_code: "3.A"
      source: 'Abraham Lincoln, Second Inaugural Address (1865)'
      points: 2
      prompt: |
        Lincoln writes that "All knew that this interest was, somehow, the cause of the war." In one or two sentences, explain how the phrase "All knew" affects the way this claim is presented to the audience, and identify one piece of evidence Lincoln gives for the claim anyway.
      answer: |
        The phrase *All knew* presents the claim as something the audience already accepts, so that agreeing with it feels like recognising a shared truth rather than being persuaded; Lincoln still supports it with evidence, noting that slaves were "not distributed generally over the Union, but localized in the Southern part of it," and that the insurgents fought to "strengthen, perpetuate, and extend" slavery while the government sought only to restrict it.
      explanation: |
        1 point: explains the effect of "All knew" (presents the claim as common knowledge or consensus, invites agreement, discourages dispute). 1 point: accurately identifies a piece of supporting evidence from the paragraph (the one-eighth figure, the localisation in the South, the opposed aims of insurgents and government).

    - slug: u01-w04-q21
      type: short_answer
      topic_code: "4.A"
      source: 'Abraham Lincoln, Second Inaugural Address (1865)'
      points: 2
      prompt: |
        Turn this observation into an analytical claim suitable as the topic sentence of a rhetorical analysis paragraph: *Lincoln ends the Second Inaugural with a list of things to do.*
      answer: |
        By ending with a list of tasks (to "bind up the nation's wounds," to care for soldiers, widows and orphans, to "achieve and cherish a just and lasting peace"), Lincoln turns his reasoning about shared guilt into concrete duties of mercy, giving a victorious audience something to do with its victory other than punish.
      explanation: |
        1 point: the claim names a specific choice (the closing list, its contents or its form). 1 point: it states an effect on the audience and connects it to purpose (reconciliation, mercy, channelling victory into care). Restating the observation in other words earns 0; naming an effect without a purpose, or vice versa, earns 1.

    - slug: u01-w04-q22
      type: long_answer
      topic_code: "4.A"
      source: 'Abraham Lincoln, Second Inaugural Address (1865)'
      points: 5
      prompt: |
        Write one well-developed rhetorical analysis paragraph (about 175-225 words). Make an analytical claim about how Lincoln prepares his audience in March 1865 to accept a peace without vengeance. Support it with at least two short quotations from different paragraphs of the address, and follow each with commentary that explains how the choice works on the audience.
      answer: |
        Claim: Lincoln prepares a victorious North to forgive by making it share the guilt of the war before he asks for mercy. Evidence 1: he observes that both sides "read the same Bible, and pray to the same God," and then checks his own condemnation of slaveholders with "let us judge not, that we be not judged." Commentary: the shared scripture denies the North exclusive claim to God's favour, and the warning applies Christ's words to Lincoln's own listeners, so that self-righteousness becomes a sin rather than a reward of victory. Evidence 2: he supposes that God "gives to both North and South this terrible war, as the woe due to those by whom the offense came." Commentary: framed as a supposition and a question, the claim lets listeners reach the conclusion themselves: if the woe falls on both, the guilt does too. Concluding link: once the North sees itself as fellow sinner, "malice toward none" follows as a duty, and mercy feels like justice rather than weakness.
      explanation: |
        5 points. Claim (1): an analytical claim about how Lincoln's choices prepare the audience for a peace without vengeance, not a summary or a list of devices. Evidence (2): 2 points for at least two accurate, short quotations from different paragraphs, smoothly integrated; 1 point for one quotation, or quotations that are inaccurate or poorly chosen for the claim. Commentary (2): 2 points if each quotation is explained in terms of its effect on the 1865 audience and the purpose; 1 point if commentary is thin, paraphrases, or covers only one quotation; 0 if the paragraph only summarises.
