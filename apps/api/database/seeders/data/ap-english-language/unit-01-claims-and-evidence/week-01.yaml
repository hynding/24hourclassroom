      type: fill_blank
      topic_code: "1.A"
      source: general knowledge
      points: 1
      prompt: |
        The specific event, problem or need that prompts a writer to produce a text at a particular moment is called the ____.
      answer: ["exigence", "the exigence", "exigency", "the exigency"]
