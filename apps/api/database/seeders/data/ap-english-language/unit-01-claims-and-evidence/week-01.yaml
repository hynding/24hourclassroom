        The exigence is the spark of the rhetorical situation. For the Gettysburg Address it was the dedication of the cemetery; for an opinion piece it might be an upcoming vote.

    - slug: u01-w01-q19
      type: fill_blank
      topic_code: "1.A"
      source: 'Abraham Lincoln, Address at Gettysburg (1863)'
      points: 1
      prompt: |
        "Fourscore and seven years ago" counts back from 1863 to the year ____, when the Declaration of Independence was adopted.
      answer: ["1776"]
      explanation: |
        A score is twenty, so fourscore and seven is 87; 1863 minus 87 is 1776. Lincoln dates the nation from the Declaration's proposition of equality.

    - slug: u01-w01-q20
      type: short_answer
      topic_code: "1.A"
      source: written for this course
      points: 2
      prompt: |
        A principal speaks at a school assembly the morning after a fire destroyed the school's gym. Identify the exigence and one likely purpose of the speech, and explain in one sentence how the audience (students who are frightened and upset) should shape one choice the principal makes.
      answer: |
        Exigence: the fire that destroyed the gym the night before. Purpose: to reassure students that everyone is safe and explain what will happen next. Because the audience is frightened, the principal should begin with the most reassuring facts (no one was hurt; classes will continue) before discussing the damage or the investigation.
      explanation: |
        1 point: a correct exigence (the fire) and a precise purpose (reassure, explain plans, ask for cooperation), not a topic ("talk about the fire"). 1 point: a specific choice (what to say first, tone, word choice, length) clearly tied to the audience's fear. A response that names components without connecting audience to a choice earns at most 1.

    - slug: u01-w01-q21
      type: short_answer
      topic_code: "1.A"
      source: 'Abraham Lincoln, Address at Gettysburg (1863)'
      points: 2
      prompt: |
        Lincoln predicts that "The world will little note, nor long remember, what we say here." In one or two sentences, explain how this prediction suits the speech's rhetorical situation.
      answer: |
        At a cemetery for soldiers who died in battle, a speaker who praised his own words would seem out of place; by predicting that the words will be forgotten while "what they did here" will not, Lincoln gives the honour of the occasion to the dead and makes his request to the living sound like a duty they share rather than a speech they are hearing.
      explanation: |
        1 point: connects the line to a specific part of the situation (a solemn ceremony, grieving listeners, honouring the dead, a speaker whose authority could seem self-serving). 1 point: explains the effect (humility, honour transferred to the dead, setting up the call to action), not only what the line means. Noting the irony that the words became famous is a fine extra but not required.

    - slug: u01-w01-q22
      type: long_answer
      topic_code: "1.A"
      source: 'Abraham Lincoln, Address at Gettysburg (1863)'
      points: 4
      prompt: |
        Write one well-developed paragraph (about 150-200 words). Make a claim about how Lincoln's choices in the Gettysburg Address respond to one or more parts of its rhetorical situation (the occasion, the audience, the moment in the war). Support it with at least two short quotations from different parts of the speech, and explain how each one shows Lincoln responding to the situation.
      answer: |
        Claim: Because he speaks at a cemetery during an unfinished war, Lincoln turns a ceremony for the dead into an obligation for the living. Evidence 1: he declares that "we cannot dedicate, we cannot consecrate, we cannot hallow this ground," because the soldiers "have consecrated it far above our power to add or detract." Commentary: denying the ceremony's power honours the grieving audience's dead and empties the occasion of its expected task, leaving room for a new one. Evidence 2: "It is for us, the living, rather to be dedicated here to the unfinished work." Commentary: the word *unfinished* reminds a wartime audience that the outcome is still in doubt, and "us, the living" includes the president among those who owe the dead a victory. Concluding link: the situation calls for a dedication, and Lincoln supplies one, but of people, not ground.
      explanation: |
        4 points. Claim (1): an arguable claim linking Lincoln's choices to a specific part of the rhetorical situation, not a summary ("Lincoln talks about the soldiers") or a list of components. Evidence (1): at least two accurate, short quotations from different parts of the speech, smoothly introduced. Commentary (2): 2 points if each quotation is explained in terms of the situation (why this choice suits this occasion, audience or moment); 1 point if commentary is present but thin, only paraphrases, or explains just one quotation; 0 if the paragraph only summarises. A paragraph that identifies components without connecting them to choices earns at most 2.
