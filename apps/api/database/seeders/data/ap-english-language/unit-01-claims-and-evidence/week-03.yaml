week: 3
unit: 1
title: Building a Claim-and-Evidence Paragraph with Franklin's Convention Speech
topics: ["4.A"]
texts:
  - author: Benjamin Franklin
    title: Speech at the close of the Federal Convention ("Final Speech of Dr. Franklin in the late Federal Convention"), in The Complete Works in Philosophy, Politics and Morals of the late Dr. Benjamin Franklin, vol. 3 (1806)
    year: 1787
    url: https://www.gutenberg.org/ebooks/48138
guide: guides/week-03.md
guide_description: |
  How to build the paragraph every AP English Language essay is made of: a claim that can be defended, evidence
  that proves its arguable part, and commentary that explains the connection. Then Benjamin Franklin's speech on
  the last day of the Constitutional Convention (1787) as a model of a short argument that persuades through
  personal experience, a comic anecdote and plain reasoning. Close readings, a step-by-step writing lesson with
  weak and revised paragraphs, common mistakes, the exam connection, self-check.
flashcards_description: |
  30 cards on the parts of an argument paragraph, kinds of commentary, integrating evidence, and the situation,
  claims and evidence of Franklin's speech to the Constitutional Convention.

flashcards:
  - front: Argument paragraph (CED skill 4.A) → its three working parts
    back: |
      A claim (the paragraph's arguable point, usually first), evidence (specific support), and commentary (explanation of how the evidence proves the claim). A closing sentence often links back to the thesis.
    topic_code: "4.A"
  - front: Topic sentence vs claim in a body paragraph
    back: |
      In AP Lang the topic sentence should BE a claim: an arguable point that the paragraph proves, not an announcement of a subject ("This paragraph is about...").
    topic_code: "4.A"
  - front: Commentary → definition
    back: |
      The writer's explanation of how and why the evidence supports the claim. It answers "so what?" and "how does this prove it?" Commentary is the part of an essay that earns evidence-and-commentary points.
    topic_code: "4.A"
  - front: Commentary vs summary
    back: |
      Summary repeats what the evidence says. Commentary explains what it shows and why it matters for the claim. *Franklin says he changed his mind* is summary; *his own record of error makes doubt look like wisdom rather than weakness* is commentary.
    topic_code: "4.A"
  - front: Ratio of commentary to evidence → a working rule
    back: |
      Write at least as many words of commentary as of quotation or data. A paragraph that is mostly evidence reads as a list; one that is mostly commentary with thin evidence reads as opinion.
    topic_code: "4.A"
  - front: Integrating a quotation → the three ways
    back: |
      Introduce it with a signal phrase (Franklin admits that...), embed a short phrase in your own sentence, or set it up with a colon after a complete sentence. Never drop a quotation in as a sentence by itself.
    topic_code: "4.A"
  - front: Signal phrase → what it does
    back: |
      A short introduction that names the source and frames the evidence: "As the survey shows," "Franklin concedes that." A precise verb (concedes, insists, warns) adds interpretation.
    topic_code: "4.A"
  - front: Specific vs vague evidence in your own paragraph
    back: |
      Specific evidence names who, what, when, how many: "186 signatures in two days." Vague evidence gestures: "lots of students want it." Specific evidence persuades readers who start out doubtful.
    topic_code: "4.A"
  - front: Evidence that proves the arguable part of the claim
    back: |
      Underline the word in your claim that someone could dispute ("should," "best," "harmful") and choose evidence that addresses that word, not just the topic.
    topic_code: "4.A"
  - front: Closing sentence of a body paragraph → its job
    back: |
      To link the paragraph's point back to the thesis or forward to the next step of the argument. It should add a connection, not just repeat the claim word for word.
    topic_code: "4.A"
  - front: Personal experience as evidence → when it works
    back: |
      When the writer's own experience is relevant, representative and honestly presented, and when the audience trusts the writer. Franklin, at eighty-one, could cite a lifetime of changed opinions.
    topic_code: "3.A"
  - front: Hypothetical example → definition and use
    back: |
      An imagined case ("Suppose a student arrives at 7:20...") that illustrates a claim. Useful for clarity; weaker than real evidence because the reader knows it was invented.
    topic_code: "4.A"
  - front: Franklin's convention speech → date and setting
    back: |
      17 September 1787, the last day of the Constitutional Convention in Philadelphia. Franklin, aged 81, wrote the speech; James Wilson read it aloud for him. "Mr. President" is George Washington, who presided.
    topic_code: "1.A"
  - front: Franklin's convention speech → its exigence
    back: |
      The finished Constitution was about to be signed, and several delegates still objected to parts of it. A divided signing would weaken the document before the states voted on it.
    topic_code: "1.A"
  - front: Franklin's convention speech → its audience and purpose
    back: |
      Audience: fellow delegates, especially those with objections. Purpose: to persuade every member to sign, so that the Constitution goes to the states with the appearance of unanimity.
    topic_code: "1.A"
  - front: "\"I confess that I do not entirely approve of this constitution at present\" → why open with a confession"
    back: |
      Franklin stands with the doubters before asking them to move. Admitting his own objections earns the trust of delegates who share them.
    topic_code: "1.A"
  - front: "\"the older I grow, the more apt I am to doubt my own judgment\" → as evidence"
    back: |
      Franklin's lifetime of "being obliged, by better information, or fuller consideration, to change opinions" is personal evidence for his claim that every delegate should doubt his own certainty.
    topic_code: "3.A"
  - front: Franklin's French lady → the anecdote's job
    back: |
      A woman who tells her sister she meets "nobody but myself that is always in the right." The joke illustrates the universal habit of thinking oneself infallible and lets the audience laugh at it before Franklin applies it to them.
    topic_code: "3.A"
  - front: Steele's joke about the two churches in Franklin's speech
    back: |
      The Roman church claims to be infallible; the Church of England is "never in the wrong." Franklin cites a writer ("Steel") to show that even institutions that deny infallibility act as if they had it.
    topic_code: "3.A"
  - front: "\"you inevitably assemble with those men, all their prejudices\" → the reasoning"
    back: |
      Any assembly brings its members' "passions," "errors of opinion," "local interests" and "selfish views." So no convention can produce a perfect constitution, and this one is as good as any could be.
    topic_code: "3.A"
  - front: "\"the builders of Babylon\" → the allusion in Franklin's speech"
    back: |
      The tower of Babel, whose builders' speech was confounded. Enemies expect the Convention to collapse into confusion; Franklin suggests a near-perfect result will "astonish" them.
    topic_code: "3.A"
  - front: "\"because I expect no better, and because I am not sure, that this is not the best\" → the claim"
    back: |
      Franklin's main claim in its most compact form: consent is reasonable when no better outcome is available and one's own objections may be mistaken.
    topic_code: "3.A"
  - front: "\"Within these walls they were born, and here they shall die.\" → what Franklin offers"
    back: |
      A promise to keep his objections private, modelling the sacrifice he asks of others. The balanced sentence makes the promise memorable.
    topic_code: "1.A"
  - front: Franklin on opinion and government → his supporting claim
    back: |
      A government's strength "depends on opinion, on the general opinion of the goodness of that government." Public disagreement among the framers would weaken the new government before it began.
    topic_code: "3.A"
  - front: "\"doubt a little of his own infallibility\" → the ending's request"
    back: |
      Franklin asks each objector to apply the lesson of the speech to himself and "put his name to this instrument." The phrase is gently ironic: no one claims infallibility, yet everyone acts on it.
    topic_code: "1.A"
  - front: Franklin's speech as a model paragraph
    back: |
      Claim (consent despite doubts), evidence (his experience, the anecdote, the reasoning about assemblies), commentary (what follows for the delegates), and a closing request. The structure is a paragraph's structure, scaled up.
    topic_code: "4.A"
  - front: Drafting a claim for a body paragraph → three tests
    back: |
      Is it arguable? Is it narrow enough to prove in one paragraph? Does it connect to the thesis? "School uniforms reduce bullying" passes; "Uniforms are a topic many people discuss" fails all three.
    topic_code: "4.A"
  - front: Dropped quotation → what it is and the fix
    back: |
      A quotation standing alone as its own sentence, with no introduction or explanation. Fix it with a signal phrase before and commentary after.
    topic_code: "4.A"
  - front: Overloaded paragraph → what it is and the fix
    back: |
      A paragraph that piles up three or four pieces of evidence with no explanation between them. Cut to the strongest one or two and explain each.
    topic_code: "4.A"
  - front: "\"So what?\" test → when to apply it"
    back: |
      After every piece of evidence. If the next sentence does not answer *so what does this show, and why does it matter for my claim?*, commentary is missing.
    topic_code: "4.A"

quiz:
  description: |
    22 questions · about 35 minutes · a set of seven questions on Franklin's speech at the close of the
    Constitutional Convention, a set of five revision questions on a student's paragraph, then questions on building
    paragraphs (with review of claims, evidence and the rhetorical situation). Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    paragraph are graded by your teacher against the model answer and scoring notes.
  questions:
    # ---- Passage set: Franklin's speech, 17 September 1787
    - slug: u01-w03-q01
      type: multiple_choice
      topic_code: "1.A"
      source: 'Benjamin Franklin, speech at the close of the Federal Convention (1787)'
      points: 1
      stimulus: &franklin |
        *The following passage is from the speech Benjamin Franklin prepared for the last day of the Constitutional Convention, 17 September 1787, as printed in an 1806 edition of his works. "Mr. President" is George Washington, who presided over the Convention.*

        MR. PRESIDENT,

        I confess that I do not entirely approve of this constitution at present: but, Sir, I am not sure I shall never approve it; for having lived long, I have experienced many instances of being obliged, by better information, or fuller consideration, to change opinions, even on important subjects, which I once thought right, but found to be otherwise. It is, therefore, that, the older I grow, the more apt I am to doubt my own judgment, and to pay more respect to the judgment of others. Most men, indeed, as well as most sects in religion, think themselves in possession of all truth, and that whenever others differ from them, it is so far error. [...] But, though many private persons think almost as highly of their own infallibility as of that of their sect, few express it so naturally as a certain French lady, who, in a little dispute with her sister, said, I don't know how it happens, sister, but I meet with nobody but myself that is always in the right. *Il n'y a que moi qui a toujours raison.* In these sentiments, Sir, I agree to this constitution, with all its faults, if they are such, because I think a general government necessary for us, and there is no form of government but what may be a blessing, if well administered [...] I doubt too, whether any other convention we can obtain, may be able to make a better constitution. For when you assemble a number of men, to have the advantage of their joint wisdom, you inevitably assemble with those men, all their prejudices, their passions, their errors of opinion, their local interests, and their selfish views. From such an assembly can a perfect production be expected? It therefore astonishes me, sir, to find this system approaching so near to perfection as it does [...]

        Thus I consent, sir, to this constitution, because I expect no better, and because I am not sure, that this is not the best. The opinions I have had of its errors, I sacrifice to the public good. I have never whispered a syllable of them abroad. Within these walls they were born, and here they shall die. [...]

        On the whole, sir, I cannot help expressing a wish, that every member of the convention, who may still have objections, would with me, on this occasion, doubt a little of his own infallibility, and, to make manifest our unanimity, put his name to this instrument.
      prompt: |
        The final paragraph suggests that the exigence of the speech is
      options:
        - |
          a proposal to add a bill of rights to the constitution
        - |
          a dispute between Franklin and Washington over who should lead the new government
        - |
          the signing of the finished constitution, at which some delegates who still had objections might refuse to sign
        - |
          a public rally at which citizens demanded a new constitution
      option_explanations:
        - |
          No amendment is proposed or discussed. Franklin asks members to sign the constitution as it stands, "with all its faults."
        - |
          Washington is addressed respectfully as "Mr. President," the presiding officer. Leadership of the new government is not at issue.
        - |
          Correct. Franklin wishes that every member "who may still have objections" would "put his name to this instrument." The moment of signing, with objectors in the room, is what calls for the speech.
        - |
          The speech is addressed to "every member of the convention" "within these walls," a closed meeting of delegates, not a crowd of citizens.
      answer: 2
      explanation: |
        Endings often reveal exigence: what the speaker asks for shows what moment he is responding to. Here the request (sign) points to the occasion (the signing) and to the problem (lingering objections).

    - slug: u01-w03-q02
      type: multiple_choice
      topic_code: "3.A"
      source: 'Benjamin Franklin, speech at the close of the Federal Convention (1787)'
      points: 1
      stimulus: *franklin
      prompt: |
        Which statement best expresses the main claim of Franklin's speech?
      options:
        - |
          The constitution is perfect and needs no improvement.
        - |
          Older people's judgment should always be trusted over younger people's.
        - |
          The French are more honest than the English about their faults.
        - |
          Delegates should sign the constitution despite their objections, because their own judgment may be wrong and no better constitution is likely.
      option_explanations:
        - |
          Franklin says he does "not entirely approve" of it and accepts it "with all its faults." He claims it is near perfection, not perfect.
        - |
          Franklin says that age has made him doubt his OWN judgment more. His point is humility, not the authority of age.
        - |
          The French lady is a comic illustration of a universal habit, not evidence for a claim about national character.
        - |
          Correct. The speech moves from Franklin's doubts about his own judgment, to reasons for accepting the constitution, to the wish that every objector would "doubt a little of his own infallibility" and sign.
      answer: 3
      explanation: |
        The main claim is what the whole speech asks the audience to accept. Track where the speech ends up: the final request usually states the claim most directly.

    - slug: u01-w03-q03
      type: multiple_choice
      topic_code: "3.A"
      source: 'Benjamin Franklin, speech at the close of the Federal Convention (1787)'
      points: 1
      stimulus: *franklin
      prompt: |
        Franklin's statement that he has "experienced many instances of being obliged, by better information, or fuller consideration, to change opinions" serves as evidence for the claim that
      options:
        - |
          the constitution's authors had too little information
        - |
          a person should hold his own judgment with some doubt, because even firm opinions can prove wrong
        - |
          Franklin has always been right about important subjects
        - |
          delegates should consult the public before signing
      option_explanations:
        - |
          Franklin speaks of his own changes of opinion over a long life, not of a lack of information in the Convention.
        - |
          Correct. The next sentence draws the conclusion: "the older I grow, the more apt I am to doubt my own judgment." His experience is personal evidence for a general lesson in humility.
        - |
          The evidence says the opposite: he has often found that opinions he "once thought right" were "otherwise."
        - |
          Consulting the public is never proposed. Franklin promises to keep his objections from the public.
      answer: 1
      explanation: |
        Personal experience is evidence when it supports a general claim the audience can apply to themselves. Franklin's long life gives this evidence unusual weight with his listeners.

    - slug: u01-w03-q04
      type: multiple_choice
      topic_code: "3.A"
      source: 'Benjamin Franklin, speech at the close of the Federal Convention (1787)'
      points: 1
      stimulus: *franklin
      prompt: |
        The anecdote of the French lady who meets "nobody but myself that is always in the right" functions primarily to
      options:
        - |
          illustrate, with humour, the common tendency to believe oneself always right, so that listeners can recognise it in themselves without feeling attacked
        - |
          prove statistically that most people are overconfident
        - |
          criticise a particular delegate who refused to compromise
        - |
          shift the subject from the constitution to family quarrels
      option_explanations:
        - |
          Correct. The lady says aloud what most people only feel. Laughing at her lets the delegates see their own certainty from outside, preparing them for the request to "doubt a little."
        - |
          An anecdote is a single illustrative case, not a statistic. Its force is recognition, not measurement.
        - |
          No delegate is named or targeted; the lady is a stranger in a story. Franklin's tact depends on not accusing anyone directly.
        - |
          The anecdote serves the argument about the constitution; Franklin returns at once with "In these sentiments, Sir, I agree to this constitution."
      answer: 0
      explanation: |
        Anecdotes rarely prove claims alone, but they can make a claim vivid and disarm resistance. Ask what the audience is meant to feel and recognise.

    - slug: u01-w03-q05
      type: multiple_choice
      topic_code: "3.A"
      source: 'Benjamin Franklin, speech at the close of the Federal Convention (1787)'
      points: 1
      stimulus: *franklin
      prompt: |
        In the sentence beginning "For when you assemble a number of men," Franklin supports his claim that no other convention could make a better constitution by
      options:
        - |
          citing the failures of earlier conventions in other nations
        - |
          quoting experts on government
        - |
          reasoning from a general truth about assemblies: any group brings its members' prejudices, passions and interests along with their wisdom
        - |
          describing the specific objections each delegate has raised
      option_explanations:
        - |
          No other convention is named or described. The support is a general observation, not historical examples.
        - |
          No authority is quoted in this sentence; Franklin reasons in his own voice.
        - |
          Correct. Because "you inevitably assemble with those men, all their prejudices, their passions," any convention will produce an imperfect result. The conclusion follows: "From such an assembly can a perfect production be expected?"
        - |
          Franklin carefully avoids naming specific objections, including his own. The reasoning is general.
      answer: 2
      explanation: |
        Not all evidence is data. Reasoning from a principle the audience already accepts (people bring their faults to meetings) can support a claim powerfully, especially when listeners can confirm it from their own experience.

    - slug: u01-w03-q06
      type: multiple_choice
      topic_code: "1.A"
      source: 'Benjamin Franklin, speech at the close of the Federal Convention (1787)'
      points: 1
      stimulus: *franklin
      prompt: |
        Franklin opens by confessing that he does "not entirely approve of this constitution." This choice is most likely effective with his audience because
      options:
        - |
          it shows that the delegates who approve of the constitution are mistaken
        - |
          it reveals a secret objection that will shock the delegates
        - |
          it signals that he will vote against the constitution
        - |
          it places him on the side of the delegates who still have doubts, earning their trust before he asks them to sign
      option_explanations:
        - |
          The confession does not argue that supporters are wrong; it addresses the doubters.
        - |
          Franklin never states what his objections are, and he promises they will "die" within the room. Nothing is revealed.
        - |
          He goes on to say "I agree to this constitution, with all its faults." The confession is the first step toward consent.
        - |
          Correct. The audience that matters is the objectors. By beginning as one of them, Franklin makes his eventual consent a model they can follow rather than a demand from the other side.
      answer: 3
      explanation: |
        Skill 1.A includes the writer's relationship to the audience. A speaker who shares the audience's position before asking them to move often persuades more than one who argues from across the room.

    - slug: u01-w03-q07
      type: multi_select
      topic_code: "3.A"
      source: 'Benjamin Franklin, speech at the close of the Federal Convention (1787)'
      points: 3
      partial_credit: true
      stimulus: *franklin
      prompt: |
        Which of the following reasons does Franklin give in the passage for consenting to the constitution? Select all that apply.
      options:
        - |
          He thinks a general government is necessary.
        - |
          He doubts that any other convention could make a better constitution.
        - |
          He is not sure that this constitution is not the best possible.
        - |
          He has been promised an office in the new government.
      option_explanations:
        - |
          Correct. "I agree to this constitution, with all its faults [...] because I think a general government necessary for us."
        - |
          Correct. "I doubt too, whether any other convention we can obtain, may be able to make a better constitution."
        - |
          Correct. "Thus I consent, sir, to this constitution, because I expect no better, and because I am not sure, that this is not the best."
        - |
          Nothing in the speech mentions any office or personal reward. The speech presents consent as a sacrifice "to the public good."
      answer: [0, 1, 2]
      explanation: |
        Look for "because" and "for": they mark reasons, the supporting claims of an argument. Franklin gives several, each with its own support.


    # ---- Revision set: a student's body paragraph
    - slug: u01-w03-q08
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: &w03_draft |
        *The following is a draft of a body paragraph from a student's argument about test retakes. The sentences are numbered.*

        (1) Many people have opinions about tests. (2) Last spring, our school's math department let every student retake one unit test per semester. (3) Of the 240 students who retook a test, 198 raised their score, and the department reported that the average score on the final exam rose by six points over the year before. (4) In the department's report, one teacher wrote that retakes made students go back to what they had missed instead of simply moving on. (5) My cousin's school does not allow retakes. (6) This shows that retakes work. (7) The policy should be extended to every department in the school.
      prompt: |
        The writer wants to replace sentence 1 with a claim that clearly states the paragraph's arguable point. Which sentence best accomplishes this goal?
      options:
        - |
          Tests are a part of every student's life, whether they like it or not.
        - |
          Every department should allow one retake per semester, because the math department's trial shows that retakes push students to relearn what they missed.
        - |
          This paragraph will discuss the math department's retake policy.
        - |
          Some students like retakes and some students do not.
      option_explanations:
        - |
          This is a general truism, not an arguable point. It gives the reader no idea what the paragraph will prove.
        - |
          Correct. It states a position that could be disputed (every department should allow retakes) and previews the reason the evidence supports (the math trial shows students relearn material). Sentences 2-4 then prove it.
        - |
          An announcement of subject is not a claim. A body paragraph should begin with the point it argues, not a description of itself.
        - |
          This states a fact about opinions and takes no position, so nothing in the paragraph would need to prove it.
      answer: 1
      explanation: |
        A body paragraph's first sentence should be a claim: arguable, focused, and connected to the evidence that follows. Test each option by asking whether someone could disagree and whether the paragraph's evidence proves it.

    - slug: u01-w03-q09
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: *w03_draft
      prompt: |
        Should the writer keep or delete sentence 5?
      options:
        - |
          Keep it, because a personal connection always strengthens an argument.
        - |
          Keep it, because it proves that schools without retakes have lower scores.
        - |
          Delete it, because it gives a fact about another school without any information that bears on whether retakes work.
        - |
          Delete it, because the paragraph should not mention other schools under any circumstances.
      option_explanations:
        - |
          Personal connections help only when they are relevant evidence. Here the cousin's school is mentioned without any results, so it supports nothing.
        - |
          The sentence says nothing about scores at the cousin's school, so it cannot prove a comparison.
        - |
          Correct. Knowing that one other school forbids retakes tells the reader nothing about whether retakes improve learning. As written, the sentence interrupts the line from evidence to conclusion.
        - |
          A comparison with another school could be useful if it included results. The problem is that this sentence offers none.
      answer: 2
      explanation: |
        Every sentence in an argument paragraph should do work for the claim. A detail that is related to the topic but proves nothing is a distraction, especially just before the conclusion.

    - slug: u01-w03-q10
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: *w03_draft
      prompt: |
        The writer wants to replace sentence 6 with commentary that explains how the evidence supports the claim. Which revision best accomplishes this goal?
      options:
        - |
          Because nearly every student who retook a test improved, and the gain lasted to the final exam, the retakes did more than raise one grade: they made students relearn material they would otherwise have carried forward as gaps.
        - |
          This proves without a doubt that retakes are the best policy ever invented.
        - |
          Retakes are a very interesting idea that many people should think about.
        - |
          The math department has many teachers who work very hard.
      option_explanations:
        - |
          Correct. It connects both pieces of evidence (198 of 240 improved; the final exam average rose) to the claim, and explains why the lasting gain matters: it shows learning, not just better grades.
        - |
          This overstates the conclusion ("without a doubt," "best policy ever") and explains nothing about how the evidence works.
        - |
          "Interesting" and "think about" are vague and take no clear position. The sentence explains nothing.
        - |
          The teachers' effort is irrelevant to whether retakes work. The sentence changes the subject.
      answer: 0
      explanation: |
        Commentary explains HOW the evidence proves the claim. Strong commentary often names the evidence briefly and says what it shows that a reader might not see at once, here the difference between a raised grade and a lasting gain.

    - slug: u01-w03-q11
      type: multi_select
      topic_code: "4.A"
      source: written for this course
      points: 3
      partial_credit: true
      stimulus: *w03_draft
      prompt: |
        Which sentences provide evidence that directly supports the claim that retakes improve learning? Select all that apply.
      options:
        - |
          Sentence 2
        - |
          Sentence 3
        - |
          Sentence 4
        - |
          Sentence 6
      option_explanations:
        - |
          Sentence 2 sets out the trial itself, background the evidence depends on, but it reports no result. By itself it shows only that retakes were allowed, not that anyone learned more.
        - |
          Correct. The numbers (198 of 240 improved; final exam average up six points) are the paragraph's strongest evidence.
        - |
          Correct. The teacher's report is testimony from someone who observed the policy, and it explains the mechanism (students went back to what they missed).
        - |
          Sentence 6 is a conclusion drawn from the evidence ("This shows"), and a thin one. It is weak commentary, not evidence.
      answer: [1, 2]
      explanation: |
        Evidence can be data or testimony about what happened. Background that sets up the evidence is not itself proof, and conclusions that begin "This shows" are commentary; the question is whether they explain enough.

    - slug: u01-w03-q12
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: *w03_draft
      prompt: |
        A reader might object that students who retook tests simply memorised the second version. Which sentence, added after sentence 3, would best address this concern with evidence?
      options:
        - |
          Memorising is a skill that students need anyway.
        - |
          Most students would never try to memorise a test.
        - |
          The department should not worry about what students do.
        - |
          The retakes used new questions on the same skills, and the final exam, which no student had seen, still showed the six-point gain.
      option_explanations:
        - |
          This dismisses the concern instead of answering it, and it concedes that the gains might come from memorising.
        - |
          This is an unsupported assertion about student behaviour. It offers no evidence the reader can check.
        - |
          This refuses to engage with the objection and would make the writer seem careless about the policy's results.
        - |
          Correct. Two facts answer the concern: new questions on retakes, and gains on an unseen final. The evidence directly addresses the possibility of memorisation.
      answer: 3
      explanation: |
        When a reader could reasonably doubt what your evidence shows, the strongest response is more evidence that rules out the alternative explanation, not an assertion or a dismissal.

    # ---- Building paragraphs, with review
    - slug: u01-w03-q13
      type: multiple_choice
      topic_code: "4.A"
      source: general knowledge
      points: 1
      prompt: |
        Which sentence is commentary rather than summary of the evidence?
      options:
        - |
          By admitting his own record of error, Franklin makes doubt sound like wisdom earned over a lifetime, which makes it easier for younger delegates to doubt themselves without embarrassment.
        - |
          Franklin says he has changed his mind many times during his life.
        - |
          Franklin tells a story about a French lady and her sister.
        - |
          Franklin ends by asking the delegates to sign the constitution.
      option_explanations:
        - |
          Correct. It goes beyond what Franklin says to explain what his admission does for his audience and why it helps his argument. That is commentary.
        - |
          This restates the content of Franklin's words. Accurate, but it explains nothing about effect or function.
        - |
          This reports that an anecdote appears without saying what it does or why it is there.
        - |
          This summarises the ending. Commentary would explain how the request follows from the rest of the speech or why it is phrased as it is.
      answer: 0
      explanation: |
        Summary tells what the text says; commentary tells what it does and why that matters. On the AP rubric, commentary is what moves an essay from 2 to 3 or 4 points for evidence and commentary.

    - slug: u01-w03-q14
      type: multiple_choice
      topic_code: "4.A"
      source: 'Benjamin Franklin, speech at the close of the Federal Convention (1787)'
      points: 1
      prompt: |
        Which sentence integrates a quotation from Franklin's speech most effectively?
      options:
        - |
          "The older I grow, the more apt I am to doubt my own judgment." This is what Franklin said.
        - |
          Franklin turns age into an argument for humility, admitting that "the older I grow, the more apt I am to doubt my own judgment," a confession that invites the delegates to doubt theirs.
        - |
          Franklin says a quote about getting older and doubting himself which is in the first paragraph.
        - |
          In the speech there is a quote: "the more apt I am to doubt my own judgment."
      option_explanations:
        - |
          The quotation is dropped in on its own and followed by an empty sentence. Nothing connects it to a claim.
        - |
          Correct. A signal phrase with an interpretive verb ("admitting") introduces a short quotation embedded in the writer's sentence, and the sentence ends with commentary on its effect.
        - |
          This paraphrases vaguely instead of quoting, and "says a quote" is imprecise. The reader gets neither Franklin's words nor a point about them.
        - |
          The quotation is introduced but not explained. "There is a quote" names its existence, not its function.
      answer: 1
      explanation: |
        Integrate quotations into your own sentences, introduce them with a precise verb, and follow them with commentary. A quotation that stands alone leaves the reader to do your analysis.

    - slug: u01-w03-q15
      type: multiple_choice
      topic_code: "4.A"
      source: general knowledge
      points: 1
      prompt: |
        Which claim is best suited to be the topic sentence of a single body paragraph?
      options:
        - |
          Education is important in many ways.
        - |
          There are many arguments for and against homework.
        - |
          Schools should reform everything about how they teach, test, schedule and fund students.
        - |
          Assigning reading instead of worksheets for homework would give students more practice with the long texts they struggle with on state tests.
      option_explanations:
        - |
          Too broad and not arguable: no one disputes that education is important, and no paragraph could prove it in a useful way.
        - |
          This describes a debate without taking a side. A topic sentence must make a claim the paragraph proves.
        - |
          This claim is arguable but far too broad for one paragraph; it would need an entire essay or more.
        - |
          Correct. It is arguable, specific (reading instead of worksheets), and gives a reason that one paragraph's evidence could support.
      answer: 3
      explanation: |
        A good paragraph claim is arguable, narrow enough to prove with one or two pieces of evidence, and specific enough to suggest what evidence is needed.

    - slug: u01-w03-q16
      type: true_false
      topic_code: "4.A"
      source: general knowledge
      points: 1
      prompt: |
        True or false: If the evidence in a paragraph is strong enough, the writer does not need to explain how it supports the claim.
      answer: false
      explanation: |
        False. Evidence does not explain itself. Readers may draw different conclusions from the same facts, and the AP rubric awards most of its points for commentary that explains how evidence supports a line of reasoning.

    - slug: u01-w03-q17
      type: true_false
      topic_code: "3.A"
      source: 'Benjamin Franklin, speech at the close of the Federal Convention (1787)'
      points: 1
      prompt: |
        True or false: Franklin tells the Convention that he has never shared his objections to the constitution outside the meeting and will keep them private.
      answer: true
      explanation: |
        True. "I have never whispered a syllable of them abroad. Within these walls they were born, and here they shall die." Franklin's promise is evidence of the sacrifice he asks of others: objections given up "to the public good."

    - slug: u01-w03-q18
      type: fill_blank
      topic_code: "4.A"
      source: general knowledge
      points: 1
      prompt: |
        In an argument paragraph, the writer's explanation of how and why the evidence supports the claim is called ____.
      answer: ["commentary", "the commentary", "analysis", "explanation"]
      explanation: |
        Commentary is the third part of the claim-evidence-commentary paragraph and the part the AP rubric values most.

    - slug: u01-w03-q19
      type: fill_blank
      topic_code: "3.A"
      source: general knowledge
      points: 1
      prompt: |
        Franklin's story of the French lady who meets nobody but herself who is always right is an ____, a brief story of a particular case used to illustrate a point.
      answer: ["anecdote", "an anecdote", "anecdotes"]
      explanation: |
        An anecdote makes a claim vivid and recognisable. It cannot prove a general pattern alone, which is why Franklin pairs it with his own experience and with reasoning about assemblies.

    - slug: u01-w03-q20
      type: short_answer
      topic_code: "4.A"
      source: written for this course
      points: 2
      prompt: |
        Write a two-sentence beginning of a body paragraph on this topic: whether your school should require community service for graduation. The first sentence must be an arguable claim; the second must offer one specific piece of evidence (you may invent a plausible example, survey or fact for practice).
      answer: |
        Requiring twenty hours of community service would connect students to the town in ways that classes cannot, because many students have never worked alongside adults outside school. When a nearby high school adopted the requirement in 2022, its senior survey found that 63 percent of students had volunteered for the first time, and a third kept volunteering after graduation.
      explanation: |
        1 point: the first sentence takes a clear, arguable position (for or against the requirement) narrow enough for one paragraph. 1 point: the second sentence offers specific evidence (a number, a named example, a precise observation) that supports the arguable part of the claim. Vague evidence ("lots of students like it") or a claim that only names the topic earns at most 1.

    - slug: u01-w03-q21
      type: short_answer
      topic_code: "4.A"
      source: 'Benjamin Franklin, speech at the close of the Federal Convention (1787)'
      points: 2
      prompt: |
        A student writes: *Franklin wanted the delegates to sign. "Within these walls they were born, and here they shall die." This shows he was serious.* Rewrite these sentences so that the quotation is integrated and followed by commentary that explains its effect on Franklin's audience.
      answer: |
        To persuade objectors to sign, Franklin first gives up something himself, promising that his own objections will never leave the room: "Within these walls they were born, and here they shall die." By modelling the sacrifice he is about to request, he makes his appeal fair rather than one-sided, so that delegates who sign are joining him, not surrendering to him.
      explanation: |
        1 point: the quotation is introduced with a signal phrase or embedded in a sentence that frames it, not dropped in alone. 1 point: commentary explains the effect on the audience (Franklin models the sacrifice, earns trust, makes the request fair), not just that he was "serious." A rewrite that still ends with a vague comment earns at most 1.

    - slug: u01-w03-q22
      type: long_answer
      topic_code: "4.A"
      source: written for this course
      points: 5
      prompt: |
        Franklin argues that a person should sometimes accept a decision he does not fully approve of for the sake of a larger good. Write one well-developed argument paragraph (about 175-225 words) that takes a position on this idea, using a situation from your own experience, your reading, or current events. Your paragraph should begin with a clear claim, offer at least two specific pieces of evidence, and include commentary after each one.
      answer: |
        Claim: Accepting an imperfect group decision is wise when the group's success depends on unity, but only when the decision does not ask anyone to give up a principle. Evidence 1: on a robotics team, a member who disliked the chosen design kept building it rather than quitting; the team qualified for the state finals. Commentary: the disagreement was about method, not values, so unity was worth more than one person's preference, and the member's objection could be raised again next season. Evidence 2: the Constitutional Convention itself, where Franklin signed a document he did "not entirely approve" so that it would go to the states with apparent unanimity. Commentary: Franklin's case works because a divided signing would have endangered the whole project, and because the constitution could later be amended. Concluding link: accepting a decision is a judgment about stakes; when the cost of division is high and the decision can be revisited, consent is not weakness but the kind of humility Franklin recommends.
      explanation: |
        5 points. Claim (1): a clear, arguable position on accepting decisions one does not fully approve of; a qualified claim (when, under what conditions) is welcome but not required. Evidence (2): 2 points for two specific, relevant pieces of evidence (named situations, details, examples) that support the claim; 1 point if one is specific and one vague, or only one is given. Commentary (2): 2 points if each piece of evidence is followed by an explanation of how it supports the claim; 1 point if commentary is thin, repetitive or present for only one piece; 0 if the paragraph lists examples without explaining them.
