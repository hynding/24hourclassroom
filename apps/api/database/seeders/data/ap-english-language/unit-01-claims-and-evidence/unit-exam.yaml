      - |
        Correct. The sentence before explains that the "agitation of the billows" from the "ancient world" divided opinions "as to measures of safety," a practical question. Disagreeing about means, Jefferson argues, is not disagreeing about principle, so "We have called by different names brethren of the same principle."
