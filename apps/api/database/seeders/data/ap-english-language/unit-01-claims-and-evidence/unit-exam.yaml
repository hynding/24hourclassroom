  - slug: u01-exam-q23
    type: short_answer
    topic_code: "3.A"
    source: 'Thomas Jefferson, First Inaugural Address (1801)'
    points: 2
    stimulus: *ex_jefferson
    prompt: |
      Identify one claim Jefferson makes in the passage and the evidence or reasoning he offers to support it. In one or two sentences, explain how the support is meant to persuade his divided audience.
    answer: |
      Jefferson claims that the parties are "brethren of the same principle," supporting it with an explanation that their quarrel arose over "measures of safety" during Europe's upheavals, a difference about means rather than ends; this lets former opponents accept the result without admitting they were wrong, since their disagreement is recast as honest worry rather than hostility to the republic.
    explanation: |
      1 point: accurately identifies a claim and its support (for example, unity of principle supported by the account of foreign upheaval; the republic's strength supported by citizens' loyalty to law; self-government defended by the questions about kings and angels; tolerance of dissent supported by the image of "monuments"). 1 point: explains how that support would work on the divided audience of 1801. Identifying a claim with no support, or support with no explanation of its effect, earns at most 1.

  - slug: u01-exam-q24
    type: long_answer
    topic_code: "1.A"
    source: 'Thomas Jefferson, First Inaugural Address (1801)'
    points: 6
    stimulus: *ex_jefferson
    prompt: |
      The passage above is from Thomas Jefferson's First Inaugural Address, delivered on 4 March 1801 after a bitter election between his Republicans and John Adams's Federalists, the first time power had passed from one party to another under the Constitution. Read the passage carefully. Write an essay that analyzes the rhetorical choices Jefferson makes to unite a divided nation behind its new government.

      In your response you should do the following:
      - Respond to the prompt with a thesis that analyzes the writer's rhetorical choices.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Demonstrate an understanding of the rhetorical situation.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: Writing as the winner of a bitter election, Jefferson unites the nation by limiting his own majority's power, recasting partisan division as a family disagreement over means, and redefining the republic's strength so that every citizen, Federalist or Republican, has a stake in it. Line of reasoning: (1) Reassurance: "that will to be rightful must be reasonable" and the minority's equal rights answer the defeated party's fear of the new majority before any call for unity. (2) Redescription: the comparison of political intolerance to the religious intolerance already banished asks both sides to give up campaign hatred; the account of Europe's "throes and convulsions" explains disagreement as honest worry "as to measures of safety"; "We are all Republicans, we are all Federalists" claims both names for everyone. (3) Confidence: dissenters may "stand undisturbed as monuments" because reason is free, and the republic is "the strongest Government on earth" because citizens rally to the law; the questions about "angels in the forms of kings" turn distrust of human nature against monarchy. Sophistication: explaining the tension between Jefferson's magnanimity and his partisan victory (the generosity of a winner who need not compromise), or how the passage moves from the audience's fears to their pride, building unity in stages.
    explanation: |
      Thesis (0-1): 1 point for a defensible thesis that analyzes Jefferson's rhetorical choices in relation to the purpose of uniting a divided nation; a thesis that only restates the prompt or lists devices without linking them to purpose earns 0. Evidence and commentary (0-4): 4 = specific, well-chosen evidence from across the passage (the limits on majority rule, the comparison to religious intolerance, the explanation of disagreement, the two party names, the "monuments," the redefinition of strength, the rhetorical questions) with commentary that consistently explains how each choice works on the divided audience of 1801 and builds a line of reasoning; 3 = specific evidence and commentary that explains most choices, with some uneven links to purpose or audience; 2 = some relevant evidence, but commentary that is general, repetitive or drifts into summary; 1 = summary or a list of devices with little explanation; 0 = no relevant evidence. Sophistication (0-1): 1 point for a consistently vivid and persuasive analysis or a complex understanding of the rhetorical situation, such as explaining the tension between a partisan victory and a nonpartisan appeal, the speech's movement from reassurance to shared pride, or how Jefferson's confidence in free debate is itself an argument to his opponents. Grammar matters only insofar as it affects the clarity of the argument.

