    points: 1
    prompt: |
      Both the Gettysburg Address and the Second Inaugural end by asking the audience to commit to a task. Which statement best describes how the two tasks differ, given the two situations?
    options:
      - |
        Both ask the audience to punish the South.
      - |
        Gettysburg asks the living to finish the war so the nation survives; the Second Inaugural, with victory near, asks them to make a peace without malice.
      - |
        Gettysburg asks the audience to vote for Lincoln; the Second Inaugural asks them to forget the war.
      - |
        Both ask the audience to build monuments to the dead.
    option_explanations:
      - |
        Neither speech calls for punishment; the Second Inaugural explicitly asks for "malice toward none."
      - |
        Correct. In 1863 the task is "the unfinished work" of the war; in 1865 it is "to bind up the nation's wounds" and achieve "a just and lasting peace." Each task fits its moment.
      - |
        Gettysburg asks for no votes, and the Second Inaugural asks the nation to care for veterans and their families, not to forget.
      - |
        Gettysburg says words and ceremonies cannot consecrate the ground; neither speech asks for monuments.
    answer: 1
    explanation: |
      A speaker's request reveals purpose, and purpose follows the situation. Comparing two speeches by the same writer makes the link clear.

  - slug: u01-exam-q38
    type: multi_select
    topic_code: "1.A"
    source: general knowledge
    points: 3
    partial_credit: true
    prompt: |
      Which of the following are components of the rhetorical situation as the AP English Language course defines it? Select all that apply.
    options:
      - |
        Exigence
      - |
        Audience
      - |
        Purpose
      - |
        Rhyme scheme
    option_explanations:
      - |
        Correct. The exigence is the event, problem or need that prompts the text.
      - |
        Correct. The audience is who the writer addresses, primary and secondary.
      - |
        Correct. The purpose is what the writer wants the audience to do, think or feel.
      - |
        Rhyme scheme is a feature of verse form, not a component of the rhetorical situation. The six components are writer, audience, exigence, purpose, context and message.
    answer: [0, 1, 2]
    explanation: |
      The six components are writer, audience, exigence, purpose, context and message. Each answers a different question about why a text says what it says.

  - slug: u01-exam-q39
    type: true_false
    topic_code: "3.A"
    source: general knowledge
    points: 1
    prompt: |
      True or false: A statement that no reasonable person would dispute, such as the date a document was signed, is a claim that needs evidence.
    answer: false
    explanation: |
      False. Undisputed, verifiable statements are facts. A claim is a statement a reasonable person could dispute, which is why it needs support.

  - slug: u01-exam-q40
    type: true_false
    topic_code: "4.A"
    source: general knowledge
    points: 1
    prompt: |
      True or false: On the AP English Language essay rubric, evidence and commentary together are worth more points than the thesis and sophistication combined.
    answer: true
    explanation: |
      True. Evidence and commentary are worth 0-4 points; thesis (0-1) and sophistication (0-1) together are worth 2. Developing and explaining evidence is where most of the score lies.

  - slug: u01-exam-q41
    type: fill_blank
    topic_code: "1.A"
    source: general knowledge
    points: 1
    prompt: |
      The wider circumstances surrounding a text (its time, place, history and the debates around it), as distinct from the specific event that prompts it, are called its ____.
    answer: ["context", "the context"]
    explanation: |
      Context is the larger world of a text; exigence is the trigger within it. The Civil War is the context of the Gettysburg Address; the cemetery's dedication is its exigence.

  - slug: u01-exam-q42
    type: fill_blank
    topic_code: "3.A"
    source: general knowledge
    points: 1
    prompt: |
      The often unstated assumption that connects a piece of evidence to the claim it supports is sometimes called the ____.
    answer: ["warrant", "the warrant", "assumption", "the assumption", "unstated assumption"]
    explanation: |
      The warrant is the bridge from evidence to claim. In the Declaration, the grievance about standing armies supports the claim of tyranny only through the warrant that power without consent is illegitimate.

  - slug: u01-exam-q43
    type: short_answer
    topic_code: "4.A"
    source: written for this course
    points: 2
    prompt: |
      Here is a body paragraph's claim: *Our school should replace paper hall passes with a sign-out sheet kept by each teacher.* Write one sentence of specific evidence that would support it (you may invent a plausible fact) and one sentence of commentary that explains how the evidence supports the claim.
    answer: |
      Evidence: Last semester the main office reported that 140 paper passes went missing and that two students were found in the parking lot holding passes from teachers who had not issued them. Commentary: Because a sign-out sheet stays with the teacher, it cannot be lost or reused, so it would close the gap that let students leave class on passes that no one was tracking.
    explanation: |
      1 point: the evidence is specific (a number, a named source, a concrete example) and relevant to the claim (shows a problem with paper passes or a benefit of sign-out sheets). 1 point: the commentary explains how the evidence supports the claim, not just restating either. Vague evidence ("passes are a problem") or commentary that only repeats the claim earns at most 1.

  - slug: u01-exam-q44
    type: short_answer
    topic_code: "1.A"
    source: 'Thomas Jefferson and the Continental Congress, The Declaration of Independence (1776); Benjamin Franklin, speech at the close of the Federal Convention (1787)'
    points: 2
    prompt: |
      The Declaration of Independence was written for "the opinions of mankind"; Franklin's convention speech was spoken to a closed room of delegates. In two or three sentences, explain how this difference in audience helps explain one difference in how the two texts argue.
    answer: |
      The Declaration addresses a world audience that owed the colonists nothing, so it lays out formal principles and a long list of "Facts" for "a candid world" to judge. Franklin speaks to colleagues who have just spent months debating together, so he can use personal confession, gentle jokes about infallibility and a direct request, relying on shared experience instead of a formal case.
    explanation: |
      1 point: accurately characterises both audiences (a distant, impartial or skeptical world; a small group of colleagues with shared experience). 1 point: links the difference in audience to a specific difference in argument (formal list of evidence and principles vs personal experience, humour and direct appeal; public vs private tone). Describing the texts without connecting audience to method earns at most 1.
