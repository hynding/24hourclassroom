  - slug: u01-exam-q20
    type: multiple_choice
    topic_code: "3.A"
    source: 'Thomas Jefferson, First Inaugural Address (1801)'
    points: 1
    stimulus: *ex_jefferson
    prompt: |
      The questions "Can he, then, be trusted with the government of others? Or have we found angels in the forms of kings to govern him?" respond to the objection that "man can not be trusted with the government of himself" by
    options:
      - |
        conceding that the objection is correct and that kings are necessary
      - |
        changing the subject to the history of European monarchy
      - |
        turning the objection back on itself: if people cannot govern themselves, no person can be trusted to govern them either, since rulers are people too
      - |
        offering statistical evidence about the success of republics
    option_explanations:
      - |
        The questions are rhetorical; they expect the answers "no" and "no." Jefferson rejects the objection.
      - |
        Kings are mentioned only to point out that they are men, not angels. The argument stays on self-government.
      - |
        Correct. The objection assumes some people can be trusted to rule others. Jefferson's questions expose that assumption: rulers are not "angels," so distrust of human nature is an argument against kings as much as against self-government.
      - |
        No statistics appear. The questions work by logic, and "Let history answer" leaves evidence to the audience's knowledge.
    answer: 2
