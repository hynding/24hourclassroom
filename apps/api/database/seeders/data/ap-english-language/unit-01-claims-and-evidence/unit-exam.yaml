  - slug: u01-exam-q25
    type: multiple_choice
    topic_code: "1.A"
    source: written for this course
    points: 1
    stimulus: &ex_draft |
      *The following is a draft of the opening of a student's argument, written as a letter to be read aloud at a county commission meeting. The sentences are numbered.*

      (1) Trails are fun. (2) The county commission will decide on April 15 whether to sell the abandoned Millbrook rail line to a developer or convert it into a public walking and biking trail. (3) The commission should choose the trail. (4) The six-mile corridor connects three neighborhoods to the high school and the downtown library, but the roads along it have no sidewalks. (5) Last fall the county's traffic office counted 214 students walking or biking on the shoulder of Route 9 each school morning. (6) My grandfather rode the train on that line in the 1960s. (7) A trail would give these students a safe route to school. (8) In a neighboring county, a similar trail opened in 2015 now records about 1,100 users a day, according to that county's parks department. (9) Some residents argue that selling the land would bring in money the county needs. (10) However, the sale price would be a one-time payment. (11) Trails are good. (12) The commission should vote for the trail.
    prompt: |
      The writer wants the letter to open by making clear why the issue must be addressed now. Which revision best accomplishes this goal?
    options:
      - |
        Keep sentence 1 and add "very" before "fun."
      - |
        Delete sentence 1, so that the letter opens with sentence 2.
      - |
        Move sentence 6 to the beginning of the letter.
      - |
        Move sentence 9 to the beginning of the letter.
    option_explanations:
      - |
        Strengthening a vague opener does not make it timely. "Trails are fun" says nothing about the decision the commission faces.
      - |
        Correct. Sentence 2 states the exigence: a vote on April 15 between two specific options. Opening with it tells the commissioners exactly what is at stake and when.
      - |
        The grandfather's memory is personal and irrelevant to the decision; it would not explain why the letter is needed now.
      - |
        Sentence 9 is the opposing view. Opening with it would start the letter on the other side of the argument.
    answer: 1
    explanation: |
      For an audience about to make a decision, the clearest opening names the decision and its date. A vague generality wastes the first sentence.

