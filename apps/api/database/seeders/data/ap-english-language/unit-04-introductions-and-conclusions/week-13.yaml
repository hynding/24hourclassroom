week: 13
unit: 4
title: Occasion and Audience in Emerson's "The American Scholar"
topics: ["1.A", "2.A"]
texts:
  - author: Ralph Waldo Emerson
    title: The American Scholar (in Miscellanies, embracing Nature, Addresses, and Lectures)
    year: 1837
    url: https://www.gutenberg.org/ebooks/71683
guide: guides/week-13.md
guide_description: |
  How a speaker reads an occasion and fits an opening and a closing to it. Ralph Waldo Emerson's "The American
  Scholar," delivered to the Phi Beta Kappa Society at Cambridge in 1837, is the case study: a greeting that honours
  a ceremony while asking it to become something more, a topic accepted from custom, and a conclusion that turns a
  lecture into a pledge. Close readings, the rhetorical situation in full, a student speech revised for its
  audience, common mistakes and a self-check.
flashcards_description: |
  30 cards on the parts of the rhetorical situation, ceremonial occasions, Emerson's oration and its opening and
  closing moves, and how to fit a speech's first and last words to a live audience.

flashcards:
  - front: The rhetorical situation → its six parts in the CED
    back: |
      Exigence, audience, writer, purpose, context and message. Skill 1.A asks you to identify and describe each, and the rest of the course asks how they shape the writer's choices.
    topic_code: "1.A"
  - front: Context vs exigence
    back: |
      Context is the wider setting of time, place and culture in which an argument appears. Exigence is the specific problem or need within that setting that prompts this argument now.
    topic_code: "1.A"
  - front: Occasion → how it differs from audience
    back: |
      The occasion is the event and setting (a commencement, a dedication, an anniversary meeting); the audience is the people present or reading. The same audience on a different occasion expects a different speech.
    topic_code: "1.A"
  - front: Ceremonial (epideictic) rhetoric
    back: |
      Speech that praises or blames on an occasion such as a funeral, festival or anniversary. It usually affirms shared values; a bold speaker can use the occasion to challenge them instead.
    topic_code: "1.A"
  - front: Salutation in a speech → its rhetorical work
    back: |
      The opening address (Ladies and gentlemen, Mr. President) names the audience and the occasion's hierarchy. Changing the address later in a speech can signal a change in the relationship.
    topic_code: "2.A"
  - front: "\"The American Scholar\" → the occasion"
    back: |
      An oration delivered by Ralph Waldo Emerson before the Phi Beta Kappa Society at Cambridge, Massachusetts, on August 31, 1837, at the society's annual meeting during Harvard's commencement season.
    topic_code: "1.A"
  - front: "\"The American Scholar\" → its audience"
    back: |
      Members of an academic honour society, Harvard graduates, faculty and guests: educated, mostly young or middle-aged men of New England who prized learning and largely looked to Europe for it.
    topic_code: "1.A"
  - front: "\"The American Scholar\" → its exigence"
    back: |
      American thought still depended on European learning, and a busy commercial nation gave letters little room. Emerson argues that the time for intellectual apprenticeship is over and asks American scholars to think for themselves.
    topic_code: "1.A"
  - front: "\"The American Scholar\" → its message in one sentence"
    back: |
      The true scholar is Man Thinking, educated by nature, by books used rightly and by action, and the American scholar must now trust himself rather than imitate Europe.
    topic_code: "1.A"
  - front: Emerson's greeting "on the recommencement of our literary year"
    back: |
      The first sentence ties the speech to the calendar of the academic society. It honours the ritual and claims a shared identity with the audience (“our”) before any challenge is made.
    topic_code: "2.A"
  - front: "Emerson's \"one of hope, and, perhaps, not enough of labor\""
    back: |
      A gentle reproach in the second sentence: the anniversary is hopeful but idle. The “perhaps” softens the criticism, and “our” includes the speaker in it.
    topic_code: "1.B"
  - front: Emerson's list of Greeks, Troubadours and European capitals
    back: |
      The opening defines the meeting by what it is not: not games or recitations, not courts of love, not science. The contrast shows how modest the American occasion has been, preparing the claim that it should become more.
    topic_code: "2.A"
  - front: "Emerson's \"Our day of dependence ... draws to a close\""
    back: |
      The sentence that states the exigence: America's long apprenticeship to the learning of other lands is ending. It turns a ceremonial greeting into a historical announcement.
    topic_code: "1.A"
  - front: Emerson's star in the constellation Harp
    back: |
      The first paragraph ends by asking who can doubt that poetry will revive, like a star that astronomers say will one day be the pole-star. A prophecy as image, ending the opening on hope.
    topic_code: "2.A"
  - front: Emerson accepting the topic "which not only usage ... seem to prescribe"
    back: |
      Emerson says custom and the society's nature prescribe his topic, the American Scholar. He presents a bold subject as the expected one, which makes the audience feel the speech belongs to their tradition.
    topic_code: "2.A"
  - front: "Emerson's \"one more chapter of his biography\""
    back: |
      The scholar is treated as a person whose life story the society reads year by year. The metaphor makes each annual oration a continuing narrative and invites the audience to see themselves in it.
    topic_code: "2.A"
  - front: Emerson's fable of One Man divided into men
    back: |
      The gods divided Man into men so that he might be more helpful to himself, as the hand is divided into fingers. Society has so subdivided him that each person is a fragment, a finger or an elbow but never a man.
    topic_code: "3.A"
  - front: Emerson's definition "Man Thinking"
    back: |
      In the right state the scholar is Man Thinking; in the degenerate state he becomes a mere thinker or the parrot of other men's thinking. The definition sets up the whole address.
    topic_code: "5.C"
  - front: The three influences in "The American Scholar"
    back: |
      Nature, the mind of the Past (books) and action. Emerson takes them in order, then turns to the scholar's duties and finally to the time and the country, moving from theory to application.
    topic_code: "5.A"
  - front: Emerson's "Meek young men grow up in libraries"
    back: |
      Young readers accept the views of Cicero, Locke and Bacon, forgetting that those authors were only young men in libraries when they wrote. The ironic reversal argues that books should inspire, not command.
    topic_code: "3.A"
  - front: "Emerson's \"Books are the best of things, well used\""
    back: |
      Abused, they are among the worst, and they are for nothing but to inspire. A balanced claim that keeps Emerson's attack on bookworms from becoming an attack on books.
    topic_code: "3.A"
  - front: "Emerson's return to \"Mr. President and Gentlemen\" near the end"
    back: |
      Repeating the opening salutation late in the speech signals that the theory is over and the address is coming home to this audience and this occasion. A frame built from the speech's own formula.
    topic_code: "2.A"
  - front: Emerson's "brothers and friends" in the conclusion
    back: |
      The formal “Gentlemen” of the opening gives way to a warmer address. The change makes the closing pledge feel like a promise among equals rather than a lecture to an audience.
    topic_code: "1.B"
  - front: Emerson's closing triple "We will walk ... work ... speak"
    back: |
      Three parallel clauses beginning “we will” turn the argument into a collective vow. They answer the opening's “day of dependence” with self-reliance of feet, hands and minds.
    topic_code: "2.A"
  - front: The last sentence of "The American Scholar"
    back: |
      A nation of men will for the first time exist, because each believes himself inspired by the Divine Soul which also inspires all men. The conclusion widens from scholars to a nation and from individuals to a shared spirit.
    topic_code: "2.A"
  - front: Oliver Wendell Holmes on "The American Scholar"
    back: |
      Holmes later called the oration America's intellectual Declaration of Independence. The phrase is a useful summary of its exigence, though it is a later reader's description, not Emerson's.
    topic_code: "1.A"
  - front: Opening a speech by honouring the occasion
    back: |
      Acknowledging why the audience has gathered shows respect and earns attention. It works best when it leads somewhere, as Emerson's greeting leads to the claim that the occasion should become more.
    topic_code: "2.A"
  - front: Closing a speech by returning to the audience
    back: |
      After argument, the speaker turns back to the people in the room and asks what they will now do or be. A written argument can do the same by addressing its readers' next step.
    topic_code: "2.A"
  - front: A speech's opening vs an essay's opening
    back: |
      A listener cannot reread, so a speech's opening must win attention and announce the topic clearly. An essay can open more quietly, because the reader can look back.
    topic_code: "2.A"
  - front: The speaker as part of the rhetorical situation
    back: |
      Who the speaker is, and how the audience sees the speaker, shapes what can be said. Emerson, a former minister and a Harvard graduate, could speak to Harvard men as one of them while challenging them.
    topic_code: "1.A"

quiz:
  description: |
    23 questions · about 35 minutes · a seven-question set on the opening of “The American Scholar,” questions on
    its conclusion and structure, a six-question revision set on a student's welcome speech, and short written work.
    Multiple choice, select-all and true/false are graded at once; the fill-in-the-blank items are matched
    automatically; the short answers and the analytical paragraph are graded by your teacher.
  questions:
    # ---- Passage set: the opening of the oration
    - slug: u04-w13-q01
      type: multiple_choice
      topic_code: "1.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      stimulus: &scholar_open |
        *The following passage is the opening of "The American Scholar," an oration Ralph Waldo Emerson delivered before the Phi Beta Kappa Society at Cambridge, Massachusetts, on August 31, 1837.*

        MR. PRESIDENT AND GENTLEMEN,

        I greet you on the recommencement of our literary year. Our anniversary is one of hope, and, perhaps, not enough of labor. We do not meet for games of strength or skill, for the recitation of histories, tragedies, and odes, like the ancient Greeks; for parliaments of love and poesy, like the Troubadours; nor for the advancement of science, like our contemporaries in the British and European capitals. Thus far, our holiday has been simply a friendly sign of the survival of the love of letters amongst a people too busy to give to letters any more. As such, it is precious as the sign of an indestructible instinct. Perhaps the time is already come, when it ought to be, and will be, something else; when the sluggard intellect of this continent will look from under its iron lids, and fill the postponed expectation of the world with something better than the exertions of mechanical skill. Our day of dependence, our long apprenticeship to the learning of other lands, draws to a close. The millions, that around us are rushing into life, cannot always be fed on the sere remains of foreign harvests. Events, actions arise, that must be sung, that will sing themselves. Who can doubt, that poetry will revive and lead in a new age, as the star in the constellation Harp, which now flames in our zenith, astronomers announce, shall one day be the pole-star for a thousand years?

        In this hope, I accept the topic which not only usage, but the nature of our association, seem to prescribe to this day,--the AMERICAN SCHOLAR. Year by year, we come up hither to read one more chapter of his biography. Let us inquire what light new days and events have thrown on his character, and his hopes.
      prompt: |
        The salutation and the first sentence most clearly indicate that the speech's audience is
      options:
        - |
          the general public of Boston, gathered for a political rally
        - |
          the members and guests of a learned society meeting on its annual occasion
        - |
          a group of European scholars visiting America
        - |
          the students of a grammar school at the start of the term
      option_explanations:
        - |
          Nothing suggests a rally. “Mr. President” names the officer of a society, and “our literary year” points to a learned body, not the general public.
        - |
          Correct. “Mr. President and Gentlemen” addresses an organisation's officer and members, and “the recommencement of our literary year” and “Our anniversary” mark a recurring society meeting.
        - |
          The speaker contrasts the audience with “our contemporaries in the British and European capitals,” so the listeners are Americans, not Europeans.
        - |
          “Our anniversary” and “our association” describe adult members of a society. A school term does not have an anniversary or a president addressed this way.
      answer: 1
      explanation: |
        Skill 1.A begins with evidence in the text: forms of address, possessive pronouns and references to the calendar of an institution identify an audience and occasion precisely.

    - slug: u04-w13-q02
      type: multiple_choice
      topic_code: "2.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      stimulus: *scholar_open
      prompt: |
        The sentence beginning “We do not meet for games of strength or skill” contributes to the introduction chiefly by
      options:
        - |
          criticising the ancient Greeks and the Troubadours for wasting their talents
        - |
          proving that American science already surpasses European science
        - |
          defining the occasion by contrast, showing how modest it has been so that the call for it to become something more makes sense
        - |
          explaining the rules and customs of the Phi Beta Kappa Society to newcomers
      option_explanations:
        - |
          The Greeks and Troubadours are examples of occasions that did something; Emerson does not fault them. The contrast reflects on the American meeting, not on them.
        - |
          Emerson says the society does not meet “for the advancement of science, like our contemporaries in the British and European capitals.” He implies America lags, not that it leads.
        - |
          Correct. By listing what the meeting is not, Emerson shows it to be “simply a friendly sign” of a love of letters. That modest picture prepares his claim that the time has come for it to be “something else.”
        - |
          No rules or customs of the society are explained. The sentence compares the occasion with others across history.
      answer: 2
      explanation: |
        Defining by negation is a common opening move: it clears away what the subject is not, so the speaker's claim about what it should be stands out.

    - slug: u04-w13-q03
      type: multiple_choice
      topic_code: "1.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      stimulus: *scholar_open
      prompt: |
        Which sentence most directly states the exigence that Emerson's address responds to?
      options:
        - |
          “Our day of dependence, our long apprenticeship to the learning of other lands, draws to a close.”
        - |
          “I greet you on the recommencement of our literary year.”
        - |
          “As such, it is precious as the sign of an indestructible instinct.”
        - |
          “Year by year, we come up hither to read one more chapter of his biography.”
      option_explanations:
        - |
          Correct. The sentence names the historical situation that makes the speech necessary: American thought has depended on Europe and that dependence is ending. Everything that follows is Emerson's answer to what should replace it.
        - |
          The greeting names the occasion, the society's annual meeting, but not the problem or change that calls for this particular argument.
        - |
          This sentence praises the meeting as a sign of instinct; it describes the present state with approval rather than naming a need for change.
        - |
          This sentence describes the society's annual custom. It explains why the topic recurs, not why it is urgent now.
      answer: 0
      explanation: |
        Distinguish the occasion (why the audience has gathered) from the exigence (why this argument is needed now). The two often appear side by side in a speech's opening, as they do here.

    - slug: u04-w13-q04
      type: multiple_choice
      topic_code: "1.B"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      stimulus: *scholar_open
      prompt: |
        In the sentence “Our anniversary is one of hope, and, perhaps, not enough of labor,” Emerson shows awareness of his audience chiefly by
      options:
        - |
          flattering the members so that they will vote for his proposals
        - |
          offering a criticism softened by “perhaps” and shared through “our,” so that the members can accept it without feeling attacked
        - |
          insisting that the society has failed completely and should be dissolved
        - |
          avoiding any judgment of the society at all
      option_explanations:
        - |
          The sentence includes a criticism (“not enough of labor”), so it is not flattery, and the speech makes no proposals to be voted on.
        - |
          Correct. “Perhaps” hedges the reproach and “our” places the speaker inside the group he criticises. A proud audience can hear the challenge as self-examination rather than insult.
        - |
          The criticism is mild and hedged. Emerson goes on to call the meeting “precious,” so he is not calling for its end.
        - |
          “Not enough of labor” is a judgment, gentle but real. The sentence balances praise (“hope”) with criticism.
      answer: 1
      explanation: |
        Skill 1.B: a writer who must challenge an audience it respects often hedges and includes itself. Watch pronouns and qualifiers in an opening for this kind of audience awareness.

    - slug: u04-w13-q05
      type: multi_select
      topic_code: "2.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 2
      partial_credit: true
      stimulus: *scholar_open
      prompt: |
        Which TWO features make this opening appropriate to a ceremonial occasion? Select two.
      options:
        - |
          It greets the audience formally and ties the speech to the society's annual calendar.
        - |
          It presents the topic as the one that custom and the society's nature prescribe.
        - |
          It opens with a detailed account of the speaker's own education.
        - |
          It lists statistics on the number of books printed in America.
      option_explanations:
        - |
          Correct. “MR. PRESIDENT AND GENTLEMEN” and “the recommencement of our literary year” honour the forms and rhythm of the occasion.
        - |
          Correct. The topic is one “which not only usage, but the nature of our association, seem to prescribe to this day,” so the speech presents itself as part of the society's tradition.
        - |
          Emerson says nothing of his own education in the opening; he speaks as “we” and “our,” a member of the group.
        - |
          No statistics appear. The opening relies on contrast, image and prophecy, not on data.
      answer: [0, 1]
      explanation: |
        A ceremonial opening respects the occasion's forms. Emerson does so in order to earn room for the challenge that follows.

    - slug: u04-w13-q06
      type: true_false
      topic_code: "3.B"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      stimulus: *scholar_open
      prompt: |
        True or false: the second paragraph names the speech's subject and indicates that the speech will examine the scholar's character and hopes in light of recent times.
      answer: true
      explanation: |
        True. Emerson accepts “the topic” of “the AMERICAN SCHOLAR” and proposes to “inquire what light new days and events have thrown on his character, and his hopes.” That is not yet a full thesis, but it signals the direction of the argument, a skill 3.B reading.

    - slug: u04-w13-q07
      type: multiple_choice
      topic_code: "2.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      stimulus: *scholar_open
      prompt: |
        The first paragraph ends with a question about a star in the constellation Harp that “shall one day be the pole-star for a thousand years.” The image serves the introduction primarily by
      options:
        - |
          showing off the speaker's knowledge of astronomy to establish his authority
        - |
          shifting the subject from literature to science for the rest of the speech
        - |
          expressing doubt that American poetry will ever matter
        - |
          ending the opening on a confident prophecy that what is now rising will one day guide others
      option_explanations:
        - |
          The astronomy is borrowed (“astronomers announce”), not displayed as Emerson's expertise. The image matters for what it predicts.
        - |
          The next paragraph returns at once to “the AMERICAN SCHOLAR”; the star is a comparison, not a change of subject.
        - |
          The sentence asks “Who can doubt” that poetry will revive, a question that expects no doubt at all.
        - |
          Correct. A star now overhead will in time become the pole-star by which others steer. The image makes hope for American letters feel both natural and certain.
      answer: 3
      explanation: |
        An opening often ends on an image or question that carries its mood into the argument. Here the rhetorical question turns the exigence into hope.

    # ---- The conclusion and the structure of the oration
    - slug: u04-w13-q08
      type: multiple_choice
      topic_code: "2.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      prompt: |
        Near the end of the oration Emerson declares: “We will walk on our own feet; we will work with our own hands; we will speak our own minds.” Placed in the conclusion, these three clauses chiefly serve to
      options:
        - |
          turn the argument into a shared pledge that answers the opening's announcement that the day of dependence is ending
        - |
          introduce a new argument about the value of manual labor that the speech has not discussed
        - |
          summarise each of the three influences on the scholar in the order they were discussed
        - |
          concede that the audience may not be able to act on the speaker's advice
      option_explanations:
        - |
          Correct. The repeated “we will” makes the audience co-signers of a vow. Feet, hands and minds replace dependence on “the learning of other lands,” closing the frame the opening set up.
        - |
          Action has been discussed earlier as one of the scholar's three influences, and the clauses are figurative. They gather the argument rather than starting a new one.
        - |
          The three clauses are not nature, books and action in order. They express independence, not a summary of the influences.
        - |
          The future tense “will” is confident; nothing in the sentence admits doubt.
      answer: 0
      explanation: |
        A strong conclusion often answers its own opening. Emerson's speech begins with dependence ending and ends with independence promised.

    - slug: u04-w13-q09
      type: multiple_choice
      topic_code: "2.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      prompt: |
        Late in the speech Emerson again addresses “Mr. President and Gentlemen,” the same words that opened the oration, and says that “this confidence in the unsearched might of man belongs, by all motives, by all prophecy, by all preparation, to the American Scholar.” The return to the opening salutation most likely signals that
      options:
        - |
          the speaker has forgotten his place and is starting the speech again
        - |
          the speech is turning from general theory back to this audience and its national task, beginning the conclusion
        - |
          the President of the society has interrupted and must be answered
        - |
          the speaker is addressing a different audience from the one he greeted at the start
      option_explanations:
        - |
          The sentence carries the argument forward (“this confidence ... belongs ... to the American Scholar”); it is a deliberate return, not a restart.
        - |
          Correct. Repeating the formal address marks a shift from the abstract scholar to the people in the room, and the sentence names the American Scholar, the speech's announced topic, as the heir to everything argued.
        - |
          There is no sign of an interruption; the formula is part of Emerson's own structure.
        - |
          The words are identical to the opening salutation, which signals the same audience, called back to attention.
      answer: 1
      explanation: |
        Speakers often mark the turn into a conclusion with a cue the audience recognises. Repeating the salutation is a spoken form of a frame.

    - slug: u04-w13-q10
      type: multiple_choice
      topic_code: "1.B"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      prompt: |
        In the final paragraph Emerson asks whether it is not a disgrace “to be reckoned in the gross,” then answers: “Not so, brothers and friends,--please God, ours shall not be so.” The change from “Gentlemen” to “brothers and friends” most likely reflects Emerson's wish to
      options:
        - |
          show that he has lost patience with the society's formality
        - |
          address only the youngest members of the audience
        - |
          speak to the audience as equals bound by a common purpose, so the closing resolve feels shared rather than imposed
        - |
          indicate that the speech is now addressed to a religious congregation
      option_explanations:
        - |
          The shift is warm, not impatient; nothing in the sentence rejects the society or its forms.
        - |
          The words “brothers and friends” are inclusive and name no age group. They draw the whole audience closer.
        - |
          Correct. Fraternal address replaces formal address at the moment Emerson turns to “ours” and “we will.” The audience is invited to join a resolve, not to receive an instruction.
        - |
          “Please God” is a common expression of hope; the audience is still the society, now addressed more intimately.
      answer: 2
      explanation: |
        Skill 1.B: changes in forms of address track the relationship a speaker wants with an audience. Ending close to the audience suits a speech that asks for commitment.

    - slug: u04-w13-q11
      type: multiple_choice
      topic_code: "5.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      prompt: |
        Emerson discusses the scholar's education “by nature, by books, and by action,” then the scholar's duties, and only then turns to what he has to say “of nearer reference to the time and to this country.” Which best explains how this order supports his conclusion?
      options:
        - |
          It moves from the general theory of the scholar to its application to America, so the closing call to American scholars rests on principles already established.
        - |
          It saves the least important material for last so that the audience will leave early.
        - |
          It follows the order in which Emerson himself read the books he mentions.
        - |
          It begins with the most controversial claim to shock the audience into attention.
      option_explanations:
        - |
          Correct. Only after defining Man Thinking and his influences does Emerson apply the theory to “the time and to this country,” so the conclusion's demand for self-trust follows from the reasoning.
        - |
          The material on America is the climax of the speech, not its least important part; it carries the pledge “We will walk on our own feet.”
        - |
          The order is logical, not autobiographical. Nothing in the speech ties its structure to Emerson's reading history.
        - |
          The speech opens with a greeting and a fable, not with its most controversial claim; the boldest demands come at the end.
      answer: 0
      explanation: |
        Skill 5.A: a line of reasoning is the order of claims that leads to the thesis. Moving from principle to application is one of the most common and effective orders.

    - slug: u04-w13-q12
      type: multiple_choice
      topic_code: "3.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 1
      prompt: |
        Emerson writes that “Meek young men grow up in libraries, believing it their duty to accept the views, which Cicero, which Locke, which Bacon, have given; forgetful that Cicero, Locke, and Bacon were only young men in libraries, when they wrote these books.” This sentence supports which claim?
      options:
        - |
          Young people should stop reading the classics altogether.
        - |
          Cicero, Locke and Bacon were poor writers whose fame is undeserved.
        - |
          Libraries should be closed to young readers until they are older.
        - |
          Books should inspire independent thought rather than be accepted as final authority.
      option_explanations:
        - |
          Emerson objects to how the books are read, not to reading them; elsewhere he says “Books are the best of things, well used.”
        - |
          The sentence does not criticise the authors' quality. Its point is that they were once young readers who thought for themselves.
        - |
          Nothing suggests closing libraries. The problem is meekness in the reader, not access to books.
        - |
          Correct. The reversal shows that the authorities themselves began as young readers. The meek reader who simply accepts their views forgets that they earned those views by thinking.
      answer: 3
      explanation: |
        Skill 3.A: identify the claim a piece of evidence supports. Here the evidence is an ironic observation, and its claim is about the right use of books.

    # ---- Revision set: a student's welcome speech
    - slug: u04-w13-q13
      type: multiple_choice
      topic_code: "2.A"
      source: written for this course
      points: 1
      stimulus: &welcome_draft |
        *A senior has been asked to give a three-minute speech at the assembly that welcomes new ninth graders in the first week of school. The opening and closing of the draft are below; the middle is omitted. Sentences are numbered.*

        **Opening**

        (1) Good morning, ninth graders and teachers. (2) My name is Jordan, and I am a senior. (3) According to a survey, a lot of students say high school is stressful. (4) Today I want to talk to you about clubs. (5) Four years ago I sat where you are sitting, sure that no one would notice if I disappeared into the back row. (6) Then a friend dragged me to a debate club meeting, and I have not stopped arguing since.

        [Middle of the speech omitted]

        **Closing**

        (7) To sum up, clubs are good. (8) The club fair is this Friday after school in the gym, and more than forty clubs will be there. (9) Four years from now, one of you will be standing up here, and I hope you will have a club to thank. (10) Thank you for listening.
      prompt: |
        The writer wants the opening to connect with the ninth graders as quickly as possible. Which revision of the opening best accomplishes this goal?
      options:
        - |
          Move sentence 5 so that it immediately follows sentence 2.
        - |
          Move sentence 1 so that it follows sentence 4.
        - |
          Replace sentence 2 with a list of the writer's awards.
        - |
          Delete sentence 5 and sentence 6.
      option_explanations:
        - |
          Correct. Sentence 5 puts the speaker where the audience now sits (“I sat where you are sitting”). Placed right after the introduction, it builds common ground before the speaker states a purpose.
        - |
          The greeting belongs first in a speech; moving it later would confuse the listeners about when the speech has begun.
        - |
          A list of awards would put distance between a senior and nervous ninth graders, the opposite of the goal.
        - |
          Sentences 5 and 6 are the opening's most vivid and relatable lines; deleting them would remove the connection the writer wants.
      answer: 0
      explanation: |
        For a live audience, the fastest connection is usually shared experience. Moving the speaker's memory forward lets the audience see themselves in the speaker before hearing any advice.

    - slug: u04-w13-q14
      type: multiple_choice
      topic_code: "2.A"
      source: written for this course
      points: 1
      stimulus: *welcome_draft
      prompt: |
        Which version of sentence 4 best states the speech's main claim in a way that fits the occasion and audience?
      options:
        - |
          Today I want to talk to you about clubs, sports, and other activities.
        - |
          Clubs are an important part of many schools in the United States.
        - |
          The fastest way to stop feeling invisible here is to join one club this month, even if you join it by accident the way I did.
        - |
          Research shows that extracurricular activities improve college applications.
      option_explanations:
        - |
          This version widens the topic but still announces it rather than claiming anything, so the audience has nothing to remember or act on.
        - |
          A general statement about schools nationwide does not speak to these ninth graders or to their first week.
        - |
          Correct. The claim speaks to the audience's likely fear (feeling invisible), asks for one manageable action and ties back to the speaker's story. It fits a welcome assembly.
        - |
          College applications are years away for ninth graders, and an unsourced research claim sounds like a lecture. The occasion calls for reassurance and a first step.
      answer: 2
      explanation: |
        A thesis for a speech must be easy to hear and remember. Fit it to what the audience wants and fears at that moment.

    - slug: u04-w13-q15
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *welcome_draft
      prompt: |
        The writer is considering deleting sentence 3. Should the writer make this deletion?
      options:
        - |
          No, because statistics are always more persuasive than personal experience.
        - |
          Yes, because the vague, unsourced claim adds little and its talk of stress may increase the anxiety of an audience the speech means to reassure.
        - |
          No, because the sentence is the speech's thesis and cannot be removed.
        - |
          Yes, because a speech should never mention any problem its audience might face.
      option_explanations:
        - |
          Evidence must suit the audience and purpose. A vague survey is weaker here than the speaker's own story, which the audience can picture.
        - |
          Correct. “A survey” and “a lot of students” are vague, and opening a welcome by stressing stress works against the purpose. The speaker's own experience in sentences 5 and 6 does the job better.
        - |
          The sentence states a general observation, not the speech's claim; sentence 4 is where the writer's purpose is announced.
        - |
          A speech may name problems if it helps the audience meet them. The issue is that this sentence is vague and adds anxiety without a purpose.
      answer: 1
      explanation: |
        Skill 2.B: know what the audience needs. Ninth graders in their first week need reassurance and a concrete step more than they need a reminder that high school is stressful.

