    - slug: u04-w13-q21
      type: short_answer
      topic_code: "1.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 2
      prompt: |
        Identify the audience of “The American Scholar” as precisely as you can, and explain one way the opening of the speech is fitted to that audience.
      answer: |
        Emerson spoke to the Phi Beta Kappa Society at Cambridge, educated men who valued learning but looked to Europe for it. He fits the opening to them by honouring their ritual (“the recommencement of our literary year”) and speaking as one of them (“our anniversary”) before suggesting, gently, that their meeting has been “not enough of labor” and should become something more.
      explanation: |
        1 point: an accurate, specific description of the audience (members of a learned society at Cambridge, Harvard men, educated listeners at an annual meeting). 1 point: one feature of the opening linked to that audience with a reason (the formal greeting, the inclusive “our,” the hedged criticism, the contrast with European learning, the topic presented as customary). Naming “the audience” or “people” without detail earns 0 for the first point.

    - slug: u04-w13-q22
      type: short_answer
      topic_code: "4.B"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 2
      prompt: |
        Write a defensible thesis (one or two sentences) for a rhetorical analysis essay on how Emerson's opening and conclusion work together in “The American Scholar.”
      answer: |
        Emerson opens by honouring a ceremony he gently calls idle and ends by turning his listeners from “Gentlemen” into “brothers and friends” who vow to “walk on our own feet,” so that an annual ritual of praise becomes a pledge of intellectual independence.
      explanation: |
        1 point: an arguable claim about the relationship between the opening and the conclusion (not a summary of the speech). 1 point: the thesis names at least one specific choice in each (address, image, pronoun, pledge) or indicates a clear line of reasoning. A thesis that only says the speech has a good introduction and conclusion earns 0.

    - slug: u04-w13-q23
      type: long_answer
      topic_code: "1.A"
      source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
      points: 5
      prompt: |
        Write one analytical paragraph (about 150-200 words) explaining how Emerson adapts the opening of “The American Scholar” to his occasion and audience. Make a claim, support it with at least two short quotations from the opening, and explain how each one fits the rhetorical situation.
      answer: |
        Claim: Emerson honours the Phi Beta Kappa ceremony in order to challenge it, so that a ritual audience hears a call for change as part of its own tradition. Evidence 1: he greets the society “on the recommencement of our literary year” and calls the meeting “Our anniversary.” Commentary: the formal greeting and the possessive “our” place him inside the group, which earns him the right to add, softly, that the anniversary has been “not enough of labor.” Evidence 2: he accepts “the topic which not only usage, but the nature of our association, seem to prescribe.” Commentary: by claiming that custom chose his subject, Emerson presents a bold argument about American intellectual independence as the expected business of the day. Link: the ceremony becomes the vehicle for its own reform.
      explanation: |
        5 points. Claim (1): an arguable claim about how the opening fits the occasion or audience, not a label such as “Emerson uses ethos.” Evidence (1): at least two accurate, short quotations from the opening, smoothly introduced. Commentary (3): 1 point for explaining the first quotation in terms of the audience or occasion; 1 point for the second; 1 point for connecting the two into a line of reasoning that returns to the claim. A paragraph that summarises the opening without explaining its fit to the rhetorical situation earns at most 2.
