    - slug: u04-w15-q21
      type: short_answer
      topic_code: "3.B"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 2
      prompt: |
        State the overarching thesis of “Self-Reliance” in your own words, and identify one place where Emerson signals the structure of his argument.
      answer: |
        Emerson argues that each person should trust his own thought and act from his own nature rather than conform to society, tradition or his own past opinions. He signals structure in the sentence saying that “a greater self-reliance must work a revolution” in religion, education, pursuits, property and more, which previews the numbered sections that apply the thesis to prayer, travel, society and property.
      explanation: |
        1 point: an accurate thesis in the student's own words (self-trust over conformity), not a single quoted maxim. 1 point: a correct indication of structure (the preview sentence, the numbered sections, the movement from principle to application, or a restatement that opens a new section). Naming a famous line without explaining its place in the argument earns at most 1.

    - slug: u04-w15-q22
      type: short_answer
      topic_code: "5.C"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 2
      prompt: |
        Emerson writes: “Society is a joint-stock company, in which the members agree, for the better securing of his bread to each shareholder, to surrender the liberty and culture of the eater.” In two or three sentences, explain how this comparison develops his argument.
      answer: |
        The comparison presents society as a business deal in which members trade freedom for security. Put in commercial terms, conformity looks like a bad bargain: each person gets bread but gives up “the liberty and culture of the eater,” the very self that bread is meant to feed. The image supports Emerson's claim that “the virtue in most request is conformity” and prepares his demand for nonconformity.
      explanation: |
        1 point: explains what the comparison says (society as a company whose members exchange liberty for security). 1 point: explains how it supports the argument (makes conformity look like a poor trade, sets up the call to nonconformity). Naming the device as a metaphor without explaining its function earns at most 1.

    - slug: u04-w15-q23
      type: long_answer
      topic_code: "4.B"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 5
      prompt: |
        In “Self-Reliance,” Emerson claims: “Whoso would be a man, must be a nonconformist.” Write the introduction (four to six sentences) of an argument essay that defends, challenges or qualifies this claim. Ground your introduction in a specific context, and end with a thesis that previews the structure of your argument. Do not write the body.
      answer: |
        Model (qualify): *Every fall, students who walk into a new school are told two things at once: be yourself, and follow the dress code. Emerson would side with the first. Self-trust is the start of any real thought, and a school that rewards only agreement trains students to hand their opinions to the loudest voice in the room. But a refusal to conform is only as good as what it serves; the student who ignores every rule out of habit is as predictable as the one who obeys them all. Emerson is right that independence of mind is necessary, but nonconformity becomes a virtue only when it serves a principle, as in the dissenter who breaks a rule to protect someone, not the rebel who breaks it to be noticed.* The thesis previews a two-part structure: where Emerson is right, then the limit.
      explanation: |
        5 points. Claim (2): 1 point for a defensible thesis that clearly defends, challenges or qualifies Emerson's claim; 1 more if it previews the structure (the reasons or the movement of the argument). Evidence (1): a specific context or example that grounds the issue (a school, a workplace, a historical moment), not a sweeping generalisation about humanity. Commentary (2): 1 point for showing how the context leads to the thesis; 1 point for an accurate understanding of Emerson's claim (nonconformity as self-trust, not mere rebellion). An introduction that only restates Emerson's sentence earns 0 for the claim points.
