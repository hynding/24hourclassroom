week: 15
unit: 4
title: The Thesis as a Map in Emerson's "Self-Reliance"
topics: ["3.B", "4.B"]
texts:
  - author: Ralph Waldo Emerson
    title: Self-Reliance (in Essays, First Series)
    year: 1841
    url: https://www.gutenberg.org/ebooks/2944
guide: guides/week-15.md
guide_description: |
  The last week of Unit 4 brings the thesis back to the centre: how to find a writer's overarching claim, how a
  thesis can preview the structure of an argument, and how the introduction, the thesis and the conclusion work as
  one system. Ralph Waldo Emerson's “Self-Reliance” (1841) is the case study: a thesis stated in the first paragraph,
  restated as commands and maxims, mapped in a single preview sentence and compressed into the last line. Close
  readings, open and closed theses, a student introduction and conclusion revised, common mistakes and a self-check.
flashcards_description: |
  30 cards on overarching theses, open and closed theses, previewing structure, the thesis-conclusion link, and the
  key claims and sentences of “Self-Reliance.”

flashcards:
  - front: Skill 3.B → what to look for in a reading passage
    back: |
      The overarching thesis of the argument, and any signal it gives of the argument's structure. The thesis may be stated, restated in several forms, or implied; the structure may be previewed or only implied by the order of claims.
    topic_code: "3.B"
  - front: Skill 4.B → what your own thesis must do
    back: |
      Make a claim that requires proof or defense, and, where useful, preview the structure of the argument. A fact, a topic or a statement no one would dispute is not a thesis.
    topic_code: "4.B"
  - front: Overarching thesis vs topic sentence
    back: |
      The overarching thesis is the main claim of the whole argument. A topic sentence is the claim of one paragraph, which should serve the thesis as one step in the line of reasoning.
    topic_code: "3.B"
  - front: Closed (blueprint) thesis
    back: |
      A thesis that names the main reasons in the order the essay will develop them. It is clear and easy to follow, and works well under time pressure, but can become a mechanical list.
    topic_code: "4.B"
  - front: Open thesis
    back: |
      A thesis that states the claim without listing the reasons. It suits essays whose reasoning builds or turns, and it relies on topic sentences and transitions to show the structure.
    topic_code: "4.B"
  - front: Implied thesis
    back: |
      A main claim the writer never states in one sentence but that the whole text makes clear. Satire and narrative arguments often imply their theses; AP readers expect your own thesis to be stated.
    topic_code: "3.B"
  - front: Defensible thesis → the AP Row A standard
    back: |
      A thesis that responds to the prompt with a claim a reasonable reader could dispute. Restating the prompt, summarising or saying something is “important” without saying why does not earn the point.
    topic_code: "4.B"
  - front: Thesis placement in a timed essay
    back: |
      The last sentence or two of the introduction. Readers look there first, and the body paragraphs that follow can then be read as proof.
    topic_code: "4.B"
  - front: Thesis and conclusion → the relationship
    back: |
      The conclusion should return to the thesis changed by the argument: sharper, more qualified or with its significance stated. A conclusion that copies the thesis word for word shows that nothing happened in between.
    topic_code: "2.A"
  - front: Previewing structure without a list
    back: |
      A thesis can preview structure through its grammar: a “because” clause, a contrast (“not X but Y”), or an order of ideas. The reader learns the path without a numbered list.
    topic_code: "4.B"
  - front: Emerson's "Self-Reliance" → publication
    back: |
      An essay by Ralph Waldo Emerson, the second in Essays (1841), later called Essays, First Series. It grew out of journal entries and lectures from the 1830s.
    topic_code: "1.A"
  - front: Emerson's "Self-Reliance" → its overarching thesis
    back: |
      A person should trust his own thought and act from his own nature rather than conform to society, tradition or his own past opinions. Genius is believing that what is true in your private heart is true for all.
    topic_code: "3.B"
  - front: Emerson's painter's verses → the opening anecdote
    back: |
      “Self-Reliance” begins with verses by an eminent painter that were original, not conventional. The small occasion leads at once to the general claim that believing your own thought is genius.
    topic_code: "2.A"
  - front: "Emerson's \"that is genius\" sentence"
    back: |
      To believe your own thought, to believe that what is true for you in your private heart is true for all men, that is genius. The first statement of the thesis, placed in the essay's first paragraph.
    topic_code: "3.B"
  - front: Emerson's Moses, Plato and Milton
    back: |
      The highest merit we give them is that they set at naught books and traditions and spoke what they thought. Famous examples serve as evidence that self-trust, not imitation, makes greatness.
    topic_code: "3.A"
  - front: Emerson's "alienated majesty"
    back: |
      In every work of genius we recognise our own rejected thoughts, which come back with a certain alienated majesty. The phrase names the cost of not trusting yourself: someone else says it first.
    topic_code: "3.B"
  - front: "Emerson's \"Trust thyself: every heart vibrates to that iron string\""
    back: |
      The thesis restated as a command and a metaphor. The heart is an instrument, and self-trust is the string to which every person responds.
    topic_code: "3.B"
  - front: Emerson's "envy is ignorance; that imitation is suicide"
    back: |
      Two compressed claims from the second paragraph. Each is a maxim that restates the thesis negatively: what you lose by looking outside yourself.
    topic_code: "3.B"
  - front: Emerson's society as a joint-stock company
    back: |
      Members agree to surrender the liberty and culture of the eater for the better securing of each shareholder's bread. The commercial comparison makes conformity look like a bad bargain.
    topic_code: "5.C"
  - front: Emerson's "Whoso would be a man, must be a nonconformist"
    back: |
      The thesis restated in social terms. Trusting your own thought means refusing the conformity that society everywhere asks of its members.
    topic_code: "3.B"
  - front: Emerson's "A foolish consistency is the hobgoblin of little minds"
    back: |
      Emerson answers the objection that self-trust will lead to contradiction: speak what you think now, and tomorrow what tomorrow thinks. The qualifier “foolish” limits the attack to consistency for its own sake.
    topic_code: "5.A"
  - front: Emerson's "To be great is to be misunderstood"
    back: |
      The end of the consistency passage, after a list of the misunderstood from Pythagoras to Newton. A maxim that turns the fear of being misunderstood into a mark of greatness.
    topic_code: "3.A"
  - front: Emerson's preview sentence in "Self-Reliance"
    back: |
      A greater self-reliance must work a revolution in men's religion, education, pursuits, modes of living, association, property and speculative views. The sentence maps the essay's final part, which takes up prayer and creeds, travel and culture, society and property.
    topic_code: "3.B"
  - front: Emerson's numbered sections in "Self-Reliance"
    back: |
      After the preview sentence, Emerson numbers his applications: 1 on prayers and creeds, 2 on the superstition of travelling, 3 on imitation in art and thought, 4 on society and property. The numbers let a long, aphoristic essay show its structure.
    topic_code: "3.B"
  - front: Emerson's last line in "Self-Reliance"
    back: |
      Nothing can bring you peace but yourself; nothing can bring you peace but the triumph of principles. The conclusion compresses the thesis into a repeated sentence, ending on self and principle together.
    topic_code: "2.A"
  - front: Emerson's aphoristic style → its effect on finding the thesis
    back: |
      Emerson writes in maxims, many of which sound like theses. The overarching claim is the one the others serve: self-trust over conformity. Maxims are restatements and applications of it.
    topic_code: "3.B"
  - front: Thesis restated vs thesis repeated
    back: |
      A restatement presents the same claim in new terms or a new context (Emerson's commands, maxims and social version). A repetition copies the words. Restatement deepens; repetition stalls.
    topic_code: "3.B"
  - front: An AP "defend, challenge, or qualify" prompt → what the thesis must say
    back: |
      Which of the three you are doing, and why, in your own terms. A qualifying thesis states where the claim holds and where it fails, which is often the most persuasive position.
    topic_code: "4.B"
  - front: A thesis that previews too much
    back: |
      A thesis that lists every example and sub-point becomes a table of contents. Preview the main reasons; leave the evidence for the body.
    topic_code: "4.B"
  - front: Topic sentence that echoes the thesis
    back: |
      Each body paragraph's topic sentence should name one reason from the thesis, in the same order, in fresh words. The echo lets the reader see the map being followed.
    topic_code: "4.B"

quiz:
  description: |
    23 questions · about 35 minutes · a seven-question set on the opening of “Self-Reliance,” questions on its
    thesis, structure and conclusion, a six-question revision set on a student's introduction and conclusion, and
    short written work, including an introduction for an argument on Emerson's claim. Multiple choice, select-all and
    true/false are graded at once; the fill-in-the-blank items are matched automatically; the short answers and the
    introduction are graded by your teacher.
  questions:
    # ---- Passage set: the opening of "Self-Reliance"
    - slug: u04-w15-q01
      type: multiple_choice
      topic_code: "3.B"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 1
      stimulus: &self_reliance_open |
        *The following passage is the opening of Ralph Waldo Emerson's essay "Self-Reliance," from Essays (1841).*

        I READ the other day some verses written by an eminent painter which were original and not conventional. The soul always hears an admonition in such lines, let the subject be what it may. The sentiment they instil is of more value than any thought they may contain. To believe your own thought, to believe that what is true for you in your private heart is true for all men,--that is genius. Speak your latent conviction, and it shall be the universal sense; for the inmost in due time becomes the outmost, and our first thought is rendered back to us by the trumpets of the Last Judgment. Familiar as the voice of the mind is to each, the highest merit we ascribe to Moses, Plato and Milton is that they set at naught books and traditions, and spoke not what men, but what they thought. A man should learn to detect and watch that gleam of light which flashes across his mind from within, more than the lustre of the firmament of bards and sages. Yet he dismisses without notice his thought, because it is his. In every work of genius we recognize our own rejected thoughts; they come back to us with a certain alienated majesty. Great works of art have no more affecting lesson for us than this. They teach us to abide by our spontaneous impression with good-humored inflexibility then most when the whole cry of voices is on the other side. Else to-morrow a stranger will say with masterly good sense precisely what we have thought and felt all the time, and we shall be forced to take with shame our own opinion from another.

        [...]

        Trust thyself: every heart vibrates to that iron string.
      prompt: |
        Which sentence from the passage most directly states the overarching thesis that the rest of the passage develops?
      options:
        - |
          “I READ the other day some verses written by an eminent painter which were original and not conventional.”
        - |
          “Great works of art have no more affecting lesson for us than this.”
        - |
          “To believe your own thought, to believe that what is true for you in your private heart is true for all men,--that is genius.”
        - |
          “Yet he dismisses without notice his thought, because it is his.”
      option_explanations:
        - |
          This sentence is the occasion that prompts the reflection, not the claim. It reports an experience; the thesis is what Emerson draws from it.
        - |
          This sentence points back to a lesson already stated. It depends on the thesis for its meaning rather than stating it.
        - |
          Correct. The sentence defines genius as trusting one's own thought, and everything that follows (the examples of Moses, Plato and Milton, the warning about the stranger, “Trust thyself”) supports or restates it.
        - |
          This sentence describes the failure the thesis warns against. It is a supporting observation, not the main claim.
      answer: 2
      explanation: |
        Skill 3.B: the overarching thesis is the claim the other sentences serve. Test a candidate by asking whether the surrounding sentences explain, support or restate it.

    - slug: u04-w15-q02
      type: multiple_choice
      topic_code: "2.A"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 1
      stimulus: *self_reliance_open
      prompt: |
        Emerson opens the essay with the brief anecdote of reading some verses by an eminent painter. This opening is effective chiefly because it
      options:
        - |
          establishes Emerson as an expert art critic whose judgment the reader must accept
        - |
          begins from a small, everyday experience that leads quickly to the essay's general claim about trusting one's own thought
        - |
          introduces the painter as the main subject of the essay
        - |
          delays the thesis until the essay's final paragraph
      option_explanations:
        - |
          Emerson makes no claim to expertise; he simply “read the other day” some verses. The opening's authority comes from the idea, not from credentials.
        - |
          Correct. An ordinary moment (“the other day”) produces the “admonition” that original lines give the soul, and within three sentences Emerson reaches his thesis. The anecdote makes an abstract claim feel grounded.
        - |
          The painter is never named and disappears after the first sentence; the subject is the reader's own thought.
        - |
          The thesis arrives in the fourth sentence of the essay, not at the end.
      answer: 1
      explanation: |
        An anecdote opening works when it leads somewhere fast. Emerson spends one sentence on the occasion and gets to his claim almost at once.

    - slug: u04-w15-q03
      type: multiple_choice
      topic_code: "3.A"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 1
      stimulus: *self_reliance_open
      prompt: |
        Emerson's reference to Moses, Plato and Milton functions in the passage as
      options:
        - |
          a list of authorities whose books the reader should study closely
        - |
          an admission that only famous people can trust their own thought
        - |
          a contrast between ancient and modern ways of thinking
        - |
          evidence that the greatness we most admire in others came from trusting their own thought over books and traditions
      option_explanations:
        - |
          Emerson praises these figures because they “set at naught books and traditions”; recommending their books as authorities would contradict the point.
        - |
          The examples show what is possible for anyone: the passage goes on to say “A man should learn to detect and watch that gleam of light.”
        - |
          Moses, Plato and Milton span many centuries and are grouped together, not contrasted with moderns.
        - |
          Correct. “The highest merit we ascribe” to them is that they “spoke not what men, but what they thought.” Their example supports the claim that believing your own thought is genius.
      answer: 3
      explanation: |
        Skill 3.A: identify how evidence connects to a claim. Here famous examples serve the thesis by showing that admired greatness began with self-trust.

    - slug: u04-w15-q04
      type: multiple_choice
      topic_code: "3.B"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 1
      stimulus: *self_reliance_open
      prompt: |
        The sentence “In every work of genius we recognize our own rejected thoughts; they come back to us with a certain alienated majesty” supports the thesis chiefly by
      options:
        - |
          criticising great works of art for copying the ideas of ordinary people
        - |
          showing the cost of distrusting our own thoughts: we meet them later as someone else's achievement
        - |
          proving that works of genius are rarely original
        - |
          shifting the subject from individual thought to the history of art
      option_explanations:
        - |
          The great works are not accused of copying; they are works whose authors trusted thoughts that we rejected.
        - |
          Correct. The thoughts we “rejected” return, grand but estranged, in other people's work. The image makes the thesis personal: failing to trust yourself means losing what was yours.
        - |
          The sentence implies the opposite: genius is original because its authors trusted their own thoughts. Our recognition shows we had the same thoughts and abandoned them.
        - |
          The sentence stays on the reader's thought (“our own rejected thoughts”); works of art are the occasion for recognising it, not a new subject.
      answer: 1
      explanation: |
        A thesis is supported not only by examples but by consequences. Emerson shows what happens when the thesis is ignored.

    - slug: u04-w15-q05
      type: multi_select
      topic_code: "3.B"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 2
      partial_credit: true
      stimulus: *self_reliance_open
      prompt: |
        Which TWO sentences restate the essay's thesis as a command to the reader? Select two.
      options:
        - |
          “Speak your latent conviction, and it shall be the universal sense”
        - |
          “Trust thyself: every heart vibrates to that iron string.”
        - |
          “The soul always hears an admonition in such lines, let the subject be what it may.”
        - |
          “Great works of art have no more affecting lesson for us than this.”
      option_explanations:
        - |
          Correct. The imperative “Speak” turns the claim about genius into an instruction, with a promise attached.
        - |
          Correct. “Trust thyself” is the thesis in two words, given as a command, and the metaphor of the heart's “iron string” claims that everyone responds to it.
        - |
          This sentence describes what the soul hears; it is a statement, not a command, and it explains the opening anecdote.
        - |
          This sentence is a statement pointing back to the lesson of genius, not an imperative addressed to the reader.
      answer: [0, 1]
      explanation: |
        Writers often restate a thesis in several forms: as a definition, a command, a maxim. Recognising restatements helps you find the claim the whole text serves.

    - slug: u04-w15-q06
      type: true_false
      topic_code: "4.B"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 1
      stimulus: *self_reliance_open
      prompt: |
        True or false: Emerson's thesis in this passage is a claim that a reasonable reader could dispute.
      answer: true
      explanation: |
        True. A reader could argue that what is true in a private heart is often not true for all, or that tradition corrects private error. Because the claim can be disputed, it requires the defense the essay goes on to give, which is what makes it a thesis in the sense of skill 4.B.

    - slug: u04-w15-q07
      type: multiple_choice
      topic_code: "1.B"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 1
      stimulus: *self_reliance_open
      prompt: |
        The final sentence of the first paragraph warns that otherwise “a stranger will say with masterly good sense precisely what we have thought and felt all the time, and we shall be forced to take with shame our own opinion from another.” This warning appeals chiefly to the reader's
      options:
        - |
          pride, and the discomfort of watching someone else get credit for an idea one had and failed to voice
        - |
          fear of strangers and of the dangers of the outside world
        - |
          respect for the wisdom of experts, which the reader should follow
        - |
          desire for wealth earned through original inventions
      option_explanations:
        - |
          Correct. Almost every reader has felt this: hearing someone else say confidently what we thought but did not say. “With shame” names the feeling Emerson uses to make his thesis urgent.
        - |
          The “stranger” is simply someone else who speaks first; there is no physical danger in the sentence.
        - |
          The stranger's “masterly good sense” is the reader's own idea returned; the point is to trust oneself, not to defer to experts.
        - |
          Money and invention are not mentioned. The loss is one of credit and self-respect, not wealth.
      answer: 0
      explanation: |
        Skill 1.B: an argument shows its understanding of the audience when it appeals to experiences the audience has had. Emerson's warning works because readers recognise it.

    # ---- Thesis, structure and conclusion in the whole essay
    - slug: u04-w15-q08
      type: multiple_choice
      topic_code: "3.B"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 1
      prompt: |
        Late in the essay Emerson writes: “It is easy to see that a greater self-reliance must work a revolution in all the offices and relations of men; in their religion; in their education; in their pursuits; their modes of living; their association; in their property; in their speculative views.” He then numbers the sections that follow, beginning with prayers and creeds. What is the chief function of this sentence?
      options:
        - |
          It introduces a new thesis that replaces the one stated at the start of the essay.
        - |
          It previews the structure of the essay's final part, mapping the areas of life to which the thesis will now be applied.
        - |
          It concludes the essay by summarising everything said so far.
        - |
          It concedes that self-reliance is impossible in religion and education.
      option_explanations:
        - |
          The thesis is unchanged; the sentence applies “a greater self-reliance” to new areas rather than replacing it.
        - |
          Correct. The list of domains (religion, education, pursuits, property and the rest) works like a blueprint thesis for the last movement of the essay, and the numbered sections that follow take the areas up in turn.
        - |
          The sentence comes before several more sections; it looks forward, not back.
        - |
          It claims the opposite: self-reliance “must work a revolution” in these areas. Nothing in it is a concession.
      answer: 1
      explanation: |
        Skill 3.B asks about a thesis and about any signal it gives of the argument's structure. Preview sentences can appear mid-essay, especially in long essays that move from principle to application.

    - slug: u04-w15-q09
      type: multiple_choice
      topic_code: "3.B"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 1
      prompt: |
        After describing how “Society everywhere is in conspiracy against the manhood of every one of its members,” Emerson declares: “Whoso would be a man, must be a nonconformist.” How does this sentence relate to the essay's overarching thesis?
      options:
        - |
          It contradicts the thesis by arguing that people should depend on society.
        - |
          It narrows the thesis to apply only to artists and poets.
        - |
          It replaces the thesis with a new argument about politics.
        - |
          It restates the thesis in social terms: trusting your own thought requires refusing the conformity society demands.
      option_explanations:
        - |
          The sentence attacks conformity to society, which supports the thesis of self-trust rather than contradicting it.
        - |
          “Whoso” means anyone. The claim applies to every person, not only artists.
        - |
          No political program is proposed. The sentence is a restatement of the claim about the individual and society.
        - |
          Correct. The first paragraph framed the thesis as believing your own thought; here it reappears as a demand on how to live among others. Restating a thesis in a new domain is a way of extending it.
      answer: 3
      explanation: |
        Long arguments restate their thesis as they move into new territory. Track the restatements to see the structure: thought, then society, then consistency, then the applications.

    - slug: u04-w15-q10
      type: multiple_choice
      topic_code: "5.A"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 1
      prompt: |
        Emerson writes: “A foolish consistency is the hobgoblin of little minds [...] Speak what you think now in hard words and to-morrow speak what to-morrow thinks in hard words again, though it contradict every thing you said to-day.” Within the essay's line of reasoning, this passage chiefly serves to
      options:
        - |
          answer a likely objection to self-trust, that it will make a person inconsistent, by arguing that such consistency does not matter
        - |
          admit that the thesis of self-reliance is mistaken
        - |
          introduce the subject of education, which the essay then discusses
        - |
          summarise the essay's examples of famous people
      option_explanations:
        - |
          Correct. A reader might object that following each day's thought will lead to contradiction. Emerson answers that only a “foolish consistency” fears it, and the list of the misunderstood that follows turns contradiction into a mark of greatness.
        - |
          Emerson does not retreat from the thesis; he extends it to his own past opinions, which he says need not bind him.
        - |
          The passage concerns consistency of opinion, not education, and the education section comes later.
        - |
          The list of the misunderstood (Pythagoras, Socrates, Newton and others) supports this claim; the passage is not a summary.
      answer: 0
      explanation: |
        Skill 5.A: a line of reasoning includes the answers to objections. Placing the objection after the thesis is stated, and before the applications, keeps the argument moving.

    - slug: u04-w15-q11
      type: multiple_choice
      topic_code: "2.A"
      source: 'Ralph Waldo Emerson, "Self-Reliance" (1841)'
      points: 1
      prompt: |
        “Self-Reliance” ends: “Nothing can bring you peace but yourself. Nothing can bring you peace but the triumph of principles.” Which best describes how this conclusion relates to the essay's thesis?
      options:
        - |
          It introduces a new claim about peace that the essay has not prepared for.
        - |
          It copies the thesis word for word from the first paragraph.
        - |
          It compresses the thesis into a repeated, memorable sentence and pairs the self with principle, so that self-reliance ends as something more than selfishness.
        - |
          It admits that self-reliance cannot bring peace.
      option_explanations:
        - |
          The whole essay has argued that looking outside yourself brings no security; peace through self-trust is its natural end.
        - |
          The first paragraph speaks of believing your own thought; the conclusion restates that idea in new words, not the same ones.
        - |
          Correct. The repetition makes the last line memorable, and the shift from “yourself” to “the triumph of principles” shows that self-reliance means obeying principle, not whim. The thesis returns changed by the argument.
        - |
          The conclusion says the opposite: only yourself and principle can bring peace.
      answer: 2
      explanation: |
        A strong conclusion restates the thesis with something added. Here the addition (principles) answers a reader who might think self-reliance means doing as one likes.

    # ---- Revision set: a student's introduction and conclusion
    - slug: u04-w15-q12
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: &speaking_draft |
        *The following is a draft of the introduction, the first body paragraph's opening and the conclusion of a student's argument about whether the district should require a semester of public speaking for all tenth graders. The student's three body paragraphs argue that the course builds confidence, prepares students for work, and prepares them for civic life, in that order. Sentences are numbered.*

        **Introduction**

        (1) In our district, a student can graduate without ever giving a speech to more than a handful of classmates. (2) This spring the school board will vote on whether to require a semester of public speaking for every tenth grader. (3) Public speaking is a topic that many people have opinions about. (4) There are good and bad things about requiring it.

        **First body paragraph (opening)**

        (5) First, speaking in front of others is scary.

        [Rest of the body omitted]

        **Conclusion**

        (6) In conclusion, public speaking has good and bad sides. (7) A student who learns at fifteen to stand up and explain an idea will not be learning it for the first time at a job interview or a town meeting.
      prompt: |
        Which version of sentence 4 most clearly states a defensible thesis?
      options:
        - |
          Public speaking is an important skill in today's world.
        - |
          The board should require the course, because a semester of practice gives every student a skill that schools now leave to chance.
        - |
          Some students want the course and some do not.
        - |
          This essay will discuss the advantages and disadvantages of a public speaking requirement.
      option_explanations:
        - |
          Almost no one would dispute that public speaking matters, so the sentence does not take a position on the board's decision.
        - |
          Correct. The sentence takes a side on the vote and gives a reason a reader could challenge (that schools now leave the skill to chance), so it requires defense.
        - |
          A report of disagreement is a fact, not a claim; it does not say what the board should do.
        - |
          Announcing a discussion of both sides names a topic. The reader still does not know the writer's position.
      answer: 1
      explanation: |
        Skill 4.B: a thesis must take a position that requires proof. “Important” and “advantages and disadvantages” are the commonest signs of a thesis that has not yet committed.

