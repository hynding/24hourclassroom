  - slug: u04-exam-q38
    type: multiple_choice
    topic_code: "4.B"
    source: general knowledge
    points: 1
    prompt: |
      A rhetorical analysis prompt asks students to analyse the choices a speaker makes to persuade an audience. Which thesis would best earn the thesis point?
    options:
      - |
        The speaker opens by honouring a skeptical audience's values and closes with a shared pledge, turning listeners who came to judge into partners in the cause.
      - |
        The speaker uses ethos, pathos and logos.
      - |
        The speaker gave a speech to an audience about an important topic.
      - |
        This essay will analyse the speaker's rhetorical choices.
    option_explanations:
      - |
        Correct. The thesis names specific choices (an opening that honours values, a closing pledge) and connects them to an effect on a particular audience. It is defensible and suggests a line of reasoning.
      - |
        Listing appeals names no specific choice and makes no claim about their effect on this audience.
      - |
        This is a summary of the situation, not a claim about how the speaker persuades.
      - |
        An announcement restates the task without answering it.
    answer: 0
    explanation: |
      A rhetorical analysis thesis connects the writer's choices to the purpose and audience. Device lists and announcements do not.

  - slug: u04-exam-q39
    type: multiple_choice
    topic_code: "2.A"
    source: general knowledge
    points: 1
    prompt: |
      Which conclusion strategy is most appropriate for a timed AP rhetorical analysis essay?
    options:
      - |
        A call to action urging readers to vote for the speaker
      - |
        A word-for-word repetition of the thesis
      - |
        One or two sentences explaining what the writer's choices reveal about the rhetorical situation, such as a tension the speaker had to manage
      - |
        A new piece of evidence that the body did not discuss
    option_explanations:
      - |
        A rhetorical analysis explains how a text works; urging readers to act on its message confuses analysis with argument.
      - |
        Repeating the thesis exactly adds nothing and uses time that could go to commentary.
      - |
        Correct. A short statement of significance (for example, how the speaker balanced respect and challenge) suits the analytical purpose and can support the sophistication point.
      - |
        New evidence in the conclusion cannot be developed and belongs in the body.
    answer: 2
    explanation: |
      Fit the conclusion to the essay's purpose. An analysis concludes by explaining significance, not by calling for action.

  - slug: u04-exam-q40
    type: multi_select
    topic_code: "2.A"
    source: general knowledge
    points: 2
    partial_credit: true
    prompt: |
      Which TWO opening strategies are most likely to weaken a timed AP argument essay? Select two.
    options:
      - |
        Quoting a dictionary definition of the prompt's key term
      - |
        Beginning with a sweeping claim about all of human history
      - |
        Naming the specific situation the prompt describes and why it matters now
      - |
        Granting the strongest opposing view in a sentence before stating the thesis
    option_explanations:
      - |
        Correct. A dictionary definition tells readers what they already know and delays the claim; a definition helps only when it is the one in dispute.
      - |
        Correct. Claims about all of history are unprovable and say nothing about the issue; they read as filler.
      - |
        Making the situation specific is an effective opening; it establishes exigence quickly.
      - |
        A brief concession before the thesis shows awareness of the audience and can strengthen the argument.
    answer: [0, 1]
    explanation: |
      Openings that delay the claim with generalities cost time and earn nothing. Openings that make the issue specific or engage the opposing view set up the thesis.

  - slug: u04-exam-q41
    type: fill_blank
    topic_code: "1.A"
    source: 'Thomas Paine, Common Sense (1776)'
    points: 1
    prompt: |
      Paine argues that because arms now decide the contest, “the period of debate is closed.” The outbreak of fighting is the event that makes his pamphlet necessary: its ____.
    answer: ["exigence", "the exigence", "exigency", "the exigency"]
    explanation: |
      The exigence is the problem or event that calls for an argument now. For Common Sense, it is the war that had begun while the colonies still hoped to reconcile.

  - slug: u04-exam-q42
    type: fill_blank
    topic_code: "5.C"
    source: 'Thomas Paine, Common Sense (1776)'
    points: 1
    prompt: |
      Paine's “The first a patron, the last a punisher” sets two opposed ideas side by side in balanced phrases. This device is called ____.
    answer: ["antithesis", "an antithesis", "antitheses"]
    explanation: |
      Antithesis places contrasting ideas in parallel structure. It is the sentence-level form of comparison and contrast, and Paine uses it to define society and government against each other.

  - slug: u04-exam-q43
    type: short_answer
    topic_code: "5.C"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 2
    prompt: |
      In two or three sentences, explain how Woolf's image of the crocus develops her claim about writers and their audiences in “The Patron and the Crocus.”
    answer: |
      The crocus stands for the small, genuine thing a writer has seen and wants to express. By saying that “the crocus is an imperfect crocus until it has been shared,” Woolf makes the audience part of the subject's very completion, so the writer cannot simply “think only of your crocus” but must choose a patron who will receive it rightly.
    explanation: |
      1 point: identifies what the crocus represents (the writer's subject, impression or experience). 1 point: explains how the image supports the claim (a subject is incomplete without a reader, so choosing the audience is part of writing). A response that only says the crocus is a symbol, without explaining what it shows, earns at most 1.

  - slug: u04-exam-q44
    type: short_answer
    topic_code: "2.A"
    source: 'Ralph Waldo Emerson, "The American Scholar" (1837); Thomas Paine, Common Sense (1776)'
    points: 2
    prompt: |
      Emerson's “The American Scholar” closes with the pledge “We will walk on our own feet; we will work with our own hands; we will speak our own minds.” The Appendix to Paine's Common Sense ends by asking each reader to “hold out to his neighbour the hearty hand of friendship.” In two or three sentences, explain what each conclusion asks of its audience and why each fits its rhetorical situation.
    answer: |
      Emerson asks a learned audience to commit to intellectual independence, and his “we will” makes the pledge shared, which suits a ceremonial gathering of equals he wants to inspire. Paine asks a divided public to bury the names of Whig and Tory and unite, which suits a population at war that cannot afford to stay split over the question his pamphlet has argued.
    explanation: |
      1 point: accurately states what each conclusion asks (Emerson: self-trust or intellectual independence, as a shared vow; Paine: unity and friendship among divided colonists). 1 point: explains the fit of each to its audience or occasion (a ceremonial society; a divided wartime public). A response that addresses only one text earns at most 1.

  # ---- Essay
  - slug: u04-exam-q45
    type: long_answer
    topic_code: "2.A"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 6
    stimulus: *crocus
    prompt: |
      Rhetorical analysis essay (suggested time: 40 minutes). The passage above is from “The Patron and the Crocus,” an essay that Virginia Woolf included in The Common Reader (1925), a collection written for the general reading public of Britain and America. In it, Woolf addresses writers and readers at a time when newspapers, magazines and many competing publics were all making demands on authors.

      Read the passage carefully. Write an essay that analyzes the rhetorical choices Woolf makes to convey her argument about the relationship between writers and their audiences.

      In your response you should do the following:
      - Respond to the prompt with a thesis that analyzes the writer's rhetorical choices.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Demonstrate an understanding of the rhetorical situation.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      A strong response might argue that Woolf corrects the familiar advice given to young writers, then uses the image of the crocus and a crowded catalogue of publics to persuade readers that choosing an audience is part of the art of writing, not a compromise of it. Paragraph 1: the opening enters a conversation, calling the usual advice “plausible but utterly impracticable” and supplying “the one thing needful,” which positions Woolf as a candid, experienced guide. Paragraph 2: the historical comparison (Elizabethans, eighteenth century, nineteenth century) and the long list of paired publics (“the high-brow public and the red-blood public”) make the modern writer's predicament felt through accumulation. Paragraph 3: the crocus turns an abstract claim into an image; because “the crocus is an imperfect crocus until it has been shared,” the audience becomes part of the subject's completion, and the joke about the gulls dismisses the alternative. Paragraph 4: the closing maxim, “To know whom to write for is to know how to write,” compresses the argument into a balanced sentence that echoes the opening. A sophisticated response might note the tension Woolf manages: she must persuade writers who prize independence that awareness of an audience is not servility.
    explanation: |
      6 points, on the AP rhetorical analysis rubric. Thesis (0-1): 1 point for a defensible thesis that analyzes Woolf's rhetorical choices in relation to her argument about writers and audiences (for example, how she corrects common advice, builds a predicament by comparison, and makes the case concrete through the crocus). A thesis that only restates the prompt, summarises the passage or lists devices without linking them to the argument earns 0. Evidence and commentary (0-4): 4 points for specific, well-chosen evidence (the opening advice, the historical patrons, the list of publics, the crocus, the gulls, the closing maxim) with consistent commentary explaining how each choice advances Woolf's purpose for her audience; 3 points for specific evidence with commentary that explains some choices well but is uneven; 2 points for some specific evidence with commentary that mostly summarises or explains only one or two choices; 1 point for general or summarised evidence with little or no commentary; 0 for no relevant evidence. Sophistication (0-1): 1 point for a response that, throughout, explains the significance of Woolf's choices in light of the rhetorical situation, for example the tension between artistic independence and communication, or how her own essay chooses its patron, the common reader. Isolated flourishes do not earn this point.
