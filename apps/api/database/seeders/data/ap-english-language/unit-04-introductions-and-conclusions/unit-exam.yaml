  # ---- Set 4: revision set on a student's letter to the editor
  - slug: u04-exam-q25
    type: multiple_choice
    topic_code: "2.A"
    source: written for this course
    points: 1
    stimulus: &mural_draft |
      *A student is writing a letter to the editor of the local newspaper arguing that the city should let high school art students paint a mural on the old water tower, which the city council plans to repaint gray next month. The introduction and conclusion are below; the body is omitted. Sentences are numbered.*

      **Introduction**

      (1) Art is very important to society. (2) Next month, the city council plans to spend $40,000 repainting the old water tower the same flat gray it has been since 1962. (3) For the same price, the high school art department has offered to design and paint a mural showing the river, the mill, and the families who built the town. (4) Some residents worry that a student mural would look amateurish. (5) In this letter I will discuss the water tower.

      [Body paragraphs omitted]

      **Conclusion**

      (6) To conclude, the water tower should have a mural. (7) Every visitor who drives into town on Route 9 sees the tower before anything else. (8) The council can give them a gray cylinder, or it can give them the town's story, told by the people who will inherit it. (9) Art is very important to society.
    prompt: |
      The writer wants the letter to begin by making clear why the issue needs attention now. Which revision best accomplishes this goal?
    options:
      - |
        Delete sentence 1, so that the letter begins with sentence 2.
      - |
        Replace sentence 1 with “Since ancient times, people have painted on walls.”
      - |
        Move sentence 5 to the beginning of the letter.
      - |
        Replace sentence 1 with a question: “What is art?”
    option_explanations:
      - |
        Correct. Sentence 2 names the decision, its timing (“Next month”) and its cost, which is the exigence. Sentence 1 is a generality that would fit any letter about any art.
      - |
        A sweeping claim about ancient times is as general as sentence 1 and still delays the specific issue.
      - |
        Sentence 5 announces a topic and gives no reason for urgency; moving it first would make the opening weaker.
      - |
        An abstract question about art leads away from the council's decision and toward a debate the letter does not have.
    answer: 0
    explanation: |
      The fastest way to show urgency is to name the decision and its date. Generalities about art or history delay the reader's sense of why this letter matters now.

