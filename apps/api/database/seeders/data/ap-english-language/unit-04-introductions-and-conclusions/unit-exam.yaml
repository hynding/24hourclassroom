unit: 4
description: |
  45 questions · about 90 minutes · four passage sets and a set of review questions on Unit 4, followed by an
  AP-style essay. Set 1 is an unseen passage from Virginia Woolf's “The Patron and the Crocus” (The Common Reader,
  1925); set 2 is the opening of the first section of Thomas Paine's Common Sense (1776); set 3 is Emerson's
  definition of the scholar from “The American Scholar” (1837); set 4 is a revision set on a student's letter to a
  newspaper. Eleven review questions range across the four weeks, including two short written responses. The exam
  ends with a rhetorical analysis essay on the Woolf passage, scored on the 6-point AP rubric: thesis (0-1),
  evidence and commentary (0-4), sophistication (0-1).
questions:
  # ---- Set 1 (unseen): Woolf, "The Patron and the Crocus"
  - slug: u04-exam-q01
    type: multiple_choice
    topic_code: "2.A"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 1
    stimulus: &crocus |
      *The following passage is from "The Patron and the Crocus," an essay in Virginia Woolf's The Common Reader (1925). Woolf uses "patron" for the public, editor or reader a writer writes for. Kensington Gardens is a London park.*

      Young men and women beginning to write are generally given the plausible but utterly impracticable advice to write what they have to write as shortly as possible, as clearly as possible, and without other thought in their minds except to say exactly what is in them. Nobody ever adds on these occasions the one thing needful: "And be sure you choose your patron wisely", though that is the gist of the whole matter. For a book is always written for somebody to read, and, since the patron is not merely the paymaster, but also in a very subtle and insidious way the instigator and inspirer of what is written, it is of the utmost importance that he should be a desirable man.

      But who, then, is the desirable man--the patron who will cajole the best out of the writer's brain and bring to birth the most varied and vigorous progeny of which he is capable? Different ages have answered the question differently. The Elizabethans, to speak roughly, chose the aristocracy to write for and the playhouse public. The eighteenth-century patron was a combination of coffee-house wit and Grub Street bookseller. In the nineteenth-century the great writers wrote for the half-crown magazines and the leisured classes. And looking back and applauding the splendid results of these different alliances, it all seems enviably simple, and plain as a pikestaff compared with our own predicament--for whom should we write? For the present supply of patrons is of unexampled and bewildering variety. There is the daily Press, the weekly Press, the monthly Press; the English public and the American public; the best-seller public and the worst-seller public; the high-brow public and the red-blood public; all now organised self-conscious entities capable through their various mouthpieces of making their needs known and their approval or displeasure felt. Thus the writer who has been moved by the sight of the first crocus in Kensington Gardens has, before he sets pen to paper, to choose from a crowd of competitors the particular patron who suits him best. It is futile to say, "Dismiss them all; think only of your crocus", because writing is a method of communication; and the crocus is an imperfect crocus until it has been shared. The first man or the last may write for himself alone, but he is an exception and an unenviable one at that, and the gulls are welcome to his works if the gulls can read them.

      [...]

      The patron we want, then, is one who will help us to preserve our flowers from decay. But as his qualities change from age to age, and it needs considerable integrity and conviction not to be dazzled by the pretensions or bamboozled by the persuasions of the competing crowd, this business of patron-finding is one of the tests and trials of authorship. To know whom to write for is to know how to write.
    prompt: |
      Woolf opens the essay with the advice usually given to “Young men and women beginning to write.” The opening is effective chiefly because it
    options:
      - |
        enters a familiar conversation about how to write, calls the usual advice impracticable, and names what it leaves out
      - |
        tells the story of Woolf's own first attempts at writing
      - |
        praises the usual advice as complete and sufficient
      - |
        defines the crocus before explaining what a patron is
    option_explanations:
      - |
        Correct. Woolf starts from advice her readers have heard, calls it “plausible but utterly impracticable,” and supplies “the one thing needful”: choose your patron wisely. Correcting a common view is a classic way to open an argument.
      - |
        No personal story appears; the opening speaks of young writers in general.
      - |
        The advice is called “utterly impracticable,” and Woolf says nobody adds the most important part, so she does not find it complete.
      - |
        The crocus does not appear until the second paragraph; the opening concerns the patron.
    answer: 0
    explanation: |
      Entering a conversation (what people usually say) and then correcting or completing it gives an introduction a clear purpose and makes the writer's claim stand out.

  - slug: u04-exam-q02
    type: multiple_choice
    topic_code: "3.B"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 1
    stimulus: *crocus
    prompt: |
      Which statement best expresses the overarching claim of the passage?
    options:
      - |
        The Elizabethans wrote better than the writers of Woolf's own time.
      - |
        Writers should ignore every audience and write only for themselves.
      - |
        Because writing is always written for someone and shaped by that reader, choosing one's audience well is central to writing well.
      - |
        Newspapers are the best patrons a modern writer can find.
    option_explanations:
      - |
        Woolf calls the results of past alliances “splendid” but does not rank ages against each other; the comparison serves to show how complicated the present has become.
      - |
        Woolf rejects this directly: it is “futile” to say “think only of your crocus,” because writing is communication.
      - |
        Correct. The first paragraph says a book “is always written for somebody to read” and the patron is “the instigator and inspirer of what is written”; the passage ends: “To know whom to write for is to know how to write.”
      - |
        The daily Press is only one patron among a “bewildering variety”; the passage does not single it out as best.
    answer: 2
    explanation: |
      The thesis appears in the first paragraph and returns, compressed, in the last sentence. Recognising the restatement confirms which claim is overarching.

  - slug: u04-exam-q03
    type: multiple_choice
    topic_code: "5.C"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 1
    stimulus: *crocus
    prompt: |
      The sentences describing the patrons of the Elizabethans, the eighteenth century and the nineteenth century develop the argument chiefly by
    options:
      - |
        narrating the life of a single writer across three centuries
      - |
        defining the word “patron” by its origin in the Latin language
      - |
        listing the faults of each age's literature
      - |
        comparing past ages, each with a fairly clear patron, to the present, which has too many
    option_explanations:
      - |
        No single writer is followed; each sentence names a different age and its readers.
      - |
        The word's origin is never discussed. The sentences describe who writers wrote for, not what the word means.
      - |
        Woolf calls the past alliances “splendid”; she praises their results rather than listing faults.
      - |
        Correct. Each past age had a recognisable patron, so “it all seems enviably simple” next to “our own predicament.” The historical comparison sets up the problem of the present.
    answer: 3
    explanation: |
      Skill 5.C: a comparison across time often exists to make the present problem visible. Ask what the past is being compared to.

  - slug: u04-exam-q04
    type: multiple_choice
    topic_code: "5.C"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 1
    stimulus: *crocus
    prompt: |
      The list beginning “There is the daily Press, the weekly Press, the monthly Press” primarily serves to
    options:
      - |
        classify the modern public into many paired, competing groups, conveying the “bewildering variety” a writer must choose from
      - |
        recommend that writers publish in as many places as possible
      - |
        prove that English readers are more educated than American readers
      - |
        show that modern patrons have no way of making their wishes known
    option_explanations:
      - |
        Correct. The paired groups (English and American, best-seller and worst-seller, high-brow and red-blood) sort the public into kinds, and the sheer length of the list enacts the “bewildering variety” Woolf has just named.
      - |
        The list describes the writer's problem; it does not advise publishing everywhere. The writer must choose “the particular patron who suits him best.”
      - |
        The English and American publics are listed side by side without ranking.
      - |
        Woolf says the reverse: they are “capable through their various mouthpieces of making their needs known.”
    answer: 0
    explanation: |
      Classification can be persuasive by accumulation. A long list of kinds makes a reader feel the difficulty of choosing among them.

  - slug: u04-exam-q05
    type: multiple_choice
    topic_code: "1.A"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 1
    stimulus: *crocus
    prompt: |
      In the context of the passage, “the first crocus in Kensington Gardens” most nearly represents
    options:
      - |
        the newspaper that pays the writer
      - |
        the genuine experience or subject that moves a writer and that the writer wants to share
      - |
        the crowd of competing publics
      - |
        a gardening topic that Woolf thinks writers should avoid
    option_explanations:
      - |
        The newspaper is one of the patrons competing for the writer; the crocus is what the writer has to offer them.
      - |
        Correct. The writer “has been moved by the sight of the first crocus” and must then choose a patron. The flower stands for the small, real thing a writer has seen and wants to communicate.
      - |
        The crowd is the patrons; the crocus is set against them as the writer's own material.
      - |
        The crocus is a symbol, not a recommended or forbidden topic; Woolf's point concerns any subject that moves a writer.
    answer: 1
    explanation: |
      Identifying what a recurring image stands for is often the key to a writer's message. Woolf's crocus is the writer's subject, which is “imperfect” until shared.

  - slug: u04-exam-q06
    type: multiple_choice
    topic_code: "3.A"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 1
    stimulus: *crocus
    prompt: |
      Woolf rejects the advice “Dismiss them all; think only of your crocus” on the grounds that
    options:
      - |
        the crocus will die if the writer waits too long
      - |
        editors will refuse work that ignores their readers
      - |
        writing is a form of communication, so a subject is incomplete until it reaches a reader
      - |
        the patrons are all equally good and any one of them will do
    option_explanations:
      - |
        The crocus's fading is not the reason here. The reason given is that writing communicates.
      - |
        Editors' refusals are not mentioned. Woolf's reason concerns the nature of writing, not market pressure.
      - |
        Correct. “Writing is a method of communication; and the crocus is an imperfect crocus until it has been shared.” The claim answers the objection with a definition of writing.
      - |
        The passage stresses choosing “the particular patron who suits him best,” which assumes they are not all equal.
    answer: 2
    explanation: |
      Skill 3.A: identify the reasoning that supports a claim. Woolf answers an objection by defining writing as communication, which makes an audience necessary.

  - slug: u04-exam-q07
    type: multiple_choice
    topic_code: "2.A"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 1
    stimulus: *crocus
    prompt: |
      The second paragraph ends: “the gulls are welcome to his works if the gulls can read them.” The sentence concludes the paragraph by
    options:
      - |
        recommending that writers retreat to the seaside for inspiration
      - |
        admitting that Woolf herself writes only for herself
      - |
        introducing the subject of the next section, which concerns birds
      - |
        dismissing, with dry humour, the writer who writes for no one, and so closing off the alternative to choosing a patron
    option_explanations:
      - |
        The gulls are a joke about a solitary writer whose only readers would be seabirds, not advice about where to write.
      - |
        Woolf calls the writer for himself alone “an exception and an unenviable one”; she does not count herself among them.
      - |
        Birds are not the subject of what follows; the passage moves on to the qualities of the patron.
      - |
        Correct. Having conceded that “the first man or the last may write for himself alone,” Woolf ends the paragraph by making that choice comic. The joke shuts the door on writing for no one, leaving only the question of whom to write for.
    answer: 3
    explanation: |
      Paragraphs have conclusions too. A final sentence that dismisses an alternative clears the way for the writer's own position.

  - slug: u04-exam-q08
    type: multi_select
    topic_code: "1.A"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 2
    partial_credit: true
    stimulus: *crocus
    prompt: |
      Which TWO statements accurately describe the rhetorical situation the passage addresses? Select two.
    options:
      - |
        Writers of Woolf's time face a crowd of organised publics, each able to make its wishes known.
      - |
        Woolf's purpose is to persuade writers that choosing an audience is part of the craft, not a betrayal of it.
      - |
        Woolf is addressing a single wealthy patron who has refused to pay her.
      - |
        The passage was written to sell advertising space in the daily Press.
    option_explanations:
      - |
        Correct. The “present supply of patrons is of unexampled and bewildering variety,” all “organised self-conscious entities” that can make their “approval or displeasure felt.” That is the context and exigence.
      - |
        Correct. Against advice that says to ignore the audience, Woolf argues that “To know whom to write for is to know how to write.”
      - |
        No single patron is addressed; Woolf speaks of patrons in general and of what “we” writers want.
      - |
        The daily Press is one of the patrons discussed, not the essay's sponsor or purpose.
    answer: [0, 1]
    explanation: |
      Skill 1.A: describe context and purpose with evidence. The list of publics gives the context; the first and last sentences give the purpose.

  - slug: u04-exam-q09
    type: true_false
    topic_code: "3.B"
    source: 'Virginia Woolf, "The Patron and the Crocus," The Common Reader (1925)'
    points: 1
    stimulus: *crocus
    prompt: |
      True or false: the final sentence of the passage restates, in compressed form, the claim made in the first paragraph.
    answer: true
    explanation: |
      True. The first paragraph argues that the patron is “the instigator and inspirer of what is written,” so choosing him matters; “To know whom to write for is to know how to write” compresses that claim into a balanced maxim.

  # ---- Set 2: Paine, "Of the Origin and Design of Government in General"
  - slug: u04-exam-q10
    type: multiple_choice
    topic_code: "2.A"
    source: 'Thomas Paine, Common Sense (1776)'
    points: 1
    stimulus: &paine_origin |
      *The following passage is the opening of "Of the Origin and Design of Government in General," the first section of Thomas Paine's Common Sense (1776).*

      Some writers have so confounded society with government, as to leave little or no distinction between them; whereas they are not only different, but have different origins. Society is produced by our wants, and government by our wickedness; the former promotes our happiness positively by uniting our affections, the latter negatively by restraining our vices. The one encourages intercourse, the other creates distinctions. The first a patron, the last a punisher.

      Society in every state is a blessing, but government even in its best state is but a necessary evil; in its worst state an intolerable one; for when we suffer, or are exposed to the same miseries by a government, which we might expect in a country without government, our calamity is heightened by reflecting that we furnish the means by which we suffer. Government, like dress, is the badge of lost innocence; the palaces of kings are built on the ruins of the bowers of paradise. For were the impulses of conscience clear, uniform, and irresistibly obeyed, man would need no other lawgiver; but that not being the case, he finds it necessary to surrender up a part of his property to furnish means for the protection of the rest; and this he is induced to do by the same prudence which in every other case advises him out of two evils to choose the least. Wherefore, security being the true design and end of government, it unanswerably follows that whatever form thereof appears most likely to ensure it to us, with the least expence and greatest benefit, is preferable to all others.
    prompt: |
      Paine begins the section with the claim that “Some writers have so confounded society with government, as to leave little or no distinction between them.” This opening sentence chiefly serves to
    options:
      - |
        praise earlier writers for their careful definitions
      - |
        correct a confusion attributed to other writers, which sets up the distinction the section will develop
      - |
        narrate the history of the first governments
      - |
        announce that the colonies should declare independence immediately
    option_explanations:
      - |
        Paine says these writers have “confounded” the two, which is criticism, not praise.
      - |
        Correct. By naming an error (“little or no distinction”) and answering it (“they are not only different, but have different origins”), Paine opens by entering a conversation and stakes out the distinction everything else depends on.
      - |
        The history of the first governments comes later in the section; the opening sentence makes a claim about other writers' confusion.
      - |
        Independence is not mentioned here. The section begins with general principles before applying them to America.
    answer: 1
    explanation: |
      An opening that corrects a common confusion tells the reader at once what is at stake and what the writer will distinguish.

  - slug: u04-exam-q11
    type: multiple_choice
    topic_code: "5.C"
    source: 'Thomas Paine, Common Sense (1776)'
    points: 1
    stimulus: *paine_origin
    prompt: |
      The first paragraph develops Paine's argument primarily through
    options:
      - |
        a narrative of how one colonist came to distrust the king
      - |
        statistics comparing the cost of government in several countries
      - |
        a series of balanced contrasts that define society and government against each other
      - |
        a classification of governments into monarchies, aristocracies and republics
    option_explanations:
      - |
        No individual colonist appears, and nothing is told as a story; the paragraph makes general claims.
      - |
        No figures appear. The paragraph argues by contrast, not by data.
      - |
        Correct. Society comes from “our wants,” government from “our wickedness”; one works “positively,” the other “negatively”; one “encourages intercourse,” the other “creates distinctions”; “The first a patron, the last a punisher.” Each pair defines both terms by contrast.
      - |
        Forms of government are not classified here; the paragraph contrasts government as such with society.
    answer: 2
    explanation: |
      Skill 5.C: comparison and definition often work together. Paine defines government by setting it against society, point by point.

  - slug: u04-exam-q12
    type: multiple_choice
    topic_code: "5.C"
    source: 'Thomas Paine, Common Sense (1776)'
    points: 1
    stimulus: *paine_origin
    prompt: |
      The sentence “Government, like dress, is the badge of lost innocence; the palaces of kings are built on the ruins of the bowers of paradise” contributes to the argument chiefly by
    options:
      - |
        recommending simpler clothing as a political reform
      - |
        praising the beauty of royal palaces as signs of progress
      - |
        conceding that government existed in paradise before the fall
      - |
        using an analogy to the story of Eden to present government as a sign of humanity's fall, and kings as built on its ruin
    option_explanations:
      - |
        Dress is a comparison, not a policy. Clothing, like government, became necessary only after innocence was lost.
      - |
        The palaces are “built on the ruins” of paradise; the image condemns them rather than praising them.
      - |
        The analogy says the opposite: government, like dress, came only with “lost innocence,” after paradise.
      - |
        Correct. Readers who knew Genesis would recall that clothing began with the fall. Comparing government to dress makes it a “badge” of sin, and the second clause turns kings' palaces into monuments on paradise's ruins.
    answer: 3
    explanation: |
      An analogy works on an audience through what it already believes. Paine draws on a biblical story his readers knew to make government seem a symptom of human weakness.

  - slug: u04-exam-q13
    type: multiple_choice
    topic_code: "3.B"
    source: 'Thomas Paine, Common Sense (1776)'
    points: 1
    stimulus: *paine_origin
    prompt: |
      Which sentence from the passage best states the claim that the rest of the section's opening develops and that later parts of the pamphlet apply?
    options:
      - |
        “Society in every state is a blessing, but government even in its best state is but a necessary evil; in its worst state an intolerable one”
      - |
        “The one encourages intercourse, the other creates distinctions.”
      - |
        “For were the impulses of conscience clear, uniform, and irresistibly obeyed, man would need no other lawgiver”
      - |
        “Some writers have so confounded society with government”
    option_explanations:
      - |
        Correct. The sentence gives Paine's position on both terms and grades government (“necessary evil,” “intolerable”). What follows explains why government is necessary and what it is for, which prepares the judgment of Britain's government.
      - |
        This is one contrast among several that support the distinction; it does not state the overarching position.
      - |
        This sentence explains why government is needed at all, a step in the reasoning rather than the main claim.
      - |
        This sentence names a confusion that the section corrects; the correction, not the confusion, is the claim.
    answer: 0
    explanation: |
      To find the thesis, look for the sentence that takes a position the others explain. Supporting contrasts and reasons depend on it.

  - slug: u04-exam-q14
    type: multiple_choice
    topic_code: "3.A"
    source: 'Thomas Paine, Common Sense (1776)'
    points: 1
    stimulus: *paine_origin
    prompt: |
      Paine says that a person surrenders part of his property for the protection of the rest out of “the same prudence which in every other case advises him out of two evils to choose the least.” This reasoning supports his argument by
    options:
      - |
        proving that all governments are equally bad
      - |
        appealing to a principle of common prudence that readers already apply in daily life, so that accepting government seems sensible while judging it an evil
      - |
        showing that property should be abolished
      - |
        citing the authority of English law
    option_explanations:
      - |
        Paine distinguishes forms of government at the end of the paragraph (“whatever form thereof appears most likely to ensure it ... is preferable”), so they are not equally bad.
      - |
        Correct. Choosing the lesser of two evils is ordinary good sense. The principle lets Paine call government an evil and still explain why people accept it, which leads to judging governments by how well they provide security.
      - |
        People surrender “a part of” their property to protect “the rest”; the reasoning assumes property is worth protecting.
      - |
        No law is cited. Paine relies on reason and common experience, in keeping with the pamphlet's title.
    answer: 1
    explanation: |
      Skill 3.A: reasoning can be evidence. A principle the audience already accepts makes the next step of the argument feel like common sense.

  - slug: u04-exam-q15
    type: multiple_choice
    topic_code: "5.C"
    source: 'Thomas Paine, Common Sense (1776)'
    points: 1
    stimulus: *paine_origin
    prompt: |
      The short sentence “The first a patron, the last a punisher” ends the first paragraph. Its main effect is to
    options:
      - |
        introduce a new term that the rest of the section defines
      - |
        express doubt about the distinction just made
      - |
        compress the paragraph's contrasts into a memorable pair, closing the definition with a summary the reader can carry forward
      - |
        shift the subject from government to literature
    option_explanations:
      - |
        “Patron” and “punisher” summarise society and government; no new term is introduced.
      - |
        The sentence is confident and emphatic, the climax of the contrasts rather than a hedge.
      - |
        Correct. After longer contrasts, Paine ends with four words that are easy to remember, alliterating on “p.” The paragraph's definition closes in a single, quotable antithesis.
      - |
        “Patron” here means a protector or benefactor; the subject remains society and government.
    answer: 2
    explanation: |
      Ending a paragraph with its shortest, sharpest sentence is a way of concluding. The summary gathers the paragraph's work into a phrase.

  - slug: u04-exam-q16
    type: multiple_choice
    topic_code: "1.B"
    source: 'Thomas Paine, Common Sense (1776)'
    points: 1
    stimulus: *paine_origin
    prompt: |
      Paine opens Common Sense with general principles about government rather than with direct attacks on the king. Given his audience, this choice is effective chiefly because
    options:
      - |
        readers still loyal to the king can agree with principles stated in general terms before seeing them applied to Britain
      - |
        his audience was made up of philosophers who disliked practical questions
      - |
        it allows Paine to avoid ever criticising Britain in the pamphlet
      - |
        the king had asked colonial writers to discuss only general topics
    option_explanations:
      - |
        Correct. A reader who would bristle at an attack on the king can accept that government is “a necessary evil” whose “true design and end” is security. Once those principles are granted, judging Britain's government by them follows.
      - |
        Paine wrote for ordinary colonists, not philosophers, and the pamphlet's purpose is practical.
      - |
        Later sections attack monarchy and Britain directly; the general opening prepares those attacks rather than replacing them.
      - |
        No such request is mentioned or implied; the order is Paine's strategy.
    answer: 0
    explanation: |
      Skill 1.B: with a resistant audience, writers often win agreement on principles before applying them. The audience then finds the conclusion harder to reject.

  - slug: u04-exam-q17
    type: true_false
    topic_code: "5.C"
    source: 'Thomas Paine, Common Sense (1776)'
    points: 1
    stimulus: *paine_origin
    prompt: |
      True or false: Paine defines society and government in part by their origins, saying that society comes from human wants and government from human wickedness.
    answer: true
    explanation: |
      True. “Society is produced by our wants, and government by our wickedness.” Defining by origin is a form of definition that shapes judgment: what comes from wickedness can only be “a necessary evil.”

  # ---- Set 3: Emerson, "The American Scholar": the scholar defined
  - slug: u04-exam-q18
    type: multiple_choice
    topic_code: "5.C"
    source: 'Ralph Waldo Emerson, "The American Scholar" (1837)'
    points: 1
    stimulus: &man_thinking |
      *The following passage comes just after the introduction of "The American Scholar," the oration Ralph Waldo Emerson delivered before the Phi Beta Kappa Society at Cambridge in 1837.*

      It is one of those fables, which, out of an unknown antiquity, convey an unlooked-for wisdom, that the gods, in the beginning, divided Man into men, that he might be more helpful to himself; just as the hand was divided into fingers, the better to answer its end.

      The old fable covers a doctrine ever new and sublime; that there is One Man,--present to all particular men only partially, or through one faculty; and that you must take the whole society to find the whole man. Man is not a farmer, or a professor, or an engineer, but he is all. Man is priest, and scholar, and statesman, and producer, and soldier. In the *divided* or social state, these functions are parcelled out to individuals, each of whom aims to do his stint of the joint work, whilst each other performs his. The fable implies, that the individual, to possess himself, must sometimes return from his own labor to embrace all the other laborers. But, unfortunately, this original unit, this fountain of power, has been so distributed to multitudes, has been so minutely subdivided and peddled out, that it is spilled into drops, and cannot be gathered. The state of society is one in which the members have suffered amputation from the trunk, and strut about so many walking monsters,--a good finger, a neck, a stomach, an elbow, but never a man.

      Man is thus metamorphosed into a thing, into many things. The planter, who is Man sent out into the field to gather food, is seldom cheered by any idea of the true dignity of his ministry. He sees his bushel and his cart, and nothing beyond, and sinks into the farmer, instead of Man on the farm. The tradesman scarcely ever gives an ideal worth to his work, but is ridden by the routine of his craft, and the soul is subject to dollars. The priest becomes a form; the attorney, a statute-book; the mechanic, a machine; the sailor, a rope of the ship.

      In this distribution of functions, the scholar is the delegated intellect. In the right state, he is, *Man Thinking*. In the degenerate state, when the victim of society, he tends to become a mere thinker, or, still worse, the parrot of other men’s thinking.
    prompt: |
      Emerson begins this part of the oration with an ancient fable about the gods dividing Man into men. The fable functions chiefly to
    options:
      - |
        entertain the audience with a story unrelated to the argument
      - |
        prove historically that society was founded by the gods
      - |
        criticise the ancient Greeks for their religion
      - |
        provide an image of an original whole divided into parts, which prepares the definition of the scholar as one part of that whole
    option_explanations:
      - |
        The fable is the foundation of what follows; Emerson says it “covers a doctrine ever new and sublime.”
      - |
        Emerson presents it as a fable that conveys “unlooked-for wisdom,” not as history.
      - |
        No criticism of the Greeks or their religion appears; the fable is treated with respect.
      - |
        Correct. One Man divided like a hand into fingers leads to the claim that society parcels out functions, and so to “the scholar is the delegated intellect.” The fable sets up the definition.
    answer: 3
    explanation: |
      Skill 5.C: narration (here, a fable) can serve definition. The story supplies the frame (whole and parts) in which the scholar is defined.

