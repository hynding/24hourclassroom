week: 12
unit: 4
title: Openings and Closings in Paine's Common Sense
topics: ["2.A"]
texts:
  - author: Thomas Paine
    title: Common Sense
    year: 1776
    url: https://www.gutenberg.org/ebooks/147
guide: guides/week-12.md
guide_description: |
  The first week of Unit 4: what an introduction and a conclusion are for in an argument, and why the AP rubric
  rewards a thesis that arrives in the right place for the right reader. Thomas Paine's Common Sense (1776) is the
  case study: an Introduction that concedes its views are unfashionable before claiming the whole world's attention,
  a section opening that sets terms with the reader, and two conclusions that turn reasons into action. Close
  readings, a weak and a strong student introduction and conclusion, common mistakes and a self-check.
flashcards_description: |
  30 cards on the jobs of an introduction and a conclusion, the moves Paine makes at the start and end of Common
  Sense, and the habits that make AP essay openings and closings work or fail.

flashcards:
  - front: Skill 2.A → what the CED asks you to do
    back: |
      Write introductions and conclusions appropriate to the purpose and context of the rhetorical situation. The test is fit: an opening or closing that would suit any essay on any topic does not fit this one.
    topic_code: "2.A"
  - front: An argument's introduction → its three jobs
    back: |
      Orient the reader (the issue and why it matters now), position the writer (the stance and the terms of the argument), and point ahead (a thesis, and often a hint of the line of reasoning).
    topic_code: "2.A"
  - front: An argument's conclusion → its three jobs
    back: |
      Gather the reasoning into one idea, show its significance (so what, for whom, beyond this essay), and leave the reader with a final position or action. Restating the thesis in new words is at most a start.
    topic_code: "2.A"
  - front: The "since the dawn of time" opening → why readers discount it
    back: |
      A sweeping claim about all of history is unprovable and says nothing about this issue. It signals a writer filling space before thinking. Start with the specific situation instead.
    topic_code: "2.A"
  - front: The "In this essay I will..." thesis → the problem
    back: |
      It announces a topic, not a claim. A reader learns what the essay is about but not what the writer thinks, so there is nothing to agree or disagree with.
    topic_code: "4.B"
  - front: The "In conclusion" summary paragraph → the problem
    back: |
      Repeating the body points in order tells the reader nothing new and wastes the paragraph where significance belongs. Ask what follows from the argument, not what the argument said.
    topic_code: "2.A"
  - front: Opening by naming the exigence
    back: |
      Begin with the event, problem or decision that makes the argument necessary now: a vote next week, a policy that took effect, a number that changed. The reader sees at once why to keep reading.
    topic_code: "1.A"
  - front: Opening by entering a conversation
    back: |
      Begin with what others say about the issue (a common view, a claim you will qualify or reject), then place your position against it. Paine does this when he notes that volumes have been written on the struggle.
    topic_code: "2.A"
  - front: Opening with a concession
    back: |
      Begin by granting a point to the resistant reader before making your claim. Paine opens Common Sense by admitting his sentiments may not yet be fashionable, which disarms readers who expect to disagree.
    topic_code: "2.A"
  - front: Conclusion that widens the stakes
    back: |
      Move from the case argued to what it means for a larger group or a longer time. Paine moves from colonial taxes to the claim that the cause of America is the cause of all mankind.
    topic_code: "2.A"
  - front: Conclusion that calls for action
    back: |
      End by telling the audience what to do, and making the next step concrete. A call to action fits when the purpose is to move readers, as in a speech or pamphlet; it can sound forced in a rhetorical analysis essay.
    topic_code: "2.A"
  - front: Conclusion that echoes the opening
    back: |
      Return to an image, phrase or scene from the introduction, now changed by the argument. The frame gives a sense of completion and shows how far the reader has come.
    topic_code: "2.A"
  - front: Common Sense → publication
    back: |
      A pamphlet by Thomas Paine, first published anonymously in Philadelphia in January 1776, months after fighting began at Lexington and Concord and months before the Declaration of Independence. It sold in enormous numbers and made the case for independence in plain language.
    topic_code: "1.A"
  - front: Common Sense → its audience
    back: |
      Ordinary colonists, many still loyal to the king and hoping for reconciliation, as well as colonial leaders. Paine writes for readers who are angry at Parliament but not yet ready to break with Britain.
    topic_code: "1.B"
  - front: Common Sense → its exigence
    back: |
      War had begun in April 1775, yet most colonists still hoped to reconcile with Britain. Paine argues that the outbreak of fighting has made the old debate obsolete and that independence is the only course.
    topic_code: "1.A"
  - front: Paine's Introduction → "not yet sufficiently fashionable"
    back: |
      The opening admits that the pamphlet's views may not yet win general favor, then explains why: long habit makes a wrong thing look right. The concession turns readers' resistance into evidence of custom, not of reason.
    topic_code: "2.A"
  - front: "Paine's maxim \"Time makes more converts than reason\""
    back: |
      A short, quotable sentence that ends the Introduction's first paragraph. It predicts that resistance will fade and quietly invites the reader to be ahead of the change rather than behind it.
    topic_code: "2.A"
  - front: Paine's Introduction → avoiding the personal
    back: |
      Paine says he has avoided everything personal among the colonists, giving neither compliments nor censure to individuals. The promise reassures a divided audience that the pamphlet attacks a system, not neighbours.
    topic_code: "1.B"
  - front: "Paine's \"cause of all mankind\" sentence → its placement"
    back: |
      It opens the Introduction's last paragraph, so the opening ends on the widest possible stakes. Colonists' quarrel with the king becomes a concern of every person to whom nature has given the power of feeling.
    topic_code: "2.A"
  - front: Paine signing the Introduction "the AUTHOR"
    back: |
      The anonymous author describes himself only as one of the class of people with the power of feeling, regardless of party. The ending builds ethos from sympathy and independence, not from name or rank.
    topic_code: "2.A"
  - front: "Paine's \"simple facts, plain arguments, and common sense\""
    back: |
      The opening of the section on the present state of American affairs. Paine sets the terms with his reader: no learned preliminaries, only reason and feeling, if the reader will set aside prejudice. It repeats the pamphlet's title as a promise.
    topic_code: "2.A"
  - front: "Paine's \"the period of debate is closed\""
    back: |
      Paine says many have written on the struggle with England, all ineffectually, and that arms now decide the contest. The opening dismisses the old conversation so that his own argument can begin fresh.
    topic_code: "2.A"
  - front: Paine's milk-and-meat analogy
    back: |
      To answer the claim that America must stay connected because it flourished under Britain, Paine says one might as well argue that a child who thrived on milk must never have meat. The analogy exposes the faulty reasoning.
    topic_code: "3.A"
  - front: "Paine's \"To Conclude\" passage"
    back: |
      The closing passage of the main pamphlet, at the end of its last section, lists four numbered reasons why only an open declaration of independence can settle American affairs, then ends with a simile of a man who keeps putting off unpleasant business.
    topic_code: "2.A"
  - front: Paine's man putting off unpleasant business → the closing simile
    back: |
      Until independence is declared, the continent will feel like a man who knows a task must be done, hates to begin it, wishes it over and is haunted by it. The conclusion makes delay feel worse than the decision.
    topic_code: "2.A"
  - front: The end of Paine's Appendix → "hearty hand of friendship"
    back: |
      The appendix ends by asking each reader to offer his neighbour friendship and to bury the names of Whig and Tory. The conclusion turns from enemies abroad to unity at home, the audience's own next step.
    topic_code: "2.A"
  - front: AP essay Row A (thesis) → where it may appear
    back: |
      The thesis point can be earned anywhere in the essay, but readers look for it in the introduction or conclusion. A clear thesis at the end of the introduction is the safest habit.
    topic_code: "4.B"
  - front: A timed AP introduction → recommended length
    back: |
      Two to four sentences: the context the prompt gives you, made specific, then a thesis. Long openings eat the minutes that commentary needs; the rubric rewards evidence and commentary most.
    topic_code: "2.A"
  - front: A timed AP conclusion → what earns its time
    back: |
      One to three sentences that state the significance of your argument or its complexity. A conclusion can help the sophistication point when it explains a broader implication or tension, never by summary alone.
    topic_code: "2.A"
  - front: Writing the introduction last
    back: |
      Many writers draft the body first, then write an opening that fits the argument they actually made. An introduction written first often promises an essay the writer never delivered.
    topic_code: "2.A"

quiz:
  description: |
    22 questions · about 35 minutes · a seven-question set on the Introduction to Common Sense, questions on
    Paine's section openings and conclusions, a six-question revision set on a student's draft introduction and
    conclusion, and short written work. Multiple choice, select-all and true/false are graded at once; the
    fill-in-the-blank items are matched automatically; the short answers and the introduction paragraph are graded
    by your teacher against the model answer and scoring notes.
  questions:
    # ---- Passage set: the Introduction to Common Sense
    - slug: u04-w12-q01
      type: multiple_choice
      topic_code: "2.A"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 1
      stimulus: &paine_intro |
        *The following passage is the Introduction to Thomas Paine's pamphlet Common Sense (1776), addressed to the inhabitants of America.*

        Perhaps the sentiments contained in the following pages, are not yet sufficiently fashionable to procure them general favor; a long habit of not thinking a thing wrong, gives it a superficial appearance of being right, and raises at first a formidable outcry in defense of custom. But the tumult soon subsides. Time makes more converts than reason.

        As a long and violent abuse of power, is generally the Means of calling the right of it in question (and in Matters too which might never have been thought of, had not the Sufferers been aggravated into the inquiry) and as the King of England hath undertaken in his own Right, to support the Parliament in what he calls Theirs, and as the good people of this country are grievously oppressed by the combination, they have an undoubted privilege to inquire into the pretensions of both, and equally to reject the usurpation of either.

        In the following sheets, the author hath studiously avoided every thing which is personal among ourselves. Compliments as well as censure to individuals make no part thereof. The wise, and the worthy, need not the triumph of a pamphlet; and those whose sentiments are injudicious, or unfriendly, will cease of themselves unless too much pains are bestowed upon their conversion.

        The cause of America is in a great measure the cause of all mankind. Many circumstances hath, and will arise, which are not local, but universal, and through which the principles of all Lovers of Mankind are affected, and in the Event of which, their Affections are interested. The laying a Country desolate with Fire and Sword, declaring War against the natural rights of all Mankind, and extirpating the Defenders thereof from the Face of the Earth, is the Concern of every Man to whom Nature hath given the Power of feeling; of which Class, regardless of Party Censure, is the

        AUTHOR
      prompt: |
        The first paragraph of the Introduction primarily serves to
      options:
        - |
          announce the pamphlet's central proposal so that readers can judge it from the start
        - |
          anticipate readers' resistance and explain it as the force of habit, predicting that it will fade
        - |
          apologise for the pamphlet's plain style and ask readers to forgive its faults
        - |
          summarise the arguments of writers who have defended the king
      option_explanations:
        - |
          The paragraph never names the proposal; it speaks only of “sentiments” in “the following pages.” Paine delays the claim and prepares the reader for it first.
        - |
          Correct. Paine concedes that his views are “not yet sufficiently fashionable,” then explains the coming “outcry” as the result of “a long habit” and predicts that “the tumult soon subsides.” Resistance is recast as custom, not reason.
        - |
          Nothing in the paragraph concerns style. The “outcry” Paine expects is against his sentiments, and he explains it rather than apologising for it.
        - |
          No other writers are summarised here. The “defense of custom” is a general reaction Paine predicts, not a body of arguments he reports.
      answer: 1
      explanation: |
        An introduction that opens with a concession is doing audience work: it names the reader's likely objection before the reader can raise it, and frames it in the writer's terms.

    - slug: u04-w12-q02
      type: multiple_choice
      topic_code: "1.A"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 1
      stimulus: *paine_intro
      prompt: |
        The second paragraph identifies which circumstance as the occasion that gives “the good people of this country” a right to question the king and Parliament?
      options:
        - |
          The publication of earlier pamphlets defending reconciliation
        - |
          A long and violent abuse of power by the king acting together with Parliament
        - |
          A dispute among the colonies about which should lead the others
        - |
          The death of a minister who had been friendly to America
      option_explanations:
        - |
          Earlier pamphlets are not mentioned in the passage. The paragraph traces the right of inquiry to suffering under power, not to other writing.
        - |
          Correct. “A long and violent abuse of power” calls “the right of it in question,” and the king has undertaken “to support the Parliament,” so the people are “grievously oppressed by the combination.” That oppression is the exigence.
        - |
          The paragraph speaks of “the good people of this country” as one group oppressed from outside; quarrels among colonies play no part in it.
        - |
          No minister's death appears in the Introduction. The occasion Paine names is ongoing oppression, which gives the people “an undoubted privilege to inquire.”
      answer: 1
      explanation: |
        Skill 1.A: the exigence is the problem or event that calls the argument into being. Paine places it early, in the second paragraph, so the reader knows why the pamphlet exists before learning what it proposes.

    - slug: u04-w12-q03
      type: multiple_choice
      topic_code: "2.A"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 1
      stimulus: *paine_intro
      prompt: |
        Paine places the sentence “The cause of America is in a great measure the cause of all mankind” at the start of the final paragraph of the Introduction. The placement is effective chiefly because it
      options:
        - |
          ends the opening on the widest possible stakes, so readers carry a sense of universal importance into the arguments that follow
        - |
          signals that the pamphlet will be addressed mainly to European readers rather than to Americans
        - |
          admits that the colonial dispute is local and therefore of limited interest
        - |
          introduces a list of specific laws that Parliament has passed
      option_explanations:
        - |
          Correct. After the concession and the grievance, Paine enlarges the quarrel to concern “every Man to whom Nature hath given the Power of feeling.” The introduction closes by making the reader's cause the world's cause.
        - |
          The pamphlet is “addressed to the inhabitants of America,” and the paragraph claims that their cause matters to all, not that the audience changes.
        - |
          Paine says the reverse: the circumstances “are not local, but universal.” The sentence raises the stakes rather than shrinking them.
        - |
          The paragraph names no laws. It speaks of laying “a Country desolate with Fire and Sword,” a general charge rather than a legal list.
      answer: 0
      explanation: |
        Where a sentence sits matters. The last paragraph of an introduction is the launching point for the body, and Paine uses it to make the reader feel that much more than taxes is at stake.

    - slug: u04-w12-q04
      type: multiple_choice
      topic_code: "1.B"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 1
      stimulus: *paine_intro
      prompt: |
        Paine's statement that he has “studiously avoided every thing which is personal among ourselves” most clearly reflects his awareness that his audience
      options:
        - |
          is already united behind independence and needs no persuading
        - |
          prefers detailed biographies of public men to abstract argument
        - |
          is divided, and that attacks on individual colonists would harden opposition rather than win converts
        - |
          is chiefly made up of members of Parliament who might take offence
      option_explanations:
        - |
          If readers were already united, Paine would not need to expect “a formidable outcry.” The promise to avoid the personal assumes disagreement among “ourselves.”
        - |
          Paine says the reverse: “Compliments as well as censure to individuals make no part thereof.” He chooses principle over personalities.
        - |
          Correct. The phrase “among ourselves” admits that the colonists disagree. By refusing personal attack, and by saying that unfriendly sentiments “will cease of themselves” unless pushed too hard, Paine avoids alienating readers he hopes to convert.
        - |
          “Among ourselves” refers to the inhabitants of America, the pamphlet's addressees. Parliament is the opponent, not the audience.
      answer: 2
      explanation: |
        Skill 1.B: a writer's choices show what the writer believes about the audience's values. Here a promise of restraint is aimed at a divided, wary readership.

    - slug: u04-w12-q05
      type: multi_select
      topic_code: "2.A"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 2
      partial_credit: true
      stimulus: *paine_intro
      prompt: |
        Which TWO moves does Paine's Introduction make to prepare readers for an argument they may at first reject? Select two.
      options:
        - |
          It predicts the initial outcry and attributes it to custom rather than to good reasons.
        - |
          It presents the author as a person of feeling, independent of party, rather than as a partisan.
        - |
          It quotes respected authorities who support the pamphlet's conclusion.
        - |
          It lists in order the four sections that the pamphlet will contain.
      option_explanations:
        - |
          Correct. “A long habit of not thinking a thing wrong, gives it a superficial appearance of being right,” so resistance is explained before it arises.
        - |
          Correct. The Introduction ends by placing the author among those with “the Power of feeling,” “regardless of Party Censure,” an ethos built on sympathy and independence.
        - |
          The Introduction quotes no authorities. Paine relies on general principle and his own stance, not on cited names.
        - |
          The title page lists the subjects, but the Introduction itself does not forecast the sections. Its job is to dispose the reader, not to map the pamphlet.
      answer: [0, 1]
      explanation: |
        An introduction for a resistant audience does two things before it argues: it defuses objections and it earns trust. Paine does both in four paragraphs.

    - slug: u04-w12-q06
      type: true_false
      topic_code: "3.B"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 1
      stimulus: *paine_intro
      prompt: |
        True or false: in this passage Paine states outright that the colonies should declare independence from Britain.
      answer: false
      explanation: |
        False. The passage speaks of “sentiments” that are “not yet sufficiently fashionable,” of a right “to inquire into the pretensions” of king and Parliament, and of the cause of all mankind, but it never names independence. Paine delays the overarching thesis until the reader has been prepared to hear it; the word appears in the postscript and the body.

    - slug: u04-w12-q07
      type: multiple_choice
      topic_code: "2.A"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 1
      stimulus: *paine_intro
      prompt: |
        The Introduction ends with its final sentence running into the signature “AUTHOR.” The effect of this ending is to
      options:
        - |
          reveal the author's name and public offices to establish his authority
        - |
          suggest that the author is unsure whether readers will agree with him
        - |
          shift the subject from America to the author's private life
        - |
          make the author's identity a matter of feeling rather than rank, so that any reader who shares that feeling stands with him
      option_explanations:
        - |
          No name or office is given. The signature is simply “AUTHOR,” and the pamphlet was first published anonymously.
        - |
          The sentence is confident: the author belongs “regardless of Party Censure” to the class of those who feel. Nothing in it expresses doubt.
        - |
          The sentence stays on the public cause; the author is defined only by his response to it. No private life is described.
        - |
          Correct. The author is one of the class “to whom Nature hath given the Power of feeling.” By defining himself this way, Paine invites every feeling reader into the same class, and the opening ends on shared identity.
      answer: 3
      explanation: |
        The last words of an introduction are a hinge. Paine uses them to replace credentials with character: he is anyone who feels, which is exactly whom he hopes his readers will be.

    # ---- Section openings and conclusions in Common Sense
    - slug: u04-w12-q08
      type: multiple_choice
      topic_code: "2.A"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 1
      prompt: |
        The section “Thoughts on the Present State of American Affairs” opens: “In the following pages I offer nothing more than simple facts, plain arguments, and common sense; and have no other preliminaries to settle with the reader, than that he will divest himself of prejudice and prepossession, and suffer his reason and his feelings to determine for themselves.” This opening chiefly works to
      options:
        - |
          set the terms of the exchange, promising plain reasoning and asking only that the reader set aside prejudice
        - |
          warn readers that the following arguments are too technical for most of them
        - |
          admit that the section contains no evidence, only opinion
        - |
          introduce a story from Paine's own life to win sympathy
      option_explanations:
        - |
          Correct. Paine promises “simple facts, plain arguments, and common sense” and names his one condition: that the reader “divest himself of prejudice.” The opening defines a fair contract, and a reader who rejects the argument now seems to be clinging to prejudice.
        - |
          The opening stresses plainness (“nothing more than simple facts”), the opposite of technical difficulty.
        - |
          “Simple facts” are evidence. The modesty of “nothing more than” is a rhetorical understatement, not an admission that the section lacks proof.
        - |
          No personal story appears. The opening addresses “the reader” directly about how to read, not about Paine's life.
      answer: 0
      explanation: |
        A body section can have its own introduction. This one echoes the pamphlet's title and makes open-mindedness the reader's only obligation, which is a quiet way of making disagreement look like prejudice.

    - slug: u04-w12-q09
      type: multiple_choice
      topic_code: "2.A"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 1
      prompt: |
        The main pamphlet ends: “until an independance is declared, the Continent will feel itself like a man who continues putting off some unpleasant business from day to day, yet knows it must be done, hates to set about it, wishes it over, and is continually haunted with the thoughts of its necessity.” The final simile is an effective conclusion chiefly because it
      options:
        - |
          introduces a new reason for independence that the pamphlet has not yet discussed
        - |
          makes delay feel more painful than decision, turning the reader's hesitation into the thing to escape
        - |
          admits that independence is unpleasant and probably unwise
        - |
          returns to the opening concession about fashionable sentiments, word for word
      option_explanations:
        - |
          The simile adds no new reason; it describes how the reader already feels. It gathers the argument into an emotion rather than extending it.
        - |
          Correct. The man in the simile “knows it must be done” and is “continually haunted” by it. The reader is invited to recognise his own procrastination and to see that only the decision will end the discomfort.
        - |
          Calling the business “unpleasant” concedes that it is hard, but the man “knows it must be done.” The simile argues that the task is necessary, not unwise.
        - |
          The words do not repeat the Introduction. The ending is linked to the opening in spirit (habit versus action), but it is a new image.
      answer: 1
      explanation: |
        A conclusion for a persuasive purpose often ends on the audience's own experience. Paine does not restate his four reasons; he names the feeling that should make the reader act on them.

    - slug: u04-w12-q10
      type: multiple_choice
      topic_code: "3.A"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 1
      prompt: |
        Answering those who say America must stay connected to Britain because it flourished under that connection, Paine writes: “We may as well assert that because a child has thrived upon milk, that it is never to have meat.” This sentence works as evidence by
      options:
        - |
          citing statistics on American trade before and after the war
        - |
          appealing to the authority of a famous physician
        - |
          offering an analogy that exposes the flawed reasoning in the opposing claim
        - |
          conceding that the opposing claim is correct but unimportant
      option_explanations:
        - |
          No numbers appear in the sentence. Paine answers the claim with a comparison, not with data.
        - |
          No authority is named. The analogy relies on what every reader knows about raising children.
        - |
          Correct. Past thriving does not prove future need, any more than a child's diet of milk means it must never eat meat. The analogy makes the faulty inference look absurd.
        - |
          Paine rejects the claim: “Nothing can be more fallacious than this kind of argument.” The analogy refutes, it does not concede.
      answer: 2
      explanation: |
        Skill 3.A: evidence is not only facts and figures. An analogy can serve as evidence when it reveals the logic of a claim, here the leap from “it worked before” to “it must continue.”

    # ---- Revision set: a student's draft introduction and conclusion
    - slug: u04-w12-q11
      type: multiple_choice
      topic_code: "2.A"
      source: written for this course
      points: 1
      stimulus: &showcase_draft |
        *The following is a draft of the introduction and conclusion of an argument a student is writing for the school newspaper, proposing that the school replace final exam week with a project showcase. The body paragraphs are omitted. Sentences are numbered.*

        **Introduction**

        (1) Since the beginning of time, people have taken tests. (2) Tests are a part of school, and everyone has an opinion about them. (3) Every June, our school sets aside five full days for final exams, and for most seniors those days come after their college plans are already settled. (4) In this essay I will talk about final exams and projects. (5) Last year, the attendance office reported that exam week had the lowest attendance of any week in the school year.

        [Body paragraphs omitted]

        **Conclusion**

        (6) In conclusion, a showcase would keep seniors working in June instead of sitting through tests that no longer count for them. (7) A showcase would let students present a year's work to families and to the local employers who hire our graduates. (8) As I have shown, there are many reasons. (9) Overall, the school should think about it.
      prompt: |
        The writer wants to replace sentence 1 with an opening that draws readers into the specific situation the argument addresses. Which choice best accomplishes this goal?
      options:
        - |
          Tests have been used in schools all over the world for many centuries.
        - |
          Every June, the week meant to measure a year of learning is the week our hallways are emptiest.
        - |
          Webster's dictionary defines a test as a procedure intended to establish quality or performance.
        - |
          Some people love tests and some people hate them, but we all have to take them.
      option_explanations:
        - |
          This sentence repeats the problem of the original: a broad historical claim with no connection to this school or this June. It delays the issue instead of naming it.
        - |
          Correct. The sentence is concrete and local, and it sets up the paradox the argument depends on: exam week is supposed to matter most yet is the week students skip. It also prepares for the attendance figure.
        - |
          A dictionary definition is a stock opening that tells readers nothing they do not know and has no link to the school's exam week.
        - |
          This is as general as sentence 2 and says nothing specific about the school, the timing or the proposal.
      answer: 1
      explanation: |
        A strong opening is specific to its occasion. Ask whether the sentence could begin any essay on testing; if it could, it does not fit this one.

    - slug: u04-w12-q12
      type: multiple_choice
      topic_code: "2.A"
      source: written for this course
      points: 1
      stimulus: *showcase_draft
      prompt: |
        Where should sentence 5 be placed to make the introduction most effective?
      options:
        - |
          Where it is now, after sentence 4
        - |
          Before sentence 1, as the first sentence of the essay
        - |
          Immediately after sentence 3
        - |
          In the conclusion, after sentence 7
      option_explanations:
        - |
          Left at the end, the attendance figure follows the thesis and makes the introduction end on a stray fact instead of on the writer's position.
        - |
          The figure would be clearer after the reader knows what exam week is and when it falls; first, it has no context.
        - |
          Correct. Sentence 3 describes exam week and its timing; the attendance figure supports it as part of the exigence. The introduction can then end with the thesis, where readers expect the writer's claim.
        - |
          The figure is part of the problem that makes the argument necessary, so it belongs where the problem is introduced. In the conclusion it would arrive too late to frame the argument.
      answer: 2
      explanation: |
        Context first, then the claim. Evidence that establishes the exigence belongs before the thesis, so the thesis lands as the answer to a problem the reader now understands.

    - slug: u04-w12-q13
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: *showcase_draft
      prompt: |
        Which version of sentence 4 most clearly states a defensible thesis and suggests the line of reasoning the essay will follow?
      options:
        - |
          In this essay I will compare final exams and projects to see which one is better.
        - |
          Final exams and projects both have advantages and disadvantages for students.
        - |
          Many students and teachers have strong feelings about final exam week.
        - |
          Replacing exam week with a project showcase would give seniors a reason to stay engaged in June and give families and employers a real look at what students can do.
      option_explanations:
        - |
          This still announces a topic and a comparison without taking a position, so a reader cannot agree or disagree with it.
        - |
          Saying both have advantages is true of almost anything and commits the writer to nothing. It is not defensible because it is not arguable.
        - |
          A statement about feelings is an observation, not a claim about what the school should do.
        - |
          Correct. The sentence takes a position someone could dispute, and its two reasons (engagement in June; a real look for families and employers) preview the body paragraphs.
      answer: 3
      explanation: |
        Skill 4.B, carried into Unit 4: the thesis is the hinge between introduction and body. A thesis that names its reasons lets the conclusion return to them with purpose.

    - slug: u04-w12-q14
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *showcase_draft
      prompt: |
        Some teachers who read the newspaper worry that a showcase would be less rigorous than an exam. The writer wants to add a sentence to the introduction that acknowledges this concern without giving up the argument. Which sentence would best accomplish this goal?
      options:
        - |
          Teachers who like exams are simply afraid of change.
        - |
          Exams are a tradition, and traditions are hard to break.
        - |
          A showcase would be easier for everyone, which is the main reason to adopt it.
        - |
          Teachers are right that any replacement must be at least as demanding as an exam, and a showcase judged by a public audience can be.
      option_explanations:
        - |
          Dismissing the concern as fear insults the readers the writer needs to persuade and gives them a reason to stop reading.
        - |
          This explains resistance as habit but does not address the specific worry about rigor, and it treats teachers' concern as mere custom.
        - |
          Admitting that the showcase is easier confirms the teachers' worry and undermines the proposal.
        - |
          Correct. The sentence grants the teachers' value (rigor), then shows how the proposal meets it. It shows understanding of the audience without abandoning the claim.
      answer: 3
      explanation: |
        Skill 2.B: show that you understand what your audience values. Granting the value and then meeting it is stronger than either ignoring or dismissing it.

    - slug: u04-w12-q15
      type: multi_select
      topic_code: "2.A"
      source: written for this course
      points: 2
      partial_credit: true
      stimulus: *showcase_draft
      prompt: |
        Which TWO sentences in the conclusion add the least to the argument and should be cut or rewritten? Select two.
      options:
        - |
          Sentence 6
        - |
          Sentence 7
        - |
          Sentence 8
        - |
          Sentence 9
      option_explanations:
        - |
          Sentence 6 opens with a stock “In conclusion,” but it restates the thesis's first reason (engagement in June) in specific terms. It needs polish, not deletion; 8 and 9 contribute nothing at all.
        - |
          Sentence 7 is the conclusion's strongest: it names who benefits (families, local employers) and widens the stakes beyond the school.
        - |
          Correct. Saying there are “many reasons” without naming any, and claiming to have shown them, adds nothing a reader can use.
        - |
          Correct. Asking the school to “think about it” is a vague, weak call to action that retreats from the essay's proposal. A conclusion should name the decision it wants.
      answer: [2, 3]
      explanation: |
        Test each sentence of a conclusion: does it tell the reader something new about why the argument matters or what to do? Filler phrases and vague requests fail that test.

    - slug: u04-w12-q16
      type: true_false
      topic_code: "2.A"
      source: written for this course
      points: 1
      stimulus: *showcase_draft
      prompt: |
        True or false: sentence 7 should be deleted because a conclusion must never mention people or ideas that the introduction did not name.
      answer: false
      explanation: |
        False. A conclusion may widen the stakes to new audiences or consequences, as long as they follow from the argument. Sentence 7 names families and local employers as beneficiaries, which shows why the proposal matters beyond the school. What a conclusion should not do is open an unrelated argument it cannot support.

    # ---- Terms, short writing and the paragraph
    - slug: u04-w12-q17
      type: fill_blank
      topic_code: "1.A"
      source: general knowledge
      points: 1
      prompt: |
        The event, problem or need that calls an argument into being, such as the outbreak of fighting in 1775 for Common Sense, is called the argument's ____.
      answer: ["exigence", "the exigence", "exigency", "the exigency"]
      explanation: |
        The exigence is the “why now” of an argument. A strong introduction usually names it early, as Paine does when he points to the abuse of power and, in the body, to the start of hostilities.

    - slug: u04-w12-q18
      type: fill_blank
      topic_code: "2.A"
      source: general knowledge
      points: 1
      prompt: |
        A conclusion that tells the audience what to do next, such as Paine's request that each reader hold out the hand of friendship to his neighbour, ends with a call to ____.
      answer: ["action", "act"]
      explanation: |
        A call to action suits a persuasive purpose aimed at changing behaviour, as in a pamphlet, speech or editorial. It works best when the action is concrete.

    - slug: u04-w12-q19
      type: short_answer
      topic_code: "2.A"
      source: written for this course
      points: 2
      prompt: |
        Rewrite sentence 9 of the student draft on exam week (“Overall, the school should think about it.”) as a final sentence that fits the newspaper audience and names a specific next step. Then, in one sentence, explain why your version is a better ending.
      answer: |
        Revised: *Before the faculty votes on next year's calendar in March, students, parents and teachers should ask the principal to pilot a showcase for one grade this June.* Explanation: the new ending names a real decision point and a concrete, modest action, so readers know what to do and the proposal sounds practical rather than vague.
      explanation: |
        1 point: a revised sentence that names a specific action, decision or audience (a pilot, a vote, a request to a named group) and fits the proposal. 1 point: an explanation that says how the revision improves the ending (concreteness, fit to audience, a clear next step). A revision that only restates the thesis earns at most 1.

    - slug: u04-w12-q20
      type: short_answer
      topic_code: "2.A"
      source: 'Thomas Paine, Common Sense (1776)'
      points: 2
      prompt: |
        The last paragraph of Paine's Appendix asks each reader to “hold out to his neighbour the hearty hand of friendship” and to let “the names of Whig and Tory be extinct.” In two or three sentences, explain why this conclusion fits Paine's audience and purpose.
      answer: |
        Paine's readers were divided between those who wanted independence and those who still hoped to reconcile, and a war needed them united. By ending with friendship between neighbours rather than with another attack on Britain, Paine turns his argument into a shared next step and invites former opponents to join the cause without being humiliated.
      explanation: |
        1 point: an accurate account of the audience or situation (colonists divided between Whig and Tory, or between independence and reconciliation). 1 point: an explanation of how the ending serves the purpose (uniting readers, making the argument a shared action, avoiding alienation). A response that only paraphrases the quotation earns at most 1.

    - slug: u04-w12-q21
      type: multiple_choice
      topic_code: "2.A"
      source: general knowledge
      points: 1
      prompt: |
        A student writing a timed AP argument essay has about 40 minutes. Which plan for the introduction makes the best use of that time?
      options:
        - |
          A full paragraph of background on the history of the issue before any claim is made
        - |
          Two to four sentences that make the prompt's issue specific and end with a defensible thesis
        - |
          A single sentence restating the prompt word for word
        - |
          No introduction at all, so that every minute goes to the body paragraphs
      option_explanations:
        - |
          A long history spends minutes on material the rubric does not reward and delays the thesis, which readers look for early.
        - |
          Correct. A brief, specific opening and a clear thesis give the reader the context and the claim. The rest of the time goes to evidence and commentary, which carry four of the six points.
        - |
          Restating the prompt does not earn the thesis point; the rubric asks for a claim that responds to it.
        - |
          Without an introduction the reader may not find a thesis, and the essay loses its frame. A short opening costs little and secures the thesis point.
      answer: 1
      explanation: |
        On the exam an introduction has one essential job: deliver a defensible thesis in context. Brevity protects time for commentary.

    - slug: u04-w12-q22
      type: long_answer
      topic_code: "2.A"
      source: written for this course
      points: 5
      prompt: |
        Write an introduction (four to six sentences) for an argument essay responding to this prompt: *Many towns are considering whether to keep public libraries open later in the evening, at extra cost. Write an argument for your town council taking a position on the proposal.* Your introduction should name the exigence, show awareness of the council as audience, and end with a defensible thesis that suggests your line of reasoning. Do not write the body.
      answer: |
        Model: *Next month the council will decide whether to fund evening hours at the Main Street library, a change that would cost about as much as resurfacing two blocks of road. The question can sound like a luxury in a tight budget year. But for the students who have no quiet place to work at home and the adults who finish their shifts after six, the library's closing time decides whether it is open to them at all. The council should fund evening hours, because they reach the residents the library now misses and cost less than the programs those residents would otherwise need.* The model names the decision and its cost (exigence), anticipates the council's budget worry (audience), and ends with a claim plus two reasons (thesis and line of reasoning).
      explanation: |
        5 points. Claim (2): 1 point for a defensible thesis that takes a position on the proposal; 1 more if it suggests a line of reasoning (two or more reasons or a clear path). Evidence (1): concrete context that establishes the exigence (the decision, its timing, its cost or the people affected), not a sweeping opener. Commentary (2): 1 point for showing awareness of the council's values or concerns (budget, fairness, use); 1 point for coherence, with each sentence leading to the thesis and no filler such as an “in this essay I will” announcement. An introduction with no arguable thesis earns at most 2.
