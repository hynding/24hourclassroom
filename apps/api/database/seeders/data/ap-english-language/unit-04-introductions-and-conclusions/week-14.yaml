week: 14
unit: 4
title: Definition and Comparison in Woolf's The Common Reader
topics: ["5.C", "6.C"]
texts:
  - author: Virginia Woolf
    title: The Common Reader
    year: 1925
    url: https://www.gutenberg.org/ebooks/64457
guide: guides/week-14.md
guide_description: |
  Methods of development at work in criticism. Virginia Woolf's The Common Reader (1925) defines its own reader by
  contrast with the critic and the scholar, defines the essay by the single principle of pleasure, and builds a
  verdict on three novelists around one stipulated word, “materialists.” Close readings of all three essays, how
  definition and comparison can open an argument as well as develop it, a student paragraph revised, common
  mistakes and a self-check.
flashcards_description: |
  30 cards on definition and comparison as methods of development, the kinds of definition, Woolf's three essays
  and their key passages, and how to use these methods in an argument's opening and body.

flashcards:
  - front: Methods of development → the six this course uses
    back: |
      Narration, description, comparison, definition, cause and effect, and classification. Skill 5.C asks you to recognise and explain them in a text; skill 6.C asks you to use them to advance your own argument.
    topic_code: "5.C"
  - front: Definition as a method of development
    back: |
      Explaining what a term means, and arguing for that meaning, so that the rest of the argument depends on it. In argument, a definition is often a claim in disguise.
    topic_code: "5.C"
  - front: Comparison as a method of development
    back: |
      Setting two or more things side by side to show likeness or difference. In argument, a comparison usually makes the less familiar thing clear, or shows that two things deserve the same treatment.
    topic_code: "5.C"
  - front: Stipulative definition
    back: |
      A definition in which the writer declares how a term will be used in this argument. Woolf stipulates what she means by “materialists” before she applies it to three novelists.
    topic_code: "5.C"
  - front: Definition by negation
    back: |
      Defining a term by what it is not, clearing away wrong meanings before giving the right one. Woolf's common reader is first defined against the critic and the scholar.
    topic_code: "5.C"
  - front: Definition by function
    back: |
      Defining a thing by what it does or what it is for. Woolf defines the essay by its controlling principle, that it should give pleasure.
    topic_code: "5.C"
  - front: Extended definition
    back: |
      A definition developed over a paragraph or a whole essay, with examples, contrasts and qualifications. Most arguable definitions need to be extended, because a one-line definition hides the claim.
    topic_code: "6.C"
  - front: The dictionary-definition opening → why it fails
    back: |
      Quoting a dictionary tells readers what they already know and makes no claim. Open instead with the definition that is in dispute, or with the case that tests it.
    topic_code: "6.C"
  - front: Woolf's house analogy → how analogy differs from comparison
    back: |
      A comparison sets two things of the same kind side by side (two novelists, two policies). An analogy compares things of different kinds (a novel and a house) to clarify one through the other.
    topic_code: "5.C"
  - front: Point-by-point vs block comparison
    back: |
      Point-by-point moves between the two subjects on each feature; block treats one subject fully, then the other. Point-by-point keeps the comparison sharp; block suits short subjects.
    topic_code: "6.C"
  - front: Using a definition in an introduction
    back: |
      Define the term the argument turns on, especially when the reader's definition differs from yours. The definition then works as the thesis's foundation, not as a filler opening.
    topic_code: "2.A"
  - front: Using a comparison in an introduction
    back: |
      Open with two cases side by side that the reader expects to be treated differently, then show they deserve the same treatment (or the reverse). The contrast states the problem.
    topic_code: "2.A"
  - front: The Common Reader → publication
    back: |
      A collection of essays by Virginia Woolf, published in 1925 in London and New York, many first written as reviews. It is dedicated to Lytton Strachey and takes its title from a sentence in Samuel Johnson's life of the poet Gray.
    topic_code: "1.A"
  - front: Woolf's "The Common Reader" → its purpose
    back: |
      The short opening essay of the collection defines the kind of reader the book is written by and for, then justifies writing down the ideas and opinions of such a reader.
    topic_code: "1.A"
  - front: Woolf's common reader vs the critic and the scholar
    back: |
      The common reader is worse educated and less gifted than the critic and the scholar, and reads for pleasure rather than to impart knowledge or correct others. The contrast defines him before praising him.
    topic_code: "5.C"
  - front: Woolf's common reader building a "rickety and ramshackle fabric"
    back: |
      The common reader assembles a whole (a portrait, a sketch of an age, a theory of writing) out of odds and ends. The building metaphor admits his faults while describing his creative instinct.
    topic_code: "5.C"
  - front: "Woolf's \"Hasty, inaccurate, and superficial\""
    back: |
      Woolf lists the common reader's deficiencies as a critic openly, then argues that if he has some say in the final distribution of poetical honours, his ideas are worth writing down. A concession inside a definition.
    topic_code: "3.B"
  - front: Woolf's "The Modern Essay" → the occasion
    back: |
      Written as a review of a five-volume anthology of English essays from 1870 to 1920. Woolf uses the anthology to define the essay and judge its modern practitioners.
    topic_code: "1.A"
  - front: Woolf refusing to trace the essay's history
    back: |
      “The Modern Essay” opens by agreeing that it is unnecessary to go deeply into the history and origin of the essay, since its present is more important than its past. The introduction rejects the history opening.
    topic_code: "2.A"
  - front: Woolf's family of essays → the metaphor
    back: |
      The essay's family is widely spread: some members wear coronets, others pick up a precarious living in the gutter near Fleet Street. The comparison classifies essays by social rank to show the form's range.
    topic_code: "5.C"
  - front: "Woolf's \"The principle which controls it\""
    back: |
      The essay's controlling principle is simply that it should give pleasure. Woolf defines the form by its function, and every later judgment in the review applies that one standard.
    topic_code: "5.C"
  - front: Woolf's novel, poem and essay compared
    back: |
      A novel has a story, a poem rhyme; the essayist has neither. The comparison defines the essay by what it lacks and makes the essayist's art of writing all the more necessary.
    topic_code: "5.C"
  - front: Woolf's "we must never be roused"
    back: |
      We may soar with Lamb or plunge with Bacon, but we must never be roused. The paradox sets the limit of the definition: the essay may move us anywhere except out of its spell.
    topic_code: "5.C"
  - front: Woolf's "Modern Fiction" → its subject
    back: |
      An essay arguing that three popular novelists, Wells, Bennett and Galsworthy, have disappointed readers because they attend to the body rather than the spirit, and that fiction must find a way to catch life itself.
    topic_code: "1.A"
  - front: Woolf's "materialists" → the stipulated meaning
    back: |
      By the label Woolf means that the three novelists write of unimportant things and spend immense skill making the trivial and the transitory appear the true and the enduring. The definition is her thesis.
    topic_code: "5.C"
  - front: Woolf's Bennett and the well-built house
    back: |
      Bennett's novels are so well constructed that there is not a draught between the window frames or a crack in the boards. And yet, Woolf asks, what if life should refuse to live there? An analogy that praises in order to criticise.
    topic_code: "3.A"
  - front: Woolf's "Modern Fiction" → the modest opening
    back: |
      Woolf denies standing on any vantage ground: the critic is on the flat, in the crowd, half blind with dust. The introduction places her among the writers she judges, which makes the judgment sound fair.
    topic_code: "2.A"
  - front: Woolf's tyrant who demands a plot
    back: |
      The novelist seems constrained by a powerful and unscrupulous tyrant to provide plot, comedy, tragedy, love, interest and an air of probability. The personification turns literary convention into a master to resist.
    topic_code: "5.C"
  - front: Testing a definition with a borderline case
    back: |
      A strong extended definition faces the case that seems not to fit, then shows why it does or does not. Woolf grants that her one word falls wide of the mark with Wells, then explains how it still applies.
    topic_code: "6.C"
  - front: Comparison that argues "treat these alike"
    back: |
      Show two cases equal in every relevant way except one, then argue that the one difference should not matter. Fairness arguments in policy, school and law often take this shape.
    topic_code: "6.C"

quiz:
  description: |
    23 questions · about 35 minutes · an eight-question set on the opening of Woolf's “The Modern Essay,” questions
    on “The Common Reader” and “Modern Fiction,” a six-question revision set on a student's argument built on a
    definition and a comparison, and short written work. Multiple choice, select-all and true/false are graded at
    once; the fill-in-the-blank items are matched automatically; the short answers and the paragraph are graded by
    your teacher.
  questions:
    # ---- Passage set: the opening of "The Modern Essay"
    - slug: u04-w14-q01
      type: multiple_choice
      topic_code: "2.A"
      source: 'Virginia Woolf, "The Modern Essay," The Common Reader (1925)'
      points: 1
      stimulus: &modern_essay |
        *The following passage is the opening of Virginia Woolf's "The Modern Essay," from The Common Reader (1925). Woolf wrote it as a review of a five-volume anthology of English essays edited by Ernest Rhys.*

        As Mr. Rhys truly says, it is unnecessary to go profoundly into the history and origin of the essay--whether it derives from Socrates or Siranney the Persian--since, like all living things, its present is more important than its past. Moreover, the family is widely spread; and while some of its representatives have risen in the world and wear their coronets with the best, others pick up a precarious living in the gutter near Fleet Street. The form, too, admits variety. The essay can be short or long, serious or trifling, about God and Spinoza, or about turtles and Cheapside.

        [...]

        Of all forms of literature, however, the essay is the one which least calls for the use of long words. The principle which controls it is simply that it should give pleasure; the desire which impels us when we take it from the shelf is simply to receive pleasure. Everything in an essay must be subdued to that end. It should lay us under a spell with its first word, and we should only wake, refreshed, with its last. In the interval we may pass through the most various experiences of amusement, surprise, interest, indignation; we may soar to the heights of fantasy with Lamb or plunge to the depths of wisdom with Bacon, but we must never be roused. The essay must lap us about and draw its curtain across the world.

        So great a feat is seldom accomplished, though the fault may well be as much on the reader's side as on the writer's. Habit and lethargy have dulled his palate. A novel has a story, a poem rhyme; but what art can the essayist use in these short lengths of prose to sting us wide awake and fix us in a trance which is not sleep but rather an intensification of life--a basking, with every faculty alert, in the sun of pleasure? He must know--that is the first essential--how to write.
      prompt: |
        The first sentence of the passage contributes to the opening chiefly by
      options:
        - |
          setting aside the history of the essay so that the review can concentrate on the essay as it is practised now
        - |
          tracing the essay's origins to Socrates in order to establish its dignity
        - |
          disagreeing with the anthology's editor about the importance of history
        - |
          apologising for the reviewer's ignorance of the essay's history
      option_explanations:
        - |
          Correct. Woolf agrees that “it is unnecessary to go profoundly into the history and origin of the essay” because “its present is more important than its past.” The introduction declines the usual historical opening and points the review at the present.
        - |
          Socrates is mentioned only as one possible origin in a dash-enclosed aside, and the sentence says the question does not need to be settled.
        - |
          Woolf says “Mr. Rhys truly says,” so she agrees with the editor rather than disputing him.
        - |
          Nothing in the sentence admits ignorance. Woolf dismisses the history as unnecessary, not as beyond her.
      answer: 0
      explanation: |
        Skill 2.A in a published essay: an opening can define its scope by saying what it will not do. Woolf clears away the history opening that a reader of an anthology might expect.

    - slug: u04-w14-q02
      type: multiple_choice
      topic_code: "5.C"
      source: 'Virginia Woolf, "The Modern Essay," The Common Reader (1925)'
      points: 1
      stimulus: *modern_essay
      prompt: |
        In the second sentence, Woolf compares the essay to a family in which some members “wear their coronets with the best” while others “pick up a precarious living in the gutter near Fleet Street.” The comparison primarily serves to
      options:
        - |
          argue that only aristocratic writers should be allowed to write essays
        - |
          criticise the anthology for leaving out journalism
        - |
          convey the wide range of the essay, from distinguished work to hasty newspaper writing, through a vivid social image
        - |
          explain the history of the essay from its noble origins to its decline
      option_explanations:
        - |
          The image is about essays, not essayists' social rank, and Woolf welcomes the form's variety rather than restricting it.
        - |
          The anthology's contents are not discussed in this sentence. The family image describes the form as a whole.
        - |
          Correct. The family stretches from coronets to the gutter near Fleet Street, the centre of London journalism. The comparison classifies essays by a kind of social rank to show the form's range, which the next sentences confirm: “The form, too, admits variety.”
        - |
          Woolf has just set the history aside. The family is a picture of the present, with high and low members alive at the same time.
      answer: 2
      explanation: |
        Skill 5.C: a comparison can do the work of classification, sorting a large subject into kinds. Ask what the image sorts and why.

    - slug: u04-w14-q03
      type: multiple_choice
      topic_code: "5.C"
      source: 'Virginia Woolf, "The Modern Essay," The Common Reader (1925)'
      points: 1
      stimulus: *modern_essay
      prompt: |
        The sentence “The principle which controls it is simply that it should give pleasure” develops Woolf's argument primarily through
      options:
        - |
          narration of an experience Woolf had while reading
        - |
          cause and effect, explaining why essays became popular
        - |
          classification of essays into those that please and those that instruct
        - |
          definition of the essay by its function, a standard that the rest of the review can apply
      option_explanations:
        - |
          No experience is narrated. The sentence states a general principle about the form.
        - |
          The sentence explains what controls an essay, not why essays became popular. No historical cause is offered.
        - |
          The sentence does not divide essays into kinds; it names one principle for all of them.
        - |
          Correct. Woolf defines the essay by what it is for, and makes the definition a rule: “Everything in an essay must be subdued to that end.” Each later judgment of a particular essayist can be measured against it.
      answer: 3
      explanation: |
        Definition by function is powerful in argument because it creates a standard. Once the reader accepts the definition, the evaluations follow.

    - slug: u04-w14-q04
      type: multiple_choice
      topic_code: "5.C"
      source: 'Virginia Woolf, "The Modern Essay," The Common Reader (1925)'
      points: 1
      stimulus: *modern_essay
      prompt: |
        In the last paragraph, the clause “A novel has a story, a poem rhyme” functions as a comparison that
      options:
        - |
          shows that the essayist, lacking the devices other forms rely on, must depend entirely on the art of writing
        - |
          argues that novels and poems are superior to essays
        - |
          suggests that essayists should add stories and rhymes to their work
        - |
          introduces a new subject, the history of the novel
      option_explanations:
        - |
          Correct. Novels and poems have built-in means of holding a reader; the essay has neither. The comparison sets up the question of “what art can the essayist use,” which Woolf answers: “He must know ... how to write.”
        - |
          Woolf ranks no form above another here. The comparison concerns the resources each form has, not their worth.
        - |
          The point is that the essayist must succeed without those devices, not that he should borrow them.
        - |
          The clause is part of a question about the essay; the passage does not turn to the history of the novel.
      answer: 0
      explanation: |
        A comparison to neighbouring categories often sharpens a definition. Here it shows what the essay lacks, which defines what it requires.

    - slug: u04-w14-q05
      type: multi_select
      topic_code: "5.C"
      source: 'Virginia Woolf, "The Modern Essay," The Common Reader (1925)'
      points: 2
      partial_credit: true
      stimulus: *modern_essay
      prompt: |
        Which TWO methods of development does Woolf rely on most in this passage? Select two.
      options:
        - |
          Definition, stating what controls the essay and what it must achieve
        - |
          Comparison, setting the essay beside a family, a novel and a poem
        - |
          Narration, telling the story of Woolf's own career as an essayist
        - |
          Cause and effect, supported by figures on how many essays were sold
      option_explanations:
        - |
          Correct. “The principle which controls it is simply that it should give pleasure” and “The essay must lap us about” define the form by its purpose and effect.
        - |
          Correct. The family image, and the contrast with a novel's story and a poem's rhyme, place the essay among other things to clarify it.
        - |
          Woolf tells no story of her career; the passage speaks of “us” as readers and of the essayist in general.
        - |
          No figures appear, and the passage does not explain sales or popularity.
      answer: [0, 1]
      explanation: |
        Definition and comparison often work together: a writer defines by comparing, and compares in order to define.

    - slug: u04-w14-q06
      type: true_false
      topic_code: "3.B"
      source: 'Virginia Woolf, "The Modern Essay," The Common Reader (1925)'
      points: 1
      stimulus: *modern_essay
      prompt: |
        True or false: the claim that governs Woolf's review, that an essay exists to give pleasure, is stated in the passage's second paragraph rather than in its first sentence.
      answer: true
      explanation: |
        True. The first paragraph sets the scope (the present, not the past) and the range of the form; the second states the controlling principle. Woolf's overarching claim arrives after a short introduction, a placement you will meet often in published essays (skill 3.B).

    - slug: u04-w14-q07
      type: multiple_choice
      topic_code: "1.A"
      source: 'Virginia Woolf, "The Modern Essay," The Common Reader (1925)'
      points: 1
      stimulus: *modern_essay
      prompt: |
        Given the italicised note and the opening reference to “Mr. Rhys,” Woolf's purpose in this essay is best described as
      options:
        - |
          to write a history of English literature from Socrates to the present
        - |
          to persuade readers to buy the anthology she is reviewing
        - |
          to use a review of an anthology as an occasion to define the essay and judge modern essayists by that definition
        - |
          to defend Ernest Rhys against critics of his editing
      option_explanations:
        - |
          Woolf explicitly sets aside the essay's history and origins; a full literary history is the opposite of her purpose.
        - |
          The passage recommends nothing for purchase. It discusses the form the anthology contains, not its value as a product.
        - |
          Correct. The anthology is the occasion, but Woolf's purpose is larger: she defines the essay by pleasure and prepares to measure its practitioners against that standard.
        - |
          Woolf agrees with Rhys in passing; no critics of his editing are mentioned or answered.
      answer: 2
      explanation: |
        Skill 1.A: distinguish the occasion (a book to review) from the purpose (a claim about what essays should be). Reviews often use a book as the starting point for an argument of their own.

    - slug: u04-w14-q08
      type: multiple_choice
      topic_code: "5.C"
      source: 'Virginia Woolf, "The Modern Essay," The Common Reader (1925)'
      points: 1
      stimulus: *modern_essay
      prompt: |
        The sentence that ends with “but we must never be roused” contributes to Woolf's definition by
      options:
        - |
          listing the essayists Woolf dislikes most
        - |
          showing that essays should avoid every strong feeling
        - |
          contradicting the earlier claim that essays give pleasure
        - |
          setting a limit within a wide range: the essay may carry readers through many experiences but must never break its spell
      option_explanations:
        - |
          Lamb and Bacon are named as examples of range (“the heights of fantasy,” “the depths of wisdom”), not as writers Woolf dislikes.
        - |
          The sentence allows “amusement, surprise, interest, indignation,” which are strong feelings. What it forbids is being roused out of the essay's spell.
        - |
          The sentence develops the pleasure principle; to be “roused” would end the pleasure, so the limit follows from the definition.
        - |
          Correct. The “but” sets the boundary of the definition: anything is allowed in the interval except waking the reader. The paradox clarifies what pleasure means here.
      answer: 3
      explanation: |
        A good extended definition includes limits as well as range. Look for the “but” that tells you where the definition stops.

    # ---- "The Common Reader" and "Modern Fiction"
    - slug: u04-w14-q09
      type: multiple_choice
      topic_code: "5.C"
      source: 'Virginia Woolf, "The Common Reader," The Common Reader (1925)'
      points: 1
      prompt: |
        In the collection's opening essay, Woolf writes: “The common reader, as Dr. Johnson implies, differs from the critic and the scholar. He is worse educated, and nature has not gifted him so generously. He reads for his own pleasure rather than to impart knowledge or correct the opinions of others.” The passage develops its definition chiefly by
      options:
        - |
          contrasting the common reader with the critic and the scholar, so that he is defined first by what he lacks and then by what he seeks
        - |
          narrating a day in the life of a typical reader
        - |
          listing the books that a common reader ought to read
        - |
          explaining how the common reader came to exist historically
      option_explanations:
        - |
          Correct. The common reader “differs from the critic and the scholar”: he is “worse educated” and less gifted, yet he reads “for his own pleasure.” Contrast defines him by deficiency and by motive.
        - |
          No day or sequence of events is narrated. The passage describes a type of reader in general terms.
        - |
          The passage names no books. It defines a reader, not a reading list.
        - |
          There is no historical account of the common reader's origin, only a comparison with other kinds of readers.
      answer: 0
      explanation: |
        Definition by contrast places a term among its neighbours. Woolf's common reader is clearest when set beside the critic and the scholar he is not.

    - slug: u04-w14-q10
      type: multiple_choice
      topic_code: "5.C"
      source: 'Virginia Woolf, "Modern Fiction," The Common Reader (1925)'
      points: 1
      prompt: |
        In “Modern Fiction,” Woolf calls three popular novelists “materialists,” then explains: “If we fasten, then, one label on all these books, on which is one word materialists, we mean by it that they write of unimportant things; that they spend immense skill and immense industry making the trivial and the transitory appear the true and the enduring.” What is the chief function of this explanation?
      options:
        - |
          It withdraws the charge against the novelists because the word is too vague.
        - |
          It shows that the novelists are interested in money and possessions.
        - |
          It stipulates exactly what the label means in this argument, turning a single word into the essay's central claim.
        - |
          It classifies the novelists into three groups by their subject matter.
      option_explanations:
        - |
          Woolf does not withdraw the charge; she sharpens it. The explanation tells readers precisely what they are being asked to accept.
        - |
          The ordinary sense of “materialist” (one who loves possessions) is not Woolf's meaning. She defines it as writing of unimportant things, which is why she must stipulate.
        - |
          Correct. “We mean by it” signals a stipulative definition. Once the reader understands “materialists” as making “the trivial and the transitory appear the true and the enduring,” the label becomes the essay's thesis about these novelists.
        - |
          The definition applies one label to all three writers rather than dividing them. Classification is not the method here.
      answer: 2
      explanation: |
        A stipulative definition is a claim: it tells the reader how a word will be used and, often, what the writer thinks. Watch for “by this I mean” and “we mean by it.”

    - slug: u04-w14-q11
      type: multiple_choice
      topic_code: "3.A"
      source: 'Virginia Woolf, "Modern Fiction," The Common Reader (1925)'
      points: 1
      prompt: |
        Of Arnold Bennett, Woolf writes: “He can make a book so well constructed and solid in its craftsmanship that it is difficult for the most exacting of critics to see through what chink or crevice decay can creep in. There is not so much as a draught between the frames of the windows, or a crack in the boards. And yet--if life should refuse to live there?” How does this analogy support Woolf's claim about Bennett?
      options:
        - |
          It proves that Bennett's novels contain many technical errors.
        - |
          It suggests that Bennett should have become an architect instead of a novelist.
        - |
          It shows that Woolf admires Bennett more than any other living novelist.
        - |
          It grants his craftsmanship in full, then asks whether a perfectly built house matters if life will not live in it, which makes the criticism hard to dismiss as envy.
      option_explanations:
        - |
          The analogy says the reverse: there is no “chink or crevice” in the construction. The flaw Woolf finds is not technical.
        - |
          The house is a comparison for his novels, not career advice. Taking the analogy literally misses its point.
        - |
          Woolf calls Bennett “perhaps the worst culprit of the three,” precisely because he is the best workman; admiration of craft is part of a criticism.
        - |
          Correct. By praising the construction without reservation, Woolf earns credibility for the question that follows. The analogy separates craft from life, which is her whole charge against the materialists.
      answer: 3
      explanation: |
        Skill 3.A: evidence can be figurative. An analogy that concedes a strength and then exposes a weakness is often more persuasive than direct attack.

    - slug: u04-w14-q12
      type: multiple_choice
      topic_code: "2.A"
      source: 'Virginia Woolf, "Modern Fiction," The Common Reader (1925)'
      points: 1
      prompt: |
        Early in “Modern Fiction” Woolf writes: “It need scarcely be said that we make no claim to stand, even momentarily, upon that vantage ground. On the flat, in the crowd, half blind with dust, we look back with envy to those happier warriors, whose battle is won.” How does this moment in the introduction prepare readers for the argument that follows?
      options:
        - |
          It places the critic among the struggling writers rather than above them, so that her later verdicts sound like a fellow worker's judgment, not a distant authority's.
        - |
          It announces that Woolf will refuse to judge any modern novelist.
        - |
          It praises the novelists of the past and claims that modern writers can never equal them.
        - |
          It explains the history of the great period of prose fiction in detail.
      option_explanations:
        - |
          Correct. Denying any “vantage ground,” Woolf stands “on the flat, in the crowd, half blind with dust.” The modest position builds ethos for the hard judgments of Wells, Bennett and Galsworthy that follow.
        - |
          Woolf goes on to judge three novelists sharply; the modesty frames the judgment, it does not cancel it.
        - |
          The “happier warriors” are envied because their battle is won, not because moderns can never equal them. Woolf earlier says we do not “come to write better,” only to keep moving.
        - |
          Woolf says that deciding the history is “for the historian of literature”; she declines to give it.
      answer: 0
      explanation: |
        An introduction can build the writer's position as well as the reader's context. A critic who admits limited sight makes her verdicts sound earned rather than imposed.

    # ---- Revision set: an argument built on a definition and a comparison
    - slug: u04-w14-q13
      type: multiple_choice
      topic_code: "6.C"
      source: written for this course
      points: 1
      stimulus: &jobs_draft |
        *The following is a body paragraph from a student's argument that the school's annual leadership awards should recognise students who hold part-time jobs. Sentences are numbered.*

        (1) The dictionary says an extracurricular activity is anything outside the regular course of study. (2) Our school's leadership awards count clubs, sports, and volunteer work, but not paid jobs. (3) A student who spends ten hours a week coaching the robotics team can win an award; a student who spends ten hours a week supervising children at the town pool cannot. (4) Both students show up on time, solve problems, and answer to adults who depend on them. (5) The only difference is a paycheck. (6) Jobs are also good because they teach students how to manage money. (7) Leadership, in other words, should be defined by what a student does and whom the student serves, not by whether the student is paid. (8) For many students, a job is not a choice but a necessity for their families.
      prompt: |
        The writer wants to replace sentence 1 with a definition that advances the paragraph's argument instead of stating the obvious. Which choice best accomplishes this goal?
      options:
        - |
          An extracurricular activity is something students do after school.
        - |
          Many people have different ideas about what counts as an extracurricular activity.
        - |
          The awards handbook describes eligible activities as “commitments that build responsibility and leadership outside the classroom,” a description that fits a lifeguard's shift as well as a club meeting.
        - |
          Extracurricular activities have been part of American schools for more than a century.
      option_explanations:
        - |
          This restates the dictionary definition in plainer words. It is no more arguable than the original and does not connect to the awards policy.
        - |
          Saying that people disagree names a debate without entering it. The sentence takes no position on what should count.
        - |
          Correct. The revision quotes the school's own standard and shows at once that a job meets it. The definition becomes the first step in the argument rather than a formality.
        - |
          A historical fact about schools is a filler opening; it does not define the term in a way that helps the argument.
      answer: 2
      explanation: |
        Skill 6.C: a definition advances an argument when it is the definition in dispute, or when applying it proves the point. A dictionary definition rarely does either.

