    - slug: u04-w14-q21
      type: short_answer
      topic_code: "5.C"
      source: 'Virginia Woolf, "Modern Fiction," The Common Reader (1925)'
      points: 2
      prompt: |
        In two or three sentences, explain why Woolf needs to define “materialists” in “Modern Fiction” rather than simply using the word, and what the definition does for her argument.
      answer: |
        The ordinary meaning of “materialist,” someone devoted to money and possessions, would make Woolf's charge sound like an insult about the novelists' characters. By saying that she means writers who “write of unimportant things” and make “the trivial and the transitory appear the true and the enduring,” she turns the word into a precise, arguable claim about their fiction, which the rest of the essay can test.
      explanation: |
        1 point: recognises that the word's ordinary meaning differs from Woolf's or is too vague to carry the argument. 1 point: explains what the definition does (makes the charge precise, becomes the thesis, sets a standard for judging the novelists). Restating the definition without explaining its function earns at most 1.

    - slug: u04-w14-q22
      type: short_answer
      topic_code: "2.A"
      source: written for this course
      points: 2
      prompt: |
        Write two opening sentences for the student's argument about leadership awards that use a comparison or a definition to establish the exigence and lead toward a thesis.
      answer: |
        Example: *This spring, a student who coached the robotics team ten hours a week won a leadership award, and a student who supervised forty children at the town pool for the same hours did not qualify. The awards committee meets next month to revise its rules, and it should start by asking what it means by leadership.*
      explanation: |
        1 point: the opening uses a comparison or definition that is specific to the issue (matched students, the policy's own wording), not a dictionary or a sweeping generalisation. 1 point: the sentences establish why the issue matters now or lead clearly toward a position on the awards. Two sentences that only define “leadership” in general terms earn at most 1.

    - slug: u04-w14-q23
      type: long_answer
      topic_code: "6.C"
      source: written for this course
      points: 5
      prompt: |
        Write one body paragraph (about 150-200 words) for an argument on this question: *Should a school count a student's work caring for younger siblings after school as community service?* Use definition, comparison or both to advance your position, and explain how your method supports your claim.
      answer: |
        Model: *The school defines community service as unpaid work that meets a need beyond the student's own interests, and caring for a younger brother after school meets that definition as surely as tutoring at the library. Compare two students: one reads with second graders at the library for an hour each afternoon; the other walks a second-grade brother home, makes him a snack and checks his reading log. Both give up the same hour, serve a child who needs them and free an adult to keep working. If the first counts and the second does not, the school is not rewarding service; it is rewarding service that happens to be visible. A definition that excludes care at home also falls hardest on students whose families depend on them most. Service should be measured by the need met, not by the address where it is met.* The model applies the school's own definition, builds a matched comparison and ends on a sharpened definition.
      explanation: |
        5 points. Claim (1): a clear, arguable position on whether sibling care should count. Evidence (2): 1 point for a specific definition (the school's, a stipulated one) or a matched comparison; 1 point for concrete details that make the method persuasive (equal time, equal need, the effect on particular students). Commentary (2): 1 point for explaining how the definition or comparison supports the claim (why the difference does or does not matter); 1 point for a line of reasoning that ends on the paragraph's strongest point, with no unrelated sentences. A paragraph that only asserts a position without a definition or comparison earns at most 2.
