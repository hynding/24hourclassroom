week: 18
unit: 5
title: Choosing a Voice with Franklin's Autobiography
topics: ["8.A"]
texts:
  - author: Benjamin Franklin
    title: The Autobiography of Benjamin Franklin
    year: 1791
    url: https://www.gutenberg.org/ebooks/148
guide: guides/week-18.md
guide_description: |
  From reading style to writing it. How to choose words, comparisons and sentence shapes that give your own
  argument the tone your purpose and audience need: register, connotation, precision, intensifiers and hedges,
  comparisons that fit a reader, syntax for emphasis. Benjamin Franklin's Autobiography as a case study twice
  over: his account of teaching himself to write by imitating the Spectator, and his advice to speak “with
  modest diffidence,” dropping words like “certainly” to persuade more people. A revision lesson, common
  mistakes, the exam's style revision questions and a self-check.
flashcards_description: |
  30 cards on tone and register in your own writing, connotation and precision, comparisons and syntax for
  effect, the style revision questions, and Franklin's apprenticeship in writing and his rules for modest
  persuasion.

flashcards:
  - front: Skill 8.A → the three things you control
    back: |
      Word choice, comparisons and syntax. The skill asks you to use them on purpose, so that your argument has a tone that suits its audience and helps it persuade.
    topic_code: "8.A"
  - front: Tone in your own argument → how to choose it
    back: |
      Ask who must be persuaded and what they already believe. A school board needs a respectful, measured voice; a rally of supporters can take more heat. The right tone is the one that keeps the reader listening.
    topic_code: "8.A"
  - front: Register → formal, neutral and informal
    back: |
      Formal: no contractions, no slang, precise and often Latinate words. Neutral: plain, clear, standard English. Informal: conversational, contractions, slang. Most AP essays should be neutral to formal, and consistent.
    topic_code: "8.A"
  - front: Near-synonyms → choosing by connotation (thrifty, frugal, stingy, cheap)
    back: |
      All four mean “spends little,” but thrifty and frugal praise, while stingy and cheap blame. Choosing among near-synonyms is how a writer signals judgment without announcing it.
    topic_code: "8.A"
  - front: Precise vs vague diction in an argument
    back: |
      *Things*, *stuff*, *a lot*, *bad*, *good* force the reader to guess. A precise word (*forty-minute bus ride*, *unscheduled*, *compounded monthly*) shows command of the subject and makes the argument easier to trust.
    topic_code: "8.A"
  - front: Intensifiers (very, really, totally, extremely) → why they usually weaken
    back: |
      They insist instead of showing. *Totally clueless* sounds less credible than a specific fact. Cut the intensifier and choose a stronger noun or verb, or let the evidence carry the force.
    topic_code: "8.A"
  - front: Hedging in your own writing → too much and the right amount
    back: |
      Too much (*maybe, I guess, sort of*) abandons the claim. The right amount qualifies only what the evidence cannot fully prove (*most*, *in many cases*, *the survey suggests*). Measured confidence is a tone.
    topic_code: "8.A"
  - front: Franklin's "modest diffidence" → what it means
    back: |
      Diffidence is reluctance to assert oneself. Franklin made it a deliberate manner: stating opinions tentatively (“I conceive,” “it appears to me”) so that listeners would weigh them instead of resisting them.
    topic_code: "8.A"
  - front: Franklin's forbidden words → what he stopped saying
    back: |
      “certainly, undoubtedly, or any others that give the air of positiveness to an opinion.” He dropped them when advancing anything “that may possibly be disputed.”
    topic_code: "8.A"
  - front: Franklin's replacement phrases → what he said instead
    back: |
      “I conceive or apprehend a thing to be so and so; it appears to me, or I should think it so or so, for such and such reasons; or I imagine it to be so; or it is so, if I am not mistaken.”
    topic_code: "8.A"
  - front: Franklin → why a modest manner persuades better
    back: |
      A “positive and dogmatical manner” may “provoke contradiction and prevent a candid attention.” A tentative manner lowers the listener's defenses, so the reasons get a hearing. Tone is a means of persuasion, not decoration.
    topic_code: "1.B"
  - front: Franklin → the "chief ends of conversation"
    back: |
      “to inform or to be informed, to please or to persuade.” His argument then shows that a positive, assuming manner defeats each of these ends in turn.
    topic_code: "5.A"
  - front: Franklin and the Spectator → his imitation exercise
    back: |
      He made short notes of each sentence's sense in a Spectator essay, waited a few days, rewrote the essay from the notes in his own words, and compared his version with the original to find and correct his faults.
    topic_code: "8.A"
  - front: Franklin's verse exercise → why he turned prose into verse
    back: |
      Verse forces a writer to find words of the same meaning but different length or sound. Franklin turned Spectator tales into verse and back again to build “a stock of words,” a range of synonyms to choose among.
    topic_code: "8.A"
  - front: Franklin's jumbled notes → what the exercise taught
    back: |
      He mixed up his notes and, weeks later, put them back in the best order before writing. “This was to teach me method in the arrangement of thoughts”: organization (5.B) learned by practice.
    topic_code: "5.B"
  - front: Franklin's father's criticism of his writing
    back: |
      Though young Benjamin spelled and punctuated better than his opponent, his father showed that he “fell far short in elegance of expression, in method and in perspicuity.” Correctness is not the same as style.
    topic_code: "8.A"
  - front: Perspicuity → the eighteenth-century word for a virtue of style
    back: |
      Clearness: the quality of being easily understood. Franklin's father faulted his perspicuity, and plainness became Franklin's lifelong goal.
    topic_code: "8.A"
  - front: Franklin and the Socratic method → why he adopted it, then left it
    back: |
      He “dropt my abrupt contradiction and positive argumentation, and put on the humble inquirer and doubter,” winning arguments by questions. He later gave up the trap-setting but kept its modest manner of expression.
    topic_code: "8.A"
  - front: Franklin's Autobiography → when and for whom it was written
    back: |
      Begun in 1771 as a letter to his son William, continued in 1784-85 and 1788, left unfinished at his death in 1790. First published in French in 1791; the full English text from his manuscript appeared in 1868.
    topic_code: "1.A"
  - front: The Spectator → the model Franklin imitated
    back: |
      A London daily paper of short essays by Joseph Addison and Richard Steele (1711-1712), written in a polished, clear, urbane style. For a century it was the standard model of good English prose.
    topic_code: "8.A"
  - front: Pope's couplet in Franklin → "Men should be taught as if you taught them not"
    back: |
      Franklin quotes Alexander Pope to support his advice: instruction lands best when it does not feel like instruction. He also cites Pope's line about speaking, though sure, “with seeming diffidence.”
    topic_code: "8.A"
  - front: Franklin adds Humility to his list of virtues → appearance vs reality
    back: |
      Told by a Quaker friend that he was thought proud, Franklin added Humility. He admits he gained little of “the reality of this virtue,” but “a good deal with regard to the appearance of it,” mostly through word choice.
    topic_code: "8.A"
  - front: Comparison in your own argument → choosing one that fits the audience
    back: |
      An analogy persuades when the reader already accepts the familiar half. *We would not hand someone car keys without driving lessons* works for parents; it fails if the comparison is unfair or the reader rejects its premise.
    topic_code: "8.A"
  - front: Extended comparison → keeping it consistent
    back: |
      If you start with driving, finish with driving (keys, lessons, the road). Switching images mid-paragraph (driving, then swimming, then cooking) muddles the tone and the point.
    topic_code: "8.A"
  - front: Syntax for emphasis in your own writing → the short sentence
    back: |
      After two or three longer sentences, a short one stands out and sounds decisive. Save it for the claim you most want remembered.
    topic_code: "8.A"
  - front: Parallel structure in your own writing → why matching forms matter
    back: |
      *to budget, to save and to read a loan agreement* is easier to read and more emphatic than *budgeting, to save, and how loan agreements are read*. Parallel form shows that items are equal and builds rhythm.
    topic_code: "8.A"
  - front: Style revision question → "maintain the tone" routine
    back: |
      Read two or three sentences around the underlined part and name the passage's tone. Eliminate options that are too casual, too extreme or too timid for it, then choose the one that also keeps the meaning.
    topic_code: "8.A"
  - front: Style revision question → "most precise word" routine
    back: |
      Ask what exactly the writer means and what attitude the context requires. The right option is specific and fits the connotation; wrong ones are vague, exaggerated or carry the wrong judgment.
    topic_code: "8.A"
  - front: Imitation as practice → a modern version of Franklin's exercise
    back: |
      Take a paragraph you admire, note the point of each sentence, set it aside, rewrite from the notes, then compare. You learn the writer's choices by seeing where yours differ.
    topic_code: "8.A"
  - front: Plain style → definition, with Franklin as a model
    back: |
      Prose that favors clear, concrete words, natural word order and short to moderate sentences over ornament. Franklin's plain style persuades by seeming reasonable and unpretentious, which is itself a chosen tone.
    topic_code: "8.A"

quiz:
  description: |
    23 questions · about 40 minutes · a six-question set on Franklin's account of teaching himself to write, a
    five-question set on his advice to speak “with modest diffidence,” a six-question revision set on a student's
    speech, then questions on choosing words, comparisons and sentences. Over a third of the items return to
    earlier skills: tone and style (7.A), organization and transitions (5.B, 6.B), line of reasoning (5.A), the
    rhetorical situation (1.A) and audience (1.B). Multiple choice, select-all and true/false items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the paragraph are graded by
    your teacher against the model answers and scoring notes.
  questions:
    # ---- Passage set A: Franklin teaches himself to write
    - slug: u05-w18-q01
      type: multiple_choice
      topic_code: "1.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      stimulus: &franklin_spectator |
        *The following passage is from* The Autobiography of Benjamin Franklin, *begun in 1771 as a letter to his son. As a teenage apprentice in his brother's Boston printing house, Franklin had been debating a friend in letters; his father found the letters and read them.*

        Without entering into the discussion, he took occasion to talk to me about the manner of my writing; observed that, though I had the advantage of my antagonist in correct spelling and pointing (which I ow'd to the printing-house), I fell far short in elegance of expression, in method and in perspicuity, of which he convinced me by several instances. I saw the justice of his remark, and thence grew more attentive to the manner in writing, and determined to endeavor at improvement.

        About this time I met with an odd volume of the Spectator. It was the third. I had never before seen any of them. I bought it, read it over and over, and was much delighted with it. I thought the writing excellent, and wished, if possible, to imitate it. With this view I took some of the papers, and, making short hints of the sentiment in each sentence, laid them by a few days, and then, without looking at the book, try'd to compleat the papers again, by expressing each hinted sentiment at length, and as fully as it had been expressed before, in any suitable words that should come to hand. Then I compared my Spectator with the original, discovered some of my faults, and corrected them. But I found I wanted a stock of words, or a readiness in recollecting and using them, which I thought I should have acquired before that time if I had gone on making verses; since the continual occasion for words of the same import, but of different length, to suit the measure, or of different sound for the rhyme, would have laid me under a constant necessity of searching for variety, and also have tended to fix that variety in my mind, and make me master of it. Therefore I took some of the tales and turned them into verse; and, after a time, when I had pretty well forgotten the prose, turned them back again. I also sometimes jumbled my collections of hints into confusion, and after some weeks endeavored to reduce them into the best order, before I began to form the full sentences and compleat the paper. This was to teach me method in the arrangement of thoughts. By comparing my work afterwards with the original, I discovered many faults and amended them; but I sometimes had the pleasure of fancying that, in certain particulars of small import, I had been lucky enough to improve the method or the language, and this encouraged me to think I might possibly in time come to be a tolerable English writer, of which I was extremely ambitious.
      prompt: |
        Given the rhetorical situation of the Autobiography, Franklin's primary purpose in this passage is most likely to
      options:
        - |
          defend his spelling against his father's criticism
        - |
          persuade readers to buy the Spectator
        - |
          argue that verse is superior to prose
        - |
          show a younger reader, by his own example, how deliberate practice can turn a correct writer into a good one
      option_explanations:
        - |
          Franklin accepts his father's criticism (“I saw the justice of his remark”); his spelling was the one thing his father did not fault.
        - |
          The Spectator is the model he imitated, not a product he is promoting. The passage is about his method, not the paper's merits.
        - |
          Verse is a training exercise for building vocabulary; he turns the tales “back again” into prose. Nothing claims verse is better.
        - |
          Correct. Writing to his son, Franklin narrates a sequence of exercises, each aimed at a fault, and their results. The passage teaches by example, which fits an autobiography addressed to a younger family member.
      answer: 3
      explanation: |
        The rhetorical situation (1.A) includes the writer, audience and purpose. Knowing that the Autobiography began as a letter to Franklin's son explains why the passage reads like a lesson.

    - slug: u05-w18-q02
      type: multiple_choice
      topic_code: "7.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      stimulus: *franklin_spectator
      prompt: |
        The phrases “in certain particulars of small import,” “lucky enough” and “a tolerable English writer” contribute to a tone that is best described as
      options:
        - |
          modest and gently self-deprecating, even about his successes
        - |
          bitter about the years spent on dull exercises
        - |
          boastful, celebrating his early genius
        - |
          anxious, doubting that he ever learned to write well
      option_explanations:
        - |
          Correct. Franklin shrinks his improvements (“small import”), credits luck and aims only at “tolerable.” Written by a famous author, the understatement is charming and itself shows the plain, modest style he learned.
        - |
          He calls the exercises a “pleasure” when they succeed and describes them without complaint. Nothing is bitter.
        - |
          A boast would claim to have surpassed the original. Franklin claims only small, lucky improvements in some particulars.
        - |
          He writes with quiet confidence and says the results “encouraged” him. The modesty is a manner, not real self-doubt.
      answer: 0
      explanation: |
        Understatement is a tone tool from week 17. A writer whose success is well known can make his modesty part of his appeal.

    - slug: u05-w18-q03
      type: multiple_choice
      topic_code: "5.B"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      stimulus: *franklin_spectator
      prompt: |
        Which of the following best describes the organization of the second paragraph?
      options:
        - |
          A general claim about writing followed by a list of famous examples
        - |
          A comparison of the Spectator with other periodicals
        - |
          A sequence of exercises, each prompted by a fault Franklin discovered, ending with what the practice led him to hope
        - |
          An argument and a counterargument about whether writing can be taught
      option_explanations:
        - |
          No famous writers are listed, and the paragraph begins with a narrative event (finding the volume), not a general claim.
        - |
          The Spectator is the only periodical mentioned. The paragraph is about Franklin's practice, not a comparison of papers.
        - |
          Correct. The imitation exercise reveals faults; the lack of “a stock of words” leads to the verse exercise; the jumbled hints teach “method.” Each step answers a problem, and the paragraph closes on the hope of becoming “a tolerable English writer.”
        - |
          No opposing view appears. Franklin narrates; he does not debate.
      answer: 2
      explanation: |
        Organization (5.B) can be narrative and still reflect a line of reasoning: here, problem then remedy, repeated.

    - slug: u05-w18-q04
      type: multiple_choice
      topic_code: "8.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      stimulus: *franklin_spectator
      prompt: |
        According to the passage, Franklin turned prose tales into verse and back again chiefly in order to
      options:
        - |
          become a poet like the writers of the Spectator
        - |
          build a range of words of similar meaning but different length and sound, so he could choose the right one
        - |
          memorize the Spectator essays word for word
        - |
          avoid his father's criticism of his spelling
      option_explanations:
        - |
          Verse is a means, not an end. He turns the tales back into prose, and his ambition is to be “a tolerable English writer.”
        - |
          Correct. Verse demands “words of the same import, but of different length” or sound, so practicing it builds a “stock of words” and “a readiness in recollecting and using them,” which is the raw material of word choice.
        - |
          He waits until he has “pretty well forgotten the prose” before turning verse back into it. The point is to produce his own words, not recall Addison's.
        - |
          His father praised his spelling. The verse exercise targets vocabulary.
      answer: 1
      explanation: |
        Skill 8.A depends on having choices. Franklin's exercise is a deliberate way to collect synonyms so that his diction could fit each purpose.

    - slug: u05-w18-q05
      type: true_false
      topic_code: "7.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      stimulus: *franklin_spectator
      prompt: |
        True or false: Franklin claims that his versions of the Spectator papers were better than the originals in most respects.
      answer: false
      explanation: |
        False. He says that by comparing he “discovered many faults and amended them,” and only sometimes fancied that “in certain particulars of small import” he had improved the method or the language. The understated claim is part of his modest tone.

    - slug: u05-w18-q06
      type: multiple_choice
      topic_code: "5.B"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      stimulus: *franklin_spectator
      prompt: |
        In the second paragraph, the word “Therefore” in “Therefore I took some of the tales and turned them into verse” signals that the verse exercise
      options:
        - |
          contradicts what Franklin has just said about making verses
        - |
          is an example of the faults he found in his first exercise
        - |
          happened long before the imitation exercise
        - |
          is the remedy that follows from his discovery that he “wanted a stock of words”
      option_explanations:
        - |
          The preceding sentence says making verses would have built his vocabulary; the verse exercise acts on that idea rather than contradicting it.
        - |
          The verse exercise is a cure for a fault, not an instance of one.
        - |
          “Therefore” is a logical connective, not a time word, and the order of the paragraph places the verse exercise after the discovery.
        - |
          Correct. The sentence before diagnoses the problem and explains why verse would help; “Therefore” introduces the action taken as a result.
      answer: 3
      explanation: |
        Transitions mark the line of reasoning even in narrative. Here a causal transition joins a diagnosis to its remedy.

    # ---- Passage set B: "modest diffidence"
    - slug: u05-w18-q07
      type: multiple_choice
      topic_code: "8.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      stimulus: &franklin_diffidence |
        *The following passage is from* The Autobiography of Benjamin Franklin. *As a young man Franklin had delighted in winning arguments by the Socratic method of leading questions.*

        I continu'd this method some few years, but gradually left it, retaining only the habit of expressing myself in terms of modest diffidence; never using, when I advanced any thing that may possibly be disputed, the words certainly, undoubtedly, or any others that give the air of positiveness to an opinion; but rather say, I conceive or apprehend a thing to be so and so; it appears to me, or I should think it so or so, for such and such reasons; or I imagine it to be so; or it is so, if I am not mistaken. This habit, I believe, has been of great advantage to me when I have had occasion to inculcate my opinions, and persuade men into measures that I have been from time to time engag'd in promoting; and, as the chief ends of conversation are to inform or to be informed, to please or to persuade, I wish well-meaning, sensible men would not lessen their power of doing good by a positive, assuming manner, that seldom fails to disgust, tends to create opposition, and to defeat every one of those purposes for which speech was given to us, to wit, giving or receiving information or pleasure. For, if you would inform, a positive and dogmatical manner in advancing your sentiments may provoke contradiction and prevent a candid attention. If you wish information and improvement from the knowledge of others, and yet at the same time express yourself as firmly fix'd in your present opinions, modest, sensible men, who do not love disputation, will probably leave you undisturbed in the possession of your error. And by such a manner, you can seldom hope to recommend yourself in pleasing your hearers, or to persuade those whose concurrence you desire.
      prompt: |
        Franklin's practice of saying “I conceive” or “it appears to me” instead of “certainly” is best understood as
      options:
        - |
          a strategic choice of words meant to lower listeners' resistance so that his reasons receive a fair hearing
        - |
          evidence that Franklin was unsure of most of his opinions
        - |
          a habit he regrets because it made him seem weak
        - |
          a rule of grammar he learned in the printing house
      option_explanations:
        - |
          Correct. Franklin says the habit has helped him “persuade men into measures,” because a “positive and dogmatical manner” may “provoke contradiction and prevent a candid attention.” The modest words are chosen for their effect on the audience.
        - |
          Franklin uses the phrases even when he is sure, as Pope's line about speaking “with seeming diffidence” suggests. The modesty is a manner, not a measure of doubt.
        - |
          He calls the habit “of great advantage” and wishes others would adopt it. There is no regret.
        - |
          The habit grows out of his reading about the Socratic method and his experience of persuasion, not out of grammar rules.
      answer: 0
      explanation: |
        Skill 8.A in action: Franklin selects words for the tone they create and the persuasive effect of that tone.

    - slug: u05-w18-q08
      type: multiple_choice
      topic_code: "7.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      stimulus: *franklin_diffidence
      prompt: |
        Which of the following best describes the tone of Franklin's advice in the passage?
      options:
        - |
          angry and accusatory toward those who disagree with him
        - |
          uncertain and confused about what he recommends
        - |
          reasonable and practically persuasive, practicing the mild manner it recommends
        - |
          ironic, meaning the opposite of what he says
      option_explanations:
        - |
          He addresses “well-meaning, sensible men” and only wishes they would change. There is no accusation.
        - |
          The advice is clear and argued step by step. The tentative phrases are about how to state opinions, not confusion about this one.
        - |
          Correct. Franklin hedges his own claims (“I believe,” “may provoke,” “will probably leave you”) while laying out practical consequences. The passage does what it describes.
        - |
          Nothing signals irony. Franklin repeats the advice later in the Autobiography and credits it with his influence.
      answer: 2
      explanation: |
        A strong tone answer can note that a passage enacts its own advice. Look for the hedges: “I believe,” “may,” “probably,” “seldom.”

    - slug: u05-w18-q09
      type: multi_select
      topic_code: "8.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 2
      partial_credit: true
      stimulus: *franklin_diffidence
      prompt: |
        A student writes: *Undoubtedly, the town's new parking fees will ruin downtown business.* Which TWO revisions follow Franklin's advice while keeping the student's position? Select two.
      options:
        - |
          *It appears to me that the town's new parking fees may drive shoppers away from downtown, for two reasons.*
        - |
          *Unless I am mistaken, the new parking fees will hurt downtown business, and the first month's sales figures point that way.*
        - |
          *Certainly, absolutely, the new parking fees will ruin downtown business.*
        - |
          *I have no opinion about the parking fees.*
      option_explanations:
        - |
          Correct. “It appears to me” is one of Franklin's own phrases, and “for two reasons” promises the “such and such reasons” he says should follow. The position survives in a milder voice.
        - |
          Correct. “Unless I am mistaken” echoes Franklin's “if I am not mistaken,” and the sentence still makes the claim and points to evidence.
        - |
          This doubles the “air of positiveness” Franklin warns against. It is the opposite of his advice.
        - |
          Franklin recommends a modest manner, not giving up one's opinion. This revision abandons the position.
      answer: [0, 1]
      explanation: |
        Franklin's diffidence keeps the claim and the reasons and changes only the manner. Revisions that intensify the certainty, or drop the claim, miss the point.

    - slug: u05-w18-q10
      type: multiple_choice
      topic_code: "1.B"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      stimulus: *franklin_diffidence
      prompt: |
        Franklin's remark that “modest, sensible men, who do not love disputation, will probably leave you undisturbed in the possession of your error” shows his awareness that
      options:
        - |
          most listeners enjoy a heated argument
        - |
          thoughtful people often decline to correct someone who seems closed to correction, so a dogmatic speaker loses the chance to learn
        - |
          sensible men are usually wrong
        - |
          a speaker should never change his mind
      option_explanations:
        - |
          He says the reverse: these listeners “do not love disputation,” which is why they withdraw.
        - |
          Correct. Franklin understands what such listeners value (peace, courtesy) and predicts how they respond to a positive manner. The dry phrase “the possession of your error” makes the cost vivid.
        - |
          The error belongs to the dogmatic speaker, not to the sensible men, who silently decline to correct it.
        - |
          The sentence is about the benefit of learning from others, which requires being open to changing one's mind.
      answer: 1
      explanation: |
        Audience awareness (1.B, week 5) means knowing what listeners believe and value and predicting their response. Franklin's advice is built on such predictions.

    - slug: u05-w18-q11
      type: multiple_choice
      topic_code: "5.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      stimulus: *franklin_diffidence
      prompt: |
        Which of the following best describes the line of reasoning Franklin uses to support his advice?
      options:
        - |
          He tells a single story of an argument he lost, then draws a moral from it.
        - |
          He cites a series of authorities who agree with him.
        - |
          He defines “diffidence” and then gives its history.
        - |
          He names the purposes of conversation (to inform, to be informed, to please, to persuade) and shows how a positive manner defeats each one in turn.
      option_explanations:
        - |
          No single lost argument is narrated in this passage. Franklin reasons from the purposes of speech.
        - |
          Pope appears just after this passage, but here the support is a reasoned analysis, not a list of authorities.
        - |
          The word is used, not defined or traced historically.
        - |
          Correct. After stating “the chief ends of conversation,” Franklin takes them up one by one with “if you would inform,” “If you wish information” and “pleasing your hearers, or to persuade,” so the structure itself proves his claim.
      answer: 3
      explanation: |
        Line of reasoning (5.A): a writer who lists purposes and then tests a behaviour against each one has built a complete case. Following the parallel “if you ...” clauses shows the structure.

    # ---- Passage set C: revision of a student speech
    - slug: u05-w18-q12
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: &w18_draft |
        *The following is a draft of the opening of a speech a student will give to the school board, proposing that every student take a one-semester personal finance course before graduating.*

        (1) Everyone knows that teenagers are totally clueless about money. (2) Last spring, a survey of our senior class found that only 31 percent could explain how interest on a credit card is calculated. (3) That number should worry anyone who cares what happens to us after June. (4) A required personal finance course would teach budgeting. (5) It would also show students how saving works. (6) And how loan agreements are read. (7) Some board members worry that the schedule is already full. (8) The course could replace one semester of the current study-hall period, which most students use to goof off. (9) We would never hand someone the car keys without first teaching them to drive. (10) Yet every year we hand graduates credit card offers with no instruction at all.
      prompt: |
        The writer wants to revise sentence 1 so that it opens the speech with a credible, respectful tone suited to the school board. Which version best accomplishes this goal?
      options:
        - |
          Many students reach graduation without the financial knowledge they will need in their first year on their own.
        - |
          Teenagers are hopeless with money, and it is honestly embarrassing.
        - |
          It's kind of a thing that teens maybe don't know a ton about money, sort of.
        - |
          Everyone knows, obviously, that teenagers are totally clueless about money.
      option_explanations:
        - |
          Correct. The revision makes the same claim in measured, specific language (“many students,” “first year on their own”) and sets up the survey in sentence 2 as its proof, without insulting the students the speaker represents.
        - |
          “Hopeless” and “embarrassing” keep the insult and add emotional exaggeration. A board is unlikely to trust a speaker who mocks her own classmates.
        - |
          Piled-up hedges and slang (“kind of a thing,” “a ton,” “sort of”) make the speaker sound unsure and casual, the wrong register for a formal proposal.
        - |
          “Obviously” adds to the “air of positiveness” of “Everyone knows,” and “totally clueless” remains slang. The tone gets worse.
      answer: 0
      explanation: |
        Choosing a tone means choosing for an audience. A formal audience needs a measured voice; let the evidence do the insisting.

    - slug: u05-w18-q13
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: *w18_draft
      prompt: |
        The writer wants to combine sentences 4, 5 and 6 into one sentence that uses parallel structure to emphasize what the course would teach. Which version best accomplishes this goal?
      options:
        - |
          A required personal finance course would teach budgeting, also how saving works, and loan agreements being read.
        - |
          A required personal finance course would teach budgeting; saving would also be shown, and how loan agreements are read.
        - |
          A required personal finance course would teach students to budget, to save and to read a loan agreement.
        - |
          Budgeting, and saving, a required personal finance course would teach them, and reading loan agreements too.
      option_explanations:
        - |
          The three items take three different forms (a noun, a clause, a phrase with “being”). The lack of parallelism makes the list harder to read and weaker.
        - |
          Switching to the passive (“would also be shown”) breaks the pattern and buries the course as the subject. The sentence is no more emphatic than the draft.
        - |
          Correct. Three infinitives (“to budget, to save and to read”) in matching form make the items equal and the sentence crisp, and fragment 6 disappears.
        - |
          The inverted, scrambled order is confusing and the items still do not match. Emphasis needs clarity first.
      answer: 2
      explanation: |
        Parallel structure is a syntax choice (8.A). Matching forms tell the listener that the items belong together and give the sentence rhythm.

    - slug: u05-w18-q14
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: *w18_draft
      prompt: |
        The writer wants to replace “which most students use to goof off” in sentence 8 with wording that is precise and does not undercut the speaker's credibility. Which choice best accomplishes this goal?
      options:
        - |
          which is basically a waste of everybody's time
        - |
          which most students now spend without assigned work
        - |
          which the administration has stupidly left unplanned
        - |
          which is, like, totally pointless
      option_explanations:
        - |
          “Basically a waste” is vague and dismissive, and “everybody's time” exaggerates. It invites the board to defend the study hall.
        - |
          Correct. The phrase states the fact the argument needs (the time is unassigned, so it can be used) in neutral, precise words, without insulting students or administrators.
        - |
          “Stupidly” attacks the very people the speech must persuade. A hostile word choice creates opposition, as Franklin warned.
        - |
          Slang and an intensifier make the speaker sound flippant in a formal setting.
      answer: 1
      explanation: |
        The most precise option is often the most persuasive. Prefer words that state the relevant fact and carry no needless judgment.

    - slug: u05-w18-q15
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: *w18_draft
      prompt: |
        The writer wants to revise sentence 10 so that it extends the comparison begun in sentence 9 and sharpens the contrast. Which version best accomplishes this goal?
      options:
        - |
          Yet every year graduates receive many credit card offers in the mail.
        - |
          Yet every year we serve graduates a buffet of credit card offers without a recipe.
        - |
          Yet every year we hand graduates the keys to their first credit card and never teach them the rules of the road.
        - |
          Yet every year credit card companies make large profits.
      option_explanations:
        - |
          The revision drops the driving image entirely, so sentence 9's comparison is left hanging.
        - |
          Switching from driving to cooking mixes the comparisons and muddles the point. An extended comparison should stay in one field.
        - |
          Correct. “Hand ... the keys” and “rules of the road” carry the driving image into the financial claim, so the parallel between sentences 9 and 10 makes the gap in instruction vivid.
        - |
          Company profits shift the subject from what students are taught to what lenders earn, and the comparison disappears.
      answer: 2
      explanation: |
        A comparison persuades when it is consistent and when its familiar half (no one drives untaught) transfers cleanly to the claim.

    - slug: u05-w18-q16
      type: multiple_choice
      topic_code: "6.B"
      source: written for this course
      points: 1
      stimulus: *w18_draft
      prompt: |
        The writer wants to begin sentence 8 with a transitional word that shows its relationship to sentence 7. Which choice best accomplishes this goal?
      options:
        - |
          But
        - |
          For instance,
        - |
          As a result,
        - |
          Likewise,
      option_explanations:
        - |
          Correct. Sentence 7 states the board's concern about a full schedule; sentence 8 answers it with a place the course could go. “But” marks the turn from objection to reply.
        - |
          Sentence 8 is not an example of a full schedule; it shows there is room. An example transition reverses the meaning.
        - |
          The study hall is not a result of the board's worry. A causal transition would make no sense.
        - |
          “Likewise” would present sentence 8 as another point like sentence 7, supporting the worry rather than answering it.
      answer: 0
      explanation: |
        Week 16's routine again: objection, then reply, calls for a contrast transition.

    - slug: u05-w18-q17
      type: multi_select
      topic_code: "8.A"
      source: written for this course
      points: 2
      partial_credit: true
      stimulus: *w18_draft
      prompt: |
        Which TWO revisions would make the speech's word choice more persuasive to the board while keeping the student's position? Select two.
      options:
        - |
          In sentence 3, replacing “should worry anyone who cares what happens to us” with “should concern everyone responsible for preparing us for life after graduation”
        - |
          In sentence 7, replacing “worry” with “have raised a fair concern” so that the objection is stated respectfully before it is answered
        - |
          In sentence 2, adding “shockingly and horrifyingly” before “only 31 percent”
        - |
          In sentence 7, replacing “Some board members worry” with “Some board members foolishly claim”
      option_explanations:
        - |
          Correct. The revision addresses the board's own role (“responsible for preparing us”) instead of a vague “anyone,” which turns the statistic into a call on the listeners' sense of duty.
        - |
          Correct. Granting that the concern is fair shows respect for the audience, as Franklin advises, and makes the reply in sentence 8 easier to accept.
        - |
          Stacked intensifiers make the statistic sound less credible, not more. The number is strong on its own.
        - |
          “Foolishly” insults the people the speaker must persuade and invites them to dig in.
      answer: [0, 1]
      explanation: |
        Persuasive word choice often means addressing the audience's values and stating opponents' views fairly. Insults and intensifiers create the “opposition” Franklin warned about.

    # ---- Choosing words, comparisons and sentences
    - slug: u05-w18-q18
      type: fill_blank
      topic_code: "8.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      prompt: |
        Franklin describes his habit of avoiding words like “certainly” and “undoubtedly” as expressing himself “in terms of modest ____.”
      answer: ["diffidence"]
      explanation: |
        Diffidence means a reluctance to assert oneself. Franklin made it a deliberate manner because it drew less contradiction and won more agreement.

    - slug: u05-w18-q19
      type: fill_blank
      topic_code: "8.A"
      source: general knowledge
      points: 1
      prompt: |
        The feelings and judgments a word carries beyond its dictionary meaning (for example, the praise in “thrifty” and the blame in “stingy”) are called its ____.
      answer: ["connotation", "connotations", "connotative meaning", "connotative meanings"]
      explanation: |
        Denotation is the dictionary meaning; connotation is the associated feeling or judgment. Choosing among near-synonyms by connotation is one of the main ways to control tone.

    - slug: u05-w18-q20
      type: true_false
      topic_code: "8.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 1
      prompt: |
        True or false: after adding Humility to his list of virtues, Franklin claims he fully acquired the reality of that virtue.
      answer: false
      explanation: |
        False. Franklin writes that he “cannot boast of much success in acquiring the reality of this virtue,” but “had a good deal with regard to the appearance of it,” chiefly by forbidding himself words “that imported a fix'd opinion.” He frankly presents humility of manner as a matter of word choice.

    - slug: u05-w18-q21
      type: short_answer
      topic_code: "8.A"
      source: written for this course
      points: 2
      prompt: |
        Here is a sentence from a student's argument:

        > *Obviously, anyone with a brain can see that the school day starts way too early.*

        Revise the sentence so that its tone would persuade a sceptical audience of parents and teachers, keeping the student's position. Then, in one sentence, explain one change you made and why it helps.
      answer: |
        *For most teenagers, a school day that begins at 7:15 starts before their bodies are ready to learn, and the evidence on adolescent sleep suggests a later start would help.* I removed “obviously, anyone with a brain,” which insults readers who disagree, and replaced the vague “way too early” with a specific time and a reason, so the claim sounds measured and invites the audience to weigh the evidence instead of resisting the speaker.
      explanation: |
        1 point: a revision that keeps the position and removes the insulting, slangy or overconfident language (it may add a specific detail or a modest qualifier). 1 point: a clear explanation of how one change affects the tone and the audience's response. A revision that drops the claim, or a vague explanation (“it sounds better”), earns at most 1.

    - slug: u05-w18-q22
      type: short_answer
      topic_code: "8.A"
      source: written for this course
      points: 2
      prompt: |
        Write two versions of a single sentence arguing that your town should plant more street trees: one with a tone suited to a formal letter to the city council, and one suited to a speech at a neighbourhood rally. Then name one word choice that makes the difference.
      answer: |
        Council letter: *Planting street trees on the town's treeless blocks would lower summer pavement temperatures and raise property values, at a modest cost.* Rally: *Our streets bake every August; let's give them shade, and let's do it this year!* The difference: “would lower summer pavement temperatures” is neutral and precise for officials weighing costs, while “bake” is vivid and emotional for supporters who need to be stirred to act. (Other differences: “let's” and the exclamation; the formal sentence's cost clause.)
      explanation: |
        1 point: two versions that each make the same argument with a clearly different, audience-appropriate tone. 1 point: names a specific word choice (or comparison or syntax choice) and explains how it fits each audience. Versions that differ only in length or that change the position earn at most 1.

    - slug: u05-w18-q23
      type: long_answer
      topic_code: "8.A"
      source: 'Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
      points: 5
      prompt: |
        Franklin advises writers and speakers never to use “certainly, undoubtedly, or any others that give the air of positiveness to an opinion.” Write one well-developed argument paragraph (about 175-225 words) taking a position on whether this is good advice for student writers today. Support your claim with evidence (from Franklin, your reading, your experience or your observation) and explain it. Make deliberate choices of words, at least one comparison, and sentence structure that give your paragraph a consistent tone suited to readers who may disagree with you. After the paragraph, write one sentence naming two of the style choices you made and the tone they create.
      answer: |
        Model approach (one of many acceptable positions). Claim: Franklin's advice is mostly sound for student writers, because a measured voice keeps a sceptical reader reading, but it goes too far when it asks writers to soften claims their evidence proves. Evidence: Franklin credits the habit with his “weight” among his fellow citizens and his “influence in public councils”; a student who opens with *obviously* invites readers who disagree to stop listening. Commentary: hedges on uncertain claims show the writer has weighed the evidence; hedges on established facts sound timid. Comparison: confidence in an argument is like salt in cooking: necessary, but measured to the dish. Syntax: a long, qualified sentence followed by a short decisive one (*Some claims deserve certainty.*). Closing style sentence: *I used modest phrases such as “it seems” for my uncertain claims and a short final sentence for my strongest one, creating a tone that is confident but fair.*
      explanation: |
        5 points. Claim (1): a defensible position on Franklin's advice, ideally qualified. Evidence (1): at least one specific, relevant piece of evidence (Franklin's account of the habit's effect, an example from reading or experience). Commentary (1): explains how the evidence supports the claim rather than restating it. Style (2): 2 points if the paragraph shows deliberate, effective choices of words, at least one fitting comparison and varied syntax that create a consistent tone suited to a sceptical reader, and the final sentence accurately names two of those choices and the tone; 1 point if the choices are present but uneven (a lapse into slang, a strained comparison) or the final sentence is missing or inaccurate.
