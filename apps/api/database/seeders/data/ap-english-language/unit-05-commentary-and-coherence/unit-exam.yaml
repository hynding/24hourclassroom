    stimulus: &ex_draft |
      *The following is a draft of two body paragraphs from a student's argument essay on whether the city should turn a vacant downtown lot into a community garden instead of selling it to a developer for a parking lot.*

      (1) The garden would give the neighborhood something it has lost: a shared public space. (2) Since the community center closed in 2019, there has been no place within a mile where residents can meet without buying something. (3) A garden would be open from dawn to dusk, every day. (4) In a city survey, 64 percent of nearby residents said they would visit the garden at least once a month. (5) That is a lot of people. (6) A parking lot, by contrast, would be used mostly by commuters who leave at five.

      (7) The developer argues that downtown needs more parking. (8) The city's own count found that the two existing garages were never more than 70 percent full last year. (9) Gardens also lower summer temperatures on surrounding blocks. (10) Selling the lot would bring the city a one-time payment of $400,000. (11) A garden would cost about $30,000 to build and could be maintained by volunteers. (12) Honestly, choosing parking over people would be totally insane. (13) The city should not trade a lasting public space for a single payment and a few more parking spaces that the numbers say no one needs.
