  - slug: u05-exam-q41
    type: short_answer
    topic_code: "7.A"
    source: 'Francis Bacon, Essays (1625); Samuel Johnson, The Rambler (1751) and The Idler (1758)'
    points: 2
    prompt: |
      In two or three sentences, compare the prose style of Bacon's essays with that of Johnson's, naming one shared feature and one difference, with a brief example of each.
    answer: |
      Both writers rely on balanced, parallel syntax and antithesis: Bacon writes that “prosperity doth best discover vice, but adversity doth best discover virtue,” and Johnson that “To act is far easier than to suffer.” The difference is in density and diction: Bacon compresses each idea into a maxim with few connecting words, while Johnson expands a thought through long, Latinate sentences with many qualifying clauses, such as the series of “who” clauses describing the idle.
    explanation: |
      1 point: an accurate shared feature (balance, antithesis, parallelism, moral generalization, formality) with an example from either writer. 1 point: an accurate difference (compression versus expansion, sparse versus frequent connectives, Bacon's plainer words versus Johnson's Latinate diction, Johnson's irony) with an example. A response with features but no examples earns 1.

  - slug: u05-exam-q42
    type: short_answer
    topic_code: "5.B"
    source: 'Francis Bacon, Essays (1625); Samuel Johnson, The Idler (1758); Benjamin Franklin, The Autobiography of Benjamin Franklin (1791)'
    points: 2
    prompt: |
      Choose one transition from a text read in this unit (for example Bacon's “But to speak in a mean,” Johnson's “But idleness predominates,” or Franklin's “Therefore I took some of the tales”). In two or three sentences, explain what relationship it signals and how it reflects the writer's line of reasoning.
    answer: |
      In Idler No. 31, “But idleness predominates in many lives where it is not suspected” signals a contrast between the openly idle, whom Johnson has just mocked, and the hidden idle, who are his real subject. The turn reflects his line of reasoning: the obvious case makes the vice easy to recognize, and the contrast then shows that it is more widespread and dangerous than readers assume, because it hides under busyness.
    explanation: |
      1 point: accurately identifies the relationship the transition signals (contrast, shift in register, cause and remedy). 1 point: explains how that relationship fits the larger line of reasoning (what comes before and after, and why the move matters to the argument). A response that names only the type of transition earns 1.

  - slug: u05-exam-q43
    type: multiple_choice
    topic_code: "8.A"
    source: written for this course
    points: 1
    prompt: |
      A student writing to the principal wants to express concern about a new cell-phone policy without sounding hostile. Which sentence best accomplishes this goal?
    options:
      - |
        *This policy is a ridiculous overreaction by people who do not understand teenagers.*
      - |
        *Whatever, the policy is fine, I guess.*
      - |
        *I am sure you have heard every complaint already, so I will not bother.*
      - |
        *I understand the reasons for the new policy, but I am concerned that it leaves students without a way to reach their families during emergencies.*
    option_explanations:
      - |
        “Ridiculous” and the insult to administrators create the hostility the student wants to avoid.
      - |
        The dismissive, uncertain register abandons the concern altogether.
      - |
        The sentence gives up before making a point, and its tone edges toward sarcasm.
      - |
        Correct. Acknowledging the policy's reasons first, then stating a specific concern in measured words, conveys seriousness without hostility, the strategy Franklin recommends.
    answer: 3
    explanation: |
      Tone in your own writing (8.A) is chosen for the reader: acknowledge, then state a specific concern.


  # ---- Essay: rhetorical analysis
  - slug: u05-exam-q44
    type: long_answer
    topic_code: "7.A"
    source: 'Joseph Addison, The Spectator, No. 10 (1711)'
    points: 6
    stimulus: *ex_spectator
    prompt: |
      **Rhetorical analysis essay (suggested time: 40 minutes).** In March 1711, eleven days after launching *The Spectator*, Joseph Addison used the tenth number to explain what the new daily paper was for and whom it was for. Reread the passage above carefully. Write an essay that analyzes the rhetorical choices Addison makes to convey his purpose of persuading London readers to make the paper part of their daily lives.

      In your response you should do the following:

      - Respond to the prompt with a thesis that analyzes the writer's rhetorical choices.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Demonstrate an understanding of the rhetorical situation.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Model thesis: Addison wins readers for his daily paper by flattering them as a select company of “Disciples,” by blending gravity and play in balanced, witty sentences that enact the paper's promise to “enliven Morality with Wit,” and by organizing his appeal as a classification that claims every kind of idle Londoner for the Spectator.

      Line of reasoning a strong essay might follow: (1) Audience and ethos: the sales figure turned into “Threescore thousand Disciples,” set against “the thoughtless Herd,” flatters readers as discerning and gives the paper authority; the comparison to Socrates raises the mission while the lists of tea-tables and coffee-houses place it in readers' daily lives. (2) Style as proof: the chiasmus “enliven Morality with Wit, and to temper Wit with Morality” shows the blend it promises; mock-serious diction (“Part of the Tea Equipage,” “punctually served up”) makes moral reading a domestic habit; the metaphor of the mind lying “fallow” that “sprouts up in Follies” argues for daily reading. (3) Organization: “In the next Place” and “There is another Set of Men” move through families, idle observers and the “Blanks of Society,” each teased gently and offered a reason to read, so the classification itself enacts the purpose of reaching everyone. Sophistication: explaining how the gentle mockery of each group works as an invitation rather than an insult, or how the playful tone is itself a demonstration of the agreeable instruction the paper promises.
    explanation: |
      6 points, scored on the AP rhetorical analysis rubric. Row A, thesis (0-1): 1 point for a defensible thesis that analyzes Addison's rhetorical choices in relation to his purpose (not just “Addison uses rhetorical devices” or a summary). Row B, evidence and commentary (0-4): 4 points for specific evidence from throughout the passage (for example the “Disciples” calculation, the Socrates comparison, the chiasmus, the tea-equipage joke, the classification of readers, the “Blanks of Society” metaphor) and consistent commentary explaining how each choice serves the purpose of making the paper a daily habit and how it works on its audience; 3 points if commentary explains some choices but is uneven; 2 points if commentary is mostly summary or names devices with little explanation; 1 point for evidence that is general or merely restated; 0 for no relevant evidence. Row C, sophistication (0-1): 1 point for a complex understanding of the rhetorical situation, such as explaining the tension between flattery and mockery, how the paper's playful style demonstrates its own promise, or why the choices suited an eighteenth-century coffee-house public; or for a consistently vivid, persuasive style. Grammar errors do not cost points unless they obscure meaning.
