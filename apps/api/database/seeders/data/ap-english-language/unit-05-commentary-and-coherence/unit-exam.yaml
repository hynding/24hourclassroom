unit: 5
description: |
  44 questions · about 85 minutes · every skill of Unit 5: line of reasoning and commentary (5.A, 6.A),
  organization and transitions (5.B, 6.B), and style and tone (7.A, 8.A). Five passage sets: Bacon's “Of
  Adversity” and Johnson's Idler No. 31, new essays by writers you studied; a new passage from Franklin's
  Autobiography; a passage you have not studied, from Joseph Addison's Spectator No. 10 (1711), the paper
  Franklin imitated; and a nine-question revision set on a student's argument. Then eight questions across the
  unit, including two short written responses, and an AP-style rhetorical analysis essay on the Addison passage.
  Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
  automatically; the short responses and the essay are graded by your teacher against the model answers and the
  6-point AP rubric.
questions:
  # ---- Set A: Bacon, "Of Adversity"
  - slug: u05-exam-q01
    type: multiple_choice
    topic_code: "5.B"
    source: 'Francis Bacon, "Of Adversity," Essays (1625)'
    points: 1
    stimulus: &ex_adversity |
      *The following passage is the complete text of Francis Bacon's essay “Of Adversity,” from his* Essays *(1625). Seneca was a Roman Stoic philosopher; Bacon quotes him in Latin and translates.*

      IT WAS an high speech of Seneca (after the manner of the Stoics), that the good things, which belong to prosperity, are to be wished; but the good things, that belong to adversity, are to be admired. Bona rerum secundarum optabilia; adversarum mirabilia. Certainly if miracles be the command over nature, they appear most in adversity. It is yet a higher speech of his, than the other (much too high for a heathen), It is true greatness, to have in one the frailty of a man, and the security of a God. Vere magnum habere fragilitatem hominis, securitatem Dei. This would have done better in poesy, where transcendences are more allowed. And the poets indeed have been busy with it; for it is in effect the thing, which figured in that strange fiction of the ancient poets, which seemeth not to be without mystery; nay, and to have some approach to the state of a Christian; that Hercules, when he went to unbind Prometheus (by whom human nature is represented), sailed the length of the great ocean, in an earthen pot or pitcher; lively describing Christian resolution, that saileth in the frail bark of the flesh, through the waves of the world.

      But to speak in a mean. The virtue of prosperity, is temperance; the virtue of adversity, is fortitude; which in morals is the more heroical virtue. Prosperity is the blessing of the Old Testament; adversity is the blessing of the New; which carrieth the greater benediction, and the clearer revelation of God's favor. Yet even in the Old Testament, if you listen to David's harp, you shall hear as many hearse-like airs as carols; and the pencil of the Holy Ghost hath labored more in describing the afflictions of Job, than the felicities of Solomon. Prosperity is not without many fears and distastes; and adversity is not without comforts and hopes. We see in needle-works and embroideries, it is more pleasing to have a lively work, upon a sad and solemn ground, than to have a dark and melancholy work, upon a lightsome ground: judge therefore of the pleasure of the heart, by the pleasure of the eye. Certainly virtue is like precious odors, most fragrant when they are incensed, or crushed: for prosperity doth best discover vice, but adversity doth best discover virtue.
    prompt: |
      The sentence “But to speak in a mean” (the opening of the second paragraph) functions chiefly as a transition that
    options:
      - |
        introduces a counterargument claiming that prosperity is better than adversity
      - |
        signals a shift from lofty quotations and poetic fable to a plainer, more moderate statement of the argument
      - |
        announces that the essay is about to end
      - |
        marks a change of subject from adversity to the history of poetry
    option_explanations:
      - |
        The second paragraph still favors adversity (fortitude is “the more heroical virtue”). “But” turns away from a manner of speaking, not from Bacon's position.
      - |
        Correct. “A mean” is a middle way. After Seneca's “much too high” sayings and the fable of Hercules, which Bacon says “would have done better in poesy,” he turns to measured, balanced statements: “The virtue of prosperity, is temperance; the virtue of adversity, is fortitude.”
      - |
        A whole paragraph of argument follows. The sentence opens the second half; it does not close the essay.
      - |
        Poetry is what Bacon leaves behind here. The subject stays adversity; only the register changes.
    answer: 1
    explanation: |
      Transitions can signal a change of manner as well as of logic. Read what comes before (“too high,” “poesy”) and after (balanced plain statements) to see what kind of turn this is.

  - slug: u05-exam-q02
    type: multiple_choice
    topic_code: "7.A"
    source: 'Francis Bacon, "Of Adversity," Essays (1625)'
    points: 1
    stimulus: *ex_adversity
    prompt: |
      The syntax of “The virtue of prosperity, is temperance; the virtue of adversity, is fortitude; which in morals is the more heroical virtue” contributes to the argument chiefly by
    options:
      - |
        piling up examples of famous men who suffered
      - |
        using a question to make the reader doubt prosperity
      - |
        hiding the main claim at the end of a long periodic sentence
      - |
        setting the two conditions side by side in exactly parallel clauses, then tipping the balance toward adversity with a final clause
    option_explanations:
      - |
        No people are named in this sentence. It is a pair of abstract definitions, not a list of examples.
      - |
        The sentence is a statement, not a question. Its force comes from balance.
      - |
        The main claims come first, in two short matching clauses. The sentence is balanced, not periodic.
      - |
        Correct. Matching clauses (“The virtue of X, is Y”) present prosperity and adversity as equals, each with its virtue. The added “which” clause then judges fortitude “the more heroical,” so the structure enacts a fair weighing that comes down on one side.
    answer: 3
    explanation: |
      Antithesis and parallelism make comparison visible. When a balanced sentence adds a final clause, look there for the judgment.

  - slug: u05-exam-q03
    type: multiple_choice
    topic_code: "7.A"
    source: 'Francis Bacon, "Of Adversity," Essays (1625)'
    points: 1
    stimulus: *ex_adversity
    prompt: |
      The comparison to “needle-works and embroideries” suggests that
    options:
      - |
        bright qualities show to best advantage against a dark background, as virtue shows against hardship
      - |
        embroidery is a better pastime than reading about suffering
      - |
        a life of prosperity is like a beautiful but useless decoration
      - |
        hardship should be hidden from view, like the back of a piece of embroidery
    option_explanations:
      - |
        Correct. A “lively work, upon a sad and solemn ground” pleases more than the reverse. By analogy, hope and comfort stand out more in adversity, and Bacon tells us to “judge therefore of the pleasure of the heart, by the pleasure of the eye.”
      - |
        Embroidery is a figure for the heart's experience, not a recommended hobby. The comparison is an analogy.
      - |
        The comparison is about contrast between design and background, not about usefulness. Prosperity is not called decorative.
      - |
        The dark ground is visible and is what makes the bright work please. Nothing suggests hiding hardship.
    answer: 0
    explanation: |
      For an analogy, map each half: lively work = comfort and hope; sad ground = adversity. Then state what the mapping implies.

  - slug: u05-exam-q04
    type: multiple_choice
    topic_code: "5.A"
    source: 'Francis Bacon, "Of Adversity," Essays (1625)'
    points: 1
    stimulus: *ex_adversity
    prompt: |
      Which of the following best describes how Bacon supports his overarching claim?
    options:
      - |
        He narrates his own experience of misfortune and what it taught him.
      - |
        He presents statistics comparing the happiness of the rich and the poor.
      - |
        He draws on a philosopher's sayings, an ancient fable, scripture and analogies from everyday life, all pointing to the claim that adversity, though not wished for, best reveals virtue.
      - |
        He refutes Seneca's view and replaces it with his own.
    option_explanations:
      - |
        There is no personal narrative. Bacon writes in maxims and allusions, not autobiography.
      - |
        No numbers appear. The evidence is authority, story and analogy.
      - |
        Correct. Seneca, Hercules and Prometheus, the Old and New Testaments, David and Job, embroidery and perfume all lead to the closing claim that “adversity doth best discover virtue.”
      - |
        Bacon agrees with Seneca; he only finds one saying “too high” for plain speech. He builds on Seneca rather than refuting him.
    answer: 2
    explanation: |
      Line of reasoning (5.A) includes the kinds of evidence a writer chooses. Bacon's are cumulative: many short supports from different fields, converging on one conclusion.

  - slug: u05-exam-q05
    type: multi_select
    topic_code: "5.B"
    source: 'Francis Bacon, "Of Adversity," Essays (1625)'
    points: 2
    partial_credit: true
    stimulus: *ex_adversity
    prompt: |
      Which TWO features most contribute to the essay's unity and coherence? Select two.
    options:
      - |
        The repeated pairing of prosperity and adversity in parallel or contrasting phrases throughout the essay
      - |
        A closing sentence that returns to the opening contrast and condenses it into one balanced statement about virtue
      - |
        A chronological narrative that carries the reader from Bacon's youth to his old age
      - |
        A series of rhetorical questions that structure each paragraph
    option_explanations:
      - |
        Correct. From Seneca's opening contrast to “Prosperity is not without many fears ... and adversity is not without comforts,” the same pair recurs, keeping every sentence on one subject.
      - |
        Correct. “Prosperity doth best discover vice, but adversity doth best discover virtue” answers the opening and gathers the essay into a final antithesis, giving it a sense of closure.
      - |
        The essay contains no narrative of Bacon's life. Its order is argumentative, not chronological.
      - |
        There are no rhetorical questions in the essay; its sentences are statements and maxims.
    answer: [0, 1]
    explanation: |
      A recurring pair of key terms and a conclusion that echoes the opening are two of the strongest coherence devices in short essays.

  - slug: u05-exam-q06
    type: true_false
    topic_code: "7.A"
    source: 'Francis Bacon, "Of Adversity," Essays (1625)'
    points: 1
    stimulus: *ex_adversity
    prompt: |
      True or false: the simile “virtue is like precious odors, most fragrant when they are incensed, or crushed” presents adversity as something that destroys virtue.
    answer: false
    explanation: |
      False. Precious spices give off their scent when burned (“incensed”) or crushed. The simile says hardship releases and reveals virtue rather than destroying it, which the next clause states outright: “adversity doth best discover virtue.”

  - slug: u05-exam-q07
    type: multiple_choice
    topic_code: "5.B"
    source: 'Francis Bacon, "Of Adversity," Essays (1625)'
    points: 1
    stimulus: *ex_adversity
    prompt: |
      The final sentence of the essay (“Certainly virtue is like precious odors ...”) serves primarily to
    options:
      - |
        introduce a new subject for a later essay
      - |
        conclude the argument by condensing it into a memorable image and a balanced maxim
      - |
        concede that prosperity has more virtues than adversity
      - |
        qualify the essay's claim by admitting exceptions
    option_explanations:
      - |
        The sentence closes the essay's own argument; it opens no new topic.
      - |
        Correct. The simile gives the claim a sensory form, and the colon introduces the maxim that sums up the whole essay. “Certainly” marks it as the conclusion.
      - |
        The sentence says prosperity best discovers “vice.” It is the opposite of a concession to prosperity.
      - |
        Nothing is qualified. The final sentence is the essay's most confident statement.
    answer: 1
    explanation: |
      Endings in Bacon's essays often compress the argument into a quotable line. Identifying that function is a 5.B skill: the place of a sentence in the whole.

  # ---- Set B: Johnson, The Idler No. 31
  - slug: u05-exam-q08
    type: multiple_choice
    topic_code: "7.A"
    source: 'Samuel Johnson, The Idler, No. 31 (1758)'
    points: 1
    stimulus: &ex_idler31 |
      *The following passage is the opening of Samuel Johnson's essay in* The Idler, *No. 31 (November 18, 1758). Busiris is a proud tyrant in an eighteenth-century tragedy.*

      Many moralists have remarked, that pride has of all human vices the widest dominion, appears in the greatest multiplicity of forms, and lies hid under the greatest variety of disguises; of disguises, which, like the moon's *veil of brightness*, are both its *lustre and its shade*, and betray it to others, though they hide it from ourselves.

      It is not my intention to degrade pride from this pre-eminence of mischief; yet I know not whether idleness may not maintain a very doubtful and obstinate competition.

      There are some that profess idleness in its full dignity, who call themselves the *Idle*, as Busiris in the play calls himself the *Proud*; who boast that they do nothing, and thank their stars that they have nothing to do; who sleep every night till they can sleep no longer, and rise only that exercise may enable them to sleep again; who prolong the reign of darkness by double curtains, and never see the sun but to *tell him how they hate his beams*; whose whole labour is to vary the posture of indolence, and whose day differs from their night, but as a couch or chair differs from a bed.

      These are the true and open votaries of idleness, for whom she weaves the garlands of poppies, and into whose cup she pours the waters of oblivion; who exist in a state of unruffled stupidity, forgetting and forgotten; who have long ceased to live, and at whose death the survivors can only say, that they have ceased to breathe.

      But idleness predominates in many lives where it is not suspected; for, being a vice which terminates in itself, it may be enjoyed without injury to others; and it is therefore not watched like fraud, which endangers property; or like pride, which naturally seeks its gratifications in another's inferiority. Idleness is a silent and peaceful quality, that neither raises envy by ostentation, nor hatred by opposition; and therefore nobody is busy to censure or detect it.

      As pride sometimes is hid under humility, idleness is often covered by turbulence and hurry. He that neglects his known duty and real employment, naturally endeavours to crowd his mind with something that may bar out the remembrance of his own folly, and does any thing but what he ought to do with eager diligence, that he may keep himself in his own favour.
    prompt: |
      Johnson's attitude toward the “true and open votaries of idleness” in the third and fourth paragraphs is best described as
    options:
      - |
        mocking, presenting their idleness with a grandeur it does not deserve
      - |
        envious of their freedom from work
      - |
        neutral, recording their habits without comment
      - |
        fearful of the harm they do to others
    option_explanations:
      - |
        Correct. Phrases like “in its full dignity,” “votaries” and “the reign of darkness” treat sleeping late as a solemn calling, a mock-heroic manner that ridicules the idle.
      - |
        Nothing suggests envy. Johnson says they “exist in a state of unruffled stupidity” and have “long ceased to live.”
      - |
        “Unruffled stupidity” and the joke about their death are judgments, not neutral description.
      - |
        Johnson says idleness “may be enjoyed without injury to others.” His concern is what it does to the idle, not to their neighbours.
    answer: 0
    explanation: |
      Mock grandeur (elevated language for an unworthy subject) is one of Johnson's favourite tones, used here to make the openly idle absurd.

  - slug: u05-exam-q09
    type: multiple_choice
    topic_code: "7.A"
    source: 'Samuel Johnson, The Idler, No. 31 (1758)'
    points: 1
    stimulus: *ex_idler31
    prompt: |
      In the fourth paragraph, the image of idleness as a figure “for whom she weaves the garlands of poppies, and into whose cup she pours the waters of oblivion” chiefly serves to
    options:
      - |
        celebrate idleness as a source of artistic inspiration
      - |
        suggest that idleness is a disease caught from others
      - |
        describe the gardens the idle like to visit
      - |
        personify idleness as a goddess with devoted worshippers, whose gifts (sleep and forgetfulness) mock the emptiness of their lives
    option_explanations:
      - |
        Poppies (a source of sleep-inducing drugs) and oblivion are not inspiration. The gifts are numbness and forgetting.
      - |
        The figure is a goddess served by “votaries,” not an infection. The comparison is religious, not medical.
      - |
        The garlands are symbolic, not literal gardens. The image is a personification.
      - |
        Correct. “Votaries” are devotees, and “she” is idleness as a deity. Her gifts of drowsy poppies and “waters of oblivion” show that devotion to her means sleep and being forgotten, a mock-religious way of ridiculing the idle.
    answer: 3
    explanation: |
      Identify what a personification makes the subject (here, a goddess) and what the details of the figure imply (sleep, forgetting).

  - slug: u05-exam-q10
    type: multiple_choice
    topic_code: "7.A"
    source: 'Samuel Johnson, The Idler, No. 31 (1758)'
    points: 1
    stimulus: *ex_idler31
    prompt: |
      The syntax of the third paragraph, a long series of clauses beginning “who” and “whose,” contributes to the passage chiefly by
    options:
      - |
        building suspense toward a surprising revelation of who the idle are
      - |
        presenting a single action in slow motion
      - |
        piling up absurd habits in matching clauses, so that the ridicule accumulates with each addition
      - |
        imitating the quick, energetic rhythm of busy people
    option_explanations:
      - |
        There is no surprise; the group is named in the first clause. The series elaborates rather than withholds.
      - |
        The clauses list many habits (boasting, sleeping, curtains, posture), not one action.
      - |
        Correct. Each parallel clause adds a new absurdity (rising only to sleep again, curtains to prolong darkness, a day that differs from night “as a couch or chair differs from a bed”). The cumulative structure makes the portrait more ridiculous at every step.
      - |
        The rhythm is long and leisurely, more fitted to idleness than to bustle.
    answer: 2
    explanation: |
      A parallel series in satire works like a list of charges: each item adds weight, and the last is often the sharpest.

  - slug: u05-exam-q11
    type: multiple_choice
    topic_code: "5.B"
    source: 'Samuel Johnson, The Idler, No. 31 (1758)'
    points: 1
    stimulus: *ex_idler31
    prompt: |
      The word “But” at the start of the fifth paragraph (“But idleness predominates in many lives where it is not suspected”) marks a shift
    options:
      - |
        from praise of idleness to criticism of it
      - |
        from the obvious, self-declared idle to the hidden idleness that is the essay's real concern
      - |
        from idleness to an unrelated discussion of fraud
      - |
        from Johnson's own opinion to the opinion of other moralists
    option_explanations:
      - |
        Johnson never praises idleness. The paragraphs before “But” mock it.
      - |
        Correct. Having laughed at those who “profess idleness,” Johnson turns to idleness that goes unnoticed because it harms no one and hides under “turbulence and hurry.” The transition reveals where the argument is heading.
      - |
        Fraud appears only as a comparison (it is “watched” because it endangers property). The subject remains idleness.
      - |
        The moralists appear in the first paragraph. After “But,” Johnson continues in his own voice.
    answer: 1
    explanation: |
      A contrast transition after an extended example often turns from the easy case to the essay's real target. Organization (5.B) reflects that line of reasoning.

  - slug: u05-exam-q12
    type: multiple_choice
    topic_code: "5.A"
    source: 'Samuel Johnson, The Idler, No. 31 (1758)'
    points: 1
    stimulus: *ex_idler31
    prompt: |
      Johnson begins with what moralists say about pride most likely in order to
    options:
      - |
        establish idleness as a serious rival to the vice moralists consider greatest, and to set up a comparison he returns to later
      - |
        argue that pride is harmless
      - |
        change the subject of the essay from idleness to pride
      - |
        show that he disagrees with all moralists
    option_explanations:
      - |
        Correct. By granting pride its “pre-eminence of mischief” and then proposing that idleness may “maintain a very doubtful and obstinate competition,” Johnson raises idleness to the first rank of vices. Pride returns later as a comparison: idleness hides under hurry “As pride sometimes is hid under humility.”
      - |
        Johnson calls pride a vice with “the widest dominion” and does not intend to “degrade” it from its “pre-eminence of mischief.” He does not call it harmless.
      - |
        The essay is about idleness; pride is the measuring stick.
      - |
        He accepts the moralists' view of pride and builds on it.
    answer: 0
    explanation: |
      An opening comparison can frame a whole line of reasoning. Notice when it returns: here it links the opening to the paragraph on hidden idleness.

  - slug: u05-exam-q13
    type: multiple_choice
    topic_code: "7.A"
    source: 'Samuel Johnson, The Idler, No. 31 (1758)'
    points: 1
    stimulus: *ex_idler31
    prompt: |
      The contrast in “who have long ceased to live, and at whose death the survivors can only say, that they have ceased to breathe” conveys primarily that
    options:
      - |
        the idle live longer than busy people
      - |
        their friends mourn them deeply
      - |
        breathing is the most important part of life
      - |
        the idle have been, in every way that matters, dead long before they die
    option_explanations:
      - |
        The sentence says nothing about length of life; it distinguishes living from merely breathing.
      - |
        “Can only say” suggests there is nothing else to say about them, the opposite of deep mourning.
      - |
        The point is that breathing alone is not living. The sentence diminishes mere breath.
      - |
        Correct. By separating “ceased to live” from “ceased to breathe,” Johnson implies that the idle stopped living long ago and death removes only their breath. The antithesis delivers the essay's harshest judgment as wit.
    answer: 3
    explanation: |
      Antithesis can carry a judgment through a distinction (live versus breathe). Ask what the gap between the two terms implies.

  - slug: u05-exam-q14
    type: true_false
    topic_code: "5.B"
    source: 'Samuel Johnson, The Idler, No. 31 (1758)'
    points: 1
    stimulus: *ex_idler31
    prompt: |
      True or false: the sentence “As pride sometimes is hid under humility, idleness is often covered by turbulence and hurry” links the final paragraph back to the essay's opening discussion of pride.
    answer: true
    explanation: |
      True. The opening says pride “lies hid under the greatest variety of disguises.” The final paragraph reuses that idea of disguise for idleness, which hides under busy activity. Returning to an earlier comparison is a coherence device that ties the essay together.

  # ---- Set C: Addison, The Spectator No. 10 (a text not studied in the unit)
  - slug: u05-exam-q15
    type: multiple_choice
    topic_code: "1.A"
    source: 'Joseph Addison, The Spectator, No. 10 (1711)'
    points: 1
    stimulus: &ex_spectator |
      *The following passage is from Joseph Addison's essay in* The Spectator, *No. 10 (March 12, 1711). The Spectator was a new London daily paper of short essays, written in the voice of a silent, observant gentleman called Mr. Spectator; this number appeared eleven days after the first. Capital letters for nouns were common in print at the time.*

      It is with much Satisfaction that I hear this great City inquiring Day by Day after these my Papers, and receiving my Morning Lectures with a becoming Seriousness and Attention. My Publisher tells me, that there are already Three Thousand of them distributed every Day: So that if I allow Twenty Readers to every Paper, which I look upon as a modest Computation, I may reckon about Threescore thousand Disciples in London and Westminster, who I hope will take care to distinguish themselves from the thoughtless Herd of their ignorant and unattentive Brethren. Since I have raised to myself so great an Audience, I shall spare no Pains to make their Instruction agreeable, and their Diversion useful. For which Reasons I shall endeavour to enliven Morality with Wit, and to temper Wit with Morality, that my Readers may, if possible, both Ways find their account in the Speculation of the Day. And to the End that their Virtue and Discretion may not be short transient intermitting Starts of Thought, I have resolved to refresh their Memories from Day to Day, till I have recovered them out of that desperate State of Vice and Folly, into which the Age is fallen. The Mind that lies fallow but a single Day, sprouts up in Follies that are only to be killed by a constant and assiduous Culture. It was said of Socrates, that he brought Philosophy down from Heaven, to inhabit among Men; and I shall be ambitious to have it said of me, that I have brought Philosophy out of Closets and Libraries, Schools and Colleges, to dwell in Clubs and Assemblies, at Tea-tables, and in Coffee-houses.

      I would therefore in a very particular Manner recommend these my Speculations to all well-regulated Families, that set apart an Hour in every Morning for Tea and Bread and Butter; and would earnestly advise them for their Good to order this Paper to be punctually served up, and to be looked upon as a Part of the Tea Equipage.

      [...]

      In the next Place, I would recommend this Paper to the daily Perusal of those Gentlemen whom I cannot but consider as my good Brothers and Allies, I mean the Fraternity of Spectators who live in the World without having any thing to do in it; and either by the Affluence of their Fortunes, or Laziness of their Dispositions, have no other Business with the rest of Mankind but to look upon them. Under this Class of Men are comprehended all contemplative Tradesmen, titular Physicians, Fellows of the Royal Society, Templers that are not given to be contentious, and Statesmen that are out of business. In short, every one that considers the World as a Theatre, and desires to form a right Judgment of those who are the Actors on it.

      There is another Set of Men that I must likewise lay a Claim to, whom I have lately called the Blanks of Society, as being altogether unfurnish'd with Ideas, till the Business and Conversation of the Day has supplied them. I have often considered these poor Souls with an Eye of great Commiseration, when I have heard them asking the first Man they have met with, whether there was any News stirring? and by that Means gathering together Materials for thinking.
    prompt: |
      Which of the following best describes the purpose of the passage?
    options:
      - |
        To report the number of papers sold so that advertisers will buy space
      - |
        To apologize for the paper's serious tone and promise lighter content
      - |
        To describe, with humour, the paper's mission of making morality agreeable, and to recommend daily reading of it to several kinds of readers
      - |
        To argue that coffee-houses should be closed because they spread idle talk
    option_explanations:
      - |
        Sales figures appear only to set up the joke about “Threescore thousand Disciples.” Advertisers are never addressed.
      - |
        Addison promises to keep instruction “agreeable,” but he does not apologize; he insists on daily moral improvement.
      - |
        Correct. Addison states the paper's aim (“to enliven Morality with Wit, and to temper Wit with Morality”) and then recommends it, class by class, to families, idle observers and the “Blanks of Society.”
      - |
        Coffee-houses are where Addison wants philosophy to live. He welcomes them as places for his paper.
    answer: 2
    explanation: |
      Purpose (1.A) is what the whole passage does, not what one sentence mentions. Here: define the paper's mission and win its readers.

  - slug: u05-exam-q16
    type: multiple_choice
    topic_code: "7.A"
    source: 'Joseph Addison, The Spectator, No. 10 (1711)'
    points: 1
    stimulus: *ex_spectator
    prompt: |
      The phrase “to enliven Morality with Wit, and to temper Wit with Morality” is effective chiefly because its reversed word order
    options:
      - |
        enacts the balance it promises, giving each quality an equal share in correcting the other
      - |
        shows that Addison values wit above morality
      - |
        creates confusion that the reader must sort out
      - |
        introduces a contrast between the paper and its rivals
    option_explanations:
      - |
        Correct. The chiasmus (A with B, B with A) makes wit and morality trade places, so the sentence itself shows the mutual blend the paper promises: wit livens morality, morality restrains wit.
      - |
        The reversal gives both terms the same treatment. Neither is ranked above the other.
      - |
