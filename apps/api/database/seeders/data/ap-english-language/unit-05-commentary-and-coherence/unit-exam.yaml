      - |
        A list transition with no relationship stated. The reader learns only that a new topic is coming.
      - |
        A definition opening wanders away from the argument and makes no link to cost.
      - |
        “In conclusion” is a summary transition placed at the start of a body paragraph, and the claim is vague.
      - |
        Correct. The sentence recalls the cost paragraph, ranks safety above it, and announces the new paragraph's claim: a transition that shows the relationship between the two ideas.
    answer: 3
    explanation: |
      A paragraph-opening transition should look back and look ahead. Concession and escalation (“Even if ...”) are especially useful.

