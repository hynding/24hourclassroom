    # ---- Diction, syntax and tone
    - slug: u05-w17-q18
      type: fill_blank
      topic_code: "7.A"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751)'
      points: 1
      prompt: |
        Johnson's sentence “To act is far easier than to suffer” sets two opposed ideas side by side in parallel form, a device called ____.
      answer: ["antithesis", "an antithesis", "antitheses"]
      explanation: |
        Antithesis balances opposites in matching grammatical form. It gives a thought the weight of a maxim and is a hallmark of Johnson's style.

    - slug: u05-w17-q19
      type: fill_blank
      topic_code: "7.A"
      source: general knowledge
      points: 1
      prompt: |
        Long, abstract words that come into English from Latin, such as “pertinacious” and “remonstrance,” are often described as ____ diction.
      answer: ["Latinate", "latinate", "Latin", "Latin-derived", "Latinized", "Latinised"]
      explanation: |
        Latinate diction tends to sound formal and weighty; plain words of Old English origin (act, fear, lie) sound direct and concrete. The contrast is one of the main tools of tone.

    - slug: u05-w17-q20
      type: true_false
      topic_code: "7.A"
      source: general knowledge
      points: 1
      prompt: |
        True or false: a passage about a sad or serious subject necessarily has a sad or serious tone.
      answer: false
      explanation: |
        False. Tone is the writer's attitude, not the subject. Johnson treats lying in wartime with scornful wit in Idler No. 30, and a satirist can treat a grave subject with mock cheerfulness. Always ask how the writer regards the subject.

    - slug: u05-w17-q21
      type: short_answer
      topic_code: "7.A"
      source: 'Samuel Johnson, The Idler, No. 30 (1758)'
      points: 2
      prompt: |
        In one or two sentences, identify one specific word or phrase from Idler No. 30 and explain how its connotations convey Johnson's attitude toward news-writers.
      answer: |
        Johnson ends by calling news-writers “scribblers,” a word that means writers but suggests hasty, worthless work. Placed in parallel with “soldiers accustomed to plunder,” it strips them of any claim to the dignity of authorship and expresses his contempt. (Other good choices: “weekly historian,” which mocks small-town papers by inflating them; “periodical intelligence”; “absolutely necessary.”)
      explanation: |
        1 point: an accurate word or phrase from the passage. 1 point: an explanation of its connotation (not just its dictionary meaning) and how that connotation conveys scorn or mockery. A response that names the tone without connecting it to the word earns 1.

    - slug: u05-w17-q22
      type: short_answer
      topic_code: "7.A"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751); The Idler, No. 30 (1758)'
      points: 2
      prompt: |
        In two or three sentences, compare the tone of Rambler No. 134 with the tone of Idler No. 30, and name one stylistic choice that creates the difference.
      answer: |
        Rambler No. 134 is grave and admonitory but sympathetic, while Idler No. 30 is scornful and ironic. The difference shows in the pronouns: in the Rambler Johnson writes “we” and “ourselves,” including himself in the weakness, while in the Idler he holds news-writers at a distance as “they” and mocks them with an inverted definition. Both use balanced syntax, but the Rambler's balance sounds like moral reflection and the Idler's like a mock indictment.
      explanation: |
        1 point: accurate, precise tone words for both essays (not “positive” and “negative”). 1 point: a specific stylistic choice (pronouns, irony, the Tantalus allusion, the inverted definition, the mock list of qualifications) tied to the difference. A response that describes only one essay earns at most 1.

    - slug: u05-w17-q23
      type: long_answer
      topic_code: "7.A"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751)'
      points: 4
      prompt: |
        Write one well-developed analytical paragraph (about 150-200 words) making a claim about how Johnson's syntax in the Rambler No. 134 passage contributes to its tone. Support your claim with at least two short quotations that show different syntactic choices, and explain how each choice shapes the reader's sense of Johnson's attitude.
      answer: |
        Claim: Johnson's syntax makes his warning against delay sound both inevitable and humane: long, accumulating sentences show how procrastination drains a life, and short balanced ones deliver the verdict. Evidence 1: the sentence “Thus life is languished away ...” strings together “collecting resolutions,” “forming purposes” and “reconciling ourselves.” Commentary: the phrases pile up the way excuses do, so the reader feels the dreary repetition Johnson condemns; the tone is grave but sympathetic, because the “we” inside the series includes him. Evidence 2: “To act is far easier than to suffer.” Commentary: after the long sentences, this short antithesis lands like a maxim; its balance sounds settled and authoritative, turning sympathy into firm admonition. Concluding link: the movement from sprawling to compact sentences mirrors the movement from understanding the weakness to judging it.
      explanation: |
        4 points. Claim (1): an arguable claim connecting syntax to tone (not just “Johnson uses long sentences”). Evidence (1): at least two accurate short quotations showing different syntactic choices (cumulative series, antithesis, balanced pairs, the rhetorical question). Commentary (2): 2 points if each choice is explained in terms of the attitude it conveys and how the reader receives it; 1 point if commentary is thin, explains only one choice or names tone without linking it to syntax.
