guide_description: |
  How style makes tone. Diction (denotation, connotation, Latinate and plain words), comparisons (metaphor,
  personification, allusion) and syntax (parallelism, antithesis, balance, periodic and cumulative sentences),
  and how to name a tone precisely. Samuel Johnson's Rambler No. 134 (1751), a grave essay on procrastination,
  set against his Idler No. 30 (1758), a scornful one on wartime news-writers: the same writer, the same
  habits of sentence, two very different attitudes. Close readings, a lesson on writing about style, common
  mistakes, the exam's style questions and a self-check.
flashcards_description: |
  30 cards on tone words, diction, syntax and comparisons, Johnson and his two periodicals, and the sentences
  of Rambler No. 134 and Idler No. 30.

flashcards:
  - front: Tone → how to name it precisely
    back: |
      Tone is the writer's attitude toward the subject or audience. Name it with a precise adjective, often two joined by “but” or “yet” (grave but sympathetic; amused yet contemptuous). “Positive” and “negative” are not tones.
    topic_code: "7.A"
  - front: Tone vs subject → the common confusion
    back: |
      A sad subject does not make a sad tone. Johnson writes about wasted lives in Rambler No. 134 with gravity and some sympathy, and about lying journalists in Idler No. 30 with scorn. Ask how the writer feels about the subject, not what the subject is.
    topic_code: "7.A"
  - front: Diction → denotation and connotation
    back: |
      Denotation is a word's dictionary meaning; connotation is the feeling or judgment it carries. “Scribblers” and “writers” denote the same people, but “scribblers” carries contempt. Tone lives mostly in connotation.
    topic_code: "7.A"
  - front: Latinate vs plain (Anglo-Saxon) diction → typical effects
    back: |
      Latinate words (procrastination, pertinacious, remonstrance) tend to sound formal, abstract and weighty. Short native words (act, fear, sleep, lie) tend to sound plain, concrete and direct. Writers often mix them, and the shift itself can carry emphasis.
    topic_code: "7.A"
  - front: Rambler No. 134 → what its Latinate diction does to procrastination
    back: |
      Words like “pertinacious,” “solicitous,” “seducements” and “remonstrances” give a small daily habit the dignity of a serious moral subject. The elevated vocabulary tells the reader that delay is not a joke but a weakness of character.
    topic_code: "7.A"
  - front: Syntax → what the word covers in a style question
    back: |
      Sentence length, word order, the arrangement of clauses, parallelism and balance, repetition, fragments and questions. A syntax answer names the pattern and explains what the pattern does, for example by slowing the reader or enacting an idea.
    topic_code: "7.A"
  - front: Periodic sentence → definition and effect
    back: |
      A sentence that delays its main clause until the end, after modifiers and qualifications. It builds suspense and places the weight on the final words.
    topic_code: "7.A"
  - front: Cumulative (loose) sentence → definition and effect
    back: |
      A sentence that states its main clause first and then adds phrases and clauses. It feels natural and expansive and lets a writer pile up detail or examples.
    topic_code: "7.A"
  - front: Antithesis → definition and an example from Johnson
    back: |
      Opposed ideas set side by side in parallel form. “To act is far easier than to suffer” (Rambler No. 134) sets action against endurance in a short balanced sentence, and the contrast becomes the argument.
    topic_code: "7.A"
  - front: Parallelism → what it does for tone and meaning
    back: |
      Repeating a grammatical pattern across a series. It shows that the items belong together, creates rhythm, and can build to a climax. In a grave essay it sounds measured and authoritative; in satire it can make a list of faults sound like a formal indictment.
    topic_code: "7.A"
  - front: Balanced sentence → why it is called Johnsonian
    back: |
      A sentence in two halves of matching structure, often weighing one idea against another. Johnson used it so often and so well that “Johnsonian” now names a style of formal, balanced, Latinate prose.
    topic_code: "7.A"
  - front: Comparisons in skill 7.A → what counts
    back: |
      Similes, metaphors, analogies, personification and allusions. A 7.A question asks what a comparison suggests about the subject and how it shapes the tone, not just what kind of figure it is.
    topic_code: "7.A"
  - front: Rambler No. 134 → procrastination personified as an enemy
    back: |
      Delay is “the most pertinacious of their passions, always renewing its attacks, and though often vanquished, never destroyed.” The military language makes resisting procrastination a lifelong campaign, which suits the essay's earnest, admonishing tone.
    topic_code: "7.A"
  - front: Rambler No. 134 → the Tantalus allusion
    back: |
      Tantalus, punished in myth with fruit that retreats from his hand, deserves some pity. The idle, who will not even lift their hands, deserve less. The allusion sharpens Johnson's judgment by showing that their suffering is self-imposed.
    topic_code: "7.A"
  - front: Rambler No. 134 → "vis inertiae"
    back: |
      Latin for “the force of inertia,” a term from physics, which Johnson glosses as “the mere repugnance to motion.” Borrowing a scientific term makes laziness sound like a law of nature that must be deliberately overcome.
    topic_code: "7.A"
  - front: Samuel Johnson → who he was
    back: |
      English writer (1709-1784): essayist, poet, critic, biographer and author of A Dictionary of the English Language (1755). The most quoted English man of letters of the eighteenth century, and the subject of Boswell's famous Life.
    topic_code: "7.A"
  - front: The Rambler → what it was
    back: |
      A periodical of essays Johnson wrote almost single-handed, published twice a week from 1750 to 1752 (208 numbers). Its subjects are moral: ambition, envy, idleness, hope, the conduct of life. Its style is grave and elaborate.
    topic_code: "7.A"
  - front: The Idler → what it was
    back: |
      A series of 103 essays Johnson contributed to a London weekly newspaper from 1758 to 1760. Shorter and lighter than The Rambler, often ironic, sometimes satirical, as in its attack on news-writers in No. 30.
    topic_code: "7.A"
  - front: Rambler No. 134 → how its opening sets the tone
    back: |
      Johnson begins with himself, idling over which subject to choose until “a summons from the press” forces him to write. Admitting his own procrastination makes the moral lesson that follows sound earned rather than superior.
    topic_code: "1.B"
  - front: Rambler No. 134 → the work done by "we" and "our"
    back: |
      Johnson writes “we readily believe,” “Our firmness,” “our own cowardice.” The first-person plural includes him in the weakness he condemns, which keeps the gravity from becoming a lecture and invites the reader's agreement.
    topic_code: "1.B"
  - front: Rambler No. 134 → "Thus life is languished away ..." → the effect of its series
    back: |
      A string of parallel phrases (“in collecting resolutions ... in forming purposes ... and reconciling ourselves”) piles up the small, repeated failures of the procrastinator. The syntax enacts the cycle it describes.
    topic_code: "7.A"
  - front: Idler No. 30 → its subject and occasion
    back: |
      The multiplying newspapers of 1758, in the middle of the Seven Years' War. Johnson argues that war corrupts the love of truth, and that news-writers profit from that corruption.
    topic_code: "7.A"
  - front: Idler No. 30 → Wotton's definition and Johnson's inversion
    back: |
      Johnson recalls Sir Henry Wotton's joke defining an ambassador as “a man of virtue sent abroad to tell lies for the advantage of his country.” Johnson inverts each term for the news-writer: “a man without virtue, who writes lies at home for his own profit.” The parallel twist turns a joke into an indictment.
    topic_code: "7.A"
  - front: Idler No. 30 → the ironic job description
    back: |
      The work requires “neither genius nor knowledge, neither industry nor sprightliness; but contempt of shame and indifference to truth are absolutely necessary.” The form of a list of qualifications, filled with vices, produces mock solemnity and scorn.
    topic_code: "7.A"
  - front: Idler No. 30 → its closing comparison
    back: |
      Johnson does not know whether more is to be feared “from streets filled with soldiers accustomed to plunder, or from garrets filled with scribblers accustomed to lie.” The exact parallel puts writers on a level with plunderers.
    topic_code: "7.A"
  - front: Tone shift → how to spot one
    back: |
      Look for a turn word (but, yet, still), a change in diction (from formal to plain, from neutral to loaded), a change in sentence length, or a move from general to personal. Then describe both tones and the reason for the turn.
    topic_code: "7.A"
  - front: Tone words for irony and satire
    back: |
      Wry, sardonic, scathing, mocking, mock-solemn, derisive, contemptuous, incredulous. Choose by degree: wry is mild amusement, scathing is severe.
    topic_code: "7.A"
  - front: Tone words for gravity and earnestness
    back: |
      Solemn, earnest, grave, admonitory, contemplative, measured, reproachful, sympathetic. Johnson's Rambler voice is usually grave and admonitory, softened by self-inclusion.
    topic_code: "7.A"
  - front: AP style question stem → "The diction in the sentence primarily serves to"
    back: |
      Answer with the effect: what attitude or impression the words create, and how it serves the argument. Wrong answers often name a real feature with the wrong effect, or an effect the words do not support.
    topic_code: "7.A"
  - front: Writing about style → the sentence to avoid
    back: |
      *The author uses diction and syntax to create tone.* It names categories and says nothing. Instead quote the words, name the pattern, and state the attitude it conveys and why that attitude helps the argument.
    topic_code: "7.A"

quiz:
  description: |
    24 questions · about 40 minutes · an eight-question set on Johnson's Rambler No. 134, a four-question set on
    his Idler No. 30, a five-question revision set on a student editorial, then questions on diction, syntax and
    tone. About three in ten items return to earlier skills: audience (1.B), organization and transitions (5.B,
    6.B), line of reasoning and commentary (5.A, 6.A) and claims with evidence (4.A). Multiple choice, select-all
    and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the paragraph are graded by your teacher against the model answers and scoring notes.
  questions:
    # ---- Passage set A: Rambler No. 134, on procrastination
    - slug: u05-w17-q01
      type: multiple_choice
      topic_code: "7.A"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751)'
      points: 1
      stimulus: &rambler134 |
        *The following passage is from Samuel Johnson's essay in* The Rambler, *No. 134 (June 29, 1751). Johnson has just described putting off the writing of this very essay until the printer demanded it.*

        The folly of allowing ourselves to delay what we know cannot be finally escaped, is one of the general weaknesses, which, in spite of the instruction of moralists, and the remonstrances of reason, prevail to a greater or less degree in every mind; even they who most steadily withstand it, find it, if not the most violent, the most pertinacious of their passions, always renewing its attacks, and though often vanquished, never destroyed.

        It is indeed natural to have particular regard to the time present, and to be most solicitous for that which is by its nearness enabled to make the strongest impressions. When therefore any sharp pain is to be suffered, or any formidable danger to be incurred, we can scarcely exempt ourselves wholly from the seducements of imagination; we readily believe that another day will bring some support or advantage which we now want; and are easily persuaded, that the moment of necessity which we desire never to arrive, is at a great distance from us.

        Thus life is languished away in the gloom of anxiety, and consumed in collecting resolutions which the next morning dissipates; in forming purposes which we scarcely hope to keep, and reconciling ourselves to our own cowardice by excuses, which, while we admit them, we know to be absurd.

        [...]

        To act is far easier than to suffer; yet we every day see the progress of life retarded by the *vis inertiae*, the mere repugnance to motion, and find multitudes repining at the want of that which nothing but idleness hinders them from enjoying. The case of Tantalus, in the region of poetick punishment, was somewhat to be pitied, because the fruits that hung about him retired from his hand; but what tenderness can be claimed by those who, though perhaps they suffer the pains of Tantalus, will never lift their hands for their own relief?
      prompt: |
        The tone of the passage is best described as
      options:
        - |
          lighthearted and teasing, treating delay as a harmless quirk
        - |
          grave and admonitory, though tempered by sympathy for a weakness the writer shares
        - |
          detached and clinical, reporting a habit without judging it
        - |
          bitter and despairing, convinced that no one can overcome delay
      option_explanations:
        - |
          Johnson calls delay a “folly,” a source of “the gloom of anxiety” and of “our own cowardice.” That is moral seriousness, not teasing.
        - |
          Correct. Words like “folly,” “cowardice” and “absurd” judge the habit severely, yet “we” and “ourselves” include Johnson among the guilty, and he grants that it is “natural” to favor the present. The tone warns without sneering.
        - |
          A clinical report would not call excuses “absurd” or ask what “tenderness” the idle deserve. Johnson judges in nearly every sentence.
        - |
          The passage admits delay is persistent but not unbeatable: it is “often vanquished,” and the final question implies the idle could “lift their hands for their own relief.” That is reproach, not despair.
      answer: 1
      explanation: |
        A precise tone answer often joins two attitudes. Here the diction supplies the gravity and the pronouns supply the sympathy.

    - slug: u05-w17-q02
      type: multiple_choice
      topic_code: "7.A"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751)'
      points: 1
      stimulus: *rambler134
      prompt: |
        The diction of the first two paragraphs (“remonstrances,” “pertinacious,” “solicitous,” “seducements”) primarily serves to
      options:
        - |
          make the essay easier for a wide popular audience to follow
        - |
          show off Johnson's learning at the expense of his argument
        - |
          suggest that procrastination is a problem only for the highly educated
        - |
          treat an everyday habit with the formality and weight of a serious moral subject
      option_explanations:
        - |
          Long Latinate words make prose harder, not easier, for a general reader. Their effect lies elsewhere.
        - |
          The words serve the argument: each names a precise force (a reproof, a stubbornness, an anxious care, a temptation). Calling them display ignores what they do.
        - |
          The passage says delay prevails “in every mind.” The vocabulary is elevated, but the claim is universal.
        - |
          Correct. Latinate, abstract diction lends dignity and gravity. By describing delay in the vocabulary of moral philosophy, Johnson insists that putting things off is a matter of character, not convenience.
      answer: 3
      explanation: |
        For a diction question, name the quality the words share (here: formal, Latinate, abstract) and then the effect of that quality on how the reader regards the subject.

    - slug: u05-w17-q03
      type: multiple_choice
      topic_code: "7.A"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751)'
      points: 1
      stimulus: *rambler134
      prompt: |
        The syntax of the third paragraph (“Thus life is languished away ...”) contributes to its meaning chiefly by
      options:
        - |
          piling up parallel phrases (“in collecting resolutions,” “in forming purposes,” “reconciling ourselves”) that enact the endless, repeated cycle of resolving and failing
        - |
          using short, abrupt sentences that mimic sudden decisive action
        - |
          placing the main clause at the very end to create suspense about the outcome
        - |
          asking a series of questions that the reader must answer
      option_explanations:
        - |
          Correct. One long sentence keeps adding another “in ...ing” phrase, as the procrastinator keeps adding another resolution. The structure imitates the waste it describes.
        - |
          The paragraph is a single long sentence. Its length suggests drawn-out futility, the opposite of decisive action.
        - |
          The main clause (“Thus life is languished away”) comes first, and the phrases trail after it. This is a cumulative sentence, not a periodic one.
        - |
          The paragraph contains no questions. The rhetorical question comes later, in the Tantalus sentence.
      answer: 0
      explanation: |
        Syntax can enact meaning. When a sentence's shape matches its content (a sprawling sentence about sprawling waste), say so and explain the match.

    - slug: u05-w17-q04
      type: multiple_choice
      topic_code: "7.A"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751)'
      points: 1
      stimulus: *rambler134
      prompt: |
        In the first paragraph, the description of delay as “always renewing its attacks, and though often vanquished, never destroyed” presents procrastination as
      options:
        - |
          a disease that can be cured once and for all
        - |
          a friend who offers comfort in hard times
        - |
          a persistent enemy that must be fought again and again
        - |
          a law of nature that no one should resist
      option_explanations:
        - |
          “Never destroyed” rules out a permanent cure. The image is of a recurring struggle.
        - |
          Nothing in the language is friendly: “attacks” and “vanquished” belong to war, not companionship.
        - |
          Correct. The military language personifies procrastination as a foe that returns after every defeat, which supports Johnson's view that resisting it is a lifelong duty.
        - |
          Johnson praises those who “most steadily withstand it.” Resistance is the point, so the comparison cannot mean we should yield.
      answer: 2
      explanation: |
        Comparisons are part of 7.A. Identify the field the words come from (war, sickness, money, nature) and say what that field implies about the subject.

    - slug: u05-w17-q05
      type: multi_select
      topic_code: "7.A"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751)'
      points: 2
      partial_credit: true
      stimulus: *rambler134
      prompt: |
        Which TWO features of the passage most clearly contribute to its formal, balanced style? Select two.
      options:
        - |
          Antithesis in a short, symmetrical sentence: “To act is far easier than to suffer”
        - |
          Paired phrases of matching shape, such as “the instruction of moralists, and the remonstrances of reason”
        - |
          Slang and contractions that create a conversational voice
        - |
          Sentence fragments that break the passage into quick bursts
      option_explanations:
        - |
          Correct. Two opposed infinitives balanced on “is far easier than” give the thought the weight and memorability of a maxim.
        - |
          Correct. Each phrase is “the” plus a noun plus “of” plus a noun; the matching halves create the measured rhythm associated with Johnson.
        - |
          There is no slang and no contraction anywhere in the passage. The diction is consistently elevated.
        - |
          Every sentence is complete, and most are long. The style is measured, not choppy.
      answer: [0, 1]
      explanation: |
        Balance comes from parallel structure (matching phrases) and antithesis (opposites in matching form). Both are signatures of Johnson's prose.

    - slug: u05-w17-q06
      type: true_false
      topic_code: "1.B"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751)'
      points: 1
      stimulus: *rambler134
      prompt: |
        True or false: in this passage Johnson exempts himself from the weakness he describes and addresses readers as their moral superior.
      answer: false
      explanation: |
        False. Johnson writes “we can scarcely exempt ourselves,” “we readily believe,” “our own cowardice.” The first-person plural includes him among the guilty, and the essay opens with his own delay in writing it. Sharing the fault is a way of reaching an audience that would resent a lecture (skill 1.B).

    - slug: u05-w17-q07
      type: multiple_choice
      topic_code: "5.B"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751)'
      points: 1
      stimulus: *rambler134
      prompt: |
        The word “Thus” at the start of the third paragraph signals that the paragraph
      options:
        - |
          introduces an exception to the claim of the second paragraph
        - |
          describes the consequence of the habit of mind explained in the second paragraph
        - |
          begins a new subject unrelated to what has come before
        - |
          offers a specific example from Johnson's own life
      option_explanations:
        - |
          Nothing is excepted. The third paragraph extends the second; an exception would be marked by “but” or “yet.”
        - |
          Correct. The second paragraph explains why we believe “another day will bring some support”; “Thus” introduces what that belief costs: a life “languished away” in resolutions never kept.
        - |
          The subject stays the same: the habit of delay and its effects. “Thus” links rather than breaks.
        - |
          The paragraph speaks of “life” and “we,” not of Johnson's own experience. It generalizes rather than illustrates.
      answer: 1
      explanation: |
        Transitions (5.B, 6.B from week 16) work the same way in eighteenth-century prose: “Thus” marks a result. Reading the connective tells you how the paragraphs are organized.

    - slug: u05-w17-q08
      type: multiple_choice
      topic_code: "7.A"
      source: 'Samuel Johnson, The Rambler, No. 134 (1751)'
      points: 1
      stimulus: *rambler134
      prompt: |
        The allusion to Tantalus in the final sentence primarily serves to
      options:
        - |
          suggest that the idle are victims of forces beyond their control
        - |
          add a light classical joke to relieve the essay's seriousness
        - |
          show that Johnson doubts the value of ancient stories
        - |
          sharpen Johnson's reproach, since Tantalus could not reach his fruit while the idle simply refuse to lift their hands
      option_explanations:
        - |
          The comparison works the other way: Tantalus was a victim, and the idle are not. They “will never lift their hands for their own relief.”
        - |
          The rhetorical question (“what tenderness can be claimed”) is pointed, not playful. The allusion intensifies the judgment.
        - |
          Johnson uses the myth respectfully, as a recognized image of suffering. He doubts the idle, not the story.
        - |
          Correct. Tantalus was “somewhat to be pitied” because the fruit “retired from his hand.” The idle suffer similar pains with relief in reach, so they deserve less pity. The contrast makes the reproach precise.
      answer: 3
      explanation: |
        An allusion is a comparison with a famous story. Ask how the present case resembles it and how it differs; here the difference carries the argument.

    # ---- Passage set B: Idler No. 30, on news-writers
    - slug: u05-w17-q09
      type: multiple_choice
      topic_code: "7.A"
      source: 'Samuel Johnson, The Idler, No. 30 (1758)'
      points: 1
      stimulus: &idler30 |
        *The following passage is from Samuel Johnson's essay in* The Idler, *No. 30 (November 11, 1758), written during the Seven Years' War between Britain and France.*

        No species of literary men has lately been so much multiplied as the writers of news. Not many years ago the nation was content with one gazette; but now we have not only in the metropolis papers for every morning and every evening, but almost every large town has its weekly historian, who regularly circulates his periodical intelligence, and fills the villages of his district with conjectures on the events of war, and with debates on the true interest of Europe.

        To write news in its perfection requires such a combination of qualities, that a man completely fitted for the task is not always to be found. In Sir Henry Wotton's jocular definition, *An ambassador* is said to be *a man of virtue sent abroad to tell lies for the advantage of his country*; a news-writer is *a man without virtue, who writes lies at home for his own profit*. To these compositions is required neither genius nor knowledge, neither industry nor sprightliness; but contempt of shame and indifference to truth are absolutely necessary.

        [...]

        In a time of war the nation is always of one mind, eager to hear something good of themselves and ill of the enemy. At this time the task of news-writers is easy: they have nothing to do but to tell that a battle is expected, and afterwards that a battle has been fought, in which we and our friends, whether conquering or conquered, did all, and our enemies did nothing.

        [...]

        Among the calamities of war may be justly numbered the diminution of the love of truth, by the falsehoods which interest dictates, and credulity encourages. A peace will equally leave the warriour and relater of wars destitute of employment; and I know not whether more is to be dreaded from streets filled with soldiers accustomed to plunder, or from garrets filled with scribblers accustomed to lie.
      prompt: |
        Johnson's attitude toward the writers of news is best described as
      options:
        - |
          admiring of their skill in gathering information quickly
        - |
          neutral, since he only reports how many papers exist
        - |
          scornful, expressed through irony and pointed comparison
        - |
          anxious that they will soon lose their livelihood
      option_explanations:
        - |
          The only “qualities” Johnson grants them are “contempt of shame and indifference to truth.” Any praise is ironic.
        - |
          The opening count of papers is soon followed by a mock definition, a list of vices posing as qualifications and a comparison to plundering soldiers. Nothing about that is neutral.
        - |
          Correct. Johnson mocks news-writers through an inverted definition, an ironic list of job requirements and a final parallel that ranks them with looters. The tone is scornful wit.
        - |
          Johnson does note that peace will leave them “destitute of employment,” but as a danger to the public, not a cause for sympathy.
      answer: 2
      explanation: |
        Irony shows attitude by saying one thing and meaning its opposite: “such a combination of qualities” sounds like praise until the qualities are named.

    - slug: u05-w17-q10
      type: multiple_choice
      topic_code: "7.A"
      source: 'Samuel Johnson, The Idler, No. 30 (1758)'
      points: 1
      stimulus: *idler30
      prompt: |
        The definition of a news-writer as “a man without virtue, who writes lies at home for his own profit” gains its force mainly from
      options:
        - |
          its point-by-point inversion of Wotton's definition of an ambassador, which makes the news-writer worse at every step
        - |
          its use of specialized legal vocabulary
        - |
          its appeal to statistics about false reports
        - |
          its long periodic structure, which delays the key word
      option_explanations:
        - |
          Correct. “Man of virtue” becomes “man without virtue,” “sent abroad” becomes “at home,” “for the advantage of his country” becomes “for his own profit.” The ambassador at least lies for his nation; the news-writer lies for himself.
        - |
          Every word in the definition is ordinary. Its power comes from its relation to Wotton's sentence, not from technical terms.
        - |
          There are no numbers or data in the passage. The attack works through wit, not evidence of that kind.
        - |
          The definition is short and its parts are balanced, not delayed. Its effect depends on matching Wotton's sentence piece by piece.
      answer: 0
      explanation: |
        Parallel structure is a comparison tool: when two sentences share a shape, the differences jump out. Johnson borrows Wotton's form so that every change counts against the news-writer.

    - slug: u05-w17-q11
      type: multiple_choice
      topic_code: "7.A"
      source: 'Samuel Johnson, The Idler, No. 30 (1758)'
      points: 1
      stimulus: *idler30
      prompt: |
        The sentence “To these compositions is required neither genius nor knowledge, neither industry nor sprightliness; but contempt of shame and indifference to truth are absolutely necessary” creates its tone chiefly by
      options:
        - |
          admitting that news-writing is harder than other kinds of writing
        - |
          shifting suddenly into casual slang
        - |
          listing real virtues that news-writers possess in abundance
        - |
          borrowing the solemn form of a list of qualifications and filling it with vices, so that “absolutely necessary” sounds mock-serious
      option_explanations:
        - |
          The sentence says the work needs no genius, knowledge or industry. It calls news-writing easy, not hard.
        - |
          The diction stays formal throughout. The irony comes from the mismatch between formal structure and shameful content.
        - |
          The virtues named are the ones news-writers do not need. The only qualities required are vices.
        - |
          Correct. Balanced “neither ... nor” pairs dismiss the real virtues, and “but” introduces the true requirements: shamelessness and indifference to truth. The grave phrasing of a job description makes the contempt sharper.
      answer: 3
      explanation: |
        Mock solemnity is a common satirical tone: formal syntax and diction applied to an unworthy subject. The gap between manner and matter is the joke, and the judgment.

    - slug: u05-w17-q12
      type: multiple_choice
      topic_code: "5.A"
      source: 'Samuel Johnson, The Idler, No. 30 (1758)'
      points: 1
      stimulus: *idler30
      prompt: |
        The final paragraph contributes to the line of reasoning of the passage primarily by
      options:
        - |
          retracting the earlier criticism of news-writers
        - |
          widening the attack from individual liars to a general claim that war damages the love of truth, and ending on a comparison that ranks lying writers with plundering soldiers
        - |
          introducing an unrelated argument about the economic effects of peace
        - |
          proposing a law to limit the number of newspapers
      option_explanations:
        - |
          The last paragraph intensifies the criticism. Nothing is withdrawn.
        - |
          Correct. The paragraph moves from the habits of news-writers to a general claim (“the diminution of the love of truth”) and closes with the parallel of soldiers “accustomed to plunder” and scribblers “accustomed to lie,” which gives the argument its climax.
        - |
          Peace is mentioned only as the moment when both soldiers and writers lose their work. The point is still about truth.
        - |
          No remedy is proposed. Johnson diagnoses and condemns; he does not legislate.
      answer: 1
      explanation: |
        Line of reasoning (5.A) asks how a part serves the whole. A closing paragraph often generalizes the claim and ends on its strongest image.

    # ---- Passage set C: revision of a student editorial
    - slug: u05-w17-q13
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: &w17_draft |
        *The following is a draft of an editorial a student is writing for the school newspaper, urging the school board not to cut the art program.*

        (1) Every spring the school board looks for places to cut, and this year it has its eye on the art program. (2) Cutting it would be a huge mistake, like seriously. (3) Art classes are among the few courses in which students make something from nothing and then defend their choices to a room of critics. (4) Last year 160 students took at least one art course. (5) In a survey by the art club, 58 of those students said art was the class that most made them want to come to school. (6) The board says the program costs $48,000 a year. (7) That is less than one percent of the district's budget. (8) The board should not trade a program that keeps students in school for a saving no one will notice.
      prompt: |
        The writer wants to revise sentence 2 so that its tone matches the serious, persuasive tone of the rest of the editorial. Which version best accomplishes this goal?
      options:
        - |
          Cutting it would be a huge mistake, like seriously, you guys.
        - |
          Cutting it would be a mistake, I guess, but who knows.
        - |
          Cutting it would be a mistake, and one the district would not easily undo.
        - |
          Cutting it would be the single most catastrophic decision in the history of public education.
      option_explanations:
        - |
          Adding more slang makes the mismatch worse. The rest of the editorial addresses the board in a measured, formal voice.
        - |
          Hedging this much (“I guess,” “who knows”) abandons the claim. The editorial needs a confident, serious statement of its position.
        - |
          Correct. The revision keeps the claim, drops the slang, and adds a reason for concern (the cut would be hard to reverse) in a tone that matches sentences 3 to 8.
        - |
          Wild exaggeration costs credibility with a board that will see the budget numbers in sentence 7. The tone becomes melodramatic rather than serious.
      answer: 2
      explanation: |
        Tone in revision questions means consistency with the writer's purpose and audience. Eliminate options that are too casual, too timid or too extreme for the rest of the piece.

    - slug: u05-w17-q14
      type: multiple_choice
      topic_code: "6.B"
      source: written for this course
      points: 1
      stimulus: *w17_draft
      prompt: |
        The writer wants to begin sentence 7 with a transitional word that shows its relationship to sentence 6. Which choice best accomplishes this goal?
      options:
        - |
          But
        - |
          For example,
        - |
          Similarly,
        - |
          First,
      option_explanations:
        - |
          Correct. Sentence 6 gives the board's figure as an argument for cutting; sentence 7 pushes back by putting it in proportion. A contrast transition marks that turn.
        - |
          Sentence 7 is not an instance of sentence 6; it reframes the number. An example transition misstates the relationship.
        - |
          “Similarly” would mean sentence 7 makes a parallel point in support of cutting, which reverses the writer's meaning.
        - |
          “First” would begin a sequence that never continues and does not reflect the reply to the board's figure.
      answer: 0
      explanation: |
        Week 16's routine applies: name the relationship (objection, then reply) before choosing the transition.

    - slug: u05-w17-q15
      type: multiple_choice
      topic_code: "6.A"
      source: written for this course
      points: 1
      stimulus: *w17_draft
      prompt: |
        The writer wants to add a sentence after sentence 5 that explains how the survey result supports the editorial's position. Which sentence best accomplishes this goal?
      options:
        - |
          The art club meets every Thursday after school in room 114.
        - |
          The survey asked several other questions as well.
        - |
          Many other schools also have art programs.
        - |
          For students who might otherwise drift away from school, a single class can be the reason to show up, and cutting it puts that reason at risk.
      option_explanations:
        - |
          The meeting time and room add detail but no commentary. They do not connect the survey to the argument.
        - |
          The other survey questions are irrelevant unless the writer reports and explains them. This sentence explains nothing.
        - |
          A comparison with other schools might be new evidence, but it does not interpret the survey already given.
        - |
          Correct. The sentence explains why the number matters: the program keeps some students attending, so cutting it costs more than money. That is commentary linking evidence to claim.
