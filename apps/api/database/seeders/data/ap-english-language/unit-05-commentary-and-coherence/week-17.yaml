    - slug: u05-w17-q16
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: *w17_draft
      prompt: |
        The writer wants to add evidence that directly supports the claim in sentence 3 that art students must “defend their choices to a room of critics.” Which piece of evidence would best accomplish this goal?
      options:
        - |
          The art room was painted last summer.
        - |
          Every art course ends each unit with a critique, in which each student presents a piece and answers questions from classmates about the choices behind it.
        - |
          Famous artists have often struggled to sell their work.
        - |
          Some students take art because their friends are in the class.
      option_explanations:
        - |
          The condition of the room says nothing about how students present or defend their work.
        - |
          Correct. A regular critique in which students explain and defend their choices is direct evidence for exactly the claim made in sentence 3.
        - |
          Professional artists' finances have no bearing on what happens in the school's classes.
        - |
          Why students enroll does not show that the classes require them to defend their choices.
      answer: 1
