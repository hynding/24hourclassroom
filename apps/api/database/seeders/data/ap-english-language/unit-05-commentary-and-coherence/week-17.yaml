    - slug: u05-w17-q17
      type: multi_select
      topic_code: "6.B"
      source: written for this course
      points: 2
      partial_credit: true
      stimulus: *w17_draft
      prompt: |
        Which TWO revisions would most improve the way the editorial guides the reader through its reasoning? Select two.
      options:
        - |
          Beginning sentence 4 with “The numbers bear this out:” so that the statistics in sentences 4 and 5 read as support for sentence 3
        - |
          Beginning sentence 8 with “In short,” so that it reads as the conclusion drawn from the evidence about students and cost
        - |
          Moving sentence 1 to the end of the editorial
        - |
          Beginning sentence 3 with “However,” to signal a change of subject
      option_explanations:
        - |
          Correct. The phrase links the claim about what art classes do to the evidence that follows, so the reader sees the numbers as proof rather than a new topic.
        - |
          Correct. Sentence 8 is the editorial's conclusion. A summary transition tells the board that the writer is gathering the reasons into a final recommendation.
        - |
          Sentence 1 sets out the situation the editorial responds to. Moved to the end, it would leave the opening without context.
        - |
