    - slug: u05-w16-q20
      type: true_false
      topic_code: "6.B"
      source: general knowledge
      points: 1
      prompt: |
        True or false: the more transitional words a paragraph contains, the more coherent it is.
      answer: false
      explanation: |
        False. Transitions help only when they name the right relationship and appear where the link is not already obvious. A transition on every sentence clutters the prose, and a wrong one (“however” between two sentences that agree) damages coherence. Bacon's dense essays use very few.

    - slug: u05-w16-q21
      type: short_answer
      topic_code: "5.B"
      source: 'Francis Bacon, "Of Studies," Essays (1625)'
      points: 2
      prompt: |
        In one or two sentences, explain how Bacon's repetition of the word “studies” (and of the pronouns “they,” “them” and “their” that point back to it) helps hold the opening of “Of Studies” together.
      answer: |
        Almost every sentence returns to studies, either by name (“Studies,” “studies themselves”) or by a pronoun (“Their chief use,” “They perfect nature,” “wise men use them”). Because the subject never changes, the reader can take each new maxim as one more claim about the same thing, so the paragraph coheres even though Bacon uses very few transition words.
      explanation: |
        1 point: accurate reference to the repetition (the word itself or the pronoun chain, with at least one example). 1 point: explanation of the effect on coherence: the reader stays on one subject, each sentence is linked to the last, the repetition substitutes for connectives. A response that only lists the repetitions earns 1.

    - slug: u05-w16-q22
      type: short_answer
      topic_code: "6.B"
      source: written for this course
      points: 2
      prompt: |
        Here are two sentences from a student's draft:

        > *The town closed two of its three public pools last summer. Emergency rooms reported more heat-related visits from children.*

        Join or link the sentences with a transitional element that states the relationship the evidence can actually support. Then, in one sentence, explain why you chose it.
      answer: |
        *The town closed two of its three public pools last summer; in the same months, emergency rooms reported more heat-related visits from children.* I chose a time transition rather than “as a result” because the two facts happened together, but the draft gives no evidence that the closures caused the visits; a causal transition would make a claim the paragraph has not proved. (A response that uses “as a result” or “so” earns full credit only if it adds or points to evidence of cause.)
      explanation: |
        1 point: a grammatical revision with a transitional element that names a relationship (time, contrast, cause, addition). 1 point: an explanation that matches the transition to what the evidence supports, recognizing that a cause-and-effect transition asserts a causal claim. A response that chooses a causal transition without noticing the commitment earns 1.

    - slug: u05-w16-q23
      type: long_answer
      topic_code: "6.B"
      source: 'Francis Bacon, "Of Studies," Essays (1625)'
      points: 4
      prompt: |
        Write one well-developed analytical paragraph (about 150-200 words) that makes a claim about how Bacon organizes the opening of “Of Studies” so that a very dense passage remains easy to follow. Support your claim with at least two short quotations from different parts of the passage, explain how each one supports your claim, and use at least two transitional elements of your own that show different relationships between your ideas (for example contrast and cause).
      answer: |
        Claim: Bacon keeps a crowded passage clear by building it out of matching sets of three, so that each new list tells the reader where it belongs. Evidence 1: the opening names three uses, “for delight, for ornament, and for ability,” and the second sentence locates each in the same order. Commentary: because the order repeats, the reader holds a map before the details arrive. Evidence 2: the misuses (“sloth,” “affectation,” “the humor of a scholar”) mirror the uses one by one. Commentary: the second triad answers the first, so Bacon can move from praise to warning without a single transition word; the parallel shape itself does the linking. Transitions in the response: “because” (cause), “yet” or “however” (contrast), “as a result.” Concluding link: in an essay this short, structure replaces explanation.
      explanation: |
        4 points. Claim (1): an arguable claim about how the organization creates coherence, not a summary of what Bacon says. Evidence (1): at least two accurate, short quotations from different parts of the passage, introduced smoothly. Commentary (1): explains how each quotation shows the organizing device (preview, parallel triads, restatement, repeated subject) and why it helps a reader follow. Transitions (1): at least two transitional elements of the writer's own that correctly name different relationships (cause, contrast, example, summary); “also” and “another” alone do not earn this point.
