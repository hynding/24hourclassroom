week: 16
unit: 5
title: Organization and Transitions in Bacon's Essays
topics: ["5.B", "6.B"]
texts:
  - author: Francis Bacon
    title: "The Essays or Counsels, Civil and Moral (\"Of Studies\", \"Of Revenge\")"
    year: 1625
    url: https://www.gutenberg.org/ebooks/575
guide: guides/week-16.md
guide_description: |
  How an argument holds together. Unity and coherence, the job of a topic sentence, the common orders of a
  paragraph and an essay, and the transitional elements (words, phrases, repeated terms and whole sentences)
  that tell a reader how one idea relates to the next. Francis Bacon's “Of Studies” and “Of Revenge” (1625) as
  case studies in density without confusion: triads, connectives and restatements doing the work of whole
  paragraphs. Then a revision lesson on a student draft, common mistakes, the exam's revision questions and a
  self-check.
flashcards_description: |
  30 cards on unity and coherence, kinds of transitions and what each commits a writer to, paragraph order,
  the revision questions on transitions and placement, and the sentences of Bacon's “Of Studies” and “Of
  Revenge”.

flashcards:
  - front: Unity vs coherence in an argument
    back: |
      Unity: every sentence serves the paragraph's claim, and every paragraph serves the thesis. Coherence: the reader can follow how each sentence connects to the one before it. A paragraph can be unified (all on topic) and still incoherent (the links are missing).
    topic_code: "5.B"
  - front: Coherence → the three tools that create it
    back: |
      Transitional words and phrases (however, as a result), repeated key terms and their pronouns or synonyms, and a logical order (each sentence building on what the last one established). Good writers use all three, not just the first.
    topic_code: "5.B"
  - front: Transitional elements → the main relationships they signal
    back: |
      Addition (moreover), contrast (however, yet), cause and effect (therefore, as a result), example (for instance), restatement (that is, in other words), concession (granted, admittedly), sequence (first, then) and summary (in short). Pick the word for the relationship, not for variety.
    topic_code: "6.B"
  - front: Contrast transitions (however, yet, but, on the other hand) → when to use them
    back: |
      Only when the next sentence pushes against the last one: an exception, an objection, a turn. Using “however” between two sentences that agree confuses the reader about the line of reasoning.
    topic_code: "6.B"
  - front: Cause-and-effect transitions (therefore, so, as a result) → the claim they commit you to
    back: |
      They assert that the second idea follows from the first. That is a claim in its own right, so the evidence must support a causal link, not just two facts that happened together. When you cannot prove cause, use “meanwhile” or “at the same time.”
    topic_code: "6.B"
  - front: Concession transitions (granted, admittedly, to be sure) → what they set up
    back: |
      They admit a point to the other side and promise a reply. A concession transition with no “but” or “yet” to follow leaves the reader wondering whether the writer has given up the argument.
    topic_code: "6.B"
  - front: "“For instance” vs “that is” → example vs restatement"
    back: |
      “For instance” introduces one case of a general claim. “That is” (or “in other words”) says the same claim again in plainer terms. Bacon's “that is, some books are to be read only in parts” is restatement: it turns a metaphor into a literal instruction.
    topic_code: "6.B"
  - front: Summary transitions (in short, in sum, in the end) → when they help
    back: |
      At the end of a paragraph or essay that has laid out several reasons, to signal that the writer is gathering them into one claim. At the start of a paragraph they mislead: nothing has yet been said to sum up.
    topic_code: "6.B"
  - front: Repeating a key term → how it creates coherence
    back: |
      Returning to the same word (or a clear synonym) keeps the reader on one subject and shows that each new sentence is about the same thing. Bacon's “Of Studies” says “studies” or “them” in almost every sentence. Elegant variation (a new word every time) can make readers think the subject has changed.
    topic_code: "5.B"
  - front: Pronoun and synonym chains → coherence without a connective
    back: |
      “Studies ... Their chief use ... They perfect nature ... they teach not their own use.” Each pronoun points back to the subject, linking sentences with no transition word. The chain fails when a pronoun could refer to two things.
    topic_code: "5.B"
  - front: Old-to-new order in a sentence (the known-new contract)
    back: |
      Begin a sentence with something the reader already knows from the last sentence, and end with the new information. The repeated beginning works as a hinge. Drafts that open each sentence with a brand-new subject feel choppy even when every sentence is correct.
    topic_code: "6.B"
  - front: Topic sentence → its job in an organized argument
    back: |
      It states the paragraph's claim and shows how that claim connects to the thesis. Every other sentence in the paragraph should support, explain or qualify it. A topic sentence that only announces a subject (“Now I will discuss cost”) does not do this job.
    topic_code: "5.B"
  - front: Common orders for the body of an argument
    back: |
      Order of importance (often strongest last), problem then solution, cause then effect, claim then objection then reply, general then particular, and chronological. Choose the order that matches the line of reasoning, then let the transitions announce it.
    topic_code: "5.B"
  - front: Order of importance → why many writers save the strongest reason for last
    back: |
      The last reason is the one the reader carries away, so ending on the strongest gives the argument its climax. Some writers open with the strongest instead, to win a sceptical reader early. Either way, the order should be a choice, not an accident.
    topic_code: "5.B"
  - front: A transition sentence between paragraphs → what it should name
    back: |
      Both the idea just proved and the idea coming next, with the relationship between them, for example *Cost is only half the objection; the other half is safety.* It is a small summary plus a promise, not just “Another reason is ...”
    topic_code: "6.B"
  - front: "“Also,” “Another reason,” “Next” → why readers call them list transitions"
    back: |
      They signal only that one more item follows, not how it relates to the others. An argument built on them reads like a list of unconnected points. Revise toward transitions that show cause, contrast, concession or escalation.
    topic_code: "6.B"
  - front: Over-transitioning → the symptom and the cure
    back: |
      Symptom: a connective at the start of every sentence, some of them wrong (“Furthermore, however, ...”). Cure: cut the transitions the order already makes obvious, and keep the ones that mark a turn, a cause or a concession.
    topic_code: "6.B"
  - front: Francis Bacon → who he was and when the Essays appeared
    back: |
      English lawyer, statesman and philosopher (1561-1626), Lord Chancellor under James I and an early champion of experimental science. His Essays appeared in 1597 (ten short pieces), grew in 1612, and reached their final 58 in 1625.
    topic_code: "5.B"
  - front: Bacon's Essays → why they read like strings of maxims
    back: |
      Bacon packed counsel into short, quotable sentences with few connecting words, so that each could be remembered and applied. The coherence is carried by parallel structure, repeated terms and a few strong connectives (For, Therefore, Nay) rather than by long explanation.
    topic_code: "5.B"
  - front: Bacon's "Of Studies" → the three uses of study in its first sentence
    back: |
      “for delight, for ornament, and for ability.” The second sentence takes them up in the same order (privateness and retiring; discourse; judgment and business), so the opening works as a preview of the structure.
    topic_code: "5.B"
  - front: "“Of Studies” → the three misuses that mirror the three uses"
    back: |
      Too much time in studies is “sloth” (delight overdone), too much use for ornament is “affectation,” and judging wholly by their rules is “the humor of a scholar” (ability gone rigid). The second triad answers the first point by point.
    topic_code: "5.B"
  - front: "“Crafty men contemn studies, simple men admire them, and wise men use them” → how the order works"
    back: |
      Three attitudes in parallel clauses, ending on the one Bacon endorses. The last word, “use,” becomes the hinge for the next clause, “for they teach not their own use”: the repeated word links the two thoughts.
    topic_code: "5.B"
  - front: "“Some books are to be tasted, others to be swallowed, and some few to be chewed and digested” → method of development"
    back: |
      Classification: books sorted by how they should be read, made vivid by a comparison to eating. The sentence after it (“that is ...”) restates each class literally.
    topic_code: "5.C"
  - front: "“Reading maketh a full man; conference a ready man; and writing an exact man” → why the verb disappears"
    back: |
      After the first clause the verb “maketh” is left out (ellipsis), so the reader supplies it. The pattern becomes so clear that the sentence can be shorter, and the three activities stand side by side for comparison.
    topic_code: "5.B"
  - front: Bacon's "Of Revenge" → its opening definition
    back: |
      “REVENGE is a kind of wild justice.” The definition concedes that revenge feels like justice, then the adjective “wild” sets up the case against it: justice without law. Everything after is a series of reasons for putting it down.
    topic_code: "5.B"
  - front: "“Of Revenge” → how “Therefore” turns a generalization into a conclusion"
    back: |
      Bacon first claims that no one does wrong for its own sake, only for profit, pleasure or honor. “Therefore why should I be angry with a man, for loving himself better than me?” draws the personal conclusion from that general rule.
    topic_code: "6.B"
  - front: "“Of Revenge” → its line of reasoning"
    back: |
      Not one long proof but a chain of compact, separate reasons: revenge displaces the law; forgiving is nobler; the past cannot be changed; wrongdoers act from self-love; the vengeful keep their own wounds green. Each reason is a short paragraph's worth of argument in one or two sentences.
    topic_code: "5.A"
  - front: Revision question → "Which transition best ..." routine
    back: |
      Read the sentence before and the sentence after. Name the relationship in your own words (contrast? result? example?) before you look at the choices. Then pick the only option that names that relationship; the wrong ones are usually real transitions for a different relationship.
    topic_code: "6.B"
  - front: Revision question → "Where should the writer place sentence N?" routine
    back: |
      Find what sentence N is about and what it refers back to (“this cost,” “these students”). It belongs right after the sentence that introduces that idea. Check that moving it does not leave a gap where it used to be.
    topic_code: "5.B"
  - front: Line of reasoning vs organization (5.A vs 5.B)
    back: |
      Line of reasoning is the logic: which claims support the thesis and how. Organization is the arrangement on the page: the order of those claims and the signals that connect them. A strong argument needs both: good reasons, placed where the reader can follow them.
    topic_code: "5.A"

quiz:
  description: |
    23 questions · about 40 minutes · an eight-question set on the opening of Bacon's “Of Studies,” a three-question
    set on “Of Revenge,” a six-question revision set on a student's draft, then questions on transitions and
    organization. About a third of the items return to earlier skills: thesis (3.B, 4.B), line of reasoning and
    commentary (5.A, 6.A), claims and evidence (3.A) and methods of development (5.C). Multiple choice, select-all
    and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the paragraph are graded by your teacher against the model answers and scoring notes.
  questions:
    # ---- Passage set A: the opening of "Of Studies"
    - slug: u05-w16-q01
      type: multiple_choice
      topic_code: "5.B"
      source: 'Francis Bacon, "Of Studies," Essays (1625)'
      points: 1
      stimulus: &bacon_studies |
        *The following passage is the opening of Francis Bacon's essay “Of Studies,” from the final edition of his* Essays *(1625).*

        STUDIES serve for delight, for ornament, and for ability. Their chief use for delight, is in privateness and retiring; for ornament, is in discourse; and for ability, is in the judgment, and disposition of business. For expert men can execute, and perhaps judge of particulars, one by one; but the general counsels, and the plots and marshalling of affairs, come best, from those that are learned. To spend too much time in studies is sloth; to use them too much for ornament, is affectation; to make judgment wholly by their rules, is the humor of a scholar. They perfect nature, and are perfected by experience: for natural abilities are like natural plants, that need proyning, by study; and studies themselves, do give forth directions too much at large, except they be bounded in by experience. Crafty men contemn studies, simple men admire them, and wise men use them; for they teach not their own use; but that is a wisdom without them, and above them, won by observation. Read not to contradict and confute; nor to believe and take for granted; nor to find talk and discourse; but to weigh and consider. Some books are to be tasted, others to be swallowed, and some few to be chewed and digested; that is, some books are to be read only in parts; others to be read, but not curiously; and some few to be read wholly, and with diligence and attention.

        [...] Reading maketh a full man; conference a ready man; and writing an exact man.
      prompt: |
        The first sentence of the passage (“STUDIES serve for delight, for ornament, and for ability”) functions primarily to
      options:
        - |
          state a view of study that the rest of the passage sets out to refute
        - |
          introduce a personal anecdote about Bacon's own education
        - |
          announce three uses of study that the next sentence then takes up in the same order
        - |
          define study by contrasting it with practical experience
      option_explanations:
        - |
          Bacon never argues against the three uses; he goes on to explain each one and then warns against overdoing them. The opening is a claim he keeps, not a position he attacks.
        - |
          There is no anecdote and no “I” in the passage. Bacon writes in general maxims about “men” and “books,” not about his own schooling.
        - |
          Correct. Delight, ornament and ability return in that order in the second sentence (privateness and retiring; discourse; judgment and business). The first sentence previews the structure, and the second follows the map.
        - |
          Experience enters later (“perfected by experience”), and as a partner to study, not a contrast that defines it. The first sentence names purposes, not a definition.
      answer: 2
      explanation: |
        An opening that names parts in order is a preview. Check whether the next sentences take up the parts in the same order: here they do, so the first sentence organizes everything that follows it.

    - slug: u05-w16-q02
      type: multiple_choice
      topic_code: "5.B"
      source: 'Francis Bacon, "Of Studies," Essays (1625)'
      points: 1
      stimulus: *bacon_studies
      prompt: |
        The word “For” at the start of the third sentence (“For expert men can execute ...”) signals that the sentence will
      options:
        - |
          give the reason behind the claim just made, that study serves ability in “the judgment, and disposition of business”
        - |
          turn to a new subject unrelated to the uses of study
        - |
          concede a point to people who think study is useless
        - |
          begin a chronological account of how a scholar is trained
      option_explanations:
        - |
          Correct. “For” here means “because.” The sentence explains why the learned are better at “the general counsels” of business than experts who judge “particulars, one by one,” which supports the use of study for ability.
        - |
          The sentence stays on the third use, ability in business. Nothing about the subject changes; the connective ties the sentence to the one before it.
        - |
          A concession would grant something to the other side. This sentence grants nothing to critics of study; it argues that learning does what mere expertise cannot.
        - |
          There is no sequence of events here, and “For” is not a time word. The sentence compares two kinds of men, not two stages of training.
      answer: 0
      explanation: |
        Old connectives are worth translating. Bacon's “For” is a causal transition (“because”); reading it as a time word or as a contrast misreads the line of reasoning.

    - slug: u05-w16-q03
      type: multiple_choice
      topic_code: "3.B"
      source: 'Francis Bacon, "Of Studies," Essays (1625)'
      points: 1
      stimulus: *bacon_studies
      prompt: |
        Which of the following best states the overarching claim of the passage?
      options:
        - |
          Study is chiefly an ornament that makes a person pleasant in conversation.
        - |
          Experience is worthless unless it is guided by the rules found in books.
        - |
          Only scholars, and not practical men, are fit to manage public affairs.
        - |
          Study is valuable when it is used with judgment and tempered by experience, and each book should be read in the way its worth deserves.
      option_explanations:
        - |
          Ornament is only one of three uses, and Bacon warns that using study “too much for ornament, is affectation.” This picks out one detail and inflates it into the thesis.
        - |
          Bacon says the reverse of “worthless”: studies themselves give directions “too much at large” unless “bounded in by experience.” Experience corrects books as much as books correct experience.
        - |
          Bacon credits “expert men” with executing and judging particulars, and calls judging “wholly by their rules” a scholar's fault. He wants learning used by the wise, not a government of scholars.
        - |
          Correct. The passage praises study's uses, warns against its misuses, insists it be “perfected by experience,” and ends with advice to “weigh and consider” and to match the manner of reading to the book.
      answer: 3
      explanation: |
        A thesis statement for a whole passage must cover all its main moves. Wrong answers here each seize one sentence; the right one accounts for the uses, the cautions and the advice.

    - slug: u05-w16-q04
      type: multiple_choice
      topic_code: "5.B"
      source: 'Francis Bacon, "Of Studies," Essays (1625)'
      points: 1
      stimulus: *bacon_studies
      prompt: |
        In the sentence beginning “Crafty men contemn studies, simple men admire them, and wise men use them,” the order of the three clauses chiefly serves to
      options:
        - |
          rank the three kinds of men from most to least educated
        - |
          build toward the attitude Bacon endorses, so that the final word “use” leads straight into the next clause about what studies “teach not”
        - |
          show that Bacon holds all three attitudes in equal contempt
        - |
          imitate the order in which a student usually comes to feel about books
      option_explanations:
        - |
          The clauses sort attitudes, not levels of schooling. “Simple men” who admire study may be uneducated, and nothing ranks the crafty as most learned.
        - |
          Correct. The parallel clauses climb from dismissal to admiration to use, and Bacon's preferred attitude comes last. The next clause, “for they teach not their own use,” picks up that very word, so the order also creates a link between the two thoughts.
        - |
          The sentence plainly approves of one group: the wise. Placing “use” last and then explaining it shows endorsement, not contempt for everyone.
        - |
          Nothing suggests a sequence of stages in one reader's life. The three groups are three different kinds of people.
      answer: 1
      explanation: |
        Parallel lists are rarely random. Ask what comes last, and whether the next sentence picks up that last item. Ending on a word and then repeating it is one of the oldest ways to make sentences cohere.

    - slug: u05-w16-q05
      type: multi_select
      topic_code: "5.B"
      source: 'Francis Bacon, "Of Studies," Essays (1625)'
      points: 2
      partial_credit: true
      stimulus: *bacon_studies
      prompt: |
        Which TWO features of the passage most help it hold together as a coherent argument? Select two.
      options:
        - |
          A repeated pattern of three parallel items (delight, ornament and ability; sloth, affectation and the humor of a scholar; tasted, swallowed and digested)
        - |
          Connective words such as “For,” “but” and “that is,” which state how a sentence relates to the one before it
        - |
          A narrative of Bacon's own school days that links the general maxims together
        - |
          Frequent questions addressed directly to the reader
      option_explanations:
        - |
          Correct. The triads answer one another: three uses, then three misuses that mirror them, then three ways of reading. The repeated shape tells the reader that each new list belongs to the same scheme.
        - |
          Correct. Bacon uses few connectives, but the ones he uses carry weight: “For” gives a reason, “but” turns, “that is” restates. They mark the relationships between dense sentences.
        - |
          There is no narrative in the passage and no first person. The coherence comes from pattern and connection, not story.
        - |
          The passage contains no questions at all. Its commands (“Read not to contradict”) address the reader, but as advice, not as questions.
      answer: [0, 1]
      explanation: |
        Coherence comes from more than transition words. Bacon pairs a few precise connectives with a recurring sentence pattern, so the reader always knows where a new sentence fits.

    - slug: u05-w16-q06
      type: true_false
      topic_code: "5.A"
      source: 'Francis Bacon, "Of Studies," Essays (1625)'
      points: 1
      stimulus: *bacon_studies
      prompt: |
        True or false: the line of reasoning in the passage moves from the uses of study, to its misuses, to advice about how to read.
      answer: true
      explanation: |
        True. The first two sentences name and locate the uses; “To spend too much time in studies is sloth” begins the misuses; “Read not to contradict and confute” begins the advice, which continues through the three kinds of books. Seeing this order is what lets a reader summarize the passage in three steps.

    - slug: u05-w16-q07
      type: multiple_choice
      topic_code: "5.C"
      source: 'Francis Bacon, "Of Studies," Essays (1625)'
      points: 1
      stimulus: *bacon_studies
      prompt: |
        The sentence “Some books are to be tasted, others to be swallowed, and some few to be chewed and digested” develops Bacon's point chiefly through
      options:
        - |
          narration of a single episode of reading
        - |
          cause and effect, showing what happens to readers who read badly
        - |
          classification, sorting books into kinds by how they should be read, made vivid by a comparison to eating
        - |
          definition of a single key term
      option_explanations:
        - |
          No event is told and no reader is followed through time. The sentence is general advice about all books.
        - |
          Consequences of bad reading are not described here. The sentence sorts books; it does not trace results.
        - |
          Correct. Books fall into three classes (tasted, swallowed, chewed and digested), and the metaphor of eating makes each class memorable. The literal restatement that follows confirms that the categories are the point.
        - |
          No one term is defined. Three categories are distinguished, which is classification rather than definition.
      answer: 2
      explanation: |
        Methods of development (5.C) still matter in this unit: a classification often supplies the structure of a passage, and a comparison often makes the classes vivid.

    - slug: u05-w16-q08
      type: multiple_choice
      topic_code: "5.B"
      source: 'Francis Bacon, "Of Studies," Essays (1625)'
      points: 1
      stimulus: *bacon_studies
      prompt: |
        The phrase “that is” in “that is, some books are to be read only in parts” primarily serves to
      options:
        - |
          restate the eating metaphor in literal terms, so that the reader cannot mistake the advice
        - |
          introduce an exception to the advice just given
        - |
          signal a contrast with the previous sentence about how to read
        - |
          mark the beginning of a summary of the whole essay
      option_explanations:
        - |
          Correct. Each eating verb gets its literal equivalent: tasted means read “only in parts,” swallowed means read “but not curiously,” chewed and digested means read “wholly, and with diligence and attention.”
        - |
          Nothing is excepted; the same three classes are repeated in plainer words. An exception would need a word like “except” or “unless.”
        - |
          The restatement agrees completely with the sentence before it. Contrast transitions (but, yet, however) would signal a turn.
        - |
          The essay continues well past this point. “That is” restates one sentence; it does not gather the whole argument.
      answer: 0
      explanation: |
        Restatement transitions (“that is,” “in other words”) are coherence devices: they hold a figurative sentence and a literal one together as one idea.

    # ---- Passage set B: "Of Revenge"
    - slug: u05-w16-q09
      type: multiple_choice
      topic_code: "6.B"
      source: 'Francis Bacon, "Of Revenge," Essays (1625)'
      points: 1
      stimulus: &bacon_revenge |
        *The following passage is the first half of Francis Bacon's essay “Of Revenge,” from his* Essays *(1625).*

        REVENGE is a kind of wild justice; which the more man's nature runs to, the more ought law to weed it out. For as for the first wrong, it doth but offend the law; but the revenge of that wrong, putteth the law out of office. Certainly, in taking revenge, a man is but even with his enemy; but in passing it over, he is superior; for it is a prince's part to pardon. And Solomon, I am sure, saith, It is the glory of a man, to pass by an offence. That which is past is gone, and irrevocable; and wise men have enough to do, with things present and to come; therefore they do but trifle with themselves, that labor in past matters. There is no man doth a wrong, for the wrong's sake; but thereby to purchase himself profit, or pleasure, or honor, or the like. Therefore why should I be angry with a man, for loving himself better than me? And if any man should do wrong, merely out of ill-nature, why, yet it is but like the thorn or briar, which prick and scratch, because they can do no other.
      prompt: |
        In context, the word “Therefore” in “Therefore why should I be angry with a man, for loving himself better than me?” signals that the question
      options:
        - |
          introduces a view that contradicts the sentence before it
        - |
          offers an example of a wrong done for its own sake
        - |
          turns to a new reason that has no connection to what precedes it
        - |
          draws a personal conclusion from the general claim that no one does wrong for the wrong's sake, only for profit, pleasure or honor
      option_explanations:
        - |
          The question agrees with the sentence before it and follows from it. A contradiction would be marked by “but” or “yet,” not “Therefore.”
        - |
          The previous sentence denies that anyone does wrong “for the wrong's sake.” The question is not an example of such a wrong; it is a conclusion drawn from its absence.
        - |
          “Therefore” is the opposite of a break: it says the new sentence follows from the old one. The question depends on the generalization about self-love.
        - |
          Correct. If wrongdoers act only to purchase “profit, or pleasure, or honor,” they are simply loving themselves, and the rhetorical question concludes that anger at them makes little sense.
      answer: 3
      explanation: |
        A causal transition commits the writer to a logical link. Test it by turning the two sentences into “Because ..., therefore ...”: here the link holds.

    - slug: u05-w16-q10
      type: multiple_choice
      topic_code: "3.A"
      source: 'Francis Bacon, "Of Revenge," Essays (1625)'
      points: 1
      stimulus: *bacon_revenge
      prompt: |
        The quotation from Solomon (“It is the glory of a man, to pass by an offence”) chiefly serves as
      options:
        - |
          a counterargument that Bacon goes on to refute
        - |
          authoritative support for the claim that a man who passes over a wrong is superior to his enemy
        - |
          an example of a public revenge that turned out well
        - |
          a definition of revenge that replaces the one in the first sentence
      option_explanations:
        - |
          Bacon does not argue with Solomon; he introduces him with “I am sure” and lets the proverb confirm his point. A counterargument would need a reply.
        - |
          Correct. The sentence before it claims that “in passing it over, he is superior.” The proverb adds the weight of scriptural wisdom to that claim, which is how appeals to authority work as evidence.
        - |
          Public revenges come later in the essay (Caesar, Pertinax). The proverb is about forgiving an offence, not avenging one.
        - |
          The definition (“a kind of wild justice”) stands. The proverb describes forgiveness, not revenge.
      answer: 1
      explanation: |
        Claims and evidence (3.A) return here. Identify which claim a piece of evidence supports by reading the sentence just before it.

    - slug: u05-w16-q11
      type: multiple_choice
      topic_code: "5.A"
      source: 'Francis Bacon, "Of Revenge," Essays (1625)'
      points: 1
      stimulus: *bacon_revenge
      prompt: |
        Which of the following best describes the line of reasoning in the passage?
      options:
        - |
          A chronological story of one quarrel, from the first wrong to its resolution
        - |
          A single extended analogy between revenge and gardening
        - |
          A series of compact, separate reasons against private revenge, linked by connectives such as “For,” “Certainly” and “therefore”
        - |
          A comparison of two legal systems, one with revenge and one without
      option_explanations:
        - |
          No particular quarrel is narrated. “The first wrong” is a general case, used to make a point about law.
        - |
          “Weed it out” is a passing metaphor, and the thorn and briar is a single comparison. Neither runs through the passage as its organizing analogy.
        - |
          Correct. Each sentence or pair of sentences gives a new reason (revenge displaces the law; pardoning is princely; the past is gone; wrongdoers act from self-love; ill-nature is like a thorn), and the connectives show how each one relates to the last.
        - |
          Law is mentioned, but no two systems are compared. The passage reasons about individual conduct.
      answer: 2
      explanation: |
        Bacon's line of reasoning is cumulative: many short reasons, each nearly a paragraph's argument in one sentence. Naming that shape is the first step in a rhetorical analysis of his essays.

    # ---- Passage set C: revision of a student draft
