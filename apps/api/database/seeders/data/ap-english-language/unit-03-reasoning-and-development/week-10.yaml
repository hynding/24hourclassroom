week: 10
unit: 3
title: Methods of Development in Wollstonecraft's "Vindication"
topics: ["5.C"]
texts:
  - author: Mary Wollstonecraft
    title: A Vindication of the Rights of Woman
    year: 1792
    url: https://www.gutenberg.org/ebooks/3420
guide: guides/week-10.md
guide_description: |
  The six methods of development (narration, description, comparison, definition, cause and effect, classification)
  and how arguments use them, not as essay types but as tools for a purpose. Mary Wollstonecraft's A Vindication of the
  Rights of Woman (1792) as the case study: a causal argument about education, a flower simile that carries it, a
  comparison between women and soldiers offered as proof, and two pointed redefinitions. Close readings, a revision
  lesson on an invented argument about street trees, common mistakes, the exam link and a self-check.
flashcards_description: |
  30 cards on the six methods of development and their purposes, and on the occasion, audience, claims, comparisons
  and definitions of Wollstonecraft's Vindication.

flashcards:
  - front: Methods of development → the six the AP Language CED names
    back: |
      Narration, description, comparison (and contrast), definition, cause and effect, and classification. Skill 5.C asks you to recognise them in a text and explain what each accomplishes for the writer's purpose.
    hint: N, D, C, D, C-E, C.
    topic_code: "5.C"
  - front: Method of development vs essay type
    back: |
      In this course a method is a tool inside an argument, not a kind of essay. A writer arguing for school reform may narrate one student's day, define "achievement", and compare two districts, all in service of one thesis. Ask what job the method does, not which box the essay fits.
    topic_code: "5.C"
  - front: Narration in an argument → what it does
    back: |
      Tells a sequence of events, often a single case, to make an abstract problem concrete and felt. It wins attention and sympathy; its risk is that one story can be dismissed as unrepresentative, so arguments usually pair it with broader evidence.
    topic_code: "5.C"
  - front: Description in an argument → what it does
    back: |
      Renders a place, person or condition through sensory and concrete detail so the reader sees what the writer wants judged. A described tenement or classroom becomes evidence the reader has witnessed, not just been told about.
    topic_code: "5.C"
  - front: Comparison and contrast in an argument → what it does
    back: |
      Sets two things side by side so that what is true of one illuminates the other, or so that a difference stands out. It is persuasive when the two are alike in the respect that matters; it fails when the likeness is superficial.
    topic_code: "5.C"
  - front: Definition in an argument → what it does
    back: |
      Fixes the meaning of a key or contested term so the argument can rest on it. Writers often redefine: they reject a common meaning and substitute their own, and the new meaning carries the claim.
    topic_code: "5.C"
  - front: Cause and effect in an argument → what it does
    back: |
      Explains how one condition produces another, so the reader sees where a problem comes from and therefore what would fix it. A causal claim needs a mechanism (how the cause works), not just two things that happen together.
    topic_code: "5.C"
  - front: Classification in an argument → what it does
    back: |
      Sorts a subject into kinds or categories, then treats each. It organises a crowded topic and can expose that the opposing side has lumped different things together, or that one category is being ignored.
    topic_code: "5.C"
  - front: Analogy vs comparison
    back: |
      A comparison usually sets two things of the same kind side by side (two schools, two laws). An analogy explains one thing through something of a different kind (government as a machine, a mind as a garden). Both develop an argument; an analogy is judged by whether the likeness holds where the argument needs it.
    topic_code: "5.C"
  - front: Wollstonecraft's Vindication of the Rights of Woman → date and occasion
    back: |
      Published in London in 1792, in the years of the French Revolution. It is dedicated to the French statesman Talleyrand, whose report on public education proposed only a limited, domestic education for girls. Wollstonecraft argues that the rights of man must include women.
    topic_code: "1.A"
  - front: Wollstonecraft's exigence
    back: |
      A revolution was rewriting rights and schooling in France, yet the new proposals and the popular conduct books of the day still trained girls to please rather than to reason. If education was being rethought, women's had to be rethought with it.
    topic_code: "1.A"
  - front: Wollstonecraft's audience
    back: |
      Educated British readers of both sexes, especially the middle class, whom she calls the most natural state; legislators and educators; and the male authors of conduct books whose advice she answers. She addresses women directly as "rational creatures" while arguing with men.
    topic_code: "1.B"
  - front: Wollstonecraft's thesis in one sentence
    back: |
      The weakness and frivolity charged against women are the effects of a false education, not of nature, so women should be educated as rational human beings, which would make them better individuals, wives, mothers and citizens.
    topic_code: "3.B"
  - front: Wollstonecraft's "grand source of the misery"
    back: |
      Her central causal claim, in the first paragraph of the Introduction: "the neglected education of my fellow creatures is the grand source of the misery I deplore." The whole book develops that cause and its effects.
    topic_code: "5.C"
  - front: Wollstonecraft's flowers "planted in too rich a soil"
    back: |
      A simile that carries a cause-and-effect claim: rich soil (flattery and indulgence) produces showy leaves that "fade, disregarded on the stalk" before maturity. Strength and usefulness are sacrificed to beauty. The image makes the effect visible and assigns its cause to cultivation, not to the plant.
    topic_code: "5.C"
  - front: Wollstonecraft's "barren blooming"
    back: |
      Her oxymoron for the result of a false education: flowering that bears no fruit. It compresses the flower simile into two words, and the next clause names the cause: "a false system of education."
    topic_code: "5.C"
  - front: Wollstonecraft's comparison of women and soldiers → its logic
    back: |
      Officers, like women, are "sent into the world before their minds have been stored with knowledge," and they show the same faults: attention to dress, love of dancing, a desire to please. If men with the same education share the same faults, the faults come from education, not from sex. The comparison is offered "as a proof."
    topic_code: "5.C"
  - front: Wollstonecraft's "manners before morals"
    back: |
      Her summary of what soldiers and women share: "they both acquire manners before morals." The parallel phrase states the common cause in four words and makes the comparison memorable.
    topic_code: "5.C"
  - front: Wollstonecraft's "masculine women" → how she redefines the insult
    back: |
      She splits the term in two. If *masculine* means a taste for hunting, shooting and gaming, she joins the cry against it. If it means acquiring the talents and virtues that ennoble human character, she wishes women may "grow more and more masculine." Definition turns an accusation into a goal.
    topic_code: "5.C"
  - front: Wollstonecraft's "innocence, as ignorance is courteously termed"
    back: |
      A redefinition by exposure: what society calls innocence in girls, she says, is really ignorance with a polite name. The aside shows how a flattering word disguises the effect of a bad education.
    topic_code: "5.C"
  - front: Wollstonecraft's "gilt cage"
    back: |
      Taught that beauty is "woman's sceptre," the mind "shapes itself to the body, and, roaming round its gilt cage, only seeks to adorn its prison." The metaphor describes the effect of the education: a confinement so decorated that its prisoner decorates it further.
    topic_code: "5.C"
  - front: Wollstonecraft's promise of "things, not words!"
    back: |
      In the Introduction she says she will not "cull my phrases or polish my style" and will avoid "flowery diction", because she wants to persuade by argument rather than dazzle by elegance. The plain-style promise is itself an argument: flowery language is part of what weakens women.
    topic_code: "1.B"
  - front: Wollstonecraft's announced plan for the Vindication
    back: |
      "I shall first consider women in the grand light of human creatures," she writes, and only afterwards their particular roles. The plan previews her line of reasoning: establish shared humanity first, so that every later claim about women's duties rests on reason, not on sex.
    topic_code: "5.A"
  - front: Wollstonecraft's concession about physical strength
    back: |
      She grants that "the female, in general, is inferior to the male" in physical strength, and calls it "a noble prerogative" of men. The concession narrows the dispute: she is not arguing about bodies but about minds, which makes her central claim harder to dismiss.
    topic_code: "3.A"
  - front: Wollstonecraft's "rational creatures" vs "perpetual childhood"
    back: |
      She asks her own sex to excuse her if she treats them "like rational creatures" rather than as if they were in "a state of perpetual childhood, unable to stand alone." The contrast defines her stance toward her female readers: respect instead of flattery.
    topic_code: "1.B"
  - front: Rousseau → why Wollstonecraft argues with him
    back: |
      Jean-Jacques Rousseau's Émile (1762) imagined Sophie, an ideal wife educated only to please and serve her husband. As one of the most admired writers on education, he is the opposing authority Wollstonecraft answers at greatest length in the Vindication.
    topic_code: "3.A"
  - front: Choosing a method of development → the question to ask
    back: |
      What does this reader need in order to accept this claim? If they doubt the problem is real, describe or narrate it. If they misunderstand a key term, define it. If they think the problem is natural or inevitable, trace its cause. If they lump things together, classify.
    topic_code: "5.C"
  - front: Methods of development in combination
    back: |
      Real arguments rarely use one method alone. Wollstonecraft's first paragraph is cause and effect carried by a comparison (the flowers); her soldiers passage is a comparison offered as causal proof. When an exam asks for the primary method, choose the one that carries the claim.
    topic_code: "5.C"
  - front: AP stems that test methods of development
    back: |
      The writer develops the second paragraph primarily through... The comparison in lines 8-12 serves to... The writer's definition of X functions to... The anecdote that opens the passage primarily... Each asks for the method and its purpose together.
    topic_code: "5.C"
  - front: A causal claim's weak point → mistaking sequence for cause
    back: |
      That one thing follows another does not prove it was caused by it (the post hoc fallacy). Strong causal development shows a mechanism or rules out other causes, as Wollstonecraft does with the soldiers: same education, same faults, different sex.
    topic_code: "5.C"

quiz:
  description: |
    24 questions · about 40 minutes · methods of development, with spiral review of line of reasoning, claims,
    audience and thesis. A reading set of seven questions on two passages from Wollstonecraft's Vindication, a revision
    set of six on an invented student argument, then questions across the week. Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the two short answers and
    the paragraph are graded by your teacher against the model answers and scoring notes.
  questions:
    # ---- Passage set: the cause of "barren blooming" and the soldiers
    - slug: u03-w10-q01
      type: multiple_choice
      topic_code: "5.C"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 1
      stimulus: &mw_causes |
        *The following passages are from Mary Wollstonecraft's A Vindication of the Rights of Woman (1792). The first is the opening paragraph of her Introduction; the second comes from her second chapter.*

        After considering the historic page, and viewing the living world with anxious solicitude, the most melancholy emotions of sorrowful indignation have depressed my spirits, and I have sighed when obliged to confess, that either nature has made a great difference between man and man, or that the civilization, which has hitherto taken place in the world, has been very partial. I have turned over various books written on the subject of education, and patiently observed the conduct of parents and the management of schools; but what has been the result? a profound conviction, that the neglected education of my fellow creatures is the grand source of the misery I deplore; and that women in particular, are rendered weak and wretched by a variety of concurring causes, originating from one hasty conclusion. The conduct and manners of women, in fact, evidently prove, that their minds are not in a healthy state; for, like the flowers that are planted in too rich a soil, strength and usefulness are sacrificed to beauty; and the flaunting leaves, after having pleased a fastidious eye, fade, disregarded on the stalk, long before the season when they ought to have arrived at maturity. One cause of this barren blooming I attribute to a false system of education, gathered from the books written on this subject by men, who, considering females rather as women than human creatures, have been more anxious to make them alluring mistresses than rational wives; and the understanding of the sex has been so bubbled by this specious homage, that the civilized women of the present century, with a few exceptions, are only anxious to inspire love, when they ought to cherish a nobler ambition, and by their abilities and virtues exact respect.

        [...]

        As a proof that education gives this appearance of weakness to females, we may instance the example of military men, who are, like them, sent into the world before their minds have been stored with knowledge or fortified by principles. The consequences are similar; soldiers acquire a little superficial knowledge, snatched from the muddy current of conversation, and, from continually mixing with society, they gain, what is termed a knowledge of the world; and this acquaintance with manners and customs has frequently been confounded with a knowledge of the human heart. But can the crude fruit of casual observation, never brought to the test of judgment, formed by comparing speculation and experience, deserve such a distinction? Soldiers, as well as women, practice the minor virtues with punctilious politeness. Where is then the sexual difference, when the education has been the same; all the difference that I can discern, arises from the superior advantage of liberty which enables the former to see more of life.
      prompt: |
        The first paragraph is developed primarily through which method?
      options:
        - |
          Narration of the events of the writer's own girlhood
        - |
          Classification of women into several social ranks
        - |
          Cause and effect, tracing the weakness of women to a false system of education
        - |
          Definition of the word "education"
      option_explanations:
        - |
          The writer reports what she has read and observed ("I have turned over various books"), but she tells no story of her own life. Her experience is the source of a conclusion, not a narrative.
        - |
          Ranks of society are mentioned later in the Introduction, but this paragraph does not sort women into categories. It treats "women in particular" as one group with one condition.
        - |
          Correct. The paragraph names an effect (women "rendered weak and wretched") and assigns its cause ("the grand source," "One cause of this barren blooming I attribute to a false system of education"). Cause-and-effect language runs through it.
        - |
          The paragraph uses the word education repeatedly but never stops to say what it means. Its work is to blame a kind of education for an effect.
      answer: 2
      explanation: |
        To name the primary method of development, look for the paragraph's working vocabulary. Words like "source," "rendered," "causes," "originating" and "attribute" are the signature of a causal argument.

    - slug: u03-w10-q02
      type: multiple_choice
      topic_code: "5.C"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 1
      stimulus: *mw_causes
      prompt: |
        The comparison of women to "flowers that are planted in too rich a soil" contributes to the argument chiefly by
      options:
        - |
          making the effect of a false education visible and locating its cause in how women are cultivated rather than in their nature
        - |
          praising women's natural beauty as their greatest strength
        - |
          suggesting that women, like flowers, cannot be changed by any education
        - |
          shifting the subject of the paragraph from education to gardening
      option_explanations:
        - |
          Correct. Rich soil produces "flaunting leaves" that "fade" before "maturity": the image shows the effect, and the cause is the soil, the treatment the plant receives. That is exactly the claim the next sentence states outright.
        - |
          The simile says strength and usefulness are "sacrificed to beauty." Beauty here is the problem, not the strength.
        - |
          The image implies the opposite: a plant in different soil would grow differently. The comparison supports reform, not resignation.
        - |
          The garden appears in one simile and the next sentence returns to "a false system of education." The comparison serves the subject; it does not replace it.
      answer: 0
      explanation: |
        A comparison often carries another method. Here an analogy does the work of cause and effect, letting the reader see the causal claim before the writer states it.

    - slug: u03-w10-q03
      type: multiple_choice
      topic_code: "3.A"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 1
      stimulus: *mw_causes
      prompt: |
        Which phrase from the first paragraph states its central claim most directly?
      options:
        - |
          "the most melancholy emotions of sorrowful indignation have depressed my spirits"
        - |
          "I have turned over various books written on the subject of education"
        - |
          "after having pleased a fastidious eye"
        - |
          "the neglected education of my fellow creatures is the grand source of the misery I deplore"
      option_explanations:
        - |
          This phrase describes the writer's feeling as she begins. It sets a tone of earnest distress but makes no claim a reader could dispute.
        - |
          This describes her method of inquiry, the reading and observation behind the claim. It is the claim's support, not the claim itself.
        - |
          This phrase belongs to the flower simile, the illustration of the effect. It is part of the evidence, not the central claim.
        - |
          Correct. Introduced as "a profound conviction," the phrase names a cause and an effect that the rest of the paragraph, and the book, develop.
      answer: 3
      explanation: |
        Skill 3.A (spiral review): separate the claim from its support. Here the paragraph moves from method (reading and observing) to claim (neglected education causes misery) to illustration (the flowers).

    - slug: u03-w10-q04
      type: multiple_choice
      topic_code: "5.C"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 1
      stimulus: *mw_causes
      prompt: |
        In the second paragraph, the comparison between women and "military men" serves primarily to
      options:
        - |
          argue that women should be allowed to serve as officers in the army
        - |
          show that men who receive the same kind of education display the same faults, so the faults must come from education rather than from sex
        - |
          ridicule soldiers as more frivolous than women
        - |
          narrate the writer's experience of meeting officers in society
      option_explanations:
        - |
          The passage does not propose military service for women. The army is chosen because its officers share women's kind of education, not as a career path.
        - |
          Correct. The paragraph opens "As a proof that education gives this appearance of weakness," then shows soldiers with the same education and the same "minor virtues," and asks, "Where is then the sexual difference?"
        - |
          The officers are criticised, but the point is the likeness: "Soldiers, as well as women." Ridicule for its own sake would not prove anything about education.
        - |
          No personal encounter is told. The soldiers are a general type offered as evidence, not characters in a story.
      answer: 1
      explanation: |
        A comparison works as proof when the two things share the cause in question and differ in the factor the opponent thinks is decisive. Same education, same faults, different sex: so sex is not the cause.

    - slug: u03-w10-q05
      type: multi_select
      topic_code: "5.C"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 2
      partial_credit: true
      stimulus: *mw_causes
      prompt: |
        Which TWO methods of development work together in the second paragraph? Select two.
      options:
        - |
          Comparison, setting soldiers beside women
        - |
          Cause and effect, attributing the shared faults to a shared kind of education
        - |
          Narration of a single soldier's career from enlistment to retirement
        - |
          Classification of the army into its different ranks
      option_explanations:
        - |
          Correct. "Military men, who are, like them" and "Soldiers, as well as women" place the two groups side by side throughout.
        - |
          Correct. "The consequences are similar" because the cause is the same: both are sent into the world before their minds are "stored with knowledge."
        - |
          The paragraph describes soldiers as a type; it tells no individual's story in time order.
        - |
          Ranks are not sorted or treated one by one. The paragraph treats "soldiers" and "military men" as a single group.
      answer: [0, 1]
      explanation: |
        Methods of development combine. The comparison is the visible structure; the causal claim is what the comparison proves.

    - slug: u03-w10-q06
      type: true_false
      topic_code: "5.A"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 1
      stimulus: *mw_causes
      prompt: |
        True or false: in the line of reasoning of these passages, the comparison with soldiers is offered as evidence for the causal claim stated in the first paragraph.
      answer: true
      explanation: |
        True. The second passage begins "As a proof that education gives this appearance of weakness to females," which ties it directly to the first paragraph's claim that "a false system of education" is the cause. The claim comes first; the comparison is its proof.

    - slug: u03-w10-q07
      type: multiple_choice
      topic_code: "1.B"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 1
      stimulus: *mw_causes
      prompt: |
        By saying that the conduct books were written by men "considering females rather as women than human creatures," Wollstonecraft anticipates which belief held by many in her audience?
      options:
        - |
          That books about education are rarely read
        - |
          That women should receive no education at all
        - |
          That the qualities taught to women, such as the wish to please, are simply natural to their sex
        - |
          That soldiers are better educated than women
      option_explanations:
        - |
          She assumes the books are widely read; that is why their influence matters. Her audience did not need persuading that they were read.
        - |
          Few of her readers held that view, and she does not argue against it here. Her target is the kind of education women receive, not its total absence.
        - |
          Correct. If readers believe women's frivolity is natural, the argument fails. By showing that the books treat women first as women and only secondarily as human beings, she recasts a supposed nature as the product of instruction.
        - |
          The soldiers are compared to women as equally badly educated; neither is said to be better. The comparison is not about which group is superior.
      answer: 2
      explanation: |
        Skill 1.B (spiral review): explain how an argument shows understanding of an audience's beliefs. Wollstonecraft identifies the belief her argument must overturn and aims her causal claim directly at it.

    # ---- Revision set: an invented argument about street trees
    - slug: u03-w10-q08
      type: multiple_choice
      topic_code: "6.C"
      source: written for this course
      points: 1
      stimulus: &w10_trees |
        *The following is a draft paragraph written for this course: a student's argument for a city council hearing. The sentences are numbered for the questions.*

        (1) Our city should plant trees along every street in the Eastside neighborhood. (2) On a July afternoon last summer, the sidewalk on Pine Street, which has no trees, measured 128 degrees, while the sidewalk on shaded Elm Street two blocks away measured 96. (3) Trees are also nice to look at. (4) Heat causes problems. (5) The Eastside has the fewest trees of any neighborhood and the most emergency calls for heat illness each summer, according to the fire department. (6) A tree is like an air conditioner. (7) Planting trees takes years to pay off.
      prompt: |
        The writer wants to revise sentence 4 so that it explains the cause-and-effect link between the temperatures in sentence 2 and the emergency calls in sentence 5. Which version best accomplishes this goal?
      options:
        - |
          Heat causes a lot of different problems for many people.
        - |
          Everyone knows that heat can be dangerous.
        - |
          Summers are getting hotter every year.
        - |
          Pavement that hot keeps radiating heat into nearby homes after sunset, so residents of treeless streets get little relief even at night.
      option_explanations:
        - |
          Adding "a lot of" and "many people" makes the sentence longer but no more specific. It still does not say how hot pavement leads to illness.
        - |
          An appeal to common knowledge skips the mechanism the paragraph needs. The council still has to guess how the sidewalk readings connect to the emergency calls.
        - |
          A claim about rising summer temperatures introduces a new idea rather than linking the two pieces of evidence already in the paragraph.
        - |
          Correct. The sentence supplies the mechanism (hot pavement heats homes through the night), which explains why the treeless neighborhood has the most heat illness.
      answer: 3
      explanation: |
        Skill 6.C: a cause-and-effect argument needs the middle link, the how. Two facts that appear together (hot sidewalks, many emergency calls) persuade only when the reader can see what joins them.

    - slug: u03-w10-q09
      type: multiple_choice
      topic_code: "6.A"
      source: written for this course
      points: 1
      stimulus: *w10_trees
      prompt: |
        The writer wants to delete the sentence that contributes least to the paragraph's line of reasoning. Which sentence should be deleted?
      options:
        - |
          Sentence 2
        - |
          Sentence 3
        - |
          Sentence 5
        - |
          Sentence 6
      option_explanations:
        - |
          Sentence 2 is the paragraph's most vivid evidence, a measured comparison between a treeless and a shaded street. Deleting it would remove the cause the argument depends on.
        - |
          Correct. Whether trees are pleasant to look at has nothing to do with the paragraph's argument about heat and health. It distracts from the causal chain.
        - |
          Sentence 5 supplies the effect: the most emergency calls in the neighborhood with the fewest trees. It is essential to the cause-and-effect line.
        - |
          Sentence 6 needs development, but its comparison points toward the argument's claim that trees cool. It should be revised, not deleted.
      answer: 1
      explanation: |
        Skill 6.A (spiral review): every sentence should either support a claim or connect one claim to another. An attractive but irrelevant reason weakens a focused argument.

    - slug: u03-w10-q10
      type: multiple_choice
      topic_code: "6.C"
      source: written for this course
      points: 1
      stimulus: *w10_trees
      prompt: |
        The writer wants to develop the comparison in sentence 6 so that it advances the argument. Which version best accomplishes this goal?
      options:
        - |
          Like an air conditioner, a mature tree cools the air around it; unlike one, it runs without electricity, which matters in a neighborhood where many families cannot afford a cooling bill.
        - |
          A tree is like an air conditioner, and also like a fan, and also like an umbrella.
        - |
          A tree is like an air conditioner because both are things that exist in cities.
        - |
          Air conditioners were invented in the early twentieth century.
      option_explanations:
        - |
          Correct. The revision states the likeness that matters (cooling) and then the difference that matters even more (no electricity), and connects that difference to the audience's concern for residents who cannot pay.
        - |
          Piling up comparisons blurs the point. None of them is explained, so the reader learns nothing about why trees should be planted.
        - |
          The shared feature named is trivial. A comparison persuades only when the two things are alike in the respect the argument needs.
        - |
          A historical fact about air conditioners abandons the comparison instead of developing it.
      answer: 0
      explanation: |
        A comparison earns its place when the writer names the point of likeness, and often a telling difference, and connects both to the claim.

    - slug: u03-w10-q11
      type: multiple_choice
      topic_code: "6.C"
      source: written for this course
      points: 1
      stimulus: *w10_trees
      prompt: |
        The writer wants to add a brief narrative that makes the heat's effect on residents concrete for the council. Which sentence best accomplishes this goal?
      options:
        - |
          Heat affects people of all ages in many ways.
        - |
          Narratives are a powerful way to persuade an audience.
        - |
          Last August a retired bus driver on Pine Street spent two nights in the hospital after his apartment, facing the unshaded street, reached 94 degrees indoors.
        - |
          The writer of this paragraph has always enjoyed walking under trees.
      option_explanations:
        - |
          A general statement is not a narrative. It names no person, place or event that the council could picture.
        - |
          This sentence talks about narration instead of using it. It also breaks the paragraph's focus on the neighborhood.
        - |
          Correct. A single, specific sequence of events (a named street, a month, an indoor temperature, a hospital stay) turns the statistics into a human case without crowding out the data.
        - |
          The writer's preference is a personal detail unrelated to the residents' health. It shifts attention from the problem to the writer.
      answer: 2
      explanation: |
        Narration in an argument works best as a brief, specific case that illustrates a claim the paragraph also supports with broader evidence.

    - slug: u03-w10-q12
