    - slug: u03-w10-q14
      type: multiple_choice
      topic_code: "5.C"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 1
      stimulus: |
        *The following passage is from the Introduction to Mary Wollstonecraft's A Vindication of the Rights of Woman (1792).*

        I am aware of an obvious inference: from every quarter have I heard exclamations against masculine women; but where are they to be found? If, by this appellation, men mean to inveigh against their ardour in hunting, shooting, and gaming, I shall most cordially join in the cry; but if it be, against the imitation of manly virtues, or, more properly speaking, the attainment of those talents and virtues, the exercise of which ennobles the human character, and which raise females in the scale of animal being, when they are comprehensively termed mankind--all those who view them with a philosophical eye must, I should think, wish with me, that they may every day grow more and more masculine.
      prompt: |
        Wollstonecraft's treatment of the phrase "masculine women" is best described as
      options:
        - |
          an apology for women who behave like men
        - |
          a narrative of how the phrase came into use
        - |
          a definition that separates two meanings of the term, rejects one and embraces the other, turning an insult into a goal
        - |
          a classification of women into hunters, shooters and gamblers
      option_explanations:
        - |
          She does not apologise. She agrees that a taste for "hunting, shooting, and gaming" is a fault, but defends women's pursuit of "manly virtues."
        - |
          Nothing in the passage tells the history of the phrase. She examines what it could mean, not where it came from.
        - |
          Correct. "If, by this appellation, men mean" one thing, she joins the criticism; "but if it be" the other, she wishes women "may every day grow more and more masculine." Definition carries the argument.
        - |
          Hunting, shooting and gaming are one meaning of the insult, mentioned together and dismissed. They are not categories of women that she treats in turn.
      answer: 2
      explanation: |
        Redefinition is one of the most powerful uses of definition in an argument: by fixing which meaning of a contested term is in play, the writer decides what the argument is about.

    - slug: u03-w10-q15
      type: multiple_choice
      topic_code: "5.C"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 1
      prompt: |
        Wollstonecraft writes that "in order to preserve their innocence, as ignorance is courteously termed, truth is hidden from them." The aside "as ignorance is courteously termed" functions chiefly to
      options:
        - |
          praise the courtesy with which girls are educated
        - |
          redefine a virtue society praises as a polite name for the harm a false education does
        - |
          suggest that ignorance and innocence are unrelated
        - |
          introduce a story about a particular girl
      option_explanations:
        - |
          "Courteously" is ironic: the courtesy is the disguise. The aside criticises the education rather than praising it.
        - |
          Correct. In four words she redefines "innocence" as "ignorance" dressed up, which turns a quality parents prize into evidence of the very effect she is blaming on education.
        - |
          The point is that they are the same thing under two names. The aside identifies them; it does not separate them.
        - |
          No individual girl appears. The sentence generalises about "Women" and how they are taught.
      answer: 1
      explanation: |
        Definition in an argument is often a short, sharp aside. Watch for phrases like "what is called," "so-termed" and "as X is courteously termed": they signal a writer rejecting one meaning for another.

    - slug: u03-w10-q16
      type: multiple_choice
      topic_code: "5.C"
      source: general knowledge
      points: 1
      prompt: |
        A writer arguing against a proposed school uniform policy sorts the arguments for it into three kinds (arguments about safety, about cost and about discipline) and then answers each kind in turn. Which method of development is the writer using?
      options:
        - |
          Narration
        - |
          Description
        - |
          Definition
        - |
          Classification
      option_explanations:
        - |
          Narration tells a sequence of events. Sorting arguments into kinds and treating each is not a story.
        - |
          Description renders a person, place or object in concrete detail. The writer here is organising ideas, not picturing anything.
        - |
          Definition fixes the meaning of a term. The writer may define "discipline" along the way, but the structure described is sorting into categories.
        - |
          Correct. Dividing a subject into kinds and treating each kind is classification. It organises a crowded debate and lets the writer answer every category of opposing argument.
      answer: 3
      explanation: |
        Classification is especially useful in refutation: it shows the reader that the writer has considered every kind of opposing argument, not just the weakest one.

    - slug: u03-w10-q17
      type: multiple_choice
      topic_code: "5.A"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 1
      prompt: |
        In her Introduction, Wollstonecraft writes, "This discussion naturally divides the subject. I shall first consider women in the grand light of human creatures, who, in common with men, are placed on this earth to unfold their faculties; and afterwards I shall more particularly point out their peculiar designation." This statement contributes to the book's line of reasoning by
      options:
        - |
          establishing shared humanity as the foundation, so that later claims about women's particular duties rest on reason rather than on sex
        - |
          admitting that women and men have nothing in common
        - |
          postponing the question of education indefinitely
        - |
          narrating the order in which she wrote the chapters
      option_explanations:
        - |
          Correct. The order is an argument in itself: human first, woman second. Once readers grant that women share the human task of unfolding their faculties, every particular duty must be judged by that standard.
        - |
          She says the reverse: women are placed on earth "in common with men." The shared ground comes first.
        - |
          Education is the means of unfolding faculties; the plan leads straight to it. Nothing is postponed indefinitely.
        - |
          The statement previews the logic of the argument, not the history of its composition.
      answer: 0
      explanation: |
        Skill 5.A (spiral review): a writer's announced plan is a preview of the line of reasoning. Ask why the steps come in this order and what the first step makes possible.

