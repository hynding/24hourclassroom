    - slug: u03-w10-q22
      type: short_answer
      topic_code: "5.C"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 2
      prompt: |
        In two or three sentences, explain how Wollstonecraft's comparison between women and soldiers advances her argument that women's weakness comes from education rather than nature.
      answer: |
        Wollstonecraft points out that officers, like women, are "sent into the world before their minds have been stored with knowledge," and that they show the same faults: attention to appearance, love of society and polite "minor virtues." Because these men share women's kind of education and their faults, but not their sex, the comparison isolates education as the cause. It works like a controlled experiment, answering readers who assume the faults are natural to women.
      explanation: |
        1 point: accurately states the comparison (soldiers and women share a superficial education and similar faults). 1 point: explains its logic for the argument (same education and faults but different sex, so the cause is education rather than nature). A response that only describes the comparison earns at most 1.

    - slug: u03-w10-q23
      type: short_answer
      topic_code: "6.C"
      source: written for this course
      points: 2
      prompt: |
        A student is arguing that her school should count volunteer work toward graduation. Her opponents say volunteer work is "just a hobby." Write two or three sentences that use definition to develop her argument: define the key term in a way that advances her claim.
      answer: |
        A model response: *A hobby is something we do only for our own enjoyment; volunteer work is labour done for someone else, on their schedule and to their standard. When a student tutors a younger child every Tuesday or sorts donations at a food bank, she is practising responsibility and skill on behalf of a community, which is exactly what a graduation requirement exists to certify.*
      explanation: |
        1 point: offers a clear definition of the key term (volunteer work, hobby or learning) that distinguishes it from the opponents' meaning. 1 point: explains how the definition advances the claim (it shows why volunteer work deserves credit). A definition copied from a dictionary without connection to the argument earns at most 1.

    - slug: u03-w10-q24
      type: long_answer
      topic_code: "5.C"
      source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
      points: 5
      prompt: |
        Write one well-developed analytical paragraph (about 200 words) that explains how Wollstonecraft uses ONE method of development (cause and effect, comparison or definition) to advance her argument in the passages from A Vindication of the Rights of Woman studied this week. Make a claim about the method and its purpose, support it with at least two short quotations, and explain how each quotation shows the method serving her argument.
      answer: |
        A model paragraph on comparison. Claim: Wollstonecraft uses comparison to make her causal argument visible and then to prove it. Evidence 1: women are "like the flowers that are planted in too rich a soil," whose leaves "fade, disregarded on the stalk" before maturity. Commentary: the simile shows readers the effect of a false education, beauty without strength, and places its cause in the soil, the cultivation, rather than in the plant's nature. Evidence 2: "As a proof that education gives this appearance of weakness to females, we may instance the example of military men." Commentary: where the flower comparison illustrates, the soldier comparison argues. Officers share women's superficial education and their faults but not their sex, so the comparison isolates education as the cause, which is why she can ask "Where is then the sexual difference?" Concluding link: the first comparison lets readers see the problem; the second removes their best excuse for it.
      explanation: |
        5 points. Claim (1): an arguable claim naming one method and its purpose in Wollstonecraft's argument, not just the label. Evidence (2): 2 points for at least two accurate, short, well-chosen quotations from the passages that show the method; 1 point for one quotation or for paraphrase only. Commentary (2): 2 points if each quotation is explained in terms of how the method advances the argument (what it shows or proves, for which readers); 1 point if commentary is present but thin or repeats the quotation; 0 if the paragraph summarises.
