    explanation: |
      Place evidence directly after the claim it supports. A strong statistic in the wrong place is a step out of order in the line of reasoning.

  - slug: u03-exam-q35
    type: multiple_choice
    topic_code: "6.A"
    source: written for this course
    points: 1
    stimulus: *ex_bus
    prompt: |
      The writer wants to add commentary after sentence 3 that connects the neighbor's story to the paragraph's claim. Which sentence best accomplishes this goal?
    options:
      - |
        Eleven days is more than two weeks of lessons lost, not to illness or choice but to a $45 fare, which is exactly the kind of barrier a city can remove.
      - |
        My neighbor is a very nice person and a good student.
      - |
        Winter in our city can be very cold.
      - |
        Many people have neighbors who go to high school.
    option_explanations:
      - |
        Correct. The commentary says what the story shows (instruction lost to a fare, not to the student) and turns it toward the proposal (a removable barrier).
      - |
        Praising the neighbour adds sympathy but explains nothing about the fare or the proposal.
      - |
        The weather is part of the story's setting, but repeating it does not connect the story to the claim.
      - |
        This generalisation is irrelevant; it says nothing about cost, attendance or bus passes.
    answer: 0
    explanation: |
      Narration in an argument needs a sentence of commentary saying what the story proves. Without it the reader has an anecdote, not evidence.

  - slug: u03-exam-q36
    type: multiple_choice
    topic_code: "6.C"
    source: written for this course
    points: 1
    stimulus: *ex_bus
    prompt: |
      The writer wants to develop the comparison in sentence 9 so that it advances the argument. Which version best accomplishes this goal?
    options:
      - |
        Free bus passes are like free textbooks, and both are like free lunches.
      - |
        Free bus passes are like free textbooks because both are free.
      - |
        Some people think bus passes are nothing like textbooks.
      - |
        Like a textbook, a bus pass is something a student cannot do the required work without; the city already supplies the first, so supplying the second follows the same principle.
    option_explanations:
      - |
        Adding a third item multiplies comparisons without explaining any of them.
      - |
        The likeness named (both are free) is the conclusion, not a reason. The comparison is circular.
      - |
        This raises doubt about the comparison without developing it, weakening the paragraph.
      - |
        Correct. The revision names the point of likeness that matters (both are necessary for schoolwork) and draws the conclusion: a principle the city already accepts.
    answer: 3
    explanation: |
      Skill 6.C: a comparison advances an argument when the likeness it names carries an accepted principle from the familiar case to the new one.

  - slug: u03-exam-q37
    type: multiple_choice
    topic_code: "6.A"
    source: written for this course
    points: 1
    stimulus: *ex_bus
    prompt: |
      The writer wants to add a sentence after sentence 8 that answers the objection and keeps the line of reasoning moving toward the thesis. Which sentence best accomplishes this goal?
    options:
      - |
        That is true, and the city should probably think about it carefully.
      - |
        The transit board's own estimate puts the cost at about a dollar a day per student, and the state pays the district far more than that for each day a student attends, so every school day the passes win back would recover part of their cost.
      - |
        People who say this do not care about students.
      - |
        Many things the city does cost money.
    option_explanations:
      - |
        This concedes the objection and stops, ending the argument's middle on the opposing point.
      - |
        Correct. The sentence grants the cost, measures it against a figure the board cares about, and turns the objection into a reason: better attendance brings some of the money back.
      - |
        Attacking the motives of opponents does not answer the objection and is likely to alienate the board.
      - |
        A vague generalisation neither answers the objection nor connects it to the proposal.
    answer: 1
    explanation: |
      An objection answered with evidence and connected back to an earlier claim becomes a step in the line of reasoning.

  - slug: u03-exam-q38
    type: multiple_choice
    topic_code: "4.A"
    source: written for this course
    points: 1
    stimulus: *ex_bus
    prompt: |
      The writer wants to add evidence to support sentence 6. Which piece of evidence would be most effective?
    options:
      - |
        Libraries are important to every community.
      - |
        The writer enjoys riding the bus to the public library.
      - |
        A survey of students at the city's three high schools found that one in four holds a part-time job, and most of them reach it by bus or on foot.
      - |
        Some students do not like to read.
    option_explanations:
      - |
        A general claim about libraries does not show that students need transport to reach jobs or libraries.
      - |
        The writer's own enjoyment is a single personal preference, not evidence of a need shared by students.
      - |
        Correct. The survey is specific and relevant: it shows that many students already depend on transport for work, which supports the claim that passes would serve more than the school day.
      - |
        This works against the claim and is irrelevant to transport.
    answer: 2
    explanation: |
      Skill 4.A: choose evidence that supports the exact claim, is specific, and would be credible to the audience.

  - slug: u03-exam-q39
    type: multiple_choice
    topic_code: "6.C"
    source: written for this course
    points: 1
    stimulus: *ex_bus
    prompt: |
      The writer wants to revise sentence 6 into a classification that advances the argument. Which version best accomplishes this goal?
    options:
      - |
        Students take many different kinds of trips for many different reasons.
      - |
        Some students ride in the front of the bus, and others ride in the back.
      - |
        Buses can be divided into express routes and local routes.
      - |
        A free pass would serve three kinds of trips a student's education depends on: getting to class, getting to the part-time jobs that help support many families, and getting to libraries and tutoring after school.
    option_explanations:
      - |
        Naming “many different kinds” without sorting them is not classification and gives the board nothing to weigh.
      - |
        Where students sit is a trivial principle with no bearing on the proposal.
      - |
        Route types classify the buses, not the students' needs, so the categories do not advance the argument.
      - |
        Correct. The categories are sorted by one principle (trips tied to a student's education and livelihood), and together they show the pass would do more than get students to school.
    answer: 3
    explanation: |
      Classification advances an argument when its categories are parallel and each adds weight to the claim.

  - slug: u03-exam-q40
    type: multiple_choice
    topic_code: "6.A"
    source: written for this course
    points: 1
    stimulus: *ex_bus
    prompt: |
      The writer wants to replace sentence 10 with a conclusion that shows where the line of reasoning has arrived. Which version best accomplishes this goal?
    options:
      - |
        In conclusion, buses are an important part of any city.
      - |
        A free pass costs the city little and removes the one barrier that kept a sophomore out of school for eleven days, so the board should treat it not as a gift but as part of the cost of education.
      - |
        The city should act now, before it is too late.
      - |
        Thank you for reading my letter.
    option_explanations:
      - |
        A general statement about buses drifts away from the proposal and repeats nothing the paragraph proved.
      - |
        Correct. The conclusion gathers the cost argument and the narrative case and lands them on a reframed thesis: the pass as part of the cost of education.
      - |
        Urgency without reasons is a slogan. The sentence does not show what the argument has established.
      - |
        A courtesy closes the letter but does not conclude the argument.
    answer: 1
    explanation: |
      Skill 6.A: a conclusion should show the line of reasoning arriving, ideally by restating the thesis in the light of what the paragraph has proved.

