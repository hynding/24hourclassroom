  - slug: u03-exam-q32
    type: long_answer
    topic_code: "5.C"
    source: 'Jacob A. Riis, How the Other Half Lives (1890)'
    points: 6
    stimulus: *ex_riis
    prompt: |
      Jacob Riis's How the Other Half Lives (1890) was written to persuade comfortable New Yorkers to face the conditions of the city's tenements. The passage above is from its introduction. Read the passage carefully. Write an essay that analyzes the rhetorical choices Riis makes to convey his argument about who is responsible for the tenements and why his readers should care.

      In your response you should do the following:
      - Respond to the prompt with a thesis that analyzes the writer's rhetorical choices.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Demonstrate an understanding of the rhetorical situation.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: To persuade comfortable readers that the tenements are their problem, Riis turns a familiar proverb into an accusation, builds a causal case that makes the community the parent of the system, and piles up its effects until they reach the readers' own homes, so that responsibility feels both unavoidable and answerable. Line of reasoning: (1) The opening proverb, reinterpreted: “It did not know because it did not care” converts ignorance into indifference, putting the readers' class on trial from the first paragraph. (2) Scale and permanence: the figures (three-fourths of the city, thirty-seven thousand houses, twelve hundred thousand people) and the failure of rapid transit show the problem cannot be escaped, and the metaphor of “offspring of public neglect and private greed” names its parents. (3) Accumulated effects: the long “because” sentence moves from epidemics that “carry death to rich and poor alike” to crime, beggars and tramps, reaching the climax of “deadly moral contagion” in family life, so the danger reaches the readers. (4) A role for the reader: “the child of our own wrong” admits guilt but asks for “patience and tenderest charity,” giving readers a response they can accept. Sophistication: noting the tension between Riis's sympathy and his dehumanising images (“scum,” “human wrecks”), or how the passage balances fear and charity for its audience.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis that analyzes Riis's rhetorical choices in relation to his argument about responsibility (not just a list of devices or a summary). Row B Evidence and Commentary (0-4): 4 = specific evidence from across the passage (the proverb and its reinterpretation, the statistics, the parentage metaphor, the accumulating causal sentence, the closing appeal) with commentary that consistently explains how each choice works on comfortable readers and builds a line of reasoning; 3 = specific evidence with commentary that explains some choices but is uneven; 2 = mostly general evidence or commentary that restates or summarises; 1 = evidence mainly summarised with little commentary; 0 = no relevant evidence. Row C Sophistication (0-1): 1 point for explaining the significance of choices within the rhetorical situation (for example, how Riis manages his readers' guilt and fear, the tension between sympathy and dehumanising metaphors, or how the passage prepares the book's evidence), or for a consistently vivid, persuasive style.

