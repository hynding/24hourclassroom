  - slug: u03-exam-q44
    type: true_false
    topic_code: "5.C"
    source: general knowledge
    points: 1
    prompt: |
      True or false: Wollstonecraft's comparison of women with soldiers and Du Bois's example of the Black artisan pulled between two aims both argue that a weakness observers attribute to a group's nature actually has another cause.
    answer: true
    explanation: |
      True. Wollstonecraft traces women's supposed weakness to a superficial education that soldiers share; Du Bois traces what “seem[s] like absence of power” to “the contradiction of double aims.” Both use a method of development (comparison, an illustrative example) to support a causal claim that overturns a judgment about nature.

  - slug: u03-exam-q45
    type: multi_select
    topic_code: "6.A"
    source: general knowledge
    points: 2
    partial_credit: true
    prompt: |
      Which TWO features most clearly show that a student's argument has a line of reasoning rather than a list of reasons? Select two.
    options:
      - |
        Each body paragraph's claim depends on the one before it, so the paragraphs could not be rearranged without loss.
      - |
        Commentary after each piece of evidence explains how it supports the claim and how that claim advances the thesis.
      - |
        Every body paragraph begins with “Another reason is.”
      - |
        The essay includes as many reasons as possible.
    option_explanations:
      - |
        Correct. Dependence between claims is the defining feature of a line of reasoning; a list can be shuffled.
      - |
        Correct. Commentary is what links evidence to claims and claims to the thesis.
      - |
        “Another reason is” signals addition, the mark of a list, not a logical relation between steps.
      - |
        Quantity is not reasoning. More reasons without connections make a longer list.
    answer: [0, 1]
    explanation: |
      Skill 6.A: a line of reasoning is made of connected claims and the commentary that explains the connections.
