unit: 3
description: |
  45 questions · about 90 minutes · every skill of Unit 3 (line of reasoning 5.A and 6.A, methods of development 5.C
  and 6.C, with claims and evidence 3.A and 4.A). Five passage sets: new passages from Thoreau's "Civil Disobedience",
  Wollstonecraft's A Vindication of the Rights of Woman and Du Bois's The Souls of Black Folk; a passage you have not
  studied, the introduction to Jacob Riis's How the Other Half Lives (1890), followed by an AP-style rhetorical
  analysis essay on it; and an invented student draft for revision. Then five questions across the unit, including
  two short written responses. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank
  items are matched automatically; the short responses and the essay are graded by your teacher against the model
  answers and the 6-point AP rubric.
questions:
  # ---- Set A: "Civil Disobedience", the night in jail
  - slug: u03-exam-q01
    type: multiple_choice
    topic_code: "5.A"
    source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
    points: 1
    stimulus: &ex_thoreau_jail |
      *The following passage is from Henry David Thoreau's "Resistance to Civil Government" (1849), later known as "Civil Disobedience." Thoreau reflects on the night he spent in the Concord jail.*

      I have paid no poll-tax for six years. I was put into a jail once on this account, for one night; and, as I stood considering the walls of solid stone, two or three feet thick, the door of wood and iron, a foot thick, and the iron grating which strained the light, I could not help being struck with the foolishness of that institution which treated me as if I were mere flesh and blood and bones, to be locked up. I wondered that it should have concluded at length that this was the best use it could put me to, and had never thought to avail itself of my services in some way. I saw that, if there was a wall of stone between me and my townsmen, there was a still more difficult one to climb or break through, before they could get to be as free as I was. [...] I felt as if I alone of all my townsmen had paid my tax. They plainly did not know how to treat me, but behaved like persons who are underbred. In every threat and in every compliment there was a blunder; for they thought that my chief desire was to stand the other side of that stone wall. I could not but smile to see how industriously they locked the door on my meditations, which followed them out again without let or hindrance, and *they* were really all that was dangerous. As they could not reach me, they had resolved to punish my body; just as boys, if they cannot come at some person against whom they have a spite, will abuse his dog. I saw that the State was half-witted, that it was timid as a lone woman with her silver spoons, and that it did not know its friends from its foes, and I lost all my remaining respect for it, and pitied it.

      Thus the state never intentionally confronts a man’s sense, intellectual or moral, but only his body, his senses. It is not armed with superior wit or honesty, but with superior physical strength. I was not born to be forced. I will breathe after my own fashion. Let us see who is the strongest. What force has a multitude? They only can force me who obey a higher law than I. They force me to become like themselves. I do not hear of *men* being *forced* to live this way or that by masses of men. What sort of life were that to live? When I meet a government which says to me, “Your money or your life,” why should I be in haste to give it my money? It may be in a great strait, and not know what to do: I cannot help that. It must help itself; do as I do. It is not worth the while to snivel about it. I am not responsible for the successful working of the machinery of society. I am not the son of the engineer. I perceive that, when an acorn and a chestnut fall side by side, the one does not remain inert to make way for the other, but both obey their own laws, and spring and grow and flourish as best they can, till one, perchance, overshadows and destroys the other. If a plant cannot live according to its nature, it dies; and so a man.
    prompt: |
      Which best describes the line of reasoning of the first paragraph?
    options:
      - |
        It narrates his arrest in chronological order and ends with his release the next morning.
      - |
        It compares the Concord jail with other prisons and ranks them by their severity.
      - |
        It moves from a concrete description of the jail's walls to the claim that the state, by treating him as mere body, shows its own foolishness and loses his respect.
      - |
        It defends the jailers as reasonable men doing a difficult job.
    option_explanations:
      - |
        The arrest and release are not narrated; the paragraph stays inside the cell and inside Thoreau's reflections. Its order is the order of an argument, not of events.
      - |
        No other prison is mentioned. The walls are described to make a point about the state, not to compare institutions.
      - |
        Correct. The paragraph begins with stone and iron, then turns them into evidence: an institution that locks up "flesh and blood and bones" has misunderstood what a man is. It ends with the verdict: "I lost all my remaining respect for it, and pitied it."
      - |
        The jailers and townsmen "behaved like persons who are underbred," and the state is "half-witted." The paragraph criticises them; it does not defend them.
    answer: 2
    explanation: |
      Describe a line of reasoning by its first and last steps and the turn between them. Here the turn is the word "foolishness": the solid walls become proof of the state's misunderstanding.

  - slug: u03-exam-q02
    type: multiple_choice
    topic_code: "5.C"
    source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
    points: 1
    stimulus: *ex_thoreau_jail
    prompt: |
      The precise description of the jail ("walls of solid stone, two or three feet thick, the door of wood and iron, a foot thick") contributes to the argument chiefly by
    options:
      - |
        making the state's physical force concrete, so that Thoreau can then show how little that force achieves against a mind
      - |
        expressing his fear of the jail and his wish to escape
      - |
        praising the craftsmanship of the builders of Concord
      - |
        classifying the materials used in public buildings
    option_explanations:
      - |
        Correct. The exact measurements make the walls massive; the paragraph then turns their mass against the state. All that stone cannot touch his "meditations," which "followed them out again without let or hindrance."
      - |
        Thoreau does not fear the jail; he says the jailers mistakenly thought "my chief desire was to stand the other side of that stone wall." The tone is amused contempt.
      - |
        The detail does not admire the building. Its point is that so much stone is wasted on the wrong target.
      - |
        The materials are listed to describe one cell, not sorted into categories. The method is description in service of an argument.
    answer: 0
    explanation: |
      Description works as argument when the writer turns the described thing into evidence. Thoreau builds up the walls so that his contempt for them carries weight.

  - slug: u03-exam-q03
    type: multiple_choice
    topic_code: "5.C"
    source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
    points: 1
    stimulus: *ex_thoreau_jail
    prompt: |
      The comparison of the state to "boys, if they cannot come at some person against whom they have a spite," who "will abuse his dog," serves primarily to
    options:
      - |
        suggest that Thoreau owned a dog that the jailers mistreated
      - |
        present the state's punishment of his body as petty and misdirected, aimed at what it can reach because it cannot reach the man himself
      - |
        argue that children should be taught kindness to animals
      - |
        show that the state is as dangerous as a pack of animals
    option_explanations:
      - |
        The dog is part of a comparison, not a literal detail from Thoreau's life. Nothing suggests an actual dog was involved.
      - |
        Correct. Like spiteful boys who kick the dog because they cannot reach its owner, the state locks up the body because it cannot touch the mind. The comparison shrinks the state's power to a childish tantrum.
      - |
        The comparison is a vehicle for a claim about the state; it makes no argument about children or animals.
      - |
        The comparison makes the state look small and foolish, not fearsome. The paragraph ends with pity, not alarm.
    answer: 1
    explanation: |
      Ask what a comparison does to the reader's view of its subject. Here an image from the schoolyard diminishes an institution most readers would have treated with respect.

  - slug: u03-exam-q04
    type: multiple_choice
    topic_code: "3.A"
    source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
    points: 1
    stimulus: *ex_thoreau_jail
    prompt: |
      The sentence "I felt as if I alone of all my townsmen had paid my tax" makes which claim?
    options:
      - |
        That Thoreau secretly paid the tax before entering jail
      - |
        That his townsmen had refused to pay their taxes as well
      - |
        That the tax collector had made an accounting error
      - |
        That by refusing the tax he alone had paid what he truly owed, a moral debt his tax-paying neighbours had left unpaid
    option_explanations:
      - |
        He says he has paid no poll tax for six years; the sentence is a paradox, not a confession.
      - |
        His townsmen paid. The paradox depends on the contrast between their paying and his refusal.
      - |
        No error in accounts is suggested. "Tax" has shifted from a sum of money to an obligation of conscience.
      - |
        Correct. The paradox redefines what is owed. Paying money to support slavery and war leaves the real debt unpaid; refusing and going to jail pays it.
    answer: 3
    explanation: |
      A paradox is often a compressed claim. Identify the word whose meaning shifts (here "tax") and state the claim the shift makes.

  - slug: u03-exam-q05
    type: multi_select
    topic_code: "5.A"
    source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
    points: 2
    partial_credit: true
    stimulus: *ex_thoreau_jail
    prompt: |
      Which TWO claims are steps in the line of reasoning of the second paragraph? Select two.
    options:
      - |
        The state is armed with superior physical strength, not with superior wit or honesty.
      - |
        A person, like a plant, must live according to his own nature or die.
      - |
        A citizen should pay his taxes to keep the peace with his neighbours.
      - |
        The multitude is usually right, so individuals should follow it.
    option_explanations:
      - |
        Correct. The paragraph opens by stating what the state's power is (bodily force) and what it is not (wit or honesty), which denies its authority over conscience.
      - |
        Correct. The acorn and chestnut lead to the closing claim: "If a plant cannot live according to its nature, it dies; and so a man."
      - |
        The paragraph rejects paying: "why should I be in haste to give it my money?" Keeping the peace by paying is the view he argues against.
      - |
        He asks "What force has a multitude?" and says only those who obey "a higher law than I" can force him. The multitude has no such authority.
    answer: [0, 1]
    explanation: |
      The second paragraph generalises the jail experience into principles: the state has only force; force has no authority over conscience; a person must grow by his own nature.

  - slug: u03-exam-q06
    type: multiple_choice
    topic_code: "5.C"
    source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
    points: 1
    stimulus: *ex_thoreau_jail
    prompt: |
      The analogy of the acorn and the chestnut at the end of the passage functions to
    options:
      - |
        ground Thoreau's resistance in natural law, presenting it as a living thing's growth according to its nature rather than as rebellion
      - |
        describe the trees that grew outside the Concord jail
      - |
        argue that the strong should always destroy the weak
      - |
        suggest that the state and the individual can easily grow side by side
    option_explanations:
      - |
        Correct. Each seed "obey[s] their own laws" and grows "as best they can." Applied to a man, the image makes refusing the state seem as natural as a plant growing toward light.
      - |
        The seeds are an analogy, not a description of the setting. Nothing places trees outside the jail.
      - |
        The image admits that one may overshadow the other, but its point is that each must follow its nature. It is not a defence of the strong destroying the weak.
      - |
        The analogy says the reverse: neither seed "remain[s] inert to make way for the other," and one may destroy the other. Coexistence is not promised.
    answer: 0
    explanation: |
      An analogy at the end of a line of reasoning often moves the argument to a new ground. Thoreau's moves it from politics to nature, where his conclusion seems self-evident.

  - slug: u03-exam-q07
    type: true_false
    topic_code: "1.A"
    source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
    points: 1
    stimulus: *ex_thoreau_jail
    prompt: |
      True or false: according to the passage, Thoreau was jailed for one night for refusing to pay his poll tax.
    answer: true
    explanation: |
      True. "I have paid no poll-tax for six years. I was put into a jail once on this account, for one night." The occasion of the passage is part of the essay's rhetorical situation: Thoreau writes as someone who has acted on his argument.

  - slug: u03-exam-q08
    type: multiple_choice
    topic_code: "5.A"
    source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
    points: 1
    stimulus: *ex_thoreau_jail
    prompt: |
      Within the essay as a whole, this account of the night in jail functions primarily to
    options:
      - |
        abandon the essay's argument in favour of a light personal anecdote
      - |
        apologise to his neighbours for the trouble he caused
      - |
        test the essay's earlier claims against experience, showing that the state can confine a body but not compel a conscience, which supports his claim that prison is the honourable place for a just man
      - |
        introduce the philosopher Paley's arguments for the first time
    option_explanations:
      - |
        The anecdote is woven into the argument; it ends in general principles ("Thus the state never intentionally confronts a man's sense"). It extends the reasoning rather than leaving it.
      - |
        He pities the state and calls its agents "underbred." There is no apology.
      - |
        Correct. Earlier Thoreau argued that "the true place for a just man is also a prison." The jail account shows what that looks like: the walls fail to touch his mind, and he emerges freer than his neighbours.
      - |
        Paley is discussed earlier in the essay, not here. This passage turns from theory to experience.
    answer: 2
    explanation: |
      Narration can be a step in a line of reasoning: personal experience offered as evidence that the writer's principles hold when tested.

  # ---- Set B: A Vindication of the Rights of Woman, the writer's plan and style
  - slug: u03-exam-q09
    type: multiple_choice
    topic_code: "5.A"
    source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
    points: 1
    stimulus: &ex_mw_style |
      *The following passage is from the Introduction to Mary Wollstonecraft's A Vindication of the Rights of Woman (1792).*

      My own sex, I hope, will excuse me, if I treat them like rational creatures, instead of flattering their FASCINATING graces, and viewing them as if they were in a state of perpetual childhood, unable to stand alone. I earnestly wish to point out in what true dignity and human happiness consists--I wish to persuade women to endeavour to acquire strength, both of mind and body, and to convince them, that the soft phrases, susceptibility of heart, delicacy of sentiment, and refinement of taste, are almost synonymous with epithets of weakness, and that those beings who are only the objects of pity and that kind of love, which has been termed its sister, will soon become objects of contempt.

      Dismissing then those pretty feminine phrases, which the men condescendingly use to soften our slavish dependence, and despising that weak elegancy of mind, exquisite sensibility, and sweet docility of manners, supposed to be the sexual characteristics of the weaker vessel, I wish to show that elegance is inferior to virtue, that the first object of laudable ambition is to obtain a character as a human being, regardless of the distinction of sex; and that secondary views should be brought to this simple touchstone.

      This is a rough sketch of my plan; and should I express my conviction with the energetic emotions that I feel whenever I think of the subject, the dictates of experience and reflection will be felt by some of my readers. Animated by this important object, I shall disdain to cull my phrases or polish my style--I aim at being useful, and sincerity will render me unaffected; for wishing rather to persuade by the force of my arguments, than dazzle by the elegance of my language, I shall not waste my time in rounding periods, nor in fabricating the turgid bombast of artificial feelings, which, coming from the head, never reach the heart. I shall be employed about things, not words! and, anxious to render my sex more respectable members of society, I shall try to avoid that flowery diction which has slided from essays into novels, and from novels into familiar letters and conversation.
    prompt: |
      Which best describes the line of reasoning across the three paragraphs?
    options:
      - |
        A narrative of the writer's education, followed by advice to young readers about choosing books
      - |
        A list of complaints about men, offered in no particular order
      - |
        A comparison of British and French women, ending with a call for revolution
      - |
        A stance toward her readers (respect, not flattery), then the claim that elegance is inferior to virtue, then a plain style that practises what the claim demands
    option_explanations:
      - |
        The writer tells no story of her own schooling and gives no reading advice. The passage states a position and a method.
      - |
        The paragraphs build: the first rejects flattery, the second states what should replace it, and the third makes the writer's own style consistent with it. The order matters, so it is not a list.
      - |
        Neither nation is mentioned in the passage, and no revolution is called for. The argument concerns women in general.
      - |
        Correct. She first refuses to flatter her readers, then states the principle behind the refusal (a character “as a human being” before sex), then promises a style without flattery: “things, not words!”
    answer: 3
    explanation: |
      A line of reasoning can include the writer's own method. Wollstonecraft's plain style is the last step of her argument against "pretty feminine phrases," not a separate topic.

  - slug: u03-exam-q10
    type: multiple_choice
    topic_code: "5.C"
    source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
    points: 1
    stimulus: *ex_mw_style
    prompt: |
      In the first paragraph, Wollstonecraft says that “soft phrases, susceptibility of heart, delicacy of sentiment, and refinement of taste” are “almost synonymous with epithets of weakness.” This statement develops her argument chiefly through
    options:
      - |
        narration of an occasion on which she was flattered
      - |
        redefinition, recasting qualities her society praised in women as polite names for weakness
      - |
        classification of the different kinds of taste
      - |
        description of the appearance of fashionable women
    option_explanations:
      - |
        No occasion is narrated. The sentence makes a general claim about what certain words really mean.
      - |
        Correct. The phrases were compliments; she argues they are “almost synonymous” with insults. Changing what a term means is how definition does argumentative work.
      - |
        Taste is one item in a series; the series is not sorted into kinds. The point is what all the items have in common.
      - |
        The qualities named are of mind and manner, not appearance, and they are named rather than pictured.
    answer: 1
    explanation: |
      Watch for “synonymous with,” “what is called,” and “as ... is termed”: they signal a writer arguing by redefinition.

  - slug: u03-exam-q11
    type: multiple_choice
    topic_code: "3.A"
    source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
    points: 1
    stimulus: *ex_mw_style
    prompt: |
      Which phrase states the central claim of the second paragraph?
    options:
      - |
        “elegance is inferior to virtue”
      - |
        “Dismissing then those pretty feminine phrases”
      - |
        “sweet docility of manners”
      - |
        “supposed to be the sexual characteristics of the weaker vessel”
    option_explanations:
      - |
        Correct. After a long dismissal of what she rejects, “I wish to show that elegance is inferior to virtue” states the claim, which the paragraph extends: a character “as a human being” comes first.
      - |
        This opening phrase sets aside what she will not do. It prepares the claim rather than stating it.
      - |
        This is one of the qualities she despises, an item in the list she rejects, not her claim.
      - |
        This phrase reports the common belief she is arguing against, not her own position.
    answer: 0
    explanation: |
      In a long periodic sentence the claim often arrives late, after the writer has cleared away what she rejects. Find the main verb of the writer's own intention: here, “I wish to show.”

  - slug: u03-exam-q12
    type: multiple_choice
    topic_code: "1.B"
    source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
    points: 1
    stimulus: *ex_mw_style
    prompt: |
      The opening sentence (“My own sex, I hope, will excuse me, if I treat them like rational creatures”) reflects Wollstonecraft's understanding of her female readers chiefly by
    options:
      - |
        apologising sincerely for the harshness of the book that follows
      - |
        assuming that her female readers will not read the book
      - |
        anticipating that they expect to be flattered, and offering respect instead as a higher compliment
      - |
        asking men to explain her argument to women
    option_explanations:
      - |
        The apology is ironic. To ask pardon for treating someone as rational exposes how unusual such treatment is; she is not sorry.
      - |
        She addresses them directly as “My own sex.” The sentence assumes they are reading.
      - |
        Correct. Readers used to books that flatter their “FASCINATING graces” may find plain reasoning cold; she names that expectation and reframes respect as the truer regard.
      - |
        She speaks to women directly and treats them as able to follow an argument. Nothing asks men to mediate.
    answer: 2
    explanation: |
      Skill 1.B (spiral review): a writer shows an understanding of an audience by anticipating its expectations. An ironic apology can turn an expectation into an argument.

  - slug: u03-exam-q13
    type: multi_select
    topic_code: "5.C"
    source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
    points: 2
    partial_credit: true
    stimulus: *ex_mw_style
    prompt: |
      Which TWO contrasts does Wollstonecraft use to develop the passage? Select two.
    options:
      - |
        Treating women as rational creatures against treating them as if in perpetual childhood
      - |
        Persuading by the force of arguments against dazzling by the elegance of language
      - |
        The education of soldiers against the education of women
      - |
        The manners of the rich against the manners of the poor
    option_explanations:
      - |
        Correct. The first sentence sets “rational creatures” against “a state of perpetual childhood,” defining her stance toward her readers.
      - |
        Correct. The third paragraph contrasts persuading “by the force of my arguments” with dazzling “by the elegance of my language,” defining her style.
      - |
        Soldiers appear elsewhere in the book, not in this passage.
      - |
        Social ranks are not compared in these paragraphs.
    answer: [0, 1]
    explanation: |
      Contrast is a form of comparison. Wollstonecraft defines each of her positions by setting it against the thing she rejects.

  - slug: u03-exam-q14
    type: true_false
    topic_code: "5.A"
    source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
    points: 1
    stimulus: *ex_mw_style
    prompt: |
      True or false: Wollstonecraft's remarks about her own style in the third paragraph are unrelated to the argument she makes in the first two.
    answer: false
    explanation: |
      False. Her refusal of “flowery diction” enacts the argument of the first two paragraphs. She has just rejected the “pretty feminine phrases” that flatter women into weakness; writing plainly is how she treats her readers as “rational creatures.”

  - slug: u03-exam-q15
    type: multiple_choice
    topic_code: "5.C"
    source: 'Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)'
    points: 1
    stimulus: *ex_mw_style
    prompt: |
      The description of “that flowery diction which has slided from essays into novels, and from novels into familiar letters and conversation” contributes to the argument by
    options:
      - |
        praising novels as the best place to learn good writing
      - |
        classifying the kinds of writing published in the eighteenth century
      - |
        narrating the history of the English essay from its beginnings
      - |
        tracing a chain of cause and effect by which an artificial style spreads from books into everyday speech, implying that it shapes how women think and feel
    option_explanations:
      - |
        The novels are links in the chain of corruption, not models. The sentence criticises the style they spread.
      - |
        Essays, novels, letters and conversation are named as stages a style passes through, not sorted as categories.
      - |
        No history of the essay is told. The sentence describes a movement of style in a single sweep.
      - |
        Correct. “Slided from ... into ..., and from ... into” traces a spread, step by step, ending in conversation, where the style affects daily life. The next paragraph says such phrases “vitiate the taste” and stifle natural feeling.
    answer: 3
    explanation: |
      Cause and effect can be compressed into a single sentence of movement. The grammar (from, into, from, into) carries the causal chain.

  # ---- Set C: The Souls of Black Folk, the first decade of freedom
  - slug: u03-exam-q16
    type: multiple_choice
    topic_code: "5.C"
    source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
    points: 1
    stimulus: &ex_dubois_decade |
      *The following passage is from "Of Our Spiritual Strivings," the first chapter of W. E. B. Du Bois's The Souls of Black Folk (1903). It follows his account of the joy that greeted Emancipation. The language for race is that of Du Bois's time.*

      The Nation has not yet found peace from its sins; the freedman has not yet found in freedom his promised land. Whatever of good may have come in these years of change, the shadow of a deep disappointment rests upon the Negro people,--a disappointment all the more bitter because the unattained ideal was unbounded save by the simple ignorance of a lowly people.

      The first decade was merely a prolongation of the vain search for freedom, the boon that seemed ever barely to elude their grasp,--like a tantalizing will-o'-the-wisp, maddening and misleading the headless host. The holocaust of war, the terrors of the Ku-Klux Klan, the lies of carpet-baggers, the disorganization of industry, and the contradictory advice of friends and foes, left the bewildered serf with no new watchword beyond the old cry for freedom. As the time flew, however, he began to grasp a new idea. The ideal of liberty demanded for its attainment powerful means, and these the Fifteenth Amendment gave him. The ballot, which before he had looked upon as a visible sign of freedom, he now regarded as the chief means of gaining and perfecting the liberty with which war had partially endowed him. And why not? Had not votes made war and emancipated millions? Had not votes enfranchised the freedmen? Was anything impossible to a power that had done all this? A million black men started with renewed zeal to vote themselves into the kingdom. So the decade flew away, the revolution of 1876 came, and left the half-free serf weary, wondering, but still inspired. Slowly but steadily, in the following years, a new vision began gradually to replace the dream of political power,--a powerful movement, the rise of another ideal to guide the unguided, another pillar of fire by night after a clouded day. It was the ideal of "book-learning"; the curiosity, born of compulsory ignorance, to know and test the power of the cabalistic letters of the white man, the longing to know. Here at last seemed to have been discovered the mountain path to Canaan; longer than the highway of Emancipation and law, steep and rugged, but straight, leading to heights high enough to overlook life.
    prompt: |
      The second paragraph is developed primarily through
    options:
      - |
        a definition of the word freedom
      - |
        a narration of a people's history in stages, each marked by a new ideal (freedom, the ballot, book-learning)
      - |
        a classification of the freedmen by occupation
      - |
        a description of a single schoolroom
    option_explanations:
      - |
        Freedom is the goal pursued, but the paragraph never stops to define it. It tells how the pursuit changed over time.
      - |
        Correct. Time markers carry the paragraph (“The first decade,” “As the time flew,” “So the decade flew away,” “in the following years”), and each stage brings a new ideal. It is history told as narrative.
      - |
        The freedmen are treated as one people moving through time, not sorted by work.
      - |
        Schools are implied by “book-learning,” but no schoolroom is described. The scale is a nation over decades.
    answer: 1
    explanation: |
