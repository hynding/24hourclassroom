  - slug: u03-exam-q41
    type: short_answer
    topic_code: "5.A"
    source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
    points: 2
    prompt: |
      In two or three sentences, describe the line of reasoning by which Thoreau moves from the motto that “government is best which governs least” to the claim that a just man's place is in prison, and explain why the order of the steps matters.
    answer: |
      Thoreau begins with a motto his audience accepts, narrows his demand to “a better government,” and argues that conscience, not majority rule, should decide right and wrong. Using the analogy of the machine, he then distinguishes tolerable friction from injustice that makes a citizen its agent, which must be resisted; if the state imprisons those who resist, prison is where the just belong. The order matters because each step depends on the last: the conclusion would be dismissed if it came first, but after the earlier steps it reads as a consequence.
    explanation: |
      1 point: accurately names at least three steps in order (a shared premise or the pivot to a better government; conscience over law or majority; the machine-and-friction test or the refutation of Paley; prison for the just). 1 point: explains why the order matters (each step prepares the next, or the radical conclusion becomes acceptable only after the premises). A list of steps without explanation earns at most 1.

  - slug: u03-exam-q42
    type: short_answer
    topic_code: "6.C"
    source: written for this course
    points: 2
    prompt: |
      A student argues: *Our school should keep its library open until 6 p.m. on weekdays.* Write two or three sentences that develop this claim through cause and effect, supplying the mechanism that connects the cause to the effect.
    answer: |
      A model response: *Most of our buses leave at 3:15, but many students stay for practices and clubs that end at 5:00 and then wait for a ride with nowhere quiet to work. If the library stayed open, those students could finish homework in the gap instead of starting it at nine at night, which would mean more completed assignments and more sleep.*
    explanation: |
      1 point: the sentences state a cause and an effect relevant to the claim. 1 point: they supply the mechanism linking them (how the later hours would produce the effect). A response that only asserts the effect, or offers a comparison or story without a causal link, earns at most 1.

