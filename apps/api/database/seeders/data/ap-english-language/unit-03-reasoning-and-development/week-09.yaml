    - slug: u03-w09-q21
      type: short_answer
      topic_code: "5.A"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 2
      prompt: |
        In two or three sentences, explain how Thoreau's analogy of the machine and its friction supports his thesis about when a citizen should break the law.
      answer: |
        Thoreau grants that every machine has friction, so a citizen can tolerate small injustices as the unavoidable wear of government. But when the injustice becomes the machine's purpose, and especially when a law makes the citizen himself "the agent of injustice to another," the analogy shows that the right response is to become "a counter friction" and stop it. The analogy turns his thesis into a test a reader can apply: tolerate friction, resist a machine built for wrong.
      explanation: |
        1 point: accurately describes the analogy's distinction (tolerable friction against injustice that is organized or that uses the citizen as its agent). 1 point: explains how that distinction supports the thesis (it gives a principled line for when to break the law, or it moves the reader from patience to resistance). A response that only paraphrases the analogy earns at most 1.

