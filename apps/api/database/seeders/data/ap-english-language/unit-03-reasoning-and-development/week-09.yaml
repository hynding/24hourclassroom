    - slug: u03-w09-q17
      type: multi_select
      topic_code: "6.A"
      source: general knowledge
      points: 2
      partial_credit: true
      prompt: |
        A student's body paragraphs each give one reason for her thesis, but her teacher writes in the margin: *These are a list, not a line of reasoning.* Which TWO revisions would best address the comment? Select two.
      options:
        - |
          Add commentary after each piece of evidence that explains how it supports the paragraph's claim and how that claim advances the thesis.
        - |
          Begin each paragraph with a transition that names its logical relation to the previous one, such as a consequence, a concession or an extension.
        - |
          Add a fourth and fifth reason so the argument seems more thorough.
        - |
          Repeat the thesis word for word at the end of every paragraph.
      option_explanations:
        - |
          Correct. Commentary is what links evidence to claim and claim to thesis. Without it, reasons sit side by side and the reader cannot see the logic.
        - |
          Correct. Transitions that state a relation (therefore, granted, more importantly) show how each step depends on the last, which is what makes a list into a line.
        - |
          More reasons make a longer list. The problem is the missing connections, not the number of reasons.
        - |
          Repeating the thesis signals the topic again but does not explain how the paragraph's evidence supports it. It is a common substitute for commentary.
      answer: [0, 1]
      explanation: |
        Skill 6.A: develop a line of reasoning and the commentary that explains it. The two tools are logical transitions between claims and commentary within each claim.

