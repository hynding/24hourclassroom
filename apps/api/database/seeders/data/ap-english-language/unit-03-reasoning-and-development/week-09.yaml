      source: written for this course
      points: 2
      prompt: |
        Here is a claim and a piece of evidence from a student's argument that the school day should start later.

        Claim: *Starting school at 8:30 instead of 7:30 would make students safer, not just more rested.*
        Evidence: *In the year after a nearby district moved its start time later, car accidents involving teenage drivers on school days fell by 16 percent, according to the district's report.*

        Write two sentences of commentary that explain how the evidence supports the claim and connect it to the larger argument for a later start.
      answer: |
        A model response: *The drop in accidents suggests that tired teenagers are not only worse students but more dangerous drivers, so a later start protects them on the road as well as in class. If one schedule change can reduce something as serious as car crashes, the cost of rearranging bus routes looks small beside the lives it could protect.*
      explanation: |
        1 point: the commentary explains what the evidence implies for the claim (fatigue affects driving; a later start reduced accidents) rather than restating the statistic. 1 point: the commentary connects the claim to the larger argument (safety as a reason that outweighs objections, or as a step toward the thesis). Commentary that only repeats the figure or adds a new unsupported claim earns 0 for that point.

    - slug: u03-w09-q23
      type: long_answer
      topic_code: "6.A"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 5
      prompt: |
        Thoreau writes that "Even voting for the right is doing nothing for it." Write one well-developed argument paragraph (about 200 words) that defends, challenges or qualifies this claim. State your own claim, develop it through at least two connected steps of reasoning, support each step with specific evidence (from history, current events, your reading or your experience), and write commentary that shows how each step leads to the next.
      answer: |
        A model qualifying paragraph. Claim: voting is not nothing, but Thoreau is right that it is rarely enough. Step 1: a vote matters most when it is the last link in a chain of action others have built; the vote that ratified the Nineteenth Amendment in 1920 came after decades of marches, petitions and arrests. Commentary: the ballots counted only because protest had already changed what legislators thought possible, so the vote completed the work rather than doing it. Step 2: therefore, a citizen who only votes is relying on others to do the earlier work; when no one does it, the vote simply ratifies the status quo, as Thoreau warns. Commentary: this explains why his phrase "a cheap vote" stings: the vote is cheap not because it is useless but because it costs the voter nothing. Concluding link: voting is a necessary act whose value depends on the action around it.
      explanation: |
        5 points. Claim (1): a clear, defensible position on Thoreau's sentence (defend, challenge or qualify). Evidence (2): 2 points for specific, relevant evidence supporting at least two steps; 1 point if the evidence is general, hypothetical or supports only one step. Commentary (2): 2 points if commentary explains how each piece of evidence supports its step and how the first step leads to the second (a line of reasoning, signalled by a logical transition such as "therefore" or "granted"); 1 point if commentary is present but the steps are only listed side by side; 0 for summary or restatement.
