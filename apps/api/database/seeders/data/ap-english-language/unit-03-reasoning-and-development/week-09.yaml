    - slug: u03-w09-q14
      type: multiple_choice
      topic_code: "5.A"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 1
      prompt: |
        Early in his essay, after accepting the motto that the best government is one that "governs not at all," Thoreau writes, "I ask for, not at once no government, but at once a better government." This sentence contributes to the essay's line of reasoning chiefly by
      options:
        - |
          abandoning the argument of the opening paragraphs as too extreme
        - |
          narrowing his demand to one a practical citizen could share, which turns the essay toward the question of what a citizen should do now
        - |
          proving that government is unnecessary
        - |
          introducing the opposing view of the philosopher William Paley
      option_explanations:
        - |
          He does not abandon the opening: he keeps the ideal ("when men are prepared for it") and sets it aside for a nearer goal. The pivot refines the argument rather than dropping it.
        - |
          Correct. "To speak practically and as a citizen," he asks only for "a better government," which makes the next question unavoidable: how does a citizen get one? The rest of the essay answers it.
        - |
          The sentence explicitly asks for government, a better one. Proof that government is unnecessary is exactly what he declines to offer.
        - |
          Paley appears several pages later. This sentence turns from the opening motto, not toward an opponent.
      answer: 1
      explanation: |
        Turning points matter in a line of reasoning. Look for sentences that change the scope of the claim, and ask what new question they set up.

