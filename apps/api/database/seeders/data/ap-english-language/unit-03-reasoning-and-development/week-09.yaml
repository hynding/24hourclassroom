        Refuting an opposing view is a step in a line of reasoning when it removes an obstacle to the next claim. Ask what the writer can claim after the refutation that he could not claim before it.

    - slug: u03-w09-q16
      type: multiple_choice
      topic_code: "1.B"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 1
      prompt: |
        Thoreau insists that the opponents of reform in Massachusetts are "not a hundred thousand politicians at the South, but a hundred thousand merchants and farmers here." This claim reflects his understanding of his audience chiefly by
      options:
        - |
          flattering Northern readers that slavery is entirely a Southern problem
        - |
          suggesting that merchants and farmers should enter politics
        - |
          denying his listeners the comfort of blaming distant slaveholders, so that they see their own quiet cooperation as part of the injustice
        - |
          appealing to Southern politicians to change their views
      option_explanations:
        - |
          The sentence does the reverse: it rejects the idea that the South alone is responsible and turns the blame onto Massachusetts.
        - |
          Thoreau does not ask anyone to run for office; he distrusts conventions and voting. His point is about the cooperation of ordinary citizens.
        - |
          Correct. His Concord audience were merchants and farmers, or their neighbours. By naming them, he anticipates their belief that slavery is someone else's business and overturns it.
        - |
          Southern politicians are explicitly set aside as the wrong target. The audience addressed is "here," in Massachusetts.
      answer: 2
      explanation: |
