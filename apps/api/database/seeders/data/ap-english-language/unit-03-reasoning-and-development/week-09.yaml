      points: 1
      prompt: |
        Thoreau quotes William Paley's view that obedience depends on expediency, a weighing of "the quantity of the danger and grievance" against the cost of redressing it, and then writes, "If I have unjustly wrested a plank from a drowning man, I must restore it to him though I drown myself." How does this sequence function in the essay's line of reasoning?
      options:
        - |
          It states a respected opposing principle and then offers a case in which that principle gives the wrong answer, clearing the way for the claim that the nation must end slavery whatever the cost.
        - |
          It shows that Thoreau agrees with Paley about when resistance is justified.
        - |
          It shifts the essay's subject from government to shipwrecks and the duties of sailors.
        - |
          It provides statistical evidence about the costs of resistance.
      option_explanations:
        - |
          Correct. Paley's rule is stated fairly, then tested on a hypothetical where expediency would excuse a wrong. The next sentences apply the lesson: "This people must cease to hold slaves."
        - |
          He disagrees: "Paley appears never to have contemplated those cases to which the rule of expediency does not apply." The quotation is introduced in order to be refuted.
        - |
          The drowning man is a brief hypothetical illustration, not a new subject. Thoreau returns to slavery and Mexico in the next sentence.
        - |
          There are no figures here. The plank example is a moral thought experiment, not data.
      answer: 0
