week: 9
unit: 3
title: Line of Reasoning in Thoreau's "Civil Disobedience"
topics: ["5.A", "6.A"]
texts:
  - author: Henry David Thoreau
    title: Resistance to Civil Government ("Civil Disobedience")
    year: 1849
    url: https://www.gutenberg.org/ebooks/71
guide: guides/week-09.md
guide_description: |
  The first week of Unit 3: what a line of reasoning is, how to tell a chain of claims from a pile of reasons, and how
  commentary carries a reader from one claim to the next. Henry David Thoreau's "Resistance to Civil Government" (1849)
  as the case study: how he moves from a motto everyone accepts to the claim that an honest man belongs in jail, step
  by step, through the machine-and-friction analogy, a refutation of Paley, and the idea of a peaceable revolution.
  Four close readings, a revision lesson on an invented student argument, common mistakes, the exam link and a self-check.
flashcards_description: |
  31 cards on line of reasoning and commentary, the rhetorical situation of "Civil Disobedience", and the claims,
  analogies and turning points that carry Thoreau's argument.

flashcards:
  - front: Line of reasoning → what it means on the AP Language exam
    back: |
      The sequence of claims, each supported by evidence and connected by commentary, that leads a reader to accept the thesis. It is the argument's path, not just its parts. Skill 5.A asks you to describe it and judge whether it actually supports the thesis.
    topic_code: "5.A"
  - front: A line of reasoning vs a list of reasons
    back: |
      A list gives reasons side by side (first, second, third) without showing how they relate. A line of reasoning makes each step depend on the one before: because this is true, that follows; granting that, this further claim holds. Ask whether the reasons could be shuffled without loss. If they can, it is a list.
    hint: Could you shuffle the paragraphs?
    topic_code: "5.A"
  - front: Commentary → its job inside a line of reasoning (skill 6.A)
    back: |
      Commentary explains how a piece of evidence supports a claim and how that claim moves the argument toward the thesis. It is the connective tissue: without it a reader sees quotations and assertions but not the logic that joins them.
    topic_code: "6.A"
  - front: Commentary that only restates the evidence
    back: |
      A sentence like *This shows that the library is popular* after a survey result repeats the evidence in vaguer words. Real commentary says what the evidence implies for the claim (who would be served, what would change) and why that matters to the thesis.
    topic_code: "6.A"
  - front: Thoreau's "Civil Disobedience" → original title, date and occasion
    back: |
      Published in 1849 as "Resistance to Civil Government" in Elizabeth Peabody's collection Aesthetic Papers, from a lecture Thoreau gave at the Concord Lyceum in 1848. The title "Civil Disobedience" was attached to it after his death.
    topic_code: "1.A"
  - front: Thoreau's night in the Concord jail → what happened
    back: |
      In July 1846 Thoreau was jailed for refusing to pay his poll tax, which he had not paid for six years. He spent one night in jail; someone, probably a relative, paid the tax, and he was released the next morning, against his wishes.
    topic_code: "1.A"
  - front: Thoreau's exigence in "Civil Disobedience"
    back: |
      The Mexican War (1846-1848), which he saw as a war of conquest serving the expansion of slavery, and slavery itself, which Massachusetts citizens supported through their taxes and allegiance. His own jailing made the question personal.
    topic_code: "1.A"
  - front: Thoreau's opening motto → why he starts from agreement
    back: |
      He opens by accepting a familiar saying, "That government is best which governs least," then pushes it one step further to "governs not at all." Beginning with a principle his audience already holds lets each later step look like a consequence rather than a leap.
    topic_code: "5.A"
  - front: Thoreau's pivot from "no government" to "a better government"
    back: |
      Right after the anarchist-sounding opening he turns: "I ask for, not at once no government, but at once a better government." The pivot narrows his demand to something a practical citizen could grant, and it sets up the rest of the essay's question: what should a citizen do now?
    topic_code: "5.A"
  - front: Thoreau's claim about why majorities rule
    back: |
      Not because they are most likely to be right, nor because it is fairest, but "because they are physically the strongest." The claim strips majority rule of its moral authority, which clears the way for conscience to outrank law.
    topic_code: "3.A"
  - front: Thoreau's "men first, and subjects afterward"
    back: |
      The claim that a person's moral judgment comes before the duty to obey. It is the premise from which the rest follows: if conscience outranks law, then an unjust law need not be obeyed.
    topic_code: "3.A"
  - front: Thoreau's marching soldiers → what kind of evidence they are
    back: |
      A vivid illustrative image rather than data: soldiers "marching in admirable order" to a war against "their common sense and consciences." It works as evidence by showing, in one picture, what an undue respect for law produces: men turned into "small movable forts and magazines."
    topic_code: "3.A"
  - front: Thoreau's machine-and-friction analogy → the distinction it draws
    back: |
      All machines have friction, so some injustice is an acceptable by-product of government. But when "the friction comes to have its machine" and oppression is organized, the government itself has become the injustice. The analogy turns a vague question (how much injustice is too much?) into a test.
    topic_code: "5.A"
  - front: Thoreau's "counter friction" → where the analogy ends up
    back: |
      If a law "requires you to be the agent of injustice to another," Thoreau says, break it: "Let your life be a counter friction to stop the machine." The analogy that began as a reason for patience ends as a call to resist, so the image itself carries the line of reasoning.
    topic_code: "5.A"
  - front: Paley in "Civil Disobedience" → why Thoreau brings him in
    back: |
      William Paley, an English moral philosopher, argued that civil obedience rests on expediency: resist only when the benefits outweigh the costs. Thoreau states Paley's principle fairly, then shows a case it cannot handle. Answering the strongest opposing view is a step in the line of reasoning, not a detour.
    topic_code: "5.A"
  - front: Thoreau's plank and the drowning man → its function
    back: |
      "If I have unjustly wrested a plank from a drowning man, I must restore it to him though I drown myself." A short hypothetical case in which expediency gives the wrong answer. It refutes Paley in one sentence and prepares the claim that the nation must end slavery and the war whatever the cost.
    topic_code: "5.A"
  - front: Thoreau on voting → why it is not enough
    back: |
      He calls voting "a sort of gaming" with "a slight moral tinge." Casting a vote leaves the outcome to the majority; it expresses a wish without staking one's character. This step explains why he moves from ballots to action.
    topic_code: "3.A"
  - front: Thoreau's "majority of one"
    back: |
      His claim that "any man more right than his neighbors constitutes a majority of one already." It answers the objection that reformers should wait until they are a majority, by redefining what counts as a majority in moral questions.
    topic_code: "5.A"
  - front: Thoreau's paradox about where a just man belongs
    back: |
      "Under a government which imprisons any unjustly, the true place for a just man is also a prison." The paradox is the climax of the line of reasoning: if the law makes you an agent of injustice and you refuse, jail is where the state puts you, and that becomes the honourable place to be.
    topic_code: "3.B"
  - front: Thoreau's "peaceable revolution" → how he defines it
    back: |
      If a thousand men refused to pay their taxes, he says, that would be less violent than paying them and so enabling the state to shed innocent blood. Refusing allegiance, and officers resigning their offices, is his definition of a revolution without bloodshed.
    topic_code: "5.A"
  - front: Thoreau's real audience → his Massachusetts neighbours
    back: |
      He says the opponents of reform are "not a hundred thousand politicians at the South," but merchants and farmers at home who care more for commerce than humanity. By blaming his own audience's quiet cooperation he makes them responsible, and makes his argument their business.
    topic_code: "1.B"
  - front: Thoreau's thesis in one sentence
    back: |
      A citizen must not lend himself to the injustice he condemns: when a government requires him to support slavery and an unjust war, he should withdraw his allegiance and his taxes, and accept prison if it comes.
    topic_code: "3.B"
  - front: Thesis vs line of reasoning → how they relate
    back: |
      The thesis is the position; the line of reasoning is the route that gets a reader there. A thesis may preview that route (because..., and because...), but the body has to walk it, claim by claim.
    topic_code: "3.B"
  - front: Deductive line of reasoning
    back: |
      Starts from a general principle and applies it to a case: men have a right of revolution when tyranny is unendurable; present conditions are unendurable; so honest men may rebel now. Thoreau's essay is mostly built this way.
    topic_code: "5.A"
  - front: Inductive line of reasoning
    back: |
      Starts from particular cases or evidence and builds toward a general claim: three survey results, two case studies and a statistic lead to the conclusion that Sunday library hours would be used. Most synthesis essays lean inductive.
    topic_code: "5.A"
  - front: Judging a line of reasoning → three questions to ask
    back: |
      Does each claim follow from the one before or from its evidence? Is any step missing (a gap a reader must leap)? Does the final claim actually match the thesis, or has the argument drifted? Skill 5.A asks whether the reasoning supports the thesis, not only what it is.
    topic_code: "5.A"
  - front: A gap in reasoning → what it looks like in a draft
    back: |
      Two claims sit side by side with nothing connecting them, for example a claim that teenagers are tired followed directly by a demand to cancel homework. The writer assumes a link (homework causes the tiredness) that the reader is never shown. Fix it with a claim or commentary that states the link.
    topic_code: "6.A"
  - front: Ordering reasons → least to most important
    back: |
      Emphatic order saves the strongest reason for last so the argument builds. It works when each reason prepares for the next. Thoreau saves his most demanding conclusion, that just men belong in prison, until the reader has accepted the steps that lead to it.
    topic_code: "6.A"
  - front: Transitional words that show logical relation in a line of reasoning
    back: |
      Consequence: therefore, so, thus, as a result. Concession: granted, admittedly, even so. Contrast: but, however, yet. Extension: moreover, further, more importantly. Choose the word that names the actual relation; *also* and *another reason* only add.
    topic_code: "6.A"
  - front: Line of reasoning in the AP rhetorical analysis and argument essays
    back: |
      The Row B evidence-and-commentary score (0-4) rewards a line of reasoning: commentary that explains how evidence supports each claim and how claims build toward the thesis. A 4 sustains that line through the essay; a 2 has evidence with thin or repetitive commentary.
    topic_code: "6.A"
  - front: Thoreau's acorn and chestnut → the image that ends his jail reflection
    back: |
      Two seeds fall side by side and each grows "according to its nature." Thoreau ends his account of the state's force with a natural law: "If a plant cannot live according to its nature, it dies; and so a man." The image recasts resistance as growth, not rebellion.
    topic_code: "5.A"

quiz:
  description: |
    23 questions · about 40 minutes · line of reasoning and commentary, with spiral review of claims, evidence, thesis
    and audience. A reading set of seven questions on Thoreau's machine-and-friction passage, a revision set of six on an
    invented student argument, then questions across the week. Multiple choice, select-all and true/false items are
    graded at once; fill-in-the-blank items are matched automatically; the two short answers and the paragraph are
    graded by your teacher against the model answers and scoring notes.
  questions:
    # ---- Passage set: the machine and its friction
    - slug: u03-w09-q01
      type: multiple_choice
      topic_code: "5.A"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 1
      stimulus: &thoreau_friction |
        *The following passage is from Henry David Thoreau's "Resistance to Civil Government" (1849), later known as "Civil Disobedience." Thoreau has been asking how a citizen should behave toward a government that permits slavery and is making war on Mexico.*

        All men recognize the right of revolution; that is, the right to refuse allegiance to and to resist the government, when its tyranny or its inefficiency are great and unendurable. But almost all say that such is not the case now. But such was the case, they think, in the Revolution of ’75. If one were to tell me that this was a bad government because it taxed certain foreign commodities brought to its ports, it is most probable that I should not make an ado about it, for I can do without them: all machines have their friction; and possibly this does enough good to counter-balance the evil. At any rate, it is a great evil to make a stir about it. But when the friction comes to have its machine, and oppression and robbery are organized, I say, let us not have such a machine any longer. In other words, when a sixth of the population of a nation which has undertaken to be the refuge of liberty are slaves, and a whole country is unjustly overrun and conquered by a foreign army, and subjected to military law, I think that it is not too soon for honest men to rebel and revolutionize. What makes this duty the more urgent is that fact, that the country so overrun is not our own, but ours is the invading army.

        [...]

        If the injustice is part of the necessary friction of the machine of government, let it go, let it go: perchance it will wear smooth,—certainly the machine will wear out. If the injustice has a spring, or a pulley, or a rope, or a crank, exclusively for itself, then perhaps you may consider whether the remedy will not be worse than the evil; but if it is of such a nature that it requires you to be the agent of injustice to another, then, I say, break the law. Let your life be a counter friction to stop the machine. What I have to do is to see, at any rate, that I do not lend myself to the wrong which I condemn.
      prompt: |
        Which best describes the line of reasoning in the first paragraph?
      options:
        - |
          It lists several grievances against the government and asks the reader to choose the most serious one.
        - |
          It starts from a principle nearly everyone accepts, the right of revolution, and argues that present conditions meet the standard that principle sets.
        - |
          It narrates the events of the Revolution of 1775 to show that Americans have always resisted taxes.
        - |
          It concedes that revolution is never justified and then proposes reform through elections instead.
      option_explanations:
        - |
          The paragraph does not offer a menu of grievances. The tax on imports is raised only to be set aside, and the two real grievances (slavery and conquest) are joined into one conclusion.
        - |
          Correct. "All men recognize the right of revolution" is the shared premise; the paragraph then argues that slavery and the conquest of Mexico make "now" such a case. That is a deductive line: principle, then application.
        - |
          The Revolution of ’75 is mentioned in one clause, as what "they think" justified revolt. Nothing is narrated, and Thoreau dismisses tax grievances as too small to matter.
        - |
          The paragraph affirms the right of revolution and ends by saying it is "not too soon for honest men to rebel." It never proposes elections; elsewhere Thoreau calls voting a sort of gaming.
      answer: 1
      explanation: |
        To describe a line of reasoning, track where the paragraph starts (a premise its readers share) and where it ends (a claim they might resist). Thoreau's method is to make the ending look like the premise applied.

    - slug: u03-w09-q02
      type: multiple_choice
      topic_code: "3.A"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 1
      stimulus: *thoreau_friction
      prompt: |
        What evidence does Thoreau offer in the first paragraph that the present case, unlike a tax on imports, justifies resistance?
      options:
        - |
          A legal ruling that the Mexican War violated the Constitution
        - |
          The testimony of soldiers who refused to serve in Mexico
        - |
          A comparison between the taxes of 1775 and those of his own day
        - |
          The facts that a sixth of the population of a nation founded on liberty are enslaved and that another country has been invaded and conquered
      option_explanations:
        - |
          No court or ruling appears in the passage. Thoreau's appeal is moral, not legal, and he later says the Constitution itself is part of the evil.
        - |
          No soldiers testify here. Thoreau imagines soldiers elsewhere in the essay, but this paragraph's evidence is two public facts every reader knew.
        - |
          Thoreau does not compare tax rates; he sets taxes aside as mere friction. The point of the paragraph is that the present evil is of a different kind, not a larger amount.
        - |
          Correct. "A sixth of the population" enslaved in "the refuge of liberty," and "a whole country" overrun by "a foreign army," are the evidence. The contrast with the trivial import tax makes them look unendurable by comparison.
      answer: 3
      explanation: |
        Skill 3.A (spiral review): identify the evidence that supports a specific claim. Here the evidence is factual and widely known, and its force comes from the juxtaposition of "slaves" with "refuge of liberty."

    - slug: u03-w09-q03
      type: multiple_choice
      topic_code: "5.A"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 1
      stimulus: *thoreau_friction
      prompt: |
        Thoreau's remark that he "should not make an ado" about a tax on foreign commodities functions in the line of reasoning chiefly as
      options:
        - |
          a concession that some injustice is tolerable, which sets a threshold the present evils will be shown to cross
        - |
          evidence that Thoreau personally benefited from imported goods
        - |
          a digression that interrupts the argument and is never connected to it
        - |
          a claim that all taxation is a form of robbery
      option_explanations:
        - |
          Correct. By granting that minor faults are "friction" a good citizen can bear, Thoreau shows he is not a hothead. The concession makes his later demand look measured: these evils are not friction but the machine itself.
        - |
          He says the opposite: he can "do without" the imports. The remark is about how little such a grievance matters, not about his own consumption.
        - |
          The example is tied directly to the next sentence: "But when the friction comes to have its machine." It is the first half of a contrast, not a digression.
        - |
          Of the import tax he grants that "possibly this does enough good to counter-balance the evil," which is close to a defence of it. That is the opposite of calling all taxation robbery.
      answer: 0
      explanation: |
        A concession is often a step in a line of reasoning: it narrows the claim and builds the writer's credibility. Ask what the conceded point lets the writer say next.

    - slug: u03-w09-q04
      type: multiple_choice
      topic_code: "5.A"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 1
      stimulus: *thoreau_friction
      prompt: |
        The phrase "when the friction comes to have its machine" contributes to the argument by
      options:
        - |
          suggesting that government will collapse on its own if left alone
        - |
          praising the efficiency of the American government
        - |
          reversing the relation in the analogy, so that injustice is no longer a by-product of government but the purpose the machinery serves
        - |
          admitting that Thoreau does not understand how machines work
      option_explanations:
        - |
          The hope that the machine "will wear out" applies only to ordinary friction, in the second paragraph. This phrase marks the case where waiting is not acceptable.
        - |
          The phrase describes a machine organized for "oppression and robbery." It condemns the government's purpose; it does not praise its efficiency.
        - |
          Correct. Normally a machine has friction; here the friction "has" a machine, as if the injustice owned the government. The inversion is the hinge between tolerable and intolerable wrong.
        - |
          The analogy is controlled and precise. Thoreau uses the mechanical terms (friction, spring, pulley, crank) exactly to make his distinction.
      answer: 2
      explanation: |
        When an analogy carries an argument, follow how the writer bends it. Thoreau's line of reasoning turns on a grammatical reversal: friction-of-the-machine becomes machine-of-the-friction.

    - slug: u03-w09-q05
      type: multi_select
      topic_code: "5.A"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 2
      partial_credit: true
      stimulus: *thoreau_friction
      prompt: |
        Which TWO steps belong to the line of reasoning of the second paragraph? Select two.
      options:
        - |
          Injustice that is only incidental friction may be left alone in the hope that it wears away.
        - |
          When a law requires a person to be the agent of injustice to another, that person should break the law.
        - |
          Reformers should wait until they have persuaded a majority before acting.
        - |
          Violent overthrow of the government is the only remedy for organized injustice.
      option_explanations:
        - |
          Correct. "If the injustice is part of the necessary friction of the machine of government, let it go" is the first rung of the paragraph's ladder of cases.
        - |
          Correct. The last case, injustice that "requires you to be the agent of injustice to another," produces the conclusion: "break the law."
        - |
          The paragraph does not mention majorities. Elsewhere Thoreau rejects waiting for one; this paragraph moves straight from the kind of injustice to the action it calls for.
        - |
          The remedy proposed is personal refusal, "a counter friction," not violence. The essay later defines its goal as a peaceable revolution.
      answer: [0, 1]
      explanation: |
        The second paragraph is built as a graded series of cases (friction, a part made for injustice, injustice that uses you as its agent), each with its own response. Seeing the series is seeing the line of reasoning.

    - slug: u03-w09-q06
      type: true_false
      topic_code: "1.A"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 1
      stimulus: *thoreau_friction
      prompt: |
        True or false: Thoreau presents the fact that the United States is the invading army, not the invaded country, as making the duty to resist more urgent for his readers.
      answer: true
      explanation: |
        True. "What makes this duty the more urgent is that fact, that the country so overrun is not our own, but ours is the invading army." The detail about the rhetorical situation matters: his readers are not victims who may resist, but citizens of the aggressor who are responsible.

    - slug: u03-w09-q07
      type: multiple_choice
      topic_code: "3.B"
      source: 'Henry David Thoreau, "Civil Disobedience" (1849)'
      points: 1
      stimulus: *thoreau_friction
      prompt: |
        Which statement best expresses the overarching thesis that this passage advances?
      options:
        - |
          A citizen should refuse to support a government, even by breaking its laws, when that government makes him an agent of serious injustice to others.
        - |
          Americans should honour the memory of the Revolution of 1775 by paying their taxes.
        - |
          Machines are a useful way to think about all political questions.
        - |
          The United States should annex Mexico to end the war quickly.
      option_explanations:
        - |
          Correct. Both paragraphs converge on it: the first argues that honest men may "rebel and revolutionize," the second that one must not "lend myself to the wrong which I condemn."
        - |
          The Revolution is cited as the case people accept as justified, not as a reason to pay taxes. Thoreau is arguing for refusing support, not for paying.
        - |
          The machine is the analogy that serves the thesis; it is not the thesis. Mistaking the vehicle of an argument for its claim is a common error.
        - |
          Thoreau condemns the conquest of Mexico as an unjust invasion. He argues against the war, not for annexation.
      answer: 0
      explanation: |
        Skill 3.B (spiral review): a thesis is the position the line of reasoning defends. State it as a claim someone could dispute, and check that every step in the passage points toward it.

    # ---- Revision set: an invented student argument
    - slug: u03-w09-q08
      type: multiple_choice
      topic_code: "6.A"
      source: written for this course
      points: 1
      stimulus: &w09_library |
        *The following is a draft paragraph written for this course: a student's letter to a town council. The sentences are numbered for the questions.*

        (1) The town council should open the public library on Sunday afternoons. (2) Sunday is the one day many working families have free, yet it is the one day the library is closed. (3) The library building is beautiful, with tall windows that were added in 1911. (4) In a survey of 300 residents conducted by the library's board last spring, 61 percent said they would visit on Sunday afternoons. (5) Students also need a quiet place to study before Monday tests. (6) Some council members worry that paying staff for an extra day would strain the budget. (7) Libraries are important to every community.
      prompt: |
        The writer wants to delete the sentence that does the least to advance the paragraph's line of reasoning. Which sentence should be deleted?
      options:
        - |
          Sentence 2
        - |
          Sentence 4
        - |
          Sentence 3
        - |
          Sentence 5
      option_explanations:
        - |
          Sentence 2 supplies the first reason: the library is closed on the day working families are free. Removing it would cut the argument's starting point.
        - |
          Sentence 4 is the paragraph's strongest evidence, a survey showing that residents would use Sunday hours. It should stay and be explained, not cut.
        - |
          Correct. The beauty of the windows has nothing to do with when the library should be open. It neither supports a reason nor connects one claim to another.
        - |
          Sentence 5 adds a second group who would benefit, students. It needs support, but it belongs to the line of reasoning.
      answer: 2
      explanation: |
        A sentence advances a line of reasoning when it supports a claim or links one claim to the next. Interesting but unconnected facts weaken an argument by making the reader search for a link that is not there.

    - slug: u03-w09-q09
      type: multiple_choice
      topic_code: "6.A"
      source: written for this course
      points: 1
      stimulus: *w09_library
      prompt: |
        The writer wants to add a sentence of commentary after sentence 4 that explains how the survey supports the thesis. Which sentence best accomplishes this goal?
      options:
        - |
          Surveys are a common way for organizations to measure public opinion.
        - |
          The survey was carried out by the library's own board.
        - |
          Sixty-one percent is more than half of the people surveyed.
        - |
          If even a fraction of those residents came, Sunday hours would reach the people the library now misses most: those who work during every hour it is open.
      option_explanations:
        - |
          A general remark about surveys explains nothing about this survey or this thesis. It moves away from the argument instead of along it.
        - |
          This repeats a detail already in sentence 4. Repetition is not commentary, and naming the board's role may even invite doubts about bias.
        - |
          Restating the statistic in other words is the classic form of empty commentary: it tells the reader what they have just read.
        - |
          Correct. The sentence draws out what the number implies (new users, not regulars) and ties it to the paragraph's first reason, the working families of sentence 2.
      answer: 3
      explanation: |
        Strong commentary answers "so what?" for the specific claim: what the evidence implies, for whom, and how it moves the reader toward the thesis.

    - slug: u03-w09-q10
      type: multiple_choice
      topic_code: "6.A"
      source: written for this course
      points: 1
      stimulus: *w09_library
      prompt: |
        The writer wants to replace sentence 7 with a conclusion that ties the line of reasoning back to the thesis. Which version best accomplishes this goal?
      options:
        - |
          Libraries have existed in one form or another for thousands of years.
        - |
          A few paid Sunday hours would turn a building that is closed on families' one free day into a place they can actually use, which is the reason a library exists.
        - |
          In conclusion, libraries are very, very important to everyone.
        - |
          Some people prefer to read electronic books at home anyway.
      option_explanations:
        - |
          A historical generalisation drifts away from the specific proposal. It ends the paragraph on a fact the argument never needed.
        - |
          Correct. The sentence gathers the reasons (families' free day, use, modest cost) and lands them on the thesis, closing the loop the paragraph opened.
        - |
          Adding intensifiers to a vague claim does not connect it to anything. The sentence would leave the line of reasoning unfinished.
        - |
          This raises an objection without answering it, ending the paragraph by undercutting its own case.
      answer: 1
      explanation: |
        A concluding sentence in an argument should show where the line of reasoning has arrived, not announce a new or vaguer idea.

    - slug: u03-w09-q11
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
