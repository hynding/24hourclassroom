    - slug: u03-w11-q23
      type: short_answer
      topic_code: "5.C"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 2
      prompt: |
        In two or three sentences, explain how Du Bois's story of the refused visiting-card prepares readers for his definition of double-consciousness.
      answer: |
        The visiting-card story lets readers experience, through one ordinary schoolroom moment, what it is to be suddenly seen as different and “shut out from their world by a vast veil.” When Du Bois then defines double-consciousness as always looking at oneself “through the eyes of others,” readers already know the feeling from the story, so the definition names something they have just felt rather than an abstraction. The narrative makes the concept credible and the definition makes the story general.
      explanation: |
        1 point: accurately describes the story and what it shows (sudden exclusion, the veil, being seen as different). 1 point: explains how it prepares the definition (it makes the abstract concept felt, or the definition generalises what the story showed). A response that summarises both without connecting them earns at most 1.

    - slug: u03-w11-q24
      type: short_answer
      topic_code: "6.C"
      source: written for this course
      points: 2
      prompt: |
        A student argues that her school should give students a short break between every class. Her claim: *Five minutes between classes is not enough to change rooms in a building this size.* Write two or three sentences that develop this claim through ONE method of development (narration, description, comparison or cause and effect). Name the method you chose.
      answer: |
        A model response (cause and effect): *The science wing is at the far end of the second floor, so a student leaving the gym must cross the whole building and climb a staircase that becomes a bottleneck when eight hundred people use it at once. Students who stop at a locker arrive late, and teachers then spend the first minutes of class repeating instructions, which costs every student in the room time.*
      explanation: |
        1 point: the sentences clearly use the named method (a specific narrative, concrete description, a stated comparison, or a cause with its mechanism). 1 point: the method advances the claim, showing why five minutes is not enough, rather than decorating it. Sentences that merely restate the claim earn 0.

    - slug: u03-w11-q25
      type: long_answer
      topic_code: "6.C"
      source: written for this course
      points: 5
      prompt: |
        Choose a change you would like to see in your school or community. Write one well-developed argument paragraph (about 200-250 words) in support of it that uses at least TWO different methods of development (for example, a brief narrative and a cause-and-effect explanation, or a definition and a comparison). Begin with a clear claim, and make sure each method advances the argument. After the paragraph, add one sentence naming the methods you used and why you chose them for your audience.
      answer: |
        A model paragraph, for a town council: *Our town should paint crosswalks and add a flashing signal at the corner of Main and Third, because the intersection is dangerous by design, not by bad luck. Last October a seventh grader on her way to the library was clipped by a turning truck there; she recovered, but the driver said he never saw her. That is not surprising: the corner sits just past a curve, so drivers turning left look for oncoming cars and not for pedestrians, and the old crosswalk has faded until it is almost invisible. The intersection at Main and First has the same curve and the same traffic, yet since it got a signal three years ago it has had no reported collisions involving people on foot. A few hundred dollars of paint and a signal would turn Third Street into First Street.* Methods: narration to make the danger concrete, cause and effect to show why it happens, and comparison to show that the fix works, because a council needs to see the problem, understand it, and trust the remedy.
      explanation: |
        5 points. Claim (1): a clear, specific, arguable claim for a change. Development (2): 2 points if two different methods are used skilfully and each clearly advances the claim; 1 point if two methods are present but one only decorates, or only one method is developed. Commentary and connection (2): 2 points if the paragraph explains how each piece of development supports the claim and the closing sentence gives an audience-based reason for the choices; 1 point if commentary is thin or the explanation of choices is generic; 0 if the paragraph is mostly assertion.
