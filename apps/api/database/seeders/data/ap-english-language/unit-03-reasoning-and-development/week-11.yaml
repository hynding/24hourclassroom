      option_explanations:
        - |
          Correct. This supplies the mechanism: the people most likely to vandalise have moved to a supervised place.
        - |
          Correct. The before-and-after figures show the effect, and the comparison with other neighbourhoods helps rule out a town-wide change as the cause.
        - |
          The park's colours are description that has nothing to do with vandalism downtown.
        - |
          A classification of skateboards develops a different subject entirely and does nothing for the causal claim.
