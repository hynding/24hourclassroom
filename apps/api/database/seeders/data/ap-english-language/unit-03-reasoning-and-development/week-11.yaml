    # ---- Passage set: the end of "Of the Meaning of Progress"
    - slug: u03-w11-q14
      type: multiple_choice
      topic_code: "5.C"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 1
      stimulus: &dubois_progress |
        *The following passages are from "Of the Meaning of Progress," the fourth chapter of W. E. B. Du Bois's The Souls of Black Folk (1903). As a college student, Du Bois has walked the hills of rural Tennessee looking for a country school to teach; he returns ten years later. The first passage is from early in the chapter; the second is its ending.*

        Sprinkled over hill and dale lay cabins and farmhouses, shut out from the world by the forests and the rolling hills toward the east. There I found at last a little school. Josie told me of it; she was a thin, homely girl of twenty, with a dark-brown face and thick, hard hair. I had crossed the stream at Watertown, and rested under the great willows; then I had gone to the little cabin in the lot where Josie was resting on her way to town. The gaunt farmer made me welcome, and Josie, hearing my errand, told me anxiously that they wanted a school over the hill; that but once since the war had a teacher been there; that she herself longed to learn,--and thus she ran on, talking fast and loud, with much earnestness and energy.

        [...]

        My journey was done, and behind me lay hill and dale, and Life and Death. How shall man measure Progress there where the dark-faced Josie lies? How many heartfuls of sorrow shall balance a bushel of wheat? How hard a thing is life to the lowly, and yet how human and real! And all this life and love and strife and failure,--is it the twilight of nightfall or the flush of some faint-dawning day?

        Thus sadly musing, I rode to Nashville in the Jim Crow car.
      prompt: |
        In the first passage, the description of Josie (her appearance, her anxious errand, her talk “fast and loud, with much earnestness and energy”) primarily serves to
      options:
        - |
          suggest that Josie is too talkative to be a good student
        - |
          explain how to find the school's location on a map
        - |
          make Josie a vivid, particular person whose hunger to learn the reader shares, so that the chapter's later question about progress is asked about her rather than about an abstraction
        - |
          classify the families of the district by their wealth
      option_explanations:
        - |
          Her earnestness is presented as admirable; the narrator later calls her “the centre of the family.” Nothing suggests her talk is a fault.
        - |
          The places named (the stream at Watertown, the great willows) give the scene reality, but the passage is not directions. The focus is Josie.
        - |
          Correct. Concrete description (thin, homely, longing to learn, talking with “earnestness and energy”) makes readers care about her. When the ending says “there where the dark-faced Josie lies,” the loss is felt.
        - |
          No families are sorted. The passage introduces one family through one young woman.
      answer: 2
      explanation: |
        Skill 5.C (spiral review): description in an argument makes the reader care about what the argument will weigh. Du Bois invests in Josie early so her death carries the chapter's argument.

    - slug: u03-w11-q15
      type: multiple_choice
      topic_code: "5.C"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 1
      stimulus: *dubois_progress
      prompt: |
        In the second passage, the questions “How shall man measure Progress there where the dark-faced Josie lies? How many heartfuls of sorrow shall balance a bushel of wheat?” function primarily to
      options:
        - |
          turn the chapter's narrative into an argument, challenging the idea that material gains can measure progress when they are set against human loss
        - |
          request specific statistics on wheat production in Tennessee
        - |
          suggest that Josie's family has become wealthy
        - |
          introduce a new character who will be described in the next chapter
      option_explanations:
        - |
          Correct. After a chapter of story and description, the questions state the argument: “Progress” measured in acres and wheat cannot be weighed against “heartfuls of sorrow.” The narration becomes evidence for that claim.
        - |
          The “bushel of wheat” is a figure for material gain, not a request for data. The questions are rhetorical.
        - |
          The question “there where the dark-faced Josie lies” refers to her grave. The passage is about loss, not wealth.
        - |
          No new person is introduced; the questions look back on the people of the chapter.
      answer: 0
      explanation: |
        Narration can be a whole line of reasoning when its ending tells the reader what the story was evidence for. Rhetorical questions are a common way to make that turn.

    - slug: u03-w11-q16
      type: multiple_choice
      topic_code: "5.A"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 1
      stimulus: *dubois_progress
      prompt: |
        The final sentence, “Thus sadly musing, I rode to Nashville in the Jim Crow car,” contributes to the chapter's line of reasoning by
      options:
        - |
          revealing that the narrator's journey ended happily
        - |
          answering the preceding questions with a concrete detail rather than a statement: the educated narrator himself is still segregated, so progress is visibly limited
        - |
          shifting the subject from progress to the history of railways
        - |
          contradicting everything the chapter has said about Josie
      option_explanations:
        - |
          “Sadly musing” sets the mood plainly. The ending is sober, not happy.
        - |
          Correct. The questions ask whether the age is “twilight” or “dawning day”; the last image, a segregated railway car carrying a college-educated man, answers with evidence the reader cannot ignore.
        - |
          The railway car matters because it is segregated, not because it is a train. The subject is still progress.
        - |
          The ending completes what the chapter said about Josie: her death and his segregated ride together measure how little has changed.
      answer: 1
      explanation: |
        Skill 5.A (spiral review): the last step of a line of reasoning need not be stated. A final concrete detail can carry the conclusion, leaving the reader to draw it.

    # ---- Across the week
    - slug: u03-w11-q17
      type: multiple_choice
      topic_code: "5.C"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 1
      prompt: |
        Du Bois writes that the “double-aimed struggle of the black artisan” to escape white contempt and to serve a poor community “could only result in making him a poor craftsman, for he had but half a heart in either cause.” The sentence develops his argument chiefly through
      options:
        - |
          narration of one craftsman's life story
        - |
          classification of all the trades open to Black workers
        - |
          description of the tools a craftsman uses
        - |
          cause and effect, tracing what looks like weakness to the divided aims imposed on the worker
      option_explanations:
        - |
          No particular craftsman is named and no events are told in sequence. The artisan is a representative type.
        - |
          The sentence treats one kind of worker; the passage goes on to ministers, scholars and artists, but as further examples of the same cause, not as a classification of trades.
        - |
          Nothing in the sentence describes tools or workmanship. Its interest is in the worker's divided motives.
        - |
          Correct. “Could only result in” states the effect; “for he had but half a heart in either cause” states the cause. The example illustrates the claim that what observers call weakness is “the contradiction of double aims.”
      answer: 3
      explanation: |
        A causal claim can overturn a judgment: if the poor workmanship has a cause outside the worker's character, the reader's verdict on him must change.

    - slug: u03-w11-q18
      type: multiple_choice
      topic_code: "6.C"
      source: general knowledge
      points: 1
      prompt: |
        A student wants to persuade classmates who have never visited the town food bank that its shelves are often nearly empty by the middle of the week. Which method of development would best serve this purpose at the start of her argument?
      options:
        - |
          A classification of the types of canned goods the food bank accepts
        - |
          A description of the shelves on an ordinary Wednesday afternoon, rendered in concrete detail
        - |
          A dictionary definition of the word hunger
        - |
          A narrative of how the food bank was founded forty years ago
      option_explanations:
        - |
          Sorting canned goods tells readers what the food bank wants, not that it is running short. It does not address their doubt.
        - |
          Correct. Her readers have not seen the problem, so she should let them see it: bare shelves, a few dented cans, a line still at the door. Description makes the claim visible.
        - |
          Her readers know what hunger means. A dictionary definition does not show that this food bank is running out.
        - |
          The founding story may be interesting, but it is about the past. It does not show the present shortage her claim depends on.
      answer: 1
      explanation: |
        Skill 6.C: match the method to what the reader needs. Readers who have not seen a problem need description or narration before they will accept any argument about it.

