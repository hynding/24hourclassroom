week: 11
unit: 3
title: Developing an Argument with Du Bois's "The Souls of Black Folk"
topics: ["6.C"]
texts:
  - author: W. E. B. Du Bois
    title: The Souls of Black Folk
    year: 1903
    url: https://www.gutenberg.org/ebooks/408
guide: guides/week-11.md
guide_description: |
  How to choose and use methods of development in your own arguments: matching each method to what your reader needs,
  and writing narration, description, comparison, definition, cause and effect and classification that advance a claim
  instead of decorating it. W. E. B. Du Bois's The Souls of Black Folk (1903) as the model: a childhood story that
  becomes a definition of double consciousness, a causal argument that turns apparent weakness into "double aims", and
  a narrative essay that ends as a question about progress. Close readings, a revision lesson, mistakes, exam link, self-check.
flashcards_description: |
  30 cards on choosing and writing methods of development for an argument, and on the occasion, audience, stories,
  definitions and images of The Souls of Black Folk.

flashcards:
  - front: Skill 6.C → the question to ask before choosing a method of development
    back: |
      What does my reader need, at this point, in order to accept this claim? Choose the method that supplies it. The method serves the claim; you never pick a method first and then look for something to say with it.
    topic_code: "6.C"
  - front: Your reader doubts the problem is real → which methods to use
    back: |
      Description or narration. A concrete picture or a brief, specific case lets the reader witness the problem. Pair it with broader evidence so the case cannot be dismissed as unusual.
    topic_code: "6.C"
  - front: Your reader misunderstands or disputes a key term → which method to use
    back: |
      Definition. Say what you mean by the term, distinguish it from the meaning your opponent assumes, and show how your meaning changes the question.
    topic_code: "6.C"
  - front: Your reader thinks the problem is natural or inevitable → which method to use
    back: |
      Cause and effect. Show where the problem comes from and how the cause works; a problem with a cause has a possible remedy.
    topic_code: "6.C"
  - front: Your reader thinks two cases are unrelated → which method to use
    back: |
      Comparison. Show that the cases are alike in the respect that matters, so that what the reader already accepts about one carries over to the other.
    topic_code: "6.C"
  - front: Your reader sees a crowded subject as one lump → which method to use
    back: |
      Classification. Sort the subject into kinds, so you can show that one kind is being ignored, or answer each kind of opposing argument in turn.
    topic_code: "6.C"
  - front: Writing narration inside an argument → three rules
    back: |
      Keep it brief (a few sentences, not a page). Make it specific (a place, a time, a concrete detail). Tie it to the claim with commentary, so the reader knows what the story proves.
    topic_code: "6.C"
  - front: Writing description inside an argument → the test for each detail
    back: |
      Keep a detail only if it helps the reader judge what you want judged. A description of an empty food-bank shelf on a Wednesday serves an argument about need; the colour of the building's door does not.
    topic_code: "6.C"
  - front: Writing a comparison inside an argument → the two things to state
    back: |
      The point of likeness that matters to the claim, and, often, a telling difference. *A tree is like an air conditioner* says nothing; *it cools like one but needs no electricity* argues.
    topic_code: "6.C"
  - front: Writing a definition inside an argument → why not quote the dictionary
    back: |
      A dictionary opening tells the reader what everyone already knows. An argumentative definition stipulates the meaning you will use and shows why it matters: *By "success" I mean what a student can do in June that she could not do in September.*
    topic_code: "6.C"
  - front: Writing cause and effect inside an argument → the missing middle
    back: |
      Supply the mechanism between cause and effect, and qualify the claim if other causes may contribute. *Phones hurt grades* is a slogan; *phones in pockets interrupt homework every few minutes, and each interruption costs time to refocus* is an argument.
    topic_code: "6.C"
  - front: Writing classification inside an argument → what makes categories useful
    back: |
      The categories should be parallel (sorted by one principle), cover the subject, and each lead somewhere. Sorting for its own sake is a list; sorting that reveals a neglected group is an argument.
    topic_code: "6.C"
  - front: The Souls of Black Folk → date and form
    back: |
      Published in Chicago in 1903: fourteen essays, several revised from magazine articles, each opened by lines of poetry and a bar of a spiritual. It mixes autobiography, history, sociology, narrative and argument.
    topic_code: "1.A"
  - front: W. E. B. Du Bois → who he was in 1903
    back: |
      A historian and sociologist (1868-1963), born in Great Barrington, Massachusetts; the first African American to earn a Ph.D. from Harvard (1895); then a professor at Atlanta University studying the conditions of Black Americans.
    topic_code: "1.A"
  - front: Du Bois's exigence in The Souls of Black Folk
    back: |
      The spread of segregation laws and the disfranchisement of Black voters in the South, lynching, and a national mood that called Black Americans a problem. He also disputed the leading Black spokesman of the day, Booker T. Washington, who urged accommodation and industrial training.
    topic_code: "1.A"
  - front: Du Bois's audience → the "Gentle Reader"
    back: |
      The Forethought addresses a "Gentle Reader," chiefly the white American public who had never seen life from behind the veil. The book also speaks to Black readers, naming an experience many shared. Writing for both shapes his choice of methods.
    topic_code: "1.B"
  - front: Du Bois's Forethought → the sentence about the century's problem
    back: |
      "The problem of the Twentieth Century is the problem of the color line." The claim announces the book's subject and its scale: not a regional issue but the central question of the coming century.
    topic_code: "3.B"
  - front: Du Bois's unasked question
    back: |
      "How does it feel to be a problem?" White acquaintances circle it with substitutes ("I know an excellent colored man in my town") instead of asking. Opening with the question names the reader's own evasion and turns the book toward the inner experience that statistics leave out.
    topic_code: "1.A"
  - front: Du Bois's visiting-card story → method and purpose
    back: |
      Narration: as a boy in a New England schoolhouse, his card is refused "peremptorily, with a glance" by a newcomer. The brief, concrete story lets readers who have never felt exclusion feel it, and it prepares the general definition that follows.
    topic_code: "5.C"
  - front: Du Bois's veil → what the metaphor does
    back: |
      The schoolhouse moment shows him "shut out from their world by a vast veil." The veil recurs through the book: a barrier that lets those behind it see out but keeps others from seeing in. It links the personal story to the general condition.
    topic_code: "5.C"
  - front: Du Bois's double-consciousness → his definition
    back: |
      "This sense of always looking at one's self through the eyes of others, of measuring one's soul by the tape of a world that looks on in amused contempt and pity." Definition turns the feeling dramatised in the story into a named condition readers can recognise and discuss.
    topic_code: "5.C"
  - front: Du Bois's "twoness"
    back: |
      His compressed description of double consciousness: "two souls, two thoughts, two unreconciled strivings; two warring ideals in one dark body." The repeated "two" makes the division audible in the syntax.
    topic_code: "5.C"
  - front: Du Bois on merging the double self → what the striver wants
    back: |
      Not to lose either self. He would not “Africanize America,” and he would not bleach his soul in “a flood of white Americanism.” He wants to be both Black and American without “having the doors of Opportunity closed roughly in his face.”
    topic_code: "3.A"
  - front: Du Bois's "contradiction of double aims"
    back: |
      A causal redefinition. What observers call weakness, he says, is not weakness but "the contradiction of double aims": pulled between two audiences and two ideals, the striver gives "but half a heart" to each. Cause and effect overturns a common judgment.
    topic_code: "5.C"
  - front: Du Bois's Black artisan → example of a causal claim
    back: |
      Trying both to escape white contempt and to serve a poor community, the artisan's "double-aimed struggle" could "only result in making him a poor craftsman." The example supplies the mechanism behind the general claim about double aims.
    topic_code: "5.C"
  - front: Du Bois's "Of the Meaning of Progress" → narration as argument
    back: |
      The fourth essay narrates his summers teaching in a rural Tennessee school as a college student and his return ten years later. The story of one community, especially of his pupil Josie, becomes evidence about what "progress" has meant since Emancipation.
    topic_code: "5.C"
  - front: Du Bois's Josie → what the description does
    back: |
      "A thin, homely girl of twenty" who longed to learn and seemed "the centre of the family." Concrete description makes her ambition and her later death matter to readers, so that the essay's question about progress is asked about a person, not an abstraction.
    topic_code: "5.C"
  - front: Du Bois's closing questions about progress
    back: |
      "How shall man measure Progress there where the dark-faced Josie lies? How many heartfuls of sorrow shall balance a bushel of wheat?" After narration and description, the questions turn the story into an argument: material gains cannot be weighed against human loss.
    topic_code: "5.C"
  - front: Du Bois's "Jim Crow car" → why end the essay there
    back: |
      "Thus sadly musing, I rode to Nashville in the Jim Crow car." The final narrative detail answers the essay's question without stating an answer: the educated narrator himself rides in a segregated car, so progress is visibly limited.
    topic_code: "5.C"
  - front: Du Bois's line of reasoning in his first chapter
    back: |
      Particular to general: the unasked question, then a childhood story, then a definition of double consciousness, then its effects on history and on Black workers, artists and scholars. Each method prepares the next, so the line moves from feeling to concept to consequence.
    topic_code: "5.A"

quiz:
  description: |
    25 questions · about 40 minutes · using methods of development in your own arguments, with spiral review of
    methods in reading, line of reasoning, claims and audience. A reading set of seven questions on the opening of
    The Souls of Black Folk, a revision set of six on an invented student argument, a set of three on the end of
    "Of the Meaning of Progress", then questions across the week.
    Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the two short answers and the paragraph are graded by your teacher against the model answers and
    scoring notes.
  questions:
    # ---- Passage set: the opening of "Of Our Spiritual Strivings"
    - slug: u03-w11-q01
      type: multiple_choice
      topic_code: "5.C"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 1
      stimulus: &dubois_strivings |
        *The following passage is from "Of Our Spiritual Strivings," the first chapter of W. E. B. Du Bois's The Souls of Black Folk (1903). The language for race is that of Du Bois's time.*

        Between me and the other world there is ever an unasked question: unasked by some through feelings of delicacy; by others through the difficulty of rightly framing it. All, nevertheless, flutter round it. They approach me in a half-hesitant sort of way, eye me curiously or compassionately, and then, instead of saying directly, How does it feel to be a problem? they say, I know an excellent colored man in my town; or, I fought at Mechanicsville; or, Do not these Southern outrages make your blood boil? At these I smile, or am interested, or reduce the boiling to a simmer, as the occasion may require. To the real question, How does it feel to be a problem? I answer seldom a word.

        And yet, being a problem is a strange experience,--peculiar even for one who has never been anything else, save perhaps in babyhood and in Europe. It is in the early days of rollicking boyhood that the revelation first bursts upon one, all in a day, as it were. I remember well when the shadow swept across me. I was a little thing, away up in the hills of New England, where the dark Housatonic winds between Hoosac and Taghkanic to the sea. In a wee wooden schoolhouse, something put it into the boys' and girls' heads to buy gorgeous visiting-cards--ten cents a package--and exchange. The exchange was merry, till one girl, a tall newcomer, refused my card,--refused it peremptorily, with a glance. Then it dawned upon me with a certain suddenness that I was different from the others; or like, mayhap, in heart and life and longing, but shut out from their world by a vast veil.

        [...]

        After the Egyptian and Indian, the Greek and Roman, the Teuton and Mongolian, the Negro is a sort of seventh son, born with a veil, and gifted with second-sight in this American world,--a world which yields him no true self-consciousness, but only lets him see himself through the revelation of the other world. It is a peculiar sensation, this double-consciousness, this sense of always looking at one's self through the eyes of others, of measuring one's soul by the tape of a world that looks on in amused contempt and pity. One ever feels his twoness,--an American, a Negro; two souls, two thoughts, two unreconciled strivings; two warring ideals in one dark body, whose dogged strength alone keeps it from being torn asunder.
      prompt: |
        The second paragraph develops the claim that "being a problem is a strange experience" primarily through
      options:
        - |
          a definition of the word "problem" drawn from a dictionary
        - |
          a classification of the different kinds of prejudice in New England
        - |
          a comparison between childhood in New England and childhood in Europe
        - |
          the narration of a single childhood incident, told in concrete detail
      option_explanations:
        - |
          The paragraph never defines "problem." It shows what being treated as one felt like, through an event.
        - |
          No kinds of prejudice are sorted or listed. The paragraph tells one moment of exclusion, not a typology.
        - |
          Europe is mentioned in a passing aside ("save perhaps in babyhood and in Europe"); the paragraph does not develop a comparison between places.
        - |
          Correct. "I remember well when the shadow swept across me": the paragraph narrates the exchange of visiting-cards, with specific detail (a wee wooden schoolhouse, ten cents a package, a tall newcomer), up to the moment of revelation.
      answer: 3
      explanation: |
        Skill 5.C (spiral review): narration in an argument makes an abstract claim felt. Du Bois's readers may never have been called a problem; the story lets them stand in the schoolhouse.

    - slug: u03-w11-q02
      type: multiple_choice
      topic_code: "5.C"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 1
      stimulus: *dubois_strivings
      prompt: |
        In the third paragraph, Du Bois's account of "double-consciousness" contributes to his argument chiefly by
      options:
        - |
          dismissing the childhood incident as unimportant
        - |
          naming and defining the condition the story dramatised, so that readers can recognise it as a general experience rather than one boy's hurt
        - |
          listing statistics about the population of the United States
        - |
          comparing the American Negro unfavourably with the other peoples he names
      option_explanations:
        - |
          The definition builds on the incident; the "veil" of the story reappears ("born with a veil"). Nothing in the paragraph diminishes the story.
        - |
          Correct. The definition ("this sense of always looking at one's self through the eyes of others") generalises what the visiting-card story showed. Definition turns a personal moment into a concept readers can discuss.
        - |
          The paragraph contains no numbers. Its evidence is the experience described, not data.
        - |
          The list of peoples places the Negro as a "seventh son," a figure of folklore who is "gifted with second-sight." The comparison confers a gift as well as a burden, not inferiority.
      answer: 1
      explanation: |
        A definition often follows a narrative in an argument: the story makes readers feel something, and the definition tells them what to call it and how to think about it.

    - slug: u03-w11-q03
      type: multiple_choice
      topic_code: "5.A"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 1
      stimulus: *dubois_strivings
      prompt: |
        Which best describes the line of reasoning across the three paragraphs?
      options:
        - |
          From an unasked question, to a personal story that answers it, to a general definition of the condition the story revealed
        - |
          From a general theory, to statistical evidence, to a policy recommendation
        - |
          From a refutation of an opponent, to a concession, to a call to action
        - |
          From a description of New England, to a history of the Civil War, to a prediction about Europe
      option_explanations:
        - |
          Correct. The passage moves from particular to general: the question "How does it feel to be a problem?", the schoolhouse incident that shows how it feels, then the named condition, double consciousness.
        - |
          The passage begins with a personal experience, not a theory, and offers no statistics or policy. Its method is inductive.
        - |
          No opponent is refuted and no concession is made. The questioners of the first paragraph are evaded, not argued with.
        - |
          The setting in New England and the mention of Mechanicsville are details inside the paragraphs; they are not the stages of the reasoning.
      answer: 0
      explanation: |
        Skill 5.A (spiral review): describe a line of reasoning by naming what each section does and how it prepares the next. Here each method of development (question, narration, definition) sets up the one that follows.

    - slug: u03-w11-q04
      type: multiple_choice
      topic_code: "1.A"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 1
      stimulus: *dubois_strivings
      prompt: |
        In the first paragraph, the substitute remarks that people make instead of asking the real question (for example, "I know an excellent colored man in my town") serve mainly to
      options:
        - |
          show that Du Bois's white acquaintances share his views about race
        - |
          provide evidence that Southern outrages have ended
        - |
          reveal how readers like the questioners avoid confronting Du Bois's experience directly, which defines the relationship his book sets out to change
        - |
          introduce characters who will reappear in the visiting-card story
      option_explanations:
        - |
          The remarks are well-meaning but evasive; they circle the question "instead of saying directly." Du Bois answers them with polite detachment, not agreement.
        - |
          One remark asks whether "these Southern outrages" make his blood boil, which assumes they continue. Nothing suggests they have ended.
        - |
          Correct. The questioners “flutter round” the question; their awkward substitutes dramatise the gap between Du Bois and “the other world.” Naming that gap establishes the rhetorical situation: he will answer the question no one asks.
        - |
          The questioners are adults he meets now; the visiting-card story takes place in his childhood. They do not reappear.
      answer: 2
      explanation: |
        Skill 1.A (spiral review): identify the relation between writer and audience. By opening with what people say to him, Du Bois shows his readers their own habits and positions himself as the one who can supply what they avoid asking.

    - slug: u03-w11-q05
      type: multi_select
      topic_code: "5.C"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 2
      partial_credit: true
      stimulus: *dubois_strivings
      prompt: |
        Which TWO features make the narration in the second paragraph effective as part of an argument? Select two.
      options:
        - |
          Specific, concrete details (the wee wooden schoolhouse, the visiting-cards at ten cents a package) that make the scene believable and vivid
        - |
          A sharp turn ("refused it peremptorily, with a glance") that marks the moment of revelation the paragraph is about
        - |
          Long passages of dialogue between Du Bois and the girl who refused his card
        - |
          A table of figures showing how often such incidents occurred
      option_explanations:
        - |
          Correct. Precise details persuade readers that this happened, and they make the scene ordinary and innocent, so the exclusion lands harder.
        - |
          Correct. The story pivots on one gesture; the brevity of "with a glance" shows how small an act can carry a whole social order.
        - |
          The girl never speaks; she refuses "with a glance." The silence is part of the point.
        - |
          The paragraph contains no figures. Its persuasive power comes from a single case told well.
      answer: [0, 1]
      explanation: |
        Narration works in an argument when it is brief, specific and built around a turn that the writer's claim explains.

    - slug: u03-w11-q06
      type: true_false
      topic_code: "3.A"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 1
      stimulus: *dubois_strivings
      prompt: |
        True or false: Du Bois supports his description of double-consciousness in the third paragraph chiefly with statistical evidence.
      answer: false
      explanation: |
        False. Skill 3.A (spiral review): the paragraph's support is a defined experience, a figure from folklore (the "seventh son, born with a veil") and the vivid image of "two warring ideals in one dark body," prepared by the personal narrative before it. There are no statistics. Du Bois was a trained sociologist who used data elsewhere, so the choice of experience here is deliberate.

    - slug: u03-w11-q07
      type: multiple_choice
      topic_code: "5.C"
      source: 'W. E. B. Du Bois, The Souls of Black Folk (1903)'
      points: 1
      stimulus: *dubois_strivings
      prompt: |
        The image of the "veil," which appears in both the second and third paragraphs, functions primarily to
      options:
        - |
          describe the clothing worn by the girl in the schoolhouse
        - |
          suggest that the barrier between the races will soon disappear
        - |
          link the personal story to the general condition, so that one boy's exclusion and a people's double consciousness are seen as the same barrier
        - |
          classify the peoples of the world according to their customs
      option_explanations:
        - |
          The veil is a metaphor for separation ("shut out from their world by a vast veil"), not a literal piece of clothing.
        - |
          The passage says the reverse: the veil shuts the boy out and is the condition one is "born with." Nothing predicts its disappearance here.
        - |
          Correct. The boy is "shut out ... by a vast veil" in the story; the people are "born with a veil" in the definition. The repeated image carries the reasoning from particular to general.
        - |
          The list of peoples ends in the "seventh son" figure; the veil is not a principle of classification.
      answer: 2
      explanation: |
        A repeated image can do the work of a transition: it tells the reader that two different kinds of development (a story, a definition) are about the same thing.

    # ---- Revision set: an invented argument about a music program
    - slug: u03-w11-q08
      type: multiple_choice
      topic_code: "6.C"
      source: written for this course
      points: 1
      stimulus: &w11_music |
        *The following is a draft paragraph written for this course: a student's speech to a school board considering budget cuts. The sentences are numbered for the questions.*

        (1) The school board should not cut the music program. (2) Music is good. (3) Last spring the jazz band played at the senior center, and afterward several residents asked when the students would come back. (4) According to the district's records, students enrolled in music classes have better attendance than students who are not. (5) There are many kinds of music classes, such as band, choir and orchestra. (6) Cutting the program would save $40,000. (7) Music is like math.
      prompt: |
        The writer wants to replace sentence 2 with a definition that advances the argument. Which version best accomplishes this goal?
      options:
        - |
          By “music program” I mean not an after-school hobby but daily classes in which students practise discipline, teamwork and performing for an audience, skills the district says it wants every graduate to have.
        - |
          The dictionary defines music as the art of arranging sounds in time.
        - |
          Music can mean many different things to many different people.
        - |
          Everyone already knows what music is, so it does not need to be defined.
      option_explanations:
        - |
          Correct. The definition rejects the meaning that makes cutting easy (a hobby) and substitutes one tied to the board's own goals, so the definition itself becomes a reason.
        - |
          A dictionary definition tells the board nothing it does not know and does not touch the question of whether to cut the program.
        - |
          Saying a term means many things avoids defining it. The sentence weakens the argument by making its subject vaguer.
        - |
          Refusing to define the term misses the chance to control what the board thinks it is cutting.
      answer: 0
      explanation: |
        Skill 6.C: an argumentative definition stipulates the meaning you will use and shows why it matters to the decision. Define the term the way that changes the question.

    - slug: u03-w11-q09
      type: multiple_choice
      topic_code: "6.C"
      source: written for this course
      points: 1
      stimulus: *w11_music
      prompt: |
        The writer wants to add a sentence after sentence 4 that develops a cause-and-effect explanation for the attendance figures. Which sentence best accomplishes this goal?
      options:
        - |
          Attendance is very important for every student.
        - |
          Music students simply like school more than other students do.
        - |
          An ensemble cannot rehearse around an empty chair, so band and choir give some students a reason to come to school on mornings when they otherwise might not.
        - |
          Attendance records are kept by the district office.
      option_explanations:
        - |
          A general statement about attendance does not explain why music students attend more often. The cause is still missing.
        - |
          This names a cause but offers no mechanism, and it may simply restate the correlation. The board has no reason to believe it.
        - |
          Correct. The sentence supplies a plausible mechanism (members are needed by an ensemble), turning a correlation into a causal argument while staying modest (“some students”).
        - |
          Where the records are kept is irrelevant to why the figures look as they do.
      answer: 2
      explanation: |
        Cause and effect in your own writing needs the middle link. A modest, specific mechanism persuades more than a sweeping claim.

    - slug: u03-w11-q10
      type: multiple_choice
      topic_code: "6.C"
      source: written for this course
      points: 1
      stimulus: *w11_music
      prompt: |
        The writer wants to revise sentence 5 so that its classification advances the argument. Which version best accomplishes this goal?
      options:
        - |
          There are many kinds of music classes, such as band, choir, orchestra and others.
        - |
          Music classes can be divided into ones that are loud and ones that are quiet.
        - |
          Band, choir and orchestra are all types of music classes taught at many schools.
        - |
          Each part of the program reaches a different group: band draws students who already play, choir welcomes anyone who can sing, and orchestra is the only place in the district where a student can learn a string instrument free.
      option_explanations:
        - |
          Adding “and others” lengthens the list without giving it a purpose. The board still does not know why the kinds matter.
        - |
          Sorting by volume is a trivial principle that has nothing to do with whether the program should be cut.
        - |
          This restates the list in general terms. Classification without a point is just a list.
        - |
          Correct. The categories are sorted by one principle (whom each serves), and the last one reveals a group that would lose something unavailable anywhere else.
      answer: 3
      explanation: |
        Classification advances an argument when its categories are parallel and lead to a conclusion, here that cutting the program would cut off three different groups of students.

    - slug: u03-w11-q11
      type: multiple_choice
      topic_code: "6.C"
      source: written for this course
      points: 1
      stimulus: *w11_music
      prompt: |
        The writer wants to develop the comparison in sentence 7 so that it supports the argument against the cut. Which version best accomplishes this goal?
      options:
        - |
          Music is like math, and math is like science, and science is like music.
        - |
          Like math, music trains students to recognise patterns and divide time into precise fractions, so cutting it removes a second route to skills the board already pays to teach.
        - |
          Music is like math because both are subjects taught in school.
        - |
          Some people think music is nothing like math at all.
      option_explanations:
        - |
          A circle of comparisons explains nothing. None of the likenesses is named or connected to the cut.
        - |
          Correct. The revision names the shared skills (patterns, fractions of a beat) and draws the consequence for the board's decision.
        - |
          The shared feature is trivial: every subject is taught in school. A comparison needs a likeness that matters to the claim.
        - |
          This undermines the comparison without replacing it, leaving the paragraph weaker.
      answer: 1
      explanation: |
        Name the point of likeness and connect it to the claim; otherwise a comparison is decoration.

