        - |
          Teenagers who used to gather in the empty downtown parking garage now spend their evenings at the park, under the lights and within sight of parents and neighbours.
        - |
          Vandalism reports downtown fell from 41 in the year before the park opened to 17 in the year after, while reports in other parts of town stayed about the same.
