  # ---- Essay: argument
  - slug: u07-exam-q32
    type: long_answer
    topic_code: "4.C"
    source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
    points: 6
    prompt: |
      In “Of Cannibals” (1580), Michel de Montaigne complains of travellers and other writers who claim to know more than they do. He writes, in Charles Cotton's translation (1685):

      “I would have every one write what he knows, and as much as he knows, but no more; and that not in this only but in all other subjects.”

      Write an essay that argues your position on the extent to which people should speak or write only about what they know firsthand.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible position.
      - Provide evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Model thesis: *People should mark the limits of what they know, as Montaigne asks, but a rule against speaking beyond firsthand knowledge would silence the citizens, students and reporters who must weigh other people's evidence to act at all; the real duty is to say how you know.* Line of reasoning: (1) Montaigne's point holds: confident claims beyond one's knowledge mislead (examples: rumours shared online, an expert in one field pronouncing on another, a traveller's embellished account like those Montaigne distrusted). (2) But firsthand knowledge is too narrow a standard: voters judge policies they have not tested, historians write about centuries they never saw, and Montaigne himself writes about Brazil from a servant's report. (3) So the better rule is transparency: write what you know, and say how you know it and how sure you are, the qualification Montaigne practises (“by anything that I can gather”). Sophistication: noting that Montaigne's own essay both obeys and stretches his rule, or exploring how the duty differs for an expert, a journalist and a private citizen.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible position on the extent to which people should limit themselves to firsthand knowledge; a qualified position (to some extent, under certain conditions) is welcome but not required. A thesis that only restates the prompt or summarises Montaigne earns 0. Row B Evidence and Commentary (0-4): 4 = specific, relevant evidence (history, current events, reading, personal experience, the essay itself) with commentary that consistently explains how it supports a clear line of reasoning; 3 = specific evidence and commentary that explains most of it, with some uneven links; 2 = some relevant evidence, but commentary that is general, repetitive or drifts into summary; 1 = evidence that is mostly general or only restates the thesis; 0 = no relevant evidence. Row C Sophistication (0-1): 1 point for a nuanced argument, for example explaining the tensions in the issue (firsthand knowledge against the need to act on others' evidence), situating the argument in a broader context, or using a vivid, controlled style; a single sentence of concession does not earn it.

