        gives the figure more emphasis by turning up the volume of the interrupter
      - |
        makes the figure an aside the reader can skip
      - |
        changes the subject of the sentence
    option_explanations:
      - |
        The original is correct; commas are a standard way to set off an interrupter. The revision is a choice of emphasis.
      - |
        Correct. Dashes set off the same words more loudly than commas, so the reader notices the figure, which suits a writer who thinks the cost is scandalous.
      - |
        That is what parentheses would do. Dashes do the opposite.
      - |
        The subject is “cost” in both versions; only the punctuation of the interrupter changes.
    answer: 1
    explanation: |
      The volume scale: commas are neutral, dashes loud, parentheses quiet. Same grammar, different emphasis.

  - slug: u07-exam-q37
    type: multiple_choice
    topic_code: "1.A"
    source: 'William Hazlitt, "On Familiar Style," Table-Talk (1822)'
