unit: 7
description: |
  45 questions · about 90 minutes · every skill of Unit 7: qualifying claims with modifiers, counterarguments and
  alternative perspectives (3.C, 4.C), building and placing clauses (7.B, 8.B), grammar and mechanics for clarity
  and effect (7.C, 8.C), and the rhetorical situation, introductions and conclusions (1.A, 2.A). Four passage
  sets: a new passage from Montaigne's “Of Cannibals,” the resolutions and closing of the Seneca Falls
  declaration, a passage you have not studied from Charles Lamb's essay “Imperfect Sympathies” (1821), and a
  revision set on a student's draft. Then an AP-style argument essay and thirteen questions across the unit,
  including two short written responses. Multiple choice, select-all and true/false items are graded at once;
  fill-in-the-blank items are matched automatically; the short responses and the essay are graded by your teacher
  against the model answers and the 6-point AP rubric.
questions:
  # ---- Set A: Montaigne, “Of Cannibals”, the Brazilians at Rouen
  - slug: u07-exam-q01
    type: multiple_choice
    topic_code: "7.B"
    source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
    points: 1
    stimulus: &ex_rouen |
      *The following passages close Michel de Montaigne's essay “Of Cannibals” (1580), in Charles Cotton's English translation (1685). Three men from Brazil have been brought to France; Charles IX became king of France as a boy of ten.*

      Three of these people, not foreseeing how dear their knowledge of the corruptions of this part of the world will one day cost their happiness and repose, and that the effect of this commerce will be their ruin, as I presuppose it is in a very fair way (miserable men to suffer themselves to be deluded with desire of novelty and to have left the serenity of their own heaven to come so far to gaze at ours!), were at Rouen at the time that the late King Charles IX. was there. The king himself talked to them a good while, and they were made to see our fashions, our pomp, and the form of a great city. After which, some one asked their opinion, and would know of them, what of all the things they had seen, they found most to be admired? To which they made answer, three things, of which I have forgotten the third, and am troubled at it, but two I yet remember. They said, that in the first place they thought it very strange that so many tall men, wearing beards, strong, and well armed, who were about the king (‘tis like they meant the Swiss of the guard), should submit to obey a child, and that they did not rather choose out one amongst themselves to command. Secondly (they have a way of speaking in their language to call men the half of one another), that they had observed that there were amongst us men full and crammed with all manner of commodities, whilst, in the meantime, their halves were begging at their doors, lean and half-starved with hunger and poverty; and they thought it strange that these necessitous halves were able to suffer so great an inequality and injustice, and that they did not take the others by the throats, or set fire to their houses.

      I talked to one of them a great while together, but I had so ill an interpreter, and one who was so perplexed by his own ignorance to apprehend my meaning, that I could get nothing out of him of any moment: Asking him what advantage he reaped from the superiority he had amongst his own people (for he was a captain, and our mariners called him king), he told me, to march at the head of them to war. Demanding of him further how many men he had to follow him, he showed me a space of ground, to signify as many as could march in such a compass, which might be four or five thousand men; and putting the question to him whether or no his authority expired with the war, he told me this remained: that when he went to visit the villages of his dependence, they planed him paths through the thick of their woods, by which he might pass at his ease. All this does not sound very ill, and the last was not at all amiss, for they wear no breeches.
    prompt: |
      The first sentence of the passage withholds its main verb (“were at Rouen”) until after a long participial phrase and a parenthesis. The chief effect of this structure is to
    options:
      - |
        conceal from the reader where the three men came from
      - |
        suggest that the visit to Rouen was the happiest event in the men's lives
      - |
        place the men's future ruin, and Montaigne's pity for them, before the event itself, so that the reader sees the visit through that foreknowledge
      - |
        show that Montaigne is unsure whether the visit took place
    option_explanations:
      - |
        “These people” refers back to the Brazilians the essay has described throughout; their origin is not hidden. The delay concerns what will happen to them, not where they are from.
      - |
        The opening phrases say the knowledge they gain “will one day cost their happiness and repose.” The structure frames the visit as the beginning of a loss, not a high point.
      - |
        Correct. The sentence is periodic: the foreknowledge of “their ruin” and the exclamation “miserable men” come first, and only then the plain fact that they “were at Rouen.” The reader meets the event already shadowed by its consequences.
      - |
        The main clause states the visit flatly, and Montaigne names the king who was present. The delay builds a frame of pity, not doubt.
    answer: 2
    explanation: |
      Skill 7.B: placing dependent material before the main clause changes how the reader receives the main clause. Here the order of the sentence puts consequence before event.

  - slug: u07-exam-q02
    type: multiple_choice
    topic_code: "3.C"
    source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
    points: 1
    stimulus: *ex_rouen
    prompt: |
      The phrase “as I presuppose it is in a very fair way” qualifies Montaigne's prediction by
    options:
      - |
        withdrawing the prediction entirely
      - |
        attributing the prediction to the king rather than to Montaigne
      - |
        restricting the prediction to the men's own generation
      - |
        marking it as Montaigne's own supposition, though a confident one, rather than a certainty
    option_explanations:
      - |
        The phrase supports the prediction (“in a very fair way” means well on the way); it does not take it back.
      - |
        “I presuppose” names Montaigne as the one supposing. The king is mentioned only later as present at Rouen.
      - |
        The phrase concerns certainty, not time span. Nothing limits the ruin to one generation.
      - |
        Correct. “I presuppose” is a modifier of certainty: the ruin is Montaigne's inference, and he says so. “In a very fair way” then signals that he thinks it likely, so the qualification is honest without being timid.
    answer: 3
    explanation: |
      A writer can qualify a prediction and still sound sure of it. Montaigne marks the claim as his own judgment and then states how strongly he holds it.

  - slug: u07-exam-q03
    type: multiple_choice
    topic_code: "7.C"
    source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
    points: 1
    stimulus: *ex_rouen
    prompt: |
      The parenthesis beginning “miserable men to suffer themselves to be deluded” and ending with an exclamation mark contributes to the passage chiefly by
    options:
      - |
        setting Montaigne's lament apart from the narrative, so that his pity is heard as an aside without interrupting the account of the visit for long
      - |
        quoting the words the Brazilians themselves spoke to the king
      - |
        correcting an error in a previous sentence
      - |
        introducing a list of the things the men saw at Rouen
    option_explanations:
      - |
        Correct. The parentheses hold Montaigne's own outcry inside the sentence but outside its grammar; the exclamation mark makes the feeling audible, and the sentence then resumes with “were at Rouen.”
      - |
        The words are Montaigne's comment on the men, in the third person (“miserable men”); they are not the men's speech.
      - |
        Nothing is corrected. The parenthesis adds a judgment about the men's choice to come to Europe.
      - |
        The parenthesis contains no list of sights; those come later (“our fashions, our pomp, and the form of a great city”).
    answer: 0
    explanation: |
      Skill 7.C: parentheses set an aside apart from the main line of a sentence. An exclamation inside them lets a writer show feeling while keeping the narrative moving.

  - slug: u07-exam-q04
    type: multiple_choice
    topic_code: "1.A"
    source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
    points: 1
    stimulus: *ex_rouen
    prompt: |
      Montaigne's main purpose in reporting what the three men found strange in France is most likely to
    options:
      - |
        prove that the men did not understand European customs and were easily confused
      - |
        let outsiders' observations expose the oddity of European customs (obedience to a child king, extreme inequality) that his readers take for granted
      - |
        entertain the reader with a comic story unrelated to the essay's argument
      - |
        argue that France should adopt the political system of Brazil
    option_explanations:
      - |
        The men's observations are presented as sharp and reasonable, not confused. The essay's whole movement suggests that the reader, not the visitors, should be uncomfortable.
      - |
        Correct. Seen by visitors with no stake in European custom, the obedience of armed men to a boy and the coexistence of the “full and crammed” with their starving “halves” look strange. The alternative perspective does the arguing.
      - |
        The anecdote extends the essay's central argument that we call barbarous whatever is not our own custom. It is pointed, not merely comic.
      - |
        Montaigne makes no policy proposal. He uses the visitors' perspective to make his readers see their own society afresh.
    answer: 1
    explanation: |
      Purpose (1.A) and alternative perspective (3.C) meet here: an outsider's view lets a writer criticise without stating the criticism directly.

  - slug: u07-exam-q05
    type: multiple_choice
    topic_code: "3.C"
    source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
    points: 1
    stimulus: *ex_rouen
    prompt: |
      Montaigne's admission that the men named “three things, of which I have forgotten the third, and am troubled at it” most likely affects the reader by
    options:
      - |
        undermining the whole anecdote, since a writer who forgets one detail cannot be trusted with any
      - |
        suggesting that the third observation was too shocking to print
      - |
        implying that the third observation was the most important of all
      - |
        making the two remembered observations more credible, since Montaigne visibly refuses to invent what he cannot recall
    option_explanations:
      - |
        The admission has the opposite effect: a writer who could easily have made up a third item and did not is showing his honesty.
      - |
        “I have forgotten” says the opposite of deliberate suppression. Nothing hints at censorship.
      - |
        Montaigne gives no indication of the third item's importance, only regret at losing it.
      - |
        Correct. Like his earlier praise of a witness who will not “alter the story,” this admission qualifies his own testimony and so strengthens what he does report.
    answer: 3
    explanation: |
      Admitting the limits of one's evidence is a form of qualification. It costs a detail and buys credibility.

  - slug: u07-exam-q06
    type: multiple_choice
    topic_code: "7.A"
    source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
    points: 1
    stimulus: *ex_rouen
    prompt: |
      The final sentence, “All this does not sound very ill, and the last was not at all amiss, for they wear no breeches,” is best described as
    options:
      - |
        a sincere statement that the captain's people are poor and lack proper clothing
      - |
        a formal summary that restates the essay's thesis without irony
      - |
        an ironic close that mimics the reader's likely dismissal (no breeches, so not civilised) after the captain's answers have shown a reasonable idea of authority
      - |
        a confession that Montaigne has changed his mind and now agrees with the reader's prejudice
    option_explanations:
      - |
        The sentence comes right after the captain's thoughtful answers; the sudden drop to clothing is a joke, not a sincere lament about poverty.
      - |
        The understated “does not sound very ill” and the absurd “for they wear no breeches” are ironic, not formal.
      - |
        Correct. The understatement (“not at all amiss”) credits the captain's answers, and then the clause about breeches mimics the shallow European test of civilisation. Ending on it leaves the reader to notice how foolish that test is.
      - |
        Nothing in the essay suggests a change of mind. The irony depends on the reader seeing that Montaigne does not share the prejudice he voices.
    answer: 2
    explanation: |
      Tone (7.A): understatement and a deflating final clause can turn an apparently casual remark into the essay's sharpest criticism.

  - slug: u07-exam-q07
    type: multi_select
    topic_code: "3.C"
    source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
    points: 2
    partial_credit: true
    stimulus: *ex_rouen
    prompt: |
      Which TWO details show Montaigne acknowledging the limits of his own evidence? Select two.
    options:
      - |
        “I had so ill an interpreter”
      - |
        “The king himself talked to them a good while”
      - |
        “of which I have forgotten the third, and am troubled at it”
      - |
        “men full and crammed with all manner of commodities”
    option_explanations:
      - |
        Correct. Montaigne admits that a poor interpreter kept him from getting “nothing out of him of any moment,” which limits what his conversation can prove.
      - |
        This reports what happened at Rouen; it says nothing about the limits of Montaigne's knowledge.
      - |
        Correct. He admits a gap in his memory rather than filling it.
      - |
        This is part of the visitors' observation about inequality. It is evidence for the critique, not a limit on Montaigne's testimony.
    answer: [0, 2]
    explanation: |
      Qualification includes being honest about one's sources: their reliability, their completeness, and what was lost in transmission.

  # ---- Set B: the Seneca Falls declaration, its close and its resolutions
  - slug: u07-exam-q08
    type: multiple_choice
    topic_code: "7.B"
    source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
    points: 1
    stimulus: &ex_resolutions |
      *The first passage is the last paragraph of the Declaration of Sentiments adopted at Seneca Falls, New York, in July 1848; the second opens the resolutions the convention adopted after it. William Blackstone's Commentaries on the Laws of England (1765-1769) was the standard authority on English and American law. The text is from the History of Woman Suffrage, Volume I (1881).*

      In entering upon the great work before us, we anticipate no small amount of misconception, misrepresentation, and ridicule; but we shall use every instrumentality within our power to effect our object. We shall employ agents, circulate tracts, petition the State and National legislatures, and endeavor to enlist the pulpit and the press in our behalf. We hope this Convention will be followed by a series of Conventions embracing every part of the country.

      [...]

      WHEREAS, The great precept of nature is conceded to be, that “man shall pursue his own true and substantial happiness.” Blackstone in his Commentaries remarks, that this law of Nature being coeval with mankind, and dictated by God himself, is of course superior in obligation to any other. It is binding over all the globe, in all countries and at all times; no human laws are of any validity if contrary to this, and such of them as are valid, derive all their force, and all their validity, and all their authority, mediately and immediately, from this original; therefore.

      *Resolved*, That such laws as conflict, in any way, with the true and substantial happiness of woman, are contrary to the great precept of nature and of no validity, for this is “superior in obligation to any other.”

      *Resolved*, That all laws which prevent woman from occupying such a station in society as her conscience shall dictate, or which place her in a position inferior to that of man, are contrary to the great precept of nature, and therefore of no force or authority.
    prompt: |
      The resolutions are built as a preamble beginning “WHEREAS” and ending “therefore,” followed by clauses beginning “Resolved, That.” This structure presents the resolutions as
    options:
      - |
        a list of unrelated demands, each to be voted on separately
      - |
        conclusions that follow logically from a principle stated first and accepted by the convention's opponents
      - |
        questions that the convention leaves open for future meetings
      - |
        a narrative of the events of the convention in the order they happened
    option_explanations:
      - |
        The “therefore” binds the resolutions to the preamble; they are presented as consequences of one principle, not as unrelated items.
      - |
        Correct. The WHEREAS clause states a premise grounded in nature and in Blackstone, an authority the convention's opponents respected; “therefore” turns each Resolved clause into a conclusion from it. The form makes the demands look like deductions.
      - |
        Each Resolved clause declares a position (“are contrary to the great precept of nature”); none is phrased as an open question.
      - |
        The structure is logical, not chronological. Nothing narrates events.
    answer: 1
    explanation: |
      Skill 7.B at the scale of a document: a dependent preamble (“WHEREAS... therefore”) followed by main clauses (“Resolved, That...”) is the grammar of premise and conclusion.

  - slug: u07-exam-q09
    type: multiple_choice
    topic_code: "3.A"
    source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
    points: 1
    stimulus: *ex_resolutions
    prompt: |
      The appeal to Blackstone in the preamble functions as evidence chiefly because
    options:
      - |
        it grounds the claim in an authority on law that the convention's legal and political opponents could not easily reject
      - |
        Blackstone was a well-known supporter of women's rights
      - |
        it provides statistics about the condition of women in England
      - |
        it shows that the convention's members had studied law at university
    option_explanations:
      - |
        Correct. Blackstone was the standard authority of the very legal system the convention attacks. Using his principle that the law of nature outranks human law turns the opponents' authority against their laws.
      - |
        Blackstone's Commentaries described the common law, including coverture, that the Declaration condemns. His value as evidence is that he was not on the convention's side.
      - |
        The preamble quotes a principle, not data. There are no numbers in the passage.
      - |
        Colleges were closed to women, as the Declaration itself complains. The citation shows knowledge of the law's authorities, not degrees.
    answer: 0
    explanation: |
      Spiral review (3.A): evidence persuades according to the audience. An authority the opponent respects is worth more than one only allies accept.

  - slug: u07-exam-q10
    type: multiple_choice
    topic_code: "7.B"
    source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
    points: 1
    stimulus: *ex_resolutions
    prompt: |
      In the second resolution, the two relative clauses “which prevent woman from occupying such a station in society as her conscience shall dictate, or which place her in a position inferior to that of man” come between the subject “all laws” and the verb “are.” The effect of this placement is to
    options:
      - |
        make it unclear which laws the convention means to oppose
      - |
        suggest that only a few laws are affected
      - |
        turn the resolution into a question rather than a statement
      - |
        define precisely which laws are condemned before the verdict “contrary to the great precept of nature” arrives
    option_explanations:
      - |
        The relative clauses do the opposite: they specify the two kinds of law that are condemned.
      - |
        “All laws” that do either thing are covered. The clauses define the category; they do not shrink it to a few.
      - |
        The sentence has a subject, a verb and a complement (“are contrary”); it declares, it does not ask.
      - |
        Correct. The parallel “which... or which” clauses build a precise definition, and the verdict comes after them, at the end, where emphasis falls.
    answer: 3
    explanation: |
      Clauses placed between subject and verb delay the verdict and qualify the subject. In legal writing, that precision is the point.

  - slug: u07-exam-q11
    type: multiple_choice
    topic_code: "3.C"
    source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
    points: 1
    stimulus: *ex_resolutions
    prompt: |
      In the first paragraph, the statement “we anticipate no small amount of misconception, misrepresentation, and ridicule” serves primarily to
    options:
      - |
        admit that the convention's demands are unreasonable
      - |
        apologise to readers who may be offended
      - |
        acknowledge the opposition in advance, so that ridicule, when it comes, confirms the writers' foresight rather than undermining their cause
      - |
        ask readers to correct any misconceptions in the Declaration
    option_explanations:
      - |
        The writers anticipate misrepresentation of their demands, not their unreasonableness. They insist on the demands in the next clause.
      - |
        There is no apology; the sentence moves at once to “but we shall use every instrumentality within our power.”
      - |
        Correct. Naming the expected response pre-empts it. Readers who mock will be acting out a prediction, and the “but” clause shows the writers' resolve is unshaken.
      - |
        “Misconception” refers to how others will misunderstand the cause, not to errors in the Declaration.
    answer: 2
    explanation: |
      Anticipating an audience's response is a form of counterargument: it answers the objection, or here the mockery, before it is made.

  - slug: u07-exam-q12
    type: multiple_choice
    topic_code: "7.C"
    source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
    points: 1
    stimulus: *ex_resolutions
    prompt: |
      In the first sentence, the semicolon before “but we shall use every instrumentality within our power” contributes to the sentence's effect by
    options:
      - |
        creating a strong pause that separates the expected opposition from the writers' resolve, giving the second clause the weight of a reply
      - |
        introducing a list of the instruments the convention will use
      - |
        signalling that the second clause is a dependent clause
      - |
        joining two unrelated ideas that happen to share a sentence
    option_explanations:
      - |
        Correct. A comma would also be grammatical before “but”; the semicolon's heavier pause sets the two clauses apart as challenge and answer.
      - |
        The list of instruments comes in the next sentence (“We shall employ agents, circulate tracts...”). The semicolon joins two clauses.
      - |
        “We shall use every instrumentality” is an independent clause with its own subject and verb.
      - |
        The ideas are closely related: the expected ridicule and the response to it. That relationship is why they share a sentence.
    answer: 0
    explanation: |
      Skill 7.C: a semicolon before a coordinating conjunction is an older usage that makes the pause heavier than a comma would, emphasising the turn.

  - slug: u07-exam-q13
    type: multiple_choice
    topic_code: "7.A"
    source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
    points: 1
    stimulus: *ex_resolutions
    prompt: |
      The phrase “no small amount” in the first sentence is an example of
    options:
      - |
        exaggeration that makes the opposition seem larger than it is
      - |
        understatement (affirming by denying the opposite) that conveys a large amount with cool restraint
      - |
        technical legal language borrowed from Blackstone
      - |
        a qualifier that reduces the writers' certainty
    option_explanations:
      - |
        The phrase is restrained, not exaggerated: it says “not small” rather than “enormous.”
      - |
        Correct. Saying “no small amount” (litotes) means a great deal, but the denial keeps the tone calm and dignified: the writers expect ridicule and refuse to sound rattled by it.
      - |
        The phrase is ordinary English, not a legal term, and it appears in the Declaration rather than in the preamble that cites Blackstone.
      - |
        The phrase affirms a large amount confidently; it does not express doubt.
    answer: 1
    explanation: |
      Tone (7.A): understatement can signal confidence. A writer who expects trouble and describes it coolly sounds in control.

  - slug: u07-exam-q14
    type: true_false
    topic_code: "1.A"
    source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
    points: 1
    prompt: |
      True or false: according to the account in History of Woman Suffrage, every resolution adopted at Seneca Falls, including the one calling on women to secure the elective franchise, passed unanimously.
    answer: false
    explanation: |
      False. The account says the resolution on the elective franchise was “The only resolution that was not unanimously adopted”; some feared it would make the movement ridiculous, and Stanton and Frederick Douglass carried it “by a small majority.”

  # ---- Set C: Charles Lamb, “Imperfect Sympathies” (not studied in the unit)
  - slug: u07-exam-q15
    type: multiple_choice
    topic_code: "3.C"
    source: 'Charles Lamb, "Imperfect Sympathies," Essays of Elia (1823)'
    points: 1
    stimulus: &ex_lamb |
      *The following passages are from Charles Lamb's essay “Imperfect Sympathies,” first published in 1821 and collected in Essays of Elia (1823), where Lamb writes as “Elia.” In the second and third passages he contrasts his own kind of mind with what he calls the “Caledonian” (Scottish) mind. Lamb's essay openly trades in national stereotypes, which are prejudices, not facts about any people; he calls himself a bundle of prejudices, and much of the joke is at his own expense. The passages are used here only for what they show about tentative and certain thinking.*

      I confess that I do feel the differences of mankind, national or individual, to an unhealthy excess. I can look with no indifferent eye upon things or persons. Whatever is, is to me a matter of taste or distaste; or when once it becomes indifferent, it begins to be disrelishing. I am, in plainer words, a bundle of prejudices--made up of likings and dislikings--the veriest thrall to sympathies, apathies, antipathies. In a certain sense, I hope it may be said of me that I am a lover of my species. I can feel for all indifferently, but I cannot feel towards all equally.

      [...]

      There is an order of imperfect intellects (under which mine must be content to rank) which in its constitution is essentially anti-Caledonian. The owners of the sort of faculties I allude to, have minds rather suggestive than comprehensive. They have no pretences to much clearness or precision in their ideas, or in their manner of expressing them. Their intellectual wardrobe (to confess fairly) has few whole pieces in it. They are content with fragments and scattered pieces of Truth. She presents no full front to them--a feature or side-face at the most. Hints and glimpses, germs and crude essays at a system, is the utmost they pretend to. [...] They cannot speak always as if they were upon their oath--but must be understood, speaking or writing, with some abatement.

      [...]

      He has no falterings of self-suspicion. Surmises, guesses, misgivings, half-intuitions, semi-consciousnesses, partial illuminations, dim instincts, embryo conceptions, have no place in his brain, or vocabulary. The twilight of dubiety never falls upon him. Is he orthodox--he has no doubts. Is he an infidel--he has none either. Between the affirmative and the negative there is no border-land with him. You cannot hover with him upon the confines of truth, or wander in the maze of a probable argument.
    prompt: |
      The sentence “In a certain sense, I hope it may be said of me that I am a lover of my species” is qualified three times (“In a certain sense,” “I hope,” “it may be said”). The effect of this stacking is chiefly to
    options:
      - |
        show that Lamb dislikes all of humanity and is ashamed to admit it
      - |
        make the claim legally precise, as in a formal contract
      - |
        signal that the sentence is quoted from another writer
      - |
        enact, with comic self-awareness, the hesitant, hedging mind that Lamb goes on to describe as his own
    option_explanations:
      - |
        Lamb hopes he is “a lover of my species”; the qualifiers make the claim modest, not a disguise for hatred. The next sentence distinguishes feeling “for all” from feeling “towards all equally.”
      - |
        The qualifiers are vague on purpose (“In a certain sense”); they do not define terms the way a contract would.
      - |
        Nothing marks the sentence as a quotation; it is Elia speaking of himself.
      - |
        Correct. The sentence wraps a simple claim in three layers of caution, which is funny in itself and shows the “suggestive” mind, unwilling to speak “as if... upon their oath,” that the second passage describes.
    answer: 3
    explanation: |
      Qualification can be a stylistic performance. Here over-qualifying is not a flaw in the writing but a joke that characterises the writer.

  - slug: u07-exam-q16
    type: multiple_choice
    topic_code: "7.C"
    source: 'Charles Lamb, "Imperfect Sympathies," Essays of Elia (1823)'
    points: 1
    stimulus: *ex_lamb
    prompt: |
      In “I am, in plainer words, a bundle of prejudices--made up of likings and dislikings--the veriest thrall to sympathies, apathies, antipathies,” the dashes chiefly serve to
    options:
      - |
        separate two unrelated thoughts that should be in different sentences
      - |
        mark a quotation from Lamb's critics
      - |
        set off a definition of “a bundle of prejudices” with emphasis, before the sentence rushes on to a further restatement
      - |
