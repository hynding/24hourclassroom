  # ---- Set D: revision of a student's argument
  - slug: u07-exam-q23
    type: multiple_choice
    topic_code: "4.C"
    source: written for this course
    points: 1
    stimulus: &ex_draft |
      *The following is a draft of an argument a student is writing for the opinion page of a local newspaper.*

      (1) Closing Main Street to cars on weekends will save downtown. (2) Last summer, during a six-week trial, foot traffic on Main Street rose by about 30 percent, according to the downtown business association. (3) Shop owners reported higher sales, restaurants added outdoor tables. (4) Some business owners worry that customers who drive will go elsewhere. (5) Their concern is reasonable. (6) The trial showed that most drivers parked in the garage on Second Avenue, which was never more than half full. (7) Walking from the garage to Main Street, the distance is only two blocks. (8) Each of the merchants who joined the trial were surveyed afterward, and most supported a permanent closure. (9) The city should make the weekend closure permanent.
    prompt: |
      The writer wants to revise sentence 1 so that the claim fits the evidence the draft provides. Which version best accomplishes this goal?
    options:
      - |
        Closing Main Street to cars on weekends will save downtown forever, as everyone can see.
      - |
        Closing Main Street to cars on weekends appears to bring more people, and more business, downtown.
      - |
        Closing Main Street to cars might possibly, in some ways, have some effect on downtown.
      - |
        Cars are ruining every downtown in America.
    option_explanations:
      - |
        “Forever” and “as everyone can see” make the claim more absolute. A six-week trial cannot show that downtown has been saved permanently.
      - |
        Correct. The claim now matches what the trial measured (more foot traffic, higher sales) and “appears” fits evidence from a single trial.
      - |
        Stacked hedges leave no claim worth arguing, and “some effect” ignores the specific evidence the draft has.
      - |
        This widens the claim to every downtown in the country, far beyond one street's trial.
    answer: 1
    explanation: |
      Qualify to fit the evidence: one trial on one street supports a claim about that street, at the certainty a short trial allows.

