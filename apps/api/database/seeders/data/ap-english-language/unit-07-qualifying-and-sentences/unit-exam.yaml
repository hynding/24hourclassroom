  - slug: u07-exam-q44
    type: short_answer
    topic_code: "7.B"
    source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
    points: 2
    prompt: |
      Choose one sentence from a text studied in this unit (Montaigne's “Of Cannibals,” the Declaration of Sentiments, or Hazlitt's “On Familiar Style”). Quote it, and in two or three sentences explain how its arrangement of clauses or its punctuation shapes the claim it makes.
    answer: |
      Example: “He has made her, if married, in the eye of the law, civilly dead.” The two interrupters hold the sentence open between verb and complement, so the verdict “civilly dead” falls last, with the greatest emphasis. “If married” also qualifies the charge to the women of whom it was legally true, which makes the claim exact and hard to deny. (Other strong choices: Montaigne's concession “I am not sorry that we should here take notice... but that... we should be so blind to our own”; Hazlitt's colon in the sentence about pompous style; the Declaration's periodic final demand.)
    explanation: |
      1 point: an accurate quotation (or close reference) from one of the unit's texts, with the relevant structure or punctuation identified. 1 point: an explanation of how that structure shapes the claim (emphasis, cause and effect, concession, qualification, balance). Naming a device without explaining its effect earns at most 1.

  - slug: u07-exam-q45
    type: short_answer
    topic_code: "4.C"
    source: written for this course
    points: 2
    prompt: |
      Write a qualified thesis statement (one sentence) on this question: should high schools require every student to take a personal finance course? Your thesis must concede a point in a dependent clause and state your claim in the main clause. Then, in one sentence, explain what your qualification does.
    answer: |
      Example: *Although a required course would crowd an already full schedule, high schools should require a semester of personal finance, because most students will sign a loan or a lease before they take any other course that teaches them how.* Explanation: the “although” clause concedes the strongest objection, scheduling, and the main clause, which carries the emphasis, states the claim with a specific scope (one semester) and a reason.
    explanation: |
      1 point: a single, defensible thesis sentence with a concession in a dependent clause (although, while, even though) and the claim in the main clause. 1 point: an explanation of what the qualification does (concedes the strongest objection, limits scope, places the emphasis on the claim). A thesis that puts the writer's claim in the dependent clause earns 0 for the first point.
