  - slug: u07-exam-q38
    type: multiple_choice
    topic_code: "2.A"
    source: written for this course
    points: 1
    prompt: |
      A student is writing an argument essay on whether cities should ban cars from their centres. Which introduction best suits an argument that will be qualified?
    options:
      - |
        Since the dawn of time, humans have travelled from place to place.
      - |
        Cars are terrible and should be banned everywhere immediately.
      - |
        This essay will talk about cars and cities.
      - |
        When one city closed its main street to traffic for a summer, shops gained customers but deliveries slowed; the experiment suggests that car-free centres can work, but only if cities plan for the people who still need to drive.
    option_explanations:
      - |
        A sweeping opener says nothing about the issue and wastes the reader's attention.
      - |
        This is an absolute claim with no room for the qualification the essay intends.
      - |
        Announcing the topic is not an introduction; it gives no context and no position.
      - |
        Correct. It opens with a specific example that already shows both sides, then states a qualified thesis with a condition (“only if”), previewing the essay's reasoning.
    answer: 3
    explanation: |
      Skill 2.A: a good introduction suits the purpose. For a qualified argument, an opening example that shows the tension leads naturally to a thesis with limits.

  - slug: u07-exam-q39
    type: multi_select
    topic_code: "4.C"
    source: written for this course
    points: 2
    partial_credit: true
    prompt: |
      Which TWO sentences concede a point to an opposing view before answering it? Select two.
    options:
      - |
        Granted, uniforms cost families money at the start of the year; over a year, though, they cost less than the clothes students would otherwise buy.
      - |
        Uniforms are the best idea anyone has ever had.
      - |
        While uniforms limit students' self-expression, they also remove one daily source of teasing.
      - |
        Some people dislike uniforms, and they are simply wrong.
    option_explanations:
      - |
        Correct. “Granted” concedes the start-of-year cost, and the rebuttal answers it with the cost over a whole year.
      - |
        This is an unqualified assertion with no opposing view at all.
      - |
        Correct. The “while” clause concedes the loss of self-expression, and the main clause gives a counterweight.
      - |
        This names an opposing view only to dismiss it without a reason. Nothing is conceded.
    answer: [0, 2]
    explanation: |
      A concession grants something real to the other side, then answers it. Dismissal is not concession.

  - slug: u07-exam-q40
    type: true_false
    topic_code: "7.B"
    source: general knowledge
    points: 1
    prompt: |
      True or false: a periodic sentence states its main clause first and then adds details and qualifications.
    answer: false
    explanation: |
      False. That describes a loose (cumulative) sentence. A periodic sentence holds its main clause until the end, as in the Declaration of Sentiments' final demand: the reasons come first, then “we insist.”

  - slug: u07-exam-q41
    type: true_false
    topic_code: "3.C"
    source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
    points: 1
    prompt: |
      True or false: in “Of Cannibals,” Montaigne argues that the Brazilians' custom of eating their dead enemies is morally acceptable.
    answer: false
    explanation: |
      False. He calls it a “barbarous horror” and grants that the Brazilians may be called barbarous “in respect to the rules of reason.” His argument is that Europeans, whose cruelties are worse, have no standing to condemn them by comparison with themselves.

