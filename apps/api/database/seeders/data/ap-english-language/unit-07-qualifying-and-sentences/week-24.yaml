      explanation: |
        Spiral review (2.A): a conclusion fits the rhetorical situation. For a letter to decision-makers, that means a specific request that answers their concern.

    # ---- Clauses, conjunctions and sentence order
    - slug: u07-w24-q15
      type: multi_select
      topic_code: "8.B"
      source: written for this course
      points: 2
      partial_credit: true
      prompt: |
        Which TWO sentences use subordination to make the relationship between their ideas clear? Select two.
      options:
        - |
          Since the bridge closed, deliveries to the market have taken an hour longer.
        - |
          The bridge closed. Deliveries take longer. The market is struggling.
        - |
          The market will recover only if the bridge reopens before winter.
        - |
          The bridge closed, and the market is struggling, and deliveries take longer.
      option_explanations:
        - |
          Correct. “Since” makes the first clause dependent and names the cause of the delay.
        - |
          Three simple sentences sit side by side; the reader has to guess how they connect.
        - |
          Correct. “Only if” introduces a dependent clause of condition and states exactly what the recovery depends on.
        - |
          Repeated “and” coordinates the ideas as equals and hides the cause-and-effect relationship among them.
      answer: [0, 2]
      explanation: |
        Subordination states the logic between ideas; strings of simple or coordinated sentences leave it unstated.

    - slug: u07-w24-q16
      type: true_false
      topic_code: "4.C"
      source: general knowledge
      points: 1
      prompt: |
        True or false: in a sentence that concedes in a dependent clause and makes a claim in the main clause, such as *Although the plan saves money, it harms families*, the concession receives the main emphasis.
      answer: false
      explanation: |
        False. The main clause, especially when it comes last, carries the emphasis. The dependent “although” clause concedes as background, which is exactly why it is the right place for the opposing point.

