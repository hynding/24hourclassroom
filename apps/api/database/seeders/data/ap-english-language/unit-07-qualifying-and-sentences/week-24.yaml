      type: fill_blank
      topic_code: "7.B"
      source: general knowledge
      points: 1
      prompt: |
        A sentence that holds back its main clause until the end, after a series of dependent clauses or phrases, is called a ____ sentence.
      answer: ["periodic", "periodic sentence"]
      explanation: |
        The periodic sentence builds suspense and lets reasons accumulate before the claim. Its opposite is the loose or cumulative sentence, which states the main clause first.

