      stimulus: *w24_draft
      prompt: |
        The writer wants to end the letter with a conclusion that suits its audience and purpose. Which sentence best accomplishes this goal?
      options:
        - |
          In conclusion, libraries are important.
        - |
          That is all I have to say about libraries.
        - |
          I ask the council to keep the Eastside branch open on Sundays and to look for the $40,000 in a budget line that does not fall on the families with the fewest alternatives.
