week: 24
unit: 7
title: Building Sentences in the Declaration of Sentiments
topics: ["7.B", "8.B"]
texts:
  - author: Elizabeth Cady Stanton and the Seneca Falls Convention
    title: Declaration of Sentiments (in History of Woman Suffrage, Volume I)
    year: 1848
    url: https://www.gutenberg.org/ebooks/28020
guide: guides/week-24.md
guide_description: |
  How writers create, combine and place independent and dependent clauses to show how ideas relate, and how to
  write sentences whose structure makes your reasoning clear. The Declaration of Sentiments of the Seneca Falls
  Convention (1848) as a study in sentence architecture: a series of parallel independent clauses, a grievance
  opened by a participial phrase, interrupters that delay a verdict, and a periodic final demand. Then a lesson on
  combining choppy sentences, fixing comma splices and putting your claim in the main clause.
flashcards_description: |
  30 cards on clauses, conjunctions, coordination and subordination, periodic and loose sentences, comma splices
  and end focus, and on the occasion, form and sentences of the Declaration of Sentiments.

flashcards:
  - front: CED skill 7.B (Unit 7 reading skill) → what it asks you to explain
    back: |
      How writers create, combine and place independent and dependent clauses to show relationships between and among ideas. You explain what a sentence's structure does: which idea it makes primary, which it makes background, and what relationship (cause, contrast, condition, time) it signals.
    topic_code: "7.B"
  - front: CED skill 8.B (Unit 7 writing skill) → what it asks you to do
    back: |
      Write sentences that clearly convey ideas and arguments. On revision questions you choose the combination of sentences, the conjunction or the clause order that states the relationship the writer intends; in essays you build sentences whose shape matches your reasoning.
    topic_code: "8.B"
  - front: Independent clause → definition and quick test
    back: |
      A group of words with a subject and a verb that can stand alone as a sentence. Test: read it by itself with a period. *The council voted.* is independent; *because the council voted* is not.
    topic_code: "7.B"
  - front: Dependent (subordinate) clause → definition and common openers
    back: |
      A clause with a subject and verb that cannot stand alone because it begins with a subordinating word: because, although, when, if, unless, since, while, whereas, after, until; or a relative pronoun: who, which, that. It depends on a main clause for its meaning.
    topic_code: "7.B"
  - front: Subordinating conjunctions sorted by the relationship they show
    back: |
      Cause: because, since, as. Contrast or concession: although, though, while, whereas, even though. Condition: if, unless, provided that, as long as. Time: when, after, before, until, once. Choosing the conjunction is choosing the logic.
    topic_code: "8.B"
  - front: Coordinating conjunctions (for, and, nor, but, or, yet, so) → what each signals
    back: |
      and adds; but and yet contrast; or and nor give alternatives; so gives a result; for gives a reason. With a comma, each joins two independent clauses as equals.
    topic_code: "8.B"
  - front: Coordination versus subordination → what each says about two ideas
    back: |
      Coordination (two independent clauses joined by and, but, a semicolon) presents the ideas as equal. Subordination (one idea in a dependent clause) makes it background, condition or cause, and puts the weight on the main clause.
    topic_code: "7.B"
  - front: End focus in English sentences → where emphasis falls
    back: |
      Readers give the most weight to the end of a sentence, and the main clause carries more than any dependent clause. So the last words of a main clause are the strongest position: place there what you most want remembered.
    topic_code: "7.B"
  - front: Periodic sentence in the Declaration of Sentiments → definition and effect
    back: |
      A sentence that delays its main clause, or the completion of it, until the end, after dependent clauses and phrases. It builds suspense and lets reasons pile up before the claim lands. The last paragraph of the Declaration of Sentiments works this way.
    topic_code: "7.B"
  - front: Loose (cumulative) sentence → definition and effect
    back: |
      A sentence that states its main clause first and then adds modifiers, details or qualifications. It reads naturally and lets the writer sharpen an idea in stages: *The town changed slowly, street by street, shop by shop, until no one remembered the mill.*
    topic_code: "7.B"
  - front: Interrupter (in sentence structure) → definition and effect
    back: |
      A phrase or clause set off by commas or dashes inside a sentence, often between subject and verb or verb and complement. It adds a qualification or detail and delays what follows, which throws emphasis onto the words after it.
    topic_code: "7.B"
  - front: Opening participial phrase → what it does, and the risk
    back: |
      A phrase such as *Having lost the vote,* placed before the main clause, sets up a cause or circumstance. The risk is a dangling modifier: the phrase must describe the subject that comes right after the comma.
    topic_code: "8.B"
  - front: Comma splice → definition and four fixes
    back: |
      Two independent clauses joined only by a comma. Fixes: a period; a semicolon; a comma plus a coordinating conjunction; or making one clause dependent (because, although). The best fix is the one that shows the relationship you mean.
    topic_code: "8.B"
  - front: Fused sentence (run-on) → definition
    back: |
      Two independent clauses run together with no punctuation or conjunction at all: *The bus was late we missed the start.* A run-on is about structure, not length; a long sentence can be perfectly correct.
    topic_code: "8.B"
  - front: Anaphora in the Declaration of Sentiments → the repeated opening
    back: |
      Anaphora is the repetition of words at the start of successive clauses. Twelve of the grievances open “He has,” and one more “He allows,” making man the subject of every charge and turning the list into a drumbeat.
    topic_code: "7.B"
  - front: Declaration of Sentiments → its occasion
    back: |
      The first women's rights convention, at the Wesleyan Chapel in Seneca Falls, New York, on July 19-20, 1848. The Declaration was read, debated, amended and signed by about one hundred people, sixty-eight women and thirty-two men.
    topic_code: "1.A"
  - front: Declaration of Sentiments → its principal author and her purpose
    back: |
      Elizabeth Cady Stanton drafted it with Lucretia Mott, Martha Wright, Mary Ann McClintock and others. Its purpose was to state women's grievances as a formal indictment and demand “immediate admission to all the rights and privileges which belong to them as citizens.”
    topic_code: "1.A"
  - front: Declaration of Sentiments → why it borrows the form of 1776
    back: |
      By following the Declaration of Independence sentence by sentence, it claims the nation's founding principles for women and makes readers who revere 1776 either accept the argument or explain why it applies to men only. Form becomes evidence.
    topic_code: "1.B"
  - front: Declaration of Sentiments → the two words added to the famous self-evident truth
    back: |
      “That all men and women are created equal.” The addition of “and women” is the whole argument in miniature: the familiar sentence, changed by two words, turns into a demand.
    topic_code: "3.A"
  - front: Declaration of Sentiments → the grievances as parallel independent clauses
    back: |
      Each grievance is a complete independent clause, usually its own paragraph, with the same subject (“He”) and a verb of action. Coordinated and equal, they accumulate: no single charge carries the case, but the series does.
    topic_code: "7.B"
  - front: Declaration of Sentiments → the "Having deprived her" grievance
    back: |
      “Having deprived her of this first right of a citizen, the elective franchise, thereby leaving her without representation in the halls of legislation, he has oppressed her on all sides.” The opening participial phrase names the cause; the main clause delivers the consequence.
    topic_code: "7.B"
  - front: Declaration of Sentiments → "if married, in the eye of the law, civilly dead"
    back: |
      Two interrupters delay the verdict until the last two words. “If married” also qualifies the claim: the legal death applies to married women under the common law of coverture, which gave a wife's property and legal identity to her husband.
    topic_code: "3.C"
  - front: Declaration of Sentiments → the periodic final demand
    back: |
      The paragraph beginning “Now, in view of this entire disfranchisement” stacks prepositional phrases and a because clause before the main clause “we insist.” The reasons arrive first; the demand lands last, with the weight of everything before it.
    topic_code: "7.B"
  - front: Declaration of Sentiments → how its last paragraph anticipates the audience's response
    back: |
      “We anticipate no small amount of misconception, misrepresentation, and ridicule.” Naming the ridicule in advance disarms it and recasts mockery as proof that the work is serious. The press did ridicule the convention.
    topic_code: "1.B"
  - front: The Seneca Falls resolutions → the WHEREAS and Resolved form
    back: |
      A preamble beginning WHEREAS states the principle (here, Blackstone's law of nature); each Resolved, That clause draws a conclusion from it. The form is a chain of dependent clauses leading to independent decisions, borrowed from legislatures.
    topic_code: "7.B"
  - front: The Seneca Falls resolutions → the one not adopted unanimously
    back: |
      The ninth, calling on women to secure “their sacred right to the elective franchise.” Some feared a demand for the vote would make the movement ridiculous; Stanton and Frederick Douglass argued for it and it passed by a small majority.
    topic_code: "1.A"
  - front: History of Woman Suffrage → where this week's text is printed
    back: |
      Volume I (1881), edited by Elizabeth Cady Stanton, Susan B. Anthony and Matilda Joslyn Gage, prints the Declaration and resolutions with an account of the convention. It is in the public domain in the United States (Project Gutenberg #28020).
    topic_code: "1.A"
  - front: Combining two short sentences → the three questions to ask first
    back: |
      1. Which idea matters more to my argument? That one goes in the main clause. 2. What is the relationship: cause, contrast, condition, time, addition? 3. Which conjunction or structure names that relationship exactly?
    topic_code: "8.B"
  - front: Choppy simple sentences in a draft → why they weaken an argument
    back: |
      A string of short independent clauses presents every idea as equal and leaves the reader to guess how they connect. Combining them with the right subordinator states the logic: because, although, unless.
    topic_code: "8.B"
  - front: Conceding in the dependent clause → why the claim belongs in the main clause
    back: |
      *Although the plan saves money, it harms the families who need the library most.* The concession is background and the claim gets end focus. Reverse the clauses and the sentence argues for the plan.
    topic_code: "8.B"

quiz:
  description: |
    22 questions · about 40 minutes · a set of eight questions on the grievances and final demand of the Declaration
    of Sentiments, a revision set of six questions on a student's letter to a city council, then questions on
    clauses, conjunctions and sentence order, with review of qualification, context, audience, claims and
    introductions and conclusions. Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the two short answers and the paragraph are graded by your
    teacher.
  questions:
    # ---- Passage set: the Declaration of Sentiments
    - slug: u07-w24-q01
      type: multiple_choice
      topic_code: "7.B"
      source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
      points: 1
      stimulus: &sentiments |
        *The following passages are from the Declaration of Sentiments, drafted chiefly by Elizabeth Cady Stanton and adopted at the women's rights convention at Seneca Falls, New York, in July 1848. The text is from the History of Woman Suffrage, Volume I (1881).*

        The history of mankind is a history of repeated injuries and usurpations on the part of man toward woman, having in direct object the establishment of an absolute tyranny over her. To prove this, let facts be submitted to a candid world.

        He has never permitted her to exercise her inalienable right to the elective franchise.

        He has compelled her to submit to laws, in the formation of which she had no voice.

        He has withheld from her rights which are given to the most ignorant and degraded men--both natives and foreigners.

        Having deprived her of this first right of a citizen, the elective franchise, thereby leaving her without representation in the halls of legislation, he has oppressed her on all sides.

        He has made her, if married, in the eye of the law, civilly dead.

        He has taken from her all right in property, even to the wages she earns.

        [...]

        Now, in view of this entire disfranchisement of one-half the people of this country, their social and religious degradation--in view of the unjust laws above mentioned, and because women do feel themselves aggrieved, oppressed, and fraudulently deprived of their most sacred rights, we insist that they have immediate admission to all the rights and privileges which belong to them as citizens of the United States.
      prompt: |
        The grievances that begin “He has never permitted her,” “He has compelled her” and “He has withheld from her” are each written as a separate independent clause with the same subject. The primary effect of this structure is to
      options:
        - |
          present each grievance as a complete, self-standing charge with the same agent, so that the charges accumulate into a single indictment
        - |
          suggest that the grievances are minor and can be dealt with one at a time
        - |
          subordinate the earlier grievances to the later ones, which carry the main argument
        - |
          vary the sentence structure so that the reader does not notice the repetition
      option_explanations:
        - |
          Correct. Coordinated independent clauses present each charge as equal and complete. Repeating the subject “He” names one agent for every injury, and the accumulation proves the claim of “repeated injuries” made in the first paragraph.
        - |
          The structure makes each grievance weighty, not minor. The series exists to show a pattern, “a history of repeated injuries,” not separate small problems.
        - |
          Independent clauses in parallel are equals; no grievance is grammatically subordinate to another. Subordination would require dependent clauses.
        - |
          The sentences repeat their structure on purpose. The repetition (anaphora) is meant to be noticed, like a drumbeat.
      answer: 0
      explanation: |
        Skill 7.B: coordination presents ideas as equal. A series of parallel independent clauses is the grammar of an indictment: count after count, each complete.

    - slug: u07-w24-q02
      type: multiple_choice
      topic_code: "7.B"
      source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
      points: 1
      stimulus: *sentiments
      prompt: |
        In the sentence beginning “Having deprived her of this first right of a citizen,” placing the participial phrase before the main clause chiefly serves to
      options:
        - |
          introduce a new grievance unrelated to the right to vote
        - |
          suggest that the loss of the vote is less important than other oppressions
        - |
          present the loss of the vote as the cause that makes possible the oppression named in the main clause
        - |
          shift the blame for women's condition from men to women themselves
      option_explanations:
        - |
          The phrase returns to the right to vote (“this first right of a citizen, the elective franchise”) rather than introducing something new; “this” points back to the earlier grievance.
        - |
          The phrase calls the franchise “this first right of a citizen.” Placing it first presents it as the foundation, not as a lesser concern.
        - |
          Correct. The opening phrase states a prior action and its result (“thereby leaving her without representation”); the main clause then names the consequence: “he has oppressed her on all sides.” The order of clauses mirrors the order of cause and effect.
        - |
          The subject of the main clause is “he”; the sentence keeps man as the agent of the deprivation and the oppression.
      answer: 2
      explanation: |
        A participial phrase before the main clause often sets up a cause or circumstance. Here the sentence structure argues that the vote is the first right, from which the others follow.

    - slug: u07-w24-q03
      type: multiple_choice
      topic_code: "7.B"
      source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
      points: 1
      stimulus: *sentiments
      prompt: |
        In “He has made her, if married, in the eye of the law, civilly dead,” the placement of the two phrases between “made her” and “civilly dead” has which effect?
      options:
        - |
          It makes the sentence ambiguous, so that the reader cannot tell who has made her civilly dead.
        - |
          It turns the sentence into a dependent clause that relies on the next grievance.
        - |
          It shows that the writer is uncertain whether married women lose their legal rights.
        - |
          It delays the verdict until the last two words, so that “civilly dead” falls with the greatest emphasis.
      option_explanations:
        - |
          The subject “He” is clear from the first word. The interrupters add conditions; they do not obscure the agent.
        - |
          The sentence is a complete independent clause with subject (He), verb (has made), object (her) and complement (civilly dead). The phrases interrupt it but do not make it dependent.
        - |
          The phrases narrow and specify the claim (married women, in law); they do not express doubt. The sentence states its verdict flatly.
        - |
          Correct. The interrupters hold the reader in suspense between verb and complement, and the end of the sentence, its strongest position, receives the shocking phrase.
      answer: 3
      explanation: |
        Interrupters delay. When they come between a verb and its completion, the words that finally arrive carry extra weight: end focus.

    - slug: u07-w24-q04
      type: multiple_choice
      topic_code: "3.C"
      source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
      points: 1
      stimulus: *sentiments
      prompt: |
        The phrase “if married” in “He has made her, if married, in the eye of the law, civilly dead” functions as
      options:
        - |
          a qualification that limits the claim to married women, making it precise and harder to dispute
        - |
          a concession that the grievances do not apply to most women
        - |
          a counterargument raised by the convention's opponents
        - |
          a transition that links the sentence to the following grievance about property
      option_explanations:
        - |
          Correct. Under the common law of coverture a married woman's legal identity merged with her husband's. “If married” limits the scope of the claim to the women of whom it is literally true, so no reader can refute it with the case of an unmarried woman.
        - |
          The phrase narrows one claim; it does not concede that the grievances in general apply to few women. Other grievances, such as the vote, apply to all.
        - |
          No opposing voice is stated. The phrase is part of the writers' own charge.
        - |
          A transition links ideas between sentences; “if married” is a condition inside this sentence.
      answer: 0
      explanation: |
        Spiral review (3.C): a modifier of condition can make a charge more powerful, not less, by stating it at exactly its true scope.

    - slug: u07-w24-q05
      type: multiple_choice
      topic_code: "7.B"
      source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
      points: 1
      stimulus: *sentiments
      prompt: |
        The final paragraph of the passage places two “in view of” phrases and a “because” clause before the main clause “we insist that they have immediate admission.” The effect of this structure is to
      options:
        - |
          hide the demand inside a long sentence so that hostile readers will miss it
        - |
          gather the reasons first, so that the demand arrives at the end with the weight of the whole case behind it
        - |
          make the demand conditional on the reader's agreement with every grievance
        - |
          show that the writers are uncertain which grievance matters most
      option_explanations:
        - |
          The demand is in the main clause and at the end, the most emphatic position. The structure spotlights it rather than hiding it.
        - |
          Correct. This is a periodic sentence: the dependent material summarises the grievances (“this entire disfranchisement,” “the unjust laws above mentioned,” women's feeling of being “aggrieved”) and the main clause then delivers the demand.
        - |
          “In view of” and “because” give reasons, not conditions. A conditional would use “if” or “unless.”
        - |
          The sentence summarises all the grievances together. Its structure expresses certainty (“we insist”), not doubt about priorities.
      answer: 1
      explanation: |
        A periodic sentence holds back its main clause. Here, as in a closing argument, the evidence is recapitulated and then the verdict is demanded.

    - slug: u07-w24-q06
      type: multi_select
      topic_code: "7.B"
      source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
      points: 2
      partial_credit: true
      stimulus: *sentiments
      prompt: |
        Which TWO sentences from the passage place a dependent element (a phrase or clause that cannot stand alone) before the main clause? Select two.
      options:
        - |
          “He has never permitted her to exercise her inalienable right to the elective franchise.”
        - |
          “Having deprived her of this first right of a citizen, the elective franchise, thereby leaving her without representation in the halls of legislation, he has oppressed her on all sides.”
        - |
          “He has taken from her all right in property, even to the wages she earns.”
        - |
          The final paragraph, beginning “Now, in view of this entire disfranchisement of one-half the people of this country.”
      option_explanations:
        - |
          This sentence opens with its subject and verb (“He has never permitted”). Nothing dependent comes before the main clause.
        - |
          Correct. The participial phrase beginning “Having deprived her” comes before the main clause “he has oppressed her on all sides.”
        - |
          The main clause comes first (“He has taken from her all right in property”); the phrase “even to the wages she earns” follows it.
        - |
          Correct. Two “in view of” phrases and a “because” clause precede the main clause “we insist.”
      answer: [1, 3]
      explanation: |
        To find the main clause, look for the subject and verb that could stand alone. Whatever comes before them is front-loaded material: background, cause or circumstance.

    - slug: u07-w24-q07
      type: true_false
      topic_code: "1.A"
      source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
      points: 1
      prompt: |
        True or false: the Declaration of Sentiments deliberately follows the structure of the Declaration of Independence, with a statement of principles followed by a list of grievances.
      answer: true
      explanation: |
        True. It follows the 1776 document's opening, its self-evident truths (with “and women” added), and its long list of grievances, but names “man” where the original named the king. The borrowed form claims the nation's founding principles for women.

    - slug: u07-w24-q08
      type: multiple_choice
      topic_code: "1.B"
      source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
      points: 1
      stimulus: *sentiments
      prompt: |
        The sentence “To prove this, let facts be submitted to a candid world” is most likely intended to appeal to readers who
      options:
        - |
          distrust all written documents and prefer personal testimony
        - |
          already believe that women are content with their position
        - |
          care only about the economic cost of women's inequality
        - |
          revere the founding documents of the United States and pride themselves on judging by facts
      option_explanations:
        - |
          The sentence promises written, listed facts, the opposite of an appeal to personal testimony.
        - |
          Readers who believe women are content are the ones the facts are meant to persuade, but the sentence appeals to a shared value (candour, the founding tradition), not to that belief.
        - |
          The grievances that follow cover the vote, marriage, divorce, education and the church, not only economics.
        - |
          Correct. The sentence echoes the language of 1776 and asks the reader to be “candid,” fair-minded. It flatters the American audience's self-image and its reverence for the Declaration, then holds it to that standard.
      answer: 3
      explanation: |
        Spiral review (1.B): an argument shows it understands its audience by invoking values that audience already holds. Here the borrowed sentence does that work.

    # ---- Revision set: a student's letter to the city council
    - slug: u07-w24-q09
      type: multiple_choice
      topic_code: "8.B"
      source: written for this course
      points: 1
      stimulus: &w24_draft |
        *The following is a draft of a letter a student is writing to a city council.*

        (1) The city council plans to close the Eastside branch library on Sundays. (2) The council says the change will save $40,000 a year. (3) Sunday is the only day many working parents can bring their children. (4) Last year the branch had more visitors on Sundays than on any weekday. (5) The library offers free internet access. (6) Many families in Eastside do not have internet access at home. (7) Students use the library to do their homework, they have nowhere else quiet to go. (8) Closing on Sundays would save money, it would cost the neighborhood far more.
      prompt: |
        The writer wants to combine sentences 1 and 2 to show clearly the council's reason for its plan. Which version best accomplishes this goal?
      options:
        - |
          The city council plans to close the Eastside branch library on Sundays, although the council says the change will save $40,000 a year.
        - |
          The city council plans to close the Eastside branch library on Sundays until the change saves $40,000 a year.
        - |
          The city council plans to close the Eastside branch library on Sundays because, it says, the change will save $40,000 a year.
        - |
          The city council plans to close the Eastside branch library on Sundays, and the council says things.
      option_explanations:
        - |
          “Although” signals contrast, but saving money is the reason for the plan, not something in tension with it. The conjunction states the wrong relationship.
        - |
          “Until” signals time and changes the meaning: the council does not plan to close the branch only until a sum is saved.
        - |
          Correct. “Because” names the causal relationship, and “it says” keeps the attribution: the saving is the council's claim, which the writer will go on to question.
        - |
          “And” joins the ideas as equals and loses the specific figure, so the reader no longer knows what the council claims.
      answer: 2
      explanation: |
        Skill 8.B: choose the conjunction that names the relationship you mean. Cause calls for because or since; contrast for although; time for until or when.

    - slug: u07-w24-q10
      type: multiple_choice
      topic_code: "8.B"
      source: written for this course
      points: 1
      stimulus: *w24_draft
      prompt: |
        The writer wants to combine sentences 5 and 6 so that the second idea explains why the first matters. Which version best accomplishes this goal?
      options:
        - |
          The library offers free internet access, which many families in Eastside do not have at home.
        - |
          The library offers free internet access, but many families in Eastside do not have internet access at home.
        - |
          Many families in Eastside do not have internet access at home, the library offers free internet access.
        - |
          The library offers free internet access, or many families in Eastside do not have it at home.
      option_explanations:
        - |
          Correct. The relative clause (“which many families... do not have at home”) attaches the need directly to the service, so the reader sees at once why free access matters, and the repetition is gone.
        - |
          “But” signals contrast, which misstates the relationship: the families' lack of access is the reason the service matters, not a point against it.
        - |
          Two independent clauses joined only by a comma make a comma splice, and the relationship between them is left unstated.
        - |
          “Or” offers alternatives, which makes no sense here. The two facts are connected, not exclusive.
      answer: 0
      explanation: |
        A relative clause (which, who, that) is often the tightest way to attach an explanation to the noun it explains.

    - slug: u07-w24-q11
      type: multiple_choice
      topic_code: "8.B"
      source: written for this course
      points: 1
      stimulus: *w24_draft
      prompt: |
        Which revision of sentence 7 best corrects the error and states the relationship between its two ideas?
      options:
        - |
          Students use the library to do their homework, however they have nowhere else quiet to go.
        - |
          Students use the library to do their homework because they have nowhere else quiet to go.
        - |
          Students use the library to do their homework; although they have nowhere else quiet to go.
        - |
          Students using the library to do their homework, having nowhere else quiet to go.
      option_explanations:
        - |
          “However” is not a conjunction, so this is still a comma splice, and it also signals contrast where the writer means cause.
        - |
          Correct. “Because” turns the second clause into a dependent clause, which fixes the comma splice and states the cause: students come because there is nowhere else.
        - |
          A semicolon must join two independent clauses; “although they have nowhere else quiet to go” is dependent. “Although” also signals the wrong relationship.
        - |
          This has no main verb (“using,” “having”), so it is a fragment, not a sentence.
      answer: 1
      explanation: |
        A comma splice can be fixed four ways, but only one fix here also says what the writer means. Subordinate with the conjunction that names the relationship.

    - slug: u07-w24-q12
      type: multiple_choice
      topic_code: "8.B"
      source: written for this course
      points: 1
      stimulus: *w24_draft
      prompt: |
        The writer wants sentence 8 to concede the council's point while giving the most emphasis to the writer's own claim. Which version best accomplishes this goal?
      options:
        - |
          Although closing on Sundays would cost the neighborhood far more, it would save money.
        - |
          Closing on Sundays would save money, and it would cost the neighborhood far more.
        - |
          Closing on Sundays would cost the neighborhood far more, so it would save money.
        - |
          Although closing on Sundays would save money, it would cost the neighborhood far more.
      option_explanations:
        - |
          This puts the writer's claim in the dependent clause and the council's point in the main clause, at the end. The sentence now argues for closing.
        - |
          “And” treats the two ideas as equal and does not signal that the writer is conceding one to assert the other.
        - |
          “So” states a cause and effect that makes no sense: the cost to the neighborhood does not produce the saving.
        - |
          Correct. The council's point is conceded in the “although” clause; the writer's claim sits in the main clause and at the end, where emphasis falls.
      answer: 3
      explanation: |
        Concede in the dependent clause, claim in the main clause. Reversing the clauses reverses the argument.

