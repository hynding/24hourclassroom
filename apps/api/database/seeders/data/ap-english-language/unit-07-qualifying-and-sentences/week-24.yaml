      source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
      points: 1
      prompt: |
        The Declaration of Sentiments claims that the history of mankind shows “the establishment of an absolute tyranny” over woman. Which best describes the evidence it offers for that claim?
      options:
        - |
          A list of specific legal and social conditions, such as exclusion from voting, loss of property and wages in marriage, unequal divorce and guardianship laws, and closed colleges and professions
        - |
          Statistics on the number of women in each state who have been denied the vote
        - |
          Personal stories of individual women told in their own words
        - |
          Quotations from opponents of women's rights, which the writers then refute one by one
      option_explanations:
        - |
          Correct. The “facts... submitted to a candid world” are grievances about law and custom: the vote, property, wages, marriage, divorce, taxation, employment, education and the church. Their range is the evidence for “absolute.”
        - |
          The Declaration offers no numbers; its evidence is qualitative, a catalogue of laws and practices.
        - |
          The grievances are stated in general terms about “her,” not as individual testimony.
        - |
          Opponents are not quoted; the document anticipates “ridicule” at the end but does not refute particular statements.
      answer: 0
      explanation: |
        Spiral review (3.A): identify what kind of evidence a writer uses and how it supports the claim. Here breadth is the point: tyranny is “absolute” because it reaches every sphere of life.

    - slug: u07-w24-q22
      type: long_answer
      topic_code: "8.B"
      source: written for this course
      points: 5
      prompt: |
        Write one well-developed argumentative paragraph (about 180-250 words) proposing a change to a rule or practice at your school or in your community. Your paragraph must include:

        - a sentence that concedes an opposing point in a dependent clause and makes your claim in the main clause;
        - a sentence that places at least one dependent clause or phrase before its main clause to show a cause or condition;
        - at least two parallel independent clauses, in one sentence or in consecutive sentences, that build your case.

        After the paragraph, copy out each of the three required sentences and label it.
      answer: |
        Model (summary): Claim: *Our school should let students who finish their work early use the last ten minutes of class for independent reading.* Concession sentence: *Although some teachers worry that free reading time will be wasted, the students in last year's pilot read an average of two more books each semester.* Front-loaded sentence: *Because most of us have no quiet time to read at home, those ten minutes may be the only reading many students do all day.* Parallel clauses: *Reading time costs nothing; it needs no new staff; it asks only that we stop treating the end of class as dead time.* Commentary links each piece of evidence to the proposal, and the paragraph closes by restating the specific change.
      explanation: |
        5 points. Claim (1): a specific, arguable proposal. Evidence (1): at least one specific reason or example, accurate and relevant. Sentence construction (2): 2 if all three required sentences are present, correctly built and labelled, and each structure does the work described (concession in the dependent clause, a dependent element showing cause or condition before the main clause, parallel independent clauses); 1 if two of the three are present and correct, or all three are present but one misplaces the emphasis; 0 otherwise. Commentary (1): the paragraph explains how the evidence supports the proposal rather than listing reasons.
