      topic_code: "7.B"
      source: general knowledge
      points: 1
      prompt: |
        A clause that has a subject and a verb but cannot stand alone as a sentence, often beginning with “because,” “although” or “when,” is a ____ clause.
      answer: ["dependent", "subordinate", "dependent clause", "subordinate clause"]
      explanation: |
        Dependent and subordinate mean the same thing. The word that opens the clause (the subordinator) tells the reader how it relates to the main clause.

    - slug: u07-w24-q19
      type: short_answer
      topic_code: "7.B"
      source: 'Elizabeth Cady Stanton, Declaration of Sentiments (1848)'
      points: 2
      prompt: |
        Compare the Declaration's sentence “Having deprived her of this first right of a citizen, the elective franchise, thereby leaving her without representation in the halls of legislation, he has oppressed her on all sides” with this rewrite: *He has deprived her of the vote. He has oppressed her on all sides.* In two or three sentences, explain what the original structure communicates that the rewrite does not.
      answer: |
        The original makes the loss of the vote a dependent participial phrase that comes first, and “thereby” spells out its result, so the sentence argues that disfranchisement is the cause from which every other oppression follows. The rewrite presents two equal, unconnected facts and leaves the cause-and-effect relationship for the reader to guess. The original also saves the sweeping “on all sides” for the end of the main clause, where it lands with force.
      explanation: |
        1 point: identifies the structural difference (dependent opening phrase plus main clause against two independent sentences). 1 point: explains the relationship the original communicates (cause and consequence, the vote as the first right) or the emphasis created by placing the main clause last. A response that only says the original is longer or more formal earns 0.

    - slug: u07-w24-q20
      type: short_answer
      topic_code: "8.B"
      source: written for this course
      points: 2
      prompt: |
        Combine these three sentences into one sentence that makes the relationships among the ideas clear: *The school added a late bus. Attendance at after-school tutoring doubled. Many students had no ride home before.* Then, in one sentence, explain the choice you made.
      answer: |
        Combined: *Because many students had no ride home before the school added a late bus, attendance at after-school tutoring doubled once the bus began running.* (Also acceptable: *After the school added a late bus for students who had no ride home, attendance at after-school tutoring doubled.*) Explanation: the result (attendance doubled) goes in the main clause at the end, and “because” and “once” state the cause and the timing that the three separate sentences only implied.
      explanation: |
        1 point: a single grammatical sentence that keeps all three ideas and uses subordination (because, since, after, once, which) to show cause or time accurately. 1 point: the explanation names the relationship shown or why the main idea is in the main clause. A comma splice or a string of “and” clauses earns 0 for the first point.

    - slug: u07-w24-q21
