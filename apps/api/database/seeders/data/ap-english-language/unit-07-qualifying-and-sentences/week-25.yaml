week: 25
unit: 7
title: Grammar and Mechanics for Clarity in Hazlitt's "On Familiar Style"
topics: ["7.C", "8.C"]
texts:
  - author: William Hazlitt
    title: On Familiar Style (Table-Talk, Volume II)
    year: 1822
    url: https://www.gutenberg.org/ebooks/3020
guide: guides/week-25.md
guide_description: |
  How grammar and mechanics make an argument clear and give it force: semicolons, colons, dashes and parentheses;
  parallelism; modifiers that attach to the right word; subjects and verbs, pronouns and antecedents that agree.
  William Hazlitt's “On Familiar Style” (1822), an argument for plain, exact English that practises what it
  preaches, read for its punctuation. Then a revision workshop on two invented drafts, a proofreading routine for
  timed essays, common mistakes and a self-check.
flashcards_description: |
  30 cards on punctuation for clarity and emphasis, parallelism, dangling and misplaced modifiers, agreement and
  pronoun reference, and on the argument and sentences of Hazlitt's “On Familiar Style”.

flashcards:
  - front: CED skill 7.C (Unit 7 reading skill) → what it asks you to explain
    back: |
      How grammar and mechanics contribute to the clarity and effectiveness of an argument. You explain what a punctuation mark, a parallel structure or a grammatical choice does: joins, separates, balances, sets aside, emphasises, or prevents a misreading.
    topic_code: "7.C"
  - front: CED skill 8.C (Unit 7 writing skill) → what it asks you to do
    back: |
      Use established conventions of grammar and mechanics to communicate clearly and effectively. On revision questions you pick the version that is both correct and clearest; in essays you control punctuation and agreement so the reader never stumbles.
    topic_code: "8.C"
  - front: Semicolon → its two jobs
    back: |
      1. Join two independent clauses that are closely related, without a conjunction: *The plan is cheap; it is also fast.* 2. Separate items in a series when the items already contain commas. It never joins a clause to a fragment.
    topic_code: "8.C"
  - front: Semicolon before however or therefore → the pattern
    back: |
      Independent clause; however, independent clause. *The bridge reopened; however, traffic is still slow.* However and therefore are adverbs, not conjunctions, so a comma alone before them makes a comma splice.
    topic_code: "8.C"
  - front: Colon → what must come before it and what it promises
    back: |
      A complete independent clause comes before a colon. What follows explains, specifies, lists or completes it: *The district faces one problem: money.* Never put a colon after a verb or after “such as” or “including.”
    topic_code: "8.C"
  - front: Colon versus semicolon → the difference in what each signals
    back: |
      A semicolon says *here is a related idea of equal weight*. A colon says *here is what I just promised*: the explanation, example, list or answer. Choose by the relationship, not by appearance.
    topic_code: "7.C"
  - front: A pair of dashes → what they do inside a sentence
    back: |
      They set off an interruption and turn up its volume: *The cost--nearly a million dollars--was never explained.* Use dashes when the inserted words deserve emphasis; use commas when they do not.
    topic_code: "7.C"
  - front: A single dash near the end of a sentence → its effect
    back: |
      It creates a pause before a final turn, summary or punch: *The report had charts, tables and forty pages of appendices--and no recommendation.* The words after the dash get end focus and a beat of silence before them.
    topic_code: "7.C"
  - front: Parentheses → what they do to an aside
    back: |
      They turn the volume down. Words in parentheses read as an aside, a brief clarification or a wry comment the writer does not want to dwell on. Hazlitt's “(I know)” makes his admission quick and conversational.
    topic_code: "7.C"
  - front: Commas, dashes and parentheses → the volume scale for interrupters
    back: |
      Commas: normal volume, the inserted words belong to the flow. Dashes: loud, the inserted words are emphasised. Parentheses: quiet, the inserted words are an aside. Same grammar, different emphasis.
    topic_code: "7.C"
  - front: Dangling modifier → definition, example and fix
    back: |
      An opening phrase that does not describe the subject right after it. *Walking to school, the rain started.* (The rain was not walking.) Fix by naming the doer: *Walking to school, I got caught in the rain.*
    topic_code: "8.C"
  - front: Misplaced modifier → the classic case of only
    back: |
      A modifier placed next to the wrong word. *She only reads the summaries* (she does nothing else with them?) versus *She reads only the summaries* (she reads nothing else). Put the modifier directly before what it limits.
    topic_code: "8.C"
  - front: Subject-verb agreement across an intervening phrase
    back: |
      Find the true subject and ignore the phrase between it and the verb. *The list of complaints is long* (list is), not *are*. *The essays in this collection remain useful* (essays remain).
    topic_code: "8.C"
  - front: Each, every, either and neither as subjects → singular or plural
    back: |
      Singular. *Each of the blocks has a strip of grass. Neither of the plans works.* The prepositional phrase (of the blocks) does not change the number of the subject.
    topic_code: "8.C"
  - front: Pronoun reference → the problem with an unclear they or this
    back: |
      A pronoun needs one clear antecedent. *Residents can call the parks office, and they will deliver a tree* (who delivers?). *This shows...* with no noun after it often points at nothing. Fix with a noun: *the office will deliver*; *this reversal shows*.
    topic_code: "8.C"
  - front: Parallelism → definition and quick test
    back: |
      Putting items that do the same job in the same grammatical form. Test: read each item with the words that introduce the series. *Trees cool the air, absorb rain and quiet the street* (three verbs) passes; *and they make streets quieter* breaks the pattern.
    topic_code: "7.C"
  - front: Faulty parallelism with not only... but also → example and fix
    back: |
      Faulty: *The plan is not only expensive but also it takes years.* Parallel: *The plan is not only expensive but also slow.* The words after each half of a paired conjunction (not only/but also, either/or, both/and) must match.
    topic_code: "8.C"
  - front: A deliberate fragment in an argument → when it works
    back: |
      A short fragment after a long sentence can land a point with force: *Forty pages of data. No recommendation.* It works when it is clearly deliberate and rare. On revision questions, an accidental fragment is always an error to fix.
    topic_code: "7.C"
  - front: William Hazlitt → who he was
    back: |
      An English essayist, critic and painter (1778-1830), a friend and sometime quarreller of Wordsworth, Coleridge and Lamb. He wrote for magazines and newspapers and is known for vigorous, conversational prose.
    topic_code: "1.A"
  - front: Hazlitt's Table-Talk → what it is and when it appeared
    back: |
      A collection of essays (Table-Talk; or, Original Essays; later editions are subtitled Essays on Men and Manners), published in two volumes in 1821 and 1822. “On Familiar Style” appears in the second. The text is on Project Gutenberg (#3020) and in the public domain in the United States.
    topic_code: "1.A"
  - front: Hazlitt's "On Familiar Style" → his definition of the familiar style
    back: |
      Writing as anyone would speak in common conversation who had a thorough command and choice of words: neither pompous nor vulgar, plain but exact. He insists it is harder than it looks, because it demands precision.
    topic_code: "3.B"
  - front: Hazlitt's "On Familiar Style" → the balanced semicolon sentence about the first word and the best word
    back: |
      “It is not to take the first word that offers, but the best word in common use; it is not to throw words together in any combinations we please, but to follow and avail ourselves of the true idiom of the language.” Two parallel not/but clauses, balanced on a semicolon.
    topic_code: "7.C"
  - front: Hazlitt's "On Familiar Style" → the colon between pompous style and the exact word
    back: |
      “Thus it is easy to affect a pompous style, to use a word twice as big as the thing you want to express: it is not so easy to pitch upon the very word that exactly fits it.” The colon is the hinge of the antithesis: easy on one side, hard on the other.
    topic_code: "7.C"
  - front: Hazlitt's "On Familiar Style" → the aside "(I know)"
    back: |
      “I have been (I know) loudly accused of revelling in vulgarisms and broken English.” The parentheses make the admission brief and conversational, a shrug rather than a defence, and the next sentence turns the charge into a boast.
    topic_code: "7.C"
  - front: Hazlitt's "On Familiar Style" → his comparison of words to money
    back: |
      Words, he says, are “like money, not the worse for being common,” and only the stamp of custom gives them value. The comparison argues that common words are not cheap: they are the currency everyone accepts.
    topic_code: "7.A"
  - front: Hazlitt's "On Familiar Style" → the arch and the pegs and nails
    back: |
      It is not the size of materials “but their being fitted each to its place, that gives strength to the arch.” A word's force lies in its fit, not its grandeur. The analogy follows a colon and a dash, as if the illustration bursts in.
    topic_code: "7.A"
  - front: Hazlitt's "On Familiar Style" → the three "I hate" clauses
    back: |
      “I hate anything that occupies more space than it is worth. I hate to see a load of bandboxes go along the street, and I hate to see a parcel of big words without anything in them.” Parallel clauses and plain words: the sentences practise the economy they demand.
    topic_code: "7.B"
  - front: Hazlitt's "On Familiar Style" → his complaint about Samuel Johnson's style
    back: |
      He objects that Johnson's style has “no discrimination, no selection, no variety”: only long Latinate words. The complaint sharpens Hazlitt's claim by contrast: fine style is choosing the exact common word, not the biggest one.
    topic_code: "3.A"
  - front: Grammar and mechanics on the AP Language exam → where they count
    back: |
      In Section I, many writing questions test punctuation, agreement, modifiers and parallelism in a draft. In the essays, grammar is not scored separately, but errors that blur meaning weaken the evidence-and-commentary score, and controlled style can help earn sophistication.
    topic_code: "8.C"
  - front: Two-minute proofreading routine for a timed AP essay
    back: |
      1. Thesis sentence: is it one clear, complete sentence? 2. Each topic sentence: does the verb agree with its subject, and does any opening phrase dangle? 3. Look for comma splices where you joined two claims, and for a vague this or they.
    topic_code: "8.C"

quiz:
  description: |
    25 questions · about 45 minutes · a set of seven questions on Hazlitt's “On Familiar Style,” then two revision
    sets on student drafts (six questions on a proposal, five on an analytical paragraph), then questions on
    punctuation, modifiers, agreement and parallelism, with review of qualification, clauses and tone. Multiple
    choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically;
    the two short answers and the revision task are graded by your teacher.
  questions:
    # ---- Passage set: Hazlitt, “On Familiar Style”
    - slug: u07-w25-q01
      type: multiple_choice
      topic_code: "7.C"
      source: 'William Hazlitt, "On Familiar Style," Table-Talk (1822)'
      points: 1
      stimulus: &familiar |
        *The following passages are from William Hazlitt's essay “On Familiar Style,” in Table-Talk (1822). By a “familiar” style Hazlitt means the style of educated conversation: plain, but exact.*

        It is not easy to write a familiar style. Many people mistake a familiar for a vulgar style, and suppose that to write without affectation is to write at random. On the contrary, there is nothing that requires more precision, and, if I may so say, purity of expression, than the style I am speaking of. It utterly rejects not only all unmeaning pomp, but all low, cant phrases, and loose, unconnected, *slipshod* allusions. It is not to take the first word that offers, but the best word in common use; it is not to throw words together in any combinations we please, but to follow and avail ourselves of the true idiom of the language.

        [...]

        Thus it is easy to affect a pompous style, to use a word twice as big as the thing you want to express: it is not so easy to pitch upon the very word that exactly fits it.

        [...]

        I have been (I know) loudly accused of revelling in vulgarisms and broken English. I cannot speak to that point; but so far I plead guilty to the determined use of acknowledged idioms and common elliptical expressions.

        [...]

        The proper force of words lies not in the words themselves, but in their application. [...] It is not pomp or pretension, but the adaptation of the expression to the idea, that clenches a writer's meaning:--as it is not the size or glossiness of the materials, but their being fitted each to its place, that gives strength to the arch; or as the pegs and nails are as necessary to the support of the building as the larger timbers, and more so than the mere showy, unsubstantial ornaments. I hate anything that occupies more space than it is worth. I hate to see a load of bandboxes go along the street, and I hate to see a parcel of big words without anything in them.
      prompt: |
        In the last sentence of the first paragraph (“It is not to take the first word that offers... the true idiom of the language”), the semicolon primarily serves to
      options:
        - |
          introduce a list of the words Hazlitt considers vulgar
        - |
          separate a main clause from a dependent clause that explains it
        - |
          signal that the second clause contradicts the first
        - |
          balance two parallel “not... but” clauses of equal weight, each defining the familiar style by what it refuses and what it chooses
      option_explanations:
        - |
          No list follows. The semicolon joins two complete clauses; a list would more likely follow a colon.
        - |
          Both halves are independent clauses (“It is not to take...”, “it is not to throw...”). A semicolon joins independent clauses, not a main clause and a dependent one.
        - |
          The second clause extends the first rather than contradicting it: both say what the familiar style rejects and what it does instead.
        - |
          Correct. The semicolon holds two closely related independent clauses in balance. Each repeats the pattern “not to... but to,” so the punctuation and the parallelism together make the definition precise and memorable.
      answer: 3
      explanation: |
        Skill 7.C: a semicolon joins closely related independent clauses of equal weight. Paired with parallel structure, it lets a writer define by contrast, twice, in one breath.

    - slug: u07-w25-q02
      type: multiple_choice
      topic_code: "7.C"
      source: 'William Hazlitt, "On Familiar Style," Table-Talk (1822)'
      points: 1
      stimulus: *familiar
      prompt: |
        In the sentence “Thus it is easy to affect a pompous style... it is not so easy to pitch upon the very word that exactly fits it,” the colon contributes to the argument chiefly by
      options:
        - |
          acting as a hinge between two opposed claims, so that the ease of pomposity and the difficulty of exactness are set side by side
        - |
          introducing a quotation from another writer who agrees with Hazlitt
        - |
          marking the second clause as an example of a pompous style
        - |
          showing that the second clause is less important than the first
      option_explanations:
        - |
          Correct. The colon promises that what follows completes what came before; here it completes an antithesis (easy against not so easy). The reader feels the contrast as a single balanced thought.
        - |
          No other writer is quoted. Both clauses are Hazlitt's own claims.
        - |
          The second clause describes the plain, exact style, the opposite of pomp. It is not an example of pompous writing.
        - |
          The second clause carries Hazlitt's main point (exactness is hard), and it comes last, in the position of emphasis. The colon does not demote it.
      answer: 0
      explanation: |
        A colon says “here is what I promised.” When the promise is a contrast, the colon becomes the pivot of an antithesis.

    - slug: u07-w25-q03
      type: multiple_choice
      topic_code: "7.A"
      source: 'William Hazlitt, "On Familiar Style," Table-Talk (1822)'
      points: 1
      stimulus: *familiar
      prompt: |
        The parenthetical “(I know)” in “I have been (I know) loudly accused of revelling in vulgarisms and broken English” contributes to the tone chiefly by
      options:
        - |
          expressing anxiety that the accusation will ruin Hazlitt's reputation
        - |
          shifting into a formal legal register that prepares for a courtroom defence
        - |
          making the admission brief and offhand, as if Hazlitt shrugs at the charge before turning it to his advantage
        - |
          suggesting that Hazlitt does not actually know whether anyone has accused him
      option_explanations:
        - |
          The parentheses lower the volume of the aside; nothing in the passage sounds anxious, and the next sentence is a confident boast.
        - |
          “Plead guilty” borrows a legal phrase, but the aside itself is conversational, not formal. The tone is ironic, not courtroom-solemn.
        - |
          Correct. Parentheses make an aside quiet and quick. “(I know)” sounds like conversation, which suits an essay praising a familiar style, and it sets up the reversal in “so far I plead guilty.”
        - |
          “I know” asserts knowledge; the aside confirms that the accusation was made.
      answer: 2
      explanation: |
        Spiral review (7.A): punctuation shapes tone. Parentheses turn the volume down, dashes turn it up; here a quiet aside signals amused confidence.

    - slug: u07-w25-q04
      type: multiple_choice
      topic_code: "3.C"
      source: 'William Hazlitt, "On Familiar Style," Table-Talk (1822)'
      points: 1
      stimulus: *familiar
      prompt: |
        Hazlitt's response to the charge of “revelling in vulgarisms and broken English” (“I cannot speak to that point; but so far I plead guilty to the determined use of acknowledged idioms and common elliptical expressions”) is best described as
      options:
        - |
          a complete denial that his writing contains any informal language
        - |
          a qualified concession that admits only part of the charge and redefines it as a virtue
        - |
          an attack on the critics' personal motives
        - |
          an admission that his critics are entirely right
      option_explanations:
        - |
          He pleads guilty to using idioms and elliptical expressions, so he does not deny informal language. He denies only that it is vulgar.
        - |
          Correct. “So far” limits the admission to “acknowledged idioms and common elliptical expressions”; the charge of “vulgarisms and broken English” becomes, in his restatement, a deliberate choice of common English.
        - |
          The passage does not discuss his critics' motives. Elsewhere in the essay he questions whether they can tell idiom from error, but here he simply limits and recasts the charge.
        - |
          He pleads guilty only “so far,” to a narrower and more respectable charge than the one made.
      answer: 1
      explanation: |
        Spiral review (3.C): a concession can be qualified (“so far”) so that it gives away little and reframes much.

    - slug: u07-w25-q05
      type: multiple_choice
      topic_code: "7.B"
      source: 'William Hazlitt, "On Familiar Style," Table-Talk (1822)'
      points: 1
      stimulus: *familiar
      prompt: |
        The last two sentences of the passage, which repeat “I hate,” are effective chiefly because their structure
      options:
        - |
          uses short parallel independent clauses in plain words, so that the sentences practise the economy they praise
        - |
          subordinates Hazlitt's personal feelings to a general principle stated in the main clause
        - |
          breaks the parallel pattern to show that Hazlitt is uncertain of his position
        - |
          introduces a counterargument that Hazlitt will answer later
      option_explanations:
        - |
          Correct. Three parallel clauses with the same subject and verb, and homely nouns (bandboxes, big words), make the point compactly. After the long arch sentence, the plain repetition demonstrates the familiar style.
        - |
          “I hate” is the main clause each time; nothing subordinates the feeling. The sentences are deliberately personal.
        - |
          The pattern holds through all three clauses. The repetition expresses certainty, not doubt.
        - |
          No opposing view appears in these sentences; they state Hazlitt's own preference.
      answer: 0
      explanation: |
        Spiral review (7.B): repeated independent clauses build emphasis by accumulation. Here they also enact the argument.

    - slug: u07-w25-q06
      type: multi_select
      topic_code: "7.C"
      source: 'William Hazlitt, "On Familiar Style," Table-Talk (1822)'
      points: 2
      partial_credit: true
      stimulus: *familiar
      prompt: |
        Which TWO statements accurately describe how punctuation contributes to the clarity or effect of the passage? Select two.
      options:
        - |
          The colon and dash after “clenches a writer's meaning” introduce analogies (the arch, the pegs and nails) that illustrate the abstract claim before them.
        - |
          The commas in “loose, unconnected, *slipshod* allusions” separate a series of adjectives that pile up the faults of careless style.
        - |
          The semicolon after “I cannot speak to that point” introduces a list of Hazlitt's critics.
        - |
          The parentheses around “I know” mark words quoted from one of Hazlitt's critics.
      option_explanations:
        - |
          Correct. The colon promises an explanation and the dash breaks in with it: “as it is not the size or glossiness of the materials.” The abstract claim about adaptation is made concrete.
        - |
          Correct. Three coordinate adjectives, separated by commas, accumulate into a small catalogue of what the familiar style rejects.
        - |
          No list follows; the semicolon joins two independent clauses, the second beginning “but so far I plead guilty.”
        - |
          “I know” is Hazlitt's own aside, not a quotation. Quoted words would be in quotation marks.
      answer: [0, 1]
      explanation: |
        Read punctuation for what it promises: a colon promises explanation, a dash an interruption, a semicolon a related clause of equal weight, commas in a series a list.

    - slug: u07-w25-q07
      type: true_false
      topic_code: "7.C"
      source: 'William Hazlitt, "On Familiar Style," Table-Talk (1822)'
      points: 1
      stimulus: *familiar
      prompt: |
        True or false: Hazlitt argues that writing in a familiar style means writing quickly, in whatever words come first, without attention to correctness.
      answer: false
      explanation: |
        False. He says the opposite: many people “suppose that to write without affectation is to write at random,” but nothing “requires more precision.” The familiar style takes “the best word in common use,” not the first.

    # ---- Revision set 1: a proposal with errors in modifiers, agreement, parallelism and punctuation
    - slug: u07-w25-q08
      type: multiple_choice
      topic_code: "8.C"
      source: written for this course
      points: 1
      stimulus: &w25_trees |
        *The following is a draft of a proposal a student is writing for a neighborhood association newsletter.*

        (1) Walking down Elm Street in July, the heat rising off the pavement is almost unbearable. (2) The neighborhood has almost no trees, and each of the blocks have only a narrow strip of grass. (3) Trees cool the air, absorb rainwater, and they make streets quieter. (4) A study by a county parks department found that shaded streets were up to ten degrees cooler than unshaded ones on summer afternoons. (5) The planting program would cost money, it would pay for itself in lower energy bills within a decade. (6) The parks office recommends three species that tolerate heat and drought. (7) Any resident who wants a tree can call the parks office, and they will deliver and plant it free of charge.
      prompt: |
        Which revision of sentence 1 corrects its error in modification?
      options:
        - |
          Walking down Elm Street in July, the pavement's heat is almost unbearable.
        - |
          Walking down Elm Street in July, unbearable heat rises off the pavement.
        - |
          Walking down Elm Street in July, I find the heat rising off the pavement almost unbearable.
        - |
          Walking down Elm Street in July the heat, rising off the pavement, is almost unbearable.
      option_explanations:
        - |
          The opening phrase still describes the subject that follows it, now “the pavement's heat.” Heat does not walk, so the modifier still dangles.
        - |
          The subject after the comma is “unbearable heat,” which still cannot be walking down Elm Street.
        - |
          Correct. The subject “I” follows the opening phrase, so the person walking is named and the modifier attaches to the right word.
        - |
          Removing the comma and adding others does not change the subject: “the heat” is still the one walking.
      answer: 2
      explanation: |
        A dangling modifier is fixed by putting the doer of the action right after the opening phrase, or by rewriting the phrase as a clause: *When I walk down Elm Street in July...*

    - slug: u07-w25-q09
      type: multiple_choice
      topic_code: "8.C"
      source: written for this course
      points: 1
      stimulus: *w25_trees
      prompt: |
        Which revision of the underlined portion of sentence 2, “each of the blocks have only a narrow strip,” is correct?
      options:
        - |
          each of the blocks are having only a narrow strip
        - |
          each of the blocks has only a narrow strip
        - |
          each of the block have only a narrow strip
        - |
          each, of the blocks, have only a narrow strip
      option_explanations:
        - |
          The verb is still plural (“are having”), and the progressive form is awkward. “Each” is singular.
        - |
          Correct. The subject is “each,” which is singular; “of the blocks” is a prepositional phrase that does not change the subject's number. “Each... has.”
        - |
          Changing “blocks” to “block” is ungrammatical after “each of,” and the verb still does not agree with “each.”
        - |
          Commas around “of the blocks” wrongly separate the subject from its phrase, and “have” still disagrees with “each.”
      answer: 1
      explanation: |
        Find the true subject and ignore the phrase between it and the verb. Each, every, either and neither take singular verbs.

    - slug: u07-w25-q10
      type: multiple_choice
      topic_code: "8.C"
      source: written for this course
      points: 1
      stimulus: *w25_trees
      prompt: |
        The writer wants to revise sentence 3 so that its series is parallel. Which version best accomplishes this goal?
      options:
        - |
          Trees cool the air, absorbing rainwater, and they make streets quieter.
        - |
          Trees cool the air, absorb rainwater, and making streets quieter.
        - |
          Trees are cooling the air, absorb rainwater, and quieter streets.
        - |
          Trees cool the air, absorb rainwater, and quiet the streets.
      option_explanations:
        - |
          This mixes a verb, a participle and a whole clause. The series is still unbalanced.
        - |
          The third item (“making”) switches to a participle, which breaks the pattern of present-tense verbs.
        - |
          This mixes a progressive verb, a simple verb and a noun phrase; it is less parallel than the original.
        - |
          Correct. Three present-tense verbs with objects (cool the air, absorb rainwater, quiet the streets) make the series parallel and crisp.
      answer: 3
      explanation: |
        Parallelism: items that do the same job take the same form. Test each item after the shared start: *Trees... cool, absorb, quiet.*

    - slug: u07-w25-q11
      type: multiple_choice
      topic_code: "8.B"
      source: written for this course
      points: 1
      stimulus: *w25_trees
      prompt: |
        Which revision of sentence 5 best corrects its error while showing that the writer concedes the cost and emphasises the savings?
      options:
        - |
          Although the planting program would cost money, it would pay for itself in lower energy bills within a decade.
        - |
          The planting program would cost money, however it would pay for itself in lower energy bills within a decade.
        - |
          The planting program would cost money it would pay for itself in lower energy bills within a decade.
        - |
          Although it would pay for itself in lower energy bills within a decade, the planting program would cost money.
      option_explanations:
        - |
          Correct. “Although” makes the cost a dependent clause (the concession) and leaves the savings in the main clause at the end, where emphasis falls. The comma splice is gone.
        - |
          “However” is an adverb, not a conjunction, so a comma before it still leaves a comma splice.
        - |
          Removing the comma creates a fused sentence: two independent clauses with no punctuation or conjunction.
        - |
          This is grammatical but reverses the emphasis: the cost lands in the main clause, so the sentence argues against the program.
      answer: 0
      explanation: |
        Spiral review (8.B): a comma splice has several grammatical fixes, but only one here also concedes the cost and puts the writer's claim in the main clause.

    - slug: u07-w25-q12
      type: multiple_choice
      topic_code: "8.C"
      source: written for this course
      points: 1
      stimulus: *w25_trees
      prompt: |
        The writer wants to name the three species at the end of sentence 6. Which version is punctuated correctly?
      options:
        - |
          The parks office recommends three species that tolerate heat and drought, such as: red maple, honey locust and swamp white oak.
        - |
          The parks office recommends: three species that tolerate heat and drought, red maple, honey locust and swamp white oak.
        - |
          The parks office recommends three species that tolerate heat and drought; red maple, honey locust and swamp white oak.
        - |
          The parks office recommends three species that tolerate heat and drought: red maple, honey locust and swamp white oak.
      option_explanations:
        - |
          A colon should not follow “such as,” which already introduces the examples. Use one or the other.
        - |
          A colon should not come between a verb and its object. Here it splits “recommends” from what is recommended.
        - |
          A semicolon must join two independent clauses; the list after it is not a clause.
        - |
          Correct. A complete independent clause comes before the colon, and the colon delivers the list it promised (“three species”).
