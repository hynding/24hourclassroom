    # ---- Revision set 2: an analytical paragraph about Hazlitt
    - slug: u07-w25-q14
      type: multiple_choice
      topic_code: "8.C"
      source: written for this course
      points: 1
      stimulus: &w25_para |
        *The following is a draft of an analytical paragraph a student is writing about Hazlitt's essay on the familiar style.*

        (1) Hazlitt does not simply tell his readers that plain words are best, he shows them. (2) His own sentences are built from common nouns; bandboxes, pegs, nails and money. (3) When he compares words to money, the reader is reminded that value comes from use, not from rarity. (4) Hazlitt admits that critics accuse him of vulgarisms. (5) He turns the charge into a boast. (6) This, it could be argued, possibly suggests that Hazlitt may perhaps be somewhat confident. (7) Hazlitt's essays, which first appeared in magazines, remains a useful guide for any writer who wants to be understood.
      prompt: |
        Which revision of sentence 1 corrects its punctuation error while keeping the two clauses closely linked?
      options:
        - |
          Hazlitt does not simply tell his readers that plain words are best, however he shows them.
        - |
          Hazlitt does not simply tell his readers that plain words are best he shows them.
        - |
          Hazlitt does not simply tell his readers that plain words are best; he shows them.
        - |
          Hazlitt does not simply tell his readers that plain words are best, and, he shows them.
      option_explanations:
        - |
          “However” cannot join two independent clauses with only a comma; this remains a comma splice.
        - |
          With no punctuation at all, the two independent clauses are fused into a run-on sentence.
        - |
          Correct. A semicolon joins two closely related independent clauses, and the balance (tell / shows) is sharpened by the pause.
        - |
          The comma after “and” is unnecessary and interrupts the sentence; “and” also blurs the contrast between telling and showing.
      answer: 2
      explanation: |
        The semicolon is the classic fix for a comma splice between two closely related clauses, especially when they form a contrast.

    - slug: u07-w25-q15
      type: multiple_choice
      topic_code: "8.C"
      source: written for this course
      points: 1
      stimulus: *w25_para
      prompt: |
        Which revision of sentence 2 is punctuated correctly?
      options:
        - |
          His own sentences are built from common nouns: bandboxes, pegs, nails and money.
        - |
          His own sentences are built from: common nouns, bandboxes, pegs, nails and money.
        - |
          His own sentences are built from common nouns, bandboxes; pegs; nails; and money.
        - |
          His own sentences are built from common nouns such as: bandboxes, pegs, nails and money.
      option_explanations:
        - |
          Correct. A complete clause precedes the colon, and the list that follows specifies the “common nouns” it promised.
        - |
          A colon should not separate a preposition (“from”) from its object; it also turns the category into one more list item.
        - |
          Semicolons in a list are used only when the items contain commas; these do not, and the first comma now makes “bandboxes” look like a description of “common nouns.”
        - |
          A colon should not follow “such as.” Use “such as” without a colon, or a colon without “such as.”
      answer: 0
      explanation: |
        A semicolon joins clauses; a colon introduces what a clause has promised. The draft used the wrong one.

    - slug: u07-w25-q16
      type: multiple_choice
      topic_code: "8.B"
      source: written for this course
      points: 1
      stimulus: *w25_para
      prompt: |
        The writer wants to combine sentences 4 and 5 to show the relationship between Hazlitt's admission and his response. Which version best accomplishes this goal?
      options:
        - |
          Hazlitt admits that critics accuse him of vulgarisms, so he turns the charge into a boast.
        - |
          Hazlitt admits that critics accuse him of vulgarisms, and he turns the charge into a boast.
        - |
          Because he turns the charge into a boast, Hazlitt admits that critics accuse him of vulgarisms.
        - |
          Although Hazlitt admits that critics accuse him of vulgarisms, he turns the charge into a boast.
      option_explanations:
        - |
          “So” claims the boast is the result of the admission, which misstates the relationship: the admission is conceded and then overturned.
        - |
          “And” treats the two actions as equal and unrelated, losing the sense of a reversal.
        - |
          This reverses cause and effect and makes the sentence illogical: the boast does not cause the admission.
        - |
          Correct. “Although” marks the admission as a concession, and the main clause delivers the reversal, which is the writer's point.
      answer: 3
      explanation: |
        Spiral review (8.B): choose the subordinator that names the relationship. A concession followed by a reversal calls for although.

    - slug: u07-w25-q17
      type: multiple_choice
      topic_code: "4.C"
      source: written for this course
      points: 1
      stimulus: *w25_para
      prompt: |
        The writer wants to revise sentence 6 so that it makes a clear, defensible claim. Which version best accomplishes this goal?
      options:
        - |
          This, it could be argued, possibly suggests that Hazlitt may be confident.
        - |
          This proves beyond any doubt that Hazlitt is the most confident writer in English.
        - |
          This reversal shows a writer confident enough to accept the charge and redefine it.
        - |
          This is interesting.
      option_explanations:
        - |
          Removing two hedges still leaves three (“it could be argued,” “possibly,” “may”). The claim remains too weak to defend or dispute.
        - |
          This overcorrects into an absolute, unprovable claim about all writers in English.
        - |
          Correct. “This reversal” gives the pronoun a clear noun, and the claim is stated plainly at a scope the evidence supports.
        - |
          “Interesting” is a judgment, not an analytical claim, and “this” still has no clear referent.
      answer: 2
      explanation: |
        Spiral review (4.C): qualify a claim to fit the evidence, then stop. Stacked hedges are as weak as absolutes.

    - slug: u07-w25-q18
      type: multiple_choice
      topic_code: "8.C"
      source: written for this course
      points: 1
      stimulus: *w25_para
      prompt: |
        Which revision of sentence 7 is correct?
      options:
        - |
          Hazlitt's essays, which first appeared in magazines, remains useful guides for any writer who wants to be understood.
        - |
          Hazlitt's essays, which first appeared in magazines, remain a useful guide for any writer who wants to be understood.
        - |
          Hazlitt's essays which first appeared in magazines, remains a useful guide for any writer who wants to be understood.
        - |
          Hazlitt's essays, which first appeared in magazines; remain a useful guide for any writer who wants to be understood.
      option_explanations:
        - |
          “Remains” is still singular, and the plural subject “essays” needs “remain.”
        - |
          Correct. The subject is “essays,” so the verb is “remain”; the relative clause set off by commas does not change the subject's number.
        - |
          Dropping the first comma leaves the relative clause half-punctuated, and “remains” still disagrees with “essays.”
        - |
          A semicolon cannot separate a subject from its verb, and the clause before it is not independent.
      answer: 1
      explanation: |
        A relative clause between subject and verb can hide the true subject. Bracket it off and read the bare sentence: *Hazlitt's essays remain.*

    # ---- Punctuation, modifiers, agreement and parallelism
    - slug: u07-w25-q19
      type: multi_select
      topic_code: "8.C"
      source: written for this course
      points: 2
      partial_credit: true
      prompt: |
        Which TWO sentences use dashes correctly to give emphasis to the words they set off? Select two.
      options:
        - |
          The report had charts, tables and forty pages of appendices--and no recommendation.
        - |
          The cost of the stadium--nearly a million dollars--was never explained to taxpayers.
        - |
          The council--voted on the proposal in March.
        - |
          The mayor promised--that the bridge would reopen.
      option_explanations:
        - |
          Correct. A single dash creates a pause before the final turn, so “and no recommendation” lands with emphasis at the end.
        - |
          Correct. A pair of dashes sets off an interruption and turns up its volume; the sentence reads correctly without it.
        - |
          The dash separates a subject from its verb for no reason; nothing is being set off or emphasised.
        - |
          The dash splits the verb “promised” from its object clause and adds no emphasis or interruption.
      answer: [0, 1]
      explanation: |
        A dash marks an interruption or a final turn. Test a pair of dashes by removing what they enclose: the sentence must still stand.

    - slug: u07-w25-q20
      type: true_false
      topic_code: "8.C"
      source: general knowledge
      points: 1
      prompt: |
        True or false: a semicolon may be used to join an independent clause to a dependent clause, as in *The plan failed; because no one funded it.*
      answer: false
      explanation: |
        False. A semicolon joins two independent clauses (or separates complex list items). With a dependent clause, use no punctuation or a comma: *The plan failed because no one funded it.*

    - slug: u07-w25-q21
      type: fill_blank
      topic_code: "8.C"
      source: general knowledge
      points: 1
      prompt: |
        An opening phrase that does not describe the subject that follows it, as in *Running for the bus, my backpack fell open*, is called a ____ modifier.
      answer: ["dangling", "dangling modifier", "a dangling modifier"]
      explanation: |
        The backpack was not running. Fix it by naming the runner: *Running for the bus, I felt my backpack fall open.*

    - slug: u07-w25-q22
      type: fill_blank
      topic_code: "7.B"
      source: general knowledge
      points: 1
      prompt: |
        Putting items that do the same job in a sentence into the same grammatical form, as in *to cool the air, to absorb rain and to quiet the street*, is called ____.
      answer: ["parallelism", "parallel structure", "parallel construction", "parallel form"]
      explanation: |
        Parallelism makes relationships among ideas visible: equal ideas look equal. Hazlitt's paired “not... but” clauses and his three “I hate” clauses are examples.

    - slug: u07-w25-q23
      type: short_answer
      topic_code: "7.C"
      source: 'William Hazlitt, "On Familiar Style," Table-Talk (1822)'
      points: 2
      prompt: |
        Choose ONE punctuation choice from the Hazlitt passage in this quiz (a semicolon, a colon, a dash or the parentheses). In two or three sentences, quote the words around it and explain how it contributes to the clarity or effectiveness of Hazlitt's argument.
      answer: |
        Example: In “Thus it is easy to affect a pompous style, to use a word twice as big as the thing you want to express: it is not so easy to pitch upon the very word that exactly fits it,” the colon works as a hinge between two opposite claims. It makes the reader hold the easy thing and the hard thing in one thought, and it gives the second clause, Hazlitt's real point about exactness, the final position. The tidy balance also demonstrates the precision he says the familiar style requires.
      explanation: |
        1 point: accurately identifies a punctuation mark in the passage and quotes or locates the words around it. 1 point: explains its function (balance, contrast, explanation, aside, emphasis) and links that function to Hazlitt's argument or tone. A response that only names the mark (“he uses a colon”) earns at most 1.

    - slug: u07-w25-q24
      type: short_answer
      topic_code: "8.C"
      source: written for this course
      points: 2
      prompt: |
        This sentence from a student's draft contains three errors: *Having read the report, the problems with the new schedule was obvious, students lose lunch time, study hall and they have less time for clubs.* Rewrite it correctly, then name the three errors you fixed.
      answer: |
        Revision: *Having read the report, I saw that the problems with the new schedule were obvious: students lose lunch time, study hall and club time.* Errors fixed: (1) the dangling modifier (the problems did not read the report; “I” now does); (2) subject-verb agreement (“problems... were”); (3) faulty parallelism in the series (“and they have less time for clubs” becomes “club time”). The comma splice before “students” is also corrected with a colon, which introduces the problems promised.
      explanation: |
        1 point: a correct rewrite that fixes the dangling modifier, the agreement error and the faulty parallelism (the comma splice may also be fixed and counts in the student's favour). 1 point: names the errors accurately in any reasonable terms. A rewrite that fixes two of the three errors earns 1 in total.

    - slug: u07-w25-q25
      type: long_answer
      topic_code: "8.C"
      source: written for this course
      points: 5
      prompt: |
        Revise the paragraph below from a student's argument. Correct every error in grammar and punctuation, and improve at least one sentence for clarity or emphasis. Then, in two or three sentences, explain your most important change.

        *Every one of the town's playgrounds need repair. Built in the 1970s, rust covers the swings at Miller Park, the slide at Oak Street has a cracked step. Parents have complained, the council has not acted. The repairs would be expensive. The council should fix the worst playgrounds this year, they should also plan the rest. Children deserve safe places to play, to run, and for meeting friends.*
      answer: |
        Model revision: *Every one of the town's playgrounds needs repair. The swings at Miller Park, built in the 1970s, are covered in rust, and the slide at Oak Street has a cracked step. Parents have complained; the council has not acted. Although the repairs would be expensive, the council should fix the worst playgrounds this year and plan the rest. Children deserve safe places to play, to run and to meet their friends.* Most important change: combining the cost sentence with the proposal using “although” concedes the expense in a dependent clause and puts the proposal in the main clause, so the paragraph's claim gets the emphasis instead of the objection.
      explanation: |
        5 points. Agreement (1): “Every one... needs.” Modifier (1): the dangling “Built in the 1970s” now attaches to the swings. Sentence boundaries (1): all three comma splices are corrected with a semicolon, a period, a conjunction or subordination. Parallelism (1): “to play, to run and to meet their friends” (or another parallel series). Explanation (1): identifies a change that improves clarity or emphasis and explains its effect on the argument, not just that it is correct. Deduct within a row only for errors left or newly introduced.
