    # ---- Qualifiers, counterarguments and the essay as a whole
    - slug: u07-w23-q15
      type: multi_select
      topic_code: "4.C"
      source: written for this course
      points: 2
      partial_credit: true
      prompt: |
        A student's only evidence is one national survey of teenagers about their social media use and how lonely they feel. The student's draft claim is: *Social media platforms are the cause of teenage loneliness.* Which TWO revisions qualify the claim appropriately for that evidence? Select two.
      options:
        - |
          Heavy use of social media appears to be one cause of loneliness among many teenagers.
        - |
          Social media platforms are, without question, the cause of teenage loneliness.
        - |
          For many teenagers, hours spent on social media seem to go together with feeling lonely.
        - |
          Social media might maybe be somewhat related to something like loneliness, possibly.
      option_explanations:
        - |
          Correct. “Appears,” “one cause” and “many teenagers” limit certainty, causation and scope to what a survey can suggest.
        - |
          “Without question” raises certainty instead of limiting it, and a survey cannot prove a single cause.
        - |
          Correct. “Go together with” claims a link rather than a cause, which is what a survey can show, and “many” limits the scope.
        - |
          Stacked hedges (“might maybe,” “somewhat,” “something like,” “possibly”) leave no claim at all. This is over-qualification.
      answer: [0, 2]
      explanation: |
        Match the qualifier to the evidence: a survey shows association across a group, so qualify scope (many), certainty (appears, seem) and the kind of claim (linked with, one cause), and stop there.

