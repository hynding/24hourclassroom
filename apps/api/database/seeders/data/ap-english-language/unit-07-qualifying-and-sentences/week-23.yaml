    - slug: u07-w23-q19
      type: short_answer
      topic_code: "3.C"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 2
      prompt: |
        Montaigne's essay arrives at this sentence: “We may then call these people barbarous, in respect to the rules of reason: but not in respect to ourselves, who in all sorts of barbarity exceed them.” In two or three sentences, explain how the qualification in this sentence serves Montaigne's purpose.
      answer: |
        By granting that the Brazilians may be called barbarous when measured against reason, Montaigne keeps a real standard and avoids the easy claim that they are perfect, which would be harder to believe. By denying that they are barbarous when measured against Europeans, he turns the charge on his own readers: the people who use the word are guiltier than those they use it against. The qualification lets him criticise Europe without seeming merely to excuse cannibalism.
      explanation: |
        1 point: identifies the two measures in the sentence (reason, ourselves) and what Montaigne grants and denies under each. 1 point: explains a purpose the qualification serves, such as making the claim credible, turning the accusation back on European readers, or criticising Europe without defending the practice. A response that only paraphrases the sentence earns at most 1.

    - slug: u07-w23-q20
      type: short_answer
      topic_code: "4.C"
      source: written for this course
      points: 2
      prompt: |
        Rewrite this absolute claim as a qualified, defensible claim: *Standardized tests measure nothing but a student's ability to take tests.* Then, in one sentence, explain what your qualification does.
      answer: |
        Revised claim: *Standardized tests measure some real skills, such as reading speed and basic arithmetic, but they reward test-taking practice enough that a single score is a poor measure of what a student has learned.* The qualification concedes what the tests do measure, which makes the claim believable, and narrows the criticism to the use of one score, which the writer can actually support.
      explanation: |
        1 point: the revision removes the absolute (“nothing but”) and limits the claim by scope, certainty, condition or concession while still taking a position. 1 point: the explanation says what the qualification does (matches the claim to evidence, concedes a point, narrows the claim). A revision so hedged that it no longer takes a position earns 0 for the first point.

    - slug: u07-w23-q21
      type: multiple_choice
      topic_code: "5.A"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 1
      prompt: |
        Which of the following best describes the line of reasoning of “Of Cannibals” as a whole?
      options:
        - |
          Montaigne states his conclusion that Europe is barbarous in the first sentence and spends the rest of the essay repeating it with new examples.
        - |
          Montaigne opens with an anecdote showing that the label “barbarian” can fail when tested by observation, explains why his witness can be trusted, describes the people's customs, and only then compares their cruelty with Europe's.
        - |
          Montaigne narrates his own voyage to Brazil in the order in which events happened and draws no conclusions.
        - |
          Montaigne begins with European atrocities, turns to Plato's Atlantis, and ends with the anecdote of King Pyrrhus as a proof.
      option_explanations:
        - |
          The essay opens with Pyrrhus and the Roman army, not with a verdict on Europe. The charge against Europe comes late, after the description.
        - |
          Correct. Each stage prepares the next: the Pyrrhus story establishes that we must judge “by the eye of reason,” the witness discussion secures the evidence, the description builds the reader's respect, and only then does Montaigne turn the comparison on his readers.
        - |
          Montaigne never went to Brazil; he relies on a man who lived there, on seamen and merchants, and on meeting three Brazilians at Rouen.
        - |
          The order is reversed. Pyrrhus opens the essay, and the comparison of cruelties comes near its end.
      answer: 1
      explanation: |
        Skill 5.A review: a line of reasoning is the order in which claims are made and supported. Montaigne delays his sharpest claim until the reader has accepted the steps that lead to it.

    - slug: u07-w23-q22
      type: long_answer
      topic_code: "4.C"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 5
      prompt: |
        Montaigne argues that people tend to call barbarous whatever differs from the customs of their own country. Write one well-developed argumentative paragraph (about 180-250 words) that takes a position on this question: to what extent should we judge the customs of other communities by our own?

        Your paragraph should make a qualified claim, support it with at least one specific piece of evidence (from “Of Cannibals,” from history, from current events or from your own experience), acknowledge a counterargument or an alternative perspective, and answer it.
      answer: |
        Model paragraph (summary): Claim: *We should hold other communities to standards of cruelty and fairness that apply to everyone, but we should be slow to call their customs wrong simply because they are unfamiliar.* Evidence: Montaigne's observation that we have no measure of truth and reason except the customs of the place we live, and his reversal of the word “wild” with the example of fruit; an example from the writer's experience of a custom that seemed strange until it was explained. Counterargument: if every custom is judged only by its own community, no practice could ever be condemned, even torture. Answer: Montaigne himself does not go that far; he keeps “the rules of reason” as a shared standard and condemns cruelty wherever it appears, Europe included. Commentary connects each piece of evidence to the two-part claim: a universal standard for harm, humility about everything else.
      explanation: |
        5 points. Claim (1): a defensible claim that is qualified (by scope, condition or concession) rather than absolute; “never judge” or “always judge” without limits earns 0. Evidence (1): at least one specific, accurate piece of evidence, with any quotation from Montaigne exact and short. Counterargument (1): a fair statement of an opposing view or alternative perspective, not a straw man. Commentary (2): 2 if the paragraph explains how the evidence supports the claim and answers the counterargument with a reason; 1 if commentary is present but thin or the counterargument is acknowledged without an answer; 0 if the paragraph only summarises Montaigne.
