      type: multiple_choice
      topic_code: "4.C"
      source: written for this course
      points: 1
      stimulus: *w23_draft
      prompt: |
        The writer wants to improve the handling of the counterargument in sentences 5 and 6. Which revision best accomplishes this goal?
      options:
        - |
          Delete sentences 5 and 6, so that the argument does not mention any opposing view.
        - |
          Replace sentence 6 with: Those people have obviously never done any homework themselves.
        - |
          Replace sentences 5 and 6 with: Admittedly, some practice at home can build study habits; but those habits can be built in twenty minutes a night, not the two hours most of our students report.
