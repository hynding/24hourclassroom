week: 23
unit: 7
title: Qualifying Claims in Montaigne's "Of Cannibals"
topics: ["3.C", "4.C"]
texts:
  - author: Michel de Montaigne, translated by Charles Cotton
    title: Of Cannibals (Essays of Montaigne)
    year: 1685
    url: https://www.gutenberg.org/ebooks/3600
guide: guides/week-23.md
guide_description: |
  The first week of Unit 7: how writers qualify claims with modifiers, counterarguments and alternative
  perspectives, and why a well-limited claim is stronger than an absolute one. Then Montaigne's “Of Cannibals”
  (1580, in Charles Cotton's translation) as the model of a writer who limits, concedes and turns the reader's
  judgment back on itself. Four close readings, a lesson on revising absolute claims, common mistakes, the exam
  connection and a self-check.
flashcards_description: |
  30 cards on qualifiers of frequency, scope, certainty and condition, on concession, counterargument, rebuttal
  and alternative perspectives, and on the claims, evidence and context of Montaigne's “Of Cannibals”.

flashcards:
  - front: CED skill 3.C (Unit 7 reading skill) → what it asks you to explain
    back: |
      How claims are qualified through modifiers, counterarguments and alternative perspectives. On a reading question you name the limiting move a writer makes and explain what it does for the argument: narrows it, protects it from an objection, or makes the writer seem fair.
    topic_code: "3.C"
  - front: CED skill 4.C (Unit 7 writing skill) → what it asks you to do
    back: |
      Qualify your own claim using modifiers, counterarguments or alternative perspectives. On a revision question you choose the version of a sentence whose limits match the evidence; in an essay you write a thesis that says how far your claim reaches and why.
    topic_code: "4.C"
  - front: Qualifying a claim → the three tools the CED names
    back: |
      1. Modifiers: words and phrases that limit scope, frequency, certainty or condition (most, often, probably, unless). 2. Counterarguments: an opposing claim the writer states and answers. 3. Alternative perspectives: other ways of seeing the issue that the writer acknowledges, uses or partly accepts.
    topic_code: "3.C"
  - front: Qualifier versus empty hedge → when a limiting word strengthens an argument
    back: |
      A qualifier strengthens an argument when it matches the evidence: a survey of one school supports a claim about that school, not about every student in the country. An empty hedge (sort of, kind of, maybe in some ways) limits nothing in particular and only makes the writer sound unsure.
    topic_code: "4.C"
  - front: Modifiers of frequency → a scale from absolute to cautious
    back: |
      always, almost always, usually, often, sometimes, occasionally, rarely, never. Each step changes what the writer must prove. A claim with “always” or “never” falls to one counterexample; a claim with “usually” needs a pattern, not a perfect record.
    topic_code: "4.C"
  - front: Modifiers of scope → examples and what they limit
    back: |
      Words and phrases that limit who or what the claim covers: all, most, many, some, few; “in large cities,” “for students under sixteen,” “in the first year.” Scope modifiers match the claim to the population the evidence describes.
    topic_code: "4.C"
  - front: Modifiers of certainty → examples and what they signal
    back: |
      certainly, clearly, probably, likely, may, might, appears to, suggests. They tell the reader how confident the writer is. Use strong certainty for what the evidence settles and weaker certainty for inferences and predictions.
    topic_code: "4.C"
  - front: Modifiers of condition → the clauses that set the terms of a claim
    back: |
      Clauses beginning with if, unless, provided that, as long as, only when. Example: *A four-day school week can save money, provided that the district also pays for child care on the fifth day.* The claim holds under stated conditions, which the writer then defends.
    topic_code: "4.C"
  - front: Counterargument (AP Language) → definition
    back: |
      An opposing claim, stated fairly, that a reasonable reader might raise against the writer's position. Including it shows the writer has thought about the audience's doubts; the argument then answers it with a concession, a rebuttal or a refutation.
    topic_code: "3.C"
  - front: Concession → definition and signal words
    back: |
      Granting that part of an opposing view is true. Signals: admittedly, granted, to be sure, it is true that, although, while. A concession limits the writer's own claim and builds trust; it must be followed by the writer's answer, or it simply gives ground.
    topic_code: "3.C"
  - front: Rebuttal → what it does after a concession
    back: |
      It answers the conceded point: shows that it matters less than it seems, that it leads to the writer's conclusion anyway, or that the opposing side draws the wrong inference from it. Signals: but, yet, still, even so, nevertheless.
    topic_code: "3.C"
  - front: Alternative perspective versus counterargument → the difference
    back: |
      A counterargument opposes the writer's claim. An alternative perspective is another way of framing the issue (an economist's view of a school schedule, a parent's, a bus driver's) that the writer may use, partly accept or fold into a more complex claim. Both qualify; only one disagrees.
    topic_code: "3.C"
  - front: Absolute claims → why AP readers distrust all, every and never
    back: |
      An absolute claim promises more than any evidence can deliver, and one counterexample breaks it. Readers notice; the writer looks careless or partisan. Replace the absolute with the strongest claim your evidence actually supports.
    topic_code: "4.C"
  - front: Over-qualified claims → the symptom and the fix
    back: |
      Symptom: a sentence so loaded with may, perhaps, in some ways and possibly that it claims nothing a reader could disagree with. Fix: keep one precise limit that matches the evidence and state the rest plainly. Qualification narrows a claim; it should not dissolve it.
    topic_code: "4.C"
  - front: Michel de Montaigne → who he was and why he matters to the essay form
    back: |
      A French magistrate and landowner (1533-1592) who retired to his estate near Bordeaux and wrote the Essais (1580, expanded until his death). He invented the essay as a form: a mind testing an idea in the first person, admitting doubt and changing course as it goes.
    topic_code: "1.A"
  - front: Montaigne's title Essais → what the word means and why it fits qualified argument
    back: |
      Essais means attempts, trials or tests. Each piece tries out an idea rather than proving it once and for all, so qualification is built into the form: Montaigne marks what he knows, what he has only heard, and where his judgment might be wrong.
    topic_code: "1.A"
  - front: Montaigne's "Of Cannibals" → its exigence
    back: |
      Europeans in the 1500s were reading travellers' reports of the peoples of Brazil and calling them savages. Montaigne had a servant who had lived there and had met three Brazilians at Rouen. The essay answers the easy European verdict of barbarism by turning the question back on Europe.
    topic_code: "1.A"
  - front: Montaigne's "Of Cannibals" → the King Pyrrhus anecdote and its lesson
    back: |
      Pyrrhus expected Roman “barbarians” but found their army well ordered. Montaigne draws the lesson that we should judge “by the eye of reason, and not from common report.” The anecdote sets up the whole essay: a label inherited from opinion may not survive inspection.
    topic_code: "3.A"
  - front: Montaigne's "Of Cannibals" → why he trusts a "plain ignorant fellow" as his witness
    back: |
      Better-educated travellers, he says, cannot resist improving a story to seem wise; a simple man has no means or motive to invent. He adds that the man brought seamen and merchants from the same voyage. It is a claim about the reliability of evidence, and it is itself qualified.
    topic_code: "3.A"
  - front: Montaigne's "Of Cannibals" → the phrase "by anything that I can gather"
    back: |
      A modifier of certainty and scope. Montaigne finds nothing barbarous in the nation as far as his evidence reaches, and says so. The phrase admits that his knowledge is second-hand while still allowing him to make the claim.
    topic_code: "3.C"
  - front: Montaigne's "Of Cannibals" → the comparison with wild fruit
    back: |
      We call fruits “wild” when nature grows them; we should rather call wild the ones we have changed by artifice. The analogy is evidence by comparison: it reverses the value of “wild” and “savage,” so that what is natural becomes the standard and European custom becomes the deviation.
    topic_code: "3.A"
  - front: Montaigne's "Of Cannibals" → the concession about the "barbarous horror" of eating prisoners
    back: |
      Montaigne grants that the practice is horrible (“I am not sorry that we should here take notice of the barbarous horror of so cruel an action”) and then turns: the fault is that, seeing their faults, we are blind to our own. A concession that becomes the launch for a sharper charge.
    topic_code: "3.C"
  - front: Montaigne's "Of Cannibals" → "in respect to the rules of reason" versus "in respect to ourselves"
    back: |
      The essay's final qualified claim: these people may be called barbarous when measured against reason, but not when measured against Europeans, who exceed them in every kind of barbarity. The qualification lets Montaigne keep a standard (reason) while denying Europe the right to use it as a weapon.
    topic_code: "3.C"
  - front: Montaigne's "Of Cannibals" → the French Wars of Religion as context
    back: |
      From 1562 France was torn by wars between Catholics and Protestants. When Montaigne mentions torture seen “among neighbours and fellow-citizens” and done “under colour of piety and religion,” his first readers knew exactly which atrocities he meant.
    topic_code: "1.A"
  - front: Montaigne's "Of Cannibals" → how he says people use the word barbarism
    back: |
      Everyone, he argues, calls barbarous whatever is not the custom of his own country, because we have no measure of truth and reason except the opinions and customs of the place we live. The thesis is about the word and the judge, not only about the people judged.
    topic_code: "3.B"
  - front: Charles Cotton's Montaigne → who translated it and why this course quotes it
    back: |
      Charles Cotton (1630-1687), an English poet, published his translation of the Essays in 1685-86. This course quotes the version edited by William Carew Hazlitt, which is in the public domain in the United States and on Project Gutenberg (#3600).
    topic_code: "1.A"
  - front: The concede-and-rebut sentence → a model built on although
    back: |
      *Although later start times cost districts money for buses, the gains in attendance and grades in districts that have tried them suggest the cost is worth paying.* The dependent clause concedes; the main clause, which carries the weight, rebuts.
    topic_code: "4.C"
  - front: "\"Some people argue... they are wrong\" → why this counterargument move scores poorly"
    back: |
      It names an opposing view only to dismiss it, with no reason given. A reader who holds that view is not answered, only insulted. A real counterargument states the view at its strongest and then explains, with evidence or reasoning, why the writer's claim still holds.
    topic_code: "4.C"
  - front: Qualified thesis on the AP argument essay → where the limit belongs
    back: |
      In the thesis itself, not in a last-paragraph afterthought. *Schools should limit homework to an hour a night in most courses, though skill-building subjects like mathematics and languages need regular practice* tells the reader from the start what the essay will defend and where it stops.
    topic_code: "4.C"
  - front: The sophistication point and qualification → how a qualified argument can earn it
    back: |
      The 2026 rubric awards the sophistication point for, among other things, explaining the complexities or tensions in the issue. A thesis that sets limits, takes an opposing view seriously and explains why the claim still holds, under which conditions, is doing exactly that.
    topic_code: "4.C"

quiz:
  description: |
    22 questions · about 40 minutes · a set of eight questions on three passages from Montaigne's “Of Cannibals,”
    a revision set of six questions on a student's draft that overclaims, then questions on qualifiers,
    counterarguments and the essay as a whole, with review of claims and evidence, context, thesis, transitions and
    line of reasoning. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items
    are matched automatically; the two short answers and the paragraph are graded by your teacher.
  questions:
    # ---- Passage set: Montaigne, “Of Cannibals”
    - slug: u07-w23-q01
      type: multiple_choice
      topic_code: "3.C"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 1
      stimulus: &cannibals |
        *The following passages are from Michel de Montaigne's essay “Of Cannibals” (1580), in Charles Cotton's English translation (1685). Montaigne has been describing the peoples of coastal Brazil from the reports of a man who lived among them. In the second passage, “so cruel an action” refers to their custom of killing and eating prisoners of war.*

        Now, to return to my subject, I find that there is nothing barbarous and savage in this nation, by anything that I can gather, excepting, that every one gives the title of barbarism to everything that is not in use in his own country. As, indeed, we have no other level of truth and reason than the example and idea of the opinions and customs of the place wherein we live: there is always the perfect religion, there the perfect government, there the most exact and accomplished usage of all things. They are savages at the same rate that we say fruits are wild, which nature produces of herself and by her own ordinary progress; whereas, in truth, we ought rather to call those wild whose natures we have changed by our artifice and diverted from the common order.

        [...]

        I am not sorry that we should here take notice of the barbarous horror of so cruel an action, but that, seeing so clearly into their faults, we should be so blind to our own. I conceive there is more barbarity in eating a man alive, than when he is dead; in tearing a body limb from limb by racks and torments, that is yet in perfect sense; in roasting it by degrees; in causing it to be bitten and worried by dogs and swine (as we have not only read, but lately seen, not amongst inveterate and mortal enemies, but among neighbours and fellow-citizens, and, which is worse, under colour of piety and religion), than to roast and eat him after he is dead.

        [...]

        But there never was any opinion so irregular, as to excuse treachery, disloyalty, tyranny, and cruelty, which are our familiar vices. We may then call these people barbarous, in respect to the rules of reason: but not in respect to ourselves, who in all sorts of barbarity exceed them.
      prompt: |
        In the first sentence, the phrase “by anything that I can gather” primarily serves to
      options:
        - |
          suggest that Montaigne secretly doubts his witness and expects the reader to reject the claim
        - |
          limit the claim to what Montaigne's evidence can support, while still allowing him to make it
        - |
          reveal that Montaigne has travelled to Brazil and gathered his information in person
        - |
          introduce a counterargument that Montaigne goes on to accept in full
      option_explanations:
        - |
          Montaigne has already explained at length why he trusts his witness, and he goes on to build the essay on this claim. The phrase limits the claim; it does not abandon it.
        - |
          Correct. The phrase is a modifier of certainty and scope: Montaigne finds nothing barbarous as far as his second-hand evidence reaches. He admits the limit of his knowledge and makes the claim anyway.
        - |
          Montaigne's information comes from “a man in my house” who lived in the New World; the verb “gather” refers to collecting reports, not to travel. Nothing in the passage says he went there.
        - |
          No opposing view is stated in the phrase. It qualifies Montaigne's own claim; the real turn in the sentence comes later, with “excepting.”
      answer: 1
      explanation: |
        A modifier of certainty tells the reader how far the writer's knowledge reaches. Montaigne's honesty about his evidence makes the bold claim that follows easier to accept.

    - slug: u07-w23-q02
      type: multiple_choice
      topic_code: "3.C"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 1
      stimulus: *cannibals
      prompt: |
        The exception introduced by “excepting, that every one gives the title of barbarism to everything that is not in use in his own country” has which effect on the first sentence's claim?
      options:
        - |
          It admits one real fault in the Brazilians, which weakens Montaigne's defence of them.
        - |
          It restates the claim in more formal language without changing its meaning.
        - |
          It shifts attention from the people being judged to the habit of the people who judge them, so that the exception becomes a criticism of Europeans.
        - |
          It concedes that European customs are, on reflection, superior to those of Brazil.
      option_explanations:
        - |
          The exception names no fault of the Brazilians at all. The only “barbarism” left is the label others give them, which is a fact about the labellers.
        - |
          The clause adds something new: it explains where the charge of barbarism comes from. It is not a paraphrase of the first half of the sentence.
        - |
          Correct. The sentence looks as if it will grant an exception to the claim, but the exception describes the accusers: everyone calls barbarous whatever differs from home. The qualification becomes the essay's thesis about judgment.
        - |
          The next sentence mocks the idea that home is always “the perfect religion, there the perfect government”; Montaigne does not concede European superiority.
      answer: 2
      explanation: |
        A qualifying clause can carry the main point. Read an “except” or “unless” clause carefully: here it turns a limited defence of one people into a general claim about how all people judge.

    - slug: u07-w23-q03
      type: multiple_choice
      topic_code: "3.A"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 1
      stimulus: *cannibals
      prompt: |
        Montaigne's comparison between the Brazilians and fruits that “we say” are wild functions as evidence that
      options:
        - |
          the word “wild” usually reflects the speaker's standard rather than any defect in the thing described, so the same may be true of “savage”
        - |
          the Brazilians live mainly on fruit rather than on cultivated grain
        - |
          European farming has improved the taste of every kind of fruit
        - |
          nature is always cruel and must be corrected by human artifice
      option_explanations:
        - |
          Correct. The analogy reverses the usual value of “wild”: what nature produces by its own course is the standard, and what we have altered by artifice is the deviation. The comparison supports the claim that “savage” is a label from the judge's point of view.
        - |
          The fruit is an analogy, not a description of diet. The sentence compares how we name people with how we name fruit.
        - |
          The passage says the opposite: we have “changed” cultivated fruit “by our artifice and diverted” it “from the common order.” Cultivation is presented as a corruption.
        - |
          Montaigne praises what nature produces “of herself”; he does not call nature cruel or in need of correction.
      answer: 0
      explanation: |
        Skill 3.A: an analogy can serve as evidence when it reveals a pattern the reader already accepts (how we name fruit) and applies it to the disputed case (how we name people).

    - slug: u07-w23-q04
      type: multiple_choice
      topic_code: "3.C"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 1
      stimulus: *cannibals
      prompt: |
        The sentence beginning “I am not sorry that we should here take notice of the barbarous horror of so cruel an action” is best described as
      options:
        - |
          a refutation that denies the Brazilians ever kill or eat their prisoners
        - |
          an alternative perspective drawn from a different witness
        - |
          a digression that interrupts the argument to describe Montaigne's feelings
        - |
          a concession that grants the horror of the practice and then turns the charge against the readers who condemn it
      option_explanations:
        - |
          Montaigne does not deny the practice; he calls it a “barbarous horror.” A refutation would argue that the opposing claim is false.
        - |
          No new witness or point of view is introduced. The sentence is Montaigne's own judgment, addressed to his European readers (“we”).
        - |
          The sentence is central to the argument, not a departure from it. It sets up the comparison of cruelties that follows.
        - |
          Correct. “I am not sorry that we should... take notice” grants the opposing point; “but that... we should be so blind to our own” turns it. The concession makes the turn harder to resist, because Montaigne has not pretended the practice is harmless.
      answer: 3
      explanation: |
        The concede-and-turn sentence is the core move of qualified argument. It grants what is true in the opposing view and uses it to reach the writer's own claim.

    - slug: u07-w23-q05
      type: multiple_choice
      topic_code: "7.A"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 1
      stimulus: *cannibals
      prompt: |
        Within the parenthesis in the second passage, the phrase “and, which is worse, under colour of piety and religion” contributes to the tone chiefly by
      options:
        - |
          softening the charge, since cruelty done for religion is presented as understandable
        - |
          sharpening the charge with irony, since the cruelty is disguised as its opposite, devotion
        - |
          shifting into a neutral, scientific register for describing torture
        - |
          expressing uncertainty about whether the events really took place
      option_explanations:
        - |
          “Which is worse” marks the religious pretext as an aggravation, not an excuse. The phrase makes the European cruelty less forgivable.
        - |
          Correct. “Under colour of” means under the pretence of. Cruelty done in the name of piety is the opposite of what it claims to be, and Montaigne's “which is worse” makes the irony bitter.
        - |
          The passage is anything but neutral: “tearing a body limb from limb,” “worried by dogs and swine.” The parenthesis heightens the indignation.
        - |
          “We have not only read, but lately seen” insists on eyewitness certainty. The parenthesis strengthens the factual claim.
      answer: 1
      explanation: |
        Skill 7.A: word choice (“colour” as pretence) and the placement of “which is worse” at the climax of a long parenthesis create a tone of controlled outrage.

    - slug: u07-w23-q06
      type: multi_select
      topic_code: "3.C"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 2
      partial_credit: true
      stimulus: *cannibals
      prompt: |
        Which TWO phrases from the passages most clearly qualify one of Montaigne's claims, limiting how far it reaches? Select two.
      options:
        - |
          “by anything that I can gather”
        - |
          “there the perfect government”
        - |
          “in respect to the rules of reason: but not in respect to ourselves”
        - |
          “in tearing a body limb from limb by racks and torments”
      option_explanations:
        - |
          Correct. The phrase limits the claim that there is nothing barbarous in the nation to what Montaigne's evidence shows.
        - |
          This phrase is part of Montaigne's mockery of how every people treats its own customs as perfect. It describes an attitude; it does not limit any of his claims.
        - |
          Correct. The final sentence grants that the people may be called barbarous by one measure (reason) and denies it by another (Europe). The claim is precisely bounded.
        - |
          This is evidence of European cruelty, one item in a list. It supports a claim but does not limit it.
      answer: [0, 2]
      explanation: |
        To find a qualifier, ask which words set the limits of a claim: how certain, how far, by what measure. Evidence and description, however vivid, are not qualifiers.

    - slug: u07-w23-q07
      type: true_false
      topic_code: "3.C"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 1
      stimulus: *cannibals
      prompt: |
        True or false: in these passages Montaigne claims that the Brazilians cannot be called barbarous by any standard at all.
      answer: false
      explanation: |
        False. His final sentence allows that “We may then call these people barbarous, in respect to the rules of reason.” What he denies is that Europeans may call them barbarous by comparison with themselves. The claim is qualified, not absolute.

    - slug: u07-w23-q08
      type: multiple_choice
      topic_code: "1.A"
      source: 'Michel de Montaigne, "Of Cannibals" (1580), translated by Charles Cotton (1685)'
      points: 1
      stimulus: *cannibals
      prompt: |
        Montaigne's remark that such cruelties were “lately seen, not amongst inveterate and mortal enemies, but among neighbours and fellow-citizens” would most likely have reminded his first readers of
      options:
        - |
          the Roman wars described by Plutarch
        - |
          reports of Spanish conquests in Mexico and Peru
        - |
          the religious civil wars then being fought in France between Catholics and Protestants
        - |
          the punishments described in Plato's Republic
      option_explanations:
        - |
          The cruelties are “lately seen,” in Montaigne's own time. Ancient Rome is too distant to fit, and the Romans appear in the essay as an example of order, not cruelty.
        - |
          Those conquests were fought against foreign peoples, not among “neighbours and fellow-citizens.” The phrase points to a war inside one country.
        - |
          Correct. France's Wars of Religion began in 1562 and were fought between French Catholics and Protestants, often neighbours, each side claiming to act for God. The phrase “under colour of piety and religion” completes the reference.
        - |
          Plato is mentioned elsewhere in the essay as an imagined judge, but the phrase “lately seen” points to recent events, not to an ancient book.
      answer: 2
      explanation: |
        Skill 1.A: context is part of the rhetorical situation. Montaigne could leave the reference implicit because his audience had lived through it.

    # ---- Revision set: a student draft that overclaims
    - slug: u07-w23-q09
      type: multiple_choice
      topic_code: "4.C"
      source: written for this course
      points: 1
      stimulus: &w23_draft |
        *The following is a draft of an argument a student is writing for the school newspaper.*

        (1) Every student in America is harmed by homework. (2) Teachers assign it out of habit, not because it works. (3) In a survey of 400 students at our school last spring, 62 percent said they spend more than two hours a night on homework, and 48 percent said they sleep less than seven hours on school nights. (4) Homework never helps anyone learn anything. (5) Some people say that practice at home builds good study habits. (6) They are wrong. (7) Practice problems in mathematics might be the one exception. (8) So our school should ban all homework immediately.
      prompt: |
        The writer wants to revise sentence 1 so that its claim matches the evidence offered in sentence 3. Which version best accomplishes this goal?
      options:
        - |
          Every student in America is badly harmed by homework, as everyone knows.
        - |
          Homework may possibly, in certain ways, perhaps be harmful to some people.
        - |
          Students everywhere hate homework.
        - |
          At our school, heavy homework loads appear to be costing many students sleep.
      option_explanations:
        - |
          This keeps the national, absolute claim and adds an appeal to common belief. A survey of one school cannot support a claim about every student in America.
        - |
          This version is so hedged that it claims almost nothing, and “some people” is vaguer than the evidence, which is about students at one school.
        - |
          The survey measures hours and sleep, not feelings, and it covers one school, not students everywhere. The claim still outruns the evidence.
        - |
          Correct. The scope (our school), the frequency (many students) and the certainty (appear to be) all match a one-school survey about workload and sleep.
      answer: 3
      explanation: |
        Skill 4.C: qualify a claim to fit the evidence. Ask three questions of any claim: who does it cover, how often is it true, and how sure can the writer be?

    - slug: u07-w23-q10
      type: multiple_choice
      topic_code: "4.C"
      source: written for this course
      points: 1
      stimulus: *w23_draft
      prompt: |
        Sentence 4 contradicts sentence 7. Which revision of sentence 4 best removes the contradiction while keeping the force of the writer's argument?
      options:
        - |
          In most subjects, long nightly assignments do little to improve what students learn.
        - |
          Homework never helps anyone learn anything, except in math.
        - |
          Homework is bad.
        - |
          It could be that homework does not always help everyone learn everything all of the time.
      option_explanations:
        - |
          Correct. “In most subjects” leaves room for the exception in sentence 7, and “long nightly assignments” targets the kind of homework the survey points to. The claim is limited but still arguable.
        - |
          Tacking an exception onto “never... anyone... anything” produces a sentence that contradicts itself and still overclaims for every other subject.
        - |
          This is vaguer, not more precise. It drops the claim about learning and gives the reader nothing to weigh.
        - |
          Four hedges in a row empty the sentence. An over-qualified claim is as weak as an absolute one, because no reader could disagree with it.
      answer: 0
      explanation: |
        Good qualification narrows a claim to what the writer can defend. It does not pile up “may” and “perhaps” until nothing is left.

