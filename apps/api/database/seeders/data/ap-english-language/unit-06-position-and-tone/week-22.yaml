    - slug: u06-w22-q21
      type: short_answer
      topic_code: "4.B"
      source: written for this course
      points: 2
      prompt: |
        Addams describes a conflict between charity workers who investigate families before giving help and neighbours who help one another at once. Write a thesis statement (one or two sentences) for an argument essay on this question: should organisations that give aid to families in need investigate them first? Your thesis must take a position, acknowledge one opposing perspective, and preview at least one reason.
      answer: |
        Although some checking protects limited funds from misuse, aid organisations should help families first and ask questions later, because a long investigation humiliates people at their most vulnerable and teaches them to perform the virtues the agency wants to see.
      explanation: |
        1 point: a defensible position on the question, stated in the main clause. 1 point: acknowledges a specific opposing perspective and previews at least one reason. A thesis that only describes the debate, or that concedes so fully that it takes no position, earns 0.

