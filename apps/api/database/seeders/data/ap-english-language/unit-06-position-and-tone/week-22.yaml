    - slug: u06-w22-q23
      type: long_answer
      topic_code: "4.B"
      source: written for this course
      points: 5
      prompt: |
        Write the introduction (about 100-150 words) to an argument essay responding to this prompt: *Jane Addams observed that charity visitors preached thrift and hard work to families whose struggles they had never shared. Write an essay that argues your position on whether people should give advice about problems they have not experienced themselves.* Your introduction should establish the context, acknowledge another perspective, and end with a thesis that takes a defensible position and previews your line of reasoning.
      answer: |
        Context: A student who has never held a job tells a classmate working twenty hours a week to manage time better; a health columnist who has never been poor explains how to shop on a tight budget. Advice from outside a problem is everywhere, and Addams saw its costs in the charity visitor who felt "she has no right to say these things." Perspective: inexperienced advisers can sometimes see clearly what someone inside a problem cannot, and expertise can be learned from study as well as from life. Thesis: Even so, advice about a problem one has not lived through should be offered as a question rather than a verdict, because the adviser lacks knowledge of the constraints that shape the choice and because advice from above damages the trust that makes help possible.
      explanation: |
        5 points. Context (1): the introduction opens with relevant, specific context for the issue (an example, a situation or a reference to Addams), not a sweeping generalisation. Perspective (1): it fairly acknowledges a specific opposing perspective. Thesis (2): 2 points for a thesis that takes a defensible position on the prompt and previews at least two reasons; 1 point for a defensible position without a preview, or a preview with a vague position; 0 for a thesis that restates the prompt or takes no side. Control (1): the paragraph moves logically from context to perspective to thesis, ending on the thesis.
