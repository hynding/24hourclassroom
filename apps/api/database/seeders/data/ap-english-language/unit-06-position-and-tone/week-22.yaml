week: 22
unit: 6
title: Writing a Thesis That Holds Two Perspectives, with Jane Addams on Charity
topics: ["4.B"]
texts:
  - author: Jane Addams
    title: Democracy and Social Ethics
    year: 1902
    url: https://www.gutenberg.org/ebooks/15487
guide: guides/week-22.md
guide_description: |
  The unit's writing week: how to write a thesis that requires proof, takes a clear position, previews the
  argument's structure and acknowledges another perspective without surrendering to it. The model is Jane Addams's
  chapter “Charitable Effort” from Democracy and Social Ethics (1902), in which the founder of Chicago's Hull-House
  sets the charity visitor's moral standard beside the standard of the poor families she visits and argues that
  democracy has made the old relation untenable. Close readings of how Addams states and maps her claim, a
  step-by-step lesson in drafting and revising thesis statements for all three Section II essays, common mistakes,
  an exam connection and self-check questions.
flashcards_description: |
  30 cards on thesis statements (defensible, qualified, previewing, for argument, rhetorical analysis and
  synthesis), revising weak theses, and the context, claims and key phrases of Jane Addams's “Charitable Effort”.

flashcards:
  - front: Defensible thesis → the two tests
    back: |
      Could a reasonable, informed person disagree? Can the claim be supported with evidence and reasoning in the space you have? A thesis that passes both requires proof and can get it.
    topic_code: "4.B"
  - front: Thesis vs announcement
    back: |
      An announcement says what you will do (In this essay I will discuss charity). A thesis says what you claim (Charity that investigates before it helps teaches the poor to perform virtues rather than practise them). Exam readers want the claim.
    topic_code: "4.B"
  - front: Thesis too broad → the symptom and the fix
    back: |
      The claim covers more than any essay could prove (Charity has always been bad). Fix it by limiting time, place, group or degree: which charity, for whom, under what conditions.
    topic_code: "4.B"
  - front: Thesis too narrow → the symptom and the fix
    back: |
      The claim is a fact that needs no argument (Addams founded Hull-House in 1889). Fix it by asking what the fact shows, and claim that.
    topic_code: "4.B"
  - front: Previewing thesis → what it adds
    back: |
      Reasons named in the order the body paragraphs take them up, often in a because clause or a list. The reader can predict the route; the writer has an outline.
    topic_code: "4.B"
  - front: Qualified thesis → the shape
    back: |
      Although [another perspective's strongest point], [your position], because [your reasons]. The concession makes the claim more precise and more credible, not weaker, as long as the main clause still takes a side.
    topic_code: "4.B"
  - front: Acknowledging a perspective vs giving up a position
    back: |
      Acknowledging says what is true in another view and shows your claim accounts for it. Giving up replaces your claim with theirs. A thesis that ends I can see both sides has done the second.
    topic_code: "4.B"
  - front: Rhetorical analysis thesis (Q2) → what it must contain
    back: |
      The writer's purpose or claim, the main choices you will analyse, and how those choices serve the purpose for this audience. Naming devices alone (uses ethos, pathos and logos) earns no thesis point.
    topic_code: "4.B"
  - front: Argument thesis (Q3) → what it must contain
    back: |
      A defensible position on the prompt's issue, ideally with the reasons that will organise the essay. Agree, disagree or qualify are all acceptable; vagueness is not.
    topic_code: "4.B"
  - front: Synthesis thesis (Q1) → what it must contain
    back: |
      A position on the prompt's question, in your own words, that the sources will support. The thesis is yours; the sources are evidence for it, not a list of what each one says.
    topic_code: "4.B"
  - front: Thesis point on the AP rubric → where it must appear
    back: |
      Anywhere in the essay, but readers look first at the end of the introduction. One clear defensible sentence earns the point; a thesis that only restates the prompt does not.
    topic_code: "4.B"
  - front: The so-what test for a thesis
    back: |
      After writing your thesis, ask: so what? If the answer adds a consequence or significance (because it teaches the poor to perform virtues), add that to the thesis. It often turns an acceptable claim into a strong one.
    topic_code: "4.B"
  - front: Revising a thesis after drafting
    back: |
      Drafts often discover a better claim than the one they started with. Reread your conclusion; if it says something sharper than your thesis, move that idea to the introduction.
    topic_code: "4.B"
  - front: Loaded words in a thesis → why to cut them
    back: |
      Words like ridiculous, idiotic or obviously make the thesis sound like a verdict before the evidence. A precise verb or adjective (misjudges, discourages, untenable) carries the same position with more credibility.
    topic_code: "8.A"
  - front: Jane Addams → who she was
    back: |
      Social reformer and writer (1860-1935) who in 1889 co-founded Hull-House, a settlement house in a poor immigrant neighbourhood of Chicago, where educated residents lived among their neighbours and ran clubs, classes and services. She received the Nobel Peace Prize in 1931.
    topic_code: "4.B"
  - front: Democracy and Social Ethics → publication and plan
    back: |
      Book by Jane Addams, 1902, built from lectures. Each chapter tests one relationship (charity, family, household employment, industry, education, politics) against the standard of democracy.
    topic_code: "4.B"
  - front: Settlement house → why it shapes Addams's perspective
    back: |
      Addams lived among the families charity workers visited. Her perspective is that of an educated reformer who has also seen charity from the neighbours' side, and she writes to readers like herself.
    topic_code: "4.B"
  - front: Addams's thesis in "Charitable Effort"
    back: |
      Democracy is changing the relation between benefactor and beneficiary faster than any other, and in doing so it exposes the inequality in charity and makes the old, confident way of giving untenable.
    topic_code: "4.B"
  - front: "\"no relation in life which our democracy is changing more rapidly than the charitable relation\""
    back: |
      The first half of Addams's thesis sentence: the claim of change. The second half adds that no contact reveals so clearly "the lack of that equality which democracy implies." Two claims, two halves of the chapter.
    topic_code: "4.B"
  - front: The charity visitor in Addams's chapter
    back: |
      A young college woman, "well-bred and open-minded," sent to advise a poor family. Addams uses her as a representative figure so readers can see the problem from inside a role many of them held.
    topic_code: "4.B"
  - front: "\"parasitic cleanliness\" → Addams's self-critical irony"
    back: |
      The daintily dressed visitor in the washerwoman's untidy house realises that her own cleanliness depends on others' labour. The phrase turns a sign of respectability into a sign of dependence.
    topic_code: "7.A"
  - front: Addams's two ethical standards
    back: |
      The visitor preaches the industrial virtues: work, thrift, self-support. The neighbours practise a standard of immediate kindness: lend, share, take in the family on the street. Addams calls the meeting of the two "an absolute clashing of two ethical standards."
    topic_code: "4.B"
  - front: The neighbours' perspective on organized charity
    back: |
      To families who help each other at once, the visitor's delay and investigation look like "the cold and calculating action of a selfish man." Addams presents the view seriously, as an ethic, not as ignorance.
    topic_code: "4.B"
  - front: "\"organized\" and \"charity\" → why the pair makes Addams uneasy"
    back: |
      Even reformers who want order find something distasteful in joining the words, because a scheme replaces "the natural promptings of the heart." Addams admits the discomfort in herself and her readers.
    topic_code: "4.B"
  - front: Addams's "we" → whom it includes
    back: |
      Her pronouns place her among the educated, charitable readers she criticises (We have learned, our democratic instinct). Criticising a group from inside it makes the argument harder to dismiss as an attack.
    topic_code: "4.B"
  - front: The visiting nurse in "Charitable Effort"
    back: |
      The one popular charity, Addams says, because the nurse meets obvious needs that require no investigation, so her help reads as sympathy. The example sharpens the claim that investigation is what alienates the poor.
    topic_code: "4.B"
  - front: Investigation and moral deterioration → Addams's claim
    back: |
      When aid depends on displaying approved virtues, families learn to "gravely laud temperance and cleanliness and thrift" to the visitor. The system rewards performance rather than character, which harms both sides.
    topic_code: "4.B"
  - front: Addams's line of reasoning → the order of "Charitable Effort"
    back: |
      Thesis (democracy is changing charity); history (charity was once harsh with a good conscience); the visitor's discomfort; the neighbours' standard; the clash; the costs of investigation. Each step widens the reader's perspective.
    topic_code: "4.B"
  - front: Addams vs Roosevelt → two perspectives on duty
    back: |
      Roosevelt (1899) preaches the strenuous life of effort and empire; Addams (1902) asks whether preaching industrial virtue to the poor is fair at all. Both write about duty; their perspectives lead to different positions.
    topic_code: "4.B"
  - front: Writing a thesis from two perspectives → Addams's model
    back: |
      Name what each side sees truly, then claim what both miss. Addams grants the visitor's good intentions and the neighbours' genuine kindness, and argues that the relation itself must change.
    topic_code: "4.B"

quiz:
  description: |
    23 questions · about 40 minutes · a set of nine questions on the opening of Jane Addams's “Charitable Effort”, a
    revision set of five questions on a student's thesis, then questions on writing defensible, qualified and
    previewing theses, and on earlier skills (thesis and structure, claims, tone, context). Multiple choice,
    select-all and true/false items are graded at once; the fill-in-the-blank items are matched automatically; the
    two short answers and the introduction are graded by your teacher against the model answer and scoring notes.
  questions:
    # ---- Passage set: Addams's thesis and her two perspectives
    - slug: u06-w22-q01
      type: multiple_choice
      topic_code: "3.B"
      source: 'Jane Addams, Democracy and Social Ethics (1902)'
      points: 1
      stimulus: &addams_charity |
        *The following passages are from "Charitable Effort," the second chapter of Jane Addams's Democracy and Social Ethics (1902). Addams had co-founded Hull-House, a settlement house in a poor immigrant neighbourhood of Chicago, in 1889.*

        Probably there is no relation in life which our democracy is changing more rapidly than the charitable relation--that relation which obtains between benefactor and beneficiary; at the same time there is no point of contact in our modern experience which reveals so clearly the lack of that equality which democracy implies. We have reached the moment when democracy has made such inroads upon this relationship, that the complacency of the old-fashioned charitable man is gone forever; while, at the same time, the very need and existence of charity, denies us the consolation and freedom which democracy will at last give.

        [...] Formerly when it was believed that poverty was synonymous with vice and laziness, and that the prosperous man was the righteous man, charity was administered harshly with a good conscience; for the charitable agent really blamed the individual for his poverty, and the very fact of his own superior prosperity gave him a certain consciousness of superior morality.

        [...]

        The daintily clad charitable visitor who steps into the little house made untidy by the vigorous efforts of her hostess, the washerwoman, is no longer sure of her superiority to the latter; she recognizes that her hostess after all represents social value and industrial use, as over against her own parasitic cleanliness and a social standing attained only through status.

        [...]

        Let us take a neighborhood of poor people, and test their ethical standards by those of the charity visitor, who comes with the best desire in the world to help them out of their distress. A most striking incongruity, at once apparent, is the difference between the emotional kindness with which relief is given by one poor neighbor to another poor neighbor, and the guarded care with which relief is given by a charity visitor to a charity recipient. The neighborhood mind is at once confronted not only by the difference of method, but by an absolute clashing of two ethical standards.

        [...] When they see the delay and caution with which relief is given, it does not appear to them a conscientious scruple, but as the cold and calculating action of a selfish man.
      prompt: |
        Which statement best expresses the thesis of the first paragraph?
      options:
        - |
          Charity should be abolished because it insults the poor.
        - |
          The poor should learn the industrial virtues from charity visitors.
        - |
          Democracy has already produced complete equality between rich and poor.
        - |
          Democracy is rapidly changing the charitable relation and, in doing so, exposes the inequality within it, so the old confident way of giving can no longer be sustained.
      option_explanations:
        - |
          Addams criticises how charity is given, not its existence; she even says "the very need and existence of charity" keeps democracy unfinished.
        - |
          The chapter questions this very assumption; the visitor's lessons in industrial virtue are what make her uneasy.
        - |
          The paragraph says the opposite: charity "reveals so clearly the lack of that equality which democracy implies."
        - |
          Correct. The first sentence makes two linked claims (rapid change; revealed inequality), and the second concludes that the "complacency of the old-fashioned charitable man is gone forever."
      answer: 3
      explanation: |
        A thesis can arrive as a paired claim. Read both halves, and the sentence that draws their consequence (skill 3.B, from week 21).

    - slug: u06-w22-q02
      type: multiple_choice
      topic_code: "3.B"
      source: 'Jane Addams, Democracy and Social Ethics (1902)'
      points: 1
      stimulus: *addams_charity
      prompt: |
        The structure of Addams's first sentence ("no relation ... changing more rapidly ... at the same time there is no point of contact ... which reveals so clearly the lack of that equality") is significant chiefly because it
      options:
        - |
          introduces a list of charitable organisations in Chicago
        - |
          sets two parallel superlative claims side by side, previewing a chapter about both change and the inequality that change exposes
        - |
          concedes that the charitable relation has not changed at all
        - |
          restates the conclusion of the previous chapter word for word
      option_explanations:
        - |
          No organisations are named; the sentence is about a relationship, not institutions.
        - |
          Correct. “No relation ... more rapidly” and “no point of contact ... so clearly” are balanced superlatives joined by “at the same time.” The pairing announces the chapter's double subject.
        - |
          The sentence claims rapid change; it concedes nothing of the kind.
        - |
          Nothing in the passage refers to a previous chapter's conclusion.
      answer: 1
      explanation: |
        Parallel structure in a thesis often maps the argument. Notice what is paired and how the pair is joined.

    - slug: u06-w22-q03
      type: multiple_choice
      topic_code: "3.A"
      source: 'Jane Addams, Democracy and Social Ethics (1902)'
      points: 1
      stimulus: *addams_charity
      prompt: |
        The paragraph beginning "Formerly when it was believed..." supports Addams's argument primarily by
      options:
        - |
          proving that the poor were in fact lazy in earlier times
        - |
          praising the older form of charity as more honest
        - |
          describing an earlier belief that let charity be harsh "with a good conscience," so that the reader sees how far moral assumptions have shifted
        - |
          introducing statistics on poverty in the nineteenth century
      option_explanations:
        - |
          Addams reports what was “believed,” not what was true; the paragraph distances itself from the belief.
        - |
          The older charity is described as harsh and self-righteous ("a certain consciousness of superior morality"), not praised.
        - |
          Correct. The historical contrast is evidence for the claim that democracy has changed the relation: once the belief that poverty meant vice is gone, the old methods lose their moral justification (skill 3.A, from week 19).
        - |
          The paragraph contains no numbers; its evidence is a description of an earlier way of thinking.
      answer: 2
      explanation: |
        A “then and now” contrast is a common form of evidence for a claim about change.

    - slug: u06-w22-q04
      type: multiple_choice
      topic_code: "7.A"
      source: 'Jane Addams, Democracy and Social Ethics (1902)'
      points: 1
      stimulus: *addams_charity
      prompt: |
        The description of the “daintily clad charitable visitor” and her “parasitic cleanliness” conveys a tone that is best described as
      options:
        - |
          gently ironic and self-critical, turning a sign of respectability into a sign of dependence
        - |
          openly contemptuous of the washerwoman
        - |
          sentimental admiration for the visitor's fine clothes
        - |
          detached and purely statistical
      option_explanations:
        - |
          Correct. “Daintily clad” and “parasitic” reverse the expected judgement: the visitor's cleanliness depends on others' labour, while the untidy house shows “vigorous efforts.” Addams, herself one of the educated class, aims the irony at her own side.
        - |
          The washerwoman is credited with "social value and industrial use"; the irony falls on the visitor.
        - |
          “Daintily” and “parasitic” undercut the visitor rather than admire her.
        - |
          The words are evaluative and ironic, not neutral or numerical.
      answer: 0
      explanation: |
        A writer criticising her own group often uses gentle irony rather than attack (skill 7.A, from week 20). Look for a familiar virtue redescribed as a fault.

    - slug: u06-w22-q05
      type: multiple_choice
      topic_code: "3.A"
      source: 'Jane Addams, Democracy and Social Ethics (1902)'
      points: 1
      stimulus: *addams_charity
      prompt: |
        In the paragraph beginning "Let us take a neighborhood of poor people," Addams treats the neighbours' view of charity chiefly as
      options:
        - |
          a misunderstanding that the visitor must correct
        - |
          a genuine ethical standard that clashes with the visitor's, so the conflict is between two moralities rather than between morality and ignorance
        - |
          evidence that poor neighbourhoods have no ethical standards at all
        - |
          an amusing anecdote unrelated to the chapter's claim
      option_explanations:
        - |
          Addams does not cast the neighbours as simply mistaken; she tests the visitor's standard by theirs, not only theirs by hers.
        - |
          Correct. "An absolute clashing of two ethical standards" names both as standards. Taking the neighbours' perspective seriously is central to her claim that the charitable relation must change.
        - |
          The paragraph credits the neighbours with “emotional kindness”; their standard is a different ethic, not an absence of one.
        - |
          The contrast between neighbourly relief and guarded charity is the core evidence of the chapter.
      answer: 1
      explanation: |
        Describing an opposing perspective in its own terms, as an ethic with reasons, is what makes Addams's argument fair and persuasive.

    - slug: u06-w22-q06
      type: multiple_choice
      topic_code: "1.A"
      source: 'Jane Addams, Democracy and Social Ethics (1902)'
      points: 1
      stimulus: *addams_charity
      prompt: |
        The pronouns “our” and “us” in the first paragraph suggest that Addams's intended audience is
      options:
        - |
          the poor families receiving charity
        - |
          government officials in Washington
        - |
          educated, comfortable readers who give or support charity, a group in which Addams includes herself
        - |
          children learning about democracy for the first time
      option_explanations:
        - |
          The poor are discussed in the third person (“them,” “the neighborhood mind”); they are the subject, not the addressed audience.
        - |
          Nothing in the passage addresses government; the relation discussed is between private benefactors and recipients.
        - |
          Correct. “Our democracy,” “denies us,” and later “Let us take a neighborhood” place writer and reader on the benefactor's side. Addams criticises the charitable class from inside it (skill 1.A, from week 1).
        - |
          The diction and the moral complexity of the argument assume adult readers.
      answer: 2
      explanation: |
        Pronouns are evidence of audience. Ask who “we” includes and who is “they.”

    - slug: u06-w22-q07
      type: multi_select
      topic_code: "3.A"
      source: 'Jane Addams, Democracy and Social Ethics (1902)'
      points: 2
      partial_credit: true
      stimulus: *addams_charity
      prompt: |
        Which TWO statements accurately describe how Addams handles the perspectives of the charity visitor and the poor neighbours? Select two.
      options:
        - |
          She grants the visitor good intentions ("the best desire in the world to help") while showing how her methods look from the other side.
        - |
          She shows what each side misreads in the other: the visitor's caution looks selfish to the neighbours, and the neighbours' expectations puzzle the visitor.
        - |
          She presents only the visitor's perspective and never describes the neighbours' views.
        - |
          She concludes that the neighbours are lazy and should be blamed for their poverty.
      option_explanations:
        - |
          Correct. Addams credits the visitor's motive, then shows the visitor's “guarded care” and “delay and caution” as the neighbours experience them.
        - |
          Correct. The final sentence reports that caution "does not appear to them a conscientious scruple"; the misunderstanding runs both ways, which is why Addams speaks of a clash.
        - |
          Much of the passage is devoted to the neighbours' standard and how they see the visitor.
        - |
          This is the older belief Addams describes and rejects ("Formerly when it was believed...").
      answer: [0, 1]
      explanation: |
        Fair treatment of perspectives means stating each in terms its holders would accept, including what each side gets wrong about the other.

    - slug: u06-w22-q08
      type: true_false
      topic_code: "3.B"
      source: 'Jane Addams, Democracy and Social Ethics (1902)'
      points: 1
      stimulus: *addams_charity
      prompt: |
        True or false: in these passages Addams argues that charity visitors are selfish people who should stop helping the poor.
      answer: false
      explanation: |
        False. Addams says the visitor comes "with the best desire in the world," and she reports that the neighbours mistake her caution for selfishness. Her claim is about the relation and its methods, which democracy has made untenable, not about the visitors' character.

    - slug: u06-w22-q09
      type: multiple_choice
      topic_code: "4.B"
      source: 'Jane Addams, Democracy and Social Ethics (1902)'
      points: 1
      stimulus: *addams_charity
      prompt: |
        A student is writing a rhetorical analysis of this passage. Which thesis would best earn the thesis point?
      options:
        - |
          Jane Addams uses ethos, pathos and logos in her chapter about charity.
        - |
          In this essay I will analyse Jane Addams's “Charitable Effort.”
        - |
          Jane Addams founded Hull-House in Chicago in 1889.
        - |
          Writing to readers like herself, Addams persuades the charitable class to question its own methods by turning its symbols of virtue into signs of privilege and by presenting the poor's opposing standard as a genuine ethic.
      option_explanations:
        - |
          Listing appeals names no purpose and no specific choices; on the rubric it does not count as a defensible thesis.
        - |
          An announcement of the topic makes no claim.
        - |
          A biographical fact is too narrow to require proof.
        - |
          Correct. It names the audience, the purpose and two specific strategies (ironic redescription and fair presentation of the opposing view), so it is defensible and previews the essay's structure.
      answer: 3
      explanation: |
        A rhetorical analysis thesis links choices to purpose and audience. Device lists, announcements and facts do not.

    # ---- Revision set: a student's introduction and plan
    - slug: u06-w22-q10
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: &w22_draft |
        *The following is a student's draft introduction to an argument essay, with the plan for its body paragraphs. The sentences are numbered.*

        (1) Our district plans to replace printed textbooks with digital textbooks on school-issued tablets next fall. (2) Supporters point out that digital books are cheaper to update and lighter to carry. (3) Teachers in last year's pilot classrooms reported that students skimmed more and took fewer notes when reading on screens. (4) Digital textbooks are a really stupid idea. (5) There are many opinions about textbooks.

        Plan: Body paragraph 1, reading and note-taking on screens. Body paragraph 2, students without reliable internet at home. Body paragraph 3, the cost of repairing and replacing tablets.
      prompt: |
        The writer wants to replace sentence 5 with a thesis that takes a defensible position on the district's plan. Which version best accomplishes this goal?
      options:
        - |
          Textbooks have been used in schools for hundreds of years.
        - |
          Some students like digital textbooks and others prefer printed ones.
        - |
          The district should keep printed textbooks for core courses, because the switch would weaken how students read.
        - |
          This essay will explore the issue of digital textbooks.
      option_explanations:
        - |
          A historical fact needs no defence; it is too narrow to be a thesis.
        - |
          Reporting that preferences differ takes no position.
        - |
          Correct. It makes a specific claim about the district's plan that a reasonable person could dispute, and it gives a reason the body can prove.
        - |
          An announcement of the topic makes no claim.
      answer: 2
      explanation: |
        A defensible thesis takes a side on the specific question at issue: here, the district's plan.

    - slug: u06-w22-q11
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: *w22_draft
      prompt: |
        The writer wants the thesis to acknowledge the supporters' perspective in sentence 2 while keeping a clear position. Which version best accomplishes this goal?
      options:
        - |
          Although digital books are cheaper to update and easier to carry, the district should keep printed textbooks for core courses, because the savings do not outweigh the cost to students' reading.
        - |
          Digital books are cheaper and lighter, so the district is right to adopt them.
        - |
          Supporters and opponents both make good points, and the district should consider them all.
        - |
          Supporters of digital textbooks clearly have not thought about this at all.
      option_explanations:
        - |
          Correct. The concession names the supporters' strongest points accurately, and the main clause keeps the position and explains why those points are outweighed.
        - |
          This adopts the supporters' position instead of acknowledging it; the writer's own claim disappears.
        - |
          The sentence acknowledges everyone and claims nothing.
        - |
          Dismissing the other side is not acknowledging it; the insult also weakens the writer's credibility.
      answer: 0
      explanation: |
        The qualified thesis pattern is: although [their strongest point], [my position], because [my reason]. Keep the main clause yours.

    - slug: u06-w22-q12
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: *w22_draft
      prompt: |
        The writer wants a thesis that previews the three body paragraphs in the order of the plan. Which version best accomplishes this goal?
      options:
        - |
          The district should keep printed textbooks, because tablets are expensive to fix, students read worse on screens, and some families lack internet.
        - |
          The district should keep printed textbooks, because students read less carefully on screens, because tablets leave students without home internet behind, and because repairing and replacing tablets would erase the promised savings.
        - |
          The district should keep printed textbooks for many important reasons.
        - |
          Students read less carefully on screens.
      option_explanations:
        - |
          It names the right three reasons but in a different order from the plan, so the preview would mislead the reader about the essay's structure.
        - |
          Correct. The three reasons appear in the plan's order (reading, internet access, cost), so the thesis works as a map of the essay.
        - |
          "Many important reasons" previews nothing; the reader cannot predict the structure.
        - |
          This is the claim of one body paragraph, not the thesis of the whole essay.
      answer: 1
      explanation: |
        A previewing thesis is a promise about order. Keep the promise, or revise the thesis when the plan changes.

    - slug: u06-w22-q13
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: *w22_draft
      prompt: |
        A classmate suggests this thesis: *Technology is ruining education everywhere.* Which revision best fixes its main problem while keeping its general direction?
      options:
        - |
          Technology is completely and totally ruining education everywhere in the world.
        - |
          Technology is sometimes used in education.
        - |
          Everyone knows that technology is bad.
        - |
          Replacing printed textbooks with tablets in our district's core courses would make students worse readers.
      option_explanations:
        - |
          Adding intensifiers makes the claim even broader and harder to prove.
        - |
          This narrows the claim until it is a fact no one disputes; it no longer needs an argument.
        - |
          Claiming universal agreement replaces evidence with assertion and is still far too broad.
        - |
          Correct. The revision limits the claim by place (our district), scope (core courses) and effect (reading), so an essay can actually prove it.
      answer: 3
      explanation: |
        A thesis that is too broad cannot be defended in an essay. Limit it by time, place, group or degree.

    - slug: u06-w22-q14
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
