    # ---- Writing theses
    - slug: u06-w22-q15
      type: multiple_choice
      topic_code: "7.A"
      source: 'Jane Addams, Democracy and Social Ethics (1902)'
      points: 1
      prompt: |
        Later in “Charitable Effort,” Addams writes: “Even those of us who feel most sorely the need of more order in altruistic effort and see the end to be desired, find something distasteful in the juxtaposition of the words “organized” and “charity.”” The sentence contributes to her argument mainly by
      options:
        - |
          admitting, on behalf of reformers like herself, a discomfort that supports the neighbours' perspective even while she grants the need for order
        - |
          rejecting all organised help as worthless
        - |
          mocking the poor for their distrust of organisations
        - |
          defining charity for readers unfamiliar with the word
      option_explanations:
        - |
          Correct. “Even those of us” places Addams among the reformers; confessing their unease lends weight to the neighbours' view that a scheme cannot replace kindness, without denying that order is needed.
        - |
          She grants "the need of more order"; the sentence expresses unease, not rejection.
        - |
          The discomfort described is the reformers' own; no one is mocked.
        - |
          The sentence assumes readers know the word; it examines a feeling about it.
      answer: 0
      explanation: |
        A confession made on behalf of one's own side is a powerful tone choice: it shows honesty and makes the opposing perspective harder to dismiss.

    - slug: u06-w22-q16
      type: multiple_choice
      topic_code: "4.B"
      source: general knowledge
      points: 1
      prompt: |
        An argument prompt asks whether schools should require students to take a personal finance course. Which sentence is a defensible thesis that requires proof?
      options:
        - |
          Personal finance includes budgeting, saving and borrowing.
        - |
          Schools should require a semester of personal finance, because students who learn to budget and borrow before they leave home make fewer costly mistakes.
        - |
          This essay will discuss whether schools should require personal finance.
        - |
          Is personal finance important?
      option_explanations:
        - |
          A definition is a fact; no one would argue with it.
        - |
          Correct. It takes a position someone could dispute (a requirement) and gives a reason the essay must prove.
        - |
          An announcement names a topic and makes no claim.
        - |
          A question can open an essay, but it is not a thesis; it asserts nothing.
      answer: 1
      explanation: |
        A thesis is a statement, not a question or an announcement, and it must be open to reasonable disagreement.

    - slug: u06-w22-q17
      type: multi_select
      topic_code: "4.B"
      source: general knowledge
      points: 2
      partial_credit: true
      prompt: |
        Which TWO sentences would work as defensible thesis statements for an argument essay? Select two.
      options:
        - |
          Although homework can reinforce skills, schools should cap nightly homework at one hour, because the sleep and family time students give up costs more than extra practice gains.
        - |
          A city that wants people downtown after dark should invest in lighting and late buses before it invests in new parking garages.
        - |
          The school library is located on the second floor.
        - |
          Some people think the voting age should be lowered, and some people do not.
      option_explanations:
        - |
          Correct. It acknowledges another perspective, takes a position and gives a reason that must be proved.
        - |
          Correct. It makes a comparative claim about priorities that a reasonable person could dispute.
        - |
          The library's location is a checkable fact, so there is nothing for an essay to argue.
        - |
          Describing disagreement is not taking a position.
      answer: [0, 1]
      explanation: |
        Defensible theses take a side on a question people genuinely dispute. Facts and reports of disagreement do not.

