    - slug: u06-w20-q21
      type: short_answer
      topic_code: "3.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 2
      stimulus: |
        *The following passage is from Mark Twain's essay "Fenimore Cooper's Literary Offences" (1895).*

        Cooper's eye was splendidly inaccurate. Cooper seldom saw anything correctly. He saw nearly all things as through a glass eye, darkly. Of course a man who cannot see the commonest little every-day matters accurately is working at a disadvantage when he is constructing a "situation." In the Deerslayer tale Cooper has a stream which is fifty feet wide where it flows out of a lake; it presently narrows to twenty as it meanders along for no given reason; and yet when a stream acts like that it ought to be required to explain itself.
      prompt: |
        In two or three sentences, identify the claim Twain makes in this passage and explain how his evidence supports it, including how the tone of the evidence helps.
      answer: |
        Twain claims that Cooper was a careless observer whose inaccurate details make his scenes implausible. His evidence is a measurable inconsistency in Deerslayer, a stream fifty feet wide that shrinks to twenty for no reason, which any reader can check. The deadpan demand that the stream “explain itself” makes the error funny, but the comedy depends on the fact being real, so the joke and the proof work together.
      explanation: |
        1 point: states the claim (Cooper's observation is inaccurate, which makes his situations unconvincing). 1 point: explains how the specific evidence (the changing width of the stream) supports it, with some attention to how the tone (deadpan, personifying the stream, the paradox "splendidly inaccurate") makes the point memorable. A response that only paraphrases earns at most 1.

    - slug: u06-w20-q22
      type: short_answer
      topic_code: "8.A"
      source: written for this course
      points: 2
      prompt: |
        Rewrite the following neutral sentence twice, once in a tone of measured concern suitable for a letter to a city council, and once in a tone of wry irony suitable for a humorous column. Then name the one choice in each version that most creates its tone.

        *The city has not repaired the potholes on Elm Street since last winter.*
      answer: |
        Measured concern: Nearly a year after last winter's storms, the potholes on Elm Street remain unrepaired, and drivers now swerve into the bike lane to avoid them. (The concrete consequence, drivers swerving into the bike lane, creates concern without exaggeration.) Wry irony: The potholes on Elm Street, now entering their second year of service, have become something of a local landmark. (Treating the potholes as a proud civic feature, “second year of service,” “landmark,” creates the irony.)
      explanation: |
        1 point: two revisions that clearly convey the two different tones requested, both still stating the same fact. 1 point: correctly identifies the specific word choice, detail, comparison or syntax that creates each tone. A pair of revisions that differ only in punctuation or in an intensifier (“very,” “extremely”) earns at most 1.

    - slug: u06-w20-q23
      type: long_answer
      topic_code: "7.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 5
      prompt: |
        Write one well-developed paragraph (about 175-225 words). Make a claim about how Twain's tone in "Fenimore Cooper's Literary Offences" advances his argument against Cooper's reputation. Support it with at least two short quotations from different parts of the essay, and explain how the word choice, comparisons or syntax in each create the tone and serve the argument.
      answer: |
        Claim: Twain's mock-courteous, mock-legal tone lets him appear reasonable while delivering a total verdict, so the reader laughs at Cooper's admirers before realising they have been persuaded. Evidence 1: he opens by regretting that the professors would praise Cooper “without having read some of it.” Commentary: the gentle phrasing contains a brutal implication, that no one who had read the books could praise them, and the courtesy makes Twain seem calm while his targets seem careless. Evidence 2: he charges Cooper with “114 offences against literary art out of a possible 115.” Commentary: the vocabulary of crime and the mock-precise score turn taste into evidence; the absurd exactness parodies measurement while asserting that the faults are countable. Evidence 3: the ending, “Counting these out, what is left is Art,” follows a catalogue of everything Deerslayer lacks. Commentary: the deadpan concession leaves nothing standing and turns Lounsbury's “pure work of art” into a punchline. Link: the comedy is the argument, because each joke depends on a fault being real.
      explanation: |
        5 points. Claim (1): an arguable claim connecting a precisely named tone to Twain's argument (not just “the tone is funny”). Evidence (2): 2 points for at least two accurate, short quotations from different parts of the essay; 1 point for one, or for quotations that are inaccurate or from a single sentence. Commentary (2): 2 points if each quotation's word choice, comparison or syntax is explained as creating the tone and serving the argument; 1 point if commentary names devices without explaining their effect, or explains only one quotation; 0 for summary.
