    - slug: u06-w20-q14
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *w20_draft
      prompt: |
        The writer learns that the board's main concern is the cost of rearranging bus routes. Which sentence, added before sentence 6, best demonstrates an understanding of that concern while keeping the writer's position?
      options:
        - |
          Money should never matter when students are involved.
        - |
          The buses are old anyway and should be replaced.
        - |
          If the board cannot afford buses, it should just cancel first period.
        - |
          Rearranging bus routes has a real cost, and districts that made this change found savings by running elementary routes first; a phased plan could do the same here.
      option_explanations:
        - |
          Dismissing the board's concern tells the readers their priorities are wrong, which closes the conversation.
        - |
          This introduces a new expense rather than addressing the concern about cost.
        - |
          The flippant suggestion mocks the concern and proposes something the writer does not want.
