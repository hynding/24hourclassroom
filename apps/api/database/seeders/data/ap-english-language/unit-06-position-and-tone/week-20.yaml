week: 20
unit: 6
title: Tone and Its Shifts in Mark Twain's "Fenimore Cooper's Literary Offences"
topics: ["7.A", "8.A"]
texts:
  - author: Mark Twain
    title: Fenimore Cooper's Literary Offences
    year: 1895
    url: https://www.gutenberg.org/ebooks/3172
guide: guides/week-20.md
guide_description: |
  Tone as a writer's attitude made visible in words, comparisons and sentence shapes, and how tone can carry an
  argument's position by itself. The case study is Mark Twain's essay "Fenimore Cooper's Literary Offences" (1895),
  a comic demolition of a famous novelist and of the professors who praised him: mock-legal rules, deadpan
  statistics, understatement that turns into hyperbole, and a closing catalogue that reverses itself. Then a
  writing lesson on choosing and controlling tone in your own argument, with invented drafts revised from sarcastic
  to forceful, common mistakes, an exam connection and self-check questions.
flashcards_description: |
  30 cards on tone and tone shifts, the devices that create them (diction, comparison, syntax, understatement,
  hyperbole, irony), controlling tone in your own writing, and the context and key moves of Twain's essay on
  Cooper.

flashcards:
  - front: Tone → the AP Language definition
    back: |
      A writer's attitude toward the subject or the audience, as shown in word choice, comparisons and syntax. Tone is something you infer from evidence on the page, then describe with a precise adjective.
    topic_code: "7.A"
  - front: Tone vs mood → which one AP Language asks about
    back: |
      Tone belongs to the writer (scornful, earnest, wry); mood is what a reader feels. AP Language questions almost always ask about the writer's tone, because tone is a rhetorical choice aimed at an audience.
    topic_code: "7.A"
  - front: Tone shift → the four signals to look for
    back: |
      Look for a turn word (but, yet, still), a change in sentence length, a move from plain to formal diction or back, or a sudden question. Then name the tone on each side of the shift and explain why the writer turns there.
    topic_code: "7.A"
  - front: Tone words → why "positive" and "negative" earn nothing
    back: |
      They are too vague to explain anything. Choose a word that names the exact attitude: scathing, wry, indignant, mock-solemn, measured, rueful, admiring, contemptuous. Then pair it with the evidence that shows it.
    topic_code: "7.A"
  - front: Diction → denotation and connotation in tone
    back: |
      Denotation is a word's dictionary meaning; connotation is the feeling and judgement it carries. Calling Cooper's faults “offences” instead of “weaknesses” turns a book review into a criminal trial.
    topic_code: "7.A"
  - front: Understatement (litotes) → the effect
    back: |
      Saying less than the facts justify, so the reader supplies the rest. "Cooper's art has some defects" lands as comedy because the next sentence counts 114 offences on two-thirds of a page.
    topic_code: "7.A"
  - front: Hyperbole → when it argues and when it only exaggerates
    back: |
      Deliberate exaggeration argues when the reader can see the real point beneath it (Cooper's carelessness with detail); it only exaggerates when it replaces evidence. Twain backs his hyperboles with page-by-page examples.
    topic_code: "7.A"
  - front: Deadpan → what it adds to comic argument
    back: |
      Delivering an absurd claim in a perfectly serious voice. The flat tone makes the reader do the laughing, and it lets the writer seem calm and reasonable while being devastating.
    topic_code: "7.A"
  - front: Verbal irony vs sarcasm
    back: |
      Verbal irony says the opposite of, or something other than, what is meant. Sarcasm is irony used to wound a target. Twain's “Isn't it a daisy?” about an impossible feat in Cooper is sarcastic praise.
    topic_code: "7.A"
  - front: Mock-formal (mock-legal) diction → how Twain uses it
    back: |
      Solemn, official language applied to a trivial or comic subject: literary “offences,” numbered rules that “require,” “Eschew surplusage.” The mismatch between grand form and small subject makes the target look ridiculous.
    topic_code: "7.A"
  - front: Bathos → the comic drop
    back: |
      A sudden fall from the elevated to the ordinary. Twain builds up “a horse” as a comparison for Cooper's invention, then drops it: “I mean a clothes-horse.”
    topic_code: "7.A"
  - front: Chiasmus → the reversal in "its humor is pathetic; its pathos is funny"
    back: |
      A crossed structure (A-B, B-A). Swapping humour and pathos shows that Cooper's effects arrive exactly backwards: the scenes meant to move us make us laugh, and the jokes make us wince.
    topic_code: "7.A"
  - front: Short sentence after a long one → the effect on tone
    back: |
      A long sentence builds; a short one lands. "It breaks the record." after the 114-offences sentence works like a punchline, and the contrast in length is part of the joke.
    topic_code: "7.A"
  - front: Catalogue (list) as a tone device
    back: |
      Piling up items in a series can sound exhaustive, breathless or crushing. Twain's closing list of everything Deerslayer lacks makes his verdict feel total before his last line turns it into a joke.
    topic_code: "7.A"
  - front: Persona → the speaker Twain plays in the Cooper essay
    back: |
      A reasonable, slightly pained reader who has actually done the reading the professors skipped. The modest persona (“I may be mistaken”) makes his merciless conclusions seem forced on him by the evidence.
    topic_code: "7.A"
  - front: Tone in your own argument (8.A) → the main question
    back: |
      What attitude will move this audience toward this position? Indignation can rally readers who already agree; it often hardens readers who do not. Choose the tone for the reader you most need to persuade.
    topic_code: "8.A"
  - front: Sarcasm in a student argument → why it usually backfires
    back: |
      It signals contempt for anyone who disagrees, so the undecided reader feels mocked too. Twain gets away with it because he is a comic writer with page-by-page evidence and a famous persona; most essays have neither.
    topic_code: "8.A"
  - front: Controlled indignation → how to write it
    back: |
      State the wrong plainly, let a precise fact carry the anger, and keep the diction exact rather than loud. A short, flat sentence after the evidence is usually stronger than an exclamation mark.
    topic_code: "8.A"
  - front: Revising tone → the three levers
    back: |
      Word choice (swap a vague or loaded word for an exact one), comparison (add or remove an image that carries judgement), and syntax (vary length, move the key word to the end of the sentence). Change one lever at a time and reread.
    topic_code: "8.A"
  - front: Matching tone to purpose → an example from synthesis and argument
    back: |
      A proposal to a school board wants confident, respectful precision; a speech to a rally may want urgency; an editorial answering a misleading claim may want cool irony. The same evidence can serve all three in different words.
    topic_code: "8.A"
  - front: James Fenimore Cooper → who Twain was attacking
    back: |
      American novelist (1789-1851), author of the Leatherstocking Tales, including The Last of the Mohicans (1826), The Pathfinder (1840) and The Deerslayer (1841). Celebrated in the nineteenth century as a founder of American fiction.
    topic_code: "7.A"
  - front: "\"Fenimore Cooper's Literary Offences\" → publication"
    back: |
      Mark Twain's essay first appeared in the North American Review in July 1895. Twain had become famous for comic writing and for the realistic vernacular voice of Adventures of Huckleberry Finn (1884).
    topic_code: "7.A"
  - front: The Cooper essay's three epigraphs → their function
    back: |
      Praise of Cooper from two professors (Thomas Lounsbury of Yale, Brander Matthews of Columbia) and the novelist Wilkie Collins. Twain quotes the authorities first so that the whole essay can answer them.
    topic_code: "7.A"
  - front: "\"without having read some of it\" → Twain's opening charge"
    back: |
      He says the professors and Collins should not have praised Cooper "without having read some of it." The tone is polite on the surface and insulting underneath: the only explanation for their praise, he implies, is that they never read the books.
    topic_code: "7.A"
  - front: "\"114 offences against literary art out of a possible 115\" → the joke"
    back: |
      A mock-precise score, as if literary art were a game with a record book. The exactness parodies objective measurement and makes Cooper's failure sound almost athletic.
    topic_code: "7.A"
  - front: Twain's numbered rules for romantic fiction → why a list of laws?
    back: |
      The rules turn a matter of taste into a matter of law, so Cooper can be charged with “offences.” They are also sound advice, which is why writing teachers still quote them: “Use the right word, not its second cousin.”
    topic_code: "7.A"
  - front: Cooper's broken twig → what Twain's running joke proves
    back: |
      In every moment of danger a Cooper character steps on a dry twig. Twain suggests the series should be renamed "the Broken Twig Series." The repeated device is evidence of thin invention, delivered as comedy.
    topic_code: "7.A"
  - front: "Twain on Cooper's \"word-sense\" → the musical comparison"
    back: |
      A poor ear for words is like a poor ear for music: Cooper "keeps near the tune, but it is not the tune." The comparison makes approximate diction audible as a wrong note.
    topic_code: "7.A"
  - front: "\"Counting these out, what is left is Art.\" → the final turn"
    back: |
      After listing every quality Deerslayer lacks, Twain deadpans that whatever is left must be Art. The shift from catalogue to mock concession turns Lounsbury's phrase “pure work of art” into a punchline.
    topic_code: "7.A"
  - front: Bias inside Twain's Cooper essay → what a careful reader notices
    back: |
      Twain mocks Cooper's unrealistic Native American characters, but some of his own jokes repeat the dismissive attitudes of his era toward Native Americans. A writer can expose one distortion while carrying another; notice both.
    topic_code: "7.A"

quiz:
  description: |
    23 questions · about 40 minutes · a set of ten questions on the opening and closing of Twain's essay, a revision
    set of five questions on a student's letter, then questions on tone, on writing in a chosen tone, and on earlier
    skills (claims and evidence, introductions, audience). Multiple choice, select-all and true/false items are
    graded at once; the fill-in-the-blank items are matched automatically; the two short answers and the paragraph
    are graded by your teacher against the model answer and scoring notes.
  questions:
    # ---- Passage set: the opening and the verdict
    - slug: u06-w20-q01
      type: multiple_choice
      topic_code: "7.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 1
      stimulus: &twain_open |
        *The following passages are from the opening and the end of Mark Twain's essay "Fenimore Cooper's Literary Offences" (1895). The essay begins with three epigraphs praising James Fenimore Cooper's novels The Pathfinder and The Deerslayer, the last of them this one.*

        Cooper is the greatest artist in the domain of romantic fiction yet produced by America.--Wilkie Collins.

        It seems to me that it was far from right for the Professor of English Literature in Yale, the Professor of English Literature in Columbia, and Wilkie Collins to deliver opinions on Cooper's literature without having read some of it. It would have been much more decorous to keep silent and let persons talk who have read Cooper.

        Cooper's art has some defects. In one place in 'Deerslayer,' and in the restricted space of two-thirds of a page, Cooper has scored 114 offences against literary art out of a possible 115. It breaks the record.

        There are nineteen rules governing literary art in the domain of romantic fiction--some say twenty-two. In Deerslayer Cooper violated eighteen of them. These eighteen require:

        1. That a tale shall accomplish something and arrive somewhere. But the Deerslayer tale accomplishes nothing and arrives in the air.

        [...]

        3. They require that the personages in a tale shall be alive, except in the case of corpses, and that always the reader shall be able to tell the corpses from the others. But this detail has often been overlooked in the Deerslayer tale.

        [...]

        12. Say what he is proposing to say, not merely come near it.

        13. Use the right word, not its second cousin.

        14. Eschew surplusage.

        [...]

        I may be mistaken, but it does seem to me that Deerslayer is not a work of art in any sense; it does seem to me that it is destitute of every detail that goes to the making of a work of art; in truth, it seems to me that Deerslayer is just simply a literary delirium tremens.

        A work of art? It has no invention; it has no order, system, sequence, or result; it has no lifelikeness, no thrill, no stir, no seeming of reality; its characters are confusedly drawn, and by their acts and words they prove that they are not the sort of people the author claims that they are; its humor is pathetic; its pathos is funny; its conversations are--oh! indescribable; its love-scenes odious; its English a crime against the language.

        Counting these out, what is left is Art. I think we must all admit that.
      prompt: |
        The tone of the first paragraph after the epigraph ("It seems to me that it was far from right...") is best described as
      options:
        - |
          sincerely apologetic toward the professors
        - |
          openly furious and abusive
        - |
          politely insulting: courteous on the surface, scornful underneath
        - |
          neutral and purely informative
      option_explanations:
        - |
          Twain apologises for nothing; the paragraph criticises the professors for speaking without reading.
        - |
          The anger is real but never open. The diction is mild (“far from right,” “more decorous”), and the force lies in what is implied, not in abuse.
        - |
          Correct. The gentle phrasing contains a devastating charge: the only explanation for their praise is that they have not read the books. The gap between manner and meaning is the tone.
        - |
          The paragraph takes a clear attitude toward the critics; "without having read some of it" is an accusation, not information.
      answer: 2
      explanation: |
        Describe tone with precise, sometimes double, adjectives. When the manner and the meaning of a sentence diverge, the divergence is usually the point.

    - slug: u06-w20-q02
      type: multiple_choice
      topic_code: "7.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 1
      stimulus: *twain_open
      prompt: |
        The sentences “Cooper's art has some defects” and “Cooper has scored 114 offences against literary art out of a possible 115” work together primarily by
      options:
        - |
          setting an understatement against a mock-precise exaggeration, so the gap between them becomes the joke and the judgement
        - |
          offering two independent pieces of statistical evidence from a published study
        - |
          conceding that Cooper is mostly a good writer with a few lapses
        - |
          shifting from a hostile tone to an admiring one
      option_explanations:
        - |
          Correct. “Some defects” says far too little; “114 out of a possible 115” says far too much, with absurd precision. The swing between them is comic, and both point to the same verdict.
        - |
          No study exists; the “score” parodies the language of measurement. It is a comic device, not data.
        - |
          The understatement only looks like a concession. The next sentence shows it was ironic.
        - |
          Both sentences are hostile to Cooper's art; the second intensifies the first rather than reversing it.
      answer: 0
      explanation: |
        Understatement and hyperbole are often paired. Look for a small claim immediately overturned by a huge one.

    - slug: u06-w20-q03
      type: multiple_choice
      topic_code: "3.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 1
      stimulus: *twain_open
      prompt: |
        The list of rules ("These eighteen require...") supports which claim in Twain's argument?
      options:
        - |
          Romantic fiction should be abolished in American schools.
        - |
          The praise quoted in the epigraphs is unearned, because Deerslayer fails standards any reader can check.
        - |
          Wilkie Collins is a better novelist than Cooper.
        - |
          The Professor of English Literature at Yale has read Cooper carefully.
      option_explanations:
        - |
          Twain's rules assume romantic fiction can be done well; his complaint is that Cooper does it badly, not that the genre should vanish.
        - |
          Correct. Each rule states a standard and then says Deerslayer breaks it. The rules turn a matter of taste into a checklist, which is evidence against the authorities who called the book a “pure work” of art.
        - |
          The essay does not rank Collins as a novelist; it mocks his judgement of Cooper.
        - |
          This reverses the opening, which implies that the professor has not read Cooper at all.
      answer: 1
      explanation: |
        Comic writing still makes claims and offers evidence (skill 3.A, from week 19). Ask what each device is evidence for.

    - slug: u06-w20-q04
      type: multiple_choice
      topic_code: "7.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 1
      stimulus: *twain_open
      prompt: |
        Rule 3, that characters "shall be alive, except in the case of corpses," chiefly creates humour through
      options:
        - |
          a vivid description of a battle scene in Deerslayer
        - |
          sarcasm aimed at the readers of the essay
        - |
          a sincere statement of a difficult technical rule
        - |
          a deadpan qualification that states the obvious so solemnly that it implies Cooper's living characters are as lifeless as his dead ones
      option_explanations:
        - |
          The rule describes no scene; it is a general principle, phrased as law.
        - |
          The target is Cooper, not the reader, who is invited to share the joke.
        - |
          No rule could be less difficult. The solemn tone applied to something so obvious is what makes it ironic rather than sincere.
        - |
          Correct. The legal-sounding exception ("except in the case of corpses") is absurd, and the follow-up, that the reader cannot always "tell the corpses from the others," implies that Cooper's characters are lifeless.
      answer: 3
      explanation: |
        Deadpan humour delivers absurdity in a perfectly serious voice. The flatter the delivery, the sharper the implication.

    - slug: u06-w20-q05
      type: multiple_choice
      topic_code: "7.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 1
      stimulus: *twain_open
      prompt: |
        The repetition of “it does seem to me” and “it seems to me” in the paragraph beginning “I may be mistaken” contributes to the tone mainly by
      options:
        - |
          showing that Twain is genuinely unsure of his judgement
        - |
          adopting a mock-modest, tentative manner while the claims grow steadily harsher, ending in "literary delirium tremens"
        - |
          quoting what the professors said about Deerslayer
        - |
          creating a calm and neutral conclusion
      option_explanations:
        - |
          The essay has spent pages proving its case; the hesitation is a pose, and the claims it introduces are anything but uncertain.
        - |
          Correct. Each hedge introduces a stronger claim (not a work of art, destitute of every detail, a literary delirium tremens). The mismatch between timid phrasing and crushing content is comic understatement.
        - |
          The words are Twain's own; the professors' praise appears in the epigraphs and in quoted phrases elsewhere.
        - |
          The paragraph climbs toward an extravagant comparison; its calm is ironic, not neutral.
      answer: 1
      explanation: |
        Hedges can be sincere qualifications (skill 3.C, coming in week 23) or ironic poses. Test them against what they introduce.

    - slug: u06-w20-q06
      type: multiple_choice
      topic_code: "7.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 1
      stimulus: *twain_open
      prompt: |
        In the paragraph beginning “A work of art?”, the clauses “its humor is pathetic; its pathos is funny” create their effect chiefly through
      options:
        - |
          a reversed (crossed) structure suggesting that Cooper's intended effects arrive exactly backwards
        - |
          an allusion to a famous tragedy
        - |
          a concession that Deerslayer succeeds as comedy
        - |
          a shift into formal, technical vocabulary
      option_explanations:
        - |
          Correct. The pair swaps “humor” and “pathos” across two clauses (chiasmus): the scenes meant to move us are laughable and the jokes are sad. The structure enacts the failure it describes.
        - |
          No tragedy or other work is named or echoed in these clauses.
        - |
          “Funny” pathos is a failure, not a success; the book is laughable where it means to be moving, which is no compliment.
        - |
          The diction here is plain and short; the effect comes from the structure, not from technical terms.
      answer: 0
      explanation: |
        Syntax is part of tone. A balanced or reversed structure can make a judgement feel neat, inevitable and memorable.

    - slug: u06-w20-q07
      type: multi_select
      topic_code: "7.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 2
      partial_credit: true
      stimulus: *twain_open
      prompt: |
        Which TWO features of the passage most contribute to its mock-legal, mock-formal tone? Select two.
      options:
        - |
          Calling Cooper's faults “offences” and presenting numbered rules that “require” things of a tale
        - |
          Elevated, Latinate diction for a simple idea, as in “Eschew surplusage”
        - |
          A first-person story about Twain's childhood reading
        - |
          Dialogue between Cooper and his critics
      option_explanations:
        - |
          Correct. The vocabulary of crime and statute turns a book review into a prosecution, which makes the target look ridiculous.
        - |
          Correct. “Eschew surplusage” (avoid extra words) is itself pompous, a joke about formal style inside a rule about style.
        - |
          The passage contains no childhood story; Twain's “I” appears only as the reasonable reader passing judgement.
        - |
          Cooper never speaks in the passage, and the critics speak only in the epigraph; no exchange between them appears.
      answer: [0, 1]
      explanation: |
        Mock-formal tone applies the language of law, science or ceremony to a subject that does not deserve it. The mismatch does the mocking.

    - slug: u06-w20-q08
      type: true_false
      topic_code: "7.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 1
      stimulus: *twain_open
      prompt: |
        True or false: the final sentences, "Counting these out, what is left is Art. I think we must all admit that," sincerely concede that Deerslayer has artistic merit.
      answer: false
      explanation: |
        False. Twain has just listed every element of a novel (invention, order, characters, humour, pathos, dialogue, English) and found each one wanting. Once all of them are “counted out,” nothing is left, so calling the remainder “Art” is ironic. The mock concession also turns Lounsbury's praise of a “pure work of art” into a punchline.

    - slug: u06-w20-q09
      type: multiple_choice
      topic_code: "1.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 1
      stimulus: *twain_open
      prompt: |
        Which best describes the purpose of the passage in its rhetorical situation?
      options:
        - |
          To persuade publishers to reprint Cooper's novels
        - |
          To teach readers how to write a historical novel
        - |
          To puncture the reputation that critics and professors had built for Cooper by showing, through ridicule, that it does not survive a careful reading
        - |
          To apologise to Cooper's family for earlier criticism
      option_explanations:
        - |
          The essay attacks Cooper's art; it would hardly encourage reprints.
        - |
          The rules give advice, but they serve the attack on Cooper. Instruction is a by-product, not the purpose.
        - |
          Correct. The exigence is the authorities' praise quoted in the epigraphs; the audience is readers who have accepted it; the purpose is to deflate that praise by holding it up against the text (skill 1.A, from week 1).
        - |
          Nothing in the passage apologises to anyone; it piles up charges.
      answer: 2
      explanation: |
        Even a comic essay has a rhetorical situation. The epigraphs announce the exigence: claims the essay exists to answer.

    - slug: u06-w20-q10
      type: multiple_choice
      topic_code: "3.B"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 1
      stimulus: *twain_open
      prompt: |
        Which sentence from the passage comes closest to stating the essay's overarching thesis?
      options:
        - |
          "It breaks the record."
        - |
          “Eschew surplusage.”
        - |
          "Use the right word, not its second cousin."
        - |
          "Deerslayer is not a work of art in any sense"
      option_explanations:
        - |
          The short sentence is a punchline to one example, not a claim that governs the essay.
        - |
          This is one of the minor rules, a piece of evidence or advice, not the argument's main claim.
        - |
          A memorable rule, but it supports the attack on Cooper's language; it does not state the overall verdict.
        - |
          Correct. The claim that Deerslayer is not a work of art in any sense answers the epigraphs directly and is the claim every rule and example supports (skill 3.B, from week 6).
      answer: 3
      explanation: |
        A thesis may arrive late, especially in a comic essay that builds its case first. Find the claim that the rest of the text serves.

    # ---- Revision set: a student's letter
    - slug: u06-w20-q11
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: &w20_draft |
        *The following paragraph is from a student's draft of a letter to the school board. The sentences are numbered.*

        (1) The board should move the high school's start time from 7:15 to 8:30. (2) Apparently the board thinks teenagers just love waking up at 5:45 in the dark, which is truly brilliant. (3) Research on adolescent sleep has found that teenagers' internal clocks shift later during puberty, so most cannot fall asleep before about eleven. (4) A district that changed its start time reported fewer absences. (5) Every morning my first class is a total disaster. (6) A later start is a small change that would let students arrive ready to learn.
      prompt: |
        The writer wants to revise sentence 2 so that it keeps its conviction but uses a tone more likely to persuade the board. Which version best accomplishes this goal?
      options:
        - |
          The current schedule asks students to wake at 5:45, hours before their bodies are ready to work.
        - |
          The board clearly does not care about students at all.
        - |
          Waking up at 5:45 is maybe not ideal for some people, possibly.
        - |
          Who wouldn't love waking up at 5:45? Nobody, that's who.
      option_explanations:
        - |
          Correct. The sentence keeps the fact that makes the point (5:45) and lets it carry the force, with a phrase that previews the evidence in sentence 3. It is firm without mocking the readers it needs.
        - |
          This turns sarcasm into a direct accusation; it is no more likely to persuade the people being accused.
        - |
          So many hedges drain the sentence of conviction; the writer's position disappears.
        - |
          This keeps the sarcasm in a new form; the board would still hear contempt.
      answer: 0
      explanation: |
        Tone in an argument should serve the reader you need to move (skill 8.A). Precise facts usually carry indignation better than sarcasm does.

    - slug: u06-w20-q12
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: *w20_draft
      prompt: |
        The writer wants to replace sentence 5 with a sentence whose word choice conveys the seriousness of the problem precisely rather than loudly. Which version best accomplishes this goal?
      options:
        - |
          Every morning my first class is an absolute catastrophe of epic proportions.
        - |
          Most mornings, several students in my first-period class fall asleep before the bell.
        - |
          Every morning my first class is kind of not great.
        - |
          My first class is bad.
      option_explanations:
        - |
          Piling on intensifiers makes the sentence louder but less believable; it reads as exaggeration.
        - |
          Correct. A concrete, observable detail lets the reader judge the problem for themselves. The calm phrasing makes the writer sound credible, and the detail is more serious than any adjective.
        - |
          Vague, casual phrasing undercuts the point and sounds unserious to a board.
        - |
          The word “bad” is too general to show anything; the reader has no idea what happens.
      answer: 1
      explanation: |
        A specific detail is usually more forceful than an intensifier. Let the fact carry the tone.

    - slug: u06-w20-q13
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: *w20_draft
      prompt: |
        The writer wants to add a comparison after sentence 3 that conveys reasonable urgency to adult readers. Which choice best accomplishes this goal?
      options:
        - |
          Making teenagers attend class at 7:15 is exactly like torturing prisoners.
        - |
          School at 7:15 is like a really early morning, basically.
        - |
          Asking a teenager to concentrate at 7:15 is like asking an adult to take an exam at 4:30 in the morning.
        - |
          The school building was constructed in 1962 and has large windows.
