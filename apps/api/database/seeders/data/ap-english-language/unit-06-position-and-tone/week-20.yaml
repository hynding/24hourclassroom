    - slug: u06-w20-q15
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: *w20_draft
      prompt: |
        The writer wants to revise sentence 4 so that its evidence is more specific and convincing. Which version best accomplishes this goal?
      options:
        - |
          A neighbouring district that moved its start time from 7:20 to 8:25 reported in its annual review that first-period absences fell by about a sixth the following year.
        - |
          Lots of districts have done this and it went really well for them.
        - |
          A district that changed its start time reported fewer absences, which is good.
        - |
          Start times have been debated for many years in many places.
      option_explanations:
        - |
          Correct. It names the change, the source of the report and the size of the effect, so the reader can see what was measured and how much it moved.
        - |
          Vague quantities (“lots”) and an unsupported verdict (“really well”) weaken rather than strengthen the evidence.
        - |
          Adding “which is good” offers a judgement, not detail; the evidence stays just as vague.
        - |
          This states a background fact about the debate; it does not support the claim that later starts reduce absences.
      answer: 0
      explanation: |
        Specific evidence (what changed, who reported it, by how much) is more persuasive than general evidence (skill 4.A, from week 19).

    # ---- Tone across the essay, and writing in a chosen tone
    - slug: u06-w20-q16
      type: multiple_choice
      topic_code: "7.A"
      source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
      points: 1
      prompt: |
        Answering Brander Matthews's praise of Cooper's “invention,” Twain writes: “Cooper hadn't any more invention than a horse; and I don't mean a high-class horse, either; I mean a clothes-horse.” The comparison creates its effect chiefly through
      options:
        - |
          a scientific comparison between Cooper and an animal
        - |
          a comic drop (bathos) from an animal to a wooden drying rack, which makes the insult grow as the sentence goes on
        - |
          an admiring image of strength and endurance
        - |
          a sincere concession that Cooper had some imagination
      option_explanations:
        - |
          Nothing in the sentence is scientific; the comparison is a joke built on a pun.
        - |
          Correct. The sentence starts with a familiar insult (no more invention than a horse), seems to qualify it, then drops to a clothes-horse, an object with no mind at all. Each clause lowers the estimate further.
        - |
          The horse is not admired for strength; it stands for a lack of invention.
        - |
          The apparent qualification ("I don't mean a high-class horse") makes the insult worse, not milder.
      answer: 1
      explanation: |
        Bathos is a fall from the higher to the lower. Watch for a sentence that seems to be softening a judgement and then sharpens it.

