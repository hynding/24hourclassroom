  - slug: u06-exam-q43
    type: short_answer
    topic_code: "3.A"
    source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
    points: 2
    prompt: |
      In two or three sentences, distinguish Ida B. Wells's position in Southern Horrors from her perspective, and explain how her choice of evidence responds to the way readers might judge her perspective.
    answer: |
      Wells's position is that the common justification for lynching is a pretext and that silence and the press allow the violence to continue. Her perspective is that of a Black editor born into slavery whose Memphis newspaper had just been destroyed by a mob. Because readers might dismiss her as partisan, she builds her case from sources they trust, such as the Chicago Tribune's statistics and her opponents' own newspapers.
    explanation: |
      1 point: accurately distinguishes position (the claim she argues) from perspective (her experience, identity and situation). 1 point: explains how a specific choice of evidence (the Tribune figures, the reprinted editorials, the lynchers' own words) answers readers' possible doubts about her perspective. A response that treats perspective and position as the same earns at most 1.

  - slug: u06-exam-q44
    type: short_answer
    topic_code: "7.A"
    source: 'Mark Twain, "Fenimore Cooper''s Literary Offences" (1895)'
    points: 2
    prompt: |
      Both Mark Twain and Jane Addams criticise a respected group: Twain criticises the professors who praised Cooper, and Addams criticises the charitable class. In two or three sentences, compare the tones of their criticism and explain how each tone suits the writer's relationship to the group criticised.
    answer: |
      Twain's tone is mock-courteous ridicule: he regrets that the professors praised Cooper “without having read some of it,” attacking from outside the group with comic exaggeration. Addams's tone is gentle, self-critical irony, as in the visitor's “parasitic cleanliness,” because she writes as a member of the charitable class (“we,” “our democracy”). Ridicule suits an outsider puncturing a reputation; gentle irony suits an insider asking her own side to change.
    explanation: |
      1 point: accurately names a precise tone for each writer, supported by a specific word or phrase. 1 point: explains how each tone fits the writer's relationship to the group (outside critic versus member of the group). A response that names tones only as “negative” or “critical” earns at most 1.

  - slug: u06-exam-q45
    type: short_answer
    topic_code: "4.B"
    source: written for this course
    points: 2
    prompt: |
      Roosevelt claims that "It is not the critic who counts." Write a thesis statement (one or two sentences) for an argument essay that qualifies this claim: it should acknowledge what is true in Roosevelt's view, take a clear position of your own, and preview at least two reasons.
    answer: |
      Roosevelt is right that people who act deserve more credit than people who only sneer, but critics count too: honest criticism catches mistakes before they become disasters, and it holds powerful doers accountable to the people their actions affect.
    explanation: |
      1 point: a defensible, qualified position that acknowledges something true in Roosevelt's claim while taking a distinct stance. 1 point: previews at least two reasons. A thesis that simply agrees or disagrees without qualification earns at most 1; one that only restates the quotation earns 0.
