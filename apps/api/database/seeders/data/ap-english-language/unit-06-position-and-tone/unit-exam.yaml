  - slug: u06-exam-q25
    type: long_answer
    topic_code: "7.A"
    source: 'Theodore Roosevelt, "Citizenship in a Republic" (1910)'
    points: 6
    stimulus: *ex_arena
    prompt: |
      In 1910, a year after leaving the presidency, Theodore Roosevelt spoke at the Sorbonne in Paris to an audience of scholars and distinguished guests. The passage above is from that address, "Citizenship in a Republic." Read the passage carefully. Write an essay that analyzes the rhetorical choices Roosevelt makes to convey his message about the responsibilities of educated citizens.

      In your response you should do the following:
      - Respond to the prompt with a thesis that analyzes the writer's rhetorical choices.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Demonstrate an understanding of the rhetorical situation.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: Speaking to an elite audience inclined to admire detachment, Roosevelt redefines the cynic's apparent superiority as weakness and the striver's failures as honour, using the listeners' own privilege as the ground of his demand and moving from contemptuous diction to a cumulative, admiring portrait of the man in the arena. Line of reasoning: (1) Privilege as obligation: the opening catalogue of advantages (“special advantages,” “leisure”) leads to the balanced, biblical-sounding “much has been given ... much should be expected,” which the audience cannot easily refuse. (2) Redefining the cynic: diction such as “queer and cheap temptation,” “twisted pride” and “sneering disbelief” strips cynicism of its prestige, and the antithesis “not ... of superiority, but of weakness” reverses the cynic's self-image for listeners who may share it. (3) Ennobling effort: the concrete image of a face “marred by dust and sweat and blood” and the long sentence of “who” clauses build admiration step by step, so that even failure “while daring greatly” outranks the critic's safety, sealed by the contrast with “cold and timid souls.” Sophistication: notes the tension that Roosevelt, a famous critic of others, attacks criticism, or that his perspective as a man of action shapes his preference for doers over scholars.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis that analyzes Roosevelt's rhetorical choices in relation to his message about educated citizens' responsibilities (for example, how he turns privilege into duty or redefines cynicism as weakness). A thesis that only restates the prompt, summarises, or lists devices without linking them to purpose earns 0. Row B Evidence and Commentary (0-4): 4 = specific, well-chosen evidence from all three paragraphs (the catalogue of advantages and the balanced maxim, the contemptuous diction and reversal of superiority, the arena image and cumulative “who” clauses) with commentary that consistently explains how each choice works on this audience; 3 = specific evidence and commentary that explains most choices but is uneven; 2 = some relevant evidence with commentary that is general or repeats the evidence; 1 = summary with little analysis; 0 = no relevant evidence. Row C Sophistication (0-1): 1 point for a complex understanding of the rhetorical situation, such as explaining how Roosevelt's perspective as a former president and man of action shapes his preference for the doer, noting the irony of a vigorous critic attacking critics, or tracing how the structure moves an elite audience from self-regard to obligation, in a consistently vivid, persuasive style.

