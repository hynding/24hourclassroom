  # ---- Set E: Addams, the neighbourly standard
  - slug: u06-exam-q33
    type: multiple_choice
    topic_code: "3.A"
    source: 'Jane Addams, Democracy and Social Ethics (1902)'
    points: 1
    stimulus: &ex_addams |
      *The following passages are from "Charitable Effort," the second chapter of Jane Addams's Democracy and Social Ethics (1902). Addams lived for many years at Hull-House, a settlement house in a poor immigrant neighbourhood of Chicago.*

      A very little familiarity with the poor districts of any city is sufficient to show how primitive and genuine are the neighborly relations. There is the greatest willingness to lend or borrow anything, and all the residents of the given tenement know the most intimate family affairs of all the others. The fact that the economic condition of all alike is on a most precarious level makes the ready outflow of sympathy and material assistance the most natural thing in the world. There are numberless instances of self-sacrifice quite unknown in the circles where greater economic advantages make that kind of intimate knowledge of one's neighbors impossible. An Irish family in which the man has lost his place, and the woman is struggling to eke out the scanty savings by day's work, will take in the widow and her five children who have been turned into the street, without a moment's reflection upon the physical discomforts involved. The most maligned landlady who lives in the house with her tenants is usually ready to lend a scuttle full of coal to one of them who may be out of work, or to share her supper. A woman for whom the writer had long tried in vain to find work failed to appear at the appointed time when employment was secured at last. Upon investigation it transpired that a neighbor further down the street was taken ill, that the children ran for the family friend, who went of course, saying simply when reasons for her non-appearance were demanded, "It broke me heart to leave the place, but what could I do?"

      [...]

      The only really popular charity is that of the visiting nurses, who by virtue of their professional training render services which may easily be interpreted into sympathy and kindness, ministering as they do to obvious needs which do not require investigation.
    prompt: |
      The examples of the Irish family, the landlady and the woman who missed her appointment function in the first paragraph primarily as
    options:
      - |
        evidence that poor neighbourhoods need more charity visitors
      - |
        a list of families who applied to Hull-House for aid
      - |
        a concession that neighbours rarely help each other
      - |
        specific cases supporting the opening claim that neighbourly relations among the poor are "primitive and genuine" and full of self-sacrifice
    option_explanations:
      - |
        The examples show neighbours helping each other without visitors; they do not argue for more visitors.
      - |
        The examples describe neighbours helping neighbours, not applications for aid.
      - |
        The examples show the opposite: "numberless instances of self-sacrifice."
      - |
        Correct. The paragraph moves from a general claim to concrete cases: taking in a widow's family, lending coal, leaving a new job to nurse a sick neighbour. Each case is evidence of the neighbourly ethic.
    answer: 3
    explanation: |
      A general claim followed by several specific cases is a classic claim-and-evidence pattern (skill 3.A).

