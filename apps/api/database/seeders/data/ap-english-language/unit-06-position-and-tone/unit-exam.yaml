    stimulus: &ex_draft |
      *The following paragraph is from a student's draft of a letter to the city council. The sentences are numbered.*

      (1) The vacant lot on Fourth Street should become a community garden rather than a parking lot. (2) Last summer, a survey by the neighbourhood association found that 62 of the 80 households within four blocks of the lot had no yard of their own. (3) A garden would give those families space to grow food and to meet their neighbours. (4) Parking downtown is already free after six o'clock. (5) Anyone who wants more parking is just lazy and should walk. (6) The city's own planning report notes that the nearest full-service grocery store is more than a mile away. (7) A garden would turn an empty space into a shared one.
    prompt: |
      Which sentence states the paragraph's main claim?
    options:
      - |
        Sentence 1
      - |
        Sentence 3
      - |
        Sentence 6
      - |
        Sentence 7
    option_explanations:
      - |
        Correct. Sentence 1 takes a position on the question the council faces (garden rather than parking lot), and every other sentence offers evidence, commentary or a response to the other side.
      - |
        Sentence 3 is a supporting claim about what the garden would provide; it serves sentence 1.
      - |
        Sentence 6 is evidence (a fact from a planning report), not the claim it supports.
      - |
        Sentence 7 restates the benefit in general terms at the end; it is a concluding line rather than the claim that organises the paragraph.
    answer: 0
    explanation: |
      The main claim is the one the other sentences serve. Test each candidate by asking whether the rest of the paragraph supports it.

