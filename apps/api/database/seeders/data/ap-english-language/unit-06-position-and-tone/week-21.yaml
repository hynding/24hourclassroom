week: 21
unit: 6
title: Thesis and Structure in Theodore Roosevelt's "The Strenuous Life"
topics: ["3.B"]
texts:
  - author: Theodore Roosevelt
    title: "The Strenuous Life (speech before the Hamilton Club, Chicago, April 10, 1899), in The Strenuous Life: Essays and Addresses"
    year: 1899
    url: https://www.gutenberg.org/ebooks/58821
guide: guides/week-21.md
guide_description: |
  How to find an argument's overarching thesis, tell it apart from the writer's topic, purpose and perspective, and
  read what it promises about the argument's structure. The case study is Theodore Roosevelt's speech "The
  Strenuous Life" (1899): a thesis announced in the first sentence, a preview built into an analogy (as with the
  individual, so with the nation), signposts that mark each turn, and a conclusion that restates the opening. The
  guide also reads the speech's perspective and the bias in its claims about the Philippines, and shows how to
  describe a thesis accurately even when you disagree with it. Writing lesson on turning a topic into a thesis,
  common mistakes, an exam connection and self-check questions.
flashcards_description: |
  30 cards on thesis statements and how they preview structure, signposts and restated theses, reading a thesis
  you disagree with, and the context, claims, structure and perspective of Roosevelt's “The Strenuous Life”.

flashcards:
  - front: Overarching thesis → what skill 3.B asks you to find
    back: |
      The main claim of the whole argument, the one every other claim supports. It may be stated in one sentence, spread over two, or left implicit for the reader to assemble.
    topic_code: "3.B"
  - front: Thesis vs topic
    back: |
      A topic is what a text is about (national character); a thesis is what the text claims about it (a great nation, like a good man, must choose effort and risk over ease). If it cannot be disagreed with, it is a topic.
    topic_code: "3.B"
  - front: Thesis vs purpose
    back: |
      Purpose is what the writer wants to happen (rally support for an active foreign policy); the thesis is the claim offered to make it happen. Exam distractors often swap one for the other.
    topic_code: "3.B"
  - front: Thesis vs perspective
    back: |
      The thesis is the position argued; perspective is the vantage point it comes from. Roosevelt's thesis is about effort and national duty; his perspective is that of a war veteran, former navy official and governor.
    topic_code: "3.B"
  - front: Thesis that previews structure → what to look for
    back: |
      Words in the thesis that name the parts of the argument or their order: two terms set against each other, a list of reasons, or an analogy that splits the speech into halves.
    topic_code: "3.B"
  - front: Implicit thesis → how to state one
    back: |
      When no single sentence states the claim, combine the claims of the paragraphs into one arguable sentence. Check it by asking whether every paragraph supports it.
    topic_code: "3.B"
  - front: Where a thesis appears in a speech
    back: |
      Often in the opening (so listeners know what to listen for) and again in the conclusion (so they leave with it). A thesis that returns at the end in new words is a restated thesis.
    topic_code: "3.B"
  - front: Signpost → definition and example
    back: |
      A phrase that tells the audience where the argument is in its structure, such as Roosevelt's "So much for the commercial side." Signposts are the visible joints of a line of reasoning.
    topic_code: "3.B"
  - front: Reading a thesis you disagree with → the AP rule
    back: |
      Describe it in terms the writer would accept before you evaluate it. Exam questions ask what the writer claims, not whether you agree; a hostile paraphrase is usually a wrong answer.
    topic_code: "3.B"
  - front: Antithesis → the thesis shape of Roosevelt's first sentence
    back: |
      Setting opposed ideas in parallel form: "not the doctrine of ignoble ease, but the doctrine of the strenuous life." The structure makes the thesis a choice between two lives, and makes one sound shameful.
    topic_code: "3.B"
  - front: "\"The Strenuous Life\" → occasion"
    back: |
      A speech to the Hamilton Club, a Republican men's club in Chicago, on April 10, 1899. Roosevelt was governor of New York; the Spanish-American War had ended months before, and the United States had just acquired the Philippines, Puerto Rico and Guam.
    topic_code: "3.B"
  - front: Roosevelt in 1899 → three roles that shape his perspective
    back: |
      Former Assistant Secretary of the Navy (1897-98), colonel of the volunteer cavalry regiment known as the Rough Riders in Cuba (1898), and governor of New York. Within three years he was President.
    topic_code: "3.B"
  - front: Roosevelt's thesis in "The Strenuous Life"
    back: |
      Americans should embrace "the strenuous life, the life of toil and effort, of labor and strife," and the nation, like the individual, must accept hard duties abroad rather than retreat into comfortable ease.
    topic_code: "3.B"
  - front: "\"as little worthy of a nation as of an individual\" → the preview"
    back: |
      The second paragraph's phrase sets up the speech's two halves: what is true of a man is true of a nation. The individual half comes first, the national half second.
    topic_code: "3.B"
  - front: "\"As it is with the individual, so it is with the nation.\" → its job"
    back: |
      The hinge of the speech. A one-sentence transition that completes the preview, closes the half about personal effort and opens the half about national duty.
    topic_code: "3.B"
  - front: "\"It is hard to fail, but it is worse never to have tried to succeed.\""
    back: |
      A compact antithesis from the individual half of the speech. It restates the thesis as a maxim listeners can carry away, and it prepares the claim that a nation should also risk failure.
    topic_code: "3.B"
  - front: "\"the gray twilight that knows not victory nor defeat\" → what the image does"
    back: |
      It pictures a life without risk as dim and colourless rather than safe. The comparison makes the opposing position (peace and ease) look not wrong but lifeless.
    topic_code: "3.B"
  - front: "Roosevelt's \"ignoble ease\" → why the adjective matters"
    back: |
      Ease is neutral or pleasant; “ignoble” makes it shameful. A single adjective turns a preference into a moral failure and frames the debate before any evidence is offered.
    topic_code: "3.B"
  - front: Roosevelt's Civil War example → its role in the line of reasoning
    back: |
      If the Union had shrunk from war in 1861 it would have saved lives and money but lost the nation and left slavery standing. The example supports the claim that some hardships are worth their cost.
    topic_code: "3.B"
  - front: "\"So much for the commercial side.\" → signposting in the speech"
    back: |
      After arguing that expansion serves trade, Roosevelt marks the turn: "From the standpoint of international honor the argument is even stronger." The signpost shows the order of reasons, from weaker to stronger.
    topic_code: "3.B"
  - front: "\"To refuse to deal with them at all merely amounts to dealing with them badly.\""
    back: |
      Roosevelt redefines withdrawal from the Philippines as a choice with consequences, not a neutral option. The claim closes off the opponents' position by denying that inaction is possible.
    topic_code: "3.B"
  - front: "\"I preach to you, then, my countrymen\" → the restated thesis"
    back: |
      The conclusion returns to the opening verb (“preach”) and the opening contrast: “not for the life of ease but for the life of strenuous endeavor.” The echo frames the speech and signals the end.
    topic_code: "3.B"
  - front: The speech's audience → how Roosevelt flatters it
    back: |
      He addresses "men of the greatest city of the West," of the state of Lincoln and Grant, who "neither preach nor practice" a doctrine of ease. Praising the listeners as already strenuous makes agreement feel like self-recognition.
    topic_code: "1.B"
  - front: Bias in "The Strenuous Life" → what a reader notices
    back: |
      The speech declares that many Filipinos are “utterly unfit for self-government” and calls the alternative to American control “savage anarchy.” The claims rest on racial assumptions of the era, not evidence, and the speech never considers the Filipinos' own perspective.
    topic_code: "3.B"
  - front: The anti-imperialists of 1899 → the opposing position Roosevelt answers
    back: |
      Americans, including Mark Twain from 1900, who argued that ruling the Philippines without the consent of the governed betrayed the Declaration of Independence. Roosevelt dismisses their appeals to “liberty” as timidity.
    topic_code: "3.B"
  - front: Roosevelt on women in "The Strenuous Life" → perspective, not evidence
    back: |
      He assigns women the role of "the wise and fearless mother of many healthy children." The claim reflects the gender expectations of his class and time; it is asserted, not argued, which marks it as perspective.
    topic_code: "3.B"
  - front: Charitable paraphrase → a skill for 3.B questions
    back: |
      Restating a writer's thesis in its strongest, fairest form. You can then evaluate it honestly; an argument that refutes a weak version of a thesis (a straw man) refutes nothing.
    topic_code: "3.B"
  - front: Thesis and line of reasoning → how they fit together
    back: |
      The thesis is the destination; the line of reasoning is the route: the ordered claims that lead there. A good thesis lets a reader predict the route before taking it.
    topic_code: "3.B"
  - front: Turning a topic into a thesis → the three questions
    back: |
      What exactly do I claim about the topic? Could a reasonable person disagree? What reasons will I give, and in what order? The answers become a thesis that requires proof and previews structure.
    topic_code: "4.B"
  - front: The exam's thesis questions → three common stems
    back: |
      Which of the following best states the writer's thesis? The final paragraph relates to the first chiefly by... Which sentence previews the structure of the argument? Each tests whether you can see the whole from its parts.
    topic_code: "3.B"

quiz:
  description: |
    23 questions · about 40 minutes · a set of ten questions on the opening, the hinge and the conclusion of "The
    Strenuous Life", a revision set of five questions on a student's introduction, then questions on thesis and
    structure, on perspective and bias, and on earlier skills (audience, word choice, writing a thesis).
    Multiple choice, select-all and true/false items are graded at once; the fill-in-the-blank items are matched
    automatically; the two short answers and the paragraph are graded by your teacher against the model answer and
    scoring notes.
  questions:
    # ---- Passage set: Roosevelt's thesis and its structure
    - slug: u06-w21-q01
      type: multiple_choice
      topic_code: "3.B"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 1
      stimulus: &tr_strenuous |
        *The following passages are from Theodore Roosevelt's speech "The Strenuous Life," delivered to the Hamilton Club in Chicago on April 10, 1899. Roosevelt was governor of New York; months earlier the United States had won the Spanish-American War and acquired the Philippines from Spain.*

        In speaking to you, men of the greatest city of the West, men of the State which gave to the country Lincoln and Grant, men who pre-eminently and distinctly embody all that is most American in the American character, I wish to preach, not the doctrine of ignoble ease, but the doctrine of the strenuous life, the life of toil and effort, of labor and strife; to preach that highest form of success which comes, not to the man who desires mere easy peace, but to the man who does not shrink from danger, from hardship, or from bitter toil, and who out of these wins the splendid ultimate triumph.

        A life of slothful ease, a life of that peace which springs merely from lack either of desire or of power to strive after great things, is as little worthy of a nation as of an individual. I ask only that what every self-respecting American demands from himself and from his sons shall be demanded of the American nation as a whole.

        [...]

        As it is with the individual, so it is with the nation. It is a base untruth to say that happy is the nation that has no history. Thrice happy is the nation that has a glorious history. Far better it is to dare mighty things, to win glorious triumphs, even though checkered by failure, than to take rank with those poor spirits who neither enjoy much nor suffer much, because they live in the gray twilight that knows not victory nor defeat.

        [...]

        We can not avoid the responsibilities that confront us in Hawaii, Cuba, Porto Rico, and the Philippines. All we can decide is whether we shall meet them in a way that will redound to the national credit, or whether we shall make of our dealings with these new problems a dark and shameful page in our history. To refuse to deal with them at all merely amounts to dealing with them badly.

        [...]

        I preach to you, then, my countrymen, that our country calls not for the life of ease but for the life of strenuous endeavor. The twentieth century looms before us big with the fate of many nations. If we stand idly by, if we seek merely swollen, slothful ease and ignoble peace, if we shrink from the hard contests where men must win at hazard of their lives and at the risk of all they hold dear, then the bolder and stronger peoples will pass us by, and will win for themselves the domination of the world.
      prompt: |
        Which statement best expresses the overarching thesis of the speech, as these passages present it?
      options:
        - |
          The Spanish-American War was fought to free Cuba from Spain.
        - |
          Americans, as individuals and as a nation, should choose effort, risk and hard duty over comfortable ease, including the duties the nation has taken on abroad.
        - |
          Chicago is the greatest city in the American West.
        - |
          The twentieth century will be peaceful if nations avoid conflict.
      option_explanations:
        - |
          The war is background to the speech, not its claim; the passages never argue about why it was fought.
        - |
          Correct. The opening states the doctrine, the hinge extends it from the individual to the nation, the fourth paragraph applies it to the new territories, and the conclusion restates it. Every passage supports this claim.
        - |
          The praise of Chicago flatters the audience in the opening; it is not what the speech argues.
        - |
          This reverses the conclusion, which warns that a nation seeking “ignoble peace” will be passed by.
      answer: 1
      explanation: |
        The overarching thesis is the claim every part supports. Test a candidate by checking it against the opening, the middle and the end.

    - slug: u06-w21-q02
      type: multiple_choice
      topic_code: "3.B"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 1
      stimulus: *tr_strenuous
      prompt: |
        The phrase "as little worthy of a nation as of an individual" in the second paragraph is significant to the speech's structure chiefly because it
      options:
        - |
          introduces a list of statistics about national wealth
        - |
          concedes that individuals and nations have nothing in common
        - |
          shifts the speech's subject from America to China
        - |
          previews the two levels the argument will address, the individual and the nation, in that order
      option_explanations:
        - |
          No statistics follow; the phrase is a comparison, not a data point.
        - |
          It asserts the opposite: that the same standard applies to both.
        - |
          The passages do not mention China; the phrase concerns individuals and nations generally.
        - |
          Correct. The comparison names the speech's two halves. The individual half comes first, and the hinge sentence later turns to the nation, fulfilling the preview.
      answer: 3
      explanation: |
        A thesis or an early sentence often contains a map of the argument. Look for paired terms that the speech later takes up one at a time.

    - slug: u06-w21-q03
      type: multiple_choice
      topic_code: "3.B"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 1
      stimulus: *tr_strenuous
      prompt: |
        The sentence "As it is with the individual, so it is with the nation" functions primarily as
      options:
        - |
          a transition that marks the turn from the personal half of the argument to the national half
        - |
          a concession to listeners who prefer peace
        - |
          the speech's only piece of evidence
        - |
          a restatement of the speech's conclusion in the final paragraph
      option_explanations:
        - |
          Correct. In one balanced sentence Roosevelt closes the argument about personal effort and opens the argument about national duty, completing the preview of the second paragraph.
        - |
          The sentence concedes nothing; the next sentences call the opposing view “a base untruth.”
        - |
          It is a structural claim, an analogy, not evidence; the speech's evidence includes examples such as the Civil War.
        - |
          It appears in the middle of the speech, not the conclusion, and it begins a new section rather than ending one.
      answer: 0
      explanation: |
        A hinge sentence is where a structure becomes visible. Ask what comes before it and what it opens.

    - slug: u06-w21-q04
      type: multiple_choice
      topic_code: "1.B"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 1
      stimulus: *tr_strenuous
      prompt: |
        The opening address to "men of the greatest city of the West, men of the State which gave to the country Lincoln and Grant" reflects Roosevelt's understanding that his audience
      options:
        - |
          was unfamiliar with American history
        - |
          disagreed with him about the war and needed to be shamed
        - |
          took pride in its city, its state and its connection to national heroes, so praising those things would make listeners receptive to the doctrine
        - |
          consisted mostly of foreign visitors to Chicago
      option_explanations:
        - |
          Naming Lincoln and Grant assumes the audience knows them well; the reference only works because it is familiar.
        - |
          The opening flatters rather than shames; Roosevelt treats the listeners as people who already live the strenuous life.
        - |
          Correct. By connecting the listeners to Lincoln and Grant and to "all that is most American," Roosevelt makes his doctrine sound like a description of who they already are (skill 1.B, from week 5).
        - |
          The address to the men of Illinois and the Hamilton Club assumes a local, American audience.
      answer: 2
      explanation: |
        Praise of an audience can be a strategy. It invites listeners to agree with a claim as a way of living up to the compliment.

    - slug: u06-w21-q05
      type: multiple_choice
      topic_code: "7.A"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 1
      stimulus: *tr_strenuous
      prompt: |
        In the first sentence, the contrast between “the doctrine of ignoble ease” and “the doctrine of the strenuous life” contributes to the speech's tone mainly by
      options:
        - |
          attaching shame to one choice and honour to the other before any evidence is offered, so the thesis sounds like a moral obligation
        - |
          presenting both choices as equally attractive
        - |
          adding scientific precision to the argument
        - |
          signalling that the speech will be humorous
      option_explanations:
        - |
          Correct. “Ignoble” makes ease shameful; “doctrine” and “preach” make the alternative a creed. The parallel antithesis frames the choice so that one side is hard to defend at all.
        - |
          The adjective “ignoble” ensures the choices are anything but equal.
        - |
          The diction is moral and religious (“doctrine,” “preach”), not scientific.
        - |
          The tone is earnest and exhortatory; nothing in the sentence signals comedy.
      answer: 0
      explanation: |
        Word choice can frame a debate before it starts (skill 7.A, from week 20). Notice when a single adjective does the arguing.

    - slug: u06-w21-q06
      type: multiple_choice
      topic_code: "1.A"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 1
      stimulus: *tr_strenuous
      prompt: |
        Which piece of context best describes Roosevelt's PERSPECTIVE as distinct from his position?
      options:
        - |
          He argues that the nation must accept duties abroad.
        - |
          He claims that a life of ease is unworthy.
        - |
          He restates his thesis in the final paragraph.
        - |
          He speaks as a former navy official and volunteer cavalry officer who had just fought in the war whose results he is defending.
      option_explanations:
        - |
          This is part of the claim he defends: his position, not his vantage point.
        - |
          This is his thesis about individuals, again a position.
        - |
          This describes the speech's structure, not the vantage point of the speaker.
        - |
          Correct. Perspective is the experience and role the speaker argues from. Roosevelt's service in the navy department and in Cuba gives him authority with this audience and a personal stake in defending the war's outcome (skill 1.A, from week 1).
      answer: 3
      explanation: |
        Perspective explains why a writer sees the issue as they do; position is what they claim about it.

    - slug: u06-w21-q07
      type: multi_select
      topic_code: "3.B"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 2
      partial_credit: true
      stimulus: *tr_strenuous
      prompt: |
        Which TWO features of the opening sentence make its thesis especially clear to listeners? Select two.
      options:
        - |
          The announced intention “I wish to preach,” which tells listeners a doctrine is coming
        - |
          The parallel “not ... but” structure that sets the rejected position against the endorsed one
        - |
          A statistic about the population of Chicago
        - |
          A direct quotation from Lincoln
      option_explanations:
        - |
          Correct. Announcing the act (to preach a doctrine) tells the audience to listen for a claim, which is a common way speeches flag their thesis.
        - |
          Correct. "Not the doctrine of ignoble ease, but the doctrine of the strenuous life" states the claim as a choice and names its opposite, so the thesis is unmistakable.
        - |
          No statistic appears in the opening; Chicago is praised, not measured.
        - |
          Lincoln is named in the opening sentence, but no words of his are quoted anywhere in it.
      answer: [0, 1]
      explanation: |
        In a speech, listeners cannot reread. Speakers make the thesis audible by announcing it and by shaping it into memorable structures.

    - slug: u06-w21-q08
      type: true_false
      topic_code: "3.B"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 1
      stimulus: *tr_strenuous
      prompt: |
        True or false: Roosevelt withholds his thesis until the final paragraph, so listeners do not know his claim until the end.
      answer: false
      explanation: |
        False. The thesis is announced in the first sentence ("I wish to preach ... the doctrine of the strenuous life") and restated in the last ("I preach to you, then, my countrymen"). The repeated verb frames the speech; the conclusion returns to the opening rather than revealing something new.

    - slug: u06-w21-q09
      type: multiple_choice
      topic_code: "3.A"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 1
      stimulus: *tr_strenuous
      prompt: |
        The claim "To refuse to deal with them at all merely amounts to dealing with them badly" functions in the argument chiefly by
      options:
        - |
          offering evidence about conditions in Hawaii and Cuba
        - |
          denying that withdrawal is a neutral option, which removes the opponents' preferred choice from consideration
        - |
          admitting that the problems cannot be solved
        - |
          praising those who oppose expansion
      option_explanations:
        - |
          The sentence describes no conditions; it is a claim about the choices available, not evidence.
        - |
          Correct. By redefining refusal as a bad way of acting, Roosevelt claims that the only real question is how to act. The move frames the debate in his terms (skill 3.A, from week 19).
        - |
          He says only that refusing guarantees a bad outcome; he does not concede that the problems are unsolvable.
        - |
          The sentence implicitly criticises opponents of expansion; it does not praise them.
      answer: 1
      explanation: |
        Some claims work by narrowing the options. Notice when a writer declares a choice impossible rather than arguing against it.

    - slug: u06-w21-q10
      type: multiple_choice
      topic_code: "3.B"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 1
      stimulus: *tr_strenuous
      prompt: |
        The final paragraph relates to the speech's opening chiefly by
      options:
        - |
          contradicting the thesis announced in the first sentence
        - |
          introducing a new subject, the twentieth century, unrelated to the thesis
        - |
          restating the opening thesis with the same verb and contrast, and adding the stakes of rejecting it
        - |
          thanking the Hamilton Club for its hospitality
      option_explanations:
        - |
          The conclusion repeats the thesis ("not for the life of ease but for the life of strenuous endeavor"); it does not contradict it.
        - |
          The twentieth century is the setting for the stakes of the thesis, not a separate subject.
        - |
          Correct. “I preach” echoes “I wish to preach,” the ease/strenuous contrast returns, and the warning that “bolder and stronger peoples will pass us by” adds what happens if listeners refuse.
        - |
          No thanks appear in the passage; the paragraph ends with a warning.
      answer: 2
      explanation: |
        A restated thesis usually adds something: stakes, a call to action or a wider frame. Name what is repeated and what is new.

    # ---- Revision set: a student's introduction
    - slug: u06-w21-q11
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: &w21_draft |
        *The following paragraph is a student's draft introduction to an argument essay. The sentences are numbered.*

        (1) Since the beginning of time, people have helped each other. (2) Many high schools now require students to complete community service before they graduate. (3) Our district is considering a requirement of forty hours over four years. (4) Community service is a topic that has many sides. (5) In this essay I will talk about community service.
      prompt: |
        The writer wants to replace sentence 4 with a thesis that takes a defensible position and previews the essay's line of reasoning. Which version best accomplishes this goal?
      options:
        - |
          The district should adopt the forty-hour requirement, because service teaches skills no classroom can and because a requirement reaches students who would never volunteer on their own.
        - |
          Community service is when people work for free to help their community.
        - |
          Some people like community service and some people do not.
        - |
          Community service is very important and everyone should care about it.
      option_explanations:
        - |
          Correct. The sentence takes a position someone could dispute (adopt the requirement) and names two reasons in the order the body paragraphs can follow, so it both requires proof and previews structure.
        - |
          A definition states a fact, not a claim; no one could argue with it, so it cannot be a thesis.
        - |
          This describes the existence of disagreement without taking a side; it is still a topic.
        - |
          The sentence gestures at a position but gives no reasons and no specific claim about the district's proposal.
      answer: 0
      explanation: |
        A thesis that requires proof takes a side; a thesis that previews structure names the reasons. Skill 4.B (from weeks 7, 8 and 15) wants both.

    - slug: u06-w21-q12
      type: multiple_choice
      topic_code: "2.A"
      source: written for this course
      points: 1
      stimulus: *w21_draft
      prompt: |
        The writer wants to replace sentence 1 with an opening suited to readers in the writer's own district. Which choice best accomplishes this goal?
      options:
        - |
          Throughout human history, every civilization has valued service.
        - |
          Webster's dictionary defines service as an act of helpful activity.
        - |
          Last year, volunteers from our high school logged more than three thousand hours at the food bank, the public library and the spring river cleanup.
        - |
          Have you ever wondered what community service is?
      option_explanations:
        - |
          This keeps the sweeping, unprovable generalisation that weakens the original opening.
        - |
          A dictionary definition is a familiar, low-energy opening that tells local readers nothing they need.
        - |
          Correct. A specific, local fact draws in readers who know these places and leads naturally to the district's proposal (skill 2.A, from week 12).
        - |
          A vague rhetorical question about a term everyone knows wastes the opening and sounds unsure.
      answer: 2
      explanation: |
        An introduction should suit its audience and context. Local readers respond to local, specific detail.

    - slug: u06-w21-q13
      type: multiple_choice
      topic_code: "3.B"
      source: written for this course
      points: 1
      stimulus: *w21_draft
      prompt: |
        Which best describes the main problem with sentences 4 and 5 as the draft's thesis?
      options:
        - |
          They are too long to be a thesis.
        - |
          They contain grammatical errors.
        - |
          They take too strong a position on the district's proposal.
        - |
          They announce a topic but make no claim about it, so the reader cannot tell what the essay will argue.
      option_explanations:
        - |
          Both sentences are short; length is not the issue.
        - |
          Both sentences are grammatical; the problem is what they say, not how.
        - |
          They take no position at all; that is the problem.
        - |
          Correct. “Has many sides” and “I will talk about” name a subject without saying anything arguable about it. A reader finishing the introduction does not know the writer's position.
      answer: 3
      explanation: |
        A test for any thesis: could a reasonable person disagree with it? If not, it is a topic or an announcement.

    - slug: u06-w21-q14
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: *w21_draft
      prompt: |
        The writer wants a thesis that acknowledges the perspective of students who work after school while still taking a clear position. Which version best accomplishes this goal?
      options:
        - |
          Students who work after school are right, so the requirement is a bad idea.
        - |
          Although students who already work after school deserve flexibility, the district should adopt the forty-hour requirement, spreading the hours over four years so that no student must choose between a job and a diploma.
        - |
          Working students, athletes, musicians and many other people have opinions about community service.
        - |
          The requirement might be good or might be bad, depending on the student.
      option_explanations:
        - |
          This acknowledges the perspective by abandoning the position, rather than taking it into account.
        - |
          Correct. The concession names the working students' concern, and the main clause keeps the position while showing how it answers that concern. The thesis is qualified, not weakened.
        - |
          Listing groups with opinions takes no position and describes no reasoning.
        - |
          The sentence refuses to decide; a thesis must commit to a claim, even a qualified one.
      answer: 1
      explanation: |
        Acknowledging another perspective inside a thesis makes it more credible, as long as the main clause still takes a side.

    - slug: u06-w21-q15
      type: multiple_choice
      topic_code: "5.B"
      source: written for this course
      points: 1
      stimulus: *w21_draft
      prompt: |
        The writer wants to add this sentence: *The school board will vote on the proposal at its March meeting.* Where would it best be placed to keep the introduction coherent?
      options:
        - |
          Immediately after sentence 3
        - |
          Before sentence 1
        - |
          Immediately after sentence 1
        - |
          After the thesis, as the final sentence
      option_explanations:
        - |
          Correct. Sentence 3 introduces the district's proposal; the vote is the next fact about it. Placed there, the background moves from general (many schools) to local (our district) to urgent (the vote), and the thesis can then close the paragraph.
        - |
          Opening with a meeting date before the reader knows the subject would confuse rather than orient.
        - |
          After the general opening, the vote would appear before the proposal it concerns has been mentioned.
        - |
          Ending with background after the thesis would bury the claim; introductions usually end on the thesis.
      answer: 0
      explanation: |
        Coherence depends on order (skill 5.B, from week 16). Background moves from general to specific, and each fact should follow the one it depends on.

    # ---- Thesis, structure and perspective
    - slug: u06-w21-q16
      type: multiple_choice
      topic_code: "3.B"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 1
      prompt: |
        Partway through “The Strenuous Life,” after arguing that expansion will help American trade, Roosevelt says: “So much for the commercial side. From the standpoint of international honor the argument is even stronger.” These sentences serve primarily to
      options:
        - |
          concede that the commercial argument was mistaken
        - |
          introduce a story about Roosevelt's childhood
        - |
          signal a move to a second, stronger reason, revealing that the reasons are ordered from weaker to stronger
        - |
          restate the speech's thesis in different words
      option_explanations:
        - |
          “So much for” closes a topic; it does not withdraw it. The next sentence calls the second argument “even stronger,” which assumes the first still stands.
        - |
          What follows is an argument about national honour and duty, not a personal story.
        - |
          Correct. The signpost marks the end of one reason and the start of another, and “even stronger” tells listeners the order is climactic.
        - |
          The sentences mark a transition between reasons; they do not restate the overall claim.
      answer: 2
      explanation: |
        Signposts make structure audible. “So much for X” and “even stronger” tell listeners both where they are and how the parts rank.

    - slug: u06-w21-q17
      type: multi_select
      topic_code: "3.A"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 2
      partial_credit: true
      prompt: |
        Later in the speech, Roosevelt says that many Filipinos are “utterly unfit for self-government” and that if Spanish rule is replaced by “savage anarchy,” American work in the islands will have done harm. Which TWO observations best explain why a careful reader would identify bias in these claims? Select two.
      options:
        - |
          Sweeping claims about an entire people are asserted without evidence.
        - |
          The speech never presents the perspective of the Filipinos themselves, many of whom were fighting for their independence.
        - |
          Roosevelt uses long sentences with many clauses.
        - |
          Roosevelt was the governor of New York when he gave the speech.
      option_explanations:
        - |
          Correct. Judgements about the fitness of a whole population are offered as self-evident; the speech gives no evidence for them, which suggests they rest on assumptions of the era rather than facts.
        - |
          Correct. Bias shows in what is left out. The people whose government is in question never speak in the speech, and their resistance is described only as anarchy.
        - |
          Sentence length is a feature of style, not a sign that a claim distorts evidence.
        - |
          Holding office gives Roosevelt a perspective, but a perspective is not the same as bias; the office alone proves nothing about distortion.
      answer: [0, 1]
      explanation: |
        Bias is a claim about a text, so it needs evidence: unsupported generalisations and silenced perspectives are two of the clearest kinds.

