    - slug: u06-w21-q21
      type: short_answer
      topic_code: "3.B"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 2
      prompt: |
        In two or three sentences, explain how the structure of “The Strenuous Life” reflects its thesis. Refer to at least one specific sentence or phrase that shows the structure.
      answer: |
        The thesis claims that the same standard of effort applies to individuals and to nations, and the speech is built in those two halves. The second paragraph's phrase “as little worthy of a nation as of an individual” previews the plan, the first half argues about personal effort, and the hinge “As it is with the individual, so it is with the nation” turns to national duty abroad before the conclusion restates the opening “preach.”
      explanation: |
        1 point: accurately states the thesis or its two-level comparison. 1 point: explains how a specific structural feature (the preview phrase, the hinge sentence, the signpost "So much for the commercial side," the restated thesis in the conclusion) reflects that thesis. Naming the structure without connecting it to the claim earns at most 1.

    - slug: u06-w21-q22
      type: short_answer
      topic_code: "4.B"
      source: written for this course
      points: 2
      prompt: |
        Roosevelt claims that "a life of slothful ease" is unworthy of an individual or a nation. Write a thesis statement (one or two sentences) for your own argument that agrees, disagrees or qualifies his claim as it applies to students today. Your thesis must take a position that requires defence and preview at least two reasons.
      answer: |
        Roosevelt is right that effort gives life meaning, but he is wrong to treat rest as weakness: students need hard, risky challenges to grow, and they need protected time to recover, because effort without rest produces burnout rather than strength.
      explanation: |
        1 point: a defensible position on Roosevelt's claim (agree, disagree or qualify) that someone could reasonably dispute. 1 point: previews at least two reasons or a clear structure. A thesis that restates Roosevelt's claim without a position, or that names a topic only, earns 0.

    - slug: u06-w21-q23
      type: long_answer
      topic_code: "3.B"
      source: 'Theodore Roosevelt, "The Strenuous Life" (1899)'
      points: 5
      prompt: |
        Write one well-developed paragraph (about 175-225 words). Make a claim about how Roosevelt's thesis in “The Strenuous Life” shapes the organization of the speech and its effect on his audience. Support it with at least two short quotations from different parts of the speech, and explain how each shows the thesis at work in the structure.
      answer: |
        Claim: Roosevelt's thesis is a comparison, the individual and the nation held to one standard, and that comparison gives the speech both its plan and its persuasive force with an audience of successful businessmen. Evidence 1: the opening sets “not the doctrine of ignoble ease” against “the doctrine of the strenuous life,” and the next paragraph adds that ease is “as little worthy of a nation as of an individual.” Commentary: the antithesis makes the thesis a moral choice, and the comparison maps the speech: listeners who accept the personal standard are told in advance that the national one will follow. Evidence 2: at the hinge he says, “As it is with the individual, so it is with the nation,” then applies the doctrine to “Hawaii, Cuba, Porto Rico, and the Philippines.” Commentary: having agreed that they themselves should not shrink from hardship, the listeners find it harder to reject the same standard for the nation; the structure turns personal pride into political agreement. Link: the conclusion's “I preach to you, then” closes the frame, so the speech ends where it began, with the choice.
      explanation: |
        5 points. Claim (1): an arguable claim connecting the thesis to the speech's organization and to its effect on the audience. Evidence (2): 2 points for at least two accurate quotations from different parts of the speech (opening, preview, hinge, signpost, conclusion); 1 point for only one, or for imprecise references. Commentary (2): 2 points if each quotation is explained as showing how the thesis organizes the speech and works on the audience; 1 point if the commentary only identifies structure without explaining its effect, or treats only one quotation; 0 for summary.
