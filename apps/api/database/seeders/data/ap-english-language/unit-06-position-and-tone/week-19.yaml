    - slug: u06-w19-q20
      type: short_answer
      topic_code: "3.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 2
      stimulus: |
        *The following passage is from the chapter "Self-Help" in Ida B. Wells's Southern Horrors (1892). Three Black grocers had been lynched in Memphis in March 1892.*

        The Afro-Americans of Memphis denounced the lynching of three of their best citizens, and urged and waited for the authorities to act in the matter and bring the lynchers to justice. No attempt was made to do so, and the black men left the city by thousands, bringing about great stagnation in every branch of business. Those who remained so injured the business of the street car company by staying off the cars, that the superintendent, manager and treasurer called personally on the editor of the Free Speech, asked them to urge our people to give them their patronage again.
      prompt: |
        In two or three sentences, identify the claim this passage supports in Wells's chapter and explain how the evidence in the passage supports it.
      answer: |
        The passage supports Wells's claim that economic pressure gets results where appeals to conscience do not. When the authorities ignored demands for justice, Black residents left the city and stayed off the streetcars, and the company's top officers came in person to ask for their business back. That visit is evidence that withdrawing labour and patronage forced the powerful to respond.
      explanation: |
        1 point: names the claim accurately (economic power or withdrawal of patronage is an effective tool; Black labour is the backbone of the Southern economy). 1 point: explains how a specific detail (the exodus, the stagnation of business, the officers' personal visit) proves it, beyond restating the passage. A response that only summarises earns at most 1.

    - slug: u06-w19-q21
      type: short_answer
      topic_code: "4.A"
      source: written for this course
      points: 2
      prompt: |
        You are writing an argument that your town should repair the footbridge over the creek. Your best evidence is a city council memo, written by officials who opposed the repair, that admits the bridge failed its last safety inspection. Write two sentences: a claim for a body paragraph, and a sentence that introduces this evidence in a way that uses the source's perspective to strengthen it.
      answer: |
        Claim: The footbridge is unsafe now, not at some point in the future, so repairs cannot wait for next year's budget. Evidence: Even a council memo written by officials who opposed the repair concedes that the bridge failed its most recent safety inspection, an admission that carries extra weight because its authors had every reason to say otherwise.
      explanation: |
        1 point: a clear, arguable claim that the evidence can prove. 1 point: the evidence is introduced with its source and the writer explains why that source's perspective (opposed to the repair) makes the admission more convincing. Simply quoting the memo without naming its authors' perspective earns at most 1.

    - slug: u06-w19-q22
      type: long_answer
      topic_code: "4.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 5
      prompt: |
        Write one well-developed paragraph (about 175-225 words). Make a claim about how Ida B. Wells chooses evidence in Southern Horrors to persuade readers who may doubt her, support it with at least two specific pieces of evidence from the pamphlet (quoted or precisely described), and explain how each piece supports your claim.
      answer: |
        Claim: Wells persuades doubtful readers by building her case from her opponents' own sources, so that rejecting her evidence would mean rejecting theirs. Evidence 1: her figure of 728 lynchings in eight years comes from statistics “compiled by the Chicago Tribune,” and she adds that only one-third of the victims were even charged with the crime used to justify lynching. Commentary: a reader inclined to distrust an exiled Black editor cannot easily distrust a major white daily, and the fraction turns that trusted number against the South's “plausible screen.” Evidence 2: in the chapter on the press she reprints the Memphis papers' editorials in full and quotes the lynchers' own complaint that Black citizens were “getting too independent.” Commentary: by letting her opponents speak, she shows their motive in their words; her reply, “The lesson of subordination,” only names what they have already admitted. Link: her perspective as a victim of the mob gives her urgency, but her method removes the reader's easiest objection, that she is biased.
      explanation: |
        5 points. Claim (1): an arguable claim about Wells's choice of evidence and its effect on a doubtful audience, not a summary of the pamphlet. Evidence (2): 2 points for two accurate, specific pieces of evidence from different parts of the pamphlet (the Tribune statistics, the one-third figure, the reprinted editorials, the People's Grocery case, the streetcar boycott); 1 point for only one, or two that are vague. Commentary (2): 2 points if each piece is explained in terms of the claim (why this source persuades this audience); 1 point if commentary is thin or explains only one piece; 0 if the paragraph only summarises.
