week: 19
unit: 6
title: Position, Perspective and Evidence in Ida B. Wells's Southern Horrors
topics: ["3.A", "4.A"]
texts:
  - author: Ida B. Wells
    title: "Southern Horrors: Lynch Law in All Its Phases"
    year: 1892
    url: https://www.gutenberg.org/ebooks/14975
guide: guides/week-19.md
guide_description: |
  Unit 6 opens with the difference between a writer's position (the claim they defend) and their perspective (the
  place they argue from), and with how evidence behaves when every available source is biased. The case study is
  Ida B. Wells's pamphlet Southern Horrors (1892), written in exile after a mob destroyed her Memphis newspaper:
  how she turns her opponents' own statistics and newspapers into evidence against them, and how she builds claims
  a hostile reader cannot easily dismiss. Close readings, a lesson on building a claim-and-evidence paragraph from
  sources you do not fully trust, common mistakes, an exam connection and self-check questions. The pamphlet's
  subject is racial violence; the guide quotes Wells's argument and evidence, not her accounts of violence.
flashcards_description: |
  30 cards on position, perspective and bias, kinds of evidence and how to judge them, the claim-and-evidence
  paragraph, and the context, claims and key phrases of Ida B. Wells's Southern Horrors.

flashcards:
  - front: Position vs perspective → the Unit 6 distinction
    back: |
      A position is the claim a writer defends (lynching must be stopped by law). A perspective is the vantage point the writer argues from: experience, identity, profession, place, values. Two writers can share a position from different perspectives, or share a perspective and disagree.
    topic_code: "3.A"
  - front: Perspective → is it the same as bias?
    back: |
      No. Every writer has a perspective; bias is a perspective that distorts, when a writer ignores, suppresses or misrepresents evidence that cuts against them. Naming a writer's perspective is description; calling it bias is a claim you must prove.
    topic_code: "3.A"
  - front: Bias → three signs to look for in a source
    back: |
      Evidence chosen only from one side (cherry-picking), loaded words that do the arguing instead of the facts, and silence about an obvious counterexample. A biased source can still contain accurate facts; the question is what it leaves out.
    topic_code: "3.A"
  - front: Claim → the AP Language definition
    back: |
      An arguable statement a writer asks the audience to accept, which requires evidence and reasoning. A thesis is the overarching claim; paragraphs carry smaller, supporting claims.
    topic_code: "3.A"
  - front: Evidence → the four kinds most AP passages use
    back: |
      Statistics and data; specific cases or examples; testimony (a witness, an expert, a participant); and authority or documents (a newspaper, a law, a report). Ask of each: where does it come from, and why would this audience trust it?
    topic_code: "3.A"
  - front: Statistical evidence → its strength and its risk
    back: |
      Numbers suggest scale and pattern that a single story cannot. The risk is that a reader distrusts the counter: who compiled the figures, how, and for what purpose?
    topic_code: "3.A"
  - front: Anecdotal (case) evidence → what it does that numbers cannot
    back: |
      A named case gives a pattern a human face and makes it hard to dismiss as abstraction. Alone it proves little; set beside statistics it shows what the numbers mean.
    topic_code: "3.A"
  - front: Evidence your opponent already accepts → why it is powerful
    back: |
      Facts drawn from sources the other side trusts cannot be waved away as partisan. Wells builds much of Southern Horrors from white Southern newspapers and the Chicago Tribune for exactly this reason.
    topic_code: "3.A"
  - front: Claim-evidence-commentary paragraph → the order for skill 4.A
    back: |
      Open with a claim that needs proof; introduce evidence with its source; explain in your own words how the evidence proves the claim; close by linking back to the claim or forward to the next point.
    topic_code: "4.A"
  - front: Introducing a source in a paragraph → the minimum
    back: |
      Name who said it or compiled it and, when it matters, why their perspective is relevant: according to a newspaper that supported the mob, even the city's own business leaders admitted. The tag tells the reader how much weight the evidence can bear.
    topic_code: "4.A"
  - front: Using a source you think is biased → the honest move
    back: |
      Say so, and use the source only for what its bias cannot explain. A pro-lynching paper's admission that no crime occurred is strong evidence precisely because the paper had every reason to claim the opposite.
    topic_code: "4.A"
  - front: Commentary → the question it must answer after each piece of evidence
    back: |
      So what? How does this fact prove the part of the claim that someone could dispute? Commentary that repeats the evidence in other words earns nothing on the rubric.
    topic_code: "4.A"
  - front: Ida B. Wells → who she was in 1892
    back: |
      A journalist and teacher, born enslaved in Mississippi in 1862, co-owner and editor of the Memphis newspaper Free Speech. After she criticised lynching in print, a mob destroyed the paper's office and she was warned not to return to Memphis.
    topic_code: "3.A"
  - front: Southern Horrors → publication and audience
    back: |
      A pamphlet published in New York in October 1892, expanding Wells's article "Exiled" from the New York Age (June 25, 1892). Its readers were Black communities in the North and white Northerners whose silence Wells wanted to end.
    topic_code: "3.A"
  - front: Southern Horrors → its exigence
    back: |
      The destruction of the Free Speech in May 1892 after Wells's editorial on lynching, and the lynching of three Memphis grocers in March 1892. She writes, in her preface, to give "a true, unvarnished account of the causes of lynch law in the South."
    topic_code: "3.A"
  - front: Wells's preface → how she defines her own pamphlet
    back: |
      "It is a contribution to truth, an array of facts." She presents herself as a reporter assembling evidence, not as an orator, which shapes the reader's expectation: judge me by my facts.
    topic_code: "3.A"
  - front: Wells's overarching claim in Southern Horrors
    back: |
      The common justification for lynching, protecting women from assault, is a pretext. Lynching is a tool for keeping Black Southerners economically and politically subordinate, and silence in the North and the South lets it spread.
    topic_code: "3.A"
  - front: The 728 figure → where Wells got it and why that matters
    back: |
      From statistics "compiled by the Chicago Tribune," a major white-owned Northern daily: 728 people lynched in eight years. By citing a source no one could call partisan for her side, Wells makes the number hard to dispute.
    topic_code: "3.A"
  - front: "\"only one-third of the 728 victims\" → what the fraction proves"
    back: |
      If only a third of those lynched were even charged with assault, the claim that lynching exists to punish that crime fails on its own terms. The fraction turns a statistic into a refutation.
    topic_code: "3.A"
  - front: "\"the plausible screen of defending the honor of its women\" → the claim in a metaphor"
    back: |
      A screen hides what stands behind it; "plausible" concedes that it looks convincing. In one short phrase Wells states her central claim, that the stated reason conceals the real one.
    topic_code: "3.A"
  - front: The People's Grocery case → what Wells uses it to prove
    back: |
      Three successful Black grocers in Memphis were taken from jail and lynched in March 1892 after a white competitor's quarrel with them; none was even accused of the crime the South claimed lynching punished. The case is her evidence that economic rivalry, not that crime, drove the violence.
    topic_code: "3.A"
  - front: "\"The Negroes are getting too independent\" → why Wells quotes the mob's own reason"
    back: |
      The words come from the lynchers' side. By quoting them and answering "What lesson? The lesson of subordination," Wells lets her opponents state her thesis for her.
    topic_code: "3.A"
  - front: Wells on the white press → the claim of "The Malicious and Untruthful White Press"
    back: |
      Memphis papers printed inflammatory, unsupported stories and labelled the murdered grocers "toughs." Wells reprints such items in full so readers can judge the press's bias by its own words.
    topic_code: "3.A"
  - front: "\"particeps criminis\" → Wells's charge against silent bystanders"
    back: |
      Latin legal term for a partner in a crime. Wells argues that Southerners who disapprove of lynching but stay silent are "accomplices, accessories before and after the fact," as guilty as the mob.
    topic_code: "3.A"
  - front: Wells's "Self-Help" chapter → the economic argument
    back: |
      Black labour is "the backbone of the South," so withdrawing it (leaving Memphis, staying off streetcars and railroads) applies pressure that moral appeals have not. "The appeal to the white man's pocket has ever been more effectual than all the appeals ever made to his conscience."
    topic_code: "3.A"
  - front: The Memphis streetcar boycott → Wells's evidence that self-help works
    back: |
      After the 1892 lynchings, Black residents stayed off the streetcars; the company's officers visited the Free Speech to ask for their patronage back. Wells offers it as proof that economic pressure gets a response.
    topic_code: "3.A"
  - front: "\"The people must know before they can act\" → the claim about the press"
    back: |
      Wells argues that the facts of lynching are distorted by "unreliable and doctored reports," so a free Black press able to investigate is a precondition for reform. Her own pamphlet enacts that claim.
    topic_code: "3.A"
  - front: Wells's perspective → three things that shaped it
    back: |
      Her life as a Black woman born into slavery; her work as a Memphis editor who knew the murdered grocers; and her exile, which made her both a witness and a target. The perspective explains her urgency, but her method is to rest the case on documents.
    topic_code: "3.A"
  - front: Loaded language → how Wells exposes it in her opponents' papers
    back: |
      She reprints Memphis editorials whose words ("scoundrel," "brute") assume guilt before any trial, then points to the cases where the accusation was false. The contrast lets readers see the bias rather than take her word for it.
    topic_code: "3.A"
  - front: Wells's pamphlet → how to read it responsibly in class
    back: |
      It documents real racial violence. Read it as an argument: track her claims, her sources and her reasoning. The point of studying it is to see how evidence can defeat a widely believed justification.
    topic_code: "3.A"

quiz:
  description: |
    22 questions · about 40 minutes · a set of nine questions on a passage from Southern Horrors, a revision set of
    five questions on a student's draft paragraph, then questions on the rest of the pamphlet, on position,
    perspective and evidence, and on earlier skills (audience, word choice, introductions). Multiple choice,
    select-all and true/false items are graded at once; the fill-in-the-blank items are matched automatically; the
    two short answers and the paragraph are graded by your teacher against the model answer and scoring notes.
    The pamphlet's subject is lynching; the passages are chosen for Wells's claims and evidence, and none describes
    an act of violence in detail.
  questions:
    # ---- Passage set: Wells on the record and the "screen"
    - slug: u06-w19-q01
      type: multiple_choice
      topic_code: "3.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      stimulus: &wells_cry |
        *The following passage is from Ida B. Wells's pamphlet Southern Horrors (1892), from the chapter "The New Cry." Wells has been tracing how the South resisted the civil and political rights Black Americans gained after the Civil War.*

        All this while, although the political cause has been removed, the butcheries of black men at Barnwell, S.C., Carrolton, Miss., Waycross, Ga., and Memphis, Tenn., have gone on [...] until the dark and bloody record of the South shows 728 Afro-Americans lynched during the past eight years. Not fifty of these were for political causes; the rest were for all manner of accusations [...]

        These statistics compiled by the Chicago Tribune were given the first of this year (1892). Since then, not less than one hundred and fifty have been known to have met violent death at the hands of cruel bloodthirsty mobs during the past nine months.

        To palliate this record (which grows worse as the Afro-American becomes intelligent) and excuse some of the most heinous crimes that ever stained the history of a country, the South is shielding itself behind the plausible screen of defending the honor of its women. This, too, in the face of the fact that only one-third of the 728 victims to mobs have been charged with rape, to say nothing of those of that one-third who were innocent of the charge.

        [...]

        This cry has had its effect. It has closed the heart, stifled the conscience, warped the judgment and hushed the voice of press and pulpit on the subject of lynch law throughout this "land of liberty." Men who stand high in the esteem of the public for Christian character, for moral and physical courage, for devotion to the principles of equal and exact justice to all, and for great sagacity, stand as cowards who fear to open their mouths before this great outrage. They do not see that by their tacit encouragement, their silent acquiescence, the black shadow of lawlessness in the form of lynch law is spreading its wings over the whole country.
      prompt: |
        Which statement best expresses the central claim of the third paragraph ("To palliate this record...")?
      options:
        - |
          The South's stated reason for lynching is a cover that the facts do not support.
        - |
          Lynching has increased because the Chicago Tribune has begun to report it.
        - |
          Most victims of lynching were guilty of political offences.
        - |
          Southern newspapers have been more honest about lynching than Northern ones.
      option_explanations:
        - |
          Correct. "Plausible screen" says the justification looks convincing but hides something, and the one-third figure shows it cannot explain most of the 728 lynchings. The paragraph's claim is that the excuse is a pretext.
        - |
          The Tribune is Wells's source for the figures, not a cause of the violence. Nothing in the paragraph links reporting to an increase.
        - |
          The second paragraph says "Not fifty" of the 728 were for political causes, so this reverses what the passage reports.
        - |
          The passage compares no newspapers by region; the last paragraph says the "press and pulpit" in general have been hushed.
      answer: 0
      explanation: |
        A claim is what the writer asks the reader to accept. Here the metaphor ("screen") states it and the statistic ("only one-third") proves it.

    - slug: u06-w19-q02
      type: multiple_choice
      topic_code: "3.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      stimulus: *wells_cry
      prompt: |
        The figure "only one-third of the 728 victims" functions in the argument primarily as evidence that
      options:
        - |
          the number of lynchings has been exaggerated by Northern reporters
        - |
          Wells has personally investigated every case on the list
        - |
          the justification offered for lynching cannot account for most of the cases it claims to explain
        - |
          one-third of the victims were proved guilty in court before they died
      option_explanations:
        - |
          Wells accepts the 728 figure and builds on it; she does not suggest it is inflated. The point of the fraction is what the charges were, not whether the count is right.
        - |
          She attributes the figures to the Chicago Tribune, not to her own investigation, so the fraction cannot be evidence of personal research.
        - |
          Correct. If the stated reason for lynching is to punish one crime, but two-thirds of victims were never charged with it, the reason fails as an explanation. The statistic does the refuting.
        - |
          The passage says the third were “charged,” not convicted, and adds that some of them “were innocent of the charge.” No trials are mentioned.
      answer: 2
      explanation: |
        Ask what a piece of evidence proves in the writer's line of reasoning, not only what it says. A fraction here becomes a refutation of the opponents' own explanation.

    - slug: u06-w19-q03
      type: multiple_choice
      topic_code: "1.B"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      stimulus: *wells_cry
      prompt: |
        Wells's attribution of the statistics to the Chicago Tribune most likely reflects her awareness that her readers
      options:
        - |
          would be more interested in Chicago than in the South
        - |
          might dismiss figures from a Black editor in exile but would find it harder to dismiss figures from a major white-owned daily
        - |
          already subscribed to the Tribune and had read the figures for themselves
        - |
          preferred newspaper reports to personal testimony in every case
      option_explanations:
        - |
          The passage is about the South; the Tribune matters as a source, not as a subject. Nothing suggests the readers cared more about Chicago.
        - |
          Correct. Wells writes for audiences, including white Northerners, who might suspect her of partisanship. A source they trust makes the number hard to wave away, which is an argument built on the audience's beliefs (skill 1.B).
        - |
          The passage gives no sign that readers had seen the figures; Wells introduces them as information her readers need.
        - |
          Elsewhere Wells uses testimony too. The choice here concerns trust in this particular source, not a general preference for one kind of evidence.
      answer: 1
      explanation: |
        Choosing a source is an audience decision. The more hostile or doubtful the audience, the more a writer gains from evidence the audience already accepts.

    - slug: u06-w19-q04
      type: multiple_choice
      topic_code: "3.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      stimulus: *wells_cry
      prompt: |
        The parenthetical remark "(which grows worse as the Afro-American becomes intelligent)" contributes to the argument by
      options:
        - |
          apologising for the strong language in the rest of the sentence
        - |
          conceding that education has made the problem impossible to solve
        - |
          introducing a new source that the passage will go on to quote
        - |
          slipping in a second claim, that the violence rises with Black progress, which supports her view that the motive is subordination rather than punishment of crime
      option_explanations:
        - |
          The aside sharpens the charge rather than softening it; nothing in it apologises.
        - |
          Wells does not say the problem cannot be solved. Her pamphlet ends with practical remedies, so reading the aside as despair misreads its function.
        - |
          The parentheses contain an observation, not a source; no new authority is introduced.
        - |
          Correct. If lynching worsens as Black Americans advance, it looks like a response to independence, not to crime. The aside plants the economic and political claim the pamphlet develops later.
      answer: 3
      explanation: |
        Writers often carry a supporting claim inside a parenthesis or a subordinate clause. Notice it, and ask how it connects to the thesis.

    - slug: u06-w19-q05
      type: multiple_choice
      topic_code: "7.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      stimulus: *wells_cry
      prompt: |
        In the sentence beginning "It has closed the heart," the series of four parallel verb phrases chiefly serves to
      options:
        - |
          show the "cry" damaging feeling, conscience, reason and public speech in turn, so its effect seems total
        - |
          list the four Southern states where the most lynchings occurred
        - |
          soften the accusation by spreading it across many institutions
        - |
          introduce the statistics that the next paragraph analyses
      option_explanations:
        - |
          Correct. Heart, conscience, judgment and voice cover emotion, morality, thought and speech. The parallel rhythm makes the damage feel complete and builds toward the "press and pulpit," the voices that should have spoken.
        - |
          The phrases name human faculties, not places. The states appear in the first paragraph, not here.
        - |
          The series intensifies the charge; by the next sentence respected men "stand as cowards." Nothing softens.
        - |
          The statistics come earlier in the passage. This sentence describes the effect of the "cry," not numbers.
      answer: 0
      explanation: |
        Syntax shapes tone (skill 7.A, from week 17). Parallel series give an accusation weight and a sense of completeness.

    - slug: u06-w19-q06
      type: multi_select
      topic_code: "3.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 2
      partial_credit: true
      stimulus: *wells_cry
      prompt: |
        Which TWO kinds of evidence does Wells use in this passage? Select two.
      options:
        - |
          Statistics attributed to a named newspaper
        - |
          A comparison between the numbers of lynchings and of charges brought
        - |
          A quoted interview with a governor
        - |
          The results of a survey Wells conducted among Memphis residents
      option_explanations:
        - |
          Correct. The 728 figure and the count of 150 since January are credited to the Chicago Tribune and its reporting.
        - |
          Correct. Setting the 728 lynchings against the one-third "charged" is a comparison of two numbers, and it is what makes the statistic argue.
        - |
          No governor is quoted in this passage. The pamphlet mentions officials elsewhere, but not here.
        - |
          Wells reports no survey of her own. Her evidence in this passage comes from published figures.
      answer: [0, 1]
      explanation: |
        Name evidence precisely: not just "facts," but where they come from and how they are put to work.

    - slug: u06-w19-q07
      type: true_false
      topic_code: "3.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      stimulus: *wells_cry
      prompt: |
        True or false: in the final paragraph, Wells claims that respected people who stay silent about lynching help it spread.
      answer: true
      explanation: |
        True. The men "who stand high in the esteem of the public" are "cowards," and "by their tacit encouragement, their silent acquiescence" lynch law spreads "over the whole country." Silence is treated as participation, a claim she repeats later with the legal term particeps criminis.

    - slug: u06-w19-q08
      type: multiple_choice
      topic_code: "7.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      stimulus: *wells_cry
      prompt: |
        The quotation marks around "land of liberty" in the final paragraph signal
      options:
        - |
          that Wells is quoting the Chicago Tribune's headline
        - |
          admiration for the country's founding ideals, which Wells hopes to restore
        - |
          irony: the nation's name for itself is contradicted by the silence and lawlessness she describes
        - |
          uncertainty about whether the phrase is spelled correctly
      option_explanations:
        - |
          No headline is cited; the phrase is a common patriotic description of the United States, not a quotation from the Tribune.
        - |
          Wells may share the ideals, but the marks distance her from the phrase at the moment the country fails to live up to it. The tone is bitter, not admiring.
        - |
          Correct. Placed after a list of hushed voices, "land of liberty" in quotation marks becomes a claim the facts refute. These are scare quotes, a small mark that carries a large shift in tone.
        - |
          Quotation marks signal attitude or a borrowed phrase, never doubts about spelling; the reading has no basis in the passage.
      answer: 2
      explanation: |
        Scare quotes hand a phrase back to the people who use it. They are one of the quickest signals of a writer's attitude.

    - slug: u06-w19-q09
      type: multiple_choice
      topic_code: "1.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      stimulus: *wells_cry
      prompt: |
        Which piece of context best explains Wells's PERSPECTIVE in the passage, as distinct from her position?
      options:
        - |
          She believes lynching should be ended by law.
        - |
          She writes as a Black editor whose Memphis newspaper had just been destroyed for criticising lynching.
        - |
          She argues that the South's justification is a pretext.
        - |
          She wants respected men to speak out.
      option_explanations:
        - |
          That lynching should end is a claim she defends: her position, not the vantage point she writes from.
        - |
          Correct. Perspective is where the writer stands: her identity, experience and situation. Exile after the destruction of the Free Speech gives her first-hand knowledge and a personal stake in the subject.
        - |
          This is her central claim about the justification, part of her position, not a description of her vantage point.
        - |
          This is a goal of the argument, its purpose, not the experience or identity she argues from.
      answer: 1
      explanation: |
        Position answers the question of what she claims; perspective answers the question of where she stands and what experience she sees the issue through. Part of the rhetorical situation (skill 1.A).

    # ---- Revision set: a student's draft paragraph
    - slug: u06-w19-q10
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: &w19_draft |
        *The following paragraph is from a student's draft of an editorial for the school newspaper. The sentences are numbered.*

        (1) Our school newspaper should be allowed to publish without the principal reading every article first. (2) Last year, the administration held back three stories, including a report on broken water fountains, until the problems they described had already been fixed. (3) I personally think that is really unfair. (4) Many students enjoy reading the newspaper at lunch, especially the sports page. (5) Review before publication teaches student reporters that the truth is welcome only when it is convenient. (6) When a story appears weeks late, it can no longer prompt anyone to act.
      prompt: |
        The writer wants to add evidence after sentence 5 that directly supports the claim in that sentence. Which choice best accomplishes this goal?
      options:
        - |
          Prior review means that an administrator reads a student article before it is printed.
        - |
          The newspaper was founded in 1974 and has won several regional awards.
        - |
          A famous novelist once wrote that freedom is the most important value of all.
        - |
          In a survey of the newspaper staff this fall, eight of eleven editors said they had dropped a story idea because they expected it to be held back.
      option_explanations:
        - |
          A definition clarifies a term, but it offers no proof that review discourages honest reporting. It explains; it does not support.
        - |
          The paper's history and awards are irrelevant to whether review changes what reporters choose to write.
        - |
          A general quotation about freedom is not evidence about this school or this practice; it decorates the claim without proving it.
        - |
          Correct. Sentence 5 claims that review changes how reporters behave. Editors reporting that they dropped stories in anticipation is direct evidence of exactly that effect, from the people affected.
      answer: 3
      explanation: |
        Evidence must prove the arguable part of the claim. Here that part is the effect of review on reporters' choices.

    - slug: u06-w19-q11
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: *w19_draft
      prompt: |
        Which sentence should the writer delete because it does not support the paragraph's claim?
      options:
        - |
          Sentence 2
        - |
          Sentence 5
        - |
          Sentence 6
        - |
          Sentence 4
      option_explanations:
        - |
          Sentence 2 is the paragraph's only concrete evidence: three stories held back until they no longer mattered. Deleting it would leave the claim unsupported.
        - |
          Sentence 5 is a supporting claim that explains why review is harmful; it belongs to the line of reasoning.
        - |
          Sentence 6 explains the cost to readers, extending the argument; it supports the claim.
        - |
          Correct. That students enjoy the sports page says nothing about whether articles should be reviewed before publication. It is true but off the point.
      answer: 3
      explanation: |
        A true sentence can still be irrelevant. Test every sentence against the claim it is supposed to serve.

    - slug: u06-w19-q12
      type: multiple_choice
      topic_code: "4.A"
      source: written for this course
      points: 1
      stimulus: *w19_draft
      prompt: |
        The writer wants to replace sentence 3 with commentary that explains how the evidence in sentence 2 supports the claim. Which version best accomplishes this goal?
      options:
        - |
          This is a very serious problem that everyone should care about.
        - |
          Holding a story until the problem is solved turns the newspaper from a tool for change into a record of what has already happened.
        - |
          The water fountains are on the second floor near the science labs.
        - |
          Many other schools also have newspapers that students write for.
      option_explanations:
        - |
          The sentence asserts importance without explaining anything; it replaces one opinion with another.
        - |
          Correct. It says what the delay did (it took away the story's power to cause change), which links the evidence to the claim that review harms the paper's purpose.
        - |
          Adding the fountains' location is a detail about the evidence, not commentary on what the evidence proves.
        - |
          A fact about other schools shifts the subject; it does not explain the significance of the held stories.
      answer: 1
      explanation: |
        Commentary answers "so what?" Opinion words such as "unfair" or "serious" announce a judgment but do not earn it.

    - slug: u06-w19-q13
      type: multiple_choice
      topic_code: "6.B"
      source: written for this course
      points: 1
      stimulus: *w19_draft
      prompt: |
        The writer wants to begin sentence 6 with a transition that shows it adds a second group harmed by review. Which choice best accomplishes this goal?
      options:
        - |
          In conclusion,
        - |
          For example,
        - |
          Readers lose as well:
        - |
          However,
      option_explanations:
        - |
          Sentence 6 extends the argument rather than summing it up, and nothing follows that would make it a conclusion.
        - |
          Sentence 6 is not an instance of sentence 5's claim about reporters; it names a different harm, to readers.
        - |
          Correct. Sentence 5 is about reporters; sentence 6 is about the audience. The transition names the new group and signals addition, guiding the reader through the line of reasoning (skill 6.B, from week 16).
        - |
          "However" signals contrast, but sentence 6 agrees with and extends sentence 5.
      answer: 2
      explanation: |
        Choose a transition by the relationship between the two ideas: addition, contrast, example, cause or conclusion.

    - slug: u06-w19-q14
      type: multi_select
      topic_code: "2.B"
      source: written for this course
      points: 2
      partial_credit: true
      stimulus: *w19_draft
      prompt: |
        The writer decides to send the editorial to the principal before it runs. Which TWO additions would best show an understanding of that reader's values while keeping the writer's position? Select two.
      options:
        - |
          A sentence granting that the principal's concern for accuracy is reasonable, followed by a proposal that the faculty adviser check facts without delaying publication
        - |
          A sentence pointing out that reporters who learn to check their own facts now are practising the responsibility the school says it wants to teach
        - |
          A sentence saying that administrators never understand students
        - |
          A sentence withdrawing the request so as not to upset anyone
      option_explanations:
        - |
          Correct. It names a value the principal holds (accuracy) and shows the proposal protects it, so the reader can agree without giving up that value.
        - |
          Correct. It ties the writer's position to the school's own goal of teaching responsibility, an appeal to the audience's values (skill 2.B, from week 5).
        - |
          An insult to the audience's whole group alienates the reader whose agreement the writer needs.
        - |
          Withdrawing the request abandons the position; understanding an audience does not mean surrendering to it.
      answer: [0, 1]
      explanation: |
        Showing an audience you understand its values is different from agreeing with it. The best moves keep the claim and show how it serves what the reader already cares about.

    # ---- The rest of the pamphlet
    - slug: u06-w19-q15
      type: multiple_choice
      topic_code: "3.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      prompt: |
        In the chapter "Self-Help," Wells writes: "The appeal to the white man's pocket has ever been more effectual than all the appeals ever made to his conscience." Which claim does this sentence make?
      options:
        - |
          Economic pressure has achieved more than moral persuasion, so it is the better tool for securing justice.
        - |
          White Southerners have no conscience at all.
        - |
          Black Southerners should stop working altogether.
        - |
          Moral appeals should replace boycotts in the future.
      option_explanations:
        - |
          Correct. The comparison ("more effectual than") claims that economic appeals work better than moral ones, which is why the chapter recommends withdrawing labour and patronage.
        - |
          The sentence compares the effectiveness of two appeals; it says appeals to conscience have worked less well, not that conscience is absent.
        - |
          The chapter recommends targeted withdrawal (leaving a city, staying off streetcars), not ceasing all work.
        - |
          This reverses the sentence, which ranks economic appeals above moral ones.
      answer: 0
      explanation: |
        Read the comparative words in a claim ("more effectual than") carefully; they tell you exactly what is being ranked against what.

    - slug: u06-w19-q16
      type: multiple_choice
      topic_code: "5.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      prompt: |
        Which sequence best describes the line of reasoning of Wells's chapter "Self-Help"?
      options:
        - |
          A story of her childhood, then a description of Memphis, then a farewell to her readers
        - |
          A list of the lynchings of 1892 in date order, with no conclusion drawn
        - |
          An appeal to the President, then a defence of the Southern press, then a call for patience
        - |
          Black labour sustains the Southern economy; withdrawing it hurts business; the Memphis streetcar company's request for riders back shows the pressure works; so economic action can win rights that appeals to conscience have not
      option_explanations:
        - |
          The chapter is an argument about strategy, not a memoir; it contains no childhood story or farewell.
        - |
          The chapter draws an explicit conclusion: that economic power, used judiciously, can secure justice.
        - |
          Wells criticises the Southern press elsewhere and does not counsel patience; the chapter urges action.
        - |
          Correct. Each step supports the next: a premise about labour, a consequence, a case as evidence, and a conclusion about strategy. That chain is the line of reasoning (skill 5.A, from week 9).
      answer: 3
      explanation: |
        A line of reasoning is the chain of claims that leads to the conclusion. Describe the links, not just the topics.

    - slug: u06-w19-q17
      type: true_false
      topic_code: "3.A"
      source: 'Ida B. Wells, Southern Horrors: Lynch Law in All Its Phases (1892)'
      points: 1
      prompt: |
        True or false: Southern Horrors rests its case mainly on Wells's own memories and feelings rather than on documents.
      answer: false
      explanation: |
        False. Wells calls the pamphlet "an array of facts" and builds it from newspaper reports, the Chicago Tribune's statistics, court cases and her opponents' own editorials. Her experience gives her perspective and urgency, but her evidence is documentary.

