      source: general knowledge
      points: 2
      prompt: |
        Revise this overstated claim so that it is qualified but still takes a clear position. Then, in one sentence, explain which qualifier you used and why. Claim to revise: *Homework is a complete waste of time for every student.*
      answer: |
        Revision: For most students below high school, nightly homework beyond about twenty minutes adds little to what they learn in class. Explanation: I limited the scope (most students below high school), set a condition (beyond about twenty minutes) and narrowed the effect (adds little, not a complete waste), so the claim now covers only what research and experience could support.
      explanation: |
        1 point: the revision removes the absolutes (complete, every) and adds at least one meaningful qualifier of scope, certainty or condition while keeping a clear, arguable position (not a vague or reversed claim). 1 point: the explanation names the qualifier and connects it to what the evidence could support. Over-hedged revisions (homework might sometimes be less useful) earn at most 1.

