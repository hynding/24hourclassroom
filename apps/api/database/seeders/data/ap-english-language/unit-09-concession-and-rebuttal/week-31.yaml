    - slug: u09-w31-q22
      type: long_answer
      topic_code: "4.C"
      source: general knowledge
      points: 5
      prompt: |
        Write a counterargument paragraph (about 150-200 words) for an argument essay that defends this thesis: *Our school should replace letter grades in ninth grade with written feedback and a pass-or-revise system.* Your paragraph must state the strongest objection to the thesis fairly, concede what is true in it, rebut it with a specific reason, and end by qualifying or restating the thesis in light of the objection.
      answer: |
        Model: Parents and teachers who defend letter grades make a serious point: grades are quick to read, and colleges and scholarship committees expect them. That concern is fair, since a family deciding whether a student needs help should not have to decode three paragraphs of comments. Yet ninth grade is the one year when that tradeoff tilts the other way. Ninth-grade marks carry the least weight in college admissions, and they come at the moment students most need to learn how to revise rather than how to protect an average. A pass-or-revise system with a one-line summary for parents keeps the information families need while removing the fear that makes freshmen avoid hard work. The proposal, then, is not to abolish grades but to delay them for a single year, when written feedback teaches more than a letter can.
      explanation: |
        5 points. Objection stated fairly (1): a specific, strong objection that its holders would recognise, not a straw man. Concession (1): grants something true or reasonable in the objection, in the writer's own words. Rebuttal (2): 2 points for a specific reason or evidence showing why the thesis still holds (not a bare "they are wrong"); 1 point if the rebuttal is general or only asserted. Qualified thesis (1): the final sentence narrows, conditions or restates the thesis in a way that absorbs the objection. Transitions marking concession and turn are expected; their absence may cost the rebuttal point if the turn is unclear.
