        1 point: explains that the concession matches readers' own experience and builds credibility or trust. 1 point: explains how the limit (in some degree, or blaming faction rather than the constitutions) keeps the concession from offending or from undercutting his case. A response that only restates the phrase earns 0.

    - slug: u09-w31-q20
      type: short_answer
