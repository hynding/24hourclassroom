        - |
          Correct. It recognises the shopkeepers' practical need for deliveries, a perspective the draft ignored, and adjusts the plan to meet it, which makes the proposal more realistic.
      answer: 3
      explanation: |
        An alternative perspective does not have to be an objection. Here it leads the writer to refine the claim, which is one of the forms of qualification skill 4.C names.

