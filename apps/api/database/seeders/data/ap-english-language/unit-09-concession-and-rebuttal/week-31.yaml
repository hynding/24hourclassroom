week: 31
unit: 9
title: Qualifying a Claim with Madison's Federalist No. 10
topics: ["4.C"]
texts:
  - author: James Madison (as Publius)
    title: The Federalist No. 10, in The Federalist Papers
    year: 1787
    url: https://www.gutenberg.org/ebooks/1404
guide: guides/week-31.md
guide_description: |
  The writing week of the unit: how to qualify your own claims so that they say exactly what you can defend.
  Three ways to qualify (modifiers of scope and certainty, conditions, and counterarguments), the difference
  between a qualified claim and a hedged-away one, and the shape of a counterargument paragraph. James Madison's
  Federalist No. 10 (1787) is the model: a writer who grants that his opponents' complaints are in some degree
  true, measures every claim, and dismisses one remedy while conceding that it would work. Worked revisions of a
  student draft, common mistakes, exam connection and self-check.
flashcards_description: |
  30 cards on qualifiers, absolute words, conditions and counterargument paragraphs, and on the context, claims and
  carefully measured sentences of Madison's Federalist No. 10.

flashcards:
  - front: Qualifying a claim → the three main tools
    back: |
      Modifiers that limit scope or certainty (most, often, probably); conditions that say when the claim holds (if, when, for students who); and counterarguments or alternative perspectives that the claim is adjusted to answer.
    topic_code: "4.C"
  - front: Scope qualifier → definition and examples
    back: |
      A word that limits how much of a group a claim covers: some, many, most, a few, in rural districts. It answers the question how many, or which ones.
    topic_code: "4.C"
  - front: Certainty qualifier → definition and examples
    back: |
      A word that limits how sure a claim is: probably, likely, may, appears to, in all likelihood. It answers the question how sure.
    topic_code: "4.C"
  - front: Conditional qualifier → definition and example
    back: |
      A clause that names the circumstances under which a claim holds: if the program is funded, when teachers are trained, unless costs rise. The claim stays firm inside its stated limits.
    topic_code: "4.C"
  - front: Absolute words → why revision targets them
    back: |
      Always, never, every, all, none, everyone, no one. A single counterexample defeats an absolute claim, so careful writers replace absolutes with what the evidence supports.
    topic_code: "4.C"
  - front: Over-hedging → the opposite error
    back: |
      Stacking qualifiers until the claim says nothing (It might possibly be somewhat helpful in some cases). A qualified claim is precise; an over-hedged claim is evasive and cannot be defended or attacked.
    topic_code: "4.C"
  - front: Qualified claim versus weak claim
    back: |
      A qualified claim is narrower but just as firm: Most districts should start high school after 8:30. A weak claim is vague: Start times are something to think about. Narrow the claim; do not soften the position.
    topic_code: "4.C"
  - front: Counterargument paragraph → a five-part shape
    back: |
      (1) A topic sentence that names the opposing view; (2) its strongest reason, fairly stated; (3) a concession of what is true in it; (4) the turn and rebuttal; (5) a sentence linking back to the thesis.
    topic_code: "4.C"
  - front: Alternative perspective versus counterargument
    back: |
      A counterargument opposes the claim. An alternative perspective sees the issue differently without simply opposing it (a parent's view, a cost view, a long-term view) and often leads the writer to refine rather than defend the claim.
    topic_code: "4.C"
  - front: Building a concession into the thesis
    back: |
      Begin the thesis with Although or While: Although a later start time complicates bus schedules, districts should adopt it because sleep affects learning more than logistics do. The thesis previews the counterargument paragraph.
    topic_code: "4.B"
  - front: Where to put a counterargument paragraph in a short essay
    back: |
      Usually just before the conclusion, after the main case is made, so the reader's strongest doubt is answered last; or first, when the audience is likely to begin hostile and needs that doubt cleared before listening.
    topic_code: "6.A"
  - front: The Federalist → what it was
    back: |
      Eighty-five essays of 1787 and 1788, most first printed in New York newspapers and all collected in book form in 1788, under the pen name Publius, written by Alexander Hamilton, James Madison and John Jay to urge New Yorkers to ratify the proposed Constitution.
    topic_code: "1.A"
  - front: Federalist No. 10 → author, date and question
    back: |
      James Madison, published November 22, 1787. Its question: can a large republic control the effects of faction better than a small one? Madison argues that it can.
    topic_code: "1.A"
  - front: Federalist No. 10 → its audience and opposition
    back: |
      New York voters, many persuaded by Anti-Federalist writers that a republic could survive only in a small territory where citizens shared interests. Madison has to answer that belief directly.
    topic_code: "1.B"
  - front: Madison's definition of faction
    back: |
      A number of citizens, majority or minority, united by a common passion or interest opposed to the rights of other citizens or to the permanent interests of the community. Defining the term first controls the whole argument.
    topic_code: "5.C"
  - front: Madison's two cures for faction
    back: |
      Remove its causes, or control its effects. Removing the causes would mean either destroying liberty or giving every citizen the same opinions; he rejects both and turns to controlling effects.
    topic_code: "5.A"
  - front: '"worse than the disease" → Madison on the first remedy'
    back: |
      Destroying liberty would end faction, as removing air would put out fire, but the cure would cost more than the illness. Madison concedes the remedy would work and rejects it anyway.
    topic_code: "3.C"
  - front: Madison's air-and-fire analogy → what it proves
    back: |
      Liberty feeds faction as air feeds fire, yet no one would abolish air, which life needs, to stop fires. The analogy grants that liberty causes faction while showing why liberty must stay.
    topic_code: "5.C"
  - front: Madison on the second remedy → why it is impracticable
    back: |
      As long as human reason is fallible and free, people will form different opinions; giving everyone the same opinions, passions and interests is impossible. The remedy fails on practicality, not principle.
    topic_code: "3.A"
  - front: '"cannot certainly be too much admired; but" → the move'
    back: |
      Madison praises the state constitutions warmly and then limits the praise: it would be an unwarrantable partiality to claim they solved the problem of faction. Praise followed by qualification buys credibility.
    topic_code: "3.C"
  - front: '"in some degree true" → Madison''s concession'
    back: |
      He grants that citizens' complaints about unstable, unjust government are partly valid. The qualifier in some degree concedes exactly enough to show candour without granting that the governments are failures.
    topic_code: "3.C"
  - front: '"chiefly, if not wholly" → the qualifier'
    back: |
      Madison attributes the distrust of government chiefly, if not wholly, to faction. The phrase claims as much as he can support while leaving room for other causes, a model of a measured certainty qualifier.
    topic_code: "4.C"
  - front: Madison's "erroneously charged" sentence → what it divides
    back: |
      Some of the country's distresses, he grants, have been wrongly blamed on its governments; but other causes cannot explain the worst of them. He separates the complaints he concedes from those he will build on.
    topic_code: "3.C"
  - front: '"Enlightened statesmen will not always be at the helm." → the rebuttal'
    back: |
      Madison answers the hope that wise leaders can balance clashing interests. The short sentence refutes it with a plain observation about how government actually works over time.
    topic_code: "3.C"
  - front: '"It must be confessed" → Madison''s concession about large republics'
    back: |
      He admits that there is a mean: too many electors leave representatives ignorant of local concerns, too few make them narrow. He concedes a limit to his own preference for size, then shows the Constitution's balance answers it.
    topic_code: "3.C"
  - front: Madison's conclusion in Federalist No. 10
    back: |
      The size and structure of the Union offer a republican remedy for the diseases most common to republican government: in a large republic, more parties and interests make an oppressive majority less likely.
    topic_code: "3.B"
  - front: Publius → why the authors used a pen name
    back: |
      A shared classical pseudonym (after Publius Valerius, a founder of the Roman republic) let three writers speak with one voice and kept attention on the arguments rather than on the authors' reputations.
    topic_code: "1.A"
  - front: Madison's measured tone → three sources of it
    back: |
      Concessions (in some degree true), certainty qualifiers (chiefly, if not wholly) and a candid review of both sides. The tone tells skeptical readers that the writer is weighing evidence, not selling a plan.
    topic_code: "7.A"
  - front: Revision stem → "Which choice most effectively qualifies the claim?"
    back: |
      Look for the option that narrows the claim to what the draft's evidence supports without changing the writer's position. Reject options that keep the absolute, reverse the position or hedge it into vagueness.
    topic_code: "4.C"
  - front: Concession without rebuttal → the risk
    back: |
      A paragraph that grants an objection and stops leaves the reader with the opponent's point as its last word. Every concession needs a turn and an answer, or a qualified claim that absorbs it.
    topic_code: "4.C"

quiz:
  description: |
    22 questions · about 35 minutes · a set of seven questions on the opening of Federalist No. 10, where Madison
    grants and measures before he argues, a set of six revision questions on a student's draft full of absolute
    claims, then questions on qualifiers, concessions and counterargument paragraphs. Multiple choice, select-all
    and true/false items are graded at once; the fill-in-the-blank items are matched automatically; the two short
    answers and the paragraph are graded by your teacher against the model answer and scoring notes.
  questions:
    # ---- Passage set: the opening of Federalist No. 10
    - slug: u09-w31-q01
      type: multiple_choice
      topic_code: "3.C"
      source: 'James Madison, The Federalist No. 10 (1787)'
      points: 1
      stimulus: &fed10_open |
        *The following passage is from the opening of The Federalist No. 10 (1787), by James Madison, writing as Publius in a New York newspaper to urge ratification of the proposed Constitution.*

        AMONG the numerous advantages promised by a well constructed Union, none deserves to be more accurately developed than its tendency to break and control the violence of faction. The friend of popular governments never finds himself so much alarmed for their character and fate, as when he contemplates their propensity to this dangerous vice. He will not fail, therefore, to set a due value on any plan which, without violating the principles to which he is attached, provides a proper cure for it. The instability, injustice, and confusion introduced into the public councils, have, in truth, been the mortal diseases under which popular governments have everywhere perished; as they continue to be the favorite and fruitful topics from which the adversaries to liberty derive their most specious declamations. The valuable improvements made by the American constitutions on the popular models, both ancient and modern, cannot certainly be too much admired; but it would be an unwarrantable partiality, to contend that they have as effectually obviated the danger on this side, as was wished and expected. Complaints are everywhere heard from our most considerate and virtuous citizens, equally the friends of public and private faith, and of public and personal liberty, that our governments are too unstable, that the public good is disregarded in the conflicts of rival parties, and that measures are too often decided, not according to the rules of justice and the rights of the minor party, but by the superior force of an interested and overbearing majority. However anxiously we may wish that these complaints had no foundation, the evidence, of known facts will not permit us to deny that they are in some degree true. It will be found, indeed, on a candid review of our situation, that some of the distresses under which we labor have been erroneously charged on the operation of our governments; but it will be found, at the same time, that other causes will not alone account for many of our heaviest misfortunes; and, particularly, for that prevailing and increasing distrust of public engagements, and alarm for private rights, which are echoed from one end of the continent to the other. These must be chiefly, if not wholly, effects of the unsteadiness and injustice with which a factious spirit has tainted our public administrations.

        By a faction, I understand a number of citizens, whether amounting to a majority or a minority of the whole, who are united and actuated by some common impulse of passion, or of interest, adversed to the rights of other citizens, or to the permanent and aggregate interests of the community.

        [...]

        It could never be more truly said than of the first remedy, that it was worse than the disease. Liberty is to faction what air is to fire, an aliment without which it instantly expires. But it could not be less folly to abolish liberty, which is essential to political life, because it nourishes faction, than it would be to wish the annihilation of air, which is essential to animal life, because it imparts to fire its destructive agency.
      prompt: |
        In the sentence beginning "The valuable improvements made by the American constitutions," the clause after the semicolon has which effect on the praise before it?
      options:
        - |
          It withdraws the praise entirely, revealing that Madison considers the state constitutions failures.
        - |
          It repeats the praise in stronger terms, to flatter readers who helped write those constitutions.
        - |
          It limits the praise, granting the constitutions' merits while denying that they have solved the danger of faction.
        - |
          It shifts the subject from American governments to ancient and modern European ones.
      option_explanations:
        - |
          The praise stands: the improvements "cannot certainly be too much admired." Madison qualifies it rather than retracting it; calling the constitutions failures would contradict his first clause.
        - |
          The clause after the semicolon begins with "but" and speaks of an "unwarrantable partiality," which tempers rather than intensifies the praise.
        - |
          Correct. The first clause praises; the second, turning on *but*, says it would be partial to claim that the constitutions have removed the danger "as was wished and expected." The praise is real but bounded.
        - |
          The ancient and modern "popular models" appear in the first clause as the standard of comparison; the second clause stays with the American constitutions.
      answer: 2
      explanation: |
        Praise-then-limit is a qualification in miniature. It shows a writer fair enough to admire what deserves admiration and honest enough to name what remains undone.

    - slug: u09-w31-q02
      type: multiple_choice
      topic_code: "3.C"
      source: 'James Madison, The Federalist No. 10 (1787)'
      points: 1
      stimulus: *fed10_open
      prompt: |
        In context, the phrase "in some degree true" chiefly serves to
      options:
        - |
          concede that citizens' complaints about unstable and unjust government have some basis, while limiting how much is conceded
        - |
          dismiss the complaints as exaggerations spread by enemies of liberty
        - |
          express Madison's personal uncertainty about whether faction exists
        - |
          introduce statistical evidence about the frequency of unjust laws
      option_explanations:
        - |
          Correct. Madison admits that "the evidence, of known facts" will not let him deny the complaints, but "in some degree" keeps the concession partial. He grants enough to seem candid without conceding that the governments have failed.
        - |
          The complaints come from "our most considerate and virtuous citizens," not from enemies of liberty, and Madison grants rather than dismisses them.
        - |
          Madison is not unsure that faction exists; the paragraph ends by attributing the country's distress "chiefly, if not wholly" to it. The qualifier measures the complaints, not his belief.
        - |
          "Known facts" are mentioned but not counted; the passage offers no numbers.
      answer: 0
      explanation: |
        Skill 3.C: a modifier can calibrate a concession. Notice how much a writer gives away, not just that the writer gives something.

    - slug: u09-w31-q03
      type: multiple_choice
      topic_code: "3.C"
      source: 'James Madison, The Federalist No. 10 (1787)'
      points: 1
      stimulus: *fed10_open
      prompt: |
        The sentence beginning "It will be found, indeed, on a candid review of our situation" is best described as
      options:
        - |
          a refutation of all the citizens' complaints, showing that none of the distresses come from government
        - |
          a digression on the economic causes of the country's misfortunes
        - |
          a restatement of the definition of faction
        - |
          a division of the evidence that grants that some distresses have been wrongly blamed on government while insisting that the most serious ones cannot be explained by other causes
      option_explanations:
        - |
          Madison grants that only "some of the distresses" were "erroneously charged"; he does not clear government of everything, and the next sentence lays the worst on faction.
        - |
          The sentence names "other causes" only to say that they "will not alone account" for the misfortunes; it keeps the focus on faction rather than wandering to economics.
        - |
          The definition comes in the next paragraph ("By a faction, I understand"); this sentence weighs evidence about the country's troubles.
        - |
          Correct. The parallel "it will be found... but it will be found, at the same time" splits the complaints into those Madison concedes are misplaced and those he will build his argument on. A "candid review" is a fair look at both.
      answer: 3
      explanation: |
        A writer can qualify by sorting: granting the weaker part of a body of evidence to the other side so that the stronger part carries more weight.

    - slug: u09-w31-q04
      type: multiple_choice
      topic_code: "7.A"
      source: 'James Madison, The Federalist No. 10 (1787)'
      points: 1
      stimulus: *fed10_open
      prompt: |
        Phrases such as "in some degree true," "on a candid review" and "chiefly, if not wholly" contribute most to a tone that is
      options:
        - |
          anxious and fearful, suggesting that the Union is about to collapse
        - |
          measured and judicious, suggesting a writer who weighs evidence before he concludes
        - |
          sarcastic, mocking the citizens who complain about their governments
        - |
          detached and indifferent to the outcome of the debate
      option_explanations:
        - |
          Madison names "mortal diseases," but the qualifiers do the opposite of raising alarm: they measure and limit claims.
        - |
          Correct. Each phrase limits a claim to what the evidence supports. Together they build the voice of a fair judge, which is persuasive to readers suspicious of the Constitution's partisans.
        - |
          The complainers are called "our most considerate and virtuous citizens"; nothing mocks them.
        - |
          Madison is plainly invested: the essay argues for a "proper cure." Measured is not the same as indifferent.
      answer: 1
      explanation: |
        Skill 7.A: qualifiers are word choices, and they set tone. A writer who claims exactly what he can support sounds trustworthy.

    - slug: u09-w31-q05
      type: multiple_choice
      topic_code: "5.C"
      source: 'James Madison, The Federalist No. 10 (1787)'
      points: 1
      stimulus: *fed10_open
      prompt: |
        The paragraph beginning "By a faction, I understand" uses which method of development, and to what end?
      options:
        - |
          Definition, to fix the meaning of a contested term so that the rest of the argument rests on Madison's sense of it
        - |
          Narration, to tell the story of a particular faction in a particular state
        - |
          Classification, to sort citizens into economic classes
        - |
          Comparison, to show that factions in America resemble those in Europe
      option_explanations:
        - |
          Correct. Madison defines faction by what unites its members (passion or interest) and by what makes it dangerous (opposition to others' rights or the community's interests). Note that he includes majorities, which matters for his later argument.
        - |
          No story or event is told; the paragraph is a single general statement of meaning.
        - |
          Classification of interests (landed, manufacturing, mercantile) comes later in the essay. This paragraph defines one term.
        - |
          Nothing is compared to Europe here; the paragraph says what Madison means by a word.
      answer: 0
      explanation: |
        Skill 5.C: definition is a method of development. Defining a term in your own way is also a quiet form of qualification, because it sets the limits of what your claim covers.

    - slug: u09-w31-q06
      type: multi_select
      topic_code: "3.C"
      source: 'James Madison, The Federalist No. 10 (1787)'
      points: 2
      partial_credit: true
      stimulus: *fed10_open
      prompt: |
        Which TWO phrases from the passage qualify a claim by limiting its scope or certainty? Select two.
      options:
        - |
          "in some degree true"
        - |
          "chiefly, if not wholly"
        - |
          "Liberty is to faction what air is to fire"
        - |
          "the mortal diseases under which popular governments have everywhere perished"
      option_explanations:
        - |
          Correct. "In some degree" limits how far Madison grants that the complaints are valid.
        - |
          Correct. "Chiefly, if not wholly" claims faction as the main cause of distrust while leaving room for others: a certainty qualifier.
        - |
          This is an analogy that explains why liberty feeds faction; it supports a claim rather than limiting one.
        - |
          The phrase is emphatic, not qualified; "everywhere" pushes toward an absolute rather than away from one.
      answer: [0, 1]
      explanation: |
        Distinguish qualifiers (words that limit a claim) from devices that support or intensify it. Both appear in the same paragraph.

    - slug: u09-w31-q07
      type: true_false
      topic_code: "3.C"
      source: 'James Madison, The Federalist No. 10 (1787)'
      points: 1
      stimulus: *fed10_open
      prompt: |
        True or false: Madison rejects the first remedy, destroying liberty, because he believes it would fail to end faction.
      answer: false
      explanation: |
        False. Madison concedes that the remedy would work: without liberty, faction "instantly expires," as fire does without air. He rejects it because it is worse than the disease, since liberty is as essential to political life as air is to animal life. This is a concession of effectiveness followed by a rebuttal on cost.

    # ---- Revision set: a student's draft on a pedestrian plaza
    - slug: u09-w31-q08
      type: multiple_choice
      topic_code: "4.C"
      source: written for this course
      points: 1
      stimulus: &w31_plaza_draft |
        *The following is a draft of a student's argument, written as a letter to the city council, about whether to close three blocks of Main Street to cars and turn them into a pedestrian plaza.*

        (1) Turning Main Street into a pedestrian plaza would solve every problem downtown faces. (2) Cities that have closed streets to cars always see business boom within a year. (3) When a city in our region closed four blocks of its central avenue to cars, foot traffic on those blocks rose by about a third in two years, according to that city's own counts. (4) Shop owners worry that customers who drive will stop coming. (5) That worry is understandable, since many older residents cannot walk long distances from a parking space. (6) A free shuttle from the Fourth Street garage, running every ten minutes, would bring those customers to the door. (7) Everyone who visits downtown would be happier without traffic. (8) The council should approve a one-year trial of the plaza this spring.
      prompt: |
        The writer wants to revise sentence 1 so that it makes a claim the letter can defend. Which version best accomplishes this goal?
      options:
        - |
          Turning Main Street into a pedestrian plaza might perhaps be something that could possibly help downtown.
        - |
          Turning Main Street into a pedestrian plaza is an idea that many people have discussed.
        - |
          Turning Main Street into a pedestrian plaza would be a terrible mistake for downtown.
        - |
          Turning Main Street into a pedestrian plaza would ease two of downtown's most persistent problems: congestion and a shortage of shoppers on foot.
      option_explanations:
        - |
          Stacked hedges (might, perhaps, could, possibly) leave a claim too weak to argue; over-hedging is the opposite error from the absolute in the original.
        - |
          This replaces the claim with a fact about discussion, so the letter would have no position to defend.
        - |
          This reverses the writer's position; qualifying a claim adjusts its scope, it does not switch sides.
        - |
          Correct. The revision replaces "every problem" with two named problems that sentence 3's evidence (foot traffic) and the plaza itself (no cars) can actually address.
      answer: 3
      explanation: |
        Skill 4.C: qualify by narrowing scope to match evidence. The claim stays firm (would ease) but now claims only what the letter can prove.

    - slug: u09-w31-q09
      type: multiple_choice
      topic_code: "4.C"
      source: written for this course
      points: 1
      stimulus: *w31_plaza_draft
      prompt: |
        The writer wants to revise sentence 2 so that it is consistent with the evidence in sentence 3. Which version best accomplishes this goal?
      options:
        - |
          Cities that have closed streets to cars never regret it.
        - |
          Some cities that have closed streets to cars have seen more people walking, and more potential customers, within a few years.
        - |
          Closing streets to cars is popular in many places.
        - |
          Every city that has closed a street to cars has seen business boom within a year.
      option_explanations:
        - |
          "Never" is as absolute as "always," and sentence 3 says nothing about regret, so the revision is still unsupported.
        - |
          Correct. Sentence 3 reports one city's rise in foot traffic over two years. The revision limits scope (some cities), timing (a few years) and the claimed effect (more people walking, not a business boom).
        - |
          Popularity is a different claim from the one sentence 3 supports, and it says nothing about business or foot traffic.
        - |
          "Every city" restates the original absolute more emphatically; one city's counts cannot support it.
      answer: 1
      explanation: |
        Match the claim to the evidence on three axes: how many cases, how soon, and how large an effect. Sentence 2 overstates all three.

    - slug: u09-w31-q10
      type: multiple_choice
      topic_code: "6.B"
      source: written for this course
      points: 1
      stimulus: *w31_plaza_draft
      prompt: |
        The writer wants to add a word or phrase at the beginning of sentence 6 that signals the turn from the concession in sentence 5 to the writer's response. Which choice best accomplishes this goal?
      options:
        - |
          Even so,
        - |
          For example,
        - |
          Likewise,
        - |
          In conclusion,
      option_explanations:
        - |
          Correct. "Even so" marks that the writer has granted the worry and is now answering it; the reader sees concession and rebuttal as a pair.
        - |
          The shuttle is not an example of older residents' difficulty walking; it is a solution to it, so an example signal misstates the relationship.
        - |
          "Likewise" signals a parallel point, but sentence 6 answers sentence 5 rather than adding a similar idea.
        - |
          Sentence 6 is in the middle of the letter and proposes a new idea; it is not a conclusion.
      answer: 0
      explanation: |
        Skill 6.B: after a concession, a turn signal (even so, still, nevertheless) tells readers that the writer's own view is coming back.

    - slug: u09-w31-q11
      type: multiple_choice
      topic_code: "4.C"
      source: written for this course
      points: 1
      stimulus: *w31_plaza_draft
      prompt: |
        The writer is considering deleting sentence 7. Should the writer make this deletion?
      options:
        - |
          No, because it is the letter's strongest piece of evidence.
        - |
          No, because it answers the shop owners' concern in sentence 4.
        - |
          Yes, because it makes a sweeping claim about everyone that the letter cannot support and that readers who like to drive downtown would reject.
        - |
          Yes, because it repeats the information in sentence 3.
      option_explanations:
        - |
          Sentence 7 offers no evidence at all; it is an unsupported generalisation about everyone's feelings.
        - |
          The shop owners' concern is answered in sentences 5 and 6 (concession and shuttle); sentence 7 does not address customers who drive.
        - |
          Correct. "Everyone" is an absolute that one unhappy visitor disproves, and it alienates the very readers the shuttle sentence tried to win over. Deleting it makes the letter more credible.
        - |
          Sentence 3 reports foot-traffic counts from another city; sentence 7 makes a claim about happiness. They do not repeat each other.
      answer: 2
      explanation: |
        Keep-or-delete questions turn on function. An absolute claim that undercuts the writer's credibility does more harm than good.

    - slug: u09-w31-q12
      type: multiple_choice
      topic_code: "4.C"
      source: written for this course
      points: 1
      stimulus: *w31_plaza_draft
      prompt: |
        The writer wants to add a sentence after sentence 6 that acknowledges an alternative perspective and refines the proposal in response to it. Which choice best accomplishes this goal?
      options:
        - |
          The shuttle would be painted in the city's colours.
        - |
          Shop owners who complain about change are standing in the way of progress.
        - |
          Many people enjoy walking, especially in good weather.
        - |
          Shops on the plaza would still need deliveries, so the plan should allow delivery vans onto the blocks before ten each morning.
      option_explanations:
        - |
          The shuttle's colour is irrelevant detail; it raises no perspective and refines nothing.
        - |
          This attacks the shop owners instead of addressing a perspective; it would undo the goodwill the concession in sentence 5 created.
        - |
