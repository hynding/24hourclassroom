  - slug: u09-exam-q24
    type: short_answer
    topic_code: "3.C"
    source: 'Abraham Lincoln, reply at Alton, Lincoln–Douglas debates (1858)'
    points: 2
    stimulus: *ex_alton
    prompt: |
      In two or three sentences, explain how the story of Frank Blair and Gratz Brown functions as evidence in Lincoln's rebuttal of the listener who says he would favour gradual emancipation.
    answer: |
      The listener claims he would welcome gradual emancipation if a slave state adopted it. Blair and Brown tried exactly that in Missouri, and when they lost, the same Democrats cheered, so the episode is a real test of the claim, and the claim fails it. The story turns Lincoln's charge of self-deception from an accusation into a demonstration.
    explanation: |
      1 point: identifies the listener's claim and the Missouri episode as a test of it. 1 point: explains that the Democrats' reaction contradicts the professed view, so the evidence refutes the claim (or shows self-deception). A response that only retells the episode earns at most 1.

