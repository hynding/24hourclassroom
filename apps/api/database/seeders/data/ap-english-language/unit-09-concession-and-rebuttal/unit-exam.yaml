  - slug: u09-exam-q25
    type: multiple_choice
    topic_code: "4.B"
    source: written for this course
    points: 1
    stimulus: &ex_lunch_draft |
      *The following is a draft of a student's argument essay for the school newspaper about whether juniors and seniors should be allowed to leave campus for lunch.*

      (1) Every day at 11:40, the lunch line at our school stretches past the trophy case and out the cafeteria doors. (2) Juniors and seniors should be allowed to leave campus for lunch. (3) An open campus would shorten the line for everyone who stays. (4) It would also give older students practice in managing their own time before they leave for college or work. (5) A student council survey of 210 juniors and seniors found that 74 percent would leave campus at least twice a week if they could. (6) Administrators worry that students will come back late to fifth period. (7) That will never happen. (8) Students who return late could lose the privilege for two weeks, a rule that many schools with open campuses use. (9) Others argue that it is unsafe for students to cross Route 9 at noon. (10) The crosswalk at Oak Street have a signal, and students could be required to use it. (11) An open campus is the only fair policy. (12) Students who have earned their teachers' trust deserve the chance to show it.
    prompt: |
      The writer wants to revise sentence 2 so that it states the thesis and previews the reasons the essay develops. Which version best accomplishes this goal?
    options:
      - |
        Lunch is an important part of the school day for juniors and seniors.
      - |
        Some schools let students leave campus for lunch, and some do not.
      - |
        Juniors and seniors should be allowed to leave campus for lunch because it would be nice.
      - |
        Because an open campus would shorten the lunch line and teach older students to manage their own time, juniors and seniors should be allowed to leave campus for lunch.
    option_explanations:
      - |
        This is a general statement no one would dispute; it takes no position on an open campus.
      - |
        A neutral fact about other schools is not a thesis; it commits the essay to nothing.
      - |
        "Because it would be nice" gives a vague reason that the essay never develops; it previews nothing in sentences 3 and 4.
      - |
        Correct. Skill 4.B: the revision keeps the claim and names the two reasons that sentences 3 and 4 introduce, so the reader can follow the line of reasoning.
    answer: 3
    explanation: |
      A thesis that previews its reasons doubles as a map. Check that each reason it names is actually developed.

