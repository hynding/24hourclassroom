  - slug: u09-exam-q41
    type: short_answer
    topic_code: "3.C"
    source: 'John Stuart Mill, On Liberty (1859); Alexander Hamilton, The Federalist No. 84 (1788)'
    points: 3
    prompt: |
      Mill and Hamilton both answer objections at length, but they treat their opponents very differently. In three or four sentences, contrast how each presents the opposing view (consider word choice and how fully each states the other side), and explain which approach you think is more persuasive to a skeptical reader, and why.
    answer: |
      Mill states his opponents' case at full strength and in their own voice, even giving them a maxim and rhetorical questions, before answering in a single sentence. Hamilton describes his opponents as "intemperate partisans" and their arguments as "declamations," framing the demand for a bill of rights as passion before he answers it. Mill's approach is more persuasive to a skeptical reader, because a reader who holds the opposing view recognises it fairly stated and so must take the rebuttal seriously, whereas Hamilton's diction may make that reader defensive. Hamilton's approach may work better with readers already on his side, who enjoy seeing the opposition belittled.
    explanation: |
      1 point: accurately describes Mill's fair, full statement of the other side. 1 point: accurately describes Hamilton's dismissive diction or brief characterisation of opponents, with a specific word or detail. 1 point: makes a reasoned judgment about persuasiveness tied to the audience (either side may be argued if the reasoning is sound).

  - slug: u09-exam-q42
