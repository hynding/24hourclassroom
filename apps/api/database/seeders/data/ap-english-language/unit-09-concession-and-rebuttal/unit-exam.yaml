    prompt: |
      Write a qualified thesis (one sentence) on whether high schools should require a course in personal finance. Then write two sentences that state the strongest objection to your thesis and answer it with a concession and a rebuttal.
    answer: |
      Model: Although schedules are already crowded, high schools should require a one-semester personal finance course, because most students will sign a loan or lease before they take any course that explains one. Critics argue that a new requirement would crowd out electives such as art and music that keep many students engaged. That is a real cost, but the course can replace part of the existing economics requirement rather than adding a new one, so electives would not shrink.
    explanation: |
      1 point: the thesis takes a clear position and includes at least one meaningful qualifier (concession clause, condition or limit of scope) without hedging into vagueness. 1 point: the objection is specific and fairly stated. 1 point: the response concedes something real and turns to a specific rebuttal (not a dismissal).

