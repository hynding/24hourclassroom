unit: 9
description: |
  44 questions · about 95 minutes · both skills of Unit 9 (explaining how claims are qualified, 3.C, and qualifying
  your own, 4.C), with the earlier skills they depend on. Four passage sets: a passage you have not studied,
  Alexander Hamilton's answer to the objection that the Constitution lacked a bill of rights (The Federalist No. 84,
  1788); a new passage from chapter 2 of Mill's On Liberty on the manners of controversy; a new passage from
  Lincoln's reply at Alton (1858); and a revision set on a student's draft. Then ten questions across the unit,
  including two short written responses, and an AP-style argument essay. Multiple choice, select-all and
  true/false items are graded at once; fill-in-the-blank items are matched automatically; the short responses and
  the essay are graded by your teacher against the model answers and the 6-point AP rubric.
questions:
  # ---- Set A: an unseen passage, Hamilton on the bill of rights (The Federalist No. 84)
  - slug: u09-exam-q01
    type: multiple_choice
    topic_code: "3.C"
    source: 'Alexander Hamilton, The Federalist No. 84 (1788)'
    points: 1
    stimulus: &ex_fed84 |
      *The following passages are from The Federalist No. 84 (1788), by Alexander Hamilton, writing as Publius to the people of New York near the end of the ratification debate. Opponents of the proposed Constitution objected that it contained no bill of rights. (A Bill of Rights was in fact added as amendments in 1791.)*

      The most considerable of the remaining objections is that the plan of the convention contains no bill of rights. Among other answers given to this, it has been upon different occasions remarked that the constitutions of several of the States are in a similar predicament. I add that New York is of the number. And yet the opposers of the new system, in this State, who profess an unlimited admiration for its constitution, are among the most intemperate partisans of a bill of rights. To justify their zeal in this matter, they allege two things: one is that, though the constitution of New York has no bill of rights prefixed to it, yet it contains, in the body of it, various provisions in favor of particular privileges and rights, which, in substance amount to the same thing; the other is, that the Constitution adopts, in their full extent, the common and statute law of Great Britain, by which many other rights, not expressed in it, are equally secured.

      To the first I answer, that the Constitution proposed by the convention contains, as well as the constitution of this State, a number of such provisions.

      [...]

      I go further, and affirm that bills of rights, in the sense and to the extent in which they are contended for, are not only unnecessary in the proposed Constitution, but would even be dangerous. They would contain various exceptions to powers not granted; and, on this very account, would afford a colorable pretext to claim more than were granted. For why declare that things shall not be done which there is no power to do? Why, for instance, should it be said that the liberty of the press shall not be restrained, when no power is given by which restrictions may be imposed? I will not contend that such a provision would confer a regulating power; but it is evident that it would furnish, to men disposed to usurp, a plausible pretense for claiming that power. They might urge with a semblance of reason, that the Constitution ought not to be charged with the absurdity of providing against the abuse of an authority which was not given, and that the provision against restraining the liberty of the press afforded a clear implication, that a power to prescribe proper regulations concerning it was intended to be vested in the national government. This may serve as a specimen of the numerous handles which would be given to the doctrine of constructive powers, by the indulgence of an injudicious zeal for bills of rights.

      [...]

      There remains but one other view of this matter to conclude the point. The truth is, after all the declamations we have heard, that the Constitution is itself, in every rational sense, and to every useful purpose, A BILL OF RIGHTS.
    prompt: |
      In the first paragraph, Hamilton's observation that New York's own constitution has no bill of rights chiefly serves to
    options:
      - |
        expose an inconsistency in his New York opponents, who admire a state constitution that lacks the very feature they demand of the national one
      - |
        concede that New York's constitution is inferior to the proposed Constitution
      - |
        argue that New York should immediately add a bill of rights to its own constitution
      - |
        show that Hamilton himself has always opposed the New York constitution
    option_explanations:
      - |
        Correct. Hamilton points out that "the opposers of the new system, in this State, who profess an unlimited admiration for its constitution" are the loudest in demanding a bill of rights. Their own standard, applied evenly, would condemn the constitution they admire.
      - |
        Hamilton does not rank the two constitutions here; he uses the state constitution to show that his opponents apply a double standard.
      - |
        Hamilton proposes no change to New York's constitution; his point concerns the opponents' reasoning, not a reform.
      - |
        Nothing in the passage reveals Hamilton's own view of the state constitution; he refers to his opponents' "unlimited admiration" for it.
    answer: 0
    explanation: |
      Pointing out that opponents do not hold themselves to the standard they demand is a form of rebuttal. It does not prove the objection wrong, but it weakens its force with the audience the opponents claim to speak for.

  - slug: u09-exam-q02
    type: multiple_choice
    topic_code: "3.C"
    source: 'Alexander Hamilton, The Federalist No. 84 (1788)'
    points: 1
    stimulus: *ex_fed84
    prompt: |
      The sentence "To the first I answer, that the Constitution proposed by the convention contains, as well as the constitution of this State, a number of such provisions" is best described as a rebuttal that
    options:
      - |
        attacks the motives of the people who made the objection
      - |
        concedes that the opponents' first defence of the state constitution is correct and abandons the point
      - |
        answers the opponents' defence with counter-evidence: whatever is true of the state constitution is also true of the national one
      - |
        reframes the debate as a question about British law
    option_explanations:
      - |
        The sentence says nothing about anyone's motives; it compares the contents of two constitutions.
      - |
        Hamilton accepts the opponents' description of the state constitution but turns it to his own advantage; he does not abandon the point.
      - |
        Correct. The opponents defended New York's constitution by saying its body contains protections for rights. Hamilton replies that the proposed Constitution does too, so their defence cannot distinguish the two. In the full essay he goes on to list those provisions.
      - |
        British law is the opponents' second defence, which Hamilton takes up separately; this sentence answers only "the first."
    answer: 2
    explanation: |
      A rebuttal by counter-evidence meets a factual claim with facts. Here the facts are the Constitution's own provisions.

  - slug: u09-exam-q03
    type: multiple_choice
    topic_code: "3.C"
    source: 'Alexander Hamilton, The Federalist No. 84 (1788)'
    points: 1
    stimulus: *ex_fed84
    prompt: |
      The sentence beginning "I go further, and affirm" marks a shift from
    options:
      - |
        concession to surrender, as Hamilton grants the opponents' whole case
      - |
        rebutting the objection (a bill of rights is unnecessary) to making a counterclaim (a bill of rights would be dangerous)
      - |
        abstract principle to personal anecdote
      - |
        Hamilton's own voice to the voice of his opponents
    option_explanations:
      - |
        The phrase I go further intensifies rather than surrenders; the sentence calls bills of rights "not only unnecessary in the proposed Constitution, but would even be dangerous."
      - |
        Correct. Up to this point Hamilton has argued that the Constitution does not need a bill of rights. Now he goes beyond defence and argues that one would do harm, turning the objection's remedy into a danger.
      - |
        The paragraph that follows reasons from the example of press freedom and constitutional interpretation, not from Hamilton's personal experience.
      - |
        The sentence is emphatically Hamilton's ("I go further, and affirm"); his opponents' voice appears only in reported form.
    answer: 1
    explanation: |
      Rebuttal defends; counterclaim attacks. A writer who can show that the opponent's remedy is harmful as well as unnecessary has moved from answering an objection to reversing it.

  - slug: u09-exam-q04
    type: multiple_choice
    topic_code: "3.C"
    source: 'Alexander Hamilton, The Federalist No. 84 (1788)'
    points: 1
    stimulus: *ex_fed84
    prompt: |
      In the sentence "I will not contend that such a provision would confer a regulating power; but it is evident that it would furnish, to men disposed to usurp, a plausible pretense for claiming that power," Hamilton
    options:
      - |
        withdraws his claim that bills of rights would be dangerous
      - |
        admits that he does not understand how a bill of rights would work
      - |
        argues that a bill of rights would directly give the national government power over the press
      - |
        qualifies his claim by conceding the stronger version he cannot defend, then asserting a narrower danger: not a grant of power, but a pretext for claiming one
    option_explanations:
      - |
        The danger claim stands; the "but" clause restates it in a narrower, more defensible form.
      - |
        Hamilton shows a precise understanding of how a provision might be interpreted; he is limiting his claim, not confessing confusion.
      - |
        This is exactly the claim Hamilton declines to make ("I will not contend that such a provision would confer a regulating power").
      - |
        Correct. Hamilton anticipates the reply that a prohibition cannot grant power and concedes it. His claim becomes that a prohibition would hand ambitious officials an argument, which is harder to refute.
    answer: 3
    explanation: |
      Skill 3.C: a writer qualifies a claim by giving up its most attackable form. The narrower claim survives the objection the broader one would not.

  - slug: u09-exam-q05
    type: multiple_choice
    topic_code: "5.A"
    source: 'Alexander Hamilton, The Federalist No. 84 (1788)'
    points: 1
    stimulus: *ex_fed84
    prompt: |
      The two rhetorical questions in the third paragraph ("For why declare that things shall not be done which there is no power to do?" and the question about the liberty of the press) function in Hamilton's line of reasoning primarily to
    options:
      - |
        present the premise of his danger argument (that a limit on a power not granted implies the power exists) as so obvious it needs no answer
      - |
        express genuine uncertainty about why the convention omitted a bill of rights
      - |
        invite readers to suggest amendments to the Constitution
      - |
        change the subject from rights to the freedom of the press alone
    option_explanations:
      - |
        Correct. The questions carry the step on which the whole paragraph depends: declaring that something shall not be done implies that it otherwise could be. Phrased as questions, the step seems self-evident, and the paragraph then shows how usurpers might exploit it.
      - |
        Hamilton is not uncertain; the questions are rhetorical and lead directly to his conclusion about "a plausible pretense."
      - |
        The questions argue against adding provisions; they do not invite amendments.
      - |
        The press is offered "for instance," as one example of the general point; Hamilton returns to bills of rights as a whole at the end of the paragraph.
    answer: 0
    explanation: |
      Skill 5.A: find the step a line of reasoning cannot do without. Writers often put that step in a rhetorical question, which is exactly where a careful reader should push back.

  - slug: u09-exam-q06
    type: multiple_choice
    topic_code: "7.A"
    source: 'Alexander Hamilton, The Federalist No. 84 (1788)'
    points: 1
    stimulus: *ex_fed84
    prompt: |
      Hamilton describes his opponents as "the most intemperate partisans of a bill of rights" and refers to their "zeal" and to "the declamations we have heard." This diction conveys an attitude toward the opponents that is best described as
    options:
      - |
        patient and generous, like Mill's toward the advocates of suppression
      - |
        fearful, because the opponents are likely to win
      - |
        impatient and dismissive, characterising the demand for a bill of rights as passion rather than reason
      - |
        neutral, recording the opponents' views without judgment
    option_explanations:
      - |
        Mill states his opponents' case at length in their own strongest terms; Hamilton's words "intemperate," "zeal" and "declamations" do the opposite, belittling the opponents' case as emotional.
      - |
        Nothing in the diction suggests fear; the tone is confident, even scornful.
      - |
        Correct. Each word frames the other side as heated or rhetorical: intemperate partisans, zeal, declamations. The diction undercuts the objection before the arguments answer it.
      - |
        "Intemperate" and "declamations" are judgments; a neutral account would describe the objection without such words.
    answer: 2
    explanation: |
      Skill 7.A: diction reveals attitude. Comparing Hamilton with Mill shows two ways to treat an opponent, and invites the question of which persuades a skeptical reader more.

  - slug: u09-exam-q07
    type: multiple_choice
    topic_code: "3.B"
    source: 'Alexander Hamilton, The Federalist No. 84 (1788)'
    points: 1
    stimulus: *ex_fed84
    prompt: |
      Hamilton's final claim, that "the Constitution is itself, in every rational sense, and to every useful purpose, A BILL OF RIGHTS," functions primarily as
    options:
      - |
        a concession that the opponents were right to demand a separate bill of rights
      - |
        a reframing of the objection: the document the opponents say lacks a bill of rights is itself one, so the demand rests on a misunderstanding
      - |
        a qualification limiting his argument to the press
      - |
        a summary of the opponents' second defence, concerning British law
    option_explanations:
      - |
        The claim answers the demand by saying it is already met; it concedes nothing to the call for a separate document.
      - |
        Correct. Skill 3.B: Hamilton ends with an overarching claim that redefines the term at issue. If the whole Constitution protects rights by limiting and structuring power, the objection that it "contains no bill of rights" dissolves.
      - |
        "In every rational sense, and to every useful purpose" extends rather than limits the claim; it is not about the press alone.
      - |
        The opponents' second defence concerned British common and statute law; this sentence is Hamilton's own concluding view.
    answer: 1
    explanation: |
      Reframing changes what the dispute is about. Capital letters mark the phrase as the essay's last word on the objection.

  - slug: u09-exam-q08
    type: multi_select
    topic_code: "3.C"
    source: 'Alexander Hamilton, The Federalist No. 84 (1788)'
    points: 2
    partial_credit: true
    stimulus: *ex_fed84
    prompt: |
      Which TWO kinds of rebuttal does Hamilton use in the passage? Select two.
    options:
      - |
        Pointing out that his opponents do not apply their own standard consistently
      - |
        Counter-evidence about what the proposed Constitution actually contains
      - |
        Statistics on the number of rights violations in states without bills of rights
      - |
        A personal anecdote from Hamilton's service at the Constitutional Convention
    option_explanations:
      - |
        Correct. The opponents admire a New York constitution that has no bill of rights while demanding one in the national Constitution.
      - |
        Correct. "To the first I answer" that the Constitution contains "a number of such provisions," meeting the opponents' claim with facts about the document.
      - |
        No statistics appear; Hamilton argues from the texts of constitutions and from principle.
      - |
        Hamilton tells no story about the convention; he refers to it only as the source of the plan.
    answer: [0, 1]
    explanation: |
      Name the kind of rebuttal before judging it. Hamilton's essay also exposes an assumption (that rights need a separate list) and reframes the issue at the end.

  - slug: u09-exam-q09
    type: true_false
    topic_code: "3.C"
    source: 'Alexander Hamilton, The Federalist No. 84 (1788)'
    points: 1
    stimulus: *ex_fed84
    prompt: |
      True or false: Hamilton argues that a provision protecting the liberty of the press would itself give the national government a power to regulate the press.
    answer: false
    explanation: |
      False. Hamilton expressly declines that claim ("I will not contend that such a provision would confer a regulating power"). His narrower claim is that the provision would give men disposed to usurp "a plausible pretense" for claiming such a power.

  # ---- Set B: Mill on the manners of controversy (On Liberty, chapter 2)
  - slug: u09-exam-q10
    type: multiple_choice
    topic_code: "3.C"
    source: 'John Stuart Mill, On Liberty (1859)'
    points: 1
    stimulus: &ex_mill_manner |
      *The following passages are from the end of chapter 2 of John Stuart Mill's On Liberty (1859). In the omitted portion Mill discusses invective and sarcasm, which he says are tolerated when used for the prevailing opinion and condemned when used against it; "either" in the second paragraph refers to these two uses.*

      Before quitting the subject of freedom of opinion, it is fit to take some notice of those who say, that the free expression of all opinions should be permitted, on condition that the manner be temperate, and do not pass the bounds of fair discussion. Much might be said on the impossibility of fixing where these supposed bounds are to be placed; for if the test be offence to those whose opinion is attacked, I think experience testifies that this offence is given whenever the attack is telling and powerful, and that every opponent who pushes them hard, and whom they find it difficult to answer, appears to them, if he shows any strong feeling on the subject, an intemperate opponent. But this, though an important consideration in a practical point of view, merges in a more fundamental objection. Undoubtedly the manner of asserting an opinion, even though it be a true one, may be very objectionable, and may justly incur severe censure. But the principal offences of the kind are such as it is mostly impossible, unless by accidental self-betrayal, to bring home to conviction. The gravest of them is, to argue sophistically, to suppress facts or arguments, to misstate the elements of the case, or misrepresent the opposite opinion.

      [...]

      It is, however, obvious that law and authority have no business with restraining either, while opinion ought, in every instance, to determine its verdict by the circumstances of the individual case; condemning every one, on whichever side of the argument he places himself, in whose mode of advocacy either want of candour, or malignity, bigotry, or intolerance of feeling manifest themselves; but not inferring these vices from the side which a person takes, though it be the contrary side of the question to our own: and giving merited honour to every one, whatever opinion he may hold, who has calmness to see and honesty to state what his opponents and their opinions really are, exaggerating nothing to their discredit, keeping nothing back which tells, or can be supposed to tell, in their favour. This is the real morality of public discussion; and if often violated, I am happy to think that there are many controversialists who to a great extent observe it, and a still greater number who conscientiously strive towards it.
    prompt: |
      The people Mill takes notice of in the first sentence hold a position that is best described as
    options:
      - |
        an absolute rejection of free expression
      - |
        a demand that all opinions be expressed as forcefully as possible
      - |
        a belief that only true opinions should be expressed
      - |
        a qualified endorsement of free expression: all opinions may be expressed on condition that the manner be temperate
    option_explanations:
      - |
        They favour "the free expression of all opinions"; their view is a qualified yes, not a no.
      - |
        They want the opposite: expression kept within "the bounds of fair discussion."
      - |
        They would permit "all opinions," true or false; their condition concerns manner, not truth.
      - |
        Correct. The conditional clause ("on condition that the manner be temperate") is the qualification. Mill's task is to answer a position close to his own, which is harder than answering a flat opponent.
    answer: 3
    explanation: |
      Skill 3.C: notice when the view being answered is itself qualified. Mill must explain why the condition is unworkable, not why free expression is good.

  - slug: u09-exam-q11
    type: multiple_choice
    topic_code: "3.C"
    source: 'John Stuart Mill, On Liberty (1859)'
    points: 1
    stimulus: *ex_mill_manner
    prompt: |
      The sentence "Undoubtedly the manner of asserting an opinion, even though it be a true one, may be very objectionable, and may justly incur severe censure" functions as
    options:
      - |
        a concession to the people who want discussion kept temperate, granting that manner can be genuinely wrong
      - |
        Mill's thesis for the whole chapter
      - |
        a refutation proving that manner never matters
      - |
        an example of the invective Mill condemns
    option_explanations:
      - |
        Correct. *Undoubtedly* signals a concession: Mill agrees that the manner of argument can deserve censure. The *But* that follows turns to why such offences cannot be policed.
      - |
        The chapter's thesis concerns the harm of silencing opinion; this sentence grants a limited point near its end.
      - |
        The sentence says the opposite of *manner never matters*; it grants that manner may "justly incur severe censure."
      - |
        The sentence is measured and calm; it is about invective, not an instance of it.
    answer: 0
    explanation: |
      Concession signals such as undoubtedly, admittedly and granted mark where a writer gives ground. Read on to the turn to see what the concession is for.

  - slug: u09-exam-q12
    type: multiple_choice
    topic_code: "3.A"
    source: 'John Stuart Mill, On Liberty (1859)'
    points: 1
    stimulus: *ex_mill_manner
    prompt: |
      Mill's claim that the label "intemperate" is applied to "every opponent who pushes them hard, and whom they find it difficult to answer" rests chiefly on which kind of support?
    options:
      - |
        A legal precedent from a named court case
      - |
        Statistics about complaints against public speakers
      - |
        An appeal to general experience ("I think experience testifies"), which readers are invited to test against their own
      - |
        The testimony of a famous orator
    option_explanations:
      - |
        No court or case is named in the passage; Mill's support here is not legal.
      - |
        The passage contains no numbers or counts of any kind; Mill's support is general, not quantitative.
      - |
        Correct. Mill grounds the claim in what "experience testifies," a kind of evidence readers can check against their own memory of arguments in which the side losing called the winner rude.
      - |
        No orator is quoted here; the only authority is shared experience.
    answer: 2
    explanation: |
      Skill 3.A: identify what a claim rests on. Appeals to common experience persuade when readers recognise the pattern, and they are vulnerable when readers do not.

  - slug: u09-exam-q13
    type: multiple_choice
    topic_code: "7.B"
    source: 'John Stuart Mill, On Liberty (1859)'
    points: 1
    stimulus: *ex_mill_manner
    prompt: |
      The long sentence beginning "It is, however, obvious" is organised around a series of participial phrases: "condemning every one...," "but not inferring these vices...," and "giving merited honour to every one...." This structure serves chiefly to
    options:
      - |
        confuse the reader so that the conclusion seems more profound
      - |
        set out, in parallel form, the separate duties of public opinion, so that each judgment (condemn, do not infer, honour) is weighed by the same standard regardless of side
      - |
        list the punishments the law should impose on intemperate speakers
      - |
        shift from Mill's own view to that of his opponents
    option_explanations:
      - |
        The parallel phrases make a long sentence easier to follow, not harder; each begins with a participle that names one duty.
      - |
        Correct. Skill 7.B: the parallel phrases depend on "opinion ought... to determine its verdict," and each names one part of that verdict. The repeated "every one" and "whichever side" make even-handedness the sentence's point.
      - |
        The sentence begins by saying that "law and authority have no business with restraining either"; it describes the verdicts of opinion, not legal penalties.
      - |
        The view is Mill's throughout, as "I am happy to think" in the next sentence confirms.
    answer: 1
    explanation: |
      Parallel structure signals equal weight. Here it enacts the fairness Mill is recommending: the same judgment for both sides.

  - slug: u09-exam-q14
    type: multiple_choice
    topic_code: "3.C"
    source: 'John Stuart Mill, On Liberty (1859)'
    points: 1
    stimulus: *ex_mill_manner
    prompt: |
      Mill honours anyone "who has calmness to see and honesty to state what his opponents and their opinions really are, exaggerating nothing to their discredit, keeping nothing back which tells, or can be supposed to tell, in their favour." This description most closely matches which practice taught in this unit?
    options:
      - |
        Avoiding counterarguments altogether so as not to give the other side publicity
      - |
        Replacing evidence with emotional appeals
      - |
        Hedging every claim until it cannot be attacked
      - |
        Stating an opposing view fairly and at full strength before answering it, rather than presenting a straw man
    option_explanations:
      - |
        Mill praises those who state their opponents' views, which requires including counterarguments rather than avoiding them.
      - |
        The passage concerns honest representation of opponents, not emotional appeals.
      - |
        Over-hedging concerns one's own claims; Mill's description concerns how one presents an opponent's.
      - |
        Correct. Exaggerating nothing to the opponents' discredit and keeping back nothing in their favour is the opposite of a straw man: the fair statement of the other side that makes a rebuttal count.
    answer: 3
    explanation: |
      Mill's sentence is a definition of fair counterargument. It is also the standard by which a reader judges whether a rebuttal has earned its conclusion.

  - slug: u09-exam-q15
    type: multi_select
    topic_code: "3.C"
    source: 'John Stuart Mill, On Liberty (1859)'
    points: 2
    partial_credit: true
    stimulus: *ex_mill_manner
    prompt: |
      Which TWO of the following does Mill name among "the gravest" offences in the manner of argument? Select two.
    options:
      - |
        To misrepresent the opposite opinion
      - |
        To suppress facts or arguments
      - |
        To show strong feeling on the subject
      - |
        To make an attack that is telling and powerful
    option_explanations:
      - |
        Correct. Misrepresenting the opposite opinion is the straw man, which Mill lists among the gravest offences.
      - |
        Correct. Suppressing facts or arguments is on the same list: hiding what tells against one's side.
      - |
        Mill says that strong feeling is what leads people to call an effective opponent intemperate; he does not treat it as a grave offence.
      - |
        Mill observes that a "telling and powerful" attack is what gives offence, which is his reason for distrusting the test; he does not condemn it.
    answer: [0, 1]
    explanation: |
      Mill distinguishes the real offences (dishonest argument) from the apparent ones (forceful argument). The distinction is the heart of his answer to the temperate-manner position.

  - slug: u09-exam-q16
    type: fill_blank
    topic_code: "3.C"
    source: 'John Stuart Mill, On Liberty (1859)'
    points: 1
    stimulus: *ex_mill_manner
    prompt: |
      Mill calls the honest representation of opponents, and judging advocates by their conduct rather than their side, "the real ____ of public discussion."
    answer: ["morality"]
    explanation: |
      For Mill, fairness to opponents is an ethical standard, enforced by opinion rather than by law.

  - slug: u09-exam-q17
    type: multiple_choice
    topic_code: "5.B"
    source: 'John Stuart Mill, On Liberty (1859)'
    points: 1
    stimulus: *ex_mill_manner
    prompt: |
      Which best describes the organisation of Mill's response to the people who want discussion kept temperate?
    options:
      - |
        A practical difficulty (the bounds cannot be fixed), then a deeper objection with a concession (manner can be wrong, but its worst faults cannot be proved or policed), then a positive standard for public opinion to apply
      - |
        A story about a particular controversy, followed by a moral
      - |
        A list of definitions of temperance, arranged alphabetically
      - |
        An attack on the motives of those who hold the view, followed by a summary of the chapter
    option_explanations:
      - |
        Correct. Skill 5.B: the response moves from the "practical point of view" to "a more fundamental objection," grants a point with "Undoubtedly," and ends with what opinion ought to do. Each stage answers a stronger form of the position.
      - |
        No particular controversy or story is told; the argument proceeds by general reasoning.
      - |
        Mill does not define temperance in a series; he questions whether its bounds can be fixed at all.
      - |
        Mill does not attack the motives of those who hold the view; he takes it seriously enough to grant part of it.
    answer: 0
    explanation: |
      Ordering responses from practical to fundamental is a common structure in rebuttal: it disposes of the easy point first and saves the decisive one.

  # ---- Set C: Lincoln at Alton
  - slug: u09-exam-q18
    type: multiple_choice
    topic_code: "3.C"
    source: 'Abraham Lincoln, reply at Alton, Lincoln–Douglas debates (1858)'
    points: 1
    stimulus: &ex_alton |
      *The following passage is from Abraham Lincoln's reply to Stephen A. Douglas at Alton, Illinois, on October 15, 1858, the last of their seven debates. Lincoln has just described the Republican view that slavery is a wrong that should not be allowed to spread.*

      On the other hand, I have said there is a sentiment which treats it as not being wrong. That is the Democratic sentiment of this day. I do not mean to say that every man who stands within that range positively asserts that it is right. That class will include all who positively assert that it is right, and all who, like Judge Douglas, treat it as indifferent and do not say it is either right or wrong. These two classes of men fall within the general class of those who do not look upon it as a wrong. And if there be among you anybody who supposes that he, as a Democrat, can consider himself "as much opposed to slavery as anybody," I would like to reason with him. You never treat it as a wrong. What other thing that you consider as a wrong do you deal with as you deal with that? Perhaps you say it is wrong--but your leader never does, and you quarrel with anybody who says it is wrong. Although you pretend to say so yourself, you can find no fit place to deal with it as a wrong. You must not say anything about it in the free States, because it is not here. You must not say anything about it in the slave States, because it is there. You must not say anything about it in the pulpit, because that is religion, and has nothing to do with it. You must not say anything about it in politics, because that will disturb the security of "my place." There is no place to talk about it as being a wrong, although you say yourself it is a wrong. But, finally, you will screw yourself up to the belief that if the people of the slave States should adopt a system of gradual emancipation on the slavery question, you would be in favor of it. You would be in favor of it. You say that is getting it in the right place, and you would be glad to see it succeed. But you are deceiving yourself. You all know that Frank Blair and Gratz Brown, down there in St. Louis, undertook to introduce that system in Missouri. They fought as valiantly as they could for the system of gradual emancipation which you pretend you would be glad to see succeed. Now, I will bring you to the test. After a hard fight they were beaten, and when the news came over here, you threw up your hats and hurrahed for Democracy.
    prompt: |
      The sentence "I do not mean to say that every man who stands within that range positively asserts that it is right" serves chiefly to
    options:
      - |
        retract Lincoln's claim that the Democratic sentiment treats slavery as not wrong
      - |
        qualify his generalisation, so that it covers both those who call slavery right and those who, like Douglas, treat it as indifferent
      - |
        praise the Democrats for their moderation
      - |
        introduce a quotation from Douglas
    option_explanations:
      - |
        The claim stands; the next sentences reaffirm that both groups "fall within the general class of those who do not look upon it as a wrong."
      - |
        Correct. Lincoln anticipates the objection that most Democrats do not defend slavery as right. He concedes the point and redraws his claim: the shared trait is not calling slavery right but declining to call it wrong.
      - |
        Indifference to a wrong is not praised; the qualification sharpens rather than softens the charge.
      - |
        No quotation from Douglas follows; the next sentences classify the Democratic sentiment in Lincoln's own words.
    answer: 1
    explanation: |
      Skill 3.C: a qualification can make a charge harder to deny. By claiming less (not that every Democrat calls slavery right), Lincoln makes his claim stick to more of his audience.

  - slug: u09-exam-q19
