    prompt: |
      A writer opposing a new city curfew for teenagers grants that the curfew's goal of reducing late-night vandalism is a good one, then argues that the curfew would punish thousands of law-abiding teenagers to deter a few. Which description of this move is most accurate?
    options:
      - |
        The writer refutes the opponents' goal by proving that vandalism is not a problem.
      - |
        The writer concedes the goal and rebuts the means, arguing that the remedy's cost outweighs its benefit.
      - |
        The writer abandons the argument against the curfew.
      - |
