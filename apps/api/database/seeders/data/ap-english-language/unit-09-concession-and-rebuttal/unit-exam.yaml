  # ---- Argument essay
  - slug: u09-exam-q44
    type: long_answer
    topic_code: "4.C"
    source: 'John Stuart Mill, On Liberty (1859)'
    points: 6
    prompt: |
      Suggested time: 40 minutes. This question counts as one-third of the total essay section score.

      In On Liberty (1859), John Stuart Mill writes: "He who knows only his own side of the case, knows little of that." He argues that a person cannot truly understand even a correct belief without knowing, in their strongest form, the arguments against it.

      Write an essay that argues your position on the extent to which Mill's claim is valid.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible position.
      - Provide evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Model outline (one defensible position among many). Thesis: Mill is right that a belief never tested against its strongest objections is understood only as a slogan, but his claim needs a limit: for questions settled by overwhelming evidence, knowing the other side means knowing why it failed, not treating it as an equal. Line of reasoning: (1) Understanding requires reasons: a student who has memorised that a vaccine is safe but cannot explain why the old fears were wrong will be shaken by the first confident skeptic, while one who has worked through those fears holds the belief securely. (2) Objections improve beliefs: debate teams, peer review in science and the adversarial trial all institutionalise the other side because opponents find errors that allies miss; Mill's Cicero studied his adversary's case for the same reason. (3) Concession and limit: some claims (that the earth orbits the sun) need no live opponent, and staging false balance can mislead an audience; Mill himself grants that mathematics has no other side. Yet even there, knowing why geocentrism failed is part of understanding astronomy, which supports Mill's core point. Conclusion: knowing the other side is not the same as granting it equal weight; it is what turns a correct opinion into knowledge. Sophistication: a qualified thesis that distinguishes understanding an opposing view from treating it as equally valid, and answers the false-balance objection rather than ignoring it.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis that takes a position on the extent of the claim's validity (agree, disagree or qualify), not a restatement of Mill. Row B Evidence and Commentary (0-4): 4 = specific, relevant evidence (from history, science, law, education, current events, reading or experience) with commentary that consistently explains how each example supports a coherent line of reasoning; 3 = specific evidence and explanation of most of it, with some uneven links; 2 = some relevant evidence but commentary that is general, repetitive or summarises rather than reasons; 1 = evidence that is mostly general or listed with little explanation; 0 = no relevant evidence. Row C Sophistication (0-1): 1 point for a nuanced argument, such as one that fairly states and answers a counterargument (for example, that some questions are settled and staging an opposing side creates false balance), qualifies the claim with a precise limit, or explores the tension between understanding an opposing view and granting it equal weight. A single sentence of counterargument without a real answer does not earn the point. Grammar and style matter only insofar as they affect the clarity of the argument.
