    # ---- Across chapter 2 and the unit's terms
    - slug: u09-w30-q14
      type: multiple_choice
      topic_code: "3.C"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 1
      prompt: |
        Later in chapter 2, Mill writes: "He who knows only his own side of the case, knows little of that." In context, the claim most directly supports which view of counterarguments?
      options:
        - |
          Counterarguments are a distraction that weakens a writer's confidence.
        - |
          Opposing views should be heard only from one's own teachers, who can refute them.
        - |
          Knowing the arguments against a position is part of understanding the position itself, not an optional extra.
        - |
          Only questions of mathematics can be settled without hearing objections, so every other subject is a matter of taste.
      option_explanations:
        - |
          Mill argues the reverse: without the opposing reasons a person "has no ground for preferring either opinion," so objections are what make confidence rational.
        - |
          Mill explicitly rejects this, saying a person must hear objections "from persons who actually believe them," not secondhand from teachers.
        - |
          Correct. Mill's claim is that even a true belief is poorly understood by someone who cannot answer the objections to it. The other side is part of knowing one's own.
        - |
          Mill does contrast mathematics, where "all the argument is on one side," with other subjects, but he does not call the rest matters of taste; he says their truth depends on weighing conflicting reasons.
      answer: 2
      explanation: |
        This sentence is Mill's own justification for the move this unit teaches: a writer who has worked through the other side argues from knowledge, not habit.

    - slug: u09-w30-q15
      type: multiple_choice
      topic_code: "3.C"
      source: general knowledge
      points: 1
      prompt: |
        A writer grants that an opposing view is partly correct and then argues that her own position still holds. The first of these two moves is called
      options:
        - |
          a concession
        - |
          a refutation
        - |
          an ad hominem
        - |
          a thesis
      option_explanations:
        - |
          Correct. A concession acknowledges what is valid in an opposing view; the argument that follows it is the rebuttal.
        - |
          A refutation proves the opposing view wrong; granting that it is partly correct is the opposite move.
        - |
          An ad hominem attacks the person who holds a view rather than the view itself; nothing here attacks anyone.
        - |
          A thesis is the writer's overarching claim; granting part of an opposing view is a move within the argument, not its main claim.
      answer: 0
      explanation: |
        Concession, then rebuttal: grant, then answer. Refutation is the strongest form of rebuttal, the one that shows the opposing claim is false.

    - slug: u09-w30-q16
      type: true_false
      topic_code: "4.C"
      source: general knowledge
      points: 1
      prompt: |
        True or false: conceding a point to the opposing side always weakens an argument, because it admits that the writer is partly wrong.
      answer: false
      explanation: |
        False. A well-chosen concession usually strengthens an argument: it shows fairness, earns the trust of readers who hold the other view, and narrows the dispute to the ground the writer can win. It weakens an argument only when the writer concedes the central claim and fails to answer.

