    - slug: u09-w30-q19
      type: short_answer
      topic_code: "3.C"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 2
      prompt: |
        In two or three sentences, explain the distinction Mill draws in his reply ("I answer that it is assuming very much more") and how that distinction answers the opponents' comparison of silencing opinions to laying taxes or making wars.
      answer: |
        Mill distinguishes between presuming an opinion true because it has survived every chance to be refuted and assuming it true in order to stop it from being refuted. A government that taxes or goes to war acts on an opinion that others remain free to contest, but a government that silences an opinion removes the very contest that would justify its confidence, so the analogy breaks down.
      explanation: |
        1 point: accurately states the distinction (presuming truth after open challenge versus assuming truth to prevent challenge). 1 point: explains why the distinction defeats the analogy (other fallible acts leave contradiction possible; silencing forbids it). A response that only paraphrases the objection earns 0.

    - slug: u09-w30-q20
      type: short_answer
      topic_code: "4.C"
      source: general knowledge
      points: 2
      prompt: |
        Your claim is that students should be allowed to retake any unit test once. Write two sentences: first a fair statement of the strongest objection to your claim, then a concession followed by a rebuttal.
      answer: |
        Model: Critics argue that unlimited retakes teach students to treat the first test as a practice run, so that they study less the first time. It is true that some students would study less at first, but requiring a short corrections assignment before a retake makes the second attempt a reward for real review rather than a free second chance.
      explanation: |
        1 point: the objection is stated fairly and specifically, in a form its holders would accept (not a straw man such as *some people just hate students*). 1 point: the second sentence both concedes something real and turns (*but*, *yet*, *still*) to a reason the claim still holds. A bare "They are wrong" earns no credit for the second point.

    - slug: u09-w30-q21
      type: multiple_choice
      topic_code: "1.A"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 1
      prompt: |
        Mill wrote On Liberty for a broad educated public in Victorian Britain, many of whom believed that some opinions were too dangerous to be spread. Given that audience, his decision to state the case for suppression at length before answering it most likely serves to
      options:
        - |
          show off his knowledge of law and government
        - |
          fill space in a long essay
        - |
          prove that he once held the opposing view himself
        - |
          meet readers where they stand, so that those inclined toward suppression see their own reasons taken seriously before being asked to give them up
      option_explanations:
        - |
          The objection draws on ordinary reasoning about taxes and wars, not legal expertise; its purpose is to represent a common view, not to display learning.
        - |
          Every sentence of the objection is later answered; it does work in the argument and is not padding.
        - |
          Mill never says he held the view, and the passage gives no biographical information; the reasons it offers are attributed to "such reasoners."
        - |
          Correct. Skill 1.A: the audience includes people who favour silencing dangerous opinions. Stating their case fully earns their attention and makes the rebuttal something they must reckon with.
      answer: 3
      explanation: |
        A counterargument is chosen with an audience in mind. Ask who in the audience holds the opposing view and what the writer gains by voicing it for them.

    - slug: u09-w30-q22
      type: long_answer
      topic_code: "3.C"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 5
      prompt: |
        Write one well-developed analytical paragraph (about 175-225 words). Make a claim about how Mill's handling of the opposing view in the passage from chapter 2 (the objection and his reply) strengthens his argument for liberty of discussion. Support your claim with at least two short quotations, one from the objection and one from the reply, and explain how each supports your claim.
      answer: |
        Claim: Mill strengthens his argument by stating the case for suppression so fully that his short reply seems to defeat the best the other side can offer, not a weak version of it. Evidence 1: the opponents' own maxim, "An objection which applies to all conduct, can be no valid objection to any conduct in particular," and their question, "Ought we therefore to lay on no taxes, and, under whatever provocation, make no wars?" Commentary: Mill gives the other side quotable logic and a vivid analogy, so a reader who favours suppression recognises the argument as his own at full strength. Evidence 2: "I answer that it is assuming very much more." Commentary: the reply concedes the premise that people must act on fallible opinions but isolates the one place where silencing differs, the difference between "presuming an opinion to be true" after challenge and "assuming its truth for the purpose of not permitting its refutation." Because the reply is brief and exact, it implies that the objection's length hides a single flaw. Link: the fairness of the objection is what makes the rebuttal persuasive.
      explanation: |
        5 points. Claim (1): an arguable claim about how the treatment of the opposing view strengthens the argument (not *Mill uses a counterargument*). Evidence (2): 1 point for an accurate, short quotation from the objection; 1 point for one from the reply. Commentary (2): 2 points if the paragraph explains how both the fair statement of the objection and the precise rebuttal work together (fairness earns trust; the distinction defeats the analogy); 1 point if commentary is present but explains only one quotation or merely restates them. A paragraph that summarises the passage without a claim earns at most 2.
