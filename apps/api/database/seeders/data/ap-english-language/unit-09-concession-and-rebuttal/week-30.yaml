week: 30
unit: 9
title: Stating the Other Side in Mill's On Liberty
topics: ["3.C"]
texts:
  - author: John Stuart Mill
    title: On Liberty
    year: 1859
    url: https://www.gutenberg.org/ebooks/34901
guide: guides/week-30.md
guide_description: |
  The first week of the last unit: how a writer qualifies a claim by stating the other side and answering it.
  The vocabulary of concession, rebuttal and refutation, and the difference between a counterargument that is
  dismissed and one that is genuinely answered. Then John Stuart Mill's On Liberty (1859), chapter 2, as a case
  study: the objection Mill writes out for his opponents in their strongest form, his one-sentence answer, and his
  claim that a person who knows only his own side knows little of that. Close readings, a writing lesson on
  presenting an objection fairly, common mistakes and self-check questions.
flashcards_description: |
  30 cards on concession, rebuttal and refutation, the parts of a counterargument paragraph, and the objections,
  answers and key sentences of chapter 2 of Mill's On Liberty.

flashcards:
  - front: Counterargument → what it is in an argument essay
    back: |
      A claim that opposes the writer's position or part of it, stated inside the writer's own argument so that it can be answered. Raising it shows the reader that the writer has considered more than one side.
    topic_code: "3.C"
  - front: Concession → the move in one sentence
    back: |
      Granting that some part of the opposing view is true, reasonable or understandable. A concession admits something without abandoning the writer's main claim.
    hint: It is true that...
    topic_code: "3.C"
  - front: Rebuttal → the move in one sentence
    back: |
      The writer's reply to a counterargument: the reasons the opposing view does not overturn the writer's claim. A rebuttal may show the objection is wrong, limited, or outweighed.
    topic_code: "3.C"
  - front: Refutation → how it differs from rebuttal
    back: |
      A refutation proves the opposing claim false, for example by exposing a factual error or a flaw in its logic. Every refutation is a rebuttal, but a rebuttal can also simply argue that the objection matters less.
    topic_code: "3.C"
  - front: Concede-and-answer pattern → the three steps
    back: |
      State the objection fairly; grant what is true in it; then answer it by showing why the writer's claim still stands. Skipping the second step makes the answer sound dismissive.
    hint: State, grant, answer.
    topic_code: "4.C"
  - front: Straw man → why it weakens an argument
    back: |
      A distorted, weaker version of the opposing view, set up so it is easy to knock down. Readers who hold the real view notice the distortion and stop trusting the writer.
    topic_code: "3.C"
  - front: Steel man → the opposite of a straw man
    back: |
      Stating the opposing view in its strongest, most persuasive form before answering it. Mill asks readers to know objections in their most plausible form, which is the same idea.
    topic_code: "3.C"
  - front: Qualifier → what it does to a claim
    back: |
      A word or phrase that limits a claim's scope or certainty (often, in most cases, for students who). A qualified claim is easier to defend because it claims only what the evidence supports.
    topic_code: "4.C"
  - front: Concession signal phrases → three examples
    back: |
      It is true that... Admittedly... Granted,... Critics are right that... Although... Each tells the reader that the writer is about to give ground before answering.
    topic_code: "4.C"
  - front: Turn signal after a concession → three examples
    back: |
      But, yet, still, even so, nevertheless, however. The turn marks where the concession ends and the rebuttal begins; without it readers may think the writer has changed sides.
    topic_code: "6.B"
  - front: Mill, On Liberty → date and subject
    back: |
      Published in 1859. A long essay on the limits of the power that society, through law or public opinion, may rightly exercise over the individual. Chapter 2 defends liberty of thought and discussion.
    topic_code: "1.A"
  - front: Mill's On Liberty, chapter 2 → its central claim
    back: |
      Silencing an opinion is wrong whether the opinion is true or false: if true, people lose the chance to exchange error for truth; if false, they lose the clearer view of truth produced by its collision with error.
    topic_code: "3.B"
  - front: Mill's "two hypotheses" → how they organise chapter 2
    back: |
      Mill considers separately the case in which the silenced opinion is true and the case in which it is false, giving each its own branch of argument. The structure itself shows that he has thought about both sides.
    topic_code: "5.A"
  - front: Mill on silencing → "an assumption of infallibility"
    back: |
      His first branch: to refuse a hearing to an opinion because you are sure it is false is to treat your certainty as absolute certainty. Mill writes that all silencing of discussion is an assumption of infallibility.
    topic_code: "3.A"
  - front: Mill's opponent → the objection he writes out for them
    back: |
      Rulers must act on their judgment even though it may be wrong, as they do when they tax or make war; forbidding dangerous opinions is just one more such act. Mill states this at length and in its strongest form.
    topic_code: "3.C"
  - front: '"An objection which applies to all conduct, can be no valid objection to any conduct in particular" → whose words?'
    back: |
      The opponent's, as Mill imagines them. Mill gives the other side its own sharp maxim, part of presenting the objection fairly before he answers it.
    topic_code: "3.C"
  - front: '"(such reasoners may say)" → what the parenthesis does'
    back: |
      It reminds the reader in mid-sentence that these are the opponents' words, not Mill's. Attribution tags like this keep a long counterargument from being mistaken for the writer's own view.
    topic_code: "3.C"
  - front: Mill's reply → "I answer that it is assuming very much more."
    back: |
      The rebuttal is one short sentence after a long objection. Its brevity signals confidence, and it targets the objection's key word, "assume," turning the opponent's own term against them.
    topic_code: "3.C"
  - front: Mill's distinction between presuming and preventing refutation
    back: |
      We may presume an opinion true when it has survived every chance to be contested; we may not assume it true in order to stop it from being contested. Freedom to contradict is what justifies confidence.
    topic_code: "3.C"
  - front: '"He who knows only his own side of the case, knows little of that." → the claim'
    back: |
      Mill's claim that understanding even your own position requires knowing the arguments against it. A belief never tested by objections is held, he says, as a prejudice.
    topic_code: "3.C"
  - front: Mill's Cicero example → why it is there
    back: |
      Mill cites the great Roman orator, who studied his adversary's case as hard as his own, as proof that knowing the other side wins arguments. He then extends the practice from the courtroom to the search for truth.
    topic_code: "3.A"
  - front: Mill's devil's advocate → the idea
    back: |
      If no real opponents of an important truth exist, Mill says we must imagine them and give them the strongest arguments a skilful devil's advocate can invent. Objections are a discipline, not a nuisance.
    topic_code: "3.C"
  - front: Mill on hearing objections only from your own teachers
    back: |
      Not enough: you must hear the arguments from people who actually believe them and defend them in earnest. A rebuttal of an objection you have only heard secondhand may be a rebuttal of a straw man.
    topic_code: "3.C"
  - front: Mill's "portion of truth" → what a silenced error may contain
    back: |
      His second ground: a false opinion may still contain part of the truth, and since the prevailing opinion is rarely the whole truth, only the collision of opinions supplies the rest. A concession built into his theory.
    topic_code: "3.C"
  - front: Mill's four grounds → the recap at the end of chapter 2
    back: |
      (1) The silenced opinion may be true. (2) Even if false, it may hold a portion of truth. (3) Even a whole truth, uncontested, is held as prejudice. (4) Its meaning may be lost and become dead dogma.
    topic_code: "5.A"
  - front: Mill's tone toward his opponents → how to describe it
    back: |
      Patient and fair but firm. He states their case in full, grants that men must act on imperfect judgment, and then answers in a single decisive sentence. The tone persuades readers that he is reasoning, not scoring points.
    topic_code: "7.A"
  - front: Dismissal versus rebuttal → the test
    back: |
      A dismissal says the other side is wrong (They are mistaken.). A rebuttal says why, with a reason the other side would have to answer. Only a rebuttal earns credit for complexity.
    topic_code: "4.C"
  - front: Counterargument placement → three common positions
    back: |
      Early, to clear the ground before the main case; in the middle, beside the point it challenges; or near the end, as the last obstacle removed. Placement depends on how pressing the objection is for the audience.
    topic_code: "3.C"
  - front: AP Language argument essay → where counterarguments earn credit
    back: |
      Answering an opposing view well is one of the clearest ways to earn the sophistication point, which rewards a nuanced argument that explores complexities or tensions, and it strengthens the commentary row as well.
    topic_code: "4.C"
  - front: Unit 9 → the skill pair it centres on
    back: |
      3.C (explain how claims are qualified through modifiers, counterarguments and alternative perspectives) and 4.C (qualify a claim yourself the same ways). Reading the move, then making it.
    topic_code: "3.C"

quiz:
  description: |
    22 questions · about 35 minutes · a set of eight questions on the objection Mill writes out for his opponents
    and his answer, a set of five revision questions on a student's draft, then questions on concession, rebuttal
    and refutation across chapter 2 of On Liberty. Multiple choice, select-all and true/false items are graded at
    once; the fill-in-the-blank items are matched automatically; the two short answers and the paragraph are graded
    by your teacher against the model answer and scoring notes.
  questions:
    # ---- Passage set: the objection Mill writes for his opponents, and his answer
    - slug: u09-w30-q01
      type: multiple_choice
      topic_code: "3.C"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 1
      stimulus: &mill_objection |
        *The following passage is from chapter 2, "Of the Liberty of Thought and Discussion," of John Stuart Mill's On Liberty (1859). Mill has just argued that to silence an opinion because we are sure it is false is to assume that we cannot be wrong.*

        The objection likely to be made to this argument, would probably take some such form as the following. There is no greater assumption of infallibility in forbidding the propagation of error, than in any other thing which is done by public authority on its own judgment and responsibility. Judgment is given to men that they may use it. Because it may be used erroneously, are men to be told that they ought not to use it at all? To prohibit what they think pernicious, is not claiming exemption from error, but fulfilling the duty incumbent on them, although fallible, of acting on their conscientious conviction. If we were never to act on our opinions, because those opinions may be wrong, we should leave all our interests uncared for, and all our duties unperformed. An objection which applies to all conduct, can be no valid objection to any conduct in particular. It is the duty of governments, and of individuals, to form the truest opinions they can; to form them carefully, and never impose them upon others unless they are quite sure of being right. But when they are sure (such reasoners may say), it is not conscientiousness but cowardice to shrink from acting on their opinions, and allow doctrines which they honestly think dangerous to the welfare of mankind, either in this life or in another, to be scattered abroad without restraint, because other people, in less enlightened times, have persecuted opinions now believed to be true. Let us take care, it may be said, not to make the same mistake: but governments and nations have made mistakes in other things, which are not denied to be fit subjects for the exercise of authority: they have laid on bad taxes, made unjust wars. Ought we therefore to lay on no taxes, and, under whatever provocation, make no wars? Men, and governments, must act to the best of their ability. There is no such thing as absolute certainty, but there is assurance sufficient for the purposes of human life. We may, and must, assume our opinion to be true for the guidance of our own conduct: and it is assuming no more when we forbid bad men to pervert society by the propagation of opinions which we regard as false and pernicious.

        I answer that it is assuming very much more. There is the greatest difference between presuming an opinion to be true, because, with every opportunity for contesting it, it has not been refuted, and assuming its truth for the purpose of not permitting its refutation. Complete liberty of contradicting and disproving our opinion, is the very condition which justifies us in assuming its truth for purposes of action; and on no other terms can a being with human faculties have any rational assurance of being right.
      prompt: |
        The first paragraph of the passage primarily serves to
      options:
        - |
          summarise the evidence for Mill's own position before he moves to a new topic
        - |
          present, at length and in persuasive terms, the strongest objection an opponent could raise to Mill's argument
        - |
          concede that Mill's earlier argument was mistaken and announce a revised position
        - |
          ridicule people who believe that governments should ever suppress opinions
      option_explanations:
        - |
          The paragraph argues against Mill's position, not for it: it defends forbidding "the propagation of error." Its first sentence labels it as "The objection likely to be made."
        - |
          Correct. Mill announces an objection, then lets it run for the whole paragraph with rhetorical questions, analogies (taxes, wars) and a maxim of its own. Only then does he answer it.
        - |
          Mill does not give up his argument; the second paragraph begins "I answer," and he goes on to defend the position he held before the objection.
        - |
          The objection is stated respectfully and even persuasively; the "reasoners" are presented as conscientious people, not as fools to be mocked.
      answer: 1
      explanation: |
        Skill 3.C: a long stretch of an argument may voice the other side. Look for the frame ("The objection likely to be made," "such reasoners may say") that tells you whose view a paragraph carries.

    - slug: u09-w30-q02
      type: multiple_choice
      topic_code: "3.C"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 1
      stimulus: *mill_objection
      prompt: |
        The parenthetical phrase "(such reasoners may say)" and the clause "it may be said" chiefly serve to
      options:
        - |
          suggest that Mill is unsure whether anyone holds this view
        - |
          introduce evidence from named authorities who support Mill
        - |
          signal a shift from the opponents' reasoning back to Mill's own
        - |
          remind the reader that the claims in the paragraph belong to Mill's imagined opponents, not to Mill
      option_explanations:
        - |
          The opening sentence says the objection is "likely to be made"; the tags do not express doubt about its existence but keep track of who is speaking.
        - |
          No authorities are named; "such reasoners" refers back to the unnamed opponents whose case Mill is building, and they oppose rather than support him.
        - |
          The tags appear in the middle of the opponents' case, which continues after them; the shift to Mill's own voice comes only with "I answer."
        - |
          Correct. In a long counterargument a reader can lose track of whose view is being stated. Attribution tags inserted mid-paragraph keep the objection clearly marked as the other side's.
      answer: 3
      explanation: |
        Attribution tags are a qualifying device in their own right: they let a writer state an opposing view vividly, even in the first person plural ("We may, and must"), without being taken to endorse it.

    - slug: u09-w30-q03
      type: multiple_choice
      topic_code: "3.A"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 1
      stimulus: *mill_objection
      prompt: |
        The opponents support their claim chiefly with evidence of which kind?
      options:
        - |
          Analogies to other acts of government, such as laying taxes and making wars, which are undertaken despite the risk of error
        - |
          Statistics about how often suppressed opinions later proved false
        - |
          Personal testimony from rulers who regret having tolerated dangerous doctrines
        - |
          Quotations from earlier philosophers who defended censorship
      option_explanations:
        - |
          Correct. The objection argues by comparison: governments act on fallible judgment when they tax and go to war, so forbidding dangerous opinions is no different. "Ought we therefore to lay on no taxes" makes the analogy explicit.
        - |
          The paragraph contains no numbers or records at all. It argues from general principles and comparisons, not from data.
        - |
          No ruler speaks in the passage; the voice is that of generalised "reasoners," and they express no regret.
        - |
          No philosopher is quoted. The only sharp maxim in the paragraph is the opponents' own statement about objections that apply to all conduct.
      answer: 0
      explanation: |
        Skill 3.A: identify the kind of evidence a claim rests on. Naming it (here, analogy) is also the first step in answering it, since Mill's rebuttal attacks exactly where the analogy breaks down.

    - slug: u09-w30-q04
      type: multiple_choice
      topic_code: "3.C"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 1
      stimulus: *mill_objection
      prompt: |
        Mill's reply in the second paragraph is best described as a rebuttal that
      options:
        - |
          concedes the whole objection but argues that free discussion is pleasant
        - |
          attacks the character of the opponents rather than their reasoning
        - |
          accepts that people must act on their opinions but denies that silencing others is the same kind of assumption, distinguishing presuming an opinion true from preventing its refutation
        - |
          changes the subject from government power to private conversation
      option_explanations:
        - |
          Mill does not concede the whole objection; his first words deny its last claim ("it is assuming very much more"). Nor does he argue from pleasure.
        - |
          The reply contains no criticism of the opponents' motives or character; it addresses the logic of the word "assume."
        - |
          Correct. Mill keeps the opponents' premise that we may act on our opinions, but draws a distinction: confidence earned by surviving every challenge differs from confidence used to forbid challenges. The analogy to taxes and wars breaks at that point.
        - |
          The reply stays on the same subject, the justification for silencing opinions, and speaks of opinion "for purposes of action," which includes government action.
      answer: 2
      explanation: |
        The strongest rebuttals often grant a premise and attack the inference. Ask what the writer keeps from the objection and where exactly the writer says it goes wrong.

    - slug: u09-w30-q05
      type: multiple_choice
      topic_code: "5.A"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 1
      stimulus: *mill_objection
      prompt: |
        Which best describes how the passage fits into Mill's line of reasoning?
      options:
        - |
          It introduces Mill's thesis for the first time, before any argument has been made.
        - |
          It tests Mill's preceding claim against the strongest available objection, so that the claim emerges strengthened rather than merely asserted.
        - |
          It interrupts the argument with an unrelated digression on taxation and war.
        - |
          It concludes the chapter by summarising all four of Mill's grounds.
      option_explanations:
        - |
          The framing note and the first sentence ("to this argument") show that Mill has already made an argument; the passage responds to a challenge to it.
        - |
          Correct. Having argued that silencing assumes infallibility, Mill raises the best objection to that argument and answers it. The counterargument is a step in the line of reasoning, not a detour from it.
        - |
          Taxes and wars appear only as the opponents' analogy, and Mill's answer shows why that analogy fails; they are part of the argument, not a digression.
        - |
          The four grounds are recapitulated at the end of the chapter; this passage comes early, in the first branch of the argument.
      answer: 1
      explanation: |
        Skill 5.A: a counterargument and its rebuttal are links in the line of reasoning. An argument that has faced its strongest objection is more convincing than one that has faced none.

    - slug: u09-w30-q06
      type: multiple_choice
      topic_code: "7.A"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 1
      stimulus: *mill_objection
      prompt: |
        The contrast in length between the two paragraphs (a long objection followed by a three-sentence reply that begins "I answer that it is assuming very much more") contributes to a tone that is best described as
      options:
        - |
          hesitant, because Mill seems unable to say much in reply
        - |
          indignant, because Mill refuses to dignify the objection with a full answer
        - |
          playful, because the brevity turns the debate into a joke
        - |
          confident and decisive, because a brief, direct reply suggests that one distinction is enough to answer the whole case
      option_explanations:
        - |
          The reply is short but not weak: it names a precise flaw and states a principle. Brevity here reads as control, not as having nothing to say.
        - |
          Mill has just given the objection a full and fair hearing; nothing in his reply expresses anger or contempt for it.
        - |
          The reply is serious and abstract, with no humour; the terms "rational assurance" and "human faculties" keep it grave.
        - |
          Correct. After letting the opponents speak at length, Mill answers in the first person and in plain terms. The proportion implies that the objection, however long, turns on one mistake he can name at once.
      answer: 3
      explanation: |
        Skill 7.A: syntax and proportion carry tone. A short sentence after a long paragraph lands with emphasis; here it signals confidence earned by the fairness of what came before.

    - slug: u09-w30-q07
      type: true_false
      topic_code: "3.C"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 1
      stimulus: *mill_objection
      prompt: |
        True or false: in the sentence "We may, and must, assume our opinion to be true for the guidance of our own conduct," Mill is stating his own view.
      answer: false
      explanation: |
        False. The sentence is the last step of the objection Mill imagines; the first-person *we* belongs to the opponents. Mill's own view begins with "I answer," where he denies that silencing assumes "no more" than acting on an opinion.

    - slug: u09-w30-q08
      type: multi_select
      topic_code: "3.C"
      source: 'John Stuart Mill, On Liberty (1859)'
      points: 2
      partial_credit: true
      stimulus: *mill_objection
      prompt: |
        Which TWO features show that Mill presents the opposing view fairly rather than as a straw man? Select two.
      options:
        - |
          He gives the opponents persuasive devices of their own, such as rhetorical questions and the maxim about objections that apply to all conduct.
        - |
          He grants them a reasonable premise, that people must act on fallible judgment, which his own reply does not deny.
        - |
          He describes the opponents as cowards who fear new ideas.
        - |
          He names the opponents and quotes their published works.
      option_explanations:
        - |
          Correct. Questions like "are men to be told that they ought not to use it at all?" and a quotable maxim make the objection forceful, which is the opposite of weakening it.
        - |
          Correct. The idea that "Men, and governments, must act to the best of their ability" is never denied; Mill's reply narrows the dispute to one distinction, leaving the reasonable part of the objection standing.
        - |
          The word "cowardice" appears in the objection itself, as the opponents' charge against those who refuse to act; Mill never calls his opponents cowards.
        - |
          The opponents are unnamed "reasoners." Fairness here comes from the strength of the case Mill builds for them, not from citation.
      answer: [0, 1]
      explanation: |
        A fair counterargument is one its holders would recognise as their own, at full strength. That is what makes the rebuttal count.

    # ---- Revision set: a student's draft on required community service
    - slug: u09-w30-q09
      type: multiple_choice
      topic_code: "4.C"
      source: written for this course
      points: 1
      stimulus: &w30_service_draft |
        *The following is a draft of a student's argument essay about whether the high school should require every senior to complete a community service project.*

        (1) Every senior at our school should complete a forty-hour community service project before graduation. (2) Service teaches students that a community is something they take part in, not something that simply surrounds them. (3) Last spring, the twelve students who volunteered at the county food bank reported that they understood local hunger far better afterward. (4) Some people say that a requirement turns service into one more box to check. (5) They are wrong. (6) Required service puts students in places they would never otherwise go, and many of them keep going back after the hours are logged. (7) Others worry that students who work after school have no time to spare. (8) The school could let students spread the hours across all four years and count weekend shifts.
      prompt: |
        The writer wants to replace sentence 5 with a sentence that grants what is reasonable in the objection in sentence 4 before answering it. Which choice best accomplishes this goal?
      options:
        - |
          It is true that a requirement can feel like a box to check at first, but the feeling rarely survives the first afternoon of real work.
        - |
          People who say this have probably never volunteered anywhere themselves.
        - |
          This objection is so common that it hardly needs an answer.
        - |
          Box-checking is a problem in many school programs, such as standardized testing.
      option_explanations:
        - |
          Correct. The sentence concedes the reasonable part of the objection (a requirement can feel like box-checking) and then turns with "but" to an answer that sentence 6 can develop.
        - |
          This attacks the people who raise the objection instead of the objection itself, and it concedes nothing; readers who hold the view would feel insulted, not answered.
        - |
          Calling an objection common does not answer it, and the sentence concedes nothing. It is a dismissal dressed as a judgment.
        - |
          This drifts to another topic (testing) and leaves the objection about service unanswered; it neither concedes nor rebuts.
      answer: 0
      explanation: |
        Skill 4.C: a concession followed by a turn ("It is true that... but") shows readers that the writer has heard the other side and still has a reason to hold the claim.

    - slug: u09-w30-q10
      type: multiple_choice
      topic_code: "6.B"
      source: written for this course
      points: 1
      stimulus: *w30_service_draft
      prompt: |
        The writer wants to begin sentence 8 with a transitional phrase that makes clear the sentence answers the worry in sentence 7. Which choice best accomplishes this goal?
      options:
        - |
          Similarly,
        - |
          As a result,
        - |
          To meet that concern,
        - |
          In other words,
      option_explanations:
        - |
          "Similarly" signals a parallel point, but sentence 8 is a reply to sentence 7, not another example of the same thing.
        - |
          "As a result" would make the flexible schedule a consequence of students' lack of time, which misstates the relationship: the schedule is a solution the writer proposes.
        - |
          Correct. The phrase names sentence 7 as a concern and sentence 8 as the response to it, so the reader sees the counterargument and rebuttal as a pair.
        - |
          "In other words" signals a restatement, but sentence 8 introduces a new idea (a flexible schedule) rather than rephrasing the worry.
      answer: 2
      explanation: |
        Skill 6.B: in a counterargument paragraph, transitions mark where the objection ends and the answer begins. Choose the one that names the logical relationship.

    - slug: u09-w30-q11
      type: multiple_choice
      topic_code: "4.C"
      source: written for this course
      points: 1
      stimulus: *w30_service_draft
      prompt: |
        The writer wants to revise sentence 1 so that the claim accounts for the objection raised in sentence 7 while keeping the writer's position. Which version best accomplishes this goal?
      options:
        - |
          Every senior at our school might possibly want to think about doing some community service.
        - |
          Community service is good, although some students are busy.
        - |
          No senior should be required to do anything outside of class.
        - |
          Every senior at our school should complete a forty-hour community service project before graduation, on a schedule flexible enough for students who work or care for family.
      option_explanations:
        - |
          The stacked hedges (might, possibly, think about) drain the claim of any position; a qualifier should limit a claim, not dissolve it.
        - |
          The claim becomes too vague to argue (good in what way?), and the concession is tacked on without connecting to the requirement the essay defends.
        - |
          This reverses the writer's position entirely; qualifying a claim means adjusting it, not abandoning it.
        - |
          Correct. The thesis keeps the requirement and its terms but builds in the answer to the strongest objection, so the claim is both firm and defensible.
      answer: 3
      explanation: |
        A good qualifier narrows the claim to what the writer can defend. A bad one either hedges the claim into nothing or switches sides.

    - slug: u09-w30-q12
      type: multiple_choice
      topic_code: "8.B"
      source: written for this course
      points: 1
      stimulus: *w30_service_draft
      prompt: |
        The writer wants to combine sentences 4 and 6 into a single sentence that makes the concession subordinate to the writer's claim. Which version best accomplishes this goal?
      options:
        - |
          Some people say that a requirement turns service into one more box to check, and required service puts students in places they would never otherwise go.
        - |
          Although some people say that a requirement turns service into one more box to check, required service puts students in places they would never otherwise go.
        - |
          Required service puts students in places they would never otherwise go, so some people say that a requirement turns service into one more box to check.
        - |
          Some people say that a requirement turns service into one more box to check; required service, some people say, puts students in places they would never otherwise go.
      option_explanations:
        - |
          Joining the ideas with "and" treats the objection and the answer as equal, parallel statements; the reader cannot tell which one the writer endorses.
        - |
          Correct. Placing the objection in a dependent "Although" clause and the writer's claim in the main clause shows that the objection is acknowledged but outweighed.
        - |
          "So" makes the objection a result of the writer's claim, which is illogical; the two ideas stand in contrast, not cause and effect.
        - |
          Repeating "some people say" attributes the writer's own claim to opponents, which garbles the argument.
      answer: 1
      explanation: |
        Skill 8.B (and 7.B): subordination shows rank. Put the concession in the dependent clause and the claim you defend in the independent clause.

