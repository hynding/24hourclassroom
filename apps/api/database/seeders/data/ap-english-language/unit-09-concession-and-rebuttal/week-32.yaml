      points: 1
      prompt: |
        In the last debate, at Alton, Lincoln said that the charges that he wanted war between the free and slave states, or perfect social and political equality of the races, "are false issues, upon which Judge Douglas has tried to force the controversy." He went on: "The real issue in this controversy--the one pressing upon every mind--is the sentiment on the part of one class that looks upon the institution of slavery as a wrong, and of another class that does not look upon it as a wrong." These sentences chiefly serve to
      options:
        - |
          concede that Douglas has defined the debate correctly
        - |
          reframe the whole contest by setting aside the issues Douglas raised and stating what Lincoln presents as the overarching question
        - |
          introduce a new policy proposal that Lincoln has not mentioned before
        - |
          summarise Douglas's arguments without judging them
