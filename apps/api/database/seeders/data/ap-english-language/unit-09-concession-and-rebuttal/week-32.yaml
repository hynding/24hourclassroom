      prompt: |
        You are arguing that your city should add protected bike lanes downtown. An opponent says: *Bike lanes will take away parking and drive shoppers to the mall.* Write a two- or three-sentence response that concedes something true in the objection and then rebuts it. Then name the kind of rebuttal you used (for example, counter-evidence, exposing an assumption, or reframing the issue).
      answer: |
