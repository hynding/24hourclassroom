      points: 1
      stimulus: &w32_turf_draft |
        *The following is a draft of a student's argument essay, written for a town newspaper, about whether the town should replace the grass fields at its public park with artificial turf.*

        (1) Turf is a type of surface. (2) The town should replace the grass soccer fields at Riverside Park with artificial turf. (3) Grass fields at Riverside close for an average of thirty days each spring because of mud, according to the parks department. (4) Turf fields can be used the day after a storm. (5) Turf costs more to install. (6) The parks department estimates that a turf field costs about three times as much as a new grass field, a turf field also saves the cost of mowing, watering and reseeding for ten years. (7) Some parents worry that turf gets much hotter than grass on summer afternoons. (8) The town should ignore them. (9) Each of the fields have lights, so summer games could be moved to the evening. (10) Riverside Park belongs to everyone, and fields that are open all season serve everyone better.
      prompt: |
        The writer wants to replace sentence 1 with an opening that draws in readers of the town newspaper and leads to the claim in sentence 2. Which choice best accomplishes this goal?
      options:
        - |
          Since the beginning of time, people have played games on fields.
        - |
          Artificial turf was first installed in a sports stadium many decades ago.
        - |
          Every spring, families in town learn to check the parks website before practice, because the fields at Riverside Park are closed again.
        - |
          In this essay I will talk about turf and grass.
      option_explanations:
        - |
          A sweeping opening about all of history is generic and says nothing about this town or its fields; it delays the argument without orienting readers.
        - |
          A historical fact about stadiums is accurate in kind but does not connect to the local problem the essay is about.
        - |
          Correct. Skill 2.A: the opening names a local experience readers share (closed fields every spring), which is the exigence for the essay and leads naturally to the proposal in sentence 2.
        - |
          Announcing the topic is not an introduction; it gives readers no reason to care and no sense of the problem.
      answer: 2
      explanation: |
        An introduction suited to the rhetorical situation starts where the audience is. For a town newspaper, that is the local problem readers already know.

