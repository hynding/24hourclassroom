    - slug: u09-w32-q23
      type: short_answer
      topic_code: "7.B"
      source: 'Abraham Lincoln, reply at Galesburg, Lincoln–Douglas debates (1858)'
      points: 2
      prompt: |
        At Galesburg Lincoln said of Douglas's declaration that he did not care whether slavery was voted up or down: "you will see at once that this is perfectly logical, if you do not admit that slavery is wrong. If you do admit that it is wrong, Judge Douglas cannot logically say he don't care whether a wrong is voted up or voted down." In two or three sentences, explain how the paired conditional clauses (if you do not admit... / If you do admit...) show the relationship between Lincoln's ideas and why that structure suits a refutation.
      answer: |
        The two if-clauses set up opposite conditions and attach a different conclusion to each, so the listener sees that Douglas's position stands or falls on a single premise. Because the clauses are parallel, the only thing that changes is whether slavery is admitted to be wrong, which forces each listener to choose a side of that premise; for anyone who believes slavery is wrong, Douglas's indifference becomes illogical.
      explanation: |
        1 point: explains that the dependent if-clauses state contrasting conditions on which the main clauses' conclusions depend. 1 point: explains why that suits refutation (it isolates the premise, puts the choice to the audience, or turns Douglas's logic against him). A response that only identifies the clauses as conditional earns 1 at most.

    - slug: u09-w32-q24
      type: long_answer
      topic_code: "3.C"
      source: 'Abraham Lincoln, reply at Galesburg, Lincoln–Douglas debates (1858)'
      points: 5
      prompt: |
        Write one well-developed analytical paragraph (about 175-225 words) on the passage from Lincoln's reply at Galesburg. Make a claim about how Lincoln combines concession and refutation to answer Douglas, support it with at least two short quotations from different parts of the passage, and explain how each supports your claim.
      answer: |
        Claim: Lincoln refutes Douglas not by denying his logic but by conceding it, which moves the contest onto the single premise his audience is least willing to grant. Evidence 1: he calls Douglas's indifference "perfectly logical, if you do not admit that slavery is wrong." Commentary: the concession sounds generous, but the condition does the work; every listener who thinks slavery wrong must now reject Douglas's position or abandon his own conscience. Evidence 2: the same pattern for property, "That is perfectly logical if the two species of property are alike," followed by "you cannot institute any equality between right and wrong." Commentary: repeating the test across Douglas's positions shows that they share one assumption, so a single moral question refutes them all. Evidence 3 (optional): Lincoln's own position, held "having due regard for its actual existence amongst us." Commentary: by qualifying how he would act, he blocks the charge that he is a reckless radical, so the audience weighs his premise against Douglas's rather than his temperament. Link: conceding logic, he wins on principle.
      explanation: |
        5 points. Claim (1): an arguable claim about how concession and refutation work together (not *Lincoln disagrees with Douglas*). Evidence (2): 1 point for each of two accurate, short quotations from different parts of the passage. Commentary (2): 2 points if both quotations are explained in terms of the claim (how the conceded logic and the exposed premise combine, or how Lincoln's qualification protects his position); 1 point if commentary is thin or explains only one quotation. A paragraph that summarises the passage earns at most 2.
