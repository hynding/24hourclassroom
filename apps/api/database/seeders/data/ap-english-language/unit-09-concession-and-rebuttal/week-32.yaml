guide: guides/week-32.md
guide_description: |
  The last week of the unit and of the year's new material. Rebuttal and refutation in a live contest: Abraham
  Lincoln answering Stephen A. Douglas in the 1858 Illinois Senate debates. How Lincoln shifts the burden of proof
  at Ottawa, and how at Galesburg he refutes a whole policy by exposing its unstated premise, then qualifies his own
  position. Kinds of rebuttal (denial, burden of proof, exposing an assumption, reductio, reframing the issue), a
  writing lesson on choosing the right one, and a review of every skill the course has taught, with a checklist
  for the May exam.
flashcards_description: |
  30 cards: the Lincoln–Douglas debates and Lincoln's rebuttals, the kinds of refutation, and a year-in-review set
  that revisits the rhetorical situation, thesis, reasoning, development, style and grammar skills before the exam.

flashcards:
  - front: Lincoln–Douglas debates → when, where and why
    back: |
      Seven joint debates across Illinois from August to October 1858, in the race for a U.S. Senate seat between Senator Stephen A. Douglas (Democrat) and Abraham Lincoln (Republican). The central question was the spread of slavery into the western territories.
    topic_code: "1.A"
  - front: Douglas's popular sovereignty → the position Lincoln rebutted
    back: |
      Douglas held that the settlers of each territory should decide by vote whether to allow slavery, and that Congress should not decide for them. He said he did not care whether slavery was voted up or down.
    topic_code: "3.A"
  - front: The debate format of 1858 → why every speech was a rebuttal
    back: |
      One candidate opened for an hour, the other replied for an hour and a half, and the first closed for half an hour. Each speech answered the one before it, before crowds of thousands and newspaper reporters.
    topic_code: "1.A"
  - front: Lincoln at Ottawa → his opening line about misrepresentation
    back: |
      He tells the crowd that being misrepresented a little provokes a man, but being misrepresented grossly is more apt to amuse him. The joke lowers the temperature and frames Douglas's charges as too wild to anger him.
    topic_code: "1.B"
  - front: Lincoln's "conscientious" in quotation marks → the irony
    back: |
      Lincoln repeats that he has no doubt Douglas is "conscientious" in his charges. The quotation marks and the repetition turn a courteous word into an ironic one: Douglas may believe it, but he has no proof.
    topic_code: "7.A"
  - front: Lincoln on proving a negative → the burden-of-proof rebuttal
    back: |
      At Ottawa he says a man cannot prove a negative, but has a right to demand that whoever makes an affirmative charge offer proof. He shifts the burden of proof back to Douglas instead of trying to disprove the charge.
    topic_code: "3.C"
  - front: Burden of proof → who carries it in an argument
    back: |
      The person who makes a claim, especially a positive charge, is obliged to support it. A rebuttal can point out that the other side has offered no evidence, rather than proving the charge false.
    topic_code: "3.C"
  - front: Lincoln at Galesburg → "perfectly logical, if you do not admit that slavery is wrong"
    back: |
      Lincoln concedes that Douglas's positions are logical, and then shows that each is logical only on one unstated premise: that slavery is not wrong. Grant the premise is false, and every position falls.
    topic_code: "3.C"
  - front: Exposing an unstated premise → the refutation strategy
    back: |
      Identify an assumption the opponent's argument needs but never states, and show that the audience does not share it. The argument collapses without a direct attack on its logic.
    topic_code: "3.C"
  - front: Lincoln's "cannot logically say he don't care whether a wrong is voted up or voted down"
    back: |
      The heart of the Galesburg refutation: no one can be indifferent to a wrong. Lincoln turns Douglas's own phrase into proof of the assumption hidden behind it.
    topic_code: "3.C"
  - front: Lincoln's own qualified position at Galesburg
    back: |
      He calls slavery a moral, social and political evil, while having due regard for its actual existence, the difficulty of ending it and the constitutional obligations around it; he wants to stop its spread and hopes for its end.
    topic_code: "4.C"
  - front: Lincoln at Alton → "false issues" and "the real issue"
    back: |
      In the last debate Lincoln dismisses the charges that he wants war between the states as false issues, then names the real issue: whether slavery is regarded as a wrong. Reframing the question is itself a rebuttal.
    topic_code: "3.B"
  - front: Kinds of rebuttal → five to know
    back: |
      Denial with evidence (it is not true, and here is why); burden of proof (you have shown nothing); exposing an assumption; reductio ad absurdum (follow the argument to an absurd result); reframing (that is not the real question).
    topic_code: "3.C"
  - front: Reductio ad absurdum → how it refutes
    back: |
      It accepts the opponent's principle for argument's sake and follows it to a conclusion the opponent cannot accept. Mill's opponents use it in reverse when they ask whether we should lay on no taxes and make no wars.
    topic_code: "3.C"
  - front: Choosing a rebuttal → the question to ask
    back: |
      What does the objection depend on? A factual claim calls for counter-evidence; an analogy calls for showing where it breaks; a hidden value calls for naming it. Answer the objection where it rests.
    topic_code: "4.C"
  - front: Rebuttal tone → why civility persuades in a debate
    back: |
      The audience includes undecided listeners. A rebuttal that sounds calm and fair (Lincoln's jokes, Mill's patience) makes the writer seem the reasonable party, while sneering at opponents tells the audience who is losing.
    topic_code: "7.A"
  - front: Year in review → the six parts of the rhetorical situation
    back: |
      Exigence (what prompts the text), audience, writer, purpose, context and message. Every reading question on the exam rests on these.
    topic_code: "1.A"
  - front: Year in review → audience's beliefs, values and needs
    back: |
      Skills 1.B and 2.B: explain how a writer appeals to what an audience already believes or needs, and write with your own audience in mind. Madison starts from his readers' fear of faction; Lincoln from his listeners' sense of right and wrong.
    topic_code: "1.B"
  - front: Year in review → introductions and conclusions that fit the situation
    back: |
      Skill 2.A: an introduction orients the reader to the issue and the writer's position; a conclusion explains why the argument matters, beyond restating the thesis. Both depend on purpose and audience.
    topic_code: "2.A"
  - front: Year in review → claim and evidence in one paragraph
    back: |
      Skills 3.A and 4.A: a paragraph opens with a claim that needs defending, supplies specific evidence and explains how the evidence supports the claim. Evidence without commentary is a list.
    topic_code: "4.A"
  - front: Year in review → a thesis that requires proof
    back: |
      Skills 3.B and 4.B: a defensible, arguable thesis that a reasonable person could dispute, often previewing the line of reasoning. A fact or a topic is not a thesis.
    topic_code: "4.B"
  - front: Year in review → line of reasoning and commentary
    back: |
      Skills 5.A and 6.A: the sequence of claims that leads to the thesis, held together by commentary that explains each step. The essay rubric's evidence-and-commentary row is worth four of six points.
    topic_code: "6.A"
  - front: Year in review → organization and transitions
    back: |
      Skills 5.B and 6.B: the order of ideas should reflect the reasoning, and transitions should name relationships (because, however, as a result, even so) rather than merely connect.
    topic_code: "6.B"
  - front: Year in review → the six methods of development
    back: |
      Skills 5.C and 6.C: narration, description, comparison, definition, cause and effect, classification. Madison defines faction; Lincoln compares slavery to a cancer that must not be spread.
    topic_code: "5.C"
  - front: Year in review → word choice, comparisons and syntax
    back: |
      Skills 7.A and 8.A: diction, figurative comparisons and sentence patterns create tone. Explain the tone with a precise adjective and show which choices produce it.
    topic_code: "7.A"
  - front: Year in review → clauses that show relationships
    back: |
      Skills 7.B and 8.B: independent clauses carry main ideas; dependent clauses (although, because, if, when) show how ideas relate. Put the idea you endorse in the main clause.
    topic_code: "7.B"
  - front: Year in review → grammar and mechanics for clarity
    back: |
      Skills 7.C and 8.C: punctuation for emphasis and clarity, parallel structure, clear modifiers and agreement. On revision questions, choose the option that is correct and clearest, not the longest.
    topic_code: "8.C"
  - front: Year in review → qualification in one sentence
    back: |
      Skills 3.C and 4.C: limit claims to what the evidence supports (modifiers, conditions) and answer the strongest objection fairly (concession, rebuttal, refutation).
    topic_code: "4.C"
  - front: May 2027 exam → the essay rubric in three rows
    back: |
      Thesis 0-1, evidence and commentary 0-4, sophistication 0-1, for 6 points per essay. A fair counterargument answered well is one of the surest routes to the sophistication point.
    topic_code: "4.C"
  - front: May 2027 exam → Section I in numbers
    back: |
      45 multiple-choice questions in 60 minutes, 45% of the score: 23-25 reading questions on passages and 20-22 writing questions on drafts. Read the stem first on revision sets; the writer's goal is in it.
    topic_code: "3.C"

quiz:
  description: |
    24 questions · about 40 minutes · a set of six questions on Lincoln's reply at Galesburg, four on his opening
    at Ottawa, a six-question revision set on a full student draft that reviews the year's writing skills, then
    questions across the unit and the course. Multiple choice, select-all and true/false items are graded at once;
    the fill-in-the-blank items are matched automatically; the two short answers and the analytical paragraph are
    graded by your teacher against the model answer and scoring notes.
  questions:
    # ---- Passage set: Lincoln's reply at Galesburg
    - slug: u09-w32-q01
      type: multiple_choice
      topic_code: "3.C"
      source: 'Abraham Lincoln, reply at Galesburg, Lincoln–Douglas debates (1858)'
      points: 1
      stimulus: &galesburg |
        *The following passage is from Abraham Lincoln's reply to Stephen A. Douglas at Galesburg, Illinois, on October 7, 1858, the fifth of their seven debates in the race for a U.S. Senate seat. Douglas held that the settlers of each territory should decide for themselves whether to allow slavery.*

        The Judge tells, in proceeding, that he is opposed to making any odious distinctions between free and slave States. I am altogether unaware that the Republicans are in favor of making any odious distinctions between the free and slave States. But there is still a difference, I think, between Judge Douglas and the Republicans in this. I suppose that the real difference between Judge Douglas and his friends, and the Republicans on the contrary, is, that the Judge is not in favor of making any difference between slavery and liberty; that he is in favor of eradicating, of pressing out of view, the questions of preference in this country for free or slave institutions; and consequently every sentiment he utters discards the idea that there is any wrong in slavery. Everything that emanates from him or his coadjutors in their course of policy carefully excludes the thought that there is anything wrong in slavery. All their arguments, if you will consider them, will be seen to exclude the thought that there is anything whatever wrong in slavery. If you will take the Judge's speeches, and select the short and pointed sentences expressed by him,--as his declaration that he "don't care whether slavery is voted up or down,"--you will see at once that this is perfectly logical, if you do not admit that slavery is wrong. If you do admit that it is wrong, Judge Douglas cannot logically say he don't care whether a wrong is voted up or voted down. Judge Douglas declares that if any community wants slavery they have a right to have it. He can say that logically, if he says that there is no wrong in slavery; but if you admit that there is a wrong in it, he cannot logically say that anybody has a right to do wrong. He insists that upon the score of equality the owners of slaves and owners of property--of horses and every other sort of property--should be alike, and hold them alike in a new Territory. That is perfectly logical if the two species of property are alike and are equally founded in right. But if you admit that one of them is wrong, you cannot institute any equality between right and wrong. And from this difference of sentiment,--the belief on the part of one that the institution is wrong, and a policy springing from that belief which looks to the arrest of the enlargement of that wrong, and this other sentiment, that it is no wrong, and a policy sprung from that sentiment, which will tolerate no idea of preventing the wrong from growing larger, and looks to there never being an end to it through all the existence of things,--arises the real difference between Judge Douglas and his friends on the one hand and the Republicans on the other. Now, I confess myself as belonging to that class in the country who contemplate slavery as a moral, social, and political evil, having due regard for its actual existence amongst us and the difficulties of getting rid of it in any satisfactory way, and to all the constitutional obligations which have been thrown about it; but, nevertheless, desire a policy that looks to the prevention of it as a wrong, and looks hopefully to the time when as a wrong it may come to an end.
      prompt: |
        Lincoln's main strategy for rebutting Douglas in the passage is to
      options:
        - |
          prove with statistics that slavery harms the economy of the territories
        - |
          grant that Douglas's positions are logical, then show that each depends on the unstated premise that slavery is not wrong
        - |
          accuse Douglas of lying about his own record in the Senate
        - |
          agree with Douglas that the question of slavery should be pressed out of view
      option_explanations:
        - |
          The passage contains no numbers or economic evidence; its argument is about logic and moral premises.
        - |
          Correct. Lincoln repeatedly calls Douglas's positions "perfectly logical" and then adds the condition: logical only "if you do not admit that slavery is wrong." Exposing the hidden premise refutes the whole policy at once.
        - |
          Lincoln does not accuse Douglas of lying here; he takes Douglas's statements at face value and examines what they assume.
        - |
          Lincoln describes Douglas as wanting to press the question "out of view" in order to criticise that aim, not to share it.
      answer: 1
      explanation: |
        Skill 3.C: a concession can be strategic. By granting the logic, Lincoln moves the dispute to the one premise his audience is least willing to accept.

    - slug: u09-w32-q02
      type: multiple_choice
      topic_code: "5.A"
      source: 'Abraham Lincoln, reply at Galesburg, Lincoln–Douglas debates (1858)'
      points: 1
      stimulus: *galesburg
      prompt: |
        The middle of the passage takes three of Douglas's positions in turn (indifference to the vote, a community's right to have slavery, and equality of property). How does this sequence support Lincoln's line of reasoning?
      options:
        - |
          It shows that Douglas has contradicted himself three times.
        - |
          It moves from Douglas's weakest position to his strongest, so that the last is left unanswered.
        - |
          It lists Douglas's policies without comment, leaving listeners to judge them.
        - |
          It applies one test to each position, showing that all three rest on the same premise, which makes the real difference between the parties a single moral question.
      option_explanations:
        - |
          Lincoln says the positions are consistent with one another ("perfectly logical"); his charge is that they share an assumption, not that they contradict each other.
        - |
          Each position is answered in the same way, and none is left standing; the sequence is a pattern, not a climb to an unanswered point.
        - |
          Every position is followed by commentary ("He can say that logically, if..."), so the positions are not left without comment.
        - |
          Correct. The repeated pattern (logical if slavery is not wrong; illogical if it is) builds to the conclusion that the parties differ on "the belief on the part of one that the institution is wrong." Repetition turns three examples into one argument.
      answer: 3
      explanation: |
        Skill 5.A: a line of reasoning can be built by applying the same test to several cases. The pattern is the proof.

    - slug: u09-w32-q03
      type: multiple_choice
      topic_code: "7.A"
      source: 'Abraham Lincoln, reply at Galesburg, Lincoln–Douglas debates (1858)'
      points: 1
      stimulus: *galesburg
      prompt: |
        The repetition of "logical" and "logically" throughout the passage contributes most to a tone that is
      options:
        - |
          bitter and accusatory
        - |
          playful and teasing
        - |
          reasoned and relentless, presenting the refutation as a matter of logic rather than of personal feeling
        - |
          uncertain and exploratory
      option_explanations:
        - |
          Lincoln never insults Douglas in the passage; the repeated word is about logic, and the passage's only strong feeling is moral, not personal.
        - |
          Unlike his opening at Ottawa, the passage has no jokes; it is steady argument on a grave subject.
        - |
          Correct. The word recurs like a refrain, each time attached to a condition. The effect is cool and inexorable: Lincoln appears to be following Douglas's own logic to its end, not attacking the man.
        - |
          The conditional structure is not tentative; each condition leads to a firm conclusion ("he cannot logically say").
      answer: 2
      explanation: |
        Skill 7.A: a repeated word can set tone. Here it frames moral disagreement as a matter of reasoning, which makes Lincoln's conclusion harder to dismiss as partisan.

    - slug: u09-w32-q04
      type: multiple_choice
      topic_code: "1.A"
      source: 'Abraham Lincoln, reply at Galesburg, Lincoln–Douglas debates (1858)'
      points: 1
      stimulus: *galesburg
      prompt: |
        The passage opens by restating a claim Douglas has just made ("The Judge tells, in proceeding, that he is opposed to making any odious distinctions between free and slave States"). This opening reflects which feature of the rhetorical situation?
      options:
        - |
          Lincoln is speaking immediately after Douglas, before the same crowd, so his speech is organised as a series of replies to what his opponent has just said.
        - |
          Lincoln is writing a letter to Douglas in private and summarising their earlier conversation.
        - |
          Lincoln is addressing the Senate, where Douglas's statement is part of the official record.
        - |
          Lincoln is writing for readers who have never heard of Douglas.
      option_explanations:
        - |
          Correct. In the joint debates each speaker answered the other in turn. Restating the opponent's claim before answering it tells the live audience which point is now under discussion.
        - |
          The debates were public speeches before large crowds; the address to "you" throughout the passage is to listeners, not to Douglas alone.
        - |
          Neither man was speaking in the Senate; these were campaign debates held in Illinois towns.
        - |
          Lincoln's audience had just heard Douglas speak; the opening assumes, rather than supplies, their knowledge of him.
      answer: 0
      explanation: |
        Skill 1.A: context and exigence shape structure. A debate reply begins from the opponent's words because the exigence is the speech the audience has just heard.

    - slug: u09-w32-q05
      type: multi_select
      topic_code: "3.C"
      source: 'Abraham Lincoln, reply at Galesburg, Lincoln–Douglas debates (1858)'
      points: 2
      partial_credit: true
      stimulus: *galesburg
      prompt: |
        Which TWO statements accurately describe how Lincoln qualifies his own position in the final sentence of the passage? Select two.
      options:
        - |
          He limits his opposition by acknowledging slavery's actual existence, the difficulty of ending it and the constitutional obligations around it.
        - |
          He states his policy as preventing slavery's spread and hoping for its eventual end, rather than demanding its immediate abolition.
        - |
          He withdraws his claim that slavery is a wrong.
        - |
          He admits that Douglas's policy is the more practical one.
      option_explanations:
        - |
          Correct. The participial phrase "having due regard for its actual existence amongst us" and what follows acknowledges practical and legal limits, which makes his position harder to caricature as reckless.
        - |
          Correct. "Desire a policy that looks to the prevention of it" and "looks hopefully to the time" describe a limited, long-term aim, a qualification of how and when he would act.
        - |
          He calls slavery "a moral, social, and political evil"; the qualifications concern policy, not the moral claim.
        - |
          Nothing in the sentence praises Douglas's policy; "but, nevertheless" turns from the acknowledged difficulties back to Lincoln's own aim.
      answer: [0, 1]
      explanation: |
        Skill 3.C: qualifying a position can protect it from an opponent's caricature. Lincoln qualifies how he would act without qualifying what he believes.

    - slug: u09-w32-q06
      type: true_false
      topic_code: "3.C"
      source: 'Abraham Lincoln, reply at Galesburg, Lincoln–Douglas debates (1858)'
      points: 1
      stimulus: *galesburg
      prompt: |
        True or false: Lincoln concedes that Douglas's positions are consistent with one another, given Douglas's own premise.
      answer: true
      explanation: |
        True. Lincoln repeatedly grants that Douglas's statements are "perfectly logical" if slavery is not wrong. The concession is the setup for his refutation: he moves the argument from Douglas's logic, which he grants, to Douglas's premise, which he denies.

    # ---- Passage set: Lincoln's opening at Ottawa
    - slug: u09-w32-q07
      type: multiple_choice
      topic_code: "3.C"
      source: 'Abraham Lincoln, reply at Ottawa, Lincoln–Douglas debates (1858)'
      points: 1
      stimulus: &ottawa |
        *The following passages are from Abraham Lincoln's reply to Stephen A. Douglas at Ottawa, Illinois, on August 21, 1858, the first of their seven debates. Douglas had charged that Lincoln and Lyman Trumbull made a secret bargain in 1854 to divide Illinois's Senate seats and to abolitionize their old parties.*

        MY FELLOW-CITIZENS:--When a man hears himself somewhat misrepresented, it provokes him, at least, I find it so with myself; but when misrepresentation becomes very gross and palpable, it is more apt to amuse him. The first thing I see fit to notice is the fact that Judge Douglas alleges, after running through the history of the old Democratic and the old Whig parties, that Judge Trumbull and myself made an arrangement in 1854, by which I was to have the place of General Shields in the United States Senate, and Judge Trumbull was to have the place of Judge Douglas. Now, all I have to say upon that subject is that I think no man not even Judge Douglas can prove it, because it is not true. I have no doubt he is "conscientious" in saying it. As to those resolutions that he took such a length of time to read, as being the platform of the Republican party in 1854, I say I never had anything to do with them, and I think Trumbull never had. Judge Douglas cannot show that either of us ever did have anything to do with them.

        [...]

        Now, about this story that Judge Douglas tells of Trumbull bargaining to sell out the old Democratic party, and Lincoln agreeing to sell out the old Whig party, I have the means of knowing about that: Judge Douglas cannot have; and I know there is no substance to it whatever. Yet I have no doubt he is "conscientious" about it. I know that after Mr. Lovejoy got into the Legislature that winter, he complained of me that I had told all the old Whigs of his district that the old Whig party was good enough for them, and some of them voted against him because I told them so. Now, I have no means of totally disproving such charges as this which the Judge makes. A man cannot prove a negative; but he has a right to claim that when a man makes an affirmative charge, he must offer some proof to show the truth of what he says. I certainly cannot introduce testimony to show the negative about things, but I have a right to claim that if a man says he knows a thing, then he must show how he knows it. I always have a right to claim this, and it is not satisfactory to me that he may be "conscientious" on the subject.
      prompt: |
        In the second paragraph, the sentences beginning "A man cannot prove a negative" chiefly serve to
      options:
        - |
          admit that Douglas's charge is probably true
        - |
          introduce testimony from witnesses who were present in 1854
        - |
          shift the burden of proof to Douglas, who made the charge and has offered no evidence for it
        - |
          change the subject from the alleged bargain to the history of the Whig party
      option_explanations:
        - |
          Lincoln concedes only that he cannot totally disprove the charge, not that it is true; in the same paragraph he says he knows "there is no substance to it whatever."
        - |
          Lincoln says the opposite: "I certainly cannot introduce testimony to show the negative." His point is that he should not have to.
        - |
          Correct. Lincoln grants a limit (no one can prove a negative) and turns it into a demand: whoever "makes an affirmative charge" must "offer some proof." The rebuttal attacks the charge's lack of support rather than trying to disprove it.
        - |
          The Whig party is mentioned only as part of Douglas's story; the sentences in question are about who must prove what.
      answer: 2
      explanation: |
        A burden-of-proof rebuttal is the right tool when an opponent's claim cannot be disproved but has not been proved either.

    - slug: u09-w32-q08
      type: multiple_choice
      topic_code: "7.A"
      source: 'Abraham Lincoln, reply at Ottawa, Lincoln–Douglas debates (1858)'
      points: 1
      stimulus: *ottawa
      prompt: |
        Lincoln three times says that Douglas is "conscientious," each time placing the word in quotation marks. The effect is best described as
      options:
        - |
          sincere praise of Douglas's honesty, offered to show good sportsmanship
        - |
          a sign that Lincoln is quoting a newspaper's description of Douglas
        - |
          an admission that Lincoln himself is uncertain about the facts
        - |
          ironic courtesy: Lincoln grants that Douglas may believe the charge while implying that belief without proof is worth little
      option_explanations:
        - |
          Repetition and quotation marks undercut the praise; the last instance says it is "not satisfactory" that Douglas may be conscientious, which is not sincere praise.
        - |
          The passage gives no source for the word; the marks signal Lincoln's ironic distance, not a citation.
        - |
          Lincoln is emphatic about the facts ("it is not true," "I know there is no substance to it"); the word describes Douglas's state of mind, not Lincoln's doubt.
        - |
          Correct. The polite word becomes a refrain that the crowd could hear as a joke. Lincoln stays courteous on the surface while suggesting that sincerity is no substitute for evidence.
      answer: 3
      explanation: |
        Skill 7.A: repetition can turn a word ironic. Irony let Lincoln rebut without the open hostility that might cost him the crowd's sympathy.

    - slug: u09-w32-q09
      type: multiple_choice
      topic_code: "3.A"
      source: 'Abraham Lincoln, reply at Ottawa, Lincoln–Douglas debates (1858)'
      points: 1
      stimulus: *ottawa
      prompt: |
        What evidence does Lincoln offer for his claim that the story of the bargain has "no substance"?
      options:
        - |
          Documents signed by Trumbull denying the arrangement
        - |
          His own direct knowledge of events, which he contrasts with Douglas's lack of it
        - |
          A vote count from the 1854 legislature
        - |
          The testimony of General Shields
      option_explanations:
        - |
          No documents are produced; Lincoln reads nothing in these paragraphs and refers to Trumbull only as a party to the alleged bargain.
        - |
          Correct. "I have the means of knowing about that: Judge Douglas cannot have." Lincoln's evidence is his position as a participant, set against Douglas's position as an outsider, which also prepares the burden-of-proof point.
        - |
          No vote count is given; Lovejoy's complaint about lost votes is an anecdote, not a tally.
        - |
          Shields is named only as the senator whose seat Lincoln supposedly wanted; he gives no testimony.
      answer: 1
      explanation: |
        Skill 3.A: identify the kind of evidence. Personal knowledge is weak evidence by itself, which is why Lincoln pairs it with the claim that Douglas, not he, must prove the charge.

    - slug: u09-w32-q10
      type: multiple_choice
      topic_code: "1.B"
      source: 'Abraham Lincoln, reply at Ottawa, Lincoln–Douglas debates (1858)'
      points: 1
      stimulus: *ottawa
      prompt: |
        Lincoln's opening sentence ("When a man hears himself somewhat misrepresented, it provokes him...") most likely appeals to the audience by
      options:
        - |
          drawing on a common experience with good humour, so that listeners treat Douglas's charges as too extravagant to be taken seriously
        - |
          warning the crowd that he is about to lose his temper
        - |
          flattering Douglas as a skilled speaker
        - |
          apologising for misrepresenting Douglas in an earlier speech
      option_explanations:
        - |
          Correct. Skill 1.B: everyone knows the feeling of being misrepresented. By saying that gross misrepresentation amuses rather than angers him, Lincoln invites the crowd to laugh with him at the charges before he answers them.
        - |
          The sentence says the opposite: gross misrepresentation is "more apt to amuse him." He signals calm, not anger.
        - |
          The sentence describes misrepresentation, which is hardly a compliment to the person who made it.
        - |
          Lincoln is the one who has been misrepresented; nothing suggests an apology.
      answer: 0
      explanation: |
        An opening that shares an experience with the audience and sets a confident tone makes the rebuttal that follows easier to accept.

    # ---- Revision set: the year's writing skills on one draft
