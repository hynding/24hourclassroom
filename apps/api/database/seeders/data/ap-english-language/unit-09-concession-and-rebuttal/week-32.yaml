      prompt: |
        Which revision of sentence 6 corrects its punctuation error and best shows the relationship between its two ideas?
      options:
        - |
          The parks department estimates that a turf field costs about three times as much as a new grass field; however, a turf field also saves the cost of mowing, watering and reseeding for ten years.
        - |
          The parks department estimates that a turf field costs about three times as much as a new grass field a turf field also saves the cost of mowing, watering and reseeding for ten years.
        - |
