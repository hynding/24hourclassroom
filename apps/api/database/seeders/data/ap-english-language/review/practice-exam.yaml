      - |
        This is a general statement about science that neither draws a conclusion from the examples nor links them to the ordinance.
      - |
        Correct. The sentence draws the conclusion the examples point to (wasted light harms living things) and ties it back to the proposal (“shielding would prevent” it). That is commentary: it explains why the evidence matters for the argument.
