    prompt: |
      The brief narrative of the travellers and the old woman in the mountain hut (sixth and seventh paragraphs) functions primarily to
    options:
      - "illustrate, through a concrete case, how a woman denied a range of choices may spend a lifetime acting on someone else's reasons"
      - "prove that women prefer to live in isolated places"
      - "criticize the travellers for intruding on the couple's privacy"
      - "show that the old woman's husband was cruel to her"
    option_explanations:
