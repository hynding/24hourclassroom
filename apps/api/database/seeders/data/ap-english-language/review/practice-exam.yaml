  - slug: review-practice-q32
    type: multiple_choice
    topic_code: "8.B"
    source: written for this course
    points: 1
    stimulus: *darksky
    prompt: |
      The writer wants to combine sentences 12 and 13 to show that the crashes are a consequence of birds being drawn off course. Which version best accomplishes this goal?
    options:
      - "Migrating birds use the stars to navigate, and bright lights draw them off course, and many of them crash into lighted buildings."
      - "Migrating birds use the stars to navigate, so bright lights draw them off course, often into the lighted buildings where many of them crash."
      - "Migrating birds use the stars to navigate, bright lights draw them off course, many of them crash into lighted buildings."
      - "Although migrating birds use the stars to navigate, bright lights draw them off course, and many of them crash into lighted buildings."
    option_explanations:
      - |
        A string of clauses joined by “and” treats every idea as equal and parallel, so the reader cannot tell that the crashes result from the confusion.
      - |
        Correct. “So” makes the dependence on starlight the reason the lights can mislead the birds, and the closing phrase places the crashes at the end of that chain. The combined sentence shows cause and consequence instead of listing facts.
      - |
        Three independent clauses joined only by commas form a comma splice, and the punctuation signals no relationship among them.
      - |
        “Although” sets the first clause against the second, but using the stars is not in tension with being drawn off course; it is why the lights mislead them.
    answer: 1

  - slug: review-practice-q33
    type: multiple_choice
    topic_code: "4.C"
    source: written for this course
    points: 1
    stimulus: *darksky
    prompt: |
      The writer wants to add a clause at the beginning of sentence 16 that grants the residents' concern some merit before answering it. Which choice best accomplishes this goal?
    options:
      - "It is true that people feel safer on a well-lit street, but glare"
      - "Since these residents are simply afraid of the dark, glare"
      - "Because no one has ever been hurt on a dark street, glare"
      - "As everyone already knows, glare"
    option_explanations:
      - |
        Correct. The clause concedes something real (people do feel safer where it is light) and then turns with “but” to the writer's rebuttal about glare. Granting part of the objection makes the answer more credible to the residents who raised it.
      - |
        Belittling the residents as “afraid of the dark” dismisses the concern instead of granting it merit, and it would alienate the audience the writer needs to persuade.
      - |
        This makes an absolute claim that is almost certainly false and that the writer cannot support. It denies the concern rather than qualifying the response to it.
      - |
        Claiming that “everyone already knows” the writer's point concedes nothing and assumes agreement the residents plainly do not share.
    answer: 0

