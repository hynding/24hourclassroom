        The heroines are known for courage in war, not for any connection to property law. The allusion is to deeds, not to legal codes.
      - |
        The examples cut against that belief: these women left the home and became famous for it. Fuller uses them to widen what readers think women may do.
      - |
        Correct. Fuller's readers already praised these women; by placing a woman sea-captain beside them, she asks readers to extend an admiration they already feel. The allusion grounds a startling claim in values her audience holds.
