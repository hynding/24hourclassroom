      - "Frogs make a lot of noise at night."
      - "Scientists study animals in many different ways."
      - "Because so many creatures depend on the dark to find their way, feed or breed, the light we waste does real harm to the living world around us, harm that shielding would prevent at no extra cost."
    option_explanations:
      - |
        This adds a new fact about one animal rather than explaining what the paragraph's examples show. It is evidence, not commentary.
      - |
