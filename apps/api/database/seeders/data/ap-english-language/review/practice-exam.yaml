  - slug: review-practice-q45
    type: multiple_choice
    topic_code: "7.C"
    source: "Margaret Fuller, Woman in the Nineteenth Century (1845)"
    points: 1
    stimulus: *fuller
    prompt: |
      In the fifth paragraph, the dash in “I reply--any” primarily serves to
    options:
      - "mark an interruption by the imagined questioner"
      - "create a pause that throws emphasis onto the single, unqualified word that answers the question"
      - "signal that Fuller has omitted part of her answer"
      - "separate two independent clauses that could each stand as sentences"
    option_explanations:
      - |
        No one else speaks after the dash; the words that follow are Fuller's own answer. Dashes can mark interruptions, but not here.
      - |
        Correct. The dash holds the reader for a beat before “any,” so the one-word answer lands with force. The punctuation enacts the absence of qualification: no list of permitted offices, only “any,” which the next sentence tests with the most unlikely case.
      - |
        Fuller's answer is complete: “any” is the whole of it, and she then expands on it. The dash does not mark an omission.
      - |
        “Any” is a single word, not an independent clause, so the dash is not joining two sentences.
    answer: 1

  # ======================================================================
  # Section II: three essays, 6 points each (teacher-graded)
  # ======================================================================
  - slug: review-practice-q46
    type: long_answer
    topic_code: "4.A"
    source: written for this course
    points: 6
    stimulus: |
      *The six sources below were written for this course. The people, places and figures in them are invented, and none is a real publication or person.*

      **Source A.** *From a feature article in a regional newspaper about a fare-free bus pilot in a mid-sized city.* When the city stopped charging bus fares for a two-year trial, the change was visible within weeks. Boarding took less time because no one was counting out coins, and buses on the busiest routes kept closer to their schedules. A route supervisor said that riders who had given up on the bus years earlier were coming back, and that drivers no longer spent their shifts arguing about fares.

      **Source B.** *From a memo by a city budget office to the city council.* Fares currently cover about 18 percent of the cost of running the bus system; taxes and state grants pay the rest. Ending fares would remove about $9 million a year from the transit budget. Some of that would be recovered, since the system spends about $1.5 million a year on fare machines, cash handling and fare enforcement. The remaining $7.5 million would have to come from the general fund, which also pays for parks, libraries and road repair.

      **Source C.** *A table from a transit agency's report on the same fare-free pilot (figures invented for this exam), described in words.* The table has three columns: the year before the pilot, pilot year 1 and pilot year 2. Average weekday boardings rose from 21,400 to 29,100 and then to 30,600. The share of buses arriving on time rose from 78 percent to 84 percent and then fell slightly to 83 percent. Rider complaints about crowding rose from 12 a month to 41 a month, then fell to 37 a month.

      **Source D.** *From an opinion column by a researcher who studies transportation at a state university.* Ask people who do not ride the bus why they stay away, and few mention the fare. They mention the wait. A bus that comes every forty minutes does not become useful by becoming free. A city with a fixed transit budget has to choose, and for most non-riders the better buy is more frequent, more reliable service, not a lower price for the service that already fails them.

      **Source E.** *From a transcript of a community radio program in which residents describe how they get to work.* A home health aide explained that she rides two buses each way to reach her clients. Before the fares ended, her monthly pass cost about as much as a week's groceries. Without it, she said, she had been able to accept extra visits across town that she used to turn down, because the trips no longer cost her money before she had earned any.

      **Source F.** *From an essay by an economist in a magazine about public policy.* Free fares help everyone who rides, including the many riders who could easily pay. A reduced fare for low-income residents, verified the way school-lunch eligibility is, would deliver most of the benefit to the people who need it for a fraction of the cost, leaving money to add buses on crowded routes. Fairness is not the same as uniformity.
    prompt: |
      Question 1: Synthesis. Suggested time: 15 minutes to read the sources and plan, and 40 minutes to write.

      Most American cities pay for their public bus systems partly with fares and partly with taxes. In recent years some cities have stopped charging fares altogether, arguing that free buses would attract riders, help workers with low incomes and ease traffic. Others have kept fares, arguing that the money is better spent on more and better service.

      Carefully read the six sources above, including the introductory information for each source. Then synthesize material from at least three of the sources and incorporate it into a coherent, well-developed essay that argues your position on whether a city should make its public buses free to ride.

      In your response you should:
      - Respond to the prompt with a thesis that presents a defensible position.
      - Select and use evidence from at least three of the provided sources to support your line of reasoning. Indicate clearly the sources used through direct quotation, paraphrase or summary. Sources may be cited as Source A, Source B, and so on, or by using the description of each source.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Model thesis (qualified): A city should not simply abolish fares; it should make buses free for residents who need help paying and spend what remains on more frequent service, because the gains of fare-free transit come mostly from removing a barrier for low-income riders and speeding boarding, while its costs fall on a general fund and on the riders who most need better service.

      Line of reasoning: (1) The case for free fares is real. Ridership rose by about 40 percent over the pilot (Source C, 21,400 to 30,600 weekday boardings), boarding sped up and on-time arrivals improved (Sources A and C), and for a worker like the home health aide a pass cost a week's groceries, so free fares let her earn more (Source E). (2) But the price is high and the gains uneven. The general fund would lose about $7.5 million a year that also pays for parks, libraries and roads (Source B), and crowding complaints tripled (Source C), which suggests the system cannot absorb new riders without more buses. (3) Price is not the main barrier for most non-riders; waiting is (Source D), so money spent replacing fares cannot be spent on frequency. (4) A targeted fare helps the riders in Source E at a fraction of the cost and frees money for service (Source F); speedier boarding can be kept with tap cards. Conclusion: fairness means aiming help where it is needed and spending the rest on the service itself.

      Other defensible positions: full fare-free transit (stressing Sources A, C and E and treating B's cost as an investment); keeping fares and investing in frequency (stressing B, D and F). Any position earns credit if it is defended with at least three sources and explained commentary.
    explanation: |
      Six points, scored on the AP English Language 6-point synthesis rubric as applied to this prompt.

      Row A, Thesis (0-1). 1 point for a defensible thesis that takes a position on whether a city should make its buses free, for example that it should, that it should not, or that it should under stated conditions (free fares for low-income riders only, or free fares only once service is frequent). The thesis may be more than one sentence and may appear anywhere, but must make a claim that requires defense. 0 points for a thesis that only restates the prompt (“There are good arguments on both sides of free buses”), summarizes the sources, or takes no position.

      Row B, Evidence and Commentary (0-4).
      - 4: Provides specific evidence from at least three sources to support all claims in a line of reasoning, and consistently explains how the evidence supports it. A 4 does not merely report that ridership rose (Source C); it explains what the rise means, weighs it against the cost (Source B) or against crowding (Source C), and uses the sources in conversation with each other, for instance setting the aide's experience (Source E) against the researcher's claim that price matters little to most non-riders (Source D), or using Source F's targeted fare to resolve the tension.
      - 3: Provides specific evidence from at least three sources to support all claims in a line of reasoning, and explains how some of the evidence supports it, but some commentary is uneven or some sources are summarized rather than used.
      - 2: Provides evidence from or references at least three sources, but the evidence is general or the commentary repeats or summarizes the sources without explaining how they support the position (a tour of the sources one by one, A through F, is typical).
      - 1: Provides evidence from or references at least two sources, and summarizes it with little or no commentary.
      - 0: Restates the thesis, or uses one source or none.
      An essay that draws on only one or two sources cannot score above 1 in Row B. Misreading a source (for example claiming that Source C shows crowding fell during the pilot) weakens Row B in proportion to how much the argument depends on it.

      Row C, Sophistication (0-1). 1 point for a consistently sophisticated argument. For this prompt that might mean: weighing the competing values in the sources (access versus quality of service, universality versus targeting) and explaining why one should prevail; noticing the limits of the evidence (one pilot city, figures that show crowding rising with ridership, a single interview standing for many riders) and qualifying the claim accordingly; explaining the trade-off that a fixed budget forces (Sources B and D) rather than treating money as unlimited; or a consistently vivid, persuasive style. Merely mentioning that “some people disagree” does not earn the point.

  - slug: review-practice-q47
    type: long_answer
    topic_code: "6.A"
    source: "John Muir, Our National Parks (1901)"
    points: 6
    stimulus: |
      *The following passage opens the first chapter of John Muir's* Our National Parks *(1901), a book of sketches first published in the* Atlantic Monthly*. In his preface Muir says he wrote them to show the beauty and usefulness of the wild forest reservations and parks of the West, and to move readers to visit them so that their preservation would be made sure.*

      The tendency nowadays to wander in wildernesses is delightful to see. Thousands of tired, nerve-shaken, over-civilized people are beginning to find out that going to the mountains is going home; that wildness is a necessity; and that mountain parks and reservations are useful not only as fountains of timber and irrigating rivers, but as fountains of life. Awakening from the stupefying effects of the vice of over-industry and the deadly apathy of luxury, they are trying as best they can to mix and enrich their own little ongoings with those of Nature, and to get rid of rust and disease. Briskly venturing and roaming, some are washing off sins and cobweb cares of the devil’s spinning in all-day storms on mountains; sauntering in rosiny pinewoods or in gentian meadows, brushing through chaparral, bending down and parting sweet, flowery sprays; tracing rivers to their sources, getting in touch with the nerves of Mother Earth; jumping from rock to rock, feeling the life of them, learning the songs of them, panting in whole-souled exercise, and rejoicing in deep, long-drawn breaths of pure wildness. This is fine and natural and full of promise. So also is the growing interest in the care and preservation of forests and wild places in general, and in the half wild parks and gardens of towns. Even the scenery habit in its most artificial forms, mixed with spectacles, silliness, and kodaks; its devotees arrayed more gorgeously than scarlet tanagers, frightening the wild game with red umbrellas,—even this is encouraging, and may well be regarded as a hopeful sign of the times.

      All the Western mountains are still rich in wildness, and by means of good roads are being brought nearer civilization every year. To the sane and free it will hardly seem necessary to cross the continent in search of wild beauty, however easy the way, for they find it in abundance wherever they chance to be. Like Thoreau they see forests in orchards and patches of huckleberry brush, and oceans in ponds and drops of dew. Few in these hot, dim, strenuous times are quite sane or free; choked with care like clocks full of dust, laboriously doing so much good and making so much money,—or so little,—they are no longer good for themselves.
    prompt: |
      Question 2: Rhetorical analysis. Suggested time: 40 minutes.

      The passage above opens the first chapter of John Muir's Our National Parks (1901). Muir, a naturalist who had spent decades in the Sierra Nevada, wrote for readers of a national magazine, most of whom lived in cities and towns in the East. Read the passage carefully. Write an essay that analyzes the rhetorical choices Muir makes to convey his message about the value of wild places.

      In your response you should:
      - Respond to the prompt with a thesis that analyzes the writer's rhetorical choices.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Demonstrate an understanding of the rhetorical situation.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: Writing for tired, prosperous city readers, Muir presents wildness not as scenery for the idle but as a cure for the sickness of modern life, using medical and religious diction, an exuberant catalogue of outdoor activity and a gently ironic tolerance of tourists to persuade his audience that going to the mountains is going home.

      Line of reasoning and evidence: (1) Diagnosis. Muir names his readers' condition before he names the cure: they are “tired, nerve-shaken, over-civilized,” suffering from the “stupefying effects” of over-industry and the “deadly apathy of luxury,” trying to get rid of “rust and disease.” By describing comfort as illness, he turns his audience's own success into the problem wilderness solves. (2) Redefinition of usefulness. The parks are useful “not only as fountains of timber and irrigating rivers, but as fountains of life”: the repeated “fountains” accepts the practical value readers already grant and then enlarges it. (3) The catalogue. The long sentence of participles (“sauntering,” “brushing,” “tracing,” “jumping,” “panting,” “rejoicing”) piles up motion and sensation so the reader feels the exhilaration; “washing off sins” gives it the force of baptism. (4) Inclusive irony. Even tourists with “kodaks” and “red umbrellas” are “a hopeful sign,” so Muir mocks lightly while welcoming everyone, an invitation rather than a scolding. (5) The turn. The second paragraph raises the standard: the “sane and free” find wildness anywhere, “Like Thoreau,” but few in “these hot, dim, strenuous times” are sane or free; the simile “like clocks full of dust” makes the busy reader a clogged machine and closes with a quiet challenge.

      Sophistication: explains the tension between celebration and criticism, or how Muir's welcome of even silly tourists serves his larger goal of building public support for the parks.
    explanation: |
      Six points, scored on the AP English Language 6-point rhetorical analysis rubric as applied to this passage.

      Row A, Thesis (0-1). 1 point for a defensible thesis that analyzes Muir's rhetorical choices in light of his message about the value of wild places, for example that he presents wildness as a cure for the ills of modern life, or that he redefines what makes the parks useful in order to win readers who think of land in practical terms. 0 points for a thesis that restates the prompt (*Muir uses rhetorical choices to show wild places are valuable*), names devices with no link to purpose (*Muir uses imagery, diction and similes*), or only summarizes the passage.

      Row B, Evidence and Commentary (0-4).
      - 4: Specific evidence throughout supports a line of reasoning, and commentary consistently explains how Muir's choices serve his purpose for his audience. Strong essays connect several of: the diagnostic diction (“tired, nerve-shaken, over-civilized,” “rust and disease,” “deadly apathy of luxury”) that recasts comfort as sickness; the paradox that “going to the mountains is going home”; the repetition of “fountains” that expands usefulness from timber to life; the long catalogue of participles and its spiritual language (“washing off sins,” “the nerves of Mother Earth”); the indulgent humor about tourists with kodaks and red umbrellas; the appeal to Thoreau; and the closing simile of people “choked with care like clocks full of dust.” Commentary explains why each choice would move readers who live in cities, not merely what it is.
      - 3: Specific evidence and a line of reasoning, with commentary that explains how most of the choices serve Muir's purpose; some links are thinner or the essay leans on one or two choices.
      - 2: Some specific evidence, but commentary mostly paraphrases the passage (*Muir says people are tired and should go to the mountains*) or explains choices only in general terms (“this imagery makes it vivid”).
      - 1: Mostly general references to the passage with little quotation, or commentary that repeats the evidence.
      - 0: Restates the thesis without evidence, or is irrelevant to the prompt.
      An essay that moves through the passage device by device (“Muir uses a list... Muir uses a simile...”) without connecting the devices to his purpose and audience cannot score above 2.

      Row C, Sophistication (0-1). 1 point for a consistently complex understanding of the rhetorical situation. For this passage that might mean: explaining the tension between Muir's celebration of the new taste for wilderness and his critique of the readers who have it; showing how his tolerance of even the silliest tourists serves a political goal (a public large enough to protect the parks); analyzing how the second paragraph raises the stakes by implying that true sanity needs no trip west at all; situating the passage in the period's anxieties about overwork and city life; or a consistently vivid, controlled style. A passing reference to “the conservation movement” without analysis does not earn the point.

  - slug: review-practice-q48
    type: long_answer
    topic_code: "4.C"
    source: "Helen Keller, Optimism (1903)"
    points: 6
    prompt: |
      Question 3: Argument. Suggested time: 40 minutes.

      In her essay Optimism (1903), Helen Keller, who lost her sight and hearing in early childhood, wrote that “the struggle which evil necessitates is one of the greatest blessings.” Struggle, she argued, makes people stronger, more patient and more helpful.

      Write an essay that argues your position on the extent to which Keller's claim about the value of struggle is valid.

      In your response you should:
      - Respond to the prompt with a thesis that presents a defensible position.
      - Provide evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Model thesis (qualified): Struggle can be a blessing when it is chosen or survivable and when a person has support, because then it builds the strength and sympathy Keller describes; but treating all hardship as a blessing excuses suffering that no one should have to endure and that teaches nothing.

      Line of reasoning: (1) Concession. Struggle often does build capacity: a student who fails a first chemistry test and learns to study, an athlete who rebuilds after injury, or Keller's own learning to read and speak with her teacher's help shows that difficulty, met with effort, produces skill and patience. (2) Qualification. The examples share conditions: the struggle was survivable, and the person had help. Keller herself had a devoted teacher and patrons who paid for her schooling. Hardship without support, such as chronic hunger, can drain the energy needed to grow and leaves lasting harm. (3) The danger of the claim. If struggle is always a blessing, a society can excuse unfairness by calling it character-building; schools or employers that impose needless hardship can claim to be helping. (4) Reframing. What blesses is not the struggle itself but what a person and a community make of it, which is why Keller pairs her optimism with a “willing effort” to help the good prevail. Conclusion: the claim is valid as a description of how people can respond to hardship, not as a reason to welcome hardship for others.

      Evidence may come from history, current events, reading, observation or personal experience. Strong essays may also defend Keller's claim fully (hardship as the source of empathy and resilience) or largely reject it (suffering as damage that the language of “blessing” hides).
    explanation: |
      Six points, scored on the AP English Language 6-point argument rubric as applied to this prompt.

      Row A, Thesis (0-1). 1 point for a defensible thesis that takes a position on the extent to which struggle is a blessing, whether agreeing, disagreeing or qualifying (for example, struggle is valuable only when it is survivable and supported). 0 points for a thesis that restates the prompt (“Keller makes a claim about struggle”), merely summarizes Keller's view, or announces a topic without a position (“Struggle has good and bad sides”).

      Row B, Evidence and Commentary (0-4).
      - 4: Specific, relevant evidence (from history, literature, science, current events or carefully described personal experience) supports all claims in a line of reasoning, and commentary consistently explains how the evidence supports the position. A 4 does not stop at an example of someone who overcame hardship; it explains what in the example made the struggle valuable (choice, support, a goal) or harmful (scale, injustice, lack of help) and builds those explanations into a line of reasoning.
      - 3: Specific evidence supports a line of reasoning, with commentary that explains most of it, though some examples are thinner or less fully connected to the position.
      - 2: Some specific evidence, but it is general or the commentary repeats the claim (“this shows struggle makes you stronger”) without explaining how; a string of loosely related examples is typical.
      - 1: Evidence is mostly general or hypothetical with little or no commentary.
      - 0: Restates the thesis, or provides no relevant evidence.
      Personal experience counts as evidence when it is specific and explained. Mentioning Keller's own life is welcome, but an essay about her biography instead of the claim does not answer the prompt.

      Row C, Sophistication (0-1). 1 point for a consistently sophisticated argument. For this prompt that might mean: distinguishing kinds of struggle (chosen and imposed, temporary and chronic, individual and collective) and arguing that the claim holds for some and not others; explaining the risk that praising struggle can be used to excuse injustice; considering Keller's own rhetorical situation (a young writer answering doubts about whether a blind and deaf woman could be happy) to illuminate the claim; or a consistently vivid, persuasive style. A single sentence acknowledging that “struggle can also be bad” does not earn the point.
