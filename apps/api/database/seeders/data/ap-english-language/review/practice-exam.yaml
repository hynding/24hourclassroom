    type: multiple_choice
    topic_code: "2.B"
    source: written for this course
    points: 1
    stimulus: *darksky
    prompt: |
      Several county commissioners have said they are worried that a lighting ordinance would burden local business owners. Which sentence, added after sentence 19, would best address that concern?
