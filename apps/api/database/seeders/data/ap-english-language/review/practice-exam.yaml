        Lecturing business owners about their values dismisses the concern and is likely to turn the commission against the proposal.
      - |
        Correct. The sentence speaks to the commissioners' worry in their own terms: no forced early spending, and a benefit for owners in lower bills. Understanding what an audience values and answering it directly is what persuades.
      - |
        This points out a problem with businesses' lighting, which may increase the commissioners' worry; it does not reassure them that the rule is fair.
    answer: 2

  - slug: review-practice-q36
    type: multiple_choice
    topic_code: "8.C"
    source: written for this course
    points: 1
    stimulus: *darksky
    prompt: |
      Which of the following is the best version of the first word of sentence 20?
    options:
      - "Its"
      - "It's"
      - "Its'"
      - "It is'"
    option_explanations:
      - |
        “Its” is the possessive pronoun (as in “the county and its streets”). The sentence needs a subject and verb, “it is,” so the possessive is wrong here.
      - |
        Correct. “It's” is the contraction of “it is,” which the sentence requires: it is the least we can do. The apostrophe marks the missing letter.
      - |
        “Its'” is not a word in standard English; neither the possessive nor the contraction is spelled with an apostrophe after the s.
      - |
        Writing out “It is” would be correct, but the stray apostrophe after it makes this version an error.
