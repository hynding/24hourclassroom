  # ======================================================================
  # Section I, set E (q38-q45): reading, Margaret Fuller, Woman in the Nineteenth Century (1845)
  # ======================================================================
  - slug: review-practice-q38
    type: multiple_choice
    topic_code: "3.C"
    source: "Margaret Fuller, Woman in the Nineteenth Century (1845)"
    points: 1
    stimulus: &fuller |
      *The following passage is from Margaret Fuller's book-length essay* Woman in the Nineteenth Century *(1845), which argued that every occupation and form of education should be open to women. The women named in the fifth paragraph were celebrated in Fuller's day for their courage in wars and uprisings in Spain, Greece and Poland.*

      You ask, what use will she make of liberty, when she has so long been sustained and restrained?

      I answer; in the first place, this will not be suddenly given. I read yesterday a debate of this year on the subject of enlarging women's rights over property. It was a leaf from the class-book that is preparing for the needed instruction. The men learned visibly as they spoke. The champions of Woman saw the fallacy of arguments on the opposite side, and were startled by their own convictions. With their wives at home, and the readers of the paper, it was the same. And so the stream flows on; thought urging action, and action leading to the evolution of still better thought.

      But, were this freedom to come suddenly, I have no fear of the consequences. Individuals might commit excesses, but there is not only in the sex a reverence for decorums and limits inherited and enhanced from generation to generation, which many years of other life could not efface, but a native love, in Woman as Woman, of proportion, of “the simple art of not too much,”--a Greek moderation, which would create immediately a restraining party, the natural legislators and instructors of the rest, and would gradually establish such rules as are needed to guard, without impeding, life.

      The Graces would lead the choral dance, and teach the rest to regulate their steps to the measure of beauty.

      But if you ask me what offices they may fill, I reply--any. I do not care what case you put; let them be sea-captains, if you will. I do not doubt there are women well fitted for such an office, and, if so, I should be as glad to see them in it, as to welcome the maid of Saragossa, or the maid of Missolonghi, or the Suliote heroine, or Emily Plater.

      I think women need, especially at this juncture, a much greater range of occupation than they have, to rouse their latent powers. A party of travellers lately visited a lonely hut on a mountain. There they found an old woman, who told them she and her husband had lived there forty years. “Why,” they said, “did you choose so barren a spot?” She “did not know; *it was the man's notion.”*

      And, during forty years, she had been content to act, without knowing why, upon “the man's notion.” I would not have it so.
    prompt: |
      The question in the first paragraph functions primarily to
    options:
      - "express Fuller's own doubt about whether women are ready for liberty"
      - "introduce a historical fact that the rest of the passage explains"
      - "voice an objection Fuller expects from skeptical readers so that she can answer it point by point"
      - "summarize the conclusion of the debate Fuller describes in the second paragraph"
    option_explanations:
      - |
        The question is attributed to “You,” an imagined reader, and Fuller's answers are confident (“I have no fear of the consequences”). It is not her own doubt.
      - |
        A question is not a fact, and the passage does not explain a historical event. It responds to a worry about what women would do with freedom.
      - |
        Correct. “You ask” sets up a counterargument in the reader's voice: that women, long kept dependent, might misuse liberty. Fuller then answers it twice (“in the first place,” then “But, were this freedom to come suddenly”), which structures the passage as a rebuttal.
      - |
        The debate comes after the question and is offered as part of the answer to it. The question is not drawn from the debate.
    answer: 2

  - slug: review-practice-q39
    type: multiple_choice
    topic_code: "3.A"
    source: "Margaret Fuller, Woman in the Nineteenth Century (1845)"
    points: 1
    stimulus: *fuller
    prompt: |
      In the second paragraph, Fuller's account of the debate on women's property rights serves as evidence for which claim?
    options:
      - "Women should be allowed to serve as legislators."
      - "Most men are opposed to any change in women's rights."
      - "Newspapers have misreported the debate on property rights."
      - "Liberty for women will come gradually, as public discussion educates both the lawmakers and the public."
    option_explanations:
      - |
        The passage later says women may hold “any” office, but the debate is offered for a different point, that change “will not be suddenly given.”
      - |
        The account shows men changing their minds (“The men learned visibly as they spoke”), which is the opposite of fixed opposition.
      - |
        Fuller read the debate in the paper and mentions its readers, but she never questions the accuracy of the reporting.
      - |
        Correct. The claim is that freedom “will not be suddenly given,” and the debate shows how it comes instead: speakers, their wives and newspaper readers learn by degrees. The image of the stream, thought and action feeding each other, sums up that gradual process.
    answer: 3

  - slug: review-practice-q40
    type: multiple_choice
    topic_code: "7.A"
    source: "Margaret Fuller, Woman in the Nineteenth Century (1845)"
    points: 1
    stimulus: *fuller
    prompt: |
      Fuller's description of the debate as “a leaf from the class-book that is preparing for the needed instruction” (second paragraph) presents the debate as
    options:
      - "a lesson in a course of education through which the public is being taught to accept women's rights"
      - "a dull exercise that no one outside the legislature will read"
      - "a mistake that will have to be corrected by later lawmakers"
      - "a private document that should not have been made public"
    option_explanations:
      - |
        Correct. A “class-book” is a schoolbook, so the metaphor makes the legislature a classroom and the debate one page of a curriculum. The next sentence completes the image: “The men learned visibly as they spoke.”
      - |
        The metaphor stresses learning, not dullness, and Fuller notes that wives and newspaper readers took the same lesson.
      - |
        Nothing in the metaphor suggests error; the champions of women's rights saw “the fallacy” of the other side's arguments, so the debate moved toward truth.
      - |
        Fuller read the debate in a newspaper and welcomes its wide readership. A schoolbook page is meant to be read by many.
    answer: 0

  - slug: review-practice-q41
    type: multiple_choice
    topic_code: "5.A"
    source: "Margaret Fuller, Woman in the Nineteenth Century (1845)"
    points: 1
    stimulus: *fuller
    prompt: |
      Which of the following best describes the line of reasoning in the second and third paragraphs?
    options:
      - "Fuller argues that liberty for women would be dangerous, then reverses herself and argues that it would be safe."
      - "Fuller answers the objection twice: first by arguing that liberty will arrive slowly, then by arguing that even sudden liberty would be safe, so the objection fails either way."
      - "Fuller lists the excesses women would commit and proposes laws to prevent each of them."
      - "Fuller compares the women of ancient Greece with those of her own day and concludes that modern women are less moderate."
    option_explanations:
      - |
        Fuller never argues that liberty would be dangerous; she grants only that “Individuals might commit excesses.” There is no reversal of her position.
      - |
        Correct. “In the first place, this will not be suddenly given” is one answer; “But, were this freedom to come suddenly, I have no fear” is a second that covers the remaining case. Answering both possibilities leaves the objector no ground to stand on.
      - |
        No excesses are listed and no laws are proposed. Fuller says women's own moderation would create the needed rules.
      - |
        “A Greek moderation” describes a quality Fuller attributes to women; she does not compare ancient and modern women or rank them.
    answer: 1

  - slug: review-practice-q42
    type: multiple_choice
    topic_code: "7.B"
    source: "Margaret Fuller, Woman in the Nineteenth Century (1845)"
    points: 1
    stimulus: *fuller
    prompt: |
      In the sentence “And so the stream flows on; thought urging action, and action leading to the evolution of still better thought” (second paragraph), the structure after the semicolon serves to
    options:
      - "contrast two groups of people who disagree about women's rights"
      - "list the steps of a legislative procedure in the order they occur"
      - "explain the image of the flowing stream through two linked phrases whose repeated, reversed terms show thought and action feeding each other"
      - "introduce a new subject that the next paragraph develops"
    option_explanations:
      - |
        The phrases are about thought and action, not about two groups of people. Nothing in the sentence sets one party against another.
      - |
        The phrases describe a general process of progress, not the formal steps of a legislature, and their circular pattern does not fit a fixed sequence.
      - |
        Correct. The semicolon introduces an explanation of “the stream,” and the phrases repeat their key words in reverse (thought, action; action, thought). That near-chiasmus enacts the cycle it describes: each idea produces an act that produces a better idea.
      - |
        The next paragraph turns to a different possibility (freedom coming suddenly). This sentence closes the second paragraph's point rather than opening a new one.
    answer: 2

  - slug: review-practice-q43
    type: multiple_choice
    topic_code: "1.B"
    source: "Margaret Fuller, Woman in the Nineteenth Century (1845)"
    points: 1
    stimulus: *fuller
    prompt: |
      In the fifth paragraph, Fuller's reference to the maid of Saragossa, the maid of Missolonghi, the Suliote heroine and Emily Plater most likely appeals to her readers'
    options:
      - "fear that women will one day take up arms against their own governments"
      - "familiarity with the laws governing women's property in Europe"
      - "belief that women should remain in the home during wartime"
      - "admiration for women already celebrated for courage, which makes a woman sea-captain seem less unthinkable"
    option_explanations:
      - |
        The heroines are invoked as figures Fuller would be “as glad to see” as a woman sea-captain; she presents them as admirable, not threatening.
