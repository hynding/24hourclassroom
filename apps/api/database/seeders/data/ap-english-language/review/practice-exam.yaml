  - slug: review-practice-q31
    type: multiple_choice
    topic_code: "4.A"
    source: written for this course
    points: 1
    stimulus: *darksky
    prompt: |
      The writer wants to add a sentence after sentence 9 that provides evidence for the claim in sentence 10. Which sentence would best accomplish this goal?
    options:
      - "Many people leave their porch lights on all night."
      - "Electricity prices have changed a great deal over the past century."
      - "According to the same report, a shielded fixture costs about $150 more than an unshielded one but uses less power for the same light on the street, saving roughly $60 a year in electricity."
      - "Other counties have also thought about this problem."
    option_explanations:
      - |
        Private porch lights are not the county streetlights the paragraph discusses, and the sentence says nothing about cost or payback.
      - |
        A vague remark about historical prices gives no figures that bear on whether new fixtures would pay for themselves.
      - |
        Correct. The figures let the reader check sentence 10: an extra $150 recovered at about $60 a year pays back in under three years, which is “within a few years.” Evidence that matches the claim's terms makes the claim credible.
      - |
        That other counties have thought about the problem says nothing about cost or payback. It is too vague to support sentence 10.
