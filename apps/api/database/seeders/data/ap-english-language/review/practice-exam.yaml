      - "Business owners should care more about the stars than about their profits."
      - "Because the rule would apply only when a business replaces a fixture anyway, no owner would have to buy a light before the old one fails, and the shielded lights would lower their electric bills."
      - "Some businesses use very bright signs to attract customers."
