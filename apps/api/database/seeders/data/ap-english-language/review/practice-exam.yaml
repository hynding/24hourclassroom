week: 34
description: |
  A full-length practice version of the AP English Language and Composition exam, built to the May 2027 paper's shape. The real exam is taken on a computer in the College Board's Bluebook app and lasts three hours and fifteen minutes. Section I is 45 multiple-choice questions in 60 minutes and counts for 45% of the score; the questions come in five sets, some on passages of published nonfiction (reading questions, about 23-25 of them) and some on student drafts (writing questions, about 20-22, which ask how the writer should revise). None of the passages is a text you studied in class. Section II is three essays in 2 hours and 15 minutes, including a 15-minute reading period, and counts for 55%: Question 1 is a synthesis essay that argues from at least three of six sources, Question 2 is a rhetorical analysis of a nonfiction passage, and Question 3 is an argument essay on a question of values or policy. Each essay is scored out of 6 on the same three rows (thesis 0-1, evidence and commentary 0-4, sophistication 0-1). This practice exam follows that pattern: items 1-45 are five sets, three reading sets on public-domain texts the course does not read (Woodrow Wilson's first inaugural address, an address on education by Thomas Henry Huxley, and a passage from Margaret Fuller's Woman in the Nineteenth Century) and two writing sets on student drafts written for this course; items 46-48 are the three essays. Sets run 8, 11, 8, 10 and 8 items, so there are 24 reading questions and 21 writing questions. In the app, items 1-45 are worth 1 point each and are graded at once; items 46-48 are worth 6 points each and are graded by your teacher against the rubric attached to each, so the paper is out of 63 points and the essays count for less here than they will in May. To estimate your exam standing, weight the two halves the way the College Board does: (your multiple-choice score ÷ 45 × 45) + (your essay total ÷ 18 × 55). Sit it in two blocks if you can: 60 minutes for items 1-45 (about 80 seconds an item, twelve minutes a set), a short break, then 2 hours and 15 minutes for the three essays (15 minutes to read the synthesis sources and plan, then about 40 minutes for each essay).
questions:
  # ======================================================================
  # Section I, set A (q01-q08): reading, Woodrow Wilson, First Inaugural Address (1913)
  # ======================================================================
  - slug: review-practice-q01
    type: multiple_choice
    topic_code: "1.A"
    source: "Woodrow Wilson, First Inaugural Address (1913)"
    points: 1
    stimulus: &wilson |
      *The following passage is from the inaugural address Woodrow Wilson gave on March 4, 1913, when the Democratic Party took control of the presidency and both houses of Congress for the first time in two decades. Wilson had opened by asking what the change of government meant.*

      We see that in many things that life is very great. It is incomparably great in its material aspects, in its body of wealth, in the diversity and sweep of its energy, in the industries which have been conceived and built up by the genius of individual men and the limitless enterprise of groups of men. It is great, also, very great, in its moral force. Nowhere else in the world have noble men and women exhibited in more striking forms the beauty and the energy of sympathy and helpfulness and counsel in their efforts to rectify wrong, alleviate suffering, and set the weak in the way of strength and hope. [...] Our life contains every great thing, and contains it in rich abundance.

      But the evil has come with the good, and much fine gold has been corroded. With riches has come inexcusable waste. We have squandered a great part of what we might have used, and have not stopped to conserve the exceeding bounty of nature, without which our genius for enterprise would have been worthless and impotent, scorning to be careful, shamefully prodigal as well as admirably efficient. We have been proud of our industrial achievements, but we have not hitherto stopped thoughtfully enough to count the human cost, the cost of lives snuffed out, of energies overtaxed and broken, the fearful physical and spiritual cost to the men and women and children upon whom the dead weight and burden of it all has fallen pitilessly the years through. The groans and agony of it all had not yet reached our ears, the solemn, moving undertone of our life, coming up out of the mines and factories, and out of every home where the struggle had its intimate and familiar seat. [...] The great Government we loved has too often been made use of for private and selfish purposes, and those who used it had forgotten the people.

      At last a vision has been vouchsafed us of our life as a whole. We see the bad with the good, the debased and decadent with the sound and vital. With this vision we approach new affairs. Our duty is to cleanse, to reconsider, to restore, to correct the evil without impairing the good, to purify and humanize every process of our common life without weakening or sentimentalizing it. There has been something crude and heartless and unfeeling in our haste to succeed and be great. [...] But we were very heedless and in a hurry to be great.

      We have come now to the sober second thought. The scales of heedlessness have fallen from our eyes. We have made up our minds to square every process of our national life again with the standards we so proudly set up at the beginning and have always carried at our hearts. Our work is a work of restoration.
    prompt: |
      Which of the following best describes Wilson's primary purpose in the passage?
    options:
      - "To blame the outgoing Republican administration for the waste and suffering of the industrial age"
      - "To celebrate the nation's wealth and moral force as proof that no serious reform is needed"
      - "To acknowledge the nation's real achievements while exposing their hidden costs, so that his listeners accept reform as a restoration of their own ideals"
      - "To propose specific laws on tariffs, banking and labor that Congress should pass in its first session"
    option_explanations:
      - |
        Wilson never names a party or an administration as the culprit. His pronoun is “we” throughout (“We have squandered,” “we were very heedless”), so the fault is shared by the whole nation, including his own audience.
      - |
        The first paragraph does celebrate, but the second opens with “But the evil has come with the good.” The praise is a setup for the turn, not the point; the passage ends by calling for “a work of restoration.”
      - |
        Correct. The passage grants the nation's greatness, turns to “the human cost,” and closes by calling the coming work “a work of restoration,” framing change as a return to standards the nation “so proudly set up at the beginning.” That is the address's purpose on this occasion.
      - |
        This passage stays general. The specific items (tariff, banking) come only after it, so a reader of these paragraphs cannot say they propose particular laws; the passage prepares the audience for such proposals.
    answer: 2

  - slug: review-practice-q02
    type: multiple_choice
    topic_code: "5.B"
    source: "Woodrow Wilson, First Inaugural Address (1913)"
    points: 1
    stimulus: *wilson
    prompt: |
      The relationship between the first paragraph and the second paragraph is best described as
    options:
      - "a generous account of the nation's greatness, followed by a turn that sets the costs of that greatness against it"
      - "a list of problems, followed by a list of the solutions the new government will adopt"
      - "a personal recollection, followed by a general principle drawn from it"
      - "a claim about the government, followed by evidence drawn from the history of other nations"
    option_explanations:
      - |
        Correct. The first paragraph builds the case for greatness (material and moral); the second opens with “But the evil has come with the good” and itemizes waste and human cost. Granting the good first makes the criticism harder to dismiss as hostility.
      - |
        The first paragraph lists achievements, not problems, and the second lists costs, not solutions. Solutions are named only in the most general terms in the third paragraph (“to cleanse, to reconsider, to restore”).
      - |
        Neither paragraph is personal; Wilson never says “I” here and tells no story from his own life. Both paragraphs speak in the collective “we” about the nation.
      - |
        The first paragraph is about the nation's life as a whole, not just its government, and no other nation's history is offered as evidence; the only comparison is the passing “Nowhere else in the world.”
    answer: 0

  - slug: review-practice-q03
    type: multiple_choice
    topic_code: "7.A"
    source: "Woodrow Wilson, First Inaugural Address (1913)"
    points: 1
    stimulus: *wilson
    prompt: |
      The phrase “much fine gold has been corroded” (second paragraph) primarily suggests that
    options:
      - "the nation's supply of gold has been spent on foreign trade"
      - "the nation's wealth was never as real as its citizens believed"
      - "the industries that produced the nation's wealth should be shut down"
      - "something genuinely valuable in the nation's life has been damaged through neglect and misuse"
    option_explanations:
      - |
        This reads the metaphor literally. Nothing in the passage concerns gold reserves or trade; the “gold” stands for what is precious in the national life described in the previous paragraph.
      - |
        “Fine gold” is real gold. The metaphor grants that the value was genuine and says it has been eaten away, which fits Wilson's refusal to deny the nation's greatness.
      - |
        Wilson wants to “correct the evil without impairing the good”; he does not call for ending industry. Reading the metaphor as a call to destroy the source of wealth overstates it badly.
      - |
        Correct. Gold is precious and “fine,” so the metaphor affirms the value of what the first paragraph praised; “corroded” says it has decayed over time. The image prepares for the list of waste and human cost that follows.
    answer: 3

  - slug: review-practice-q04
    type: multiple_choice
    topic_code: "7.B"
    source: "Woodrow Wilson, First Inaugural Address (1913)"
    points: 1
    stimulus: *wilson
    prompt: |
      In the sentence beginning “We have squandered a great part of what we might have used” (second paragraph), the closing phrases “scorning to be careful, shamefully prodigal as well as admirably efficient” serve primarily to
    options:
      - "excuse the nation's waste by pointing out that it was the price of efficiency"
      - "pair praise and blame in a single description, suggesting that the same national energy produced both the efficiency and the waste"
      - "shift the blame for waste from the people to the industries that employed them"
      - "introduce a new subject, the efficiency of American factories, that the rest of the passage develops"
    option_explanations:
      - |
        The phrases do not excuse anything: “inexcusable waste” in the sentence before and “shamefully” here make the judgment clear. Efficiency is set beside the waste, not offered as a justification for it.
      - |
        Correct. “Shamefully prodigal” and “admirably efficient” are balanced modifiers joined by “as well as,” attached to the same subject. The structure holds the good and the bad together, which is the passage's whole view of the nation's life.
      - |
        The subject of the sentence is “We,” and the modifiers describe that same “we.” Nothing in the syntax moves responsibility from the nation to particular industries.
      - |
        Efficiency is mentioned only here and is not developed afterward; the paragraph moves on to “the human cost.” The phrase completes a judgment rather than opening a new topic.
    answer: 1

  - slug: review-practice-q05
    type: multiple_choice
    topic_code: "3.A"
    source: "Woodrow Wilson, First Inaugural Address (1913)"
    points: 1
    stimulus: *wilson
    prompt: |
      Which of the following details from the second paragraph most directly supports Wilson's claim that the nation has not counted “the human cost” of its industrial achievements?
    options:
      - "With riches has come inexcusable waste."
      - "have not stopped to conserve the exceeding bounty of nature"
      - "the cost of lives snuffed out, of energies overtaxed and broken"
      - "We have been proud of our industrial achievements"
    option_explanations:
      - |
        This sentence names the waste of riches in general, before the human cost is introduced. It concerns squandered resources, not the toll on people's lives.
      - |
        This supports a different claim, that natural resources have been wasted. Nature's bounty is a cost, but it is not the human cost the question names.
      - |
        Correct. The phrase defines “the human cost” in concrete terms: lives ended and strength used up. It is the evidence that gives the abstract claim its weight, and the rest of the sentence extends it to “men and women and children.”
      - |
        This is the concession that precedes the claim (“We have been proud..., but”). It sets up the criticism rather than supporting it.
    answer: 2

  - slug: review-practice-q06
    type: multiple_choice
    topic_code: "1.B"
    source: "Woodrow Wilson, First Inaugural Address (1913)"
    points: 1
    stimulus: *wilson
    prompt: |
      Wilson's consistent use of the first-person plural (“we,” “our,” “us”) throughout the passage most likely reflects his understanding that his audience
    options:
      - "would accept a call for reform more readily if they were treated as partners in both the nation's faults and its renewal"
      - "was made up mostly of members of his own party, who shared his views already"
      - "expected a new president to speak modestly about his own accomplishments"
      - "would resent any suggestion that the nation had done wrong"
    option_explanations:
      - |
        Correct. “We have squandered,” “we were very heedless” and “We have made up our minds” place speaker and listeners on the same side: all share the fault and all share the resolve. An inclusive “we” lets him criticize the nation without accusing his hearers.
      - |
        An inaugural speaks to the whole nation, and the passage never addresses partisans; “we” here means Americans, as in “our national life.” Nothing suggests he is talking only to Democrats.
      - |
        The passage contains no claims about Wilson's own accomplishments, modest or otherwise. The plural pronoun concerns shared national responsibility, not personal humility.
      - |
        Wilson plainly does say the nation has done wrong (“inexcusable waste,” “heartless and unfeeling”). The pronoun choice softens the delivery of that criticism; it does not avoid it.
    answer: 0

  - slug: review-practice-q07
    type: multiple_choice
    topic_code: "3.C"
    source: "Woodrow Wilson, First Inaugural Address (1913)"
    points: 1
    stimulus: *wilson
    prompt: |
      In the third paragraph, the qualifications “without impairing the good” and “without weakening or sentimentalizing it” serve primarily to
    options:
      - "admit that the reforms Wilson proposes are likely to fail"
      - "concede that the nation's critics have exaggerated its problems"
      - "suggest that the duty of reform belongs to future generations"
      - "reassure listeners who fear reform that the changes will be measured and will preserve what is valuable"
    option_explanations:
      - |
        The qualifications limit how the reforms will be carried out; they do not predict failure. The surrounding sentences are confident (“Our duty is to cleanse”).
      - |
        Wilson does not concede that anyone exaggerated; he has just listed serious evils. The qualifications respond to a different worry, that reform will go too far.
      - |
        The duty is “Our duty” and the work begins now (“With this vision we approach new affairs”). Nothing in the qualifications postpones it.
      - |
        Correct. Each strong verb (“correct,” “purify and humanize”) is followed by a limit, which answers the alternative perspective that reform means destruction or soft-headed sentiment. The qualifications widen his appeal to cautious listeners.
    answer: 3

  - slug: review-practice-q08
    type: multiple_choice
    topic_code: "7.A"
    source: "Woodrow Wilson, First Inaugural Address (1913)"
    points: 1
    stimulus: *wilson
    prompt: |
      The sentence “The scales of heedlessness have fallen from our eyes” (final paragraph) contributes to the passage's tone primarily by
    options:
      - "introducing a note of humor that lightens the criticism before it"
      - "echoing the biblical image of sudden sight after blindness, which casts the nation's new awareness as a solemn moral awakening"
      - "suggesting that the nation's earlier carelessness was deliberate and cannot be forgiven"
      - "comparing the nation to a fish, to suggest that it has been out of its natural element"
    option_explanations:
      - |
        Nothing in the sentence is comic. It continues the grave register of “sober second thought” and leads into the resolve of the closing sentences.
      - |
        Correct. Scales falling from the eyes recalls the conversion of Saul in Acts, where sight returns at a moment of moral change. Paired with “sober second thought” and “vision,” it gives the call for reform the weight of a conversion.
      - |
        Heedlessness is not deliberate; it is the opposite of attention. The image of scales falling suggests blindness cured, not guilt condemned, and the paragraph turns at once to a hopeful resolve.
      - |
        “Scales” here are the flakes over the eyes in the biblical image, not a fish's scales. The fish reading misses the allusion and gives the sentence a meaning the context cannot support.
    answer: 1

  # ======================================================================
  # Section I, set B (q09-q19): writing, a student draft (repair cafe)
  # ======================================================================
  - slug: review-practice-q09
    type: multiple_choice
    topic_code: "2.B"
    source: written for this course
    points: 1
    stimulus: &repair |
      *The following is a draft of an essay a student is writing for the school newspaper. It proposes that the school host a monthly repair café. The sentences are numbered for reference.*

      (1) Last spring, the custodians at our school filled two dumpsters with broken chairs, desk lamps, calculators and backpacks with snapped zippers. (2) Most of these things needed a screw, a stitch or a new battery, not a landfill. (3) Our school should host a monthly repair café.

      (4) A repair café is a simple idea. (5) Volunteers with some skill set up tables with tools, and visitors bring in whatever is broken. (6) The visitor does not drop the object off; he or she sits beside the volunteer and learns how to make the repair. (7) There are a lot of these events now.

      (8) The first reason for a repair café is that it would cut the waste our school produces. (9) According to the facilities office, our building sent about 3,200 pounds of furniture and equipment to the landfill last year. (10) Even if only a quarter of that could be saved, the school would keep 800 pounds out of the ground. (11) Plus, it would save money.

      (12) A repair café would also teach skills that no class teaches. (13) Many students have never used a screwdriver or threaded a needle. (14) Learning to fix a lamp teaches patience, problem solving and the habit of looking at how something works. (15) These are the same habits that our science and engineering classes say they want to build.

      (16) Some people argue that the event would be a liability, because a student could be hurt by a tool or an electrical repair. (17) That is wrong. (18) The café could ban repairs on anything that plugs into a wall unless a certified adult volunteer is at the table, and it could provide safety glasses at every station.

      (19) Finally, a repair café would bring the community into the building. (20) Retired neighbors who know how to sew or solder could share skills that might otherwise be lost to younger people who has never had a chance to learn them. (21) It's a good idea and we should do it.
    prompt: |
      The writer plans to present the proposal at a meeting of the school board, whose members have said that any new program must not add to the school's budget. Which sentence, added after sentence 3, would best address that audience's concern?
    options:
      - "Because volunteers donate their time and the parent association has offered to buy the first set of tools, the café would cost the school nothing beyond the use of the cafeteria one Saturday a month."
      - "Repair cafés are popular with people of all ages, and many students have said they would attend."
      - "Fixing things is more satisfying than throwing them away, as anyone who has mended a favorite jacket knows."
      - "The school board has supported many good programs in the past, and this would be another one."
    option_explanations:
      - |
        Correct. The board's stated value is cost, and this sentence meets it directly with specifics: donated labor, donated tools and a space the school already has. It shows the writer understands what this audience needs to hear before it will say yes.
      - |
        Popularity may matter to some readers, but the board has said its test is the budget. A sentence about attendance does not answer the concern the question names.
      - |
        This appeals to personal satisfaction, a value the board has not raised. It is pleasant but does nothing to show the program would not add costs.
      - |
        Flattering the board is not the same as addressing its concern. The sentence gives no reason to think the café would stay within the budget.
    answer: 0

  - slug: review-practice-q10
    type: multiple_choice
    topic_code: "4.B"
    source: written for this course
    points: 1
    stimulus: *repair
    prompt: |
      The writer wants to revise sentence 3 so that it states a defensible thesis and previews the line of reasoning of the essay. Which version of sentence 3 best accomplishes this goal?
    options:
      - "Our school should host a monthly repair café, which many other places have done."
      - "Repair cafés are an interesting trend that more people should know about."
      - "Our school should host a monthly repair café, because it would cut our waste, teach skills no class teaches and bring the community into the building."
      - "Should our school host a monthly repair café? This essay will discuss the question."
    option_explanations:
      - |
        This keeps the claim but adds a detail about other places instead of previewing the essay's reasons. Readers still do not know what the body paragraphs will argue.
      - |
        Calling something an interesting trend is not a defensible claim about what the school should do, and it drops the proposal altogether.
      - |
        Correct. The claim is arguable (the school should act), and the three reasons match the body paragraphs in order: waste (8-11), skills (12-15) and community (19-20). A thesis that previews the reasoning helps a reader follow it.
      - |
        A question and an announcement of the topic take no position. A thesis has to make a claim that requires defense, and this version avoids one.
    answer: 2

  - slug: review-practice-q11
    type: multiple_choice
    topic_code: "4.A"
    source: written for this course
    points: 1
    stimulus: *repair
    prompt: |
      The writer wants to add evidence after sentence 14 to support the claim made in sentence 12. Which of the following sentences would best accomplish this goal?
    options:
      - "Screwdrivers come in many shapes, including flathead, Phillips and Torx."
      - "My grandfather could fix almost anything, and he never went to college."
      - "Some students would rather buy something new than fix something old."
      - "In a survey of 240 students taken by our school's student council last fall, 61 percent said they had never repaired anything themselves, and none could name a class where repair was taught."
    option_explanations:
      - |
        A fact about kinds of screwdrivers is accurate but irrelevant to the claim that the café would teach skills no class teaches. It adds detail without adding support.
      - |
        A single family anecdote shows that one person had repair skills; it does not show that students lack them or that no class teaches them.
      - |
        This states an attitude that cuts against the proposal and does not support the paragraph's claim. If the writer used it, it would need to be answered as a counterargument.
      - |
        Correct. The survey speaks directly to both halves of sentence 12: students lack repair skills, and no class teaches them. Specific, sourced numbers give the paragraph the evidence it currently lacks.
    answer: 3

  - slug: review-practice-q12
    type: multiple_choice
    topic_code: "6.B"
    source: written for this course
    points: 1
    stimulus: *repair
    prompt: |
      The writer wants to revise sentence 11 so that it connects more clearly to the reasoning of sentences 9 and 10. Which version of sentence 11 best accomplishes this goal?
    options:
      - "Plus, it would save money, which is good."
      - "Keeping those 800 pounds out of the landfill would also save money, since the school now pays to haul away every load and then buys replacements each fall."
      - "However, it would save money."
      - "Money is something every school needs more of."
    option_explanations:
      - |
        Adding “which is good” does not connect the savings to the waste figures. The sentence still arrives abruptly, and “Plus” remains an informal, loose transition.
      - |
        Correct. The sentence picks up “those 800 pounds” from sentence 10, uses “also” to mark an added benefit, and explains how saving objects saves money. The transition and the explanation together tie the new point to the line of reasoning.
      - |
        “However” signals contrast, but saving money does not contrast with reducing waste; it adds to it. The transition would mislead the reader about how the ideas relate.
      - |
        This is a general statement with no link to the hauling or the 800 pounds. It drifts away from the paragraph's reasoning rather than connecting to it.
    answer: 1

  - slug: review-practice-q13
    type: multiple_choice
    topic_code: "6.A"
    source: written for this course
    points: 1
    stimulus: *repair
    prompt: |
      The writer wants to add a sentence after sentence 15 that explains how the paragraph's evidence supports the essay's thesis. Which sentence would best accomplish this goal?
    options:
      - "A repair café would therefore do more than rescue lamps: it would give students regular, hands-on practice in the very habits the school already says it values, at no cost to class time."
      - "Engineering is a growing field with many good jobs."
      - "Also, sewing is a useful skill for anyone who owns clothes."
      - "Many people think repair is old-fashioned, but it is not."
    option_explanations:
      - |
        Correct. This is commentary: it draws the conclusion that links sentences 13-15 back to the proposal, explaining why the skills point matters for the school. “Therefore” marks it as the result of the paragraph's reasoning.
      - |
        This introduces a new claim about careers rather than explaining how the paragraph's evidence supports the proposal. It moves the reasoning sideways.
      - |
        A second example of a skill adds evidence, not commentary. The paragraph still lacks a sentence that says what the evidence proves.
      - |
        This raises and dismisses an objection in one breath, without support, and it does not explain how the paragraph's evidence supports the thesis.
    answer: 0

  - slug: review-practice-q14
    type: multiple_choice
    topic_code: "2.B"
    source: written for this course
    points: 1
    stimulus: *repair
    prompt: |
      The writer wants to revise sentence 7 to persuade readers who have never heard of a repair café that the idea is established and workable. Which version of sentence 7 best accomplishes this goal?
    options:
      - "There are many, many of these events now, more than you would think."
      - "I first read about repair cafés online and thought they sounded fun."
      - "The first repair café opened in 2009, and similar events now run regularly in public libraries and community centers in many countries, often in buildings much like ours."
      - "Repair cafés are a new idea, so no one knows yet whether they work."
    option_explanations:
      - |
        Repeating “many” adds emphasis but no information. A skeptical reader is given nothing to check and no reason to believe the idea has been tested.
      - |
        The writer's own first reaction tells readers how the writer felt, not whether repair cafés are established or workable.
      - |
        Correct. A date, the kinds of places that host the events and the point that they run “in buildings much like ours” answer a newcomer's doubts: the idea has a track record and fits a school.
      - |
        This undercuts the proposal by telling readers the idea is untested, the opposite of what the writer wants them to believe.
    answer: 2

  - slug: review-practice-q15
    type: multiple_choice
    topic_code: "4.C"
    source: written for this course
    points: 1
    stimulus: *repair
    prompt: |
      The writer wants to revise sentence 17 to acknowledge the safety concern fairly before answering it in sentence 18. Which version of sentence 17 best accomplishes this goal?
    options:
      - "That is completely wrong, and people who say it are just trying to stop the idea."
      - "Safety is important."
      - "Accidents can happen anywhere, so there is no point in worrying about them."
      - "The concern is a fair one, since tools and wiring can cause real injuries, but it is a reason to plan carefully, not a reason to give up the idea."
    option_explanations:
      - |
        Attacking the motives of people who disagree is not a concession. It hardens the dismissal and would cost the writer the trust of cautious readers.
      - |
        This is true but vague: it neither grants that the objection has merit nor bridges to the safety rules in sentence 18.
      - |
        This waves the concern away, which is the opposite of acknowledging it fairly. It also contradicts sentence 18, which takes the risk seriously.
      - |
        Correct. The sentence concedes what is true in the objection (“tools and wiring can cause real injuries”) and then turns with “but” to the writer's position, setting up the specific precautions in sentence 18. That is a qualified, credible response to a counterargument.
    answer: 3

  - slug: review-practice-q16
    type: multiple_choice
    topic_code: "6.C"
    source: written for this course
    points: 1
    stimulus: *repair
    prompt: |
      The writer wants to add a sentence to the second paragraph (sentences 4-7) that uses comparison to help readers picture what a repair café is like. Which sentence would best accomplish this goal?
    options:
      - "Repair cafés are different from many other kinds of events."
      - "It works less like a repair shop, where you leave a toaster and collect it next week, and more like a cooking class, where you leave knowing how to make the dish yourself."
      - "Some repair cafés also serve coffee and snacks."
      - "Repair cafés have been described in many newspapers."
    option_explanations:
      - |
        Saying the event is different from other events is a comparison with no content: readers learn nothing about what it is like.
      - |
        Correct. The double comparison uses two familiar experiences to make the key distinction of sentence 6 vivid: the visitor learns instead of handing off the job. A comparison that clarifies an unfamiliar idea is a method of development serving the argument.
      - |
        This adds a detail about refreshments, not a comparison, and it does not help readers grasp the café's purpose.
      - |
        A claim about press coverage might add credibility, but it is not a comparison and does not help readers picture the event.
    answer: 1

  - slug: review-practice-q17
    type: multiple_choice
    topic_code: "2.A"
    source: written for this course
    points: 1
    stimulus: *repair
    prompt: |
      The writer wants to replace sentence 21 with a conclusion that returns to the opening image and leaves readers with a sense of what is at stake. Which version of sentence 21 best accomplishes this goal?
    options:
      - "In conclusion, this essay has given three reasons for a repair café."
      - "Repair cafés are a good idea that more schools should try someday."
      - "Next spring, the custodians could fill those two dumpsters halfway, and the chairs and lamps that stay out of them could carry the names of the students who learned to fix them."
      - "If the school does not host a repair café, it will be making a terrible mistake that it will regret forever."
    option_explanations:
      - |
        Announcing that the essay has given reasons merely summarizes. It neither returns to the opening image nor suggests what is at stake for the reader.
      - |
        This is vaguer than sentence 21 and weakens the claim with “someday.” It does not echo the introduction.
      - |
        Correct. The sentence returns to the custodians and the two dumpsters of sentence 1 and imagines the change the proposal would make, giving readers a concrete picture of the stakes. A conclusion that answers its introduction creates a sense of closure.
      - |
        The exaggerated warning overstates the stakes and abandons the measured tone of the rest of the essay. It does not return to the opening image.
    answer: 2

  - slug: review-practice-q18
    type: multiple_choice
    topic_code: "8.B"
    source: written for this course
    points: 1
    stimulus: *repair
    prompt: |
      The writer wants to combine sentences 4 and 5 to show that sentence 5 explains the “simple idea” named in sentence 4. Which version best accomplishes this goal?
    options:
      - "A repair café is a simple idea: volunteers with some skill set up tables with tools, and visitors bring in whatever is broken."
      - "A repair café is a simple idea, but volunteers with some skill set up tables with tools, and visitors bring in whatever is broken."
      - "A repair café is a simple idea, volunteers with some skill set up tables with tools, and visitors bring in whatever is broken."
      - "Although a repair café is a simple idea, volunteers with some skill set up tables with tools, and visitors bring in whatever is broken."
    option_explanations:
      - |
        Correct. A colon tells the reader that what follows explains or specifies what came before. Here it makes the relationship exact: the second clause is the simple idea.
      - |
        “But” signals contrast, yet the second clause does not contrast with the first; it explains it. The conjunction misstates the relationship.
      - |
        Joining independent clauses with only commas creates a comma splice, and the punctuation gives no signal that the second part explains the first.
      - |
        “Although” makes the first clause a concession, as if the simplicity were surprising given what follows. That reverses the intended relationship.
    answer: 0

  - slug: review-practice-q19
    type: multiple_choice
    topic_code: "8.C"
    source: written for this course
    points: 1
    stimulus: *repair
    prompt: |
      In sentence 20, the writer wants to correct an error in the phrase “to younger people who has never had a chance to learn them.” Which version of the phrase is correct?
    options:
      - "to younger people, who has never had a chance to learn them"
      - "to younger people who has never had chances to learn it"
      - "to younger people whom has never had a chance to learn them"
      - "to younger people who have never had a chance to learn them"
    option_explanations:
      - |
        Adding a comma does not fix the problem, and it wrongly suggests that all younger people lack the chance. The verb “has” still does not agree with the plural “people.”
      - |
        This keeps the agreement error in “has” and introduces a new one: “it” no longer agrees with the plural “skills” it stands for.
      - |
        “Whom” is an object pronoun, but here the pronoun is the subject of “has,” so “who” is needed; the verb still fails to agree as well.
      - |
        Correct. The relative pronoun “who” refers to “people,” which is plural, so the verb must be the plural “have.” The pronoun “them” correctly refers to the plural “skills.”
    answer: 3

  # ======================================================================
  # Section I, set C (q20-q27): reading, Thomas Henry Huxley, "A Liberal Education" (1868)
  # ======================================================================
  - slug: review-practice-q20
    type: multiple_choice
    topic_code: "1.A"
    source: 'Thomas Henry Huxley, "A Liberal Education; and Where to Find It" (1868)'
    points: 1
    stimulus: &huxley |
      *The following passage is from an address the scientist Thomas Henry Huxley delivered on January 4, 1868, to the South London Working Men's College, a school offering evening classes to working adults. Just before this passage, Huxley asked his listeners what an ideal liberal education would be.*

      Suppose it were perfectly certain that the life and fortune of every one of us would, one day or other, depend upon his winning or losing a game at chess. Don't you think that we should all consider it to be a primary duty to learn at least the names and the moves of the pieces; to have a notion of a gambit, and a keen eye for all the means of giving and getting out of check? Do you not think that we should look with a disapprobation amounting to scorn, upon the father who allowed his son, or the state which allowed its members, to grow up without knowing a pawn from a knight?

      Yet it is a very plain and elementary truth, that the life, the fortune, and the happiness of every one of us, and, more or less, of those who are connected with us, do depend upon our knowing something of the rules of a game infinitely more difficult and complicated than chess. It is a game which has been played for untold ages, every man and woman of us being one of the two players in a game of his or her own. The chess-board is the world, the pieces are the phenomena of the universe, the rules of the game are what we call the laws of Nature. The player on the other side is hidden from us. We know that his play is always fair, just, and patient. But also we know, to our cost, that he never overlooks a mistake, or makes the smallest allowance for ignorance. To the man who plays well, the highest stakes are paid, with that sort of overflowing generosity with which the strong shows delight in strength. And one who plays ill is checkmated--without haste, but without remorse.

      My metaphor will remind some of you of the famous picture in which Retzsch has depicted Satan playing at chess with man for his soul. Substitute for the mocking fiend in that picture, a calm, strong angel who is playing for love, as we say, and would rather lose than win--and I should accept it as an image of human life.

      Well, what I mean by Education is learning the rules of this mighty game. In other words, education is the instruction of the intellect in the laws of Nature, under which name I include not merely things and their forces, but men and their ways; and the fashioning of the affections and of the will into an earnest and loving desire to move in harmony with those laws. For me, education means neither more nor less than this. Anything which professes to call itself education must be tried by this standard, and if it fails to stand the test, I will not call it education, whatever may be the force of authority, or of numbers, upon the other side.
    prompt: |
      Which of the following best describes Huxley's purpose in the passage?
    options:
      - "To persuade working adults to give up their evening classes and study chess instead"
      - "To establish a definition of education against which his listeners can judge any schooling, including the kind they themselves are receiving"
      - "To argue that only scientists are qualified to teach in a college for working people"
      - "To describe a famous painting and explain how it reflects the religious beliefs of its time"
    option_explanations:
      - |
        Chess is the vehicle of an analogy, not the subject. Huxley never recommends the game; he uses it to make a point about a larger “game” whose rules are the laws of Nature.
      - |
        Correct. The analogy leads to “what I mean by Education,” and the final sentence makes that definition a test: anything that “fails to stand the test” is not education. For an audience at a college, the definition is a standard to measure their own learning by.
      - |
        The passage never discusses who should teach. Its claim is about what education is, and it includes “men and their ways” as well as natural science.
      - |
        The painting by Retzsch is mentioned in one sentence, only to adjust Huxley's own metaphor. The passage does not describe or interpret it as a work of art.
    answer: 1

  - slug: review-practice-q21
    type: multiple_choice
    topic_code: "5.C"
    source: 'Thomas Henry Huxley, "A Liberal Education; and Where to Find It" (1868)'
    points: 1
    stimulus: *huxley
    prompt: |
      The passage is developed chiefly through
    options:
      - "a chronological narrative of the history of education"
      - "a classification of the different kinds of schools and what each teaches"
      - "a cause-and-effect account of how poor schooling led to a specific disaster"
      - "an extended analogy that builds toward a formal definition"
    option_explanations:
      - |
        No events are told in time order, and there is no history of education in the passage. Huxley reasons from a hypothetical, not from a sequence of past events.
      - |
        No kinds of schools are sorted or compared. The passage defines one thing, education, rather than dividing a group into categories.
      - |
        Huxley mentions consequences in general (one who plays ill “is checkmated”), but he gives no specific disaster and traces no chain of causes.
      - |
        Correct. Huxley develops the chess comparison across three paragraphs (the board, the pieces, the rules, the hidden player) and then converts it into a definition: “education is the instruction of the intellect in the laws of Nature.” Analogy and definition work together.
    answer: 3

  - slug: review-practice-q22
    type: multiple_choice
    topic_code: "3.A"
    source: 'Thomas Henry Huxley, "A Liberal Education; and Where to Find It" (1868)'
    points: 1
    stimulus: *huxley
    prompt: |
      The rhetorical questions in the first paragraph function primarily to
    options:
      - "win the audience's agreement to a principle in a simple, imagined case before the speaker applies it to real life"
      - "express Huxley's uncertainty about whether chess should be taught in schools"
      - "criticize particular fathers in the audience for neglecting their sons"
      - "introduce a counterargument that Huxley goes on to accept"
    option_explanations:
      - |
        Correct. The questions expect the answer yes: of course we would learn the moves if our fortunes depended on it. Once listeners grant that principle, the next paragraph's “Yet” shows that their fortunes really do depend on a game, so they must accept the larger claim.
      - |
        The questions are not genuine doubts. Their phrasing (“Don't you think”) assumes agreement, and chess is a hypothetical, not a proposal for schools.
      - |
        The father and the state are hypothetical figures in the imagined case. Huxley speaks of what “we should” think, not of anyone present.
      - |
        No opposing view is raised in the first paragraph. The questions build Huxley's own premise; they do not present a position he then concedes.
    answer: 0

  - slug: review-practice-q23
    type: multiple_choice
    topic_code: "7.A"
    source: 'Thomas Henry Huxley, "A Liberal Education; and Where to Find It" (1868)'
    points: 1
    stimulus: *huxley
    prompt: |
      The description of the player who “plays ill” as “checkmated--without haste, but without remorse” (second paragraph) most nearly conveys
    options:
      - "the speaker's sympathy for those who make mistakes through no fault of their own"
      - "a playful tone suggesting that the consequences of ignorance are trivial"
      - "the calm, impersonal certainty with which natural law exacts the consequences of ignorance"
      - "anger at a cruel opponent who enjoys defeating weaker players"
    option_explanations:
      - |
        The phrase is about the opponent's manner, not the speaker's feelings, and it allows no excuse; Nature makes no “allowance for ignorance.” Sympathy is not the effect.
      - |
        The stakes are life, fortune and happiness. The balanced, grave phrasing makes the consequence serious, not trivial.
      - |
        Correct. “Without haste” and “without remorse” are parallel negatives that strip the opponent of emotion: Nature neither hurries nor pities. The tone matches the earlier claim that his play is “fair, just, and patient” but never forgiving.
      - |
        The opponent does not enjoy cruelty; Huxley says he plays fairly and later imagines him as an angel “playing for love.” Anger misreads a deliberately impersonal description.
    answer: 2

  - slug: review-practice-q24
    type: multiple_choice
    topic_code: "5.A"
    source: 'Thomas Henry Huxley, "A Liberal Education; and Where to Find It" (1868)'
    points: 1
    stimulus: *huxley
    prompt: |
      Which of the following best describes the line of reasoning of the passage as a whole?
    options:
      - "It begins with a definition of education, then tests that definition against several objections, and ends by abandoning it."
      - "It poses an imagined case, claims that real life is such a case, refines the image, and then states the definition the image was built to support."
      - "It narrates Huxley's own education, then generalizes from it to the education of all working people."
      - "It surveys the opinions of different authorities and concludes by siding with the majority."
    option_explanations:
      - |
        The definition comes at the end, not the beginning, and Huxley holds to it firmly (“neither more nor less than this”). Nothing is abandoned.
      - |
        Correct. Paragraph one imagines a life staked on chess; paragraph two says life really is staked on a harder game; paragraph three adjusts the image (an angel, not a fiend); paragraph four draws the definition. Each step depends on the one before it.
      - |
        Huxley tells no story about his own schooling. The reasoning moves by hypothesis and analogy, not personal narrative.
      - |
        Huxley explicitly refuses to be governed by “authority” or “numbers” in the final sentence. The passage does not survey others' views.
    answer: 1

  - slug: review-practice-q25
    type: multiple_choice
    topic_code: "3.C"
    source: 'Thomas Henry Huxley, "A Liberal Education; and Where to Find It" (1868)'
    points: 1
    stimulus: *huxley
    prompt: |
      In the third paragraph, Huxley's reference to Retzsch's picture of Satan playing chess for a man's soul serves primarily to
    options:
      - "prove that the chess metaphor was first invented by a painter"
      - "suggest that the laws of Nature are evil and should be resisted"
      - "turn the address away from education toward a discussion of religion"
      - "anticipate a darker reading of his metaphor and qualify it, presenting the hidden player as benevolent rather than hostile"
    option_explanations:
      - |
        Huxley mentions the picture because listeners may recall it, not to settle who invented the image. Questions of origin play no part in his argument.
      - |
        This is the reading Huxley rejects. He asks listeners to “Substitute for the mocking fiend” a “calm, strong angel,” so Nature is stern but not malicious.
      - |
        The religious picture is used for one sentence to adjust the metaphor, and the next paragraph returns at once to “what I mean by Education.” The subject does not change.
      - |
        Correct. Because his opponent “never overlooks a mistake,” listeners might imagine a cruel adversary like Retzsch's devil. Huxley names that alternative and corrects it: the player is an angel who “would rather lose than win.” The qualification keeps the metaphor stern but hopeful.
    answer: 3

  - slug: review-practice-q26
    type: multiple_choice
    topic_code: "1.B"
    source: 'Thomas Henry Huxley, "A Liberal Education; and Where to Find It" (1868)'
    points: 1
    stimulus: *huxley
    prompt: |
      Huxley's choice of a game of chess, and his appeal to what a father or a state owes the young, both suggest that he expects his audience to
    options:
      - "value practical competence and the duty to prepare others for life's real tests"
      - "be expert chess players who will appreciate technical terms such as “gambit”"
      - "distrust all forms of formal education"
      - "care more about winning wealth than about understanding the world"
    option_explanations:
      - |
        Correct. Chess is a familiar game of skill with clear rules and stakes, and the appeal to fathers and states draws on a shared sense of duty to the young. Both rest on values he can assume in working adults who have chosen to study at night.
      - |
        Huxley uses only basic terms and asks for “at least the names and the moves of the pieces.” The analogy works because the game is familiar, not because listeners are experts.
      - |
        His listeners attend a college, and Huxley's argument assumes they believe education matters; he is defining it, not dismissing it.
      - |
        Wealth (“fortune”) is one stake among “the life, the fortune, and the happiness,” and the definition of education reaches to “the affections” and “the will.” The appeal is not to greed.
    answer: 0

  - slug: review-practice-q27
    type: multiple_choice
    topic_code: "3.B"
    source: 'Thomas Henry Huxley, "A Liberal Education; and Where to Find It" (1868)'
    points: 1
    stimulus: *huxley
    prompt: |
      Which of the following best expresses the overarching thesis of the passage?
    options:
      - "Chess should be part of every liberal education."
      - "The laws of Nature are too difficult for ordinary people to learn."
      - "Education is learning the rules by which the natural and human world operate and training the will to live in harmony with them, and any schooling that fails to do this is not education."
      - "Fathers who neglect their sons' education deserve to be scorned by the state."
    option_explanations:
      - |
        Chess appears only in the analogy. Taking the vehicle for the claim is a common misreading of extended metaphors.
      - |
        The passage insists people must learn these laws because their lives depend on them; it never says the laws are beyond ordinary people.
      - |
        Correct. This paraphrases the definition in the last paragraph, including its two halves (instruction of the intellect, fashioning of the will) and the standard it sets in the final sentence. Everything before it builds toward this claim.
      - |
        The scorned father belongs to the imagined case in the first paragraph. It supports the premise but is not the passage's main claim.
    answer: 2

  # ======================================================================
  # Section I, set D (q28-q37): writing, a student draft (lighting ordinance)
  # ======================================================================
  - slug: review-practice-q28
    type: multiple_choice
    topic_code: "4.B"
    source: written for this course
    points: 1
    stimulus: &darksky |
      *The following is a draft of an essay a student wrote for a civics class. The assignment asked students to propose a change to a local law and address it to the county commission. The sentences are numbered for reference.*

      (1) When my grandmother was a girl in this county, she could see the Milky Way from her back porch. (2) I have never seen it from mine. (3) The reason is not the weather or the air but the light we pour into the sky every night from parking lots, billboards and unshielded streetlamps. (4) The county should do something about lighting.

      (5) Light pollution is the glow created when outdoor lights shine upward or sideways instead of down. (6) A shielded fixture directs its light at the ground, where people actually need it. (7) An unshielded fixture throws much of its light into the sky, where it does nothing but erase the stars.

      (8) Wasted light is wasted money. (9) The county's own energy report estimates that a third of the electricity used by its streetlights lights the sky instead of the street. (10) Replacing those fixtures as they wear out would pay for itself within a few years.

      (11) Darkness also matters to living things. (12) Migrating birds use the stars to navigate, and bright lights draw them off course. (13) Many of them crash into lighted buildings. (14) Moths, frogs and nesting sea turtles are disrupted by artificial light as well.

      (15) Some residents worry that darker streets would be less safe. (16) Glare from unshielded lights can actually make it harder to see, because it shrinks the pupils and hides whatever stands in the shadows. (17) A well-shielded light can make a street safer than a bright, glaring one.

      (18) An ordinance would not turn off the lights. (19) It would require new fixtures to point down and old ones to be replaced when they fail. (20) Its the least we can do for my grandmother's sky.
    prompt: |
      The writer wants to revise sentence 4 so that it states a clear, defensible thesis that previews the reasons the essay develops. Which version of sentence 4 best accomplishes this goal?
    options:
      - "Lighting is a topic that many people have opinions about."
      - "The county should adopt an ordinance requiring shielded outdoor lights, because shielding would save public money, protect wildlife and make our streets safer."
      - "The county should adopt an ordinance, because the stars are beautiful."
      - "I believe something should probably be done about all this light."
    option_explanations:
      - |
        This announces a topic but takes no position, so there is nothing to defend. A thesis must make a claim that requires proof.
      - |
        Correct. The claim names a specific action (an ordinance requiring shielded lights) and previews the three body paragraphs in order: money (8-10), wildlife (11-14) and safety (15-17). It gives the commission a clear proposal to weigh.
      - |
        This names a specific action but gives a single aesthetic reason that the body paragraphs do not develop; it misrepresents the essay's line of reasoning.
      - |
        The hedges (“I believe,” “probably,” “something”) make the claim vaguer than the original. It still names no action and previews no reasons.
    answer: 1

  - slug: review-practice-q29
    type: multiple_choice
    topic_code: "2.A"
    source: written for this course
    points: 1
    stimulus: *darksky
    prompt: |
      The writer is considering deleting sentences 1 and 2. Should the writer keep or delete these sentences?
    options:
      - "Keep them, because the contrast between the grandmother's porch and the writer's establishes, in personal terms, what has been lost and why the issue is urgent."
      - "Keep them, because they provide statistical evidence for the claim in sentence 9."
      - "Delete them, because personal experience never belongs in an argument addressed to public officials."
      - "Delete them, because they introduce a topic that the essay does not discuss."
    option_explanations:
      - |
        Correct. The two sentences give the essay its exigence: a change within living memory, felt in the writer's own life. Sentence 3 then names the cause, and the conclusion (sentence 20) returns to the grandmother's sky, so the opening also frames the whole essay.
      - |
        The sentences contain no statistics. They are a personal contrast, and sentence 9's figure comes from the county's energy report.
      - |
        Brief personal experience can make an argument concrete and memorable, even for officials, as long as evidence follows. Here sentences 9 and 12 supply that evidence.
      - |
        The sentences introduce the loss of the night sky, which is exactly what the essay discusses. The conclusion returns to the same image.
    answer: 0

  - slug: review-practice-q30
    type: multiple_choice
    topic_code: "6.B"
    source: written for this course
    points: 1
    stimulus: *darksky
    prompt: |
      The writer wants to begin sentence 11 with a transition that signals the move from the economic reason to the next reason. Which choice best accomplishes this goal?
    options:
      - "For example, darkness"
      - "As a result, darkness"
      - "In contrast, darkness"
      - "Beyond the matter of cost, darkness"
    option_explanations:
      - |
        “For example” would make sentence 11 an illustration of the claim about money, but the paragraph about wildlife is a new reason, not an example of the old one.
      - |
        “As a result” claims that the importance of darkness to living things follows from the cost savings. There is no causal link between the two paragraphs.
      - |
        The ecological reason does not contrast with the economic one; both support the same thesis. A contrast transition would mislead the reader.
      - |
        Correct. The phrase names the reason just finished and signals that another is coming, while “also” in the sentence confirms that the new point adds to the case rather than replacing or opposing it.
