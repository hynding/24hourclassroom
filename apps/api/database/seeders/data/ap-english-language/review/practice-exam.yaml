    type: multiple_choice
    topic_code: "6.A"
    source: written for this course
    points: 1
    stimulus: *darksky
    prompt: |
      The writer wants to add a sentence after sentence 14 that explains how the examples in the paragraph support the essay's argument. Which sentence would best accomplish this goal?
