  - slug: review-practice-q37
    type: multiple_choice
    topic_code: "6.C"
    source: written for this course
    points: 1
    stimulus: *darksky
    prompt: |
      The writer wants to add a sentence after sentence 7 that uses a comparison to help readers who are not familiar with lighting picture the difference between the two kinds of fixtures. Which sentence would best accomplish this goal?
    options:
      - "A shielded streetlight works like a desk lamp with a hood, which puts its light on the page, while an unshielded one is more like a bare bulb hanging in the middle of a room."
      - "Shielded fixtures are available from many different manufacturers."
      - "The difference between the two fixtures is very important."
      - "Unshielded fixtures were common in the twentieth century."
