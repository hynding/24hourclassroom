    - slug: u08-w29-q19
      type: short_answer
      topic_code: "7.B"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 2
      prompt: |
        Kennedy says: "For only when our arms are sufficient beyond doubt can we be certain beyond doubt that they will never be employed." In two or three sentences, explain how the placement of the clauses in this sentence shows the relationship between Kennedy's ideas.
      answer: |
        The dependent clause (only when our arms are sufficient beyond doubt) comes first, which inverts the main clause (can we be certain) and makes the condition the focus. Placing strength before certainty shows Kennedy's logic: peace depends on military sufficiency. The repeated beyond doubt links the two clauses, so the paradox that arms ensure they will not be used sounds like a strict cause and effect.
      explanation: |
        1 point: identifies the structure (the only when condition placed first, the main clause inverted, or the repeated beyond doubt). 1 point: explains the relationship it shows (strength as the condition of peace; deterrence) and why the placement matters (emphasis on the condition). A response that only paraphrases the sentence earns at most 1.

