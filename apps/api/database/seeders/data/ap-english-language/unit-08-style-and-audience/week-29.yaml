        - |
          The sentence is an imperative, not a question, and it asks for action, not debate.
      answer: 1
      explanation: |
        Chiasmus reverses repeated terms across parallel clauses (A-B, B-A). Explain what relationship the reversal changes.

    - slug: u08-w29-q16
