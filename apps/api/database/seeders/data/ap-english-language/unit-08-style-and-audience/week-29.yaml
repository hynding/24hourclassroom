    # ---- Clauses and the whole speech
    - slug: u08-w29-q15
      type: multiple_choice
      topic_code: "7.B"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 1
      prompt: |
        Near the end of his address Kennedy says, "ask not what your country can do for you--ask what you can do for your country." The power of the sentence comes chiefly from
      options:
        - |
          its use of a dependent clause to state a condition
        - |
          the reversal of the same terms in two parallel clauses, which turns the relationship between citizen and country around and assigns the citizen the active role
        - |
          its long series of modifying phrases
        - |
          a question that invites the audience to disagree
      option_explanations:
        - |
          Neither half is conditional; both are commands built on the same frame.
        - |
          Correct. In this chiasmus country and you trade places (country serves you; you serve country). The mirror structure makes the reversal of duty the point of the sentence.
        - |
