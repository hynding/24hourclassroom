week: 29
unit: 8
title: Clauses in Balance in Kennedy's Inaugural Address
topics: ["7.B", "8.B"]
texts:
  - author: John F. Kennedy
    title: Inaugural Address
    year: 1961
    url: https://www.gutenberg.org/ebooks/925
    us_government_work: true
guide: guides/week-29.md
guide_description: |
  How writers create, combine and place independent and dependent clauses to show relationships between ideas
  (7.B), and how to write sentences that convey ideas clearly (8.B). The model is John F. Kennedy's Inaugural
  Address of January 20, 1961, a speech built almost entirely from balanced clauses: antithesis, chiasmus,
  conditional sentences, parallel series and the famous inverted command at its close. Four close readings, a
  sentence-combining workshop, common mistakes, the exam connection and a self-check.
flashcards_description: |
  30 cards on clauses and sentence types, coordination and subordination, sentence placement (periodic and loose,
  end focus), parallelism, antithesis and chiasmus, sentence combining, and the structure and lines of Kennedy's
  Inaugural Address.

flashcards:
  - front: "Skill 7.B in Unit 8 → what the reading skill asks of a speech's sentences"
    back: |
      Explain how writers create, combine and place independent and dependent clauses to show relationships between and among ideas: which idea is main, which is subordinate, which causes or conditions another, and which comes last for emphasis.
    topic_code: "7.B"
  - front: "Skill 8.B in Unit 8 → what the writing skill asks of your sentences"
    back: |
      Write sentences that clearly convey ideas and arguments: combine related ideas, subordinate the less important one, put the key idea where it gets emphasis, and keep parallel ideas in parallel form.
    topic_code: "8.B"
  - front: "Independent vs dependent clause → examples from Kennedy"
    back: |
      Both have a subject and a verb. An independent clause can stand alone as a sentence (*we pledge our support*). A dependent clause cannot, because it begins with a word that ties it to another clause (*because it is right*, *if a free society cannot help the many*).
    topic_code: "7.B"
  - front: "Coordination → what joining equal clauses signals to a reader"
    back: |
      Joining clauses of equal weight with a coordinating conjunction (and, but, or, nor, for, so, yet) or a semicolon. It tells the reader the ideas are equally important and names their relationship: addition, contrast, choice, cause or result.
    topic_code: "7.B"
  - front: "Subordination → what making a clause dependent signals to a reader"
    back: |
      Making one idea a dependent clause (with although, because, if, when, unless, since, while, who, which) so that the other idea is the main one. Subordination ranks ideas and names their logical relation.
    topic_code: "7.B"
  - front: "Subordinating conjunctions → sorted by the relationship each names"
    back: |
      Cause: because, since. Contrast or concession: although, though, while, whereas. Condition: if, unless, provided that. Time: when, before, after, until. Purpose: so that. Choosing the right one is choosing the logic.
    topic_code: "8.B"
  - front: "Simple, compound, complex, compound-complex → the four types in one card"
    back: |
      Simple: one independent clause. Compound: two or more independent clauses. Complex: one independent and at least one dependent clause. Compound-complex: two or more independent and at least one dependent. Each type shows a different relationship among ideas.
    topic_code: "7.B"
  - front: "End focus → why Kennedy saves the key word for last"
    back: |
      In English the end of a sentence is its position of greatest emphasis. Put the new or most important idea last; put familiar or less important material, often a dependent clause, first.
    topic_code: "8.B"
  - front: Periodic sentence in a speech → why orators delay the main clause
    back: |
      A periodic sentence holds back its main clause or key word until the end, after modifiers or dependent clauses. Listeners must wait for the point, so it lands with force; Kennedy's only when... can we be certain sentence makes the audience hear the condition before the promise.
    topic_code: "7.B"
  - front: Loose sentence vs periodic sentence → which Kennedy uses for the torch
    back: |
      Loose (cumulative): the main clause first, then added detail. Periodic: the main point held to the end. The torch sentence is loose: Let the word go forth comes first, and the description of the new generation and its commitments accumulates after it, so the sentence keeps expanding instead of building suspense.
    topic_code: "7.B"
  - front: "Parallelism → why Kennedy's pledges are easy to follow"
    back: |
      Putting equal ideas in the same grammatical form (pay any price, bear any burden, meet any hardship). Matching structure tells readers the ideas belong together and makes a series easy to follow and remember.
    topic_code: "8.B"
  - front: Antithesis in clause structure → example from Kennedy
    back: |
      United, there is little we cannot do; divided, there is little we can do. Matching clauses with one reversed term make the contrast, and the case for unity, unmistakable.
    topic_code: "7.B"
  - front: "Chiasmus → the A-B, B-A pattern in Kennedy"
    back: |
      A reversal of the order of repeated words or ideas in two parallel clauses (A-B, B-A). Kennedy's ask not what your country can do for you, ask what you can do for your country is the most quoted example in American speech.
    topic_code: "7.B"
  - front: Kennedy's "Let us never negotiate out of fear" → the pattern
    back: |
      Let us never negotiate out of fear. But let us never fear to negotiate. Chiasmus across two short sentences: negotiate and fear trade places, so one policy rejects weakness and recklessness at once.
    topic_code: "7.B"
  - front: "Comma splice and run-on → fixes that show the relationship"
    back: |
      Two independent clauses joined by only a comma (a splice) or by nothing (a run-on). Fix with a period, a semicolon, a coordinating conjunction after the comma, or by making one clause dependent, choosing whichever shows the relationship you mean.
    topic_code: "8.B"
  - front: "Stringy coordination → the problem with and, and, and"
    back: |
      A sentence that joins many clauses with and (*there are sixty clubs, and you should join one, and you will be glad*) treats every idea as equal and hides the logic. Subordinate or split.
    topic_code: "8.B"
  - front: "Choppy sentences → combining them by subordination"
    back: |
      A run of short simple sentences (*I joined debate. My sister made me. I was scared.*) leaves relationships unstated. Combine with subordination to show cause, contrast and time, keeping one short sentence for emphasis if it earns it.
    topic_code: "8.B"
  - front: Kennedy's Inaugural → date and setting
    back: |
      Friday, January 20, 1961, at the Capitol, after a night of heavy snow. Kennedy, at 43 the youngest person elected president, had won a very close election. Robert Frost took part in the ceremony.
    topic_code: "1.A"
  - front: Kennedy's Inaugural → its exigence
    back: |
      The Cold War at a dangerous stage: nuclear weapons on both sides, newly independent nations choosing sides, and a close, divisive election at home. The speech had to reassure allies, warn adversaries and summon Americans to sacrifice.
    topic_code: "1.A"
  - front: Kennedy's Inaugural → its many audiences
    back: |
      Americans; old allies; new states; the peoples of poor nations; the sister republics of Latin America; the United Nations; and the Soviet bloc. The middle of the speech addresses each in turn, beginning To those...
    topic_code: "1.B"
  - front: "Kennedy's \"not a victory of party, but a celebration of freedom\" → the opening move"
    back: |
      The first sentence uses not X but Y to recast a close partisan election as a national ceremony, speaking to the half of the country that voted against him. Antithesis from the first line.
    topic_code: "7.B"
  - front: "Kennedy's \"the torch has been passed to a new generation\" → the modifiers"
    back: |
      The sentence piles participial phrases onto the new generation: born in this century, tempered by war, disciplined by a hard and bitter peace, proud of our ancient heritage. The modifiers define the speaker's generation before the main point arrives.
    topic_code: "7.B"
  - front: Kennedy's "pay any price, bear any burden" series → the syntax
    back: |
      Five parallel verb phrases (pay, bear, meet, support, oppose), each with any, before the purpose phrase in order to assure the survival and the success of liberty. The series builds commitment; the purpose comes last for emphasis.
    topic_code: "7.B"
  - front: Kennedy's not because... not because... but because
    back: |
      We help the poor of the world not because the Communists may be doing it, not because we seek their votes, but because it is right. Two rejected reasons come first; the real reason is held for the end, where it is emphasised.
    topic_code: "7.B"
  - front: Kennedy's free-society conditional → structure
    back: |
      If a free society cannot help the many who are poor, it cannot save the few who are rich. The dependent if clause states a condition, the main clause its consequence, and the balanced terms (many and few, poor and rich) make it an antithesis.
    topic_code: "7.B"
  - front: Kennedy's "only when... can we be certain" → the inverted clause
    back: |
      Only when our arms are sufficient beyond doubt can we be certain beyond doubt that they will never be employed. Placing the only when clause first inverts the main clause and stresses the condition: strength is the price of peace.
    topic_code: "7.B"
  - front: Kennedy's "Let both sides" anaphora → the function
    back: |
      Four paragraphs begin Let both sides, proposing joint work on arms control, science and the relief of the oppressed. The repeated opening addresses the adversary as a partner and builds a rhythm of invitation.
    topic_code: "7.B"
  - front: Kennedy's "But let us begin." → why so short
    back: |
      After sentences that stretch from the first 100 days to the first 1,000 days to our lifetime, a three-word sentence turns from the vastness of the task to the present moment. Brevity after length creates resolve.
    topic_code: "8.B"
  - front: Kennedy's closing command → audience and syntax
    back: |
      My fellow Americans: ask not what your country can do for you, ask what you can do for your country. The chiastic reversal of who serves whom turns citizenship into active duty; a parallel sentence then makes the same request of the world.
    topic_code: "7.B"
  - front: "Sentence combining → the four questions before you combine"
    back: |
      Which idea is main? What is the relationship (cause, contrast, condition, time, addition)? Which word names that relationship? Which idea should come last for emphasis? Answer them, then combine.
    topic_code: "8.B"

quiz:
  description: |
    22 questions · about 35 minutes · an eight-question set on a passage from Kennedy's Inaugural Address, a
    six-question revision set on a student's orientation speech, and eight more items on clauses, sentence
    combining and the speech as a whole. Multiple choice, select-all and true/false items are graded at once; the
    fill-in-the-blank items are matched automatically; the short answers and the paragraph are graded by your
    teacher against the model answers and scoring notes.
  questions:
    # ---- Passage set: the torch and the pledges
    - slug: u08-w29-q01
      type: multiple_choice
      topic_code: "7.B"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 1
      stimulus: &jfk_pledge |
        *The following passage is from John F. Kennedy's Inaugural Address, delivered at the Capitol on January 20, 1961.*

        We dare not forget today that we are the heirs of that first revolution. Let the word go forth from this time and place, to friend and foe alike, that the torch has been passed to a new generation of Americans--born in this century, tempered by war, disciplined by a hard and bitter peace, proud of our ancient heritage--and unwilling to witness or permit the slow undoing of those human rights to which this Nation has always been committed, and to which we are committed today at home and around the world.

        Let every nation know, whether it wishes us well or ill, that we shall pay any price, bear any burden, meet any hardship, support any friend, oppose any foe, in order to assure the survival and the success of liberty.

        This much we pledge--and more.

        To those old allies whose cultural and spiritual origins we share, we pledge the loyalty of faithful friends. United, there is little we cannot do in a host of cooperative ventures. Divided, there is little we can do--for we dare not meet a powerful challenge at odds and split asunder.

        [...]

        To those peoples in the huts and villages across the globe struggling to break the bonds of mass misery, we pledge our best efforts to help them help themselves, for whatever period is required--not because the Communists may be doing it, not because we seek their votes, but because it is right. If a free society cannot help the many who are poor, it cannot save the few who are rich.
      prompt: |
        In the second sentence, the phrases "born in this century, tempered by war, disciplined by a hard and bitter peace, proud of our ancient heritage" function primarily to
      options:
        - |
          list the countries that have become allies of the United States
        - |
          interrupt the sentence with a digression unrelated to its main claim
        - |
          state the main idea of the sentence, which the rest of it explains
        - |
          modify a new generation of Americans with a series of defining qualities, so that the generation's character is established before the sentence states what it will not permit
      option_explanations:
        - |
          The phrases describe Americans of Kennedy's generation, not foreign countries; the allies appear later in the passage.
        - |
          The phrases are closely tied to the claim: they explain why this generation is ready to defend human rights.
        - |
          The phrases are modifiers, not the main clause; the main statement is that the torch has been passed and the generation is unwilling to witness the undoing of rights.
        - |
          Correct. Four parallel participial and adjective phrases, set off by dashes, characterise the generation (young, tested, disciplined, rooted). They delay and prepare the climactic unwilling to witness or permit.
      answer: 3
      explanation: |
        Skill 7.B: modifying phrases and clauses can define a term before the main point arrives. Ask what each element attaches to and why it is placed there.

    - slug: u08-w29-q02
      type: multiple_choice
      topic_code: "7.A"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 1
      stimulus: *jfk_pledge
      prompt: |
        The series "pay any price, bear any burden, meet any hardship, support any friend, oppose any foe" contributes to the tone of the passage chiefly by
      options:
        - |
          suggesting through its hesitations that Kennedy doubts the nation's resolve
        - |
          building, through five short parallel phrases each with any, a tone of sweeping, unconditional resolve
        - |
          creating a relaxed, conversational tone suited to a casual audience
        - |
          introducing a note of irony that undercuts the pledge
      option_explanations:
        - |
          The series has no hesitations; each phrase is brief and absolute. The effect is certainty, not doubt.
        - |
          Correct. Repetition of the same structure and of the word any makes the commitment feel limitless, and the rhythm of five quick phrases sounds determined and solemn.
        - |
          The parallel, ceremonial phrasing is formal and elevated, suited to an inauguration, not casual.
        - |
          Nothing signals irony; the pledge is meant literally as a warning to adversaries and reassurance to allies.
      answer: 1
      explanation: |
        Spiral review of 7.A: syntax creates tone. A rapid parallel series with an absolute word sounds resolute.

    - slug: u08-w29-q03
      type: multiple_choice
      topic_code: "7.B"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 1
      stimulus: *jfk_pledge
      prompt: |
        The sentences beginning "United, there is little we cannot do" and "Divided, there is little we can do" are effective chiefly because
      options:
        - |
          their parallel structure differs in only a few words, so the contrast between unity and division, and the case for keeping alliances, is unmistakable
        - |
          they introduce statistics about the strength of the alliance
        - |
          they shift from the first person to the third person
        - |
          they concede that the alliance has already failed
      option_explanations:
        - |
          Correct. The two sentences match almost word for word; the changes (united to divided, cannot to can) carry the whole argument. Antithesis makes the relationship between the conditions and their results plain.
        - |
          The sentences contain no numbers; their force is in their structure.
        - |
          Both sentences use we; there is no shift in person.
        - |
          The sentences present a choice and its consequences; they do not say the alliance has failed.
      answer: 0
      explanation: |
        When two clauses match except for a few words, the changed words carry the meaning. Name the relationship the structure shows.

    - slug: u08-w29-q04
      type: multiple_choice
      topic_code: "7.B"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 1
      stimulus: *jfk_pledge
      prompt: |
        In the last paragraph, the sequence "not because the Communists may be doing it, not because we seek their votes, but because it is right" is arranged so that
      options:
        - |
          the most cynical motive comes last for emphasis
        - |
          all three reasons are presented as equally true
        - |
          two rejected motives are set aside first and the true motive, held for the end, receives the greatest emphasis
        - |
          the reasons are given in chronological order
      option_explanations:
        - |
          The last reason, because it is right, is the moral one; the cynical motives are the ones set aside.
        - |
          The word not before the first two reasons rejects them; only the third is affirmed.
        - |
          Correct. Three parallel because clauses build a pattern; the but turns from denial to affirmation, and end focus gives the moral reason its weight.
        - |
          The reasons are ranked by validity, not by time; nothing in them is chronological.
      answer: 2
      explanation: |
        Placement shows priority. A not X, not Y, but Z pattern saves the writer's real point for the position of greatest emphasis.

    - slug: u08-w29-q05
      type: multi_select
      topic_code: "7.B"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 2
      partial_credit: true
      stimulus: *jfk_pledge
      prompt: |
        Which TWO statements accurately describe the final sentence, "If a free society cannot help the many who are poor, it cannot save the few who are rich"? Select two.
      options:
        - |
          A dependent clause stating a condition comes first, and the independent clause stating its consequence follows.
        - |
          The two clauses are balanced, with contrasting terms (many and few, poor and rich) in matching positions.
        - |
          The sentence is compound: two independent clauses joined by a coordinating conjunction.
        - |
          The sentence is a fragment that lacks a main verb.
      option_explanations:
        - |
          Correct. The if clause cannot stand alone; it sets the condition, and the main clause gives the result, making the claim a logical consequence.
        - |
          Correct. The clauses mirror each other, and the paired opposites make the sentence an antithesis that links the fate of rich and poor.
        - |
          The first clause begins with if and is dependent; there is no coordinating conjunction joining the clauses.
        - |
          The main clause, it cannot save the few who are rich, has a subject and a verb; the sentence is complete.
      answer: [0, 1]
      explanation: |
        A conditional complex sentence is a logic machine: condition, then consequence. Balance turns it into an aphorism.

    - slug: u08-w29-q06
      type: multiple_choice
      topic_code: "1.B"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 1
      stimulus: *jfk_pledge
      prompt: |
        Phrases such as "to friend and foe alike" and "Let every nation know, whether it wishes us well or ill" show that Kennedy
      options:
        - |
          is unsure which countries are allies of the United States
        - |
          intends the speech for a domestic audience only
        - |
          wishes to avoid offending the Soviet Union
        - |
          understands that in the Cold War his words will be heard by allies and adversaries at once, and shapes a single message to reassure the first and warn the second
      option_explanations:
        - |
          The phrases are deliberate, not uncertain; they address both groups on purpose.
        - |
          The phrases explicitly reach beyond the domestic audience to every nation.
        - |
          The pledge to oppose any foe is a warning; Kennedy does not avoid confronting adversaries.
        - |
          Correct. Naming both audiences in one breath tells allies the commitment is firm and tells adversaries the same commitment is a threat. One sentence serves opposite needs.
      answer: 3
      explanation: |
        Spiral review of 1.B: notice when a speaker names more than one audience and how one statement is shaped to meet each audience's needs.

    - slug: u08-w29-q07
      type: true_false
      topic_code: "7.B"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 1
      stimulus: *jfk_pledge
      prompt: |
        True or false: "This much we pledge--and more." is a complex sentence containing a dependent clause.
      answer: false
      explanation: |
        False. It is a simple sentence: one short independent clause (we pledge this much, with the object moved to the front for emphasis) followed by an appended phrase, and more. Its brevity after the long sentences before it makes it land as a vow.

    - slug: u08-w29-q08
      type: multiple_choice
      topic_code: "7.A"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 1
      stimulus: *jfk_pledge
      prompt: |
        The metaphor "the torch has been passed to a new generation" contributes to the passage by
      options:
        - |
          suggesting that the previous generation has failed and must be replaced
        - |
          presenting the transfer of leadership as a solemn handing-on of a shared trust, like a flame carried in a relay, which honours the old generation while summoning the new
        - |
          comparing the presidency to a dangerous fire that must be controlled
        - |
          introducing a humorous note into a serious occasion
      option_explanations:
        - |
          A torch passed in a relay is honoured, not discarded; the metaphor stresses continuity, not failure.
        - |
          Correct. The image of a carried flame implies continuity (the heirs of that first revolution) and responsibility, and casts Kennedy's generation as next in a line rather than as rivals of the old.
        - |
          The torch is a light to be carried forward, not a fire to be contained.
        - |
          The image is ceremonial and serious, matching the formal tone of the speech.
      answer: 1
      explanation: |
        Spiral review of 7.A: a comparison carries the attitudes attached to its image. A torch passed hand to hand means trust and continuity.

    # ---- Revision set: an orientation speech
    - slug: u08-w29-q09
      type: multiple_choice
      topic_code: "8.B"
      source: written for this course
      points: 1
      stimulus: &w29_draft |
        *The following is a draft of a short speech a senior is writing to deliver at freshman orientation. The writer wants to persuade new students to join at least one school activity and wants every sentence to make its ideas and their relationships clear.*

        (1) Four years ago I sat where you are sitting, and I was sure I would spend high school alone. (2) I joined the debate team. (3) My sister made me. (4) I was terrified at the first meeting. (5) I stayed. (6) Debate taught me to speak in front of a room, to listen to people I disagreed with and that I could be wrong without being humiliated. (7) There are more than sixty clubs here, and you should join one, and it does not matter which one, and you will be glad. (8) Some of you are worried about time, because your schedules are already full. (9) Joining one activity is not a burden, it is the way you will find your people. (10) You will not remember your locker combination in four years, you will remember the people you met.
      prompt: |
        The writer wants to combine sentences 2 and 3 to show the relationship between them. Which version best accomplishes this goal?
      options:
        - |
          I joined the debate team only because my sister made me.
        - |
          I joined the debate team, and my sister made me.
        - |
          I joined the debate team, my sister made me.
        - |
          My sister, the debate team, made me join.
      option_explanations:
        - |
          Correct. The subordinating conjunction because names the cause, and only adds the honest reluctance that makes the speaker's later enthusiasm persuasive to nervous freshmen.
        - |
          The coordinating and treats the ideas as merely added together and hides the cause-and-effect relationship.
        - |
          Joining two independent clauses with only a comma creates a comma splice and still leaves the relationship unstated.
        - |
          The appositive makes it sound as if the sister were the debate team; the sentence garbles the meaning.
      answer: 0
      explanation: |
        Skill 8.B: choose the connecting word that names the relationship. Cause calls for because or since, not and.

    - slug: u08-w29-q10
      type: multiple_choice
      topic_code: "8.B"
      source: written for this course
      points: 1
      stimulus: *w29_draft
      prompt: |
        The writer wants to combine sentences 4 and 5 so that the speaker's decision to stay receives the emphasis. Which version best accomplishes this goal?
      options:
        - |
          I stayed, although I was terrified at the first meeting.
        - |
          I was terrified at the first meeting, and I stayed.
        - |
          Although I was terrified at the first meeting, I stayed.
        - |
          Terrified at the first meeting, and staying.
      option_explanations:
        - |
          The concession is correctly subordinated, but placing it last gives the fear the final, emphatic position instead of the decision.
        - |
          And joins the clauses as equals and loses the contrast between fear and staying.
        - |
          Correct. The although clause concedes the fear first, and the short main clause lands at the end, where English sentences place their emphasis.
        - |
          The version is a fragment with no main clause; it leaves the reader unsure what happened.
      answer: 2
      explanation: |
        Subordinate the idea you concede; put the idea you want remembered in the main clause at the end.

    - slug: u08-w29-q11
      type: multiple_choice
      topic_code: "8.B"
      source: written for this course
      points: 1
      stimulus: *w29_draft
      prompt: |
        Sentence 7 strings four clauses together with and. Which revision best clarifies the ideas and their relationships?
      options:
        - |
          There are more than sixty clubs here and you should join one and it does not matter which one and you will be glad.
        - |
          More than sixty clubs, one of which you should join, mattering not which, gladly.
        - |
          There are more than sixty clubs here. You should join one. It does not matter which one. You will be glad.
        - |
          Our school has more than sixty clubs; join one, any one, and you will be glad you did.
      option_explanations:
        - |
          Removing the commas makes the stringy coordination harder to read without changing the problem.
        - |
          The revision abandons clauses for a confusing chain of phrases and loses the command to the audience.
        - |
          Splitting into four short sentences replaces stringy coordination with choppiness; the relationships are still unstated.
        - |
          Correct. The semicolon separates the fact from the advice, the appositive any one compresses the point that the choice does not matter, and the final clause states the result.
      answer: 3
      explanation: |
        Stringy coordination treats every idea as equal. Rank the ideas and connect them with punctuation and words that show how they relate.

    - slug: u08-w29-q12
      type: multi_select
      topic_code: "8.B"
      source: written for this course
      points: 2
      partial_credit: true
      stimulus: *w29_draft
      prompt: |
        Sentence 9 joins two independent clauses with only a comma. Which TWO revisions correct the error and make the relationship between the ideas clear? Select two.
      options:
        - |
          Joining one activity is not a burden; it is the way you will find your people.
        - |
          Joining one activity is not a burden but the way you will find your people.
        - |
          Joining one activity is not a burden, it is, the way you will find your people.
        - |
          Joining one activity, not a burden, the way you will find your people.
      option_explanations:
        - |
          Correct. The semicolon properly joins two closely related independent clauses and keeps the not X, it is Y contrast.
        - |
          Correct. Not... but makes the correction in a single clause, which is concise and makes the contrast explicit.
        - |
          The extra comma does not fix the comma splice and adds an error of its own.
        - |
          Removing the verbs turns the sentence into a fragment; nothing is asserted.
      answer: [0, 1]
      explanation: |
        Fix a comma splice in the way that shows the relationship you mean: a semicolon for closely related clauses, or a not... but construction for a correction.

    - slug: u08-w29-q13
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: *w29_draft
      prompt: |
        The writer wants sentence 10 to close the speech with a memorable, resolute tone, in the manner of Kennedy's balanced clauses. Which version best accomplishes this goal?
      options:
        - |
          In four years you will forget your locker combination; you will never forget the people you met.
        - |
          You will not remember your locker combination in four years, but you might remember some people, probably.
        - |
          Locker combinations are hard to remember, and so are a lot of things.
        - |
          In four years you will remember people more than combinations, I think.
