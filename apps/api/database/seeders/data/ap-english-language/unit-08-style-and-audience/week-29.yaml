    - slug: u08-w29-q22
      type: long_answer
      topic_code: "7.B"
      source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
      points: 6
      prompt: |
        Write one well-developed analytical paragraph (about 200-250 words) that makes a claim about how Kennedy combines and places clauses to show the relationships among his ideas and to achieve his purpose. Analyse at least two sentences from different parts of the speech.
      answer: |
        Claim: Kennedy builds his argument for vigilant but hopeful leadership from balanced clauses that hold opposing ideas in tension, so that strength and peace, duty and reward, seem to imply each other. Evidence 1: "United, there is little we cannot do in a host of cooperative ventures. Divided, there is little we can do." Commentary: the near-identical clauses differ only in united and divided and in cannot and can, so the structure itself proves that unity is the condition of power, a message to wavering allies. Evidence 2: "Let us never negotiate out of fear. But let us never fear to negotiate." Commentary: the chiasmus reverses negotiate and fear, rejecting appeasement and refusal in one breath and defining a middle course for the adversary to hear. Evidence 3 (optional): the closing "ask not" reversal hands the active role to the citizen. Link: Kennedy's clauses do not just decorate his ideas; their balance enacts the balanced policy he proposes.
      explanation: |
        6 points. Claim (1): an arguable claim connecting clause structure (balance, subordination, placement, reversal) to relationships among ideas and to Kennedy's purpose. Evidence (2): 1 point for each of two accurate quotations from different parts of the speech (2 total). Commentary (3): 3 points if each sentence's structure is analysed precisely (which clause is main or dependent, what is parallel or reversed, what is placed last) and linked to the relationship it shows and to the purpose or audience; 2 points if analysis is accurate but uneven or stops short of purpose; 1 point if commentary names devices without explaining relationships; 0 for paraphrase.
