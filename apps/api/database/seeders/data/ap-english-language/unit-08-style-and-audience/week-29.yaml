        A word such as because, although, if or unless, which begins a dependent clause and names its relationship to the main clause, is called a subordinating ____.
      answer: ["conjunction", "conjunctions"]
      explanation: |
        Subordinating conjunctions name the logic of a sentence: cause (because), concession (although), condition (if, unless) and time (when, until).

