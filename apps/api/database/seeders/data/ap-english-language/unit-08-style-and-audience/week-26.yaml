    - slug: u08-w26-q19
      type: short_answer
      topic_code: "1.B"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 2
      prompt: |
        In two or three sentences, explain how Roosevelt's attack on the "money changers" demonstrates an understanding of his audience's beliefs and values.
      answer: |
        By 1933 many Americans believed that bankers and speculators had caused the crash and then refused to help. Roosevelt names them as the villains and frames their failure in the language of the Gospel story, so he confirms what his audience already believed and joins their economic anger to religious values they held, which makes his promise to "restore that temple" feel like a moral cause rather than a policy program.
      explanation: |
        1 point: identifies a belief or value of the audience that the attack draws on (distrust of bankers; religious faith; a sense of moral betrayal). 1 point: explains how the allusion or the blame uses that belief or value to build support (unites the audience against a common villain, makes recovery a moral cause). A response that only defines the allusion earns at most 1.

    - slug: u08-w26-q20
      type: short_answer
      topic_code: "2.B"
      source: written for this course
      points: 2
      prompt: |
        In the student's letter to the retirees' association, sentence 8 reads: *Some people say young people don't care about the library anymore, but that's just not true.* Rewrite the sentence so that it answers the objection in a way this audience will find respectful and convincing. Then, in one sentence, explain your choice.
      answer: |
        Revision: *Some of you may wonder whether young people still use the library; last year students checked out more than a third of its books and filled every seat in the study room until closing.* Explanation: the revision treats the objection as a fair question instead of calling it false, and answers it with evidence a skeptical reader can check.
      explanation: |
        1 point: the revision addresses the objection respectfully (as a reasonable concern, without dismissing or mocking the readers) and keeps the writer's position. 1 point: the explanation names how the revision fits the audience (respect, evidence, common ground). Invented numbers are acceptable in a draft exercise if they are plausible.

    - slug: u08-w26-q21
      type: multiple_choice
      topic_code: "5.A"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 1
      prompt: |
        Which best describes the line of reasoning in the first five paragraphs of Roosevelt's First Inaugural Address?
      options:
        - |
          He asserts confidence, names the audience's hardships honestly, argues that the cause is human failure rather than scarcity, and blames the financiers, preparing a call for action.
        - |
          He lists his policies one by one, defends each with statistics, and closes by asking for votes.
