    # ---- Audience and the rhetorical situation
    - slug: u08-w26-q15
      type: multiple_choice
      topic_code: "1.B"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 1
      prompt: |
        Later in the address Roosevelt says that "we must move as a trained and loyal army willing to sacrifice for the good of a common discipline." This comparison draws most directly on which feature of his 1933 audience?
      options:
        - |
          Its eagerness to send troops abroad to restore foreign markets
        - |
          Its memory of national mobilization in the World War, when the country had united and the government had acted quickly
        - |
          Its belief that the army should replace Congress
        - |
          Its distrust of any form of collective effort
      option_explanations:
        - |
          The comparison concerns discipline and unity at home; Roosevelt explicitly puts international trade second to "the establishment of a sound national economy."
        - |
          Correct. Many listeners remembered 1917-1918. The analogy borrows that shared experience of sacrifice and swift government action to justify unity and strong leadership now.
        - |
          Roosevelt stresses that his program fits "the form of government which we have inherited," and he will ask Congress for power; he does not propose replacing it.
        - |
          The analogy assumes the opposite: that the audience values collective sacrifice and will accept "a common discipline."
      answer: 1
      explanation: |
        Comparisons persuade when they borrow the feelings an audience attaches to an experience it already knows.

    - slug: u08-w26-q16
      type: true_false
      topic_code: "2.B"
      source: general knowledge
      points: 1
      prompt: |
        True or false: demonstrating an understanding of an audience's beliefs means agreeing with everything the audience already believes.
      answer: false
      explanation: |
        False. Understanding an audience means knowing its beliefs, values and needs well enough to persuade it, which often means challenging a belief in terms of a value the audience holds. Telling an audience only what it wants to hear is pandering.

