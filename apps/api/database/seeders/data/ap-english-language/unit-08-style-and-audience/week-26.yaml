          Correct. Each step prepares the next: confidence earns a hearing, honesty earns trust, the diagnosis makes the problem solvable, and the villains give the audience a target before the program arrives.
        - |
          The specific measures come later, and the speech offers no statistics; the opening is diagnosis, not a list of policies.
        - |
          Roosevelt says almost nothing about himself beyond his promise of candor; the opening is about the nation's condition.
        - |
          Foreign nations do not appear in the opening; the comparison offered is with "the perils which our forefathers conquered."
      answer: 0
      explanation: |
        Spiral review of 5.A: describe a line of reasoning as a sequence of claims, each preparing the next, and say how the sequence suits the audience.

    - slug: u08-w26-q22
      type: long_answer
      topic_code: "1.B"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 4
      prompt: |
        Write one well-developed paragraph (about 150-200 words) that makes a claim about how Roosevelt's First Inaugural Address demonstrates an understanding of his audience's needs in March 1933. Support it with at least two short quotations from different parts of the speech, and explain how each one meets a specific need of that audience.
      answer: |
        Claim: Roosevelt understands that a frightened audience needs both honesty and a sense of its own power, so he alternates hard truths with reassurance that places the remedy in the listeners' hands. Evidence 1: he concedes that "Only a foolish optimist can deny the dark realities of the moment." Commentary: after three years of failed promises, listeners need a leader who sees what they see; the concession separates him from the optimists and earns trust. Evidence 2: he closes by insisting that "The people of the United States have not failed" and that they have "registered a mandate" for action. Commentary: crediting the people answers their need for dignity and turns his request for broad power into their own choice. Link: honesty earns their trust, and flattery of their judgment converts trust into consent.
      explanation: |
        4 points. Claim (1): an arguable claim about how the speech meets a specific audience need (reassurance, honesty, action, dignity, unity), not a summary. Evidence (1): at least two accurate, short quotations from different parts of the speech. Commentary (2): 2 points if each quotation is linked to a specific need of the 1933 audience and to the claim; 1 point if the commentary is thin, general (the speech is inspiring) or explains only one quotation; 0 if the paragraph only summarises.
