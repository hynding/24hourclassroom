    - slug: u08-w26-q13
      type: multiple_choice
      topic_code: "4.B"
      source: written for this course
      points: 1
      stimulus: *w26_draft
      prompt: |
        The writer wants to revise sentence 2 into a thesis that is defensible and suited to this audience. Which version best accomplishes this goal?
      options:
        - |
          In this letter I will talk about the library levy.
        - |
          The library is open from 9:00 a.m. to 5:00 p.m. on weekdays.
        - |
          Keeping the library open on evenings and weekends would serve every age group in our neighborhood, from students who need a place to study to retirees who rely on its clinic and large-print books.
        - |
          Everyone agrees that libraries are important.
      option_explanations:
        - |
          An announcement of topic is not a claim; it takes no position that requires defense.
        - |
          A fact about current hours cannot be argued with, so it cannot serve as a thesis.
        - |
          Correct. The thesis takes a position that needs proof and previews a line of reasoning that includes the readers themselves, not only students.
        - |
