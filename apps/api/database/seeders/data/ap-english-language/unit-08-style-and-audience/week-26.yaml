week: 26
unit: 8
title: Speaking to a Frightened Nation in Roosevelt's First Inaugural
topics: ["1.B", "2.B"]
texts:
  - author: Franklin D. Roosevelt
    title: First Inaugural Address
    year: 1933
    url: https://www.gutenberg.org/ebooks/925
    us_government_work: true
guide: guides/week-26.md
guide_description: |
  The first week of Unit 8, "Style for an Audience": how an argument shows that it understands what an audience
  believes, values and needs (1.B), and how to write for a particular audience yourself (2.B). The case study is
  Franklin D. Roosevelt's First Inaugural Address of March 4, 1933, given to a nation in the fourth year of the
  Depression with its banks closing. Four close readings, a lesson on audience analysis and on revising a draft for
  a skeptical audience, common mistakes, the exam connection and a self-check.
flashcards_description: |
  30 cards on audience analysis (beliefs, values, needs; shared and divided audiences; concession and common ground),
  the rhetorical situation of March 1933, and the key moves and lines of Roosevelt's First Inaugural Address.

flashcards:
  - front: "Skill 1.B in Unit 8 → what the reading skill asks of a speech"
    back: |
      Explain how an argument demonstrates understanding of an audience's beliefs, values or needs. Not *who is the audience?* (that is 1.A) but *what in the text shows the writer knows what this audience believes, cares about or fears, and how does the writer use that knowledge?*
    topic_code: "1.B"
  - front: "Skill 2.B in Unit 8 → what the writing skill asks of a draft"
    back: |
      Demonstrate an understanding of an audience's beliefs, values or needs in your own writing: choosing evidence the audience will trust, vocabulary it shares, concessions it expects and appeals to what it already values.
    topic_code: "2.B"
  - front: "Audience beliefs vs values vs needs → Roosevelt's 1933 listeners"
    back: |
      Beliefs: what the audience holds to be true (the banks are unsafe). Values: what it holds to be good or important (hard work, honesty, faith). Needs: what it lacks or wants right now (work, reassurance, a plan). A strong argument touches all three.
    topic_code: "1.B"
  - front: "Primary vs secondary audience → who heard Roosevelt in 1933"
    back: |
      The primary audience is the one directly addressed (the crowd at the Capitol, "my fellow Americans"); a secondary audience also hears or reads (Congress, bankers, foreign governments, later historians). Strong speakers write for both at once.
    topic_code: "1.B"
  - front: "Friendly, neutral and hostile audiences → what each needs from a draft"
    back: |
      A friendly audience needs motivation and a plan; a neutral one needs evidence and clarity; a hostile one needs common ground and concessions before any claim. Identify which you face before choosing appeals.
    topic_code: "2.B"
  - front: "Common ground → how a writer builds it with a skeptical reader"
    back: |
      A belief or value that writer and audience already share, stated early so that later, harder claims grow out of agreement rather than against it.
    topic_code: "2.B"
  - front: Audience-aware concession → why it helps
    back: |
      Granting a point the audience already believes ("Only a foolish optimist can deny...") shows the writer has heard them, which earns the trust needed for the claim that follows.
    topic_code: "2.B"
  - front: Ethos built for a particular audience
    back: |
      Credibility is not fixed: it depends on what this audience respects. Roosevelt's audience in 1933 distrusted bankers and wanted frankness, so he built ethos by promising candor and blaming "money changers."
    topic_code: "1.B"
  - front: Roosevelt's First Inaugural → date and setting
    back: |
      Saturday, March 4, 1933, on the East Portico of the Capitol, broadcast by radio to the nation. Roosevelt took the oath from Chief Justice Charles Evans Hughes after riding to the Capitol with the outgoing President Hoover.
    topic_code: "1.A"
  - front: Roosevelt's First Inaugural → its exigence
    back: |
      The fourth winter of the Great Depression: roughly a quarter of workers unemployed, farm prices collapsed, and a wave of bank failures that had led many states to close their banks in the days before the inauguration.
    topic_code: "1.A"
  - front: Roosevelt's 1933 audience → its dominant need
    back: |
      Reassurance joined to action. Listeners were frightened and had lost faith in institutions; they needed to hear the crisis named honestly and a leader promise to act at once.
    topic_code: "1.B"
  - front: "Roosevelt's opening promise of \"candor\" → what it shows about his audience"
    back: |
      He begins by telling listeners what they "expect": "a candor and a decision." By naming their expectation he signals he knows they are tired of evasions and optimistic forecasts, and he binds himself to meet that need.
    topic_code: "1.B"
  - front: "\"the only thing we have to fear is fear itself\" → the move"
    back: |
      Roosevelt relocates the danger from the economy to the audience's own panic, which he calls "nameless, unreasoning, unjustified terror." If fear is the obstacle, the audience can overcome it, and the next step, trust in leadership, becomes the remedy.
    topic_code: "1.B"
  - front: "Roosevelt's list of losses (\"Values have shrunken...\") → why include it"
    back: |
      A series of short clauses names the audience's experience: prices, taxes, frozen trade, idle factories, farmers without markets, lost savings. Saying it aloud proves the speaker sees what they see before he asks them to believe anything.
    topic_code: "1.B"
  - front: "\"They concern, thank God, only material things\" → audience values"
    back: |
      The aside appeals to a religious, moral audience: material losses are real but lesser. It sets up the speech's claim that "social values more noble than mere monetary profit" can guide recovery.
    topic_code: "1.B"
  - front: "Roosevelt's \"Only a foolish optimist can deny the dark realities\" → function"
    back: |
      A concession that separates Roosevelt from the cheerful predictions of the previous years. The audience had heard prosperity promised for three years; he earns trust by refusing to pretend.
    topic_code: "2.B"
  - front: "\"We are stricken by no plague of locusts\" → appeal"
    back: |
      A biblical comparison an audience raised on scripture would recognise: unlike Egypt's plagues, this disaster is man-made, so men can end it. The claim that "our distress comes from no failure of substance" becomes a reason for hope.
    topic_code: "1.B"
  - front: "Roosevelt's \"money changers\" → the allusion and its use"
    back: |
      Jesus driving the money changers from the temple. It names a villain the audience already distrusted (bankers and speculators), joins economic anger to moral and religious values, and promises a cleansing: "restore that temple to the ancient truths."
    topic_code: "1.B"
  - front: "\"This Nation asks for action, and action now.\" → what need it meets"
    back: |
      The short, repeated sentence answers the audience's impatience. After diagnosis and moral argument, Roosevelt speaks for the audience ("This Nation asks") and turns their demand into his mandate.
    topic_code: "1.B"
  - front: Roosevelt's war analogy → why it suits a 1933 audience
    back: |
      He proposes treating unemployment "as we would treat the emergency of a war" and asks for power "as great as the power that would be given to me if we were in fact invaded by a foreign foe." Listeners remembered 1917-1918, when the nation united and the government acted fast.
    topic_code: "1.B"
  - front: "Roosevelt's repeated \"It can be helped by...\" → audience effect"
    back: |
      Anaphora turns a list of policies into a drumbeat of possibility. Each clause tells a worried listener (a farmer facing foreclosure, a town paying for relief) that something specific is coming, then closes: "it can never be helped merely by talking about it."
    topic_code: "7.A"
  - front: "Roosevelt's \"good neighbor\" → the secondary audience"
    back: |
      A short passage on world policy speaks to foreign governments, promising a nation that respects "the sanctity of his agreements in and with a world of neighbors." (The phrase later named his Good Neighbor Policy toward Latin America, but the speech itself names no region.) The domestic audience hears a homely image; the foreign one hears a diplomatic pledge.
    topic_code: "1.B"
  - front: "\"The people of the United States have not failed.\" → the ending's move"
    back: |
      Roosevelt credits the audience rather than himself: they "registered a mandate" for "direct, vigorous action." Flattering their judgment makes his request for discipline and power feel like their own choice.
    topic_code: "1.B"
  - front: Inaugural address → the genre's expectations
    back: |
      An epideictic (ceremonial) speech that also deliberates: it honours national values, unites a divided electorate, and sets out the new president's direction. Audiences expect dignity, appeals to shared history and a call to common effort.
    topic_code: "1.A"
  - front: Audience analysis → three questions before you draft
    back: |
      What does this audience already believe about the issue? What do they value most (fairness, safety, cost, tradition, freedom)? What do they need from me (information, reassurance, a reason to act)? Answer each before choosing evidence.
    topic_code: "2.B"
  - front: Audience-tailored evidence → example
    back: |
      For a school board worried about cost, a budget comparison; for parents worried about safety, an incident count; for students, a description of a typical day. Same claim, different proof.
    topic_code: "2.B"
  - front: Diction for an audience → jargon vs shared language
    back: |
      Technical or insider words exclude an audience that does not share them; plain, concrete words they use themselves include them. Revise jargon such as *optimize stakeholder outcomes* into what it means for the listener.
    topic_code: "2.B"
  - front: Roosevelt in 1933 → pandering or understanding his audience?
    back: |
      Pandering tells an audience only what it wants to hear. Understanding an audience means knowing its beliefs well enough to challenge them persuasively: Roosevelt tells listeners hard truths, but in terms of values they hold.
    topic_code: "2.B"
  - front: First-person plural (we, our) → audience effect
    back: |
      "We face our common difficulties" places speaker and audience in one group with one problem, turning the speech from a lecture into a shared task. Watch for the moment a speaker shifts from "I" to "we" or "you."
    topic_code: "1.B"
  - front: AP Q2 rhetorical analysis → how 1.B shows up
    back: |
      Prompts often say the speaker addresses a specific audience and ask how the choices achieve the purpose. The strongest essays link each choice to what that audience believed, valued or needed at that moment.
    topic_code: "1.B"

quiz:
  description: |
    22 questions · about 35 minutes · an eight-question set on the opening of Roosevelt's First Inaugural Address,
    a six-question revision set on a student's draft letter to a skeptical audience, and eight more items on audience
    and the rhetorical situation. Multiple choice, select-all and true/false items are graded at once; the
    fill-in-the-blank items are matched automatically; the short answers and the paragraph are graded by your teacher
    against the model answers and scoring notes.
  questions:
    # ---- Passage set: the opening of the First Inaugural
    - slug: u08-w26-q01
      type: multiple_choice
      topic_code: "1.A"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 1
      stimulus: &fdr_open |
        *The following passage is the opening of Franklin D. Roosevelt's First Inaugural Address, delivered at the Capitol and broadcast by radio on March 4, 1933.*

        I am certain that my fellow Americans expect that on my induction into the Presidency I will address them with a candor and a decision which the present situation of our Nation impels. This is preeminently the time to speak the truth, the whole truth, frankly and boldly. Nor need we shrink from honestly facing conditions in our country today. This great Nation will endure as it has endured, will revive and will prosper. So, first of all, let me assert my firm belief that the only thing we have to fear is fear itself--nameless, unreasoning, unjustified terror which paralyzes needed efforts to convert retreat into advance. In every dark hour of our national life a leadership of frankness and vigor has met with that understanding and support of the people themselves which is essential to victory. I am convinced that you will again give that support to leadership in these critical days.

        In such a spirit on my part and on yours we face our common difficulties. They concern, thank God, only material things. Values have shrunken to fantastic levels; taxes have risen; our ability to pay has fallen; government of all kinds is faced by serious curtailment of income; the means of exchange are frozen in the currents of trade; the withered leaves of industrial enterprise lie on every side; farmers find no markets for their produce; the savings of many years in thousands of families are gone.

        More important, a host of unemployed citizens face the grim problem of existence, and an equally great number toil with little return. Only a foolish optimist can deny the dark realities of the moment.

        Yet our distress comes from no failure of substance. We are stricken by no plague of locusts. Compared with the perils which our forefathers conquered because they believed and were not afraid, we have still much to be thankful for. Nature still offers her bounty and human efforts have multiplied it. Plenty is at our doorstep, but a generous use of it languishes in the very sight of the supply. Primarily this is because the rulers of the exchange of mankind's goods have failed, through their own stubbornness and their own incompetence, have admitted their failure, and abdicated. Practices of the unscrupulous money changers stand indicted in the court of public opinion, rejected by the hearts and minds of men.
      prompt: |
        Which best describes the exigence of the speech?
      options:
        - |
          A deepening economic collapse, with mass unemployment and failing banks, that has left the public frightened and distrustful as a new president takes office
        - |
          A foreign invasion that requires the new president to ask Congress for a declaration of war
        - |
          A dispute between the outgoing and incoming presidents over who caused the Depression
        - |
          A plague of locusts that has destroyed the nation's harvests and left farmers without produce
      option_explanations:
        - |
          Correct. The passage catalogues shrunken values, frozen trade, lost savings and "a host of unemployed citizens," and it treats fear itself as the immediate danger. The inauguration of a new president in that crisis is the occasion that calls for the speech.
        - |
          Roosevelt later compares the emergency to an invasion, but that is an analogy; nothing in the opening describes an actual foreign enemy or a call for war.
        - |
          The speech never names Hoover or argues about him. It blames "the rulers of the exchange of mankind's goods," a class of financiers, not the outgoing president.
        - |
          Roosevelt says the opposite: "We are stricken by no plague of locusts." The point is that nature still "offers her bounty," so the disaster is man-made.
      answer: 0
      explanation: |
        Exigence (1.A) is the problem or occasion that calls a text into being. Find it in what the speaker treats as urgent and in the context the passage itself supplies.

    - slug: u08-w26-q02
      type: multiple_choice
      topic_code: "1.B"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 1
      stimulus: *fdr_open
      prompt: |
        By opening with the claim that his "fellow Americans expect" him to speak "with a candor and a decision," Roosevelt primarily
      options:
        - |
          warns the audience that his speech will be long and technical
        - |
          suggests that the audience doubts he was legally elected
        - |
          shows he understands that his listeners, tired of reassurances that had proved false, want blunt honesty and firm action, and promises to give them both
        - |
          admits that he has not yet decided what policies he will propose
      option_explanations:
        - |
          Candor means frankness, not technical detail, and the opening says nothing about length. The word choice points to honesty, not complexity.
        - |
          Nothing in the passage raises doubts about the election; the audience's expectation is about how he will speak, not whether he should be there.
        - |
          Correct. Roosevelt names the audience's expectation before they can voice it, which shows he knows what they need ("the truth, the whole truth") and commits him to meeting it. The rest of the opening keeps that promise by naming the hardships plainly.
        - |
          Here the word decision means decisiveness. Far from admitting indecision, he promises it, and later in the speech he announces "the lines of attack."
      answer: 2
      explanation: |
        Skill 1.B: when a speaker tells an audience what it expects or wants, ask what that reveals about the audience's state of mind and how the speaker uses it to build trust.

    - slug: u08-w26-q03
      type: multiple_choice
      topic_code: "1.B"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 1
      stimulus: *fdr_open
      prompt: |
        The assertion that "the only thing we have to fear is fear itself" is most effective for this audience because it
      options:
        - |
          denies that the economic hardships the audience is suffering are real
        - |
          identifies the audience's own panic as the immediate obstacle, a danger listeners themselves can overcome by giving the support he asks for
        - |
          blames the audience for causing the Depression through cowardice
        - |
          suggests that the government has already solved the economic crisis
      option_explanations:
        - |
          Roosevelt goes on to list the hardships in detail and calls them "the dark realities of the moment." He does not deny them; he denies that they must defeat the nation.
        - |
          Correct. By naming fear as "nameless, unreasoning, unjustified terror" that paralyzes, he turns a vast, impersonal crisis into something each listener can resist, and links resistance to support for "leadership in these critical days."
        - |
          He blames "the rulers of the exchange" and "money changers," not ordinary people. Fear is presented as natural but unjustified, not as the cause of the crisis.
        - |
          He promises recovery ("will revive and will prosper") but announces action still to come. Claiming the crisis was solved would contradict his promise of candor.
      answer: 1
      explanation: |
        A frightened audience needs a version of the problem it can act on. Roosevelt's famous line reframes the crisis in exactly those terms.

    - slug: u08-w26-q04
      type: multiple_choice
      topic_code: "7.A"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 1
      stimulus: *fdr_open
      prompt: |
        The sentence beginning "Values have shrunken to fantastic levels" is built as a long series of short independent clauses joined by semicolons. The effect of this syntax is to
      options:
        - |
          suggest that the hardships are unrelated and can be ignored one at a time
        - |
          slow the speech down so that listeners lose track of the argument
        - |
          signal that Roosevelt is uncertain which problem is most serious
        - |
          pile up the audience's losses one after another, so that the full weight of their experience is acknowledged before he offers hope
      option_explanations:
        - |
          The cumulative structure has the opposite effect: each clause adds to the last until the losses form one picture of national distress.
        - |
          Each clause is short and concrete (taxes, trade, farmers, savings), which makes the series easy to follow even by radio.
        - |
          The list is not a ranking; its purpose is completeness, not uncertainty. The next paragraph then names the "more important" problem of unemployment without hesitation.
        - |
          Correct. The catalogue mirrors the many forms the Depression took in listeners' lives. Accumulation is a form of acknowledgment, and it sets up the turn: "Yet our distress comes from no failure of substance."
      answer: 3
      explanation: |
        Spiral review of 7.A: syntax contributes to tone and purpose. A long series of parallel clauses creates weight and completeness.

    - slug: u08-w26-q05
      type: multi_select
      topic_code: "1.B"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 2
      partial_credit: true
      stimulus: *fdr_open
      prompt: |
        Which TWO features of the passage most clearly show Roosevelt acknowledging his audience's suffering before he asks for their trust? Select two.
      options:
        - |
          The concession that "Only a foolish optimist can deny the dark realities of the moment"
        - |
          The detail that "the savings of many years in thousands of families are gone"
        - |
          A table of unemployment figures for each state
        - |
          A promise that international trade will be restored before any domestic program
      option_explanations:
        - |
          Correct. Roosevelt separates himself from the optimists whose promises had failed, granting what listeners already knew to be true.
        - |
          Correct. The concrete image of family savings lost names a private grief many listeners had felt, and puts it in the speech of the nation's leader.
        - |
          The passage contains no statistics or tables; it describes hardship in general and concrete terms suited to a spoken, radio audience.
        - |
          Nothing in the passage mentions world trade. Later in the speech Roosevelt says the reverse: the emergency at home "cannot wait" on world trade.
      answer: [0, 1]
      explanation: |
        An audience in distress listens to a speaker who has first shown that he sees what they see. Concession and concrete detail are the two tools here.

    - slug: u08-w26-q06
      type: multiple_choice
      topic_code: "3.A"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 1
      stimulus: *fdr_open
      prompt: |
        In the last paragraph, which sentence provides the evidence for the claim that "our distress comes from no failure of substance"?
      options:
        - |
          "We are stricken by no plague of locusts."
        - |
          "Primarily this is because the rulers of the exchange of mankind's goods have failed."
        - |
          "Nature still offers her bounty and human efforts have multiplied it."
        - |
          "Practices of the unscrupulous money changers stand indicted in the court of public opinion."
      option_explanations:
        - |
          This sentence restates the claim in figurative form (no natural disaster) rather than supplying proof. It is a second assertion, not evidence.
        - |
          This sentence explains the cause of the distress; it supports a different claim, that the failure is human, rather than proving that substance is plentiful.
        - |
          Correct. The claim is that the nation does not lack resources. The evidence offered is that nature's bounty remains and human effort has multiplied it, followed by the image of plenty at our doorstep.
        - |
          This sentence passes judgment on the financiers; it is part of the blame, not evidence that the nation's resources are intact.
      answer: 2
      explanation: |
        Spiral review of 3.A: separate a claim from the sentence that supports it. Ask which sentence answers the question "how do you know?"

    - slug: u08-w26-q07
      type: true_false
      topic_code: "1.B"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 1
      stimulus: *fdr_open
      prompt: |
        True or false: in this passage Roosevelt blames the American people for the economic crisis.
      answer: false
      explanation: |
        False. He blames "the rulers of the exchange of mankind's goods" and "the unscrupulous money changers," and he praises the people's "understanding and support." Blaming a frightened audience would cost him the trust he needs; naming a villain the audience already distrusted unites them behind him.

    - slug: u08-w26-q08
      type: multiple_choice
      topic_code: "7.A"
      source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
      points: 1
      stimulus: *fdr_open
      prompt: |
        The phrase "unscrupulous money changers" alludes to the Gospel story of Jesus driving the money changers from the temple. For this audience, the allusion chiefly serves to
      options:
        - |
          frame the bankers' failure as a moral offence against shared religious values, giving listeners' economic anger a righteous form
        - |
          signal that Roosevelt intends to close every church that holds investments
        - |
          show that the speech is addressed only to clergy
        - |
          soften the criticism of the bankers by presenting it as an old story
      option_explanations:
        - |
          Correct. A largely churchgoing audience would recognise the story at once. The allusion turns financial failure into desecration and prepares the promise, a few lines later, to "restore that temple to the ancient truths."
        - |
          The temple in the allusion stands for "our civilization," not for actual churches; the image is figurative.
        - |
          The allusion is part of common culture for the broad national audience addressed as "my fellow Americans," not a specialist reference.
        - |
          The allusion sharpens the criticism. In the story the money changers are driven out in anger; nothing about it softens the charge.
      answer: 0
      explanation: |
        Spiral review of 7.A with 1.B: a comparison or allusion works when it draws on a body of knowledge and values the audience already holds.

    # ---- Revision set: a letter to a skeptical audience
    - slug: u08-w26-q09
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: &w26_draft |
        *The following is a draft of a letter a student is writing to the members of a neighborhood retirees' association. The writer wants to persuade them to vote for a proposed library levy, a small sales tax that would keep the public library open on evenings and weekends.*

        (1) Dear members of the Retirees' Association: I am a junior at the high school, and I am writing about the library levy on next month's ballot. (2) The library should stay open longer because it is important. (3) Right now the main branch closes at 5:00 p.m. on weekdays and is shut all weekend. (4) The levy would add one half of one cent to the city sales tax for six years; groceries and prescription medicine would be exempt. (5) This investment would leverage community assets to optimize stakeholder engagement across demographics. (6) Students like me would have a quiet place to study after school. (7) The levy would also pay for the large-print collection and the free tax-preparation clinic, which several of your members have told me they rely on. (8) Some people say young people don't care about the library anymore, but that's just not true. (9) I know a half cent is still a cost. (10) Please vote yes, because the library needs your help.
      prompt: |
        The writer wants to acknowledge, right after sentence 4, that many readers live on fixed incomes and are wary of any new tax. Which sentence best accomplishes this goal?
      options:
        - |
          Everyone has to pay taxes sooner or later, so one more should not matter.
        - |
          Libraries are good for communities, as many studies have shown.
        - |
          The tax would apply to purchases made anywhere within the city limits.
        - |
          I know that many of you live on fixed incomes, which is why it matters that the levy exempts groceries and medicine and ends after six years.
      option_explanations:
        - |
          This dismisses the readers' concern instead of acknowledging it. An audience told its worry does not matter is less likely to keep reading generously.
        - |
          A vague appeal to unnamed studies does not address cost at all, and it ignores the specific worry the writer wants to answer.
        - |
          This adds a neutral fact but says nothing about the readers' situation; it neither recognises the fixed-income concern nor eases it.
        - |
          Correct. The sentence names the readers' situation directly and answers it with the two features of the levy that matter most to them, the exemptions and the time limit.
      answer: 3
      explanation: |
        Skill 2.B: show the audience you know what worries them, then answer the worry with evidence that fits their situation.

    - slug: u08-w26-q10
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *w26_draft
      prompt: |
        The writer wants to replace sentence 5 with a version that this audience will find clear and persuasive. Which version best accomplishes this goal?
      options:
        - |
          This investment would maximize the library's value proposition for all user segments.
        - |
          Evening and weekend hours would let working parents, students and retirees use the library at the times they are actually free.
        - |
          This investment would be very, very good for everyone in every way.
        - |
          Longer hours are the only thing that can save our city from decline.
      option_explanations:
        - |
          This swaps one set of business jargon for another. Retirees reading a letter from a neighbor expect plain words, not marketing language.
        - |
          Correct. The sentence translates the abstract claim into concrete people and times the readers can picture, including themselves.
        - |
          Intensifiers without content make the claim vaguer, not clearer, and give a skeptical reader nothing to believe.
        - |
          The overstatement invites the audience's skepticism; a reader wary of the tax will notice that the claim cannot be supported.
      answer: 1
      explanation: |
        Jargon excludes an audience that does not use it. Revise abstract nouns into the people, places and times they stand for.

    - slug: u08-w26-q11
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *w26_draft
      prompt: |
        The writer is considering moving sentence 7 to make the letter more persuasive for its audience. Where should it be placed?
      options:
        - |
          Immediately after sentence 4, so that the benefits the readers themselves value come before the benefit to students
        - |
          At the very beginning of the letter, before the greeting in sentence 1
        - |
          After sentence 10, as a postscript the reader may skip
        - |
          Nowhere; it should be deleted because it distracts from the students' needs
      option_explanations:
        - |
          Correct. Readers learn what the levy costs in sentence 4 and should then learn what it buys for them. Leading with their own interests shows the writer understands the audience's needs.
        - |
          A letter begins with its greeting; placing a detail about the clinic before it would confuse the reader about who is writing and why.
        - |
          Moving the strongest audience-specific reason to a postscript buries it, which is the opposite of what the writer wants.
        - |
          Sentence 7 is the letter's best evidence for this audience. Deleting it would leave only reasons that matter to students.
      answer: 0
      explanation: |
        Order reasons for the audience: the reason the reader cares about most usually comes first or last, in a position of emphasis.

    - slug: u08-w26-q12
      type: multi_select
      topic_code: "2.B"
