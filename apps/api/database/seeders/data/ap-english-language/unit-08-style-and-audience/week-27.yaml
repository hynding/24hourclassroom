week: 27
unit: 8
title: Tone Through Irony in Swift's A Modest Proposal
topics: ["7.A"]
texts:
  - author: Jonathan Swift
    title: A Modest Proposal
    year: 1729
    url: https://www.gutenberg.org/ebooks/1080
guide: guides/week-27.md
guide_description: |
  How word choice, comparisons and syntax create tone (7.A), studied in the most famous ironic argument in English:
  Jonathan Swift's A Modest Proposal (1729). The persona, the gap between his calm voice and his monstrous plan,
  the livestock comparisons, the cookbook diction, the arithmetic, and the turn in which Swift lists the real
  remedies he says no one should mention. Then a writing lesson on keeping an ironic tone steady, common mistakes,
  the exam connection and a self-check.
flashcards_description: |
  30 cards on tone and how it is made (diction, connotation, comparisons, syntax, register), irony and satire,
  persona, and the people, numbers and lines of A Modest Proposal.

flashcards:
  - front: "Skill 7.A in Unit 8 → what the reading skill asks of a satire"
    back: |
      Explain how word choice, comparisons and syntax contribute to the specific tone or style of a text. Name the tone precisely, point to the choice, and explain how the choice produces the tone and why the tone serves the argument.
    topic_code: "7.A"
  - front: "Tone in an argument → how Swift makes tone persuade"
    back: |
      The writer's (or speaker's) attitude toward the subject and the audience, as the words reveal it. In an argument, tone is a persuasive tool: it tells readers how to feel about a claim and about the person making it.
    topic_code: "7.A"
  - front: Tone words → why precise ones score better
    back: |
      Words such as *good*, *negative* or *serious* say almost nothing. Words such as *mock-modest*, *clinical*, *indignant*, *wry*, *detached* or *reverent* name an attitude you can then prove. A precise tone word is half of a 7.A claim.
    topic_code: "7.A"
  - front: "Diction vs connotation → Swift's breeders and dam"
    back: |
      Diction is the choice of words; connotation is the feeling or association a word carries beyond its dictionary meaning. Swift's *breeders* and *dam* denote mothers but connote livestock.
    topic_code: "7.A"
  - front: "Register → Swift's pamphlet and cookbook voices"
    back: |
      The level and kind of language suited to a setting: formal, technical, conversational, legal, culinary. Swift writes in the register of a sober economic pamphlet and a cookbook, and the clash between register and subject makes the irony.
    topic_code: "7.A"
  - front: "Verbal irony → how Swift's modest proposal uses it"
    back: |
      Saying one thing while meaning something different, often the opposite. The *modest* proposal is anything but modest; the proposer's claim to have no objections is the most objectionable thing in it.
    topic_code: "7.A"
  - front: "Satire → what A Modest Proposal shows about the form"
    back: |
      Writing that uses irony, exaggeration and ridicule to expose and criticise folly or vice, usually in hope of reform. Its target is real; its surface proposal or praise is not meant literally.
    topic_code: "7.A"
  - front: "Horatian vs Juvenalian satire → where Swift belongs"
    back: |
      Horatian satire is gentle and amused; Juvenalian satire is bitter and harsh. A Modest Proposal is Juvenalian in its savagery, though it wears a calm, polite surface.
    topic_code: "7.A"
  - front: Persona → definition and why it matters in Swift
    back: |
      A voice or character the writer adopts. Swift's proposer is a well-meaning, statistical, self-satisfied "projector," not Swift himself. Reading the proposer's views as Swift's is the basic misreading of the essay.
    topic_code: "7.A"
  - front: Projector → the 1720s meaning
    back: |
      A person who put forward schemes or projects for public improvement, often economic. Pamphlets by projectors were common in Swift's day; his persona mimics their confident arithmetic and their tone of benevolent expertise.
    topic_code: "1.A"
  - front: A Modest Proposal → publication and full title
    back: |
      Published in Dublin in 1729 as A Modest Proposal for Preventing the Children of Poor People from Being a Burthen to Their Parents or Country, and for Making Them Beneficial to the Publick. Swift was Dean of St Patrick's Cathedral, Dublin.
    topic_code: "1.A"
  - front: A Modest Proposal → its exigence
    back: |
      Severe poverty and recurring famine in Ireland in the late 1720s, made worse by absentee landlords, high rents and English restrictions on Irish trade, while earlier practical proposals (Swift's own among them) had been ignored.
    topic_code: "1.A"
  - front: Swift's proposer → the plan in one sentence
    back: |
      Of the poor's children born each year, keep twenty thousand for breeding and sell the remaining hundred thousand, at a year old, as food for "persons of quality and fortune."
    topic_code: "7.A"
  - front: "Swift's opening \"melancholy object\" → the tone it sets"
    back: |
      The essay begins in the voice of genuine pity, describing beggar mothers and ragged children in the streets. The sympathetic opening gains the reader's agreement before the proposal turns monstrous, which makes the shock greater.
    topic_code: "7.A"
  - front: "Swift's \"humbly propose\" and \"humbly offer\" → tone"
    back: |
      Mock modesty. The proposer's deference is a polite costume for an outrageous plan, and the gap between his humble manners and his proposal is the engine of the irony.
    topic_code: "7.A"
  - front: "Swift's livestock comparisons (\"sheep, black cattle, or swine\") → effect"
    back: |
      The proposer compares the poor to animals as if it were natural. The comparison exposes an attitude Swift attacks: that landlords and policy already treat the Irish poor as livestock to be managed for profit.
    topic_code: "7.A"
  - front: "Swift's \"stewed, roasted, baked, or boiled\" → the cookbook register"
    back: |
      Recipe language applied to children. The cheerful list of cooking methods, then "a fricasie, or a ragoust," produces a tone of grotesque calm: the speaker's composure is what horrifies.
    topic_code: "7.A"
  - front: Swift's arithmetic → what the numbers do to tone
    back: |
      The proposer computes everything: 1.5 million souls, 120,000 children a year, 12 pounds at birth and 28 at a year, ten shillings a carcass. The precision sounds rational and detached, and its coldness becomes the satire's evidence against economic thinking without mercy.
    topic_code: "7.A"
  - front: "Swift's landlords who \"have already devoured most of the parents\" → the pun"
    back: |
      Devoured is literal in the plan and figurative about rents and evictions. The metaphor drops the mask for an instant and names the real predators: the landlords.
    topic_code: "7.A"
  - front: Swift's flayed-skin gloves → why include such a detail
    back: |
      The suggestion that the skin "will make admirable gloves for ladies, and summer boots for fine gentlemen" pushes the plan into luxury goods, implicating fashionable society in the consumption of the poor.
    topic_code: "7.A"
  - front: Swift's "other expedients" passage → the turn
    back: |
      Near the end the proposer lists remedies no one should mention: taxing absentees, buying Irish goods, curing pride and vanity, teaching landlords mercy. These are Swift's real proposals, and the list changes the tone from deadpan to barely restrained indignation.
    topic_code: "7.A"
  - front: "Swift's \"let no man talk to me of other expedients\" → syntax"
    back: |
      A long series of phrases each beginning with "Of" (Of taxing... Of using... Of learning...) piles up sensible remedies under the pretence of dismissing them. The anaphora turns a dismissal into an indictment.
    topic_code: "7.A"
  - front: Swift's closing claim to have no children → effect
    back: |
      The proposer says he cannot profit, since his youngest child is nine and his wife past child-bearing. The final note of self-satisfied innocence keeps the mask on to the last line, leaving the reader to supply the outrage.
    topic_code: "7.A"
  - front: "Swift's \"a very knowing American\" → whose authority?"
    back: |
      The proposer's source for children as food is a vague acquaintance from London. The flimsy authority, reported with complete confidence, mocks the way projectors cited hearsay as evidence.
    topic_code: "7.A"
  - front: Understatement (litotes) → example in Swift
    back: |
      Saying less than the situation warrants. The proposer admits the plan might be thought "a little bordering upon cruelty," as if eating children were a matter of mild taste.
    topic_code: "7.A"
  - front: Tone shift → how to spot one in an argument
    back: |
      Look for a change in diction (plain to charged), in sentence length or pattern, in pronoun (he to you), or in what is praised. Explain both tones and why the writer moves from one to the other at that point.
    topic_code: "7.A"
  - front: Swift's audience → who was meant to feel what
    back: |
      Primarily the Anglo-Irish governing class and English policymakers, who were to see their own cold calculations mirrored; also the Irish public, whose passivity the list of expedients rebukes.
    topic_code: "1.B"
  - front: Irony and audience → the risk
    back: |
      Irony depends on readers recognising the gap between what is said and what is meant. A writer must leave signals (absurd extremes, moments where the mask slips) or some readers will take the proposal literally.
    topic_code: "2.B"
  - front: "Deadpan → Swift's proposer as the model"
    back: |
      Delivering absurd or shocking content in a flat, matter-of-fact voice. Swift's proposer is deadpan; the reader, not the writer, supplies the horror.
    topic_code: "7.A"
  - front: AP Q2 tone analysis → the sentence pattern
    back: |
      Choice + tone + function: *By describing infants in the language of recipes, Swift's proposer adopts a calm, practical tone that exposes how cruelly the ruling class already calculates the value of the poor.*
    topic_code: "7.A"

quiz:
  description: |
    22 questions · about 35 minutes · an eight-question set on the heart of A Modest Proposal, a six-question revision
    set on a student's satirical column, and eight more items on tone, irony and the essay as a whole. Multiple
    choice, select-all and true/false items are graded at once; the fill-in-the-blank items are matched
    automatically; the short answers and the paragraph are graded by your teacher against the model answers and
    scoring notes.
  questions:
    # ---- Passage set: the proposal itself
    - slug: u08-w27-q01
      type: multiple_choice
      topic_code: "7.A"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 1
      stimulus: &swift_plan |
        *The following passage is from Jonathan Swift's A Modest Proposal (1729). The speaker, a self-styled expert on public schemes, has just described the number of poor children born in Ireland each year and the impossibility of employing them. His contempt for the Irish poor, including his word “savages,” is the attitude Swift is satirising, not Swift's own.*

        I shall now therefore humbly propose my own thoughts, which I hope will not be liable to the least objection.

        I have been assured by a very knowing American of my acquaintance in London, that a young healthy child well nursed, is, at a year old, a most delicious nourishing and wholesome food, whether stewed, roasted, baked, or boiled; and I make no doubt that it will equally serve in a fricasie, or a ragoust.

        I do therefore humbly offer it to publick consideration, that of the hundred and twenty thousand children, already computed, twenty thousand may be reserved for breed, whereof only one fourth part to be males; which is more than we allow to sheep, black cattle, or swine, and my reason is, that these children are seldom the fruits of marriage, a circumstance not much regarded by our savages, therefore, one male will be sufficient to serve four females. That the remaining hundred thousand may, at a year old, be offered in sale to the persons of quality and fortune, through the kingdom, always advising the mother to let them suck plentifully in the last month, so as to render them plump, and fat for a good table. A child will make two dishes at an entertainment for friends, and when the family dines alone, the fore or hind quarter will make a reasonable dish, and seasoned with a little pepper or salt, will be very good boiled on the fourth day, especially in winter.

        I have reckoned upon a medium, that a child just born will weigh 12 pounds, and in a solar year, if tolerably nursed, encreaseth to 28 pounds.

        I grant this food will be somewhat dear, and therefore very proper for landlords, who, as they have already devoured most of the parents, seem to have the best title to the children.
      prompt: |
        The speaker's description of his plan as something he will "humbly propose" and hopes "will not be liable to the least objection" creates a tone that is best described as
      options:
        - |
          openly furious at the reader's indifference
        - |
          mock-modest, a polite deference that clashes ironically with the monstrous plan it introduces
        - |
          hesitant and uncertain, as if the speaker doubts his own idea
        - |
          playful and childlike, as if the proposal were a game
      option_explanations:
        - |
          The surface of the passage is calm and courteous; any fury belongs to Swift behind the persona and is never stated by the speaker here.
        - |
          Correct. The speaker's humility is a costume. Courteous phrasing introduces a plan to sell and eat children, and the gap between manner and matter is the irony that drives the essay.
        - |
          He hopes for no objection at all and later says he makes "no doubt" about the dishes; the persona is serenely confident, not hesitant.
        - |
          The speaker is earnest and businesslike. Nothing in the diction suggests play; the horror comes from his seriousness.
      answer: 1
      explanation: |
        Name the tone precisely, then explain the gap it creates. In satire, a polite or reasonable tone applied to an outrageous subject is a signal of irony.

    - slug: u08-w27-q02
      type: multiple_choice
      topic_code: "7.A"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 1
      stimulus: *swift_plan
      prompt: |
        The comparison in the third paragraph between the reserved children and "sheep, black cattle, or swine" primarily serves to
      options:
        - |
          show that the speaker is an experienced farmer whose advice can be trusted
        - |
          suggest that Ireland's livestock trade is more important than its people
        - |
          introduce a lighter, comic note to relieve the reader
        - |
          expose, through the speaker's casual equation of poor children with livestock, how the ruling class already treats the Irish poor as animals to be managed for profit
      option_explanations:
        - |
          The comparison is not offered as a credential, and the speaker's sources are hearsay ("a very knowing American"). The point is the attitude the comparison reveals.
        - |
          The comparison concerns how the poor are regarded, not the relative value of the livestock trade; Swift's target is the treatment of people.
        - |
          Nothing about the comparison is light. Breeding ratios for human children intensify the horror rather than relieving it.
        - |
          Correct. The speaker takes the comparison for granted, using breeding language (breed, males, serve four females). Swift lets the persona say aloud what landlords and policymakers implied by their conduct.
      answer: 3
      explanation: |
        A comparison in satire often works by saying aloud the attitude the target holds silently. Ask whose view of the poor the comparison reveals.

    - slug: u08-w27-q03
      type: multiple_choice
      topic_code: "7.A"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 1
      stimulus: *swift_plan
      prompt: |
        The phrases "stewed, roasted, baked, or boiled" and "seasoned with a little pepper or salt" contribute to the passage's tone chiefly by
      options:
        - |
          showing that the speaker is a trained cook who takes pride in his recipes
        - |
          making the proposal seem more humane, since the children would be well prepared
        - |
          applying the cheerful, practical diction of a cookbook to children, so that the speaker's composure becomes the source of horror
        - |
          signalling to the reader that the essay is a parody of popular cookbooks
      option_explanations:
        - |
          The speaker's interest is economic and he cites others' testimony; the culinary language characterises his voice, not his profession.
        - |
          The calm culinary detail makes the proposal more horrifying, not more humane; that is the effect Swift wants.
        - |
          Correct. The domestic register of recipes is utterly at odds with the subject. The reader recoils precisely because the speaker does not; his calm is the satire's weapon.
        - |
          Cookbooks are not the target. The culinary diction serves the satire of economic schemes that treat the poor as commodities.
      answer: 2
      explanation: |
        When the register (the kind of language) clashes with the subject, ask what the clash makes the reader feel and why the writer wants that feeling.

    - slug: u08-w27-q04
      type: multiple_choice
      topic_code: "7.A"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 1
      stimulus: *swift_plan
      prompt: |
        In the final sentence, the word "devoured" is most significant because it
      options:
        - |
          works both literally, within the plan, and figuratively, as a charge that landlords have already consumed the poor through rents and evictions, briefly revealing the satire's real target
        - |
          shows that the speaker is ashamed of his plan and wishes to withdraw it
        - |
          suggests that landlords are the only people who would refuse to buy the children
        - |
          introduces a new economic argument about the price of food
      option_explanations:
        - |
          Correct. The metaphor turns the landlords into the cannibals they already are in effect. For a moment the mask slips and Swift's accusation shows through the persona's cheerful salesmanship.
        - |
          The speaker remains serenely confident; he offers the sentence as a selling point, not a confession.
        - |
          The sentence says the opposite: landlords are the ideal customers, since they "seem to have the best title to the children."
        - |
          The price is mentioned (somewhat dear), but the force of the sentence lies in the double meaning, not in any new economic reasoning.
      answer: 0
      explanation: |
        Watch for words that work on two levels in an ironic text. They are often where the writer's real argument surfaces.

    - slug: u08-w27-q05
      type: multi_select
      topic_code: "7.A"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 2
      partial_credit: true
      stimulus: *swift_plan
      prompt: |
        Which TWO features of the passage most contribute to the speaker's detached, businesslike tone? Select two.
      options:
        - |
          Exact figures, such as a child weighing "12 pounds" at birth and "28 pounds" at a year
        - |
          Deferential phrasing for public discussion, such as "I do therefore humbly offer it to publick consideration"
        - |
          Exclamations of grief at the suffering of the poor
        - |
          Direct appeals to the reader's conscience, addressed to "you"
      option_explanations:
        - |
          Correct. Precise measurement makes the plan sound like a careful study and treats children as quantities, which is the source of the chill.
        - |
          Correct. The language of a pamphlet submitted to the public frames the scheme as ordinary policy, polite and procedural.
        - |
          The passage contains no exclamations of grief. The speaker's emotional flatness is exactly what makes the tone detached.
        - |
          The speaker never addresses the reader as you in this passage; he speaks in the first person about his own reckoning.
      answer: [0, 1]
      explanation: |
        Detachment is made from numbers and procedure. Notice what is absent too: no feeling, no direct appeal.

    - slug: u08-w27-q06
      type: multiple_choice
      topic_code: "1.B"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 1
      stimulus: *swift_plan
      prompt: |
        The passage's irony depends on Swift's readers in 1729 being familiar with
      options:
        - |
          the recipes of French cookery, which the speaker is mocking
        - |
          the confident economic pamphlets of the period, whose arithmetic and tone of public benefit the speaker imitates
        - |
          the private family life of Swift himself
        - |
          the history of livestock farming in America
      option_explanations:
        - |
          The French dish names add to the culinary register, but French cookery is not what readers needed to know to see the joke.
        - |
          Correct. Swift's educated readers knew the genre of the scheme for public improvement, full of computed populations and confident benefits. Recognising the form, they could see it applied to an unthinkable subject and turned against itself.
        - |
          The speaker is a persona; readers did not need biographical knowledge of Swift to read the irony.
        - |
          The "knowing American" is a hearsay source, not a reference to American farming; nothing depends on that knowledge.
      answer: 1
      explanation: |
        Spiral review of 1.B: irony is a bet on what the audience knows. Satire mimics a form the audience recognises and turns it against its users.

    - slug: u08-w27-q07
      type: true_false
      topic_code: "7.A"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 1
      stimulus: *swift_plan
      prompt: |
        True or false: in this passage the speaker's tone is openly angry and indignant.
      answer: false
      explanation: |
        False. The speaker is calm, courteous and pleased with himself. The indignation belongs to Swift and is created in the reader by the gap between the speaker's composure and his plan; only near the end of the essay, in the list of real remedies, does it come close to the surface.

    - slug: u08-w27-q08
      type: multiple_choice
      topic_code: "3.B"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 1
      stimulus: *swift_plan
      prompt: |
        Which best describes the overarching claim that Swift implies through the passage, as distinct from the plan the speaker states?
      options:
        - |
          Ireland should export its surplus food to England.
        - |
          Children born outside marriage should be cared for by the parish.
        - |
          The powerful already treat Ireland's poor as commodities to be consumed, and a policy built on profit alone leads logically to monstrous conclusions.
        - |
          The poor should be encouraged to emigrate to America.
      option_explanations:
        - |
          The passage says nothing about exporting food to England; elsewhere the speaker notes that the commodity "will not bear exportation."
        - |
          The parish is mentioned elsewhere only as a burden the plan would relieve; care for illegitimate children is not Swift's argument.
        - |
          Correct. The implied thesis attacks both the landlords who "devoured" the parents and the coldly economic reasoning the persona represents.
        - |
          Emigration is not proposed. The "knowing American" is a source of the speaker's hearsay, not a destination.
      answer: 2
      explanation: |
        Spiral review of 3.B: in an ironic argument the overarching thesis is implied. State it by asking what the irony attacks.

    # ---- Revision set: a student's satirical column
    - slug: u08-w27-q09
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: &w27_draft |
        *The following is a draft of a satirical column a student is writing for the school newspaper. Imitating Swift, the writer wants to criticise the four-minute passing period between the school's two buildings by proposing an absurd solution in a calm, reasonable voice.*

        (1) Every afternoon, observers in our hallways witness a remarkable spectacle: four hundred students attempting to travel a quarter of a mile in the four minutes the schedule allows. (2) Having studied the problem for nearly a semester, I humbly offer a solution that will cost the district almost nothing. (3) Students should get roller skates. (4) A skating student covers the distance in under two minutes, leaving ample time to visit a locker, a water fountain or, in exceptional cases, a restroom. (5) The administration, which has already shown that it values punctuality above all other human needs, will surely welcome the plan. (6) Honestly, the whole schedule is ridiculous and whoever made it should be fired. (7) Some will object that skating indoors is dangerous. (8) To this I reply that collisions would be rare, since the hallways are already so crowded that no one can move fast enough to be injured. (9) I can think of no other objection, unless it be that the passing period might simply be lengthened, a proposal so extravagant that I dare not make it.
      prompt: |
        Sentence 6 breaks the column's calm, ironic tone. Which revision of sentence 6 best maintains the tone the writer wants?
      options:
        - |
          Honestly, the schedule makes me so angry I can barely think straight.
        - |
          The schedule is bad, and it should be changed as soon as possible.
        - |
          LOL, whoever made this schedule has clearly never walked between buildings.
        - |
          Whoever designed the schedule clearly understood that a student who arrives breathless is a student too tired to misbehave.
      option_explanations:
        - |
          The revision states the writer's anger even more openly, which destroys the deadpan voice the satire depends on.
        - |
          A plain, sincere complaint drops the persona entirely; it says what the writer means instead of letting the irony imply it.
        - |
          Internet slang and open mockery shift the register and abandon the composed, reasonable speaker the writer is imitating.
        - |
          Correct. The sentence keeps the speaker's serene approval while implying the real criticism: the schedule wears students out. Praise that is obviously misplaced is the column's method.
      answer: 3
      explanation: |
        Spiral review of 8.A: strategic word choice keeps a tone consistent. In an ironic piece, a sincere outburst is a tonal break, not emphasis.

    - slug: u08-w27-q10
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: *w27_draft
      prompt: |
        The writer wants sentence 3 to sound more like the formal policy proposal the column is mimicking. Which version best accomplishes this goal?
      options:
        - |
          I therefore propose that each student be furnished with a single pair of regulation roller skates, to be worn between the first bell and the last.
        - |
          Roller skates would be awesome for everybody.
        - |
          Maybe students could try roller skates, if that's okay with everyone.
        - |
          Roller skates. Problem solved.
      option_explanations:
        - |
          Correct. The formal verb, the passive construction and the bureaucratic detail (regulation skates, set hours) imitate the language of an official scheme, which sharpens the irony.
        - |
          Casual, enthusiastic diction undercuts the mock-serious register; the satire needs a speaker who sounds like a committee report.
        - |
          The hedging makes the speaker timid and uncertain, the opposite of the confident projector the column imitates.
        - |
          Fragments give the sentence a flippant, joking tone that signals the joke too loudly and breaks the deadpan voice.
      answer: 0
      explanation: |
        Mock-formal diction for a trivial or absurd subject is a classic satiric tool. Match the register of the genre you are imitating.

    - slug: u08-w27-q11
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *w27_draft
      prompt: |
        The writer worries that some readers will take the proposal literally. Which sentence, added at the end of the column, would best make the real target clear to this audience without abandoning the ironic voice?
      options:
        - |
          In conclusion, I am joking, and the passing period should be longer.
        - |
          Ten minutes, after all, would be an unheard-of indulgence for people who are merely expected to learn something when they arrive.
        - |
          Skating is also good exercise, which doctors recommend.
        - |
          I hope the school board reads this column carefully.
      option_explanations:
        - |
          Explaining the joke ends the satire with a flat statement; it makes the point at the cost of the voice the writer wants to keep.
        - |
          Correct. The speaker still sounds reasonable and approving, but the absurdity of calling ten minutes an indulgence points every reader straight at the real complaint: four minutes is too short.
        - |
          A further benefit of skating extends the joke without clarifying what the column is really about.
        - |
          The sentence names an audience but gives no signal of the real argument, so literal readers would remain confused.
      answer: 1
      explanation: |
        Spiral review of 2.B: irony is a bet on the audience. Give readers a signal they cannot miss while keeping the persona intact.

    - slug: u08-w27-q12
      type: multi_select
      topic_code: "7.A"
      source: written for this course
      points: 2
      partial_credit: true
      stimulus: *w27_draft
      prompt: |
        Which TWO phrases in the draft contribute most to its mock-reasonable tone? Select two.
      options:
        - |
          Having studied the problem for nearly a semester (sentence 2)
        - |
          in exceptional cases, a restroom (sentence 4)
        - |
          Honestly, the whole schedule is ridiculous (sentence 6)
        - |
          Some will object (sentence 7)
      option_explanations:
        - |
          Correct. The claim of long study imitates the expert's credentials, lending false seriousness to an absurd plan.
        - |
          Correct. The understatement treats a basic need as a rare luxury, delivered in a calm, matter-of-fact voice that exposes how little time students have.
        - |
