      source: general knowledge
      points: 1
      prompt: |
        Saying one thing while meaning something quite different, as when Swift's speaker calls his proposal modest, is called verbal ____.
      answer: ["irony", "verbal irony"]
      explanation: |
        Verbal irony is the gap between statement and meaning. Satire uses it, along with exaggeration and understatement, to criticise a real target.

