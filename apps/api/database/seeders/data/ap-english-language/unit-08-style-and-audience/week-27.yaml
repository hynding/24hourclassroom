    - slug: u08-w27-q22
      type: long_answer
      topic_code: "7.A"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 5
      prompt: |
        Write one well-developed paragraph (about 175-225 words) that makes a claim about how Swift's word choice or comparisons create the tone of A Modest Proposal and how that tone advances his argument. Support your claim with at least two short quotations and explain how each produces the tone.
      answer: |
        Claim: Swift gives his proposer the composed, practical diction of a household manual, and the calm of that voice makes the reader feel the horror the speaker cannot. Evidence 1: the child is called "a most delicious nourishing and wholesome food, whether stewed, roasted, baked, or boiled." Commentary: the cheerful list of cooking methods treats an infant as a menu item; the domestic register is so wrong for the subject that readers recoil. Evidence 2: twenty thousand children are to be "reserved for breed," which is "more than we allow to sheep, black cattle, or swine." Commentary: the speaker equates the poor with livestock as a matter of course, which exposes an attitude the landlords already held. Commentary on function: by refusing to sound outraged, the speaker forces outrage onto the reader, who is then ready to see that Ireland's rulers had been treating its people as commodities all along.
      explanation: |
        5 points. Claim (1): names a precise tone and links it to Swift's argument, not just to the plan. Evidence (1): at least two accurate, short quotations from the essay. Commentary (3): 3 points if each quotation is analysed for how specific words or comparisons produce the tone and the paragraph explains how the tone serves the satire's purpose; 2 points if the analysis is sound but explains only one quotation well or does not reach purpose; 1 point if commentary mostly paraphrases; 0 if the paragraph reads the proposal literally.
