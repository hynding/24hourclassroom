    # ---- Tone, irony and the whole essay
    - slug: u08-w27-q15
      type: multiple_choice
      topic_code: "7.A"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 1
      prompt: |
        A Modest Proposal ends with the speaker's assurance that he cannot profit from his plan: "I have no children, by which I can propose to get a single penny; the youngest being nine years old, and my wife past child-bearing." The effect of this final sentence is to
      options:
        - |
          reveal that the speaker has finally recognised the cruelty of his plan
        - |
          keep the persona's self-satisfied innocence intact to the last line, so that the reader, not the speaker, must supply the moral outrage
        - |
          introduce a new argument about the speaker's family
        - |
          prove that the plan is economically sound
      option_explanations:
        - |
          The speaker shows no recognition at all; he presents his childlessness as proof of disinterested public spirit.
        - |
          Correct. The absurd claim of disinterest (he has no children young enough to sell) keeps the deadpan unbroken. Swift never steps out to condemn the plan; the reader must.
        - |
          The family detail is a punchline about his motives, not a new line of argument.
        - |
          The sentence concerns the speaker's motives, not the plan's economics, and its comedy undercuts any claim to soundness.
      answer: 1
      explanation: |
        An ironic piece that never breaks character trusts the reader. Explain what the unbroken mask asks the audience to do.

    - slug: u08-w27-q16
      type: true_false
      topic_code: "7.A"
      source: general knowledge
      points: 1
      prompt: |
        True or false: in a satire, the position stated by the persona is always the author's actual position.
      answer: false
      explanation: |
        False. A satirical persona often states the opposite of what the author believes, or exaggerates the target's views to absurdity. Swift does not want children eaten; his persona's calm advocacy exposes the cruelty of those who already treat the poor as commodities.

