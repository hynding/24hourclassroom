    - slug: u08-w27-q19
      type: short_answer
      topic_code: "7.A"
      source: 'Jonathan Swift, A Modest Proposal (1729)'
      points: 2
      prompt: |
        Near the end of the essay the speaker says, "let no man talk to me of other expedients," and then lists them: taxing absentee landlords, buying only Irish goods, curing pride and vanity, teaching landlords mercy. In two or three sentences, explain how this passage changes the tone of the essay and why the change matters to Swift's argument.
      answer: |
        The list is a string of sensible reforms, each beginning with the same word, that the speaker pretends to dismiss. The calm, deadpan tone becomes barely restrained indignation, because the reader recognises these as Swift's real proposals and the repeated structure piles them up like charges. The shift reveals that the cannibal scheme was a way of shaming readers who had ignored obvious remedies.
      explanation: |
        1 point: identifies the shift in tone (deadpan or detached to indignant, bitter or earnest) and points to the choice that creates it (the list, the anaphora, the sensible content). 1 point: explains why the shift matters (the list states Swift's real argument; it rebukes readers and rulers who ignored practical reform). A response that only summarises the list earns at most 1.

    - slug: u08-w27-q20
      type: short_answer
      topic_code: "8.A"
      source: written for this course
      points: 2
      prompt: |
        Write one or two sentences in a calm, deadpan ironic tone that criticise a real problem at a school (for example, a broken water fountain, an overcrowded parking lot or a homework load). Then, in one sentence, identify the word choice or syntax that creates the tone.
      answer: |
        Sample: *The administration's decision to leave the second-floor fountain broken for a third year shows admirable faith in the student body's ability to adapt, and several sophomores have already learned to go without water entirely.* The tone comes from approving, official-sounding diction (admirable faith, ability to adapt) applied to a plain failure, with the understatement of the last clause.
      explanation: |
        1 point: the sentence sustains a calm, ironic tone (praise or approval that clearly implies criticism; no open outburst). 1 point: the explanation names a specific choice of diction, comparison or syntax and links it to the tone. A sentence that states the complaint sincerely earns at most 1.

