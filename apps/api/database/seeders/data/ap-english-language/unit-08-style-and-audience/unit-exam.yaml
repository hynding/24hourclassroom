unit: 8
description: |
  45 questions · about 90 minutes · every skill of Unit 8 (audience 1.B and 2.B, tone through word choice,
  comparisons and syntax 7.A and 8.A, clauses and clear sentences 7.B and 8.B). Five groups: a new passage from
  Roosevelt's First Inaugural Address; a new passage from Swift's A Modest Proposal; a passage you have not
  studied, from G. K. Chesterton's newspaper essay "On Running After One's Hat" (1908), followed by an AP-style
  rhetorical analysis essay on it; a revision set on a student's speech to a city council; and eleven questions
  across the unit on Chesterton's Heretics, Kennedy's Inaugural Address and the unit's terms, including two short
  written responses. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items
  are matched automatically; the short responses and the essay are graded by your teacher against the model
  answers and the 6-point AP rubric.
questions:
  # ---- Set A: Roosevelt, action and the army of the people
  - slug: u08-exam-q01
    type: multiple_choice
    topic_code: "1.B"
    source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
    points: 1
    stimulus: &ex_fdr |
      *The following passage is from Franklin D. Roosevelt's First Inaugural Address, delivered on March 4, 1933, during the Great Depression.*

      Restoration calls, however, not for changes in ethics alone. This Nation asks for action, and action now.

      Our greatest primary task is to put people to work. This is no unsolvable problem if we face it wisely and courageously. It can be accomplished in part by direct recruiting by the Government itself, treating the task as we would treat the emergency of a war, but at the same time, through this employment, accomplishing greatly needed projects to stimulate and reorganize the use of our natural resources.

      [...] The task can be helped by definite efforts to raise the values of agricultural products and with this the power to purchase the output of our cities. It can be helped by preventing realistically the tragedy of the growing loss through foreclosure of our small homes and our farms. It can be helped by insistence that the Federal, State, and local governments act forthwith on the demand that their cost be drastically reduced. It can be helped by the unifying of relief activities which today are often scattered, uneconomical, and unequal. It can be helped by national planning for and supervision of all forms of transportation and of communications and other utilities which have a definitely public character. There are many ways in which it can be helped, but it can never be helped merely by talking about it. We must act and act quickly.

      [...]

      If I read the temper of our people correctly, we now realize as we have never realized before our interdependence on each other; that we can not merely take but we must give as well; that if we are to go forward, we must move as a trained and loyal army willing to sacrifice for the good of a common discipline, because without such discipline no progress is made, no leadership becomes effective. We are, I know, ready and willing to submit our lives and property to such discipline, because it makes possible a leadership which aims at a larger good. This I propose to offer, pledging that the larger purposes will bind upon us all as a sacred obligation with a unity of duty hitherto evoked only in time of armed strife.

      With this pledge taken, I assume unhesitatingly the leadership of this great army of our people dedicated to a disciplined attack upon our common problems.
    prompt: |
      In the sentence "This Nation asks for action, and action now," Roosevelt chiefly
    options:
      - |
        criticises the American people for demanding too much of their government
      - |
        announces that he will postpone any action until Congress meets
      - |
        speaks as the voice of the nation's impatience, presenting the demand for immediate action as the audience's own and his program as the answer to it
      - |
        concedes that his administration has no plan of its own
    option_explanations:
      - |
        Nothing in the sentence is critical; Roosevelt endorses the demand and makes it the basis of his program.
      - |
        The repeated action now insists on immediacy; postponement is the opposite of what the sentence says.
      - |
        Correct. By attributing the demand to the Nation and repeating action, he voices the audience's impatience and turns it into a mandate, preparing the specific measures that follow.
      - |
        The next paragraphs set out specific measures; the sentence introduces his plan rather than admitting he lacks one.
    answer: 2
    explanation: |
      Skill 1.B: when a speaker attributes a demand to the audience, ask what need it reveals and how the speaker uses it.

  - slug: u08-exam-q02
    type: multiple_choice
    topic_code: "7.B"
    source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
    points: 1
    stimulus: *ex_fdr
    prompt: |
      In the sentence "This is no unsolvable problem if we face it wisely and courageously," the placement of the dependent clause at the end of the sentence serves to
    options:
      - |
        make the solution conditional on the conduct of speaker and audience together, ending the sentence on the qualities he asks of them
      - |
        suggest that the problem cannot be solved at all
      - |
        shift responsibility for the problem to foreign nations
      - |
        introduce a list of specific measures
    option_explanations:
      - |
        Correct. The independent clause offers hope (no unsolvable problem), and the if clause, placed last for emphasis, names the condition: wisdom and courage, which the we shares between leader and listeners.
      - |
        The main clause asserts the opposite; the condition qualifies the hope without cancelling it.
      - |
        The we of the condition refers to Americans; foreign nations are not mentioned.
      - |
        The specific measures come later; this clause names attitudes, not policies.
    answer: 0
    explanation: |
      End focus: a dependent clause placed last receives emphasis. Ask what the writer wants the audience to hear at the end.

  - slug: u08-exam-q03
    type: multiple_choice
    topic_code: "7.A"
    source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
    points: 1
    stimulus: *ex_fdr
    prompt: |
      The repetition of "It can be helped by" at the start of five consecutive sentences contributes to the tone of the third paragraph chiefly by
    options:
      - |
        creating a tone of weary resignation at the size of the task
      - |
        suggesting that none of the measures is likely to succeed
      - |
        making the paragraph sound casual and improvised
      - |
        building a rhythm of practical determination, in which each repetition adds a concrete remedy and the problem seems ever more manageable
    option_explanations:
      - |
        Each sentence names a remedy, so the accumulation conveys energy and possibility, not resignation.
      - |
        The repeated can asserts possibility; the series expresses confidence in the measures.
      - |
        The repetition is deliberate and formal; it gives the paragraph the structure of a planned list.
      - |
        Correct. The anaphora organises a set of policies into a drumbeat of possibility, and the concrete objects (farms, homes, relief, transportation) make the tone practical and resolute.
    answer: 3
    explanation: |
      Anaphora can make a list sound determined. Name the tone and the concrete content that supports it.

  - slug: u08-exam-q04
    type: multiple_choice
    topic_code: "7.B"
    source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
    points: 1
    stimulus: *ex_fdr
    prompt: |
      The sentence "There are many ways in which it can be helped, but it can never be helped merely by talking about it" uses coordination to
    options:
      - |
        give equal weight to two lists of policies
      - |
        turn from the many possible remedies to a pointed rejection of mere talk, placing the rebuke at the end where it receives the most emphasis
      - |
        concede that talking about the problem is the most effective remedy
      - |
        introduce a cause-and-effect relationship between the policies and the Depression
    option_explanations:
      - |
        The sentence summarises the preceding list and then contrasts it with talk; it does not present two lists.
      - |
        Correct. The coordinating conjunction but signals contrast, and the second clause, with its emphatic never, ends on the rebuke of those who only talk, leading to the short command We must act and act quickly.
      - |
        The sentence rejects talk as a remedy; never and merely make the rejection plain.
      - |
        But marks contrast, not cause; the sentence contrasts remedies with talk rather than explaining the Depression.
    answer: 1
    explanation: |
      Coordination with but shows contrast. The second clause usually carries the writer's point.

  - slug: u08-exam-q05
    type: multiple_choice
    topic_code: "1.B"
    source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
    points: 1
    stimulus: *ex_fdr
    prompt: |
      The opening clause of the fifth paragraph, "If I read the temper of our people correctly," most likely serves to
    options:
      - |
        reveal that Roosevelt has no idea what his audience thinks
      - |
        introduce statistics from a recent poll of public opinion
      - |
        present the demanding claims that follow (interdependence, sacrifice, discipline) as the people's own realisation rather than a burden imposed by the speaker
      - |
        warn the audience that he will ignore their wishes
    option_explanations:
      - |
        The clause is a gesture of deference, not genuine ignorance; he immediately states what the people realise with confidence.
      - |
        No statistics follow; the temper of the people is read, not measured.
      - |
        Correct. Before asking listeners to accept discipline and sacrifice, Roosevelt credits the idea to them. The courteous condition makes a hard request sound like shared understanding.
      - |
        The clause expresses respect for the audience's wishes; the rest of the paragraph aligns his leadership with them.
    answer: 2
    explanation: |
      A deferential condition can soften a demanding claim. Ask what the speaker wants the audience to feel about the request that follows.

  - slug: u08-exam-q06
    type: multi_select
    topic_code: "1.B"
    source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
    points: 2
    partial_credit: true
    stimulus: *ex_fdr
    prompt: |
      Which TWO phrases most clearly draw on the audience's memory of national unity in wartime? Select two.
    options:
      - |
        "a trained and loyal army willing to sacrifice for the good of a common discipline"
      - |
        "a unity of duty hitherto evoked only in time of armed strife"
      - |
        "the unifying of relief activities which today are often scattered"
      - |
        "the power to purchase the output of our cities"
    option_explanations:
      - |
        Correct. The army image asks listeners to see themselves as soldiers in a common cause, recalling the mobilization of 1917-1918.
      - |
        Correct. Roosevelt names the precedent directly: the unity he asks for has been known before only in war.
      - |
        Unifying here means administrative consolidation of relief programs, not wartime unity.
      - |
        The phrase concerns farm income and markets, an economic point with no wartime association.
    answer: [0, 1]
    explanation: |
      Comparisons work by borrowing an audience's feelings about a shared experience. Roosevelt's listeners had lived through the World War.

  - slug: u08-exam-q07
    type: true_false
    topic_code: "7.A"
    source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
    points: 1
    stimulus: *ex_fdr
    prompt: |
      True or false: the tone of the passage is hesitant and apologetic.
    answer: false
    explanation: |
      False. The passage is resolute: action now, We must act and act quickly, and I assume unhesitatingly the leadership. Even the deferential If I read the temper of our people correctly introduces confident claims about what the people realise and are ready to do.

  - slug: u08-exam-q08
    type: multiple_choice
    topic_code: "7.A"
    source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work'
    points: 1
    stimulus: *ex_fdr
    prompt: |
      The final sentence's description of "this great army of our people dedicated to a disciplined attack upon our common problems" contributes to the passage chiefly by
    options:
      - |
        extending the military diction of the previous paragraph, so that economic recovery is cast as a campaign requiring courage, unity and obedience to leadership
      - |
        announcing that Roosevelt intends to send the army into the cities
      - |
        shifting the tone from serious to playful
      - |
        suggesting that the American people are the problem to be attacked
    option_explanations:
      - |
        Correct. Army, disciplined and attack complete the extended comparison: listeners become soldiers, problems an enemy, and the president their commander, which justifies the strong leadership he assumes.
      - |
        The army is figurative: the people themselves form it. No literal military deployment is proposed.
      - |
        The diction is solemn and martial, not playful.
      - |
        The attack is upon our common problems; the people are the army, not the target.
    answer: 0
    explanation: |
      An extended comparison carries attitudes from one domain (war) into another (economic recovery). Name the attitudes it transfers.

  # ---- Set B: Swift, the aged poor and the sixth advantage
  - slug: u08-exam-q09
    type: multiple_choice
    topic_code: "7.A"
    source: 'Jonathan Swift, A Modest Proposal (1729)'
    points: 1
    stimulus: &ex_swift |
      *The following passages are from Jonathan Swift's A Modest Proposal (1729). The speaker has proposed that the infants of the Irish poor be sold as food.*

      Some persons of a desponding spirit are in great concern about that vast number of poor people, who are aged, diseased, or maimed; and I have been desired to employ my thoughts what course may be taken, to ease the nation of so grievous an incumbrance. But I am not in the least pain upon that matter, because it is very well known, that they are every day dying, and rotting, by cold and famine, and filth, and vermin, as fast as can be reasonably expected. And as to the young labourers, they are now in almost as hopeful a condition. They cannot get work, and consequently pine away from want of nourishment, to a degree, that if at any time they are accidentally hired to common labour, they have not strength to perform it, and thus the country and themselves are happily delivered from the evils to come.

      [...]

      Sixthly, This would be a great inducement to marriage, which all wise nations have either encouraged by rewards, or enforced by laws and penalties. It would encrease the care and tenderness of mothers towards their children, when they were sure of a settlement for life to the poor babes, provided in some sort by the publick, to their annual profit instead of expence. We should soon see an honest emulation among the married women, which of them could bring the fattest child to the market. Men would become as fond of their wives, during the time of their pregnancy, as they are now of their mares in foal, their cows in calf, or sow when they are ready to farrow; nor offer to beat or kick them (as is too frequent a practice) for fear of a miscarriage.
    prompt: |
      The phrase "as fast as can be reasonably expected" contributes to the tone of the first paragraph by
    options:
      - |
        expressing the speaker's grief at the deaths of the aged poor
      - |
        suggesting that the speaker wants the government to slow the death rate
      - |
        showing the speaker's ignorance of conditions in Ireland
      - |
        applying the language of patient administrative calculation to mass death, so that the speaker's calm reveals a callousness Swift means the reader to recognise and condemn
    option_explanations:
      - |
        The speaker is "not in the least pain" about the aged poor; the phrase expresses satisfaction, not grief.
      - |
        The speaker is content with the pace of death; he proposes nothing to slow it.
      - |
        The speaker is well informed about the misery he describes; what he lacks is compassion, not knowledge.
      - |
        Correct. Reasonably expected is the phrase of a man checking progress against a schedule. Its bureaucratic calm, after the vivid list of cold, famine, filth and vermin, makes the speaker's indifference horrifying.
    answer: 3
    explanation: |
      Clashes of register (administrative calm, horrifying subject) create the satire's tone. Name both sides of the clash.

  - slug: u08-exam-q10
    type: multiple_choice
    topic_code: "7.A"
    source: 'Jonathan Swift, A Modest Proposal (1729)'
    points: 1
    stimulus: *ex_swift
    prompt: |
      In describing the young labourers as "in almost as hopeful a condition" and saying the country is "happily delivered from the evils to come," the speaker uses
    options:
      - |
        understatement, to suggest that conditions are slightly worse than they seem
      - |
        verbal irony, applying words of hope and deliverance to starvation and death, which exposes the speaker's view of the poor as a problem to be removed
      - |
        a factual description of improving employment
      - |
        hyperbole, to exaggerate how quickly the labourers are finding work
    option_explanations:
      - |
        Understatement says less than the truth; here the words say the opposite of what a humane reader feels, which is irony.
      - |
        Correct. Hopeful and happily delivered normally describe rescue. Applied to young men too starved to work, they expose a speaker who regards their deaths as relief.
      - |
        The passage says the labourers cannot get work; nothing describes improving employment.
      - |
        The labourers are not finding work; if hired they lack strength to perform it. The words are ironic, not exaggerated.
    answer: 1
    explanation: |
      Verbal irony means the opposite of what it says. Identify the words that carry the reversal and what they reveal.

  - slug: u08-exam-q11
    type: multiple_choice
    topic_code: "7.B"
    source: 'Jonathan Swift, A Modest Proposal (1729)'
    points: 1
    stimulus: *ex_swift
    prompt: |
      The last sentence of the first paragraph links its clauses with "and consequently," "that if," and "and thus." This structure contributes to the passage chiefly by
    options:
      - |
        imitating a chain of logical cause and effect, so that starvation is presented as a tidy, reasoned process ending in a welcome result
      - |
        presenting several unrelated ideas as equally important
      - |
        expressing the speaker's confusion about the causes of poverty
      - |
        separating the labourers' situation from that of the aged poor
    option_explanations:
      - |
        Correct. The connectives (consequently, thus) give the sentence the form of a syllogism: no work, so no food, so no strength, so deliverance. The tidy logic applied to suffering is the satire.
      - |
        The ideas are tightly related; each clause is presented as the consequence of the last.
      - |
        The speaker is perfectly clear and confident; the logic is coherent and monstrous.
      - |
        The sentence completes the comparison that the labourers are in almost as hopeful a condition as the aged; it links the two groups.
    answer: 0
    explanation: |
      Skill 7.B: the words that link clauses (consequently, thus, if) name relationships. In satire, sound logic can be the vehicle for an inhuman conclusion.

  - slug: u08-exam-q12
    type: multiple_choice
    topic_code: "7.A"
    source: 'Jonathan Swift, A Modest Proposal (1729)'
    points: 1
    stimulus: *ex_swift
    prompt: |
      The word "Sixthly" at the start of the second paragraph contributes to the essay's satire by
    options:
      - |
        signalling that the essay is nearly over
      - |
        indicating that the sixth advantage is the most important
      - |
        imitating the numbered list of benefits typical of earnest economic pamphlets, so that the horror is presented with orderly bureaucratic thoroughness
      - |
        introducing a new speaker with a different view
    option_explanations:
      - |
        The numbering marks a place in a list of advantages, not the end of the essay; more advantages and objections follow.
      - |
        Nothing marks the sixth advantage as most important; the point of the enumeration is its plodding completeness.
      - |
        Correct. Firstly, Secondly... Sixthly mimics the form of a projector's pamphlet. Orderly enumeration of the benefits of eating children turns the genre's thoroughness against itself.
      - |
        The same speaker continues in the same voice; the numbering marks the next item in his list.
    answer: 2
    explanation: |
      Form can be part of tone. Mimicking the structure of a genre is a satirist's way of mocking it.

  - slug: u08-exam-q13
    type: multiple_choice
    topic_code: "7.A"
    source: 'Jonathan Swift, A Modest Proposal (1729)'
    points: 1
    stimulus: *ex_swift
    prompt: |
      The comparison of husbands' fondness for their wives to their fondness for "their mares in foal, their cows in calf, or sow when they are ready to farrow" primarily serves to
    options:
      - |
        praise Irish farmers for their care of livestock
      - |
        suggest that the plan will improve agriculture
      - |
        show the speaker's affection for country life
      - |
        expose, by the speaker's casual assumption that men value breeding animals above their wives, the cruelty already present in poor households and in a society that measures people by profit
    option_explanations:
      - |
        The care of livestock is not praised for its own sake; it is the measure against which the treatment of wives is shown to fall short.
      - |
        The comparison concerns marriages, not farming; it adds no agricultural argument.
      - |
        The speaker shows no affection for anything but profit; the rural images serve the satire.
      - |
        Correct. The comparison implies that, under the plan, wives would finally be treated as well as pregnant animals, which exposes how badly they are treated now, and that only profit could make men kind.
    answer: 3
    explanation: |
      In satire a comparison often reveals an existing evil the speaker takes for granted. Ask what the comparison assumes.

  - slug: u08-exam-q14
    type: multiple_choice
    topic_code: "1.B"
    source: 'Jonathan Swift, A Modest Proposal (1729)'
    points: 1
    stimulus: *ex_swift
    prompt: |
      In the second paragraph the speaker claims his plan would encourage marriage and increase mothers' tenderness. This strategy most likely reflects Swift's understanding that his readers
    options:
      - |
        valued marriage and motherhood, so presenting the plan as serving those values would shock them into seeing that profit had replaced every other motive in the speaker's reasoning
      - |
        opposed marriage and would welcome a plan that discouraged it
      - |
        knew nothing about Irish family life
      - |
        were mainly mothers who would buy the children
    option_explanations:
      - |
        Correct. Swift turns the audience's own values against the speaker's logic: the only way the plan can promote marriage and tenderness is by making children profitable, which exposes a society in which money has displaced love.
      - |
        The appeal to marriage assumes readers value it; all wise nations encourage it, the speaker says.
      - |
        The satire depends on readers knowing that poor households suffered; the reference to beating wives assumes that knowledge.
      - |
        The proposal is addressed to the public and to persons of quality and fortune, not to mothers as buyers.
    answer: 0
    explanation: |
      Skill 1.B in satire: the writer appeals to values the audience holds so that the persona's twisted use of them becomes visible.

  - slug: u08-exam-q15
    type: true_false
    topic_code: "7.A"
    source: 'Jonathan Swift, A Modest Proposal (1729)'
    points: 1
    stimulus: *ex_swift
    prompt: |
      True or false: in the first paragraph the speaker expresses genuine pity for the aged and diseased poor.
    answer: false
    explanation: |
      False. He reports that others are in great concern but says he is not in the least pain upon that matter, since the aged poor are dying as fast as can be reasonably expected. His lack of pity is what Swift wants readers to recoil from.

  # ---- Set C: an unseen essay, Chesterton on running after one's hat
  - slug: u08-exam-q16
    type: multiple_choice
    topic_code: "7.A"
    source: 'G. K. Chesterton, "On Running After One''s Hat," All Things Considered (1908)'
    points: 1
    stimulus: &ex_hat |
      *The following passage is from "On Running After One's Hat," an essay G. K. Chesterton wrote for a London newspaper and collected in All Things Considered (1908). Parts of London, including Chesterton's own district of Battersea, had recently been flooded.*

      I feel an almost savage envy on hearing that London has been flooded in my absence, while I am in the mere country. My own Battersea has been, I understand, particularly favoured as a meeting of the waters. Battersea was already, as I need hardly say, the most beautiful of human localities. Now that it has the additional splendour of great sheets of water, there must be something quite incomparable in the landscape (or waterscape) of my own romantic town. Battersea must be a vision of Venice. The boat that brought the meat from the butcher's must have shot along those lanes of rippling silver with the strange smoothness of the gondola. The greengrocer who brought cabbages to the corner of the Latchmere Road must have leant upon the oar with the unearthly grace of the gondolier. There is nothing so perfectly poetical as an island; and when a district is flooded it becomes an archipelago.

      Some consider such romantic views of flood or fire slightly lacking in reality. But really this romantic view of such inconveniences is quite as practical as the other. The true optimist who sees in such things an opportunity for enjoyment is quite as logical and much more sensible than the ordinary "Indignant Ratepayer" who sees in them an opportunity for grumbling. [...]

      For instance, there is a current impression that it is unpleasant to have to run after one's hat. Why should it be unpleasant to the well-ordered and pious mind? Not merely because it is running, and running exhausts one. The same people run much faster in games and sports. [...] There is an idea that it is humiliating to run after one's hat; and when people say it is humiliating they mean that it is comic. It certainly is comic; but man is a very comic creature, and most of the things he does are comic--eating, for instance. And the most comic things of all are exactly the things that are most worth doing--such as making love. A man running after a hat is not half so ridiculous as a man running after a wife.

      Now a man could, if he felt rightly in the matter, run after his hat with the manliest ardour and the most sacred joy. He might regard himself as a jolly huntsman pursuing a wild animal, for certainly no animal could be wilder. In fact, I am inclined to believe that hat-hunting on windy days will be the sport of the upper classes in the future. [...] When last I saw an old gentleman running after his hat in Hyde Park, I told him that a heart so benevolent as his ought to be filled with peace and thanks at the thought of how much unaffected pleasure his every gesture and bodily attitude were at that moment giving to the crowd.

      [...] So I do not think that it is altogether fanciful or incredible to suppose that even the floods in London may be accepted and enjoyed poetically. Nothing beyond inconvenience seems really to have been caused by them; and inconvenience, as I have said, is only one aspect, and that the most unimaginative and accidental aspect of a really romantic situation. An adventure is only an inconvenience rightly considered. An inconvenience is only an adventure wrongly considered.
    prompt: |
      The opening sentence, in which Chesterton says he feels "an almost savage envy" at missing the flood, establishes a tone that is best described as
    options:
      - |
        whimsically perverse, treating a public misfortune as a privilege he regrets missing, which signals at once that the essay will overturn ordinary attitudes
      - |
        bitterly resentful of the people who stayed in London
      - |
        coldly indifferent to the suffering caused by the flood
      - |
        anxious about the safety of his home
    option_explanations:
      - |
        Correct. Envy is the last emotion a flood should provoke. The paradox, delivered with mock intensity (savage), announces the playful, contrary perspective the essay will argue for.
      - |
        The envy is comic and exaggerated; nothing in the essay expresses real resentment of Londoners.
      - |
        He later notes that nothing beyond inconvenience seems to have been caused; the tone is playful, not cold toward suffering.
      - |
        He imagines his flooded district as Venice; there is no anxiety in the passage.
    answer: 0
    explanation: |
      An unexpected emotion in an opening sentence is often a signal of the essay's perspective. Name the tone precisely and say what it prepares.

  - slug: u08-exam-q17
    type: multiple_choice
    topic_code: "7.A"
    source: 'G. K. Chesterton, "On Running After One''s Hat," All Things Considered (1908)'
    points: 1
    stimulus: *ex_hat
    prompt: |
      The comparisons of Battersea to Venice, the butcher's boat to a gondola and the greengrocer to a gondolier chiefly serve to
    options:
      - |
        give the reader accurate information about how goods were delivered during the flood
      - |
        mock the butcher and the greengrocer for their clumsiness
      - |
        elevate ordinary, inconvenient scenes into romantic ones in mock-heroic style, demonstrating the change of perspective the essay recommends
      - |
        argue that London should build canals like those of Venice
    option_explanations:
      - |
        Chesterton is in the country and imagines the scenes (must have shot, must have leant); the comparisons are fanciful, not reports.
      - |
        The tradesmen are given unearthly grace; the comparisons glorify them rather than mocking them.
      - |
        Correct. Grand comparisons applied to humble errands are mock-heroic, but they also model the argument: an inconvenience seen imaginatively becomes beautiful.
      - |
        No proposal about canals is made; the comparisons serve a point about perspective.
    answer: 2
    explanation: |
      Mock-heroic comparisons can be comic and argumentative at once. Ask what the comparison shows the reader how to do.

  - slug: u08-exam-q18
    type: multiple_choice
    topic_code: "1.B"
    source: 'G. K. Chesterton, "On Running After One''s Hat," All Things Considered (1908)'
    points: 1
    stimulus: *ex_hat
    prompt: |
