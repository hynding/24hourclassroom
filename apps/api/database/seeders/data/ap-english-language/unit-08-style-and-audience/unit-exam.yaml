  - slug: u08-exam-q25
    type: long_answer
    topic_code: "7.A"
    source: 'G. K. Chesterton, "On Running After One''s Hat," All Things Considered (1908)'
    points: 6
    stimulus: *ex_hat
    prompt: |
      Rhetorical analysis essay (suggested time 40 minutes). In 1908 the English writer G. K. Chesterton published "On Running After One's Hat" in a London newspaper after floods had struck parts of the city. Read the passage carefully. Write an essay that analyzes the rhetorical choices Chesterton makes to persuade his readers to reconsider their attitude toward everyday inconveniences.

      In your response you should do the following:
      - Respond to the prompt with a thesis that analyzes the writer's rhetorical choices.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Demonstrate an understanding of the rhetorical situation.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      A strong essay argues that Chesterton disarms newspaper readers used to grumbling by making his case comic: he models the attitude he recommends instead of arguing for it abstractly. Choice 1: perverse paradox and mock-heroic comparison. His savage envy at missing the flood and his vision of Battersea as Venice, with the greengrocer as a gondolier, show an inconvenience transformed by imagination before he states any claim. Choice 2: teasing identification with the audience. The Indignant Ratepayer names a familiar type without insulting readers, and the confession that man is a very comic creature includes Chesterton himself. Choice 3: absurd elaboration. The hat becomes a wild animal, the chase a future aristocratic sport, the old gentleman a benefactor of the crowd; each extension makes the reader laugh at embarrassment, which is the change of attitude he wants. Choice 4: the closing chiasmus, which compresses the argument into a reversible formula readers can carry away. Sophistication: noting the tension between the essay's frivolous surface and its serious claim about perception, or its care to limit the claim to mere inconvenience (nothing beyond inconvenience seems really to have been caused).
    explanation: |
      Scored out of 6 on the AP rhetorical analysis rubric. Thesis (0-1): 1 point for a defensible thesis that analyzes Chesterton's rhetorical choices (for example, mock-heroic comparison, paradox, humour, identification with the reader) in light of his purpose; a thesis that only summarises or names devices without purpose earns 0. Evidence and commentary (0-4): 4 points for specific evidence from across the passage and consistent commentary explaining how each choice works on a newspaper audience prone to grumbling; 3 points if commentary is sound but uneven; 2 points if evidence is relevant but commentary mostly paraphrases or lists devices; 1 point for general or summary-level discussion; 0 for irrelevant response. Sophistication (0-1): 1 point for a nuanced reading, such as explaining the tension between comic surface and earnest purpose, the limit Chesterton marks (his claim covers floods that caused nothing beyond inconvenience), or how the style enacts the argument, sustained through the essay in a vivid, controlled style.

