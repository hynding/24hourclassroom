  - slug: u08-exam-q43
    type: true_false
    topic_code: "2.B"
    source: general knowledge
    points: 1
    prompt: |
      True or false: a piece of evidence that persuades one audience will persuade every audience equally well.
    answer: false
    explanation: |
      False. Audiences trust different kinds of evidence according to their beliefs, values and responsibilities. A city council weighs costs and comparable cases; nervous freshmen want practical reassurance; retirees on fixed incomes want to know what a tax will cost them.

  - slug: u08-exam-q44
    type: short_answer
    topic_code: "1.B"
    source: 'Franklin D. Roosevelt, First Inaugural Address (1933), U.S. government work; John F. Kennedy, Inaugural Address (1961), U.S. government work'
    points: 3
    prompt: |
      Roosevelt in 1933 and Kennedy in 1961 both gave inaugural addresses at moments of national danger, but to audiences with different needs. In three or four sentences, identify one need of each audience and explain how one choice in each speech meets it.
    answer: |
      Roosevelt's audience, frightened by bank failures and unemployment, needed honesty and reassurance that action was coming; he meets it by conceding that only a foolish optimist can deny the dark realities and then declaring that the nation asks for action, and action now. Kennedy's audience, living with the threat of nuclear war, needed both firmness toward adversaries and hope of peace; he meets it with balanced clauses such as let us never negotiate out of fear but let us never fear to negotiate, which promise strength and openness at once. Roosevelt speaks mainly to suffering citizens at home, while Kennedy shapes each pledge for allies and adversaries listening abroad.
    explanation: |
      3 points. 1 point: identifies a plausible need of Roosevelt's 1933 audience and a specific choice that meets it. 1 point: identifies a plausible need of Kennedy's 1961 audience and a specific choice that meets it. 1 point: explains how each choice meets the need (not just naming it), ideally noting a difference between the audiences. Quotations need not be exact if the choice is accurately described.

  - slug: u08-exam-q45
    type: short_answer
    topic_code: "8.B"
    source: written for this course
    points: 2
    prompt: |
      Combine these sentences into one clear sentence that puts the most important idea last: *The school added a second lunch period. The cafeteria line used to take twenty minutes. Now it takes five.* Then, in one sentence, explain which idea you emphasised and how.
    answer: |
      Sample: *Since the school added a second lunch period, the cafeteria line that used to take twenty minutes now takes five.* The dependent since clause gives the cause first, and the main clause ends on now takes five, the result the writer most wants the reader to notice.
    explanation: |
      1 point: a single grammatical sentence that combines all three ideas with a clear relationship (cause and effect or time) and places the key result at the end. 1 point: the explanation names the emphasised idea and the structure or placement that emphasises it. A sentence joined only by and earns at most 1.
