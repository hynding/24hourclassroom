  - slug: u08-exam-q26
    type: multiple_choice
    topic_code: "8.B"
    source: written for this course
    points: 1
    stimulus: &ex_council |
      *The following is a draft of a speech a student is preparing to give at a city council meeting. The student wants the council to approve turning a vacant city-owned lot into a community garden, and wants the speech to sound respectful, confident and practical.*

      (1) Good evening, members of the council. (2) Living two blocks from the vacant lot on Elm Street, the lot is something I walk past every day. (3) The lot has been empty for six years. (4) It is full of weeds. (5) It is full of trash. (6) Neighbors have complained about it. (7) A community garden would fix all of this, it would also give families fresh vegetables. (8) I know the council has to think carefully about money. (9) Gardens are super cheap and basically pay for themselves. (10) The neighborhood association has promised volunteers, a hardware store on Main Street has offered to donate tools, and the county extension office will test the soil for free. (11) Other cities have done this. (12) Approving the garden would be a good thing for the neighborhood.
    prompt: |
      Sentence 2 contains a dangling modifier. Which revision of sentence 2 corrects the error and states clearly who walks past the lot?
    options:
      - |
        Living two blocks from the vacant lot on Elm Street, the lot is walked past by me every day.
      - |
        Because I live two blocks from the vacant lot on Elm Street, I walk past it every day.
      - |
        Living two blocks from the vacant lot on Elm Street, walking past it every day.
      - |
        The lot, living two blocks away on Elm Street, is something I walk past every day.
    option_explanations:
      - |
        The opening phrase still modifies the lot, not the speaker, and the passive voice makes the sentence more awkward.
      - |
        Correct. Turning the phrase into a dependent clause with its own subject (I) names who lives nearby, and the main clause says what the speaker does, giving the council the speaker's stake at once.
      - |
        Removing the main clause leaves a fragment with no subject or main verb.
      - |
        The phrase now describes the lot as living two blocks away, which is still a misplaced modifier.
    answer: 1
    explanation: |
      Skill 8.B: a modifier must attach to the word it describes. Converting a phrase into a clause with its own subject is often the clearest fix.

