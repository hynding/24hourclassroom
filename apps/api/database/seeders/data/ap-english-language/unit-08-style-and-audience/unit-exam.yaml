    points: 1
    prompt: |
      Kennedy calls for "a new endeavor, not a new balance of power, but a new world of law, where the strong are just and the weak secure and the peace preserved." Which best describes how the final clause works?
    options:
      - |
        It is an independent clause that begins a new sentence.
      - |
        It is a relative clause modifying world of law, and it leaves its verbs understood after the first (are just, are secure, is preserved), so its three parallel parts move quickly to the goal.
      - |
        It is a conditional clause that states what would cause war.
      - |
        It is a fragment that should be corrected.
    option_explanations:
      - |
        The where clause cannot stand alone; it depends on the noun phrase a new world of law.
      - |
        Correct. Where introduces a dependent clause describing the world of law. The verb appears only in the first part, and the omission (ellipsis) in the next two quickens the rhythm and balances strong against weak.
      - |
        The clause describes a desired world, not a condition for war; there is no if.
      - |
        The clause is part of a complete sentence; the omitted verbs are a deliberate and grammatical ellipsis.
    answer: 1
    explanation: |
      Relative clauses add description to a noun. Omitting repeated verbs (ellipsis) in a parallel series tightens the rhythm.

  - slug: u08-exam-q39
    type: multiple_choice
    topic_code: "1.B"
    source: 'John F. Kennedy, Inaugural Address (1961), U.S. government work'
    points: 1
    prompt: |
      Immediately after "ask not what your country can do for you--ask what you can do for your country," Kennedy says: "My fellow citizens of the world: ask not what America will do for you, but what together we can do for the freedom of man." The second sentence shows Kennedy's understanding of his audience chiefly by
    options:
      - |
        withdrawing the request he has just made of Americans
      - |
        adapting the same structure to a second, international audience, replacing dependence on America with partnership (together) in a cause both share
      - |
        demanding that foreign nations serve the United States
      - |
        addressing only the diplomats seated on the platform
    option_explanations:
      - |
        The second sentence extends the request to a new audience; it does not withdraw the first.
      - |
        Correct. Kennedy knew the world was listening. He keeps the ask not frame but changes its terms: foreign listeners are asked not to rely on America but to join it, which respects their independence.
      - |
        The sentence asks what together we can do; it proposes partnership, not service.
      - |
        Citizens of the world is a broad international audience, not a handful of officials.
    answer: 1
    explanation: |
