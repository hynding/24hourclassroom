  - slug: u08-exam-q40
    type: multi_select
    topic_code: "8.B"
    source: written for this course
    points: 2
    partial_credit: true
    prompt: |
      A writer wants to concede that a later school start time would complicate after-school sports while keeping the claim that the change is worth it. Which TWO sentences use subordination to make this relationship clear? Select two.
    options:
      - |
        Although a later start would push practices into the evening, the gain in students' sleep and attention is worth the adjustment.
      - |
        Even if sports schedules must shift, a later start is worth the change because students would be more alert in class.
      - |
        A later start would push practices into the evening, and students would sleep more.
      - |
        Practices in the evening. Students sleeping more. Worth it.
    option_explanations:
      - |
        Correct. The although clause concedes the drawback, and the main clause, placed last, states the claim the writer wants emphasised.
      - |
        Correct. Even if concedes the cost, the main clause asserts the claim, and because adds the reason, so every relationship is named.
      - |
        And joins the clauses as equals and hides the concession; the reader cannot tell which idea the writer favours.
      - |
        Fragments leave all the relationships unstated.
    answer: [0, 1]
    explanation: |
      Concede in a dependent clause (although, even if); claim in the main clause at the end.

  - slug: u08-exam-q41
    type: fill_blank
    topic_code: "7.B"
    source: general knowledge
    points: 1
    prompt: |
      Reversing the order of repeated words in two parallel clauses, as in Chesterton's "An adventure is only an inconvenience rightly considered. An inconvenience is only an adventure wrongly considered," is called ____.
    answer: ["chiasmus", "a chiasmus", "antimetabole", "an antimetabole"]
    explanation: |
      Chiasmus (strictly, antimetabole when the same words return) mirrors terms A-B, B-A. Kennedy's ask not sentence is the best-known example in American speech.

