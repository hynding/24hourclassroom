    source: 'G. K. Chesterton, Heretics (1905)'
    points: 1
    stimulus: &ex_clan |
      *The following passage is from a later chapter of G. K. Chesterton's Heretics (1905).*

      It is not fashionable to say much nowadays of the advantages of the small community. We are told that we must go in for large empires and large ideas. There is one advantage, however, in the small state, the city, or the village, which only the wilfully blind can overlook. The man who lives in a small community lives in a much larger world. He knows much more of the fierce varieties and uncompromising divergences of men. The reason is obvious. In a large community we can choose our companions. In a small community our companions are chosen for us. Thus in all extensive and highly civilized societies groups come into existence founded upon what is called sympathy, and shut out the real world more sharply than the gates of a monastery. There is nothing really narrow about the clan; the thing which is really narrow is the clique.
    prompt: |
      The sentence "The man who lives in a small community lives in a much larger world" is best described as
    options:
      - |
        a literal claim about the geographic size of villages
      - |
        a paradox that startles the reader into asking how small can be large, and is then explained by the variety of people a small community forces one to know
      - |
        a concession that large empires are superior to villages
      - |
        a rhetorical question addressed to readers who live in cities
    option_explanations:
      - |
        The world here is the range of human experience, not physical size; the claim is figurative.
      - |
        Correct. The apparent contradiction (small community, larger world) hooks the reader, and the next sentences resolve it: there one meets the fierce varieties and uncompromising divergences of men.
      - |
        Chesterton argues for the small community; he reports the fashionable preference for large empires in order to reject it.
      - |
        The sentence is a declarative statement, not a question.
    answer: 1
    explanation: |
      A paradox in argument is a compressed claim that the following sentences unpack. Name both the contradiction and the resolution.

