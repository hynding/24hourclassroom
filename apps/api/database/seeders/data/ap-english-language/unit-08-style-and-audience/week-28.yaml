guide: guides/week-28.md
guide_description: |
  The writing side of style (8.A): choosing words, comparisons and sentence patterns on purpose to give an argument
  a tone. The model is G. K. Chesterton's Heretics (1905), whose arguments run on paradox, antithesis, inverted lists
  and homely analogies such as the parable of the lamp-post. Four close readings of how his choices build a tone
  that is witty and serious at once, then a workshop on revising flat prose into a confident style without losing
  clarity, common mistakes, the exam connection and a self-check.
flashcards_description: |
  30 cards on the stylist's toolkit (paradox, antithesis, epigram, analogy, extended metaphor, inverted list,
  hyperbole and understatement, sentence rhythm, register), on revising for tone, and on the arguments and lines of
  Chesterton's Heretics.

flashcards:
  - front: "Skill 8.A in Unit 8 → what the writing skill asks of a stylist"
    back: |
      Strategically use words, comparisons and syntax to convey a specific tone or style in an argument. Strategically is the key word: each choice should serve the claim and suit the audience, not decorate the page.
    topic_code: "8.A"
  - front: "Style vs tone → the difference, with Chesterton as example"
    back: |
      Tone is the attitude (wry, urgent, reverent). Style is the whole manner of writing that produces it: the habits of diction, comparison, sentence shape and rhythm that make a writer recognisable.
    topic_code: "8.A"
  - front: "Paradox in an argument → what Chesterton uses it for"
    back: |
      A statement that seems self-contradictory but reveals a truth on reflection. In argument it startles readers out of a familiar assumption and makes them work out the claim for themselves.
    topic_code: "8.A"
  - front: Chesterton's paradox "Everything matters--except everything" → how it works
    back: |
      The first everything means every particular detail; the second means the universe as a whole. The repetition with a shifted meaning compresses his thesis: modern people care about details and dismiss the big questions.
    topic_code: "8.A"
  - front: "Antithesis → how Chesterton builds one"
    back: |
      Contrasting ideas placed in parallel grammatical form, often in balanced halves of a sentence. The matching structure makes the difference between the ideas sharp and memorable.
    topic_code: "8.A"
  - front: Chesterton's "old restriction" and "modern liberty" sentences → the antithesis
    back: |
      The old restriction meant that only the orthodox could discuss religion; modern liberty means that nobody is allowed to discuss it. Parallel sentences set past against present so that freedom seems to have produced a worse silence.
    topic_code: "8.A"
  - front: "Epigram → Shaw's golden rule and Chesterton's answers"
    back: |
      A short, witty, memorable statement, often paradoxical or antithetical. Chesterton quotes Shaw's epigram that the golden rule is that there is no golden rule, then answers with his own.
    topic_code: "8.A"
  - front: "Analogy in argument → what Chesterton's lamp-post can and cannot do"
    back: |
      An extended comparison that explains an unfamiliar or abstract case through a familiar one. It clarifies and persuades by making a principle concrete, but it proves nothing alone: a reader can always ask whether the two cases are really alike.
    topic_code: "8.A"
  - front: Chesterton's lamp-post parable → the story
    back: |
      A crowd wants a lamp-post pulled down; a monk who starts by asking about the value of Light is knocked down; the post is down in ten minutes; then the crowd discovers each wanted something different, and they fight in the dark. Moral: first principles are practical.
    topic_code: "5.C"
  - front: Chesterton's lamp-post parable → the closing antithesis
    back: |
      Only what we might have discussed under the gas-lamp, we now must discuss in the dark. The light-and-dark contrast turns the literal lamp into a metaphor for clear thinking, and ends the story on an epigram.
    topic_code: "8.A"
  - front: Chesterton's "noble hound" and "fish unfit for eating" → comparison
    back: |
      The old Liberals freed inquiry as men release a prized hunting dog; moderns free it as men throw back a worthless fish. Two images of release carry opposite attitudes: esteem and contempt.
    topic_code: "7.A"
  - front: Chesterton's inverted list (murderers given medals) → strategy
    back: |
      If pessimism were believed, murderers would be rewarded, firemen denounced and poisons used as medicine. A series of absurd reversals follows an idea to its consequences (reductio ad absurdum) in a comic, rapid rhythm.
    topic_code: "8.A"
  - front: "Reductio ad absurdum → Chesterton and Swift compared"
    back: |
      Refuting a position by showing that, taken seriously, it leads to absurd consequences. Chesterton uses it on the tea-table pessimist; Swift uses a version of it on economic schemes.
    topic_code: "3.A"
  - front: Heretics → publication and purpose
    back: |
      Essays by G. K. Chesterton (1874-1936), published in 1905, arguing against the views of famous contemporaries, among them Kipling, Shaw and H. G. Wells. He calls each a heretic, a man whose philosophy differs from his own, and insists that philosophy matters.
    topic_code: "1.A"
  - front: Heretics → its overarching thesis
    back: |
      Modern people wrongly treat a person's view of the universe as unimportant; in fact a philosophy is the most practical thing about anyone, and ignoring first principles leads to muddle in politics, art and daily life.
    topic_code: "3.B"
  - front: Chesterton's redefinition of heretic and orthodox → the opening move
    back: |
      He observes that heretic has come to mean clear-headed and courageous, and orthodox to mean wrong. By noticing how two words have flipped, he exposes an attitude: people no longer care whether they are right.
    topic_code: "8.A"
  - front: Chesterton's landlady and general → the parallel examples
    back: |
      For a landlady considering a lodger, his income matters but his philosophy matters more; for a general, the enemy's numbers matter but the enemy's philosophy matters more. Parallel examples from ordinary life make an abstract claim concrete.
    topic_code: "8.A"
  - front: "Chesterton's \"There is nothing that fails like success\" → the twist"
    back: |
      A twist on the proverb that nothing succeeds like success. Altering a familiar saying is a quick way to surprise readers and to compress an argument: chasing immediate victory is a losing strategy.
    topic_code: "8.A"
  - front: Chesterton's small community vs large world → the paradox
    back: |
      In a later chapter he argues that a person in a small community lives in a larger world, because there companions are chosen for us and we must deal with every variety of person, while in a big society we choose people like ourselves.
    topic_code: "8.A"
  - front: Chesterton's clan vs clique → the antithesis
    back: |
      There is nothing really narrow about the clan; the thing which is really narrow is the clique. Two near-rhyming words set side by side carry the whole argument about chosen and unchosen company.
    topic_code: "8.A"
  - front: "Hyperbole vs understatement → Chesterton and Swift compared"
    back: |
      Hyperbole overstates for emphasis or comedy; understatement says less than expected for irony or restraint. Chesterton exaggerates the consequences of pessimism; Swift's proposer understates cruelty. Both depend on readers knowing the true scale.
    topic_code: "8.A"
  - front: Sentence rhythm → the short sentence after long ones
    back: |
      A short sentence after several long ones lands with force, like a verdict. Writers place their key claim there: after a long list, Chesterton writes a four-word sentence such as *Everything matters--except everything.*
    topic_code: "8.A"
  - front: "Diction level → Chesterton's cosmic philosophy at a tea-table"
    back: |
      Formal, plain and colloquial diction each suit some purposes. Chesterton mixes elevated words (cosmic philosophy) with homely scenes (a tea-table, a lamp-post), so serious ideas feel close at hand.
    topic_code: "2.B"
  - front: "Extended metaphor → the lamp-post as the light of reason"
    back: |
      A comparison carried through several sentences or a whole passage, as when Chesterton's lamp-post becomes the light of reason. Extending a metaphor lets each new detail add to the argument.
    topic_code: "8.A"
  - front: "Revising a paragraph for style → the three questions to ask"
    back: |
      What tone do I want (confident, urgent, wry)? Which words, comparisons and sentence patterns produce it? Does each choice make the claim clearer for this audience, or only fancier?
    topic_code: "8.A"
  - front: "Clichéd comparison → why to revise it into a fresh one"
    back: |
      A worn comparison (*as busy as a bee*, *like a phone that never charges*) adds no new thought and signals a writer on autopilot. A fresh comparison chosen for the claim does argumentative work.
    topic_code: "8.A"
  - front: "Tone consistency in a styled argument → why one slangy phrase hurts"
    back: |
      A sudden slangy phrase in a formal paragraph, or a sneer in a reasonable one, makes readers doubt the writer's control and judgment. Keep the register steady unless a shift is deliberate and signalled.
    topic_code: "8.A"
  - front: "Wit vs flippancy → why Chesterton's jokes still argue"
    back: |
      Wit serves the claim: the joke carries the point. Flippancy dismisses the subject or the audience. Chesterton jokes constantly, yet every joke is aimed at an idea he takes seriously.
    topic_code: "8.A"
  - front: AP writing questions on style → the usual stem
    back: |
      The writer wants to convey a particular tone (urgency, confidence, humour) or to make a comparison vivid. Which version of the underlined sentence best accomplishes this goal? Pick the option that serves the stated goal and fits the passage, not the fanciest one.
    topic_code: "8.A"
  - front: AP essays → where 8.A earns sophistication credit
    back: |
      A vivid, controlled style (apt comparisons, varied syntax, a tone suited to the task) is one of the ways an essay can earn the sophistication point, as long as it serves a complex argument rather than replacing one.
    topic_code: "8.A"

quiz:
  description: |
    22 questions · about 35 minutes · an eight-question set on a passage from the first chapter of Chesterton's
    Heretics, a six-question revision set on a student's argument paragraph, and eight more items on paradox,
    antithesis, analogy and style. Multiple choice, select-all and true/false items are graded at once; the
    fill-in-the-blank items are matched automatically; the short answers and the paragraph are graded by your
    teacher against the model answers and scoring notes.
  questions:
    # ---- Passage set: the tea-table pessimist and the new silence
    - slug: u08-w28-q01
      type: multiple_choice
      topic_code: "7.A"
      source: 'G. K. Chesterton, Heretics (1905)'
      points: 1
      stimulus: &gkc_tea |
        *The following passage is from the first chapter of G. K. Chesterton's Heretics (1905). Chesterton has argued that his contemporaries no longer believe it matters what a person thinks about the universe.*

        Examples are scarcely needed of this total levity on the subject of cosmic philosophy. [...] Let me, however, take a random instance. At any innocent tea-table we may easily hear a man say, "Life is not worth living." We regard it as we regard the statement that it is a fine day; nobody thinks that it can possibly have any serious effect on the man or on the world. And yet if that utterance were really believed, the world would stand on its head. Murderers would be given medals for saving men from life; firemen would be denounced for keeping men from death; poisons would be used as medicines; doctors would be called in when people were well; the Royal Humane Society would be rooted out like a horde of assassins. Yet we never speculate as to whether the conversational pessimist will strengthen or disorganize society; for we are convinced that theories do not matter.

        This was certainly not the idea of those who introduced our freedom. When the old Liberals removed the gags from all the heresies, their idea was that religious and philosophical discoveries might thus be made. Their view was that cosmic truth was so important that every one ought to bear independent testimony. The modern idea is that cosmic truth is so unimportant that it cannot matter what any one says. The former freed inquiry as men loose a noble hound; the latter frees inquiry as men fling back into the sea a fish unfit for eating. Never has there been so little discussion about the nature of men as now, when, for the first time, any one can discuss it. The old restriction meant that only the orthodox were allowed to discuss religion. Modern liberty means that nobody is allowed to discuss it.
      prompt: |
        The series of sentences beginning "Murderers would be given medals for saving men from life" contributes to the passage chiefly by
      options:
        - |
          offering statistical evidence that pessimism causes crime
        - |
          describing actual events Chesterton has witnessed in London
        - |
          following the tea-table remark to its logical consequences through a rapid list of absurd reversals, so that a casual phrase is shown to be a serious and dangerous idea
        - |
          shifting the tone from humorous to tragic in order to mourn the decline of religion
      option_explanations:
        - |
          The list contains no data; it is a hypothetical series introduced by if that utterance were really believed.
        - |
          The sentences use the conditional would; they describe what would follow from a belief, not events Chesterton saw.
        - |
          Correct. Each clause inverts a familiar value (rescue, healing, medicine), and the quick semicolon rhythm makes the absurdity comic. The reductio proves his point that theories do matter.
        - |
          The list is comic, and the tone remains witty through the next sentence; nothing in it mourns.
      answer: 2
      explanation: |
        Spiral review of 7.A: syntax (a fast series of parallel clauses) and word choice (reversed values) together produce a tone that is funny and pointed at once.

    - slug: u08-w28-q02
      type: multiple_choice
      topic_code: "7.A"
      source: 'G. K. Chesterton, Heretics (1905)'
      points: 1
      stimulus: *gkc_tea
      prompt: |
        In the sentence comparing the old Liberals who freed inquiry "as men loose a noble hound" with moderns who free it "as men fling back into the sea a fish unfit for eating," the two comparisons
      options:
        - |
          describe the same act of release with opposite attitudes, esteem for what is freed and contempt for it, so that modern tolerance appears as indifference
        - |
          show that the old Liberals preferred hunting to fishing
        - |
          suggest that inquiry is dangerous and should be restrained
        - |
          praise modern society for its generosity toward unpopular ideas
      option_explanations:
        - |
          Correct. Both images are acts of letting go, but one releases a prized animal to hunt and the other discards something worthless. The paired comparisons carry Chesterton's claim that modern freedom of thought springs from not caring.
        - |
          The images are figurative; the sports are vehicles for attitudes, not preferences being reported.
        - |
          Chesterton approves of the old Liberals' freeing of inquiry; his complaint is about why moderns tolerate ideas, not that ideas are freed.
        - |
          The fish image is contemptuous; it presents modern tolerance as throwing ideas away, not as generosity.
      answer: 0
      explanation: |
        When two comparisons are set side by side in parallel form, compare the feelings each one carries. The contrast is the argument.

    - slug: u08-w28-q03
      type: multiple_choice
      topic_code: "7.A"
      source: 'G. K. Chesterton, Heretics (1905)'
      points: 1
      stimulus: *gkc_tea
      prompt: |
        The sentence "Never has there been so little discussion about the nature of men as now, when, for the first time, any one can discuss it" is best described as
      options:
        - |
          a concession that modern freedom has improved public debate
        - |
          a rhetorical question that invites the reader to disagree
        - |
          a definition of the term heresy
        - |
          a paradox that startles the reader by linking the greatest freedom to discuss with the least discussion
      option_explanations:
        - |
          The sentence says the opposite: discussion has shrunk. Nothing in it concedes an improvement.
        - |
          The sentence is a declarative statement, not a question, and Chesterton expects agreement.
        - |
          The sentence does not define a term; it makes a claim about the state of modern debate.
        - |
          Correct. The apparent contradiction, freedom producing silence, forces the reader to find the explanation Chesterton has supplied: people no longer think the questions matter.
      answer: 3
      explanation: |
        A paradox in an argument is a compressed claim. Explain both the apparent contradiction and the truth it reveals.

    - slug: u08-w28-q04
      type: multiple_choice
      topic_code: "8.A"
      source: 'G. K. Chesterton, Heretics (1905)'
      points: 1
      stimulus: *gkc_tea
      prompt: |
        A student writing an argument about school reading wants to imitate the structure of Chesterton's last two sentences ("The old restriction meant... Modern liberty means..."). Which sentence best uses the same strategy?
      options:
        - |
          Reading is important, and students should read more books in and out of school.
        - |
          The old reading list told students which books mattered; the new freedom tells them that no book does.
        - |
          Some students like novels, while others prefer nonfiction, and both are fine.
        - |
          Because the reading list was removed last year, students now have more choices than ever.
      option_explanations:
        - |
          The sentence is a plain claim with no contrast between past and present and no parallel structure.
        - |
          Correct. Like Chesterton's pair, it sets an old restriction against a new freedom in parallel clauses and gives the freedom a sting in the tail, making liberty look like indifference.
        - |
          The sentence contrasts preferences but has no turn or paradox; it makes no argument.
        - |
          This states a cause and effect in a single direction without the balanced contrast or the ironic reversal that makes Chesterton's sentences work.
      answer: 1
      explanation: |
        Skill 8.A: borrowing a writer's syntax is a fast way to learn a style. Antithesis works when the parallel form exposes a surprising difference.

    - slug: u08-w28-q05
      type: multi_select
      topic_code: "7.A"
      source: 'G. K. Chesterton, Heretics (1905)'
      points: 2
      partial_credit: true
      stimulus: *gkc_tea
      prompt: |
        Which TWO features most contribute to the passage's witty but serious style? Select two.
      options:
        - |
          A list of absurd reversals that follows an idea to its consequences
        - |
          Paradoxical statements that pair freedom with silence
        - |
          Statistical tables comparing the numbers of believers in different eras
        - |
          A personal anecdote about Chesterton's childhood
      option_explanations:
        - |
          Correct. The inverted list (medals for murderers, denounced firemen) is comic on its surface and makes a serious logical point.
        - |
          Correct. The closing paradoxes are witty compressions of a serious claim about the state of public thought.
        - |
          The passage contains no numbers or tables; its evidence is hypothetical and comparative.
        - |
          The only scene is a generic tea-table, not a memory from Chesterton's life.
      answer: [0, 1]
      explanation: |
        Chesterton's style yokes comedy to argument: every joke carries a claim.

    - slug: u08-w28-q06
      type: multiple_choice
      topic_code: "1.B"
      source: 'G. K. Chesterton, Heretics (1905)'
      points: 1
      stimulus: *gkc_tea
      prompt: |
        Chesterton's choice of "any innocent tea-table" as the setting for his example most likely reflects his understanding that his readers
      options:
        - |
          had never attended a social gathering
        - |
          were professional philosophers who would scorn ordinary examples
        - |
          would recognise the polite middle-class scene from their own lives, so the criticism would apply to them and not only to distant thinkers
        - |
          believed that tea-drinking was a dangerous habit
      option_explanations:
        - |
          The example only works because readers know such gatherings well; it assumes familiarity, not ignorance.
        - |
          The book was written for a broad reading public, and Chesterton deliberately chooses homely examples to bring abstract issues close.
        - |
          Correct. The familiar scene implicates the reader. The careless remark and the shrug that greets it are habits his audience would recognise as their own.
        - |
          The tea-table is a setting, not a target; nothing in the passage criticises tea.
      answer: 2
      explanation: |
        Spiral review of 1.B: a writer's choice of example reveals what the writer knows about the audience's daily life.

    - slug: u08-w28-q07
      type: true_false
      topic_code: "7.A"
      source: 'G. K. Chesterton, Heretics (1905)'
      points: 1
      stimulus: *gkc_tea
      prompt: |
        True or false: Chesterton's attitude toward "the conversational pessimist" is solemn and alarmed.
      answer: false
      explanation: |
        False. His attitude is wry and mocking. The phrase conversational pessimist itself is a joke (a pessimist only in conversation), and the list of absurd consequences treats the remark as ridiculous. The seriousness lies in the argument the joke carries, not in the tone.

    - slug: u08-w28-q08
      type: multiple_choice
      topic_code: "3.B"
      source: 'G. K. Chesterton, Heretics (1905)'
      points: 1
      stimulus: *gkc_tea
      prompt: |
        Which best states the claim the passage as a whole supports?
      options:
        - |
          Pessimists should not be allowed to speak in public.
        - |
          Modern people treat philosophical beliefs as unimportant, so that freedom of thought has become a freedom no one uses.
        - |
          The old Liberals were wrong to remove restrictions on heresy.
        - |
          Religion should be discussed only by the orthodox.
      option_explanations:
        - |
          Chesterton objects to the shrug that greets pessimism, not to free speech; he wants ideas taken seriously, not silenced.
        - |
          Correct. The tea-table example shows ideas being ignored, and the second paragraph shows how that indifference turned the old Liberals' hard-won freedom into silence.
        - |
          Chesterton presents the old Liberals approvingly: they believed truth so important that everyone should testify.
        - |
          He describes the old restriction to contrast it with the modern one, not to recommend it.
      answer: 1
      explanation: |
        Spiral review of 3.B: state a thesis that covers the whole passage, not one example from it.

    # ---- Revision set: a paragraph in search of a style
    - slug: u08-w28-q09
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: &w28_draft |
        *The following is a draft of a body paragraph a student is writing for an argument essay. The writer argues that schools should protect unscheduled time in the school day and wants the paragraph to sound confident, witty and serious at once.*

        (1) Many schools have filled every minute of the day with structured activities. (2) Students go from class to club to tutoring without a break. (3) This is bad. (4) Adults assume that an empty hour is a wasted hour. (5) But some of the best ideas come when nothing is scheduled. (6) A mind that is always busy is kind of like a phone that never gets charged. (7) Free time lets students think, talk and notice things. (8) Schools say they want creative students, but they don't give them time to be creative. (9) In conclusion, free time is good and important.
      prompt: |
        The writer wants to replace sentence 3 with a sentence that states the paragraph's claim in a confident, pointed tone. Which version best accomplishes this goal?
      options:
        - |
          This is really, really bad for everyone involved.
        - |
          Some people might think this is maybe not the best idea.
        - |
          This situation exists in many schools across the country.
        - |
          A schedule with no empty minutes teaches students everything except how to think for themselves.
      option_explanations:
        - |
          Repeated intensifiers add volume, not precision; the sentence still does not say why the schedule is harmful.
        - |
          Stacked hedges (some people, might, maybe) make the writer sound timid, the opposite of the confident tone the writer wants.
        - |
          The sentence is a neutral observation, not a claim; it drops the paragraph's argument entirely.
        - |
          Correct. The sentence makes an arguable claim and gives it the twist of an epigram (everything except), which sounds confident and witty while staying serious.
      answer: 3
      explanation: |
        Skill 8.A: a pointed claim with a turn in it conveys confidence better than intensifiers do.

    - slug: u08-w28-q10
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: *w28_draft
      prompt: |
        The writer wants to revise sentence 6 so that its comparison is fresh and fits the paragraph's serious purpose. Which version best accomplishes this goal?
      options:
        - |
          A mind kept constantly busy is like a field never left fallow: it goes on producing, but every crop is thinner than the last.
        - |
          A mind that is always busy is as busy as a bee.
        - |
          A mind that is always busy is like, totally exhausted, you know?
        - |
          A mind that is always busy is a busy mind.
      option_explanations:
        - |
          Correct. The farming comparison is apt (rest restores fertility) and carries the claim that constant activity yields diminishing returns. It is vivid without being flippant.
        - |
          The cliché adds nothing and even suggests busyness is admirable, which works against the argument.
        - |
          Conversational filler breaks the paragraph's register and replaces the comparison with a shrug.
        - |
          The sentence is circular; it restates its subject and offers no comparison or insight at all.
      answer: 0
      explanation: |
        A comparison earns its place when its details carry the claim. Test it: what does the comparison imply, and is that what you mean?

    - slug: u08-w28-q11
      type: multiple_choice
      topic_code: "8.A"
      source: written for this course
      points: 1
      stimulus: *w28_draft
      prompt: |
        The writer wants to revise sentence 8 to sharpen the contrast between what schools say and what they do. Which version best accomplishes this goal?
      options:
        - |
          Schools want creative students, and they also have busy schedules.
        - |
          Creativity is something many schools mention in their mission statements.
        - |
          Schools ask students to be creative and then schedule away the only hours in which creativity could happen.
        - |
          Although schools say they want creativity, it is possible that schedules may sometimes have an effect on it.
      option_explanations:
        - |
          The connective and joins the ideas as if they were compatible, losing the contradiction the writer wants to expose.
        - |
          The sentence states a fact but no contrast, so the paragraph's point disappears.
        - |
          Correct. The sentence places the stated goal and the contradicting action in one sequence (ask, then schedule away), so the irony is plain and the tone stays confident.
        - |
          Hedges (it is possible, may, sometimes) blunt the contrast and make the writer sound unsure.
      answer: 2
      explanation: |
        Syntax can dramatise a contradiction. Put the stated aim and the undermining act side by side.

    - slug: u08-w28-q12
      type: multi_select
      topic_code: "8.A"
      source: written for this course
      points: 2
      partial_credit: true
      stimulus: *w28_draft
      prompt: |
        The writer wants to combine sentences 4 and 5 into one sentence whose structure emphasises the contrast between the adults' assumption and the truth. Which TWO versions best accomplish this goal? Select two.
      options:
        - |
          Adults assume that an empty hour is a wasted hour; in fact, it is often the most productive hour of the day.
        - |
          Adults assume that an empty hour is wasted, but it is the hour in which the mind finally does its own work.
        - |
          Adults assume things, and some ideas come when nothing is scheduled.
        - |
          An empty hour, which adults assume, sometimes has ideas in it.
      option_explanations:
        - |
          Correct. The semicolon and in fact set assumption against reality in balanced halves, with the repeated hour making the reversal crisp.
        - |
          Correct. The contrastive but turns from the assumption to a claim that redefines the empty hour, and the closing phrase gives the sentence weight.
        - |
          The vague assume things and the additive and lose the contrast entirely.
        - |
          The sentence is garbled (adults do not assume an hour) and buries the contrast in a confusing clause.
      answer: [0, 1]
      explanation: |
        Balanced, contrastive syntax (semicolon with in fact; but with a redefinition) makes a reversal memorable.

    - slug: u08-w28-q13
      type: multiple_choice
      topic_code: "2.B"
      source: written for this course
      points: 1
      stimulus: *w28_draft
      prompt: |
        The writer learns that the essay will be read by school board members who care most about academic results. Which sentence, added after sentence 7, would best appeal to that audience's values?
      options:
        - |
          Free time is also a lot of fun, and students deserve fun.
        - |
          Several of the district's own top scorers on last spring's state exams said in a student survey that they do their best problem-solving during study hall.
        - |
          Everyone knows that adults need breaks, so students do too.
        - |
          Some schools in other countries have longer lunch periods.
      option_explanations:
        - |
          Fun is a value students hold; an audience focused on results is unlikely to be moved by it.
        - |
          Correct. The evidence ties unscheduled time to the outcome the board values (achievement) and comes from the district's own students, which a skeptical board will find credible.
        - |
          An appeal to common knowledge is weak evidence and does not connect to academic results.
        - |
          The comparison lacks any link to outcomes, and the board may not see why foreign lunch periods matter.
      answer: 1
      explanation: |
        Spiral review of 2.B: choose evidence for the audience's values. The same claim needs different proof for different readers.

