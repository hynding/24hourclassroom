    - slug: u08-w28-q20
      type: short_answer
      topic_code: "7.A"
      source: 'G. K. Chesterton, Heretics (1905)'
      points: 2
      prompt: |
        After describing how moderns care about opinions on tramcars and painters but not on the universe, Chesterton writes: "Everything matters--except everything." In two or three sentences, explain how the word choice and syntax of this sentence create its effect.
      answer: |
        The sentence repeats one word with two meanings: the first everything means each particular detail, the second the whole of things. The four-word sentence, after a long run of examples, lands like a verdict, and the dash creates a pause before the reversal, so the paradox compresses the whole chapter's claim that moderns attend to details and dismiss the big questions.
      explanation: |
        1 point: explains the double meaning of the repeated word (details versus the universe or the whole). 1 point: explains a syntactic feature (brevity after long sentences, the dash and pause, the reversal at the end) and links it to the effect or the claim. A response that calls it a paradox without explaining earns at most 1.

    - slug: u08-w28-q21
      type: multiple_choice
      topic_code: "5.C"
      source: 'G. K. Chesterton, Heretics (1905)'
      points: 1
      prompt: |
        Chesterton supports his claim that first principles are practical with a story about a crowd that pulls down a lamp-post before deciding why. Which method of development does the passage chiefly use?
      options:
        - |
          Classification, sorting kinds of lamp-posts into categories
        - |
          Definition, explaining the dictionary meaning of the word light
        - |
          Narration of a brief hypothetical story that functions as an analogy for public debate
        - |
          Description of a real street Chesterton lived on
      option_explanations:
        - |
          The passage does sort the crowd's motives briefly, but its structure is a sequence of events, not a classification of lamp-posts.
        - |
          The monk begins to discuss the value of Light but is knocked down; the passage never defines the word.
        - |
          Correct. The parable narrates events in order (commotion, the monk, the rush, the quarrel in the dark), and the story stands for any public decision taken without agreement on principles.
        - |
          The street is hypothetical (Suppose that a great commotion arises), not a real place described in detail.
      answer: 2
      explanation: |
        Spiral review of 5.C: identify the method of development and its purpose. A parable is narration in the service of an analogy.

    - slug: u08-w28-q22
      type: long_answer
      topic_code: "8.A"
      source: written for this course
      points: 5
      prompt: |
        Write one argumentative paragraph (about 150-200 words) defending or challenging this claim: *Being bored is good for young people.* Your paragraph should convey a confident, witty but serious tone. Use at least one deliberate comparison (an analogy, metaphor or simile of your own) and at least one deliberate syntactic choice (antithesis, a short sentence after longer ones, or a parallel series), and support your claim with at least one specific piece of evidence or example.
      answer: |
        A model paragraph defends the claim. It opens with a pointed claim (*Boredom is the waiting room of imagination, and we have bulldozed it.*), gives evidence (a specific example: a student who, with a phone confiscated on a long bus trip, wrote the first page of a story; or the long summers in which earlier generations invented games), and explains it (empty time forces the mind to supply its own entertainment, which is what creativity is). It uses an extended comparison (the waiting room; or a field left fallow) and an antithesis or a short closing verdict (*We have cured boredom. We have not cured the need for it.*). The tone stays confident and wry without sneering at readers who disagree.
      explanation: |
        5 points. Claim (1): a clear, arguable position on the prompt, stated in the paragraph. Evidence (1): at least one specific example or piece of evidence that supports the claim. Commentary (3): 1 point for reasoning that explains how the evidence supports the claim; 1 point for at least one deliberate, apt comparison that carries part of the argument; 1 point for at least one deliberate syntactic choice and a consistent confident, witty but serious tone. A paragraph whose devices are decorative (a cliché, an unrelated metaphor) or whose tone becomes flippant or sarcastic loses the matching point.
