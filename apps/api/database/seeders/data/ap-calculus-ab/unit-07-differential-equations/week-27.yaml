    # ---- Short answer
    - slug: apcalcab-u07-w27-q22
      type: short_answer
      topic_code: "7.2"
      source: "AP Calculus CED, Topic 7.2"
      points: 3
      prompt: |
        Consider the differential equation x · dy/dx + y = 4x for x > 0.

        (a) Show that y = 2x + C/x is a solution for every constant C.
        (b) Find the particular solution with y(1) = 5.
        (c) Explain why the particular solution in (b) is a solution only on an interval that excludes x = 0.
      answer: |
        (a) dy/dx = 2 − C/x². Then x · dy/dx + y = (2x − C/x) + (2x + C/x) = 4x, the right side, for every x ≠ 0 and every C.
        (b) y(1) = 2 + C = 5, so C = 3 and y = 2x + 3/x.
        (c) 3/x is undefined at x = 0, so the function and its derivative do not exist there. A solution must be differentiable on an interval, so this one lives on x > 0, the interval containing the initial point x = 1.
      explanation: |
        Three points, one per part. (a) the correct derivative and a substitution that simplifies to 4x (a check at one value of x does not earn the point). (b) C = 3 and y = 2x + 3/x. (c) the reason (3/x, or the derivative, undefined at 0) and the interval x > 0 containing x = 1.
    - slug: apcalcab-u07-w27-q23
      type: short_answer
      topic_code: "4.6"
      source: "AP Calculus CED, Topic 4.6"
      points: 3
      prompt: |
        The function y = f(x) is the solution of dy/dx = 2x + y with f(0) = 3.

        (a) Write an equation of the line tangent to the graph of f at x = 0.
        (b) Use the tangent line to approximate f(0.1).
        (c) Find d²y/dx² in terms of x and y, and use it to decide whether the approximation in (b) is an overestimate or an underestimate. Justify.
      answer: |
        (a) At (0, 3), dy/dx = 2(0) + 3 = 3, so the tangent line is y = 3 + 3x.
        (b) f(0.1) ≈ 3 + 3(0.1) = 3.3.
        (c) d²y/dx² = 2 + dy/dx = 2 + 2x + y. At (0, 3) this is 2 + 0 + 3 = 5 > 0, so the graph of f is concave up near x = 0 and lies above its tangent line there. The approximation 3.3 is an underestimate.
      explanation: |
        Three points, one per part. (a) slope 3 and the line y = 3 + 3x (any equivalent form). (b) 3.3. (c) the second derivative 2 + 2x + y, its positive value at (0, 3), and the conclusion "underestimate" linked to concave up.
    # ---- Long answer
    - slug: apcalcab-u07-w27-q24
      type: long_answer
      topic_code: "7.1"
      source: "AP Calculus CED, Topic 7.1"
      points: 6
      prompt: |
        A hypothetical intravenous drip delivers a medicine into a patient's bloodstream at a constant 4 milligrams per hour, and the body removes the medicine at a rate proportional to the amount present. The amount M, in milligrams, of medicine in the bloodstream t hours after the drip starts satisfies

        dM/dt = 4 − 0.5M, with M(0) = 0.

        (A) Explain what the terms 4 and −0.5M represent in this context.

        (B) Complete a table of slopes for the slope field at the points with t = 0, 1, 2 and M = 0, 4, 8, 12. Explain why every column of the table is the same.

        (C) Describe the slope field in words: where the segments are horizontal, where they are positive, and where they are negative. What does this suggest about M in the long run?

        (D) Verify that M(t) = 8 − 8e^(−0.5t) is the solution with M(0) = 0.
      answer: |
        (A) 4 is the rate, in mg per hour, at which the drip adds medicine. −0.5M is the rate at which the body removes medicine: 0.5M mg per hour, proportional to the amount present (the minus sign means removal).
        (B) The slope is 4 − 0.5M: M = 0 gives 4, M = 4 gives 2, M = 8 gives 0, M = 12 gives −2, for each of t = 0, 1, 2. The columns match because dM/dt does not depend on t.

        | | t = 0 | t = 1 | t = 2 |
        |---|---|---|---|
        | M = 12 | −2 | −2 | −2 |
        | M = 8 | 0 | 0 | 0 |
        | M = 4 | 2 | 2 | 2 |
        | M = 0 | 4 | 4 | 4 |

        (C) Horizontal along M = 8; positive (rising) for M < 8 and negative (falling) for M > 8, flatter the closer M is to 8. Solutions are pushed toward 8 from both sides, so the amount should approach 8 mg in the long run.
        (D) dM/dt = −8e^(−0.5t) · (−0.5) = 4e^(−0.5t). And 4 − 0.5M = 4 − 4 + 4e^(−0.5t) = 4e^(−0.5t). Both sides agree, and M(0) = 8 − 8 = 0.
      explanation: |
        Six points. (A) 1 point for interpreting both terms (constant input rate; removal proportional to amount), with units or context. (B) 2 points: 1 for the four correct slope values 4, 2, 0, −2; 1 for explaining that the slope does not depend on t. (C) 1 point for horizontal at M = 8, positive below and negative above, with the long-run conclusion M → 8. (D) 2 points: 1 for the derivative 4e^(−0.5t) and substitution showing both sides agree; 1 for checking M(0) = 0.
