      prompt: |
        True or false: The differential equation dy/dx = x + y can be separated as dy/y = x dx.
      answer: false
      explanation: |
        False. Dividing x + y by y gives x/y + 1, not x. The right side x + y is a sum and cannot be written as g(x) · h(y), so the equation is not separable at all.
