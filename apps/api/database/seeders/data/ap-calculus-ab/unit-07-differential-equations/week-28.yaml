    # ---- Short answer
    - slug: apcalcab-u07-w28-q23
      type: short_answer
      topic_code: "7.7"
      source: "AP Calculus CED, Topic 7.7"
      points: 3
      prompt: |
        Find the particular solution y = f(x) of dy/dx = x(1 + y²) with f(0) = 1, and state the interval on which it is defined.
      answer: |
        Separate: dy/(1 + y²) = x dx. Integrate: arctan y = x²/2 + C. At (0, 1): arctan 1 = π/4 = C. So arctan y = x²/2 + π/4 and y = tan(x²/2 + π/4).
        Domain: arctan y lies strictly between −π/2 and π/2, so we need x²/2 + π/4 < π/2, i.e. x² < π/2. The solution is defined for −√(π/2) < x < √(π/2) (about −1.253 < x < 1.253).
      explanation: |
        Three points. 1 point for the correct separation and both antiderivatives (arctan y and x²/2) with a constant of integration. 1 point for using the initial condition to get C = π/4 and solving y = tan(x²/2 + π/4). 1 point for the interval |x| < √(π/2), with a reason (tangent's argument must stay below π/2). A solution with no constant of integration earns at most the first point's antiderivatives.
    - slug: apcalcab-u07-w28-q24
      type: short_answer
      topic_code: "6.4"
      source: "AP Calculus CED, Topic 6.4"
      points: 3
      prompt: |
        Let y = 3 + ∫ from 2 to x of e^(−t²) dt.

        (a) Find dy/dx.
        (b) Show that y satisfies the initial condition y(2) = 3.
        (c) Without evaluating any integral, explain why y(5) > 3.
      answer: |
        (a) By the Fundamental Theorem of Calculus, dy/dx = e^(−x²). So y solves the differential equation dy/dx = e^(−x²).
        (b) y(2) = 3 + ∫ from 2 to 2 of e^(−t²) dt = 3 + 0 = 3.
        (c) dy/dx = e^(−x²) > 0 for every x, so y is increasing; since 5 > 2, y(5) > y(2) = 3. (Equivalently, the integral from 2 to 5 of a positive function is positive.)
      explanation: |
        Three points, one per part. (a) e^(−x²), citing or clearly using the Fundamental Theorem. (b) an integral with equal limits is 0. (c) a reason based on the positive integrand or y increasing, linked to 5 > 2.
    # ---- Long answer
    - slug: apcalcab-u07-w28-q25
      type: long_answer
      topic_code: "7.7"
      source: "AP Calculus CED, Topic 7.7"
      points: 9
      prompt: |
        Consider the differential equation dy/dx = (2x + 1)y². Let y = f(x) be the particular solution with f(0) = 1.

        (A) Find the slope dy/dx at each of the points (−1, 1), (0, 1), (1, 1), (−1, −1), (0, −1) and (1, −1), and describe where the segments of the slope field are horizontal.

        (B) Find d²y/dx² in terms of x and y. Is the graph of f concave up or concave down at the point (0, 1)? Justify your answer.

        (C) Write an equation of the line tangent to the graph of f at x = 0, and use it to approximate f(0.1). Is the approximation an overestimate or an underestimate? Explain.

        (D) Use separation of variables to find y = f(x), and state the interval on which it is defined.
      answer: |
        (A) The slopes are (2x + 1)y²: at x = −1, −1; at x = 0, 1; at x = 1, 3; the same for y = 1 and y = −1 because y² is the same. The segments are horizontal along the x-axis (y = 0) and along the line x = −1/2.
        (B) d²y/dx² = 2y² + (2x + 1) · 2y · dy/dx = 2y² + 2y(2x + 1)²y² = 2y² + 2(2x + 1)²y³. At (0, 1): 2 + 2 · 1 · 1 = 4 > 0, so the graph of f is concave up at (0, 1).
        (C) dy/dx at (0, 1) is 1, so the tangent line is y = 1 + x and f(0.1) ≈ 1.1. Since f is concave up near x = 0, its graph lies above the tangent line, so 1.1 is an underestimate.
        (D) dy/y² = (2x + 1) dx. Integrating: −1/y = x² + x + C. At (0, 1): −1 = C. So −1/y = x² + x − 1 and y = 1/(1 − x − x²).
        The denominator is 0 at x = (−1 ± √5)/2. The solution is defined on the interval containing x = 0 between those zeros: (−1 − √5)/2 < x < (−1 + √5)/2, about −1.618 < x < 0.618.
      explanation: |
        Nine points.
        (A) 1 point: all six slopes (−1, 1, 3, −1, 1, 3) with horizontal segments along y = 0 and x = −1/2.
        (B) 2 points: 1 for a correct d²y/dx² (implicit differentiation with dy/dx substituted or left as dy/dx and then evaluated); 1 for the value 4 at (0, 1) and "concave up" with that justification.
        (C) 1 point: the tangent line y = 1 + x, the approximation 1.1 and "underestimate" because f is concave up.
        (D) 5 points: 1 for separating the variables; 1 for the antiderivatives −1/y and x² + x; 1 for the constant of integration and using f(0) = 1 to get C = −1; 1 for solving y = 1/(1 − x − x²); 1 for the interval (−1 − √5)/2 < x < (−1 + √5)/2. A response with no constant of integration earns at most 2 of the 5 points in (D), and a response that does not separate earns none.
