      option_explanations:
        - |
          Correct. y′ = ky₀e^(kt), negative since k < 0 and y₀e^(kt) > 0.
        - |
          The half-life is ln 2/|k|, the same whatever the starting amount.
        - |
          Correct. y″ = k²y₀e^(kt), positive because k² > 0 and y₀e^(kt) > 0.
        - |
          Correct. With k < 0, e^(kt) → 0 as t → ∞.
        - |
          e^(kt) is never 0, so y is positive for every t; it only approaches 0. The formula −y₀/k is what a linear model would give.
