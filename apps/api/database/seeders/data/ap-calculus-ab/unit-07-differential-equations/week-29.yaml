    # ---- True/false
    - slug: apcalcab-u07-w29-q17
      type: true_false
      topic_code: "7.8"
      source: "AP Calculus CED, Topic 7.8"
      points: 1
      prompt: |
        True or false: If y grows according to dy/dt = ky with k > 0, the time it takes y to grow from 100 to 200 equals the time it takes to grow from 500 to 1,000.
      answer: true
      explanation: |
        True. Both are doublings. From y₀e^(kt) = 2y₀ the time is ln 2/k whatever y₀ is, so every doubling takes the same time.
    - slug: apcalcab-u07-w29-q18
