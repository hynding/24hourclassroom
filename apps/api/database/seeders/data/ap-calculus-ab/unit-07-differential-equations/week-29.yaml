    # ---- Fill-in
    - slug: apcalcab-u07-w29-q19
      type: fill_blank
      topic_code: "7.8"
      source: "AP Calculus CED, Topic 7.8"
      points: 1
      prompt: |
        A quantity satisfies dy/dt = ky with y(0) = 50 and y(2) = 200. Then y(4) = ____.
      answer: ["800", "800.0"]
      explanation: |
        e^(2k) = 200/50 = 4, so y(4) = 50e^(4k) = 50(e^(2k))² = 50 · 16 = 800. Over equal time intervals an exponential multiplies by the same factor.
    - slug: apcalcab-u07-w29-q20
