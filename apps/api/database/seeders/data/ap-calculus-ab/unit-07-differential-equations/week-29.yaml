    # ---- Numeric
    - slug: apcalcab-u07-w29-q21
      type: numeric
      topic_code: "7.8"
      source: "AP Calculus CED, Topic 7.8"
      points: 1
      prompt: |
        (Calculator.) A hypothetical yeast culture starts with 400 cells and grows according to dN/dt = kN, tripling every 6 hours. After how many hours will there be 5,000 cells? Give your answer to three decimal places.
      answer: { value: 13.794, tolerance: 0.001 }
      explanation: |
        k = ln 3 / 6. Solve 400e^(kt) = 5000: e^(kt) = 12.5, so t = ln 12.5 / k = 6 ln 12.5 / ln 3 ≈ 13.794 hours.
    - slug: apcalcab-u07-w29-q22
      type: numeric
      topic_code: "7.8"
      source: "AP Calculus CED, Topic 7.8"
      points: 1
      prompt: |
        (Calculator.) A hypothetical mug of coffee at 85 °C is placed in a room at 22 °C. Its temperature satisfies dT/dt = −k(T − 22), and after 5 minutes it is 70 °C. What is its temperature after 15 minutes, in °C? Give your answer to three decimal places.
      answer: { value: 49.864, tolerance: 0.001 }
      explanation: |
        T = 22 + 63e^(−kt). At t = 5: 70 = 22 + 63e^(−5k), so e^(−5k) = 48/63. Then T(15) = 22 + 63(e^(−5k))³ = 22 + 63(48/63)³ ≈ 49.864 °C.
    # ---- Short answer
    - slug: apcalcab-u07-w29-q23
      type: short_answer
      topic_code: "7.8"
      source: "AP Calculus CED, Topic 7.8"
      points: 3
      prompt: |
        (Calculator.) The amount A, in milligrams, of a hypothetical medicine in a patient's body decreases at a rate proportional to the amount present. There are 120 mg at t = 0 and 90 mg at t = 2 hours.

        (a) Write a differential equation for A, using a constant k > 0.
        (b) Find A(t).
        (c) When will 30 mg remain? Give your answer to three decimal places.
      answer: |
        (a) dA/dt = −kA.
        (b) A = 120e^(−kt). At t = 2: 90 = 120e^(−2k), so e^(−2k) = 3/4 and k = ln(4/3)/2 ≈ 0.1438. So A(t) = 120e^(−(ln(4/3)/2)t) = 120(3/4)^(t/2).
        (c) 120(3/4)^(t/2) = 30 gives (3/4)^(t/2) = 1/4, so t = 2 ln 4 / ln(4/3) ≈ 9.638 hours. (Or: 30 mg is a quarter of 120 mg.)
      explanation: |
        Three points, one per part. (a) dA/dt = −kA (or kA with k stated negative). (b) the value of k from the data, exact or to three decimals, and a correct formula for A. (c) t ≈ 9.638 hours, with the equation that produced it.
    - slug: apcalcab-u07-w29-q24
      type: short_answer
      topic_code: "5.4"
      source: "AP Calculus CED, Topic 5.4"
      points: 3
      prompt: |
        Consider the differential equation dy/dx = (x − 3)y.

        (a) For a solution with y > 0, on which intervals is the solution increasing, and on which decreasing? Explain.
        (b) Show that such a solution has a relative minimum at x = 3, justifying with the first derivative test.
        (c) What happens at x = 3 instead for the solution through the point (3, −2)? Justify.
      answer: |
        (a) With y > 0, dy/dx has the same sign as x − 3: negative for x < 3 and positive for x > 3. The solution is decreasing on x < 3 and increasing on x > 3.
        (b) dy/dx = 0 at x = 3 and dy/dx changes from negative to positive there, so the solution has a relative minimum at x = 3.
        (c) Now y < 0 (a solution through a point below the equilibrium y = 0 stays below it), so dy/dx has the opposite sign to x − 3: positive for x < 3 and negative for x > 3. dy/dx changes from positive to negative at x = 3, so this solution has a relative maximum there.
      explanation: |
        Three points, one per part. (a) both intervals, with the sign of dy/dx explained by the sign of x − 3 when y > 0. (b) dy/dx = 0 at x = 3 and the sign change negative to positive named as the reason. (c) relative maximum, justified by the reversed sign change because y < 0.
    # ---- Long answer
    - slug: apcalcab-u07-w29-q25
      type: long_answer
      topic_code: "7.8"
      source: "AP Calculus CED, Topic 7.8"
      points: 8
      prompt: |
        A hypothetical pie is taken out of an oven at 190 °C and left to cool in a kitchen kept at 25 °C. Its temperature T, in °C, t minutes later satisfies

        dT/dt = −k(T − 25), with T(0) = 190, where k is a positive constant.

        (A) Use separation of variables to find T(t) in terms of k. Explain how you handle the absolute value.

        (B) After 10 minutes the pie is at 130 °C. Find the exact value of k.

        (C) (Calculator.) The pie can be served when it reaches 50 °C. How many minutes after it leaves the oven is that? Give your answer to three decimal places.

        (D) Find dT/dt at t = 10, using correct units, and interpret it.

        (E) Find d²T/dt² in terms of T and decide whether the graph of T is concave up or concave down. What does this say about how the pie cools?
      answer: |
        (A) dT/(T − 25) = −k dt, so ln|T − 25| = −kt + C. The pie starts above 25 °C and a solution cannot cross the equilibrium T = 25, so T − 25 > 0 and |T − 25| = T − 25. Then T − 25 = e^C e^(−kt); at t = 0, 165 = e^C. So T(t) = 25 + 165e^(−kt).
        (B) 130 = 25 + 165e^(−10k), so e^(−10k) = 105/165 = 7/11 and k = (1/10) ln(11/7) ≈ 0.0452 per minute.
        (C) 25 + 165e^(−kt) = 50 gives e^(−kt) = 25/165 = 5/33, so t = ln(33/5)/k = 10 ln(6.6)/ln(11/7) ≈ 41.751 minutes.
        (D) dT/dt = −k(130 − 25) = −105k ≈ −4.746 °C per minute. Ten minutes after leaving the oven, the pie's temperature is falling at about 4.746 °C per minute.
        (E) d²T/dt² = −k · dT/dt = k²(T − 25), which is positive since T > 25. The graph is concave up: the temperature keeps falling, but more and more slowly as the pie approaches room temperature.
      explanation: |
        Eight points.
        (A) 4 points: 1 for separating the variables; 1 for the antiderivatives ln|T − 25| and −kt with a constant of integration; 1 for using T(0) = 190 to find the constant (e^C = 165, or equivalent); 1 for T = 25 + 165e^(−kt) with the absolute value justified by T > 25. No constant of integration: at most 2 of these 4 points.
        (B) 1 point: k = (1/10) ln(11/7) or an equivalent exact form.
        (C) 1 point: about 41.751 minutes (accept 41.750 to 41.752).
        (D) 1 point: about −4.746 °C per minute with an interpretation that says the temperature is decreasing at that rate at t = 10.
        (E) 1 point: d²T/dt² = k²(T − 25) > 0, concave up, with the interpretation that the cooling slows down.
