  - slug: apcalcab-u07-exam-q41
    type: short_answer
    topic_code: "7.7"
    source: "AP Calculus CED, Topic 7.7"
    points: 3
    prompt: |
      Find the particular solution y = f(x) of dy/dx = y² sin x with f(0) = 1/3, and state the interval on which it is defined.
    answer: |
      Separate: dy/y² = sin x dx. Integrate: −1/y = −cos x + C. At (0, 1/3): −3 = −1 + C, so C = −2. Then −1/y = −cos x − 2, so 1/y = cos x + 2 and y = 1/(cos x + 2).
      Since cos x + 2 ≥ 1 > 0 for every x, the solution is defined for all real numbers.
    explanation: |
      Three points. 1 point for separating and both antiderivatives (−1/y and −cos x) with a constant of integration. 1 point for using f(0) = 1/3 to get C = −2. 1 point for y = 1/(cos x + 2) and the domain all real numbers with a reason. No constant of integration: at most 1 point.
  - slug: apcalcab-u07-exam-q42
    type: short_answer
    topic_code: "7.2"
    source: "AP Calculus CED, Topic 7.2"
    points: 3
    prompt: |
      Consider the differential equation dy/dx = 1 − y.

      (a) Verify that y = 1 + Ce^(−x) is a solution for every constant C.
      (b) Find the particular solution whose graph passes through (0, −2).
      (c) Describe the behaviour of the solution in (b) as x increases, and give lim (x→∞) y. Use the differential equation to explain why it is increasing.
    answer: |
      (a) dy/dx = −Ce^(−x), and 1 − y = 1 − 1 − Ce^(−x) = −Ce^(−x). Both sides agree for every x and every C.
      (b) −2 = 1 + C, so C = −3 and y = 1 − 3e^(−x).
      (c) The solution stays below 1, where dy/dx = 1 − y > 0, so it is increasing; it rises toward the equilibrium y = 1 and lim (x→∞) y = 1 (since e^(−x) → 0).
    explanation: |
      Three points, one per part. (a) the derivative and a substitution showing both sides equal −Ce^(−x). (b) C = −3 and y = 1 − 3e^(−x). (c) increasing because 1 − y > 0 for y < 1, with limit 1.
  # ---- Free response 1 (calculator-active context)
  - slug: apcalcab-u07-exam-q43
    type: long_answer
    topic_code: "7.8"
    source: "AP Calculus CED, Topic 7.8"
    points: 9
    prompt: |
      (Calculator.) A treatment plant removes a dissolved mineral from a hypothetical reservoir. The mass M of mineral in the reservoir, in kilograms, t weeks after treatment begins satisfies

      dM/dt = −0.15(M − 200), with M(0) = 600.

      (A) Is M increasing or decreasing at t = 0? Find dM/dt at t = 0, using correct units.

      (B) Use separation of variables to find M(t). Explain how you handle the absolute value.

      (C) The reservoir is considered safe when M is 300 kg. How many weeks after treatment begins does this happen? Give your answer to three decimal places.

      (D) Find d²M/dt² in terms of M. Is the graph of M concave up or concave down? Explain what this means in context.

      (E) Find lim (t→∞) M(t) and interpret it in context.
    answer: |
      (A) dM/dt = −0.15(600 − 200) = −60 kg per week, so M is decreasing at t = 0.
      (B) dM/(M − 200) = −0.15 dt, so ln|M − 200| = −0.15t + C. M starts above 200 and cannot cross the equilibrium M = 200, so M − 200 > 0 and |M − 200| = M − 200. Then M − 200 = e^C e^(−0.15t); at t = 0, e^C = 400. So M(t) = 200 + 400e^(−0.15t).
      (C) 200 + 400e^(−0.15t) = 300 gives e^(−0.15t) = 1/4, so t = ln 4 / 0.15 ≈ 9.242 weeks.
      (D) d²M/dt² = −0.15 · dM/dt = 0.0225(M − 200), which is positive since M > 200. The graph is concave up: the mineral is removed quickly at first and then more and more slowly.
      (E) lim (t→∞) M(t) = 200 kg. In the long run the treatment brings the mass down toward 200 kg but no lower; the reservoir keeps about 200 kg of the mineral.
    explanation: |
      Nine points.
      (A) 1 point: −60 kg per week (units required) and "decreasing".
      (B) 4 points: 1 for separating the variables; 1 for the antiderivatives ln|M − 200| and −0.15t with a constant of integration; 1 for using M(0) = 600 to find the constant (400, or C = ln 400); 1 for M = 200 + 400e^(−0.15t) with the absolute value handled (M > 200). No constant of integration: at most 2 of these 4 points. No separation: 0 of 4.
      (C) 2 points: 1 for setting M(t) = 300 (or e^(−0.15t) = 1/4); 1 for t ≈ 9.242 weeks (accept 9.241 to 9.243).
      (D) 1 point: d²M/dt² = 0.0225(M − 200) > 0, concave up, with the interpretation that removal slows down.
      (E) 1 point: 200 kg with an interpretation in context.
  # ---- Free response 2 (no calculator, analytical)
  - slug: apcalcab-u07-exam-q44
    type: long_answer
    topic_code: "7.7"
    source: "AP Calculus CED, Topic 7.7"
    points: 9
    prompt: |
      Consider the differential equation dy/dx = x²(y − 2)². Let y = f(x) be the particular solution with f(1) = 3. No calculator is allowed.

      (A) Find dy/dx at each of the points (−1, 3), (0, 3), (1, 3), (1, 2), (−1, 1) and (2, 4). Describe where the segments of the slope field are horizontal, and explain why no segment has negative slope.

      (B) Write an equation of the line tangent to the graph of f at x = 1, and use it to approximate f(1.1).

      (C) Find d²y/dx² in terms of x, y and dy/dx. Use it to decide whether the approximation in (B) is an overestimate or an underestimate. Justify your answer.

      (D) Use separation of variables to find y = f(x), and state the interval on which it is defined.
    answer: |
      (A) Slopes: (−1, 3): 1 · 1 = 1; (0, 3): 0; (1, 3): 1; (1, 2): 0; (−1, 1): 1 · 1 = 1; (2, 4): 4 · 4 = 16. The segments are horizontal along the y-axis (x = 0) and along the line y = 2. Both factors x² and (y − 2)² are squares, so dy/dx ≥ 0 everywhere: no slope is negative.
      (B) At (1, 3) the slope is 1, so the tangent line is y = 3 + (x − 1), and f(1.1) ≈ 3.1.
      (C) d²y/dx² = 2x(y − 2)² + x² · 2(y − 2) · dy/dx. At (1, 3), with dy/dx = 1: 2 · 1 · 1 + 1 · 2 · 1 · 1 = 4 > 0. The graph of f is concave up near x = 1, so it lies above the tangent line and 3.1 is an underestimate.
      (D) dy/(y − 2)² = x² dx. Integrating: −1/(y − 2) = x³/3 + C. At (1, 3): −1 = 1/3 + C, so C = −4/3. Then −1/(y − 2) = (x³ − 4)/3, so y − 2 = 3/(4 − x³) and y = 2 + 3/(4 − x³).
      The formula breaks down where x³ = 4, at x = ∛4 ≈ 1.587. The interval containing x = 1 is x < ∛4, so f is defined for −∞ < x < ∛4.
    explanation: |
      Nine points.
      (A) 2 points: 1 for all six slopes (1, 0, 1, 0, 1, 16); 1 for horizontal along x = 0 and y = 2 together with the reason no slope is negative (product of squares).
      (B) 1 point: y = 3 + (x − 1) and f(1.1) ≈ 3.1.
      (C) 2 points: 1 for a correct d²y/dx² (product rule and chain rule on (y − 2)²); 1 for the value 4 > 0 at (1, 3) and "underestimate" because the graph is concave up.
      (D) 4 points: 1 for separating the variables; 1 for the antiderivatives −1/(y − 2) and x³/3 with a constant of integration; 1 for using f(1) = 3 to get C = −4/3 and solving y = 2 + 3/(4 − x³); 1 for the interval x < ∛4. No constant of integration: at most 2 of these 4 points.
