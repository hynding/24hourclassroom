unit: 7
description: |
  44 questions · about 90 minutes · every topic of Unit 7 (7.1 to 7.8, AB topics only): writing differential
  equations from words, verifying solutions, slope fields as tables and descriptions, reasoning about solution
  curves, separation of variables with general and particular solutions and their domains, and exponential
  models including Newton's law of cooling. Includes three shared-context sets of three or four questions (a
  separable equation, a hypothetical bacteria culture, and a table of slopes), select-all, true/false,
  fill-in-the-blank and numeric items, two short-answer questions (3 points each) and two free-response questions
  in the AP style (9 points each: one calculator-active context, one no-calculator analytical question). Items
  marked (Calculator.) need a graphing calculator; the rest are meant to be done by hand. Multiple choice,
  select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically;
  the short answers and free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: dy/dx = (4 − y)(x + 1) (7.3, 7.4, 7.6, 7.7)
  - slug: apcalcab-u07-exam-q01
    type: multiple_choice
    topic_code: "7.3"
    source: "AP Calculus CED, Topic 7.3"
    points: 1
    stimulus: |
      Consider the differential equation dy/dx = (4 − y)(x + 1).
    prompt: |
      What is the slope of the slope-field segment at the point (1, 6)?
    options:
      - "4"
      - "−2"
      - "−4"
      - "20"
    option_explanations:
      - |
        This uses y − 4 instead of 4 − y. With y = 6, 4 − y = −2 is negative, so the slope is negative.
      - |
        This drops the +1: (4 − 6)(1) = −2. The second factor is x + 1 = 2.
      - |
        Correct. Substitute x = 1 and y = 6: (4 − 6)(1 + 1) = (−2)(2) = −4.
      - |
        This computes (4 + 6)(1 + 1), a sign slip in the first factor. The factor is 4 − y = −2.
    answer: 2
  - slug: apcalcab-u07-exam-q02
    type: multiple_choice
    topic_code: "7.4"
    source: "AP Calculus CED, Topic 7.4"
    points: 1
    stimulus: |
      Consider the differential equation dy/dx = (4 − y)(x + 1).
    prompt: |
      Let y = f(x) be the solution with f(0) = 1. What is lim (x→∞) f(x)?
    options:
      - "4"
      - "1"
      - "∞"
      - "0"
    option_explanations:
      - |
        Correct. For x > −1 and y < 4 the slopes are positive, and they flatten toward 0 as y nears the equilibrium y = 4, which the solution cannot cross. (The solution is 4 − 3e^(−(x²/2 + x)), which tends to 4.)
      - |
        1 is the starting value. At (0, 1) the slope is (3)(1) = 3, so the solution rises immediately.
      - |
        The solution cannot cross the equilibrium line y = 4, so it cannot grow without bound.
      - |
        For x > −1 and y < 4 the slopes are positive, so the solution increases from 1; it does not fall to 0.
    answer: 0
  - slug: apcalcab-u07-exam-q03
    type: multiple_choice
    topic_code: "7.6"
    source: "AP Calculus CED, Topic 7.6"
    points: 1
    stimulus: |
      Consider the differential equation dy/dx = (4 − y)(x + 1).
    prompt: |
      Which is the general solution, where A is an arbitrary constant?
    options:
      - "y = 4 + Ae^(x²/2 + x)"
      - "y = 4 + Ae^(−(x²/2 + x))"
      - "y = 4 + e^(−(x²/2 + x)) + A"
      - "y = Ae^(−(x²/2 + x))"
    option_explanations:
      - |
        This misses the minus sign in ∫ dy/(4 − y) = −ln|4 − y|. The resulting functions move away from y = 4, but the slope field pushes solutions toward it for x > −1.
      - |
        Correct. dy/(4 − y) = (x + 1) dx gives −ln|4 − y| = x²/2 + x + C, so |4 − y| = e^(−C)e^(−(x²/2 + x)) and y = 4 + Ae^(−(x²/2 + x)) with A any real number.
      - |
        The constant is added after exponentiating. e^(−(x²/2 + x) + C) is a product e^C · e^(−(x²/2 + x)), not a sum.
      - |
        This drops the 4. Its derivative is −(x + 1)y, which equals (4 − y)(x + 1) only if 4 = 0.
    answer: 1
  - slug: apcalcab-u07-exam-q04
    type: multiple_choice
    topic_code: "7.7"
    source: "AP Calculus CED, Topic 7.7"
    points: 1
    stimulus: |
      Consider the differential equation dy/dx = (4 − y)(x + 1).
    prompt: |
      Which is the particular solution with y(0) = 1?
    options:
      - "y = 4 + 3e^(−(x²/2 + x))"
      - "y = 1 + 3e^(−(x²/2 + x))"
      - "y = 4 − e^(−(x²/2 + x))"
      - "y = 4 − 3e^(−(x²/2 + x))"
    option_explanations:
      - |
        This forces the constant to be positive. At x = 0 it gives 4 + 3 = 7, not 1: the constant must be negative because the solution starts below 4.
      - |
        This swaps the roles of the equilibrium value and the initial value. At x = 0 it gives 4, and its derivative does not match (4 − y)(x + 1).
      - |
        This takes A = −1, perhaps from y(0) = 1 with the sign flipped. At x = 0 it gives 3, not 1.
      - |
        Correct. y = 4 + Ae^(−(x²/2 + x)) with 1 = 4 + A gives A = −3. Check: y′ = −3e^(−(x²/2 + x)) · (−(x + 1)) = 3(x + 1)e^(−(x²/2 + x)) = (x + 1)(4 − y).
    answer: 3
  # ---- Stimulus set B: a hypothetical bacteria culture (7.8)
  - slug: apcalcab-u07-exam-q05
    type: multiple_choice
    topic_code: "7.8"
    source: "AP Calculus CED, Topic 7.8"
    points: 1
    stimulus: |
      The number of bacteria N in a hypothetical laboratory culture grows at a rate proportional to N. There are 2,000 bacteria at t = 0 and 5,000 bacteria at t = 3, where t is measured in hours.
    prompt: |
      What is the constant k in dN/dt = kN?
    options:
      - "2.5/3"
      - "ln(3000)/3"
      - "ln(2.5)/3"
      - "ln(5000)/3"
    option_explanations:
      - |
        This skips the logarithm: e^(3k) = 2.5 needs ln 2.5.
      - |
        This uses the difference 5000 − 2000. Exponential models depend on the ratio 5000/2000 = 2.5.
      - |
        Correct. 2000e^(3k) = 5000 gives e^(3k) = 2.5 and k = ln(2.5)/3 ≈ 0.305 per hour.
      - |
        This takes ln 5000 without first dividing by the initial 2000.
    answer: 2
  - slug: apcalcab-u07-exam-q06
    type: multiple_choice
    topic_code: "7.8"
    source: "AP Calculus CED, Topic 7.8"
    points: 1
    stimulus: |
      The number of bacteria N in a hypothetical laboratory culture grows at a rate proportional to N. There are 2,000 bacteria at t = 0 and 5,000 bacteria at t = 3, where t is measured in hours.
    prompt: |
      How many bacteria does the model predict at t = 6?
    options:
      - "12,500"
      - "8,000"
      - "10,000"
      - "31,250"
    option_explanations:
      - |
        Correct. Every 3 hours the count is multiplied by 2.5, so N(6) = 2000 · 2.5² = 12,500.
      - |
        This adds 3,000 every 3 hours, a linear model. Exponential growth multiplies by the same factor each 3 hours.
      - |
        This doubles 5,000. The 3-hour factor is 2.5, not 2.
      - |
        This applies the factor 2.5 twice starting from 5,000 rather than from 2,000 (that would be t = 9).
    answer: 0
  - slug: apcalcab-u07-exam-q07
    type: numeric
    topic_code: "7.8"
    source: "AP Calculus CED, Topic 7.8"
    points: 1
    stimulus: |
      The number of bacteria N in a hypothetical laboratory culture grows at a rate proportional to N. There are 2,000 bacteria at t = 0 and 5,000 bacteria at t = 3, where t is measured in hours.
    prompt: |
      (Calculator.) At what time t will the culture contain 20,000 bacteria? Give your answer to three decimal places.
    answer: { value: 7.539, tolerance: 0.001 }
    explanation: |
      N = 2000e^(kt) with k = ln(2.5)/3. 2000e^(kt) = 20000 gives e^(kt) = 10, so t = ln 10 / k = 3 ln 10 / ln 2.5 ≈ 7.539 hours.
  # ---- Stimulus set C: a table of slopes (7.3, 7.2, 7.4)
  - slug: apcalcab-u07-exam-q08
    type: multiple_choice
    topic_code: "7.3"
    source: "AP Calculus CED, Topic 7.3"
    points: 1
    stimulus: |
      The table gives the slopes of a slope field at sixteen grid points (rows are y-values, columns are x-values).

      | | x = −1 | x = 0 | x = 1 | x = 2 |
      |---|---|---|---|---|
      | y = 2 | −4 | −2 | 0 | 2 |
      | y = 1 | −3 | −1 | 1 | 3 |
      | y = 0 | −2 | 0 | 2 | 4 |
      | y = −1 | −1 | 1 | 3 | 5 |
    prompt: |
      Which differential equation could this slope field represent?
    options:
      - "dy/dx = y − 2x"
      - "dy/dx = x − 2y"
      - "dy/dx = 2x + y"
      - "dy/dx = 2x − y"
    option_explanations:
      - |
        Every sign is reversed: at (2, −1) this gives −5, but the table shows 5.
      - |
        At (1, 0) this gives 1, but the table shows 2. The coefficient 2 belongs on x.
      - |
        At (0, 2) this gives 2, but the table shows −2: y must be subtracted.
      - |
        Correct. Each entry equals 2x − y: (−1, 2) gives −4, (2, −1) gives 5, (0, 0) gives 0, and the slopes are 0 along y = 2x.
    answer: 3
  - slug: apcalcab-u07-exam-q09
    type: multiple_choice
    topic_code: "7.2"
    source: "AP Calculus CED, Topic 7.2"
    points: 1
    stimulus: |
      The table gives the slopes of a slope field at sixteen grid points (rows are y-values, columns are x-values).

      | | x = −1 | x = 0 | x = 1 | x = 2 |
      |---|---|---|---|---|
      | y = 2 | −4 | −2 | 0 | 2 |
      | y = 1 | −3 | −1 | 1 | 3 |
      | y = 0 | −2 | 0 | 2 | 4 |
      | y = −1 | −1 | 1 | 3 | 5 |
    prompt: |
      Which straight line is a solution curve of the differential equation shown in the table?
    options:
      - "y = 2x"
      - "y = 2x − 2"
      - "y = 2x + 2"
      - "y = x − 2"
    option_explanations:
      - |
        Along y = 2x every slope is 2x − 2x = 0, but the line itself has slope 2, so the segments are not tangent to it.
      - |
        Correct. Along y = 2x − 2 every slope is 2x − (2x − 2) = 2, which equals the line's own slope. In the table, (1, 0) and (2, 2) lie on it and both show slope 2.
      - |
        Along y = 2x + 2 every slope is 2x − (2x + 2) = −2, but the line has slope 2.
      - |
        Along y = x − 2 the slope is 2x − (x − 2) = x + 2, which changes with x, so it cannot match the constant slope 1 of the line.
    answer: 1
  - slug: apcalcab-u07-exam-q10
    type: multiple_choice
    topic_code: "7.4"
    source: "AP Calculus CED, Topic 7.4"
    points: 1
    stimulus: |
      The table gives the slopes of a slope field at sixteen grid points (rows are y-values, columns are x-values).

      | | x = −1 | x = 0 | x = 1 | x = 2 |
      |---|---|---|---|---|
      | y = 2 | −4 | −2 | 0 | 2 |
      | y = 1 | −3 | −1 | 1 | 3 |
      | y = 0 | −2 | 0 | 2 | 4 |
      | y = −1 | −1 | 1 | 3 | 5 |
    prompt: |
      What happens at the origin on the solution curve that passes through (0, 0)?
    options:
      - "It has a relative minimum."
      - "It has a relative maximum."
      - "It has a point of inflection."
      - "It is increasing through the origin."
    option_explanations:
      - |
        Correct. dy/dx = 2(0) − 0 = 0 there, and d²y/dx² = 2 − dy/dx = 2 − 0 = 2 > 0. By the second derivative test, a relative minimum.
      - |
        The second derivative 2 − dy/dx is +2 at the origin, which signals a minimum, not a maximum.
      - |
        d²y/dx² = 2 ≠ 0 at the origin, so concavity does not change there.
      - |
        The slope at the origin is 0 (the table shows 0 at (0, 0)), and it is a turning point, not a rising one.
    answer: 0
  # ---- Modeling (7.1)
  - slug: apcalcab-u07-exam-q11
    type: multiple_choice
    topic_code: "7.1"
    source: "AP Calculus CED, Topic 7.1"
    points: 1
    prompt: |
      A hypothetical snowball melts so that its volume V decreases at a rate proportional to its surface area. For a sphere, surface area is proportional to V^(2/3). Which differential equation models V, with k > 0?
    options:
      - "dV/dt = −kV"
      - "dV/dt = −kV^(3/2)"
      - "dV/dt = −kV^(2/3)"
      - "dV/dt = kV^(2/3)"
    option_explanations:
      - |
        This makes the rate proportional to the volume itself, not to the surface area.
      - |
        The exponent is inverted. Surface area grows like V^(2/3), the two-thirds power.
      - |
        Correct. The rate is a constant times the surface area, which is a constant times V^(2/3); the constants combine into one k, and the minus sign records melting.
      - |
        With k > 0 this makes the snowball grow. Melting needs a negative rate.
    answer: 2
  - slug: apcalcab-u07-exam-q12
    type: multiple_choice
    topic_code: "7.1"
    source: "AP Calculus CED, Topic 7.1"
    points: 1
    prompt: |
      The amount of salt Q, in grams, in a hypothetical mixing tank satisfies dQ/dt = 50 − 0.02Q, with t in minutes. What does the 50 represent?
    options:
      - "The tank initially contains 50 grams of salt."
      - "Salt leaves the tank at 50 grams per minute."
      - "The amount of salt levels off at 50 grams."
      - "Salt enters the tank at a constant 50 grams per minute."
    option_explanations:
      - |
        The equation describes rates, not the starting amount; an initial condition would be stated separately as Q(0).
      - |
        The 50 is added, so it increases Q: it is an inflow. The outflow is the term 0.02Q.
      - |
        The level-off (equilibrium) value is where 50 − 0.02Q = 0, which is Q = 2,500 grams, not 50.
      - |
        Correct. 50 is a constant positive contribution to dQ/dt in grams per minute: salt flowing in. The −0.02Q term is salt flowing out at a rate proportional to the amount present.
    answer: 3
  # ---- Verifying (7.2)
  - slug: apcalcab-u07-exam-q13
    type: multiple_choice
    topic_code: "7.2"
    source: "AP Calculus CED, Topic 7.2"
    points: 1
    prompt: |
      Which function is a solution of y″ + 9y = 0?
    options:
      - "y = 4cos(9x)"
      - "y = 4cos(3x)"
      - "y = 4e^(3x)"
      - "y = 4cos(x/3)"
    option_explanations:
      - |
        y″ = −324cos(9x), so y″ + 9y = −288cos(9x) ≠ 0. The inner coefficient must square to 9.
      - |
        Correct. y′ = −12sin(3x) and y″ = −36cos(3x) = −9y, so y″ + 9y = 0.
      - |
        y″ = 36e^(3x) = 9y, so y″ − 9y = 0, not y″ + 9y = 0: the sign is wrong.
      - |
        y″ = −(4/9)cos(x/3) = −y/9, so y″ + 9y = (320/9)cos(x/3) ≠ 0.
    answer: 1
  - slug: apcalcab-u07-exam-q14
    type: multiple_choice
    topic_code: "7.2"
    source: "AP Calculus CED, Topic 7.2"
    points: 1
    prompt: |
      For every constant C, the function y = Ce^(2x) − 3 is a solution of which differential equation?
    options:
      - "dy/dx = 2y + 6"
      - "dy/dx = 2y − 6"
      - "dy/dx = 2y"
      - "dy/dx = 2y + 3"
    option_explanations:
      - |
        Correct. y′ = 2Ce^(2x), and 2y + 6 = 2Ce^(2x) − 6 + 6 = 2Ce^(2x).
      - |
        2y − 6 = 2Ce^(2x) − 12, which is 12 less than y′: the sign of the shift was flipped.
      - |
        2y = 2Ce^(2x) − 6 ≠ y′. The −3 shift adds a term that must be cancelled.
      - |
        2y + 3 = 2Ce^(2x) − 3. Doubling y doubles the −3 as well, so the correction must be +6.
    answer: 0
  # ---- Slope fields and reasoning (7.3, 7.4)
  - slug: apcalcab-u07-exam-q15
    type: multiple_choice
    topic_code: "7.3"
    source: "AP Calculus CED, Topic 7.3"
    points: 1
    prompt: |
      A slope field has these features: along every horizontal line the segments are parallel; the segments are horizontal along the x-axis; above the x-axis the slopes are negative and get steeper as y increases; below it they are positive. Which differential equation fits?
    options:
      - "dy/dx = y"
      - "dy/dx = −x"
      - "dy/dx = −y"
      - "dy/dx = x − y"
    option_explanations:
      - |
        This has positive slopes above the x-axis, the opposite of the description.
      - |
        Its slopes depend on x, so the parallel segments would run along vertical lines, not horizontal ones.
      - |
        Correct. The slope depends only on y (rows are parallel), is 0 when y = 0, negative for y > 0 with size growing like y, and positive for y < 0.
      - |
        This depends on x as well, so segments along a horizontal line would not be parallel.
    answer: 2
  - slug: apcalcab-u07-exam-q16
    type: multiple_choice
    topic_code: "7.4"
    source: "AP Calculus CED, Topic 7.4"
    points: 1
    prompt: |
      Let y = g(x) be the solution of dy/dx = y − 1 with g(0) = 3. Reasoning from the slope field, what is lim (x→−∞) g(x)?
    options:
      - "3"
      - "−∞"
      - "0"
      - "1"
    option_explanations:
      - |
        3 is the value at x = 0, not a limit. The slope there is 2, so g changes as x moves away from 0.
      - |
        Moving left, g decreases, but it cannot cross the equilibrium y = 1, so it cannot fall without bound.
      - |
        Reaching 0 would require crossing the equilibrium line y = 1.
      - |
        Correct. Above y = 1 the slopes are positive, so moving left the curve descends, and the slopes flatten as y nears 1. The curve approaches y = 1 without crossing it. (Indeed g(x) = 1 + 2eˣ.)
    answer: 3
  # ---- Separation of variables (7.6)
  - slug: apcalcab-u07-exam-q17
    type: multiple_choice
    topic_code: "7.6"
    source: "AP Calculus CED, Topic 7.6"
    points: 1
    prompt: |
      Which is the general solution of dy/dx = y/x² (for x ≠ 0), where A is an arbitrary constant?
    options:
      - "y = Ae^(1/x)"
      - "y = Ae^(−1/x)"
      - "y = e^(−1/x) + A"
      - "y = −1/x + A"
    option_explanations:
      - |
        This uses 1/x as an antiderivative of 1/x². In fact ∫ x⁻² dx = −x⁻¹ = −1/x.
      - |
        Correct. dy/y = x⁻² dx, ln|y| = −1/x + C, so y = Ae^(−1/x). Check: y′ = Ae^(−1/x) · (1/x²) = y/x².
      - |
        The constant must multiply after exponentiating: e^(−1/x + C) = e^C · e^(−1/x).
      - |
        This integrates only the right side. The left side ∫ dy/y = ln|y| must be integrated too.
    answer: 1
  - slug: apcalcab-u07-exam-q18
    type: multiple_choice
    topic_code: "7.6"
    source: "AP Calculus CED, Topic 7.6"
    points: 1
    prompt: |
      Which differential equation is separable?
    options:
      - "dy/dx = x + y"
      - "dy/dx = sin(xy)"
      - "dy/dx = x²y − y"
      - "dy/dx = x² + y²"
    option_explanations:
      - |
        A sum of x and y cannot be written as a function of x times a function of y.
      - |
        sin(xy) does not factor into g(x) · h(y); the variables are locked together inside the sine.
      - |
        Correct. x²y − y = y(x² − 1), so dy/y = (x² − 1) dx.
      - |
        A sum of squares cannot be factored into a function of x times a function of y.
    answer: 2
  # ---- Particular solutions (7.7)
  - slug: apcalcab-u07-exam-q19
    type: multiple_choice
    topic_code: "7.7"
    source: "AP Calculus CED, Topic 7.7"
    points: 1
    prompt: |
      Which is the particular solution of dy/dx = 2xeʸ with y(0) = 0?
    options:
      - "y = −ln(1 − x²)"
      - "y = ln(x² + 1)"
      - "y = −ln(x² + 1)"
      - "y = x²"
    option_explanations:
      - |
        Correct. e^(−y) dy = 2x dx gives −e^(−y) = x² + C; at (0, 0), C = −1. So e^(−y) = 1 − x² and y = −ln(1 − x²), defined for −1 < x < 1.
      - |
        This separates as eʸ dy = 2x dx, moving eʸ without inverting it. Its derivative 2x/(x² + 1) is not 2xeʸ = 2x(x² + 1).
      - |
        This drops the minus sign in ∫ e^(−y) dy = −e^(−y), getting e^(−y) = x² + 1.
      - |
        This replaces eʸ by its initial value e⁰ = 1 and integrates 2x. eʸ changes as y changes, so it must be separated.
    answer: 0
  - slug: apcalcab-u07-exam-q20
    type: multiple_choice
    topic_code: "7.7"
    source: "AP Calculus CED, Topic 7.7"
    points: 1
    prompt: |
      Which is the particular solution of dy/dx = (cos x)/y with y(0) = −2?
    options:
      - "y = √(2 sin x + 4)"
      - "y = −√(sin x + 4)"
      - "y = −√(2 sin x) − 2"
      - "y = −√(2 sin x + 4)"
    option_explanations:
      - |
        This gives y(0) = 2. The initial value is negative, so the negative square root is needed.
      - |
        This forgets to double sin x when clearing the 1/2 from y²/2 = sin x + C.
      - |
        The constant was attached after taking the square root. Find C from y²/2 = sin x + C first: C = 2.
      - |
        Correct. y dy = cos x dx, y²/2 = sin x + C, and y(0) = −2 gives C = 2, so y² = 2 sin x + 4. Since y(0) < 0, y = −√(2 sin x + 4), defined for all x because 2 sin x + 4 ≥ 2.
    answer: 3
  # ---- Exponential models (7.8)
  - slug: apcalcab-u07-exam-q21
    type: multiple_choice
    topic_code: "7.8"
    source: "AP Calculus CED, Topic 7.8"
    points: 1
    prompt: |
      A hypothetical medical tracer has a half-life of 8 hours. What fraction of an injected dose remains after one day?
    options:
      - "1/3"
      - "1/8"
      - "1/4"
      - "1/16"
    option_explanations:
      - |
        This divides by the number of half-lives (24/8 = 3). Each half-life multiplies by 1/2.
      - |
        Correct. One day is 24/8 = 3 half-lives, so (1/2)³ = 1/8 remains.
      - |
        This counts two half-lives; 24 hours is three periods of 8 hours.
      - |
        This counts four half-lives; 24 hours is three periods of 8 hours.
    answer: 1
  - slug: apcalcab-u07-exam-q22
    type: multiple_choice
    topic_code: "7.8"
    source: "AP Calculus CED, Topic 7.8"
    points: 1
    prompt: |
      The relative rate of change (1/P)(dP/dt) of a hypothetical town's population is constant at −0.03 per year. Which statement is true?
    options:
      - "The population decreases by exactly 0.03 people per year."
      - "P = P₀(0.97)ᵗ, since the town loses exactly 3% each year."
      - "P = P₀e^(−0.03t), so the population halves every ln 2 / 0.03 ≈ 23.1 years."
      - "The population reaches 0 after 1/0.03 ≈ 33.3 years."
    option_explanations:
      - |
        −0.03 is a relative rate (a fraction of P per year), not an absolute number of people per year.
      - |
