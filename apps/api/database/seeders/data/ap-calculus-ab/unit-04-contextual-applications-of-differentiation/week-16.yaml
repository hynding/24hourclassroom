    - slug: apcalcab-u04-w16-q22
      type: short_answer
      topic_code: "4.5"
      source: "AP Calculus CED, Topic 4.5"
      points: 3
      prompt: |
        A spotlight on the ground shines on a vertical wall 12 metres away. A person 2 metres tall walks from the spotlight straight toward the wall at 1.5 metres per second, casting a shadow on the wall.

        (a) Let x be the person's distance from the spotlight and y the height of the shadow on the wall. Use similar triangles to show that y = 24/x.
        (b) How fast is the height of the shadow changing when the person is 4 metres from the wall? Include units.
        (c) Is the shadow getting taller or shorter? Explain using your answer to (b).
      answer: |
        (a) The light ray over the person's head makes two similar right triangles with a common vertex at the spotlight: y/12 = 2/x, so y = 24/x.
        (b) dy/dt = −(24/x²)·dx/dt. The person is 4 m from the wall, so x = 8, and dx/dt = 1.5. dy/dt = −(24/64)(1.5) = −0.5625 metres per second.
        (c) dy/dt is negative, so the shadow is getting shorter, at 0.5625 m per second.
      explanation: |
        Three points, one per part. (a) the similar-triangles ratio y/12 = 2/x. (b) the differentiated relation and −0.5625 m per second (x = 8 must be used, not 4). (c) shorter, tied to the negative sign.
    - slug: apcalcab-u04-w16-q23
      type: long_answer
      topic_code: "4.7"
      source: "AP Calculus CED, Topic 4.7"
      points: 6
      prompt: |
        A function h is twice differentiable for x > 0, with h(2) = 0, h′(2) = 4 and h″(x) = −1/x² for x > 0.

        (A) Write an equation of the line tangent to the graph of h at x = 2, and use it to estimate h(2.1).

        (B) Is the estimate in (A) an overestimate or an underestimate? Justify your answer.

        (C) Find lim (x→2) h(x)/(x² − 4). Show the work that justifies your method.

        (D) Find lim (x→2) (h(x) − 4x + 8)/(x − 2)². Show the work that justifies your method.
      answer: |
        (A) y = 0 + 4(x − 2) = 4(x − 2). h(2.1) ≈ 4(0.1) = 0.4.
        (B) Overestimate: h″(x) = −1/x² < 0 for x > 0, so h is concave down and its graph lies below its tangent line.
        (C) lim (x→2) h(x) = h(2) = 0 (h is continuous) and lim (x→2) (x² − 4) = 0, so the form is 0/0. By L'Hospital's Rule the limit is lim (x→2) h′(x)/(2x) = 4/4 = 1.
        (D) Numerator → h(2) − 8 + 8 = 0 and denominator → 0: 0/0. L'Hospital's Rule gives lim (h′(x) − 4)/(2(x − 2)). Again numerator → h′(2) − 4 = 0 and denominator → 0: 0/0. Applying the rule again gives lim h″(x)/2 = (−1/4)/2 = −1/8.
      explanation: |
        Six points. (A) 1 point for the tangent line, 1 point for the estimate 0.4. (B) 1 point for overestimate with the reason h″ < 0 (concave down). (C) 1 point for showing both limits are 0 before using the rule, together with the value 1. (D) 1 point for verifying 0/0 at both applications, 1 point for −1/8. A value obtained by L'Hospital's Rule without checking the indeterminate form earns the answer point only.
