    - slug: apcalcab-u04-w13-q22
      type: short_answer
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 2
      prompt: |
        A hypothetical cyclist rides along a straight road. Her velocity v(t), in metres per second, is recorded at the times below.

        | t (seconds) | 0 | 2 | 5 | 8 |
        |---|---|---|---|---|
        | v(t) (m/s) | 3 | 7 | 12 | 10 |

        (a) Estimate the cyclist's acceleration at t = 4 seconds. Show the computation and give units.
        (b) Is the cyclist speeding up or slowing down at t = 6.5 seconds, based on the table? Explain, assuming v stays positive and its estimated rate is representative.
      answer: |
        (a) a(4) ≈ (v(5) − v(2))/(5 − 2) = (12 − 7)/3 = 5/3 ≈ 1.667 metres per second per second.
        (b) a(6.5) ≈ (v(8) − v(5))/(8 − 5) = (10 − 12)/3 = −2/3 m/s². The velocity is positive and the acceleration is negative, opposite signs, so she is slowing down.
      explanation: |
        Two points. (a) 1 point for the difference quotient over [2, 5] and 5/3 m/s² with units. (b) 1 point for a negative estimated acceleration together with positive velocity, concluding slowing down.
    - slug: apcalcab-u04-w13-q23
      type: long_answer
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 6
      prompt: |
        A particle moves along the x-axis. Its position at time t seconds is x(t) = (1/3)t³ − 3t² + 8t − 1 metres, for 0 ≤ t ≤ 6.

        (A) Find the velocity and the acceleration of the particle at t = 1. Is the particle speeding up or slowing down at t = 1? Give a reason.

        (B) On what open intervals is the particle moving to the left? Justify your answer.

        (C) Find the total distance the particle travels from t = 0 to t = 6.

        (D) Is the speed of the particle increasing or decreasing at t = 5? Give a reason.
      answer: |
        (A) v(t) = x′(t) = t² − 6t + 8 and a(t) = 2t − 6. v(1) = 3 m/s and a(1) = −4 m/s². Velocity and acceleration have opposite signs, so the particle is slowing down at t = 1.
        (B) v(t) = (t − 2)(t − 4) < 0 exactly when 2 < t < 4, so the particle moves left on (2, 4).
        (C) The particle turns around at t = 2 and t = 4. x(0) = −1, x(2) = 17/3, x(4) = 13/3, x(6) = 11. Distance = (17/3 + 1) + (17/3 − 13/3) + (11 − 13/3) = 20/3 + 4/3 + 20/3 = 44/3 ≈ 14.667 metres.
        (D) v(5) = 25 − 30 + 8 = 3 > 0 and a(5) = 4 > 0. Velocity and acceleration have the same sign, so the speed is increasing at t = 5.
      explanation: |
        Six points. (A) 1 point for v(1) = 3 m/s and a(1) = −4 m/s² (units required in at least one), 1 point for "slowing down" with the reason that v and a have opposite signs. (B) 1 point for 2 < t < 4 with the justification that v(t) < 0 there. (C) 1 point for identifying the turning times t = 2 and t = 4, 1 point for 44/3 metres. (D) 1 point for "increasing" because v(5) and a(5) are both positive. A reason based on the sign of a alone earns no credit in (A) or (D).
