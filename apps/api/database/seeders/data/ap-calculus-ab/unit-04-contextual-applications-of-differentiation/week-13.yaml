      prompt: |
        H(t) is the height of a hypothetical sunflower, in centimetres, t days after it is planted out. H(20) = 85, H′(20) = 3.2 and H″(20) = −0.1.

        (a) Interpret H′(20) = 3.2 in context, with units.
