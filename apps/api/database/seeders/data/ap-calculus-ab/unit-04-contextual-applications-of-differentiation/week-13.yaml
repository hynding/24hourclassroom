week: 13
unit: 4
title: "The Derivative in Context and Straight-Line Motion"
topics: ["4.1", "4.2"]
guide: guides/week-13.md
guide_description: |
  What a derivative means in a real context: its units (output units per input unit), how to write a complete
  interpretation sentence with "at time t = …", what the sign and the second derivative add, and the difference
  between an instantaneous rate and an average rate or a total change. Then straight-line motion: position,
  velocity, acceleration and speed, when a particle is at rest or changes direction, when it is speeding up or
  slowing down, and displacement versus total distance. Worked examples: a hypothetical cooling cup of tea, a
  hypothetical bakery's cost function, a full motion analysis of x(t) = t³ − 6t² + 9t + 1, and estimating
  acceleration from a hypothetical table of a cyclist's velocity.
flashcards_description: |
  30 cards on units and interpretation sentences for derivatives in context, second derivatives in context,
  position, velocity, acceleration and speed, at rest and direction changes, speeding up and slowing down, and
  displacement versus total distance.

flashcards:
  - front: Units of f′(x) when f is in litres and x in minutes → what to write
    back: |
      Litres per minute: output units divided by input units. The derivative is a rate, so its units always contain "per".
    topic_code: "4.1"
  - front: Units of f″(t) when f is in metres and t in seconds → what to write
    back: |
      Metres per second per second (m/s²): the rate of change of a rate, so the input unit appears twice in the denominator.
    topic_code: "4.1"
  - front: Interpretation sentence for V′(10) = −3.5 (V in litres, t in minutes) → the full sentence
    back: |
      At time t = 10 minutes, the volume of water is decreasing at a rate of 3.5 litres per minute. Name the time, the quantity, the direction and the units.
    topic_code: "4.1"
  - front: Negative derivative in context, such as T′(5) = −2.4 °C per minute → how to state the sign
    back: |
      Say "decreasing at a rate of 2.4 °C per minute". Do not say "increasing at a rate of −2.4"; the word "decreasing" carries the sign.
    topic_code: "4.1"
  - front: Cost C(x) dollars for x kilograms with C′(40) = 3.5 → practical meaning
    back: |
      When 40 kg have been produced, cost is rising at $3.50 per kilogram, so the 41st kilogram costs about $3.50 extra.
    topic_code: "4.1"
  - front: f′(a) versus (f(b) − f(a))/(b − a) in context → which is which
    back: |
      f′(a) is the instantaneous rate at the single input a. The difference quotient is the average rate over the whole interval [a, b]. Only the second describes "over the first 10 minutes".
    topic_code: "4.1"
  - front: f′(a) versus f(b) − f(a) in context → which is a rate and which a change
    back: |
      f′(a) is a rate (units per input unit) at one instant. f(b) − f(a) is a total change in the quantity itself (plain units, no "per").
    topic_code: "4.1"
  - front: Downloads N(t) with N′(3) > 0 and N″(3) < 0 → what to say
    back: |
      At day 3 downloads are increasing, but the rate at which they increase is itself decreasing: growth is slowing down.
    topic_code: "4.1"
  - front: Second derivative in context, P″(t) in people per year per year → meaning of its sign
    back: |
      P″ > 0: the rate of growth P′ is increasing. P″ < 0: the rate of growth is decreasing. It says nothing on its own about whether P itself is rising.
    topic_code: "4.1"
  - front: Pressure P(h) in kilopascals, altitude h in metres → units of P′(h)
    back: |
      Kilopascals per metre: the change in pressure for each additional metre of altitude.
    topic_code: "4.1"
  - front: Position x(t) → how to get velocity and acceleration
    back: |
      v(t) = x′(t) and a(t) = v′(t) = x″(t). Each is the derivative of the one before.
    topic_code: "4.2"
  - front: Speed → definition and how it differs from velocity
    back: |
      Speed = |v(t)|. Velocity carries direction (its sign); speed is always ≥ 0.
    topic_code: "4.2"
  - front: Particle at rest → condition
    back: |
      v(t) = 0. Being at rest for an instant does not by itself mean a change of direction.
    topic_code: "4.2"
  - front: Particle changes direction at t = c → condition
    back: |
      v(t) changes sign at t = c. v(c) = 0 alone is not enough: v(t) = (t − 2)² is 0 at t = 2 but never negative.
    topic_code: "4.2"
  - front: Moving right (or up) versus moving left (or down) → read it from which function
    back: |
      From the sign of v(t): v > 0 moving right (positive direction), v < 0 moving left. The sign of x(t) only says which side of the origin the particle is on.
    topic_code: "4.2"
  - front: Speeding up → condition on v and a
    back: |
      v(t) and a(t) have the same sign (both positive or both negative). Then |v| is growing.
    topic_code: "4.2"
  - front: Slowing down → condition on v and a
    back: |
      v(t) and a(t) have opposite signs. The particle's speed |v| is shrinking toward 0.
    topic_code: "4.2"
  - front: v(3) = −1 and a(3) = −2 → speeding up or slowing down?
    back: |
      Speeding up: velocity and acceleration are both negative, so the velocity is getting more negative and the speed is increasing.
    topic_code: "4.2"
  - front: Displacement on [a, b] → formula from position
    back: |
      x(b) − x(a): the net change in position. It can be negative, and it ignores any back-and-forth in between.
    topic_code: "4.2"
  - front: Total distance on [a, b] from position → method
    back: |
      Find every time the particle turns around (v changes sign), split [a, b] there, and add the absolute changes in position over each piece.
    topic_code: "4.2"
  - front: x(t) = t³ − 6t² + 9t + 1 → when it is at rest and where it moves left
    back: |
      v(t) = 3(t − 1)(t − 3): at rest at t = 1 and t = 3; v < 0, so moving left, on 1 < t < 3.
    topic_code: "4.2"
  - front: x(t) = t³ − 6t² + 9t + 1 on 0 ≤ t ≤ 4 → displacement and total distance
    back: |
      x(0) = 1, x(1) = 5, x(3) = 1, x(4) = 5. Displacement 5 − 1 = 4; total distance 4 + 4 + 4 = 12.
    topic_code: "4.2"
  - front: Units of velocity and acceleration when x is in feet and t in seconds → what to write
    back: |
      Velocity in feet per second (ft/s); acceleration in feet per second per second (ft/s²).
    topic_code: "4.2"
  - front: Acceleration from a velocity table at a time not listed → estimate
    back: |
      Use the two listed times that straddle it: a ≈ (v(t₂) − v(t₁))/(t₂ − t₁), in velocity units per time unit.
    topic_code: "4.2"
  - front: Velocity graph crosses the t-axis → what the particle does there
    back: |
      It stops for an instant and reverses direction. Where the velocity graph only touches the axis, the particle stops but keeps its direction.
    topic_code: "4.2"
  - front: Velocity graph with a horizontal tangent → what that says about acceleration
    back: |
      a(t) = v′(t) = 0 there: the acceleration is zero at that instant, whatever the velocity is.
    topic_code: "4.2"
  - front: Particle farthest to the right on [a, b] → where to look
    back: |
      At an endpoint or at a time where v changes from positive to negative. Compare x at those candidates.
    topic_code: "4.2"
  - front: Error-spot → "a(t) < 0, so the particle is slowing down"
    back: |
      The sign of a alone decides nothing. If v is also negative, the particle is speeding up. Compare the signs of v and a.
    topic_code: "4.2"
  - front: Error-spot → "V′(10) = −3.5 means the tank lost 3.5 litres in the first 10 minutes"
    back: |
      V′(10) is a rate at the instant t = 10, not a total change over [0, 10]. The loss over the first 10 minutes is V(0) − V(10).
    topic_code: "4.1"
  - front: Error-spot → "total distance = x(4) − x(0)"
    back: |
      That is displacement. If the particle turns around inside the interval, the back-and-forth cancels in x(4) − x(0); split at each turn and add absolute values.
    topic_code: "4.2"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 4.1 and 4.2: units and interpretation of
    derivatives in context, second derivatives in context, position, velocity, acceleration and speed, at rest and
    direction changes, speeding up and slowing down, displacement and total distance), with 7 questions (about 30%)
    reviewing weeks 3 to 11 (limits, differentiability, estimating derivatives, the chain rule, implicit
    differentiation, inverse functions and higher-order derivatives). Opens with a shared-context set on one
    particle. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items
    are matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. No calculator is needed; every answer to a rate question must carry units.
  questions:
    # ---- Stimulus set: one particle (4.2)
    - slug: apcalcab-u04-w13-q01
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 1
      stimulus: |
        A particle moves along the x-axis. Its position at time t seconds is s(t) = 2t³ − 15t² + 24t metres, for 0 ≤ t ≤ 6.
      prompt: |
        At which times in 0 < t < 6 is the particle at rest?
      options:
        - "t = 2.5 only"
        - "t = 1 only"
        - "t = 1 and t = 4"
        - "t = 0 and t = 4"
      option_explanations:
        - |
          t = 2.5 is where the acceleration s″(t) = 12t − 30 is zero, not where the velocity is zero.
        - |
          This misses the second zero of the velocity: 6(t − 1)(t − 4) is also 0 at t = 4.
        - |
          Correct. v(t) = s′(t) = 6t² − 30t + 24 = 6(t − 1)(t − 4), which is 0 at t = 1 and t = 4.
        - |
          s(0) = 0 means the particle is at the origin at t = 0, not that it is at rest; at rest needs v(t) = 0.
      answer: 2
    - slug: apcalcab-u04-w13-q02
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 1
      stimulus: |
        A particle moves along the x-axis. Its position at time t seconds is s(t) = 2t³ − 15t² + 24t metres, for 0 ≤ t ≤ 6.
      prompt: |
        What is the acceleration of the particle at t = 3?
      options:
        - "−12 m/s²"
        - "6 m/s²"
        - "6 m/s"
        - "−9 m/s²"
      option_explanations:
        - |
          −12 is the velocity v(3) = 54 − 90 + 24; the acceleration is the derivative of velocity, one step further.
        - |
          Correct. a(t) = v′(t) = 12t − 30, so a(3) = 36 − 30 = 6 metres per second per second.
        - |
          The number is right but the units are those of velocity; acceleration is in metres per second per second.
        - |
          −9 is the position s(3) = 54 − 135 + 72 in metres, not an acceleration.
      answer: 1
    - slug: apcalcab-u04-w13-q03
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 1
      stimulus: |
        A particle moves along the x-axis. Its position at time t seconds is s(t) = 2t³ − 15t² + 24t metres, for 0 ≤ t ≤ 6.
      prompt: |
        On which interval is the particle speeding up?
      options:
        - "0 < t < 1"
        - "2.5 < t < 4"
        - "1 < t < 4"
        - "1 < t < 2.5"
      option_explanations:
        - |
          On 0 < t < 1 the velocity is positive but a(t) = 12t − 30 is negative: opposite signs, so the particle is slowing down.
        - |
          The acceleration is positive here, but the velocity is negative: opposite signs mean slowing down. The sign of a alone does not decide.
        - |
          This is where v(t) < 0, the interval on which the particle moves left. It slows down on 2.5 < t < 4.
        - |
          Correct. On 1 < t < 2.5, v(t) = 6(t − 1)(t − 4) < 0 and a(t) = 12t − 30 < 0: same sign, so the speed is increasing.
      answer: 3
    - slug: apcalcab-u04-w13-q04
      type: numeric
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 1
      stimulus: |
        A particle moves along the x-axis. Its position at time t seconds is s(t) = 2t³ − 15t² + 24t metres, for 0 ≤ t ≤ 6.
      prompt: |
        What is the total distance, in metres, that the particle travels from t = 0 to t = 5?
      answer: { value: 49, tolerance: 0 }
      explanation: |
        The particle turns around at t = 1 and t = 4. s(0) = 0, s(1) = 11, s(4) = −16, s(5) = −5. Distance = |11 − 0| + |−16 − 11| + |−5 − (−16)| = 11 + 27 + 11 = 49 metres. (The displacement is only −5 metres.)
    # ---- Independent items
    - slug: apcalcab-u04-w13-q05
      type: multiple_choice
      topic_code: "4.1"
      source: "AP Calculus CED, Topic 4.1"
      points: 1
      prompt: |
        The volume of water in a tank is V(t) litres, t minutes after a valve is opened. Which is the best interpretation of V′(10) = −3.5?
      options:
        - "At t = 10 minutes, the volume of water is decreasing at a rate of 3.5 litres per minute."
        - "During the first 10 minutes, the tank loses 3.5 litres of water."
        - "At t = 10 minutes, the tank holds 3.5 litres less than when the valve was opened."
        - "At t = 10 minutes, the volume of water is decreasing at a rate of 3.5 litres per minute per minute."
      option_explanations:
        - |
          Correct. V′(10) is the instantaneous rate of change of volume at t = 10; the negative sign means decreasing, and the units are litres per minute.
        - |
          A loss over the first 10 minutes is the total change V(0) − V(10), not the rate at one instant.
        - |
          This also describes a total change V(10) − V(0) in litres; a derivative is a rate, with units of litres per minute.
        - |
          Litres per minute per minute are the units of V″, the rate of change of the rate; V′ is in litres per minute.
      answer: 0
    - slug: apcalcab-u04-w13-q06
      type: multiple_choice
      topic_code: "4.1"
      source: "AP Calculus CED, Topic 4.1"
      points: 1
      prompt: |
        P(h) is the air pressure, in kilopascals, at an altitude of h metres above sea level. What are the units of P′(h)?
      options:
        - "Metres per kilopascal"
        - "Kilopascals"
        - "Kilopascals per metre"
        - "Kilopascals per metre per metre"
      option_explanations:
        - |
          This turns the ratio upside down; a derivative is output units per input unit, and P is the output.
        - |
          Kilopascals are the units of P itself; the derivative measures change in P per unit change in h.
        - |
          Correct. P′(h) = dP/dh, the change in pressure (kilopascals) for each additional metre of altitude.
        - |
          These are the units of P″(h), the rate of change of P′; one "per metre" is enough for P′.
      answer: 2
    - slug: apcalcab-u04-w13-q07
      type: multiple_choice
      topic_code: "4.1"
      source: "AP Calculus CED, Topic 4.1"
      points: 1
      prompt: |
        N(t) is the total number of downloads of a hypothetical app, in thousands, t days after its launch. N′(3) = 12 and N″(3) = −2. Which statement is best supported?
      options:
        - "At t = 3 days, downloads are decreasing, because N″(3) is negative."
        - "At t = 3 days, downloads are increasing at 12 thousand per day, and that rate is decreasing at 2 thousand downloads per day per day."
        - "At t = 3 days, the app has 12 thousand downloads, and it is losing 2 thousand per day."
        - "At t = 3 days, downloads are increasing at 12 thousand per day, and that rate is increasing at 2 thousand downloads per day per day."
      option_explanations:
        - |
          Whether N is increasing depends on N′, which is positive. A negative N″ means the rate of increase is falling, not that N falls.
        - |
          Correct. N′(3) = 12 > 0 means increasing at 12 thousand downloads per day; N″(3) = −2 < 0 means that rate is falling by 2 thousand per day per day.
        - |
          This reads N′(3) as the value N(3) and N″(3) as N′(3); each is shifted one derivative too low.
        - |
          The sign of N″(3) is negative, so the rate of increase is decreasing, not increasing.
      answer: 1
    - slug: apcalcab-u04-w13-q08
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 1
      prompt: |
        A particle moves along a line with velocity v(t) = 5 − 2t feet per second. Is the particle speeding up or slowing down at t = 3 seconds?
      options:
        - "Slowing down, because a(3) is negative."
        - "Slowing down, because v(3) is negative."
        - "Slowing down, because the velocity is decreasing."
        - "Speeding up, because v(3) and a(3) are both negative."
      option_explanations:
        - |
          The sign of acceleration alone does not decide. Here v(3) is also negative, and same signs mean speeding up.
        - |
          A negative velocity only says the particle moves in the negative direction; speed depends on comparing v with a.
        - |
          Velocity decreasing from −1 toward more negative values means the speed |v| is increasing.
        - |
          Correct. v(3) = 5 − 6 = −1 ft/s and a(t) = v′(t) = −2 ft/s², so v and a share a sign and the speed is increasing.
      answer: 3
    - slug: apcalcab-u04-w13-q09
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 1
      prompt: |
        A particle's position is x(t) = 8√t − t metres for t > 0 seconds. At what time is the particle at rest?
      options:
        - "t = 4"
        - "t = 16"
        - "t = 0 and t = 64"
        - "t = 1/16"
      option_explanations:
        - |
          This comes from writing the velocity as 4/t − 1, dropping the square root in the derivative of 8√t.
        - |
          Correct. v(t) = 8 · 1/(2√t) − 1 = 4/√t − 1, which is 0 when √t = 4, so t = 16 seconds.
        - |
          These solve x(t) = 0 (8√t = t), where the particle is at the origin; at rest means v(t) = 0. Also t = 0 is outside t > 0.
        - |
          This solves 4/√t = 1 as √t = 1/4; the equation gives √t = 4.
      answer: 1
    # ---- Spiral review
    - slug: apcalcab-u04-w13-q10
      type: multiple_choice
      topic_code: "3.1"
      source: "AP Calculus CED, Topic 3.1"
      points: 1
      prompt: |
        What is d/dx [(3x² − 1)⁵]?
      options:
        - "5(3x² − 1)⁴"
        - "30(3x² − 1)⁴"
        - "30x(3x² − 1)⁴"
        - "30x(3x² − 1)⁶"
      option_explanations:
        - |
          This differentiates the outer power but forgets to multiply by the derivative of the inside, 6x (chain rule).
        - |
          The inner derivative of 3x² − 1 is 6x, not 6.
        - |
          Correct. Chain rule: 5(3x² − 1)⁴ · 6x = 30x(3x² − 1)⁴.
        - |
          The power rule lowers the exponent by 1, to 4, rather than raising it.
      answer: 2
    - slug: apcalcab-u04-w13-q11
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Calculus CED, Topic 3.2"
      points: 1
      prompt: |
        The curve x² + xy + y² = 7 passes through (1, 2). What is dy/dx at (1, 2)?
      options:
        - "−4/5"
        - "−2/5"
        - "4/5"
        - "−5/4"
      option_explanations:
        - |
          Correct. 2x + (y + x·dy/dx) + 2y·dy/dx = 0, so dy/dx = −(2x + y)/(x + 2y) = −(2 + 2)/(1 + 4) = −4/5.
        - |
          This differentiates xy as dy/dx alone, dropping the y term from the product rule: −2x/(1 + 2y) = −2/5.
        - |
          The sign is lost when moving 2x + y to the other side of the equation.
        - |
          This is the reciprocal, −(x + 2y)/(2x + y); the dy/dx terms were collected on the wrong side.
      answer: 0
    - slug: apcalcab-u04-w13-q12
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Calculus CED, Topic 3.3"
      points: 1
      prompt: |
        Let f(x) = x³ + 3x − 2, and let g be the inverse function of f. What is g′(2)?
      options:
        - "1/15"
        - "6"
        - "15"
        - "1/6"
      option_explanations:
        - |
          This uses 1/f′(2); the derivative must be evaluated at the input of f that gives 2, which is x = 1.
        - |
          6 is f′(1), the slope of f at the matching point; the inverse's slope is its reciprocal.
        - |
          15 is f′(2) = 3(4) + 3, evaluated at the wrong point and not inverted.
        - |
          Correct. f(1) = 1 + 3 − 2 = 2, so g(2) = 1, and g′(2) = 1/f′(1) = 1/(3 + 3) = 1/6.
      answer: 3
    - slug: apcalcab-u04-w13-q13
      type: multi_select
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 2
      partial_credit: true
      prompt: |
        A particle moves along the x-axis with position x(t) = t² − 6t + 5 centimetres, for 0 ≤ t ≤ 5 seconds. Which statements are true? Select all that apply.
      options:
        - "The particle is at rest at t = 3."
        - "The particle moves left on 0 < t < 3."
        - "The particle is speeding up on 0 < t < 3."
        - "The displacement on 0 ≤ t ≤ 5 is −5 cm."
        - "The total distance travelled on 0 ≤ t ≤ 5 is 5 cm."
      option_explanations:
        - |
          Correct. v(t) = x′(t) = 2t − 6, which equals 0 at t = 3 seconds.
        - |
          Correct. v(t) = 2t − 6 < 0 for t < 3, so the particle moves in the negative direction.
        - |
          v < 0 but a(t) = 2 > 0 on 0 < t < 3: opposite signs, so the particle is slowing down.
        - |
          Correct. Displacement is x(5) − x(0) = 0 − 5 = −5 cm, a net move to the left.
        - |
          5 cm is the size of the displacement. The particle turns at t = 3: |x(3) − x(0)| + |x(5) − x(3)| = |−4 − 5| + |0 − (−4)| = 9 + 4 = 13 cm.
      answer: [0, 1, 3]
    - slug: apcalcab-u04-w13-q14
      type: multi_select
      topic_code: "2.4"
      source: "AP Calculus CED, Topic 2.4"
      points: 2
      partial_credit: true
      prompt: |
        Let f(x) = |x − 2|. Which statements are true? Select all that apply.
      options:
        - "f is continuous at x = 2."
        - "f is differentiable at x = 2."
        - "lim (x→2) f(x) = 0"
        - "f′(3) = 1"
        - "f′(1) = 1"
      option_explanations:
        - |
          Correct. lim (x→2) |x − 2| = 0 = f(2), so f is continuous there.
        - |
          The graph has a corner at x = 2: the slope is −1 just left and 1 just right, so f′(2) does not exist.
        - |
          Correct. Both one-sided limits of |x − 2| as x → 2 equal 0.
        - |
          Correct. For x > 2, f(x) = x − 2, whose slope is 1.
        - |
          For x < 2, f(x) = −(x − 2) = 2 − x, whose slope is −1, not 1.
      answer: [0, 2, 3]
    - slug: apcalcab-u04-w13-q15
      type: true_false
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 1
      prompt: |
        True or false: If, at time t, a particle's velocity is negative and its acceleration is negative, then its speed is decreasing at time t.
      answer: false
      explanation: |
        False. When velocity and acceleration have the same sign, the speed |v(t)| is increasing. A negative velocity that becomes more negative means the particle moves faster in the negative direction.
    - slug: apcalcab-u04-w13-q16
      type: true_false
      topic_code: "3.6"
      source: "AP Calculus CED, Topic 3.6"
      points: 1
      prompt: |
        True or false: The second derivative of sin x with respect to x is −sin x.
      answer: true
      explanation: |
        True. d/dx [sin x] = cos x, and d/dx [cos x] = −sin x.
    - slug: apcalcab-u04-w13-q17
      type: fill_blank
      topic_code: "4.1"
      source: "AP Calculus CED, Topic 4.1"
      points: 1
      prompt: |
        A hypothetical bakery's cost of producing x kilograms of bread is C(x) dollars, and C′(40) = 3.5. Producing the 41st kilogram costs approximately ____ dollars.
