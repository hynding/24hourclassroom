  # ---- Short answer
  - slug: apcalcab-u04-exam-q41
    type: short_answer
    topic_code: "4.3"
    source: "AP Calculus CED, Topic 4.3"
    points: 3
    prompt: |
      In a hypothetical lake, the dissolved oxygen level at depth d metres is O(d) = 9 − 0.4d + 0.005d² milligrams per litre (mg/L), for 0 ≤ d ≤ 30.

      (a) Find O′(10) and interpret it in context, with units.
      (b) Find O″(10) and explain what its sign says about how the oxygen level changes with depth.
      (c) Find the average rate of change of O for 0 ≤ d ≤ 20, with units, and explain how it differs in meaning from O′(10).
    answer: |
      (a) O′(d) = −0.4 + 0.01d, so O′(10) = −0.3. At a depth of 10 metres, the oxygen level is decreasing at 0.3 mg/L per metre of depth.
      (b) O″(d) = 0.01 mg/L per metre per metre, positive: the rate of change of the oxygen level is increasing with depth, so the oxygen level falls less steeply as you go deeper.
      (c) (O(20) − O(0))/20 = (3 − 9)/20 = −0.3 mg/L per metre. This is the average rate over the top 20 metres, while O′(10) is the rate at the single depth 10 metres; here they happen to be equal.
    explanation: |
      Three points, one per part. (a) −0.3 with an interpretation naming depth 10 m, "decreasing", and units mg/L per metre. (b) 0.01 with the sign interpreted as the rate increasing (the decline slowing). (c) −0.3 mg/L per metre with the average-over-an-interval versus at-one-depth distinction.
  - slug: apcalcab-u04-exam-q42
    type: short_answer
    topic_code: "4.7"
    source: "AP Calculus CED, Topic 4.7"
    points: 3
    prompt: |
      Functions f and g are differentiable with continuous derivatives, and

      | x | 3 |
      |---|---|
      | f(x) | 0 |
      | g(x) | 0 |
      | f′(x) | 6 |
      | g′(x) | 2 |

      (a) Explain why L'Hospital's Rule can be used to find lim (x→3) f(x)/g(x).
      (b) Find lim (x→3) f(x)/g(x).
      (c) Find lim (x→3) f(x)/(x − 3).
    answer: |
      (a) f and g are differentiable, hence continuous, so lim (x→3) f(x) = f(3) = 0 and lim (x→3) g(x) = g(3) = 0: the quotient has the indeterminate form 0/0, and g′(3) = 2 ≠ 0.
      (b) By L'Hospital's Rule, lim f′(x)/g′(x) = f′(3)/g′(3) = 6/2 = 3.
      (c) Both f(x) → 0 and x − 3 → 0, so the rule gives lim f′(x)/1 = f′(3) = 6.
    explanation: |
      Three points, one per part. (a) both limits are 0 (with continuity named or implied). (b) 3. (c) 6, with the 0/0 form noted.
  # ---- Free response
  - slug: apcalcab-u04-exam-q43
    type: long_answer
    topic_code: "4.3"
    source: "AP Calculus CED, Topic 4.3"
    points: 9
    prompt: |
      (Calculator.) In a hypothetical model, the depth of water in a reservoir is H(t) = 6 + 2.5 sin(0.4t) − 0.08t² metres, t days after the start of a monitoring period, for 0 ≤ t ≤ 6.

      (A) Find H′(3). Using correct units, interpret the meaning of H′(3) in the context of the problem.

      (B) Find H″(3). Using correct units, explain what the sign of H″(3) says about the depth of the water at t = 3.

      (C) Find the time t at which the depth of the water is greatest for 0 ≤ t ≤ 6, and the greatest depth. Justify your answer.

      (D) Use the line tangent to the graph of H at t = 3 to approximate H(3.5). Is the approximation an overestimate or an underestimate? Give a reason for your answer.
    answer: |
      (A) H′(t) = cos(0.4t) − 0.16t, so H′(3) = cos(1.2) − 0.48 ≈ −0.118. At t = 3 days, the depth of the water is decreasing at about 0.118 metres per day.
      (B) H″(t) = −0.4 sin(0.4t) − 0.16, so H″(3) ≈ −0.533 metres per day per day. Negative: the rate of change of the depth is decreasing at t = 3, so the depth is falling faster and faster.
      (C) H′(t) = 0 at t ≈ 2.776 (calculator). H″(t) = −0.4 sin(0.4t) − 0.16 < 0 on [0, 6], so H′ is decreasing and changes sign only once: H′ > 0 before t ≈ 2.776 and H′ < 0 after. H increases and then decreases, so the depth is greatest at t ≈ 2.776 days, where H ≈ 7.623 metres. (Endpoint check: H(0) = 6 and H(6) ≈ 4.809 are smaller.)
      (D) H(3) ≈ 7.610. L(t) = 7.610 − 0.118(t − 3), so H(3.5) ≈ 7.610 − 0.059 = 7.551 metres. Overestimate: H″(t) < 0 on 3 ≤ t ≤ 3.5, so H is concave down there and its graph lies below the tangent line.
    explanation: |
      Nine points.
      (A) 2 points: 1 for H′(3) ≈ −0.118 (accept −0.117 or −0.118); 1 for the interpretation with time t = 3 days, "decreasing", and units metres per day.
      (B) 2 points: 1 for H″(3) ≈ −0.533 (accept −0.532 or −0.533); 1 for explaining that the rate of change of depth is decreasing (the depth falls ever faster), with units metres per day per day.
      (C) 3 points: 1 for t ≈ 2.776 from H′(t) = 0; 1 for the justification that H′ changes from positive to negative there (or a candidates comparison including both endpoints); 1 for the greatest depth ≈ 7.623 metres.
      (D) 2 points: 1 for the tangent line and the approximation ≈ 7.551 m (accept 7.550 to 7.552); 1 for "overestimate" with the reason H″ < 0 on the interval, so the graph is concave down and lies below its tangent line. A reason based only on H′ < 0 earns no credit.
  - slug: apcalcab-u04-exam-q44
    type: long_answer
    topic_code: "4.2"
    source: "AP Calculus CED, Topic 4.2"
    points: 9
    prompt: |
      No calculator is allowed for this question. A particle moves along the x-axis. Its position at time t seconds is x(t) = 2t³ − 21t² + 60t − 10 metres, for 0 ≤ t ≤ 6.

      (A) Find the velocity and acceleration of the particle at t = 3. Is the particle speeding up or slowing down at t = 3? Give a reason for your answer.

      (B) On what open intervals is the particle moving to the right? Justify your answer.

      (C) Find the total distance the particle travels for 0 ≤ t ≤ 6.

      (D) What is the greatest x-coordinate the particle reaches for 0 ≤ t ≤ 6? Justify your answer.

      (E) Let v(t) be the particle's velocity. Find lim (t→2) v(t)/(t² − 4). Show the work that justifies your method.
    answer: |
      (A) v(t) = 6t² − 42t + 60 = 6(t − 2)(t − 5) and a(t) = 12t − 42. v(3) = 6(1)(−2) = −12 m/s and a(3) = −6 m/s². Velocity and acceleration are both negative, so the particle is speeding up at t = 3.
      (B) v(t) = 6(t − 2)(t − 5) > 0 when 0 < t < 2 and when 5 < t < 6, so the particle moves right on (0, 2) and (5, 6).
      (C) The particle turns around at t = 2 and t = 5. x(0) = −10, x(2) = 42, x(5) = 15, x(6) = 26. Distance = |42 − (−10)| + |15 − 42| + |26 − 15| = 52 + 27 + 11 = 90 metres.
      (D) The greatest x-coordinate occurs at an endpoint or where v changes from positive to negative (t = 2). x(0) = −10, x(2) = 42, x(6) = 26, so the greatest x-coordinate is 42, at t = 2.
      (E) lim (t→2) v(t) = v(2) = 0 and lim (t→2) (t² − 4) = 0, so the form is 0/0. By L'Hospital's Rule the limit is lim (t→2) v′(t)/(2t) = a(2)/4 = (24 − 42)/4 = −9/2.
    explanation: |
      Nine points.
      (A) 2 points: 1 for v(3) = −12 m/s and a(3) = −6 m/s²; 1 for "speeding up" because v(3) and a(3) have the same sign. A reason using only the sign of a(3) earns no credit for the conclusion.
      (B) 1 point: (0, 2) and (5, 6) with the justification v(t) > 0 there.
      (C) 2 points: 1 for identifying the turning times t = 2 and t = 5 and using them to split the interval; 1 for 90 metres.
      (D) 2 points: 1 for considering the endpoints and t = 2 (where v changes from positive to negative); 1 for the answer 42.
      (E) 2 points: 1 for showing both limits are 0 before applying the rule; 1 for −9/2.
