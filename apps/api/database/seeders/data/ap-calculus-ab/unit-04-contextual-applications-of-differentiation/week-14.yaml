    - slug: apcalcab-u04-w14-q21
      type: short_answer
      topic_code: "4.3"
      source: "AP Calculus CED, Topic 4.3"
      points: 3
      prompt: |
        During a hypothetical snowfall, the depth of snow on a flat roof is D(t) = 10 + 4√t − t centimetres, t hours after midnight, for 0 ≤ t ≤ 12. (Snow is falling and also melting.)

        (a) Find D′(1) and interpret it in context, with units.
        (b) Find D′(9) and interpret it in context, with units.
        (c) At what time is the snow deepest? Justify your answer.
      answer: |
        (a) D′(t) = 2/√t − 1, so D′(1) = 1. At 1 a.m. (t = 1 hour), the snow depth is increasing at 1 centimetre per hour.
        (b) D′(9) = 2/3 − 1 = −1/3. At 9 a.m., the snow depth is decreasing at 1/3 centimetre per hour.
        (c) D′(t) = 0 when √t = 2, so t = 4. D′ changes from positive to negative at t = 4, so the snow is deepest at 4 a.m.
      explanation: |
        Three points. (a) D′(1) = 1 with interpretation and units cm per hour. (b) D′(9) = −1/3 with "decreasing at 1/3 cm per hour". (c) t = 4 justified by D′ changing from positive to negative.
    - slug: apcalcab-u04-w14-q22
      type: short_answer
      topic_code: "4.4"
      source: "AP Calculus CED, Topic 4.4"
      points: 3
      prompt: |
        A hypothetical oil slick spreads in a circle. Its area is increasing at 50 square metres per minute.

        (a) Write an equation relating the area A and the radius r, and differentiate it with respect to time t.
        (b) Find how fast the radius is increasing at the instant the radius is 10 metres. Give an exact answer and a decimal to three places, with units.
        (c) Will dr/dt be larger or smaller when the radius is 20 metres? Explain using your equation.
      answer: |
        (a) A = πr², so dA/dt = 2πr·dr/dt.
        (b) 50 = 2π(10)·dr/dt, so dr/dt = 50/(20π) = 5/(2π) ≈ 0.796 metres per minute.
        (c) Smaller: dr/dt = 50/(2πr) gets smaller as r grows, so at r = 20 it is half as large (5/(4π) ≈ 0.398 m per minute).
      explanation: |
        Three points, one per part. (a) the area equation and its derivative with the dr/dt factor. (b) 5/(2π) ≈ 0.796 m per minute with units. (c) smaller, with a reason from dr/dt = 50/(2πr).
    - slug: apcalcab-u04-w14-q23
      type: long_answer
      topic_code: "4.4"
      source: "AP Calculus CED, Topic 4.4"
      points: 6
      prompt: |
        Two hypothetical water tanks are being used in an experiment.

        Tank 1 is a cylinder with radius 2 metres. Water drains from it at 0.6 cubic metres per minute. Let h be the depth of the water in metres.

        (A) Write the volume V of water in Tank 1 in terms of h, and find dh/dt when h = 3 metres. Include units.

        (B) Explain why the answer to (A) is the same at every depth.

        Tank 2 is a cone with its vertex pointing down. When the water is h metres deep, the surface of the water is a circle of radius h/2 metres. Water is pumped into Tank 2 at 0.6 cubic metres per minute.

        (C) Show that the volume of water in Tank 2 is V = πh³/12, and find dh/dt when h = 2 metres. Include units.

        (D) As Tank 2 fills, does the water level rise faster or slower? Justify your answer.
      answer: |
        (A) V = π(2)²h = 4πh. dV/dt = 4π·dh/dt, and dV/dt = −0.6 (draining), so dh/dt = −0.6/(4π) = −0.15/π ≈ −0.048 metres per minute: the depth is falling at about 0.048 m per minute.
        (B) The radius is fixed, so dV/dt = 4π·dh/dt holds with the same constant 4π at every depth; h does not appear in the equation.
        (C) V = (1/3)π(h/2)²h = (1/3)π(h²/4)h = πh³/12. dV/dt = (π/4)h²·dh/dt. With dV/dt = 0.6 and h = 2: 0.6 = π·dh/dt, so dh/dt = 0.6/π ≈ 0.191 metres per minute.
        (D) Slower: dh/dt = 0.6/((π/4)h²) = 2.4/(πh²), which decreases as h increases, because the surface of the water gets wider as the cone fills.
      explanation: |
        Six points. (A) 1 point for V = 4πh, 1 point for dh/dt = −0.15/π ≈ −0.048 m per minute (negative sign, or the word "falling", and units required). (B) 1 point for the fixed radius making dh/dt independent of h. (C) 1 point for substituting r = h/2 to get πh³/12, 1 point for dh/dt = 0.6/π ≈ 0.191 m per minute. (D) 1 point for "slower" with a reason from dh/dt = 2.4/(πh²) or from the widening surface.
