    - slug: apcalcab-u04-w15-q19
      type: numeric
      topic_code: "4.5"
      source: "AP Calculus CED, Topic 4.5"
      points: 1
      prompt: |
        A hypothetical kite flies at a constant height of 30 metres and moves horizontally away from the person holding its string at 2 metres per second. Assuming the string is straight, how fast, in metres per second, is string being let out when 50 metres of string are out?
      answer: { value: 1.6, tolerance: 0.001 }
      explanation: |
        s² = x² + 30². When s = 50, x = 40. Then s·ds/dt = x·dx/dt gives ds/dt = (40/50)(2) = 1.6 metres per second.
