    - slug: apcalcab-u04-w15-q21
      type: short_answer
      topic_code: "4.5"
      source: "AP Calculus CED, Topic 4.5"
      points: 3
      prompt: |
        A hypothetical water trough is 4 metres long. Its ends are isosceles triangles, vertex down, 2 metres wide at the top and 1 metre deep. Water is poured in at 0.2 cubic metres per minute.

        (a) Show that when the water is h metres deep, the volume of water is V = 4h².
        (b) How fast is the water level rising when the water is 0.5 metres deep? Include units.
        (c) Explain, using your work, whether the level rises faster or slower when the water is 0.8 metres deep.
      answer: |
        (a) By similar triangles the width of the water's surface w satisfies w/h = 2/1, so w = 2h. The wet end has area (1/2)(2h)(h) = h², and V = 4h².
        (b) dV/dt = 8h·dh/dt. With dV/dt = 0.2 and h = 0.5: 0.2 = 4·dh/dt, so dh/dt = 0.05 metres per minute.
        (c) Slower: dh/dt = 0.2/(8h) decreases as h increases; at h = 0.8 it is 0.2/6.4 = 0.03125 m per minute.
      explanation: |
        Three points, one per part. (a) w = 2h from similar triangles and V = 4h². (b) dV/dt = 8h·dh/dt and 0.05 m per minute with units. (c) slower, supported by dh/dt = 0.2/(8h) or the value at h = 0.8.
    - slug: apcalcab-u04-w15-q22
      type: short_answer
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 2
      prompt: |
        A particle moves along the x-axis with position x(t) = t³ − 3t² − 9t + 2 metres, for t ≥ 0 seconds.

        (a) On what interval is the particle moving to the left? Justify.
        (b) Is the particle speeding up or slowing down at t = 2? Justify.
      answer: |
        (a) v(t) = 3t² − 6t − 9 = 3(t − 3)(t + 1). For t ≥ 0, v(t) < 0 when 0 ≤ t < 3, so the particle moves left on [0, 3).
        (b) v(2) = 12 − 12 − 9 = −9 m/s and a(t) = 6t − 6 gives a(2) = 6 m/s². Velocity and acceleration have opposite signs, so the particle is slowing down.
      explanation: |
        Two points. (a) 1 point for 0 ≤ t < 3 (or 0 < t < 3) with v(t) < 0 as the reason. (b) 1 point for slowing down because v(2) < 0 and a(2) > 0.
    - slug: apcalcab-u04-w15-q23
      type: long_answer
      topic_code: "4.5"
      source: "AP Calculus CED, Topic 4.5"
      points: 6
      prompt: |
        A hypothetical aircraft flies at a constant altitude of 6 kilometres on a straight path that passes directly over a radar station. The aircraft approaches the station at 480 kilometres per hour. Let x be the horizontal distance from the aircraft to the point directly above the station, s the straight-line distance from the station to the aircraft, and θ the angle of elevation from the station to the aircraft.

        (A) Find the rate at which s is changing when s = 10 km. Include units, and say whether s is increasing or decreasing.

        (B) Find the rate at which θ is changing at that same moment. Include units.

        (C) Explain what the sign of your answer to (B) means in context.

        (D) What is ds/dt at the moment the aircraft is directly over the station? Explain why this makes sense.
      answer: |
        (A) s² = x² + 6². When s = 10, x = 8. Differentiating, s·ds/dt = x·dx/dt, with dx/dt = −480 (x is shrinking). ds/dt = (8/10)(−480) = −384 km/h: the distance is decreasing at 384 km per hour.
        (B) tan θ = 6/x, so sec²θ·dθ/dt = −(6/x²)·dx/dt. At x = 8, sec θ = s/x = 10/8, so sec²θ = 100/64. Then dθ/dt = [−(6/64)(−480)]/(100/64) = 2880/100 = 28.8 radians per hour.
        (C) dθ/dt > 0: the angle of elevation is increasing, so the radar must tilt upward faster to follow the aircraft as it approaches.
        (D) At x = 0, ds/dt = (x/s)·dx/dt = (0/6)(−480) = 0. Directly overhead the distance is at its minimum, 6 km: it has stopped decreasing and is about to start increasing, so its rate is momentarily 0.
      explanation: |
        Six points. (A) 1 point for the Pythagorean relation differentiated correctly, 1 point for −384 km per hour (or "decreasing at 384 km/h"). (B) 1 point for differentiating tan θ = 6/x (or an equivalent trigonometric relation) with sec²θ·dθ/dt, 1 point for 28.8 radians per hour. (C) 1 point for interpreting the positive sign as the angle increasing. (D) 1 point for ds/dt = 0 with the explanation that the distance reaches its minimum directly overhead.
