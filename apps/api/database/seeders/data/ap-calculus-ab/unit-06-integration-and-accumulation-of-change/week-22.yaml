    - slug: apcalcab-u06-w22-q21
      type: short_answer
      topic_code: "5.1"
      source: "AP Calculus CED, Topic 5.1"
      points: 3
      prompt: |
        The temperature of a hypothetical cup of cocoa being reheated is T(t) degrees Fahrenheit, t minutes after heating starts. T is differentiable, and selected values are shown.

        | t (minutes) | 0 | 5 | 12 | 20 |
        |---|---|---|---|---|
        | T(t) (°F) | 70 | 82 | 96 | 104 |

        (a) Find the average rate of change of T over 5 ≤ t ≤ 12, with units.
        (b) Must there be a time t in 5 < t < 12 at which T′(t) equals your answer to (a)? Justify.
        (c) Must there be a time t in 5 < t < 12 at which T(t) = 90? Justify.
      answer: |
        (a) (96 − 82)/(12 − 5) = 14/7 = 2 degrees Fahrenheit per minute.
        (b) Yes. T is differentiable, so it is continuous on [5, 12] and differentiable on (5, 12). By the Mean Value Theorem there is a c in (5, 12) with T′(c) = (T(12) − T(5))/(12 − 5) = 2.
        (c) Yes. T is continuous on [5, 12] (differentiable implies continuous) and T(5) = 82 < 90 < 96 = T(12), so by the Intermediate Value Theorem there is a t in (5, 12) with T(t) = 90.
      explanation: |
        Three points. (a) 1 point for 2 °F per minute with units. (b) 1 point for invoking the Mean Value Theorem with its hypotheses (continuous on the closed interval, differentiable on the open interval, both following from differentiability). (c) 1 point for invoking the Intermediate Value Theorem with continuity and 82 < 90 < 96.
    - slug: apcalcab-u06-w22-q22
      type: short_answer
      topic_code: "6.1"
      source: "AP Calculus CED, Topic 6.1"
      points: 3
      prompt: |
        A hypothetical cyclist's velocity v(t), in meters per second, is linear from v(0) = 2 to v(4) = 6, constant at 6 from t = 4 to t = 7, and then linear from v(7) = 6 down to v(9) = 0, with t in seconds.

        (a) Find the distance the cyclist travels from t = 0 to t = 9 seconds. Show the geometry you use.
        (b) Explain why the area under the velocity graph gives a distance, referring to units.
        (c) At what time on 0 ≤ t ≤ 9 has the cyclist traveled exactly half of the distance in (a)?
      answer: |
        (a) Trapezoid on [0, 4]: 4 · (2 + 6)/2 = 16 m. Rectangle on [4, 7]: 3 · 6 = 18 m. Triangle on [7, 9]: ½ · 2 · 6 = 6 m. Total 16 + 18 + 6 = 40 meters.
        (b) Each thin strip has height in meters per second and width in seconds, so its area is (m/s)(s) = meters, the distance covered in that short time; adding the strips accumulates the distance. Since v ≥ 0, the net change in position equals the distance traveled.
        (c) Half is 20 m. By t = 4 the cyclist has gone 16 m, and from then on travels 6 m each second, so 4 more meters takes 4/6 = 2/3 s: t = 4 + 2/3 = 14/3 ≈ 4.667 seconds.
      explanation: |
        Three points, one per part. (a) 40 meters with the three regions shown. (b) the units argument (m/s times s gives m) tied to accumulation. (c) t = 14/3 seconds (about 4.667), found from 16 m by t = 4 plus 4 m at 6 m/s.
    - slug: apcalcab-u06-w22-q23
      type: long_answer
      topic_code: "6.2"
      source: "AP Calculus CED, Topic 6.2"
      points: 6
      prompt: |
        Visitors enter a hypothetical museum at a rate of E(t) people per hour, where t is the number of hours after the museum opens. E is continuous, increasing on 0 ≤ t ≤ 4 and decreasing on 4 ≤ t ≤ 8. Selected values are shown.

        | t (hours) | 0 | 1 | 3 | 4 | 7 | 8 |
        |---|---|---|---|---|---|---|
        | E(t) (people per hour) | 120 | 180 | 260 | 300 | 210 | 150 |

        (A) In the context of the problem, explain what the area between the graph of E and the t-axis on 0 ≤ t ≤ 8 represents, and give its units.

        (B) Use a left Riemann sum with the five subintervals indicated by the table to approximate the number of people who enter during the first 8 hours.

        (C) Use a trapezoidal sum with the same five subintervals to approximate the same quantity.

        (D) Using the left Riemann sum on the three subintervals of 0 ≤ t ≤ 4 only, approximate the number of people who enter during the first 4 hours. Is this approximation an overestimate or an underestimate? Explain.
      answer: |
        (A) It represents the total number of people who enter the museum during the first 8 hours after it opens. Units: (people per hour) × (hours) = people.
        (B) Widths 1, 2, 1, 3, 1. L = 120·1 + 180·2 + 260·1 + 300·3 + 210·1 = 120 + 360 + 260 + 900 + 210 = 1850 people.
        (C) T = 1·(120 + 180)/2 + 2·(180 + 260)/2 + 1·(260 + 300)/2 + 3·(300 + 210)/2 + 1·(210 + 150)/2 = 150 + 440 + 280 + 765 + 180 = 1815 people.
        (D) 120·1 + 180·2 + 260·1 = 740 people. It is an underestimate: E is increasing on 0 ≤ t ≤ 4, so on each subinterval the left endpoint gives the smallest value of E and each rectangle lies below the graph.
      explanation: |
        Six points. (A) 1 point for the interpretation (number of people entering over the 8 hours) and 1 point for the units, people. (B) 1 point for 1850 with the unequal widths used correctly. (C) 1 point for 1815. (D) 1 point for 740 and 1 point for "underestimate" justified by E increasing on the interval (left endpoints are the minimum heights). A verdict without the increasing reason earns no point for the justification.
