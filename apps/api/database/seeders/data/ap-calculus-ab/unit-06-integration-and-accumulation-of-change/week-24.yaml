      type: short_answer
      topic_code: "6.6"
      source: "AP Calculus CED, Topic 6.6"
      points: 3
      prompt: |
        Let f(x) = x² for x ≤ 1 and f(x) = 2x − 1 for x > 1. (The function is continuous at x = 1.)

        (a) Evaluate ∫ from −1 to 1 of f(x) dx.
        (b) Evaluate ∫ from 1 to 3 of f(x) dx.
        (c) Find ∫ from −1 to 3 of f(x) dx, naming the property of definite integrals that you use.
      answer: |
        (a) ∫ from −1 to 1 of x² dx = x³/3 from −1 to 1 = 1/3 − (−1/3) = 2/3.
        (b) ∫ from 1 to 3 of (2x − 1) dx = (x² − x) from 1 to 3 = (9 − 3) − (1 − 1) = 6.
        (c) By additivity over adjacent intervals, ∫ from −1 to 3 of f = ∫ from −1 to 1 of f + ∫ from 1 to 3 of f = 2/3 + 6 = 20/3.
      explanation: |
        Three points, one per part. (a) 2/3 with the antiderivative evaluated at both limits. (b) 6. (c) 20/3 (about 6.667) with the splitting (additivity) property named or clearly used.
