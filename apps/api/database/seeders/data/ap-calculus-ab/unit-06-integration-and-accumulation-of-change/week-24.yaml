      prompt: |
        A hypothetical farmer has 120 meters of fencing to enclose a rectangular plot beside a straight river. No fence is needed along the river. What is the largest area, in square meters, that the plot can have?
      answer: { value: 1800, tolerance: 0 }
      explanation: |
        With the two sides perpendicular to the river each w meters long, the side parallel to the river is 120 − 2w, so A(w) = w(120 − 2w) for 0 < w < 60. A′(w) = 120 − 4w = 0 at w = 30, and A″(w) = −4 < 0, so this is the maximum: A(30) = 30 · 60 = 1800 square meters.
