      type: short_answer
      topic_code: "4.3"
      source: "AP Calculus CED, Topic 4.3"
      points: 3
      prompt: |
        The number of hypothetical fish in a pond is modeled by P(t) = 200 + 30t − t², where t is measured in months, for 0 ≤ t ≤ 20.

        (a) Find P′(5) and interpret it in context, with units.
        (b) Find the time when P′(t) = 0 and explain what happens to the fish population at that time.
        (c) Find the average rate of change of P over 0 ≤ t ≤ 10, with units.
      answer: |
        (a) P′(t) = 30 − 2t, so P′(5) = 20 fish per month: at t = 5 months the population is increasing at a rate of 20 fish per month.
        (b) P′(t) = 0 at t = 15. P′ changes from positive to negative there, so the population stops increasing and starts decreasing: it reaches its maximum, P(15) = 425 fish.
        (c) P(10) = 200 + 300 − 100 = 400 and P(0) = 200, so the average rate is (400 − 200)/10 = 20 fish per month.
      explanation: |
        Three points, one per part. (a) 20 fish per month with an interpretation that says "rate at t = 5". (b) t = 15 with the sign change giving a maximum (the value 425 is not required). (c) 20 fish per month with units.
