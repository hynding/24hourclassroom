      type: long_answer
      topic_code: "6.5"
      source: "AP Calculus CED, Topic 6.5"
      points: 6
      prompt: |
        A hypothetical tank holds 50 liters of water at t = 0. For 0 ≤ t ≤ 8 minutes, water flows in and out at a net rate of R(t) liters per minute. The graph of R consists of three line segments joining the points (0, 6), (2, 6), (5, −3) and (8, 0). Let W(t) be the number of liters of water in the tank at time t.

        (A) Write an expression for W(t) involving an integral, and find W(8).

        (B) At what time t in 0 ≤ t ≤ 8 is the amount of water in the tank greatest? Justify your answer.

        (C) Find W′(3). Interpret its meaning in context, with units.

        (D) Is the graph of W concave up or concave down at t = 6? Give a reason, and explain what it means about the water.

        (E) Must the tank hold exactly 60 liters at some time t in 0 < t < 4? Justify.
      answer: |
        (A) W(t) = 50 + ∫ from 0 to t of R(s) ds. R crosses zero at t = 4. Signed areas: [0, 2] rectangle 12; [2, 4] triangle +6; [4, 5] triangle −1.5; [5, 8] triangle −4.5. W(8) = 50 + 12 + 6 − 1.5 − 4.5 = 62 liters.
        (B) W′(t) = R(t), which changes from positive to negative only at t = 4. Candidates: W(0) = 50, W(4) = 50 + 18 = 68, W(8) = 62. The water is greatest at t = 4 minutes (68 liters).
        (C) W′(3) = R(3) = 3 liters per minute (on the segment from (2, 6) to (5, −3), R(3) = 6 − 3 = 3). At t = 3 minutes, the amount of water is increasing at 3 liters per minute.
        (D) Concave up: W″(t) = R′(t), and R is increasing on 5 < t < 8 (slope 1), so W″(6) = 1 > 0. The water is still draining (R(6) = −2 < 0), but it is draining more and more slowly.
        (E) Yes. W is continuous because it is differentiable (W′ = R). W(0) = 50 and W(4) = 68, and 50 < 60 < 68, so by the Intermediate Value Theorem W(t) = 60 for some t in (0, 4).
      explanation: |
        Six points. (A) 1 point for the expression and W(8) = 62 with signed areas. (B) 1 point for t = 4 justified by a Candidates Test (W(0), W(4), W(8)) or by W′ = R changing from positive to negative with a global argument. (C) 1 point for 3 liters per minute with an interpretation stating the amount is increasing at t = 3. (D) 1 point for concave up with R increasing (W″ = R′ > 0) and an interpretation. (E) 1 point for continuity of W, the values 50 and 68 and the Intermediate Value Theorem; 1 point for a fully correct conclusion with the inequality 50 < 60 < 68 stated.
