      answer: |
        (a) a(t) = v′(t) = 6t − 12, so a(2) = 0 meters per second per second.
        (b) v(t) = 3(t² − 4t + 3) = 3(t − 1)(t − 3) = 0 at t = 1 and t = 3 seconds.
        (c) v(4) = 48 − 48 + 9 = 9 > 0 and a(4) = 24 − 12 = 12 > 0. Velocity and acceleration have the same sign, so the speed is increasing at t = 4.
      explanation: |
        Three points, one per part. (a) a(2) = 0. (b) both t = 1 and t = 3. (c) "increasing" with the signs of both v(4) and a(4) compared; a conclusion from a(4) alone earns no point.
    - slug: apcalcab-u06-w25-q22
      type: short_answer
      topic_code: "6.9"
      source: "AP Calculus CED, Topic 6.9"
      points: 3
      prompt: |
        Evaluate ∫ from 0 to 4 of x/√(2x + 1) dx using the substitution u = 2x + 1.

        (a) Express x and dx in terms of u and du, and find the new limits of integration.
        (b) Write the integral entirely in terms of u.
        (c) Evaluate the integral.
      answer: |
        (a) u = 2x + 1 gives x = (u − 1)/2 and dx = du/2. When x = 0, u = 1; when x = 4, u = 9.
        (b) ∫ from 1 to 9 of ((u − 1)/2) · u^(−1/2) · (1/2) du = (1/4) ∫ from 1 to 9 of (u^(1/2) − u^(−1/2)) du.
        (c) (1/4)[(2/3)u^(3/2) − 2u^(1/2)] from 1 to 9 = (1/4)[(18 − 6) − (2/3 − 2)] = (1/4)(12 + 4/3) = (1/4)(40/3) = 10/3.
      explanation: |
        Three points, one per part. (a) x = (u − 1)/2, dx = du/2 and limits 1 and 9. (b) a correct integrand in u with matching limits. (c) 10/3 (about 3.333).
    - slug: apcalcab-u06-w25-q23
      type: long_answer
      topic_code: "6.9"
      source: "AP Calculus CED, Topic 6.9"
      points: 6
      prompt: |
        Let f be a function with f′(x) = x√(x² + 9) for all x, and f(0) = 2.

        (A) Find ∫ x√(x² + 9) dx. Show the substitution you use.

        (B) Evaluate ∫ from 0 to 4 of x√(x² + 9) dx, changing the limits of integration.

        (C) Find f(x).

        (D) Use your answer to (B) and the value f(0) = 2 to find f(4), and confirm that it agrees with your answer to (C).
      answer: |
        (A) u = x² + 9, du = 2x dx, so x dx = du/2: (1/2) ∫ u^(1/2) du = (1/2)(2/3)u^(3/2) + C = (1/3)(x² + 9)^(3/2) + C.
        (B) When x = 0, u = 9; when x = 4, u = 25. (1/2) ∫ from 9 to 25 of u^(1/2) du = (1/3)(25^(3/2) − 9^(3/2)) = (1/3)(125 − 27) = 98/3.
        (C) f(x) = (1/3)(x² + 9)^(3/2) + C. f(0) = (1/3)(27) + C = 9 + C = 2, so C = −7 and f(x) = (1/3)(x² + 9)^(3/2) − 7.
        (D) f(4) = f(0) + ∫ from 0 to 4 of f′(x) dx = 2 + 98/3 = 104/3. From (C), f(4) = 125/3 − 7 = 104/3. They agree.
      explanation: |
        Six points. (A) 1 point for the substitution with du and the antiderivative including + C. (B) 1 point for the new limits 9 and 25 and 1 point for 98/3. (C) 1 point for using f(0) = 2 to find C = −7 and 1 point for the complete f(x). (D) 1 point for f(4) = 104/3 from the net change form, with the agreement checked.
