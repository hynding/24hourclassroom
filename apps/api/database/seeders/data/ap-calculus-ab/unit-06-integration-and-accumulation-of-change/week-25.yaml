      prompt: |
        A particle moves along the x-axis with velocity v(t) = 3t² − 12t + 9 for t ≥ 0, where t is in seconds and v(t) is in meters per second.

        (a) Find the acceleration of the particle at t = 2.
        (b) At what times is the particle at rest?
