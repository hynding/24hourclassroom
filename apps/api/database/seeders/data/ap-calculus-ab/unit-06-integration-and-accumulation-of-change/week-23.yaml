      prompt: |
        The graph of a continuous function f on −1 ≤ t ≤ 5 consists of three line segments joining the points (−1, 3), (1, −1), (3, −1) and (5, 3). Let h(x) = ∫ from −1 to x of f(t) dt.

        (A) Find h(1) and h(5).

        (B) Find h′(2) and h″(4).

        (C) Find each x in −1 < x < 5 at which h has a relative extremum. Classify each and justify your answers.

        (D) Find the absolute maximum value of h on −1 ≤ x ≤ 5. Justify your answer.
      answer: |
        (A) f crosses zero at t = 0.5 (on the first segment) and at t = 3.5 (on the last). h(1) = ½ · 1.5 · 3 − ½ · 0.5 · 1 = 2.25 − 0.25 = 2. On [1, 3] the rectangle below the axis gives −2, so h(3) = 0; on [3, 5], −0.25 + 2.25 = 2, so h(5) = 2.
        (B) h′(x) = f(x), so h′(2) = f(2) = −1. h″(x) = f′(x), and the segment from (3, −1) to (5, 3) has slope 2, so h″(4) = 2.
        (C) h′ = f changes from positive to negative at x = 0.5, so h has a relative maximum there. h′ = f changes from negative to positive at x = 3.5, so h has a relative minimum there.
        (D) Candidates: h(−1) = 0, h(0.5) = 2.25, h(3.5) = h(3) − 0.25 = −0.25, h(5) = 2. The absolute maximum value is 2.25, at x = 0.5.
      explanation: |
        Six points. (A) 1 point for h(1) = 2 and 1 point for h(5) = 2. (B) 1 point for both h′(2) = −1 and h″(4) = 2. (C) 1 point for the relative maximum at x = 0.5 and 1 point for the relative minimum at x = 3.5, each justified by the sign change of h′ = f. (D) 1 point for 2.25 using a Candidates Test that includes both endpoints and the critical points.
