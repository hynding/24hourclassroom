    - slug: apcalcab-u06-w26-q21
      type: short_answer
      topic_code: "6.5"
      source: "AP Calculus CED, Topic 6.5"
      points: 3
      prompt: |
        Let g(x) = ∫ from 0 to x of (t² − 1)/(t² + 1) dt for all real x.

        (a) On which interval or intervals is g decreasing? Justify.
        (b) Find the x-values of all relative extrema of g, and classify each. Justify.
        (c) Find the exact value of g(1). (Hint: divide first.)
      answer: |
        (a) g′(x) = (x² − 1)/(x² + 1). The denominator is always positive, so g′ < 0 exactly when x² < 1: g is decreasing on −1 < x < 1.
        (b) g′ changes from positive to negative at x = −1, so g has a relative maximum there; g′ changes from negative to positive at x = 1, so g has a relative minimum there.
        (c) (t² − 1)/(t² + 1) = 1 − 2/(t² + 1). g(1) = (t − 2 arctan t) from 0 to 1 = 1 − 2(π/4) = 1 − π/2.
      explanation: |
        Three points, one per part. (a) −1 < x < 1 with g′ = integrand and the sign argument. (b) relative maximum at x = −1 and relative minimum at x = 1, each with the sign change of g′. (c) 1 − π/2 (about −0.571) from the divided form.
    - slug: apcalcab-u06-w26-q22
      type: short_answer
      topic_code: "6.10"
      source: "AP Calculus CED, Topic 6.10"
      points: 3
      prompt: |
        Consider ∫ (x³ + 2x² − x + 1)/(x + 2) dx.

        (a) Use polynomial long division to rewrite the integrand.
        (b) Find the indefinite integral.
        (c) Evaluate ∫ from 0 to 1 of (x³ + 2x² − x + 1)/(x + 2) dx. Give an exact answer.
      answer: |
        (a) x³ + 2x² − x + 1 = (x + 2)(x² − 1) + 3, so the integrand is x² − 1 + 3/(x + 2).
        (b) x³/3 − x + 3 ln |x + 2| + C.
        (c) (1/3 − 1 + 3 ln 3) − (0 − 0 + 3 ln 2) = −2/3 + 3 ln 3 − 3 ln 2 = −2/3 + 3 ln(3/2) ≈ 0.550.
      explanation: |
        Three points, one per part. (a) quotient x² − 1 and remainder 3. (b) the antiderivative with + C. (c) −2/3 + 3 ln(3/2) or an equivalent exact form.
    - slug: apcalcab-u06-w26-q23
      type: long_answer
      topic_code: "6.14"
      source: "AP Calculus CED, Topic 6.14"
      points: 6
      prompt: |
        Each integral below involves the quadratic x² + 4x + 7. Choose an appropriate technique for each, and show your work.

        (A) Find ∫ (x² + 4x + 7)/(x + 2) dx.

        (B) Find ∫ (x + 2)/(x² + 4x + 7) dx.

        (C) Find ∫ 1/(x² + 4x + 7) dx.

        (D) Use your answers to (B) and (C) to find ∫ (x + 5)/(x² + 4x + 7) dx.
      answer: |
        (A) Long division: x² + 4x + 7 = (x + 2)(x + 2) + 3, so the integrand is x + 2 + 3/(x + 2), and the integral is x²/2 + 2x + 3 ln |x + 2| + C.
        (B) Substitution: u = x² + 4x + 7, du = (2x + 4) dx = 2(x + 2) dx. So (1/2) ∫ du/u = (1/2) ln(x² + 4x + 7) + C (the quadratic is always positive).
        (C) Complete the square: x² + 4x + 7 = (x + 2)² + 3. With u = x + 2 and a = √3: (1/√3) arctan((x + 2)/√3) + C.
        (D) x + 5 = (x + 2) + 3, so the integral is (1/2) ln(x² + 4x + 7) + 3 · (1/√3) arctan((x + 2)/√3) + C = (1/2) ln(x² + 4x + 7) + √3 arctan((x + 2)/√3) + C.
      explanation: |
        Six points. (A) 1 point for the division (quotient x + 2, remainder 3) and 1 point for the antiderivative. (B) 1 point for the substitution with the factor 1/2 and the logarithm. (C) 1 point for the completed square (x + 2)² + 3 and 1 point for the arctangent with the constant 1/√3. (D) 1 point for splitting x + 5 = (x + 2) + 3 and combining correctly. Missing + C is penalised once in the whole question.
