unit: 6
description: |
  44 questions · about 90 minutes · every topic of Unit 6 (6.1 to 6.10 and 6.14): accumulation from a rate, Riemann
  and trapezoidal sums (including unequal widths), summation and definite integral notation, accumulation functions
  and both parts of the Fundamental Theorem of Calculus, properties of definite integrals, antiderivatives,
  substitution, long division and completing the square, and choosing a technique. Includes two shared-context sets
  of four questions (a reservoir inflow table and an accumulation function built from a graph), select-all,
  true/false, fill-in-the-blank and numeric items, two short-answer questions (3 points each) and two free-response
  questions in the AP style (9 points each: one calculator-active rate-in, rate-out context, one no-calculator
  analysis of an accumulation function). Items marked (Calculator.) need a graphing calculator; the rest are meant
  to be done by hand. Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the short answers and free-response items are graded by your
  teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a reservoir inflow table (6.2, 6.1, 6.5)
  - slug: apcalcab-u06-exam-q01
    type: multiple_choice
    topic_code: "6.2"
    source: "AP Calculus CED, Topic 6.2"
    points: 1
    stimulus: |
      Water flows into a hypothetical reservoir at a rate of R(t) cubic meters per hour, where t is measured in hours and R is continuous. The reservoir holds 5000 cubic meters at t = 0. Selected values of R are shown.

      | t (hours) | 0 | 3 | 5 | 9 | 12 |
      |---|---|---|---|---|---|
      | R(t) (m³ per hour) | 150 | 210 | 240 | 180 | 120 |
    prompt: |
      What is the left Riemann sum approximation of ∫ from 0 to 12 of R(t) dt, using the four subintervals indicated by the table?
    options:
      - "2190 m³"
      - "780 m³"
      - "2370 m³"
      - "2280 m³"
    option_explanations:
      - |
        2190 is the right Riemann sum, 210·3 + 240·2 + 180·4 + 120·3, which uses the right endpoint of each subinterval.
      - |
        780 adds the four left heights 150 + 210 + 240 + 180 without multiplying each by its width.
      - |
        Correct. The widths are 3, 2, 4 and 3, so L = 150·3 + 210·2 + 240·4 + 180·3 = 450 + 420 + 960 + 540 = 2370 m³.
      - |
        2280 is the trapezoidal sum, the average of the left sum 2370 and the right sum 2190.
    answer: 2
  - slug: apcalcab-u06-exam-q02
    type: multiple_choice
    topic_code: "6.1"
    source: "AP Calculus CED, Topic 6.1"
    points: 1
    stimulus: |
      Water flows into a hypothetical reservoir at a rate of R(t) cubic meters per hour, where t is measured in hours and R is continuous. The reservoir holds 5000 cubic meters at t = 0. Selected values of R are shown.

      | t (hours) | 0 | 3 | 5 | 9 | 12 |
      |---|---|---|---|---|---|
      | R(t) (m³ per hour) | 150 | 210 | 240 | 180 | 120 |
    prompt: |
      Which statement best describes the meaning of ∫ from 0 to 12 of R(t) dt?
    options:
      - "The number of cubic meters of water that flow into the reservoir from t = 0 to t = 12 hours"
      - "The number of cubic meters of water in the reservoir at t = 12 hours"
      - "The rate, in cubic meters per hour, at which water flows into the reservoir at t = 12 hours"
      - "The average rate, in cubic meters per hour, at which water flows into the reservoir over the 12 hours"
    option_explanations:
      - |
        Correct. The integral of a rate over an interval is the accumulated change: (m³ per hour) × (hours) = m³ of water added during the 12 hours.
      - |
        The integral gives only the water added; the amount in the reservoir also includes the 5000 m³ present at t = 0.
      - |
        The rate at t = 12 is R(12) = 120 m³ per hour; the integral is an amount, not a rate.
      - |
        The average rate is the integral divided by 12; the integral itself is measured in cubic meters.
    answer: 0
  - slug: apcalcab-u06-exam-q03
    type: numeric
    topic_code: "6.2"
    source: "AP Calculus CED, Topic 6.2"
    points: 1
    stimulus: |
      Water flows into a hypothetical reservoir at a rate of R(t) cubic meters per hour, where t is measured in hours and R is continuous. The reservoir holds 5000 cubic meters at t = 0. Selected values of R are shown.

      | t (hours) | 0 | 3 | 5 | 9 | 12 |
      |---|---|---|---|---|---|
      | R(t) (m³ per hour) | 150 | 210 | 240 | 180 | 120 |
    prompt: |
      Using a trapezoidal sum with the four subintervals indicated by the table, approximate ∫ from 0 to 12 of R(t) dt, in cubic meters.
    answer: { value: 2280, tolerance: 0.001 }
    explanation: |
      T = 3·(150 + 210)/2 + 2·(210 + 240)/2 + 4·(240 + 180)/2 + 3·(180 + 120)/2 = 540 + 450 + 840 + 450 = 2280 m³.
  - slug: apcalcab-u06-exam-q04
    type: multiple_choice
    topic_code: "6.5"
    source: "AP Calculus CED, Topic 6.5"
    points: 1
    stimulus: |
      Water flows into a hypothetical reservoir at a rate of R(t) cubic meters per hour, where t is measured in hours and R is continuous. The reservoir holds 5000 cubic meters at t = 0. Selected values of R are shown.

      | t (hours) | 0 | 3 | 5 | 9 | 12 |
      |---|---|---|---|---|---|
      | R(t) (m³ per hour) | 150 | 210 | 240 | 180 | 120 |
    prompt: |
      No water leaves the reservoir during these 12 hours. Using the trapezoidal sum, what is the best estimate of the amount of water in the reservoir at t = 12?
    options:
      - "2280 m³"
      - "7280 m³"
      - "7370 m³"
      - "5120 m³"
    option_explanations:
      - |
        2280 m³ is only the water added; the 5000 m³ already in the reservoir at t = 0 must be included.
      - |
        Correct. Amount = initial amount + accumulated inflow ≈ 5000 + 2280 = 7280 m³.
      - |
        7370 uses the left Riemann sum 2370, but the question asks for the estimate based on the trapezoidal sum.
      - |
        5120 adds the rate R(12) = 120 to the initial amount; a rate must be accumulated over time, not added to an amount.
    answer: 1
  # ---- Stimulus set B: an accumulation function built from a graph (6.4, 6.5)
  - slug: apcalcab-u06-exam-q05
    type: multiple_choice
    topic_code: "6.4"
    source: "AP Calculus CED, Topic 6.4"
    points: 1
    stimulus: |
      A continuous function f is defined on 0 ≤ t ≤ 8. On 0 ≤ t ≤ 4 its graph is the lower half of the circle of radius 2 centered at (2, 0), so f(t) = −√(4 − (t − 2)²). On 4 ≤ t ≤ 8 its graph consists of two line segments joining (4, 0) to (6, 2) and (6, 2) to (8, 2). Let g(x) = ∫ from 0 to x of f(t) dt.
    prompt: |
      What is the value of g(4)?
    options:
      - "2π"
      - "−4π"
      - "−π"
      - "−2π"
    option_explanations:
      - |
        2π is the area of the half-disk, but the region lies below the t-axis, so the integral is negative.
      - |
        −4π uses the area of the whole circle (π · 2² = 4π); only the lower half lies between t = 0 and t = 4.
      - |
        −π is half of the correct value, as if the region were a quarter circle; from t = 0 to t = 4 the whole lower half-disk is covered.
      - |
        Correct. The region between the graph and the t-axis on [0, 4] is a half-disk of radius 2 below the axis, with area (1/2)π(2²) = 2π, so g(4) = −2π.
    answer: 3
  - slug: apcalcab-u06-exam-q06
    type: multiple_choice
    topic_code: "6.5"
    source: "AP Calculus CED, Topic 6.5"
    points: 1
    stimulus: |
      A continuous function f is defined on 0 ≤ t ≤ 8. On 0 ≤ t ≤ 4 its graph is the lower half of the circle of radius 2 centered at (2, 0), so f(t) = −√(4 − (t − 2)²). On 4 ≤ t ≤ 8 its graph consists of two line segments joining (4, 0) to (6, 2) and (6, 2) to (8, 2). Let g(x) = ∫ from 0 to x of f(t) dt.
    prompt: |
      At what value of x does g attain its absolute maximum on the interval 0 ≤ x ≤ 8?
    options:
      - "x = 0"
      - "x = 8"
      - "x = 4"
      - "x = 6"
    option_explanations:
      - |
        Correct. g decreases on 0 < x < 4 (f < 0) and increases on 4 < x < 8 (f > 0). Candidates: g(0) = 0 and g(8) = −2π + 2 + 4 = 6 − 2π ≈ −0.28. The larger is g(0) = 0.
      - |
        g increases from x = 4 to x = 8, but it starts that climb at −2π and reaches only 6 − 2π ≈ −0.28, which is less than g(0) = 0.
      - |
        At x = 4, g′ = f changes from negative to positive, which makes g(4) = −2π the absolute minimum, not the maximum.
      - |
        f is still positive after x = 6, so g keeps increasing there; x = 6 is not an extremum of g.
    answer: 0
  - slug: apcalcab-u06-exam-q07
    type: multiple_choice
    topic_code: "6.4"
    source: "AP Calculus CED, Topic 6.4"
    points: 1
    stimulus: |
      A continuous function f is defined on 0 ≤ t ≤ 8. On 0 ≤ t ≤ 4 its graph is the lower half of the circle of radius 2 centered at (2, 0), so f(t) = −√(4 − (t − 2)²). On 4 ≤ t ≤ 8 its graph consists of two line segments joining (4, 0) to (6, 2) and (6, 2) to (8, 2). Let g(x) = ∫ from 0 to x of f(t) dt.
    prompt: |
      What is the value of g″(7)?
    options:
      - "2"
      - "1"
      - "0"
      - "4 − 2π"
    option_explanations:
      - |
        2 is f(7) = g′(7), the first derivative of g, not the second.
      - |
        1 is the slope of the segment from (4, 0) to (6, 2), which gives g″ on 4 < x < 6, not at x = 7.
      - |
        Correct. g″(x) = f′(x), and on 6 < t < 8 the graph of f is horizontal, so f′(7) = 0.
      - |
        4 − 2π is g(7) = −2π + 2 + 2, the accumulated value, not a derivative.
    answer: 2
  - slug: apcalcab-u06-exam-q08
    type: multiple_choice
    topic_code: "6.5"
    source: "AP Calculus CED, Topic 6.5"
    points: 1
    stimulus: |
      A continuous function f is defined on 0 ≤ t ≤ 8. On 0 ≤ t ≤ 4 its graph is the lower half of the circle of radius 2 centered at (2, 0), so f(t) = −√(4 − (t − 2)²). On 4 ≤ t ≤ 8 its graph consists of two line segments joining (4, 0) to (6, 2) and (6, 2) to (8, 2). Let g(x) = ∫ from 0 to x of f(t) dt.
    prompt: |
      On which open interval is the graph of g concave up?
    options:
      - "4 < x < 8"
      - "2 < x < 6"
      - "0 < x < 2"
      - "2 < x < 4 only"
    option_explanations:
      - |
        On 4 < x < 8, f > 0, which makes g increasing; concavity depends on whether f is increasing, and f is constant on 6 < x < 8.
      - |
        Correct. g′ = f, and f increases from its lowest point at t = 2 up through t = 4 to t = 6. Since g′ is increasing on 2 < x < 6, g is concave up there.
      - |
        On 0 < x < 2 the semicircle falls toward its lowest point, so f is decreasing and g is concave down.
      - |
        f keeps increasing after t = 4 along the segment to (6, 2), so the concave up interval continues to x = 6.
    answer: 1
  # ---- Independent items
  - slug: apcalcab-u06-exam-q09
    type: multiple_choice
    topic_code: "6.1"
    source: "AP Calculus CED, Topic 6.1"
    points: 1
    prompt: |
      A particle moves along a line with velocity v(t) = 4 − 2t meters per second for 0 ≤ t ≤ 4. What is the total distance the particle travels over this interval?
    options:
      - "0 meters"
      - "4 meters"
      - "−4 meters"
      - "8 meters"
    option_explanations:
      - |
        0 is the displacement: the area above the axis (4) and the area below (4) cancel. Total distance adds the areas.
      - |
        4 meters is the distance for 0 ≤ t ≤ 2 only; the particle also moves 4 meters back for 2 ≤ t ≤ 4.
      - |
        −4 is the signed area on 2 ≤ t ≤ 4 alone; distance is never negative.
      - |
        Correct. v > 0 on 0 < t < 2 (triangle with area ½ · 2 · 4 = 4) and v < 0 on 2 < t < 4 (triangle with area 4 below). Distance = 4 + 4 = 8 meters.
    answer: 3
  - slug: apcalcab-u06-exam-q10
    type: multiple_choice
    topic_code: "6.2"
    source: "AP Calculus CED, Topic 6.2"
    points: 1
    prompt: |
      What is the midpoint Riemann sum for f(x) = x³ on [0, 4] using two subintervals of equal width?
    options:
      - "16"
      - "56"
      - "144"
      - "80"
    option_explanations:
      - |
        16 is the left Riemann sum, 2(f(0) + f(2)) = 2(0 + 8).
      - |
        Correct. Δx = 2 and the midpoints are 1 and 3, so the sum is 2(1³ + 3³) = 2(1 + 27) = 56.
      - |
        144 is the right Riemann sum, 2(f(2) + f(4)) = 2(8 + 64).
      - |
        80 is the trapezoidal sum, the average of the left and right sums.
    answer: 1
  - slug: apcalcab-u06-exam-q11
    type: multiple_choice
    topic_code: "6.2"
    source: "AP Calculus CED, Topic 6.2"
    points: 1
    prompt: |
      A function f is positive and concave up on [a, b]. Let I = ∫ from a to b of f(x) dx, and let M and T be the midpoint and trapezoidal sums with the same four equal subintervals. Which ordering must be true?
    options:
      - "M < I < T"
      - "T < I < M"
      - "I < M < T"
      - "M < T < I"
    option_explanations:
      - |
        Correct. For a concave up graph each chord lies above the curve, so T overestimates, and each midpoint rectangle equals the area under a tangent line, which lies below the curve, so M underestimates.
      - |
        This is the ordering for a concave down graph, where the chords lie below the curve and the tangent lines above it.
      - |
        The midpoint sum underestimates for a concave up graph, so M is below I, not above it.
      - |
        The trapezoidal sum overestimates for a concave up graph, so T is above I, not below it.
    answer: 0
  - slug: apcalcab-u06-exam-q12
    type: multiple_choice
    topic_code: "6.3"
    source: "AP Calculus CED, Topic 6.3"
    points: 1
    prompt: |
      Which definite integral equals lim (n→∞) ∑ (k = 1 to n) (5/n)√(1 + 5k/n)?
    options:
      - "∫ from 0 to 5 of √x dx"
      - "∫ from 1 to 6 of √(1 + x) dx"
      - "∫ from 1 to 6 of √x dx"
      - "∫ from 0 to 1 of √(1 + 5x) dx"
    option_explanations:
      - |
        The sample points 1 + 5k/n run from 1 to 6, so with integrand √x the limits must be 1 and 6 (or the integrand must be √(1 + x) on [0, 5]).
      - |
        This adds the 1 twice: the sample point x = 1 + 5k/n already includes it, so the integrand on [1, 6] is √x.
      - |
        Correct. Δx = 5/n and xₖ = 1 + 5k/n run over [1, 6], with heights √xₖ, so the limit is ∫ from 1 to 6 of √x dx.
      - |
        This integral has the right shape inside but on [0, 1] its Riemann sums carry a width factor 1/n, not 5/n; its value is one fifth of the limit.
    answer: 2
  - slug: apcalcab-u06-exam-q13
    type: multiple_choice
    topic_code: "6.3"
    source: "AP Calculus CED, Topic 6.3"
    points: 1
    prompt: |
      What is the value of ∫ from −2 to 2 of √(4 − x²) dx?
    options:
      - "4π"
      - "π"
      - "8"
      - "2π"
    option_explanations:
      - |
        4π is the area of the whole circle of radius 2; the graph of √(4 − x²) is only the upper half.
      - |
        π is a quarter of the circle, the value of the integral from 0 to 2 only.
      - |
        8 is the area of the 4-by-2 rectangle that encloses the semicircle, not the semicircle itself.
      - |
        Correct. y = √(4 − x²) is the upper half of the circle x² + y² = 4, so the integral is the area of a half-disk: (1/2)π(2²) = 2π.
    answer: 3
  - slug: apcalcab-u06-exam-q14
    type: multiple_choice
    topic_code: "6.4"
    source: "AP Calculus CED, Topic 6.4"
    points: 1
    prompt: |
      If H(x) = ∫ from 0 to sin x of √(1 + t³) dt, what is H′(x)?
    options:
      - "√(1 + sin³x) · cos x"
      - "√(1 + sin³x)"
      - "√(1 + x³) · cos x"
      - "3 sin²x cos x/(2√(1 + sin³x))"
    option_explanations:
      - |
        Correct. Evaluate the integrand at the upper limit and multiply by its derivative: √(1 + (sin x)³) · cos x.
      - |
        This forgets the chain rule factor cos x, the derivative of the upper limit sin x.
      - |
        The integrand must be evaluated at the upper limit sin x, not at x.
      - |
        This differentiates the integrand √(1 + sin³x) instead of applying the Fundamental Theorem, which returns the integrand itself.
    answer: 0
  - slug: apcalcab-u06-exam-q15
    type: multiple_choice
    topic_code: "6.4"
    source: "AP Calculus CED, Topic 6.4"
    points: 1
    prompt: |
      Let F(x) = ∫ from 1 to x of √(t² + 8) dt. Which is an equation of the line tangent to the graph of F at x = 1?
    options:
      - "y = 3x"
      - "y = 3(x − 1)"
      - "y − 3 = 3(x − 1)"
      - "y = (1/3)(x − 1)"
    option_explanations:
      - |
        The slope 3 is right, but this line passes through (0, 0); the point of tangency is (1, F(1)) = (1, 0).
      - |
        Correct. F(1) = ∫ from 1 to 1 = 0 and F′(1) = √(1 + 8) = 3, so the tangent line is y − 0 = 3(x − 1).
      - |
        This uses F(1) = 3, confusing the value of F with its derivative; F(1) = 0 because the interval has no width.
      - |
        This takes the reciprocal of F′(1) = 3, which would be the slope of an inverse function, not of F.
    answer: 1
  - slug: apcalcab-u06-exam-q16
    type: multiple_choice
    topic_code: "6.6"
    source: "AP Calculus CED, Topic 6.6"
    points: 1
    prompt: |
      If ∫ from 1 to 4 of f(x) dx = 6 and ∫ from 4 to 1 of g(x) dx = 2, what is ∫ from 1 to 4 of (3f(x) + 2g(x)) dx?
    options:
      - "22"
      - "18"
      - "14"
      - "−14"
    option_explanations:
      - |
        22 uses ∫ from 1 to 4 of g = 2; the given integral runs from 4 to 1, so ∫ from 1 to 4 of g = −2.
      - |
        18 is 3 · 6 alone; the g term contributes 2 · (−2) = −4.
      - |
        Correct. ∫ from 1 to 4 of g = −∫ from 4 to 1 of g = −2, so 3(6) + 2(−2) = 18 − 4 = 14.
      - |
        This reverses the sign of the whole answer; only the g integral has its limits reversed.
    answer: 2
  - slug: apcalcab-u06-exam-q17
    type: multiple_choice
    topic_code: "6.6"
    source: "AP Calculus CED, Topic 6.6"
    points: 1
    prompt: |
      A continuous function f satisfies ∫ from −1 to 5 of f(x) dx = 8, ∫ from 2 to 5 of f(x) dx = 3 and ∫ from −1 to 0 of f(x) dx = 1. What is ∫ from 0 to 2 of f(x) dx?
    options:
      - "12"
      - "6"
      - "2"
      - "4"
    option_explanations:
      - |
        12 adds all three given integrals; the pieces [−1, 0] and [2, 5] must be subtracted from the whole interval [−1, 5].
      - |
        6 subtracts only one piece, 8 − 3 + 1; both [2, 5] and [−1, 0] lie inside [−1, 5] and are removed.
      - |
        2 subtracts ∫ from 2 to 5 twice (8 − 3 − 3); the three adjacent pieces [−1, 0], [0, 2], [2, 5] add to 8, so the missing piece is 8 − 1 − 3.
      - |
        Correct. ∫ from −1 to 0 + ∫ from 0 to 2 + ∫ from 2 to 5 = ∫ from −1 to 5, so 1 + ∫ from 0 to 2 of f + 3 = 8, giving 4.
    answer: 3
  - slug: apcalcab-u06-exam-q18
    type: multiple_choice
    topic_code: "6.7"
    source: "AP Calculus CED, Topic 6.7"
    points: 1
    prompt: |
      What is the value of ∫ from 0 to π of (sin x + cos x) dx?
    options:
      - "0"
      - "2"
      - "−2"
      - "π"
    option_explanations:
      - |
        0 is the cosine part alone (sin π − sin 0); the sine part contributes −cos π + cos 0 = 2.
      - |
        Correct. An antiderivative is −cos x + sin x. At π: −(−1) + 0 = 1. At 0: −1 + 0 = −1. The integral is 1 − (−1) = 2.
      - |
        −2 uses cos x as the antiderivative of sin x; the antiderivative is −cos x.
      - |
        π is the length of the interval; the integrand is not the constant 1.
    answer: 1
  - slug: apcalcab-u06-exam-q19
    type: multiple_choice
    topic_code: "6.7"
    source: "AP Calculus CED, Topic 6.7"
    points: 1
    prompt: |
      What is the value of ∫ from 1 to 9 of 1/√x dx?
    options:
      - "4"
      - "6"
      - "−2/3"
      - "52/3"
    option_explanations:
      - |
        Correct. ∫ x^(−1/2) dx = 2x^(1/2), so the integral is 2√9 − 2√1 = 6 − 2 = 4.
      - |
        6 is the antiderivative's value at 9 alone; its value at 1, which is 2, must be subtracted.
      - |
        −2/3 subtracts integrand values, 1/√9 − 1/√1 = 1/3 − 1; the theorem uses values of an antiderivative.
      - |
        52/3 uses (2/3)x^(3/2), the antiderivative of √x, not of 1/√x.
    answer: 0
  - slug: apcalcab-u06-exam-q20
    type: multiple_choice
    topic_code: "6.8"
    source: "AP Calculus CED, Topic 6.8"
    points: 1
    prompt: |
      ∫ (x − 1)(x + 3) dx =
    options:
      - "(x²/2 − x)(x²/2 + 3x) + C"
      - "2x + 2 + C"
      - "x³/3 + x² − 3x + C"
      - "x³/3 + 2x² − 3x + C"
    option_explanations:
      - |
        This integrates each factor and multiplies the results; antiderivatives do not split over products, so expand first.
      - |
        2x + 2 is the derivative of the product x² + 2x − 3, not an antiderivative.
      - |
        Correct. Expand to x² + 2x − 3 and integrate term by term: x³/3 + x² − 3x + C.
      - |
        The middle term 2x integrates to x², not 2x²: the power rule divides by the new exponent 2.
    answer: 2
  - slug: apcalcab-u06-exam-q21
    type: multiple_choice
    topic_code: "6.8"
    source: "AP Calculus CED, Topic 6.8"
    points: 1
    prompt: |
      ∫ (2/x + 3eˣ − 4 sin x) dx =
    options:
      - "−2/x² + 3eˣ − 4 cos x + C"
      - "2 ln |x| + 3eˣ − 4 cos x + C"
      - "2 ln |x| + 3xeˣ + 4 cos x + C"
      - "2 ln |x| + 3eˣ + 4 cos x + C"
    option_explanations:
      - |
        −2/x² is the derivative of 2/x, not its antiderivative, and the sign of the cosine term is also wrong.
      - |
        The antiderivative of sin x is −cos x, so −4 sin x integrates to +4 cos x, not −4 cos x.
      - |
        eˣ is its own antiderivative; no factor of x appears.
      - |
        Correct. ∫ 2/x dx = 2 ln |x|, ∫ 3eˣ dx = 3eˣ and ∫ −4 sin x dx = 4 cos x.
    answer: 3
  - slug: apcalcab-u06-exam-q22
    type: multiple_choice
    topic_code: "6.9"
    source: "AP Calculus CED, Topic 6.9"
    points: 1
    prompt: |
      ∫ sin x/cos³x dx =
    options:
      - "−1/(2cos²x) + C"
