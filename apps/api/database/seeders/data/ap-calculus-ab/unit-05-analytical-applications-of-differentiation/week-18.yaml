    - slug: apcalcab-u05-w18-q21
      type: short_answer
      topic_code: "5.4"
      source: "AP Calculus CED, Topic 5.4"
      points: 3
      prompt: |
        A function h is differentiable for all real numbers, and h′(x) = (x − 4)(x + 1)/(x² + 3).

        (a) Find the critical points of h.
        (b) For each critical point, decide whether h has a relative maximum, a relative minimum or neither there. Justify your answers.
        (c) On what intervals is h decreasing? Justify.
      answer: |
        (a) x² + 3 > 0, so h′ exists everywhere and h′(x) = 0 at x = −1 and x = 4.
        (b) Sign of h′: positive for x < −1, negative for −1 < x < 4, positive for x > 4. h has a relative maximum at x = −1 because h′ changes from positive to negative there, and a relative minimum at x = 4 because h′ changes from negative to positive there.
        (c) h is decreasing on −1 < x < 4 (or [−1, 4]) because h′(x) < 0 there.
      explanation: |
        Three points. (a) both critical points −1 and 4. (b) both classifications, each justified by the sign change of h′ at that point (a sign chart alone, with no sentence naming h′, earns the point only if the conclusion is stated for each point). (c) the interval with the reason h′ < 0.
    - slug: apcalcab-u05-w18-q22
      type: short_answer
      topic_code: "4.2"
      source: "AP Calculus CED, Topic 4.2"
      points: 3
      prompt: |
        A particle moves along the x-axis so that its position is s(t) = t³ − 6t² + 9t for 0 ≤ t ≤ 5.

        (a) For what values of t is the particle moving to the left? Justify.
        (b) Is the particle speeding up or slowing down at t = 2.5? Justify.
        (c) Find the total distance traveled by the particle from t = 0 to t = 3.
      answer: |
        (a) v(t) = 3t² − 12t + 9 = 3(t − 1)(t − 3). v(t) < 0 for 1 < t < 3, so the particle moves left on 1 < t < 3.
        (b) v(2.5) = 18.75 − 30 + 9 = −2.25 and a(t) = 6t − 12 gives a(2.5) = 3. Velocity and acceleration have opposite signs, so the particle is slowing down.
        (c) The particle turns at t = 1. s(0) = 0, s(1) = 4, s(3) = 0. Distance = |4 − 0| + |0 − 4| = 8.
      explanation: |
        Three points. (a) 1 < t < 3 with v(t) < 0 as the reason. (b) slowing down, with v(2.5) and a(2.5) of opposite signs. (c) 8, accounting for the turn at t = 1 (the displacement 0 earns nothing).
    - slug: apcalcab-u05-w18-q23
      type: long_answer
      topic_code: "5.5"
      source: "AP Calculus CED, Topic 5.5"
      points: 6
      prompt: |
        The population of a hypothetical bacteria culture is modeled by P(t) = t³ − 9t² + 24t + 10, where P(t) is in hundreds of bacteria and t is in hours, for 0 ≤ t ≤ 5.

        (A) On what intervals is the population increasing? Justify your answer.

        (B) Find the times at which P has a relative maximum or relative minimum on 0 < t < 5. Justify your answers.

        (C) Find the absolute maximum and absolute minimum populations on 0 ≤ t ≤ 5, and every time at which each occurs. Justify your answer.

        (D) Is there a time in (0, 5) at which the population is growing at exactly 400 bacteria per hour? Justify your answer.
      answer: |
        (A) P′(t) = 3t² − 18t + 24 = 3(t − 2)(t − 4). P′(t) > 0 for 0 < t < 2 and 4 < t < 5, so P is increasing on those intervals.
        (B) P′ changes from positive to negative at t = 2, so P has a relative maximum at t = 2. P′ changes from negative to positive at t = 4, so P has a relative minimum at t = 4.
        (C) Candidates: P(0) = 10, P(2) = 8 − 36 + 48 + 10 = 30, P(4) = 64 − 144 + 96 + 10 = 26, P(5) = 125 − 225 + 120 + 10 = 30. The absolute maximum is 30 hundred bacteria, at t = 2 and t = 5; the absolute minimum is 10 hundred bacteria, at t = 0.
        (D) Yes. P is a polynomial, so it is continuous on [0, 5] and differentiable on (0, 5). (P(5) − P(0))/(5 − 0) = (30 − 10)/5 = 4 hundred bacteria per hour. By the Mean Value Theorem, P′(c) = 4, that is 400 bacteria per hour, for some c in (0, 5).
      explanation: |
        Six points. (A) 1 point: both intervals with the reason P′ > 0. (B) 2 points: 1 for the relative maximum at t = 2 and 1 for the relative minimum at t = 4, each justified by the sign change of P′. (C) 2 points: 1 for the four candidate values (Candidates Test); 1 for maximum 30 at both t = 2 and t = 5 and minimum 10 at t = 0. (D) 1 point: the secant slope 4 with the MVT and its hypotheses; the units (hundreds per hour versus 400 per hour) must be handled correctly.
