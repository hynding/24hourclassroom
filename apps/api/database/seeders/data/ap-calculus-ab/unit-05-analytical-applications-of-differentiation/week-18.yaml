week: 18
unit: 5
title: "Increasing and Decreasing Functions, the First Derivative Test and the Candidates Test"
topics: ["5.3", "5.4", "5.5"]
guide: guides/week-18.md
guide_description: |
  Using the sign of f′ to find where f increases and decreases (a sign chart built from critical points and
  points where f′ is undefined), the First Derivative Test for relative extrema and the exact AP sentence that
  justifies a relative maximum or minimum, and the Candidates Test for absolute extrema on a closed interval.
  Worked examples: the intervals of 2x³ − 3x² − 12x, a derivative given in factored form with a repeated zero,
  the cusp of x^(2/3), the absolute extrema of x + 4/x on [1, 4], and a hypothetical bacteria-population model.
flashcards_description: |
  31 cards on the sign of f′ and monotonicity, sign charts, the First Derivative Test and its justification
  sentences, repeated factors and cusps, the Candidates Test, ties, and absolute extrema on open intervals.

flashcards:
  - front: Sign of f′ on an interval → what it says about f
    back: |
      f′ > 0 on an interval ⟹ f is increasing there. f′ < 0 on an interval ⟹ f is decreasing there.
    topic_code: "5.3"
  - front: Sign chart for f′ → which points split the number line
    back: |
      Every critical point (f′ = 0 or undefined) and every point not in the domain of f. f′ can change sign only at these.
    topic_code: "5.3"
  - front: Increasing-interval justification → the AP sentence
    back: |
      "f is increasing on (a, b) because f′(x) > 0 on (a, b)." Name f′, give its sign, and give the interval.
    topic_code: "5.3"
  - front: 2x³ − 3x² − 12x → intervals of increase and decrease
    back: |
      f′ = 6(x − 2)(x + 1). Increasing on x < −1 and x > 2; decreasing on −1 < x < 2.
    topic_code: "5.3"
  - front: x³ − 3x² − 9x + 4 → where it decreases
    back: |
      f′ = 3(x − 3)(x + 1) < 0 between the roots: decreasing on −1 < x < 3.
    topic_code: "5.3"
  - front: ln(x² + 1) → where it increases
    back: |
      Derivative 2x/(x² + 1). The denominator is always positive, so the sign is the sign of x: increasing for x > 0.
    topic_code: "5.3"
  - front: Positive factors like eˣ, x² + 1 or (x − 2)² in f′ → how to treat them on a sign chart
    back: |
      They never make f′ negative, so drop them from the sign analysis (but a squared factor still makes f′ = 0 at its zero).
    topic_code: "5.3"
  - front: x³ at x = 0 → what it shows about increasing functions
    back: |
      x³ is increasing on all reals, yet its derivative is 0 at x = 0. Increasing does not require f′ > 0 at every point.
    topic_code: "5.3"
  - front: Include endpoints in increasing intervals? → AP convention
    back: |
      Either open or closed intervals earn credit (for continuous f). Never include a point outside the domain.
    topic_code: "5.3"
  - front: First Derivative Test → relative maximum
    back: |
      At a critical point c of continuous f: if f′ changes from positive to negative at c, f has a relative maximum at c.
    topic_code: "5.4"
  - front: First Derivative Test → relative minimum
    back: |
      If f′ changes from negative to positive at a critical point c, f has a relative minimum at c.
    topic_code: "5.4"
  - front: First Derivative Test → no sign change
    back: |
      If f′ has the same sign on both sides of c, then f has no relative extremum at c.
    topic_code: "5.4"
  - front: Relative-maximum justification → the full AP sentence
    back: |
      "f has a relative maximum at x = 2 because f′ changes from positive to negative at x = 2."
    topic_code: "5.4"
  - front: f′(x) = (x + 1)(x − 2)²eˣ type derivative → extrema
    back: |
      Only (x + 1) changes sign. Relative minimum at x = −1 (f′ goes − to +); no extremum at x = 2, where f′ touches 0 and stays positive.
    topic_code: "5.4"
  - front: g′(x) = (x − 1)(x + 3)² → classify both critical points
    back: |
      x = 1: g′ changes − to +, relative minimum. x = −3: g′ is negative on both sides, no extremum.
    topic_code: "5.4"
  - front: x e^(−x) → its relative extremum
    back: |
      f′ = (1 − x)e^(−x) changes from + to − at x = 1: relative maximum, value 1/e.
    topic_code: "5.4"
  - front: x^(2/3) at x = 0 → extremum where f′ is undefined?
    back: |
      Yes: f′ = (2/3)x^(−1/3) is negative for x < 0 and positive for x > 0, so f has a relative minimum at the cusp x = 0.
    topic_code: "5.4"
  - front: Error-spot → "f′(2) = 0, so f has a relative extremum at x = 2"
    back: |
      A zero derivative only makes 2 a candidate. The justification needs a sign change of f′ at x = 2.
    topic_code: "5.4"
  - front: Error-spot → "f has a relative minimum at x = 1 because f′ is negative then positive"
    back: |
      Name the location: "because f′ changes from negative to positive at x = 1." A sign change with no point named earns nothing.
    topic_code: "5.4"
  - front: Graph of f′ (not f) → where f has relative maxima
    back: |
      Where the graph of f′ crosses the x-axis from above to below. Peaks of the f′ graph are not extrema of f.
    topic_code: "5.4"
  - front: Candidates Test → the three steps
    back: |
      For continuous f on [a, b]: (1) find critical points in (a, b); (2) evaluate f at them and at a and b; (3) the largest value is the absolute maximum, the smallest the absolute minimum.
    topic_code: "5.5"
  - front: Candidates Test → why it works
    back: |
      The EVT guarantees the extrema exist; Fermat's theorem says interior extrema occur at critical points. So the list of candidates is complete.
    topic_code: "5.5"
  - front: x + 4/x on [1, 4] → absolute extrema
    back: |
      Critical point x = 2 (x = −2 is outside). Values 5, 4, 5. Absolute minimum 4 at x = 2; absolute maximum 5 at x = 1 and x = 4.
    topic_code: "5.5"
  - front: x³ − 3x² + 1 on [−1, 4] → absolute maximum
    back: |
      Candidates f(−1) = −3, f(0) = 1, f(2) = −3, f(4) = 17. Absolute maximum 17 at the endpoint x = 4.
    topic_code: "5.5"
  - front: 2x³ − 3x² − 12x on [−2, 3] → absolute extrema
    back: |
      Candidates f(−2) = −4, f(−1) = 7, f(2) = −20, f(3) = −9. Maximum 7 at x = −1; minimum −20 at x = 2.
    topic_code: "5.5"
  - front: Candidates Test → critical points outside [a, b]
    back: |
      Throw them away. Only critical points strictly inside the interval, plus the two endpoints, are candidates.
    topic_code: "5.5"
  - front: Candidates Test justification → what to write
    back: |
      A table or list of f at every critical point and both endpoints, then "the absolute maximum is … at x = …" chosen from it. Name the test or show the comparison.
    topic_code: "5.5"
  - front: Only one critical point on an open interval → the absolute extremum shortcut
    back: |
      If continuous f has a single critical point c on an interval and it is a relative minimum (maximum), then f(c) is the absolute minimum (maximum) there.
    topic_code: "5.5"
  - front: Hypothetical bacteria model P(t) = t³ − 9t² + 24t + 10 on [0, 5] → absolute extrema
    back: |
      Candidates P(0) = 10, P(2) = 30, P(4) = 26, P(5) = 30. Maximum 30 at t = 2 and t = 5; minimum 10 at t = 0.
    topic_code: "5.5"
  - front: Error-spot → "the absolute maximum of x³ − 3x² + 1 on [−1, 4] is 1, at the relative maximum x = 0"
    back: |
      The endpoints were never checked. f(4) = 17 beats the relative maximum. Relative ≠ absolute.
    topic_code: "5.5"
  - front: Relative extremum versus absolute extremum on [a, b] → can an endpoint be each?
    back: |
      An endpoint can be an absolute extremum but (by the AP convention) never a relative extremum, which needs inputs on both sides.
    topic_code: "5.5"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 5.3 to 5.5: increasing and decreasing intervals
    from the sign of f′, the First Derivative Test and its justification, and the Candidates Test for absolute
    extrema), with 8 questions (about 35%) reviewing weeks 5 to 17 (limits at infinity, the quotient rule,
    implicit differentiation, inverse functions, interpretation in context, motion, critical points and the Mean
    Value Theorem). Opens with a shared-context set on a derivative given in factored form. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
    No calculator is needed.
  questions:
    # ---- Stimulus set: a derivative in factored form (5.3, 5.4, 5.2)
    - slug: apcalcab-u05-w18-q01
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Calculus CED, Topic 5.3"
      points: 1
      stimulus: |
        A function f is differentiable for all real numbers, and its derivative is f′(x) = (x + 1)(x − 2)²e^(−x).
      prompt: |
        On which interval or intervals is f increasing?
      options:
        - "x < −1 only"
        - "−1 < x < 2 only"
        - "x > −1"
        - "x > 2 only"
      option_explanations:
        - |
          For x < −1 the factor x + 1 is negative and the other factors are positive, so f′ < 0 and f is decreasing there.
        - |
          f′ is positive on −1 < x < 2 but stays positive after x = 2 as well, because (x − 2)² does not change sign. The interval is too short.
        - |
          Correct. (x − 2)² ≥ 0 and e^(−x) > 0, so f′ has the sign of x + 1: positive for x > −1 (zero only at the single point x = 2). f is increasing on x > −1.
        - |
          This treats x = 2 as a sign change. A squared factor touches 0 without changing sign, so f′ is already positive on −1 < x < 2.
      answer: 2
    - slug: apcalcab-u05-w18-q02
      type: multiple_choice
      topic_code: "5.4"
      source: "AP Calculus CED, Topic 5.4"
      points: 1
      stimulus: |
        A function f is differentiable for all real numbers, and its derivative is f′(x) = (x + 1)(x − 2)²e^(−x).
      prompt: |
        Which statement describes the relative extrema of f?
      options:
        - "A relative minimum at x = −1 and no other relative extremum"
        - "A relative maximum at x = −1 and a relative minimum at x = 2"
        - "A relative minimum at x = −1 and a relative maximum at x = 2"
        - "A relative minimum at x = 2 and no other relative extremum"
      option_explanations:
        - |
          Correct. f′ changes from negative to positive at x = −1, so f has a relative minimum there. At x = 2, f′ is positive on both sides, so there is no extremum.
        - |
          The signs are reversed at x = −1 (f′ goes from − to +, a minimum), and x = 2 gives no extremum because f′ does not change sign.
        - |
          The minimum at −1 is right, but at x = 2 f′ stays positive on both sides, so f keeps increasing: no relative maximum.
        - |
          f′(2) = 0 makes 2 a critical point, but without a sign change there is no extremum. The real minimum is at x = −1.
      answer: 0
    - slug: apcalcab-u05-w18-q03
      type: multiple_choice
      topic_code: "5.4"
      source: "AP Calculus CED, Topic 5.4"
      points: 1
      stimulus: |
        A function f is differentiable for all real numbers, and its derivative is f′(x) = (x + 1)(x − 2)²e^(−x).
      prompt: |
        Which sentence correctly justifies the behavior of f at x = 2?
      options:
        - "f has a relative extremum at x = 2 because f′(2) = 0."
        - "f has no relative extremum at x = 2 because f(2) is not 0."
        - "f has a relative maximum at x = 2 because (x − 2)² has its minimum there."
        - "f has no relative extremum at x = 2 because f′ does not change sign at x = 2."
      option_explanations:
        - |
          f′(2) = 0 only makes x = 2 a critical point. An extremum needs f′ to change sign, which it does not do here.
        - |
          The value of f itself is irrelevant to whether an extremum exists; the test looks at the sign of f′ on either side.
        - |
          This reasons about a factor of f′, not about f. The behavior of f depends on the sign of f′, which is positive on both sides of 2.
        - |
          Correct. f′ > 0 just to the left and just to the right of x = 2, so f is increasing through x = 2 and, by the First Derivative Test, has no relative extremum there.
      answer: 3
    - slug: apcalcab-u05-w18-q04
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Calculus CED, Topic 5.2"
      points: 1
      stimulus: |
        A function f is differentiable for all real numbers, and its derivative is f′(x) = (x + 1)(x − 2)²e^(−x).
      prompt: |
        What are all the critical points of f?
      options:
        - "x = −1 only"
        - "x = −1 and x = 2"
        - "x = −1, x = 0 and x = 2"
        - "x = 2 only"
      option_explanations:
        - |
          This keeps only the point where f′ changes sign. x = 2 also has f′(2) = 0, so it is a critical point even though it gives no extremum.
        - |
          Correct. f′ exists everywhere, and f′(x) = 0 when x + 1 = 0 or x − 2 = 0 (e^(−x) is never 0). The critical points are −1 and 2.
        - |
          e^(−x) is never 0, and at x = 0 f′(0) = (1)(4)(1) = 4 ≠ 0. Zero is not a critical point.
        - |
          This misses x = −1, where the factor x + 1 is zero.
      answer: 1
    # ---- Independent items
    - slug: apcalcab-u05-w18-q05
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Calculus CED, Topic 5.3"
      points: 1
      prompt: |
        On which interval is f(x) = x³ − 3x² − 9x + 4 decreasing?
      options:
        - "x < −1 and x > 3"
        - "−1 < x < 3"
        - "−3 < x < 1"
        - "x < 1"
      option_explanations:
        - |
          These are the intervals where f′ = 3(x − 3)(x + 1) is positive, so f is increasing there, not decreasing.
        - |
          Correct. f′(x) = 3x² − 6x − 9 = 3(x − 3)(x + 1), which is negative between its zeros, so f is decreasing on −1 < x < 3.
        - |
          This comes from factoring as (x + 3)(x − 1), a sign slip. The zeros of 3x² − 6x − 9 are 3 and −1.
        - |
          x = 1 is where f′ is most negative (the vertex of f′), not where f′ changes sign.
      answer: 1
    - slug: apcalcab-u05-w18-q06
      type: multiple_choice
      topic_code: "5.4"
      source: "AP Calculus CED, Topic 5.4"
      points: 1
      prompt: |
        Let f(x) = x e^(−x). Which statement is true?
      options:
        - "f has a relative maximum at x = 1."
        - "f has a relative minimum at x = 1."
        - "f has a relative maximum at x = 0."
        - "f has no relative extrema."
      option_explanations:
        - |
          Correct. f′(x) = e^(−x) − x e^(−x) = (1 − x)e^(−x). Since e^(−x) > 0, f′ changes from positive to negative at x = 1, so f has a relative maximum there.
        - |
          The critical point is right, but f′ = (1 − x)e^(−x) goes from positive to negative, which is a maximum, not a minimum.
        - |
          x = 0 is the zero of f, not of f′; f′(0) = 1 ≠ 0, so 0 is not even a critical point.
        - |
          This comes from writing f′ = −x e^(−x) (dropping the product rule's first term). The correct f′ = (1 − x)e^(−x) changes sign at 1.
      answer: 0
    - slug: apcalcab-u05-w18-q07
      type: multiple_choice
      topic_code: "5.5"
      source: "AP Calculus CED, Topic 5.5"
      points: 1
      prompt: |
        What is the absolute maximum value of f(x) = x³ − 3x² + 1 on the interval [−1, 4]?
      options:
        - "1"
        - "4"
        - "17"
        - "−3"
      option_explanations:
        - |
          1 = f(0) is the relative maximum. The Candidates Test also checks the endpoints, and f(4) = 17 is larger.
        - |
          4 is where the maximum occurs, an input. The maximum value is the output f(4) = 17.
        - |
          Correct. f′(x) = 3x(x − 2), so the critical points are 0 and 2. Candidates: f(−1) = −3, f(0) = 1, f(2) = −3, f(4) = 17. The largest is 17.
        - |
          −3 is the absolute minimum value (at x = −1 and x = 2), not the maximum.
      answer: 2
    - slug: apcalcab-u05-w18-q08
      type: multiple_choice
      topic_code: "5.5"
      source: "AP Calculus CED, Topic 5.5"
      points: 1
      prompt: |
        What is the absolute minimum value of g(x) = x + 4/x on the interval [1, 4]?
      options:
        - "5"
        - "2"
        - "−4"
        - "4"
      option_explanations:
        - |
          5 is the value at both endpoints, g(1) = g(4) = 5: that is the absolute maximum on [1, 4].
        - |
          2 is where the minimum occurs. The minimum value is g(2) = 2 + 2 = 4.
        - |
          −4 = g(−2), but x = −2 is outside [1, 4], so it is not a candidate.
        - |
          Correct. g′(x) = 1 − 4/x² = 0 at x = ±2, and only x = 2 is in the interval. Candidates: g(1) = 5, g(2) = 4, g(4) = 5. The smallest is 4.
      answer: 3
    - slug: apcalcab-u05-w18-q09
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Calculus CED, Topic 5.3"
      points: 1
      prompt: |
        On which interval is h(x) = ln(x² + 1) increasing?
      options:
        - "x > 0"
        - "All real numbers"
        - "x < 0"
        - "x > 1"
      option_explanations:
        - |
          Correct. h′(x) = 2x/(x² + 1). The denominator is always positive, so h′ > 0 exactly when x > 0.
        - |
          ln is an increasing function, but its input x² + 1 decreases for x < 0, so h decreases there. Use the sign of h′, not the outer function alone.
        - |
          For x < 0, h′(x) = 2x/(x² + 1) is negative, so h is decreasing there.
        - |
          x = 1 has no special role; h′ is already positive for 0 < x < 1.
      answer: 0
    - slug: apcalcab-u05-w18-q10
      type: multiple_choice
      topic_code: "5.4"
      source: "AP Calculus CED, Topic 5.4"
      points: 1
      prompt: |
        Let f(x) = x^(2/3). Which statement about f at x = 0 is true?
      options:
        - "f has no extremum at x = 0 because f′(0) does not exist."
        - "f has a relative minimum at x = 0, although f′(0) does not exist."
        - "f has a relative maximum at x = 0."
        - "x = 0 is not a critical point of f."
      option_explanations:
        - |
          An undefined derivative makes 0 a critical point; it does not rule out an extremum. Here f′ changes sign at 0.
        - |
          Correct. f′(x) = (2/3)x^(−1/3) is negative for x < 0 and positive for x > 0, so by the First Derivative Test f has a relative minimum at the cusp x = 0.
        - |
          f′ changes from negative to positive at 0, which is a minimum. Also f(0) = 0 while f(x) > 0 for x ≠ 0.
        - |
          0 is in the domain of f and f′(0) does not exist, which is exactly one of the two ways to be a critical point.
      answer: 1
    - slug: apcalcab-u05-w18-q11
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Calculus CED, Topic 3.2"
      points: 1
      prompt: |
        For the curve x² + xy + y² = 7, what is dy/dx at the point (1, 2)?
      options:
        - "−5/4"
        - "4/5"
        - "−4/5"
        - "−1/2"
      option_explanations:
        - |
          This is the reciprocal of the correct value: the numerator and denominator of −(2x + y)/(x + 2y) were swapped.
        - |
          The sign is lost. Moving 2x + y to the other side gives dy/dx = −(2x + y)/(x + 2y), which is negative at (1, 2).
        - |
          Correct. Differentiating gives 2x + y + x dy/dx + 2y dy/dx = 0, so dy/dx = −(2x + y)/(x + 2y) = −(2 + 2)/(1 + 4) = −4/5.
        - |
          This treats xy as if its derivative were y only (no product rule), giving 2x + y + 2y dy/dx = 0 and −4/8 = −1/2.
      answer: 2
    - slug: apcalcab-u05-w18-q12
      type: multiple_choice
      topic_code: "4.1"
      source: "AP Calculus CED, Topic 4.1"
      points: 1
      prompt: |
        The temperature of a cup of coffee is T(m) degrees Celsius, m minutes after it is poured. Which is the best interpretation of T′(10) = −1.8?
      options:
        - "After 10 minutes the coffee is 1.8 °C cooler than when it was poured."
        - "The coffee's temperature is −1.8 °C at m = 10."
        - "It takes 10 minutes for the coffee to cool by 1.8 °C."
        - "At 10 minutes, the coffee's temperature is decreasing at 1.8 °C per minute."
      option_explanations:
        - |
          That would be a total change, T(10) − T(0) = −1.8. T′(10) is an instantaneous rate at m = 10.
        - |
          This reads the derivative as the temperature itself. T(10) is the temperature; T′(10) is how fast it changes.
        - |
          This swaps the roles: 10 is the input time, and −1.8 is a rate in °C per minute, not a total change over 10 minutes.
        - |
          Correct. T′(10) is the instantaneous rate of change of temperature at m = 10, in °C per minute; the negative sign means it is decreasing.
      answer: 3
    - slug: apcalcab-u05-w18-q13
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Calculus CED, Topic 2.9"
      points: 1
      prompt: |
        Which expression is d/dx [x/(x² + 1)]?
      options:
        - "(x² − 1)/(x² + 1)²"
        - "1/(2x)"
        - "(1 + 3x²)/(x² + 1)²"
        - "(1 − x²)/(x² + 1)²"
      option_explanations:
        - |
          The numerator is subtracted in the wrong order. The quotient rule is (bottom · top′ − top · bottom′)/bottom².
        - |
          This divides the derivative of the numerator by the derivative of the denominator. The quotient rule is not the quotient of the derivatives.
        - |
          This adds the two terms of the numerator instead of subtracting: (x² + 1) + 2x² instead of (x² + 1) − 2x².
        - |
          Correct. ((x² + 1)(1) − x(2x))/(x² + 1)² = (1 − x²)/(x² + 1)². (So the function increases on −1 < x < 1.)
      answer: 3
    - slug: apcalcab-u05-w18-q14
      type: multi_select
      topic_code: "5.4"
      source: "AP Calculus CED, Topic 5.4"
      points: 2
      partial_credit: true
      prompt: |
        A function g is differentiable for all real numbers, with g′(x) = (x − 1)(x + 3)². Which statements are true? Select all that apply.
      options:
        - "g has a relative minimum at x = 1."
        - "g has a relative maximum at x = −3."
        - "g is decreasing on x < 1."
        - "g is increasing on x > 1."
        - "x = −3 is not a critical point of g."
      option_explanations:
        - |
          Correct. (x + 3)² ≥ 0, so g′ has the sign of x − 1: it changes from negative to positive at x = 1.
        - |
          g′ is negative on both sides of x = −3 (the squared factor does not change sign), so g has no extremum there.
        - |
          Correct. For x < 1, x − 1 < 0 and (x + 3)² ≥ 0, so g′ ≤ 0 with equality only at the single point x = −3; g is decreasing on x < 1.
        - |
          Correct. For x > 1 both factors make g′ positive.
        - |
          g′(−3) = 0, so −3 is a critical point. It just gives no extremum.
      answer: [0, 2, 3]
    - slug: apcalcab-u05-w18-q15
      type: multi_select
      topic_code: "5.1"
      source: "AP Calculus CED, Topic 5.1"
      points: 2
      partial_credit: true
      prompt: |
        A function k is differentiable on [0, 8], with selected values shown.

        | x | 0 | 3 | 5 | 8 |
        |---|---|---|---|---|
        | k(x) | 4 | −2 | −2 | 10 |

        Which statements must be true? Select all that apply.
      options:
        - "k′(c) = 0 for some c in (3, 5)."
        - "k′(c) = 4 for some c in (5, 8)."
        - "The absolute minimum value of k on [0, 8] is −2."
        - "k′(x) < 0 for every x in (0, 3)."
        - "k(c) = 0 for some c in (0, 3)."
      option_explanations:
