      source: "AP Calculus CED, Topic 5.3"
      points: 1
      prompt: |
        True or false: If a differentiable function f is increasing on an interval, then f′(x) > 0 at every point of that interval.
      answer: false
      explanation: |
        False. f(x) = x³ is increasing on every interval, yet f′(0) = 0. An increasing differentiable function has f′(x) ≥ 0, and f′ may be 0 at isolated points. (The true statement runs the other way: f′ > 0 on an interval guarantees f is increasing there.)
