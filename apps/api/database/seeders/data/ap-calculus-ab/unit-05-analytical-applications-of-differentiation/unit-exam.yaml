unit: 5
description: |
  45 questions · about 90 minutes · every topic of Unit 5 (5.1 to 5.12): the Mean Value Theorem, the Extreme
  Value Theorem and critical points, increasing and decreasing intervals, the First Derivative Test, the
  Candidates Test, concavity and points of inflection, the Second Derivative Test, connecting the graphs of f,
  f′ and f″, implicit curves, and optimization. Includes three shared-context sets of three questions (an oven's
  temperature table, a piecewise-linear graph of f′, and an implicitly defined curve), select-all, true/false,
  fill-in-the-blank and numeric items, two short-answer questions (3 points each) and two free-response
  questions in the AP style (9 points each: one calculator-active question on a flood-gauge model, one
  no-calculator analytical question on a quartic). Items marked (Calculator.) need a graphing calculator; the
  rest are meant to be done by hand. Multiple choice, select-all, true/false and numeric items are graded at
  once; fill-in-the-blank items are matched automatically; the short answers and free-response items are graded
  by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: an oven's temperature (5.1, 5.2)
  - slug: apcalcab-u05-exam-q01
    type: multiple_choice
    topic_code: "5.1"
    source: "AP Calculus CED, Topic 5.1"
    points: 1
    stimulus: |
      The temperature inside a hypothetical test oven is modeled by a differentiable function T, where T(t) is in degrees Celsius and t is in minutes after the oven is switched on, for 0 ≤ t ≤ 20. Selected values are shown.

      | t (minutes) | 0 | 4 | 10 | 15 | 20 |
      |---|---|---|---|---|---|
      | T(t) (°C) | 20 | 140 | 200 | 200 | 180 |
    prompt: |
      Which value must T′(c) equal for some c in (4, 10), according to the Mean Value Theorem?
    options:
      - "0 °C per minute"
      - "60 °C per minute"
      - "10 °C per minute"
      - "17 °C per minute"
    option_explanations:
      - |
        A zero derivative would need T(4) = T(10). Here T rises from 140 to 200, so the guaranteed derivative value is the secant slope 10.
      - |
        60 is the change in temperature, 200 − 140. It must be divided by the change in time, 10 − 4 = 6.
      - |
        Correct. T is differentiable, so it is continuous on [4, 10] and differentiable on (4, 10). The secant slope is (200 − 140)/(10 − 4) = 10, so T′(c) = 10 °C per minute for some c in (4, 10).
      - |
        This is 200/12, dividing a temperature by an unrelated time. The MVT uses (T(10) − T(4))/(10 − 4).
    answer: 2
  - slug: apcalcab-u05-exam-q02
    type: multiple_choice
    topic_code: "5.1"
    source: "AP Calculus CED, Topic 5.1"
    points: 1
    stimulus: |
      The temperature inside a hypothetical test oven is modeled by a differentiable function T, where T(t) is in degrees Celsius and t is in minutes after the oven is switched on, for 0 ≤ t ≤ 20. Selected values are shown.

      | t (minutes) | 0 | 4 | 10 | 15 | 20 |
      |---|---|---|---|---|---|
      | T(t) (°C) | 20 | 140 | 200 | 200 | 180 |
    prompt: |
      On which interval does the Mean Value Theorem guarantee a time at which the temperature is momentarily not changing?
    options:
      - "(0, 4)"
      - "(4, 10)"
      - "(15, 20)"
      - "(10, 15)"
    option_explanations:
      - |
        T rises from 20 to 140 on [0, 4], so the guaranteed rate is 30 °C per minute, not 0.
      - |
        T rises from 140 to 200 on [4, 10], so the guaranteed rate is 10 °C per minute. T′ may stay positive there.
      - |
        T falls from 200 to 180 on [15, 20], so the guaranteed rate is −4 °C per minute; the data allow T′ < 0 throughout.
      - |
        Correct. T(10) = T(15) = 200 and T is continuous on [10, 15] and differentiable on (10, 15), so by the MVT (Rolle's theorem) T′(c) = 0 for some c in (10, 15).
    answer: 3
  - slug: apcalcab-u05-exam-q03
    type: multiple_choice
    topic_code: "5.2"
    source: "AP Calculus CED, Topic 5.2"
    points: 1
    stimulus: |
      The temperature inside a hypothetical test oven is modeled by a differentiable function T, where T(t) is in degrees Celsius and t is in minutes after the oven is switched on, for 0 ≤ t ≤ 20. Selected values are shown.

      | t (minutes) | 0 | 4 | 10 | 15 | 20 |
      |---|---|---|---|---|---|
      | T(t) (°C) | 20 | 140 | 200 | 200 | 180 |
    prompt: |
      Which statement about the absolute maximum of T on [0, 20] must be true?
    options:
      - "T has an absolute maximum on [0, 20], and its value is at least 200 °C."
      - "The absolute maximum value of T on [0, 20] is exactly 200 °C."
      - "The absolute maximum of T occurs at t = 10 or t = 15."
      - "T need not have an absolute maximum, because only five values are known."
    option_explanations:
      - |
        Correct. T is continuous on the closed interval [0, 20], so by the Extreme Value Theorem it has an absolute maximum, and that maximum is at least the largest known value, 200.
      - |
        The table shows only five times. Between t = 10 and t = 15, T may rise above 200, so the maximum could be larger.
      - |
        The maximum could occur between table values (for example at some time between 10 and 15), not necessarily at a listed time.
      - |
        The EVT guarantees a maximum from continuity on a closed interval, however few values are listed.
    answer: 0
  # ---- Stimulus set B: a piecewise-linear graph of f′ (5.4, 5.6, 5.9)
  - slug: apcalcab-u05-exam-q04
    type: multiple_choice
    topic_code: "5.4"
    source: "AP Calculus CED, Topic 5.4"
    points: 1
    stimulus: |
      A function f is continuous on [0, 8] and differentiable on (0, 8). The graph of its derivative f′ consists of three line segments joining the points (0, 3), (3, −3), (6, 3) and (8, −1). So f′ crosses the x-axis at x = 1.5, x = 4.5 and x = 7.5.
    prompt: |
      At which value of x in (0, 8) does f have a relative minimum?
    options:
      - "x = 3"
      - "x = 4.5"
      - "x = 1.5 and x = 7.5"
      - "x = 6"
    option_explanations:
      - |
        x = 3 is the lowest point of the f′ graph, where f is decreasing most steeply: a point of inflection of f, not a minimum.
      - |
        Correct. f′ changes from negative to positive at x = 4.5 (the segment rises from −3 at x = 3 to 3 at x = 6), so f has a relative minimum there.
      - |
        At x = 1.5 and x = 7.5, f′ changes from positive to negative, so those are relative maxima.
      - |
        x = 6 is the peak of the f′ graph, a point of inflection of f; f′(6) = 3 ≠ 0.
    answer: 1
  - slug: apcalcab-u05-exam-q05
    type: multiple_choice
    topic_code: "5.6"
    source: "AP Calculus CED, Topic 5.6"
    points: 1
    stimulus: |
      A function f is continuous on [0, 8] and differentiable on (0, 8). The graph of its derivative f′ consists of three line segments joining the points (0, 3), (3, −3), (6, 3) and (8, −1). So f′ crosses the x-axis at x = 1.5, x = 4.5 and x = 7.5.
    prompt: |
      On which interval is the graph of f concave up?
    options:
      - "4.5 < x < 7.5"
      - "1.5 < x < 4.5"
      - "3 < x < 6"
      - "6 < x < 8"
    option_explanations:
      - |
        f′ > 0 on 4.5 < x < 7.5, so f is increasing there, but f′ is falling on 6 < x < 7.5, so part of this interval is concave down.
      - |
        f′ < 0 on 1.5 < x < 4.5, which makes f decreasing; f′ is falling on 1.5 < x < 3, so that part is concave down.
      - |
        Correct. On 3 < x < 6 the f′ graph rises from −3 to 3, so f′ is increasing and the graph of f is concave up.
      - |
        The f′ graph falls from 3 to −1 on 6 < x < 8, so f is concave down there.
    answer: 2
  - slug: apcalcab-u05-exam-q06
    type: multiple_choice
    topic_code: "5.9"
    source: "AP Calculus CED, Topic 5.9"
    points: 1
    stimulus: |
      A function f is continuous on [0, 8] and differentiable on (0, 8). The graph of its derivative f′ consists of three line segments joining the points (0, 3), (3, −3), (6, 3) and (8, −1). So f′ crosses the x-axis at x = 1.5, x = 4.5 and x = 7.5.
    prompt: |
      What is f″(5)?
    options:
      - "1"
      - "−2"
      - "0"
      - "2"
    option_explanations:
      - |
        1 is f′(5), the height of the f′ graph at x = 5 (−3 + 2 · 2), not its slope.
      - |
        −2 is the slope of the first and third segments. At x = 5 the f′ graph is on the rising middle segment.
      - |
        f″(5) = 0 would need the f′ graph to be flat at x = 5; it is rising there.
      - |
        Correct. f″(5) is the slope of the f′ graph at x = 5, on the segment from (3, −3) to (6, 3): (3 − (−3))/(6 − 3) = 2.
    answer: 3
  # ---- Stimulus set C: an implicitly defined curve (5.12)
  - slug: apcalcab-u05-exam-q07
    type: multiple_choice
    topic_code: "5.12"
    source: "AP Calculus CED, Topic 5.12"
    points: 1
    stimulus: |
      Consider the curve x² + 2xy + 3y² = 6, which passes through the point (1, 1). Implicit differentiation gives dy/dx = −(x + y)/(x + 3y).
    prompt: |
      What is the slope of the curve at the point (1, 1)?
    options:
      - "−1/2"
      - "−2"
      - "1/2"
      - "−1"
    option_explanations:
      - |
        Correct. dy/dx = −(1 + 1)/(1 + 3 · 1) = −2/4 = −1/2.
      - |
        This is the reciprocal: the numerator x + y and the denominator x + 3y were swapped.
      - |
        The minus sign in front of the fraction was dropped.
      - |
        This uses x + y in both numerator and denominator, as if the 3y were y.
    answer: 0
  - slug: apcalcab-u05-exam-q08
    type: multiple_choice
    topic_code: "5.12"
    source: "AP Calculus CED, Topic 5.12"
    points: 1
    stimulus: |
      Consider the curve x² + 2xy + 3y² = 6, which passes through the point (1, 1). Implicit differentiation gives dy/dx = −(x + y)/(x + 3y).
    prompt: |
      At which points does the curve have a vertical tangent line?
    options:
      - "(√3, −√3) and (−√3, √3)"
      - "(3, −1) and (−3, 1)"
      - "(√6, 0) and (−√6, 0)"
      - "(0, √2) and (0, −√2)"
    option_explanations:
      - |
        These are where y = −x, so the numerator x + y is 0: the horizontal tangents.
      - |
        Correct. Vertical tangents need x + 3y = 0 (with x + y ≠ 0). Substituting x = −3y: 9y² − 6y² + 3y² = 6y² = 6, so y = ±1, giving (−3, 1) and (3, −1). There x + y = ∓2 ≠ 0.
      - |
        These are the x-intercepts (y = 0). There dy/dx = −x/x = −1, which is defined.
      - |
        These are the y-intercepts (x = 0). There dy/dx = −y/(3y) = −1/3, which is defined.
    answer: 1
  - slug: apcalcab-u05-exam-q09
    type: multiple_choice
    topic_code: "5.12"
    source: "AP Calculus CED, Topic 5.12"
    points: 1
    stimulus: |
      Consider the curve x² + 2xy + 3y² = 6, which passes through the point (1, 1). Implicit differentiation gives dy/dx = −(x + y)/(x + 3y).
    prompt: |
      What is the value of d²y/dx² at the point (1, 1), and what does it say about the curve there?
    options:
      - "3/16; concave up"
      - "−1/2; concave down"
      - "0; a point of inflection"
      - "−3/16; concave down"
    option_explanations:
      - |
        The size is right but the leading minus sign of the quotient was dropped, which reverses the concavity.
      - |
        −1/2 is dy/dx at (1, 1), the slope, not the second derivative.
      - |
        The second derivative is not 0 here; and even if it were, a single zero would not establish an inflection point.
      - |
        Correct. d²y/dx² = −[(1 + y′)(x + 3y) − (x + y)(1 + 3y′)]/(x + 3y)². With y′ = −1/2 at (1, 1): −[(1/2)(4) − (2)(−1/2)]/16 = −(2 + 1)/16 = −3/16 < 0.
    answer: 3
  # ---- Independent multiple choice
  - slug: apcalcab-u05-exam-q10
    type: multiple_choice
    topic_code: "5.1"
    source: "AP Calculus CED, Topic 5.1"
    points: 1
    prompt: |
      For which function do the hypotheses of the Mean Value Theorem fail on the interval [0, 2]?
    options:
      - "f(x) = x³ − 2x"
      - "g(x) = √(x + 1)"
      - "h(x) = |x − 1|"
      - "k(x) = eˣ sin x"
    option_explanations:
      - |
        A polynomial is continuous and differentiable everywhere, so the hypotheses hold on [0, 2].
      - |
        √(x + 1) is continuous on [0, 2] and differentiable for x > −1, which includes (0, 2).
      - |
        Correct. |x − 1| is continuous, but it has a corner at x = 1 inside (0, 2), so it is not differentiable on (0, 2).
      - |
        A product of differentiable functions is differentiable everywhere, so the hypotheses hold.
    answer: 2
  - slug: apcalcab-u05-exam-q11
    type: multiple_choice
    topic_code: "5.2"
    source: "AP Calculus CED, Topic 5.2"
    points: 1
    prompt: |
      What are all the critical points of f(x) = x − 3x^(1/3)?
    options:
      - "x = −1, x = 0 and x = 1"
      - "x = −1 and x = 1"
      - "x = 0 only"
      - "x = 0 and x = 3√3"
    option_explanations:
      - |
        Correct. f′(x) = 1 − x^(−2/3) = 1 − 1/x^(2/3). It is 0 when x^(2/3) = 1, so x = ±1, and undefined at x = 0, which is in the domain of f.
      - |
        These are the zeros of f′, but f′ is also undefined at x = 0, which is in the domain, so 0 is a critical point too.
      - |
        This keeps only the point where f′ is undefined and misses the zeros x = ±1.
      - |
        These are zeros of f itself (x = 3x^(1/3) gives x = 0, ±3√3), not of f′.
    answer: 0
  - slug: apcalcab-u05-exam-q12
    type: multiple_choice
    topic_code: "5.3"
    source: "AP Calculus CED, Topic 5.3"
    points: 1
    prompt: |
      On which interval is f(x) = x²eˣ decreasing?
    options:
      - "x < −2"
      - "−2 < x < 0"
      - "x > 0"
      - "x < 0"
    option_explanations:
      - |
        For x < −2, f′(x) = x(x + 2)eˣ is a product of two negatives and a positive, so f′ > 0 and f is increasing.
      - |
        Correct. f′(x) = 2xeˣ + x²eˣ = x(x + 2)eˣ. Since eˣ > 0, f′ < 0 exactly when x and x + 2 have opposite signs: −2 < x < 0.
      - |
        For x > 0 every factor of x(x + 2)eˣ is positive, so f is increasing.
      - |
        This uses only the factor 2xeˣ, forgetting the product rule's second term x²eˣ.
    answer: 1
  - slug: apcalcab-u05-exam-q13
    type: multiple_choice
    topic_code: "5.4"
    source: "AP Calculus CED, Topic 5.4"
    points: 1
    prompt: |
      A function f is differentiable for all real numbers, and f′(x) = (x + 3)(x − 1)²(x − 4). At which x does f have a relative maximum?
    options:
      - "x = 1"
      - "x = 4"
      - "x = −3 and x = 4"
      - "x = −3"
    option_explanations:
      - |
        f′ is negative on both sides of x = 1 (the factor (x − 1)² does not change sign), so there is no extremum there.
      - |
        f′ changes from negative to positive at x = 4, which is a relative minimum.
      - |
        x = 4 is a relative minimum, not a maximum; only x = −3 has f′ changing from positive to negative.
      - |
        Correct. For x < −3, f′ = (−)(+)(−) > 0; for −3 < x < 1, f′ = (+)(+)(−) < 0. f′ changes from positive to negative at x = −3, so f has a relative maximum there.
    answer: 3
  - slug: apcalcab-u05-exam-q14
    type: multiple_choice
    topic_code: "5.5"
    source: "AP Calculus CED, Topic 5.5"
    points: 1
    prompt: |
      What is the absolute minimum value of f(x) = x³ − 12x + 1 on the interval [0, 3]?
    options:
      - "−8"
      - "1"
      - "−15"
      - "2"
    option_explanations:
      - |
        −8 = f(3), the value at the right endpoint. The critical point x = 2 gives a smaller value.
      - |
        1 = f(0) is the absolute maximum on [0, 3], not the minimum.
      - |
        Correct. f′(x) = 3x² − 12 = 0 at x = ±2; only x = 2 is in [0, 3]. Candidates: f(0) = 1, f(2) = 8 − 24 + 1 = −15, f(3) = −8. The smallest is −15.
      - |
        2 is where the minimum occurs, not the minimum value f(2) = −15.
    answer: 2
  - slug: apcalcab-u05-exam-q15
    type: multiple_choice
    topic_code: "5.6"
    source: "AP Calculus CED, Topic 5.6"
    points: 1
    prompt: |
      Which describes the concavity of the graph of f(x) = ln x − x² on its domain x > 0?
    options:
      - "Concave down for all x > 0"
      - "Concave up for all x > 0"
      - "Concave up for 0 < x < 1/√2 and concave down for x > 1/√2"
      - "Concave down for 0 < x < 1/√2 and concave up for x > 1/√2"
    option_explanations:
      - |
        Correct. f′(x) = 1/x − 2x and f″(x) = −1/x² − 2, which is negative for every x > 0.
      - |
        Both terms of f″(x) = −1/x² − 2 are negative, so f″ is never positive.
      - |
        x = 1/√2 is where f′ = 0 (the maximum of f), which says nothing about a change of concavity.
      - |
        This also treats the critical point 1/√2 as a concavity change, with the signs reversed. f″ < 0 everywhere.
    answer: 0
  - slug: apcalcab-u05-exam-q16
    type: multiple_choice
    topic_code: "5.7"
    source: "AP Calculus CED, Topic 5.7"
    points: 1
    prompt: |
      Let f(x) = x⁴ − 8x². What does the Second Derivative Test conclude about f at x = 0?
    options:
      - "Nothing, because f′(0) = 0"
      - "f has a relative maximum at x = 0."
      - "f has a relative minimum at x = 0."
      - "The graph of f has a point of inflection at x = 0."
    option_explanations:
      - |
        f′(0) = 0 is exactly the condition the test needs; it is f″(0) = 0 that would make it inconclusive, and f″(0) = −16.
      - |
        Correct. f′(x) = 4x³ − 16x, so f′(0) = 0; f″(x) = 12x² − 16, so f″(0) = −16 < 0. By the Second Derivative Test f has a relative maximum at x = 0.
      - |
        A negative second derivative at a horizontal tangent means concave down, a maximum. The minima are at x = ±2.
      - |
        f″(0) = −16 ≠ 0 and the graph is concave down on both sides of 0; the inflection points are at x = ±2/√3.
    answer: 1
  - slug: apcalcab-u05-exam-q17
    type: multiple_choice
    topic_code: "5.8"
    source: "AP Calculus CED, Topic 5.8"
    points: 1
    prompt: |
      A function f satisfies f′(x) > 0 for x < 1, f′(x) < 0 for x > 1 and f″(x) < 0 for all x. Which could be f?
    options:
      - "f(x) = (x − 1)² + 5"
      - "f(x) = (x − 1)³"
      - "f(x) = 5 − (x − 1)²"
      - "f(x) = 5 − (x − 1)³"
    option_explanations:
      - |
        This parabola opens upward: decreasing then increasing with f″ = 2 > 0, the opposite of every condition.
      - |
        f′(x) = 3(x − 1)² ≥ 0, so this cubic never decreases, and its concavity changes at x = 1.
      - |
        Correct. f′(x) = −2(x − 1) is positive for x < 1 and negative for x > 1, and f″(x) = −2 < 0 everywhere.
      - |
        f′(x) = −3(x − 1)² ≤ 0, so this function never increases, and f″(x) = −6(x − 1) is positive for x < 1.
    answer: 2
  - slug: apcalcab-u05-exam-q18
    type: multiple_choice
    topic_code: "5.9"
    source: "AP Calculus CED, Topic 5.9"
    points: 1
    prompt: |
      A function f is twice differentiable, with f′(3) = 0 and f″(x) > 0 for 2 < x < 4. Which statement must be true?
    options:
      - "f has a relative maximum at x = 3."
      - "The graph of f has a point of inflection at x = 3."
      - "f is increasing on 2 < x < 4."
      - "f has a relative minimum at x = 3."
    option_explanations:
      - |
        A horizontal tangent on a concave-up stretch of graph is a minimum, not a maximum.
      - |
        f″ > 0 on both sides of 3, so the concavity does not change there.
      - |
        f′ is increasing on (2, 4) and equals 0 at x = 3, so f′ < 0 on (2, 3): f is decreasing there.
      - |
        Correct. f′ is increasing on (2, 4) (because f″ > 0) and f′(3) = 0, so f′ < 0 just left of 3 and f′ > 0 just right: a relative minimum (also the Second Derivative Test, since f″(3) > 0).
    answer: 3
  - slug: apcalcab-u05-exam-q19
    type: multiple_choice
    topic_code: "5.10"
    source: "AP Calculus CED, Topic 5.10"
    points: 1
    prompt: |
      A hypothetical rectangular garden of area 200 m² is fenced on three sides; the fourth side is a wall. Let x be the length of each side perpendicular to the wall. Which function gives the total length L of fence?
    options:
      - "L(x) = 2x + 200/x"
      - "L(x) = 2x + 400/x"
      - "L(x) = x + 200/x"
      - "L(x) = 200 − 2x"
    option_explanations:
      - |
        Correct. The side parallel to the wall is 200/x, and there are two perpendicular sides of length x, so L = 2x + 200/x.
      - |
        This fences all four sides: 2x for the perpendicular sides plus 2(200/x) for both parallel sides. The side along the wall needs no fence.
      - |
        This counts only one perpendicular side; the garden has two sides of length x touching the wall.
      - |
        This treats 200 as a length of fence. 200 is the area, which fixes the parallel side as 200/x.
    answer: 0
  - slug: apcalcab-u05-exam-q20
    type: multiple_choice
    topic_code: "5.11"
    source: "AP Calculus CED, Topic 5.11"
    points: 1
    prompt: |
      For the garden of area 200 m² fenced on three sides, the fence length is L(x) = 2x + 200/x for x > 0. What is the least possible length of fence?
    options:
      - "10 m"
      - "40 m"
      - "20√2 m"
      - "56.6 m"
    option_explanations:
      - |
        10 m is the length x of each perpendicular side at the optimum, not the total fence.
      - |
        Correct. L′(x) = 2 − 200/x² = 0 at x = 10, and L″(x) = 400/x³ > 0 for x > 0, so this is the absolute minimum: L(10) = 20 + 20 = 40 m.
      - |
        20√2 ≈ 28.3 comes from minimizing x + 200/x, which counts only one perpendicular side.
      - |
        56.6 ≈ 40√2 comes from fencing all four sides, 2x + 400/x.
    answer: 1
  - slug: apcalcab-u05-exam-q21
    type: multiple_choice
    topic_code: "5.5"
    source: "AP Calculus CED, Topic 5.5"
    points: 1
    prompt: |
      What is the absolute maximum value of f(x) = x + 2 cos x on the interval [0, π]?
    options:
      - "2"
      - "π − 2"
      - "π/6 + √3"
      - "5π/6 − √3"
    option_explanations:
      - |
        2 = f(0), the left endpoint. The critical point π/6 gives a larger value, about 2.256.
      - |
        π − 2 ≈ 1.142 is f(π), the right endpoint, smaller than f(π/6).
      - |
        Correct. f′(x) = 1 − 2 sin x = 0 when sin x = 1/2: x = π/6 and 5π/6. Candidates: f(0) = 2, f(π/6) = π/6 + √3 ≈ 2.256, f(5π/6) = 5π/6 − √3 ≈ 0.886, f(π) = π − 2 ≈ 1.142.
      - |
        5π/6 − √3 ≈ 0.886 is the absolute minimum on [0, π], at the relative minimum x = 5π/6.
    answer: 2
