  # ---- Short answer
  - slug: apcalcab-u05-exam-q42
    type: short_answer
    topic_code: "5.7"
    source: "AP Calculus CED, Topic 5.7"
    points: 3
    prompt: |
      Let f(x) = x³ − 3x² − 24x + 5.

      (a) Find the critical points of f.
      (b) Use the Second Derivative Test to classify each critical point.
      (c) Find the x-coordinate of the point of inflection of the graph of f, and justify that it is one.
    answer: |
      (a) f′(x) = 3x² − 6x − 24 = 3(x − 4)(x + 2), so the critical points are x = −2 and x = 4.
      (b) f″(x) = 6x − 6. f″(−2) = −18 < 0, so f has a relative maximum at x = −2. f″(4) = 18 > 0, so f has a relative minimum at x = 4.
      (c) x = 1, because f″(x) = 6x − 6 changes from negative to positive at x = 1.
    explanation: |
      Three points, one per part. (a) both critical points. (b) both classifications, each citing f′ = 0 and the sign of f″ at the point. (c) x = 1 with the sign change of f″ (not just f″(1) = 0).
  - slug: apcalcab-u05-exam-q43
    type: short_answer
    topic_code: "5.11"
    source: "AP Calculus CED, Topic 5.11"
    points: 3
    prompt: |
      Nonnegative numbers x and y satisfy x + 2y = 12. The product P = xy² is to be made as large as possible.

      (a) Write P as a function of y alone, and state its domain.
      (b) Find the value of y that maximizes P.
      (c) Justify that your answer gives the absolute maximum, and give the maximum product.
    answer: |
      (a) x = 12 − 2y, so P(y) = (12 − 2y)y² = 12y² − 2y³, for 0 ≤ y ≤ 6.
      (b) P′(y) = 24y − 6y² = 6y(4 − y) = 0 at y = 0 and y = 4; the interior critical point is y = 4.
      (c) Candidates Test on [0, 6]: P(0) = 0, P(4) = (4)(16) = 64, P(6) = 0. The absolute maximum is 64, at y = 4, x = 4.
    explanation: |
      Three points, one per part. (a) the one-variable function with the domain 0 ≤ y ≤ 6. (b) y = 4 from P′ = 0. (c) a valid absolute-maximum argument (candidates including both endpoints, or a sign change at the only interior critical point) and the value 64.
  # ---- Free response
  - slug: apcalcab-u05-exam-q44
    type: long_answer
    topic_code: "5.5"
    source: "AP Calculus CED, Topic 5.5"
    points: 9
    prompt: |
      (Calculator.) After a hypothetical storm, the depth of floodwater at a river gauge is modeled by W(t) = 40 + 15t e^(−0.25t), where W(t) is in centimeters and t is in hours, for 0 ≤ t ≤ 12.

      (A) Find W′(6). Using correct units, interpret the meaning of W′(6) in the context of the problem.

      (B) Find the time at which the depth of the water is greatest on 0 ≤ t ≤ 12, and the greatest depth. Justify your answer.

      (C) Explain why there must be a time t in (0, 12) at which W′(t) equals the average rate of change of W over 0 ≤ t ≤ 12. Find that time.

      (D) At what time in 4 ≤ t ≤ 12 is the water level falling fastest? Justify your answer.
    answer: |
      (A) W′(t) = 15e^(−0.25t)(1 − 0.25t), so W′(6) = 15e^(−1.5)(−0.5) ≈ −1.673. At t = 6 hours the depth is decreasing at about 1.673 cm per hour.
      (B) W′(t) = 0 only at t = 4. Candidates: W(0) = 40, W(4) = 40 + 60e^(−1) ≈ 62.073, W(12) = 40 + 180e^(−3) ≈ 48.962. The greatest depth is about 62.073 cm, at t = 4 hours.
      (C) W is differentiable, so it is continuous on [0, 12] and differentiable on (0, 12). The average rate is (W(12) − W(0))/12 ≈ 0.747 cm per hour. By the Mean Value Theorem W′(c) = 0.747 for some c in (0, 12); solving W′(t) = 0.747 gives t ≈ 3.520 hours.
      (D) The water falls fastest where W′ is least. W″(t) = 15e^(−0.25t)(0.0625t − 0.5) = 0 at t = 8, and W″ changes from negative to positive there. Candidates for the minimum of W′ on [4, 12]: W′(4) = 0, W′(8) = −15e^(−2) ≈ −2.030, W′(12) = −30e^(−3) ≈ −1.494. The level falls fastest at t = 8 hours, at about 2.030 cm per hour.
    explanation: |
      Nine points. (A) 2 points: 1 for W′(6) ≈ −1.673 (or −1.674); 1 for the interpretation with units (cm per hour) and "decreasing" at t = 6. (B) 3 points: 1 for W′(t) = 0 at t = 4; 1 for comparing W at t = 0, 4 and 12 (Candidates Test); 1 for the answer t = 4, depth ≈ 62.073 cm. (C) 2 points: 1 for the MVT with its hypotheses (W differentiable, hence continuous) and the average rate ≈ 0.747; 1 for t ≈ 3.520 (3.519 or 3.520). (D) 2 points: 1 for identifying t = 8 from W″ = 0 (the critical point of W′); 1 for the comparison with W′ at the endpoints, or an equivalent argument, and the answer t = 8. Values must be correct to three decimal places.
  - slug: apcalcab-u05-exam-q45
    type: long_answer
    topic_code: "5.4"
    source: "AP Calculus CED, Topic 5.4"
    points: 9
    prompt: |
      Let f(x) = (1/4)x⁴ − 2x³ + (9/2)x² + 2. Then f′(x) = x³ − 6x² + 9x and f″(x) = 3x² − 12x + 9. No calculator is allowed.

      (A) Find the critical points of f. For each, determine whether f has a relative maximum, a relative minimum or neither. Justify your answers.

      (B) Find the intervals on which the graph of f is concave down and the x-coordinates of all points of inflection. Justify your answers.

      (C) Find the absolute maximum and absolute minimum values of f on the interval [−1, 4]. Justify your answer.

      (D) Explain why there is a value c in (0, 4) with f′(c) = 2.
    answer: |
      (A) f′(x) = x(x − 3)², zero at x = 0 and x = 3. Since (x − 3)² ≥ 0, f′ has the sign of x: negative for x < 0, positive for 0 < x < 3 and for x > 3. f has a relative minimum at x = 0 because f′ changes from negative to positive there. f has neither at x = 3 because f′ does not change sign there.
      (B) f″(x) = 3(x − 1)(x − 3): positive for x < 1, negative for 1 < x < 3, positive for x > 3. The graph is concave down on 1 < x < 3. Points of inflection at x = 1 and x = 3, because f″ changes sign at each.
      (C) f is continuous on [−1, 4]. Candidates: f(−1) = 1/4 + 2 + 9/2 + 2 = 35/4, f(0) = 2, f(3) = 81/4 − 54 + 81/2 + 2 = 35/4, f(4) = 64 − 128 + 72 + 2 = 10. The absolute maximum is 10, at x = 4; the absolute minimum is 2, at x = 0.
      (D) f is a polynomial, so it is continuous on [0, 4] and differentiable on (0, 4). (f(4) − f(0))/(4 − 0) = (10 − 2)/4 = 2, so by the Mean Value Theorem f′(c) = 2 for some c in (0, 4).
    explanation: |
      Nine points. (A) 3 points: 1 for the critical points 0 and 3; 1 for the relative minimum at x = 0 justified by f′ changing from negative to positive; 1 for neither at x = 3 justified by no sign change of f′ (f′(3) = 0 alone earns nothing). (B) 2 points: 1 for concave down on 1 < x < 3; 1 for inflection points at x = 1 and x = 3 justified by the sign change of f″. (C) 3 points: 1 for considering all candidates −1, 0, 3 and 4; 1 for the correct values; 1 for maximum 10 at x = 4 and minimum 2 at x = 0. (D) 1 point for the secant slope 2 with the MVT and its hypotheses.
