  # ---- True or false
  - slug: apcalcab-u05-exam-q32
    type: true_false
    topic_code: "5.1"
    source: "AP Calculus CED, Topic 5.1"
    points: 1
    prompt: |
      True or false: Because h(x) = x^(2/3) has h(−1) = h(1), Rolle's theorem guarantees a horizontal tangent to its graph somewhere in (−1, 1).
    answer: false
    explanation: |
      False. h is continuous on [−1, 1], but h′(x) = (2/3)x^(−1/3) does not exist at x = 0, so h is not differentiable on (−1, 1) and the theorem does not apply. In fact h′ is never 0: the graph has a cusp at the origin instead of a horizontal tangent.
  - slug: apcalcab-u05-exam-q33
    type: true_false
    topic_code: "5.7"
    source: "AP Calculus CED, Topic 5.7"
    points: 1
    prompt: |
      True or false: If f′(c) = 0 and f″(c) = 0, then f has neither a relative maximum nor a relative minimum at x = c.
    answer: false
    explanation: |
      False. When f″(c) = 0 the Second Derivative Test is inconclusive; anything can happen. f(x) = x⁴ has f′(0) = f″(0) = 0 and a relative minimum at 0; −x⁴ has a maximum; x³ has neither. Use the First Derivative Test instead.
  - slug: apcalcab-u05-exam-q34
    type: true_false
    topic_code: "5.11"
    source: "AP Calculus CED, Topic 5.11"
    points: 1
    prompt: |
      True or false: When finding the point of a curve closest to a given point, minimizing the squared distance D² gives the same point as minimizing the distance D.
    answer: true
    explanation: |
      True. D ≥ 0, and for nonnegative numbers squaring preserves order (if 0 ≤ a < b, then a² < b²), so D and D² are smallest at the same input. Minimizing D² avoids differentiating a square root.
