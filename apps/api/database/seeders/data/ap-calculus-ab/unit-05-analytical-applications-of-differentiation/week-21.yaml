      prompt: |
        A hypothetical poster must have 384 cm² of printed area, with margins of 3 cm at the top and bottom and 2 cm on each side. Let w be the width of the printed area in centimeters.

        (a) Write the total area of the poster as a function of w, and state its domain.
        (b) Find the value of w that minimizes the total area.
        (c) Justify that your answer gives the absolute minimum, and give the poster's dimensions.
      answer: |
        (a) The printed height is 384/w, so the poster is (w + 4) by (384/w + 6): T(w) = (w + 4)(384/w + 6) = 408 + 6w + 1536/w, for w > 0.
        (b) T′(w) = 6 − 1536/w² = 0 gives w² = 256, so w = 16.
        (c) T′ changes from negative to positive at w = 16, the only critical point for w > 0 (or T″(w) = 3072/w³ > 0), so T(16) is the absolute minimum. The printed area is 16 by 24 cm, and the poster is 20 cm wide and 30 cm tall (600 cm²).
      explanation: |
        Three points. (a) the total-area function with the domain w > 0. (b) w = 16 from T′ = 0. (c) a valid absolute-minimum argument (one critical point with a sign change, or T″ > 0 on the domain) and the dimensions 20 cm by 30 cm.
    - slug: apcalcab-u05-w21-q22
      type: short_answer
      topic_code: "4.6"
      source: "AP Calculus CED, Topic 4.6"
      points: 3
      prompt: |
        Let f(x) = √x.

        (a) Write the equation of the line tangent to the graph of f at x = 4.
        (b) Use the tangent line to approximate √4.2.
        (c) Is your approximation an overestimate or an underestimate? Justify using f″.
      answer: |
        (a) f(4) = 2 and f′(x) = 1/(2√x), so f′(4) = 1/4. The tangent line is y = 2 + (1/4)(x − 4).
        (b) √4.2 ≈ 2 + (1/4)(0.2) = 2.05.
        (c) f″(x) = −1/(4x^(3/2)) < 0 for x > 0, so the graph is concave down and lies below its tangent lines: 2.05 is an overestimate. (√4.2 ≈ 2.0494.)
      explanation: |
        Three points, one per part. (a) the line with slope 1/4 through (4, 2). (b) 2.05. (c) overestimate, justified by f″ < 0 (concave down).
    - slug: apcalcab-u05-w21-q23
      type: long_answer
      topic_code: "5.11"
      source: "AP Calculus CED, Topic 5.11"
      points: 6
      prompt: |
        A hypothetical oil company needs a pipeline from an island to a refinery. The island is 3 km from the nearest point P on a straight shoreline, and the refinery is on the shoreline 8 km from P. The pipeline will run underwater in a straight line from the island to a point Q on the shore, x km from P toward the refinery, and then along the shore to the refinery. Underwater pipe costs $5,000 per km and pipe along the shore costs $4,000 per km.

        (A) Show that the cost, in thousands of dollars, is C(x) = 5√(x² + 9) + 4(8 − x), and state the domain.

        (B) Find C′(x).

        (C) Find the value of x that minimizes the cost, and justify that it gives the absolute minimum on the domain. You may use √73 > 8.2.

        (D) Find the minimum cost, and interpret C′(2) < 0 in context.
      answer: |
        (A) The underwater run is the hypotenuse of a right triangle with legs 3 and x: √(x² + 9) km at 5 thousand dollars per km. The shore run is 8 − x km at 4 thousand dollars per km. So C(x) = 5√(x² + 9) + 4(8 − x), for 0 ≤ x ≤ 8.
        (B) C′(x) = 5x/√(x² + 9) − 4.
        (C) C′(x) = 0 when 5x = 4√(x² + 9), so 25x² = 16x² + 144, x² = 16, x = 4 (x ≥ 0). Candidates: C(0) = 15 + 32 = 47, C(4) = 5(5) + 16 = 41, C(8) = 5√73 > 5(8.2) = 41. So the absolute minimum on [0, 8] is at x = 4.
        (D) The minimum cost is C(4) = 41 thousand dollars, $41,000. C′(2) = 10/√13 − 4 < 0 means that moving the landing point Q a little farther from P than 2 km would lower the cost (at about $1,230 per km at that point): x = 2 is not yet optimal.
      explanation: |
        Six points. (A) 1 point for both terms of C with their reasons and the domain 0 ≤ x ≤ 8. (B) 1 point for C′ (chain rule on the square root). (C) 3 points: 1 for solving C′ = 0 to get x = 4; 1 for the candidate values C(0) = 47 and C(4) = 41; 1 for C(8) = 5√73 > 41 and the conclusion (a sign-change argument with x = 4 the only critical point also earns these last 2 points). (D) 1 point for $41,000 with an interpretation of C′(2) < 0 as cost decreasing as x increases past 2.
