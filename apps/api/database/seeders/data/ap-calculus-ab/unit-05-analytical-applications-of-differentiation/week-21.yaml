      source: "AP Calculus CED, Topic 5.11"
      points: 1
      prompt: |
        True or false: If a function is continuous on an open interval and has exactly one critical point there, at which it has a relative maximum, then that relative maximum is the absolute maximum on the interval.
      answer: true
      explanation: |
        True. If some other point had a larger value, the function would have to turn around between the two points, creating a second critical point (a relative minimum) in the interval, which contradicts there being only one. This is the single-critical-point argument used to justify most optimization answers.
