        Three points, one per part. (a) 6 with units of liters per hour. (b) Both hypotheses (continuous on [1, 3], differentiable on (1, 3), which follow from W being differentiable) and the theorem named. (c) Yes, using W(3) = W(4) with the MVT or Rolle's theorem and the interval (3, 4). A conclusion with no theorem or no hypotheses earns no point.
    - slug: apcalcab-u05-w17-q22
      type: short_answer
      topic_code: "4.5"
      source: "AP Calculus CED, Topic 4.5"
      points: 3
      prompt: |
        A block of ice in the shape of a cube is melting so that each edge shrinks at a constant rate of 0.2 cm per minute.

        (a) Find the rate at which the volume is changing when the edge is 5 cm. Include units.
        (b) Find the rate at which the total surface area is changing at that same instant. Include units.
        (c) Is the volume decreasing faster when the edge is 5 cm or when it is 3 cm? Explain.
      answer: |
        (a) V = s³, so dV/dt = 3s² ds/dt = 3(25)(−0.2) = −15 cm³ per minute.
        (b) A = 6s², so dA/dt = 12s ds/dt = 12(5)(−0.2) = −12 cm² per minute.
        (c) At s = 3, dV/dt = 3(9)(−0.2) = −5.4 cm³ per minute. The volume is decreasing faster when the edge is 5 cm, because |dV/dt| = 3s²(0.2) grows with s.
      explanation: |
        Three points. (a) −15 cm³/min, with ds/dt = −0.2 (a positive answer loses the point). (b) −12 cm²/min. (c) 5 cm, supported by comparing −15 with −5.4 or by the factor 3s².
