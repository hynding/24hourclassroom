      type: long_answer
      topic_code: "5.2"
      source: "AP Calculus CED, Topic 5.2"
      points: 6
      prompt: |
        Let g(x) = x³ − 6x² + 9x + 1, considered on the closed interval [0, 4].

        (A) Explain why the Mean Value Theorem applies to g on [0, 4], and find every value of c in (0, 4) that satisfies its conclusion. Exact values are expected.

        (B) Find the critical points of g.

        (C) Explain why g must have an absolute maximum and an absolute minimum on [0, 4]. Find both values and every x at which each occurs.

        (D) Explain why there must be a value c in (1, 3) with g′(c) = −2.
      answer: |
        (A) g is a polynomial, so it is continuous on [0, 4] and differentiable on (0, 4). g(0) = 1 and g(4) = 64 − 96 + 36 + 1 = 5, so the secant slope is (5 − 1)/4 = 1. g′(x) = 3x² − 12x + 9 = 1 gives 3x² − 12x + 8 = 0, so x = (12 ± √48)/6 = 2 ± (2√3)/3. Both (about 0.845 and 3.155) lie in (0, 4).
        (B) g′(x) = 3(x² − 4x + 3) = 3(x − 1)(x − 3), so the critical points are x = 1 and x = 3.
        (C) g is continuous on the closed interval [0, 4], so by the Extreme Value Theorem it attains both. Candidates: g(0) = 1, g(1) = 5, g(3) = 27 − 54 + 27 + 1 = 1, g(4) = 5. Absolute maximum 5, at x = 1 and x = 4; absolute minimum 1, at x = 0 and x = 3.
        (D) g is continuous on [1, 3] and differentiable on (1, 3), and (g(3) − g(1))/(3 − 1) = (1 − 5)/2 = −2, so by the Mean Value Theorem g′(c) = −2 for some c in (1, 3).
      explanation: |
        Six points. (A) 2 points: 1 for the hypotheses (polynomial, so continuous on [0, 4] and differentiable on (0, 4)) with the secant slope 1; 1 for both values 2 ± (2√3)/3 (equivalently (6 ± 2√3)/3). (B) 1 point for x = 1 and x = 3 from g′ = 0. (C) 2 points: 1 for citing the EVT with continuity on a closed interval; 1 for maximum 5 at x = 1 and 4 and minimum 1 at x = 0 and 3, from a comparison of all four candidates (a missing tie location loses the point). (D) 1 point for the secant slope −2 with the MVT and its hypotheses on [1, 3].
