      answer: |
        (a) (38 − 26)/(3 − 1) = 6 liters per hour.
        (b) W is differentiable, so it is continuous on [1, 3] and differentiable on (1, 3). By the Mean Value Theorem there is a c in (1, 3) with W′(c) = (W(3) − W(1))/(3 − 1) = 6.
        (c) Yes. W(3) = W(4) = 38, and W is continuous on [3, 4] and differentiable on (3, 4), so by the Mean Value Theorem (Rolle's theorem) there is a c in (3, 4) with W′(c) = (38 − 38)/(4 − 3) = 0.
