    - slug: apcalcab-u05-w17-q16
      type: true_false
      topic_code: "5.1"
      source: "AP Calculus CED, Topic 5.1"
      points: 1
      prompt: |
        True or false: If f is differentiable on the open interval (a, b) and f(a) = f(b), then f′(c) = 0 for some c in (a, b).
      answer: false
      explanation: |
        False. Continuity on the closed interval [a, b] is missing. Example: f(x) = x for 0 ≤ x < 1 and f(1) = 0. Then f is differentiable on (0, 1) with f′(x) = 1 everywhere there, and f(0) = f(1) = 0, but f′ is never 0. The jump at the endpoint breaks the theorem.
    - slug: apcalcab-u05-w17-q17
      type: true_false
