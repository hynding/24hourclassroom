      source: "AP Calculus CED, Topic 5.2"
      points: 1
      prompt: |
        True or false: If f is differentiable for all real numbers and has a relative minimum at x = 4, then f′(4) = 0.
      answer: true
      explanation: |
        True. This is Fermat's theorem: at a relative extremum the derivative is 0 or does not exist. Here f′(4) exists because f is differentiable everywhere, so it must be 0. (The converse is false: f′(c) = 0 does not guarantee an extremum.)
