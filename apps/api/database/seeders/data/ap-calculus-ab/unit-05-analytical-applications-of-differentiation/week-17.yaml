      prompt: |
        The volume of water in a hypothetical rain barrel is modeled by a differentiable function W, where W(t) is in liters and t is in hours after a storm begins. Selected values are shown.

        | t (hours) | 0 | 1 | 3 | 4 | 6 |
        |---|---|---|---|---|---|
        | W(t) (liters) | 20 | 26 | 38 | 38 | 50 |

