week: 20
unit: 5
title: "Connecting f, f′ and f″, Sketching Graphs and Implicit Relations"
topics: ["5.8", "5.9", "5.12"]
guide: guides/week-20.md
guide_description: |
  Reading a graph of f′ to describe f (direction, extrema, concavity, inflection points), matching tables and
  sign charts of f, f′ and f″, sketching a graph from its derivatives, and analysing curves defined implicitly:
  horizontal and vertical tangents, d²y/dx² and concavity. Worked examples: a piecewise-linear graph of f′ on
  [−3, 4], a full sketch of x e^(−x²/2), a table of f, f′ and f″, the tangents of x² − xy + y² = 3, and the
  second derivative of x² + y² = 25.
flashcards_description: |
  30 cards on translating between the graphs of f, f′ and f″, the four increasing/decreasing and concavity
  combinations, sketch checklists, and implicit curves: horizontal and vertical tangents and d²y/dx².

flashcards:
  - front: Graph of f′ above the x-axis → what about f
    back: |
      f is increasing there. Below the axis: f is decreasing.
    topic_code: "5.9"
  - front: Graph of f′ crosses the x-axis from above to below → what about f
    back: |
      f has a relative maximum there (f′ changes from positive to negative). Below to above: relative minimum.
    topic_code: "5.9"
  - front: Graph of f′ touches the x-axis without crossing → what about f
    back: |
      A critical point with no extremum: f′ keeps its sign, so f keeps rising (or falling) through it.
    topic_code: "5.9"
  - front: Graph of f′ rising → what about f
    back: |
      f′ increasing ⟹ f concave up. Falling f′ ⟹ f concave down.
    topic_code: "5.9"
  - front: Relative maximum or minimum on the graph of f′ → what about f
    back: |
      A point of inflection of f: f′ switches between increasing and decreasing, so the concavity of f changes.
    topic_code: "5.9"
  - front: Slope of the graph of f′ at x = a → which quantity
    back: |
      f″(a). On a line segment of the f′ graph, f″ is that segment's slope.
    topic_code: "5.9"
  - front: f′ graph with vertices (−3, −2), (−1, 2), (2, −1), (4, 1) → relative extrema of f
    back: |
      f′ = 0 at x = −2, 1 and 3. Relative minima at −2 and 3 (− to +); relative maximum at 1 (+ to −).
    topic_code: "5.9"
  - front: Same f′ graph (vertices (−3, −2), (−1, 2), (2, −1), (4, 1)) → inflection points of f
    back: |
      At x = −1 and x = 2, where f′ switches between increasing and decreasing (the corners of the f′ graph).
    topic_code: "5.9"
  - front: Table with f′ < 0 and f″ > 0 → what the values of f look like
    back: |
      Decreasing by smaller and smaller amounts, such as 10, 6, 3, 1 (changes −4, −3, −2).
    topic_code: "5.9"
  - front: Increasing and concave down → sign pair and picture
    back: |
      f′ > 0, f″ < 0. Rising but levelling off, like √x.
    topic_code: "5.8"
  - front: Decreasing and concave up → sign pair and picture
    back: |
      f′ < 0, f″ > 0. Falling but levelling off, like e^(−x).
    topic_code: "5.8"
  - front: Decreasing and concave down → sign pair and picture
    back: |
      f′ < 0, f″ < 0. Falling faster and faster, like −x² for x > 0.
    topic_code: "5.8"
  - front: Sketching checklist → the five things to find
    back: |
      Domain and intercepts; asymptotes and end behavior; where f′ is +, − or 0 (extrema); where f″ is + or − (concavity, inflection); a few plotted values.
    topic_code: "5.8"
  - front: x e^(−x²/2) → relative extrema
    back: |
      f′ = (1 − x²)e^(−x²/2). Relative minimum at x = −1, relative maximum at x = 1 (value e^(−1/2) ≈ 0.607).
    topic_code: "5.8"
  - front: x e^(−x²/2) → inflection points and end behavior
    back: |
      f″ = x(x² − 3)e^(−x²/2): inflection points at x = −√3, 0, √3. f → 0 as x → ±∞ (asymptote y = 0).
    topic_code: "5.8"
  - front: Cubic with relative max at x = −1 and relative min at x = 3 → shape of f′
    back: |
      An upward parabola with zeros at −1 and 3: positive outside, negative between, lowest at x = 1 (the inflection point of f).
    topic_code: "5.8"
  - front: Graph of f″ is the line y = x/2 → what about f′
    back: |
      f′ decreases for x < 0 and increases for x > 0, so f′ has a relative minimum at x = 0 (and f an inflection point).
    topic_code: "5.9"
  - front: Error-spot → "the f′ graph has a peak at x = 2, so f has a maximum at x = 2"
    back: |
      A peak of f′ is where f is steepest: an inflection point of f. Maxima of f are where f′ crosses 0 from + to −.
    topic_code: "5.9"
  - front: Error-spot → "f′(3) = 0 and f is decreasing on [3, 4]" when f′(4) = 3
    back: |
      f′(4) = 3 > 0 means f is increasing at x = 4. Read signs of f′ for direction, not values of f.
    topic_code: "5.9"
  - front: Implicit curve → condition for a horizontal tangent
    back: |
      dy/dx = 0: the numerator of dy/dx is 0 and the denominator is not, at a point on the curve.
    topic_code: "5.12"
  - front: Implicit curve → condition for a vertical tangent
    back: |
      The denominator of dy/dx is 0 and the numerator is not, at a point on the curve (dy/dx undefined, dx/dy = 0).
    topic_code: "5.12"
  - front: Implicit curve with 0/0 for dy/dx at a point → what it means
    back: |
      No conclusion from the formula: the point may be a cusp, a self-crossing or something else. Investigate separately.
    topic_code: "5.12"
  - front: x² − xy + y² = 3 → dy/dx
    back: |
      2x − y − x y′ + 2y y′ = 0, so dy/dx = (y − 2x)/(2y − x).
    topic_code: "5.12"
  - front: x² − xy + y² = 3 → horizontal and vertical tangents
    back: |
      Horizontal: y = 2x gives (1, 2) and (−1, −2). Vertical: x = 2y gives (2, 1) and (−2, −1).
    topic_code: "5.12"
  - front: Circle x² + y² − 4x + 6y = 12 → horizontal tangent points
    back: |
      dy/dx = −(2x − 4)/(2y + 6) = 0 at x = 2; on the circle (center (2, −3), radius 5): (2, 2) and (2, −8).
    topic_code: "5.12"
  - front: x = y² − 4y → vertical tangent
    back: |
      dy/dx = 1/(2y − 4), undefined at y = 2. The point is (−4, 2), the vertex of the sideways parabola.
    topic_code: "5.12"
  - front: x² + y² = 25 → d²y/dx²
    back: |
      y′ = −x/y; y″ = −(y − x y′)/y² = −(x² + y²)/y³ = −25/y³. At (3, 4): −25/64.
    topic_code: "5.12"
  - front: d²y/dx² for an implicit curve → the substitution step
    back: |
      After differentiating dy/dx (quotient rule), replace every y′ by its formula, then simplify, often using the original equation.
    topic_code: "5.12"
  - front: Upper half of x² + y² = 25 → concavity
    back: |
      y″ = −25/y³ < 0 when y > 0: concave down everywhere on the upper semicircle (and concave up on the lower one).
    topic_code: "5.12"
  - front: Error-spot → "d/dx (−x/y) = −1/y"
    back: |
      y depends on x. Use the quotient rule: d/dx (−x/y) = −(y − x dy/dx)/y².
    topic_code: "5.12"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 5.8, 5.9 and 5.12: reading the graph of f′,
    matching f, f′ and f″, sketching, and horizontal tangents, vertical tangents and concavity of implicit
    curves), with 7 questions (about 30%) reviewing weeks 11 to 19 (inverse trigonometric derivatives, motion,
    related rates, the First and Second Derivative Tests, the Candidates Test and concavity). Opens with a
    shared-context set on a piecewise-linear graph of f′. Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes. No calculator is needed.
  questions:
    # ---- Stimulus set: a piecewise-linear graph of f′ (5.9, 5.8, 5.6)
    - slug: apcalcab-u05-w20-q01
      type: multiple_choice
      topic_code: "5.9"
      source: "AP Calculus CED, Topic 5.9"
      points: 1
      stimulus: |
        A function f is continuous on [−3, 4] and differentiable on (−3, 4). The graph of its derivative f′ consists of three line segments joining the points (−3, −2), (−1, 2), (2, −1) and (4, 1). So f′ crosses the x-axis at x = −2, x = 1 and x = 3.
      prompt: |
        At which x does f have a relative maximum?
      options:
        - "x = −1"
        - "x = −2 and x = 3"
        - "x = 2"
        - "x = 1"
      option_explanations:
        - |
          x = −1 is the peak of the f′ graph, where f is steepest: a point of inflection of f, not a maximum.
        - |
          At x = −2 and x = 3, f′ changes from negative to positive, so these are relative minima of f.
        - |
          x = 2 is the lowest point of the f′ graph, a point of inflection of f. f′(2) = −1 ≠ 0.
        - |
          Correct. f′ changes from positive to negative at x = 1 (the segment falls from 2 at x = −1 to −1 at x = 2), so f has a relative maximum there.
      answer: 3
    - slug: apcalcab-u05-w20-q02
      type: multiple_choice
      topic_code: "5.9"
      source: "AP Calculus CED, Topic 5.9"
      points: 1
      stimulus: |
        A function f is continuous on [−3, 4] and differentiable on (−3, 4). The graph of its derivative f′ consists of three line segments joining the points (−3, −2), (−1, 2), (2, −1) and (4, 1). So f′ crosses the x-axis at x = −2, x = 1 and x = 3.
      prompt: |
        At which x-values does the graph of f have a point of inflection?
      options:
        - "x = −2, x = 1 and x = 3"
        - "x = −1 and x = 2"
        - "x = 1 only"
        - "x = −3 and x = 4"
      option_explanations:
        - |
          These are the zeros of f′, which locate the extrema of f. Inflection points come from changes in the direction of f′.
        - |
          Correct. f′ changes from increasing to decreasing at x = −1 and from decreasing to increasing at x = 2, so the concavity of f changes at both.
        - |
          x = 1 is the relative maximum of f; f′ is decreasing on both sides of it, so the concavity does not change there.
        - |
          These are the endpoints of the domain. A point of inflection needs a concavity change with the graph on both sides.
      answer: 1
    - slug: apcalcab-u05-w20-q03
      type: multiple_choice
      topic_code: "5.9"
      source: "AP Calculus CED, Topic 5.9"
      points: 1
      stimulus: |
        A function f is continuous on [−3, 4] and differentiable on (−3, 4). The graph of its derivative f′ consists of three line segments joining the points (−3, −2), (−1, 2), (2, −1) and (4, 1). So f′ crosses the x-axis at x = −2, x = 1 and x = 3.
      prompt: |
        What is f″(0)?
      options:
        - "−1"
        - "1"
        - "0"
        - "2"
      option_explanations:
        - |
          Correct. f″ is the slope of the f′ graph. At x = 0 the f′ graph is on the segment from (−1, 2) to (2, −1), whose slope is (−1 − 2)/(2 − (−1)) = −1.
        - |
          1 is the value f′(0) (the segment passes through (0, 1)), not its slope. f″(0) is the slope of the f′ graph.
        - |
          f″(0) = 0 would need the f′ graph to be flat at x = 0; it is a falling segment there.
        - |
          2 is f′(−1), the height of the f′ graph at its peak, not the slope at x = 0.
      answer: 0
    - slug: apcalcab-u05-w20-q04
      type: multiple_choice
      topic_code: "5.8"
      source: "AP Calculus CED, Topic 5.8"
      points: 1
      stimulus: |
        A function f is continuous on [−3, 4] and differentiable on (−3, 4). The graph of its derivative f′ consists of three line segments joining the points (−3, −2), (−1, 2), (2, −1) and (4, 1). So f′ crosses the x-axis at x = −2, x = 1 and x = 3.
      prompt: |
        On which intervals is f both decreasing and concave up?
      options:
        - "1 < x < 3"
        - "−1 < x < 1"
        - "−3 < x < −2 and 2 < x < 3"
        - "−2 < x < −1 and 3 < x < 4"
      option_explanations:
        - |
          f′ < 0 on 1 < x < 3, so f is decreasing, but f′ is falling on 1 < x < 2, so f is concave down there.
        - |
          f′ > 0 on −1 < x < 1, so f is increasing there, and f′ is falling, so f is concave down: the opposite of both conditions.
        - |
          Correct. Decreasing needs f′ < 0 (−3 < x < −2 and 1 < x < 3); concave up needs f′ increasing (−3 < x < −1 and 2 < x < 4). Both hold on −3 < x < −2 and 2 < x < 3.
        - |
          On these intervals f′ is positive and rising, so f is increasing and concave up, not decreasing.
      answer: 2
    - slug: apcalcab-u05-w20-q05
      type: multiple_choice
      topic_code: "5.6"
      source: "AP Calculus CED, Topic 5.6"
      points: 1
      stimulus: |
        A function f is continuous on [−3, 4] and differentiable on (−3, 4). The graph of its derivative f′ consists of three line segments joining the points (−3, −2), (−1, 2), (2, −1) and (4, 1). So f′ crosses the x-axis at x = −2, x = 1 and x = 3.
      prompt: |
        On which interval is the graph of f concave down?
      options:
        - "−2 < x < 1"
        - "1 < x < 3"
        - "−3 < x < −1"
        - "−1 < x < 2"
      option_explanations:
        - |
          f′ > 0 on −2 < x < 1, which makes f increasing; concavity depends on whether f′ rises or falls, and it rises on −2 < x < −1.
        - |
          f′ < 0 on 1 < x < 3, which makes f decreasing; f′ is rising on 2 < x < 3, so part of this interval is concave up.
        - |
          The f′ graph rises from −2 to 2 on −3 < x < −1, so f is concave up there.
        - |
          Correct. f′ is decreasing on −1 < x < 2 (the segment from (−1, 2) to (2, −1)), so the graph of f is concave down there.
      answer: 3
    # ---- Independent items
    - slug: apcalcab-u05-w20-q06
      type: multiple_choice
      topic_code: "5.8"
      source: "AP Calculus CED, Topic 5.8"
      points: 1
      prompt: |
        A cubic polynomial f has a relative maximum at x = −1 and a relative minimum at x = 3. Which describes the graph of f′?
      options:
        - "A parabola opening downward with zeros at −1 and 3"
        - "A parabola opening upward with zeros at −1 and 3 and its lowest point at x = 1"
        - "A parabola opening upward with its vertex at (−1, 3)"
        - "A line crossing the x-axis at x = 1"
      option_explanations:
        - |
          A downward parabola would make f′ positive between −1 and 3, so f would rise there: a minimum at −1 and a maximum at 3, the reverse.
        - |
          Correct. f′ is quadratic with zeros at the extrema. f′ > 0 before −1 and after 3 and f′ < 0 between, so the parabola opens upward, with vertex halfway, at x = 1 (the inflection point of f).
        - |
          This puts the extremum locations into a vertex. −1 and 3 are where f′ = 0, so they are the parabola's x-intercepts.
        - |
          The derivative of a cubic is quadratic, not linear; a line is the graph of f″.
      answer: 1
    - slug: apcalcab-u05-w20-q07
      type: multiple_choice
      topic_code: "5.9"
      source: "AP Calculus CED, Topic 5.9"
      points: 1
      prompt: |
        A twice-differentiable function f has f′(x) < 0 and f″(x) > 0 for 0 ≤ x ≤ 3. Which table of values could belong to f?
      options:
        - "f(0) = 10, f(1) = 6, f(2) = 3, f(3) = 1"
        - "f(0) = 10, f(1) = 9, f(2) = 7, f(3) = 4"
        - "f(0) = 1, f(1) = 3, f(2) = 6, f(3) = 10"
        - "f(0) = 1, f(1) = 5, f(2) = 8, f(3) = 10"
      option_explanations:
        - |
          Correct. The values decrease (f′ < 0), and the changes −4, −3, −2 are increasing, so the slopes increase: concave up (f″ > 0).
        - |
          The values decrease, but the changes −1, −2, −3 get more negative, so f is concave down, not up.
        - |
          The changes 2, 3, 4 are increasing, so this is concave up, but the values increase, so f′ > 0.
        - |
          The values increase and the changes 4, 3, 2 shrink: increasing and concave down, the opposite on both counts.
      answer: 0
    - slug: apcalcab-u05-w20-q08
      type: multiple_choice
      topic_code: "5.12"
      source: "AP Calculus CED, Topic 5.12"
      points: 1
      prompt: |
        At which points does the curve x² + y² − 4x + 6y = 12 have a horizontal tangent line?
      options:
        - "(−3, −3) and (7, −3)"
        - "(2, −3) only"
        - "(2, 2) and (2, −8)"
        - "(0, 2) and (0, −8)"
      option_explanations:
        - |
          These are the points with y = −3, where the denominator 2y + 6 of dy/dx is 0: the vertical tangents.
        - |
          (2, −3) is the center of the circle, and it is not on the curve.
        - |
          Correct. 2x + 2y y′ − 4 + 6y′ = 0 gives dy/dx = −(2x − 4)/(2y + 6), which is 0 when x = 2. Substituting: y² + 6y − 16 = 0, so y = 2 or y = −8.
        - |
          These set x = 0, a y-intercept idea. A horizontal tangent needs the numerator 2x − 4 to be 0, which means x = 2.
      answer: 2
    - slug: apcalcab-u05-w20-q09
      type: multiple_choice
      topic_code: "5.12"
      source: "AP Calculus CED, Topic 5.12"
      points: 1
      prompt: |
        At which point does the curve x = y² − 4y have a vertical tangent line?
      options:
        - "(0, 0) and (0, 4)"
        - "(−4, 2)"
        - "(−4, 0)"
        - "The curve has no vertical tangent."
      option_explanations:
        - |
          These are the points where the curve meets the y-axis (x = 0). At (0, 0), dy/dx = 1/(0 − 4) = −1/4, which is defined.
        - |
          Correct. Differentiating with respect to x: 1 = (2y − 4) dy/dx, so dy/dx = 1/(2y − 4), undefined when y = 2. Then x = 4 − 8 = −4.
        - |
          The y-coordinate comes from 2y − 4 = 0, so y = 2, not 0; (−4, 0) is not even on the curve.
        - |
          The curve is a parabola opening to the right; its vertex has a vertical tangent where 2y − 4 = 0.
      answer: 1
    - slug: apcalcab-u05-w20-q10
      type: multiple_choice
      topic_code: "5.12"
      source: "AP Calculus CED, Topic 5.12"
      points: 1
      prompt: |
        For the curve x² + y² = 25, what is the value of d²y/dx² at the point (3, 4)?
      options:
        - "−25/64"
        - "−3/4"
        - "25/64"
        - "−1/4"
      option_explanations:
        - |
          Correct. dy/dx = −x/y. Then d²y/dx² = −(y − x dy/dx)/y² = −(4 − 3(−3/4))/16 = −(25/4)/16 = −25/64. (The curve is concave down there.)
        - |
          −3/4 is dy/dx = −x/y at (3, 4), the first derivative, not the second.
        - |
          The sign is lost in the quotient rule: d/dx (−x/y) = −(y − x y′)/y², which is negative here.
        - |
          This differentiates −x/y as if y were a constant, giving −1/y. y depends on x, so the quotient rule is needed.
      answer: 0
    - slug: apcalcab-u05-w20-q11
      type: multiple_choice
      topic_code: "5.9"
      source: "AP Calculus CED, Topic 5.9"
      points: 1
      prompt: |
        The graph of f″, the second derivative of a function f, is the line through (−4, −2) and (4, 2) on −4 ≤ x ≤ 4. Which statement must be true?
      options:
        - "f has a relative minimum at x = 0."
        - "f′ is decreasing on 0 < x < 4."
        - "f′ has a relative minimum at x = 0."
        - "The graph of f is concave down on 0 < x < 4."
      option_explanations:
        - |
          That would need f′(0) = 0 and a sign change of f′, but no values of f′ are given. f″ alone decides concavity, not extrema of f.
        - |
          f″ = x/2 is positive on 0 < x < 4, so f′ is increasing there, not decreasing.
        - |
          Correct. f″ (the derivative of f′) changes from negative to positive at x = 0, so f′ has a relative minimum there (and f has a point of inflection).
        - |
          f″ > 0 on 0 < x < 4, which means concave up, not down.
      answer: 2
    - slug: apcalcab-u05-w20-q12
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Calculus CED, Topic 4.4"
      points: 1
      prompt: |
        The radius of a circular ripple is increasing at 3 cm per second. How fast is the area enclosed by the ripple increasing when the radius is 10 cm?
      options:
        - "20π cm² per second"
        - "300π cm² per second"
        - "6π cm² per second"
        - "60π cm² per second"
      option_explanations:
        - |
          20π is dA/dr = 2πr at r = 10. It still has to be multiplied by dr/dt = 3.
        - |
          This substitutes r = 10 into πr² and multiplies by 3, skipping the derivative of the area.
        - |
          This uses 2π · dr/dt, leaving out the radius: dA/dt = 2πr dr/dt needs r = 10.
        - |
          Correct. A = πr², so dA/dt = 2πr dr/dt = 2π(10)(3) = 60π cm² per second.
      answer: 3
    - slug: apcalcab-u05-w20-q13
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Calculus CED, Topic 3.4"
      points: 1
      prompt: |
        What is d/dx [arctan(2x)]?
      options:
        - "1/(1 + 4x²)"
        - "2/(1 + 4x²)"
        - "2/(1 + 2x²)"
        - "2/√(1 − 4x²)"
      option_explanations:
        - |
          This forgets the chain-rule factor: the derivative of the inner function 2x is 2.
        - |
          Correct. d/dx [arctan u] = u′/(1 + u²) with u = 2x: 2/(1 + (2x)²) = 2/(1 + 4x²).
        - |
          The square applies to the whole inner function: (2x)² = 4x², not 2x².
        - |
          This uses the derivative pattern of arcsin, u′/√(1 − u²), instead of arctan.
      answer: 1
    - slug: apcalcab-u05-w20-q14
      type: multi_select
      topic_code: "5.9"
      source: "AP Calculus CED, Topic 5.9"
      points: 2
      partial_credit: true
      prompt: |
        A function f is twice differentiable on 0 < x < 5. Selected values of f, f′ and f″ are shown.

        | x | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|
        | f(x) | 5 | 3 | 1 | 2 |
        | f′(x) | −1 | −2 | 0 | 3 |
        | f″(x) | −2 | 0 | 4 | 1 |

        Which statements must be true? Select all that apply.
      options:
        - "f has a relative minimum at x = 3."
        - "The graph of f has a point of inflection at x = 2."
        - "The graph of f is concave down at x = 1."
        - "f is decreasing on the interval 3 < x < 4."
        - "The tangent line at x = 4 gives an overestimate of f(4.1)."
      option_explanations:
        - |
          Correct. f′(3) = 0 and f″(3) = 4 > 0, so by the Second Derivative Test f has a relative minimum at x = 3.
        - |
          f″(2) = 0 is only a candidate. Without knowing that f″ changes sign at x = 2, no inflection point can be claimed.
        - |
          Correct. f″(1) = −2 < 0, so the graph is concave down at x = 1.
        - |
          The table gives f′(3) = 0 and f′(4) = 3, and f rises from 1 to 2. Nothing shows f′ < 0 there; f is increasing at x = 4.
        - |
          f″(4) = 1 > 0, so the graph is concave up near x = 4 and lies above its tangent line: the approximation is an underestimate.
      answer: [0, 2]
