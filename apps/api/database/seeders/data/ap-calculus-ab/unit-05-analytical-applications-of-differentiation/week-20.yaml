    - slug: apcalcab-u05-w20-q21
      type: short_answer
      topic_code: "5.12"
      source: "AP Calculus CED, Topic 5.12"
      points: 3
      prompt: |
        Consider the curve x² − xy + y² = 3.

        (a) Show that dy/dx = (y − 2x)/(2y − x).
        (b) Find all points on the curve where the tangent line is horizontal.
        (c) Find all points on the curve where the tangent line is vertical.
      answer: |
        (a) Differentiate: 2x − (y + x dy/dx) + 2y dy/dx = 0, so (2y − x) dy/dx = y − 2x and dy/dx = (y − 2x)/(2y − x).
        (b) Horizontal: y − 2x = 0, so y = 2x. Then x² − 2x² + 4x² = 3x² = 3, so x = ±1: the points (1, 2) and (−1, −2). There 2y − x = 3 or −3, not 0.
        (c) Vertical: 2y − x = 0, so x = 2y. Then 4y² − 2y² + y² = 3y² = 3, so y = ±1: the points (2, 1) and (−2, −1). There y − 2x = −3 or 3, not 0.
      explanation: |
        Three points, one per part. (a) the implicit derivative with the product rule on xy. (b) both points (1, 2) and (−1, −2), found by substituting y = 2x into the curve. (c) both points (2, 1) and (−2, −1). Points not on the curve, or only the condition without coordinates, earn nothing.
    - slug: apcalcab-u05-w20-q22
      type: short_answer
      topic_code: "5.5"
      source: "AP Calculus CED, Topic 5.5"
      points: 3
      prompt: |
        Let f(x) = sin x + cos x on the closed interval [0, π].

        (a) Find the critical point of f in (0, π).
        (b) Find the absolute maximum and absolute minimum values of f on [0, π], and where they occur.
        (c) Name the theorem that guarantees these values exist, and say why it applies.
      answer: |
        (a) f′(x) = cos x − sin x = 0 when tan x = 1, so x = π/4 in (0, π).
        (b) Candidates: f(0) = 0 + 1 = 1, f(π/4) = √2/2 + √2/2 = √2, f(π) = 0 − 1 = −1. Absolute maximum √2 at x = π/4; absolute minimum −1 at x = π.
        (c) The Extreme Value Theorem: f is continuous on the closed interval [0, π].
      explanation: |
        Three points. (a) x = π/4. (b) √2 at π/4 and −1 at π, from a comparison including both endpoints. (c) the EVT with continuity on a closed interval.
    - slug: apcalcab-u05-w20-q23
      type: long_answer
      topic_code: "5.8"
      source: "AP Calculus CED, Topic 5.8"
      points: 6
      prompt: |
        Let f(x) = x e^(−x²/2). Then f′(x) = (1 − x²)e^(−x²/2) and f″(x) = x(x² − 3)e^(−x²/2).

        (A) Find the x-coordinates of the relative extrema of f, and classify each. Justify your answers.

        (B) Find the intervals on which the graph of f is concave up, and the x-coordinates of all points of inflection. Justify your answers.

        (C) Find lim (x→∞) f(x), and use it with f(−x) = −f(x) to describe the end behavior of the graph.

        (D) Find the absolute maximum value of f on (−∞, ∞), and explain why it is an absolute maximum.
      answer: |
        (A) e^(−x²/2) > 0, so f′ has the sign of 1 − x²: negative for x < −1, positive for −1 < x < 1, negative for x > 1. f has a relative minimum at x = −1 because f′ changes from negative to positive there, and a relative maximum at x = 1 because f′ changes from positive to negative there.
        (B) f″ has the sign of x(x² − 3) = x(x − √3)(x + √3): negative for x < −√3, positive for −√3 < x < 0, negative for 0 < x < √3, positive for x > √3. Concave up on −√3 < x < 0 and x > √3. f″ changes sign at x = −√3, 0 and √3, so all three are points of inflection.
        (C) lim (x→∞) x/e^(x²/2) = lim (x→∞) 1/(x e^(x²/2)) = 0 by L'Hospital's rule. Since f is odd, lim (x→−∞) f(x) = 0 as well: the x-axis is a horizontal asymptote at both ends.
        (D) The absolute maximum is f(1) = e^(−1/2) = 1/√e ≈ 0.607. f is increasing on [−1, 1] and decreasing on [1, ∞), so f(x) ≤ f(1) for x ≥ −1; for x < 0, f(x) < 0 < f(1). So f(1) is the largest value of f.
      explanation: |
        Six points. (A) 2 points: 1 for each extremum with its classification justified by the sign change of f′ (no justification, no point). (B) 2 points: 1 for both concave-up intervals; 1 for all three inflection points justified by the sign change of f″. (C) 1 point for the limit 0 with a valid reason (L'Hospital's rule or growth rates) and the statement about both ends. (D) 1 point for e^(−1/2) with an argument covering the whole real line (only one relative maximum and f negative for x < 0, or an equivalent increasing/decreasing argument).
