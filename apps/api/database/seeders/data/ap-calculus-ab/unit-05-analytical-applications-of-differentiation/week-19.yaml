    - slug: apcalcab-u05-w19-q21
      type: short_answer
      topic_code: "5.7"
      source: "AP Calculus CED, Topic 5.7"
      points: 3
      prompt: |
        Let g(x) = x ln x for x > 0.

        (a) Find the critical point of g.
        (b) Use the Second Derivative Test to classify the critical point, and give the value of g there.
        (c) Explain why the graph of g has no point of inflection.
      answer: |
        (a) g′(x) = ln x + x · (1/x) = ln x + 1. g′(x) = 0 when ln x = −1, so x = 1/e.
        (b) g″(x) = 1/x, and g″(1/e) = e > 0. Since g′(1/e) = 0 and g″(1/e) > 0, g has a relative minimum at x = 1/e, with value g(1/e) = (1/e)(−1) = −1/e.
        (c) g″(x) = 1/x > 0 for every x in the domain x > 0, so g″ never changes sign: the graph is concave up everywhere and has no point of inflection.
      explanation: |
        Three points. (a) x = 1/e from g′ = ln x + 1 (product rule required). (b) relative minimum citing both g′(1/e) = 0 and g″(1/e) > 0, with the value −1/e. (c) g″ = 1/x is positive on the whole domain, so no sign change.
    - slug: apcalcab-u05-w19-q22
      type: short_answer
      topic_code: "4.3"
      source: "AP Calculus CED, Topic 4.3"
      points: 3
      prompt: |
        A hypothetical workshop's cost of making x chairs is C(x) = 0.02x² + 4x + 500 dollars.

        (a) Find C′(100) and interpret it in context, with units.
        (b) Find C″(x) and explain what its sign says about the cost of making more chairs.
        (c) Compute C(101) − C(100) and compare it with C′(100).
      answer: |
        (a) C′(x) = 0.04x + 4, so C′(100) = 8 dollars per chair: when 100 chairs are being made, the cost is increasing at about $8 per additional chair.
        (b) C″(x) = 0.04 > 0, so C′ is increasing: each additional chair costs a little more than the one before (the graph of C is concave up).
        (c) C(101) − C(100) = 0.02(101² − 100²) + 4 = 0.02(201) + 4 = 8.02 dollars, very close to C′(100) = 8. The derivative approximates the cost of the 101st chair.
      explanation: |
        Three points. (a) 8 with units and an interpretation at x = 100. (b) C″ = 0.04 with the meaning that the marginal cost increases. (c) 8.02 with the comparison.
    - slug: apcalcab-u05-w19-q23
      type: long_answer
      topic_code: "5.6"
      source: "AP Calculus CED, Topic 5.6"
      points: 6
      prompt: |
        A function f is twice differentiable for all real numbers, with f′(x) = x³ − 3x² and f(2) = −1.

        (A) Find the x-coordinate of each relative extremum of f, and classify each. Justify your answers.

        (B) At each critical point, say what the Second Derivative Test concludes.

        (C) Find the intervals on which the graph of f is concave up and concave down, and the x-coordinate of each point of inflection. Justify your answers.

        (D) Write the equation of the line tangent to the graph of f at x = 2, and use it to approximate f(2.1). Is the approximation an overestimate or an underestimate? Justify your answer.
      answer: |
        (A) f′(x) = x²(x − 3), zero at x = 0 and x = 3. Since x² ≥ 0, f′ has the sign of x − 3: negative for x < 3 (except f′(0) = 0), positive for x > 3. f has a relative minimum at x = 3 because f′ changes from negative to positive there. f has no relative extremum at x = 0 because f′ does not change sign there.
        (B) f″(x) = 3x² − 6x = 3x(x − 2). f″(3) = 9 > 0 with f′(3) = 0, so the test confirms a relative minimum at x = 3. f″(0) = 0, so the test is inconclusive at x = 0.
        (C) f″ > 0 for x < 0 and x > 2 (concave up); f″ < 0 for 0 < x < 2 (concave down). Points of inflection at x = 0 and x = 2, because f″ changes sign at each.
        (D) f′(2) = 8 − 12 = −4, so the tangent line is y = −1 − 4(x − 2). f(2.1) ≈ −1 − 4(0.1) = −1.4. On 2 < x < 2.1, f″ > 0, so the graph is concave up there and lies above its tangent line: −1.4 is an underestimate.
      explanation: |
        Six points. (A) 2 points: 1 for the relative minimum at x = 3 justified by f′ changing from negative to positive; 1 for stating no extremum at x = 0 because f′ does not change sign. (B) 1 point: f″(3) > 0 confirms the minimum and f″(0) = 0 makes the test inconclusive (both needed). (C) 2 points: 1 for the concavity intervals; 1 for inflection points at x = 0 and x = 2 justified by the sign change of f″. (D) 1 point: the line, −1.4, and underestimate justified by f″ > 0 (concave up) on the interval to the right of 2. Saying "inflection at 2, so it cannot be determined" does not earn the point.
