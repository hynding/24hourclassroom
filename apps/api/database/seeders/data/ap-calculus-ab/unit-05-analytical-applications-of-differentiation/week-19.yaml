      points: 1
      prompt: |
        True or false: The function g(x) = |x − 2| + 1 satisfies the hypotheses of the Mean Value Theorem on the interval [0, 3].
      answer: false
      explanation: |
        False. g is continuous on [0, 3], but it has a corner at x = 2, which lies inside (0, 3), so g is not differentiable on (0, 3). Indeed the secant slope is (g(3) − g(0))/3 = (2 − 3)/3 = −1/3, while g′ is only ever −1 or 1.
