week: 19
unit: 5
title: "Concavity, Points of Inflection and the Second Derivative Test"
topics: ["5.6", "5.7"]
guide: guides/week-19.md
guide_description: |
  Concavity defined through the behavior of f′ (increasing f′ means concave up), the sign of f″ as the working
  test, points of inflection as places where f″ changes sign (not merely where f″ = 0), concavity in context,
  and the Second Derivative Test for relative extrema, including when it fails and what to do then. Worked
  examples: the concavity of x⁴ − 6x², the inflection point of x eˣ, a repeated factor in f″, a hypothetical
  rumor-spread model, the Second Derivative Test on x³ − 12x, and x⁴, where the test is inconclusive.
flashcards_description: |
  30 cards on concavity and its link to f′ and f″, points of inflection and their justification, reading
  concavity from a graph of f′ or a table, concavity in context, and the Second Derivative Test.

flashcards:
  - front: Concave up on an interval → definition through f′
    back: |
      f′ is increasing on the interval. The graph bends upward and lies above its tangent lines.
    topic_code: "5.6"
  - front: Concave down on an interval → definition through f′
    back: |
      f′ is decreasing on the interval. The graph bends downward and lies below its tangent lines.
    topic_code: "5.6"
  - front: Sign of f″ → concavity test
    back: |
      f″ > 0 on an interval ⟹ f concave up there. f″ < 0 ⟹ concave down.
    topic_code: "5.6"
  - front: Point of inflection → definition
    back: |
      A point on the graph of a continuous f where the concavity changes, that is, where f′ changes from increasing to decreasing or the reverse.
    topic_code: "5.6"
  - front: Inflection-point justification → the AP sentence
    back: |
      "The graph of f has a point of inflection at x = 4 because f″ changes sign at x = 4." (Or: because f′ changes from decreasing to increasing there.)
    topic_code: "5.6"
  - front: Candidates for points of inflection → where to look
    back: |
      Where f″ = 0 or f″ is undefined (with f defined there). Then check for a sign change of f″.
    topic_code: "5.6"
  - front: x⁴ − 6x² → concavity
    back: |
      f″ = 12x² − 12 = 12(x − 1)(x + 1). Concave up for x < −1 and x > 1, concave down on −1 < x < 1; inflection points at x = ±1.
    topic_code: "5.6"
  - front: x eˣ → point of inflection
    back: |
      f′ = (x + 1)eˣ, f″ = (x + 2)eˣ, which changes sign at x = −2. Inflection point (−2, −2e⁻²).
    topic_code: "5.6"
  - front: f″(x) = (x − 1)²(x + 2) → inflection points
    back: |
      Only x = −2. At x = 1, f″ = 0 but (x − 1)² keeps the sign the same on both sides, so concavity does not change.
    topic_code: "5.6"
  - front: x³ − 6x² + 5x → x-coordinate of the inflection point
    back: |
      f″ = 6x − 12, which changes sign at x = 2.
    topic_code: "5.6"
  - front: Graph of f′ increasing on an interval → what about f
    back: |
      f is concave up there. (Whether f is increasing depends on whether f′ is above the axis, a separate question.)
    topic_code: "5.6"
  - front: Graph of f′ has a relative maximum at x = 3 → what about f
    back: |
      f′ changes from increasing to decreasing, so the graph of f has a point of inflection at x = 3 (concave up to concave down).
    topic_code: "5.6"
  - front: Hypothetical rumor model with N′ > 0 and N″ < 0 → meaning
    back: |
      The number of people who have heard the rumor is increasing, but at a decreasing rate: it is spreading more slowly.
    topic_code: "5.6"
  - front: "Increasing and concave up versus increasing and concave down → the picture"
    back: |
      Concave up: rising faster and faster (slopes growing). Concave down: rising more and more slowly (slopes shrinking toward 0).
    topic_code: "5.6"
  - front: Concavity and the tangent-line approximation → over or under
    back: |
      Concave up near a: the graph is above its tangent line, so L(x) underestimates. Concave down: L(x) overestimates.
    topic_code: "5.6"
  - front: Error-spot → "f″(0) = 0 for x⁴, so (0, 0) is a point of inflection"
    back: |
      f″ = 12x² ≥ 0 on both sides of 0: x⁴ is concave up everywhere. f″ = 0 is a candidate, not a proof.
    topic_code: "5.6"
  - front: Error-spot → "f is concave up because f′ > 0"
    back: |
      f′ > 0 means f is increasing. Concave up means f′ is increasing, that is f″ > 0.
    topic_code: "5.6"
  - front: Point of inflection where f″ does not exist → example
    back: |
      x^(1/3) at x = 0: f″ = −(2/9)x^(−5/3) changes from positive to negative, and f(0) exists, so (0, 0) is an inflection point.
    topic_code: "5.6"
  - front: Second Derivative Test → relative minimum
    back: |
      If f′(c) = 0 and f″(c) > 0, then f has a relative minimum at c.
    topic_code: "5.7"
  - front: Second Derivative Test → relative maximum
    back: |
      If f′(c) = 0 and f″(c) < 0, then f has a relative maximum at c.
    topic_code: "5.7"
  - front: Second Derivative Test → when f″(c) = 0
    back: |
      The test is inconclusive: there could be a maximum, a minimum or neither. Fall back on the First Derivative Test.
    topic_code: "5.7"
  - front: Second Derivative Test justification → the AP sentence
    back: |
      "f has a relative minimum at x = 2 because f′(2) = 0 and f″(2) > 0." Both facts are needed.
    topic_code: "5.7"
  - front: x³ − 12x → Second Derivative Test at both critical points
    back: |
      f′ = 3x² − 12 = 0 at x = ±2; f″ = 6x. f″(2) = 12 > 0: relative minimum. f″(−2) = −12 < 0: relative maximum.
    topic_code: "5.7"
  - front: x⁴, x³ and −x⁴ at x = 0 → what they show about the Second Derivative Test
    back: |
      All have f′(0) = f″(0) = 0, yet x⁴ has a minimum, −x⁴ a maximum and x³ neither. f″(c) = 0 decides nothing.
    topic_code: "5.7"
  - front: x ln x → its relative extremum by the Second Derivative Test
    back: |
      f′ = ln x + 1 = 0 at x = 1/e; f″ = 1/x > 0 there. Relative minimum, value −1/e.
    topic_code: "5.7"
  - front: Second Derivative Test → why "concave up means minimum"
    back: |
      At a horizontal tangent on a cup-shaped (concave up) curve, the point sits at the bottom of the cup.
    topic_code: "5.7"
  - front: Table with f′(2) = 0 and f″(2) = −2 → conclusion at x = 2
    back: |
      Relative maximum, by the Second Derivative Test: f′(2) = 0 and f″(2) < 0.
    topic_code: "5.7"
  - front: First versus Second Derivative Test → when to use which
    back: |
      Second: f′(c) = 0 and f″ is easy to evaluate. First: f″ is messy, f″(c) = 0, or f′(c) does not exist (the Second test needs f′(c) = 0).
    topic_code: "5.7"
  - front: Second Derivative Test at a cusp → does it apply?
    back: |
      No. It needs f′(c) = 0; at a cusp f′(c) does not exist. Use the First Derivative Test.
    topic_code: "5.7"
  - front: Error-spot → "f″(3) > 0, so f has a relative minimum at x = 3"
    back: |
      Missing f′(3) = 0. f″ > 0 alone only says the graph is concave up there; it might be rising through x = 3.
    topic_code: "5.7"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 5.6 and 5.7: concavity from f′ and f″, points
    of inflection and their justification, concavity in context, and the Second Derivative Test), with 8
    questions (about 35%) reviewing weeks 12 to 18 (higher-order derivatives, rates in context,
    linearization, L'Hospital's rule, the Mean Value Theorem and its hypotheses, increasing intervals and the Candidates Test). Opens
    with a shared-context set on a table of f′ and f″. Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes. No calculator is needed.
  questions:
    # ---- Stimulus set: a table of the signs of f′ and f″ (5.6, 5.7, 5.3)
    - slug: apcalcab-u05-w19-q01
      type: multiple_choice
      topic_code: "5.6"
      source: "AP Calculus CED, Topic 5.6"
      points: 1
      stimulus: |
        A function f is twice differentiable on the interval 0 < x < 6. The table gives values or signs of f′ and f″.

        | x | 0 < x < 2 | 2 | 2 < x < 4 | 4 | 4 < x < 6 |
        |---|---|---|---|---|---|
        | f′(x) | positive | 0 | negative | −3 | negative |
        | f″(x) | negative | −2 | negative | 0 | positive |
      prompt: |
        On which interval is the graph of f concave up?
      options:
        - "0 < x < 2"
        - "4 < x < 6"
        - "2 < x < 6"
        - "0 < x < 4"
      option_explanations:
        - |
          f is increasing on 0 < x < 2 (f′ > 0), but f″ < 0 there, so it is concave down. Increasing is not the same as concave up.
        - |
          Correct. f″ > 0 on 4 < x < 6, so f′ is increasing there and the graph of f is concave up.
        - |
          This is where f′ < 0, so f is decreasing there. On 2 < x < 4 f″ is negative, so that part is concave down.
        - |
          f″ is negative on all of 0 < x < 4, which makes the graph concave down there, not up.
      answer: 1
    - slug: apcalcab-u05-w19-q02
      type: multiple_choice
      topic_code: "5.7"
      source: "AP Calculus CED, Topic 5.7"
      points: 1
      stimulus: |
        A function f is twice differentiable on the interval 0 < x < 6. The table gives values or signs of f′ and f″.

        | x | 0 < x < 2 | 2 | 2 < x < 4 | 4 | 4 < x < 6 |
        |---|---|---|---|---|---|
        | f′(x) | positive | 0 | negative | −3 | negative |
        | f″(x) | negative | −2 | negative | 0 | positive |
      prompt: |
        Which statement about f at x = 2 is justified by the Second Derivative Test?
      options:
        - "f has a relative minimum at x = 2 because f′(2) = 0 and f″(2) < 0."
        - "f has a point of inflection at x = 2 because f′(2) = 0."
        - "The test is inconclusive at x = 2 because f″(2) ≠ 0."
        - "f has a relative maximum at x = 2 because f′(2) = 0 and f″(2) < 0."
      option_explanations:
        - |
          The facts are right but the conclusion is reversed: a horizontal tangent on a concave-down graph is a maximum, not a minimum.
        - |
          f′(2) = 0 marks a horizontal tangent, not a change of concavity; f″ is negative on both sides of x = 2.
        - |
          The test is inconclusive only when f″(c) = 0. A nonzero f″(2) is exactly what makes it work.
        - |
          Correct. f′(2) = 0 and f″(2) = −2 < 0, so by the Second Derivative Test f has a relative maximum at x = 2.
      answer: 3
    - slug: apcalcab-u05-w19-q03
      type: multiple_choice
      topic_code: "5.6"
      source: "AP Calculus CED, Topic 5.6"
      points: 1
      stimulus: |
        A function f is twice differentiable on the interval 0 < x < 6. The table gives values or signs of f′ and f″.

        | x | 0 < x < 2 | 2 | 2 < x < 4 | 4 | 4 < x < 6 |
        |---|---|---|---|---|---|
        | f′(x) | positive | 0 | negative | −3 | negative |
        | f″(x) | negative | −2 | negative | 0 | positive |
      prompt: |
        At which x does the graph of f have a point of inflection?
      options:
        - "x = 4 only"
        - "x = 2 only"
        - "x = 2 and x = 4"
        - "None, because f′(4) ≠ 0"
      option_explanations:
        - |
          Correct. f″ changes from negative to positive at x = 4 (and f is continuous there), so the concavity changes and (4, f(4)) is a point of inflection.
        - |
          x = 2 is where f′ = 0 (a relative maximum). f″ is negative on both sides of 2, so the concavity does not change there.
        - |
          Only x = 4 qualifies. At x = 2 the graph is concave down on both sides.
        - |
          An inflection point does not need a horizontal tangent; it needs f″ to change sign, which happens at x = 4.
      answer: 0
    - slug: apcalcab-u05-w19-q04
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Calculus CED, Topic 5.3"
      points: 1
      stimulus: |
        A function f is twice differentiable on the interval 0 < x < 6. The table gives values or signs of f′ and f″.

        | x | 0 < x < 2 | 2 | 2 < x < 4 | 4 | 4 < x < 6 |
        |---|---|---|---|---|---|
        | f′(x) | positive | 0 | negative | −3 | negative |
        | f″(x) | negative | −2 | negative | 0 | positive |
      prompt: |
        On which interval is f decreasing?
      options:
        - "2 < x < 4 only"
        - "4 < x < 6 only"
        - "2 < x < 6"
        - "0 < x < 4"
      option_explanations:
        - |
          f′ is also negative at x = 4 (f′(4) = −3) and on 4 < x < 6, so f keeps decreasing after x = 4.
        - |
          This reads the sign of f″. On 4 < x < 6 the graph is concave up, but f is decreasing on the longer interval 2 < x < 6.
        - |
          Correct. f′ is negative on 2 < x < 4, at x = 4 and on 4 < x < 6, so f′ < 0 on all of 2 < x < 6 and f is decreasing there.
        - |
          This uses f″ < 0. Concave down is not decreasing: f′ > 0 on 0 < x < 2, so f increases there.
      answer: 2
    # ---- Independent items
    - slug: apcalcab-u05-w19-q05
      type: multiple_choice
      topic_code: "5.6"
      source: "AP Calculus CED, Topic 5.6"
      points: 1
      prompt: |
        On which intervals is the graph of f(x) = x⁴ − 6x² concave up?
      options:
        - "−1 < x < 1"
        - "x < −√3 and x > √3"
        - "x < −1 and x > 1"
        - "x > 0"
      option_explanations:
        - |
          f″(0) = −12 < 0, so the graph is concave down on −1 < x < 1. These are the reversed intervals.
        - |
          ±√3 are the critical points from f′ = 4x³ − 12x = 0 (besides 0), which locate extrema, not changes in concavity.
        - |
          Correct. f″(x) = 12x² − 12 = 12(x − 1)(x + 1), which is positive for x < −1 and x > 1.
        - |
          This looks only at the sign of x. On 0 < x < 1, f″(x) = 12x² − 12 is negative (f″(0.5) = −9), so the graph is concave down there.
      answer: 2
    - slug: apcalcab-u05-w19-q06
      type: multiple_choice
      topic_code: "5.6"
      source: "AP Calculus CED, Topic 5.6"
      points: 1
      prompt: |
        At what x-value does the graph of f(x) = x eˣ have a point of inflection?
      options:
        - "x = −2"
        - "x = −1"
        - "x = 0"
        - "There is no point of inflection."
      option_explanations:
        - |
          Correct. f′(x) = (x + 1)eˣ and f″(x) = eˣ + (x + 1)eˣ = (x + 2)eˣ. Since eˣ > 0, f″ changes sign at x = −2.
        - |
          x = −1 is where f′ = 0, the relative minimum of f. Points of inflection come from f″, not f′.
        - |
          x = 0 is the zero of f itself; f″(0) = 2 ≠ 0, and f″ is positive on both sides.
        - |
          f″ = (x + 2)eˣ is negative for x < −2 and positive for x > −2, so the concavity does change.
      answer: 0
    - slug: apcalcab-u05-w19-q07
      type: multiple_choice
      topic_code: "5.7"
      source: "AP Calculus CED, Topic 5.7"
      points: 1
      prompt: |
        Let f(x) = x³ − 12x. Which statement about f at x = 2 is correct?
      options:
        - "f has a relative maximum at x = 2 because f″(2) > 0."
        - "f has a relative minimum at x = 2 because f′(2) = 0 and f″(2) > 0."
        - "The Second Derivative Test is inconclusive at x = 2."
        - "The graph of f has a point of inflection at x = 2."
      option_explanations:
        - |
          A positive second derivative at a horizontal tangent means concave up, so a minimum. The conclusion is reversed and f′(2) = 0 is not cited.
        - |
          Correct. f′(x) = 3x² − 12, so f′(2) = 0; f″(x) = 6x, so f″(2) = 12 > 0. By the Second Derivative Test f has a relative minimum at x = 2.
        - |
          The test is inconclusive only when f″(c) = 0. Here f″(2) = 12.
        - |
          f″ = 6x changes sign at x = 0, not at x = 2. At x = 2 the graph is concave up on both sides.
      answer: 1
    - slug: apcalcab-u05-w19-q08
      type: multiple_choice
      topic_code: "5.7"
      source: "AP Calculus CED, Topic 5.7"
      points: 1
      prompt: |
        Let f(x) = x⁴. Then f′(0) = 0 and f″(0) = 0. Which statement is true?
      options:
        - "The graph of f has a point of inflection at x = 0 because f″(0) = 0."
        - "f has no relative extremum at x = 0 because f″(0) = 0."
        - "f has a relative maximum at x = 0."
        - "The Second Derivative Test is inconclusive, and the First Derivative Test shows a relative minimum at x = 0."
      option_explanations:
        - |
          f″(x) = 12x² is positive on both sides of 0, so the concavity never changes: there is no inflection point.
        - |
          f″(0) = 0 makes the Second Derivative Test silent; it does not rule out an extremum. f does have one at 0.
        - |
          f(x) = x⁴ ≥ 0 = f(0) for every x, and f′ goes from negative to positive at 0: a minimum, not a maximum.
        - |
          Correct. With f″(0) = 0 the Second Derivative Test gives no information. f′(x) = 4x³ changes from negative to positive at x = 0, so f has a relative minimum there.
      answer: 3
    - slug: apcalcab-u05-w19-q09
      type: multiple_choice
      topic_code: "5.6"
      source: "AP Calculus CED, Topic 5.6"
      points: 1
      prompt: |
        A function f is twice differentiable for all real numbers, with f″(x) = (x − 1)²(x + 2). At which x does the graph of f have a point of inflection?
      options:
        - "x = 1 only"
        - "x = 1 and x = −2"
        - "x = −2 only"
        - "x = 2 only"
      option_explanations:
        - |
          At x = 1, f″ = 0 but the factor (x − 1)² is never negative, so f″ has the same sign on both sides: no change in concavity.
        - |
          Only x = −2 is a sign change of f″. The zero at x = 1 comes from a squared factor and does not change the sign.
        - |
          Correct. (x − 1)² ≥ 0, so f″ has the sign of x + 2, which changes from negative to positive at x = −2.
        - |
          This is a sign slip: the factor x + 2 is zero at x = −2, not at x = 2.
      answer: 2
    - slug: apcalcab-u05-w19-q10
      type: multiple_choice
      topic_code: "5.6"
      source: "AP Calculus CED, Topic 5.6"
      points: 1
      prompt: |
        In a hypothetical model, N(t) is the number of students at a school who have heard a rumor t hours after it starts. For 2 < t < 6, N′(t) > 0 and N″(t) < 0. Which describes the rumor during that time?
      options:
        - "Fewer students are hearing it each hour, so N is decreasing."
        - "The number who have heard it is increasing, but at a decreasing rate."
        - "The number who have heard it is increasing at an increasing rate."
        - "The number who have heard it is decreasing at a decreasing rate."
      option_explanations:
        - |
          N′ > 0, so N is increasing. A decreasing rate means fewer new hearers per hour, not fewer total hearers.
        - |
          Correct. N′ > 0 means N is increasing; N″ < 0 means N′ is decreasing, so the rumor is spreading more slowly as time goes on.
        - |
          An increasing rate would need N″ > 0. Here N″ < 0, so the rate of spread is falling.
        - |
          N′ > 0 says the number who have heard it goes up, not down.
      answer: 1
    - slug: apcalcab-u05-w19-q11
      type: multiple_choice
      topic_code: "5.6"
      source: "AP Calculus CED, Topic 5.6"
      points: 1
      prompt: |
        The derivative f′ of a twice-differentiable function f is decreasing on 1 < x < 4. Which statement about f must be true on that interval?
      options:
        - "f is decreasing on 1 < x < 4."
        - "f′(x) < 0 on 1 < x < 4."
        - "f has a relative maximum in 1 < x < 4."
        - "The graph of f is concave down on 1 < x < 4."
      option_explanations:
        - |
          A decreasing f′ can still be positive (for example falling from 5 to 2), in which case f is increasing. The values of f′ are not given.
        - |
          f′ decreasing says how f′ changes, not what sign it has. f′ could stay positive throughout.
        - |
          A relative maximum needs f′ to change from positive to negative inside the interval, which the information does not guarantee.
        - |
          Correct. By definition, f is concave down on an interval where f′ is decreasing (equivalently f″ ≤ 0 there).
      answer: 3
    - slug: apcalcab-u05-w19-q12
      type: multiple_choice
      topic_code: "4.6"
      source: "AP Calculus CED, Topic 4.6"
      points: 1
      prompt: |
        A twice-differentiable function f has f(3) = 2, f′(3) = 0.5 and f″(x) < 0 for all x. The tangent line at x = 3 is used to approximate f(3.2). Which statement is true?
      options:
        - "The approximation is 2.1, and it is an overestimate."
        - "The approximation is 2.1, and it is an underestimate."
        - "The approximation is 2.5, and it is an overestimate."
        - "The approximation is 1.9, and it is an underestimate."
      option_explanations:
        - |
          Correct. L(3.2) = 2 + 0.5(0.2) = 2.1. Since f″ < 0, the graph is concave down and lies below its tangent lines, so 2.1 is too big.
        - |
          The value 2.1 is right, but a concave-down graph lies below its tangent line, so the tangent line gives an overestimate.
        - |
          2.5 adds f′(3) = 0.5 without multiplying by Δx = 0.2. The step is 0.5 × 0.2 = 0.1.
        - |
          1.9 subtracts the change instead of adding it; f′(3) > 0, so the line rises from 2.
      answer: 0
    - slug: apcalcab-u05-w19-q13
      type: multiple_choice
      topic_code: "3.6"
      source: "AP Calculus CED, Topic 3.6"
      points: 1
      prompt: |
        If f(x) = sin(2x), what is f″(x)?
      options:
        - "−4 sin(2x)"
        - "−sin(2x)"
        - "4 sin(2x)"
        - "−2 sin(2x)"
      option_explanations:
        - |
          Correct. f′(x) = 2 cos(2x) by the chain rule, and f″(x) = 2 · (−2 sin(2x)) = −4 sin(2x).
        - |
          This forgets the chain-rule factor 2 at both steps; each differentiation multiplies by 2.
        - |
          The sign is lost: the derivative of cos(2x) is −2 sin(2x), not 2 sin(2x).
        - |
          This applies the chain-rule factor 2 only once. Two differentiations give 2 · 2 = 4.
      answer: 0
    - slug: apcalcab-u05-w19-q14
      type: multi_select
      topic_code: "5.7"
      source: "AP Calculus CED, Topic 5.7"
      points: 2
      partial_credit: true
      prompt: |
        Let f(x) = x³ − 3x² − 9x + 2. Which statements are true? Select all that apply.
      options:
        - "The graph of f has a point of inflection at x = 1."
        - "By the Second Derivative Test, f has a relative maximum at x = −1."
        - "The graph of f is concave up for x < 1."
        - "By the Second Derivative Test, f has a relative minimum at x = 3."
        - "f″(3) < 0"
      option_explanations:
        - |
          Correct. f″(x) = 6x − 6 changes from negative to positive at x = 1.
        - |
          Correct. f′(x) = 3x² − 6x − 9 = 3(x − 3)(x + 1), so f′(−1) = 0, and f″(−1) = −12 < 0.
        - |
          f″(x) = 6x − 6 < 0 for x < 1, so the graph is concave down there.
        - |
          Correct. f′(3) = 27 − 18 − 9 = 0 and f″(3) = 12 > 0, so f has a relative minimum at x = 3.
        - |
          f″(3) = 18 − 6 = 12, which is positive; a sign slip in f″(x) = 6x − 6 would produce this.
      answer: [0, 1, 3]
