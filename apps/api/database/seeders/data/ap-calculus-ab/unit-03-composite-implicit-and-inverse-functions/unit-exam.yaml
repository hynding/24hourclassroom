unit: 3
description: |
  45 questions · about 90 minutes · every topic of Unit 3 (3.1 to 3.6): the chain rule from formulas and tables,
  implicit differentiation with tangent lines and horizontal and vertical tangents, derivatives of inverse functions
  and of inverse trigonometric functions, choosing and combining derivative rules, and second and higher-order
  derivatives. Includes three shared-context sets (a table of two functions, an implicitly defined curve, and a
  function with an inverse), select-all, true/false, fill-in-the-blank and numeric items, two short-answer questions
  (3 points each) and two free-response questions in the AP style (9 points each: one calculator-active context, one
  no-calculator analysis of a curve). Items marked (Calculator.) need a graphing calculator; the rest are meant to be
  done by hand. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
  items are matched automatically; the short answers and free-response items are graded by your teacher against
  the scoring notes.
questions:
  # ---- Stimulus set A: a table of f, f′, g, g′ (3.1, 3.3, 3.5)
  - slug: apcalcab-u03-exam-q01
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Calculus CED, Topic 3.1"
    points: 1
    stimulus: |
      The functions f and g are differentiable for all real numbers, and f is increasing, so it has an inverse. Selected values are shown.

      | x | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | f(x) | 2 | 3 | 5 | 8 |
      | f′(x) | 1 | 3 | 2 | 4 |
      | g(x) | 4 | 3 | 1 | 2 |
      | g′(x) | −2 | 5 | −1 | 3 |
    prompt: |
      Let h(x) = f(g(x)). What is h′(2)?
    options:
      - "10"
      - "15"
      - "2"
      - "5"
    option_explanations:
      - |
        Correct. g(2) = 3, so h′(2) = f′(g(2)) · g′(2) = f′(3) · 5 = 2 · 5 = 10.
      - |
        15 is f′(2) · g′(2): the outer derivative was evaluated at 2 instead of at the inner value g(2) = 3.
      - |
        2 is f′(g(2)) = f′(3) alone; the chain rule also multiplies by the inner derivative g′(2) = 5.
      - |
        5 is the inner derivative g′(2) alone; it must be multiplied by f′(g(2)) = 2.
    answer: 0
  - slug: apcalcab-u03-exam-q02
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Calculus CED, Topic 3.1"
    points: 1
    stimulus: |
      The functions f and g are differentiable for all real numbers, and f is increasing, so it has an inverse. Selected values are shown.

      | x | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | f(x) | 2 | 3 | 5 | 8 |
      | f′(x) | 1 | 3 | 2 | 4 |
      | g(x) | 4 | 3 | 1 | 2 |
      | g′(x) | −2 | 5 | −1 | 3 |
    prompt: |
      Let k(x) = g(f(x)). What is k′(2)?
    options:
      - "15"
      - "−3"
      - "−1"
      - "3"
    option_explanations:
      - |
        15 is g′(2) · f′(2): g′ must be evaluated at the inner value f(2) = 3, not at 2.
      - |
        Correct. f(2) = 3, so k′(2) = g′(f(2)) · f′(2) = g′(3) · 3 = (−1)(3) = −3.
      - |
        −1 is g′(f(2)) = g′(3) alone; the inner derivative f′(2) = 3 was left off.
      - |
        3 is g(3) · f′(2): the value g(3) = 1 was used where the derivative g′(3) = −1 belongs.
    answer: 1
  - slug: apcalcab-u03-exam-q03
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Calculus CED, Topic 3.3"
    points: 1
    stimulus: |
      The functions f and g are differentiable for all real numbers, and f is increasing, so it has an inverse. Selected values are shown.

      | x | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | f(x) | 2 | 3 | 5 | 8 |
      | f′(x) | 1 | 3 | 2 | 4 |
      | g(x) | 4 | 3 | 1 | 2 |
      | g′(x) | −2 | 5 | −1 | 3 |
    prompt: |
      Let F be the inverse function of f. What is F′(3)?
    options:
      - "1/2"
      - "3"
      - "1/3"
      - "1/5"
    option_explanations:
      - |
        1/2 is 1/f′(3): f′ was evaluated at the inverse's input 3 instead of at the matching input 2.
      - |
        3 is f′(2) itself; the inverse's derivative is its reciprocal.
      - |
        Correct. f(2) = 3, so F(3) = 2 and F′(3) = 1/f′(2) = 1/3.
      - |
        1/5 is 1/f(3), the reciprocal of a function value, not of a derivative.
    answer: 2
  - slug: apcalcab-u03-exam-q04
    type: multiple_choice
    topic_code: "3.5"
    source: "AP Calculus CED, Topic 3.5"
    points: 1
    stimulus: |
      The functions f and g are differentiable for all real numbers, and f is increasing, so it has an inverse. Selected values are shown.

      | x | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | f(x) | 2 | 3 | 5 | 8 |
      | f′(x) | 1 | 3 | 2 | 4 |
      | g(x) | 4 | 3 | 1 | 2 |
      | g′(x) | −2 | 5 | −1 | 3 |
    prompt: |
      Let p(x) = f(x)/g(x). What is p′(4)?
    options:
      - "4"
      - "−16"
      - "4/3"
      - "−4"
    option_explanations:
      - |
        The quotient rule's numerator was reversed, f(4)g′(4) − f′(4)g(4), which flips the sign.
      - |
        −16 is the quotient rule's numerator; it still has to be divided by [g(4)]² = 4.
      - |
        4/3 is f′(4)/g′(4); the derivative of a quotient is not the quotient of derivatives.
      - |
        Correct. p′(4) = [f′(4)g(4) − f(4)g′(4)]/[g(4)]² = (4 · 2 − 8 · 3)/4 = −16/4 = −4.
    answer: 3
  # ---- Stimulus set B: an implicit curve (3.2, 3.6)
  - slug: apcalcab-u03-exam-q05
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Calculus CED, Topic 3.2"
    points: 1
    stimulus: |
      Consider the curve given by y² − 3xy + x² = −1. The points (1, 1), (1, 2) and (2, 1) lie on the curve.
    prompt: |
      Which expression gives dy/dx for this curve?
    options:
      - "(2x − 3y)/(2y − 3x)"
      - "(3y − 2x)/(2y − 3x)"
      - "−x/y"
      - "(3y − 2x)/(2y)"
    option_explanations:
      - |
        The terms were moved to the wrong side: 2y(dy/dx) − 3x(dy/dx) = 3y − 2x, so the numerator is 3y − 2x, not its negative.
      - |
        Correct. 2y(dy/dx) − 3[y + x(dy/dx)] + 2x = 0, so (2y − 3x)(dy/dx) = 3y − 2x.
      - |
        This ignores the −3xy term entirely, as if the curve were x² + y² = −1.
      - |
        The product rule on −3xy gives −3y − 3x(dy/dx); the −3x(dy/dx) term was dropped from the denominator.
    answer: 1
  - slug: apcalcab-u03-exam-q06
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Calculus CED, Topic 3.2"
    points: 1
    stimulus: |
      Consider the curve given by y² − 3xy + x² = −1. The points (1, 1), (1, 2) and (2, 1) lie on the curve.
    prompt: |
      What is the slope of the line tangent to the curve at the point (1, 2)?
    options:
      - "1/4"
      - "−4"
      - "4"
      - "1"
    option_explanations:
      - |
        This inverts the slope, dividing 2y − 3x by 3y − 2x.
      - |
        The sign is wrong: at (1, 2) both 3y − 2x = 4 and 2y − 3x = 1 are positive.
      - |
        Correct. dy/dx = (3 · 2 − 2 · 1)/(2 · 2 − 3 · 1) = 4/1 = 4.
      - |
        1 comes from the denominator 2y without the −3x term, (6 − 2)/4.
    answer: 2
  - slug: apcalcab-u03-exam-q07
    type: multiple_choice
    topic_code: "3.6"
    source: "AP Calculus CED, Topic 3.6"
    points: 1
    stimulus: |
      Consider the curve given by y² − 3xy + x² = −1. The points (1, 1), (1, 2) and (2, 1) lie on the curve.
    prompt: |
      What is the value of d²y/dx² at the point (1, 2)?
    options:
      - "4"
      - "10"
      - "16"
      - "−10"
    option_explanations:
      - |
        4 is dy/dx at (1, 2), the first derivative, not the second.
      - |
        This differentiates (3y − 2x)/(2y − 3x) treating y as a constant, which gives 5y/(2y − 3x)² = 10; the dy/dx terms change the result.
      - |
        16 is (dy/dx)² = 4²; the second derivative is the derivative of dy/dx, not its square.
      - |
        Correct. Quotient rule with dy/dx = 4 substituted: [(3 · 4 − 2)(1) − (4)(2 · 4 − 3)]/1² = (10 − 20)/1 = −10.
    answer: 3
  # ---- Stimulus set C: a function and its inverse (3.4, 3.3, 3.6)
  - slug: apcalcab-u03-exam-q08
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Calculus CED, Topic 3.4"
    points: 1
    stimulus: |
      Let f(x) = x³ + x + arctan x. The function f is increasing for all real numbers, so it has an inverse function g. Note that f(1) = 2 + π/4.
    prompt: |
      Which expression is f′(x)?
    options:
      - "3x² + 1 + 1/(1 + x²)"
      - "3x² + 1 + 1/√(1 − x²)"
      - "3x² + 1 − 1/(1 + x²)"
      - "3x² + 1 + sec²x"
    option_explanations:
      - |
        Correct. The derivative of arctan x is 1/(1 + x²), added to the derivative 3x² + 1 of the polynomial.
      - |
        1/√(1 − x²) is the derivative of arcsin x, not arctan x.
      - |
        The derivative of arctan x is positive; the minus sign is a slip.
      - |
        sec²x is the derivative of tan x; arctan is its inverse, whose derivative is 1/(1 + x²).
    answer: 0
  - slug: apcalcab-u03-exam-q09
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Calculus CED, Topic 3.3"
    points: 1
    stimulus: |
      Let f(x) = x³ + x + arctan x. The function f is increasing for all real numbers, so it has an inverse function g. Note that f(1) = 2 + π/4.
    prompt: |
      What is g′(2 + π/4)?
    options:
      - "9/2"
      - "1/4"
      - "2/9"
      - "4/(8 + π)"
    option_explanations:
      - |
        9/2 is f′(1) = 3 + 1 + 1/2 itself; the inverse's slope is its reciprocal.
      - |
        1/4 leaves out the arctangent term: f′(1) is 3 + 1 + 1/2, not 3 + 1.
      - |
        Correct. g(2 + π/4) = 1, and f′(1) = 3 + 1 + 1/2 = 9/2, so g′(2 + π/4) = 1/f′(1) = 2/9.
      - |
        4/(8 + π) is 1/(2 + π/4), the reciprocal of the input value, not of the derivative.
    answer: 2
  - slug: apcalcab-u03-exam-q10
    type: multiple_choice
    topic_code: "3.6"
    source: "AP Calculus CED, Topic 3.6"
    points: 1
    stimulus: |
      Let f(x) = x³ + x + arctan x. The function f is increasing for all real numbers, so it has an inverse function g. Note that f(1) = 2 + π/4.
    prompt: |
      (Calculator.) What is f″(1.2), to three decimal places?
    options:
      - "7.200"
      - "6.797"
      - "7.603"
      - "6.216"
    option_explanations:
      - |
        7.200 is 6x at 1.2, the second derivative of x³ alone; the arctangent term also contributes.
      - |
        Correct. f″(x) = 6x − 2x/(1 + x²)², so f″(1.2) = 7.2 − 2.4/2.44² ≈ 7.2 − 0.403 = 6.797.
      - |
        This adds 0.403 instead of subtracting it: the derivative of (1 + x²)⁻¹ is −2x(1 + x²)⁻².
      - |
        This forgets to square 1 + x² in the denominator, subtracting 2.4/2.44 ≈ 0.984.
    answer: 1
  # ---- Independent items
  - slug: apcalcab-u03-exam-q11
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Calculus CED, Topic 3.1"
    points: 1
    prompt: |
      What is d/dx √(1 − 4x)?
    options:
      - "1/(2√(1 − 4x))"
      - "2/√(1 − 4x)"
      - "−4/√(1 − 4x)"
      - "−2/√(1 − 4x)"
    option_explanations:
      - |
        This differentiates the square root but leaves off the inner derivative −4.
      - |
        The inner derivative is −4, not +4, so the result must be negative.
      - |
        The factor 1/2 from the power rule on u^(1/2) was dropped.
      - |
        Correct. (1/2)(1 − 4x)^(−1/2) · (−4) = −2/√(1 − 4x).
    answer: 3
  - slug: apcalcab-u03-exam-q12
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Calculus CED, Topic 3.1"
    points: 1
    prompt: |
      What is the derivative of y = tan(5x)?
    options:
      - "5 sec²(5x)"
      - "sec²(5x)"
      - "5 sec(5x) tan(5x)"
      - "5 sec²x"
    option_explanations:
      - |
        Correct. sec²(5x) times the inner derivative 5.
      - |
        The chain rule's inner derivative 5 is missing.
      - |
        sec u tan u is the derivative of sec u, not of tan u.
      - |
        The angle must stay 5x inside the secant; only the factor 5 comes outside.
    answer: 0
  - slug: apcalcab-u03-exam-q13
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Calculus CED, Topic 3.1"
    points: 1
    prompt: |
      What is d/dx ln(cos x), for −π/2 < x < π/2?
    options:
      - "1/cos x"
      - "tan x"
      - "−tan x"
      - "−1/sin x"
    option_explanations:
      - |
        This differentiates ln u as 1/u but forgets to multiply by the inner derivative −sin x.
      - |
        The derivative of cos x is −sin x, so the result is negative; the sign was lost.
      - |
        Correct. By the chain rule, (1/cos x) · (−sin x) = −tan x.
      - |
        This takes the reciprocal of the inner derivative; d/dx ln u is u′/u, not 1/u′.
    answer: 2
  - slug: apcalcab-u03-exam-q14
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Calculus CED, Topic 3.1"
    points: 1
    prompt: |
      The function g is differentiable with g′(5) = −2. Let f(x) = g(3x − 1). What is f′(2)?
    options:
      - "−2"
      - "−6"
      - "−2/3"
      - "−10"
    option_explanations:
      - |
        −2 is g′(5) alone; the inner function 3x − 1 contributes a factor 3.
      - |
        Correct. f′(x) = 3g′(3x − 1), and 3(2) − 1 = 5, so f′(2) = 3 · (−2) = −6.
      - |
        −2/3 divides g′(5) by the inner derivative 3; the chain rule multiplies by it.
      - |
        −10 multiplies by the inner value 5 instead of the inner derivative 3.
    answer: 1
  - slug: apcalcab-u03-exam-q15
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Calculus CED, Topic 3.1"
    points: 1
    prompt: |
      Let y = u³ and u = 2x + 1. What is dy/dx when x = 1?
    options:
      - "27"
      - "6"
      - "18"
      - "54"
    option_explanations:
      - |
        27 is dy/du = 3u² at u = 3 alone; it must be multiplied by du/dx = 2.
      - |
        6 is 3 · 2, which leaves out the factor u² = 9 from dy/du.
      - |
        18 uses 3u instead of 3u² for dy/du (3 · 3 · 2).
      - |
        Correct. dy/dx = (dy/du)(du/dx) = 3u² · 2; at x = 1, u = 3, so 3 · 9 · 2 = 54.
    answer: 3
  - slug: apcalcab-u03-exam-q16
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Calculus CED, Topic 3.2"
    points: 1
    prompt: |
      For the curve xy = 12, what is dy/dx at the point (3, 4)?
    options:
      - "−4/3"
      - "−3/4"
      - "4/3"
      - "−4"
    option_explanations:
      - |
        Correct. Product rule: y + x(dy/dx) = 0, so dy/dx = −y/x = −4/3.
      - |
        This inverts the slope, giving −x/y = −3/4 instead of −y/x.
      - |
        The sign is wrong: y + x(dy/dx) = 0 makes dy/dx = −y/x.
      - |
        This solves y + x(dy/dx) = 0 as dy/dx = −y, forgetting to divide by x.
    answer: 0
  - slug: apcalcab-u03-exam-q17
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Calculus CED, Topic 3.2"
    points: 1
    prompt: |
      For the curve x² + y² − 6x = 7, dy/dx = (3 − x)/y. At which points does the curve have a horizontal tangent line?
    options:
      - "(−1, 0) and (7, 0)"
      - "(0, √7) and (0, −√7)"
      - "(3, 4) and (3, −4)"
      - "(3, 0) only"
    option_explanations:
      - |
        At (−1, 0) and (7, 0) the denominator y is 0, so the tangent lines there are vertical.
      - |
        These are the y-intercepts of the curve; at x = 0 the slope is 3/y, not 0.
      - |
        Correct. 3 − x = 0 gives x = 3; then 9 + y² − 18 = 7 gives y = ±4, and y ≠ 0 at both points.
      - |
        (3, 0) is not on the curve (9 − 18 = −9, not 7); x = 3 must be substituted into the curve's equation to find y.
    answer: 2
  - slug: apcalcab-u03-exam-q18
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Calculus CED, Topic 3.3"
    points: 1
    prompt: |
      Let f(x) = e^(2x) + x, and let g be the inverse function of f. What is g′(1)?
    options:
      - "3"
      - "1/3"
      - "1/(2e² + 1)"
      - "−1/3"
    option_explanations:
      - |
        3 is f′(0); the inverse's derivative is the reciprocal.
      - |
        Correct. f(0) = 1 + 0 = 1, and f′(x) = 2e^(2x) + 1 gives f′(0) = 3, so g′(1) = 1/3.
      - |
        This is 1/f′(1): f′ must be evaluated at the matching input 0, not at the inverse's input 1.
      - |
        Reflection in y = x takes the reciprocal of the slope, without changing its sign.
    answer: 1
  - slug: apcalcab-u03-exam-q19
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Calculus CED, Topic 3.3"
    points: 1
    prompt: |
      Let f(x) = x³ + 1, and let g be the inverse function of f. Which statement about g at x = 1 is true?
    options:
      - "g′(1) = 0"
      - "g′(1) = 3"
      - "g′(1) = 1/3"
      - "g is not differentiable at x = 1; its graph has a vertical tangent there."
    option_explanations:
      - |
        f′(0) = 0, so the inverse's slope 1/f′(0) is undefined, not 0: horizontal on f becomes vertical on g.
      - |
        3 is f′(1); the matching input for g at 1 is 0, because f(0) = 1.
      - |
        1/3 is 1/f′(1), which uses the wrong input; the matching input is 0, where f′ is 0.
      - |
        Correct. f(0) = 1 and f′(0) = 0, so f has a horizontal tangent at (0, 1) and its reflection g has a vertical tangent at (1, 0).
    answer: 3
  - slug: apcalcab-u03-exam-q20
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Calculus CED, Topic 3.4"
    points: 1
    prompt: |
      What is d/dx arccos(2x)?
    options:
      - "−2/√(1 − 4x²)"
      - "−1/√(1 − 4x²)"
      - "2/√(1 − 4x²)"
      - "−2/(1 + 4x²)"
    option_explanations:
      - |
        Correct. −u′/√(1 − u²) with u = 2x gives −2/√(1 − 4x²).
      - |
        The chain rule's inner derivative 2 is missing.
      - |
        The arccosine derivative is negative; this is the derivative of arcsin(2x).
      - |
        This uses the arctangent form 1/(1 + u²) in place of 1/√(1 − u²).
    answer: 0
  - slug: apcalcab-u03-exam-q21
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Calculus CED, Topic 3.4"
    points: 1
    prompt: |
      Let f(x) = x arctan x. What is f′(1)?
    options:
      - "1/2"
      - "π/4"
      - "π/4 + 1/2"
      - "π/4 + 2"
    option_explanations:
      - |
        1/2 is the product of the derivatives, 1 · 1/(1 + 1); the product rule adds two terms.
      - |
        π/4 is only the first product-rule term, arctan 1; the term x · 1/(1 + x²) = 1/2 is missing.
      - |
        Correct. f′(x) = arctan x + x/(1 + x²), so f′(1) = π/4 + 1/2.
      - |
        This uses 1 + x² instead of its reciprocal for the derivative of arctan x.
    answer: 2
  - slug: apcalcab-u03-exam-q22
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Calculus CED, Topic 3.4"
    points: 1
    prompt: |
      What is d/dx arctan(1/x), for x ≠ 0?
    options:
      - "1/(1 + x²)"
      - "−1/(1 + x²)"
      - "−1/(x² + x)"
      - "x²/(1 + x²)"
    option_explanations:
      - |
        The inner derivative of 1/x is −1/x², which makes the result negative.
      - |
        Correct. [1/(1 + 1/x²)] · (−1/x²) = −1/(x² + 1).
      - |
        This uses 1 + 1/x instead of 1 + (1/x)²: the inner function must be squared.
      - |
        This is 1/(1 + 1/x²) without the inner derivative −1/x².
    answer: 1
  - slug: apcalcab-u03-exam-q23
    type: multiple_choice
    topic_code: "3.5"
    source: "AP Calculus CED, Topic 3.5"
    points: 1
    prompt: |
      What is the derivative of y = x²e^(−x)?
    options:
      - "−2xe^(−x)"
      - "2xe^(−x)"
      - "xe^(−x)(2 + x)"
      - "xe^(−x)(2 − x)"
    option_explanations:
      - |
        This multiplies the derivatives 2x and −e^(−x); the product rule adds two terms.
      - |
        This differentiates x² and keeps e^(−x) unchanged, leaving out the term x² · (−e^(−x)).
      - |
        The derivative of e^(−x) is −e^(−x); dropping the chain-rule sign gives +x².
      - |
        Correct. 2xe^(−x) + x² · (−e^(−x)) = xe^(−x)(2 − x).
    answer: 3
  - slug: apcalcab-u03-exam-q24
    type: multiple_choice
    topic_code: "3.5"
    source: "AP Calculus CED, Topic 3.5"
