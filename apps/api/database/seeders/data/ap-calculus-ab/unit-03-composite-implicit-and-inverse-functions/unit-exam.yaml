      (c) Show that the curve has no horizontal tangent lines.
    answer: |
      (a) e^y(dy/dx) + y + x(dy/dx) = 0, so dy/dx = −y/(e^y + x).
      (b) e¹ + 0 · 1 = e, so (0, 1) is on the curve. Slope: −1/(e + 0) = −1/e. Tangent line: y = 1 − (1/e)x.
      (c) A horizontal tangent needs the numerator −y = 0, so y = 0. Substituting y = 0 into the curve gives e⁰ + 0 = 1, and 1 ≠ e, so no point of the curve has y = 0; the curve has no horizontal tangents.
