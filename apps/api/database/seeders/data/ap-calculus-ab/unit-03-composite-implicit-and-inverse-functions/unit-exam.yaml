  # ---- Free response 1 (calculator): a diver's temperature (3.1, 3.3)
  - slug: apcalcab-u03-exam-q44
    type: long_answer
    topic_code: "3.1"
    source: "AP Calculus CED, Topic 3.1"
    points: 9
    prompt: |
      (Calculator.) In a hypothetical lake, the water temperature at depth x meters is W(x) = 4 + 18e^(−0.15x) degrees Celsius. A diver's depth, in meters, t minutes after starting a survey is d(t) = 10 + 6 sin(0.5t), for 0 ≤ t ≤ 12. Let D(t) = W(d(t)) be the water temperature at the diver's location at time t.

      (A) Find an expression for D′(t). Show the chain-rule structure.

      (B) Find D′(2). Using correct units, interpret the meaning of D′(2) in the context of the problem.

      (C) Find all times t in 0 ≤ t ≤ 12 at which D′(t) = 0. Justify your answer using your expression from part (A).

      (D) On the interval 0 ≤ t ≤ π the depth d is increasing, so it has an inverse function T, where T(x) is the time at which the diver is at depth x. Find the time at which the diver is at depth 13 meters, and find T′(13). Interpret T′(13) with units.
    answer: |
      (A) W′(x) = 18(−0.15)e^(−0.15x) = −2.7e^(−0.15x), and d′(t) = 3cos(0.5t). By the chain rule, D′(t) = W′(d(t)) · d′(t) = −2.7e^(−0.15(10 + 6 sin(0.5t))) · 3cos(0.5t) = −8.1cos(0.5t)e^(−0.15(10 + 6 sin(0.5t))).
      (B) D′(2) ≈ −0.458. At time t = 2 minutes, the water temperature at the diver's location is decreasing at about 0.458 degrees Celsius per minute (the diver is descending into colder water).
      (C) D′(t) = W′(d(t)) · d′(t). W′(x) = −2.7e^(−0.15x) is never 0, so D′(t) = 0 exactly when d′(t) = 3cos(0.5t) = 0, that is when 0.5t = π/2 or 3π/2. So t = π ≈ 3.142 and t = 3π ≈ 9.425 minutes (the diver is momentarily at constant depth).
      (D) 10 + 6 sin(0.5t) = 13 gives sin(0.5t) = 1/2, so 0.5t = π/6 and t = π/3 ≈ 1.047 minutes; T(13) = π/3. d′(π/3) = 3cos(π/6) = 3√3/2 ≈ 2.598 meters per minute, so T′(13) = 1/d′(π/3) = 2/(3√3) ≈ 0.385 minutes per meter. When the diver is at a depth of 13 meters, each additional meter of depth takes about 0.385 minutes (about 23 seconds) to descend.
    explanation: |
      Nine points. (A) 2 points: 1 for the chain-rule structure W′(d(t)) · d′(t), 1 for a correct expression (any equivalent form). (B) 2 points: 1 for D′(2) ≈ −0.458 (accept −0.457 or −0.458), 1 for an interpretation with "decreasing" (or "changing at −0.458"), units of degrees Celsius per minute and the time t = 2. (C) 2 points: 1 for the reasoning that W′ is never zero so d′(t) must be 0, 1 for both times t = π and t = 3π (decimals accepted). (D) 3 points: 1 for T(13) = π/3 (≈ 1.047), 1 for T′(13) = 1/d′(π/3) ≈ 0.385 (accept 2/(3√3) or 0.384 to 0.385), 1 for the interpretation in minutes per meter.
  # ---- Free response 2 (no calculator): analysis of a curve (3.2, 3.6)
  - slug: apcalcab-u03-exam-q45
    type: long_answer
    topic_code: "3.2"
    source: "AP Calculus CED, Topic 3.2"
    points: 9
    prompt: |
      Consider the curve given by x² + xy + y² = 7.

      (A) Show that dy/dx = −(2x + y)/(x + 2y).

      (B) The point (−1, 3) is on the curve. Write an equation for the line tangent to the curve at this point.

      (C) Find the coordinates of every point on the curve at which the tangent line is horizontal.

      (D) The point (1, 2) is on the curve. Find the value of d²y/dx² at (1, 2). Is the curve concave up or concave down at this point? Explain.
    answer: |
      (A) Differentiate: 2x + [y + x(dy/dx)] + 2y(dy/dx) = 0. So (x + 2y)(dy/dx) = −(2x + y), and dy/dx = −(2x + y)/(x + 2y).
      (B) At (−1, 3): dy/dx = −(−2 + 3)/(−1 + 6) = −1/5. Tangent line: y = 3 − (1/5)(x + 1).
      (C) Horizontal: 2x + y = 0 with x + 2y ≠ 0. Substitute y = −2x: x² − 2x² + 4x² = 3x² = 7, so x = ±√(7/3) = ±√21/3. Points (√21/3, −2√21/3) and (−√21/3, 2√21/3). At these points x + 2y = −3x ≠ 0, so the tangent lines are horizontal.
      (D) At (1, 2), dy/dx = −4/5. Differentiate dy/dx = −(2x + y)/(x + 2y) with the quotient rule:
      d²y/dx² = −[(2 + y′)(x + 2y) − (2x + y)(1 + 2y′)]/(x + 2y)².
      At (1, 2) with y′ = −4/5: (2 − 4/5)(5) − (4)(1 − 8/5) = 6 + 12/5 = 42/5, and (x + 2y)² = 25, so d²y/dx² = −(42/5)/25 = −42/125. Since d²y/dx² < 0, the curve is concave down at (1, 2).
    explanation: |
      Nine points. (A) 2 points: 1 for a correct implicit derivative including the product-rule term y + x(dy/dx), 1 for solving to the given expression. (B) 1 point: slope −1/5 in a correct line through (−1, 3). (C) 3 points: 1 for setting 2x + y = 0, 1 for substituting into the curve to get 3x² = 7, 1 for both points (√21/3, −2√21/3) and (−√21/3, 2√21/3) (equivalent forms such as x = ±√(7/3) accepted). (D) 3 points: 1 for a correct quotient-rule expression for d²y/dx² that treats y as a function of x, 1 for −42/125 (−0.336 accepted), 1 for concave down justified by d²y/dx² < 0.
