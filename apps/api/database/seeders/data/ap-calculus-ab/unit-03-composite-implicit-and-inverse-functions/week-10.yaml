      prompt: |
        The function f is differentiable for all real numbers, and selected values of f and f′ are given in the table. Let g(x) = x² − 2x + 2, and let h(x) = f(g(x)).

        | x | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|
        | f(x) | 3 | 2 | 0 | −1 |
        | f′(x) | −2 | −1 | −3 | 1 |

        (A) Find h′(2). Show the work that leads to your answer.

        (B) Write an equation for the line tangent to the graph of h at x = 2.

        (C) Let k(x) = [f(x)]². Find k′(1).

        (D) Let m(x) = e^(f(x)). Find m′(3).

        (E) Is there a value of x in the interval 0 < x < 2 at which h′(x) = 0? Justify your answer.
      answer: |
        (A) g(2) = 4 − 4 + 2 = 2 and g′(x) = 2x − 2, so g′(2) = 2. h′(2) = f′(g(2)) · g′(2) = f′(2) · 2 = (−3)(2) = −6.
        (B) h(2) = f(g(2)) = f(2) = 0. Tangent line: y = 0 + (−6)(x − 2), that is y = −6(x − 2).
