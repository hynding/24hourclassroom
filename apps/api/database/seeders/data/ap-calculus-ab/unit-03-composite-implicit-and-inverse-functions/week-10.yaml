        (D) m′(x) = e^(f(x)) · f′(x), so m′(3) = e^(−1) · 1 = 1/e.
        (E) Yes, x = 1. g(1) = 1 and g′(1) = 0, so h′(1) = f′(g(1)) · g′(1) = f′(1) · 0 = (−1)(0) = 0.
      explanation: |
        Six points. (A) 1 point: −6 with the chain-rule expression f′(g(2)) · g′(2) shown. (B) 1 point: the point (2, 0) and slope from (A) in a correct line (follow-through on the slope from (A)). (C) 1 point: −4 from 2f(1)f′(1). (D) 2 points: 1 for m′(x) = e^(f(x)) f′(x), 1 for the value 1/e (e^(−1) accepted). (E) 1 point: x = 1 with the justification that g′(1) = 0 makes the product f′(g(1))g′(1) zero; "yes" without that reason earns no point.
