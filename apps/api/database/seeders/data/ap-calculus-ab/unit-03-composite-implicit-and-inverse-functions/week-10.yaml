    - slug: apcalcab-u03-w10-q20
      type: short_answer
      topic_code: "3.1"
      source: "AP Calculus CED, Topic 3.1"
      points: 3
      prompt: |
        Let y = x²(4x − 1)³.

        (a) Name the two derivative rules needed, and say which part of the expression each one handles.
        (b) Find dy/dx and write it in factored form.
        (c) Find the slope of the graph at x = 1.
      answer: |
        (a) The product rule for x² times (4x − 1)³, and the chain rule (general power rule) to differentiate (4x − 1)³.
        (b) dy/dx = 2x(4x − 1)³ + x² · 3(4x − 1)² · 4 = 2x(4x − 1)³ + 12x²(4x − 1)² = 2x(4x − 1)²[(4x − 1) + 6x] = 2x(4x − 1)²(10x − 1).
        (c) At x = 1: 2 · 1 · 3² · 9 = 162.
      explanation: |
        Three points, one per part. (a) product rule and chain rule, each matched to its part of the expression. (b) a correct derivative including the inner factor 4; the factored form 2x(4x − 1)²(10x − 1) or an equivalent factored expression. (c) 162 (follow-through from an incorrect derivative earns this point only if evaluated correctly).
    - slug: apcalcab-u03-w10-q21
      type: short_answer
      topic_code: "3.1"
      source: "AP Calculus CED, Topic 3.1"
      points: 3
      prompt: |
        Let f(x) = e^(2x) and g(x) = x² − 3.

        (a) Find the derivative of f(g(x)).
        (b) Find the derivative of g(f(x)).
        (c) Evaluate both derivatives at x = 0 and explain what the comparison shows.
      answer: |
        (a) f(g(x)) = e^(2(x² − 3)) = e^(2x² − 6); its derivative is e^(2x² − 6) · 4x = 4x e^(2x² − 6).
        (b) g(f(x)) = (e^(2x))² − 3 = e^(4x) − 3; its derivative is 4e^(4x). (Equivalently 2e^(2x) · 2e^(2x).)
        (c) At x = 0 the first is 0 and the second is 4. The two composites are different functions with different derivatives: the order of composition matters, and the chain rule must follow it.
      explanation: |
        Three points, one per part. (a) 4x e^(2x² − 6) or equivalent. (b) 4e^(4x) or an equivalent such as 2e^(2x) · 2e^(2x). (c) both values 0 and 4 with the statement that order of composition matters.
