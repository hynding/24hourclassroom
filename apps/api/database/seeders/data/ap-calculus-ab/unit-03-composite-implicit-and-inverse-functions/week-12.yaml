    - slug: apcalcab-u03-w12-q21
      type: short_answer
      topic_code: "3.5"
      source: "AP Calculus CED, Topic 3.5"
      points: 3
      prompt: |
        Let y = (2x + 1)³/x², for x ≠ 0.

        (a) Name the derivative rules you would use, and say which part of the expression each one handles.
        (b) Find dy/dx and write it in the factored form 2(x − 1)(2x + 1)²/x³. Show your work.
        (c) What does your result say about the tangent line to the graph at x = 1?
      answer: |
        (a) The quotient rule for the whole fraction, and the chain rule for (2x + 1)³. (Alternatively: rewrite as (2x + 1)³x⁻² and use the product rule, the chain rule and the power rule.)
        (b) dy/dx = [3(2x + 1)² · 2 · x² − (2x + 1)³ · 2x]/x⁴ = 2x(2x + 1)²[3x − (2x + 1)]/x⁴ = 2(2x + 1)²(x − 1)/x³.
        (c) At x = 1 the factor x − 1 is 0, so dy/dx = 0: the tangent line is horizontal there (y = 27).
      explanation: |
        Three points, one per part. (a) quotient rule (or rewritten product rule) together with the chain rule, matched to their parts. (b) a correct derivative including the chain-rule factor 2, simplified to the given form with the factoring shown. (c) slope 0 at x = 1, so a horizontal tangent line.
    - slug: apcalcab-u03-w12-q22
      type: short_answer
      topic_code: "3.6"
      source: "AP Calculus CED, Topic 3.6"
      points: 3
      prompt: |
        Let f(x) = x ln x, for x > 0.

        (a) Find f′(x) and f″(x).
        (b) Find f‴(x) and f⁽⁴⁾(x).
        (c) Describe the pattern, and use it to write f⁽⁵⁾(x).
      answer: |
        (a) f′(x) = ln x + x · (1/x) = ln x + 1, and f″(x) = 1/x.
        (b) f‴(x) = −1/x² and f⁽⁴⁾(x) = 2/x³.
        (c) From the second derivative on, each derivative of a power of x lowers the power by one and multiplies by the old exponent: the signs alternate and the coefficients are 1, 1, 2, 6, …, factorials. f⁽⁵⁾(x) = −6/x⁴.
      explanation: |
        Three points, one per part. (a) both f′ (product rule) and f″. (b) both −1/x² and 2/x³. (c) −6/x⁴ with a correct description of the pattern (alternating signs, factorial coefficients, or (−1)ⁿ(n − 2)!/xⁿ⁻¹ for n ≥ 2).
    - slug: apcalcab-u03-w12-q23
      type: long_answer
      topic_code: "3.5"
      source: "AP Calculus CED, Topic 3.5"
      points: 7
      prompt: |
        Let f(x) = x³ + x + 2, and let g be the inverse function of f.

        (A) Find f′(x) and f″(x).

        (B) Find g(4) and g′(4).

        (C) Given that g′(x) = 1/f′(g(x)), find g″(4).

        (D) Let h(x) = f(x) · e^(2x). Find h′(0).

        (E) Let k(x) = arctan(f(x)). Find k′(−1).
      answer: |
        (A) f′(x) = 3x² + 1 and f″(x) = 6x.
        (B) f(1) = 1 + 1 + 2 = 4, so g(4) = 1. g′(4) = 1/f′(1) = 1/(3 + 1) = 1/4.
        (C) Differentiate g′(x) = [f′(g(x))]⁻¹ with the chain rule: g″(x) = −[f′(g(x))]⁻² · f″(g(x)) · g′(x). At x = 4: g″(4) = −f″(1) · g′(4)/[f′(1)]² = −6 · (1/4)/16 = −3/32.
        (D) h′(x) = f′(x)e^(2x) + 2f(x)e^(2x). With f(0) = 2 and f′(0) = 1: h′(0) = 1 · 1 + 2 · 2 · 1 = 5.
        (E) k′(x) = f′(x)/(1 + [f(x)]²). f(−1) = −1 − 1 + 2 = 0 and f′(−1) = 4, so k′(−1) = 4/(1 + 0) = 4.
      explanation: |
        Seven points. (A) 1 point: both derivatives. (B) 2 points: 1 for g(4) = 1, 1 for g′(4) = 1/4 with f′ evaluated at 1. (C) 2 points: 1 for a correct chain-rule expression for g″, 1 for −3/32 (follow-through from (B) accepted). (D) 1 point: 5, from the product rule with the chain-rule factor 2 on e^(2x). (E) 1 point: 4, from the arctangent rule with the chain rule.
