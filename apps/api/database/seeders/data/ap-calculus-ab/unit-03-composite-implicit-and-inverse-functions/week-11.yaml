week: 11
unit: 3
title: "Implicit Differentiation and Inverse Functions"
topics: ["3.2", "3.3", "3.4"]
guide: guides/week-11.md
guide_description: |
  Implicitly defined curves and why d/dx [y²] = 2y · dy/dx; the four-step method for implicit differentiation,
  slopes and tangent lines on a curve, and where tangent lines are horizontal or vertical; the derivative of an
  inverse function, (f⁻¹)′(b) = 1/f′(a) where f(a) = b, from formulas and tables; and the derivatives of arcsin,
  arccos and arctan, with the chain rule. Worked examples: dy/dx and a tangent line on y² = x³ − 2x + 5, the
  horizontal and vertical tangents of x² − 2xy + 3y² = 18, the inverse of x³ + 2x + 1 at 4, an inverse from a
  table, deriving d/dx arcsin x implicitly, and the derivatives of arctan(x²) and arcsin(3x).
flashcards_description: |
  32 cards on implicit differentiation (the y-terms, product rule terms, solving for dy/dx, horizontal and vertical
  tangents), the inverse function derivative rule from formulas and tables, and the derivatives of the inverse
  trigonometric functions with the chain rule.

flashcards:
  - front: Implicitly defined curve, such as y² = x³ − 2x + 5 → what "implicit" means
    back: |
      y is not isolated as a formula in x. The equation relates x and y, and near most points it still defines y as a differentiable function of x.
    topic_code: "3.2"
  - front: d/dx [y²] when y is a function of x → result
    back: |
      2y · dy/dx. y² is a composite (the square of the function y), so the chain rule adds the factor dy/dx.
    topic_code: "3.2"
  - front: d/dx [y³] and d/dx [sin y] → results
    back: |
      3y² · dy/dx and cos y · dy/dx. Every y-term picks up a dy/dx.
    topic_code: "3.2"
  - front: d/dx [xy] in implicit differentiation → result
    back: |
      Product rule: 1 · y + x · dy/dx = y + x(dy/dx).
    topic_code: "3.2"
  - front: d/dx [e^y] → result
    back: |
      e^y · dy/dx.
    topic_code: "3.2"
  - front: Implicit differentiation → the four steps
    back: |
      (1) Differentiate both sides with respect to x. (2) Attach dy/dx to every y-term's derivative. (3) Collect the dy/dx terms on one side. (4) Factor out dy/dx and divide.
    topic_code: "3.2"
  - front: y² = x³ − 2x + 5 → dy/dx
    back: |
      2y(dy/dx) = 3x² − 2, so dy/dx = (3x² − 2)/(2y).
    topic_code: "3.2"
  - front: y² = x³ − 2x + 5 at the point (2, 3) → slope
    back: |
      (3 · 4 − 2)/(2 · 3) = 10/6 = 5/3. At (2, −3) the slope is −5/3.
    topic_code: "3.2"
  - front: Implicit dy/dx in terms of x and y → why you need both coordinates
    back: |
      The same x can give several points on the curve with different slopes, so the slope is a function of the point (x, y), not of x alone.
    topic_code: "3.2"
  - front: dy/dx = N/D from implicit differentiation → where tangents are horizontal
    back: |
      Where N = 0 and D ≠ 0, at points that are on the curve. Solve N = 0 together with the curve's equation.
    topic_code: "3.2"
  - front: dy/dx = N/D from implicit differentiation → where tangents are vertical
    back: |
      Where D = 0 and N ≠ 0, at points that are on the curve.
    topic_code: "3.2"
  - front: x² − 2xy + 3y² = 18 → dy/dx
    back: |
      2x − 2y − 2x(dy/dx) + 6y(dy/dx) = 0, so dy/dx = (y − x)/(3y − x).
    topic_code: "3.2"
  - front: x² − 2xy + 3y² = 18 → points with horizontal tangents
    back: |
      y − x = 0 with the curve: 2x² = 18, so (3, 3) and (−3, −3).
    topic_code: "3.2"
  - front: x³ + y³ = 9 at (1, 2) → slope
    back: |
      3x² + 3y²(dy/dx) = 0, so dy/dx = −x²/y² = −1/4.
    topic_code: "3.2"
  - front: sin y = x → dy/dx in terms of y
    back: |
      cos y · dy/dx = 1, so dy/dx = 1/cos y = sec y.
    topic_code: "3.2"
  - front: Inverse function derivative → the rule
    back: |
      If f(a) = b and f′(a) ≠ 0, then (f⁻¹)′(b) = 1/f′(a). The slope of the inverse at b is the reciprocal of f's slope at the matching input a.
    topic_code: "3.3"
  - front: Inverse function derivative → why the slopes are reciprocals
    back: |
      The graph of f⁻¹ is the reflection of f's graph in y = x, which swaps rise and run. Algebraically, differentiate f(g(x)) = x: f′(g(x)) · g′(x) = 1.
    topic_code: "3.3"
  - front: (f⁻¹)′(b) → the first step
    back: |
      Find a with f(a) = b (the matching input). Then evaluate f′ at a, not at b.
    topic_code: "3.3"
  - front: f(x) = x³ + 2x + 1, g = f⁻¹ → g′(4)
    back: |
      f(1) = 4 and f′(1) = 3 + 2 = 5, so g′(4) = 1/5.
    topic_code: "3.3"
  - front: Table with f(2) = 5 and f′(2) = 4 → (f⁻¹)′(5)
    back: |
      1/f′(2) = 1/4. The input 5 of the inverse matches the input 2 of f.
    topic_code: "3.3"
  - front: f′(a) = 0 and the inverse at b = f(a) → what happens
    back: |
      f⁻¹ is not differentiable at b: f has a horizontal tangent at a, so f⁻¹ has a vertical tangent at b.
    topic_code: "3.3"
  - front: Inverse slope from a graph → how to read it
    back: |
      If f's graph has slope m at (a, b), the inverse's graph has slope 1/m at the reflected point (b, a).
    topic_code: "3.3"
  - front: d/dx arcsin x → derivative and domain
    back: |
      1/√(1 − x²), for −1 < x < 1.
    topic_code: "3.4"
  - front: d/dx arccos x → derivative
    back: |
      −1/√(1 − x²), for −1 < x < 1. The negative of arcsin's derivative, because arcsin x + arccos x = π/2.
    topic_code: "3.4"
  - front: d/dx arctan x → derivative
    back: |
      1/(1 + x²), defined for every real x.
    topic_code: "3.4"
  - front: d/dx arcsin x derived from y = arcsin x → the steps
    back: |
      sin y = x, so cos y · y′ = 1 and y′ = 1/cos y. With −π/2 ≤ y ≤ π/2, cos y ≥ 0, so cos y = √(1 − sin²y) = √(1 − x²).
    topic_code: "3.4"
  - front: d/dx arcsin(3x) → derivative
    back: |
      3/√(1 − 9x²). Square the whole inner function, 3x, inside the root.
    topic_code: "3.4"
  - front: d/dx arctan(x²) → derivative
    back: |
      2x/(1 + x⁴). The inner x² is squared to x⁴ in the denominator.
    topic_code: "3.4"
  - front: d/dx arccos x at x = 1/2 → value
    back: |
      −1/√(1 − 1/4) = −1/√(3/4) = −2/√3 (about −1.155).
    topic_code: "3.4"
  - front: Error-spot → "d/dx [x² + y²] = 2x + 2y"
    back: |
      The y-term needs its chain-rule factor: 2x + 2y(dy/dx).
    topic_code: "3.2"
  - front: Error-spot → "f(1) = 4, so (f⁻¹)′(4) = 1/f′(4)"
    back: |
      Evaluate f′ at the matching input 1, not at 4: (f⁻¹)′(4) = 1/f′(1).
    topic_code: "3.3"
  - front: Error-spot → "d/dx arctan(2x) = 2/(1 + 2x²)"
    back: |
      The whole inner function is squared: 2/(1 + (2x)²) = 2/(1 + 4x²).
    topic_code: "3.4"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 3.2 to 3.4: implicit differentiation, slopes and
    horizontal and vertical tangents on curves, derivatives of inverse functions from formulas and tables, and
    derivatives of inverse trigonometric functions), with 7 questions (about 30%) reviewing week 10 and Units 1 and 2
    (the chain rule, continuity, estimating derivatives from tables, and the quotient and trigonometric rules).
    Opens with a shared-context set on one implicitly defined curve. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long answer are graded by your teacher against the scoring notes. No calculator is needed.
  questions:
    # ---- Stimulus set: one implicit curve (3.2)
    - slug: apcalcab-u03-w11-q01
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Calculus CED, Topic 3.2"
      points: 1
      stimulus: |
        Consider the curve defined by y² = x³ − 2x + 5. The points (1, 2), (2, 3) and (2, −3) lie on the curve.
      prompt: |
        Which expression gives dy/dx for this curve?
      options:
        - "2y/(3x² − 2)"
        - "(3x² − 2)/(2y)"
        - "2y(3x² − 2)"
        - "3x² − 2"
      option_explanations:
        - |
          This is the reciprocal of the slope: after 2y(dy/dx) = 3x² − 2, divide by 2y rather than putting 2y on top.
        - |
          Correct. Differentiate both sides: 2y(dy/dx) = 3x² − 2, so dy/dx = (3x² − 2)/(2y).
        - |
          This multiplies by 2y instead of dividing; solving 2y(dy/dx) = 3x² − 2 for dy/dx requires division.
        - |
          This ignores the factor 2y that the chain rule attaches to d/dx [y²] and reports the right side's derivative as the slope.
      answer: 1
    - slug: apcalcab-u03-w11-q02
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Calculus CED, Topic 3.2"
      points: 1
      stimulus: |
        Consider the curve defined by y² = x³ − 2x + 5. The points (1, 2), (2, 3) and (2, −3) lie on the curve.
      prompt: |
        What is the slope of the line tangent to the curve at the point (2, −3)?
      options:
        - "5/3"
        - "−3/5"
        - "10"
        - "−5/3"
      option_explanations:
        - |
          5/3 is the slope at (2, 3); at (2, −3) the denominator 2y is −6, which makes the slope negative.
        - |
          −3/5 inverts the slope, dividing 2y by 3x² − 2 instead of the other way round.
        - |
          10 is only the numerator 3x² − 2 at x = 2; it still has to be divided by 2y = −6.
        - |
          Correct. dy/dx = (3x² − 2)/(2y) = (12 − 2)/(2 · (−3)) = 10/(−6) = −5/3.
      answer: 3
    - slug: apcalcab-u03-w11-q03
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Calculus CED, Topic 3.2"
      points: 1
      stimulus: |
        Consider the curve defined by y² = x³ − 2x + 5. The points (1, 2), (2, 3) and (2, −3) lie on the curve.
      prompt: |
        At which values of x does the curve have a horizontal tangent line?
      options:
        - "x = −√(2/3) and x = √(2/3)"
        - "Only at the x-values where y = 0"
        - "x = −√2 and x = √2"
        - "x = 2/3 only"
      option_explanations:
        - |
          Correct. A horizontal tangent needs the numerator 3x² − 2 = 0 with y ≠ 0, so x² = 2/3; at both values x³ − 2x + 5 > 0, so the curve has points there with y ≠ 0.
        - |
          Where y = 0 the denominator 2y is zero and the numerator is not, so the tangent is vertical, not horizontal.
        - |
          From 3x² − 2 = 0 the step x² = 2/3 was skipped; dividing by 3 is needed before taking the square root.
        - |
          This drops the square, solving 3x = 2; the equation 3x² = 2 has two solutions.
      answer: 0
    - slug: apcalcab-u03-w11-q04
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Calculus CED, Topic 3.2"
      points: 1
      stimulus: |
        Consider the curve defined by y² = x³ − 2x + 5. The points (1, 2), (2, 3) and (2, −3) lie on the curve.
      prompt: |
        Which is an equation of the line tangent to the curve at the point (1, 2)?
      options:
        - "y = 2 + 4(x − 1)"
        - "y = 1 + (1/4)(x − 2)"
        - "y = 2 + (1/4)(x − 1)"
        - "y = 2 + (1/2)(x − 1)"
      option_explanations:
        - |
          4 is the reciprocal of the slope: the slope is (3x² − 2)/(2y) = 1/4, not 2y/(3x² − 2).
        - |
          The coordinates are swapped: the line must pass through (1, 2), so it is y − 2 = m(x − 1).
        - |
          Correct. At (1, 2), dy/dx = (3 − 2)/(2 · 2) = 1/4, so the tangent line is y = 2 + (1/4)(x − 1).
        - |
          1/2 forgets the factor 2 in 2y and divides by y = 2 alone.
      answer: 2
    # ---- Independent items
    - slug: apcalcab-u03-w11-q05
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Calculus CED, Topic 3.3"
      points: 1
      prompt: |
        Let f(x) = x³ + 2x + 1, and let g be the inverse function of f. What is g′(4)?
      options:
        - "1/50"
        - "1/5"
        - "5"
        - "1/73"
      option_explanations:
        - |
          1/50 is 1/f′(4); the derivative of f must be evaluated at the input a with f(a) = 4, which is a = 1.
        - |
          Correct. f(1) = 1 + 2 + 1 = 4 and f′(x) = 3x² + 2, so f′(1) = 5 and g′(4) = 1/f′(1) = 1/5.
        - |
          5 is f′(1); the inverse's slope is its reciprocal.
        - |
          1/73 is 1/f(4): the reciprocal of a value of f is not the derivative of the inverse.
      answer: 1
    - slug: apcalcab-u03-w11-q06
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Calculus CED, Topic 3.3"
      points: 1
      prompt: |
        The function f is differentiable and invertible, with f(2) = 5, f(5) = 9, f′(2) = 4 and f′(5) = 7. Let g be the inverse of f. What is g′(5)?
      options:
        - "1/4"
        - "1/7"
        - "4"
        - "1/9"
      option_explanations:
        - |
          Correct. g(5) = 2 because f(2) = 5, so g′(5) = 1/f′(2) = 1/4.
        - |
          1/7 uses f′(5), evaluating f′ at the inverse's input instead of at the matching input 2.
        - |
          4 is f′(2) itself; the inverse's slope is the reciprocal.
        - |
          1/9 is the reciprocal of f(5), a function value, not a derivative.
      answer: 0
    - slug: apcalcab-u03-w11-q07
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Calculus CED, Topic 3.4"
      points: 1
      prompt: |
        What is d/dx arcsin(3x)?
      options:
        - "1/√(1 − 9x²)"
        - "3/√(1 − 3x²)"
        - "3/(1 + 9x²)"
        - "3/√(1 − 9x²)"
      option_explanations:
        - |
          The chain rule's inner derivative 3 is missing from the numerator.
        - |
          The inner function 3x must be squared inside the root: (3x)² = 9x², not 3x².
        - |
          This uses the arctangent formula 1/(1 + u²) in place of arcsine's 1/√(1 − u²).
        - |
          Correct. d/dx arcsin u = u′/√(1 − u²) with u = 3x gives 3/√(1 − 9x²).
      answer: 3
    - slug: apcalcab-u03-w11-q08
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Calculus CED, Topic 3.4"
      points: 1
      prompt: |
        What is the derivative of y = arctan(x²)?
      options:
        - "2x/(1 + x²)"
        - "1/(1 + x⁴)"
        - "2x/(1 + x⁴)"
        - "−2x/(1 + x⁴)"
      option_explanations:
        - |
          The inner function x² must be squared in the denominator, giving x⁴, not x².
        - |
          The inner derivative 2x is missing from the numerator.
        - |
          Correct. d/dx arctan u = u′/(1 + u²) with u = x² gives 2x/(1 + x⁴).
        - |
          The derivative of arctangent carries no minus sign; the sign belongs to arccosine.
      answer: 2
    - slug: apcalcab-u03-w11-q09
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Calculus CED, Topic 3.4"
      points: 1
      prompt: |
        If f(x) = arccos x, what is f′(1/2)?
      options:
        - "−2/√3"
        - "2/√3"
        - "−4/3"
        - "−√3/2"
      option_explanations:
        - |
          Correct. f′(x) = −1/√(1 − x²), so f′(1/2) = −1/√(3/4) = −1/(√3/2) = −2/√3.
        - |
          This is the derivative of arcsin x at 1/2; the arccosine derivative is negative.
        - |
          The square root was forgotten: −1/(1 − 1/4) = −4/3 instead of −1/√(3/4).
        - |
          This is −√(1 − x²) at x = 1/2, the reciprocal of the correct expression's magnitude.
      answer: 0
    - slug: apcalcab-u03-w11-q10
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Calculus CED, Topic 3.2"
      points: 1
      prompt: |
        If sin y = x, with −π/2 < y < π/2, what is dy/dx in terms of y?
      options:
        - "cos y"
        - "sec y"
        - "−sec y"
        - "1/cos x"
      option_explanations:
        - |
          Differentiating gives cos y · (dy/dx) = 1; cos y is the coefficient of dy/dx, not dy/dx itself.
        - |
          Correct. cos y · (dy/dx) = 1, so dy/dx = 1/cos y = sec y.
        - |
          The derivative of sin y is +cos y · (dy/dx); no minus sign appears.
        - |
          The cosine comes from differentiating sin y, so it must be cos y, not cos x.
      answer: 1
    - slug: apcalcab-u03-w11-q11
      type: multiple_choice
      topic_code: "3.1"
      source: "AP Calculus CED, Topic 3.1"
      points: 1
      prompt: |
        What is the derivative of y = e^(sin x)?
      options:
        - "e^(sin x)"
        - "e^(cos x)"
        - "sin x · e^(sin x − 1)"
        - "cos x · e^(sin x)"
      option_explanations:
        - |
          The exponential reproduces itself, but the chain rule also multiplies by the inner derivative cos x.
        - |
          The inner function was differentiated inside the exponent; the exponent must stay sin x.
        - |
          This treats e^u as a power and applies the power rule, which does not apply to exponentials.
        - |
          Correct. d/dx e^u = e^u · u′ with u = sin x, so the derivative is cos x · e^(sin x).
      answer: 3
    - slug: apcalcab-u03-w11-q12
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Calculus CED, Topic 2.9"
      points: 1
      prompt: |
        If f(x) = x²/(x − 1), what is f′(3)?
      options:
        - "6"
        - "−3/4"
        - "3/4"
        - "3"
      option_explanations:
        - |
          6 is the derivative of the numerator divided by the derivative of the denominator, 2x/1; the quotient rule is not a ratio of derivatives.
        - |
          The numerator terms are in the wrong order: x² · 1 − 2x(x − 1) gives the negative of the correct value.
        - |
          Correct. f′(x) = [2x(x − 1) − x² · 1]/(x − 1)², so f′(3) = (12 − 9)/4 = 3/4.
        - |
          3 is the quotient rule's numerator at x = 3; it still has to be divided by (x − 1)² = 4.
      answer: 2
    - slug: apcalcab-u03-w11-q13
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Calculus CED, Topic 1.11"
      points: 1
      prompt: |
        The function f is defined by f(x) = x² + k for x < 2 and f(x) = 3x − 1 for x ≥ 2. For what value of k is f continuous at x = 2?
      options:
        - "1"
        - "5"
        - "−1"
        - "9"
      option_explanations:
        - |
          Correct. Continuity needs the left-hand limit 4 + k to equal f(2) = 3(2) − 1 = 5, so k = 1.
        - |
          5 is f(2) itself; the left piece is 4 + k, so k must make 4 + k equal 5.
        - |
          This solves 4 + k = 5 with a sign slip, as k = 4 − 5.
        - |
          This adds instead of subtracting, as k = 5 + 4.
      answer: 0
    - slug: apcalcab-u03-w11-q14
      type: multi_select
      topic_code: "3.4"
      source: "AP Calculus CED, Topic 3.4"
      points: 2
      partial_credit: true
      prompt: |
        Which derivatives of inverse trigonometric functions are correct? Select all that apply.
      options:
        - "d/dx arctan x = 1/(1 + x²)"
        - "d/dx arcsin x = 1/√(1 − x²)"
        - "d/dx arccos x = 1/√(1 − x²)"
        - "d/dx arcsin(x/2) = 1/√(4 − x²)"
        - "d/dx arctan(2x) = 2/(1 + 2x²)"
      option_explanations:
        - |
          Correct. This is the standard arctangent derivative, valid for every real x.
        - |
          Correct. This is the standard arcsine derivative, for −1 < x < 1.
        - |
          The arccosine derivative is negative: −1/√(1 − x²).
        - |
          Correct. (1/2)/√(1 − x²/4) = (1/2)/(√(4 − x²)/2) = 1/√(4 − x²).
        - |
          The inner function 2x must be squared whole: 2/(1 + 4x²).
      answer: [0, 1, 3]
    - slug: apcalcab-u03-w11-q15
      type: multi_select
      topic_code: "3.1"
      source: "AP Calculus CED, Topic 3.1"
      points: 2
      partial_credit: true
      prompt: |
        Which functions have derivative 2x cos(x²)? Select all that apply.
      options:
        - "sin(x²)"
        - "sin(x²) + 7"
        - "sin²x"
        - "2 sin(x²)"
        - "cos(x²)"
      option_explanations:
        - |
          Correct. cos(x²) times the inner derivative 2x.
        - |
          Correct. The constant 7 has derivative 0, so this has the same derivative as sin(x²).
        - |
          sin²x = (sin x)² has derivative 2 sin x cos x, a different function.
        - |
          The constant factor 2 doubles the derivative to 4x cos(x²).
        - |
          The derivative of cos(x²) is −2x sin(x²).
      answer: [0, 1]
    - slug: apcalcab-u03-w11-q16
      type: true_false
      topic_code: "3.3"
      source: "AP Calculus CED, Topic 3.3"
      points: 1
      prompt: |
        True or false: If f is differentiable and invertible, f(3) = 7 and f′(3) = 2, then the derivative of the inverse of f at x = 7 is 1/2.
      answer: true
      explanation: |
        True. The inverse's input 7 matches f's input 3, so (f⁻¹)′(7) = 1/f′(3) = 1/2.
    - slug: apcalcab-u03-w11-q17
      type: true_false
      topic_code: "3.2"
      source: "AP Calculus CED, Topic 3.2"
      points: 1
      prompt: |
        True or false: When y is a differentiable function of x, the derivative of y² with respect to x is 2y.
      answer: false
      explanation: |
        False. y² is the composite of the squaring function with the function y, so the chain rule gives d/dx [y²] = 2y · dy/dx. The answer 2y is the derivative with respect to y, not x.
    - slug: apcalcab-u03-w11-q18
      type: fill_blank
      topic_code: "3.4"
      source: "AP Calculus CED, Topic 3.4"
