      source: "AP Calculus CED, Topic 3.1"
      points: 3
      prompt: |
        The function f is differentiable and positive, with f(2) = 9 and f′(2) = 12.

        (a) Let g(x) = √(f(x)). Find g′(2).
        (b) Write an equation for the line tangent to the graph of g at x = 2.
        (c) Let k(x) = f(2x). Find k′(1).
      answer: |
        (a) g′(x) = f′(x)/(2√(f(x))), so g′(2) = 12/(2 · 3) = 2.
        (b) g(2) = √9 = 3, so the tangent line is y = 3 + 2(x − 2).
        (c) k′(x) = 2f′(2x), so k′(1) = 2f′(2) = 24.
      explanation: |
        Three points, one per part. (a) 2 from the chain rule f′/(2√f). (b) the point (2, 3) with the slope from (a) (follow-through accepted). (c) 24, with the factor 2 from the inner function 2x.
    - slug: apcalcab-u03-w11-q23
      type: long_answer
      topic_code: "3.2"
      source: "AP Calculus CED, Topic 3.2"
      points: 6
      prompt: |
        Consider the curve given by x² − 2xy + 3y² = 18.

        (A) Show that dy/dx = (y − x)/(3y − x).

        (B) The point (−3, 1) is on the curve. Write an equation for the line tangent to the curve at this point.

        (C) Find the coordinates of every point on the curve at which the tangent line is horizontal.

        (D) Find the coordinates of every point on the curve at which the tangent line is vertical.
      answer: |
        (A) Differentiate both sides with respect to x: 2x − 2[y + x(dy/dx)] + 6y(dy/dx) = 0. So 2x − 2y + (6y − 2x)(dy/dx) = 0, and dy/dx = (2y − 2x)/(6y − 2x) = (y − x)/(3y − x).
        (B) At (−3, 1): dy/dx = (1 − (−3))/(3 − (−3)) = 4/6 = 2/3. Tangent line: y = 1 + (2/3)(x + 3).
        (C) Horizontal tangent: y − x = 0 with 3y − x ≠ 0. Substitute y = x into the curve: x² − 2x² + 3x² = 2x² = 18, so x = ±3. Points (3, 3) and (−3, −3); at both, 3y − x = ±6 ≠ 0.
        (D) Vertical tangent: 3y − x = 0 with y − x ≠ 0. Substitute x = 3y: 9y² − 6y² + 3y² = 6y² = 18, so y = ±√3. Points (3√3, √3) and (−3√3, −√3); at both, y − x = ∓2√3 ≠ 0.
      explanation: |
        Six points. (A) 2 points: 1 for a correct implicit derivative including the product-rule term −2[y + x(dy/dx)], 1 for solving to the given expression. (B) 1 point: slope 2/3 in a correct line through (−3, 1). (C) 2 points: 1 for setting y − x = 0 and substituting into the curve, 1 for both points (3, 3) and (−3, −3). (D) 1 point: both points (3√3, √3) and (−3√3, −√3) from 3y − x = 0.
