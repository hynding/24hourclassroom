    - slug: apcalcab-u03-w11-q21
      type: short_answer
      topic_code: "3.3"
      source: "AP Calculus CED, Topic 3.3"
      points: 3
      prompt: |
        Let f(x) = x⁵ + 3x − 2, and let g be the inverse function of f.

        (a) Explain why f has an inverse function.
        (b) Find g(2).
        (c) Find g′(2).
      answer: |
        (a) f′(x) = 5x⁴ + 3 > 0 for every x, so f is increasing on all real numbers. An increasing function is one-to-one, so f has an inverse.
        (b) f(1) = 1 + 3 − 2 = 2, so g(2) = 1.
        (c) g′(2) = 1/f′(g(2)) = 1/f′(1) = 1/(5 + 3) = 1/8.
      explanation: |
        Three points, one per part. (a) f′(x) = 5x⁴ + 3 > 0 (or another valid argument that f is one-to-one) leading to invertibility. (b) g(2) = 1 from f(1) = 2. (c) 1/8, with f′ evaluated at 1 (follow-through from (b) accepted).
    - slug: apcalcab-u03-w11-q22
      type: short_answer
