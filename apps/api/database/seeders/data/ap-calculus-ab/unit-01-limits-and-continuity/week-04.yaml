      points: 1
      prompt: |
        True or false: Every rational function is continuous at every real number.
      answer: false
      explanation: |
        False. A rational function is continuous on its domain, which excludes the zeros of its denominator. For example 1/(x − 2) is not continuous at x = 2.
    - slug: apcalcab-u01-w04-q18
      type: true_false
