    - slug: apcalcab-u01-w04-q23
      type: short_answer
      topic_code: "1.12"
      source: "AP Calculus CED, Topic 1.12"
      points: 3
      prompt: |
        Let p(x) = (x² − 4)/(x² − 3x + 2).

        (a) On what set is p continuous? Explain.
        (b) Classify each discontinuity of p.
        (c) Define a new function q, equal to p wherever p is defined, that is continuous at as many points as possible. Where is q still discontinuous?
      answer: |
        (a) p is rational, so it is continuous on its domain. The denominator (x − 1)(x − 2) is 0 at x = 1 and x = 2, so p is continuous on (−∞, 1) ∪ (1, 2) ∪ (2, ∞).
        (b) p(x) = (x − 2)(x + 2)/((x − 1)(x − 2)) = (x + 2)/(x − 1) for x ≠ 2. At x = 2 the factor cancels and the limit is 4/1 = 4: removable. At x = 1 the denominator of (x + 2)/(x − 1) is 0 and the numerator is 3: infinite.
        (c) q(x) = p(x) for x ≠ 2 and q(2) = 4 (that is, q(x) = (x + 2)/(x − 1) for x ≠ 1). q is still discontinuous at x = 1, an infinite discontinuity that no value can remove.
      explanation: |
        Three points, one per part. (a) the set excluding 1 and 2, with the reason (rational function, continuous on its domain). (b) removable at 2 (limit 4) and infinite at 1, both correct. (c) q(2) = 4 and x = 1 named as the remaining discontinuity.
    - slug: apcalcab-u01-w04-q24
      type: short_answer
      topic_code: "1.6"
      source: "AP Calculus CED, Topic 1.6"
      points: 3
      prompt: |
        Evaluate each limit, showing the rewriting you use.

        (a) lim (x→0) (1 − cos x)/x²
        (b) lim (x→0) x/sin(3x)
        (c) lim (x→1) (1/x − 1)/(x − 1)
      answer: |
        (a) Multiply by (1 + cos x)/(1 + cos x): (1 − cos²x)/(x²(1 + cos x)) = (sin x/x)² · 1/(1 + cos x) → 1² · 1/2 = 1/2.
        (b) x/sin(3x) = (1/3) · (3x)/sin(3x) → (1/3)(1) = 1/3.
        (c) (1/x − 1) = (1 − x)/x, so the quotient is (1 − x)/(x(x − 1)) = −1/x for x ≠ 1, which approaches −1.
      explanation: |
        Three points, one per part; each needs a valid rewrite and the correct value (1/2, 1/3, −1). A value with no algebra earns no point.
    - slug: apcalcab-u01-w04-q25
      type: long_answer
      topic_code: "1.13"
      source: "AP Calculus CED, Topic 1.13"
      points: 6
      prompt: |
        Let a and b be constants, and let f be defined by

        f(x) = x² + a for x ≤ 1,
        f(x) = bx − 1 for 1 < x < 3,
        f(x) = (x² − 9)/(x − 3) + 2 for x > 3.

        f(3) is not defined.

        (A) Find lim (x→3⁺) f(x). Then find the value of b for which lim (x→3) f(x) exists.

        (B) Using that value of b, find the value of a for which f is continuous at x = 1. Justify using the definition of continuity.

        (C) With these values of a and b, classify the discontinuity of f at x = 3, and state the value f(3) should be given to remove it.

        (D) With a, b and f(3) chosen as above, explain why f is continuous for all real numbers.
      answer: |
        (A) For x > 3, (x − 3)(x + 3)/(x − 3) + 2 = x + 5, so lim (x→3⁺) f(x) = 8. lim (x→3⁻) f(x) = 3b − 1. The limit exists when 3b − 1 = 8, so b = 3.
        (B) f(1) = 1 + a = lim (x→1⁻) f(x), and lim (x→1⁺) f(x) = 3(1) − 1 = 2. Continuity at 1 needs lim (x→1) f(x) = f(1), so 1 + a = 2 and a = 1. Then f(1) = 2 and both one-sided limits equal 2.
        (C) The limit at 3 is 8 but f(3) is undefined: a removable discontinuity. Define f(3) = 8.
        (D) On x < 1 f is a polynomial, on 1 < x < 3 a linear function, and on x > 3 it equals x + 5; each is continuous on its interval. At the break points, lim (x→1) f(x) = 2 = f(1) and lim (x→3) f(x) = 8 = f(3). So f is continuous at every real number.
      explanation: |
        Six points. (A) 2 points: 1 for the right-hand limit 8 (with the cancellation), 1 for b = 3 from equating the one-sided limits. (B) 2 points: 1 for a = 1, 1 for a justification naming f(1) and both one-sided limits equal to 2 and stating that the limit equals the value. (C) 1 point: "removable" and f(3) = 8. (D) 1 point: each piece continuous on its own interval plus the two break points checked.
