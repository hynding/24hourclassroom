      source: "AP Calculus CED, Topic 1.10"
      points: 1
      prompt: |
        True or false: If f is discontinuous at x = c but lim (x→c) f(x) exists, then the discontinuity at c is removable.
      answer: true
      explanation: |
        True. If the limit exists, the only possible failures are that f(c) is undefined or different from the limit, which is the definition of a removable discontinuity. Jumps and infinite discontinuities have no two-sided limit.
