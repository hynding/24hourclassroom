    - slug: apcalcab-u01-w03-q22
      type: short_answer
      topic_code: "1.8"
      source: "AP Calculus CED, Topic 1.8"
      points: 3
      prompt: |
        Let f(x) = x⁴ cos(2/x) + 3 for x ≠ 0.

        (a) Write an inequality that bounds x⁴ cos(2/x) above and below for x ≠ 0, and explain where it comes from.
        (b) Use it to bound f(x), and find the limits of both bounding functions as x → 0.
        (c) State lim (x→0) f(x), naming the theorem and the conditions that make it apply.
      answer: |
        (a) −1 ≤ cos(2/x) ≤ 1 for every x ≠ 0; multiplying by x⁴ > 0 keeps the direction: −x⁴ ≤ x⁴ cos(2/x) ≤ x⁴.
        (b) Adding 3: 3 − x⁴ ≤ f(x) ≤ 3 + x⁴. lim (x→0) (3 − x⁴) = 3 and lim (x→0) (3 + x⁴) = 3.
        (c) lim (x→0) f(x) = 3 by the squeeze theorem, because f is trapped between two functions near 0 and both of those functions approach the same limit, 3.
      explanation: |
        Three points, one per part. (a) the inequality with the reason (cosine is between −1 and 1, and x⁴ is positive). (b) the bounds for f and both limits equal to 3. (c) limit 3 with the squeeze theorem named and both conditions (the inequality and the equal outer limits) mentioned.
    - slug: apcalcab-u01-w03-q23
      type: short_answer
      topic_code: "1.7"
      source: "AP Calculus CED, Topic 1.7"
      points: 3
      prompt: |
        For each limit, choose a method, then evaluate the limit or explain why it does not exist.

        (a) lim (x→2) (x³ − 8)/(x − 2)
        (b) lim (x→−2) (x² + 5)/(x + 3)
        (c) lim (x→1) (x + 2)/(x − 1)²
      answer: |
        (a) Substitution gives 0/0. Difference of cubes: (x − 2)(x² + 2x + 4)/(x − 2) = x² + 2x + 4 → 4 + 4 + 4 = 12.
        (b) Substitution works because the denominator is −2 + 3 = 1 ≠ 0: (4 + 5)/1 = 9.
        (c) Substitution gives 3/0, a nonzero number over 0. The denominator is positive on both sides, so the quotient grows without bound: lim (x→1) (x + 2)/(x − 1)² = ∞ and the limit does not exist.
      explanation: |
        Three points, one per part. (a) factoring and 12. (b) 9 with substitution justified by the nonzero denominator. (c) "does not exist" (or "= ∞") with the reason: a nonzero numerator over a denominator approaching 0.
    - slug: apcalcab-u01-w03-q24
      type: long_answer
      topic_code: "1.10"
      source: "AP Calculus CED, Topic 1.10"
      points: 6
      prompt: |
        Let g be the function defined by

        g(x) = (x² − 2x − 3)/(x − 3) for x < 3,
        g(3) = 1,
        g(x) = 7 − x for 3 < x < 6,
        g(x) = 4/(x − 7) for x ≥ 6, x ≠ 7.

        (A) Find lim (x→3) g(x). Compare it with g(3), and classify the discontinuity of g at x = 3.

        (B) Find lim (x→6⁻) g(x) and lim (x→6⁺) g(x), and classify the discontinuity of g at x = 6.

        (C) Describe the behaviour of g near x = 7 using one-sided limits, and classify the discontinuity there.

        (D) What value could replace g(3) = 1 so that lim (x→3) g(x) = g(3)? Explain why no single value can achieve this at x = 6.
      answer: |
        (A) Left: (x − 3)(x + 1)/(x − 3) = x + 1 → 4. Right: 7 − x → 4. So lim (x→3) g(x) = 4, but g(3) = 1 ≠ 4: a removable discontinuity.
        (B) lim (x→6⁻) g(x) = 7 − 6 = 1; lim (x→6⁺) g(x) = 4/(6 − 7) = −4. The one-sided limits are finite and unequal: a jump discontinuity.
        (C) For x slightly less than 7, x − 7 is a small negative number, so lim (x→7⁻) g(x) = −∞; for x slightly greater, lim (x→7⁺) g(x) = ∞. An infinite discontinuity (vertical asymptote x = 7).
        (D) g(3) = 4. At x = 6 the one-sided limits (1 and −4) disagree, so lim (x→6) g(x) does not exist and no choice of g(6) can equal it.
      explanation: |
        Six points. (A) 2 points: 1 for the limit 4 from both pieces (left piece simplified by factoring), 1 for "removable" with the comparison g(3) = 1 ≠ 4. (B) 2 points: 1 for both one-sided limits 1 and −4, 1 for "jump" justified by unequal finite one-sided limits. (C) 1 point: both one-sided infinite limits with correct signs and "infinite". (D) 1 point: the value 4 and the reason that the limit at 6 does not exist.
