    - slug: apcalcab-u01-w05-q23
      type: short_answer
      topic_code: "1.14"
      source: "AP Calculus CED, Topic 1.14"
      points: 3
      prompt: |
        Let r(x) = (2x² − 2)/(x² − 4x + 3).

        (a) Find the location of the hole in the graph of r, with both coordinates.
        (b) Find the vertical asymptote, and give lim (x→c⁻) r(x) and lim (x→c⁺) r(x) at it, justifying the signs.
        (c) Find the horizontal asymptote, using a limit.
      answer: |
        (a) r(x) = 2(x − 1)(x + 1)/((x − 1)(x − 3)) = 2(x + 1)/(x − 3) for x ≠ 1. At x = 1 the simplified form gives 2(2)/(−2) = −2: a hole at (1, −2).
        (b) x = 3. Near 3 the numerator 2(x + 1) approaches 8 > 0. For x slightly less than 3, x − 3 < 0, so lim (x→3⁻) r(x) = −∞; for x slightly greater, x − 3 > 0, so lim (x→3⁺) r(x) = ∞.
        (c) lim (x→±∞) r(x) = 2/1 = 2 (equal degrees), so y = 2 is the horizontal asymptote.
      explanation: |
        Three points, one per part. (a) the hole at (1, −2), both coordinates. (b) x = 3 with both one-sided limits and the sign reasoning. (c) y = 2 supported by a limit at infinity.
    - slug: apcalcab-u01-w05-q24
      type: short_answer
      topic_code: "1.13"
      source: "AP Calculus CED, Topic 1.13"
      points: 3
      prompt: |
        (a) Let f(x) = sin(2x)/x for x ≠ 0. What value of f(0) makes f continuous at 0? Show the limit.
        (b) Let g(x) = (x² + ax − 6)/(x − 2) for x ≠ 2. Find the value of a for which lim (x→2) g(x) exists.
        (c) With that value of a, what value of g(2) makes g continuous at x = 2?
      answer: |
        (a) lim (x→0) sin(2x)/x = 2 · lim (x→0) sin(2x)/(2x) = 2, so define f(0) = 2.
        (b) The denominator approaches 0, so the numerator must too (otherwise the quotient is unbounded): 4 + 2a − 6 = 0, so a = 1.
        (c) x² + x − 6 = (x + 3)(x − 2), so g(x) = x + 3 for x ≠ 2, with limit 5. Define g(2) = 5.
      explanation: |
        Three points, one per part. (a) f(0) = 2 with the limit shown. (b) a = 1 with the reason that the numerator must approach 0. (c) g(2) = 5 from the factored form.
    - slug: apcalcab-u01-w05-q25
      type: long_answer
      topic_code: "1.16"
      source: "AP Calculus CED, Topic 1.16"
      points: 6
      prompt: |
        A hypothetical reservoir's depth, in metres, is modelled by D(t) = (6t² + 5)/(t² + 1), where t is the time in months after a dry season ends, t ≥ 0.

        (A) Explain why D is continuous on the interval [0, 3].

        (B) Use the Intermediate Value Theorem to show that the depth is 5.6 metres at some time between t = 0 and t = 2. Show the values you use.

        (C) Find lim (t→∞) D(t), and interpret it in the context of the reservoir.

        (D) Show that D(t) = 6 has no solution, and explain why this does not contradict your answer to part (C).
      answer: |
        (A) D is a rational function, so it is continuous on its domain. Its denominator t² + 1 is at least 1 and never 0, so D is continuous for all t, in particular on [0, 3].
        (B) D(0) = 5/1 = 5 and D(2) = (24 + 5)/(4 + 1) = 29/5 = 5.8. D is continuous on [0, 2] and 5 < 5.6 < 5.8, so by the Intermediate Value Theorem there is a time c in (0, 2) with D(c) = 5.6 metres.
        (C) Equal degrees: lim (t→∞) D(t) = 6/1 = 6. In the long run the reservoir's depth approaches 6 metres (the horizontal asymptote D = 6).
        (D) 6t² + 5 = 6(t² + 1) gives 5 = 6, which is false, so the depth is never exactly 6 m. A limit at infinity describes values the function approaches, not values it must reach: D(t) = 6 − 1/(t² + 1) stays just below 6 for every t.
      explanation: |
        Six points. (A) 1 point: rational function with a denominator that is never 0 (so continuous). (B) 2 points: 1 for D(0) = 5 and D(2) = 5.8, 1 for the IVT conclusion with continuity and 5 < 5.6 < 5.8 stated. (C) 2 points: 1 for the limit 6, 1 for the interpretation with units (the depth approaches 6 m in the long run). (D) 1 point: the algebra showing no solution together with the explanation that a limit need not be attained.
