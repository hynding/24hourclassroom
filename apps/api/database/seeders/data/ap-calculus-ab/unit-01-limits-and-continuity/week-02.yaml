    - slug: apcalcab-u01-w02-q22
      type: short_answer
      topic_code: "1.3"
      source: "AP Calculus CED, Topic 1.3"
      points: 3
      prompt: |
        The graph of a function r on −2 ≤ x ≤ 6 is described below.

        - For −2 ≤ x < 4: a curve that starts at (−2, 1), rises through an open circle at (1, 4), and keeps rising without bound as x approaches 4 from the left.
        - A solid dot at (1, 2).
        - For 4 < x ≤ 6: a curve that comes down from arbitrarily large values just to the right of x = 4 and decreases to the solid point (6, 3).

        (a) Find lim (x→1) r(x) and r(1).
        (b) Describe the behaviour of r as x → 4, using limit notation.
        (c) For which values of c in the open interval (−2, 6) does lim (x→c) r(x) fail to exist? Explain.
      answer: |
        (a) lim (x→1) r(x) = 4 (the curve approaches the open circle from both sides); r(1) = 2.
        (b) lim (x→4⁻) r(x) = ∞ and lim (x→4⁺) r(x) = ∞, so lim (x→4) r(x) = ∞: r is unbounded and the limit does not exist.
        (c) Only c = 4, where r grows without bound. At c = 1 the limit exists (it is 4) despite the misplaced dot, and everywhere else the curve is unbroken.
      explanation: |
        Three points, one per part. (a) limit 4 and value 2. (b) unbounded behaviour from both sides expressed with ∞ (or in words), with the limit not existing. (c) c = 4 only, with the reason; listing c = 1 loses the point.
    - slug: apcalcab-u01-w02-q23
      type: short_answer
      topic_code: "1.6"
      source: "AP Calculus CED, Topic 1.6"
      points: 3
      prompt: |
        Evaluate each limit, showing the algebra that justifies it.

        (a) lim (x→4) (x − 4)/(√x − 2)
        (b) lim (x→0) sin(3x)/sin(2x)
        (c) lim (x→2) (x² − 2x)/(x² − 4)
      answer: |
        (a) x − 4 = (√x − 2)(√x + 2), so for x ≠ 4 the quotient is √x + 2 → 2 + 2 = 4. (Multiplying by the conjugate gives the same result.)
        (b) sin(3x)/sin(2x) = [sin(3x)/(3x)] · [(2x)/sin(2x)] · (3/2) → 1 · 1 · 3/2 = 3/2.
        (c) x(x − 2)/((x − 2)(x + 2)) = x/(x + 2) for x ≠ 2 → 2/4 = 1/2.
      explanation: |
        Three points, one per part: each needs the correct value supported by a valid rewrite. A correct value from a table or with no work earns no point. Keeping "lim" on each line is expected; missing notation alone is noted, not penalised, in this quiz.
    - slug: apcalcab-u01-w02-q24
      type: long_answer
      topic_code: "1.7"
      source: "AP Calculus CED, Topic 1.7"
      points: 6
      prompt: |
        Let f be the function defined by

        f(x) = (x² − x − 2)/(x − 2) for x < 2,
        f(2) = 1,
        f(x) = (√(x + 7) − 3)/(x − 2) for x > 2.

        (A) Find lim (x→2⁻) f(x). Show the work that leads to your answer.

        (B) Find lim (x→2⁺) f(x). Show the work that leads to your answer.

        (C) Does lim (x→2) f(x) exist? Justify your answer, and say whether its value (if any) is related to f(2).

        (D) Find lim (x→0) f(x), and explain why a different procedure from part (A) is appropriate.
      answer: |
        (A) Substitution gives 0/0. Factor: (x − 2)(x + 1)/(x − 2) = x + 1 for x < 2, so lim (x→2⁻) f(x) = lim (x→2⁻) (x + 1) = 3.
        (B) Substitution gives 0/0. Multiply by the conjugate: (√(x + 7) − 3)(√(x + 7) + 3)/((x − 2)(√(x + 7) + 3)) = (x − 2)/((x − 2)(√(x + 7) + 3)) = 1/(√(x + 7) + 3). So lim (x→2⁺) f(x) = 1/(3 + 3) = 1/6.
        (C) No. The left-hand limit 3 and the right-hand limit 1/6 are not equal, so lim (x→2) f(x) does not exist. The value f(2) = 1 plays no part in whether the limit exists.
        (D) Near x = 0 the left piece applies, and substituting gives (0 − 0 − 2)/(0 − 2) = 1, a number with a nonzero denominator, so direct substitution is valid: lim (x→0) f(x) = 1. No factoring is needed because the denominator is not 0 there.
      explanation: |
        Six points. (A) 2 points: 1 for factoring and cancelling (or an equivalent valid rewrite), 1 for the answer 3. (B) 2 points: 1 for rationalising with the conjugate, 1 for the answer 1/6. (C) 1 point: "does not exist" with the reason that the one-sided limits (3 and 1/6) differ; the point is not earned for reasoning from f(2). (D) 1 point: the value 1 with the reason that substitution gives a defined value (denominator −2 ≠ 0).
