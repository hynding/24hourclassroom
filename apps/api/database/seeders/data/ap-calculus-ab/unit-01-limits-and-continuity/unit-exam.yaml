  # ---- Short answer
  - slug: apcalcab-u01-exam-q42
    type: short_answer
    topic_code: "1.9"
    source: "AP Calculus CED, Topic 1.9"
    points: 3
    prompt: |
      Let h(x) = (x³ − 2x² − 3x)/(x − 3).

      (a) Complete the table of values of h, exactly.

      | x | 2.9 | 2.99 | 3.01 | 3.1 |
      |---|---|---|---|---|
      | h(x) | | | | |

      (b) Find lim (x→3) h(x) algebraically, and say whether the table supports your answer.
      (c) Describe the graph of h near x = 3.
    answer: |
      (a) For x ≠ 3, h(x) = x(x − 3)(x + 1)/(x − 3) = x² + x. Values: 11.31, 11.9301, 12.0701, 12.71.
      (b) lim (x→3) h(x) = lim (x→3) (x² + x) = 9 + 3 = 12. The table supports it: the outputs approach 12 from below on the left and from above on the right.
      (c) The graph is the parabola y = x² + x with a hole at (3, 12), because h(3) is undefined.
    explanation: |
      Three points, one per part. (a) all four values (from the simplified form or direct computation). (b) the limit 12 by factoring, with the table comparison. (c) a hole at (3, 12), both coordinates, on the parabola y = x² + x.
  - slug: apcalcab-u01-exam-q43
    type: short_answer
    topic_code: "1.13"
    source: "AP Calculus CED, Topic 1.13"
    points: 3
    prompt: |
      Let a and b be constants, and let

      f(x) = ax + 2 for x < 1,
      f(x) = x² + b for 1 ≤ x ≤ 3,
      f(x) = 4x − a for x > 3.

      (a) Write the equation that a and b must satisfy for f to be continuous at x = 1.
      (b) Write the equation that a and b must satisfy for f to be continuous at x = 3.
      (c) Find a and b, and verify that f is then continuous at both break points.
    answer: |
      (a) lim (x→1⁻) f(x) = a + 2 must equal f(1) = 1 + b: a + 2 = 1 + b.
      (b) f(3) = 9 + b must equal lim (x→3⁺) f(x) = 12 − a: 9 + b = 12 − a.
      (c) From (a), b = a + 1; substituting into (b), 9 + a + 1 = 12 − a, so 2a = 2, a = 1 and b = 2. Check: at x = 1 both sides equal 3 and f(1) = 3; at x = 3 both sides equal 11 and f(3) = 11.
    explanation: |
      Three points, one per part. (a) a + 2 = 1 + b. (b) 9 + b = 12 − a. (c) a = 1 and b = 2 with both break points checked.
  # ---- Free response
  - slug: apcalcab-u01-exam-q44
    type: long_answer
    topic_code: "1.14"
    source: "AP Calculus CED, Topic 1.14"
    points: 9
    prompt: |
      No calculator is allowed for this question.

      Let g be the function defined by g(x) = (2x² − 8)/(x² − 3x + 2).

      (A) Find the values of x at which g is not continuous. Justify your answer.

      (B) Find lim (x→2) g(x). Classify the discontinuity of g at x = 2, and state how g(2) could be defined to remove it.

      (C) Find lim (x→1⁻) g(x) and lim (x→1⁺) g(x). Classify the discontinuity of g at x = 1.

      (D) Find lim (x→∞) g(x) and lim (x→−∞) g(x), and give the equation of each horizontal asymptote of the graph of g.

      (E) g(0) = −4 and g(3) = 5. A student says, "By the Intermediate Value Theorem, g has a zero in the interval (0, 3)." Explain why the theorem does not support this claim, and show that g in fact has no zero in (0, 3).

      (F) Use the Intermediate Value Theorem to show that g has a zero in the interval (−3, −1).
    answer: |
      (A) g is a rational function, continuous on its domain. The denominator x² − 3x + 2 = (x − 1)(x − 2) is 0 at x = 1 and x = 2, so g is not continuous at x = 1 and x = 2 only.
      (B) g(x) = 2(x − 2)(x + 2)/((x − 1)(x − 2)) = 2(x + 2)/(x − 1) for x ≠ 2. lim (x→2) g(x) = 2(4)/1 = 8. The limit exists but g(2) is undefined: removable. Defining g(2) = 8 removes it.
      (C) Near x = 1, g(x) = 2(x + 2)/(x − 1); the numerator approaches 6 > 0. For x slightly less than 1, x − 1 < 0, so lim (x→1⁻) g(x) = −∞; for x slightly greater, lim (x→1⁺) g(x) = ∞. Infinite discontinuity (vertical asymptote x = 1).
      (D) Equal degrees with leading coefficients 2 and 1: lim (x→∞) g(x) = lim (x→−∞) g(x) = 2. One horizontal asymptote, y = 2.
      (E) The IVT requires g to be continuous on [0, 3], but g is not continuous at x = 1 or x = 2, which lie in that interval, so the theorem does not apply. The zeros of g come from 2(x + 2) = 0 with x ≠ 1, 2, so the only zero is x = −2, which is not in (0, 3).
      (F) g(−3) = 2(−1)/(−4) = 1/2 and g(−1) = 2(1)/(−2) = −1. g has no discontinuities in [−3, −1], so it is continuous there, and −1 < 0 < 1/2. By the IVT there is c in (−3, −1) with g(c) = 0 (it is c = −2).
    explanation: |
      Nine points.
      (A) 1 point: x = 1 and x = 2 with the reason (denominator 0; a rational function is continuous elsewhere on its domain).
      (B) 2 points: 1 for the limit 8 via cancellation; 1 for "removable" together with defining g(2) = 8.
      (C) 2 points: 1 for both one-sided limits with correct signs, supported by sign analysis; 1 for "infinite" (or "vertical asymptote x = 1").
      (D) 1 point: both limits equal 2 and the asymptote y = 2.
      (E) 2 points: 1 for identifying the failed hypothesis (g not continuous on [0, 3], naming x = 1 or x = 2); 1 for showing the only zero is x = −2.
      (F) 1 point: g(−3) = 1/2 and g(−1) = −1, continuity on [−3, −1] stated, and the IVT conclusion. A conclusion without the continuity statement earns no point.
  - slug: apcalcab-u01-exam-q45
    type: long_answer
    topic_code: "1.16"
    source: "AP Calculus CED, Topic 1.16"
    points: 9
    prompt: |
      (Calculator.) A graphing calculator is required for this question.

      Hypothetical model: water in an insulated tank cools after a pump stops, and a heater switches on 10 minutes later. The water temperature, in degrees Celsius, t minutes after the pump stops is

      H(t) = 20 + 60e^(−0.15t) for 0 ≤ t ≤ 10,
      H(t) = a + 2.5(t − 10) for 10 < t ≤ 20,

      where a is a constant.

      (A) Find H(0) and interpret it in context.

      (B) Find the value of a for which H is continuous at t = 10. Justify your answer using one-sided limits. Give a to three decimal places.

      (C) Explain why there must be a time t in (0, 10) at which the water temperature is 40 °C.

      (D) Find the average rate of change of H over 0 ≤ t ≤ 10, with units. Then estimate the rate at which the temperature is changing at the instant t = 5, using average rates of change over [4.99, 5.01]. Give both answers to three decimal places.

      (E) Suppose instead that the heater never switches on, so that the temperature is W(t) = 20 + 60e^(−0.15t) for all t ≥ 0. Find lim (t→∞) W(t) and explain what it means for the water.
    answer: |
      (A) H(0) = 20 + 60 = 80. The water is at 80 °C when the pump stops.
      (B) lim (t→10⁻) H(t) = H(10) = 20 + 60e^(−1.5) ≈ 33.388. lim (t→10⁺) H(t) = a + 2.5(0) = a. For continuity at 10 these must be equal, so a = 20 + 60e^(−1.5) ≈ 33.388.
      (C) On [0, 10], H(t) = 20 + 60e^(−0.15t) is a sum of a constant and a multiple of an exponential, so it is continuous. H(0) = 80 and H(10) ≈ 33.388, and 33.388 < 40 < 80. By the Intermediate Value Theorem, H(c) = 40 for some c in (0, 10).
      (D) (H(10) − H(0))/(10 − 0) ≈ (33.388 − 80)/10 ≈ −4.661 °C per minute. (H(5.01) − H(4.99))/0.02 ≈ −4.251, so at t = 5 the temperature is decreasing at about 4.251 °C per minute.
      (E) As t → ∞, e^(−0.15t) → 0, so lim (t→∞) W(t) = 20. Without the heater the water temperature would approach 20 °C (the room temperature in this model), getting ever closer but never dropping below it.
    explanation: |
      Nine points.
      (A) 1 point: 80 with the interpretation (temperature in °C when the pump stops).
      (B) 2 points: 1 for both one-sided limits (left ≈ 33.388, right = a); 1 for a ≈ 33.388 with the statement that the one-sided limits must be equal (and equal H(10)). Accept 33.387 or 33.388.
      (C) 2 points: 1 for continuity of H on [0, 10] with a reason; 1 for H(0) = 80, H(10) ≈ 33.388, 40 between them, and the IVT conclusion.
      (D) 2 points: 1 for −4.661 °C per minute (units required); 1 for −4.251 (accept −4.25 to −4.252) as the estimate of the instantaneous rate, with "decreasing" or the negative sign.
      (E) 2 points: 1 for the limit 20; 1 for the interpretation in context (the temperature approaches 20 °C in the long run).
