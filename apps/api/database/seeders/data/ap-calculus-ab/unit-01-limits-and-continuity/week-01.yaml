    - slug: apcalcab-u01-w01-q15
      type: true_false
      topic_code: "1.2"
      source: "AP Calculus CED, Topic 1.2"
      points: 1
      prompt: |
        True or false: If f(c) is undefined, then lim (x→c) f(x) cannot exist.
      answer: false
      explanation: |
        False. The limit looks only at inputs near c, never at c. For example f(x) = (x² − 9)/(x − 3) is undefined at 3, yet its outputs approach 6 as x → 3, so lim (x→3) f(x) = 6.
    - slug: apcalcab-u01-w01-q16
      type: true_false
      topic_code: "1.2"
      source: "AP Calculus CED, Topic 1.2"
      points: 1
      prompt: |
        True or false: lim (x→c) f(x) = L exactly when lim (x→c⁻) f(x) and lim (x→c⁺) f(x) both exist and both equal L.
      answer: true
      explanation: |
        True. A two-sided limit requires the outputs to approach L whichever side x comes from, so both one-sided limits must exist and equal L; and if they do, the two-sided limit is L.
