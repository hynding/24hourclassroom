    - slug: apcalcab-u01-w01-q21
      type: short_answer
      topic_code: "1.3"
      source: "AP Calculus CED, Topic 1.3"
      points: 3
      prompt: |
        The graph of a function g on −4 ≤ x ≤ 4 consists of a line segment from the solid point (−4, 0) to an open circle at (0, 2), and a line segment from the solid point (0, −1) to the solid point (4, 3).

        (a) Find lim (x→0⁻) g(x) and lim (x→0⁺) g(x).
        (b) Find g(0). Which one-sided limit equals g(0)?
        (c) Does lim (x→0) g(x) exist? Justify your answer.
      answer: |
        (a) lim (x→0⁻) g(x) = 2 (the left segment heads to the open circle at height 2); lim (x→0⁺) g(x) = −1.
        (b) g(0) = −1 (the solid point). The right-hand limit equals g(0).
        (c) No. The left-hand limit 2 and the right-hand limit −1 are not equal, so the two-sided limit does not exist.
      explanation: |
        Three points, one per part. (a) both one-sided limits correct. (b) g(0) = −1 and the right-hand limit identified. (c) "does not exist" with the reason that the one-sided limits differ (naming both values or saying they are unequal); "does not exist" with no reason earns no point.
    - slug: apcalcab-u01-w01-q22
      type: short_answer
      topic_code: "1.1"
      source: "AP Calculus CED, Topic 1.1"
      points: 3
      prompt: |
        Let f(x) = √x. Note that √4.41 = 2.1, √4.0401 = 2.01 and √3.9601 = 1.99.

        (a) Find the slope of the secant line through (4, f(4)) and (4.41, f(4.41)).
        (b) Find the slopes of the secant lines from x = 4 to x = 4.0401 and from x = 3.9601 to x = 4, to four decimal places.
        (c) Use your results to estimate the slope of the graph of f at x = 4, and write the limit your estimate approximates.
      answer: |
        (a) (2.1 − 2)/(4.41 − 4) = 0.1/0.41 ≈ 0.2439.
        (b) (2.01 − 2)/0.0401 = 0.01/0.0401 ≈ 0.2494; (2 − 1.99)/(4 − 3.9601) = 0.01/0.0399 ≈ 0.2506.
        (c) The slopes close in on 0.25 from both sides, so the slope at x = 4 is about 0.25 (1/4). It approximates lim (h→0) (√(4 + h) − 2)/h.
      explanation: |
        Three points. (a) 1 point for 0.1/0.41 ≈ 0.244. (b) 1 point for both slopes (0.2494 and 0.2506, or equivalent fractions). (c) 1 point for the estimate 0.25 together with a correct limit of difference quotients (an equivalent form such as lim (x→4) (√x − 2)/(x − 4) earns the point).
    - slug: apcalcab-u01-w01-q23
      type: long_answer
      topic_code: "1.1"
      source: "AP Calculus CED, Topic 1.1"
      points: 6
      prompt: |
        A hypothetical cyclist leaves a checkpoint, and her distance from it after t seconds is D(t) = 2t² + 3t metres, for 0 ≤ t ≤ 10.

        (A) Find the cyclist's average velocity over [3, 4]. Include units.

        (B) Find her average velocities over [3, 3.1] and over [2.9, 3]. Show the values of D that you use.

        (C) Use your answers to estimate her instantaneous velocity at t = 3, and write a limit expression, in terms of D, whose value is that instantaneous velocity.

        (D) A classmate estimates the velocity at t = 3 by computing D(3)/3. Find the classmate's value and explain why it is a poor estimate of the velocity at the instant t = 3.
      answer: |
        (A) D(4) = 32 + 12 = 44 and D(3) = 18 + 9 = 27. Average velocity = (44 − 27)/(4 − 3) = 17 m/s.
        (B) D(3.1) = 2(9.61) + 9.3 = 28.52, so (28.52 − 27)/0.1 = 15.2 m/s. D(2.9) = 2(8.41) + 8.7 = 25.52, so (27 − 25.52)/0.1 = 14.8 m/s.
        (C) The averages on either side of t = 3 are 15.2 and 14.8, closing in on 15, so the instantaneous velocity is about 15 m/s. It is lim (h→0) (D(3 + h) − D(3))/h (equivalently lim (t→3) (D(t) − D(3))/(t − 3)).
        (D) D(3)/3 = 27/3 = 9 m/s. This is the average velocity over [0, 3], a three-second interval during which she is speeding up, so it describes the whole interval, not the instant t = 3; the short intervals around t = 3 show the velocity there is near 15 m/s.
      explanation: |
        Six points. (A) 1 point: 17 m/s with units (no units, no point). (B) 2 points: 1 for each average velocity, 15.2 and 14.8, supported by D(3.1) = 28.52 and D(2.9) = 25.52. (C) 2 points: 1 for an estimate of 15 m/s (accept 15 or "about 15"), 1 for a correct limit of difference quotients in terms of D. (D) 1 point: 9 m/s together with the reason that it averages over the whole interval [0, 3] rather than an interval shrinking around t = 3.
