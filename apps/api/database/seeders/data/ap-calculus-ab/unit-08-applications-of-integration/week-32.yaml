        (c) Cross sections perpendicular to the x-axis are semicircles with diameters in the base. Find the volume.
      answer: |
        (a) At x the base runs from y = −√x to y = √x, so s = 2√x and A(x) = 4x. V = ∫ from 0 to 4 of 4x dx = 32.
        (b) At height y the base runs from x = y² to x = 4, so s = 4 − y². V = ∫ from −2 to 2 of (4 − y²)² dy = 512/15.
        (c) A(x) = (π/8)(2√x)² = (π/2)x. V = (π/2) ∫ from 0 to 4 of x dx = 4π.
