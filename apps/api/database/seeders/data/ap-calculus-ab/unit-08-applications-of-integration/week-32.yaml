    - slug: apcalcab-u08-w32-q25
      type: long_answer
      topic_code: "8.12"
      source: "AP Calculus CED, Topic 8.12"
      points: 6
      prompt: |
        Let R be the region enclosed by the graphs of y = √x and y = x/2, which intersect at (0, 0) and (4, 2).

        (A) Find the area of R.

        (B) Find the volume of the solid generated when R is revolved about the x-axis.

        (C) Write, but do not evaluate, an integral expression for the volume of the solid generated when R is revolved about the line y = 2.

        (D) R is the base of a solid whose cross sections perpendicular to the x-axis are squares. Write an integral for its volume and evaluate it.
      answer: |
        (A) √x ≥ x/2 on [0, 4] (at x = 1, 1 > 1/2). Area = ∫ from 0 to 4 of (√x − x/2) dx = 16/3 − 4 = 4/3.
        (B) Washers: R = √x, r = x/2. V = π ∫ from 0 to 4 of (x − x²/4) dx = π(8 − 16/3) = 8π/3.
        (C) The axis y = 2 is above R, so the far curve is the line: outer radius 2 − x/2, inner radius 2 − √x. V = π ∫ from 0 to 4 of [(2 − x/2)² − (2 − √x)²] dx.
        (D) The side is √x − x/2: V = ∫ from 0 to 4 of (√x − x/2)² dx = ∫ from 0 to 4 of (x − x^(3/2) + x²/4) dx = 8 − 64/5 + 16/3 = 8/15.
      explanation: |
        Six points. (A) 1 point: 4/3 from top − bottom. (B) 2 points: 1 for the washer integrand π(x − x²/4) with limits 0 and 4, 1 for 8π/3. (C) 2 points: 1 for the outer radius 2 − x/2 and inner radius 2 − √x (in the right order), 1 for the complete integral with π, limits and squares. (D) 1 point: the integral of (√x − x/2)² and the value 8/15.
