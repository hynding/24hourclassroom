      prompt: |
        A hypothetical water-treatment tank holds 200 gallons of water at time t = 0, where t is in hours. For 0 ≤ t ≤ 12, water is pumped in at a rate of W(t) = 30 + 10 sin(πt/6) gallons per hour and drains out at a rate of D(t) = 2t + 20 gallons per hour.

        (A) Find the average rate at which water is pumped in over 0 ≤ t ≤ 12. Show the integral you use.

        (B) Is the amount of water in the tank increasing or decreasing at t = 6? Give a reason.

        (C) How many gallons of water are in the tank at t = 12?

        (D) (Calculator.) A graphing calculator shows that W(t) − D(t) = 0 on 0 < t < 12 only at t ≈ 5.723, and that ∫ from 0 to 5.723 of (W(t) − D(t)) dt ≈ 62.474. At what time in 0 ≤ t ≤ 12 is the amount of water in the tank greatest, and what is that greatest amount? Justify your answer.
      answer: |
        (A) (1/12) ∫ from 0 to 12 of (30 + 10 sin(πt/6)) dt = (1/12)(360 + 0) = 30 gallons per hour. (The sine term runs over exactly one period, 12 hours, so its integral is 0: [−(60/π) cos(πt/6)] from 0 to 12 = −(60/π)(1 − 1) = 0.)
        (B) W(6) = 30 + 10 sin π = 30 and D(6) = 32. W(6) − D(6) = −2 < 0, so the amount is decreasing at t = 6.
        (C) A(12) = 200 + ∫ from 0 to 12 of (W(t) − D(t)) dt = 200 + 360 − [t² + 20t] from 0 to 12 = 200 + 360 − 384 = 176 gallons.
        (D) A′(t) = W(t) − D(t), which is positive for 0 ≤ t < 5.723 and negative for 5.723 < t ≤ 12 (for example A′(0) = 10 and A′(12) = −14). Candidates: A(0) = 200, A(5.723) ≈ 200 + 62.474 = 262.474, A(12) = 176. The greatest amount is about 262.474 gallons, at t ≈ 5.723 hours.
      explanation: |
        Six points. (A) 1 point: the average-value integral with 1/12 and the answer 30 gallons per hour. (B) 1 point: decreasing, supported by W(6) − D(6) = −2 < 0 (comparing the two rates, not the amounts). (C) 2 points: 1 for 200 + ∫ from 0 to 12 of (W − D) dt, 1 for 176 gallons. (D) 2 points: 1 for identifying A′ = W − D and using the critical point with the endpoints (candidates test) or the sign change of A′ from positive to negative at its only critical point, 1 for t ≈ 5.723 and about 262.474 gallons (accept 262.47 or 262.5 with work shown).
