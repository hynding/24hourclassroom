    - slug: apcalcab-u08-w31-q24
      type: long_answer
      topic_code: "8.4"
      source: "AP Calculus CED, Topic 8.4"
      points: 6
      prompt: |
        Let f(x) = 6x − x² and g(x) = x² − 2x. Let R be the region enclosed by the graphs of f and g.

        (A) Find the x-coordinates of the points where the graphs intersect, and find the area of R.

        (B) The vertical line x = k divides R into two regions of equal area. Write an equation involving an integral that k satisfies, and show that k = 2.

        (C) Find the average value of the vertical distance f(x) − g(x) between the graphs over the interval from part (A).

        (D) At what x is the vertical distance f(x) − g(x) greatest? Justify your answer.
      answer: |
        (A) 6x − x² = x² − 2x gives 2x² − 8x = 0, so x = 0 and x = 4. On (0, 4), f ≥ g (at x = 1, 5 > −1). Area = ∫ from 0 to 4 of (8x − 2x²) dx = [4x² − (2/3)x³] from 0 to 4 = 64 − 128/3 = 64/3.
        (B) ∫ from 0 to k of (8x − 2x²) dx = 32/3. With k = 2: 4(4) − (2/3)(8) = 16 − 16/3 = 32/3, so k = 2 works. (Also, 8x − 2x² is symmetric about x = 2.)
        (C) (1/(4 − 0)) · (64/3) = 16/3.
        (D) d(x) = 8x − 2x² has d′(x) = 8 − 4x, which is 0 at x = 2 and changes from positive to negative there. Since x = 2 is the only critical point on (0, 4), d has its absolute maximum there: the greatest distance is d(2) = 8, at x = 2.
      explanation: |
        Six points. (A) 2 points: 1 for x = 0 and x = 4, 1 for the area 64/3 from an integral of top − bottom. (B) 2 points: 1 for an equation setting the area from 0 to k equal to half the total (32/3), 1 for verifying k = 2. (C) 1 point: 16/3 from area divided by 4. (D) 1 point: x = 2 with a reason (d′ changes from positive to negative at the only critical point, or a candidates test comparing d(0) = d(4) = 0 with d(2) = 8).
