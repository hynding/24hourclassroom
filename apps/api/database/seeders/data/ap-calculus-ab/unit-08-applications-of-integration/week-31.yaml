      points: 3
      prompt: |
        Consider the graphs of y = x³ and y = 4x.

        (a) Find all points where the graphs intersect.
        (b) Write a sum of integrals, without absolute values, that gives the total area of the regions enclosed by the two graphs.
        (c) Find that total area.
      answer: |
        (a) x³ = 4x gives x(x − 2)(x + 2) = 0: the points (−2, −8), (0, 0) and (2, 8).
        (b) On [−2, 0], x³ ≥ 4x (at x = −1, −1 > −4); on [0, 2], 4x ≥ x³. Area = ∫ from −2 to 0 of (x³ − 4x) dx + ∫ from 0 to 2 of (4x − x³) dx.
