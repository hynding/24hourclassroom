      (B) Find the volume of the solid generated when R is revolved about the x-axis.

      (C) Write, but do not evaluate, an integral expression for the volume of the solid generated when R is revolved about the line y = 10.

      (D) R is the base of a solid whose cross sections perpendicular to the x-axis are semicircles with diameters in R. Find the volume of the solid.

      (E) Does the horizontal line y = 4 divide R into two regions of equal area? Justify your answer.
    answer: |
      (A) 8 − x² = x² at x = ±2, and f ≥ g on [−2, 2] (at x = 0, 8 > 0). Area = ∫ from −2 to 2 of (8 − 2x²) dx = 32 − 32/3 = 64/3.
      (B) Washers with R = 8 − x² and r = x²: (8 − x²)² − x⁴ = 64 − 16x², so V = π ∫ from −2 to 2 of (64 − 16x²) dx = π(256 − 256/3) = 512π/3.
      (C) The axis y = 10 is above R, so the lower curve g is farther: outer radius 10 − x², inner radius 10 − (8 − x²) = 2 + x². V = π ∫ from −2 to 2 of [(10 − x²)² − (2 + x²)²] dx.
      (D) Diameter s = 8 − 2x², area (π/8)s². V = (π/8) ∫ from −2 to 2 of (8 − 2x²)² dx = (π/8) ∫ from −2 to 2 of (64 − 32x² + 4x⁴) dx = (π/8)(256 − 512/3 + 256/5) = (π/8)(2048/15) = 256π/15.
      (E) Yes. f(x) − 4 = 4 − x² and 4 − g(x) = 4 − x², so at every x the part of the slice above y = 4 has the same length as the part below. Each part has area ∫ from −2 to 2 of (4 − x²) dx = 32/3, half of 64/3.
    explanation: |
      Nine points. (A) 2 points: 1 for the integral of (8 − 2x²) with limits −2 and 2, 1 for 64/3. (B) 2 points: 1 for the washer integrand π[(8 − x²)² − (x²)²], 1 for 512π/3. (C) 2 points: 1 for the outer radius 10 − x² and inner radius 2 + x² in the correct order, 1 for the complete expression with π, squares and limits. (D) 2 points: 1 for the semicircle area (π/8)(8 − 2x²)², 1 for 256π/15. (E) 1 point: yes, with a supporting argument (equal slice lengths above and below y = 4, or both areas computed as 32/3).
