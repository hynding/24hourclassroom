unit: 8
description: |
  45 questions · about 90 minutes · every topic of Unit 8 (8.1 to 8.12): average value, motion and accumulation
  in context, area between curves with vertical and horizontal slices and with several crossings, and volumes with
  known cross sections and by discs and washers about the axes and about other lines. Includes three shared-context
  sets (a cyclist's velocity table, one region and its solids, and one cubic and its accumulation function),
  select-all, true/false, fill-in-the-blank and numeric items, two short-answer questions (3 points each) and two
  free-response questions in the AP style (9 points each: one calculator-active rate-in/rate-out context, one
  no-calculator area and volume question). Items marked (Calculator.) need a graphing calculator; the rest are
  meant to be done by hand. Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the free-response items are graded by your teacher against
  the scoring notes.
questions:
  # ---- Stimulus set A: a cyclist's velocity table (8.2, 8.3, 8.1)
  - slug: apcalcab-u08-exam-q01
    type: multiple_choice
    topic_code: "8.2"
    source: "AP Calculus CED, Topic 8.2"
    points: 1
    stimulus: |
      A cyclist rides east along a straight road. Her velocity v(t), in metres per second, is a differentiable function of time t in seconds, with v(t) > 0 throughout. Selected values are shown; the data are hypothetical. At t = 0 she is 100 metres east of a signpost.

      | t (seconds) | 0 | 20 | 30 | 50 | 60 |
      |---|---|---|---|---|---|
      | v(t) (m/s) | 4 | 8 | 10 | 6 | 5 |
    prompt: |
      Using a trapezoidal sum with the four subintervals shown in the table, what is the approximate value of ∫ from 0 to 60 of v(t) dt?
    options:
      - "420"
      - "430"
      - "425"
      - "396"
    option_explanations:
      - |
        420 is the left Riemann sum: 20(4) + 10(8) + 20(10) + 10(6). A trapezoidal sum averages the two endpoint values on each subinterval.
      - |
        430 is the right Riemann sum: 20(8) + 10(10) + 20(6) + 10(5).
      - |
        Correct. 20(4 + 8)/2 + 10(8 + 10)/2 + 20(10 + 6)/2 + 10(6 + 5)/2 = 120 + 90 + 160 + 55 = 425.
      - |
        396 = 60 × 6.6 multiplies the plain average of the five table values by 60, ignoring that the subintervals have different widths.
    answer: 2
  - slug: apcalcab-u08-exam-q02
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Calculus CED, Topic 8.3"
    points: 1
    stimulus: |
      A cyclist rides east along a straight road. Her velocity v(t), in metres per second, is a differentiable function of time t in seconds, with v(t) > 0 throughout. Selected values are shown; the data are hypothetical. At t = 0 she is 100 metres east of a signpost.

      | t (seconds) | 0 | 20 | 30 | 50 | 60 |
      |---|---|---|---|---|---|
      | v(t) (m/s) | 4 | 8 | 10 | 6 | 5 |
    prompt: |
      Using the trapezoidal approximation ∫ from 0 to 60 of v(t) dt ≈ 425, approximately how far east of the signpost is the cyclist at t = 60?
    options:
      - "525 metres"
      - "425 metres"
      - "105 metres"
      - "325 metres"
    option_explanations:
      - |
        Correct. Position = starting position + displacement = 100 + ∫ from 0 to 60 of v(t) dt ≈ 100 + 425 = 525 metres east.
      - |
        425 metres is how far she rode, the displacement. She started 100 metres east of the signpost, so add 100.
      - |
        105 = 100 + v(60) adds a velocity in m/s to a position in metres.
      - |
        325 = 425 − 100 subtracts the starting position. She is moving east from a point already east of the signpost, so the distances add.
    answer: 0
  - slug: apcalcab-u08-exam-q03
    type: multiple_choice
    topic_code: "8.1"
    source: "AP Calculus CED, Topic 8.1"
    points: 1
    stimulus: |
      A cyclist rides east along a straight road. Her velocity v(t), in metres per second, is a differentiable function of time t in seconds, with v(t) > 0 throughout. Selected values are shown; the data are hypothetical. At t = 0 she is 100 metres east of a signpost.

      | t (seconds) | 0 | 20 | 30 | 50 | 60 |
      |---|---|---|---|---|---|
      | v(t) (m/s) | 4 | 8 | 10 | 6 | 5 |
    prompt: |
      Which is the best estimate of the cyclist's average velocity over 0 ≤ t ≤ 60?
    options:
      - "(4 + 5)/2 = 4.5 m/s"
      - "(5 − 4)/60 ≈ 0.017 m/s"
      - "(4 + 8 + 10 + 6 + 5)/5 = 6.6 m/s"
      - "425/60 ≈ 7.08 m/s"
    option_explanations:
      - |
        This averages only the first and last velocities. Average velocity is the average value of v over the whole interval.
      - |
        (v(60) − v(0))/60 is the average acceleration, in metres per second per second.
      - |
        The table's intervals are unequal (20, 10, 20 and 10 seconds), so a plain average of the listed values weights them wrongly.
      - |
        Correct. Average velocity = (1/60) ∫ from 0 to 60 of v(t) dt ≈ 425/60 ≈ 7.08 metres per second.
    answer: 3
  - slug: apcalcab-u08-exam-q04
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Calculus CED, Topic 8.3"
    points: 1
    stimulus: |
      A cyclist rides east along a straight road. Her velocity v(t), in metres per second, is a differentiable function of time t in seconds, with v(t) > 0 throughout. Selected values are shown; the data are hypothetical. At t = 0 she is 100 metres east of a signpost.

      | t (seconds) | 0 | 20 | 30 | 50 | 60 |
      |---|---|---|---|---|---|
      | v(t) (m/s) | 4 | 8 | 10 | 6 | 5 |
    prompt: |
      Which is the best interpretation of (1/30) ∫ from 20 to 50 of v(t) dt?
    options:
      - "The average acceleration of the cyclist, in metres per second per second, over 20 ≤ t ≤ 50"
      - "The average velocity of the cyclist, in metres per second, over 20 ≤ t ≤ 50"
      - "The distance, in metres, the cyclist travels between t = 20 and t = 50"
      - "The change in the cyclist's velocity, in metres per second, between t = 20 and t = 50"
    option_explanations:
      - |
        Average acceleration would be (v(50) − v(20))/30. Integrating v and dividing by the interval length averages the velocity itself.
      - |
        Correct. Dividing the integral of v over [20, 50] by the length 30 gives the average value of v there: an average velocity in metres per second.
      - |
        The distance is ∫ from 20 to 50 of v(t) dt alone (v > 0). The factor 1/30 turns that distance into an average rate.
      - |
        The change in velocity is v(50) − v(20) = ∫ from 20 to 50 of v′(t) dt, an integral of acceleration, not of velocity.
    answer: 1
  # ---- Stimulus set B: one region and its solids (8.4, 8.11, 8.12, 8.7)
  - slug: apcalcab-u08-exam-q05
    type: multiple_choice
    topic_code: "8.4"
    source: "AP Calculus CED, Topic 8.4"
    points: 1
    stimulus: |
      Let R be the region enclosed by the graphs of y = 4x − x² and y = x. The graphs intersect at (0, 0) and (3, 3), and 4x − x² ≥ x for 0 ≤ x ≤ 3.
    prompt: |
      What is the area of R?
    options:
      - "9"
      - "9/2"
      - "8/3"
      - "−9/2"
    option_explanations:
      - |
        9 = ∫ from 0 to 3 of (4x − x²) dx is the area under the parabola only; the area under y = x must be subtracted.
      - |
        Correct. ∫ from 0 to 3 of [(4x − x²) − x] dx = ∫ from 0 to 3 of (3x − x²) dx = 27/2 − 9 = 9/2.
      - |
        8/3 uses x = 4, the parabola's zero, as the upper limit. The region ends where the curves meet, at x = 3.
      - |
        −9/2 is bottom minus top. An area must be positive.
    answer: 1
  - slug: apcalcab-u08-exam-q06
    type: multiple_choice
    topic_code: "8.11"
    source: "AP Calculus CED, Topic 8.11"
    points: 1
    stimulus: |
      Let R be the region enclosed by the graphs of y = 4x − x² and y = x. The graphs intersect at (0, 0) and (3, 3), and 4x − x² ≥ x for 0 ≤ x ≤ 3.
    prompt: |
      Which integral gives the volume of the solid generated when R is revolved about the x-axis?
    options:
      - "π ∫ from 0 to 3 of (3x − x²)² dx"
      - "π ∫ from 0 to 3 of [x² − (4x − x²)²] dx"
      - "π ∫ from 0 to 4 of [(4x − x²)² − x²] dx"
      - "π ∫ from 0 to 3 of [(4x − x²)² − x²] dx"
    option_explanations:
      - |
        (3x − x²)² is the squared difference of the radii. A washer's area is πR² − πr².
      - |
        The radii are swapped: the parabola is farther from the x-axis, so (4x − x²)² is the outer term. As written the integral is negative.
      - |
        The upper limit 4 is where the parabola meets the x-axis, not where the two curves meet (x = 3).
      - |
        Correct. Washers with outer radius 4x − x² and inner radius x, for x from 0 to 3.
    answer: 3
  - slug: apcalcab-u08-exam-q07
    type: multiple_choice
    topic_code: "8.12"
    source: "AP Calculus CED, Topic 8.12"
    points: 1
    stimulus: |
      Let R be the region enclosed by the graphs of y = 4x − x² and y = x. The graphs intersect at (0, 0) and (3, 3), and 4x − x² ≥ x for 0 ≤ x ≤ 3.
    prompt: |
      Which integral gives the volume of the solid generated when R is revolved about the line y = −2?
    options:
      - "π ∫ from 0 to 3 of [(4x − x² + 2)² − (x + 2)²] dx"
      - "π ∫ from 0 to 3 of [(4x − x² − 2)² − (x − 2)²] dx"
      - "π ∫ from 0 to 3 of [(4x − x² + 2) − (x + 2)]² dx"
      - "π ∫ from 0 to 3 of [(x + 2)² − (4x − x² + 2)²] dx"
    option_explanations:
      - |
        Correct. The axis y = −2 is below R, so each radius is the curve's height plus 2: outer 4x − x² + 2, inner x + 2.
      - |
        Subtracting 2 measures from y = 2. The distance from y = −2 up to height h is h + 2.
      - |
        This squares the difference of the radii, which simplifies to π(3x − x²)²; washers need R² − r².
      - |
        Outer and inner are swapped, so the integral is negative. The parabola is farther from y = −2.
    answer: 0
  - slug: apcalcab-u08-exam-q08
    type: multiple_choice
    topic_code: "8.7"
    source: "AP Calculus CED, Topic 8.7"
    points: 1
    stimulus: |
      Let R be the region enclosed by the graphs of y = 4x − x² and y = x. The graphs intersect at (0, 0) and (3, 3), and 4x − x² ≥ x for 0 ≤ x ≤ 3.
    prompt: |
      R is the base of a solid whose cross sections perpendicular to the x-axis are squares. What is the volume of the solid?
    options:
      - "81/4"
      - "81π/10"
      - "81/10"
      - "9/2"
    option_explanations:
      - |
        81/4 = (9/2)² squares the area of the base instead of squaring each slice.
      - |
        Square cross sections have no factor π; π belongs to circular slices.
      - |
        Correct. The side is (4x − x²) − x = 3x − x², so V = ∫ from 0 to 3 of (3x − x²)² dx = ∫ (9x² − 6x³ + x⁴) dx = 81 − 243/2 + 243/5 = 81/10.
      - |
        9/2 is the area of the base R. Each square's area (3x − x²)² must be integrated.
    answer: 2
  # ---- Stimulus set C: one cubic and its accumulation function (8.6, 8.1, 8.3)
  - slug: apcalcab-u08-exam-q09
    type: multiple_choice
    topic_code: "8.6"
    source: "AP Calculus CED, Topic 8.6"
    points: 1
    stimulus: |
      Let f(x) = x³ − 6x² + 8x = x(x − 2)(x − 4). An antiderivative is F(x) = x⁴/4 − 2x³ + 4x², with F(0) = 0, F(2) = 4 and F(4) = 0. Let A(x) = ∫ from 0 to x of f(t) dt for 0 ≤ x ≤ 4.
    prompt: |
      What is the total area of the regions between the graph of f and the x-axis for 0 ≤ x ≤ 4?
    options:
      - "0"
      - "4"
      - "−4"
      - "8"
    option_explanations:
      - |
        0 = F(4) − F(0) is the net integral: the region above the axis on (0, 2) cancels the region below on (2, 4).
      - |
        4 is the area of the region on [0, 2] only. There is a second region, below the axis, on [2, 4].
      - |
        −4 = ∫ from 2 to 4 of f(x) dx is the signed integral over the lower piece; an area is never negative and there are two pieces.
      - |
        Correct. f ≥ 0 on [0, 2] and f ≤ 0 on [2, 4]. Area = (F(2) − F(0)) + |F(4) − F(2)| = 4 + 4 = 8.
    answer: 3
  - slug: apcalcab-u08-exam-q10
    type: multiple_choice
    topic_code: "8.1"
    source: "AP Calculus CED, Topic 8.1"
    points: 1
    stimulus: |
      Let f(x) = x³ − 6x² + 8x = x(x − 2)(x − 4). An antiderivative is F(x) = x⁴/4 − 2x³ + 4x², with F(0) = 0, F(2) = 4 and F(4) = 0. Let A(x) = ∫ from 0 to x of f(t) dt for 0 ≤ x ≤ 4.
    prompt: |
      What is the average value of f on the interval [0, 4]?
    options:
      - "2"
      - "0"
      - "8"
      - "4"
    option_explanations:
      - |
        2 divides the total area 8 by 4. The average value uses the signed integral, which is 0.
      - |
        Correct. (1/(4 − 0)) ∫ from 0 to 4 of f(x) dx = (1/4)(F(4) − F(0)) = (1/4)(0) = 0.
      - |
        8 is the total area, neither divided by the interval length nor signed.
      - |
        4 = ∫ from 0 to 2 of f(x) dx covers half the interval and is not divided by its length.
    answer: 1
  - slug: apcalcab-u08-exam-q11
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Calculus CED, Topic 8.3"
    points: 1
    stimulus: |
      Let f(x) = x³ − 6x² + 8x = x(x − 2)(x − 4). An antiderivative is F(x) = x⁴/4 − 2x³ + 4x², with F(0) = 0, F(2) = 4 and F(4) = 0. Let A(x) = ∫ from 0 to x of f(t) dt for 0 ≤ x ≤ 4.
    prompt: |
      At which value of x in [0, 4] does A attain its absolute maximum?
    options:
      - "x = 4"
      - "x = 2 − 2/√3 ≈ 0.845"
      - "x = 2"
      - "x = 0"
    option_explanations:
      - |
        A(4) = 0: after x = 2 the integrand is negative, so A decreases back to 0.
      - |
        This is where f itself has its relative maximum (f′ = 0). A is largest where f, its derivative, changes from positive to negative.
      - |
        Correct. A′(x) = f(x) changes from positive to negative at x = 2. Candidates: A(0) = 0, A(2) = 4, A(4) = 0, so the maximum is 4 at x = 2.
      - |
        A(0) = 0 is the smallest value (tied with A(4)). A increases on (0, 2) because f > 0 there.
    answer: 2
  # ---- Average value, motion and accumulation (8.1–8.3)
  - slug: apcalcab-u08-exam-q12
    type: multiple_choice
    topic_code: "8.1"
    source: "AP Calculus CED, Topic 8.1"
    points: 1
    prompt: |
      What is the average value of g(x) = √x on the interval [0, 4]?
    options:
      - "4/3"
      - "16/3"
      - "1"
      - "√2"
    option_explanations:
      - |
        Correct. (1/4) ∫ from 0 to 4 of x^(1/2) dx = (1/4)(2/3)(4^(3/2)) = (1/4)(16/3) = 4/3.
      - |
        16/3 is the integral; divide by the interval length 4.
      - |
        1 averages the endpoint values g(0) = 0 and g(4) = 2, which works only for linear functions.
      - |
        √2 is g at the midpoint x = 2. For a concave function the midpoint value is not the average value.
    answer: 0
  - slug: apcalcab-u08-exam-q13
    type: multiple_choice
    topic_code: "8.1"
    source: "AP Calculus CED, Topic 8.1"
    points: 1
    prompt: |
      Let h(x) = 2x + 1. For what value of c in [1, 3] does h(c) equal the average value of h on [1, 3]?
    options:
      - "c = 5"
      - "c = 4.5"
      - "c = 3"
      - "c = 2"
    option_explanations:
      - |
        5 is the average value itself, h(c), not the input c. Also 5 is not in [1, 3].
      - |
        4.5 solves 2c + 1 = 10, using the integral 10 without dividing by the interval length 2.
      - |
        c = 3 gives h(3) = 7, the maximum of h on the interval, not its average.
      - |
        Correct. Average value = (1/2) ∫ from 1 to 3 of (2x + 1) dx = (1/2)[x² + x] from 1 to 3 = (1/2)(12 − 2) = 5, and 2c + 1 = 5 gives c = 2.
    answer: 3
  - slug: apcalcab-u08-exam-q14
    type: multiple_choice
    topic_code: "8.2"
    source: "AP Calculus CED, Topic 8.2"
    points: 1
    prompt: |
      A particle moves along a line with velocity v(t) = 3t² − 12 for 0 ≤ t ≤ 3. What is the total distance it travels?
    options:
      - "9"
      - "23"
      - "−9"
      - "16"
    option_explanations:
      - |
        9 is the size of the displacement, |∫ from 0 to 3 of v(t) dt|. The particle turns around at t = 2, so the pieces must be added as absolute values.
      - |
        Correct. v = 3(t² − 4) changes sign at t = 2. ∫ from 0 to 2 of v dt = 8 − 24 = −16 and ∫ from 2 to 3 of v dt = (27 − 36) − (8 − 24) = 7. Distance = 16 + 7 = 23.
      - |
        −9 is the displacement. A distance cannot be negative.
      - |
        16 is the distance until the particle turns at t = 2; it travels another 7 units on [2, 3].
    answer: 1
  - slug: apcalcab-u08-exam-q15
    type: multiple_choice
    topic_code: "8.2"
    source: "AP Calculus CED, Topic 8.2"
    points: 1
    prompt: |
      A particle moves along a line with velocity v(t) = 2t + 1. Its position at t = 1 is x(1) = 3. What is x(4)?
    options:
      - "18"
      - "23"
      - "21"
      - "9"
    option_explanations:
      - |
        18 = ∫ from 1 to 4 of (2t + 1) dt is the displacement; add the position 3 at t = 1.
      - |
        23 = 3 + ∫ from 0 to 4 of (2t + 1) dt starts the integral at t = 0, but the known position is at t = 1.
      - |
        Correct. x(4) = x(1) + ∫ from 1 to 4 of (2t + 1) dt = 3 + [t² + t] from 1 to 4 = 3 + (20 − 2) = 21.
      - |
        9 is the velocity v(4) = 2(4) + 1, a rate in units per time, not a position.
    answer: 2
  - slug: apcalcab-u08-exam-q16
    type: multiple_choice
    topic_code: "8.2"
    source: "AP Calculus CED, Topic 8.2"
    points: 1
    prompt: |
      (Calculator.) A particle moves along a line with velocity v(t) = cos(t²) for 0 ≤ t ≤ 2. What is the total distance the particle travels, to three decimal places?
    options:
      - "0.461"
      - "1.493"
      - "1.091"
      - "0.654"
    option_explanations:
      - |
        0.461 ≈ ∫ from 0 to 2 of cos(t²) dt is the displacement. v changes sign at t = √(π/2) ≈ 1.253 (the next sign change, at √(3π/2) ≈ 2.171, lies outside the interval), so integrate |v|.
      - |
        Correct. Total distance = ∫ from 0 to 2 of |cos(t²)| dt ≈ 1.493.
      - |
        1.091 ≈ ∫ from 0 to 2 of |cos t| dt drops the square inside the cosine; the velocity is cos(t²), not cos t.
      - |
        0.654 is |v(2)| = |cos 4|, a speed at one instant, not a distance.
    answer: 1
  - slug: apcalcab-u08-exam-q17
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Calculus CED, Topic 8.3"
    points: 1
    prompt: |
      People enter a hypothetical stadium at a rate of E(t) people per hour and leave at a rate of L(t) people per hour, where t is hours after the gates open. There are 300 people inside when the gates open. Which expression gives the number of people inside at time t = T?
    options:
      - "∫ from 0 to T of (E(t) − L(t)) dt"
      - "300 + E(T) − L(T)"
      - "300 + ∫ from 0 to T of (L(t) − E(t)) dt"
      - "300 + ∫ from 0 to T of (E(t) − L(t)) dt"
    option_explanations:
      - |
        This is only the net change in the crowd since the gates opened; the 300 people already inside must be added.
      - |
        E(T) − L(T) is the net rate at time T, in people per hour, and cannot be added to a number of people.
      - |
        L − E is the rate at which the crowd shrinks; it reverses the sign of the change.
      - |
        Correct. Initial amount plus the integral of (rate in − rate out) from 0 to T.
    answer: 3
  - slug: apcalcab-u08-exam-q18
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Calculus CED, Topic 8.3"
    points: 1
    prompt: |
      Water flows into and out of a hypothetical tank for 0 ≤ t ≤ 8 hours. The rate in minus the rate out, E(t) − L(t), is continuous, positive for 0 < t < 5, zero at t = 5, and negative for 5 < t < 8. At what time is the amount of water in the tank greatest?
    options:
      - "t = 5"
      - "t = 8"
      - "t = 0"
      - "It cannot be determined without the amount at t = 0."
    option_explanations:
      - |
        Correct. The amount's derivative E − L changes from positive to negative at t = 5, its only critical point, so the amount rises until t = 5 and falls afterwards: t = 5 gives the absolute maximum.
      - |
        After t = 5 water leaves faster than it enters, so the amount decreases on (5, 8); t = 8 cannot be the maximum.
      - |
        The amount increases on (0, 5), so it is larger at t = 5 than at t = 0.
      - |
        The initial amount shifts every value by the same constant; it does not change when the maximum occurs.
    answer: 0
  # ---- Area between curves (8.4–8.6)
  - slug: apcalcab-u08-exam-q19
    type: multiple_choice
    topic_code: "8.4"
    source: "AP Calculus CED, Topic 8.4"
    points: 1
    prompt: |
      What is the area of the region bounded by y = eˣ, y = x, x = 0 and x = 1?
    options:
      - "e − 1/2"
      - "3/2 − e"
      - "e − 3/2"
      - "e − 1"
    option_explanations:
      - |
        e − 1/2 forgets to subtract e⁰ = 1 at the lower limit.
      - |
        3/2 − e is bottom minus top: eˣ > x on [0, 1], so this is negative.
      - |
        Correct. ∫ from 0 to 1 of (eˣ − x) dx = [eˣ − x²/2] from 0 to 1 = (e − 1/2) − 1 = e − 3/2.
      - |
        e − 1 = ∫ from 0 to 1 of eˣ dx is the area under the top curve only.
    answer: 2
  - slug: apcalcab-u08-exam-q20
    type: multiple_choice
    topic_code: "8.5"
    source: "AP Calculus CED, Topic 8.5"
    points: 1
    prompt: |
      What is the area of the region enclosed by the curve x = y² − 4 and the y-axis?
    options:
      - "−32/3"
      - "16/3"
      - "32/3"
      - "16"
    option_explanations:
      - |
        −32/3 is left minus right: ∫ (y² − 4) dy. The y-axis, x = 0, is the right boundary.
      - |
        16/3 covers only 0 ≤ y ≤ 2. The curve meets the y-axis at y = −2 and y = 2.
      - |
        Correct. y² − 4 = 0 at y = ±2. ∫ from −2 to 2 of [0 − (y² − 4)] dy = ∫ from −2 to 2 of (4 − y²) dy = 16 − 16/3 = 32/3.
      - |
        16 is the 4-by-4 rectangle from x = −4 to 0 and y = −2 to 2; the curved part outside the region was not subtracted.
    answer: 2
