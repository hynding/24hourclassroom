  # ---- Short answers (3 points each)
  - slug: apcalcab-u08-exam-q42
    type: short_answer
    topic_code: "8.8"
    source: "AP Calculus CED, Topic 8.8"
    points: 3
    prompt: |
      The base of a solid is the triangle bounded by the line y = 3 − x and the coordinate axes.

      (a) Cross sections perpendicular to the x-axis are squares. Find the volume.
      (b) Cross sections perpendicular to the x-axis are semicircles with diameters in the base. Find the volume.
      (c) Cross sections perpendicular to the y-axis are isosceles right triangles with the hypotenuse in the base. Find the volume.
    answer: |
      (a) Side 3 − x: V = ∫ from 0 to 3 of (3 − x)² dx = 9.
      (b) A(x) = (π/8)(3 − x)²: V = (π/8)(9) = 9π/8.
      (c) At height y the base runs from x = 0 to x = 3 − y, so the hypotenuse is s = 3 − y and A(y) = s²/4. V = (1/4) ∫ from 0 to 3 of (3 − y)² dy = 9/4.
    explanation: |
      Three points, one per part. (a) 9. (b) the semicircle area (π/8)s² and 9π/8. (c) the hypotenuse area formula s²/4 (legs s/√2) in terms of y, and 9/4.
  - slug: apcalcab-u08-exam-q43
    type: short_answer
    topic_code: "8.6"
    source: "AP Calculus CED, Topic 8.6"
    points: 3
    prompt: |
      Consider the curve x = y³ − 4y and the y-axis.

      (a) Find the y-values where the curve meets the y-axis.
      (b) Write a sum of integrals with respect to y, without absolute values, for the total area of the regions enclosed by the curve and the y-axis.
      (c) Find that total area.
    answer: |
      (a) y³ − 4y = y(y − 2)(y + 2) = 0: y = −2, 0, 2.
      (b) On [−2, 0], y³ − 4y ≥ 0 (at y = −1, x = 3), so the curve is to the right of the y-axis; on [0, 2] it is to the left (at y = 1, x = −3). Area = ∫ from −2 to 0 of (y³ − 4y) dy + ∫ from 0 to 2 of (4y − y³) dy.
      (c) Each integral is 4 (for example ∫ from 0 to 2 of (4y − y³) dy = 8 − 4 = 4), so the total area is 8.
    explanation: |
      Three points, one per part. (a) all three y-values. (b) two integrals in y, each right − left. (c) 8.
  # ---- Free response (9 points each)
  - slug: apcalcab-u08-exam-q44
    type: long_answer
    topic_code: "8.3"
    source: "AP Calculus CED, Topic 8.3"
    points: 9
    prompt: |
      (Calculator.) A hypothetical stormwater retention pond holds 500 cubic metres of water at time t = 0, where t is measured in hours. For 0 ≤ t ≤ 10, rainwater flows into the pond at a rate of R(t) = 40 + 25 sin(0.4t) cubic metres per hour, and water is pumped out at a rate of P(t) = 30 + 2t cubic metres per hour.

      (A) Find the average rate at which rainwater flows into the pond over 0 ≤ t ≤ 10. Show the setup.

      (B) Using correct units, explain the meaning of ∫ from 2 to 5 of R(t) dt in the context of this problem.

      (C) Is the amount of water in the pond increasing or decreasing at time t = 6? Give a reason for your answer.

      (D) How much water is in the pond at time t = 10?

      (E) At what time t, for 0 ≤ t ≤ 10, is the amount of water in the pond greatest? Find that greatest amount, and justify your answer.
    answer: |
      (A) (1/10) ∫ from 0 to 10 of R(t) dt ≈ 503.353/10 ≈ 50.335 cubic metres per hour.
      (B) ∫ from 2 to 5 of R(t) dt (≈ 189.553) is the total volume of rainwater, in cubic metres, that flows into the pond between t = 2 and t = 5 hours.
      (C) R(6) − P(6) ≈ 56.887 − 42 ≈ 14.887 > 0, so the amount of water is increasing at t = 6.
      (D) W(10) = 500 + ∫ from 0 to 10 of (R(t) − P(t)) dt ≈ 500 + 503.353 − 400 = 603.353 cubic metres.
      (E) W′(t) = R(t) − P(t) = 0 at t ≈ 7.376 (the only zero in the interval); W′ > 0 before it and W′ < 0 after it. Candidates: W(0) = 500, W(7.376) = 500 + ∫ from 0 to 7.376 of (R(t) − P(t)) dt ≈ 643.216, W(10) ≈ 603.353. The greatest amount is about 643.216 cubic metres, at t ≈ 7.376 hours.
    explanation: |
      Nine points. (A) 2 points: 1 for (1/10) ∫ from 0 to 10 of R(t) dt, 1 for 50.335 (accept 50.33 or 50.34) with units. (B) 1 point: total amount of rainwater entering, in cubic metres, between t = 2 and t = 5 (all three of quantity, units and interval needed). (C) 1 point: increasing, with R(6) − P(6) > 0 (or R(6) > P(6)) as the reason. (D) 2 points: 1 for 500 + ∫ from 0 to 10 of (R − P) dt, 1 for 603.353. (E) 3 points: 1 for setting R(t) − P(t) = 0 and finding t ≈ 7.376, 1 for a candidates test (or a sign-change argument for the only critical point), 1 for the greatest amount 643.216 (accept 643.21 or 643.22).
  - slug: apcalcab-u08-exam-q45
