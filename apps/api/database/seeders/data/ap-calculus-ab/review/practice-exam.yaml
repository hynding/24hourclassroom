      (c) Find all points on the curve at which the tangent line is vertical.
    answer: |
      (a) Differentiate implicitly: 2x + y + x(dy/dx) + 2y(dy/dx) = 0, so (x + 2y)(dy/dx) = −(2x + y) and dy/dx = −(2x + y)/(x + 2y).
