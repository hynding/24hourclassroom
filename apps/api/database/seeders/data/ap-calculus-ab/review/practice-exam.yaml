      Three points. 1 point for (a): implicit differentiation with the product rule on xy, solved for dy/dx. 1 point for (b): both points (1, −2) and (−1, 2), from setting the numerator to 0 and substituting into the curve. 1 point for (c): both points (−2, 1) and (2, −1), from setting the denominator to 0 and substituting. A point found but not shown to lie on the curve earns no credit.
