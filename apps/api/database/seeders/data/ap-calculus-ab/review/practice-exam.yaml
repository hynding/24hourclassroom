week: 34
description: |
  A full practice final: 70 questions · about 4 hours · all eight units. Questions 1–48 are a mock AP
  Calculus AB exam in the May 2027 format. The real exam is a hybrid digital exam on Monday, May 10, 2027
  (2027-05-10), session 1: multiple-choice answers are entered in the Bluebook app and free responses are
  handwritten in a paper booklet. Section I is 42 multiple-choice questions in 1 hour 40 minutes, 50% of the
  score: Part A, questions 1–29, no calculator (62 minutes); Part B, questions 30–42, graphing calculator
  required (38 minutes; marked "(Calculator.)"). Section II is six free-response questions in 1 hour 30
  minutes, 50% of the score: Part A, questions 43–44, graphing calculator required (30 minutes: a
  rate-in/rate-out basin and a table of a cyclist's velocities); Part B, questions 45–48, no calculator (60
  minutes: particle motion, a graph of f′, a differential equation with a slope field, and an area and volume
  question). Questions 49–70 (about 45 minutes) are not AP format: select-all, true/false, fill-in-the-blank,
  numeric and short-answer practice across all eight units, opening with a shared-context set on a table of
  values of f, f′, g and g′. Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the short answers (3 points each) and the six
  free-response questions (9 points each, scored like the AP exam) are graded by your teacher against the
  scoring notes. Keep the calculator in radian mode and give decimal answers to three decimal places.
questions:
  # ---- Section I, Part A: no calculator (q01-q29).
  - slug: apcalcab-final-q01
    type: multiple_choice
    topic_code: "1.6"
    source: "AP Calculus CED, Topic 1.6"
    points: 1
    prompt: |
      What is lim (x→3) (x² − 9)/(x² − x − 6)?
    options:
      - "0"
      - "1"
      - "6/5"
      - "The limit does not exist."
    option_explanations:
      - |
        This substitutes x = 3 into the numerator only and stops; the denominator is also 0, so the 0/0 form needs factoring, not a value of 0.
      - |
        1 is the ratio of the leading coefficients, which gives a limit as x → ∞, not as x → 3.
      - |
        Correct. Both factor: (x − 3)(x + 3)/((x − 3)(x + 2)) = (x + 3)/(x + 2) for x ≠ 3, and this tends to 6/5 as x → 3.
      - |
        Direct substitution gives 0/0, which is indeterminate, not a sign that the limit fails to exist; after cancelling x − 3 the limit is 6/5.
    answer: 2
  - slug: apcalcab-final-q02
    type: multiple_choice
    topic_code: "1.15"
    source: "AP Calculus CED, Topic 1.15"
    points: 1
    prompt: |
      What is lim (x→∞) (4x³ − x)/(5 − 2x³)?
    options:
      - "−2"
      - "2"
      - "4/5"
      - "0"
    option_explanations:
      - |
        Correct. Divide numerator and denominator by x³: (4 − 1/x²)/(5/x³ − 2) → 4/(−2) = −2.
      - |
        This takes the ratio of the leading coefficients as 4/2 and drops the negative sign on −2x³.
      - |
        This divides the first written term of each polynomial, 4x³ by 5, instead of comparing the highest-degree terms 4x³ and −2x³.
      - |
        A limit at infinity of 0 needs the denominator's degree to be higher; here both have degree 3, so the limit is the ratio of leading coefficients.
    answer: 0
  - slug: apcalcab-final-q03
    type: multiple_choice
    topic_code: "1.12"
    source: "AP Calculus CED, Topic 1.12"
    points: 1
    prompt: |
      The function f is defined by f(x) = kx + 1 for x < 2 and f(x) = x² − k for x ≥ 2. For what value of k is f continuous at x = 2?
    options:
      - "3/2"
      - "3"
      - "5/3"
      - "1"
    option_explanations:
      - |
        This drops the −k from the right-hand piece, solving 2k + 1 = 4.
      - |
        This is a sign slip moving k across: 2k + 1 = 4 + k gives k = 3.
      - |
        This moves the 1 to the wrong side: 3k = 4 + 1 gives 5/3; the correct step is 3k = 4 − 1.
      - |
        Correct. Continuity needs the one-sided limits to agree with f(2): 2k + 1 = 4 − k, so 3k = 3 and k = 1.
    answer: 3
  - slug: apcalcab-final-q04
    type: multiple_choice
    topic_code: "1.16"
    source: "AP Calculus CED, Topic 1.16"
    points: 1
    prompt: |
      The function f is continuous on [1, 5], with f(1) = 4 and f(5) = −2. Which statement must be true?
    options:
      - "f′(c) = −3/2 for at least one c in (1, 5)."
      - "f(c) = 0 for at least one c in (1, 5)."
      - "The maximum value of f on [1, 5] is 4."
      - "f(3) = 1."
    option_explanations:
      - |
        This is the Mean Value Theorem's conclusion, which needs f to be differentiable on (1, 5); only continuity is given.
      - |
        Correct. f is continuous on [1, 5] and 0 lies between f(1) = 4 and f(5) = −2, so the Intermediate Value Theorem guarantees such a c.
      - |
        Continuity guarantees a maximum exists, but f could rise above 4 between x = 1 and x = 5.
      - |
        This assumes f is linear, taking the midpoint value; a continuous function need not pass through (3, 1).
    answer: 1
  - slug: apcalcab-final-q05
    type: multiple_choice
    topic_code: "2.2"
    source: "AP Calculus CED, Topic 2.2"
    points: 1
    prompt: |
      What is lim (h→0) ((2 + h)³ − 8)/h?
    options:
      - "8"
      - "12"
      - "6"
      - "0"
    option_explanations:
      - |
        8 is the value 2³ of the function at x = 2, not its derivative there.
      - |
        Correct. This is the definition of the derivative of x³ at x = 2, so it equals 3(2)² = 12.
      - |
        This differentiates x³ as 3x instead of 3x², giving 3 · 2 = 6.
      - |
        Substituting h = 0 gives 0/0, which is indeterminate; the expression is a difference quotient whose limit is the derivative.
    answer: 1
  - slug: apcalcab-final-q06
    type: multiple_choice
    topic_code: "2.4"
    source: "AP Calculus CED, Topic 2.4"
    points: 1
    prompt: |
      Let f(x) = x² + 1 for x ≤ 2 and f(x) = 4x − 3 for x > 2. Which statement about f at x = 2 is true?
    options:
      - "f is continuous but not differentiable at x = 2."
      - "f is not continuous at x = 2."
      - "f is differentiable but not continuous at x = 2."
      - "f is continuous and differentiable at x = 2."
    option_explanations:
      - |
        This assumes a piecewise function must have a corner at the join; here the left slope 2(2) = 4 matches the right slope 4.
      - |
        Both pieces give 5 at x = 2: 2² + 1 = 5 and 4(2) − 3 = 5, so the one-sided limits agree with f(2).
      - |
        Differentiability implies continuity, so this combination can never happen for any function.
      - |
        Correct. Both pieces equal 5 at x = 2, so f is continuous, and both one-sided derivatives equal 4 (2x at x = 2, and the slope 4), so f is differentiable.
    answer: 3
  - slug: apcalcab-final-q07
    type: multiple_choice
    topic_code: "2.8"
    source: "AP Calculus CED, Topic 2.8"
    points: 1
    prompt: |
      If y = x² sin x, what is the value of dy/dx at x = π?
    options:
      - "−π²"
      - "π²"
      - "−2π"
      - "0"
    option_explanations:
      - |
        Correct. dy/dx = 2x sin x + x² cos x; at x = π this is 2π · 0 + π² · (−1) = −π².
      - |
        This takes cos π as 1 instead of −1 in the term x² cos x.
      - |
        This multiplies the two derivatives, 2x · cos x, instead of using the product rule.
      - |
        This keeps only the term 2x sin x, which is 0 at π, and forgets the term x² cos x.
    answer: 0
  - slug: apcalcab-final-q08
    type: multiple_choice
    topic_code: "2.9"
    source: "AP Calculus CED, Topic 2.9"
    points: 1
    prompt: |
      If y = (3x + 1)/(x − 2), what is the value of dy/dx at x = 3?
    options:
      - "7"
      - "3"
      - "−7"
      - "13"
    option_explanations:
      - |
        This reverses the numerator of the quotient rule, computing (3x + 1)(1) − 3(x − 2).
      - |
        This divides the derivative of the numerator by the derivative of the denominator, 3/1, which is not the quotient rule.
      - |
        Correct. dy/dx = (3(x − 2) − (3x + 1)(1))/(x − 2)² = −7/(x − 2)²; at x = 3 this is −7/1 = −7.
      - |
        This adds the two products in the numerator, 3(1) + 10(1), instead of subtracting them.
    answer: 2
  - slug: apcalcab-final-q09
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Calculus CED, Topic 3.1"
    points: 1
    prompt: |
      If f(x) = e^(x² − 3x), what is f′(3)?
    options:
      - "1"
      - "−3"
      - "e³"
      - "3"
    option_explanations:
      - |
        This forgets the chain rule factor 2x − 3 and reports e⁰ = 1.
      - |
        This differentiates the exponent as 3 − 2x, a sign slip in the inner derivative.
      - |
        This replaces the exponent by its derivative, writing e^(2x − 3), instead of multiplying by it.
      - |
        Correct. f′(x) = e^(x² − 3x) · (2x − 3); at x = 3 the exponent is 0, so f′(3) = 1 · 3 = 3.
    answer: 3
  - slug: apcalcab-final-q10
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Calculus CED, Topic 3.2"
    points: 1
    prompt: |
      The point (−1, 2) lies on the curve x² − xy + y² = 7. What is the slope of the tangent line to the curve at (−1, 2)?
    options:
      - "2/3"
      - "4/5"
      - "−4/5"
      - "1"
    option_explanations:
      - |
        This differentiates xy as dy/dx alone, missing the product rule term y: 2x − dy/dx + 2y dy/dx = 0 gives 2/3.
      - |
        Correct. 2x − y − x(dy/dx) + 2y(dy/dx) = 0, so dy/dx = (y − 2x)/(2y − x) = (2 + 2)/(4 + 1) = 4/5.
      - |
        This is a sign slip when solving for dy/dx; the expression (y − 2x)/(2y − x) is positive at (−1, 2).
      - |
        This keeps the y from the product rule but drops the x(dy/dx) term, giving −4 + 4(dy/dx) = 0.
    answer: 1
  - slug: apcalcab-final-q11
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Calculus CED, Topic 3.3"
    points: 1
    prompt: |
      Let f(x) = x⁵ + 2x³ + x − 1, and let g be the inverse function of f. What is g′(3)?
    options:
      - "1/460"
      - "12"
      - "1/12"
      - "460"
    option_explanations:
      - |
        This evaluates f′ at 3 instead of at g(3) = 1: f′(3) = 405 + 54 + 1 = 460.
      - |
        This is f′(1) itself; the inverse's derivative is its reciprocal.
      - |
        Correct. f(1) = 1 + 2 + 1 − 1 = 3, so g(3) = 1 and g′(3) = 1/f′(1) = 1/(5 + 6 + 1) = 1/12.
      - |
        This is f′(3), with neither the reciprocal nor the switch to the input g(3) = 1.
    answer: 2
  - slug: apcalcab-final-q12
    type: multiple_choice
    topic_code: "4.1"
    source: "AP Calculus CED, Topic 4.1"
    points: 1
    prompt: |
      The amount of water in a tank, in gallons, is W(t), where t is measured in minutes. Which is the best interpretation of W′(5) = −3?
    options:
      - "At t = 5 minutes, the amount of water in the tank is decreasing at a rate of 3 gallons per minute."
      - "During the first 5 minutes, the amount of water in the tank decreased by 3 gallons."
      - "At t = 5 minutes, the tank holds 3 gallons less than it did at t = 0."
      - "At t = 5 minutes, the rate at which water leaves is decreasing by 3 gallons per minute per minute."
    option_explanations:
      - |
        Correct. W′(5) is the instantaneous rate of change of W at t = 5, in gallons per minute, and the negative sign means the amount is decreasing.
      - |
        This reads a derivative as a total change over an interval; W′(5) describes a rate at the instant t = 5.
      - |
        This is a statement about W(5) − W(0), an accumulated change, not about the rate W′(5).
      - |
        This describes W″(5), the rate of change of the rate, with units of gallons per minute per minute.
    answer: 0
  - slug: apcalcab-final-q13
    type: multiple_choice
    topic_code: "4.4"
    source: "AP Calculus CED, Topic 4.4"
    points: 1
    prompt: |
      An oil spill spreads in a circle whose radius increases at 2 metres per minute. How fast is the area of the spill increasing when the radius is 5 metres?
    options:
      - "10π square metres per minute"
      - "25π square metres per minute"
      - "20π square metres per minute"
      - "4π square metres per minute"
    option_explanations:
      - |
        This differentiates A = πr² with respect to r and forgets to multiply by dr/dt = 2.
      - |
        25π is the area at r = 5, not the rate at which the area changes.
      - |
        Correct. A = πr², so dA/dt = 2πr · dr/dt = 2π(5)(2) = 20π.
      - |
        This drops r from dA/dt = 2πr · dr/dt, computing 2π · 2.
    answer: 2
  - slug: apcalcab-final-q14
    type: multiple_choice
    topic_code: "4.7"
    source: "AP Calculus CED, Topic 4.7"
    points: 1
    prompt: |
      What is lim (x→0) (e^(3x) − 1 − 3x)/x²?
    options:
      - "3/2"
      - "9/2"
      - "9"
      - "0"
    option_explanations:
      - |
        This forgets the chain rule the second time, differentiating 3e^(3x) as 3e^(3x) instead of 9e^(3x).
      - |
        Correct. 0/0, so apply L'Hospital's Rule: (3e^(3x) − 3)/(2x), still 0/0; again: 9e^(3x)/2 → 9/2.
      - |
        This differentiates the denominator 2x as 1 instead of 2 in the second application.
      - |
        This stops after one application and substitutes into (3e^(3x) − 3)/(2x), which is still the indeterminate 0/0, not 0.
    answer: 1
  - slug: apcalcab-final-q15
    type: multiple_choice
    topic_code: "5.1"
    source: "AP Calculus CED, Topic 5.1"
    points: 1
    prompt: |
      The function f(x) = x² − 4x satisfies the hypotheses of the Mean Value Theorem on [0, 3]. What value of c in (0, 3) satisfies the conclusion?
    options:
      - "2"
      - "5/2"
      - "1"
      - "3/2"
    option_explanations:
      - |
        This sets f′(c) = 0 as in Rolle's Theorem, but f(0) ≠ f(3), so the required slope is −1, not 0.
      - |
        This is a sign slip, solving 2c − 4 = 1 instead of 2c − 4 = −1.
      - |
        This solves f(c) = f(3) = −3 instead of f′(c) = −1, matching a function value rather than a slope.
      - |
        Correct. The average rate of change is (f(3) − f(0))/3 = (−3 − 0)/3 = −1, and f′(c) = 2c − 4 = −1 gives c = 3/2.
    answer: 3
  - slug: apcalcab-final-q16
    type: multiple_choice
    topic_code: "5.4"
    source: "AP Calculus CED, Topic 5.4"
    points: 1
    prompt: |
      The derivative of a function f is f′(x) = (x − 1)²(x + 2)(x − 4). At which values of x does f have a relative minimum?
    options:
      - "x = −2 only"
      - "x = 1 and x = 4"
      - "x = 4 only"
      - "x = −2, x = 1 and x = 4"
    option_explanations:
      - |
        At x = −2, f′ changes from positive to negative, which is a relative maximum, not a minimum.
      - |
        f′(1) = 0 but f′ is negative on both sides of x = 1 because (x − 1)² does not change sign, so there is no extremum there.
      - |
        Correct. f′ is negative on (1, 4) and positive for x > 4, so f′ changes from negative to positive at x = 4; at x = 1 the squared factor means f′ does not change sign.
      - |
        These are all the critical points; a critical point is only a candidate, and the sign of f′ must change from negative to positive for a minimum.
    answer: 2
  - slug: apcalcab-final-q17
    type: multiple_choice
    topic_code: "5.6"
    source: "AP Calculus CED, Topic 5.6"
    points: 1
    prompt: |
      Let f(x) = x³ − 6x² + 9x + 2. On which interval is the graph of f concave down?
    options:
      - "(−∞, 2)"
      - "(2, ∞)"
      - "(1, 3)"
      - "(−∞, 1) and (3, ∞)"
    option_explanations:
      - |
        Correct. f″(x) = 6x − 12 is negative for x < 2.
      - |
        f″(x) = 6x − 12 is positive for x > 2, so the graph is concave up there.
      - |
        f′(x) = 3(x − 1)(x − 3) is negative on (1, 3): that is where f decreases, which is not concavity.
      - |
        These are the intervals where f′ > 0, so f increases there; concavity depends on the sign of f″.
    answer: 0
  - slug: apcalcab-final-q18
    type: multiple_choice
    topic_code: "5.5"
    source: "AP Calculus CED, Topic 5.5"
    points: 1
    prompt: |
      What is the absolute maximum value of g(x) = x³ − 3x on the closed interval [0, 3]?
    options:
      - "−2"
      - "18"
      - "2"
      - "0"
    option_explanations:
      - |
        −2 = g(1) is the absolute minimum on [0, 3]; the maximum comes from the endpoint x = 3.
      - |
        Correct. g′(x) = 3x² − 3 = 0 at x = 1 in the interval. Candidates: g(0) = 0, g(1) = −2, g(3) = 27 − 9 = 18, so the maximum is 18.
      - |
        2 = g(−1) comes from the critical point x = −1, which lies outside [0, 3].
      - |
        This checks only the left endpoint; the candidates test needs every critical point and both endpoints.
    answer: 1
  - slug: apcalcab-final-q19
    type: multiple_choice
    topic_code: "5.9"
    source: "AP Calculus CED, Topic 5.9"
    points: 1
    prompt: |
      On an open interval, f′(x) > 0 and f″(x) < 0. Which describes the graph of f on that interval?
    options:
      - "Increasing and concave up"
      - "Decreasing and concave down"
      - "Decreasing and concave up"
      - "Increasing and concave down"
    option_explanations:
      - |
        Concave up would need f″ > 0; here f″ < 0.
      - |
        f′ > 0 makes f increasing; this reads the sign of f″ as the direction of f.
      - |
        Both signs are reversed: f′ > 0 means increasing and f″ < 0 means concave down.
      - |
        Correct. f′ > 0 means f is increasing; f″ < 0 means f′ is decreasing, so the graph is concave down.
    answer: 3
  - slug: apcalcab-final-q20
    type: multiple_choice
    topic_code: "6.3"
    source: "AP Calculus CED, Topic 6.3"
    points: 1
    prompt: |
      Which definite integral equals lim (n→∞) ∑ (k = 1 to n) (3/n)(1 + 3k/n)²?
    options:
      - "∫ from 0 to 3 of x² dx"
      - "∫ from 1 to 4 of x² dx"
      - "∫ from 1 to 4 of (1 + x)² dx"
      - "∫ from 0 to 1 of (1 + 3x)² dx"
    option_explanations:
      - |
        This uses the width 3 but forgets that the sample points start at 1, not 0; it equals 9, not 21.
      - |
        Correct. Δx = 3/n and xₖ = 1 + 3k/n run from 1 to 1 + 3 = 4, and the function is x², so the sum is a right Riemann sum for ∫ from 1 to 4 of x² dx = 21.
      - |
        This shifts twice: with xₖ = 1 + 3k/n already running over [1, 4], the function is x², not (1 + x)².
      - |
        This uses Δx = 1/n instead of 3/n, dropping the factor 3; it equals 7, one third of the sum's limit.
    answer: 1
  - slug: apcalcab-final-q21
    type: multiple_choice
    topic_code: "6.4"
    source: "AP Calculus CED, Topic 6.4"
    points: 1
    prompt: |
      What is d/dx ∫ from 2 to x² of cos t dt?
    options:
      - "2x cos(x²)"
      - "cos(x²)"
      - "2x sin(x²)"
      - "cos(x²) − cos 2"
    option_explanations:
      - |
        Correct. By the Fundamental Theorem with the chain rule: cos(x²) · d/dx (x²) = 2x cos(x²).
      - |
        This forgets the chain rule factor 2x from the upper limit x².
      - |
        This antidifferentiates cos t and then differentiates the upper limit, mixing two steps; the derivative of the accumulation function returns the integrand.
      - |
        The constant lower limit contributes nothing to the derivative, and the chain rule factor 2x is missing.
    answer: 0
  - slug: apcalcab-final-q22
    type: multiple_choice
    topic_code: "6.6"
    source: "AP Calculus CED, Topic 6.6"
    points: 1
    prompt: |
      If ∫ from 1 to 5 of f(x) dx = 8 and ∫ from 1 to 3 of f(x) dx = 3, what is ∫ from 5 to 3 of 2f(x) dx?
    options:
      - "10"
      - "−5"
      - "22"
      - "−10"
    option_explanations:
      - |
        This forgets that reversing the limits from 3→5 to 5→3 changes the sign.
      - |
        This reverses the limits correctly but forgets the constant factor 2.
      - |
        This adds the two integrals, 2(8 + 3), instead of subtracting to get the integral over [3, 5].
      - |
        Correct. ∫ from 3 to 5 of f = 8 − 3 = 5, so ∫ from 5 to 3 of f = −5, and doubling gives −10.
    answer: 3
  - slug: apcalcab-final-q23
    type: multiple_choice
    topic_code: "6.9"
    source: "AP Calculus CED, Topic 6.9"
    points: 1
    prompt: |
      What is ∫ from 0 to 1 of x(x² + 1)³ dx?
    options:
      - "15/4"
      - "1/8"
      - "15/8"
      - "2"
    option_explanations:
      - |
        This forgets the factor 1/2 from x dx = du/2.
      - |
        This keeps the x-limits 0 and 1 after substituting u, computing (1/2)(1⁴ − 0⁴)/4.
      - |
        Correct. With u = x² + 1, du = 2x dx, the integral is (1/2) ∫ from 1 to 2 of u³ du = (1/2)(16 − 1)/4 = 15/8.
      - |
        This evaluates (x² + 1)⁴/8 at x = 1 and subtracts 0 instead of (0² + 1)⁴/8 at the lower limit.
    answer: 2
  - slug: apcalcab-final-q24
    type: multiple_choice
    topic_code: "6.10"
    source: "AP Calculus CED, Topic 6.10"
    points: 1
    prompt: |
      Which is ∫ (x² + 1)/x dx?
    options:
      - "x²/2 + ln|x| + C"
      - "(x³/3 + x)/(x²/2) + C"
      - "x²/2 − 1/x² + C"
      - "x² + ln|x| + C"
    option_explanations:
      - |
        Correct. Divide first: (x² + 1)/x = x + 1/x, whose antiderivative is x²/2 + ln|x| + C.
      - |
        This antidifferentiates the numerator and denominator separately; there is no quotient rule for integrals.
      - |
        This differentiates 1/x instead of antidifferentiating it; the antiderivative of 1/x is ln|x|.
      - |
        This forgets to divide by the new power 2 when antidifferentiating x.
    answer: 0
  - slug: apcalcab-final-q25
    type: multiple_choice
    topic_code: "7.4"
    source: "AP Calculus CED, Topic 7.4"
    points: 1
    prompt: |
      Consider the slope field for the differential equation dy/dx = x − y. Which statement is true?
    options:
      - "Every segment on the x-axis is horizontal."
      - "The segments at (1, 2) and (2, 1) are parallel."
      - "Every segment on the line y = x is horizontal."
      - "The slopes depend only on x, so segments in each vertical column are parallel."
    option_explanations:
      - |
        On the x-axis y = 0, so dy/dx = x, which is 0 only at the origin.
      - |
        The slopes are 1 − 2 = −1 and 2 − 1 = 1, which are different.
