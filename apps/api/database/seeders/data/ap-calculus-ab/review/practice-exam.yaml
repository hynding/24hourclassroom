    prompt: |
      The region bounded by y = 2x, the x-axis and the line x = 3 is the base of a solid. Each cross section perpendicular to the x-axis is a semicircle whose diameter lies in the region. The volume of the solid is ____ cubic units.
    answer: ["9π/2", "9pi/2", "9π / 2", "9 π/2", "(9/2)π", "4.5π", "4.5pi", "14.137", "14.14", "(9π)/2"]
    explanation: |
      The diameter at x is 2x, so the radius is x and the area of the semicircle is (π/2)x². Volume = ∫ from 0 to 3 of (π/2)x² dx = (π/2)(9) = 9π/2 ≈ 14.137. Using the diameter 2x as the radius gives 18π, four times too large.
