      (B) Find the acceleration of the particle at t = 1. Is the speed of the particle increasing or decreasing at t = 1? Give a reason for your answer.

      (C) Find the position of the particle at time t = 5.

      (D) Find the total distance the particle travels over the interval 0 ≤ t ≤ 5.
    answer: |
      (A) v(t) = (t − 2)(t − 4), which is negative for 2 < t < 4. The particle moves left on (2, 4) because its velocity is negative there.
      (B) a(t) = v′(t) = 2t − 6, so a(1) = −4. v(1) = 1 − 6 + 8 = 3 > 0 and a(1) < 0. Velocity and acceleration have opposite signs, so the speed is decreasing at t = 1.
      (C) x(5) = x(0) + ∫ from 0 to 5 of v(t) dt = 3 + [t³/3 − 3t² + 8t] from 0 to 5 = 3 + (125/3 − 75 + 40) = 3 + 20/3 = 29/3.
      (D) Distance = ∫ from 0 to 5 of |v(t)| dt. With V(t) = t³/3 − 3t² + 8t: ∫ from 0 to 2 of v dt = V(2) − V(0) = 20/3; ∫ from 2 to 4 of v dt = V(4) − V(2) = 16/3 − 20/3 = −4/3; ∫ from 4 to 5 of v dt = V(5) − V(4) = 20/3 − 16/3 = 4/3. Total distance = 20/3 + 4/3 + 4/3 = 28/3.
    explanation: |
      Nine points.
      (A) 2 points: 1 for the interval 2 < t < 4; 1 for the reason v(t) < 0 there. Endpoints included or not is accepted, but the reason must refer to the sign of v.
      (B) 2 points: 1 for a(1) = −4; 1 for "decreasing" with the reason that v(1) and a(1) have opposite signs (v(1) = 3 > 0, a(1) < 0). "Decreasing because a(1) < 0" alone earns no point.
      (C) 2 points: 1 for x(0) + ∫ from 0 to 5 of v(t) dt with the antiderivative; 1 for 29/3. Omitting the initial position 3 loses the answer point.
      (D) 3 points: 1 for ∫ |v(t)| dt or splitting the interval at t = 2 and t = 4; 1 for the three pieces 20/3, −4/3 (or 4/3) and 4/3; 1 for 28/3.
  - slug: apcalcab-final-q46
    type: long_answer
    topic_code: "5.9"
    source: "AP Calculus CED, Topic 5.9"
    points: 9
    stimulus: |
      The function f is defined on the closed interval [−3, 5], and f(0) = 4. The graph of its derivative, f′, consists of four line segments joining, in order, the points (−3, −2), (−1, 2), (1, 2), (3, −2) and (5, 0).
    prompt: |
      (No calculator.) Free-response question 4.

      (A) Find the x-coordinate of each point at which f has a relative minimum or a relative maximum on the open interval (−3, 5). Classify each one and justify your answer.

      (B) On what open intervals is the graph of f concave down? Give a reason for your answer.

      (C) Find f(3) and f(−3).

      (D) Find the absolute maximum value of f on the closed interval [−3, 5]. Justify your answer.
    answer: |
      (A) The segments give f′(x) = 2x + 4 on [−3, −1], f′(x) = 2 on [−1, 1], f′(x) = −2x + 4 on [1, 3] and f′(x) = x − 5 on [3, 5], so f′ = 0 at x = −2 and x = 2 in (−3, 5). f has a relative minimum at x = −2 because f′ changes from negative to positive there, and a relative maximum at x = 2 because f′ changes from positive to negative there.
      (B) The graph of f is concave down on (1, 3), because f′ is decreasing there. (On (−1, 1) f′ is constant, so the graph of f is a line segment there, neither concave up nor concave down.)
      (C) f(3) = f(0) + ∫ from 0 to 3 of f′(x) dx = 4 + (2 + 1 − 1) = 6, using the rectangle on [0, 1] and the two triangles on [1, 2] (above the axis) and [2, 3] (below). f(−3) = f(0) − ∫ from −3 to 0 of f′(x) dx = 4 − (−1 + 1 + 2) = 2.
      (D) Candidates: the endpoints and the critical point x = 2 where f′ changes sign from positive to negative. f(−3) = 2; f(2) = 4 + ∫ from 0 to 2 of f′(x) dx = 4 + 2 + 1 = 7; f(5) = f(3) + ∫ from 3 to 5 of f′(x) dx = 6 − 2 = 4. (The relative minimum f(−2) = 1 cannot be the maximum.) The absolute maximum value of f on [−3, 5] is 7, at x = 2.
    explanation: |
      Nine points.
      (A) 2 points: 1 for the relative minimum at x = −2 with the reason "f′ changes from negative to positive"; 1 for the relative maximum at x = 2 with the reason "f′ changes from positive to negative". Reasons about f itself ("f goes down then up") or about the graph of f′ having a minimum earn no point.
      (B) 2 points: 1 for the interval (1, 3); 1 for the reason "f′ is decreasing" (or f″ < 0). Including (−1, 1) loses the interval point.
      (C) 2 points: 1 for f(3) = 6; 1 for f(−3) = 2. Both need the initial value f(0) = 4 and the signed areas; the reversed limits for f(−3) are the usual error.
      (D) 3 points: 1 for considering the endpoints and x = 2 (a candidates test); 1 for the values f(−3) = 2, f(2) = 7 and f(5) = 4; 1 for the answer 7 with the conclusion that it is the largest candidate.
  - slug: apcalcab-final-q47
    type: long_answer
    topic_code: "7.7"
    source: "AP Calculus CED, Topic 7.7"
    points: 9
    stimulus: |
      Consider the differential equation dy/dx = (y − 2) cos x.
    prompt: |
      (No calculator.) Free-response question 5.

      (A) Find the slope given by the differential equation at each of the points (0, 1), (0, 3), (π/2, 3) and (π, 3), and describe the segment a slope field would show at each point. Explain why every segment of the slope field on the line y = 2 is horizontal.

      (B) Let y = f(x) be the particular solution to the differential equation with initial condition f(0) = 3. Write an equation for the line tangent to the graph of f at the point (0, 3), and use it to approximate f(0.2). Find d²y/dx² at the point (0, 3), and use it to determine whether your approximation is an overestimate or an underestimate of f(0.2). Give a reason for your answer.

      (C) Find y = f(x), the particular solution to the differential equation with initial condition f(0) = 3.
    answer: |
      (A) At (0, 1): (1 − 2) cos 0 = −1, a segment of slope −1 falling to the right. At (0, 3): (3 − 2) cos 0 = 1, slope 1 rising to the right. At (π/2, 3): (1) cos(π/2) = 0, horizontal. At (π, 3): (1) cos π = −1, slope −1. On the line y = 2 the factor y − 2 is 0, so dy/dx = 0 at every point and every segment is horizontal.
      (B) The slope at (0, 3) is 1, so the tangent line is y = 3 + 1(x − 0) = x + 3, and f(0.2) ≈ 3.2.
      d²y/dx² = (dy/dx) cos x − (y − 2) sin x = (y − 2) cos² x − (y − 2) sin x. At (0, 3): (1)(1) − (1)(0) = 1 > 0. The graph of f is concave up near x = 0, so it lies above its tangent line there and 3.2 is an underestimate.
      (C) Separate: dy/(y − 2) = cos x dx. Antidifferentiate: ln|y − 2| = sin x + C. At (0, 3): ln 1 = sin 0 + C, so C = 0. Then |y − 2| = e^(sin x); since y − 2 = 1 > 0 at the initial condition, y − 2 = e^(sin x), and f(x) = 2 + e^(sin x).
    explanation: |
      Nine points.
      (A) 2 points: 1 for the four slopes −1, 1, 0 and −1 (segments described as falling, rising, horizontal, falling); 1 for explaining that y − 2 = 0 makes dy/dx = 0 on y = 2.
      (B) 3 points: 1 for the tangent line y = x + 3 and f(0.2) ≈ 3.2; 1 for d²y/dx² = 1 at (0, 3), from implicit differentiation that uses dy/dx (the product rule on (y − 2) cos x); 1 for "underestimate" with the reason that the graph is concave up (d²y/dx² > 0) near x = 0.
      (C) 4 points: 1 for separating the variables correctly; 1 for both antiderivatives, ln|y − 2| and sin x; 1 for the constant of integration and using the initial condition to find it; 1 for solving for y: f(x) = 2 + e^(sin x). A student who does not separate the variables earns no points in (C); one with no constant of integration earns at most 2 of the 4 points.
  - slug: apcalcab-final-q48
    type: long_answer
    topic_code: "8.12"
    source: "AP Calculus CED, Topic 8.12"
    points: 9
    stimulus: |
      Let R be the region in the first quadrant enclosed by the graphs of y = 4x − x² and y = x².
    prompt: |
      (No calculator.) Free-response question 6.

      (A) Find the area of R.

      (B) Region R is the base of a solid. For the solid, each cross section perpendicular to the x-axis is a square. Find the volume of the solid.

      (C) Write, but do not evaluate, an integral expression for the volume of the solid generated when R is revolved about the horizontal line y = 5.

      (D) The vertical line x = k, where 0 < k < 2, divides R into two regions of equal area. Write, but do not solve, an equation involving one or more integrals whose solution is k.
    answer: |
      The curves meet where 4x − x² = x², so 2x(2 − x) = 0 and x = 0 or x = 2. On (0, 2) the upper curve is y = 4x − x² (at x = 1: 3 > 1), so the vertical distance across R is (4x − x²) − x² = 4x − 2x².
      (A) Area = ∫ from 0 to 2 of (4x − 2x²) dx = [2x² − 2x³/3] from 0 to 2 = 8 − 16/3 = 8/3.
      (B) Volume = ∫ from 0 to 2 of (4x − 2x²)² dx = ∫ from 0 to 2 of (16x² − 16x³ + 4x⁴) dx = 128/3 − 64 + 128/5 = 64/15.
      (C) The line y = 5 lies above R (the top curve's greatest value on [0, 2] is 4). Washers: outer radius 5 − x² (to the lower curve), inner radius 5 − (4x − x²) (to the upper curve). Volume = π ∫ from 0 to 2 of [(5 − x²)² − (5 − 4x + x²)²] dx. (Its value is 16π, though the question does not ask for it.)
      (D) ∫ from 0 to k of (4x − 2x²) dx = (1/2)(8/3) = 4/3, or equivalently ∫ from 0 to k of (4x − 2x²) dx = ∫ from k to 2 of (4x − 2x²) dx.
    explanation: |
      Nine points.
      (A) 2 points: 1 for the integral with integrand 4x − 2x² and limits 0 and 2 (finding x = 2 is part of this point); 1 for 8/3.
      (B) 3 points: 1 for the integrand (4x − 2x²)², the square of the side length; 1 for the limits and the constant (none here); 1 for 64/15.
      (C) 3 points: 1 for the constant π and the limits 0 and 2; 2 for the integrand [(5 − x²)² − (5 − 4x + x²)²], 1 for each radius. Radii measured from the x-axis instead of from y = 5 earn neither radius point.
      (D) 1 point: a correct equation, either half the area 4/3 or the two integrals set equal.
