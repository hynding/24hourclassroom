  # ---- Section II, Part A: free response, graphing calculator required (q43-q44).
  - slug: apcalcab-final-q43
    type: long_answer
    topic_code: "8.3"
    source: "AP Calculus CED, Topic 8.3"
    points: 9
    stimulus: |
      Rainwater flows into a storage basin (hypothetical) at the rate R(t) = 20 + 15 sin(t/2) cubic metres per hour, and water is pumped out of the basin at the rate D(t) = 4t + 6 cubic metres per hour, for 0 ≤ t ≤ 10, where t is measured in hours. At time t = 0 the basin holds 200 cubic metres of water.
    prompt: |
      (Calculator.) Free-response question 1.

      (A) How many cubic metres of rainwater flow into the basin during the 10 hours, 0 ≤ t ≤ 10? Give your answer to three decimal places.

      (B) Find R′(4). Using correct units, explain the meaning of R′(4) in the context of the problem.

      (C) Is the amount of water in the basin increasing or decreasing at time t = 6? Give a reason for your answer.

      (D) At what time t, for 0 ≤ t ≤ 10, is the amount of water in the basin greatest? Find the greatest amount, to three decimal places. Justify your answer.
    answer: |
      (A) ∫ from 0 to 10 of R(t) dt ≈ 221.490 cubic metres (calculator numerical integral).
      (B) R′(4) ≈ −3.121 (calculator numerical derivative; by hand R′(t) = 7.5 cos(t/2), so R′(4) = 7.5 cos 2). At time t = 4 hours, the rate at which rainwater flows into the basin is decreasing at about 3.121 cubic metres per hour per hour.
      (C) Let A(t) be the amount of water at time t, so A′(t) = R(t) − D(t). R(6) ≈ 22.117 and D(6) = 30, so A′(6) ≈ −7.883 < 0. The amount is decreasing at t = 6 because water is pumped out faster than rainwater flows in.
      (D) A(t) = 200 + ∫ from 0 to t of (R(s) − D(s)) ds. A′(t) = R(t) − D(t) = 0 at t ≈ 5.289, the only solution in [0, 10] (graph R and D on the calculator). Candidates: A(0) = 200; A(5.289) = 200 + ∫ from 0 to 5.289 of (R(t) − D(t)) dt ≈ 274.468; A(10) = 200 + 221.490 − 260 = 161.490, since ∫ from 0 to 10 of D(t) dt = 260. The amount is greatest at t ≈ 5.289 hours, when the basin holds about 274.468 cubic metres.
    explanation: |
      Nine points.
      (A) 2 points: 1 for the integral ∫ from 0 to 10 of R(t) dt (limits and integrand); 1 for 221.490 (accept 221.49).
      (B) 2 points: 1 for R′(4) ≈ −3.121 (accept −3.12); 1 for the meaning: at t = 4 the inflow rate is decreasing at 3.121 cubic metres per hour per hour. The units and the word "rate" are both needed; an answer that says the amount of water is decreasing earns no point.
      (C) 1 point: decreasing, with the reason R(6) < D(6) (or A′(6) = R(6) − D(6) < 0), showing the values or the sign.
      (D) 4 points: 1 for setting A′(t) = R(t) − D(t) = 0; 1 for t ≈ 5.289; 1 for the maximum amount 274.468 (accept 274.47); 1 for the justification, either a candidates test that shows A(0) = 200 and A(10) ≈ 161.490 are smaller, or the argument that A′ changes from positive to negative at the only critical point t ≈ 5.289, so it is the absolute maximum. Using the integrand R − D without the initial 200 loses the amount point. Decimal answers must be correct to three places.
  - slug: apcalcab-final-q44
    type: long_answer
    topic_code: "6.2"
    source: "AP Calculus CED, Topic 6.2"
    points: 9
    stimulus: |
      A cyclist rides along a straight path (hypothetical data). Her velocity v(t), in metres per second, is a differentiable function of t, the time in seconds. Selected values of v(t) are given in the table.

      | t (seconds) | 0 | 4 | 10 | 15 | 20 |
      |---|---|---|---|---|---|
      | v(t) (m/s) | 1.5 | 5.3 | 8.4 | 7.4 | 3.5 |
    prompt: |
      (Calculator.) Free-response question 2.

      (A) Use the data in the table to estimate v′(12). Using correct units, interpret your estimate in the context of the problem.

      (B) Use a trapezoidal sum with the four subintervals indicated by the table to approximate ∫ from 0 to 20 of v(t) dt. Using correct units, explain the meaning of ∫ from 0 to 20 of v(t) dt in the context of the problem.

      (C) Must there be a time t, for 10 < t < 20, at which v′(t) = −0.49? Justify your answer.

      (D) For 0 ≤ t ≤ 20, the cyclist's velocity is modelled by f(t) = 1.5 + 7 sin(πt/22). Use the model to find the average velocity of the cyclist over 0 ≤ t ≤ 20, to three decimal places.
    answer: |
      (A) v′(12) ≈ (v(15) − v(10))/(15 − 10) = (7.4 − 8.4)/5 = −0.2 metres per second per second. At t = 12 seconds the cyclist's velocity is decreasing at about 0.2 metres per second each second.
      (B) ∫ from 0 to 20 of v(t) dt ≈ 4(1.5 + 5.3)/2 + 6(5.3 + 8.4)/2 + 5(8.4 + 7.4)/2 + 5(7.4 + 3.5)/2 = 13.6 + 41.1 + 39.5 + 27.25 = 121.45. The integral is the distance, in metres, that the cyclist travels during the 20 seconds (her velocity is positive throughout the table, so displacement and distance agree).
      (C) Yes. v is differentiable, so it is continuous on [10, 20] and differentiable on (10, 20). (v(20) − v(10))/(20 − 10) = (3.5 − 8.4)/10 = −0.49. By the Mean Value Theorem there is a time t with 10 < t < 20 at which v′(t) = −0.49.
      (D) Average velocity = (1/20) ∫ from 0 to 20 of f(t) dt ≈ 6.303 metres per second (calculator numerical integral: the integral is about 126.054).
    explanation: |
      Nine points.
      (A) 2 points: 1 for the difference quotient using t = 10 and t = 15 and the value −0.2; 1 for an interpretation at t = 12 with units metres per second per second (velocity decreasing at 0.2 m/s each second). An interpretation without units earns no point.
      (B) 3 points: 1 for a trapezoidal sum with the four unequal widths 4, 6, 5, 5 (a uniform width earns no point); 1 for 121.45; 1 for the meaning: distance travelled in metres from t = 0 to t = 20. "Displacement" is also accepted.
      (C) 2 points: 1 for the average rate of change (3.5 − 8.4)/(20 − 10) = −0.49; 1 for the Mean Value Theorem conclusion with its hypotheses checked: v is differentiable (hence continuous) on the interval. A conclusion that does not name differentiability or continuity earns no point.
      (D) 2 points: 1 for (1/20) ∫ from 0 to 20 of f(t) dt (the 1/20 and the limits are both needed); 1 for 6.303.
  # ---- Section II, Part B: free response, no calculator (q45-q48).
  - slug: apcalcab-final-q45
    type: long_answer
    topic_code: "4.2"
    source: "AP Calculus CED, Topic 4.2"
    points: 9
    stimulus: |
      A particle moves along the x-axis. Its velocity at time t seconds is v(t) = t² − 6t + 8, for 0 ≤ t ≤ 5, and its position at time t = 0 is x(0) = 3.
    prompt: |
