      Let g(x) = ∫ from 1 to x of (t² − 4t + 3) dt. The function g has a relative maximum at x = ____.
    answer: ["1"]
    explanation: |
      g′(x) = x² − 4x + 3 = (x − 1)(x − 3). g′ changes from positive to negative at x = 1, so g has a relative maximum there; at x = 3 g′ changes from negative to positive, a relative minimum.
