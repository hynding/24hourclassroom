  - slug: apcalcab-final-q68
    type: short_answer
    topic_code: "6.10"
    source: "AP Calculus CED, Topic 6.10"
    points: 3
    prompt: |
      Find each indefinite integral.
      (a) ∫ (x² + 3x + 1)/(x + 1) dx
      (b) ∫ 1/(x² + 6x + 10) dx
    answer: |
      (a) Long division: x² + 3x + 1 = (x + 1)(x + 2) − 1, so the integrand is x + 2 − 1/(x + 1), and the integral is x²/2 + 2x − ln|x + 1| + C.
      (b) Complete the square: x² + 6x + 10 = (x + 3)² + 1, so the integral is arctan(x + 3) + C.
    explanation: |
      Three points. 1 point for the division x + 2 − 1/(x + 1) in (a); 1 point for its antiderivative x²/2 + 2x − ln|x + 1| + C; 1 point for (b), arctan(x + 3) + C, which needs the completed square (x + 3)² + 1. A missing + C is penalised once across both parts.
  - slug: apcalcab-final-q69
    type: numeric
    topic_code: "7.8"
    source: "AP Calculus CED, Topic 7.8"
    points: 1
    prompt: |
      (Calculator.) A substance decays so that dy/dt = −0.2y, where y is the amount in milligrams and t is in hours (hypothetical). At t = 0 there are 50 milligrams. How many milligrams remain at t = 5? Give your answer to three decimal places.
    answer: { value: 18.394, tolerance: 0.001 }
    explanation: |
      dy/dt = ky has solution y = y(0)e^(kt), so y = 50e^(−0.2t) and y(5) = 50e^(−1) ≈ 18.394 milligrams.
