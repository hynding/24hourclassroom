    type: short_answer
    topic_code: "2.2"
    source: "AP Calculus CED, Topic 2.2"
    points: 3
    prompt: |
      Let f(x) = 2x² − x + 3.
      (a) Use the limit definition of the derivative to find f′(x). Show the algebra.
      (b) Write an equation of the line tangent to the graph of f at x = 2.
    answer: |
      (a) f(x + h) = 2x² + 4xh + 2h² − x − h + 3, so f(x + h) − f(x) = 4xh + 2h² − h. For h ≠ 0 the difference quotient is 4x + 2h − 1, and as h → 0 it tends to f′(x) = 4x − 1.
      (b) f(2) = 8 − 2 + 3 = 9 and f′(2) = 7, so y = 9 + 7(x − 2).
    explanation: |
      Three points. (a) 1 point for a correct difference quotient with f(x + h) expanded; 1 point for cancelling h and taking the limit to get 4x − 1. A result from the power rule with no limit work earns no credit in (a). (b) 1 point for y = 9 + 7(x − 2) or an equivalent form.
  - slug: apcalcab-u02-exam-q43
    type: short_answer
    topic_code: "2.4"
    source: "AP Calculus CED, Topic 2.4"
    points: 3
    prompt: |
      Let f(x) = aeˣ + b for x ≤ 0 and f(x) = 3x + 1 for x > 0, where a and b are constants. Find the values of a and b for which f is differentiable at x = 0. Justify your answer.
    answer: |
      Differentiability at 0 requires continuity at 0 and equal one-sided derivatives.
      Slopes: the left piece has derivative aeˣ, which is a at x = 0; the right piece has derivative 3. So a = 3.
      Continuity: the left piece gives ae⁰ + b = a + b at x = 0 and the right piece tends to 1, so a + b = 1 and b = −2.
      With a = 3 and b = −2, f is continuous at 0 and both one-sided derivatives equal 3, so f′(0) = 3 exists.
    explanation: |
      Three points. 1 point for the slope condition a = 3 (using d/dx [eˣ] = eˣ). 1 point for the continuity condition a + b = 1 giving b = −2. 1 point for stating that both conditions are needed (continuity and equal one-sided derivatives) in the justification.
  - slug: apcalcab-u02-exam-q44
    type: long_answer
    topic_code: "2.3"
    source: "AP Calculus CED, Topic 2.3"
    points: 9
    prompt: |
      (Calculator.) The volume of water in a reservoir, V(t), in millions of litres, is measured at selected times t days after a storm. V is differentiable, and the data are hypothetical.

      | t (days) | 0 | 2 | 5 | 9 | 10 |
      |---|---|---|---|---|---|
      | V(t) (millions of litres) | 40 | 43.2 | 46.1 | 47.0 | 46.5 |

      An engineer models the volume with M(t) = 40 + 3√t − 0.25t for 0 ≤ t ≤ 10.
      (A) Use the data to estimate V′(7). Show the computation and interpret your answer in context, with units.
      (B) Find M′(t). Then find M′(7) to three decimal places and compare it with your estimate from part (A).
      (C) Find the time t in the interval 0 < t < 10 at which the instantaneous rate of change of M equals the average rate of change of M over 0 ≤ t ≤ 10.
      (D) The concentration of a dissolved mineral in the reservoir is c(t) = 2 + 0.1t milligrams per litre. Using the model, the mass of the mineral is A(t) = M(t) · c(t), in kilograms (one million litres at one milligram per litre is one kilogram). Find A′(4), show the rule you use, and interpret A′(4) in context.
    answer: |
      (A) V′(7) ≈ (V(9) − V(5))/(9 − 5) = (47.0 − 46.1)/4 = 0.225 million litres per day. About 7 days after the storm, the volume of water in the reservoir is increasing at roughly 0.225 million litres per day.
      (B) M′(t) = 3 · (1/2)t^(−1/2) − 0.25 = 1.5/√t − 0.25. M′(7) = 1.5/√7 − 0.25 ≈ 0.317 million litres per day, a little larger than the estimate 0.225 from the data.
      (C) The average rate is (M(10) − M(0))/10 = (3√10 − 2.5)/10 ≈ 0.699 million litres per day. Solving 1.5/√t − 0.25 = 0.699 on the calculator (or exactly: 1.5/√t = 0.3√10, √t = √10/2) gives t = 2.5 days.
      (D) M(4) = 40 + 6 − 1 = 45, M′(4) = 1.5/2 − 0.25 = 0.5, c(4) = 2.4 and c′(4) = 0.1. By the product rule, A′(4) = M′(4)c(4) + M(4)c′(4) = 0.5(2.4) + 45(0.1) = 1.2 + 4.5 = 5.7. Four days after the storm, the mass of dissolved mineral in the reservoir is increasing at 5.7 kilograms per day (according to the model).
    explanation: |
      Nine points. (A) 1 point for 0.225 from the bracketing data at t = 5 and t = 9; 1 point for an interpretation naming the time (t = 7 days), "increasing" and millions of litres per day. (B) 1 point for M′(t) = 1.5/√t − 0.25; 1 point for M′(7) ≈ 0.317 with a comparison to part (A). (C) 1 point for the average rate (3√10 − 2.5)/10 ≈ 0.699; 1 point for t = 2.5. (D) 1 point for the product rule setup M′c + Mc′; 1 point for 5.7; 1 point for an interpretation with units of kilograms per day and the time t = 4.
  - slug: apcalcab-u02-exam-q45
    type: long_answer
    topic_code: "2.4"
    source: "AP Calculus CED, Topic 2.4"
    points: 9
    prompt: |
      No calculator is allowed for this question. Let g be the function defined by g(x) = 2 sin x + 1 for x ≤ 0 and g(x) = x² + 2x + 1 for x > 0.
      (A) Show that g is continuous at x = 0.
      (B) Is g differentiable at x = 0? Justify your answer using one-sided derivatives.
      (C) Write an equation of the line tangent to the graph of g at x = −π/6.
      (D) Let h(x) = g(x)/(x² + 1). Find h′(1).
      (E) Let k(x) = x · g(x). Find k′(−π/2).
    answer: |
      (A) lim (x→0⁻) g(x) = 2 sin 0 + 1 = 1, lim (x→0⁺) g(x) = 0 + 0 + 1 = 1, and g(0) = 2 sin 0 + 1 = 1. The one-sided limits both equal g(0), so g is continuous at 0.
      (B) Yes. For x < 0, g′(x) = 2 cos x, which gives 2 cos 0 = 2 at x = 0. For x > 0, g′(x) = 2x + 2, which gives 2 at x = 0. Since g is continuous at 0 and the one-sided derivatives are equal, g′(0) = 2 exists.
      (C) g(−π/6) = 2(−1/2) + 1 = 0 and g′(−π/6) = 2 cos(−π/6) = 2(√3/2) = √3. The tangent line is y = √3(x + π/6).
      (D) For x > 0, h(x) = (x² + 2x + 1)/(x² + 1). By the quotient rule, h′(x) = ((2x + 2)(x² + 1) − (x² + 2x + 1)(2x))/(x² + 1)². At x = 1: ((4)(2) − (4)(2))/4 = 0.
      (E) By the product rule, k′(x) = g(x) + x g′(x). g(−π/2) = 2(−1) + 1 = −1 and g′(−π/2) = 2 cos(−π/2) = 0, so k′(−π/2) = −1 + (−π/2)(0) = −1.
    explanation: |
      Nine points. (A) 1 point for both one-sided limits and g(0), all equal to 1, with the conclusion. (B) 1 point for both one-sided derivatives equal to 2; 1 point for the conclusion that g is differentiable, citing continuity from (A) and the equal one-sided derivatives. (C) 1 point for the point (−π/6, 0); 1 point for the slope √3 and a correct tangent-line equation. (D) 1 point for a correct quotient-rule setup with the numerator in the right order; 1 point for h′(1) = 0. (E) 1 point for the product rule k′ = g + xg′; 1 point for −1.
