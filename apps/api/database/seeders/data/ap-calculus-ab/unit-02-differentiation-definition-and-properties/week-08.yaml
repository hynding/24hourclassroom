week: 8
unit: 2
title: "The Power Rule, Basic Derivative Rules, and Derivatives of sin x, cos x, eˣ and ln x"
topics: ["2.5", "2.6", "2.7"]
guide: guides/week-08.md
guide_description: |
  The power rule for any real exponent, including roots and reciprocals rewritten as powers; the constant,
  sum, difference and constant multiple rules and why they follow from limit properties; and the derivatives of
  sin x, cos x, eˣ and ln x, with the two special limits behind the trig derivatives. Worked examples: rewriting
  and differentiating 6√x − x³ + 4/x, horizontal tangents of x³ − 12x + 1, the tangent line to ln x at x = e,
  reading lim (h→0) (sin(π/6 + h) − 1/2)/h as a derivative, and a hypothetical harbour depth model.
flashcards_description: |
  32 cards on the power rule with integer, fractional and negative exponents, rewriting before differentiating,
  the constant, sum, difference and constant multiple rules, the derivatives of sin x, cos x, eˣ and ln x,
  horizontal tangents, and tangent lines.

flashcards:
  - front: Power rule → statement and when it applies
    back: |
      d/dx [xⁿ] = n·xⁿ⁻¹ for every real constant n (where xⁿ is defined). Bring the exponent down, then lower it by one.
    topic_code: "2.5"
  - front: d/dx [x⁷] → result
    back: |
      7x⁶.
    topic_code: "2.5"
  - front: d/dx [√x] by the power rule → rewrite and result
    back: |
      √x = x^(1/2), so the derivative is (1/2)x^(−1/2) = 1/(2√x), matching week 6's limit computation.
    topic_code: "2.5"
  - front: d/dx [1/x³] → rewrite and result
    back: |
      1/x³ = x⁻³, so the derivative is −3x⁻⁴ = −3/x⁴.
    topic_code: "2.5"
  - front: d/dx [1/∛(x²)] → rewrite and result
    back: |
      x^(−2/3), so the derivative is −(2/3)x^(−5/3) = −2/(3∛(x⁵)).
    topic_code: "2.5"
  - front: d/dx [x^π] → result
    back: |
      πx^(π − 1). The power rule works for any constant exponent, irrational ones included.
    topic_code: "2.5"
  - front: Radicals and fractions before the power rule → what to do first
    back: |
      Rewrite as powers of x: ∛x = x^(1/3), 5/x² = 5x⁻², 1/√x = x^(−1/2). Only xⁿ with a constant n fits the rule.
    topic_code: "2.5"
  - front: Horizontal tangent line → the equation to solve
    back: |
      f′(x) = 0. For y = x³ − 12x + 1, 3x² − 12 = 0 gives x = −2 and x = 2.
    topic_code: "2.5"
  - front: Constant rule → statement and reason
    back: |
      d/dx [c] = 0 for any constant c: a horizontal line has slope 0 everywhere. So d/dx [π²] = 0 and d/dx [e³] = 0.
    topic_code: "2.6"
  - front: Constant multiple rule → statement
    back: |
      d/dx [k·f(x)] = k·f′(x). Constants factor straight through the derivative.
    topic_code: "2.6"
  - front: Sum and difference rules → statement
    back: |
      d/dx [f(x) ± g(x)] = f′(x) ± g′(x). Differentiate term by term.
    topic_code: "2.6"
  - front: Sum, difference and constant multiple rules → where they come from
    back: |
      From the limit properties of week 2 applied to the difference quotient: the limit of a sum is the sum of the limits, and constants factor out.
    topic_code: "2.6"
  - front: d/dx [6√x − x³ + 4/x] → result
    back: |
      3/√x − 3x² − 4/x² (from 6x^(1/2) − x³ + 4x⁻¹).
    topic_code: "2.6"
  - front: Tangent to f(x) = 6√x − x³ + 4/x at x = 1 → equation
    back: |
      f(1) = 9 and f′(1) = 3 − 3 − 4 = −4, so y = 9 − 4(x − 1), that is y = 13 − 4x.
    topic_code: "2.6"
  - front: (x² + 3x)/√x → how to differentiate without the quotient rule
    back: |
      Divide each term by x^(1/2): x^(3/2) + 3x^(1/2). Derivative: (3/2)√x + 3/(2√x).
    topic_code: "2.6"
  - front: (2x)³ → derivative without the chain rule
    back: |
      Expand first: (2x)³ = 8x³, so the derivative is 24x². Not 3(2x)² = 12x².
    topic_code: "2.6"
  - front: Polynomials → where they are differentiable
    back: |
      Everywhere. Each term axⁿ with n a whole number has derivative naxⁿ⁻¹, defined for all x.
    topic_code: "2.6"
  - front: d/dx [sin x] → result
    back: |
      cos x.
    topic_code: "2.7"
  - front: d/dx [cos x] → result (watch the sign)
    back: |
      −sin x.
    topic_code: "2.7"
  - front: d/dx [eˣ] → result and what makes e special
    back: |
      eˣ. e is the one base for which the exponential's slope at every point equals its height; equivalently lim (h→0) (eʰ − 1)/h = 1.
    topic_code: "2.7"
  - front: d/dx [ln x] → result and domain
    back: |
      1/x, for x > 0 (the domain of ln x).
    topic_code: "2.7"
  - front: Two special limits behind d/dx [sin x] → list
    back: |
      lim (h→0) sin h/h = 1 and lim (h→0) (cos h − 1)/h = 0, used after expanding sin(x + h) with the angle-sum identity.
    topic_code: "2.7"
  - front: d/dx [5 sin x − 2 cos x] → result
    back: |
      5 cos x + 2 sin x. The minus in front of 2 cos x meets the minus in −sin x.
    topic_code: "2.7"
  - front: d/dx [3eˣ − ln x + π²] → result
    back: |
      3eˣ − 1/x. π² is a constant, so its derivative is 0, not 2π.
    topic_code: "2.7"
  - front: Tangent to y = eˣ at x = 0 → equation
    back: |
      Point (0, 1), slope e⁰ = 1: y = x + 1.
    topic_code: "2.7"
  - front: Tangent to y = ln x at x = e → equation and a surprise
    back: |
      Point (e, 1), slope 1/e: y = 1 + (x − e)/e = x/e. The tangent passes through the origin.
    topic_code: "2.7"
  - front: Where y = sin x has slope 1/2 on [0, 2π) → x-values
    back: |
      cos x = 1/2 at x = π/3 and x = 5π/3.
    topic_code: "2.7"
  - front: lim (h→0) (sin(π/6 + h) − 1/2)/h → read as a derivative
    back: |
      f′(π/6) for f(x) = sin x, since sin(π/6) = 1/2. Value: cos(π/6) = √3/2.
    topic_code: "2.7"
  - front: Harbour depth model D(t) = 5 + 2 sin t − 0.1t → D′(t)
    back: |
      D′(t) = 2 cos t − 0.1 metres per hour. At t = 0 the depth is rising at 1.9 metres per hour.
    topic_code: "2.7"
  - front: Error-spot → "d/dx [eˣ] = x·eˣ⁻¹ by the power rule"
    back: |
      The power rule needs a constant exponent. In eˣ the variable is the exponent; the derivative is eˣ itself.
    topic_code: "2.7"
  - front: Error-spot → "d/dx [4/x²] = 4/(2x) = 2/x"
    back: |
      You cannot differentiate the denominator separately. Rewrite 4x⁻² and apply the power rule: −8x⁻³ = −8/x³.
    topic_code: "2.5"
  - front: Error-spot → "d/dx [π³] = 3π²"
    back: |
      π³ is a constant (about 31), not a power of x. Its derivative is 0.
    topic_code: "2.6"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 2.5, 2.6 and 2.7: the power rule, the constant,
    sum, difference and constant multiple rules, and the derivatives of sin x, cos x, eˣ and ln x), with 8
    questions (32%) reviewing weeks 3 to 7 (special trig limit, vertical asymptotes, average rates, recognising a
    limit as a derivative, estimating derivatives from a table, and differentiability). Opens with a
    shared-context set on one function. Multiple choice, select-all, true/false and numeric items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes. Only part (D) of the long answer is marked (Calculator.).
  questions:
    # ---- Stimulus set: one function (2.5, 2.6)
    - slug: apcalcab-u02-w08-q01
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Calculus CED, Topic 2.6"
      points: 1
      stimulus: |
        Let f(x) = 6√x − x³ + 4/x for x > 0.
      prompt: |
        Which expression is f′(x)?
      options:
        - "3/√x − 3x² + 4/x²"
        - "6/√x − 3x² − 4/x²"
        - "3/√x − 3x² − 4/x²"
        - "9√x − 3x² − 4/x²"
      option_explanations:
        - |
          The derivative of 4x⁻¹ is −4x⁻², so the last term must be −4/x²; the negative exponent brings down a negative sign.
        - |
          This forgets to multiply by the exponent 1/2: d/dx [6x^(1/2)] = 6 · (1/2)x^(−1/2) = 3/√x.
        - |
          Correct. Rewrite f(x) = 6x^(1/2) − x³ + 4x⁻¹; then f′(x) = 3x^(−1/2) − 3x² − 4x⁻² = 3/√x − 3x² − 4/x².
        - |
          This raises the exponent instead of lowering it: 6 · (3/2)x^(1/2) is what you get from x^(3/2), not from x^(1/2).
      answer: 2
    - slug: apcalcab-u02-w08-q02
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Calculus CED, Topic 2.6"
      points: 1
      stimulus: |
        Let f(x) = 6√x − x³ + 4/x for x > 0.
      prompt: |
        What is the value of f′(1)?
      options:
        - "−4"
        - "4"
        - "9"
        - "−1"
      option_explanations:
        - |
          Correct. f′(1) = 3/1 − 3(1) − 4/1 = 3 − 3 − 4 = −4.
        - |
          This uses +4/x² for the last term; the derivative of 4/x is −4/x², so the sum is 3 − 3 − 4.
        - |
          9 is f(1) = 6 − 1 + 4, the height of the graph, not its slope.
        - |
          This uses 6/√x for the first term (forgetting the factor 1/2), giving 6 − 3 − 4 = −1.
      answer: 0
    - slug: apcalcab-u02-w08-q03
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Calculus CED, Topic 2.6"
      points: 1
      stimulus: |
        Let f(x) = 6√x − x³ + 4/x for x > 0.
      prompt: |
        Which is an equation of the line tangent to the graph of f at x = 1?
      options:
        - "y = 9 − 4x"
        - "y = −4 + 9(x − 1)"
        - "y = 4x + 5"
        - "y = 13 − 4x"
      option_explanations:
        - |
          This treats f(1) = 9 as the y-intercept; the line must pass through (1, 9), but this one gives y = 5 at x = 1.
        - |
          This swaps the roles of the numbers: it uses f(1) = 9 as the slope and f′(1) = −4 as the height.
        - |
          The slope has the wrong sign: y = 9 + 4(x − 1) uses +4 instead of f′(1) = −4.
        - |
          Correct. f(1) = 9 and f′(1) = −4, so y = 9 − 4(x − 1) = 13 − 4x.
      answer: 3
    - slug: apcalcab-u02-w08-q04
      type: numeric
      topic_code: "2.5"
      source: "AP Calculus CED, Topic 2.5"
      points: 1
      stimulus: |
        Let f(x) = 6√x − x³ + 4/x for x > 0.
      prompt: |
        Find f′(4). Give the exact decimal value.
      answer: { value: -46.75, tolerance: 0.001 }
      explanation: |
        f′(4) = 3/√4 − 3(16) − 4/16 = 1.5 − 48 − 0.25 = −46.75.
    # ---- Independent items
    - slug: apcalcab-u02-w08-q05
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Calculus CED, Topic 2.5"
      points: 1
      prompt: |
        If y = 1/∛(x²), what is dy/dx?
      options:
        - "−(2/3)x^(−1/3)"
        - "−(2/3)x^(−5/3)"
        - "(2/3)x^(−5/3)"
        - "−1/(3∛x)"
      option_explanations:
        - |
          The exponent was raised instead of lowered: from −2/3, subtracting 1 gives −5/3, not −1/3.
        - |
          Correct. y = x^(−2/3), so dy/dx = −(2/3)x^(−2/3 − 1) = −(2/3)x^(−5/3).
        - |
          This drops the sign: the exponent −2/3 is brought down as the coefficient, so the derivative is negative, −(2/3)x^(−5/3).
        - |
          −1/(3∛x) is −(1/3)x^(−1/3): it moves the exponent the wrong way (to −1/3 instead of −5/3) and loses the factor 2. Rewrite y = x^(−2/3) and subtract 1 from the exponent.
      answer: 1
    - slug: apcalcab-u02-w08-q06
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Calculus CED, Topic 2.7"
      points: 1
      prompt: |
        What is d/dx [5 sin x − 2 cos x]?
      options:
        - "5 cos x − 2 sin x"
        - "−5 cos x + 2 sin x"
        - "5 cos x + 2 sin x"
        - "5 cos x + 2 cos x"
      option_explanations:
        - |
          This uses d/dx [cos x] = sin x; the derivative of cos x is −sin x, so −2 cos x becomes +2 sin x.
        - |
          The derivative of sin x is +cos x, not −cos x; the negative sign belongs to the derivative of cos x.
        - |
          Correct. d/dx [5 sin x] = 5 cos x and d/dx [−2 cos x] = −2(−sin x) = 2 sin x.
        - |
          The second term was differentiated as if cos x were its own derivative; d/dx [cos x] = −sin x.
      answer: 2
    - slug: apcalcab-u02-w08-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Calculus CED, Topic 2.7"
      points: 1
      prompt: |
        What is d/dx [3eˣ − ln x + π²]?
      options:
        - "3eˣ − 1/x + 2π"
        - "3xeˣ⁻¹ − 1/x"
        - "3eˣ − ln x"
        - "3eˣ − 1/x"
      option_explanations:
        - |
          π² is a constant (about 9.87), so its derivative is 0, not 2π.
        - |
          This applies the power rule to eˣ, but there the variable is in the exponent; d/dx [eˣ] = eˣ.
        - |
          The derivative of ln x is 1/x; ln x does not stay unchanged the way eˣ does.
        - |
          Correct. d/dx [3eˣ] = 3eˣ, d/dx [ln x] = 1/x and d/dx [π²] = 0.
      answer: 3
    - slug: apcalcab-u02-w08-q08
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Calculus CED, Topic 2.7"
      points: 1
      prompt: |
        Which is an equation of the line tangent to the graph of y = ln x at x = e?
      options:
        - "y = x/e"
        - "y = 1 + e(x − e)"
        - "y = (x − e)/e"
        - "y = 1 + (x − 1)/e"
      option_explanations:
        - |
          Correct. ln e = 1 and the slope is 1/e, so y = 1 + (1/e)(x − e) = x/e.
        - |
          This uses e as the slope, as if the derivative of ln x were x; the derivative is 1/x, which is 1/e at x = e.
        - |
          This has the right slope but passes through (e, 0); the point of tangency is (e, ln e) = (e, 1).
        - |
          This uses x = 1 as the point of tangency; the tangent line must pass through (e, 1) and so uses x − e.
      answer: 0
    - slug: apcalcab-u02-w08-q09
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Calculus CED, Topic 2.5"
      points: 1
      prompt: |
        At which x-values does the graph of y = x³ − 12x + 1 have a horizontal tangent line?
      options:
        - "x = 4 only"
        - "x = −2 and x = 2"
        - "x = 0 only"
        - "x = −2√3, x = 0 and x = 2√3"
      option_explanations:
        - |
          This drops the square root: 3x² − 12 = 0 gives x² = 4, not x = 4.
        - |
          Correct. dy/dx = 3x² − 12 = 0 gives x² = 4, so x = −2 or x = 2.
        - |
          x = 0 is where the slope is −12, the steepest descent, not where it is 0.
        - |
          These are the zeros of x³ − 12x, where the graph of x³ − 12x crosses the axis, not where the slope is 0.
      answer: 1
    - slug: apcalcab-u02-w08-q10
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Calculus CED, Topic 2.2"
      points: 1
      prompt: |
        What is the value of lim (h→0) (sin(π/6 + h) − 1/2)/h?
      options:
        - "1/2"
        - "0"
        - "√3/2"
        - "−√3/2"
      option_explanations:
        - |
          1/2 is sin(π/6), the value of the function at the point, not its derivative there.
        - |
          The numerator and denominator both tend to 0, but the quotient tends to the slope of sin x at π/6, which is not 0.
        - |
          Correct. Since sin(π/6) = 1/2, this is f′(π/6) for f(x) = sin x, which is cos(π/6) = √3/2.
        - |
          This uses −sin x as the derivative's sign pattern; the derivative of sin x is +cos x, and cos(π/6) is positive.
      answer: 2
    # ---- Review items
    - slug: apcalcab-u02-w08-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Calculus CED, Topic 2.2"
      points: 1
      prompt: |
        What is lim (x→2) (x⁵ − 32)/(x − 2)?
      options:
        - "32"
        - "0"
        - "16"
        - "80"
      option_explanations:
        - |
          32 is f(2) = 2⁵, the function value; the limit is the slope at x = 2.
        - |
          Substitution gives 0/0, which is indeterminate, not 0; the limit is a derivative.
        - |
          16 is 2⁴, which forgets to bring down the exponent 5 from the power rule.
        - |
          Correct. This is the x-form of f′(2) for f(x) = x⁵, and f′(x) = 5x⁴, so the value is 5 · 16 = 80.
      answer: 3
    - slug: apcalcab-u02-w08-q12
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Calculus CED, Topic 2.4"
      points: 1
      prompt: |
        Which function is differentiable at x = 0?
      options:
        - "f(x) = x^(4/3)"
        - "f(x) = x^(2/3)"
        - "f(x) = x^(1/3)"
        - "f(x) = |x|"
      option_explanations:
        - |
          Correct. The difference quotient at 0 is h^(4/3)/h = h^(1/3) → 0 from both sides, so f′(0) = 0 (matching (4/3)x^(1/3) at 0).
        - |
          The quotient h^(2/3)/h = 1/h^(1/3) tends to ∞ from the right and −∞ from the left: a cusp, so no derivative.
        - |
          The quotient h^(1/3)/h = 1/h^(2/3) tends to ∞ from both sides: a vertical tangent, so no derivative.
        - |
          |x| has a corner at 0, with one-sided slopes −1 and 1, so it is not differentiable there.
      answer: 0
    - slug: apcalcab-u02-w08-q13
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Calculus CED, Topic 2.3"
      points: 1
      prompt: |
        Rainwater collects in a tank. The total collected, R(t), in thousands of litres, is recorded at selected times t hours after a storm begins (hypothetical data). R is differentiable.

        | t (hours) | 0 | 3 | 7 | 10 |
        |---|---|---|---|---|
        | R(t) (thousand litres) | 12 | 18 | 30 | 33 |

        What is the best estimate of R′(5) from the data?
      options:
        - "12 thousand litres per hour"
        - "3 thousand litres per hour"
        - "About 2.57 thousand litres per hour"
        - "2.1 thousand litres per hour"
      option_explanations:
        - |
          12 is the change in R from t = 3 to t = 7; it must be divided by the 4 hours between them.
        - |
          Correct. t = 3 and t = 7 bracket t = 5 most closely, so R′(5) ≈ (30 − 18)/(7 − 3) = 12/4 = 3 thousand litres per hour.
        - |
          This uses [0, 7], (30 − 12)/7; the data at t = 3 are closer to t = 5.
        - |
          This is the average rate over the whole record, (33 − 12)/10, which is too coarse an estimate at t = 5.
      answer: 1
    - slug: apcalcab-u02-w08-q14
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Calculus CED, Topic 2.1"
      points: 1
      prompt: |
        What is the average rate of change of f(x) = sin x on the interval [0, π/2]?
      options:
        - "1"
        - "π/2"
        - "2/π"
        - "0"
      option_explanations:
        - |
          1 is the change sin(π/2) − sin 0; it must be divided by the width of the interval, π/2.
        - |
          This inverts the quotient, dividing the change in x by the change in f.
        - |
          Correct. (sin(π/2) − sin 0)/(π/2 − 0) = 1/(π/2) = 2/π, about 0.637.
        - |
          0 is the instantaneous rate cos(π/2) at the right endpoint, not the average over the interval.
      answer: 2
    - slug: apcalcab-u02-w08-q15
      type: multiple_choice
      topic_code: "1.14"
      source: "AP Calculus CED, Topic 1.14"
      points: 1
      prompt: |
        Which lines are vertical asymptotes of the graph of f(x) = (x + 1)/(x² − 1)?
      options:
        - "x = 1 and x = −1"
        - "x = −1 only"
        - "y = 0 only"
        - "x = 1 only"
      option_explanations:
        - |
          At x = −1 the factor x + 1 cancels, leaving 1/(x − 1), which tends to −1/2: a hole, not an asymptote.
        - |
          x = −1 is a removable discontinuity (a hole at (−1, −1/2)); the asymptote is where the denominator alone vanishes.
        - |
          y = 0 is the horizontal asymptote (end behaviour), not a vertical one.
        - |
          Correct. f(x) = 1/(x − 1) for x ≠ −1, which is unbounded as x → 1; at x = −1 the limit is −1/2, a hole.
      answer: 3
    - slug: apcalcab-u02-w08-q16
      type: multi_select
      topic_code: "2.6"
      source: "AP Calculus CED, Topic 2.6"
      points: 2
      partial_credit: true
      prompt: |
        Which functions have derivative 2x? Select all that apply.
      options:
        - "x² + 7"
        - "x² − π³"
        - "(x + 1)² − 2x"
        - "x² + 7x"
        - "2x²/2 + 2x"
      option_explanations:
        - |
          Correct. d/dx [x²] = 2x and the constant 7 has derivative 0.
        - |
          Correct. π³ is a constant, so its derivative is 0.
        - |
          Correct. (x + 1)² − 2x = x² + 1, whose derivative is 2x.
        - |
          7x is not constant; its derivative 7 adds on, giving 2x + 7.
        - |
          2x²/2 + 2x = x² + 2x, whose derivative is 2x + 2.
      answer: [0, 1, 2]
    - slug: apcalcab-u02-w08-q17
      type: multi_select
      topic_code: "2.7"
      source: "AP Calculus CED, Topic 2.7"
      points: 2
      partial_credit: true
      prompt: |
        At which x-values in [0, 2π) does the graph of y = sin x have a tangent line of slope 1/2? Select all that apply.
      options:
        - "π/6"
        - "π/3"
