    - slug: apcalcab-u02-w08-q23
      type: short_answer
      topic_code: "2.6"
      source: "AP Calculus CED, Topic 2.6"
      points: 3
      prompt: |
        Let k(x) = (x² + 3x)/√x for x > 0.
        (a) Rewrite k(x) as a sum of powers of x.
        (b) Find k′(x).
        (c) Find k′(4).
      answer: |
        (a) k(x) = x²/x^(1/2) + 3x/x^(1/2) = x^(3/2) + 3x^(1/2).
        (b) k′(x) = (3/2)x^(1/2) + (3/2)x^(−1/2) = (3/2)√x + 3/(2√x).
        (c) k′(4) = (3/2)(2) + 3/(2 · 2) = 3 + 3/4 = 15/4 = 3.75.
      explanation: |
        Three points, one per part. (a) x^(3/2) + 3x^(1/2). (b) (3/2)√x + 3/(2√x) or an equivalent form, consistent with (a). (c) 15/4 or 3.75. Differentiating the numerator and denominator separately earns no credit in (b).
    - slug: apcalcab-u02-w08-q24
      type: short_answer
      topic_code: "2.4"
      source: "AP Calculus CED, Topic 2.4"
      points: 2
      prompt: |
        Let f(x) = eˣ for x ≤ 0 and f(x) = x + 1 for x > 0. Is f differentiable at x = 0? Justify your answer by checking continuity and the one-sided derivatives.
      answer: |
        Yes. Continuity: lim (x→0⁻) eˣ = 1, lim (x→0⁺) (x + 1) = 1 and f(0) = e⁰ = 1, so f is continuous at 0. Slopes: the left piece has derivative eˣ, which is e⁰ = 1 at x = 0, and the right piece has derivative 1. The one-sided derivatives agree, so f′(0) = 1 exists. (The line y = x + 1 is the tangent line to eˣ at x = 0.)
      explanation: |
        Two points. 1 point for showing continuity at 0 (both one-sided limits equal f(0) = 1). 1 point for showing that both one-sided derivatives equal 1 and concluding f is differentiable.
    - slug: apcalcab-u02-w08-q25
      type: long_answer
      topic_code: "2.7"
      source: "AP Calculus CED, Topic 2.7"
      points: 6
      prompt: |
        A hypothetical model for the depth of water at a harbour entrance is D(t) = 5 + 2 sin t − 0.1t metres, where t is measured in hours after midnight, for 0 ≤ t ≤ 6.
        (A) Find D′(t). Then find D′(0) and interpret it in context, with units.
        (B) Find D′(π). Is the depth increasing or decreasing at t = π hours? Explain.
        (C) Find the average rate of change of D over 0 ≤ t ≤ π, with units.
        (D) (Calculator.) Find all times t in 0 < t < 6 at which D′(t) = 0. Give your answers to three decimal places.
      answer: |
        (A) D′(t) = 2 cos t − 0.1. D′(0) = 2 − 0.1 = 1.9: at midnight the depth of the water is increasing at 1.9 metres per hour.
        (B) D′(π) = 2 cos π − 0.1 = −2 − 0.1 = −2.1. Since D′(π) < 0, the depth is decreasing at t = π hours, at 2.1 metres per hour.
        (C) D(0) = 5 and D(π) = 5 + 2 sin π − 0.1π = 5 − 0.1π. The average rate is (5 − 0.1π − 5)/(π − 0) = −0.1 metres per hour.
        (D) 2 cos t − 0.1 = 0 means cos t = 0.05. In 0 < t < 6 the solutions are t = arccos(0.05) ≈ 1.521 and t = 2π − arccos(0.05) ≈ 4.762 hours.
      explanation: |
        Six points. (A) 1 point for D′(t) = 2 cos t − 0.1; 1 point for D′(0) = 1.9 with an interpretation naming the time (midnight, t = 0), "increasing" and metres per hour. (B) 1 point for −2.1 and "decreasing" justified by D′(π) < 0. (C) 1 point for −0.1 metres per hour (exact work shown). (D) 1 point for t ≈ 1.521; 1 point for t ≈ 4.762. Answers within 0.001 are accepted.
