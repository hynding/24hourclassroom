    - slug: apcalcab-u02-w07-q18
      type: true_false
      topic_code: "2.4"
      source: "AP Calculus CED, Topic 2.4"
      points: 1
      prompt: |
        True or false: If f is differentiable at x = a, then f is continuous at x = a.
      answer: true
      explanation: |
        True. If f′(a) exists, then f(a + h) − f(a) = h · (f(a + h) − f(a))/h → 0 · f′(a) = 0 as h → 0, so lim (h→0) f(a + h) = f(a).
    - slug: apcalcab-u02-w07-q19
