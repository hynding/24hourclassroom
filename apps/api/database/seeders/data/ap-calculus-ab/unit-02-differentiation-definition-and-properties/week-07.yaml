    - slug: apcalcab-u02-w07-q23
      type: short_answer
      topic_code: "2.4"
      source: "AP Calculus CED, Topic 2.4"
      points: 3
      prompt: |
        Let f(x) = ax² + b for x ≤ 2 and f(x) = 8x − 4 for x > 2, where a and b are constants. You may use the fact that the derivative of x² is 2x.
        (a) Write the condition on a and b that makes f continuous at x = 2.
        (b) Find the values of a and b that make f differentiable at x = 2, and justify.
      answer: |
        (a) The left piece gives 4a + b at x = 2 and the right piece tends to 8(2) − 4 = 12, so continuity requires 4a + b = 12.
        (b) Differentiability also needs the one-sided slopes to match: the left piece has slope 2a · 2 = 4a at x = 2 and the right piece has slope 8, so 4a = 8 and a = 2. Then 4(2) + b = 12 gives b = 4. With a = 2 and b = 4, f is continuous and its one-sided derivatives are both 8, so f′(2) = 8 exists.
      explanation: |
        Three points. (a) 1 point for 4a + b = 12. (b) 1 point for matching slopes 4a = 8 (a = 2); 1 point for b = 4 with the statement that both continuity and equal one-sided derivatives are needed. Finding a and b from the slope condition alone, without checking continuity, earns at most 2 points.
    - slug: apcalcab-u02-w07-q24
      type: short_answer
      topic_code: "1.16"
      source: "AP Calculus CED, Topic 1.16"
      points: 2
      prompt: |
        A function h is continuous on [0, 4] and has the values below.

        | x | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | h(x) | 5 | 1 | −2 | 3 | 6 |

        What is the least number of solutions the equation h(x) = 0 must have on [0, 4]? Justify your answer.
      answer: |
        At least 2. h is continuous on [1, 2] with h(1) = 1 > 0 and h(2) = −2 < 0, so by the Intermediate Value Theorem h(c) = 0 for some c in (1, 2). Likewise h is continuous on [2, 3] with h(2) = −2 < 0 < 3 = h(3), so h(d) = 0 for some d in (2, 3). These intervals do not overlap, so c ≠ d.
      explanation: |
        Two points. 1 point for the answer 2 with the two intervals (1, 2) and (2, 3). 1 point for invoking the Intermediate Value Theorem with its hypotheses: continuity on each closed interval and 0 between the endpoint values.
    - slug: apcalcab-u02-w07-q25
      type: long_answer
      topic_code: "2.3"
      source: "AP Calculus CED, Topic 2.3"
      points: 6
      prompt: |
        A hiker climbs a trail. Her elevation above sea level, E(t), in metres, is recorded at selected times t hours after she starts. E is differentiable on 0 < t < 4, and the data are hypothetical.

        | t (hours) | 0 | 1 | 1.5 | 3 | 4 |
        |---|---|---|---|---|---|
        | E(t) (m) | 1200 | 1450 | 1520 | 1610 | 1580 |

        (A) Use the data to estimate E′(1.25). Show the computation and interpret your answer in context, with units.
        (B) Find the average rate of change of E over 0 ≤ t ≤ 4, with units.
        (C) Use the secant line through the data at t = 1.5 and t = 3 to estimate E(2).
        (D) A simpler model for the first 1.5 hours is M(t) = 1200 + 250t for 0 ≤ t ≤ 1 and M(t) = 1450 + 140(t − 1) for 1 < t ≤ 1.5. Is M continuous at t = 1? Is M differentiable at t = 1? Justify both answers.
      answer: |
        (A) E′(1.25) ≈ (E(1.5) − E(1))/(1.5 − 1) = (1520 − 1450)/0.5 = 140 metres per hour. About 1 hour 15 minutes into the hike, her elevation is increasing at roughly 140 metres per hour.
        (B) (E(4) − E(0))/(4 − 0) = (1580 − 1200)/4 = 380/4 = 95 metres per hour.
        (C) The secant slope is (1610 − 1520)/(3 − 1.5) = 90/1.5 = 60 metres per hour, so E(2) ≈ 1520 + 60(2 − 1.5) = 1550 metres.
        (D) Continuous: lim (t→1⁻) M(t) = 1200 + 250 = 1450, lim (t→1⁺) M(t) = 1450 + 0 = 1450, and M(1) = 1450. Not differentiable: the left-hand rate is 250 metres per hour and the right-hand rate is 140 metres per hour; the one-sided derivatives differ, so the graph has a corner at t = 1 and M′(1) does not exist.
      explanation: |
        Six points. (A) 1 point for 140 from the bracketing data at t = 1 and t = 1.5; 1 point for an interpretation naming the time (t = 1.25 hours), "increasing" and metres per hour. (B) 1 point for 95 metres per hour. (C) 1 point for 1550 metres from the secant line. (D) 1 point for continuity justified by both one-sided limits equalling M(1) = 1450; 1 point for "not differentiable" justified by the unequal one-sided rates 250 and 140.
