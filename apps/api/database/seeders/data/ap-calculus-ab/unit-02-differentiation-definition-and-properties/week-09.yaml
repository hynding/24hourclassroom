week: 9
unit: 2
title: "The Product Rule, the Quotient Rule, and the Other Trigonometric Derivatives"
topics: ["2.8", "2.9", "2.10"]
guide: guides/week-09.md
guide_description: |
  The product rule and why the derivative of a product is not the product of the derivatives; the quotient rule
  and its order of subtraction; choosing between the rules and simplifying first; and the derivatives of tan x,
  cot x, sec x and csc x, derived with the quotient rule. Worked examples: the product rule from a table of values,
  x³eˣ, the quotient (2x + 1)/(x − 3), deriving d/dx [tan x] and the tangent line at π/4, and a hypothetical
  bakery's revenue as price times quantity.
flashcards_description: |
  30 cards on the product and quotient rules, using them with tables of values, when to simplify instead, the
  derivatives of tan x, cot x, sec x and csc x, and revenue and average-cost rates in context.

flashcards:
  - front: Product rule → statement
    back: |
      d/dx [f(x)·g(x)] = f′(x)g(x) + f(x)g′(x): derivative of the first times the second, plus the first times the derivative of the second.
    topic_code: "2.8"
  - front: Product rule → why it is not f′(x)·g′(x)
    back: |
      Test with x · x = x²: the derivative is 2x, but f′g′ = 1 · 1 = 1. When both factors change, each change is multiplied by the other factor.
    topic_code: "2.8"
  - front: Product rule as area of a rectangle → picture
    back: |
      A rectangle with sides f and g grows by two strips, (Δf)·g and f·(Δg), plus a tiny corner Δf·Δg that vanishes in the limit.
    topic_code: "2.8"
  - front: d/dx [x² sin x] → result
    back: |
      2x sin x + x² cos x.
    topic_code: "2.8"
  - front: d/dx [x³eˣ] → result and value at x = 1
    back: |
      3x²eˣ + x³eˣ = x²eˣ(3 + x). At x = 1: 4e.
    topic_code: "2.8"
  - front: d/dx [x² eˣ] → three equivalent forms
    back: |
      2xeˣ + x²eˣ = eˣ(x² + 2x) = xeˣ(x + 2).
    topic_code: "2.8"
  - front: Product rule from a table, p = f·g with f(2) = −1, f′(2) = 4, g(2) = 2, g′(2) = −3 → p′(2)
    back: |
      p′(2) = f′(2)g(2) + f(2)g′(2) = 4 · 2 + (−1)(−3) = 11.
    topic_code: "2.8"
  - front: Product of three functions f·g·h → derivative
    back: |
      f′gh + fg′h + fgh′: differentiate one factor at a time and add.
    topic_code: "2.8"
  - front: Revenue R = N·P (items sold times price) → R′
    back: |
      R′ = N′·P + N·P′. Revenue changes because sales change at the current price and because the price changes on the current sales.
    topic_code: "2.8"
  - front: Bakery with N(4) = 120, N′(4) = −6, P(4) = 15, P′(4) = 0.5 → R′(4)
    back: |
      R′(4) = (−6)(15) + (120)(0.5) = −90 + 60 = −30 dollars per day, per day: revenue is falling though the price is rising.
    topic_code: "2.8"
  - front: Quotient rule → statement
    back: |
      d/dx [f(x)/g(x)] = (f′(x)g(x) − f(x)g′(x))/[g(x)]², where g(x) ≠ 0. "Low d-high minus high d-low, over low squared."
    topic_code: "2.9"
  - front: Quotient rule → the order that matters
    back: |
      The numerator starts with the derivative of the top: f′g − fg′. Swapping the order flips the sign of the answer.
    topic_code: "2.9"
  - front: d/dx [(2x + 1)/(x − 3)] → result
    back: |
      (2(x − 3) − (2x + 1)(1))/(x − 3)² = −7/(x − 3)².
    topic_code: "2.9"
  - front: Quotient rule from a table, q = f/g with f(1) = 3, f′(1) = −2, g(1) = 4, g′(1) = 5 → q′(1)
    back: |
      ((−2)(4) − (3)(5))/4² = (−8 − 15)/16 = −23/16.
    topic_code: "2.9"
  - front: Tangent to y = x/(x + 1) at x = 1 → equation
    back: |
      y(1) = 1/2 and y′ = 1/(x + 1)², so the slope is 1/4: y = 1/2 + (1/4)(x − 1).
    topic_code: "2.9"
  - front: d/dx [eˣ/x] → result
    back: |
      (eˣ·x − eˣ·1)/x² = eˣ(x − 1)/x². It is 0 at x = 1, a horizontal tangent.
    topic_code: "2.9"
  - front: Constant over a function, like 5/x³ → quotient rule or power rule?
    back: |
      Power rule: 5x⁻³ has derivative −15x⁻⁴. A constant numerator or denominator never needs the quotient rule.
    topic_code: "2.9"
  - front: Average cost A = C/N (total cost over items) → A′
    back: |
      A′ = (C′N − CN′)/N². With C = 900, C′ = 30, N = 120, N′ = −6: A′ = (3600 + 5400)/14400 = 0.625 dollars per item, per day.
    topic_code: "2.9"
  - front: d/dx [tan x] → result
    back: |
      sec² x.
    topic_code: "2.10"
  - front: d/dx [cot x] → result
    back: |
      −csc² x.
    topic_code: "2.10"
  - front: d/dx [sec x] → result
    back: |
      sec x tan x.
    topic_code: "2.10"
  - front: d/dx [csc x] → result
    back: |
      −csc x cot x.
    topic_code: "2.10"
  - front: The "co-" trig derivatives (cos, cot, csc) → sign pattern
    back: |
      Each has a minus sign: −sin x, −csc² x, −csc x cot x. The derivatives of sin, tan, sec are positive in form.
    topic_code: "2.10"
  - front: d/dx [tan x] from the quotient rule → the key step
    back: |
      (cos x · cos x − sin x · (−sin x))/cos² x = (cos² x + sin² x)/cos² x = 1/cos² x = sec² x.
    topic_code: "2.10"
  - front: Slope of y = tan x at x = π/4 → value and tangent line
    back: |
      sec²(π/4) = (√2)² = 2. Point (π/4, 1): y = 1 + 2(x − π/4).
    topic_code: "2.10"
  - front: d/dx [3 tan x − csc x] → result
    back: |
      3 sec² x + csc x cot x.
    topic_code: "2.10"
  - front: tan x at x = π/2 → differentiable?
    back: |
      No: tan x is undefined there (a vertical asymptote), so it is not continuous and cannot be differentiable.
    topic_code: "2.10"
  - front: Error-spot → "d/dx [x² sin x] = 2x cos x"
    back: |
      That is the product of the derivatives. The product rule gives 2x sin x + x² cos x.
    topic_code: "2.8"
  - front: Error-spot → "d/dx [(2x + 1)/(x − 3)] = 7/(x − 3)²"
    back: |
      The numerator was subtracted in the wrong order (fg′ − f′g). The top's derivative goes first: the answer is −7/(x − 3)².
    topic_code: "2.9"
  - front: Error-spot → "d/dx [sec x] = tan² x"
    back: |
      d/dx [sec x] = sec x tan x. (sec² x is the derivative of tan x; tan² x is neither derivative.)
    topic_code: "2.10"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 2.8, 2.9 and 2.10: the product rule, the quotient
    rule, and the derivatives of tan x, cot x, sec x and csc x), with 8 questions (32%) reviewing weeks 2 to 8
    (algebraic limits, vertical asymptotes, differentiability, the power rule and the derivatives of sin x, cos x,
    eˣ and ln x). Opens with a shared-context set on a table of function and derivative values. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically;
    the short answers and the long answer are graded by your teacher against the scoring notes. No calculator is
    needed; one numeric answer uses e² ≈ 7.389.
  questions:
    # ---- Stimulus set: a table of values (2.8, 2.9)
    - slug: apcalcab-u02-w09-q01
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Calculus CED, Topic 2.8"
      points: 1
      stimulus: |
        The differentiable functions f and g have the values below.

        | x | f(x) | f′(x) | g(x) | g′(x) |
        |---|---|---|---|---|
        | 1 | 3 | −2 | 4 | 5 |
        | 2 | −1 | 4 | 2 | −3 |
        | 3 | 2 | 1 | −5 | 6 |
      prompt: |
        Let p(x) = f(x)g(x). What is p′(2)?
      options:
        - "−12"
        - "11"
        - "5"
        - "−2"
      option_explanations:
        - |
          −12 is f′(2)g′(2) = 4 · (−3), the product of the derivatives, which is not the derivative of the product.
        - |
          Correct. p′(2) = f′(2)g(2) + f(2)g′(2) = 4 · 2 + (−1)(−3) = 8 + 3 = 11.
        - |
          5 subtracts the two terms, 8 − 3, as in a quotient-rule numerator; the product rule adds them.
        - |
          −2 is p(2) = f(2)g(2) = (−1)(2), the value of the product, not its derivative.
      answer: 1
    - slug: apcalcab-u02-w09-q02
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Calculus CED, Topic 2.9"
      points: 1
      stimulus: |
        The differentiable functions f and g have the values below.

        | x | f(x) | f′(x) | g(x) | g′(x) |
        |---|---|---|---|---|
        | 1 | 3 | −2 | 4 | 5 |
        | 2 | −1 | 4 | 2 | −3 |
        | 3 | 2 | 1 | −5 | 6 |
      prompt: |
        Let q(x) = f(x)/g(x). What is q′(1)?
      options:
        - "23/16"
        - "−2/5"
        - "−23/16"
        - "−23/4"
      option_explanations:
        - |
          This subtracts in the wrong order, (f g′ − f′ g)/g², which flips the sign of the correct answer.
        - |
          −2/5 is f′(1)/g′(1), the quotient of the derivatives, which is not the derivative of the quotient.
        - |
          Correct. q′(1) = (f′(1)g(1) − f(1)g′(1))/[g(1)]² = ((−2)(4) − (3)(5))/16 = −23/16.
        - |
          This divides by g(1) = 4 instead of [g(1)]² = 16.
      answer: 2
    - slug: apcalcab-u02-w09-q03
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Calculus CED, Topic 2.8"
      points: 1
      stimulus: |
        The differentiable functions f and g have the values below.

        | x | f(x) | f′(x) | g(x) | g′(x) |
        |---|---|---|---|---|
        | 1 | 3 | −2 | 4 | 5 |
        | 2 | −1 | 4 | 2 | −3 |
        | 3 | 2 | 1 | −5 | 6 |
      prompt: |
        Let h(x) = x² f(x). What is h′(3)?
      options:
        - "21"
        - "6"
        - "12"
        - "9"
      option_explanations:
        - |
          Correct. h′(x) = 2x f(x) + x² f′(x), so h′(3) = 2(3)(2) + 9(1) = 12 + 9 = 21.
        - |
          6 is 2x · f′(x) at x = 3, the product of the two derivatives.
        - |
          12 is only the first term 2x f(x); the term x² f′(x) = 9 is missing.
        - |
          9 is only the second term x² f′(x); the term 2x f(x) = 12 is missing.
      answer: 0
    - slug: apcalcab-u02-w09-q04
      type: fill_blank
      topic_code: "2.9"
      source: "AP Calculus CED, Topic 2.9"
      points: 1
      stimulus: |
        The differentiable functions f and g have the values below.

        | x | f(x) | f′(x) | g(x) | g′(x) |
        |---|---|---|---|---|
        | 1 | 3 | −2 | 4 | 5 |
        | 2 | −1 | 4 | 2 | −3 |
        | 3 | 2 | 1 | −5 | 6 |
      prompt: |
        The derivative of g(x)/x at x = 2 is ____.
      answer: ["-2", "−2"]
      explanation: |
        By the quotient rule, d/dx [g(x)/x] = (g′(x) · x − g(x) · 1)/x². At x = 2: ((−3)(2) − 2)/4 = −8/4 = −2.
    # ---- Independent items
    - slug: apcalcab-u02-w09-q05
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Calculus CED, Topic 2.8"
      points: 1
      prompt: |
        What is d/dx [x² sin x]?
      options:
        - "2x cos x"
        - "2x sin x − x² cos x"
        - "x² cos x"
        - "2x sin x + x² cos x"
      option_explanations:
        - |
          2x cos x multiplies the two derivatives; the product rule needs f′g + fg′.
        - |
          The two product-rule terms are added, not subtracted; the minus sign belongs to the quotient rule.
        - |
          This differentiates only sin x and leaves x² as if it were a constant; x² changes too.
        - |
          Correct. (x²)′ sin x + x² (sin x)′ = 2x sin x + x² cos x.
      answer: 3
    - slug: apcalcab-u02-w09-q06
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Calculus CED, Topic 2.8"
      points: 1
      prompt: |
        Let k(x) = x³eˣ. What is k′(1)?
      options:
        - "3e"
        - "4e"
        - "e"
        - "4"
      option_explanations:
        - |
          3e is the product of the derivatives, 3x² · eˣ at x = 1; the term x³eˣ = e is missing.
        - |
          Correct. k′(x) = 3x²eˣ + x³eˣ, so k′(1) = 3e + e = 4e.
        - |
          e is k(1) = 1 · e, the function value, or only the second product-rule term.
        - |
          This drops the factor e¹ = e from both terms; eˣ at x = 1 is e, not 1.
      answer: 1
    - slug: apcalcab-u02-w09-q07
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Calculus CED, Topic 2.9"
      points: 1
      prompt: |
        What is d/dx [(2x + 1)/(x − 3)]?
      options:
        - "7/(x − 3)²"
        - "2"
        - "−7/(x − 3)²"
        - "−7/(x − 3)"
      option_explanations:
        - |
          The numerator was subtracted in the wrong order: (2x + 1)(1) − 2(x − 3) = 7 gives the opposite sign.
        - |
          2 is the derivative of the top divided by the derivative of the bottom, 2/1, which is not the quotient rule.
        - |
          Correct. (2(x − 3) − (2x + 1)(1))/(x − 3)² = (2x − 6 − 2x − 1)/(x − 3)² = −7/(x − 3)².
        - |
          The denominator must be squared: the quotient rule divides by [g(x)]² = (x − 3)².
      answer: 2
    - slug: apcalcab-u02-w09-q08
      type: multiple_choice
      topic_code: "2.10"
      source: "AP Calculus CED, Topic 2.10"
      points: 1
      prompt: |
        What is d/dx [3 tan x − csc x]?
      options:
        - "3 sec² x + csc x cot x"
        - "3 sec² x − csc x cot x"
        - "3 sec x tan x + csc x cot x"
        - "−3 csc² x + csc x cot x"
      option_explanations:
        - |
          Correct. d/dx [tan x] = sec² x and d/dx [csc x] = −csc x cot x, so −csc x differentiates to +csc x cot x.
        - |
          This forgets that the derivative of csc x is already negative; subtracting it gives a plus sign.
        - |
          3 sec x tan x is the derivative of 3 sec x, not of 3 tan x; d/dx [tan x] = sec² x.
        - |
          −csc² x is the derivative of cot x, not tan x.
      answer: 0
    - slug: apcalcab-u02-w09-q09
      type: multiple_choice
      topic_code: "2.10"
      source: "AP Calculus CED, Topic 2.10"
      points: 1
      prompt: |
        What is the slope of the graph of y = tan x at x = π/4?
      options:
        - "1"
        - "2"
        - "√2"
        - "1/2"
      option_explanations:
        - |
          1 is tan(π/4), the height of the graph, not its slope.
        - |
          Correct. dy/dx = sec² x, and sec(π/4) = √2, so the slope is (√2)² = 2.
        - |
          √2 is sec(π/4); the derivative of tan x is sec x squared.
        - |
          1/2 is cos²(π/4); the slope is its reciprocal, sec²(π/4).
      answer: 1
    - slug: apcalcab-u02-w09-q10
      type: multiple_choice
      topic_code: "2.10"
      source: "AP Calculus CED, Topic 2.10"
      points: 1
      prompt: |
        Applying the quotient rule to cot x = cos x/sin x and simplifying gives which result?
      options:
        - "csc² x"
        - "−sec² x"
        - "−csc² x"
        - "−csc x cot x"
      option_explanations:
        - |
          The sign is lost: the numerator is (−sin x)(sin x) − (cos x)(cos x) = −(sin² x + cos² x) = −1.
        - |
          −sec² x = −1/cos² x, but the quotient rule divides by the denominator squared, sin² x, not cos² x.
        - |
          Correct. ((−sin x)(sin x) − (cos x)(cos x))/sin² x = −1/sin² x = −csc² x.
        - |
          −csc x cot x is the derivative of csc x, not of cot x.
      answer: 2
    - slug: apcalcab-u02-w09-q11
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Calculus CED, Topic 2.9"
      points: 1
      prompt: |
        Which is an equation of the line tangent to the graph of y = x/(x + 1) at x = 1?
      options:
        - "y = 1/2 − (1/4)(x − 1)"
        - "y = 1/4 + (1/2)(x − 1)"
        - "y = 1/2 + (x − 1)"
        - "y = 1/2 + (1/4)(x − 1)"
      option_explanations:
        - |
          The slope has the wrong sign, from subtracting the quotient-rule terms in the wrong order.
        - |
          This swaps the height and the slope: the point is (1, 1/2) and the slope is 1/4.
        - |
          Slope 1 is the derivative of the top over the derivative of the bottom, 1/1, not the quotient rule.
        - |
          Correct. y(1) = 1/2 and y′ = ((1)(x + 1) − x(1))/(x + 1)² = 1/(x + 1)², which is 1/4 at x = 1.
      answer: 3
    # ---- Review items
    - slug: apcalcab-u02-w09-q12
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Calculus CED, Topic 2.7"
      points: 1
      prompt: |
        What is d/dx [4 cos x − eˣ]?
      options:
        - "4 sin x − eˣ"
        - "−4 sin x − eˣ"
        - "−4 sin x − xeˣ⁻¹"
        - "4 sin x + eˣ"
      option_explanations:
        - |
          This uses d/dx [cos x] = sin x; the derivative of cos x is −sin x.
        - |
          Correct. d/dx [4 cos x] = −4 sin x and d/dx [eˣ] = eˣ, so the result is −4 sin x − eˣ.
        - |
          This applies the power rule to eˣ, but the variable is the exponent; d/dx [eˣ] = eˣ.
        - |
          Both signs are wrong: the cosine derivative is negative, and the minus in front of eˣ stays.
      answer: 1
    - slug: apcalcab-u02-w09-q13
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Calculus CED, Topic 2.5"
      points: 1
      prompt: |
        Let f(x) = 2x^(3/2) − 3x. What is f′(4)?
      options:
        - "3"
        - "4"
        - "0"
        - "9"
      option_explanations:
        - |
          Correct. f′(x) = 2 · (3/2)x^(1/2) − 3 = 3√x − 3, so f′(4) = 3(2) − 3 = 3.
        - |
          4 is f(4) = 2 · 8 − 12, the function value, not the slope.
        - |
          This drops the coefficient 2, using (3/2)√x − 3 = 3 − 3 at x = 4.
        - |
          This forgets to take the square root: 3x^(1/2) at x = 4 is 3 · 2 = 6, not 3 · 4 = 12.
      answer: 0
    - slug: apcalcab-u02-w09-q14
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Calculus CED, Topic 2.4"
      points: 1
      prompt: |
        Why is g(x) = tan x not differentiable at x = π/2?
      options:
        - "Its graph has a corner at x = π/2."
        - "Its graph has a cusp at x = π/2."
        - "g is not defined, so not continuous, at x = π/2."
        - "Its graph has a vertical tangent line at x = π/2."
      option_explanations:
        - |
          A corner needs the function to be defined and continuous at the point with two different one-sided slopes; tan x has no value at π/2.
        - |
          A cusp also needs a continuous function at the point; here the function values themselves are unbounded.
        - |
          Correct. cos(π/2) = 0, so tan x is undefined there and has a vertical asymptote; a function that is not continuous at a point cannot be differentiable there.
        - |
          A vertical tangent needs a point on the graph to be tangent at; at x = π/2 there is an asymptote, not a point.
      answer: 2
    - slug: apcalcab-u02-w09-q15
      type: multiple_choice
      topic_code: "1.14"
      source: "AP Calculus CED, Topic 1.14"
      points: 1
      prompt: |
        What is lim (x→π/2⁻) tan x?
      options:
        - "−∞"
        - "1"
        - "0"
        - "∞"
      option_explanations:
        - |
          −∞ is the limit from the right, where sin x > 0 and cos x < 0.
        - |
          1 is tan(π/4); as x approaches π/2 the values of tan x grow far beyond 1.
        - |
          0 is the limit of cos x as x → π/2; it sits in the denominator of tan x = sin x/cos x.
        - |
          Correct. As x → π/2 from the left, sin x → 1 while cos x → 0 through positive values, so sin x/cos x → ∞.
      answer: 3
    - slug: apcalcab-u02-w09-q16
      type: multi_select
      topic_code: "2.8"
      source: "AP Calculus CED, Topic 2.8"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are equal to d/dx [x²eˣ]? Select all that apply.
      options:
        - "2xeˣ + x²eˣ"
        - "xeˣ(x + 2)"
        - "eˣ(x² + 2x)"
        - "2xeˣ"
        - "x²eˣ"
      option_explanations:
        - |
          Correct. This is the product rule written out: (x²)′eˣ + x²(eˣ)′.
        - |
          Correct. Factoring xeˣ out of 2xeˣ + x²eˣ gives xeˣ(2 + x).
        - |
          Correct. Factoring eˣ out gives eˣ(x² + 2x).
        - |
          2xeˣ is the product of the derivatives; the term x²eˣ is missing.
        - |
          x²eˣ is the original function, or only the second product-rule term.
      answer: [0, 1, 2]
    - slug: apcalcab-u02-w09-q17
      type: multi_select
      topic_code: "2.4"
      source: "AP Calculus CED, Topic 2.4"
      points: 2
      partial_credit: true
      prompt: |
        A function f satisfies f′(2) = 5. Which statements must be true? Select all that apply.
      options:
        - "f is continuous at x = 2."
        - "lim (x→2) f(x) = f(2)"
        - "f is differentiable at x = 2."
        - "f(2) = 5"
        - "f′ is continuous at x = 2."
      option_explanations:
        - |
          Correct. Differentiability at a point implies continuity there.
        - |
