      points: 1
      prompt: |
        True or false: d/dx [sec x] = sec x tan x.
      answer: true
      explanation: |
        True. sec x = 1/cos x, and the quotient rule gives (0 · cos x − 1 · (−sin x))/cos² x = sin x/cos² x = (1/cos x)(sin x/cos x) = sec x tan x.
