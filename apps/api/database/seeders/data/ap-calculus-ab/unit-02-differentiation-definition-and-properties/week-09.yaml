      type: short_answer
      topic_code: "2.10"
      source: "AP Calculus CED, Topic 2.10"
      points: 3
      prompt: |
        (a) Write tan x = sin x/cos x and use the quotient rule to show that d/dx [tan x] = sec² x.
        (b) Write an equation of the line tangent to the graph of y = tan x at x = π/4.
      answer: |
        (a) d/dx [sin x/cos x] = (cos x · cos x − sin x · (−sin x))/cos² x = (cos² x + sin² x)/cos² x = 1/cos² x = sec² x.
        (b) tan(π/4) = 1 and sec²(π/4) = (√2)² = 2, so y = 1 + 2(x − π/4).
      explanation: |
        Three points. (a) 1 point for a correct quotient-rule setup with the derivative of cos x as −sin x; 1 point for using sin² x + cos² x = 1 to reach sec² x. (b) 1 point for y = 1 + 2(x − π/4) or an equivalent form.
    - slug: apcalcab-u02-w09-q24
      type: short_answer
      topic_code: "2.6"
      source: "AP Calculus CED, Topic 2.6"
      points: 2
      prompt: |
        Find every point on the graph of y = x³ − 3x² − 9x + 5 at which the tangent line is parallel to the line y = 15x. Show your work.
      answer: |
        Parallel lines have equal slopes, so solve dy/dx = 3x² − 6x − 9 = 15. Then 3x² − 6x − 24 = 0, x² − 2x − 8 = 0, (x − 4)(x + 2) = 0, so x = 4 or x = −2. The points are (4, 64 − 48 − 36 + 5) = (4, −15) and (−2, −8 − 12 + 18 + 5) = (−2, 3).
      explanation: |
        Two points. 1 point for setting the derivative 3x² − 6x − 9 equal to 15 and solving to x = 4 and x = −2. 1 point for both points with their y-coordinates, (4, −15) and (−2, 3).
    - slug: apcalcab-u02-w09-q25
      type: long_answer
      topic_code: "2.8"
      source: "AP Calculus CED, Topic 2.8"
      points: 6
      prompt: |
        A hypothetical bakery tracks a specialty loaf. On day t, it sells N(t) loaves per day at a price of P(t) dollars per loaf, and its total daily cost of making them is C(t) dollars. N, P and C are differentiable. On day t = 4:

        | N(4) | N′(4) | P(4) | P′(4) | C(4) | C′(4) |
        |---|---|---|---|---|---|
        | 120 loaves | −6 loaves per day | 15 dollars | 0.5 dollars per day | 900 dollars | 30 dollars per day |

        Daily revenue is R(t) = N(t)P(t), and the average cost per loaf is A(t) = C(t)/N(t).
        (A) Find R′(4). Show the rule you use.
        (B) Is daily revenue increasing or decreasing on day 4? Interpret R′(4) in context, with units.
        (C) The manager says, "The price is going up, so revenue must be going up." Use your work from part (A) to explain why this reasoning fails.
        (D) Find A′(4), and interpret it in context, with units.
      answer: |
        (A) By the product rule, R′(4) = N′(4)P(4) + N(4)P′(4) = (−6)(15) + (120)(0.5) = −90 + 60 = −30.
        (B) Decreasing, because R′(4) = −30 < 0. On day 4, daily revenue is decreasing at 30 dollars per day, per day (30 dollars per day each day).
        (C) Revenue depends on both factors. The rising price adds N(4)P′(4) = 60 dollars per day each day, but falling sales subtract N′(4)P(4) = 90, and the second effect is larger. A rising price alone does not make the product increase.
        (D) By the quotient rule, A′(4) = (C′(4)N(4) − C(4)N′(4))/[N(4)]² = (30 · 120 − 900 · (−6))/120² = (3600 + 5400)/14400 = 0.625. On day 4, the average cost per loaf is increasing at 0.625 dollars per loaf per day (about 62.5 cents per loaf each day).
      explanation: |
        Six points. (A) 1 point for the product rule setup N′P + NP′; 1 point for −30. (B) 1 point for "decreasing" with a reason (R′(4) < 0) and an interpretation using day 4 and dollars per day per day. (C) 1 point for explaining that the decrease from falling sales (−90) outweighs the increase from the rising price (+60). (D) 1 point for a correct quotient-rule setup with the numerator in the right order; 1 point for 0.625 with an interpretation (average cost per loaf increasing, dollars per loaf per day).
