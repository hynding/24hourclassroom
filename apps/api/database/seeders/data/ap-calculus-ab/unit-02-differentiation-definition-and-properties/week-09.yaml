    - slug: apcalcab-u02-w09-q18
      type: true_false
      topic_code: "2.8"
      source: "AP Calculus CED, Topic 2.8"
      points: 1
      prompt: |
        True or false: For all differentiable functions f and g, d/dx [f(x)g(x)] = f′(x)g′(x).
      answer: false
      explanation: |
        False. The product rule is f′(x)g(x) + f(x)g′(x). A counterexample: f(x) = g(x) = x gives d/dx [x²] = 2x, but f′(x)g′(x) = 1.
    - slug: apcalcab-u02-w09-q19
      type: true_false
