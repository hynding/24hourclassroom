      answer: |
        (a) f(x + h) − f(x) = 1/(x + h + 2) − 1/(x + 2) = ((x + 2) − (x + h + 2))/((x + h + 2)(x + 2)) = −h/((x + h + 2)(x + 2)). Dividing by h gives −1/((x + h + 2)(x + 2)) for h ≠ 0, and as h → 0 this tends to −1/(x + 2)².
