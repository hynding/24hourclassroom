    - slug: apcalcab-u02-w06-q25
      type: long_answer
      topic_code: "2.2"
      source: "AP Calculus CED, Topic 2.2"
      points: 6
      prompt: |
        A hypothetical robot moves along a straight track. Its position, in metres from a marker, t seconds after it starts is x(t) = t³ − 6t for 0 ≤ t ≤ 4.
        (A) Find the average velocity of the robot over the interval 1 ≤ t ≤ 3. Include units.
        (B) Use the limit definition of the derivative to find x′(t). Show the algebra.
        (C) Find the time t in the interval 1 < t < 3 at which the instantaneous velocity x′(t) equals the average velocity from part (A). An exact answer is acceptable.
        (D) Write an equation of the line tangent to the graph of x at t = 2, and interpret x′(2) in context with units.
      answer: |
        (A) x(1) = 1 − 6 = −5 and x(3) = 27 − 18 = 9, so the average velocity is (9 − (−5))/(3 − 1) = 14/2 = 7 metres per second.
        (B) x(t + h) − x(t) = (t³ + 3t²h + 3th² + h³ − 6t − 6h) − (t³ − 6t) = 3t²h + 3th² + h³ − 6h. Dividing by h gives 3t² + 3th + h² − 6 for h ≠ 0, and as h → 0 this tends to x′(t) = 3t² − 6.
        (C) 3t² − 6 = 7 gives t² = 13/3, so t = √(13/3) ≈ 2.082 seconds, which is in (1, 3). (The negative root is rejected.)
        (D) x(2) = 8 − 12 = −4 and x′(2) = 12 − 6 = 6, so the tangent line is y = −4 + 6(t − 2). At t = 2 seconds the robot's position is increasing at 6 metres per second: it is moving in the positive direction at 6 m/s.
      explanation: |
        Six points. (A) 1 point for 7 with units of metres per second (m/s). (B) 2 points: 1 for a correct difference quotient with the expansion of (t + h)³, 1 for cancelling h and taking the limit to get 3t² − 6; an answer with no limit work earns at most 1 point. (C) 1 point for t = √(13/3) (about 2.082), consistent with part (B). (D) 1 point for the tangent line through (2, −4) with slope 6 in any equivalent form; 1 point for an interpretation that names the time t = 2, "increasing" (or moving in the positive direction) and the rate 6 metres per second.
