    - slug: apcalcab-u02-w06-q23
      type: short_answer
      topic_code: "1.10"
      source: "AP Calculus CED, Topic 1.10"
      points: 2
      prompt: |
        Let r(x) = (x² − x − 2)/(x² − 4). Identify each value of x at which r is discontinuous, classify each discontinuity as removable, jump or infinite, and justify with limits or factoring.
      answer: |
        r(x) = (x − 2)(x + 1)/((x − 2)(x + 2)), so r is undefined at x = 2 and x = −2.
        At x = 2: for x ≠ 2, r(x) = (x + 1)/(x + 2), so lim (x→2) r(x) = 3/4 exists but r(2) is undefined: a removable discontinuity (a hole at (2, 3/4)).
        At x = −2: the numerator tends to 3 while the denominator tends to 0, so r is unbounded there: an infinite discontinuity (vertical asymptote x = −2).
      explanation: |
        Two points. 1 point for x = 2 classified as removable, with the limit 3/4 or the cancelled factor as justification. 1 point for x = −2 classified as infinite, with the nonzero numerator over a zero denominator (or a one-sided limit of ±∞) as justification.
