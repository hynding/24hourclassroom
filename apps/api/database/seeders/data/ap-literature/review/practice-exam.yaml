        The scheme's merits are never argued; she wants his "public support" whatever its merits. The dispute is about what she knows, not about investment.
      - |
        Correct. The headnote's "admired for his integrity" meets her revelation that he "laid the foundation of his fortune by selling ... a Cabinet secret." Exposure of the past threatens the public man, and that is the pressure she uses.
      - |
        No romantic rivalry appears in the passage; the stakes are fortune, career and reputation.
      - |
        Mrs. Cheveley shows no inner struggle. She calls her demand "the game of life," which is the voice of someone untroubled by conscience.
    answer: 1

  - slug: review-practice-q25
    type: multiple_choice
    topic_code: "1.E"
    source: "Oscar Wilde, An Ideal Husband (1899)"
    points: 1
    stimulus: *ih
    prompt: |
      Sir Robert's reply "[Hoarsely.] It is not true." primarily reveals
    options:
      - "a denial that his own voice betrays, since the stage direction signals a fear that contradicts his words"
      - "a confident innocence that Mrs. Cheveley cannot shake"
      - "that he has forgotten writing the letter"
      - "his belief that Mrs. Cheveley has forged the letter"
    option_explanations:
      - |
        Correct. The words deny; the direction "Hoarsely" tells the actor to let the voice give way. That gap between speech and manner is how a play reveals what a character hides; nothing he says afterward disputes her account.
      - |
        Confident innocence would not need "Hoarsely," nor follow "Biting his lip." His physical reactions show the accusation has struck home.
      - |
        He asks "What letter?" only until she names it; once she does, he denies it at once, which shows recognition, not forgetting.
      - |
        He never challenges the letter's authenticity. He protests that her proposal is "infamous," not that her evidence is false.
    answer: 0

  - slug: review-practice-q26
