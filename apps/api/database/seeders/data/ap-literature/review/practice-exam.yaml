  - slug: review-practice-q35
    type: multiple_choice
    topic_code: "4.A"
    source: 'Walt Whitman, "A Noiseless Patient Spider" (1868)'
    points: 1
    stimulus: &spider |
      *The following poem by Walt Whitman was first published in 1868 and included in later editions of* Leaves of Grass*.*

      A noiseless patient spider,
      I mark'd where on a little promontory it stood isolated,
      Mark'd how to explore the vacant vast surrounding,
      It launch'd forth filament, filament, filament out of itself,
      Ever unreeling them, ever tirelessly speeding them.   [5]

      And you O my soul where you stand,
      Surrounded, detached, in measureless oceans of space,
      Ceaselessly musing, venturing, throwing, seeking the spheres to connect them,
      Till the bridge you will need be form'd, till the ductile anchor hold,
      Till the gossamer thread you fling catch somewhere, O my soul.   [10]
    prompt: |
      The speaker of the poem is best described as
    options:
      - "the spider, describing its own work"
      - "an observer who watches a spider and then turns to address his own soul"
      - "a naturalist recording the behavior of spiders without personal involvement"
      - "a soul speaking to the body it inhabits"
    option_explanations:
      - |
        The spider is "it," seen from outside: "I mark'd where ... it stood." The "I" who watches is someone else.
      - |
        Correct. The speaker says "I mark'd" in the first stanza and "And you O my soul" in the second: first an observer, then a man addressing his own soul through what he observed.
      - |
        The first stanza observes closely, but the second ("O my soul") is intensely personal. Calling the speaker uninvolved misses the poem's turn.
      - |
        The speaker addresses the soul ("you O my soul"); the soul is the listener, not the voice.
    answer: 1

