  - slug: review-practice-q23
    type: multiple_choice
    topic_code: "1.A"
    source: "Oscar Wilde, An Ideal Husband (1899)"
    points: 1
    stimulus: &ih |
      *The following passage is from Oscar Wilde's play* An Ideal Husband *(1895; published 1899). Sir Robert Chiltern, a rising government minister admired for his integrity, is speaking privately at a reception in his own house with Mrs. Cheveley, a clever woman recently arrived from Vienna who has just asked him to support a fraudulent canal scheme in a speech to the House of Commons.*

      **MRS. CHEVELEY.** [*Detains him by touching his arm with her fan, and keeping it there while she is talking.*] I realise that I am talking to a man who laid the foundation of his fortune by selling to a Stock Exchange speculator a Cabinet secret.

      **SIR ROBERT CHILTERN.** [*Biting his lip.*] What do you mean?

      **MRS. CHEVELEY.** [*Rising and facing him.*] I mean that I know the real origin of your wealth and your career, and I have got your letter, too.

      **SIR ROBERT CHILTERN.** What letter?

      **MRS. CHEVELEY.** [*Contemptuously.*] The letter you wrote to Baron Arnheim, when you were Lord Radley's secretary, telling the Baron to buy Suez Canal shares—a letter written three days before the Government announced its own purchase.

      **SIR ROBERT CHILTERN.** [*Hoarsely.*] It is not true.

      **MRS. CHEVELEY.** You thought that letter had been destroyed. How foolish of you! It is in my possession.

      [...]

      **MRS. CHEVELEY.** [...] And now I am going to sell you that letter, and the price I ask for it is your public support of the Argentine scheme. You made your own fortune out of one canal. You must help me and my friends to make our fortunes out of another!

      **SIR ROBERT CHILTERN.** It is infamous, what you propose—infamous!

      **MRS. CHEVELEY.** Oh, no! This is the game of life as we all have to play it, Sir Robert, sooner or later!

      **SIR ROBERT CHILTERN.** I cannot do what you ask me.

      **MRS. CHEVELEY.** You mean you cannot help doing it. You know you are standing on the edge of a precipice. And it is not for you to make terms. It is for you to accept them.
    prompt: |
      The opening stage direction, in which Mrs. Cheveley "Detains him by touching his arm with her fan, and keeping it there while she is talking," primarily suggests
    options:
      - "her affection for Sir Robert, whom she hopes to win back"
      - "her nervousness about raising a delicate subject"
      - "her wish to flirt with Sir Robert to distract him from her scheme"
      - "her assured control of the encounter, turning a fashionable accessory into a way of holding him in place"
    option_explanations:
      - |
        Nothing in the passage suggests a past romance or present affection; what follows is accusation and a price.
      - |
        Her manner is the reverse of nervous: she keeps the fan on his arm the whole time she talks, then rises to face him and speaks "Contemptuously."
      - |
        The gesture looks like coquetry, which is its cleverness, but its purpose is to stop him leaving while she delivers an accusation, not to distract him from the scheme she has come to press.
      - |
        Correct. "Detains" and "keeping it there" show her physically stopping him, with a fan, the emblem of a drawing-room lady. The gesture announces who controls the scene before she says a word of her threat.
    answer: 3

  - slug: review-practice-q24
