week: 34
description: |
  A full-length practice version of the AP English Literature and Composition exam, built to the real paper's shape. The real exam is taken on a computer in the College Board's Bluebook app and lasts three hours. Section I is 55 multiple-choice questions in one hour and counts for 45% of the score; the questions come in five sets, each on one passage of prose fiction, drama or poetry, and none of the passages is a text you studied in class. Section II is three essays in two hours and counts for 55%: Question 1 analyzes a poem printed on the exam, Question 2 analyzes a passage of prose fiction printed on the exam, and Question 3 is a literary argument about a work you choose. Each essay is scored out of 6 on the same rubric (thesis 0-1, evidence and commentary 0-4, sophistication 0-1). This practice exam follows that pattern: items 1-55 are five passage sets (a novel, a lyric poem, a play, a second poem and a second novel, all public-domain texts the course does not read), and items 56-58 are the three essays. In the app, items 1-55 are worth 1 point each and are graded at once; items 56-58 are worth 6 points each and are graded by your teacher against the rubric attached to each, so the paper is out of 73 points and the essays count for less here than they will in May. To estimate your exam standing, weight the two halves the way the College Board does: (your multiple-choice score ÷ 55 × 45) + (your essay total ÷ 18 × 55). Sit it in one block if you can: 60 minutes for items 1-55 (about a minute an item, twelve minutes a set), a short break, then 120 minutes for the three essays (about 40 minutes each, including a few minutes to read and plan).
questions:
  # ======================================================================
  # Section I, set A (q01-q12): prose fiction, George Eliot, Middlemarch
  # ======================================================================
  - slug: review-practice-q01
    type: multiple_choice
    topic_code: "4.A"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: &mm |
      *The following passage opens George Eliot's novel* Middlemarch *(1871–72). It introduces Dorothea Brooke, who lives with her younger sister Celia and their uncle in the English countryside.*

      Miss Brooke had that kind of beauty which seems to be thrown into relief by poor dress. Her hand and wrist were so finely formed that she could wear sleeves not less bare of style than those in which the Blessed Virgin appeared to Italian painters; and her profile as well as her stature and bearing seemed to gain the more dignity from her plain garments, which by the side of provincial fashion gave her the impressiveness of a fine quotation from the Bible,—or from one of our elder poets,—in a paragraph of to-day's newspaper. She was usually spoken of as being remarkably clever, but with the addition that her sister Celia had more common-sense. [...] Dorothea knew many passages of Pascal's Pensees and of Jeremy Taylor by heart; and to her the destinies of mankind, seen by the light of Christianity, made the solicitudes of feminine fashion appear an occupation for Bedlam. [...] Her mind was theoretic, and yearned by its nature after some lofty conception of the world which might frankly include the parish of Tipton and her own rule of conduct there; she was enamoured of intensity and greatness, and rash in embracing whatever seemed to her to have those aspects; likely to seek martyrdom, to make retractations, and then to incur martyrdom after all in a quarter where she had not sought it. Certainly such elements in the character of a marriageable girl tended to interfere with her lot, and hinder it from being decided according to custom, by good looks, vanity, and merely canine affection.
    prompt: |
      Which of the following best describes the narrator of the passage?
    options:
      - "A member of the Brooke household who recalls Dorothea's girlhood from personal memory"
      - "A third-person narrator who knows Dorothea's mind and comments on her, and on the society around her, in confident generalizations"
      - "A third-person narrator whose knowledge is limited to what Celia observes of her sister"
      - "An objective narrator who reports only what the characters look like and what others say of them"
    option_explanations:
      - |
        Nobody in the household speaks. The narrator never says "I" or claims to have known Dorothea; the one "our" ("our elder poets") is a narrator speaking to readers as a fellow member of English culture, not a character in the story.
      - |
        Correct. The narrator reports what Dorothea thinks and yearns after ("Her mind was theoretic") and steps back to generalize about custom and "a marriageable girl." That is an intrusive omniscient narrator, the kind whose wry comments are themselves part of the meaning.
      - |
        Celia is mentioned only as a point of comparison; nothing is filtered through her perception, and the passage reports things Celia could not observe, such as the nature of Dorothea's mind and the course her life is likely to take.
      - |
        An objective (dramatic) narrator stays outside every mind. This one goes inside Dorothea's convictions and longings and passes judgment on them, so the label does not fit.
    answer: 1

  - slug: review-practice-q02
    type: multiple_choice
    topic_code: "5.A"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      In context, the phrase "thrown into relief" (first sentence) most nearly means
    options:
      - "freed from a burden or worry"
      - "softened and made less striking"
      - "exposed as false or exaggerated"
      - "made more noticeable by contrast"
    option_explanations:
      - |
        That is the everyday sense of "relief." Here the word is figurative and comes from sculpture and painting, where a figure "in relief" stands out from its background; nothing about a burden is in play.
      - |
        This reverses the meaning. The plain dress does not tone her beauty down; the sentence says the beauty "seems to be thrown into relief by poor dress," and the next sentences show the plainness adding "dignity."
      - |
        Nothing in the sentence questions whether her beauty is real. The narrator is explaining why it shows so strongly, not unmasking it, so the sense of exposing a pretence is a misreading.
      - |
        Correct. To throw something into relief is to make it stand out against its background, as a carved figure stands out from a flat surface. Her plain clothes are the background against which her beauty becomes more visible.
    answer: 3

  - slug: review-practice-q03
    type: multiple_choice
    topic_code: "6.A"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      The comparison of Miss Brooke's effect to that of "a fine quotation from the Bible,—or from one of our elder poets,—in a paragraph of to-day's newspaper" primarily suggests that
    options:
      - "she frequently quotes Scripture and poetry in conversation"
      - "her neighbors find her old-fashioned and slightly ridiculous"
      - "her plainness gives her a dignity that stands out against fashionable provincial dress, as elevated older language stands out in everyday prose"
      - "her beauty, like a newspaper paragraph, is striking but quickly forgotten"
    option_explanations:
      - |
        This takes the comparison literally. The quotation describes the impression her appearance makes "by the side of provincial fashion"; it says nothing about how she talks.
      - |
        The comparison does register that she is unlike her surroundings, but the key word is "impressiveness": the fine quotation is the best thing in the paragraph, not a joke at her expense.
      - |
        Correct. Her plain garments are set "by the side of provincial fashion" the way a fine old quotation is set inside ordinary, disposable newspaper prose. The contrast makes the old and serious thing look more impressive, which is the dignity the sentence claims for her.
      - |
        This attaches the wrong half of the comparison to Dorothea. She is the quotation, not the newspaper; the newspaper is the fashionable, everyday world around her.
    answer: 2

  - slug: review-practice-q04
    type: multiple_choice
    topic_code: "1.A"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      The description of Dorothea as "likely to seek martyrdom, to make retractations, and then to incur martyrdom after all in a quarter where she had not sought it" suggests that she is
    options:
      - "ardent and impulsive, and likely to suffer from consequences she does not foresee"
      - "calculating, and willing to feign suffering in order to win admiration"
      - "timid, and inclined to withdraw from any commitment she has made"
      - "hypocritical about the religious principles she claims to hold"
    option_explanations:
      - |
        Correct. The sentence follows from "enamoured of intensity and greatness, and rash in embracing": she rushes toward noble sacrifice, takes things back, and then suffers where she least expected. The final clause reads as a quiet forecast of her fate.
      - |
        Nothing suggests she pretends. Her yearning is sincere; the narrator's irony is aimed at its rashness, not at any falseness or wish to be admired.
      - |
        "Retractations" might suggest withdrawal, but they come between two martyrdoms and follow a sentence about rash embracing. The pattern is too much eagerness, not too little.
      - |
        The narrator smiles at her intensity but never questions her sincerity; her plain dress and her reading match her convictions. Hypocrisy would need a gap between profession and practice, and none is shown.
    answer: 0

  - slug: review-practice-q05
    type: multiple_choice
    topic_code: "1.C"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      The remark that Dorothea's "sister Celia had more common-sense" functions primarily to
    options:
      - "reveal a rivalry between the sisters that will drive the plot"
      - "suggest that Celia, not Dorothea, is the novel's central character"
      - "show that the narrator considers Dorothea foolish"
      - "set off Dorothea's idealism against a sister who meets the world in a more ordinary, practical way"
    option_explanations:
      - |
        The passage records a comparison other people make; it does not show the sisters competing or resenting each other. Rivalry is an inference the text does not support.
      - |
        The whole passage is about Dorothea; Celia appears only as a foil. Giving her one clause of comparison does not make her the focus.
      - |
        The narrator smiles at Dorothea's rashness but also grants her beauty, dignity, cleverness and "lofty" yearning. "Foolish" overstates a judgment that is mixed and largely sympathetic.
      - |
        Correct. Celia is a foil: her "common-sense" makes Dorothea's intensity and theoretic mind stand out. The contrast tells us what Dorothea is by showing what she is not.
    answer: 3

  - slug: review-practice-q06
    type: multiple_choice
    topic_code: "4.C"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      The statement that to Dorothea "the solicitudes of feminine fashion" seemed "an occupation for Bedlam" (Bedlam was a London asylum for the insane) conveys which of the following?
    options:
      - "The narrator's full agreement that interest in clothing is a kind of madness"
      - "That Dorothea once worked among the patients of an asylum"
      - "Dorothea's sweeping contempt for fashion, presented by the narrator with mild irony at its extremity"
      - "The narrator's belief that women in general are frivolous"
    option_explanations:
      - |
        The verdict is Dorothea's ("to her ... made ... appear"), and the narrator sets it amid other signs of excess: "rash in embracing," "enamoured of intensity." Reporting a view is not endorsing it.
      - |
        This takes the figure literally. "An occupation for Bedlam" is a hyperbolic way of saying fashion looked like lunacy to her; no history of asylum work is implied.
      - |
        Correct. Measured against "the destinies of mankind," fashion looks insane to Dorothea. The hyperbole is hers, and the narrator's formal phrasing ("the solicitudes of feminine fashion") lets us see both the seriousness of her faith and how absolute her judgments are.
      - |
        The narrator is describing one young woman's outlook, not passing judgment on women as a class; the irony falls on Dorothea's extremity, not on her sex.
    answer: 2

  - slug: review-practice-q07
    type: multiple_choice
    topic_code: "4.B"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      The sentence "She was usually spoken of as being remarkably clever, but with the addition that her sister Celia had more common-sense" primarily serves to
    options:
      - "present Dorothea's own assessment of herself"
      - "convey how the surrounding community sums Dorothea up, a judgment the narrator reports without fully endorsing"
      - "shift the narration briefly into the first person"
      - "establish as fact that Dorothea is less intelligent than her sister"
    option_explanations:
      - |
        "Spoken of" is passive: this is what others say about her. Dorothea's own outlook appears later, in the sentences about Pascal and her "theoretic" mind.
      - |
        Correct. The narrator steps back to report the neighborhood's verdict, with its telling "but." Framing it as what is "usually spoken" lets the narrator show how provincial society labels a woman like Dorothea while keeping a critical distance from the label.
      - |
        There is no "I" or "we" in the sentence; the point of view stays third person. What changes is the source of the judgment (common talk), not the grammatical person.
      - |
        "Clever" and "common-sense" are different qualities, and the sentence reports gossip, not the narrator's verdict. Reading it as a ranking of intelligence misses both points.
    answer: 1

  - slug: review-practice-q08
    type: multiple_choice
    topic_code: "6.D"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      The allusion to "the Blessed Virgin" as she "appeared to Italian painters" primarily serves to
    options:
      - "lend Dorothea's plain appearance an air of spiritual and artistic dignity"
      - "indicate that Dorothea belongs to the Roman Catholic Church"
      - "suggest that Dorothea is vain about her hands and arms"
      - "foreshadow that Dorothea will soon become a mother"
    option_explanations:
      - |
        Correct. Linking her bare sleeves to Madonnas in Italian painting associates her beauty with holiness and with great art, which prepares the claim that her plain garments give her "dignity" and fits the religious seriousness described later.
      - |
        The allusion is to how painters pictured the Virgin's clothing, not to Dorothea's church. It describes the look of her sleeves, and nothing in the passage tells us which church she belongs to.
      - |
        The sentence praises the form of her hand and wrist, but in the narrator's voice; nothing indicates Dorothea thinks about her looks at all. Her plainness is said to come from conviction, not display.
      - |
        Reading the allusion as a prediction of motherhood pushes it too far. Its work in the sentence is to describe how her plain sleeves look, with the dignity that the comparison carries.
    answer: 0

  - slug: review-practice-q09
    type: multiple_choice
    topic_code: "3.D"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      The contrast between "some lofty conception of the world" and "the parish of Tipton" primarily emphasizes
    options:
      - "Dorothea's contempt for the village in which she lives"
      - "the importance of Tipton in the affairs of the nation"
      - "the narrator's preference for practical life over abstract thought"
      - "the gap between Dorothea's grand aspirations and the small local world in which she must act on them"
    option_explanations:
      - |
        She wants her lofty conception to "frankly include" Tipton and her conduct there. That is a wish to bring the parish into her ideals, not contempt for it.
      - |
        The joke runs the other way: a parish is about as small a unit as English life offers, which is why setting it beside "the world" is comic.
      - |
        The narrator smiles at the mismatch but does not reject thought; elsewhere Dorothea's yearning is called "lofty" and set against the shallow standard of "good looks, vanity." No preference for practical life is stated.
      - |
        Correct. The sentence yokes a vast ambition ("the world") to a tiny sphere ("the parish of Tipton"). The bathos captures the novel's central tension: a large nature with few outlets in a provincial place.
    answer: 3

  - slug: review-practice-q10
    type: multiple_choice
    topic_code: "3.C"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      The passage moves from Dorothea's appearance, to her religious convictions, to the likely effect of her character on how her marriage will be decided. This progression serves primarily to
    options:
      - "trace the events of Dorothea's life in chronological order"
      - "suggest that her appearance is the most important thing about her"
      - "move from outward to inward and then to social consequence, preparing for a conflict between her nature and custom"
      - "show that the narrator's account of her becomes less reliable as it goes on"
    option_explanations:
      - |
        Nothing happens in the passage; it is a portrait, not a sequence of events. Its order is thematic (surface, mind, prospects), not chronological.
      - |
        Appearance comes first only as the way in; the passage ends with her mind and her "lot," and her looks are explained by her beliefs. The structure makes appearance a sign of something deeper.
      - |
        Correct. Dress leads to the convictions behind it, and convictions lead to their cost: such a girl's lot will not be "decided according to custom." The structure builds a character and then sets her against the world she lives in.
      - |
        The narrator grows more pointed, not less trustworthy. The final generalization is ironic but deliberate, and nothing undercuts the earlier descriptions.
    answer: 2

  - slug: review-practice-q11
    type: multiple_choice
    topic_code: "7.B"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      Which of the following would be the most defensible thesis for an essay about the passage?
    options:
      - "In this passage, Eliot describes Dorothea Brooke, a beautiful young woman who wears plain clothes."
      - "Eliot's narrator admires Dorothea's ardor while gently mocking its excesses, suggesting that the qualities that make her remarkable will make her life difficult in a society that settles a young woman's future by custom."
      - "Eliot presents religion as a form of madness that destroys a young woman's chance of happiness."
      - "Eliot uses many literary devices, such as similes and allusions, to describe Dorothea."
    option_explanations:
      - |
        This is summary, not a claim; no one could disagree with it, so there is nothing to defend. A thesis must take an interpretive position.
      - |
        Correct. It makes a defensible, arguable claim (admiration plus irony), points to a line of reasoning (her qualities versus custom), and can be supported from the text: "lofty," "rash," "martyrdom," "merely canine affection."
      - |
        "An occupation for Bedlam" is Dorothea's view of fashion, not the narrator's view of religion, and the passage never says her faith destroys her happiness. The claim cannot be supported from the text.
      - |
        This names devices without saying what they do or what the passage means. A thesis that lists techniques without an interpretation earns nothing on the rubric.
    answer: 1

  - slug: review-practice-q12
    type: multiple_choice
    topic_code: "4.C"
    source: "George Eliot, Middlemarch (1871)"
    points: 1
    stimulus: *mm
    prompt: |
      In the final sentence, the narrator's word choice ("Certainly," "a marriageable girl," "her lot," "good looks, vanity, and merely canine affection") reveals an attitude toward customary ways of arranging a young woman's future that is best described as
    options:
      - "dryly ironic, reducing conventional courtship to shallow and almost animal motives"
      - "nostalgic, regretting that such customs have faded"
      - "indifferent, treating the subject as beneath notice"
      - "openly outraged, demanding that the customs be abolished"
    option_explanations:
      - |
        Correct. "Certainly" mimics confident common opinion; "marriageable girl" and "lot" adopt society's own terms; and the list ends with an anticlimax that likens conventional affection to a dog's. The irony is quiet but cutting.
      - |
        Nothing suggests regret. The list of what custom relies on ("good looks, vanity, and merely canine affection") is belittling, not fond.
      - |
        A narrator who chooses a phrase as barbed as "merely canine affection" is clearly engaged, not indifferent; the sentence pulls the whole portrait toward its point.
      - |
        The tone is controlled and understated. Irony criticizes by implication; there is no explicit protest or call for change.
    answer: 0

  # ======================================================================
  # Section I, set B (q13-q22): poetry, Christina Rossetti, "A Birthday"
  # ======================================================================
  - slug: review-practice-q13
    type: multiple_choice
    topic_code: "4.A"
    source: 'Christina Rossetti, "A Birthday" (1862)'
    points: 1
    stimulus: &birthday |
      *The following poem by Christina Rossetti was collected in* Goblin Market and Other Poems *(1862). A dais is a raised platform for a seat of honor; vair is a costly fur used in medieval robes.*

      My heart is like a singing bird
      Whose nest is in a watered shoot;
      My heart is like an apple-tree
      Whose boughs are bent with thickset fruit;
      My heart is like a rainbow shell   [5]
      That paddles in a halcyon sea;
      My heart is gladder than all these
      Because my love is come to me.

      Raise me a dais of silk and down;
      Hang it with vair and purple dyes;   [10]
      Carve it in doves, and pomegranates,
      And peacocks with a hundred eyes;
      Work it in gold and silver grapes,
      In leaves, and silver fleurs-de-lys;
      Because the birthday of my life   [15]
      Is come, my love is come to me.
    prompt: |
      The speaker of the poem is best described as someone who
    options:
      - "remembers, with regret, a love that has ended"
      - "waits anxiously for a beloved who has not yet arrived"
      - "rejoices because the beloved has come"
      - "describes another person's wedding celebration"
    option_explanations:
      - |
        The verbs are in the present ("My heart is," "my love is come to me"), and the mood is exultant throughout; there is no loss and no regret.
      - |
        "My love is come to me" says the arrival has already happened, and the speaker's commands to build a dais celebrate it rather than prepare in hope.
      - |
        Correct. Both stanzas end with the reason for the speaker's joy, "my love is come to me." Every simile and every command expresses delight in an arrival that has already happened.
      - |
        The joy is the speaker's own ("My heart," "my life," "my love"). A first-person celebration of the speaker's own happiness is not a description of someone else's wedding.
    answer: 2

  - slug: review-practice-q14
    type: multiple_choice
    topic_code: "3.C"
    source: 'Christina Rossetti, "A Birthday" (1862)'
    points: 1
    stimulus: *birthday
    prompt: |
      The movement from the first stanza (comparisons of the heart to living things) to the second (commands to build and decorate a dais) primarily serves to
    options:
      - "turn the speaker's joy from an inward feeling into a demand for outward, ceremonial celebration"
      - "reveal that the speaker's happiness has begun to fade"
      - "shift the poem from the speaker's voice to the beloved's"
      - "replace a hopeful mood with a mood of solemn warning"
    option_explanations:
      - |
        Correct. Stanza one describes the heart; stanza two orders the world to build a seat of honor rich enough to match it. The joy that is felt in the first stanza is staged in the second, and both stanzas end with the same cause, "my love is come to me."
      - |
        The second stanza is even more lavish, with gold, silver, purple and peacocks, and ends by calling the day "the birthday of my life." The joy grows rather than fades.
      - |
        The speaker still gives the commands, and the closing "my love is come to me" is in the same voice as the end of stanza one.
      - |
        Nothing in the commands warns; they order up decoration. The mood moves from delight to splendor, not to solemnity.
    answer: 0

  - slug: review-practice-q15
    type: multiple_choice
    topic_code: "5.A"
    source: 'Christina Rossetti, "A Birthday" (1862)'
    points: 1
    stimulus: *birthday
    prompt: |
      In context, "halcyon" (line 6) most nearly means
    options:
      - "stormy and dangerous"
      - "calm and peaceful"
      - "distant and unknown"
      - "cold and colorless"
    option_explanations:
      - |
        This is the opposite. The halcyon was a bird fabled to calm the sea while it nested, so "halcyon" suggests tranquility, and a shell that "paddles" there is at ease.
      - |
        Correct. From the legend of the kingfisher (halcyon) calming the winter sea, the word means calm, peaceful and happy, as in "halcyon days." The tranquil sea fits the simile's picture of contented joy.
      - |
        Nothing marks the sea as remote; the point of the image is ease and delight, not distance.
      - |
        The shell is a "rainbow shell," full of color, and the sea is one it happily "paddles" in; nothing is cold or drab.
    answer: 1

  - slug: review-practice-q16
    type: multiple_choice
    topic_code: "6.A"
    source: 'Christina Rossetti, "A Birthday" (1862)'
    points: 1
    stimulus: *birthday
    prompt: |
      The three similes in lines 1-6 ("like a singing bird," "like an apple-tree," "like a rainbow shell") primarily function to
    options:
      - "contrast three different moods the speaker has felt"
      - "suggest that the speaker's joy is fragile and about to break"
      - "describe three places where the lovers have met"
      - "build a cumulative picture of joy as natural fullness, each image showing a living thing secure, laden or at ease"
    option_explanations:
      - |
        The three similes do not contrast; each expresses the same delight in a new image, and line 7 sums them up together ("gladder than all these").
      - |
        The images are of abundance and security: a nest in a "watered shoot," boughs "bent with thickset fruit," a shell in a calm sea. Nothing in them suggests fragility.
      - |
        This reads the similes as literal settings. They describe the speaker's heart, not locations, and no meeting place is mentioned.
      - |
        Correct. Each simile pairs a living thing with what makes it flourish (a watered nest, heavy fruit, a calm sea). Repeated in the same pattern ("My heart is like..."), the images pile up into a sense of overflowing, natural joy.
    answer: 3

  - slug: review-practice-q17
    type: multiple_choice
    topic_code: "4.C"
    source: 'Christina Rossetti, "A Birthday" (1862)'
    points: 1
    stimulus: *birthday
    prompt: |
      Line 7 ("My heart is gladder than all these") reveals that the speaker
    options:
      - "regards the joy as greater than anything the comparisons can express"
      - "is less happy than the creatures the poem has described"
      - "rejects the natural world as unimportant"
      - "doubts the truth of the earlier comparisons"
    option_explanations:
      - |
        Correct. Having built three similes, the speaker declares the heart "gladder than all these": the comparisons are true but not enough. The line turns the similes into a measure the joy exceeds.
      - |
        "Gladder than" says the reverse: the heart is happier than the bird, the tree and the shell.
      - |
        Surpassing the images is not rejecting them; the speaker uses them as a measure of joy and does not dismiss them.
      - |
        The line does not take the similes back; it says the speaker's gladness goes beyond them, which is a way of intensifying them, not doubting them.
    answer: 0

  - slug: review-practice-q18
    type: multiple_choice
    topic_code: "7.B"
    source: 'Christina Rossetti, "A Birthday" (1862)'
    points: 1
    stimulus: *birthday
    prompt: |
      Which of the following would be the most defensible thesis for an essay about the poem?
    options:
      - "Rossetti's poem is about a person whose love has come to see her."
      - "Rossetti suggests that love is dangerous because it makes people foolish."
      - "Rossetti moves from similes of natural abundance to commands for regal splendor, presenting the beloved's arrival as a joy so great that it remakes the speaker's sense of life itself, a second birth."
      - "Rossetti uses similes in the first stanza and imperatives in the second."
    option_explanations:
      - |
        This restates the situation; there is no claim for an essay to prove.
      - |
        Nothing in the poem suggests danger or foolishness; the speaker's joy is presented without irony. The claim cannot be supported.
      - |
        Correct. It makes an arguable interpretation (joy as a second birth), ties it to the poem's structure (similes, then commands), and can be supported with "gladder than all these," the dais of "silk and down," and "the birthday of my life."
      - |
        An accurate observation, but it names techniques without saying what they mean. A thesis must interpret.
    answer: 2

  - slug: review-practice-q19
    type: multiple_choice
    topic_code: "3.D"
    source: 'Christina Rossetti, "A Birthday" (1862)'
    points: 1
    stimulus: *birthday
    prompt: |
      The contrast between the natural images of the first stanza and the crafted materials of the second ("silk," "vair," "gold and silver") primarily emphasizes
    options:
      - "the speaker's preference for wealth over nature"
      - "that the beloved values luxury more than the speaker does"
      - "a change from sincere feeling to empty display"
      - "that the speaker's joy calls on both nature and human art, until the made world too must be shaped to honor the occasion"
    option_explanations:
      - |
        The second stanza does not reject nature: the carvings themselves are of doves, pomegranates, peacocks, grapes and leaves. Art imitates nature here; it does not replace it.
      - |
        The beloved's tastes are never mentioned; the speaker gives every command, and the luxury expresses the speaker's own feeling.
      - |
        The poem gives no sign that the display is hollow; the final lines tie the splendor directly to "the birthday of my life."
      - |
        Correct. Stanza one finds the heart's likeness in living things; stanza two commands silk, fur, purple, gold and silver, carved and worked into natural shapes. The contrast shows a joy so large that nature alone cannot hold it, so art must be enlisted to celebrate it.
    answer: 3

