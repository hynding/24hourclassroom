  # ======================================================================
  # Section II: three essays, 6 points each (teacher-graded)
  # ======================================================================
  - slug: review-practice-q56
    type: long_answer
    topic_code: "7.C"
    source: 'Gerard Manley Hopkins, "Pied Beauty" (1918)'
    points: 6
    stimulus: |
      *The following poem by Gerard Manley Hopkins was written in 1877 and first published in* Poems of Gerard Manley Hopkins *(1918). "Pied" means marked with patches of two or more colors.*

      Glory be to God for dappled things—
      For skies of couple-colour as a brinded cow;
      For rose-moles all in stipple upon trout that swim:
      Fresh-firecoal chestnut-falls; finches' wings;
      Landscape plotted and pieced—fold, fallow, and plough;   [5]
      And àll tràdes, their gear and tackle and trim.

      All things counter, original, spare, strange;
      Whatever is fickle, freckled (who knows how?)
      With swift, slow; sweet, sour; adazzle, dim;
      He fathers-forth whose beauty is past change:   [10]
      Praise him.
    prompt: |
      Question 1: Poetry analysis. Suggested time: 40 minutes.

      In the following poem by Gerard Manley Hopkins, the speaker gives thanks for "dappled things." Read the poem carefully. Then, in a well-written essay, analyze how Hopkins uses literary elements and techniques to convey the speaker's complex understanding of beauty and its source.

      In your response you should:
      - Respond to the prompt with a thesis that presents a defensible interpretation of the poem.
      - Select and use evidence from the poem to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: Hopkins builds a hymn of praise out of a catalogue of mixed, changing and imperfect things, so that the poem finds beauty precisely in what is varied, "fickle" and "strange," and then traces all of it to a God "whose beauty is past change": the world is beautiful because it changes, and its maker is beautiful because he does not.

      Line of reasoning and evidence: (1) The frame of praise. The poem opens with a doxology ("Glory be to God") and closes with a two-word command, "Praise him," so every image in between becomes a reason for worship; the narrowing last line works like an "Amen." (2) The catalogue of dappled things. The first stanza moves from sky ("couple-colour as a brinded cow") to water ("rose-moles all in stipple upon trout") to woods and birds ("chestnut-falls; finches' wings") to farmland ("plotted and pieced—fold, fallow, and plough") to human work ("àll tràdes, their gear and tackle and trim"). Compound words, heavy stresses and alliteration make the language itself patchy and packed, enacting the dappling. Including trades and tackle extends "pied beauty" to human labour. (3) The turn to qualities. The second stanza abstracts from things to adjectives ("counter, original, spare, strange") and to paired opposites ("swift, slow; sweet, sour; adazzle, dim"), celebrating contrast itself; "(who knows how?)" admits the speaker cannot explain the variety. (4) The paradox at the close. "He fathers-forth whose beauty is past change" sets a changeless creator against a world of change; the verb "fathers-forth" makes creation a continuing act of generation. Hopkins's curtailed sonnet form (six lines, then four and a half) shrinks toward the final praise, so the structure moves from abundance to a single source.

      Sophistication: explains the tension between change and changelessness as the poem's central idea, or situates the poem's praise of the imperfect against conventional ideas of beauty as symmetry and purity.
    explanation: |
      Six points, scored on the AP English Literature 6-point rubric as applied to this poem.

      Row A, Thesis (0-1). 1 point for a defensible thesis that analyzes the speaker's complex understanding of beauty and its source, for example that Hopkins finds beauty in variety, imperfection and change and traces it to a changeless God, or that the poem turns a catalogue of ordinary things into worship. The thesis may be more than one sentence and may appear anywhere, but it must make a claim about the poem's meaning. 0 points for a thesis that restates the prompt ("Hopkins uses literary elements to show beauty"), only describes the poem ("The speaker lists things that have spots"), or makes a claim the poem cannot support (for instance that the speaker mocks religion).

      Row B, Evidence and Commentary (0-4).
      - 4: Specific, well-chosen evidence throughout supports a clear line of reasoning, and commentary consistently explains how the techniques create the complex view of beauty. A 4 typically links several of: the doxology frame ("Glory be to God" / "Praise him"); the catalogue moving from sky to trout to landscape to human trades; the dense sound (alliteration in "fold, fallow, and plough" and "fickle, freckled"; compounds such as "couple-colour," "rose-moles," "Fresh-firecoal chestnut-falls") as a verbal dappling; the turn from objects to qualities in stanza two and the paired opposites; and the paradox of "He fathers-forth whose beauty is past change." The commentary explains function, not just presence.
      - 3: Specific evidence supports a line of reasoning, and commentary explains the relationship between evidence and thesis for at least most of the essay, but connections may be uneven or some techniques are identified more than analyzed (for example, a good discussion of the catalogue but only a mention of the last two lines).
      - 2: Some specific evidence, but commentary is mostly summary or paraphrase ("He says skies are spotted like a cow"), or explains the evidence only loosely; the line of reasoning is limited or repetitive.
      - 1: Mostly general evidence (references to "nature" or "religion" without quotation), or commentary that only restates the evidence; little or no line of reasoning.
      - 0: Restates the thesis without evidence, or is irrelevant to the prompt.
      A list of devices ("alliteration, imagery and a metaphor") without explanation of what each does cannot score above 2.

      Row C, Sophistication (0-1). 1 point for writing that demonstrates sophistication of thought or a complex understanding, consistently through the essay rather than in one phrase. For this poem that might mean: explaining the central tension between a world valued for change ("fickle," "swift, slow") and a God valued for being "past change"; exploring how the form (a shortened sonnet that contracts to "Praise him") enacts the move from the many to the one; considering how the poem challenges a conventional idea of beauty as smooth, symmetrical or pure; or a consistently vivid and persuasive style. Merely mentioning "curtal sonnet" or "sprung rhythm" without connecting them to meaning does not earn the point.

  - slug: review-practice-q57
    type: long_answer
    topic_code: "7.D"
    source: "Willa Cather, O Pioneers! (1913)"
    points: 6
    stimulus: |
      *The following passage is from Willa Cather's novel* O Pioneers! *(1913). Alexandra Bergson, the eldest child of Swedish immigrants, has kept the family homestead on the Divide, a high, dry stretch of Nebraska prairie where many neighbors are giving up their farms. She has just spent several days with her younger brother Emil visiting farms in a river valley to the south.*

      At last, on the sixth day, Alexandra turned Brigham's head northward and left the river behind.

      "There's nothing in it for us down there, Emil. There are a few fine farms, but they are owned by the rich men in town, and couldn't be bought. Most of the land is rough and hilly. They can always scrape along down there, but they can never do anything big. Down there they have a little certainty, but up with us there is a big chance. We must have faith in the high land, Emil. I want to hold on harder than ever, and when you're a man you'll thank me." She urged Brigham forward.

      When the road began to climb the first long swells of the Divide, Alexandra hummed an old Swedish hymn, and Emil wondered why his sister looked so happy. Her face was so radiant that he felt shy about asking her. For the first time, perhaps, since that land emerged from the waters of geologic ages, a human face was set toward it with love and yearning. It seemed beautiful to her, rich and strong and glorious. Her eyes drank in the breadth of it, until her tears blinded her. Then the Genius of the Divide, the great, free spirit which breathes across it, must have bent lower than it ever bent to a human will before. The history of every country begins in the heart of a man or a woman.
    prompt: |
      Question 2: Prose fiction analysis. Suggested time: 40 minutes.

      The following passage is from Willa Cather's novel O Pioneers! (1913). In it, Alexandra Bergson returns from a journey to the river farms. Read the passage carefully. Then, in a well-written essay, analyze how Cather uses literary elements and techniques to portray Alexandra's complex relationship with the land.

      In your response you should:
      - Respond to the prompt with a thesis that presents a defensible interpretation of the passage.
      - Select and use evidence from the passage to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: Cather shows Alexandra's bond with the Divide as both shrewd and devout: she chooses the high land on hard-headed grounds, but the passage moves from her business reasoning into hymn, vision and myth, until her love for the land is presented as the founding act of a country.

      Line of reasoning and evidence: (1) Practical judgment. Her speech weighs the river farms like an investor: "owned by the rich men in town," "rough and hilly," "a little certainty" against "a big chance." The balanced antithesis shows a mind that calculates risk, and "I want to hold on harder than ever" shows tenacity. (2) Faith. The same speech turns to the language of belief: "We must have faith in the high land." The Swedish hymn she hums as the road climbs carries that faith into feeling, and her radiant face, seen through Emil's shy and uncomprehending eyes, marks an experience he cannot share. (3) Love and vision. The narrator then widens the frame to geologic time: "For the first time, perhaps, since that land emerged from the waters of geologic ages, a human face was set toward it with love and yearning." The diction is that of romance ("love and yearning"), and "Her eyes drank in the breadth of it" turns seeing into nourishment; her tears show how much she feels. (4) Reciprocity and myth. The personified "Genius of the Divide ... must have bent lower than it ever bent to a human will before" makes the land respond to her, an answer to a love no one else has offered it, and the closing aphorism, "The history of every country begins in the heart of a man or a woman," makes her private feeling the start of a public history.

      Complexity: her relationship is neither purely economic nor purely romantic; the hedges ("perhaps," "must have") let the narrator mythologize while admitting it is a guess.
    explanation: |
      Six points, scored on the AP English Literature 6-point rubric as applied to this passage.

      Row A, Thesis (0-1). 1 point for a defensible thesis about Alexandra's complex relationship with the land, for example that her practical judgment and her almost religious love for the Divide work together, or that Cather turns a farmer's business decision into a founding myth. 0 points for a thesis that restates the prompt ("Cather uses techniques to show Alexandra's relationship with the land"), only summarizes ("Alexandra visits the river farms and comes home"), or claims something the passage contradicts (for example that Alexandra wants to sell the farm).

      Row B, Evidence and Commentary (0-4).
      - 4: Specific evidence throughout supports a line of reasoning, and commentary consistently explains how the techniques convey the complexity. Strong essays connect several of: the contrast in her speech between "a little certainty" and "a big chance," and between the river land and "the high land"; the shift in diction from business to belief ("We must have faith"); the hymn; the limited view through Emil, who sees her radiance but does not understand it; the narrator's leap to "the waters of geologic ages"; the romantic diction "love and yearning" and the metaphor "Her eyes drank in the breadth of it"; the personified "Genius of the Divide" that "bent lower"; and the closing generalization about "the history of every country." Commentary explains what each choice reveals about her bond with the land.
      - 3: Specific evidence supports a line of reasoning and commentary explains it for most of the essay, but some points are thinner, or the essay treats only one side of the relationship (only the love, ignoring the calculation, or the reverse) with good analysis.
      - 2: Some specific evidence, but commentary is mainly summary of what Alexandra says and does, or explains it only in general terms ("this shows she loves the land").
      - 1: General references to the passage with little quotation, or commentary that repeats the evidence; minimal line of reasoning.
      - 0: Restates the thesis without evidence, or is irrelevant.
      Summary of the passage, however accurate, is not commentary; an essay that retells the passage in order and labels devices scores no higher than 2.

      Row C, Sophistication (0-1). 1 point for a consistently complex understanding, such as: explaining how Cather fuses economic and spiritual language so that Alexandra's practicality is itself a form of faith; analyzing the narrator's hedges ("perhaps," "must have") as a way of making myth while admitting it is myth; considering the shift from Emil's limited view to the narrator's vast perspective; situating the passage in the larger story of settlement on the plains without drifting from the text; or a consistently vivid, persuasive style. A single clever sentence is not enough.

  - slug: review-practice-q58
    type: long_answer
    topic_code: "7.B"
    source: "general knowledge"
    points: 6
    prompt: |
      Question 3: Literary argument. Suggested time: 40 minutes.

      In many works of literature, a character is expected to play a particular role, whether set by a family, a community or a whole society. Some characters accept the role; others resist it, openly or in secret, and pay a price either way.

      Choose a work of fiction or drama in which a character's acceptance of or resistance to an expected role is significant. Then, in a well-written essay, analyze how that acceptance or resistance contributes to an interpretation of the work as a whole. Do not merely summarize the plot.

      You may choose a work from the list below or another work of comparable literary merit. From this course: Henrik Ibsen, A Doll's House; William Shakespeare, Hamlet; F. Scott Fitzgerald, The Great Gatsby; Mary Shelley, Frankenstein; Charlotte Perkins Gilman, "The Yellow Wall-Paper"; O. Henry, "The Gift of the Magi"; Herman Melville, "Bartleby, the Scrivener"; Charles W. Chesnutt, "The Wife of His Youth"; Nathaniel Hawthorne, "Young Goodman Brown"; Katherine Mansfield, "Miss Brill."

      In your response you should:
      - Respond to the prompt with a thesis that presents a defensible interpretation of the work.
      - Select and use evidence from the work to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Model response on A Doll's House. Thesis: Nora Helmer's slow move from performing the role of the doll-wife to rejecting it reveals that the Helmer marriage, and the society that approves it, rests on a performance both partners have agreed not to see through; when Nora stops playing, the play suggests that a person must first become an individual before she can be a wife or mother.

      Line of reasoning: (1) Acceptance as performance. In Act I Nora plays the part Torvald assigns her: she answers to "lark" and "squirrel," hides the macaroons, and acts helpless, while secretly she has saved his life with a forged loan and has been working to repay it. The role is a mask over competence. (2) The role under pressure. Krogstad's threat forces the secret toward the light; the tarantella in Act II is the role performed at its most frantic, a dance to delay discovery. (3) Resistance. In Act III Torvald's reaction to the letter (fury, then relieved forgiveness once he is safe) shows Nora that the "wonderful thing" she hoped for will not happen. She sits him down to talk seriously for the first time, says she has been his doll-wife as she was her father's doll-child, and leaves to educate herself. (4) Interpretation. The closing door is the price and the point: resistance costs her home and children, but staying would mean living a role in place of a self. Ibsen turns a domestic drama into a question about whether marriage can be honest when one partner's identity is defined by the other.

      Other strong choices: Hamlet resisting the role of revenger, or Bartleby refusing the role of copyist.
    explanation: |
      Six points, scored on the AP English Literature 6-point rubric for the literary argument essay.

      Row A, Thesis (0-1). 1 point for a defensible thesis that names a work and analyzes how a character's acceptance of or resistance to an expected role contributes to an interpretation of the work as a whole. "Nora resists her role as a wife" earns nothing alone; "Nora's rejection of the doll-wife role exposes a marriage built on mutual pretence and argues that selfhood must come before social duty" earns the point. 0 points for restating the prompt, for a thesis about the character with no link to the work's meaning, or for a thesis that does not name a work.

      Row B, Evidence and Commentary (0-4).
      - 4: Specific, relevant evidence from the chosen work (key scenes, actions and lines, quoted or closely paraphrased) supports a line of reasoning, and commentary consistently explains how the character's response to the role builds the interpretation. For A Doll's House, a 4 might trace Nora's pet names and hidden loan, the tarantella, Torvald's response to Krogstad's letter, and the final conversation and door. For Hamlet, his delay and "antic disposition" as resistance to the revenger's role set by the Ghost. For "Bartleby," "I would prefer not to" as resistance to the copyist's role and what it reveals about the narrator and Wall Street. For The Great Gatsby, Gatsby's self-invention against the class role he was born to.
      - 3: Specific evidence supports a line of reasoning, with commentary that explains most of it, but some links are thinner or the essay leans on one or two moments.
      - 2: Some specific evidence, but the essay mostly retells the plot in order, with commentary that is general ("this shows she is unhappy").
      - 1: Evidence is vague or mostly inaccurate; little or no commentary; minimal line of reasoning.
      - 0: No evidence, or the evidence comes from no identifiable work.
      Plot summary is not evidence of reasoning: an essay that retells the work accurately without explaining how the episodes support the thesis scores no higher than 2. Minor factual errors do not cost points unless they undermine the argument; a work of doubtful literary merit (a film, a children's picture book) usually limits Row B.

      Row C, Sophistication (0-1). 1 point for a consistently complex argument, such as: showing how acceptance and resistance coexist in the same character (Nora's role-playing is itself a hidden act of agency); weighing the cost of resistance against the cost of acceptance; considering the work's historical moment or its other characters (Mrs. Linde, called Mrs. Linden in Archer's translation, who chooses her role freely) to complicate the reading; or a consistently vivid, persuasive style. A single sentence gesturing at "society" or "the human condition" does not earn the point.
