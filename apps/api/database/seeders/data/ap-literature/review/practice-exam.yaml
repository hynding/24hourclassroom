    topic_code: "3.B"
    source: "Oscar Wilde, An Ideal Husband (1899)"
    points: 1
    stimulus: *ih
    prompt: |
      Mrs. Cheveley reveals what she knows in stages: first a general accusation, then the letter, then that it is "in my possession," and only then her price. This sequence primarily serves to
    options:
