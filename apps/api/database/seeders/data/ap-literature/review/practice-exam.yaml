    topic_code: "1.E"
    source: "Oscar Wilde, An Ideal Husband (1899)"
    points: 1
    stimulus: *ih
    prompt: |
      In "You mean you cannot help doing it," Mrs. Cheveley recasts Sir Robert's "I cannot do what you ask me." This reply characterizes her as
    options:
