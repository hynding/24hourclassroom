          Correct. A lease grants temporary possession that expires on a set date. Summer does not own its beauty; it rents it briefly, which sets up the contrast with the beloved's "eternal summer".
        - |
          The beloved is not party to summer's lease; the beloved's beauty is precisely what will not expire.
        - |
          "Date" here means the end of the lease's term, its expiry, not a remembered day.
