guide: guides/week-06.md
guide_description: |
  Simile and metaphor as arguments, not decorations: the tenor and vehicle of a comparison, how to explain what a
  comparison carries over, extended metaphor, and comparisons that are denied or overturned. Worked readings of
  Sonnets 18 and 130, Burns's "A Red, Red Rose", Dickinson's "Hope" and Hughes's "The Negro Speaks of Rivers",
  then the unit's writing goal: a claim-and-evidence paragraph about a comparison.
flashcards_description: |
  30 cards on simile, metaphor, extended metaphor and the comparisons in this week's five poems.

flashcards:
  - front: "Simile → what it is and the question to ask of it"
    back: |
      An explicit comparison using "like" or "as" (or "than"): "O my Luve is like a red, red rose". Ask: which qualities of the second thing are carried over to the first, and why these?
    topic_code: "6.A"
  - front: "Metaphor → what it is and the question to ask of it"
    back: |
      A comparison that says or implies one thing IS another, without "like" or "as": "Hope is the thing with feathers". Ask the same question as for a simile, and also what the boldness of the identification adds.
    topic_code: "6.B"
  - front: "Tenor and vehicle"
    back: |
      The tenor is the subject being described (hope); the vehicle is the thing it is compared to (a bird). Explaining a comparison means naming both and saying what the vehicle lends the tenor.
    hint: Tenor = topic; vehicle = the image that carries it.
    topic_code: "6.B"
  - front: "Extended (controlling) metaphor → in a short lyric"
    back: |
      A metaphor developed across several lines or a whole poem. Dickinson's hope-as-bird runs through all twelve lines: it perches, sings, braves the gale, keeps others warm, never asks a crumb.
    topic_code: "6.B"
  - front: "Implied metaphor"
    back: |
      A comparison made through a verb or detail rather than stated: hope "perches in the soul" makes hope a bird without saying so again. Also: the rivers' "muddy bosom" makes the Mississippi a body.
    topic_code: "6.B"
  - front: "Function of a comparison → the three-step explanation"
    back: |
      1) Name tenor and vehicle. 2) Say which qualities transfer (freshness, fragility, endurance...). 3) Say what that does for the poem's meaning or the speaker's perspective. Step 3 earns the points.
    topic_code: "6.A"
  - front: "Sonnet 18 → “Shall I compare thee to a summer's day?”"
    back: |
      The speaker proposes a comparison and immediately finds it inadequate: "Thou art more lovely and more temperate". The sonnet is about the limits of comparison itself.
    topic_code: "6.A"
  - front: "Sonnet 18 → what is wrong with summer?"
    back: |
      Its "Rough winds" shake May's buds, its "lease hath all too short a date", the sun ("the eye of heaven") is sometimes too hot and sometimes "dimm'd". Summer is unstable and brief; the beloved is "more temperate".
    topic_code: "6.B"
  - front: "Sonnet 18 → “summer's lease”"
    back: |
      A metaphor from property law: summer is only rented, with a short term. Beauty in nature is held on a lease that expires.
    topic_code: "6.B"
  - front: "Sonnet 18 → “thy eternal summer shall not fade”"
    back: |
      The turn at line 9. The beloved's "summer" (youth and beauty) becomes a metaphor that, unlike real summer, will not end, because it lives in the poem.
    topic_code: "6.B"
  - front: "Sonnet 18 → the couplet's claim"
    back: |
      "So long as men can breathe, or eyes can see, / So long lives this, and this gives life to thee." "This" is the poem: verse outlasts nature and grants the beloved a life as long as readers exist.
    topic_code: "6.B"
  - front: "Sonnet 130 → “My mistress' eyes are nothing like the sun”"
    back: |
      A negated simile. The speaker refuses the stock comparison of love poetry (eyes like suns), and every quatrain goes on refusing.
    topic_code: "6.A"
  - front: "Sonnet 130 → “If hairs be wires, black wires grow on her head”"
    back: |
      Love poets compared a lady's hair to golden wire. Shakespeare takes the metaphor literally: if hair must be wire, hers is black wire. The literalness exposes how odd the convention is.
    topic_code: "6.B"
  - front: "Sonnet 130 → the Petrarchan conventions it mocks"
    back: |
      Eyes like the sun, lips like coral, skin like snow, cheeks like roses, breath like perfume, voice like music, a walk like a goddess's. Sonnet 130 tests each against reality and lets each fail.
    topic_code: "6.A"
  - front: "Sonnet 130 → “I grant I never saw a goddess go,— / My mistress, when she walks, treads on the ground”"
    back: |
      The final quatrain grounds her literally: she is a woman, not a goddess. "Treads on the ground" is plain fact set against inflated praise.
    topic_code: "6.B"
  - front: "Sonnet 130 → “false compare”"
    back: |
      "Compare" as a noun: comparison. The couplet says his love is as "rare" as any woman "belied" (misrepresented) by false comparisons. The poem's argument is against dishonest similes, not against love.
    topic_code: "6.A"
  - front: "Sonnets 18 and 130 → how they differ on comparison"
    back: |
      Sonnet 18 finds a comparison too small and replaces it with the poem's own immortalizing power; Sonnet 130 finds conventional comparisons false and replaces them with honest description. Both question simile, from opposite directions.
    topic_code: "6.A"
  - front: "“A Red, Red Rose” → the two opening similes"
    back: |
      "O my Luve is like a red, red rose / That's newly sprung in June" and "like the melody / That's sweetly played in tune". Freshness, color, beauty and harmony: love as something just blooming and perfectly in tune.
    topic_code: "6.A"
  - front: "“A Red, Red Rose” → “Luve” means two things"
    back: |
      "My Luve" can mean the beloved woman and the speaker's love itself. The similes describe both, and stanza 2 turns to address her directly: "So fair art thou, my bonnie lass".
    topic_code: "6.A"
  - front: "“A Red, Red Rose” → “Till a' the seas gang dry”"
    back: |
      Scots for "till all the seas go dry": a hyperbole naming an impossible event as the limit of his love. With rocks melting in the sun, it measures constancy against geological time.
    topic_code: "5.B"
  - front: "“A Red, Red Rose” → “the sands o' life”"
    back: |
      The sand in an hourglass, a metaphor for a lifetime running out. The love is pledged for as long as his life lasts.
    topic_code: "6.B"
  - front: "Dickinson's “Hope” → what the bird does"
    back: |
      It "perches in the soul", "sings the tune without the words", "never stops at all", is "sweetest in the gale", could hardly be abashed by a storm, "kept so many warm", and never "asked a crumb". Each verb is a claim about hope.
    topic_code: "6.B"
  - front: "Dickinson's “Hope” → “sings the tune without the words”"
    back: |
      Hope does not argue or explain; it is felt before it can be put into reasons. Wordless song suggests hope persists even when there is nothing definite to hope for.
    topic_code: "6.B"
  - front: "Dickinson's “Hope” → “It asked a crumb of me”"
    back: |
      Even "in extremity", hope never demanded anything from the speaker. A bird would need feeding; hope gives without taking. The final line turns the metaphor into gratitude.
    topic_code: "6.B"
  - front: "Dickinson's “Hope” → the 1891 text"
    back: |
      Printed in Poems, Second Series (1891) under the editors' title "Hope", without the quotation marks around the word that later editions restored from Dickinson's manuscript.
    topic_code: "6.B"
  - front: "“The Negro Speaks of Rivers” → “My soul has grown deep like the rivers”"
    back: |
      The refrain-simile of Hughes's poem. Depth is the shared quality: the speaker's soul, like a river, has been carved over ages and carries a long history.
    topic_code: "6.A"
  - front: "“The Negro Speaks of Rivers” → the four rivers"
    back: |
      Euphrates, Congo, Nile, Mississippi: a journey from the cradle of civilization through Africa to America. The speaker claims all of that history as his own memory ("I bathed", "I built", "I looked", "I heard").
    topic_code: "3.C"
  - front: "“The Negro Speaks of Rivers” → “muddy bosom turn all golden in the sunset”"
    back: |
      The Mississippi, linked to Lincoln's journey to New Orleans and so to slavery, is given a body ("bosom") and transformed from muddy to golden: a metaphor of change and dignity.
    topic_code: "6.B"
  - front: "Dead metaphor vs live metaphor"
    back: |
      A dead metaphor has stopped being heard as one ("the leg of a table"). Poets revive them: Sonnet 130 takes "hair like wire" so literally it comes back to life as a joke.
    topic_code: "6.B"
  - front: "Comparison paragraph → the 7.A skeleton"
    back: |
      Claim about what the comparison argues; quote the comparison; explain tenor, vehicle and the qualities transferred; connect to the poem's larger meaning. One comparison explained well beats five listed.
    topic_code: "7.A"

quiz:
  description: |
    25 questions · about 40 minutes · opens with a set on Shakespeare's Sonnet 130 and a set on Dickinson's "Hope",
    then items on Sonnet 18, "A Red, Red Rose" and "The Negro Speaks of Rivers", two short claim-and-evidence answers
    and an essay on "Hope". About 70% on simile, metaphor and the claim-and-evidence paragraph (6.A, 6.B, 7.A) and
    30% review of speaker, structure and word function. Multiple choice, select-all, true/false and fill-in-the-blank
    items are graded at once; the short answers and the essay are graded by your teacher against the model answer and
    rubric.
  questions:
    # ---- Set A: Sonnet 130
    - slug: u02-w06-q01
      type: multiple_choice
      topic_code: "6.A"
      source: 'William Shakespeare, Sonnet 130 (1609)'
      points: 1
      stimulus: &s130 |
        *The following sonnet by William Shakespeare was first published in 1609. Punctuation follows the Project Gutenberg text; "mistress" means the woman the speaker loves.*

        My mistress' eyes are nothing like the sun;
        Coral is far more red, than her lips red:
        If snow be white, why then her breasts are dun;
        If hairs be wires, black wires grow on her head.
        I have seen roses damask'd, red and white,     [5]
        But no such roses see I in her cheeks;
        And in some perfumes is there more delight
        Than in the breath that from my mistress reeks.
        I love to hear her speak, yet well I know
        That music hath a far more pleasing sound:     [10]
        I grant I never saw a goddess go,—
        My mistress, when she walks, treads on the ground:
        And yet by heaven, I think my love as rare,
        As any she belied with false compare.
      prompt: |
        The simile in line 1, "My mistress' eyes are nothing like the sun", primarily serves to
      options:
        - "insult the speaker's mistress by calling her eyes dull"
        - "reject a conventional comparison of love poetry and announce the poem's refusal of such praise"
        - "suggest that the mistress avoids going out in the sun"
        - "show that the speaker has never looked closely at his mistress"
      option_explanations:
        - |
          Read alone, the line might sound like an insult, but the couplet declares his love "as rare" as any; the target is the convention, not the woman.
        - |
          Correct. Eyes like the sun were a stock comparison in Renaissance love poetry. Opening with "nothing like" turns the simile inside out and sets the pattern for every quatrain: each conventional comparison is tested and rejected.
        - |
          The sun is the vehicle of a comparison, not a literal setting; nothing concerns her habits.
        - |
          The poem is full of close, specific observation of her lips, hair, cheeks, breath, voice and walk. He has looked very closely.
      answer: 1

    - slug: u02-w06-q02
      type: multiple_choice
      topic_code: "6.B"
      source: 'William Shakespeare, Sonnet 130 (1609)'
      points: 1
      stimulus: *s130
      prompt: |
        Line 4, "If hairs be wires, black wires grow on her head", is best described as
      options:
        - "a sincere metaphor praising the strength of her hair"
        - "a conventional metaphor (hair as golden wire) taken so literally that it becomes absurd"
        - "a simile comparing her hair to the strings of a musical instrument"
        - "a literal description of a woman whose hair is made of metal"
      option_explanations:
        - |
          Strength is not praised; the line's joke depends on the oddness of calling hair "wires" at all.
        - |
          Correct. Poets praised golden hair as fine gold wire. Shakespeare accepts the metaphor's terms ("If hairs be wires") and follows them to an unflattering literal result: black wires. The conditional exposes the convention as silly.
        - |
          There is no "like" or "as", and no instrument; music enters the poem only in lines 9-10.
        - |
          "If" marks a hypothetical comparison; the speaker is mocking a figure of speech, not describing literal metal.
      answer: 1

    - slug: u02-w06-q03
      type: multiple_choice
      topic_code: "4.A"
      source: 'William Shakespeare, Sonnet 130 (1609)'
      points: 1
      stimulus: *s130
      prompt: |
        The speaker's attitude toward the conventions of love poetry is best described as
      options:
        - "reverent admiration"
        - "wry, skeptical mockery"
        - "bitter disillusionment with love itself"
        - "anxious uncertainty"
      option_explanations:
        - |
          He tests each convention (sun, coral, snow, roses, perfume, music, goddess) and finds it false; that is not reverence.
        - |
          Correct. The tone is dry and playful: "If snow be white, why then her breasts are dun", "treads on the ground". He laughs at the inflated comparisons while affirming, in the couplet, a real love.
        - |
          The couplet ("I think my love as rare") affirms love. He is disillusioned with poetic flattery, not with love.
        - |
          His statements are confident and clipped ("I grant", "well I know"); there is no hesitation.
      answer: 1

    - slug: u02-w06-q04
      type: multiple_choice
      topic_code: "3.C"
      source: 'William Shakespeare, Sonnet 130 (1609)'
      points: 1
      stimulus: *s130
      prompt: |
        The couplet (lines 13-14) functions in the structure of the sonnet chiefly to
      options:
        - "continue the list of the mistress's physical flaws"
        - "turn from rejecting false comparisons to affirming the speaker's love as genuine and rare"
        - "apologize to the mistress for the insults of the first twelve lines"
        - "reveal that the speaker has fallen in love with a goddess"
      option_explanations:
        - |
          The list ends at line 12. "And yet" signals a change of direction.
        - |
          Correct. Twelve lines dismantle conventional praise; the couplet turns ("And yet by heaven") to state the point: his love is as rare as any woman misrepresented by flattering comparisons. Honesty, not hyperbole, is his proof of love.
        - |
          There is no apology; the couplet claims that the first twelve lines were honest, which is a kind of compliment.
        - |
          Line 11 says the opposite: "I grant I never saw a goddess go".
      answer: 1

    - slug: u02-w06-q05
      type: multiple_choice
      topic_code: "5.B"
      source: 'William Shakespeare, Sonnet 130 (1609)'
      points: 1
      stimulus: *s130
      prompt: |
        In the final line, "As any she belied with false compare", the word "belied" most nearly means
      options:
        - "believed"
        - "misrepresented"
        - "betrayed by a lover"
        - "praised sincerely"
      option_explanations:
        - |
          "Belied" sounds like "believed", but it comes from "lie": to give a false picture of.
        - |
          Correct. Any "she" (any woman) has been misrepresented by "false compare", that is, by untrue comparisons. The word names the poem's target: flattering similes are lies.
        - |
          Romantic betrayal is not in the line; the falsehood is in the comparisons, not in a lover's conduct.
        - |
          "False compare" rules out sincerity; the line contrasts the speaker's honest love with dishonest praise.
      answer: 1

    - slug: u02-w06-q06
      type: multi_select
      topic_code: "6.A"
      source: 'William Shakespeare, Sonnet 130 (1609)'
      points: 2
      partial_credit: true
      stimulus: *s130
      prompt: |
        Which TWO lines make an explicit comparison (with "like" or "than") that the speaker uses to deny a conventional image of beauty? Select all that apply.
      options:
        - "“My mistress' eyes are nothing like the sun” (line 1)"
        - "“Coral is far more red, than her lips red” (line 2)"
        - "“I grant I never saw a goddess go” (line 11)"
        - "“My mistress, when she walks, treads on the ground” (line 12)"
      option_explanations:
        - |
          Selected. A simile with "like", negated by "nothing": eyes are compared to the sun and found unlike.
        - |
          Selected. A comparison with "than": coral is redder than her lips, so the conventional coral lips fail.
        - |
          Not selected. The line contrasts her with a goddess implicitly, but it makes no "like" or "than" comparison; it is a concession about what he has seen.
        - |
          Not selected. A plain, literal statement; its force comes from refusing figurative language altogether.
      answer: [0, 1]

    - slug: u02-w06-q07
      type: true_false
      topic_code: "6.B"
      source: 'William Shakespeare, Sonnet 130 (1609)'
      points: 1
      stimulus: *s130
      prompt: |
        True or false: in Sonnet 130 the speaker uses the metaphor of a goddess to describe the way his mistress walks.
      answer: false
      explanation: |
        False. He refuses that metaphor: "I grant I never saw a goddess go,— / My mistress, when she walks, treads on the ground". The goddess is the conventional comparison he will not use; the plain fact that she walks on the ground replaces it.

    - slug: u02-w06-q08
      type: fill_blank
      topic_code: "6.A"
      source: general knowledge
      points: 1
      prompt: |
        A comparison between two unlike things that uses "like" or "as", such as Burns's "O my Luve is like a red, red rose", is called a ____.
      answer: ["simile"]
      explanation: |
        A simile. Sonnet 130 builds its argument by denying similes; Burns builds his by stacking them.

    # ---- Set B: Dickinson, "Hope"
    - slug: u02-w06-q09
      type: multiple_choice
      topic_code: "6.B"
      source: 'Emily Dickinson, "Hope" (1891)'
      points: 1
      stimulus: &hope |
        *The following poem by Emily Dickinson was published after her death in* Poems, Second Series *(1891), where its editors titled it "Hope."*

        Hope is the thing with feathers
        That perches in the soul,
        And sings the tune without the words,
        And never stops at all,

        And sweetest in the gale is heard;     [5]
        And sore must be the storm
        That could abash the little bird
        That kept so many warm.

        I've heard it in the chillest land,
        And on the strangest sea;     [10]
        Yet, never, in extremity,
        It asked a crumb of me.
      prompt: |
        The metaphor in line 1 is best described as
      options:
        - "a single comparison that the poem drops after the first stanza"
        - "an extended metaphor, developed across the whole poem, that presents hope as a small, singing bird living in the soul"
        - "a simile comparing hope to a feather"
        - "a literal description of a bird the speaker owns"
      option_explanations:
        - |
          The bird returns in stanza 2 ("the little bird") and is implied in stanza 3 ("I've heard it", "a crumb"); the comparison runs throughout.
        - |
          Correct. The vehicle (a bird) is never named in line 1, only "the thing with feathers", and then developed: it perches, sings, braves the gale, keeps others warm and asks nothing. An extended metaphor carries the whole poem's argument.
        - |
          There is no "like" or "as", and hope is not a feather but "the thing with feathers": a bird.
        - |
          The bird "perches in the soul"; it is figurative from the start.
      answer: 1

    - slug: u02-w06-q10
      type: multiple_choice
      topic_code: "6.B"
      source: 'Emily Dickinson, "Hope" (1891)'
      points: 1
      stimulus: *hope
      prompt: |
        Lines 5-8 develop the metaphor chiefly to suggest that hope
      options:
        - "is easily silenced by hardship"
        - "is most evident in hard times, and only a terrible storm could daunt it"
        - "needs to be protected from danger by the soul"
        - "deserts people when the weather turns bad"
      option_explanations:
        - |
          The reverse: it is "sweetest in the gale", and "sore must be the storm" that could abash it.
        - |
          Correct. Hope's song is "sweetest in the gale": we hear it most when things are worst. Only an extraordinarily severe ("sore") storm could abash the bird that "kept so many warm", which also shows hope's power to comfort others.
        - |
          The bird protects others ("kept so many warm"); nothing says the soul protects it.
        - |
          The stanza insists that hope sings through the gale; it does not desert.
      answer: 1

    - slug: u02-w06-q11
      type: multiple_choice
      topic_code: "6.B"
      source: 'Emily Dickinson, "Hope" (1891)'
      points: 1
      stimulus: *hope
      prompt: |
        The final line, "It asked a crumb of me", completes the metaphor by suggesting that hope
      options:
        - "has finally made a demand the speaker cannot meet"
        - "sustains the speaker without ever demanding anything in return"
        - "is starving because the speaker neglected it"
        - "is as small and unimportant as a crumb"
      option_explanations:
        - |
          Line 11 begins "Yet, never": the bird never asked a crumb.
        - |
          Correct. A real bird must be fed; this one, even "in extremity", never asked even a crumb. Hope gives freely, which turns the metaphor into a statement of gratitude.
        - |
          "Never... asked" means it needed nothing; the poem does not suggest neglect.
        - |
          The crumb measures how little hope asked, not how little it is worth; the poem praises its generosity.
      answer: 1

    - slug: u02-w06-q12
      type: multiple_choice
      topic_code: "3.C"
      source: 'Emily Dickinson, "Hope" (1891)'
      points: 1
      stimulus: *hope
      prompt: |
        Which best describes the movement of the poem's three stanzas?
      options:
        - "a definition of hope, a test of hope in a storm, and the speaker's personal testimony to hope's generosity"
        - "a question, an answer and a second question"
        - "a description of spring, summer and winter"
        - "a story of hope's birth, life and death"
      option_explanations:
        - |
          Correct. Stanza 1 says what hope is and does; stanza 2 shows it at its strongest in the gale; stanza 3 shifts to "I've heard it", the speaker's own experience, ending in the claim that it never asked anything. The structure moves from general to personal.
        - |
          The poem asks no questions; it makes statements throughout.
        - |
          There are no seasons; "gale", "storm", "chillest land" and "strangest sea" are trials, not a calendar.
        - |
          Hope "never stops at all"; the poem does not narrate its death.
      answer: 0

    - slug: u02-w06-q13
      type: fill_blank
      topic_code: "6.B"
      source: general knowledge
      points: 1
      prompt: |
        A metaphor that is developed through an entire poem, as hope is a bird throughout Dickinson's "Hope", is called an ____ metaphor.
      answer: ["extended", "controlling", "sustained"]
      explanation: |
        An extended (or controlling) metaphor. Explaining one means tracing how each new detail of the vehicle (perching, singing, bravery, warmth, needing no crumb) adds to what the poem says about the tenor.

    - slug: u02-w06-q14
      type: long_answer
      topic_code: "6.B"
      source: 'Emily Dickinson, "Hope" (1891)'
      points: 6
      stimulus: *hope
      prompt: |
        Read carefully the poem above, Emily Dickinson's "Hope" (published 1891). In a well-written essay, analyze how Dickinson uses literary elements and techniques, such as metaphor, word choice and structure, to convey a complex understanding of hope.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: through a single extended metaphor of a small bird, Dickinson presents hope as fragile in appearance but tireless in fact, a power that sustains us most in adversity and asks nothing in return.
        Line of reasoning and evidence: (1) The metaphor's vehicle is modest ("the thing with feathers", "the little bird"), yet it "perches in the soul" and "never stops at all": hope looks slight but is constant. (2) "Sings the tune without the words" suggests hope works beneath reason, felt rather than argued. (3) Stanza 2's paradox, "sweetest in the gale is heard", makes adversity the condition in which hope is most audible; "sore must be the storm / That could abash" it concedes that hope can be daunted only by the worst. (4) The shift to "I've heard it" in stanza 3 turns definition into testimony, and "Yet, never, in extremity, / It asked a crumb of me" reveals hope's generosity, ending in gratitude.
        Complexity: the poem admits the storm's power ("sore must be the storm") and the speaker's hardships ("chillest land", "strangest sea"); hope is praised precisely because it survives them.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis about how Dickinson conveys a complex view of hope (not just "hope is like a bird").
        Row B Evidence and Commentary (0-4):
        4 = specific evidence from all three stanzas, consistently explained: what each part of the bird metaphor (perching, wordless song, gale, warmth, the crumb) contributes to the view of hope, and how the shift to personal testimony works.
        3 = specific, relevant evidence and explanation for at least some of it; commentary may be uneven or miss the structure.
        2 = relevant evidence but commentary mostly paraphrases ("this shows hope is strong").
        1 = general evidence or restatement of the thesis.
        0 = no relevant evidence.
        Row C Sophistication (0-1): 1 point for a complex understanding, such as the tension between the bird's smallness and its endurance, the significance of a "tune without the words", or how the closing line turns description into gratitude.

    # ---- Sonnet 18, Burns, Hughes
    - slug: u02-w06-q15
      type: multiple_choice
      topic_code: "6.A"
      source: 'William Shakespeare, Sonnet 18 (1609)'
      points: 1
      prompt: |
        Sonnet 18 begins, "Shall I compare thee to a summer's day? / Thou art more lovely and more temperate". These lines treat the proposed comparison as
      options:
        - "a perfect match that the rest of the poem will celebrate"
        - "an inadequate comparison, because the beloved surpasses summer"
        - "an insult the speaker regrets having made"
        - "a comparison the beloved has requested"
      option_explanations:
        - |
          The second line already corrects the comparison: the beloved is "more lovely and more temperate". The poem goes on to list summer's faults.
        - |
          Correct. The speaker proposes a simile and finds summer falls short: it has rough winds, too short a "lease", a sun too hot or "dimm'd". The poem is about a comparison that fails because its subject exceeds it.
        - |
          A summer's day is a flattering comparison; the problem is that it is not flattering enough.
        - |
          The question is the speaker's own, posed rhetorically; nothing suggests the beloved asked for it.
      answer: 1

    - slug: u02-w06-q16
