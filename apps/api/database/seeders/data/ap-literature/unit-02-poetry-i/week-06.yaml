    - slug: u02-w06-q23
      type: multiple_choice
      topic_code: "6.B"
      source: 'William Shakespeare, Sonnet 18 (1609)'
      points: 1
      prompt: |
        Sonnet 18 ends, "So long as men can breathe, or eyes can see, / So long lives this, and this gives life to thee." The word "this" refers to
      options:
        - "the summer's day"
        - "the poem itself, which keeps the beloved alive as long as it is read"
        - "the beloved's breath"
        - "death, which the speaker has defeated"
      option_explanations:
        - |
          Summer is the comparison the poem rejected; it fades, which is the opposite of what "this" does.
        - |
          Correct. The beloved will live "in eternal lines", that is, in verse. The couplet claims that poetry outlasts nature: every reader who breathes and sees keeps the poem, and so the beloved, alive.
        - |
          Breath belongs to "men" who read; "this" is what they read.
        - |
          Death is mentioned in line 11 ("Nor shall death brag"), but "this" is what "gives life", not death.
