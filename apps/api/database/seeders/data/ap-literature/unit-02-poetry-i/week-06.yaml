    - slug: u02-w06-q24
      type: short_answer
      topic_code: "7.A"
      source: 'William Shakespeare, Sonnet 130 (1609)'
      points: 3
      prompt: |
        Write a claim that requires defense about why the speaker of Sonnet 130 refuses conventional comparisons, and support it with one or two short quotations and a sentence of commentary.
      answer: |
        The speaker refuses flattering comparisons because he thinks they are lies that cheapen love; honest description is his proof of real feeling. He admits "Coral is far more red, than her lips red" and that his mistress "treads on the ground", then insists his love is "as rare, / As any she belied with false compare". Calling the conventional similes "false compare" shows that his target is dishonest praise, and that he values her as she is.
      explanation: |
        1 point: an arguable claim about the reason for or effect of the refusal (honesty, mockery of convention, a truer kind of love).
        1 point: relevant, accurate quotation.
        1 point: commentary that explains how the quotation supports the claim. A claim that the speaker dislikes his mistress cannot earn the claim point, because the couplet contradicts it.

    - slug: u02-w06-q25
      type: short_answer
      topic_code: "7.A"
      source: 'William Shakespeare, Sonnet 18 (1609) and Sonnet 130 (1609)'
      points: 3
      prompt: |
        Sonnets 18 and 130 both question the value of comparing a beloved to something else. Write a claim that explains how their answers differ, and support it with one short quotation from each sonnet.
      answer: |
        Sonnet 18 rejects comparison because the beloved is too good for it, while Sonnet 130 rejects comparison because comparisons are dishonest. In 18 a summer's day falls short, since "summer's lease hath all too short a date", and the poem replaces nature with verse that will last forever. In 130 the speaker says his love's eyes "are nothing like the sun" and calls such similes "false compare", replacing flattery with plain truth.
      explanation: |
        1 point: a claim that distinguishes the two sonnets' positions on comparison (not just "both are about love").
        1 point: one accurate quotation from each sonnet.
        1 point: commentary linking each quotation to the claim.
