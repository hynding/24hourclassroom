        True or false: because Langston Hughes wrote "Mother to Son", the speaker of the poem should be identified as Hughes himself.
      answer: false
      explanation: |
        False. The speaker is a mother addressing her son ("Well, son, I'll tell you"), with her own voice and dialect. She is a persona Hughes created. Identify the speaker from the text, not from the author's name; confusing the two leads to misreadings on the exam.

