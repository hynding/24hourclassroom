guide: guides/week-04.md
guide_description: |
  The first poetry week: how to read a poem line by line and sentence by sentence, how to find and describe the
  speaker, and how single words carry character. Worked close readings of Dunbar's "We Wear the Mask", Robinson's
  "Richard Cory", Dickinson's "I'm nobody! Who are you?" and Hughes's "Mother to Son", a model claim-and-evidence
  paragraph, common misreadings and a self-check.
flashcards_description: |
  30 cards on reading lines and stanzas, the speaker as a character, and the words that reveal character in this
  week's four poems.

flashcards:
  - front: "Speaker of a poem → why not just say “the poet”?"
    back: |
      The speaker is the voice that says the poem, and it is a made thing, like a narrator. Sometimes it is close to the poet, sometimes a mask or a character (a mother, a townsperson). Saying "the speaker" keeps you reading the text, not guessing at the author's life.
    topic_code: "4.A"
  - front: "Persona → in a poem"
    back: |
      A character the poet invents to speak the poem, clearly not the poet: the mother in Hughes's "Mother to Son" is a persona. The Latin word means a mask, which is exactly Dunbar's subject.
    topic_code: "4.A"
  - front: "Line versus sentence → how to read a poem aloud"
    back: |
      A line ends where the poet breaks it; a sentence ends at its punctuation. Read to the punctuation, not to the end of each line, then notice where the line break makes you pause or puts weight on a word.
    hint: Follow the commas and periods, not the margin.
    topic_code: "5.B"
  - front: "Enjambment → first-week definition"
    back: |
      A sentence that runs past the end of a line without punctuation, so the line break falls mid-thought. "Nay, let them only see us, while / We wear the mask" holds the reader on "while" before the refrain lands.
    topic_code: "5.B"
  - front: "End-stopped line"
    back: |
      A line that ends with punctuation, so sense and line finish together. Robinson's quatrains are mostly end-stopped, which gives "Richard Cory" its calm, even pace until the last line's shock.
    topic_code: "5.B"
  - front: "Stanza → what it is and what to ask of one"
    back: |
      A group of lines set off by a space, the poem's paragraph. Ask what each stanza does (introduce, develop, turn, conclude) and what changes from one to the next.
    topic_code: "5.B"
  - front: "Quatrain"
    back: |
      A four-line stanza. "Richard Cory" is four quatrains; Dickinson's "I'm nobody!" is two.
    topic_code: "5.B"
  - front: "Refrain → in “We Wear the Mask”"
    back: |
      "We wear the mask" ends stanza 2 as a statement and the poem as an exclamation. Repeating the phrase makes the mask a fixed condition the speakers return to, however much the lines between reveal.
    topic_code: "5.B"
  - front: "Diction → what the AP exam means by it"
    back: |
      Word choice. On the exam, "explain the function of a word" means: what does it denote, what does it connote, and what does choosing it (instead of a near-synonym) tell you about the speaker or subject?
    topic_code: "5.B"
  - front: "Denotation vs connotation → “imperially slim”"
    back: |
      "Slim" denotes thinness; "imperially" adds the connotations of an emperor: command, distance, being looked up to. Robinson makes Cory's body itself sound royal to the watching townspeople.
    topic_code: "5.B"
  - front: "“We Wear the Mask” → who is “we”?"
    back: |
      A collective speaker. Read in Dunbar's moment (1895), the "we" is most often taken as Black Americans after Reconstruction, though the poem never names a group, so it also extends to anyone forced to hide pain behind a performance.
    topic_code: "4.A"
  - front: "“We Wear the Mask” → “grins and lies”"
    back: |
      The mask is the subject of the verbs: it grins and it lies. The performance is active and deceptive, a smile the speakers know is false.
    topic_code: "5.B"
  - front: "“We Wear the Mask” → “This debt we pay to human guile”"
    back: |
      "Debt" makes the mask an obligation, something owed and paid, not chosen freely; "guile" (cunning, deceit) places the dishonesty in the world that demands the performance.
    topic_code: "5.B"
  - front: "“We Wear the Mask” → “mouth with myriad subtleties”"
    back: |
      To "mouth" is to say words without meaning them. The speakers speak in endless, careful ways that conceal rather than reveal.
    topic_code: "5.B"
  - front: "“We Wear the Mask” → the turn to “O great Christ”"
    back: |
      Stanza 3 stops addressing the world and cries out to Christ. The suffering the mask hides from people is spoken only to God, so the poem shows both the mask and what is behind it.
    topic_code: "1.A"
  - front: "“We Wear the Mask” → “the clay is vile / Beneath our feet, and long the mile”"
    back: |
      The ground is foul and the road is long: the speakers' life is figured as a hard, endless walk, while the voice above keeps singing.
    topic_code: "5.B"
  - front: "“Richard Cory” → who tells the poem?"
    back: |
      "We people on the pavement": a townsperson speaking for the poor of the town. Everything we learn about Cory is what they saw and envied from the street.
    topic_code: "4.A"
  - front: "“Richard Cory” → the royal diction"
    back: |
      "sole to crown", "imperially", "richer than a king", "arrayed", "glittered". The watchers turn a rich neighbor into a monarch, which says as much about their longing as about him.
    topic_code: "5.B"
  - front: "“Richard Cory” → “he was always human when he talked”"
    back: |
      Praise that gives the speakers away: they expected someone so far above them to be less than human, that is, cold. They are grateful for ordinary courtesy.
    topic_code: "1.A"
  - front: "“Richard Cory” → “waited for the light, / And went without the meat, and cursed the bread”"
    back: |
      The townspeople's own lives: hard work, deprivation and a hope for better days. The line sets their hunger against Cory's apparent fullness just before the reversal.
    topic_code: "1.A"
  - front: "“Richard Cory” → why the last line hits so hard"
    back: |
      Fifteen lines of outside description, then one calm, plain line: he "Went home and put a bullet through his head." The watchers never knew his inner life, and neither do we; the poem's structure enacts their ignorance.
    topic_code: "1.A"
  - front: "“I'm nobody! Who are you?” → the speaker"
    back: |
      A playful, conspiratorial voice who chooses obscurity and invites the reader to share it: "Then there's a pair of us — don't tell!"
    topic_code: "1.A"
  - front: "“I'm nobody!” → the frog and the bog"
    back: |
      Being "somebody" is "public, like a frog" that tells its name "the livelong day / To an admiring bog!" Fame becomes croaking to a swamp; the audience that admires is mud.
    topic_code: "5.B"
  - front: "“I'm nobody!” → “They'd banish us, you know”"
    back: |
      "They" are the somebodies, the social world that would punish two nobodies for liking their obscurity. Being nobody is cast as a secret alliance.
    topic_code: "1.A"
  - front: "“Mother to Son” → the speaker"
    back: |
      A mother addressing her son in a Black vernacular voice ("I'se been a-climbin' on"). A persona, not Hughes; her speech reveals endurance, honesty and love.
    topic_code: "4.A"
  - front: "“Mother to Son” → “Life for me ain't been no crystal stair”"
    back: |
      The line that opens and closes her advice. A crystal stair is ease and glitter; she defines her life by what it was not, then lists the tacks, splinters and torn boards it was.
    topic_code: "5.B"
  - front: "“Mother to Son” → “Bare.”"
    back: |
      A one-word line after "places with no carpet on the floor". Its isolation on the page makes the bareness stark, and it is the only place the speech stops so short.
    topic_code: "5.B"
  - front: "“Mother to Son” → what “I'se still climbin'” reveals"
    back: |
      Present-tense persistence. She is not telling a story of finished success but of continuing effort, so her advice ("don't you turn back") is backed by her own example.
    topic_code: "1.A"
  - front: "Character in a poem → three sources of evidence"
    back: |
      What the speaker says about others, what the speaker's own words reveal (diction, tone, what they choose to praise or hide), and what the speaker does in the poem (asks, confesses, advises, turns away).
    topic_code: "1.A"
  - front: "Claim + evidence → the Unit 2 version of 7.A"
    back: |
      One arguable sentence about a poem (not a summary), then a short quotation that proves it, then a sentence of commentary explaining how the words prove it. Quote words, not whole stanzas.
    topic_code: "7.A"

quiz:
  description: |
    23 questions · about 35 minutes · opens with a set on Dunbar's "We Wear the Mask" and a set on Robinson's
    "Richard Cory", then items on Dickinson and Hughes. About two-thirds on this week's skills (character, 1.A; the
    function of words, 5.B) and a third reviewing Unit 1 (speaker and point of view, setting, sequence, claim and
    evidence). Multiple choice, select-all, true/false and fill-in-the-blank items are graded at once; the two short
    answers and the paragraph are graded by your teacher against the model answer.
  questions:
    # ---- Set A: "We Wear the Mask"
    - slug: u02-w04-q01
      type: multiple_choice
      topic_code: "4.A"
      source: 'Paul Laurence Dunbar, "We Wear the Mask" (1895)'
      points: 1
      stimulus: &mask |
        *The following poem by Paul Laurence Dunbar first appeared in* Majors and Minors *(1895) and was collected in* Lyrics of Lowly Life *(1896).*

        We wear the mask that grins and lies,
        It hides our cheeks and shades our eyes,—
        This debt we pay to human guile;
        With torn and bleeding hearts we smile,
        And mouth with myriad subtleties.     [5]

        Why should the world be over-wise,
        In counting all our tears and sighs?
        Nay, let them only see us, while
        We wear the mask.

        We smile, but, O great Christ, our cries     [10]
        To thee from tortured souls arise.
        We sing, but oh the clay is vile
        Beneath our feet, and long the mile;
        But let the world dream otherwise,
        We wear the mask!     [15]
      prompt: |
        The speaker of the poem is best described as
      options:
        - "a single person confessing a private deception to a close friend"
        - "a collective voice speaking for a group that hides its suffering from the world"
        - "an outside observer who exposes the dishonesty of people he has watched"
        - "a performer on stage addressing the audience that applauds him"
      option_explanations:
        - |
          The pronouns are plural throughout ("We wear", "our cheeks", "our cries"), and the only addressees are "the world" (spoken of) and Christ (spoken to). There is no single confessor and no friend.
        - |
          Correct. "We" speaks for a whole group that wears the mask together. The poem never names the group, which lets it stand for Black Americans in Dunbar's time and, more widely, for anyone made to hide pain.
        - |
          An outside observer would say "they wear the mask". These speakers include themselves in every act: "we smile", "we sing", "our tears and sighs".
        - |
          "We sing" and "grins" suggest performance, but there is no stage, audience or applause; the mask is worn in ordinary life before "the world", which is a much larger claim.
      answer: 1

    - slug: u02-w04-q02
      type: multiple_choice
      topic_code: "5.B"
      source: 'Paul Laurence Dunbar, "We Wear the Mask" (1895)'
      points: 1
      stimulus: *mask
      prompt: |
        In line 1, the verbs "grins and lies" primarily serve to
      options:
        - "show that the speakers enjoy deceiving the people around them"
        - "present the mask as an active, deceptive performance rather than a passive covering"
        - "suggest that the mask has a life of its own that the speakers cannot remove"
        - "contrast the speakers' honesty with the dishonesty of the world"
      option_explanations:
        - |
          Nothing in the poem suggests enjoyment; the speakers smile "With torn and bleeding hearts". The grin is a cost, not a pleasure.
        - |
          Correct. A mask normally just covers. Dunbar's mask does things: it grins (a forced, fixed smile) and it lies. The verbs establish at once that the concealment is an ongoing, deliberate act of deceit.
        - |
          Making the mask the subject of the verbs is suggestive, but the speakers say "We wear" it and choose to keep wearing it ("let the world dream otherwise"). The poem does not claim they cannot take it off.
        - |
          The mask itself "lies", so the speakers' public face is not honest. The poem places the guile in the world that demands the mask (line 3), but line 1 is about the mask's own falseness.
      answer: 1

    - slug: u02-w04-q03
      type: multiple_choice
      topic_code: "5.B"
      source: 'Paul Laurence Dunbar, "We Wear the Mask" (1895)'
      points: 1
      stimulus: *mask
      prompt: |
        In context, the word "debt" (line 3) suggests that the speakers regard wearing the mask as
      options:
        - "a payment they are obliged to make to a deceitful world"
        - "a loan they expect the world to repay with kindness"
        - "a moral failing they must atone for before God"
        - "a voluntary gift they offer out of generosity"
      option_explanations:
        - |
          Correct. A debt is owed and must be paid; it is not chosen. Paid "to human guile", it is a toll exacted by a world of cunning and deceit, which is why the speakers must answer that guile with a mask of their own.
        - |
          A loan expects repayment, but the poem nowhere imagines the world giving anything back; the world only sees the mask and "dream[s] otherwise".
        - |
          The cry to Christ in stanza 3 is a plea from "tortured souls", not a confession of sin. The debt is paid to "human guile", not to God.
        - |
          A gift is freely given. "Debt" stresses obligation, and the "torn and bleeding hearts" make clear the speakers pay at real cost.
      answer: 0

    - slug: u02-w04-q04
      type: multiple_choice
      topic_code: "1.A"
      source: 'Paul Laurence Dunbar, "We Wear the Mask" (1895)'
      points: 1
      stimulus: *mask
      prompt: |
        The question in lines 6-7 ("Why should the world be over-wise, / In counting all our tears and sighs?") best reveals the speakers' attitude toward the world as
      options:
        - "eager hope that the world will one day understand their suffering"
        - "bitter, self-protective refusal to let an unsympathetic world see their pain"
        - "indifference, since the world's opinion no longer matters to them"
        - "fear that the world already knows everything they are hiding"
      option_explanations:
        - |
          The next lines answer the question with "Nay, let them only see us, while / We wear the mask". The speakers actively choose not to be understood; there is no hope expressed here.
        - |
          Correct. The question is rhetorical. "Over-wise" is ironic: knowing their sorrow would be too much wisdom for a world that would only tally it ("counting"). The speakers protect themselves by keeping it hidden.
        - |
          Indifferent speakers would not keep up so costly a performance or plead with Christ. They care very much what the world sees, which is why they control it.
        - |
          "Let the world dream otherwise" implies the world does not know. The speakers are confident the mask works; their pain is that it must.
      answer: 1

    - slug: u02-w04-q05
      type: multi_select
      topic_code: "5.B"
      source: 'Paul Laurence Dunbar, "We Wear the Mask" (1895)'
      points: 2
      partial_credit: true
      stimulus: *mask
      prompt: |
        Which TWO phrases most directly convey the suffering that the mask conceals? Select all that apply.
      options:
        - "“torn and bleeding hearts” (line 4)"
        - "“myriad subtleties” (line 5)"
        - "“tortured souls” (line 11)"
        - "“over-wise” (line 6)"
      option_explanations:
        - |
          Selected. The hearts behind the smile are torn and bleeding: the line places the visible smile and the hidden wound in a single sentence.
        - |
          Not selected. "Myriad subtleties" describes the mask's performance, the countless careful ways the speakers speak; it names the disguise, not the pain beneath it.
        - |
          Selected. The cries rise "from tortured souls"; the suffering is spiritual as well as emotional, and it is voiced only to Christ.
        - |
          Not selected. "Over-wise" describes the world that would know too much; it concerns the observers, not the speakers' pain.
      answer: [0, 2]

    - slug: u02-w04-q06
      type: multiple_choice
      topic_code: "4.B"
      source: 'Paul Laurence Dunbar, "We Wear the Mask" (1895)'
      points: 1
      stimulus: *mask
      prompt: |
        The poem's use of the first-person plural ("we", "our") rather than the first-person singular primarily serves to
      options:
        - "hide the speaker's identity so that readers cannot trace the poem to Dunbar"
        - "present the mask as a shared condition of a whole community rather than one person's quirk"
        - "make the speakers sound more cheerful and confident than a single voice would"
        - "show that the speakers disagree among themselves about wearing the mask"
      option_explanations:
        - |
          The poem is published under Dunbar's name; point of view here shapes meaning, not authorship. Reading for the poet's concealment misses what "we" does inside the poem.
        - |
          Correct. "We" turns a personal disguise into a collective experience. Everyone in the group pays the same "debt", which is why the poem reads as social testimony, not private confession.
        - |
          The plural does not brighten the tone: "our cries", "tortured souls" and "the clay is vile" are all in the same voice.
        - |
          There is no disagreement; every verb is shared ("We smile", "We sing", "We wear"). The plural expresses unity in the performance.
      answer: 1

    - slug: u02-w04-q07
      type: true_false
      topic_code: "1.A"
      source: 'Paul Laurence Dunbar, "We Wear the Mask" (1895)'
      points: 1
      stimulus: *mask
      prompt: |
        True or false: in the third stanza the speakers reveal to Christ the pain they conceal from the world, so the poem itself shows what lies behind the mask.
      answer: true
      explanation: |
        True. Stanzas 1 and 2 speak about the world; stanza 3 turns to address Christ ("O great Christ, our cries / To thee from tortured souls arise"). The world sees only smiles and songs, but the reader overhears the cry, which makes the poem a moment of unmasking even as the speakers insist, "We wear the mask!"

    - slug: u02-w04-q08
      type: short_answer
      topic_code: "7.A"
      source: 'Paul Laurence Dunbar, "We Wear the Mask" (1895)'
      points: 3
      stimulus: *mask
      prompt: |
        Write a claim that requires defense about what the mask reveals about the speakers, and support it with one or two short quotations from the poem. (2-3 sentences.)
      answer: |
        The speakers wear the mask not because they are false but because the world is: the mask is "This debt we pay to human guile", a protective payment forced on them by a deceitful world. Behind it they remain fully feeling people, smiling "With torn and bleeding hearts" and crying to Christ "from tortured souls".
      explanation: |
        1 point: a claim that is arguable (an interpretation someone could dispute), not a summary such as "the speakers wear a mask".
        1 point: at least one accurate, relevant quotation, briefly and correctly embedded.
        1 point: a phrase of commentary linking the quotation to the claim (for example, explaining what "debt" or "guile" shows about why they wear it). Quotations alone, with no explanation, earn at most 2.

    # ---- Set B: "Richard Cory"
    - slug: u02-w04-q09
      type: multiple_choice
      topic_code: "4.A"
      source: 'Edwin Arlington Robinson, "Richard Cory" (1897)'
      points: 1
      stimulus: &cory |
        *The following poem by Edwin Arlington Robinson is from* The Children of the Night *(1897).*

        Whenever Richard Cory went down town,
        We people on the pavement looked at him:
        He was a gentleman from sole to crown,
        Clean favored, and imperially slim.

        And he was always quietly arrayed,     [5]
        And he was always human when he talked;
        But still he fluttered pulses when he said,
        "Good-morning," and he glittered when he walked.

        And he was rich,—yes, richer than a king,—
        And admirably schooled in every grace:     [10]
        In fine, we thought that he was everything
        To make us wish that we were in his place.

        So on we worked, and waited for the light,
        And went without the meat, and cursed the bread;
        And Richard Cory, one calm summer night,     [15]
        Went home and put a bullet through his head.
      prompt: |
        The speaker of the poem is best described as
      options:
        - "an all-knowing narrator who understands Richard Cory's private thoughts"
        - "one of the poor townspeople who admired Cory from a distance"
        - "a close friend of Cory's who grieves his death"
        - "Richard Cory himself, looking back on his life"
      option_explanations:
        - |
          The speaker never enters Cory's mind; every detail is something seen or heard on the street. That limitation is the point of the ending.
        - |
          Correct. "We people on the pavement looked at him" places the speaker among the watching townsfolk, who "went without the meat" and wished they "were in his place".
        - |
          A friend would know more than a greeting and a walk. The speaker reports only public appearances and admits envy, not intimacy.
        - |
          Cory is "he" throughout and the speaker is "we". The poem is told about him, from outside.
      answer: 1

    - slug: u02-w04-q10
      type: multiple_choice
      topic_code: "1.A"
      source: 'Edwin Arlington Robinson, "Richard Cory" (1897)'
      points: 1
      stimulus: *cory
      prompt: |
        The details in lines 1-12 reveal Richard Cory chiefly as he
      options:
        - "understood himself: a man secretly despairing of his wealth"
        - "appeared to others: polished, rich and enviable"
        - "behaved in private: generous to the poor of the town"
        - "was remembered after his death: a cautionary example"
      option_explanations:
        - |
          Nothing in lines 1-12 shows Cory's own view of himself; his despair is only inferred from the last line, and the poem never explains it.
        - |
          Correct. Every detail is external: his dress ("quietly arrayed"), manners ("always human when he talked"), wealth and education. They show what the watchers saw and admired, not what Cory felt.
        - |
          The poem never shows Cory giving anything; he says "Good-morning". Generosity is not in the text.
        - |
          Lines 1-12 are in the habitual past ("Whenever... went down town", "he was always"), describing how he seemed while alive. The poem withholds the death until the last line.
      answer: 1

    - slug: u02-w04-q11
      type: multiple_choice
      topic_code: "5.B"
      source: 'Edwin Arlington Robinson, "Richard Cory" (1897)'
      points: 1
      stimulus: *cory
      prompt: |
        The words "crown" (line 3), "imperially" (line 4) and "richer than a king" (line 9) primarily serve to
      options:
        - "suggest that Cory belongs to a royal family living in exile"
        - "show how the townspeople elevate Cory into a kind of monarch set above them"
        - "criticize Cory for arrogance toward the townspeople"
        - "foreshadow that Cory will be overthrown by the townspeople"
      option_explanations:
        - |
          The royal words are figurative: "from sole to crown" means head to foot, and "imperially slim" describes bearing. Nothing suggests literal royalty.
        - |
          Correct. The diction of kingship measures the distance the watchers feel between themselves and Cory, and their longing. It also sets up the irony: the man they crowned in their minds was suffering beyond their sight.
        - |
          The speakers admire him; he is "quietly arrayed" and "always human when he talked". The royal words are praise, not accusation.
        - |
          The townspeople do nothing to Cory; he takes his own life. There is no uprising to foreshadow.
      answer: 1

    - slug: u02-w04-q12
      type: multiple_choice
      topic_code: "3.B"
      source: 'Edwin Arlington Robinson, "Richard Cory" (1897)'
      points: 1
      stimulus: *cory
      prompt: |
        Placing Cory's suicide in the final line, after three stanzas of admiring description, primarily serves to
      options:
        - "reward the patient reader with a happy resolution"
        - "make the reader share the townspeople's shock at how little their envy had understood"
        - "explain in detail the reasons for Cory's despair"
        - "suggest that the townspeople caused his death through their envy"
      option_explanations:
        - |
          The ending is the opposite of happy; it overturns every expectation the earlier stanzas built.
        - |
          Correct. The sequence keeps us where the watchers were, outside and admiring, then delivers the death in one flat line. We learn what they learned, as suddenly, and realize the surface told us nothing.
        - |
          The poem gives no reasons at all. Its silence about why is central: neither the townspeople nor the reader ever knew the inner man.
        - |
          The poem sets their hardship beside his death but never blames them; they only watched and wished. The ending exposes their misjudgment, not their guilt.
      answer: 1

    - slug: u02-w04-q13
      type: fill_blank
      topic_code: "5.B"
      source: 'Edwin Arlington Robinson, "Richard Cory" (1897)'
      points: 1
      stimulus: *cory
      prompt: |
        Complete the line exactly: "In fine, we thought that he was everything / To make us wish that we were in his ____."
      answer: ["place"]
      explanation: |
        "To make us wish that we were in his place." The envy stated here is what the final line punishes: no one would wish to be in Cory's place once they know how his story ends.

    - slug: u02-w04-q14
      type: multiple_choice
      topic_code: "2.A"
      source: 'Edwin Arlington Robinson, "Richard Cory" (1897)'
      points: 1
      stimulus: *cory
      prompt: |
        Which detail most clearly conveys the economic conditions of the town the speakers live in?
      options:
        - "“Whenever Richard Cory went down town” (line 1)"
        - "“And went without the meat, and cursed the bread” (line 14)"
        - "“And he was always quietly arrayed” (line 5)"
        - "“one calm summer night” (line 15)"
      option_explanations:
        - |
          "Down town" establishes that there is a town center Cory visits, but says nothing about how anyone lives there.
        - |
          Correct. The townspeople do without meat and resent the plain bread they have; with "So on we worked, and waited for the light", the line sketches a place of labor and scarcity.
        - |
          This describes Cory's tasteful dress, not the town's conditions; if anything it marks his difference from them.
        - |
          "Calm summer night" sets the time and mood of the death, ironically peaceful, but conveys nothing economic.
