    - slug: u02-w04-q15
      type: multiple_choice
      topic_code: "1.A"
      source: 'Emily Dickinson, "I''m nobody! Who are you?" (1891)'
      points: 1
      prompt: |
        In Dickinson's poem, the speaker asks, "Are you nobody, too? / Then there's a pair of us — don't tell!" These lines reveal the speaker as
      options:
        - "lonely and ashamed of being unknown"
        - "delighted to find a fellow nobody and eager to keep their obscurity a shared secret"
        - "competitive, hoping to become more famous than the reader"
        - "suspicious that the reader is secretly somebody important"
      option_explanations:
        - |
          The exclamation marks and "don't tell!" are playful, not ashamed. The speaker chose to announce "I'm nobody!" and treats it as a happy identity.
        - |
          Correct. Finding "a pair of us" is a small joy, and "don't tell!" turns obscurity into a secret club that the speaker invites the reader to join.
        - |
          The second stanza mocks fame ("How dreary to be somebody!"). The speaker has no wish to compete for it.
        - |
          The speaker asks "Who are you?" out of curiosity and immediately assumes kinship ("Then there's a pair of us"); there is no suspicion.
