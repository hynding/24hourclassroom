    - slug: u02-w04-q22
      type: short_answer
      topic_code: "7.A"
      source: 'Emily Dickinson, "I''m nobody! Who are you?" (1891)'
      points: 3
      prompt: |
        Write a defensible claim about the speaker of Dickinson's "I'm nobody! Who are you?" and support it with evidence from the poem: one or two short quotations, with a sentence explaining how they support the claim.
      answer: |
        Dickinson's speaker is not lonely in her obscurity but proud of it, treating being nobody as a private freedom. She greets a fellow nobody with delight ("Then there's a pair of us — don't tell!") and mocks the famous, who are "public, like a frog" croaking "To an admiring bog!" The comic comparison shows she thinks fame is noisy and empty, while the secret shared between nobodies is worth protecting.
      explanation: |
        1 point: an arguable claim about the speaker (attitude, values, perspective), not "the speaker is a nobody".
        1 point: accurate quotation from the poem that is relevant to the claim.
        1 point: commentary explaining how the quoted words reveal the speaker (for example, what the frog and bog say about fame). Any defensible claim is acceptable, including that the speaker's cheerfulness hides a sense of exclusion ("They'd banish us"), if supported.

    - slug: u02-w04-q23
      type: long_answer
      topic_code: "1.A"
      source: 'Edwin Arlington Robinson, "Richard Cory" (1897)'
      points: 4
      stimulus: *cory
      prompt: |
        Write one analytical paragraph (about 150-200 words) that explains how Robinson uses the townspeople as speakers to shape the reader's understanding of Richard Cory. Begin with a claim, use at least two short quotations as evidence, and explain how each one supports the claim.
      answer: |
        Claim: by letting the envious townspeople tell the story, Robinson keeps the reader outside Cory, so his suicide exposes how little appearances reveal. Evidence and commentary: "We people on the pavement looked at him" places the speakers literally beneath him and limits them to looking; the royal diction ("from sole to crown", "imperially slim", "richer than a king") shows them turning a neighbor into a king, which reveals their longing more than his character. "We thought that he was everything / To make us wish that we were in his place" states the envy outright, and the stanza that sets their hardship ("went without the meat, and cursed the bread") beside "Went home and put a bullet through his head" shows the gap between what they saw and what he suffered. Because we see only what they saw, we share their shock and their error.
      explanation: |
        Claim (0-1): 1 point for a defensible claim about how the speakers' perspective shapes our view of Cory (not a summary of the plot).
        Evidence (0-1): 1 point for at least two accurate, relevant quotations from different parts of the poem.
        Commentary (0-2): 2 points for commentary that explains how each quotation supports the claim (for example, why "imperially" or "pavement" matters) and links the speakers' outside view to the ending; 1 point if the commentary is present but mostly restates or summarizes the quotations; 0 if quotations are simply listed.
        A paragraph that treats the speaker as an all-knowing narrator, or that invents reasons for the suicide, cannot earn the claim point.
