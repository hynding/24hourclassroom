  - slug: u02-exam-q42
    type: short_answer
    topic_code: "7.A"
    source: 'Christina Rossetti, "Up-Hill" (1861)'
    points: 3
    prompt: |
      Return to Rossetti's "Up-Hill" (Set A). Write a claim that requires defense about the poem's attitude toward death, and support it with two short quotations and a sentence of commentary.
    answer: |
      "Up-Hill" treats death not as something to fear but as the welcome rest at the end of a hard life. The respondent never denies the labor of the road, which winds "up-hill all the way", but meets each fear with certainty: "You cannot miss that inn", and there are "beds for all who come". By placing "Those who have gone before" at the inn, the poem makes death a reunion and a homecoming, so the hardship of the climb becomes the reason the rest is so welcome.
    explanation: |
      1 point: an arguable claim about the poem's attitude toward death (consolation, acceptance, quiet faith, or a defensible darker reading, for instance that the comfort is ambiguous).
      1 point: two accurate, relevant quotations.
      1 point: commentary explaining how the quotations support the claim; quotations that are merely listed earn at most 2.

  - slug: u02-exam-q43
    type: short_answer
