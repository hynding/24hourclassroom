unit: 2
description: |
  44 questions · about 75 minutes · every skill of Unit 2 (speaker and character, the function of words, structure,
  contrast, simile and metaphor, claim and evidence) in four passage sets: two unseen poems, Christina Rossetti's
  "Up-Hill" and Paul Laurence Dunbar's "Sympathy", as on the AP exam, and two studied poems, Shakespeare's Sonnet
  18 and Hughes's "Mother to Son". Then cross-poem items on the whole unit, two short answers and a poetry-analysis
  essay (Q1 style, 6 points) on an unseen sonnet. Multiple choice, select-all, true/false and fill-in-the-blank items
  are graded at once; the short answers and the essay are graded by your teacher against the model answer and the
  AP rubric.
questions:
  # ---- Set A (unseen): Christina Rossetti, "Up-Hill"
  - slug: u02-exam-q01
    type: multiple_choice
    topic_code: "4.A"
    source: 'Christina Rossetti, "Up-Hill" (1861)'
    points: 1
    stimulus: &uphill |
      *The following poem by Christina Rossetti was first published in 1861 and collected in* Goblin Market and Other Poems *(1862).*

      Does the road wind up-hill all the way?
      Yes, to the very end.
      Will the day's journey take the whole long day?
      From morn to night, my friend.

      But is there for the night a resting-place?     [5]
      A roof for when the slow dark hours begin.
      May not the darkness hide it from my face?
      You cannot miss that inn.

      Shall I meet other wayfarers at night?
      Those who have gone before.     [10]
      Then must I knock, or call when just in sight?
      They will not keep you standing at that door.

      Shall I find comfort, travel-sore and weak?
      Of labour you shall find the sum.
      Will there be beds for me and all who seek?     [15]
      Yea, beds for all who come.
    prompt: |
      The poem is best described as
    options:
      - "a monologue in which a traveler describes a journey she has completed"
      - "a dialogue in which one voice asks anxious questions and another answers with calm assurance"
      - "a conversation between two travelers who are equally uncertain of the way"
      - "a narrator's account of an innkeeper greeting guests"
    option_explanations:
      - |
        The poem is made of questions and replies, and the journey lies ahead ("Will the day's journey take...?"); no one describes a completed trip.
      - |
        Correct. The odd-numbered lines ask ("Does the road wind up-hill...?", "May not the darkness hide it...?") and the even-numbered lines answer ("Yes, to the very end", "You cannot miss that inn"). The questioner worries; the respondent knows.
      - |
        Only one voice is uncertain. The answers are short and sure ("Yes", "Yea"), and the respondent seems to know the road's end.
      - |
        There is no narrator and no scene at an inn; the inn is only spoken of, and the poem is entirely direct speech.
    answer: 1

  - slug: u02-exam-q02
    type: multiple_choice
    topic_code: "6.B"
    source: 'Christina Rossetti, "Up-Hill" (1861)'
    points: 1
    stimulus: *uphill
    prompt: |
      The road that winds "up-hill all the way" is best understood as a metaphor for
    options:
      - "a pilgrimage the speaker plans to make to a holy city"
      - "the whole course of a human life, laborious from beginning to end"
      - "a single difficult day the speaker must get through"
      - "the speaker's career as a writer"
    option_explanations:
      - |
        A pilgrimage is a related idea, but nothing names a holy city; the journey lasts "From morn to night", the span of a life.
      - |
        Correct. The road is uphill "to the very end", the "day's journey" takes "the whole long day... From morn to night", and at night comes rest: morning to night maps onto birth to death.
      - |
        A literal day is the vehicle; the "night", "inn" and "Those who have gone before" show that the tenor is a lifetime ending in death.
      - |
        Nothing in the poem concerns writing; the details (wayfarers, beds, travel-soreness) are universal, not professional.
    answer: 1

  - slug: u02-exam-q03
    type: multiple_choice
    topic_code: "6.B"
    source: 'Christina Rossetti, "Up-Hill" (1861)'
    points: 1
    stimulus: *uphill
    prompt: |
      Within the poem's extended metaphor, the "inn" (line 8) most likely represents
    options:
      - "a home the traveler left at the start of the road"
      - "the rest that comes at the end of life, in death or the life after it"
      - "a place of pleasure the traveler should avoid"
      - "the town at the top of the hill where the traveler will work"
    option_explanations:
      - |
        The inn lies at the end of the road, at "night", not at its beginning.
      - |
        Correct. The inn is the "resting-place" reached at night, where "Those who have gone before" already are and where there are "beds for all who come". Read with the poem's Christian context, it suggests the grave and the rest of the afterlife.
      - |
        The answers present the inn as welcome and inevitable ("You cannot miss that inn"); nothing warns against it.
      - |
        The traveler reaches the inn to rest from labor, "travel-sore and weak", not to begin work.
    answer: 1

  - slug: u02-exam-q04
    type: multiple_choice
    topic_code: "3.C"
    source: 'Christina Rossetti, "Up-Hill" (1861)'
    points: 1
    stimulus: *uphill
    prompt: |
      The alternation of question lines and answer lines throughout the poem primarily serves to
    options:
      - "create suspense about whether the traveler will reach the inn at all"
      - "set the questioner's mounting anxieties against a steady pattern of reassurance"
      - "show that the respondent avoids giving direct answers"
      - "reveal that the two speakers disagree about the journey"
    option_explanations:
      - |
        Each answer removes doubt as soon as it is raised ("You cannot miss that inn"), so the structure dispels suspense rather than building it.
      - |
        Correct. Each question voices a new fear (darkness, being alone, being kept waiting, exhaustion), and each is met at once by a brief, certain answer. The regular structure enacts the poem's consolation.
      - |
        The answers are direct: "Yes", "From morn to night", "Yea, beds for all who come". Their brevity is certainty, not evasion.
      - |
        The respondent does not dispute the questioner's sense of a hard road ("Yes, to the very end"); the voices differ in knowledge and calm, not opinion.
    answer: 1

  - slug: u02-exam-q05
    type: multiple_choice
    topic_code: "1.A"
    source: 'Christina Rossetti, "Up-Hill" (1861)'
    points: 1
    stimulus: *uphill
    prompt: |
      The respondent is best characterized as
    options:
      - "impatient with the traveler's questions"
      - "honest about the journey's difficulty yet steadily reassuring"
      - "falsely cheerful, hiding the dangers of the road"
      - "uncertain but trying to sound confident"
    option_explanations:
      - |
        The respondent answers every question and calls the traveler "my friend"; there is no impatience.
      - |
        Correct. The first answer admits the hardship ("Yes, to the very end"), and the respondent never denies that the road is long; but every later answer comforts: the inn cannot be missed, the door will open, there are beds for all.
      - |
        The respondent does not hide difficulty: the road is uphill to the end and takes the whole day, and the traveler will arrive "travel-sore".
      - |
        Nothing in the answers wavers; "You cannot miss that inn" and "Yea" are emphatic.
    answer: 1

  - slug: u02-exam-q06
    type: multiple_choice
    topic_code: "5.B"
    source: 'Christina Rossetti, "Up-Hill" (1861)'
    points: 1
    stimulus: *uphill
    prompt: |
      In context, the phrase "Those who have gone before" (line 10) primarily serves to
    options:
      - "refer gently to the dead, who have already reached the inn"
      - "identify a group of travelers walking ahead on the same road"
      - "warn the traveler that the inn may be full"
      - "describe the respondent's own family"
    option_explanations:
      - |
        Correct. "Gone before" is a traditional euphemism for the dead. The traveler will meet them at night, at the inn, which confirms that the journey's end is death and makes that end a reunion rather than a solitude.
      - |
        On the literal level they are earlier travelers, but the question asks for the phrase's function in context; "at night" and the inn make the euphemism clear.
      - |
        The reverse: the next answers promise "beds for all who come"; no one will be turned away.
      - |
        Nothing identifies them as the respondent's family; they are everyone who reached the end first.
    answer: 0

  - slug: u02-exam-q07
    type: multiple_choice
    topic_code: "3.D"
    source: 'Christina Rossetti, "Up-Hill" (1861)'
    points: 1
    stimulus: *uphill
    prompt: |
      Which pair of lines best illustrates the contrast between the questioner's fear and the respondent's assurance?
    options:
      - "“Does the road wind up-hill all the way?” / “Yes, to the very end.”"
      - "“May not the darkness hide it from my face?” / “You cannot miss that inn.”"
      - "“Will the day's journey take the whole long day?” / “From morn to night, my friend.”"
      - "“Shall I find comfort, travel-sore and weak?” / “Of labour you shall find the sum.”"
    option_explanations:
      - |
        Here the answer confirms the hardship rather than calming a fear; it is the poem's most sobering exchange.
      - |
        Correct. The traveler fears the darkness will hide the resting-place; the answer flatly removes the fear. The two lines oppose doubt and certainty most sharply.
      - |
        This answer also confirms the difficulty: the journey takes the whole day. It is honest rather than reassuring.
      - |
        The answer here is ambiguous (the "sum" of labor may be its total or its reward), so it is not the clearest example of a fear dispelled.
    answer: 1

  - slug: u02-exam-q08
    type: multi_select
    topic_code: "5.B"
    source: 'Christina Rossetti, "Up-Hill" (1861)'
    points: 2
    partial_credit: true
    stimulus: *uphill
    prompt: |
      Which TWO phrases emphasize the hardship of the journey rather than the rest at its end? Select all that apply.
    options:
      - "“up-hill all the way” (line 1)"
      - "“travel-sore and weak” (line 13)"
      - "“a resting-place” (line 5)"
      - "“beds for all who come” (line 16)"
    option_explanations:
      - |
        Selected. The whole road climbs; there is no level stretch, which makes life a continuous effort.
      - |
        Selected. The traveler expects to arrive aching and exhausted; the phrase names the cost of the journey.
      - |
        Not selected. The resting-place is the goal of the journey, its relief rather than its hardship.
      - |
        Not selected. The last line promises rest for everyone; it is the poem's final reassurance.
    answer: [0, 1]

  - slug: u02-exam-q09
    type: true_false
    topic_code: "3.D"
    source: 'Christina Rossetti, "Up-Hill" (1861)'
    points: 1
    stimulus: *uphill
    prompt: |
      True or false: the final line, "Yea, beds for all who come", answers the traveler's fear of being turned away by promising a rest that includes everyone.
    answer: true
    explanation: |
      True. The questions of stanzas 3 and 4 fear being kept "standing at that door" and finding no comfort; the final answer extends rest to "all who come", the traveler included. Ending on "come" also turns the inn into a welcome.

  # ---- Set B (studied): Shakespeare, Sonnet 18
  - slug: u02-exam-q10
    type: multiple_choice
    topic_code: "6.A"
    source: 'William Shakespeare, Sonnet 18 (1609)'
    points: 1
    stimulus: &s18 |
      *The following sonnet by William Shakespeare was first published in 1609. Punctuation follows the Project Gutenberg text.*

      Shall I compare thee to a summer's day?
      Thou art more lovely and more temperate:
      Rough winds do shake the darling buds of May,
      And summer's lease hath all too short a date:
      Sometime too hot the eye of heaven shines,     [5]
      And often is his gold complexion dimm'd,
      And every fair from fair sometime declines,
      By chance, or nature's changing course untrimm'd:
      But thy eternal summer shall not fade,
      Nor lose possession of that fair thou ow'st,     [10]
      Nor shall death brag thou wander'st in his shade,
      When in eternal lines to time thou grow'st,
      So long as men can breathe, or eyes can see,
      So long lives this, and this gives life to thee.
    prompt: |
      Lines 1-2 introduce the poem's central comparison chiefly by
    options:
      - "offering a simile and then immediately finding it inadequate to its subject"
      - "comparing the beloved to a season that the speaker dislikes"
      - "asking the beloved for permission to write a poem"
      - "establishing that the beloved and summer are exactly alike"
    option_explanations:
      - |
        Correct. The question proposes a comparison; the answer, "Thou art more lovely and more temperate", says the beloved exceeds it. The rest of the octave explains why summer falls short.
      - |
        The speaker does not dislike summer; "darling buds of May" and "gold complexion" are affectionate. Summer is lovely but unstable and brief.
      - |
        The question is rhetorical; the speaker immediately answers it himself.
      - |
        Line 2 establishes a difference ("more lovely and more temperate"), not an exact likeness.
    answer: 0

  - slug: u02-exam-q11
    type: multiple_choice
    topic_code: "6.B"
    source: 'William Shakespeare, Sonnet 18 (1609)'
    points: 1
    stimulus: *s18
    prompt: |
      In lines 5-6, the metaphor of the sun as "the eye of heaven" with a "gold complexion" that is "often... dimm'd" primarily serves to
    options:
      - "praise the sun as a perfect image of the beloved's beauty"
      - "show that even summer's most glorious feature is inconstant, too hot or clouded over"
      - "suggest that the beloved is losing his sight"
      - "describe a specific storm the speaker witnessed"
    option_explanations:
      - |
        The sun is presented with flaws ("too hot", "dimm'd"); it is part of the case that summer cannot match the "more temperate" beloved.
      - |
        Correct. Giving the sun an eye and a complexion makes it a face that can be too fierce or clouded; the metaphor supports the octave's argument that everything in nature changes and fades.
      - |
        The "eye" belongs to heaven, not the beloved; the beloved's eyes are not mentioned.
      - |
        The lines describe habitual change ("Sometime", "often"), not one event.
    answer: 1

  - slug: u02-exam-q12
    type: multiple_choice
    topic_code: "3.C"
    source: 'William Shakespeare, Sonnet 18 (1609)'
    points: 1
    stimulus: *s18
    prompt: |
      The word "But" at the start of line 9 marks a shift from
    options:
      - "praise of summer to criticism of the beloved"
      - "the ways nature's beauty decays to the claim that the beloved's beauty will not"
      - "the speaker's voice to the beloved's reply"
      - "a description of spring to a description of winter"
    option_explanations:
      - |
        The beloved is never criticized; the shift is in the opposite direction, toward the beloved's permanence.
      - |
        Correct. Lines 3-8 show how "every fair from fair sometime declines"; line 9 turns: "But thy eternal summer shall not fade". The volta sets mortal nature against the beloved preserved in verse.
      - |
        The speaker continues throughout; the beloved never speaks.
      - |
        No winter appears; the second half turns from nature to the poem's own power.
    answer: 1

  - slug: u02-exam-q13
    type: multiple_choice
    topic_code: "5.B"
    source: 'William Shakespeare, Sonnet 18 (1609)'
    points: 1
    stimulus: *s18
    prompt: |
      In line 7, "And every fair from fair sometime declines", the repeated word "fair" means first
    options:
      - "“a just decision” and then “a market”"
      - "“a beautiful thing” and then “beauty”, so the line says every beautiful thing in time loses its beauty"
      - "“light-colored” and then “honest”"
      - "“a festival” and then “good weather”"
    option_explanations:
      - |
        Neither meaning fits a line about nature's decline; "fair" here concerns beauty.
      - |
        Correct. The first "fair" is a noun for a beautiful person or thing; the second is the quality of beauty. The wordplay compresses the octave's argument: all beauty declines "By chance, or nature's changing course".
      - |
        "Fair" can mean light-colored or honest, but neither makes sense of "declines" in a passage about fading beauty.
      - |
        The festival and weather senses do not fit the grammar "every fair from fair... declines".
    answer: 1

  - slug: u02-exam-q14
    type: multiple_choice
    topic_code: "5.B"
    source: 'William Shakespeare, Sonnet 18 (1609)'
    points: 1
    stimulus: *s18
    prompt: |
      In line 11, "Nor shall death brag thou wander'st in his shade", the word "brag" primarily serves to
    options:
      - "present death as a boastful figure who will be denied his triumph over the beloved"
      - "suggest that the beloved is proud of having escaped danger"
      - "show that the speaker fears dying before the beloved"
      - "describe the beloved walking in the shade on a summer's day"
    option_explanations:
      - |
        Correct. Death is imagined as a boaster who likes to claim his victims. Because the beloved lives "in eternal lines", death will have nothing to brag about: the poem robs him of a trophy.
      - |
        The bragging belongs to death, not the beloved.
      - |
        The speaker's own death is not the subject; the line concerns the beloved's survival in verse.
      - |
        "His shade" is death's shadow, the realm of the dead, not shade from the sun.
    answer: 0

  - slug: u02-exam-q15
    type: fill_blank
    topic_code: "5.B"
    source: 'William Shakespeare, Sonnet 18 (1609)'
    points: 1
    stimulus: *s18
    prompt: |
      The couplet claims that the poem will last "So long as men can breathe, or eyes can see", because "this", the poem, "gives ____ to thee".
    answer: ["life"]
    explanation: |
      "So long lives this, and this gives life to thee." The poem's survival in the mouths and eyes of readers is the beloved's "eternal summer".

  - slug: u02-exam-q16
    type: multi_select
    topic_code: "6.B"
    source: 'William Shakespeare, Sonnet 18 (1609)'
    points: 2
    partial_credit: true
    stimulus: *s18
    prompt: |
      Which TWO lines give reasons why a summer's day is an inadequate comparison for the beloved? Select all that apply.
    options:
      - "“Rough winds do shake the darling buds of May” (line 3)"
      - "“Sometime too hot the eye of heaven shines” (line 5)"
      - "“But thy eternal summer shall not fade” (line 9)"
      - "“So long lives this, and this gives life to thee” (line 14)"
    option_explanations:
      - |
        Selected. Summer's beauty is roughly treated by its own winds: it is not "temperate".
      - |
        Selected. The sun is sometimes too hot: summer goes to extremes, unlike the "more temperate" beloved.
      - |
        Not selected. This line is about the beloved's lasting "summer" after the turn; it gives the alternative, not a fault of the real summer.
      - |
        Not selected. The final line explains how the beloved will endure (through the poem); it does not list summer's flaws.
    answer: [0, 1]

  # ---- Set C (unseen): Paul Laurence Dunbar, "Sympathy"
  - slug: u02-exam-q17
    type: multiple_choice
    topic_code: "4.A"
    source: 'Paul Laurence Dunbar, "Sympathy" (1899)'
    points: 1
    stimulus: &sympathy |
      *The following poem by Paul Laurence Dunbar is from* Lyrics of the Hearthside *(1899).*

      I know what the caged bird feels, alas!
      When the sun is bright on the upland slopes;
      When the wind stirs soft through the springing grass,
      And the river flows like a stream of glass;
      When the first bird sings and the first bud opes,     [5]
      And the faint perfume from its chalice steals—
      I know what the caged bird feels!

      I know why the caged bird beats his wing
      Till its blood is red on the cruel bars;
      For he must fly back to his perch and cling     [10]
      When he fain would be on the bough a-swing;
      And a pain still throbs in the old, old scars
      And they pulse again with a keener sting—
      I know why he beats his wing!

      I know why the caged bird sings, ah me,     [15]
      When his wing is bruised and his bosom sore,—
      When he beats his bars and he would be free;
      It is not a carol of joy or glee,
      But a prayer that he sends from his heart's deep core,
      But a plea, that upward to Heaven he flings—     [20]
      I know why the caged bird sings!
    prompt: |
      The speaker's repeated claim "I know" most strongly implies that the speaker
    options:
      - "has studied birds closely as a naturalist"
      - "shares the caged bird's condition and so understands it from experience"
      - "is the owner of the caged bird and feels guilty"
      - "is guessing at feelings he cannot really know"
    option_explanations:
      - |
        A naturalist would describe behavior, not claim to know the bird's feelings, pain and prayers. The knowledge claimed is inward.
      - |
        Correct. The title "Sympathy" means feeling with another. The speaker knows "what the caged bird feels" and "why" it beats its wing and sings because his own life is caged; the bird is his mirror.
      - |
        Nothing makes the speaker the bird's keeper; he identifies with the bird, not with its captor.
      - |
        "I know" is insistent and repeated in every stanza; the poem presents certainty born of experience, not guesswork.
    answer: 1

  - slug: u02-exam-q18
    type: multiple_choice
    topic_code: "6.B"
    source: 'Paul Laurence Dunbar, "Sympathy" (1899)'
    points: 1
    stimulus: *sympathy
    prompt: |
      The caged bird functions throughout the poem chiefly as
    options:
      - "an extended metaphor for a person or people denied freedom, whose suffering the speaker shares"
      - "a literal pet whose care the speaker describes"
      - "a symbol of the joy of springtime"
      - "a simile for the speaker's beloved"
    option_explanations:
      - |
        Correct. The bird is developed across all three stanzas: it longs for the free world, wounds itself on the bars, and sings a prayer. Each stage figures the experience of a person held captive, which is why the speaker "knows" it. Readers often connect it to Black Americans' experience in Dunbar's time.
      - |
        No feeding, cage-cleaning or owner appears; the bird's inner life ("a prayer... from his heart's deep core") marks it as figurative.
      - |
        Springtime belongs to the world outside the cage; the bird stands for exclusion from that joy.
      - |
        There is no "like" or "as" linking the bird to a beloved, and the poem is not a love poem.
    answer: 0

  - slug: u02-exam-q19
    type: multiple_choice
    topic_code: "3.D"
    source: 'Paul Laurence Dunbar, "Sympathy" (1899)'
    points: 1
    stimulus: *sympathy
    prompt: |
      The images of spring in lines 2-6 ("the upland slopes", "the springing grass", "the first bud") primarily serve to
    options:
      - "show that the bird is content because it can see the countryside"
      - "set the beauty and freedom of the world outside against the bird's captivity, deepening its pain"
      - "establish that the poem takes place in the speaker's garden"
      - "suggest that the cage will soon be opened"
    option_explanations:
      - |
        The stanza ends "alas!" and "I know what the caged bird feels"; seeing the free world is part of the suffering, not a consolation.
      - |
        Correct. Bright sun, soft wind, new grass and a singing "first bird" outside sharpen the contrast with the bars; every "When" names a freedom the caged bird cannot have.
      - |
        The landscape is general and idealized ("upland slopes"), not a specific garden; its function is contrast, not setting.
      - |
        Nothing promises release; stanza 2 shows the bird forced back "to his perch".
    answer: 1

  - slug: u02-exam-q20
    type: multiple_choice
    topic_code: "6.A"
    source: 'Paul Laurence Dunbar, "Sympathy" (1899)'
    points: 1
    stimulus: *sympathy
    prompt: |
      The simile in line 4, "the river flows like a stream of glass", contributes chiefly to the poem's
    options:
      - "picture of an outside world that is clear, smooth and freely moving"
      - "warning that the river is cold and dangerous"
      - "suggestion that the cage is made of glass"
      - "description of the bird's tears"
    option_explanations:
      - |
        Correct. Glass suggests clarity and smoothness; the flowing river moves without obstruction. The simile adds one more image of ease and freedom to the list the bird is shut out from.
      - |
        The stanza's details are all pleasant (bright sun, soft wind, perfume); danger is not carried over.
      - |
        The cage has "cruel bars"; the glass belongs to the river outside, not the bird's prison.
      - |
        Tears are not mentioned; the simile describes the river in the spring landscape.
    answer: 0

  - slug: u02-exam-q21
    type: multiple_choice
    topic_code: "5.B"
    source: 'Paul Laurence Dunbar, "Sympathy" (1899)'
    points: 1
    stimulus: *sympathy
    prompt: |
      In line 12, the repetition in "the old, old scars" primarily serves to
    options:
      - "suggest that the bird's injuries have fully healed"
      - "stress how long the suffering has lasted, so that each new struggle reopens a long history of pain"
      - "show that the bird is too old to fly"
      - "make the line sound cheerful and musical"
    option_explanations:
      - |
        The scars "pulse again with a keener sting"; they have not healed.
      - |
        Correct. Doubling "old" makes the wounds ancient, and the next line makes them hurt again, more sharply. The captivity is not new; each beat of the wing renews an old injury.
      - |
        "Old" modifies the scars, not the bird; the bird still beats its wing "Till its blood is red".
      - |
        The surrounding words ("pain", "throbs", "sting") make the effect painful, not cheerful.
    answer: 1

  - slug: u02-exam-q22
    type: multiple_choice
    topic_code: "3.C"
    source: 'Paul Laurence Dunbar, "Sympathy" (1899)'
    points: 1
    stimulus: *sympathy
    prompt: |
      Each stanza ends with a variation of "I know what the caged bird feels" ("I know why he beats his wing!", "I know why the caged bird sings!"). The progression of these refrains primarily
    options:
      - "moves from the bird's inward feeling, to its physical struggle, to its song, which the poem redefines as prayer"
      - "shows the speaker gradually losing interest in the bird"
      - "reveals that the bird escapes in the final stanza"
      - "repeats exactly the same idea three times for emphasis"
    option_explanations:
      - |
        Correct. Feels, beats his wing, sings: the refrains trace a sequence from emotion to resistance to expression. The last stanza explains the song as "a prayer" and "a plea", so the structure builds to the poem's most surprising claim.
      - |
        The refrains become more emphatic (the last is an exclamation), and the final stanza is the poem's climax.
      - |
        In the last stanza the bird still "beats his bars and he would be free"; it has not escaped.
      - |
