    source: 'Paul Laurence Dunbar, "Sympathy" (1899) and "We Wear the Mask" (1895)'
    points: 3
    prompt: |
      Dunbar's "Sympathy" (Set C) and "We Wear the Mask" both present a song or smile that outsiders misread. In two or three sentences, explain how the caged bird's song in "Sympathy" works as a metaphor, and how it resembles or differs from the mask.
    answer: |
      In "Sympathy" the bird's song sounds like joy but is "a prayer" and "a plea" for freedom, so the metaphor turns apparent happiness into a cry from captivity. Like the mask that "grins and lies", it is a performance outsiders take at face value; but where the masked speakers hide their pain deliberately ("let the world dream otherwise"), the bird's song is an honest prayer that only the sympathetic speaker understands.
    explanation: |
      1 point: explains the metaphor's function in "Sympathy" (song as prayer or plea, not joy).
      1 point: identifies a valid resemblance to the mask (a public sound or face misread by outsiders).
      1 point: identifies a valid difference (deliberate concealment versus an honest cry; a collective "we" versus a sympathizing "I"; address to the world versus to Heaven), supported by a quotation or close reference.

  - slug: u02-exam-q44
    type: long_answer
    topic_code: "3.D"
    source: 'Christina Rossetti, "Remember" (1862)'
    points: 6
    stimulus: |
      *The following sonnet by Christina Rossetti is from* Goblin Market and Other Poems *(1862).*

      Remember me when I am gone away,
      Gone far away into the silent land;
      When you can no more hold me by the hand,
      Nor I half turn to go yet turning stay.
      Remember me when no more day by day     [5]
      You tell me of our future that you planned:
      Only remember me; you understand
      It will be late to counsel then or pray.
      Yet if you should forget me for a while
      And afterwards remember, do not grieve:     [10]
      For if the darkness and corruption leave
      A vestige of the thoughts that once I had,
      Better by far you should forget and smile
      Than that you should remember and be sad.
    prompt: |
      Read carefully the poem above, Christina Rossetti's "Remember" (1862), in which the speaker addresses the person she loves. In a well-written essay, analyze how Rossetti uses literary elements and techniques to convey the speaker's complex attitude toward being remembered after her death.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: Rossetti's speaker first pleads to be remembered, then, at the sonnet's turn, releases her beloved from that duty, showing that her love is strong enough to prefer his happiness to her own memory.
      Line of reasoning and evidence: (1) The octave's repeated command "Remember me" (lines 1, 5, 7) makes memory her urgent request; euphemisms for death ("gone away", "the silent land") and the tender image of "half turn[ing] to go yet turning stay" show how hard parting is. (2) The octave also admits limits: the planned "future" will end and "It will be late to counsel then or pray", so remembering is all that will remain. (3) The volta at line 9, "Yet", reverses the request: "if you should forget me for a while... do not grieve". (4) The final contrast, "Better by far you should forget and smile / Than that you should remember and be sad", sets smile against sadness and forgetting against remembering, and chooses his happiness.
      Complexity: the structure enacts a change of heart within one poem; the plea and the release are both acts of love, and "darkness and corruption" admits the physical reality of death that makes her generosity the more striking.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis that addresses the speaker's complex (changing or divided) attitude toward being remembered. A thesis that says only "the speaker wants to be remembered" ignores the sestet and is not sufficient for the complexity the prompt asks about, though it can earn the point if defensible and specific.
      Row B Evidence and Commentary (0-4):
      4 = specific evidence from both the octave and the sestet (the repeated "Remember me", the euphemisms for death, the volta at "Yet", the final smile/sad contrast), consistently explained in relation to a line of reasoning about the shift in attitude.
      3 = specific, relevant evidence with explanation of how at least some of it supports the reasoning; the turn may be noted but not fully explained.
      2 = relevant evidence, but commentary mostly paraphrases the poem.
      1 = general evidence or restatement of the thesis.
      0 = no relevant evidence.
      Row C Sophistication (0-1): 1 point for a complex understanding, for example explaining how the Petrarchan octave/sestet structure enacts the change of heart, how the closing two lines reverse "remember" into "forget" as an act of love, or how "darkness and corruption" complicates the poem's tenderness.
