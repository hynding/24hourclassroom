guide: guides/week-05.md
guide_description: |
  How a poem's shape makes meaning: stanzas as moves in an argument, repetition, question and answer, the
  Shakespearean sonnet's three quatrains and couplet, and contrast as a way of thinking. Worked readings of Blake's
  paired "The Lamb" and "The Tyger", "London", Frost's "Nothing Gold Can Stay" and Sonnet 73, with a model
  paragraph on structure and a self-check.
flashcards_description: |
  30 cards on structural devices and contrasts in Blake's songs, Frost's eight lines and Shakespeare's Sonnet 73.

flashcards:
  - front: "Structure (3.C) → what the exam means by it"
    back: |
      The arrangement of a poem's parts: lines, stanzas, repetition, rhyme, the order of images and ideas, and where the poem turns. "Explain the function of structure" means: why are the parts in this order and shape, and what does that arrangement do to meaning?
    topic_code: "3.C"
  - front: "Contrast (3.D) → what the exam means by it"
    back: |
      Any opposition the text sets up: two images, two speakers, two tones, before and after, appearance and reality. "Explain the function of a contrast" means: what does setting these against each other reveal that either alone would not?
    topic_code: "3.D"
  - front: "Shift → three signals in a poem"
    back: |
      A change in speaker, addressee, tone, tense or subject. Watch for "but", "yet", "so", "then", a question answered, a new stanza. Ask what changes and why the poem needs the change there.
    topic_code: "3.C"
  - front: "Songs of Innocence and of Experience → the pairing"
    back: |
      Blake published Songs of Innocence in 1789 and added Songs of Experience in 1794, subtitled "Shewing the Two Contrary States of the Human Soul". Several poems are paired across the two books, so each answers the other.
    topic_code: "3.D"
  - front: "“The Lamb” → its two-stanza structure"
    back: |
      Stanza 1 asks "Little Lamb who made thee" and lists the gifts the Lamb received; stanza 2 answers: "He is called by thy name, / For he calls himself a Lamb". Question, then confident answer: the shape of innocence.
    topic_code: "3.C"
  - front: "“The Lamb” → who speaks?"
    back: |
      A child ("I a child & thou a lamb"), who teaches the lamb what he has learned: that the creator became a child and is called a Lamb. Child, lamb and Christ are joined in one name.
    topic_code: "4.A"
  - front: "“The Tyger” → its structure of questions"
    back: |
      Six quatrains made almost entirely of questions that are never answered. The questions tighten into fragments ("What the hammer? what the chain"), building wonder and dread instead of the Lamb's certainty.
    topic_code: "3.C"
  - front: "“The Tyger” → “Could frame” vs “Dare frame”"
    back: |
      Stanza 1 asks what hand "Could frame thy fearful symmetry"; the repeated last stanza asks what hand "Dare frame" it. The one-word change moves the question from ability to audacity: the poem has grown more awed.
    topic_code: "3.C"
  - front: "“The Tyger” → “Did he who made the Lamb make thee?”"
    back: |
      The line that links the paired poems and states their contrast as a question: can gentleness and ferocity come from the same creator? The speaker does not answer.
    topic_code: "3.D"
  - front: "“The Tyger” → the forge imagery"
    back: |
      "hammer", "chain", "furnace", "anvil": the creator is imagined as a blacksmith forging the tiger. The industrial, fiery imagery contrasts with the Lamb's "stream", "mead" and "clothing of delight".
    topic_code: "5.B"
  - front: "“The Tyger” → “fearful symmetry”"
    back: |
      Symmetry is order and beauty; fearful is terror. The phrase holds the poem's double response to the tiger in two words: it is magnificent and frightening at once.
    topic_code: "5.B"
  - front: "“London” → “charter'd street” and “charter'd Thames”"
    back: |
      A charter grants rights or ownership. Repeated for both street and river, the word suggests that everything, even nature, is owned, mapped and controlled for commerce.
    topic_code: "5.B"
  - front: "“London” → “mark... Marks”"
    back: |
      The speaker "mark[s]" (notices) "Marks of weakness, marks of woe" in every face. The same word for observing and for the scars observed: seeing suffering everywhere is part of the speaker's experience.
    topic_code: "5.B"
  - front: "“London” → anaphora in stanza 2"
    back: |
      "In every cry of every Man, / In every Infants cry of fear, / In every voice: in every ban". The repeated "every" makes the suffering universal, building to "The mind-forg'd manacles I hear".
    topic_code: "3.C"
  - front: "“London” → “mind-forg'd manacles”"
    back: |
      Chains made by the mind: the restrictions people accept or impose in thought (fear, law, custom). Blake places the prison inside people as well as in institutions.
    topic_code: "5.B"
  - front: "“London” → Chimney-sweeper and Church, Soldier and Palace"
    back: |
      Stanza 3 pairs each victim with an institution: the sweep's cry "appalls" the blackening Church; the soldier's sigh "Runs in blood down Palace walls". The contrasts implicate Church and state in the suffering.
    topic_code: "3.D"
  - front: "“London” → “the Marriage hearse”"
    back: |
      An oxymoron: marriage (beginning, celebration) and hearse (death). The poem's last line fuses them to show the plague carried by the "youthful Harlots" infecting even marriage and birth.
    topic_code: "3.D"
  - front: "“London” → why the last stanza begins “But most”"
    back: |
      It marks a climax: of all the sounds, the speaker hears this one "most". Blake saves the most disturbing image, the curse that blights infants and marriage, for the end.
    topic_code: "3.C"
  - front: "“Nothing Gold Can Stay” → its shape"
    back: |
      Eight short lines in rhymed couplets, each line about three beats. The poem moves from nature (leaf, flower) to myth (Eden) to a day (dawn) to a general law ("Nothing gold can stay"). Each step widens the claim.
    topic_code: "3.C"
  - front: "“Nothing Gold Can Stay” → “Nature's first green is gold”"
    back: |
      A paradox: the first green of spring buds is gold-colored. The opening contrast sets up the poem's sense that the most precious stage is the earliest and shortest.
    topic_code: "3.D"
  - front: "“Nothing Gold Can Stay” → “Then leaf subsides to leaf”"
    back: |
      "Subsides" means sinks or settles: the golden flower-like leaf becomes an ordinary leaf. The word makes growth sound like loss.
    topic_code: "5.B"
  - front: "“Nothing Gold Can Stay” → “So Eden sank to grief, / So dawn goes down to day”"
    back: |
      The repeated "So" turns a leaf's change into a pattern: the fall from Eden and the fading of dawn into ordinary day follow the same law. Even day, normally the bright time, is a "going down" from dawn.
    topic_code: "3.C"
  - front: "Sonnet 73 → the Shakespearean form"
    back: |
      Fourteen lines of iambic pentameter: three quatrains (ABAB CDCD EFEF) and a couplet (GG). Each quatrain develops one image; the couplet turns to the listener.
    topic_code: "3.C"
  - front: "Sonnet 73 → the three images in order"
    back: |
      Quatrain 1: late autumn ("yellow leaves, or none, or few"). Quatrain 2: twilight. Quatrain 3: a dying fire. A year, a day, a few hours: the time left shrinks with each image.
    topic_code: "3.C"
  - front: "Sonnet 73 → “Bare ruin'd choirs, where late the sweet birds sang”"
    back: |
      Bare branches are compared to the ruined choir stalls of a church where singers once sang. The image joins the speaker's aging body to a loss of music, beauty and holiness.
    topic_code: "5.B"
  - front: "Sonnet 73 → “Death's second self”"
    back: |
      Night, which "seals up all in rest", is death's double: sleep looks like death. The speaker sees his own ending in the close of each day.
    topic_code: "5.B"
  - front: "Sonnet 73 → “Consum'd with that which it was nourish'd by”"
    back: |
      A paradox: the fire is choked by the ashes of the wood that once fed it. Life's own past (youth spent) becomes what smothers it.
    topic_code: "3.D"
  - front: "Sonnet 73 → the couplet's turn"
    back: |
      "This thou perceiv'st, which makes thy love more strong, / To love that well, which thou must leave ere long." After twelve lines on the speaker's decline, the couplet turns to the listener: knowing the speaker will soon be gone strengthens love.
    topic_code: "3.D"
  - front: "Rhymed couplet → effect at the end of a poem"
    back: |
      Two rhyming lines close the sound and often the argument: they sum up, resolve or twist. Ask whether the couplet answers the quatrains or complicates them.
    topic_code: "3.C"
  - front: "Paired poems → how to write about a contrast"
    back: |
      Don't list differences. State what the contrast reveals: "By answering the Lamb's certain question-and-answer with the Tyger's unanswered questions, Blake shows that experience cannot rest in innocence's easy faith."
    topic_code: "7.A"

quiz:
  description: |
    23 questions · about 35 minutes · opens with a set on Blake's "London" and a set on Shakespeare's Sonnet 73, then
    items on "The Lamb", "The Tyger" and "Nothing Gold Can Stay", and an essay on Frost's poem. About 70% on this
    week's skills (structure, 3.C; contrasts, 3.D) and 30% review (speaker, character, word function, claim and
    evidence). Multiple choice, select-all, true/false and fill-in-the-blank items are graded at once; the short
    answers and the essay are graded by your teacher against the model answer and rubric.
  questions:
    # ---- Set A: "London"
    - slug: u02-w05-q01
      type: multiple_choice
      topic_code: "4.A"
      source: 'William Blake, "London" (1794)'
      points: 1
      stimulus: &london |
        *The following poem is from William Blake's* Songs of Experience *(1794). Blake's spelling and punctuation are kept.*

        I wander thro' each charter'd street,
        Near where the charter'd Thames does flow.
        And mark in every face I meet
        Marks of weakness, marks of woe.

        In every cry of every Man,     [5]
        In every Infants cry of fear,
        In every voice: in every ban,
        The mind-forg'd manacles I hear

        How the Chimney-sweepers cry
        Every blackning Church appalls,     [10]
        And the hapless Soldiers sigh
        Runs in blood down Palace walls

        But most thro' midnight streets I hear
        How the youthful Harlots curse
        Blasts the new-born Infants tear     [15]
        And blights with plagues the Marriage hearse
      prompt: |
        The speaker of the poem is best described as
      options:
        - "a city official inspecting the streets for signs of disorder"
        - "a wandering observer who sees and hears suffering everywhere in the city"
        - "a chimney-sweeper describing his own hard life"
        - "a visitor from the country admiring the city's grandeur"
      option_explanations:
        - |
          Nothing marks the speaker as official; he "wander[s]", which suggests no fixed purpose or authority, and he hears the suffering as a sympathetic witness, not an inspector.
        - |
          Correct. "I wander" and "mark in every face I meet" make him a walker who notices; from stanza 2 on, "I hear" makes him a listener too. Everything in the poem comes through his perception.
        - |
          The chimney-sweeper's cry is one of the sounds the speaker hears (line 9); the speaker is not the sweep.
        - |
          The poem finds "weakness" and "woe" in every face and blood on palace walls; there is no admiration of grandeur.
      answer: 1

    - slug: u02-w05-q02
      type: multiple_choice
      topic_code: "5.B"
      source: 'William Blake, "London" (1794)'
      points: 1
      stimulus: *london
      prompt: |
        The repetition of "charter'd" in lines 1-2 primarily serves to suggest that
      options:
        - "London is a historic city with ancient royal privileges to be proud of"
        - "even the streets and the river are owned and controlled, leaving nothing free"
        - "the speaker has carefully mapped every street of the city"
        - "the Thames is the only natural feature that escapes the city's control"
      option_explanations:
        - |
          A charter can grant privileges, but the poem's tone is grim ("weakness", "woe"); the word implies restriction, not civic pride.
        - |
          Correct. Applying "charter'd" to a street and then to a river, which should flow freely, implies that commerce and law have parcelled out everything, setting up the "manacles" of stanza 2.
        - |
          The speaker "wander[s]", the opposite of mapping. The charters belong to the city's owners, not to him.
        - |
          The Thames is "charter'd" too; the repetition specifically denies that nature escapes.
      answer: 1

    - slug: u02-w05-q03
      type: multiple_choice
      topic_code: "3.C"
      source: 'William Blake, "London" (1794)'
      points: 1
      stimulus: *london
      prompt: |
        The repeated phrase "In every" in lines 5-7 contributes to the poem's structure chiefly by
      options:
        - "listing a series of separate cases that the speaker will treat one by one in later stanzas"
        - "building, item by item, to the claim that the manacles are heard in every human sound"
        - "slowing the poem to show that the speaker is uncertain about what he hears"
        - "introducing a contrast between the men and the infants of London"
      option_explanations:
        - |
          The stanza does not set up a list to be unpacked; its accumulation leads straight to one conclusion in line 8.
        - |
          Correct. Five "every"s in three lines pile up men, infants, voices and bans, and the stanza's sentence resolves only in line 8: "The mind-forg'd manacles I hear". The structure makes the bondage universal.
        - |
          The insistent repetition sounds certain and relentless, not hesitant.
        - |
          Men and infants are included together in the same "every"; the point is likeness (all suffer), not contrast.
      answer: 1

    - slug: u02-w05-q04
      type: multiple_choice
      topic_code: "3.D"
      source: 'William Blake, "London" (1794)'
      points: 1
      stimulus: *london
      prompt: |
        In lines 9-12, the pairing of the "Chimney-sweepers cry" with the "Church" and the "Soldiers sigh" with "Palace walls" primarily serves to
      options:
        - "contrast the poverty of the workers with the comfort of the city's institutions, implicating those institutions in the suffering"
        - "show that the Church and Palace are working to relieve the suffering of the poor"
        - "suggest that the sweeps and soldiers are responsible for the decay of the Church and Palace"
        - "describe the architecture of London's most famous buildings"
      option_explanations:
        - |
          Correct. Each pair sets a victim against a powerful institution. The church is "blackning" (with soot from the sweeps' work) and "appalls" (dismays, and literally pales); the soldier's sigh "Runs in blood down Palace walls", as if the state were stained by the lives it spends.
        - |
          Nothing shows relief. The cry "appalls" the Church and the blood runs on the Palace; the institutions are confronted, not helpful.
        - |
          The sweeps' soot and the soldiers' blood mark the buildings, but the poem's sympathy is with the "hapless" soldier and crying sweep; they are victims, not culprits.
        - |
          The buildings are not described as architecture; they stand for Church and state, the powers the poem accuses.
      answer: 0

    - slug: u02-w05-q05
      type: multiple_choice
      topic_code: "3.C"
      source: 'William Blake, "London" (1794)'
      points: 1
      stimulus: *london
      prompt: |
        The final stanza, which begins "But most", functions in the structure of the poem as
      options:
        - "a reversal in which the speaker finds hope in the city at night"
        - "a climax that presents the most disturbing sound the speaker hears"
        - "a digression from the poem's main subject"
        - "a return to the visual images of the first stanza"
      option_explanations:
        - |
          The stanza contains a curse, blasted tears and plague; there is no hope in it.
        - |
          Correct. "Most" ranks it: of everything he hears, this is the worst. The poem saves for last the curse that harms infants and turns marriage into a hearse, so the corruption reaches the beginnings of life itself.
        - |
          The stanza intensifies the poem's subject, the suffering of the city, rather than leaving it.
        - |
          The speaker still "hear[s]" in the last stanza; the poem stays with sounds, as it has since stanza 2.
      answer: 1

    - slug: u02-w05-q06
      type: multi_select
      topic_code: "3.D"
      source: 'William Blake, "London" (1794)'
      points: 2
      partial_credit: true
      stimulus: *london
      prompt: |
        Which TWO phrases join opposites, such as life and death or joy and grief, in a single image? Select all that apply.
      options:
        - "“the Marriage hearse” (line 16)"
        - "“the new-born Infants tear” (line 15)"
        - "“mind-forg'd manacles” (line 8)"
        - "“midnight streets” (line 13)"
      option_explanations:
        - |
          Selected. An oxymoron: marriage, a beginning and celebration, is fused with a hearse, a vehicle for the dead.
        - |
          Selected. A new life arrives already in tears that are "blasted"; birth is joined to grief and harm at its first moment.
        - |
          Not selected. Chains forged by the mind are a metaphor joining mind and metal, but they are not opposites: the phrase describes one kind of bondage.
        - |
          Not selected. "Midnight streets" sets the time and place; nothing in the phrase is opposed.
      answer: [0, 1]

    - slug: u02-w05-q07
      type: true_false
      topic_code: "1.A"
      source: 'William Blake, "London" (1794)'
      points: 1
      stimulus: *london
      prompt: |
        True or false: the speaker of "London" blames the suffering he witnesses chiefly on the personal weakness of the individuals he meets.
      answer: false
      explanation: |
        False. The speaker notices "Marks of weakness", but his details point to systems: the "charter'd" streets, the "mind-forg'd manacles" that every voice carries, and the Church and Palace stained by the sweep's cry and the soldier's blood. His perspective is that of a sympathetic witness who sees institutions, not individuals, as the source.

    - slug: u02-w05-q08
      type: fill_blank
      topic_code: "3.C"
      source: general knowledge
      points: 1
      prompt: |
        The repetition of the same word or phrase at the beginning of successive lines or clauses, as with "In every" in Blake's "London", is called ____.
      answer: ["anaphora"]
      explanation: |
        Anaphora. It builds emphasis and momentum; in "London" it makes the suffering universal.

    # ---- Set B: Sonnet 73
    - slug: u02-w05-q09
      type: multiple_choice
      topic_code: "3.C"
      source: 'William Shakespeare, Sonnet 73 (1609)'
      points: 1
      stimulus: &s73 |
        *The following sonnet by William Shakespeare was first published in 1609. Punctuation follows the Project Gutenberg text.*

        That time of year thou mayst in me behold
        When yellow leaves, or none, or few, do hang
        Upon those boughs which shake against the cold,
        Bare ruin'd choirs, where late the sweet birds sang.
        In me thou see'st the twilight of such day     [5]
        As after sunset fadeth in the west;
        Which by and by black night doth take away,
        Death's second self, that seals up all in rest.
        In me thou see'st the glowing of such fire,
        That on the ashes of his youth doth lie,     [10]
        As the death-bed, whereon it must expire,
        Consum'd with that which it was nourish'd by.
        This thou perceiv'st, which makes thy love more strong,
        To love that well, which thou must leave ere long.
      prompt: |
        The sequence of images in the three quatrains (late autumn, twilight, a dying fire) is significant chiefly because
      options:
        - "each image covers a shorter span of time, suggesting the speaker's remaining life is shrinking"
        - "the images move from night to day, suggesting the speaker's renewed hope"
        - "each image is more cheerful than the last, preparing for the happy couplet"
        - "the images are interchangeable, showing that the order does not matter"
      option_explanations:
        - |
          Correct. A season, then the end of a day, then the last glow of a fire: the timescale contracts from months to hours to moments, so the structure enacts the speaker's sense that his time is running out.
        - |
          The second quatrain moves from twilight into "black night", not toward day; there is no renewal in the images.
        - |
          The fire lies on "the death-bed, whereon it must expire": the images grow darker, not brighter.
        - |
          The order matters: the shrinking spans of time and the move from "behold" to "see'st" to "perceiv'st" give the poem its progress toward the couplet.
      answer: 0

    - slug: u02-w05-q10
      type: multiple_choice
      topic_code: "3.D"
      source: 'William Shakespeare, Sonnet 73 (1609)'
      points: 1
      stimulus: *s73
      prompt: |
        The final couplet (lines 13-14) differs from the three quatrains chiefly in that it
      options:
        - "introduces a fourth image of decline, winter"
        - "turns from the speaker's aging to its effect on the listener's love"
        - "reveals that the speaker has recovered his youth"
        - "addresses a new listener who has not appeared before"
      option_explanations:
        - |
          The couplet offers no new image; it draws a conclusion from the three images already given.
        - |
          Correct. The quatrains are about "me" (what "thou mayst in me behold"); the couplet is about "thy love": seeing that the speaker will soon die makes the listener love him "more strong". That contrast is the poem's turn.
        - |
          Nothing reverses the decline; "which thou must leave ere long" confirms it.
        - |
          The "thou" of the couplet is the same "thou" who beholds and sees in lines 1, 5 and 9.
      answer: 1

    - slug: u02-w05-q11
      type: multiple_choice
      topic_code: "5.B"
      source: 'William Shakespeare, Sonnet 73 (1609)'
      points: 1
      stimulus: *s73
      prompt: |
        In context, "Bare ruin'd choirs, where late the sweet birds sang" (line 4) primarily serves to
      options:
        - "describe a church the speaker once attended"
        - "compare the bare branches to the ruined choir stalls of a church, adding loss of music and holiness to the image of age"
        - "suggest that the birds have abandoned the tree because the speaker frightened them"
        - "contrast the speaker's youthful singing voice with the birds' song"
      option_explanations:
        - |
          The choirs are a comparison, not a literal place; they stand for the "boughs" of line 3.
        - |
          Correct. Bare boughs look like the empty, roofless choir stalls of a ruined church where singers once sang. The image adds grandeur and sorrow: what is lost is music, beauty and something sacred.
        - |
          The birds are gone because it is late autumn ("against the cold"), not because of anything the speaker did.
        - |
          The speaker's own voice is not mentioned; the "sweet birds" belong to the past summer of the tree, which stands for his youth.
      answer: 1

    - slug: u02-w05-q12
      type: multiple_choice
      topic_code: "3.C"
      source: 'William Shakespeare, Sonnet 73 (1609)'
      points: 1
      stimulus: *s73
      prompt: |
        The phrase "Death's second self" (line 8) functions in the second quatrain to
      options:
        - "make night a double of death, so that the image of a day's end points directly to the speaker's death"
        - "introduce a second speaker who will answer the first"
        - "suggest that the speaker has already died once before"
        - "contrast the peacefulness of death with the violence of night"
      option_explanations:
        - |
          Correct. Night "seals up all in rest" the way death does; calling it death's double makes explicit what each quatrain implies: every image of ending is the speaker's own death in miniature.
        - |
          No new voice speaks; the phrase is an appositive describing "black night".
        - |
          "Second self" means a likeness or double, not a second life of the speaker.
        - |
          Night and death are compared as alike (both bring "rest"), not contrasted.
      answer: 0

    - slug: u02-w05-q13
      type: multiple_choice
      topic_code: "5.B"
      source: 'William Shakespeare, Sonnet 73 (1609)'
      points: 1
      stimulus: *s73
      prompt: |
        Line 12, "Consum'd with that which it was nourish'd by", is best understood to mean that the fire
      options:
        - "is put out by the wind that once fanned it"
        - "is choked by the ashes of the fuel that once fed it, as a life is smothered by its own spent youth"
        - "burns more brightly because it is fed constantly"
        - "consumes the speaker's beloved along with the speaker"
      option_explanations:
        - |
          No wind appears; the fire lies "on the ashes of his youth".
        - |
          Correct. The wood that nourished the flame has become the ash that smothers it. Applied to the speaker, the years that fed his life are what now consume it: a paradox that makes aging the work of living itself.
        - |
          The fire is dying on its "death-bed"; it is not burning more brightly.
        - |
          The beloved is "thou", the one who watches; nothing suggests the fire consumes the listener.
      answer: 1

    - slug: u02-w05-q14
      type: short_answer
      topic_code: "3.C"
      source: 'William Shakespeare, Sonnet 73 (1609)'
      points: 2
      stimulus: *s73
      prompt: |
        In two or three sentences, explain how the sonnet's division into three quatrains and a couplet supports its meaning.
      answer: |
        Each quatrain gives one image of the speaker's decline, and each is shorter in time than the last (a season, a twilight, the last glow of a fire), so the structure itself makes his remaining life seem to shrink. The couplet then turns from what the listener sees in him to what that seeing does, strengthening love for what "thou must leave ere long", so the form moves from evidence to conclusion.
      explanation: |
        1 point: identifies what the quatrains do (one image each, a progression, shrinking time or darkening).
        1 point: explains the couplet's function (a turn to the listener or a conclusion drawn from the images) and links the form to the poem's meaning. Naming the rhyme scheme alone earns no credit.

    # ---- Blake's paired songs
    - slug: u02-w05-q15
      type: multiple_choice
      topic_code: "3.D"
      source: 'William Blake, "The Tyger" (1794)'
      points: 1
      prompt: |
        In "The Tyger", the speaker asks, "Did he smile his work to see? / Did he who made the Lamb make thee?" The reference to the Lamb primarily serves to
      options:
        - "remind the reader that tigers hunt lambs in the wild"
        - "set the tiger against the lamb of Blake's earlier poem, asking whether one creator could make both gentleness and terror"
        - "show that the speaker has decided the tiger and the lamb were made by different gods"
        - "suggest that the tiger will become as gentle as the lamb"
      option_explanations:
        - |
          The poem is not about predation; it is about creation. The question is who made the tiger, not what it eats.
        - |
          Correct. The line links the paired Songs: the Lamb of Innocence, whose maker "calls himself a Lamb", against the fiery tiger of Experience. The contrast becomes the poem's central, unanswered question.
        - |
          The speaker asks; he does not decide. Every sentence in that stanza is a question.
        - |
          The final stanza repeats the opening with "Dare frame", not a promise of transformation; the tiger stays "burning bright".
      answer: 1

    - slug: u02-w05-q16
      type: multiple_choice
      topic_code: "3.C"
      source: 'William Blake, "The Lamb" (1789) and "The Tyger" (1794)'
      points: 1
      prompt: |
        "The Lamb" asks "Little Lamb who made thee" and answers its own question in the second stanza; "The Tyger" asks questions in nearly every line and answers none. This difference in structure best reflects
      options:
        - "the contrast between innocence's confident faith and experience's troubled wonder"
        - "Blake's growing skill as a poet between 1789 and 1794"
        - "the fact that the lamb can speak and the tiger cannot"
        - "the speaker's greater knowledge of tigers than of lambs"
      option_explanations:
        - |
          Correct. The child who speaks "The Lamb" knows the answer ("Little Lamb I'll tell thee!"); the speaker of "The Tyger" can only ask, in tighter and more urgent fragments. The shape of each poem embodies its "contrary state of the human soul".
        - |
          Speculating about the poet's development does not explain what the structure does in the poems. Both shapes are deliberate.
        - |
          Neither animal speaks; in "The Lamb" a child speaks to the lamb, and in "The Tyger" a speaker addresses the tiger.
        - |
          The unanswered questions show that the speaker cannot explain the tiger's maker; if anything he knows less.
      answer: 0

    - slug: u02-w05-q17
      type: multiple_choice
      topic_code: "5.B"
      source: 'William Blake, "The Tyger" (1794)'
      points: 1
      prompt: |
        In the first stanza of "The Tyger", the speaker asks what "immortal hand or eye, / Could frame thy fearful symmetry?" The phrase "fearful symmetry" primarily conveys
      options:
        - "the speaker's simultaneous awe at the tiger's ordered beauty and terror at its power"
        - "the speaker's belief that the tiger is badly made"
        - "the tiger's own fear of the hunter"
        - "a mathematical description of the tiger's stripes"
      option_explanations:
        - |
          Correct. "Symmetry" means balance, design and beauty; "fearful" means inspiring fear (and full of it). The pairing holds the speaker's double response in two words.
        - |
          Symmetry implies careful, perfect design; the speaker is astonished, not critical.
        - |
          "Fearful" here describes the effect the tiger's form has on the observer; nothing suggests the tiger is afraid.
        - |
          The word suggests visual order, but the phrase's function is emotional and spiritual: who could dare to make such a thing?
      answer: 0

    # ---- Frost
    - slug: u02-w05-q18
      type: multiple_choice
      topic_code: "3.C"
      source: 'Robert Frost, "Nothing Gold Can Stay" (1923)'
      points: 1
      stimulus: &gold |
        *The following poem by Robert Frost is from* New Hampshire *(1923).*

        Nature's first green is gold,
        Her hardest hue to hold.
        Her early leaf's a flower;
        But only so an hour.
        Then leaf subsides to leaf.     [5]
        So Eden sank to grief,
        So dawn goes down to day.
        Nothing gold can stay.
      prompt: |
        The movement of the poem from leaves (lines 1-5) to Eden (line 6) to dawn (line 7) to the final line is best described as
      options:
        - "a narrowing from a universal principle to a single, private memory"
        - "a widening from one natural detail to a general law that covers nature, human history and time"
        - "a random list of beautiful things the speaker happens to remember"
        - "a chronological account of a single spring day"
      option_explanations:
        - |
          The order is the reverse: it begins with a particular (a leaf) and ends with the most general statement possible, "Nothing gold can stay."
        - |
          Correct. Each step enlarges the pattern: a leaf's change, the fall from paradise, the fading of every dawn. By line 8 the poem can state a law, and the repeated "So" signals that each case follows the same rule.
        - |
          The repeated "So" (lines 6-7) marks logical connection; the examples are ordered to build an argument, not remembered at random.
        - |
          Eden is not part of a spring day; the poem moves through kinds of time (season, myth, day), not hours of one day.
      answer: 1

    - slug: u02-w05-q19
      type: true_false
      topic_code: "3.D"
      source: 'Robert Frost, "Nothing Gold Can Stay" (1923)'
      points: 1
      stimulus: *gold
      prompt: |
        True or false: the opening line, "Nature's first green is gold", sets up a contrast between what we expect (green) and what the speaker sees (gold), suggesting that the earliest stage of things is the most precious.
      answer: true
      explanation: |
        True. The paradox surprises: the first green of spring is gold, the color of value and of the early, flower-like buds. The rest of the poem explains why this most precious stage is also the "hardest hue to hold". Gold set against ordinary green is the contrast the whole poem develops.

