    - slug: u02-w05-q22
      type: short_answer
      topic_code: "7.A"
      source: 'William Blake, "London" (1794)'
      points: 3
      prompt: |
        Write a defensible claim about what the speaker of Blake's "London" believes causes the city's suffering, and support it with two short quotations and a sentence of explanation.
      answer: |
        Blake's speaker sees London's suffering as made by its institutions and by the habits of mind they impose, not by the weakness of individuals. The "charter'd street" and "charter'd Thames" show a city where even the river is owned, and the "mind-forg'd manacles" he hears in "every voice" show that people have taken those chains into their own thinking. The Church and Palace, stained by the sweep's cry and the soldier's blood, are named as the powers that profit from it.
      explanation: |
        1 point: an arguable claim about the cause of suffering in the speaker's view (institutions, ownership, mental bondage, hypocrisy of Church and state).
        1 point: two accurate, relevant quotations.
        1 point: commentary that explains how the quoted words support the claim. Listing images without explanation earns at most 2.

    - slug: u02-w05-q23
      type: long_answer
      topic_code: "3.C"
      source: 'Robert Frost, "Nothing Gold Can Stay" (1923)'
      points: 6
      stimulus: *gold
      prompt: |
        Read carefully the poem above, Robert Frost's "Nothing Gold Can Stay" (1923). In a well-written essay, analyze how Frost uses literary elements and techniques, such as structure, contrast and word choice, to convey a complex view of beauty and loss.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Frost's eight compressed lines argue that the most precious stage of anything is its first, and that its loss is a law of nature, not a tragedy that could have been avoided; the poem mourns and accepts at once.
        Line of reasoning and evidence: (1) The opening paradox, "Nature's first green is gold", and "Her hardest hue to hold" establish that value lies in beginnings and that it cannot be held. (2) Diction makes growth into decline: "only so an hour", "leaf subsides to leaf", "Eden sank", "dawn goes down to day"; even day, usually bright, becomes a descent. (3) Structure widens the claim: the repeated "So" turns a leaf's change into the fall from Eden and the daily loss of dawn, until the last line states a universal law. The rhymed couplets and short lines give the poem the finality of a proverb, which is part of its acceptance.
        Complexity: the poem calls the loss "grief" but presents it calmly and inevitably; beauty is precious because it does not stay.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis about how Frost conveys a view of beauty and loss (for example, that the poem both grieves and accepts transience). A restatement of the prompt or a plot description ("the poem is about leaves changing") earns 0.
        Row B Evidence and Commentary (0-4):
        4 = specific evidence from across the poem (the gold/green paradox, "subsides", the "So" sequence through Eden and dawn, the final line) consistently explained in relation to a line of reasoning about structure and contrast.
        3 = specific, relevant evidence and explanation of how at least some of it supports the line of reasoning; the analysis of structure may be uneven.
        2 = some relevant evidence, but commentary mostly summarizes or paraphrases the poem.
        1 = evidence is general or mostly restates the thesis.
        0 = no relevant evidence.
        Row C Sophistication (0-1): 1 point for a complex understanding, such as explaining the tension between "grief" and the poem's calm, proverb-like form, or how "dawn goes down to day" inverts the usual value of daylight, or situating the Eden allusion within the poem's argument. A single phrase alone ("this poem is complex") does not earn the point.
