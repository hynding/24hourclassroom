guide_description: |
  Reliability without a narrator: Act II is full of reports about Hamlet (Ophelia's, Polonius's, Rosencrantz and
  Guildenstern's) and of Hamlet's own doubts about the Ghost. How to weigh a reported scene, a self-interested
  interpreter and a performing speaker (4.D), and how the foils the act assembles (the Player, Pyrrhus, Fortinbras,
  Horatio against the schoolfellows) define Hamlet by contrast (1.C). Worked readings and a model paragraph.
flashcards_description: |
  30 cards on Act II: who reports what about Hamlet and how far to trust it, the spies and the foils, Pyrrhus and
  the Player, and the soliloquy that ends the act.

flashcards:
  - front: Reliability in a play → where the question arises when there is no narrator
    back: |
      In reported speech (a character describing an offstage event), in interpretation (a character explaining another's behaviour), in self-presentation (a character speaking to an audience he wants to manage) and in the supernatural (can the Ghost be trusted?). Ask who is speaking, to whom, and what they want.
    topic_code: "4.D"
  - front: Reported action (offstage scene) → why Shakespeare uses it for Ophelia's encounter with Hamlet
    back: |
      We never see Hamlet burst in on Ophelia; we hear her describe it to Polonius (2.1). The audience must weigh her account and Polonius's reading of it, and cannot tell whether Hamlet's state was real distress or the "antic disposition" he announced one scene earlier.
    topic_code: "4.D"
  - front: Ophelia's report (2.1) → the details she gives
    back: |
      Doublet "all unbrac’d," no hat, stockings "foul’d" and "down-gyved," "Pale as his shirt," knees knocking. He held her wrist, studied her face "As he would draw it," sighed as if to "shatter all his bulk," and left looking back at her, finding his way "without his eyes."
    topic_code: "4.D"
  - front: Is Ophelia a reliable reporter?
    back: |
      Of what she saw, probably: she is frightened, specific, and has no motive to invent. Of what it means, she claims nothing: asked "Mad for thy love?" she answers that she does not know but fears it. Her report is reliable as a description and undecided as an interpretation.
    topic_code: "4.D"
  - front: Polonius as interpreter → "This is the very ecstasy of love"
    back: |
      He reads Ophelia's report at once as love-madness caused by her rejecting Hamlet, a theory that flatters his own judgment (he ordered the rejection). He is an unreliable interpreter: quick, confident and self-regarding.
    topic_code: "4.D"
  - front: "“By indirections find directions out” → Polonius's method"
    back: |
      His instruction to Reynaldo, sent to spy on Laertes in Paris by spreading small slanders and watching the reaction (2.1). It sums up the Danish court's way of knowing: by trap, bait and eavesdropping.
    topic_code: "1.A"
  - front: Rosencrantz and Guildenstern → who they are
    back: |
      Hamlet's old schoolfellows, summoned by Claudius and Gertrude to cheer him and find out what troubles him. Hamlet asks them directly, "Were you not sent for?", and they eventually admit it.
    topic_code: "1.C"
  - front: Horatio vs Rosencrantz and Guildenstern → the contrast
    back: |
      All three are Hamlet's university friends. Horatio came for the funeral and serves Hamlet; the other two come because the King sent for them and serve the King. True friendship against hired friendship.
    topic_code: "1.C"
  - front: "“Though this be madness, yet there is a method in’t.” → what it shows"
    back: |
      Polonius's aside (2.2) after Hamlet's mocking prose answers. Even the man most committed to the love-madness theory notices that Hamlet's nonsense hits its targets, so the audience is invited to suspect the madness is controlled.
    topic_code: "4.D"
  - front: "“Words, words, words.” → Hamlet's performance"
    back: |
      His reply when Polonius asks what he is reading. In prose, playing the madman, Hamlet empties language of content in front of the counsellor whose own speeches are all words. Mockery disguised as madness.
    topic_code: "1.E"
  - front: "“I am but mad north-north-west.” → what Hamlet tells his schoolfellows"
    back: |
      That his madness has a direction: "when the wind is southerly I know a hawk from a handsaw." He as good as tells the King's spies that he is mad only when it suits him, a hint they fail to take.
    topic_code: "4.D"
  - front: "“Denmark’s a prison.” → the image"
    back: |
      Hamlet to Rosencrantz and Guildenstern (2.2). The kingdom is a place of confinement and surveillance, for him literally (he has been refused leave) and figuratively ("nothing either good or bad but thinking makes it so").
    topic_code: "2.C"
  - front: "“What a piece of work is man” → speaker, audience, reliability"
    back: |
      Hamlet's prose praise of humanity collapsing into "this quintessence of dust" (2.2). Sincere melancholy, or a performance for the King's spies? He has just made them admit they were sent for, so he is describing his state to people who will report it.
    topic_code: "4.D"
  - front: Hamlet's prose in Act II → why it matters
    back: |
      With Polonius, Rosencrantz, Guildenstern and the players, Hamlet speaks prose: quick, punning and evasive. Alone at the end of the act he returns to blank verse. The switch marks the move from public performance to private reckoning.
    topic_code: "3.D"
  - front: The Norway ambassadors (2.2) → what they report about Fortinbras
    back: |
      Old Norway, Fortinbras's uncle, has stopped his nephew's planned attack on Denmark and turned it against Poland, and asks leave for the army to cross Denmark. Fortinbras obeys his uncle; the contrast with Hamlet and his uncle is pointed.
    topic_code: "1.C"
  - front: Fortinbras as foil → what he shows about Hamlet
    back: |
      Both are princes whose fathers died (Fortinbras's at Old Hamlet's hand) and whose uncles hold the throne. Fortinbras turns grievance into military action; Hamlet turns his into thought. Each makes the other's way of acting visible.
    topic_code: "1.C"
  - front: The First Player's speech → what it is about
    back: |
      At Hamlet's request the First Player recites Aeneas's tale to Dido of Priam's death: Pyrrhus, avenging his father Achilles, kills old King Priam while Queen Hecuba wails. The Player weeps and turns pale as he speaks.
    topic_code: "3.D"
  - front: Pyrrhus as foil → "Did nothing"
    back: |
      Pyrrhus, a son avenging his father, stands with sword raised over Priam, "like a neutral to his will and matter," and "Did nothing," then strikes. A revenger who pauses and then acts, a mirror held up to Hamlet's delay.
    topic_code: "1.C"
  - front: The Player as foil → the "Hecuba" contrast
    back: |
      The Player weeps real tears over Hecuba, a figure in a story, "all for nothing." Hamlet, with "the motive and the cue for passion," has done nothing. The actor's feigned passion shames the son's real one.
    topic_code: "1.C"
  - front: "“O, what a rogue and peasant slave am I!” → the soliloquy's movement"
    back: |
      End of Act II. Self-contempt at his inaction compared with the Player; a burst of rage against Claudius; disgust at himself for unpacking his heart "with words"; then a plan: test the Ghost by staging a play that mirrors the murder.
    topic_code: "1.E"
  - front: "“The spirit that I have seen / May be the devil” → why Hamlet doubts the Ghost"
    back: |
      Protestant belief held that ghosts might be devils in a pleasing shape, sent to tempt the melancholy into damnation. Hamlet questions his source's reliability and wants "grounds / More relative than this."
    topic_code: "4.D"
  - front: "“The play’s the thing / Wherein I’ll catch the conscience of the king.” → its function"
    back: |
      The couplet that ends Act II and turns doubt into a plan: stage the murder and watch Claudius. Theatre becomes a test of truth, prepared by the Player's tears and the line "guilty creatures, sitting at a play."
    topic_code: "3.B"
  - front: "“guilty creatures, sitting at a play” → Hamlet's theory of drama"
    back: |
      He has heard that guilty spectators, struck "by the very cunning of the scene," have confessed their crimes. The idea that a play can force the truth out of an audience is the basis of the Mousetrap in Act III.
    topic_code: "5.B"
  - front: "“a speech of some dozen or sixteen lines” → what Hamlet asks the Player"
    back: |
      He asks whether the players could perform "The Murder of Gonzago" with a speech of his own inserted. He becomes the author of a play within the play, a man who answers a crisis by writing.
    topic_code: "1.E"
  - front: Polonius's plan in 2.2 → "I’ll loose my daughter to him"
    back: |
      He proposes to the King that they hide and watch while Ophelia meets Hamlet, to prove the love-madness theory. "Loose" is the language of releasing an animal at breeding time, and it shows how Polonius uses his daughter as bait.
    topic_code: "1.D"
  - front: Hamlet's letter to Ophelia → "Doubt thou the stars are fire"
    back: |
      Polonius reads it aloud to the King and Queen (2.2), mocking its style as he goes. A private love letter turned into evidence: Ophelia's intimacy becomes state business, and neither her feelings nor Hamlet's are respected.
    topic_code: "1.D"
  - front: "“brevity is the soul of wit” → the irony"
    back: |
      Polonius says it in the middle of a long, digressive preamble to the King and Queen (2.2), and Gertrude cuts him off: "More matter, with less art." The speaker condemns himself out of his own mouth.
    topic_code: "1.A"
  - front: Act II's spies, listed
    back: |
      Reynaldo (sent by Polonius to spy on Laertes), Rosencrantz and Guildenstern (sent by Claudius to spy on Hamlet), Polonius and Claudius (planning to spy on Hamlet and Ophelia). Hamlet, meanwhile, plans to spy on Claudius through a play.
    topic_code: "1.C"
  - front: Act II in one sentence (plot order)
    back: |
      Polonius sends a spy after Laertes and hears Ophelia's report (2.1); the King sets Hamlet's schoolfellows to watch him, Norway's threat is turned toward Poland, Polonius proposes his plot, Hamlet baits Polonius and the schoolfellows, the players arrive, and Hamlet plans the Mousetrap (2.2).
    topic_code: "3.A"
  - front: Contrasting characters (1.C) → the question to ask in Hamlet
    back: |
      Not just "how are they different?" but "what does the difference make us see?" Each foil (Laertes, Fortinbras, Pyrrhus, the Player, Horatio) faces some version of Hamlet's situation and responds differently, so each one asks the audience to judge his response.
    topic_code: "1.C"

quiz:
  description: |
    22 questions · about 40 minutes · about 50% this week (Act II: how far to trust what characters report about
    Hamlet and what Hamlet reports about himself, and the foils around him) and 50% review: last week's choices and
    contrasts, imagery, word choice, plot order, relationships and thesis writing. Multiple choice, select-all and
    true/false items are graded at once and the fill-in-the-blank items are matched automatically; the two short
    answers and the essay are graded by your teacher against the scoring guide.
  questions:
    # ---- Passage set: Ophelia's report, 2.1.87-111
    - slug: u06-w18-q01
      type: multiple_choice
      topic_code: "4.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: &oph |
        *The following passage is from William Shakespeare's* Hamlet *(c. 1600), Act 2, scene 1 (lines 87-111 in the Folger edition, which reads "closet" for "chamber" and prints lines 10-11 as one line; line numbers differ between editions). The text is Project Gutenberg's. Ophelia has run in, frightened, to her father Polonius. Bracketed numbers count the lines of this excerpt.*

        OPHELIA.
        My lord, as I was sewing in my chamber,
        Lord Hamlet,—with his doublet all unbrac’d;
        No hat upon his head; his stockings foul’d,
        Ungart’red, and down-gyved to his ankle;
        Pale as his shirt; his knees knocking each other;     [5]
        And with a look so piteous in purport
        As if he had been loosed out of hell
        To speak of horrors,—he comes before me.

        POLONIUS.
        Mad for thy love?

        OPHELIA.
        My lord, I do not know;     [10]
        But truly I do fear it.

        POLONIUS.
        What said he?

        OPHELIA.
        He took me by the wrist, and held me hard;
        Then goes he to the length of all his arm;
        And with his other hand thus o’er his brow,     [15]
        He falls to such perusal of my face
        As he would draw it. Long stay’d he so;
        At last,—a little shaking of mine arm,
        And thrice his head thus waving up and down,—
        He rais’d a sigh so piteous and profound     [20]
        As it did seem to shatter all his bulk
        And end his being: that done, he lets me go:
        And, with his head over his shoulder turn’d
        He seem’d to find his way without his eyes;
        For out o’ doors he went without their help,     [25]
        And to the last bended their light on me.
      prompt: |
        Which best describes Ophelia's reliability as the reporter of this offstage encounter?
      options:
        - "She is unreliable, because she is inventing the episode to win back Hamlet's attention."
        - "She is reliable about what she saw, which she describes precisely and without motive to distort, but she does not claim to know what it means."
        - "She is fully reliable about both the events and their cause, since she states plainly that Hamlet is mad for love."
        - "She cannot be judged, because the audience has no way to tell whether she is speaking verse or prose."
      option_explanations:
        - |
          Nothing in the scene suggests invention: she is frightened, her details are concrete, and she has just obeyed her father by refusing Hamlet's letters. Inventing a crisis would serve no purpose of hers.
        - |
          Correct. Her account is exact (doublet, stockings, wrist, sigh, the backward look) and she has no reason to lie. But asked "Mad for thy love?" she answers, "I do not know; / But truly I do fear it." Her report is trustworthy as description and undecided as interpretation.
        - |
          She explicitly does not claim to know: "I do not know." It is Polonius who will convert her fear into a confident diagnosis.
        - |
          Verse or prose bears on register, not truthfulness, and the passage is plainly verse. Reliability depends on access, motive and the line between seeing and interpreting.
      answer: 1
      explanation: |
        A 4.D item. When a play reports an event instead of staging it, judge the reporter on three counts: what she could see, what she wants, and whether she goes beyond what she saw.

    - slug: u06-w18-q02
      type: multiple_choice
      topic_code: "5.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *oph
      prompt: |
        The imagery in lines 5-8 ("Pale as his shirt" ... "As if he had been loosed out of hell / To speak of horrors") most strongly suggests that Hamlet
      options:
        - "has fallen ill with a fever caught on the cold battlements"
        - "resembles a ghost himself, as if his encounter with his father's spirit had marked his appearance"
        - "is dressed for a formal occasion at court"
        - "is angry with Ophelia for rejecting him"
      option_explanations:
        - |
          The paleness is part of a larger picture (a figure "loosed out of hell / To speak of horrors") that points beyond illness to the supernatural.
        - |
          Correct. Pallor, silence and a figure come from hell to speak of horrors: Ophelia unknowingly describes Hamlet as a revenant, much as the Ghost appeared to him. The audience, who saw 1.5, can connect what she cannot.
        - |
          The details (doublet "unbrac’d," no hat, stockings fallen) describe disorder, the opposite of formal dress.
        - |
          The look is "piteous," not angry, and he holds her wrist and studies her face. The imagery is of horror and grief, not rage.
      answer: 1
      explanation: |
        Spiral review of imagery (5.D). Ask what the cluster of images adds up to and what the audience knows that the speaker does not.

    - slug: u06-w18-q03
      type: multiple_choice
      topic_code: "4.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *oph
      prompt: |
        Polonius's question in line 9, "Mad for thy love?", asked before Ophelia has finished her account, primarily suggests that he
      options:
        - "has already decided on an explanation and is fitting the evidence to it"
        - "fears that Hamlet has learned of the murder"
        - "is too shocked to speak at length"
        - "doubts that Ophelia is telling the truth"
      option_explanations:
        - |
          Correct. He jumps to a diagnosis that flatters his own management (he ordered Ophelia to reject Hamlet), and after the account he confirms it: "This is the very ecstasy of love." He is an unreliable interpreter of reliable evidence.
        - |
          Polonius knows nothing of the murder; only Hamlet, Horatio and Marcellus know of the Ghost, and only Hamlet knows what it said.
        - |
          Polonius is never short of words, and his question is a theory, not a gasp. He goes on to ask "What said he?" and then to interpret at length.
        - |
          He never questions her account; he accepts it and builds his theory on it.
      answer: 0
      explanation: |
        4.D includes characters who interpret for us. Polonius's haste is the first sign that his reading of Hamlet (love-madness) tells us more about him than about Hamlet.

    - slug: u06-w18-q04
      type: multiple_choice
      topic_code: "1.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *oph
      prompt: |
        The details in lines 13-26 (the long silent study of her face, the sigh, the backward gaze as he leaves) suggest which of the following about Hamlet's relationship with Ophelia?
      options:
        - "He is courting her in the conventional manner, with a declaration of love."
        - "He seems to be looking at her as if for the last time, a wordless farewell whose cause she cannot know."
        - "He has come to warn her that her father is spying on him."
        - "He has stopped caring about her entirely."
      option_explanations:
        - |
          He says nothing at all; Polonius's "What said he?" gets an account of gestures, not words. Nothing conventional about it.
        - |
          Correct. He studies her face "As he would draw it," sighs as if to "end his being," and keeps his eyes on her to the last. Taken together, the gestures read as parting. Whether caused by grief, the Ghost's charge or performance, they mark the end of something between them.
        - |
          He gives no warning; he speaks no words. The spying plot has not yet been formed.
        - |
          A man who does not care does not hold her eyes "to the last." The gestures express intense, not absent, feeling.
      answer: 1
      explanation: |
        Spiral review of relationships (1.D). In a reported scene, gestures carry the relationship; read them together, not one by one.

    - slug: u06-w18-q05
      type: multi_select
      topic_code: "4.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 2
      partial_credit: true
      stimulus: *oph
      prompt: |
        Select the TWO facts that most limit what the audience can conclude from this report about Hamlet's state of mind.
      options:
        - "In 1.5 Hamlet told Horatio and Marcellus he might choose to put on an “antic disposition.”"
        - "Ophelia has a clear motive to exaggerate the episode."
        - "In Ophelia's account Hamlet says nothing, so there is no speech of his to weigh."
        - "Polonius witnessed the encounter and contradicts her."
      option_explanations:
        - |
          Correct. Because the audience knows Hamlet planned to act strangely, his disordered appearance may be performance. The report cannot tell us which.
        - |
          The passage gives her no such motive; she is frightened and has been obeying her father. This is not a real limit on the report.
        - |
          Correct. In drama we judge characters largely by their speech. A silent Hamlet, seen only through someone else's description, leaves his inner state closed.
        - |
          Polonius was not present; he hears of the episode only from her, and he accepts her account.
      answer: [0, 2]
      explanation: |
        A 4.D item: reliability is limited not only by the reporter's honesty but by what she could know and by what the audience already knows.

    - slug: u06-w18-q06
      type: true_false
      topic_code: "3.A"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *oph
      prompt: |
        True or false: the encounter Ophelia describes is also acted on stage earlier in the play, so the audience can compare her account with what it saw.
      answer: false
      explanation: |
        False. The encounter happens offstage, between scenes, and the audience knows it only through her report. Choosing to narrate rather than stage it is a plot-ordering decision: it keeps Hamlet's state ambiguous and puts the interpretation in Polonius's hands. Spiral review of how plot orders events (3.A).

    - slug: u06-w18-q07
      type: fill_blank
      topic_code: "5.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *oph
      prompt: |
        Ophelia says Hamlet fell to such perusal of her face "As he would ____ it" (line 17), a verb that likens his gaze to an artist's.
      answer: ["draw"]
      explanation: |
        "Draw." The verb makes the gaze slow, intent and memorising, as an artist studies a sitter, which supports reading the scene as a farewell. Spiral review of word function (5.B).

    # ---- The rest of Act II
    - slug: u06-w18-q08
      type: multiple_choice
      topic_code: "1.C"
      source: general knowledge
      points: 1
      prompt: |
        The contrast between Horatio and Rosencrantz and Guildenstern, all of them Hamlet's fellow students, functions chiefly to
      options:
        - "show that university men are untrustworthy"
        - "distinguish true friendship, freely given, from friendship enlisted in the King's service, so that Hamlet's isolation at court is sharper"
        - "provide comic relief through mistaken identity"
        - "show that Hamlet trusts everyone equally"
      option_explanations:
        - |
          Horatio is a university man too, and the most trustworthy person in the play. The contrast is between kinds of loyalty, not a judgment on scholars.
        - |
          Correct. Horatio came for the funeral and serves Hamlet; the schoolfellows came because Claudius "sent for" them. Hamlet forces them to admit it, and from then on he is surrounded by friends he cannot trust.
        - |
          Nobody mistakes anyone's identity; Hamlet sees through the pair at once.
        - |
          He demands of them, "Were you not sent for?", which is the opposite of equal trust.
      answer: 1
      explanation: |
        1.C: name what the contrasting characters share (here, a past with Hamlet) before naming the difference, then say what the difference shows.

    - slug: u06-w18-q09
      type: multiple_choice
      topic_code: "1.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        In the First Player's speech, Pyrrhus, avenging his father Achilles, stands over old Priam with his sword raised: "So, as a painted tyrant, Pyrrhus stood; / And, like a neutral to his will and matter, / Did nothing." He then strikes. The figure of Pyrrhus functions chiefly as
      options:
        - "a model of mercy, which Hamlet will follow by sparing Claudius forever"
        - "a foil: another son avenging a father who pauses, frozen between will and deed, and then acts, mirroring and sharpening the question of Hamlet's delay"
        - "an allusion that has no bearing on Hamlet's situation"
        - "evidence that the players are poor actors"
      option_explanations:
        - |
          Pyrrhus does not show mercy: after the pause he kills Priam savagely. The pause is the point, not a permanent restraint.
        - |
          Correct. The parallel is exact (a son, a dead father, a raised sword) and the pause, "like a neutral to his will and matter," pictures Hamlet's state. That Pyrrhus then acts brutally also complicates any wish that Hamlet would simply act.
        - |
          Hamlet chooses this very speech, and the parallel with his situation is too close to be accidental. Allusion here does structural work.
        - |
          The Player performs it so movingly that he turns pale and weeps, which is what provokes Hamlet's soliloquy.
      answer: 1
      explanation: |
        Foils in *Hamlet* are often other avengers. Explain both the likeness and the difference and what the comparison asks the audience to think.

    - slug: u06-w18-q10
      type: multiple_choice
      topic_code: "1.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Hamlet asks of the weeping actor, "What’s Hecuba to him, or he to Hecuba, / That he should weep for her?" The contrast between the Player and Hamlet chiefly reveals that
      options:
        - "the Player is a better person than Hamlet"
        - "Hamlet judges himself by an actor's outward passion, and finds his own real cause producing less visible feeling than a fiction does"
        - "Hamlet has no feelings about his father"
        - "the Player knows about the murder"
      option_explanations:
        - |
          The contrast is not a moral ranking of two men but a comparison of feeling and expression.
        - |
          Correct. The actor weeps "for nothing," for a woman in a story; Hamlet, with "the motive and the cue for passion," has done nothing. Ironically, Hamlet, who claimed in 1.2 to have "that within which passeth show," now reproaches himself for not showing enough.
        - |
          The soliloquy is full of feeling; his complaint is that the feeling has not become action or display.
        - |
          The Player knows nothing of the murder; that ignorance is what makes his tears "all for nothing."
      answer: 1
      explanation: |
        1.C, with an echo of last week's 1.E: the contrast with the Player turns Hamlet's own earlier words against him.

    - slug: u06-w18-q11
      type: multiple_choice
      topic_code: "4.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Hamlet tells Rosencrantz and Guildenstern, "I am but mad north-north-west: when the wind is southerly I know a hawk from a handsaw." For the audience, the line chiefly signals that
      options:
        - "Hamlet is completely and helplessly mad"
        - "Hamlet's madness is selective, under his control, and that he is half-confessing as much to the King's own spies"
        - "Hamlet plans to sail to England"
        - "Hamlet has given up any pretence with his schoolfellows and told them about the Ghost"
      option_explanations:
        - |
          A madness that depends on the wind's direction is a joke about madness, not a symptom of it.
        - |
          Correct. He says he is mad only on one point of the compass, so the madness has a direction and a purpose. Telling the King's spies is both a taunt and a test of their wits, and they miss it.
        - |
          The voyage to England is decided by Claudius after the Mousetrap; this line is a riddle about madness, not travel.
        - |
          He tells them nothing about the Ghost; Horatio and Marcellus are sworn to secrecy and Hamlet keeps it.
      answer: 1
      explanation: |
