    # ---- Essay: the Act II soliloquy, 2.2.577-598
    - slug: u06-w18-q22
      type: long_answer
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 6
      stimulus: |
        *The following passage is from William Shakespeare's* Hamlet *(c. 1600), Act 2, scene 2 (lines 577-598 in the Folger edition; line numbers differ between editions). The text is Project Gutenberg's. The players have left; a moment ago the First Player wept as he recited the death of Priam and the grief of Priam's queen, Hecuba. Hamlet is alone.*

        HAMLET.
        O, what a rogue and peasant slave am I!
        Is it not monstrous that this player here,
        But in a fiction, in a dream of passion,
        Could force his soul so to his own conceit
        That from her working all his visage wan’d;     [5]
        Tears in his eyes, distraction in’s aspect,
        A broken voice, and his whole function suiting
        With forms to his conceit? And all for nothing!
        For Hecuba?
        What’s Hecuba to him, or he to Hecuba,     [10]
        That he should weep for her? What would he do,
        Had he the motive and the cue for passion
        That I have? He would drown the stage with tears
        And cleave the general ear with horrid speech;
        Make mad the guilty, and appal the free;     [15]
        Confound the ignorant, and amaze, indeed,
        The very faculties of eyes and ears.
        Yet I,
        A dull and muddy-mettled rascal, peak,
        Like John-a-dreams, unpregnant of my cause,     [20]
        And can say nothing; no, not for a king
        Upon whose property and most dear life
        A damn’d defeat was made. Am I a coward?
      prompt: |
        Read carefully the passage above. In a well-written essay, analyze how Shakespeare uses literary elements and techniques, including the contrast between Hamlet and the Player, to convey the complexity of Hamlet's judgment of himself.
      answer: |
        Thesis: Measuring himself against an actor who weeps "for nothing," Hamlet condemns himself as a coward, but the contrast he builds is unstable: he judges a real grief by the standard of a performance, so the speech reveals a man whose self-reproach is itself a kind of eloquent inaction.
        Line of reasoning: (1) The opening insult, "rogue and peasant slave," sets the self-condemning tone and ranks the prince below the lowest. (2) The Player's display is catalogued physically (visage "wan’d," tears, "broken voice," whole "function suiting / With forms") and dismissed as "a fiction," "a dream of passion," "all for nothing," and Hecuba is repeated in a chiasmus ("What’s Hecuba to him, or he to Hecuba") that empties the fiction. (3) The hypothetical ("What would he do, / Had he the motive and the cue for passion") uses theatre words ("cue," "stage," "general ear") so that even Hamlet's ideal of action is a performance. (4) The turn "Yet I" brings the contrast home: "dull," "muddy-mettled," "John-a-dreams," "unpregnant," "can say nothing." (5) The closing question, "Am I a coward?", is still a question, not an act. Strong essays note the irony that the man who scorned "actions that a man might play" in 1.2 now envies an actor, and that the speech will end in a plan that is itself a play.
      explanation: |
        Row A Thesis (0-1): 1 for a defensible thesis about the complexity of Hamlet's self-judgment (for example, that it is both just and distorted, or that it measures reality by performance), not merely "Hamlet feels guilty."
        Row B Evidence and Commentary (0-4): 1 = summary or quotation with little explanation. 2 = relevant evidence (the Player's tears, "Am I a coward?") with commentary that identifies devices but does not connect them to the complexity. 3 = specific evidence from across the passage (the insults, the catalogue of the Player's display, the Hecuba chiasmus, the hypothetical with its theatre vocabulary, the "Yet I" turn, the closing question) with commentary explaining how each conveys Hamlet's judgment and builds a line of reasoning. 4 = consistently explains how the techniques work together: for instance, how the contrast with the Player both shames Hamlet and misleads him, since tears are not revenge.
        Row C Sophistication (0-1): 1 for a complex understanding, such as the irony with "I know not seems" (1.2), the observation that Hamlet's ideal of action is described in theatrical terms, or seeing the speech as a stage in a sequence that ends in the Mousetrap.
