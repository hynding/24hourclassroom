    - slug: u06-w20-q22
      type: long_answer
      topic_code: "3.A"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 6
      stimulus: *willow
      prompt: |
        Read carefully the passage above, Queen Gertrude's report of Ophelia's death. In a well-written essay, analyze how Shakespeare uses literary elements and techniques in this report to shape the audience's response to Ophelia's death.
      answer: |
        Thesis: By having Gertrude narrate the drowning instead of staging it, Shakespeare turns Ophelia's death into an elegy whose beauty both consoles and conceals: imagery, personification and a final contrast make the death gentle, blameless and ambiguous, until the last half-line refuses that comfort.
        Line of reasoning: (1) Reporting rather than staging (3.A) means the audience never sees a choice or a struggle; the questions of who watched and whether she meant to die are left open. (2) The setting is built from emblems: the willow of forsaken love, garlands and "coronet weeds" (a mad girl's crown), and flowers whose two names join death and sexuality, the subjects of her songs. (3) Personification ("an envious sliver," "the weeping brook") lets nature cause and mourn the death, shifting blame from any human will. (4) The simile "mermaid-like" and "a creature native and indu’d / Unto that element" make the drowning look natural and painless, and "As one incapable of her own distress" removes intention. (5) The final contrast between "melodious lay" and "muddy death" breaks the spell. Strong essays add that the speech is spoken to Laertes and so feeds his revenge, and that its unexplained source makes it as much a lament as a report.
      explanation: |
        Row A Thesis (0-1): 1 for a defensible thesis about how the report shapes the audience's response (for example, aestheticising, softening, leaving accident and suicide open), not merely "the speech is sad."
        Row B Evidence and Commentary (0-4): 1 = summary or quotations with little explanation. 2 = some relevant evidence (mermaid, muddy death) with commentary that names devices without explaining their effect on the audience. 3 = specific evidence from several parts of the speech (emblems of the setting, personification, simile, the passivity of "incapable of her own distress," the final contrast, or the choice to report) with commentary that explains how each shapes the response and builds a line of reasoning. 4 = consistently explains how the techniques work together, for instance how the beauty of the imagery and the absence of any human agent combine to make the death both bearable and unresolved.
        Row C Sophistication (0-1): 1 for complexity, such as seeing the report's unexplained source as part of its meaning, linking it to Laertes's revenge and the gravediggers' debate in Act V, or reading the speech as Gertrude's own grief and guilt.
