      source: general knowledge
      points: 2
      prompt: |
        In one or two sentences, explain the effect of keeping Hamlet offstage from 4.5 to the end of Act IV while Ophelia goes mad and Claudius and Laertes plot.
      answer: |
        With Hamlet away, the audience watches the consequences of his acts (Ophelia's madness, Laertes's grief) and the trap being built for him, so we know more than he does when he returns; the absence turns suspense about Hamlet's revenge into dread about the revenge prepared against him.
