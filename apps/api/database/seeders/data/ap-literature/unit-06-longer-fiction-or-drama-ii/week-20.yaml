    - slug: u06-w20-q19
      type: short_answer
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 3
      prompt: |
        Asked where Polonius is, Hamlet tells Claudius he is at supper, "Not where he eats, but where he is eaten" (4.3), and adds that a king may "go a progress through the guts of a beggar." In two or three sentences, explain what Hamlet's choice to answer this way reveals about him at this point in the play.
      answer: |
        Having just killed a man, Hamlet chooses mockery over remorse or concealment: he taunts the King with images of worms and digestion that reduce Polonius, and by implication Claudius, to food. The jokes show his defiance and his contempt for royal dignity now that he is sure of Claudius's guilt, and they also suggest a mind that keeps death at arm's length through wit, the same mind that will joke with the gravedigger in Act V.
      explanation: |
        3 points: 1 for accurately characterising the answer (macabre wit, taunting, refusal to cooperate); 1 for what it reveals (defiance, contempt, lack of remorse, a coping strategy, the antic disposition used aggressively); 1 for linking it to context (after the killing; certain of guilt; leading to the graveyard).

