guide: guides/week-20.md
guide_description: |
  How the plot of Act IV orders events (3.A): Hamlet sent away and absent from the stage, his voyage told in a letter,
  Ophelia's death told in a speech, while Laertes and Claudius plot in full view. What the choices of Hamlet, Laertes,
  Claudius and Ophelia reveal about each (1.E). Worked readings of "How all occasions," Laertes's return and the
  willow speech, a model paragraph and the misreadings to avoid.
flashcards_description: |
  29 cards on Act IV: the order of events, what happens offstage and how we learn of it, Laertes as avenger,
  Ophelia's madness and flowers, and the plot against Hamlet.

flashcards:
  - front: How plot orders events (3.A) → the questions to ask of a play
    back: |
      What is staged and what is only reported? What is told out of order, and when do we learn it? Which lines of action run side by side? Act IV of *Hamlet* reports its two most dramatic events (the sea fight and Ophelia's drowning) and stages the plotting instead.
    topic_code: "3.A"
  - front: Act IV, scene 1 → Gertrude's report of the killing
    back: |
      She tells Claudius that Hamlet is "Mad as the sea and wind, when both contend / Which is the mightier" (4.1.7-8 in the Folger numbering), and that he "weeps for what is done." Is she shielding her son or obeying his warning to keep his secret? Her report is our only source for the tears.
    topic_code: "4.D"
  - front: "“It had been so with us, had we been there.” → what Claudius takes from Polonius's death"
    back: |
      Claudius's first thought (4.1.14 in the Folger numbering) is that the blow was meant for him. Fear and self-interest, not grief, shape his response, and they speed up the plan to send Hamlet away.
    topic_code: "1.E"
  - front: Act IV, scenes 2-3 → Hamlet hides the body
    back: |
      Hamlet refuses to say where Polonius's body is, mocks Rosencrantz as a "sponge" that soaks up the King's favour, and tells Claudius that Polonius is at supper, "Not where he eats, but where he is eaten." Grim wit used as defiance.
    topic_code: "1.E"
  - front: "“A man may fish with the worm that hath eat of a king” → Hamlet's point"
    back: |
      A king can pass through the guts of a beggar: worm eats king, fish eats worm, beggar eats fish. Hamlet reduces royalty to food, to Claudius's face. Death levels everyone, a theme that returns in the graveyard.
    topic_code: "1.E"
  - front: "“Do it, England” → Claudius's secret order"
    back: |
      Alone at the end of 4.3, Claudius reveals that his sealed letters order the King of England to put Hamlet to death on arrival. He has moved from managing Hamlet to murdering him.
    topic_code: "3.B"
  - front: Act IV, scene 4 → Fortinbras's army
    back: |
      On his way to the ship Hamlet meets Fortinbras's army crossing Denmark to fight Poland. A captain tells him they go "to gain a little patch of ground / That hath in it no profit but the name" (4.4.19-20 in the Folger numbering).
    topic_code: "1.C"
  - front: "“How all occasions do inform against me” → the soliloquy's argument"
    back: |
      Everything accuses Hamlet of delay. Twenty thousand men will die for an eggshell of land, while he, with "cause, and will, and strength, and means," does nothing. True greatness is to "find quarrel in a straw / When honour’s at the stake" (4.4). He ends: "My thoughts be bloody, or be nothing worth!"
    topic_code: "1.E"
  - front: "“How all occasions” → which text it comes from"
    back: |
      It is in the Second Quarto (1604-05) but not the First Folio (1623). The Folio cuts most of 4.4, so Hamlet's last soliloquy exists only because modern editions combine the texts.
    topic_code: "3.A"
  - front: "“My thoughts be bloody, or be nothing worth!” → the irony"
    back: |
      Hamlet resolves on bloody thoughts, not bloody deeds, and says it as he leaves Denmark under guard. The vow shows the will without the means; his next act on stage comes after his return.
    topic_code: "1.E"
  - front: Hamlet's absence from the stage in Act IV
    back: |
      After 4.4 Hamlet does not appear until the graveyard in 5.1. While he is away the plot runs through Ophelia, Laertes and Claudius, so the audience sees the trap built before the man it is meant for comes back.
    topic_code: "3.A"
  - front: Ophelia's madness (4.5) → how she expresses it
    back: |
      In songs and fragments: a dead man in his shroud, a girl seduced and abandoned. Her grief for her father and her lost love come out in the only language madness leaves her, and the court cannot ignore it.
    topic_code: "1.E"
  - front: "“When sorrows come, they come not single spies, / But in battalions” → the speaker and purpose"
    back: |
      Claudius to Gertrude (4.5.83-84 in the Folger numbering), listing the troubles: Polonius dead, Hamlet gone, the people muttering, Laertes secretly back from France. A summary of consequences, and a sign the King feels them closing in.
    topic_code: "3.B"
  - front: Laertes's return (4.5)
    back: |
      He breaks into the palace at the head of a crowd shouting that he should be king, demanding his father. In a few lines he has done what Hamlet has not in four acts: confronted the man he blames.
    topic_code: "1.C"
  - front: "“To hell, allegiance! Vows, to the blackest devil!” → what it reveals about Laertes"
    back: |
      Laertes (4.5.149 in the Folger numbering) throws away loyalty, conscience and fear of damnation in one breath. Pure revenge without reflection, the opposite of Hamlet's scruple and as dangerous in its own way.
    topic_code: "1.E"
  - front: "“There’s such divinity doth hedge a king” → the irony"
    back: |
      Claudius calms Laertes by claiming that kings are protected by divine power (4.5.138 in the Folger numbering). The man who murdered a king invokes the sacredness of kings: cool nerve, and breathtaking hypocrisy.
    topic_code: "1.E"
  - front: Ophelia's flowers (4.5) → the symbol
    back: |
      She hands out flowers with meanings: "There’s rosemary, that’s for remembrance," pansies "for thoughts," fennel and columbines, rue, "herb of grace," a daisy, and no violets, which "wither’d all when my father died" (4.5.199-209 in the Folger numbering). In madness she speaks in the language of flowers, which a sane girl could not.
    topic_code: "5.C"
  - front: Who receives Ophelia's flowers?
    back: |
      The dialogue does not say. Editors and directors assign them, often fennel and columbines (flattery and infidelity) to the King and rue (sorrow, repentance) to the Queen. Treat any such assignment as an interpretation, not a fact.
    topic_code: "5.C"
  - front: Hamlet's letter to Horatio (4.6) → the sea fight
    back: |
      Two days out, a pirate ship chased them; "in the grapple I boarded them," Hamlet was taken prisoner, and the pirates, "thieves of mercy," returned him to Denmark. Rosencrantz and Guildenstern "hold their course for England" (4.6).
    topic_code: "3.A"
  - front: Why is the sea fight reported in a letter, not staged?
    back: |
      Compression and focus: the adventure takes a few lines of prose, keeping the play on Denmark and the plotters. It also keeps Hamlet's change at sea offstage, so his calm in Act V comes as a surprise to us.
    topic_code: "3.A"
  - front: What Hamlet's letter leaves out
    back: |
      How he discovered the King's order for his death and what he did about Rosencrantz and Guildenstern. He tells Horatio that only in 5.2: an event narrated out of order, a full act after it happened.
    topic_code: "3.A"
  - front: The plot against Hamlet (4.7) → who proposes what
    back: |
      Claudius proposes a fencing match in which Laertes may choose "A sword unbated" (not blunted). Laertes adds poison: "I’ll anoint my sword." Claudius adds a poisoned chalice in case the blade fails (4.7.155-185 in the Folger numbering).
    topic_code: "1.E"
  - front: "“To cut his throat i’ the church.” → Laertes vs Hamlet"
    back: |
      Laertes's answer when Claudius asks what he would do to prove himself his father's son (4.7.144 in the Folger numbering). Hamlet would not kill Claudius at prayer for fear of sending him to heaven; Laertes would kill Hamlet in a church. Two avengers, opposite scruples.
    topic_code: "1.C"
  - front: "“No place, indeed, should murder sanctuarize” → Claudius's reply"
    back: |
      No place should give a murderer sanctuary (4.7.145 in the Folger numbering). Spoken by a murderer, the line is ironic: Claudius condemns in Hamlet what he did himself, and he uses Laertes's grief as his weapon.
    topic_code: "1.E"
  - front: Gertrude's willow speech (4.7) → what it reports
    back: |
      Ophelia climbed a willow over a brook to hang garlands, a branch broke, she fell, her clothes held her up while she sang "snatches of old tunes," and then they "Pull’d the poor wretch from her melodious lay / To muddy death" (4.7.190-207 in the Folger numbering).
    topic_code: "3.A"
  - front: Accident or suicide? → the willow speech's ambiguity
    back: |
      Gertrude's account makes the fall an accident ("an envious sliver broke") and the drowning a passive drifting, "As one incapable of her own distress." Act V's gravediggers and priest treat it as doubtful. The report leaves the question open.
    topic_code: "4.D"
  - front: "“mermaid-like” → the image in the willow speech"
    back: |
      For a moment Ophelia floats on her spread clothes like a creature "native and indu’d / Unto that element." The image makes the death beautiful, almost natural, and keeps its horror at a distance until "muddy death."
    topic_code: "5.D"
  - front: Laertes as foil in Act IV → the summary
    back: |
      Father killed, a sister lost, he returns, confronts the King, accepts a plan and adds poison of his own. He acts at once and is manipulated at once. His speed shows what Hamlet's caution protects him from: being someone else's instrument.
    topic_code: "1.C"
  - front: Act IV in one sentence (plot order)
    back: |
      Claudius learns of Polonius's death and ships Hamlet to England with a death warrant (4.1-4.3); Hamlet meets Fortinbras's army and vows bloody thoughts (4.4); Ophelia goes mad and Laertes storms back (4.5); Hamlet's letter reveals his return (4.6); Claudius and Laertes plot the duel and Ophelia drowns (4.7).
    topic_code: "3.A"

quiz:
  description: |
    22 questions · about 40 minutes · about 50% this week (Act IV: how the plot orders, reports and stages its
    events, and what the choices of Hamlet, Laertes and Claudius reveal) and 50% review: reliability, imagery,
    personification, symbol, contrast, foils and sequence. Multiple choice, select-all and true/false items are graded
    at once and the fill-in-the-blank items are matched automatically; the two short answers and the essay are graded
    by your teacher against the scoring guide.
  questions:
    # ---- Passage set: Gertrude's willow speech, 4.7.190-207 (Project Gutenberg text)
    - slug: u06-w20-q01
      type: multiple_choice
      topic_code: "4.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: &willow |
        *The following passage is from William Shakespeare's* Hamlet *(c. 1600), Act 4, scene 7 (lines 190-207 in the Folger edition; line numbers differ between editions). The text is Project Gutenberg's. Queen Gertrude has just entered to tell Laertes and the King that Ophelia has drowned. Bracketed numbers count the lines of this excerpt.*

        QUEEN.
        There is a willow grows aslant a brook,
        That shows his hoar leaves in the glassy stream;
        There with fantastic garlands did she come
        Of crowflowers, nettles, daisies, and long purples,
        That liberal shepherds give a grosser name,     [5]
        But our cold maids do dead men’s fingers call them.
        There, on the pendant boughs her coronet weeds
        Clamb’ring to hang, an envious sliver broke;
        When down her weedy trophies and herself
        Fell in the weeping brook. Her clothes spread wide;     [10]
        And, mermaid-like, awhile they bore her up;
        Which time she chaunted snatches of old tunes;
        As one incapable of her own distress,
        Or like a creature native and indu’d
        Unto that element: but long it could not be     [15]
        Till that her garments, heavy with their drink,
        Pull’d the poor wretch from her melodious lay
        To muddy death.
      prompt: |
        Which best describes the reliability of Gertrude's account as a report of Ophelia's death?
      options:
        - "It is fully reliable, because Gertrude says she watched the whole event and did nothing."
        - "Its source is never explained: it gives close detail that only a witness could know, yet no witness is named and no one apparently tried to save her, so the speech reads as much like a lament shaped for its listeners as like testimony."
        - "It is a deliberate lie meant to cover up a murder by Claudius."
        - "It cannot be a report at all, because it is in verse."
      option_explanations:
        - |
          Gertrude never says she saw it, and a queen who watched a girl drown for some time without help would be a different character. The speech leaves its source unexplained.
        - |
          Correct. The detail (the "envious sliver," the floating clothes, the songs) implies an observer who neither intervened nor is named. The account is vivid and moving but its basis is unclear, which makes it a crafted report, perhaps shaped to make the death gentle and blameless.
        - |
          Nothing in the play suggests Claudius killed Ophelia; the speech is a softened account, not evidence of a cover-up.
        - |
          Messengers in Shakespeare often report in verse; the form does not make a report false.
      answer: 1
      explanation: |
        Spiral review of reliability (4.D). A reported death invites three questions: could the speaker know this, why tell it this way, and what does the telling leave unsettled (here, accident or suicide)?

    - slug: u06-w20-q02
      type: multiple_choice
      topic_code: "5.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *willow
      prompt: |
        The imagery of lines 10-15 ("Her clothes spread wide; / And, mermaid-like, awhile they bore her up" ... "like a creature native and indu’d / Unto that element") chiefly serves to
      options:
        - "present Ophelia's drowning as a struggle for survival"
        - "soften the death by picturing Ophelia, for a moment, as a creature at home in the water, singing and unaware of her danger"
        - "suggest that Ophelia has magical powers"
        - "criticise Ophelia's clothing as unsuitable for the riverbank"
      option_explanations:
        - |
          There is no struggle in the account; she floats and sings "As one incapable of her own distress." The imagery removes struggle from the scene.
        - |
          Correct. Mermaid, a creature "native" to water: the images make the river her element, so the death seems almost natural and painless until the last line's "muddy death."
        - |
          "Mermaid-like" is a comparison; the point is how the scene looks, not a claim about her nature.
        - |
          The clothes matter only as they first hold her up and then drag her down; the speech makes no judgment of her dress.
      answer: 1
      explanation: |
        Spiral review of imagery (5.D). Ask what feeling the images create and what that feeling does to the fact being reported.

    - slug: u06-w20-q03
      type: multiple_choice
      topic_code: "3.A"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *willow
      prompt: |
        Shakespeare has Ophelia's death narrated by Gertrude rather than acted on stage. Which best explains the effect of this choice?
      options:
        - "It shows that Elizabethan theatres could not stage a riverbank."
        - "Reporting the death turns it into an elegy: the audience receives it already shaped by the Queen's tenderness, and the question of whether it was an accident is left in the telling, unresolved."
        - "It hides the death from Laertes, who never learns of it."
        - "It allows Ophelia to return in Act V."
      option_explanations:
        - |
          Elizabethan staging rarely tried realism of place, but the choice is not a technical limit; it changes how we receive the death.
        - |
          Correct. Narration lets the death be beautiful and ambiguous at once. We hear flowers, song and floating clothes, never a decision, so the play can leave the gravediggers and the priest to argue about suicide in Act V.
        - |
          Laertes is the person she tells; he hears it in this scene.
        - |
          Ophelia returns only as a body to be buried; the narration does not reverse her death.
      answer: 1
      explanation: |
        A 3.A item: deciding what to stage and what to report is part of how a plot orders its events.

    - slug: u06-w20-q04
      type: multiple_choice
      topic_code: "6.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *willow
      prompt: |
        In "an envious sliver broke" (line 8) and "the weeping brook" (line 10), the personification primarily
      options:
        - "makes nature itself seem to take part in the death, one branch spitefully breaking and the brook mourning, so that blame shifts away from any person, including Ophelia"
        - "shows that Gertrude believes the willow was planted by an enemy"
        - "describes the actual sound of the water"
        - "suggests that Ophelia was pushed by a jealous rival"
      option_explanations:
        - |
          Correct. An "envious" branch and a "weeping" brook give feeling to the setting: nature both causes the fall and grieves it. The figure lets the account blame no human will, Ophelia's included.
        - |
          The envy belongs to the branch, a figure of speech; no enemy or planting is mentioned.
        - |
          "Weeping" may suggest dripping water, but its force is emotional: the brook mourns.
        - |
          No rival is mentioned; the personification works precisely to avoid any human agent.
      answer: 0
      explanation: |
        Spiral review of personification (6.C). Ask what feeling is given to the non-human thing and what that feeling does to the story's sense of cause and blame.

    - slug: u06-w20-q05
      type: multi_select
      topic_code: "5.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 2
      partial_credit: true
      stimulus: *willow
      prompt: |
        Select the TWO details in the passage that most clearly carry symbolic weight beyond their literal sense.
      options:
        - "The willow (line 1), a traditional emblem of forsaken love"
        - "The “long purples” that maids call “dead men’s fingers” (lines 4-6), flowers whose names join death and sexuality"
        - "The word “stream” in line 2"
        - "The number of garlands, which the speech specifies as three"
      option_explanations:
        - |
          Correct. In Shakespeare's culture the willow was the sign of the abandoned lover (Desdemona sings a willow song in *Othello*). Ophelia, rejected by Hamlet, dies under one.
        - |
          Correct. The flowers' two names, the shepherds' "grosser" one and the maids' "dead men’s fingers," join the two things her mad songs dwell on: sexual betrayal and her dead father.
        - |
          "Stream" is a plain noun here; it gains no meaning beyond the water.
        - |
          The speech gives no number of garlands. This option invents a detail.
      answer: [0, 1]
      explanation: |
        Spiral review of symbol (5.C): symbolic details are those the text or its culture loads with meaning, not every noun in the passage.

    - slug: u06-w20-q06
      type: true_false
      topic_code: "3.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *willow
      prompt: |
        True or false: the last lines set the beauty of "her melodious lay" against the ugliness of "muddy death," so that the speech ends by breaking the gentle picture it has built.
      answer: true
      explanation: |
        True. For sixteen lines the account is flowers, song and floating clothes; the final half-line, "To muddy death," brings the fact home. The contrast gives the speech its shock. Spiral review of contrast (3.D).

    - slug: u06-w20-q07
      type: fill_blank
      topic_code: "6.A"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *willow
      prompt: |
        Lines 10-11: "Her clothes spread wide; / And, ____-like, awhile they bore her up;"
      answer: ["mermaid"]
      explanation: |
        "Mermaid." The comparison makes Ophelia a creature of the water for a moment, softening the death. Spiral review of simile (6.A).

    # ---- The rest of Act IV
    - slug: u06-w20-q08
      type: multiple_choice
      topic_code: "3.A"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Hamlet's escape at sea is not staged. The audience learns of it from his letter to Horatio: "a pirate of very warlike appointment gave us chase," "in the grapple I boarded them," and the pirates "dealt with me like thieves of mercy" (4.6). Which best explains this ordering of events?
      options:
        - "It shows that Hamlet is lying about the pirates."
        - "It compresses an adventure into a few lines, keeps the play's attention on the plotters in Denmark, and holds back part of the story (what happened to the King's letters) to be told in Act V."
        - "It reveals that Horatio arranged the pirate attack."
        - "It proves that Rosencrantz and Guildenstern are dead."
      option_explanations:
        - |
          Nothing contradicts the letter; Act V confirms and extends it.
        - |
          Correct. A sea fight would pull the play away from Elsinore just as Laertes and Claudius make their plan. The letter also withholds how Hamlet dealt with the King's commission; we hear that only in 5.2.
        - |
          The letter is Horatio's first news of the attack; nothing suggests he planned it.
        - |
          The letter says they "hold their course for England"; their fate is revealed later.
      answer: 1
      explanation: |
        3.A: a plot can report, compress or delay an event. Ask what is gained by each choice.

    - slug: u06-w20-q09
      type: multiple_choice
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Watching Fortinbras's army march off to fight for a worthless patch of ground, Hamlet ends his last soliloquy (4.4, in the Second Quarto only): "O, from this time forth, / My thoughts be bloody, or be nothing worth!" (4.4). What does this resolution chiefly reveal?
      options:
        - "That Hamlet has abandoned the idea of revenge."
        - "A strong will that is still located in thought: he vows bloody thoughts, not deeds, as he leaves Denmark under guard, so the vow confirms the gap it means to close."
        - "That Hamlet plans to join Fortinbras's army."
        - "That he now believes the Ghost was a devil."
      option_explanations:
        - |
          The vow renews revenge with new force; it is not abandonment.
        - |
          Correct. The vow is sincere and fierce, but its object is his "thoughts." It is spoken on the way to a ship that will carry him away from Claudius. The choice of words reveals the complexity the whole play has explored.
        - |
          He admires and criticises the army's purpose; he does not join it.
        - |
          The Mousetrap settled that question in Act III; he takes the Ghost's word now.
      answer: 1
      explanation: |
        1.E: a character's own wording can reveal more than he intends. Compare the vow with his situation at the moment he makes it.

    - slug: u06-w20-q10
      type: multiple_choice
      topic_code: "1.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        A captain tells Hamlet that Fortinbras's army goes "to gain a little patch of ground / That hath in it no profit but the name" (4.4.19-20 in the Folger numbering). In the soliloquy that follows, the contrast between Fortinbras and Hamlet is best described as
      options:
        - "simple praise: Hamlet concludes that Fortinbras is wise and he is foolish"
        - "double-edged: Fortinbras's readiness to fight for an eggshell shames Hamlet's delay, yet the image of twenty thousand men going “to their graves like beds” for nothing also makes such honour look absurd"
        - "irrelevant, since Fortinbras and Hamlet have nothing in common"
        - "hostile: Hamlet resolves to fight Fortinbras"
      option_explanations:
        - |
          Hamlet calls the cause "an egg-shell" and pictures the deaths as pointless; his admiration is mixed with horror.
        - |
          Correct. The foil works both ways. Hamlet draws a lesson in action from the march, but the cost he describes (the "imminent death of twenty thousand men" for a plot of land) shows what action without reflection can mean.
        - |
          Both are princes with dead fathers and uncles on the throne; the play keeps pairing them.
        - |
          Hamlet has no quarrel with Fortinbras, and at the end of the play he names him his successor.
      answer: 1
      explanation: |
        Spiral review of contrasting characters (1.C): strong answers notice that a foil can criticise both characters.

    - slug: u06-w20-q11
      type: multiple_choice
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Confronting the King, Laertes cries, "To hell, allegiance! Vows, to the blackest devil!" (4.5.149 in the Folger numbering). The line chiefly reveals Laertes as
      options:
        - "a cautious thinker who weighs every risk"
        - "an avenger who chooses to throw away loyalty, conscience and his soul's safety in a single breath, the reverse of Hamlet's scruple"
        - "a secret ally of Hamlet's"
        - "a man unconcerned about his father's death"
      option_explanations:
        - |
          He weighs nothing; he consigns his duty to hell and his vows to the devil.
        - |
          Correct. Hamlet asked whether the Ghost might be a devil and whether killing a praying man would save his soul; Laertes declares he does not care about damnation at all. His readiness makes him quick to act and easy to use.
        - |
          He blames the King at first and soon becomes Claudius's instrument against Hamlet.
        - |
          His fury is entirely about his father's death and his "obscure funeral."
      answer: 1
      explanation: |
        1.E: the character's own words reveal both a choice and a temperament, and the function is to set off Hamlet by contrast.

    - slug: u06-w20-q12
      type: multiple_choice
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        When Laertes breaks into the palace, Claudius tells Gertrude, "Let him go, Gertrude; do not fear our person: / There’s such divinity doth hedge a king" (4.5.137-138 in the Folger numbering). The speech best reveals Claudius's
      options:
        - "genuine faith that God protects kings, proved by his own conduct"
        - "nerve and hypocrisy at once: he faces down an armed man calmly, while claiming for kingship a sacredness he violated by murdering a king"
        - "fear of Laertes"
        - "wish to step down from the throne"
      option_explanations:
        - |
          His own conduct (he killed an anointed king) refutes the claim; the irony is what the audience hears.
        - |
          Correct. His poise is real and impressive, and the claim is outrageous coming from him. Both reveal a politician who uses even sacred ideas as tools.
        - |
          He tells Gertrude not to fear for him and handles Laertes coolly; fear is what he is concealing, if anything.
        - |
          He is about to win Laertes over, not abdicate.
