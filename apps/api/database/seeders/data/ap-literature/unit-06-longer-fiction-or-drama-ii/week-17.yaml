    - slug: u06-w17-q21
      type: multiple_choice
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Hamlet ends Act I's last scene with the couplet "The time is out of joint:—O cursed spite, / That ever I was born to set it right!" What does the couplet reveal about him?
      options:
        - "He is eager and fully confident about the revenge ahead."
        - "He accepts the duty and resents it in the same breath, so his ambivalence toward the task is on record at the moment he takes it on."
        - "He has decided to refuse the Ghost's command."
        - "He believes the problem is merely that the clocks at court are wrong."
      option_explanations:
        - |
          "O cursed spite" is a curse on his fate, not eagerness. Confidence is exactly what is missing.
        - |
          Correct. "Set it right" accepts the task; "cursed spite" and "That ever I was born" resent it. The rhyme gives the moment finality, and the ambivalence it records is the engine of the next three acts.
        - |
          He has just sworn his companions to secrecy and accepted that the task falls to him; "born to set it right" is acceptance.
        - |
          "Time" means the age, the state of things; "out of joint" is the image of a dislocated bone. A literal reading misses the metaphor.
      answer: 1
      explanation: |
        A 1.E item on a choice made in speech. The two halves of the couplet pull against each other; name both and say why the play needs that tension.

    - slug: u06-w17-q22
      type: long_answer
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 6
      stimulus: *sol1
      prompt: |
        Read carefully the passage above, from the first soliloquy in Shakespeare's *Hamlet* (1.2), spoken just after the court has celebrated the new King's marriage. In a well-written essay, analyze how Shakespeare uses literary elements and techniques to convey the complexity of Hamlet's response to his father's death and his mother's remarriage.
      answer: |
        Thesis: In his first soliloquy Hamlet's grief for his father and his disgust at his mother keep swallowing each other; Shakespeare uses imagery of decay, a god-and-beast contrast and broken, self-correcting syntax to show a mind so revolted by the remarriage that it can find no use in living and yet cannot act, ending in enforced silence.
        Line of reasoning: (1) The wish to dissolve, set against the "canon ’gainst self-slaughter," shows despair checked by conscience. (2) The "unweeded garden" turns private grief into a vision of a world given over to "things rank and gross." (3) "Hyperion to a satyr" and the memory of the father's tenderness make the marriage a fall from god to beast. (4) The shrinking time ("two months," "not two," "a month," "A little month") and the breaks ("Let me not think on’t") act out a thought he cannot stop and cannot bear. (5) "Frailty, thy name is woman!" and the Niobe allusion show his judgment hardening into a generalisation that will shape how he treats Ophelia. A strong essay notes that the excerpt stops before the end, "But break my heart,—for I must hold my tongue," so the speech closes in silence, not action.
      explanation: |
        Row A Thesis (0-1): 1 for a defensible thesis that interprets Hamlet's complex response (more than "Hamlet is sad"), naming the tension (grief and disgust, despair and restraint, idealising and condemning).
        Row B Evidence and Commentary (0-4): 1 = summary or a list of quotations with little explanation. 2 = some relevant evidence (e.g. the garden image, the Hyperion line) with commentary that names devices but does not explain how they show complexity. 3 = specific evidence from several parts of the passage (the opening wish, the garden, the contrast, the dashes and shrinking time, the apostrophe to Frailty or the Niobe allusion) with commentary that explains how each technique conveys a part of his response and builds a line of reasoning. 4 = all of that, consistently explaining how the techniques interact: for instance, how the syntax enacts the obsession the imagery describes, or how the idealised father makes the mother's "appetite" more repellent.
        Row C Sophistication (0-1): 1 for a complex understanding, such as seeing that the speech's excess (a whole sex condemned) reveals Hamlet as much as Gertrude, placing the soliloquy against Claudius's balanced court speech, or noting that the speech ends in silence before revenge has even been asked of him.
