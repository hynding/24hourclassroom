      prompt: |
        True or false: in 1.5 the Ghost commands Hamlet to take revenge on both Claudius and Gertrude.
      answer: false
      explanation: |
        False. The Ghost demands revenge for his murder on Claudius but tells Hamlet not to act against his mother: "Leave her to heaven." The limit sharpens Hamlet's conflict, since he must punish one partner in the marriage and spare the other. Spiral review of conflict (3.F).

