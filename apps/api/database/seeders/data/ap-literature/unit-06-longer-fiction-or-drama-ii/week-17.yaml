      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Marcellus's line "Something is rotten in the state of Denmark" (1.4.100), spoken on the cold battlements as Hamlet follows the Ghost, uses the setting chiefly to suggest that
      options:
        - "the castle's food supplies have spoiled during the siege"
        - "the sickness is public and political as well as private: “state” means both the nation and its condition, and an ordinary soldier can sense it"
        - "Denmark is a peaceful, healthy country disturbed only by Hamlet's mood"
        - "the play will be set entirely outdoors"
      option_explanations:
        - |
          There is no siege, and "rotten" is figurative. A literal reading misses the pun on "state."
        - |
          Correct. "State" is both the kingdom and its condition. Because the judgment comes from Marcellus, an officer outside the royal family, the rot belongs to Denmark itself and is not only Hamlet's private grievance.
        - |
          The armed watch, the war preparations reported in 1.1 and the Ghost all show a disturbed country before Hamlet ever speaks.
        - |
          Most of the play happens indoors at court; the battlements frame the supernatural scenes.
      answer: 1
      explanation: |
        Spiral review of the function of setting (2.B). The night watch, the cold and the Ghost on the battlements build the feeling that the whole country is unwell.

    - slug: u06-w17-q14
      type: multiple_choice
      topic_code: "1.A"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Polonius ends his advice to Laertes (1.3) with "This above all,—to thine own self be true; / And it must follow, as the night the day, / Thou canst not then be false to any man." Taken with the rest of the speech and the scene, the advice best reveals Polonius as
      options:
        - "a deep philosopher whose wisdom the play fully endorses"
        - "a fluent dispenser of prudent maxims, more concerned with appearances and self-interest than his lofty final line suggests"
        - "a father indifferent to his son's welfare"
        - "a secret enemy of the King"
      option_explanations:
        - |
          The play frames the speech ironically: it is a string of rules about money, dress and caution, and in the same scene Polonius treats Ophelia's feelings as a matter of family reputation.
        - |
          Correct. The precepts are mostly worldly prudence (guard your tongue, dress well, do not lend). The famous last line sounds noble, but in context it reads as self-protection, from a man who will soon arrange to spy on his own son.
        - |
          He plainly cares for Laertes; he gives him a blessing and advice. The question is what kind of care it is.
        - |
          Polonius is the King's loyal counsellor throughout.
      answer: 1
      explanation: |
        Spiral review of what details reveal about a character (1.A). Read the line in its speech and its scene, not as a stand-alone motto.

