    - slug: u06-w17-q18
      type: short_answer
      topic_code: "7.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 2
      prompt: |
        In one or two sentences, write a defensible thesis about how Act I, scene 2 uses the contrast between Claudius's public address and Hamlet's soliloquy to shape the audience's view of the Danish court.
      answer: |
        By following Claudius's polished, balanced speech to the court with Hamlet's broken, disgusted soliloquy, Shakespeare teaches the audience to distrust the court's public surfaces before the Ghost ever confirms a crime: the smooth verse that makes a hasty marriage sound orderly is exactly what Hamlet's private speech exposes as corrupt.
      explanation: |
        2 points: 1 for a defensible interpretive claim (not a summary of the scene, not a mere statement that a contrast exists); 1 for a claim that names both sides of the contrast and what the contrast does to the audience's judgment (a line of reasoning). Spiral review of thesis writing (7.B).

    - slug: u06-w17-q19
      type: short_answer
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 3
      prompt: |
        Hamlet tells his mother that he knows "not seems" (1.2), and in 1.5 he tells Horatio he may "put an antic disposition on." In two or three sentences, explain the complexity these two statements create in Hamlet and its function in the play.
      answer: |
        Hamlet scorns performance, insisting that his grief is real and his clothes only "the trappings and the suits of woe," yet once he learns of the murder he chooses performance as his weapon. The contradiction makes him both the play's great truth-teller and its most skilled actor, and it forces the audience, like the court, to keep asking whether a given speech of his is sincere or a role.
      explanation: |
        3 points: 1 for accurately stating both positions (contempt for "seeming"; a decision to feign); 1 for naming the complexity (the enemy of pretence adopts pretence; sincerity and performance in one man); 1 for the function (it makes his "madness" ambiguous, drives the question of what is real, or ties him to the play's appearance-and-reality contrast).

