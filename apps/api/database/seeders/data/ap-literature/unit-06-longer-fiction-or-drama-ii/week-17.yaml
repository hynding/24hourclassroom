guide_description: |
  How to read a play when there is no narrator: soliloquy, aside, blank verse and prose, and what a character's own
  choices and speech reveal (1.E). Act I scene by scene, the contrasts the play is built on (the two kings, the court's
  celebration and Hamlet's black, "seems" and "is"), worked readings of the first soliloquy, a model paragraph, and
  a note on why line numbers differ between editions.
flashcards_description: |
  32 cards on Act I: the characters, the dramatic conventions you will meet all unit, and the speeches and contrasts
  that set up the tragedy.

flashcards:
  - front: Hamlet → the three early texts
    back: |
      The First Quarto (Q1, 1603), a short and garbled version; the Second Quarto (Q2, 1604-05), the longest; and the First Folio (F, 1623). Most modern editions, including Project Gutenberg's and the Folger, combine Q2 and F, which is why passages and line numbers differ from edition to edition.
    topic_code: "3.A"
  - front: Why do Hamlet line numbers differ between editions?
    back: |
      Each edition chooses its own readings from Q2 and the Folio and numbers lines its own way, and prose lines are counted by the printed line, which depends on page width. This course quotes Project Gutenberg's text (#1524), which has no line numbers, and cites act.scene.line as numbered in the Folger edition.
    topic_code: "3.A"
  - front: Soliloquy (drama) → definition and what it lets the audience know
    back: |
      A speech a character delivers alone on stage (or believing no one listens), thinking aloud. By convention it gives the audience the character's private reasoning and feeling, though a speaker can still deceive himself. Hamlet's first, "O that this too too solid flesh would melt," comes in 1.2 once the court exits.
    topic_code: "1.E"
  - front: Aside (drama) → definition, with Hamlet's first line as the example
    back: |
      A short remark the audience hears but the other characters on stage, by convention, do not. Many editions mark Hamlet's first line, "A little more than kin, and less than kind" (1.2.67), as an aside: a private jab at Claudius delivered in front of the whole court.
    topic_code: "1.E"
  - front: Blank verse → definition and who speaks it in Hamlet
    back: |
      Unrhymed iambic pentameter: ten syllables, five stresses, unrhymed. It is the play's norm for serious and public speech: Claudius's court address, the Ghost, Hamlet's soliloquies.
    topic_code: "3.D"
  - front: Verse vs prose in Hamlet → what a switch signals
    back: |
      Shakespeare moves into prose for informal talk, comedy, servants and gravediggers, letters, and Hamlet's "antic" madness. A character who drops from verse into prose (or rises from prose into verse) is changing register, and the change is evidence about his state or his audience.
    topic_code: "3.D"
  - front: Rhymed couplet at the end of a scene → its job
    back: |
      A pair of rhyming lines that rounds off a scene or speech, like a full stop the audience can hear. Act I's comes as Hamlet takes up the Ghost's command: "The time is out of joint:—O cursed spite, / That ever I was born to set it right!"
    topic_code: "3.D"
  - front: Claudius → who he is in Act I
    back: |
      Old Hamlet's brother, now King of Denmark and husband of Gertrude. His first speech (1.2.1-14) is smooth, balanced public verse that turns a funeral and a hasty marriage into one orderly occasion. The Ghost names him as the murderer in 1.5.
    topic_code: "1.A"
  - front: Gertrude → her position at the start of the play
    back: |
      Hamlet's mother, widow of Old Hamlet, married to Claudius within two months of the funeral. In 1.2 she urges Hamlet to "cast thy nighted colour off" and stop seeking his father "in the dust." The Ghost tells Hamlet to leave her "to heaven."
    topic_code: "1.A"
  - front: Horatio → his function in the play
    back: |
      Hamlet's friend from the university at Wittenberg, a skeptic who sees the Ghost and believes. He is the one character Hamlet trusts completely, a steady foil to Hamlet's turbulence and, at the end, the survivor charged to tell the story.
    topic_code: "1.C"
  - front: Polonius → who he is
    back: |
      The King's chief counsellor, father of Laertes and Ophelia. In Act I he gives Laertes a string of maxims and orders Ophelia to stop seeing Hamlet; he trusts his own reading of people more than the evidence warrants.
    topic_code: "1.A"
  - front: Laertes → why he matters from Act I on
    back: |
      Polonius's son, who asks Claudius's leave to return to France and gets it, while Hamlet is refused leave to return to Wittenberg. Later he will be a second son avenging a father, a foil to Hamlet.
    topic_code: "1.C"
  - front: Ophelia → her position in Act I
    back: |
      Polonius's daughter, courted by Hamlet. Her brother and father both warn her against him, and she answers her father, "I shall obey, my lord." Her obedience will make her an instrument of other people's plans.
    topic_code: "1.A"
  - front: Fortinbras → the background in Act I
    back: |
      Prince of Norway, whose father Old Hamlet killed in single combat. In 1.1 Horatio reports that young Fortinbras is gathering men to win back the lost lands: another son with a dead father, introduced before we meet Hamlet.
    topic_code: "3.D"
  - front: Act I, scene 1 → what happens and why it opens the play
    back: |
      Sentries on the battlements at midnight, a ghost in the dead King's armour, Horatio's account of the Norway quarrel. It opens on a challenge, "Who's there?", and the whole play keeps asking who people really are.
    topic_code: "3.A"
  - front: "“Who’s there?” → why it is a fitting first line"
    back: |
      The sentry Barnardo asks it of the man he is coming to relieve, the wrong way round, since the guard on duty should challenge. The nervous inversion sets the mood, and the question of identity runs through the play.
    topic_code: "3.D"
  - front: Act I, scene 2 → the contrast it stages
    back: |
      A full, festive court, with Claudius doing state business in confident verse, and Hamlet in black, speaking little and in quibbles. When the court leaves, he is alone and the first soliloquy reveals what the public scene concealed.
    topic_code: "3.D"
  - front: "“Seems, madam! Nay, it is; I know not seems.” → what it reveals"
    back: |
      Hamlet insists his grief is real, not a display: his black clothes and tears "are actions that a man might play," but he has "that within which passeth show." The irony is that this man will soon choose to put on a performance himself.
    topic_code: "1.E"
  - front: "“Hyperion to a satyr” → the contrast"
    back: |
      Hamlet compares his father to Claudius as the sun god to a lustful half-goat creature. The image ranks the two kings as god and beast and shows how completely Hamlet's grief has hardened into contempt.
    topic_code: "3.D"
  - front: "“’tis an unweeded garden, / That grows to seed” → the metaphor"
    back: |
      The world, and implicitly Denmark, is a neglected garden taken over by "things rank and gross." Gardens and gardeners stand for rule and order; the image of rot and weeds will recur all play.
    topic_code: "6.B"
  - front: "“Frailty, thy name is woman!” → what it shows about Hamlet"
    back: |
      An apostrophe that turns one woman's choice into a verdict on all women. It shows his grief turning into disgust, and it anticipates how harshly he will treat Ophelia and Gertrude.
    topic_code: "1.E"
  - front: Niobe → the allusion in the first soliloquy
    back: |
      In Greek myth Niobe wept for her slain children until she was turned to stone that still ran with water. Hamlet says Gertrude followed the coffin "Like Niobe, all tears," which makes her quick remarriage look all the more grotesque.
    topic_code: "6.D"
  - front: "“But break my heart,—for I must hold my tongue!” → the choice it records"
    back: |
      The last line of the first soliloquy: Hamlet decides to keep silent at court. Before the Ghost appears, his first choice is concealment, which sets up the gap between what he says in public and what he says alone.
    topic_code: "1.E"
  - front: Act I, scene 3 → Polonius's household
    back: |
      Laertes warns Ophelia that Hamlet's love cannot last; Polonius blesses Laertes with maxims ("Neither a borrower nor a lender be"; "to thine own self be true"); then he orders Ophelia to stop seeing Hamlet. A family that mirrors and contrasts with Hamlet's.
    topic_code: "3.D"
  - front: "“This above all,—to thine own self be true” → in context"
    back: |
      Polonius's parting advice to Laertes. It sounds wise, but it comes at the end of a list of prudent rules about appearances, from a man who will spy on his own son in Act II. Its context makes it ironic.
    topic_code: "1.A"
  - front: "“Something is rotten in the state of Denmark.” → who says it, and why that matters"
    back: |
      Marcellus, an ordinary officer of the watch, in 1.4. The judgment comes from outside the royal family, so the rot is not only Hamlet's private grievance: the political "state" and the moral state are sick together.
    topic_code: "2.B"
  - front: The Ghost's charge in Act I, scene 5
    back: |
      The Ghost says Claudius murdered him by pouring poison in his ear as he slept in his orchard, and seduced Gertrude. He commands "Revenge his foul and most unnatural murder," orders Hamlet not to harm his mother, and leaves with "Remember me."
    topic_code: "3.F"
  - front: "“one may smile, and smile, and be a villain” → the contrast it states"
    back: |
      Hamlet writes it in his "tables" after the Ghost's revelation (1.5). Appearance and reality can be opposites: the smiling King is a murderer. The line gives the play's central contrast in one sentence.
    topic_code: "3.D"
  - front: "“To put an antic disposition on” → Hamlet's choice"
    back: |
      In 1.5 he warns Horatio and Marcellus that he may choose to act strangely, "antic" meaning grotesque or clownish. He deliberately takes up a performance of madness, so from now on the audience must judge how much is acted.
    topic_code: "1.E"
  - front: "“The time is out of joint:—O cursed spite, / That ever I was born to set it right!” → what the couplet reveals"
    back: |
      The time is a dislocated bone and Hamlet the one who must set it. He accepts the task and resents it in the same breath, so his ambivalence is on record before Act II.
    topic_code: "1.E"
  - front: Swearing on the sword (1.5) → the staging
    back: |
      Hamlet makes Horatio and Marcellus swear secrecy on his sword hilt (a cross) while the Ghost, speaking from beneath the stage (Hamlet calls him "this fellow in the cellarage"), keeps crying "Swear." The Elizabethan stage had a trapdoor and an understage, and the voice from below adds to the uncanny effect.
    topic_code: "2.A"
  - front: Act I in one sentence (plot order)
    back: |
      A ghost appears (1.1); the new King and the grieving Prince are shown in contrast (1.2); Polonius's family is set beside Hamlet's (1.3); the Ghost reveals murder and demands revenge (1.4-1.5); Hamlet swears to it and chooses to feign madness.
    topic_code: "3.A"

quiz:
  description: |
    22 questions · about 40 minutes · about 55% this week (Act I: Hamlet's choices and speech, the contrasts the act is
    built on, soliloquy and aside) and 45% review: metaphor, allusion, structure, word choice, setting, conflict, the
    speaker, and thesis and evidence from earlier units. Multiple choice, select-all and true/false items are graded at
    once and the fill-in-the-blank items are matched automatically; the two short answers and the essay are graded by
    your teacher against the scoring guide.
  questions:
    # ---- Passage set: the first soliloquy, 1.2.133-153
    - slug: u06-w17-q01
      type: multiple_choice
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: &sol1 |
        *The following passage is from William Shakespeare's* Hamlet *(c. 1600), Act 1, scene 2 (lines 133-153 in the Folger edition; line numbers differ between editions). The text is Project Gutenberg's. Claudius has just denied Hamlet leave to return to university, and the court has left the stage; Hamlet is alone. Bracketed numbers count the lines of this excerpt.*

        HAMLET.
        O that this too too solid flesh would melt,
        Thaw, and resolve itself into a dew!
        Or that the Everlasting had not fix’d
        His canon ’gainst self-slaughter! O God! O God!
        How weary, stale, flat, and unprofitable     [5]
        Seem to me all the uses of this world!
        Fie on’t! O fie! ’tis an unweeded garden,
        That grows to seed; things rank and gross in nature
        Possess it merely. That it should come to this!
        But two months dead!—nay, not so much, not two:     [10]
        So excellent a king; that was, to this,
        Hyperion to a satyr; so loving to my mother,
        That he might not beteem the winds of heaven
        Visit her face too roughly. Heaven and earth!
        Must I remember? Why, she would hang on him     [15]
        As if increase of appetite had grown
        By what it fed on: and yet, within a month,—
        Let me not think on’t,—Frailty, thy name is woman!—
        A little month; or ere those shoes were old
        With which she followed my poor father’s body     [20]
        Like Niobe, all tears;—why she, even she,—
      prompt: |
        In lines 1-4, Hamlet's wishes reveal him to be
      options:
        - "resolved to kill himself, and held back only by fear of what other people would think"
        - "longing to cease to exist, but restrained by a religious law he still acknowledges"
        - "planning revenge on Claudius and searching for a method"
        - "confident that his grief will soon pass, like dew that evaporates in the sun"
      option_explanations:
        - |
          He wishes, he does not resolve: "O that ... would melt" and "Or that ... had not fix’d" are both wishes. And the restraint he names is God's "canon ’gainst self-slaughter," not public opinion.
        - |
          Correct. He wishes his flesh would "melt," "thaw" and "resolve itself into a dew," that is, simply stop being, and in the next breath regrets that "the Everlasting" has forbidden suicide. The wish and the restraint arrive together, a first view of his divided mind.
        - |
          In this soliloquy Hamlet has not yet met the Ghost and knows of no murder; revenge enters the play in 1.5. Here his grief is about his father's death and his mother's remarriage.
        - |
          The dew image is about dissolving his own body, not about his grief fading. The lines that follow ("How weary, stale, flat") show no confidence that anything will pass.
      answer: 1
      explanation: |
        A 1.E item: the speech is Hamlet's own words, and the grammar (wishes, not decisions) is part of the evidence. Note what he wants and what he will not let himself do.

    - slug: u06-w17-q02
      type: multiple_choice
      topic_code: "6.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *sol1
      prompt: |
        The metaphor in lines 7-9 ("’tis an unweeded garden ... Possess it merely") primarily serves to
      options:
        - "suggest that Denmark's real trouble is a poor harvest and a coming famine"
        - "present the world as a neglected garden overrun by gross growth, so that Hamlet's disgust takes the form of corruption and decay"
        - "recall the happy gardens of Hamlet's childhood, in contrast to his present misery"
        - "show that Hamlet blames himself for neglecting his duties as a prince"
      option_explanations:
        - |
          The garden is figurative; the speech is about "the uses of this world," not agriculture. Reading the metaphor literally misses its tenor.
        - |
          Correct. The world (tenor) is a garden (vehicle) left unweeded, gone "to seed," held "merely" (entirely) by "things rank and gross." The image turns his weariness into disgust at corruption, and it prepares for Denmark as a place where something is "rotten."
        - |
          There is no memory of a happy garden here; the garden is the present world, already overgrown. The contrast with the past comes later, through the image of the "excellent king."
        - |
          Nobody in the image is blamed for failing to weed, least of all Hamlet. The disgust is turned outward, at the world and soon at his mother.
      answer: 1
      explanation: |
        Spiral review of metaphor (6.B). Name the tenor and the vehicle, then say what the vehicle's details (unweeded, seed, rank, gross) make you feel about the tenor.

    - slug: u06-w17-q03
      type: multiple_choice
      topic_code: "3.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *sol1
      prompt: |
        The comparison in lines 11-12 ("that was, to this, / Hyperion to a satyr") functions chiefly to
      options:
        - "suggest that Hamlet's father, like a god, was distant and cold toward his family"
        - "set the dead king and the living one at opposite ends of a scale, divine radiance against animal lust, so that Gertrude's choice looks like a fall"
        - "show that Hamlet admires Claudius's energy, as the satyr is a lively figure"
        - "indicate that Hamlet sees both kings as figures of myth rather than as real men"
      option_explanations:
        - |
          The very next lines show the father as tender toward Gertrude, so protective that he would not let the winds "Visit her face too roughly." The god comparison is praise, not coldness.
        - |
          Correct. Hyperion, the sun god, and the satyr, a lecherous goat-legged creature, are opposite extremes. The contrast ranks the brothers as god and beast and makes the marriage a descent, which is why Hamlet goes on to attack his mother's "appetite."
        - |
          A satyr in classical myth is lustful and bestial; "this" is said with contempt. Nothing here admires Claudius.
        - |
          The mythic figures are vehicles for a judgment of real men. The point is the gap between them, not that both are unreal.
      answer: 1
      explanation: |
        A 3.D contrast item. Ask what each side of the contrast stands for and what the gap between them makes the audience think, here about Gertrude as much as about either king.

    - slug: u06-w17-q04
      type: multiple_choice
      topic_code: "3.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *sol1
      prompt: |
        Which best describes the effect of the dashes and self-corrections in lines 10-21 ("But two months dead!—nay, not so much, not two" ... "within a month,— / Let me not think on’t")?
      options:
        - "They show Hamlet calmly checking his facts so that his account will be accurate."
        - "They mimic a mind that keeps returning to what it cannot bear, shrinking the interval each time and breaking off when the thought becomes too painful."
        - "They signal that another character is interrupting Hamlet."
        - "They indicate that the speech was left unfinished by the printer."
      option_explanations:
        - |
          The corrections do not make him calmer or more precise; the time shrinks with each repetition ("two months," "not two," "a month," "A little month") as his outrage grows.
        - |
          Correct. The structure of the sentences acts out his state: he starts, corrects, repeats, then breaks off ("Let me not think on’t") only to return to the same subject. The time keeps shrinking while his feeling grows.
        - |
          Hamlet is alone, the court has left. The interruptions come from within.
        - |
          The passage's broken syntax is a deliberate dramatic effect; the speech continues past this excerpt to its last line.
      answer: 1
      explanation: |
        Spiral review of structure (3.C). In verse drama, syntax is structure: where sentences break, repeat or refuse to finish, ask what state of mind the pattern enacts.

    - slug: u06-w17-q05
      type: multiple_choice
      topic_code: "5.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *sol1
      prompt: |
        In context, the exclamation "Frailty, thy name is woman!" (line 18) primarily serves to
      options:
        - "praise women for their gentleness and capacity for grief"
        - "show Hamlet generalising from his mother's remarriage to a condemnation of all women, a sign of how his grief has curdled"
        - "introduce Ophelia, whose name is mentioned for the first time"
        - "state a view of women that every character in Act I shares"
      option_explanations:
        - |
          "Frailty" here means moral weakness and inconstancy. The line is an accusation, as the surrounding attack on Gertrude's "appetite" makes clear.
        - |
          Correct. By addressing Frailty as if "woman" were its name, Hamlet turns one woman's choice into a law of nature. The overreach tells us about the speaker, and it anticipates the way he will treat Ophelia.
        - |
          Ophelia is not mentioned in this soliloquy; she first appears in 1.3. The "woman" here is Gertrude, generalised.
        - |
          Hamlet says it alone, and it is his own judgment. Laertes and Polonius warn Ophelia in 1.3 about Hamlet, not about women's frailty.
      answer: 1
      explanation: |
        Spiral review of word function (5.B). The words "name" and "woman" turn a specific grievance into a universal claim; explain what that move reveals about the speaker.

    - slug: u06-w17-q06
      type: multi_select
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 2
      partial_credit: true
      stimulus: *sol1
      prompt: |
        Select the TWO details from the passage that most directly show that Hamlet's revulsion is aimed at his mother's conduct as well as at the world in general.
      options:
        - "“How weary, stale, flat, and unprofitable / Seem to me all the uses of this world!” (lines 5-6)"
        - "“she would hang on him / As if increase of appetite had grown / By what it fed on” (lines 15-17)"
        - "“O that this too too solid flesh would melt” (line 1)"
        - "“A little month; or ere those shoes were old / With which she followed my poor father’s body” (lines 19-20)"
      option_explanations:
        - |
          This is the general weariness with "this world," the starting point of the speech. It names no person, so it is not the best evidence for revulsion at Gertrude in particular.
        - |
          Correct. Hamlet remembers Gertrude's love for his father as an "appetite" that grew by feeding, which makes her love seem physical and greedy and so explains, in his mind, why she remarried.
        - |
          This line is about Hamlet's own body and his wish to dissolve; it does not address his mother.
        - |
          Correct. The shoes she wore to the funeral were not yet worn out when she remarried. The everyday detail measures the indecent speed of the marriage.
      answer: [1, 3]
      explanation: |
        A 1.E evidence item. Pick the lines where Hamlet's speech names or pictures Gertrude, not the lines of general despair.

    - slug: u06-w17-q07
      type: true_false
      topic_code: "4.A"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *sol1
      prompt: |
        True or false: because Hamlet speaks this passage alone on stage, the dramatic convention invites the audience to take it as his private thinking, not as a performance put on for another character.
      answer: true
      explanation: |
        True. A soliloquy is spoken alone, so by convention it gives us the speaker's own mind. That does not make every judgment in it fair, since Hamlet's verdict on "woman" is clearly excessive. But it is sincere: he is not trying to manipulate a listener. Spiral review of identifying the speaker (4.A).

    - slug: u06-w17-q08
      type: fill_blank
      topic_code: "6.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *sol1
      prompt: |
        In line 21 Hamlet says his mother followed the coffin "Like ____, all tears," alluding to the mother in Greek myth who wept for her children until she turned to stone.
      answer: ["Niobe"]
      explanation: |
        Niobe. The allusion casts Gertrude as the ultimate image of maternal grief, which makes her remarriage within a month look grotesque. Spiral review of allusion (6.D).

    # ---- Act I beyond the soliloquy
    - slug: u06-w17-q09
      type: multiple_choice
      topic_code: "3.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        In his first speech to the court (1.2), Claudius says he has taken Gertrude to wife "With mirth in funeral, and with dirge in marriage, / In equal scale weighing delight and dole." The paired opposites in these lines chiefly serve to
      options:
        - "express sincere confusion about whether he should be happy or sad"
        - "balance grief and celebration so smoothly that a hasty, troubling marriage sounds orderly and reasonable"
        - "reveal openly to the court that he murdered his brother"
        - "mock Gertrude for mourning too long"
      option_explanations:
        - |
          The verse is controlled and deliberate, not confused; Claudius is managing the court's response, not exploring his feelings.
        - |
          Correct. Each opposite is weighed against the other "In equal scale," as if a funeral and a wedding could simply cancel out. The polish of the rhetoric is the point: Claudius makes the unseemly sound balanced, and Hamlet's soliloquy later in the scene contradicts every word.
        - |
          Nothing in the public speech admits guilt; the murder is revealed only by the Ghost in 1.5. The smoothness is what should make an audience wary.
        - |
          Claudius praises and claims Gertrude ("our sometime sister, now our queen") and never suggests she grieved too long. That complaint is Hamlet's, made the other way round.
      answer: 1
      explanation: |
        A 3.D item: contrast inside a speech (mirth and dirge) and the larger contrast between this public speech and the private soliloquy that follows it.

    - slug: u06-w17-q10
      type: multiple_choice
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        To his mother in 1.2 Hamlet says, "Seems, madam! Nay, it is; I know not seems," adding that his black clothes and tears "are actions that a man might play; / But I have that within which passeth show." This claim becomes most complex later in Act I when Hamlet
      options:
        - "agrees to stay at the Danish court instead of returning to Wittenberg"
        - "announces that he may choose to “put an antic disposition on,” that is, to act a part"
        - "asks Horatio to describe the Ghost's armour"
        - "warns Ophelia that she should not trust Laertes"
      option_explanations:
        - |
          Staying is obedience, not performance. It does not complicate his distinction between seeming and being.
        - |
          Correct. The man who says he knows "not seems" and despises "actions that a man might play" decides to play a role himself. The contradiction is a complexity created by his own speech and choice, and it makes the audience ask how much of his later madness is acted.
        - |
          The questions about the armour are part of testing Horatio's report; they show curiosity and caution, not a contradiction of the "seems" speech.
        - |
          No such warning occurs; in 1.3 it is Laertes who warns Ophelia about Hamlet.
      answer: 1
      explanation: |
        1.E asks how a character's own words and choices create complexity. Put two of Hamlet's statements side by side and explain the tension between them.

    - slug: u06-w17-q11
      type: multiple_choice
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Hamlet's first words in the play, "A little more than kin, and less than kind" (1.2.67), are marked in many editions as an aside. Which best explains what the line reveals?
      options:
        - "Hamlet's warm acceptance of Claudius as a new father"
        - "Hamlet's hostility, compressed into a pun and kept from the court: Claudius is now doubly related to him (uncle and stepfather) but neither natural nor kindly toward him"
        - "Hamlet's confusion about who the new king is"
        - "Hamlet's suspicion, already confirmed, that Claudius murdered his father"
      option_explanations:
        - |
          The line rejects Claudius's "my cousin Hamlet, and my son"; "less than kind" is a refusal, not acceptance.
        - |
          Correct. "Kin" and "kind" play against each other: "kind" means both of the same nature (family) and benevolent. Spoken aside, the jab lets the audience into Hamlet's hostility while the court sees only a silent prince in black.
        - |
          Hamlet knows exactly who Claudius is; the pun depends on knowing the double relationship.
        - |
          At this point Hamlet has no knowledge of murder; the Ghost has not yet spoken to him. His hostility comes from the hasty marriage.
      answer: 1
      explanation: |
        An aside is a window the convention opens for the audience alone. Ask what the character can say there that he cannot say aloud, and why.

    - slug: u06-w17-q12
      type: multiple_choice
      topic_code: "3.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        After the Ghost leaves him in 1.5, Hamlet writes in his tables "That one may smile, and smile, and be a villain" The line most directly connects to which contrast running through Act I?
      options:
        - "the contrast between Denmark and Norway as military powers"
        - "the contrast between outward appearance and inward reality, between the gracious king of 1.2 and the murderer the Ghost describes"
        - "the contrast between night scenes and day scenes"
        - "the contrast between Laertes and Polonius as speakers"
      option_explanations:
        - |
          The Norway threat is real background, but this line is about a person whose face hides his deeds.
        - |
          Correct. The smiling, courteous King of 1.2 is, the Ghost says, a murderer. The line restates the "seems" and "is" contrast as a rule about the world, and Hamlet will spend the play testing whether it is true of Claudius.
        - |
          Act I does alternate night and day scenes, but the line is about faces and deeds, not lighting or time.
        - |
          Polonius and Laertes differ, but nothing in the line refers to them; the "villain" is Claudius.
      answer: 1
      explanation: |
        3.D: a single sentence can name the contrast a whole play is built on. Trace it back through 1.2 (Claudius's speech, Hamlet's "Seems") to see how the act prepared it.

    - slug: u06-w17-q13
      type: multiple_choice
