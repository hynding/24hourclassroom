week: 19
unit: 6
title: Hamlet, Act III · The Mousetrap and Its Consequences
topics: ["5.C", "3.B"]
texts:
  - author: William Shakespeare
    title: Hamlet, Prince of Denmark (written c. 1600; First Quarto 1603, Second Quarto 1604-05, First Folio 1623), Act III (Project Gutenberg #1524, the text quoted in this course)
    year: 1603
    url: https://www.gutenberg.org/ebooks/1524
  - author: William Shakespeare
    title: Hamlet, Folger Shakespeare reading edition (Act 3; source of this course's line numbers, not of its quotations)
    year: 1603
