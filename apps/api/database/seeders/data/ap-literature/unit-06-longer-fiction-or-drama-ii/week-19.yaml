    - slug: u06-w19-q22
      type: long_answer
      topic_code: "3.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 4
      prompt: |
        Write one well-developed analytical paragraph. Explain how the order of three events in Act III (the Mousetrap in 3.2, the prayer scene in 3.3 and the killing of Polonius in 3.4) shapes the audience's understanding of Hamlet. Use specific evidence from each scene.
      answer: |
        Claim: The sequence of Act III turns Hamlet's triumph into catastrophe in three steps, showing that his trouble is not lack of proof or will but the gap between deliberation and impulse. The Mousetrap gives him the certainty he wanted (he will "take the ghost’s word for a thousand pound"), so by 3.3 delay cannot be blamed on doubt. When he finds Claudius kneeling, he thinks too far ahead, sparing him for a worse damnation, and the couplet after his exit ("Words without thoughts never to heaven go") shows the reasoning was based on a false appearance. Minutes later, with no time to think, he stabs through the arras at a voice and kills Polonius. Placed in this order, the scenes show that Hamlet cannot kill when he deliberates and kills the wrong man when he does not, and the impulsive act brings on the consequences (exile, Ophelia's madness, Laertes's vengeance) that will destroy him.
      explanation: |
        4 points. 1: a defensible claim about what the sequence shows (not a summary of the three scenes). 1: accurate, specific evidence from all three scenes (quotation or precise reference). 1: commentary that explains the causal or ironic links between the scenes (certainty removes the excuse of doubt; a false appearance governs the spared killing; impulse produces the wrong one). 1: a closing insight into what the order reveals about Hamlet or the tragedy (deliberation against impulse, the reversal, the consequences set in motion).
