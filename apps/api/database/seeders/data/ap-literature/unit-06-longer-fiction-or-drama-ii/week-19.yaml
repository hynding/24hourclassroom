guide: guides/week-19.md
guide_description: |
  The play's turning point read as a sequence (3.B): Claudius's aside, "To be, or not to be," the nunnery scene, the
  Mousetrap, the prayer scene and the killing of Polonius, and why their order matters. Symbols that carry the act
  (5.C): the play within the play, poison and the ear, the two portraits, the recorder. Worked readings, a model
  paragraph and the misreadings to avoid.
flashcards_description: |
  32 cards on Act III: the events in order and what each one causes, the conventions of the play within the play,
  and the symbols and speeches students are most often asked about.

flashcards:
  - front: Symbol (5.C) → how to tell one in a play
    back: |
      An object, image or action that carries meaning beyond itself and is weighted by repetition, placement or the characters' own attention. In *Hamlet* the play within the play, poison in the ear, the portraits and the recorder all work this way. Explain what it stands for and what it does at that point in the plot.
    topic_code: "5.C"
  - front: Sequence of events (3.B) → the question to ask
    back: |
      Why this order? What does the audience know at each step that a character does not, and how does one event make the next possible or ironic? Act III is the clearest case: Mousetrap, then prayer, then closet, each changing the meaning of the one before.
    topic_code: "3.B"
  - front: Claudius's aside in 3.1 → "How smart a lash that speech doth give my conscience!"
    back: |
      Provoked by Polonius's remark about sugaring over the devil with devotion, Claudius admits his guilt to the audience in an aside: his deed is as ugly beneath his "most painted word" as a harlot's cheek beneath make-up. The audience has confirmation of the murder before the Mousetrap.
    topic_code: "3.B"
  - front: Why place Claudius's aside before the Mousetrap?
    back: |
      Dramatic irony. We already know the Ghost told the truth, so during the play scene we watch Hamlet catch up with what we know. Suspense moves from "is Claudius guilty?" to "will Hamlet see it, and what will he do?"
    topic_code: "3.B"
  - front: "“To be, or not to be” → the question it asks"
    back: |
      Whether it is nobler to endure "the slings and arrows of outrageous fortune" or to "take arms" and end them, and whether death, a "sleep," would end suffering at all. Fear of "what dreams may come" makes us bear our ills.
    topic_code: "1.E"
  - front: "“To be, or not to be” → who is on stage"
    back: |
      Ophelia, placed with a book by Polonius, and, hidden, Polonius and Claudius. Hamlet seems not to notice her until the speech ends ("Soft you now! / The fair Ophelia!"). A soliloquy by convention, but one spoken in a room set up for spying.
    topic_code: "4.D"
  - front: "“we” and “us” in “To be, or not to be”"
    back: |
      Unlike Hamlet's other soliloquies, the speech never says "I" or names his father, Claudius or revenge. It generalises ("makes us rather bear those ills we have"), turning his crisis into everyone's. Thought abstracts itself from action.
    topic_code: "1.E"
  - front: "“The undiscover’d country, from whose bourn / No traveller returns” → the image"
    back: |
      Death as an unmapped land with a border (bourn) no one recrosses. The fear of it "puzzles the will." The audience may notice the irony that a traveller, the Ghost, has returned.
    topic_code: "5.C"
  - front: "“Thus conscience does make cowards of us all” → two meanings of conscience"
    back: |
      Moral scruple, and also consciousness or reflection. Both apply: thinking and fearing judgment drain "the native hue of resolution," so enterprises "lose the name of action." A diagnosis of Hamlet's delay in his own words.
    topic_code: "5.B"
  - front: "“Get thee to a nunnery.” → the scene"
    back: |
      Ophelia, set up by her father, returns Hamlet's gifts. Hamlet turns on her: "I did love you once," then "I loved you not," then the repeated command. He asks "Where’s your father?", which suggests he suspects the spying, and she lies that he is at home.
    topic_code: "1.D"
  - front: "“O, what a noble mind is here o’erthrown!” → Ophelia's soliloquy"
    back: |
      After Hamlet leaves, Ophelia mourns the courtier, soldier and scholar she knew. It is her only soliloquy, and it is about him, not herself; her own grief has no other outlet.
    topic_code: "1.D"
  - front: "“Madness in great ones must not unwatch’d go.” → Claudius's decision"
    back: |
      After overhearing the nunnery scene, Claudius rejects the love-madness theory and decides to send Hamlet to England. He is the shrewdest reader of Hamlet at court, because he has the most to fear.
    topic_code: "3.B"
  - front: Hamlet's advice to the players (3.2) → the key idea
    back: |
      Do not overact ("tear a passion to tatters") or underact; "suit the action to the word, the word to the action;" because the purpose of playing is "to hold, as ’twere, the mirror up to nature." Drama shows an age its own face.
    topic_code: "5.C"
  - front: "“Give me that man / That is not passion’s slave” → Hamlet on Horatio"
    back: |
      Hamlet praises Horatio as a man of balance whom fortune cannot play on, and asks him to watch the King during the play. Horatio's steadiness is set against Hamlet's turbulence.
    topic_code: "1.C"
  - front: The Murder of Gonzago → the play within the play
    back: |
      A play about the murder of a duke, Gonzago, by his kinsman Lucianus, who pours poison in the sleeping man's ears in a garden and then wins his wife. Hamlet has added lines and renames it "The Mouse-trap." It mirrors the Ghost's account of Claudius's crime.
    topic_code: "5.C"
  - front: Dumb show → what it is and what happens at the Mousetrap
    back: |
      A mimed scene before the spoken play, a convention of older drama. In 3.2 it shows the whole poisoning without words. Claudius makes no recorded reaction to it; he breaks only when Lucianus speaks and pours the poison.
    topic_code: "3.B"
  - front: The verse of the Mousetrap → why it sounds old-fashioned
    back: |
      The Player King and Queen speak in stiff rhymed couplets full of formal phrasing, unlike the blank verse around them. The contrast marks it as a play inside a play, from an older style of drama.
    topic_code: "3.D"
  - front: "“The lady protests too much, methinks.” → speaker and context"
    back: |
      Gertrude, watching the Player Queen vow never to remarry. "Protest" means vow or declare. Gertrude finds the vowing excessive, an unconscious comment on her own case, which Hamlet is pressing.
    topic_code: "1.D"
  - front: "“The Mouse-trap. Marry, how? Tropically.” → the title as symbol"
    back: |
      Hamlet's name for the play when Claudius asks. "Tropically" means figuratively (with a pun on "trap"). The play is a trap and the King the mouse: art as an instrument for catching the truth.
    topic_code: "5.C"
  - front: Claudius rises → the climax of the play scene
    back: |
      When Lucianus poisons the sleeper and Hamlet explains, "He poisons him i’ the garden for’s estate," the King rises. Hamlet: "What, frighted with false fire!" Claudius: "Give me some light:—away!" Court: "Lights, lights, lights!" The test has worked.
    topic_code: "3.B"
  - front: Poison in the ear → the symbol
    back: |
      The Ghost was killed by poison poured "in the porches of my ears," and says that "the whole ear of Denmark" has been "Rankly abus’d" by a false story of his death. Poisoned hearing runs through the play: lies, eavesdropping, rumours and the Mousetrap itself.
    topic_code: "5.C"
  - front: The recorder (3.2) → the symbol
    back: |
      Hamlet asks Guildenstern to play a pipe and he cannot. Hamlet: "You would play upon me; you would seem to know my stops; you would pluck out the heart of my mystery" (3.2.394-396 in the Folger numbering). The instrument stands for the self that spies try to play and cannot.
    topic_code: "5.C"
  - front: The prayer scene (3.3) → what Claudius admits
    back: |
      Alone, Claudius confesses: "O, my offence is rank, it smells to heaven." He cannot repent while he keeps what the murder won him, "My crown, mine own ambition, and my queen" (3.3.59 in the Folger numbering). His prayer fails.
    topic_code: "1.E"
  - front: Why does Hamlet spare Claudius at prayer?
    back: |
      He reasons that killing him at prayer would send him to heaven, while Old Hamlet died unprepared, so that would be "hire and salary, not revenge" (3.3.84 in the Folger numbering). He decides to wait for a moment when Claudius is sinning.
    topic_code: "3.B"
  - front: The irony that ends the prayer scene
    back: |
      Once Hamlet leaves, Claudius reveals that his prayer was empty: "My words fly up, my thoughts remain below: / Words without thoughts never to heaven go" (3.3.102-103 in the Folger numbering). Hamlet spared him for a repentance that was not happening.
    topic_code: "3.B"
  - front: The killing of Polonius (3.4) → "How now? a rat? Dead for a ducat, dead."
    back: |
      Hearing a cry behind the arras in his mother's room, Hamlet stabs through it. He has killed Polonius, not the King. The man who could not kill Claudius kneeling kills an unseen listener on impulse.
    topic_code: "3.B"
  - front: The two portraits (3.4) → the symbol
    back: |
      "Look here upon this picture, and on this,— / The counterfeit presentment of two brothers" (3.4.63-64 in the Folger numbering). Hamlet forces Gertrude to compare Old Hamlet and Claudius. The pictures carry Act I's god-and-beast contrast and make Gertrude look at what she chose.
    topic_code: "5.C"
  - front: The Ghost in the closet scene → who sees it
    back: |
      Only Hamlet. The Ghost comes "to whet thy almost blunted purpose" and to ask him to help his mother. Gertrude sees and hears nothing and thinks her son is mad. The Ghost's invisibility to her reopens the question of what is real.
    topic_code: "4.D"
  - front: "“I must be cruel, only to be kind.” → what it reveals"
    back: |
      Hamlet's justification for his harshness to Gertrude (3.4.199 in the Folger numbering). He casts himself as a healer who hurts to cure, a claim the audience may accept or see as self-justification after the killing.
    topic_code: "1.E"
  - front: Act III as the play's turning point
    back: |
      Every line of action changes: Hamlet has proof, Claudius knows Hamlet knows, Polonius is dead, Hamlet is to be sent to England. Up to the Mousetrap Hamlet investigates; after it, events control him.
    topic_code: "3.B"
  - front: Act III in one sentence (plot order)
    back: |
      Claudius's aside confirms his guilt; Hamlet meditates on being and rejects Ophelia while the King and Polonius watch (3.1); the Mousetrap exposes the King (3.2); Claudius fails to pray and Hamlet spares him (3.3); Hamlet kills Polonius and confronts his mother (3.4).
    topic_code: "3.A"
  - front: Arras → what it is and why it matters
    back: |
      A tapestry wall-hanging, behind which a person could hide. Polonius hides behind it twice, in effect: once to watch Hamlet and Ophelia, and once in Gertrude's room, where he dies. The court's habit of hidden listening finally costs a life.
    topic_code: "5.C"

quiz:
  description: |
    22 questions · about 40 minutes · about 55% this week (Act III: the order of events from Claudius's aside to the
    death of Polonius, and the symbols that carry the act) and 45% review: Hamlet's choices and speech, contrast,
    reliability, foils, metaphor and word choice. Multiple choice, select-all and true/false items are graded at once
    and the fill-in-the-blank items are matched automatically; the two short answers and the paragraph are graded by
    your teacher against the scoring guide.
  questions:
    # ---- Passage set: "To be, or not to be," 3.1.64-77 and 86-96
    - slug: u06-w19-q01
      type: multiple_choice
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: &tobe |
        *The following passage is from William Shakespeare's* Hamlet *(c. 1600), Act 3, scene 1 (lines 64-77 and 86-96 in the Folger edition; line numbers differ between editions). The text is Project Gutenberg's; [...] marks eight omitted lines. Polonius has placed Ophelia where Hamlet will find her, and he and the King have hidden to watch. Hamlet enters. Bracketed numbers count the lines of this excerpt.*

        HAMLET.
        To be, or not to be,—that is the question:—
        Whether ’tis nobler in the mind to suffer
        The slings and arrows of outrageous fortune
        Or to take arms against a sea of troubles,
        And by opposing end them?—To die,—to sleep,—     [5]
        No more; and by a sleep to say we end
        The heartache, and the thousand natural shocks
        That flesh is heir to,—’tis a consummation
        Devoutly to be wish’d. To die,—to sleep;—
        To sleep! perchance to dream:—ay, there’s the rub;     [10]
        For in that sleep of death what dreams may come,
        When we have shuffled off this mortal coil,
        Must give us pause: there’s the respect
        That makes calamity of so long life;
        [...]
        But that the dread of something after death,—     [15]
        The undiscover’d country, from whose bourn
        No traveller returns,—puzzles the will,
        And makes us rather bear those ills we have
        Than fly to others that we know not of?
        Thus conscience does make cowards of us all;     [20]
        And thus the native hue of resolution
        Is sicklied o’er with the pale cast of thought;
        And enterprises of great pith and moment,
        With this regard, their currents turn awry,
        And lose the name of action.     [25]
      prompt: |
        Unlike Hamlet's earlier soliloquies, this speech never says "I" and never mentions his father, Claudius or revenge; it speaks of "we" and "us." This choice primarily reveals
      options:
        - "that Hamlet has forgotten his mission and is thinking of something else entirely"
        - "a mind that turns its own crisis into a general question about human life, so that thinking about action replaces any particular action"
        - "that Hamlet knows he is overheard and is deliberately concealing his thoughts from the King"
        - "that Hamlet speaks for the whole Danish court, which shares his despair"
      option_explanations:
        - |
          The speech is plainly about his situation (suffering wrongs, taking arms, failing to act); it is the particulars that are missing, not the concern.
        - |
          Correct. Hamlet generalises: everyone suffers "the thousand natural shocks," everyone is made a coward by conscience. The abstraction is itself evidence: his habit of thought lifts the problem away from the deed it ought to lead to.
        - |
          Nothing in the speech or the scene shows that he knows he is overheard at this point; he notices Ophelia only at the end. The generality is more convincingly a habit of mind than a tactic.
        - |
          The court does not share his despair; Claudius and Polonius are busy managing him. "We" means human beings, not Danes.
      answer: 1
      explanation: |
        Spiral review of 1.E. A speaker's grammar is a choice. Ask what the pronouns include and leave out, and what that tells you about him.

    - slug: u06-w19-q02
      type: multiple_choice
      topic_code: "6.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *tobe
      prompt: |
        The metaphor "to take arms against a sea of troubles" (line 4) is often called mixed. Its effect in context is best described as
      options:
        - "a careless error that the rest of the speech corrects"
        - "an image of futility: armed resistance against a sea cannot win, so even the heroic option already looks hopeless or suicidal"
        - "a reference to a sea battle Hamlet has fought"
        - "an image of calm, suggesting that troubles pass like waves"
      option_explanations:
        - |
          The speech never corrects it, and its oddity is expressive. Treating it as a slip misses what the clash between "arms" and "sea" achieves.
        - |
          Correct. One cannot fight the sea; to take arms against it is to be drowned. The image makes resistance and death nearly the same thing, which leads straight into "To die,—to sleep."
        - |
          Hamlet has fought no sea battle; his sea voyage comes in Act IV and is reported in Act V. The sea here is figurative.
        - |
          A sea of troubles is overwhelming, not calm, and the speaker is armed against it.
      answer: 1
      explanation: |
        Spiral review of metaphor (6.B). When a metaphor seems illogical, ask what the illogic means.

    - slug: u06-w19-q03
      type: multiple_choice
      topic_code: "5.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *tobe
      prompt: |
        In lines 15-17, death is "The undiscover’d country, from whose bourn / No traveller returns." In the context of the whole play, the image functions to
      options:
        - "predict that Hamlet will travel to England"
        - "represent death as an unknown territory whose uncertainty paralyses the will, while reminding the audience, ironically, that one traveller, the Ghost, has returned"
        - "show that Hamlet is certain there is no afterlife"
        - "describe Denmark as a country no one has explored"
      option_explanations:
        - |
          The voyage to England is decided later and is a literal journey; the "country" here is death.
        - |
          Correct. The unmapped land stands for the afterlife. Not knowing what lies there "puzzles the will" and keeps us bearing known ills. Yet Hamlet has met a spirit who came back, so the image also shows how far the speech has drifted from his own experience.
        - |
          The speech fears "what dreams may come," which assumes something after death; the problem is uncertainty, not disbelief.
        - |
          The country is "undiscover’d" because no one returns from it; it is death, not Denmark.
      answer: 1
      explanation: |
        A 5.C item: an image that carries a larger idea (death as an unknown land) and gains meaning from the rest of the play.

    - slug: u06-w19-q04
      type: multiple_choice
      topic_code: "3.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *tobe
      prompt: |
        Lines 21-22 contrast "the native hue of resolution" with "the pale cast of thought." The contrast primarily suggests that
      options:
        - "resolve and thought are equally healthy, like two colours of one face"
        - "natural, ruddy resolve is made sickly and pale by reflection, so thinking appears as a disease of action"
        - "Hamlet prefers thought to action and is proud of it"
        - "painters use pale colours for serious subjects"
      option_explanations:
        - |
          "Sicklied o’er" makes the relation one of illness: thought infects resolve, it does not sit beside it.
        - |
          Correct. Resolution has a "native," healthy colour; thought casts a pale, sickly tint over it. The contrast of complexions makes reflection look like disease, the speech's diagnosis of why "enterprises" lose "the name of action."
        - |
          The speech laments the effect of thought, which turns great enterprises "awry"; it is not a boast.
        - |
          The colours are those of a face, healthy or sick, not of a painting.
      answer: 1
      explanation: |
        Spiral review of contrast (3.D). Name the two terms, what each stands for, and what the opposition implies.

    - slug: u06-w19-q05
      type: multiple_choice
      topic_code: "4.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *tobe
      prompt: |
        As the headnote explains, Ophelia is on stage and Claudius and Polonius are hiding as Hamlet speaks. Which statement best describes how this staging affects the speech?
      options:
        - "It makes the speech a lie, because Hamlet is performing for the King."
        - "Hamlet appears unaware of his listeners, so the speech works as a soliloquy, but the audience hears private thought in a room arranged for spying, which makes his inner life seem exposed."
        - "It means the speech is an aside to Ophelia."
        - "It has no effect, because hidden characters never matter in Shakespeare."
      option_explanations:
        - |
          Nothing in the speech or the scene shows that Hamlet knows the King is listening as he speaks; he notices only Ophelia, at the end. Calling it a lie goes beyond the evidence.
        - |
          Correct. By convention the speech gives us Hamlet's mind. The setup makes that privacy precarious: the King and Polonius are watching, though the speech gives them nothing concrete.
        - |
          An aside is a brief remark hidden from others on stage; this is a long meditation, and Hamlet addresses Ophelia only after it ("Soft you now").
        - |
          Hidden watchers are central to *Hamlet*; their presence here sets up Claudius's decision to send Hamlet away.
      answer: 1
      explanation: |
        Spiral review of reliability (4.D). The convention of the soliloquy and the staging of the scene pull in different directions; a good answer holds both.

    - slug: u06-w19-q06
      type: true_false
      topic_code: "3.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *tobe
      prompt: |
        True or false: the speech moves from a general question (lines 1-5) through a chain of reasoning about sleep, dreams and fear of the afterlife, to a conclusion about why people fail to act (lines 20-25).
      answer: true
      explanation: |
        True. It is built like an argument: the question, the attractive answer (death as sleep), the objection ("ay, there’s the rub"), and the conclusion ("Thus conscience does make cowards of us all"). The structure performs the habit it diagnoses. Spiral review of structure (3.C).

    - slug: u06-w19-q07
      type: fill_blank
      topic_code: "5.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *tobe
      prompt: |
        Line 20: "Thus ____ does make cowards of us all," a word that means both moral scruple and reflective awareness.
      answer: ["conscience"]
      explanation: |
        "Conscience." Both senses work: fear of judgment and the habit of reflection both drain resolution. Spiral review of word function (5.B).

    # ---- The sequence of Act III and its symbols
    - slug: u06-w19-q08
      type: multiple_choice
      topic_code: "3.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Early in 3.1, before the Mousetrap, Claudius says aside, "How smart a lash that speech doth give my conscience!" and compares his deed beneath his "most painted word" to a harlot's cheek beneath make-up. What is the chief effect of placing this aside here?
      options:
        - "It shows that Claudius plans to confess publicly."
        - "It confirms the Ghost's story for the audience before Hamlet has proof, so the Mousetrap becomes a scene of dramatic irony in which we watch Hamlet catch up."
        - "It makes the Mousetrap unnecessary, so Hamlet cancels it."
        - "It reveals that Polonius was the murderer."
      option_explanations:
        - |
          The aside is private, heard only by the audience; Claudius works hard to keep his guilt hidden.
        - |
          Correct. Once we hear the King admit his guilt, the question is no longer whether the Ghost told the truth but whether Hamlet will see it and what he will do. Placement turns suspense about facts into suspense about action.
        - |
          Hamlet cannot hear an aside; he goes ahead with the play in the next scene.
        - |
          Claudius's aside is about his own deed and his own conscience.
      answer: 1
      explanation: |
        A 3.B item: the function of where an event is placed in the sequence, and what the audience knows that the characters do not.

    - slug: u06-w19-q09
      type: multiple_choice
      topic_code: "5.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Asked the name of the play, Hamlet answers, "The Mouse-trap. Marry, how? Tropically." As a symbol, the play within the play chiefly represents
      options:
        - "the court's love of entertainment and nothing more"
        - "art as an instrument for catching hidden truth, holding “the mirror up to nature” so that a guilty spectator sees himself"
        - "Hamlet's wish to become a professional actor"
        - "the players' plan to rob the court"
      option_explanations:
        - |
          The court treats it as entertainment, but Hamlet has renamed it for its purpose; the title makes it a trap.
        - |
          Correct. "Tropically" (figuratively) tells us the play is a figure: a trap for the King, and a mirror like the one Hamlet describes in his advice to the players. The play shows Claudius his own crime and catches his reaction.
        - |
          Hamlet loves theatre but uses this performance as a weapon, not a career move.
        - |
          The players are innocent tools; they do not know what the play means to the King.
      answer: 1
      explanation: |
        5.C: a symbol in a play may be a whole action. Use the characters' own words ("Mouse-trap," "Tropically," "mirror") as evidence of what it stands for.

    - slug: u06-w19-q10
      type: multiple_choice
      topic_code: "3.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        At the play, Claudius sits through the dumb show but rises when Lucianus pours poison in the sleeper's ears and Hamlet explains, "He poisons him i’ the garden for’s estate." Which best explains the function of this moment in the sequence of Act III?
      options:
        - "It is the climax of Hamlet's test: the King's public break gives Hamlet the proof he wanted and lets Claudius know that Hamlet knows, which drives everything that follows."
        - "It ends the play's main conflict, since Claudius is now arrested."
        - "It shows that Claudius dislikes all plays."
        - "It is a comic interruption with no effect on the plot."
      option_explanations:
        - |
          Correct. Hamlet now takes "the ghost’s word for a thousand pound" (3.2.312-313 in the Folger numbering), and Claudius knows he has been found out. Both men must act, and the following scenes (the prayer, the closet, the voyage to England) come from this moment.
        - |
          No one arrests Claudius; only Hamlet and Horatio understand what has happened. The conflict intensifies rather than ends.
        - |
          He sat through the dumb show; it is the spoken poisoning, with Hamlet's commentary, that breaks him.
        - |
          The moment turns the whole play. Nothing about it is incidental.
      answer: 0
      explanation: |
        3.B: identify the moment's place in a chain of cause and effect. What does each character know after it that he did not know before?

    - slug: u06-w19-q11
      type: multiple_choice
      topic_code: "3.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        In 3.3 Hamlet finds Claudius kneeling and spares him, reasoning that killing him at prayer would send him to heaven. When Hamlet leaves, Claudius says, "My words fly up, my thoughts remain below: / Words without thoughts never to heaven go" (3.3.102-103 in the Folger numbering). The order of these moments chiefly creates
      options:
        - "suspense about whether Claudius will become a monk"
        - "dramatic irony: Hamlet holds back to avoid sending a repentant man to heaven, and the audience learns at once that no repentance was taking place"
