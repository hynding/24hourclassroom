unit: 6
description: |
  45 questions · about 75 minutes · Unit 6, Hamlet. Four passage sets: Claudius's first speech to the court (1.2),
  Hamlet's advice to the players (3.2), Claudius's attempt to pray (3.3), and an unseen passage, Macbeth's soliloquy
  at the start of Macbeth 1.7, read as the AP exam reads a passage you have not studied. Then questions on the whole
  play (conventions, foils, reliability, symbols, sequence), two short answers, and an AP-style essay on the Macbeth
  passage. Multiple choice, select-all and true/false items are graded at once and the fill-in-the-blank items are
  matched automatically; the short answers and the essay are graded by your teacher against the scoring guide.
questions:
  # ---- Set 1: Claudius's first speech, 1.2.1-16 (Project Gutenberg text)
  - slug: u06-exam-q01
    type: multiple_choice
    topic_code: "1.E"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: &court |
      *The following passage opens Act 1, scene 2 of William Shakespeare's* Hamlet *(c. 1600) (lines 1-16 in the Folger edition; line numbers differ between editions). The text is Project Gutenberg's; in line 16 the bracketed [F] restores a letter missing from the Gutenberg file. Claudius, newly crowned King of Denmark, addresses his court, with Gertrude, Hamlet, Polonius, Laertes and others present. Bracketed numbers count the lines of this excerpt.*

      KING.
      Though yet of Hamlet our dear brother’s death
      The memory be green, and that it us befitted
      To bear our hearts in grief, and our whole kingdom
      To be contracted in one brow of woe;
      Yet so far hath discretion fought with nature     [5]
      That we with wisest sorrow think on him,
      Together with remembrance of ourselves.
      Therefore our sometime sister, now our queen,
      Th’ imperial jointress to this warlike state,
      Have we, as ’twere with a defeated joy,—     [10]
      With an auspicious and one dropping eye,
      With mirth in funeral, and with dirge in marriage,
      In equal scale weighing delight and dole,—
      Taken to wife; nor have we herein barr’d
      Your better wisdoms, which have freely gone     [15]
      With this affair along:—[F]or all, our thanks.
    prompt: |
      Claudius's consistent use of "we," "us" and "our" throughout the passage primarily serves to
    options:
      - "show his humility, since he will not speak of himself as an individual"
      - "present his private actions (his grief, his marriage) as acts of state, merging the man with the crown and the court"
      - "indicate that he is speaking for Gertrude as well as himself"
      - "reveal that he is uncertain of his position and needs the court's protection"
    option_explanations:
      - |
        The royal plural is a claim of authority, not humility; it speaks as the kingdom.
      - |
        Correct. "Our dear brother," "our whole kingdom," "our queen," "have we ... Taken to wife": the marriage becomes a public act the state has made, and the court is folded in ("Your better wisdoms ... have freely gone / With this affair along").
      - |
        Gertrude is spoken of ("our sometime sister, now our queen"), not spoken for; the plural is the King's own.
      - |
        The speech is confident; it thanks the court for consent already given rather than asking for protection.
    answer: 1
    explanation: |
      1.E: a character's speech habits are choices. The royal "we" lets Claudius make a private and questionable act sound like policy.

  - slug: u06-exam-q02
    type: multiple_choice
    topic_code: "3.D"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *court
    prompt: |
      In line 5, "discretion fought with nature" sets up a contrast between
    options:
      - "Denmark and Norway"
      - "prudent reason and natural grief, with reason presented as having rightly won"
      - "the old King's virtues and the new King's vices"
      - "the court's loyalty and the people's rebellion"
    option_explanations:
      - |
        Norway is not mentioned in these lines; the contrast is inside the mourner.
      - |
        Correct. Natural feeling would keep the kingdom in "one brow of woe"; "discretion" moderates it into "wisest sorrow." The contrast makes limiting grief sound like wisdom, and so prepares the court to accept a quick marriage.
      - |
        Claudius praises his brother ("our dear brother") and never contrasts the two kings; that contrast is Hamlet's.
      - |
        No rebellion is mentioned; the speech thanks the court for its support.
    answer: 1
    explanation: |
      3.D: identify both terms of the contrast and what the speaker wants it to accomplish.

  - slug: u06-exam-q03
    type: multiple_choice
    topic_code: "5.B"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *court
    prompt: |
      The phrase "our sometime sister, now our queen" (line 8) is best described as
    options:
      - "an affectionate nickname"
      - "a smooth transition that names, in passing, the fact that his queen was his brother's wife, a marriage the Church of the time counted as incestuous, and moves on without comment"
      - "an insult to Gertrude"
      - "a slip of the tongue that Claudius corrects"
    option_explanations:
      - |
        The phrase is formal and public, a statement of status, not a nickname.
      - |
        Correct. "Sometime sister" (former sister-in-law) and "now our queen" sit side by side with no pause, so the troubling relationship is acknowledged and smoothed over in the same breath. Hamlet will name it bluntly as "incestuous."
      - |
        The tone is respectful; she is "Th’ imperial jointress to this warlike state."
      - |
        Nothing is corrected; the phrase flows on into the next line.
    answer: 1
    explanation: |
      5.B: explain what specific words do in context, including what they let a speaker avoid saying.

  - slug: u06-exam-q04
    type: multiple_choice
    topic_code: "4.C"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *court
    prompt: |
      The syntax of lines 8-14, in which the main verb "Taken to wife" arrives only after six lines of qualifying phrases, most strongly suggests that the speaker
    options:
      - "is confused and has lost his train of thought"
      - "is managing his audience, surrounding an awkward fact with balanced qualifications so that it arrives already justified"
      - "is reluctant to marry Gertrude"
      - "is quoting a document written by Polonius"
    option_explanations:
      - |
        The sentence is perfectly controlled; it reaches its verb exactly where the speaker intends.
      - |
        Correct. Defeated joy, an auspicious and a dropping eye, mirth and dirge, delight and dole: by the time "Taken to wife" arrives, the audience has been told how to feel about it. The syntax shows a skilled politician at work.
      - |
        He has already married her; the delay manages the announcement, not his feelings.
      - |
        The speech is the King's own; nothing suggests a borrowed text.
    answer: 1
    explanation: |
      4.C: syntax reveals a speaker's perspective and purpose as much as diction does.

  - slug: u06-exam-q05
    type: multi_select
    topic_code: "3.D"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 2
    partial_credit: true
    stimulus: *court
    prompt: |
      Select the TWO lines that most clearly balance opposite feelings against each other.
    options:
      - "“With an auspicious and one dropping eye,” (line 11)"
      - "“With mirth in funeral, and with dirge in marriage,” (line 12)"
      - "“Th’ imperial jointress to this warlike state,” (line 9)"
      - "“With this affair along:—[F]or all, our thanks.” (line 16)"
    option_explanations:
      - |
        Correct. One eye looks happily forward, the other weeps: joy and grief in one face.
      - |
        Correct. Each half crosses the other: joy at a funeral, lament at a wedding.
      - |
        A title that defines Gertrude's role; no opposition of feelings.
      - |
        A conclusion and thanks to the court; nothing is balanced against anything.
    answer: [0, 1]
    explanation: |
      3.D: the speech is built on paired opposites. Find the lines where the pairing is explicit.

  - slug: u06-exam-q06
    type: true_false
    topic_code: "1.E"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *court
    prompt: |
      True or false: in lines 14-16 Claudius claims that the court freely supported his marriage, which makes the courtiers share responsibility for it.
    answer: true
    explanation: |
      True. "Nor have we herein barr’d / Your better wisdoms, which have freely gone / With this affair along" says the court was consulted and agreed. By thanking them, Claudius makes them partners in the decision, a shrewd political choice.

  - slug: u06-exam-q07
    type: fill_blank
    topic_code: "5.B"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *court
    prompt: |
      Line 12: "With mirth in funeral, and with ____ in marriage."
    answer: ["dirge"]
    explanation: |
      "Dirge," a funeral lament. The chiasmus (mirth/funeral, dirge/marriage) balances joy and grief exactly.

  - slug: u06-exam-q08
    type: multiple_choice
    topic_code: "1.C"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *court
    prompt: |
      Later in this scene, alone, Hamlet says of the same marriage, "O, most wicked speed, to post / With such dexterity to incestuous sheets!" The contrast between the two speakers chiefly serves to
    options:
      - "show that Hamlet and Claudius agree about the marriage but express it differently"
      - "set the King's public, balanced justification against the Prince's private, unbalanced disgust, so the audience learns to hear the court's eloquence as concealment"
      - "prove that Hamlet already knows his father was murdered"
      - "suggest that Claudius is the more honest of the two"
    option_explanations:
      - |
        They disagree completely: Claudius calls the marriage wise and agreed; Hamlet calls it "wicked speed."
      - |
        Correct. Where Claudius says "sometime sister" and balances "delight and dole," Hamlet says "incestuous" and "wicked." The contrast teaches the audience to distrust the polished surface.
      - |
        Hamlet learns of the murder only in 1.5; his disgust here is at the marriage itself.
      - |
        The play gives the audience every reason to trust the soliloquy over the public speech.
    answer: 1
    explanation: |
      1.C: contrasting characters can be contrasting speakers of the same facts. Name what each says and what the difference shows.

  # ---- Set 2: Hamlet's advice to the players, 3.2.1-26 (Project Gutenberg text)
  - slug: u06-exam-q09
    type: multiple_choice
    topic_code: "1.E"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: &players |
      *The following passage is from William Shakespeare's* Hamlet *(c. 1600), Act 3, scene 2 (lines 1-26 in the Folger edition; line numbers differ between editions). The text is Project Gutenberg's. Hamlet is instructing the actors who will perform his version of* The Murder of Gonzago *before the King that evening.*

      HAMLET. Speak the speech, I pray you, as I pronounced it to you, trippingly on the tongue: but if you mouth it, as many of your players do, I had as lief the town crier spoke my lines. Nor do not saw the air too much with your hand, thus, but use all gently: for in the very torrent, tempest, and, as I may say, whirlwind of passion, you must acquire and beget a temperance that may give it smoothness. O, it offends me to the soul, to hear a robustious periwig-pated fellow tear a passion to tatters, to very rags, to split the ears of the groundlings, who, for the most part, are capable of nothing but inexplicable dumb shows and noise: I would have such a fellow whipped for o’erdoing Termagant; it out-herods Herod: pray you avoid it.

      FIRST PLAYER. I warrant your honour.

      HAMLET. Be not too tame neither; but let your own discretion be your tutor: suit the action to the word, the word to the action; with this special observance, that you o’erstep not the modesty of nature: for anything so overdone is from the purpose of playing, whose end, both at the first and now, was and is, to hold, as ’twere, the mirror up to nature; to show virtue her own image, scorn her own image, and the very age and body of the time his form and pressure.
    prompt: |
      The central quality Hamlet asks of the actors is best described as
    options:
      - "loudness, so that every spectator can hear"
      - "a controlled naturalness: passion expressed with “temperance,” action matched to word, neither overdone nor “too tame”"
      - "strict obedience to the playwright's stage directions"
      - "comic exaggeration to please the groundlings"
    option_explanations:
      - |
        He condemns those who "split the ears of the groundlings" and would rather a town crier spoke his lines than a mouthing actor.
      - |
        Correct. "Temperance" in the "whirlwind of passion," "suit the action to the word," "o’erstep not the modesty of nature": he wants feeling under control, true to life.
      - |
        He appeals to the actors' "own discretion," not to written directions.
      - |
        He scorns the groundlings' taste for "dumb shows and noise" and exaggeration that "out-herods Herod."
    answer: 1
    explanation: |
      Read the whole speech for its governing idea; several phrases restate it.

  - slug: u06-exam-q10
    type: multiple_choice
    topic_code: "5.C"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *players
    prompt: |
      In context, the image of holding "the mirror up to nature" takes on added significance because
    options:
      - "the players will use real mirrors on stage"
      - "the play Hamlet is about to stage will literally show the King his own crime, so the mirror becomes a trap for a guilty conscience"
      - "Hamlet wants the actors to look at themselves while rehearsing"
      - "it refers to the Queen's vanity"
    option_explanations:
      - |
        The mirror is figurative; no props are mentioned.
      - |
        Correct. Drama is meant to show "the very age and body of the time his form and pressure." That evening, Hamlet's play will reflect a murder back at the murderer, which turns a theory of drama into a strategy.
      - |
        The mirror reflects "nature" and "the time," not the actors.
      - |
        Gertrude is not mentioned; the image concerns what drama shows its audience.
    answer: 1
    explanation: |
      5.C: an image becomes symbolic when the plot gives it a second, literal application.

  - slug: u06-exam-q11
    type: multiple_choice
    topic_code: "1.E"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *players
    prompt: |
      In Act 2, alone, Hamlet imagined that an actor with his cause "would drown the stage with tears / And cleave the general ear with horrid speech." Read against that speech, Hamlet's advice here is ironic chiefly because
    options:
      - "he now praises the very kind of ranting performance he then condemned"
      - "he now condemns, in actors, the excess of passion he earlier wished he could display himself"
      - "he no longer cares about acting"
      - "he has decided to act in the play himself"
    option_explanations:
      - |
        The reverse: in Act 2 he imagined, even envied, ear-cleaving passion; here he condemns it.
      - |
        Correct. The advice asks for "temperance" and warns against those who "split the ears of the groundlings." In Act 2 he wished to "cleave the general ear." The contradiction is another sign of a character divided between passion and control.
      - |
        He cares intensely; he has written lines for the play and is coaching its delivery.
      - |
        He watches the play with the court; he does not act in it.
    answer: 1
    explanation: |
      Complexity in a character (1.E) often appears when two of his own speeches are set side by side.

  - slug: u06-exam-q12
    type: multiple_choice
    topic_code: "6.D"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *players
    prompt: |
      Hamlet's references to "Termagant" and "Herod" allude to
    options:
      - "two kings of Denmark"
      - "ranting villains of the old religious stage plays, proverbial for overacting, so that “out-herods Herod” means outdoing the loudest ranter"
      - "two members of the acting company"
      - "Roman emperors described by Plutarch"
    option_explanations:
      - |
        Neither is a Danish king; the allusion is to the theatre.
      - |
        Correct. In the medieval mystery plays Herod raged and stormed, and Termagant was a violent figure supposed to be a Saracen deity. Hamlet's phrase compares bad actors to these stock ranters.
      - |
        The names belong to stage roles, not to members of the company.
      - |
        Herod here is the raging king of the religious drama, and Termagant is not a Roman emperor.
    answer: 1
    explanation: |
      6.D: an allusion's function depends on knowing what it refers to; here it is a joke about theatrical history.

  - slug: u06-exam-q13
    type: multiple_choice
    topic_code: "4.C"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *players
    prompt: |
      Hamlet's attitude toward "the groundlings" (the poorest spectators, who stood in the yard) is best described as
    options:
      - "respectful admiration of their taste"
      - "condescending: he assumes they are “capable of nothing but inexplicable dumb shows and noise”"
      - "fearful of their power"
      - "indifferent, since they do not attend plays"
    option_explanations:
      - |
        He says they want noise; nothing here admires them.
      - |
        Correct. The diction ("capable of nothing but") is a prince's scorn for the cheapest part of the audience, a joke Shakespeare's own groundlings would have heard.
      - |
        He mocks the groundlings' taste; nothing in the diction suggests he fears their power or their judgment.
      - |
        They attend; he complains that actors play to them.
    answer: 1
    explanation: |
      4.C: diction reveals a speaker's perspective. Notice too the theatrical joke of saying it at the Globe.

  - slug: u06-exam-q14
    type: multiple_choice
    topic_code: "3.B"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *players
    prompt: |
      This advice opens the scene that contains the play within the play. Its placement there chiefly
    options:
      - "delays the plot for comic effect only"
      - "establishes what a play is for (to show the time its own image) just before Hamlet uses a play to show the King his crime, so theory comes immediately before its test"
      - "explains why the play will be cancelled"
      - "introduces Fortinbras"
    option_explanations:
      - |
        It is witty, but it also prepares the Mousetrap; it is not merely comic delay.
      - |
        Correct. The order matters. The audience hears the theory of the mirror, then sees it turned into a trap when Claudius rises.
      - |
        The play goes ahead and is interrupted only when the King rises.
      - |
        Fortinbras does not appear in this scene.
    answer: 1
    explanation: |
      3.B: ask why one event comes immediately before another.

  - slug: u06-exam-q15
    type: true_false
    topic_code: "3.D"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *players
    prompt: |
      True or false: the speech warns against two opposite faults, overdoing passion and being "too tame," and recommends a mean between them.
    answer: true
    explanation: |
      True. The first part condemns tearing "a passion to tatters"; the second warns, "Be not too tame neither." The ideal is "temperance," the balance Hamlet praises in Horatio and struggles to find himself.

  - slug: u06-exam-q16
    type: fill_blank
    topic_code: "5.B"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *players
    prompt: |
      Hamlet tells the actor that in the "whirlwind of passion" he must acquire and beget a ____ that may give it smoothness.
    answer: ["temperance"]
    explanation: |
      "Temperance": self-control and moderation, the virtue at the centre of the speech.

  # ---- Set 3: Claudius at prayer, 3.3.40-50 and 55-60 (Project Gutenberg text, Folger line numbers)
  - slug: u06-exam-q17
    type: multiple_choice
    topic_code: "6.D"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: &prayer |
      *The following passage is from William Shakespeare's* Hamlet *(c. 1600), Act 3, scene 3 (lines 40-50 and 55-60 in the Folger edition; line numbers differ between editions). The text is Project Gutenberg's; [...] marks omitted lines. After the play scene, Claudius is alone. Bracketed numbers count the lines of this excerpt.*

      KING.
      O, my offence is rank, it smells to heaven;
      It hath the primal eldest curse upon’t,—
      A brother’s murder!—Pray can I not,
      Though inclination be as sharp as will:
      My stronger guilt defeats my strong intent;     [5]
      And, like a man to double business bound,
      I stand in pause where I shall first begin,
      And both neglect. What if this cursed hand
      Were thicker than itself with brother’s blood,—
      Is there not rain enough in the sweet heavens     [10]
      To wash it white as snow? [...]
      My fault is past. But, O, what form of prayer
      Can serve my turn? Forgive me my foul murder!—
      That cannot be; since I am still possess’d
      Of those effects for which I did the murder,—     [15]
      My crown, mine own ambition, and my queen.
      May one be pardon’d and retain the offence?
    prompt: |
      "The primal eldest curse" (line 2) alludes to
    options:
      - "the curse laid on Oedipus"
      - "the curse on Cain, who killed his brother Abel, the first murder in the Bible"
      - "the Ghost's command to Hamlet"
      - "the curse of the house of Atreus"
    option_explanations:
      - |
        Oedipus killed his father, not his brother; the passage stresses "A brother’s murder."
      - |
        Correct. Genesis tells of the first ("primal," "eldest") murder, Cain's of Abel, and God's curse on Cain. Claudius places himself in that line, which makes his crime the archetype of fratricide.
      - |
        The Ghost's command is a demand for revenge, not a curse, and Claudius knows nothing of it.
      - |
        The house of Atreus is a Greek myth of family murders; "primal eldest" points to the first murder of all, in Genesis.
    answer: 1
    explanation: |
      6.D: an allusion compresses a whole story into a phrase. Name the source and say what the comparison does to the speaker.

  - slug: u06-exam-q18
    type: multiple_choice
    topic_code: "1.C"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *prayer
    prompt: |
      The simile in lines 6-8 ("like a man to double business bound, / I stand in pause where I shall first begin, / And both neglect") is most significant in the play because it
    options:
      - "shows that Claudius is busier than Hamlet"
      - "gives the villain the same paralysis between two purposes that defines Hamlet, so that the play's two enemies mirror each other"
      - "proves that Claudius will soon repent"
      - "shows that Claudius is a skilled businessman"
    option_explanations:
      - |
        "Business" here means tasks or purposes (to pray, to keep his gains), not commerce or busyness.
      - |
        Correct. Claudius "stand[s] in pause," torn between two aims, as Hamlet does. The likeness makes the villain human and complicates any simple contrast between hero and villain.
      - |
        The passage shows why he cannot repent; the scene ends with his prayer failing.
      - |
        The simile is about divided purpose, not trade.
    answer: 1
    explanation: |
      1.C: contrasting characters can also be mirrored ones. Explain what the likeness reveals about both.

  - slug: u06-exam-q19
    type: multiple_choice
    topic_code: "5.D"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *prayer
    prompt: |
      The image in lines 8-11 ("this cursed hand / Were thicker than itself with brother’s blood,— / Is there not rain enough in the sweet heavens / To wash it white as snow") primarily expresses
    options:
      - "Claudius's certainty that he is forgiven"
      - "a hope that mercy might be larger than any guilt, set against an image of guilt as a physical coating of blood"
      - "a description of the weather at Elsinore"
      - "Claudius's plan to wash away evidence of the crime"
    option_explanations:
      - |
        The lines are questions; the passage goes on to show he cannot be forgiven while he keeps his gains.
      - |
        Correct. Blood thickening the hand makes guilt physical; heavenly rain washing it "white as snow" (echoing the biblical promise of cleansing) makes mercy as large as the sky. The hope is real and the next lines dash it.
      - |
        The "rain" is the mercy of heaven, a figure, not weather.
      - |
        The murder was by poison long ago; the "blood" is figurative guilt, not evidence.
    answer: 1
    explanation: |
      5.D: an image can carry an argument. Set the two images (blood, rain) against each other.

  - slug: u06-exam-q20
    type: multiple_choice
    topic_code: "1.E"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *prayer
    prompt: |
      Lines 12-17 reveal that Claudius cannot pray successfully chiefly because
    options:
      - "he does not believe in God"
      - "he wants forgiveness while keeping everything the murder gained him, his crown, his ambition and his queen, and he knows that true repentance would require giving them up"
      - "Hamlet interrupts him"
      - "he has forgotten the words of the prayer"
    option_explanations:
      - |
        His whole speech assumes heaven, mercy and judgment; his trouble is not unbelief.
      - |
        Correct. "May one be pardon’d and retain the offence?" He understands exactly what repentance asks, and he chooses not to pay it. This is a complexity: a murderer with a clear-sighted conscience.
      - |
        Hamlet enters but never speaks to him; Claudius does not know he was there.
      - |
        He knows what he would have to say ("Forgive me my foul murder") and rejects it as hollow.
    answer: 1
    explanation: |
      1.E: the character's own reasoning reveals his complexity. Here a villain diagnoses himself accurately.

  - slug: u06-exam-q21
    type: multiple_choice
    topic_code: "4.D"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
    stimulus: *prayer
    prompt: |
      For the audience, the chief effect of this soliloquy on the question of the Ghost's reliability is that
    options:
      - "it shows the Ghost was a devil after all"
      - "it confirms the Ghost's account beyond doubt: the murderer himself, alone, names “A brother’s murder”"
      - "it leaves the Ghost's reliability exactly as uncertain as before"
      - "it suggests Gertrude committed the murder"
    option_explanations:
      - |
        The opposite: the Ghost's story is confirmed by the guilty man.
      - |
        Correct. By convention a soliloquy is not a performance for anyone, and Claudius states his crime outright. Together with his aside in 3.1, it settles for the audience what Hamlet's play only suggested.
      - |
        After this speech no doubt remains for the audience; Hamlet, who does not hear it, is another matter.
      - |
        Claudius says his own hand is "cursed" with "brother’s blood"; nothing implicates Gertrude.
    answer: 1
    explanation: |
      4.D: a soliloquy can serve as reliable testimony that settles what reported accounts left open.

  - slug: u06-exam-q22
    type: multiple_choice
    topic_code: "3.B"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 1
