  - slug: u06-exam-q43
    type: short_answer
    topic_code: "7.C"
    source: 'William Shakespeare, Hamlet (1603)'
    points: 3
    prompt: |
      Thesis: "In *Hamlet*, the theatre is the only place where truth can be told safely." Evidence: Hamlet calls his play "The Mousetrap" and, when the King rises, says he will "take the ghost’s word for a thousand pound" (3.2.312-313 in the Folger numbering). Write two or three sentences of commentary connecting the evidence to the thesis.
    answer: |
      In a court where every conversation is overheard and every friend may be a spy, Hamlet cannot accuse the King directly, so he makes a fiction say what he cannot: the title "The Mousetrap" admits that the play is a trap built out of make-believe. The trap works, and Claudius's flight gives Hamlet a certainty that no confession or witness could, so the truth that cannot be spoken at court is shown on a stage, where the only person who knows what it means is the guilty man watching it.
    explanation: |
      3 points: 1 for explaining what the evidence shows (the title, the result); 1 for linking it to the court's surveillance or the danger of direct speech (why theatre is "safe"); 1 for returning explicitly to the thesis rather than summarising the scene.

  - slug: u06-exam-q44
    type: short_answer
    topic_code: "4.D"
    source: general knowledge
    points: 2
    prompt: |
      In one or two sentences, explain why Hamlet's last request, that Horatio live "To tell my story," matters given how the play treats reports and reporters.
    answer: |
      The play has been full of untrustworthy accounts, from the official story of Old Hamlet's death that abused "the whole ear of Denmark" to Polonius's confident misreadings, so Hamlet's dying wish is for the one reliable witness to survive and tell the truth; the tragedy ends by trying to replace a false story with a true one.
    explanation: |
      2 points: 1 for identifying Horatio's reliability (loyal, steady, a witness throughout); 1 for connecting the request to the play's pattern of false or doubtful reports (the Ghost's complaint, Polonius, Gertrude's accounts, the spies).

  - slug: u06-exam-q45
    type: long_answer
    topic_code: "7.C"
    source: 'William Shakespeare, Macbeth (1623)'
    points: 6
    stimulus: *macbeth
    prompt: |
      Read carefully the passage from Shakespeare's *Macbeth* in Set 4, in which Macbeth, alone, considers murdering King Duncan. In a well-written essay, analyze how Shakespeare uses literary elements and techniques to convey the complexity of Macbeth's deliberation.
    answer: |
      Thesis: Macbeth argues himself out of murder with every image he finds, yet the argument's own figures (a net for consequences, pity riding the storm, ambition overleaping its horse) show a mind that already sees the deed and its punishment vividly, so his hesitation is less a refusal than a clear-eyed view of his own fall.
      Line of reasoning: (1) The wordplay on "done" and the conditional "If" open with a wish for a deed without consequences, made concrete in "trammel up the consequence." (2) "This bank and shoal of time" and "jump the life to come" reveal that he would risk the next world; it is this world's justice he fears. (3) "Besides" turns to Duncan's virtue: angels "trumpet-tongued," pity "like a naked new-born babe, / Striding the blast," images of overwhelming moral force spreading the deed to "every eye." (4) The final riding metaphor admits there is no reason, only "Vaulting ambition," and the image of overleaping and falling foretells the outcome; the dash leaves him in mid-thought. A strong essay may contrast Macbeth's reasons (moral objections to murdering an innocent king) with Hamlet's (proof, conscience and timing in a revenge he thinks just).
    explanation: |
      Row A Thesis (0-1): 1 for a defensible thesis that interprets the complexity of the deliberation (the pull between ambition and conscience, fear of consequence against indifference to the afterlife, or vivid imagination as both warning and temptation), not merely "Macbeth is unsure."
      Row B Evidence and Commentary (0-4): 1 = summary or a list of devices with little explanation. 2 = some relevant evidence (the babe, vaulting ambition) with commentary that identifies techniques without explaining how they convey complexity. 3 = specific evidence from across the passage (the opening wordplay and conditional, the net and shoal metaphors, the turn at "Besides," the angel and babe imagery, the closing riding metaphor and broken syntax) with commentary that explains how each reveals part of his deliberation and builds a line of reasoning. 4 = consistently explains how the techniques interact, for instance how images meant as arguments against the deed show how fully he has already imagined it, or how the structure (wish, objections, admission) enacts his indecision.
      Row C Sophistication (0-1): 1 for a complex understanding, such as distinguishing fear of earthly consequence from fear of damnation, reading the broken-off final line as a structural signal, or comparing his hesitation thoughtfully with Hamlet's.
