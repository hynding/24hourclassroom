    - slug: u06-w21-q19
      type: short_answer
      topic_code: "7.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 3
      prompt: |
        Thesis: "By Act V, Hamlet has stopped trying to control events, and this acceptance, not his earlier planning, brings about his revenge." Evidence: "There’s a divinity that shapes our ends, / Rough-hew them how we will." Write two or three sentences of commentary that connect this evidence to the thesis.
      answer: |
        The image comes from carpentry: men "rough-hew," roughly shape, their purposes, but a divinity gives them their final form. Hamlet says this while explaining how a sleepless impulse at sea saved him, so the line marks the turn from the man who staged the Mousetrap to test the Ghost to one who trusts something beyond his own design. That acceptance is why he walks into Claudius's duel "ready" rather than prepared, and the revenge he could not plan arrives through the poisoned weapons of others.
      explanation: |
        3 points: 1 for explaining the image or key words (rough-hew, shapes, divinity) accurately; 1 for placing the line in context (the sea voyage, contrasted with earlier planning such as the Mousetrap); 1 for returning explicitly to the thesis (acceptance leads to the revenge). Commentary that only paraphrases the line earns at most 1.

    - slug: u06-w21-q20
      type: short_answer
      topic_code: "7.B"
      source: general knowledge
      points: 2
      prompt: |
        Q3-style prompt: "Many works of literature feature a character who must decide whether to obey or defy a figure of authority." Write a defensible thesis that answers this prompt using *Hamlet* and suggests a line of reasoning.
      answer: |
        Hamlet is caught between two authorities, the Ghost who commands revenge and the King he must outwardly obey, and by feigning obedience while preparing defiance he exposes the play's central conflict between appearance and duty, a conflict resolved only when he stops answering to either authority and accepts providence.
      explanation: |
        2 points: 1 for a defensible claim that answers the prompt (identifies the authority or authorities and Hamlet's response), not a summary; 1 for a line of reasoning (how the obedience or defiance unfolds, and what it reveals about the work as a whole). Spiral review of thesis writing (7.B).

