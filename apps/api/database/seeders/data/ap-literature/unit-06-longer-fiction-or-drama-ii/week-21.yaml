    - slug: u06-w21-q22
      type: long_answer
      topic_code: "7.C"
      source: general knowledge
      points: 6
      prompt: |
        In many works of literature, a character's hesitation before a decisive act reveals as much about that character as the act itself.

        Either from your own reading or from the works below, choose a work of fiction or drama in which a character hesitates before a significant action. Then, in a well-written essay, analyze how the character's hesitation contributes to an interpretation of the work as a whole.

        You may choose a work from this list or another work of comparable literary merit: William Shakespeare, *Hamlet*; Mary Shelley, *Frankenstein*; O. Henry, "The Gift of the Magi"; Nathaniel Hawthorne, "Young Goodman Brown"; Henrik Ibsen, *A Doll's House*.

        In your response you should: respond to the prompt with a thesis that presents a defensible interpretation; provide evidence to support your line of reasoning; explain how the evidence supports your line of reasoning; and use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Model (Hamlet). Thesis: Hamlet's hesitation is not cowardice but the action of a conscience that refuses to become what it hates; by tracing his delay from his first acceptance of the Ghost's charge to his final readiness, Shakespeare suggests that in a corrupt world thought is both what keeps a man human and what keeps him from acting, and that the deed can come only when he stops trying to control it.
        Line of reasoning and evidence: (1) The delay begins at the moment of acceptance: "O cursed spite, / That ever I was born to set it right." (2) Doubt is rational and moral: the Ghost "May be the devil," so he tests it with the Mousetrap. (3) Proof does not end the hesitation; he spares the praying King for a worse damnation, and in the next scene kills Polonius on impulse, showing that action without thought finds the wrong victim. (4) Foils show the alternatives: Laertes would cut a throat "i’ the church" and ends "justly kill’d with mine own treachery." (5) In Act V, "the readiness is all": the revenge is completed through others' plots once Hamlet accepts providence. Commentary connects each stage to the thesis about thought, conscience and action.
      explanation: |
        Row A Thesis (0-1): 1 for a defensible thesis that interprets how the hesitation contributes to the meaning of the work as a whole (not merely that the character hesitates, and not plot summary).
        Row B Evidence and Commentary (0-4): 1 = summary or vague references with little commentary. 2 = some specific evidence (one or two moments) with commentary that mostly explains plot. 3 = specific, relevant evidence from several points in the work, with commentary that explains how the hesitation develops and connects to the thesis through a clear line of reasoning. 4 = sufficient, well-chosen evidence across the work (beginning, turning point, ending) with consistent commentary that explains the significance of each piece for the interpretation, including how other characters or structural choices illuminate the hesitation.
        Row C Sophistication (0-1): 1 for a complex argument, such as weighing hesitation as both flaw and virtue, situating it in a broader context (Elizabethan revenge tragedy, ideas of providence), considering alternative interpretations, or writing with a consistently vivid and persuasive style.
