guide: guides/week-21.md
guide_description: |
  Act V scene by scene (the graveyard, Hamlet's account of the voyage, the duel and the deaths) and then the whole
  play as material for an essay. How to choose relevant and sufficient evidence from a five-act play (7.D) and how
  to write commentary that ties it to a line of reasoning (7.C), with a model Q3 paragraph built and annotated, and
  the habits that sink essays on Hamlet.
flashcards_description: |
  30 cards on Act V and on using the whole play in an essay: the graveyard, providence and readiness, the duel's
  order of deaths, the final speeches, and evidence banks for common Q3 themes.

flashcards:
  - front: Commentary (7.C) → what it must do in an essay on Hamlet
    back: |
      Explain how a piece of evidence supports the line of reasoning: what the words do, why that matters to the claim, and how it connects to the thesis. Commentary answers "so what?"; it never only restates the quotation or the plot.
    topic_code: "7.C"
  - front: Relevant and sufficient evidence (7.D) → what each word means
    back: |
      Relevant: it bears directly on the specific claim, not just on the topic. Sufficient: there is enough of it, from enough of the play, to carry the claim. In Q3, two or three well-chosen moments from different acts usually beat ten quotations from one scene.
    topic_code: "7.D"
  - front: Act V, scene 1 → the gravediggers
    back: |
      Two clowns (rustic comic characters) dig Ophelia's grave, joking in prose about whether a suicide deserves Christian burial. The First Gravedigger sings as he digs and tosses up skulls. Comedy in a grave, just before the catastrophe.
    topic_code: "3.D"
  - front: Hamlet's age, according to the graveyard scene
    back: |
      The Gravedigger says he began his trade the day Old Hamlet defeated Old Fortinbras, the day young Hamlet was born, and that he has been sexton thirty years. So Hamlet is about thirty in Act V, older than many readers assume.
    topic_code: "3.A"
  - front: Yorick → who he was
    back: |
      The old King's jester, whose skull the Gravedigger identifies; it has lain in the earth "three-and-twenty years." Hamlet remembers being carried on his back. The skull of the man who made a child laugh shows him death as a physical fact.
    topic_code: "5.C"
  - front: "“Alas, poor Yorick!—I knew him, Horatio” → what the speech does"
    back: |
      Memory, then revulsion ("my gorge rises at it"), then satire: tell my lady to "paint an inch thick, to this favour she must come" (5.1.190-202 in the Folger numbering). Death strips every disguise, the play's appearance-and-reality theme in its bluntest form.
    topic_code: "5.C"
  - front: The skull as memento mori
    back: |
      "Remember you must die": a skull was the standard emblem in art and sermons. Hamlet holds the emblem literally, and his reflection moves from Yorick to Alexander and Caesar: death levels everyone.
    topic_code: "5.C"
  - front: "“Imperious Caesar, dead and turn’d to clay, / Might stop a hole to keep the wind away.” → its tone"
    back: |
      A mock-solemn rhymed couplet (5.1.220-221 in the Folger numbering). The conqueror becomes mud in a wall. Hamlet's wit about death is calmer now than in Act IV, closer to contemplation than to taunting.
    topic_code: "4.C"
  - front: Ophelia's funeral → the "maimed rites"
    back: |
      Because her death was doubtful, the priest gives her a curtailed burial, allowed only by royal command. Laertes protests, leaps into the grave, and Hamlet, revealing himself, leaps in after him: "this is I, / Hamlet the Dane" (5.1.270-271 in the Folger numbering).
    topic_code: "3.E"
  - front: "“this is I, / Hamlet the Dane.” → why it matters"
    back: |
      "The Dane" is the title of the King of Denmark. Hamlet, back from exile, names himself publicly for the first time, as a royal claimant, at his rival's grave. A man who spent four acts in disguise steps out of it.
    topic_code: "1.B"
  - front: "“Sweets to the sweet: farewell.” → Gertrude at the grave"
    back: |
      Gertrude scatters flowers on Ophelia's grave (5.1.254 in the Folger numbering) and says she had hoped Ophelia would be Hamlet's wife. Her tenderness to Ophelia contrasts with Hamlet's treatment of her in Act III.
    topic_code: "1.D"
  - front: Hamlet's account of the voyage (5.2) → what he did
    back: |
      Sleepless at sea, he found the King's commission ordering his death, wrote a new one ordering the bearers' deaths, sealed it with his father's signet, and put it back. Rosencrantz and Guildenstern sailed on to their execution.
    topic_code: "3.E"
  - front: "“Rashly, / And prais’d be rashness for it” → what Hamlet has learned"
    back: |
      "Our indiscretion sometime serves us well, / When our deep plots do fail" (5.2.6-9 in the Folger numbering). Acting on impulse saved him where planning fails. The man of deliberation now credits instinct, and something beyond it.
    topic_code: "1.B"
  - front: "“There’s a divinity that shapes our ends, / Rough-hew them how we will” → meaning"
    back: |
      We rough out our plans; a divine power finishes the shape (5.2.11-12 in the Folger numbering). Hamlet now sees his life as part of a design he does not control. A key piece of evidence for his change in Act V.
    topic_code: "1.B"
  - front: "“They are not near my conscience.” → Hamlet on Rosencrantz and Guildenstern"
    back: |
      They "did make love to this employment" (5.2.64-65 in the Folger numbering): they chose to serve the King, so their deaths are their own doing. Is this justice or callousness? The play leaves the judgment to us.
    topic_code: "1.E"
  - front: "“the readiness is all.” → the passage"
    back: |
      Hamlet to Horatio, before the duel (5.2.233-238 in the Folger numbering): "there’s a special providence in the fall of a sparrow. If it be now, ’tis not to come; if it be not to come, it will be now; if it be not now, yet it will come." Acceptance in place of anxiety.
    topic_code: "1.B"
  - front: The fall of a sparrow → the allusion
    back: |
      To Jesus's words in Matthew 10:29 that not a sparrow falls to the ground without the Father. Hamlet's calm rests on providence, not on a plan; he enters the duel ready rather than prepared.
    topic_code: "6.D"
  - front: Osric → his function
    back: |
      A foppish courtier who brings the King's wager, all hat-waving and inflated vocabulary, whom Hamlet mocks. Comic relief before the catastrophe, and a last sample of the court's empty surfaces.
    topic_code: "1.C"
  - front: The duel → order of events
    back: |
      Hamlet wins the first hits; Gertrude drinks the poisoned cup to his health; Laertes wounds Hamlet with the unbated, poisoned blade; in a scuffle they exchange rapiers and Hamlet wounds Laertes; the Queen falls.
    topic_code: "3.B"
  - front: The deaths in 5.2, in order
    back: |
      Gertrude ("The drink, the drink!—I am poison’d"), Claudius (stabbed with the envenomed point and forced to drink), Laertes (after exchanging forgiveness), Hamlet. Then the English ambassador reports "That Rosencrantz and Guildenstern are dead."
    topic_code: "3.B"
  - front: "“I am justly kill’d with mine own treachery.” → its function"
    back: |
      Laertes, wounded by his own poisoned blade (5.2.337 in the Folger numbering). Every plot recoils on its maker: the poison Laertes bought and the cup Claudius prepared kill them both. The play's sense of justice works by rebound.
    topic_code: "7.C"
  - front: "“the king, the king’s to blame.” → why Laertes's confession matters"
    back: |
      Dying, Laertes exposes Claudius publicly (5.2.351 in the Folger numbering). Hamlet kills the King only after the court has heard the truth, so the revenge is also public justice.
    topic_code: "3.E"
  - front: "“Here, thou incestuous, murderous, damned Dane, / Drink off this potion.” → the revenge at last"
    back: |
      Hamlet stabs Claudius with the envenomed point and forces the poisoned cup on him (5.2.356-357 in the Folger numbering). The epithets name his crimes in public; "Dane" echoes Hamlet's own "Hamlet the Dane" from the graveyard.
    topic_code: "1.E"
  - front: "“Absent thee from felicity awhile ... To tell my story.” → Hamlet's last request"
    back: |
      Hamlet stops Horatio from drinking the poison (5.2.382-384 in the Folger numbering). He wants a truthful witness to survive so his "wounded name" is not left to rumour. The play that began with a false story told to Denmark ends by commissioning a true one.
    topic_code: "4.D"
  - front: "“the rest is silence.” → Hamlet's last words"
    back: |
      After giving his "dying voice" to Fortinbras (5.2.395 in the Folger numbering). The most talkative character in Shakespeare ends in silence; "rest" means both what remains and repose.
    topic_code: "5.B"
  - front: "“Now cracks a noble heart.—Good night, sweet prince” → Horatio's farewell"
    back: |
      "And flights of angels sing thee to thy rest" (5.2.397-398 in the Folger numbering). Horatio, the play's steady witness, gives Hamlet a blessing and so the play's last judgment on him: noble.
    topic_code: "1.C"
  - front: Fortinbras's ending → "Bear Hamlet like a soldier to the stage"
    back: |
      Fortinbras orders a soldier's funeral, saying Hamlet would likely "have prov’d most royally" (5.2.441-444 in the Folger numbering). The foil inherits the kingdom; the man of action ends the play, honouring the man of thought.
    topic_code: "1.C"
  - front: Evidence bank → Hamlet's delay (Q3)
    back: |
      1.5 "O cursed spite, / That ever I was born to set it right"; 2.2 "Am I a coward?"; 3.1 "conscience does make cowards of us all"; 3.3 sparing the praying King; 4.4 "My thoughts be bloody"; 5.2 "the readiness is all." One moment per act shows a development, not a list.
    topic_code: "7.D"
  - front: Evidence bank → appearance and reality (Q3)
    back: |
      1.2 "I know not seems"; 1.5 "one may smile, and smile, and be a villain"; 3.1 Claudius's "most painted word"; 3.2 the Mousetrap as mirror; 3.4 the two portraits; 5.1 "let her paint an inch thick, to this favour she must come."
    topic_code: "7.D"
  - front: Evidence bank → foils and sons (Q3)
    back: |
      Fortinbras (2.2 report; 4.4 army; 5.2 inheritance), Pyrrhus (2.2 "Did nothing"), Laertes (4.5 "To hell, allegiance!"; 4.7 "To cut his throat i’ the church"; 5.2 "justly kill’d with mine own treachery"). Each answers a father's death differently.
    topic_code: "7.D"

quiz:
  description: |
    22 questions · about 45 minutes · about 35% this week (choosing relevant and sufficient evidence and writing
    commentary, on Act V and the whole play) and 65% review across the unit and the year: symbol, contrast, change,
    sequence, foils, reliability and word choice. Multiple choice, select-all and true/false items are graded at once
    and the fill-in-the-blank items are matched automatically; the two short answers and the literary argument essay
    are graded by your teacher against the scoring guide.
  questions:
    # ---- Passage set: Yorick, 5.1.178-208 (Project Gutenberg text)
    - slug: u06-w21-q01
      type: multiple_choice
      topic_code: "5.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: &yorick |
        *The following passage is from William Shakespeare's* Hamlet *(c. 1600), Act 5, scene 1 (lines 178-208 in the Folger edition; line numbers differ between editions). The text is Project Gutenberg's, which calls the gravedigger the First Clown. Hamlet, newly returned to Denmark, and Horatio are watching him at work. Hamlet does not yet know whose grave is being dug.*

        FIRST CLOWN. Here’s a skull now; this skull hath lain in the earth three-and-twenty years.

        HAMLET. Whose was it?

        FIRST CLOWN. A whoreson, mad fellow’s it was: whose do you think it was?

        HAMLET. Nay, I know not.

        FIRST CLOWN. A pestilence on him for a mad rogue! ’a pour’d a flagon of Rhenish on my head once. This same skull, sir, was Yorick’s skull, the king’s jester.

        HAMLET. This?

        FIRST CLOWN. E’en that.

        HAMLET. Let me see. [Takes the skull.] Alas, poor Yorick!—I knew him, Horatio; a fellow of infinite jest, of most excellent fancy: he hath borne me on his back a thousand times; and now, how abhorred in my imagination it is! my gorge rises at it. Here hung those lips that I have kiss’d I know not how oft. Where be your gibes now? your gambols? your songs? your flashes of merriment, that were wont to set the table on a roar? Not one now, to mock your own grinning? quite chap-fallen? Now, get you to my lady’s chamber, and tell her, let her paint an inch thick, to this favour she must come; make her laugh at that.—Pr’ythee, Horatio, tell me one thing.

        HORATIO. What’s that, my lord?

        HAMLET. Dost thou think Alexander looked o’ this fashion i’ the earth?

        HORATIO. E’en so.

        HAMLET. And smelt so? Pah!

        HORATIO. E’en so, my lord.
      prompt: |
        In the context of the whole play, Yorick's skull functions chiefly as a symbol of
      options:
        - "the Danish monarchy's wealth"
        - "death as a physical fact that levels everyone (jester, lady, conqueror) and strips away every disguise"
        - "Hamlet's wish to become a jester"
        - "the Gravedigger's cruelty"
      option_explanations:
        - |
          Yorick was a jester, not a symbol of royal wealth, and the speech moves toward the equality of the dead.
        - |
          Correct. Hamlet moves from Yorick to "my lady," who must come to "this favour" however thick her paint, and to Alexander. After a play full of masks, the skull is the face no one can disguise.
        - |
          Hamlet has played the "antic," but here he mourns the jester's lost merriment; nothing suggests a wish to take his place.
        - |
          The Gravedigger is blunt and comic, not cruel; his familiarity with skulls is part of the scene's levelling humour.
      answer: 1
      explanation: |
        Spiral review of symbol (5.C). Follow the speech's movement outward from the object (Yorick, a lady, Alexander) to see what it comes to stand for.

    - slug: u06-w21-q02
      type: multiple_choice
      topic_code: "3.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *yorick
      prompt: |
        The questions "Where be your gibes now? your gambols? your songs? your flashes of merriment [...]?" followed by "quite chap-fallen?" chiefly work through a contrast between
      options:
        - "Denmark and Norway"
        - "the living jester's lively wit and noise and the jawless silence of the skull, so that the loss of life is felt as the loss of laughter"
        - "Hamlet's childhood and Horatio's"
        - "the Gravedigger's speech and Horatio's"
      option_explanations:
        - |
          No nations are compared here; the speech is about one man's life and death.
        - |
          Correct. Each question names a form of life (gibes, gambols, songs, merriment) and the answer is the grinning, "chap-fallen" skull. The contrast makes death concrete: what is lost is a particular laugh.
        - |
          Hamlet remembers his own childhood with Yorick; Horatio's is never mentioned.
        - |
          Horatio says only "E’en so"; the contrast is between Yorick living and Yorick dead.
      answer: 1
      explanation: |
        Spiral review of contrast (3.D): rhetorical questions can set up one term of a contrast while the object on stage supplies the other.

    - slug: u06-w21-q03
      type: multiple_choice
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *yorick
      prompt: |
        Hamlet's instruction to the skull, "get you to my lady’s chamber, and tell her, let her paint an inch thick, to this favour she must come," most directly recalls which earlier concern of his?
      options:
        - "His interest in the Norwegian war"
        - "His preoccupation with seeming and being, and his scorn of women's painted faces as a kind of disguise, now answered by the skull that no paint can hide"
        - "His wish to return to Wittenberg"
        - "His admiration for the Player's skill"
      option_explanations:
        - |
          The Norwegian campaign is not the subject here.
        - |
          Correct. From "I know not seems" to the harlot's "plastering art" Claudius described, the play has made painted surfaces its image of deceit. Hamlet's satire on "my lady" carries his old bitterness, now aimed at mortality itself.
        - |
          Wittenberg belongs to Act I; nothing here refers to it.
        - |
          The Player's art is a different kind of performance; the "paint" here is cosmetics.
      answer: 1
      explanation: |
        Spiral review of 1.E. A strong reader connects a late speech to a pattern in the character's earlier words.

    - slug: u06-w21-q04
      type: multiple_choice
      topic_code: "4.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *yorick
      prompt: |
        Which best describes the shifts in Hamlet's tone across his speech beginning "Let me see. [...] Alas, poor Yorick!"?
      options:
        - "Steady anger from beginning to end."
        - "From fond memory, to physical revulsion (“My gorge rises at it”), to mocking questions and satire, ending in a question to Horatio that turns the thought to great men."
        - "From fear of the Gravedigger to relief."
        - "From grief for Ophelia to anger at Laertes."
      option_explanations:
        - |
          The speech opens with affection ("a fellow of infinite jest") and is not angry in tone.
        - |
          Correct. The diction moves through memory ("he hath borne me on his back"), disgust ("abhorred," "my gorge rises"), mockery ("quite chap-fallen?") and satire ("paint an inch thick"), then widens to Alexander.
        - |
          Hamlet is at ease with the Gravedigger, trading jokes; there is no fear.
        - |
          He does not yet know the grave is Ophelia's, and Laertes has not yet appeared.
      answer: 1
      explanation: |
        Spiral review of how diction reveals a speaker's perspective (4.C). Track the tone sentence by sentence.

    - slug: u06-w21-q05
      type: multiple_choice
      topic_code: "7.D"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *yorick
      prompt: |
        A student claims: "In the graveyard, death stops being a philosophical question for Hamlet and becomes a physical fact." Which evidence from the passage is most relevant to this claim?
      options:
        - "“I knew him, Horatio; a fellow of infinite jest, of most excellent fancy”"
        - "“Dost thou think Alexander looked o’ this fashion i’ the earth?” / “E’en so.” / “And smelt so? Pah!”"
        - "“A pestilence on him for a mad rogue!”"
        - "“Whose was it?”"
      option_explanations:
        - |
          This is memory of the living Yorick. It is moving, but it is about life, not about death as a physical fact.
        - |
          Correct. Hamlet's question begins in thought (did Alexander look like this?) and ends in the body: smell and disgust. Set against "To be, or not to be," where death was "a sleep," the sequence shows the shift the claim describes.
        - |
          The Gravedigger's curse characterises him and Yorick's pranks; it does not show Hamlet's view of death.
        - |
          A simple question of identity; too slight to carry the claim.
      answer: 1
      explanation: |
        7.D: relevant evidence matches the claim's specific terms (here "physical fact"). Pick the line that shows the change, not just the topic.

    - slug: u06-w21-q06
      type: multiple_choice
      topic_code: "7.C"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *yorick
      prompt: |
        A student quotes "Here hung those lips that I have kiss’d I know not how oft" in support of the claim that the graveyard makes death intimate for Hamlet. Which sentence of commentary best follows the quotation?
      options:
        - "This quote shows that Hamlet kissed Yorick."
        - "Hamlet is talking about Yorick's lips in this quote from Act 5."
        - "By pointing to the empty place where lips once were, Hamlet measures death against his own childhood affection, so the skull is no longer an emblem of mortality but the remains of someone he loved; death is now a loss he can touch."
        - "Shakespeare uses imagery in this quote."
      option_explanations:
        - |
          It restates the quotation without explaining what it does for the claim.
        - |
          Plot summary, with no analysis of how the line supports the idea of intimacy.
        - |
          Correct. The commentary explains how the words work ("Here hung," the absence, the memory of kissing) and ties them back to the claim (death as personal, physical loss).
        - |
          Naming a device without explaining its effect is not commentary.
      answer: 2
      explanation: |
        7.C: commentary explains how the evidence supports the reasoning. Test each sentence by asking "does it say why this matters to my claim?"

    - slug: u06-w21-q07
      type: true_false
      topic_code: "3.A"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      stimulus: *yorick
      prompt: |
        True or false: at the point of this passage, Hamlet already knows that the grave being dug is Ophelia's.
      answer: false
      explanation: |
        False. He learns it only when the funeral procession arrives and Laertes speaks. The order matters: Hamlet's meditation on death is general and even humorous until it suddenly becomes his own loss. Spiral review of how plot orders events (3.A).

    # ---- Act V and the whole play
    - slug: u06-w21-q08
      type: fill_blank
      topic_code: "1.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Telling Horatio how he acted on impulse at sea, Hamlet reflects: "There’s a ____ that shapes our ends, / Rough-hew them how we will" (5.2.11-12 in the Folger numbering).
      answer: ["divinity"]
      explanation: |
        "Divinity." Hamlet now credits a providence that finishes what human plans only rough out. Spiral review of 1.E: his own words reveal a changed view of action.

    - slug: u06-w21-q09
      type: multiple_choice
      topic_code: "1.B"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Before the duel Hamlet tells Horatio, "there’s a special providence in the fall of a sparrow. If it be now, ’tis not to come; if it be not to come, it will be now; if it be not now, yet it will come: the readiness is all" (5.2.233-237 in the Folger numbering). Compared with Hamlet in Acts I-IV, this speech best shows him
      options:
        - "unchanged, still tormented by whether to act"
        - "changed: the anxious calculation of earlier acts has given way to calm acceptance of a providence he does not control, so readiness replaces planning"
        - "planning the duel's outcome in exact detail"
        - "ready to forgive Claudius"
      option_explanations:
        - |
          The torment of "Am I a coward?" and "How all occasions" is gone. The speech is calm, not tormented.
        - |
          Correct. The prose is serene and the reasoning circular on purpose: whatever will happen, will. The man who could not stop thinking now leaves the timing to providence. Whether this is wisdom or fatalism is the question a strong essay engages.
        - |
          He says the opposite: readiness, not planning. He does not know of the poison.
        - |
          Nothing here forgives Claudius; it concerns Hamlet's own readiness for whatever comes.
      answer: 1
      explanation: |
        Spiral review of character change (1.B). Compare the speech's manner as well as its content with earlier soliloquies.

    - slug: u06-w21-q10
      type: multiple_choice
      topic_code: "3.E"
      source: 'William Shakespeare, Hamlet (1603)'
      points: 1
      prompt: |
        Hamlet tells Horatio that at sea he found the King's order for his death, forged a new commission ordering the bearers' deaths, and sealed it with his father's signet. Of Rosencrantz and Guildenstern he says, "Why, man, they did make love to this employment; / They are not near my conscience" (5.2.64-65 in the Folger numbering). The episode functions chiefly to
      options:
        - "show that Hamlet can act swiftly and ruthlessly when he acts on impulse, while raising a moral question about the cost of that decisiveness"
        - "prove that Rosencrantz and Guildenstern knew of the death warrant"
        - "show that Hamlet regrets everything he did at sea"
        - "delay the ending without consequence"
      option_explanations:
        - |
          Correct. Offstage and on impulse, Hamlet did what he could not do deliberately: he sent two men to death. "Not near my conscience" invites the audience to judge whether this is justice or a new hardness.
        - |
          The play never says they knew the letters' contents; that is part of why the audience may find their deaths troubling.
        - |
          He is unapologetic; "They are not near my conscience" is the opposite of regret.
        - |
          The account explains Hamlet's escape and his changed temper, and the ambassadors' news at the end ("Rosencrantz and Guildenstern are dead") depends on it.
      answer: 0
      explanation: |
        Spiral review of the function of a significant event (3.E). Ask what the event shows about the character and what judgment it asks of the audience.

    - slug: u06-w21-q11
      type: multiple_choice
      topic_code: "3.B"
      source: general knowledge
      points: 1
      prompt: |
        In the duel, Gertrude drinks the poisoned cup, Laertes wounds Hamlet, the rapiers are exchanged and Hamlet wounds Laertes, the Queen dies, and the dying Laertes confesses, "the king, the king’s to blame." Only then does Hamlet kill Claudius. What is the chief effect of this order?
      options:
        - "Hamlet's revenge comes only after Claudius's guilt has been exposed before the whole court, and after each of the King's plots has turned on its makers."
        - "It shows that Hamlet planned every step of the duel."
        - "It makes Laertes the hero of the play."
        - "It allows Claudius to escape."
      option_explanations:
        - |
          Correct. The cup kills the Queen it was not meant for; the blade kills the man who poisoned it; and Laertes's confession turns private revenge into public justice. Hamlet strikes when the truth is known to all.
        - |
          Hamlet knows nothing of the poison until the end; the order is driven by accident and providence, not his plan.
        - |
          Laertes's confession redeems him in part, but the scene's weight falls on Hamlet's final act and death.
        - |
          Claudius dies, stabbed and forced to drink his own poison.
      answer: 0
      explanation: |
