    - slug: u09-w30-q22
      type: long_answer
      topic_code: "1.B"
      source: "general knowledge"
      points: 6
      prompt: |
        In many works of literature, a character's refusal to change is as important as another character's transformation. In *The Great Gatsby* (1925), Gatsby remains faithful to his dream while Nick Carraway is changed by what he witnesses.

        In a well-written essay, analyze how the contrast between a character who changes and a character who does not contributes to an interpretation of *The Great Gatsby* as a whole.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Provide evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Fitzgerald sets Gatsby's unchanging fidelity to an invented self against Nick's slow movement from tolerance to judgment, so that the novel can mourn the dream and condemn the world that both inspired and destroyed it.
        Line of reasoning: (1) Gatsby's constancy: the Platonic conception "faithful to the end," "Can't repeat the past? Why of course you can!", the vigil outside the Buchanans' house; (2) Nick's change: "inclined to reserve all judgements" in chapter 1 against "careless people" and "rotten crowd" at the end, his move back West; (3) the meaning of the contrast: Gatsby's refusal to change is both his "gift for hope" and his doom, while Nick's change is what lets him tell the story and judge it; the final "we" fuses them, as Nick admits that he too is "borne back ceaselessly into the past."
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis about how the change/no-change contrast shapes the meaning of the whole novel (not just "Gatsby doesn't change and Nick does").
        Row B Evidence and Commentary (0-4): 1 = mostly summary of the plot. 2 = relevant evidence about both characters with commentary that is general. 3 = specific evidence (quotations or precise moments: chapter 1's tolerance, chapter 6's "faithful to the end," the vigil, the compliment, the careless people) with commentary that explains how each shows change or constancy and links it to the thesis. 4 = well-chosen evidence across the novel with commentary that consistently explains how the contrast produces meaning (e.g. hope as heroism and flaw; judgment as the cost of experience).
        Row C Sophistication (0-1): 1 point for complexity, such as showing that Nick's change is partial (he is accused of carelessness himself; the final "we" includes him in Gatsby's predicament) or situating the contrast within the novel's view of the American dream.
