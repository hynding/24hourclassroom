week: 30
unit: 9
title: Conflict and Change, The Great Gatsby Chapters 7-9
topics: ["3.F", "1.B"]
texts:
  - author: F. Scott Fitzgerald
    title: The Great Gatsby (Chapters VII-IX)
    year: 1925
    url: https://www.gutenberg.org/ebooks/64317
guide: guides/week-30.md
guide_description: |
  The last third of the novel through its conflicts (Tom against Gatsby, Daisy against herself, the classes against
  each other) and through the question of who changes. The Plaza Hotel, the accident, the deaths, the funeral and the
  final page; four worked close readings, a model literary-argument paragraph, misreadings, self-check.
flashcards_description: |
  28 cards on the events, people and key lines of The Great Gatsby, chapters 7-9, and on explaining conflict and
  character change.

flashcards:
  - front: Conflict (3.F) → what the skill asks
    back: |
      Name the opposed forces (person against person, against society, against self, against time) and explain what the conflict reveals or produces: a choice, a change, a theme. The question is never only "who wins?"
    topic_code: "3.F"
  - front: Change or no change (1.B) → what the skill asks
    back: |
      Decide whether a character is changed by events, then explain why it matters: a change can carry the work's meaning (Nick), and so can a refusal to change (Gatsby, Tom, Daisy).
    topic_code: "1.B"
  - front: Gatsby ch. 7 → the heat
    back: |
      Chapter 7 takes place on the hottest day of the summer. The heat presses on every scene, from the Buchanans' lunch to the stifling suite at the Plaza, and frays tempers until the conflict breaks open.
    topic_code: "3.F"
  - front: Gatsby's servants dismissed (chapter 7)
    back: |
      Gatsby stops his parties and replaces his servants with people sent by Wolfshiem, so that gossip will not reach Daisy, who now visits in the afternoons. The house that was built to attract her goes dark once it has.
    topic_code: "3.F"
  - front: Pammy Buchanan (chapter 7)
    back: |
      Daisy's daughter is brought in by her nurse at the lunch. Gatsby looks at the child with surprise, as if he had never quite believed in her: the living proof of the years he wants Daisy to erase.
    topic_code: "1.B"
  - front: '"Her voice is full of money"'
    back: |
      Gatsby's sudden verdict on Daisy in chapter 7. Nick: "That was it. I'd never understood before." The voice's charm is the jingle of wealth; Gatsby's own words show he knows part of what he has been pursuing.
    topic_code: "1.B"
  - front: The trip to town (chapter 7)
    back: |
      Tom drives Gatsby's yellow car with Nick and Jordan; Gatsby drives Daisy in Tom's coupé. They stop at Wilson's garage, where Wilson says he and his wife are going West, and Myrtle watches Tom from an upstairs window.
    topic_code: "3.F"
  - front: The Plaza Hotel confrontation
    back: |
      In a hired suite in the heat, Tom challenges Gatsby openly. Gatsby demands that Daisy say she never loved Tom; she cannot. Tom exposes Gatsby's bootlegging. Gatsby's claim collapses, and Tom, sure of his victory, sends Daisy home with Gatsby in Gatsby's car.
    topic_code: "3.F"
  - front: '"Mr. Nobody from Nowhere"'
    back: |
      Tom's sneer at the Plaza, followed by a speech about people "sneering at family life and family institutions." A rival in love is also a class enemy, and the man with a mistress casts himself as defender of the family.
    topic_code: "3.F"
  - front: '"I did love him once—but I loved you too."'
    back: |
      Daisy to Gatsby at the Plaza, sobbing. She cannot erase the past the way he demands; the line ends his hope of having her on his terms and shows her internal conflict.
    topic_code: "3.F"
  - front: The drugstores
    back: |
      Tom's exposure at the Plaza: Gatsby and Wolfshiem "bought up a lot of side-street drugstores here and in Chicago and sold grain alcohol over the counter." Bootlegging under Prohibition, and the hint of worse.
    topic_code: "3.F"
  - front: Nick's thirtieth birthday
    back: |
      Nick realises at the Plaza that it is his birthday: he is thirty, facing a new decade. A private marker of change set inside the climax, as he drives home with Tom, Jordan and the news still to come.
    topic_code: "1.B"
  - front: Myrtle's death (end of chapter 7)
    back: |
      Running into the road toward the yellow car, which she thinks is Tom's, Myrtle is struck and killed. Daisy was driving; Gatsby says he will take the blame. The car does not stop.
    topic_code: "3.F"
  - front: Gatsby's vigil (end of chapter 7)
    back: |
      Gatsby stands outside the Buchanans' house all night in case Daisy needs him, while inside she and Tom sit together at the kitchen table over cold chicken. Nick leaves him standing in the moonlight keeping watch over nothing: the vigil shows he has not changed.
    topic_code: "1.B"
  - front: Gatsby's story of 1917 (chapter 8)
    back: |
      Gatsby tells Nick the truth of Louisville: a penniless officer in Daisy's house "by a colossal accident," who "took what he could get, ravenously and unscrupulously" and found himself committed to her. The last version of the past.
    topic_code: "1.B"
  - front: '"They''re a rotten crowd ... You''re worth the whole damn bunch put together."'
    back: |
      Nick's parting shout to Gatsby in chapter 8. "It was the only compliment I ever gave him, because I disapproved of him from beginning to end." A sign of how far Nick has moved since chapter 1.
    topic_code: "1.B"
  - front: George Wilson after Myrtle's death (chapter 8)
    back: |
      Grief-maddened, Wilson looks at the eyes of Doctor T. J. Eckleburg and tells his neighbour Michaelis that God sees everything. He learns from Tom whose car it was, shoots Gatsby in his pool, and then kills himself.
    topic_code: "3.F"
  - front: The pool (chapter 8)
    back: |
      Gatsby swims for the first time all summer, waiting for a call from Daisy that does not come. Wilson finds him there. The death is quiet and almost unseen, in the place he never used.
    topic_code: "3.F"
  - front: The funeral (chapter 9)
    back: |
      Almost no one comes: Nick, Gatsby's father, a few servants, the postman, and Owl Eyes. Daisy and Tom have left without an address; Klipspringer calls only about a pair of tennis shoes; Wolfshiem will not come.
    topic_code: "1.B"
  - front: Henry C. Gatz
    back: |
      Gatsby's father, from Minnesota. He shows Nick a ragged copy of *Hopalong Cassidy* in which young Jimmy wrote a schedule of self-improvement. Proud and grieving, he sees his son's greatness in the house.
    topic_code: "1.B"
  - front: The Hopalong Cassidy schedule
    back: |
      A boy's timetable of exercise, study and "resolves" written in the back of a western. Evidence that James Gatz was building Jay Gatsby long before Dan Cody, and that the self-invention was earnest.
    topic_code: "1.B"
  - front: Nick and Jordan's ending (chapter 9)
    back: |
      Jordan tells Nick he was a "bad driver" too: careless to be so wrong about him, after she took him for "an honest, straightforward person." The charge turns his chapter 3 claim to honesty back on him.
    topic_code: "1.B"
  - front: Nick and Tom on Fifth Avenue (chapter 9)
    back: |
      Nick meets Tom in October. Tom admits he told Wilson the car was Gatsby's and feels justified. Nick: "I couldn't forgive him or like him, but I saw that what he had done was, to him, entirely justified."
    topic_code: "1.B"
  - front: '"They were careless people, Tom and Daisy"'
    back: |
      Nick's verdict in chapter 9: "they smashed up things and creatures and then retreated back into their money or their vast carelessness ... and let other people clean up the mess they had made." The Buchanans end as they began.
    topic_code: "1.B"
  - front: '"a story of the West, after all"'
    back: |
      Chapter 9: Nick decides Tom and Gatsby, Daisy and Jordan and he were all Westerners with "some deficiency in common which made us subtly unadaptable to Eastern life." He goes home to the Middle West.
    topic_code: "1.B"
  - front: '"So we beat on, boats against the current, borne back ceaselessly into the past."'
    back: |
      The novel's last sentence. "We" makes Gatsby's struggle everyone's: rowing toward the future, carried back by the past. The conflict Gatsby lost becomes a condition of human (and American) life.
    topic_code: "3.F"
  - front: Static and dynamic characters → in Gatsby
    back: |
      Gatsby, Tom and Daisy are static: they end wanting what they wanted (or keeping what they had). Nick is dynamic: he comes East to learn the bond business and goes home with a changed view of the East, of Gatsby and of himself.
    topic_code: "1.B"
  - front: Types of conflict → mapped onto Gatsby
    back: |
      Person against person: Tom and Gatsby. Person against self: Daisy's divided loyalty; Nick's ambivalence. Person against society: Gatsby against the class that will not admit him. Person against time: Gatsby's wish to repeat the past.
    topic_code: "3.F"

quiz:
  description: |
    22 questions · about 35 minutes · about two thirds on chapters 7-9 of The Great Gatsby (conflict, and which
    characters change) and a third spiral review of reliability, perspective, word choice, metaphor, setting, events,
    commentary and evidence. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the essay are graded by your teacher.
  questions:
    # ---- Passage set: Jordan's charge and the careless people (chapter 9)
    - slug: u09-w30-q01
      type: multiple_choice
      topic_code: "4.D"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: &w30a |
        *The following passages are from Chapter IX of F. Scott Fitzgerald's* The Great Gatsby *(1925). In the first, Jordan Baker speaks to Nick after he has ended their relationship; earlier in the novel Nick had told her she was a bad driver. In the second, Nick reflects after meeting Tom Buchanan on Fifth Avenue, where Tom has admitted telling George Wilson that the car that killed Myrtle was Gatsby's.*

        "You said a bad driver was only safe until she met another bad driver? Well, I met another bad driver, didn't I? I mean it was careless of me to make such a wrong guess. I thought you were rather an honest, straightforward person. I thought it was your secret pride."

        [...]

        I couldn't forgive him or like him, but I saw that what he had done was, to him, entirely justified. It was all very careless and confused. They were careless people, Tom and Daisy—they smashed up things and creatures and then retreated back into their money or their vast carelessness, or whatever it was that kept them together, and let other people clean up the mess they had made [...]
      prompt: |
        Jordan's charge that Nick was "another bad driver" most invites the reader to
      options:
        - "conclude that Jordan has been the novel's reliable narrator all along"
        - "reconsider Nick's claim, at the end of chapter 3, to be one of the few honest people he has known"
        - "dismiss Jordan's words, since she has been shown to be dishonest"
        - "learn that Nick caused the accident that killed Myrtle"
      option_explanations:
        - |
          Jordan is a character speaking in a scene that Nick narrates; she does not take over the narration.
        - |
          Correct. Jordan uses Nick's own metaphor of careless driving against him and names "honest, straightforward" as his "secret pride." The narrator who called himself honest is accused of carelessness in his own book, and he reports the charge.
        - |
          Her dishonesty does not cancel her point; that Nick includes the charge suggests he feels its force.
        - |
          Daisy was driving Gatsby's car; the "bad driver" here is a metaphor for carelessness in relationships.
      answer: 1
      explanation: |
        Spiral review (4.D, reliability, weeks 18 and 22). A narrator who records criticism of himself complicates his own reliability, in his favour and against it.

    - slug: u09-w30-q02
      type: multiple_choice
      topic_code: "1.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w30a
      prompt: |
        Nick's statement that Tom and Daisy "retreated back into their money or their vast carelessness" primarily suggests that they
      options:
        - "have been transformed by the tragedies of the summer"
        - "end the novel essentially unchanged, protected by wealth from the consequences that destroyed others"
        - "have lost their fortune and must start again"
        - "have separated for good"
      option_explanations:
        - |
          "Retreated back" means a return to where they started, not transformation. Nothing in the passage shows them learning anything.
        - |
          Correct. The verb "retreated back" and the image of others cleaning up "the mess they had made" make the Buchanans static characters. Their unchangedness is the point: the people who caused three deaths pay nothing.
        - |
          They retreat "into their money"; it is their shelter, not something lost.
        - |
          The passage speaks of "whatever it was that kept them together"; they remain a couple.
      answer: 1
      explanation: |
        1.B: a character who does not change can carry as much meaning as one who does. Here stasis is an indictment.

    - slug: u09-w30-q03
      type: multiple_choice
      topic_code: "5.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w30a
      prompt: |
        The phrase "smashed up things and creatures" is most effective because it
      options:
        - "refers only to the cars damaged during the summer"
        - "lumps people together with objects and animals, showing both the scale of the damage and how little the Buchanans distinguished between them"
        - "suggests that Tom and Daisy were cruel to animals"
        - "is an exaggeration Nick later withdraws"
      option_explanations:
        - |
          "Creatures" goes beyond cars: Myrtle, Wilson and Gatsby are among the damaged.
        - |
          Correct. Not "people" but "things and creatures": the diction reduces the victims, as the Buchanans' carelessness did. The phrase expresses Nick's anger and indicts their indifference at once.
        - |
          The word is figurative, a way of naming people without dignity; no animals are in question.
        - |
          The verdict stands as the last word on Tom and Daisy; Nick shakes Tom's hand but does not retract it.
      answer: 1
      explanation: |
        Spiral review (5.B, the function of specific words, week 4). Ask what a word includes and excludes.

    - slug: u09-w30-q04
      type: true_false
      topic_code: "1.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w30a
      prompt: |
        True or false: in the second paragraph, Nick says he can forgive Tom because he understands Tom's reasons.
      answer: false
      explanation: |
        False. "I couldn't forgive him or like him, but I saw that what he had done was, to him, entirely justified." Understanding is not forgiveness; the sentence shows the reserving of judgment from chapter 1 at its limit.

    - slug: u09-w30-q05
      type: short_answer
      topic_code: "1.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 3
      stimulus: *w30a
      prompt: |
        In two or three sentences, explain how these passages show that Nick has changed since chapter 1, and why that change matters to the novel.
      answer: |
        In chapter 1 Nick boasted that he was "inclined to reserve all judgements"; here he judges plainly ("They were careless people") and refuses to forgive, while also accepting Jordan's charge that he too was careless. The change matters because Nick is the only major character who learns anything: his movement from tolerance to judgment, and from self-praise to self-doubt, is what the novel offers in place of Gatsby's dream.
      explanation: |
        1 point: identifies a specific change (from reserving judgment to judging; from claiming honesty to being accused of carelessness). 1 point: supports it with evidence from the passage and a point of comparison earlier in the novel. 1 point: explains why the change matters (Nick as the dynamic centre; contrast with static Buchanans and Gatsby).

    # ---- Passage set: the ending (chapter 9)
    - slug: u09-w30-q06
      type: multiple_choice
      topic_code: "3.F"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: &w30b |
        *The following passage is from the last page of* The Great Gatsby *(1925). On his last night in the East, Nick sits on Gatsby's beach and imagines the island as the first Dutch sailors saw it.*

        [...] for a transitory enchanted moment man must have held his breath in the presence of this continent, compelled into an aesthetic contemplation he neither understood nor desired, face to face for the last time in history with something commensurate to his capacity for wonder.

        And as I sat there brooding on the old, unknown world, I thought of Gatsby's wonder when he first picked out the green light at the end of Daisy's dock. He had come a long way to this blue lawn, and his dream must have seemed so close that he could hardly fail to grasp it. He did not know that it was already behind him, somewhere back in that vast obscurity beyond the city, where the dark fields of the republic rolled on under the night.

        Gatsby believed in the green light, the orgastic future that year by year recedes before us. [...]

        So we beat on, boats against the current, borne back ceaselessly into the past.
      prompt: |
        How does this ending treat the novel's central conflict between Gatsby's longing and the passage of time?
      options:
        - "It shows Gatsby winning the conflict at last, because his dream comes true after his death."
        - "It widens the conflict from Gatsby's private struggle into a condition shared by everyone, the effort toward the future against the pull of the past."
        - "It abandons the conflict and turns to an unrelated history of the Dutch sailors."
        - "It blames Daisy alone for Gatsby's defeat."
      option_explanations:
        - |
          The dream "was already behind him"; the passage is a lament, not a victory.
        - |
          Correct. The pronouns move from "he" to "us" and "we," and the final image of boats rowing against a current generalises Gatsby's conflict with time. The ending resolves the plot by making its conflict universal.
        - |
          The sailors are the first viewers of the "fresh" continent, and their wonder is explicitly linked to Gatsby's ("I thought of Gatsby's wonder"). The history is the comparison, not a change of subject.
        - |
          Daisy is mentioned only through "Daisy's dock"; the passage concerns wonder, time and the past, not blame.
      answer: 1
      explanation: |
        3.F: the function of a conflict can be to reveal a theme. Endings often transform a conflict rather than settle it.

    - slug: u09-w30-q07
      type: multiple_choice
      topic_code: "4.C"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w30b
      prompt: |
        The shift in pronouns from "I" and "he" to "us" and "we" in the final two paragraphs primarily reveals that Nick
      options:
        - "has begun speaking for Tom and Daisy"
        - "now sees Gatsby's longing as something he and the reader share, not just a private delusion to be judged"
        - "is addressing the Dutch sailors directly"
        - "has lost interest in Gatsby's story"
      option_explanations:
        - |
          Nick has just condemned Tom and Daisy as "careless people"; the "we" is not a defence of them.
        - |
          Correct. The pronouns turn Nick from observer into participant: the future "recedes before us," and "we beat on." His final perspective includes himself and the reader in Gatsby's predicament.
        - |
          The sailors are in the third person ("man must have held his breath"); the "we" is Nick, his readers and people generally.
        - |
          The passage is entirely about Gatsby's wonder and what it means; it is the opposite of lost interest.
      answer: 1
      explanation: |
        Spiral review (4.C, perspective through diction and syntax, weeks 12 and 28). Pronouns are diction too.

    - slug: u09-w30-q08
      type: multiple_choice
      topic_code: "6.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w30b
      prompt: |
        In the final sentence, the metaphor of "boats against the current, borne back ceaselessly into the past" suggests that
      options:
        - "people make steady progress toward their goals if they persist"
        - "human effort is directed forward, but some stronger force keeps carrying us back toward what we have been"
        - "Nick plans to leave the East by boat"
        - "the past is a calm harbour where people are safe"
      option_explanations:
        - |
          The boats are "borne back ceaselessly"; persistence does not bring progress.
        - |
          Correct. "Beat on" is effort; "against the current" is resistance; "borne back ceaselessly" is the result. The metaphor holds Gatsby's hope and its defeat in one image.
        - |
          The image is figurative, and "we" includes more than Nick.
        - |
          The current is something we fight; the past is where we are carried against our will, not a refuge.
      answer: 1
      explanation: |
        Spiral review (6.B, metaphor, weeks 6 and 16). Read each part of the vehicle in order: the verb, the obstacle, the outcome.

    - slug: u09-w30-q09
      type: multiple_choice
      topic_code: "2.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w30b
      prompt: |
        The phrase "the dark fields of the republic rolled on under the night" functions chiefly to
      options:
        - "describe the view from Gatsby's lawn"
        - "connect Gatsby's dream to the larger American landscape and history, including the Middle West he came from"
        - "introduce a new setting for a sequel"
        - "suggest that the farms of the Middle West are prosperous"
      option_explanations:
        - |
          From the lawn Nick sees the water and the light; the fields lie "somewhere back in that vast obscurity beyond the city," out of sight.
        - |
          Correct. "The republic" makes the landscape national; the fields recall the farm Gatsby fled and the continent the sailors first saw. The setting enlarges a personal story into an American one.
        - |
          The novel ends here; the setting is symbolic, not a lead-in.
        - |
          The fields are "dark" and "rolled on under the night," images of vastness and obscurity, not prosperity.
      answer: 1
      explanation: |
        Spiral review (2.B, the function of setting, week 11). Final settings often carry the theme.

    - slug: u09-w30-q10
      type: fill_blank
      topic_code: "5.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w30b
      prompt: |
        Complete the novel's last sentence: "So we beat on, boats against the ____, borne back ceaselessly into the past."
      answer: ["current"]
      explanation: |
        "Current." Spiral review (5.B). The single word is the force the whole novel has been fighting.

    # ---- Chapters 7-9 beyond the passages
    - slug: u09-w30-q11
      type: multiple_choice
      topic_code: "3.F"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      prompt: |
        At the Plaza Hotel in chapter 7, Gatsby demands that Daisy tell Tom she never loved him. She sobs, "I did love him once—but I loved you too." What is the main function of this moment in the conflict?
      options:
        - "It confirms Gatsby's victory over Tom."
        - "It exposes the impossibility of Gatsby's demand to erase the past, and Daisy's divided feelings decide the conflict in Tom's favour."
        - "It reveals that Daisy never loved Gatsby."
        - "It reconciles Tom and Gatsby."
      option_explanations:
        - |
          Gatsby wanted the past cancelled; Daisy's "once" keeps it alive, and Tom immediately takes control.
        - |
          Correct. Gatsby's conflict was never only with Tom but with time. Daisy cannot say what he needs, and her internal conflict, love for both, resolves the external one against him.
        - |
          "I loved you too" affirms her love for Gatsby; the problem is that she loved Tom as well.
        - |
          Tom's hostility only grows; he exposes Gatsby's drugstores and then, contemptuously sure of Daisy, sends her home in Gatsby's car.
      answer: 1
      explanation: |
        3.F: an external conflict can be decided by an internal one. Explain how one produces the other.

    - slug: u09-w30-q12
      type: multiple_choice
      topic_code: "1.E"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      prompt: |
        In chapter 7 Gatsby says suddenly of Daisy, "Her voice is full of money." What does his own remark reveal about him?
      options:
        - "That he despises Daisy for her wealth"
        - "That he half understands his love is bound up with the wealth and glamour she embodies, though the understanding changes nothing"
        - "That he is planning to marry Daisy for her money alone"
        - "That he has decided to give up his pursuit"
      option_explanations:
        - |
          The remark is admiring, not scornful; Nick hears in it "the jingle of it, the cymbals' song of it."
        - |
          Correct. Gatsby sees, as Nick does only now ("I'd never understood before"), that Daisy's charm and her money are inseparable. That he says it and pursues her anyway is the complexity.
        - |
          Gatsby is already rich; the remark is about what Daisy's voice means to him, not a calculation.
        - |
          He goes to the Plaza hours later to claim her; nothing is given up.
      answer: 1
      explanation: |
        Spiral review (1.E, choices and speech reveal complexity, weeks 17 and 28).

    - slug: u09-w30-q13
      type: multiple_choice
      topic_code: "1.B"
      source: "general knowledge"
      points: 1
      prompt: |
        After Myrtle's death, Gatsby stands all night outside the Buchanans' house in case Daisy needs him, while she and Tom sit together inside at the kitchen table. In chapter 8 he waits by his pool for her call. Which best explains the function of Gatsby remaining unchanged after the Plaza?
      options:
        - "It shows he has learned from his defeat."
        - "It shows his fidelity to his dream surviving every proof against it, which makes him both heroic and doomed."
        - "It proves that Daisy has secretly chosen Gatsby."
        - "It shows Gatsby planning revenge on Tom."
      option_explanations:
        - |
          The vigil and the waiting show the opposite: he acts as if the dream still holds.
        - |
          Correct. Nick said in chapter 6 that Gatsby was "faithful to the end" to his conception of himself. His refusal to change is the source of the "gift for hope" Nick admires and of his death.
        - |
          The scene in the kitchen shows Daisy and Tom reunited in a kind of conspiracy; no call comes.
        - |
          Gatsby takes the blame for the accident to protect Daisy; he plans no revenge.
      answer: 1
      explanation: |
        1.B: an unchanged character's constancy can be a virtue and a fatal flaw at once.

    - slug: u09-w30-q14
      type: multiple_choice
      topic_code: "3.F"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      prompt: |
        At the Plaza, Tom sneers at "Mr. Nobody from Nowhere" making love to his wife and warns that "people begin by sneering at family life and family institutions." What does this speech reveal about the conflict between Tom and Gatsby?
      options:
        - "It is purely a romantic rivalry with no wider meaning."
        - "It is also a class conflict, in which established wealth defends its privileges as morality, with obvious hypocrisy from a man who keeps a mistress."
        - "It shows Tom's deep commitment to his family."
        - "It reveals that Gatsby has attacked family institutions in public."
      option_explanations:
        - |
          "Nobody from Nowhere" is about origins, not love; the insult is social.
        - |
          Correct. Tom attacks Gatsby's lack of pedigree and casts himself as guardian of the family and of racial and social order, though he has been with Myrtle all summer. The rivalry over Daisy carries the novel's conflict between old and new money.
        - |
          His affair with Myrtle, and earlier ones, make the speech hypocritical rather than devoted.
        - |
          Gatsby has said nothing of the kind; Tom invents the threat.
      answer: 1
      explanation: |
        3.F: name every level of a conflict. Personal, social and moral conflicts often run through one scene.

