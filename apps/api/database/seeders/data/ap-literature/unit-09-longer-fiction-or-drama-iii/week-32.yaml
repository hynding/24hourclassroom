    - slug: u09-w32-q22
      type: long_answer
      topic_code: "7.B"
      source: "general knowledge"
      points: 6
      prompt: |
        In many works of literature, a character comes to recognize that a role he or she has played, or been given, is false. That recognition may free the character, destroy the character, or both.

        Either from your own reading or from the list below, choose a work of fiction or drama in which a character recognizes that a role is false. Then, in a well-written essay, analyze how that recognition contributes to an interpretation of the work as a whole. Do not merely summarize the plot.

        Suggested works from this course: *A Doll's House* (Henrik Ibsen); *The Great Gatsby* (F. Scott Fitzgerald); *Frankenstein* (Mary Shelley); *Hamlet* (William Shakespeare); "The Yellow Wall-Paper" (Charlotte Perkins Gilman); "Young Goodman Brown" (Nathaniel Hawthorne).

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Provide evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        A strong response on A Doll's House: Thesis: Nora's recognition that she has been a "doll-wife" frees her only by costing her everything the play first presented as happiness, so Ibsen makes self-knowledge both the play's victory and its tragedy. Line of reasoning: (1) the role established and half-seen in Acts I-II ("lark," "squirrel," "something in reserve," the tarantella as desperate performance); (2) the recognition, triggered by the failure of "the miracle" when Helmer thinks only of himself, and named in "I lived by performing tricks for you" and "doll-wife ... doll-child"; (3) the consequence: "before all else I am a human being ... or at least that I should try to become one," the rings returned, the children left, and Helmer's unchanged hope for "the miracle of miracles." Equally strong essays could use Gatsby (Nick's recognition of the "careless people" and of his own carelessness), Frankenstein (the creature recognizing his place through the De Laceys) or Hamlet (Act V's acceptance after the role of revenger).
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis that names a character, the false role and how the recognition contributes to the meaning of the whole work. A restatement of the prompt or a thesis that only says the character "realizes something" earns 0.
        Row B Evidence and Commentary (0-4): 1 = summary of the work with little connection to recognition. 2 = some relevant evidence (moments or phrases) with general commentary. 3 = specific evidence from several parts of the work (the role, the moment of recognition, its consequences) with commentary that explains how each supports the line of reasoning. 4 = well-chosen, sufficient evidence across the whole work with consistent commentary that builds a clear line of reasoning to an interpretation of the whole.
        Row C Sophistication (0-1): 1 point for complexity: showing the recognition as both liberation and loss; considering a counter-reading (e.g. Helmer's view, or Nick's own carelessness); placing the work in its context (Ibsen's audience in 1879, the Jazz Age); or a consistently vivid, precise style.
