guide: guides/week-32.md
guide_description: |
  Act III of A Doll's House, from the letter to the closing door, and then the literary argument essay (Q3): how to
  read a prompt, write a thesis with a line of reasoning, and choose sufficient evidence from any of the year's works,
  with model theses and paragraphs on Nora, Gatsby, Victor Frankenstein, Hamlet and the short stories.
flashcards_description: |
  28 cards on the events and lines of A Doll's House, Act III, and on planning and writing the Q3 literary argument
  essay with the year's works.

flashcards:
  - front: Doll's House Act III → the opening scene
    back: |
      While the Helmers are at the fancy-dress ball upstairs, Mrs. Linden meets Krogstad in their flat. They were once in love; she offers to marry him. Krogstad offers to ask for his letter back, but Mrs. Linden decides Helmer must know everything.
    topic_code: "7.D"
  - front: Mrs. Linden's decision → why she lets the letter stay
    back: |
      She tells Krogstad that the secret must come out, so that husband and wife can come to a full understanding. She chooses truth over rescue, the opposite of the "miracle" Nora hopes for.
    topic_code: "7.D"
  - front: Dr. Rank's visiting cards
    back: |
      Late in Act III Helmer finds two of Rank's cards in the letter-box, each with a black cross above the name: Rank's announcement that he has gone home to die. It delays the letter by moments and darkens the house.
    topic_code: "7.D"
  - front: Helmer reads Krogstad's letter
    back: |
      He turns on Nora in fury: she has ruined his happiness, he will be at Krogstad's mercy, she is unfit to bring up the children. His concern is his reputation; he never offers to take the blame.
    topic_code: "7.D"
  - front: The second letter
    back: |
      Krogstad, changed by Mrs. Linden, returns the forged bond. Helmer is overjoyed at being saved and at once "forgives" Nora, speaking of the wife he has "forgiven ... from the bottom of his heart."
    topic_code: "7.D"
  - front: '"at once his wife and his child"'
    back: |
      Helmer's phrase in Act III for what a forgiven wife becomes to her husband. He means it tenderly; the audience hears exactly the doll-marriage Nora is about to name.
    topic_code: "7.B"
  - front: '"now I have changed my dress"'
    back: |
      Nora takes off her fancy dress while Helmer talks, and returns in everyday clothes. The costume of the tarantella and of the doll comes off before the reckoning; a stage action that says the performance is over.
    topic_code: "7.B"
  - front: '"I have been your doll-wife, just as at home I used to be papa''s doll-child."'
    back: |
      Nora's diagnosis of her life in Act III: "our house has been nothing but a play-room," and the children "have been my dolls." The title's metaphor, spoken aloud for the first time.
    topic_code: "7.B"
  - front: '"I lived by performing tricks for you, Torvald."'
    back: |
      Nora in Act III: she passed "from father's hands into yours," took his tastes "or pretended to," and lived "like a beggar, from hand to mouth." Her earlier performance reread as dependency.
    topic_code: "7.D"
  - front: '"My duties towards myself."'
    back: |
      Nora's answer when Helmer says she is forsaking her "holiest duties" to husband and children. "I have other duties equally sacred." The centre of the argument in Act III.
    topic_code: "7.B"
  - front: '"I believe that before all else I am a human being"'
    back: |
      Nora's reply to "Before all else you are a wife and a mother": "That I no longer believe. I believe that before all else I am a human being, just as much as you are—or at least that I should try to become one."
    topic_code: "7.B"
  - front: '"the miracle did not happen"'
    back: |
      Nora tells Helmer that she stopped loving him "this evening, when the miracle did not happen": she had expected him to take the guilt on himself, and he thought only of himself.
    topic_code: "7.D"
  - front: '"I was your lark again, your doll"'
    back: |
      Nora's account of Helmer's forgiveness: once the danger passed, "I was your lark again, your doll, just as before—whom you would take twice as much care of in future [...]." Why forgiveness is not enough.
    topic_code: "7.D"
  - front: The rings
    back: |
      Before leaving, Nora returns Helmer's ring and asks for hers. She releases him from all duties toward her and asks the same freedom: "There must be perfect freedom on both sides."
    topic_code: "7.D"
  - front: '"the miracle of miracles"'
    back: |
      Helmer asks if he can ever be more than a stranger to her. Nora: only if "the miracle of miracles" happened, both of them so changed that their life together would be a real marriage. Alone, Helmer repeats the phrase with a flicker of hope as she goes.
    topic_code: "7.B"
  - front: The ending of A Doll's House
    back: |
      Nora leaves with her travelling-bag; Helmer, alone, finds the room empty ("She is gone") and the sound of the street door closes the play. The ending caused scandal across Europe, and Ibsen wrote an alternative ending for a German production.
    topic_code: "7.D"
  - front: Nora → static or dynamic?
    back: |
      The play's dynamic character: from "lark" to a woman who judges her marriage, her father and her society and leaves to educate herself. Helmer is static: his forgiveness restores the old arrangement.
    topic_code: "7.B"
  - front: Q3 literary argument → what the prompt gives you
    back: |
      A literary concept or situation (e.g. a character in conflict with a community, a symbolic object, a moment of recognition), and the task: choose a work and analyze how that element contributes to an interpretation of the work as a whole.
    topic_code: "7.B"
  - front: Q3 → choosing the work
    back: |
      Pick the work you know best that fits the prompt cleanly, not the most impressive one. Novels and plays work best: you need several moments across the whole work, and you must be able to discuss the work as a whole.
    topic_code: "7.D"
  - front: Q3 thesis → the minimum and the target
    back: |
      Minimum (Row A): a defensible claim that answers the prompt about a specific work. Target: a claim plus a line of reasoning (the two or three reasons your essay will develop) and an interpretation of the work as a whole.
    topic_code: "7.B"
  - front: Line of reasoning
    back: |
      The logical path your essay follows: a sequence of claims, each building on the last, that together prove the thesis. Body paragraphs should be steps in an argument, not a list of examples.
    topic_code: "7.B"
  - front: Relevant vs sufficient evidence (7.D)
    back: |
      Relevant: it actually supports the claim it is placed under. Sufficient: there is enough of it, from enough of the work (beginning, middle, end), to make the claim convincing. One famous quotation is rarely sufficient.
    topic_code: "7.D"
  - front: Q3 evidence → quotation or reference?
    back: |
      From memory, precise reference is fine: name the moment, who acts, what changes. A short exact phrase you are sure of ("I would prefer not to") is strong; a long misquotation is weak. Specificity matters more than quotation marks.
    topic_code: "7.D"
  - front: Q3 → the "work as a whole" requirement
    back: |
      Every Q3 prompt asks how the element "contributes to an interpretation of the work as a whole." Your thesis must say what the work means, not just what the character does; your last paragraph should arrive at that meaning.
    topic_code: "7.B"
  - front: Q3 → summary trap
    back: |
      The most common reason for a low Row B score: retelling the plot in order. Every piece of evidence needs commentary that says how it supports your claim. A rule of thumb: at least as much explanation as narration.
    topic_code: "7.D"
  - front: Q3 sophistication (Row C)
    back: |
      Earned by complexity: explaining tensions within the work, considering an alternative reading, placing the work in a broader context, or writing with consistent vividness. It is earned across the essay, not by a single sentence.
    topic_code: "7.B"
  - front: The year's works for Q3 → a quick map
    back: |
      Frankenstein (creation, responsibility, isolation); Hamlet (delay, revenge, performance, conscience); The Great Gatsby (self-invention, class, a dream against time); A Doll's House (roles, secrets, marriage, self-discovery); short stories such as "Young Goodman Brown," "The Yellow Wall-Paper" and "Bartleby" for prompts about isolation, perception and resistance.
    topic_code: "7.D"
  - front: Q3 timing → about 40 minutes
    back: |
      Section II is two hours for three essays. For Q3: about 5 minutes to choose a work and plan a thesis and three steps, about 30 minutes to write, a few to reread the thesis against the conclusion.
    topic_code: "7.B"

quiz:
  description: |
    22 questions · about 40 minutes · Act III of A Doll's House and the literary argument essay (Q3): theses, lines of
    reasoning and evidence drawn from A Doll's House, The Great Gatsby, Frankenstein, Hamlet and the short stories, with
    a spiral review of change, metaphor, relationships, conflict, contrast and commentary. Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    Q3 essay are graded by your teacher.
  questions:
    # ---- Passage set: the doll-wife (Act III)
    - slug: u09-w32-q01
      type: multiple_choice
      topic_code: "1.B"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: &w32a |
        *The following passage is from Act III of Henrik Ibsen's* A Doll's House *(1879), in William Archer's translation. Helmer has learned of Nora's forgery and then, when the danger passed, forgiven her. Nora has asked him to sit down and talk seriously, and has described how her father passed his opinions on to her and played with her as she played with her dolls.*

        HELMER. What an expression to use about our marriage!

        NORA. [*Undisturbed.*] I mean I passed from father's hands into yours. You arranged everything according to your taste; and I got the same tastes as you; or I pretended to—I don't know which—both ways, perhaps; sometimes one and sometimes the other. When I look back on it now, I seem to have been living here like a beggar, from hand to mouth. I lived by performing tricks for you, Torvald. But you would have it so. You and father have done me a great wrong. It is your fault that my life has come to nothing.

        HELMER. Why, Nora, how unreasonable and ungrateful you are! Have you not been happy here?

        [...]

        NORA. No; only merry. And you have always been so kind to me. But our house has been nothing but a play-room. Here I have been your doll-wife, just as at home I used to be papa's doll-child. And the children, in their turn, have been my dolls. I thought it fun when you played with me, just as the children did when I played with them. That has been our marriage, Torvald.
      prompt: |
        Compared with her conversation with Mrs. Linden in Act I, where she praised "our beautiful, happy home," Nora's speeches here most clearly show that she
      options:
        - "has not changed, but is now acting a new part to punish Helmer"
        - "has come to see her marriage from the outside and to name the role she played, a change in understanding that drives her decision to leave"
        - "has been unhappy all along and said so openly in Act I"
        - "blames only her father, not Helmer"
      option_explanations:
        - |
          The stage direction "[Undisturbed]" and the measured analysis suggest calm conviction, not a new performance; the point of the scene is that the acting has stopped.
        - |
          Correct. "When I look back on it now" marks a new vantage point. The woman who called her home happy now calls it "a play-room" and herself a "doll-wife." Her change is a change of understanding, and the departure follows from it.
        - |
          In Act I she insisted she was happy and broke off when she approached doubt ("Nonsense! nonsense!"); the recognition is new.
        - |
          "You and father have done me a great wrong" blames both.
      answer: 1
      explanation: |
        Spiral review (1.B, a character changing, weeks 8, 23 and 30). Comparing a character's words at two points is the clearest evidence of change.

    - slug: u09-w32-q02
      type: multiple_choice
      topic_code: "6.B"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w32a
      prompt: |
        The metaphor of the house as "a play-room" and Nora as a "doll-wife" is extended to the children ("have been my dolls"). The extension primarily suggests that
      options:
        - "Nora has been a neglectful mother"
        - "the pattern of treating a person as a plaything has passed from father to husband to Nora herself, so it is a system, not one man's fault"
        - "the children are too young to understand their parents"
        - "Nora wants to buy her children more toys"
      option_explanations:
        - |
          She describes playing with them happily; the point is not neglect but that she has repeated with them the only relationship she knew.
        - |
          Correct. Father to daughter, husband to wife, mother to children: the metaphor runs through three generations. Nora includes herself, which makes her diagnosis more honest and the problem larger than Helmer.
        - |
          The metaphor concerns how they have been treated, not their understanding.
        - |
          "Dolls" is figurative; the literal toys of Act I's Christmas become the play's central image.
      answer: 1
      explanation: |
        Spiral review (6.B, metaphor, weeks 6, 16 and 27). Track how far a metaphor is extended and what each extension adds.

    - slug: u09-w32-q03
      type: multiple_choice
      topic_code: "1.D"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w32a
      prompt: |
        Nora's sentence "And you have always been so kind to me" contributes to the complexity of the relationship chiefly by
      options:
        - "retracting her accusation entirely"
        - "acknowledging Helmer's real affection, so that the problem is shown to be the structure of the marriage rather than cruelty"
        - "flattering Helmer so that he will let her stay"
        - "revealing that Helmer has secretly agreed with her"
      option_explanations:
        - |
          The next sentence begins "But," and the accusation stands: kindness does not undo the "play-room."
        - |
          Correct. The concession is fair and therefore damning: a kind husband can still keep a wife as a doll. Ibsen makes the argument harder to dismiss by refusing to make Helmer a brute.
        - |
          Nora is about to leave; she is not seeking to stay, and the tone is "Undisturbed," not pleading.
        - |
          Helmer has just called her "unreasonable and ungrateful"; he does not agree.
      answer: 1
      explanation: |
        Spiral review (1.D, nuances in relationships, weeks 12, 23 and 31).

    - slug: u09-w32-q04
      type: multiple_choice
      topic_code: "7.D"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w32a
      prompt: |
        A student claims: "Nora recognises that she has never had a self of her own, only borrowed tastes." Which piece of evidence from the passage best supports this claim?
      options:
        - "\"Have you not been happy here?\""
        - "\"You arranged everything according to your taste; and I got the same tastes as you; or I pretended to—I don't know which\""
        - "\"And the children, in their turn, have been my dolls.\""
        - "\"What an expression to use about our marriage!\""
      option_explanations:
        - |
          Helmer's question, not Nora's recognition; it shows his view.
        - |
          Correct. Relevant and precise: she cannot tell whether her tastes were ever her own or only performed, which is exactly the absence of a self the claim describes.
        - |
          Relevant to the pattern of the doll-house, but it concerns her treatment of the children, not her own lack of self.
        - |
          Helmer's outrage; it says nothing about Nora's self-knowledge.
      answer: 1
      explanation: |
        7.D: the best evidence matches the claim's exact terms (here, "borrowed tastes").

    - slug: u09-w32-q05
      type: fill_blank
      topic_code: "5.B"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w32a
      prompt: |
        "Here I have been your doll-wife, just as at home I used to be papa's doll-____."
      answer: ["child"]
      explanation: |
        "Doll-child." Spiral review (5.B, specific words). The compound nouns turn the title into a diagnosis.

    - slug: u09-w32-q06
      type: short_answer
      topic_code: "7.B"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 2
      stimulus: *w32a
      prompt: |
        Write a defensible thesis (one or two sentences) about how this passage contributes to an interpretation of *A Doll's House* as a whole.
      answer: |
        By having Nora name herself a "doll-wife" and her house "a play-room," Ibsen turns the play's comic opening (the lark, the macaroons, the dance) into evidence, so the whole play becomes the record of a performance that only Nora finally sees through.
      explanation: |
        1 point: a defensible claim tied to the passage. 1 point: it reaches the work as a whole (how the passage reinterprets earlier acts or explains the ending), establishing a line of reasoning.

    # ---- Passage set: duties (Act III)
    - slug: u09-w32-q07
      type: multiple_choice
      topic_code: "3.F"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: &w32b |
        *The following passage is from later in the same scene of Act III of* A Doll's House *(1879), in William Archer's translation. Nora has told Helmer she is leaving him and the children.*

        NORA. I can pay no heed to that. I only know that I must do it.

        HELMER. This is monstrous! Can you forsake your holiest duties in this way?

        NORA. What do you consider my holiest duties?

        HELMER. Do I need to tell you that? Your duties to your husband and your children.

        NORA. I have other duties equally sacred.

        HELMER. Impossible! What duties do you mean?

        NORA. My duties towards myself.

        HELMER. Before all else you are a wife and a mother.

        NORA. That I no longer believe. I believe that before all else I am a human being, just as much as you are—or at least that I should try to become one. [...]
      prompt: |
        The conflict in this exchange is best described as one between
      options:
        - "two rival lovers for Nora's affection"
        - "Helmer's conception of a woman's identity as defined by her roles and Nora's claim to an identity prior to those roles"
        - "Nora and the law, which forbids her to leave"
        - "Nora's love for her children and her hatred of them"
      option_explanations:
        - |
          No rival appears; the conflict is between husband and wife about what a wife is.
        - |
          Correct. "Before all else you are a wife and a mother" against "before all else I am a human being": the parallel phrasing sets two definitions of a person against each other. The marital conflict has become a conflict of ideas.
        - |
          Neither speaks of the law here; Helmer appeals to "holiest duties," a moral and religious claim.
        - |
          Nothing in the passage shows hatred of the children; the conflict is between duties to them and duties to herself.
      answer: 1
      explanation: |
        Spiral review (3.F, conflict, weeks 7, 30 and 31). Look for repeated phrasing that sets two positions against each other.

    - slug: u09-w32-q08
      type: multiple_choice
      topic_code: "1.E"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w32b
      prompt: |
        Nora's qualification "or at least that I should try to become one" reveals that she
      options:
        - "is unsure whether she should leave after all"
        - "sees her departure not as the achievement of selfhood but as the beginning of an effort to reach it"
        - "believes she is already superior to Helmer"
        - "intends to return once she has become a human being"
      option_explanations:
        - |
          "I only know that I must do it": she is certain about leaving. The qualification is about what she is, not what she will do.
        - |
          Correct. The dash and "at least" are honest: she does not claim to be a full person yet, only to need the chance to become one. The modesty makes the claim harder to dismiss as vanity.
        - |
          She claims equality ("just as much as you are"), not superiority.
        - |
          Return depends, later, on "the miracle of miracles"; this line says nothing about coming back.
      answer: 1
      explanation: |
        Spiral review (1.E, speech reveals complexity, weeks 17, 28 and 31). Qualifications are where characters are most precise about themselves.

    - slug: u09-w32-q09
      type: true_false
      topic_code: "3.D"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w32b
      prompt: |
        True or false: Helmer's "Before all else you are a wife and a mother" and Nora's "before all else I am a human being" use parallel phrasing to sharpen the contrast between their positions.
      answer: true
      explanation: |
        True. Nora takes Helmer's words ("before all else") and changes the ending. Spiral review (3.D, contrast, weeks 5, 17 and 25): a contrast placed in matching syntax is hard to miss.

    - slug: u09-w32-q10
      type: multi_select
      topic_code: "7.D"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 2
      partial_credit: true
      prompt: |
        A student is writing on the claim: "Helmer's forgiveness proves that he has not changed at all." Select the TWO pieces of evidence from Act III that are most relevant and, together, sufficient.
      options:
        - "Helmer speaks of a man who has forgiven his wife as gaining one who is \"at once his wife and his child.\""
        - "Nora says that after the danger passed she was \"your lark again, your doll, just as before.\""
        - "Mrs. Linden and Krogstad agree to marry."
        - "Dr. Rank leaves his visiting cards marked with a black cross."
      option_explanations:
        - |
          Correct. Helmer's own words show forgiveness restoring the old relation, wife as child, which is the claim.
        - |
          Correct. Nora's reading of the same moment confirms it from the other side; with the first, the evidence is both relevant and sufficient.
        - |
          A significant event, and a contrasting model of marriage, but it concerns other characters and does not show whether Helmer changed.
        - |
          Rank's farewell darkens the act but says nothing about Helmer's forgiveness.
      answer: [0, 1]
      explanation: |
        7.D: choose evidence that addresses the claim's key term ("not changed") and use more than one angle on it.

    - slug: u09-w32-q11
      type: multiple_choice
      topic_code: "7.B"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following is the strongest thesis for an essay on how Nora's departure contributes to the meaning of *A Doll's House*?
      options:
        - "At the end of A Doll's House, Nora leaves her husband and children."
        - "A Doll's House is a very important play that shocked audiences in 1879."
        - "Nora's departure, which follows the failure of the 'miracle' she hoped for, completes Ibsen's argument that a marriage built on performance cannot survive the truth, and that a woman must first become a person before she can be a wife."
        - "Nora leaves because Helmer is mean, which teaches us to be nice to our spouses."
      option_explanations:
        - |
          A fact from the plot, not a claim anyone could dispute; it earns no thesis point.
        - |
          True but off the prompt: it says nothing about how the departure creates meaning.
        - |
          Correct. Defensible, specific to the departure, and it sets a line of reasoning (the failed miracle, performance against truth, personhood before roles) that reaches the work as a whole.
        - |
          An oversimplified moral; "mean" misreads Helmer, whom Nora calls "so kind," and the claim offers no line of reasoning.
      answer: 2
      explanation: |
        7.B: a thesis must be arguable, answer the prompt, and preferably point to the reasons that will prove it.

    - slug: u09-w32-q12
      type: multiple_choice
      topic_code: "7.B"
      source: "general knowledge"
      points: 1
      prompt: |
        A Q3 prompt asks students to choose a work in which a character creates an identity that others do not accept, and to analyze how that conflict contributes to the meaning of the work. Which thesis best responds?
      options:
        - "In The Great Gatsby, Gatsby is a mysterious man who throws many parties."
        - "In The Great Gatsby, Gatsby's self-invention, which Tom dismisses as 'Mr. Nobody from Nowhere,' exposes a class system that will admire new money's display but never admit its makers, so the novel becomes an elegy for a dream that the society it was built for refuses to honour."
        - "Identity is important in many novels, including The Great Gatsby, Frankenstein and Hamlet."
        - "The Great Gatsby is set in 1922 on Long Island and in New York."
      option_explanations:
        - |
          A description, not an argument, and it does not address the conflict over identity.
        - |
          Correct. Specific work, specific conflict, clear claim about meaning (class, elegy) and an implied line of reasoning (invention, rejection, consequence).
        - |
          Too general to defend and names several works; Q3 asks for one work analysed in depth.
        - |
          A fact about setting that does not respond to the prompt.
      answer: 1
      explanation: |
        7.B: for Q3, the thesis should name the work, answer the prompt's specific situation, and say what it contributes to the whole.

    - slug: u09-w32-q13
      type: multiple_choice
      topic_code: "7.D"
      source: "general knowledge"
      points: 1
      prompt: |
        For the claim "In Frankenstein, Victor's refusal to take responsibility for what he made, rather than the creature's nature, produces the tragedy," which set of evidence is most relevant and sufficient?
      options:
        - "Victor's studies at Ingolstadt and his reading of the alchemists"
        - "Victor fleeing the creature on the night it comes alive, staying silent while Justine is tried and executed for William's murder, and destroying the half-made companion he had promised"
        - "Walton's letters to his sister about the Arctic"
        - "Elizabeth's adoption by the Frankenstein family"
      option_explanations:
        - |
          Background to the creation, relevant to ambition, but it does not show refusal of responsibility after the creation.
        - |
          Correct. Three moments from the beginning, middle and later part of the novel, each a choice to abandon a responsibility: to the creature, to Justine, to his promise. Relevant and sufficient.
        - |
          The frame matters to the novel's structure but does not bear on Victor's responsibility.
        - |
          An early family detail with no direct bearing on the claim.
      answer: 1
      explanation: |
        7.D: sufficient evidence comes from across the work and addresses the claim's key word ("refusal").

    - slug: u09-w32-q14
      type: multiple_choice
      topic_code: "7.B"
      source: "general knowledge"
      points: 1
      prompt: |
        A student plans a Q3 essay on Hamlet with this thesis: "Hamlet delays." What is the main problem, and which revision fixes it?
      options:
        - "It is too long; revise to 'Hamlet waits.'"
        - "It states a fact rather than an interpretation; revise to 'Hamlet's delay, from sparing Claudius at prayer to his calm acceptance of providence in Act V, turns a revenge plot into a study of conscience, showing that the act Hamlet resists is the one that would make him like Claudius.'"
        - "It names the wrong play; revise to discuss Macbeth."
        - "It is too interpretive; revise to 'Hamlet is the Prince of Denmark.'"
      option_explanations:
        - |
          Shortening makes the problem worse; the issue is the lack of a claim about meaning.
        - |
          Correct. The revision is arguable, specific (two moments that define a line of reasoning) and reaches the work as a whole.
        - |
          Hamlet is an excellent choice for a prompt about delay; switching works does not fix a weak thesis.
        - |
          Even less interpretive; a thesis must make a claim that requires defence.
      answer: 1
      explanation: |
        7.B: "Hamlet delays" is the starting observation; the thesis is why it matters.

