unit: 9
description: |
  43 questions · about 90 minutes · Unit 9: The Great Gatsby and A Doll's House. Four passage sets in the style of
  Section I (the valley of ashes; Helmer on lying parents; an unseen opening from Edith Wharton's The House of Mirth;
  Gatsby in Louisville), then standalone questions on character, conflict, change and the literary argument, a
  prose-analysis essay (Q2) on the Wharton passage and a literary-argument essay (Q3). Multiple choice, select-all and
  true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
  two essays are graded by your teacher on the AP rubric.
questions:
  # ---- Set 1: The valley of ashes (Gatsby, chapter 2)
  - slug: u09-exam-q01
    type: multiple_choice
    topic_code: "5.D"
    source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
    points: 1
    stimulus: &ex1 |
      *The following passage opens Chapter II of F. Scott Fitzgerald's* The Great Gatsby *(1925).*

      About halfway between West Egg and New York the motor road hastily joins the railroad and runs beside it for a quarter of a mile, so as to shrink away from a certain desolate area of land. This is a valley of ashes—a fantastic farm where ashes grow like wheat into ridges and hills and grotesque gardens; where ashes take the forms of houses and chimneys and rising smoke and, finally, with a transcendent effort, of ash-grey men, who move dimly and already crumbling through the powdery air. Occasionally a line of grey cars crawls along an invisible track, gives out a ghastly creak, and comes to rest, and immediately the ash-grey men swarm up with leaden spades and stir up an impenetrable cloud, which screens their obscure operations from your sight.

      But above the grey land and the spasms of bleak dust which drift endlessly over it, you perceive, after a moment, the eyes of Doctor T. J. Eckleburg. The eyes of Doctor T. J. Eckleburg are blue and gigantic—their retinas are one yard high. They look out of no face, but, instead, from a pair of enormous yellow spectacles which pass over a nonexistent nose. Evidently some wild wag of an oculist set them there to fatten his practice in the borough of Queens, and then sank down himself into eternal blindness, or forgot them and moved away. But his eyes, dimmed a little by many paintless days, under sun and rain, brood on over the solemn dumping ground.
    prompt: |
      The imagery of the first paragraph primarily presents the valley of ashes as
    options:
      - "a productive farming region that feeds the city"
      - "a grotesque inversion of a farm, where the only crop is waste and even the people seem made of ash"
      - "a beautiful landscape spoiled by a few careless workers"
      - "a place of mystery that the narrator longs to explore"
    option_explanations:
      - |
        The "farm" grows ashes "like wheat"; the comparison is ironic, and nothing here feeds anyone.
      - |
        Correct. Ridges, hills, gardens, houses, smoke and finally men all "grow" from ash. The farm imagery is turned inside out, and the climax of the sentence, "ash-grey men ... already crumbling," makes the people products of the waste.
      - |
        The land is "desolate" from the start; there is no earlier beauty, and the workers are part of the scene rather than its spoilers.
      - |
        The road "shrink[s] away" from the area; the tone is revulsion, not longing.
    answer: 1
    explanation: |
      Imagery (5.D) works through accumulation: follow the series of things the ashes become.

  - slug: u09-exam-q02
    type: multiple_choice
    topic_code: "5.B"
    source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
    points: 1
    stimulus: *ex1
    prompt: |
      In the first sentence, the phrase "so as to shrink away from a certain desolate area of land" has the effect of
    options:
      - "giving the road a human reluctance, as if even the highway avoids the valley"
      - "providing exact directions for travellers"
      - "suggesting that the railroad is more dangerous than the road"
      - "praising the engineers who built the road"
    option_explanations:
      - |
        Correct. Roads do not "shrink"; the verb personifies the road's route as a flinch. Before we see the valley, the landscape itself is recoiling from it.
      - |
        "About halfway" and "a quarter of a mile" sound precise, but the verb "shrink" turns description into attitude.
      - |
        The road joins the railroad; the danger it avoids is the valley, not the tracks.
      - |
        No engineers are mentioned; the intention is given to the road itself.
    answer: 0
    explanation: |
      A single verb can carry a narrator's attitude into apparently neutral description.

  - slug: u09-exam-q03
    type: multiple_choice
    topic_code: "5.C"
    source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
    points: 1
    stimulus: *ex1
    prompt: |
      Which detail most complicates any reading of Doctor T. J. Eckleburg's eyes as a symbol of a judging God?
    options:
      - "They are \"blue and gigantic.\""
      - "They were set up by an oculist to advertise his practice, and he then \"sank down himself into eternal blindness, or forgot them and moved away.\""
      - "They are above \"the grey land.\""
      - "Their retinas are \"one yard high.\""
    option_explanations:
      - |
        Size and colour make them imposing, which supports rather than complicates a godlike reading.
      - |
        Correct. The eyes are an abandoned advertisement whose maker went blind or forgot them: a creator who has left his creation. The detail makes any divine reading ironic: watched, but by nothing that cares.
      - |
        Their height above the land supports the idea of surveillance from above.
      - |
        A comic exaggeration of scale; it does not undercut the eyes' power.
    answer: 1
    explanation: |
      A good symbol reading also notices the details that resist it.

  - slug: u09-exam-q04
    type: multiple_choice
    topic_code: "2.B"
    source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
    points: 1
    stimulus: *ex1
    prompt: |
      In the novel as a whole, the valley of ashes functions most importantly as
    options:
      - "the setting of Gatsby's parties"
      - "the place where the cost of the Eggs' wealth is paid, home of the Wilsons and site of Myrtle's death"
      - "a symbol of Nick's Middle Western home"
      - "a setting that appears only in this chapter"
    option_explanations:
      - |
        The parties are in West Egg; the valley lies between it and the city.
      - |
        Correct. The valley is where George Wilson's garage stands, where Myrtle lives and dies under the "death car," and where Wilson takes Eckleburg's eyes for God's. It is the waste land the glamour passes through.
      - |
        The Middle West is associated with the "dark fields of the republic" at the end, not with the ashes.
      - |
        The valley returns in chapters 4, 7 and 8; it is the novel's recurrent crossroads.
    answer: 1
    explanation: |
      2.B: a setting's function in the whole work comes from what happens there and who lives there.

  - slug: u09-exam-q05
    type: true_false
    topic_code: "4.C"
    source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
    points: 1
    stimulus: *ex1
    prompt: |
      True or false: the shift to the second-person "you" ("which screens their obscure operations from your sight"; "you perceive, after a moment") draws the reader into the position of a traveller passing through.
    answer: true
    explanation: |
      True. Nick puts the reader on the train or the road, so the valley is experienced, not just described. The eyes appear "after a moment," as they would to someone looking up through the dust.

  - slug: u09-exam-q06
    type: multi_select
    topic_code: "5.B"
    source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
    points: 2
    partial_credit: true
    stimulus: *ex1
    prompt: |
      Select the TWO phrases that most emphasise decay and lifelessness in the people of the valley.
    options:
      - "\"ash-grey men, who move dimly and already crumbling through the powdery air\""
      - "\"the ash-grey men swarm up with leaden spades\""
      - "\"a pair of enormous yellow spectacles\""
      - "\"some wild wag of an oculist\""
    option_explanations:
      - |
        Correct. "Already crumbling" makes the men disintegrate as they move; they are half-made of the ash they work in.
      - |
        Correct. "Swarm" makes them insects and "leaden" adds weight and dullness; the men are a mass, not individuals.
      - |
        This describes the billboard, not the people.
      - |
        A comic phrase for the absent advertiser, not the valley's inhabitants.
    answer: [0, 1]
    explanation: |
      Pick the phrases attached to the people, then test each for decay and dehumanisation.

  - slug: u09-exam-q07
    type: fill_blank
    topic_code: "5.D"
    source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
    points: 1
    stimulus: *ex1
    prompt: |
      The eyes "brood on over the solemn dumping ____."
    answer: ["ground"]
    explanation: |
      "Dumping ground." The last words of the passage name what the valley is, with the solemnity of a graveyard.

  # ---- Set 2: Helmer on lying parents (A Doll's House, Act I)
  - slug: u09-exam-q08
    type: multiple_choice
    topic_code: "3.F"
    source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
    points: 1
    stimulus: &ex2 |
      *The following passage is from near the end of Act I of Henrik Ibsen's* A Doll's House *(1879), in William Archer's translation. Krogstad has just threatened to reveal that Nora forged her father's signature on a loan. Nora has asked Helmer about Krogstad, who once committed a forgery; Helmer does not know about Nora's.*

      HELMER. Many a man can retrieve his character, if he owns his crime and takes the punishment.

      NORA. Punishment——?

      HELMER. But Krogstad didn't do that. He evaded the law by means of tricks and subterfuges; and that is what has morally ruined him.

      NORA. Do you think that——?

      HELMER. Just think how a man with a thing of that sort on his conscience must be always lying and canting and shamming. Think of the mask he must wear even towards those who stand nearest him—towards his own wife and children. The effect on the children—that's the most terrible part of it, Nora.

      NORA. Why?

      HELMER. Because in such an atmosphere of lies home life is poisoned and contaminated in every fibre. Every breath the children draw contains some germ of evil.

      NORA. [*Closer behind him.*] Are you sure of that?

      HELMER. As a lawyer, my dear, I have seen it often enough. Nearly all cases of early corruption may be traced to lying mothers.
    prompt: |
      The central effect of this exchange depends chiefly on
    options:
      - "Helmer's suspicion that Nora is guilty"
      - "dramatic irony: Helmer condemns Krogstad in terms that the audience knows apply to Nora"
      - "Nora's open confession of her crime"
      - "a disagreement between Nora and Helmer about the law"
    option_explanations:
      - |
        Helmer suspects nothing; his confidence is what makes the scene painful.
      - |
        Correct. Every general statement about forgers, masks and children lands on the wife standing behind him. The audience hears two speeches at once.
      - |
        Nora asks only fragmentary questions ("Punishment——?"); she confesses nothing.
      - |
        Nora does not argue; she absorbs. The conflict here is internal to her.
    answer: 1
    explanation: |
      Dramatic irony turns an external conflict into an internal one: Krogstad's threat becomes Nora's fear for her children.

  - slug: u09-exam-q09
    type: multiple_choice
    topic_code: "1.E"
    source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
    points: 1
    stimulus: *ex2
    prompt: |
      Nora's broken-off questions ("Punishment——?" "Do you think that——?") primarily reveal
    options:
      - "that she is bored and not listening"
      - "growing alarm, as she applies each of Helmer's statements to herself and cannot finish the thought aloud"
      - "that she disagrees with Helmer and wants to argue"
      - "that she has not understood the word"
    option_explanations:
      - |
        She picks up exactly the key words of his speeches; she is listening intently.
      - |
        Correct. The dashes show thoughts she cannot complete without betraying herself. Her own speech, cut short, reveals her fear.
      - |
        She never counters him; the questions draw him on.
      - |
        She understands too well; the questions are about whether the punishment could fall on her.
    answer: 1
    explanation: |
      In drama, punctuation is performance: dashes mark interruption, hesitation and suppressed thought.

  - slug: u09-exam-q10
    type: multiple_choice
    topic_code: "6.B"
    source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
    points: 1
    stimulus: *ex2
    prompt: |
      Helmer's language of "poisoned," "contaminated" and "germ of evil" presents lying as
    options:
      - "a private matter with no effect on others"
      - "an infection that spreads invisibly through a household to the innocent, which makes it terrifying to Nora as a mother"
      - "a legal technicality"
      - "a temporary illness that passes without harm"
    option_explanations:
      - |
        The metaphor insists on effects on others: "every breath the children draw."
      - |
        Correct. The medical metaphor turns a moral fault into contagion. For Nora, who loves her children, the image converts her secret into a danger to them.
      - |
        Helmer explicitly moves from law to morality ("morally ruined").
      - |
        The infection is "in every fibre" and leads to "early corruption"; nothing suggests it passes.
    answer: 1
    explanation: |
      Extended metaphor (6.B): follow the vehicle (disease) and ask what it makes the tenor (lying) feel like.

  - slug: u09-exam-q11
    type: multiple_choice
    topic_code: "1.E"
    source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
    points: 1
    stimulus: *ex2
    prompt: |
      The stage direction "[Closer behind him.]" is significant chiefly because it
    options:
      - "shows Nora trying to hide from the children"
      - "places Nora where Helmer cannot see her face, so the audience sees her reaction and he does not"
      - "indicates that Nora is about to leave the room"
      - "shows that Helmer is ignoring her"
    option_explanations:
      - |
        The children are not on stage; the blocking concerns Nora and Helmer.
      - |
        Correct. The staging embodies the scene's irony: Nora presses closer to hear, unseen. The marriage's blindness is made physical.
      - |
        She moves closer to him, not toward the door; nothing in the passage suggests she is about to leave.
      - |
        He answers her question at once; he is attentive, just blind to what she is.
    answer: 1
    explanation: |
      Stage directions are evidence: where characters stand can show what they know.

  - slug: u09-exam-q12
    type: true_false
    topic_code: "3.F"
    source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
    points: 1
    stimulus: *ex2
    prompt: |
      True or false: in this passage Helmer knows that Nora has committed forgery and is warning her indirectly.
    answer: false
    explanation: |
      False. He learns the truth only from Krogstad's letter in Act III. His innocence of her secret is what gives the passage its irony.

  - slug: u09-exam-q13
    type: multiple_choice
    topic_code: "1.E"
    source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
    points: 1
    stimulus: *ex2
    prompt: |
      Helmer's final claim, "As a lawyer, my dear, I have seen it often enough. Nearly all cases of early corruption may be traced to lying mothers," reveals chiefly
    options:
      - "his careful scientific training"
      - "a habit of turning his authority into sweeping, moralising generalisations, and a readiness to place blame on women"
      - "his secret suspicion of his own mother"
      - "that he is about to forgive Krogstad"
    option_explanations:
      - |
        "Often enough" and "nearly all" are impressions dressed as expertise, not careful observation.
      - |
        Correct. Professional authority ("As a lawyer"), an endearment ("my dear") and a sweeping claim about mothers combine. The line characterises Helmer and plants the theme of how women are judged.
      - |
        Nothing suggests this; the generalisation is aimed at mothers in general.
      - |
        He has just explained why Krogstad is "morally ruined"; he means to dismiss him.
    answer: 1
    explanation: |
      1.E: a character's own speech (diction, endearments, generalisations) can reveal what he would never say of himself.

  - slug: u09-exam-q14
    type: multi_select
    topic_code: "3.F"
    source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
    points: 2
    partial_credit: true
    prompt: |
      This passage from Act I prepares for later events in the play. Select the TWO later events it most directly prepares.
    stimulus: *ex2
    options:
      - "Nora tells Anna, the nurse, that she cannot have the children so much with her in future."
      - "Helmer, reading Krogstad's letter in Act III, calls Nora unfit to bring up the children."
      - "Mrs. Linden asks Helmer for a post at the bank."
      - "Dr. Rank leaves his visiting cards marked with a black cross."
    option_explanations:
      - |
        Correct. Nora acts on Helmer's theory at the start of Act II, withdrawing from her children.
      - |
        Correct. Helmer applies his own theory to Nora once he knows, confirming the pattern this speech set up.
      - |
        Mrs. Linden's request comes earlier in Act I and has no connection to the theory of lying mothers.
      - |
        Rank's farewell concerns his own death, not Nora's guilt or the children.
    answer: [0, 1]
    explanation: |
      3.F: a conflict planted in one act should be traced to its consequences.

  # ---- Set 3: Unseen passage, Edith Wharton, The House of Mirth (1905)
  - slug: u09-exam-q15
    type: multiple_choice
    topic_code: "4.C"
    source: "Edith Wharton, The House of Mirth (1905)"
    points: 1
    stimulus: &ex3 |
      *The following passage is from the opening chapter of Edith Wharton's novel* The House of Mirth *(1905). Lawrence Selden, a lawyer, has unexpectedly met Lily Bart, a young woman of fashionable New York society, at Grand Central Station.*

      Selden paused in surprise. In the afternoon rush of the Grand Central Station his eyes had been refreshed by the sight of Miss Lily Bart.

      [...]

      They turned into Madison Avenue and began to stroll northward. As she moved beside him, with her long light step, Selden was conscious of taking a luxurious pleasure in her nearness: in the modelling of her little ear, the crisp upward wave of her hair—was it ever so slightly brightened by art?—and the thick planting of her straight black lashes. Everything about her was at once vigorous and exquisite, at once strong and fine. He had a confused sense that she must have cost a great deal to make, that a great many dull and ugly people must, in some mysterious way, have been sacrificed to produce her. He was aware that the qualities distinguishing her from the herd of her sex were chiefly external: as though a fine glaze of beauty and fastidiousness had been applied to vulgar clay. Yet the analogy left him unsatisfied, for a coarse texture will not take a high finish; and was it not possible that the material was fine, but that circumstance had fashioned it into a futile shape?
    prompt: |
      The parenthetical question "was it ever so slightly brightened by art?" primarily reveals that Selden's admiration is
    options:
      - "naive and uncritical"
      - "mixed with a connoisseur's scepticism, as he appraises her beauty for signs of artifice even while enjoying it"
      - "hostile, since he believes she is entirely false"
      - "shared by the crowd at the station"
    option_explanations:
      - |
        A naive admirer would not interrupt his own description to suspect hair dye; the dashes show a critical eye at work.
      - |
        Correct. The question breaks into a sentence of pleasure, exactly as a collector might pause over a finish. The perspective is admiring and appraising at once.
      - |
        "Ever so slightly" is mild, and the sentence returns at once to admiration ("the thick planting of her straight black lashes").
      - |
        The passage stays inside Selden's perceptions; the crowd's views are not given.
    answer: 1
    explanation: |
      4.C: an interruption in syntax often marks a second attitude inside the first.

  - slug: u09-exam-q16
    type: multiple_choice
    topic_code: "5.B"
    source: "Edith Wharton, The House of Mirth (1905)"
    points: 1
    stimulus: *ex3
    prompt: |
      The phrase "she must have cost a great deal to make" presents Lily primarily as
    options:
      - "a hard-working woman who earned her own living"
      - "a kind of luxury product, whose beauty has a price paid by others"
      - "a person in poor health"
      - "a talented artist"
    option_explanations:
      - |
        Nothing in the passage concerns her work; "cost ... to make" treats her as something produced, not someone producing.
      - |
        Correct. The commercial diction turns a woman into an expensive manufactured object, and the next clause says who paid: "a great many dull and ugly people ... sacrificed to produce her."
      - |
        "Vigorous and exquisite" and her "long light step" suggest health.
      - |
        "Art" appears only as possible hair-brightening; she is the made thing, not the maker.
    answer: 1
    explanation: |
      Specific words (5.B): economic diction applied to a person tells you how a society values her.

  - slug: u09-exam-q17
    type: multiple_choice
    topic_code: "6.B"
    source: "Edith Wharton, The House of Mirth (1905)"
    points: 1
    stimulus: *ex3
    prompt: |
      The metaphor of "a fine glaze of beauty and fastidiousness ... applied to vulgar clay" suggests that Lily's distinction is
    options:
      - "rooted deep in her character"
      - "a surface finish over ordinary material, at least as Selden first judges it"
      - "the result of her education abroad"
      - "something she has rejected"
    option_explanations:
      - |
        The glaze is "applied" and the qualities are "chiefly external": the metaphor places the distinction on the surface.
      - |
        Correct. Pottery: glaze over clay. Selden's first judgment is that the polish covers something common. The next sentence will test that judgment.
      - |
        The passage says nothing about her schooling.
      - |
        She displays these qualities; nothing suggests she rejects them.
    answer: 1
    explanation: |
      6.B: identify the vehicle (glazed pottery) and its implications (surface vs material).

  - slug: u09-exam-q18
    type: multiple_choice
    topic_code: "3.C"
    source: "Edith Wharton, The House of Mirth (1905)"
    points: 1
    stimulus: *ex3
    prompt: |
      The final sentence ("Yet the analogy left him unsatisfied ... a futile shape?") functions in the paragraph chiefly to
    options:
      - "confirm the earlier judgment that Lily is vulgar clay"
      - "reverse the metaphor: perhaps the material is fine and circumstance has misshaped it, which moves the blame from Lily to her world"
      - "introduce a new character"
      - "describe the weather on Madison Avenue"
    option_explanations:
      - |
        "Yet" and "unsatisfied" signal a turn away from the earlier judgment.
      - |
        Correct. The pottery metaphor is extended and turned: "a coarse texture will not take a high finish," so the material may be fine and "circumstance" the problem. The closing question opens the novel's central inquiry.
      - |
        No one else appears; the sentence continues Selden's reflection on Lily.
      - |
        The street is only setting for the walk; the sentence is about Lily.
    answer: 1
    explanation: |
      Structure (3.C): a paragraph that ends with a question reverses or opens what came before.

  - slug: u09-exam-q19
    type: multi_select
    topic_code: "1.A"
    source: "Edith Wharton, The House of Mirth (1905)"
    points: 2
    partial_credit: true
    stimulus: *ex3
    prompt: |
      Select the TWO phrases that best show Selden's pleasure in Lily is partly the pleasure of an observer judging an object.
    options:
      - "\"taking a luxurious pleasure in her nearness\""
      - "\"the modelling of her little ear\""
      - "\"They turned into Madison Avenue\""
      - "\"Selden paused in surprise\""
    option_explanations:
      - |
        Correct. "Luxurious" makes his pleasure a kind of consumption, the language of fine goods.
      - |
        Correct. "Modelling" is a sculptor's word; her ear is seen as a crafted object.
      - |
        A neutral statement of where they walk; it carries no judgment of Lily at all.
      - |
        Shows his surprise at seeing her, not an appraising pleasure.
    answer: [0, 1]
    explanation: |
      1.A: details of diction reveal a character's perspective.

  - slug: u09-exam-q20
    type: true_false
    topic_code: "4.B"
    source: "Edith Wharton, The House of Mirth (1905)"
    points: 1
    stimulus: *ex3
    prompt: |
      True or false: the passage is narrated in the first person by Selden.
    answer: false
    explanation: |
      False. It is third-person narration limited to Selden's perceptions ("Selden was conscious," "He had a confused sense"). Compare Nick's first-person narration in Gatsby: here the narrator can report Selden's "confused" feelings from slightly outside them.

  - slug: u09-exam-q21
    type: multiple_choice
    topic_code: "4.C"
    source: "Edith Wharton, The House of Mirth (1905)"
    points: 1
    stimulus: *ex3
    prompt: |
      The phrase "the herd of her sex" reveals chiefly
    options:
      - "Selden's condescension toward women in general, against which Lily is the exception"
      - "that Lily keeps animals"
      - "Lily's own contempt for other women"
      - "the narrator's approval of women's equality"
    option_explanations:
      - |
        Correct. "Herd" reduces other women to cattle. The compliment to Lily depends on a low view of women generally, which colours Selden's whole perspective.
      - |
        "Herd" is figurative, a comparison of other women to cattle; no animals are involved.
      - |
        The phrase is in Selden's consciousness ("He was aware"), not Lily's.
      - |
        The diction is the opposite of egalitarian.
    answer: 0
    explanation: |
      4.C: a single noun can expose a perspective's assumptions.

  - slug: u09-exam-q22
    type: multiple_choice
    topic_code: "7.D"
    source: "Edith Wharton, The House of Mirth (1905)"
    points: 1
    stimulus: *ex3
    prompt: |
      A student claims: "Wharton suggests that Lily's society, not Lily herself, may be responsible for what she has become." Which evidence best supports this claim?
    options:
      - "\"Everything about her was at once vigorous and exquisite, at once strong and fine.\""
      - "\"was it not possible that the material was fine, but that circumstance had fashioned it into a futile shape?\""
      - "\"his eyes had been refreshed by the sight of Miss Lily Bart\""
      - "\"They turned into Madison Avenue and began to stroll northward.\""
    option_explanations:
      - |
        Describes her qualities, but says nothing about responsibility for them.
      - |
        Correct. "Circumstance had fashioned it" directly assigns the shaping to her world rather than her nature, the claim's key point.
      - |
        Shows Selden's pleasure, not the cause of what Lily is.
      - |
        A statement of setting and movement; it says nothing about Lily's society or responsibility.
    answer: 1
    explanation: |
      7.D: relevant evidence matches the claim's key term (here, responsibility).

  # ---- Set 4: Gatsby in Louisville (chapter 8)
  - slug: u09-exam-q23
    type: multiple_choice
    topic_code: "1.E"
    source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
