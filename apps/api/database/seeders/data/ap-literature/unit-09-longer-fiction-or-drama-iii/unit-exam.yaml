  - slug: u09-exam-q42
    type: long_answer
    topic_code: "4.C"
    source: "Edith Wharton, The House of Mirth (1905)"
    points: 6
    stimulus: *ex3
    prompt: |
      Carefully read the passage above from the opening of Edith Wharton's *The House of Mirth* (1905), in which Lawrence Selden walks with Lily Bart. In a well-written essay, analyze how Wharton uses literary elements and techniques to convey Selden's complex perception of Lily.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: Through the diction of luxury and manufacture and a metaphor of glazed pottery that turns against itself, Wharton presents Selden as a connoisseur who admires Lily as an exquisite object, suspects her of being only surface, and ends by doubting his own judgment, a perception that is both appreciative and diminishing.
      Line of reasoning: (1) pleasure as consumption: "luxurious pleasure," "modelling," "cost a great deal to make," with the parenthetical doubt about "art"; (2) judgment as appraisal: "the herd of her sex," "chiefly external," "fine glaze ... applied to vulgar clay"; (3) the reversal: "Yet the analogy left him unsatisfied," "the material was fine," "circumstance had fashioned it into a futile shape," a question that shifts responsibility to her world. Strong essays note third-person limited narration, which lets Wharton show Selden's perception and its limits at once.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis about Selden's complex perception (admiration mixed with appraisal or doubt), not a restatement or summary.
      Row B Evidence and Commentary (0-4): 1 = summary or isolated quotations. 2 = relevant evidence with general commentary ("this shows he likes her"). 3 = specific evidence from across the passage (luxury diction, the glaze metaphor, the closing question) with commentary explaining how each technique conveys the perception. 4 = consistent, well-chosen evidence and commentary that traces the movement of Selden's perception from pleasure to judgment to doubt, explaining how diction, metaphor, syntax and point of view work together.
      Row C Sophistication (0-1): 1 point for complexity, such as explaining how the commodity language indicts the society that "produced" Lily as well as Selden's gaze, or how the narration lets the reader see the limits of Selden's view.

  - slug: u09-exam-q43
    type: long_answer
    topic_code: "7.B"
    source: "general knowledge"
    points: 6
    prompt: |
      In many works of literature, a character's relationship to money or property reveals what that character values most, and what the society around the character values.

      Either from your own reading or from the list below, choose a work of fiction or drama in which money or property plays a significant role. Then, in a well-written essay, analyze how that role contributes to an interpretation of the work as a whole. Do not merely summarize the plot.

      Suggested works from this course: *The Great Gatsby* (F. Scott Fitzgerald); *A Doll's House* (Henrik Ibsen); *Frankenstein* (Mary Shelley); "Bartleby, the Scrivener" (Herman Melville); "The Gift of the Magi" (O. Henry).

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Provide evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      A strong response on The Great Gatsby: Thesis: Fitzgerald makes money the medium through which every feeling in the novel is expressed, from Daisy's voice "full of money" to the shirts she weeps over, so that Gatsby's love, Tom's power and Daisy's choice all reveal a society in which wealth is the measure of reality and new money can buy everything but acceptance. Line of reasoning: (1) money as display: the parties, the shirts, the house across the bay; (2) money as class: West Egg against East Egg, "Mr. Nobody from Nowhere," the drugstores; (3) money as shelter: the Buchanans "retreated back into their money," leaving others to "clean up the mess." On A Doll's House: the forged loan as Nora's hidden strength, Helmer's "No debts! No borrowing!" and his rage at his own exposure, and the economic language of "something in reserve" and "living here like a beggar" reveal a marriage organised as an economy.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis about how money or property contributes to the meaning of the whole work, not "money is important in the novel."
      Row B Evidence and Commentary (0-4): 1 = plot summary with some mention of money. 2 = relevant examples with general commentary. 3 = specific evidence from several parts of the work, with commentary explaining how each shows what characters and society value. 4 = sufficient, well-chosen evidence across the work with commentary that builds a clear line of reasoning to an interpretation of the whole.
      Row C Sophistication (0-1): 1 point for complexity, such as distinguishing kinds of wealth (inherited and made), showing how money shapes perception (Nick's "full of money" recognition), or situating the work in its historical context (Prohibition, Norwegian marriage law).
