          The green light belongs to East Egg and to Gatsby's longing; Eckleburg's eyes belong to the valley and to watching.
      answer: 1
      explanation: |
        Spiral review (5.C, symbol, weeks 19 and 24). A good symbol reading names the literal object, its details, and the idea those details invite.

