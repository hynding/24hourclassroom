      prompt: |
        At the end of chapter 3 Nick calls himself "one of the few honest people that I have ever known." Coming where it does, the claim most invites the reader to
      options:
        - "accept it as proven by everything Nick has done so far"
        - "test it against what Nick has just admitted, including an unfinished entanglement back home and his ready attraction to a woman he calls dishonest"
        - "conclude that Nick is the villain of the novel"
