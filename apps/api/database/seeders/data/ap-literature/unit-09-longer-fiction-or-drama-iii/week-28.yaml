      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      prompt: |
        Chapter 2 opens with the valley of ashes, "a fantastic farm where ashes grow like wheat into ridges and hills and grotesque gardens." Which best describes the function of this setting in the novel's opening chapters?
      options:
        - "It provides a peaceful rural contrast to the noise of New York."
        - "It shows the grey waste on which the wealth of the Eggs and the city depends, and it is where Myrtle and George Wilson live."
        - "It is a dream Nick has on the train."
        - "It is the site of Gatsby's mansion."
      option_explanations:
        - |
          The "farm" is ironic: it grows ashes, not food. Nothing about it is peaceful; it is "desolate."
        - |
          Correct. The valley lies between West Egg and New York, a dumping ground whose crops are ashes and whose people are "ash-grey men." It shows what the glittering worlds on either side produce and discard, and it houses the Wilsons, who pay for others' carelessness.
        - |
          Nick passes through it by train and car, and the description is realistic, if grotesque; it is not presented as a dream.
        - |
          Gatsby's mansion is in West Egg, beside Nick's house; the valley is a separate place on the road to the city.
      answer: 1
      explanation: |
        Spiral review (2.B, function of setting, week 11). A setting earns its place by doing something: here, it puts the cost of wealth on the map.

