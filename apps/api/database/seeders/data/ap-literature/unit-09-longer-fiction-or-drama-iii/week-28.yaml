    - slug: u09-w28-q22
      type: long_answer
      topic_code: "4.C"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 6
      stimulus: *w28a
      prompt: |
        Carefully read the passage above from Chapter I of F. Scott Fitzgerald's *The Great Gatsby* (1925), in which the narrator, Nick Carraway, introduces Gatsby. In a well-written essay, analyze how Fitzgerald uses literary elements and techniques to convey Nick's complex attitude toward Gatsby.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Through a paragraph that keeps qualifying itself, Fitzgerald presents Nick as a narrator who scorns what Gatsby represents yet admires the man's capacity for hope, so that the reader begins the novel inside an argument Nick is still having with himself.
        Line of reasoning: (1) the opening concession ("boasting ... admission") sets Nick up as a judge, and his wish for "moral attention" shows recoil from the East; (2) the "Only Gatsby ... exempt" structure and the clash of "unaffected scorn" with "something gorgeous" isolate Gatsby from that recoil; (3) the seismograph simile and the phrase "extraordinary gift for hope" define what Nick admires; (4) the final "No—" correction and the "foul dust" metaphor move the blame from Gatsby to what preyed on him. Strong essays explain that the syntax of correction and qualification is itself the evidence of a divided attitude.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis about Nick's complex attitude (admiration and scorn, or protective judgment), not a restatement of the prompt or a plot summary.
        Row B Evidence and Commentary (0-4): 1 = summary or a quotation or two with little explanation. 2 = some relevant evidence (e.g. "unaffected scorn," "something gorgeous") with commentary that is general or repeats the quotation. 3 = specific evidence from several parts of the passage (the concession, the simile, the "foul dust" image) with commentary that explains how each conveys the attitude, though the line of reasoning may be uneven. 4 = consistent, well-chosen evidence and commentary that explains how specific techniques (diction, simile, metaphor, syntax of self-correction) build a complex attitude across the passage.
        Row C Sophistication (0-1): 1 point for a complex understanding, such as explaining how the retrospective, self-correcting narration makes Nick both reliable and partial, or how the passage frames the whole novel as Nick's attempt to justify his exemption of Gatsby.
