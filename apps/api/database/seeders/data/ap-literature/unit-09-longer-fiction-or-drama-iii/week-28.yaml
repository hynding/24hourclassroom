      prompt: |
        The eyes of Doctor T. J. Eckleburg, which "look out of no face" and "brood on over the solemn dumping ground," can most reasonably be read as a symbol of
      options:
        - "Gatsby's hopes for the future"
        - "a watching presence, like an absent or indifferent god, that sees the moral waste of the valley but does nothing"
        - "Tom Buchanan's wealth"
        - "the green light at the end of Daisy's dock"
      option_explanations:
        - |
          Gatsby's hopes are associated with the green light and with the stars over the water, not with a faded billboard in the ashes.
        - |
          Correct. The eyes are gigantic, faceless and permanently watching, set up by a man who then sank "into eternal blindness, or forgot them." They suggest judgment without agency, a theme the novel makes explicit later when George Wilson takes them for God's eyes.
        - |
          Tom drives through the valley but the billboard is an oculist's advertisement, not an emblem of his money.
