        - |
          Correct. Tom shoves Nick about, lectures, strikes Myrtle and never doubts himself. Gatsby hosts parties he does not join, picks his words "with care" and stays at a distance. The contrast of old and new money is also a contrast of ways of using power.
        - |
          Nick credits Gatsby with "a romantic readiness" and "gift for hope"; Tom's reading of the "Coloured Empires" book is crude certainty, not dreaming.
        - |
          Nick knew Tom at Yale; he meets Gatsby for the first time at the party in chapter 3, after a summer of rumours.
      answer: 1
      explanation: |
        Spiral review (1.C, contrasting characters, week 13). A foil sharpens each character; here the contrast also structures the coming conflict over Daisy.

