week: 28
unit: 9
title: Nick's Perspective and Gatsby's Choices, The Great Gatsby Chapters 1-3
topics: ["4.C", "1.E"]
texts:
  - author: F. Scott Fitzgerald
    title: The Great Gatsby (Chapters I-III)
    year: 1925
    url: https://www.gutenberg.org/ebooks/64317
guide: guides/week-28.md
guide_description: |
  The opening of the last unit: how Nick Carraway's diction and syntax build a perspective the reader must weigh,
  and how characters in chapters 1-3 (Daisy, Tom, Jordan and, from a distance, Gatsby) reveal complexity through
  their own speech and choices. Four worked close readings, a model analytical paragraph, misreadings, self-check.
flashcards_description: |
  28 cards on the people, places, lines and narrative choices of The Great Gatsby, chapters 1-3, and on reading a
  narrator's perspective and a character's choices.

flashcards:
  - front: The Great Gatsby → publication facts
    back: |
      F. Scott Fitzgerald, published by Charles Scribner's Sons in April 1925. Nine chapters, set in the summer of 1922 on Long Island and in New York City. Public domain in the United States since 1 January 2021.
    topic_code: "4.C"
  - front: Nick Carraway → who he is in chapters 1-3
    back: |
      The first-person narrator: a Yale graduate (1915) and war veteran from a Middle Western family who comes East in 1922 to learn the bond business. Daisy's second cousin once removed, Gatsby's neighbour in West Egg, and the one character who moves between every social world in the book.
    topic_code: "4.C"
  - front: Gatsby → retrospective narration
    back: |
      Nick tells the story after it is over ("When I came back from the East last autumn"). He already knows how it ends, so his judgments, hints and silences are shaped by hindsight. Every scene is a memory selected for a purpose.
    hint: The narrating Nick knows more than the experiencing Nick.
    topic_code: "4.C"
  - front: Nick's father's advice (chapter 1)
    back: |
      "Whenever you feel like criticizing anyone ... just remember that all the people in this world haven't had the advantages that you've had." Nick says it makes him "inclined to reserve all judgements" — a claim the rest of the book tests.
    topic_code: "4.C"
  - front: '"And, after boasting this way of my tolerance, I come to the admission that it has a limit."'
    back: |
      The second paragraph of the novel qualifies the first. Nick presents himself as tolerant, then admits he is judging after all. The sentence tells the reader to weigh his judgments rather than accept his self-portrait.
    topic_code: "4.C"
  - front: '"an extraordinary gift for hope, a romantic readiness"'
    back: |
      Nick's verdict on Gatsby in chapter 1, before Gatsby has appeared. It sets up the novel's central tension: Nick claims "an unaffected scorn" for what Gatsby represents yet exempts Gatsby himself.
    topic_code: "4.C"
  - front: Gatsby's seismograph simile (chapter 1)
    back: |
      Gatsby is "related to one of those intricate machines that register earthquakes ten thousand miles away": a man tuned to distant tremors, sensitive to possibilities other people cannot feel. Admiring, but it also makes him a machine.
    topic_code: "4.C"
  - front: West Egg vs East Egg
    back: |
      Two Long Island peninsulas across a bay. West Egg ("the less fashionable of the two") is new money: Gatsby's mansion and Nick's rented bungalow. East Egg is inherited money: the Buchanans' Georgian Colonial house. The contrast is social, not geographical.
    topic_code: "4.C"
  - front: Daisy Buchanan → first view (chapter 1)
    back: |
      Lying on an enormous couch with Jordan Baker, white dresses rippling as if blown by wind. Her voice is her most noticed feature: low, thrilling, full of promise. Nick's cousin; married to Tom; mother of a small daughter.
    topic_code: "1.E"
  - front: '"I hope she''ll be a fool"'
    back: |
      Daisy, chapter 1, on her daughter's birth: "that's the best thing a girl can be in this world, a beautiful little fool." A bitter diagnosis of a woman's options, delivered as a performance; Nick then feels "the basic insincerity of what she had said."
    topic_code: "1.E"
  - front: Tom Buchanan → what his own speech and acts reveal
    back: |
      A former Yale football end, enormously rich, physically dominating. He lectures on a racist book ("The Rise of the Coloured Empires" by "this man Goddard"), takes Nick to meet his mistress, and breaks Myrtle's nose with his open hand. Power used without reflection.
    topic_code: "1.E"
  - front: Jordan Baker → the dishonesty Nick notices
    back: |
      A champion golfer, Daisy's friend. Nick recalls a rumour that she moved her ball in a tournament and sees her leave a borrowed car out in the rain with the top down and lie about it. He concludes she is "incurably dishonest" and is drawn to her anyway.
    topic_code: "1.E"
  - front: Myrtle Wilson
    back: |
      Tom's mistress, wife of George Wilson, the garage owner in the valley of ashes. In the New York apartment scene (chapter 2) she changes dresses and manners, performing a class she was not born to, until Tom strikes her for saying Daisy's name.
    topic_code: "1.E"
  - front: George Wilson → first impression
    back: |
      The owner of the garage beside the valley of ashes: "a blond, spiritless man, anaemic." Covered in the same grey dust as the place. Tom manipulates him with the promise of a car to sell.
    topic_code: "1.E"
  - front: The valley of ashes (chapter 2)
    back: |
      The dumping ground between West Egg and New York, "a fantastic farm where ashes grow like wheat." The waste product of the wealth on either side of it: grey, crumbling, peopled by "ash-grey men." Myrtle and George live here.
    topic_code: "4.C"
  - front: The eyes of Doctor T. J. Eckleburg
    back: |
      A faded oculist's billboard over the valley of ashes: gigantic blue eyes behind yellow spectacles, which "brood on over the solemn dumping ground." Watching, but blind to what they watch; later George Wilson will take them for the eyes of God.
    topic_code: "4.C"
  - front: The green light (end of chapter 1)
    back: |
      Nick's first sight of Gatsby: a figure on his lawn at night stretching his arms toward the dark water, where Nick sees only "a single green light, minute and far away, that might have been the end of a dock." The reader learns in chapter 4 whose dock.
    topic_code: "1.E"
  - front: Gatsby's party (chapter 3) → how Nick structures it
    back: |
      A list of the week's machinery (oranges and lemons in, pulp out; caterers; an orchestra), then the party itself told in the present tense, then the encounter with Gatsby. The host is the last thing Nick finds, and he is not where the noise is.
    topic_code: "4.C"
  - front: Owl Eyes in Gatsby's library
    back: |
      A drunk man in owl-eyed spectacles astonished that the books are real: Gatsby has not cut the pages. A judgment hidden in a joke: the library is authentic, but unread, a stage set built with real materials.
    topic_code: "1.E"
  - front: Gatsby's smile (chapter 3)
    back: |
      "It understood you just so far as you wanted to be understood, believed in you as you would like to believe in yourself." The smile is a mirror: it gives each guest back the self they hoped to project. Then it vanishes into "an elegant young roughneck."
    topic_code: "4.C"
  - front: '"old sport"'
    back: |
      Gatsby's habitual form of address, a borrowed upper-class English mannerism. The phrase is part of the self he has built, and the reader is invited, like Nick, to notice the effort in it.
    topic_code: "1.E"
  - front: Gatsby's choices in chapter 3 → what they show
    back: |
      He gives lavish parties but stands apart; he does not drink; he looks from one group to another "with approving eyes"; he introduces himself only when Nick admits he does not know the host. The choices suggest a man for whom the party is a means, not a pleasure.
    topic_code: "1.E"
  - front: Perspective (4.C) → in Gatsby
    back: |
      Not just what Nick sees but how he values it: his diction ("unaffected scorn," "foul dust"), his syntax (qualifying clauses, sudden corrections like "No—"), and what he chooses to report. Perspective is built sentence by sentence.
    topic_code: "4.C"
  - front: Syntax as perspective → Nick's self-corrections
    back: |
      Nick often states a position and then revises it within the same paragraph ("after boasting this way of my tolerance ... it has a limit"; "No—Gatsby turned out all right"). The pattern shows a narrator still arguing with himself about what he saw.
    topic_code: "4.C"
  - front: Complexity through choices (1.E) → in Gatsby chapters 1-3
    back: |
      Characters are revealed less by what Nick says of them than by what they do and say: Daisy's performed confession, Tom's open-handed blow, Jordan's lie about the car, Gatsby's distance from his own party. Ask what each choice reveals that the character would not admit.
    topic_code: "1.E"
  - front: Nick's claim of honesty (end of chapter 3)
    back: |
      "I am one of the few honest people that I have ever known." Nick's closing claim in chapter 3 comes just after he admits to a "vague understanding" with a girl back home that he has not yet ended, and just after he has judged Jordan "incurably dishonest." The reader has grounds to test the claim.
    topic_code: "4.C"
  - front: The car in the ditch (end of chapter 3)
    back: |
      Leaving Gatsby's party, Nick sees a new coupé in the ditch with a wheel torn off; the drunk driver cannot understand why the car will not go. A comic scene that anticipates the novel's later, fatal carelessness with cars.
    topic_code: "1.E"
  - front: Catherine and the McKees (chapter 2)
    back: |
      The guests at Myrtle's apartment: her sister Catherine, who passes on the rumour that Gatsby is a relative of the Kaiser, and the McKees, a photographer and his wife. The scene shows rumour about Gatsby spreading before he appears.
    topic_code: "1.E"

quiz:
  description: |
    22 questions · about 35 minutes · about two thirds on chapters 1-3 of The Great Gatsby (Nick's perspective, and
    what characters' own choices and speech reveal) and a third spiral review of narration, point of view, imagery,
    setting, symbol and thesis writing from earlier units. Multiple choice, select-all and true/false items are graded
    at once; fill-in-the-blank items are matched automatically; the two short answers and the essay are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Passage set: Nick's second paragraph (chapter 1)
    - slug: u09-w28-q01
      type: multiple_choice
      topic_code: "4.C"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: &w28a |
        *The following passage is from Chapter I of F. Scott Fitzgerald's* The Great Gatsby *(1925). The narrator, Nick Carraway, has just described the advice his father gave him and his own habit of reserving judgment.*

        And, after boasting this way of my tolerance, I come to the admission that it has a limit. Conduct may be founded on the hard rock or the wet marshes, but after a certain point I don't care what it's founded on. When I came back from the East last autumn I felt that I wanted the world to be in uniform and at a sort of moral attention forever; I wanted no more riotous excursions with privileged glimpses into the human heart. Only Gatsby, the man who gives his name to this book, was exempt from my reaction—Gatsby, who represented everything for which I have an unaffected scorn. If personality is an unbroken series of successful gestures, then there was something gorgeous about him, some heightened sensitivity to the promises of life, as if he were related to one of those intricate machines that register earthquakes ten thousand miles away. This responsiveness had nothing to do with that flabby impressionability which is dignified under the name of the "creative temperament"—it was an extraordinary gift for hope, a romantic readiness such as I have never found in any other person and which it is not likely I shall ever find again. No—Gatsby turned out all right at the end; it is what preyed on Gatsby, what foul dust floated in the wake of his dreams that temporarily closed out my interest in the abortive sorrows and short-winded elations of men.
      prompt: |
        In context, Nick's admission in the first sentence that his tolerance "has a limit" primarily serves to
      options:
        - "confirm that Nick is the impartial observer his father's advice was meant to produce"
        - "qualify the tolerant self-portrait he has just offered, signalling that the narrator is a judge as well as a witness"
        - "announce that Nick will refuse to describe the immoral conduct of the other characters"
        - "show that Nick has abandoned the moral values of his Middle Western upbringing"
      option_explanations:
        - |
          The sentence does the opposite: it concedes that the "boasting" about tolerance was only part of the truth. A reader who takes Nick as wholly impartial misses the first warning the novel gives.
        - |
          Correct. "Boasting" and "admission" frame the previous paragraph as a claim and this one as a correction. Nick tells us he has judged and will judge, so his account has to be read as a perspective, not a neutral record.
        - |
          Nick goes on to describe a great deal of misconduct; the "limit" concerns his patience with it after his return, not a refusal to narrate it.
        - |
          The wish for a world "in uniform and at a sort of moral attention" sounds more like a return to a strict code than an abandonment of one.
      answer: 1
      explanation: |
        Look for words that evaluate a narrator's own statements ("boasting," "admission"). They tell you how far to trust what came before.

    - slug: u09-w28-q02
      type: multiple_choice
      topic_code: "4.C"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w28a
      prompt: |
        Nick's wish for the world to be "in uniform and at a sort of moral attention forever" most clearly reveals
      options:
        - "his nostalgia for his military service and his wish to re-enlist"
        - "a recoil from what he witnessed in the East, expressed as a longing for order and discipline"
        - "his admiration for the way the wealthy of East Egg conduct themselves"
        - "his belief that Gatsby should have been punished by the law"
      option_explanations:
        - |
          The military image is figurative. Nick is describing a moral mood after his summer, not a plan to return to the army; nothing in the passage points to re-enlisting.
        - |
          Correct. The metaphor of a world standing at attention, set against "riotous excursions," shows a narrator so disturbed by what he saw that he wants everyone held to a rigid code. It is a reaction, and Nick calls it one ("my reaction").
        - |
          The passage implies the reverse: something in the East has exhausted his tolerance. Nothing here praises the wealthy.
        - |
          Gatsby is the one person "exempt from my reaction"; the passage does not call for his punishment.
      answer: 1
      explanation: |
        Diction reveals perspective (4.C). "Uniform" and "moral attention" are about discipline; "riotous excursions" names what he is recoiling from.

    - slug: u09-w28-q03
      type: multiple_choice
      topic_code: "4.D"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w28a
      prompt: |
        Nick says Gatsby "represented everything for which I have an unaffected scorn" and also that "there was something gorgeous about him." The effect of this pairing on the reader's trust in Nick is best described as which of the following?
      options:
        - "It shows Nick lying outright, so nothing he says about Gatsby can be believed."
        - "It shows a divided narrator whose judgment of Gatsby is ambivalent, so the reader must weigh his admiration and his scorn rather than accept either alone."
        - "It is a careless contradiction that Fitzgerald failed to correct."
        - "It proves that Nick is an omniscient narrator who sees every side of a character."
      option_explanations:
        - |
          Ambivalence is not lying. Nick openly states both attitudes; an outright liar would hide the contradiction rather than display it in consecutive sentences.
        - |
          Correct. The pairing is deliberate: scorn for what Gatsby stands for, admiration for the man. That division makes Nick reliable about his feelings but partial in his judgments, so the reader has to do some of the judging.
        - |
          The paragraph is built around the tension; the next sentences ("If personality is ... then") explain how both can be true. Treating it as an error ignores the "Only ... exempt" structure.
        - |
          Nick is a first-person narrator with limited access to other minds; seeing two sides of Gatsby does not make him omniscient.
      answer: 1
      explanation: |
        Spiral review (4.D, reliability, week 18 and Unit 7). Reliability is not all-or-nothing: a narrator can be honest about his feelings and still be partial.

    - slug: u09-w28-q04
      type: multiple_choice
      topic_code: "6.A"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w28a
      prompt: |
        The simile comparing Gatsby to "one of those intricate machines that register earthquakes ten thousand miles away" primarily suggests that Gatsby
      options:
        - "is mechanical and unfeeling in his dealings with others"
        - "is unusually responsive to distant possibilities that ordinary people cannot sense"
        - "is a scientist whose fortune came from engineering"
        - "is destructive, causing disasters wherever he goes"
      option_explanations:
        - |
          The machine in the simile is a sensitive instrument, valued for how much it feels. The surrounding phrases ("heightened sensitivity," "responsiveness") point to feeling, not coldness.
        - |
          Correct. A seismograph detects tremors far away. The simile glosses "heightened sensitivity to the promises of life": Gatsby feels the pull of distant possibility, which the passage then calls "an extraordinary gift for hope."
        - |
          The comparison is figurative; it describes his temperament, not his profession. Nothing in chapter 1 tells us how Gatsby made his money.
        - |
          The machine records earthquakes; it does not cause them. Reading it as destruction confuses the instrument with the event.
      answer: 1
      explanation: |
        Spiral review (6.A, simile, week 6). Identify both halves of the comparison, then ask which property carries over: here, sensitivity to the far away.

    - slug: u09-w28-q05
      type: multi_select
      topic_code: "4.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 2
      partial_credit: true
      stimulus: *w28a
      prompt: |
        Select the TWO phrases that most clearly show the narration is retrospective (told after the events are over).
      options:
        - "\"When I came back from the East last autumn\""
        - "\"some heightened sensitivity to the promises of life\""
        - "\"Gatsby turned out all right at the end\""
        - "\"Conduct may be founded on the hard rock or the wet marshes\""
      option_explanations:
        - |
          Correct. Nick is speaking from a time after his return from the East, so the summer he is about to describe is already in the past.
        - |
          This phrase characterises Gatsby but carries no time marker; it could appear in a narration told at any distance from the events.
        - |
          Correct. Only someone who knows the ending can say how Gatsby "turned out." The phrase looks back across the whole story before it begins.
        - |
          A general statement about conduct, in the timeless present. It says nothing about when Nick is narrating.
      answer: [0, 2]
      explanation: |
        Spiral review (4.B, point of view, week 1). Retrospective first-person narration lets Nick shape the story with hindsight, which is why his early verdicts matter.

    - slug: u09-w28-q06
      type: true_false
      topic_code: "3.A"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w28a
      prompt: |
        True or false: in this passage Nick reveals something about how the story ends before the story has properly begun.
      answer: true
      explanation: |
        True. "Gatsby turned out all right at the end" and the reference to what "preyed on Gatsby" look ahead to the ending. Spiral review (3.A, how plot orders events, week 2): telling the outcome early shifts the reader's question from "what happens?" to "how and why?"

    - slug: u09-w28-q07
      type: multiple_choice
      topic_code: "5.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w28a
      prompt: |
        In the final sentence, the phrase "what foul dust floated in the wake of his dreams" primarily serves to
      options:
        - "blame Gatsby's dreams for the corruption around him"
        - "shift Nick's disgust away from Gatsby and onto the forces and people that trailed after and preyed on his dreams"
        - "describe the literal dust of the valley of ashes settling on Gatsby's house"
        - "suggest that Gatsby's dreams were worthless from the start"
      option_explanations:
        - |
          The sentence says Gatsby "turned out all right"; the dust is what "preyed on" him. The grammar separates the dreamer from the foulness behind him.
        - |
          Correct. "No—" corrects any impression that Gatsby is the cause of Nick's disgust. The image of debris in a ship's wake places the corruption behind and around Gatsby rather than in him.
        - |
          The valley of ashes is a later setting with literal dust, and the image may anticipate it, but here "dust" is figurative and "in the wake of his dreams" makes the metaphor clear.
        - |
          Nick calls Gatsby's quality "an extraordinary gift for hope"; the sentence protects the dreams and condemns what followed them.
      answer: 1
      explanation: |
        Spiral review (5.B, function of words and phrases, week 4). Ask where the phrase puts the blame. "No—" and "it is what preyed on Gatsby" do the work.

    # ---- Passage set: Daisy on her daughter (chapter 1)
    - slug: u09-w28-q08
      type: multiple_choice
      topic_code: "1.E"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: &w28b |
        *In this passage from Chapter I of* The Great Gatsby *(1925), Daisy Buchanan tells Nick, her cousin, about the birth of her daughter.*

        "It'll show you how I've gotten to feel about—things. Well, she was less than an hour old and Tom was God knows where. I woke up out of the ether with an utterly abandoned feeling, and asked the nurse right away if it was a boy or a girl. She told me it was a girl, and so I turned my head away and wept. 'All right,' I said, 'I'm glad it's a girl. And I hope she'll be a fool—that's the best thing a girl can be in this world, a beautiful little fool.'

        "You see I think everything's terrible anyhow," she went on in a convinced way. "Everybody thinks so—the most advanced people. And I know. I've been everywhere and seen everything and done everything." Her eyes flashed around her in a defiant way, rather like Tom's, and she laughed with thrilling scorn. "Sophisticated—God, I'm sophisticated!"

        The instant her voice broke off, ceasing to compel my attention, my belief, I felt the basic insincerity of what she had said. It made me uneasy, as though the whole evening had been a trick of some sort to exact a contributory emotion from me. I waited, and sure enough, in a moment she looked at me with an absolute smirk on her lovely face, as if she had asserted her membership in a rather distinguished secret society to which she and Tom belonged.
      prompt: |
        Daisy's wish that her daughter will be "a beautiful little fool" most strongly suggests that Daisy
      options:
        - "values intelligence above all other qualities in women"
        - "recognises that her world rewards women for beauty and ignorance, and finds that recognition painful"
        - "is joking and means nothing serious by the remark"
        - "intends to raise her daughter away from the society she lives in"
      option_explanations:
        - |
          She wishes the opposite on her daughter. Her logic is that a girl who understands her position will suffer, so foolishness is a protection.
        - |
          Correct. She wept, felt "utterly abandoned," and then names foolishness as "the best thing a girl can be in this world." The wish diagnoses a world that leaves women nothing better than beauty and not-knowing.
        - |
          The details of abandonment and weeping make it more than a joke, even if Nick later suspects she is performing. A performance can still contain a real grievance.
        - |
          Nothing in the passage suggests escape; her "I've been everywhere and seen everything" implies resignation, not a plan.
      answer: 1
      explanation: |
        Character complexity through speech (1.E): what a character says can reveal more than she intends, and more than the narrator allows.

    - slug: u09-w28-q09
      type: multiple_choice
      topic_code: "4.C"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w28b
      prompt: |
        In the final paragraph, the phrase "ceasing to compel my attention, my belief" reveals which of the following about Nick's perspective?
      options:
        - "He was persuaded while Daisy spoke and becomes sceptical only once her voice stops, so her voice works on him almost against his judgment."
        - "He never believed a word Daisy said."
        - "He is bored by Daisy and stops listening halfway through her speech."
        - "He thinks Daisy is telling the truth and that Tom is the insincere one."
      option_explanations:
        - |
          Correct. Belief lasts exactly as long as the voice. Nick admits being under its spell, then judges in the silence afterward; the reader sees both his susceptibility and his scepticism.
        - |
          The phrase says her voice did "compel ... my belief"; the doubt comes only after it "broke off."
        - |
          Her voice compelled his attention while it lasted; the reaction comes "the instant" it stops, not halfway through.
        - |
          Nick feels "the basic insincerity of what she had said," and the "secret society" image includes Tom and Daisy together.
      answer: 0
      explanation: |
        Small phrases of time ("the instant," "in a moment") show how a narrator's perspective shifts within a scene.

    - slug: u09-w28-q10
      type: multiple_choice
      topic_code: "1.E"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w28b
      prompt: |
        Daisy's exclamation "Sophisticated—God, I'm sophisticated!" functions primarily to
      options:
        - "prove that Daisy is the most worldly person in the novel"
        - "show Daisy performing a weary worldliness so emphatically that the claim undercuts itself"
        - "reveal that Daisy has been educated in Europe"
        - "show that Daisy is mocking Nick's provincial background"
      option_explanations:
        - |
          A genuinely sophisticated person rarely announces it; the passage presents the claim as a pose, and Nick's next paragraph calls it insincere.
        - |
          Correct. The insistence ("God, I'm"), the "defiant" glance "rather like Tom's" and the laugh "with thrilling scorn" make the line theatrical. The more she insists, the less we believe, which is exactly Nick's reaction.
        - |
          "I've been everywhere" is a boast, not information about her schooling; the passage gives no evidence of a European education.
        - |
          The scorn is general ("everything's terrible anyhow"), not aimed at Nick; he feels drawn into a performance, not mocked.
      answer: 1
      explanation: |
        A character's choice of words can enact the opposite of what they claim. Look at the stage business around the line (eyes flashing, laughter).

    - slug: u09-w28-q11
      type: short_answer
      topic_code: "1.E"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 2
      stimulus: *w28b
      prompt: |
        In one to three sentences, explain one complexity in Daisy that this passage reveals through her own words, and why that complexity matters for how a reader judges her.
      answer: |
        Daisy speaks a real grievance (she woke "utterly abandoned" while "Tom was God knows where" and wept at having a girl) and then turns it into a pose ("God, I'm sophisticated!"). The mix of genuine pain and performance means the reader cannot dismiss her as shallow or simply pity her: she sees her trap clearly but chooses to play the part it requires.
      explanation: |
        1 point: identifies a complexity grounded in her words (pain vs performance; insight vs complicity; abandonment vs her smirk of belonging with Tom). 1 point: explains why it matters (it complicates a simple judgment of her, or anticipates her later choices). A summary of what she says, without a tension, earns 0.

    # ---- Chapters 1-3 beyond the passages
    - slug: u09-w28-q12
      type: multiple_choice
      topic_code: "4.C"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      prompt: |
        In chapter 3, Nick says of Gatsby's smile that it "understood you just so far as you wanted to be understood, believed in you as you would like to believe in yourself." The repeated "you ... you" structure primarily suggests that
      options:
        - "Gatsby is a gifted listener who has studied psychology"
        - "the smile works as a mirror, giving each person back the self they hoped to project, which is part of Gatsby's power and part of his artifice"
        - "Nick has fallen in love with Gatsby at first sight"
        - "Gatsby is mocking his guests behind his smile"
      option_explanations:
        - |
          Nothing in the chapter mentions study; the sentence describes an effect on the viewer, not a training.
        - |
          Correct. Each clause turns back to "you": the smile reflects the viewer's own wishes. Nick is charmed, but the very next sentences note that it "vanished" and leave him facing "an elegant young roughneck," so the perspective includes doubt.
        - |
          The language is admiring, but the structure is about the viewer's self-image, not Nick's feelings; the immediate shift to "roughneck" checks any infatuation.
        - |
          The smile offers "eternal reassurance"; nothing suggests contempt. The artifice is in its perfection, not in mockery.
      answer: 1
      explanation: |
        Syntax reveals perspective (4.C): a repeated pattern can show what a narrator noticed and what he suspects.

