week: 29
unit: 9
title: Revelations and the Reunion, The Great Gatsby Chapters 4-6
topics: ["3.E"]
texts:
  - author: F. Scott Fitzgerald
    title: The Great Gatsby (Chapters IV-VI)
    year: 1925
    url: https://www.gutenberg.org/ebooks/64317
guide: guides/week-29.md
guide_description: |
  The middle of the novel as a chain of significant events: Gatsby's own story on the drive to New York, Jordan's
  account of Louisville in 1917, the reunion at Nick's house, and the delayed history of James Gatz. How each event
  changes what the reader knows and wants, with four worked close readings, a model paragraph, misreadings, self-check.
flashcards_description: |
  27 cards on the events, people and key lines of The Great Gatsby, chapters 4-6, and on explaining the function of
  a significant event in a plot.

flashcards:
  - front: Significant event (3.E) → what the skill asks
    back: |
      Not "what happens" but what an event does: what it reveals, what it changes in a character or a relationship, what it makes the reader expect or fear, and how it connects to the work's meaning. One event can do several jobs.
    topic_code: "3.E"
  - front: Gatsby ch. 4 → Gatsby's account of himself on the drive
    back: |
      He claims to be "the son of some wealthy people in the Middle West," educated at Oxford as "a family tradition," that he lived "like a young rajah" in Europe, and that he fought bravely in the war. The first version of his past: half lie, half truth.
    topic_code: "3.E"
  - front: '"San Francisco."'
    back: |
      Gatsby's answer when Nick asks what part of the Middle West his family came from. The geographical blunder exposes the story as invented, and Nick has to "restrain my incredulous laughter."
    topic_code: "3.E"
  - front: Gatsby's proofs on the drive (chapter 4)
    back: |
      A medal from Montenegro and a photograph of young men at Oxford with Gatsby among them. The proofs half-convince Nick: some of the incredible story turns out to be true, which makes the rest harder to judge.
    topic_code: "3.E"
  - front: The policeman and the white card (chapter 4)
    back: |
      Stopped for speeding, Gatsby waves a white card and the officer apologises. Gatsby says he once did the police commissioner a favour. A small event that shows unexplained power and connections.
    topic_code: "3.E"
  - front: Meyer Wolfshiem
    back: |
      Gatsby's associate at the lunch in chapter 4, the man Gatsby says fixed the 1919 World Series. He wears cuff buttons made of human molars. His presence answers the question of where Gatsby's money comes from with an unsettling hint.
    topic_code: "3.E"
  - front: Jordan's story → Louisville, 1917
    back: |
      In chapter 4 Jordan tells Nick how she saw Daisy, then eighteen, with a young lieutenant named Jay Gatsby in her white roadster. Daisy's family stopped her from going to New York to say goodbye to a soldier going overseas.
    topic_code: "3.E"
  - front: Daisy's wedding (Jordan's story)
    back: |
      In June 1919 Daisy married Tom Buchanan, who gave her a pearl necklace worth $350,000. The night before, Jordan found her drunk, clutching a letter, wanting to call the wedding off; a cold bath and the pearls later, she went through with it.
    topic_code: "3.E"
  - front: Why Gatsby bought his house
    back: |
      Jordan explains: so that Daisy would be just across the bay. The parties were thrown in the hope she might wander into one. The revelation reframes chapters 1-3, especially the man stretching his arms toward the green light.
    topic_code: "3.E"
  - front: Gatsby's request (end of chapter 4)
    back: |
      Through Jordan, Gatsby asks Nick to invite Daisy to tea some afternoon and let him come over. A modest request after an enormous effort, which makes Nick the go-between and sets up the reunion.
    topic_code: "3.E"
  - front: The reunion at Nick's house (chapter 5)
    back: |
      Rain, an awkward silence, Gatsby nearly knocking over Nick's defunct mantelpiece clock; then joy, Daisy's tears, and a tour of Gatsby's house. The novel's central event: the dream is attained and begins at once to shrink.
    topic_code: "3.E"
  - front: The stopped clock (chapter 5)
    back: |
      Gatsby, leaning nervously on Nick's mantelpiece, knocks a defunct clock and catches it. A comic beat with a symbolic edge: Gatsby wants to stop or turn back time, and the clock is already broken.
    topic_code: "5.C"
  - front: '"They''re such beautiful shirts"'
    back: |
      Daisy sobs into the pile of shirts Gatsby throws before her in chapter 5. Her emotion attaches to his display of wealth; the scene is moving, absurd and revealing at once.
    topic_code: "1.D"
  - front: '"His count of enchanted objects had diminished by one."'
    back: |
      Chapter 5: with Daisy beside him, the green light is "again a green light on a dock." A symbol loses its power once the distance it measured is gone; the sentence quietly predicts the fate of the dream itself.
    topic_code: "5.C"
  - front: '"the colossal vitality of his illusion"'
    back: |
      Nick's explanation for why Daisy "tumbled short of his dreams" in chapter 5: not her fault, but the size of the dream Gatsby had built, "decking it out with every bright feather that drifted his way."
    topic_code: "3.E"
  - front: Klipspringer
    back: |
      The hanger-on who seems to live in Gatsby's house; in chapter 5 Gatsby makes him play the piano for Daisy ("The Love Nest," "Ain't We Got Fun?"). Comic, and a sign of how many people live off Gatsby.
    topic_code: "3.E"
  - front: James Gatz
    back: |
      Gatsby's real name. Born in North Dakota to "shiftless and unsuccessful farm people," he changed his name at seventeen, the moment he rowed out to Dan Cody's yacht on Lake Superior.
    topic_code: "3.E"
  - front: Dan Cody
    back: |
      A millionaire from the Nevada silver fields and the Yukon. He took young Gatsby on as a steward and secretary on his yacht for five years. Gatsby learned money, manners and, from Cody's drinking, abstinence. Cody's legacy to him was taken by Ella Kaye.
    topic_code: "3.E"
  - front: '"sprang from his Platonic conception of himself"'
    back: |
      Chapter 6: Gatsby invented himself from an ideal, as Plato's forms precede their copies. "He was a son of God," Nick adds, bound to "His Father's business, the service of a vast, vulgar, and meretricious beauty."
    topic_code: "6.D"
  - front: '"His Father''s business" → the allusion'
    back: |
      Luke 2:49, the boy Jesus in the temple: "wist ye not that I must be about my Father's business?" Nick applies the phrase to a seventeen-year-old devoting himself to "vulgar, and meretricious beauty," a mix of reverence and irony.
    topic_code: "6.D"
  - front: Why Nick moves Gatsby's history to chapter 6
    back: |
      "He told me all this very much later, but I've put it down here with the idea of exploding those first wild rumours about his antecedents, which weren't even faintly true." Nick breaks chronology on purpose, placing the truth just after the reunion and just before Tom's suspicion begins.
    topic_code: "3.B"
  - front: Tom's visit and the party (chapter 6)
    back: |
      Tom stops at Gatsby's on horseback with a Mr. Sloane and a woman, who patronise Gatsby and ride off without him; then he and Daisy attend a party. Daisy is offended by West Egg; Tom begins asking who Gatsby is. The event moves the conflict from memory into the present.
    topic_code: "3.E"
  - front: '"Can''t repeat the past?" ... "Why of course you can!"'
    back: |
      Gatsby to Nick at the end of chapter 6, after the party. He wants Daisy to tell Tom she never loved him, then to be married from her old home in Louisville "just as if it were five years ago." The novel's clearest statement of his error.
    topic_code: "3.E"
  - front: Delayed exposition → in Gatsby
    back: |
      Background is released late and in pieces: rumours (chapters 2-3), Gatsby's version (chapter 4), Jordan's version (chapter 4), Nick's corrected version (chapter 6), the full Louisville story (chapter 8). Each piece revises the last.
    topic_code: "3.E"
  - front: Turning point → chapter 5
    back: |
      Structurally the novel's centre: chapter 5 of nine. Everything before builds toward the reunion; everything after measures the distance between the Daisy Gatsby has and the Daisy he imagined.
    topic_code: "3.E"
  - front: Achronological narration → the effect
    back: |
      Telling events out of time order. In *Gatsby* it creates mystery (who is he?), then irony (we learn his past while he is trying to repeat it), and lets Nick decide what the reader knows and when.
    topic_code: "3.E"
  - front: Gatsby's smile vs Gatsby's story → a pattern
    back: |
      In both chapter 3 and chapter 4, Nick is charmed and then checks himself: the smile "vanished" into a roughneck, the story fell "to pieces." Then evidence (the medal, the photo) pulls him back. Doubt and belief alternate.
    topic_code: "4.C"

quiz:
  description: |
    22 questions · about 35 minutes · about two thirds on chapters 4-6 of The Great Gatsby (what significant events
    reveal and change) and a third spiral review of perspective, reliability, sequence, symbol, simile, metaphor,
    allusion and thesis writing. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the analytical paragraph are graded by your teacher.
  questions:
    # ---- Passage set: Gatsby's account of himself (chapter 4)
    - slug: u09-w29-q01
      type: multiple_choice
      topic_code: "4.C"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: &w29a |
        *The following passage is from Chapter IV of F. Scott Fitzgerald's* The Great Gatsby *(1925). Gatsby is driving Nick into New York for lunch and has offered to tell him about himself.*

        "I'll tell you God's truth." His right hand suddenly ordered divine retribution to stand by. "I am the son of some wealthy people in the Middle West—all dead now. I was brought up in America but educated at Oxford, because all my ancestors have been educated there for many years. It is a family tradition."

        He looked at me sideways—and I knew why Jordan Baker had believed he was lying. He hurried the phrase "educated at Oxford," or swallowed it, or choked on it, as though it had bothered him before. And with this doubt, his whole statement fell to pieces, and I wondered if there wasn't something a little sinister about him, after all.

        "What part of the Middle West?" I inquired casually.

        "San Francisco."

        "I see."

        "My family all died and I came into a good deal of money." [...]

        "After that I lived like a young rajah in all the capitals of Europe—Paris, Venice, Rome—collecting jewels, chiefly rubies, hunting big game, painting a little, things for myself only, and trying to forget something very sad that had happened to me long ago."

        With an effort I managed to restrain my incredulous laughter. The very phrases were worn so threadbare that they evoked no image except that of a turbaned "character" leaking sawdust at every pore as he pursued a tiger through the Bois de Boulogne.
      prompt: |
        Nick's description of Gatsby's gesture, "His right hand suddenly ordered divine retribution to stand by," reveals that Nick regards the oath with
      options:
        - "reverence, because Gatsby is a deeply religious man"
        - "gentle irony, inflating a hand gesture into a summons to heaven so that the solemnity looks staged"
        - "fear, because he expects to be punished for doubting Gatsby"
        - "indifference, since the gesture is reported without comment"
      option_explanations:
        - |
          Nothing in the passage shows Gatsby's faith; the language belongs to Nick, who describes the gesture in mock-grand terms.
        - |
          Correct. The grand diction ("divine retribution") applied to a raised hand is mock-heroic: it shows Nick noticing the theatre in Gatsby's sincerity before the story even starts.
        - |
          The "retribution" is ordered to "stand by" against Gatsby if he lies; Nick is amused, not afraid.
        - |
          The choice of such inflated words is itself the comment. Diction can carry an attitude without an explicit judgment.
      answer: 1
      explanation: |
        Spiral review (4.C, perspective through diction, weeks 12 and 28). Ask why a narrator chose a big word for a small action.

    - slug: u09-w29-q02
      type: multiple_choice
      topic_code: "3.E"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w29a
      prompt: |
        Which best explains the function of this conversation in the plot of the novel?
      options:
        - "It settles the question of Gatsby's past so that the rest of the novel can focus on the present."
        - "It gives the reader Gatsby's own version of his past, a version the novel will later test and correct, so the reader learns to compare stories."
        - "It shows that Nick has decided Gatsby is a criminal and will have nothing more to do with him."
        - "It is a digression that interrupts the main plot about Tom and Myrtle."
      option_explanations:
        - |
          Far from settling anything, the story "fell to pieces" for Nick, and later chapters (Jordan's account, chapter 6, chapter 8) replace it piece by piece.
        - |
          Correct. This is the first of several accounts of Gatsby's past. Its mixture of absurdity and partial truth (the medal and Oxford photo follow) sets up the novel's habit of revising itself.
        - |
          Nick wonders if there is "something a little sinister" about Gatsby but goes on to lunch, and later agrees to arrange the tea with Daisy.
        - |
          Gatsby's past is the main plot's engine; the drive also leads to Wolfshiem and to Jordan's revelation about Daisy.
      answer: 1
      explanation: |
        3.E asks what an event does. An early, unreliable account functions as a baseline against which later revelations are measured.

    - slug: u09-w29-q03
      type: multiple_choice
      topic_code: "1.E"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w29a
      prompt: |
        Gatsby's reply "San Francisco" to the question "What part of the Middle West?" most strongly suggests that
      options:
        - "Gatsby's family had property in both regions"
        - "Gatsby is reciting a story he has not fully thought through, and his geography gives the invention away"
        - "Nick has misheard the question"
        - "Gatsby is deliberately joking to put Nick at ease"
      option_explanations:
        - |
          The text gives no basis for this; the answer is jarring precisely because San Francisco is not in the Middle West.
        - |
          Correct. The slip shows a self assembled from phrases rather than facts, and Nick's dry "I see" registers it. Gatsby's own speech reveals the gap between the self he presents and the self he is.
        - |
          Nick asked the question himself and asked it "casually," which suggests he is testing Gatsby, not that he misheard.
        - |
          Gatsby is in earnest ("God's truth"), which is why Nick has to restrain his laughter.
      answer: 1
      explanation: |
        Spiral review (1.E, choices and speech reveal complexity, weeks 17 and 28). One word of dialogue can carry the whole contradiction.

    - slug: u09-w29-q04
      type: multiple_choice
      topic_code: "5.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w29a
      prompt: |
        The sequence of verbs in "He hurried the phrase 'educated at Oxford,' or swallowed it, or choked on it" primarily serves to
      options:
        - "show Nick unable to decide which word fits, while every option suggests the phrase is hard for Gatsby to get out"
        - "show that Gatsby was eating while he spoke"
        - "prove that Gatsby never went to Oxford at all"
        - "suggest that Gatsby speaks with a foreign accent"
      option_explanations:
        - |
          Correct. Each verb is stronger than the last, and the "or ... or" construction shows Nick searching. All three describe difficulty, which hints at a sore point; chapter 7 reveals a partial truth (a few months at Oxford after the war).
        - |
          The verbs are figurative: the phrase is treated like something stuck in the throat, not food.
        - |
          The hesitation raises doubt but proves nothing. In chapter 7 Gatsby explains he spent five months at Oxford as an officer after the war, so the phrase is half true.
        - |
          Nothing concerns accent; the trouble is with one particular phrase, "as though it had bothered him before."
      answer: 0
      explanation: |
        Spiral review (5.B, the function of specific words, week 4). A string of alternatives can show a narrator's uncertainty as clearly as a single word shows his certainty.

    - slug: u09-w29-q05
      type: true_false
      topic_code: "4.D"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w29a
      prompt: |
        True or false: in this passage Nick accepts Gatsby's account of his past without doubt.
      answer: false
      explanation: |
        False. Nick sees "why Jordan Baker had believed he was lying," finds that the "whole statement fell to pieces," and has to "restrain my incredulous laughter." Spiral review (4.D, reliability, weeks 18 and 22): here the unreliable narrator is Gatsby, and Nick is the sceptical listener, for now.

    - slug: u09-w29-q06
      type: multiple_choice
      topic_code: "6.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w29a
      prompt: |
        The image of "a turbaned 'character' leaking sawdust at every pore as he pursued a tiger through the Bois de Boulogne" implies that Gatsby's story is
      options:
        - "an exotic but believable adventure"
        - "a cheap stage or storybook romance, a stuffed figure in a costume whose phrases have been used so often they are hollow"
        - "a coded confession of a real crime"
        - "a description of an actual hunting trip in Paris"
      option_explanations:
        - |
          Nick calls the phrases "threadbare" and can barely keep from laughing; he does not find them believable.
        - |
          Correct. The quotation marks around "character," the sawdust stuffing and the absurd tiger hunt in a Paris park turn Gatsby's account into a puppet from popular fiction, a metaphor for a self made of borrowed phrases.
        - |
          The image mocks the story's style; it does not decode a hidden crime.
        - |
          The Bois de Boulogne is a Paris park, which is exactly why a tiger hunt there is absurd. The image is figurative.
      answer: 1
      explanation: |
        Spiral review (6.B, metaphor, weeks 6 and 16). Unpack each element: costume, stuffing, absurd setting. Together they say "fake."

    # ---- Passage set: the reunion (chapter 5)
    - slug: u09-w29-q07
      type: multiple_choice
      topic_code: "3.E"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: &w29b |
        *The following passages are from Chapter V of* The Great Gatsby *(1925). Gatsby has just been reunited with Daisy, after nearly five years, at Nick's house, and is showing her his own. Earlier he has pointed out the green light at the end of her dock across the bay.*

        Daisy put her arm through his abruptly, but he seemed absorbed in what he had just said. Possibly it had occurred to him that the colossal significance of that light had now vanished forever. Compared to the great distance that had separated him from Daisy it had seemed very near to her, almost touching her. It had seemed as close as a star to the moon. Now it was again a green light on a dock. His count of enchanted objects had diminished by one.

        [...]

        As I went over to say goodbye I saw that the expression of bewilderment had come back into Gatsby's face, as though a faint doubt had occurred to him as to the quality of his present happiness. Almost five years! There must have been moments even that afternoon when Daisy tumbled short of his dreams—not through her own fault, but because of the colossal vitality of his illusion. It had gone beyond her, beyond everything. He had thrown himself into it with a creative passion, adding to it all the time, decking it out with every bright feather that drifted his way. No amount of fire or freshness can challenge what a man can store up in his ghostly heart.
      prompt: |
        Which best describes the function of the reunion, as Nick presents it here, in the plot of the novel?
      options:
        - "It resolves the novel's conflict, since Gatsby has finally won Daisy."
        - "It is the moment the dream is attained, and Nick shows it beginning at once to shrink, which prepares for the later collapse."
        - "It shows that Daisy no longer cares for Gatsby at all."
        - "It introduces Daisy for the first time."
      option_explanations:
        - |
          The conflict with Tom has not begun; and Nick's "faint doubt" and "bewilderment" show the reunion opening a new problem rather than ending one.
        - |
          Correct. In the novel's central chapter the green light loses its "colossal significance" and Daisy "tumbled short of his dreams." Attainment and loss arrive together, so the event turns the plot toward disillusion.
        - |
          She takes his arm "abruptly"; the problem is not her feelings but the size of his illusion, "not through her own fault."
        - |
          Daisy has been present since chapter 1; this is her reunion with Gatsby after almost five years.
      answer: 1
      explanation: |
        A significant event can change direction without changing outcome yet. Ask what is different after it: here, the dream has met reality.

    - slug: u09-w29-q08
      type: multiple_choice
      topic_code: "5.C"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w29b
      prompt: |
        The sentence "Now it was again a green light on a dock" suggests that the green light
      options:
        - "has always been an ordinary object with no meaning for Gatsby"
        - "drew its symbolic power from the distance between Gatsby and Daisy, and with that distance closed, it reverts to a mere object"
        - "has been switched off by the Buchanans"
        - "now represents Tom's power over Daisy"
      option_explanations:
        - |
          "Again" implies it was once more than a light; the paragraph speaks of its "colossal significance."
        - |
          Correct. The symbol meant something because it marked longing across water. Once Gatsby has Daisy's arm, it is only a light, and "his count of enchanted objects had diminished by one."
        - |
          Nothing says the light went out; it is still there, but it no longer means what it did.
        - |
          The passage links the light to Gatsby's distance from Daisy, not to Tom; reading Tom into it imports a meaning the text does not support.
      answer: 1
      explanation: |
        Spiral review (5.C, symbol, weeks 19, 24 and 26). A symbol's meaning can change within a novel; notice when and why.

    - slug: u09-w29-q09
      type: multiple_choice
      topic_code: "6.A"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: *w29b
      prompt: |
        The simile "as close as a star to the moon" is best described as
      options:
        - "a straightforward comparison showing that the light and Daisy were physically close"
        - "double-edged: in the sky a star looks close to the moon but is immeasurably far, so the image captures both Gatsby's feeling of nearness and the real distance"
        - "a reference to the night of the reunion, which was lit by a full moon"
        - "a sign that Gatsby is an astronomer"
      option_explanations:
        - |
          The sentence before contrasts the light with "the great distance that had separated him from Daisy"; the simile is about how near it *seemed*.
        - |
          Correct. The comparison works on appearances: a star beside the moon looks almost touching. Read literally, it reminds us the two are vastly apart, which is the truth about Gatsby and his idea of Daisy.
        - |
          The reunion takes place in the rain in the afternoon; the simile is figurative, not a weather report.
        - |
          Figurative language describes his longing, not his profession.
      answer: 1
      explanation: |
        Spiral review (6.A, simile, week 6). Ask what is true about the vehicle (star and moon) that might undercut the surface meaning.

    - slug: u09-w29-q10
      type: multi_select
      topic_code: "4.C"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 2
      partial_credit: true
      stimulus: *w29b
      prompt: |
        Select the TWO phrases in which Nick openly interprets Gatsby's inner life rather than reporting what he could observe.
      options:
        - "\"Daisy put her arm through his abruptly\""
        - "\"Possibly it had occurred to him that the colossal significance of that light had now vanished forever\""
        - "\"There must have been moments even that afternoon when Daisy tumbled short of his dreams\""
        - "\"As I went over to say goodbye\""
      option_explanations:
        - |
          A visible action Nick could see; it reports, it does not interpret.
        - |
          Correct. "Possibly" marks a guess about what went on in Gatsby's mind. Nick, a first-person narrator, cannot know it.
        - |
          Correct. "There must have been" is inference, not observation; Nick reasons his way into Gatsby's disappointment.
        - |
          Nick's own movement, reported plainly; it frames the scene but interprets nothing.
      answer: [1, 2]
      explanation: |
        Spiral review (4.C, perspective). Words like "possibly," "must have," "as though" show a narrator reaching past his limits; they reveal Nick's sympathy and his speculation.

    - slug: u09-w29-q11
      type: short_answer
      topic_code: "3.E"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 2
      stimulus: *w29b
      prompt: |
        In one to three sentences, explain how the reunion in chapter 5 functions as a turning point in the novel, using one phrase from the passage.
      answer: |
        The reunion is the moment Gatsby gets what he has worked five years for, and Nick shows that getting it begins to destroy it: Daisy "tumbled short of his dreams" because of "the colossal vitality of his illusion." From here the plot turns from pursuit to the strain of making a real woman match an imagined one.
      explanation: |
        1 point: identifies what changes (attainment begins disillusion, or the green light loses meaning, or the conflict shifts from reaching Daisy to keeping her). 1 point: supports it with a relevant phrase and links it to what follows. A summary of the scene earns 0.

    # ---- Passage set: James Gatz (chapter 6)
    - slug: u09-w29-q12
      type: multiple_choice
      topic_code: "3.B"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 1
      stimulus: &w29c |
        *The following passage is from Chapter VI of* The Great Gatsby *(1925). Nick explains Gatsby's origins; he later says that Gatsby told him all this "very much later."*

        James Gatz—that was really, or at least legally, his name. He had changed it at the age of seventeen and at the specific moment that witnessed the beginning of his career—when he saw Dan Cody's yacht drop anchor over the most insidious flat on Lake Superior. It was James Gatz who had been loafing along the beach that afternoon in a torn green jersey and a pair of canvas pants, but it was already Jay Gatsby who borrowed a rowboat, pulled out to the *Tuolomee*, and informed Cody that a wind might catch him and break him up in half an hour.

        I suppose he'd had the name ready for a long time, even then. His parents were shiftless and unsuccessful farm people—his imagination had never really accepted them as his parents at all. The truth was that Jay Gatsby of West Egg, Long Island, sprang from his Platonic conception of himself. He was a son of God—a phrase which, if it means anything, means just that—and he must be about His Father's business, the service of a vast, vulgar, and meretricious beauty. So he invented just the sort of Jay Gatsby that a seventeen-year-old boy would be likely to invent, and to this conception he was faithful to the end.
      prompt: |
        Nick says he learned this history "very much later" but places it here, in chapter 6, just after the reunion. The main effect of this sequencing is to
      options:
        - "keep Gatsby's origins secret until the final chapter"
        - "give the reader the truth about Gatsby's past at the moment he is trying to recover his own past with Daisy, so the reader sees what he is really trying to preserve"
        - "show that Nick has forgotten the order in which events happened"
        - "explain where Gatsby's money came from in full detail"
      option_explanations:
        - |
          The passage reveals his origins in chapter 6, not at the end; Nick explicitly moves them earlier than he learned them.
        - |
