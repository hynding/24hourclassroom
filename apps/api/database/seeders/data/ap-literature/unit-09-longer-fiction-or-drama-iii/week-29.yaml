    - slug: u09-w29-q22
      type: long_answer
      topic_code: "3.E"
      source: "F. Scott Fitzgerald, The Great Gatsby (1925)"
      points: 4
      stimulus: *w29b
      prompt: |
        Write one well-developed analytical paragraph (8-12 sentences) explaining how the reunion of Gatsby and Daisy in chapter 5 functions in the novel as a whole. Use at least two pieces of evidence from the passage above and at least one reference to an event elsewhere in the novel.
      answer: |
        Claim: the reunion functions as the novel's hinge, the point at which Gatsby's dream is fulfilled and in the same moment exposed as larger than any real person could match, which sets up the collapse of chapters 7-9.
        Evidence: the green light loses its "colossal significance" and becomes "again a green light on a dock"; Daisy "tumbled short of his dreams ... because of the colossal vitality of his illusion"; Gatsby's "bewilderment" and "faint doubt."
        Commentary: the light measured distance, so closing the distance empties it; Nick places the fault in the illusion, not Daisy; the dream had been "decking" itself "with every bright feather," so no reunion could equal it. Link: this explains Gatsby's demand in chapter 6 that Daisy erase the past ("Can't repeat the past? ... Why of course you can!") and the confrontation at the Plaza in chapter 7, where he asks for more than she can give.
      explanation: |
        4 points. 1: a clear claim about the reunion's function (turning point, beginning of disillusion, shift of conflict). 1: at least two well-chosen pieces of evidence from the passage. 1: commentary that explains how the specific language (the light's reversion, "tumbled short," "colossal vitality of his illusion") supports the claim. 1: a precise link to another event (Gatsby's demands in chapter 6, the Plaza in chapter 7, the ending) that shows the reunion's consequences. Summary without explanation caps the paragraph at 2.
