    - slug: u09-w31-q19
      type: multiple_choice
      topic_code: "1.E"
      source: "general knowledge"
      points: 1
      prompt: |
        In Act II Nora is about to ask Dr. Rank for help when he declares that he loves her. She then refuses to ask him for anything. Which best explains what this choice reveals?
      options:
        - "Nora is afraid of Rank."
        - "Nora has a firm sense of honour: she will not use a man's love to get money, even to save herself, which shows a moral seriousness Helmer never sees."
        - "Nora does not need money any more."
        - "Nora wants to make Helmer jealous."
      option_explanations:
        - |
          She is at ease with Rank; what changes is that taking his money now would mean trading on his feelings.
        - |
          Correct. The choice costs her the easiest way out. It shows the woman Helmer calls a featherbrain drawing a clear moral line, and it makes her later judgment of Helmer more credible.
        - |
          She still owes Krogstad and is threatened with exposure; she needs help more than ever.
        - |
          The scene is private, and Helmer never learns of it from her.
      answer: 1
      explanation: |
        1.E: a refusal is a choice too, often the most revealing kind.

