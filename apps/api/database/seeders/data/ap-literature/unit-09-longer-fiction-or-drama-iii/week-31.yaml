week: 31
unit: 9
title: Nora's Secret and the Coming Conflict, A Doll's House Acts I-II
topics: ["1.E", "3.F"]
texts:
  - author: Henrik Ibsen (translated by William Archer)
    title: A Doll's House (Acts I-II), in The Collected Works of Henrik Ibsen, Vol. VII
    year: 1879
    url: https://www.gutenberg.org/ebooks/70566
guide: guides/week-31.md
guide_description: |
  Ibsen's play as drama to be read: how Nora's own speech and choices reveal a woman far more complex than the
  "lark" her husband sees, and how the hidden loan and Krogstad's threat build the conflict of Acts I-II. Four worked
  close readings, a model paragraph, misreadings, self-check.
flashcards_description: |
  28 cards on the people, events, lines and stagecraft of A Doll's House, Acts I-II (William Archer's translation),
  and on reading character and conflict in drama.

flashcards:
  - front: A Doll's House → publication facts
    back: |
      Henrik Ibsen's *Et Dukkehjem*, published in Copenhagen in December 1879 and first performed there that month. William Archer's English translation appeared in 1889; this course quotes the revised text in his *Collected Works of Henrik Ibsen*, Volume VII.
    topic_code: "1.E"
  - front: Reading a play → what replaces the narrator
    back: |
      No narrator tells you what to think. Character is revealed through dialogue, stage directions, entrances and exits, objects and the gaps between what people say and what the audience knows. Every 1.E reading of a play rests on choices and speech.
    topic_code: "1.E"
  - front: Doll's House setting → Act I
    back: |
      A comfortably but not expensively furnished room in the Helmers' flat in a Norwegian town, on Christmas Eve. The whole play happens in this one room over three days: a box, or a doll's house.
    topic_code: "3.F"
  - front: Torvald Helmer
    back: |
      Nora's husband, a lawyer just appointed manager of the Joint Stock Bank. Proud of his "principles," especially "No debts! No borrowing!" He treats Nora fondly, as a child or pet.
    topic_code: "1.E"
  - front: '"Is that my lark twittering there?"'
    back: |
      Helmer's first line, called from his study. With "squirrel," "featherbrain" and "spendthrift," it sets his pet names for Nora: small, decorative, flighty creatures. The names are affectionate and diminishing at once.
    topic_code: "1.E"
  - front: The macaroons
    back: |
      Helmer has forbidden Nora sweets. She hides a bag of macaroons, eats some, and when he asks whether she has "nibbled a macaroon or two," answers "No, Torvald, indeed, indeed!" A small, funny lie that prepares us for a large hidden one.
    topic_code: "1.E"
  - front: '"No debts! No borrowing!"'
    back: |
      Helmer's principle, from his first scene: "Home life ceases to be free and beautiful as soon as it is founded on borrowing and debt." Dramatic irony: his own home is founded on a loan he knows nothing about.
    topic_code: "3.F"
  - front: Mrs. Linden (Christina)
    back: |
      Nora's old school friend, a widow, who married a man she did not love to support her bedridden mother and two younger brothers. Now alone and penniless, she asks Nora to help her find work at Helmer's bank. Archer calls her Mrs. Linden; other translations use Mrs. Linde.
    topic_code: "1.E"
  - front: '"I saved Torvald''s life."'
    back: |
      Nora's secret, told to Mrs. Linden in Act I. When Helmer was dangerously ill, she raised the money for a year in Italy without his knowledge, letting him think it came from her father.
    topic_code: "1.E"
  - front: '"a wife can''t borrow without her husband''s consent"'
    back: |
      Mrs. Linden's objection in Act I. Nora's reply ("when the wife has some idea of business, and knows how to set about things——") shows both her pride and the law she had to get round.
    topic_code: "3.F"
  - front: The copying work
    back: |
      To pay the instalments, Nora saved from her dress allowance and did copying at night: "it was splendid to work in that way and earn money. I almost felt as if I was a man." Competence and pride hidden inside the doll.
    topic_code: "1.E"
  - front: '"something in reserve"'
    back: |
      Nora plans to tell Helmer "many, many years hence, when I'm—not so pretty," when dancing and dressing up no longer amuse him: "Then it might be well to have something in reserve." She knows what her charm is worth in the marriage.
    topic_code: "1.E"
  - front: Krogstad
    back: |
      A clerk with "a small post in the Joint Stock Bank," a father whose sons are growing up, whose reputation was ruined by an old forgery that "never came into court." He lent Nora the money and now holds her bond.
    topic_code: "3.F"
  - front: The forged signature
    back: |
      Nora's father was to co-sign her bond. He died on 29 September; the signature is dated 2 October, three days after his death. Nora signed his name herself, to spare a dying man worry. Krogstad sees the date and knows.
    topic_code: "3.F"
  - front: Krogstad's threat (Act I)
    back: |
      Helmer means to dismiss Krogstad from the bank. Krogstad tells Nora that unless she saves his post, he will reveal the forgery. Nora protests that the law cannot punish a motive like hers; Krogstad answers that the law does not ask about motives.
    topic_code: "3.F"
  - front: Krogstad and Nora → the parallel
    back: |
      Both committed forgery; both did it, they say, under pressure; both fear for their children. Krogstad is a mirror held up to Nora: what she could become if the secret came out.
    topic_code: "1.E"
  - front: Helmer on lying parents (end of Act I)
    back: |
      Helmer explains how a forger poisons his home: "Every breath the children draw contains some germ of evil," and "Nearly all cases of early corruption may be traced to lying mothers." He means Krogstad; Nora hears herself.
    topic_code: "3.F"
  - front: '"Corrupt my children!—Poison my home!"'
    back: |
      Nora alone, at the end of Act I, repeating Helmer's words in terror, then: "It's not true! It can never, never be true!" The act ends on her internal conflict.
    topic_code: "3.F"
  - front: The stripped Christmas tree (Act II opening)
    back: |
      "The Christmas-tree, stripped, and with the candles burnt out." The decorated tree of Act I, once a symbol of the happy home, now matches Nora's state after Krogstad's threat.
    topic_code: "5.C"
  - front: Anna, the nurse
    back: |
      Nora's old nurse, now nurse to her children. She gave up her own child to strangers to take the "good place." Nora asks her whether children would forget a mother who "went quite away."
    topic_code: "1.E"
  - front: Dr. Rank
    back: |
      The family friend, dying of a disease of the spine inherited from his father's dissipation. In Act II, as Nora is about to ask him for help, he declares his love; she refuses to ask him for anything after that.
    topic_code: "1.E"
  - front: Nora's refusal to use Rank (Act II)
    back: |
      Once Rank confesses love, Nora will not take his money, though it would save her. The choice shows a moral line she will not cross and a dignity Helmer never sees.
    topic_code: "1.E"
  - front: The letter-box
    back: |
      Krogstad drops his letter exposing the forgery into Helmer's locked letter-box at the end of Act II. Only Helmer has the key. The box on stage is the ticking clock of the play.
    topic_code: "3.F"
  - front: The tarantella
    back: |
      A wild Italian dance Nora is to perform at the fancy-dress ball. In Act II she rehearses it frantically to keep Helmer away from the letter-box: a performance that is also a desperate delay.
    topic_code: "3.F"
  - front: '"the miracle" (Act II)'
    back: |
      Nora's private hope and dread: that when the truth comes out Helmer will take the guilt on himself. To Mrs. Linden: "It's the miracle coming to pass." Later: "there's something glorious in waiting for the miracle."
    topic_code: "1.E"
  - front: Mrs. Linden and Krogstad
    back: |
      In Act II Mrs. Linden reveals she once knew Krogstad and goes to speak to him for Nora. Their past love becomes a counter-plot, resolved in Act III.
    topic_code: "3.F"
  - front: Dramatic irony → in Acts I-II
    back: |
      The audience knows what Helmer does not: his life was saved by borrowed money and a forgery, by the "featherbrain" he lectures about debt. Almost every speech he makes about honour is double-edged.
    topic_code: "3.F"
  - front: Well-made play → Ibsen's use of it
    back: |
      A 19th-century form built on a secret, a letter, a threatening outsider and timed suspense. Ibsen uses all of it in Acts I-II, then in Act III turns the plot into a discussion.
    topic_code: "3.F"

quiz:
  description: |
    22 questions · about 35 minutes · about two thirds on Acts I-II of A Doll's House (what Nora's own words and choices
    reveal, and how the hidden loan becomes the play's conflict) and a third spiral review of character, relationships,
    contrast, symbol, word choice and thesis writing, including Gatsby. Multiple choice, select-all and true/false items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the essay are graded by
    your teacher.
  questions:
    # ---- Passage set: Nora and Mrs. Linden (Act I)
    - slug: u09-w31-q01
      type: multiple_choice
      topic_code: "1.E"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: &w31a |
        *The following passage is from Act I of Henrik Ibsen's* A Doll's House *(1879), in William Archer's translation. Nora has just told her old friend Mrs. Linden that, years ago, she secretly raised the money for a journey to Italy that saved her husband Torvald's life.*

        MRS. LINDEN. And you have never confessed to your husband?

        NORA. Good heavens! What can you be thinking of? Tell him, when he has such a loathing of debt! And besides—how painful and humiliating it would be for Torvald, with his manly self-respect, to know that he owed anything to me! It would utterly upset the relation between us; our beautiful, happy home would never again be what it is.

        MRS. LINDEN. Will you never tell him?

        NORA. [*Thoughtfully, half-smiling.*] Yes, some time perhaps—many, many years hence, when I'm—not so pretty. You mustn't laugh at me! Of course I mean when Torvald is not so much in love with me as he is now; when it doesn't amuse him any longer to see me dancing about, and dressing up and acting. Then it might be well to have something in reserve. [*Breaking off.*] Nonsense! nonsense! That time will never come. Now, what do you say to my grand secret, Christina? Am I fit for nothing now?
      prompt: |
        Nora's explanation of why she cannot tell Torvald ("how painful and humiliating it would be for Torvald, with his manly self-respect") reveals that she
      options:
        - "believes Torvald would be grateful and proud of her"
        - "understands her husband's vanity clearly and has chosen to protect it, which shows more insight than the childlike role she plays"
        - "is ashamed of having broken the law and fears prison"
        - "does not love Torvald and wants to keep power over him"
      option_explanations:
        - |
          She predicts the opposite: the truth would be "painful and humiliating" for him. Gratitude is what she hopes for later, as "the miracle," not what she expects now.
        - |
          Correct. "Manly self-respect" is an exact diagnosis: Torvald's pride depends on being the one who provides. Nora sees it and manages it, which makes her far more perceptive than the "lark" he believes he married.
        - |
          At this point Nora does not yet understand that she has broken the law; her concern is Torvald's feelings and the "relation between us."
        - |
          She speaks of "our beautiful, happy home" and saved his life; she protects him, though "something in reserve" shows she knows the secret is a kind of power.
      answer: 1
      explanation: |
        1.E: a character's own speech can reveal knowledge she does not admit to having. Nora's words diagnose the marriage before she consciously questions it.

    - slug: u09-w31-q02
      type: multiple_choice
      topic_code: "1.E"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w31a
      prompt: |
        Nora's plan to tell Torvald "when I'm—not so pretty," and to keep the secret as "something in reserve," most clearly suggests that she
      options:
        - "expects her marriage to grow happier with time"
        - "half-knows that Torvald's love depends on her charm and performance, and plans for the day it fades"
        - "intends to leave Torvald when she is older"
        - "is joking and has no real worries about the future"
      option_explanations:
        - |
          She imagines a time "when Torvald is not so much in love with me as he is now," which is the opposite of growing happiness.
        - |
          Correct. She names what Torvald values ("dancing about, and dressing up and acting") and imagines needing a reserve when it no longer amuses him. Then she breaks off ("Nonsense!"), refusing the thought she has just had.
        - |
          The secret is to be revealed within the marriage, as a reserve, not as a way out; leaving is not yet in her mind.
        - |
          The dash before "not so pretty" and the abrupt "Nonsense! nonsense!" show discomfort, not a joke.
      answer: 1
      explanation: |
        Stage directions matter: "[Thoughtfully, half-smiling]" and "[Breaking off]" show Nora approaching a truth and retreating from it.

    - slug: u09-w31-q03
      type: multiple_choice
      topic_code: "3.F"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w31a
      prompt: |
        In the play as a whole, the secret Nora describes here functions primarily as
      options:
        - "a comic subplot that is forgotten by Act III"
        - "the hidden source of the central conflict: a loan that contradicts the marriage's stated roles and that Krogstad will threaten to expose"
        - "a misunderstanding that is cleared up once Torvald learns the facts"
        - "a symbol of Torvald's generosity"
      option_explanations:
        - |
          The loan drives every act; in Act III its exposure brings the marriage to its crisis.
        - |
          Correct. The secret puts Nora, the supposed child, in the role of rescuer and borrower, against Torvald's "No debts! No borrowing!" Krogstad's threat in the same act turns that hidden contradiction into open conflict.
        - |
          When Torvald learns the facts in Act III, the conflict deepens rather than clears; that is the play's turn.
        - |
          The money was raised behind his back; Torvald was the one who refused to borrow.
      answer: 1
      explanation: |
        3.F: identify the conflict's source and what it produces. Here a secret contradiction becomes a public crisis.

    - slug: u09-w31-q04
      type: multiple_choice
      topic_code: "5.B"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w31a
      prompt: |
        Nora's phrase "dancing about, and dressing up and acting" is significant chiefly because it
      options:
        - "lists her hobbies, which have no bearing on the plot"
        - "names, half-consciously, the role she plays in her marriage and anticipates the costume ball and the tarantella"
        - "shows that Nora was once a professional actress"
        - "describes what Mrs. Linden does for a living"
      option_explanations:
        - |
          The phrase has a great deal of bearing: Nora's dance becomes the device of Act II, and her "acting" is the theme of Act III.
        - |
          Correct. The three verbs describe performance: Nora entertains Torvald, and she knows it. The words also set up the fancy-dress ball and the frantic tarantella, where the performance becomes literal.
        - |
          Nothing suggests a stage career; "acting" here is how she behaves at home.
        - |
          Mrs. Linden has worked at a shop, a school and odd jobs; the phrase is Nora's description of herself.
      answer: 1
      explanation: |
        Spiral review (5.B, the function of specific words, week 4). A casual list can carry a play's theme.

    - slug: u09-w31-q05
      type: true_false
      topic_code: "1.D"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w31a
      prompt: |
        True or false: Nora believes that telling Torvald about the loan would strengthen their relationship.
      answer: false
      explanation: |
        False. She says it "would utterly upset the relation between us." Spiral review (1.D, nuances in relationships, weeks 12 and 23): the line shows she knows their happiness depends on an imbalance, Torvald as provider, herself as dependant.

    - slug: u09-w31-q06
      type: multi_select
      topic_code: "1.A"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 2
      partial_credit: true
      stimulus: *w31a
      prompt: |
        Select the TWO details that most reveal Nora's pride in what she has done.
      options:
        - "\"Now, what do you say to my grand secret, Christina?\""
        - "\"Am I fit for nothing now?\""
        - "\"Tell him, when he has such a loathing of debt!\""
        - "\"You mustn't laugh at me!\""
      option_explanations:
        - |
          Correct. "Grand" shows how she values the secret, and she invites admiration.
        - |
          Correct. The question answers the condescension Nora has felt from Mrs. Linden and from everyone; she wants her competence acknowledged.
        - |
          This explains why she cannot tell Torvald; it concerns his feelings, not her pride.
        - |
          A defensive plea about the "not so pretty" remark; it shows embarrassment rather than pride.
      answer: [0, 1]
      explanation: |
        Spiral review (1.A, what details reveal about a character's perspective and motives, weeks 1 and 4).

    # ---- Passage set: Nora and Anna (Act II)
    - slug: u09-w31-q07
      type: multiple_choice
      topic_code: "1.E"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: &w31b |
        *The following passage is from the beginning of Act II of* A Doll's House *(1879), in William Archer's translation. It is Christmas Day. At the end of Act I, Krogstad threatened to reveal that Nora forged a signature, and Helmer told Nora that a parent who lies corrupts her children. Anna, the nurse, has brought in a box of fancy-dress costumes.*

        NORA. Worse things might happen.—What are the children doing?

        ANNA. They're playing with their Christmas presents, poor little dears; but——

        NORA. Do they often ask for me?

        ANNA. You see they've been so used to having their mamma with them.

        NORA. Yes; but, Anna, I can't have them so much with me in future.

        ANNA. Well, little children get used to anything.

        NORA. Do you think they do? Do you believe they would forget their mother if she went quite away?

        ANNA. Gracious me! Quite away?

        NORA. Tell me, Anna—I've so often wondered about it—how could you bring yourself to give your child up to strangers?

        ANNA. I had to when I came to nurse my little Miss Nora.

        NORA. But how could you make up your mind to it?

        ANNA. When I had the chance of such a good place? A poor girl who's been in trouble must take what comes. That wicked man did nothing for me.

        NORA. But your daughter must have forgotten you.

        ANNA. Oh, no, ma'am, that she hasn't. She wrote to me both when she was confirmed and when she was married.

        NORA. [*Embracing her.*] Dear old Anna—you were a good mother to me when I was little.

        ANNA. My poor little Nora had no mother but me.
      prompt: |
        Nora's statement "I can't have them so much with me in future" is best understood as a choice that reveals
      options:
        - "that she has grown tired of her children"
        - "that she has taken Helmer's warning about lying mothers to heart and is withdrawing from her children to protect them"
        - "that Helmer has forbidden her to see the children"
        - "that she is planning a holiday in Italy"
      option_explanations:
        - |
          Her questions show anxious love ("Do they often ask for me?"); she is not tired of them.
        - |
          Correct. Helmer told her at the end of Act I that a lying parent poisons "every breath the children draw." Nora acts on it: she keeps away from them, which is both loving and terrible.
        - |
          No such order exists; the decision is Nora's own, which is what makes it revealing.
        - |
          The trip to Italy is in the past; the remark looks to a future without her.
      answer: 1
      explanation: |
        1.E: a quiet line can be a major choice. Connect it to what the character has just heard.

    - slug: u09-w31-q08
      type: multiple_choice
      topic_code: "3.F"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w31b
      prompt: |
        Nora's question "would [they] forget their mother if she went quite away?" functions in the play primarily to
      options:
        - "show that Nora has already decided to leave Helmer"
        - "reveal an internal conflict in which Nora is contemplating death or departure, and to foreshadow the ending in which she does leave"
        - "suggest that Anna is planning to leave the household"
        - "provide a moment of comic relief"
      option_explanations:
        - |
          She has not decided anything; she is testing an idea in a hypothetical ("if she went"). The decision comes only in Act III.
        - |
          Correct. "Quite away" is ambiguous (suicide, flight), and Nora's whole conflict is in it: love for her children against the belief that she will poison them. The question plants the play's final act.
        - |
          The question is about "their mother," Nora; Anna is answering it, not planning anything.
        - |
          Anna's "Gracious me!" registers alarm; the exchange is grave.
      answer: 1
      explanation: |
        3.F: internal conflict is often spoken indirectly. Look for questions a character asks about someone else that are really about herself.

    - slug: u09-w31-q09
      type: multiple_choice
      topic_code: "1.C"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w31b
      prompt: |
        Anna's story of giving up her own child to take "such a good place" functions most clearly as
      options:
        - "a parallel and contrast to Nora: a woman of a poorer class who was forced to leave her child, while Nora is wondering whether to leave hers"
        - "evidence that Anna is cruel and unfit to look after Nora's children"
        - "an explanation of why Nora married Helmer"
        - "a piece of background that has no bearing on Nora"
      option_explanations:
        - |
          Correct. Anna left her daughter from economic necessity ("A poor girl ... must take what comes"); Nora, who has never had to choose, is now imagining a choice. The parallel shows how class and money shape women's options in the play.
        - |
          Anna's daughter has not forgotten her, and Nora calls her "a good mother to me"; the text does not make her cruel.
        - |
          The passage says nothing of Nora's marriage; it concerns mothers and children.
        - |
          Nora asks the question because the story bears directly on her; she has "so often wondered about it."
      answer: 0
      explanation: |
        Spiral review (1.C, contrasting characters, weeks 13 and 18). Minor characters often hold up a mirror to the protagonist.

    - slug: u09-w31-q10
      type: fill_blank
      topic_code: "1.A"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      stimulus: *w31b
      prompt: |
        Nora, embracing Anna: "Dear old Anna—you were a good ____ to me when I was little."
      answer: ["mother"]
      explanation: |
        "Mother." Spiral review (1.A). Nora was raised by a servant who gave up her own child, a detail that deepens the question of what mothers owe children.

    - slug: u09-w31-q11
      type: short_answer
      topic_code: "1.E"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 2
      stimulus: *w31b
      prompt: |
        In one to three sentences, explain one complexity in Nora that this exchange with Anna reveals, and why it matters for the rest of the play.
      answer: |
        Nora withdraws from the children she loves because she believes, after Helmer's speech, that a lying mother will corrupt them, so her love and her guilt pull in opposite directions. This matters because in Act III she leaves her children, and this scene shows the choice coming from love and fear rather than indifference.
      explanation: |
        1 point: names a complexity rooted in the passage (love vs fear of corrupting; the playful wife privately imagining leaving; her own motherless childhood). 1 point: links it to later events (the last act's departure, her thoughts of death in Act II).

    # ---- Acts I-II beyond the passages
    - slug: u09-w31-q12
      type: multiple_choice
      topic_code: "1.E"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      prompt: |
        Early in Act I Nora hides a bag of macaroons, eats some, and when Helmer asks whether she has "nibbled a macaroon or two," answers "No, Torvald, indeed, indeed!" What is the main function of this small deception?
      options:
        - "It shows that Nora is greedy and dishonest by nature."
        - "It establishes, comically, a marriage in which Helmer makes rules and Nora quietly gets round them, preparing for the far larger secret of the loan."
        - "It shows Helmer's real concern for Nora's health."
        - "It provides a clue that Nora is ill."
      option_explanations:
        - |
          The lie is affectionate and childlike, not the sign of a bad character; the play goes on to show her lies come from the role she is given.
        - |
          Correct. The scene sets the pattern in miniature: a husband who forbids, a wife who obeys in appearance and acts in secret. The audience laughs, and then learns about the forged bond.
        - |
          Nothing in the scene concerns health; the rule is about indulgence and money.
        - |
          Nora is not ill; it was Helmer who was dangerously ill years ago, which is why the loan was needed.
      answer: 1
      explanation: |
        Opening scenes in drama often stage the whole situation in a small, comic action.

    - slug: u09-w31-q13
      type: multiple_choice
      topic_code: "3.F"
      source: "general knowledge"
      points: 1
      prompt: |
        When Krogstad threatens Nora in Act I, she insists that no law could punish a daughter for sparing her dying father or a wife for saving her husband's life. Krogstad replies, in effect, that the law takes no account of motives. What does this exchange contribute to the play's conflict?
      options:
        - "It shows that Krogstad is a villain without any reasons of his own."
        - "It sets Nora's private morality of love and loyalty against a public, legal morality that ignores motive, a conflict that will reach into her marriage."
        - "It proves that Nora has committed no crime."
        - "It shows that Helmer has already learned the truth."
      option_explanations:
        - |
          Krogstad has reasons: he is fighting to keep a post that is his chance to restore his name for his sons' sake.
        - |
          Correct. Nora judges by motive; the law (and, it will turn out, Helmer) judges by the act. That clash of moralities is the play's deep conflict, not only the blackmail.
        - |
          The signature is forged; the date proves it. The question is whether her motive excuses it.
        - |
          Helmer knows nothing until the letter in Act III.
      answer: 1
      explanation: |
        3.F: look beyond the plot conflict (Krogstad against Nora) to the conflict of values it stages.

    - slug: u09-w31-q14
      type: multiple_choice
      topic_code: "1.C"
      source: "general knowledge"
      points: 1
      prompt: |
        Which contrast between Nora and Mrs. Linden in Act I is most important to the play?
      options:
        - "Mrs. Linden is wealthy and Nora is poor."
        - "Mrs. Linden has worked, suffered and lived independently; Nora appears sheltered and childlike, though her secret shows she too has worked and taken risks."
        - "Mrs. Linden is married and Nora is a widow."
        - "Mrs. Linden is cheerful and Nora is gloomy."
      option_explanations:
        - |
          The reverse: Mrs. Linden is widowed and penniless, Nora comfortable.
        - |
          Correct. Mrs. Linden's hard independence makes her a foil who first highlights Nora's seeming frivolity and then draws out her secret competence. By Act III she also models a marriage based on honesty.
        - |
          Mrs. Linden is the widow; Nora is married to Helmer.
        - |
          Nora is lively in Act I; Mrs. Linden is careworn.
      answer: 1
      explanation: |
        Spiral review (1.C, contrasting characters). A foil's job is to reveal; Mrs. Linden reveals Nora twice.

    - slug: u09-w31-q15
      type: multiple_choice
      topic_code: "5.C"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      prompt: |
        Act II opens with "the Christmas-tree, stripped, and with the candles burnt out." The stage image functions chiefly as
      options:
        - "a realistic detail showing that the servants are lazy"
        - "a symbol of the festive home of Act I now stripped of its illusions, mirroring Nora's state after Krogstad's threat"
        - "a sign that Christmas has been cancelled"
        - "a symbol of Helmer's success at the bank"
      option_explanations:
        - |
          It is realistic (the day after Christmas Eve), but Ibsen chose to open the act on it, which makes it more than housekeeping.
        - |
          Correct. In Act I Nora decorated the tree for a happy family Christmas. Now it is bare and burnt out, as her sense of safety is: the set tells us what has changed before anyone speaks.
        - |
          It is Christmas Day; the tree has served its purpose, which is the point of the image.
        - |
          Nothing ties the tree to the bank; the image reflects the home and Nora.
      answer: 1
      explanation: |
        Spiral review (5.C, symbol, weeks 19, 24 and 26). In drama, stage directions can carry symbols.

    - slug: u09-w31-q16
      type: multiple_choice
      topic_code: "3.D"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 1
      prompt: |
        Helmer calls Nora his "lark," his "squirrel," his "little featherbrain" and his "little spendthrift." The contrast between these names and what the audience learns about Nora in Act I functions chiefly to
      options:
        - "show that Helmer understands his wife perfectly"
        - "create dramatic irony: the 'featherbrain' has secretly borrowed money, worked at night and saved his life"
        - "prove that Nora is in fact careless with money"
        - "suggest that Nora dislikes animals"
      option_explanations:
        - |
          The names show how little he knows; the audience knows more by the end of the act.
        - |
          Correct. Each pet name is contradicted by the secret: careful saving, copying work "far into the night," a loan she has repaid in instalments. The gap between his view and her reality is the play's engine.
        - |
          She spent "the simplest and cheapest things" on herself to pay the debt; the "spendthrift" is a careful manager.
        - |
          The names are Helmer's metaphors for her; Nora's feelings about animals do not enter into it.
      answer: 1
      explanation: |
        Spiral review (3.D, the function of contrasts, weeks 5, 17 and 25).

