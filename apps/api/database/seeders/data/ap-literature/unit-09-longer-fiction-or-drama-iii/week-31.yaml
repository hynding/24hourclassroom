    - slug: u09-w31-q21
      type: short_answer
      topic_code: "7.B"
      source: "general knowledge"
      points: 2
      prompt: |
        Write a defensible thesis (one or two sentences) about how Ibsen reveals Nora's complexity in Acts I-II.
      answer: |
        Ibsen lets Nora play the "lark" Helmer wants while her own words to Mrs. Linden, Krogstad and Anna reveal a woman who has borrowed, worked and calculated in secret, so the audience sees a competent adult hidden inside a role she has half-chosen and half been given.
      explanation: |
        Spiral review (7.B, thesis, weeks 7, 16). 1 point: a defensible claim about Nora's complexity (not "Nora is complex"). 1 point: a line of reasoning (the role against the hidden self; her speech to different listeners; her choices).

    - slug: u09-w31-q22
      type: long_answer
      topic_code: "1.E"
      source: "Henrik Ibsen, A Doll's House (1879), trans. William Archer (1889)"
      points: 6
      stimulus: *w31a
      prompt: |
        Carefully read the passage above from Act I of Henrik Ibsen's *A Doll's House* (1879, translated by William Archer), in which Nora tells her friend Mrs. Linden about the secret she has kept from her husband. In a well-written essay, analyze how Ibsen uses literary elements and techniques to convey the complexity of Nora's attitude toward her marriage.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Through Nora's exclamations, her self-interruptions and the stage directions that frame them, Ibsen shows a woman who praises her "beautiful, happy home" while describing, almost without meaning to, a marriage that rests on Torvald's vanity and her own performance.
        Line of reasoning: (1) her exclamations of protection ("Good heavens!", "how painful and humiliating ... with his manly self-respect") show insight into Torvald's pride; (2) "It would utterly upset the relation between us" admits the home depends on an imbalance; (3) "when I'm—not so pretty" and "dancing about, and dressing up and acting" reveal she knows she is valued as an entertainer, and "something in reserve" shows calculation; (4) the stage directions "[Thoughtfully, half-smiling]" and "[Breaking off] Nonsense! nonsense!" stage her retreat from the thought, and "Am I fit for nothing now?" shows pride seeking recognition. Strong essays note the dramatic irony of a "happy" home she has secured by a secret.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis about Nora's complex attitude (pride and protectiveness with half-conscious doubt), not "Nora loves her husband" or a summary.
        Row B Evidence and Commentary (0-4): 1 = summary of the secret with little reference to the passage. 2 = some relevant quotations with general commentary ("this shows she is worried"). 3 = specific evidence from several parts of the passage, including at least one stage direction or syntactic feature (dashes, breaking off), with commentary explaining how each conveys the attitude. 4 = consistent, well-chosen evidence and commentary that explains how dialogue, stage directions and dramatic irony together build a divided attitude across the passage.
        Row C Sophistication (0-1): 1 point for complexity, such as reading "something in reserve" as power within dependence, or explaining how the passage foreshadows Act III without reading the ending back into Nora's conscious mind.
