week: 12
unit: 4
title: Perspective and Power in "The Yellow Wall-Paper"
topics: ["4.C", "1.D"]
texts:
- author: Charlotte Perkins Gilman
  title: The Yellow Wall-Paper
  year: 1892
  url: https://www.gutenberg.org/ebooks/1952
guide: guides/week-12.md
guide_description: |
  How a first-person narrator's diction and syntax reveal a perspective she cannot fully see herself (4.C), and how
  small details expose the power and tenderness tangled in her marriage to John (1.D). The rest cure, the secret
  journal, the room and its paper, worked close readings, a model Q2 paragraph on narration, and the misreadings to avoid.
flashcards_description: |
  30 cards on the narrator's voice, John and the household, the room and the pattern, the story's stages and the
  vocabulary for writing about perspective and relationships.
flashcards:
- front: '"The Yellow Wall-Paper" → publication facts'
  back: |
    Charlotte Perkins Gilman (then Stetson); first published in the New England Magazine, January 1892, as "The Yellow Wall-Paper"; reprinted as a small book in 1899. Told in a series of secret journal entries over about three months.
  topic_code: "4.C"
- front: Gilman's narrator → what we know and do not know
  back: |
    An unnamed young wife and new mother, a writer by habit, diagnosed with "temporary nervous depression." She writes in secret. Her name is never given, unless "Jane," in the last scene, is her own.
  topic_code: "4.C"
- front: The rest cure → what it prescribed
  back: |
    Associated with the neurologist S. Weir Mitchell, whom John threatens to send her to "in the fall": isolation, bed rest, heavy feeding and a ban on intellectual work. Gilman underwent a version of it in 1887 and said the story was written to warn against it.
  topic_code: "1.D"
- front: '"this is dead paper and a great relief to my mind" → what it shows'
  back: |
    The journal is the one place she can say what she cannot say aloud ("I would not say it to a living soul"). The parenthesis itself enacts the secrecy: her criticism of John is literally bracketed.
  topic_code: "4.C"
- front: '"John laughs at me, of course, but one expects that in marriage."'
  back: |
    An early example of her habit of stating a grievance and then excusing it. The casual "of course" normalizes his contempt; the reader hears what she does not quite say.
  topic_code: "1.D"
- front: '"You see, he does not believe I am sick!" → why it matters'
  back: |
    The central conflict in one line: her suffering is real to her and invisible to the authority who controls her care. Physician and husband are the same man, so medical and marital power are fused.
  topic_code: "1.D"
- front: '"Personally, I disagree with their ideas." → syntax and perspective'
  back: |
    Short, flat declarative sentences, each its own paragraph, followed by "But what is one to do?" Her disagreement is real but has no outlet; the syntax isolates it the way she is isolated.
  topic_code: "4.C"
- front: John's pet names for his wife
  back: |
    "blessed little goose," "little girl," "darling," "Bless her little heart!" Each makes her small and childlike. Affection and condescension arrive in the same words.
  topic_code: "1.D"
- front: '"He is very careful and loving, and hardly lets me stir without special direction."'
  back: |
    Praise and complaint in one sentence: "loving" and "hardly lets me stir" sit side by side. Typical of how the narrator's diction reveals a control she describes as care.
  topic_code: "1.D"
- front: The nursery at the top of the house → its details
  back: |
    Barred windows, "rings and things in the walls," a bed nailed to the floor, a gate at the head of the stairs, torn paper. She reads it as a nursery and gymnasium; the reader may read it as a place built to confine.
  topic_code: "2.C"
- front: Why the narrator wanted a room downstairs
  back: |
    One "that opened on the piazza and had roses all over the window." John refuses. The contrast between the open, flowered room she wanted and the barred room she gets measures how little her wishes count.
  topic_code: "2.C"
- front: The wallpaper's front pattern → how she describes it
  back: |
    "sprawling flamboyant," "lame, uncertain curves" that "commit suicide," a fungus, "a broken neck" with "two bulbous eyes." Her descriptions grow more violent and bodily as the story goes on.
  topic_code: "4.C"
- front: The sub-pattern → what she comes to see
  back: |
    At first "a strange, provoking, formless sort of figure"; later "a woman stooping down and creeping about behind that pattern"; finally many women, shaking the front pattern like bars.
  topic_code: "4.C"
- front: '"it becomes bars!" → the meaning of the image'
  back: |
    By moonlight the front pattern looks like bars and the woman behind it a prisoner. The image connects the paper to the barred windows and to the narrator's own confinement.
  topic_code: "5.B"
- front: Jennie → who she is and how the narrator sees her
  back: |
    John's sister and the housekeeper, "a perfect, and enthusiastic housekeeper" who "hopes for no better profession." The narrator hides her writing from Jennie and comes to suspect her of studying the paper too.
  topic_code: "1.D"
- front: Gilman's narrator and her baby
  back: |
    Mary cares for the baby; the narrator says "I cannot be with him, it makes me so nervous." Her later relief that the baby does not have to sleep in "this nursery with the horrid wallpaper" is one of the few times she protects someone else.
  topic_code: "1.D"
- front: '"Better in body perhaps"—what happens'
  back: |
    She begins to say that she may be better in body but not in mind; John sits up "with such a stern, reproachful look" that she cannot finish. The dash marks the sentence he cuts off without a word.
  topic_code: "1.D"
- front: '"Can you not trust me as a physician when I tell you so?"'
  back: |
    John's answer to her attempt to describe her mind. He appeals to professional authority, calls her worry "a false and foolish fancy," and ends the conversation. Her response: "So of course I said no more."
  topic_code: "1.D"
- front: Gilman's narrator as an unreliable narrator
  back: |
    She is sincere but her perceptions become distorted: the paper smells yellow, women creep in the garden, she sees others as "queer." The reader trusts her account of how she is treated while distrusting her account of the wallpaper.
  topic_code: "4.C"
- front: The story's shift in the narrator's syntax
  back: |
    Early entries: careful explanation, qualified complaints. Middle: short one-line paragraphs, exclamations, suspicion. End: present tense, gleeful commands, and a voice that speaks of "I" and the woman in the paper as one.
  topic_code: "4.C"
- front: '"I always lock the door when I creep by daylight."'
  back: |
    The narrator has begun to do what the woman in the paper does. The sentence is calm, almost practical, which makes the change in her more disturbing.
  topic_code: "4.C"
- front: The yellow smell
  back: |
    The narrator says the odour "creeps all over the house" and that the only thing it is like is "the color of the paper." Mixing the senses shows the paper taking over her whole perception of the house.
  topic_code: "4.C"
- front: The smooch on the wall
  back: |
    A long, even mark running round the room low down, "as if it had been rubbed over and over." At the end her shoulder "just fits" in it as she creeps: she has become the explanation for the mark.
  topic_code: "2.C"
- front: '"I''ve got out at last," said I, "in spite of you and Jane!"'
  back: |
    The climax. "Jane" may be the narrator's own name, now spoken of as someone else, or a slip for Jennie. Either way the speaker has identified with the woman from the paper.
  topic_code: "1.D"
- front: John faints → the final reversal
  back: |
    "Now why should that man have fainted?" The physician who controlled every hour lies on the floor, and she must "creep over him every time." Their positions of power are inverted, at the cost of her sanity.
  topic_code: "1.D"
- front: Complex relationship (1.D) → what "complex" means in a Q2 prompt
  back: |
    Not simply good or bad. John is loving and controlling; the narrator is grateful and resentful, obedient and secretly defiant. A thesis that names only one side misses the complexity the prompt asks for.
  topic_code: "1.D"
- front: Perspective (4.C) → the evidence you cite
  back: |
    Diction (word choices such as "of course," "little," "queer"), syntax (sentence length, parentheses, dashes, exclamations), and details the narrator selects or repeats. Each reveals how she sees, including what she does not notice.
  topic_code: "4.C"
- front: Dramatic irony in Gilman's journal
  back: |
    The reader understands more than the narrator: that the "rings and things" may be restraints, that John's care is control, that her "improvement" is a deepening obsession. The gap between her account and our understanding drives the story.
  topic_code: "4.C"
- front: '"I don''t want to leave now until I have found it out."'
  back: |
    Midway through, she no longer wants to leave the room she begged to escape. Her relationship to the setting has reversed, the way Brown's does in the village (week 11).
  topic_code: "2.C"
- front: Gilman's story and the question of a woman's work
  back: |
    The narrator believes "congenial work, with excitement and change, would do me good"; she is forbidden to write. The story ties her collapse to the denial of meaningful work as much as to illness.
  topic_code: "1.D"
quiz:
  description: |
    24 questions · about 45 minutes, plus 40 minutes for the essay · a passage set on the night conversation between
    the narrator and John (perspective, the marriage), questions across the story, and about a third review (setting
    from week 11, point of view, contrast, character, thesis and commentary). Multiple choice, select-all, true/false
    and fill-in-the-blank items are graded at once; the two short answers and the Q2 prose-fiction essay are graded by
    your teacher against the scoring guide.
  questions:
  - slug: u04-w12-q01
    type: multiple_choice
    topic_code: "1.D"
    source: Charlotte Perkins Gilman, "The Yellow Wall-Paper" (1892)
    points: 1
    stimulus: |
      *The following passage is from Charlotte Perkins Gilman's "The Yellow Wall-Paper" (1892). The narrator, kept to a rest cure in a rented country house by her physician husband, John, has woken him at night to say that she is not getting better and wishes he would take her away.*

      "Why darling!" said he, "our lease will be up in three weeks, and I can't see how to leave before.

      [...]

      "I don't weigh a bit more," said I, "nor as much; and my appetite may be better in the evening, when you are here, but it is worse in the morning when you are away."

      "Bless her little heart!" said he with a big hug; "she shall be as sick as she pleases! But now let's improve the shining hours by going to sleep, and talk about it in the morning!"

      "And you won't go away?" I asked gloomily.

      [...]

      "Better in body perhaps"—I began, and stopped short, for he sat up straight and looked at me with such a stern, reproachful look that I could not say another word.

      "My darling," said he, "I beg of you, for my sake and for our child's sake, as well as for your own, that you will never for one instant let that idea enter your mind! There is nothing so dangerous, so fascinating, to a temperament like yours. It is a false and foolish fancy. Can you not trust me as a physician when I tell you so?"

      So of course I said no more on that score, and we went to sleep before long. He thought I was asleep first, but I wasn't,—I lay there for hours trying to decide whether that front pattern and the back pattern really did move together or separately.
    prompt: |
      John's response, "Bless her little heart! ... she shall be as sick as she pleases!" primarily reveals that he
    options:
    - treats his wife's complaint with an affectionate condescension that dismisses it
    - is speaking to someone else in the room about his wife
    - is angry that his wife has woken him in the night
    - has decided to take his wife's illness more seriously
    option_explanations:
    - |
      Correct. The hug and the pet phrase are warm, but the shift to the third person ("her," "she") talks about his wife as if she were a child in the room, and "as sick as she pleases" implies her illness is a matter of whim. Fondness and dismissal arrive together.
    - |
      No one else is present; the third person is a way of speaking to her as one speaks about a child, which is the condescension the line reveals.
    - |
      The tone is jovial ("with a big hug"), not angry. His sternness comes later, when she suggests her mind is not better.
    - |
      He proposes to "talk about it in the morning" and go to sleep. Nothing changes in his treatment of her.
    answer: 0
