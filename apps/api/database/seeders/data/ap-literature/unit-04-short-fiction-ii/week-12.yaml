      *The following passage is from Charlotte Perkins Gilman's "The Yellow Wall-Paper" (1892). The narrator, kept to a rest cure in a rented country house by her physician husband, John, has woken him at night to say that she is not getting better and wishes he would take her away.*

      "Why darling!" said he, "our lease will be up in three weeks, and I can't see how to leave before.

      [...]

      "I don't weigh a bit more," said I, "nor as much; and my appetite may be better in the evening, when you are here, but it is worse in the morning when you are away."

      "Bless her little heart!" said he with a big hug; "she shall be as sick as she pleases! But now let's improve the shining hours by going to sleep, and talk about it in the morning!"

      "And you won't go away?" I asked gloomily.

      [...]

      "Better in body perhaps"—I began, and stopped short, for he sat up straight and looked at me with such a stern, reproachful look that I could not say another word.

      "My darling," said he, "I beg of you, for my sake and for our child's sake, as well as for your own, that you will never for one instant let that idea enter your mind! There is nothing so dangerous, so fascinating, to a temperament like yours. It is a false and foolish fancy. Can you not trust me as a physician when I tell you so?"

      So of course I said no more on that score, and we went to sleep before long. He thought I was asleep first, but I wasn't,—I lay there for hours trying to decide whether that front pattern and the back pattern really did move together or separately.
    prompt: |
      Q2 practice (prose fiction analysis, about 40 minutes). Carefully read the passage above from Charlotte Perkins Gilman's "The Yellow Wall-Paper" (1892). In this passage, the narrator tries to tell her husband, a physician, that she is not recovering. Read the passage carefully. Then, in a well-written essay, analyze how Gilman uses literary elements and techniques to portray the complex relationship between the narrator and her husband.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Strong thesis: Through dialogue that wraps every refusal in an endearment and a narration that records her own silences as "of course," Gilman portrays a marriage in which genuine affection is the very instrument of control, so that the narrator's only remaining freedom is the private, and increasingly dangerous, attention she turns on the wallpaper.

      Line of reasoning: (1) John's language: "darling," "dear," "Bless her little heart!", the shift into the third person and "as sick as she pleases" make her a child and her illness a whim; "I am a doctor, dear, and I know" fuses husband and physician. (2) The narrator's counter-evidence: the balanced "better in the evening, when you are here, but ... worse in the morning when you are away" shows she sees what he cannot; "Better in body perhaps"— is cut off by "a stern, reproachful look," a dash that records power exercised without a word. (3) The closing appeal: "for my sake and for our child's sake" turns love and family into reasons she may not think a thought; "a false and foolish fancy" names her perception irrational. (4) The narrator's response: "So of course I said no more"; she feigns sleep ("but I wasn't") and spends hours on the pattern, so suppression produces concealment and fixation rather than rest.

      Sophistication: recognizes that John is not a simple villain (his love is real, his authority socially endorsed), or that the scene's irony depends on the reader seeing more than the narrator states, or connects the "front pattern and the back pattern" to the couple's surface agreement and hidden conflict.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible claim about the relationship that recognizes some complexity (e.g., love and control, compliance and secret resistance). "John controls his wife" alone is defensible but thin; it can earn the point, though the essay will struggle to reach 4 in Row B without complexity.

      Row B Evidence and Commentary (0-4): 1 = summary of the conversation with little explanation. 2 = some relevant quotations (pet names, "I am a doctor," the broken "perhaps") with commentary that restates rather than explains. 3 = specific evidence from both John's speech and the narrator's narration, with commentary explaining how diction, syntax (the dash, the third-person shift) or dialogue builds the relationship; line of reasoning mostly sustained. 4 = consistent commentary that explains how each technique contributes to the complex relationship and how the parts build toward the thesis, including the passage's final turn to the wallpaper.

      Row C Sophistication (0-1): 1 point for sustained complexity, for example treating John's tenderness as sincere and still controlling, explaining how first-person narration creates dramatic irony, or connecting the double pattern to the double life of the marriage, developed rather than mentioned.
