      Correct. Love and family duty are the grounds on which he forbids her a thought. Control of her mind is asked as a loving favour.
    - |
      Correct. Physical warmth accompanies a sentence that makes her illness sound like a child's whim.
    answer: [0, 2, 3]
    explanation: |
      The relationship is complex because control rarely appears without affection. Each correct detail pairs an endearment or embrace with a limit on what she may do or think.
