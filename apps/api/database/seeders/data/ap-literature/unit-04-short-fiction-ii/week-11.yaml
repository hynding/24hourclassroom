    answer: |
      By opposing the lit doorway where Faith watches in her pink ribbons to a forest path that narrows and closes behind him, Hawthorne shows Brown as a man who knows his errand is wrong yet persuades himself he can step out of goodness for one night and return unchanged, a confidence the enclosing, crowded darkness already calls into doubt.
