    prompt: |
      Explain the function of the story's circular structure of setting (Salem village at sunset, the forest at night, Salem village the next morning). In two or three sentences, explain what the return to the same street and meeting-house corner allows Hawthorne to show.
    answer: |
      Returning Brown to the same street, the same meeting-house corner and the same wife in pink ribbons holds the setting constant so that the only thing that has changed is Brown. The minister, deacon and Goody Cloyse go about their ordinary piety, and his recoil shows that the forest has altered his way of seeing rather than the village itself, which is why the narrator can leave the reality of the meeting undecided.
    explanation: |
      1 point for identifying that the setting is repeated or unchanged. 1 point for explaining that the repetition isolates the change in Brown (his perception, trust or faith). 1 point for connecting this to a larger meaning: the ambiguity of the meeting, the self-made nature of his suspicion, or the idea that knowledge of sin changes the knower. Answers that only summarize the return earn at most 1.
