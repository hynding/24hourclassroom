    source: Nathaniel Hawthorne, "Young Goodman Brown" (1835)
    points: 6
    stimulus: |
      *The following passage is from Nathaniel Hawthorne's "Young Goodman Brown" (1835). Goodman Brown has just said goodbye to his wife, Faith, at the door of their house in Salem village at sunset.*

      So they parted; and the young man pursued his way until, being about to turn the corner by the meeting-house, he looked back and saw the head of Faith still peeping after him with a melancholy air, in spite of her pink ribbons.

      "Poor little Faith!" thought he, for his heart smote him. "What a wretch am I to leave her on such an errand! [...] Well, she's a blessed angel on earth; and after this one night I'll cling to her skirts and follow her to heaven."

      With this excellent resolve for the future, Goodman Brown felt himself justified in making more haste on his present evil purpose. He had taken a dreary road, darkened by all the gloomiest trees of the forest, which barely stood aside to let the narrow path creep through, and closed immediately behind. It was all as lonely as could be; and there is this peculiarity in such a solitude, that the traveller knows not who may be concealed by the innumerable trunks and the thick boughs overhead; so that with lonely footsteps he may yet be passing through an unseen multitude.

      "There may be a devilish Indian behind every tree," said Goodman Brown to himself; and he glanced fearfully behind him as he added, "What if the devil himself should be at my very elbow!"
    prompt: |
      Q2 practice (prose fiction analysis, about 40 minutes). Carefully read the passage above from Nathaniel Hawthorne's "Young Goodman Brown" (1835). In this passage, a young husband leaves his wife and the village for an errand in the forest. Read the passage carefully. Then, in a well-written essay, analyze how Hawthorne uses literary elements and techniques to portray the complex relationship between Goodman Brown and the setting he enters.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Strong thesis: Hawthorne sets the doorway of home and meeting-house against a forest that narrows, closes and conceals, so that Brown's step from one to the other becomes a moral act he pretends is temporary; the setting registers the guilt he tries to talk himself out of.

      Line of reasoning: (1) The village frame: the meeting-house corner and Faith "peeping after him" in her pink ribbons, with "a melancholy air," make home a place of watching love and faint warning. (2) Brown's self-justification: "wretch," then the plan to "cling to her skirts and follow her to heaven"; the narrator's ironic "excellent resolve" that licenses "more haste on his present evil purpose." (3) The forest's character: "dreary," "gloomiest," a path that trees "barely stood aside" for and "closed immediately behind," an image of a choice that shuts off retreat. (4) The forest's hidden population: "an unseen multitude," the imagined Indian and devil, and Brown's fearful backward glance; the place mirrors the anxiety of a man who knows he is doing wrong, and it anticipates the companion who appears at his elbow.

      Sophistication: notes that the setting works allegorically (Faith left behind at the threshold) while staying psychologically realistic, or that the narrator's general reflection on solitude ("there is this peculiarity...") widens Brown's walk into a claim about every person's hidden company.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis about Brown's relationship to the setting that goes beyond restating the prompt (e.g., "Hawthorne uses setting to show Brown's journey" earns 0; a claim about what the forest reveals or tests in Brown earns 1).

      Row B Evidence and Commentary (0-4): 1 = mostly summary of the departure with little or no explanation. 2 = some specific details (the ribbons, the closing trees, "unseen multitude") with commentary that is general or repeats the claim. 3 = specific, well-chosen evidence with commentary that explains how at least two details build the relationship (e.g., the closing path as irreversibility, the narrator's irony about the "excellent resolve") in a mostly consistent line of reasoning. 4 = all of 3, plus commentary that consistently explains how the techniques (contrast of threshold and forest, diction of gloom and enclosure, irony, foreshadowing) create the relationship and connects each body paragraph to the thesis.

      Row C Sophistication (0-1): 1 point for a complex understanding, for example tracing the tension between Brown's confidence and the setting's warnings, explaining how the passage is both allegory and psychological portrait, or situating the passage in the story's larger village-forest-village structure, sustained across the essay rather than in a single sentence.
