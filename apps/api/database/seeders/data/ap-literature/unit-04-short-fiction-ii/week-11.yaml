    type: multiple_choice
    topic_code: "2.C"
    source: Nathaniel Hawthorne, "Young Goodman Brown" (1835)
    points: 1
    stimulus: |
      *The following passage is from Nathaniel Hawthorne's "Young Goodman Brown" (1835). Goodman Brown has just said goodbye to his wife, Faith, at the door of their house in Salem village at sunset.*

      So they parted; and the young man pursued his way until, being about to turn the corner by the meeting-house, he looked back and saw the head of Faith still peeping after him with a melancholy air, in spite of her pink ribbons.

      "Poor little Faith!" thought he, for his heart smote him. "What a wretch am I to leave her on such an errand! [...] Well, she's a blessed angel on earth; and after this one night I'll cling to her skirts and follow her to heaven."

      With this excellent resolve for the future, Goodman Brown felt himself justified in making more haste on his present evil purpose. He had taken a dreary road, darkened by all the gloomiest trees of the forest, which barely stood aside to let the narrow path creep through, and closed immediately behind. It was all as lonely as could be; and there is this peculiarity in such a solitude, that the traveller knows not who may be concealed by the innumerable trunks and the thick boughs overhead; so that with lonely footsteps he may yet be passing through an unseen multitude.

      "There may be a devilish Indian behind every tree," said Goodman Brown to himself; and he glanced fearfully behind him as he added, "What if the devil himself should be at my very elbow!"
    prompt: |
      Brown's relationship to the forest in this passage is best described as
    options:
    - 'comfortable and familiar: he treats the forest as an extension of the village'
    - 'openly defiant: he challenges the forest to frighten him'
    - 'fearful yet willing: he dreads what the place may hide but keeps walking into it'
    - 'indifferent: he is so absorbed in thoughts of Faith that he barely notices his surroundings'
    option_explanations:
    - |
      The forest is described as dreary, gloomy and lonely, and Brown is afraid in it. Nothing suggests he is at home there; the story keeps village and forest opposed.
    - |
      Defiance comes later, after "My Faith is gone!", when Brown shouts at the howling woods. In this passage he is nervous and secretive, not challenging.
    - |
      Correct. He glances "fearfully behind him" and imagines "a devilish Indian behind every tree" and the devil "at my very elbow," yet he has already chosen the road and makes "more haste." The tension between dread and purpose defines his relationship to the place.
    - |
      He notices his surroundings intensely: the gloom, the trunks and boughs, the possibility of hidden figures. His thoughts of Faith come before he enters the road, and they do not make him oblivious.
    answer: 2
