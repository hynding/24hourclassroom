week: 11
unit: 4
title: Setting as Moral Landscape in "Young Goodman Brown"
topics: ["2.B", "2.C"]
texts:
- author: Nathaniel Hawthorne
  title: Young Goodman Brown
  year: 1835
  url: https://www.gutenberg.org/ebooks/512
guide: guides/week-11.md
guide_description: |
  How Hawthorne turns a village, a forest path and a firelit clearing into an argument about faith and suspicion:
  the function of setting (2.B), the way Brown's relationship to each place changes him (2.C), allegorical names,
  the narrator's hedging, and the ambiguous ending. Worked close readings, a model Q2 paragraph on setting, and the
  misreadings that cost points.
flashcards_description: |
  30 cards on the story's places, people, objects and narrative moves, and on writing about setting in a
  prose-fiction analysis essay.
flashcards:
- front: '"Young Goodman Brown" → publication facts'
  back: |
    Nathaniel Hawthorne; first published in the New-England Magazine in 1835, collected in Mosses from an Old Manse (1846). Set in Salem village in the late seventeenth century, around the time of the 1692 witch trials.
  topic_code: "2.B"
- front: '"Goodman" in Hawthorne''s title → what the word means'
  back: |
    A Puritan form of address for an ordinary married man below the rank of gentleman, as "Goody" (Goodwife) was for a woman. The title already hints at the question the story asks: is this man good?
  topic_code: "2.C"
- front: Faith (Brown's wife) → why her name matters
  back: |
    The narrator says she was "aptly named." She is a real young wife and also the virtue Brown leaves behind when he enters the forest, so "My Faith is gone!" works on both levels at once.
  hint: Read every line about her twice.
  topic_code: "2.C"
- front: Faith's pink ribbons → what they do in the story
  back: |
    A small, bright, domestic detail that appears at the departure, falls from the cloud in the forest, and returns on Faith's cap the next morning. Their reappearance is what makes the ending ambiguous: did she go to the meeting or not?
  topic_code: "2.B"
- front: Salem village vs. the forest in Hawthorne's story
  back: |
    The village is the daylight world of meeting-house, minister and catechism; the forest is the night world where those same people appear at a witch-meeting. The story moves Brown from one to the other and back, and the second visit to the village is changed by the first.
  topic_code: "2.B"
- front: Brown's forest road → how it is described
  back: |
    "a dreary road, darkened by all the gloomiest trees of the forest, which barely stood aside to let the narrow path creep through, and closed immediately behind." The path narrows and shuts behind him: a journey that cannot easily be reversed.
  topic_code: "2.B"
- front: '"an unseen multitude" → the function of the phrase'
  back: |
    The narrator notes that a lonely traveller in a forest may be "passing through an unseen multitude." It turns solitude into hidden company, foreshadowing the crowd of townspeople Brown will find gathered in the woods.
  topic_code: "2.B"
- front: The fellow-traveller → who he is and how we know
  back: |
    The devil, never named as such by the narrator. Clues: he was in Boston fifteen minutes ago, carries a staff like "a great black snake," knows Brown's family history, and resembles Brown "more in expression than features," as if he were his father, or himself.
  topic_code: "2.C"
- front: The serpent staff → what it suggests
  back: |
    A walking stick that seems to "twist and wriggle itself like a living serpent." It recalls the serpent in Eden and the rods turned to snakes before Pharaoh. The narrator explains it away as "an ocular deception," a typical Hawthorne hedge.
  topic_code: "2.B"
- front: Goody Cloyse → her role in the forest
  back: |
    The pious woman who taught Brown his catechism. In the forest she greets the traveller as an old friend and complains that her broomstick was stolen. Brown's reply is "That old woman taught me my catechism," a first crack in his trust.
  topic_code: "2.C"
- front: Minister and Deacon Gookin in the forest → what Brown hears, not sees
  back: |
    He hears their voices riding past to "to-night's meeting" but cannot see horses or riders, even against the sky. The setting withholds proof: Brown's evidence is always partial, sound without sight.
  topic_code: "2.B"
- front: '"My Faith is gone!" → the turning point'
  back: |
    After a pink ribbon flutters down from the cloud of voices, Brown cries "My Faith is gone! There is no good on earth; and sin is but a name." He rushes deeper into the forest, now its "chief horror." The line names both wife and belief.
  topic_code: "2.C"
- front: The clearing at midnight → what it looks like
  back: |
    A rock like "an altar or a pulpit," four blazing pines "like candles at an evening meeting," a congregation, a hymn. The witch-meeting is a parody of a church service: the setting turns Puritan worship inside out.
  topic_code: "2.B"
- front: The dark figure's sermon → its claim
  back: |
    "Evil is the nature of mankind. Evil must be your only happiness." He welcomes the converts "to the communion of your race." It is the creed Brown will live by afterwards, though he resists baptism in the moment.
  topic_code: "2.C"
- front: '"look up to heaven, and resist the wicked one" → what happens next'
  back: |
    Brown's last cry to Faith at the altar. At once he finds himself alone in "calm night and solitude"; a twig that had been on fire wets his cheek with "the coldest dew." The narrator never says whether Faith obeyed.
  topic_code: "2.B"
- front: '"Had Goodman Brown fallen asleep in the forest and only dreamed?" → the narrator''s answer'
  back: |
    "Be it so if you will." The narrator refuses to settle whether the night was real or a dream, and shifts the question: whatever happened, it was "a dream of evil omen" because of what it did to Brown.
  topic_code: "2.B"
- front: Brown back in Salem village the next morning
  back: |
    He shrinks from the minister's blessing, calls Deacon Gookin a "wizard," snatches a child from Goody Cloyse and passes Faith "without a greeting." The village has not changed; his relationship to it has.
  topic_code: "2.C"
- front: Brown's tombstone → the last image
  back: |
    "they carved no hopeful verse upon his tombstone, for his dying hour was gloom." A lifetime in the village is summed up by the one night in the forest.
  topic_code: "2.C"
- front: Allegory → as Hawthorne uses it in "Young Goodman Brown"
  back: |
    A narrative in which characters, places and objects also stand for ideas: Faith for faith, the forest for the unknown or the sinful heart, the path for a moral choice. Hawthorne keeps it from being simple allegory by making Faith a real wife and the evidence uncertain.
  topic_code: "2.B"
- front: Setting as a mirror of a character's inner state
  back: |
    When a place takes on the qualities of the person in it, the setting externalizes the mind. Brown's forest grows wilder as he despairs ("the road grew wilder and drearier"), until "he was himself the chief horror of the scene."
  topic_code: "2.C"
- front: Hawthorne's hedging narrator → examples
  back: |
    "Some affirm that the lady of the governor was there"; the staff's motion "must have been an ocular deception"; the figure "bore no slight similitude" to a minister; "Be it so if you will." Each hedge leaves the reader in Brown's position: suspicion without certainty.
  topic_code: "4.B"
- front: Historical names in Hawthorne's witch-meeting
  back: |
    Goody Cloyse, Goody Cory and Martha Carrier were names of people accused in the 1692 Salem trials (Carrier was hanged). Hawthorne's ancestor John Hathorne was a judge there. The setting puts Puritan respectability next to the town's own history of accusation.
  topic_code: "2.B"
- front: Sunset to sunrise → the structure of Brown's journey
  back: |
    He leaves at sunset, reaches the meeting at midnight and returns the next morning: a circular journey (village, forest, village) whose end mirrors its beginning, except that Brown is changed.
  topic_code: "3.A"
- front: Opening and closing scenes at the meeting-house corner
  back: |
    At the start Brown turns the meeting-house corner and sees Faith "peeping after him" in her ribbons; at the end he turns the same corner and sees her "gazing anxiously forth." The repeated place and pose make the change in him the only difference.
  topic_code: "3.D"
- front: Q2 essay on setting → the move that earns commentary points
  back: |
    Do not list where the story happens. Explain what a detail of place does: how it reveals or tests a character, creates a conflict, or carries an idea. Pattern: detail → what it suggests → why it matters to the passage's meaning.
  topic_code: "2.B"
- front: Character-setting relationship (2.C) → three possible kinds
  back: |
    A character can be in harmony with a place, in conflict with it, or changed by it. Brown begins at home in the village, is drawn into and then overwhelmed by the forest, and returns a stranger to the village.
  topic_code: "2.C"
- front: Brown's "excellent resolve" → why the narrator's praise is ironic
  back: |
    He promises himself that after this one night he will "cling to her skirts and follow her to heaven," and the resolve "justified" him in "making more haste on his present evil purpose." The narrator's approving words expose a bargain with sin.
  topic_code: "4.A"
- front: Brown's family history according to the traveller
  back: |
    His grandfather, a constable, "lashed the Quaker woman so smartly through the streets of Salem"; his father set fire to an Indian village in King Philip's war. The devil calls them "good friends," linking Puritan righteousness to cruelty.
  topic_code: "2.C"
- front: The "communion of your race" → what the phrase does
  back: |
    The figure uses the language of the sacrament (communion, baptism, converts) for initiation into sin. Hawthorne's setting is a black mass: holy forms, unholy content, the same faces.
  topic_code: "5.B"
- front: Hawthorne's ending → three defensible readings
  back: |
    (1) Brown dreamed it, and his suspicion is self-made. (2) It happened, and the town is corrupt. (3) Either way, the point is what the night did to him: a faith that cannot survive knowledge of sin was not faith. Strong essays choose one and acknowledge the ambiguity.
  topic_code: "2.C"
quiz:
  description: |
    24 questions · about 45 minutes, plus 40 minutes for the essay · a passage set on Brown's departure into the forest
    (setting and its function, Brown's relationship to the place), questions on the rest of the story, and about a
    third review of earlier skills (narrator, point of view, contrast, word choice, thesis and commentary). Multiple
    choice, select-all, true/false and fill-in-the-blank items are graded at once; the two short answers and the Q2
    prose-fiction essay are graded by your teacher against the scoring guide.
  questions:
  - slug: u04-w11-q01
    type: multiple_choice
    topic_code: "2.B"
    source: Nathaniel Hawthorne, "Young Goodman Brown" (1835)
    points: 1
    stimulus: |
      *The following passage is from Nathaniel Hawthorne's "Young Goodman Brown" (1835). Goodman Brown has just said goodbye to his wife, Faith, at the door of their house in Salem village at sunset.*

      So they parted; and the young man pursued his way until, being about to turn the corner by the meeting-house, he looked back and saw the head of Faith still peeping after him with a melancholy air, in spite of her pink ribbons.

      "Poor little Faith!" thought he, for his heart smote him. "What a wretch am I to leave her on such an errand! [...] Well, she's a blessed angel on earth; and after this one night I'll cling to her skirts and follow her to heaven."

      With this excellent resolve for the future, Goodman Brown felt himself justified in making more haste on his present evil purpose. He had taken a dreary road, darkened by all the gloomiest trees of the forest, which barely stood aside to let the narrow path creep through, and closed immediately behind. It was all as lonely as could be; and there is this peculiarity in such a solitude, that the traveller knows not who may be concealed by the innumerable trunks and the thick boughs overhead; so that with lonely footsteps he may yet be passing through an unseen multitude.

      "There may be a devilish Indian behind every tree," said Goodman Brown to himself; and he glanced fearfully behind him as he added, "What if the devil himself should be at my very elbow!"
    prompt: |
      In the third paragraph, the description of the road that is "darkened by all the gloomiest trees of the forest" and that the trees "closed immediately behind" primarily serves to
    options:
    - show that Brown is a skilled woodsman familiar with the paths outside the village
    - establish that Brown has lost his way and is wandering without a destination
    - contrast the safety of the forest with the dangers of Salem village
    - suggest that Brown is entering a moral territory from which return will not be simple
    option_explanations:
    - |
      Nothing suggests expertise. Brown glances "fearfully behind him" and imagines devils behind trees; the details stress his unease, not his competence.
    - |
      Brown is not lost here; he "had taken" the road deliberately and is keeping an appointment. The gloom describes the character of the place and the errand, not confusion about direction.
    - |
      The passage reverses this: the village is where Faith stands in her pink ribbons, and the forest is "dreary," "gloomiest" and full of imagined threats. Nothing here presents the forest as safe.
    - |
      Correct. A path that barely opens and then shuts behind the traveller makes the journey feel one-way. Because the errand is called an "evil purpose" in the same paragraph, the closing trees attach that irreversibility to a moral choice, not just a route.
    answer: 3
