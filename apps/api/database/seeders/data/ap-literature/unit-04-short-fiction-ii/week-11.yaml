    prompt: |
      At the witch-meeting, a rock bears "some rude, natural resemblance either to an altar or a pulpit," and four blazing pines stand "like candles at an evening meeting." These details of setting primarily serve to
    options:
    - reassure Brown that the gathering is a legitimate religious service
    - suggest that the meeting is taking place inside Salem's meeting-house
    - show that the forest has been cleared for farming
    - present the gathering as a dark parody of the Puritan worship Brown knows
    option_explanations:
    - |
      Far from reassuring him, the resemblance is what horrifies: holy forms put to unholy use, with the same faces he sees on Sabbath days.
    - |
      The meeting is "in the heart of the dark wilderness," at "an open space, hemmed in by the dark wall of the forest." The church comparison is a resemblance, not a location.
    - |
      A cleared field is used only in a comparison for the red light Brown first sees; the clearing itself is a site of ritual, not farming.
    - |
      Correct. The clearing borrows the furniture of a church (altar, pulpit, candles, hymn, congregation, converts) and fills it with fiend worshippers. Setting makes the meeting a mirror image of the village's religion.
    answer: 3
