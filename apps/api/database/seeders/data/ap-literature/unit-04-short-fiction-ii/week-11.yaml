      "There may be a devilish Indian behind every tree," said Goodman Brown to himself; and he glanced fearfully behind him as he added, "What if the devil himself should be at my very elbow!"
    prompt: |
      Review (character). Brown's thoughts in the second paragraph ("Poor little Faith! ... follow her to heaven") reveal him to be
    options:
    - aware that his errand is wrong but confident he can indulge it once and then rely on his wife's goodness
    - determined to abandon his errand and return home at once
    - suspicious that Faith herself is planning to attend the meeting
    - unaware that his errand could cause his wife any distress
    option_explanations:
    - |
      Correct. He calls himself a "wretch" for leaving her "on such an errand," so he knows it is wrong, but he plans to make up for it afterwards: "after this one night I'll cling to her skirts and follow her to heaven." He treats her goodness as something he can lean on.
    - |
      He feels guilt but keeps going; the next paragraph has him "making more haste." Turning back is what he does not do.
    - |
      At this point he thinks of her as "a blessed angel on earth" and fears the truth "would kill her." Suspicion of Faith comes only in the forest.
    - |
      He notices "trouble in her face" and fears a dream "had warned her." He is aware of her distress; he chooses to set it aside.
    answer: 0
