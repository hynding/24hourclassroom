  - slug: u04-w13-q10
    type: long_answer
    topic_code: "1.C"
    source: Katherine Mansfield, "Miss Brill" (1920)
    points: 6
    stimulus: |
      *The following passage is from Katherine Mansfield's "Miss Brill" (1920). Miss Brill, an Englishwoman who teaches English in a French resort town, is spending her Sunday afternoon, as she always does, on a bench in the public gardens listening to the band.*

      Oh, how fascinating it was! How she enjoyed it! How she loved sitting here, watching it all! It was like a play. It was exactly like a play. Who could believe the sky at the back wasn't painted? But it wasn't till a little brown dog trotted on solemn and then slowly trotted off, like a little “theatre” dog, a little dog that had been drugged, that Miss Brill discovered what it was that made it so exciting. They were all on the stage. They weren't only the audience, not only looking on; they were acting. Even she had a part and came every Sunday. No doubt somebody would have noticed if she hadn't been there; she was part of the performance after all. [...] She was on the stage. She thought of the old invalid gentleman to whom she read the newspaper four afternoons a week while he slept in the garden. She had got quite used to the frail head on the cotton pillow, the hollowed eyes, the open mouth and the high pinched nose. If he'd been dead she mightn't have noticed for weeks; she wouldn't have minded. But suddenly he knew he was having the paper read to him by an actress! “An actress!” The old head lifted; two points of light quivered in the old eyes. “An actress—are ye?” And Miss Brill smoothed the newspaper as though it were the manuscript of her part and said gently; “Yes, I have been an actress for a long time.”
    prompt: |
      Q2 practice (prose fiction analysis, about 40 minutes). Carefully read the passage above from Katherine Mansfield's "Miss Brill" (1920). In this passage, a solitary woman watching the Sunday crowd in a public garden decides that everyone there, herself included, is acting in a play. Read the passage carefully. Then, in a well-written essay, analyze how Mansfield uses literary elements and techniques to convey the complexity of Miss Brill's understanding of herself and of the people around her.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Strong thesis: Mansfield renders Miss Brill's discovery of the "play" in her own breathless idiom, but surrounds it with contrasts she cannot read (actor and audience, performer and the half-dead invalid, a drugged dog on a painted stage), so that the passage is at once a sincere moment of belonging and a portrait of a woman who has made a life out of not seeing herself.

      Line of reasoning: (1) Close third-person exclamations ("Oh, how fascinating it was!") and the slide from simile ("like a play") to conviction ("They were all on the stage") show delight hardening into belief. (2) The contrast she draws between the "audience" and those "acting" places her among the actors, yet everything in the story so far shows her as a watcher. (3) The old invalid is a foil by likeness: frail, unnoticed, a person whose death she "wouldn't have minded"; the reader sees in him what others will see in her. (4) Undercurrents in the diction ("drugged," "hollowed," "pinched," the "painted" sky) shadow her joy with artifice and decay. (5) The imagined line "I have been an actress for a long time" is unintentionally true, the climax of dramatic irony.

      Sophistication: holds sympathy and irony together (Mansfield neither mocks nor simply pities her), or connects the passage to the ending's "room like a cupboard," or explains how free indirect discourse lets the reader inhabit and judge the same perspective at once.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis about Miss Brill's understanding that addresses its complexity (e.g., belonging and isolation; insight and blindness). "Miss Brill thinks life is a play" restates the passage and earns 0.

      Row B Evidence and Commentary (0-4): 1 = summary of the passage. 2 = relevant quotations (the play, the invalid, the actress line) with commentary that is general ("this shows she is lonely"). 3 = well-chosen evidence with commentary that explains how specific techniques (close third person, exclamation, simile hardening into metaphor, foil, irony) shape the reader's understanding; mostly consistent line of reasoning. 4 = consistent, specific commentary on how the contrasts and narration work together to convey both Miss Brill's view and the reader's, with each paragraph tied to the thesis.

      Row C Sophistication (0-1): 1 point for sustained complexity, for example explaining the double effect of free indirect discourse (inside her, beyond her), treating the passage as both tender and ironic, or situating it in the story's arc toward the dark room, developed across the essay.
