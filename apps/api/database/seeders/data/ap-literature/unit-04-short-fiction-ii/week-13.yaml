week: 13
unit: 4
title: Contrasting Characters in "Miss Brill"
topics: ["1.C"]
texts:
- author: Katherine Mansfield
  title: Miss Brill
  year: 1920
  url: https://www.gutenberg.org/ebooks/1429
guide: guides/week-13.md
guide_description: |
  How Mansfield builds a portrait of loneliness out of contrasts: Miss Brill set against the couples, the old people
  on the benches, the woman in the ermine toque and the young lovers who end her afternoon (1.C). Close third-person
  narration, the fur, the band and the play, a full worked Q2 essay plan, and the unit's review of setting,
  perspective and relationships.
flashcards_description: |
  30 cards on Miss Brill and the characters around her, the story's images and turns, Mansfield's narration, and the
  Q2 moves for writing about contrasting characters.
flashcards:
- front: '"Miss Brill" → publication facts'
  back: |
    Katherine Mansfield (1888-1923), born in New Zealand; first published in The Athenaeum on 26 November 1920, collected in The Garden Party and Other Stories (1922). About 2,000 words, set on one Sunday afternoon in a French resort town.
  topic_code: "1.C"
- front: Miss Brill → who she is
  back: |
    An unmarried Englishwoman, no longer young, living alone in "the little dark room" she calls home in France. She teaches English to pupils and reads the newspaper to an old invalid gentleman four afternoons a week. Her Sunday ritual is the band in the Jardins Publiques.
  topic_code: "1.C"
- front: Miss Brill's fur → how she treats it
  back: |
    She takes it out of its box, brushes it, "rubbed the life back into the dim little eyes," calls it "Dear little thing!" and "Little rogue!" The fur is her companion, and its shabbiness is the detail others will mock.
  topic_code: "1.C"
- front: '"What has been happening to me?" said the sad little eyes.'
  back: |
    Miss Brill imagines the fur speaking. It is the first hint that the question belongs to her too: something has been happening to her, and she has not looked at it.
  topic_code: "1.C"
- front: '"something light and sad—no, not sad, exactly—something gentle"'
  back: |
    A self-correction in the opening paragraph. She feels sadness and edits it out. The same move ("not sadness—no, not sadness") returns when the band plays; the reader learns to notice what she refuses to name.
  topic_code: "4.C"
- front: '"sitting in other people''s lives just for a minute"'
  back: |
    Miss Brill's description of her Sunday skill: "listening as though she didn't listen." She lives by observing others; the story's twist is that she is observed in turn.
  topic_code: "1.C"
- front: The silent old couple on Miss Brill's bench
  back: |
    "a fine old man in a velvet coat" and "a big old woman ... with a roll of knitting." They do not speak, to her disappointment, and sit "still as statues." They are a mirror she does not recognize: old, silent watchers.
  topic_code: "1.C"
- front: The Englishman and his wife (last Sunday)
  back: |
    The wife complained she needed spectacles but would not get any; the husband patiently suggested every kind. "Miss Brill had wanted to shake her." A contrast between a couple's tedious companionship and Miss Brill's solitude, and a sign of her judging eye.
  topic_code: "1.C"
- front: The odd people on the benches → Miss Brill's view of them
  back: |
    "odd, silent, nearly all old," looking as though they'd "just come from dark little rooms or even—even cupboards!" She describes exactly her own life and does not see it. The central irony of the story.
  hint: Compare "her room like a cupboard" at the end.
  topic_code: "1.C"
- front: The ermine toque → what happens to her
  back: |
    A woman in a shabby ermine hat greets a gentleman in grey, who puffs smoke in her face and walks away. She smiles "more brightly than ever," then pretends to see someone nicer and pats away. A rehearsal of Miss Brill's own humiliation.
  topic_code: "1.C"
- front: The ermine toque and Miss Brill → the parallel
  back: |
    Both are aging women in worn fur; both smile through rejection. Miss Brill watches the scene as theatre ("The Brute! The Brute!") without seeing that it is her own story played in advance.
  topic_code: "1.C"
- front: The gentleman in grey
  back: |
    "tall, stiff, dignified." He lights a cigarette, "breathed a great deep puff into her face," and walks on while she is still talking. A contrast to the patient Englishman: indifference rather than tedium.
  topic_code: "1.C"
- front: The band in "Miss Brill" → its function
  back: |
    The band seems to respond to what happens: louder for the Season, soft and tender for the toque, quick and gay afterward, then a tune with "just a faint chill" that makes her want to sing. Miss Brill reads her feelings into it; it scores her afternoon.
  topic_code: "5.B"
- front: The little brown dog and the play
  back: |
    A dog trotting "on solemn" like "a little 'theatre' dog" makes Miss Brill realize "They were all on the stage." The gardens become a play in which she too has "a part."
  topic_code: "1.C"
- front: '"Yes, I have been an actress for a long time."'
  back: |
    Miss Brill imagines saying this to the old invalid. The line is truer than she knows: she has been performing contentment, acting a part in her own life.
  topic_code: "1.C"
- front: '"Yes, we understand, we understand ... though what they understood she didn''t know."'
  back: |
    Her moment of imagined communion with "all the whole company." The narrator's last clause quietly undercuts it: the understanding is a feeling, not knowledge, and it is about to be broken.
  topic_code: "4.C"
- front: The young couple → their role
  back: |
    "beautifully dressed; they were in love." Miss Brill casts them as "The hero and heroine, of course." They are the story's sharpest contrast to her: young, paired, and cruel. The boy calls her "that stupid old thing."
  topic_code: "1.C"
- front: '"It''s exactly like a fried whiting."'
  back: |
    The girl's verdict on Miss Brill's fur. A whiting is a small, cheap fish, and the joke reduces Miss Brill's beloved companion to something cheap and comic.
  topic_code: "1.C"
- front: '"Why doesn''t she keep her silly old mug at home?"'
  back: |
    The boy's question, the only time anyone in the story speaks about Miss Brill. It is the outside view that contradicts every belief she held a minute earlier about being "part of the performance."
  topic_code: "1.C"
- front: The honey-cake and the almond
  back: |
    Her Sunday treat. An almond in the slice "was like carrying home a tiny present." Today she passes the baker's by. The small ritual of pleasure is the first thing the overheard insult takes away.
  topic_code: "1.C"
- front: '"her room like a cupboard"'
  back: |
    The last scene's phrase for her lodging. It echoes her earlier view of the odd bench-sitters who looked as if they'd come from "cupboards," so the story closes its irony: she is one of them.
  topic_code: "1.C"
- front: '"she thought she heard something crying"'
  back: |
    The final line. Miss Brill puts the fur back in its box, and the crying is displaced onto it, as the fur's "sad little eyes" spoke for her at the start. She still cannot say that she is the one who weeps.
  topic_code: "4.C"
- front: Close third-person narration in Mansfield
  back: |
    A third-person narrator who stays inside one character's mind and often uses her idiom ("Dear me!", "Little rogue!"). Free indirect discourse lets us hear Miss Brill's thoughts while the narration quietly shows more than she knows.
  topic_code: "4.B"
- front: The story's structure → before and after the asterisks
  back: |
    Most of the story is the afternoon in the gardens, rising to the vision of the play and the imagined song. A section break follows the lovers' insult; the short final section is the walk home and the dark room. The break marks the fall.
  topic_code: "3.A"
- front: Contrasting characters (1.C) → what the skill asks
  back: |
    Not just "X is old, Y is young." Explain the function: what the contrast reveals about a character, intensifies in a scene, or contributes to meaning. In "Miss Brill," contrasts reveal what she cannot see about herself.
  topic_code: "1.C"
- front: Foil → as Mansfield uses it
  back: |
    A character whose differences (or uncanny similarities) highlight another's qualities. The young lovers are foils by difference; the ermine toque and the silent bench-sitters are foils by likeness.
  topic_code: "1.C"
- front: Miss Brill's perspective vs. the reader's
  back: |
    She sees herself as an observer and a performer in a shared play; the reader sees an aging, solitary woman who is watched with contempt. Mansfield's art is to let us feel both views at once.
  topic_code: "4.C"
- front: Setting in "Miss Brill" → the season
  back: |
    Autumn: yellow leaves "down drooping," "a faint chill," the start of "the Season." The time of year frames a woman who is herself past her season, though she feels the chill only as a pleasant edge.
  topic_code: "2.B"
- front: Miss Brill and the gardens → her relationship to the setting
  back: |
    She treats the Jardins Publiques as her own theatre and her "special" seat as reserved. Belonging there is the illusion that sustains her; the lovers' words expel her from it.
  topic_code: "2.C"
- front: Q2 essay on "Miss Brill" → a strong line of reasoning
  back: |
    (1) The fur and Miss Brill's tender self-deception; (2) the people she judges, who mirror her; (3) the play, her moment of belonging; (4) the lovers, the outside view; (5) the dark room and the crying. Contrast drives each stage.
  topic_code: "7.B"
quiz:
  description: |
    24 questions · about 45 minutes, plus 40 minutes for the essay · a passage set on Miss Brill's discovery that the
    gardens are a play, questions on the characters who surround and mirror her, and a large share of review across
    the unit and the year (perspective, relationships, setting, structure, figurative language, thesis and
    commentary). Multiple choice, select-all, true/false and fill-in-the-blank items are graded at once; the two short
    answers and the Q2 prose-fiction essay are graded by your teacher against the scoring guide.
  questions:
  - slug: u04-w13-q01
    type: multiple_choice
    topic_code: "1.C"
    source: Katherine Mansfield, "Miss Brill" (1920)
    points: 1
    stimulus: |
      *The following passage is from Katherine Mansfield's "Miss Brill" (1920). Miss Brill, an Englishwoman who teaches English in a French resort town, is spending her Sunday afternoon, as she always does, on a bench in the public gardens listening to the band.*

      Oh, how fascinating it was! How she enjoyed it! How she loved sitting here, watching it all! It was like a play. It was exactly like a play. Who could believe the sky at the back wasn't painted? But it wasn't till a little brown dog trotted on solemn and then slowly trotted off, like a little “theatre” dog, a little dog that had been drugged, that Miss Brill discovered what it was that made it so exciting. They were all on the stage. They weren't only the audience, not only looking on; they were acting. Even she had a part and came every Sunday. No doubt somebody would have noticed if she hadn't been there; she was part of the performance after all. [...] She was on the stage. She thought of the old invalid gentleman to whom she read the newspaper four afternoons a week while he slept in the garden. She had got quite used to the frail head on the cotton pillow, the hollowed eyes, the open mouth and the high pinched nose. If he'd been dead she mightn't have noticed for weeks; she wouldn't have minded. But suddenly he knew he was having the paper read to him by an actress! “An actress!” The old head lifted; two points of light quivered in the old eyes. “An actress—are ye?” And Miss Brill smoothed the newspaper as though it were the manuscript of her part and said gently; “Yes, I have been an actress for a long time.”
    prompt: |
      The description of the old invalid gentleman, with his "frail head on the cotton pillow, the hollowed eyes, the open mouth," primarily serves to
    options:
    - introduce the character who will insult Miss Brill at the end of the story
    - present a figure whose neglected, unnoticed life resembles Miss Brill's own, though she does not see the likeness
    - show that Miss Brill is a devoted nurse who cares deeply for her patient
    - contrast Miss Brill's poor health with the gentleman's vigour
    option_explanations:
    - |
      The insult comes from the young couple on her bench. The invalid appears only in her thoughts.
    - |
      Correct. She admits that if he died she "mightn't have noticed for weeks; she wouldn't have minded." An old, solitary person whom no one would miss is exactly what the young couple will take Miss Brill to be. The contrast she draws between herself (actress) and him (audience) hides a likeness.
    - |
      Her admission that she "wouldn't have minded" if he were dead rules out deep devotion. She reads to him for pay, and his attention excites her only when she imagines being an actress.
    - |
      He is the frail one, with "hollowed eyes" and "high pinched nose"; nothing suggests Miss Brill is in poor health or that he is vigorous.
    answer: 1
