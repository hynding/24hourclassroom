    prompt: |
      Review (perspective). Explain in two or three sentences how the final sentence ("But when she put the lid on she thought she heard something crying") reveals Miss Brill's perspective, and how it connects to an earlier detail in the story.
    answer: |
      Miss Brill does not say that she is crying; she "thought she heard something crying," so even alone in her room she displaces her grief onto the fur rather than admit it. The line echoes the opening, where the fur's "sad little eyes" ask "What has been happening to me?", a question that was always hers, and it shows that the insult has wounded her without giving her the self-knowledge to name the wound.
    explanation: |
      1 point: identifies the displacement (the crying attributed to "something," the fur, rather than to herself). 1 point: explains what this reveals about her perspective (denial, inability to face her loneliness, a habit of self-correction such as "no, not sad"). 1 point: connects accurately to an earlier detail (the fur's eyes and question; the self-corrections; the fur's box at the start).
