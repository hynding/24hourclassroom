      Review (thesis). Write a defensible thesis (one or two sentences) for a Q2 essay analyzing how Mansfield uses contrast in this passage to characterize Miss Brill.
    answer: |
      By letting Miss Brill set herself apart from the passive "audience" and from the half-dead invalid she reads to, while the details of her own life match theirs, Mansfield portrays a woman whose joyful sense of belonging depends on not seeing herself, so that her moment of greatest happiness is also the clearest sign of her isolation.
