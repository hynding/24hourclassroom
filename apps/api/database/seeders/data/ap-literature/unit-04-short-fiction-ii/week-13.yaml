      *The following passage is from Katherine Mansfield's "Miss Brill" (1920). Miss Brill, an Englishwoman who teaches English in a French resort town, is spending her Sunday afternoon, as she always does, on a bench in the public gardens listening to the band.*

      Oh, how fascinating it was! How she enjoyed it! How she loved sitting here, watching it all! It was like a play. It was exactly like a play. Who could believe the sky at the back wasn't painted? But it wasn't till a little brown dog trotted on solemn and then slowly trotted off, like a little “theatre” dog, a little dog that had been drugged, that Miss Brill discovered what it was that made it so exciting. They were all on the stage. They weren't only the audience, not only looking on; they were acting. Even she had a part and came every Sunday. No doubt somebody would have noticed if she hadn't been there; she was part of the performance after all. [...] She was on the stage. She thought of the old invalid gentleman to whom she read the newspaper four afternoons a week while he slept in the garden. She had got quite used to the frail head on the cotton pillow, the hollowed eyes, the open mouth and the high pinched nose. If he'd been dead she mightn't have noticed for weeks; she wouldn't have minded. But suddenly he knew he was having the paper read to him by an actress! “An actress!” The old head lifted; two points of light quivered in the old eyes. “An actress—are ye?” And Miss Brill smoothed the newspaper as though it were the manuscript of her part and said gently; “Yes, I have been an actress for a long time.”
    prompt: |
      Miss Brill contrasts herself with the people "only ... looking on," deciding that "Even she had a part." This self-image is most ironic because
    options:
    - the story has shown her chiefly as a watcher of others, and the only part others will give her is that of a joke
    - she has never actually attended the band concerts before
    - she is a professional actress who is ashamed of her career
    - the other people in the gardens have openly invited her to join them
    option_explanations:
    - |
      Correct. Her Sunday skill is "listening as though she didn't listen." When the lovers finally notice her, she becomes "that stupid old thing at the end there." She does have a part, but not the one she imagines.
    - |
      She comes "every Sunday" and leaves home "at just the same time each week." Her attendance is a fixed ritual.
    - |
      She is a teacher of English and a reader to an invalid. "Actress" is her imagined role, which is why the line about being "an actress for a long time" is ironic.
    - |
      No one invites her; the old couple do not even speak. Her sense of belonging is entirely her own.
    answer: 0
