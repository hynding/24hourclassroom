    Be it so if you will; but, alas! it was a dream of evil omen for young Goodman Brown. A stern, a sad, a darkly meditative, a distrustful, if not a desperate man did he become from the night of that fearful dream. [...] And when he had lived long, and was borne to his grave a hoary corpse, followed by Faith, an aged woman, and children and grandchildren, a goodly procession, besides neighbors not a few, they carved no hopeful verse upon his tombstone, for his dying hour was gloom.
  prompt: |
    The final paragraph's account of Brown's later life suggests that his relationship with Faith is
  options:
  - ended by a public separation soon after the night in the forest
  - unknown, because Faith is not mentioned again
  - outwardly continued but inwardly broken, marked by his withdrawal and suspicion
  - restored to its original happiness once Brown recovers
  option_explanations:
  - |
    There is no separation; Faith walks in his funeral procession.
  - |
    Faith is mentioned in the funeral procession ("followed by Faith, an aged woman").
  - |
    Correct. They remain married and raise "children and grandchildren," yet he "gazed sternly at his wife, and turned away"; she follows him to his grave "an aged woman." The marriage persists as a form emptied of trust.
  - |
    The passage records gloom to "his dying hour." Nothing is restored.
  answer: 2
