- slug: u04-exam-q34
  type: short_answer
  topic_code: "1.C"
  source: general knowledge
  points: 3
  prompt: |
    In two or three sentences, explain how one Unit 4 story uses a contrast between two characters to reveal something one of them cannot see about himself or herself. Name the story, both characters and the specific detail of contrast.
  answer: |
    In "Miss Brill," Mansfield has Miss Brill watch a woman in a shabby ermine toque greet a gentleman who blows smoke in her face and walks off, after which the woman smiles "more brightly than ever." Miss Brill hears the band beat "The Brute! The Brute!" and enjoys the scene as theatre, but the toque, an aging woman in worn fur smiling through rejection, is Miss Brill herself, so the contrast between her amused spectatorship and the reader's recognition reveals her blindness to her own situation before the lovers expose it.
  explanation: |
    1 point: names a story and two contrasting characters accurately. 1 point: cites a specific, accurate detail of the contrast (quotation or close paraphrase). 1 point: explains what the contrast reveals that the character cannot see (e.g., Miss Brill and the bench-sitters or the toque; Brown and Goody Cloyse; Gilman's narrator and the woman in the paper). Answers that state only that the characters are different earn at most 1.
- slug: u04-exam-q35
  type: multiple_choice
  topic_code: "1.C"
  source: Katherine Mansfield, "Her First Ball" (1921)
  points: 1
  stimulus: |
    *The following passage is from Katherine Mansfield's "Her First Ball" (1921). Leila, a young woman from a remote country home, is at her first dance in town. Her partner is a fat, balding man who has just told her he has been going to balls "for the last thirty years."*

    “Kind little lady,” said the fat man, and he pressed her a little closer, and hummed a bar of the waltz. “Of course,” he said, “you can't hope to last anything like as long as that. No-o,” said the fat man, “long before that you'll be sitting up there on the stage, looking on, in your nice black velvet. And these pretty arms will have turned into little short fat ones, and you'll beat time with such a different kind of fan—a black bony one.” [...] “And you'll smile away like the poor old dears up there, and point to your daughter, and tell the elderly lady next to you how some dreadful man tried to kiss her at the club ball. And your heart will ache, ache”—the fat man squeezed her closer still, as if he really was sorry for that poor heart—“because no one wants to kiss you now. [...] Eh, Mademoiselle Twinkletoes?” said the fat man softly.

    Leila gave a light little laugh, but she did not feel like laughing. Was it—could it all be true? It sounded terribly true. Was this first ball only the beginning of her last ball, after all? At that the music seemed to change; it sounded sad, sad; it rose upon a great sigh. Oh, how quickly things changed! Why didn't happiness last for ever? For ever wasn't a bit too long.

    “I want to stop,” she said in a breathless voice. The fat man led her to the door.
  prompt: |
    The contrast between Leila and the fat man in the first paragraph chiefly serves to
  options:
  - show that the fat man is Leila's father, who has come to take her home
  - establish that the fat man is jealous of Leila's other partners
  - suggest that Leila is more experienced at dancing than the fat man
  - set her fresh delight in the ball against his weary knowledge of what such delight becomes
  option_explanations:
  - |
    Nothing in the passage suggests a family tie: he calls her "little lady" and "Mademoiselle Twinkletoes," as a stranger flirting with a girl might.
  - |
    He says nothing about other partners; his speech is about time and age.
  - |
    He has decades of experience; she has learned at boarding school. The contrast runs the other way.
  - |
    Correct. She is at her first ball; he has danced for thirty years and describes her future as a chaperone. Youth and age are set against each other to raise the story's question about whether happiness can last.
  answer: 3
