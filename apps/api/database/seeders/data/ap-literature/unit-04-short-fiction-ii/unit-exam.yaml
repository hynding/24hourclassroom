  stimulus: |
    *The following passage is from Katherine Mansfield's "Her First Ball" (1921). Leila, a young woman from a remote country home, is at her first dance in town. Her partner is a fat, balding man who has just told her he has been going to balls "for the last thirty years."*

    “Kind little lady,” said the fat man, and he pressed her a little closer, and hummed a bar of the waltz. “Of course,” he said, “you can't hope to last anything like as long as that. No-o,” said the fat man, “long before that you'll be sitting up there on the stage, looking on, in your nice black velvet. And these pretty arms will have turned into little short fat ones, and you'll beat time with such a different kind of fan—a black bony one.” [...] “And you'll smile away like the poor old dears up there, and point to your daughter, and tell the elderly lady next to you how some dreadful man tried to kiss her at the club ball. And your heart will ache, ache”—the fat man squeezed her closer still, as if he really was sorry for that poor heart—“because no one wants to kiss you now. [...] Eh, Mademoiselle Twinkletoes?” said the fat man softly.

    Leila gave a light little laugh, but she did not feel like laughing. Was it—could it all be true? It sounded terribly true. Was this first ball only the beginning of her last ball, after all? At that the music seemed to change; it sounded sad, sad; it rose upon a great sigh. Oh, how quickly things changed! Why didn't happiness last for ever? For ever wasn't a bit too long.

    “I want to stop,” she said in a breathless voice. The fat man led her to the door.
  prompt: |
    Which contrasts does Mansfield build into the fat man's speech? Select all that apply.
  options:
  - Dancing on the floor now versus sitting "up there on the stage, looking on" later
  - The country home Leila has left versus the town ballroom
  - '"pretty arms" versus "little short fat ones"'
  - Leila's light fan now versus "a black bony one"
  option_explanations:
  - |
    Correct. Participant becomes spectator: the chaperones on the stage are Leila's future.
  - |
    The country home is mentioned in the headnote's context, not in his speech. He does not contrast country and town.
  - |
    Correct. Youthful body against aged body, in a single parallel.
  - |
    Correct. The fan, an emblem of the young dancer, turns black and bony, like a widow's.
  answer: [0, 2, 3]
  explanation: |
    The speech is built from paired images of now and later, each turning a sign of youth into a sign of age. That structure is why it lands so hard on Leila.
