    Had Goodman Brown fallen asleep in the forest and only dreamed a wild dream of a witch-meeting?

    Be it so if you will; but, alas! it was a dream of evil omen for young Goodman Brown. A stern, a sad, a darkly meditative, a distrustful, if not a desperate man did he become from the night of that fearful dream. [...] And when he had lived long, and was borne to his grave a hoary corpse, followed by Faith, an aged woman, and children and grandchildren, a goodly procession, besides neighbors not a few, they carved no hopeful verse upon his tombstone, for his dying hour was gloom.
  prompt: |
    The description of Faith "bursting into such joy at sight of him that she skipped along the street" contrasts most directly with
  options:
  - the procession of children and grandchildren at Brown's funeral
  - the congregation singing a holy psalm on the Sabbath
  - the minister's blessing as he walks along the graveyard
  - Brown's looking "sternly and sadly into her face" and passing "without a greeting"
  option_explanations:
  - |
    The funeral is decades later; it contrasts the "goodly procession" with his gloom, a different pairing.
  - |
    The psalm is in the next section and contrasts with the "anthem of sin" Brown hears, not with Faith's greeting.
  - |
    The minister's blessing is another gesture Brown rejects, but it is not the contrast built around Faith's joy in the same sentence pair.
  - |
    Correct. The two sentences sit side by side: her open joy, his stern silence. The contrast measures the distance the forest has put between them.
  answer: 3
- slug: u04-exam-q03
  type: multiple_choice
  topic_code: "4.B"
  source: Nathaniel Hawthorne, "Young Goodman Brown" (1835)
  points: 1
  stimulus: |
    *The following passage is the ending of Nathaniel Hawthorne's "Young Goodman Brown" (1835). Brown has spent the night in the forest, where he believed he saw his minister, his neighbors and his wife, Faith, at a witches' meeting.*

    The next morning young Goodman Brown came slowly into the street of Salem village, staring around him like a bewildered man. [...] Old Deacon Gookin was at domestic worship, and the holy words of his prayer were heard through the open window. "What God doth the wizard pray to?" quoth Goodman Brown. Goody Cloyse, that excellent old Christian, stood in the early sunshine at her own lattice, catechizing a little girl who had brought her a pint of morning's milk. Goodman Brown snatched away the child as from the grasp of the fiend himself. Turning the corner by the meeting-house, he spied the head of Faith, with the pink ribbons, gazing anxiously forth, and bursting into such joy at sight of him that she skipped along the street and almost kissed her husband before the whole village. But Goodman Brown looked sternly and sadly into her face, and passed on without a greeting.

    Had Goodman Brown fallen asleep in the forest and only dreamed a wild dream of a witch-meeting?

    Be it so if you will; but, alas! it was a dream of evil omen for young Goodman Brown. A stern, a sad, a darkly meditative, a distrustful, if not a desperate man did he become from the night of that fearful dream. [...] And when he had lived long, and was borne to his grave a hoary corpse, followed by Faith, an aged woman, and children and grandchildren, a goodly procession, besides neighbors not a few, they carved no hopeful verse upon his tombstone, for his dying hour was gloom.
  prompt: |
    The narrator's response to the question of whether Brown "only dreamed a wild dream" ("Be it so if you will") has the effect of
  options:
  - leaving the question to the reader while insisting that the consequences were real either way
  - suggesting that Brown invented the story to excuse his behavior
  - confirming that the witch-meeting really took place
  - revealing that the narrator was present in the forest
  option_explanations:
  - |
    Correct. "If you will" hands the choice to the reader; "alas! it was a dream of evil omen" moves the weight to its effects. The point of view refuses certainty about events and offers certainty about consequences.
  - |
    Nothing suggests Brown told anyone a story; the passage reports his inner life and behavior directly.
  - |
    The narrator grants the dream reading ("Be it so"), so nothing is confirmed.
  - |
    The narrator speaks as a teller, not a witness, and never claims presence.
  answer: 0
- slug: u04-exam-q04
  type: multiple_choice
  topic_code: "4.C"
  source: Nathaniel Hawthorne, "Young Goodman Brown" (1835)
  points: 1
  stimulus: |
    *The following passage is the ending of Nathaniel Hawthorne's "Young Goodman Brown" (1835). Brown has spent the night in the forest, where he believed he saw his minister, his neighbors and his wife, Faith, at a witches' meeting.*

    The next morning young Goodman Brown came slowly into the street of Salem village, staring around him like a bewildered man. [...] Old Deacon Gookin was at domestic worship, and the holy words of his prayer were heard through the open window. "What God doth the wizard pray to?" quoth Goodman Brown. Goody Cloyse, that excellent old Christian, stood in the early sunshine at her own lattice, catechizing a little girl who had brought her a pint of morning's milk. Goodman Brown snatched away the child as from the grasp of the fiend himself. Turning the corner by the meeting-house, he spied the head of Faith, with the pink ribbons, gazing anxiously forth, and bursting into such joy at sight of him that she skipped along the street and almost kissed her husband before the whole village. But Goodman Brown looked sternly and sadly into her face, and passed on without a greeting.

    Had Goodman Brown fallen asleep in the forest and only dreamed a wild dream of a witch-meeting?

    Be it so if you will; but, alas! it was a dream of evil omen for young Goodman Brown. A stern, a sad, a darkly meditative, a distrustful, if not a desperate man did he become from the night of that fearful dream. [...] And when he had lived long, and was borne to his grave a hoary corpse, followed by Faith, an aged woman, and children and grandchildren, a goodly procession, besides neighbors not a few, they carved no hopeful verse upon his tombstone, for his dying hour was gloom.
  prompt: |
    The syntax of "A stern, a sad, a darkly meditative, a distrustful, if not a desperate man did he become" contributes to the passage chiefly by
  options:
  - using a simple subject-verb-object order to describe Brown plainly
  - listing the virtues Brown gained from his experience
  - piling up adjectives before the verb so that the weight of Brown's transformation falls on the reader before the sentence resolves
  - introducing dialogue that reveals Brown's own view of himself
  option_explanations:
  - |
    The order is inverted, not plain; the adjectives come before subject and verb.
  - |
    "Distrustful" and "desperate" are not virtues. The list records loss.
  - |
    Correct. The inverted order places five descriptors, each heavier than the last ("if not a desperate"), ahead of "did he become." The structure enacts accumulation: his character darkens clause by clause.
  - |
    There is no dialogue in the sentence; it is the narrator's summary.
  answer: 2
