  stimulus: |
    *The following passage is the ending of Katherine Mansfield's "Miss Brill" (1920). Miss Brill has just decided that everyone in the Sunday gardens, herself included, is an actor in one play.*

    Just at that moment a boy and girl came and sat down where the old couple had been. They were beautifully dressed; they were in love. The hero and heroine, of course, just arrived from his father's yacht. And still soundlessly singing, still with that trembling smile, Miss Brill prepared to listen.

    “No, not now,” said the girl. “Not here, I can't.”

    “But why? Because of that stupid old thing at the end there?” asked the boy. “Why does she come here at all—who wants her? Why doesn't she keep her silly old mug at home?”

    “It's her fu-ur which is so funny,” giggled the girl. “It's exactly like a fried whiting.”

    [...]

    *****

    On her way home she usually bought a slice of honey-cake at the baker's. It was her Sunday treat. Sometimes there was an almond in her slice, sometimes not. It made a great difference. If there was an almond it was like carrying home a tiny present—a surprise—something that might very well not have been there. [...]

    But to-day she passed the baker's by, climbed the stairs, went into the little dark room—her room like a cupboard—and sat down on the red eiderdown. She sat there for a long time. The box that the fur came out of was on the bed. She unclasped the necklet quickly; quickly, without looking, laid it inside. But when she put the lid on she thought she heard something crying.
  prompt: |
    The contrast between the young couple and Miss Brill in the first part of the passage serves primarily to
  options:
  - reveal, from outside, how the people Miss Brill thought she shared a play with actually see her
  - suggest that the girl is jealous of Miss Brill's fur
  - establish that the boy wants to sit closer to Miss Brill
  - show that Miss Brill and the couple are old friends
  option_explanations:
  - |
    Correct. Miss Brill casts them as "hero and heroine"; they cast her as "that stupid old thing at the end there." The young, paired, careless couple supply the outside view her narration has kept at bay.
  - |
    The girl laughs at the fur ("like a fried whiting"); nothing suggests envy.
  - |
    The boy's irritation is that Miss Brill is there at all; he wants privacy with the girl.
  - |
    The boy asks "who wants her?"; they are strangers.
  answer: 0
