  prompt: |
    Which details show that sacred places and practices in the village have become sources of dread for Brown? Select all that apply.
  options:
  - He calls Deacon Gookin's prayer the prayer of a "wizard."
  - He fears that "the roof should thunder down" during the minister's sermon.
  - He hears "an anthem of sin" over the congregation's holy psalm.
  - He walks along the graveyard to meditate on his sermon.
  option_explanations:
  - |
    Correct. Domestic worship heard through the window becomes, to Brown, a wizard's incantation.
  - |
    Correct. The sermon makes him expect judgment on "the gray blasphemer and his hearers," a dread of the meeting-house itself.
  - |
    Correct. The church music he once shared is drowned for him by the memory of the forest hymn.
  - |
    It is the minister, not Brown, who walks along the graveyard to meditate his sermon. This misattributes the action.
  answer: [0, 1, 2]
  explanation: |
    The ending turns each place of worship (street, home, church) into a site of suspicion. The wrong option confuses Brown with the minister.
