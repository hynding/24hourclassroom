unit: 4
description: |
  45 questions · about 75 minutes, plus 40 minutes for the essay · Unit 4, Short Fiction II (weeks 11-13). Four passage
  sets in AP Section I style: the ending of "Young Goodman Brown," the narrator's first description of her room in "The
  Yellow Wall-Paper," the ending of "Miss Brill," and an unseen passage from Katherine Mansfield's "Her First Ball";
  then stand-alone items across the unit, one short answer, and a full Q2 prose fiction analysis essay on the unseen
  passage, scored on the AP 6-point rubric. Skills: setting and its function, character and setting, narrator's
  perspective, relationships, contrasting characters, plot order and contrast, and thesis, evidence and commentary.
  Everything except the short answer and the essay is graded at once.
questions:
- slug: u04-exam-q01
  type: multiple_choice
  topic_code: "2.C"
  source: Nathaniel Hawthorne, "Young Goodman Brown" (1835)
  points: 1
  stimulus: |
    *The following passage is the ending of Nathaniel Hawthorne's "Young Goodman Brown" (1835). Brown has spent the night in the forest, where he believed he saw his minister, his neighbors and his wife, Faith, at a witches' meeting.*

    The next morning young Goodman Brown came slowly into the street of Salem village, staring around him like a bewildered man. [...] Old Deacon Gookin was at domestic worship, and the holy words of his prayer were heard through the open window. "What God doth the wizard pray to?" quoth Goodman Brown. Goody Cloyse, that excellent old Christian, stood in the early sunshine at her own lattice, catechizing a little girl who had brought her a pint of morning's milk. Goodman Brown snatched away the child as from the grasp of the fiend himself. Turning the corner by the meeting-house, he spied the head of Faith, with the pink ribbons, gazing anxiously forth, and bursting into such joy at sight of him that she skipped along the street and almost kissed her husband before the whole village. But Goodman Brown looked sternly and sadly into her face, and passed on without a greeting.

    Had Goodman Brown fallen asleep in the forest and only dreamed a wild dream of a witch-meeting?

    Be it so if you will; but, alas! it was a dream of evil omen for young Goodman Brown. A stern, a sad, a darkly meditative, a distrustful, if not a desperate man did he become from the night of that fearful dream. [...] And when he had lived long, and was borne to his grave a hoary corpse, followed by Faith, an aged woman, and children and grandchildren, a goodly procession, besides neighbors not a few, they carved no hopeful verse upon his tombstone, for his dying hour was gloom.
  prompt: |
    In the first paragraph, Goodman Brown's reactions to the minister, Deacon Gookin and Goody Cloyse primarily show that
  options:
  - Brown has resolved to protect the village from the devil
  - the ordinary morning life of the village now appears to him as a disguise for hidden evil
  - the villagers have publicly confessed their attendance at the witch-meeting
  - Brown is too tired from his journey to recognize his neighbors
  option_explanations:
  - |
    Snatching one child is not a resolve to protect the village; the rest of the passage shows him withdrawing into gloom, not taking up a mission.
  - |
    Correct. Each neighbor is doing something pious (praying, catechizing), and Brown responds as if to evil ("What God doth the wizard pray to?"; snatching the child "as from the grasp of the fiend"). The village is unchanged; his relationship to it is reversed.
  - |
    No one confesses; the villagers act exactly as usual. Brown's reactions come from what he believes he saw, not from any public admission.
  - |
    He recognizes them all and reacts to each by name. Bewilderment ("like a bewildered man") is not failure to recognize.
  answer: 1
- slug: u04-exam-q02
  type: multiple_choice
  topic_code: "3.D"
  source: Nathaniel Hawthorne, "Young Goodman Brown" (1835)
  points: 1
  stimulus: |
    *The following passage is the ending of Nathaniel Hawthorne's "Young Goodman Brown" (1835). Brown has spent the night in the forest, where he believed he saw his minister, his neighbors and his wife, Faith, at a witches' meeting.*

