  - mark a flashback to Miss Brill's childhood
  option_explanations:
  - |
    The same close third-person narrator continues.
  - |
    It is the same day: "to-day she passed the baker's by."
  - |
    Correct. Mansfield gives us no reaction from Miss Brill on the bench; the gap enacts the shock, and the final section measures it in changed habits.
  - |
    The last section is the present evening, not her childhood.
  answer: 2
- slug: u04-exam-q24
  type: multiple_choice
  topic_code: "4.B"
  source: general knowledge
  points: 1
  prompt: |
    Which pairing correctly matches each Unit 4 story with its narrative point of view?
  options:
  - All three are told by first-person narrators.
  - '"Young Goodman Brown": close third person with no narratorial comment; "The Yellow Wall-Paper": second person; "Miss Brill": omniscient'
  - '"Young Goodman Brown": first person; "The Yellow Wall-Paper": close third person; "Miss Brill": first-person journal'
  - '"Young Goodman Brown": third person with a hedging, commenting narrator; "The Yellow Wall-Paper": first-person journal; "Miss Brill": close third person'
  option_explanations:
  - |
    Only "The Yellow Wall-Paper" uses "I" as its narrator.
  - |
    Hawthorne's narrator comments freely ("The fiend in his own shape is less hideous..."), and Gilman's is first, not second, person.
  - |
    Brown is "he" throughout, and Miss Brill is "she"; only Gilman's story is first person.
  - |
    Correct. Hawthorne's narrator comments and hedges ("Be it so if you will"); Gilman's narrator writes in secret entries; Mansfield stays inside Miss Brill's mind in the third person.
  answer: 3
- slug: u04-exam-q25
  type: true_false
  topic_code: "2.B"
  source: Nathaniel Hawthorne, "Young Goodman Brown" (1835)
  points: 1
  prompt: |
    True or false: In "Young Goodman Brown," the witch-meeting takes place in a forest clearing whose rock, burning pines and hymn imitate the features of a church service.
  answer: true
  explanation: |
    True. The rock resembles "an altar or a pulpit," the pines burn "like candles at an evening meeting," and there is a hymn, a congregation and converts. The setting parodies worship.
- slug: u04-exam-q26
  type: true_false
  topic_code: "1.D"
  source: Charlotte Perkins Gilman, "The Yellow Wall-Paper" (1892)
  points: 1
  prompt: |
    True or false: In "The Yellow Wall-Paper," John agrees to repaper the room as soon as his wife asks him to.
  answer: false
  explanation: |
    False. He at first meant to repaper but then said she was "letting it get the better of" her and that changing it would lead to changing the bedstead, the windows and the gate. His refusal, presented as medical prudence, is one of the story's early exercises of control.
- slug: u04-exam-q27
  type: true_false
  topic_code: "1.C"
  source: Katherine Mansfield, "Miss Brill" (1920)
  points: 1
  prompt: |
    True or false: In "Miss Brill," the woman in the ermine toque functions as a foil whose rejection by the gentleman in grey anticipates Miss Brill's own humiliation.
  answer: true
  explanation: |
    True. Both are aging women in worn fur who smile through being slighted. Miss Brill watches the toque's rejection as a scene in a play without seeing herself in it.
- slug: u04-exam-q28
  type: fill_blank
  topic_code: "2.C"
  source: Nathaniel Hawthorne, "Young Goodman Brown" (1835)
  points: 1
  prompt: |
    In the forest, a pink ____ falls from the dark cloud, and Brown cries, "My Faith is gone!"
  answer: [ribbon]
  explanation: |
    The ribbon belongs to his wife's cap. Its fall makes Brown believe Faith has joined the meeting, and his relationship to the forest changes at once: he rushes into it as its "chief horror."
- slug: u04-exam-q29
  type: fill_blank
  topic_code: "4.C"
  source: Charlotte Perkins Gilman, "The Yellow Wall-Paper" (1892)
  points: 1
  prompt: |
    Gilman's narrator calls her journal "dead ____" because it cannot repeat what she confides to it.
  answer: [paper]
  explanation: |
    "This is dead paper and a great relief to my mind": the journal is the one listener that cannot betray her, which is why her criticisms of John appear there, often in parentheses.
- slug: u04-exam-q30
  type: multi_select
  topic_code: "1.C"
  source: general knowledge
  points: 2
  partial_credit: true
  prompt: |
    Which of the following are examples of a foil working by likeness rather than difference? Select all that apply.
  options:
  - Goody Cloyse, the catechism teacher who greets the devil as an old friend, set against Brown's view of himself as an innocent traveller
  - The woman "stooping down and creeping" behind the pattern in "The Yellow Wall-Paper"
  - The young lovers in "Miss Brill"
  - The silent old people on the benches in "Miss Brill"
  option_explanations:
  - |
    Correct. Brown is shocked by Goody Cloyse's errand, yet he is on the same road to the same meeting; her likeness exposes his self-deception.
  - |
    Correct. The figure in the paper is the narrator's double; by the end the narrator creeps as the woman creeps and speaks of having "got out."
  - |
    The lovers are young, paired and careless: a foil by difference.
  - |
    Correct. Miss Brill describes them as odd old watchers from cupboard-like rooms, which is what she is.
  answer: [0, 1, 3]
  explanation: |
    Foils by likeness reveal what a character refuses to see in herself or himself. Each story in the unit uses one: the bench-sitters, Goody Cloyse, the woman in the paper.
- slug: u04-exam-q31
  type: multiple_choice
  topic_code: "7.B"
  source: general knowledge
  points: 1
  prompt: |
    A Q2 prompt asks students to analyze how an author portrays "the complex relationship between a character and the place she lives." Which thesis best responds?
  options:
  - The narrator's growing attachment to the very room that confines her, traced through her shifting descriptions of its paper, shows how a mind denied outlets can make its prison its whole world.
  - The author uses imagery, diction and syntax to describe the room.
  - The story has a setting that is important to the character.
  - The room is yellow and has barred windows.
  option_explanations:
