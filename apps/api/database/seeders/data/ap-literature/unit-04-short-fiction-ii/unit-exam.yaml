  prompt: |
    Q2 (prose fiction analysis, 40 minutes). The passage above is from Katherine Mansfield's "Her First Ball" (1921). In this passage, a young woman at her first dance is partnered by a much older man. Read the passage carefully. Then, in a well-written essay, analyze how Mansfield uses literary elements and techniques to portray the contrast between the two characters and its effect on the young woman.

    In your response you should do the following:
    - Respond to the prompt with a thesis that presents a defensible interpretation.
    - Select and use evidence to support your line of reasoning.
    - Explain how the evidence supports your line of reasoning.
    - Use appropriate grammar and punctuation in communicating your argument.
  answer: |
    Strong thesis: Mansfield sets the fat man's weary, physical forecast of age against Leila's innocent, exclamatory delight, and lets his words reshape the ballroom itself, so that a single speech converts her first ball into a glimpse of her last and teaches her, too early, that happiness is shadowed by time.

    Line of reasoning: (1) Contrast of experience: "thirty years" against a first dance; his "Kind little lady," which pockets her sympathy and turns it into an opening for a speech about her decline. (2) His speech: paired images of now and later ("pretty arms" / "little short fat ones"; her fan / "a black bony one"; dancing / sitting "on the stage, looking on"); the repetition "ache, ache"; the ambiguous "as if he really was sorry," which suggests he enjoys her alarm; the mocking "Mademoiselle Twinkletoes." (3) Leila's response in close third person: "a light little laugh" that belies her feeling; broken syntax ("Was it—could it all be true?"); the paradox "first ball only the beginning of her last ball." (4) Setting as mirror: the music "seemed to change; it sounded sad, sad; it rose upon a great sigh." (5) Her childlike protest: "For ever wasn't a bit too long," and the breathless "I want to stop."

    Sophistication: notes the ambiguity of the fat man (cruel, self-pitying, or truthful), or the irony that his prophecy is true of him (he is the one who should be "on the stage"), or the broader tension between youth's sense of beginnings and age's sense of endings, sustained across the essay.
  explanation: |
    Row A Thesis (0-1): 1 point for a defensible thesis that interprets the contrast and its effect on Leila (e.g., innocence unsettled by experience; a first ball recast as a last). A thesis that only names the contrast ("Leila is young and the man is old") earns 0.

    Row B Evidence and Commentary (0-4): 1 = summary of the dance and speech. 2 = some relevant quotations ("thirty years," "black bony one," "first ball ... last ball") with commentary that restates or generalizes. 3 = specific evidence from both characters, with commentary explaining how imagery, parallel structure, close third-person narration or setting create the contrast and its effect; mostly coherent line of reasoning. 4 = all of 3, with consistent commentary that explains how each technique contributes to the effect on Leila and how the parts build the thesis (including the shift in the music and her broken questions).

    Row C Sophistication (0-1): 1 point for a complex understanding sustained through the essay, such as reading the fat man's sympathy as ambiguous ("as if he really was sorry"), recognizing that his speech is a self-portrait as much as a prophecy, or situating Leila's moment in a larger tension between youth and time, as in the unit's other stories.
