  prompt: |
    The details that Brown snatches the child from Goody Cloyse "in the early sunshine" and meets Faith "turning the corner by the meeting-house" function to
  options:
  - return Brown to the daylight village of the story's opening so that the change in him stands out against an unchanged place
  - establish that Brown has moved to a new house on the other side of Salem
  - suggest that the events of the night took place in the meeting-house
  - show that the forest has spread into the village and darkened it
  option_explanations:
  - |
    Correct. Sunshine and the meeting-house corner recall the departure at sunset; the setting is the same, which isolates Brown's transformation.
  - |
    Nothing indicates a move; he returns along the same street.
  - |
    The meeting took place in the forest clearing; the meeting-house appears only as the village landmark.
  - |
    The village is bright and orderly; the darkness is in Brown's perception, not in the place.
  answer: 0
