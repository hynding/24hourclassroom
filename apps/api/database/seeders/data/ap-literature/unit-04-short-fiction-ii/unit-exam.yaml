    Be it so if you will; but, alas! it was a dream of evil omen for young Goodman Brown. A stern, a sad, a darkly meditative, a distrustful, if not a desperate man did he become from the night of that fearful dream. [...] And when he had lived long, and was borne to his grave a hoary corpse, followed by Faith, an aged woman, and children and grandchildren, a goodly procession, besides neighbors not a few, they carved no hopeful verse upon his tombstone, for his dying hour was gloom.
  prompt: |
    The passage moves from a single morning to the rest of Brown's life and his death. This ordering of events primarily
  options:
  - creates suspense about whether Brown will return to the forest
  - slows the pace so that each Sabbath is described in detail
  - reveals in flashback the reasons Brown went into the forest
  - compresses a lifetime into a few sentences so that one night is shown to determine everything after it
  option_explanations:
  - |
    No return to the forest is raised as a possibility; the ending is settled, not suspenseful.
  - |
    The pace accelerates; Sabbaths are summarized together ("On the Sabbath day..."), not described one by one.
  - |
    The passage moves forward in time; it never goes back to explain the errand.
  - |
    Correct. Summary narration races through decades, contrasting with the long night that came before. The disproportion is the meaning: one night outweighs a life.
  answer: 3
- slug: u04-exam-q09
  type: multiple_choice
  topic_code: "2.B"
  source: Charlotte Perkins Gilman, "The Yellow Wall-Paper" (1892)
  points: 1
  stimulus: |
    *The following passage is from the opening entry of Charlotte Perkins Gilman's "The Yellow Wall-Paper" (1892). The narrator is describing the room at the top of the rented house where her husband, John, has decided they will sleep.*

    It is a big, airy room, the whole floor nearly, with windows that look all ways, and air and sunshine galore. It was nursery first and then playground and gymnasium, I should judge; for the windows are barred for little children, and there are rings and things in the walls.

    The paint and paper look as if a boys' school had used it. It is stripped off—the paper—in great patches all around the head of my bed, about as far as I can reach, and in a great place on the other side of the room low down. I never saw a worse paper in my life.

    One of those sprawling flamboyant patterns committing every artistic sin.

    It is dull enough to confuse the eye in following, pronounced enough to constantly irritate, and provoke study, and when you follow the lame, uncertain curves for a little distance they suddenly commit suicide—plunge off at outrageous angles, destroy themselves in unheard-of contradictions.

    The color is repellant, almost revolting; a smouldering, unclean yellow, strangely faded by the slow-turning sunlight.

    It is a dull yet lurid orange in some places, a sickly sulphur tint in others.

    No wonder the children hated it! I should hate it myself if I had to live in this room long.

    There comes John, and I must put this away,—he hates to have me write a word.
  prompt: |
    The details that "the windows are barred for little children, and there are rings and things in the walls" function chiefly to
  options:
  - establish that the house is in poor repair because of legal trouble
  - offer an innocent explanation that the reader may suspect hides a room built for confinement
  - show that the narrator's own child will sleep in the room
  - demonstrate that John chose the room for its decoration
  option_explanations:
  - |
    The bars and rings are fittings, not damage; and the passage says nothing about legal trouble.
  - |
    Correct. The narrator's "I should judge" assigns a harmless origin, but bars and rings also fit restraint. The setting carries a meaning the narrator does not state.
  - |
    The narrator's baby stays elsewhere in the house; the room is hers and John's.
  - |
    The narrator thinks the paper is the worst she has ever seen; decoration is not why the room was chosen.
  answer: 1
