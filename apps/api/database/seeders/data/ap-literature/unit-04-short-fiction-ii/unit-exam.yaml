- slug: u04-exam-q32
  type: multiple_choice
  topic_code: "7.D"
  source: general knowledge
  points: 1
  prompt: |
    A student argues that in "Miss Brill" the narration makes the reader share Miss Brill's joy while seeing its fragility. Which piece of evidence would best support the second half of that claim?
  options:
  - A beautiful woman dropped her bunch of violets and a little boy ran after her.
  - The band "sounded louder and gayer" because the Season had begun.
  - Her description of the bench-sitters as coming from "dark little rooms or even—even cupboards!"
  - She had taken the fur "out of its box that afternoon."
  option_explanations:
  - |
    A vivid crowd detail, but it does not bear on Miss Brill's self-understanding.
  - |
    This supports her joy, not its fragility.
  - |
    Correct. Her joking description of others unknowingly describes herself, so the reader sees what she cannot; this is evidence of fragility beneath her pleasure.
  - |
    This is a neutral detail of her ritual; by itself it shows neither joy nor fragility.
  answer: 2
- slug: u04-exam-q33
  type: multiple_choice
  topic_code: "7.E"
  source: general knowledge
  points: 1
  prompt: |
    Which revision best integrates a quotation into a student's sentence about "The Yellow Wall-Paper"?
  options:
  - John says a quote. "Can you not trust me as a physician when I tell you so?" This shows he is controlling.
  - When John answers his wife's fears by asking, "Can you not trust me as a physician when I tell you so?", he turns a question about her mind into a test of her loyalty.
  - In the quote on page 3 it says John asks if she can trust him as a physician, this shows control.
  - '"Can you not trust me as a physician when I tell you so?" John is controlling.'
  option_explanations:
