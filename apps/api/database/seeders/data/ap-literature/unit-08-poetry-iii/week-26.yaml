      answer: |
        Hardy makes the bird old, weak and wind-battered, as worn out as the dying century around it, so its song cannot be explained by youth or good fortune. That frailty makes the thrush a symbol of hope that persists in spite of everything, and keeps the symbol honest: the hope is real but small, and it belongs to a creature that has suffered the same winter as the speaker.
