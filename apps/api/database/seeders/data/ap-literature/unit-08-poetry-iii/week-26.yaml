      type: long_answer
      topic_code: "7.D"
      source: 'Gerard Manley Hopkins, "Spring and Fall" (1918)'
      points: 6
      stimulus: |
        *The following poem by Gerard Manley Hopkins was written in 1880 and first published in* Poems of Gerard Manley Hopkins *(1918), whose text, including Hopkins's stress marks, is given here.*

        SPRING AND FALL:
        to a young child

        Márgarét, áre you gríeving
        Over Goldengrove unleaving?
        Leáves, like the things of man, you
        With your fresh thoughts care for, can you?
        Áh! ás the heart grows older   [5]
        It will come to such sights colder
        By and by, nor spare a sigh
        Though worlds of wanwood leafmeal lie;
        And yet you wíll weep and know why.
        Now no matter, child, the name:   [10]
        Sórrow's spríngs áre the same.
        Nor mouth had, no nor mind, expressed
        What heart heard of, ghost guessed:
        It is the blight man was born for,
        It is Margaret you mourn for.   [15]
      prompt: |
        Read carefully the following poem by Gerard Manley Hopkins. In the poem, an adult speaker addresses a child who is weeping over falling leaves. In a well-written essay, analyze how Hopkins uses literary elements and techniques to convey the speaker's complex understanding of the child's grief.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Hopkins turns a gentle question to a weeping child into a revelation of mortality, using the falling leaves of Goldengrove as a symbol and a series of shifts in time, so that the speaker's tenderness toward Margaret is inseparable from his knowledge that her grief is, without her knowing it, for herself.

        Line of reasoning and evidence: (1) Symbol. "Goldengrove unleaving" is both a real grove and an image of everything that falls; the simile "like the things of man" opens the symbolic reading, and "worlds of wanwood leafmeal" enlarges one autumn into the decay of whole worlds. (2) Shifts in time. The poem moves from present grief ("are you grieving") to a predicted colder future ("as the heart grows older"), then to "And yet you wíll weep and know why", where the stressed "wíll" makes future grief a certainty and an act of will, knowledge replacing innocent feeling. (3) Generalisation. "Sórrow's spríngs áre the same" turns the child's tears into an instance of a universal source, and the pun on "springs" (sources and the season) answers the title. (4) Final turn. The last couplet names the "blight man was born for", with "Fall" in the title recalling the Fall of Genesis, and the closing line returns from the universal to the child's own name, "It is Margaret you mourn for", so the poem ends where it began, but transformed.

        Complexity: the speaker both comforts and unsettles. His wisdom is older and sadder than her grief, yet he also suggests that her intuitive tears ("What heart heard of, ghost guessed") grasp a truth that mouth and mind have not yet expressed, so the child's innocence is in a sense wiser than his knowledge.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis about the speaker's complex understanding (for example, tenderness and grim knowledge together; innocent grief as an unwitting recognition of mortality). A thesis that only says the poem is "about death" or lists devices earns 0.

        Row B Evidence and Commentary (0-4): 1 = summary of the poem with general remarks. 2 = relevant evidence (Goldengrove, "like the things of man", "as the heart grows older", the final couplet) with commentary that mostly restates. 3 = specific evidence consistently explained in support of a line of reasoning, showing how at least two techniques (the leaves as symbol, the shifts in time, diction such as "wanwood leafmeal" or the stress on "wíll") convey the speaker's understanding. 4 = all of 3, with commentary that shows how the techniques build the poem's movement from question to revelation and connects every piece of evidence to the thesis.

        Row C Sophistication (0-1): 1 point for a complex understanding, such as the tension between comfort and disillusion in the speaker's address, the double meanings of "springs" and "Fall", the suggestion that the child's intuition ("ghost guessed") already knows what the adult explains, or the way the ending returns to her name. Isolated mentions of a term do not earn the point.
