guide_description: |
  What makes an image a symbol, and how to explain a symbol's function without reducing it to a code. Shifts as
  structure: where poems turn (a stanza break, "At once", a change of tense or addressee) and what the turn does.
  Worked readings of Frost's roads, Yeats's falcon and rough beast, Hardy's thrush and Hopkins's Goldengrove, a
  model Q1 paragraph, misreadings and self-check.
flashcards_description: |
  30 cards on symbol and shift: the key images and turning points of "The Road Not Taken", "The Second Coming",
  "The Darkling Thrush" and "Spring and Fall".

flashcards:
  - front: Symbol vs metaphor → the test for a poem's central image
    back: |
      A metaphor says one thing is another (experience "is an arch"). A symbol is a real thing in the poem's world (two roads, a thrush, a falcon) that also stands for something larger, without the poem saying "is". Remove the symbolic meaning and the literal scene still makes sense; remove a metaphor's vehicle and nothing is left.
    topic_code: "5.C"
  - front: Explaining a symbol's function → the three-step move
    back: |
      1) Name the literal object and what the poem does with it. 2) Say what it suggests, citing details that open that meaning (the thrush is "aged", "frail", yet sings). 3) Explain what the symbolic meaning does for the poem's argument or shift. Never stop at "X symbolises Y".
    topic_code: "5.C"
  - front: The two roads in "The Road Not Taken" → what they symbolise
    back: |
      Choices in life that cannot both be taken ("sorry I could not travel both / And be one traveler"). But the poem insists the roads were alike: "as just as fair", worn "really about the same", both covered in leaves "no step had trodden black". The symbol is of choice itself, not of a bold or unconventional choice.
    topic_code: "5.C"
  - front: '"I took the one less traveled by" → why it is ironic'
    back: |
      Two stanzas earlier the speaker said the roads were worn "really about the same". The final claim is the story he expects to tell "with a sigh / Somewhere ages and ages hence", a tidy myth imposed on an arbitrary choice. The irony is that we make meaning of our choices after the fact.
    topic_code: "5.C"
  - front: '"I shall be telling this with a sigh" → the shift in Frost''s last stanza'
    back: |
      The tense shifts from past to future: the speaker imagines his older self narrating this moment. The sigh is ambiguous (regret? nostalgia? self-satisfaction?), and the dash after "and I" shows him pausing, as if composing the legend. Structure turns a memory into a reflection on memory.
    topic_code: "3.C"
  - front: Frost's title → "The Road Not Taken", not "The Road Less Traveled"
    back: |
      The title points to the road the speaker did not take, the life he will never know. It shifts the poem's weight from triumph to loss and wonder, and supports reading the sigh as wistful rather than proud.
    topic_code: "5.B"
  - front: Form of "The Road Not Taken" → stanza and rhyme
    back: |
      Four five-line stanzas rhymed ABAAB, mostly iambic tetrameter with frequent extra unstressed syllables. The steady pattern gives the poem a calm, reasonable surface, and the one dash ("and I—") is the only visible hesitation.
    topic_code: "3.C"
  - front: The widening gyre → Yeats's opening image
    back: |
      A gyre is a spiralling cone. The falcon circles outward, ever wider, until it can no longer hear the falconer. Yeats used gyres in his private system to picture historical cycles; in the poem the image works on its own as a picture of order spinning apart.
    topic_code: "5.C"
  - front: The falcon and the falconer → symbol in "The Second Coming"
    back: |
      A trained bird that has flown beyond the call of its master: a link between control and the controlled that has snapped. It can be read as humanity losing contact with God, a civilisation with its guiding principles, or authority with those it governs. Its function is to make a vast collapse concrete in a single image.
    topic_code: "5.C"
  - front: '"Things fall apart; the centre cannot hold" → why the syntax matters'
    back: |
      Two short, flat clauses joined by a semicolon, stated as general law, then two more lines beginning with "loosed". The plain declaratives make collapse sound inevitable, and the abstract nouns (anarchy, innocence, conviction) widen the scene from falconry to the whole world.
    topic_code: "3.C"
  - front: '"The ceremony of innocence is drowned" → image and meaning'
    back: |
      Ceremony suggests ritual, order and courtesy; innocence suggests what such rites protect. Both are "drowned" by the "blood-dimmed tide", a flood of violence. The line mourns not just lives but the civil forms that made innocence possible.
    topic_code: "5.D"
  - front: '"The best lack all conviction, while the worst / Are full of passionate intensity" → function'
    back: |
      A chiastic contrast that names the political symptom of collapse: good people paralysed by doubt, fanatics energised. Written in January 1919, after the First World War and amid revolution in Russia and violence in Ireland, it diagnoses an age without fixing it to one event.
    topic_code: "3.D"
  - front: The shift at "Surely some revelation is at hand" → structure of "The Second Coming"
    back: |
      Stanza 1 diagnoses the present in general statements; stanza 2 turns to the speaker's own vision. The repeated "Surely" sounds hopeful, invoking the Christian Second Coming, but the revelation that arrives is a pitiless beast. The structure moves from diagnosis to prophecy and reverses the hope it raises.
    topic_code: "3.C"
  - front: Spiritus Mundi → what Yeats means
    back: |
      Latin, "spirit of the world": Yeats's name for a shared store of images beyond any individual mind. The vision comes from there, which gives it the authority of prophecy rather than private nightmare.
    topic_code: "6.D"
  - front: '"A shape with lion body and the head of a man" → the beast as symbol'
    back: |
      A sphinx-like figure, with a "gaze blank and pitiless as the sun", stirring in the desert. It symbolises the violent, inhuman era that Yeats imagines replacing two thousand years of Christian civilisation. Its blankness is the horror: it has no human feeling to appeal to.
    topic_code: "5.C"
  - front: '"vexed to nightmare by a rocking cradle" → the paradox'
    back: |
      The cradle is Christ's at Bethlehem, the beginning of "twenty centuries" of Christian history. The poem imagines that birth as having disturbed an older, "stony" age into nightmare, and now a new birth reverses it. A cradle, image of innocence, becomes a source of terror.
    topic_code: "6.D"
  - front: '"what rough beast ... Slouches towards Bethlehem to be born?" → ending on a question'
    back: |
      Bethlehem, birthplace of Christ, becomes the birthplace of the beast: an inverted nativity. "Slouches" is ungainly and slow, and the question mark means the speaker knows the hour has come but not what is coming. The structure ends on dread, not resolution.
    topic_code: "3.C"
  - front: The 1920 text of "The Second Coming" → which wording
    back: |
      This course quotes the first book printing (Cuala Press, 1920, in *Michael Robartes and the Dancer*): "Troubles my sight: a waste of desert sand;" and "Wind shadows of the indignant desert birds." Later collected editions read differently in those two lines.
    topic_code: "5.B"
  - front: '"The Century''s corpse outleant" → Hardy''s central metaphor'
    back: |
      The winter landscape is the corpse of the nineteenth century laid out, with "the cloudy canopy" as its crypt and "the wind his death-lament". Dated December 1900, the poem makes the last days of the century a funeral and the speaker one of its mourners.
    topic_code: "6.B"
  - front: '"When Frost was spectre-gray" → personification in Hardy'
    back: |
      Frost is capitalised and made a ghost; Winter has "dregs", and day a "weakening eye". The personified landscape is dying or already dead, which is why the bird's song, when it comes, is so startling.
    topic_code: "6.C"
  - front: '"At once a voice outburst among / The bleak twigs" → the shift in "The Darkling Thrush"'
    back: |
      The third stanza turns abruptly from the dead landscape to sound. "At once" marks the volta; "outburst" (the 1901 wording) makes the song an eruption. The structure is two stanzas of desolation, two of song and reflection, so the turn sits at the poem's exact centre.
    topic_code: "3.C"
  - front: The thrush → what kind of symbol Hardy makes it
    back: |
      "An aged thrush, frail, gaunt, and small", hardly a triumphant herald. It flings its soul "Upon the growing gloom" for no visible cause. It symbolises hope that persists without evidence, and its frailty keeps the symbol honest: hope is small and old, but it sings.
    topic_code: "5.C"
  - front: '"Some blessed Hope, whereof he knew / And I was unaware" → the ending''s tone'
    back: |
      Tentative. The speaker only "could think" there was such hope; he does not share it. The capitalised Hope belongs to the bird. The poem ends on a gap between the bird's knowledge and the speaker's unbelief, which is more moving than a conversion would be.
    topic_code: "4.C"
  - front: '"Had chosen thus to fling his soul" → diction'
    back: |
      "Chosen" gives the bird will; "fling" is reckless and generous; "soul" makes a bird's song a spiritual act. The diction prepares the speaker's guess that the bird knows a hope he does not.
    topic_code: "5.B"
  - front: Margaret and Goldengrove → the situation in "Spring and Fall"
    back: |
      A speaker addresses a young child, Margaret, who is weeping because the trees of a grove (Goldengrove) are losing their leaves ("unleaving"). He tells her that as she grows older she will weep less at such sights, but that what she is really grieving is human mortality, her own.
    topic_code: "4.A"
  - front: Falling leaves in "Spring and Fall" → symbol
    back: |
      The leaves are "like the things of man": what falls in autumn stands for everything human that dies. The child's spontaneous grief for the trees is, the speaker says, grief for herself: "It is Margaret you mourn for."
    topic_code: "5.C"
  - front: '"the blight man was born for" → allusion and symbol'
    back: |
      Blight is plant disease, linking people to the dying grove. The title's "Fall" is both autumn and the Fall of Genesis, after which death entered the world. Mortality is the blight every human is born into.
    topic_code: "6.D"
  - front: '"wanwood leafmeal" → Hopkins''s coinages'
    back: |
      "Wanwood" (pale, bloodless wood) and "leafmeal" (leaf by leaf, as in "piecemeal", and leaves ground to meal) are invented compounds. They compress the slow decay of whole forests ("worlds") into two dense words.
    topic_code: "5.B"
  - front: The shift in "Spring and Fall" → present grief to future knowledge
    back: |
      The poem moves from the child's present ("are you grieving") to her colder future ("as the heart grows older"), then to "And yet you will weep and know why", and finally to the general truth that "Sorrow's springs are the same." The shift turns comfort into revelation.
    topic_code: "3.C"
  - front: Stress marks in the 1918 Hopkins text → why "Márgarét, áre you gríeving"
    back: |
      Hopkins marked stresses to guide his sprung rhythm, where a line is measured by its stressed syllables. The marks slow the address to the child and give "will" in "you wíll weep" the force of determination, not mere futurity.
    topic_code: "5.B"

quiz:
  description: |
    22 questions · about 45 minutes · passage sets on "The Second Coming", the second half of "The Darkling Thrush"
    and "The Road Not Taken", then items on "Spring and Fall" and a Q1-style essay; about 60% this week's skills
    (symbol, structure and shift) and 40% review (imagery, metaphor, allusion, diction, contrast, thesis and
    commentary). Multiple choice, select-all and true/false are graded at once and the fill-in-the-blank items are
    matched automatically; the short answers and the essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Passage set A: "The Second Coming"
    - slug: u08-w26-q01
      type: multiple_choice
      topic_code: "5.C"
      source: 'W. B. Yeats, "The Second Coming" (1920)'
      points: 1
      stimulus: &secondComing |
        *The following poem by W. B. Yeats was first published in 1920. The text is that of its first book printing (Cuala Press, 1920).*

        THE SECOND COMING

        Turning and turning in the widening gyre
        The falcon cannot hear the falconer;
        Things fall apart; the centre cannot hold;
        Mere anarchy is loosed upon the world,
        The blood-dimmed tide is loosed, and everywhere   [5]
        The ceremony of innocence is drowned;
        The best lack all conviction, while the worst
        Are full of passionate intensity.

        Surely some revelation is at hand;
        Surely the Second Coming is at hand.   [10]
        The Second Coming! Hardly are those words out
        When a vast image out of Spiritus Mundi
        Troubles my sight: a waste of desert sand;
        A shape with lion body and the head of a man,
        A gaze blank and pitiless as the sun,   [15]
        Is moving its slow thighs, while all about it
        Wind shadows of the indignant desert birds.
        The darkness drops again but now I know
        That twenty centuries of stony sleep
        Were vexed to nightmare by a rocking cradle,   [20]
        And what rough beast, its hour come round at last,
        Slouches towards Bethlehem to be born?
      prompt: |
        In the context of the first stanza, the falcon that "cannot hear the falconer" (line 2) is best understood as a symbol of
      options:
        - "the speaker's longing to escape the city for the countryside"
        - "a world that has spun beyond the reach of whatever authority or principle once held it together"
        - "the freedom the speaker hopes the coming age will bring"
        - "the hunting customs of a vanished aristocracy that the speaker regrets"
      option_explanations:
        - "Nothing in the stanza concerns city and country. The falcon image leads at once to 'Things fall apart' and 'anarchy', a collapse of order, not a pastoral escape."
        - "Correct. A trained bird beyond its master's call is a link between controller and controlled that has broken. The following lines generalise the image ('the centre cannot hold'), which shows the falcon standing for the whole world's loss of a governing centre."
        - "The tone is dread, not hope: the stanza describes 'Mere anarchy' and a 'blood-dimmed tide'. The falcon's freedom is presented as disintegration."
        - "Falconry supplies the literal image, but the poem does not lament a lost sport or class; the image immediately widens to 'the world'."
      answer: 1
    - slug: u08-w26-q02
      type: multiple_choice
      topic_code: "3.C"
      source: 'W. B. Yeats, "The Second Coming" (1920)'
      points: 1
      stimulus: *secondComing
      prompt: |
        Which best describes the relationship between the poem's two stanzas?
      options:
        - "The first narrates a past event; the second explains its causes."
        - "The first diagnoses the present disorder in general statements; the second turns to the speaker's own prophetic vision of what that disorder announces."
        - "The first presents the speaker's hope; the second presents the hope fulfilled."
        - "The first describes a dream; the second describes the speaker waking from it into a calm reality."
      option_explanations:
        - "The first stanza is in the present tense ('cannot hold', 'is loosed'); it diagnoses an ongoing condition rather than narrating a past event, and the second stanza offers a vision, not causes."
        - "Correct. Stanza 1 is impersonal and general ('Things fall apart'); stanza 2 begins with 'Surely' and shifts into the first person ('Troubles my sight', 'now I know'), moving from diagnosis to revelation."
        - "Stanza 1 expresses dread, not hope, and the 'revelation' in stanza 2 is a 'rough beast', the reverse of a hoped-for Second Coming."
        - "The darkness 'drops again', but the speaker does not wake into calm; he wakes into knowledge ('now I know') and a terrifying question."
      answer: 1
    - slug: u08-w26-q03
      type: multiple_choice
      topic_code: "5.D"
      source: 'W. B. Yeats, "The Second Coming" (1920)'
      points: 1
      stimulus: *secondComing
      prompt: |
        The image of "The blood-dimmed tide" that drowns "The ceremony of innocence" (lines 5-6) primarily conveys
      options:
        - "violence rising like a flood to overwhelm the rituals and decencies that once protected the innocent"
        - "a natural disaster that the speaker witnessed on the coast"
        - "the speaker's guilt over a crime he has committed"
        - "the cleansing power of the sea to wash away an old civilisation's sins"
      option_explanations:
        - "Correct. 'Blood-dimmed' makes the tide one of violence, and 'loosed' echoes the anarchy of line 4. 'Drowned' completes the flood image: ceremony, the forms of civilised life, goes under with the innocence it guarded."
        - "The language is figurative; the tide is 'blood-dimmed' and it drowns abstractions ('ceremony', 'innocence'), not coastal towns."
        - "There is no 'I' in the first stanza, and no personal guilt is expressed; the image is public and general."
        - "A tide darkened with blood that drowns innocence is destructive, not cleansing; nothing in the stanza welcomes it."
      answer: 0
    - slug: u08-w26-q04
      type: multiple_choice
      topic_code: "5.C"
      source: 'W. B. Yeats, "The Second Coming" (1920)'
      points: 1
      stimulus: *secondComing
      prompt: |
        The "rough beast" that "Slouches towards Bethlehem to be born" (lines 21-22) functions as a symbol chiefly by
      options:
        - "representing the speaker's personal fear of wild animals"
        - "inverting the Nativity: the birthplace of Christ becomes the birthplace of a pitiless new age"
        - "promising that Christ will return to restore order"
        - "showing that the desert birds have driven the beast out of its home"
      option_explanations:
        - "The beast comes from 'Spiritus Mundi', a world-vision, and its birth ends 'twenty centuries'; it is historical and spiritual, not a private phobia."
        - "Correct. The poem raises the hope of 'the Second Coming' and then answers it with a beast whose gaze is 'blank and pitiless'. Sending it to Bethlehem turns the story of Christ's birth inside out and makes the new era a monstrous nativity."
        - "The poem's revelation reverses that promise; what is 'at hand' is not Christ but a 'rough beast'."
        - "The 'indignant desert birds' wheel around the shape; they do not drive it anywhere. Its movement towards Bethlehem is its 'hour come round at last'."
      answer: 1
    - slug: u08-w26-q05
      type: multiple_choice
      topic_code: "6.D"
      source: 'W. B. Yeats, "The Second Coming" (1920)'
      points: 1
      stimulus: *secondComing
      prompt: |
        The allusion in the title and in lines 9-11 to the Christian belief in "the Second Coming" primarily serves to
      options:
        - "assure the reader that the disorder of stanza 1 will soon be put right"
        - "establish an expectation of redemption that the vision then grimly reverses"
        - "show that the speaker rejects all religious language as meaningless"
        - "identify the speaker as a priest addressing his congregation"
      option_explanations:
        - "The allusion raises that hope, but the poem withholds it: the vision that follows is of a 'rough beast', not a saviour."
        - "Correct. 'Surely' repeated sounds like faith, and 'The Second Coming!' like an announcement. The allusion sets up redemption so that the sphinx-like beast can overturn it, making the ending more terrible."
        - "The speaker uses religious language with full seriousness; the poem depends on the power of 'Bethlehem' and 'cradle'. It reverses a belief rather than dismissing religious language."
        - "No congregation is addressed; the speaker reports a private vision ('Troubles my sight')."
      answer: 1
    - slug: u08-w26-q06
      type: true_false
      topic_code: "3.C"
      source: 'W. B. Yeats, "The Second Coming" (1920)'
      points: 1
      stimulus: *secondComing
      prompt: |
        True or false: The poem ends with a question, which leaves the nature of the coming age unresolved even as the speaker claims "now I know" that its hour has come.
      answer: true
      explanation: |
        True. The final sentence, from "And what rough beast" to "to be born?", is a question. The speaker knows that the old era is ending (line 18) but not what the beast is, and ending on the question gives the poem's structure its open, menacing close.
    - slug: u08-w26-q07
      type: multi_select
      topic_code: "3.C"
      source: 'W. B. Yeats, "The Second Coming" (1920)'
      points: 2
      partial_credit: true
      stimulus: *secondComing
      prompt: |
        Which of the following help mark the poem's shift from the general diagnosis of the first stanza to the personal vision of the second? Select all that apply.
      options:
        - "The anaphora of \"Surely\" in lines 9-10"
        - "The exclamation \"The Second Coming!\" in line 11"
        - "The first-person phrases \"Troubles my sight\" and \"now I know\""
        - "The semicolons in line 3"
      option_explanations:
        - "Correct. The repeated 'Surely' opens the second stanza with a new voice of expectation, turning from description to anticipation."
        - "Correct. The exclamation is the moment the words summon the vision ('Hardly are those words out'); it is the hinge of the turn."
        - "Correct. The first stanza never says 'I'; the second places the vision in the speaker's own sight and knowledge, which is the shift from public diagnosis to private revelation."
        - "Line 3 belongs to the first stanza's diagnosis; its semicolons make the collapse sound like law but do not mark the turn."
      answer: [0, 1, 2]
    # ---- Passage set B: "The Darkling Thrush", stanzas 2-4
    - slug: u08-w26-q08
      type: multiple_choice
      topic_code: "6.B"
      source: 'Thomas Hardy, "The Darkling Thrush" (1900)'
      points: 1
      stimulus: &thrush |
        *The following passage is the second, third and fourth stanzas of Thomas Hardy's "The Darkling Thrush," dated December 1900 (text of* Poems of the Past and the Present, *1901). In the first stanza the speaker leans on a gate in a frozen winter landscape at dusk, alone, since "all mankind" has gone indoors. Line numbers are those of the whole poem.*

        The land's sharp features seemed to be
        The Century's corpse outleant,   [10]
        His crypt the cloudy canopy,
        The wind his death-lament.
        The ancient pulse of germ and birth
        Was shrunken hard and dry,
        And every spirit upon earth   [15]
        Seemed fervourless as I.

        At once a voice outburst among
        The bleak twigs overhead
        In a full-hearted evensong
        Of joy illimited;   [20]
        An aged thrush, frail, gaunt, and small,
        In blast-beruffled plume,
        Had chosen thus to fling his soul
        Upon the growing gloom.

        So little cause for carollings   [25]
        Of such ecstatic sound
        Was written on terrestrial things
        Afar or nigh around,
        That I could think there trembled through
        His happy good-night air   [30]
        Some blessed Hope, whereof he knew
        And I was unaware.

        December 1900.
      prompt: |
        In lines 9-12, the metaphor of the landscape as "The Century's corpse outleant" primarily serves to
      options:
        - "present the end of the nineteenth century as a death, so that the winter scene becomes a funeral the speaker attends"
        - "show that the speaker has discovered a real body lying in the field"
        - "celebrate the century's achievements before it passes"
        - "suggest that the speaker is relieved the old century is ending"
      option_explanations:
        - "Correct. The 'sharp features' of the land become a corpse laid out, with the clouds as its 'crypt' and the wind as its 'death-lament'. Coming at the turn of the century (the poem is dated December 1900), the metaphor turns weather into mourning."
        - "The verb 'seemed to be' signals a figurative comparison; the corpse is the century itself, not a literal body."
        - "Nothing is celebrated; the stanza is all funeral imagery, and 'every spirit upon earth' is 'fervourless'."
        - "Relief would require some sign of welcome. The speaker shares the dead mood ('fervourless as I'), which is the opposite of relief."
      answer: 0
    - slug: u08-w26-q09
      type: multiple_choice
      topic_code: "3.C"
      source: 'Thomas Hardy, "The Darkling Thrush" (1900)'
      points: 1
      stimulus: *thrush
      prompt: |
        The phrase "At once" at the start of line 17 functions primarily to
      options:
        - "show that the speaker has been waiting impatiently for the bird to sing"
        - "mark the poem's turn from a landscape of death to a sudden, unexpected sound of joy"
        - "indicate that the speaker immediately understands the meaning of the song"
        - "signal that the bird and the speaker begin to sing together"
      option_explanations:
        - "Nothing suggests waiting; the song is surprising precisely because the speaker expected nothing ('every spirit upon earth / Seemed fervourless')."
        - "Correct. 'At once' opens the third stanza, exactly halfway through the poem's four, and breaks the funeral mood with 'a voice'. The structure sets two stanzas of desolation against two of song and reflection."
        - "The speaker never claims understanding; the final stanza says only that he 'could think' there was a Hope 'whereof he knew / And I was unaware'."
        - "Only the thrush sings. The speaker listens and reflects; his voice is not joined to the bird's."
      answer: 1
    - slug: u08-w26-q10
      type: multiple_choice
      topic_code: "5.C"
      source: 'Thomas Hardy, "The Darkling Thrush" (1900)'
      points: 1
      stimulus: *thrush
      prompt: |
        Which best describes the function of the thrush as a symbol in the passage?
      options:
        - "It represents the speaker's confidence that the new century will be better."
        - "It embodies a hope that persists without visible cause, and its age and frailty keep that hope from seeming easy or triumphant."
        - "It symbolises the cruelty of nature, which sings while humans suffer."
        - "It stands for the poet's own art, which he believes can save the century."
      option_explanations:
        - "The speaker explicitly lacks that confidence: the Hope is one 'whereof he knew / And I was unaware'."
        - "Correct. The bird is 'aged', 'frail, gaunt, and small' and 'blast-beruffled', yet flings 'his soul / Upon the growing gloom'. That combination makes it a symbol of hope against the evidence, and an honest one: hope here is small and old, not heroic."
        - "The song is called 'full-hearted' and 'happy', and the speaker associates it with 'Some blessed Hope'. Nothing presents the bird as cruel or indifferent."
        - "The poem never connects the bird to the speaker's poetry; the gap between bird and speaker is the point of the ending."
      answer: 1
    - slug: u08-w26-q11
      type: multiple_choice
      topic_code: "4.C"
      source: 'Thomas Hardy, "The Darkling Thrush" (1900)'
      points: 1
      stimulus: *thrush
      prompt: |
        The speaker's attitude in the final stanza (lines 25-32) is best described as
      options:
        - "joyful conversion to the bird's faith"
        - "bitter mockery of the bird's ignorance"
        - "tentative, wondering openness to a hope he cannot himself feel"
        - "complete indifference to the song"
      option_explanations:
        - "The speaker says he 'could think' there was hope and that he was 'unaware' of it; he is moved, not converted."
        - "There is no mockery; the song is 'ecstatic', its air 'happy', the Hope 'blessed'. The speaker's tone is respectful."
        - "Correct. The conditional 'could think', the verb 'trembled', and the closing contrast between what the bird 'knew' and what the speaker was 'unaware' of show a mind touched by a possibility it cannot confirm."
        - "A whole stanza of reflection on the song's meaning is the opposite of indifference."
