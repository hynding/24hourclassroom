    - slug: u08-w27-q23
      type: long_answer
      topic_code: "7.E"
      source: 'Wilfred Owen, "Dulce et Decorum Est" (1920); Claude McKay, "If We Must Die" (1919)'
      points: 6
      stimulus: |
        *Poem 1 is the close of Wilfred Owen's "Dulce et Decorum Est" (*Poems*, 1920); the soldier described has just died in a gas attack. Poem 2 is Claude McKay's sonnet "If We Must Die" (1919; text of* Harlem Shadows, *1922).*

        **Poem 1**

        In all my dreams before my helpless sight
        He plunges at me, guttering, choking, drowning.

        If in some smothering dreams, you too could pace
        Behind the wagon that we flung him in,
        And watch the white eyes writhing in his face,
        His hanging face, like a devil's sick of sin,
        If you could hear, at every jolt, the blood
        Come gargling from the froth-corrupted lungs
        Bitter as the cud
        Of vile, incurable sores on innocent tongues,—
        My friend, you would not tell with such high zest
        To children ardent for some desperate glory,
        The old Lie: Dulce et decorum est
        Pro patria mori.

        **Poem 2**

        If we must die, let it not be like hogs
        Hunted and penned in an inglorious spot,
        While round us bark the mad and hungry dogs,
        Making their mock at our accursèd lot.
        If we must die, O let us nobly die,
        So that our precious blood may not be shed
        In vain; then even the monsters we defy
        Shall be constrained to honor us though dead!
        O kinsmen! we must meet the common foe!
        Though far outnumbered let us show us brave,
        And for their thousand blows deal one death-blow!
        What though before us lies the open grave?
        Like men we'll face the murderous, cowardly pack,
        Pressed to the wall, dying, but fighting back!
      prompt: |
        Read carefully the following two poems, written within a year of each other. In Poem 1, Wilfred Owen's speaker addresses those who teach the young that dying for one's country is glorious; in Poem 2, Claude McKay's speaker addresses a community under violent attack. In a well-written essay, compare and contrast how the two poets use literary elements and techniques to convey their speakers' attitudes toward the idea of a noble death.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Both poets refuse the image of death as degradation, but they arrive at opposite conclusions about nobility: Owen's graphic, conditional witness exposes "noble death" for one's country as a lie told to children, while McKay's disciplined sonnet claims nobility as the one thing the oppressed can still choose, redefining it as resistance rather than sacrifice.

        Line of reasoning (point by point): (1) Imagery of the body. Owen forces the reader to "watch the white eyes writhing" and "hear ... the blood / Come gargling", so death is physical, ugly and meaningless; McKay barely describes bodies, speaking of "precious blood" that must not be shed "In vain", so death is measured by its meaning. (2) Metaphor and animal comparison. Owen's soldier is "like a devil's sick of sin" and "guttering" like a candle, comparisons of corruption and extinction; McKay rejects dying "like hogs" and turns the attackers into "mad and hungry dogs" and a "cowardly pack", so that his people die "Like men". (3) Address and structure. Owen's long "If ... you" sentence culminates in an accusation of "My friend" and ends on a fragment of Latin, "The old Lie", a collapse of the ideal; McKay's octave-sestet turn ("O kinsmen!") moves from condition to command and ends in a rhymed couplet of defiance. (4) Context of "glory". Owen attacks glory taught to "children ardent for some desperate glory" by those far from the front; McKay seeks honour that even "the monsters we defy / Shall be constrained" to grant.

        Complexity: the poems are not simply anti-war and pro-war. Both reject a death imposed by others; Owen denies that the state can make such a death sweet, McKay insists that the victims can make it meaningful. A strong essay may note that McKay's controlled form embodies the dignity he claims, while Owen's broken form embodies the dignity war destroys.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis that addresses BOTH poems and makes a comparative claim about the speakers' attitudes toward noble death (for example, Owen rejects the ideal while McKay redefines it). A thesis that treats only one poem, or only says the poems are "similar and different", earns 0.

        Row B Evidence and Commentary (0-4): 1 = summary of each poem with little comparison. 2 = relevant evidence from both poems with commentary that mostly describes each separately or restates. 3 = specific evidence from both poems consistently tied to a comparative line of reasoning; commentary explains how at least two techniques (for example, bodily imagery, animal metaphor, address, structure or the volta) convey each attitude, with some uneven links. 4 = all of 3, with commentary that keeps the comparison active in every paragraph and explains why the poets' choices produce different attitudes toward the same idea.

        Row C Sophistication (0-1): 1 point for a complex comparison, such as recognising that both poems reject death imposed by others while disagreeing about whether it can be redeemed; relating each poem's form to its argument (Owen's collapsing structure, McKay's disciplined sonnet); situating the poems in their contexts (a 1917-18 trench, the 1919 mob attacks) to explain the difference; or a consistently vivid, controlled style (7.E). The point is not earned by a sentence of context or praise.
