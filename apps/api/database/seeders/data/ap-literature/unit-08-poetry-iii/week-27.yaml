    - slug: u08-w27-q18
      type: short_answer
      topic_code: "3.C"
      source: 'Claude McKay, "If We Must Die" (1919)'
      points: 2
      stimulus: *mckay
      prompt: |
        In two or three sentences, explain the function of the shift at line 9 ("O kinsmen! we must meet the common foe!").
      answer: |
        Lines 1-8 are a conditional meditation ("If we must die") on how death can keep its dignity; line 9 turns to direct address and command, gathering the "kinsmen" into a community that must act. The shift converts a resolve about dying into a call to fight, so the sestet's exclamations and closing couplet ("dying, but fighting back") deliver the action the octave argued for.
      explanation: |
        1 point: describes the shift accurately (from conditional reflection to direct address/command; from how to die to what to do; octave to sestet). 1 point: explains its function (it turns argument into rallying cry; it creates community through "kinsmen"; it prepares the defiant final couplet). Answers that only label the shift ("this is the volta") earn 0.
