guide_description: |
  Metaphor as argument in four poems of violence, witness and loss: Owen's gas attack, McKay's sonnet of
  resistance, Millay's winter tree and Hardy's ship and iceberg. Then the poetry essay at full length: controlling
  a Q1 response (embedding quotations, precise verbs, transitions), and how to plan and write a paired-poem
  comparison. Model paragraphs, misreadings, self-check.
flashcards_description: |
  30 cards on the metaphors and contexts of Owen, McKay, Millay and Hardy's Titanic poem, and on the composition
  moves (7.E) that make a poetry essay read clearly.

flashcards:
  - front: '"Dulce et decorum est / Pro patria mori" → source and meaning'
    back: |
      From the Roman poet Horace (Odes III.2): "It is sweet and fitting to die for one's country." Owen ends his poem by calling the line "The old Lie", turning a classical commonplace of patriotic schooling into the poem's target.
    topic_code: "6.D"
  - front: Wilfred Owen → when he wrote and when he was published
    back: |
      An English infantry officer who wrote most of his major poems in 1917-1918, after being treated for shell shock at Craiglockhart, where he met Siegfried Sassoon. He was killed in action on 4 November 1918, a week before the Armistice. Sassoon assembled his *Poems* (1920).
    topic_code: "7.E"
  - front: '"Bent double, like old beggars under sacks" → what the opening simile does'
    back: |
      It strips soldiers of every heroic image before the poem begins: young men become bent old beggars and, in the next line, coughing "hags". The poem's argument against glory starts in its first comparison.
    topic_code: "6.B"
  - front: '"I saw him drowning" → the central metaphor of Owen''s gas attack'
    back: |
      Through "misty panes" (gas-mask lenses) and "thick green light", the gas becomes a sea and the soldier drowns on dry land. The metaphor makes an unfamiliar chemical death imaginable, and "drowning" returns as the rhyme word of the haunting two-line stanza.
    topic_code: "6.B"
  - front: '"He plunges at me, guttering, choking, drowning" → why the present tense'
    back: |
      The short stanza moves from the past of the attack to the present of the speaker's dreams: "In all my dreams". The man is still dying every night. "Guttering" compares him to a candle flame sputtering out, a metaphor of a life burning down.
    topic_code: "6.B"
  - front: '"The old Lie" → why capitalise it'
    back: |
      The capital turns a slogan into a proper noun, an institution, something taught and handed down ("old"). Calling it a Lie, not a mistake, accuses the people who teach it to "children ardent for some desperate glory".
    topic_code: "6.B"
  - front: '"My friend" in "Dulce et Decorum Est" → tone'
    back: |
      Bitterly ironic. The addressee is anyone who repeats the patriotic line to the young; a draft of the poem was addressed to Jessie Pope, a writer of recruiting verse. The polite address barely contains the speaker's anger.
    topic_code: "4.C"
  - front: 1920 text of "Dulce et Decorum Est" → two readings to know
    back: |
      The 1920 *Poems* (the Gutenberg text) reads "Of gas-shells dropping softly behind" in line 8 and has the short line "Bitter as the cud" in the last stanza. Many modern editions print later readings from Owen's manuscripts ("Five-Nines", "Obscene as cancer"). Quote the edition in front of you.
    topic_code: "7.E"
  - front: Owen's structure → a broken sonnet
    back: |
      The first fourteen lines are two stanzas of alternately rhymed pentameter, like a sonnet; then the poem breaks into a two-line stanza and a long final stanza that ends in a short Latin line. The form starts in order and collapses, as the men do.
    topic_code: "3.C"
  - front: '"If We Must Die" → when and why McKay wrote it'
    back: |
      Published in *The Liberator* in July 1919, during the "Red Summer" of white mob violence against Black communities in American cities. McKay, a Jamaican-born poet in New York, collected it in *Harlem Shadows* (1922).
    topic_code: "6.B"
  - front: '"let it not be like hogs / Hunted and penned" → McKay''s metaphor'
    back: |
      The attackers would make their victims animals to be slaughtered; the speaker refuses the role. The hogs metaphor names the dehumanisation, and the "mad and hungry dogs" turn the metaphor around: the mob is the animal.
    topic_code: "6.B"
  - front: '"the murderous, cowardly pack" → how McKay closes the animal metaphor'
    back: |
      The final couplet returns to the dogs as a "pack", now explicitly "murderous" and "cowardly", while the speaker's people are "men". The metaphor has been reversed: the hunted become human and the hunters become beasts.
    topic_code: "6.B"
  - front: '"O kinsmen! we must meet the common foe!" → the turn in McKay''s sonnet'
    back: |
      Line 9 shifts from the conditional "If we must die" to direct address and command. The octave debates how to die; the sestet calls to action. The Shakespearean rhyme scheme ends in a couplet that lands like a blow.
    topic_code: "3.C"
  - front: The sonnet as a form for resistance → McKay's choice
    back: |
      McKay pours rage into the most traditional English form, rhymed and metrically strict. The control is part of the argument: dignity and discipline answer the mob's "mad and hungry" disorder. Form enacts "Like men we'll face".
    topic_code: "3.C"
  - front: '"What lips my lips have kissed" → form and argument'
    back: |
      A Petrarchan sonnet (octave and sestet) from *The Harp-Weaver and Other Poems* (1923). The octave hears the rain "full of ghosts" of forgotten lovers; the sestet turns to the image of a winter tree. Memory fails, but the feeling of loss does not.
    topic_code: "6.B"
  - front: '"the rain / Is full of ghosts to-night" → Millay''s metaphor'
    back: |
      The rain becomes ghosts that "tap and sigh / Upon the glass and listen for reply". The metaphor turns a sound on a window into the presence of forgotten lovers, so that what the mind has lost the senses still feel.
    topic_code: "6.B"
  - front: '"Thus in the winter stands the lonely tree" → Millay''s extended comparison'
    back: |
      The sestet makes the speaker a tree in winter that does not know "what birds have vanished one by one", yet knows "its boughs more silent than before". The tree compresses the poem's paradox: she cannot remember who, only that something is gone.
    topic_code: "6.B"
  - front: '"summer sang in me / A little while, that in me sings no more" → the final metaphor'
    back: |
      Youth and love are a summer that sang inside her, now silent. The closing metaphor merges the tree's birdsong with the speaker's own past, and the plain final phrase "sings no more" makes the loss quiet and absolute.
    topic_code: "6.B"
  - front: '"The Convergence of the Twain" → occasion'
    back: |
      Written in 1912 after the RMS *Titanic* sank on 15 April 1912 on its maiden voyage; subtitled "Lines on the loss of the 'Titanic'". Hardy read the disaster not as accident but as fate punishing human vanity. Collected in *Satires of Circumstance* (1914).
    topic_code: "6.D"
  - front: The Immanent Will → Hardy's force behind events
    back: |
      Hardy's name for the blind, impersonal power that "stirs and urges everything". It is not a loving God; it simply arranges things. In the poem it prepares the iceberg as the ship's "sinister mate".
    topic_code: "5.B"
  - front: Ship and iceberg as a marriage → Hardy's extended metaphor
    back: |
      The iceberg is "a sinister mate", their meeting the "intimate welding of their later history", the two "twin halves of one august event", the collision a "consummation" that "jars two hemispheres". A wedding metaphor for a catastrophe makes the disaster look destined, almost desired.
    topic_code: "6.B"
  - front: '"the Pride of Life that planned her" → allusion'
    back: |
      An echo of the New Testament (1 John 2:16: "the lust of the flesh, and the lust of the eyes, and the pride of life"). Capitalised, it names the human vanity that designed the ship, which the poem shows lying "Deep from human vanity" on the sea floor.
    topic_code: "6.D"
  - front: Stanzas I-V vs VI-XI in "The Convergence of the Twain"
    back: |
      The first five stanzas show the wreck on the sea floor now: mirrors, jewels, the sea-worm, the "moon-eyed fishes". "Well:" at stanza VI turns back in time to the ship being built while the iceberg grew. Structure moves from aftermath to cause, so the ending is the collision itself.
    topic_code: "3.C"
  - front: '"The sea-worm crawls—grotesque, slimed, dumb, indifferent" → contrast'
    back: |
      Mirrors meant "To glass the opulent" now reflect a sea-worm. The heaped adjectives make the creature as ugly and unmoved as the luxury was proud. Contrast between purpose and present use is the satire.
    topic_code: "3.D"
  - front: The Spinner of the Years → whose voice says "Now!"
    back: |
      A figure of fate, recalling the Fates of Greek myth, one of whom spins the thread of each life. One word from it and "consummation comes". The single syllable makes a year of shipbuilding and iceberg growth end in an instant.
    topic_code: "6.D"
  - front: Embedding a quotation → the 7.E rule of thumb
    back: |
      Make the quotation part of your own grammatical sentence and keep it short: Owen calls patriotic verse "The old Lie," capitalising it as if it were an institution. Avoid dropping a quotation in as its own sentence with no lead-in.
    topic_code: "7.E"
  - front: Quoting verse in an essay → slashes, brackets and ellipses
    back: |
      Mark line breaks with a slash and spaces ("Thus in the winter stands the lonely tree, / Nor knows what birds have vanished"). Use [brackets] for words you add or change, and an ellipsis (...) for words you omit. Never alter a quotation silently.
    topic_code: "7.E"
  - front: Precise verbs for commentary → better than "shows"
    back: |
      Choose a verb that says what the device does: Hardy's wedding metaphor *dignifies* the collision; Owen's drowning image *makes unfamiliar suffering imaginable*; McKay's couplet *reverses* the animal metaphor. "Shows" and "uses" make every sentence sound the same.
    topic_code: "7.E"
  - front: Paired-poem essay → two ways to organise it
    back: |
      Point by point (each body paragraph compares both poems on one idea or technique) or block with bridges (one poem, then the other, with explicit comparison throughout the second). Point by point is usually stronger in timed writing because it keeps the comparison visible in every paragraph.
    topic_code: "7.E"
  - front: Literary present tense → in every AP essay
    back: |
      Write about what happens in a text in the present tense: Owen *describes* the gas attack; the speaker *addresses* "My friend". Use the past only for historical facts outside the text (Owen *died* in 1918).
    topic_code: "7.E"

quiz:
  description: |
    23 questions · about 60 minutes · passage sets on the second half of "Dulce et Decorum Est", the second half of
    "The Convergence of the Twain", Millay's sonnet and McKay's "If We Must Die", then composition items and a
    paired-poem comparison essay; about half the items are this week's skills (metaphor, control of composition)
    and half review (structure, contrast, allusion, imagery, diction, the speaker's attitude). Multiple choice,
    select-all and true/false are graded at once and the fill-in-the-blank items are matched automatically; the
    short answers and the essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Passage set A: "Dulce et Decorum Est", lines 9-28
    - slug: u08-w27-q01
      type: multiple_choice
      topic_code: "6.B"
      source: 'Wilfred Owen, "Dulce et Decorum Est" (1920)'
      points: 1
      stimulus: &dulce |
        *The following passage is the second half of Wilfred Owen's "Dulce et Decorum Est," from his* Poems *(1920). In the first stanza, exhausted soldiers trudge away from the front line toward rest. Line numbers are those of the whole poem.*

        Gas! GAS! Quick, boys!—An ecstasy of fumbling
        Fitting the clumsy helmets just in time,   [10]
        But someone still was yelling out and stumbling
        And flound'ring like a man in fire or lime.—
        Dim through the misty panes and thick green light,
        As under a green sea, I saw him drowning.

        In all my dreams before my helpless sight   [15]
        He plunges at me, guttering, choking, drowning.

        If in some smothering dreams, you too could pace
        Behind the wagon that we flung him in,
        And watch the white eyes writhing in his face,
        His hanging face, like a devil's sick of sin,   [20]
        If you could hear, at every jolt, the blood
        Come gargling from the froth-corrupted lungs
        Bitter as the cud
        Of vile, incurable sores on innocent tongues,—
        My friend, you would not tell with such high zest   [25]
        To children ardent for some desperate glory,
        The old Lie: Dulce et decorum est
        Pro patria mori.
      prompt: |
        The figurative "drowning" in lines 13-14, which returns in line 16, primarily serves to
      options:
        - "suggest that the soldier fell into a flooded shell-hole after the attack"
        - "make an unfamiliar death by gas imaginable by comparing the green cloud to a sea in which the man suffocates on dry land"
        - "show that the speaker regards the soldier's death as peaceful"
        - "indicate that the attack took place during a storm at sea"
      option_explanations:
        - "The 'misty panes' are the lenses of the speaker's gas mask and the 'thick green light' is the gas cloud; the sea is figurative, introduced by 'As under'. Reading a literal flood misses the comparison."
        - "Correct. Gas fills the lungs as water does, so the green light becomes a 'green sea' and the man 'drowning' in air. The metaphor translates a new kind of death into one every reader can feel, and its return in the dream stanza shows it has never stopped."
        - "The verbs around the image ('yelling', 'stumbling', 'flound'ring', 'choking') are violent; nothing about the death is peaceful."
        - "The setting is the trenches, with helmets and a wagon; the sea exists only in the speaker's comparison."
      answer: 1
    - slug: u08-w27-q02
      type: multiple_choice
      topic_code: "3.C"
      source: 'Wilfred Owen, "Dulce et Decorum Est" (1920)'
      points: 1
      stimulus: *dulce
      prompt: |
        The two-line stanza (lines 15-16) functions in the structure of the poem primarily to
      options:
        - "move from the past attack to the speaker's recurring present nightmares, showing that the witness cannot escape what he saw"
        - "summarise the moral of the poem before the final stanza begins"
        - "introduce a second soldier who also dies in the attack"
        - "provide a moment of calm between two scenes of violence"
      option_explanations:
        - "Correct. Isolated on the page, the couplet shifts into the present tense ('He plunges at me') and into 'all my dreams'. The structure enacts trauma: the event breaks out of its stanza and into every night since."
        - "The moral comes at the end ('The old Lie'); this stanza gives no general statement, only the recurring image."
        - "'He' is the same man seen 'drowning' in line 14; the stanza repeats him, which is the point."
        - "'Guttering, choking, drowning' is anything but calm; the couplet intensifies rather than relieves the violence."
      answer: 0
    - slug: u08-w27-q03
      type: multiple_choice
      topic_code: "6.D"
      source: 'Wilfred Owen, "Dulce et Decorum Est" (1920)'
      points: 1
      stimulus: *dulce
      prompt: |
        Owen's use of the Latin line from Horace in lines 27-28 is best described as
      options:
        - "a respectful tribute that confirms the classical ideal of patriotic death"
        - "an allusion that the poem quotes in order to brand it a lie, using everything before it as the evidence"
        - "a translation exercise included to show the speaker's education"
        - "a prayer for the dead soldier's soul"
      option_explanations:
        - "The speaker calls the line 'The old Lie'; the allusion is attacked, not honoured."
        - "Correct. Horace's 'It is sweet and fitting to die for one's country' arrives only after the drowning, the wagon and the gargling blood, so the reader tests the claim against the evidence. Leaving it in Latin also marks it as the language of schoolrooms, taught to 'children'."
        - "The line is not translated in the poem, and its purpose is argumentative, not a display of learning."
        - "Nothing in the closing lines addresses God or the dead; they address 'My friend' and those who teach the young."
      answer: 1
    - slug: u08-w27-q04
      type: multiple_choice
      topic_code: "4.C"
      source: 'Wilfred Owen, "Dulce et Decorum Est" (1920)'
      points: 1
      stimulus: *dulce
      prompt: |
        In context, the address "My friend" (line 25) is best read as
      options:
        - "warmly affectionate, since the speaker is writing to a fellow soldier"
        - "bitterly ironic, since it is directed at those who repeat patriotic slogans to the young"
        - "neutral, a conventional opening of a letter"
        - "apologetic, since the speaker regrets having described the death so graphically"
      option_explanations:
        - "A fellow soldier would not need to be told what a gas attack is like; the hypothetical 'If ... you too could' assumes the listener has never seen it."
        - "Correct. The polite address follows sixteen lines of horror and introduces an accusation: 'you would not tell with such high zest'. The courtesy sharpens the anger."
        - "Coming at the climax of a long conditional sentence, the phrase carries strong feeling; it is not a neutral formula."
        - "There is no apology; the speaker's point is that the listener should have to see exactly these things."
      answer: 1
    - slug: u08-w27-q05
      type: multiple_choice
      topic_code: "5.D"
      source: 'Wilfred Owen, "Dulce et Decorum Est" (1920)'
      points: 1
      stimulus: *dulce
      prompt: |
        The long conditional sentence in lines 17-28 ("If in some smothering dreams ... Pro patria mori") is built mainly on imagery of
      options:
        - "sight and sound forced on the listener, so that the reader must witness what the speaker witnessed"
        - "peaceful landscapes that contrast with the battlefield"
        - "taste and smell that recall the speaker's childhood"
        - "colour, chiefly green, that suggests renewal"
      option_explanations:
        - "Correct. 'Watch the white eyes writhing' and 'hear ... the blood / Come gargling' put the listener behind the wagon. The 'If you could' structure makes the imagery a test: see this, then repeat the slogan."
        - "No peaceful landscape appears; the scene is a wagon on a road, a dying man and bloody lungs."
        - "Taste appears only in the comparison to the 'cud' and the 'sores on innocent tongues', and it recalls disease, not childhood."
        - "Green belongs to the gas (lines 13-14), and it suggests poison, not renewal; the final stanza's imagery is of eyes, face, blood and lungs."
      answer: 0
    - slug: u08-w27-q06
      type: multi_select
      topic_code: "5.D"
      source: 'Wilfred Owen, "Dulce et Decorum Est" (1920)'
      points: 2
      partial_credit: true
      stimulus: *dulce
      prompt: |
        Which details make the gas attack in lines 9-14 immediate and chaotic for the reader? Select all that apply.
      options:
        - "The fragmented exclamations and shift in capitals of \"Gas! GAS! Quick, boys!\""
        - "The present participles \"yelling,\" \"stumbling\" and \"flound'ring\""
        - "The Latin phrase \"Pro patria mori\""
        - "The phrase \"Fitting the clumsy helmets just in time\""
      option_explanations:
        - "Correct. The line opens with shouted fragments, rising into capitals, so the reader hears the alarm before understanding it."
        - "Correct. The -ing forms keep the action in progress and the dying man in motion, which makes the scene happen in front of us."
        - "This is the poem's closing allusion, a calm schoolroom phrase set against the attack; it does not render the chaos of lines 9-14."
        - "Correct. 'Clumsy' and 'just in time' convey the frantic, near-miss scramble of the attack, the 'ecstasy of fumbling'."
      answer: [0, 1, 3]
    - slug: u08-w27-q07
      type: true_false
      topic_code: "6.B"
      source: 'Wilfred Owen, "Dulce et Decorum Est" (1920)'
      points: 1
      stimulus: *dulce
      prompt: |
        True or false: In line 16, "guttering" implicitly compares the dying man to a candle flame sputtering out.
      answer: true
      explanation: |
        True. A candle "gutters" when its flame flickers and its wax runs down before it goes out. Used of a man, without "like" or "as", it is a compressed metaphor for a life burning down, set between "plunges" and "choking, drowning".
    # ---- Passage set B: "The Convergence of the Twain", stanzas VI-XI
    - slug: u08-w27-q08
      type: multiple_choice
      topic_code: "6.B"
      source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
      points: 1
      stimulus: &twain |
        *The following passage is the second half of Thomas Hardy's "The Convergence of the Twain (Lines on the loss of the 'Titanic')," written in 1912 and collected in* Satires of Circumstance *(1914). Stanzas I-V describe the wrecked liner lying on the sea floor.*

        VI
        Well: while was fashioning
        This creature of cleaving wing,
        The Immanent Will that stirs and urges everything

        VII
        Prepared a sinister mate
        For her—so gaily great—
        A Shape of Ice, for the time far and dissociate.

        VIII
        And as the smart ship grew
        In stature, grace, and hue,
        In shadowy silent distance grew the Iceberg too.

        IX
        Alien they seemed to be:
        No mortal eye could see
        The intimate welding of their later history,

        X
        Or sign that they were bent
        By paths coincident
        On being anon twin halves of one august event,

        XI
        Till the Spinner of the Years
        Said "Now!" And each one hears,
        And consummation comes, and jars two hemispheres.
      prompt: |
        Hardy's extended metaphor of the ship and the iceberg as a couple ("a sinister mate," "intimate welding," "twin halves," "consummation") primarily serves to
      options:
        - "present the collision as a destined union arranged by fate, so that the disaster seems not an accident but a fulfilment"
        - "suggest that the ship's designers deliberately steered toward the iceberg"
        - "celebrate the ship's beauty as a bride worthy of admiration"
        - "show that the iceberg was attracted to the ship's lights"
      option_explanations:
        - "Correct. A marriage is prepared, grows toward its day and is 'consummated'. Applied to ship and ice, the metaphor makes the wreck the planned outcome of 'The Immanent Will', which is the poem's grim argument about human pride and fate."
        - "No human agency appears in these stanzas; the 'Immanent Will' and 'the Spinner of the Years' arrange the meeting, and 'No mortal eye could see' it coming."
        - "'So gaily great' and 'sinister mate' make the wedding ominous, and the earlier stanzas show the ship's luxury lying ruined on the sea floor. The metaphor satirises rather than celebrates."
        - "The iceberg has no will of its own in the poem; both are 'bent / By paths coincident' by a force outside them."
      answer: 0
    - slug: u08-w27-q09
      type: multiple_choice
      topic_code: "3.D"
      source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
      points: 1
      stimulus: *twain
      prompt: |
        In stanza VIII, the parallel between the ship that "grew / In stature, grace, and hue" and the Iceberg that "grew ... too" functions to
      options:
        - "contrast the ship's growth in the light with the Iceberg's hidden growth, binding them together so that each development of one is matched by the other"
        - "show that the Iceberg was larger than the ship"
        - "suggest that the shipbuilders knew about the Iceberg"
        - "prove that the ship was poorly designed"
      option_explanations:
        - "Correct. The repeated verb 'grew' yokes them, while 'stature, grace, and hue' contrasts with 'shadowy silent distance'. The contrast within the parallel makes their meeting feel inevitable: as pride rises, so does its punishment."
        - "Size is not compared; the stanza is about simultaneous growth, not dimensions."
        - "The 'distance' is 'shadowy' and 'silent', and stanza IX says 'No mortal eye could see' the connection; the builders knew nothing."
        - "The stanza praises the ship's 'grace'; nothing concerns design faults. The poem blames vanity and fate, not engineering."
      answer: 0
    - slug: u08-w27-q10
      type: multiple_choice
      topic_code: "3.C"
      source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
      points: 1
      stimulus: *twain
      prompt: |
        Stanzas VI-XI form one long sentence that ends only with "jars two hemispheres." This structure primarily serves to
      options:
        - "imitate the slow, unstoppable approach of ship and Iceberg toward a collision that arrives only at the final line"
        - "show that Hardy was uncertain how to end the poem"
        - "separate the ship and the Iceberg into unrelated episodes"
        - "slow the poem down so that the collision seems trivial"
      option_explanations:
        - "Correct. Clause follows clause ('while ... And as ... Or sign ... Till') across six stanzas, holding off the main event the way fate holds it off; 'Now!' and 'consummation comes' release it in the last line."
        - "The single sentence is tightly controlled, each stanza advancing the approach; nothing suggests uncertainty."
        - "The sentence does the opposite: it joins them grammatically as it joins them in fate."
        - "Delay builds pressure; the final verb 'jars two hemispheres' makes the collision enormous, not trivial."
      answer: 0
    - slug: u08-w27-q11
      type: multiple_choice
      topic_code: "6.D"
      source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
      points: 1
      stimulus: *twain
      prompt: |
        The "Spinner of the Years" (stanza XI) most likely alludes to
      options:
        - "the shipbuilders who worked on the liner for years"
        - "the Fates of classical myth, who spin the thread of each life and decide when it ends"
        - "the ship's captain, who gave the order to sail"
        - "the North Star, by which ships navigate"
      option_explanations:
        - "The Spinner speaks a single word that brings 'consummation'; no shipbuilder controls the meeting of ship and ice."
        - "Correct. In Greek myth one Fate spins the thread of life, one measures it and one cuts it. Hardy's Spinner gives the command 'Now!', making the Titanic's end the cutting of a thread prepared from the start."
        - "No human figure appears in these stanzas, and the captain had no power over the 'Immanent Will'."
        - "Nothing in the stanza concerns navigation; the Spinner speaks and time ends."
      answer: 1
    - slug: u08-w27-q12
      type: fill_blank
      topic_code: "5.B"
      source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
      points: 1
      stimulus: *twain
      prompt: |
        Hardy's name for the blind force "that stirs and urges everything" is the Immanent ____.
      answer: ["Will"]
      explanation: |
        "Will" (stanza VI). Hardy's Immanent Will is an impersonal power working through all things, not a caring God; it "Prepared a sinister mate" for the ship. The phrase sets up the poem's view of the disaster as fate rather than accident.
