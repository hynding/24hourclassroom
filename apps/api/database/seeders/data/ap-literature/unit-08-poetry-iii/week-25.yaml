title: Dramatic Monologue and Irony in Browning and Tennyson
topics: ["3.D", "6.D"]
texts:
  - author: Robert Browning
    title: My Last Duchess
    year: 1842
    url: https://www.poetryfoundation.org/poems/43768/my-last-duchess
  - author: Alfred Tennyson
    title: Ulysses
    year: 1842
    url: https://www.poetryfoundation.org/poems/45392/ulysses
guide: guides/week-25.md
guide_description: |
  How a dramatic monologue works (a speaker who is not the poet, a silent listener, a moment of pressure) and why
  it is the natural home of dramatic irony: the Duke of Ferrara tells far more than he means to. Contrast as the
  engine of both poems, and allusion as borrowed authority in Tennyson's "Ulysses". Worked close readings, a
  model Q1 paragraph, common misreadings, self-check.
flashcards_description: |
  30 cards on the dramatic monologue, the three kinds of irony, and the key lines, contrasts and allusions in
  "My Last Duchess" and "Ulysses".

flashcards:
  - front: Dramatic monologue → the three marks, using "My Last Duchess"
    back: |
      1) A single speaker who is plainly not the poet (the Duke of Ferrara). 2) A silent listener whose presence we infer from the speaker's words (the envoy: "Will't please you sit and look at her?"). 3) A dramatic situation that makes the speaker reveal more than he intends (a marriage negotiation). Everything we learn comes through the speaker's own mouth.
    topic_code: "4.A"
  - front: The silent auditor in "My Last Duchess" → who, and how we know
    back: |
      An envoy from a Count, sent to arrange the Duke's next marriage. We learn it only near the end: "The Count your master's known munificence / Is ample warrant that no just pretense / Of mine for dowry will be disallowed." The delay is the point: we first hear a connoisseur showing a painting, then realise it is a man shopping for a new wife.
    topic_code: "4.A"
  - front: '"Ferrara" → why the heading under Browning''s title matters'
    back: |
      It places the speaker as a Renaissance Duke of Ferrara, an Italian court known for art patronage and absolute power. Readers usually identify him with Alfonso II d'Este, whose young first wife died in 1561 and who then negotiated a second marriage with the family of the Count of Tyrol. The heading turns a private grievance into a portrait of aristocratic power.
    topic_code: "6.D"
  - front: '"I gave commands; / Then all smiles stopped together" → what it implies and how'
    back: |
      Through understatement, that the Duke had his wife silenced, almost certainly killed. Two short clauses, a semicolon and no explanation: the flat syntax is the horror. He narrates a death as an administrative act, which is the clearest single sign of his character.
    topic_code: "3.D"
  - front: '"since none puts by / The curtain I have drawn for you, but I" → function'
    back: |
      The portrait is kept behind a curtain only the Duke may open. Alive, the Duchess smiled at everyone; painted, she smiles only when he permits it. The detail shows that he has turned a person into a possession he can finally control.
    topic_code: "3.D"
  - front: '"Will''t please you sit and look at her?" → courtesy or command?'
    back: |
      Both. The polite form is an order the envoy cannot refuse, and it is repeated at the end ("Will't please you rise?"). The Duke's courtesy frames the whole poem: he controls when his guest sits, looks and leaves, exactly as he controlled his wife.
    topic_code: "4.C"
  - front: '"and I choose / Never to stoop" → the irony'
    back: |
      Dramatic irony: the Duke offers this as proof of his dignity, but the reader hears a man too proud to speak to his wife about what bothered him, who chose commands instead. The line he means as self-praise is the poem's indictment of him.
    topic_code: "3.D"
  - front: '"My gift of a nine-hundred-years-old name" → what it reveals'
    back: |
      The Duke ranks his ancient title as a gift to his wife, and is outraged that she valued it no more than "anybody's gift" (a bough of cherries, a sunset). Pride of lineage, and the conviction that a wife's gratitude is owed to rank, drive his resentment.
    topic_code: "4.C"
  - front: Neptune taming a sea-horse (end of "My Last Duchess") → function
    back: |
      A final art object and a mythological allusion: the sea-god subduing a wild creature, cast in bronze "for me". It sums up the Duke's ideal of marriage as mastery, and he shows it to the envoy of his next bride. Ending on a possession, not a person, completes his self-portrait.
    topic_code: "6.D"
  - front: Fra Pandolf and Claus of Innsbruck → why name the artists?
    back: |
      Both are invented. Naming them lets the Duke display himself as a connoisseur who commissions famous hands, and it also gives him his grievance: he suspects that the Duchess's blush was for the painter's flattery. Art is how the Duke possesses and judges.
    topic_code: "3.D"
  - front: Rhymed couplets you barely hear → the structure of "My Last Duchess"
    back: |
      The poem is in iambic pentameter couplets (wall/call, hands/stands), but heavy enjambment hides the rhymes. The structure mirrors the speaker: rigid control underneath, smooth conversational flow on the surface. The form is as polished and as menacing as the Duke.
    topic_code: "3.C"
  - front: '"Even had you skill / In speech—which I have not" → why it is ironic'
    back: |
      False modesty: the Duke is delivering one of the most fluent, controlled speeches in English poetry while claiming he lacks the skill to correct his wife. The excuse covers the truth that he refused to try.
    topic_code: "4.D"
  - front: '"Though his fair daughter''s self ... is my object" → why the reader doubts it'
    back: |
      He mentions the dowry first and then protests that the daughter herself is what he wants. The order of the sentence gives the game away: money is on his mind, and the new bride is another acquisition.
    topic_code: "3.D"
  - front: Dramatic irony → in a monologue
    back: |
      The gap between what a speaker means and what the reader understands. In a dramatic monologue the poet never steps in to correct the speaker, so every judgement is the reader's inference from the speaker's own words.
    topic_code: "3.D"
  - front: Verbal, situational and dramatic irony → telling them apart in "My Last Duchess"
    back: |
      Verbal: saying one thing and meaning another ("Oh, sir, she smiled, no doubt"). Situational: an outcome reversing expectation (a man courting a bride while confessing his last wife's death). Dramatic: the reader knowing more than the speaker realises he has revealed. The poem runs mainly on dramatic irony.
    topic_code: "3.D"
  - front: '"that spot / Of joy" → why the Duke keeps repeating it'
    back: |
      The phrase recurs ("called that spot / Of joy", "calling up that spot of joy"). The Duke cannot let go of the Duchess's blush: what he resents is that anyone besides him could make her happy. The repetition is the symptom of his jealousy.
    topic_code: "5.B"
  - front: Tennyson's "Ulysses" → speaker and moment
    back: |
      The aged Ulysses (Odysseus), home on Ithaca years after the Trojan War, restless as a ruler, announces that he will hand the kingdom to his son Telemachus and sail again with his old mariners "beyond the sunset". Published in Poems (1842), written in 1833.
    topic_code: "4.A"
  - front: Dante's Inferno, Canto XXVI → the allusion behind "Ulysses"
    back: |
      Homer's Odysseus comes home and stays; Dante's Ulysses, in the Inferno, sets out again beyond the known world and drowns. Tennyson's speaker plans that final voyage. The allusion makes the poem double: heroic resolve, and also the restlessness Dante punished.
    topic_code: "6.D"
  - front: '"Match''d with an aged wife" → how Ulysses sees Penelope'
    back: |
      The faithful Penelope, who waited twenty years in Homer, is reduced to a half-line and an adjective. For readers who doubt the speaker's heroism, this coldness is the key evidence: he dismisses home, wife and people ("a savage race") to justify leaving.
    topic_code: "1.D"
  - front: '"I am a part of all that I have met" → function'
    back: |
      A statement of identity built from experience: Ulysses is the sum of his travels, so to stop travelling is to stop being himself. It sets up the next image, experience as an arch through which an untravelled world keeps gleaming.
    topic_code: "5.B"
  - front: '"all experience is an arch wherethro'' / Gleams that untravell''d world" → metaphor'
    back: |
      Experience is a doorway, not a room: every arrival only frames a new horizon, whose "margin fades / For ever and forever when I move". The metaphor explains why Ulysses can never be satisfied: the goal recedes as he approaches it.
    topic_code: "6.B"
  - front: '"He works his work, I mine." → the Telemachus contrast'
    back: |
      The balanced sentence divides two vocations: the son's patient, domestic rule, praised in measured terms, and the father's restless questing. Readers split on whether the praise is sincere respect or faint praise from a man who finds such work dull.
    topic_code: "3.D"
  - front: '"To strive, to seek, to find, and not to yield" → sound and function'
    back: |
      Four infinitives in a rising series, the last negated and expanded: an end-stopped monosyllabic line that sounds like resolve itself. After "Made weak by time and fate", it turns physical decline into an assertion of will.
    topic_code: "5.B"
  - front: '"the Happy Isles, / And see the great Achilles" → allusion'
    back: |
      The Isles of the Blessed (Elysium) of Greek myth, where dead heroes such as Achilles live on. Ulysses admits the voyage may end in death ("the gulfs will wash us down") and imagines death itself as a reunion with the heroic past.
    topic_code: "6.D"
  - front: Arthur Hallam's death (1833) → context for "Ulysses"
    back: |
      Tennyson wrote "Ulysses" weeks after his closest friend, Arthur Henry Hallam, died suddenly at 22. Tennyson later said the poem expressed his own need to go forward and face life after that loss. The old hero's resolve is also a young poet's answer to grief.
    topic_code: "6.D"
  - front: Blank verse in "Ulysses" vs couplets in "My Last Duchess"
    back: |
      Tennyson's unrhymed iambic pentameter moves in long, oratorical verse paragraphs suited to a public speech; Browning's buried couplets suit a private, controlled conversation. Both forms let a voice dominate, but one persuades a crew while the other manages a guest.
    topic_code: "3.C"
  - front: Allusion → what a Homeric name lends a monologue
    back: |
      An allusion imports a whole story without retelling it. Naming Ulysses, Telemachus and Achilles brings in war, wandering, homecoming and heroic death, so the reader measures the old king against his legend. The function question is always: what does the borrowed story add to, or ironise in, this speaker?
    topic_code: "6.D"
  - front: '"The long day wanes: the slow moon climbs" → contrast of motion'
    back: |
      Slow, heavily stressed monosyllables with colons between clauses make the evening feel long and heavy, the pace of age. Against it Ulysses sets the imperative "Push off": the contrast between the slowing world and the speaker's will is the passage's tension.
    topic_code: "3.D"
  - front: Who is Ulysses talking to? → the shifting audience
    back: |
      The first section reads like soliloquy or a speech to the court, the second presents Telemachus to listeners ("This is my son"), the third addresses the mariners ("My mariners", "Come, my friends"). The shifts move the poem from complaint to decision to rallying cry.
    topic_code: "4.A"
  - front: Two readings of "Ulysses" → why both are defensible
    back: |
      Heroic: an old man refusing to "rust unburnish'd", a model of striving. Ironic: a ruler abandoning duty, wife and son for self-glorifying adventure, read through Dante's damned Ulysses. Strong essays acknowledge the tension rather than choosing a side blindly; that is a route to the sophistication point.
    topic_code: "7.B"

quiz:
  description: |
    22 questions · about 45 minutes · a passage set on the close of "My Last Duchess" and a shorter set on the
    end of "Ulysses", then items on contrast, allusion and the dramatic monologue; about half the items review
    earlier skills (speaker, reliability, diction, imagery, thesis writing). Multiple choice, select-all and
    true/false are graded at once and the fill-in-the-blank items are matched automatically; the two short answers
    and the Q1-style essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Passage set A: "My Last Duchess", lines 33-56
    - slug: u08-w25-q01
      type: multiple_choice
      topic_code: "3.D"
      source: 'Robert Browning, "My Last Duchess" (1842)'
      points: 1
      stimulus: &duchessEnd |
        *The following passage is the close of Robert Browning's dramatic monologue "My Last Duchess" (1842). The Duke of Ferrara has been showing a portrait of his late wife to a visitor and complaining that she valued his favour no more than any other kindness. Line numbers are those of the whole poem.*

        My gift of a nine-hundred-years-old name
        With anybody's gift. Who'd stoop to blame
        This sort of trifling? Even had you skill   [35]
        In speech—which I have not—to make your will
        Quite clear to such an one, and say, "Just this
        Or that in you disgusts me; here you miss,
        Or there exceed the mark"—and if she let
        Herself be lessoned so, nor plainly set   [40]
        Her wits to yours, forsooth, and made excuse—
        E'en then would be some stooping; and I choose
        Never to stoop. Oh, sir, she smiled, no doubt,
        Whene'er I passed her; but who passed without
        Much the same smile? This grew; I gave commands;   [45]
        Then all smiles stopped together. There she stands
        As if alive. Will't please you rise? We'll meet
        The company below, then. I repeat,
        The Count your master's known munificence
        Is ample warrant that no just pretense   [50]
        Of mine for dowry will be disallowed;
        Though his fair daughter's self, as I avowed
        At starting, is my object. Nay, we'll go
        Together down, sir. Notice Neptune, though,
        Taming a sea-horse, thought a rarity,   [55]
        Which Claus of Innsbruck cast in bronze for me!
      prompt: |
        The contrast between the Duke's declaration "and I choose / Never to stoop" (lines 42-43) and the action he reports in line 45 primarily serves to
      options:
        - "show that the Duke's pride made speaking to his wife unthinkable while ordering her death was not, exposing a dignity that is really ruthlessness"
        - "suggest that the Duke regrets his refusal to compromise and now wishes he had spoken frankly to the Duchess"
        - "establish that the Duchess was guilty of serious misconduct that justified the Duke's response"
        - "illustrate the Duke's preference for diplomacy over force in his dealings with others"
      option_explanations:
        - "Correct. The Duke presents his refusal to 'stoop' as aristocratic dignity, yet the next sentences report that he 'gave commands' and 'all smiles stopped together'. Juxtaposed, the two show that stooping to a conversation was beneath him, killing was not; the contrast turns his boast into self-indictment."
        - "Nothing in the passage expresses regret. The Duke moves straight from the commands to 'There she stands / As if alive' and on to dowry arrangements, which is the opposite of remorse."
        - "The only 'offence' the Duke names is that she smiled at others as she smiled at him. The contrast exposes the gap between that trivial grievance and his extreme response; it does not justify him."
        - "The passage shows the reverse. The Duke rejects even the mildest diplomacy (a private word with his wife) and resorts to commands, a euphemism for force."
      answer: 0
    - slug: u08-w25-q02
      type: multiple_choice
      topic_code: "4.D"
      source: 'Robert Browning, "My Last Duchess" (1842)'
      points: 1
      stimulus: *duchessEnd
      prompt: |
        The Duke's aside "which I have not" (line 36) most affects the reader's view of him by
      options:
        - "confirming that he is a plain-spoken man who distrusts eloquence"
        - "undercutting his reliability, since the polished speech he is delivering contradicts his claim to lack skill in speech"
        - "revealing that the Duchess was more articulate than he was and therefore intimidated him"
        - "showing that he is nervous in front of the envoy and anxious to make a good impression"
      option_explanations:
        - "The Duke's speech is anything but plain: it is a long, controlled, rhetorically shaped performance. Taking the aside at face value is exactly the misreading the poem invites the reader to catch."
        - "Correct. The disclaimer is false modesty from a fluent speaker who steers his listener with perfect control. Catching the contradiction teaches the reader not to trust the Duke's account of himself, which is how a dramatic monologue works."
        - "The passage gives no evidence about the Duchess's way of speaking; the Duke's complaint is about her smiles and blushes. The aside is about his self-presentation, not a comparison of skills."
        - "Nothing suggests anxiety. He gives orders to his guest ('Will't please you rise?', 'Notice Neptune') and handles a confession and a negotiation without a falter."
      answer: 1
    - slug: u08-w25-q03
      type: multiple_choice
      topic_code: "1.E"
      source: 'Robert Browning, "My Last Duchess" (1842)'
      points: 1
      stimulus: *duchessEnd
      prompt: |
        In context, the sentence "This grew; I gave commands; / Then all smiles stopped together" (lines 45-46) is best described as
      options:
        - "an understatement whose flat, clipped syntax reveals the Duke's chilling detachment from the death he has ordered"
        - "a confession offered in hope of the envoy's forgiveness"
        - "a metaphor for the Duchess's gradual loss of happiness as the marriage cooled"
        - "an exaggeration designed to frighten the envoy into accepting a smaller dowry"
      option_explanations:
        - "Correct. Three short clauses separated by semicolons report escalation, order and result without a single feeling-word. The euphemism 'all smiles stopped' and the businesslike rhythm show a man for whom a wife's death was an administrative act."
        - "The Duke asks no one's forgiveness. He moves at once to 'Will't please you rise?' and to dowry; the remark is offered as part of the explanation of a painting, not as a plea."
        - "Reading 'smiles stopped' as fading happiness ignores 'I gave commands' and 'Then': the causal sequence points to a decisive act, and 'There she stands / As if alive' implies she is no longer alive."
        - "The Duke himself says the dowry matters less than the daughter, and he speaks of commands already given. There is no sign the line is exaggerated or aimed at bargaining."
      answer: 0
    - slug: u08-w25-q04
      type: multiple_choice
      topic_code: "3.D"
      source: 'Robert Browning, "My Last Duchess" (1842)'
      points: 1
      stimulus: *duchessEnd
      prompt: |
        The juxtaposition in lines 46-53, where the Duke moves from "There she stands / As if alive" to the Count's "known munificence" and the dowry, primarily serves to
      options:
        - "signal that the Duke has finished grieving and is ready to love again"
        - "reveal that the visit is a marriage negotiation, so the portrait becomes an implicit warning about how the next Duchess must behave"
        - "contrast the Duke's poverty with the Count's wealth"
        - "show that the envoy has grown impatient and steered the conversation back to business"
      option_explanations:
        - "The Duke shows no grief anywhere in the poem; the portrait pleases him because it smiles only when he draws the curtain. 'Ready to love again' imports feeling the text does not support."
        - "Correct. Only here does the reader learn that the listener is the envoy of the Count whose daughter the Duke will marry. The juxtaposition recasts the whole tour: the story of the last Duchess, told to her successor's representative, reads as a threat."
        - "The Duke is not poor: he boasts a nine-hundred-years-old name and commissions bronzes. His remark about dowry concerns what he is owed, not what he lacks."
        - "The envoy never speaks, and it is the Duke who says 'Will't please you rise?' The Duke controls every turn of the conversation, including this one."
      answer: 1
    - slug: u08-w25-q05
      type: multiple_choice
      topic_code: "6.D"
      source: 'Robert Browning, "My Last Duchess" (1842)'
      points: 1
      stimulus: *duchessEnd
      prompt: |
        The allusion to "Neptune, though, / Taming a sea-horse" (lines 54-55) functions chiefly to
      options:
        - "show that the Duke is changing the subject because the conversation about his wife has embarrassed him"
        - "introduce a new interest in classical mythology that the envoy is expected to share"
        - "offer an emblem of the Duke's idea of marriage as mastery, displayed to the envoy of his next bride"
        - "suggest that the Duke sees himself as a victim of forces as uncontrollable as the sea"
      option_explanations:
        - "The Duke is never embarrassed; he narrates the commands with composure. The allusion is not an escape but a final, telling self-portrait."
        - "The mythology matters less as a shared interest than as an image: a god subduing a wild creature. The Duke's pride is in owning the bronze ('for me'), not in discussing myth."
        - "Correct. Neptune, god of the sea, 'taming' a sea-horse is a picture of power forcing something spirited into submission. Ending the poem on that object, cast 'for me', compresses the Duke's view of a wife as a possession to be tamed."
        - "In the sculpture the Duke identifies with the tamer, not the tamed. He never presents himself as a victim; he presents himself as the one who gives commands."
      answer: 2
    - slug: u08-w25-q06
      type: multi_select
      topic_code: "4.C"
      source: 'Robert Browning, "My Last Duchess" (1842)'
      points: 2
      partial_credit: true
      stimulus: *duchessEnd
      prompt: |
        Which details in the passage reveal the Duke's perspective on people and things as possessions or marks of status? Select all that apply.
      options:
        - "\"My gift of a nine-hundred-years-old name\" (line 33)"
        - "\"Or there exceed the mark\" (line 39)"
        - "\"Which Claus of Innsbruck cast in bronze for me!\" (line 56)"
        - "\"We'll meet / The company below, then\" (lines 47-48)"
      option_explanations:
        - "Correct. He treats his ancient title as a gift his wife should have prized above all others; his name is a possession and a measure of status."
        - "This phrase is part of the imagined rebuke he says he would never deliver. It concerns her behaviour, not his sense of ownership or rank."
        - "Correct. The closing words stress who commissioned and owns the bronze. The poem ends, pointedly, on 'me'."
        - "This is a social arrangement (joining the guests downstairs). It shows his control of the visit but not a view of people as possessions or status markers."
      answer: [0, 2]
    - slug: u08-w25-q07
      type: true_false
      topic_code: "3.D"
      source: 'Robert Browning, "My Last Duchess" (1842)'
      points: 1
      stimulus: *duchessEnd
      prompt: |
        True or false: In lines 49-53, the Duke openly states that the dowry, not the Count's daughter, is what he really wants.
      answer: false
      explanation: |
        False. He says the reverse: the Count's generosity guarantees the dowry, "Though his fair daughter's self, as I avowed / At starting, is my object." The irony is that he raises the dowry first and then protests too much, so the reader suspects what he denies. The contrast between his words and their order is the point, but he never states it openly.
    - slug: u08-w25-q08
      type: multiple_choice
      topic_code: "5.B"
      source: 'Robert Browning, "My Last Duchess" (1842)'
      points: 1
      stimulus: *duchessEnd
      prompt: |
        The repetition of "stoop" and "stooping" in lines 34, 42 and 43 primarily serves to
      options:
        - "suggest that the Duke is physically old and finds bending difficult"
        - "make the Duke's refusal to lower himself, socially and morally, the key to his character and to the Duchess's fate"
        - "show that the Duke admires the Duchess's humility"
        - "create a pun that lightens the poem's tone before its grim ending"
      option_explanations:
        - "The word is figurative here: to 'stoop' is to lower one's dignity. Nothing in the poem concerns the Duke's physical condition."
        - "Correct. 'Stoop' returns three times in ten lines, each time as the act he will not perform. The word gathers his whole self-image, a man too high to bend, and leads directly to 'I gave commands'."
        - "The Duke resents what he sees as her lack of discrimination; he never praises humility in her, and the word 'stoop' is applied to himself."
        - "The repetition darkens rather than lightens the tone, since it leads straight to the commands and the stopping of all smiles."
      answer: 1
    # ---- Passage set B: "Ulysses", lines 50-70
    - slug: u08-w25-q09
      type: multiple_choice
      topic_code: "5.D"
      source: 'Alfred Tennyson, "Ulysses" (1842)'
      points: 1
      stimulus: &ulyssesEnd |
        *The following passage is the close of Alfred Tennyson's dramatic monologue "Ulysses" (1842). The aged king, home in Ithaca long after the Trojan War, has just handed his kingdom to his son and now addresses the sailors who once travelled with him. Line numbers are those of the whole poem.*

        Old age hath yet his honour and his toil;   [50]
        Death closes all: but something ere the end,
        Some work of noble note, may yet be done,
        Not unbecoming men that strove with Gods.
        The lights begin to twinkle from the rocks:
        The long day wanes: the slow moon climbs: the deep   [55]
        Moans round with many voices. Come, my friends,
        'T is not too late to seek a newer world.
        Push off, and sitting well in order smite
        The sounding furrows; for my purpose holds
        To sail beyond the sunset, and the baths   [60]
        Of all the western stars, until I die.
        It may be that the gulfs will wash us down:
        It may be we shall touch the Happy Isles,
        And see the great Achilles, whom we knew.
        Tho' much is taken, much abides; and tho'   [65]
        We are not now that strength which in old days
        Moved earth and heaven, that which we are, we are;
        One equal temper of heroic hearts,
        Made weak by time and fate, but strong in will
        To strive, to seek, to find, and not to yield.   [70]
      prompt: |
        The imagery in lines 54-56 ("The lights begin to twinkle ... many voices") primarily serves to
      options:
        - "describe a storm that makes the planned voyage too dangerous to attempt"
        - "set the scene at dusk, so that the ending day mirrors the mariners' old age even as it beckons them to depart"
        - "contrast the beauty of Ithaca with the ugliness of the open sea"
        - "suggest that the mariners are afraid of the dark and reluctant to sail"
      option_explanations:
        - "The sea 'moans' but nothing suggests a storm; the lights 'twinkle' and the moon 'climbs' calmly. The scene is an evening, not a tempest."
        - "Correct. Twinkling lights, a waning day and a climbing moon mark the end of a day, an image of the end of life that matches 'Old age' and 'Death closes all'. Yet the many-voiced deep sounds like a summons, and the next words are 'Come, my friends'."
        - "The passage does not evaluate Ithaca against the sea; both the rocks and 'the deep' belong to the same twilight scene that calls the speaker outward."
        - "The mariners never speak and no reluctance is described. The imagery prepares an invitation, not a refusal."
      answer: 1
    - slug: u08-w25-q10
      type: multiple_choice
      topic_code: "6.D"
      source: 'Alfred Tennyson, "Ulysses" (1842)'
      points: 1
      stimulus: *ulyssesEnd
      prompt: |
        The allusion to "the Happy Isles" and "the great Achilles" (lines 63-64) functions to
      options:
        - "present the possibility of death as a reunion with the heroic dead, so that even failure would join the mariners to their legend"
        - "remind the mariners that Achilles survived the Trojan War and still waits for them at home"
        - "suggest that Ulysses intends to conquer new islands to add to his kingdom"
        - "reveal that Ulysses fears Achilles' judgement of his conduct at Troy"
      option_explanations:
        - "Correct. The Happy Isles are the Isles of the Blessed where dead heroes dwell, and Achilles died at Troy. Placed just after 'the gulfs will wash us down', the allusion turns the likely end of the voyage into a meeting with the heroic past."
        - "Achilles died at Troy; that is why seeing him requires reaching the Happy Isles. Reading him as a living friend misses the allusion entirely."
