    - slug: u08-w25-q22
      type: long_answer
      topic_code: "7.C"
      source: 'Robert Browning, "My Last Duchess" (1842)'
      points: 6
      stimulus: |
        *The following passage is the opening of Robert Browning's "My Last Duchess" (1842). The speaker is the Duke of Ferrara.*

        FERRARA

        That's my last Duchess painted on the wall,
        Looking as if she were alive. I call
        That piece a wonder, now; Fra Pandolf's hands
        Worked busily a day, and there she stands.
        Will't please you sit and look at her? I said   [5]
        "Fra Pandolf" by design, for never read
        Strangers like you that pictured countenance,
        The depth and passion of its earnest glance,
        But to myself they turned (since none puts by
        The curtain I have drawn for you, but I)   [10]
        And seemed as they would ask me, if they durst,
        How such a glance came there; so, not the first
        Are you to turn and ask thus. Sir, 'twas not
        Her husband's presence only, called that spot
        Of joy into the Duchess' cheek; perhaps   [15]
        Fra Pandolf chanced to say, "Her mantle laps
        Over my lady's wrist too much," or "Paint
        Must never hope to reproduce the faint
        Half-flush that dies along her throat." Such stuff
        Was courtesy, she thought, and cause enough   [20]
        For calling up that spot of joy. She had
        A heart—how shall I say?—too soon made glad,
        Too easily impressed; she liked whate'er
        She looked on, and her looks went everywhere.
      prompt: |
        Read carefully the opening of Robert Browning's dramatic monologue "My Last Duchess" (1842). In this passage, the Duke of Ferrara shows a visitor a portrait of his late wife. In a well-written essay, analyze how Browning uses literary elements and techniques to convey the Duke's complex perspective on his wife and on his own power.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Browning lets the Duke's courteous, connoisseur's tour of a painting expose, line by line, a jealous need to own and control his wife, so that the very fluency he takes pride in becomes the evidence against him.

        Line of reasoning and evidence: (1) Control of looking. The portrait sits behind "The curtain I have drawn for you", which no one "puts by" but the Duke; the parenthesis is a small boast of possession, and the polite command "Will't please you sit and look at her?" shows him directing his guest as he once tried to direct his wife. The painting is the Duchess he can finally manage. (2) Jealous fixation. The repeated "spot / Of joy" and his guesses at what Fra Pandolf "chanced to say" show that what torments him is that someone else could make her blush; quoting the painter's compliments in full betrays how closely he has brooded over them. (3) Self-revealing rhetoric. The feigned hesitation "how shall I say?" and the even-handed tone ("Too easily impressed") dress resentment as fair judgement; "her looks went everywhere" makes her warmth sound like a fault. (4) Form. Enjambed couplets keep a strict pattern under a smooth, conversational surface, mirroring a speaker whose control is total and whose menace is hidden by charm.

        Complexity: the Duke is not a cartoon villain; his pride in art and lineage is real, and the reader is drawn into his aesthetic pleasure before recognising its cost. A strong essay can note that the passage withholds the murder, so the reader's growing unease is part of Browning's design.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis that interprets the Duke's perspective (on his wife, on his power, or the relation between them) and is more than a list of devices. "Browning uses imagery and irony to show the Duke" earns 0; "Browning's controlled couplets and the Duke's courteous asides expose a jealous need to possess his wife" earns 1.

        Row B Evidence and Commentary (0-4): 1 = summary of what the Duke says, with little or no explanation. 2 = relevant quotations (the curtain, "spot of joy", "how shall I say?", "her looks went everywhere") with commentary that restates rather than explains how the technique conveys his perspective. 3 = specific evidence consistently tied to a line of reasoning; commentary explains how at least two techniques (for example, the curtain image and the feigned hesitation) reveal possessiveness or jealousy, though some links are uneven. 4 = all of 3, plus commentary that explains how the techniques work together across the passage (for example, how the courteous surface and the jealous fixation build the dramatic irony) and connects every piece of evidence to the thesis.

        Row C Sophistication (0-1): 1 point for a complex understanding, such as the tension between the Duke's genuine aesthetic sensibility and his cruelty, how Browning makes the reader complicit in admiring the painting, the relation between form (hidden couplets) and character, or an argument about how the passage withholds and foreshadows the murder. Isolated phrases ("this is ironic") do not earn the point.
