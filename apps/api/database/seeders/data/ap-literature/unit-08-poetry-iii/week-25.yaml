      source: general knowledge
      points: 1
      prompt: |
        True or false: A reference counts as an allusion only if the poem names its source explicitly, as Tennyson names Achilles.
      answer: false
      explanation: |
        False. An allusion can be direct (a name such as Achilles or Neptune) or indirect: Tennyson never names Dante, yet the whole plot of a final voyage beyond the known world alludes to Dante's Ulysses in the *Inferno*. What matters is that the reference calls up another text or story and that the reader can explain what it adds.
