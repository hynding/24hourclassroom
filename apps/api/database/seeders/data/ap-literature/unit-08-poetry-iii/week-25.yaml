      source: 'Robert Browning, "My Last Duchess" (1842)'
      points: 2
      prompt: |
        In one or two sentences, write a defensible thesis explaining how Browning uses dramatic irony in "My Last Duchess" to shape the reader's judgement of the Duke.
      answer: |
        Browning lets the Duke praise his own taste, restraint and pride ("I choose / Never to stoop") while every boast reveals jealousy and cruelty he does not see, so the dramatic irony makes the reader the judge the Duke never imagines he faces and turns his self-portrait into a confession.
      explanation: |
        1 point: a defensible interpretive claim about the Duke or the poem's meaning (not just "the Duke is bad" or "the poem uses irony"). 1 point: the claim explains how dramatic irony works here: the gap between what the Duke intends to show and what the reader infers. Strong answers name a specific moment (the curtain, "I gave commands", the Neptune bronze) or a line of reasoning.
