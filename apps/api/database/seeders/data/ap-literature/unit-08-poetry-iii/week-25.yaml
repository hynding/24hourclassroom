        1 point: identifies the contrast accurately (her free, unregulated attention in life vs the curtained portrait he alone reveals). 1 point: explains its function (it exposes his desire for control or possession; it hints at the motive for her death; it makes the painting a symbol of the marriage he wanted). Answers that only restate the two quotations earn at most 1.
