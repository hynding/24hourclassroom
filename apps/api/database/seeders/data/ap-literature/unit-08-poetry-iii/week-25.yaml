      prompt: |
        The Duke says that no one draws the curtain over the portrait "but I", and he complains that the living Duchess "liked whate'er / She looked on, and her looks went everywhere." In two or three sentences, explain the function of this contrast between the painted and the living Duchess.
      answer: |
        Alive, the Duchess gave her smiles freely to everyone, which the Duke could not control; painted, she smiles only when he chooses to open the curtain. The contrast shows that the portrait is the wife the Duke wanted, a possession under his hand, and it quietly explains why the real Duchess had to be "stopped".
