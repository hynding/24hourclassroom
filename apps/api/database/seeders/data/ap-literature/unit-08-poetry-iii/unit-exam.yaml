  # ---- Essay: paired-poem Q1
  - slug: u08-exam-q45
    type: long_answer
    topic_code: "7.C"
    source: 'Wilfred Owen, "Futility" (1920); Thomas Hardy, "The Man He Killed" (1902)'
    points: 6
    stimulus: |
      *Poem 1 is Wilfred Owen's "Futility" (first published 1918; text of* Poems, *1920). Poem 2 is Thomas Hardy's "The Man He Killed" (1902; text of* Time's Laughingstocks, *1909).*

      **Poem 1**

      FUTILITY

      Move him into the sun—
      Gently its touch awoke him once,
      At home, whispering of fields unsown.
      Always it woke him, even in France,
      Until this morning and this snow.   [5]
      If anything might rouse him now
      The kind old sun will know.

      Think how it wakes the seeds—
      Woke, once, the clays of a cold star.
      Are limbs so dear-achieved, are sides   [10]
      Full-nerved,—still warm,—too hard to stir?
      Was it for this the clay grew tall?
      —O what made fatuous sunbeams toil
      To break earth's sleep at all?

      **Poem 2**

      THE MAN HE KILLED

      "Had he and I but met
      By some old ancient inn,
      We should have sat us down to wet
      Right many a nipperkin!

      "But ranged as infantry,   [5]
      And staring face to face,
      I shot at him as he at me,
      And killed him in his place.

      "I shot him dead because—
      Because he was my foe,   [10]
      Just so: my foe of course he was;
      That's clear enough; although

      "He thought he'd 'list, perhaps,
      Off-hand like—just as I—
      Was out of work—had sold his traps—   [15]
      No other reason why.

      "Yes; quaint and curious war is!
      You shoot a fellow down
      You'd treat if met where any bar is,
      Or help to half-a-crown."   [20]
    prompt: |
      Read carefully the following two poems, each of which responds to the death of a single soldier. In Owen's poem, the speaker stands over a comrade who has died in the night; in Hardy's, a former soldier recalls a man he shot in battle. In a well-written essay, compare and contrast how the two poets use literary elements and techniques to convey their speakers' complex responses to these deaths.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: Both speakers confront a death that no reason can justify, but Owen's speaker, tender and then anguished, turns one comrade's death into a question about the purpose of creation, while Hardy's speaker, homely and evasive, circles a killing he committed and cannot explain, so that Owen's grief rises to cosmic despair and Hardy's guilt shrinks into a shrug that condemns war more quietly.

      Line of reasoning (point by point): (1) Voice and diction. Owen's speaker is intimate and reverent ("Gently", "the kind old sun", "limbs so dear-achieved"); Hardy's is colloquial and self-protective ("Off-hand like", "half-a-crown", "quaint and curious"). Owen's diction honours the body; Hardy's keeps feeling at a distance. (2) Structure and shift. Owen's poem turns from an instruction and a fragile hope to unanswered questions ("Was it for this the clay grew tall?"), widening from one man to "a cold star"; Hardy's short ballad stanzas falter at "because— / Because" and "although" and then generalise to "You shoot a fellow down". Both poems widen from the particular, but Owen's widening is metaphysical, Hardy's social. (3) Symbol and imagery. Owen's sun symbolises the creative force that has been made "fatuous"; Hardy's imagined inn and the shared poverty that sent both men to "'list" stand for the common humanity war cancels. (4) What each death means. In Owen the death empties creation of purpose; in Hardy it exposes the arbitrariness of being "ranged as infantry" against a man one would have treated to a drink.

      Complexity: Owen's speaker never mentions the enemy and Hardy's never mentions grief, yet each poem's silence is eloquent; a strong essay may observe that Hardy's mildness and Owen's anguish are two forms of the same refusal to accept the official reasons for war.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis that addresses BOTH poems and makes a comparative claim about the speakers' complex responses (for example, both find the death senseless, but one answers with cosmic despair and the other with uneasy, understated guilt). A thesis about only one poem, or one that only says the poems are "alike and different", earns 0.

      Row B Evidence and Commentary (0-4): 1 = summary of each poem with general remarks. 2 = relevant evidence from both poems; commentary mostly describes each separately or restates. 3 = specific evidence from both poems consistently tied to a comparative line of reasoning, explaining how at least two techniques (voice and diction, the shifts, the sun as symbol, the faltering syntax, the inn/infantry contrast) convey each response, with some uneven links. 4 = all of 3, with commentary that keeps the comparison active throughout and explains why the different techniques produce different responses to similar deaths.

      Row C Sophistication (0-1): 1 point for a complex comparison, such as recognising that Hardy's understatement and Owen's anguish both reject the official reasons for killing; noticing what each poem leaves unsaid (the enemy in Owen, grief in Hardy); relating each poem's form to its speaker (ballad talk vs a quiet elegy that breaks into questions); or a consistently controlled, vivid style. A sentence of context alone does not earn the point.
