unit: 8
description: |
  45 questions · about 90 minutes · five passage sets in the style of Section I, two of them on poems not studied
  in the unit (Owen's "Futility" and Hardy's "The Man He Killed"), the others on "The Convergence of the Twain",
  the opening of "My Last Duchess" and "Spring and Fall"; then items on allusion, metaphor, structure and
  composition, two short answers, and a paired-poem Q1 essay on the two unseen poems. Covers every Unit 8 skill
  (3.C, 3.D, 5.B, 5.C, 6.B, 6.D, 7.B-7.E) with some review of speaker and reliability. Multiple choice, select-all
  and true/false are graded at once and the fill-in-the-blank items are matched automatically; the short answers
  and the essay are graded by your teacher against the scoring notes.
questions:
  # ---- Set A (unseen): Wilfred Owen, "Futility"
  - slug: u08-exam-q01
    type: multiple_choice
    topic_code: "5.C"
    source: 'Wilfred Owen, "Futility" (1920)'
    points: 1
    stimulus: &futility |
      *The following poem by Wilfred Owen, who served as an officer on the Western Front, was first published in 1918 and collected in his* Poems *(1920). The speaker stands over a soldier who has died in the night.*

      FUTILITY

      Move him into the sun—
      Gently its touch awoke him once,
      At home, whispering of fields unsown.
      Always it woke him, even in France,
      Until this morning and this snow.   [5]
      If anything might rouse him now
      The kind old sun will know.

      Think how it wakes the seeds—
      Woke, once, the clays of a cold star.
      Are limbs so dear-achieved, are sides   [10]
      Full-nerved,—still warm,—too hard to stir?
      Was it for this the clay grew tall?
      —O what made fatuous sunbeams toil
      To break earth's sleep at all?
    prompt: |
      Across the poem, the sun functions chiefly as a symbol of
    options:
      - "the dead soldier's homeland, which he will never see again"
      - "the life-giving force that woke the soldier each day and once brought life itself out of the earth, and whose failure now calls creation into question"
      - "the military authority that ordered the soldier into battle"
      - "the speaker's religious faith, which remains unshaken by the death"
    option_explanations:
      - "The sun is linked to home in line 3, but it also woke him 'even in France' and 'wakes the seeds'; its meaning is larger than one place."
      - "Correct. The first stanza shows the sun waking the soldier at home and at the front; the second widens it to the force that 'wakes the seeds' and 'Woke, once, the clays of a cold star'. When it cannot wake this man, the speaker asks why it ever made life at all."
      - "Nothing connects the 'kind old sun' with command or war; it is gentle and creative, the opposite of the force that killed him."
      - "The final question ('O what made fatuous sunbeams toil') expresses bitter doubt, not unshaken faith."
    answer: 1
  - slug: u08-exam-q02
    type: multiple_choice
    topic_code: "3.C"
    source: 'Wilfred Owen, "Futility" (1920)'
    points: 1
    stimulus: *futility
    prompt: |
      Which best describes the shift between the first stanza and the second?
    options:
      - "From a tender, practical hope for one soldier to anguished questions about the purpose of all life"
      - "From despair about the war to hope that it will soon end"
      - "From a description of France to a description of England"
      - "From the speaker's grief to the dead soldier's own reply"
    option_explanations:
      - "Correct. Stanza 1 gives an instruction ('Move him into the sun') and clings to 'If anything might rouse him now'; stanza 2 widens to seeds, a 'cold star' and 'the clay', and ends in questions about why creation happened at all."
      - "The poem moves toward despair, not hope; the final question calls the sun's whole labour 'fatuous'."
      - "Home and France both appear in stanza 1; stanza 2 leaves geography for the cosmic scale of 'a cold star'."
      - "The soldier never speaks; he is dead, and the questions in stanza 2 are the speaker's."
    answer: 0
  - slug: u08-exam-q03
    type: multiple_choice
    topic_code: "4.C"
    source: 'Wilfred Owen, "Futility" (1920)'
    points: 1
    stimulus: *futility
    prompt: |
      In lines 6-7 ("If anything might rouse him now / The kind old sun will know"), the speaker's attitude is best described as
    options:
      - "confident that the soldier will recover"
      - "fragile hope, half aware that it is already too late"
      - "sarcastic contempt for the sun's weakness"
      - "indifference to the soldier's fate"
    option_explanations:
      - "'If anything might' is conditional and doubtful; confidence would not hedge so heavily."
      - "Correct. The conditional and the trusting, almost childlike 'kind old sun' show a speaker clinging to a hope he can barely hold, after 'this morning and this snow' have already settled the matter."
      - "Sarcasm arrives only with 'fatuous' in line 13; here the sun is still 'kind'."
      - "The careful command 'Gently' and the hope of rousing him show tenderness, not indifference."
    answer: 1
  - slug: u08-exam-q04
    type: multiple_choice
    topic_code: "5.B"
    source: 'Wilfred Owen, "Futility" (1920)'
    points: 1
    stimulus: *futility
    prompt: |
      In context, the word "fatuous" (line 13) primarily serves to
    options:
      - "praise the sun's patience in continuing to shine"
      - "turn the 'kind old sun' of stanza 1 into something foolish and pointless, since all its labour of creation ends in a death like this"
      - "describe the weak winter light of the snowy morning"
      - "mock the dead soldier for trusting the sun"
    option_explanations:
      - "'Fatuous' means foolish or pointless; it accuses rather than praises."
      - "Correct. The word reverses the poem's earlier trust. If the sun 'toil[ed]' to break 'earth's sleep' only for life to end like this, its work was absurd; the single adjective carries the poem's title."
      - "The word judges the sunbeams' purpose, not their brightness; 'toil / To break earth's sleep' refers to the creation of life."
      - "The speaker's bitterness is aimed at creation, not at the soldier, whose 'limbs so dear-achieved' he honours."
    answer: 1
  - slug: u08-exam-q05
    type: multiple_choice
    topic_code: "6.B"
    source: 'Wilfred Owen, "Futility" (1920)'
    points: 1
    stimulus: *futility
    prompt: |
      The metaphor "the clay grew tall" (line 12) most likely suggests
    options:
      - "the growth of crops in the fields the soldier left unsown"
      - "the human body as earth that the sun raised into a living, upright man, echoing the creation of Adam from dust"
      - "a tall pile of mud in the trenches"
      - "the soldier's ambition to rise in rank"
    option_explanations:
      - "Line 3's 'fields unsown' are a separate image; here 'clay' follows 'the clays of a cold star' and 'limbs', so it refers to the body."
      - "Correct. Clay is the earth from which, in Genesis, man is made. 'Grew tall' makes the soldier's body a slow achievement of the sun, which is why the question 'Was it for this' is so bitter."
      - "The poem never mentions trench mud; reading 'clay' literally ignores the creation imagery around it."
      - "'Grew tall' concerns the body's growth, not military rank; nothing in the poem mentions promotion."
    answer: 1
  - slug: u08-exam-q06
    type: multiple_choice
    topic_code: "3.D"
    source: 'Wilfred Owen, "Futility" (1920)'
    points: 1
    stimulus: *futility
    prompt: |
      The contrast between "whispering of fields unsown" (line 3) and "this morning and this snow" (line 5) primarily serves to
    options:
      - "set the promise of future work and growth at home against the cold finality of death at the front"
      - "show that the soldier was a lazy farmer who never sowed his fields"
      - "suggest that the war was fought in winter only"
      - "contrast English weather with French weather"
    option_explanations:
      - "Correct. 'Fields unsown' whisper of seasons still to come, a life of labour waiting; 'snow' freezes that promise. The contrast measures what death has taken."
      - "'Unsown' means not yet sown: the sun reminded him of work ahead. The phrase is about future, not neglect."
      - "The poem names one morning's snow; it makes no general claim about seasons of war."
      - "The contrast is between growth and death, not between national climates; both the sun and the snow could fall anywhere."
    answer: 0
  - slug: u08-exam-q07
    type: multi_select
    topic_code: "5.B"
    source: 'Wilfred Owen, "Futility" (1920)'
    points: 2
    partial_credit: true
    stimulus: *futility
    prompt: |
      Which words or phrases convey the speaker's tenderness toward the dead soldier? Select all that apply.
    options:
      - "\"Gently\" (line 2)"
      - "\"dear-achieved\" (line 10)"
      - "\"fatuous\" (line 13)"
      - "\"still warm\" (line 11)"
    option_explanations:
      - "Correct. The sun's touch is gentle, and the word sets the hushed, careful tone in which the speaker handles the body."
      - "Correct. 'Dear-achieved' calls the body precious and costly, the result of long creation."
      - "This word expresses bitterness toward creation, not tenderness toward the soldier."
      - "Correct. The detail shows the speaker touching or noticing the body closely and clinging to its last sign of life."
    answer: [0, 1, 3]
  - slug: u08-exam-q08
    type: true_false
    topic_code: "3.C"
    source: 'Wilfred Owen, "Futility" (1920)'
    points: 1
    stimulus: *futility
    prompt: |
      True or false: The poem's second stanza is built of questions, so that it ends without any answer to why life was created.
    answer: true
    explanation: |
      True. After the imperative "Think", the stanza asks "Are limbs ... too hard to stir?", "Was it for this the clay grew tall?" and "O what made fatuous sunbeams toil / To break earth's sleep at all?" Ending on an unanswered question is the structural form of the poem's title.
  - slug: u08-exam-q09
    type: fill_blank
    topic_code: "6.B"
    source: 'Wilfred Owen, "Futility" (1920)'
    points: 1
    stimulus: *futility
    prompt: |
      In line 9 the sun is said to have "Woke, once, the clays of a cold ____," a metaphor for the lifeless early Earth.
    answer: ["star"]
    explanation: |
      "star." Calling the early Earth "a cold star" makes the sun's first awakening of life a cosmic event, which raises the stakes of its failure to wake one man.
  # ---- Set B (unseen): Thomas Hardy, "The Man He Killed"
  - slug: u08-exam-q10
    type: multiple_choice
    topic_code: "4.A"
    source: 'Thomas Hardy, "The Man He Killed" (1902)'
    points: 1
    stimulus: &manKilled |
      *The following poem by Thomas Hardy was first published in 1902, during the Boer War, and collected in* Time's Laughingstocks *(1909).*

      THE MAN HE KILLED

      "Had he and I but met
      By some old ancient inn,
      We should have sat us down to wet
      Right many a nipperkin!

      "But ranged as infantry,   [5]
      And staring face to face,
      I shot at him as he at me,
      And killed him in his place.

      "I shot him dead because—
      Because he was my foe,   [10]
      Just so: my foe of course he was;
      That's clear enough; although

      "He thought he'd 'list, perhaps,
      Off-hand like—just as I—
      Was out of work—had sold his traps—   [15]
      No other reason why.

      "Yes; quaint and curious war is!
      You shoot a fellow down
      You'd treat if met where any bar is,
      Or help to half-a-crown."   [20]
    prompt: |
      The speaker of the poem is best described as
    options:
      - "the poet, reflecting in his study on newspaper reports of the war"
      - "a former infantryman of modest means, speaking aloud in a plain, colloquial voice about a man he killed in battle"
      - "an officer writing a formal report on an engagement"
      - "the dead enemy soldier, imagining the man who shot him"
    option_explanations:
      - "The quotation marks around every stanza and the title's 'He' separate the speaker from the poet; the voice is a character's, not Hardy's own."
      - "Correct. The quotation marks make the poem speech, and the idiom ('wet / Right many a nipperkin', 'Off-hand like', 'half-a-crown') marks a working man who enlisted as the other man did. It is a dramatic monologue in miniature."
      - "Nothing is formal: the speaker hesitates, repeats himself and talks of pubs and loans."
      - "The speaker says 'I shot him dead'; he is the killer, not the killed."
    answer: 1
  - slug: u08-exam-q11
    type: multiple_choice
    topic_code: "3.D"
    source: 'Thomas Hardy, "The Man He Killed" (1902)'
    points: 1
    stimulus: *manKilled
    prompt: |
      The contrast between the first stanza and the second primarily serves to
    options:
      - "show that the same two men would have been drinking companions in one setting and killers of each other in another, exposing how arbitrary their enmity is"
      - "prove that the speaker preferred fighting to drinking"
      - "suggest that the enemy soldier was a criminal who deserved to die"
      - "contrast the cowardice of the enemy with the speaker's courage"
    option_explanations:
      - "Correct. The conditional 'Had he and I but met / By some old ancient inn' imagines friendship; 'But ranged as infantry' turns to killing. The only difference is where the men stand, which is the poem's point."
      - "Nothing suggests preference; the inn is described warmly, the killing flatly."
      - "The speaker can find no fault in the man beyond his being a 'foe', and later imagines him as a jobless man much like himself."
      - "The two men act identically: 'I shot at him as he at me'. The line's symmetry denies any contrast in courage."
    answer: 0
  - slug: u08-exam-q12
    type: multiple_choice
    topic_code: "3.C"
    source: 'Thomas Hardy, "The Man He Killed" (1902)'
    points: 1
    stimulus: *manKilled
    prompt: |
      The dashes and repetition in lines 9-11 ("because— / Because he was my foe, / Just so: my foe of course he was") function primarily to
    options:
      - "show the speaker's confident command of military reasoning"
      - "dramatise the speaker's reasoning faltering as he searches for a justification that will not quite hold"
      - "indicate that the speaker has been interrupted by a listener"
      - "create a pause for the reader to admire the rhyme"
    option_explanations:
      - "Confidence would not stall on 'because—' and then repeat itself; the syntax shows uncertainty."
      - "Correct. The dash breaks the line mid-thought, 'Because' is repeated, and 'Just so', 'of course' and 'That's clear enough' pile up reassurance. The speaker is trying to convince himself, and the stanza ends on the doubt of 'although'."
      - "No listener's words appear; the hesitation belongs to the speaker himself."
      - "The pauses serve the speaker's thinking, not ornament; the reader is drawn into his uncertainty, not into admiring the sound."
    answer: 1
  - slug: u08-exam-q13
    type: multiple_choice
    topic_code: "5.B"
    source: 'Thomas Hardy, "The Man He Killed" (1902)'
    points: 1
    stimulus: *manKilled
    prompt: |
      The phrase "quaint and curious" (line 17) is best described as
    options:
      - "an understatement whose mildness exposes how inadequate ordinary language is to the fact of killing"
      - "a precise technical description of modern warfare"
      - "evidence that the speaker finds war amusing"
      - "an allusion to a famous patriotic speech"
    option_explanations:
      - "Correct. 'Quaint' and 'curious' are words for odd customs or old furniture. Applied to shooting a man one would have treated to a drink, they are so inadequate that the reader feels the gap the speaker cannot put into words."
      - "The words are vague and homely, the opposite of technical."
      - "The hesitations of stanza 3 show discomfort; the mild words cover unease, not amusement."
      - "No speech is recalled; the phrase is colloquial and the speaker's own."
    answer: 0
  - slug: u08-exam-q14
    type: multiple_choice
    topic_code: "4.C"
    source: 'Thomas Hardy, "The Man He Killed" (1902)'
    points: 1
    stimulus: *manKilled
    prompt: |
      Which best describes the speaker's attitude toward the man he killed?
    options:
      - "Righteous hatred of a national enemy"
      - "Unease and a growing sense of kinship, held at arm's length by a casual tone"
      - "Complete indifference"
      - "Fear that the man's comrades will take revenge"
    option_explanations:
      - "He never voices hatred; 'my foe' is a label he repeats without conviction."
      - "Correct. He imagines the man as a drinking companion and as someone who enlisted 'just as I', out of work; the offhand idiom ('Off-hand like', 'quaint and curious') keeps the feeling from breaking through."
      - "A man indifferent would not stall over 'because' or imagine the other man's life; the poem is a record of a mind unsettled."
      - "Nothing mentions revenge or present danger; the speaker reflects on the past."
    answer: 1
  - slug: u08-exam-q15
    type: true_false
    topic_code: "3.D"
    source: 'Thomas Hardy, "The Man He Killed" (1902)'
    points: 1
    stimulus: *manKilled
    prompt: |
      True or false: The speaker explains that he killed the man because the man had personally wronged him.
    answer: false
    explanation: |
      False. The only reason he can give is that the man "was my foe", a label he repeats uneasily. He imagines the man enlisted, as he did, because he "Was out of work", so the poem stresses their likeness rather than any personal wrong.
  - slug: u08-exam-q16
    type: multi_select
    topic_code: "3.C"
    source: 'Thomas Hardy, "The Man He Killed" (1902)'
    points: 2
    partial_credit: true
    stimulus: *manKilled
    prompt: |
      Which of the following accurately describe the poem's structure? Select all that apply.
    options:
      - "Every stanza opens with a quotation mark, presenting the whole poem as one man's speech."
      - "Short rhymed quatrains give the poem the plain movement of a ballad or a pub song."
      - "The final stanza shifts from 'I' to a generalising 'You', turning one man's experience into everyone's."
      - "Each stanza ends with a refrain that repeats the poem's title."
    option_explanations:
      - "Correct. The quotation marks frame the poem as spoken monologue, which keeps the voice that of an ordinary soldier rather than the poet."
      - "Correct. Quatrains rhyming abab in short lines suit the speaker's colloquial voice and make the dark subject sound homely, which sharpens the irony."
      - "Correct. 'You shoot a fellow down / You'd treat' widens the speaker's case into a general truth about war."
      - "There is no refrain; the title's words never recur as a repeated line."
    answer: [0, 1, 2]
  - slug: u08-exam-q17
    type: fill_blank
    topic_code: "5.B"
    source: 'Thomas Hardy, "The Man He Killed" (1902)'
    points: 1
    stimulus: *manKilled
    prompt: |
      In line 13, "'list" is a shortened, colloquial form of the verb ____.
    answer: ["enlist", "to enlist", "enlisted"]
    explanation: |
      "enlist." The apostrophe marks the dropped syllable, and the clipped form belongs to the speaker's spoken idiom. The point is that the dead man joined up casually ("Off-hand like") because he needed work, just as the speaker did.
  # ---- Set C: Thomas Hardy, "The Convergence of the Twain", stanzas I-V
  - slug: u08-exam-q18
    type: multiple_choice
    topic_code: "3.D"
    source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
    points: 1
    stimulus: &twainOpen |
      *The following passage is the first five stanzas of Thomas Hardy's "The Convergence of the Twain (Lines on the loss of the 'Titanic')," written in 1912 and collected in* Satires of Circumstance *(1914).*

      I
      In a solitude of the sea
      Deep from human vanity,
      And the Pride of Life that planned her, stilly couches she.

      II
      Steel chambers, late the pyres
      Of her salamandrine fires,
      Cold currents thrid, and turn to rhythmic tidal lyres.

      III
      Over the mirrors meant
      To glass the opulent
      The sea-worm crawls—grotesque, slimed, dumb, indifferent.

      IV
      Jewels in joy designed
      To ravish the sensuous mind
      Lie lightless, all their sparkles bleared and black and blind.

      V
      Dim moon-eyed fishes near
      Gaze at the gilded gear
      And query: "What does this vaingloriousness down here?" . . .
    prompt: |
      In stanza III, the contrast between "the mirrors meant / To glass the opulent" and the "sea-worm" that crawls over them primarily serves to
    options:
      - "satirise human vanity by showing the objects made to reflect the rich now reflecting a grotesque, indifferent creature"
      - "suggest that the sea-worm is as beautiful as the passengers were"
      - "express the speaker's fascination with marine biology"
      - "show that the mirrors have survived undamaged and can be recovered"
    option_explanations:
      - "Correct. 'Meant' stresses the mirrors' intended purpose; the sea-worm, 'grotesque, slimed, dumb, indifferent', is what they now 'glass'. The gap between purpose and present use mocks the luxury that built them."
      - "The heaped adjectives make the worm repellent, not beautiful; the comparison degrades, it does not elevate."
      - "The creatures matter as satire, not as science; the stanza's point is what has become of 'the opulent'."
      - "Their survival is not the point; their new, absurd use is."
    answer: 0
  - slug: u08-exam-q19
    type: multiple_choice
    topic_code: "6.D"
    source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
    points: 1
    stimulus: *twainOpen
    prompt: |
      The capitalised phrase "the Pride of Life" (stanza I) functions primarily as
    options:
      - "the name of the shipping company that built the liner"
      - "an echo of the New Testament's warning against worldly pride, naming human vanity as the real designer of the ship"
      - "a description of the passengers' joy on the voyage"
      - "a reference to the ship's captain"
    option_explanations:
      - "The phrase is allegorical, not a company name; it is set beside 'human vanity' in the line above."
      - "Correct. The phrase recalls the biblical triad 'the lust of the flesh, and the lust of the eyes, and the pride of life' (1 John 2:16). Personified as the ship's planner, Pride is what now lies at the bottom of the sea."
      - "The poem never describes the passengers at all; the phrase concerns why the ship was built."
      - "No individual is named; the capitals turn an abstraction into an agent, not a person."
    answer: 1
  - slug: u08-exam-q20
    type: multiple_choice
    topic_code: "5.B"
    source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
    points: 1
    stimulus: *twainOpen
    prompt: |
      The inverted, archaic phrasing "stilly couches she" (stanza I) primarily serves to
    options:
      - "picture the great ship lying silently at rest as if in a bed, a quiet image that the later marriage metaphor will darken"
      - "show that the ship is still sailing smoothly"
      - "suggest that the ship is hiding from rescuers"
      - "imitate the speech of the ship's sailors"
    option_explanations:
      - "Correct. To 'couch' is to lie down, as on a bed; 'stilly' adds silence. The ship is pictured at eerie rest, and the inverted word order gives the line a solemn, ceremonial weight that fits the poem's later 'consummation'."
      - "The ship is 'Deep from human vanity' in 'a solitude of the sea'; it lies on the sea floor, not sailing."
      - "A wreck cannot hide; the image is of stillness, not concealment."
      - "The diction is literary and archaic, not a sailor's speech; no sailors appear in the poem."
    answer: 0
  - slug: u08-exam-q21
    type: multiple_choice
    topic_code: "5.C"
    source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
    points: 1
    stimulus: *twainOpen
    prompt: |
      In stanza IV, the jewels "designed / To ravish the sensuous mind" that now "Lie lightless" function as a symbol of
    options:
      - "the lasting value of craftsmanship"
      - "luxury and vanity reduced to nothing, their purpose cancelled by the dark"
      - "the passengers' generosity"
      - "the hope of salvaging the ship's treasure"
    option_explanations:
      - "'Bleared and black and blind' insists the jewels have lost their value; the stanza undoes craftsmanship rather than celebrating it."
      - "Correct. Made only to dazzle, the jewels need light; on the sea floor they are 'lightless', 'bleared and black and blind'. The alliterating b's hammer home that sensuous display has become meaningless."
      - "The jewels were 'designed / To ravish the sensuous mind', for pleasure and display; generosity is not suggested."
      - "No salvage is imagined; the stanza dwells on loss, not recovery."
    answer: 1
  - slug: u08-exam-q22
    type: multiple_choice
    topic_code: "4.C"
    source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
    points: 1
    stimulus: *twainOpen
    prompt: |
      Giving the "moon-eyed fishes" a question in stanza V ("What does this vaingloriousness down here?") primarily conveys the speaker's
    options:
      - "satiric detachment, using the bewildered fish to expose how absurd human pomp looks from outside it"
      - "pity for the fish, who have lost their home"
      - "fear of the deep sea"
      - "admiration for the fish's intelligence"
    option_explanations:
      - "Correct. The fish, 'Dim' and 'moon-eyed', can only stare; their question names the gilded wreck 'vaingloriousness'. The speaker borrows an innocent outside view to mock the pride that sent all that gold to the bottom."
      - "The fish are curious, not dispossessed; the stanza is about how the wreck looks, not about their loss."
      - "The sea floor is shown with cool irony, not fear."
      - "The fish are 'Dim'; the irony lies in how even dull creatures can see the absurdity."
    answer: 0
  - slug: u08-exam-q23
    type: multiple_choice
    topic_code: "3.C"
    source: 'Thomas Hardy, "The Convergence of the Twain" (1912)'
    points: 1
    stimulus: *twainOpen
    prompt: |
      Each stanza of the poem consists of two short lines followed by a much longer line, all three sharing one rhyme (for example, "sea," "vanity," "she"). This structure primarily serves to
    options:
      - "give every stanza a sense of building and then heavy completion, like a fate closing on its object"
      - "imitate a cheerful song sung by the passengers"
      - "show that Hardy could not decide how long his lines should be"
      - "break the poem into unrelated fragments"
    option_explanations:
      - "Correct. The two short lines gather, and the long third line lands on the same rhyme with extra weight, so each stanza closes like a trap. Many readers also see the stanza's shape as a silhouette of a ship's hull or an iceberg."
      - "The tone is solemn and satiric; nothing in the stanza's rhythm is festive, and no passengers sing."
      - "The pattern is exact in every stanza, which shows deliberate design, not indecision."
      - "The shared rhyme binds each stanza tightly, and stanzas VI-XI run as one sentence; the structure unifies rather than fragments."
    answer: 0
  - slug: u08-exam-q24
    type: fill_blank
    topic_code: "5.B"
