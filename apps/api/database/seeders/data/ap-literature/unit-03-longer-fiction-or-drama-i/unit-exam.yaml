  - slug: u03-exam-q43
    type: short_answer
    topic_code: "1.B"
    source: general knowledge
    points: 2
    prompt: |
      Does Victor change by the end of the novel? In two or three sentences, take a position and explain the function of his change or sameness.
    answer: |
      Victor changes only partly. He learns to weigh consequences, as when he destroys the female, and he warns Walton to "avoid ambition," yet he still urges the crew to "be more than men" and allows that another may succeed. His divided ending keeps the novel from becoming a simple lesson, leaving Walton, and the reader, to make the choice Victor never fully makes.
    explanation: |
      1 point: a clear position supported by accurate evidence from Volume III and the ending. 1 point: a function (what the change or sameness reveals, causes or leaves open for the novel's meaning). Either position may earn full credit.

  - slug: u03-exam-q44
    type: short_answer
    topic_code: "7.B"
    source: general knowledge
    points: 2
    prompt: |
      Write a defensible thesis (one or two sentences) about the function of the frame narrative in *Frankenstein* as a whole.
    answer: |
      By opening and closing with Walton, an ambitious and lonely explorer who hears Victor's story and finally turns back, Shelley makes the novel's question not what happened to Victor but whether a listener can learn from it, and Walton's choice suggests that responsibility to others can still be chosen.
    explanation: |
      2 points: an arguable interpretation of what the frame does for the whole novel (warning, mirror, judgment, choice), with a hint of reasoning. 1 point: a defensible but vague claim. 0: plot, a fact about structure, or a restated prompt.

  - slug: u03-exam-q45
    type: long_answer
    topic_code: "7.C"
    source: general knowledge
    points: 6
    prompt: |
      In many works of literature, a character who has been rejected by others seeks acceptance, recognition or revenge. Either from your own reading or from the list below, choose a work of fiction or drama in which a character responds to rejection. Then, in a well-written essay, analyze how the character's response to rejection contributes to an interpretation of the work as a whole.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Provide evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.

      Suggested works: *Frankenstein* (Mary Shelley); *Hamlet* (William Shakespeare); *The Great Gatsby* (F. Scott Fitzgerald); "Miss Brill" (Katherine Mansfield); "Araby" (James Joyce); *A Doll's House* (Henrik Ibsen). You may choose another work of comparable literary merit.
    answer: |
      Model (Frankenstein). Thesis: The creature responds to each rejection by escalating his claim on his maker, from a plea for a hearing to a demand for a companion to revenge, and Shelley uses that escalation to argue that the refusal of recognition, more than any innate evil, turns a being "benevolent and good" into a destroyer, while the creature's final self-condemnation refuses to let rejection excuse what he has done.

      Line of reasoning: (1) First rejections and generosity: the shepherd and villagers; his secret help to the De Laceys; "I was benevolent and good." (2) The decisive rejection and the turn: Felix's blows; "Cursed, cursed creator!"; "rage and revenge"; William and Justine. (3) The demand for recognition: "I am malicious because I am miserable"; the companion as the one being who would not reject him. (4) The final rejection and its consequences: the female destroyed; Clerval and Elizabeth killed; the farewell's "remorse" and resolve to die. Sophistication: the creature as Victor's double (both isolated, both claiming the greater agony), or the tension between the novel's sympathy and its refusal to excuse.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis that interprets how the character's response to rejection contributes to the meaning of the work as a whole. 0 for restating the prompt or for a summary of the rejections.

      Row B Evidence and Commentary (0-4): 1 = mostly summary, evidence general. 2 = some specific evidence, with commentary that asserts rather than explains, or that loses the connection to the work's meaning. 3 = specific, relevant evidence from across the work with commentary that explains how each response to rejection develops the line of reasoning. 4 = all of 3, with consistent, precise commentary linking every piece of evidence to the thesis and showing how the responses develop (escalation, change, consequence).

      Row C Sophistication (0-1): 1 for a complex argument sustained throughout: holding sympathy and judgment together, addressing an alternative reading (the creature as simply monstrous), exploring the maker-creature double, or writing with consistent precision and vividness.
