unit: 3
description: |
  45 questions · about 75 minutes · Unit 3, Longer Fiction or Drama I: Mary Shelley's Frankenstein (1818). Four
  passage sets in the style of Section I of the AP exam: Walton's letters, Waldman's lecture, Victor in the Orkneys,
  and an unseen passage from Nathaniel Hawthorne's "The Birthmark" (1843) that you have not studied. Then questions
  across the whole novel, two short answers and one literary-argument essay (Q3) scored on the AP 6-point rubric.
  Multiple choice, select-all, true/false and fill-in-the-blank items are graded at once; the short answers and the
  essay are graded by your teacher against the scoring notes. Budget about 40 minutes for the essay.
questions:
  # ---- Set 1: Walton's letters (Letters I and II)
  - slug: u03-exam-q01
    type: multiple_choice
    topic_code: "1.A"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: &x1 |
      *The following excerpts are from the first two of Robert Walton's letters to his sister, Margaret Saville, which open Mary Shelley's* Frankenstein *(1818). Excerpt 1 is from Letter I, written in St. Petersburgh; Excerpt 2 is from Letter II, written in Archangel.*

      **Excerpt 1**

      I am already far north of London; and as I walk in the streets of Petersburgh, I feel a cold northern breeze play upon my cheeks, which braces my nerves, and fills me with delight. Do you understand this feeling? This breeze, which has travelled from the regions towards which I am advancing, gives me a foretaste of those icy climes. Inspirited by this wind of promise, my day dreams become more fervent and vivid.

      **Excerpt 2**

      But I have one want which I have never yet been able to satisfy; and the absence of the object of which I now feel as a most severe evil. I have no friend, Margaret: when I am glowing with the enthusiasm of success, there will be none to participate my joy; if I am assailed by disappointment, no one will endeavour to sustain me in dejection.
    prompt: |
      In Excerpt 1, Walton's response to the "cold northern breeze" chiefly reveals
    options:
      - 'his fear of the dangers ahead'
      - 'an eager imagination that reads hostile nature as a promise of the goal he desires'
      - 'his indifference to the voyage'
      - 'his wish to return to London'
    option_explanations:
      - |
        The breeze "braces my nerves, and fills me with delight"; no fear is expressed.
      - |
        Correct. Cold becomes a "foretaste" and a "wind of promise," and his "day dreams become more fervent": desire transforms the warning into an invitation.
      - |
        Delight, fervent day dreams and an appeal to his sister ("Do you understand this feeling?") show intense engagement.
      - |
        He celebrates being "far north of London" and looks forward to the "icy climes."
    answer: 1

  - slug: u03-exam-q02
    type: multiple_choice
    topic_code: "5.B"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x1
    prompt: |
      In Excerpt 1, the phrase "wind of promise" functions primarily to
    options:
      - 'describe the weather accurately for his sister'
      - 'show that Walton turns a physical sensation into a sign of future success, revealing how ambition shapes his perception'
      - 'warn Margaret that the voyage will fail'
      - 'suggest that someone has promised Walton a reward'
    option_explanations:
      - |
        The phrase is interpretive, not meteorological; "promise" is a meaning Walton gives the wind.
      - |
        Correct. The breeze promises nothing in itself; Walton's ambition supplies the meaning, which prepares us for Victor, who also reads nature as an invitation.
      - |
        The phrase is optimistic; the irony that the voyage will be checked is the reader's, not Walton's intention.
      - |
        No person makes a promise; the word is figurative.
    answer: 1

  - slug: u03-exam-q03
    type: multiple_choice
    topic_code: "4.A"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x1
    prompt: |
      The question "Do you understand this feeling?" serves chiefly to
    options:
      - 'establish the epistolary situation, a narrator addressing a particular reader whose sympathy he seeks'
      - 'show that Walton doubts his own feelings'
      - 'reveal that Margaret has asked him about the weather'
      - 'end the letter'
    option_explanations:
      - |
        Correct. Walton writes to his sister, and the direct question draws her (and us) into the frame as his audience, a role every later narrator will also need.
      - |
        He is certain of the feeling ("fills me with delight"); the question seeks agreement rather than expressing doubt.
      - |
        Nothing indicates a prior question from Margaret; the question is rhetorical.
      - |
        The letter continues ("This breeze..."), and the question is in the middle of the paragraph.
    answer: 0

  - slug: u03-exam-q04
    type: multiple_choice
    topic_code: "3.D"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x1
    prompt: |
      Taken together, the two excerpts present a contrast between
    options:
      - 'Walton''s love of London and his dislike of the Arctic'
      - 'Walton''s fervent ambition and his painful lack of anyone to share it with'
      - 'Walton''s honesty and Margaret''s dishonesty'
      - 'the warmth of St. Petersburgh and the cold of Archangel'
    option_explanations:
      - |
        Excerpt 1 rejoices in being "far north of London"; he does not express love for London or dislike of the north.
      - |
        Correct. "Fervent and vivid" dreams in Excerpt 1 set against "I have no friend" in Excerpt 2: the conflict of solitary ambition and human connection.
      - |
        Margaret never speaks; nothing suggests dishonesty.
      - |
        Both places are cold and northern; the contrast is in Walton's inner state, not the climates.
    answer: 1

  - slug: u03-exam-q05
    type: multiple_choice
    topic_code: "3.C"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x1
    prompt: |
      The balanced structure of the last sentence of Excerpt 2 ("when I am glowing with the enthusiasm of success... if I am assailed by disappointment...") emphasizes that
    options:
      - 'Walton expects only success'
      - 'whether he succeeds or fails, his lack of a friend leaves him alone with the result'
      - 'Walton prefers disappointment to success'
      - 'Margaret will share both his joy and his dejection'
    option_explanations:
      - |
        The sentence imagines both outcomes; disappointment is given equal weight.
      - |
        Correct. Parallel clauses cover both possibilities and end the same way, "none" and "no one," so isolation is the constant.
      - |
        He expresses no preference; the point is that both are lonely.
      - |
        Margaret is far away in England; he laments that no one present will share them.
    answer: 1

  - slug: u03-exam-q06
    type: multiple_choice
    topic_code: "3.F"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x1
    prompt: |
      In the novel as a whole, the conflict Walton reveals in Excerpt 2 functions chiefly to
    options:
      - 'explain why Walton hires a crew'
      - 'make Walton a receptive listener for Victor, whose story turns on the same conflict between ambition and human connection, and prepare for Walton''s final choice'
      - 'introduce Margaret as a major character'
      - 'show that Walton and Victor have nothing in common'
    option_explanations:
      - |
        The crew was needed for the voyage in any case; the excerpt concerns friendship, not staffing.
      - |
        Correct. Walton's loneliness makes him value Victor and hear his warning; at the end he chooses his crew's lives over discovery.
      - |
        Margaret remains a silent addressee throughout.
      - |
        The likeness of the two men is the point of the frame.
    answer: 1

  - slug: u03-exam-q07
    type: multi_select
    topic_code: "4.B"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 2
    partial_credit: true
    stimulus: *x1
    prompt: |
      Which effects of the novel's opening in letters are supported by these excerpts? Select all that apply.
    options:
      - 'The reader meets the frame narrator''s desires and weaknesses before hearing Victor''s story.'
      - 'The letters establish an omniscient narrator who knows every character''s thoughts.'
      - 'The letter form creates an intimate, confiding voice addressed to a specific reader.'
      - 'Walton''s ambition and loneliness anticipate patterns in Victor''s narrative.'
    option_explanations:
      - |
        Selected. Ambition in Excerpt 1, loneliness in Excerpt 2, both before Victor appears.
      - |
        Not selected. Walton is a limited first-person narrator; he knows only his own mind.
      - |
        Selected. "Margaret," "Do you understand this feeling?" create intimacy and an addressee.
      - |
        Selected. Victor's secret labour and isolation repeat what Walton confesses here.
    answer: [0, 2, 3]

  # ---- Set 2: Waldman's lecture (Vol. I, Ch. II)
  - slug: u03-exam-q08
    type: multiple_choice
    topic_code: "1.A"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: &x2 |
      *The following passage is from Mary Shelley's* Frankenstein *(1818), Volume I, Chapter II. At the university of Ingolstadt, Victor hears the professor of chemistry, M. Waldman, lecture for the first time.*

      "The ancient teachers of this science," said he, "promised impossibilities, and performed nothing. The modern masters promise very little; they know that metals cannot be transmuted, and that the elixir of life is a chimera. But these philosophers, whose hands seem only made to dabble in dirt, and their eyes to pour over the microscope or crucible, have indeed performed miracles. They penetrate into the recesses of nature, and shew how she works in her hiding places. They ascend into the heavens; they have discovered how the blood circulates, and the nature of the air we breathe. They have acquired new and almost unlimited powers; they can command the thunders of heaven, mimic the earthquake, and even mock the invisible world with its own shadows."
    prompt: |
      Waldman's contrast between "the ancient teachers" and "the modern masters" primarily serves to
    options:
      - 'reject science altogether as a waste of effort'
      - 'praise the modern chemists'' modest promises while crediting them with achievements greater than the ancients'' boasts'
      - 'show that Waldman secretly prefers alchemy'
      - 'warn Victor against the dangers of chemistry'
    option_explanations:
      - |
        He celebrates modern science; only the ancients "performed nothing."
      - |
        Correct. The ancients "promised impossibilities, and performed nothing"; the moderns "promise very little" but "have indeed performed miracles." The reversal is the lecture's argument.
      - |
        He calls the elixir of life "a chimera"; there is no hidden preference for alchemy.
      - |
        No warning is given; the lecture is an inspiring celebration, which is why it moves Victor.
    answer: 1

  - slug: u03-exam-q09
    type: multiple_choice
    topic_code: "5.B"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x2
    prompt: |
      The phrase "whose hands seem only made to dabble in dirt" contributes to the passage chiefly by
    options:
      - 'mocking the modern scientists as incompetent'
      - 'setting a humble, almost comic image of laboratory work against the grand claims that follow, so the "miracles" appear more striking'
      - 'describing the scientists'' poor hygiene literally'
      - 'suggesting that the scientists are farmers'
    option_explanations:
      - |
        "Seem" signals appearance; the sentence turns at "But" to praise them.
      - |
        Correct. The low image of dabbling in dirt and poring over crucibles makes the turn to "performed miracles" all the more dramatic.
      - |
        The image is figurative, describing how lowly the work appears.
      - |
        "Dirt" refers to the substances of chemistry, not agriculture.
    answer: 1

  - slug: u03-exam-q10
    type: multiple_choice
    topic_code: "6.C"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x2
    prompt: |
      Waldman's personification of nature in "shew how she works in her hiding places" suggests that nature is
    options:
      - 'a living, secretive figure whose privacy the scientist penetrates'
      - 'a machine with no secrets'
      - 'a goddess who rewards those who worship her'
      - 'an enemy who has already been defeated'
    option_explanations:
      - |
        Correct. Nature as "she" with "hiding places," and scientists who "penetrate into the recesses": the language of pursuing a concealed figure, which colours Victor's later quest.
      - |
        "Hiding places" means nature has secrets; the personification is the opposite of a machine.
      - |
        Nothing about worship or reward appears; the scientists act on nature, not before her.
      - |
        Nature is still being explored, not described as defeated.
    answer: 0

  - slug: u03-exam-q11
    type: multiple_choice
    topic_code: "3.E"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x2
    prompt: |
      In the plot of the novel, this lecture is significant chiefly because it
    options:
      - 'convinces Victor to abandon natural philosophy'
      - 'redirects Victor''s old dream of power, learned from the alchemists, into modern chemistry, and so sets him on the path to the creation'
      - 'introduces Victor to Clerval'
      - 'reveals the secret of life to Victor'
    option_explanations:
      - |
        The lecture has the opposite effect; Victor devotes himself to chemistry.
      - |
        Correct. Waldman offers "almost unlimited powers" through modern methods; Victor's ambition finds a new route, and nearly two years of work follow.
      - |
        Clerval is Victor's boyhood friend and arrives later; he plays no part in the lecture.
      - |
        Waldman discusses the achievements of science in general; Victor discovers the principle of life himself.
    answer: 1

  - slug: u03-exam-q12
    type: multiple_choice
    topic_code: "3.C"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x2
    prompt: |
      The final sentence of the passage builds to a climax through
    options:
      - 'a series of increasingly grand verbs (command, mimic, mock) that move from natural forces to "the invisible world"'
      - 'a sequence of questions'
      - 'a shift from present to future tense'
      - 'repeated negatives that diminish the scientists'' powers'
    option_explanations:
      - |
        Correct. Commanding thunder, mimicking earthquakes and mocking the invisible world escalate from nature toward the supernatural, the boundary Victor will try to cross.
      - |
        The sentence contains no questions; it is a series of declarations.
      - |
        The tense stays present and present perfect; the climax comes from escalation, not a tense shift.
      - |
        There are no negatives; the sentence expands the scientists' powers.
    answer: 0

  - slug: u03-exam-q13
    type: true_false
    topic_code: "1.C"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x2
    prompt: |
      True or false: The other professor Victor meets at Ingolstadt, Krempe, responds to Victor's reading in the alchemists with the same encouragement Waldman shows here.
    answer: false
    explanation: |
      False. Krempe scorns Victor's reading as nonsense and Victor finds him repellent; Waldman's generous lecture wins him. The contrast between the two professors decides Victor's course.

  # ---- Set 3: Victor in the Orkneys (Vol. III, Ch. III)
  - slug: u03-exam-q14
    type: multiple_choice
    topic_code: "1.B"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: &x3 |
      *The following passage is from Mary Shelley's* Frankenstein *(1818), Volume III, Chapter III. Victor is at work at night in his hut in the Orkneys on the female companion the creature has demanded. Partway through, he looks up and sees the creature at the window.*

      I was now about to form another being, of whose dispositions I was alike ignorant; she might become ten thousand times more malignant than her mate, and delight, for its own sake, in murder and wretchedness. [...] Even if they were to leave Europe, and inhabit the deserts of the new world, yet one of the first results of those sympathies for which the dæmon thirsted would be children, and a race of devils would be propagated upon the earth, who might make the very existence of the species of man a condition precarious and full of terror. [...]

      A ghastly grin wrinkled his lips as he gazed on me, where I sat fulfilling the task which he had allotted to me. [...] As I looked on him, his countenance expressed the utmost extent of malice and treachery. I thought with a sensation of madness on my promise of creating another like to him, and, trembling with passion, tore to pieces the thing on which I was engaged. The wretch saw me destroy the creature on whose future existence he depended for happiness, and, with a howl of devilish despair and revenge, withdrew.
    prompt: |
      Compared with Victor on the night he animated the creature, the first paragraph shows Victor
    options:
      - 'acting without any thought of consequences'
      - 'reasoning about the possible consequences of creating before he completes the act'
      - 'eager to finish so that he can be praised'
      - 'certain that the female will be gentle'
    option_explanations:
      - |
        The paragraph is entirely about consequences: malignancy, children, the "species of man."
      - |
        Correct. Conditional reasoning ("might," "Even if," "would be") marks a change from the "ardour that far exceeded moderation" of Volume I.
      - |
        No hope of praise appears; his thoughts are of danger.
      - |
        He admits he is "ignorant" of her dispositions and fears she may be worse than her mate.
    answer: 1

  - slug: u03-exam-q15
    type: multiple_choice
    topic_code: "4.C"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x3
    prompt: |
      Victor's diction in "a race of devils would be propagated upon the earth" reveals his perspective chiefly by
    options:
      - 'presenting the creature''s possible children in neutral scientific terms'
      - 'casting the creature and his kind as demonic before they exist, a judgment that shapes his decision'
      - 'showing that Victor wants to make many creatures'
      - 'suggesting that Victor pities the future children'
    option_explanations:
      - |
        "Devils" is not neutral; it is moral and religious condemnation.
      - |
        Correct. "Devils," like "dæmon" in the same sentence, decides the nature of beings not yet born, the same prejudgment he made on the night of animation.
      - |
        The sentence expresses horror at the prospect of their multiplying.
      - |
        No pity appears; the children are imagined as a threat to "the species of man."
    answer: 1

  - slug: u03-exam-q16
    type: multiple_choice
    topic_code: "3.F"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x3
    prompt: |
      The conflict in the passage is best described as one between
    options:
      - 'Victor''s promise to the creature and his sense of duty to humankind'
      - 'Victor and Clerval, who wants the work finished'
      - 'the creature and the female, who refuses him'
      - 'Victor and the Scottish authorities'
    option_explanations:
      - |
        Correct. He recalls "my promise of creating another" but fears for "the very existence of the species of man"; the second wins.
      - |
        Clerval is in Perth and knows nothing of the work.
      - |
        The female is never completed and never speaks.
      - |
        No authorities appear; Victor is alone on the island.
    answer: 0

  - slug: u03-exam-q17
    type: multiple_choice
    topic_code: "3.E"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x3
    prompt: |
      In the plot as a whole, the event in the second paragraph functions chiefly as
    options:
      - 'the resolution of the conflict between Victor and the creature'
      - 'the turning point that provokes the creature''s revenge on Clerval and Elizabeth'
      - 'a flashback to the creation of the first creature'
      - 'a dream from which Victor wakes'
    option_explanations:
      - |
        The conflict intensifies; the creature withdraws with "a howl of devilish despair and revenge."
      - |
        Correct. Destroying the female ends the creature's hope and begins the sequence of murders that destroys Victor's circle.
      - |
        The event happens in the present of the story, in the Orkneys.
      - |
        The scene is real; the creature returns soon after to threaten him.
    answer: 1

  - slug: u03-exam-q18
    type: multiple_choice
    topic_code: "5.B"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x3
    prompt: |
      In context, "the thing on which I was engaged" and "the creature on whose future existence he depended for happiness" differ chiefly in that
    options:
      - 'the first is Victor''s dismissive name for the female, while the second recognizes what she meant to the creature'
      - 'they refer to two different objects in the room'
      - 'the first is more emotional than the second'
      - 'both are equally neutral descriptions'
    option_explanations:
      - |
        Correct. "Thing" reduces her to an object Victor can tear apart; the second phrase acknowledges her place in the creature's hopes, sharpening the cost of the act.
      - |
        Both phrases refer to the same half-made female body.
      - |
        "Thing" is flat and dismissive; the second is the one with feeling attached.
      - |
        "Thing" and "creature on whose future existence he depended for happiness" are not equally neutral; the contrast is deliberate.
    answer: 0

  - slug: u03-exam-q19
    type: multiple_choice
    topic_code: "1.A"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x3
    prompt: |
      Victor's statement that the creature's countenance "expressed the utmost extent of malice and treachery" is best understood as
    options:
      - 'an objective report confirmed by the creature''s later words'
      - 'Victor''s interpretation of a face, which immediately precedes and helps justify an act done "with a sensation of madness"'
      - 'evidence that the creature has already harmed Elizabeth'
      - 'a description given by Clerval'
    option_explanations:
      - |
        It is Victor's reading of a "ghastly grin," and his state is not calm; the creature's next words are of despair and revenge, not a confession of treachery.
      - |
        Correct. The narrator reads malice into a face, then acts "trembling with passion"; the sequence lets the reader question the judgment that drives the act.
      - |
        Elizabeth is alive at this point; her death comes on the wedding night.
      - |
        Victor is alone; this is his first-person narration.
    answer: 1

  - slug: u03-exam-q20
    type: multi_select
    topic_code: "7.D"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 2
    partial_credit: true
    stimulus: *x3
    prompt: |
      For the claim "Victor's decision is shaped as much by revulsion as by reason," which details from the passage are relevant evidence? Select all that apply.
    options:
      - '"she might become ten thousand times more malignant than her mate"'
      - '"I thought with a sensation of madness on my promise"'
      - '"trembling with passion, tore to pieces the thing"'
      - '"A ghastly grin wrinkled his lips"'
    option_explanations:
      - |
        Not selected. This is the reasoned part of his decision; it supports "reason," not "revulsion," though it could be used as a concession.
      - |
        Selected. "Madness" shows feeling overwhelming the calm reasoning of the first paragraph.
      - |
        Selected. The act itself is done "trembling with passion," not deliberately.
      - |
        Selected. The sight of the grin is the trigger; the decision follows the look of the face.
    answer: [1, 2, 3]

  - slug: u03-exam-q21
    type: true_false
    topic_code: "1.B"
    source: 'Mary Shelley, Frankenstein (1818)'
    points: 1
    stimulus: *x3
    prompt: |
      True or false: In this passage the creature attacks Victor immediately after the female is destroyed.
    answer: false
    explanation: |
      False. The creature "withdrew" with a howl of despair and revenge. He returns later to threaten Victor ("I shall be with you on your wedding-night"); his revenge falls on Clerval and Elizabeth.

  # ---- Set 4: unseen passage, Hawthorne, "The Birthmark" (1843)
  - slug: u03-exam-q22
    type: multiple_choice
    topic_code: "4.A"
    source: 'Nathaniel Hawthorne, "The Birthmark" (1843)'
    points: 1
    stimulus: &x4 |
      *The following passage is the opening of Nathaniel Hawthorne's short story "The Birthmark" (1843).*

      In the latter part of the last century there lived a man of science, an eminent proficient in every branch of natural philosophy, who not long before our story opens had made experience of a spiritual affinity more attractive than any chemical one. He had left his laboratory to the care of an assistant, cleared his fine countenance from the furnace smoke, washed the stain of acids from his fingers, and persuaded a beautiful woman to become his wife. In those days when the comparatively recent discovery of electricity and other kindred mysteries of Nature seemed to open paths into the region of miracle, it was not unusual for the love of science to rival the love of woman in its depth and absorbing energy. The higher intellect, the imagination, the spirit, and even the heart might all find their congenial aliment in pursuits which, as some of their ardent votaries believed, would ascend from one step of powerful intelligence to another, until the philosopher should lay his hand on the secret of creative force and perhaps make new worlds for himself. We know not whether Aylmer possessed this degree of faith in man's ultimate control over Nature. He had devoted himself, however, too unreservedly to scientific studies ever to be weaned from them by any second passion. His love for his young wife might prove the stronger of the two; but it could only be by intertwining itself with his love of science, and uniting the strength of the latter to his own.
    prompt: |
      The narrator of the passage is best described as
    options:
      - 'Aylmer himself, recalling his marriage'
      - 'a third-person narrator who comments on the period and on Aylmer, but disclaims full knowledge of his mind'
      - 'Aylmer''s wife, writing to her family'
      - 'Aylmer''s assistant, who works in the laboratory'
    option_explanations:
      - |
        Aylmer is "he" throughout; the narrator is outside him.
      - |
        Correct. The narrator generalizes about "those days" and speaks as "we," but admits "We know not whether Aylmer possessed this degree of faith," a limited and commenting voice.
      - |
        The wife is "a beautiful woman" spoken of, not the speaker.
      - |
        The assistant is mentioned once; the voice belongs to a storyteller ("our story").
    answer: 1

  - slug: u03-exam-q23
    type: multiple_choice
    topic_code: "3.F"
    source: 'Nathaniel Hawthorne, "The Birthmark" (1843)'
    points: 1
    stimulus: *x4
    prompt: |
      The central conflict the passage establishes is between
    options:
      - 'Aylmer and his assistant'
      - 'Aylmer''s love of science and his love for his wife'
      - 'Aylmer and the government'
      - 'the wife and her family'
    option_explanations:
      - |
        The assistant merely keeps the laboratory; no conflict with him appears.
      - |
        Correct. "The love of science" may "rival the love of woman," and his love for his wife can win "only... by intertwining itself with his love of science."
      - |
        No public authority appears in the passage.
      - |
        The wife's family is never mentioned; the only people in the passage are Aylmer, his assistant and his wife.
    answer: 1

  - slug: u03-exam-q24
    type: multiple_choice
    topic_code: "5.B"
    source: 'Nathaniel Hawthorne, "The Birthmark" (1843)'
    points: 1
    stimulus: *x4
    prompt: |
      The phrase "a spiritual affinity more attractive than any chemical one" primarily serves to
    options:
      - 'describe a chemical experiment Aylmer performed'
      - 'express love in the vocabulary of science, suggesting that Aylmer understands even love through his discipline'
      - 'reject science as worthless'
      - 'show that Aylmer''s wife is a chemist'
    option_explanations:
      - |
        "Spiritual affinity" refers to love, set against chemical affinity; no experiment is described.
      - |
