week: 9
unit: 3
title: The Creature's Narrative, Evidence and Commentary
topics: ["7.C", "7.D"]
texts:
  - author: Mary Wollstonecraft Shelley
    title: "Frankenstein; or, The Modern Prometheus (Vol. II, Ch. III-IX)"
    year: 1818
    url: https://www.gutenberg.org/ebooks/41445
guide: guides/week-09.md
guide_description: |
  The creature's own story, Volume II, Chapters III-IX of the 1818 text (1831 Ch. 11-17): his first sensations, the
  De Laceys, his reading, rejection, William's murder and the demand for a companion. How to choose relevant and
  sufficient evidence and write commentary that explains rather than restates, with weak and strong models, an
  annotated body paragraph, misreadings and a self-check.
flashcards_description: |
  30 cards on the creature's education and rejection, the De Lacey family, his reading, the events he narrates, and
  the craft of evidence and commentary.

flashcards:
  - front: Commentary → what it is and is not
    back: |
      Your explanation of how evidence supports the claim and how the claim advances the thesis. Not plot summary, not paraphrase of the quotation, not naming a device without its effect.
    topic_code: "7.C"
  - front: Four moves of strong commentary
    back: |
      (a) Make a claim about the evidence; (b) attend to specific words or details; (c) explain their effect on meaning; (d) link explicitly back to the paragraph's claim and the thesis.
    topic_code: "7.C"
  - front: Relevant vs merely on-topic evidence
    back: |
      Relevant evidence bears on the specific claim of the paragraph. On-topic evidence is about the same subject but proves nothing about the claim. The fire episode is on topic for "learning" but not relevant to "learning cruelty."
    topic_code: "7.D"
  - front: Sufficient evidence
    back: |
      Enough well-chosen evidence, from enough of the text, to make the claim convincing. Range matters more than quantity: four short details from four chapters beat one long block quotation.
    topic_code: "7.D"
  - front: Embedding a quotation from Frankenstein
    back: |
      Weave a short quotation into your own grammatical sentence: the creature calls his existence a gift "so wantonly bestowed." Avoid dropping a quotation in as its own sentence.
    topic_code: "7.D"
  - front: Row B of the AP essay rubric → what moves an essay to 4
    back: |
      Specific evidence for every claim, and commentary that consistently explains how the evidence supports the line of reasoning. Summary-heavy essays stall at 1-2.
    topic_code: "7.C"
  - front: The creature's first sensations (Vol. II, Ch. III)
    back: |
      Confused light and dark, hunger, thirst and cold in a forest near Ingolstadt; he finds a cloak, berries and a brook, and watches the moon. A newborn's education, alone.
    topic_code: "1.B"
  - front: The creature and fire
    back: |
      He finds embers left by travellers, is burned, learns that fire warms and cooks, and dries wood beside it. Prometheus's gift discovered by the made being himself.
    topic_code: "6.D"
  - front: The shepherd and the village
    back: |
      A shepherd flees at the sight of him; villagers attack him and he escapes. The first violence in his narrative is done to him, before he harms anyone.
    topic_code: "3.E"
  - front: The hovel and the crevice
    back: |
      He shelters in a lean-to against a cottage and watches the family through a small crevice. He sees without being seen: the position of a reader.
    topic_code: "2.A"
  - front: The De Lacey family → who they are
    back: |
      Old De Lacey, blind, and his children Felix and Agatha; once wealthy in Paris, ruined and exiled. Later joined by Safie.
    topic_code: "1.A"
  - front: The creature stops stealing from the cottagers
    back: |
      When he sees they go hungry and give their food to the old man, he lives on roots and nuts instead, and secretly gathers their firewood. His first recorded moral choices are generous.
    topic_code: "1.A"
  - front: The reflection in the pool
    back: |
      Seeing himself in water, he is horrified and realizes he is the monster others see. Self-knowledge arrives as self-rejection.
    topic_code: "1.B"
  - front: Safie → who she is and what she brings
    back: |
      An Arabian woman, daughter of a Turkish merchant, who comes seeking Felix. As Felix teaches her the language, the creature learns along with her.
    topic_code: "1.A"
  - front: Volney's Ruins of Empires
    back: |
      The book Felix uses to teach Safie. Through it the creature hears of empires, wealth, rank and injustice, and asks what he is in such a world.
    topic_code: "7.D"
  - front: The De Laceys' history (Vol. II, Ch. VI)
    back: |
      Felix helped Safie's father, a Turkish merchant unjustly condemned in Paris, to escape; the family was stripped of fortune and exiled, and the merchant betrayed them. Safie fled to find Felix.
    topic_code: "3.E"
  - front: The three books in the portmanteau
    back: |
      Paradise Lost, a volume of Plutarch's Lives and The Sorrows of Werter. He reads them as true histories: feeling from Werter, public virtue from Plutarch, his own story in Milton.
    topic_code: "6.D"
  - front: "\"Like Adam, I was created apparently united by no link to any other being\""
    back: |
      The creature measures himself against Adam and finds every blessing missing; he ends "wretched, helpless, and alone." The allusion turns Milton into evidence of his abandonment.
    topic_code: "7.C"
  - front: "\"I considered Satan as the fitter emblem of my condition\""
    back: |
      His likeness to Satan is envy at others' bliss, not pride or rebellion. The allusion locates the origin of malice in exclusion.
    topic_code: "7.C"
  - front: Victor's journal in the creature's pocket
    back: |
      In the clothes he took from the laboratory he finds Victor's record of the months before the creation. He reads his own origin and his maker's disgust.
    topic_code: "3.E"
  - front: "\"Cursed creator! Why did you form a monster so hideous...?\""
    back: |
      His response to reading Victor's journal (Vol. II, Ch. VII): even his maker "turned from me in disgust." The first open accusation of Victor in his narrative.
    topic_code: "3.F"
  - front: The interview with old De Lacey
    back: |
      He reveals himself to the blind father, who listens kindly; Felix, Agatha and Safie return, and Felix strikes him and drives him away. Blindness is the only condition of acceptance.
    topic_code: "3.E"
  - front: "\"Cursed, cursed creator! Why did I live?\" (Vol. II, Ch. VIII)"
    back: |
      The chapter's first words, after the family's rejection. "So wantonly bestowed" accuses Victor of careless making; "rage and revenge" replace longing. The hinge of his account.
    topic_code: "7.C"
  - front: The burning of the cottage
    back: |
      The family leaves for good; the creature sets fire to the cottage and dances around it. Destruction of the home he watched becomes his first act of revenge.
    topic_code: "3.E"
  - front: The girl in the river
    back: |
      On his journey to Geneva he saves a girl from drowning, and the man with her shoots him. Even rescue is answered with violence.
    topic_code: "3.E"
  - front: William's murder from the creature's side
    back: |
      Near Geneva he seizes a child, hoping to educate a companion untainted by prejudice; the boy names his father, a Frankenstein, and the creature strangles him. A deliberate act against an innocent.
    topic_code: "3.F"
  - front: The miniature and Justine
    back: |
      He takes the portrait from William and places it in the folds of the dress of a woman sleeping in a barn, so she will be blamed. Calculated cruelty, which complicates his claim of purely reactive malice.
    topic_code: "1.B"
  - front: "\"I am malicious because I am miserable\""
    back: |
      The creature's own thesis, Vol. II, Ch. IX. A good essay weighs it against the evidence he supplies: generosity first, rejection next, and then a murder of a child who did him no harm.
    topic_code: "7.D"
  - front: The demand for a companion
    back: |
      A female as deformed as himself, with whom he will live in the wilds of South America, away from humankind. Victor refuses, then consents.
    topic_code: "3.E"
  - front: Sympathetic narrator vs reliable narrator
    back: |
      A narrator can win our sympathy without being fully reliable. The creature is persuasive, but he tells his story to get something from Victor.
    topic_code: "4.B"

quiz:
  description: |
    24 questions · about 40 minutes · about 45% this week (evidence and commentary, on the creature's narrative,
    Vol. II, Ch. III-IX) and 55% spiral review (change, events, conflict, thesis, contrast, word choice and
    narration). Multiple choice, select-all and true/false are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the prose-analysis essay are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Passage set: the creature reads Paradise Lost (Vol. II, Ch. VII)
    - slug: u03-w09-q01
      type: multiple_choice
      topic_code: "7.C"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: &s9 |
        *The following passage is from Mary Shelley's* Frankenstein *(1818), Volume II, Chapter VII. The creature, telling Victor his story, describes the books he found in a portmanteau in the woods.*

        But Paradise Lost excited different and far deeper emotions. I read it, as I had read the other volumes which had fallen into my hands, as a true history. It moved every feeling of wonder and awe, that the picture of an omnipotent God warring with his creatures was capable of exciting. I often referred the several situations, as their similarity struck me, to my own. Like Adam, I was created apparently united by no link to any other being in existence; but his state was far different from mine in every other respect. He had come forth from the hands of God a perfect creature, happy and prosperous, guarded by the especial care of his Creator; he was allowed to converse with, and acquire knowledge from beings of a superior nature: but I was wretched, helpless, and alone. Many times I considered Satan as the fitter emblem of my condition; for often, like him, when I viewed the bliss of my protectors, the bitter gall of envy rose within me.
      prompt: |
        A student claims: "The creature's reading of Milton shows that his isolation, not his nature, is the source of his bitterness." Which piece of commentary best supports this claim?
      options:
        - 'The creature compares himself to Adam and Satan, which is an allusion to Paradise Lost.'
        - 'Every blessing he lists for Adam is a relationship ("guarded," "allowed to converse"), and his own list ends on "alone"; when envy rises, it rises at the sight of others'' "bliss," so the bitterness grows from exclusion.'
        - 'The creature likes Paradise Lost more than his other books.'
        - 'This quote shows that the creature is sad and wishes he had friends.'
      option_explanations:
        - |
          This names the device but explains nothing; it would be equally true whatever the claim, so it does no argumentative work.
        - |
          Correct. It attends to specific words, explains their effect, and links the evidence to the claim about isolation as the source of envy.
        - |
          A preference is not commentary; it neither analyzes the passage nor connects it to bitterness or isolation.
        - |
          A vague paraphrase ("sad") with no attention to how the words work; it restates rather than explains.
      answer: 1

    - slug: u03-w09-q02
      type: multiple_choice
      topic_code: "3.D"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s9
      prompt: |
        The contrast between Adam, "guarded by the especial care of his Creator," and the creature, "wretched, helpless, and alone," primarily functions to
      options:
        - 'show that the creature thinks Adam was undeserving'
        - 'measure Victor''s neglect against the care a creator owes, implicitly indicting Victor'
        - 'prove that the creature was made by God'
        - 'suggest that the creature has misunderstood Milton'
      option_explanations:
        - |
          He expresses no resentment of Adam; the contrast is used to define his own lack.
        - |
          Correct. The only difference he names is care: Adam had a guardian maker, he had none, so the contrast becomes an accusation against Victor.
        - |
          He contrasts himself with God's creation precisely because his maker is Victor; the point is the difference between the two creators.
        - |
          His reading is coherent and precise: he identifies the relationship between maker and made at the centre of the poem.
      answer: 1

    - slug: u03-w09-q03
      type: multiple_choice
      topic_code: "6.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s9
      prompt: |
        In calling Satan "the fitter emblem of my condition," the creature most nearly means that
      options:
        - 'he intends to wage war on God as Satan did'
        - 'Satan''s envy of a bliss he is shut out from represents his own state better than Adam''s happiness does'
        - 'he believes he is literally a fallen angel'
        - 'he admires Satan''s pride and wishes to imitate it'
      option_explanations:
        - |
          He identifies a shared feeling, envy, not a plan of rebellion; the comparison describes his condition.
        - |
          Correct. "Emblem" signals a figurative representation; the likeness lies in viewing others' bliss and feeling "the bitter gall of envy."
        - |
          He uses Satan as an "emblem," a figure; he does not claim to be an angel.
        - |
          Pride is not mentioned; the feeling he shares with Satan is envy, and he describes it as bitter, not admirable.
      answer: 1

    - slug: u03-w09-q04
      type: multiple_choice
      topic_code: "1.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s9
      prompt: |
        Which best describes how reading Paradise Lost changes the creature?
      options:
        - 'It turns him from a creature who knows only his surroundings into one who understands his situation as a story of abandonment, giving him the terms for his later accusations of Victor.'
        - 'It makes him content with his solitude.'
        - 'It leaves him unchanged, since he does not believe it.'
        - 'It convinces him to return to Victor''s laboratory to be unmade.'
      option_explanations:
        - |
          Correct. He "referred the several situations... to my own," gaining a framework (Adam, Creator, Satan) that he uses at Montanvert: "I ought to be thy Adam."
        - |
          The passage ends in envy and bitterness; reading deepens his sense of exclusion rather than reconciling him to it.
        - |
          He reads it "as a true history," and it "moved every feeling of wonder and awe": he believes it entirely.
        - |
          Nothing in the passage suggests this; he goes on to seek acceptance from the De Laceys and later to confront Victor.
      answer: 0

    - slug: u03-w09-q05
      type: multiple_choice
      topic_code: "7.D"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s9
      prompt: |
        For the claim "the creature's education deepens his misery rather than relieving it," which detail from the passage is the most relevant evidence?
      options:
        - '"I read it, as I had read the other volumes which had fallen into my hands"'
        - '"It moved every feeling of wonder and awe"'
        - '"when I viewed the bliss of my protectors, the bitter gall of envy rose within me"'
        - '"Paradise Lost excited different and far deeper emotions"'
      option_explanations:
        - |
          This tells how he read, not what reading did to him; it is on topic but does not bear on misery.
        - |
          Wonder and awe are not misery; this detail would support a different claim about the power of reading.
        - |
          Correct. Reading supplies the emblem of Satan and the language of envy, so knowledge sharpens his pain at what he lacks.
        - |
          "Deeper emotions" is suggestive but unspecified; it does not show that the emotions are miserable.
      answer: 2

    - slug: u03-w09-q06
      type: multiple_choice
      topic_code: "4.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s9
      prompt: |
        The creature's statement that he read Paradise Lost "as a true history" affects the narrative chiefly by
      options:
        - 'showing that he is an unreliable narrator who invents his reading'
        - 'revealing a literal-minded reader whose innocent belief makes the poem a direct mirror of his life, increasing the reader''s sympathy'
        - 'proving that the events of Paradise Lost are historically true'
        - 'signalling that Victor has added this detail to the creature''s story'
      option_explanations:
        - |
          Reading as history shows inexperience, not invention; nothing suggests he is lying about his books.
        - |
          Correct. Taking Milton literally, he applies its story of maker and creature to himself, and the reader sees the pathos of a first reader who has no other account of who he is.
        - |
          The creature's belief says something about him, not about the poem; the novel does not endorse it as fact.
        - |
          Victor reports the narrative but nothing signals an addition here; the detail belongs to the creature's account of his education.
      answer: 1

    - slug: u03-w09-q07
      type: multi_select
      topic_code: "7.D"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 2
      partial_credit: true
      stimulus: *s9
      prompt: |
        Which of the following claims could this passage, by itself, provide relevant evidence for? Select all that apply.
      options:
        - 'The creature understands his relation to Victor through the model of a creator and his creature.'
        - 'The creature''s reading gives him a vocabulary for his isolation.'
        - 'The creature planned William''s murder before he left the cottage.'
        - 'The creature presents envy, not innate evil, as the source of his likeness to Satan.'
      option_explanations:
        - |
          Selected. Adam "guarded by the especial care of his Creator" is set against his own state; the maker-made model is explicit.
        - |
          Selected. "Wretched, helpless, and alone," "emblem" and "bitter gall of envy" are the terms Milton gives him.
        - |
          Not selected. The passage says nothing about William, whom he has not yet met; this claim would need evidence from Vol. II, Ch. VIII.
        - |
          Selected. The likeness lies in envying "the bliss of my protectors," a feeling with a cause.
      answer: [0, 1, 3]

    - slug: u03-w09-q08
      type: multiple_choice
      topic_code: "5.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s9
      prompt: |
        The phrase "the bitter gall of envy" contributes to the passage by
      options:
        - 'presenting envy as a physical, bodily bitterness that rises in him involuntarily'
        - 'suggesting that the creature is ill from bad food'
        - 'showing that the creature feels no emotion toward the cottagers'
        - 'indicating that he admires the cottagers without any pain'
      option_explanations:
        - |
          Correct. Gall is bile, proverbially bitter; envy "rose within me" like a bodily fluid, so the feeling appears to happen to him rather than be chosen.
        - |
          The gall is figurative; the subject is emotion at the sight of bliss, not diet.
        - |
          He calls them "my protectors" and envies their bliss; the phrase expresses strong emotion.
        - |
          Envy is painful by definition, and "bitter" stresses the pain alongside the admiration.
      answer: 0

    - slug: u03-w09-q09
      type: long_answer
      topic_code: "7.C"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 6
      stimulus: *s9
      prompt: |
        Read carefully the passage above from Mary Shelley's *Frankenstein* (1818), in which the creature describes his reading of Milton's *Paradise Lost*. In a well-written essay, analyze how Shelley uses literary elements and techniques to convey the creature's complex understanding of himself.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Through a pointed comparison with Adam, a cumulative list of lacks and a self-chosen emblem in Satan, Shelley shows the creature understanding himself as both the wronged creation and the envious outcast, a double self-knowledge that indicts Victor while admitting the bitterness it has produced.

        Line of reasoning: (1) The reading frame: he reads "as a true history" and refers "the several situations... to my own," so Milton becomes the creature's mirror; the naive literalism makes his self-interpretation sincere. (2) The Adam comparison: one likeness ("united by no link to any other being") and then total difference; Adam's blessings ("guarded by the especial care of his Creator," "allowed to converse") are relationships, and the creature's tricolon "wretched, helpless, and alone" ends on isolation. The contrast indicts Victor without naming him. (3) The Satan emblem: "fitter emblem" is a choice; the likeness is envy at "the bliss of my protectors," and "bitter gall" makes it bodily and involuntary. He sees himself as both victim and someone becoming malignant. Sophistication: noting that the creature's self-portrait anticipates "I ought to be thy Adam; but I am rather the fallen angel" at Montanvert, or that a creature reading the story of a creator is a figure for the novel's own readers.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible interpretation of the creature's self-understanding (e.g., he sees himself as abandoned Adam and envious Satan at once; reading makes him aware of his exclusion). 0 for "Shelley uses allusion and diction to show the creature's self-understanding" with no interpretation.

        Row B Evidence and Commentary (0-4): 1 = summarizes the passage or lists the allusions. 2 = relevant quotations with commentary that explains the allusion in general (Adam was happy, Satan was bad) but not the creature's complex self-understanding. 3 = specific evidence from at least two moves in the passage (the reading frame, the Adam contrast, the Satan emblem) with commentary that explains how each shapes his self-understanding and supports a line of reasoning. 4 = all of 3, with consistent attention to specific words ("true history," "apparently," "guarded," "alone," "emblem," "gall") and commentary that connects each point to the thesis.

        Row C Sophistication (0-1): 1 for sustained complexity: e.g., recognizing that the creature claims both victimhood and malice, examining his reliability as a narrator with a purpose, or connecting the passage to the novel's argument about creators' duties (and the epigraph). A one-line gesture to "today's world" does not earn the point.

    # ---- Passage set: the turn (Vol. II, Ch. VIII)
    - slug: u03-w09-q10
      type: multiple_choice
      topic_code: "5.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: &s9b |
        *The opening of Volume II, Chapter VIII of* Frankenstein *(1818). The creature has just been driven from the De Laceys' cottage.*

        Cursed, cursed creator! Why did I live? Why, in that instant, did I not extinguish the spark of existence which you had so wantonly bestowed? I know not; despair had not yet taken possession of me; my feelings were those of rage and revenge.
      prompt: |
        In context, the word "wantonly" primarily serves to
      options:
        - 'praise Victor''s generosity in giving life'
        - 'accuse Victor of making life carelessly and irresponsibly, without regard for its consequences'
        - 'suggest that the creature''s life was given by accident'
        - 'show that the creature is uncertain who made him'
      option_explanations:
        - |
          The sentence curses the creator; "wantonly" turns "bestowed" from a gift into a reckless act.
        - |
          Correct. Wanton means heedless or undisciplined; it places responsibility for the creature's suffering on the manner of his making.
        - |
          Victor worked nearly two years to give life; the charge is not accident but irresponsibility.
        - |
          He addresses his "creator" directly and has read Victor's journal; he knows exactly who made him.
      answer: 1

    - slug: u03-w09-q11
      type: multiple_choice
      topic_code: "3.E"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s9b
      prompt: |
        Placing these sentences at the opening of a new chapter, immediately after the rejection at the cottage, functions to
      options:
        - 'mark the rejection as the event that converts the creature''s longing into "rage and revenge"'
        - 'show that the creature has forgotten the De Laceys'
        - 'introduce the creature''s first experience of fire'
        - 'signal that the creature''s narrative is ending'
      option_explanations:
        - |
          Correct. The chapter break makes the rejection a hinge; what follows, the burning of the cottage and William's murder, comes from the feelings named here.
        - |
          The curse is a response to the De Laceys' rejection; they are the immediate cause of it.
        - |
          The fire episode came in Vol. II, Ch. III; here he will burn the cottage, a different and later act.
        - |
          Two chapters of his narrative remain, including William's murder and his demand.
      answer: 0

    - slug: u03-w09-q12
      type: multiple_choice
      topic_code: "7.C"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s9b
      prompt: |
        A student uses "the spark of existence" as evidence. Which commentary best connects it to a thesis about the novel's structure of answering narratives?
      options:
        - 'The creature uses a metaphor of a spark.'
        - 'The phrase echoes Victor''s own words on the night of animation, when he sought to "infuse a spark of being"; the creature answers Victor''s account of that night with its cost.'
        - 'The creature wants to start a fire.'
        - 'This phrase shows that the creature is angry.'
      option_explanations:
        - |
          Identification without explanation; it does not connect the evidence to structure or thesis.
        - |
          Correct. It links the two narrations through a verbal echo and explains what the echo does: the made being's story replies to the maker's.
        - |
          A literal misreading; "spark of existence" is his life, not a plan for fire, though he does burn the cottage later.
        - |
          The anger is in "rage and revenge"; this commentary ignores what the specific phrase contributes.
      answer: 1

    # ---- Evidence, commentary and the narrative
    - slug: u03-w09-q13
      type: multiple_choice
      topic_code: "7.D"
      source: general knowledge
      points: 1
      prompt: |
        For the claim "the first violence in the creature's narrative is done to him, not by him," which evidence is the most relevant?
      options:
        - 'He learns that fire both warms and burns.'
        - 'A shepherd flees at the sight of him and villagers attack him before he has harmed anyone.'
        - 'He learns the names Felix and Agatha.'
        - 'He finds a portmanteau containing three books.'
      option_explanations:
        - |
          On topic for his education but irrelevant to violence by others.
        - |
          Correct. These are the first human responses he meets, and they are violent toward a being who has done nothing.
        - |
          Learning names concerns language, not violence.
        - |
          The books matter to his self-understanding but say nothing about who first used violence.
      answer: 1

    - slug: u03-w09-q14
      type: multiple_choice
      topic_code: "7.D"
      source: general knowledge
      points: 1
      prompt: |
        A student supports the thesis "the creature becomes violent only after repeated rejection" with a single quotation: "I was benevolent and good; misery made me a fiend." What is the main weakness of this evidence?
      options:
        - 'It is too short to quote.'
        - 'It is the creature''s own assertion of the thesis, not evidence for it; sufficient support would draw on the episodes his narrative records across several chapters.'
        - 'It comes from the wrong novel.'
        - 'It contradicts the thesis.'
      option_explanations:
        - |
          Short quotations are often best; length is not the problem.
        - |
          Correct. Quoting a character's claim restates the thesis. The shepherd, the villagers, the De Laceys and the man at the river supply the range of evidence the claim needs.
        - |
          The line is from Frankenstein, Vol. II, Ch. II.
        - |
          It agrees with the thesis; the issue is sufficiency, not contradiction.
      answer: 1

    - slug: u03-w09-q15
      type: multiple_choice
      topic_code: "7.C"
      source: general knowledge
      points: 1
      prompt: |
        Which sentence is commentary rather than summary or paraphrase?
      options:
        - 'The creature then reveals himself to old De Lacey, who is blind.'
        - 'The creature says he wishes he had friends.'
