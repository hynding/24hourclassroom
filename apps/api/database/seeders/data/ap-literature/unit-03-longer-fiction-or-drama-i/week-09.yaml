      source: 'Mary Shelley, Frankenstein (1818)'
      points: 2
      prompt: |
        A student writes: "The creature says 'I am malicious because I am miserable.' This quote shows that he is mean because he is sad." Rewrite the commentary (two or three sentences) so that it explains how the line supports a claim about the novel.
      answer: |
        The creature's sentence turns his own character into an argument about cause: "because" makes malice a consequence, and misery, which others inflicted, its origin. Placed after a narrative of rejection by the shepherd, the villagers and the De Laceys, the line asks Victor, and the reader, to hold the maker responsible for what the made being has become.
      explanation: |
        1 point: replaces paraphrase with analysis of specific language or placement (e.g., "because" as causal claim; the line's position after the narrative). 1 point: connects the analysis to a claim about the novel (responsibility, nature versus nurture, the creature as advocate). Merely restating "he is mean because he is sad" earns 0.

