      answer: |
        First, learning from Volney with Safie teaches him about rank, wealth and descent, and he asks what he is, since he has none of them. Second, reading Victor's journal tells him exactly how he was made and that his maker turned from him in disgust. Together they show both kinds of knowledge he acquires, of society and of himself, producing a sharper sense of exclusion, so the claim rests on more than one episode.
