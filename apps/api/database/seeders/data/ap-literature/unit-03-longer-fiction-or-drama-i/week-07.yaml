    - slug: u03-w07-q15
      type: multiple_choice
      topic_code: "3.B"
      source: general knowledge
      points: 1
      prompt: |
        In Volume I, Caroline Frankenstein dies of scarlet fever, caught while nursing Elizabeth, just before Victor leaves for the university at Ingolstadt. The best explanation of the function of placing these events in this sequence is that it
      options:
        - 'delays Victor''s departure for several years'
        - 'links Victor''s entry into science to a fresh experience of death, so that his wish to overcome death has a personal source'
        - 'shows that Victor blames Elizabeth for his mother''s death and leaves to escape her'
        - 'proves that Victor had already created the creature before leaving Geneva'
      option_explanations:
        - |
          The death comes just before the departure; it is not presented as a long delay that structures the plot.
        - |
          Correct. Loss immediately precedes study; a reader can connect Victor's later project of "infusing life into an inanimate body" to the grief that sends him off.
        - |
          Victor shows no blame toward Elizabeth; he describes her with tenderness, and his mother entrusts the family's future to her.
        - |
          The creation happens at Ingolstadt after nearly two years of study; nothing is created in Geneva.
