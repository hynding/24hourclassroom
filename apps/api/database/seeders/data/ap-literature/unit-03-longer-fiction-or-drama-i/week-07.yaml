week: 7
unit: 3
title: Frames, Ambition and Conflict in Frankenstein's Opening
topics: ["3.F", "7.B"]
texts:
  - author: Mary Wollstonecraft Shelley
    title: "Frankenstein; or, The Modern Prometheus (Letters I-IV; Vol. I, Ch. I-IV)"
    year: 1818
    url: https://www.gutenberg.org/ebooks/41445
guide: guides/week-07.md
guide_description: |
  The opening of Frankenstein in the 1818 text: Walton's four letters and Victor's narrative through the night of
  animation (Vol. I, Ch. I-IV; 1831 Ch. 1-5). How the frame narrative works, the internal and external conflicts it
  sets up, four worked close readings, and the move from observation to a defensible thesis, with weak and strong
  models, an annotated body paragraph, common misreadings and a self-check.
flashcards_description: |
  32 cards on the frame narrative, the characters and events of Letters I-IV and Volume I, Chapters I-IV, the
  conflicts they set up, and what makes a thesis defensible.

flashcards:
  - front: Frankenstein (1818) → edition, format and first publication
    back: |
      Published anonymously in London on 1 January 1818 in three volumes, dedicated to William Godwin. Chapter numbers restart in each volume. The revised 1831 edition numbers 24 chapters straight through and adds Mary Shelley's introduction.
    topic_code: "3.C"
  - front: Frankenstein 1818 vs 1831 → three differences worth knowing
    back: |
      1831 adds the author's introduction about the 1816 ghost-story contest, makes Elizabeth an adopted orphan rather than Victor's cousin, and adds passages where Victor blames destiny. 1831 also splits the first chapter in two, so its chapter numbers run one ahead.
    topic_code: "3.C"
  - front: The Modern Prometheus → what the subtitle alludes to
    back: |
      Prometheus, the Titan who stole fire from the gods for humankind and was punished for it; in some versions he also shaped people from clay. The subtitle casts Victor as a defiant maker whose gift brings suffering.
    topic_code: "6.B"
  - front: Frankenstein's epigraph → source and point
    back: |
      Milton, Paradise Lost: Adam asks his Maker whether he requested to be moulded from clay. It predicts the creature's complaint that he never asked to be made, and frames the novel as a question about a creator's duties.
    topic_code: "3.F"
  - front: Robert Walton → who he is
    back: |
      An English explorer sailing toward the North Pole, writing letters to his sister, Margaret Saville, in England. He is ambitious, self-taught, and lonely; he becomes Victor's listener and, at the end, the creature's.
    topic_code: "1.A"
  - front: Walton's four letters → where and when
    back: |
      Letter I, St. Petersburgh, 11 December; Letter II, Archangel, 28 March; Letter III, 7 July, a short note that all is well; Letter IV, 5 August, with journal entries for 13 and 19 August, after the ship is trapped in ice and Victor is taken aboard.
    topic_code: "3.A"
  - front: Frame narrative → how Frankenstein nests its tellers
    back: |
      Walton's letters frame Victor's narration; in Volume II Victor's narration frames the creature's. Three first-person narrators, each telling a listener with a reason to hear. Every story arrives filtered through at least one other teller.
    topic_code: "3.C"
  - front: Why the novel begins near its end
    back: |
      Walton meets Victor in the Arctic after the disasters have happened, so suspense moves from what will happen to how and why. It also makes Victor a retrospective narrator who knows the ending as he tells the beginning.
    topic_code: "3.A"
  - front: Walton as Victor's foil
    back: |
      Both are ambitious, isolated and hungry for discovery; Walton seeks the secret of the magnet and an unknown polar sea, Victor the principle of life. Their likeness lets Victor's story act as a warning to a man still able to turn back.
    topic_code: "3.D"
  - front: "\"I have no friend, Margaret\" → what it reveals"
    back: |
      Walton's ambition and his loneliness are one condition: he will have no one to share success or ease failure. The line sets up the novel's test of solitary achievement against human connection, a complaint the creature later repeats.
    topic_code: "3.F"
  - front: The cold northern breeze (Letter I) → its function
    back: |
      Walton feels the polar wind as a "foretaste" and "wind of promise" that fills him with delight. He reads a hostile nature as an invitation, so the first conflict in the book, man against ice, is one the man desires.
    topic_code: "2.A"
  - front: The figure on the dog-sledge (Letter IV)
    back: |
      On 31 July, with the ship trapped in ice, the crew sees a gigantic figure on a sledge drawn by dogs crossing the ice. The next morning they rescue a half-frozen stranger, Victor, who is pursuing it.
    topic_code: "3.A"
  - front: Victor's warning to Walton → "a serpent to sting you"
    back: |
      In Letter IV Victor tells Walton he hopes the gratification of his wishes may not be "a serpent to sting you, as mine has been." Victor tells his story as a cautionary tale aimed at a listener on the same path.
    topic_code: "3.F"
  - front: Elizabeth in the 1818 text
    back: |
      Victor's cousin, the daughter of his father's sister, adopted into the Frankenstein household as a child and raised as his companion and intended wife. (In 1831 she is an orphan the family adopts.)
    topic_code: "1.A"
  - front: Henry Clerval → role in Volume I
    back: |
      Victor's boyhood friend, drawn to languages, poetry and moral questions rather than science. He arrives at Ingolstadt the morning after the animation and nurses Victor through months of fever.
    topic_code: "1.A"
  - front: Cornelius Agrippa → what happens when Victor finds him
    back: |
      At thirteen, at an inn near Thonon, Victor finds a volume of Agrippa. His father glances at it and calls it "sad trash" without explaining why; Victor reads on, and the alchemists shape his ambition.
    topic_code: "3.B"
  - front: The blasted oak → what it shows Victor
    back: |
      At about fifteen Victor watches lightning destroy an old oak near the house. The sight of nature's power, and the talk of electricity that follows, turns him from the old alchemists toward modern natural philosophy.
    topic_code: "3.B"
  - front: Caroline Frankenstein's death → sequence and function
    back: |
      She catches scarlet fever nursing Elizabeth and dies just before Victor leaves for Ingolstadt. Placing loss directly before his studies links his ambition to a wish to defeat death.
    topic_code: "3.B"
  - front: Krempe vs Waldman
    back: |
      Krempe scorns Victor's reading in the alchemists as wasted time; Waldman praises the modern chemists who "have indeed performed miracles." The contrast decides Victor's course: he follows the teacher who flatters his hopes.
    topic_code: "3.D"
  - front: "\"Learn from me...how dangerous is the acquirement of knowledge\""
    back: |
      Victor interrupts his story (Vol. I, Ch. III) to address Walton directly. The interruption reminds us that the frame is active and that Victor's account is an argument; whether knowledge or its secret, isolated pursuit is the danger is open to debate.
    topic_code: "7.B"
  - front: "\"A new species would bless me as its creator\""
    back: |
      Victor's dream while working (Vol. I, Ch. III): grateful beings who would owe him more than any child owes a father. The parental language makes his later abandonment of the creature a betrayal of the role he imagined.
    topic_code: "3.F"
  - front: Nearly two years → why the length of Victor's labour matters
    back: |
      Victor works nearly two years in secret, neglecting letters, health and the seasons. The isolation is part of the cause, not just background: the creation is a product of solitude.
    topic_code: "3.F"
  - front: The night of animation → date and setting details
    back: |
      A "dreary night of November," one in the morning, rain on the panes, a candle nearly burnt out. Gothic gloom and a half-extinguished light frame the moment of supposed enlightenment.
    topic_code: "2.A"
  - front: "\"Beautiful!—Great God!\" → how the sentence works"
    back: |
      Victor repeats his own design word as an exclamation and the dash cuts it off. Plan and result collide inside one sentence: the conflict between creator and creation begins as a conflict in the creator's eye.
    topic_code: "5.B"
  - front: Victor's dream after the animation
    back: |
      He dreams of kissing Elizabeth, who turns into the corpse of his dead mother. Ambition, love and death collapse together; he wakes to find the creature at his bedside holding up the bed curtain.
    topic_code: "3.F"
  - front: Victor's flight → what it sets in motion
    back: |
      He rushes from the room, later flees the house when the creature comes to his bed, and leaves the being alone. Abandonment, not the experiment, is the event the rest of the plot answers.
    topic_code: "3.F"
  - front: Internal vs external conflict → in Volume I of Frankenstein
    back: |
      Internal: Victor's ambition against conscience, health and family ties. External: Walton against the ice; Victor against nature's secrets, and from the night of animation, against the creature he rejects.
    topic_code: "3.F"
  - front: Function of a conflict → the question to ask
    back: |
      Not just "what is the conflict?" but what does it reveal (character, values), set in motion (plot), or test (an idea)? An AP answer names the conflict and explains its work in the text.
    topic_code: "3.F"
  - front: Defensible thesis → three tests
    back: |
      It is about interpretation, not a fact of plot; a reasonable reader could disagree; and it can be supported with textual evidence. A strong thesis also previews the line of reasoning.
    topic_code: "7.B"
  - front: Thesis vs topic statement
    back: |
      "This essay will discuss conflict in Frankenstein" names a topic. "Shelley sets ambition against human connection so that Victor's isolation, not his knowledge, becomes the source of horror" makes a claim.
    topic_code: "7.B"
  - front: Line of reasoning → what a thesis can preview
    back: |
      The ordered reasons the essay gives, one per body paragraph, each moving the argument forward. Example: the frame shows the pattern, Victor's story makes it fatal, his interruptions turn it into a warning.
    topic_code: "7.B"
  - front: Row A of the AP essay rubric
    back: |
      The thesis point, 0 or 1: a defensible interpretation responding to the prompt, anywhere in the essay. Restating the prompt or summarizing earns 0. It is the first point every essay must secure.
    topic_code: "7.B"

quiz:
  description: |
    24 questions · about 35 minutes · about 60% this week (Walton's letters and Vol. I, Ch. I-IV: conflict and
    building a thesis) and 40% spiral review (narration, setting, sequence, contrast, word choice and the
    claim-and-evidence paragraph, applied to Frankenstein). Multiple choice, select-all and true/false are graded at
    once; fill-in-the-blank items are matched automatically; the three short answers and the essay are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Passage set: the night of animation (Vol. I, Ch. IV)
    - slug: u03-w07-q01
      type: multiple_choice
      topic_code: "3.F"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: &s7 |
        *The following passage is from Mary Shelley's* Frankenstein *(1818), Volume I, Chapter IV. Victor Frankenstein, the narrator, describes the night his work at Ingolstadt succeeds.*

        It was on a dreary night of November, that I beheld the accomplishment of my toils. With an anxiety that almost amounted to agony, I collected the instruments of life around me, that I might infuse a spark of being into the lifeless thing that lay at my feet. It was already one in the morning; the rain pattered dismally against the panes, and my candle was nearly burnt out, when, by the glimmer of the half-extinguished light, I saw the dull yellow eye of the creature open; it breathed hard, and a convulsive motion agitated its limbs.

        How can I describe my emotions at this catastrophe, or how delineate the wretch whom with such infinite pains and care I had endeavoured to form? His limbs were in proportion, and I had selected his features as beautiful. Beautiful!—Great God! His yellow skin scarcely covered the work of muscles and arteries beneath; his hair was of a lustrous black, and flowing; his teeth of a pearly whiteness; but these luxuriances only formed a more horrid contrast with his watery eyes, that seemed almost of the same colour as the dun white sockets in which they were set, his shrivelled complexion, and straight black lips.

        [...] I had worked hard for nearly two years, for the sole purpose of infusing life into an inanimate body. For this I had deprived myself of rest and health. I had desired it with an ardour that far exceeded moderation; but now that I had finished, the beauty of the dream vanished, and breathless horror and disgust filled my heart.
      prompt: |
        The central conflict the passage presents is best described as one between
      options:
        - 'Victor and the creature, who threatens him as soon as it wakes'
        - 'what Victor desired and planned, and his horrified response to what he has actually made'
        - 'Victor and the professors at Ingolstadt, who forbade the experiment'
        - 'Victor and the weather, which nearly ruins the experiment'
      option_explanations:
        - |
          The creature only opens an eye, breathes and moves its limbs; it does nothing threatening. The conflict with the creature comes later and is set in motion by Victor's reaction here.
        - |
          Correct. "Accomplishment" becomes "catastrophe"; "beautiful" becomes "Great God!"; "the beauty of the dream vanished." The struggle is inside Victor, between ambition and his response to its result.
        - |
          No professor appears in the passage, and nothing in the novel says Waldman or Krempe forbade the work; Victor kept it secret. This imports a conflict the text does not contain.
        - |
          The rain and candle create atmosphere, but they do not threaten the experiment, which succeeds. Setting supports the mood of the conflict rather than being its source.
      answer: 1

    - slug: u03-w07-q02
      type: multiple_choice
      topic_code: "5.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s7
      prompt: |
        In context, the exclamation "Beautiful!—Great God!" primarily serves to
      options:
        - 'show Victor admiring the creature before his feelings change later in the chapter'
        - 'turn Victor''s own design word against him, so that the gap between plan and result opens inside a single sentence'
        - 'suggest that Victor is praying for help in completing the experiment'
        - 'indicate that the creature has spoken its first words'
      option_explanations:
        - |
          The word is repeated in disbelief, and the next sentence describes "yellow skin" and "watery eyes"; there is no admiration here. The change happens within the exclamation, not later.
        - |
          Correct. Victor had "selected his features as beautiful"; echoing the word and breaking it with a dash and an oath shows his judgment collapsing as he looks.
        - |
          "Great God!" is an exclamation of horror, not a prayer for success; the experiment has already succeeded at this point.
        - |
          The creature only breathes and moves; Victor is the speaker. Reading the exclamation as dialogue misattributes the narration.
      answer: 1

    - slug: u03-w07-q03
      type: multiple_choice
      topic_code: "2.A"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s7
      prompt: |
        The details "the rain pattered dismally against the panes" and "the glimmer of the half-extinguished light" contribute to the passage chiefly by
      options:
        - 'establishing a gloomy, failing light at the very moment of Victor''s supposed triumph, so the setting undercuts the achievement'
        - 'showing that Victor needs a storm to power the experiment'
        - 'indicating that the experiment takes place outdoors'
        - 'creating a calm and hopeful mood that the creature then disrupts'
      option_explanations:
        - |
          Correct. A dying candle at the moment of "accomplishment" ironically pairs a discovery meant to pour light into the world with darkness, preparing for the horror that follows.
        - |
          The novel never says the storm powers anything; that is the film tradition. The rain is described as dismal background, not as an instrument.
        - |
          "Panes" places the scene indoors, in Victor's chamber, looking out at the rain.
        - |
          "Dreary," "dismally" and "half-extinguished" build gloom and anxiety from the first sentence; the mood is never calm or hopeful.
      answer: 0

    - slug: u03-w07-q04
      type: multiple_choice
      topic_code: "4.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s7
      prompt: |
        The question "How can I describe my emotions at this catastrophe" is best understood as evidence that
      options:
        - 'the narrator is an outside observer reporting what Victor appeared to feel'
        - 'Victor is narrating retrospectively, to a listener, about events whose outcome he already knows'
        - 'Victor is writing in a private diary on the night of the creation'
        - 'the narrator doubts that the events took place'
      option_explanations:
        - |
          The "I" and "my emotions" make this first-person narration by Victor himself, not third-person observation.
        - |
          Correct. Victor tells his story to Walton long afterward; calling the night a "catastrophe" is a judgment made with hindsight, which colours everything he describes.
        - |
          The past tense and the hindsight judgment show this is not a diary entry written that night; it is part of the story told aboard Walton's ship.
        - |
          The question expresses difficulty describing intense feeling, not doubt about the facts; Victor never questions that the creature lived.
      answer: 1

    - slug: u03-w07-q05
      type: multiple_choice
      topic_code: "3.D"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s7
      prompt: |
        The contrast between the creature's "lustrous black" hair and "pearly" teeth and his "watery eyes" and "shrivelled complexion" functions mainly to suggest that
      options:
        - 'the creature is partly beautiful and so Victor''s horror is unjustified'
        - 'Victor chose his materials carelessly and could easily repair the mistake'
        - 'beautiful parts do not make a beautiful whole; the very "luxuriances" make the effect "more horrid"'
        - 'the creature is aging rapidly as Victor watches'
      option_explanations:
        - |
          Victor says the beauties "only formed a more horrid contrast"; the passage presents them as intensifying the horror, not mitigating it, whatever we later decide about his fairness.
        - |
          Nothing suggests carelessness: he worked "with such infinite pains and care." The contrast is about the impossibility of assembling beauty from parts, not a fixable error.
        - |
          Correct. Shelley sets the selected features against what living tissue looks like; the contrast exposes the gap between design and life that drives Victor's reaction.
        - |
          "Shrivelled" describes the complexion's look, not a process happening before his eyes; nothing indicates rapid aging.
      answer: 2

    - slug: u03-w07-q06
      type: multiple_choice
      topic_code: "6.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s7
      prompt: |
        In the final sentence, the metaphor "the beauty of the dream vanished" implies that
      options:
        - 'Victor fell asleep during the experiment and dreamed the creation'
        - 'Victor''s two years of work were sustained by an imagined ideal that cannot survive contact with its real result'
        - 'Victor never truly wanted to succeed'
        - 'the creature disappears from the room'
      option_explanations:
        - |
          "Dream" is figurative here; the creature is real and Victor is awake, as the eye opening and the breathing make clear.
        - |
          Correct. The ambition was a "dream" of beauty pursued "with an ardour that far exceeded moderation"; realization destroys it, so the metaphor locates the catastrophe in the gap between ideal and reality.
        - |
          He worked "for the sole purpose" of this result and "desired it with an ardour"; the problem is that he wanted it too much, not too little.
        - |
          What vanishes is the dream's beauty, an abstraction; the creature is still there, and Victor flees from it.
      answer: 1

    - slug: u03-w07-q07
      type: multi_select
      topic_code: "3.F"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 2
      partial_credit: true
      stimulus: *s7
      prompt: |
        Which details from the passage reveal an internal conflict in Victor? Select all that apply.
      options:
        - '"With an anxiety that almost amounted to agony"'
        - '"it breathed hard, and a convulsive motion agitated its limbs"'
        - '"I had desired it with an ardour that far exceeded moderation"'
        - '"breathless horror and disgust filled my heart"'
      option_explanations:
        - |
          Selected. Agony at the very moment of success shows ambition already mixed with dread inside Victor.
        - |
          Not selected. This describes the creature's body, an external event; it is what Victor reacts to, not the reaction itself.
        - |
          Selected. Victor judges his own past desire as immoderate, showing ambition at war with his present conscience.
        - |
          Selected. The heart that desired the result is now filled with horror; the same feelings that drove the work turn against it.
      answer: [0, 2, 3]

    - slug: u03-w07-q08
      type: multiple_choice
      topic_code: "7.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s7
      prompt: |
        Which of the following is the most defensible thesis for an essay about this passage?
      options:
        - 'In this passage Victor Frankenstein brings his creature to life on a rainy night in November.'
        - 'Shelley uses Gothic setting, a broken exclamation and a closing metaphor of a vanished dream to show that Victor''s horror begins in his own eyes, so that the conflict with his creature starts as a conflict within its creator.'
        - 'Frankenstein is one of the scariest books ever written.'
        - 'This passage contains imagery, diction and metaphor.'
      option_explanations:
        - |
          This is a plot fact no one could dispute; it makes no interpretive claim and cannot organize an argument.
        - |
          Correct. It makes an arguable interpretation (the horror is Victor's judgment), names the techniques that will carry the line of reasoning, and points to a function.
        - |
          This is an opinion about the whole book's effect on readers, not a claim about how this passage creates meaning.
        - |
          Listing devices identifies features but claims nothing about what they do; a thesis must say what the techniques achieve.
      answer: 1

    # ---- Prose-analysis essay on the passage (Q2 model)
    - slug: u03-w07-q09
      type: long_answer
      topic_code: "7.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 6
      stimulus: *s7
      prompt: |
        Read carefully the passage above from Mary Shelley's *Frankenstein* (1818), in which Victor Frankenstein describes the night his creature comes to life. In a well-written essay, analyze how Shelley uses literary elements and techniques to convey the complex relationship between Victor's ambition and his response to its fulfillment.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Shelley turns Victor's moment of triumph into a scene of revulsion, using a failing Gothic setting, a self-interrupting exclamation and the closing metaphor of a vanished dream to show that the ambition that drove him also blinded him, so that his horror condemns the dream as much as the creature.

        Line of reasoning: (1) The setting undercuts the triumph: "accomplishment of my toils" sits in a "dreary night," rain falling "dismally," a "half-extinguished light"; the enlightenment Victor sought arrives in near-darkness, and "anxiety that almost amounted to agony" shows dread inside desire. (2) The description exposes the gap between design and life: "I had selected his features as beautiful. Beautiful!—Great God!" The repeated word and dash break his judgment mid-sentence; the "luxuriances" of hair and teeth make a "more horrid contrast," so beauty assembled from parts becomes horror. Victor calls the creature a "wretch" before it has acted, which reveals the judgment is his. (3) The closing sentence diagnoses the ambition: two years without "rest and health," an "ardour that far exceeded moderation," and "the beauty of the dream vanished." The metaphor locates the catastrophe in the dream's collision with reality. Sophistication: noting that the retrospective narrator's word "catastrophe" is hindsight, so we cannot separate the scene from the later ruin through which Victor tells it.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible interpretation of the relationship between ambition and response (e.g., that the fulfillment destroys the ideal, or that the horror is Victor's own judgment). 0 for restating the prompt ("Shelley uses techniques to show Victor's ambition"), summarizing the scene, or listing devices without a claim.

        Row B Evidence and Commentary (0-4): 1 = mostly summary of the creation scene with little or no commentary. 2 = some relevant quotations (for example "Beautiful!—Great God!") with commentary that names devices but does not connect them to the ambition-and-response relationship. 3 = specific evidence from at least two parts of the passage (setting, physical description, closing reflection) with commentary that explains how each shows the clash between Victor's ambition and his horror, and a clear line of reasoning. 4 = all of 3, with commentary that consistently explains how specific words work (the dash, "catastrophe," "luxuriances," "far exceeded moderation," "dream") and builds from point to point.

        Row C Sophistication (0-1): 1 for a complex understanding sustained across the essay, such as treating the retrospective narration as a filter (hindsight judgment in "catastrophe" and "wretch"), considering whether Victor's horror is justified or a failure of responsibility, or situating the passage in the novel's tension between knowledge and isolation. A single sweeping sentence is not enough.

    # ---- Walton and the frame
    - slug: u03-w07-q10
      type: multiple_choice
      topic_code: "3.C"
      source: general knowledge
      points: 1
      prompt: |
        *Frankenstein* opens with Walton's letters to his sister rather than with Victor's childhood. Which best describes the primary function of this frame?
      options:
        - 'It provides a neutral, objective account that confirms every detail of Victor''s story.'
        - 'It begins near the end of the chronology, gives Victor a listener on the same ambitious path, and turns his story into a warning addressed to someone who can still choose differently.'
        - 'It establishes that Walton, not Victor, created the creature.'
        - 'It replaces suspense with a full summary of the plot.'
      option_explanations:
        - |
          Walton is himself a passionate, lonely and ambitious first-person narrator, admiring of Victor; he records Victor's account rather than independently checking it.
        - |
          Correct. Walton's ambition and loneliness mirror Victor's, Victor tells the story to warn him, and opening near the end shifts suspense to how and why.
        - |
          Walton is an explorer who meets Victor in the Arctic; he has nothing to do with the creation.
        - |
          The letters reveal very little: a figure on a sledge and a dying stranger. The frame creates suspense about how Victor came to this point.
      answer: 1

    - slug: u03-w07-q11
      type: multiple_choice
      topic_code: "3.F"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: |
        *From Walton's Letter II to his sister, Margaret Saville.*

        But I have one want which I have never yet been able to satisfy; and the absence of the object of which I now feel as a most severe evil. I have no friend, Margaret: when I am glowing with the enthusiasm of success, there will be none to participate my joy; if I am assailed by disappointment, no one will endeavour to sustain me in dejection.
      prompt: |
        The conflict Walton describes in this passage primarily functions to
      options:
        - 'show that Walton''s crew is plotting against him'
        - 'introduce, in the frame, the tension between solitary ambition and the need for human connection that Victor''s story and the creature''s will both test'
        - 'explain why Walton decides to abandon his voyage immediately'
        - 'contrast Walton''s contentment with Victor''s misery'
      option_explanations:
        - |
          Walton describes an absence of friendship, not hostility; he praises his lieutenant and master in the same letter. No plot against him is suggested.
        - |
          Correct. Success and disappointment alike are empty without a companion; the same conflict defines Victor's secret labour and, later, the creature's isolation.
        - |
          Walton continues north for months; he turns back only at the end of the novel, under pressure from his crew.
        - |
          Walton is not content: he calls the absence "a most severe evil." The point is likeness to Victor, not contrast.
      answer: 1

    - slug: u03-w07-q12
      type: multiple_choice
      topic_code: "7.B"
      source: general knowledge
      points: 1
      prompt: |
        A student writes: "In *Frankenstein*, Mary Shelley uses Walton's letters, Victor's narration and the night of animation." What is the most important revision this sentence needs to become a thesis?
      options:
        - 'Add more literary terms, such as imagery and syntax.'
        - 'State an arguable claim about what these elements do or mean, for example what the frame reveals about ambition.'
        - 'Shorten it to name only one element.'
        - 'Add a quotation from the novel.'
      option_explanations:
        - |
          More terms would lengthen the list without adding a claim; a thesis is defined by its interpretation, not its vocabulary.
        - |
          Correct. The sentence names elements but claims nothing; a defensible thesis says what Shelley achieves with them in a way a reader could dispute.
        - |
          Narrowing the topic does not create a claim; "Shelley uses Walton's letters" is still not an interpretation.
        - |
          Evidence belongs in body paragraphs; a quotation cannot substitute for the missing claim.
      answer: 1

