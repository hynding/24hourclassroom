    - slug: u03-w07-q22
      type: short_answer
      topic_code: "7.B"
      source: general knowledge
      points: 2
      prompt: |
        Write a defensible thesis (one or two sentences) about the function of Walton's letters in *Frankenstein*. Your thesis should make a claim a reader could dispute and suggest a line of reasoning.
      answer: |
        By opening with Walton, an ambitious and friendless explorer who mirrors Victor, Shelley turns Victor's story into a warning delivered to someone still able to choose, so that the novel's real question is not whether ambition is dangerous but whether its danger can be recognized in time.
      explanation: |
        2 points: an interpretive claim about what the letters do (mirror, warning, filter, suspense) that could be disputed, with a hint of reasoning (e.g., likeness of Walton to Victor, the frame as audience). 1 point: a claim that is defensible but vague ("the letters are important to the story") or a reasoning list with a weak claim. 0: a fact ("the novel starts with letters"), a summary or a topic announcement.

    - slug: u03-w07-q23
      type: short_answer
      topic_code: "3.F"
      source: general knowledge
      points: 2
      prompt: |
        Identify one internal conflict in Victor in Volume I, Chapters III-IV, and explain in one or two sentences its function in the novel.
      answer: |
        Victor's ambition to "infuse life" wars with his conscience and his love for his family: he hides from his family's letters and ruins his health to finish the work. The conflict shows that the creation was made in isolation, and it prepares for his rejection of the creature, because the same heart that "desired it with an ardour" is the one filled with horror.
      explanation: |
        1 point for naming an internal conflict accurately (ambition vs conscience, health, family, or his ideal vs the reality). 1 point for a function: what the conflict reveals about Victor, sets in motion (the abandonment), or tests (knowledge vs connection). Naming an external conflict, or describing without a function, earns at most 1.

    - slug: u03-w07-q24
      type: short_answer
      topic_code: "7.A"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 3
      prompt: |
        Victor tells Walton: "Learn from me, if not by my precepts, at least by my example, how dangerous is the acquirement of knowledge." Write a short paragraph (three or four sentences) with a claim about what this interruption reveals, embedded evidence from the line, and commentary that explains how the evidence supports the claim.
      answer: |
        Victor's interruption reveals that his narrative is an argument as much as a confession. By telling Walton to learn "by my example," he casts his own life as a cautionary tale and himself as its proof, while the phrase "how dangerous is the acquirement of knowledge" places the danger in knowledge itself rather than in his secrecy or his abandonment of what he made. The reader is invited to test that claim against his story and may conclude that Victor blames knowledge to avoid blaming himself.
      explanation: |
        1 point: a claim about what the interruption reveals (Victor's purpose, his self-understanding, the frame). 1 point: evidence from the quotation embedded in the student's own sentence. 1 point: commentary explaining how the words support the claim (e.g., "example" makes his life the evidence; "knowledge" shifts responsibility). A paraphrase of the line with no claim earns 0.
