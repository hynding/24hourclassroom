week: 8
unit: 3
title: Consequences, William, Justine and the Meeting on the Glacier
topics: ["1.B", "3.E"]
texts:
  - author: Mary Wollstonecraft Shelley
    title: "Frankenstein; or, The Modern Prometheus (Vol. I, Ch. V-VII; Vol. II, Ch. I-II)"
    year: 1818
    url: https://www.gutenberg.org/ebooks/41445
guide: guides/week-08.md
guide_description: |
  Volume I, Chapters V-VII and Volume II, Chapters I-II of the 1818 text (1831 Ch. 6-10): William's murder, the
  storm and the sighting, Justine's trial and execution, Victor's silence, and the creature's speech on the glacier.
  How to explain the function of a character's change or sameness and of a significant event, with four worked
  close readings, a model paragraph, misreadings and a self-check.
flashcards_description: |
  30 cards on the events from William's murder to Montanvert, who changes and who does not, and how to explain the
  function of an event.

flashcards:
  - front: Dynamic vs static character → in Frankenstein's middle chapters
    back: |
      Dynamic: changes significantly (the creature claims he was "benevolent and good" until misery made him a fiend). Static: stays essentially the same (Elizabeth, Clerval). Both have functions; static is not a flaw.
    topic_code: "1.B"
  - front: Explaining the function of a change → the three-part move
    back: |
      1) State the change precisely, from what to what. 2) Cite evidence at both ends. 3) Explain what the change reveals, causes or tests in the work as a whole.
    topic_code: "1.B"
  - front: Significant event → how to test significance
    back: |
      Ask what the novel would lose without it: what it sets in motion, reveals, or makes impossible afterwards. A brief scene can be more significant than a long one.
    topic_code: "3.E"
  - front: Clerval's care of Victor (Vol. I, Ch. V)
    back: |
      Clerval nurses Victor through months of fever and keeps the cause from his family. His steady kindness is a measure of what Victor withheld from the creature.
    topic_code: "1.C"
  - front: Victor after his fever → the chemical instruments
    back: |
      Recovered, he cannot bear the sight of his instruments or hear natural philosophy praised; he turns with Clerval to languages and spring walks. Avoidance, not reckoning.
    topic_code: "1.B"
  - front: Justine Moritz → who she is
    back: |
      A girl taken into the Frankenstein household as a servant, devoted to Caroline and loved by the family. Elizabeth's letter in Vol. I, Ch. V tells her history.
    topic_code: "1.A"
  - front: William Frankenstein → how he dies
    back: |
      Victor's youngest brother is found strangled at Plainpalais near Geneva in May, the mark of the murderer's finger on his neck. A miniature of his mother that he wore is missing.
    topic_code: "3.E"
  - front: The miniature of Caroline → its role in the plot
    back: |
      William was wearing it when he was killed; it is found in Justine's pocket, and it becomes the evidence that condemns her. An object of family love turned into false proof.
    topic_code: "3.E"
  - front: The storm near Geneva (Vol. I, Ch. VI)
    back: |
      A night storm over the lake and the Alps; Victor calls it William's "funeral" and "dirge." In a flash of lightning he sees the creature and becomes convinced it is the murderer.
    topic_code: "2.A"
  - front: Lightning reveals the creature → the echo
    back: |
      Lightning shattered the oak and turned the boy Victor to science (Vol. I, Ch. I); now lightning "discovered" the creature to him. The force that promised knowledge reveals its consequence.
    topic_code: "3.E"
  - front: "\"Could he be (I shuddered at the conception)\" → the pun"
    back: |
      "Conception" means an idea and the beginning of a life. Inside his horror at the thought, Victor names the act of creation that made the murderer possible.
    topic_code: "5.B"
  - front: Victor's decision to stay silent → his reasons
    back: |
      He thinks his story would be taken for madness and the creature could not be caught. The decision sets up the dramatic irony of the trial: the reader and Victor know what the court does not.
    topic_code: "3.E"
  - front: Dramatic irony → at Justine's trial
    back: |
      We know the creature killed William; the judges and Justine do not. Every word of evidence against her is read through what Victor and the reader know.
    topic_code: "3.E"
  - front: Elizabeth at the trial
    back: |
      She speaks publicly for Justine's character and gentleness. Her courage contrasts with Victor's silence, and her testimony does not change the verdict.
    topic_code: "1.C"
  - front: Justine's false confession
    back: |
      In prison she tells Elizabeth and Victor she confessed a lie to obtain absolution, after her confessor threatened her. Institutions of law and religion crush the innocent.
    topic_code: "3.E"
  - front: "\"The tortures of the accused did not equal mine\""
    back: |
      Victor at the trial (Vol. I, Ch. VII) ranks his remorse above Justine's suffering. Real feeling turned inward; evidence that he stays the same while the plot demands action.
    topic_code: "1.B"
  - front: Victor's sameness → feeling without action
    back: |
      He flees on the night of animation and stays silent at the trial. Intensified feeling, unchanged conduct: the pattern makes Justine's death a product of character, not chance.
    topic_code: "1.B"
  - front: Justine's execution → function in the novel
    back: |
      The second innocent death, and the first caused partly by Victor's silence. It shows the creature's crime spreading through human institutions and deepens Victor's guilt into despair.
    topic_code: "3.E"
  - front: "\"Nothing is more painful to the human mind\" (Vol. II opening)"
    back: |
      Victor generalizes about the "dead calmness" after a "quick succession of events." Structurally a pause between murder-trial-execution and the next turn on the glacier.
    topic_code: "3.C"
  - front: Belrive and the lake → Victor's despair
    back: |
      At the family house he rows alone at night and is tempted to drown himself, held back by thoughts of Elizabeth, his father and Ernest. Setting mirrors his isolation.
    topic_code: "2.A"
  - front: Elizabeth's grief after Justine's death
    back: |
      She says the world now seems unjust and men like monsters thirsting for each other's blood. The innocent character changes in outlook, which sharpens Victor's knowledge of the truth.
    topic_code: "1.B"
  - front: Chamounix and Montanvert → why the Alps
    back: |
      Romantic sublime: vast, terrifying nature that dwarfs human grief. Victor seeks consolation there; instead the creature comes across the ice toward him.
    topic_code: "2.A"
  - front: "\"Begone, vile insect!\" → Victor at Montanvert"
    back: |
      Victor greets the creature with curses and threats. His language denies the creature any human standing just before the creature answers with eloquent, reasoned speech.
    topic_code: "1.A"
  - front: "\"All men hate the wretched\""
    back: |
      The creature's first words: "I expected this reception." He knows himself hated before Victor speaks, and frames his misery as the cause of the hatred, not its result.
    topic_code: "1.A"
  - front: "\"I ought to be thy Adam; but I am rather the fallen angel\""
    back: |
      Paradise Lost allusion: the creature should have been the cherished first man of his maker, but feels cast out like Satan "for no misdeed." Victor is cast as a negligent God.
    topic_code: "6.B"
  - front: "\"I was benevolent and good; misery made me a fiend\""
    back: |
      The creature's claim to be a dynamic character changed by how he was treated, followed by "Make me happy, and I shall again be virtuous." The novel's nature-or-nurture question in one line.
    topic_code: "1.B"
  - front: The creature's "thou" and "thy"
    back: |
      Archaic, elevated address, the language of prayer and of Milton. It makes the creature eloquent and insists on Victor's role as maker and lord, with duties attached.
    topic_code: "5.B"
  - front: Montanvert as turning point
    back: |
      Until now the creature is seen only through Victor's names for him. Here he speaks and asks to be heard; the narrative passes to him, and Victor's judgment is put on trial.
    topic_code: "3.E"
  - front: Why Victor agrees to listen
    back: |
      Partly curiosity, partly a first sense of what a creator owes his creature. He follows him to a hut on the mountain, where the creature's own story begins.
    topic_code: "1.B"
  - front: Clerval and Elizabeth as static characters → function
    back: |
      Their steady loyalty and goodness measure Victor's instability and make their later fates more painful. A static character can be the fixed point that shows another's change.
    topic_code: "1.B"

quiz:
  description: |
    24 questions · about 35 minutes · about 50% this week (character change and significant events, Vol. I, Ch. V
    to Vol. II, Ch. II) and 50% spiral review (conflict and thesis from week 7, plus setting, contrast, word choice,
    metaphor and narration). Multiple choice, select-all and true/false are graded at once; fill-in-the-blank items
    are matched automatically; the short answers and the paragraph are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Passage set: the meeting on the glacier (Vol. II, Ch. II)
    - slug: u03-w08-q01
      type: multiple_choice
      topic_code: "1.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: &s8 |
        *The following passage is from Mary Shelley's* Frankenstein *(1818), Volume II, Chapter II. On the glacier at Montanvert, the creature answers Victor, who has cursed him and threatened to kill him.*

        "Be calm! I entreat you to hear me, before you give vent to your hatred on my devoted head. Have I not suffered enough, that you seek to increase my misery? Life, although it may only be an accumulation of anguish, is dear to me, and I will defend it. Remember, thou hast made me more powerful than thyself; my height is superior to thine; my joints more supple. But I will not be tempted to set myself in opposition to thee. I am thy creature, and I will be even mild and docile to my natural lord and king, if thou wilt also perform thy part, the which thou owest me. Oh, Frankenstein, be not equitable to every other, and trample upon me alone, to whom thy justice, and even thy clemency and affection, is most due. Remember, that I am thy creature: I ought to be thy Adam; but I am rather the fallen angel, whom thou drivest from joy for no misdeed. Every where I see bliss, from which I alone am irrevocably excluded. I was benevolent and good; misery made me a fiend. Make me happy, and I shall again be virtuous."
      prompt: |
        In the sentence "I was benevolent and good; misery made me a fiend," the creature presents himself as
      options:
        - 'a being whose wickedness was fixed at his creation'
        - 'a character changed by his experience, who claims the change was caused by others and can be reversed'
        - 'a character who has never changed and never will'
        - 'a being who regrets nothing he has done'
      option_explanations:
        - |
          The sentence says the opposite: he began "benevolent and good." The claim of an original goodness is the core of his argument.
        - |
          Correct. Past goodness, present fiendishness, and a cause ("misery") outside himself; the next sentence, "Make me happy, and I shall again be virtuous," claims the change can run backward.
        - |
          The sentence describes a change from "benevolent" to "fiend"; he presents himself as dynamic, not static.
        - |
          Calling himself a "fiend" concedes that he has become something bad; the speech is not a boast but a plea with an explanation.
      answer: 1

    - slug: u03-w08-q02
      type: multiple_choice
      topic_code: "6.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s8
      prompt: |
        The comparison "I ought to be thy Adam; but I am rather the fallen angel" primarily serves to
      options:
        - 'cast Victor as a creator-God who has failed his creature, and the creature as an outcast punished without cause'
        - 'show that the creature wishes to rebel against God in heaven'
        - 'reveal that the creature has not yet read any books'
        - 'compare the creature''s appearance to a painting of Adam'
      option_explanations:
        - |
          Correct. Adam was the beloved first creation; the fallen angel was cast out. Placing himself in the second role "for no misdeed" makes Victor a negligent maker and the exile unjust.
        - |
          The metaphor concerns his relation to his maker, Victor, not a plan to rebel against God; the speech asks for Victor to "perform thy part."
        - |
          The allusion to Paradise Lost shows the opposite; the creature will explain in his narrative how he read Milton.
        - |
          Nothing in the passage concerns a picture; the comparison is about roles and treatment, not appearance.
      answer: 0

    - slug: u03-w08-q03
      type: multiple_choice
      topic_code: "3.E"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s8
      prompt: |
        Within the novel's plot, the meeting from which this speech comes functions chiefly as
      options:
        - 'the climax, in which the creature is finally destroyed'
        - 'a turning point at which the creature, until now seen only through Victor''s words, speaks for himself and claims a hearing'
        - 'a flashback to Victor''s childhood in Geneva'
        - 'an interruption that has no effect on later events'
      option_explanations:
        - |
          The creature survives the novel; this is the middle of the book, and no one is destroyed on the glacier.
        - |
          Correct. Victor has called him "wretch" and "dæmon"; now he answers eloquently and asks to tell his story, and the narration passes to him for most of Volume II.
        - |
          The scene takes place in the present of Victor's story, in the Alps, after Justine's death; it is not a flashback.
        - |
          The meeting leads directly to the creature's narrative and his demand for a companion, which drives Volume III.
      answer: 1

    - slug: u03-w08-q04
      type: multiple_choice
      topic_code: "5.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s8
      prompt: |
        The creature's shift from "you" in the first sentences to "thou" and "thy" from "Remember, thou hast made me" onward most likely serves to
      options:
        - 'show that the creature is confused about grammar'
        - 'elevate his speech into the formal register of prayer and scripture, stressing Victor''s role as his maker and "lord"'
        - 'signal that he is now speaking to someone other than Victor'
        - 'indicate that he has calmed down and no longer cares about the outcome'
      option_explanations:
        - |
          The speech is controlled and balanced throughout; the shift in pronouns is purposeful, not an error.
        - |
          Correct. "Thou" is the language of address to God in prayer and in Milton; with "natural lord and king," it insists on the relation of maker to made and the duties it carries.
        - |
          He addresses "Frankenstein" by name in the same speech; the listener does not change.
        - |
          The pleading intensifies ("Oh, Frankenstein"); the elevated form raises the stakes rather than lowering them.
      answer: 1

    - slug: u03-w08-q05
      type: multiple_choice
      topic_code: "1.A"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s8
      prompt: |
        The creature's reminder "thou hast made me more powerful than thyself; my height is superior to thine" followed by "But I will not be tempted to set myself in opposition to thee" reveals that he
      options:
        - 'is too weak to harm Victor and knows it'
        - 'pairs an implied threat with an offer of restraint, so that his mildness is presented as a choice Victor''s conduct can secure'
        - 'has already decided to kill Victor'
        - 'does not understand that he is larger than Victor'
      option_explanations:
        - |
          He states the reverse: he is stronger, taller and more supple. His restraint is not weakness.
        - |
          Correct. Reminding Victor of his strength gives weight to the promise of docility, which is conditional: "if thou wilt also perform thy part."
        - |
          He promises not to oppose Victor and asks for happiness; the passage offers a bargain, not a declared intention to kill.
        - |
          He names his size and strength exactly; his self-knowledge is part of the argument.
      answer: 1

    - slug: u03-w08-q06
      type: multiple_choice
      topic_code: "3.D"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s8
      prompt: |
        The contrast between "Every where I see bliss" and "from which I alone am irrevocably excluded" emphasizes
      options:
        - 'the creature''s joy at the beauty of the Alps'
        - 'his total isolation, the condition he presents as the cause of his change'
        - 'that the creature is excluded only from Victor''s house'
        - 'that the creature is indifferent to other people''s happiness'
      option_explanations:
        - |
          The bliss is others', not his; the sentence is a complaint, not a celebration.
        - |
          Correct. Universal bliss against "I alone" isolates him absolutely; the next sentence makes misery the cause of his fiendishness, so the contrast underwrites the claim of change.
        - |
          "Every where" and "irrevocably" make the exclusion universal and permanent, not a matter of one house.
        - |
          He sees the bliss and longs for it; the pain of seeing it is the point, the opposite of indifference.
      answer: 1

    - slug: u03-w08-q07
      type: multi_select
      topic_code: "3.F"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 2
      partial_credit: true
      stimulus: *s8
      prompt: |
        The creature frames the conflict between himself and Victor as a failure of a creator's duty. Which phrases support that reading? Select all that apply.
      options:
        - '"if thou wilt also perform thy part, the which thou owest me"'
        - '"to whom thy justice, and even thy clemency and affection, is most due"'
        - '"Life, although it may only be an accumulation of anguish, is dear to me"'
        - '"whom thou drivest from joy for no misdeed"'
      option_explanations:
        - |
          Selected. "Thy part" and "owest" are the language of obligation: the creator has a duty the creature claims.
        - |
          Selected. Justice, clemency and affection are "most due" to him above all others, because Victor made him.
        - |
          Not selected. This expresses his attachment to life, a reason to defend himself, but it does not say what Victor owes him.
        - |
          Selected. Being driven out "for no misdeed" casts Victor as an unjust maker who punishes the innocent.
      answer: [0, 1, 3]

    - slug: u03-w08-q08
      type: multiple_choice
      topic_code: "7.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s8
      prompt: |
        Which thesis about this speech is most defensible and best establishes a line of reasoning?
      options:
        - 'The creature gives a speech to Victor on a glacier.'
        - 'The creature is evil and his speech should not be believed.'
        - 'Through Miltonic allusion, the elevated "thou," and a balanced argument from obligation, Shelley lets the creature claim a creator''s duties from Victor, so that the reader must judge the novel''s narrator by his creature''s standard.'
        - 'This passage uses many allusions to Paradise Lost.'
      option_explanations:
        - |
          A plot fact that no one could dispute; it states nothing about meaning.
        - |
          An opinion asserted without a route through the text; it also ignores how the speech works, which is what an analysis must explain.
        - |
          Correct. It is arguable, names the techniques that will organize the essay, and states a function in the novel as a whole.
        - |
          True but merely descriptive, and inaccurate in scope (there is one central allusion); it claims nothing about function.
      answer: 2

    # ---- Passage set: the storm (Vol. I, Ch. VI)
    - slug: u03-w08-q09
      type: multiple_choice
      topic_code: "3.E"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: &s8b |
        *From* Frankenstein *(1818), Volume I, Chapter VI. Returning to Geneva after William's murder, Victor walks out at night toward the place where his brother was killed.*

        While I watched the storm, so beautiful yet terrific, I wandered on with a hasty step. This noble war in the sky elevated my spirits; I clasped my hands, and exclaimed aloud, "William, dear angel! this is thy funeral, this thy dirge!" As I said these words, I perceived in the gloom a figure which stole from behind a clump of trees near me; I stood fixed, gazing intently: I could not be mistaken. A flash of lightning illuminated the object, and discovered its shape plainly to me; its gigantic stature, and the deformity of its aspect, more hideous than belongs to humanity, instantly informed me that it was the wretch, the filthy dæmon to whom I had given life. What did he there? Could he be (I shuddered at the conception) the murderer of my brother? No sooner did that idea cross my imagination, than I became convinced of its truth; my teeth chattered, and I was forced to lean against a tree for support. The figure passed me quickly, and I lost it in the gloom.
      prompt: |
        The event described in this passage is significant in the plot chiefly because it
      options:
        - 'gives Victor knowledge no one else has, setting up the dramatic irony of Justine''s trial and his choice to stay silent'
        - 'proves to the people of Geneva that the creature is the murderer'
        - 'leads Victor to confess his experiment to his father that night'
        - 'resolves the mystery of William''s death for every character'
      option_explanations:
        - |
          Correct. Only Victor (and the reader) now believes the creature killed William; when Justine is accused, his knowledge and his silence drive the next chapter.
        - |
          No one else sees the figure; Victor decides to tell no one, convinced he would not be believed.
        - |
          He confesses nothing; he decides that his tale would be taken for madness.
        - |
          The mystery is "resolved" only for Victor, privately; the town blames Justine.
      answer: 0

    - slug: u03-w08-q10
      type: multiple_choice
      topic_code: "5.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s8b
      prompt: |
        In context, the parenthetical "(I shuddered at the conception)" is most significant because "conception"
      options:
        - 'refers only to the storm forming over the lake'
        - 'means both the idea Victor is forming and the beginning of a life, recalling his own act of creation at the moment he suspects its result'
        - 'shows that Victor has no idea who the figure is'
        - 'means that Victor is pleased with his idea'
      option_explanations:
        - |
          The word follows Victor's question about the murderer; it names his thought, not the weather.
        - |
          Correct. The double sense ties the horrifying idea to the act that made the "dæmon" possible; Victor shudders at both.
        - |
          The previous sentence says the sight "instantly informed" him who it was; the parenthesis concerns the murder, not identification.
        - |
          He "shuddered"; the reaction is horror, not satisfaction.
      answer: 1

    - slug: u03-w08-q11
      type: multiple_choice
      topic_code: "2.A"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s8b
      prompt: |
        The description of the storm as "so beautiful yet terrific" and "This noble war in the sky" most directly conveys
      options:
        - 'a calm evening that contrasts with Victor''s grief'
        - 'the Romantic sublime: nature both magnificent and terrifying, matching and elevating Victor''s turbulent feeling'
        - 'that Victor is indifferent to his surroundings'
        - 'that the storm causes William''s death'
      option_explanations:
        - |
          A storm described as a "war in the sky" is the opposite of calm; there is no contrast of mood here.
        - |
          Correct. Beauty and terror together, and spirits "elevated" by the violence: the storm is a sublime setting that suits a scene of revelation.
        - |
          He watches intently, exclaims aloud and addresses William; he is intensely responsive to the scene.
        - |
          William was strangled days earlier; the storm is the setting for Victor's return, not a cause.
      answer: 1

    # ---- Events and change across the chapters
    - slug: u03-w08-q12
      type: multiple_choice
      topic_code: "3.E"
      source: general knowledge
      points: 1
      prompt: |
        Which best explains the function of Justine's trial and execution in the novel?
      options:
        - 'It shows the legal system correctly punishing a guilty servant.'
        - 'It spreads the consequences of Victor''s creation to an innocent person through human institutions, and tests whether Victor will accept responsibility, which he does not.'
        - 'It provides comic relief between two tragic scenes.'
        - 'It reveals to Elizabeth that Victor created the creature.'
      option_explanations:
        - |
          Justine is innocent, as Victor and the reader know; the trial shows justice failing, not working.
        - |
          Correct. A court, a confessor and public opinion destroy Justine, and Victor's silence makes him complicit; the event measures his character as well as moving the plot.
        - |
          Nothing in the trial is comic; it is one of the darkest sequences in the novel.
        - |
          Victor never tells Elizabeth; his secrecy continues to the end.
      answer: 1

    - slug: u03-w08-q13
      type: multiple_choice
      topic_code: "1.B"
      source: general knowledge
      points: 1
      prompt: |
        Which statement best describes Victor's character across Vol. I, Ch. IV-VII, and its function?
      options:
        - 'He changes completely, publicly confessing and accepting the consequences, which ends the creature''s threat.'
        - 'His feelings intensify from horror to remorse, but his pattern of flight and silence stays the same, which turns events into consequences of his character.'
        - 'He becomes cheerful and forgets the creature entirely.'
        - 'He becomes the creature''s ally and defends him to the court.'
      option_explanations:
        - |
          Victor confesses nothing; the creature's threat grows rather than ends.
        - |
          Correct. Horror on the night of animation, remorse at the trial, but the same withdrawal; this sameness is what makes Justine's death partly his.
        - |
          His return to health is brief; William's murder brings back the creature in his mind, and he is consumed by guilt.
        - |
          He calls the creature a "filthy dæmon" and says nothing of him in court; he is no ally.
      answer: 1

    - slug: u03-w08-q14
      type: multiple_choice
      topic_code: "1.B"
      source: general knowledge
      points: 1
      prompt: |
        Elizabeth and Clerval remain largely unchanged in their goodness and loyalty through these chapters. The best explanation of the function of their sameness is that it
      options:
        - 'shows that Shelley lost interest in minor characters'
        - 'provides a fixed measure of human affection against which Victor''s instability and withholding stand out'
        - 'proves that neither character has any influence on the plot'
        - 'suggests that they secretly know about the creature'
      option_explanations:
        - |
          Static characters can be deliberate; their steadiness does work in the novel.
        - |
          Correct. Clerval's nursing and Elizabeth's defence of Justine show the care Victor gives his friends but denies the creature and fails to give Justine.
        - |
          Clerval restores Victor to health and Elizabeth testifies at the trial; both affect events.
        - |
          Neither knows; Victor keeps the secret from everyone.
      answer: 1

    - slug: u03-w08-q15
      type: true_false
      topic_code: "3.E"
      source: general knowledge
      points: 1
      prompt: |
        True or false: The miniature of Victor's mother that William was wearing is found in Justine's pocket, and it becomes the chief evidence against her.
      answer: true
      explanation: |
        True. The missing miniature is the link the court relies on. The creature will explain in his narrative how it got there.

    - slug: u03-w08-q16
      type: true_false
      topic_code: "1.B"
      source: general knowledge
      points: 1
      prompt: |
        True or false: Moved by remorse, Victor testifies at Justine's trial that a creature he made is the real murderer.
      answer: false
      explanation: |
        False. Victor says nothing, convinced he would be thought mad. His feelings change; his conduct does not, and that sameness is what the trial exposes.

    - slug: u03-w08-q17
      type: fill_blank
      topic_code: "1.A"
      source: general knowledge
      points: 1
