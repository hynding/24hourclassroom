    - slug: u03-w08-q20
      type: short_answer
      topic_code: "1.B"
      source: general knowledge
      points: 2
      prompt: |
        Choose either Victor or the creature. In two or three sentences, describe one way the character changes or remains the same between Vol. I, Ch. IV and Vol. II, Ch. II, and explain the function of that change or sameness.
      answer: |
        Victor remains the same in the way that matters: on the night of animation he flees what he has made, and at Justine's trial he again withdraws into his own suffering and says nothing. His sameness turns Justine's execution into a consequence of his character and prepares the reader to weigh the creature's accusation that his maker never performed his part.
      explanation: |
        1 point: an accurate change or sameness with evidence from both points (e.g., Victor's flight and silence; the creature's claim that he was "benevolent and good" and became a "fiend"). 1 point: a function (what it reveals, causes or tests in the novel). A description without function earns 1 at most.

    - slug: u03-w08-q21
      type: short_answer
      topic_code: "3.E"
      source: general knowledge
      points: 2
      prompt: |
        In prison, Justine tells Elizabeth and Victor that she confessed to a crime she did not commit. In one or two sentences, explain the function of her false confession in the novel.
      answer: |
        Justine confessed a lie to obtain absolution after her confessor pressed her, so religion as well as law conspires against the innocent. The confession shows how social institutions complete what the creature began, and it intensifies Victor's guilt, because he alone could have spoken the truth that her lie replaced.
      explanation: |
        1 point: accurately states why she confessed or what it shows (pressure from her confessor; the failure of law and religion). 1 point: explains a function (critique of institutions, irony against Victor's silence, deepening of his guilt or despair). Plot retelling earns at most 1.

    - slug: u03-w08-q22
      type: short_answer
      topic_code: "7.B"
      source: general knowledge
      points: 2
      prompt: |
        Write a defensible thesis (one or two sentences) about the function of Justine's trial in *Frankenstein*. Your thesis should be arguable and suggest a line of reasoning.
      answer: |
        Shelley stages Justine's trial so that the reader watches with Victor's knowledge but without his excuses: the court's error, the confessor's pressure and Victor's silence together show that the creature's crime becomes a social tragedy only through the failures of those who could have prevented it.
      explanation: |
        2 points: an arguable interpretation of what the trial does (dramatic irony, critique of institutions, exposure of Victor) with a visible line of reasoning. 1 point: a defensible but general claim ("the trial shows injustice") or a list without a claim. 0: plot summary or restated prompt.

    - slug: u03-w08-q23
      type: long_answer
      topic_code: "1.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 4
      prompt: |
        The creature tells Victor, "I was benevolent and good; misery made me a fiend." Write one well-developed analytical paragraph (8-10 sentences) that takes a position on whether the chapters you have read so far support or complicate this claim of change, and explains the function of the creature's claim in the novel. Use at least two pieces of evidence from Vol. I, Ch. IV to Vol. II, Ch. II.
      answer: |
        Model paragraph: The chapters before Montanvert complicate the creature's claim without refuting it, and that uncertainty is the claim's function. The only evidence of his first moments comes from Victor, who calls the newly animated being a "wretch" and flees, yet who also records that it held up the bed curtain with a grin and "muttered some inarticulate sounds," as if reaching for its maker. Nothing there shows malice; what it shows is abandonment. Two years later the same being appears in lightning as a "filthy dæmon," and William and Justine are dead. The reader therefore sees the "fiend" before hearing of the "benevolent and good" creature, and must ask whether the change was caused, as he says, by misery. On the glacier his speech is restrained and reasoned, offering to be "mild and docile" if Victor performs "thy part," which is not how a fixed monster argues. By placing this claim at the centre of the novel, Shelley turns the creature's narrative into evidence to be weighed and makes Victor's neglect a possible cause of the crimes, so that the question of change becomes a question of responsibility.
      explanation: |
        4-point guide. 1 point: a clear, defensible position (supports / complicates / refutes) on the claim of change. 1 point: at least two accurate, specific pieces of evidence from the assigned chapters (e.g., the bedside scene, "wretch," the lightning sighting, William's murder, the speech's restraint). 1 point: commentary that explains how each piece bears on the claim rather than summarizing. 1 point: explains the function of the claim in the novel (shifts the narrative to the creature, puts Victor's responsibility on trial, raises the nature-or-nurture question). A paragraph that only agrees or disagrees with the creature, without function, can earn at most 3.

