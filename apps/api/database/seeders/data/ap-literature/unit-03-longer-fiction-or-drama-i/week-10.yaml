week: 10
unit: 3
title: Endings and the Literary Argument, Volume III and Walton's Close
topics: ["7.E"]
texts:
  - author: Mary Wollstonecraft Shelley
    title: "Frankenstein; or, The Modern Prometheus (Vol. III, Ch. I-VII and Walton's conclusion)"
    year: 1818
    url: https://www.gutenberg.org/ebooks/41445
guide: guides/week-10.md
guide_description: |
  Volume III of the 1818 text (1831 Ch. 18-24): the female destroyed in the Orkneys, Clerval's murder, the wedding
  night, the pursuit, and Walton's close. Four close readings, then a complete literary argument (Q3) built step by
  step: planning a line of reasoning, arguing topic sentences, transitions that show logic, sentence control,
  precise diction and a conclusion that widens. Misreadings and a self-check.
flashcards_description: |
  30 cards on the events of Volume III and the ending, the novel as a whole, and the composition moves of a
  complete literary argument.

flashcards:
  - front: Why Victor goes to England in Volume III
    back: |
      To learn what English natural philosophers can teach him for the female creature, and to put distance between himself and the work. He travels with Clerval, meeting him at Strasburgh.
    topic_code: "3.E"
  - front: The Orkney hut
    back: |
      Victor leaves Clerval in Scotland and sets up a laboratory on a remote island in the Orkneys. Isolation again: the conditions of the first creation repeated.
    topic_code: "2.A"
  - front: "\"Ten thousand times more malignant than her mate\""
    back: |
      Victor's fear about the female (Vol. III, Ch. III): she might delight in murder for its own sake, refuse the bargain, or breed "a race of devils." His one act of foresight.
    topic_code: "1.B"
  - front: Destroying the female → its function
    back: |
      Victor tears the half-made body apart as the creature watches from the window. The decision protects "the species of man" and provokes the deaths of Clerval and Elizabeth: foresight that still refuses the creature a hearing.
    topic_code: "3.E"
  - front: "\"You are my creator, but I am your master;—obey!\""
    back: |
      The creature's reversal of the maker-made relation in Vol. III, Ch. III. At Montanvert he pleaded with "thou"; now he commands.
    topic_code: "1.B"
  - front: "\"I shall be with you on your wedding-night\""
    back: |
      The creature's threat. Victor takes it as a threat to his own life; the reader, remembering William and Justine, fears for Elizabeth. Dramatic irony drives the last chapters.
    topic_code: "3.E"
  - front: Clerval's death
    back: |
      Found strangled on the Irish coast where Victor lands. Victor is accused before the magistrate Mr. Kirwin, collapses at the sight of the body, and lies months in fever in prison.
    topic_code: "3.E"
  - front: Mr. Kirwin
    back: |
      The Irish magistrate, old and benevolent, who hears the case, cares for Victor in prison and writes to his father. Victor is cleared when it is proved he was in the Orkneys.
    topic_code: "1.A"
  - front: Elizabeth's letter (Vol. III, Ch. V)
    back: |
      She offers to release Victor if he loves another and does not want a marriage of duty. Her candour contrasts with Victor's promise to reveal his secret only after the wedding.
    topic_code: "1.C"
  - front: The wedding night at Evian
    back: |
      Victor, armed, searches the inn for the creature while Elizabeth waits alone; he hears her scream and finds her strangled. The creature grins at the window and escapes into the lake.
    topic_code: "3.E"
  - front: Victor's father's death
    back: |
      He dies soon after Elizabeth, broken by grief. The family Victor left to pursue knowledge is destroyed member by member.
    topic_code: "3.E"
  - front: The pursuit → its structure
    back: |
      Victor chases the creature across Europe, Russia and into the Arctic; the creature leaves messages and sometimes food to keep him going. Pursuer and pursued, each sustaining the other.
    topic_code: "3.F"
  - front: Walton's crew demands to turn back
    back: |
      Beset by ice, the sailors ask Walton to promise to sail south if they are freed. The frame's external conflict returns as a choice between glory and other people's lives.
    topic_code: "3.F"
  - front: "\"be more than men...firm as a rock\""
    back: |
      Victor's speech urging the crew to go on (Vol. III, Ch. VII). Ambition still speaking through him at the end, against the advice he gives Walton in private.
    topic_code: "1.B"
  - front: "\"Seek happiness in tranquillity, and avoid ambition\""
    back: |
      Victor's dying advice to Walton, which he immediately qualifies by allowing that another may succeed. His final position on ambition is divided, not repentant.
    topic_code: "1.B"
  - front: Walton turns back → function in the frame
    back: |
      The man who began by choosing ambition over companionship ends by choosing his crew's lives over discovery. Whether he has learned or merely yielded is open.
    topic_code: "3.C"
  - front: The creature over Victor's body
    back: |
      Walton finds him at the coffin, hears him grieve and condemn himself, and watches him leap from the cabin window onto an ice-raft. His death is announced, not shown.
    topic_code: "3.E"
  - front: "\"Blasted as thou wert, my agony was still superior to thine\""
    back: |
      The creature's claim to the greater suffering, echoing Victor's at Justine's trial ("The tortures of the accused did not equal mine"). Rivals in remorse to the last.
    topic_code: "3.D"
  - front: "\"Lost in darkness and distance\""
    back: |
      The novel's final words, Walton's view of the creature borne away on the ice. An open ending: no death scene, no reconciliation.
    topic_code: "3.C"
  - front: Q3 literary argument → what it asks
    back: |
      A literary concept (e.g., a character who must answer for a creation) and a work of your choice; you argue how the concept contributes to an interpretation of the work as a whole.
    topic_code: "7.E"
  - front: Planning a Q3 essay → ten minutes
    back: |
      Write the thesis, one arguing topic sentence per body paragraph, and two or three pieces of evidence for each before drafting. The plan is the line of reasoning.
    topic_code: "7.E"
  - front: Topic sentence that argues vs reports
    back: |
      Reports: "In Volume III, Victor goes to the Orkneys." Argues: "Even Victor's one act of foresight repeats his old refusal, because he decides the creature's fate without hearing him."
    topic_code: "7.E"
  - front: Transitions that show logic
    back: |
      Escalation ("If X might be excused, Y cannot"), concession ("Victor does consider consequences; yet..."), cause ("Because Victor never answers the claim..."). "Then," "next" and "also" only list.
    topic_code: "7.E"
  - front: Keep the subject of the sentence the subject of your claim
    back: |
      "It is shown by Shelley that Victor's horror..." buries it. "Shelley shows that Victor's horror..." or "Victor's horror exposes..." puts the claim where the reader looks.
    topic_code: "7.E"
  - front: Precise verbs for commentary
    back: |
      Instead of "shows how": exposes, undercuts, complicates, mirrors, anticipates, indicts, reverses. Each names a specific relation between evidence and claim.
    topic_code: "7.E"
  - front: Sentence variety for emphasis
    back: |
      After a long sentence of evidence and qualification, a short claim lands: "He does not stay." Control, not decoration.
    topic_code: "7.E"
  - front: A conclusion that widens
    back: |
      Not a restatement of the thesis but an extension: to Walton's choice, to the creature's self-judgment, to what the novel suggests about any maker's duties.
    topic_code: "7.E"
  - front: Concession in an AP essay
    back: |
      Acknowledge the strongest point against your reading, then show why your reading still holds. Earned concession is one route to the sophistication point.
    topic_code: "7.E"
  - front: Row C (sophistication) → what it is not
    back: |
      Not long words or a sweeping final sentence. It is a complex argument sustained through the essay: tensions, alternative readings, broader context, or a consistently vivid, precise style.
    topic_code: "7.E"
  - front: Frankenstein as a whole → one defensible reading
    back: |
      The novel locates the horror of creation less in making than in the refusal of responsibility for what is made, tested in Victor, the creature and, finally, Walton.
    topic_code: "7.E"

quiz:
  description: |
    24 questions · about 45 minutes · about 35% this week (composition and the literary argument) and 65% spiral
    review across the whole unit and earlier skills, mostly on Volume III and the ending. Multiple choice,
    select-all and true/false are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the full literary-argument essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Passage set: the creature's farewell (Vol. III, Ch. VII)
    - slug: u03-w10-q01
      type: multiple_choice
      topic_code: "1.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: &s10 |
        *The following passage is from the end of Mary Shelley's* Frankenstein *(1818), Volume III, Chapter VII, in Walton's final letter. Victor has died aboard Walton's ship; the creature, standing over the body, speaks first to Walton and then to the dead Victor.*

        "Fear not that I shall be the instrument of future mischief. My work is nearly complete. Neither your's nor any man's death is needed to consummate the series of my being, and accomplish that which must be done; but it requires my own. Do not think that I shall be slow to perform this sacrifice. I shall quit your vessel on the ice-raft which brought me hither, and shall seek the most northern extremity of the globe; I shall collect my funeral pile, and consume to ashes this miserable frame, that its remains may afford no light to any curious and unhallowed wretch, who would create such another as I have been. I shall die. [...]

        "Farewell! I leave you, and in you the last of human kind whom these eyes will ever behold. Farewell, Frankenstein! If thou wert yet alive, and yet cherished a desire of revenge against me, it would be better satiated in my life than in my destruction. But it was not so; thou didst seek my extinction, that I might not cause greater wretchedness; and if yet, in some mode unknown to me, thou hast not yet ceased to think and feel, thou desirest not my life for my own misery. Blasted as thou wert, my agony was still superior to thine; for the bitter sting of remorse may not cease to rankle in my wounds until death shall close them for ever."
      prompt: |
        Compared with his demand at Montanvert ("Make me happy, and I shall again be virtuous"), the creature in this passage has changed chiefly in that he
      options:
        - 'still believes Victor can make him happy'
        - 'turns judgment on himself, resolving on his own death and speaking of "remorse" rather than demanding redress'
        - 'threatens Walton with the same fate as Victor'
        - 'denies having harmed anyone'
      option_explanations:
        - |
          Victor is dead and the creature plans his own death; the hope of happiness from his maker is over.
        - |
          Correct. The pleader of Volume II now condemns himself: his death is "needed," and "the bitter sting of remorse" names guilt, not grievance.
        - |
          He tells Walton to "Fear not" and says no man's death but his own is needed; he threatens no one.
        - |
          "Remorse" and "sacrifice" acknowledge his crimes; he does not deny them.
      answer: 1

    - slug: u03-w10-q02
      type: multiple_choice
      topic_code: "4.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s10
      prompt: |
        The shift from addressing Walton ("your vessel") to addressing the dead Victor ("Farewell, Frankenstein! If thou wert yet alive") primarily serves to
      options:
        - 'show that the creature confuses Walton with Victor'
        - 'let the creature speak his last words to his maker, whom he can now address only in the hypothetical, while Walton, and the reader, overhear'
        - 'reveal that Victor is still alive'
        - 'end the frame narrative by having Victor answer'
      option_explanations:
        - |
          He distinguishes them clearly: Walton is "the last of human kind whom these eyes will ever behold," and Frankenstein is named.
        - |
          Correct. The conditional ("If thou wert yet alive") marks the impossibility of reply; the creature's final dialogue with his maker is one-sided, recorded by the frame narrator.
        - |
          "If thou wert yet alive" and "in some mode unknown to me" make clear Victor is dead.
        - |
          Victor never answers; the frame ends with Walton watching the creature disappear.
      answer: 1

    - slug: u03-w10-q03
      type: multiple_choice
      topic_code: "3.E"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s10
      prompt: |
        The creature's plan to burn his body "that its remains may afford no light to any curious and unhallowed wretch, who would create such another as I have been" functions in the novel chiefly to
      options:
        - 'leave open the possibility that Walton will repeat Victor''s experiment'
        - 'close the story of creation by destroying the only evidence that could let another maker repeat it'
        - 'show that the creature wants to be remembered'
        - 'reveal the secret of Victor''s method to Walton'
      option_explanations:
        - |
          The plan does the opposite: it removes the means by which anyone could repeat the work.
        - |
          Correct. Victor withheld the secret from Walton; the creature completes the silence by consuming "this miserable frame," ending the line of making.
        - |
          He wants his remains reduced "to ashes" so that nothing survives; it is an act of erasure.
        - |
          He reveals nothing of the method; his concern is that no one learn it.
      answer: 1

    - slug: u03-w10-q04
      type: multiple_choice
      topic_code: "5.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s10
      prompt: |
        In the phrase "afford no light to any curious and unhallowed wretch," the word "light" most nearly means
      options:
        - 'warmth from the funeral fire'
        - 'knowledge or insight that could guide another experimenter'
        - 'daylight in the Arctic summer'
        - 'a lamp to read by'
      option_explanations:
        - |
          The fire is mentioned, but "afford no light to" a would-be creator refers to what his remains might teach, not to heat.
        - |
          Correct. Light as knowledge recalls Victor's ambition to "pour a torrent of light into our dark world"; the creature turns the metaphor against its source.
        - |
          The phrase concerns what a "curious" person could learn from his body, not the season.
        - |
          Too literal; "curious and unhallowed" shows the concern is forbidden inquiry.
      answer: 1

    - slug: u03-w10-q05
      type: multiple_choice
      topic_code: "3.D"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s10
      prompt: |
        "Blasted as thou wert, my agony was still superior to thine" most directly recalls which earlier moment, and to what effect?
      options:
        - 'Walton''s complaint "I have no friend, Margaret," suggesting the creature envies Walton'
        - 'Victor at Justine''s trial, "The tortures of the accused did not equal mine," showing maker and creature as rivals in suffering to the end'
        - 'Waldman''s lecture, suggesting the creature admires modern science'
        - 'Elizabeth''s letter, suggesting the creature wished to marry'
      option_explanations:
        - |
          The sentence compares the creature's agony with Victor's ("thine"), not with Walton's loneliness.
        - |
          Correct. Both men measure their pain against another's and claim the greater share; the echo binds creator and creature in a rivalry of remorse.
        - |
          Nothing in the sentence concerns science; it is about suffering.
        - |
          Elizabeth's letter concerns her and Victor; it has no bearing on this comparison.
      answer: 1

    - slug: u03-w10-q06
      type: multiple_choice
      topic_code: "7.C"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s10
      prompt: |
        A student's thesis argues that by the end the creature understands Victor better than Victor ever understood him. Which commentary best supports this thesis?
      options:
        - 'The creature says goodbye to Victor, which is sad.'
        - 'The creature attributes to Victor a motive he can respect, seeking his extinction "that I might not cause greater wretchedness," a fairness Victor, who called him "dæmon" and "wretch," never extended to him.'
        - 'The creature plans to go to the North Pole.'
        - 'The creature uses "thou," which is old-fashioned.'
      option_explanations:
        - |
          An emotional response, not an explanation of how the evidence supports the thesis.
        - |
          Correct. It quotes the key phrase, interprets it as a charitable reading of Victor's motive, and contrasts it with Victor's names for the creature, directly supporting the thesis.
        - |
          A plot detail with no link to understanding.
        - |
          Identifies diction without explaining its relevance to the thesis.
      answer: 1

    - slug: u03-w10-q07
      type: multi_select
      topic_code: "3.F"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 2
      partial_credit: true
      stimulus: *s10
      prompt: |
        Which statements accurately describe how this passage treats the conflict between Victor and the creature? Select all that apply.
      options:
        - 'The creature acknowledges that Victor''s pursuit had a reason other than revenge.'
        - 'The creature claims the conflict ended in his own victory and happiness.'
        - 'The conflict continues as internal conflict, "remorse," within the survivor.'
        - 'The creature''s resolve to die presents his death as the conclusion the conflict "requires."'
      option_explanations:
        - |
          Selected. "Thou didst seek my extinction, that I might not cause greater wretchedness."
        - |
          Not selected. His "agony" is "superior" to Victor's; nothing in the passage claims victory or happiness.
        - |
          Selected. The external struggle ends with Victor's death; the creature carries it inward as a sting that will not cease "until death."
        - |
          Selected. "Neither your's nor any man's death is needed... but it requires my own."
      answer: [0, 2, 3]

    - slug: u03-w10-q08
      type: multiple_choice
      topic_code: "7.E"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      stimulus: *s10
      prompt: |
        A student drafts: "It is shown by Shelley in this passage that there is a lot of remorse that the creature feels and it is very sad." Which revision shows the best control of composition?
      options:
        - 'It is shown by Shelley that the creature''s remorse is very, very sad.'
        - 'The creature''s final speech converts grievance into self-judgment: "the bitter sting of remorse" replaces the demands of Montanvert, and his death becomes a sentence he passes on himself.'
        - 'In this passage, which is at the end, there is remorse, and there are also other feelings, and they are sad.'
        - 'Remorse. The creature feels it. Sad.'
      option_explanations:
        - |
          Keeps the passive, buried subject and adds intensifiers instead of precision.
        - |
          Correct. Active, precise verb ("converts"), a clear subject, embedded evidence and a claim about change: the reader knows exactly what is argued.
        - |
          Wordy and vague; "other feelings" and "sad" say nothing specific.
        - |
          Fragments without a claim; short sentences need to carry an argument to work.
      answer: 1

    # ---- Full literary argument essay (Q3)
    - slug: u03-w10-q09
      type: long_answer
      topic_code: "7.E"
      source: general knowledge
      points: 6
      prompt: |
        Many works of literature feature a character whose pursuit of an ambition isolates that character from others. Either from your own reading or from the list below, choose a work of fiction or drama in which a character's ambition creates such isolation. Then, in a well-written essay, analyze how the character's isolation contributes to an interpretation of the work as a whole.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Provide evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.

        Suggested works: *Frankenstein* (Mary Shelley); *Hamlet* (William Shakespeare); *The Great Gatsby* (F. Scott Fitzgerald); *A Doll's House* (Henrik Ibsen); "The Birthmark" (Nathaniel Hawthorne); "Bartleby, the Scrivener" (Herman Melville). You may choose another work of comparable literary merit.
      answer: |
        Model (Frankenstein). Thesis: In Frankenstein, Victor's ambition isolates him at every stage, in the solitary chamber at Ingolstadt, in the silence of Justine's trial, in the hut on the Orkneys, and Shelley makes that isolation, rather than knowledge itself, the source of the novel's horrors, a reading the frame confirms when Walton finally chooses his companions over discovery.

        Line of reasoning: (1) Isolation creates the creature: nearly two years of secret labour, letters unanswered, health ruined; the creation is a product of solitude, and Victor judges and abandons it alone ("Beautiful!—Great God!"). (2) Isolation multiplies the harm: Victor's secret makes him silent at Justine's trial; feeling ("the fangs of remorse") replaces action. (3) Isolation repeats itself: the creature, abandoned, becomes as isolated as his maker ("wretched, helpless, and alone") and demands a companion; Victor, again alone in the Orkneys, decides his fate without a hearing, and the deaths of Clerval and Elizabeth follow. (4) The frame: Walton began friendless and ambitious; at the end he turns back for his crew. Sophistication: the creature as Victor's double in isolation; or the novel's tension between Victor's warning ("Seek happiness in tranquillity, and avoid ambition") and his refusal to renounce the attempt.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis that interprets how the character's isolation contributes to the work as a whole (not just to one scene). 0 for restating the prompt ("Victor's ambition isolates him") or for a claim about ambition with no link to the work's meaning.

        Row B Evidence and Commentary (0-4): 1 = summary of the plot, with evidence vague or general. 2 = some specific evidence, with commentary that repeats or simply asserts the isolation without explaining how it shapes meaning. 3 = specific, relevant evidence from across the work (beginning, middle and end), with commentary that explains how the isolation develops and supports a clear line of reasoning. 4 = all of 3, with consistent, precise commentary for every claim and a line of reasoning that builds (e.g., cause, multiplication, repetition, resolution), controlled by transitions that show logical relations.

        Row C Sophistication (0-1): 1 for complex thought sustained through the essay: exploring a tension (e.g., Victor's divided final advice), an alternative reading addressed through concession, the double of maker and creature, the frame's comment on the story, or a consistently vivid and precise style. Not earned by a single sweeping sentence or by vocabulary alone.

    # ---- Composition and the whole novel
    - slug: u03-w10-q10
      type: multiple_choice
      topic_code: "7.E"
      source: general knowledge
      points: 1
      prompt: |
        Which transition best shows the logical relationship between these two body paragraphs? Paragraph 1: Victor flees the creature on the night of animation. Paragraph 2: Victor stays silent at Justine's trial.
      options:
        - 'Next, Victor goes to the trial.'
        - 'If Victor''s flight on the night of animation might be excused as shock, his silence at Justine''s trial cannot be.'
        - 'Also, there is a trial.'
        - 'Another thing that happens is the trial.'
      option_explanations:
        - |
          "Next" signals only sequence; it does not tell the reader how the second point advances the argument.
        - |
          Correct. The sentence concedes a point about the first episode and escalates to the second, so the reader sees the argument building.
        - |
          "Also" lists; it adds an item without relating it to the first.
        - |
          Vague and additive; it turns an argument into a list of events.
      answer: 1

    - slug: u03-w10-q11
      type: multiple_choice
      topic_code: "7.E"
      source: general knowledge
      points: 1
      prompt: |
        Which is the most effective topic sentence for a body paragraph in an essay arguing that Victor never accepts responsibility for his creation?
      options:
        - 'In Volume III, Victor goes to the Orkneys to make a female creature.'
        - 'The Orkneys are islands off the north of Scotland.'
        - 'Even Victor''s one act of foresight in the Orkneys repeats his old refusal, because he decides the creature''s fate without hearing him again.'
        - 'This paragraph will talk about the Orkneys.'
      option_explanations:
        - |
          Plot report; it gives the reader nothing to prove.
        - |
          A geographical fact irrelevant to the argument.
        - |
          Correct. It makes an arguable claim, anticipates a counterpoint (foresight), and ties the episode to the thesis.
        - |
          Announces a topic; it neither claims nor connects.
      answer: 2

    - slug: u03-w10-q12
      type: multiple_choice
      topic_code: "7.E"
      source: general knowledge
      points: 1
      prompt: |
        Which closing sentence would most effectively conclude an essay arguing that *Frankenstein* locates horror in the refusal of responsibility?
      options:
        - 'In conclusion, Victor does not accept responsibility, as I have shown in this essay.'
        - 'Frankenstein is a very good book that everyone should read.'
        - 'Walton''s choice to turn back for his crew answers Victor''s failure in the frame itself: the novel ends not with a lesson spoken but with a responsibility accepted, by the one listener who was still free to choose.'
        - 'There are many themes in Frankenstein, such as ambition, nature and family.'
      option_explanations:
        - |
          Restates the thesis without extending it, and points at the essay rather than the novel.
        - |
          A personal evaluation, outside the argument.
        - |
          Correct. It widens the thesis to the frame and Walton, adding a final insight rather than repeating.
        - |
          Lists themes; it abandons the essay's claim for a survey.
      answer: 2

    - slug: u03-w10-q13
      type: multiple_choice
      topic_code: "3.E"
      source: general knowledge
      points: 1
      prompt: |
        Victor's destruction of the half-made female is significant in the plot chiefly because it
      options:
        - 'ends the creature''s violence for good'
        - 'provokes the creature''s revenge on Victor''s closest companions, Clerval and Elizabeth, turning the threat of a "race of devils" into the reality of more murders'
        - 'leads Victor to confess everything to Clerval'
        - 'convinces the creature to go to South America alone'
      option_explanations:
        - |
          It does the opposite; the creature vows revenge and kills Clerval and Elizabeth.
        - |
          Correct. The decision meant to protect humanity sets in motion the destruction of Victor's own circle.
        - |
          Victor confesses to no one; Clerval is soon found dead.
        - |
          The creature abandons the South American plan; without a companion he turns to revenge.
      answer: 1

    - slug: u03-w10-q14
      type: multiple_choice
      topic_code: "1.B"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      prompt: |
        In the Orkneys, Victor reflects that the female "might become ten thousand times more malignant than her mate." Compared with Victor on the night of animation, this reflection shows that he has
      options:
        - 'not changed at all'
        - 'changed by learning, too late, to weigh the consequences of creating before he acts'
        - 'decided that knowledge should be shared freely'
        - 'come to love the creature as a son'
      option_explanations:
        - |
          On the night of animation he considered nothing beyond his "dream"; here he reasons through possible consequences. That is a change.
        - |
          Correct. Conditional reasoning ("might," "ignorant") replaces the immoderate ardour of Volume I, and the change has disastrous results of its own.
        - |
          He keeps his method secret to the end and destroys the female; he does not advocate sharing knowledge.
        - |
          He still calls the creature "the dæmon" and "the wretch"; his reasoning is about danger, not love.
      answer: 1

    - slug: u03-w10-q15
      type: multiple_choice
      topic_code: "3.E"
      source: 'Mary Shelley, Frankenstein (1818)'
      points: 1
      prompt: |
        The creature warns, "I shall be with you on your wedding-night." Which best describes how this line functions in the last chapters?
      options:
        - 'It is a promise to attend the wedding as a guest.'
        - 'Victor reads it as a threat to his own life, while the reader fears for Elizabeth; the dramatic irony sustains suspense and exposes Victor''s self-absorption.'
        - 'It is never mentioned again.'
        - 'It reveals that the creature has given up revenge.'
      option_explanations:
        - |
