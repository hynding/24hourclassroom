      points: 2
      prompt: |
        For the thesis "Clerval's death is the price of Victor's one act of foresight," name two pieces of evidence from Volume III and explain in one sentence why they are sufficient together.
      answer: |
        First, Victor's reasoning in the Orkneys that the female "might become ten thousand times more malignant than her mate," followed by his tearing her apart as the creature watches; second, the discovery of Clerval strangled on the Irish shore soon after. Together they link the decision and its consequence across two chapters, so the claim of cause rests on both ends.
