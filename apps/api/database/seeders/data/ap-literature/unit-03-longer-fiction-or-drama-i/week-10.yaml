    - slug: u03-w10-q22
      type: short_answer
      topic_code: "7.E"
      source: general knowledge
      points: 3
      prompt: |
        Revise this paragraph opening for clarity and control (two or three sentences). Keep the ideas; fix the subject, the verbs and the transition: "Also, another thing is that there is a lot of irony in the wedding night because it is shown that Victor thinks it is him and it is really Elizabeth which is sad."
      answer: |
        The wedding night turns the creature's threat into the novel's cruellest dramatic irony. Convinced that "I shall be with you on your wedding-night" promises his own death, Victor arms himself and searches the inn, leaving Elizabeth alone in the one room the creature means to enter.
      explanation: |
        1 point: a clear, active sentence whose subject is the thing claimed (the wedding night, the irony, Victor), replacing "Also, another thing is" and "it is shown." 1 point: precise diction and embedded evidence instead of vague words ("a lot," "sad"). 1 point: preserves the idea (Victor's misreading, Elizabeth as the real target) and states it as an arguable claim.

    - slug: u03-w10-q23
      type: short_answer
      topic_code: "7.B"
      source: general knowledge
      points: 2
      prompt: |
        Write a defensible thesis (one or two sentences) for a Q3 essay on this prompt, using *Frankenstein*: "Analyze how a character's relationship with a parent or parental figure contributes to an interpretation of the work as a whole."
      answer: |
        By making Victor a devoted son and a negligent father, Shelley shows that the love Victor received from his family never teaches him what he owes to what he makes, so that the novel finally measures every creator by the care he gives rather than the power he has.
      explanation: |
        2 points: an arguable thesis that interprets the parent relationship (Victor and his parents, or Victor as the creature's parent) and links it to the meaning of the whole novel, with a hint of reasoning. 1 point: a defensible but narrow or general claim. 0: plot or restated prompt.

    - slug: u03-w10-q24
      type: short_answer
