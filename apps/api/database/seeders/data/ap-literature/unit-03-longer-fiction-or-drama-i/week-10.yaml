        1 point: two accurate, relevant pieces of evidence (the reasoning or destruction, and Clerval's murder; the creature's threats and vow could also serve). 1 point: an explanation of sufficiency (cause and effect both shown, across the sequence). Evidence from other volumes, without connection to the claim, earns no credit.
