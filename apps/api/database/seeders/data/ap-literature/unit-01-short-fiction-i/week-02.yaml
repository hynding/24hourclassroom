week: 2
unit: 1
title: Setting and Plot in "Araby"
topics: ["2.A", "3.A"]
texts:
  - author: James Joyce
    title: Araby (in Dubliners)
    year: 1914
    url: https://www.gutenberg.org/ebooks/2814
guide: guides/week-02.md
guide_description: |
  James Joyce's "Araby": how a dead-end Dublin street, a dark house, a noisy market and an emptying bazaar convey a
  boy's inner life, and how the plot is ordered to move from devotion to a single moment of recognition. Worked
  close readings of four passages, a model setting paragraph, the epiphany, and a spiral review of first-person
  retrospective narration.
flashcards_description: |
  30 cards on setting and plot vocabulary, the places, people and lines of "Araby", and the adult narrator looking
  back on his boyhood.

flashcards:
  - front: Setting → what AP means by it
    back: |
      Not just time and place but the whole physical and social world of a story: rooms, streets, weather, light, sounds, customs, class and religion. Skill 2.A asks you to identify the details that convey it.
    topic_code: "2.A"
  - front: Setting as a mirror of mind
    back: |
      A narrative can describe places so that they reflect a character's feelings. In "Araby" dark, enclosed spaces and sudden lights track the boy's moods.
    topic_code: "2.A"
  - front: Atmosphere
    back: |
      The emotional feeling a setting gives off (gloomy, festive, sacred, oppressive). Atmosphere comes from concrete details: in "Araby," brown houses, musty air, darkness and silence.
    topic_code: "2.A"
  - front: Plot → the AP definition
    back: |
      The arrangement of events as the reader meets them, which may differ from the order in which they happened. Skill 3.A asks how the plot orders events.
    topic_code: "3.A"
  - front: Exposition, rising action, climax, falling action, resolution
    back: |
      A common map of a plot's parts. Many modern short stories compress or omit the last two: "Araby" ends at its climax, a moment of recognition, with no aftermath.
    topic_code: "3.A"
  - front: Chronological order vs flashback
    back: |
      Chronological order tells events in the sequence they happened. A flashback interrupts it to show earlier events. "Araby" is told in order, but from a much later vantage point.
    topic_code: "3.A"
  - front: Pacing → scene vs summary
    back: |
      Scene renders a moment in detail (the bazaar); summary covers a long stretch quickly (months of watching the girl in a few sentences). Where a story slows down tells you what matters to it.
    topic_code: "3.A"
  - front: Epiphany → Joyce's sense
    back: |
      A sudden moment of insight in which a character, or the reader, sees the truth of a situation. Joyce used the word for such moments; "Araby" ends on one.
    hint: Think of the last sentence.
    topic_code: "3.A"
  - front: "\"Araby\" → publication"
    back: |
      The third story in James Joyce's Dubliners (1914), a book of fifteen stories set in Dublin and arranged from childhood to maturity to public life. "Araby" closes the three stories of childhood.
    topic_code: "3.A"
  - front: North Richmond Street, "being blind"
    back: |
      "Blind" means a dead-end street. The first word about the setting also suggests a world with no way out, and a boy who cannot yet see clearly.
    topic_code: "2.A"
  - front: The houses "with brown imperturbable faces"
    back: |
      Personified houses, "conscious of decent lives within them," gaze at each other. Respectable, unmoved, brown: the street's dullness and propriety in one image.
    topic_code: "2.A"
  - front: The dead priest's books
    back: |
      In the waste room the boy finds The Abbot (Walter Scott, a romance), The Devout Communicant (devotion) and The Memoirs of Vidocq (a criminal-turned-detective). Romance, religion and adventure: the ingredients of his coming fantasy.
    topic_code: "2.A"
  - front: The wild garden and the rusty bicycle-pump
    back: |
      Behind the house: a central apple-tree and the dead priest's rusty pump. The tree can suggest a fallen Eden; the pump is neglected machinery. The setting is a ruined garden.
    topic_code: "2.A"
  - front: "\"the colour of ever-changing violet\" → the winter evenings"
    back: |
      The boys play in dusk under a violet sky with feeble street lamps. Darkness, cold and small lights recur through the story, and the boys hide in the dark to watch the street.
    topic_code: "2.A"
  - front: Mangan's sister
    back: |
      The girl the narrator worships. She is never named; she is defined by her brother, her doorstep and the lamplight on her neck and hair. The namelessness keeps her an image rather than a person.
    topic_code: "2.A"
  - front: "\"a summons to all my foolish blood\""
    back: |
      The narrator says the girl's name was like "a summons to all my foolish blood." "Summons" is a call to duty or worship; "foolish" is the adult narrator's judgment on his younger self.
    topic_code: "3.A"
  - front: "\"I imagined that I bore my chalice safely through a throng of foes\""
    back: |
      In the noisy Saturday-night market, the boy imagines himself a knight or acolyte carrying a sacred vessel. Religious and chivalric romance are fused into his love.
    topic_code: "2.A"
  - front: "\"my body was like a harp\""
    back: |
      Her words and gestures are "like fingers running upon the wires." The simile makes the boy a passive instrument played by her, not an actor in his own story.
    topic_code: "2.A"
  - front: The first conversation
    back: |
      Mangan's sister asks whether he is going to Araby; she cannot go because of a retreat at her convent school. He promises, "If I go, I will bring you something." The promise drives the rest of the plot.
    topic_code: "3.A"
  - front: "\"ugly monotonous child's play\""
    back: |
      Waiting for the bazaar, the boy finds "the serious work of life" to be "child's play, ugly monotonous child's play." The irony: he is a child, and the bazaar is the real child's play.
    topic_code: "3.A"
  - front: "\"an Eastern enchantment\""
    back: |
      The syllables of "Araby" cast "an Eastern enchantment" over him. The bazaar's exotic name stands for every romance he has invented; the actual bazaar will not match it.
    topic_code: "2.A"
  - front: The obstacles before the bazaar
    back: |
      The uncle's late return on Saturday night, a visitor (Mrs Mercer) lingering over tea, and a slow train. Each delay builds the tension and ensures he arrives as the bazaar is closing.
    topic_code: "3.A"
  - front: The bazaar hall
    back: |
      Most stalls closed, most of the hall dark, "a silence like that which pervades a church after a service." The sacred feeling he hoped for is there only as emptiness after the ceremony is over.
    topic_code: "2.A"
  - front: The young lady at the stall
    back: |
      She is flirting with two young men with English accents and serves him reluctantly. Their trivial banter ("O, I never said such a thing!") is the opposite of his idealised love.
    topic_code: "3.A"
  - front: The coins in his pocket
    back: |
      He says, "I allowed the two pennies to fall against the sixpence in my pocket." The tiny, exact sum measures how little he can buy and how small the quest has become.
    topic_code: "2.A"
  - front: "\"a creature driven and derided by vanity\""
    back: |
      The final epiphany: gazing up into the darkness, he sees himself as "driven and derided by vanity," his eyes burning "with anguish and anger." The quest collapses into self-knowledge.
    topic_code: "3.A"
  - front: Light and darkness → the pattern in "Araby"
    back: |
      Lamplight on the girl, light from the kitchen windows, the dark bazaar, the voice announcing "the light was out." Light belongs to his idealised love; darkness to its end.
    topic_code: "2.A"
  - front: Retrospective first-person narration → the two "I"s
    back: |
      The narrator is a man recalling his boyhood. The younger "I" experiences; the older "I" chooses the words ("foolish blood," "confused adoration"). The gap between them is the story's irony.
    topic_code: "4.B"
  - front: "Araby → narrator vs Magi narrator"
    back: |
      O. Henry's narrator stands outside the story and jokes with the reader. Joyce's narrator was inside the story as a boy and never addresses the reader; his judgment arrives only through word choice.
    topic_code: "4.A"
  - front: Why the story ends at the epiphany
    back: |
      There is no scene of the boy going home or seeing the girl again. Ending on the moment of recognition makes it the whole point of the plot; what he does next does not matter.
    topic_code: "3.A"

quiz:
  description: |
    22 questions · about 35 minutes · about 60% this week (setting and plot in "Araby") and 40% spiral review of week
    1's skills: character, narrator and point of view, in "Araby" and in "The Gift of the Magi". Multiple choice,
    select-all and true/false items are graded at once; the fill-in-the-blank items are matched automatically; the
    two short answers and the analytical paragraph are graded by your teacher against the model answer and notes.
  questions:
    # ---- Passage set: the Saturday-night market
    - slug: u01-w02-q01
      type: multiple_choice
      topic_code: "2.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      stimulus: &araby_market |
        *The following passage is from James Joyce's "Araby," published in* Dubliners *(1914). The narrator has fallen in love with the older sister of his friend Mangan.*

        Her image accompanied me even in places the most hostile to romance. On Saturday evenings when my aunt went marketing I had to go to carry some of the parcels. We walked through the flaring streets, jostled by drunken men and bargaining women, amid the curses of labourers, the shrill litanies of shop-boys who stood on guard by the barrels of pigs' cheeks, the nasal chanting of street-singers, who sang a *come-all-you* about O'Donovan Rossa, or a ballad about the troubles in our native land. These noises converged in a single sensation of life for me: I imagined that I bore my chalice safely through a throng of foes. Her name sprang to my lips at moments in strange prayers and praises which I myself did not understand. My eyes were often full of tears (I could not tell why) and at times a flood from my heart seemed to pour itself out into my bosom. I thought little of the future. I did not know whether I would ever speak to her or not or, if I spoke to her, how I could tell her of my confused adoration. But my body was like a harp and her words and gestures were like fingers running upon the wires.
      prompt: |
        The details of the Saturday-evening streets ("drunken men and bargaining women," "the curses of labourers," "barrels of pigs' cheeks") primarily serve to
      options:
        - |
          show that the narrator's family is poorer than their neighbours
        - |
          create a crude, noisy, commercial setting against which the boy's private devotion stands out
        - |
          suggest that the boy secretly enjoys the excitement of the market more than his love
        - |
          establish that the story takes place during a political uprising
      option_explanations:
        - |
          The passage describes public streets on market night, not the family's means; the aunt is simply shopping and the boy carrying parcels.
        - |
          Correct. The narrator calls these "places the most hostile to romance." Drink, haggling, cursing and pigs' cheeks make a world of bodies and bargains, so the boy's inner world of "prayers and praises" is set in sharp relief.
        - |
          The market is not enjoyed for itself; its noises are absorbed into his fantasy ("a single sensation of life for me"). He carries his love through it, not away from it.
        - |
          The ballads about O'Donovan Rossa and "the troubles in our native land" are songs sung by street-singers, part of the noise of Irish street life, not evidence of a current uprising.
      answer: 1
      explanation: |
        Skill 2.A: identify what details convey about a setting, then ask what the setting does for the character. Here the setting is defined by contrast with the boy's feeling.

    - slug: u01-w02-q02
      type: multiple_choice
      topic_code: "1.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      stimulus: *araby_market
      prompt: |
        The sentence "I imagined that I bore my chalice safely through a throng of foes" reveals that the boy
      options:
        - |
          is training to become a priest and practises carrying sacred vessels
        - |
          feels threatened by the people in the market and fears for his safety
        - |
          casts himself as the hero of a sacred quest, fusing religious devotion with romantic love
        - |
          is ashamed of carrying his aunt's parcels in public
      option_explanations:
        - |
          The chalice is imaginary ("I imagined"); nothing in the story says he intends the priesthood. The image borrows from religion rather than describing a vocation.
        - |
          The "foes" exist in his fantasy; the crowd jostles but does not threaten. The language is heroic, not fearful.
        - |
          Correct. A chalice is the cup of the Mass and the object of grail legends; carrying it "safely through a throng of foes" makes ordinary errands into a knightly mission. His love has taken the shape of worship.
        - |
          The parcels are real but he does not mention embarrassment; the fantasy transforms the errand into something noble rather than shameful.
      answer: 2
      explanation: |
        Character perspective (1.A) is often revealed by how a character imagines himself. Here the boy's self-image draws on the romances and devotional books of the dead priest's waste room.

    - slug: u01-w02-q03
      type: multiple_choice
      topic_code: "4.B"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      stimulus: *araby_market
      prompt: |
        The parenthetical remark "(I could not tell why)" functions chiefly to
      options:
        - |
          show that the narrator is hiding the true cause of his tears from the reader
        - |
          suggest that the tears are caused by an illness the narrator does not name
        - |
          convey the boy's inability to understand his own emotions, which the retrospective narrator reports honestly
        - |
          signal a shift from the narrator's past to his present situation
      option_explanations:
        - |
          The remark admits ignorance rather than concealing knowledge; the narrator is being candid about the boy's confusion.
        - |
          Nothing in the passage suggests illness; the tears accompany the "strange prayers and praises" of his love.
        - |
          Correct. Like "which I myself did not understand" and "confused adoration," the parenthesis records emotion outrunning understanding. The narrator lets us see the boy's confusion without explaining it away.
        - |
          The parenthesis stays in the past tense of the boyhood narrative; it does not move to the narrator's present.
      answer: 2
      explanation: |
        Spiral review of 4.B. In a retrospective first-person story, ask which words belong to the boy's experience and which to the man's understanding.

    - slug: u01-w02-q04
      type: multiple_choice
      topic_code: "4.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      stimulus: *araby_market
      prompt: |
        Which best describes the narrator of the passage?
      options:
        - |
          A boy describing his feelings as they happen, in his own childish vocabulary
        - |
          An adult recalling his boyhood in language more controlled and judging than the boy himself could have used
        - |
          An omniscient narrator who reports the thoughts of Mangan's sister as well as the boy's
        - |
          The aunt, describing her nephew's behaviour on market days
      option_explanations:
        - |
          The past tense and the adult vocabulary ("hostile to romance," "converged in a single sensation," "confused adoration") rule out a child speaking in the moment.
        - |
          Correct. The narrator says "I" and took part in the events, but tells them from long after, in a polished style that can call his younger self's feelings "confused" and his blood "foolish."
        - |
          The passage never enters the girl's mind; the narrator does "not know whether I would ever speak to her."
        - |
          The narrator went marketing with "my aunt"; the aunt is a character he mentions, not the teller.
      answer: 1
      explanation: |
        Spiral review of 4.A. The double perspective (boy experiencing, man narrating) is the key to reading "Araby," and especially its last sentence.

    - slug: u01-w02-q05
      type: multiple_choice
      topic_code: "2.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      stimulus: *araby_market
      prompt: |
        The sentence "These noises converged in a single sensation of life for me" marks a shift from
      options:
        - |
          the boy's private thoughts to a description of the market
        - |
          a catalogue of separate sounds in the setting to the boy's absorption of them into his inner life
        - |
          the past to the narrator's present
        - |
          the aunt's point of view to the boy's
      option_explanations:
        - |
          The movement is the reverse: the long preceding sentence lists the market, and this sentence turns inward.
        - |
          Correct. The cursing, chanting and haggling are listed one by one, then "converged" into one feeling that the boy experiences as a heroic quest. Setting is converted into state of mind.
        - |
          The passage stays in the past tense throughout; there is no move to the narrator's present.
        - |
          The aunt never has a point of view in the passage; it is the boy's experience from start to finish.
      answer: 1
      explanation: |
        A sentence that summarises what came before ("These noises") and turns it ("for me") often marks the hinge of a passage. Look for it when a question asks about a shift.

    - slug: u01-w02-q06
      type: multi_select
      topic_code: "2.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 3
      partial_credit: true
      stimulus: *araby_market
      prompt: |
        Which details from the passage help establish the market as "hostile to romance"? Select all that apply.
      options:
        - |
          "jostled by drunken men and bargaining women"
        - |
          "the shrill litanies of shop-boys who stood on guard by the barrels of pigs' cheeks"
        - |
          "the nasal chanting of street-singers"
        - |
          "my body was like a harp"
      option_explanations:
        - |
          Correct. Drunkenness and haggling are crude and commercial, and "jostled" makes the crowd physical and rough.
        - |
          Correct. "Shrill" and "pigs' cheeks" are grating and unglamorous; calling the shop-boys' cries "litanies" ironically borrows the language of prayer for selling meat.
        - |
          Correct. "Nasal chanting" makes the songs ugly to the ear, another sound the boy must carry his feeling through.
        - |
          This simile describes the boy's own body as an instrument played by the girl; it belongs to his romance, not to the hostile setting.
      answer: [0, 1, 2]
      explanation: |
        Sort details by what they describe: the external setting or the internal feeling. The passage is built on the contrast between the two.

    - slug: u01-w02-q07
      type: true_false
      topic_code: "1.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      stimulus: *araby_market
      prompt: |
        True or false: at this point in the story, the passage indicates that the boy has already told Mangan's sister how he feels about her.
      answer: false
      explanation: |
        False. He does "not know whether I would ever speak to her or not or, if I spoke to her, how I could tell her of my confused adoration." His love exists entirely in his own mind, which is why it can grow so large.

    - slug: u01-w02-q08
      type: multiple_choice
      topic_code: "1.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      stimulus: *araby_market
      prompt: |
        The simile at the end of the passage ("my body was like a harp and her words and gestures were like fingers running upon the wires") characterises the boy as
      options:
        - |
          a talented musician who hopes to impress the girl
        - |
          a passive instrument, entirely responsive to the girl, who acts upon him without knowing it
        - |
          a manipulator who plans to play on the girl's feelings
        - |
          a boy indifferent to the girl's words and gestures
      option_explanations:
        - |
          The harp is a figure for his body's response, not a literal skill; nothing in the story mentions music lessons.
        - |
          Correct. A harp makes no sound by itself; it vibrates when played. The image shows how completely his feelings are controlled by her slightest word or movement, though they have barely spoken.
        - |
          The fingers are hers, not his; he is the one being played.
        - |
          The image shows the opposite of indifference: every word and gesture sets him vibrating.
      answer: 1
      explanation: |
        For a simile, identify both halves (body and harp; her words and fingers) and ask which side is active. That reveals the character's position in the relationship.

    # ---- The whole story: setting, plot order, and review
    - slug: u01-w02-q09
      type: multiple_choice
      topic_code: "3.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      prompt: |
        Which best describes how the plot of "Araby" orders its events?
      options:
        - |
          It begins at the bazaar and then flashes back to explain how the boy came to be there.
        - |
          It tells events in chronological order, compressing months of devotion into summary and slowing to full scenes for the conversation, the wait and the bazaar.
        - |
          It alternates between the boy's story and the girl's story in parallel sections.
        - |
          It moves backward in time from the boy's disappointment to his first sight of the girl.
      option_explanations:
        - |
          The story opens with North Richmond Street and the boys' winter games, not at the bazaar; the bazaar comes last.
        - |
          Correct. The order is straightforward, but the pacing is not: weeks of watching pass in a few sentences, while a single Saturday evening (the uncle's delay, the train, the bazaar) receives several pages.
        - |
          The girl has no section of her own; everything is filtered through the narrator's memory.
        - |
          The story moves forward; the first sight of the girl comes early and the disappointment last.
      answer: 1
      explanation: |
        Skill 3.A: ask both "in what order?" and "at what speed?" Changes in pacing show where a plot puts its weight.

    - slug: u01-w02-q10
      type: multiple_choice
      topic_code: "3.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      prompt: |
        On the Saturday of the bazaar, which event comes immediately before the boy finally sets out?
      options:
        - |
          Mangan's sister tells him she cannot go to Araby because of a retreat at her convent.
        - |
          His uncle comes home late, around nine o'clock, and the boy asks again for money to go.
        - |
          He buys a porcelain vase for Mangan's sister.
        - |
          He finds the dead priest's books in the waste room.
      option_explanations:
        - |
          That conversation happens earlier, before he even promises to bring her something; it is what sets the quest in motion.
        - |
          Correct. The boy waits through the evening for his uncle, who forgot the bazaar; only after the late return and the boy's renewed request does he get his money and leave.
        - |
          He buys nothing at the bazaar; he leaves with the coins still in his pocket.
        - |
          The books belong to the exposition near the start of the story, long before the bazaar.
      answer: 1
      explanation: |
        Sequence questions reward a clear mental map of the plot. Build one: exposition (street, house, games), devotion, conversation and promise, waiting, delay, journey, bazaar, epiphany.

    - slug: u01-w02-q11
      type: multiple_choice
      topic_code: "2.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      prompt: |
        The story's first sentence describes North Richmond Street as "being blind," that is, a dead end. Which interpretation of this detail is best supported by the rest of the story?
      options:
        - |
          The street is dangerous at night because it has no lighting.
        - |
          The detail establishes a closed, stagnant world, and anticipates a boy who cannot yet see his situation clearly.
        - |
          The residents of the street are literally unable to see.
        - |
          The street is about to be demolished and its residents moved away.
      option_explanations:
        - |
          "Blind" refers to the street's shape, a cul-de-sac; and the boys play under street lamps, so the street is lit.
        - |
          Correct. A dead-end street suits the story's sense of confinement, and the word "blind" quietly prepares for the boy's blindness to the gap between his fantasy and the world, which he sees only at the end.
        - |
          No character is literally blind; the adjective describes the street.
        - |
          Nothing in the story mentions demolition; the houses are "decent" and settled.
      answer: 1
      explanation: |
        Opening details of setting often carry a second meaning. A defensible interpretation must start from the literal sense (a dead-end street) and then show how the story develops it.

    - slug: u01-w02-q12
      type: multiple_choice
      topic_code: "2.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      stimulus: |
        *The following passage is from James Joyce's "Araby" (1914). The narrator has just arrived at the bazaar.*

        I could not find any sixpenny entrance and, fearing that the bazaar would be closed, I passed in quickly through a turnstile, handing a shilling to a weary-looking man. I found myself in a big hall girdled at half its height by a gallery. Nearly all the stalls were closed and the greater part of the hall was in darkness. I recognised a silence like that which pervades a church after a service. I walked into the centre of the bazaar timidly.
      prompt: |
        The comparison of the bazaar's silence to "a church after a service" primarily suggests that
      options:
        - |
          the bazaar is being held in a converted church
        - |
          the boy feels the sacred atmosphere he hoped for has already drained away, leaving emptiness
        - |
          the boy plans to pray for help in choosing a gift
        - |
          the bazaar's organisers are religious and disapprove of trade
      option_explanations:
        - |
          The comparison is a simile ("like that which"), not a description of the building's past use.
        - |
          Correct. The boy has treated his quest as worship, and the bazaar was to be its shrine. A church "after a service" is a holy place with the ceremony over: the feeling of sanctity survives only as silence and darkness.
        - |
          Nothing in the passage refers to prayer; the simile describes the hall, not his intentions.
        - |
          The stalls are commercial and the story soon shows flirting and selling; the simile describes the atmosphere, not the organisers' views.
      answer: 1
      explanation: |
        The religious language that the boy used for his love (chalice, prayers, praises) returns here in the setting. Tracing such a pattern is the best way to explain a single detail.

    - slug: u01-w02-q13
      type: multiple_choice
      topic_code: "4.B"
      source: 'James Joyce, "Araby" (1914)'
      points: 1
      prompt: |
        The girl the narrator loves is never named; she is only "Mangan's sister." The best explanation of the function of this choice is that it
      options:
        - |
          shows that the narrator has forgotten her name in the years since
        - |
          keeps her an idealised image seen from the boy's point of view, rather than a person with an inner life of her own
        - |
          hides her identity because she is a famous person
        - |
          indicates that the narrator dislikes her
      option_explanations:
        - |
          Nothing suggests forgetting; the narrator remembers vivid details of her neck, hair and dress. The omission is a choice of the telling.
        - |
          Correct. The first-person point of view gives us the boy's worship, not the girl. Without a name or thoughts she remains a figure in his romance, lit by lamplight, which makes the gap between fantasy and reality the subject of the story.
        - |
          She is a neighbour on a Dublin street; nothing indicates fame.
        - |
          His feelings are adoration; the namelessness reflects idealisation, not dislike.
      answer: 1
      explanation: |
        Spiral review of 4.B. What a first-person narrator does not give us (a name, another character's thoughts) is as revealing as what he does.

