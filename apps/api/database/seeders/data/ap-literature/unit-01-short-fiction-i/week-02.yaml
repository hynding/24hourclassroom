    - slug: u01-w02-q22
      type: long_answer
      topic_code: "2.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 4
      prompt: |
        Write one well-developed analytical paragraph (about 150-200 words) explaining how Joyce uses details of light and darkness in the setting of "Araby" to convey the boy's movement from devotion to disillusionment. Use at least two short quotations from different parts of the story and explain how each supports your claim.
      answer: |
        Claim: In "Araby" light belongs to the boy's idealised love and darkness to its collapse, so the setting traces his disillusionment. Evidence 1: early on, "the light from the lamp opposite our door caught the white curve of her neck, lit up her hair," framing Mangan's sister like an image in a shrine. Commentary: the lamplight isolates and elevates her; the boy sees an illuminated icon, not a girl. Evidence 2: at the bazaar "the greater part of the hall was in darkness," and finally a voice calls "that the light was out." Commentary: the darkness arrives just as his quest fails; the place he imagined as enchanted is closing. Evidence 3 (optional): "Gazing up into the darkness" he sees himself "driven and derided by vanity." Commentary: in the dark he can finally see clearly; the loss of the romantic light is the condition of his insight.
      explanation: |
        4 points. Claim (1): an arguable claim linking light/darkness to the boy's emotional movement. Evidence (1): at least two accurate, short quotations about light or darkness from different points in the story. Commentary (2): 2 points if the commentary explains how each detail conveys his state of mind and connects them into a progression; 1 point if commentary is present but describes the setting without linking it to the boy, or explains only one piece of evidence; 0 for summary. Credit any accurate details (the violet sky and "feeble lanterns," kitchen-window light, the dark rainy evening before he speaks to her, the dark bazaar).
