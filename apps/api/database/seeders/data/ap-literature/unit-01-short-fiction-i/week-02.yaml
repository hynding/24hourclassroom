    - slug: u01-w02-q18
      type: short_answer
      topic_code: "2.A"
      source: 'James Joyce, "Araby" (1914)'
      points: 2
      prompt: |
        Choose one detail of setting from "Araby" (a place, a light, a sound, an object) and explain in two or three sentences what it conveys about the boy's state of mind at that point in the story.
      answer: |
        When the boy reaches the bazaar, "the greater part of the hall was in darkness" and the silence is "like that which pervades a church after a service." The darkened, emptied hall conveys his growing sense that the magic he expected has already gone: the place he imagined as a shrine of romance is closing, and the darkness prepares for his final realisation.
      explanation: |
        1 point: an accurate, specific detail of setting, quoted or precisely described. 1 point: a clear explanation of what it conveys about the boy's state of mind at that moment, linking the detail to his feeling rather than only describing the place. Good choices include the blind street, the musty house and the priest's books, the violet winter sky and street lamps, the market, the lamplight on the girl, the dark bazaar, and "the light was out."

    - slug: u01-w02-q19
      type: short_answer
      topic_code: "4.B"
      source: 'James Joyce, "Araby" (1914)'
      points: 2
      prompt: |
        The last sentence of "Araby" reads: "Gazing up into the darkness I saw myself as a creature driven and derided by vanity; and my eyes burned with anguish and anger." Explain in two or three sentences how the retrospective first-person narration affects the meaning of this sentence.
      answer: |
        The sentence records the boy's moment of insight, but the harsh words "creature," "driven" and "derided by vanity" belong to the older narrator who has understood it. Because we hear both voices at once, we feel the boy's pain while seeing, as the man does, that his romantic quest had been built on self-deception.
      explanation: |
        1 point: identifies the dual perspective (the boy who experiences, the adult who narrates). 1 point: explains how that dual perspective shapes the sentence's meaning or effect (for example, the boy's anguish and the adult's judgment; sympathy plus ironic distance). Merely labelling the narration "first person" earns 0.

