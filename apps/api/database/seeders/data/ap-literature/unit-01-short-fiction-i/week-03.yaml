    - slug: u01-w03-q18
      type: short_answer
      topic_code: "7.A"
      source: 'Guy de Maupassant, "The Necklace" (1884)'
      points: 3
      prompt: |
        Write a defensible claim about Mathilde Loisel, support it with one specific piece of evidence from the story (a quotation or a precise reference), and add one sentence of commentary explaining how the evidence supports the claim.
      answer: |
        Mathilde is ruined less by losing the necklace than by her refusal to be seen as she really is. Instead of admitting the loss to Madame Forestier, she and her husband secretly buy a replacement for thirty-six thousand francs. A single honest sentence to her friend would have revealed that the jewels were imitation, so it is her pride, not chance, that turns an accident into ten years of debt.
      explanation: |
        1 point: a defensible, arguable claim about Mathilde (not a plot fact). 1 point: specific, accurate evidence that bears on the claim. 1 point: commentary that explains how the evidence proves the claim, not a restatement of it.

    - slug: u01-w03-q19
      type: short_answer
      topic_code: "3.B"
      source: 'Guy de Maupassant, "The Necklace" (1884)'
      points: 2
      prompt: |
        In two or three sentences, explain the function of ending the story with Madame Forestier's revelation, rather than with a scene showing Mathilde's reaction or what she does next.
      answer: |
        Ending on the revelation leaves the reader alone with its meaning: the ten years of labour were unnecessary, caused by a lie Mathilde told to protect her pride. With no reaction scene to soften it, the irony falls with full force, and the reader must reinterpret everything that came before.
      explanation: |
        1 point: identifies what the ending does to the reader's understanding (recasts the ten years, completes the irony). 1 point: explains why stopping there, without aftermath, sharpens that effect. Summary of the ending earns 0.

