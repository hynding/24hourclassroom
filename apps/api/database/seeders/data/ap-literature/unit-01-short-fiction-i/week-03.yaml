    - slug: u01-w03-q22
      type: long_answer
      topic_code: "7.A"
      source: 'Guy de Maupassant, "The Necklace" (1884); O. Henry, "The Gift of the Magi" (1905); James Joyce, "Araby" (1914)'
      points: 6
      prompt: |
        Many works of literature feature a character who gives up something of value in pursuit of something they desire. Either from your own reading or from the works in this unit ("The Gift of the Magi," "Araby," "The Necklace"), choose a work of fiction in which a character makes such a sacrifice. Then, in a well-written essay, analyze how the sacrifice contributes to an interpretation of the work as a whole. Do not merely summarize the plot.
      answer: |
        A strong response on "The Necklace": Thesis: Mathilde sacrifices ten years of her youth to preserve a false appearance, and the sacrifice reveals that her deepest loss came not from poverty but from her refusal to accept an honest life, the very life the labour finally forces on her. Line of reasoning: (1) the opening establishes desire as comparison ("feeling herself born to enjoy all delicacies"); (2) the decision to replace rather than confess shows the sacrifice is chosen for appearance's sake; (3) the ten years make her one of the hardworking "women of the people" the opening sets her apart from; (4) the final revelation exposes the emptiness of what she sacrificed for. Key evidence: her tears over the invitation, the hurried exit from the ball to hide her wraps, the secret replacement, her coarsened hands and voice, the meeting with the unchanged Madame Forestier. Sophistication: noting the irony that her suffering also proves a strength and endurance she never had in her dreaming years, or comparing her sacrifice with Della's, which succeeds as love even though the gift fails.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis that makes a claim about how the sacrifice contributes to an interpretation of the work, not just that a sacrifice occurs. Row B Evidence and Commentary (0-4): 4 = specific, well-chosen evidence (events, details, short quotations) throughout, with commentary that consistently explains how the sacrifice develops the interpretation and builds a line of reasoning; 3 = specific evidence and commentary that explains most of it, with some gaps; 2 = some specific evidence but commentary that is uneven, repetitive or drifts into summary; 1 = mostly summary or general evidence with little or no explanation; 0 = no relevant evidence. Row C Sophistication (0-1): 1 point for a complex understanding, such as exploring the tension or irony in the sacrifice (what is lost and gained), situating it in a broader context (class, gender, religion), or weighing alternative interpretations, sustained rather than tacked on in a single sentence.
