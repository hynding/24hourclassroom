week: 3
unit: 1
title: Sequence and Argument in "The Necklace"
topics: ["3.B", "7.A"]
texts:
  - author: Guy de Maupassant
    title: The Necklace ("The Diamond Necklace" in Original Short Stories, Volume IV)
    year: 1884
    url: https://www.gutenberg.org/ebooks/3080
guide: guides/week-03.md
guide_description: |
  Guy de Maupassant's "The Necklace" in an early English translation: how its chain of cause and effect is built,
  why each event comes where it does, and why the truth about the necklace is held back to the last lines. Then the
  claim-and-evidence paragraph in full: choosing a claim that needs defending, picking the evidence that proves
  it, and avoiding summary. Worked readings, a model paragraph, common traps and a review of the unit's skills.
flashcards_description: |
  30 cards on plot sequence and causation, the events and people of "The Necklace", and the moves of a
  claim-and-evidence paragraph.

flashcards:
  - front: Sequence of events → the AP question (3.B)
    back: |
      Not "what happens?" but "why does this event come here, after that one?" A sequence has a function: it builds a cause-and-effect chain, creates contrast, delays knowledge or sets up a reversal.
    topic_code: "3.B"
  - front: Causal chain
    back: |
      A plot in which each event produces the next. In "The Necklace" invitation leads to dress, dress to jewels, jewels to borrowing, borrowing to loss, loss to debt, debt to ten years of labour.
    topic_code: "3.B"
  - front: Reversal (peripeteia)
    back: |
      A sudden turn of fortune to its opposite. Mathilde's triumph at the ball is followed within hours by the discovery that the necklace is gone.
    topic_code: "3.B"
  - front: Twist ending → what makes one earned
    back: |
      A final revelation that recasts everything before it, prepared for by earlier details. In "The Necklace" the twist depends on what Mathilde never asked and never said.
    topic_code: "3.B"
  - front: Withheld information → function
    back: |
      Delaying a fact the reader would want (that the diamonds were false) until the end makes the reader live through the ten years as Mathilde does, believing the sacrifice necessary, before the final line empties it of necessity.
    topic_code: "3.B"
  - front: Pacing in "The Necklace"
    back: |
      The evening of the ball and the night of the loss are told in detail; ten years of poverty pass in a few paragraphs. The contrast makes one night outweigh a decade.
    topic_code: "3.B"
  - front: Symmetry of the plot
    back: |
      The story opens with Mathilde dreaming of luxury in her modest home and closes with her, worn by labour, meeting the still-elegant Madame Forestier. Beginning and end mirror each other.
    topic_code: "3.B"
  - front: Claim → what makes one defensible (7.A)
    back: |
      A statement someone could reasonably dispute and that the text can prove. "Mathilde loses a necklace" is a fact; "Mathilde's pride, not bad luck, ruins her" is a claim.
    topic_code: "7.A"
  - front: Evidence → what counts
    back: |
      A short quotation or a precise reference to an event or detail that directly supports the claim. Evidence that only sets the scene, or that supports a different claim, does not count.
    topic_code: "7.A"
  - front: Embedding a quotation
    back: |
      Fold a short quotation into your own sentence ("Mathilde 'suffered ceaselessly, feeling herself born to enjoy all delicacies'") instead of dropping it in alone. It keeps the paragraph moving and shows you chose it.
    topic_code: "7.A"
  - front: Commentary vs summary
    back: |
      Summary says what happens. Commentary says what the evidence shows and how it supports the claim. A paragraph that is mostly summary earns little on the AP rubric, however accurate.
    topic_code: "7.A"
  - front: The "so what?" test for a paragraph
    back: |
      After each piece of evidence, ask "so what?" The answer, connecting the evidence back to the claim, is your commentary.
    topic_code: "7.A"
  - front: "\"The Necklace\" → publication and translation"
    back: |
      "La Parure," by Guy de Maupassant (1850-1893), first published in the Paris newspaper Le Gaulois in 1884. This course quotes an early twentieth-century English translation titled "The Diamond Necklace."
    topic_code: "3.B"
  - front: "\"as if by a slip of fate\" → the first sentence"
    back: |
      Mathilde was born "as if by a slip of fate, into a family of clerks." The phrase presents her own view of herself, that destiny made a mistake, and introduces fate and chance, the story's real subject.
    topic_code: "3.B"
  - front: Monsieur Loisel's job
    back: |
      A "little clerk of the Ministry of Public Instruction." "Little" sets the couple's social position and Mathilde's view of her marriage in one word.
    topic_code: "7.A"
  - front: "\"Mathilde suffered ceaselessly\""
    back: |
      She feels "born to enjoy all delicacies and all luxuries," and her plain home tortures her. The narrator adds that another woman of her rank "would never even have been conscious" of these things: her misery is in her comparisons.
    topic_code: "7.A"
  - front: The Breton servant
    back: |
      The sight of "the little Breton peasant who did her humble housework" stirs Mathilde's "despairing regrets and bewildering dreams." She has a servant, yet feels deprived; later she will do all the housework herself.
    topic_code: "3.B"
  - front: The soup tureen
    back: |
      Her husband lifts the lid and declares with delight that he knows nothing better than good soup, while she dreams of fine silver and tapestries. One detail sets their contrasting desires side by side.
    topic_code: "7.A"
  - front: The invitation
    back: |
      Loisel brings home an invitation to a ball at the Ministry, expecting to delight his wife. She weeps: she has nothing to wear. The event that should satisfy her desire exposes it.
    topic_code: "3.B"
  - front: The four hundred francs
    back: |
      Loisel gives Mathilde the four hundred francs he had saved for a gun and a summer's shooting with friends. His quiet sacrifice is the first in the chain of costs the ball imposes.
    topic_code: "3.B"
  - front: Madame Forestier
    back: |
      Mathilde's wealthier former schoolfriend, whom she has avoided visiting because of the envy it stirs. She lends the necklace without hesitation, and appears again only in the final scene.
    topic_code: "3.B"
  - front: The ball
    back: |
      Mathilde is a triumph: admired, sought after, noticed by the Minister. It is the only night on which her life matches her dreams.
    topic_code: "3.B"
  - front: Leaving the ball → the old wraps
    back: |
      Ashamed of her modest everyday wraps beside the other women's furs, Mathilde hurries out to avoid being seen. Her shame about appearances shapes the very moment the necklace disappears.
    topic_code: "3.B"
  - front: The decision to replace the necklace
    back: |
      Instead of telling Madame Forestier, the Loisels buy a near-identical diamond necklace for thirty-six thousand francs, most of it borrowed. The choice to conceal the loss is what costs them ten years.
    topic_code: "3.B"
  - front: The ten years
    back: |
      They dismiss the servant, move to an attic, and Mathilde does all the heavy housework while Loisel takes extra copying work. She grows hard, coarse and old-looking. Summarised in a few paragraphs.
    topic_code: "3.B"
  - front: The final revelation
    back: |
      Meeting Madame Forestier on the Champs-Élysées, Mathilde tells the whole story, and learns that the original necklace was imitation, worth at most five hundred francs. The story ends on that line.
    topic_code: "3.B"
  - front: Why the story ends on the revelation
    back: |
      No scene follows: we never see Mathilde's response or whether the money is returned. Ending on the fact forces the reader to reckon with what the ten years meant.
    topic_code: "3.B"
  - front: Situational irony in "The Necklace"
    back: |
      Mathilde sacrifices a decade to replace jewels that were never valuable, and the hard work that ages her is the honest life she despised. What she wanted (to seem rich) destroyed what she had.
    topic_code: "7.A"
  - front: "Maupassant's narrator vs O. Henry's"
    back: |
      Both are third-person narrators who generalise, but Maupassant's is cooler and more judging ("with women there is neither caste nor rank"), while O. Henry's jokes affectionately with the reader.
    topic_code: "4.A"
  - front: Three gift-and-loss stories in Unit 1
    back: |
      Della and Jim give up treasures for gifts that become useless; the boy in "Araby" never buys his gift; Mathilde's borrowed ornament costs ten years. Each plot measures desire by what it costs.
    topic_code: "3.B"

quiz:
  description: |
    22 questions · about 40 minutes · about 60% this week (the sequence of events in "The Necklace" and the
    claim-and-evidence paragraph) and 40% spiral review of weeks 1 and 2: character, narrator, point of view, setting
    and plot order. Multiple choice, select-all and true/false items are graded at once; the fill-in-the-blank items
    are matched automatically; the two short answers and the essay are graded by your teacher against the model
    answer and rubric.
  questions:
    # ---- Passage set: the opening of the story
    - slug: u01-w03-q01
      type: multiple_choice
      topic_code: "4.A"
      source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
      points: 1
      stimulus: &necklace_open |
        *The following passage is the opening of Guy de Maupassant's "The Necklace" (1884), in an early English translation published as "The Diamond Necklace."*

        The girl was one of those pretty and charming young creatures who sometimes are born, as if by a slip of fate, into a family of clerks. She had no dowry, no expectations, no way of being known, understood, loved, married by any rich and distinguished man; so she let herself be married to a little clerk of the Ministry of Public Instruction.

        She dressed plainly because she could not dress well, but she was unhappy as if she had really fallen from a higher station; since with women there is neither caste nor rank, for beauty, grace and charm take the place of family and birth. Natural ingenuity, instinct for what is elegant, a supple mind are their sole hierarchy, and often make of women of the people the equals of the very greatest ladies.

        Mathilde suffered ceaselessly, feeling herself born to enjoy all delicacies and all luxuries. She was distressed at the poverty of her dwelling, at the bareness of the walls, at the shabby chairs, the ugliness of the curtains. All those things, of which another woman of her rank would never even have been conscious, tortured her and made her angry. The sight of the little Breton peasant who did her humble housework aroused in her despairing regrets and bewildering dreams.
      prompt: |
        In the second paragraph, the narrator's statement that "with women there is neither caste nor rank, for beauty, grace and charm take the place of family and birth" primarily serves to
      options:
        - |
          report Mathilde's own thoughts in her own words
        - |
          offer a general claim that explains why Mathilde feels she has "fallen from a higher station"
        - |
          prove that Mathilde is in fact of noble birth
        - |
          shift the point of view to that of Mathilde's husband
      option_explanations:
        - |
          The sentence is a generalisation about "women" in the present tense, the narrator's voice rather than Mathilde's; she is not yet even named.
        - |
          Correct. The narrator steps back to state a general principle: for women, charm can substitute for birth. That principle explains her sense of displacement: she has the qualities of a great lady and the life of a clerk's wife.
        - |
          The first paragraph says she was born "into a family of clerks." The generalisation explains why she feels highborn; it does not make her so.
        - |
          The husband has no point of view in the passage; he is mentioned only as "a little clerk."
      answer: 1
      explanation: |
        Spiral review of 4.A. Like O. Henry's narrator, Maupassant's generalises; unlike him, this narrator's tone is cool and analytical, not joking.

    - slug: u01-w03-q02
      type: multiple_choice
      topic_code: "1.A"
      source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
      points: 1
      stimulus: *necklace_open
      prompt: |
        The detail that Mathilde "was unhappy as if she had really fallen from a higher station" most clearly reveals that she
      options:
        - |
          was once wealthy and has lost her fortune
        - |
          experiences her ordinary life as a loss of something she believes she was owed
        - |
          is unhappy mainly because her husband treats her badly
        - |
          is content with her station but worried about the future
      option_explanations:
        - |
          "As if" marks a comparison: she was never in a higher station, she only feels as though she had been.
        - |
          Correct. She grieves for a life she never had. The phrase captures her sense of entitlement: her modest life feels like a fall because she thinks she was meant for better.
        - |
          The passage says nothing against her husband; her misery is about her surroundings and status.
        - |
          The word "unhappy" and the later "suffered ceaselessly" rule out contentment.
      answer: 1
      explanation: |
        Spiral review of 1.A. Small words like "as if" can carry a whole perspective: here, the gap between Mathilde's real position and her imagined one.

    - slug: u01-w03-q03
      type: multiple_choice
      topic_code: "3.B"
      source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
      points: 1
      stimulus: *necklace_open
      prompt: |
        The story begins with a portrait of Mathilde's dissatisfaction before any event takes place. The function of placing this portrait first is to
      options:
        - |
          establish the desire that motivates every later choice, from her tears over the invitation to the decision to replace the necklace
        - |
          suggest that nothing in the story will change
        - |
          provide a flashback explaining events the reader has already seen
        - |
          introduce Madame Forestier as the story's main character
      option_explanations:
        - |
          Correct. Exposition that shows a hunger for luxury and status prepares every link in the causal chain: she weeps for lack of a dress, insists on jewels, borrows diamonds, and cannot bear to admit the loss.
        - |
          The story changes Mathilde drastically; the opening portrait is what the ending will be measured against.
        - |
          The story is told in order; this is the opening, not a flashback.
        - |
          Madame Forestier does not appear in the opening; Mathilde is the subject from the first sentence.
      answer: 0
      explanation: |
        Skill 3.B: explain why an event or section comes where it does. Opening with motive rather than action makes the plot a test of that motive.

    - slug: u01-w03-q04
      type: multiple_choice
      topic_code: "2.A"
      source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
      points: 1
      stimulus: *necklace_open
      prompt: |
        The details of Mathilde's home ("the bareness of the walls," "the shabby chairs," "the ugliness of the curtains") convey a setting that is
      options:
        - |
          desperately poor, lacking food and heat
        - |
          modest but respectable, made painful by Mathilde's way of seeing it
        - |
          luxurious, though Mathilde fails to notice it
        - |
          dangerous and unhealthy
      option_explanations:
        - |
          The household keeps a servant, and the narrator says another woman of her rank would not even notice these things; this is not destitution.
        - |
          Correct. The furnishings are plain, but the narrator stresses that they torture Mathilde specifically. The setting is filtered through her dissatisfaction, which turns ordinary shabbiness into suffering.
        - |
          "Bareness," "shabby" and "ugliness" rule out luxury.
        - |
          Nothing suggests danger or disease; the complaints are aesthetic.
      answer: 1
      explanation: |
        Spiral review of 2.A. A setting described through a character's feelings tells you about both the place and the person.

    - slug: u01-w03-q05
      type: multiple_choice
      topic_code: "4.B"
      source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
      points: 1
      stimulus: *necklace_open
      prompt: |
        The clause "of which another woman of her rank would never even have been conscious" has which effect?
      options:
        - |
          It moves the narration outside Mathilde's feelings to judge them, creating ironic distance between the reader and her suffering.
        - |
          It reveals that the narrator is a woman of Mathilde's rank.
        - |
          It shows that Mathilde is unaware of her surroundings.
        - |
          It suggests that Mathilde's complaints are entirely justified.
      option_explanations:
        - |
          Correct. The narration has been close to her distress; this clause steps back and measures it against what a typical woman of her class would feel. The reader is invited to see her misery as excessive, which sets up the story's irony.
        - |
          The narrator generalises about "another woman"; nothing makes the narrator a character, let alone one of Mathilde's rank.
        - |
          The reverse: Mathilde notices every flaw, while other women would not.
        - |
          Saying other women would not even notice these things suggests her suffering is out of proportion, not justified.
      answer: 0
      explanation: |
        Spiral review of 4.B. A third-person narrator can move between sympathy and judgment in a single clause; questions on point of view often hinge on such moves.

    - slug: u01-w03-q06
      type: multi_select
      topic_code: "1.A"
      source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
      points: 2
      partial_credit: true
      stimulus: *necklace_open
      prompt: |
        Which TWO details from the passage best support the claim that Mathilde's unhappiness comes from comparison and imagination rather than from real hardship? Select two.
      options:
        - |
          "of which another woman of her rank would never even have been conscious"
        - |
          "The sight of the little Breton peasant who did her humble housework aroused in her despairing regrets and bewildering dreams."
        - |
          "She had no dowry, no expectations"
        - |
          "so she let herself be married to a little clerk of the Ministry of Public Instruction"
      option_explanations:
        - |
          Correct. Other women in her position would not notice her surroundings; the suffering lies in her perception.
        - |
          Correct. Having a servant at all shows she is not destitute, yet the servant triggers "dreams," that is, imagined comparison with a grander life.
        - |
          This detail explains her circumstances (why she married a clerk) rather than showing that her misery is imagined.
        - |
          This states her marriage and status; it supports a claim about her situation, not about the source of her unhappiness.
      answer: [0, 1]
      explanation: |
        Choosing evidence (7.A) means picking the details that prove THIS claim, not just any details about the character.

    - slug: u01-w03-q07
      type: true_false
      topic_code: "3.B"
      source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
      points: 1
      stimulus: *necklace_open
      prompt: |
        True or false: like many stories, "The Necklace" opens in the middle of the action, at the ball, and then fills in Mathilde's background.
      answer: false
      explanation: |
        False. The story opens with exposition (her birth, her marriage, her dissatisfaction) and moves forward in chronological order: invitation, preparations, ball, loss, replacement, ten years, final meeting.

    - slug: u01-w03-q08
      type: multiple_choice
      topic_code: "7.A"
      source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
      points: 1
      stimulus: *necklace_open
      prompt: |
        Which of the following is the best claim for an analytical paragraph about this passage?
      options:
        - |
          Mathilde is married to a clerk at the Ministry of Public Instruction.
        - |
          The passage is the opening of "The Necklace."
        - |
          Maupassant presents Mathilde's misery as self-inflicted, rooted less in her circumstances than in her habit of measuring them against fantasy.
        - |
          Mathilde has a Breton servant and shabby chairs.
      option_explanations:
        - |
          This is a fact stated in the text; no one could dispute it, so it cannot anchor an argument.
        - |
          This is a statement about the passage, not an interpretation of it.
        - |
          Correct. The claim is arguable (one might say she is a victim of a rigid class system) and can be defended with evidence such as "would never even have been conscious" and "bewildering dreams."
        - |
          These are details that might serve as evidence; on their own they make no claim.
      answer: 2
      explanation: |
        Skill 7.A: a claim must require defence. If a sentence can be checked by pointing to one line, it is evidence, not a claim.

    # ---- The whole story: sequence, argument, and review
    - slug: u01-w03-q09
      type: multiple_choice
      topic_code: "3.B"
      source: 'Guy de Maupassant, "The Necklace" (1884)'
      points: 1
      prompt: |
        Mathilde discovers that the necklace is gone within hours of her triumph at the ball. The function of placing the loss immediately after the triumph is to
      options:
        - |
          suggest that the ball was a dream that never really happened
        - |
          create a sharp reversal, so that the one night her life matches her dreams becomes the cause of her ruin
        - |
          give the Loisels time to recover before the next complication
        - |
          show that Madame Forestier planned the loss
      option_explanations:
        - |
          The ball is presented as real; its reality is what makes the loss so costly.
        - |
          Correct. Juxtaposing her greatest success with the disaster it causes is a classic reversal. The sequence makes the price of her desire immediate and ironic.
        - |
          There is no breathing space: the discovery follows at once, and the search begins that night.
        - |
          Madame Forestier lends the necklace freely and learns of the loss only at the end; nothing suggests a plan.
      answer: 1
      explanation: |
        When two events sit side by side, ask what their juxtaposition does. Reversal is among the most common answers for short fiction.

    - slug: u01-w03-q10
      type: multiple_choice
      topic_code: "3.B"
      source: 'Guy de Maupassant, "The Necklace" (1884)'
      points: 1
      prompt: |
        The reader learns that the borrowed necklace was imitation only in the story's final lines. Which best explains the function of this placement?
      options:
        - |
          It lets the reader, like Mathilde, believe the ten years of labour were necessary, and then recasts the entire sacrifice as needless in a single stroke.
        - |
          It corrects an error the narrator made earlier in the story.
        - |
          It sets up a sequel in which Mathilde recovers her money.
        - |
          It shows that Mathilde knew all along the necklace was false.
      option_explanations:
        - |
          Correct. Withholding the fact keeps the reader inside the Loisels' belief through the decade of hardship. Revealed at the end, it transforms the meaning of everything before it.
        - |
          The narrator never claims the necklace was real; the Loisels assumed it, and the narration follows their assumption.
        - |
          The story ends on the revelation; nothing points beyond it.
        - |
          Her shock and the years of debt show she believed the diamonds real.
      answer: 0
      explanation: |
        Skill 3.B: explain what a sequence does to the reader's understanding. A twist placed last forces a rereading of the whole plot.

    - slug: u01-w03-q11
      type: multiple_choice
      topic_code: "3.A"
      source: 'Guy de Maupassant, "The Necklace" (1884)'
      points: 1
      prompt: |
        The evening of the ball and the night of the search are told in detail, while the ten years of hardship are covered in a few paragraphs. This difference in pacing chiefly
      options:
        - |
          shows that the narrator considers the ten years unimportant
        - |
          makes one night outweigh a decade, stressing how a few hours of display determined the rest of Mathilde's life
        - |
          indicates that the ten years are a flashback
        - |
          reflects the fact that Mathilde does not remember those years
      option_explanations:
        - |
          The years are summarised, not dismissed; their harsh details (the attic, the housework, her coarsened hands) are vivid even in brief.
        - |
          Correct. Summary compresses the decade into a swift, grinding sequence, while scene stretches out the ball and the loss. The imbalance itself makes the point about how much one night cost.
        - |
          The ten years follow the loss in chronological order; they are not a flashback.
        - |
          Nothing in the story suggests memory loss; the summary is the narrator's choice.
      answer: 1
      explanation: |
        Spiral review of 3.A (how plot orders events). Pacing is part of order: where a story slows down tells you what it values.

    - slug: u01-w03-q12
      type: multiple_choice
      topic_code: "7.A"
      source: 'Guy de Maupassant, "The Necklace" (1884)'
      points: 1
      prompt: |
        A student claims: "Mathilde's pride, more than bad luck, causes her ruin." Which evidence from the story most directly supports this claim?
      options:
        - |
          The ball takes place at the Ministry.
        - |
          Rather than tell Madame Forestier the necklace is lost, the Loisels secretly buy a replacement with borrowed money.
        - |
          Madame Forestier is still young and beautiful at the end.
        - |
          The necklace is lost on the way home from the ball.
      option_explanations:
        - |
          The location of the ball is a fact of setting; it does not bear on Mathilde's pride or its role in her ruin.
        - |
          Correct. The decision to conceal the loss rather than admit it is a choice driven by shame and pride, and it is the choice that costs ten years. That makes it the strongest proof that her ruin was not mere chance.
        - |
          This contrast is powerful at the end but supports a claim about the cost of the ten years, not about pride as the cause.
        - |
          The loss itself could be bad luck; it supports the other side of the claim.
      answer: 1
      explanation: |
        Skill 7.A: the best evidence proves the specific claim, especially the part of it that is arguable ("more than bad luck").

    - slug: u01-w03-q13
      type: multiple_choice
      topic_code: "7.A"
      source: 'Guy de Maupassant, "The Necklace" (1884)'
      points: 1
      prompt: |
        A student writes: "Claim: Mathilde values appearances over truth. Evidence: When she leaves the ball, she rushes away so that the other women, in their furs, will not see her modest wraps." Which sentence of commentary best completes the paragraph?
      options:
        - |
          Then she and her husband go home in a cab.
        - |
          This shows that she leaves the ball.
        - |
          Even at the height of her success she fears being seen as what she is, and that same fear of exposure will lead her to hide the loss instead of confessing it.
        - |
          Furs were expensive in nineteenth-century Paris.
      option_explanations:
        - |
          This continues the plot (summary) instead of explaining the evidence.
        - |
          This restates the evidence without interpreting it, the commonest weakness of commentary.
        - |
          Correct. It explains what the action reveals (fear of being seen as she is) and links it to the claim and to a later choice, building a line of reasoning.
        - |
          A historical fact may be true but does not connect the evidence to the claim about Mathilde.
      answer: 2
      explanation: |
        Commentary answers "so what?": it says what the evidence reveals and how it advances the claim.

    - slug: u01-w03-q14
      type: multi_select
      topic_code: "3.B"
      source: 'Guy de Maupassant, "The Necklace" (1884)'
      points: 3
      partial_credit: true
      prompt: |
        Which of the following correctly describe a cause-and-effect link in the plot of "The Necklace"? Select all that apply.
      options:
        - |
          Because Mathilde has nothing to wear to the ball, her husband gives her the money he had saved for a gun.
        - |
          Because she has a new dress but no jewels, she borrows a necklace from Madame Forestier.
        - |
          Because the Loisels choose to replace the necklace rather than confess its loss, they spend ten years paying off their debts.
