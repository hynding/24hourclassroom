week: 1
unit: 1
title: Narrator and Character in "The Gift of the Magi"
topics: ["1.A", "4.A", "4.B"]
texts:
  - author: O. Henry
    title: The Gift of the Magi
    year: 1905
    url: https://www.gutenberg.org/ebooks/7256
guide: guides/week-01.md
guide_description: |
  The first week of the course: what close reading is, how the AP exam and its skills work, and how to build a
  claim-evidence-commentary paragraph. Then O. Henry's "The Gift of the Magi" as a case study in telling the
  narrator apart from the author and the characters, in what a narrator's comments do to a reader, and in reading
  a character through small concrete details. Four worked close readings, a model paragraph, misreadings, self-check.
flashcards_description: |
  30 cards on the AP exam's shape, close-reading vocabulary, narrators and point of view, and the people, details
  and lines of "The Gift of the Magi".

flashcards:
  - front: AP Literature exam → the two sections
    back: |
      Section I: 55 multiple-choice questions on 5 passages (prose and poetry), 1 hour, 45% of the score. Section II: 3 essays in 2 hours, 55%: Q1 poetry analysis, Q2 prose fiction analysis, Q3 literary argument.
    topic_code: "4.A"
  - front: AP essay rubric → the three rows
    back: |
      Row A thesis (0-1), Row B evidence and commentary (0-4), Row C sophistication (0-1), for 6 points per essay. Row B carries most of the score, so explaining evidence matters more than finding it.
    topic_code: "1.A"
  - front: Close reading → what it means in this course
    back: |
      Slow, repeated reading of a short passage that asks of every noticeable choice (a word, a detail, a sentence shape) what it shows and why it is there. Observation first, interpretation second, function third.
    hint: Notice, interpret, explain the function.
    topic_code: "1.A"
  - front: Claim, evidence, commentary → the paragraph pattern
    back: |
      Claim: an arguable statement about the text. Evidence: a short quotation or precise reference. Commentary: your explanation of how the evidence proves the claim. Commentary should be at least as long as the evidence.
    topic_code: "1.A"
  - front: Narrator vs author
    back: |
      The author (William Sydney Porter, writing as O. Henry) wrote the story; the narrator is the voice inside the text that tells it. A narrator is a constructed character of sorts, and its opinions are evidence, not the author's confession.
    topic_code: "4.A"
  - front: Narrator vs speaker
    back: |
      By convention "narrator" is used for prose fiction and "speaker" for poetry. Both name the voice of the text, never the writer.
    topic_code: "4.A"
  - front: First-person narration → what it gives and what it costs
    back: |
      A narrator who says "I" and takes part in the events. It gives intimacy and a personal voice; it costs access to anyone else's mind, and it raises the question of whether the narrator can be trusted.
    topic_code: "4.B"
  - front: Third-person omniscient narration
    back: |
      A narrator outside the story who can report any character's thoughts and any event. The narrator's choices about what to reveal, and when, become a source of suspense and irony.
    topic_code: "4.B"
  - front: Third-person limited narration
    back: |
      A narrator outside the story who stays close to one character's perceptions and thoughts. The reader learns what that character learns, when that character learns it.
    topic_code: "4.B"
  - front: Intrusive (editorial) narrator
    back: |
      A narrator who steps out of the action to comment, generalise, joke or address the reader directly. O. Henry's narrator is a textbook case: "take a look at the home."
    topic_code: "4.A"
  - front: Point of view → the AP question to ask
    back: |
      Not just "which person is it?" but "what does this way of telling let the reader see, and what does it hide?" Skill 4.B asks for the function, not the label.
    topic_code: "4.B"
  - front: Direct vs indirect characterization
    back: |
      Direct: the narrator tells us what a character is like. Indirect: we infer it from what the character does, says, owns, wants or how others react. AP questions mostly test indirect characterization.
    topic_code: "1.A"
  - front: Motive → how to read one from a detail
    back: |
      Ask what the character wants at that moment and what the detail shows them willing to give up for it. Della's whole motive is visible in what she sells and what she buys.
    topic_code: "1.A"
  - front: Tone vs mood
    back: |
      Tone is the narrator's or speaker's attitude toward the subject (wry, affectionate, mocking). Mood is the feeling the text creates in a reader. Tone is a property of the voice; mood is a property of the experience.
    topic_code: "4.A"
  - front: Situational irony
    back: |
      An outcome that reverses what characters or readers expected. In "The Gift of the Magi" each gift is made useless by the sacrifice that bought the other.
    topic_code: "4.B"
  - front: Dramatic irony
    back: |
      When the reader knows something a character does not. O. Henry mostly avoids it here: the narrator keeps the reader as ignorant as Della, so the irony lands as surprise.
    topic_code: "4.B"
  - front: "\"The Gift of the Magi\" → publication"
    back: |
      O. Henry (William Sydney Porter, 1862-1910). First published in a New York newspaper in December 1905; collected in The Four Million (1906), his book of New York stories.
    topic_code: "4.A"
  - front: "\"One dollar and eighty-seven cents\" → why open with a number?"
    back: |
      The exact sum makes the problem concrete and slightly absurd at once; repeated, it becomes a refrain that measures Della's helplessness. Later sums ($8 rent, $20 for the hair, $21 for the chain) keep the story counting.
    topic_code: "1.A"
  - front: "\"bulldozing the grocer\" → what it reveals about Della"
    back: |
      She has bargained so hard for pennies that her "cheeks burned" with embarrassment. The detail shows determination and thrift bought at the price of pride, a preview of the larger trade she will make.
    topic_code: "1.A"
  - front: "\"sobs, sniffles, and smiles, with sniffles predominating\" → function"
    back: |
      The narrator turns Della's private distress into a joking general truth. The line sets a wry, sympathetic distance: we are invited to smile at her trouble without being asked to mock it.
    topic_code: "4.B"
  - front: "\"Mr. James Dillingham Young\" → the shrinking name"
    back: |
      The grand middle name dates from a time when Jim earned $30 a week; at $20 the couple think of "contracting" it to "a modest and unassuming D." The name is a comic gauge of their fallen income.
    topic_code: "1.A"
  - front: The Youngs' two treasures
    back: |
      Jim's gold watch, inherited from his father and grandfather, and Della's hair. The narrator measures them against the Queen of Sheba's jewels and King Solomon's treasure, comic hyperbole that also tells us what each prizes.
    topic_code: "1.A"
  - front: Madame Sofronie
    back: |
      The hair-goods dealer who buys Della's hair for twenty dollars. The quick, unsentimental transaction contrasts with what the hair means to Della and Jim.
    topic_code: "1.A"
  - front: Della's gift and Jim's gift
    back: |
      Della buys a platinum fob chain for Jim's watch with the money from her hair. Jim buys a set of tortoise-shell combs for Della's hair with the money from his watch. Each gift fits the treasure the other has sold.
    topic_code: "1.A"
  - front: "\"Please God, make him think I am still pretty.\" → what it reveals"
    back: |
      Della's one fear is losing Jim's love with her hair. The whispered prayer shows how she measures her value in his eyes, and makes his calm response more moving.
    topic_code: "1.A"
  - front: "Jim \"as immovable as a setter at the scent of quail\" → function"
    back: |
      The comic hunting simile freezes Jim in place. The narrator then lists what the look is NOT (anger, surprise, disapproval, horror), keeping the reader as puzzled as Della until Jim explains.
    topic_code: "1.A"
  - front: "\"For ten seconds let us regard with discreet scrutiny some inconsequential object in the other direction.\""
    back: |
      The narrator turns the reader's eyes away from the couple's embrace, a joke about privacy that also delays the explanation and promises a "dark assertion" to be "illuminated later on." Narration as stage management.
    topic_code: "4.B"
  - front: "\"two foolish children\" ... \"They are the magi.\" → the ending's move"
    back: |
      The narrator first calls the couple foolish, then reverses the verdict: of all who give gifts, they are the wisest. The paradox converts a sad joke into a moral about love measured by sacrifice.
    topic_code: "4.A"
  - front: Why the reader learns about the watch only at the end
    back: |
      The narration follows Della, not Jim. Because we know her secret and not his, the final revelation produces the double irony the plot depends on.
    topic_code: "4.B"
  - front: "Magi → the allusion in the title"
    back: |
      The wise men of the Gospel of Matthew who brought gifts to the infant Jesus. The narrator says they "invented the art of giving Christmas presents," then names Della and Jim their modern equivalents.
    topic_code: "4.A"

quiz:
  description: |
    22 questions · about 35 minutes · all on this week's work: a set of eight questions on the opening of "The Gift
    of the Magi", then questions on the narrator, the characters and the whole story. Multiple choice, select-all
    and true/false items are graded at once; the fill-in-the-blank items are matched automatically; the two short
    answers and the analytical paragraph are graded by your teacher against the model answer and scoring notes.
  questions:
    # ---- Passage set: the opening of the story
    - slug: u01-w01-q01
      type: multiple_choice
      topic_code: "4.A"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      stimulus: &magi_open |
        *The following passage is the opening of O. Henry's "The Gift of the Magi" (1905).*

        One dollar and eighty-seven cents. That was all. And sixty cents of it was in pennies. Pennies saved one and two at a time by bulldozing the grocer and the vegetable man and the butcher until one's cheeks burned with the silent imputation of parsimony that such close dealing implied. Three times Della counted it. One dollar and eighty-seven cents. And the next day would be Christmas.

        There was clearly nothing to do but flop down on the shabby little couch and howl. So Della did it. Which instigates the moral reflection that life is made up of sobs, sniffles, and smiles, with sniffles predominating.

        While the mistress of the home is gradually subsiding from the first stage to the second, take a look at the home. A furnished flat at $8 per week. It did not exactly beggar description, but it certainly had that word on the lookout for the mendicancy squad.

        [...]

        The "Dillingham" had been flung to the breeze during a former period of prosperity when its possessor was being paid $30 per week. Now, when the income was shrunk to $20, though, they were thinking seriously of contracting to a modest and unassuming D. But whenever Mr. James Dillingham Young came home and reached his flat above he was called "Jim" and greatly hugged by Mrs. James Dillingham Young, already introduced to you as Della. Which is all very good.
      prompt: |
        The narrator of the passage is best described as
      options:
        - |
          Della herself, recalling a hard Christmas from later in life
        - |
          a third-person narrator outside the story who comments on the action and speaks directly to the reader
        - |
          a neighbour in the building who has watched the Youngs through the airshaft
        - |
          a third-person narrator who reports only what can be seen, without opinions or asides
      option_explanations:
        - |
          Della is referred to as "Della" and "the mistress of the home," never as "I," and the narrator introduces her to "you." She is the focus of the telling, not its teller.
        - |
          Correct. The narrator stands outside the events, yet keeps stepping forward: "take a look at the home," "Which instigates the moral reflection," "already introduced to you." That is an intrusive third-person narrator.
        - |
          Nothing places the narrator in the building or among the characters. A neighbour would need to be present in the scene; this voice simply knows and tells.
        - |
          An objective, camera-like narrator would not offer a "moral reflection" or jokes about "the mendicancy squad." This narrator is full of opinions.
      answer: 1
      explanation: |
        Identify a narrator by evidence: pronouns (who is "I," who is "you"), whether the voice takes part in events, and how much it comments. Here every test points to an outside narrator with a strong personality.

    - slug: u01-w01-q02
      type: multiple_choice
      topic_code: "4.B"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      stimulus: *magi_open
      prompt: |
        In context, the sentence "Which instigates the moral reflection that life is made up of sobs, sniffles, and smiles, with sniffles predominating" primarily serves to
      options:
        - |
          mock Della for crying over a trivial problem
        - |
          turn Della's private distress into a wry general observation, establishing a tone that is amused but sympathetic
        - |
          foreshadow that Della will fall seriously ill before Christmas
        - |
          show that Della herself has a philosophical turn of mind
      option_explanations:
        - |
          The joke is gentle and is aimed at life in general ("life is made up of"), not at Della. The narrator never treats her problem as trivial; the whole story takes her poverty seriously.
        - |
          Correct. The narrator steps back from the scene to generalise, and the alliteration and comic "sniffles predominating" lighten the moment. We are invited to smile at her trouble without despising her.
        - |
          "Sniffles" is part of the joke's triad (sobs, sniffles, smiles), not a medical detail. Nothing in the story concerns illness.
        - |
          The reflection belongs to the narrator, who announces it; Della is busy howling on the couch. Confusing narrator and character is the misreading this item tests.
      answer: 1
      explanation: |
        When a narrator generalises ("life is..."), ask what the generalisation does to our view of the character in front of us. Here it sets the story's characteristic blend of comedy and tenderness.

    - slug: u01-w01-q03
      type: multiple_choice
      topic_code: "1.A"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      stimulus: *magi_open
      prompt: |
        The detail that the pennies were saved "by bulldozing the grocer and the vegetable man and the butcher until one's cheeks burned" most clearly suggests that Della
      options:
        - |
          enjoys haggling and is proud of her skill as a shopper
        - |
          has been dishonest with the shopkeepers to save money
        - |
          has been willing to endure embarrassment, again and again, to save small sums for Jim's present
        - |
          resents Jim for earning too little to support the household
      option_explanations:
        - |
          Burning cheeks signal shame, not pleasure, and the "silent imputation of parsimony" is something she feels judged by. She bargains because she must, not because she likes it.
        - |
          "Bulldozing" means pressing hard in bargaining; nothing suggests cheating. The shame comes from looking stingy ("parsimony"), not from wrongdoing.
        - |
          Correct. The repeated small sacrifice of pride ("one and two at a time") shows determination and a willingness to pay a personal cost, which prepares for the far larger sacrifice of her hair.
        - |
          The passage never expresses resentment of Jim; the closing paragraph shows her greeting him with hugs. Her effort is for him, not against him.
      answer: 2
      explanation: |
        Skill 1.A: read the detail for what it shows the character willing to do and willing to feel. Small acts that cost a character something are the best evidence of motive.

    - slug: u01-w01-q04
      type: multiple_choice
      topic_code: "4.B"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      stimulus: *magi_open
      prompt: |
        The narrator's instruction "take a look at the home" has which effect on the reader?
      options:
        - |
          It invites the reader into the scene as a companion on a guided tour, creating an intimate, conversational relationship with the narrator.
        - |
          It reveals that the reader is meant to imagine being Jim, coming home from work.
        - |
          It signals a shift from Della's point of view to that of the landlord.
        - |
          It creates suspense by suggesting that something is hidden in the flat.
      option_explanations:
        - |
          Correct. The imperative treats the reader as a visitor whom the narrator is showing around while Della recovers. The tone is chatty and confiding, the voice of a storyteller among friends.
        - |
          Jim has not yet arrived and the reader is addressed as an outsider ("already introduced to you as Della"), not as a character.
        - |
          No landlord appears, and the description that follows is the narrator's own witty commentary ("beggar description"), not anyone else's view.
        - |
          What follows is a list of shabby details, not a mystery. The tour stresses poverty, not concealment.
      answer: 0
      explanation: |
        Direct address ("you," imperatives) is one of the clearest markers of an intrusive narrator. Its function here is to create a companionable relationship that makes us trust the narrator's later verdict on the couple.

    - slug: u01-w01-q05
      type: multiple_choice
      topic_code: "1.A"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      stimulus: *magi_open
      prompt: |
        The account of the name "Dillingham" in the final paragraph chiefly serves to
      options:
        - |
          suggest that Jim is vain about his family background
        - |
          indicate that the Youngs plan to change their name to escape debt
        - |
          represent the couple's fall in income through the comic image of a name that might shrink to an initial
        - |
          show that Della has married beneath her social class
      option_explanations:
        - |
          The name was "flung to the breeze" in prosperity, and the couple are now thinking of shrinking it; nothing shows Jim boasting of it. The joke is about money, not vanity.
        - |
          "Contracting to a modest and unassuming D" is a joke about matching the name to the income, not a real plan or an escape from creditors.
        - |
          Correct. The name grew with a $30 salary and threatens to dwindle with a $20 one. The narrator makes the household's decline concrete and funny at once, and then undercuts it: at home Jim is simply "Jim" and "greatly hugged."
        - |
          The passage says nothing about Della's background, and the "former period of prosperity" was Jim's and the couple's own.
      answer: 2
      explanation: |
        Small, odd details in a narrator's account usually carry a larger idea. Here a typographical joke stands for economic decline, and the hug that follows shows that their affection has not shrunk with the name.

    - slug: u01-w01-q06
      type: multi_select
      topic_code: "4.A"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 2
      partial_credit: true
      stimulus: *magi_open
      prompt: |
        Which TWO features of the passage most clearly show the narrator's presence as a distinct voice? Select two.
      options:
        - |
          Direct address to the reader, as in "already introduced to you as Della"
        - |
          Elaborate, mock-formal diction for humble things, as in "silent imputation of parsimony" and "the mendicancy squad"
        - |
          Della's first-person account of counting the money
        - |
          Dialogue in which Jim explains his own feelings
      option_explanations:
        - |
          Correct. The narrator talks to "you" and remarks on the act of introducing a character, which makes the telling itself visible.
        - |
          Correct. Grand Latinate words applied to pennies and a cheap flat are the narrator's signature joke; the style belongs to the teller, not to Della.
        - |
          Della never says "I" in the passage; her counting is reported in third person ("Three times Della counted it").
        - |
          The passage contains no dialogue at all, and Jim does not speak until much later in the story.
      answer: [0, 1]
      explanation: |
        A narrator's voice shows in two main ways: how it addresses the reader and how it chooses words. Both are on display in the opening.

    - slug: u01-w01-q07
      type: true_false
      topic_code: "4.A"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      stimulus: *magi_open
      prompt: |
        True or false: the narrator of this passage is one of the characters in the story.
      answer: false
      explanation: |
        False. The narrator refers to Della and Jim in the third person, takes no part in events and talks to the reader from outside the action. Later in the story the narrator does say "I" ("here I have lamely related to you"), but only as the storyteller, never as a participant.

    - slug: u01-w01-q08
      type: multiple_choice
      topic_code: "4.A"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      stimulus: *magi_open
      prompt: |
        The final sentence of the passage, "Which is all very good," conveys the narrator's
      options:
        - |
          sarcastic contempt for the couple's sentimental display
        - |
          weary indifference to the couple's problems
        - |
          warm approval of the couple's affection, which outweighs their shrinking income
        - |
          uncertainty about whether the marriage will survive its poverty
      option_explanations:
        - |
          The sentence follows an affectionate image (Jim "greatly hugged") and the story ends by calling the couple the wisest of givers; sarcasm would contradict the narrator's final verdict.
        - |
          A narrator who has just guided us around the flat and joked about its every detail is anything but indifferent.
        - |
          Correct. After the joke about the shrinking name, the narrator turns to what has not shrunk, their affection, and approves of it in a brief, homely phrase. The tone is warm under the humour.
        - |
          Nothing hints at a marriage in danger; the hugging is presented as a reliable daily event ("whenever").
      answer: 2
      explanation: |
        Tone questions ask for the narrator's attitude. Read the sentence in its context: what has just been described, and how the story finally judges it.

    # ---- The whole story: narrator, point of view and character
    - slug: u01-w01-q09
      type: multiple_choice
      topic_code: "4.B"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      prompt: |
        The reader learns that Jim has sold his watch only when Jim himself says so near the end of the story. This is chiefly because the narration
      options:
        - |
          is told by Jim, who wants to surprise the reader
        - |
          stays close to Della's experience, so the reader knows her secret but not his
        - |
          is objective and never reports any character's thoughts
        - |
          skips over Christmas Eve entirely and resumes on Christmas morning
      option_explanations:
        - |
          Jim is not the narrator; the story is told by an outside voice that refers to him in the third person.
        - |
          Correct. We follow Della to Madame Sofronie's and through the shops, and we hear her prayer. Because we share her knowledge and not Jim's, his revelation surprises us as it surprises her, which produces the story's double irony.
        - |
          The narrator does report Della's feelings and fears; the point is that it reports hers and not his.
        - |
          The action happens on Christmas Eve, the day before Christmas, and is narrated continuously.
      answer: 1
      explanation: |
        Skill 4.B asks what a point of view lets the reader see and what it hides. Here the restriction to Della's side is what makes the ending work.

    - slug: u01-w01-q10
      type: multiple_choice
      topic_code: "1.A"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      prompt: |
        Waiting for Jim with her hair cut short, Della whispers, "Please God, make him think I am still pretty." The prayer most clearly reveals that
      options:
        - |
          she regrets selling her hair and wishes she could undo it
        - |
          she fears that Jim's love depends on her looks, even though she chose the sacrifice freely
        - |
          she expects Jim to be angry about the money she spent
        - |
          she is more religious than Jim, which becomes a source of conflict
      option_explanations:
        - |
          She does not wish the sale undone; she worries only about how Jim will see her. Her resolve and her fear coexist.
        - |
          Correct. The whispered prayer exposes an anxiety she cannot say aloud: that her value to Jim lies in her beauty. It deepens our sense of what the gift cost her.
        - |
          The prayer is about appearance ("pretty"), not money. Her worry is about his feelings toward her, not about his budget.
        - |
          Religion plays no part in any conflict between them; the prayer is a private, spontaneous plea about how Jim will see her.
      answer: 1
      explanation: |
        A character's private words are prime evidence for skill 1.A: perspective and motive. Read what the words fear, not just what they ask for.

    - slug: u01-w01-q11
      type: multiple_choice
      topic_code: "4.A"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      prompt: |
        In the last paragraph the narrator calls Della and Jim "two foolish children in a flat who most unwisely sacrificed for each other the greatest treasures of their house," then declares that "of all who give gifts these two were the wisest." The narrator's attitude toward the couple is best described as
      options:
        - |
          scornful: their sacrifices were pointless and the narrator says so
        - |
          neutral: the narrator records the facts and leaves judgment to the reader
        - |
          affectionate and finally admiring: what looks foolish by practical measures is wisdom by the measure of love
        - |
          envious: the narrator wishes to have a marriage like theirs
      option_explanations:
        - |
          "Foolish" is a concession the narrator sets up only to overturn. The final verdict is "wisest," repeated three times.
        - |
          The narrator delivers an emphatic moral judgment ("They are the magi."); this is the opposite of neutrality.
        - |
          Correct. The paragraph moves from the practical view (they wasted their treasures) to a higher one (they gave the only gift that matters). The paradox carries the narrator's admiration.
        - |
          Nothing in the paragraph concerns the narrator's own life; the voice remains that of a storyteller judging the tale.
      answer: 2
      explanation: |
        When a narrator says two contradictory things, the later and more emphatic statement usually carries the attitude, and the contradiction itself is the point.

    - slug: u01-w01-q12
      type: multiple_choice
      topic_code: "1.A"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      prompt: |
        When Jim sees Della's hair, he stops "as immovable as a setter at the scent of quail," and the narrator explains that his expression "was not anger, nor surprise, nor disapproval, nor horror." The list of what Jim does NOT feel primarily serves to
      options:
        - |
          show that Jim is too dull to react to anything
        - |
          rule out the reactions Della feared and keep Jim's real feeling a puzzle until he explains it
        - |
          prove that the narrator cannot read Jim's mind at all
        - |
          suggest that Jim no longer loves Della
      option_explanations:
        - |
          Jim is struck motionless, the opposite of dull; the hunting simile describes intense attention.
        - |
          Correct. Each item in the list is one Della had prepared for, and each is denied. The reader, like Della, is left with a stare that "she could not read," which sustains suspense until Jim reveals the combs.
        - |
          The narrator clearly knows what Jim does not feel; the withholding is a choice that keeps the reader beside Della.
        - |
          Jim promptly embraces Della and tells her nothing could make him like her less. The stare is shock at the irony, not loss of love.
      answer: 1
      explanation: |
        Listing what a character is not feeling is a narrative tactic: it closes off obvious readings and points to a hidden one. Ask what the list prepares the reader for.

    - slug: u01-w01-q13
      type: multiple_choice
      topic_code: "4.A"
      source: general knowledge
      points: 1
      prompt: |
        Which statement about the narrator of a work of fiction is most accurate for AP analysis?
      options:
        - |
          The narrator is always the author speaking directly, so the narrator's opinions are the author's opinions.
        - |
          The narrator is a voice the author has created; its knowledge, attitudes and reliability are features of the text to be analysed.
        - |
          A narrator exists only in first-person stories; third-person stories have no narrator.
        - |
          The narrator matters only when the narrator is lying to the reader.
      option_explanations:
        - |
          Authors routinely create narrators whose views differ from their own. Writing "O. Henry thinks..." when you mean "the narrator says..." is a common essay error.
        - |
          Correct. Every story has a teller, and skill 4.A asks you to describe it: who it is, what it knows, how it sounds and how far to trust it.
        - |
          Third-person stories have narrators too, often very present ones, as "The Gift of the Magi" shows.
        - |
          Reliability is one feature of a narrator among many; voice, distance and knowledge matter in every story.
      answer: 1
      explanation: |
        The distinction between author and narrator is the first move of the course; use "the narrator" in your essays unless you are making a claim about the author's choices.

    - slug: u01-w01-q14
      type: multi_select
      topic_code: "4.B"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
