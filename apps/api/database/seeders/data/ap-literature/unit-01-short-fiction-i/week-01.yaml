    - slug: u01-w01-q19
      type: short_answer
      topic_code: "4.B"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 2
      prompt: |
        Write a defensible thesis statement (one or two sentences) about how the narrator's point of view in "The Gift of the Magi" shapes the reader's response to Della and Jim.
      answer: |
        By keeping the reader at Della's side and filling the telling with affectionate jokes, O. Henry's intrusive narrator lets us laugh at the couple's poverty while making us share Della's anxious love, so that the final verdict that they are "the wisest" feels earned rather than sentimental.
      explanation: |
        1 point: the thesis makes an arguable claim about the narration (not just "the story is told in third person"). 1 point: it links the narration to an effect on the reader's response to the characters, ideally suggesting a line of reasoning (for example, humour plus restriction to Della produces sympathy and surprise). A thesis that merely restates the prompt or summarises the plot earns 0.

    - slug: u01-w01-q20
      type: multiple_choice
      topic_code: "4.A"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      prompt: |
        In the final paragraph the narrator says, "here I have lamely related to you the uneventful chronicle of two foolish children." Which classification of the narrator does this sentence support?
      options:
        - |
          A first-person participant who has been one of the characters all along
        - |
          An outside narrator who refers to himself as the storyteller but takes no part in the events
        - |
          A narrator who is the same person as Della, now grown old
        - |
          An unreliable narrator whose account the reader should reject
      option_explanations:
        - |
          Using "I" does not make a narrator a character. This "I" is only the one who "related" the chronicle; it never appears in the flat or the shops.
        - |
          Correct. The narrator steps forward as a storyteller, with mock modesty ("lamely"), while remaining outside the action. That fits the intrusive third-person narrator seen throughout.
        - |
          Della is "one of the two foolish children" being described; she cannot also be the voice describing herself in the third person.
        - |
          "Lamely" is mock modesty, not a sign of untrustworthiness. The narrator's facts are never contradicted by the story.
      answer: 1
      explanation: |
        Pronouns alone do not settle point of view. Ask whether the "I" participates in events. Here it only narrates.

    - slug: u01-w01-q21
      type: multiple_choice
      topic_code: "4.B"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 1
      prompt: |
        The story ends not with a scene but with the narrator's explanation of the magi and a verdict on Della and Jim. The best explanation of the function of this ending is that it
      options:
        - |
          tells the reader what happened to the couple in later years
        - |
          reveals that the narrator disapproves of Christmas gift-giving
        - |
          lets the narrator reframe the ironic outcome, turning two useless gifts into evidence of the couple's wisdom
        - |
          introduces a new conflict that the story leaves unresolved
      option_explanations:
        - |
          The ending says nothing about the future; it interprets what we have just seen.
        - |
          The narrator praises the magi, who "invented the art of giving Christmas presents," and crowns the couple as their heirs; that is approval, not disapproval.
        - |
          Correct. The plot ends in situational irony that could feel merely sad or comic. The narrator's commentary converts it into a moral paradox: the gifts failed, the giving succeeded.
        - |
          The final paragraph resolves the story's meaning; it opens no new conflict.
      answer: 2
      explanation: |
        A narrator who gets the last word controls how we interpret the ending. Asking "what does the commentary do to the irony?" is a model 4.B question.

    - slug: u01-w01-q22
      type: long_answer
      topic_code: "4.B"
      source: 'O. Henry, "The Gift of the Magi" (1905)'
      points: 4
      prompt: |
        Write one well-developed analytical paragraph (about 150-200 words). Make a claim about how O. Henry's narrator shapes the reader's attitude toward Della and Jim, support it with at least two short quotations from different parts of the story, and explain how each quotation supports your claim.
      answer: |
        Claim: O. Henry's narrator uses humour to keep the couple's poverty from becoming pitiful, so that the reader's laughter turns into respect. Evidence 1: the comic "moral reflection" that life is "sobs, sniffles, and smiles, with sniffles predominating," which turns Della's collapse on the couch into a shared joke. Commentary: the joke makes her trouble universal rather than pathetic; we smile with the narrator, not at Della. Evidence 2: the closing reversal, from "two foolish children" to "of all who give gifts these two were the wisest." Commentary: the narrator first voices the practical view a reader might hold, then overturns it, so that our amusement at the doubled irony becomes admiration. Concluding link: humour is the means, respect the end.
      explanation: |
        4 points. Claim (1): an arguable claim about the narrator's effect on the reader's attitude toward the characters, not a summary or a label ("the story is third person"). Evidence (1): at least two accurate, short quotations from different parts of the story, smoothly introduced. Commentary (2): 2 points if each quotation is explained in terms of the claim (how the words work, not just what happens); 1 point if commentary is present but thin, repeats the quotation or explains only one piece of evidence; 0 if the paragraph only summarises. A paragraph with strong commentary on one quotation and a mere mention of another earns at most 3.
