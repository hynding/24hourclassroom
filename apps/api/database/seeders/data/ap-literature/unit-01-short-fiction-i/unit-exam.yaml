  - slug: u01-exam-q27
    type: multiple_choice
    topic_code: "4.B"
    source: 'Kate Chopin, The Awakening (1899)'
    points: 1
    stimulus: *ex_awakening
    prompt: |
      The description of "the light which, showing the way, forbids it" is best understood as
    options:
      - |
        a literal description of the sunrise over the beach
      - |
        a paradox: Edna's dawning awareness reveals a new path for her life even as it makes clear that the path is forbidden
      - |
        a sign that Robert is forbidding Edna to swim
      - |
        evidence that Edna has decided to return home immediately
    option_explanations:
      - |
        The light dawns "within her"; it is figurative, an image of inner awareness.
      - |
        Correct. To see a way is also to see that it is barred. The paradox captures the double effect of Edna's awakening and prepares the "bewilder" of the next paragraph.
      - |
        Robert has invited her; nothing shows him forbidding anything.
      - |
        The passage does not record any decision to leave; it describes an inner change.
    answer: 1
    explanation: |
      Narrators often compress a character's inner state into a striking figure. Read "within her" first: it tells you the light is metaphorical.

  - slug: u01-exam-q28
    type: multiple_choice
    topic_code: "4.A"
    source: 'Kate Chopin, The Awakening (1899)'
    points: 1
    stimulus: *ex_awakening
    prompt: |
      The comment that Edna's realization is "perhaps more wisdom than the Holy Ghost is usually pleased to vouchsafe to any woman" conveys the narrator's
    options:
      - |
        sincere belief that women are incapable of wisdom
      - |
        wry irony toward the conventional assumption that such self-knowledge is not meant for women
      - |
        anger at Edna for thinking too much
      - |
        religious devotion
    option_explanations:
      - |
        The narrator has just treated Edna's realization seriously; "perhaps" and "usually pleased to vouchsafe" signal irony, not belief.
      - |
        Correct. The mock-solemn phrasing voices the conventional view in order to expose it. The narrator takes Edna's awakening seriously while needling the society that would find it unwomanly.
      - |
        Nothing in the passage condemns Edna; the next paragraph sympathises with how "disturbing" such beginnings are.
      - |
        The religious language is used ironically; the passage is about individual consciousness, not devotion.
    answer: 1
    explanation: |
      Irony is a narrator's attitude expressed by saying something it does not mean. Watch for qualifiers like "perhaps" and "usually" that tilt a statement toward mockery.

  - slug: u01-exam-q29
    type: multiple_choice
    topic_code: "3.B"
    source: 'Kate Chopin, The Awakening (1899)'
    points: 1
    stimulus: *ex_awakening
    prompt: |
      The fifth paragraph ("But the beginning of things [...] How many souls perish in its tumult!") functions in the sequence of the chapter chiefly to
    options:
      - |
        return to the plot by describing Edna's walk to the beach
      - |
        widen the focus from Edna to human experience in general, giving her awakening weight and danger
      - |
        reveal that Edna will die by the end of the chapter
      - |
        introduce a new character who has also experienced an awakening
    option_explanations:
      - |
        The walk to the beach is never narrated; the paragraph is reflection, not action.
      - |
        Correct. Moving from Edna's case to "the beginning of things" and to "us" generalises her experience and warns that many "perish in its tumult," which raises the stakes of what is happening to her.
      - |
        The paragraph speaks of souls perishing in general and figuratively; it reports no event in Edna's life.
      - |
        No new character appears; "us" refers to people in general.
    answer: 1
    explanation: |
      A shift from the particular to the general is a common move in prose passages; its function is usually to enlarge the meaning of the particular.

