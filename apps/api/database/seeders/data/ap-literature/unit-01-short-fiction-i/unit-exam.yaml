  # ---- Set D: unseen passage, Kate Chopin, The Awakening (1899), chapter VI
  - slug: u01-exam-q25
    type: multiple_choice
    topic_code: "4.A"
    source: 'Kate Chopin, The Awakening (1899)'
    points: 1
    stimulus: &ex_awakening |
      *The following passage is the complete sixth chapter of Kate Chopin's novel* The Awakening *(1899). Edna Pontellier, a young wife and mother, is spending the summer at a resort on Grand Isle, off the coast of Louisiana. Robert, a young man staying at the resort, has just asked her to go down to the beach to swim.*

      Edna Pontellier could not have told why, wishing to go to the beach with Robert, she should in the first place have declined, and in the second place have followed in obedience to one of the two contradictory impulses which impelled her.

      A certain light was beginning to dawn dimly within her,—the light which, showing the way, forbids it.

      At that early period it served but to bewilder her. It moved her to dreams, to thoughtfulness, to the shadowy anguish which had overcome her the midnight when she had abandoned herself to tears.

      In short, Mrs. Pontellier was beginning to realize her position in the universe as a human being, and to recognize her relations as an individual to the world within and about her. This may seem like a ponderous weight of wisdom to descend upon the soul of a young woman of twenty-eight—perhaps more wisdom than the Holy Ghost is usually pleased to vouchsafe to any woman.

      But the beginning of things, of a world especially, is necessarily vague, tangled, chaotic, and exceedingly disturbing. How few of us ever emerge from such beginning! How many souls perish in its tumult!

      The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring, inviting the soul to wander for a spell in abysses of solitude; to lose itself in mazes of inward contemplation.

      The voice of the sea speaks to the soul. The touch of the sea is sensuous, enfolding the body in its soft, close embrace.
    prompt: |
      The narrator of the passage is best described as
    options:
      - |
        Edna herself, recording her thoughts in a diary
      - |
        a third-person narrator who reports Edna's inner life and also steps back to reflect on it and on human experience generally
      - |
        Robert, explaining why Edna accepted his invitation
      - |
        an objective narrator who reports only what Edna says and does
    option_explanations:
      - |
        Edna is "she" and "Mrs. Pontellier" throughout; the narration is third person.
      - |
        Correct. The narrator knows what Edna "could not have told," describes the "light" dawning in her, then generalises ("How few of us ever emerge") and comments wryly on the "ponderous weight of wisdom."
      - |
        Robert is mentioned once, in the third person; he does not narrate and could not know Edna's inner state.
      - |
        Edna says nothing and does little in the passage; nearly all of it concerns her inner state and the narrator's reflections.
    answer: 1
    explanation: |
      Apply the week 1 test to an unseen passage: pronouns, participation, and how much the voice comments.

  - slug: u01-exam-q26
    type: multiple_choice
    topic_code: "1.A"
    source: 'Kate Chopin, The Awakening (1899)'
