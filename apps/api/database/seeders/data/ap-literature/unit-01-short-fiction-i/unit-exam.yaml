unit: 1
description: |
  44 questions · about 80 minutes · every skill of Unit 1 (character 1.A, setting 2.A, plot order and sequence 3.A
  and 3.B, narrator and point of view 4.A and 4.B, the claim-and-evidence paragraph 7.A). Four passage sets: new
  passages from "The Gift of the Magi," "Araby" and "The Necklace," and one passage you have not studied, from Kate
  Chopin's novel The Awakening (1899), followed by an AP-style prose fiction analysis essay on it. Then ten questions
  across the unit, including two short written responses. Multiple choice, select-all and true/false items are
  graded at once; fill-in-the-blank items are matched automatically; the short responses and the essay are graded
  by your teacher against the model answers and the 6-point AP rubric.
questions:
  # ---- Set A: "The Gift of the Magi", Jim's return and the narrator's verdict
  - slug: u01-exam-q01
    type: multiple_choice
    topic_code: "4.B"
    source: 'O. Henry, "The Gift of the Magi" (1905)'
    points: 1
    stimulus: &ex_magi |
      *The following passages are from O. Henry's "The Gift of the Magi" (1905). Della has sold her hair to buy Jim a Christmas present; Jim has just come home.*

      Jim stopped inside the door, as immovable as a setter at the scent of quail. His eyes were fixed upon Della, and there was an expression in them that she could not read, and it terrified her. It was not anger, nor surprise, nor disapproval, nor horror, nor any of the sentiments that she had been prepared for. He simply stared at her fixedly with that peculiar expression on his face.

      [...]

      For ten seconds let us regard with discreet scrutiny some inconsequential object in the other direction. Eight dollars a week or a million a year—what is the difference? A mathematician or a wit would give you the wrong answer. The magi brought valuable gifts, but that was not among them. This dark assertion will be illuminated later on.

      [...]

      The magi, as you know, were wise men—wonderfully wise men—who brought gifts to the Babe in the manger. They invented the art of giving Christmas presents. Being wise, their gifts were no doubt wise ones, possibly bearing the privilege of exchange in case of duplication. And here I have lamely related to you the uneventful chronicle of two foolish children in a flat who most unwisely sacrificed for each other the greatest treasures of their house. But in a last word to the wise of these days let it be said that of all who give gifts these two were the wisest. Of all who give and receive gifts, such as they are wisest. Everywhere they are wisest. They are the magi.
    prompt: |
      In the first paragraph, the phrase "an expression in them that she could not read" chiefly serves to
    options:
      - |
        reveal that Della has poor eyesight
      - |
        keep the narration aligned with Della's perception, so the reader shares her uncertainty about Jim's reaction
      - |
        show that Jim is deliberately hiding his anger
      - |
        indicate that the narrator does not know what Jim feels
    option_explanations:
      - |
        "Read" is used figuratively, meaning interpret; the problem is the meaning of the look, not her sight.
      - |
        Correct. The narration sees Jim from Della's side of the room. Because she cannot interpret his look, neither can we, and the suspense holds until Jim explains.
      - |
        The narrator says outright that the expression "was not anger." Nothing is being hidden from Della in that sense.
      - |
        The narrator knows enough to say what the expression was not; withholding what it was is a choice that keeps us with Della.
    answer: 1
    explanation: |
      Point-of-view questions often turn on whose perception the narration follows at a given moment.

  - slug: u01-exam-q02
    type: multiple_choice
    topic_code: "1.A"
    source: 'O. Henry, "The Gift of the Magi" (1905)'
    points: 1
    stimulus: *ex_magi
    prompt: |
      The simile "as immovable as a setter at the scent of quail" characterises Jim as
    options:
      - |
        frozen in intense, fixed attention
      - |
        timid and eager to run away
      - |
        hostile and ready to attack
      - |
        bored and indifferent
    option_explanations:
      - |
        Correct. A setter freezes and points when it scents game. The comic hunting image shows Jim absolutely still, fixed on Della, while also lightening the tension.
      - |
        A setter at the scent holds its ground; the image conveys stillness and focus, not flight.
      - |
        A setter points; it does not attack. The narrator also rules out anger explicitly.
      - |
        "Fixed" and "stared at her fixedly" convey the opposite of indifference.
    answer: 0
    explanation: |
      Read both halves of a simile: what the dog does at the scent tells you what Jim is doing at the door.

  - slug: u01-exam-q03
    type: multiple_choice
    topic_code: "4.A"
    source: 'O. Henry, "The Gift of the Magi" (1905)'
    points: 1
    stimulus: *ex_magi
    prompt: |
      In the second paragraph, the narrator's use of "let us" most clearly
    options:
      - |
        includes the reader in the narrator's tactful decision to look away, creating a companionable, playful relationship
      - |
        reveals that the narrator and Della are the same person
      - |
        signals that Jim is now telling the story
      - |
        commands the reader to stop reading for ten seconds
    option_explanations:
      - |
        Correct. "Us" joins narrator and reader as discreet onlookers who turn away from the couple's embrace. The courtesy is a joke and a gesture of affection toward the characters.
      - |
        Della is referred to in the third person throughout; "us" means narrator and reader.
      - |
        The voice is the same intrusive narrator as before; Jim never narrates.
      - |
        The instruction is playful and figurative, a way of skipping a private moment, not a literal command.
    answer: 0
    explanation: |
      First-person plural pronouns in a third-person narrative usually bind narrator and reader together; ask what attitude that alliance expresses.

  - slug: u01-exam-q04
    type: multiple_choice
    topic_code: "4.B"
    source: 'O. Henry, "The Gift of the Magi" (1905)'
    points: 1
    stimulus: *ex_magi
    prompt: |
      The sentence "This dark assertion will be illuminated later on" functions primarily to
    options:
      - |
        apologise for a mistake in the narrator's arithmetic
      - |
        openly promise the reader that a puzzling remark will make sense later, building anticipation for the ending
      - |
        suggest that something sinister is about to happen to the couple
      - |
        indicate that the magi will appear as characters in the story
    option_explanations:
      - |
        The narrator does not admit an error; the remark about the "wrong answer" is a riddle, not a correction.
      - |
        Correct. The narrator calls attention to his own riddle and postpones its solution. The final paragraph, about the true value of the magi's gifts, "illuminates" it.
      - |
        "Dark" means obscure, as the pun with "illuminated" makes clear; it does not mean menacing.
      - |
        The magi are discussed in the narrator's commentary; they never enter the action.
    answer: 1
    explanation: |
      A narrator who comments on the timing of the story's own revelations is shaping the plot's sequence in plain view.

  - slug: u01-exam-q05
    type: multi_select
    topic_code: "4.A"
    source: 'O. Henry, "The Gift of the Magi" (1905)'
    points: 2
    partial_credit: true
    stimulus: *ex_magi
    prompt: |
      In the final paragraph, which TWO phrases present the couple's actions as foolish by ordinary, practical standards, a view the narrator then overturns? Select two.
    options:
      - |
        "two foolish children in a flat"
      - |
        "most unwisely sacrificed for each other the greatest treasures of their house"
      - |
        "of all who give gifts these two were the wisest"
      - |
        "They are the magi."
    option_explanations:
      - |
        Correct. "Foolish children" voices the practical judgment: two young people who acted rashly.
      - |
        Correct. "Most unwisely" states the same practical view: they gave up their best possessions for gifts neither can use.
      - |
        This is the narrator's reversal of the practical view, not an instance of it.
      - |
        The final sentence crowns them; it is the culmination of the reversal.
    answer: [0, 1]
    explanation: |
      The paragraph is built as concession then reversal; telling the two halves apart is the key to the narrator's attitude.

  - slug: u01-exam-q06
    type: multiple_choice
    topic_code: "3.B"
    source: 'O. Henry, "The Gift of the Magi" (1905)'
    points: 1
    stimulus: *ex_magi
    prompt: |
      The sequence of the three excerpts (Jim's frozen stare, the narrator's interlude, the final verdict) is best described as moving from
    options:
      - |
        comedy to tragedy to comedy
      - |
        suspense, through a deliberate delay, to a moral reinterpretation of the story's outcome
      - |
        Della's point of view to Jim's to the magi's
      - |
        the present to the distant past to the future
    option_explanations:
      - |
        The tone is comic throughout and closes in admiration, not tragedy; the pattern of the sequence lies elsewhere.
      - |
        Correct. The stare creates suspense; the interlude postpones its resolution and hints at a hidden meaning; the last paragraph delivers that meaning by recasting the ironic outcome as wisdom.
      - |
        The narration never adopts Jim's or the magi's point of view; the final paragraph is the narrator's own commentary.
      - |
        The excerpts follow the evening in order and end in the narrator's present commentary; the mention of the magi is an allusion, not a time shift in the action.
    answer: 1
    explanation: |
      Skill 3.B: describe what a sequence builds. Here, suspense, delay and release are all controlled by the narrator.

  - slug: u01-exam-q07
    type: true_false
    topic_code: "4.A"
    source: 'O. Henry, "The Gift of the Magi" (1905)'
    points: 1
    stimulus: *ex_magi
    prompt: |
      True or false: because the narrator says "here I have lamely related to you," the story should be classified as a first-person narrative told by one of its characters.
    answer: false
    explanation: |
      False. The "I" is the storyteller, who never takes part in the action; the characters are always "Della" and "Jim." This is an intrusive third-person narrator who occasionally refers to himself.

  - slug: u01-exam-q08
    type: multiple_choice
    topic_code: "4.A"
    source: 'O. Henry, "The Gift of the Magi" (1905)'
    points: 1
    stimulus: *ex_magi
    prompt: |
      The remark that the magi's gifts were "possibly bearing the privilege of exchange in case of duplication" is best described as
    options:
      - |
        a solemn point of religious history
      - |
        a playful anachronism that treats the magi like modern shoppers, keeping the tone light before the sincere conclusion
      - |
        a criticism of the magi for giving poor gifts
      - |
        evidence that the narrator disapproves of exchanging gifts
    option_explanations:
      - |
        The idea of returning duplicate gifts belongs to modern department stores, not to the Gospel; the remark is a joke.
      - |
        Correct. Imagining the wise men's gifts with a store's exchange policy is comic, and it keeps the narrator's characteristic humour alive right up to the earnest final verdict.
      - |
        The narrator calls the magi "wonderfully wise" and their gifts "wise ones"; the joke is affectionate.
      - |
        The remark imagines exchange as a sensible feature of wise gifts, not as something to disapprove of.
    answer: 1
    explanation: |
      Tone questions about humour ask what the joke does: here it preserves the narrator's lightness so the closing sincerity feels earned rather than preachy.

  # ---- Set B: "Araby", the bazaar
  - slug: u01-exam-q09
    type: multiple_choice
    topic_code: "2.A"
    source: 'James Joyce, "Araby" (1914)'
    points: 1
    stimulus: &ex_araby |
      *The following passages are from James Joyce's "Araby" (1914). The narrator, a boy, has travelled alone to the bazaar late on a Saturday night to buy a gift for the girl he adores.*

      I could not find any sixpenny entrance and, fearing that the bazaar would be closed, I passed in quickly through a turnstile, handing a shilling to a weary-looking man. I found myself in a big hall girdled at half its height by a gallery. Nearly all the stalls were closed and the greater part of the hall was in darkness. I recognised a silence like that which pervades a church after a service. I walked into the centre of the bazaar timidly.

      [...]

      I lingered before her stall, though I knew my stay was useless, to make my interest in her wares seem the more real. Then I turned away slowly and walked down the middle of the bazaar. I allowed the two pennies to fall against the sixpence in my pocket. I heard a voice call from one end of the gallery that the light was out. The upper part of the hall was now completely dark.

      Gazing up into the darkness I saw myself as a creature driven and derided by vanity; and my eyes burned with anguish and anger.
    prompt: |
      The details of the entrance ("a turnstile," "a shilling," "a weary-looking man") chiefly establish the bazaar as
    options:
      - |
        an exotic, enchanted place, just as the boy imagined it
      - |
        an ordinary commercial event, tired and routine, at odds with the boy's romantic expectations
      - |
        a dangerous place where the boy might be robbed
      - |
        a charitable event run by the church
    option_explanations:
      - |
        Nothing in the entrance is exotic: a turnstile, a coin, a tired attendant. The enchantment the boy expected is conspicuously absent.
      - |
        Correct. The first things he meets are machinery for collecting money and a "weary-looking" man. The setting is mundane and fatigued, the opposite of "Araby" as he dreamed it.
      - |
        The passage contains no threat; the boy's anxiety is about the bazaar closing, not about safety.
      - |
        The church appears only in a simile for the silence; the entrance details are commercial.
    answer: 1
    explanation: |
      The first details of a new setting set its tone. Here they undercut the boy's expectations at once.

  - slug: u01-exam-q10
    type: multiple_choice
    topic_code: "2.A"
    source: 'James Joyce, "Araby" (1914)'
    points: 1
    stimulus: *ex_araby
    prompt: |
      Which best describes the function of the statement "Nearly all the stalls were closed and the greater part of the hall was in darkness"?
    options:
      - |
        It shows the boy has arrived too late, and the darkened hall anticipates the end of his romantic hopes.
      - |
        It explains why the boy decides to buy the cheapest gift available.
      - |
        It suggests the bazaar has not yet opened for the evening.
      - |
        It reveals that the bazaar is held outdoors at night.
    option_explanations:
      - |
        Correct. Closing stalls and darkness confirm that the delays have cost him the bazaar, and they prefigure the final darkness in which he sees himself clearly.
      - |
        He buys nothing at all; the coins remain in his pocket.
      - |
        "Fearing that the bazaar would be closed" and the closing stalls show it is ending, not beginning.
      - |
        He is in "a big hall girdled at half its height by a gallery," an indoor space.
    answer: 0
    explanation: |
      Setting details often work twice: literally (it is late) and structurally (the darkness prepares the ending).

  - slug: u01-exam-q11
    type: multiple_choice
    topic_code: "4.B"
    source: 'James Joyce, "Araby" (1914)'
    points: 1
    stimulus: *ex_araby
    prompt: |
      The sentence "I walked into the centre of the bazaar timidly" contributes to the passage chiefly by
    options:
      - |
        revealing the adult narrator's present-day fear of crowds
      - |
        recording the boy's hushed, almost reverent hesitation in a place he had imagined as sacred
      - |
        showing that the boy is unwilling to spend the money
      - |
        suggesting that the boy is lost and cannot find the exit
    option_explanations:
      - |
        The sentence describes the past moment, and the hall is nearly empty; there is no crowd and no present-day narrator's fear.
      - |
        Correct. After comparing the silence to a church "after a service," the boy moves "timidly," as one might in a church. The narration conveys his awe and uncertainty as the dream meets the reality.
      - |
        The timidity follows the church simile, not any thought of money.
      - |
        He walks "into the centre" deliberately; nothing suggests he is lost.
    answer: 1
    explanation: |
      Adverbs of manner are small but telling evidence of a character's state; read them against the sentence just before.

  - slug: u01-exam-q12
    type: multiple_choice
    topic_code: "3.A"
    source: 'James Joyce, "Araby" (1914)'
    points: 1
    stimulus: *ex_araby
    prompt: |
      In the sequence of the second excerpt, the boy lets "the two pennies to fall against the sixpence" in his pocket just after turning away from the stall. This action marks
    options:
      - |
        the moment he decides to buy a gift after all
      - |
        the end of his quest: the money meant for the gift will go unspent
      - |
        his discovery that he has been robbed
      - |
        a flashback to his childhood savings
    option_explanations:
      - |
        He has just turned away; the action follows his abandonment of the purchase, not a renewed intention.
      - |
        Correct. Letting the coins drop back into his pocket is a quiet gesture of surrender. The promised gift will never be bought, and the plot moves at once to the lights going out.
      - |
        The coins are still there; nothing has been taken.
      - |
        The action is in the present of the story, not a flashback.
    answer: 1
    explanation: |
      Plot is ordered by small physical actions as well as big events. The sound of the coins is the last thing that happens before the epiphany.

  - slug: u01-exam-q13
    type: multiple_choice
    topic_code: "2.A"
    source: 'James Joyce, "Araby" (1914)'
    points: 1
    stimulus: *ex_araby
    prompt: |
      The announcement "that the light was out," followed by "The upper part of the hall was now completely dark," functions primarily to
    options:
      - |
        signal that the bazaar has been closed by the police
      - |
        make the physical darkening of the hall coincide with, and seem to prompt, the boy's inner moment of recognition
      - |
        explain why the boy cannot see the stall's wares clearly
      - |
        prepare for a scene in which the boy finds his way home
    option_explanations:
      - |
        A routine closing call, not police action, is what the passage describes.
      - |
        Correct. The setting enacts the change in the boy: as the light goes out above him, he looks "up into the darkness" and sees himself. Outer darkness and inner clarity arrive together.
      - |
        He has already left the stall and walked down the middle of the bazaar; the darkness serves the ending, not the shopping.
      - |
        The story ends with the next sentence; there is no journey home.
    answer: 1
    explanation: |
      When setting changes at the climax, ask how the change mirrors or triggers what happens inside the character.

  - slug: u01-exam-q14
    type: multiple_choice
    topic_code: "4.A"
    source: 'James Joyce, "Araby" (1914)'
    points: 1
    stimulus: *ex_araby
    prompt: |
      The diction of the final sentence ("creature," "driven," "derided by vanity") most strongly reflects
    options:
      - |
        the girl's opinion of the boy
      - |
        the shop girl's mockery of the boy
      - |
        the harsh self-judgment of a narrator looking back on his younger self
      - |
        the boy's anger at his uncle for making him late
    option_explanations:
      - |
        Mangan's sister is not present and her opinion is never given.
      - |
        The shop girl's words were trivial and addressed to others; the judgment here is the narrator's own ("I saw myself").
      - |
        Correct. These are severe, reflective words. "Derided by vanity" judges the boy's whole romance as self-deception, a verdict the adult narrator voices through the boy's moment of insight.
      - |
        "Anger" appears, but the sentence names "vanity," his own, as what drove and mocked him; it does not blame the uncle.
    answer: 2
    explanation: |
      In retrospective narration, diction is where the older narrator's judgment shows. Ask whose vocabulary a word belongs to.

  - slug: u01-exam-q15
    type: multi_select
    topic_code: "3.B"
    source: 'James Joyce, "Araby" (1914)'
    points: 3
    partial_credit: true
    stimulus: *ex_araby
    prompt: |
      Which details in the passage, taken in sequence, prepare for the boy's final recognition? Select all that apply.
    options:
      - |
        The closed stalls and the darkened hall on his arrival
      - |
        The silence "like that which pervades a church after a service"
      - |
        His admission that he "knew my stay was useless"
      - |
        His purchase of a small vase for Mangan's sister
    option_explanations:
      - |
        Correct. From the first moment the place falls short: closing, dark, nearly empty.
      - |
        Correct. The sacred feeling he hoped for is present only as an after-silence, foreshadowing his discovery that the devotion was empty.
      - |
        Correct. He already half knows the quest has failed; the final sentence makes that knowledge complete.
      - |
        He buys nothing; the coins stay in his pocket. No purchase occurs in the story.
    answer: [0, 1, 2]
    explanation: |
      Skill 3.B: the epiphany feels inevitable because the passage stacks up signs of failure before naming it.

  - slug: u01-exam-q16
    type: true_false
    topic_code: "1.A"
    source: 'James Joyce, "Araby" (1914)'
    points: 1
    stimulus: *ex_araby
    prompt: |
      True or false: the final sentence suggests that the boy's "anguish and anger" are directed at least partly at himself.
    answer: true
    explanation: |
      True. He sees "myself as a creature driven and derided by vanity." The fault lies in his own self-dramatising romance, and the anger turns inward.

  - slug: u01-exam-q17
    type: fill_blank
    topic_code: "2.A"
    source: 'James Joyce, "Araby" (1914)'
    points: 1
    stimulus: *ex_araby
    prompt: |
      Complete the final sentence: "Gazing up into the ____ I saw myself as a creature driven and derided by vanity."
    answer: ["darkness"]
    explanation: |
      The darkness of the hall is the setting of the epiphany; the boy sees most clearly when the light is gone.

  # ---- Set C: "The Necklace", Mathilde's dreams
  - slug: u01-exam-q18
    type: multiple_choice
    topic_code: "1.A"
    source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
    points: 1
    stimulus: &ex_necklace |
      *The following passage is from Guy de Maupassant's "The Necklace" (1884), in an early English translation published as "The Diamond Necklace." Mathilde is married to a minor government clerk.*

      Mathilde suffered ceaselessly, feeling herself born to enjoy all delicacies and all luxuries. She was distressed at the poverty of her dwelling, at the bareness of the walls, at the shabby chairs, the ugliness of the curtains. All those things, of which another woman of her rank would never even have been conscious, tortured her and made her angry. The sight of the little Breton peasant who did her humble housework aroused in her despairing regrets and bewildering dreams. She thought of silent antechambers hung with Oriental tapestry, illumined by tall bronze candelabra, and of two great footmen in knee breeches who sleep in the big armchairs, made drowsy by the oppressive heat of the stove. She thought of long reception halls hung with ancient silk, of the dainty cabinets containing priceless curiosities and of the little coquettish perfumed reception rooms made for chatting at five o'clock with intimate friends, with men famous and sought after, whom all women envy and whose attention they all desire.
    prompt: |
      The final clause, "whom all women envy and whose attention they all desire," suggests that Mathilde's dreams are chiefly about
    options:
      - |
        enjoying beautiful objects for their own sake
      - |
        being admired and envied by others
      - |
        escaping her marriage for a life alone
      - |
        reading and conversation as intellectual pleasures
    option_explanations:
      - |
        The objects matter, but the passage ends on other women's envy and men's attention; the luxury is a stage for being seen.
      - |
        Correct. The dream culminates in social triumph: intimacy with famous men "whom all women envy." What she wants is not only luxury but the status of being desired and envied.
      - |
        Her dream is of company, "intimate friends" and famous men, not solitude.
      - |
        The chatting is social display "at five o'clock," framed by envy and desire, not intellectual pursuit.
    answer: 1
    explanation: |
      The end of a long sentence is a stressed position. Ask what the sentence builds toward.

  - slug: u01-exam-q19
    type: multiple_choice
    topic_code: "2.A"
    source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
    points: 1
    stimulus: *ex_necklace
    prompt: |
      The imagined rooms ("silent antechambers hung with Oriental tapestry," "long reception halls hung with ancient silk") function in the passage chiefly to
    options:
      - |
        describe the Loisels' actual apartment in detail
      - |
        create an imaginary setting whose richness contrasts with the "bareness" and "shabby chairs" of her real home
      - |
        reveal that Mathilde once lived in a palace
      - |
        introduce the setting of the ball she will attend that evening
    option_explanations:
      - |
        These rooms are what "She thought of"; her real home has bare walls and shabby chairs.
      - |
        Correct. The passage sets two settings side by side: the real, plain dwelling and an imagined palace. The contrast measures the gap that torments her.
      - |
        She was born "into a family of clerks"; the palace is pure fantasy.
      - |
        At this point she has no invitation; these are daydreams, not plans.
    answer: 1
    explanation: |
      A setting can be imagined as well as real. Contrasting the two is a common way stories reveal desire.

  - slug: u01-exam-q20
    type: multiple_choice
    topic_code: "4.B"
    source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
    points: 1
    stimulus: *ex_necklace
    prompt: |
      Which best describes how the point of view works in the passage as a whole?
    options:
      - |
        It stays entirely outside Mathilde, describing only her actions.
      - |
        It enters Mathilde's longings and daydreams in lavish detail, while one clause steps back to judge them as excessive.
      - |
        It is a first-person account in which Mathilde describes her own suffering.
      - |
        It alternates between Mathilde's thoughts and her husband's.
    option_explanations:
      - |
        The passage is full of what she feels and imagines ("suffered," "She thought of"), not just what she does.
      - |
        Correct. The narration gives us her inner life richly but includes the measuring clause "of which another woman of her rank would never even have been conscious." Sympathy and ironic distance coexist.
      - |
        Mathilde is "she"; the narration is third person.
      - |
        The husband does not appear in the passage at all.
    answer: 1
    explanation: |
      Third-person narration can move in and out of a character's mind. Identifying where it steps out is often the key to a passage's tone.

  - slug: u01-exam-q21
    type: multiple_choice
    topic_code: "3.B"
    source: 'Guy de Maupassant, "The Necklace" (1884), early English translation "The Diamond Necklace"'
    points: 1
    stimulus: *ex_necklace
    prompt: |
      This passage comes before Mathilde receives the invitation to the Ministry ball. Its placement there functions chiefly to
    options:
      - |
        explain how she lost the necklace
      - |
        make the ball appear, when it comes, as the one chance for her dreams to come true, raising the stakes of everything she does to attend it
      - |
        show that she has already met Madame Forestier at a party
      - |
        reveal that the necklace is fake
    option_explanations:
      - |
        The necklace has not yet entered the story; this passage precedes the whole chain of events.
      - |
        Correct. Once we know these dreams, the invitation becomes a door into them, which explains her tears over a dress, her insistence on jewels and her triumph at the ball.
      - |
        Madame Forestier is not mentioned here; the passage is entirely Mathilde's imagination.
      - |
        That revelation comes only in the story's last lines; the placement of this passage has nothing to do with it directly.
    answer: 1
    explanation: |
      Skill 3.B: exposition placed before the inciting event loads that event with meaning.

  - slug: u01-exam-q22
    type: multiple_choice
    topic_code: "7.A"
