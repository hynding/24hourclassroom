    topic_code: "4.A"
    source: general knowledge
    points: 1
    prompt: |
      A first-person narrator who tells events from a much later point in life, as the narrator of "Araby" does, is called a ____ narrator.
    answer: ["retrospective", "retrospective first-person", "retrospective first person"]
    explanation: |
      Retrospective narration creates two versions of the "I": the one who experienced events and the one who now tells them. Their difference is a major source of irony.

  - slug: u01-exam-q42
    type: fill_blank
    topic_code: "3.B"
    source: general knowledge
    points: 1
    prompt: |
      Placing two contrasting events side by side, as Maupassant places Mathilde's triumph at the ball directly before the loss of the necklace, is called ____.
    answer: ["juxtaposition", "juxtaposing"]
    explanation: |
      Juxtaposition sharpens each element by contrast. When a question asks about the function of a sequence, juxtaposition and reversal are often part of the answer.

  - slug: u01-exam-q43
    type: short_answer
    topic_code: "3.B"
    source: 'O. Henry, "The Gift of the Magi" (1905); James Joyce, "Araby" (1914); Guy de Maupassant, "The Necklace" (1884)'
    points: 3
    prompt: |
      Choose one of the three stories in this unit. Identify a specific sequence of two or more events and, in two or three sentences, explain the function of placing those events in that order.
    answer: |
      In "Araby," the boy's long, frustrating wait for his uncle on Saturday night is placed directly before his arrival at the bazaar. The delays make him arrive as the stalls close and the lights go out, so the sequence guarantees that his quest meets an empty, darkening hall. By arranging events so the romance collapses in this setting, Joyce turns a disappointing errand into the moment of self-recognition that ends the story.
    explanation: |
      1 point: identifies a specific, accurately ordered sequence of events. 1 point: explains what the ordering achieves (cause and effect, suspense, reversal, contrast, delayed knowledge). 1 point: connects the function to the story's meaning or the reader's experience. Plot summary without explanation earns at most 1.

  - slug: u01-exam-q44
    type: short_answer
    topic_code: "7.A"
    source: 'O. Henry, "The Gift of the Magi" (1905); James Joyce, "Araby" (1914)'
    points: 3
    prompt: |
      Write a short paragraph (three or four sentences) with a defensible claim comparing the narrators of "The Gift of the Magi" and "Araby," one piece of evidence from each story, and commentary explaining how the evidence supports your claim.
    answer: |
      Both narrators judge the characters they describe, but O. Henry's narrator ends by praising the couple while Joyce's ends by condemning his own younger self. O. Henry's narrator calls Della and Jim "two foolish children" only to declare them "the wisest," turning an ironic outcome into a celebration. Joyce's narrator, looking back, sees himself as "a creature driven and derided by vanity," so his irony falls on his own boyhood romance. The difference shows how an outside narrator can forgive what an inside narrator, remembering his own folly, cannot.
    explanation: |
      1 point: a defensible comparative claim about the narrators (not just "one is first person, one is third person"). 1 point: accurate, relevant evidence from both stories. 1 point: commentary that explains how the evidence supports the comparison. A response with evidence from only one story earns at most 2.
