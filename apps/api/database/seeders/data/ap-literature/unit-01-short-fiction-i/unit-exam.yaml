  - slug: u01-exam-q34
    type: long_answer
    topic_code: "1.A"
    source: 'Kate Chopin, The Awakening (1899)'
    points: 6
    stimulus: *ex_awakening
    prompt: |
      Read carefully the passage above, the complete sixth chapter of Kate Chopin's novel The Awakening (1899). In it, the narrator describes a change beginning in Edna Pontellier. In a well-written essay, analyze how Chopin uses literary elements and techniques to convey the complex nature of Edna's awakening.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: Chopin presents Edna's awakening as both liberating and dangerous by pairing images of inward light and an alluring sea with a narrator who generalises about the peril of new beginnings, so that the reader sees a self-discovery Edna herself cannot yet understand. Line of reasoning: (1) Divided motive: the first paragraph's "two contradictory impulses" and "could not have told why" show an awakening beneath conscious choice. (2) Paradoxical light: "the light which, showing the way, forbids it" makes awareness at once revelation and prohibition; it brings "dreams" and "shadowy anguish." (3) Narrative voice: the ironic aside about the Holy Ghost exposes conventional limits on women's wisdom, while "How many souls perish in its tumult!" warns that such beginnings can destroy. (4) Setting: the sea's "seductive" voice, inviting the soul to "abysses of solitude," and its "soft, close embrace" make the awakening sensual and spiritual and hint at danger in "abysses." Sophistication: noting how the chapter's own movement, from Edna's particular case to general reflection to the sea, enacts the widening of her consciousness, or the tension between the narrator's sympathy and irony.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis that interprets the complexity of Edna's awakening (for example, both freeing and threatening, felt before it is understood) and ideally names the techniques that convey it. A thesis that only restates the prompt or lists devices without interpretation earns 0. Row B Evidence and Commentary (0-4): 4 = specific, well-integrated quotations from across the chapter (the contradictory impulses, the paradoxical light, the ironic aside, the generalisation about beginnings, the sea) with commentary that consistently explains how each technique conveys the complexity and builds a line of reasoning; 3 = specific evidence and commentary that explains most of it, with some uneven links to the thesis; 2 = some relevant evidence, but commentary that is general, repetitive or drifts toward paraphrase; 1 = summary or a list of devices with little explanation; 0 = no relevant evidence. Row C Sophistication (0-1): 1 point for a sustained complex understanding, such as tracing how the chapter's structure mirrors Edna's widening consciousness, explaining the narrator's mix of irony and sympathy, or exploring the double meaning of the sea's "abysses" and "embrace" as both freedom and threat. Grammar and style matter only insofar as they affect the clarity of the argument.

  # ---- Across the unit
  - slug: u01-exam-q35
    type: multiple_choice
    topic_code: "4.B"
    source: general knowledge
    points: 1
    prompt: |
      Which question best targets the FUNCTION of point of view in a story, rather than simply identifying it?
    options:
      - |
        Is the story told in first or third person?
      - |
        What does the narrator's position allow the reader to know, and what does it withhold, and how does that shape the reader's response?
      - |
        How many characters appear in the story?
      - |
        In what year was the story published?
    option_explanations:
      - |
        This identifies the point of view (skill 4.A) but does not ask what it does.
      - |
        Correct. Function means effect: what the telling reveals, what it hides, and what that does to the reader's understanding or feelings.
      - |
        The number of characters is a fact about the cast, not about narration.
      - |
        Publication date is context, not a feature of point of view.
    answer: 1
    explanation: |
      Every unit of the course will ask "what does it do?" after "what is it?" Train the second question.

