      points: 1
      prompt: |
        When the eye opens on the eighth night, the narrator says he "had directed the ray as if by instinct, precisely upon the damned spot." The phrase "damned spot" is most likely an allusion to
      options:
        - |
          Lady Macbeth's sleepwalking cry "Out, damned spot!" in Shakespeare's Macbeth, which links the scene to a guilt that cannot be washed away
        - |
          the mark of Cain in Genesis, which protected Cain from being killed
        - |
          Hamlet's soliloquy "To be, or not to be," which weighs suicide
        - |
          the scarlet letter in Hawthorne's novel, which marks a public sin
      option_explanations:
        - |
          Correct. Lady Macbeth, sleepwalking, tries to scrub imagined blood from her hand. The echo brings a famous image of a murderer's guilt revealed through a disordered mind into the scene, which foreshadows Poe's ending.
        - |
          The mark of Cain is a sign placed on the murderer, not a "spot" to be scrubbed, and the wording does not echo Genesis. It is related in theme but not the allusion the words point to.
        - |
          The words "damned spot" do not appear in Hamlet's soliloquy. Recognising an allusion depends on the exact phrase.
        - |
          The Scarlet Letter (1850) was published after "The Tell-Tale Heart" (1843), so Poe could not allude to it.
      answer: 0

    - slug: u07-w22-q14
      type: true_false
      topic_code: "3.A"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 1
      prompt: |
        Review. True or false: The narrator kills the old man on the first night he enters the room, and then spends seven nights deciding how to hide the body.
      answer: false
      explanation: |
        False. The order is reversed. For seven nights he opens the door at midnight and finds the eye closed, so he does nothing; on the eighth night the old man wakes, the eye opens, and the murder follows. The repetition is what builds the story's suspense, so getting the sequence right matters for any claim about structure.

