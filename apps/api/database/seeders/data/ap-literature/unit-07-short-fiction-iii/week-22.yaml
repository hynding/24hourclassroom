    - slug: u07-w22-q21
      type: short_answer
      topic_code: "7.B"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 2
      prompt: |
        Review. Write a defensible thesis statement (one or two sentences) for an essay on how Poe uses the narrator's own words to persuade the reader of the opposite of what the narrator intends. Your thesis should make an interpretive claim and suggest a line of reasoning.
      answer: |
        Poe lets his narrator argue for his own sanity with the very evidence that condemns him: the over-sharp hearing he boasts of, the care he calls wisdom and the calm he performs in broken, exclamatory sentences all become proof of the obsession he denies, so that by the final confession the reader has already reached the verdict he spent the story contesting.
      explanation: |
        1 point: a defensible interpretive claim about the gap between the narrator's intended meaning and the reader's (not a summary, not a statement of fact such as "the narrator is unreliable" alone).
        1 point: a line of reasoning, such as two or three specific kinds of evidence (hearing, method, syntax, imagery) or a movement across the story. A thesis that only restates the prompt earns 0; one with a claim but no route earns 1.

    - slug: u07-w22-q22
      type: long_answer
      topic_code: "7.C"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 6
      stimulus: |
        *The following passage is from the end of Edgar Allan Poe's "The Tell-Tale Heart" (1843). Three police officers have searched the house and been satisfied; the narrator sits with them in the old man's room, his chair placed over the floorboards beneath which he has hidden the body.*

        No doubt I now grew *very* pale; — but I talked more fluently, and with a heightened voice. Yet the sound increased — and what *could* I do? It was *a low, dull, quick sound — much such a sound as a watch makes when enveloped in cotton*. I gasped for breath — and yet the officers heard it not. I talked more quickly — more vehemently; but the noise steadily increased. I arose and argued about trifles, in a high key and with violent gesticulations; but the noise steadily increased. Why *would* they not be gone? I paced the floor to and fro with heavy strides, as if excited to fury by the observations of the men — but the noise steadily increased. Oh God! what could I do? I foamed — I raved — I swore! I swung the chair upon which I had been sitting, and grated it upon the boards, but the noise arose over all and continually increased. It grew louder — louder — *louder!* And still the men chatted pleasantly, and smiled. Was it possible they heard not? Almighty God! — no, no! They heard! — they suspected! — they *knew!* — they were making a mockery of my horror! — this I thought, and this I think.
      prompt: |
        Carefully read the passage from the end of Edgar Allan Poe's "The Tell-Tale Heart." In it, the narrator, who has insisted throughout that he is not mad, sits with the police above the hidden body. Then, in a well-written essay, analyze how Poe uses literary elements and techniques to convey the complex relationship between what the narrator perceives and what the reader can trust.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        A strong essay argues that Poe builds a gap between perception and fact into the passage's very syntax, so that the reader watches a mind convict itself: the narrator's senses, which he presented as proof of sanity, become the instrument of his exposure, and the passage leaves open whether anything outside him is heard at all.

        Line of reasoning: (1) Repetition: "but the noise steadily increased" returns three times, each after a louder action (talking, arguing, pacing), so the structure enacts a compulsion that escalates no matter what he does. (2) Contrast: every frantic act is set against the officers, who "heard it not" and "chatted pleasantly, and smiled"; the reported behaviour never changes, only his interpretation does, ending in the unsupported leap "They heard! — they suspected! — they knew!" (3) The heartbeat simile repeated from the murder scene ("a watch ... enveloped in cotton") ties the sound to the earlier night, and to time and concealment; whether it is the dead man's heart, his own pulse or a hallucination, the text never confirms. (4) The last clause, "this I thought, and this I think," returns to the present of narration: he still believes the officers knew, so the narrator who told the story is the same man who broke here.

        Sophistication: weighs the alternative readings of the sound (guilt, physiology, supernatural) and explains why Poe's refusal to settle them is the point; or places the passage in the story's argument about sanity, showing how the ending answers the opening's "How, then, am I mad?"
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis about how techniques convey the gap between the narrator's perception and what the reader can trust (for example, that the narrator's prized senses betray him, or that the passage stages a confession produced by perception alone). Restating the prompt, or a thesis about the whole story's plot with no claim about perception, earns 0.

        Row B Evidence and Commentary (0-4):
        4: specific evidence throughout (the refrain "the noise steadily increased"; the contrast with "chatted pleasantly, and smiled"; the escalating verbs "foamed — I raved — I swore"; the dashes and italics; the repeated watch simile; "this I thought, and this I think"), with commentary that explains how each choice separates perception from fact and builds the line of reasoning.
        3: specific evidence supporting a line of reasoning, with commentary that explains some but not all evidence, or that drifts into summary in places.
        2: evidence that is mostly general or summarised ("he gets more and more upset"), with commentary that repeats or paraphrases rather than explaining the function of techniques.
        1: evidence that is mostly irrelevant or simply listed, with little or no commentary.
        0: restates the thesis or offers no relevant evidence.

        Row C Sophistication (0-1): 1 point for a complex understanding, for example weighing two or three readings of the sound and explaining what the ambiguity accomplishes; tracing how the closing present tense ("I think") links the scene to the frame of the narrator's defence; or a consistently vivid, persuasive style. A single sentence gesturing at "other interpretations" does not earn the point.
