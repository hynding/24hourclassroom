week: 22
unit: 7
title: Reliability and Imagery in "The Tell-Tale Heart"
topics: ["4.D", "5.D"]
texts:
  - author: Edgar Allan Poe
    title: The Tell-Tale Heart
    year: 1843
    url: https://www.gutenberg.org/ebooks/2148
guide: guides/week-22.md
guide_description: |
  How to judge a narrator who tells you he is sane: the evidence a story gives against its own teller, and why
  "unreliable" is a claim to be proved, not a label. Poe's images (the vulture eye, the single ray, the muffled
  heartbeat) as the place where the narrator gives himself away. Four close readings, a model paragraph,
  common misreadings, and how the week feeds the prose-fiction essay.
flashcards_description: |
  30 cards on narrative reliability, the story's key images and comparisons, its sequence of nights, and the
  ambiguities of its ending.

flashcards:
  - front: Unreliable narrator → working definition for Unit 7
    back: |
      A narrator whose account the reader has textual reason to doubt, in its facts, its interpretations or its judgments. The reason must come from the text itself: contradictions, a gap between what is reported and how it is explained, or details the narrator includes without seeing what they show.
    topic_code: "4.D"
  - front: Reliability vs honesty → why they are not the same
    back: |
      A narrator can be perfectly sincere and still unreliable. Poe's narrator does not lie about the murder; he reports it in detail. What we cannot trust is his interpretation: that the care he took proves he is sane.
    hint: "Facts, interpretation, judgment — which one fails?"
    topic_code: "4.D"
  - front: Three layers a reader can doubt in a first-person story
    back: |
      Reporting (did it happen as told?), interpreting (does the narrator understand what it means?) and evaluating (is the narrator's moral judgment sound?). Poe's narrator is fairly reliable on the first, unreliable on the second and third.
    topic_code: "4.D"
  - front: '"very, very dreadfully nervous I had been and am" → what the tense reveals'
    back: |
      The narrator speaks after the events ("had been") and is still in the same state ("am"). The story is a retrospective defence delivered to a listener, not an account of the past from a recovered present.
    topic_code: "4.D"
  - front: '"How, then, am I mad?" → the flaw in the argument'
    back: |
      He offers as proof of sanity the claim that he "heard many things in hell." The evidence he cites for his soundness is itself a symptom, so the question answers itself against him.
    topic_code: "4.D"
  - front: Over-acuteness of the senses → the narrator's own diagnosis
    back: |
      He insists that what others call madness is "over acuteness of the senses." The story lets the reader test this theory against the ending, where the sense of hearing he boasts of is what destroys him.
    topic_code: "4.D"
  - front: The narrator's addressee ("you")
    back: |
      He speaks to someone who has already called him mad ("why will you say that I am mad?"; "You fancy me mad"). The form is a courtroom-style rebuttal, so every detail is chosen as argument, which makes the reader a judge rather than a confidant.
    topic_code: "4.A"
  - front: '"Object there was none. Passion there was none." → why it matters'
    back: |
      The narrator rules out every ordinary motive (profit, injury, insult). Meant to show cool reason, the inverted, ritual syntax actually removes any rational cause, leaving only his fixation on the eye.
    topic_code: "5.B"
  - front: The vulture eye → image and function
    back: |
      "One of his eyes resembled that of a vulture — a pale blue eye, with a film over it." The image turns one feature of a man into a predator's watching eye, so the narrator can kill "the eye" rather than "the old man." It shows how imagery does the narrator's moral reasoning for him.
    topic_code: "5.D"
  - front: The single thin ray → what the lantern does
    back: |
      Each night he opens the lantern just enough that "a single thin ray fell upon the vulture eye." The image narrows the man to a point of light: everything else in the room, including the person, is erased.
    topic_code: "5.D"
  - front: '"It was open — wide, wide open" → the turn on the eighth night'
    back: |
      When the eye is finally open, the narrator grows "furious." Repetition and dashes speed the syntax; the image of the eye "all a dull blue, with a hideous veil over it" chills him. The calm planner disappears at the moment of seeing.
    topic_code: "5.D"
  - front: '"the damned spot" → allusion and effect'
    back: |
      He directs the ray "precisely upon the damned spot," echoing Lady Macbeth's "Out, damned spot!" in Macbeth. The allusion borrows a famous image of guilt that cannot be washed out, and foreshadows a guilt that will speak.
    topic_code: "6.D"
  - front: Heartbeat simile → "such as a watch makes when enveloped in cotton"
    back: |
      A muffled, regular, mechanical sound. The simile links the heart to a timepiece (time running out) and to something wrapped and hidden, which is exactly how the heart is later "concealed" under the floor.
    topic_code: "6.A"
  - front: Drum simile → "as the beating of a drum stimulates the soldier into courage"
    back: |
      The sound that should frighten him instead drives him to attack. The simile casts the murder as a soldier's charge, a heroic frame the reader cannot share, which widens the gap between his view and ours.
    topic_code: "6.A"
  - front: Death "had stalked with his black shadow before him" → device
    back: |
      Personification: Death is a hunter who has already "enveloped the victim." The narrator imagines the old man's terror in grand Gothic terms, while he himself is the death that is stalking.
    topic_code: "6.C"
  - front: '"I was never kinder to the old man than during the whole week before I killed him" → irony'
    back: |
      The sentence presents murderous planning as kindness. The narrator offers it as evidence of self-control; the reader hears dramatic irony, since the kindness is part of the hunt.
    topic_code: "4.D"
  - front: '"I knew what the old man felt, and pitied him, although I chuckled at heart"'
    back: |
      The narrator recognises the old man's terror because he has felt it himself, yet enjoys it. Pity and pleasure in one sentence show a divided mind, and suggest that the fear he describes in the old man is partly his own.
    topic_code: "4.D"
  - front: dissimulation → dissemble (an echo across the story)
    back: |
      Early he boasts of "what dissimulation I went to work"; at the end he screams at the officers to "dissemble no more!" He accuses them of the very pretence he took pride in, projecting his own method onto them.
    topic_code: "5.B"
  - front: Seven nights and the eighth → plot structure
    back: |
      Every night for a week he opens the door at midnight and finds the eye closed, so he cannot act. On the eighth night the old man wakes and the eye opens. The repetition builds suspense and shows the compulsion as ritual.
    topic_code: "3.A"
  - front: Why the police arrive
    back: |
      A neighbour heard a shriek during the night and reported it. The narrator explains the shriek as his own, uttered in a dream, and says the old man is away in the country.
    topic_code: "3.E"
  - front: The chair over the floorboards → what the narrator's triumph causes
    back: |
      Confident, he brings chairs into the room and places his own seat over the spot where the body lies. The excess of his pride puts him directly above the evidence, and his hearing does the rest.
    topic_code: "1.E"
  - front: '"Villains!" ... "dissemble no more! I admit the deed!" → whose heart?'
    back: |
      The narrator says it is "the beating of his hideous heart." The text never confirms what the sound is: the dead man's heart, the narrator's own pulse, or something no one else can hear. The officers "chatted pleasantly, and smiled."
    topic_code: "4.D"
  - front: Three defensible readings of the final heartbeat
    back: |
      1) A hallucination of guilt; 2) the narrator's own heart, pounding under stress and misattributed; 3) a supernatural sign. Readings 1 and 2 are best supported, since the officers show no sign of hearing anything. Strong essays weigh them rather than asserting one as fact.
    topic_code: "4.D"
  - front: Gothic setting → in "The Tell-Tale Heart"
    back: |
      Midnight, a dark shuttered chamber, a lantern, a creaking hinge, a body under the boards. Poe compresses the Gothic castle into one room of an ordinary house, so the horror is psychological rather than architectural.
    topic_code: "2.B"
  - front: Four o'clock → setting and timing
    back: |
      He finishes concealing the body at four in the morning, while it is still as dark as midnight. The knock that follows at once moves the story from his private darkness to public scrutiny.
    topic_code: "2.B"
  - front: Unity of effect → Poe's theory of the short tale
    back: |
      In his 1842 review of Hawthorne's Twice-Told Tales, Poe argued that a tale should be short enough to read at a sitting and that every word should serve one preconceived effect. "The Tell-Tale Heart" is a working example: almost nothing in it is not about the eye, the heart or the narrator's mind.
    topic_code: "3.C"
  - front: Publication → "The Tell-Tale Heart"
    back: |
      First printed in The Pioneer (Boston), January 1843, a short-lived magazine edited by James Russell Lowell; revised for the Broadway Journal (1845). Poe's narrator is unnamed and his relation to the old man is never stated.
    topic_code: "4.A"
  - front: Imagery → as evidence against a narrator
    back: |
      A narrator chooses images, so images reveal his perspective. Here the most vivid images (the eye, the ray, the heartbeat) are exactly the obsessions the narrator cannot explain, which is why an essay on reliability should spend its time on them.
    topic_code: "5.D"
  - front: Auditory vs visual imagery → how the story's senses shift
    back: |
      The first half is ruled by sight (the eye, the ray of light); the second by sound (the groan, the heartbeat). The narrator destroys what he cannot bear to see and is undone by what he cannot stop hearing.
    topic_code: "5.D"
  - front: Ambiguity vs vagueness → a Row C distinction
    back: |
      Ambiguity is a deliberate openness the text sustains with evidence on more than one side (whose heartbeat?). Vagueness is a student's failure to commit. Sophistication comes from naming the ambiguity precisely and explaining what it does for the story.
    topic_code: "4.D"

quiz:
  description: |
    22 questions · about 35 minutes · about 70% on "The Tell-Tale Heart" (narrative reliability and imagery) and
    30% spiral review of point of view, plot sequence, comparison, allusion and thesis writing from earlier units.
    Opens with an eight-item set on the story's first three paragraphs. Multiple choice, select-all, true/false and
    fill-in-the-blank items are graded at once; the two short answers and the prose-analysis essay (6 points, AP
    rubric) are graded by your teacher.
  questions:
    - slug: u07-w22-q01
      type: multiple_choice
      topic_code: "4.D"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 1
      stimulus: &tth_opening |
        *The following passage is the opening of Edgar Allan Poe's "The Tell-Tale Heart" (1843).*

        TRUE! — nervous — very, very dreadfully nervous I had been and am; but why *will* you say that I am mad? The disease had sharpened my senses — not destroyed — not dulled them. Above all was the sense of hearing acute. I heard all things in the heaven and in the earth. I heard many things in hell. How, then, am I mad? Hearken! and observe how healthily — how calmly I can tell you the whole story.

        It is impossible to say how first the idea entered my brain; but once conceived, it haunted me day and night. Object there was none. Passion there was none. I loved the old man. He had never wronged me. He had never given me insult. For his gold I had no desire. I think it was his eye! yes, it was this! One of his eyes resembled that of a vulture — a pale blue eye, with a film over it. Whenever it fell upon me, my blood ran cold; and so by degrees — very gradually — I made up my mind to take the life of the old man, and thus rid myself of the eye forever.

        Now this is the point. You fancy me mad. Madmen know nothing. But you should have seen *me*. You should have seen how wisely I proceeded — with what caution — with what foresight — with what dissimulation I went to work!
      prompt: |
        In the first paragraph, the narrator's question "How, then, am I mad?" is undercut chiefly because
      options:
        - |
          the evidence he offers for his sanity, that he "heard many things in hell," is itself a sign of the disorder he denies
        - |
          he admits in the same paragraph that he has already been found guilty of a crime
        - |
          he speaks in the present tense, which shows he is inventing the story as he goes
        - |
          he refuses to describe the "disease" he mentions, so the reader cannot judge it
      option_explanations:
        - |
          Correct. The narrator's proof is a list of supernatural hearing, ending with hell, presented as a qualification. The reader judges the argument by its premises, and the premise is the symptom. This is the core reliability move of the story: the teller's own evidence testifies against him.
        - |
          Nothing in the first paragraph mentions a verdict. The listener has called him mad ("why will you say"), but no trial or guilt is stated. The answer imports information the passage does not give.
        - |
          The narration is retrospective ("I had been and am"; "I went to work"); only his self-description uses the present. The present tense is not evidence of invention; it shows he is still in the condition he describes.
        - |
          He does describe the disease: it "sharpened my senses," especially hearing. The problem is not silence about it but the conclusion he draws from it.
      answer: 0

    - slug: u07-w22-q02
      type: multiple_choice
      topic_code: "4.B"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 1
      stimulus: *tth_opening
      prompt: |
        The narrator's repeated address to "you" ("why *will* you say that I am mad?"; "You fancy me mad") primarily serves to
      options:
        - |
          establish the narration as a defence against a listener who has already judged him, which makes the reader weigh his account as evidence
        - |
          show that the narrator is writing a private diary he expects no one to read
        - |
          create intimacy between the narrator and a trusted friend who shares his view of the old man
        - |
          signal that the narrator is a third-person observer reporting another man's crime
      option_explanations:
        - |
          Correct. The second person casts the story as a rebuttal: the listener already "fancies" him mad, and every detail that follows is chosen to change that verdict. That positions the reader as a judge, which is exactly the stance from which unreliability becomes visible.
        - |
          A diary has no addressee to argue with. The insistent questions and imperatives ("Hearken! and observe") assume a present listener who disagrees.
        - |
          The listener disagrees with him ("why will you say that I am mad?"), so the relationship is adversarial, not confiding. Nothing suggests the listener shares any view of the old man.
        - |
          The narrator is first person and the agent of the crime ("I made up my mind to take the life of the old man"). Misidentifying the point of view misses the whole effect.
      answer: 0

    - slug: u07-w22-q03
      type: multiple_choice
      topic_code: "5.D"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 1
      stimulus: *tth_opening
      prompt: |
        In the second paragraph, the image of "a pale blue eye, with a film over it" functions primarily to
      options:
        - |
          give the narrator's obsession a concrete, physical object while revealing that the object is harmless, which exposes the disproportion of his response
        - |
          suggest that the old man is secretly evil and has been spying on the narrator
        - |
          provide a realistic medical diagnosis that explains why the old man must be killed
        - |
          establish the old man as the narrator's father through a shared physical trait
      option_explanations:
        - |
          Correct. The precise image (pale, blue, filmed: probably a cataract) is ordinary and pitiable, yet it makes the narrator's "blood ran cold." The gap between the mild image and the violent reaction is the evidence the reader uses to judge him.
        - |
          The narrator himself says "He had never wronged me." The vulture comparison is the narrator's projection, and the passage gives no evidence of the old man doing anything to him.
        - |
          A filmed eye may suggest a cataract, but the passage offers no diagnosis and nothing about an eye condition could justify murder. The answer accepts the narrator's logic instead of examining it.
        - |
          The relationship between the two men is never stated anywhere in the story. Readers sometimes speculate, but no shared trait is mentioned here.
      answer: 0

    - slug: u07-w22-q04
      type: multiple_choice
      topic_code: "5.B"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 1
      stimulus: *tth_opening
      prompt: |
        The series of short sentences beginning "Object there was none. Passion there was none." contributes to the passage chiefly by
      options:
        - |
          ruling out every ordinary motive in a calm, measured cadence, which leaves the eye as the only cause and so makes the act more irrational, not less
        - |
          suggesting that the narrator secretly wanted the old man's money after all
        - |
          slowing the plot so that the reader can learn the setting in detail
        - |
          showing that the narrator has recovered and now regrets what he did
      option_explanations:
        - |
          Correct. Each sentence closes off a motive (gain, anger, injury, insult, money). The cool rhythm is meant to show reason; its result is to remove reason from the act. The style argues one thing, the content proves another.
        - |
          "For his gold I had no desire" is the last item in the series, and nothing in the passage contradicts it. Reading a hidden motive here replaces the story's strangeness with a conventional crime.
        - |
          The sentences say nothing about setting; they concern motive. Their brevity speeds the reasoning, if anything.
        - |
          Regret appears nowhere. "I loved the old man" sits beside the plan to kill him without remorse, and the next paragraph boasts of his cleverness.
      answer: 0

    - slug: u07-w22-q05
      type: multi_select
      topic_code: "4.D"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 2
      partial_credit: true
      stimulus: *tth_opening
      prompt: |
        Which details in the passage give the reader reason to doubt the narrator's claim that he can tell the story "healthily" and "calmly"? Select all that apply.
      options:
        - |
          The exclamations and dashes that break up the very sentence in which he claims to be calm
        - |
          His offer of supernatural hearing, including things "in hell," as proof of soundness
        - |
          His statement "I loved the old man" placed beside his decision to kill him, with no attempt to reconcile the two
        - |
          His precise identification of the eye's colour as "pale blue"
      option_explanations:
        - |
          Correct. Form contradicts content: "Hearken! and observe how healthily — how calmly" is itself broken by exclamation and dashes. The syntax performs the agitation the words deny.
        - |
          Correct. A sound mind does not cite hearing hell as its credential. The evidence is a symptom, so the argument collapses on its own terms.
        - |
          Correct. Love and murderous resolve stand side by side without any explanation. The narrator seems not to notice the contradiction, which is a mark of an unreliable interpreter of his own mind.
        - |
          Precision about colour is not itself a sign of disorder; reliable narrators describe things precisely too. What matters is the disproportion between this mild detail and his violent reaction, not the detail itself.
      answer: [0, 1, 2]

    - slug: u07-w22-q06
      type: true_false
      topic_code: "4.D"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 1
      stimulus: *tth_opening
      prompt: |
        True or false: In this passage the narrator gives the old man's wealth as one of his reasons for the murder.
      answer: false
      explanation: |
        False. He says "For his gold I had no desire." He rules out profit, anger and injury and names only the eye. The absence of an ordinary motive is what makes his claim to sanity so hard to accept.

    - slug: u07-w22-q07
      type: multiple_choice
      topic_code: "3.A"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 1
      stimulus: *tth_opening
      prompt: |
        Which best describes how the opening orders the narrative?
      options:
        - |
          It begins after the events, with the narrator defending himself in the present, and then turns back ("Now this is the point") to recount the crime as proof
        - |
          It begins on the first of the seven nights and proceeds strictly forward without any reference to the narrator's present
        - |
          It opens with the discovery of the body by the police and then flashes back to childhood
        - |
          It alternates between the narrator's and the old man's points of view
      option_explanations:
        - |
          Correct. "I had been and am" places the speaker after the events; the paragraphs argue with a listener before the story proper begins. The frame of self-defence determines how every later event is selected and told.
        - |
          The first paragraph is entirely in the narrator's present ("why will you say that I am mad?"); the nights have not begun yet. The order is retrospective, not strictly chronological.
        - |
          The police do not appear until the end of the story, and there is no account of childhood. This confuses the story's closing scene with its opening.
        - |
          The old man never narrates. Everything, including his supposed feelings, reaches us through the single first-person speaker.
      answer: 0

    - slug: u07-w22-q08
      type: short_answer
      topic_code: "4.D"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 2
      stimulus: *tth_opening
      prompt: |
        In one to three sentences, explain how one specific choice of syntax or punctuation in the passage works against what the narrator says about himself.
      answer: |
        In "observe how healthily — how calmly I can tell you the whole story," the dash interrupts the sentence to restate "healthily" as "calmly," so the claim of calm is delivered in broken, insistent syntax. The form of the sentence performs the agitation its words deny, which tells the reader not to accept his self-description.
      explanation: |
        1 point: identifies a specific syntactic or punctuation choice with a quotation or exact reference (the dashes, the exclamations "TRUE!" and "Hearken!", the clipped series "Object there was none. Passion there was none.", the repeated "You should have seen").
        1 point: explains the contradiction between the form and the narrator's claim (calm, sanity, wisdom), and draws the consequence for reliability. A response that only labels the device ("he uses dashes") earns at most 1.

    - slug: u07-w22-q09
      type: multi_select
      topic_code: "5.D"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 2
      partial_credit: true
      prompt: |
        On each of the eight nights, the narrator opens his lantern so that "a single thin ray fell upon the vulture eye." Which of the following are defensible statements about the function of this image? Select all that apply.
      options:
        - |
          It isolates the eye from the rest of the man, mirroring the narrator's habit of treating the old man as "the eye" rather than as a person
        - |
          It suggests the narrator's control and precision, which he offers as proof of sanity
        - |
          It makes the narrator a kind of watcher, turning the eye he fears into the object of his own watching gaze
        - |
          It proves that the old man is awake on each of the eight nights
      option_explanations:
        - |
          Correct. The beam lights one point and leaves everything else in darkness, exactly as the narrator's mind does: "I could see nothing else of the old man's face or person." The image shows how he dehumanises his victim.
        - |
          Correct. The careful, slow opening of the lantern is part of his argument ("You should have seen how wisely I proceeded"). The image carries his intended meaning as well as the meaning the reader draws against him.
        - |
          Correct. The man who cannot bear to be looked at spends a week looking at a sleeping man in secret. The ray reverses the gaze, a defensible reading that adds complexity to the obsession.
        - |
          On the first seven nights the eye is closed and the old man asleep, which is why the narrator says he could not do the work. Only on the eighth night is the eye open.
      answer: [0, 1, 2]

    - slug: u07-w22-q10
      type: multiple_choice
      topic_code: "4.D"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 1
      prompt: |
        On the eighth night, hearing the old man's groan of terror, the narrator says: "I knew what the old man felt, and pitied him, although I chuckled at heart." This sentence most strongly suggests that
      options:
        - |
          the narrator understands the old man's terror from the inside, so his account of the victim's fear may also be a portrait of his own
        - |
          the narrator has decided not to kill the old man after all
        - |
          the old man has told the narrator exactly what he is feeling
        - |
          the narrator feels nothing but contempt for the old man
      option_explanations:
        - |
          Correct. Just before this he says he knew the groan well, because it had welled up in his own bosom on many nights. He reads the old man through himself, which is both a sign of empathy and a hint that the terror he describes is projected.
        - |
          He kills the old man shortly afterwards. Pity here does not alter his plan, which is part of the chilling effect.
        - |
          The old man speaks only once, to ask who is there. The narrator infers his feelings; he is not told them, so his "knowing" is itself interpretation.
        - |
          "Pitied him" contradicts pure contempt. The sentence holds pity and pleasure together, and missing that doubleness flattens the narrator into a simple villain.
      answer: 0

    - slug: u07-w22-q11
      type: multiple_choice
      topic_code: "6.A"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 1
      prompt: |
        Twice the narrator compares the heartbeat to "a low, dull, quick sound, such as a watch makes when enveloped in cotton." The simile is most effective because it
      options:
        - |
          joins the ideas of a muffled, hidden sound and of mechanical time running out, which suits both a heart under the floor and a narrator approaching exposure
        - |
          proves that the narrator owns an expensive pocket watch
        - |
          shows that the sound is loud and clearly audible to everyone in the room
        - |
          contrasts the narrator's warm feelings with the old man's coldness
      option_explanations:
        - |
          Correct. "Enveloped in cotton" means wrapped and stifled, like a heart under planks; a watch measures time, and the beat quickens as his time to be caught approaches. One image does both jobs, which is why Poe repeats it.
        - |
          The watch is the vehicle of a simile, not an object in the plot. Reading a simile literally is a common error.
        - |
          "Low" and "dull" say the opposite: a faint, muffled sound. Its audibility to anyone but the narrator is exactly what the ending leaves in doubt.
        - |
          The simile describes a sound, not the two men's feelings, and has nothing to do with warmth or coldness.
      answer: 0

    - slug: u07-w22-q12
      type: multiple_choice
      topic_code: "4.D"
      source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
      points: 1
      prompt: |
        At the end of the story the narrator hears the heartbeat grow louder while "the men chatted pleasantly, and smiled," and he concludes that "They heard! — they suspected! — they knew!" Which reading is best supported by the text?
      options:
        - |
          The officers' pleasant behaviour gives no sign that they hear anything, so the sound and their "mockery" most likely exist in the narrator's perception
        - |
          The officers clearly hear the dead man's heart and are only pretending not to
        - |
          The officers came because they already knew where the body was hidden
        - |
          The narrator realises that he imagined the sound and confesses calmly
      option_explanations:
        - |
          Correct. The only evidence for the officers' knowledge is the narrator's conclusion, and the narrated behaviour points the other way. A careful reader separates what is reported (chatting, smiling) from what is inferred (mockery).
        - |
          This accepts the narrator's inference as fact. The text reports pleasant chatting and smiling; nothing they do shows they hear anything.
        - |
          They came because a neighbour reported a shriek, and they were "satisfied" by his explanation. They had no knowledge of the body.
        - |
          He does not conclude the sound is imaginary; he screams that it is "the beating of his hideous heart." His confession is frantic, not calm.
      answer: 0

    - slug: u07-w22-q13
      type: multiple_choice
      topic_code: "6.D"
