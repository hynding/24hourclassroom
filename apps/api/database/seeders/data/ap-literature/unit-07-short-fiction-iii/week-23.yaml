week: 23
unit: 7
title: Change and Relationship in "Bartleby, the Scrivener"
topics: ["1.B", "1.D"]
texts:
  - author: Herman Melville
    title: "Bartleby, the Scrivener: A Story of Wall-Street"
    year: 1853
    url: https://www.gutenberg.org/ebooks/11231
guide: guides/week-23.md
guide_description: |
  Melville's lawyer-narrator and the copyist who "would prefer not to": what it means that one character changes
  and the other does not, and how an employer's charity, irritation and guilt complicate a relationship the law
  calls simple. Walls, the Dead Letter Office and the closing "Ah humanity!" as places where interpretations
  divide. Four close readings, a model argument paragraph, misreadings and self-check.
flashcards_description: |
  30 cards on the characters, the office, the story's turning points and key lines, and the skills of explaining
  change, stasis and relationships.

flashcards:
  - front: The narrator of "Bartleby" → who he is
    back: |
      An unnamed, "rather elderly" Wall Street lawyer who does "a snug business among rich men's bonds and mortgages and title-deeds" and holds the office of Master in Chancery. He believes "the easiest way of life is the best." He is both narrator and the character most changed by the story.
    topic_code: "1.B"
  - front: '"the easiest way of life is the best" → why it matters later'
    back: |
      The narrator's founding conviction. Bartleby is the one problem that cannot be handled the easy way; every later choice (tolerating, bribing, moving offices) tests whether the narrator will give up ease for responsibility.
    topic_code: "1.B"
  - front: Turkey, Nippers and Ginger Nut → the office before Bartleby
    back: |
      Turkey, an older copyist, works well in the morning and grows flushed and reckless after noon; Nippers, younger and ambitious, suffers indigestion in the morning and is calm after noon; Ginger Nut is the twelve-year-old office boy. Their comic, predictable eccentricities set off Bartleby's unpredictable one.
    topic_code: "1.C"
  - front: '"pallidly neat, pitiably respectable, incurably forlorn" → Bartleby''s first appearance'
    back: |
      Three adverb-adjective pairs in which the second word darkens the first. The narrator's first impression already contains pity and doom, which shapes how he (and we) read everything Bartleby later does.
    topic_code: "5.B"
  - front: '"I would prefer not to" → what kind of refusal'
    back: |
      Polite, conditional, without reason or hostility. It is not "I will not," so it cannot be met as defiance. The formula frustrates the narrator because it gives him nothing to argue with.
    topic_code: "1.D"
  - front: '"in a singularly mild, firm voice" → the first refusal'
    back: |
      Mild and firm at once: there is no anger to punish and no weakness to override. The narrator, expecting "instant compliance," is left without a response that fits the relationship he thought he had.
    topic_code: "1.D"
  - front: The bust of Cicero → comparison
    back: |
      The narrator says he would as soon have thought of turning his "pale plaster-of-paris bust of Cicero out of doors" as dismissing Bartleby. Bartleby becomes a statue, pale and inert; the irony is that Cicero was Rome's great orator and Bartleby barely speaks.
    topic_code: "6.B"
  - front: The green folding screen → relationship in space
    back: |
      The narrator places a screen around Bartleby's desk "which might entirely isolate Bartleby from my sight, though not remove him from my voice." The arrangement captures their relationship: command without contact.
    topic_code: "1.D"
  - front: Dead-wall reveries → setting and character
    back: |
      Bartleby stands at his window staring at the blank brick wall a few feet away, in "one of his profoundest dead-wall reveries." Walls (the office view, the screen, the Tombs) recur until he dies at the foot of one.
    topic_code: "2.C"
  - front: '"A Story of Wall-Street" → the subtitle'
    back: |
      Names the financial district and literalises it: the story is full of walls. It invites a reading in which Bartleby's refusal is a response to the walled, mechanical work of copying in a world of money.
    topic_code: "2.B"
  - front: The Sunday discovery → turning point for the narrator
    back: |
      Calling at his office on a Sunday, the narrator finds that Bartleby has been living there. He feels "for the first time in my life a feeling of overpowering stinging melancholy": the first real change in him.
    topic_code: "1.B"
  - front: '"For both I and Bartleby were sons of Adam" → the bond'
    back: |
      The narrator recognises "The bond of a common humanity" and calls his feeling "A fraternal melancholy." It is the high point of his sympathy, and the test is whether it survives practical inconvenience.
    topic_code: "1.D"
  - front: Marius among the ruins of Carthage → allusion
    back: |
      The narrator imagines Bartleby as "a sort of innocent and transformed Marius brooding among the ruins of Carthage": the exiled Roman general sitting in a ruined city. The allusion turns empty Wall Street on Sunday into a ruin and Bartleby into a fallen, solitary figure.
    topic_code: "6.D"
  - front: '"deserted as Petra" → Wall Street on Sunday'
    back: |
      Petra, the abandoned ancient city carved in rock. The simile makes the busiest street in America a dead city, and Bartleby its only inhabitant.
    topic_code: "6.A"
  - front: The word "prefer" spreads → function
    back: |
      Turkey, Nippers and the narrator begin using "prefer" without meaning to. The narrator admits he had "got into the way of involuntarily using this word." Bartleby changes others' speech while he himself never changes.
    topic_code: "1.D"
  - front: '"billeted upon me ... of an all-wise Providence" → the narrator''s resolve'
    back: |
      For a time he decides Bartleby has been sent to him by Providence and that his "mission in this world" is to give him office room. The resolution flatters the narrator and collapses when professional friends make "uncharitable remarks."
    topic_code: "1.B"
  - front: '"Nothing so aggravates an earnest person as a passive resistance"'
    back: |
      The narrator's own maxim. Passive resistance gives the person in power nothing to push against, which is why the employer's authority dissolves in the face of Bartleby's preference.
    topic_code: "1.D"
  - front: Moving offices → the narrator's solution
    back: |
      Unable to make Bartleby leave, the narrator moves his business elsewhere and leaves Bartleby in the old building. The easy way again: he avoids the problem rather than resolving it, and the new tenants have Bartleby removed.
    topic_code: "1.B"
  - front: '"I would prefer not to" vs "I know where I am" → Bartleby in the Tombs'
    back: |
      Arrested as a vagrant and held in the Tombs, New York's prison, Bartleby tells the visiting narrator "I know you," and "I want nothing to say to you," and refuses comfort. He remains the same to the end.
    topic_code: "1.B"
  - front: '"With kings and counselors" → allusion at Bartleby''s death'
    back: |
      Finding Bartleby dead in the prison yard, the narrator murmurs the phrase from Job 3, where Job wishes he had died at birth and lay at rest with kings and counselors of the earth. It grants Bartleby dignity and rest, and voices a despair the narrator can only borrow.
    topic_code: "6.D"
  - front: The Dead Letter Office rumour
    back: |
      Afterwards the narrator hears a report that Bartleby had been a clerk in the Dead Letter Office at Washington, removed by a change in the administration. He cannot verify it but builds an explanation on it: letters for the dead, burned unread.
    topic_code: "4.D"
  - front: '"Dead letters! does it not sound like dead men?"'
    back: |
      The narrator's interpretive leap. Letters that never reach their readers become an image of Bartleby, and perhaps of a humanity whose messages miss each other. The explanation consoles the narrator, which is a reason to read it carefully.
    topic_code: "5.C"
  - front: '"Ah Bartleby! Ah humanity!" → why critics disagree'
    back: |
      The last line can be read as the narrator's hard-won recognition of shared human misery, or as a sentimental generalisation that lets him move from a particular man he failed to an abstraction. The best essays explain how the text supports both.
    topic_code: "1.B"
  - front: Static character → function in "Bartleby"
    back: |
      Bartleby never changes and never explains himself. His fixity works like a mirror or a measuring line: the story's movement happens in the people around him, especially the narrator, as they try and fail to account for him.
    topic_code: "1.B"
  - front: Dynamic character → the narrator's change, measured
    back: |
      He moves from complacency to melancholy, charity, irritation, evasion, guilt and grief. The question for an essay is not whether he changes but how far, and whether the change ever becomes action.
    topic_code: "1.B"
  - front: Employer and employee → the relationship in law and in fact
    back: |
      In law it is a contract: copying for pay. In fact it becomes something the narrator cannot name: responsibility, kinship, burden. The story probes what one person owes another when the contract no longer holds.
    topic_code: "1.D"
  - front: Charity as self-interest → the narrator's admission
    back: |
      Early on the narrator says that befriending Bartleby will cost little and give him a "sweet morsel for my conscience." He is candid that his kindness serves himself, a complexity readers must weigh against his later grief.
    topic_code: "1.D"
  - front: Publication → "Bartleby, the Scrivener"
    back: |
      Published anonymously in Putnam's Monthly Magazine in November and December 1853; collected in Melville's The Piazza Tales (1856). It followed the commercial failure of Moby-Dick (1851) and Pierre (1852).
    topic_code: "2.B"
  - front: Scrivener → the job
    back: |
      A law-copyist who made fair copies of legal documents by hand and checked them word by word against the original with another clerk. The first refusal is to such a checking task, the most mechanical part of an already mechanical job.
    topic_code: "2.C"
  - front: Bartleby's alternatives → the jobs he is offered
    back: |
      Late in the story the narrator suggests clerking in a dry-goods store, bartending, collecting bills and travelling as a companion. Bartleby declines, saying he is "not particular" but likes to be stationary. The list shows the narrator still trying to solve him with work.
    topic_code: "1.D"

quiz:
  description: |
    22 questions · about 40 minutes · about 70% on "Bartleby, the Scrivener" (character change and stasis, and the
    nuances of the narrator's relationship with Bartleby) and 30% spiral review of reliability, imagery, setting,
    allusion and thesis writing. Opens with an eight-item set on the first refusal. Multiple choice, select-all,
    true/false and fill-in-the-blank items are graded at once; the two short answers and the literary-argument
    essay (6 points, AP rubric) are graded by your teacher.
  questions:
    - slug: u07-w23-q01
      type: multiple_choice
      topic_code: "1.D"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      stimulus: &bart_refusal |
        *In the following passage from Herman Melville's "Bartleby, the Scrivener: A Story of Wall-Street" (1853), the lawyer who narrates the story has, on Bartleby's third day of work, called him to help check a copy. The narrator is sitting with his head bent over the original and his hand held out with the copy, waiting.*

        In this very attitude did I sit when I called to him, rapidly stating what it was I wanted him to do—namely, to examine a small paper with me. Imagine my surprise, nay, my consternation, when without moving from his privacy, Bartleby in a singularly mild, firm voice, replied, "I would prefer not to."

        I sat awhile in perfect silence, rallying my stunned faculties. Immediately it occurred to me that my ears had deceived me, or Bartleby had entirely misunderstood my meaning. I repeated my request in the clearest tone I could assume. But in quite as clear a one came the previous reply, "I would prefer not to."

        "Prefer not to," echoed I, rising in high excitement, and crossing the room with a stride. "What do you mean? Are you moon-struck? I want you to help me compare this sheet here—take it," and I thrust it towards him.

        "I would prefer not to," said he.

        I looked at him steadfastly. His face was leanly composed; his gray eye dimly calm. Not a wrinkle of agitation rippled him. Had there been the least uneasiness, anger, impatience or impertinence in his manner; in other words, had there been any thing ordinarily human about him, doubtless I should have violently dismissed him from the premises. But as it was, I should have as soon thought of turning my pale plaster-of-paris bust of Cicero out of doors.
      prompt: |
        The passage suggests that the relationship between the narrator and Bartleby is unsettled chiefly because
      options:
        - |
          Bartleby's calm, polite refusal gives the employer no defiance to punish, so the authority the narrator assumed has nothing to act on
        - |
          Bartleby openly insults the narrator in front of the other clerks
        - |
          the narrator has always been afraid of his employees and never gives orders
        - |
          Bartleby explains that the task is beneath his skill as a copyist
      option_explanations:
        - |
          Correct. The narrator says that any "uneasiness, anger, impatience or impertinence" would have led him to dismiss Bartleby. The absence of these leaves the ordinary employer's response unavailable, so the relationship loses its rules.
        - |
          The refusal is "singularly mild," and no insult is spoken. The other clerks play no part in this passage.
        - |
          He expected "instant compliance" and is shocked into "consternation," which shows he is used to being obeyed. The answer contradicts his own account.
        - |
          Bartleby gives no reason at all. The absence of a reason is what makes the refusal so hard to answer.
      answer: 0

    - slug: u07-w23-q02
      type: multiple_choice
      topic_code: "5.B"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      stimulus: *bart_refusal
      prompt: |
        The phrase "a singularly mild, firm voice" (paragraph 1) contributes to the passage primarily by
      options:
        - |
          pairing gentleness with resolve, so the refusal can be neither dismissed as weakness nor punished as rebellion
        - |
          suggesting that Bartleby is about to lose his temper
        - |
          indicating that Bartleby is too shy to be heard clearly
        - |
          showing that the narrator admires Bartleby's singing voice
      option_explanations:
        - |
          Correct. "Mild" removes hostility, "firm" removes doubt, and "singularly" marks the combination as strange. The diction sets up the whole problem of the story: a refusal with no handle.
        - |
          "Mild" and "Not a wrinkle of agitation rippled him" show the opposite. Bartleby is never angry.
        - |
          The reply comes "in quite as clear a one" (tone) as the narrator's own. Bartleby is heard perfectly; the narrator only wishes he had misheard.
        - |
          "Voice" here means manner of speaking. Nothing in the passage concerns singing.
      answer: 0

    - slug: u07-w23-q03
      type: multiple_choice
      topic_code: "4.D"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      stimulus: *bart_refusal
      prompt: |
        In the final paragraph, the narrator's explanation of why he does not dismiss Bartleby is best described as
      options:
        - |
          a self-justification that presents his inaction as a reasonable response to Bartleby's strangeness, while also revealing that he cannot imagine a response outside ordinary rules
        - |
          an objective report that the reader has no reason to question
        - |
          a confession that he is legally forbidden to dismiss an employee
        - |
          evidence that he has already decided to make Bartleby his partner
      option_explanations:
        - |
          Correct. "Doubtless I should have violently dismissed him" is a hypothetical that flatters his firmness; the real point is that he does nothing. His reasoning tells us as much about his limits as about Bartleby.
        - |
          The narrator interprets as he reports ("had there been any thing ordinarily human about him"). Judging Bartleby less than "ordinarily human" is an interpretation a reader should weigh.
        - |
          No law is mentioned. His restraint is psychological, not legal.
        - |
          He returns to his desk and postpones the problem. Partnership is never considered.
      answer: 0

    - slug: u07-w23-q04
      type: multiple_choice
      topic_code: "6.B"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      stimulus: *bart_refusal
      prompt: |
        The comparison of Bartleby to the narrator's "pale plaster-of-paris bust of Cicero" is ironic chiefly because
      options:
        - |
          it likens a man who barely speaks to a statue of Rome's most famous orator, while treating him as an inert object the narrator cannot bring himself to remove
        - |
          Cicero was a Roman emperor who was overthrown by his clerks
        - |
          the bust is valuable, which shows that Bartleby is the best-paid copyist in the office
        - |
          it shows that Bartleby resembles Cicero in his love of argument
      option_explanations:
        - |
          Correct. Cicero stands for eloquence; Bartleby offers one formula. "Pale" and "plaster" also fix his pallor and immobility. The comparison works on two levels at once, which is what makes it ironic rather than simply descriptive.
        - |
          Cicero was a statesman, lawyer and orator, never emperor, and was killed on the orders of Mark Antony. The answer rests on a factual error.
        - |
          The bust is not described as valuable, and Bartleby's pay is never compared to anyone's.
        - |
          Bartleby never argues; he declines. The irony depends on the contrast, not a resemblance.
      answer: 0

    - slug: u07-w23-q05
      type: multi_select
      topic_code: "1.D"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 2
      partial_credit: true
      stimulus: *bart_refusal
      prompt: |
        Which details in the passage show the narrator's expected authority failing in practice? Select all that apply.
      options:
        - |
          He first assumes his "ears had deceived" him or that Bartleby misunderstood
        - |
          He repeats the request, then rises, crosses the room and thrusts the paper at Bartleby, and still receives the same reply
        - |
          After gazing at Bartleby he concludes he could no more turn him out than his bust of Cicero
        - |
          He calls Ginger Nut to deliver the paper instead
      option_explanations:
        - |
          Correct. He cannot at first accept that an order has been refused; the assumption of obedience runs so deep that he blames his ears.
        - |
          Correct. Each escalation (clearer tone, physical approach, the paper thrust forward) is an attempt to restore authority, and each meets the identical formula.
        - |
          Correct. The conclusion admits that dismissal, the employer's final power, has become unthinkable to him.
        - |
          Ginger Nut does not appear in this passage, and the narrator does not delegate the task here. The detail is invented.
      answer: [0, 1, 2]

    - slug: u07-w23-q06
      type: true_false
      topic_code: "1.D"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      stimulus: *bart_refusal
      prompt: |
        True or false: In this passage Bartleby explains why he will not examine the paper.
      answer: false
      explanation: |
        False. He says only "I would prefer not to," three times, and gives no reason. The lack of explanation is the engine of the story: the narrator, the other characters and the reader all try to supply one.

    - slug: u07-w23-q07
      type: fill_blank
      topic_code: "5.B"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      stimulus: *bart_refusal
      prompt: |
        Bartleby's reply, repeated three times in the passage, is "I would ____ not to."
      answer: ["prefer"]
      explanation: |
        Prefer. The verb states a preference, not a refusal ("I will not") or an inability ("I cannot"). Its softness is what disarms the narrator, and later the word spreads through the office.

    - slug: u07-w23-q08
      type: short_answer
      topic_code: "1.D"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 2
      stimulus: *bart_refusal
      prompt: |
        In one to three sentences, explain what the narrator's outburst "What do you mean? Are you moon-struck?" and what follows it reveal about his relationship with Bartleby.
      answer: |
        The narrator's questions try to turn the refusal into something he can classify (a misunderstanding or madness), because both would leave his authority intact. When Bartleby simply repeats himself and shows no agitation, the narrator has no category left, and he retreats into the comparison with a statue, which shows a relationship in which the employer's power depends on the employee's cooperation.
      explanation: |
        1 point: explains what the questions attempt (to find a reason, to label Bartleby as confused or mad, to reassert authority).
        1 point: explains what the result reveals about the relationship (the narrator's authority rests on obedience; Bartleby's calm leaves him without recourse; the turn to the statue image). Paraphrase of events without interpretation earns at most 1.

    - slug: u07-w23-q09
      type: multiple_choice
      topic_code: "1.B"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      prompt: |
        Bartleby says some form of "I would prefer not to" from his third day in the office until he is in the Tombs, and he never gives a reason. The most important function of his remaining unchanged is that
      options:
        - |
          his fixity becomes the fixed point against which the narrator's shifting responses (indulgence, pity, anger, flight, grief) can be measured
        - |
          it shows that Melville did not know how to develop a character
        - |
          it proves that Bartleby is the story's narrator in disguise
        - |
          it allows the plot to end happily when Bartleby finally agrees to work
      option_explanations:
        - |
          Correct. A static character can be a measuring line. Because Bartleby does not move, every change in the story belongs to the people around him, especially the narrator, whose changes are the real subject.
        - |
          Stasis is a deliberate choice; Melville builds the whole design on it. Calling a function a flaw avoids analysing it.
        - |
          The lawyer narrates in the first person throughout. Bartleby barely speaks.
        - |
          Bartleby never agrees to work again; he dies in prison. The ending is anything but happy.
      answer: 0

    - slug: u07-w23-q10
      type: multiple_choice
      topic_code: "1.B"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      prompt: |
        Which statement best describes how the narrator changes over the course of the story?
      options:
        - |
          He moves from complacent ease to genuine fellow-feeling, but the feeling repeatedly stops short of costly action, so his change is real yet incomplete
        - |
          He becomes harsher and finally has Bartleby arrested himself
        - |
          He does not change at all; he feels exactly the same about Bartleby at the end as at the beginning
        - |
          He gives up the law and devotes his life to the poor
      option_explanations:
        - |
          Correct. The Sunday discovery gives him "a fraternal melancholy," and he later offers Bartleby his home. Yet he also moves offices to escape him. The change is in feeling and understanding more than in conduct, and essays earn depth by weighing both.
        - |
          The new tenants and landlord have Bartleby removed, not the narrator, who visits him in the Tombs and pays for his food.
        - |
          His "stinging melancholy," his offer of a home and his closing exclamation show a man altered, whatever the limits of the alteration.
        - |
          Nothing indicates he leaves his profession. He ends the story as he began, a lawyer, which is part of why his change can be questioned.
      answer: 0

    - slug: u07-w23-q11
      type: multi_select
      topic_code: "1.B"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 2
      partial_credit: true
      prompt: |
        Which of the following moments can be used as evidence that the narrator changes, at least for a time? Select all that apply.
      options:
        - |
          On the Sunday he discovers Bartleby living in the office and feels "for the first time in my life a feeling of overpowering stinging melancholy."
        - |
          He decides Bartleby has been "billeted upon me" by Providence and that giving him office room is his mission.
        - |
          After the move, he offers to take Bartleby to his own home.
        - |
          In the opening pages he says he is "a rather elderly man" with an easy, snug business.
      option_explanations:
        - |
          Correct. "For the first time in my life" marks the moment explicitly as new; the complacent man of the opening feels a bond he had not felt before.
        - |
          Correct. However short-lived, the resolution is a change from treating Bartleby as a problem of management to treating him as a moral charge.
        - |
          Correct. An employer who once wanted to be rid of him now offers his own house, a step beyond any contract. That Bartleby declines does not cancel the change.
        - |
          This is the baseline the change is measured from, not evidence of change.
      answer: [0, 1, 2]

    - slug: u07-w23-q12
      type: multiple_choice
      topic_code: "2.B"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      prompt: |
        Review. The story is subtitled "A Story of Wall-Street." The office windows face a white light-shaft on one side and a blackened brick wall on the other; Bartleby falls into "dead-wall reveries"; he is screened off from the narrator; and he dies in the prison yard at the foot of a wall. The most defensible function of this setting is to
      options:
        - |
          turn the financial district's name into a pattern of literal walls, connecting Bartleby's withdrawal to a world of enclosure, blocked views and mechanical work
        - |
          give the reader an accurate map of lower Manhattan for historical study
        - |
          suggest that Bartleby is a builder who dislikes poor brickwork
        - |
          provide comic relief from the narrator's legal business
      option_explanations:
        - |
          Correct. The recurring walls make setting into meaning. Whether you read Bartleby's refusal as a protest, a despair or an illness, the walls give it a physical world to answer to.
        - |
          The story gives almost no street-level detail; the walls are chosen for what they suggest, not for mapping.
        - |
          This reads a pattern of imagery as a plot fact. Bartleby is a copyist and never discusses building.
        - |
          The comedy of the story comes from Turkey and Nippers, not from the walls, which grow more oppressive as it goes on.
      answer: 0

    - slug: u07-w23-q13
      type: multiple_choice
      topic_code: "6.D"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      prompt: |
        Review. Discovering that Bartleby lives in the empty office, the narrator calls him "a sort of innocent and transformed Marius brooding among the ruins of Carthage!" The allusion functions chiefly to
      options:
        - |
          cast Bartleby as a fallen, exiled figure in a ruined city, so that deserted Sunday Wall Street becomes a ruin and his solitude takes on tragic grandeur
        - |
          reveal that Bartleby is a soldier who once fought in North Africa
        - |
          suggest that the narrator plans to destroy his own office building
        - |
          compare Bartleby to a cheerful hero celebrating a victory
      option_explanations:
        - |
          Correct. Gaius Marius, the Roman general driven into exile, was famously pictured sitting among Carthage's ruins. The allusion elevates the copyist and transforms the street around him, though "innocent" separates him from the general's guilt.
        - |
          Allusion works by comparison, not biography. Nothing in the story gives Bartleby a military past.
        - |
          The ruin is figurative: an empty street on Sunday. No destruction is planned.
        - |
          Marius in Carthage is an image of defeat and brooding, not celebration. The narrator says "brooding."
      answer: 0

    - slug: u07-w23-q14
      type: multiple_choice
      topic_code: "4.D"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 1
      prompt: |
        Review. After Bartleby's death the narrator relates "a vague report" that Bartleby had been a clerk in the Dead Letter Office at Washington, and he builds an interpretation on it ("Dead letters! does it not sound like dead men?"). A careful reader should treat this explanation as
      options:
        - |
          an unconfirmed rumour that the narrator, needing to understand Bartleby, turns into a meaning that partly consoles him, so it reveals the narrator at least as much as it explains Bartleby
        - |
          a proven fact that fully explains Bartleby's behaviour
        - |
          a lie that the narrator invents to frighten the reader
        - |
          irrelevant, since it appears after the story is over
      option_explanations:
        - |
          Correct. The narrator says he cannot vouch for the report, yet he develops it into an eloquent image. Reliability here concerns interpretation: the explanation may be true, but its appeal to him is evidence of his need to have one.
        - |
          The narrator himself presents it as a report he could not confirm. Treating it as proof overlooks his own caution.
        - |
          Nothing suggests invention or a wish to frighten. The issue is the weight he places on a rumour, not deceit.
        - |
          It is the story's last paragraph and closes on "Ah humanity!", so it shapes how the whole story is understood.
      answer: 0

