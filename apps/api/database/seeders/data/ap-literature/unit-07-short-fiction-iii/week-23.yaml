    - slug: u07-w23-q21
      type: short_answer
      topic_code: "7.B"
      source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
      points: 2
      prompt: |
        Review. Write a defensible thesis (one or two sentences) that takes a position on how far the narrator of "Bartleby" changes, and why that matters to the story's meaning. Your thesis should establish a line of reasoning.
      answer: |
        The narrator's change is real but stops at the threshold of sacrifice: Bartleby's refusal teaches a complacent lawyer to feel "the bond of a common humanity," yet each time that feeling asks him to give up his ease he chooses a gentler evasion, so that Melville makes the gap between sympathy and responsibility the story's true subject.
      explanation: |
        1 point: a defensible claim about the degree or kind of change (not "the narrator changes a lot" without qualification, and not a plot summary).
        1 point: a line of reasoning that connects the change to meaning (sympathy versus action; ease versus responsibility; the narrator's need to explain Bartleby). A thesis that names a topic but no claim earns 0.

    - slug: u07-w23-q22
      type: long_answer
      topic_code: "1.B"
      source: general knowledge
      points: 6
      prompt: |
        In many works of literature, a character who refuses to change exposes the changes, compromises or failures of the people around them. Either from your own reading or from the list below, choose a work of fiction in which a character remains essentially unchanged. Then, in a well-written essay, analyze how that character's constancy contributes to an interpretation of the work as a whole.

        Suggested works: "Bartleby, the Scrivener" (Melville); Hamlet (Shakespeare); Frankenstein (Mary Shelley); "Young Goodman Brown" (Hawthorne); "Miss Brill" (Mansfield); The Great Gatsby (Fitzgerald); A Doll's House (Ibsen); "The Wife of His Youth" (Chesnutt). You may select a work not listed if it is of comparable literary merit.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Provide evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Sample approach using "Bartleby": Bartleby's unwavering preference not to works as a mirror held up to the narrator, so that the story's meaning lies in the lawyer's shifting responses rather than in the scrivener's mystery; Melville uses a character who will not move to show how far a decent man will move, and where he stops.

        Line of reasoning: (1) The first refusal, "in a singularly mild, firm voice," removes the employer's power: there is nothing to punish, so the narrator must respond as a person rather than a boss. (2) The Sunday discovery transforms the narrator ("For the first time in my life a feeling of overpowering stinging melancholy"; "sons of Adam"), and Bartleby's unchanged presence turns that feeling into a test. (3) The narrator's retreat, moving his offices, shows the limit of his change; Bartleby's arrest and death follow from it. (4) The ending, "Ah Bartleby! Ah humanity!", converts a particular failure into a universal lament, both a widening of sympathy and an escape into abstraction.

        Sophistication: considers why Bartleby's motives are withheld (so that every explanation, including the Dead Letter Office rumour, reveals its maker), or places the story's question of what we owe to those who will not help themselves in its Wall Street context.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis that explains how the unchanged character contributes to an interpretation of the work as a whole. A thesis that only says the character does not change, or only summarises, earns 0.

        Row B Evidence and Commentary (0-4):
        4: specific, relevant evidence from across the work (key scenes, lines, turning points) and consistent commentary explaining how the character's constancy exposes change or failure in others and how that builds the interpretation.
        3: specific evidence supporting a line of reasoning, with commentary that explains some but not all of it, or is uneven.
        2: mostly general evidence or plot summary, with commentary that repeats rather than explains.
        1: evidence that is irrelevant or merely listed, with little commentary.
        0: no relevant evidence.

        Row C Sophistication (0-1): 1 point for complexity, for example explaining tensions (the constant character as both victim and mirror; change that is real but incomplete), situating the work in a broader context, accounting for alternative interpretations, or a consistently vivid and persuasive style.
