      explanation: |
        True. Unable to make Bartleby go, he goes himself. The sequence matters: his evasion leads directly to the new tenants' complaints, Bartleby's arrest as a vagrant and his death in the Tombs, so the "easy" solution has consequences the narrator must later face.

