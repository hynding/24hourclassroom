    - slug: u07-w24-q21
      type: short_answer
      topic_code: "7.C"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 3
      prompt: |
        Review. Here is a thesis: "Chesnutt uses the symbols of Ryder's world (blue veins, a book of Tennyson, a mirror) to show that the color line runs through his own heart before it runs through his society." Choose ONE piece of evidence from the story and write two or three sentences of commentary that explain how it supports this thesis.
      answer: |
        Ryder rejects "O sweet pale Margaret" only because Mrs. Dixon is "of a rather ruddy complexion," so even his choice of verse is governed by a scale of paleness. The detail shows that the Blue Veins' standard is not something imposed on Ryder from outside but a habit of his own imagination, which is why Liza Jane's arrival, straight after the Tennyson, forces him to confront himself rather than his society.
      explanation: |
        1 point: selects a specific, relevant piece of evidence (quoted or precisely referenced).
        1 point: explains how the evidence connects to the thesis's claim (the colour line as internal to Ryder).
        1 point: commentary goes beyond restatement to develop the line of reasoning (for instance, connecting the evidence to Ryder's later choice, or explaining what the symbol lets Chesnutt show indirectly). Summary without explanation earns at most 1.

    - slug: u07-w24-q22
      type: long_answer
      topic_code: "5.C"
      source: general knowledge
      points: 6
      prompt: |
        In many works of literature, an object or physical detail becomes a symbol whose meaning changes as the work develops. Either from your own reading or from the list below, choose a work of fiction or drama in which such a symbol is important. Then, in a well-written essay, analyze how the symbol and the changes in its meaning contribute to an interpretation of the work as a whole.

        Suggested works: "The Wife of His Youth" (Chesnutt); "The Tell-Tale Heart" (Poe); "Bartleby, the Scrivener" (Melville); "The Yellow Wall-Paper" (Gilman); "The Necklace" (Maupassant); Hamlet (Shakespeare); The Great Gatsby (Fitzgerald); A Doll's House (Ibsen). You may select a work not listed if it is of comparable literary merit.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Provide evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Sample approach using "The Wife of His Youth": the story's central symbol is "blue veins," which begins as a gibe, becomes the Blue Veins' badge of social rank, and is finally emptied of meaning when Ryder honours a woman who could never pass its test; Chesnutt uses the changing symbol to argue that worth measured by colour gives way to worth measured by fidelity.

        Line of reasoning: (1) Origin: the name comes from "some envious outsider" and is adopted by those excluded; the narrator's irony ("pretentious") shows a symbol whose meaning is contested from the start. (2) Ryder's internalisation: his speech ("ground between the upper and the nether millstone"; "a backward step") and his search through Tennyson for a "pale" heroine show the symbol governing his values and desires. (3) Counter-symbol: Liza Jane's daguerreotype preserves a bond outside that scale, and the mirror marks Ryder's reckoning with it. (4) Reversal: at the ball, before the Blue Veins, he presents "the wife of my youth"; the society's own judgment ("He should have acknowledged her") overrides its colour line.

        Sophistication: places the symbol in the history of colorism and of slave marriages without legal standing, or weighs whether the ending transforms the society or only one man.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis that explains how a symbol and its changing meaning contribute to an interpretation of the work. Naming a symbol and saying what it "represents," with no claim about change or the whole work, earns 0.

        Row B Evidence and Commentary (0-4):
        4: specific evidence that traces the symbol at several points (introduction, development, turn), with commentary that explains each shift in meaning and connects it to the interpretation.
        3: specific evidence and a line of reasoning, with commentary that is uneven or does not fully explain the change in meaning.
        2: mostly general evidence or summary, with commentary that repeats the thesis or lists what the symbol "means" without explaining how.
        1: evidence that is irrelevant or merely listed.
        0: no relevant evidence.

        Row C Sophistication (0-1): 1 point for complexity, for example explaining tensions in the symbol (mockery and badge; ideal and prejudice), placing it in its historical context accurately, weighing alternative interpretations of the ending, or a consistently vivid, persuasive style.
