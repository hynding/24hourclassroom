week: 24
unit: 7
title: Symbol and Setting in "The Wife of His Youth"
topics: ["5.C", "2.C"]
texts:
  - author: Charles W. Chesnutt
    title: The Wife of His Youth
    year: 1898
    url: https://www.gutenberg.org/ebooks/11057
guide: guides/week-24.md
guide_description: |
  Chesnutt's story of Mr. Ryder, the Blue Vein Society and the woman who arrives from his past: how symbols (blue
  veins, a book of Tennyson, a faded daguerreotype, a mirror) carry the story's argument about the color line,
  and how a Northern city and a remembered plantation define who Ryder is. Historical context on colorism,
  slavery and marriage after emancipation; four close readings; model paragraph; misreadings; self-check.
flashcards_description: |
  30 cards on the story's people, symbols, settings, allusions and history, and on explaining a symbol's function.

flashcards:
  - front: Mr. Ryder → who he is at the start
    back: |
      A respected member of Groveland's Black community, "the dean of the Blue Veins," a stationery clerk for a railroad company who rose from messenger, and a reader of English poetry. He plans to propose to Mrs. Molly Dixon at the ball he is giving in her honour.
    topic_code: "2.C"
  - front: The Blue Vein Society → what it was
    back: |
      A small society of "colored persons" in a Northern city after the Civil War, formed to "establish and maintain correct social standards." Its members were mostly light-skinned, which gave rise to the nickname.
    topic_code: "5.C"
  - front: Blue veins → the symbol
    back: |
      Veins visible through skin, a physical detail turned into a social credential: the joke that members had to be "white enough to show blue veins." The symbol exposes a hierarchy of colour inside the Black community, and Chesnutt treats it with irony.
    hint: Who first made the "blue veins" suggestion?
    topic_code: "5.C"
  - front: Who named the Blue Veins?
    back: |
      "Some envious outsider" suggested the test; the name was "readily adopted by those who were not of the favored few." The symbol begins as mockery from outside the circle, which shows the narrator's ironic distance from the society.
    topic_code: "5.C"
  - front: Colorism → the historical term
    back: |
      Prejudice based on skin tone, including within a racial group. After the Civil War some elite Black social circles in Northern cities were associated with lighter skin and earlier freedom. Chesnutt, himself of mixed ancestry, writes about this from inside the community.
    topic_code: "2.C"
  - front: '"ground between the upper and the nether millstone" → Ryder''s metaphor'
    back: |
      Ryder pictures people of mixed ancestry crushed between two stones, the white race above and the Black race below. The metaphor reveals his sense of precarious status and the hierarchy he accepts even while claiming to have "no race prejudice."
    topic_code: "6.B"
  - front: '"With malice towards none, with charity for all" → Ryder''s use of Lincoln'
    back: |
      Ryder quotes Lincoln's Second Inaugural Address (1865), a plea for national reconciliation, to justify keeping darker people at a distance. The irony is that he borrows words of inclusion to defend exclusion.
    topic_code: "6.D"
  - front: '"Self-preservation is the first law of nature" → what it reveals'
    back: |
      Ryder ends his speech by turning social exclusion into a law of survival. The proverb makes his choice sound inevitable, which is exactly what the arrival of Liza Jane will test.
    topic_code: "1.E"
  - front: Groveland → the setting
    back: |
      A Northern city where Ryder has made his life and reputation; generally taken as modelled on Cleveland, where Chesnutt lived. It stands for a new life after slavery, with its own social ladder.
    topic_code: "2.C"
  - front: '"a pillar of cloud by day and of fire by night" → allusion'
    back: |
      The Blue Veins see themselves as such a pillar "to guide their people through the social wilderness": an allusion to God leading the Israelites in Exodus. The grand self-image is gently ironic, since they guide by excluding.
    topic_code: "6.D"
  - front: Tennyson, "A Dream of Fair Women" → why Ryder reads it
    back: |
      Preparing his speech for the ball, Ryder searches the poem for lines to describe the ladies. He weighs "O sweet pale Margaret" and rejects it because Mrs. Dixon is "of a rather ruddy complexion." His reading is literally a search for an ideal of fair beauty.
    topic_code: "5.C"
  - front: '"A daughter of the gods, divinely tall, / And most divinely fair."'
    back: |
      The Tennyson lines Ryder reads just before Liza Jane appears. "Fair" means both beautiful and light-skinned, and the next woman he sees is small, old and very dark: the contrast is built into the scene.
    topic_code: "3.D"
  - front: Liza Jane → who she is
    back: |
      An old woman, "not five feet tall," who arrives at Ryder's door in a blue calico gown and an old bonnet, searching for her husband, Sam Taylor, whom she has sought for about twenty-five years.
    topic_code: "1.A"
  - front: '"a bit of the old plantation life, summoned up from the past by the wave of a magician''s wand"'
    back: |
      The narrator's description of Liza Jane at Ryder's door. The past arrives in the present of a Northern parlour; the "magician's wand" links her appearance to the poet's fancy Ryder has just been reading.
    topic_code: "2.C"
  - front: Sam Taylor → Liza Jane's story
    back: |
      Free-born, but bound as an apprentice to her master. When she learned the master meant to sell him into slavery she warned him and he escaped. She was whipped and sold down the river, deeper into the South.
    topic_code: "3.A"
  - front: The daguerreotype → symbol
    back: |
      Liza Jane carries a faded daguerreotype of her husband in a black case on a string around her neck. It is the past preserved, fidelity worn against the heart, and a picture of a young man she would no longer recognise in Mr. Ryder.
    topic_code: "5.C"
  - front: '"I ''d know ''im ''mongs'' a hund''ed men." → irony'
    back: |
      Liza Jane's confidence that she would know her husband anywhere is dramatic irony: she is speaking to him and does not know him. Her faithfulness to the man he was contrasts with his distance from it.
    topic_code: "5.C"
  - front: The mirror → symbol
    back: |
      After she leaves, Ryder stands "for a long time before the mirror of his dressing-case, gazing thoughtfully at the reflection of his own face." The mirror is the moment of private self-recognition before public acknowledgment.
    topic_code: "5.C"
  - front: Slave marriages and the law
    back: |
      Marriages between enslaved people had no legal standing in the slave states; after emancipation some states recognised such unions only if the couple were living together or registered them. Ryder raises this point to Liza Jane; the story's ending sets moral obligation above legal technicality.
    topic_code: "2.C"
  - front: Searching after emancipation → historical context
    back: |
      After the Civil War thousands of freed people searched for spouses, parents and children separated by sale, through churches, the Freedmen's Bureau and newspaper notices. Liza Jane's twenty-five-year search reflects a real and common experience.
    topic_code: "2.C"
  - front: The toast to "The Ladies" → Ryder's choice
    back: |
      Asked to answer the toast, Ryder tells Liza Jane's story as a hypothetical about a man who could stay hidden, and asks what he should do. The guests, led by Mrs. Dixon, say he should acknowledge her.
    topic_code: "3.B"
  - front: '"He should have acknowledged her."'
    back: |
      Mrs. Dixon's answer, echoed by the guests. The community's own standard of honour, spoken before they know the case is real, binds Ryder and turns the ball into a public judgment.
    topic_code: "1.D"
  - front: '"Permit me to introduce to you the wife of my youth."'
    back: |
      Ryder's last line. The man who planned to marry a fair, educated widow presents an old, dark, unlettered woman as his wife before the Blue Veins. The change is total, and public.
    topic_code: "1.B"
  - front: The title → biblical echo
    back: |
      "The wife of thy youth" is a phrase of the King James Bible (Proverbs 5:18; Malachi 2:14-15, where God warns against dealing treacherously with her). The title frames Ryder's choice as covenant faithfulness rather than social calculation.
    topic_code: "6.D"
  - front: Polonius in Ryder's speech
    back: |
      At the ball Ryder quotes "This above all: to thine own self be true," without naming the source. Advice from Hamlet's most self-serving counsellor becomes, in Ryder's mouth, the principle that obliges him to give up what he wanted.
    topic_code: "6.D"
  - front: '"She was whiter than he, and better educated." → Mrs. Dixon'
    back: |
      The narrator's flat sentence on Mrs. Molly Dixon, the widow from Washington Ryder means to marry. It shows what a match with her would mean on the Blue Veins' own scale: a step up.
    topic_code: "5.C"
  - front: Chesnutt's narrator → perspective
    back: |
      Third-person, mostly limited to Ryder, with a dry irony toward the Blue Veins. It withholds Ryder's recognition of Liza Jane until the toast, so the reader experiences the choice before learning its full cost.
    topic_code: "4.B"
  - front: Publication → "The Wife of His Youth"
    back: |
      Atlantic Monthly, July 1898; title story of The Wife of His Youth and Other Stories of the Color Line (1899). Charles W. Chesnutt (1858-1932), born in Cleveland and raised in North Carolina, was among the first African American writers of fiction published widely by the major literary magazines.
    topic_code: "2.B"
  - front: Symbol → how to explain one (Unit 7 method)
    back: |
      1) Literal object or detail; 2) what it comes to stand for, with the textual signal (repetition, emphasis, a character's attention); 3) how its meaning changes; 4) what it lets the story say that plain statement could not. Blue veins: skin, credential, prejudice, irony.
    topic_code: "5.C"
  - front: Character and setting → how to describe the relationship
    back: |
      Ask what the setting offers the character, what it demands of him, and how he changes in response. Groveland offers Ryder status; the Blue Veins demand distance from the plantation past; Liza Jane brings that past to his door, and he chooses.
    topic_code: "2.C"

quiz:
  description: |
    22 questions · about 40 minutes · about 70% on "The Wife of His Youth" (symbol, and the relationship between
    character and setting) and 30% spiral review of perspective, allusion, contrast, character change and
    commentary. Opens with an eight-item set on the Blue Vein Society and Mr. Ryder's views. Multiple choice,
    select-all, true/false and fill-in-the-blank items are graded at once; the two short answers and the
    literary-argument essay (6 points, AP rubric) are graded by your teacher.
  questions:
    - slug: u07-w24-q01
      type: multiple_choice
      topic_code: "5.C"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      stimulus: &wife_blueveins |
        *The following passages are from the opening section of Charles W. Chesnutt's "The Wife of His Youth" (1898). Mr. Ryder, a member of the Black community of a Northern city called Groveland, is about to give a ball.*

        Mr. Ryder might aptly be called the dean of the Blue Veins. The original Blue Veins were a little society of colored persons organized in a certain Northern city shortly after the war. Its purpose was to establish and maintain correct social standards among a people whose social condition presented almost unlimited room for improvement. By accident, combined perhaps with some natural affinity, the society consisted of individuals who were, generally speaking, more white than black. Some envious outsider made the suggestion that no one was eligible for membership who was not white enough to show blue veins. The suggestion was readily adopted by those who were not of the favored few, and since that time the society, though possessing a longer and more pretentious name, had been known far and wide as the "Blue Vein Society," and its members as the "Blue Veins."

        [...]

        "I have no race prejudice," he would say, "but we people of mixed blood are ground between the upper and the nether millstone. Our fate lies between absorption by the white race and extinction in the black. The one does n't want us yet, but may take us in time. The other would welcome us, but it would be for us a backward step. 'With malice towards none, with charity for all,' we must do the best we can for ourselves and those who are to follow us. Self-preservation is the first law of nature."
      prompt: |
        In the first paragraph, "blue veins" functions as a symbol primarily of
      options:
        - |
          a hierarchy of skin colour within the Black community, a bodily detail turned into a social credential
        - |
          the members' devotion to the Union army, whose uniforms were blue
        - |
          poor health caused by the members' hard physical labour
        - |
          the society's commitment to admitting anyone regardless of appearance
      option_explanations:
        - |
          Correct. Veins show through light skin; the joke makes visibility of veins the test of belonging. The symbol condenses colorism into one physical image, which is why the nickname sticks.
        - |
          The passage links the name to skin ("white enough to show blue veins"), not to uniforms. Reading the colour as political misses the stated origin.
        - |
          Nothing in the passage concerns health or labour; the members are presented as a social elite.
        - |
          The opposite: the suggestion was "that no one was eligible for membership who was not white enough." The symbol marks exclusion.
      answer: 0

    - slug: u07-w24-q02
      type: multiple_choice
      topic_code: "4.C"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      stimulus: *wife_blueveins
      prompt: |
        The narrator's remarks that the society had "a longer and more pretentious name" and that its members were alike "By accident, combined perhaps with some natural affinity" reveal a perspective best described as
      options:
        - |
          gently ironic: the narrator reports the society's account of itself while letting its exclusiveness show through
        - |
          openly hostile, condemning the members as enemies of their race
        - |
          wholly admiring, presenting the society as a model all readers should copy
        - |
          confused, unsure whether the society existed
      option_explanations:
        - |
          Correct. "By accident ... perhaps" mimics the members' own excuse while hinting that it is not accidental at all, and "pretentious" punctures their dignity. The irony is light enough to keep sympathy for Ryder possible.
        - |
          The tone is wry, not denunciatory; nothing calls the members enemies. Overstating the satire misses the story's balance.
        - |
          "Pretentious" and "envious outsider" are not admiring. The narrator keeps a critical distance.
        - |
          The narrator speaks with confident specificity about the society's origin, purpose and name.
      answer: 0

    - slug: u07-w24-q03
      type: multiple_choice
      topic_code: "2.C"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      stimulus: *wife_blueveins
      prompt: |
        The first paragraph places the Blue Veins in "a certain Northern city shortly after the war." This setting is significant to Ryder's character chiefly because it
      options:
        - |
          presents a new post-emancipation society with its own ladder of status, on which Ryder has climbed to the top and has much to lose
        - |
          shows that Ryder still lives on the plantation where he was born
        - |
          establishes that the story takes place before the Civil War
        - |
          suggests that Ryder has no connection to any community at all
      option_explanations:
        - |
          Correct. The Northern city after the war is a place of reinvention, where standards are "established" rather than inherited. Ryder's status as "dean" belongs to that setting, and his choice later depends on what the setting has given him.
        - |
          The setting is a Northern city, not a plantation; the plantation appears only as a past that Liza Jane brings with her.
        - |
          "Shortly after the war" names the society's founding; the story's present is later still.
        - |
          He is "the dean" of a society, the opposite of isolated.
      answer: 0

    - slug: u07-w24-q04
      type: multiple_choice
      topic_code: "6.D"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      stimulus: *wife_blueveins
      prompt: |
        Ryder quotes Lincoln's Second Inaugural Address, "With malice towards none, with charity for all." In context, the allusion is ironic chiefly because
      options:
        - |
          words that urged national reconciliation and inclusion are used to justify keeping darker-skinned people at a distance
        - |
          Lincoln was opposed to the abolition of slavery
        - |
          Ryder misquotes Lincoln so badly that no one recognises the line
        - |
          Lincoln said these words about the Blue Vein Society itself
      option_explanations:
        - |
          Correct. Ryder borrows the language of charity to support a "backward step" he refuses to take. The gap between the allusion's meaning and its use shows the contradiction in his position.
        - |
          The Second Inaugural (March 1865) came after the Emancipation Proclamation and Lincoln's support for the Thirteenth Amendment. The answer rests on a historical error.
        - |
          The quotation is recognisable and accurate in substance; the irony lies in its application, not in a misquotation.
        - |
          Lincoln was speaking to the nation at the end of the war. The society is fictional.
      answer: 0

    - slug: u07-w24-q05
      type: multi_select
      topic_code: "1.E"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 2
      partial_credit: true
      stimulus: *wife_blueveins
      prompt: |
        Which statements about Ryder are supported by his speech in the second excerpt? Select all that apply.
      options:
        - |
          He disclaims prejudice and then immediately qualifies the claim with "but."
        - |
          He presents distance from darker people as a matter of survival rather than preference.
        - |
          He imagines that acceptance by white society may come "in time."
        - |
          He calls for political protest to win equal rights for all Black Americans.
      option_explanations:
        - |
          Correct. "I have no race prejudice ... but" is the classic shape of a disclaimer undone by its own sentence. His speech reveals a complexity he does not see.
        - |
          Correct. He ends with "Self-preservation is the first law of nature," turning a social choice into a natural law.
        - |
          Correct. "The one does n't want us yet, but may take us in time" shows his hopes are pinned on absorption into the white world.
        - |
          He speaks of social standards and of his group's fate, not of political protest. Nothing in the speech calls for collective action.
      answer: [0, 1, 2]

    - slug: u07-w24-q06
      type: true_false
      topic_code: "5.C"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      stimulus: *wife_blueveins
      prompt: |
        True or false: According to the passage, the name "Blue Vein Society" was invented by the founding members to advertise their exclusiveness.
      answer: false
      explanation: |
        False. "Some envious outsider made the suggestion," and the name "was readily adopted by those who were not of the favored few." The symbol began as an outsider's gibe, and the society itself had "a longer and more pretentious name." Getting the origin right matters, because the irony depends on it.

    - slug: u07-w24-q07
      type: fill_blank
      topic_code: "6.B"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      stimulus: *wife_blueveins
      prompt: |
        Ryder says that people of mixed blood "are ground between the upper and the nether ____."
      answer: ["millstone"]
      explanation: |
        Millstone. The metaphor of two grinding stones casts Ryder's group as caught and crushed between races, and it also reveals that he thinks of the races as stacked, one "upper," one "nether."

    - slug: u07-w24-q08
      type: short_answer
      topic_code: "5.C"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 2
      stimulus: *wife_blueveins
      prompt: |
        In one to three sentences, explain how Chesnutt uses the "blue veins" symbol to comment on the society without stating a judgment directly.
      answer: |
        The blue veins are a physical trait that the society has turned, half-jokingly, into a qualification for belonging, so the symbol shows colour deciding worth inside a community that itself suffered from colour prejudice. Because the name comes from "some envious outsider" and the narrator calls the society's real name "pretentious," the symbol lets Chesnutt expose its exclusiveness through irony rather than open condemnation.
      explanation: |
        1 point: explains what the symbol stands for (skin colour as social credential; colorism within the Black community).
        1 point: explains how the symbol works as indirect commentary (its origin as an outsider's gibe; the narrator's ironic diction; the contradiction of prejudice within a group that suffers from prejudice). Naming the symbol without explaining its function earns at most 1.

    - slug: u07-w24-q09
      type: multiple_choice
      topic_code: "5.C"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      prompt: |
        Liza Jane carries a faded daguerreotype of her husband in a small case on a string around her neck. As a symbol, the daguerreotype most clearly represents
      options:
        - |
          her fidelity to the past and to the young man Sam once was, a fixed image that the present Mr. Ryder no longer resembles
        - |
          her wish to become a professional photographer in the North
        - |
          the wealth she has secretly saved during her search
        - |
          Ryder's pride in his own appearance
      option_explanations:
        - |
          Correct. A daguerreotype fixes one moment; worn against her heart, it holds Sam as he was before freedom and before Groveland. Its fading, and the gap between the image and the man before her, carry the story's concern with what time and status have changed.
        - |
          Nothing suggests any such ambition; the image is a keepsake, not a trade.
        - |
          The case holds a picture, not money. The symbol concerns memory and faithfulness.
        - |
          The daguerreotype belongs to Liza Jane and records Sam, not the present Ryder. Ryder's self-regard is better symbolised by his mirror and his books.
      answer: 0

    - slug: u07-w24-q10
      type: multiple_choice
      topic_code: "5.C"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      prompt: |
        After Liza Jane leaves, Ryder "went upstairs to his bedroom, and stood for a long time before the mirror of his dressing-case, gazing thoughtfully at the reflection of his own face." The mirror functions chiefly as a symbol of
      options:
        - |
          private self-examination: Ryder confronts who he is, and was, before he decides what to do in public
        - |
          vanity alone, since Ryder is admiring how young he looks
        - |
          the supernatural, because the mirror shows him a ghost
        - |
          Mrs. Dixon, whose face he imagines in the glass
      option_explanations:
        - |
          Correct. Placed between the private recognition and the public toast, the mirror stages a reckoning. The narrator does not tell us what Ryder sees or decides; the symbol holds the decision open until the ball.
        - |
          "Thoughtfully" and "for a long time" suggest reflection in both senses, not admiration. A vanity reading ignores the scene's timing, just after the encounter.
        - |
          Nothing supernatural appears; the mirror shows "his own face."
        - |
          The text says he gazes at his own reflection. Mrs. Dixon is not mentioned in the moment.
      answer: 0

    - slug: u07-w24-q11
      type: multiple_choice
      topic_code: "2.C"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      prompt: |
        At Ryder's door, Liza Jane "looked like a bit of the old plantation life, summoned up from the past by the wave of a magician's wand." The description most clearly conveys the relationship between Ryder and his setting by suggesting that
      options:
        - |
          the Southern past that Ryder's Northern life has left behind has suddenly appeared on his own doorstep, unbidden
        - |
          Ryder is a magician who performs at the Blue Vein ball
        - |
          Liza Jane has come from a nearby plantation in Groveland
        - |
          Ryder has always kept close ties with the plantation where he was raised
      option_explanations:
        - |
          Correct. The simile sets two settings against each other: the plantation past and the Groveland present. The "magician's wand" also links her to the poem he has just been reading: the past arrives in the shape of the opposite of his ideal.
        - |
          The wand is figurative, likening her appearance to magic; Ryder is a clerk.
        - |
          Groveland is a Northern city; "plantation life" refers to the South and to the past.
        - |
          The story's tension depends on the opposite: Ryder has left that past behind and kept it hidden.
      answer: 0

    - slug: u07-w24-q12
      type: multi_select
      topic_code: "2.C"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 2
      partial_credit: true
      prompt: |
        Which details establish Ryder's place in his Groveland setting before Liza Jane arrives? Select all that apply.
      options:
        - |
          He is called "the dean of the Blue Veins."
        - |
          He has risen from messenger to stationery clerk at a railroad company.
        - |
          He is giving a ball in honour of Mrs. Dixon and reads Tennyson to prepare his speech.
        - |
          He owns a plantation in the South that he visits every summer.
      option_explanations:
        - |
          Correct. The title places him at the head of the community's social elite.
        - |
          Correct. His steady rise in a railroad office marks him as a self-made man of the new Northern city.
        - |
          Correct. Hosting the ball and quoting English poetry show his cultivated, respected position, and his investment in it.
        - |
          Nothing in the story gives Ryder property in the South. He left the South long ago, and the plantation is Liza Jane's world, not his.
      answer: [0, 1, 2]

    - slug: u07-w24-q13
      type: multiple_choice
      topic_code: "3.D"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      prompt: |
        Review. Ryder is reading lines from Tennyson's "A Dream of Fair Women" ("A daughter of the gods, divinely tall, / And most divinely fair") when Liza Jane appears: "a little woman, not five feet tall," old and very dark. The function of this contrast is best described as
      options:
        - |
          setting Ryder's literary ideal of a tall, "fair" lady against the real woman who has a claim on him, so that the scene tests the values his reading expresses
        - |
          showing that Ryder dislikes poetry and prefers practical conversation
        - |
          proving that Liza Jane is the woman Tennyson wrote about
        - |
          suggesting that Ryder will marry Mrs. Dixon after all
      option_explanations:
        - |
          Correct. "Tall" against "not five feet tall," "fair" (beautiful and pale) against very dark: the juxtaposition is deliberate. It reveals the colour-based ideal behind his taste and prepares the choice he must make.
        - |
          He reads with "an appreciative thrill." The contrast is between his ideal and reality, not between poetry and talk.
        - |
          Tennyson's poem is about legendary women; Liza Jane is its opposite in Ryder's eyes, which is the point.
        - |
          He ends by acknowledging Liza Jane. The contrast prepares that reversal, not the marriage he had planned.
      answer: 0

    - slug: u07-w24-q14
      type: multiple_choice
      topic_code: "1.B"
      source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898)'
      points: 1
      prompt: |
        Review. The story ends with Ryder saying, "Permit me to introduce to you the wife of my youth." The most significant function of Ryder's change is that it
      options:
        - |
          reverses the values he voiced at the start (the "backward step" he refused), showing a man who chooses obligation and truth over the status his society rewards
        - |
          shows that Ryder was secretly in love with Liza Jane throughout the story
        - |
          proves that Mrs. Dixon has refused his proposal
        - |
          reveals that the Blue Veins have voted to expel him
      option_explanations:
        - |
          Correct. Ryder said the darker race "would welcome us, but it would be for us a backward step." Presenting Liza Jane before the Blue Veins is that step, freely taken. His change gives the story its moral turn.
        - |
          The story shows no romantic longing; his choice is framed as duty and self-truth ("to thine own self be true").
        - |
          He never proposes; the ball is turned to a different purpose before he can.
        - |
          No vote or expulsion occurs. The guests themselves said "He should have acknowledged her."
      answer: 0

