      points: 1
      prompt: |
        True or false: Liza Jane tells Ryder that she has been searching for her husband for about twenty-five years, first in the South and then in the North.
      answer: true
      explanation: |
        True. After the war she went back to the old home and then searched the South and the North, working as a cook. Her journey reverses Ryder's: he left the South to make a new life, and she has crossed the same ground to find the old one.

