  - slug: u07-exam-q43
    type: short_answer
    topic_code: "7.C"
    source: general knowledge
    points: 3
    prompt: |
      Choose ONE of the three stories studied in this unit. Identify one ambiguity the story deliberately leaves open, and in two or three sentences explain what the story gains by not resolving it.
    answer: |
      "The Tell-Tale Heart" never confirms whose heart the narrator hears at the end: the officers "chatted pleasantly, and smiled," so the sound may be his own pulse or his guilt rather than the dead man's heart. By leaving it open Poe keeps the reader inside the narrator's perception, where the question is not what is real but what his mind cannot stop hearing, and that makes the confession the final proof of the madness he denied.
    explanation: |
      1 point: identifies a genuine textual ambiguity (whose heartbeat; whether the Dead Letter Office rumour is true or what "Ah humanity!" concedes; what Ryder decides at the mirror, or how his society will receive the ending).
      1 point: supports it with specific evidence showing that the text sustains more than one reading.
      1 point: explains what the story gains from leaving it unresolved (keeps the reader inside a perception; turns explanation into a revelation about the explainer; shifts emphasis from outcome to choice). A response that simply calls the story "confusing" earns 0.

  - slug: u07-exam-q44
    type: long_answer
    topic_code: "7.D"
    source: general knowledge
    points: 6
    prompt: |
      In many works of fiction, a character is forced to confront a person from his or her past, or a part of the self, that he or she would rather not acknowledge. Either from your own reading or from the list below, choose a work of fiction in which such a confrontation is central. Then, in a well-written essay, analyze how the character's response to that confrontation contributes to an interpretation of the work as a whole.

      Suggested works: "The Wife of His Youth" (Chesnutt); "Bartleby, the Scrivener" (Melville); "The Tell-Tale Heart" (Poe); Frankenstein (Mary Shelley); Hamlet (Shakespeare); "Young Goodman Brown" (Hawthorne); The Great Gatsby (Fitzgerald); A Doll's House (Ibsen). You may select a work not listed if it is of comparable literary merit.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Provide evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Sample approach using "The Wife of His Youth": Ryder's acknowledgment of Liza Jane shows that the identity he built in Groveland can survive only if it includes the past it was built to escape; Chesnutt makes the confrontation a test of whether status founded on colour can coexist with fidelity, and lets fidelity win in public.

      Line of reasoning: (1) The self Ryder has constructed: "dean of the Blue Veins," his speech on "absorption" and the "backward step," his search through Tennyson for a "pale" ideal. (2) The past arrives: Liza Jane as "a bit of the old plantation life," her daguerreotype of Sam, her certainty she would know him "'mongs' a hund'ed men" while she speaks to him. (3) The private reckoning: the mirror, and Ryder's legal argument that the slave marriage might not count. (4) The public choice: the hypothetical at the ball, Mrs. Dixon's "He should have acknowledged her," and "Permit me to introduce to you the wife of my youth."

      Alternative works: Melville's narrator confronts in Bartleby a figure of his own capacity for despair and evades him; Poe's narrator confronts in the eye and the heartbeat a guilt he will not name; Victor Frankenstein flees and then pursues the creature he made.

      Sophistication: weighs costs (what Ryder gives up; what Liza Jane receives), situates the choice in the history of slave marriages and colorism, or contrasts Ryder with a character who refuses the confrontation.
    explanation: |
      Row A Thesis (0-1): 1 point for a defensible thesis that explains how the character's response to the confrontation contributes to an interpretation of the work. A thesis that only identifies the confrontation, or summarises the plot, earns 0.

      Row B Evidence and Commentary (0-4):
      4: specific and well-chosen evidence (key scenes, lines, details) used throughout, with commentary that consistently explains how the response reveals character and builds the interpretation.
      3: specific evidence supporting a line of reasoning; commentary explains some evidence but is uneven or partly summary.
      2: mostly general evidence or summary; commentary repeats rather than explains.
      1: evidence that is irrelevant or merely listed, with little or no commentary.
      0: no relevant evidence.

      Row C Sophistication (0-1): 1 point for a complex understanding, such as exploring tensions in the character's response (sincere and self-interested; brave and costly), situating the work accurately in its historical or cultural context, weighing alternative interpretations, or writing with a consistently vivid and persuasive style. A passing sentence of praise for the author does not earn the point.
