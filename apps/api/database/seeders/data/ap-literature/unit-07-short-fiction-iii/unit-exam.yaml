  - slug: u07-exam-q27
    type: multiple_choice
    topic_code: "3.D"
    source: 'Charles W. Chesnutt, "The Wife of His Youth" (1898); Alfred Tennyson, "A Dream of Fair Women" (1832)'
    points: 1
    stimulus: &wife_arrival |
      *In the following passage from Charles W. Chesnutt's "The Wife of His Youth" (1898), Mr. Ryder is at home choosing lines of poetry to quote at the ball he will give that evening for Mrs. Molly Dixon. He has rejected a stanza about "pale Margaret" because Mrs. Dixon is "of a rather ruddy complexion," and turned to Tennyson's description of Queen Guinevere in "A Dream of Fair Women," which ends:*

      "She look'd so lovely, as she sway'd
      The rein with dainty finger-tips,
      A man had given all other bliss,
      And all his worldly worth for this,
      To waste his whole heart in one kiss
      Upon her perfect lips."

      As Mr. Ryder murmured these words audibly, with an appreciative thrill, he heard the latch of his gate click, and a light footfall sounding on the steps. He turned his head, and saw a woman standing before his door. She was a little woman, not five feet tall, and proportioned to her height. Although she stood erect, and looked around her with very bright and restless eyes, she seemed quite old; for her face was crossed and recrossed with a hundred wrinkles, and around the edges of her bonnet could be seen protruding here and there a tuft of short gray wool. She wore a blue calico gown of ancient cut, a little red shawl fastened around her shoulders with an old-fashioned brass brooch, and a large bonnet profusely ornamented with faded red and yellow artificial flowers. And she was very black,—so black that her toothless gums, revealed when she opened her mouth to speak, were not red, but blue. She looked like a bit of the old plantation life, summoned up from the past by the wave of a magician's wand, as the poet's fancy had called into being the gracious shapes of which Mr. Ryder had just been reading.
    prompt: |
      The placement of the woman's arrival immediately after the Tennyson stanza functions primarily to
    options:
      - |
        juxtapose Ryder's literary ideal of a lovely, delicate lady with a real woman who embodies everything that ideal excludes, so that the scene tests his values
      - |
        show that the woman has come to hear Ryder recite poetry
      - |
        suggest that the woman is Queen Guinevere in disguise
      - |
        provide comic relief before the serious business of the ball
    option_explanations:
      - |
        Correct. "Dainty finger-tips" and "perfect lips" give way at once to wrinkles and "toothless gums." The narrator underlines the link ("as the poet's fancy had called into being the gracious shapes"), so the contrast is the scene's design.
      - |
        She does not know what he is reading; she has come looking for her husband.
      - |
        The comparison is between a poetic ideal and a real woman. Nothing suggests disguise.
      - |
        Some readers in 1898 might have laughed; the passage's attentive, unmocking detail and the story's ending treat her with gravity.
    answer: 0

