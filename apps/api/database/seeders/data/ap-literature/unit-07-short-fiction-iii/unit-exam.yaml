    source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
    points: 2
    stimulus: *bart_sunday
    prompt: |
      In two or three sentences, explain how this passage marks a change in the narrator, and identify one detail that suggests the change may be limited.
    answer: |
      The narrator feels "for the first time in my life" a "stinging melancholy" and calls Bartleby a fellow son of Adam, so the employer begins to see his copyist as a brother in misery. But he immediately calls these thoughts "chimeras, doubtless, of a sick and silly brain," retreating from his own insight, which anticipates how his sympathy will later give way to evasion.
