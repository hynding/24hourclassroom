unit: 7
description: |
  44 questions · about 80 minutes · Unit 7, Short Fiction III: Poe's "The Tell-Tale Heart," Melville's "Bartleby,
  the Scrivener" and Chesnutt's "The Wife of His Youth," with an unseen passage from Chesnutt's "The Sheriff's
  Children" (1889), as on the AP exam. Four passage sets (35 items) on reliability, imagery, character change and
  relationships, symbol and setting; seven further items across the unit; two short answers; and one
  literary-argument essay scored on the AP 6-point rubric. Selected-response items are graded at once; the short
  answers and the essay are graded by your teacher.
questions:
  - slug: u07-exam-q01
    type: multiple_choice
    topic_code: "2.B"
    source: 'Charles W. Chesnutt, "The Sheriff''s Children" (1889)'
    points: 1
    stimulus: &sheriff |
      *The following passage opens Charles W. Chesnutt's short story "The Sheriff's Children" (1889), set in North Carolina some years after the Civil War. You have not studied this story.*

      Branson County, North Carolina, is in a sequestered district of one of the staidest and most conservative States of the Union. Society in Branson County is almost primitive in its simplicity. Most of the white people own the farms they till, and even before the war there were no very wealthy families to force their neighbors, by comparison, into the category of "poor whites."

      To Branson County, as to most rural communities in the South, the war is the one historical event that overshadows all others. It is the era from which all local chronicles are dated,—births, deaths, marriages, storms, freshets. No description of the life of any Southern community would be perfect that failed to emphasize the all pervading influence of the great conflict.

      Yet the fierce tide of war that had rushed through the cities and along the great highways of the country had comparatively speaking but slightly disturbed the sluggish current of life in this region, remote from railroads and navigable streams. [...] The war, it is true, had robbed the county of the flower of its young manhood; but the burden of taxation, the doubt and uncertainty of the conflict, and the sting of ultimate defeat, had been borne by the people with an apathy that robbed misfortune of half its sharpness.
    prompt: |
      The first paragraph primarily characterizes Branson County as
    options:
      - |
        isolated, conservative and socially simple, a place where little changes
      - |
        wealthy and sophisticated, dominated by a few great families
      - |
        a busy commercial centre on a major railroad
      - |
        a battlefield still scarred by recent fighting
    option_explanations:
      - |
        Correct. "Sequestered," "staidest and most conservative" and "almost primitive in its simplicity" all describe a remote, unchanging place, which the rest of the passage develops.
      - |
        The narrator says the opposite: "there were no very wealthy families to force their neighbors ... into the category of 'poor whites.'"
      - |
        The third paragraph places the county "remote from railroads and navigable streams." This reverses the setting.
      - |
        The passage stresses that the war "but slightly disturbed" the county and that its cannon were not heard there.
    answer: 0

  - slug: u07-exam-q02
    type: multiple_choice
    topic_code: "4.C"
    source: 'Charles W. Chesnutt, "The Sheriff''s Children" (1889)'
    points: 1
    stimulus: *sheriff
    prompt: |
      The narrator's attitude toward the community is best described as
    options:
      - |
        detached and quietly ironic, observing its inertia with some critical distance
      - |
        nostalgic and adoring, wishing to return to its simpler life
      - |
        furious, condemning the county as wicked
      - |
        uncertain, unable to describe the county with confidence
    option_explanations:
      - |
        Correct. Superlatives such as "staidest," the "sluggish current of life," and the dry paradox of an "apathy that robbed misfortune of half its sharpness" observe from a distance, with a wry edge that stops short of condemnation.
      - |
        Nothing expresses longing; "sluggish" and "apathy" are not words of affection.
      - |
        The tone is measured and analytical. No moral condemnation is voiced in this passage.
      - |
        The narrator generalises confidently ("No description ... would be perfect that failed to emphasize"). The voice is assured, not hesitant.
    answer: 0

  - slug: u07-exam-q03
    type: multiple_choice
    topic_code: "5.D"
    source: 'Charles W. Chesnutt, "The Sheriff''s Children" (1889)'
    points: 1
    stimulus: *sheriff
    prompt: |
      In the third paragraph, the contrast between "the fierce tide of war" and "the sluggish current of life in this region" functions mainly to
    options:
      - |
        use a single image of moving water to show how the violence that swept the nation barely stirred this slow, out-of-the-way place
      - |
        suggest that the county was flooded during the war
      - |
        show that the county's rivers were used to transport troops
      - |
        compare the county's people to fish
    option_explanations:
      - |
        Correct. Both halves are water: a "tide" that "rushed" and a "current" that is "sluggish." The extended image measures the county's isolation against the national upheaval.
      - |
        The water is figurative; the passage refers to no flood.
      - |
        The county is "remote from ... navigable streams." The image is not about transport.
      - |
        The image concerns the pace of life, not the people as animals. Nothing supports the comparison.
    answer: 0

  - slug: u07-exam-q04
    type: multiple_choice
    topic_code: "2.B"
    source: 'Charles W. Chesnutt, "The Sheriff''s Children" (1889)'
    points: 1
    stimulus: *sheriff
    prompt: |
      The statement that the war "is the era from which all local chronicles are dated,—births, deaths, marriages, storms, freshets" suggests primarily that
    options:
      - |
        the community measures its whole life against a past conflict, so that the war shapes its sense of time even where it did little physical damage
      - |
        the county keeps unusually careful records of the weather
      - |
        the war is no longer remembered in the county
      - |
        most of the county's residents were born during the war
    option_explanations:
      - |
        Correct. The war becomes the county's calendar. Placed beside the claim that it "but slightly disturbed" daily life, the detail sets up a setting dominated by memory more than by events, which hints that the story will concern the war's lingering effects.
      - |
        Storms and freshets are items in a list of things dated from the war; the point is the dating, not the weather.
      - |
        The opposite: the war "overshadows all others."
      - |
        The list concerns how events are dated, not when residents were born.
    answer: 0

  - slug: u07-exam-q05
    type: multi_select
    topic_code: "2.C"
    source: 'Charles W. Chesnutt, "The Sheriff''s Children" (1889)'
    points: 2
    partial_credit: true
    stimulus: *sheriff
    prompt: |
      Which details suggest that the people of Branson County relate to their setting with inertia or insulation? Select all that apply.
    options:
      - |
        The region is "remote from railroads and navigable streams."
      - |
        Life there is a "sluggish current."
      - |
        Defeat was borne "with an apathy that robbed misfortune of half its sharpness."
      - |
        The people rushed to rebuild "the great highways of the country."
    option_explanations:
      - |
        Correct. Geography cuts the county off from the routes by which change travels.
      - |
        Correct. "Sluggish" makes the pace of life itself resistant to disturbance.
      - |
        Correct. The people meet even defeat with apathy: their relation to events is muted, a trait of the community shaped by its setting.
      - |
        The "great highways" are where the war rushed, elsewhere; nothing says the county's people rebuilt them. The option misattributes the phrase.
    answer: [0, 1, 2]

  - slug: u07-exam-q06
    type: true_false
    topic_code: "2.A"
    source: 'Charles W. Chesnutt, "The Sheriff''s Children" (1889)'
    points: 1
    stimulus: *sheriff
    prompt: |
      True or false: The passage states that major battles of the Civil War were fought in Branson County.
    answer: false
    explanation: |
      False. The war "had comparatively speaking but slightly disturbed" the county; it raged elsewhere. The county was touched by loss ("the flower of its young manhood") and by defeat, but not by fighting on its ground.

  - slug: u07-exam-q07
    type: fill_blank
    topic_code: "5.B"
    source: 'Charles W. Chesnutt, "The Sheriff''s Children" (1889)'
    points: 1
    stimulus: *sheriff
    prompt: |
      The narrator says the people bore taxation, uncertainty and defeat "with an ____ that robbed misfortune of half its sharpness."
    answer: ["apathy"]
    explanation: |
      Apathy. The word turns what might be praised as endurance into indifference, and the paradox (apathy as a kind of protection) captures the narrator's ironic view of the community.

  - slug: u07-exam-q08
    type: multiple_choice
    topic_code: "3.D"
    source: 'Charles W. Chesnutt, "The Sheriff''s Children" (1889)'
    points: 1
    stimulus: *sheriff
    prompt: |
      The word "Yet" at the beginning of the third paragraph introduces a contrast between
    options:
      - |
        the war's total dominance over the county's sense of history and its slight effect on the county's everyday life
      - |
        the county's wealth before the war and its poverty after it
      - |
        the narrator's opinion and the opinion of the county's residents
      - |
        the North Carolina setting and a new setting in Virginia
    option_explanations:
      - |
        Correct. Paragraph 2 says the war "overshadows all others"; paragraph 3 says it "but slightly disturbed" daily life. The contrast creates a paradox (a place ruled by memory of what barely touched it) that a reader expects the story to explore.
      - |
        Paragraph 1 says there were no very wealthy families; wealth is not the contrast.
      - |
        The residents' opinions are never given; the narrator speaks throughout.
      - |
        Virginia is mentioned only as a place where the war raged; the setting does not move.
    answer: 0

  - slug: u07-exam-q09
    type: multiple_choice
    topic_code: "7.B"
    source: 'Charles W. Chesnutt, "The Sheriff''s Children" (1889)'
    points: 1
    stimulus: *sheriff
    prompt: |
      Which of the following claims about the passage is the most defensible thesis for an analysis of its setting?
    options:
      - |
        Chesnutt opens with a county that dates everything from a war it barely felt, establishing a setting in which the past governs the present more through memory and habit than through events.
      - |
        The passage is about North Carolina.
      - |
        Branson County was the most important county in the Confederacy.
      - |
        Chesnutt describes the setting because all stories must begin with a description of the setting.
    option_explanations:
      - |
        Correct. The claim is interpretive, arguable and supported by the text (the war as calendar; the "sluggish current"; "apathy"), and it suggests a line of reasoning about memory and habit.
      - |
        True but not arguable: a topic, not a thesis.
      - |
        Unsupported and contradicted: the county was remote and "but slightly disturbed."
      - |
        A generalisation about stories, not a claim about this passage; it also is not true of all stories.
    answer: 0

  - slug: u07-exam-q10
    type: multiple_choice
    topic_code: "4.D"
    source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
    points: 1
    stimulus: &tth_eye |
      *In the following passage from Edgar Allan Poe's "The Tell-Tale Heart" (1843), it is the eighth night; the old man has woken, and the narrator has opened his lantern a crack.*

      It was open — wide, wide open — and I grew furious as I gazed upon it. I saw it with perfect distinctness — all a dull blue, with a hideous veil over it that chilled the very marrow in my bones; but I could see nothing else of the old man's face or person: for I had directed the ray as if by instinct, precisely upon the damned spot.

      And now have I not told you that what you mistake for madness is but over acuteness of the senses? — now, I say, there came to my ears a low, dull, quick sound, such as a watch makes when enveloped in cotton. I knew *that* sound well, too. It was the beating of the old man's heart. It increased my fury, as the beating of a drum stimulates the soldier into courage.
    prompt: |
      The narrator's question at the start of the second paragraph ("have I not told you ... ?") has the effect of
    options:
      - |
        interrupting the climax to renew his argument for his sanity at the very moment his conduct most strongly contradicts it
      - |
        showing that he has calmed down and decided to spare the old man
      - |
        signalling that a new narrator has taken over the story
      - |
        providing the reader with an objective medical explanation of what he hears
    option_explanations:
      - |
        Correct. Just as he grows "furious," he turns to the listener to insist on "over acuteness of the senses." The defence, placed here, invites the reader to judge it against the fury on display.
      - |
        The paragraph ends with his fury increasing "as the beating of a drum stimulates the soldier." He does not spare the old man.
      - |
        The same first-person voice continues and addresses the same "you."
      - |
        "Over acuteness of the senses" is the narrator's self-diagnosis, offered as argument; nothing makes it objective.
    answer: 0

  - slug: u07-exam-q11
    type: multiple_choice
    topic_code: "5.D"
    source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
    points: 1
    stimulus: *tth_eye
    prompt: |
      In the first paragraph, the description of the eye as "all a dull blue, with a hideous veil over it" primarily conveys
    options:
      - |
        the narrator's horror at an ordinary feature of an old man's eye, magnified by a perception fixed on that single point
      - |
        that the old man is wearing a disguise
      - |
        the narrator's admiration for the eye's beauty
      - |
        that the room is lit brightly enough to see every detail of the old man's face
    option_explanations:
      - |
        Correct. The literal detail (a clouded eye) becomes "hideous" and chills "the very marrow." The image shows the gap between what is there and what the narrator feels, and the lantern isolates it.
      - |
        "Veil" is the narrator's word for the film over the eye; nothing suggests a disguise.
      - |
        "Hideous" and "chilled" express horror, not admiration.
      - |
        He sees "nothing else of the old man's face or person"; only a single ray lights the room.
    answer: 0

  - slug: u07-exam-q12
    type: multiple_choice
    topic_code: "6.A"
    source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
    points: 1
    stimulus: *tth_eye
    prompt: |
      The simile "as the beating of a drum stimulates the soldier into courage" contributes to the characterization of the narrator chiefly by
    options:
      - |
        casting a murderous attack on a terrified old man as a soldier's brave charge, a heroic self-image the reader cannot share
      - |
        revealing that the narrator served in the army
      - |
        suggesting that the old man is beating a drum to call for help
      - |
        showing that the narrator is afraid and wants to run away
    option_explanations:
      - |
        Correct. The simile gives the narrator's fury a noble frame. The distance between the frame and the act (an old man in bed) is a measure of his distorted perspective.
      - |
        A simile compares; it does not supply biography. Nothing in the story mentions military service.
      - |
        The drum is the vehicle of the comparison for the heartbeat, not an object in the room.
      - |
        The simile says the sound "increased my fury" and stimulated "courage," the opposite of flight.
    answer: 0

  - slug: u07-exam-q13
    type: multi_select
    topic_code: "4.D"
    source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
    points: 2
    partial_credit: true
    stimulus: *tth_eye
    prompt: |
      Which details in the passage work against the narrator's picture of himself as calm and in control? Select all that apply.
    options:
      - |
        "I grew furious as I gazed upon it"
      - |
        "I had directed the ray as if by instinct"
      - |
        "It increased my fury"
      - |
        "I saw it with perfect distinctness"
    option_explanations:
      - |
        Correct. Fury at the sight of an eye is not the calm he claims; the emotion is disproportionate to its cause.
      - |
        Correct. "As if by instinct" concedes that he was not acting by deliberate method, undercutting his boast of "how wisely I proceeded."
      - |
        Correct. The sound escalates his rage; he is driven by stimuli rather than by the reasoned plan he describes elsewhere.
      - |
        Seeing clearly is consistent with the control he claims; this phrase supports rather than undercuts his self-image. What undercuts it is how he reacts to what he sees.
    answer: [0, 1, 2]

  - slug: u07-exam-q14
    type: true_false
    topic_code: "5.D"
    source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
    points: 1
    stimulus: *tth_eye
    prompt: |
      True or false: In this passage the lantern lets the narrator see the old man's whole face clearly.
    answer: false
    explanation: |
      False. He says "I could see nothing else of the old man's face or person," because the single ray falls only on the eye. The limited light is the image of his limited, obsessive perception.

  - slug: u07-exam-q15
    type: multiple_choice
    topic_code: "4.D"
    source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
    points: 1
    stimulus: *tth_eye
    prompt: |
      The sentence "I knew *that* sound well, too" is ambiguous chiefly because
    options:
      - |
        the narrator has just claimed to know the old man's groan from his own experience, so the familiar sound he now hears might be his own heart as much as the old man's
      - |
        the narrator has never heard a heartbeat before
      - |
        it is unclear whether the narrator is awake or dreaming throughout the whole story
      - |
        the old man says the sentence, not the narrator
    option_explanations:
      - |
        Correct. Earlier he recognised the old man's groan because the same terror had welled up from his own bosom. "Too" links this recognition to that one, so the heartbeat could be projected from within. The ambiguity anticipates the ending.
      - |
        "I knew that sound well" says the reverse: he claims long familiarity.
      - |
        This overstates the ambiguity. Nothing suggests the whole story is a dream; the question is the source of one sound.
      - |
        The old man speaks only once ("Who's there?"). This sentence is the narrator's.
    answer: 0

  - slug: u07-exam-q16
    type: multiple_choice
    topic_code: "3.B"
    source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
    points: 1
    stimulus: *tth_eye
    prompt: |
      This passage comes immediately before the murder. Its function in the sequence of the plot is to
    options:
      - |
        introduce the heartbeat at the moment of greatest tension, so that the sound which drives him to kill will return at the end to drive him to confess
      - |
        delay the plot with a flashback to the narrator's childhood
      - |
        resolve the conflict by showing the narrator's change of heart
      - |
        introduce the police officers who will search the house
    option_explanations:
      - |
        Correct. The heartbeat, first heard here, links the climax to the ending: the same simile ("a watch ... enveloped in cotton") returns when he sits above the body. The sequence makes the sound both motive and nemesis.
      - |
        There is no flashback; the passage is the eighth night itself.
      - |
        He kills the old man moments later; there is no change of heart.
      - |
        The officers arrive at four o'clock, after the concealment, not in this scene.
    answer: 0

  - slug: u07-exam-q17
    type: fill_blank
    topic_code: "6.A"
    source: 'Edgar Allan Poe, "The Tell-Tale Heart" (1843)'
    points: 1
    stimulus: *tth_eye
    prompt: |
      The narrator compares the heartbeat to the sound "a ____ makes when enveloped in cotton."
    answer: ["watch"]
    explanation: |
      Watch. The simile joins a muffled, hidden sound to the steady ticking of time, which suits both the heart of a man about to die and the later heart "concealed" under the floor.

  - slug: u07-exam-q18
    type: multiple_choice
    topic_code: "1.D"
    source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
    points: 1
    stimulus: &bart_sunday |
      *In the following passage from Herman Melville's "Bartleby, the Scrivener" (1853), the lawyer-narrator, calling at his Wall Street office on a Sunday morning, has discovered that his copyist Bartleby has been living there.*

      [...] What miserable friendlessness and loneliness are here revealed! His poverty is great; but his solitude, how horrible! Think of it. Of a Sunday, Wall-street is deserted as Petra; and every night of every day it is an emptiness. This building too, which of week-days hums with industry and life, at nightfall echoes with sheer vacancy, and all through Sunday is forlorn. And here Bartleby makes his home; sole spectator of a solitude which he has seen all populous—a sort of innocent and transformed Marius brooding among the ruins of Carthage!

      For the first time in my life a feeling of overpowering stinging melancholy seized me. Before, I had never experienced aught but a not-unpleasing sadness. The bond of a common humanity now drew me irresistibly to gloom. A fraternal melancholy! For both I and Bartleby were sons of Adam. I remembered the bright silks and sparkling faces I had seen that day, in gala trim, swan-like sailing down the Mississippi of Broadway; and I contrasted them with the pallid copyist, and thought to myself, Ah, happiness courts the light, so we deem the world is gay; but misery hides aloof, so we deem that misery there is none. These sad fancyings—chimeras, doubtless, of a sick and silly brain—led on to other and more special thoughts, concerning the eccentricities of Bartleby. Presentiments of strange discoveries hovered round me. The scrivener's pale form appeared to me laid out, among uncaring strangers, in its shivering winding sheet.
    prompt: |
      The sentence "For both I and Bartleby were sons of Adam" suggests that the narrator now sees his relationship with Bartleby primarily as
    options:
      - |
        a kinship of shared humanity that goes beyond the contract between employer and copyist
      - |
        a legal arrangement that he must end as quickly as possible
      - |
        a literal family connection he has just discovered
      - |
        a rivalry between two men competing for the same position
    option_explanations:
      - |
        Correct. "Sons of Adam" names a bond common to all people; with "fraternal melancholy" it reframes the relationship as brotherhood. The nuance is that this feeling arises in the employer's own office, where the contract still holds.
      - |
        The passage is about a new feeling of bond, not about ending anything; that impulse comes later.
      - |
        "Sons of Adam" is a figure of speech for common descent from the first man in Genesis, not a literal family tie.
      - |
        Nothing suggests competition; the narrator is a lawyer and Bartleby a copyist.
    answer: 0

  - slug: u07-exam-q19
    type: multiple_choice
    topic_code: "6.A"
    source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
    points: 1
    stimulus: *bart_sunday
    prompt: |
      The simile "Of a Sunday, Wall-street is deserted as Petra" contributes to the passage mainly by
    options:
      - |
        likening the busiest street of commerce to an abandoned ancient city, so that Bartleby's home becomes a ruin and his solitude almost monumental
      - |
        suggesting that Wall Street was built by the same architects as Petra
      - |
        praising the beauty of New York's architecture on Sundays
      - |
        indicating that the narrator has recently travelled to Petra
    option_explanations:
      - |
        Correct. Petra, the deserted rock-cut city, turns emptiness into ruin. Together with the Marius allusion it enlarges Bartleby's loneliness into something historic and tragic.
      - |
        The simile compares emptiness, not construction. No architectural link is claimed.
      - |
        The point is desolation ("deserted"; "forlorn"), not beauty.
      - |
        A simile need not reflect the speaker's travels; nothing in the story mentions such a trip.
    answer: 0

  - slug: u07-exam-q20
    type: multiple_choice
    topic_code: "1.B"
    source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
    points: 1
    stimulus: *bart_sunday
    prompt: |
      The contrast between "a not-unpleasing sadness" and "a feeling of overpowering stinging melancholy" marks a change in the narrator chiefly from
    options:
      - |
        a comfortable, self-regarding sadness that cost him nothing to a painful sympathy that implicates him
      - |
        happiness to anger at Bartleby's deception
      - |
        indifference to a decision to fire Bartleby at once
      - |
        grief to relief
    option_explanations:
      - |
        Correct. "Not-unpleasing" exposes the narrator's earlier sadness as a kind of pleasure. "Stinging" and "overpowering" mark a feeling that hurts and that he cannot manage, the first real change in a man who prized "the easiest way of life."
      - |
        The feelings named are sadness and melancholy, not anger. Nothing here accuses Bartleby of deception.
      - |
        No decision is made in this passage; the narrator is moved, not resolved.
      - |
        The movement is toward deeper pain, not relief.
    answer: 0

  - slug: u07-exam-q21
    type: multiple_choice
    topic_code: "3.D"
    source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
    points: 1
    stimulus: *bart_sunday
    prompt: |
      The narrator's memory of "the bright silks and sparkling faces ... swan-like sailing down the Mississippi of Broadway" functions primarily as
    options:
      - |
        a contrast of public, visible happiness with hidden misery, leading to his reflection that "misery hides aloof, so we deem that misery there is none"
      - |
        evidence that Bartleby spent the morning on Broadway
      - |
        a description of a parade the narrator hopes Bartleby will join
      - |
        proof that the narrator dislikes fashionable society
    option_explanations:
      - |
        Correct. The bright crowd and the "pallid copyist" are set side by side, and the narrator draws the moral himself: misery is unseen because it hides. The contrast is the occasion of his insight.
      - |
        The narrator saw the crowd "that day" himself; Bartleby has been alone in the office.
      - |
        No parade or invitation is described; the crowd is a remembered image.
      - |
        He contrasts the crowd with Bartleby, not to condemn the crowd but to see what it hides.
    answer: 0

  - slug: u07-exam-q22
    type: multiple_choice
    topic_code: "4.D"
    source: 'Herman Melville, "Bartleby, the Scrivener" (1853)'
    points: 1
    stimulus: *bart_sunday
    prompt: |
      The narrator's description of his own thoughts as "chimeras, doubtless, of a sick and silly brain" most likely suggests that
    options:
      - |
        he distrusts and partly retreats from his own moment of insight, a hesitation that anticipates how he will later back away from Bartleby
      - |
        he has been taken ill and must leave the office
      - |
        the narrator is unreliable in the same way as Poe's narrator, insisting he is sane
      - |
        he believes Bartleby's situation is entirely imaginary
    option_explanations:
      - |
        Correct. "Doubtless" dismisses the very feelings he has just described. The self-correction is a small sign of a pattern: the narrator's sympathy keeps being checked by his preference for ease.
      - |
        "Sick and silly" describes the quality of his thoughts, not a literal illness.
      - |
        The two narrators differ: Poe's insists on his sanity; Melville's here calls his own thoughts foolish. Equating them misreads both.
      - |
        He has seen evidence of Bartleby living in the office; he dismisses his "fancyings," not the facts.
    answer: 0

