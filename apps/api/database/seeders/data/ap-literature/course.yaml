# The AP English Literature and Composition course map. Week files live under
# unit-NN-<slug>/week-NN.yaml. Titles and slugs are composed by
# Database\Seeders\ApLiterature\Course from the numbers here, so nothing in a
# week file repeats the naming convention.
#
# The literature CED organises its learning objectives by skill, not by
# numbered topic, and the same skills return in every unit. So a `topic_code`
# in this course is a CED skill code from `skills` below, each unit lists the
# skills the CED assigns it, and each week's `topics` names the skills that
# week puts in focus.
title: AP English Literature and Composition
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full school year of AP English Literature and Composition, one week at a
  time: a reading and study guide, flashcards and a quiz every week, a summary
  and an exam at the end of each of the nine units, and an exam-prep guide
  and full practice exam before the May exam. Every text quoted is in the
  public domain in the United States, from O. Henry, Joyce and Poe to
  Hamlet, Frankenstein, The Great Gatsby and A Doll's House, so every passage
  can be read in full online.
teacher: { name: "AP Literature Teacher", email: aplit@example.com }
student: { name: "AP Literature Student", email: aplit-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# 35 weeks before the exam week (Monday 2027-05-03; the AP English Literature
# exam is Wednesday 2027-05-05); weeks 33-34 review, 35 buffer, 36 exam week.
start_date: 2026-08-31
exam_date: 2027-05-05
subject: english-language-arts
grade_level: "9-12"
review: { prep_guide_week: 33, practice_exam_week: 34 }
# The CED's skills, verbatim from the AP English Literature and Composition
# Course and Exam Description. The category weights in the comments are the
# share of the multiple-choice section each category carries on the exam.
skills:
  # 1 · Character (16-20%)
  "1.A": "Identify and describe what specific textual details reveal about a character, that character's perspective, and that character's motives."
  "1.B": "Explain the function of a character changing or remaining unchanged."
  "1.C": "Explain the function of contrasting characters."
  "1.D": "Describe how textual details reveal nuances and complexities in characters' relationships with one another."
  "1.E": "Explain how a character's own choices, actions, and speech reveal complexities in that character, and explain the function of those complexities."
  # 2 · Setting (3-6%)
  "2.A": "Identify and describe specific textual details that convey or reveal a setting."
  "2.B": "Explain the function of setting in a narrative."
  "2.C": "Describe the relationship between a character and a setting."
  # 3 · Plot and structure (16-20%)
  "3.A": "Identify and describe how plot orders events in a narrative."
  "3.B": "Explain the function of a particular sequence of events in a plot."
  "3.C": "Explain the function of structure in a text."
  "3.D": "Explain the function of contrasts within a text."
  "3.E": "Explain the function of a significant event or related set of significant events in a plot."
  "3.F": "Explain the function of conflict in a text."
  # 4 · Narrator or speaker (21-26%)
  "4.A": "Identify and describe the narrator or speaker of a text."
  "4.B": "Identify and explain the function of point of view in a narrative."
  "4.C": "Identify and describe details, diction, or syntax in a text that reveal a narrator's or speaker's perspective."
  "4.D": "Explain how a narrator's reliability affects a narrative."
  # 5 · Word choice, imagery and symbols (10-13%)
  "5.A": "Distinguish between the literal and figurative meanings of words and phrases."
  "5.B": "Explain the function of specific words and phrases in a text."
  "5.C": "Identify and explain the function of a symbol."
  "5.D": "Identify and explain the function of an image or imagery."
  # 6 · Comparison (10-13%)
  "6.A": "Identify and explain the function of a simile."
  "6.B": "Identify and explain the function of a metaphor."
  "6.C": "Identify and explain the function of personification."
  "6.D": "Identify and explain the function of an allusion."
  # 7 · Literary argument (10-13%)
  "7.A": "Develop a paragraph that includes 1) a claim that requires defense with evidence from the text and 2) the evidence itself."
  "7.B": "Develop a thesis statement that conveys a defensible claim about an interpretation of literature and that may establish a line of reasoning."
  "7.C": "Develop commentary that establishes and explains relationships among textual evidence, the line of reasoning, and the thesis."
  "7.D": "Select and use relevant and sufficient evidence to both develop and support a line of reasoning."
  "7.E": "Demonstrate control over the elements of composition to communicate clearly."
# Units in the CED's order. `weight` is the genre's share of the multiple-choice
# section (short fiction 42-49%, poetry 36-45%, longer fiction or drama 15-18%).
units:
