    - slug: u05-w14-q20
      type: short_answer
      topic_code: "7.B"
      source: 'Percy Bysshe Shelley, "Ozymandias" (1818)'
      points: 2
      prompt: |
        Write a defensible thesis for an AP Question 1 essay on "Ozymandias" that makes a claim about the poem's meaning and names at least two techniques (for example, the layered narration, the inscription, the closing image) that establish a line of reasoning.
      answer: |
        Through a chain of reported voices that leaves the king's boast at several removes, and an inscription whose command is turned inside out by the empty desert around it, Shelley shows that political power, however loudly it claims permanence, survives only as a fragment, while the art that recorded it and the indifferent landscape outlast it.
