guide: guides/week-14.md
guide_description: |
  How a sonnet works: iambic pentameter and how to scan it, the Petrarchan and Shakespearean patterns, and the
  volta as the place where the argument turns. Then allusion and the literal/figurative distinction, worked through
  "Ozymandias", Wordsworth's "The world is too much with us", Milton's sonnet on his blindness and McKay's "America",
  with a model Q1 thesis and paragraph.
flashcards_description: |
  32 cards on sonnet form and meter, the volta, allusion, and the double meanings in this week's four sonnets.

flashcards:
  - front: The sonnet → its fixed features
    back: |
      Fourteen lines, in English almost always iambic pentameter, with a set rhyme scheme and a turn (the volta) where the argument shifts. Form is part of the meaning: the poem has fourteen lines in which to pose a problem and answer or complicate it.
    topic_code: "3.C"
  - front: Iambic pentameter → definition and a scanned example
    back: |
      Five feet per line, each foot an iamb (unstressed then stressed: da-DUM). "I MET | a TRAV | 'ller FROM | an AN | tique LAND" (Shelley). Count stresses, not just syllables: ten syllables with five rising beats.
    hint: penta = five; iamb = da-DUM.
    topic_code: "3.C"
  - front: Iamb, trochee, spondee → which is which
    back: |
      Iamb: unstressed-stressed (a-BOUT). Trochee: stressed-unstressed (GET-ting). Spondee: two stresses (GREAT GOD). In an iambic line, a trochee or spondee is a variation that draws attention to the words it falls on.
    topic_code: "3.C"
  - front: Trochaic inversion → "Getting and spending, we lay waste our powers"
    back: |
      Wordsworth's line 2 opens on a stress (GET-ting) instead of the expected da-DUM. The jolt at the head of the line makes the busy, repetitive activity of buying and selling sound like a lurch, before the line settles back into iambs.
    topic_code: "3.C"
  - front: Petrarchan (Italian) sonnet → shape
    back: |
      An octave (eight lines) rhyming ABBAABBA and a sestet (six lines) rhyming CDECDE, CDCDCD or a variant. The octave states a problem, situation or feeling; the sestet answers, reflects or turns. The volta usually falls at line 9.
    topic_code: "3.C"
  - front: Shakespearean (English) sonnet → shape
    back: |
      Three quatrains and a couplet: ABAB CDCD EFEF GG. The quatrains develop or vary an idea; the turn often comes at line 9 or is saved for the couplet, which can resolve, sum up or undercut what came before.
    topic_code: "3.C"
  - front: Volta → what to look for and why it matters
    back: |
      The turn in a sonnet's thought. Signals: "but", "yet", "then", a question answered, a change of addressee, tense or tone, a new speaker. Ask what changes and why the poem needed to change there; that answer is often a thesis.
    topic_code: "3.C"
  - front: Octave and sestet → how they divide the work
    back: |
      In a Petrarchan sonnet the eight-line octave builds a problem or picture and the six-line sestet responds to it. When a poet starts the response early (Milton, line 8) or late, the displacement itself is meaningful.
    topic_code: "3.C"
  - front: Caesura → "Nothing beside remains. Round the decay"
    back: |
      A pause inside a line, usually marked by punctuation. Shelley's full stop after "remains" halts the line just after the king's boast, so the flat statement of loss lands like a verdict before the description of the sand resumes.
    topic_code: "3.C"
  - front: Enjambment → in a sonnet's argument
    back: |
      A sentence running past the end of a line without a pause. In "Round the decay / Of that colossal wreck, boundless and bare / The lone and level sands stretch far away", the syntax keeps stretching across lines as the sand stretches across the desert.
    topic_code: "3.C"
  - front: Allusion → definition and function
    back: |
      A brief, unexplained reference to a person, place, event or text outside the poem (the Bible, classical myth, history, other literature). It imports a whole story in a word, and the function lies in how the poem uses or changes that story.
    topic_code: "6.D"
  - front: Writing about an allusion → three steps
    back: |
      1) Name the source and what it is about. 2) Say what that story brings into the poem (authority, contrast, a moral, an emotion). 3) Explain how the poem bends it: agreeing, ironising, inverting. "The poem alludes to X" is identification, not analysis.
    topic_code: "6.D"
  - front: Ozymandias → who he was
    back: |
      The Greek form of a throne name of the Egyptian pharaoh Ramesses II (13th century BCE), a great builder of monuments. The ancient historian Diodorus Siculus recorded a boastful inscription on one of his statues, which Shelley's poem reworks.
    topic_code: "6.D"
  - front: '"king of kings" → the allusion in Shelley'
    back: |
      A title claimed by ancient emperors and used in the Bible for God (Revelation 19:16). The ruler claims supreme, almost divine sovereignty, which makes the "colossal wreck" around his words all the more ironic.
    topic_code: "6.D"
  - front: '"Look on my works, ye Mighty, and despair!" → two meanings'
    back: |
      As carved: rival kings should despair of ever equalling me. As read now, among the sand: the mighty should despair because their works will end like this. The words are unchanged; time has reversed their meaning. A perfect test case for literal versus figurative reading.
    topic_code: "5.A"
  - front: '"The hand that mocked them and the heart that fed" → the double sense'
    back: |
      The sculptor's hand "mocked" the king's passions: copied them in stone and also, by copying so exactly, made fun of them. The king's heart "fed" those passions. Both meanings of "mock" (imitate, deride) are live.
    topic_code: "5.A"
  - front: Ozymandias → rhyme scheme
    back: |
      ABABACDCEDEFEF. Neither strictly Petrarchan nor Shakespearean: the rhymes interlock and leak across the octave and sestet. A form that will not stay in its blocks suits a poem about structures crumbling.
    topic_code: "3.C"
  - front: Ozymandias → the chain of voices
    back: |
      The speaker reports a traveller, who reports a sculptor's work, which preserves a king's words. Each layer puts the king's voice further off. His boast reaches us third- or fourth-hand, which is itself an argument about how power fades.
    topic_code: "4.A"
  - front: Proteus and Triton → Wordsworth's allusion
    back: |
      Greek sea gods: Proteus, the shape-changing old man of the sea; Triton, who blows a conch-shell horn to calm or rouse the waves. The speaker would rather believe in a "creed outworn" that saw gods in the sea than feel nothing before it.
    topic_code: "6.D"
  - front: '"Getting and spending, we lay waste our powers" → literal or figurative?'
    back: |
      Literally, buying and selling. Figuratively, "powers" are not money or muscle but our capacities to feel, imagine and wonder, which commerce wastes. The economic words (getting, spending, boon) describe a spiritual loss.
    topic_code: "5.A"
  - front: '"a sordid boon" → what the phrase compresses'
    back: |
      A boon is a gift or favour; sordid means mean, dirty, mercenary. We have given our hearts away in a bargain that is both a gift and a degradation. The near-oxymoron sums up the octave's complaint in three words.
    topic_code: "5.B"
  - front: Wordsworth's volta → where exactly
    back: |
      Midway through line 9. The octave diagnoses ("we are out of tune"); line 9 begins "It moves us not." and then breaks with "Great God! I'd rather be / A Pagan". The turn from collective "we" to personal "I" comes in mid-line, an outburst rather than a tidy pivot.
    topic_code: "3.C"
  - front: Parable of the talents → Milton's allusion
    back: |
      Matthew 25:14-30: a master gives his servants talents (sums of money); the servant who buried his talent instead of using it is cast out. Milton fears his blindness leaves his gift, poetry, "Lodged with me useless", and the parable makes that fear a fear of judgement.
    topic_code: "6.D"
  - front: '"my light is spent" → three meanings'
    back: |
      Eyesight (Milton was blind by 1652), the light of life or working day ("Ere half my days"), and spiritual or poetic illumination. "Spent" adds the money metaphor that the parable of the talents will extend.
    topic_code: "5.A"
  - front: '"They also serve who only stand and wait" → what it answers'
    back: |
      Patience's reply to the fear that a blind man cannot serve God. Service includes patient readiness, like a servant standing at attention, not only active labour. The line reframes waiting from idleness to obedience.
    topic_code: "5.A"
  - front: Milton's early volta → "But patience, to prevent / That murmur"
    back: |
      The answer begins in line 8, before the octave is over. Patience cuts off the complaint before it can be fully spoken, so the rhyme structure and the argument are out of step on purpose.
    topic_code: "3.C"
  - front: '"I fondly ask" → the old meaning'
    back: |
      In Milton, "fondly" means foolishly, not affectionately. The speaker judges his own question ("Doth God exact day-labour, light denied?") as foolish even as he asks it. Check older words before reading them in the modern sense.
    hint: Literal meaning first, and in the poem's own century.
    topic_code: "5.A"
  - front: Claude McKay's "America" → form and first publication
    back: |
      A Shakespearean sonnet (ABAB CDCD EFEF GG) in iambic pentameter, first published in The Liberator in December 1921 and collected in Harlem Shadows (1922). McKay, born in Jamaica, used the inherited English form to speak about a country that oppressed him.
    topic_code: "3.C"
  - front: '"this cultured hell" → oxymoron in McKay'
    back: |
      "Cultured" suggests refinement, art and civilisation; "hell" suggests torment. America is both at once, and the speaker loves it anyway. The phrase holds the poem's whole ambivalence.
    topic_code: "5.B"
  - front: '"Yet, as a rebel fronts a king in state" → McKay''s turn'
    back: |
      The "Yet" arrives at line 8, in the last line of the second quatrain rather than at line 9, so the defiance overruns the form. The simile casts the speaker as a rebel standing before an enthroned king: unafraid, dignified, opposed.
    topic_code: "6.A"
  - front: McKay's couplet → "Like priceless treasures sinking in the sand"
    back: |
      The closing image of a great power's works sinking under "Time's unerring hand" echoes the sands around Shelley's Ozymandias. Whether or not one calls it a direct allusion, reading the two together shows McKay placing America among empires that fall.
    topic_code: "6.D"
  - front: Literal vs figurative reading → the AP move (5.A)
    back: |
      Read the words literally first (what is physically happening), then ask what else they mean. In AP questions the right answer usually keeps both levels: the statue is literally broken and figuratively a judgement on pride.
    topic_code: "5.A"

quiz:
  description: |
    22 questions · about 40 minutes · about 55% this week (allusion and literal versus figurative meaning in the four
    sonnets) and 45% review: sonnet structure and contrast from week 5, word function from week 4, the simile from week
    6, the speaker from week 1 and thesis and commentary from Unit 3. Multiple choice, select-all and true/false items
    are graded at once and the fill-in-the-blank items are matched automatically; the two short answers and the essay
    are graded by your teacher against the scoring guide.
  questions:
    # ---- Passage set: "Ozymandias" (whole poem)
    - slug: u05-w14-q01
      type: multiple_choice
      topic_code: "4.A"
      source: 'Percy Bysshe Shelley, "Ozymandias" (1818)'
      points: 1
      stimulus: &oz |
        *The following sonnet by Percy Bysshe Shelley was first published in* The Examiner *in January 1818.*

        I met a traveller from an antique land
        Who said: Two vast and trunkless legs of stone
        Stand in the desert. Near them, on the sand,
        Half sunk, a shattered visage lies, whose frown,
        And wrinkled lip, and sneer of cold command,     [5]
        Tell that its sculptor well those passions read
        Which yet survive, stamped on these lifeless things,
        The hand that mocked them and the heart that fed:
        And on the pedestal these words appear:
        "My name is Ozymandias, king of kings:     [10]
        Look on my works, ye Mighty, and despair!"
        Nothing beside remains. Round the decay
        Of that colossal wreck, boundless and bare
        The lone and level sands stretch far away.
      prompt: |
        Which best describes how the poem presents the ruins and the inscription to the reader?
      options:
        - "The speaker describes the statue as he saw it on his own journey through the desert."
        - "The speaker reports the account of a traveller, who in turn describes a sculptor's work and the king's carved words, so the king's voice reaches the reader at several removes."
        - "Ozymandias himself speaks the whole poem as a dramatic monologue addressed to later rulers."
        - "The sculptor narrates the poem, explaining how he carved the face to flatter the king."
      option_explanations:
        - |
          Only the first line belongs to the speaker's own experience: "I met a traveller". Everything after "Who said:" is the traveller's report, so the speaker never sees the statue.
        - |
          Correct. Speaker, traveller, sculptor and king are nested inside each other. The layering puts the once-mighty voice at the far end of a chain of retellings, which is part of how the poem shows power fading.
        - |
          Ozymandias speaks only the two carved lines (10-11), and those are quoted by the traveller. A dramatic monologue would give him the whole poem.
        - |
          The sculptor never speaks; we infer his skill and his attitude from the "frown" and "sneer" he carved, as the traveller interprets them.
      answer: 1
      explanation: |
        Track who says what: the first line is the speaker's, the rest is the traveller's quoted account, and the inscription is quoted inside that. Spiral review of 4.A (identifying the speaker) from week 1.

    - slug: u05-w14-q02
      type: multiple_choice
      topic_code: "5.A"
      source: 'Percy Bysshe Shelley, "Ozymandias" (1818)'
      points: 1
      stimulus: *oz
      prompt: |
        In line 8, "The hand that mocked them and the heart that fed" refers most directly to
      options:
        - "the traveller's hand and heart, which mocked the king's pride when he found the statue"
        - "the sculptor's hand, which copied and also derided the king's passions, and the king's heart, which nourished those passions"
        - "the hands of the slaves who built the statue and the hearts of the people the king fed"
        - "the king's own hand, which carved the statue, and the sculptor's heart, which admired him"
      option_explanations:
        - |
          The traveller only reports what he saw; the hand and heart belong to the passions "stamped on these lifeless things", that is, to the making of the statue and the man it portrays.
        - |
          Correct. "Mocked" carries both its older sense (imitated, represented) and its modern one (ridiculed); "fed" means nourished. The passions outlive both the artist who mocked them and the ruler who fed them.
        - |
          Nothing in the poem mentions slaves or feeding a people; this reads "fed" literally and imports a story the text does not tell.
        - |
          It was the sculptor who "well those passions read" and carved them; the king did not carve his own statue, and "heart that fed" belongs to the man whose passions they were.
      answer: 1
      explanation: |
        A 5.A item: "mocked" and "fed" are used figuratively and "mocked" carries two meanings at once. Read the grammar: the passions "survive" both the hand and the heart.

    - slug: u05-w14-q03
      type: multiple_choice
      topic_code: "6.D"
      source: 'Percy Bysshe Shelley, "Ozymandias" (1818)'
      points: 1
      stimulus: *oz
      prompt: |
        The title "king of kings" (line 10) contributes to the poem's irony chiefly because it
      options:
        - "proves that Ozymandias was the most powerful king of his age"
        - "is a title of supreme, even divine, sovereignty, claimed by a ruler whose works now lie in fragments"
        - "suggests that the sculptor intended the inscription as a joke at the king's expense"
        - "shows that the traveller admires the king despite the ruin"
      option_explanations:
        - |
          The poem never vouches for the claim; it quotes it. The point is the distance between the claim and what remains, not the historical truth of the boast.
        - |
          Correct. The phrase echoes titles of ancient emperors and the Bible's name for God (Revelation 19:16). The higher the claim, the harder the fall to "Nothing beside remains."
        - |
          The sculptor's attitude is shown in the face he carved, not the inscription; nothing suggests the words were meant as a joke. The irony is time's, not the carver's.
        - |
          The traveller describes the "sneer of cold command" and the wreck in neutral, even bleak, terms; nothing in his account signals admiration.
      answer: 1
      explanation: |
        An allusion's function lies in the contrast it sets up. A title that claims god-like permanence is placed among "lone and level sands".

    - slug: u05-w14-q04
      type: multiple_choice
      topic_code: "3.D"
      source: 'Percy Bysshe Shelley, "Ozymandias" (1818)'
      points: 1
      stimulus: *oz
      prompt: |
        The contrast between lines 10-11 and the sentence "Nothing beside remains." (line 12) primarily serves to
      options:
        - "deflate the king's exclamation with a flat, brief statement, so that the boast is answered by the bare fact of ruin"
        - "show that the traveller has misread the inscription"
        - "move the poem from the past tense into a prophecy about the future"
        - "introduce a new speaker who disagrees with the traveller"
      option_explanations:
        - |
          Correct. The inscription is all capital-letter grandeur and exclamation; the next sentence is three plain words and a full stop, landing mid-line. The contrast in tone and length does the poem's judging for it.
        - |
          The traveller quotes the inscription accurately and draws no wrong conclusion from it; the irony comes from the setting, not from misreading.
        - |
          The verbs stay in the present ("remains", "stretch"); the poem describes what is there now, and makes no forecast about a future time.
        - |
          The voice after the inscription is still the traveller's; there is no new speaker in the poem's final lines.
      answer: 0
      explanation: |
        Spiral review of 3.D (contrast) from week 5. Look at how long and how loud each side of a contrast is.

    - slug: u05-w14-q05
      type: multi_select
      topic_code: "5.A"
      source: 'Percy Bysshe Shelley, "Ozymandias" (1818)'
      points: 2
      partial_credit: true
      stimulus: *oz
      prompt: |
        Select the TWO words that the poem uses in a figurative (or doubly meaningful) sense rather than a purely literal one.
      options:
        - '"read" (line 6)'
        - '"mocked" (line 8)'
        - '"trunkless" (line 2)'
        - '"pedestal" (line 9)'
      option_explanations:
        - |
          Selected correctly: the sculptor did not literally read anything; he "read" the king's passions as one reads a face, interpreting character from expression.
        - |
          Selected correctly: "mocked" means both imitated in stone and derided, a double meaning the line depends on.
        - |
          Not figurative here: "trunkless" literally means the legs have no torso attached. It is a plain physical description of the wreck.
        - |
          Not figurative: the pedestal is the literal base of the statue on which the words are carved.
      answer: [0, 1]
      explanation: |
        Literal first: what is physically there? Legs without a trunk, a base with words on it. Then figurative: a sculptor "reading" passions, a hand that "mocked" them.

    - slug: u05-w14-q06
      type: true_false
      topic_code: "5.A"
      source: 'Percy Bysshe Shelley, "Ozymandias" (1818)'
      points: 1
      stimulus: *oz
      prompt: |
        True or false: in the poem's present setting, the command "Look on my works, ye Mighty, and despair!" carries a meaning that the king did not intend.
      answer: true
      explanation: |
        True. The king meant that other rulers should despair of matching him. Read among the "lone and level sands", the line tells the mighty to despair because their own works will end the same way. The words are unchanged; their meaning has turned against their author.

    - slug: u05-w14-q07
      type: multiple_choice
      topic_code: "3.C"
      source: 'Percy Bysshe Shelley, "Ozymandias" (1818)'
      points: 1
      stimulus: *oz
      prompt: |
        Which statement about the poem's form is most accurate?
      options:
        - "It is a Shakespearean sonnet whose closing couplet states the moral."
        - "It is a Petrarchan sonnet rhyming ABBAABBA CDECDE, with the turn at line 12."
        - "It is a fourteen-line poem in iambic pentameter whose interlocking rhyme scheme fits neither standard pattern, with a shift at line 9 from the carved face to the carved words."
        - "It is written in free verse, without regular meter or rhyme."
      option_explanations:
        - |
          The last two lines ("bare"/"away") do not rhyme with each other, so there is no couplet; "bare" rhymes back to "appear" and "despair".
        - |
          The octave runs ABABACDC, not ABBAABBA, and the rhymes cross the octave-sestet boundary. The poem borrows the Petrarchan two-part shape loosely, not the rhyme scheme.
        - |
          Correct. The rhyme scheme is ABABACDCEDEFEF, a hybrid in which rhyme sounds carry across sections. Line 9, "And on the pedestal these words appear", moves from the face to the inscription.
        - |
          The lines are regular iambic pentameter ("STAND in | the DES | ert. NEAR | them, ON | the SAND" inverts the first foot but keeps five beats) and they rhyme, if irregularly.
      answer: 2
      explanation: |
        Spiral review of 3.C (structure). Mark the rhymes with letters before naming a sonnet type; Shelley's poem is a reminder that not every sonnet is textbook.

    - slug: u05-w14-q08
      type: fill_blank
      topic_code: "6.D"
      source: 'Percy Bysshe Shelley, "Ozymandias" (1818)'
      points: 1
      stimulus: *oz
      prompt: |
        "Ozymandias" is the Greek form of a name of the Egyptian pharaoh ____ II, a ruler famous for his monuments.
      answer: ["Ramesses", "Rameses", "Ramses", "Ramesses II", "Rameses II", "Ramses II"]
      explanation: |
        Ramesses II (13th century BCE). Knowing the referent of an allusion is step one; the essay move is explaining what the poem does with it.

    # ---- Wordsworth, "The world is too much with us"
    - slug: u05-w14-q09
      type: multiple_choice
      topic_code: "6.D"
      source: 'William Wordsworth, "The world is too much with us" (1807)'
      points: 1
      stimulus: &ww |
        *The following sonnet by William Wordsworth was published in* Poems, in Two Volumes *(1807).*

        The world is too much with us; late and soon,
        Getting and spending, we lay waste our powers;—
        Little we see in Nature that is ours;
        We have given our hearts away, a sordid boon!
        This Sea that bares her bosom to the moon;     [5]
        The winds that will be howling at all hours,
        And are up-gathered now like sleeping flowers;
        For this, for everything, we are out of tune;
        It moves us not. Great God! I'd rather be
        A Pagan suckled in a creed outworn;     [10]
        So might I, standing on this pleasant lea,
        Have glimpses that would make me less forlorn;
        Have sight of Proteus rising from the sea;
        Or hear old Triton blow his wreathèd horn.
      prompt: |
        The allusions to Proteus and Triton in lines 13-14 primarily serve to
      options:
        - "show off the speaker's classical education in contrast to the ignorance of his readers"
        - "imagine a way of seeing the sea as alive with divine presence, which the speaker prefers even to a discredited belief over the numbness of modern life"
        - "argue that ancient Greek religion is truer than Christianity"
        - "describe a storm that the speaker is watching from the shore"
      option_explanations:
        - |
          The speaker includes himself in "we"; the poem's complaint is about a shared loss of feeling, not about others' ignorance. The allusions express longing, not superiority.
        - |
          Correct. The sea gods stand for a world in which nature is charged with meaning. The speaker calls that creed "outworn" but would rather hold it than stay "out of tune", so the allusions measure what has been lost.
        - |
          The speaker calls paganism "a creed outworn" and frames the wish hypothetically ("I'd rather be"); he is not arguing for its truth, and "Great God!" is itself an exclamation from his own faith.
        - |
          The winds are "up-gathered now like sleeping flowers": the scene is calm. Proteus and Triton are imagined sights, introduced by "So might I", not a description of weather.
      answer: 1
      explanation: |
        Ask what world the allusion brings in, then how the speaker positions himself toward it. Here: a mythic, ensouled sea, wished for but admitted to be outworn.

    - slug: u05-w14-q10
      type: multiple_choice
      topic_code: "3.C"
      source: 'William Wordsworth, "The world is too much with us" (1807)'
      points: 1
      stimulus: *ww
      prompt: |
        The poem's volta occurs
      options:
        - "at line 5, when the speaker turns from people to the sea"
        - "in the middle of line 9, when the speaker moves from the collective complaint ('It moves us not') to a personal outburst ('Great God! I'd rather be')"
        - "at line 13, where a closing couplet resolves the argument"
        - "nowhere, because a Petrarchan sonnet has no turn"
      option_explanations:
        - |
          Lines 5-7 are examples supporting the octave's claim ("For this, for everything, we are out of tune"); the argument has not turned yet.
        - |
          Correct. The sestet begins at line 9 and the rhyme changes there, but the real pivot is mid-line, after the full stop. "We" becomes "I", diagnosis becomes desire.
        - |
          This is a Petrarchan sonnet (sestet CDCDCD); lines 13-14 rhyme with lines 9 and 11 ("sea", "horn"), not with each other, so there is no couplet.
        - |
          The Petrarchan form is built around a turn between octave and sestet; this poem has a clear one.
      answer: 1
      explanation: |
        Spiral review of 3.C. The octave rhymes ABBAABBA, the sestet CDCDCD. A turn placed mid-line rather than at a line break reads as an interruption, which suits the exclamation.

    - slug: u05-w14-q11
      type: true_false
      topic_code: "5.A"
