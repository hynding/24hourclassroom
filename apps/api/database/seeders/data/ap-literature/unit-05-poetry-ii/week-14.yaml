        No points for naming techniques without a claim, or for a claim that merely restates the prompt ("Shelley uses literary techniques to convey a theme").

    - slug: u05-w14-q21
      type: short_answer
      topic_code: "6.D"
      source: 'John Milton, "When I consider how my light is spent" (1673)'
      points: 3
      prompt: |
        In two or three sentences, explain how Milton's allusion to the parable of the talents shapes the speaker's anxiety in the octave, and how patience's reply in the sestet changes the terms of that parable.
      answer: |
        The parable gives the speaker a master who will return and demand an account, so his blindness becomes the terror of a servant whose talent lies buried, "Lodged with me useless", and who expects to be chided. Patience answers that God "doth not need / Either man's work or his own gifts": the master of this poem is a king with thousands of servants, so service is measured not by profit returned but by bearing "his mild yoke", and even standing and waiting counts.
      explanation: |
        1 point: identifies what the parable brings in (a master, an entrusted sum, an accounting, punishment for the servant who hid it).
        1 point: links it to the octave's anxiety with textual evidence ("Lodged with me useless", "My true account", "lest he returning chide").
        1 point: explains how the sestet revises the parable (God needs no return on his investment; service includes patient readiness, "They also serve who only stand and wait").

    - slug: u05-w14-q22
      type: long_answer
      topic_code: "7.C"
      source: 'Claude McKay, "America" (1921)'
      points: 6
      stimulus: *cm
      prompt: |
        Read carefully the poem above, Claude McKay's "America" (1921). In the poem, the speaker describes his relationship with a country that both wounds and strengthens him. In a well-written essay, analyze how McKay uses literary elements and techniques to convey the speaker's complex attitude toward America.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: McKay personifies America as a woman who is at once predator, mother and tyrant, and uses the Shakespearean sonnet's movement from confession to defiance to prophecy to show that the speaker's love and resistance are inseparable: the hostility he endures is what makes him strong enough to stand against it, and to foresee the nation's decline without hatred.

        Line of reasoning: (1) The first quatrain's "Although" clause sets love against injury: "bread of bitterness", "tiger's tooth", "Stealing my breath of life", resolved in the oxymoron "this cultured hell". (2) The second quatrain inverts the injury: her "vigor flows like tides into my blood", giving "strength erect against her hate"; the same force that harms him powers his resistance. (3) The early "Yet" (line 8) and the simile "as a rebel fronts a king in state" turn love into upright, fearless opposition, "with not a shred / Of terror, malice". (4) The final lines move from present to vision: "Darkly I gaze", "granite wonders" sinking "Like priceless treasures" under "Time's unerring hand", a prophecy that echoes Shelley's desert and grants the nation grandeur ("priceless") even as it foresees its fall. Sophistication: noting the tension of a Black, Jamaican-born poet using the most English of forms, or that "priceless" keeps the love alive in the prophecy itself.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis about the speaker's complex attitude (love and resistance, admiration and judgement), not merely "he has mixed feelings". 0 for restating the prompt or a thesis about America in general rather than the poem.

        Row B Evidence and Commentary (0-4):
        4: specific, well-chosen evidence from across the poem (for example the "Although" clause, "cultured hell", the "vigor" that gives "strength erect against her hate", the rebel simile, the closing image) with consistent commentary that explains how each technique builds the line of reasoning; addresses the poem's movement or turn.
        3: specific evidence and commentary that explain the attitude for most claims, but some evidence is summarised or the commentary is uneven; the turn or the ending may be under-explained.
        2: mostly general or summarised evidence; commentary repeats the evidence or lists techniques ("McKay uses personification and simile") without explaining their function.
        1: evidence is mostly irrelevant or summary with little or no commentary.
        0: restates the thesis or offers no relevant evidence.

        Row C Sophistication (0-1): 1 point for one of: explaining the paradox that the injury is the source of the strength; situating the poem's use of the English sonnet in the Harlem Renaissance and reading the form as part of the defiance; analysing the double attitude in the prophecy ("priceless treasures" still valued as they sink); or a consistently vivid, persuasive style. One fleeting phrase does not earn it.

        Spiral review of 7.C (commentary that links evidence to the line of reasoning) from Unit 3, applied to the Q1 poetry essay.
