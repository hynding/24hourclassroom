    # ---- Milton, "When I consider how my light is spent"
    - slug: u05-w14-q13
      type: multiple_choice
      topic_code: "6.D"
      source: 'John Milton, "When I consider how my light is spent" (1673)'
      points: 1
      stimulus: &jm |
        *The following sonnet by John Milton, who had become blind by 1652, was published in* Poems, &c. upon Several Occasions *(1673).*

        When I consider how my light is spent,
        Ere half my days, in this dark world and wide,
        And that one Talent which is death to hide
        Lodged with me useless, though my Soul more bent
        To serve therewith my Maker, and present     [5]
        My true account, lest he returning chide;
        "Doth God exact day-labour, light denied?"
        I fondly ask. But patience, to prevent
        That murmur, soon replies, "God doth not need
        Either man's work or his own gifts; who best     [10]
        Bear his mild yoke, they serve him best. His state
        Is Kingly. Thousands at his bidding speed
        And post o'er Land and Ocean without rest:
        They also serve who only stand and wait."
      prompt: |
        The allusion in lines 3-6 to the parable of the talents (Matthew 25), in which a servant who buried the money his master entrusted to him is punished on the master's return, primarily serves to
      options:
        - "suggest that the speaker has wasted his money and fears poverty"
        - "frame the speaker's blindness as a crisis of an unused God-given gift for which he expects to be judged"
        - "prove that the speaker has already been condemned by God"
        - "contrast the speaker's wealth with the poverty of the other servants"
      option_explanations:
        - |
          "Talent" begins as a coin in the parable, but the poem's talent is the speaker's gift (his vocation as a poet) that blindness has made "useless"; money is the vehicle, not the subject.
        - |
          Correct. The parable supplies the master "returning" to demand a "true account", which turns the private grief of blindness into fear of judgement. Patience's answer will revise the parable's terms.
        - |
          The speaker fears that God might "chide"; the clause "lest he returning chide" looks to a possible future, and patience goes on to dispel the fear.
        - |
          The poem draws no comparison with other servants' wealth; the "Thousands" of line 12 are God's attendants, not poorer servants.
      answer: 1
      explanation: |
        The talent is both a coin and an ability, which is how the English word "talent" came to mean a gift. The allusion supplies the master, the account and the threat.

