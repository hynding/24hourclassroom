    - slug: u05-w14-q15
      type: multiple_choice
      topic_code: "3.C"
      source: 'John Milton, "When I consider how my light is spent" (1673)'
      points: 1
      stimulus: *jm
      prompt: |
        Patience's reply begins in the middle of line 8, before the octave is complete. This placement most likely serves to
      options:
        - "show that the speaker has lost control of the sonnet form because of his distress"
        - "enact patience interrupting the complaint before it can become a full 'murmur' against God"
        - "signal that the poem is a Shakespearean sonnet rather than a Petrarchan one"
        - "delay the volta until the final couplet"
      option_explanations:
        - |
          The rhyme scheme (ABBAABBA CDECDE) is strict; the early turn is deliberate craft, not a sign of loss of control.
        - |
          Correct. "To prevent / That murmur" means to forestall it: patience arrives early, and the syntax runs from the octave into the sestet as the answer overtakes the question.
        - |
          The rhyme scheme is Petrarchan; there are no quatrains with new rhymes and no couplet.
        - |
          The turn comes early, not late, and the last two lines do not rhyme with each other ("rest", "wait").
      answer: 1
      explanation: |
        Spiral review of 3.C. When a turn arrives earlier or later than the form expects, ask what that timing dramatises.

    # ---- McKay, "America"
    - slug: u05-w14-q16
      type: multiple_choice
      topic_code: "6.A"
      source: 'Claude McKay, "America" (1921)'
      points: 1
      stimulus: &cm |
        *The following sonnet by Claude McKay, a Jamaican-born poet of the Harlem Renaissance, was first published in* The Liberator *in December 1921.*

        Although she feeds me bread of bitterness,
        And sinks into my throat her tiger's tooth,
        Stealing my breath of life, I will confess
        I love this cultured hell that tests my youth.
        Her vigor flows like tides into my blood,     [5]
        Giving me strength erect against her hate,
        Her bigness sweeps my being like a flood.
        Yet, as a rebel fronts a king in state,
        I stand within her walls with not a shred
        Of terror, malice, not a word of jeer.     [10]
        Darkly I gaze into the days ahead,
        And see her might and granite wonders there,
        Beneath the touch of Time's unerring hand,
        Like priceless treasures sinking in the sand.
      prompt: |
        The simile "as a rebel fronts a king in state" (line 8) presents the speaker's stance toward America as
      options:
        - "secret plotting against a ruler he pretends to serve"
        - "open, fearless opposition that keeps its dignity, facing a power that sits enthroned"
        - "submission to a monarch whose authority he accepts"
        - "nostalgia for a country that was once ruled by a king"
      option_explanations:
        - |
          The speaker stands "within her walls with not a shred / Of terror"; nothing is hidden, and to "front" someone is to face them directly.
        - |
          Correct. A rebel "fronting" a king faces him openly; the next lines stress the lack of "terror, malice" or "jeer". The simile turns love and resistance into one upright posture.
        - |
          A rebel does not submit; the stance is defiance, held together with the love confessed in line 4.
        - |
          The king is a figure of comparison for America's entrenched power, not a historical claim; the poem looks forward ("the days ahead"), not back.
      answer: 1
      explanation: |
        Spiral review of 6.A (simile) from week 6. Note that the "Yet" falls at line 8, a line before the Shakespearean form's usual turn.

