    - slug: u05-w15-q22
      type: long_answer
      topic_code: "7.D"
      source: 'William Wordsworth, "Composed upon Westminster Bridge, September 3, 1802" (1807)'
      points: 6
      stimulus: *wb
      prompt: |
        Read carefully the poem above, William Wordsworth's "Composed upon Westminster Bridge, September 3, 1802" (1807). In the poem, a speaker known for celebrating the countryside looks at London in the early morning. In a well-written essay, analyze how Wordsworth uses literary elements and techniques to convey the speaker's complex response to the city.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Wordsworth's speaker is astonished to find in London the majesty and calm he associates with nature, and the poem's simile, imagery and personification show that this beauty belongs to a single, fragile hour: the city is admirable precisely because, for once, it is still.

        Line of reasoning: (1) The octave's superlatives ("Earth has not any thing to show more fair") and the judgement on anyone "Dull... of soul" make awe the poem's premise. (2) The simile "like a garment, wear / The beauty of the morning" grants the beauty while limiting it: "now", a garment, can be removed. (3) Imagery joins city and nature: buildings "Open unto the fields, and to the sky", "glittering in the smokeless air", where "smokeless" implies the smoky city of other hours. (4) The volta (line 9) ranks the city above "valley, rock, or hill", the speaker's usual subjects, and shifts from seeing to feeling ("Ne'er saw I, never felt, a calm so deep!"). (5) The closing personification makes London one sleeping body, its "mighty heart... lying still": peace, with an undertone of death that explains why the scene is so moving and so brief. Sophistication: the tension between the Romantic poet of nature and his praise of a city, or the idea that the city is beautiful only when it is not being a city.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis about the speaker's complex response (for example awe tempered by the sense that the beauty is momentary, or surprise that a city can rival nature). 0 for "Wordsworth uses imagery to describe London" or a restatement of the prompt.

        Row B Evidence and Commentary (0-4):
        4: well-chosen evidence from across the sonnet (the superlative opening, the garment simile, the images of openness and "smokeless air", the volta's comparison with nature, the final personification) with commentary that consistently explains how each choice builds the line of reasoning, including the turn at line 9.
        3: specific evidence and commentary for most claims, but some commentary is thin or the turn and ending are underused.
        2: evidence is mostly general or summarised; commentary lists techniques ("he uses personification") without explaining their function in the speaker's response.
        1: summary with little or no commentary, or evidence mostly irrelevant.
        0: no relevant evidence.

        Row C Sophistication (0-1): 1 point for one of: situating the poem in Wordsworth's devotion to nature and explaining the surprise of praising a city; explaining the double sense of "lying still" or of the temporary "garment"; exploring the irony that the city is most beautiful when its life is suspended; or a consistently vivid, persuasive style.

        Spiral review of 7.D (selecting relevant and sufficient evidence): the strongest essays draw on the octave, the volta and the close, not on two lines only.
