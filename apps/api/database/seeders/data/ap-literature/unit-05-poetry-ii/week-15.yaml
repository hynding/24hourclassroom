    - slug: u05-w15-q20
      type: short_answer
      topic_code: "5.D"
      source: 'John Keats, "To Autumn" (1820)'
      points: 3
      prompt: |
        Keats's first stanza says the season and the sun conspire "To swell the gourd, and plump the hazel shells / With a sweet kernel; to set budding more, / And still more, later flowers for the bees, / Until they think warm days will never cease, / For summer has o'er-brimm'd their clammy cells." In two or three sentences, explain how the imagery in these lines conveys abundance and also hints at its limit.
      answer: |
        The tactile verbs "swell" and "plump" and the taste of the "sweet kernel" make ripeness something we can feel, and the piling up of "more, / And still more" lets the syntax overflow the line as the honey overflows the "o'er-brimm'd" cells. But the bees only "think warm days will never cease", and their mistake, along with the "later flowers" and cells already brimming over, quietly admits that this fullness is a peak beyond which there is only decline.
      explanation: |
        1 point: identifies specific sensory imagery (touch, taste, fullness) with quotation.
        1 point: explains how it conveys abundance (for example the swelling verbs, the cumulative "more, / And still more", overflowing cells).
        1 point: explains the hint of limit (the bees' false belief, "later" flowers, excess as a sign that the peak has passed). Answers that only list senses earn at most 1.

