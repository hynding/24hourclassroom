guide: guides/week-15.md
guide_description: |
  Imagery as an argument made through the senses, and personification as a way of giving a season, a city or death a
  manner and a motive. Keats's "To Autumn" stanza by stanza, Dickinson's courteous Death in the 1890 text, and
  Wordsworth's sleeping London, with a model Q1 paragraph and the difference between naming an image and explaining it.
flashcards_description: |
  32 cards on kinds of imagery, personification and apostrophe, and the key images and figures in Keats, Dickinson and
  Wordsworth.

flashcards:
  - front: Imagery → definition and what a question on it asks (5.D)
    back: |
      Language that appeals to the senses: sight, sound, touch, taste, smell, and the feel of movement. A 5.D question asks what the image does: which mood, idea, contrast or shift it builds, not merely which sense it uses.
    topic_code: "5.D"
  - front: Kinds of imagery → one example of each from "To Autumn"
    back: |
      Tactile: "plump the hazel shells". Taste: "sweet kernel". Smell: "the fume of poppies". Sight: "barred clouds bloom the soft-dying day". Sound: "the small gnats mourn", "Hedge-crickets sing". Movement: "borne aloft / Or sinking".
    topic_code: "5.D"
  - front: Image vs symbol → the difference
    back: |
      An image is a sensory detail; a symbol is an image that stands for something beyond itself and carries that meaning steadily. Dickinson's "setting sun" is an image that works symbolically (the end of life); "the stubble-plains" are an image of a reaped field.
    topic_code: "5.D"
  - front: Personification → definition and function (6.C)
    back: |
      Giving human qualities, actions or feelings to something non-human: a season, a city, death. Its function is to give the thing a manner and a motive, so the poem can describe a relationship with it.
    topic_code: "6.C"
  - front: Apostrophe → in "To Autumn"
    back: |
      Addressing someone absent or something non-human as if it could hear: "Who hath not seen thee oft amid thy store?" Keats speaks to the season as "thou", which makes the personification intimate rather than allegorical.
    topic_code: "6.C"
  - front: Personification vs apostrophe → how they differ
    back: |
      Personification gives something human traits; apostrophe speaks to it. They often come together (Donne's "Death, be not proud" does both), but a poem can personify without addressing (Dickinson's Death is "He", not "you").
    topic_code: "6.C"
  - front: Pathetic fallacy → and why AP readers use the term carefully
    back: |
      The attribution of human feeling to nature (the gnats "mourn"). John Ruskin coined the term in 1856 as a criticism; in analysis, use it neutrally and still explain the function: the mourning gnats make the evening elegiac without the speaker saying so.
    topic_code: "6.C"
  - front: '"To Autumn" → the movement across the three stanzas'
    back: |
      Stanza 1: ripening and swelling, mostly touch and taste. Stanza 2: the season as a person, at harvest, mostly sight and stillness. Stanza 3: the reaped fields at the end of the day, mostly sound. Season and day both move toward their close.
    topic_code: "5.D"
  - front: '"To Autumn" → stanza form'
    back: |
      Three eleven-line stanzas in iambic pentameter, each opening with an ABAB quatrain followed by seven lines (stanza 1 rhymes CDEDCCE, stanzas 2 and 3 CDECDDE). The extra line delays each stanza's close, a form that lingers like the season.
    topic_code: "3.C"
  - front: '"Close bosom-friend of the maturing sun" → the personification'
    back: |
      Autumn and the sun are intimate friends "Conspiring" together to "load and bless" the vines. The partnership makes ripeness a shared, almost secret project, and "maturing" works both ways: the sun is maturing the fruit and is itself past its summer height.
    topic_code: "6.C"
  - front: '"For summer has o''er-brimm''d their clammy cells" → excess'
    back: |
      The honeycomb cells overflow; the bees "think warm days will never cease". The stanza's abundance tips into a ripeness that cannot last, and the bees' mistake is the only hint of the coming cold in the whole stanza.
    topic_code: "5.D"
  - front: Autumn's four figures in stanza 2
    back: |
      Sitting "careless on a granary floor" with hair "soft-lifted by the winnowing wind"; asleep on "a half-reap'd furrow"; a "gleaner" carrying a laden head across a brook; watching by "a cyder-press". All are harvest workers, all at rest or slow.
    topic_code: "6.C"
  - front: '"Spares the next swath and all its twined flowers" → the paused hook'
    back: |
      The sleeping reaper's hook (sickle) leaves the next row uncut. For a moment the harvest, and the ending it brings, is suspended, and the flowers twined in the grain survive a little longer.
    topic_code: "5.D"
  - front: '"Thou watchest the last oozings hours by hours" → slowed time'
    back: |
      The slow vowels and the repeated "hours" stretch the line as the cider drips. Keats makes time itself feel thick and slow at the very moment it is running out ("the last oozings").
    topic_code: "5.D"
  - front: '"Where are the songs of spring? Ay, Where are they?" → the allusion'
    back: |
      The question echoes the ubi sunt ("where are they?") tradition of lament for lost things. Keats raises the lament only to dismiss it: "Think not of them, thou hast thy music too".
    topic_code: "6.D"
  - front: Stanza 3 of "To Autumn" → the soundscape
    back: |
      Gnats in a "wailful choir", lambs that "loud bleat", hedge-crickets, the red-breast's whistle, "gathering swallows" that "twitter in the skies". Autumn's own music, rich but tinged with mourning and departure.
    topic_code: "5.D"
  - front: '"While barred clouds bloom the soft-dying day" → the verb'
    back: |
      Clouds, not flowers, "bloom", and what they bloom is the dying day itself: sunset colour becomes a flowering. Ending and beauty are fused in one verb, the stanza's version of ripeness.
    topic_code: "5.D"
  - front: '"And gathering swallows twitter in the skies" → the last image'
    back: |
      Swallows gather before migrating south. The poem ends on preparation for departure without naming winter: the reader supplies what comes next, and the poem never says it.
    topic_code: "5.D"
  - front: '"To Autumn" → composition and publication'
    back: |
      Written in September 1819, after a walk near Winchester, and published in 1820 in Keats's last collection, with "Lamia" and "Isabella". Keats died in Rome in February 1821, aged twenty-five.
    topic_code: "5.D"
  - front: Dickinson's Death → what kind of figure
    back: |
      A courteous gentleman caller who "kindly stopped" because the speaker could not, and drives her at an unhurried pace ("he knew no haste"). His "civility" makes the journey a polite outing, which is what makes it unsettling.
    topic_code: "6.C"
  - front: '"The carriage held but just ourselves / And Immortality" → the third passenger'
    back: |
      Death and the speaker ride as a couple, with Immortality as a kind of chaperone. An abstraction becomes a fellow traveller, quietly announcing where the ride leads.
    topic_code: "6.C"
  - front: Dickinson's stanza 3 → the three images
    back: |
      The school where children played (childhood), the fields of "gazing grain" (maturity, ripeness), the "setting sun" (the end). The carriage passes the stages of a life, and the triple "We passed" makes them go by like scenery.
    topic_code: "5.D"
  - front: '"A swelling of the ground" → what the house is'
    back: |
      The grave: a house whose roof is "scarcely visible" and whose cornice is "but a mound". The image is understated, almost domestic, which matches Death's politeness and keeps horror out of the description.
    topic_code: "5.D"
  - front: Dickinson's meter → common meter
    back: |
      Quatrains alternating iambic tetrameter and trimeter (8-6-8-6 syllables), the meter of many hymns: "be-CAUSE i COULD not STOP for DEATH / he KIND-ly STOPPED for ME". The hymn rhythm makes a journey into death sound measured and calm.
    topic_code: "3.C"
  - front: Dickinson's 1890 text → what was changed
    back: |
      First printed in Poems (1890), edited by Mabel Loomis Todd and T. W. Higginson, titled "The Chariot", with her dashes regularised into conventional punctuation and the manuscript's fourth stanza (about the chill of the evening) left out. Later editions restore her text.
    topic_code: "5.A"
  - front: '"Since then ''t is centuries" → where the speaker stands'
    back: |
      She narrates from beyond death, centuries later, yet those centuries feel "shorter than the day" of the ride. Time inside eternity is not measured as we measure it.
    topic_code: "4.A"
  - front: '"Composed upon Westminster Bridge" → form and context'
    back: |
      A Petrarchan sonnet (ABBAABBA CDCDCD) from Poems, in Two Volumes (1807); its title, as usually printed, dates it September 3, 1802. Wordsworth, the poet of lakes and mountains, praises London at dawn, seen from the bridge over the Thames.
    topic_code: "3.C"
  - front: '"This City now doth, like a garment, wear / The beauty of the morning" → simile and personification'
    back: |
      The city is a person putting on the morning's beauty like clothing. A garment can be taken off, and "now" limits it to this hour: the beauty is real but borrowed from the dawn.
    topic_code: "6.C"
  - front: '"All bright and glittering in the smokeless air" → the hidden contrast'
    back: |
      At dawn the coal fires have not been lit, so the air is clear. "Smokeless" quietly implies the smoky city of every other hour, which the poem never describes.
    topic_code: "5.D"
  - front: '"And all that mighty heart is lying still!" → the double sense'
    back: |
      London as a living body whose heart rests in sleep. "Lying still" can also suggest the stillness of death, and the exclamation leaves the awe and the faint unease side by side.
    topic_code: "6.C"
  - front: '"The river glideth at his own sweet will" → what the personification adds'
    back: |
      The Thames moves freely, by its own pleasure, not by the commerce that usually crowds it. The line makes the river a calm, independent being, part of the sleeping city's peace.
    topic_code: "6.C"
  - front: Naming an image vs explaining it → the AP difference
    back: |
      Naming: "Keats uses auditory imagery of gnats." Explaining: "The gnats' 'wailful choir', rising and sinking 'as the light wind lives or dies', makes the end of the day sound like a funeral song, so the stanza's music carries an undertone of mourning."
    topic_code: "5.D"

quiz:
  description: |
    22 questions · about 40 minutes · about 60% this week (imagery and personification in Dickinson, Keats and
    Wordsworth) and 40% review: structure and contrast, the speaker, word function, simile, last week's allusion, and
    thesis and evidence from Unit 3. Multiple choice, select-all and true/false items are graded at once and the
    fill-in-the-blank items are matched automatically; the two short answers and the essay are graded by your teacher
    against the scoring guide.
  questions:
    # ---- Passage set: Dickinson (whole poem, 1890 text)
    - slug: u05-w15-q01
      type: multiple_choice
      topic_code: "6.C"
      source: 'Emily Dickinson, "Because I could not stop for Death" (1890)'
      points: 1
      stimulus: &ed |
        *The following poem by Emily Dickinson was first published, after her death, in* Poems *(1890), edited by Mabel Loomis Todd and T. W. Higginson, under the title "The Chariot."*

        Because I could not stop for Death,
        He kindly stopped for me;
        The carriage held but just ourselves
        And Immortality.

        We slowly drove, he knew no haste,     [5]
        And I had put away
        My labor, and my leisure too,
        For his civility.

        We passed the school where children played,
        Their lessons scarcely done;     [10]
        We passed the fields of gazing grain,
        We passed the setting sun.

        We paused before a house that seemed
        A swelling of the ground;
        The roof was scarcely visible,     [15]
        The cornice but a mound.

        Since then 't is centuries; but each
        Feels shorter than the day
        I first surmised the horses' heads
        Were toward eternity.     [20]
      prompt: |
        Death is personified in the first two stanzas chiefly as
      options:
        - "a violent abductor who seizes the speaker against her will"
        - "a courteous gentleman caller who takes the speaker for an unhurried carriage ride"
        - "a stern judge who sentences the speaker for her sins"
        - "a child who plays with the speaker on the way to school"
      option_explanations:
        - |
          Nothing in the poem is violent: Death "kindly stopped", drives slowly and shows "civility". The disquiet comes from the politeness, not from force.
        - |
          Correct. "Kindly", "knew no haste" and "civility" give Death the manners of a suitor taking a lady for a drive, and she has "put away" her work and leisure as one would for a visitor.
        - |
          The poem contains no trial or sentence; Death's role is to accompany the speaker, and the destination, "eternity", is stated without judgement.
        - |
          The children belong to the scenery the carriage passes in stanza 3; Death is the driver, an adult figure of courtesy.
      answer: 1
      explanation: |
        A 6.C item. Collect the human traits the poem gives Death (kindness, patience, civility) and name the role they add up to.

    - slug: u05-w15-q02
      type: multiple_choice
      topic_code: "5.D"
      source: 'Emily Dickinson, "Because I could not stop for Death" (1890)'
      points: 1
      stimulus: *ed
      prompt: |
        The sequence of images in lines 9-12 (the school, the grain, the setting sun) most likely suggests
      options:
        - "the speaker's regret that she never finished her own education"
        - "the stages of a human life, from childhood through maturity to its close, passing by like scenery"
        - "the route a funeral procession actually took through the speaker's town"
        - "the seasons of a single year from spring to winter"
      option_explanations:
        - |
          The schoolchildren's "lessons scarcely done" describe the scene, not the speaker's history; nothing indicates personal regret.
        - |
          Correct. Children at play, ripened grain and the setting sun trace youth, maturity and ending, and the triple "We passed" turns a lifetime into views from a carriage window.
        - |
          The ride is figurative; it carries "Immortality" and ends at "eternity". Reading it as a literal route misses why these three sights were chosen.
        - |
          The images trace a day (school hours to sunset) and a life more than a year, and there is no winter image in the stanza.
      answer: 1
      explanation: |
        5.D: images in a sequence often make an argument by their order. Ask what links them and where they lead.

    - slug: u05-w15-q03
      type: multiple_choice
      topic_code: "6.C"
      source: 'Emily Dickinson, "Because I could not stop for Death" (1890)'
      points: 1
      stimulus: *ed
      prompt: |
        In line 11, describing the grain as "gazing" has the effect of
      options:
        - "making the ripe grain an onlooker that watches the carriage pass, so the speaker becomes the one observed"
        - "showing that the grain is withered and dead"
        - "indicating that the speaker is lying in the field looking up"
        - "comparing the grain to the eyes of the schoolchildren"
      option_explanations:
        - |
          Correct. The fields watch, as if the living world were a crowd seeing her off; the transferred gaze also makes the speaker passive, carried past life rather than looking at it.
        - |
          Grain that "gazes" is upright and ripe, at the stage of maturity; nothing suggests withering.
        - |
          The speaker is in the carriage ("We passed"), not in the field; the gaze belongs to the grain.
        - |
          The grain is a separate image in the series, not a simile for the children; no "like" or "as" links them.
      answer: 0
      explanation: |
        A small personification can shift a whole relationship: here the world looks at the traveller.

    - slug: u05-w15-q04
      type: multiple_choice
      topic_code: "5.D"
      source: 'Emily Dickinson, "Because I could not stop for Death" (1890)'
      points: 1
      stimulus: *ed
      prompt: |
        The imagery of the "house" in lines 13-16 primarily serves to
      options:
        - "describe the speaker's childhood home, which she wishes to visit one last time"
        - "present the grave in understated, domestic terms, consistent with the politeness of the journey"
        - "reveal that the carriage has broken down and the travellers must stop"
        - "contrast the poverty of the house with the wealth of Death"
      option_explanations:
        - |
          A house that is "A swelling of the ground" with a roof "scarcely visible" is not a childhood home; it is sunk into the earth.
        - |
          Correct. The grave appears as a modest house whose cornice is "but a mound". The euphemism keeps the tone calm, which is precisely what makes the poem eerie.
        - |
          They "paused" before the house; nothing indicates a breakdown, and the next stanza shows the ride continuing toward "eternity".
        - |
          Death's wealth is never mentioned; the contrast the image makes is between a house and a grave, not between rich and poor.
      answer: 1
      explanation: |
        Literal level: a low house. Figurative level: a grave. The image's restraint is its function.

    - slug: u05-w15-q05
      type: multiple_choice
      topic_code: "3.C"
      source: 'Emily Dickinson, "Because I could not stop for Death" (1890)'
      points: 1
      stimulus: *ed
      prompt: |
        The poem's quatrains alternate lines of four and three stresses (common meter, the meter of many hymns). This regular structure contributes most to
      options:
        - "a sense of panic, as the short lines cut off the speaker's breath"
        - "a measured, calm progression that matches the unhurried ride and keeps the subject of death unsensational"
        - "a comic effect that mocks the idea of an afterlife"
        - "a deliberate disorder that reflects the speaker's confusion"
      option_explanations:
        - |
          The rhythm is steady and familiar, not breathless; panic would show in broken syntax or irregular lines, which the poem avoids.
        - |
          Correct. The hymn meter moves at a walking pace, like the carriage that "knew no haste", and its familiarity lets the strange journey feel orderly.
        - |
          Hymn meter is associated with worship, not comedy; the poem's irony is quiet, and it does not ridicule eternity.
        - |
          The meter is highly regular; the disorientation, if any, comes from the last stanza's treatment of time, not from the form.
      answer: 1
      explanation: |
        Spiral review of 3.C (structure). Name the form, then ask what its feel adds to the subject.

    - slug: u05-w15-q06
      type: true_false
      topic_code: "4.A"
      source: 'Emily Dickinson, "Because I could not stop for Death" (1890)'
      points: 1
      stimulus: *ed
      prompt: |
        True or false: the final stanza reveals that the speaker is recalling the carriage ride from a point long after her death.
      answer: true
      explanation: |
        True. "Since then 't is centuries" places the speaker centuries beyond the ride, yet those centuries feel "shorter than the day" she first realised where the horses were heading. Spiral review of 4.A (describing the speaker).

    - slug: u05-w15-q07
      type: multi_select
      topic_code: "6.C"
      source: 'Emily Dickinson, "Because I could not stop for Death" (1890)'
      points: 2
      partial_credit: true
      stimulus: *ed
      prompt: |
        Select the THREE phrases that give human qualities or actions to something non-human.
      options:
        - '"He kindly stopped for me" (line 2)'
        - '"he knew no haste" (line 5)'
        - '"the fields of gazing grain" (line 11)'
        - '"The roof was scarcely visible" (line 15)'
      option_explanations:
        - |
          Selected correctly: Death is given kindness and the action of stopping for a passenger, as a person would.
        - |
          Selected correctly: Death drives with a human temperament, patient and unhurried.
        - |
          Selected correctly: grain cannot gaze; the fields are given eyes and attention.
        - |
          Not personification: the roof is simply described as hard to see, which is an image of the grave, not a human trait.
      answer: [0, 1, 2]
      explanation: |
        Personification gives a thing a human trait or act. An image can describe something strange without personifying it.

    - slug: u05-w15-q08
      type: multiple_choice
      topic_code: "5.B"
      source: 'Emily Dickinson, "Because I could not stop for Death" (1890)'
      points: 1
      stimulus: *ed
      prompt: |
        The word "surmised" (line 19) contributes to the ending chiefly by suggesting that the speaker
      options:
        - "knew from the first moment exactly where Death was taking her"
        - "only gradually inferred the journey's destination, so the poem closes on a dawning realisation rather than a certainty announced"
        - "refused to believe in eternity at all"
        - "was told the destination by Immortality"
      option_explanations:
        - |
          To surmise is to guess or infer without proof; the word rules out full knowledge from the start.
        - |
          Correct. She "first surmised" the horses were heading "toward eternity": the realisation came during the ride, which makes the polite outing retrospectively ominous.
        - |
          She does conclude that the horses face eternity; surmise is uncertain inference, not refusal.
        - |
          Immortality is a silent passenger; nobody tells her anything, which is why she must surmise.
      answer: 1
      explanation: |
        Spiral review of 5.B (the function of a specific word). One verb of knowing can shift the whole poem's frame.

    # ---- "To Autumn", stanza 2
    - slug: u05-w15-q09
      type: multiple_choice
      topic_code: "6.C"
      source: 'John Keats, "To Autumn" (1820)'
      points: 1
      stimulus: &ka |
        *The following is the second stanza (lines 12-22) of John Keats's "To Autumn" (1820), which addresses the season as "thou."*

        Who hath not seen thee oft amid thy store?
        Sometimes whoever seeks abroad may find
        Thee sitting careless on a granary floor,
        Thy hair soft-lifted by the winnowing wind;     [15]
        Or on a half-reap'd furrow sound asleep,
        Drows'd with the fume of poppies, while thy hook
        Spares the next swath and all its twined flowers:
        And sometimes like a gleaner thou dost keep
        Steady thy laden head across a brook;     [20]
        Or by a cyder-press, with patient look,
        Thou watchest the last oozings hours by hours.
      prompt: |
        In this stanza Autumn is personified primarily as
      options:
        - "a tireless labourer racing to bring in the harvest before winter"
        - "a figure who appears in several harvest roles, each time resting, dozing or watching rather than hurrying"
        - "a goddess who punishes those who waste the harvest"
        - "a farmer's wife preparing food for the winter"
      option_explanations:
        - |
          Autumn sits "careless", sleeps "sound asleep", lets the hook spare "the next swath" and watches "with patient look". Nothing in the stanza races.
        - |
          Correct. Thresher on the granary floor, sleeping reaper, gleaner, cider-maker: the same figure takes on the harvest's tasks while embodying its stillness, so the season seems to linger.
        - |
          There is no judgement or punishment; the tone is drowsy and generous ("amid thy store").
        - |
          Autumn's roles are field and barn work (winnowing, reaping, gleaning, pressing), and no kitchen appears; the figure is never given a household role.
      answer: 1
      explanation: |
        6.C: collect the roles and the verbs. The verbs (sitting, asleep, keep steady, watchest) are where the personification's meaning lies.

    - slug: u05-w15-q10
      type: multiple_choice
      topic_code: "5.D"
      source: 'John Keats, "To Autumn" (1820)'
      points: 1
      stimulus: *ka
      prompt: |
        The image "Thy hair soft-lifted by the winnowing wind" (line 15) is most notable for
      options:
        - "showing that the season is old and grey-haired"
        - "blending the figure with the harvest work around it, since the wind that separates grain from chaff also gently lifts Autumn's hair"
        - "introducing a storm that will destroy the harvest"
        - "making a contrast between the speaker's restlessness and Autumn's calm"
      option_explanations:
        - |
          The colour or age of the hair is never mentioned; the image is about motion and softness, not age.
        - |
          Correct. Winnowing is the threshing-floor process of letting wind blow chaff away from grain; the same breeze plays in Autumn's hair, so person and task become one picture, soft rather than laborious.
        - |
          The wind is "soft"; there is no storm in this stanza.
        - |
          The speaker does not describe himself at all here; the stanza's attention is entirely on "thee".
      answer: 1
      explanation: |
        Know the literal process behind an image (winnowing), then ask how the poem uses it. Here the image dissolves the line between the season and its work.

    - slug: u05-w15-q11
      type: multiple_choice
      topic_code: "5.B"
      source: 'John Keats, "To Autumn" (1820)'
      points: 1
      stimulus: *ka
      prompt: |
        The phrase "the last oozings hours by hours" (line 22) contributes to the stanza chiefly by
      options:
        - "speeding up the stanza's rhythm to show time running out"
        - "slowing the line with long vowels and repetition, so time seems to thicken just as it is ending"
        - "reporting the exact time at which the cider was finished"
        - "suggesting that the cider-press is broken"
      option_explanations:
        - |
          The line is one of the slowest in the poem; "oozings" and the repeated "hours" drag rather than hurry.
        - |
          Correct. "Last" admits the ending, but "oozings" and "hours by hours" stretch it; the sound makes the reader linger as Autumn does.
        - |
          "Hours by hours" is not a clock time but a measure of patience; it stretches time rather than marks it.
        - |
          Oozing is what pressed apples do at the end of pressing; it is the press working, slowly, not failing.
      answer: 1
      explanation: |
        Spiral review of 5.B. Words have sound as well as sense; explain how both serve the meaning.

    - slug: u05-w15-q12
      type: true_false
      topic_code: "6.C"
      source: 'John Keats, "To Autumn" (1820)'
      points: 1
      stimulus: *ka
      prompt: |
        True or false: in this stanza, Autumn is shown hurrying to finish the harvest before the weather turns.
      answer: false
      explanation: |
        False. Autumn sits "careless", lies "sound asleep", lets the hook spare the next swath, and watches "with patient look". The personification is of a season pausing at its fullness.

    # ---- Wordsworth, "Composed upon Westminster Bridge"
    - slug: u05-w15-q13
      type: multiple_choice
      topic_code: "6.A"
