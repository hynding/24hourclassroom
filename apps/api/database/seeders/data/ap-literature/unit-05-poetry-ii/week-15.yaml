      stimulus: &wb |
        *The following sonnet by William Wordsworth was published in* Poems, in Two Volumes *(1807).*

        Earth has not any thing to show more fair:
        Dull would he be of soul who could pass by
        A sight so touching in its majesty:
        This City now doth, like a garment, wear
        The beauty of the morning; silent, bare,     [5]
        Ships, towers, domes, theatres, and temples lie
        Open unto the fields, and to the sky;
        All bright and glittering in the smokeless air.
        Never did sun more beautifully steep
        In his first splendour, valley, rock, or hill;     [10]
        Ne'er saw I, never felt, a calm so deep!
        The river glideth at his own sweet will:
        Dear God! the very houses seem asleep;
        And all that mighty heart is lying still!
      prompt: |
        The simile in lines 4-5 ("This City now doth, like a garment, wear / The beauty of the morning") suggests that the city's beauty is
      options:
        - "permanent, built into its stone and architecture"
        - "a covering it wears at this hour, real but borrowed from the morning and liable to be taken off"
        - "false, a disguise hiding the city's crimes"
        - "visible only to the speaker because of his imagination"
      option_explanations:
        - |
          "Now" and "wear" both limit the beauty to this moment; a garment is put on, not built in.
        - |
          Correct. A garment is worn and removed; the morning lends the city a beauty that the "smokeless air" of dawn makes possible and the working day will undo.
        - |
          The speaker's tone is awe ("so touching in its majesty"), not suspicion; a garment here adorns rather than disguises.
        - |
          He insists the opposite: only someone "Dull... of soul" could pass by. The beauty is there for anyone to see.
      answer: 1
      explanation: |
        Spiral review of 6.A (simile). Push on the vehicle: what is true of a garment that the poem wants us to transfer to the city?

