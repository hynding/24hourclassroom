  # ---- Essay (unseen poem)
  - slug: u05-exam-q44
    type: long_answer
    topic_code: "7.B"
    source: 'William Shakespeare, Sonnet 55 (1609)'
    points: 6
    stimulus: |
      *The following is Sonnet 55 from William Shakespeare's* Sonnets *(1609). "Mars his sword" means "Mars's sword."*

      Not marble, nor the gilded monuments
      Of princes, shall outlive this powerful rhyme;
      But you shall shine more bright in these contents
      Than unswept stone, besmear'd with sluttish time.
      When wasteful war shall statues overturn,     [5]
      And broils root out the work of masonry,
      Nor Mars his sword, nor war's quick fire shall burn
      The living record of your memory.
      'Gainst death, and all-oblivious enmity
      Shall you pace forth; your praise shall still find room     [10]
      Even in the eyes of all posterity
      That wear this world out to the ending doom.
      So, till the judgment that yourself arise,
      You live in this, and dwell in lovers' eyes.
    prompt: |
      Read carefully Shakespeare's Sonnet 55, above, in which the speaker addresses the person he admires. In a well-written essay, analyze how Shakespeare uses literary elements and techniques to convey the speaker's complex view of time, monuments and poetry.

      In your response you should do the following:
      - Respond to the prompt with a thesis that presents a defensible interpretation.
      - Select and use evidence to support your line of reasoning.
      - Explain how the evidence supports your line of reasoning.
      - Use appropriate grammar and punctuation in communicating your argument.
    answer: |
      Thesis: Setting the "powerful rhyme" against marble, gilded monuments and statues, Shakespeare's speaker claims that poetry outlasts every physical memorial because it lives not in stone but in each new reader's eyes; yet the sonnet's own images of war, decay and "the ending doom" reveal how much the claim depends on a future of readers that the poem can only hope for.

      Line of reasoning: (1) The first quatrain's contrast: monuments of princes and "unswept stone, besmear'd with sluttish time" against "this powerful rhyme" and the beloved who "shall shine more bright"; time is personified as a slattern who lets stone get dirty. (2) The second quatrain's violence: "wasteful war", "broils", "Mars his sword" and "war's quick fire" destroy masonry but cannot burn "The living record"; the paradox of a record that is "living". (3) The third quatrain's procession: the beloved "pace[s] forth" against "all-oblivious enmity", and praise finds "room" in "the eyes of all posterity", so survival depends on readers. (4) The couplet's limit: only "till the judgement" (Judgement Day), the beloved will "live in this, and dwell in lovers' eyes": the immortality is real but bounded, and located in future lovers. Sophistication: the irony that the poem is itself a monument that boasts of outlasting monuments, which links it to "Ozymandias"; or the observation that the poem preserves the poet's "rhyme" more vividly than any detail of the beloved, who is never described.
