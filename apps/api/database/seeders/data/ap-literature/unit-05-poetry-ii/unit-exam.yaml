  # ---- Short answers
  - slug: u05-exam-q42
    type: short_answer
    topic_code: "6.B"
    source: 'Robert Frost, "Mending Wall" (1914)'
    points: 3
    prompt: |
      In "Mending Wall," the speaker says, "Before I built a wall I'd ask to know / What I was walling in or walling out," while his neighbour twice repeats "Good fences make good neighbors." In two or three sentences, explain how Frost develops the wall as an extended metaphor, using at least two details from the poem.
    answer: |
      Frost begins with a literal stone wall that frost and hunters break and two farmers rebuild each spring, then lets its details accumulate a second meaning: the speaker's question about "walling in or walling out" turns it into any barrier people maintain between themselves, and the neighbour's inherited proverb, his "father's saying", shows that such barriers are kept by custom rather than by need. The yearly ritual, which the speaker himself begins ("I let my neighbor know"), suggests that even those who doubt walls help keep them standing.
    explanation: |
      1 point: identifies what the wall comes to stand for (barriers between people, separation kept by habit or tradition).
      1 point: supports it with at least two specific details (the question about walling in or out, the proverb, "his father's saying", the "old-stone savage", "moves in darkness", the spring ritual).
      1 point: explains how the details develop the metaphor beyond the literal wall (for example the role of custom, or the speaker's own part in the mending).

