      Row A Thesis (0-1): 1 point for a defensible thesis about the complex view (poetry outlasts monuments; immortality through readers; confidence shadowed by decay or limited by the Last Judgement). 0 for "Shakespeare says poetry lasts longer than statues" without any interpretive claim about how or with what complexity, or for restating the prompt.

      Row B Evidence and Commentary (0-4):
      4: specific evidence across the quatrains and couplet (the opening contrast, "sluttish time", the war imagery, "living record", "pace forth", "eyes of all posterity", the couplet's "till the judgement") with commentary that consistently explains how each choice builds the line of reasoning, including the sonnet's structure.
      3: specific evidence with sound commentary for most claims; the couplet or the structure may be under-explained.
      2: mostly general evidence; commentary lists devices or paraphrases ("he uses imagery of war to show that war destroys things").
      1: summary with little or no commentary.
      0: no relevant evidence.

      Row C Sophistication (0-1): 1 point for one of: exploring the tension between the boast and the poem's dependence on readers; noting the limit set by "till the judgement"; reading the sonnet alongside "Ozymandias" or McKay's "America" on monuments and time; observing that the beloved is preserved without being described; or a consistently vivid, persuasive style.

