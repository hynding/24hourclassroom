topics: ["6.B", "7.B"]
texts:
  - author: John Donne
    title: "A Valediction: Forbidding Mourning"
    year: 1633
    url: https://www.poetryfoundation.org/poems/44131/a-valediction-forbidding-mourning
  - author: Robert Frost
    title: Mending Wall
    year: 1914
