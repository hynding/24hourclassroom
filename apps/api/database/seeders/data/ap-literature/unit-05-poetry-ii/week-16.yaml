      prompt: |
        Write a defensible thesis for this prompt: "In 'The Pulley,' George Herbert imagines why God withheld one blessing from humankind. In a well-written essay, analyze how Herbert uses literary elements and techniques to convey the paradox at the heart of the poem." Your thesis should make a claim and establish a line of reasoning.
