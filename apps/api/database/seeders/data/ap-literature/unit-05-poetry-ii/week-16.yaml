    - slug: u05-w16-q21
      type: short_answer
      topic_code: "3.D"
      source: 'Robert Frost, "Mending Wall" (1914)'
      points: 2
      prompt: |
        "Mending Wall" opens with the speaker's line "Something there is that doesn't love a wall" and closes with the neighbour's "Good fences make good neighbors." In two or three sentences, explain the function of this contrast in the poem's structure.
      answer: |
        Each man has a refrain, and each says it twice: the speaker's unnamed "Something" stands for doubt and the forces that tear walls down, while the neighbour's inherited proverb stands for custom that rebuilds them. By giving the neighbour the last word, Frost lets the speaker win the argument but lose the outcome, so the wall, and the habit it represents, is still standing at the end, and the poem refuses to settle the matter as neatly as the speaker would like.
      explanation: |
        1 point: identifies the two refrains as opposed positions (questioning versus custom, unnamed force versus proverb).
        1 point: explains a function of the contrast in the structure, such as the neighbour having the final word, the balance of the poem between the two voices, or the irony that the speaker's questioning changes nothing. Spiral review of 3.D (contrast) from week 5.

    - slug: u05-w16-q22
      type: long_answer
      topic_code: "7.B"
      source: 'George Herbert, "The Pulley" (1633)'
      points: 6
      stimulus: *hp
      prompt: |
        Read carefully the poem above, George Herbert's "The Pulley" (1633), in which God, having created humankind, decides how to distribute his blessings. In a well-written essay, analyze how Herbert uses literary elements and techniques to convey a complex understanding of human restlessness.

        In your response you should do the following:
        - Respond to the prompt with a thesis that presents a defensible interpretation.
        - Select and use evidence to support your line of reasoning.
        - Explain how the evidence supports your line of reasoning.
        - Use appropriate grammar and punctuation in communicating your argument.
      answer: |
        Thesis: Herbert turns a creation story into an argument that human restlessness is a deliberate mercy: through the image of God pouring out every blessing but the last, a pun that lets humanity keep "the rest" but not rest, and the pulley conceit of the title, he shows that the dissatisfaction people feel even amid riches is the force that lifts them to God.

        Line of reasoning: (1) Stanzas 1-2 make blessings a liquid in a "glass": strength, beauty, wisdom, honour and pleasure pour out until "Rest in the bottom lay", and God's "stay" is a choice, not a shortage; the short final lines ("Contract into a span", "Rest in the bottom lay") narrow each stanza to its point. (2) Stanza 3 gives God's reason in his own voice: with rest as well, man "would adore my gifts instead of me" and "rest in Nature, not the God of Nature", so "both should losers be": the repetition of "Nature" shows how easily gift replaces giver. (3) Stanza 4's pun, "keep the rest... with repining restlessness", resolves the paradox: abundance and restlessness are given together. (4) The closing image, weariness that "May toss him to my breast", completes the unnamed pulley: the downward pull of weariness is the mechanism of ascent, and "toss" adds a note of playful, even rough, affection. Sophistication: the poem's double attitude to restlessness (a curse experienced, a mercy understood), or the tension between "If goodness lead him not" and the guarantee of weariness, which makes the poem as much about human failure as about divine design.
      explanation: |
        Row A Thesis (0-1): 1 point for a defensible thesis about the complex understanding of restlessness (for example that it is a deliberate gift, a means of grace, both suffering and mercy). 0 for "Herbert uses metaphor and dialogue to show that people are restless" (no claim about meaning) or for paraphrasing the story.

        Row B Evidence and Commentary (0-4):
        4: specific evidence from across the poem (the glass and pouring, God's "stay", the danger of resting "in Nature", the pun on "rest", the closing image and the title conceit) with commentary that consistently explains how each choice develops the line of reasoning toward the paradox.
        3: specific evidence and sound commentary for most claims; the title conceit or the pun may be mentioned without being fully explained.
        2: evidence is general or mostly paraphrase; commentary names techniques ("Herbert uses a pun") without explaining what they show about restlessness.
        1: summary of the poem with little analysis.
        0: no relevant evidence or response off-topic.

        Row C Sophistication (0-1): 1 point for one of: explaining how the unnamed pulley conceit reorganises the whole poem; exploring the tension between suffering and mercy in "repining restlessness"; noting the significance of "If goodness lead him not" (God's plan anticipates human failure); situating the poem in seventeenth-century devotional verse; or a consistently vivid, persuasive style.

        This week's focus skill, 7.B, in the full Q1 task: the thesis must carry the paradox, and the body paragraphs should follow the poem's four stanzas or its three key techniques.
