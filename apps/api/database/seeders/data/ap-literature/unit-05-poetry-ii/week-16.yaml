guide: guides/week-16.md
guide_description: |
  The extended metaphor and the metaphysical conceit: Donne's compass and beaten gold, Frost's wall, Herbert's pulley.
  Then the Q1 poetry-analysis essay from prompt to final paragraph: reading the prompt, building a thesis with a line
  of reasoning, choosing evidence, writing commentary, and what each row of the 6-point rubric rewards.
flashcards_description: |
  34 cards on extended metaphor and conceit, the key figures in Donne, Frost and Herbert, and the Q1 essay and its
  rubric.

flashcards:
  - front: Extended metaphor → definition (6.B)
    back: |
      A metaphor sustained and developed over several lines or a whole poem, with its details mapped point by point onto the subject. The function lies in what the details let the poet argue, not just in the first comparison.
    topic_code: "6.B"
  - front: Conceit → and the metaphysical conceit
    back: |
      A conceit is an elaborate, ingenious comparison. A metaphysical conceit, as in Donne and Herbert, yokes things that seem unlike (lovers and a draughtsman's compass, God's gifts and a pulley) and works out the likeness with logical precision until it persuades.
    topic_code: "6.B"
  - front: Metaphysical poets → who and what
    back: |
      Seventeenth-century poets including John Donne and George Herbert, given the label later (most influentially by Samuel Johnson in 1779, who disapproved). Marks: argumentative structure, learned imagery from science and theology, conversational openings, paradox and wit.
    topic_code: "6.B"
  - front: '"A Valediction: Forbidding Mourning" → the title'
    back: |
      A valediction is a farewell speech. This one forbids mourning: the speaker, about to travel, argues that his beloved should not weep, because their love does not depend on physical presence.
    topic_code: "6.B"
  - front: '"A Valediction: Forbidding Mourning" → occasion and publication'
    back: |
      According to Izaak Walton's life of Donne, written for his wife Anne before Donne's journey to the Continent in 1611. Published in Donne's Poems (1633), two years after his death.
    topic_code: "6.B"
  - front: Donne's opening simile → virtuous men dying
    back: |
      The lovers should part as quietly as good men die, so gently that friends cannot tell the moment ("The breath goes now, and some say, No"). A death-bed comparison sets the tone for a parting without fuss.
    topic_code: "6.A"
  - front: '"No tear-floods, nor sigh-tempests move" → what Donne rejects'
    back: |
      The exaggerated weather of conventional love poetry: floods of tears, storms of sighs. The compound words mock that hyperbole, and the speaker wants a parting without public display.
    topic_code: "5.B"
  - front: '"To tell the laity our love" → the religious metaphor'
    back: |
      The lovers are like priests, initiates of a sacred mystery; ordinary people are the "laity". Weeping in public would be "profanation", revealing the sacred to the uninitiated.
    topic_code: "6.B"
  - front: '"trepidation of the spheres" → Donne''s astronomy'
    back: |
      In the old Ptolemaic picture of the cosmos, the heavenly spheres had a trembling motion (trepidation) far greater than any earthquake yet harmless to people. The lovers' parting is like that: vast but quiet. Earthquakes ("Moving of th' earth") stand for ordinary lovers' noisy grief.
    topic_code: "6.D"
  - front: '"Dull sublunary lovers'' love" → what "sublunary" means'
    back: |
      Beneath the moon: in the old cosmology, the realm of change and decay. Ordinary lovers' love, "Whose soul is sense", depends on the body and cannot survive absence; the speaker's refined love can.
    topic_code: "5.A"
  - front: '"Like gold to airy thinness beat" → the first metaphor for parting'
    back: |
      Gold can be hammered into leaf so thin it is almost air without breaking. The lovers' souls, being one, undergo "not yet / A breach, but an expansion": distance stretches the union but cannot split it, and gold keeps the love precious.
    topic_code: "6.B"
  - front: Donne's compass conceit → the mapping
    back: |
      A pair of drawing compasses. The beloved's soul is "the fixed foot" at the centre; the speaker's is the foot that travels. The fixed foot "leans and hearkens" after the moving one and "grows erect" as it returns. Two legs, one instrument.
    topic_code: "6.B"
  - front: '"Thy firmness makes my circle just, / And makes me end where I begun" → why a circle'
    back: |
      Because the centre stays firm, the circle is drawn true ("just"), and the moving foot returns to its starting point. The circle, an old emblem of perfection and eternity, guarantees the traveller's return home.
    topic_code: "6.B"
  - front: '"A Valediction: Forbidding Mourning" → form'
    back: |
      Nine quatrains of iambic tetrameter rhyming ABAB. The steady, compact stanzas suit an argument made calmly, step by step, like a proof.
    topic_code: "3.C"
  - front: '"Mending Wall" → form and first publication'
    back: |
      Forty-five lines of blank verse (unrhymed iambic pentameter) with the rhythms of speech. The opening poem of Frost's North of Boston (1914).
    topic_code: "3.C"
  - front: '"Something there is that doesn''t love a wall" → the syntax'
    back: |
      Inverted word order puts "Something" first and leaves it unnamed. The line returns at line 35, and the speaker never names the force; he hints at frost heave ("frozen-ground-swell") and teases with "Elves".
    topic_code: "5.B"
  - front: '"Good fences make good neighbors" → the neighbour''s proverb'
    back: |
      Repeated twice (lines 27 and 45) and the last words of the poem. It is inherited ("his father's saying"), not reasoned; the speaker questions it, but the poem lets the neighbour have the final line.
    topic_code: "6.B"
  - front: '"He is all pine and I am apple orchard" → what the line argues'
    back: |
      The two men are identified with their trees. Apple trees cannot "eat the cones under his pines", so the wall protects nothing: the speaker's case that this particular wall is pointless.
    topic_code: "5.B"
  - front: '"like an old-stone savage armed" → the simile for the neighbour'
    back: |
      Carrying a stone in each hand, the neighbour looks like a Stone Age warrior. The simile makes wall-building primitive and slightly menacing, and it reveals the speaker's own condescension.
    topic_code: "6.A"
  - front: '"He moves in darkness as it seems to me" → literal and figurative'
    back: |
      Literally the shade of the trees; figuratively ignorance, unthinking tradition. Frost adds "Not of woods only and the shade of trees" so the figurative sense cannot be missed, and "as it seems to me" marks it as the speaker's view.
    topic_code: "5.A"
  - front: '"Mending Wall" → who calls the neighbour to mend the wall?'
    back: |
      The speaker: "I let my neighbor know beyond the hill". The one who doubts walls is the one who starts the mending each spring, an irony that complicates any reading of him as simply right.
    topic_code: "6.B"
  - front: The wall in "Mending Wall" → what the extended metaphor can stand for
    back: |
      Any barrier people maintain between themselves by habit: privacy, property, reserve, tradition. The poem works the details out (gaps no one sees made, the yearly ritual, stones "loaves" and "balls") without reducing the wall to one meaning.
    topic_code: "6.B"
  - front: '"The Pulley" → the title as conceit'
    back: |
      A pulley lifts a weight by pulling down on a rope. God withholds rest so that human restlessness and weariness, pulling on us, will lift us up to Him: "May toss him to my breast". The title is the poem's governing metaphor and is never named in the text.
    topic_code: "6.B"
  - front: '"Having a glass of blessings standing by" → the image'
    back: |
      God pours gifts from a glass: strength, beauty, wisdom, honour, pleasure flow out, and "Rest in the bottom lay" like the last of a drink. Blessings become a liquid one can run out of.
    topic_code: "6.B"
  - front: '"rest" in "The Pulley" → the pun'
    back: |
      Rest means repose (the one blessing withheld) and the remainder ("Yet let him keep the rest", the other gifts). Humanity keeps the rest and lacks rest; the pun carries the poem's whole argument.
    topic_code: "5.A"
  - front: '"And rest in Nature, not the God of Nature" → the danger God foresees'
    back: |
      If humans had peace as well as gifts, they would be content with creation and forget the Creator, adoring "my gifts instead of me". Then "both should losers be": humanity and God.
    topic_code: "6.B"
  - front: '"repining restlessness" → what God grants instead'
    back: |
      Discontented, complaining unease. Even wealth will leave people "rich and weary", and weariness, if goodness does not, will drive them to God.
    topic_code: "5.B"
  - front: '"The Pulley" → stanza form and its effect'
    back: |
      Four five-line stanzas rhyming ABABA, lines of three, five, five, five and three stresses. Each stanza narrows at its close, as the world's riches "Contract into a span" in stanza 1.
    topic_code: "3.C"
  - front: The Q1 prompt → what it asks
    back: |
      A poem (sometimes with a sentence of context) and the task: analyze how the poet uses literary elements and techniques to convey a specific idea, attitude, relationship or experience. You choose the techniques; the prompt chooses the subject. About 40 minutes.
    topic_code: "7.B"
  - front: Q1 Row A → the thesis point
    back: |
      0-1 point for a defensible interpretation of the poem that responds to the prompt. It can be more than one sentence if together, and it can appear anywhere, though the opening is the safest place. Restating the prompt or summarising earns 0.
    topic_code: "7.B"
  - front: Q1 Row B → evidence and commentary (0-4)
    back: |
      The heart of the score. 4 = specific evidence throughout, with commentary that consistently explains how it supports a line of reasoning. 3 = same, but commentary uneven. 2 = some evidence, commentary repeats or lists. 1 = summary. Explanation, not quotation, moves the score.
    topic_code: "7.B"
  - front: Q1 Row C → sophistication (0-1)
    back: |
      Earned by complexity sustained through the essay: exploring tensions or ambiguities, situating the poem in a broader context, considering alternative readings, or a vivid, persuasive style. A single sweeping sentence does not earn it.
    topic_code: "7.B"
  - front: Line of reasoning → in a poetry essay
    back: |
      The logical path from thesis to conclusion: the order of claims each body paragraph makes. A thesis that names the techniques or stages of the poem (octave and sestet, the three images) maps that path in advance.
    topic_code: "7.B"
  - front: A defensible thesis → test it
    back: |
      Could a reasonable reader disagree, and can the poem support it? "Donne compares love to a compass" fails (fact). "Donne's compass conceit turns separation into proof of union" passes (arguable and supportable).
    topic_code: "7.B"

quiz:
  description: |
    22 questions · about 45 minutes · about 60% this week (extended metaphor in Donne, Frost and Herbert, and thesis
    writing for the Q1 essay) and 40% review: imagery and personification from week 15, allusion and literal versus
    figurative meaning from week 14, structure and contrast from week 5, and the speaker's perspective from week 12.
    Multiple choice, select-all and true/false items are graded at once and the fill-in-the-blank items are matched
    automatically; the two short answers and the essay are graded by your teacher against the scoring guide.
  questions:
    # ---- Passage set: Donne, stanzas 6-9
    - slug: u05-w16-q01
      type: multiple_choice
      topic_code: "6.B"
      source: 'John Donne, "A Valediction: Forbidding Mourning" (1633)'
      points: 1
      stimulus: &dv |
        *The following lines are the last four stanzas (lines 21-36) of John Donne's "A Valediction: Forbidding Mourning," published in his* Poems *(1633). The speaker, about to travel, addresses the woman he loves.*

        Our two souls therefore, which are one,
        Though I must go, endure not yet
        A breach, but an expansion,
        Like gold to airy thinness beat.

        If they be two, they are two so     [25]
        As stiff twin compasses are two;
        Thy soul, the fixed foot, makes no show
        To move, but doth, if the other do.

        And though it in the center sit,
        Yet when the other far doth roam,     [30]
        It leans and hearkens after it,
        And grows erect, as that comes home.

        Such wilt thou be to me, who must,
        Like th' other foot, obliquely run;
        Thy firmness makes my circle just,     [35]
        And makes me end where I begun.
      prompt: |
        In lines 25-36, the comparison of the lovers' souls to "stiff twin compasses" primarily serves to
      options:
        - "suggest that the lovers are rigid and unfeeling toward each other"
        - "argue that the separation leaves the two souls joined in one instrument, with the beloved's steadiness ensuring the speaker's return"
        - "show that the speaker is a mathematician who measures his love precisely"
        - "admit that the lovers will drift apart as the compass legs spread"
      option_explanations:
        - |
          "Stiff" describes the compass's construction, not the lovers' feelings; the fixed foot "leans and hearkens", which is tender, not unfeeling.
        - |
          Correct. Compass legs are joined at the top, so however far one foot travels the two remain one tool; the centre's firmness "makes my circle just" and brings the traveller back to where he began.
        - |
          Precision is part of the conceit's wit, but the speaker's profession is not the point; the instrument is chosen for how its legs relate.
        - |
          The legs spread only as far as the joint allows and close again "as that comes home"; the conceit insists on return, not drift.
      answer: 1
      explanation: |
        6.B: an extended metaphor works by its details. List what a compass does (joined legs, fixed centre, moving foot, closing, a circle) and map each onto the lovers.

    - slug: u05-w16-q02
      type: multiple_choice
      topic_code: "6.B"
      source: 'John Donne, "A Valediction: Forbidding Mourning" (1633)'
      points: 1
      stimulus: *dv
      prompt: |
        The comparison in lines 21-24 ("Like gold to airy thinness beat") presents the lovers' separation as
      options:
        - "a violent blow that will eventually shatter their love"
        - "a stretching that thins the union without breaking it, while keeping the love precious"
        - "a loss of value, since beaten gold is worth less"
        - "a transformation of their love into something airy and unreal"
      option_explanations:
        - |
          Gold is beaten, but the point of the image is that it does not break: the souls "endure not yet / A breach".
        - |
          Correct. Gold is malleable enough to be hammered into leaf almost as thin as air without a gap opening. Distance is "an expansion", not a breach, and gold keeps the love's worth.
        - |
          Beaten gold loses no value; gold leaf is still gold. The image stresses durability and worth.
        - |
          "Airy thinness" describes the extent of the stretch, not unreality; the love becomes wider, not weaker.
      answer: 1
      explanation: |
        A metaphor's vehicle (gold) brings its properties: malleable, precious, unbreakable. Ask which property the poem needs.

    - slug: u05-w16-q03
      type: multiple_choice
      topic_code: "3.C"
      source: 'John Donne, "A Valediction: Forbidding Mourning" (1633)'
      points: 1
      stimulus: *dv
      prompt: |
        The final line, "And makes me end where I begun," is effective as a conclusion chiefly because
      options:
        - "it introduces a new comparison that replaces the compass"
        - "it completes the circle both in the conceit and in the poem's argument, ending on the promised return home"
        - "it admits that the speaker's journey was pointless"
        - "it breaks the poem's rhyme scheme to show the speaker's grief"
      option_explanations:
        - |
          The line finishes the compass conceit rather than replacing it: the moving foot completes its circle.
        - |
          Correct. A compass's circle closes where it started; so does the speaker's journey, and so does the poem, which ends on reassurance that answers its opening plea against mourning.
        - |
          The return is the reward of the beloved's "firmness", not a judgement on the journey; the speaker "must" go.
        - |
          "Begun" rhymes with "run" as the ABAB pattern requires; the stanza is regular.
      answer: 1
      explanation: |
        Spiral review of 3.C (structure). Endings in conceit poems often complete the figure and the argument at once.

    - slug: u05-w16-q04
      type: multiple_choice
      topic_code: "5.A"
      source: 'John Donne, "A Valediction: Forbidding Mourning" (1633)'
      points: 1
      stimulus: *dv
      prompt: |
        Read literally, "It leans and hearkens after it, / And grows erect, as that comes home" (lines 31-32) describes
      options:
        - "a woman waiting at a window for her husband"
        - "the fixed foot of a compass tilting as the other foot moves away and straightening as it is brought back in"
        - "a plant bending toward the sun"
        - "a soldier standing to attention"
      option_explanations:
        - |
          That is the figurative meaning the lines suggest; literally the subject "it" is the fixed foot of the compass.
        - |
          Correct. When one leg swings out, the centre leg tilts toward it; when the legs close, it stands upright again. Donne's verbs ("leans", "hearkens") also give the foot human attentiveness, the figurative level.
        - |
          No plant appears in the conceit; the antecedent of "it" is the fixed foot named in line 27.
        - |
          "Grows erect" describes the compass leg straightening, not a military posture.
      answer: 1
      explanation: |
        Spiral review of 5.A. Trace the pronoun back to its noun, read literally, then see what the figurative level adds ("hearkens", to listen longingly).

    - slug: u05-w16-q05
      type: true_false
      topic_code: "6.B"
      source: 'John Donne, "A Valediction: Forbidding Mourning" (1633)'
      points: 1
      stimulus: *dv
      prompt: |
        True or false: the compass conceit presents the beloved as entirely passive, contributing nothing while the speaker travels.
      answer: false
      explanation: |
        False. The fixed foot "makes no show / To move, but doth, if the other do"; it "leans and hearkens" after the traveller; and "Thy firmness makes my circle just". Her steadiness is what makes his journey complete.

    - slug: u05-w16-q06
      type: multi_select
      topic_code: "6.B"
      source: 'John Donne, "A Valediction: Forbidding Mourning" (1633)'
      points: 2
      partial_credit: true
      stimulus: *dv
      prompt: |
        Select the THREE details that extend the compass metaphor.
      options:
        - '"Thy soul, the fixed foot" (line 27)'
        - '"Like th'' other foot, obliquely run" (line 34)'
        - '"Thy firmness makes my circle just" (line 35)'
        - '"Like gold to airy thinness beat" (line 24)'
      option_explanations:
        - |
          Selected correctly: the beloved's soul is mapped onto the compass's centre point.
        - |
          Selected correctly: the speaker is the moving foot, which runs "obliquely", at a slant, as a compass leg does while drawing.
        - |
          Selected correctly: the steady centre makes the circle accurate ("just"), completing the figure.
        - |
          Not part of the compass: the beaten gold is a separate, earlier metaphor for the same separation.
      answer: [0, 1, 2]
      explanation: |
        Donne offers two figures in a row, the gold and then the compass. Keep them distinct when you write about them.

    - slug: u05-w16-q07
      type: fill_blank
      topic_code: "6.B"
      source: general knowledge
      points: 1
      prompt: |
        An elaborate, ingenious extended comparison between things that seem unlike, such as Donne's lovers and a pair of compasses, is called a metaphysical ____.
      answer: ["conceit"]
      explanation: |
        A conceit. The word once meant simply a concept or idea; the metaphysical conceit is the witty, argumentative kind.

    # ---- Frost, "Mending Wall", lines 28-45
    - slug: u05-w16-q08
      type: multiple_choice
      topic_code: "6.B"
      source: 'Robert Frost, "Mending Wall" (1914)'
      points: 1
      stimulus: &fm |
        *The following lines end Robert Frost's "Mending Wall," the opening poem of* North of Boston *(1914). Each spring the speaker and his neighbour walk the stone wall between their farms, replacing fallen stones; just before these lines, the neighbour has said, "Good fences make good neighbors."*

        Spring is the mischief in me, and I wonder
        If I could put a notion in his head:
        "*Why* do they make good neighbors? Isn't it     [30]
        Where there are cows? But here there are no cows.
        Before I built a wall I'd ask to know
        What I was walling in or walling out,
        And to whom I was like to give offense.
        Something there is that doesn't love a wall,     [35]
        That wants it down." I could say "Elves" to him,
        But it's not elves exactly, and I'd rather
        He said it for himself. I see him there
        Bringing a stone grasped firmly by the top
        In each hand, like an old-stone savage armed.     [40]
        He moves in darkness as it seems to me,
        Not of woods only and the shade of trees.
        He will not go behind his father's saying,
        And he likes having thought of it so well
        He says again, "Good fences make good neighbors."     [45]
      prompt: |
        In these lines, the wall functions most clearly as an extended metaphor for
      options:
        - "the legal boundaries that protect each farmer's property from theft"
        - "barriers that people maintain between themselves out of habit and inherited belief rather than reasoned need"
        - "the natural forces of frost and weather that destroy human work"
        - "the speaker's wish to keep strangers out of his life"
      option_explanations:
        - |
          The speaker argues the wall protects nothing here ("here there are no cows"); the poem's interest is in why it is kept, not in property law.
        - |
          Correct. The speaker asks what he would be "walling in or walling out", and the neighbour answers only with "his father's saying". The wall becomes any division kept up by custom rather than thought.
        - |
          The "Something" that "doesn't love a wall" is the force against the wall; the wall itself stands for what humans keep building.
        - |
          The speaker is the one questioning walls in this passage; wanting to keep strangers out is the attitude he probes, not the one he voices.
      answer: 1
      explanation: |
        6.B: an extended metaphor's meaning grows from its details: the yearly ritual, the inherited proverb, the question of what is walled in or out.

    - slug: u05-w16-q09
      type: multiple_choice
      topic_code: "6.C"
      source: 'Robert Frost, "Mending Wall" (1914)'
      points: 1
      stimulus: *fm
      prompt: |
        The line "Something there is that doesn't love a wall, / That wants it down" (lines 35-36) personifies an unnamed force chiefly in order to
      options:
        - "identify that force precisely as frost heave so that the neighbour will understand"
        - "suggest that nature itself seems to oppose walls, while the speaker leaves the force mysterious and refuses to name it"
        - "prove that elves really exist on the speaker's farm"
        - "show that the speaker hates his neighbour"
      option_explanations:
        - |
          The force is never named; the speaker deliberately leaves it as "Something", and he wants the neighbour to reach the thought "for himself".
        - |
          Correct. Giving the force love and wants makes the wall's collapse seem like a will in the world, and leaving it unnamed keeps the idea open; the joke about "Elves" shows the speaker knows it is not literal.
        - |
          "It's not elves exactly": the speaker raises elves playfully and drops them at once.
        - |
          The speaker teases and judges the neighbour, but the personified force is about walls, not about personal hatred.
      answer: 1
      explanation: |
        Spiral review of 6.C from week 15. Ask what the human trait (loving, wanting) makes possible for the poem's argument.

    - slug: u05-w16-q10
      type: multiple_choice
      topic_code: "5.D"
      source: 'Robert Frost, "Mending Wall" (1914)'
      points: 1
      stimulus: *fm
      prompt: |
        The image of the neighbour "Bringing a stone grasped firmly by the top / In each hand, like an old-stone savage armed" (lines 39-40) primarily conveys
      options:
        - "admiration for the neighbour's physical strength"
        - "the speaker's sense that the neighbour's wall-building is primitive and faintly threatening, an attitude that also reveals the speaker's condescension"
        - "that the neighbour is about to attack the speaker with stones"
        - "the historical age of the wall"
      option_explanations:
        - |
          Strength is visible, but "savage" and "armed" turn it into something unthinking and warlike rather than admirable.
        - |
          Correct. The Stone Age simile makes the act ancient and unreflective, and "He moves in darkness" follows; at the same time, the image tells us how the speaker sees, and judges, his neighbour.
        - |
          "Armed" is part of the simile; the neighbour is carrying stones to the wall, not threatening anyone.
        - |
          "Old-stone" refers to the Old Stone Age, characterising the man, not dating the wall.
      answer: 1
      explanation: |
        Spiral review of 5.D (imagery). An image characterises both what is seen and who is seeing it.

    - slug: u05-w16-q11
      type: multiple_choice
      topic_code: "4.C"
      source: 'Robert Frost, "Mending Wall" (1914)'
      points: 1
      stimulus: *fm
      prompt: |
        Which best describes the speaker's perspective in these lines?
      options:
        - "Bitter and hostile: he wants to end all contact with the neighbour."
        - "Playful and questioning, with a superior edge: he teases the neighbour's proverb, wants him to think for himself, and casts him as one who 'moves in darkness'."
        - "Humble and uncertain: he believes the neighbour is wiser than he is."
        - "Indifferent: he does not care whether the wall stands or falls."
      option_explanations:
        - |
          He wants to "put a notion in his head", not to cut him off; the tone is mischievous, not bitter.
        - |
          Correct. "Spring is the mischief in me", the imagined argument, "I'd rather / He said it for himself", and the judgement that the neighbour "moves in darkness" combine humour with condescension.
        - |
          He judges the neighbour's thinking as unexamined ("He will not go behind his father's saying"); there is no sign he defers to it.
        - |
          He cares enough to build an argument and to imagine the neighbour's mind; he is engaged, not indifferent.
      answer: 1
      explanation: |
        Spiral review of 4.C (diction that reveals a speaker's perspective) from week 12. Collect the speaker's words about himself and about the neighbour.

    # ---- Herbert, "The Pulley" (whole poem)
    - slug: u05-w16-q12
      type: multiple_choice
      topic_code: "6.B"
      source: 'George Herbert, "The Pulley" (1633)'
      points: 1
      stimulus: &hp |
        *The following poem by George Herbert was published in* The Temple *(1633).*

        When God at first made man,
        Having a glass of blessings standing by,
        "Let us," said he, "pour on him all we can.
        Let the world's riches, which dispersèd lie,
        Contract into a span."     [5]

        So strength first made a way;
        Then beauty flowed, then wisdom, honour, pleasure.
        When almost all was out, God made a stay,
        Perceiving that, alone of all his treasure,
        Rest in the bottom lay.     [10]

        "For if I should," said he,
        "Bestow this jewel also on my creature,
        He would adore my gifts instead of me,
        And rest in Nature, not the God of Nature;
        So both should losers be.     [15]

        "Yet let him keep the rest,
        But keep them with repining restlessness;
        Let him be rich and weary, that at least,
        If goodness lead him not, yet weariness
        May toss him to my breast."     [20]
      prompt: |
        The title "The Pulley" is best understood as a metaphor for
      options:
        - "the machinery God used to lift the world's riches into a single span"
        - "the way restlessness and weariness, pulling on human beings, work to draw them upward to God"
        - "the cycle of wealth and poverty in human societies"
        - "the poet's own labour in hoisting his verses into shape"
      option_explanations:
        - |
          The riches "Contract into a span" by divine command; no machinery is described. The pulley belongs to the poem's purpose, not its first stanza.
        - |
          Correct. A pulley lifts a load when its rope is pulled down. The downward pull of "repining restlessness" and weariness is what will "toss him to my breast": affliction becomes the mechanism of ascent.
        - |
          The poem says humans may be "rich and weary"; it is about why wealth does not satisfy, not about economic cycles.
        - |
          Nothing in the poem refers to the act of writing; the drama is between God and "man".
      answer: 1
      explanation: |
        6.B: when a title names a metaphor the poem never mentions, the reader has to supply the mapping. Ask what a pulley does, then find it in the last stanza.

