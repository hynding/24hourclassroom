    # ---- Short answer
    - slug: chem-u06-w22-q21
      type: short_answer
      topic_code: "6.3"
      source: "general knowledge"
      points: 3
      prompt: |
        A student dissolves 3.00 g of an unknown molecular compound in 40.0 g of water. The solution freezes at −0.930 °C. (K_f = 1.86 °C/m.) Answer (a), (b) and (c).

        (a) Calculate the molality of the solution.
        (b) Calculate the molar mass of the compound.
        (c) The student later learns the compound is actually ionic and gives two ions per formula unit. Explain how this changes the molar mass calculation, and give the corrected value.
      answer: |
        (a) m = ΔT_f/(i × K_f) = 0.930/(1 × 1.86) = 0.500 m.
        (b) Moles = 0.500 mol/kg × 0.0400 kg = 0.0200 mol; M = 3.00 g/0.0200 mol = 150 g/mol.
        (c) With i = 2, the 0.500 m of particles corresponds to only 0.250 m of formula units, so the moles are 0.250 × 0.0400 = 0.0100 mol and M = 3.00/0.0100 = 300 g/mol. Ignoring the van 't Hoff factor makes the molar mass come out too small by the factor i.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 0.500 m.

        (b) 1 pt: 0.0200 mol and 150 g/mol.

        (c) 1 pt: dividing the particle molality by i = 2 gives 0.250 m, 0.0100 mol and 300 g/mol, with the explanation that each formula unit contributed two particles.

    - slug: chem-u06-w22-q22
      type: short_answer
      topic_code: "6.3"
      source: "general knowledge"
      points: 3
      stimulus: |
        Two winter products are compared. Product A is rock salt, NaCl (58.44 g/mol). Product B is calcium chloride, CaCl₂ (110.98 g/mol). A homeowner spreads 1.00 kg of each on separate patches of ice at −8 °C. Assume each dissolves in 10.0 kg of meltwater on its patch. (K_f = 1.86 °C/m.)
      prompt: |
        Using the information, answer (a), (b) and (c).

        (a) Calculate the freezing point of the meltwater on each patch.
        (b) State which product melts ice at −8 °C and which does not, and explain how you decided.
        (c) Explain why a given mass of CaCl₂, despite containing fewer formula units than the same mass of NaCl, is not necessarily the weaker de-icer.
      answer: |
        (a) NaCl: 1,000 g ÷ 58.44 = 17.1 mol; m = 17.1/10.0 = 1.71 m; i = 2; ΔT_f = 2 × 1.86 × 1.71 = 6.37 °C, freezing point −6.4 °C. CaCl₂: 1,000 ÷ 110.98 = 9.01 mol; m = 0.901 m; i = 3; ΔT_f = 3 × 1.86 × 0.901 = 5.03 °C, freezing point −5.0 °C.
        (b) Neither product's solution would stay liquid at −8 °C at these amounts, because both freezing points (−6.4 and −5.0 °C) are above −8 °C; the ice would refreeze. NaCl comes closer. (With less meltwater, both become more concentrated and could work.)
        (c) The de-icing effect depends on the total number of particles, i × moles. CaCl₂ supplies three ions per formula unit against NaCl's two, which makes up for part of its smaller number of moles per kilogram (27.0 mol of particles versus 34.2 mol here). CaCl₂ also releases heat as it dissolves and works at lower temperatures in practice, so mass alone does not settle which is better.
      explanation: |
        Three points, one per part.

        (a) 1 pt: both freezing points approximately correct (NaCl about −6.4 °C, CaCl₂ about −5.0 °C), with i applied.

        (b) 1 pt: comparison of each freezing point with −8 °C and the conclusion that neither solution stays liquid at these dilutions (NaCl closer). Accept a correct conclusion that follows from the student's own part (a) values.

        (c) 1 pt: i × moles is what counts; CaCl₂'s three ions per unit offset its fewer moles per gram; credit also for noting its exothermic dissolving.

    # ---- Long answer
    - slug: chem-u06-w22-q23
      type: long_answer
      topic_code: "6.3"
      source: "general knowledge"
      points: 6
      prompt: |
        A manufacturer wants to label a bottle of antifreeze (ethylene glycol, C₂H₆O₂, 62.07 g/mol) with the freezing point and boiling point of a mixture of 500 g of glycol in 1.50 kg of water, and to explain to customers why the same product protects against both freezing and boiling over.

        Write a full account that (1) calculates the molality of the mixture; (2) calculates its freezing point and its boiling point at 1 atm (K_f = 1.86 °C/m, K_b = 0.512 °C/m), stating any assumption about the van 't Hoff factor; (3) explains, with a particle model, why one solute changes both the freezing point and the boiling point, and in which direction each moves; and (4) explains why dissolving the same mass of table salt would protect against freezing even more strongly, but why salt is not used in car radiators.
      answer: |
        (1) Moles of glycol: 500 g ÷ 62.07 g/mol = 8.06 mol. Molality: 8.06 mol / 1.50 kg = 5.37 m.

        (2) Ethylene glycol is a molecular compound, so i = 1. ΔT_f = 1 × 1.86 × 5.37 = 9.99 °C, giving a freezing point of about −10.0 °C. ΔT_b = 1 × 0.512 × 5.37 = 2.75 °C, giving a boiling point of about 102.8 °C. (At this high concentration the simple formulas are approximate; the real freezing point is somewhat lower.)

        (3) Dissolved glycol molecules take up part of the liquid's surface without evaporating, so the vapour pressure of the water is lowered. Because boiling requires vapour pressure to reach the external pressure, the mixture must be hotter than 100 °C to boil: the boiling point moves up. At the cold end, glycol molecules interfere with water molecules joining the ice crystal, so the mixture must be colder than 0 °C before freezing wins: the freezing point moves down. One cause, the dilution of water by solute particles, produces both shifts.

        (4) NaCl gives two ions per formula unit (i = 2) and has a smaller molar mass (58.44 g/mol), so 500 g of salt gives 8.56 mol × 2 = 17.1 mol of particles against glycol's 8.06 mol, roughly twice the freezing-point depression. But salt water corrodes the steel, aluminium and copper of a radiator and engine, it has limited solubility (about 36 g per 100 g of water, so 500 g would not all dissolve in 1.50 kg), and it crystallises on cooling, blocking passages. Glycol is noncorrosive with inhibitors, fully miscible and raises the boiling point usefully.
      explanation: |
        Six points.

        Molality (0–1): 8.06 mol and 5.37 m (accept 5.3–5.4).

        Freezing and boiling points (0–2): 1 pt for i = 1 stated and freezing point about −10.0 °C (accept −9.9 to −10.1); 1 pt for boiling point about 102.8 °C (accept 102.7–102.8).

        Particle model (0–2): 1 pt for vapour-pressure lowering explaining the raised boiling point (vapour pressure must reach external pressure); 1 pt for solute interference with crystallisation explaining the lowered freezing point; both directions correct.

        Salt comparison (0–1): salt's i = 2 and lower molar mass give more particles per gram, so a larger depression; not used because of corrosion, limited solubility or crystallisation (any one valid reason).

        Common errors: using 1.50 g instead of 1.50 kg; forgetting that ΔT_f is subtracted from 0 °C; claiming salt would not work; using i = 2 for glycol.
