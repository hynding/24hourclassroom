week: 22
unit: 6
title: "Colligative Properties"
topics: ["6.3"]
guide: guides/week-22.md
guide_description: |
  Why a dissolved solute lowers the vapour pressure, raises the boiling point and lowers the freezing point of a
  solvent in proportion to the number of particles, not their identity. Molality, Raoult's law, ΔT = i·K·m with
  water's constants, the van 't Hoff factor for ionic solutes, finding a molar mass from a freezing-point
  depression, and osmosis, with antifreeze, road salt and intravenous fluids as the examples.
flashcards_description: |
  27 cards on molality, the particle model of colligative properties, vapour-pressure lowering, boiling-point
  elevation, freezing-point depression, the van 't Hoff factor and osmosis.

flashcards:
  - front: Colligative property → definition and the four examples
    back: |
      A solution property that depends on the number of dissolved solute particles per amount of solvent, not on their identity: vapour-pressure lowering, boiling-point elevation, freezing-point depression and osmotic pressure.
    topic_code: "6.3"
  - front: Molality → definition, formula and unit
    back: |
      Moles of solute per kilogram of solvent: m = n_solute / kg_solvent, in mol/kg (written m). 1.00 mol of sucrose in 1.00 kg of water is 1.00 m.
    topic_code: "6.3"
  - front: Molality versus molarity → the two differences
    back: |
      Molality divides by kilograms of solvent; molarity divides by litres of solution. Molality does not change with temperature (mass is constant), which is why colligative formulas use it.
    topic_code: "6.3"
  - front: Molality of 17.1 g sucrose in 200.0 g water
    back: |
      17.1 g ÷ 342.30 g/mol = 0.0500 mol; 200.0 g = 0.2000 kg; m = 0.0500/0.2000 = 0.250 m.
    topic_code: "6.3"
  - front: Particle model → why a solute lowers vapour pressure
    back: |
      Solute particles occupy part of the liquid's surface and do not evaporate, so fewer solvent molecules escape per second. Equilibrium is reached at a lower vapour pressure.
    topic_code: "6.3"
  - front: Raoult's law for a nonvolatile solute
    back: |
      P_solution = X_solvent × P°_solvent. With 1.00 mol glucose in 9.00 mol water at 25 °C: X = 0.900, P = 0.900 × 23.8 torr = 21.4 torr.
    topic_code: "6.3"
  - front: Particle model → why the boiling point rises
    back: |
      The solute lowers the vapour pressure, so the solution must be heated above the pure solvent's boiling point before its vapour pressure reaches the external pressure (1 atm).
    topic_code: "6.3"
  - front: Particle model → why the freezing point falls
    back: |
      Solute particles get in the way of solvent molecules trying to join the growing crystal, so the solution must be cooled further before freezing wins over melting.
    topic_code: "6.3"
  - front: Boiling-point elevation → the formula and water's constant
    back: |
      ΔT_b = i × K_b × m, with K_b = 0.512 °C/m for water. The new boiling point is 100.00 °C + ΔT_b.
    topic_code: "6.3"
  - front: Freezing-point depression → the formula and water's constant
    back: |
      ΔT_f = i × K_f × m, with K_f = 1.86 °C/m for water. The new freezing point is 0.00 °C − ΔT_f.
    topic_code: "6.3"
  - front: Why K_f is larger than K_b for water
    back: |
      K_f = 1.86 and K_b = 0.512 °C/m, so the same solution's freezing point drops almost four times as much as its boiling point rises. The constants come from the solvent's heats of fusion and vaporisation.
    topic_code: "6.3"
  - front: van 't Hoff factor → definition and ideal values
    back: |
      i is the number of particles one formula unit gives in solution: 1 for molecules (sugar, urea, glycol), 2 for NaCl or KNO₃, 3 for CaCl₂ or Na₂SO₄, 4 for AlCl₃. Real ionic values are slightly lower because of ion pairing.
    topic_code: "6.3"
  - front: Ethylene glycol antifreeze → 4.00 m solution's boiling and freezing points
    back: |
      i = 1. ΔT_b = 0.512 × 4.00 = 2.05 °C, so it boils at 102.05 °C; ΔT_f = 1.86 × 4.00 = 7.44 °C, so it freezes at −7.44 °C. Real coolant is more concentrated and freezes near −37 °C.
    topic_code: "6.3"
  - front: Calcium chloride on icy roads → why it beats sugar
    back: |
      1.00 m CaCl₂ has i = 3, so ΔT_f = 3 × 1.86 × 1.00 = 5.58 °C and it freezes at −5.58 °C; 1.00 m sugar gives only −1.86 °C. Three particles per formula unit, three times the effect.
    topic_code: "6.3"
  - front: Ranking solutions by freezing point → the rule
    back: |
      Compare i × m, not m alone. 0.20 m NaCl (0.40 particles) freezes lower than 0.10 m Na₂SO₄ (0.30 particles). Larger i × m means lower freezing point and higher boiling point.
    topic_code: "6.3"
  - front: Molar mass from freezing-point depression → the three steps
    back: |
      m = ΔT_f/(i × K_f); moles = m × kg of solvent; M = grams ÷ moles. 2.00 g in 50.0 g water lowering the freezing point by 0.620 °C: m = 0.333, n = 0.01667 mol, M = 120 g/mol.
    topic_code: "6.3"
  - front: Nonvolatile solute → what the word means and why it matters
    back: |
      A solute with negligible vapour pressure of its own (salt, sugar). Raoult's law in the simple form assumes it; a volatile solute like ethanol adds its own vapour and the vapour pressure may rise.
    topic_code: "6.3"
  - front: Osmosis → definition
    back: |
      The net flow of solvent through a semipermeable membrane from the side with fewer solute particles to the side with more. The membrane passes solvent molecules but not solute particles.
    topic_code: "6.3"
  - front: Osmotic pressure → definition
    back: |
      The pressure that must be applied to the more concentrated solution to stop osmosis. Like the other colligative properties, it is proportional to the particle concentration.
    topic_code: "6.3"
  - front: Why intravenous fluids must match blood's particle concentration
    back: |
      Blood is about 0.3 m in particles. Pure water injected into a vein would flow into red blood cells by osmosis and burst them; a solution more concentrated than blood would shrivel them.
    topic_code: "6.3"
  - front: Wilting cucumber slices in salt water → the explanation
    back: |
      Osmosis: the salt water has more solute particles than the cell contents, so water leaves the cells through their membranes and the slices go limp.
    topic_code: "6.3"
  - front: Making ice cream with rock salt → the colligative reason
    back: |
      Salt dissolved in the ice-water bath lowers its freezing point well below 0 °C, so the bath can be colder than 0 °C while still liquid, cold enough to freeze the cream mixture.
    topic_code: "6.3"
  - front: Error spotting → reporting ΔT_f as the freezing point
    back: |
      ΔT_f is the depression, the amount the freezing point falls. A depression of 1.49 °C means the solution freezes at 0.00 − 1.49 = −1.49 °C.
    topic_code: "6.3"
  - front: Error spotting → grams of water in a molality
    back: |
      Molality needs kilograms. 0.0500 mol in 200.0 g of water is 0.0500/0.2000 = 0.250 m, not 0.0500/200.0 = 0.00025.
    topic_code: "6.3"
  - front: Why molality rather than molarity for colligative properties
    back: |
      The effects depend on the ratio of solute particles to solvent molecules, which a mass of solvent captures directly, and the ratio must not drift as the solution is heated or cooled; volume (and so molarity) changes with temperature.
    topic_code: "6.3"
  - front: Boiling point of 0.500 mol KBr in 1.00 kg water
    back: |
      i = 2 and m = 0.500, so ΔT_b = 2 × 0.512 × 0.500 = 0.512 °C; the solution boils at 100.51 °C.
    topic_code: "6.3"
  - front: Same molality, different solutes → which has the lowest freezing point
    back: |
      The one with the largest van 't Hoff factor. For 0.10 m solutions: AlCl₃ (i = 4) < CaCl₂ (3) < NaCl (2) < glucose (1) in freezing point.
    topic_code: "6.3"

quiz:
  description: |
    23 questions · about 40 minutes · topic 6.3 (colligative properties: molality, vapour-pressure lowering,
    boiling-point elevation, freezing-point depression, the van 't Hoff factor and osmosis), with review of ionic
    and covalent compounds (3.1, 3.3), the mole (4.4), mole fraction (5.4), vapour pressure and boiling (5.6) and
    molarity (6.2). Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Stimulus set A: freezing points of 0.100 m solutions (6.3, 3.1)
    - slug: chem-u06-w22-q01
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Measured freezing points of four aqueous solutions, each 0.100 m in solute:

        | Solute | Freezing point (°C) |
        |---|---|
        | glucose, C₆H₁₂O₆ | −0.186 |
        | sodium chloride, NaCl | −0.372 |
        | calcium chloride, CaCl₂ | −0.558 |
        | unknown X | −0.372 |
      prompt: |
        Why is the freezing-point depression of the NaCl solution twice that of the glucose solution?
      options:
        - "Sodium chloride has a larger molar mass than glucose."
        - "Sodium chloride is more soluble in water than glucose."
        - "Each NaCl formula unit dissolves into two ions, so the solution contains twice as many solute particles."
        - "Chloride ions form hydrogen bonds with water, which lowers the freezing point."
      option_explanations:
        - |
          NaCl's molar mass (58.44) is smaller than glucose's (180.16), and molar mass does not affect a colligative property once the molality is fixed.
        - |
          Both solutes are fully dissolved at 0.100 m; solubility is not the issue.
        - |
          Correct. Freezing-point depression depends on the number of particles: i = 2 for NaCl, so 0.100 m NaCl is 0.200 m in particles, giving 2 × 1.86 × 0.100 = 0.372 °C.
        - |
          Hydrogen bonding is not what colligative properties depend on; the count of particles is.
      answer: 2

    - slug: chem-u06-w22-q02
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Measured freezing points of four aqueous solutions, each 0.100 m in solute:

        | Solute | Freezing point (°C) |
        |---|---|
        | glucose, C₆H₁₂O₆ | −0.186 |
        | sodium chloride, NaCl | −0.372 |
        | calcium chloride, CaCl₂ | −0.558 |
        | unknown X | −0.372 |
      prompt: |
        What freezing point would you predict for a 0.300 m glucose solution?
      options:
        - "−0.558 °C"
        - "−0.186 °C"
        - "−0.062 °C"
        - "−1.67 °C"
      option_explanations:
        - |
          Correct. ΔT_f is proportional to molality: 3 × 0.186 = 0.558 °C, so the solution freezes at −0.558 °C, the same as 0.100 m CaCl₂, which also has 0.300 m of particles.
        - |
          −0.186 °C is the value for 0.100 m glucose; tripling the molality triples the depression.
        - |
          −0.062 °C would be a third of the depression, for 0.0333 m.
        - |
          −1.67 °C would require about 0.90 m of particles; 0.300 m glucose has only 0.300 m.
      answer: 0

    - slug: chem-u06-w22-q03
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Measured freezing points of four aqueous solutions, each 0.100 m in solute:

        | Solute | Freezing point (°C) |
        |---|---|
        | glucose, C₆H₁₂O₆ | −0.186 |
        | sodium chloride, NaCl | −0.372 |
        | calcium chloride, CaCl₂ | −0.558 |
        | unknown X | −0.372 |
      prompt: |
        The unknown X gives the same freezing point as NaCl. Which substance could X be?
      options:
        - "Sucrose, C₁₂H₂₂O₁₁"
        - "Potassium nitrate, KNO₃"
        - "Magnesium chloride, MgCl₂"
        - "Aluminium chloride, AlCl₃"
      option_explanations:
        - |
          Sucrose is a molecular compound (i = 1) and would give −0.186 °C, like glucose.
        - |
          Correct. KNO₃ is ionic and dissolves into K⁺ and NO₃⁻, two particles per formula unit (i = 2), matching NaCl's −0.372 °C.
        - |
          MgCl₂ gives three ions (Mg²⁺ + 2 Cl⁻), so i = 3 and a freezing point near −0.558 °C.
        - |
          AlCl₃ gives four ions (Al³⁺ + 3 Cl⁻), so i = 4 and a freezing point near −0.744 °C.
      answer: 1
      explanation: |
        Review of 3.1: the ions in a formula unit are what the van 't Hoff factor counts.

    # ---- Single items
    - slug: chem-u06-w22-q04
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly describes a colligative property?
      options:
        - "It depends on the chemical identity of the solute but not on its concentration."
        - "It depends on the mass of solute dissolved per litre of solution."
        - "It is a property of the pure solvent that does not change when a solute is added."
        - "It depends on the number of solute particles per amount of solvent, regardless of what the particles are."
      option_explanations:
        - |
          The identity is exactly what does not matter; the concentration of particles is what does.
        - |
          Mass is not the measure: 1 g of NaCl has far more particles than 1 g of sucrose and a much larger effect.
        - |
          Colligative properties are the changes a solute causes; they are defined by the solute's presence.
        - |
          Correct. Vapour-pressure lowering, boiling-point elevation, freezing-point depression and osmotic pressure all scale with the particle concentration alone.
      answer: 3

    - slug: chem-u06-w22-q05
      type: multiple_choice
      topic_code: "6.3"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        What is the molality of a solution made from 36.0 g of glucose (180.16 g/mol) dissolved in 400.0 g of water?
      options:
        - "0.0900 m"
        - "0.500 m"
        - "0.200 m"
        - "90.0 m"
      option_explanations:
        - |
          0.0900 m uses 36.0 ÷ 400 without converting grams of glucose to moles.
        - |
          Correct. 36.0 ÷ 180.16 = 0.200 mol; 400.0 g = 0.4000 kg; m = 0.200/0.4000 = 0.500 m.
        - |
          0.200 is the number of moles of glucose, not the molality; it must be divided by 0.4000 kg.
        - |
          90.0 is 36.0/0.400, the grams of glucose per kilogram, not moles per kilogram.
      answer: 1

    - slug: chem-u06-w22-q06
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A nonvolatile solute is dissolved in water. According to the particle model, why is the vapour pressure of the solution lower than that of pure water at the same temperature?
      options:
        - "Solute particles occupy part of the surface and do not evaporate, so fewer water molecules escape per second."
        - "The solute makes the water molecules move more slowly."
        - "The solute absorbs water vapour from above the solution."
        - "The solute raises the temperature needed for water to evaporate at all."
      option_explanations:
        - |
          Correct. With part of the surface blocked by solute, the escape rate falls, and equilibrium with the vapour is reached at a lower pressure; Raoult's law puts this as P = X_solvent × P°.
        - |
          At the same temperature the water molecules have the same average kinetic energy with or without solute.
        - |
          A nonvolatile solute neither releases nor absorbs vapour; it simply dilutes the surface.
        - |
          Water evaporates at every temperature; the solute lowers the equilibrium vapour pressure rather than switching evaporation off.
      answer: 0

    - slug: chem-u06-w22-q07
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which aqueous solution has the highest boiling point?
      options:
        - "0.20 m sucrose"
        - "0.15 m NaCl"
        - "0.12 m CaCl₂"
        - "0.25 m urea, CO(NH₂)₂"
      option_explanations:
        - |
          Sucrose gives 1 × 0.20 = 0.20 m of particles.
        - |
          NaCl gives 2 × 0.15 = 0.30 m of particles, close but less than calcium chloride.
        - |
          Correct. CaCl₂ gives 3 × 0.12 = 0.36 m of particles, the largest i × m, so the largest ΔT_b and the highest boiling point.
        - |
          Urea is molecular (i = 1), so 0.25 m of particles.
      answer: 2

    - slug: chem-u06-w22-q08
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A bag made of a membrane that passes water but not sugar is filled with 10% sugar solution and placed in a beaker of pure water. What happens?
      options:
        - "Sugar flows out of the bag until the concentrations are equal."
        - "Nothing, because the membrane blocks all movement."
        - "Water flows out of the bag into the beaker."
        - "Water flows into the bag, which swells, because solvent moves toward the side with more solute particles."
      option_explanations:
        - |
          The membrane does not pass sugar; only water can move.
        - |
          The membrane is semipermeable: water molecules pass through it freely.
        - |
          Osmosis moves solvent toward the more concentrated solution, which is inside the bag.
        - |
          Correct. More water molecules strike the membrane from the pure-water side than from the sugar side, so there is a net flow into the bag until the pressure inside (osmotic pressure) balances it.
      answer: 3

    - slug: chem-u06-w22-q09
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        At 100 °C and 1 atm, pure water boils but a salt solution does not. Which statement explains why, using the definition of boiling?
      options:
        - "The salt raises the external pressure on the solution."
        - "The solution's vapour pressure at 100 °C is below 1 atm, so it must be heated further before vapour pressure equals the external pressure."
        - "Salt prevents bubbles from forming at any temperature."
        - "The salt absorbs the heat so the solution cannot reach 100 °C."
      option_explanations:
        - |
          The external pressure is the atmosphere, unchanged by what is dissolved.
        - |
          Correct. Boiling happens when vapour pressure equals external pressure; the solute lowers the vapour pressure, so the matching point moves above 100 °C.
        - |
          A salt solution boils readily, just at a higher temperature.
        - |
          The solution reaches 100 °C and keeps warming until its vapour pressure reaches 1 atm.
      answer: 1
      explanation: |
        Review of 5.6: boiling-point elevation is vapour-pressure lowering seen through the definition of boiling.

    - slug: chem-u06-w22-q10
      type: multiple_choice
      topic_code: "4.4"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        How many moles of ethylene glycol, C₂H₆O₂ (62.07 g/mol), are in 31.0 g?
      options:
        - "0.499 mol"
        - "2.00 mol"
        - "1,920 mol"
        - "0.0310 mol"
      option_explanations:
        - |
          Correct. 31.0 g ÷ 62.07 g/mol = 0.499 mol, almost exactly half a mole.
        - |
          2.00 is 62.07/31.0, the ratio upside down; a mass smaller than the molar mass must be less than one mole.
        - |
          1,920 is 31.0 × 62.07, which multiplies instead of dividing.
        - |
          0.0310 is the mass in kilograms, not an amount in moles.
      answer: 0
      explanation: |
        Review of 4.4: every molality begins with grams ÷ molar mass.

    - slug: chem-u06-w22-q11
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A solution contains 0.500 mol of KNO₃ in 250.0 mL of solution. What is its molarity, and why is this NOT the same as its molality?
      options:
        - "0.125 M; molality would be higher because it uses grams of solvent."
        - "0.500 M; molality and molarity are the same for aqueous solutions."
        - "2.00 M; molality would be about the same but not identical, because 250.0 mL of solution is not 0.2500 kg of water."
        - "2.00 M; molality would be exactly 2.00 m because water's density is 1.00 g/mL."
      option_explanations:
        - |
          0.125 comes from multiplying by 0.2500 L instead of dividing.
        - |
          0.500 is the number of moles, not the molarity, and the two units differ in definition.
        - |
          Correct. M = 0.500/0.2500 L = 2.00 M. Molality divides by kilograms of solvent; the solution's 250.0 mL includes the volume of the dissolved KNO₃, so the water mass is less than 250 g and the molality is somewhat different.
        - |
          The density argument would hold only for pure water; a 2.00 M solution contains a large mass of solute in that volume.
      answer: 3
      explanation: |
        Review of 6.2: molarity is per litre of solution; molality is per kilogram of solvent. They converge only for very dilute aqueous solutions.

    # ---- Select all
    - slug: chem-u06-w22-q12
      type: multi_select
      topic_code: "6.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about colligative properties of aqueous solutions are correct? Select all that apply.
      options:
        - "Adding a nonvolatile solute lowers the vapour pressure of the water."
        - "A 1.0 m NaCl solution has a lower freezing point than a 1.0 m sucrose solution."
        - "For the same molality, the boiling-point elevation of a solution is larger than its freezing-point depression."
        - "Osmotic pressure increases with the concentration of solute particles."
        - "Freezing-point depression is larger for solutes with larger molar masses at the same molality."
      option_explanations:
        - |
          Correct. Solute particles at the surface reduce the rate of evaporation, so the equilibrium vapour pressure falls.
        - |
          Correct. NaCl gives two particles per formula unit (i = 2), so its freezing-point depression is about twice that of sucrose.
        - |
          For water K_f (1.86) is larger than K_b (0.512), so the freezing point moves almost four times as far as the boiling point.
        - |
          Correct. Osmotic pressure is a colligative property, proportional to the particle concentration.
        - |
          Molar mass is irrelevant once molality is fixed; only the number of particles matters.
      answer: [0, 1, 3]

    - slug: chem-u06-w22-q13
      type: multi_select
      topic_code: "3.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of these solutes dissolve in water as intact molecules, so that their van 't Hoff factor is 1? Select all that apply.
      options:
        - "Sucrose, C₁₂H₂₂O₁₁"
        - "Potassium bromide, KBr"
        - "Ethanol, C₂H₅OH"
        - "Urea, CO(NH₂)₂"
        - "Sodium sulfate, Na₂SO₄"
      option_explanations:
        - |
          Correct. Sucrose is a covalent molecule held together by shared electrons; it dissolves whole.
        - |
          KBr is ionic, a metal with a nonmetal, and dissolves as K⁺ and Br⁻ (i = 2).
        - |
          Correct. Ethanol is a covalent molecule that hydrogen-bonds with water but does not ionise.
        - |
          Correct. Urea is a covalent, molecular compound; it stays intact in solution.
        - |
          Na₂SO₄ is ionic and gives 2 Na⁺ + SO₄²⁻, three particles (i = 3).
      answer: [0, 2, 3]
      explanation: |
        Review of 3.3: covalent (molecular) compounds stay as molecules in water; ionic compounds separate into their ions.

    # ---- True / false
    - slug: chem-u06-w22-q14
      type: true_false
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Because colligative properties depend only on the number of particles, 0.10 m solutions of glucose and of urea have the same freezing point.
      answer: true
      explanation: |
        True. Both are molecular compounds (i = 1), so 0.10 m of either gives 0.10 m of particles and the same ΔT_f = 1.86 × 0.10 = 0.19 °C. Their different molar masses, structures and sweetness are irrelevant.

    - slug: chem-u06-w22-q15
      type: true_false
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In any solution that contains a solute, the mole fraction of the solvent is less than 1.
      answer: true
      explanation: |
        True. Mole fractions of all components add to 1, so once any solute is present the solvent's share is below 1. Raoult's law, P = X_solvent × P°, then guarantees that the vapour pressure of the solution is below that of the pure solvent.

    # ---- Fill in the blank
    - slug: chem-u06-w22-q16
      type: fill_blank
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Molality is the number of moles of solute per ____ of solvent.
      answer: ["kilogram", "kg", "kilogramme"]
      explanation: |
        Per kilogram of solvent, a mass, which does not change with temperature. This is what distinguishes molality from molarity (per litre of solution).

    - slug: chem-u06-w22-q17
      type: fill_blank
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The ideal van 't Hoff factor for calcium chloride, CaCl₂, is ____.
      answer: ["3", "three"]
      explanation: |
        CaCl₂ dissolves as one Ca²⁺ and two Cl⁻, three particles per formula unit, so its colligative effects are three times those of a molecular solute at the same molality.

    # ---- Numeric
    - slug: chem-u06-w22-q18
      type: numeric
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
