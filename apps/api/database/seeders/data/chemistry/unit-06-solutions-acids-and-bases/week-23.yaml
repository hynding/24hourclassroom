week: 23
unit: 6
title: "Acids, Bases, pH and pOH"
topics: ["6.4", "6.5"]
guide: guides/week-23.md
guide_description: |
  The properties of acids and bases, the Arrhenius and Brønsted–Lowry definitions with conjugate pairs, strong
  versus weak (extent of ionisation, with the lists to memorise), the reactions of acids with metals, carbonates and
  bases, then water's self-ionisation, K_w, and the pH and pOH calculations for strong acids and bases, including
  the tenfold-per-unit logic of the scale and significant figures in a pH.
flashcards_description: |
  29 cards on acid and base properties, the two definitions, conjugate pairs, strong and weak acids and bases,
  K_w, and converting between concentration, pH and pOH.

flashcards:
  - front: Observable properties of acids → the list
    back: |
      Sour taste, turn blue litmus red, conduct electricity in solution, react with active metals to release H₂, react with carbonates to release CO₂, neutralise bases. All are properties of H₃O⁺.
    topic_code: "6.4"
  - front: Observable properties of bases → the list
    back: |
      Bitter taste, slippery feel, turn red litmus blue, conduct electricity in solution, neutralise acids. All are properties of OH⁻.
    topic_code: "6.4"
  - front: Arrhenius definitions of acid and base
    back: |
      An Arrhenius acid produces H⁺ (as H₃O⁺) when dissolved in water; an Arrhenius base produces OH⁻. HCl and NaOH are the textbook examples. Limited to water and to bases containing hydroxide.
    topic_code: "6.4"
  - front: Brønsted–Lowry definitions of acid and base
    back: |
      An acid is a proton (H⁺) donor; a base is a proton acceptor. Broader than Arrhenius: ammonia is a base because it accepts a proton from water, even though it contains no OH⁻.
    topic_code: "6.4"
  - front: Hydronium ion → what H₃O⁺ is
    back: |
      A proton bonded to a water molecule. A bare H⁺ cannot exist in water, so "H⁺(aq)" and "H₃O⁺(aq)" mean the same thing and either is accepted in equations.
    topic_code: "6.4"
  - front: Conjugate acid–base pair → definition and how to spot one
    back: |
      Two species that differ by exactly one proton. The acid loses H⁺ to become its conjugate base; the base gains H⁺ to become its conjugate acid. HCl/Cl⁻, NH₄⁺/NH₃, H₂O/OH⁻, H₃O⁺/H₂O.
    topic_code: "6.4"
  - front: Conjugate pairs in NH₃ + H₂O ⇌ NH₄⁺ + OH⁻
    back: |
      Water donates a proton, so water is the acid and OH⁻ its conjugate base; ammonia accepts it, so NH₃ is the base and NH₄⁺ its conjugate acid.
    topic_code: "6.4"
  - front: Amphoteric → definition and the classic example
    back: |
      Able to act as either an acid or a base. Water accepts a proton from HCl (base) and donates one to NH₃ (acid). HCO₃⁻ and HSO₄⁻ are also amphoteric.
    topic_code: "6.4"
  - front: Strong acid versus weak acid → the real difference
    back: |
      Extent of ionisation. A strong acid ionises completely (0.10 M HCl is 0.10 M in H⁺); a weak acid ionises only partly (0.10 M acetic acid is about 1% ionised) and is written with ⇌.
    topic_code: "6.4"
  - front: The strong acids to memorise
    back: |
      HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄ (and HClO₃). Everything else common, including HF, CH₃COOH, H₂CO₃ and H₃PO₄, is weak.
    topic_code: "6.4"
  - front: The strong bases to memorise
    back: |
      The soluble hydroxides: LiOH, NaOH, KOH (group 1) and Ca(OH)₂, Sr(OH)₂, Ba(OH)₂. Ammonia, NH₃, is the standard weak base.
    topic_code: "6.4"
  - front: Strong versus concentrated → why they are different words
    back: |
      Strong/weak describes how completely an acid ionises; concentrated/dilute describes how much is dissolved. Glacial acetic acid is concentrated but weak; 0.001 M HCl is dilute but strong.
    topic_code: "6.4"
  - front: Acid plus active metal → products and example
    back: |
      A salt and hydrogen gas, for metals above hydrogen in the activity series. Zn(s) + 2 HCl(aq) → ZnCl₂(aq) + H₂(g). Copper and silver do not react.
    topic_code: "6.4"
  - front: Acid plus carbonate → products and example
    back: |
      A salt, water and carbon dioxide. CaCO₃(s) + 2 HCl(aq) → CaCl₂(aq) + H₂O(l) + CO₂(g). The fizz is the test for limestone and the way antacids relieve excess stomach acid.
    topic_code: "6.4"
  - front: Net ionic equation for a strong acid reacting with a strong base
    back: |
      H⁺(aq) + OH⁻(aq) → H₂O(l). The spectator ions (Na⁺, Cl⁻, etc.) are left out; every strong acid–strong base neutralisation has this same net equation.
    topic_code: "6.4"
  - front: Litmus and phenolphthalein → colours in acid and base
    back: |
      Litmus is red in acid and blue in base. Phenolphthalein is colourless below about pH 8.2 and pink above it, which makes it useful for spotting the end of a strong acid–strong base titration.
    topic_code: "6.4"
  - front: Self-ionisation of water → the equation
    back: |
      2 H₂O(l) ⇌ H₃O⁺(aq) + OH⁻(aq). One water molecule passes a proton to another. It happens to a tiny extent: 1.0 × 10⁻⁷ M of each ion in pure water at 25 °C.
    topic_code: "6.5"
  - front: K_w → the expression and its value at 25 °C
    back: |
      K_w = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴. The product is fixed, so raising [H⁺] lowers [OH⁻] and vice versa. Every aqueous solution contains both ions.
    topic_code: "6.5"
  - front: Finding [OH⁻] from [H⁺] with K_w
    back: |
      [OH⁻] = 1.0 × 10⁻¹⁴ / [H⁺]. In 0.0050 M HCl, [OH⁻] = 1.0 × 10⁻¹⁴ / 5.0 × 10⁻³ = 2.0 × 10⁻¹² M.
    topic_code: "6.5"
  - front: pH → definition and the reverse formula
    back: |
      pH = −log[H⁺], and [H⁺] = 10⁻ᵖᴴ. A lower pH means more H⁺. pH 7 is neutral at 25 °C; below 7 acidic, above 7 basic.
    topic_code: "6.5"
  - front: pOH → definition and its link to pH
    back: |
      pOH = −log[OH⁻], [OH⁻] = 10⁻ᵖᴼᴴ, and pH + pOH = 14.00 at 25 °C (from K_w). A solution with pOH 2.70 has pH 11.30.
    topic_code: "6.5"
  - front: One pH unit → what factor in [H⁺]
    back: |
      A factor of ten. pH 3 has ten times the H⁺ concentration of pH 4 and one hundred times that of pH 5. Two units apart means a hundredfold difference, never "twice".
    topic_code: "6.5"
  - front: pH of a strong acid solution → the method
    back: |
      Complete ionisation, so for a monoprotic strong acid (HCl, HBr, HI, HNO₃, HClO₄) [H⁺] equals the acid's molarity. pH of 0.025 M HCl = −log(0.025) = 1.60.
    topic_code: "6.5"
  - front: pH of a strong base solution → the method
    back: |
      [OH⁻] equals the base's molarity times the number of hydroxides per formula unit; find pOH = −log[OH⁻], then pH = 14.00 − pOH. 0.0020 M NaOH: pOH 2.70, pH 11.30.
    topic_code: "6.5"
  - front: pH of 0.010 M Ba(OH)₂
    back: |
      Each Ba(OH)₂ releases two OH⁻, so [OH⁻] = 0.020 M; pOH = −log(0.020) = 1.70; pH = 14.00 − 1.70 = 12.30.
    topic_code: "6.5"
  - front: Concentration from pH → the calculator steps
    back: |
      [H⁺] = 10⁻ᵖᴴ: enter the negative pH, then 10ˣ. A soft drink of pH 3.20 has [H⁺] = 10⁻³·²⁰ = 6.3 × 10⁻⁴ M.
    topic_code: "6.5"
  - front: Significant figures in a pH
    back: |
      Only the digits after the decimal point are significant. A concentration with two significant figures (0.025 M) gives a pH with two decimal places (1.60); the digit before the point records the power of ten.
    topic_code: "6.5"
  - front: Typical pH values to know
    back: |
      Gastric juice about 2, lemon juice 2–3, vinegar about 3, black coffee about 5, pure water 7, blood 7.4, household ammonia about 11, 1 M NaOH 14.
    topic_code: "6.5"
  - front: Error spotting → pH of a base reported as 2.70
    back: |
      −log(0.0020) = 2.70 is the pOH of 0.0020 M NaOH, not its pH. A base must have pH above 7: pH = 14.00 − 2.70 = 11.30.
    topic_code: "6.5"

quiz:
  description: |
    23 questions · about 40 minutes · topics 6.4 and 6.5 (acid and base definitions and properties, strong and
    weak, reactions of acids, K_w, pH and pOH), with review of significant figures (1.4), ions and naming (3.2,
    3.4), reaction types and the activity series (4.2, 4.3) and molarity (6.2). Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: pH of household substances (6.5, 6.4)
    - slug: chem-u06-w23-q01
      type: multiple_choice
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Approximate pH values of some everyday liquids at 25 °C:

        | Liquid | pH |
        |---|---|
        | lemon juice | 2.3 |
        | vinegar | 2.9 |
        | milk | 6.6 |
        | blood | 7.4 |
        | baking soda solution | 8.3 |
        | ammonia cleaner | 11.5 |
      prompt: |
        By what factor is the hydrogen ion concentration of lemon juice greater than that of the baking soda solution?
      options:
        - "6"
        - "1,000,000 (10⁶)"
        - "60"
        - "3.6"
      option_explanations:
        - |
          The pH values differ by 6 units, but each unit is a factor of ten in concentration, not an additive step.
        - |
          Correct. pH 2.3 to pH 8.3 is six units, and each unit is a tenfold change, so the ratio is 10⁶, a million.
        - |
          60 has no basis in the logarithmic scale; six units is 10⁶, not 6 × 10.
        - |
          3.6 is the ratio of the pH numbers themselves, which has no chemical meaning.
      answer: 1

    - slug: chem-u06-w23-q02
      type: multiple_choice
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Approximate pH values of some everyday liquids at 25 °C:

        | Liquid | pH |
        |---|---|
        | lemon juice | 2.3 |
        | vinegar | 2.9 |
        | milk | 6.6 |
        | blood | 7.4 |
        | baking soda solution | 8.3 |
        | ammonia cleaner | 11.5 |
      prompt: |
        What is the hydrogen ion concentration in blood?
      options:
        - "7.4 × 10⁻¹ M"
        - "2.5 × 10⁻⁷ M"
        - "1.0 × 10⁻⁷ M"
        - "4 × 10⁻⁸ M"
      option_explanations:
        - |
          The pH is an exponent, not a coefficient; 0.74 M would be a strongly acidic solution of pH 0.13.
        - |
          2.5 × 10⁻⁷ M is 10⁻⁶·⁶, the concentration in milk.
        - |
          1.0 × 10⁻⁷ M is pH 7.0, neutral water; blood is slightly basic at 7.4, so its [H⁺] is lower.
        - |
          Correct. [H⁺] = 10⁻⁷·⁴ = 4 × 10⁻⁸ M, less than the 10⁻⁷ M of neutral water because blood is slightly basic.
      answer: 3

    - slug: chem-u06-w23-q03
      type: multiple_choice
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        Approximate pH values of some everyday liquids at 25 °C:

        | Liquid | pH |
        |---|---|
        | lemon juice | 2.3 |
        | vinegar | 2.9 |
        | milk | 6.6 |
        | blood | 7.4 |
        | baking soda solution | 8.3 |
        | ammonia cleaner | 11.5 |
      prompt: |
        A strip of magnesium is dropped into a sample of each liquid. In which liquid would bubbles of hydrogen gas form most vigorously?
      options:
        - "Lemon juice"
        - "Blood"
        - "Baking soda solution"
        - "Ammonia cleaner"
      option_explanations:
        - |
          Correct. Reaction of an active metal with H⁺ to release H₂ is a property of acids, and lemon juice has the highest [H⁺] (lowest pH) in the table.
        - |
          Blood is very slightly basic; it has too little H⁺ to attack magnesium at any useful rate.
        - |
          A basic solution (pH 8.3) has less H⁺ than pure water; no acid–metal reaction occurs.
        - |
          Ammonia cleaner is strongly basic; releasing H₂ from a metal is an acid property.
      answer: 0

    # ---- Single items
    - slug: chem-u06-w23-q04
      type: multiple_choice
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      prompt: |
        In the reaction HCO₃⁻(aq) + H₂O(l) ⇌ H₂CO₃(aq) + OH⁻(aq), which species is the Brønsted–Lowry acid, and what is its conjugate base?
      options:
        - "HCO₃⁻ is the acid; H₂CO₃ is its conjugate base."
        - "H₂CO₃ is the acid; HCO₃⁻ is its conjugate base."
        - "H₂O is the acid; OH⁻ is its conjugate base."
        - "OH⁻ is the acid; H₂O is its conjugate base."
      option_explanations:
        - |
          HCO₃⁻ gains a proton here, so it acts as the base, and H₂CO₃ is its conjugate acid.
        - |
          Reading left to right, H₂CO₃ is a product; the acid must be a reactant that donates a proton.
        - |
          Correct. Water donates a proton to HCO₃⁻ and becomes OH⁻; a species and what it becomes after losing H⁺ form a conjugate pair.
        - |
          OH⁻ is a product formed by water losing a proton; it is the conjugate base, not the acid.
      answer: 2

    - slug: chem-u06-w23-q05
      type: multiple_choice
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly compares 0.10 M hydrochloric acid with 0.10 M acetic acid?
      options:
        - "The acetic acid solution has a higher concentration of H⁺ because its molecules are larger."
        - "The hydrochloric acid solution has a much higher concentration of H⁺ because HCl ionises completely and acetic acid only partly."
        - "Both solutions have the same concentration of H⁺ because both are 0.10 M."
        - "The hydrochloric acid solution is more concentrated."
      option_explanations:
        - |
          Molecular size has nothing to do with ionisation; acetic acid is a weak acid that keeps most of its protons.
        - |
          Correct. HCl is a strong acid, so [H⁺] = 0.10 M (pH 1.0); acetic acid is weak and about 1% ionised, giving [H⁺] near 1.3 × 10⁻³ M (pH 2.9).
        - |
          Equal molarity means equal numbers of acid molecules added, not equal numbers of H⁺ released.
        - |
          Both are 0.10 M, so they are equally concentrated; the difference is strength, not concentration.
      answer: 1

    - slug: chem-u06-w23-q06
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Hydrochloric acid is dripped onto a piece of marble (calcium carbonate) and the surface fizzes. Which equation and reaction classification are correct?
      options:
        - "CaCO₃ + HCl → CaCl + H₂CO₃; synthesis"
        - "CaCO₃ + 2 HCl → CaCl₂ + H₂; single replacement"
        - "CaCO₃ + 2 HCl → CaH₂ + Cl₂ + CO₃; decomposition"
        - "CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂; double replacement in which the carbonic acid formed decomposes to water and carbon dioxide gas"
      option_explanations:
        - |
          Calcium forms CaCl₂, not CaCl, and the reaction is not a synthesis; two compounds exchange partners.
        - |
          Hydrogen gas is released by acids reacting with active metals, not with carbonates; the fizz here is CO₂.
        - |
          CaH₂ and free carbonate are not formed; this is not a decomposition of one reactant.
        - |
          Correct. Ca²⁺ pairs with Cl⁻ and H⁺ pairs with CO₃²⁻ (double replacement); the H₂CO₃ formed is unstable and breaks down into H₂O and CO₂, which is the gas observed.
      answer: 3
      explanation: |
        Review of 4.2: acid–carbonate reactions are double replacements driven by gas formation.

    - slug: chem-u06-w23-q07
      type: multiple_choice
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the pH of 0.010 M hydrochloric acid?
      options:
        - "2.00"
        - "12.00"
        - "0.010"
        - "1.00"
      option_explanations:
        - |
          Correct. HCl is strong, so [H⁺] = 1.0 × 10⁻² M and pH = −log(1.0 × 10⁻²) = 2.00.
        - |
          12.00 is the pOH of this solution (and the pH of 0.010 M NaOH).
        - |
          0.010 is the concentration in mol/L, not its negative logarithm.
        - |
          pH 1.00 corresponds to 0.10 M, ten times more concentrated.
      answer: 0

    - slug: chem-u06-w23-q08
      type: multiple_choice
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the pH of 0.010 M sodium hydroxide?
      options:
        - "2.00"
        - "7.00"
        - "12.00"
        - "10.00"
      option_explanations:
        - |
          2.00 is the pOH; a sodium hydroxide solution must have a pH above 7.
        - |
          7.00 is neutral; a 0.010 M strong base is far from neutral.
        - |
          Correct. [OH⁻] = 1.0 × 10⁻² M, pOH = 2.00, pH = 14.00 − 2.00 = 12.00.
        - |
          10.00 would correspond to [OH⁻] = 1.0 × 10⁻⁴ M, a hundred times more dilute.
      answer: 2

    - slug: chem-u06-w23-q09
      type: multiple_choice
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A solution at 25 °C has [OH⁻] = 1.0 × 10⁻⁴ M. Which statement about it is correct?
      options:
        - "It contains no H⁺ ions because it is basic."
        - "Its [H⁺] is 1.0 × 10⁻¹⁰ M and it is basic."
        - "Its [H⁺] is 1.0 × 10⁻⁴ M and it is neutral."
        - "Its pH is 4.00."
      option_explanations:
        - |
          Every aqueous solution contains both ions; K_w fixes their product, so [H⁺] is small but not zero.
        - |
          Correct. [H⁺] = K_w/[OH⁻] = 1.0 × 10⁻¹⁴ / 1.0 × 10⁻⁴ = 1.0 × 10⁻¹⁰ M; since [OH⁻] > [H⁺], the solution is basic (pH 10.00).
        - |
          [H⁺] equals [OH⁻] only in a neutral solution, where both are 1.0 × 10⁻⁷ M.
        - |
          4.00 is the pOH; the pH is 14.00 − 4.00 = 10.00.
      answer: 1

    - slug: chem-u06-w23-q10
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which pair correctly matches an acid formula with its name?
      options:
        - "HCl(aq): chloric acid"
        - "H₂SO₄: sulfurous acid"
        - "HNO₂: nitric acid"
        - "HNO₃: nitric acid"
      option_explanations:
        - |
          HCl(aq) is hydrochloric acid; "chloric acid" is HClO₃. Binary acids take the hydro- prefix.
        - |
          H₂SO₄, from the sulfate ion, is sulfuric acid; sulfurous acid is H₂SO₃, from sulfite.
        - |
          HNO₂, from the nitrite ion, is nitrous acid; -ite becomes -ous.
        - |
          Correct. HNO₃ contains the nitrate ion, and -ate becomes -ic: nitric acid.
      answer: 3
      explanation: |
        Review of 3.4: hydro-…-ic for binary acids; -ate → -ic and -ite → -ous for oxyacids.

    - slug: chem-u06-w23-q11
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        10.0 mL of 0.10 M HCl (pH 1.00) is diluted with water to 100.0 mL. What is the pH of the diluted solution?
      options:
        - "2.00"
        - "1.00"
        - "10.00"
        - "0.10"
      option_explanations:
        - |
          Correct. M₂ = (0.10 × 10.0)/100.0 = 0.010 M; a tenfold dilution of a strong acid lowers [H⁺] tenfold and raises the pH by exactly one unit, to 2.00.
        - |
          Dilution changes the concentration; the pH cannot stay at 1.00 when [H⁺] falls to 0.010 M.
        - |
          10.00 would be a basic solution; diluting an acid with water moves the pH toward 7, never past it.
        - |
          0.10 is the original molarity, not a pH.
      answer: 0
      explanation: |
        Review of 6.2: M₁V₁ = M₂V₂ gives the new concentration; the log scale turns a factor of ten into one pH unit.

    # ---- Select all
    - slug: chem-u06-w23-q12
      type: multi_select
      topic_code: "6.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are strong acids, ionising completely in water? Select all that apply.
      options:
        - "Hydrobromic acid, HBr"
        - "Acetic acid, CH₃COOH"
        - "Nitric acid, HNO₃"
        - "Hydrofluoric acid, HF"
        - "Perchloric acid, HClO₄"
      option_explanations:
        - |
          Correct. HBr, like HCl and HI, is one of the strong binary acids.
        - |
          Acetic acid is the standard weak acid; in 0.1 M solution only about 1% of its molecules are ionised.
        - |
          Correct. HNO₃ is a strong oxyacid; every molecule donates its proton to water.
        - |
          HF is weak despite being a halogen acid; the H–F bond is strong and only partly ionises.
        - |
          Correct. HClO₄ is among the strongest common acids.
      answer: [0, 2, 4]

    - slug: chem-u06-w23-q13
      type: multi_select
      topic_code: "4.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of these metals react with dilute hydrochloric acid to release hydrogen gas? Select all that apply.
      options:
        - "Zinc, Zn"
        - "Copper, Cu"
        - "Magnesium, Mg"
        - "Silver, Ag"
        - "Iron, Fe"
      option_explanations:
        - |
          Correct. Zinc is above hydrogen in the activity series and displaces it: Zn + 2 HCl → ZnCl₂ + H₂.
        - |
          Copper lies below hydrogen in the activity series and does not displace H⁺ from acids.
        - |
          Correct. Magnesium is well above hydrogen and reacts rapidly, which is why it is used in lab demonstrations.
        - |
          Silver is below hydrogen and is unreactive toward non-oxidising acids.
        - |
          Correct. Iron is above hydrogen and reacts, more slowly than zinc, to give FeCl₂ and H₂.
      answer: [0, 2, 4]
      explanation: |
        Review of 4.3: a metal displaces hydrogen from an acid only if it sits above hydrogen in the activity series.

    # ---- True / false
    - slug: chem-u06-w23-q14
      type: true_false
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A concentrated acid is always a strong acid.
      answer: false
      explanation: |
        False. Concentration describes how much acid is dissolved; strength describes how completely it ionises. Glacial (100%) acetic acid is extremely concentrated yet weak, and 0.001 M HCl is dilute yet strong.

    - slug: chem-u06-w23-q15
      type: true_false
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Because 0.025 M has two significant figures, its pH should be reported with two decimal places, as 1.60.
      answer: true
      explanation: |
        True. In a logarithm only the digits after the decimal point are significant; the digit before the point records the power of ten. Two significant figures in the concentration therefore become two decimal places in the pH.

    # ---- Fill in the blank
    - slug: chem-u06-w23-q16
      type: fill_blank
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      prompt: |
        At 25 °C, for any aqueous solution, pH + pOH = ____.
      answer: ["14", "14.00", "14.0"]
      explanation: |
        Taking −log of both sides of K_w = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴ gives pH + pOH = 14.00. Find whichever of the two is easier from the data and subtract from 14 to get the other.

    - slug: chem-u06-w23-q17
      type: fill_blank
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The ion that every Arrhenius base releases in water, with formula OH⁻, is called the ____ ion.
      answer: ["hydroxide", "hydroxide ion"]
      explanation: |
        OH⁻ is the hydroxide ion, a polyatomic ion with a 1− charge. Group 1 and the heavier group 2 metals form soluble hydroxides (NaOH, KOH, Ca(OH)₂, Ba(OH)₂), which are the strong bases.

