        Each Ca(OH)₂ gives two OH⁻, so [OH⁻] = 2 × 0.0050 = 0.010 M. pOH = −log(0.010) = 2.00, and pH = 14.00 − 2.00 = 12.00. Forgetting the factor of 2 gives pH 11.70.

