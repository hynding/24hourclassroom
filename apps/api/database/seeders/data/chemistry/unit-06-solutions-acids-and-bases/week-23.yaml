    # ---- Short answer
    - slug: chem-u06-w23-q21
      type: short_answer
      topic_code: "6.4"
      source: "general knowledge"
      points: 3
      prompt: |
        Ammonia dissolves in water: NH₃(aq) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq). Answer (a), (b) and (c).

        (a) Explain why ammonia is a base according to the Brønsted–Lowry definition but not according to the Arrhenius definition as originally stated.
        (b) Identify both conjugate acid–base pairs in the equation.
        (c) The equation is written with ⇌ and a 0.10 M ammonia solution has a pH of about 11.1, not 13.0. Explain what these two facts tell you about ammonia as a base.
      answer: |
        (a) Arrhenius bases produce OH⁻ by dissociating in water, and NH₃ contains no hydroxide to release. Brønsted–Lowry defines a base as a proton acceptor, and NH₃ accepts a proton from water to form NH₄⁺, which is why the solution ends up containing OH⁻.
        (b) NH₃ (base) and NH₄⁺ (its conjugate acid); H₂O (acid) and OH⁻ (its conjugate base).
        (c) Ammonia is a weak base. The ⇌ shows the reaction reaches an equilibrium in which most ammonia stays as NH₃, and the pH of 11.1 corresponds to [OH⁻] of about 1.3 × 10⁻³ M, only about 1% of the 0.10 M that complete reaction would give (which would be pH 13.0).
      explanation: |
        Three points, one per part.

        (a) 1 pt: no OH⁻ in the formula (fails Arrhenius), but accepts a proton from water (Brønsted–Lowry base).

        (b) 1 pt: both pairs correct: NH₃/NH₄⁺ and H₂O/OH⁻, with water as the acid.

        (c) 1 pt: weak base, partial ionisation (about 1%), with the pH comparison explained (pH 13 would mean 0.10 M OH⁻).

    - slug: chem-u06-w23-q22
      type: short_answer
      topic_code: "6.5"
      source: "general knowledge"
      points: 3
      stimulus: |
        A student tests three unlabelled solutions and records the results.

        | Solution | pH meter reading | Red litmus | Blue litmus | Bubbles with Mg ribbon |
        |---|---|---|---|---|
        | A | 1.30 | stays red | turns red | yes, vigorous |
        | B | 7.00 | stays red | stays blue | none |
        | C | 12.70 | turns blue | stays blue | none |
      prompt: |
        Using the table, answer (a), (b) and (c).

        (a) Calculate [H⁺] in solution A and [OH⁻] in solution C.
        (b) Solutions A and C were made from 0.050 M HCl and 0.050 M NaOH respectively. Show that the measured pH values are consistent with these being a strong acid and a strong base.
        (c) Equal volumes of A and C are mixed. Predict the pH of the mixture and explain, with a net ionic equation, why.
      answer: |
        (a) A: [H⁺] = 10⁻¹·³⁰ = 5.0 × 10⁻² M. C: pOH = 14.00 − 12.70 = 1.30, so [OH⁻] = 10⁻¹·³⁰ = 5.0 × 10⁻² M.
        (b) A strong acid ionises completely, so 0.050 M HCl should give [H⁺] = 0.050 M and pH = −log(0.050) = 1.30, exactly as measured. A strong base dissociates completely, so 0.050 M NaOH gives [OH⁻] = 0.050 M, pOH 1.30 and pH 12.70, also as measured. A weak acid or base would have given a pH much closer to 7.
        (c) About 7.00. The moles of H⁺ and OH⁻ are equal (same concentration, same volume), and they react completely: H⁺(aq) + OH⁻(aq) → H₂O(l). What remains is a neutral solution of NaCl in water.
      explanation: |
        Three points, one per part.

        (a) 1 pt: both concentrations 5.0 × 10⁻² M (accept 0.050 M).

        (b) 1 pt: complete ionisation makes [H⁺] or [OH⁻] equal the molarity, and −log(0.050) = 1.30 reproduces both readings.

        (c) 1 pt: pH 7 (neutral), equal moles of H⁺ and OH⁻ neutralise each other, with the net ionic equation H⁺ + OH⁻ → H₂O.

    # ---- Long answer
    - slug: chem-u06-w23-q23
      type: long_answer
      topic_code: "6.5"
      source: "general knowledge"
      points: 6
      prompt: |
        A swimming pool's water should be kept between pH 7.2 and 7.8. A pool technician measures pH 6.8 after a rainstorm and must decide how to correct it. The two products available are sodium carbonate (a base) and a 0.10 M hydrochloric acid solution.

        Write a full account that (1) explains what the pH scale measures and what a reading of 6.8 means in terms of [H⁺] and [OH⁻] at 25 °C; (2) calculates by what factor the H⁺ concentration must change to move the pool from pH 6.8 to pH 7.5, and states which product should be added and why; (3) explains, with the self-ionisation of water and K_w, why adding a base lowers the H⁺ concentration even though the base contributes no H⁺; and (4) explains why the technician should never add the 0.10 M HCl to fix a pH that is too high by "a lot at once", using a calculation of the pH of the 0.10 M acid itself and the tenfold-per-unit nature of the scale.
      answer: |
        (1) pH = −log[H⁺] measures the hydrogen ion concentration on a logarithmic scale: each unit is a factor of ten, and lower pH means more H⁺. At pH 6.8, [H⁺] = 10⁻⁶·⁸ = 1.6 × 10⁻⁷ M, and [OH⁻] = K_w/[H⁺] = 1.0 × 10⁻¹⁴ / 1.6 × 10⁻⁷ = 6.3 × 10⁻⁸ M. The water is slightly acidic because [H⁺] > [OH⁻].

        (2) At pH 7.5, [H⁺] = 10⁻⁷·⁵ = 3.2 × 10⁻⁸ M. The required factor is 1.6 × 10⁻⁷ / 3.2 × 10⁻⁸ = 5.0, so [H⁺] must fall to one-fifth of its value (0.7 pH units = 10⁰·⁷ = 5.0). The technician should add the base, sodium carbonate, because the pH must rise.

        (3) Water self-ionises: 2 H₂O ⇌ H₃O⁺ + OH⁻, and K_w = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴ is constant at 25 °C. Carbonate accepts protons (CO₃²⁻ + H⁺ → HCO₃⁻) and also raises [OH⁻]; because the product [H⁺][OH⁻] cannot change, any rise in [OH⁻] forces [H⁺] down. The base removes H⁺ and the equilibrium adjusts.

        (4) The 0.10 M HCl has pH = −log(0.10) = 1.00, over a million times the [H⁺] of the pool. Because the scale is logarithmic, a small amount of acid changes the pH only slightly, but overshooting is easy: each tenfold increase in [H⁺] drops the pH by one unit, and the acceptable window is only 0.6 units wide (a factor of four in [H⁺]). Acid should be added in small portions with the pH remeasured after mixing, and never dumped in one place where the local pH could fall far below 7 and damage surfaces or swimmers.
      explanation: |
        Six points.

        pH meaning (0–1): logarithmic scale, tenfold per unit, lower pH = more H⁺; [H⁺] ≈ 1.6 × 10⁻⁷ M and [OH⁻] ≈ 6.3 × 10⁻⁸ M at pH 6.8 (accept one correct concentration with the relationship stated).

        Factor and product (0–2): 1 pt for the factor of 5 (10⁰·⁷); 1 pt for choosing sodium carbonate (a base) because the pH must rise.

        K_w reasoning (0–2): 1 pt for water's self-ionisation and K_w constant; 1 pt for the argument that raising [OH⁻] (or removing H⁺ by proton acceptance) forces [H⁺] down to keep the product fixed.

        Acid caution (0–1): pH of 0.10 M HCl = 1.00, the enormous concentration ratio, and the narrow window on a log scale, leading to small additions with remeasurement.

        Common errors: treating pH 6.8 to 7.5 as a factor of 0.7; adding acid to raise pH; claiming a base "neutralises" by supplying H⁺.
