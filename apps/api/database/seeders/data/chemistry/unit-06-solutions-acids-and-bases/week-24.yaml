      explanation: |
        Moles HNO₃ = 0.150 × 0.0300 = 4.50 × 10⁻³ mol = moles KOH needed (1:1). V = n/M = 4.50 × 10⁻³ / 0.250 = 0.0180 L = 18.0 mL.

    # ---- Short answer
    - slug: chem-u06-w24-q21
      type: short_answer
      topic_code: "6.6"
      source: "PubChem (molar masses)"
      points: 3
      prompt: |
        A 0.600 g sample of an antacid tablet containing calcium carbonate is dissolved in 50.00 mL of 0.500 M HCl (an excess). The leftover acid is then titrated and found to be 1.30 × 10⁻² mol. Answer (a), (b) and (c).

        (a) Calculate the moles of HCl that reacted with the calcium carbonate.
        (b) Calculate the mass of CaCO₃ (100.09 g/mol) in the tablet and its percentage by mass.
        (c) Explain why this "back titration" method is used instead of titrating the tablet directly with acid.
      answer: |
        (a) Moles HCl added = 0.500 × 0.05000 = 2.50 × 10⁻² mol; moles reacted = 2.50 × 10⁻² − 1.30 × 10⁻² = 1.20 × 10⁻² mol.
        (b) CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂, so moles CaCO₃ = 1.20 × 10⁻² ÷ 2 = 6.00 × 10⁻³ mol; mass = 6.00 × 10⁻³ × 100.09 = 0.601 g, which is about 100% of the 0.600 g tablet (within rounding, the tablet is essentially all CaCO₃).
        (c) Calcium carbonate is a solid that is insoluble in water and reacts slowly, with fizzing, so a direct titration would have no clear end point. Dissolving it in a measured excess of acid drives the reaction to completion; the excess acid is then a clear solution that can be titrated sharply with base.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 2.50 × 10⁻² mol added, 1.20 × 10⁻² mol reacted.

        (b) 1 pt: 2:1 ratio applied, 6.00 × 10⁻³ mol CaCO₃, about 0.60 g and about 100% (accept 99–101%).

        (c) 1 pt: the solid reacts slowly or incompletely and is insoluble, so an excess of acid is used and the leftover is titrated. Any correct reason earns the point.

    - slug: chem-u06-w24-q22
      type: short_answer
      topic_code: "6.6"
      source: "general knowledge"
      points: 3
      stimulus: |
        Graph description: Two titration curves are drawn on the same axes, pH (0 to 14) against volume of 0.100 M NaOH added (0 to 50 mL), each for 25.00 mL of a 0.100 M acid. Curve 1 starts at pH 1.0, rises gently, jumps from pH 3 to pH 11 at 25.0 mL and levels off near 12.5. Curve 2 starts at pH 2.9, rises through a sloping region between about 5 and 20 mL, jumps from about pH 7 to pH 11 at 25.0 mL, and levels off near 12.5 as well.
      prompt: |
        Using the graph description, answer (a), (b) and (c).

        (a) Identify which curve is a strong acid and which is a weak acid, giving two features that support each identification.
        (b) Explain why both curves reach their equivalence point at the same volume, 25.0 mL.
        (c) State the pH at the equivalence point of each curve and choose an indicator suitable for each, with a reason.
      answer: |
        (a) Curve 1 is the strong acid: it starts at pH 1.0 (0.100 M fully ionised) and has a long vertical jump centred on pH 7. Curve 2 is the weak acid: it starts at a higher pH (2.9, only partly ionised), has a gently sloping buffer region, and its jump is shorter and centred above pH 7.
        (b) Both acids are 0.100 M and monoprotic, so each 25.00 mL sample contains 2.50 × 10⁻³ mol of acid; neutralising it needs 2.50 × 10⁻³ mol of OH⁻, which is 25.0 mL of 0.100 M NaOH, regardless of whether the acid is strong or weak. Strength affects the pH along the way, not the amount of base required.
        (c) Curve 1: equivalence at pH 7.0; bromothymol blue (6.0–7.6) or phenolphthalein (8.2–10.0) both lie within the long jump from 3 to 11. Curve 2: equivalence about pH 8.5–9; phenolphthalein, whose range sits in the jump from 7 to 11; methyl orange would change colour in the buffer region, far too early.
      explanation: |
        Three points, one per part.

        (a) 1 pt: curve 1 strong, curve 2 weak, with at least two correct features for each (starting pH, buffer region, length and centre of the jump).

        (b) 1 pt: equal moles of acid (same concentration, volume and number of ionisable protons) need equal moles of base; strength does not change the stoichiometry.

        (c) 1 pt: pH 7 for curve 1 and above 7 (about 8.5–9) for curve 2, with an appropriate indicator for each and the reason that its range must fall within the steep jump.

    # ---- Long answer
    - slug: chem-u06-w24-q23
      type: long_answer
      topic_code: "6.6"
      source: "general knowledge"
      points: 6
      prompt: |
        A bottle of household vinegar is labelled "5% acetic acid". A student wants to check the claim by titration, using 0.100 M sodium hydroxide as the standard solution and 10.00 mL samples of the vinegar. (Acetic acid CH₃COOH, 60.05 g/mol; assume the density of vinegar is 1.00 g/mL.)

        Write a full account that (1) gives the balanced equation for the reaction and explains the choice of phenolphthalein as the indicator for this weak acid–strong base titration; (2) describes the procedure, including how the burette is read and how concordant results are obtained; (3) calculates the molarity of the acetic acid if the mean titre is 83.20 mL, and converts it to a percentage by mass to compare with the label; and (4) explains why the titre is uncomfortably large for a 50 mL burette and proposes one change to the method, with the calculation that justifies it.
      answer: |
        (1) CH₃COOH(aq) + NaOH(aq) → CH₃COONa(aq) + H₂O(l), a 1:1 reaction. At equivalence the solution contains sodium acetate; the acetate ion is a weak base, so the pH is about 8.7. Phenolphthalein changes from colourless to pink over pH 8.2–10.0, within the steep jump, so its end point matches the equivalence point; methyl orange (3.1–4.4) would change colour far too early.

        (2) Pipette 10.00 mL of vinegar into a flask, add 2–3 drops of phenolphthalein, fill the burette with 0.100 M NaOH (rinsed with the NaOH, not water) and record the initial reading at eye level to 0.05 mL. Add base with swirling, then dropwise near the end until the first lasting pale pink appears; record the final reading and subtract. Repeat until two or three titres agree within 0.1 mL, discarding the rough first run, and average those.

        (3) Moles NaOH = 0.100 × 0.08320 = 8.32 × 10⁻³ mol = moles CH₃COOH (1:1). M = 8.32 × 10⁻³ / 0.01000 L = 0.832 M. In 10.00 mL (10.00 g) of vinegar: 8.32 × 10⁻³ mol × 60.05 g/mol = 0.500 g of acetic acid, which is 0.500/10.00 × 100 = 5.00% by mass, matching the label.

        (4) A titre of 83 mL exceeds a 50 mL burette, so the burette would have to be refilled mid-titration, adding reading errors. Either dilute the vinegar tenfold first (pipette 10.00 mL into a 100 mL volumetric flask and make up to the mark, then titrate 10.00 mL of the diluted sample, expecting about 8.3 mL of NaOH, or better titrate 25.00 mL of it, expecting about 20.8 mL), or use a more concentrated base such as 0.500 M NaOH, which would need 16.6 mL. Diluting the vinegar to 0.0832 M and titrating 25.00 mL gives a titre of 20.8 mL, comfortably within the burette and large enough that a 0.05 mL reading error is only 0.2%.
      explanation: |
        Six points.

        Equation and indicator (0–1): balanced 1:1 equation and phenolphthalein justified by the basic equivalence point (acetate is a weak base) and its 8.2–10.0 range.

        Procedure (0–1): pipette, indicator, burette rinsed with titrant, readings to 0.05 mL at eye level, dropwise near the end, concordant titres averaged.

        Calculation (0–3): 1 pt for 8.32 × 10⁻³ mol and 0.832 M; 1 pt for 0.500 g of acetic acid in the 10.00 g sample; 1 pt for 5.00% by mass and the comparison with the label.

        Method improvement (0–1): recognises the titre exceeds the burette, proposes a dilution or a stronger base, and supports it with a calculation giving a titre between about 15 and 45 mL.

        Common errors: using the 5% label as a concentration in the calculation; choosing methyl orange; forgetting that moles of acid equal moles of base only because the ratio is 1:1; reporting molarity as the percentage.
