    # ---- Numeric
    - slug: chem-u06-w24-q18
      type: numeric
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        20.00 mL of hydrochloric acid is neutralised by 25.00 mL of 0.120 M sodium hydroxide. What is the molarity of the acid? Give your answer in mol/L to three decimal places.
      answer: { value: 0.150, tolerance: 0.002 }
      explanation: |
        Moles NaOH = 0.120 × 0.02500 = 3.00 × 10⁻³ mol = moles HCl (1:1). M = 3.00 × 10⁻³ / 0.02000 L = 0.150 M.

    - slug: chem-u06-w24-q19
      type: numeric
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        25.00 mL of sulfuric acid requires 40.00 mL of 0.100 M sodium hydroxide to reach the equivalence point. What is the molarity of the H₂SO₄? Give your answer in mol/L to four decimal places.
      answer: { value: 0.0800, tolerance: 0.001 }
      explanation: |
        Moles NaOH = 0.100 × 0.04000 = 4.00 × 10⁻³ mol. H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O, so moles H₂SO₄ = 2.00 × 10⁻³ mol. M = 2.00 × 10⁻³ / 0.02500 = 0.0800 M. (M₁V₁ = M₂V₂ would wrongly give 0.160 M.)

