week: 24
unit: 6
title: "Neutralisation and Titration"
topics: ["6.6"]
guide: guides/week-24.md
guide_description: |
  Neutralisation equations and their net ionic form, how a titration is carried out with a burette and indicator,
  equivalence point versus end point, the three-step titration calculation for 1:1 and for 2:1 reactions (and why
  M₁V₁ = M₂V₂ is only for 1:1), analysing an antacid tablet, and the shapes of strong–strong and weak–strong
  titration curves with the indicator to match each.
flashcards_description: |
  27 cards on neutralisation, salts, titration apparatus and procedure, the calculation steps, titration curves
  and indicator choice.

flashcards:
  - front: Neutralisation → the general word equation and an example
    back: |
      Acid + base → salt + water. HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l). The H⁺ of the acid and the OH⁻ of the base combine into water; the other ions form the salt.
    topic_code: "6.6"
  - front: Salt → definition in acid–base chemistry
    back: |
      The ionic compound formed from the cation of the base and the anion of the acid. KOH + HNO₃ gives potassium nitrate, KNO₃; Ca(OH)₂ + 2 HCl gives calcium chloride, CaCl₂.
    topic_code: "6.6"
  - front: Net ionic equation for any strong acid–strong base neutralisation
    back: |
      H⁺(aq) + OH⁻(aq) → H₂O(l). The salt's ions are spectators. The reaction releases about 57 kJ per mole of water formed.
    topic_code: "6.6"
  - front: Sulfuric acid plus sodium hydroxide → balanced equation and ratio
    back: |
      H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O. Two hydroxides are needed per molecule of acid because H₂SO₄ supplies two H⁺. The mole ratio acid:base is 1:2.
    topic_code: "6.6"
  - front: Calcium hydroxide plus nitric acid → balanced equation and ratio
    back: |
      Ca(OH)₂ + 2 HNO₃ → Ca(NO₃)₂ + 2 H₂O. The base supplies two OH⁻ per formula unit, so two moles of acid are needed per mole of base.
    topic_code: "6.6"
  - front: Polyprotic acid → definition and the titration consequence
    back: |
      An acid with more than one ionisable hydrogen (H₂SO₄, H₃PO₄). Each H⁺ needs one OH⁻, so H₃PO₄ takes three moles of NaOH per mole of acid.
    topic_code: "6.6"
  - front: Titration → what it is for
    back: |
      Measuring the concentration of a solution by reacting a measured volume of it with a standard solution of known concentration, added from a burette until the reaction is just complete.
    topic_code: "6.6"
  - front: Standard solution → definition
    back: |
      A solution whose concentration is accurately known, used as the titrant. It is made by weighing a pure solid accurately or by titrating against one.
    topic_code: "6.6"
  - front: Burette, pipette, volumetric flask → what each measures
    back: |
      Burette: a variable volume delivered, read to 0.05 mL (final reading minus initial). Pipette: one fixed, accurate volume (25.00 mL). Volumetric flask: one fixed total volume for making a solution.
    topic_code: "6.6"
  - front: Titration procedure → the steps in order
    back: |
      Pipette the unknown into a flask, add 2–3 drops of indicator, record the initial burette reading, add titrant with swirling then drop by drop near the end, record the final reading, repeat until two results agree within about 0.1 mL.
    topic_code: "6.6"
  - front: Concordant titres → what they are and why a rough titration is discarded
    back: |
      Titres that agree within about 0.1 mL; their mean is used. The first run finds the approximate end point quickly and usually overshoots, so it is not averaged in.
    topic_code: "6.6"
  - front: Equivalence point versus end point
    back: |
      Equivalence point: the moles of acid and base match the equation's ratio (a chemical fact). End point: the indicator changes colour (what you see). A good indicator makes the two coincide.
    topic_code: "6.6"
  - front: Titration calculation → the three steps
    back: |
      1. Moles of the known = M × V (litres). 2. Mole ratio from the balanced equation gives moles of the unknown. 3. Divide by the unknown's volume in litres for molarity (or multiply by molar mass for a mass).
    topic_code: "6.6"
  - front: 25.00 mL HCl needing 31.40 mL of 0.100 M NaOH → the acid's molarity
    back: |
      Moles NaOH = 0.100 × 0.03140 = 3.14 × 10⁻³ mol = moles HCl (1:1). M = 3.14 × 10⁻³ / 0.02500 = 0.126 M.
    topic_code: "6.6"
  - front: When M_aV_a = M_bV_b may be used in a titration
    back: |
      Only when the acid and base react 1:1 (HCl with NaOH, HNO₃ with KOH). For H₂SO₄ with NaOH or HCl with Ba(OH)₂ it gives an answer wrong by a factor of 2; go through moles and the mole ratio.
    topic_code: "6.6"
  - front: 20.00 mL H₂SO₄ needing 27.50 mL of 0.150 M NaOH → the acid's molarity
    back: |
      Moles NaOH = 4.125 × 10⁻³; ÷ 2 (1:2 ratio) = 2.0625 × 10⁻³ mol H₂SO₄; ÷ 0.02000 L = 0.103 M. The shortcut would wrongly give 0.206 M.
    topic_code: "6.6"
  - front: Volume of titrant needed → the method
    back: |
      Moles of the sample = M × V, convert by the mole ratio, then V = n/M of the titrant. 15.0 mL of 0.350 M HNO₃ needs 5.25 × 10⁻³ mol KOH = 26.3 mL of 0.200 M KOH.
    topic_code: "6.6"
  - front: Back titration of an antacid → the idea
    back: |
      Dissolve the tablet in a known excess of acid, titrate the leftover acid with base, and subtract to find the acid the tablet consumed. 8.40 × 10⁻³ mol HCl consumed ÷ 2 = 4.20 × 10⁻³ mol CaCO₃ = 0.420 g.
    topic_code: "6.6"
  - front: Titration curve → the general shape
    back: |
      pH against volume of titrant: nearly flat at first, a steep almost vertical jump through the equivalence point within a drop or two, then flat again. The midpoint of the jump is the equivalence point.
    topic_code: "6.6"
  - front: Strong acid–strong base titration curve → start, jump and equivalence pH
    back: |
      Starts near pH 1 (0.1 M acid), jumps from about pH 3 to 11 at the equivalence point, which is at pH 7.00 because the salt (e.g. NaCl) is neutral; levels off above 12.
    topic_code: "6.6"
  - front: Weak acid–strong base titration curve → how it differs
    back: |
      Starts higher (pH about 3 for 0.1 M acetic acid), has a gently sloping buffer region, a shorter jump, and an equivalence point above 7 (about 8.7) because the anion left behind (acetate) is a weak base.
    topic_code: "6.6"
  - front: Strong acid–weak base titration → equivalence pH and why
    back: |
      Below 7, because the cation left behind (NH₄⁺ from ammonia) is a weak acid. Methyl orange (3.1–4.4) suits it.
    topic_code: "6.6"
  - front: Choosing an indicator → the rule
    back: |
      Its colour-change range must lie on the steep part of the curve, around the equivalence-point pH. Strong–strong: bromothymol blue or phenolphthalein; weak acid–strong base: phenolphthalein; strong acid–weak base: methyl orange.
    topic_code: "6.6"
  - front: Phenolphthalein → colours and range
    back: |
      Colourless below about pH 8.2, pink above 10.0. In a titration of acid with NaOH the first lasting pale pink marks the end point.
    topic_code: "6.6"
  - front: Methyl orange and bromothymol blue → colours and ranges
    back: |
      Methyl orange: red in acid to yellow in base over pH 3.1–4.4. Bromothymol blue: yellow in acid to blue in base over 6.0–7.6, straddling neutral.
    topic_code: "6.6"
  - front: Why only two or three drops of indicator
    back: |
      The indicator is itself a weak acid or base; a large amount would consume titrant and shift the end point. A few drops give a visible colour without affecting the result.
    topic_code: "6.6"
  - front: Error spotting → a titration molarity exactly double the true value
    back: |
      M_aV_a = M_bV_b was used for a 1:2 reaction such as H₂SO₄ with NaOH. Divide the moles of base by 2 before finding the acid's molarity.
    topic_code: "6.6"

quiz:
  description: |
    23 questions · about 40 minutes · topic 6.6 (neutralisation equations, titration procedure and calculations,
    titration curves and indicators), with review of precision (1.4), naming salts (3.2), balancing and reaction
    types (4.1, 4.2), mole ratios (4.6), strong and weak acids and bases (6.4), pH (6.5) and molarity (6.2).
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set A: titration data (1.4, 6.6)
    - slug: chem-u06-w24-q01
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student titrates 25.00 mL portions of hydrochloric acid of unknown concentration with 0.100 M sodium hydroxide, using phenolphthalein.

        | Trial | Initial burette reading (mL) | Final burette reading (mL) | Volume of NaOH (mL) |
        |---|---|---|---|
        | 1 (rough) | 0.00 | 24.90 | 24.90 |
        | 2 | 0.00 | 23.45 | 23.45 |
        | 3 | 23.45 | 46.85 | 23.40 |
        | 4 | 0.50 | 24.00 | 23.50 |
      prompt: |
        Which volume of NaOH should the student use in the calculation, and why?
      options:
        - "24.90 mL, because the first trial is the most careful"
        - "23.81 mL, the mean of all four trials"
        - "23.45 mL, the mean of trials 2, 3 and 4, which agree within 0.1 mL; the rough trial overshot and is discarded"
        - "23.40 mL, the smallest value, because the end point is the first drop that changes the colour"
      option_explanations:
        - |
          The rough trial is run quickly to locate the end point and usually overshoots; it is the least reliable.
        - |
          Including the rough trial drags the mean up by more than a millilitre; only concordant titres are averaged.
        - |
          Correct. Trials 2, 3 and 4 are concordant (within 0.10 mL) and their mean is (23.45 + 23.40 + 23.50)/3 = 23.45 mL; the rough trial is excluded.
        - |
          Choosing the smallest value throws away information; the mean of concordant results is more precise than any single one.
      answer: 2
      explanation: |
        Review of 1.4: precision comes from replicate measurements that agree; outliers from a deliberately rough run are excluded.

    - slug: chem-u06-w24-q02
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student titrates 25.00 mL portions of hydrochloric acid of unknown concentration with 0.100 M sodium hydroxide, using phenolphthalein.

        | Trial | Initial burette reading (mL) | Final burette reading (mL) | Volume of NaOH (mL) |
        |---|---|---|---|
        | 1 (rough) | 0.00 | 24.90 | 24.90 |
        | 2 | 0.00 | 23.45 | 23.45 |
        | 3 | 23.45 | 46.85 | 23.40 |
        | 4 | 0.50 | 24.00 | 23.50 |
      prompt: |
        Using a mean titre of 23.45 mL, how many moles of NaOH were delivered at the end point?
      options:
        - "2.345 × 10⁻³ mol"
        - "2.345 mol"
        - "2.500 × 10⁻³ mol"
        - "4.26 × 10⁻³ mol"
      option_explanations:
        - |
          Correct. n = M × V = 0.100 mol/L × 0.02345 L = 2.345 × 10⁻³ mol.
        - |
          2.345 mol is the result of leaving the volume in millilitres; 23.45 mL is 0.02345 L.
        - |
          2.500 × 10⁻³ mol would be 0.100 M × 25.00 mL, the acid's volume, which is not the titrant.
        - |
          4.26 × 10⁻³ comes from dividing the volume by the molarity instead of multiplying.
      answer: 0

    - slug: chem-u06-w24-q03
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student titrates 25.00 mL portions of hydrochloric acid of unknown concentration with 0.100 M sodium hydroxide, using phenolphthalein.

        | Trial | Initial burette reading (mL) | Final burette reading (mL) | Volume of NaOH (mL) |
        |---|---|---|---|
        | 1 (rough) | 0.00 | 24.90 | 24.90 |
        | 2 | 0.00 | 23.45 | 23.45 |
        | 3 | 23.45 | 46.85 | 23.40 |
        | 4 | 0.50 | 24.00 | 23.50 |
      prompt: |
        What is the molarity of the hydrochloric acid?
      options:
        - "0.107 M"
        - "0.188 M"
        - "0.0469 M"
        - "0.0938 M"
      option_explanations:
        - |
          0.107 M is the inverse ratio (25.00/23.45 × 0.100); the acid needed less base than its own volume, so it must be less concentrated than 0.100 M.
        - |
          0.188 M doubles the correct value, as if the ratio were 1:2; HCl and NaOH react 1:1.
        - |
          0.0469 M halves the correct value; no factor of 2 belongs in a 1:1 titration.
        - |
          Correct. HCl + NaOH → NaCl + H₂O is 1:1, so moles HCl = 2.345 × 10⁻³; M = 2.345 × 10⁻³ / 0.02500 L = 0.0938 M.
      answer: 3

    # ---- Single items
    - slug: chem-u06-w24-q04
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly distinguishes the equivalence point from the end point of a titration?
      options:
        - "They are two names for the same thing."
        - "The equivalence point is when the moles of acid and base match the balanced equation; the end point is when the indicator changes colour."
        - "The equivalence point is always at pH 7; the end point is always at pH 8.2."
        - "The end point is reached first, and the equivalence point is reached after one more drop."
      option_explanations:
        - |
          One is a stoichiometric fact and the other an observation; they coincide only if the indicator is well chosen.
        - |
          Correct. The aim of choosing an indicator is to make the visible end point fall at the chemical equivalence point.
        - |
          The equivalence-point pH depends on the acid and base (7 only for strong–strong), and the end point depends on which indicator is used.
        - |
          There is no fixed one-drop gap; with a good indicator the two points are effectively the same volume.
      answer: 1

    - slug: chem-u06-w24-q05
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        25.00 mL of sulfuric acid requires 35.00 mL of 0.200 M NaOH to reach the end point. What is the molarity of the H₂SO₄?
      options:
        - "0.280 M"
        - "0.560 M"
        - "0.0700 M"
        - "0.140 M"
      option_explanations:
        - |
          0.280 M is the result of M_aV_a = M_bV_b, which assumes a 1:1 ratio; sulfuric acid needs two NaOH per molecule.
        - |
          0.560 M doubles instead of halving the moles of base.
        - |
          0.0700 M divides by 2 twice; the mole ratio is applied only once, to the moles of base.
        - |
          Correct. Moles NaOH = 0.200 × 0.03500 = 7.00 × 10⁻³; H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O, so moles H₂SO₄ = 3.50 × 10⁻³; M = 3.50 × 10⁻³ / 0.02500 = 0.140 M.
      answer: 3

    - slug: chem-u06-w24-q06
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Acetic acid (a weak acid) is titrated with sodium hydroxide. The equivalence point is at about pH 8.7. Which indicator is the best choice, and why?
      options:
        - "Phenolphthalein (8.2–10.0), because its colour change lies on the steep part of the curve around the equivalence point"
        - "Methyl orange (3.1–4.4), because it changes colour early and gives a clear warning"
        - "Bromothymol blue (6.0–7.6), because every titration's equivalence point is at pH 7"
        - "Any indicator, because the indicator does not affect the result"
      option_explanations:
        - |
          Correct. The indicator must change within the pH jump at equivalence; phenolphthalein's range brackets 8.7.
        - |
          Methyl orange would change colour in the buffer region long before equivalence, giving a titre far too small.
        - |
          The equivalence point is at 7 only for a strong acid with a strong base; here the acetate ion makes it basic.
        - |
          An indicator that changes at the wrong pH makes the end point miss the equivalence point and the result wrong.
      answer: 0

    - slug: chem-u06-w24-q07
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: pH (vertical, 0 to 14) is plotted against the volume of 0.100 M NaOH added (horizontal, 0 to 50 mL) to 25.00 mL of 0.100 M HCl. The curve starts at pH 1.0, rises slowly to about pH 3 by 24.5 mL, shoots almost vertically to about pH 11 by 25.5 mL, and then levels off near pH 12.5. What does the vertical section at 25.0 mL represent?
      options:
        - "The point where the NaOH is exhausted"
        - "The buffer region of a weak acid"
        - "The equivalence point, where moles of OH⁻ added equal moles of H⁺, with pH 7 at its midpoint"
        - "A measurement error caused by adding base too fast"
      option_explanations:
        - |
          Base is being added from the burette; it is the acid that is exhausted at 25.0 mL.
        - |
          HCl is a strong acid; a strong acid–strong base curve has no buffer region, and the near-vertical section is the opposite of buffering.
        - |
          Correct. 25.00 mL of 0.100 M NaOH supplies exactly the 2.50 × 10⁻³ mol of OH⁻ needed; one drop either side swings the pH by several units, and the midpoint of the jump is pH 7.00.
        - |
          The jump is real chemistry: near equivalence almost no free H⁺ or OH⁻ remains, so a drop of titrant changes the pH enormously.
      answer: 2

    - slug: chem-u06-w24-q08
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        When phosphoric acid is neutralised by calcium hydroxide, ___ H₃PO₄ + ___ Ca(OH)₂ → ___ Ca₃(PO₄)₂ + ___ H₂O, what is the coefficient of water in the balanced equation?
      options:
        - "3"
        - "6"
        - "2"
        - "12"
      option_explanations:
        - |
          Three waters would account for only half the hydrogens: 2 H₃PO₄ carry 6 H and 3 Ca(OH)₂ carry 6 H, twelve in all.
        - |
          Correct. 2 H₃PO₄ + 3 Ca(OH)₂ → Ca₃(PO₄)₂ + 6 H₂O. Check: Ca 3 = 3, P 2 = 2, H 12 = 12, O 8 + 6 = 8 + 6.
        - |
          Two waters would leave eight hydrogen atoms unaccounted for.
        - |
          Twelve waters would need 24 hydrogens; the reactants supply 12.
      answer: 1
      explanation: |
        Review of 4.1: balance the polyatomic ion (PO₄) as a unit, then calcium, then hydrogen as water.

    - slug: chem-u06-w24-q09
      type: multiple_choice
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Before any base is added, 25.00 mL of 0.0500 M HNO₃ sits in the titration flask. What is its pH?
      options:
        - "0.0500"
        - "2.00"
        - "12.70"
        - "1.30"
      option_explanations:
        - |
          0.0500 is the molarity, not its negative logarithm.
        - |
          pH 2.00 would be 0.0100 M, five times more dilute.
        - |
          12.70 is the pH of 0.0500 M NaOH; nitric acid is an acid.
        - |
          Correct. HNO₃ is a strong acid, so [H⁺] = 0.0500 M and pH = −log(0.0500) = 1.30. The volume does not matter for pH.
      answer: 3
      explanation: |
        Review of 6.5: the starting point of a titration curve is the pH of the acid alone.

    - slug: chem-u06-w24-q10
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        How many moles of KOH are in 18.50 mL of a 0.250 M solution?
      options:
        - "4.63 × 10⁻³ mol"
        - "4.63 mol"
        - "0.0740 mol"
        - "7.40 × 10⁻² mol"
      option_explanations:
        - |
          Correct. n = M × V = 0.250 mol/L × 0.01850 L = 4.63 × 10⁻³ mol.
        - |
          4.63 mol leaves the volume in millilitres; it is 1,000 times too large.
        - |
          0.0740 is the volume divided by the molarity (18.50/250), not moles.
        - |
          7.40 × 10⁻² is the same wrong quotient written in scientific notation.
      answer: 0
      explanation: |
        Review of 6.2: moles = molarity × litres is the first step of every titration calculation.

    - slug: chem-u06-w24-q11
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The reaction HBr(aq) + KOH(aq) → KBr(aq) + H₂O(l) is best classified as which type?
      options:
        - "Single replacement"
        - "Double replacement (neutralisation)"
        - "Synthesis"
        - "Combustion"
      option_explanations:
        - |
          Single replacement involves an element displacing another from a compound; no element appears here.
        - |
          Correct. The ions exchange partners: K⁺ pairs with Br⁻ and H⁺ pairs with OH⁻. Neutralisation is a double replacement that forms water.
        - |
          Synthesis combines two substances into one; here two compounds give two products.
        - |
          Combustion involves oxygen and usually a fuel; nothing is burning.
      answer: 1
      explanation: |
        Review of 4.2: neutralisation is the special double replacement whose driving force is the formation of water.

    # ---- Select all
    - slug: chem-u06-w24-q12
      type: multi_select
      topic_code: "6.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which practices improve the accuracy of a titration? Select all that apply.
      options:
        - "Reading the burette to the nearest 0.05 mL at eye level"
        - "Adding the titrant drop by drop near the expected end point"
        - "Adding a large amount of indicator so the colour is easy to see"
        - "Repeating until two titres agree within about 0.1 mL"
        - "Rinsing the burette with distilled water just before filling it with titrant, leaving it wet"
      option_explanations:
        - |
          Correct. The burette's precision is only realised if it is read carefully, avoiding parallax.
        - |
          Correct. Dropwise addition stops the titration within a drop of the true end point.
        - |
          The indicator is itself an acid or base; excess consumes titrant and shifts the end point. Two or three drops are enough.
        - |
          Correct. Concordant results show the end point was found reproducibly; their mean is used.
        - |
          Water left in the burette dilutes the titrant and makes its concentration unknown; rinse with the titrant itself instead.
      answer: [0, 1, 3]

    - slug: chem-u06-w24-q13
      type: multi_select
      topic_code: "6.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        For which acid–base pairs is the solution at the equivalence point neutral (pH 7 at 25 °C)? Select all that apply.
      options:
        - "Hydrochloric acid and sodium hydroxide"
        - "Acetic acid and sodium hydroxide"
        - "Nitric acid and potassium hydroxide"
        - "Hydrochloric acid and ammonia"
        - "Hydrobromic acid and calcium hydroxide"
      option_explanations:
        - |
          Correct. Strong acid with strong base leaves NaCl, whose ions neither donate nor accept protons.
        - |
          Acetic acid is weak; the acetate ion left at equivalence is a weak base, so the solution is basic (about pH 8.7).
        - |
          Correct. Both are strong; the salt KNO₃ is neutral.
        - |
          Ammonia is a weak base; the ammonium ion left at equivalence is a weak acid, so the solution is acidic.
        - |
          Correct. HBr and Ca(OH)₂ are both strong; the salt CaBr₂ is neutral.
      answer: [0, 2, 4]
      explanation: |
        Review of 6.4: only a strong acid with a strong base leaves a salt with no acidic or basic ions.

    # ---- True / false
    - slug: chem-u06-w24-q14
      type: true_false
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In every titration the end point and the equivalence point occur at exactly the same volume, whichever indicator is used.
      answer: false
      explanation: |
        False. The end point is where the indicator changes colour, and that depends on the indicator's pH range. Only an indicator whose range falls on the steep part of the titration curve makes the end point coincide with the equivalence point; methyl orange in a weak acid–strong base titration changes colour far too early.

    - slug: chem-u06-w24-q15
      type: true_false
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: When sulfuric acid is titrated with sodium hydroxide, the moles of NaOH added at the equivalence point are twice the moles of H₂SO₄ in the flask.
      answer: true
      explanation: |
        True. H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O: the balanced equation's 1:2 ratio means two moles of hydroxide neutralise each mole of the diprotic acid. The mole ratio from the equation is the heart of every stoichiometry problem, in solution or not.

    # ---- Fill in the blank
    - slug: chem-u06-w24-q16
      type: fill_blank
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The long graduated glass tube with a tap at the bottom, used to deliver a measured, variable volume of titrant, is called a ____.
      answer: ["burette", "buret"]
      explanation: |
        A burette delivers the titrant and is read to 0.05 mL; the volume used is the final reading minus the initial reading. A pipette delivers one fixed volume of the sample.

