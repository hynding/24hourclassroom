unit: 6
description: |
  40 questions · about 75 minutes · every topic of unit 6 (6.1 to 6.6: solutions and solubility, molarity and
  dilution, colligative properties, acids and bases, pH and pOH, neutralisation and titration), with review of
  intermolecular forces (3.6), the mole (4.4) and vapour pressure (5.6). Two data sets (a solubility table and a
  titration) each carry three questions. Multiple choice, select-all, true/false and numeric items are graded at
  once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
  teacher against the scoring notes. Constants: K_w = 1.0 × 10⁻¹⁴ at 25 °C; water K_f = 1.86 °C/m, K_b = 0.512 °C/m.
questions:
  # ---- Stimulus set A: a solubility table (6.1, 6.2)
  - slug: chem-u06-exam-q01
    type: multiple_choice
    topic_code: "6.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      Solubility in grams of solute per 100 g of water:

      | Temperature (°C) | KNO₃ | NaCl |
      |---|---|---|
      | 10 | 21 | 35.8 |
      | 30 | 46 | 36.3 |
      | 50 | 85 | 37.0 |
      | 70 | 138 | 37.8 |
    prompt: |
      60 g of KNO₃ is stirred into 100 g of water at 50 °C. Which statement is correct?
    options:
      - "The solution is saturated and 25 g of solid remains."
      - "The solution is unsaturated; 25 g more KNO₃ could dissolve."
      - "The solution is supersaturated by 25 g."
      - "Only 46 g dissolves, because that is the value at the nearest lower temperature."
    option_explanations:
      - |
        Solid remains only when more than the solubility (85 g at 50 °C) is added; 60 g is less.
      - |
        Correct. The solubility at 50 °C is 85 g per 100 g of water, so all 60 g dissolves and 85 − 60 = 25 g more could be added.
      - |
        Supersaturation would require more than 85 g in solution; 60 g is well below that.
      - |
        The table gives 85 g at 50 °C directly; there is no need to use the 30 °C value.
    answer: 1

  - slug: chem-u06-exam-q02
    type: multiple_choice
    topic_code: "6.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      Solubility in grams of solute per 100 g of water:

      | Temperature (°C) | KNO₃ | NaCl |
      |---|---|---|
      | 10 | 21 | 35.8 |
      | 30 | 46 | 36.3 |
      | 50 | 85 | 37.0 |
      | 70 | 138 | 37.8 |
    prompt: |
      A saturated solution of KNO₃ in 50 g of water at 70 °C is cooled to 30 °C. What mass of KNO₃ crystallises?
    options:
      - "92 g"
      - "138 g"
      - "23 g"
      - "46 g"
    option_explanations:
      - |
        92 g is the amount per 100 g of water (138 − 46); this solution has only 50 g of water.
      - |
        138 g is the solubility at 70 °C per 100 g; it is neither the amount dissolved here nor the amount that crystallises.
      - |
        23 g would be the answer for 25 g of water.
      - |
        Correct. Per 100 g of water, 138 − 46 = 92 g crystallises; with 50 g of water, half of that: 46 g.
    answer: 3

  - slug: chem-u06-exam-q03
    type: multiple_choice
    topic_code: "6.2"
    source: "PubChem (molar masses)"
    points: 1
    stimulus: |
      Solubility in grams of solute per 100 g of water:

      | Temperature (°C) | KNO₃ | NaCl |
      |---|---|---|
      | 10 | 21 | 35.8 |
      | 30 | 46 | 36.3 |
      | 50 | 85 | 37.0 |
      | 70 | 138 | 37.8 |
    prompt: |
      The saturated KNO₃ solution at 30 °C (46 g of KNO₃, 101.10 g/mol, in 100 g of water) has a volume of 125 mL. What is its molarity?
    options:
      - "0.455 M"
      - "3.64 M"
      - "0.368 M"
      - "4.55 M"
    option_explanations:
      - |
        0.455 is the number of moles of KNO₃ (46/101.10), not yet divided by the volume in litres.
      - |
        Correct. 46 g ÷ 101.10 g/mol = 0.455 mol; 125 mL = 0.125 L; M = 0.455/0.125 = 3.64 M.
      - |
        0.368 is grams per millilitre (46/125), a density-like quantity, not a molarity.
      - |
        4.55 M would follow from dividing by 0.100 L, the volume of the water rather than of the solution.
    answer: 1

  # ---- Stimulus set B: a titration (6.6, 6.5)
  - slug: chem-u06-exam-q04
    type: multiple_choice
    topic_code: "6.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      A 20.00 mL sample of barium hydroxide solution is titrated with 0.100 M hydrochloric acid using phenolphthalein. Three concordant titres average 30.00 mL.

      Ba(OH)₂(aq) + 2 HCl(aq) → BaCl₂(aq) + 2 H₂O(l)
    prompt: |
      How many moles of HCl were added to reach the end point?
    options:
      - "3.00 × 10⁻³ mol"
      - "2.00 × 10⁻³ mol"
      - "3.00 mol"
      - "1.50 × 10⁻³ mol"
    option_explanations:
      - |
        Correct. n = M × V = 0.100 mol/L × 0.03000 L = 3.00 × 10⁻³ mol.
      - |
        2.00 × 10⁻³ mol would correspond to the 20.00 mL sample volume, not the titre.
      - |
        3.00 mol leaves the volume in millilitres; 30.00 mL is 0.03000 L.
      - |
        1.50 × 10⁻³ mol is the moles of Ba(OH)₂, after applying the 2:1 ratio; the question asks for HCl.
    answer: 0

  - slug: chem-u06-exam-q05
    type: multiple_choice
    topic_code: "6.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      A 20.00 mL sample of barium hydroxide solution is titrated with 0.100 M hydrochloric acid using phenolphthalein. Three concordant titres average 30.00 mL.

      Ba(OH)₂(aq) + 2 HCl(aq) → BaCl₂(aq) + 2 H₂O(l)
    prompt: |
      What is the molarity of the barium hydroxide solution?
    options:
      - "0.150 M"
      - "0.300 M"
      - "0.0750 M"
      - "0.0375 M"
    option_explanations:
      - |
        0.150 M is what M₁V₁ = M₂V₂ gives, but the reaction is 1:2, so the acid moles must be halved first.
      - |
        0.300 M doubles instead of halving the moles of acid.
      - |
        Correct. Moles Ba(OH)₂ = 3.00 × 10⁻³ ÷ 2 = 1.50 × 10⁻³ mol; M = 1.50 × 10⁻³ / 0.02000 L = 0.0750 M.
      - |
        0.0375 M halves the moles twice; the 2:1 ratio is applied only once, to the moles of acid.
    answer: 2

  - slug: chem-u06-exam-q06
    type: multiple_choice
    topic_code: "6.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      A 20.00 mL sample of barium hydroxide solution is titrated with 0.100 M hydrochloric acid using phenolphthalein. Three concordant titres average 30.00 mL.

      Ba(OH)₂(aq) + 2 HCl(aq) → BaCl₂(aq) + 2 H₂O(l)
    prompt: |
      The barium hydroxide solution is 0.0750 M. What is its pH before any acid is added?
    options:
      - "1.12"
      - "12.88"
      - "0.82"
      - "13.18"
    option_explanations:
      - |
        1.12 is the pOH of 0.0750 M OH⁻, which ignores the second hydroxide and reports the wrong quantity.
      - |
        12.88 forgets that Ba(OH)₂ releases two OH⁻ per formula unit.
      - |
        0.82 is the pOH; the pH of a strong base is 14 minus that.
      - |
        Correct. [OH⁻] = 2 × 0.0750 = 0.150 M; pOH = −log(0.150) = 0.82; pH = 14.00 − 0.82 = 13.18.
    answer: 3

  # ---- Solutions and solubility (6.1)
  - slug: chem-u06-exam-q07
    type: multiple_choice
    topic_code: "6.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which pair of substances is most likely to form a solution?
    options:
      - "Iodine, I₂ (nonpolar), and carbon tetrachloride, CCl₄ (nonpolar)"
      - "Sodium chloride and hexane"
      - "Vegetable oil and water"
      - "Sand and water"
    option_explanations:
      - |
        Correct. Both are nonpolar and held by dispersion forces, so the attractions formed match those broken: like dissolves like.
      - |
        An ionic solid cannot be pulled apart by a nonpolar solvent's weak dispersion forces.
      - |
        Nonpolar oil offers water nothing to replace its hydrogen bonds; they separate into layers.
      - |
        Sand (silicon dioxide) is a covalent network solid that does not dissolve in water at all.
    answer: 0

  - slug: chem-u06-exam-q08
    type: multiple_choice
    topic_code: "6.1"
    source: "general knowledge"
    points: 1
    prompt: |
      A lake's dissolved oxygen falls during a heatwave. Which explanation is correct?
    options:
      - "Warm water is less dense, so oxygen floats out."
      - "The solubility of a gas decreases as temperature rises, so less oxygen can stay dissolved in warmer water."
      - "Oxygen reacts with water at high temperatures."
      - "Heat lowers the pressure of the atmosphere above the lake."
    option_explanations:
      - |
        Density differences do not expel dissolved molecules; solubility is an equilibrium quantity.
      - |
        Correct. Dissolved gas molecules with more kinetic energy escape the liquid more readily, so the equilibrium amount falls with temperature, the opposite of most solids.
      - |
        Oxygen does not react with water under these conditions.
      - |
        Atmospheric pressure is not lowered by a warm day in a way that affects the lake's oxygen.
    answer: 1

  # ---- Molarity and dilution (6.2)
  - slug: chem-u06-exam-q09
    type: multiple_choice
    topic_code: "6.2"
    source: "PubChem (molar masses)"
    points: 1
    prompt: |
      How many grams of sodium chloride (58.44 g/mol) are needed to prepare 250.0 mL of 0.400 M NaCl?
    options:
      - "23.4 g"
      - "0.100 g"
      - "5.84 g"
      - "58.4 g"
    option_explanations:
      - |
        23.4 g is the mass for 1.000 L; the volume is a quarter of that.
      - |
        0.100 is the number of moles (0.400 × 0.2500), not the mass.
      - |
        Correct. n = 0.400 mol/L × 0.2500 L = 0.100 mol; 0.100 × 58.44 = 5.84 g.
      - |
        58.4 g is one mole, enough for 2.50 L of this solution.
    answer: 2

  - slug: chem-u06-exam-q10
    type: multiple_choice
    topic_code: "6.2"
    source: "general knowledge"
    points: 1
    prompt: |
      A student dilutes 25.0 mL of 2.00 M sulfuric acid to a final volume of 500.0 mL. What is the new concentration?
    options:
      - "0.100 M"
      - "0.0500 M"
      - "40.0 M"
      - "1.00 M"
    option_explanations:
      - |
        Correct. M₂ = M₁V₁/V₂ = (2.00 × 25.0)/500.0 = 0.100 M; a twentyfold increase in volume gives a twentyfold drop in concentration.
      - |
        0.0500 M would be a fortyfold dilution, to 1,000 mL.
      - |
        40.0 M inverts the ratio; diluting must lower the concentration.
      - |
        1.00 M is only a twofold dilution, to 50.0 mL.
    answer: 0

  - slug: chem-u06-exam-q11
    type: multiple_choice
    topic_code: "6.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which solution contains the greatest number of moles of chloride ions?
    options:
      - "100.0 mL of 0.30 M NaCl"
      - "100.0 mL of 0.20 M CaCl₂"
      - "50.0 mL of 0.50 M KCl"
      - "200.0 mL of 0.10 M AlCl₃"
    option_explanations:
      - |
        0.30 × 0.1000 = 0.030 mol NaCl gives only 0.030 mol Cl⁻, one chloride per formula unit.
      - |
        0.020 mol CaCl₂ gives 0.040 mol Cl⁻, more than the NaCl but less than the aluminium chloride.
      - |
        0.025 mol KCl gives 0.025 mol Cl⁻, the smallest of the four.
      - |
        Correct. 0.10 × 0.2000 = 0.020 mol AlCl₃, and each releases three Cl⁻: 0.060 mol of chloride.
    answer: 3

  # ---- Colligative properties (6.3)
  - slug: chem-u06-exam-q12
    type: multiple_choice
    topic_code: "6.3"
    source: "PubChem (molar masses)"
    points: 1
    prompt: |
      What is the molality of a solution of 9.00 g of glucose (180.16 g/mol) in 200.0 g of water?
    options:
      - "0.0450 m"
      - "45.0 m"
      - "0.0500 m"
      - "0.250 m"
    option_explanations:
      - |
        0.0450 is 9.00/200, grams per gram, with no conversion to moles.
      - |
        45.0 is grams of glucose per kilogram of water, not moles per kilogram.
      - |
        0.0500 is the number of moles, not yet divided by the kilograms of water.
      - |
        Correct. 9.00 ÷ 180.16 = 0.0500 mol; 200.0 g = 0.2000 kg; m = 0.0500/0.2000 = 0.250 m.
    answer: 3

  - slug: chem-u06-exam-q13
    type: multiple_choice
    topic_code: "6.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which 0.10 m aqueous solution has the LOWEST freezing point?
    options:
      - "Sucrose, C₁₂H₂₂O₁₁"
      - "Potassium chloride, KCl"
      - "Aluminium nitrate, Al(NO₃)₃"
      - "Magnesium sulfate, MgSO₄"
    option_explanations:
      - |
        Sucrose is molecular (i = 1): 0.10 m of particles, the smallest depression.
      - |
        KCl gives two ions (i = 2): 0.20 m of particles.
      - |
        Correct. Al(NO₃)₃ gives Al³⁺ + 3 NO₃⁻, four particles (i = 4): 0.40 m of particles and the largest freezing-point depression.
      - |
        MgSO₄ gives Mg²⁺ + SO₄²⁻, two particles (i = 2), like KCl.
    answer: 2

  - slug: chem-u06-exam-q14
    type: multiple_choice
    topic_code: "6.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A red blood cell is placed in pure water. What happens, and why?
    options:
      - "Water flows into the cell and it swells, because the cell's contents have more solute particles than pure water."
      - "Water flows out of the cell and it shrivels, because pure water has a higher osmotic pressure."
      - "Nothing, because the cell membrane blocks water."
      - "Salt flows out of the cell until the concentrations match."
    option_explanations:
      - |
        Correct. Osmosis moves solvent toward the side with more solute particles; the cell interior (about 0.3 m in particles) draws water in until the cell bursts.
      - |
        The direction is reversed: pure water has the lowest possible osmotic pressure.
      - |
        The membrane is semipermeable: water passes through it readily.
      - |
        The membrane does not pass ions freely; the net movement is of water.
    answer: 0

  # ---- Acids and bases (6.4)
  - slug: chem-u06-exam-q15
    type: multiple_choice
    topic_code: "6.4"
    source: "general knowledge"
    points: 1
    prompt: |
      In the reaction HSO₄⁻(aq) + H₂O(l) ⇌ SO₄²⁻(aq) + H₃O⁺(aq), the conjugate acid–base pairs are
    options:
      - "HSO₄⁻/H₂O and SO₄²⁻/H₃O⁺"
      - "HSO₄⁻/SO₄²⁻ and H₃O⁺/H₂O"
      - "HSO₄⁻/H₃O⁺ and H₂O/SO₄²⁻"
      - "H₂O/H₃O⁺ only; HSO₄⁻ is not part of a pair"
    option_explanations:
      - |
        These pair reactants with each other and products with each other; a conjugate pair spans the arrow and differs by one proton.
      - |
        Correct. HSO₄⁻ loses a proton to become SO₄²⁻ (acid/conjugate base); H₂O gains it to become H₃O⁺ (base/conjugate acid).
      - |
        HSO₄⁻ and H₃O⁺ differ by more than a proton; they are not a conjugate pair.
      - |
        Every Brønsted–Lowry reaction has two pairs; HSO₄⁻/SO₄²⁻ is the second.
    answer: 1

  - slug: chem-u06-exam-q16
    type: multiple_choice
    topic_code: "6.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which list contains ONLY strong acids?
    options:
      - "HCl, HF, HNO₃"
      - "H₂SO₄, CH₃COOH, HBr"
      - "HNO₃, HClO₄, HI"
      - "H₂CO₃, HCl, H₃PO₄"
    option_explanations:
      - |
        HF is a weak acid despite being a hydrogen halide.
      - |
        Acetic acid, CH₃COOH, is the standard weak acid.
      - |
        Correct. Nitric, perchloric and hydroiodic acids all ionise completely in water.
      - |
        Carbonic and phosphoric acids are both weak.
    answer: 2

  - slug: chem-u06-exam-q17
    type: multiple_choice
    topic_code: "6.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which observation would distinguish a solution of a strong acid from a solution of a weak acid at the same concentration?
    options:
      - "The strong acid turns litmus red; the weak acid does not."
      - "The strong acid tastes sour; the weak acid does not."
      - "The weak acid reacts with magnesium; the strong acid does not."
      - "The strong acid solution conducts electricity much better and has a lower pH."
    option_explanations:
      - |
        Both turn blue litmus red; litmus does not measure how much H⁺ is present.
      - |
        Both taste sour (and should never be tasted in a laboratory).
      - |
        Both react with magnesium; the strong acid reacts faster because it has more H⁺.
      - |
        Correct. Complete ionisation gives far more ions, so higher conductivity, and far more H⁺, so a lower pH (1.0 versus about 2.9 at 0.10 M).
    answer: 3

  # ---- pH and pOH (6.5)
  - slug: chem-u06-exam-q18
    type: multiple_choice
    topic_code: "6.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A solution has pH 5.00 at 25 °C. What is its hydroxide ion concentration?
    options:
      - "1.0 × 10⁻⁹ M"
      - "1.0 × 10⁻⁵ M"
      - "5.0 M"
      - "1.0 × 10⁻¹⁴ M"
    option_explanations:
      - |
        Correct. pOH = 14.00 − 5.00 = 9.00, so [OH⁻] = 1.0 × 10⁻⁹ M; equivalently K_w/[H⁺] = 10⁻¹⁴/10⁻⁵.
      - |
        1.0 × 10⁻⁵ M is the hydrogen ion concentration, not the hydroxide.
      - |
        5.0 is the pH value itself, a logarithm, not a concentration in mol/L.
      - |
        1.0 × 10⁻¹⁴ is K_w, the product of the two concentrations.
    answer: 0

  - slug: chem-u06-exam-q19
    type: multiple_choice
    topic_code: "6.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which solution is the most acidic?
    options:
      - "pH 3.5"
      - "[H⁺] = 1.0 × 10⁻² M"
      - "pOH 11.5"
      - "[OH⁻] = 1.0 × 10⁻¹⁰ M"
    option_explanations:
      - |
        pH 3.5 has [H⁺] = 3.2 × 10⁻⁴ M, about thirty times less than option B.
      - |
        Correct. [H⁺] = 1.0 × 10⁻² M is pH 2.0, the highest H⁺ concentration and lowest pH of the four.
      - |
        pOH 11.5 is pH 14.0 − 11.5 = 2.5, so [H⁺] = 3.2 × 10⁻³ M, about a third of option B's.
      - |
        [OH⁻] = 1.0 × 10⁻¹⁰ M gives [H⁺] = 1.0 × 10⁻⁴ M, pH 4.0.
    answer: 1

  - slug: chem-u06-exam-q20
    type: multiple_choice
    topic_code: "6.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Lemon juice has pH 2 and milk has pH 6. How do their hydrogen ion concentrations compare?
    options:
      - "Lemon juice has 3 times the H⁺ concentration of milk."
      - "Lemon juice has 4 times the H⁺ concentration of milk."
      - "Lemon juice has 10,000 times the H⁺ concentration of milk."
      - "Milk has 4 times the H⁺ concentration of lemon juice."
    option_explanations:
      - |
        The pH values have a ratio of 3, but pH is logarithmic, so ratios of pH numbers mean nothing.
      - |
        Four pH units is a difference in exponent, not a factor of 4.
      - |
        Correct. Each pH unit is a factor of ten in [H⁺]; four units is 10⁴ = 10,000.
      - |
        Lower pH means more H⁺, so lemon juice is the more acidic, not milk.
    answer: 2

  # ---- Titration (6.6)
  - slug: chem-u06-exam-q21
    type: multiple_choice
    topic_code: "6.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Ammonia solution is titrated with hydrochloric acid. The equivalence point is at about pH 5.3. Which indicator should be used?
    options:
      - "Phenolphthalein (8.2–10.0)"
      - "Methyl red (4.4–6.2)"
      - "Bromothymol blue (6.0–7.6)"
      - "No indicator is needed; the solution changes colour on its own."
    option_explanations:
      - |
        Phenolphthalein changes colour in a range the solution leaves early in the titration, far from equivalence.
      - |
        Correct. Methyl red's range brackets pH 5.3, the equivalence point of a strong acid with a weak base.
      - |
        Bromothymol blue's range is above the equivalence pH; it would change colour before equivalence.
      - |
        Acid–base solutions are colourless; an indicator is needed to see the end point.
    answer: 1

  # ---- Review of earlier units
  - slug: chem-u06-exam-q22
    type: multiple_choice
    topic_code: "3.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Methanol (CH₃OH) mixes with water in all proportions, but octane (C₈H₁₈) does not dissolve in water at all. Which explanation is correct?
    options:
      - "Methanol's O–H group hydrogen-bonds with water, while octane has only dispersion forces and cannot compete with water's hydrogen bonds."
      - "Methanol is lighter than octane."
      - "Octane is ionic and water is covalent."
      - "Octane is denser than water, so it sinks and cannot mix."
    option_explanations:
      - |
        Correct. Dissolving requires attractions formed to match those broken; methanol can replace water–water hydrogen bonds with methanol–water ones, but octane cannot.
      - |
        Molecular mass does not determine solubility; many heavy molecules dissolve in water.
      - |
        Octane is a nonpolar covalent hydrocarbon, not ionic.
      - |
        Octane is less dense than water and floats; density does not explain solubility anyway.
    answer: 0
    explanation: |
      Review of 3.6: like dissolves like is intermolecular forces applied to mixing.

  - slug: chem-u06-exam-q23
    type: multiple_choice
    topic_code: "4.4"
    source: "PubChem (molar masses)"
    points: 1
    prompt: |
      What is the molar mass of calcium hydroxide, Ca(OH)₂ (Ca 40.08, O 16.00, H 1.008)?
    options:
      - "57.09 g/mol"
      - "58.10 g/mol"
      - "74.10 g/mol"
      - "97.10 g/mol"
    option_explanations:
      - |
        57.09 counts only one OH group: 40.08 + 17.01.
      - |
        58.10 adds two hydrogens but only one oxygen.
      - |
        Correct. 40.08 + 2(16.00 + 1.008) = 40.08 + 34.02 = 74.10 g/mol.
      - |
        97.10 would be three OH groups, which the formula does not contain.
    answer: 2
    explanation: |
      Review of 4.4: the subscript outside a parenthesis multiplies everything inside it.

  - slug: chem-u06-exam-q24
    type: multiple_choice
    topic_code: "5.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Pure water boils at 100 °C at 1 atm because at that temperature
    options:
      - "all of its hydrogen bonds break at once."
      - "its density falls below that of air."
      - "its specific heat reaches a maximum."
      - "its vapour pressure equals the external pressure of 1 atm."
    option_explanations:
      - |
        Hydrogen bonds break gradually as molecules leave the liquid; there is no single moment when all break.
      - |
        Liquid water remains about 800 times denser than air at its boiling point.
      - |
        Specific heat is the energy needed per degree of warming; it does not define the boiling point.
      - |
        Correct. Boiling is the condition vapour pressure = external pressure; adding a solute lowers the vapour pressure and so raises the boiling point, which is this unit's boiling-point elevation.
    answer: 3
    explanation: |
      Review of 5.6: the definition of boiling underlies colligative boiling-point elevation.

  # ---- Select all
  - slug: chem-u06-exam-q25
    type: multi_select
    topic_code: "6.3"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following are colligative properties, depending on the number of solute particles rather than their identity? Select all that apply.
    options:
      - "Freezing-point depression"
      - "Colour of the solution"
      - "Boiling-point elevation"
      - "Vapour-pressure lowering"
      - "Electrical conductivity"
    option_explanations:
      - |
        Correct. ΔT_f = i K_f m depends only on the particle molality.
      - |
        Colour depends entirely on what the solute is (copper sulfate is blue, sodium sulfate colourless).
      - |
        Correct. ΔT_b = i K_b m, again particle count only.
      - |
        Correct. Raoult's law makes the lowering proportional to the solute's mole fraction.
      - |
        Conductivity depends on whether the solute forms ions and how mobile they are, which is identity, not just number.
    answer: [0, 2, 3]

  - slug: chem-u06-exam-q26
    type: multi_select
    topic_code: "6.4"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which statements about acids and bases are correct? Select all that apply.
    options:
      - "A Brønsted–Lowry base must contain hydroxide ions."
      - "Water can act as either a Brønsted–Lowry acid or base."
      - "A 1.0 M solution of a weak acid is more concentrated than a 0.10 M solution of a strong acid."
      - "Acids react with carbonates to release carbon dioxide."
      - "A strong base is one that dissolves in large amounts."
    option_explanations:
      - |
        A Brønsted–Lowry base is any proton acceptor; ammonia is a base with no hydroxide.
      - |
        Correct. Water accepts a proton from HCl and donates one to NH₃; it is amphoteric.
      - |
        Correct. Concentration is about the amount dissolved; 1.0 M is more concentrated than 0.10 M regardless of strength.
      - |
        Correct. H⁺ converts carbonate to carbonic acid, which decomposes to CO₂ and water.
      - |
        Strength is about complete ionisation, not solubility; Ca(OH)₂ is only slightly soluble yet strong.
    answer: [1, 2, 3]

  - slug: chem-u06-exam-q27
    type: multi_select
    topic_code: "6.6"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      In a titration of a strong acid with a strong base, which statements are correct? Select all that apply.
    options:
      - "The equivalence point is at pH 7 at 25 °C."
      - "The pH changes most rapidly near the equivalence point."
      - "Phenolphthalein is a suitable indicator."
      - "The volume of base needed depends on whether the acid is strong or weak."
      - "The net ionic equation is H⁺ + OH⁻ → H₂O."
    option_explanations:
      - |
        Correct. The salt of a strong acid and strong base is neutral.
      - |
        Correct. Near equivalence almost no free H⁺ or OH⁻ remains, so one drop swings the pH by several units.
      - |
        Correct. Its range (8.2–10.0) lies within the steep jump from about pH 3 to 11.
      - |
        The volume depends only on the moles of acid (concentration × volume × protons per molecule); strength changes the curve's shape, not the stoichiometry.
      - |
        Correct. Spectator ions are omitted; every strong–strong neutralisation shares this equation.
    answer: [0, 1, 2, 4]

  # ---- True / false
  - slug: chem-u06-exam-q28
    type: true_false
    topic_code: "6.1"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: Crushing a solid solute into a powder increases its solubility in water.
    answer: false
    explanation: |
      False. Crushing increases the surface area and makes the solid dissolve faster, but the solubility, the equilibrium amount that can dissolve at a given temperature, is unchanged. Only temperature (and, for gases, pressure) changes solubility.

  - slug: chem-u06-exam-q29
    type: true_false
    topic_code: "6.5"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: A neutral solution at 25 °C contains no hydrogen ions and no hydroxide ions.
    answer: false
    explanation: |
      False. Water self-ionises, so even pure water contains 1.0 × 10⁻⁷ M of each ion. Neutral means the two concentrations are equal, not zero; their product is always K_w = 1.0 × 10⁻¹⁴.

  - slug: chem-u06-exam-q30
    type: true_false
    topic_code: "6.2"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: Diluting a solution changes its concentration but not the number of moles of solute it contains.
    answer: true
    explanation: |
      True. Adding solvent spreads the same solute through a larger volume. That is why M₁V₁ = M₂V₂ works: both sides are the unchanged moles of solute.

  # ---- Fill in the blank
  - slug: chem-u06-exam-q31
    type: fill_blank
    topic_code: "6.3"
    source: "general knowledge"
    points: 1
    prompt: |
      The number of particles that one formula unit of a solute produces in solution, used as the factor i in colligative-property equations, is called the ____ factor.
    answer: ["van 't Hoff", "van't Hoff", "vant Hoff", "van t Hoff", "Van 't Hoff", "Van't Hoff"]
    explanation: |
      The van 't Hoff factor is 1 for molecular solutes, 2 for NaCl, 3 for CaCl₂ and 4 for AlCl₃ in the ideal case. Multiply the molality by i to get the particle molality.

  - slug: chem-u06-exam-q32
    type: fill_blank
    topic_code: "6.4"
    source: "general knowledge"
    points: 1
    prompt: |
      When an acid dissolves in water, the proton it releases attaches to a water molecule to form the ____ ion, H₃O⁺.
    answer: ["hydronium", "hydronium ion", "oxonium"]
    explanation: |
      A bare proton cannot exist in water; it bonds to a lone pair on a water molecule to give the hydronium ion. "H⁺(aq)" and "H₃O⁺(aq)" are two ways of writing the same species.

  - slug: chem-u06-exam-q33
    type: fill_blank
    topic_code: "4.4"
    source: "PubChem (molar masses)"
    points: 1
    prompt: |
      The molar mass of sodium hydroxide, NaOH (Na 22.99, O 16.00, H 1.008), is ____ g/mol.
    answer: ["40.00", "40.0", "40", "40.00 g/mol", "40.0 g/mol"]
    explanation: |
      22.99 + 16.00 + 1.008 = 40.00 g/mol. A 0.100 M NaOH standard solution therefore contains 4.00 g per litre.

