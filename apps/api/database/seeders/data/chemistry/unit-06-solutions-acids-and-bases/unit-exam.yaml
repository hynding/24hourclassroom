  - slug: chem-u06-exam-q35
    type: numeric
    topic_code: "6.3"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the freezing point of a 0.250 m aqueous solution of calcium chloride, CaCl₂, assuming complete dissociation? Use K_f = 1.86 °C/m. Give your answer in °C to two decimal places (negative for below zero).
    answer: { value: -1.40, tolerance: 0.02 }
    explanation: |
      i = 3 for CaCl₂. ΔT_f = 3 × 1.86 × 0.250 = 1.395 °C, so the freezing point is 0.00 − 1.40 = −1.40 °C.

  - slug: chem-u06-exam-q36
    type: numeric
    topic_code: "6.5"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the pH of 0.0040 M sodium hydroxide at 25 °C? Give your answer to two decimal places.
    answer: { value: 11.60, tolerance: 0.01 }
    explanation: |
      [OH⁻] = 4.0 × 10⁻³ M; pOH = −log(4.0 × 10⁻³) = 2.40; pH = 14.00 − 2.40 = 11.60.

  - slug: chem-u06-exam-q37
