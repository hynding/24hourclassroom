  # ---- Short answer
  - slug: chem-u06-exam-q38
    type: short_answer
    topic_code: "6.3"
    source: "PubChem (molar masses)"
    points: 3
    prompt: |
      A cook adds 29.2 g of table salt, NaCl (58.44 g/mol), to 2.00 kg of water to boil pasta. Answer (a), (b) and (c). (K_b = 0.512 °C/m.)

      (a) Calculate the boiling point of the salted water at 1 atm.
      (b) The cook claims the salt "makes the water boil much hotter so the pasta cooks faster". Evaluate the claim using your answer to (a).
      (c) Explain why the same mass of sugar would raise the boiling point by less than half as much.
    answer: |
      (a) 29.2 ÷ 58.44 = 0.500 mol NaCl; m = 0.500/2.00 = 0.250 m; i = 2. ΔT_b = 2 × 0.512 × 0.250 = 0.256 °C. Boiling point ≈ 100.26 °C.
      (b) The claim is exaggerated: a quarter of a degree is real but negligible for cooking. The salt is added for flavour; the boiling point barely changes at kitchen concentrations.
      (c) Sucrose (342.30 g/mol) gives 29.2/342.30 = 0.0853 mol, a molality of 0.0427 m, and it stays as molecules (i = 1), so the particle molality is 0.0427 m against the salt's 0.500 m: about twelve times fewer particles, so ΔT_b ≈ 0.02 °C. Both the larger molar mass and the absence of ionisation reduce the effect.
    explanation: |
      Three points, one per part.

      (a) 1 pt: 0.250 m, i = 2, ΔT_b ≈ 0.26 °C, boiling point ≈ 100.26 °C (accept 100.2–100.3).

      (b) 1 pt: claim judged exaggerated or false because the rise is about 0.26 °C, too small to affect cooking time.

      (c) 1 pt: fewer moles per gram (larger molar mass) and i = 1 for sugar; either reason earns half, both earn the point.

  - slug: chem-u06-exam-q39
    type: short_answer
    topic_code: "6.5"
    source: "general knowledge"
    points: 3
    stimulus: |
      A student mixes 50.0 mL of 0.100 M HCl with 50.0 mL of 0.100 M NaOH, then measures the pH of the mixture. In a second experiment the student mixes 50.0 mL of 0.100 M HCl with 50.0 mL of 0.100 M ammonia solution and measures the pH again.
    prompt: |
      Using the information, answer (a), (b) and (c).

      (a) Predict the pH of the first mixture and justify it with a net ionic equation.
      (b) Predict whether the second mixture's pH is above, below or equal to 7, and explain why.
      (c) If the student had mixed 50.0 mL of 0.100 M HCl with only 25.0 mL of 0.100 M NaOH, calculate the pH of that mixture.
    answer: |
      (a) pH 7.00. Equal moles of H⁺ (5.00 × 10⁻³) and OH⁻ (5.00 × 10⁻³) react completely, H⁺(aq) + OH⁻(aq) → H₂O(l), leaving a neutral NaCl solution.
      (b) Below 7. Equal moles of HCl and NH₃ react to give NH₄Cl, and the ammonium ion is a weak acid (the conjugate acid of a weak base), so the solution is slightly acidic (around pH 5).
      (c) Moles H⁺ = 5.00 × 10⁻³; moles OH⁻ = 2.50 × 10⁻³; excess H⁺ = 2.50 × 10⁻³ mol in a total volume of 75.0 mL (0.0750 L): [H⁺] = 2.50 × 10⁻³ / 0.0750 = 0.0333 M; pH = −log(0.0333) = 1.48.
    explanation: |
      Three points, one per part.

      (a) 1 pt: pH 7 with the net ionic equation and the reasoning that moles of H⁺ and OH⁻ are equal.

      (b) 1 pt: below 7 because NH₄⁺ is a weak acid (or because ammonia is a weak base and its salt is acidic).

      (c) 1 pt: excess 2.50 × 10⁻³ mol H⁺ in 0.0750 L, [H⁺] = 0.0333 M, pH 1.48 (accept 1.47–1.49). Zero if the total volume is not used.

  # ---- Long answer
  - slug: chem-u06-exam-q40
    type: long_answer
    topic_code: "6.6"
    source: "PubChem (molar masses)"
    points: 6
    prompt: |
      A water-treatment technician must find the concentration of sulfuric acid in a waste stream before neutralising it with lime. She takes a 10.00 mL sample, dilutes it to 100.0 mL in a volumetric flask, and titrates 25.00 mL portions of the diluted sample with 0.100 M NaOH using phenolphthalein. Her concordant titres average 22.40 mL.

      Write a full account that (1) gives the balanced equation for the titration and explains why the mole ratio matters in this case; (2) calculates the molarity of the diluted acid and then of the original waste stream, showing how the dilution is undone; (3) calculates the mass of calcium hydroxide, Ca(OH)₂ (74.10 g/mol), needed to neutralise 1,000 L of the original waste stream, with the balanced equation for that reaction; and (4) explains why phenolphthalein is a suitable indicator here and what the technician would observe at the end point.
    answer: |
      (1) H₂SO₄(aq) + 2 NaOH(aq) → Na₂SO₄(aq) + 2 H₂O(l). Sulfuric acid is diprotic, so two moles of hydroxide are consumed per mole of acid; using a 1:1 shortcut would double the calculated concentration.

      (2) Moles NaOH = 0.100 × 0.02240 = 2.24 × 10⁻³ mol; moles H₂SO₄ in 25.00 mL = 1.12 × 10⁻³ mol; molarity of the diluted acid = 1.12 × 10⁻³ / 0.02500 = 0.0448 M. The original was diluted tenfold (10.00 mL → 100.0 mL), so by M₁V₁ = M₂V₂ the original concentration is 0.0448 × (100.0/10.00) = 0.448 M.

      (3) H₂SO₄(aq) + Ca(OH)₂(s) → CaSO₄(s) + 2 H₂O(l), a 1:1 ratio. Moles of H₂SO₄ in 1,000 L = 0.448 mol/L × 1,000 L = 448 mol, so 448 mol of Ca(OH)₂ is needed: 448 × 74.10 = 33,200 g, about 33.2 kg of lime.

      (4) Sulfuric acid and sodium hydroxide are both strong, so the equivalence point is at pH 7 and the pH jumps from about 3 to 11 within a drop; phenolphthalein's range (8.2–10.0) lies inside that jump, so its end point coincides with the equivalence point. The solution stays colourless while acid remains and turns a lasting pale pink at the first slight excess of base.
    explanation: |
      Six points.

      Equation and ratio (0–1): balanced equation with the 1:2 acid:base ratio and the reason it matters (diprotic acid).

      Titration and dilution (0–2): 1 pt for 2.24 × 10⁻³ mol NaOH, 1.12 × 10⁻³ mol acid and 0.0448 M diluted; 1 pt for undoing the tenfold dilution to 0.448 M.

      Lime calculation (0–2): 1 pt for the balanced 1:1 equation with Ca(OH)₂; 1 pt for 448 mol and about 33.2 kg (accept 33–33.5 kg).

      Indicator (0–1): strong–strong equivalence at pH 7, long steep jump covering phenolphthalein's range, colourless to pink.

      Common errors: omitting the factor of 2; forgetting to multiply back by the dilution factor; using 25.00 mL as the original sample volume; reporting grams instead of kilograms without conversion.
