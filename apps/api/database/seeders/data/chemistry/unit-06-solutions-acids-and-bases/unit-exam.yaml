    source: "general knowledge"
    points: 1
    prompt: |
      25.00 mL of nitric acid is neutralised by 32.00 mL of 0.125 M potassium hydroxide. What is the molarity of the nitric acid? Give your answer in mol/L to three decimal places.
    answer: { value: 0.160, tolerance: 0.002 }
    explanation: |
