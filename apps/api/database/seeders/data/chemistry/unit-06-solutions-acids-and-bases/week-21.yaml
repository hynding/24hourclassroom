week: 21
unit: 6
title: "Solutions, Solubility, Molarity and Dilution"
topics: ["6.1", "6.2"]
guide: guides/week-21.md
guide_description: |
  Why like dissolves like, the vocabulary of saturated, unsaturated and supersaturated solutions, how to read a
  solubility curve (is it saturated, how much crystallises on cooling, scaling to other masses of water), why gases
  dissolve less in warm water and more under pressure, then molarity and dilution with worked examples on preparing
  a solution, ion concentrations and M₁V₁ = M₂V₂.
flashcards_description: |
  28 cards on solution vocabulary, like dissolves like, solubility curves, gas solubility, molarity, preparing
  solutions and dilution.

flashcards:
  - front: Solution, solute, solvent → the three definitions
    back: |
      A solution is a homogeneous mixture, one phase throughout. The solute is the substance dissolved; the solvent is the substance that does the dissolving, usually the one present in larger amount (water, in an aqueous solution).
    topic_code: "6.1"
  - front: Saturated, unsaturated, supersaturated → how to tell them apart
    back: |
      Saturated: holds the maximum solute at that temperature, in equilibrium with undissolved solid. Unsaturated: can dissolve more. Supersaturated: holds more than the equilibrium maximum, made by careful cooling; a seed crystal makes the excess crystallise at once.
    topic_code: "6.1"
  - front: Like dissolves like → the rule and its reason
    back: |
      Polar and ionic solutes dissolve in polar solvents; nonpolar solutes dissolve in nonpolar solvents. Dissolving works only when solvent–solute attractions can replace the solute–solute and solvent–solvent attractions that must be broken.
    topic_code: "6.1"
  - front: How water dissolves sodium chloride
    back: |
      Water's partial charges attract the ions out of the crystal: oxygen ends toward Na⁺, hydrogen ends toward Cl⁻. Each ion is surrounded by water molecules (hydrated); the ion–dipole attractions pay for breaking the lattice.
    topic_code: "6.1"
  - front: Why oil does not dissolve in water
    back: |
      Oil molecules have only dispersion forces. Water would have to break its hydrogen bonds to make room for them and would gain only weak attractions in return, so the oil stays separate.
    topic_code: "6.1"
  - front: Why ethanol mixes with both water and hexane
    back: |
      Its O–H group hydrogen-bonds with water, and its ethyl (C₂H₅) group has dispersion attractions with hexane. Molecules with both polar and nonpolar parts can be soluble in both kinds of solvent.
    topic_code: "6.1"
  - front: Miscible → definition and an example
    back: |
      Two liquids that dissolve in each other in any proportion, forming one phase. Ethanol and water are miscible; oil and water are immiscible.
    topic_code: "6.1"
  - front: Rate of dissolving versus solubility → three things that change only the rate
    back: |
      Stirring, heating (for most solids) and crushing the solute all make it dissolve faster. Only temperature (and pressure, for gases) changes the solubility, the equilibrium amount that can dissolve.
    topic_code: "6.1"
  - front: Solubility curve → how to read a point on, above or below the line
    back: |
      The line gives the saturated amount at each temperature (g per 100 g of water). A point on the line is saturated, below it unsaturated, above it supersaturated (or the excess sits undissolved).
    topic_code: "6.1"
  - front: Mass crystallising on cooling → the method
    back: |
      Subtract the solubility at the lower temperature from the amount dissolved at the higher one, per 100 g of water, then scale to the water actually present. KNO₃ saturated at 60 °C (110 g) cooled to 20 °C (32 g): 78 g per 100 g of water.
    topic_code: "6.1"
  - front: KNO₃ versus NaCl solubility with temperature
    back: |
      KNO₃ rises steeply, from 13 g/100 g at 0 °C to 169 g at 80 °C; NaCl barely changes, 35.7 to 38.4 g. Cooling recovers lots of KNO₃ but almost no NaCl, which is why salt is recovered by evaporation.
    topic_code: "6.1"
  - front: Scaling a solubility to a different mass of water
    back: |
      Solubilities are quoted per 100 g of water, so multiply by (mass of water ÷ 100). KNO₃ at 40 °C is 64 g per 100 g, so 160 g in 250 g of water.
    topic_code: "6.1"
  - front: Recrystallisation → how it purifies a solid
    back: |
      Dissolve the impure solid in the minimum of hot solvent, then cool. The main compound's solubility falls and it crystallises out, while the small amount of impurity stays dissolved in the cold solvent.
    topic_code: "6.1"
  - front: Gas solubility and temperature
    back: |
      Gases dissolve less in warmer liquids, the opposite of most solids. Warm soda goes flat faster, and warm lake water holds less oxygen for fish.
    topic_code: "6.1"
  - front: Henry's law → gas solubility and pressure
    back: |
      The solubility of a gas is proportional to its partial pressure above the liquid. Soda is bottled under several atmospheres of CO₂; opening the cap drops the pressure and the excess CO₂ escapes as fizz.
    topic_code: "6.1"
  - front: Molarity → definition and formula
    back: |
      Moles of solute per litre of solution: M = n/V. A 0.500 M solution holds 0.500 mol in every litre and 0.0500 mol in every 100 mL. Rearranged: n = MV and V = n/M.
    topic_code: "6.2"
  - front: Molarity of 11.7 g NaCl in 250.0 mL of solution
    back: |
      11.7 g ÷ 58.44 g/mol = 0.200 mol; 250.0 mL = 0.2500 L; M = 0.200/0.2500 = 0.800 M.
    topic_code: "6.2"
  - front: Grams of solute in a given volume of solution → the route
    back: |
      n = M × V (litres), then grams = n × molar mass. 150.0 mL of 0.250 M glucose: 0.250 × 0.1500 = 0.0375 mol; × 180.16 = 6.76 g.
    topic_code: "6.2"
  - front: Volume of solution that contains a given number of moles
    back: |
      V = n/M. 0.0500 mol of HCl from a 2.00 M solution needs 0.0500/2.00 = 0.0250 L = 25.0 mL.
    topic_code: "6.2"
  - front: Preparing a solution of known molarity → the correct procedure
    back: |
      Weigh the calculated mass into a volumetric flask, add some water to dissolve it, then add water to the mark. Adding a fixed volume of water instead gives too much solution and a molarity that is slightly too low.
    topic_code: "6.2"
  - front: Per litre of solution, not per litre of water
    back: |
      Molarity divides by the total volume of the final solution. The solute takes up space, so 1 L of water plus solute makes more than 1 L of solution.
    topic_code: "6.2"
  - front: Ion concentrations from the molarity of an ionic compound
    back: |
      Multiply by the subscript in the formula. 0.10 M CaCl₂ is 0.10 M Ca²⁺ and 0.20 M Cl⁻; 0.25 M Na₂SO₄ is 0.50 M Na⁺ and 0.25 M SO₄²⁻.
    topic_code: "6.2"
  - front: Dilution equation → M₁V₁ = M₂V₂ and why it works
    back: |
      Adding solvent changes the volume but not the moles of solute, so M × V (the moles) is the same before and after. Any volume unit works if both sides use it.
    topic_code: "6.2"
  - front: Volume of 12.0 M HCl to make 250.0 mL of 0.500 M HCl
    back: |
      V₁ = M₂V₂/M₁ = (0.500 × 250.0)/12.0 = 10.4 mL. Add the acid to water, not water to the acid, then make up to 250.0 mL.
    topic_code: "6.2"
  - front: Molarity after diluting 50.0 mL of 3.00 M NaOH to 2.00 L
    back: |
      M₂ = M₁V₁/V₂ = (3.00 × 0.0500)/2.00 = 0.0750 M. The volume grew 40 times, so the concentration fell 40 times.
    topic_code: "6.2"
  - front: When NOT to use M₁V₁ = M₂V₂
    back: |
      For any reaction between two solutions (such as a titration). The dilution equation assumes one solute whose moles do not change; a reaction consumes moles according to a mole ratio.
    topic_code: "6.2"
  - front: Stock solution → what it is for
    back: |
      A concentrated solution kept on the shelf and diluted to working concentrations as needed, which saves weighing out small masses repeatedly. The dilution equation gives the volume to take.
    topic_code: "6.2"
  - front: Error spotting → a molarity 1,000 times too large
    back: |
      The volume was left in millilitres. M = n/V needs litres: 0.200 mol in 250 mL is 0.200/0.250 = 0.800 M, not 0.200/250 or 800.
    topic_code: "6.2"

quiz:
  description: |
    23 questions · about 40 minutes · topics 6.1 and 6.2 (solutions, solubility curves, gas solubility, molarity,
    preparing solutions and dilution), with review of mixtures (1.2), unit conversion (1.5), ions (3.1),
    intermolecular forces (3.6), solubility rules (4.3) and the mole (4.4). Multiple choice, select-all, true/false
    and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: a solubility table (6.1, 1.2)
    - slug: chem-u06-w21-q01
      type: multiple_choice
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Solubility in grams of solute per 100 g of water:

        | Temperature (°C) | KNO₃ | NaCl | KCl |
        |---|---|---|---|
        | 20 | 32 | 36.0 | 34 |
        | 40 | 64 | 36.6 | 40 |
        | 60 | 110 | 37.3 | 46 |
        | 80 | 169 | 38.4 | 51 |
      prompt: |
        A student stirs 50 g of KNO₃ into 100 g of water at 40 °C. Which description of the resulting solution is correct?
      options:
        - "Unsaturated; it could dissolve 14 g more."
        - "Saturated; exactly the maximum has dissolved."
        - "Supersaturated; 18 g more than the maximum is dissolved."
        - "Saturated, with 18 g of solid left undissolved."
      option_explanations:
        - |
          Correct. At 40 °C the table gives 64 g per 100 g of water; 50 g is below that, so all of it dissolves and 64 − 50 = 14 g more could be added.
        - |
          Saturation at 40 °C would need 64 g; 50 g is short of that.
        - |
          Supersaturation would require more than 64 g to be dissolved; 50 g is less.
        - |
          Solid is left only when more than the solubility is added; 50 g is less than 64 g.
      answer: 0

    - slug: chem-u06-w21-q02
      type: multiple_choice
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Solubility in grams of solute per 100 g of water:

        | Temperature (°C) | KNO₃ | NaCl | KCl |
        |---|---|---|---|
        | 20 | 32 | 36.0 | 34 |
        | 40 | 64 | 36.6 | 40 |
        | 60 | 110 | 37.3 | 46 |
        | 80 | 169 | 38.4 | 51 |
      prompt: |
        A saturated solution of KCl in 200 g of water at 80 °C is cooled to 20 °C. What mass of KCl crystallises?
      options:
        - "17 g"
        - "51 g"
        - "34 g"
        - "102 g"
      option_explanations:
        - |
          17 g is the amount per 100 g of water (51 − 34); the solution contains 200 g of water, so it must be doubled.
        - |
          51 g is the solubility at 80 °C per 100 g; it is not the amount that comes out of solution.
        - |
          Correct. Per 100 g of water, 51 − 34 = 17 g crystallises; with 200 g of water, 2 × 17 = 34 g.
        - |
          102 g is the total KCl dissolved at 80 °C in 200 g of water; most of it (68 g) stays dissolved at 20 °C.
      answer: 2

    - slug: chem-u06-w21-q03
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        Solubility in grams of solute per 100 g of water:

        | Temperature (°C) | KNO₃ | NaCl | KCl |
        |---|---|---|---|
        | 20 | 32 | 36.0 | 34 |
        | 40 | 64 | 36.6 | 40 |
        | 60 | 110 | 37.3 | 46 |
        | 80 | 169 | 38.4 | 51 |
      prompt: |
        A beaker holds 100 g of water and 45 g of NaCl at 20 °C. After thorough stirring, how should the contents be classified?
      options:
        - "A homogeneous mixture, because all the salt dissolves"
        - "A heterogeneous mixture: a saturated solution with 9 g of undissolved solid"
        - "A pure compound, because NaCl is a compound"
        - "A supersaturated solution containing 45 g of dissolved NaCl"
      option_explanations:
        - |
          Only 36.0 g can dissolve at 20 °C, so some salt remains as a separate solid phase and the beaker is not uniform throughout.
        - |
          Correct. 36.0 g dissolves to give a saturated solution and 45 − 36.0 = 9 g stays as solid; two phases together make a heterogeneous mixture.
        - |
          The beaker contains water and salt, two substances, so it is a mixture, not a pure compound.
        - |
          Stirring excess solid cannot produce a supersaturated solution; the excess simply stays undissolved.
      answer: 1
      explanation: |
        Review of 1.2: a solution is homogeneous, but a solution plus undissolved solid is heterogeneous.

    # ---- Single items
    - slug: chem-u06-w21-q04
      type: multiple_choice
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which solute is most likely to dissolve well in hexane, C₆H₁₄, a nonpolar solvent?
      options:
        - "Sodium chloride, NaCl"
        - "Sucrose, C₁₂H₂₂O₁₁ (eight O–H groups)"
        - "Potassium nitrate, KNO₃"
        - "Paraffin wax, a mixture of long-chain hydrocarbons"
      option_explanations:
        - |
          An ionic solid needs a polar solvent to pull its ions apart; hexane's dispersion forces cannot do it.
        - |
          Sucrose's many O–H groups hydrogen-bond with water, not with hexane; it is almost insoluble in nonpolar solvents.
        - |
          KNO₃ is ionic and dissolves in water, not in hexane.
        - |
          Correct. Wax is nonpolar, held by dispersion forces, so hexane's dispersion forces replace them easily: like dissolves like.
      answer: 3

    - slug: chem-u06-w21-q05
      type: multiple_choice
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which change increases the amount of carbon dioxide that can dissolve in a bottle of water?
      options:
        - "Warming the water"
        - "Increasing the pressure of CO₂ above the water"
        - "Shaking the bottle"
        - "Adding more water to the bottle"
      option_explanations:
        - |
          Gases dissolve less in warmer water; warming drives CO₂ out.
        - |
          Correct. Henry's law: gas solubility is proportional to the partial pressure of the gas above the liquid, which is why soda is bottled under pressure.
        - |
          Shaking speeds the approach to equilibrium (and knocks gas out of an opened bottle) but does not change the solubility.
        - |
          More water dissolves more total CO₂ but does not change the solubility, the amount per litre.
      answer: 1

    - slug: chem-u06-w21-q06
      type: multiple_choice
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A clear solution of sodium acetate is prepared by dissolving a large amount in hot water and then letting it cool undisturbed to room temperature. When a single crystal is dropped in, solid rapidly forms throughout and the solution warms. The original cooled solution was
      options:
        - "supersaturated"
        - "unsaturated"
        - "saturated"
        - "a suspension"
      option_explanations:
        - |
          Correct. Cooling without disturbance left more solute dissolved than the equilibrium solubility allows; the seed crystal triggers crystallisation of the excess, releasing heat.
        - |
          An unsaturated solution would dissolve the added crystal rather than growing more solid.
        - |
          A saturated solution would be unchanged by a seed crystal; it holds exactly the equilibrium amount.
        - |
          A suspension is cloudy, with visible particles that settle; this solution was clear until the seed was added.
      answer: 0

    - slug: chem-u06-w21-q07
      type: multiple_choice
      topic_code: "6.2"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        What is the molarity of a solution containing 5.85 g of NaCl (58.44 g/mol) in 500.0 mL of solution?
      options:
        - "0.0117 M"
        - "11.7 M"
        - "0.200 M"
        - "0.100 M"
      option_explanations:
        - |
          0.0117 is grams per millilitre; moles and litres are needed.
        - |
          11.7 M is the result of dividing 5.85 g by 0.500 L without converting to moles.
        - |
          Correct. 5.85 g ÷ 58.44 g/mol = 0.100 mol; 0.100 mol ÷ 0.5000 L = 0.200 M.
        - |
          0.100 is the number of moles, not the molarity; it must be divided by 0.5000 L.
      answer: 2

    - slug: chem-u06-w21-q08
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A student needs 100.0 mL of 0.150 M CuSO₄ and has a 1.20 M stock solution. What volume of stock should be diluted to 100.0 mL?
      options:
        - "80.0 mL"
        - "1.80 mL"
        - "18.0 mL"
        - "12.5 mL"
      option_explanations:
        - |
          80.0 mL would be a dilution by only a factor of 1.25; the concentration must fall eightfold.
        - |
          1.80 mL is the result of dividing by 100 somewhere; it would give 0.0216 M.
        - |
          18.0 mL comes from 0.150 × 1.20 × 100; the stock concentration should divide, not multiply.
        - |
          Correct. V₁ = M₂V₂/M₁ = (0.150 × 100.0)/1.20 = 12.5 mL; a 1.20 M stock is 8 times stronger, so one-eighth of 100 mL is needed.
      answer: 3

    - slug: chem-u06-w21-q09
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the concentration of chloride ions in 0.30 M magnesium chloride, MgCl₂(aq)?
      options:
        - "0.60 M"
        - "0.30 M"
        - "0.15 M"
        - "0.90 M"
      option_explanations:
        - |
          Correct. Each formula unit of MgCl₂ releases one Mg²⁺ and two Cl⁻, so [Cl⁻] = 2 × 0.30 = 0.60 M.
        - |
          0.30 M is the concentration of the compound and of Mg²⁺; chloride is doubled by the subscript.
        - |
          0.15 M would halve the chloride, the reverse of the subscript's effect.
        - |
          0.90 M would need three chlorides per formula unit, as in AlCl₃.
      answer: 0
      explanation: |
        Review of 3.1: the ionic formula tells you the ratio of ions, and therefore their concentrations in solution.

    - slug: chem-u06-w21-q10
      type: multiple_choice
      topic_code: "4.4"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        How many grams of potassium hydroxide, KOH (56.11 g/mol), are needed to make 2.00 L of a 0.250 M solution?
      options:
        - "14.0 g"
        - "28.1 g"
        - "7.01 g"
        - "112 g"
      option_explanations:
        - |
          14.0 g is the mass for 1.00 L (0.250 mol); the solution is 2.00 L.
        - |
          Correct. n = M × V = 0.250 × 2.00 = 0.500 mol; 0.500 × 56.11 = 28.1 g.
        - |
          7.01 g is 0.125 mol, the amount for 0.500 L.
        - |
          112 g is 2.00 mol, which would make a 1.00 M solution.
      answer: 1
      explanation: |
        Review of 4.4: moles = M × V, then grams = moles × molar mass.

    - slug: chem-u06-w21-q11
      type: multiple_choice
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best explains, in terms of intermolecular forces, why vegetable oil and water separate into layers?
      options:
        - "Oil is denser than water, so the two cannot mix."
        - "Oil molecules are too large to fit between water molecules."
        - "Oil molecules repel water molecules electrically."
        - "Water molecules would have to give up hydrogen bonds to surround the nonpolar oil molecules and would gain only weak dispersion attractions in return."
      option_explanations:
        - |
          Oil is actually less dense than water (it floats), and density does not decide solubility: ethanol is less dense than water and mixes completely.
        - |
          Size is not the barrier; large polar molecules such as sucrose dissolve well.
        - |
          There is no electrical repulsion; nonpolar molecules simply offer water nothing strong enough to attract.
        - |
          Correct. Dissolving requires solvent–solute attractions comparable to those broken; hydrogen bonds between water molecules are far stronger than the dispersion forces water could form with oil.
      answer: 3
      explanation: |
        Review of 3.6: solubility is a balance of attractions broken and attractions formed.

    # ---- Select all
    - slug: chem-u06-w21-q12
      type: multi_select
      topic_code: "6.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which actions increase the SOLUBILITY of a typical solid such as potassium nitrate in water, rather than merely the rate at which it dissolves? Select all that apply.
      options:
        - "Raising the temperature of the water"
        - "Stirring the mixture"
        - "Grinding the solid into a fine powder"
        - "Using a larger mass of water"
        - "Raising the pressure above the solution"
      option_explanations:
        - |
          Correct. For most solids, including KNO₃, solubility rises with temperature (32 g per 100 g at 20 °C, 110 g at 60 °C).
        - |
          Stirring brings fresh solvent to the solid and speeds dissolving but does not change the equilibrium amount.
        - |
          Grinding increases surface area and speeds dissolving; the solubility per 100 g of water is unchanged.
        - |
          More water dissolves more total solid, but solubility is defined per 100 g of water and stays the same.
        - |
          Pressure has a large effect on gas solubility but almost none on solids and liquids.
      answer: [0]

    - slug: chem-u06-w21-q13
      type: multi_select
      topic_code: "4.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        According to the solubility rules, which of these ionic compounds dissolve readily in water at room temperature? Select all that apply.
      options:
        - "Sodium nitrate, NaNO₃"
        - "Silver chloride, AgCl"
        - "Potassium chloride, KCl"
        - "Barium sulfate, BaSO₄"
        - "Ammonium sulfate, (NH₄)₂SO₄"
      option_explanations:
        - |
          Correct. All nitrates are soluble, and so are all sodium compounds.
        - |
          Chlorides are soluble except those of Ag⁺, Pb²⁺ and Hg₂²⁺; AgCl is a classic insoluble precipitate.
        - |
          Correct. Potassium compounds and most chlorides are soluble.
        - |
          Sulfates are soluble except those of Ba²⁺, Sr²⁺, Pb²⁺ and Ca²⁺ (slightly); BaSO₄ is insoluble.
        - |
          Correct. Ammonium compounds are soluble, and sulfate's exceptions do not include NH₄⁺.
      answer: [0, 2, 4]
      explanation: |
        Review of 4.3: the solubility rules are the qualitative version of this week's solubility values.

    # ---- True / false
    - slug: chem-u06-w21-q14
      type: true_false
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Like most solids, gases become more soluble in water as the temperature rises.
      answer: false
      explanation: |
        False. Gas solubility falls as temperature rises: warm water holds less dissolved oxygen and warm soda loses its CO₂ faster. Most solids show the opposite trend, so the two cases must be kept separate.

    - slug: chem-u06-w21-q15
      type: true_false
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A solution is a homogeneous mixture, so a sample taken from the top of a well-mixed salt solution has the same composition as one taken from the bottom.
      answer: true
      explanation: |
        True. Homogeneous means uniform throughout: the dissolved particles are spread evenly at the molecular or ionic level and do not settle, so every sample has the same concentration. A suspension, by contrast, is heterogeneous and settles.

    # ---- Fill in the blank
    - slug: chem-u06-w21-q16
      type: fill_blank
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Molarity is defined as the number of moles of solute per litre of ____.
      answer: ["solution"]
      explanation: |
        Per litre of solution, not per litre of solvent. The solute takes up space, so a solution is made by dissolving the solute and then adding water to the final volume mark.

    - slug: chem-u06-w21-q17
      type: fill_blank
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Before using M = n/V, a volume of 250.0 mL must be written as ____ L.
      answer: ["0.2500", "0.25", "0.250", "0.2500 L", "0.250 L"]
      explanation: |
        1 L = 1,000 mL, so 250.0 mL ÷ 1,000 = 0.2500 L. Leaving the volume in millilitres gives a molarity 1,000 times too small.

    # ---- Numeric
    - slug: chem-u06-w21-q18
      type: numeric
      topic_code: "6.2"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        15.0 g of sodium hydroxide (40.00 g/mol) is dissolved in water to make 750.0 mL of solution. What is the molarity? Give your answer in mol/L to three decimal places.
      answer: { value: 0.500, tolerance: 0.005 }
      explanation: |
        15.0 g ÷ 40.00 g/mol = 0.375 mol; 750.0 mL = 0.7500 L; M = 0.375/0.7500 = 0.500 M.

    - slug: chem-u06-w21-q19
      type: numeric
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        20.0 mL of 6.00 M hydrochloric acid is diluted with water to a final volume of 300.0 mL. What is the new molarity? Give your answer in mol/L to three decimal places.
      answer: { value: 0.400, tolerance: 0.005 }
      explanation: |
        M₂ = M₁V₁/V₂ = (6.00 × 20.0)/300.0 = 120/300.0 = 0.400 M. The volume grew 15 times, so the concentration fell 15 times.

    - slug: chem-u06-w21-q20
      type: numeric
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The solubility of KNO₃ is 110 g per 100 g of water at 60 °C and 32 g per 100 g at 20 °C. A saturated solution is made with 250 g of water at 60 °C and cooled to 20 °C. What mass of KNO₃ crystallises? Give your answer in grams to the nearest gram.
      answer: { value: 195, tolerance: 2 }
      explanation: |
        Per 100 g of water, 110 − 32 = 78 g crystallises. With 250 g of water, 78 × 2.5 = 195 g.

    # ---- Short answer
    - slug: chem-u06-w21-q21
      type: short_answer
      topic_code: "6.2"
      source: "PubChem (molar masses)"
      points: 3
      prompt: |
        A lab needs 2.00 L of 0.100 M copper(II) sulfate solution, prepared from solid CuSO₄·5H₂O (249.69 g/mol). Answer (a), (b) and (c).

        (a) Calculate the mass of CuSO₄·5H₂O required.
        (b) Describe the correct procedure for preparing the solution in a 2.00 L volumetric flask, including the step students most often get wrong.
        (c) A student instead dissolves the solid in exactly 2.00 L of water. Explain whether the resulting molarity is slightly above or below 0.100 M, and why.
      answer: |
        (a) n = 0.100 mol/L × 2.00 L = 0.200 mol; mass = 0.200 × 249.69 = 49.9 g.
        (b) Weigh 49.9 g of the solid, transfer it to the flask, add enough distilled water to dissolve it completely with swirling, then add water carefully up to the 2.00 L mark and mix. The step most often done wrong is adding a measured 2.00 L of water instead of filling to the mark.
        (c) Slightly below 0.100 M. The dissolved solid takes up volume, so solid plus 2.00 L of water gives more than 2.00 L of solution; the same 0.200 mol is spread through a larger volume, so the molarity is less than 0.100 M.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 49.9 g (accept 49.8–50.0). Zero if the water of hydration is omitted (31.9 g).

        (b) 1 pt: dissolve first, then fill to the mark; names the wrong step (adding a fixed volume of water).

        (c) 1 pt: below 0.100 M, because the solute adds volume and molarity is per litre of solution.

    - slug: chem-u06-w21-q22
      type: short_answer
      topic_code: "6.1"
      source: "general knowledge"
      points: 3
      stimulus: |
        Graph description: A solubility curve graph with temperature (°C, 0 to 100) on the horizontal axis and solubility (g per 100 g water, 0 to 200) on the vertical axis. The curve for potassium nitrate (KNO₃) rises steeply from about 13 at 0 °C to about 169 at 80 °C. The curve for sodium chloride (NaCl) is nearly flat, from about 36 at 0 °C to about 39 at 90 °C. A third curve, for the gas oxygen (plotted on a separate, much smaller scale), falls steadily from left to right.
      prompt: |
        Using the graph description, answer (a), (b) and (c).

        (a) A mixture of 100 g of KNO₃ and 5 g of NaCl is dissolved in 100 g of water at 80 °C and cooled to 20 °C, where KNO₃'s solubility is 32 g. Explain what the resulting solid consists of and why this separates the two salts.
        (b) Explain in terms of particle motion why the oxygen curve falls while the KNO₃ curve rises.
        (c) A student says the NaCl curve is flat because NaCl is insoluble. Correct the student.
      answer: |
        (a) On cooling to 20 °C only 32 g of KNO₃ can stay dissolved, so about 68 g of KNO₃ crystallises, while the 5 g of NaCl stays in solution because it is far below NaCl's solubility of 36 g. The solid is nearly pure KNO₃; the salt with the steep curve is recovered and the one with the flat curve stays behind. This is recrystallisation.
        (b) Dissolving a solid such as KNO₃ requires energy to break the crystal apart, so higher temperature (more energetic collisions with water molecules) lets more dissolve. Dissolving a gas releases energy and traps fast-moving molecules in the liquid; at higher temperature the dissolved gas molecules have more kinetic energy and escape more readily, so less stays dissolved.
        (c) NaCl is very soluble, about 36 g per 100 g of water at room temperature; the flat curve means its solubility hardly changes with temperature, not that it is small. A flat curve does mean cooling will not recover NaCl, which is why salt is obtained by evaporating the water instead.
      explanation: |
        Three points, one per part.

        (a) 1 pt: about 68 g of KNO₃ crystallises and the NaCl stays dissolved (5 g < 36 g), so the solid is essentially pure KNO₃; mentions that the difference in temperature dependence is what separates them.

        (b) 1 pt: solids generally need energy to dissolve so warmth helps; gases are held loosely and escape as their kinetic energy rises. Accept any correct kinetic explanation.

        (c) 1 pt: NaCl is highly soluble (about 36 g/100 g); a flat curve means solubility is nearly independent of temperature, which is why evaporation rather than cooling is used to recover it.

    # ---- Long answer
    - slug: chem-u06-w21-q23
      type: long_answer
      topic_code: "6.2"
      source: "PubChem (molar masses)"
      points: 6
      prompt: |
        A school stockroom keeps 2.50 M sodium carbonate, Na₂CO₃ (105.99 g/mol), as a stock solution. A teacher needs 500.0 mL of 0.200 M Na₂CO₃ for a class and later wants to know the concentration of each ion in the diluted solution and how much sodium carbonate would be left behind if 50.0 mL of it were evaporated to dryness.

        Write a full account that (1) explains why M₁V₁ = M₂V₂ applies to this dilution and uses it to find the volume of stock needed; (2) describes how the dilution should be carried out in a volumetric flask; (3) calculates the concentrations of Na⁺ and CO₃²⁻ in the diluted solution and explains why they differ; and (4) calculates the mass of Na₂CO₃ recovered from evaporating 50.0 mL of the diluted solution, and explains how the teacher could instead have prepared the 500.0 mL directly from the solid.
      answer: |
        (1) Dilution adds water but does not add or remove solute, so the moles of Na₂CO₃ before (M₁V₁) equal the moles after (M₂V₂). V₁ = M₂V₂/M₁ = (0.200 M × 500.0 mL)/2.50 M = 40.0 mL of stock.

        (2) Measure 40.0 mL of the 2.50 M stock with a pipette or graduated cylinder, transfer it to a 500 mL volumetric flask containing some distilled water, swirl, then add water up to the calibration mark and invert to mix. Do not add 460 mL of water by measurement; fill to the mark so the final volume is exactly 500.0 mL.

        (3) Na₂CO₃ dissociates as Na₂CO₃ → 2 Na⁺ + CO₃²⁻. [CO₃²⁻] = 0.200 M, and [Na⁺] = 2 × 0.200 = 0.400 M, because each formula unit supplies two sodium ions and one carbonate ion.

        (4) Moles in 50.0 mL: 0.200 mol/L × 0.0500 L = 0.0100 mol; mass = 0.0100 × 105.99 = 1.06 g of Na₂CO₃. To prepare 500.0 mL of 0.200 M directly: n = 0.200 × 0.5000 = 0.100 mol, mass = 0.100 × 105.99 = 10.6 g; weigh it into the 500 mL volumetric flask, dissolve in some water, then fill to the mark.
      explanation: |
        Six points.

        Dilution (0–2): 1 pt for the reasoning that moles of solute are unchanged, so M₁V₁ = M₂V₂; 1 pt for V₁ = 40.0 mL.

        Procedure (0–1): stock measured into a volumetric flask, dissolved/mixed, then water added to the mark (not a measured 460 mL).

        Ion concentrations (0–2): 1 pt for [Na⁺] = 0.400 M and [CO₃²⁻] = 0.200 M; 1 pt for the explanation from the formula's 2:1 ion ratio.

        Evaporation and direct preparation (0–1): 1.06 g from 50.0 mL (accept 1.05–1.07), and 10.6 g of solid dissolved and made up to 500.0 mL for the direct route.

        Common errors: dividing instead of multiplying for the sodium ion; using 0.500 mL for the volume; treating M₁V₁ = M₂V₂ as if it involved a mole ratio.
