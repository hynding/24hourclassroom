    # ---- Short answer
    - slug: chem-u02-w07-q23
      type: short_answer
      topic_code: "2.8"
      source: "general knowledge (standard reference values, rounded)"
      points: 3
      stimulus: |
        | Ion | O²⁻ | F⁻ | Na⁺ | Mg²⁺ |
        |---|---|---|---|---|
        | Protons | 8 | 9 | 11 | 12 |
        | Electrons | 10 | 10 | 10 | 10 |
        | Ionic radius (pm) | 140 | 133 | 102 | 72 |
      prompt: |
        Using the table, answer (a), (b) and (c).

        (a) What do the four ions have in common, and which noble gas do they resemble?
        (b) Explain the trend in ionic radius across the table.
        (c) Predict whether Al³⁺ would be larger or smaller than Mg²⁺, and whether Cl⁻ would be larger or smaller than F⁻, giving a reason for each.
      answer: |
        (a) All four have ten electrons in the configuration 1s² 2s² 2p⁶, the same as neon.
        (b) With the same number of electrons, the ion with more protons pulls them in more strongly, so the radius shrinks as the nuclear charge rises from 8 (O²⁻, 140 pm) to 12 (Mg²⁺, 72 pm).
        (c) Al³⁺ (13 protons, 10 electrons) would be smaller than Mg²⁺ because its greater nuclear charge pulls the same ten electrons in tighter. Cl⁻ would be larger than F⁻ because its electrons occupy n = 3, one level farther out, and are more shielded.
      explanation: |
        Three points, one per part.

        (a) 1 pt: same electron count and configuration, neon-like.

        (b) 1 pt: more protons acting on the same electrons means a smaller ion.

        (c) 1 pt: Al³⁺ smaller (greater nuclear charge, same electrons) and Cl⁻ larger (extra energy level), with reasons.

    - slug: chem-u02-w07-q24
      type: short_answer
      topic_code: "2.7"
      source: "general knowledge"
      points: 3
      prompt: |
        Element X has the electron configuration [Ne] 3s² 3p¹. Element Y has the configuration [Ar] 4s¹.

        (a) Identify both elements and give the period, group and family (if any) of each.
        (b) Predict the ion each element forms and explain the prediction from its configuration.
        (c) State which element has the larger atomic radius and which has the lower first ionization energy, with a reason for each.
      answer: |
        (a) X is aluminium: period 3, group 13, a metal in the boron group. Y is potassium: period 4, group 1, an alkali metal.
        (b) Aluminium loses its three valence electrons (3s² 3p¹) to reach neon's configuration, forming Al³⁺. Potassium loses its single 4s electron to reach argon's configuration, forming K⁺.
        (c) Potassium has the larger radius: its outer electron is in n = 4, one level farther out than aluminium's n = 3. Potassium also has the lower ionization energy, because that outer electron is farther from the nucleus, more shielded, and feels a smaller effective nuclear charge.
      explanation: |
        Three points, one per part.

        (a) 1 pt: aluminium (period 3, group 13) and potassium (period 4, group 1, alkali metal).

        (b) 1 pt: Al³⁺ and K⁺, each explained by losing valence electrons to reach a noble-gas configuration.

        (c) 1 pt: potassium larger and lower ionization energy, with the extra level or shielding as the reason.

    # ---- Long answer
    - slug: chem-u02-w07-q25
      type: long_answer
      topic_code: "2.8"
      source: "general knowledge"
      points: 6
      prompt: |
        Explain why the periodic table has the shape it does and why properties repeat along it. Then use the ideas of effective nuclear charge and shielding to explain the trends in atomic radius and first ionization energy both across period 2 (lithium to neon) and down group 1 (lithium to cesium). Finish by explaining why cesium is the most reactive metal and fluorine the most reactive nonmetal, and what that implies about the compound they form together.
      answer: |
        The table is arranged by atomic number, and its rows and columns follow electron configurations. Each period begins when a new energy level starts filling and ends when its s and p sublevels are full; the blocks (s, p, d, f) are the sublevels being filled. Elements in a column share a valence configuration (group 1 ns¹, group 17 ns² np⁵), and because chemistry is done by valence electrons, properties repeat down each column.

        Across period 2, from lithium to neon, each step adds a proton to the nucleus and an electron to the same n = 2 level. Electrons in the same level shield one another poorly, so the effective nuclear charge felt by the valence electrons rises steadily. The electrons are pulled closer: the radius shrinks from lithium to neon. Removing an electron gets harder for the same reason, so the first ionization energy climbs from about 520 kJ/mol for lithium to about 2,080 for neon.

        Down group 1, from lithium to cesium, each step adds a whole new energy level. The outer electron is farther from the nucleus and is shielded by more inner electrons, so although the nuclear charge rises, the effective charge on the valence electron stays roughly constant while its distance grows. Radius increases and the first ionization energy decreases (Li 520, Na 496, K 419, Rb 403, Cs 376 kJ/mol).

        Cesium, at the bottom left, holds its single valence electron most loosely, so it loses it most readily: it is the most reactive metal. Fluorine, at the top right, is small with a high effective nuclear charge and one electron short of a full level, so it gains an electron most readily: the most reactive nonmetal. Together they form cesium fluoride, in which an electron is transferred completely from Cs to F, giving Cs⁺ and F⁻ ions; it is about as ionic as a compound can be.
      explanation: |
        Six points.

        1 pt: the table's layout tied to electron configuration (periods as levels, blocks as sublevels, groups as shared valence configurations).

        1 pt: properties repeat because valence configurations repeat.

        1 pt: period 2 trends in radius and ionization energy explained by rising effective nuclear charge with little added shielding.

        1 pt: group 1 trends explained by added energy levels and increased shielding.

        1 pt: cesium's reactivity (easiest electron loss) and fluorine's (easiest electron gain) explained by position.

        1 pt: cesium fluoride described as electron transfer giving Cs⁺ and F⁻, a strongly ionic compound.
