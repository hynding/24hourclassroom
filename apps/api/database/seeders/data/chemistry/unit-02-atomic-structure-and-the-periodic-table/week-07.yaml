week: 7
unit: 2
title: "The Periodic Table and Its Trends"
topics: ["2.7", "2.8"]
guide: guides/week-07.md
guide_description: |
  How the periodic table is built: order by atomic number, periods as energy levels, groups as valence counts, the
  s, p, d and f blocks, metals, nonmetals and metalloids, and the main families. Then the trends in atomic radius,
  ionization energy, electronegativity, metallic character and ionic size, all explained by effective nuclear
  charge and shielding, with data tables for period 3 and group 1. Worked examples on locating an element from its
  configuration, ranking elements by radius and ionization energy, and comparing ion sizes.
flashcards_description: |
  31 cards on the organisation of the periodic table, its blocks and families, and the trends in radius,
  ionization energy, electronegativity, reactivity and ionic size with their explanations.

flashcards:
  - front: Modern periodic law → what the elements are ordered by
    back: |
      Properties of the elements are periodic functions of their atomic numbers. Mendeleev used atomic mass; ordering by proton count fixes the few places where mass order was wrong.
    topic_code: "2.7"
  - front: Mendeleev's table (1869) → what made it convincing
    back: |
      He left gaps for undiscovered elements and predicted their properties (gallium, germanium); when they were found as predicted, the periodic arrangement was accepted.
    topic_code: "2.7"
  - front: Period number → what it tells you about electron configuration
    back: |
      The highest occupied energy level n in the ground state. Sodium (3s¹) is in period 3; bromine (4s² 4p⁵) is in period 4.
    topic_code: "2.7"
  - front: Group number and valence electrons → the main-group rule
    back: |
      For groups 1, 2 and 13–18 the last digit of the group number is the valence electron count: group 1 has 1, group 2 has 2, group 13 has 3 … group 17 has 7, group 18 has 8 (helium 2).
    topic_code: "2.7"
  - front: s, p, d and f blocks → where each sits on the table
    back: |
      s block: groups 1–2 (and helium). p block: groups 13–18. d block: groups 3–12, the transition metals. f block: the lanthanides and actinides below the table.
    topic_code: "2.7"
  - front: Alkali metals → group, configuration and behaviour
    back: |
      Group 1 (Li, Na, K, Rb, Cs), ns¹. Soft, low-melting metals that react violently with water and are stored under oil; they form 1+ ions. Hydrogen shares the column but is a nonmetal.
    topic_code: "2.7"
  - front: Alkaline earth metals → group, configuration and behaviour
    back: |
      Group 2 (Be, Mg, Ca, Sr, Ba), ns². Reactive metals, less so than group 1; they form 2+ ions. Calcium and magnesium are common in rocks and in the body.
    topic_code: "2.7"
  - front: Halogens → group, configuration and states at room temperature
    back: |
      Group 17 (F, Cl, Br, I), ns² np⁵. Reactive nonmetals forming 1− ions and salts with metals. F₂ and Cl₂ are gases, Br₂ a liquid, I₂ a solid.
    topic_code: "2.7"
  - front: Noble gases → group, configuration and why they are unreactive
    back: |
      Group 18 (He, Ne, Ar, Kr, Xe), ns² np⁶ (helium 1s²). Their valence shells are full, so they neither gain nor lose electrons easily; they exist as single atoms.
    topic_code: "2.7"
  - front: Transition metals → location and typical properties
    back: |
      Groups 3–12, the d block, where the (n − 1)d sublevel fills. Hard, high-melting metals that often form more than one ion (Fe²⁺, Fe³⁺) and coloured compounds.
    topic_code: "2.7"
  - front: Metals versus nonmetals → properties and where they sit
    back: |
      Metals (left and centre, about 80% of elements): shiny, malleable, ductile, conduct heat and electricity, lose electrons to form cations. Nonmetals (upper right): dull, brittle, poor conductors, gain or share electrons.
    topic_code: "2.7"
  - front: Metalloids → which elements and why they matter
    back: |
      B, Si, Ge, As, Sb, Te along the staircase line between metals and nonmetals. They conduct moderately (semiconductors), which makes silicon the basis of electronics.
    topic_code: "2.7"
  - front: Locating an element from [Ar] 4s² → period, group, family
    back: |
      Period 4 (highest n is 4), group 2 (ns²), an alkaline earth metal: calcium, which forms Ca²⁺.
    topic_code: "2.7"
  - front: Hydrogen's place on the table → why it is odd
    back: |
      It sits above group 1 because it has one valence electron (1s¹), but it is a nonmetal gas that can also gain an electron like a halogen; it belongs to no family.
    topic_code: "2.7"
  - front: Effective nuclear charge → definition
    back: |
      The net positive charge a valence electron feels: the full nuclear charge minus the shielding by inner electrons. It rises across a period and stays roughly constant down a group.
    topic_code: "2.8"
  - front: Shielding → what it is and when it increases
    back: |
      Inner-level electrons repel the outer electrons, cancelling part of the nucleus's pull. Each new energy level down a group adds a full layer of shielding; across a period shielding barely changes.
    topic_code: "2.8"
  - front: Atomic radius across a period → trend and reason
    back: |
      Decreases from left to right. Protons are added while electrons enter the same level, so the effective nuclear charge rises and pulls the cloud inward: Na 186 pm, Si 118 pm, Cl 99 pm.
    topic_code: "2.8"
  - front: Atomic radius down a group → trend and reason
    back: |
      Increases. Each step down adds an energy level, so the outer electrons are farther from the nucleus and more shielded: Li 152, Na 186, K 227, Rb 248 pm.
    topic_code: "2.8"
  - front: Ionization energy → definition and units
    back: |
      The energy required to remove the outermost electron from a gaseous atom, forming a 1+ ion; measured in kJ/mol. Sodium's is 496 kJ/mol, chlorine's 1,251, argon's 1,521.
    topic_code: "2.8"
  - front: Ionization energy across a period and down a group → trends
    back: |
      Increases across a period (greater effective nuclear charge holds electrons more tightly) and decreases down a group (outer electrons farther out and more shielded). Noble gases are highest, alkali metals lowest.
    topic_code: "2.8"
  - front: Successive ionization energies → the big jump and what it reveals
    back: |
      Each removal costs more, and there is a huge jump once a noble-gas core is reached. Magnesium: 738, 1,451, then 7,733 kJ/mol; the jump after the second shows it has two valence electrons.
    topic_code: "2.8"
  - front: Electronegativity → definition and the extremes
    back: |
      How strongly an atom in a bond attracts shared electrons (Pauling scale). Fluorine is highest at 3.98, then O 3.44, Cl 3.16, N 3.04; cesium is lowest at 0.79. Noble gases are usually left unrated.
    topic_code: "2.8"
  - front: Electronegativity trends → across and down
    back: |
      Increases across a period and decreases down a group, the same pattern as ionization energy; the most electronegative elements cluster in the upper right (F, O, N, Cl).
    topic_code: "2.8"
  - front: Metallic character → trend and the most metallic element
    back: |
      Tendency to lose electrons. It decreases across a period and increases down a group, opposite to ionization energy. Cesium is the most metallic naturally occurring element; fluorine the least.
    topic_code: "2.8"
  - front: Reactivity of metals and nonmetals → opposite directions in a group
    back: |
      Metals get more reactive down a group (K reacts more violently with water than Na) because electrons are easier to lose. Nonmetals get more reactive up a group (F₂ is the most reactive halogen) because electrons are easier to gain.
    topic_code: "2.8"
  - front: Cation size versus its atom → rule and example
    back: |
      A cation is smaller than its atom: it has lost its outer level and the remaining electrons are pulled in by the unchanged nucleus. Na 186 pm → Na⁺ 102 pm.
    topic_code: "2.8"
  - front: Anion size versus its atom → rule and example
    back: |
      An anion is larger than its atom: the added electrons repel one another and spread the cloud. Cl 99 pm → Cl⁻ 181 pm.
    topic_code: "2.8"
  - front: Ions with the same electron configuration (O²⁻, F⁻, Na⁺, Mg²⁺) → ranking by size
    back: |
      All have 10 electrons; the one with the most protons pulls hardest and is smallest. O²⁻ > F⁻ > Na⁺ > Mg²⁺.
    topic_code: "2.8"
  - front: K⁺ versus Cl⁻ → which is larger and why
    back: |
      Both have 18 electrons, but K⁺ has 19 protons and Cl⁻ only 17, so Cl⁻ is larger (181 pm against 138 pm).
    topic_code: "2.8"
  - front: Ranking S, Cl, K, Mg by atomic radius → the answer
    back: |
      Cl (99 pm) < S (104) < Mg (160) < K (227). Chlorine and sulfur are small period-3 nonmetals; magnesium is farther left; potassium is in period 4.
    topic_code: "2.8"
  - front: Why chlorine's atom is smaller than sodium's despite more electrons → explanation
    back: |
      Both have outer electrons in n = 3, but chlorine has 17 protons to sodium's 11 with almost the same shielding, so its effective nuclear charge is much larger and pulls the level inward.
    topic_code: "2.8"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 2.7 and 2.8: the periodic table and periodic
    trends), with about a third reviewing earlier weeks (electron configurations, isotopes, average atomic mass,
    the mass laws and nuclear decay). Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set: period 3 data (2.8)
    - slug: chem-u02-w07-q01
      type: multiple_choice
      topic_code: "2.8"
      source: "general knowledge (standard reference values, rounded)"
      points: 1
      stimulus: |
        | Element | Na | Mg | Al | Si | P | S | Cl | Ar |
        |---|---|---|---|---|---|---|---|---|
        | Atomic radius (pm) | 186 | 160 | 143 | 118 | 110 | 104 | 99 | 97 |
        | First ionization energy (kJ/mol) | 496 | 738 | 578 | 786 | 1,012 | 1,000 | 1,251 | 1,521 |
      prompt: |
        Which statement best explains the overall trend in atomic radius shown in the table?
      options:
        - "Each element has one more energy level than the one before it"
        - "The number of protons rises while electrons enter the same level, so the effective nuclear charge increases and pulls the electrons closer"
        - "Heavier atoms are always smaller"
        - "Shielding increases sharply across the period"
      option_explanations:
        - |
          All period-3 elements have their outer electrons in n = 3; no new level is added across a row.
        - |
          Correct. Added protons with little added shielding mean a stronger net pull on the n = 3 electrons, shrinking the atom from sodium to argon.
        - |
          Down a group atoms get heavier and larger, so mass alone does not decide size.
        - |
          Shielding stays nearly constant across a period because the added electrons are in the same level, not inner ones.
      answer: 1

    - slug: chem-u02-w07-q02
      type: multiple_choice
      topic_code: "2.8"
      source: "general knowledge (standard reference values, rounded)"
      points: 1
      stimulus: |
        | Element | Na | Mg | Al | Si | P | S | Cl | Ar |
        |---|---|---|---|---|---|---|---|---|
        | Atomic radius (pm) | 186 | 160 | 143 | 118 | 110 | 104 | 99 | 97 |
        | First ionization energy (kJ/mol) | 496 | 738 | 578 | 786 | 1,012 | 1,000 | 1,251 | 1,521 |
      prompt: |
        Why does argon have the highest first ionization energy in the period?
      options:
        - "Its atom is the largest, so the electron is far away"
        - "It has the fewest protons"
        - "Its outer electrons feel the greatest effective nuclear charge and sit in a full, stable level"
        - "Noble gases have no electrons to remove"
      option_explanations:
        - |
          Argon's atom is the smallest in the period, which makes its electrons harder, not easier, to remove.
        - |
          Argon has the most protons of the period, 18.
        - |
          Correct. Eighteen protons with the same shielding as sodium give the strongest pull on the n = 3 electrons, and a full 3s² 3p⁶ level is especially stable.
        - |
          Argon has 18 electrons; they can be removed, but it takes 1,521 kJ/mol to take the first one.
      answer: 2

    - slug: chem-u02-w07-q03
      type: multiple_choice
      topic_code: "2.8"
      source: "general knowledge (standard reference values, rounded)"
      points: 1
      stimulus: |
        | Element | Na | Mg | Al | Si | P | S | Cl | Ar |
        |---|---|---|---|---|---|---|---|---|
        | Atomic radius (pm) | 186 | 160 | 143 | 118 | 110 | 104 | 99 | 97 |
        | First ionization energy (kJ/mol) | 496 | 738 | 578 | 786 | 1,012 | 1,000 | 1,251 | 1,521 |
      prompt: |
        Potassium is directly below sodium in the periodic table. Using the trends, which values would you predict for potassium?
      options:
        - "Radius larger than 186 pm and ionization energy lower than 496 kJ/mol"
        - "Radius smaller than 186 pm and ionization energy higher than 496 kJ/mol"
        - "Radius larger than 186 pm and ionization energy higher than 496 kJ/mol"
        - "Radius equal to 186 pm, since both are alkali metals"
      option_explanations:
        - |
          Correct. Down a group an energy level is added: the atom grows (K is 227 pm) and the outer electron, farther out and more shielded, is easier to remove (419 kJ/mol).
        - |
          This describes moving right across a period, not down a group.
        - |
          A larger, more shielded atom holds its outer electron less tightly, so the ionization energy falls, not rises.
        - |
          Same family means similar chemistry, not identical size; potassium has one more level than sodium.
      answer: 0

    # ---- Multiple choice (2.7)
    - slug: chem-u02-w07-q04
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which family of elements has the valence configuration ns² np⁵?
      options:
        - "Alkali metals"
        - "Noble gases"
        - "Halogens"
        - "Alkaline earth metals"
      option_explanations:
        - |
          Alkali metals are ns¹, with a single valence electron.
        - |
          Noble gases are ns² np⁶, with a full valence level.
        - |
          Correct. Seven valence electrons (ns² np⁵) is group 17, the halogens, one electron short of a full level.
        - |
          Alkaline earth metals are ns², with two valence electrons.
      answer: 2

    - slug: chem-u02-w07-q05
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        An element has the configuration [Kr] 5s² 4d¹⁰ 5p³. In which period and block is it, and how many valence electrons does it have?
      options:
        - "Period 4, p block, 13 valence electrons"
        - "Period 5, p block, 5 valence electrons"
        - "Period 5, d block, 15 valence electrons"
        - "Period 3, p block, 3 valence electrons"
      option_explanations:
        - |
          The highest occupied level is n = 5, not 4, and the filled 4d electrons are not valence electrons.
        - |
          Correct. Highest n = 5 gives period 5; the last electrons entered 5p, so p block; valence electrons are 5s² 5p³, five (antimony, group 15).
        - |
          The configuration ends in a p sublevel, so the element is in the p block; the d electrons are a filled inner sublevel.
        - |
          Period is set by the highest n, which is 5.
      answer: 1

    - slug: chem-u02-w07-q06
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which property would you expect of an element located on the staircase line between metals and nonmetals, such as silicon?
      options:
        - "It conducts electricity moderately and is used in semiconductors"
        - "It is a gas at room temperature"
        - "It reacts violently with water"
        - "It is highly malleable and ductile like copper"
      option_explanations:
        - |
          Correct. Metalloids have intermediate properties; their limited, controllable conductivity makes them the basis of electronic chips.
        - |
          Silicon and the other metalloids are solids with high melting points.
        - |
          Violent reaction with water is the mark of alkali metals, far to the left.
        - |
          Metalloids are brittle; malleability and ductility are metallic properties.
      answer: 0

    - slug: chem-u02-w07-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Why are sodium and potassium placed in the same group of the periodic table?
      options:
        - "They have the same number of energy levels"
        - "They have the same atomic mass"
        - "They have the same number of neutrons"
        - "They have the same number of valence electrons and so similar chemical behaviour"
      option_explanations:
        - |
          Sodium has three occupied levels and potassium four; the same number of levels defines a period, not a group.
        - |
          Their average atomic masses differ considerably, 22.99 u against 39.10 u, so mass is not what they share.
        - |
          Neutron count has nothing to do with placement; sodium-23 has 12 and potassium-39 has 20.
        - |
          Correct. Both have one valence electron (ns¹), so both lose it easily, form 1+ ions and react with water in the same way.
      answer: 3

    # ---- Multiple choice (2.8)
    - slug: chem-u02-w07-q08
      type: multiple_choice
      topic_code: "2.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following is the correct order of increasing electronegativity?
      options:
        - "F < O < N < C"
        - "Na < Cl < K < F"
        - "Cl < F < O < N"
        - "K < Na < Cl < F"
      option_explanations:
        - |
          This is decreasing order: fluorine is the most electronegative element.
        - |
          Potassium is less electronegative than sodium (electronegativity falls down a group), so it cannot sit between Cl and F.
        - |
          Fluorine exceeds oxygen and nitrogen; across period 2 electronegativity rises toward fluorine.
        - |
          Correct. Electronegativity falls down a group (K < Na) and rises toward the upper right (Cl < F).
      answer: 3

    - slug: chem-u02-w07-q09
      type: multiple_choice
      topic_code: "2.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Which comparison of sizes is correct?
      options:
        - "Na⁺ is smaller than Na, and Cl⁻ is larger than Cl"
        - "Na⁺ is larger than Na, and Cl⁻ is smaller than Cl"
        - "Both ions are larger than their atoms"
        - "Both ions are the same size as their atoms"
      option_explanations:
        - |
          Correct. Losing the outer level and tightening the remaining electrons shrinks a cation; added electrons repel and expand an anion.
        - |
          The changes are reversed: cations shrink and anions grow.
        - |
          Only anions grow; a cation loses electrons and its cloud contracts.
        - |
          Gaining or losing electrons changes the balance of repulsion and attraction, so size always changes.
      answer: 0

    # ---- Spiral review
    - slug: chem-u02-w07-q10
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which element has exactly three unpaired electrons in its ground state?
      options:
        - "Carbon (Z = 6)"
        - "Phosphorus (Z = 15)"
        - "Sulfur (Z = 16)"
        - "Magnesium (Z = 12)"
      option_explanations:
        - |
          Carbon's 2p² gives two unpaired electrons by Hund's rule.
        - |
          Correct. Phosphorus ends in 3p³; Hund's rule places one electron in each 3p orbital, three unpaired.
        - |
          Sulfur's 3p⁴ pairs one orbital, leaving two unpaired.
        - |
          Magnesium ends in 3s², a filled orbital with no unpaired electrons.
      answer: 1

    - slug: chem-u02-w07-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Potassium (Z = 19) and argon (Z = 18) have average atomic masses of 39.10 and 39.95 u. Why does the periodic table place potassium after argon even though potassium is lighter?
      options:
        - "The table is ordered by atomic mass, and this is an error"
        - "Argon is a gas and gases come first"
        - "The table is ordered by atomic number, and potassium has one more proton"
        - "Potassium has fewer neutrons, which moves it to the right"
      option_explanations:
        - |
          Modern tables are ordered by proton count, not mass; the inversion is expected, not an error.
        - |
          State of matter plays no part in the ordering.
        - |
          Correct. Argon has 18 protons and potassium 19; atomic number sets the order, and argon's heavier isotopes give it the larger average mass.
        - |
          Neutron count affects mass but not position; potassium-39 actually has 20 neutrons to argon-40's 22.
      answer: 2

    - slug: chem-u02-w07-q12
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Mendeleev predicted the properties of undiscovered elements from gaps in his table, and the predictions were later confirmed. In terms of the scientific method, what did these confirmations accomplish?
      options:
        - "They proved that atoms are indivisible"
        - "They showed the periodic arrangement was a reliable model that could make testable predictions"
        - "They established that atomic mass determines all chemical properties"
        - "They made further experiments unnecessary"
      option_explanations:
        - |
          Mendeleev's table says nothing about the internal structure of atoms.
        - |
          Correct. A model gains support when its predictions are tested and confirmed; the discovery of gallium and germanium as predicted did exactly that.
        - |
          The modern law uses atomic number, and the connection to properties runs through electron configuration, not mass.
        - |
          Confirmed predictions strengthen a model but never end testing; the table was later reorganised by atomic number.
      answer: 1

    - slug: chem-u02-w07-q13
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Radium-226 (group 2, period 7) decays by alpha emission. Which statement about the daughter nucleus is correct?
      options:
        - "It is radon-222, a noble gas in group 18"
        - "It is francium-226, an alkali metal"
        - "It is radium-222, still in group 2"
        - "It is thorium-230, a heavier element"
      option_explanations:
        - |
          Correct. Alpha decay lowers Z from 88 to 86 (radon) and A from 226 to 222; radon is the period-6 noble gas.
        - |
          Francium (Z = 87) would be a beta-related neighbour, and alpha decay changes the mass number by 4.
        - |
          Losing an alpha particle changes the element; the daughter cannot still be radium.
        - |
          Decay lowers the atomic number; thorium (Z = 90) is heavier than radium and would require gaining protons.
      answer: 0

    # ---- Multi-select
    - slug: chem-u02-w07-q14
      type: multi_select
      topic_code: "2.8"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following increase from left to right across a period? Select all that apply.
      options:
        - "Atomic radius"
        - "First ionization energy"
        - "Electronegativity"
        - "Metallic character"
        - "Effective nuclear charge felt by valence electrons"
      option_explanations:
        - |
          Atomic radius decreases across a period as the effective nuclear charge rises.
        - |
          Correct. Electrons are held more tightly, so more energy is needed to remove one.
        - |
          Correct. Atoms toward the right pull bonding electrons more strongly.
        - |
          Metallic character decreases across a period; elements on the right gain rather than lose electrons.
        - |
          Correct. Protons are added while shielding stays nearly constant, so the net pull on valence electrons grows.
      answer: [1, 2, 4]

    - slug: chem-u02-w07-q15
      type: multi_select
      topic_code: "2.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are properties typical of metals? Select all that apply.
      options:
        - "Good conductors of electricity"
        - "Brittle when solid"
        - "Tend to lose electrons to form cations"
        - "Malleable and ductile"
        - "Found in the upper right of the periodic table"
      option_explanations:
        - |
          Correct. Mobile electrons let metals conduct electricity and heat.
        - |
          Brittleness is a nonmetal property; metals bend and stretch instead of shattering.
        - |
          Correct. Low ionization energies let metals lose electrons and form positive ions.
        - |
          Correct. Metals can be hammered into sheets and drawn into wires.
        - |
          The upper right holds the nonmetals; metals occupy the left and centre.
      answer: [0, 2, 3]

    # ---- True / false
    - slug: chem-u02-w07-q16
      type: true_false
      topic_code: "2.8"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Among the halogens, reactivity increases from fluorine down to iodine.
      answer: false
      explanation: |
        False. Nonmetal reactivity increases up a group: fluorine is the most reactive halogen because its small, high-effective-charge atom gains an electron most readily. Metal reactivity runs the other way, increasing down a group.

    - slug: chem-u02-w07-q17
      type: true_false
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The energy needed to ionize an atom can be supplied by a photon, provided the photon's energy is at least the ionization energy of that atom.
      answer: true
      explanation: |
        True. A photon of sufficient energy (E = hf) can remove the outermost electron entirely, which is ionization; this is the photoelectric effect. Ultraviolet or higher-energy photons are usually required.

    # ---- Fill in the blank
    - slug: chem-u02-w07-q18
      type: fill_blank
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The elements of group 18, which have full valence shells and are almost entirely unreactive, are called the ____.
      answer: ["noble gases", "noble gas", "inert gases"]
      explanation: |
        Helium, neon, argon, krypton and xenon have ns² np⁶ (helium 1s²) valence configurations with no tendency to gain or lose electrons, so they exist as single atoms and rarely form compounds.

    - slug: chem-u02-w07-q19
      type: fill_blank
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The noble-gas shorthand electron configuration of calcium (Z = 20) is [Ar] ____.
      answer: ["4s²", "4s2", "4s^2"]
      explanation: |
        Argon accounts for 18 electrons; calcium's remaining two go into 4s, which fills before 3d. Its two valence electrons are why calcium forms Ca²⁺.

    # ---- Numeric
    - slug: chem-u02-w07-q20
      type: numeric
      topic_code: "2.8"
      source: "general knowledge (standard reference values, rounded)"
      points: 1
      prompt: |
        The first ionization energy of sodium is 496 kJ/mol and its second ionization energy is 4,562 kJ/mol. By what factor is the second larger than the first? Give your answer to one decimal place.
      answer: { value: 9.2, tolerance: 0.1 }
      explanation: |
        4,562 ÷ 496 = 9.2. The second electron must come from sodium's full 2s² 2p⁶ core, which is held far more tightly, so the jump is huge; the jump after the first removal shows sodium has one valence electron.

    - slug: chem-u02-w07-q21
      type: numeric
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        How many valence electrons does an atom of selenium (group 16, period 4) have? Give a whole number.
      answer: { value: 6, tolerance: 0 }
      explanation: |
        For a main-group element the last digit of the group number gives the valence count: group 16 has six, matching selenium's 4s² 4p⁴. The filled 3d¹⁰ electrons are not valence electrons.

