  # ---- True / false
  - slug: chem-u02-exam-q31
    type: true_false
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: Cooling a radioactive sample to a very low temperature slows its rate of decay.
    answer: false
    explanation: |
      False. Radioactive decay is a nuclear process; temperature, pressure and chemical bonding affect only the electrons and have no effect on the half-life.

  - slug: chem-u02-exam-q32
    type: true_false
    topic_code: "2.5"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: An atom emits light when one of its electrons moves from a higher energy level to a lower one.
    answer: true
    explanation: |
      True. The energy difference between the levels leaves the atom as a photon whose energy E = hf equals that difference; absorption is the reverse, lifting the electron.

  - slug: chem-u02-exam-q33
    type: true_false
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: Elements in the same period of the periodic table have the same number of valence electrons.
    answer: false
    explanation: |
      False. Elements in the same group share a valence count; elements in the same period share the same highest energy level while the valence count rises from one (group 1) to eight (group 18).

