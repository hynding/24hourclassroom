unit: 2
description: |
  43 questions · about 75 minutes · every topic of Unit 2 (2.1 to 2.8): the mass laws and atomic models, subatomic
  particles and isotopes, average atomic mass, nuclear decay and half-life, light and the Bohr model, electron
  configurations, the periodic table and its trends, with some review of Unit 1. Two stimulus sets (a mass spectrum
  and a period-3 data table), select-all, true/false, fill-in-the-blank and numeric items, two short-answer
  questions (3 points each) and one long answer (6 points). Multiple choice, select-all, true/false and numeric
  items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
  answer are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a mass spectrum (2.2, 2.3)
  - slug: chem-u02-exam-q01
    type: multiple_choice
    topic_code: "2.3"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    stimulus: |
      Graph description: A mass spectrum of a pure element shows two vertical bars. The horizontal axis is mass in atomic mass units and the vertical axis is relative abundance in percent. One bar is at 63 u with height 69.2%; the other is at 65 u with height 30.8%. Isotope masses: 62.930 u and 64.928 u.
    prompt: |
      What is the average atomic mass of the element?
    options:
      - "64.00 u"
      - "63.55 u"
      - "63.00 u"
      - "127.9 u"
    option_explanations:
      - |
        64.00 is the unweighted mean of 63 and 65, ignoring that the lighter isotope is more than twice as abundant.
      - |
        Correct. 0.692 × 62.930 + 0.308 × 64.928 = 43.55 + 20.00 = 63.55 u, which identifies copper.
      - |
        63.00 is the mass of the lighter isotope alone; the heavier one contributes too.
      - |
        Adding the two isotope masses is not an average; the result is about twice the correct value.
    answer: 1

  - slug: chem-u02-exam-q02
    type: multiple_choice
    topic_code: "2.2"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    stimulus: |
      Graph description: A mass spectrum of a pure element shows two vertical bars. The horizontal axis is mass in atomic mass units and the vertical axis is relative abundance in percent. One bar is at 63 u with height 69.2%; the other is at 65 u with height 30.8%. Isotope masses: 62.930 u and 64.928 u.
    prompt: |
      The element is copper (Z = 29). How many neutrons are in an atom of the heavier isotope?
    options:
      - "29"
      - "34"
      - "36"
      - "65"
    option_explanations:
      - |
        Twenty-nine is the number of protons (and of electrons in the neutral atom).
      - |
        Thirty-four neutrons belong to the lighter isotope, copper-63.
      - |
        Correct. The heavier isotope has mass number 65, so neutrons = 65 − 29 = 36.
      - |
        Sixty-five is the mass number, the total of protons and neutrons.
    answer: 2

  - slug: chem-u02-exam-q03
    type: multiple_choice
    topic_code: "2.3"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    stimulus: |
      Graph description: A mass spectrum of a pure element shows two vertical bars. The horizontal axis is mass in atomic mass units and the vertical axis is relative abundance in percent. One bar is at 63 u with height 69.2%; the other is at 65 u with height 30.8%. Isotope masses: 62.930 u and 64.928 u.
    prompt: |
      If a different sample of the same element were found to be 50% of each isotope, what would happen to the average atomic mass, and why?
    options:
      - "It would rise to about 63.9 u, because the heavier isotope would count for more"
      - "It would stay at 63.55 u, because atomic mass is a fixed property"
      - "It would fall, because fewer heavy atoms would be present"
      - "It could not be calculated without a new mass spectrum"
    option_explanations:
      - |
        Correct. 0.50 × 62.930 + 0.50 × 64.928 = 63.93 u; a larger share of the 65 u isotope pulls the weighted mean upward.
      - |
        The average depends on abundances; a different isotope mix gives a different average.
      - |
        Raising the heavy isotope from 30.8% to 50% means more heavy atoms, not fewer, so the average rises.
      - |
        The abundances are given (50:50), so the average follows directly from the isotope masses.
    answer: 0

  # ---- Stimulus set B: period 3 data (2.7, 2.8)
  - slug: chem-u02-exam-q04
    type: multiple_choice
    topic_code: "2.8"
    source: "general knowledge (standard reference values, rounded)"
    points: 1
    stimulus: |
      | Element | Na | Mg | Al | Si | P | S | Cl |
      |---|---|---|---|---|---|---|---|
      | Atomic radius (pm) | 186 | 160 | 143 | 118 | 110 | 104 | 99 |
      | First ionization energy (kJ/mol) | 496 | 738 | 578 | 786 | 1,012 | 1,000 | 1,251 |
      | Electronegativity | 0.93 | 1.31 | 1.61 | 1.90 | 2.19 | 2.58 | 3.16 |
    prompt: |
      Which element in the table is most likely to lose an electron in a chemical reaction?
    options:
      - "Chlorine"
      - "Sodium"
      - "Silicon"
      - "Sulfur"
    option_explanations:
      - |
        Chlorine has the highest ionization energy and electronegativity in the table; it gains electrons rather than losing them.
      - |
        Correct. Sodium's ionization energy, 496 kJ/mol, is the lowest, so its single valence electron is the easiest to remove.
      - |
        Silicon's ionization energy of 786 kJ/mol is well above sodium's; it shares electrons rather than losing them.
      - |
        Sulfur, with 1,000 kJ/mol and electronegativity 2.58, tends to gain electrons.
    answer: 1

  - slug: chem-u02-exam-q05
    type: multiple_choice
    topic_code: "2.8"
    source: "general knowledge (standard reference values, rounded)"
    points: 1
    stimulus: |
      | Element | Na | Mg | Al | Si | P | S | Cl |
      |---|---|---|---|---|---|---|---|
      | Atomic radius (pm) | 186 | 160 | 143 | 118 | 110 | 104 | 99 |
      | First ionization energy (kJ/mol) | 496 | 738 | 578 | 786 | 1,012 | 1,000 | 1,251 |
      | Electronegativity | 0.93 | 1.31 | 1.61 | 1.90 | 2.19 | 2.58 | 3.16 |
    prompt: |
      All seven elements have their valence electrons in the n = 3 level. Which single factor best explains why the radius falls from 186 pm to 99 pm across the row?
    options:
      - "The number of neutrons increases"
      - "The increasing nuclear charge acts on electrons in the same level with little added shielding"
      - "Each element adds a new energy level"
      - "The atoms become lighter"
    option_explanations:
      - |
        Neutrons add mass but no charge; they do not pull electrons inward.
      - |
        Correct. More protons with nearly constant shielding means a larger effective nuclear charge, which contracts the n = 3 electron cloud.
      - |
        No new level is added within a period; that happens going down a group and makes atoms larger.
      - |
        The atoms get heavier, not lighter, across the row, and mass does not determine radius anyway.
    answer: 1

  - slug: chem-u02-exam-q06
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge (standard reference values, rounded)"
    points: 1
    stimulus: |
      | Element | Na | Mg | Al | Si | P | S | Cl |
      |---|---|---|---|---|---|---|---|
      | Atomic radius (pm) | 186 | 160 | 143 | 118 | 110 | 104 | 99 |
      | First ionization energy (kJ/mol) | 496 | 738 | 578 | 786 | 1,012 | 1,000 | 1,251 |
      | Electronegativity | 0.93 | 1.31 | 1.61 | 1.90 | 2.19 | 2.58 | 3.16 |
    prompt: |
      Which element in the table is a metalloid, and which family does the last element belong to?
    options:
      - "Aluminium is the metalloid; chlorine is a noble gas"
      - "Phosphorus is the metalloid; chlorine is an alkali metal"
      - "Silicon is the metalloid; chlorine is a halogen"
      - "Sulfur is the metalloid; chlorine is an alkaline earth metal"
    option_explanations:
      - |
        Aluminium is a metal, and chlorine (group 17) is a halogen, not a noble gas.
      - |
        Phosphorus is a nonmetal; chlorine is not an alkali metal.
      - |
        Correct. Silicon sits on the staircase line and is a semiconductor; chlorine, with seven valence electrons, is in group 17, the halogens.
      - |
        Sulfur is a nonmetal, and the alkaline earth metals are group 2.
    answer: 2

  # ---- Multiple choice, stand-alone
  - slug: chem-u02-exam-q07
    type: multiple_choice
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Water from any source is 11.2% hydrogen by mass. Which law does this illustrate, and how does atomic theory explain it?
    options:
      - "Conservation of mass; atoms are never destroyed"
      - "Multiple proportions; hydrogen forms several oxides"
      - "Definite proportions; every water molecule has the same fixed number of H and O atoms, each with a fixed mass"
      - "Definite proportions; water is a mixture with a fixed recipe"
    option_explanations:
      - |
        Conservation of mass concerns the total mass before and after a reaction, not the composition of a compound.
      - |
        Multiple proportions compares two different compounds of the same elements; here there is one compound.
      - |
        Correct. A fixed ratio of atoms with fixed masses gives a fixed mass ratio in every sample.
      - |
        Water is a compound, not a mixture; mixtures can have any proportions.
    answer: 2

  - slug: chem-u02-exam-q08
    type: multiple_choice
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which experimental result led to the plum pudding model being abandoned?
    options:
      - "Cathode rays were deflected toward a positive plate"
      - "A few alpha particles were scattered backward by a thin gold foil"
      - "Hydrogen gas emitted a line spectrum"
      - "Neutrons were found to have no charge"
    option_explanations:
      - |
        Cathode-ray deflection established the electron and led to the plum pudding model rather than ending it.
      - |
        Correct. A diffuse positive sphere could not reverse a heavy, fast alpha particle; a dense nucleus could.
      - |
        Line spectra led to the Bohr model of energy levels, after the nucleus was already established.
      - |
        The neutron was discovered in 1932, two decades after the nuclear model replaced plum pudding.
    answer: 1

  - slug: chem-u02-exam-q09
    type: multiple_choice
    topic_code: "2.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which particle has 24 protons, 28 neutrons and 21 electrons?
    options:
      - "Cr³⁺ with mass number 52"
      - "Cr³⁻ with mass number 52"
      - "Ni³⁺ with mass number 52"
      - "Cr with mass number 49"
    option_explanations:
      - |
        Correct. Twenty-four protons is chromium; 24 + 28 = 52; three fewer electrons than protons gives 3+.
      - |
        Fewer electrons than protons means a positive charge, not negative.
      - |
        Nickel has 28 protons; this particle has 24.
      - |
        The mass number counts protons and neutrons (52), not electrons.
    answer: 0

  - slug: chem-u02-exam-q10
    type: multiple_choice
    topic_code: "2.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Hydrogen-1, hydrogen-2 (deuterium) and hydrogen-3 (tritium) all exist. What do they have in common and how do they differ?
    options:
      - "Same number of neutrons; different numbers of protons"
      - "Same number of protons and electrons; different numbers of neutrons"
      - "Same mass; different charges"
      - "Different elements with the same name"
    option_explanations:
      - |
        They have 0, 1 and 2 neutrons respectively; it is the proton count (1) that they share.
      - |
        Correct. All three are hydrogen with one proton and one electron; they are isotopes differing in neutron count.
      - |
        Their masses are about 1, 2 and 3 u; as neutral atoms all have zero charge.
      - |
        A single proton makes every one of them hydrogen; isotopes are not different elements.
    answer: 1

  - slug: chem-u02-exam-q11
    type: multiple_choice
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which decay process is represented by the change uranium-238 → thorium-234?
    options:
      - "Beta decay"
      - "Gamma emission"
      - "Alpha decay"
      - "Nuclear fusion"
    option_explanations:
      - |
        Beta decay leaves the mass number unchanged and raises the atomic number by one.
      - |
        Gamma emission changes neither the mass number nor the atomic number.
      - |
        Correct. The mass number drops by 4 and the atomic number by 2 (92 → 90), the signature of losing a helium-4 nucleus.
      - |
        Fusion joins light nuclei into heavier ones; this is a heavy nucleus splitting off a small particle.
    answer: 2

  - slug: chem-u02-exam-q12
    type: multiple_choice
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A radioactive sample has an activity of 800 counts per minute. After 30 hours it reads 100 counts per minute. What is the half-life?
    options:
      - "3.75 hours"
      - "7.5 hours"
      - "10 hours"
      - "15 hours"
    option_explanations:
      - |
        3.75 hours would give eight half-lives in 30 hours, leaving 800 ÷ 256, about 3 counts per minute.
      - |
        7.5 hours would give four half-lives and 800 ÷ 16 = 50 counts per minute.
      - |
        Correct. 800 → 400 → 200 → 100 is three half-lives, so 30 h ÷ 3 = 10 h.
      - |
        15 hours would give two half-lives and 200 counts per minute.
    answer: 2

  - slug: chem-u02-exam-q13
    type: multiple_choice
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement about alpha radiation is correct?
    options:
      - "It is stopped by a sheet of paper but is dangerous if the source is inhaled"
      - "It passes through thick lead and needs concrete shielding"
      - "It consists of electrons emitted from the nucleus"
      - "It has no mass and no charge"
    option_explanations:
      - |
        Correct. Alpha particles are heavy and doubly charged, so they travel only a short distance in matter; inside the lungs that short range deposits all their energy in tissue.
      - |
        Deep penetration describes gamma rays; alpha particles are the least penetrating.
      - |
        Electrons from the nucleus are beta particles.
      - |
        Alpha particles have a mass of 4 u and a charge of 2+; gamma rays are the massless, chargeless radiation.
    answer: 0

  - slug: chem-u02-exam-q14
    type: multiple_choice
    topic_code: "2.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement correctly relates the colour of a hydrogen emission line to the electron transition that produces it?
    options:
      - "Red light comes from the largest energy drop"
      - "Violet light comes from a larger energy drop than red light"
      - "All lines come from the same transition at different speeds"
      - "The colour depends on the number of protons, not on the transition"
    option_explanations:
      - |
        Red light has the longest visible wavelength and lowest energy; it comes from the smallest visible drop (3 → 2).
      - |
        Correct. Violet has a shorter wavelength and higher photon energy, so it corresponds to a larger gap (5 → 2 or 6 → 2).
      - |
        Each line is a different pair of levels; photons all travel at c.
      - |
        Hydrogen has one proton for every line; the colour is set by the energy difference between the levels involved.
    answer: 1

  - slug: chem-u02-exam-q15
    type: multiple_choice
    topic_code: "2.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Two photons: one of wavelength 300 nm and one of 600 nm. How do their energies compare?
    options:
      - "The 300 nm photon has half the energy of the 600 nm photon"
      - "They have the same energy because both travel at c"
      - "The 300 nm photon has four times the energy"
      - "The 300 nm photon has twice the energy of the 600 nm photon"
    option_explanations:
      - |
        Energy is inversely proportional to wavelength, so the shorter wavelength carries more, not less, energy.
      - |
        All photons travel at c, but their energies depend on frequency, E = hf.
      - |
        E = hc/λ is inversely proportional to λ, not to λ²; halving the wavelength doubles the energy.
      - |
        Correct. E = hc/λ; halving the wavelength doubles the frequency and so doubles the photon energy.
    answer: 3

  - slug: chem-u02-exam-q16
    type: multiple_choice
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the ground-state electron configuration of nickel (Z = 28)?
    options:
      - "[Ar] 3d¹⁰"
      - "[Ar] 4s² 3d⁸"
      - "[Ar] 4s² 4p⁸"
      - "[Ar] 4s² 4d⁸"
    option_explanations:
      - |
        This accounts for 28 electrons but skips 4s, which fills before 3d.
      - |
        Correct. After argon's 18, two electrons fill 4s and the next eight enter 3d.
      - |
        A p sublevel holds only six electrons, and 3d fills before 4p.
      - |
        The 4d sublevel is in period 5; the transition metals of period 4 fill 3d.
    answer: 1

  - slug: chem-u02-exam-q17
    type: multiple_choice
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Which orbital diagram for carbon's 2p² electrons is correct?
    options:
      - "[↑↓][  ][  ]"
      - "[↑↓][↑↓][  ]"
      - "[↑ ][↓ ][  ]"
      - "[↑ ][↑ ][  ]"
    option_explanations:
      - |
        Pairing the two electrons in one orbital while two others are empty violates Hund's rule.
      - |
        Four electrons are shown; carbon has only two in 2p.
      - |
        Hund's rule requires the single electrons in separate orbitals to have parallel spins.
      - |
        Correct. Two electrons occupy separate 2p orbitals with parallel spins, giving carbon two unpaired electrons.
    answer: 3

  - slug: chem-u02-exam-q18
    type: multiple_choice
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the electron configuration of the Fe³⁺ ion (iron Z = 26)?
    options:
      - "[Ar] 3d⁵"
      - "[Ar] 4s² 3d³"
      - "[Ar] 4s² 3d⁹"
      - "[Ar] 4s¹ 3d⁴"
    option_explanations:
      - |
        Correct. Iron is [Ar] 4s² 3d⁶; cations lose electrons from the highest level first, so the two 4s electrons go, then one 3d, leaving 3d⁵.
      - |
        Electrons leave the outer 4s level before the 3d; removing three from 3d alone is wrong.
      - |
        This has 29 electrons, three more than iron, which would be an anion.
      - |
        One 4s and two 3d removed is not the order; both 4s electrons leave first.
    answer: 0

  - slug: chem-u02-exam-q19
    type: multiple_choice
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    prompt: |
      How many orbitals are in the n = 2 energy level, and how many electrons can they hold in total?
    options:
      - "2 orbitals, 4 electrons"
      - "3 orbitals, 6 electrons"
      - "8 orbitals, 16 electrons"
      - "4 orbitals, 8 electrons"
    option_explanations:
      - |
        The n = 2 level has a 2s orbital and three 2p orbitals, four in all.
      - |
        Three orbitals is the 2p sublevel alone; the 2s orbital must be added.
      - |
        Eight is the electron capacity, not the orbital count; each orbital holds two.
      - |
        Correct. One 2s plus three 2p orbitals is four orbitals, each holding two electrons: 2n² = 8.
    answer: 3

  - slug: chem-u02-exam-q20
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Strontium is in group 2, period 5. Which ion does it form, and why?
    options:
      - "Sr²⁺, because losing its two 5s electrons gives it krypton's configuration"
      - "Sr⁺, because it has one valence electron"
      - "Sr²⁻, because it gains two electrons to fill its shell"
      - "Sr⁵⁺, because it is in period 5"
    option_explanations:
      - |
        Correct. Group 2 elements have ns² valence electrons; losing both leaves the previous noble gas's configuration.
      - |
        Group 2 elements have two valence electrons, not one.
      - |
        Metals lose electrons; gaining two would require strontium to be a nonmetal near a full shell.
      - |
        The period number gives the energy level, not the charge.
    answer: 0

  - slug: chem-u02-exam-q21
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which block of the periodic table contains the transition metals, and which sublevel is being filled there?
    options:
      - "s block; the ns sublevel"
      - "p block; the np sublevel"
      - "f block; the (n − 2)f sublevel"
      - "d block; the (n − 1)d sublevel"
    option_explanations:
      - |
        The s block holds the alkali and alkaline earth metals.
      - |
        The p block holds groups 13–18, mostly nonmetals and metalloids.
      - |
        The f block is the lanthanides and actinides below the table.
      - |
        Correct. Groups 3–12 fill the d sublevel one level below the outer s; in period 4 that is 3d after 4s.
    answer: 3

  - slug: chem-u02-exam-q22
    type: multiple_choice
    topic_code: "2.8"
    source: "general knowledge"
    points: 1
    prompt: |
      Which list is in order of increasing atomic radius?
    options:
      - "F < Cl < Br < I"
      - "I < Br < Cl < F"
      - "Cl < F < I < Br"
      - "F < Br < Cl < I"
    option_explanations:
      - |
        Correct. Going down group 17 adds an energy level each step, so the atoms grow from fluorine to iodine.
      - |
        This is decreasing order; iodine is the largest halogen.
      - |
        Fluorine is the smallest, so it cannot come after chlorine.
      - |
        Chlorine is smaller than bromine, so it must come before it.
    answer: 0

  - slug: chem-u02-exam-q23
    type: multiple_choice
    topic_code: "2.8"
    source: "general knowledge"
    points: 1
    prompt: |
      An element's successive ionization energies, in kJ/mol, are 578, 1,817, 2,745 and then 11,577. How many valence electrons does it have?
    options:
      - "One"
      - "Two"
      - "Four"
      - "Three"
    option_explanations:
      - |
        A single valence electron would show a huge jump after the first removal.
      - |
        Two valence electrons would give the jump after the second ionization energy.
      - |
        Four valence electrons would place the jump after the fourth value.
      - |
        Correct. The fourth value is more than four times the third, so the fourth electron comes from a noble-gas core: three valence electrons (aluminium).
    answer: 3

  - slug: chem-u02-exam-q24
    type: multiple_choice
    topic_code: "2.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Element X has an average atomic mass of 10.81 u and two isotopes of mass 10.013 u and 11.009 u. Which is the more abundant isotope?
    options:
      - "The 10.013 u isotope, because it is lighter"
      - "They are equally abundant"
      - "The 11.009 u isotope, because the average lies closer to its mass"
      - "It cannot be determined from the average"
    option_explanations:
      - |
        Being lighter does not make an isotope more common; the average, not the mass, tells the story.
      - |
        Equal abundances would give an average near 10.51 u, midway between the two.
      - |
        Correct. 10.81 is much nearer 11.009 than 10.013, so the heavier isotope dominates (about 80%).
      - |
        The position of the average between the two masses reveals which isotope is more abundant.
    answer: 2

  - slug: chem-u02-exam-q25
    type: multiple_choice
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement explains why carbon-14 dating cannot be used on a rock that is 50 million years old?
    options:
      - "After so many half-lives essentially no carbon-14 remains to be measured, and rock contains no carbon from a once-living source"
      - "Carbon-14 decays faster in rock than in wood"
      - "Rocks absorb carbon-14 from the air continuously"
      - "The half-life of carbon-14 is too long to date anything younger than a billion years"
    option_explanations:
      - |
        Correct. Fifty million years is thousands of half-lives of 5,730 years; nothing measurable is left, and the method requires once-living material anyway.
      - |
        Half-life is a nuclear property unaffected by the material's surroundings.
      - |
        Only living things exchange carbon with the atmosphere; a rock does not take up carbon-14.
      - |
        Carbon-14's half-life is short, which is why the method works only to about 50,000 years.
    answer: 0

  - slug: chem-u02-exam-q26
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A student calculates 0.7576 × 34.969 + 0.2424 × 36.966 and the calculator shows 35.4530. The abundances are known to four significant figures. The correctly reported average is:
    options:
      - "35.453 u"
      - "35.5 u"
      - "35.4530 u"
      - "35.45 u"
    option_explanations:
      - |
        Five significant figures exceed the four provided by the abundances.
      - |
        Three figures discard precision that four-figure data support.
      - |
        Six figures are far more than the data justify.
      - |
        Correct. The four-figure abundances limit the result to four significant figures: 35.45 u.
    answer: 3

  - slug: chem-u02-exam-q27
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      A sample of pure neon gas contains atoms of neon-20, neon-21 and neon-22. How should the sample be classified?
    options:
      - "A pure substance, specifically an element"
      - "A homogeneous mixture of three elements"
      - "A compound of three isotopes"
      - "A heterogeneous mixture"
    option_explanations:
      - |
        Correct. Every atom has ten protons, so every atom is neon; one element is a pure substance whatever its isotope mix.
      - |
        Isotopes are not different elements; they are varieties of the same one.
      - |
        A compound requires different elements bonded together; neon forms no bonds.
      - |
        Neon gas is uniform throughout; nothing about it is heterogeneous.
    answer: 0

  # ---- Multi-select
  - slug: chem-u02-exam-q28
    type: multi_select
    topic_code: "2.1"
