  - slug: chem-u02-exam-q30
    type: multi_select
    topic_code: "2.8"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following comparisons are correct? Select all that apply.
    options:
      - "Potassium has a lower first ionization energy than sodium"
      - "Oxygen is more electronegative than sulfur"
      - "A chloride ion is smaller than a chlorine atom"
      - "Cesium is more reactive than lithium"
      - "Neon has a larger atomic radius than lithium"
    option_explanations:
      - |
        Correct. Potassium's outer electron is one level farther out and more shielded.
      - |
        Correct. Electronegativity decreases down a group, so oxygen exceeds sulfur.
