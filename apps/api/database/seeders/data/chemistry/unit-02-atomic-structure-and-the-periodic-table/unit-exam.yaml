      - "The nucleus contains most of the atom's mass"
      - "Electrons occupy orbitals of fixed energy"
    option_explanations:
      - |
        Correct. The undeflected passage of most alpha particles showed there was little to hit.
      - |
        The electron's charge was Thomson's discovery from cathode rays, before the gold foil work.
      - |
        Correct. Only a tiny concentrated positive charge could repel alpha particles through large angles.
      - |
        Correct. Turning a heavy alpha particle around requires a massive target.
      - |
        Energy levels came from Bohr's analysis of spectra, not from scattering.
