    prompt: |
      Lithium is 7.59% Li-6 (6.015 u) and 92.41% Li-7 (7.016 u). Calculate its average atomic mass. Give your answer in u to two decimal places.
    answer: { value: 6.94, tolerance: 0.02 }
    explanation: |
      0.0759 × 6.015 = 0.457 u; 0.9241 × 7.016 = 6.483 u; sum = 6.94 u. The average lies close to 7 because Li-7 makes up more than 90% of the atoms.

  - slug: chem-u02-exam-q38
    type: numeric
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Cobalt-60 has a half-life of 5.27 years. What fraction of a cobalt-60 source remains after 21.08 years? Give your answer as a decimal to four places (for example, 0.5000 for one half).
    answer: { value: 0.0625, tolerance: 0.0005 }
    explanation: |
      21.08 ÷ 5.27 = 4 half-lives. (1/2)⁴ = 1/16 = 0.0625, or 6.25% of the original.

  - slug: chem-u02-exam-q39
    type: numeric
    topic_code: "2.5"
    source: "NIST CODATA constants (c and h, rounded)"
    points: 1
    prompt: |
      Red light from a hydrogen lamp has a wavelength of 656 nm. Using c = 2.998 × 10⁸ m/s, calculate its frequency. Give your answer in units of 10¹⁴ Hz to two decimal places (for example, enter 5.00 for 5.00 × 10¹⁴ Hz).
    answer: { value: 4.57, tolerance: 0.02 }
    explanation: |
      λ = 6.56 × 10⁻⁷ m. f = 2.998 × 10⁸ ÷ 6.56 × 10⁻⁷ = 4.57 × 10¹⁴ Hz. The photon energy is hf = 3.03 × 10⁻¹⁹ J, the gap between hydrogen's n = 3 and n = 2 levels.

  - slug: chem-u02-exam-q40
    type: numeric
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    prompt: |
      When 8.00 g of hydrogen burns completely in oxygen, 72.0 g of water forms and nothing is left over. What mass of oxygen reacted? Give your answer in grams to one decimal place.
    answer: { value: 64.0, tolerance: 0.1 }
    explanation: |
      Conservation of mass: oxygen = 72.0 − 8.00 = 64.0 g. The ratio 8.00 : 64.0 = 1 : 8 is water's fixed hydrogen-to-oxygen mass ratio (11.1% hydrogen), the law of definite proportions.

  # ---- Short answer
  - slug: chem-u02-exam-q41
    type: short_answer
    topic_code: "2.6"
    source: "general knowledge"
    points: 3
    prompt: |
      Element Q has the ground-state configuration 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁵.

      (a) Identify Q, its period, its group and its family, and write its noble-gas shorthand configuration.
      (b) State the number of valence electrons and the number of unpaired electrons, and draw (in text) the orbital diagram of its 4p sublevel.
      (c) Predict the ion Q forms and compare its radius with that of the neutral atom, giving a reason.
    answer: |
      (a) The superscripts total 35: bromine, period 4, group 17, a halogen. Shorthand: [Ar] 4s² 3d¹⁰ 4p⁵.
      (b) Seven valence electrons (4s² 4p⁵); one unpaired electron. 4p: [↑↓][↑↓][↑ ].
      (c) Bromine gains one electron to reach krypton's configuration, forming Br⁻. The ion is larger than the atom because the added electron increases repulsion among the electrons, expanding the cloud.
    explanation: |
      Three points, one per part.

      (a) 1 pt: bromine, period 4, group 17, halogen, [Ar] 4s² 3d¹⁰ 4p⁵.

      (b) 1 pt: 7 valence electrons, 1 unpaired, correct 4p diagram.

      (c) 1 pt: Br⁻, larger than Br, with electron repulsion or the extra electron as the reason.

  - slug: chem-u02-exam-q42
    type: short_answer
    topic_code: "2.4"
    source: "general knowledge"
    points: 3
    stimulus: |
      A hospital receives a sample of iodine-131 (half-life 8.02 days) containing 320 mg of the isotope. Iodine-131 decays by beta emission.
    prompt: |
      Using the information, answer (a), (b) and (c).

      (a) Write the nuclear equation for the decay of iodine-131 (Z = 53) and identify the daughter.
      (b) Calculate the mass of iodine-131 remaining after 32.08 days.
      (c) Explain why iodine-131 is useful for treating thyroid disease, and why a half-life of 8 days is more suitable for this purpose than one of 8 minutes or 8 years.
    answer: |
      (a) Iodine-131 → xenon-131 + beta particle (electron). Mass numbers 131 = 131 + 0; atomic numbers 53 = 54 + (−1). The daughter is xenon-131.
      (b) 32.08 ÷ 8.02 = 4 half-lives. 320 → 160 → 80 → 40 → 20 mg remain.
      (c) The thyroid concentrates iodine, so the isotope delivers beta radiation directly to thyroid tissue. An 8-minute half-life would decay before reaching the gland; an 8-year half-life would irradiate the patient for years. Eight days is long enough to act and short enough to clear within weeks.
    explanation: |
      Three points, one per part.

      (a) 1 pt: xenon-131 plus a beta particle with both numbers balanced.

      (b) 1 pt: four half-lives, 20 mg.

      (c) 1 pt: thyroid uptake plus a sensible argument about the half-life being neither too short nor too long.

  # ---- Long answer
  - slug: chem-u02-exam-q43
    type: long_answer
    topic_code: "2.8"
    source: "general knowledge"
    points: 6
    prompt: |
      Sodium and chlorine are both in period 3. Sodium is a soft, highly reactive metal with an atomic radius of 186 pm and a first ionization energy of 496 kJ/mol; chlorine is a reactive yellow-green gas with a radius of 99 pm and a first ionization energy of 1,251 kJ/mol.

      Using electron configurations, effective nuclear charge and shielding, explain these differences in size and ionization energy. Then explain what each element does with its electrons in a reaction, why each ends up with a noble-gas configuration, and how the sizes of the resulting ions compare with their atoms. Finally, predict how potassium and bromine would compare with sodium and chlorine respectively, and why.
    answer: |
      Sodium is [Ne] 3s¹ and chlorine is [Ne] 3s² 3p⁵. Both have their valence electrons in n = 3 with the same ten inner electrons doing the shielding, but chlorine has 17 protons to sodium's 11. The effective nuclear charge felt by chlorine's valence electrons is therefore much larger, pulling the n = 3 cloud closer (99 pm against 186 pm) and holding each electron far more tightly, so chlorine's first ionization energy is more than twice sodium's.

      In reactions sodium loses its single 3s electron, which costs little energy, and becomes Na⁺ with neon's configuration 1s² 2s² 2p⁶. Chlorine, one electron short of a full level, gains an electron to become Cl⁻ with argon's configuration [Ne] 3s² 3p⁶. Both ions have full outer levels, which is the stable arrangement the noble gases show.

      Na⁺ is much smaller than the sodium atom (about 102 pm): the whole n = 3 level is gone and the remaining electrons are pulled in by the unchanged nucleus. Cl⁻ is larger than the chlorine atom (about 181 pm): the extra electron adds repulsion and the cloud expands.

      Potassium, below sodium, has its valence electron in n = 4, farther out and shielded by 18 inner electrons, so it is larger (227 pm) and has a lower ionization energy (419 kJ/mol); it is even more reactive. Bromine, below chlorine, is larger than chlorine with a lower ionization energy and lower electronegativity, so it gains an electron less readily and is a less reactive nonmetal.
    explanation: |
      Six points.

      1 pt: configurations of sodium and chlorine with the same shielding identified.

      1 pt: chlorine's greater nuclear charge gives greater effective nuclear charge, explaining the smaller radius.

      1 pt: the same reasoning applied to ionization energy.

      1 pt: sodium loses one electron to Na⁺ (neon configuration); chlorine gains one to Cl⁻ (argon configuration).

      1 pt: cation smaller than its atom, anion larger, with reasons.

      1 pt: potassium larger and more reactive than sodium; bromine larger and less reactive than chlorine, with the added-level or shielding reason.
