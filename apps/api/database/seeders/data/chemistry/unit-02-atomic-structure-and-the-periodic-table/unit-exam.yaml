      In beta decay a neutron in the nucleus changes into a proton and emits a fast ____.
    answer: ["electron", "beta particle"]
    explanation: |
      The emitted electron is the beta particle. The mass number stays the same and the atomic number rises by one, so the daughter is the next element in the table.

  - slug: chem-u02-exam-q36
