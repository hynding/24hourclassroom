week: 4
unit: 2
title: "The Atom: From Dalton to the Nucleus"
topics: ["2.1", "2.2"]
guide: guides/week-04.md
guide_description: |
  The laws of conservation of mass, definite proportions and multiple proportions, and Dalton's atomic theory as
  the explanation of all three; Thomson's cathode rays and electron, Rutherford's gold foil and the nucleus,
  Chadwick's neutron; proton, neutron and electron; atomic number, mass number, isotopes and ions. Worked examples
  on mass-law calculations, counting particles in atoms and ions, and identifying an isotope from its particles.
flashcards_description: |
  30 cards on the mass laws, Dalton's theory and its revisions, the Thomson and Rutherford experiments, the
  subatomic particles, atomic and mass numbers, isotope symbols and ions.

flashcards:
  - front: Law of conservation of mass → statement and a sealed-flask example
    back: |
      In a chemical change the total mass of the products equals the total mass of the reactants. Tin heated in a sealed flask of air gains mass as oxide, but the flask as a whole weighs the same.
    topic_code: "2.1"
  - front: Law of definite proportions → statement and the water example
    back: |
      A given compound always contains its elements in the same ratio by mass. Water from any source is 11.2% hydrogen and 88.8% oxygen by mass.
    topic_code: "2.1"
  - front: Law of multiple proportions → statement and the carbon oxides
    back: |
      When two elements form more than one compound, the masses of one element combining with a fixed mass of the other are in a small whole-number ratio. 1.00 g of carbon combines with 1.33 g of oxygen in CO and 2.66 g in CO₂, a 1:2 ratio.
    topic_code: "2.1"
  - front: Dalton's atomic theory (1808) → the four main claims
    back: |
      Matter is made of tiny indivisible atoms; atoms of one element are identical and differ from other elements' atoms; compounds are atoms combined in small whole-number ratios; reactions rearrange atoms without creating or destroying them.
    topic_code: "2.1"
  - front: How Dalton's theory explains conservation of mass → the argument
    back: |
      If a reaction only rearranges atoms and each atom keeps its mass, the total mass before and after must be the same.
    topic_code: "2.1"
  - front: How Dalton's theory explains definite proportions → the argument
    back: |
      A compound is a fixed combination of atoms (two H to one O in water). Fixed atoms with fixed masses give a fixed mass ratio in every sample.
    topic_code: "2.1"
  - front: Dalton's claims later revised → which two and why
    back: |
      Atoms are not indivisible (they contain electrons, protons and neutrons), and atoms of one element are not all identical in mass (isotopes). The core idea, atoms rearranging in whole-number ratios, survived.
    topic_code: "2.1"
  - front: Cathode ray tube → what Thomson observed and concluded
    back: |
      A beam from the negative electrode bent toward a positive plate, so it was negative; its charge-to-mass ratio was about 1,800 times that of a hydrogen ion, and it was the same for every cathode metal. Conclusion: all atoms contain tiny negative electrons.
    topic_code: "2.1"
  - front: Plum pudding model → who, what and why it was proposed
    back: |
      Thomson, after discovering the electron: a sphere of positive charge with electrons scattered through it like fruit in a pudding, so that the atom is neutral overall.
    topic_code: "2.1"
  - front: Gold foil experiment → setup and the surprising result
    back: |
      Geiger and Marsden fired alpha particles at thin gold foil. Most passed straight through, but about 1 in 8,000 bounced back at large angles, which the plum pudding model could not explain.
    topic_code: "2.1"
  - front: Rutherford's nuclear model → the three conclusions from the gold foil
    back: |
      The atom is mostly empty space; its positive charge and nearly all its mass are concentrated in a tiny nucleus about 1/10,000 of the atom's diameter; electrons occupy the space around it.
    topic_code: "2.1"
  - front: Why most alpha particles passed through the foil → explanation
    back: |
      The nucleus is so small compared with the atom that most alpha particles never come near one; they travel through the nearly empty electron region undeflected.
    topic_code: "2.1"
  - front: Chadwick's neutron (1932) → the problem it solved
    back: |
      Nuclear masses were about twice what the protons accounted for. A neutral particle of nearly the proton's mass, the neutron, makes up the difference.
    topic_code: "2.1"
  - front: Proton → charge, mass and location
    back: |
      Charge +1, mass about 1 u (1.007 u), located in the nucleus. The number of protons defines the element.
    topic_code: "2.2"
  - front: Neutron → charge, mass and location
    back: |
      Charge 0, mass about 1 u (1.009 u, slightly more than a proton), located in the nucleus. The number of neutrons varies among isotopes of an element.
    topic_code: "2.2"
  - front: Electron → charge, mass and location
    back: |
      Charge −1, mass about 1/1,836 u (0.00055 u), found outside the nucleus. Electrons carry out all the chemistry and set the charge of an ion.
    topic_code: "2.2"
  - front: Atomic number Z → what it counts and what it decides
    back: |
      The number of protons in the nucleus. It identifies the element: every atom with 6 protons is carbon. In a neutral atom it also equals the number of electrons.
    topic_code: "2.2"
  - front: Mass number A → what it counts
    back: |
      Protons plus neutrons in one atom, always a whole number. It is not the decimal on the periodic table, which is an average over isotopes.
    topic_code: "2.2"
  - front: Number of neutrons → formula
    back: |
      Neutrons = A − Z (mass number minus atomic number). For iron-56, 56 − 26 = 30 neutrons.
    topic_code: "2.2"
  - front: Isotopes → definition and the carbon example
    back: |
      Atoms of the same element (same Z) with different numbers of neutrons (different A). Carbon-12 has 6 p and 6 n; carbon-14 has 6 p and 8 n.
    topic_code: "2.2"
  - front: Isotopes and chemical behaviour → same or different, and why
    back: |
      The same, because chemistry depends on the electrons and isotopes have the same number of them. They differ only in mass and in nuclear stability.
    topic_code: "2.2"
  - front: Isotope notation → how to read carbon-14 and ¹⁴C
    back: |
      The number is the mass number A. The element symbol fixes Z (6 for carbon), so neutrons = 14 − 6 = 8. Full notation puts A top left and Z bottom left of the symbol.
    topic_code: "2.2"
  - front: Cation versus anion → which particle changes and how
    back: |
      A cation forms when an atom loses electrons (positive, e.g. Mg²⁺ with 12 p and 10 e); an anion forms when it gains electrons (negative, e.g. Cl⁻ with 17 p and 18 e). Protons never change.
    topic_code: "2.2"
  - front: Electrons in an ion → formula from Z and charge
    back: |
      Electrons = Z − charge. Al³⁺: 13 − 3 = 10 electrons. O²⁻: 8 − (−2) = 10 electrons.
    topic_code: "2.2"
  - front: Atomic mass unit (u) → definition and size
    back: |
      One twelfth of the mass of a carbon-12 atom, about 1.661 × 10⁻²⁴ g. Protons and neutrons each have a mass of about 1 u.
    topic_code: "2.2"
  - front: Identifying an element from particle counts → the rule
    back: |
      Count the protons and look up that atomic number; the neutrons and electrons do not change the identity. 29 protons and 36 neutrons is copper-65.
    topic_code: "2.2"
  - front: Same mass number, different elements → are they isotopes?
    back: |
      No. Argon-40 (18 p, 22 n) and calcium-40 (20 p, 20 n) share a mass number but have different proton counts, so they are different elements.
    topic_code: "2.2"
  - front: Where the mass of an atom sits → the nucleus and the space around it
    back: |
      More than 99.9% of the mass is in the nucleus (protons and neutrons), which is about 1/10,000 of the atom's diameter. The electrons fill the rest of the volume but contribute almost no mass.
    topic_code: "2.2"
  - front: Mass-law calculation → predicting product mass from a fixed ratio
    back: |
      Use the known ratio as a conversion factor. If 12.0 g Mg gives 20.0 g MgO, then 30.0 g Mg gives 30.0 × (20.0 / 12.0) = 50.0 g MgO (definite proportions), and the oxygen used is 50.0 − 30.0 = 20.0 g (conservation of mass).
    topic_code: "2.1"
  - front: Why a burning candle seems to lose mass → conservation still holds
    back: |
      The products carbon dioxide and water vapour escape as gases. Weighed in a closed system with the oxygen it consumed, the total mass is unchanged.
    topic_code: "2.1"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 2.1 and 2.2: the mass laws, atomic models and
    subatomic particles), with about a third reviewing Unit 1 (classifying matter, properties and changes,
    significant figures, density and the particle model). Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a table of atoms and ions (2.2)
    - slug: chem-u02-w04-q01
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        | Particle | Protons | Neutrons | Electrons |
        |---|---|---|---|
        | W | 11 | 12 | 11 |
        | X | 11 | 13 | 11 |
        | Y | 12 | 12 | 10 |
        | Z | 17 | 18 | 18 |
      prompt: |
        Which two particles in the table are isotopes of the same element?
      options:
        - "W and Y"
        - "X and Y"
        - "W and X"
        - "Y and Z"
      option_explanations:
        - |
          W has 11 protons and Y has 12, so they are different elements (sodium and magnesium).
        - |
          X (11 protons) and Y (12 protons) are different elements.
        - |
          Correct. Both have 11 protons (sodium) and differ only in neutrons, 12 versus 13: sodium-23 and sodium-24.
        - |
          Y has 12 protons and Z has 17; magnesium and chlorine are not isotopes of each other.
      answer: 2

    - slug: chem-u02-w04-q02
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        | Particle | Protons | Neutrons | Electrons |
        |---|---|---|---|
        | W | 11 | 12 | 11 |
        | X | 11 | 13 | 11 |
        | Y | 12 | 12 | 10 |
        | Z | 17 | 18 | 18 |
      prompt: |
        What is the charge and identity of particle Y?
      options:
        - "A neutral magnesium atom"
        - "A neon atom with a 2+ charge"
        - "A magnesium ion with a 2− charge"
        - "A magnesium ion with a 2+ charge"
      option_explanations:
        - |
          Y has 12 protons but only 10 electrons, so it is not neutral.
        - |
          Twelve protons make it magnesium, not neon; the ten electrons match neon's count but the element is set by protons.
        - |
          Two more protons than electrons gives a positive charge, not negative.
        - |
          Correct. 12 protons identify magnesium; 12 − 10 = +2, so Y is Mg²⁺.
      answer: 3

    - slug: chem-u02-w04-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        | Particle | Protons | Neutrons | Electrons |
        |---|---|---|---|
        | W | 11 | 12 | 11 |
        | X | 11 | 13 | 11 |
        | Y | 12 | 12 | 10 |
        | Z | 17 | 18 | 18 |
      prompt: |
        What is the mass number of particle Z, and what is its symbol?
      options:
        - "35, Cl⁻"
        - "36, Cl⁻"
        - "35, Ar"
        - "17, Cl"
      option_explanations:
        - |
          Correct. A = 17 + 18 = 35; 17 protons is chlorine; 18 electrons give a 1− charge, so Z is ³⁵Cl⁻.
        - |
          The mass number counts protons and neutrons only; electrons add nothing to it.
        - |
          Seventeen protons is chlorine; argon would need 18 protons.
        - |
          17 is the atomic number; the mass number adds the 18 neutrons.
      answer: 0

    # ---- Multiple choice (2.1)
    - slug: chem-u02-w04-q04
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        In the gold foil experiment, which observation led Rutherford to propose a small, dense, positive nucleus?
      options:
        - "Most alpha particles passed straight through the foil"
        - "The foil glowed when struck"
        - "A small fraction of alpha particles were deflected back toward the source"
        - "The alpha particles were absorbed by the gold"
      option_explanations:
        - |
          Straight passage was expected under the plum pudding model and showed only that the atom is mostly empty.
        - |
          The detection screen flashed where particles struck it; the foil itself did not glow and that was not the evidence.
        - |
          Correct. Only a concentrated positive charge with most of the atom's mass could turn a heavy, fast alpha particle around.
        - |
          The particles were not absorbed; nearly all went through, which is why the few that bounced were so striking.
      answer: 2

    - slug: chem-u02-w04-q05
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Thomson found that cathode rays had the same charge-to-mass ratio no matter which metal the cathode was made of. What did this show?
      options:
        - "That the particles in the beam are a component of every kind of atom"
        - "That all metals have the same density"
        - "That the beam was made of positive ions"
        - "That atoms are indivisible"
      option_explanations:
        - |
          Correct. Identical particles from every element meant the electron is a universal building block of atoms.
        - |
          The experiment measured the beam's particles, not the bulk properties of the metals.
        - |
          The beam bent toward a positive plate, so it was negative.
        - |
          Finding a particle smaller than any atom showed atoms have parts, the opposite of indivisible.
      answer: 0

    - slug: chem-u02-w04-q06
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A gold coin has a mass of 31.1 g and a volume of 1.61 cm³. Using the reference density of gold, 19.3 g/cm³, which conclusion is justified?
      options:
        - "The coin is pure gold, because its density is 19.3 g/cm³"
        - "The coin cannot be pure gold, because its density is about 50 g/cm³"
        - "The coin is probably not pure gold, because its density is about 19.3 g/cm³"
        - "The coin is probably gold, because 31.1 ÷ 1.61 = 19.3 g/cm³ matches the reference value"
      option_explanations:
        - |
          The density matches, but a matching density alone cannot prove purity; "probably" is the strongest justified claim.
        - |
          31.1 ÷ 1.61 is 19.3, not 50; the arithmetic is wrong.
        - |
          A density that matches gold supports, rather than argues against, the coin being gold.
        - |
          Correct. Mass ÷ volume = 19.3 g/cm³, matching gold; the measurement supports, without proving, that the coin is gold.
      answer: 3

    - slug: chem-u02-w04-q07
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Sulfur forms two oxides. In one, 1.00 g of sulfur combines with 1.00 g of oxygen; in the other, 1.00 g of sulfur combines with 1.50 g of oxygen. Which law does this illustrate, and what is the ratio of oxygen masses?
      options:
        - "Multiple proportions; 2:3"
        - "Definite proportions; 1:1"
        - "Conservation of mass; 1:1.5"
        - "Multiple proportions; 1:3"
      option_explanations:
        - |
          Correct. Two compounds of the same elements with oxygen masses 1.00:1.50 = 2:3, a small whole-number ratio (SO₂ and SO₃).
        - |
          Definite proportions concerns one compound; here two different compounds are compared.
        - |
          Conservation of mass concerns reactants and products in a reaction, not the composition of two compounds.
        - |
          1.00:1.50 simplifies to 2:3, not 1:3; a 1:3 ratio would need 3.00 g of oxygen in the second oxide.
      answer: 0

    - slug: chem-u02-w04-q08
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A 5.00 g sample of a white powder is heated in a sealed, rigid container. Afterwards the powder has turned grey and a gas is present, but the sealed container still has a mass of exactly what it had before. This is a direct demonstration of which law?
      options:
        - "The law of definite proportions"
        - "The law of multiple proportions"
        - "The law of conservation of mass"
        - "Dalton's law of partial pressures"
      option_explanations:
        - |
          Definite proportions concerns the fixed composition of a compound, not the mass before and after a change.
        - |
          Multiple proportions compares two compounds of the same elements.
        - |
          Correct. The products (grey solid and gas) have the same total mass as the reactant because atoms were only rearranged.
        - |
          Dalton's gas law concerns pressures of gas mixtures and is unrelated to mass.
      answer: 2

    # ---- Multiple choice (2.2)
    - slug: chem-u02-w04-q10
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Solid iodine left in a warm, closed jar produces a purple vapour, and purple-black crystals later form on the cool lid. Which two phase changes have occurred, in order?
      options:
        - "Melting, then freezing"
        - "Sublimation, then deposition"
        - "Evaporation, then condensation"
        - "Sublimation, then condensation"
      option_explanations:
        - |
          No liquid iodine appears at any stage; the solid becomes gas directly.
        - |
          Correct. Solid going straight to gas is sublimation; gas forming crystals directly on the lid is deposition.
        - |
          Evaporation starts from a liquid and condensation produces one; iodine skipped the liquid state here.
        - |
          The first step is right, but gas becoming a solid is deposition, not condensation.
      answer: 1

    - slug: chem-u02-w04-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Why do carbon-12 and carbon-14 have the same chemical properties?
      options:
        - "They have the same number of neutrons"
        - "They have the same mass"
        - "They have the same number of electrons and protons"
        - "They are both radioactive"
      option_explanations:
        - |
          They have 6 and 8 neutrons respectively; the neutron count is what differs.
        - |
          Their masses differ by about two atomic mass units.
        - |
          Correct. Chemical behaviour is governed by the electrons, and both isotopes have 6 protons and 6 electrons.
        - |
          Carbon-12 is stable; only carbon-14 is radioactive, and radioactivity is a nuclear, not chemical, property.
      answer: 2

    - slug: chem-u02-w04-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Rutherford expected alpha particles to pass through the gold foil with only small deflections, yet some bounced back. In terms of the scientific method, what role did this result play?
      options:
        - "It confirmed the plum pudding hypothesis"
        - "It was an observation that contradicted the prediction, forcing a revised model"
        - "It proved that experiments cannot test hypotheses"
        - "It was an inference with no observational basis"
      option_explanations:
        - |
          The hypothesis predicted no back-scattering, so the result contradicted rather than confirmed it.
        - |
          Correct. A prediction failed; the model was revised to one with a nucleus that could explain the new observation.
        - |
          The episode is a textbook case of an experiment testing and overturning a hypothesis.
        - |
          The flashes on the detector screen were direct observations; the nucleus was the inference drawn from them.
      answer: 1

    # ---- Spiral review (Unit 1)
    - slug: chem-u02-w04-q13
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Carbon-12 and carbon-14 occur together in a lump of charcoal. Which statement correctly classifies the charcoal and its atoms?
      options:
        - "The charcoal is a compound of two elements"
        - "The charcoal is a homogeneous mixture of two compounds"
        - "Each isotope is a different element"
        - "The charcoal is a sample of one element, carbon, containing two isotopes"
      option_explanations:
        - |
          Both isotopes are carbon; a compound needs two different elements.
        - |
          There are no compounds in pure carbon; only one kind of atom is present.
        - |
          Elements are defined by proton number, which both isotopes share.
        - |
          Correct. Isotopes are atoms of the same element, so charcoal is one element whatever the isotope mix.
      answer: 3

    - slug: chem-u02-w04-q14
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student finds that 2.43 g of magnesium combines with 1.60 g of oxygen. What is the mass percent of magnesium in the product, reported to the correct number of significant figures?
      options:
        - "60.3%"
        - "60%"
        - "60.30%"
        - "66.0%"
      option_explanations:
        - |
          Correct. Total mass 4.03 g; 2.43 ÷ 4.03 × 100 = 60.3%, three significant figures.
        - |
          Both measurements have three significant figures, so the percent can be reported to three.
        - |
          Four figures claim more precision than the three-figure measurements support.
        - |
          66.0% comes from dividing magnesium by oxygen rather than by the total mass.
      answer: 0

    # ---- Multi-select
    - slug: chem-u02-w04-q15
      type: multi_select
      topic_code: "2.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are conclusions Rutherford drew from the gold foil experiment? Select all that apply.
      options:
        - "The atom is mostly empty space"
        - "Electrons are embedded in a sphere of positive charge"
        - "The positive charge is concentrated in a tiny nucleus"
        - "Nearly all of the atom's mass is in the nucleus"
        - "Electrons orbit in fixed energy levels"
      option_explanations:
        - |
          Correct. Most alpha particles passed through undeflected, so most of the atom offers nothing to collide with.
        - |
          That is Thomson's plum pudding model, which the experiment overturned.
        - |
          Correct. Only a concentrated positive charge could repel an alpha particle backwards.
        - |
          Correct. A light target could not turn a heavy alpha particle around; the nucleus must carry most of the mass.
        - |
          Fixed energy levels were Bohr's later addition, based on atomic spectra, not on the gold foil result.
      answer: [0, 2, 3]

    - slug: chem-u02-w04-q16
      type: multi_select
      topic_code: "2.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following statements about subatomic particles are correct? Select all that apply.
      options:
        - "A proton and a neutron have nearly the same mass"
        - "An electron has about the same mass as a proton"
        - "The nucleus contains protons and neutrons"
        - "The number of protons determines the element"
        - "Neutrons carry a negative charge"
      option_explanations:
        - |
          Correct. Each is about 1 u; the neutron is very slightly heavier.
        - |
          An electron's mass is about 1/1,836 of a proton's.
        - |
          Correct. Both nucleons sit in the nucleus; electrons occupy the space around it.
        - |
          Correct. Atomic number, the proton count, identifies the element.
        - |
          Neutrons are neutral; electrons carry the negative charge.
      answer: [0, 2, 3]

    # ---- True / false
    - slug: chem-u02-w04-q17
      type: true_false
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The mass number of an element is the decimal value printed on the periodic table.
      answer: false
      explanation: |
        False. The periodic table shows the average atomic mass, a weighted average over the element's isotopes. The mass number is a whole number (protons plus neutrons) for one particular isotope.

    - slug: chem-u02-w04-q18
      type: true_false
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Magnesium burning in oxygen to form magnesium oxide is a chemical change in which mass is conserved.
      answer: true
      explanation: |
        True. A new substance, magnesium oxide, forms with new properties, so the change is chemical; the oxide's mass equals the magnesium plus the oxygen that reacted, as the law of conservation of mass requires.

    # ---- Fill in the blank
    - slug: chem-u02-w04-q19
      type: fill_blank
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The closeness of a measured value to the accepted or true value is called ____.
      answer: ["accuracy"]
      explanation: |
        Accuracy is agreement with the true value; precision is agreement among repeated measurements. A miscalibrated balance can be precise without being accurate.

    - slug: chem-u02-w04-q20
      type: fill_blank
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Atoms with the same number of protons but different numbers of neutrons are called ____.
      answer: ["isotopes"]
      explanation: |
        Isotopes share an atomic number and therefore an element and chemistry, but differ in mass number. Carbon-12 and carbon-14 are isotopes of carbon.

    # ---- Numeric
    - slug: chem-u02-w04-q21
      type: numeric
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        When 10.0 g of calcium carbonate is heated strongly, it decomposes into 5.6 g of calcium oxide and carbon dioxide gas that escapes. What mass of carbon dioxide was released? Give your answer in grams to one decimal place.
      answer: { value: 4.4, tolerance: 0.1 }
      explanation: |
        Mass is conserved: 10.0 − 5.6 = 4.4 g of carbon dioxide left as gas. The "lost" mass is the gas, which is why an open container appears to lose mass.

    - slug: chem-u02-w04-q22
      type: numeric
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Magnesium oxide is always 60.3% magnesium by mass. What mass of magnesium is needed to make 45.0 g of magnesium oxide? Give your answer in grams to one decimal place.
      answer: { value: 27.1, tolerance: 0.1 }
      explanation: |
        By the law of definite proportions the ratio is fixed: 0.603 × 45.0 g = 27.1 g of magnesium. The remaining 17.9 g is oxygen.

    - slug: chem-u02-w04-q23
      type: numeric
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        An atom of silver-109 has atomic number 47. How many neutrons does it contain? Give a whole number.
      answer: { value: 62, tolerance: 0 }
      explanation: |
        Neutrons = mass number − atomic number = 109 − 47 = 62. Silver's other common isotope, silver-107, has 60 neutrons.

    # ---- Short answer
    - slug: chem-u02-w04-q24
      type: short_answer
      topic_code: "2.2"
      source: "general knowledge"
      points: 3
      prompt: |
        Consider the three particles ³⁹K, ⁴⁰K and ⁴⁰Ca²⁺ (potassium Z = 19, calcium Z = 20).

        (a) Give the number of protons, neutrons and electrons in each.
        (b) Explain which two are isotopes of each other and why the third is not, even though it shares a mass number with one of them.
        (c) A ³⁹K⁺ ion and a ⁴⁰Ca²⁺ ion both have 18 electrons. Explain why they are nevertheless different elements.
      answer: |
        (a) ³⁹K: 19 p, 20 n, 19 e. ⁴⁰K: 19 p, 21 n, 19 e. ⁴⁰Ca²⁺: 20 p, 20 n, 18 e.
        (b) ³⁹K and ⁴⁰K are isotopes: same number of protons (19), different neutrons (20 and 21). ⁴⁰Ca has 20 protons, so it is a different element; a shared mass number does not make atoms isotopes.
        (c) The identity of an atom or ion is fixed by its number of protons, not its electrons. K⁺ has 19 protons and Ca²⁺ has 20, so they are potassium and calcium even though each has lost enough electrons to be left with 18.
      explanation: |
        Three points, one per part.

        (a) 1 pt: all nine counts correct (19/20/19, 19/21/19, 20/20/18).

        (b) 1 pt: the potassium pair identified as isotopes with the proton-count reasoning, and calcium excluded because its proton count differs.

        (c) 1 pt: element identity depends on proton number (19 versus 20), not on electron count.

    - slug: chem-u02-w04-q25
      type: short_answer
      topic_code: "2.1"
      source: "general knowledge"
      points: 3
      stimulus: |
        | Trial | Mass of copper (g) | Mass of sulfur reacted (g) | Mass of copper sulfide formed (g) |
        |---|---|---|---|
        | 1 | 2.54 | 0.64 | 3.18 |
        | 2 | 5.08 | 1.28 | 6.36 |
        | 3 | 7.62 | 1.92 | 9.54 |
      prompt: |
        Using the table, answer (a), (b) and (c).

        (a) Show that the data are consistent with the law of conservation of mass.
        (b) Calculate the mass percent of copper in the product for each trial and state which law the result illustrates.
        (c) Predict the mass of sulfur that would react completely with 12.70 g of copper, and the mass of product.
      answer: |
        (a) In each trial copper plus sulfur equals the product: 2.54 + 0.64 = 3.18; 5.08 + 1.28 = 6.36; 7.62 + 1.92 = 9.54. No mass is gained or lost.
        (b) 2.54 ÷ 3.18 × 100 = 79.9%; 5.08 ÷ 6.36 × 100 = 79.9%; 7.62 ÷ 9.54 × 100 = 79.9%. The constant composition illustrates the law of definite proportions.
        (c) The ratio of sulfur to copper is 0.64 ÷ 2.54 = 0.252, so 12.70 g Cu × 0.252 = 3.20 g of sulfur; product = 12.70 + 3.20 = 15.90 g.
      explanation: |
        Three points, one per part.

        (a) 1 pt: shows reactant masses sum to product mass in at least two trials.

        (b) 1 pt: 79.9% in each trial and the law of definite proportions named.

        (c) 1 pt: 3.20 g of sulfur (accept 3.2) and 15.90 g of product (accept 15.9), by ratio or scaling.

    # ---- Long answer
    - slug: chem-u02-w04-q26
      type: long_answer
      topic_code: "2.1"
      source: "general knowledge"
      points: 6
      prompt: |
        Trace the development of the model of the atom from Dalton to Rutherford. For each of Dalton, Thomson and Rutherford, describe the evidence available, the model proposed, and what the next experiment revealed that the model could not explain. Then explain which parts of Dalton's theory survive in the modern model and how the discovery of isotopes and of subatomic particles changed it.
      answer: |
        Dalton (1808) built on the laws of conservation of mass and definite proportions. His model: indivisible atoms, identical within an element, combining in whole-number ratios and rearranged but not changed in reactions. It explained both laws and predicted multiple proportions. It could not explain electrical phenomena such as cathode rays, which showed that something smaller than an atom could be pulled out of it.

        Thomson (1897) used cathode ray tubes. The rays bent toward a positive plate and had the same charge-to-mass ratio, about 1,800 times a hydrogen ion's, regardless of cathode metal. His model: the plum pudding, a sphere of positive charge with electrons embedded in it, so that atoms are neutral and divisible. It could not explain the gold foil result.

        Rutherford (1911) interpreted Geiger and Marsden's experiment: most alpha particles passed through gold foil, but about one in 8,000 bounced back. A diffuse positive sphere could never do that. His model: a tiny, dense, positive nucleus holding nearly all the mass, surrounded by mostly empty space containing the electrons. It did not explain why electrons do not spiral into the nucleus or why atoms emit light at specific colours, which led to Bohr's energy levels.

        Of Dalton's theory, the claims that atoms of different elements differ, that compounds combine atoms in whole-number ratios and that reactions rearrange atoms survive. Subatomic particles showed atoms are divisible; isotopes showed atoms of one element can differ in mass while sharing the proton count that defines the element.
      explanation: |
        Six points.

        1 pt: Dalton's evidence (mass laws) and model (indivisible, identical atoms in whole-number ratios).

        1 pt: Thomson's evidence (cathode rays: negative, universal, very light) and plum pudding model.

        1 pt: Rutherford's evidence (most alpha particles pass, a few bounce back) and nuclear model.

        1 pt: each model's limitation named: Dalton could not account for electrons; plum pudding could not explain back-scattering; the nuclear model left electron behaviour and spectra unexplained.

        1 pt: the surviving parts of Dalton's theory identified correctly.

        1 pt: isotopes and subatomic particles described as the two revisions, with the element defined by proton number.
