week: 6
unit: 2
title: "Light, Energy Levels and Electron Configurations"
topics: ["2.5", "2.6"]
guide: guides/week-06.md
guide_description: |
  Light as waves (c = λf) and photons (E = hf), the electromagnetic spectrum ranked by energy, why elements give
  line spectra, and Bohr's energy levels for hydrogen. Then the quantum model: levels, sublevels, orbitals and
  their capacities, and the Aufbau, Pauli and Hund rules for writing full and noble-gas electron configurations,
  orbital diagrams, valence electrons and ion configurations. Worked examples on a photon calculation, hydrogen
  transitions, chlorine's configuration and identifying an element from its configuration.
flashcards_description: |
  30 cards on wavelength, frequency and photon energy, line spectra and the Bohr model, levels, sublevels and
  orbitals, the three filling rules, configurations of common elements and ions, and valence electrons.

flashcards:
  - front: Wavelength and frequency of light → the relation and the constant
    back: |
      c = λf, with c = 2.998 × 10⁸ m/s. Long wavelength means low frequency and vice versa. Convert nanometres to metres (1 nm = 10⁻⁹ m) before using the formula.
    topic_code: "2.5"
  - front: Photon energy → formula and Planck's constant
    back: |
      E = hf, with h = 6.626 × 10⁻³⁴ J·s; equivalently E = hc/λ. High frequency (short wavelength) means high photon energy.
    topic_code: "2.5"
  - front: Electromagnetic spectrum → regions ranked from lowest to highest energy
    back: |
      Radio, microwave, infrared, visible (red through violet), ultraviolet, X-ray, gamma. Visible light runs from about 700 nm (red) to 400 nm (violet).
    topic_code: "2.5"
  - front: 500 nm green light → frequency and photon energy
    back: |
      f = c/λ = 2.998 × 10⁸ ÷ 5.00 × 10⁻⁷ = 6.00 × 10¹⁴ Hz. E = hf = 6.626 × 10⁻³⁴ × 6.00 × 10¹⁴ = 3.97 × 10⁻¹⁹ J.
    topic_code: "2.5"
  - front: Why ultraviolet burns skin and radio waves do not → photon energy
    back: |
      Ultraviolet photons have high frequency and so enough energy (E = hf) to break chemical bonds in skin cells; radio photons carry millions of times less energy each.
    topic_code: "2.5"
  - front: Continuous spectrum versus line spectrum → sources of each
    back: |
      A hot solid or the Sun gives a continuous rainbow. A glowing gas of one element gives only certain wavelengths, a line spectrum unique to that element.
    topic_code: "2.5"
  - front: Line spectrum → what each line represents
    back: |
      One electron transition: an electron dropping from a higher fixed energy level to a lower one, emitting a photon whose energy equals the gap between the levels.
    topic_code: "2.5"
  - front: Bohr model → its central claim about electron energy
    back: |
      Electrons can occupy only certain orbits with fixed energies (n = 1, 2, 3 …). An atom absorbs or emits energy only in amounts equal to the difference between two levels, which is why spectra are lines.
    topic_code: "2.5"
  - front: Ground state versus excited state → definitions
    back: |
      The ground state is the lowest-energy arrangement of the electrons. An excited state is any higher one, reached by absorbing energy; the atom returns to the ground state by emitting light.
    topic_code: "2.5"
  - front: Absorption versus emission → which direction the electron moves
    back: |
      Absorption: the electron jumps up to a higher level, taking in a photon. Emission: the electron falls to a lower level, giving out a photon. Light is emitted only on the way down.
    topic_code: "2.5"
  - front: Hydrogen's four visible lines → the transitions and colours
    back: |
      Drops to n = 2 from n = 3 (656 nm, red), 4 (486 nm, blue-green), 5 (434 nm, violet) and 6 (410 nm, violet). Drops to n = 1 are ultraviolet; drops to n = 3 are infrared.
    topic_code: "2.5"
  - front: Spacing of energy levels → why 4→2 light is more energetic than 3→2
    back: |
      Levels get closer together as n rises, but the gap from 4 to 2 is still larger than from 3 to 2, so the 4→2 photon has more energy and a shorter wavelength (486 nm versus 656 nm).
    topic_code: "2.5"
  - front: Why neon signs are red-orange and sodium lamps yellow → spectra
    back: |
      Each element's electrons have their own set of energy levels, so each emits its own line spectrum. The strongest visible lines of neon are red-orange; sodium's are yellow at about 589 nm.
    topic_code: "2.5"
  - front: Limits of the Bohr model → what the quantum model changed
    back: |
      Bohr's orbits worked only for hydrogen. The quantum model keeps fixed energy levels but replaces orbits with orbitals, regions where an electron is likely to be found.
    topic_code: "2.5"
  - front: Orbital → definition and capacity
    back: |
      A region of space where an electron is likely to be found. Each orbital holds at most two electrons, which must have opposite spins (Pauli exclusion principle).
    topic_code: "2.6"
  - front: Sublevels s, p, d, f → number of orbitals and electrons in each
    back: |
      s: 1 orbital, 2 electrons. p: 3 orbitals, 6 electrons. d: 5 orbitals, 10 electrons. f: 7 orbitals, 14 electrons.
    topic_code: "2.6"
  - front: Maximum electrons in energy level n → formula and values
    back: |
      2n²: n = 1 holds 2, n = 2 holds 8, n = 3 holds 18, n = 4 holds 32. Level n contains n sublevels (n = 3 has 3s, 3p and 3d).
    topic_code: "2.6"
  - front: Shapes of s and p orbitals → description
    back: |
      An s orbital is a sphere centred on the nucleus. The three p orbitals are dumbbells pointing along the x, y and z axes. Higher-n orbitals of the same type are larger.
    topic_code: "2.6"
  - front: Aufbau principle → statement and the filling order through 4p
    back: |
      Fill orbitals from lowest energy upward: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p. Note that 4s fills before 3d.
    topic_code: "2.6"
  - front: Pauli exclusion principle → statement
    back: |
      An orbital holds at most two electrons, and those two must have opposite spins, drawn as ↑ and ↓ in one box.
    topic_code: "2.6"
  - front: Hund's rule → statement and the nitrogen example
    back: |
      Within a sublevel, place one electron in each orbital with parallel spins before pairing any. Nitrogen's 2p³ is [↑ ][↑ ][↑ ], three unpaired electrons, not [↑↓][↑ ][ ].
    topic_code: "2.6"
  - front: Electron configuration of sulfur (16) → full and shorthand
    back: |
      1s² 2s² 2p⁶ 3s² 3p⁴, or [Ne] 3s² 3p⁴. Six valence electrons; the 3p boxes [↑↓][↑ ][↑ ] show two unpaired electrons.
    topic_code: "2.6"
  - front: Electron configuration of iron (26) → shorthand and the 4s/3d order
    back: |
      [Ar] 4s² 3d⁶. The 4s sublevel fills before 3d, so after argon's 18 come two 4s electrons and then six 3d electrons.
    topic_code: "2.6"
  - front: Noble-gas (shorthand) notation → how to write it
    back: |
      Put the previous noble gas in brackets for the filled core, then write only the sublevels after it. Chlorine: [Ne] 3s² 3p⁵. Bromine: [Ar] 4s² 3d¹⁰ 4p⁵.
    topic_code: "2.6"
  - front: Identifying an element from a configuration → the method
    back: |
      Add all the superscripts (and the noble gas's electron count); the total is the atomic number. [Ar] 4s² 3d¹⁰ 4p³ gives 18 + 15 = 33, arsenic.
    topic_code: "2.6"
  - front: Valence electrons → definition and how to count them
    back: |
      Electrons in the highest occupied energy level n (for main-group elements, the outer s and p). Sulfur 3s² 3p⁴ has 6; bromine 4s² 4p⁵ has 7 (the filled 3d is not counted); calcium 4s² has 2.
    topic_code: "2.6"
  - front: Unpaired electrons → how to count from an orbital diagram
    back: |
      Fill the sublevel's boxes by Hund's rule and count boxes with a single arrow. Phosphorus 3p³: three unpaired. Oxygen 2p⁴: two unpaired. Chlorine 3p⁵: one.
    topic_code: "2.6"
  - front: Configuration of a cation (Mg²⁺, Fe²⁺) → which electrons leave
    back: |
      Electrons leave from the highest n first. Mg²⁺: 1s² 2s² 2p⁶ (like neon). Fe²⁺ loses the two 4s electrons: [Ar] 3d⁶.
    topic_code: "2.6"
  - front: Configuration of an anion (Cl⁻, O²⁻) → where electrons go
    back: |
      Added electrons fill the next open orbitals. Cl⁻: [Ne] 3s² 3p⁶, the same as argon. O²⁻: 1s² 2s² 2p⁶, the same as neon.
    topic_code: "2.6"
  - front: Orbital diagram → how to draw one in text
    back: |
      One box per orbital, arrows for electrons: nitrogen is 1s [↑↓] 2s [↑↓] 2p [↑ ][↑ ][↑ ]. Paired electrons point opposite ways; unpaired ones point the same way.
    topic_code: "2.6"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 2.5 and 2.6: light, the Bohr model and electron
    configurations), with about a third reviewing earlier weeks (isotopes, average atomic mass, nuclear decay,
    energy and significant figures). Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set: hydrogen energy-level diagram (2.5)
    - slug: chem-u02-w06-q01
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Figure description: An energy-level diagram for hydrogen shows horizontal lines labelled n = 1 (lowest), n = 2, n = 3, n = 4 and n = 5, with the spacing between lines shrinking as n increases. Four downward arrows are drawn: A from n = 3 to n = 2, B from n = 4 to n = 2, C from n = 5 to n = 2, and D from n = 2 to n = 1.
      prompt: |
        Which arrow represents the emission of the photon with the longest wavelength?
      options:
        - "Arrow A"
        - "Arrow B"
        - "Arrow C"
        - "Arrow D"
      option_explanations:
        - |
          Correct. The 3 → 2 transition spans the smallest energy gap of the four, so its photon has the least energy and the longest wavelength (656 nm, red).
        - |
          The 4 → 2 gap is larger than 3 → 2, so its photon is more energetic and shorter in wavelength (486 nm).
        - |
          The 5 → 2 gap is larger still, giving violet light at 434 nm.
        - |
          The 2 → 1 gap is the largest on the diagram; that photon is in the ultraviolet, the shortest wavelength shown.
      answer: 0

    - slug: chem-u02-w06-q02
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Figure description: An energy-level diagram for hydrogen shows horizontal lines labelled n = 1 (lowest), n = 2, n = 3, n = 4 and n = 5, with the spacing between lines shrinking as n increases. Four downward arrows are drawn: A from n = 3 to n = 2, B from n = 4 to n = 2, C from n = 5 to n = 2, and D from n = 2 to n = 1.
      prompt: |
        What must happen before an atom can emit the photon shown by arrow B?
      options:
        - "The atom must lose an electron entirely"
        - "The electron must first absorb enough energy to reach n = 4"
        - "The electron must emit a photon from n = 2 to n = 1"
        - "The nucleus must undergo beta decay"
      option_explanations:
        - |
          Losing the electron would ionise the atom; arrow B is a transition within the atom.
        - |
          Correct. Emission happens only on the way down; the electron has to be excited to n = 4 first, by heat, electricity or absorbing a photon.
        - |
          A 2 → 1 emission would leave the electron in the ground state, not at n = 4.
        - |
          Light emission here involves electrons changing levels; the nucleus is not involved.
      answer: 1

    - slug: chem-u02-w06-q03
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Figure description: An energy-level diagram for hydrogen shows horizontal lines labelled n = 1 (lowest), n = 2, n = 3, n = 4 and n = 5, with the spacing between lines shrinking as n increases. Four downward arrows are drawn: A from n = 3 to n = 2, B from n = 4 to n = 2, C from n = 5 to n = 2, and D from n = 2 to n = 1.
      prompt: |
        The diagram explains why hydrogen produces a line spectrum rather than a continuous one. Which statement gives the reason?
      options:
        - "Hydrogen has only one electron, so it can emit only one colour"
        - "The electron moves continuously, so every wavelength is possible"
        - "Only certain energy levels exist, so only photons matching the gaps between them can be emitted"
        - "The nucleus absorbs most wavelengths before they leave the atom"
      option_explanations:
        - |
          A single electron can make many different transitions, giving several lines, not one.
        - |
          If every energy were allowed, the spectrum would be continuous; the lines show the opposite.
        - |
          Correct. Fixed levels mean fixed energy differences, so the emitted photons take only certain energies and wavelengths.
        - |
          The nucleus does not filter light; the restriction comes from the allowed electron energies.
      answer: 2

    # ---- Multiple choice (2.5)
    - slug: chem-u02-w06-q04
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which type of electromagnetic radiation has photons of the highest energy?
      options:
        - "Infrared"
        - "Red light"
        - "Microwaves"
        - "Ultraviolet"
      option_explanations:
        - |
          Infrared has a longer wavelength than visible light and so lower-energy photons.
        - |
          Red is the lowest-energy visible colour; its wavelength is about 700 nm.
        - |
          Microwaves are longer still than infrared and carry much less energy per photon.
        - |
          Correct. Ultraviolet has a shorter wavelength than violet light, so by E = hc/λ its photons carry the most energy of the four.
      answer: 3

    - slug: chem-u02-w06-q05
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A yellow sodium streetlight emits light at 589 nm. Which calculation gives its frequency?
      options:
        - "2.998 × 10⁸ m/s ÷ 5.89 × 10⁻⁷ m"
        - "2.998 × 10⁸ m/s × 589 m"
        - "6.626 × 10⁻³⁴ J·s ÷ 5.89 × 10⁻⁷ m"
        - "2.998 × 10⁸ m/s ÷ 589 m"
      option_explanations:
        - |
          Correct. f = c/λ with the wavelength converted to metres: 589 nm = 5.89 × 10⁻⁷ m, giving 5.09 × 10¹⁴ Hz.
        - |
          Frequency is c divided by λ, not multiplied, and the wavelength must be in metres, not a bare 589.
        - |
          Planck's constant belongs in the energy formula E = hf; it does not give frequency from wavelength.
        - |
          The wavelength was left as 589 rather than converted from nanometres to metres.
      answer: 0

    # ---- Multiple choice (2.6)
    - slug: chem-u02-w06-q06
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the ground-state electron configuration of phosphorus (Z = 15)?
      options:
        - "1s² 2s² 2p⁶ 3s² 3p³"
        - "1s² 2s² 2p⁶ 3p⁵"
        - "1s² 2s² 2p⁹ 3s²"
        - "1s² 2s² 2p⁶ 3s² 3d³"
      option_explanations:
        - |
          Correct. Fifteen electrons fill 1s, 2s, 2p and 3s (12) and the remaining three enter 3p.
        - |
          The 3s sublevel must fill before 3p; skipping it violates the Aufbau principle.
        - |
          A p sublevel has three orbitals and holds at most six electrons; 2p⁹ is impossible.
        - |
          The 3p sublevel is lower in energy than 3d and fills first; 3d does not begin until after 4s.
      answer: 0

    - slug: chem-u02-w06-q07
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which orbital diagram for the 2p sublevel of oxygen (2p⁴) obeys Hund's rule and the Pauli principle?
      options:
        - "[↑↓][↑↓][  ]"
        - "[↑↓][↑ ][↑ ]"
        - "[↑↑][↑ ][↑ ]"
        - "[↑ ][↑ ][↑ ][↑ ]"
      option_explanations:
        - |
          Pairing two orbitals while a third is empty violates Hund's rule, which spreads electrons out before pairing.
        - |
          Correct. Three electrons go one per orbital with parallel spins, and the fourth pairs with opposite spin in the first.
        - |
          Two electrons with the same spin in one orbital violate the Pauli exclusion principle.
        - |
          A p sublevel has only three orbitals; four boxes do not exist.
      answer: 1

    - slug: chem-u02-w06-q08
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        An element has the shorthand configuration [Ar] 4s² 3d¹⁰ 4p². What is it, and how many valence electrons does it have?
      options:
        - "Silicon; 4 valence electrons"
        - "Germanium; 14 valence electrons"
        - "Germanium; 4 valence electrons"
        - "Titanium; 2 valence electrons"
      option_explanations:
        - |
          Silicon has 14 electrons and ends in 3s² 3p²; this configuration has 18 + 14 = 32 electrons.
        - |
          The element is right, but filled d electrons are not valence electrons for a main-group element.
        - |
          Correct. 18 + 2 + 10 + 2 = 32, germanium; the valence electrons are those in n = 4: 4s² 4p², four in all.
        - |
          Titanium (22) is [Ar] 4s² 3d², with no 4p electrons.
      answer: 2

    - slug: chem-u02-w06-q09
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        How many electrons can the third energy level (n = 3) hold in total?
      options:
        - "8"
        - "18"
        - "10"
        - "32"
      option_explanations:
        - |
          Eight is the capacity of n = 2 (2s and 2p); the third level also has a 3d sublevel.
        - |
          Correct. 2n² = 2 × 9 = 18: 3s holds 2, 3p holds 6 and 3d holds 10.
        - |
          Ten is the capacity of the 3d sublevel alone.
        - |
          Thirty-two is the capacity of n = 4, which adds a 4f sublevel.
      answer: 1

    # ---- Spiral review
    - slug: chem-u02-w06-q10
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The electron configuration of a neutral atom ends in 3s² 3p⁵, and its nucleus contains 20 neutrons. Which isotope is it?
      options:
        - "Argon-38"
        - "Chlorine-35"
        - "Sulfur-36"
        - "Chlorine-37"
      option_explanations:
        - |
          Argon has 18 electrons and ends in 3p⁶; this atom has 17.
        - |
          Chlorine-35 has 35 − 17 = 18 neutrons, not 20.
        - |
          Sulfur has 16 electrons and ends in 3p⁴.
        - |
          Correct. 2 + 2 + 6 + 2 + 5 = 17 electrons, so 17 protons: chlorine; 17 + 20 = 37, chlorine-37.
      answer: 3

    - slug: chem-u02-w06-q11
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Cobalt-60 emits beta particles and gamma rays. Which statement correctly compares these to the light emitted by an excited atom?
      options:
        - "All three come from electrons changing energy levels"
        - "Gamma rays and visible light are both electromagnetic radiation, but gamma rays come from the nucleus and carry far more energy"
        - "Beta particles are photons of very high frequency"
        - "Visible light comes from the nucleus, gamma rays from the electrons"
      option_explanations:
        - |
          Beta and gamma emission are nuclear processes; only the visible light comes from electron transitions.
        - |
          Correct. Both are photons, but nuclear energy gaps are millions of times larger than electron-level gaps, so gamma photons are far more energetic.
        - |
          A beta particle is an electron ejected from the nucleus, a particle with mass and charge, not a photon.
        - |
          The roles are reversed: electrons produce visible light; the nucleus produces gamma rays.
      answer: 1

    - slug: chem-u02-w06-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student computes a frequency as 2.998 × 10⁸ m/s ÷ 6.5 × 10⁻⁷ m and gets 4.6123 × 10¹⁴ Hz on the calculator. The wavelength was measured as 650 nm to two significant figures. How should the frequency be reported?
      options:
        - "4.6123 × 10¹⁴ Hz"
        - "4.612 × 10¹⁴ Hz"
        - "4.61 × 10¹⁴ Hz"
        - "4.6 × 10¹⁴ Hz"
      option_explanations:
        - |
          Five significant figures far exceed the two provided by the wavelength.
        - |
          Four figures still claim more than a two-figure measurement supports.
        - |
          Three figures would need a wavelength known to three figures, such as 650. nm with a decimal point.
        - |
          Correct. Division keeps the fewest significant figures of the data; 6.5 × 10⁻⁷ m has two, so the frequency is 4.6 × 10¹⁴ Hz.
      answer: 3

    - slug: chem-u02-w06-q13
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        When a hydrogen atom emits a 656 nm photon, its electron drops from n = 3 to n = 2. In energy terms, what has happened to the atom?
      options:
        - "Its kinetic energy has increased by the photon's energy"
        - "Its temperature has risen"
        - "Its potential energy has decreased by exactly the photon's energy, which left as light"
        - "Energy was destroyed when the electron fell"
      option_explanations:
        - |
          The photon carries energy away; the atom's energy goes down, not up.
        - |
          Temperature describes the average motion of many particles; one atom's internal electron change is not a temperature change.
        - |
          Correct. The electron's energy in the atom is potential energy of its arrangement; the drop releases the difference as a photon, conserving energy.
        - |
          Energy is conserved: the atom's loss equals the photon's energy.
      answer: 2

    # ---- Multi-select
    - slug: chem-u02-w06-q14
      type: multi_select
      topic_code: "2.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following electron configurations represent atoms in their ground state? Select all that apply.
      options:
        - "1s² 2s² 2p⁶ 3s¹ (sodium)"
        - "1s² 2s² 2p⁵ 3s² (magnesium)"
        - "[Ar] 4s² 3d⁶ (iron)"
        - "[Ne] 3s² 3p⁶ (argon)"
        - "1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹ (potassium)"
      option_explanations:
        - |
          Correct. Eleven electrons fill 1s, 2s, 2p and one goes into 3s, exactly as the Aufbau order requires.
        - |
          The 2p sublevel must be full (six) before 3s takes any electrons; this is an excited arrangement.
        - |
          Correct. After argon, 4s fills before 3d, giving 4s² 3d⁶ for iron's 26 electrons.
        - |
          Correct. Argon's 18 electrons fill 3s and 3p completely.
        - |
          Potassium's nineteenth electron goes into 4s, which is lower in energy than 3d; this is not the ground state.
      answer: [0, 2, 3]

    - slug: chem-u02-w06-q15
      type: multi_select
      topic_code: "2.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following statements about light are correct? Select all that apply.
      options:
        - "Wavelength and frequency are inversely related"
        - "A photon's energy is proportional to its frequency"
        - "Violet light has a longer wavelength than red light"
        - "All electromagnetic waves travel at the same speed in a vacuum"
        - "Infrared photons carry more energy than X-ray photons"
      option_explanations:
        - |
          Correct. Since c = λf and c is constant, a longer wavelength means a lower frequency.
        - |
          Correct. E = hf: doubling the frequency doubles the photon energy.
        - |
          Violet is about 400 nm and red about 700 nm; violet is shorter.
        - |
          Correct. Radio waves, visible light and gamma rays all move at 2.998 × 10⁸ m/s in a vacuum.
        - |
          X-rays have far shorter wavelengths and higher frequencies, so their photons are far more energetic.
      answer: [0, 1, 3]

    # ---- True / false
    - slug: chem-u02-w06-q16
      type: true_false
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In a multi-electron atom the 4s sublevel fills before the 3d sublevel.
      answer: true
      explanation: |
        True. The 4s orbital is slightly lower in energy than 3d for atoms being filled, so potassium and calcium put electrons into 4s before the 3d sublevel begins with scandium. This is why iron is [Ar] 4s² 3d⁶.

    - slug: chem-u02-w06-q17
      type: true_false
      topic_code: "2.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Because the average atomic mass of carbon is 12.01 u, most carbon atoms have a mass slightly above 12 u.
      answer: false
      explanation: |
        False. Almost all carbon atoms are carbon-12 with a mass of exactly 12 u; the average is pushed slightly above 12 by the roughly 1% of atoms that are carbon-13 (13.003 u). An average does not describe the typical atom's exact mass.

    # ---- Fill in the blank
    - slug: chem-u02-w06-q18
      type: fill_blank
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The rule stating that electrons occupy orbitals of a sublevel singly, with parallel spins, before any orbital receives a second electron is ____ rule.
      answer: ["Hund's", "Hund's rule", "Hund", "Hunds"]
      explanation: |
        Hund's rule gives nitrogen three unpaired 2p electrons and oxygen two. The Pauli principle limits each orbital to two electrons of opposite spin; the Aufbau principle sets the filling order.

    - slug: chem-u02-w06-q19
      type: fill_blank
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The scientist whose cathode-ray experiments showed that every atom contains electrons was J. J. ____.
      answer: ["Thomson"]
      explanation: |
        Thomson (1897) found that cathode rays are negative particles far lighter than any atom and identical whatever the cathode metal, and proposed the plum pudding model.

