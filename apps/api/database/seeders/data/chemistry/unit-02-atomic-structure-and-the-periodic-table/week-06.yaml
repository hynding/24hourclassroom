    # ---- Short answer
    - slug: chem-u02-w06-q23
      type: short_answer
      topic_code: "2.6"
      source: "general knowledge"
      points: 3
      prompt: |
        Consider the elements nitrogen (Z = 7), chlorine (Z = 17) and iron (Z = 26).

        (a) Write the full electron configuration of nitrogen and the noble-gas configurations of chlorine and iron.
        (b) Draw (in text) the orbital diagram for the outermost p sublevel of nitrogen and of chlorine, and state how many unpaired electrons each atom has.
        (c) State the number of valence electrons in nitrogen and in chlorine, and explain why the two elements are in different columns of the periodic table.
      answer: |
        (a) Nitrogen: 1s² 2s² 2p³. Chlorine: [Ne] 3s² 3p⁵. Iron: [Ar] 4s² 3d⁶.
        (b) Nitrogen 2p: [↑ ][↑ ][↑ ], three unpaired electrons. Chlorine 3p: [↑↓][↑↓][↑ ], one unpaired electron.
        (c) Nitrogen has five valence electrons (2s² 2p³); chlorine has seven (3s² 3p⁵). Columns of the periodic table group elements with the same number of valence electrons, so nitrogen sits in group 15 and chlorine in group 17.
      explanation: |
        Three points, one per part.

        (a) 1 pt: all three configurations correct, including 4s² before 3d⁶ for iron.

        (b) 1 pt: both orbital diagrams obey Hund's rule, with unpaired counts of 3 and 1.

        (c) 1 pt: 5 and 7 valence electrons, linked to column placement by valence count.

    - slug: chem-u02-w06-q24
      type: short_answer
      topic_code: "2.5"
      source: "NIST CODATA constants (c and h, rounded)"
      points: 3
      stimulus: |
        | Element | Prominent emission line (nm) | Colour |
        |---|---|---|
        | Hydrogen | 656 | red |
        | Sodium | 589 | yellow |
        | Mercury | 436 | blue |
      prompt: |
        Using the table and c = 2.998 × 10⁸ m/s, h = 6.626 × 10⁻³⁴ J·s, answer (a), (b) and (c).

        (a) Calculate the frequency and photon energy of the mercury line.
        (b) Rank the three photons from lowest to highest energy and explain the basis for the ranking without calculating the other two.
        (c) Explain why each element has its own set of lines, and why a forensic scientist can identify an element from its spectrum.
      answer: |
        (a) λ = 4.36 × 10⁻⁷ m. f = 2.998 × 10⁸ ÷ 4.36 × 10⁻⁷ = 6.88 × 10¹⁴ Hz. E = 6.626 × 10⁻³⁴ × 6.88 × 10¹⁴ = 4.56 × 10⁻¹⁹ J.
        (b) Hydrogen (656 nm) < sodium (589 nm) < mercury (436 nm). Energy is inversely proportional to wavelength (E = hc/λ), so the shortest wavelength has the highest energy.
        (c) Each element's electrons have a unique set of allowed energy levels, so the energy differences, and the photon wavelengths emitted when electrons drop between them, are unique. Matching the pattern of lines to a reference identifies the element, like a fingerprint.
      explanation: |
        Three points, one per part.

        (a) 1 pt: frequency 6.88 × 10¹⁴ Hz and energy 4.56 × 10⁻¹⁹ J (accept rounding to 6.9 × 10¹⁴ and 4.6 × 10⁻¹⁹).

        (b) 1 pt: correct order with the inverse relation between wavelength and energy stated.

        (c) 1 pt: unique energy levels give unique line patterns, usable for identification.

    # ---- Long answer
    - slug: chem-u02-w06-q25
      type: long_answer
      topic_code: "2.6"
      source: "general knowledge"
      points: 6
      prompt: |
        Explain how the modern quantum model describes the arrangement of electrons in an atom and how that arrangement is written as an electron configuration.

        Your answer should: distinguish Bohr's orbits from orbitals; describe energy levels, sublevels (s, p, d, f) and the number of electrons each can hold; state the Aufbau principle, the Pauli exclusion principle and Hund's rule and show each in use; write the configuration and orbital diagram of sulfur (Z = 16); and explain what valence electrons are and why sulfur and oxygen behave similarly in chemical reactions.
      answer: |
        Bohr pictured electrons on fixed circular orbits with definite energies, which explained hydrogen's spectrum but failed for other atoms. The quantum model keeps the idea of fixed energy levels but replaces orbits with orbitals: three-dimensional regions where an electron is likely to be found. An s orbital is spherical; the three p orbitals are dumbbells along x, y and z.

        Energy levels are numbered n = 1, 2, 3 … and level n holds n sublevels. The sublevels s, p, d and f contain 1, 3, 5 and 7 orbitals and so hold 2, 6, 10 and 14 electrons; a level holds 2n² in total (2, 8, 18, 32).

        Three rules decide where electrons go. The Aufbau principle fills orbitals from lowest energy upward in the order 1s 2s 2p 3s 3p 4s 3d 4p. The Pauli exclusion principle allows at most two electrons per orbital, with opposite spins. Hund's rule puts one electron in each orbital of a sublevel, spins parallel, before any orbital gets a second.

        Sulfur has 16 electrons: 1s² 2s² 2p⁶ 3s² 3p⁴, or [Ne] 3s² 3p⁴. Orbital diagram: 1s [↑↓] 2s [↑↓] 2p [↑↓][↑↓][↑↓] 3s [↑↓] 3p [↑↓][↑ ][↑ ]. The Pauli principle shows in the paired boxes; Hund's rule in the two single 3p electrons; Aufbau in 3s filling before 3p.

        Valence electrons are those in the highest occupied level, here 3s² 3p⁴, six in all. Oxygen (1s² 2s² 2p⁴) also has six valence electrons, two of them unpaired, so both atoms tend to gain or share two electrons to reach eight. Same valence arrangement, same chemistry, which is why they share a column of the periodic table.
      explanation: |
        Six points.

        1 pt: orbits versus orbitals correctly distinguished, with orbitals as probability regions.

        1 pt: levels, sublevels and capacities stated (s 2, p 6, d 10, f 14; 2n² per level).

        1 pt: the three rules stated correctly.

        1 pt: sulfur's configuration 1s² 2s² 2p⁶ 3s² 3p⁴ with a correct orbital diagram showing two unpaired 3p electrons.

        1 pt: each rule illustrated in the sulfur example (filling order, paired spins, singly occupied orbitals).

        1 pt: valence electrons defined and the sulfur-oxygen similarity explained by matching valence configurations.
