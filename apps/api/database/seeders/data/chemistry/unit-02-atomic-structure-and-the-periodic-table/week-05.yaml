      prompt: |
        A piece of ancient wood contains one quarter of the carbon-14 found in living wood. Using a half-life of 5,730 years, how old is the wood? Give your answer in years as a whole number.
      answer: { value: 11460, tolerance: 20 }
      explanation: |
        One quarter remaining is (1/2)², two half-lives: 2 × 5,730 = 11,460 years. Carbon-14 stops being replenished when the tree dies, so the remaining fraction measures the time since.

    # ---- Short answer
    - slug: chem-u02-w05-q22
      type: short_answer
      topic_code: "2.3"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 3
      prompt: |
        Gallium has two naturally occurring isotopes: Ga-69 (68.926 u) and Ga-71 (70.925 u). Its average atomic mass is 69.72 u.

        (a) Without calculating, state which isotope is more abundant and explain how you can tell.
        (b) Calculate the percent abundance of each isotope. Show your setup.
        (c) Explain why a single gallium atom can never have a mass of 69.72 u.
      answer: |
        (a) Ga-69 is more abundant: the average (69.72) is much closer to 68.926 than to 70.925, and a weighted average is pulled toward the dominant isotope.
        (b) Let x = fraction of Ga-71. 68.926(1 − x) + 70.925x = 69.72. 68.926 + 1.999x = 69.72, so 1.999x = 0.794 and x = 0.397. Gallium is 39.7% Ga-71 and 60.3% Ga-69.
        (c) The average is a mean over many atoms of two different masses. Each atom is either Ga-69 (about 68.9 u) or Ga-71 (about 70.9 u); no atom has the in-between value.
      explanation: |
        Three points, one per part.

        (a) 1 pt: Ga-69, with the reasoning that the average lies nearer its mass.

        (b) 1 pt: a correct algebraic setup and abundances near 60% Ga-69 and 40% Ga-71 (accept 60.3/39.7 or 60/40).

        (c) 1 pt: the average is a weighted mean of two distinct masses, and no single atom has the mean value.

    - slug: chem-u02-w05-q23
      type: short_answer
      topic_code: "2.4"
      source: "general knowledge"
      points: 3
      stimulus: |
        | Isotope | Radiation emitted | Half-life |
        |---|---|---|
        | Radon-222 | alpha | 3.82 days |
        | Cobalt-60 | beta and gamma | 5.27 years |
        | Carbon-14 | beta | 5,730 years |
      prompt: |
        Using the table, answer (a), (b) and (c).

        (a) Write the nuclear equation for the decay of radon-222 (Z = 86) and identify the daughter nucleus.
        (b) Explain why radon gas in a basement is a health hazard even though alpha particles cannot penetrate skin.
        (c) A cobalt-60 source used in a hospital must be replaced when its activity falls below one eighth of its original value. How many years after installation is that?
      answer: |
        (a) Radon-222 → polonium-218 + helium-4. Mass numbers: 222 = 218 + 4; atomic numbers: 86 = 84 + 2. The daughter is polonium-218.
        (b) Radon is a gas that is inhaled. Inside the lungs there is no skin barrier, so the alpha particles from radon and its decay products deposit all their energy in lung tissue, damaging cells and DNA.
        (c) One eighth is (1/2)³, three half-lives: 3 × 5.27 = 15.8 years.
      explanation: |
        Three points, one per part.

        (a) 1 pt: polonium-218 plus helium-4, with mass and atomic numbers shown to balance.

        (b) 1 pt: inhalation puts the alpha emitter inside the body where no skin barrier protects tissue.

        (c) 1 pt: three half-lives, 15.8 years (accept 15.81 or 16).

    # ---- Long answer
    - slug: chem-u02-w05-q24
      type: long_answer
      topic_code: "2.4"
      source: "general knowledge"
      points: 6
      prompt: |
        A museum has acquired a wooden tool and wants to know its age. Explain how carbon-14 dating works and how the museum would interpret a measurement showing that the tool has 12.5% of the carbon-14 content of living wood.

        Your answer should: describe where carbon-14 comes from and why living things contain a steady amount; explain what happens after death; write the nuclear equation for carbon-14 decay; define half-life and use the 5,730-year half-life to calculate the age; and explain two limitations of the method (for example why it cannot date a 100-million-year-old fossil or a steel tool).
      answer: |
        Carbon-14 forms in the upper atmosphere when cosmic-ray neutrons strike nitrogen-14. It mixes into carbon dioxide, which plants take up by photosynthesis and animals take in by eating plants. Because intake balances decay, every living organism holds a steady, known proportion of carbon-14 to ordinary carbon-12.

        When an organism dies it stops taking in carbon. The carbon-14 already present decays by beta emission, carbon-14 → nitrogen-14 + an electron (mass numbers 14 = 14 + 0; atomic numbers 6 = 7 + (−1)), and is not replaced, so the ratio of carbon-14 to carbon-12 falls on a fixed schedule.

        The half-life is the time for half the carbon-14 nuclei to decay, 5,730 years. After one half-life 50% remains, after two 25%, after three 12.5%. A tool with 12.5% of the living level is three half-lives old: 3 × 5,730 = 17,190 years, about 17,000 years.

        Limitations: after about ten half-lives (roughly 50,000 years) too little carbon-14 remains to measure, so a fossil millions of years old cannot be dated this way; rock-dating isotopes such as uranium-238 are used instead. The method only works on material that was once living and exchanged carbon with the air, so a steel tool, which contains no organic carbon from a living source, cannot be dated by carbon-14. Also, the atmospheric carbon-14 level has varied slightly over time, so raw ages are calibrated against tree rings.
      explanation: |
        Six points.

        1 pt: origin of carbon-14 in the atmosphere and its uptake through the food chain, giving a steady level in living things.

        1 pt: after death, intake stops and the carbon-14 fraction falls by decay.

        1 pt: the beta-decay equation carbon-14 → nitrogen-14 + electron, with balance shown or stated.

        1 pt: half-life correctly defined.

        1 pt: 12.5% recognised as three half-lives and the age computed as about 17,190 years.

        1 pt: two valid limitations (too old for measurable carbon-14; material must have been living; calibration for varying atmospheric levels).
