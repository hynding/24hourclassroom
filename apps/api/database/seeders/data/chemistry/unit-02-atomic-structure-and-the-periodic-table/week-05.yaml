week: 5
unit: 2
title: "Average Atomic Mass and the Unstable Nucleus"
topics: ["2.3", "2.4"]
guide: guides/week-05.md
guide_description: |
  Why the periodic table shows decimals: average atomic mass as an abundance-weighted mean, estimating the dominant
  isotope and solving backwards for an abundance, with the mass spectrometer as the source of the data. Then the
  unstable nucleus: alpha, beta and gamma radiation, balanced nuclear equations, half-life calculations in both
  directions, and the uses and hazards of radioisotopes. Worked examples on chlorine, copper and boron, on decay
  equations, and on three kinds of half-life problem.
flashcards_description: |
  30 cards on the average atomic mass calculation and its shortcuts, mass spectrometry, the three kinds of
  radiation, nuclear equations, half-life and the main radioisotopes and their uses.

flashcards:
  - front: Average atomic mass → how it is calculated
    back: |
      Multiply each isotope's mass by its fractional abundance (percent ÷ 100) and add the products. For chlorine: 0.7576 × 34.969 + 0.2424 × 36.966 = 35.45 u.
    topic_code: "2.3"
  - front: Chlorine's atomic mass of 35.45 → why no chlorine atom weighs that
    back: |
      Natural chlorine is 75.76% Cl-35 (34.969 u) and 24.24% Cl-37 (36.966 u). The table reports the weighted mean of the two, which lies between them, closer to the more abundant isotope.
    topic_code: "2.3"
  - front: Estimating the most abundant isotope from the average → the shortcut
    back: |
      The average sits nearest the mass of the dominant isotope. Copper (63.55) is mostly Cu-63; bromine (79.90) is about half Br-79 and half Br-81; magnesium (24.31) is mostly Mg-24.
    topic_code: "2.3"
  - front: Solving for an unknown abundance with two isotopes → the setup
    back: |
      Let x be the fraction of one isotope and (1 − x) the other; set mass₁(1 − x) + mass₂x equal to the average and solve. Boron: 10.013(1 − x) + 11.009x = 10.81 gives x = 0.800 for B-11.
    topic_code: "2.3"
  - front: Percent versus fraction in the average mass formula → the common error
    back: |
      Use fractions (0.7576), not percents (75.76). Using percents gives an answer 100 times too large; dividing by 100 at the end fixes it.
    topic_code: "2.3"
  - front: Unweighted average of isotope masses → why it is wrong
    back: |
      (35 + 37) ÷ 2 = 36 ignores that Cl-35 is three times as abundant as Cl-37. The true average, 35.45, is pulled toward the common isotope.
    topic_code: "2.3"
  - front: Mass spectrometer → what it measures and how
    back: |
      Atoms are ionised, accelerated and bent by a magnetic field; heavier ions bend less. The detector output is a chart of mass against relative abundance, from which isotope percentages are read.
    topic_code: "2.3"
  - front: Mass spectrum of magnesium → reading the bars
    back: |
      Bars at 24, 25 and 26 u with heights 79.0%, 10.0% and 11.0%. The tall bar at 24 explains why magnesium's average mass is 24.31, just above 24.
    topic_code: "2.3"
  - front: Copper's isotopes and average mass → the numbers
    back: |
      69.15% Cu-63 (62.930 u) and 30.85% Cu-65 (64.928 u): 43.52 + 20.03 = 63.55 u.
    topic_code: "2.3"
  - front: Radioactivity → definition
    back: |
      The spontaneous emission of particles or energy from an unstable nucleus, which changes into a different nucleus (except for pure gamma emission). It is a nuclear process, unaffected by chemical bonding or temperature.
    topic_code: "2.4"
  - front: Why some nuclei are unstable → the force balance
    back: |
      Protons repel electrically; the strong nuclear force between all nucleons holds the nucleus together. Too few or too many neutrons for the proton count, or more than 83 protons, makes a nucleus unstable.
    topic_code: "2.4"
  - front: Alpha particle → composition, charge and penetration
    back: |
      A helium-4 nucleus: 2 protons and 2 neutrons, charge 2+, mass 4 u. Stopped by a sheet of paper or the outer layer of skin, but dangerous if inhaled or swallowed.
    topic_code: "2.4"
  - front: Beta particle → what it is and where it comes from
    back: |
      A fast electron emitted from the nucleus when a neutron turns into a proton. Charge 1−, negligible mass. Stopped by a few millimetres of aluminium.
    topic_code: "2.4"
  - front: Gamma ray → nature and shielding
    back: |
      High-energy electromagnetic radiation with no mass and no charge; it does not change the mass number or atomic number. Reduced by thick lead or concrete. Often accompanies alpha or beta decay.
    topic_code: "2.4"
  - front: Alpha decay → effect on mass number and atomic number
    back: |
      A decreases by 4 and Z by 2, so the daughter is two places earlier in the periodic table. Uranium-238 → thorium-234 + helium-4.
    topic_code: "2.4"
  - front: Beta decay → effect on mass number and atomic number
    back: |
      A is unchanged and Z increases by 1, so the daughter is the next element. Carbon-14 → nitrogen-14 + an electron.
    topic_code: "2.4"
  - front: Balancing a nuclear equation → the two checks
    back: |
      The mass numbers on the left must equal the mass numbers on the right, and so must the atomic numbers (charges). Radon-222 → polonium-218 + helium-4: 222 = 218 + 4 and 86 = 84 + 2.
    topic_code: "2.4"
  - front: Beta decay of iodine-131 → identify the daughter
    back: |
      A stays 131; Z goes from 53 to 54, which is xenon. The product is xenon-131.
    topic_code: "2.4"
  - front: Alpha decay of polonium-210 → identify the daughter
    back: |
      A: 210 − 4 = 206; Z: 84 − 2 = 82, lead. The product is lead-206, a stable isotope.
    topic_code: "2.4"
  - front: Half-life → definition and what does not change it
    back: |
      The time for half the nuclei in a sample to decay. It is a fixed property of each isotope and is not altered by temperature, pressure or chemical form.
    topic_code: "2.4"
  - front: Fraction remaining after n half-lives → formula
    back: |
      Remaining = original × (1/2)ⁿ, with n = elapsed time ÷ half-life. After 1, 2, 3, 4 half-lives: 1/2, 1/4, 1/8, 1/16 remain.
    topic_code: "2.4"
  - front: "Half-life problem: mass remaining → procedure"
    back: |
      Find n = time ÷ half-life, then halve the starting mass n times. 80.0 mg of I-131 (8.02 d) after 24.06 d: n = 3, so 80.0 → 40.0 → 20.0 → 10.0 mg.
    topic_code: "2.4"
  - front: "Half-life problem: time elapsed → procedure"
    back: |
      Count how many halvings take the start to the end, then multiply by the half-life. 400 mg of Tc-99m (6.0 h) down to 25 mg is four halvings, so 24 h.
    topic_code: "2.4"
  - front: Carbon-14 dating → how it works and the half-life
    back: |
      Living things take in C-14 from the air; at death intake stops and the C-14 decays with a half-life of 5,730 years. A sample with 1/8 of the living level is three half-lives, about 17,000 years, old.
    topic_code: "2.4"
  - front: Technetium-99m → why its 6.0 h half-life suits medical imaging
    back: |
      It emits gamma rays that cameras detect, and it decays away within about a day, so the patient's dose is small. It must be prepared shortly before use.
    topic_code: "2.4"
  - front: Iodine-131 → medical use and why it works
    back: |
      The thyroid gland concentrates iodine, so I-131 (half-life 8.02 d) delivers beta radiation to overactive or cancerous thyroid tissue while sparing the rest of the body.
    topic_code: "2.4"
  - front: Cobalt-60 and americium-241 → their everyday uses
    back: |
      Co-60 (5.27 y) is a gamma source for cancer radiotherapy and for sterilising medical equipment. Am-241 in smoke detectors emits alpha particles that ionise air; smoke interrupts the current and triggers the alarm.
    topic_code: "2.4"
  - front: Radon → why a gas that emits alpha particles is a hazard indoors
    back: |
      Radon-222 seeps from rock into basements. Alpha particles cannot pass through skin, but inhaled radon and its daughters decay inside the lungs, where the alpha radiation damages tissue.
    topic_code: "2.4"
  - front: Ionising radiation → why it harms living tissue
    back: |
      Alpha, beta and gamma radiation knock electrons off atoms they pass, breaking chemical bonds and damaging DNA. The same effect is used deliberately to kill tumour cells and microbes.
    topic_code: "2.4"
  - front: Strontium-90 → why fallout containing it is dangerous
    back: |
      With a 28.8 y half-life it persists for decades, and because strontium behaves chemically like calcium it is built into bone, where its beta radiation affects marrow.
    topic_code: "2.4"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 2.3 and 2.4: average atomic mass and nuclear
    chemistry), with about a third reviewing earlier weeks (isotopes and subatomic particles, the mass laws,
    classifying matter, significant figures and phase changes). Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: mass spectrum of an element (2.3)
    - slug: chem-u02-w05-q01
      type: multiple_choice
      topic_code: "2.3"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      stimulus: |
        Graph description: A mass spectrum of a pure element shows three vertical bars. The horizontal axis is mass in atomic mass units; the vertical axis is relative abundance in percent. The bars are at 24 u (height 79.0%), 25 u (height 10.0%) and 26 u (height 11.0%). Isotope masses: 23.985 u, 24.986 u and 25.983 u.
      prompt: |
        What is the average atomic mass of the element, to two decimal places?
      options:
        - "24.31 u"
        - "25.00 u"
        - "24.00 u"
        - "75.00 u"
      option_explanations:
        - |
          Correct. 0.790 × 23.985 + 0.100 × 24.986 + 0.110 × 25.983 = 18.95 + 2.50 + 2.86 = 24.31 u.
        - |
          25.00 is the unweighted mean of 24, 25 and 26; it ignores that the 24 u isotope dominates.
        - |
          24.00 is the mass of the most abundant isotope alone, not the weighted average over all three.
        - |
          Adding the three isotope masses gives about 75 u, which is not an average at all.
      answer: 0

    - slug: chem-u02-w05-q02
      type: multiple_choice
      topic_code: "2.3"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      stimulus: |
        Graph description: A mass spectrum of a pure element shows three vertical bars. The horizontal axis is mass in atomic mass units; the vertical axis is relative abundance in percent. The bars are at 24 u (height 79.0%), 25 u (height 10.0%) and 26 u (height 11.0%). Isotope masses: 23.985 u, 24.986 u and 25.983 u.
      prompt: |
        Which element is this, and how many neutrons does its most abundant isotope have?
      options:
        - "Chromium; 24 neutrons"
        - "Magnesium; 12 neutrons"
        - "Magnesium; 24 neutrons"
        - "Sodium; 13 neutrons"
      option_explanations:
        - |
          Chromium's atomic number is 24, but these masses near 24 u belong to a much lighter element; chromium's isotopes are near 52 u.
        - |
          Correct. An average of 24.31 u identifies magnesium (Z = 12); its main isotope, Mg-24, has 24 − 12 = 12 neutrons.
        - |
          Twenty-four is the mass number of the main isotope; its neutron count is the mass number minus the 12 protons.
        - |
          Sodium (Z = 11) has only one natural isotope, Na-23; three bars rule it out.
      answer: 1

    - slug: chem-u02-w05-q03
      type: multiple_choice
      topic_code: "2.3"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      stimulus: |
        Graph description: A mass spectrum of a pure element shows three vertical bars. The horizontal axis is mass in atomic mass units; the vertical axis is relative abundance in percent. The bars are at 24 u (height 79.0%), 25 u (height 10.0%) and 26 u (height 11.0%). Isotope masses: 23.985 u, 24.986 u and 25.983 u.
      prompt: |
        Why does the average atomic mass lie much closer to 24 u than to 26 u?
      options:
        - "Because heavier isotopes are always rarer"
        - "Because the mass spectrometer cannot detect heavy isotopes well"
        - "Because the 24 u isotope makes up about four fifths of the atoms, so it dominates the weighted average"
        - "Because the three bars have the same height"
      option_explanations:
        - |
          Heavier isotopes are not always rarer; chlorine-37 is rarer than chlorine-35, but uranium-238 is far more common than uranium-235.
        - |
          The instrument detects every isotope; the bar heights are the actual abundances.
        - |
          Correct. A weighted average is pulled toward the most abundant value, and 79% of the atoms have mass about 24 u.
        - |
          The bars differ greatly in height, 79% against 10% and 11%; that difference is what sets the average.
      answer: 2

    # ---- Multiple choice (2.3, 2.4)
    - slug: chem-u02-w05-q04
      type: multiple_choice
      topic_code: "2.3"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      prompt: |
        Bromine has two isotopes, Br-79 and Br-81, and an average atomic mass of 79.90 u. What can be concluded about their abundances?
      options:
        - "Br-79 is almost 100% of bromine"
        - "Br-81 is far more abundant than Br-79"
        - "The two isotopes have nearly equal abundances, with Br-79 slightly more common"
        - "No conclusion is possible without the mass spectrum"
      option_explanations:
        - |
          If Br-79 dominated, the average would be close to 79, not 79.9.
        - |
          If Br-81 dominated, the average would be above 80.
        - |
          Correct. An average almost exactly midway between 79 and 81, slightly below 80, means roughly 50:50 with a small excess of Br-79 (actual: 50.7% Br-79).
        - |
          The position of the average between the two masses does reveal the approximate abundances.
      answer: 2

    - slug: chem-u02-w05-q05
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A radioactive source warms the lead container that shields it. Which description of the energy transfer is correct?
      options:
        - "Heat flows from the hotter source to the cooler lead until their temperatures are equal"
        - "Temperature flows from the source into the lead"
        - "The lead's particles slow down as they absorb energy"
        - "No energy is transferred because lead blocks radiation"
      option_explanations:
        - |
          Correct. Heat is energy transferred because of a temperature difference, from hot to cold, and it stops when the temperatures match.
        - |
          Temperature is a measure of average particle kinetic energy; it is not a substance that flows.
        - |
          Absorbing energy raises the average kinetic energy of the lead's particles, so they speed up.
        - |
          Blocking the radiation means absorbing its energy, which is exactly how the lead warms.
      answer: 0

    - slug: chem-u02-w05-q06
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Thorium-234 (Z = 90) undergoes beta decay. What is the product?
      options:
        - "Radium-230"
        - "Protactinium-234"
        - "Thorium-233"
        - "Actinium-234"
      option_explanations:
        - |
          Radium-230 would be the product of alpha decay (A down 4, Z down 2), not beta.
        - |
          Correct. Beta decay keeps the mass number at 234 and raises Z from 90 to 91, which is protactinium.
        - |
          Beta decay does not change the mass number; nothing with mass leaves the nucleus apart from a near-massless electron.
        - |
          Actinium is Z = 89, one lower; beta decay raises the atomic number, it does not lower it.
      answer: 1

    - slug: chem-u02-w05-q07
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement about half-life is correct?
      options:
        - "After two half-lives none of the original isotope remains"
        - "Heating a sample shortens its half-life"
        - "Half-life is the time for half of the nuclei in a sample to decay, regardless of sample size"
        - "Half-life depends on the chemical compound the isotope is in"
      option_explanations:
        - |
          After two half-lives one quarter remains; the amount halves each time but never reaches zero in a fixed number of steps.
        - |
          Nuclear decay is unaffected by temperature, pressure or any chemical condition.
        - |
          Correct. The half-life is a fixed property of the isotope; a large sample and a small one lose half their nuclei in the same time.
        - |
          Decay happens in the nucleus; the electrons involved in bonding have no influence on it.
      answer: 2

    - slug: chem-u02-w05-q08
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which radiation is the most penetrating and requires thick lead or concrete shielding?
      options:
        - "Alpha"
        - "Beta"
        - "Neutrons from a chemical reaction"
        - "Gamma"
      option_explanations:
        - |
          Alpha particles are stopped by paper or the dead outer layer of skin.
        - |
          Beta particles are stopped by a few millimetres of aluminium.
        - |
          Chemical reactions do not release neutrons; neutrons come from nuclear processes.
        - |
          Correct. Gamma rays have no mass or charge and pass through most materials; dense shielding is needed to absorb them.
      answer: 3

    - slug: chem-u02-w05-q09
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Why is technetium-99m, with a half-life of 6.0 hours, well suited to medical imaging?
      options:
        - "It emits alpha particles that are easily detected outside the body"
        - "It decays away within about a day, keeping the patient's radiation dose low"
        - "Its long half-life lets hospitals stock it for years"
        - "It is a stable isotope"
      option_explanations:
        - |
          Alpha particles would not escape the body to be detected; Tc-99m emits gamma rays that do.
        - |
          Correct. Four half-lives pass in a day, leaving one sixteenth of the dose; the tracer is useful briefly and then almost gone.
        - |
          A 6-hour half-life means it must be prepared shortly before use, not stocked.
        - |
          A stable isotope would emit no radiation and could not be imaged.
      answer: 1

    # ---- Spiral review
    - slug: chem-u02-w05-q10
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Uranium-235 and uranium-238 are both used in discussions of nuclear energy. How do their atoms differ?
      options:
        - "U-238 has three more protons than U-235"
        - "U-238 has three more electrons than U-235"
        - "They are different elements"
        - "U-238 has three more neutrons than U-235"
      option_explanations:
        - |
          Both are uranium, so both have 92 protons; a different proton count would make a different element.
        - |
          As neutral atoms both have 92 electrons; the difference is in the nucleus.
        - |
          The same proton count makes them the same element, uranium.
        - |
          Correct. Same Z (92), mass numbers 235 and 238, so 143 and 146 neutrons: isotopes differing by three neutrons.
      answer: 3

    - slug: chem-u02-w05-q11
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of Dalton's original claims is contradicted by the existence of radioactive decay?
      options:
        - "Atoms of one element can be changed into atoms of another element"
        - "Compounds contain atoms in whole-number ratios"
        - "Atoms are neither created nor destroyed in chemical reactions"
        - "Atoms of different elements have different masses"
      option_explanations:
        - |
          Correct. Dalton held that atoms cannot be changed into other kinds of atoms, yet alpha and beta decay turn one element into another.
        - |
          Decay does not affect how atoms combine into compounds; this claim stands.
        - |
          This claim concerns chemical reactions, which radioactive decay is not; it remains true for chemistry.
        - |
          Different elements still have different characteristic masses; decay does not contradict this.
      answer: 0

    - slug: chem-u02-w05-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student calculates an average atomic mass as 0.6915 × 62.930 + 0.3085 × 64.928 and obtains 63.5464. The abundances were measured to four significant figures. How should the answer be reported?
      options:
        - "63.5464 u"
        - "63.5 u"
        - "64 u"
        - "63.55 u"
      option_explanations:
        - |
          Six significant figures exceed what four-figure abundances can support.
        - |
          Three figures discard precision that the data (four figures) provide.
        - |
          Two figures throw away most of the precision of the measurement.
        - |
          Correct. The abundances, with four significant figures, limit each product and the sum to four figures: 63.55 u.
      answer: 3

    # ---- Multi-select
    - slug: chem-u02-w05-q13
      type: multi_select
      topic_code: "2.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following nuclear equations are correctly balanced? Select all that apply.
      options:
        - "radon-222 → polonium-218 + helium-4"
        - "carbon-14 → nitrogen-14 + beta particle"
        - "uranium-238 → thorium-234 + beta particle"
        - "strontium-90 → yttrium-90 + beta particle"
        - "polonium-210 → lead-206 + helium-4"
      option_explanations:
        - |
          Correct. Mass numbers balance (222 = 218 + 4) and so do atomic numbers (86 = 84 + 2).
        - |
          Correct. Mass numbers balance (14 = 14 + 0) and atomic numbers balance (6 = 7 + (−1)).
        - |
          U-238 to Th-234 loses four mass units, which requires an alpha particle, not a beta particle.
        - |
          Correct. Mass numbers balance (90 = 90 + 0) and atomic numbers balance (38 = 39 + (−1)).
        - |
          Correct. Mass numbers balance (210 = 206 + 4) and atomic numbers balance (84 = 82 + 2).
      answer: [0, 1, 3, 4]

    - slug: chem-u02-w05-q14
      type: multi_select
      topic_code: "2.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following statements about average atomic mass are correct? Select all that apply.
      options:
        - "It is a weighted average that depends on isotope abundances"
        - "It is always a whole number"
        - "It is usually closest to the mass of the most abundant isotope"
        - "Abundances are measured with a mass spectrometer"
        - "It equals the mass number of the heaviest isotope"
      option_explanations:
        - |
          Correct. Each isotope's mass counts in proportion to its abundance.
        - |
          Averages over isotopes of different mass are generally not whole numbers: 35.45, 63.55, 24.31.
        - |
          Correct. The dominant isotope pulls the average toward its own mass.
        - |
          Correct. The mass spectrometer separates ions by mass and measures the relative amount of each.
        - |
          The heaviest isotope is often rare; the average is usually below its mass.
      answer: [0, 2, 3]

    # ---- True / false
    - slug: chem-u02-w05-q15
      type: true_false
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Gamma emission alone changes a nucleus into a different element.
      answer: false
      explanation: |
        False. A gamma ray has no mass and no charge, so emitting one leaves the mass number and atomic number unchanged; the nucleus simply loses energy. Alpha and beta decay are the processes that change the element.

    - slug: chem-u02-w05-q16
      type: true_false
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A sample of pure chlorine gas is a mixture because it contains both chlorine-35 and chlorine-37 atoms.
      answer: false
      explanation: |
        False. Both isotopes are chlorine; a sample containing only chlorine atoms is a single element, a pure substance. A mixture requires two or more different substances.

    - slug: chem-u02-w05-q25
      type: true_false
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In the gold foil experiment, the fact that most alpha particles passed straight through showed that the atom is mostly empty space.
      answer: true
      explanation: |
        True. If the atom were a solid ball of matter, the heavy, fast alpha particles would have been deflected or stopped. Their nearly undisturbed passage showed that most of the atom's volume contains almost nothing to hit; only the rare back-scattered particles revealed the dense nucleus.

    # ---- Fill in the blank
    - slug: chem-u02-w05-q17
      type: fill_blank
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The time required for half of the nuclei in a radioactive sample to decay is called the ____.
      answer: ["half-life", "half life", "halflife"]
      explanation: |
        The half-life is fixed for each isotope, from fractions of a second to billions of years, and is unaffected by temperature or chemical state.

    - slug: chem-u02-w05-q18
      type: fill_blank
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The number of protons in a nucleus, which identifies the element, is called the ____ number.
      answer: ["atomic"]
      explanation: |
        The atomic number Z counts protons. The mass number A counts protons plus neutrons; isotopes share Z but differ in A.

    # ---- Numeric
    - slug: chem-u02-w05-q19
      type: numeric
      topic_code: "2.3"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      prompt: |
        Silver has two isotopes: Ag-107 (106.905 u, 51.84%) and Ag-109 (108.905 u, 48.16%). Calculate the average atomic mass of silver. Give your answer in u to two decimal places.
      answer: { value: 107.87, tolerance: 0.02 }
      explanation: |
        0.5184 × 106.905 = 55.42 u; 0.4816 × 108.905 = 52.45 u; sum = 107.87 u. The result lies almost midway between the isotopes because their abundances are nearly equal.

    - slug: chem-u02-w05-q20
      type: numeric
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Iodine-131 has a half-life of 8.02 days. A sample initially contains 64.0 mg. What mass remains after 32.08 days? Give your answer in mg to one decimal place.
      answer: { value: 4.0, tolerance: 0.1 }
      explanation: |
        32.08 ÷ 8.02 = 4 half-lives. 64.0 → 32.0 → 16.0 → 8.0 → 4.0 mg. Equivalently 64.0 × (1/2)⁴ = 64.0 ÷ 16 = 4.0 mg.

    - slug: chem-u02-w05-q21
