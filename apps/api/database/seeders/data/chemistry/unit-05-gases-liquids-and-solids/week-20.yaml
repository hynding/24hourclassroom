    # ---- Short answer
    - slug: chem-u05-w20-q21
      type: short_answer
      topic_code: "5.5"
      source: "NIST Chemistry WebBook (water data)"
      points: 3
      prompt: |
        A 10.0 g ice cube at −20.0 °C is dropped into a cup and heated until it is all liquid water at 50.0 °C. Answer (a), (b) and (c). (Ice c = 2.09 J/(g·°C); water c = 4.184 J/(g·°C); ΔH_fus = 334 J/g.)

        (a) Calculate the heat required for each of the three stages.
        (b) State the total heat in kJ.
        (c) Sketch in words the heating curve for this process, saying which segments slope and which are flat, and which of the two sloped segments is steeper and why.
      answer: |
        (a) Warm ice: 10.0 × 2.09 × 20.0 = 418 J. Melt: 10.0 × 334 = 3,340 J. Warm water: 10.0 × 4.184 × 50.0 = 2,092 J.
        (b) 418 + 3,340 + 2,092 = 5,850 J = 5.85 kJ.
        (c) The curve rises from −20 °C to 0 °C (ice warming), runs flat at 0 °C while the ice melts, then rises again from 0 °C to 50 °C (water warming). The ice segment is steeper because ice's specific heat (2.09) is half of water's (4.184), so each joule raises the ice's temperature twice as much.
      explanation: |
        Three points, one per part.

        (a) 1 pt: all three values correct (418 J, 3,340 J, 2,092 J; accept rounding to 420, 3,340, 2,090).

        (b) 1 pt: 5.85 kJ (accept 5.8–5.9 kJ). An answer in joules without conversion earns the point if it is correct.

        (c) 1 pt: two sloped segments and one plateau at 0 °C in the right order, and the ice segment identified as steeper because of its smaller specific heat. Zero if the plateau is omitted or the steeper segment is reversed.

    - slug: chem-u05-w20-q22
      type: short_answer
      topic_code: "5.6"
      source: "NIST Chemistry WebBook (water phase data)"
      points: 3
      stimulus: |
        Figure description: The phase diagram of water. Pressure (atm, logarithmic scale) is vertical; temperature (°C) is horizontal. The solid region is on the left, the liquid in the middle, the gas at lower right. The three lines meet at the triple point, marked at 0.01 °C and 0.006 atm. The liquid–gas line passes through 100 °C at 1 atm and ends at the critical point, marked at 374 °C and 218 atm. The solid–liquid line is nearly vertical and leans very slightly to the left as it rises.
      prompt: |
        Using the figure description, answer (a), (b) and (c).

        (a) Describe what is observed if water vapour at 150 °C and 0.5 atm is cooled at constant pressure to −10 °C, naming each phase change and roughly where it occurs.
        (b) Explain why liquid water cannot exist at 0.003 atm at any temperature.
        (c) Explain what the critical point means for an attempt to liquefy steam at 400 °C by compressing it.
      answer: |
        (a) The vapour cools as a gas until it reaches the liquid–gas line (at 0.5 atm this is about 81 °C, below the normal boiling point), where it condenses to liquid. The liquid cools until it meets the solid–liquid line at about 0 °C, where it freezes. From 0 °C to −10 °C it is ice.
        (b) 0.003 atm is below the triple-point pressure of 0.006 atm. Below the triple point the only boundary is the solid–gas line, so cooling the vapour deposits it straight to ice and heating the ice sublimes it straight to vapour; the liquid region does not extend that low.
        (c) 400 °C is above the critical temperature of 374 °C. The liquid–gas line ends at the critical point, so no amount of pressure produces a separate liquid phase; compressing the steam gives a supercritical fluid whose density rises smoothly without a phase change.
      explanation: |
        Three points, one per part.

        (a) 1 pt: condensation at the liquid–gas line (somewhere below 100 °C since P < 1 atm), then freezing near 0 °C, ending as solid. Accept any sensible condensation temperature between about 70 and 100 °C.

        (b) 1 pt: 0.003 atm is below the triple-point pressure, so only solid and gas exist; the liquid region begins at the triple point.

        (c) 1 pt: above the critical temperature the liquid–gas line no longer exists, so compression gives a supercritical fluid, not a liquid.

    # ---- Long answer
    - slug: chem-u05-w20-q23
      type: long_answer
      topic_code: "5.6"
      source: "NIST Chemistry WebBook (water and carbon dioxide data)"
      points: 6
      prompt: |
        Water and carbon dioxide are both small molecules, yet at 1 atm water melts at 0 °C and boils at 100 °C while carbon dioxide passes directly from solid to gas at −78.5 °C.

        Write an explanation that (1) uses kinetic molecular theory and intermolecular forces to explain why both substances have a vapour pressure and why water's is so much lower than CO₂'s at the same temperature; (2) defines boiling in terms of vapour pressure and uses the definition to explain how the boiling point of water changes at high altitude and in a pressure cooker; (3) uses the phase diagrams of the two substances (water: triple point 0.01 °C and 0.006 atm; CO₂: triple point −56.6 °C and 5.11 atm) to explain why CO₂ sublimes at 1 atm but water does not; and (4) describes what the heating curve of CO₂ at 1 atm would look like compared with water's.
      answer: |
        (1) Molecules in a liquid or solid have a range of kinetic energies; the most energetic at the surface escape into the vapour, and in a closed container the vapour builds up until return and escape rates match, giving a vapour pressure that rises with temperature. Water molecules are held by hydrogen bonds, so few can escape at a given temperature; nonpolar CO₂ has only dispersion forces, so its molecules escape easily and its vapour pressure is far higher (solid CO₂ already reaches 1 atm at −78.5 °C).

        (2) Boiling is when the vapour pressure equals the external pressure, so vapour bubbles form inside the liquid. At altitude the air pressure is lower (about 0.70 atm at 3,000 m), so water's vapour pressure matches it near 90 °C and cooking is slower. A pressure cooker raises the external pressure to about 2 atm, so water must reach about 120 °C before it boils, and food cooks faster.

        (3) Water's triple point (0.006 atm) is below 1 atm, so a horizontal line at 1 atm crosses solid, liquid and gas: melting at 0 °C and boiling at 100 °C. CO₂'s triple point (5.11 atm) is above 1 atm, so the 1 atm line lies below it and crosses only the solid–gas line; there is no liquid region at that pressure and the solid sublimes at −78.5 °C. Liquid CO₂ needs at least 5.11 atm.

        (4) Water's heating curve at 1 atm has five segments: solid warming, a melting plateau at 0 °C, liquid warming, a long boiling plateau at 100 °C, gas warming. CO₂'s has three: solid warming, one plateau at −78.5 °C for sublimation (absorbing roughly the sum of the heats of fusion and vaporisation), then gas warming, with no liquid segment.
      explanation: |
        Six points.

        Vapour pressure and forces (0–2): 1 pt for the KMT picture (distribution of kinetic energies, escape from the surface, equilibrium of evaporation and condensation, rising with temperature); 1 pt for attributing water's low vapour pressure to hydrogen bonding and CO₂'s high vapour pressure to dispersion forces only.

        Boiling (0–1): definition as vapour pressure = external pressure, with both consequences correct (lower boiling point at altitude, higher in a pressure cooker).

        Phase diagrams (0–2): 1 pt for stating that a line at 1 atm crosses solid, liquid and gas regions for water because its triple point is below 1 atm; 1 pt for stating that CO₂'s triple point is above 1 atm so the 1 atm line crosses only the solid–gas boundary (sublimation), and liquid CO₂ requires at least 5.11 atm.

        Heating curves (0–1): water has two plateaus and three slopes; CO₂ at 1 atm has one plateau (sublimation) and two slopes, with no liquid segment.

        Common errors: saying CO₂ "has no liquid state" at all (it does, above 5.11 atm); defining boiling as "100 °C"; claiming water's vapour pressure is high because water is "wet".
