week: 20
unit: 5
title: "Phase Changes, Heating Curves and Phase Diagrams"
topics: ["5.5", "5.6"]
guide: guides/week-20.md
guide_description: |
  The six phase changes and their energy direction, how to read a heating curve and calculate the heat for each
  segment (q = mcΔT on the slopes, q = mΔH on the plateaus), then vapour pressure explained by kinetic molecular
  theory, boiling as vapour pressure meeting external pressure, and phase diagrams with their regions, lines,
  triple point and critical point, using water and carbon dioxide as the two worked cases.
flashcards_description: |
  29 cards on phase changes, heats of fusion and vaporisation, heating-curve calculations, vapour pressure, boiling
  and the features of a phase diagram.

flashcards:
  - front: The six phase changes → names and energy direction
    back: |
      Melting, vaporisation and sublimation absorb energy (endothermic); freezing, condensation and deposition release it (exothermic). Each pair is the reverse of the other with the same magnitude of energy.
    topic_code: "5.5"
  - front: Sublimation and deposition → which is which
    back: |
      Sublimation is solid → gas directly (dry ice, mothballs, frost disappearing on a cold dry day); deposition is gas → solid directly (frost forming on a window). Sublimation absorbs energy, deposition releases it.
    topic_code: "5.5"
  - front: Heat of fusion of water → value in J/g and kJ/mol
    back: |
      334 J/g, or 6.01 kJ/mol (6,010 J ÷ 18.02 g/mol = 334 J/g). The energy to melt one gram of ice at 0 °C, and the energy released when one gram of water freezes.
    topic_code: "5.5"
  - front: Heat of vaporisation of water → value in J/g and kJ/mol
    back: |
      2,260 J/g, or 40.7 kJ/mol. About 6.8 times the heat of fusion, because boiling breaks the hydrogen-bond network completely while melting only loosens it.
    topic_code: "5.5"
  - front: Specific heats of ice, water and steam
    back: |
      Ice 2.09 J/(g·°C); liquid water 4.184 J/(g·°C); steam 2.01 J/(g·°C). Liquid water's is the largest, so its heating-curve segment is the least steep.
    topic_code: "5.5"
  - front: Why temperature stays constant during a phase change
    back: |
      The energy added goes into overcoming intermolecular attractions (potential energy), not into faster motion (kinetic energy). Temperature measures average kinetic energy, so it does not change until the phase change is complete.
    topic_code: "5.5"
  - front: Heating curve → what the slopes and plateaus mean
    back: |
      Sloped segments: one phase warming, q = mcΔT, steeper for a smaller specific heat. Flat plateaus: a phase change at constant temperature, q = mΔH, longer for a larger ΔH.
    topic_code: "5.5"
  - front: Heating curve of water → the five segments in order
    back: |
      Ice warms (2.09), ice melts at 0 °C (334 J/g), water warms (4.184), water boils at 100 °C (2,260 J/g), steam warms (2.01). Add the five q values for the total.
    topic_code: "5.5"
  - front: Ice at −10 °C to steam at 100 °C, 25.0 g → the total heat
    back: |
      522.5 J (warm ice) + 8,350 J (melt) + 10,460 J (warm water) + 56,500 J (boil) = 75.8 kJ. Boiling alone is about three-quarters of the total.
    topic_code: "5.5"
  - front: Which step of water's heating curve needs the most energy
    back: |
      Boiling (vaporisation), 2,260 J/g. Warming the liquid over its whole 100 °C range costs only 418 J/g, and melting 334 J/g.
    topic_code: "5.5"
  - front: Why a steam burn is worse than a boiling-water burn
    back: |
      Steam at 100 °C releases 2,260 J per gram as it condenses on the skin before it even begins to cool; boiling water at 100 °C only releases heat as it cools (4.184 J per gram per degree).
    topic_code: "5.5"
  - front: Sign of q for freezing or condensing
    back: |
      Negative: the substance releases energy to the surroundings. 50.0 g of water at 20 °C freezing to ice at 0 °C gives q = −(4,184 + 16,700) J = −20.9 kJ.
    topic_code: "5.5"
  - front: Error spotting → using q = mcΔT during melting
    back: |
      On a plateau ΔT = 0, so mcΔT gives zero, which is wrong. The heat on a plateau is q = m × ΔH_fus (or ΔH_vap), with no temperature term at all.
    topic_code: "5.5"
  - front: Ethanol versus water → heats of vaporisation compared
    back: |
      Ethanol's ΔH_vap is about 841 J/g, less than half of water's 2,260 J/g, because each ethanol molecule has one O–H for hydrogen bonding and a larger nonpolar part, so its intermolecular forces are weaker.
    topic_code: "5.5"
  - front: Vapour pressure → definition
    back: |
      The pressure exerted by a vapour in equilibrium with its liquid (or solid) in a closed container at a given temperature, when the rate of evaporation equals the rate of condensation.
    topic_code: "5.6"
  - front: How vapour pressure depends on temperature
    back: |
      It rises steeply with temperature, because more molecules have enough kinetic energy to escape the surface. Water: 17.5 torr at 20 °C, 55.3 at 40 °C, 149 at 60 °C, 355 at 80 °C, 760 at 100 °C.
    topic_code: "5.6"
  - front: How vapour pressure depends on intermolecular forces
    back: |
      Stronger attractions hold molecules in the liquid and lower the vapour pressure at any temperature. At 25 °C diethyl ether is about 530 torr, ethanol about 59 torr, water 23.8 torr.
    topic_code: "5.6"
  - front: Boiling point → the definition in terms of vapour pressure
    back: |
      The temperature at which the liquid's vapour pressure equals the external pressure, so vapour bubbles can form throughout the liquid. The normal boiling point is where vapour pressure reaches 1 atm (760 torr).
    topic_code: "5.6"
  - front: Boiling at altitude and in a pressure cooker
    back: |
      At 0.70 atm on a mountain, water's vapour pressure matches the air at about 90 °C, so it boils cooler and cooking is slower. A pressure cooker at about 2 atm keeps water liquid to about 120 °C, so food cooks faster.
    topic_code: "5.6"
  - front: Evaporation versus boiling
    back: |
      Evaporation happens from the surface at any temperature, as the fastest molecules escape. Boiling happens throughout the liquid, only when the vapour pressure equals the external pressure.
    topic_code: "5.6"
  - front: Phase diagram → the axes and the three regions
    back: |
      Pressure vertical, temperature horizontal. Solid at low T and high P, gas at high T and low P, liquid in between. Lines between regions are conditions where two phases coexist.
    topic_code: "5.6"
  - front: Phase diagram → the three lines and what crossing each means
    back: |
      Solid–liquid line: melting or freezing. Liquid–gas line (the vapour pressure curve): boiling or condensing. Solid–gas line: sublimation or deposition. Any path that crosses a line is a phase change.
    topic_code: "5.6"
  - front: Triple point → definition and water's value
    back: |
      The single pressure and temperature at which solid, liquid and gas coexist in equilibrium, where the three lines meet. Water: 0.01 °C and 0.006 atm (611 Pa).
    topic_code: "5.6"
  - front: Critical point → definition and water's value
    back: |
      The end of the liquid–gas line. Above the critical temperature (374 °C for water) no pressure can liquefy the gas; above both critical T and P (218 atm) the substance is a supercritical fluid.
    topic_code: "5.6"
  - front: Why dry ice sublimes instead of melting at 1 atm
    back: |
      CO₂'s triple point is at 5.11 atm and −56.6 °C. Below 5.11 atm no liquid region exists, so heating the solid at 1 atm crosses only the solid–gas line, at −78.5 °C.
    topic_code: "5.6"
  - front: Water's solid–liquid line → which way it leans and why
    back: |
      Slightly to the left: the melting point falls as pressure rises, because ice is less dense than liquid water and pressure favours the denser phase. Almost every other substance's line leans right.
    topic_code: "5.6"
  - front: Supercritical CO₂ → what it is and one use
    back: |
      CO₂ above 31 °C and 73 atm, neither liquid nor gas. It dissolves caffeine like a liquid and then evaporates away completely when the pressure is released, so it is used to decaffeinate coffee.
    topic_code: "5.6"
  - front: Reading a path on a phase diagram → the method
    back: |
      Mark the start and end points, draw the path, and name every line it crosses in order. Heating water at 1 atm crosses melting at 0 °C and boiling at 100 °C; lowering the pressure on liquid water at 25 °C makes it boil at 23.8 torr.
    topic_code: "5.6"
  - front: Boiling water with a vacuum pump at room temperature → why it works
    back: |
      Boiling needs vapour pressure = external pressure. Water's vapour pressure at 25 °C is 23.8 torr, so pumping the pressure above it below 23.8 torr makes it boil without heating.
    topic_code: "5.6"

quiz:
  description: |
    23 questions · about 40 minutes · topics 5.5 and 5.6 (phase changes, heating curves, vapour pressure and phase
    diagrams), with review of heat versus temperature (1.6), significant figures (1.4), intermolecular forces
    (3.6), molar mass (4.4) and the over-water correction (5.4). Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: a heating curve for an unknown substance (5.5, 3.6)
    - slug: chem-u05-w20-q01
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 50.0 g sample of a pure substance X is heated at a steady 200 J per minute at 1 atm, and its temperature is recorded.

        | Time (min) | Temperature (°C) | Observation |
        |---|---|---|
        | 0 | −30 | solid |
        | 3 | −15 | solid begins to melt |
        | 11 | −15 | last solid melts |
        | 31 | 65 | liquid begins to boil |
        | 71 | 65 | last liquid boils |
        | 76 | 85 | gas |
      prompt: |
        What are the melting point and the normal boiling point of substance X?
      options:
        - "Melting point −30 °C; boiling point 85 °C"
        - "Melting point 65 °C; boiling point −15 °C"
        - "Melting point −15 °C; boiling point 85 °C"
        - "Melting point −15 °C; boiling point 65 °C"
      option_explanations:
        - |
          −30 °C is the starting temperature of the solid and 85 °C the final gas temperature; neither is a plateau.
        - |
          The temperatures are swapped: the lower plateau is melting, the higher one boiling.
        - |
          The boiling plateau is at 65 °C; 85 °C is simply where the heating stopped.
        - |
          Correct. The temperature holds at −15 °C while the solid melts (minutes 3 to 11) and at 65 °C while the liquid boils (minutes 31 to 71); plateaus at 1 atm mark the melting point and the normal boiling point.
      answer: 3

    - slug: chem-u05-w20-q02
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 50.0 g sample of a pure substance X is heated at a steady 200 J per minute at 1 atm, and its temperature is recorded.

        | Time (min) | Temperature (°C) | Observation |
        |---|---|---|
        | 0 | −30 | solid |
        | 3 | −15 | solid begins to melt |
        | 11 | −15 | last solid melts |
        | 31 | 65 | liquid begins to boil |
        | 71 | 65 | last liquid boils |
        | 76 | 85 | gas |
      prompt: |
        What is the heat of fusion of substance X?
      options:
        - "1,600 J/g"
        - "32 J/g"
        - "160 J/g"
        - "8.0 J/g"
      option_explanations:
        - |
          1,600 J is the total heat supplied during melting (8 min × 200 J/min); it must be divided by the 50.0 g mass.
        - |
          Correct. Melting lasts from minute 3 to minute 11, so 8 min × 200 J/min = 1,600 J for 50.0 g, giving 1,600/50.0 = 32 J/g.
        - |
          160 J/g is the heat of vaporisation (40 min × 200 J/min ÷ 50.0 g), from the upper plateau.
        - |
          8.0 is the number of minutes of the melting plateau, not an energy per gram.
      answer: 1

    - slug: chem-u05-w20-q03
      type: multiple_choice
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 50.0 g sample of a pure substance X is heated at a steady 200 J per minute at 1 atm, and its temperature is recorded.

        | Time (min) | Temperature (°C) | Observation |
        |---|---|---|
        | 0 | −30 | solid |
        | 3 | −15 | solid begins to melt |
        | 11 | −15 | last solid melts |
        | 31 | 65 | liquid begins to boil |
        | 71 | 65 | last liquid boils |
        | 76 | 85 | gas |
      prompt: |
        The heat of vaporisation of X works out to 160 J/g, compared with 2,260 J/g for water. Which conclusion about the intermolecular forces in X is best supported?
      options:
        - "X has much weaker intermolecular forces than water, so far less energy is needed to separate its molecules into a gas."
        - "X has stronger intermolecular forces than water, because it boils at a lower temperature."
        - "X must be an ionic compound, since ionic compounds have low heats of vaporisation."
        - "X has the same intermolecular forces as water but a larger molar mass."
      option_explanations:
        - |
          Correct. Heat of vaporisation measures the energy to overcome the attractions between molecules; a value fourteen times smaller than water's means much weaker forces, consistent with the low boiling point too.
        - |
          A lower boiling point indicates weaker, not stronger, intermolecular forces.
        - |
          Ionic compounds have very high melting and boiling points and large heats of vaporisation; X's low values rule that out.
        - |
          Hydrogen bonding as strong as water's would give a far larger heat of vaporisation whatever the molar mass.
      answer: 0
      explanation: |
        Review of 3.6: heats of vaporisation and boiling points both rank intermolecular force strength.

    # ---- Single items
    - slug: chem-u05-w20-q04
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        On a clear, cold night, frost forms on a car windscreen directly from water vapour in the air. Which phase change is this, and does it absorb or release energy?
      options:
        - "Sublimation; it absorbs energy"
        - "Freezing; it releases energy"
        - "Deposition; it releases energy"
        - "Condensation; it absorbs energy"
      option_explanations:
        - |
          Sublimation is the reverse process, solid to gas, and it absorbs energy.
        - |
          Freezing is liquid to solid; frost forms straight from the vapour without passing through liquid.
        - |
          Correct. Gas to solid directly is deposition. Attractions form between the water molecules as they lock into ice, so energy is released to the surroundings.
        - |
          Condensation gives liquid dew, not solid frost, and it releases energy rather than absorbing it.
      answer: 2

    - slug: chem-u05-w20-q05
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Why does 1 g of steam at 100 °C cause a more severe burn than 1 g of liquid water at 100 °C?
      options:
        - "Steam is at a higher temperature than boiling water."
        - "The steam releases its heat of vaporisation, about 2,260 J, as it condenses on the skin, before it even starts to cool."
        - "Steam molecules move faster and so carry more kinetic energy per molecule."
        - "Liquid water cannot transfer heat to the skin."
      option_explanations:
        - |
          Both are at 100 °C; the difference is in the phase, not the temperature.
        - |
          Correct. Condensation is exothermic, releasing 2,260 J per gram at 100 °C; the water at 100 °C then cools as well, so steam delivers far more energy in total.
        - |
          At the same temperature, molecules in the gas and the liquid have the same average kinetic energy; the extra energy in steam is potential energy of separation.
        - |
          Liquid water at 100 °C transfers plenty of heat (4.184 J per gram per degree as it cools); it simply has no phase change to release.
      answer: 1

    - slug: chem-u05-w20-q06
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A pressure cooker raises the pressure above the water inside it to about 2 atm. Which statement explains why food cooks faster?
      options:
        - "The higher pressure forces heat into the food more quickly."
        - "At 2 atm the water's vapour pressure is higher, so it boils at a lower temperature."
        - "The water cannot boil at all, so all the heat goes into the food."
        - "Water boils only when its vapour pressure reaches the external pressure, which at 2 atm happens near 120 °C, so the food is cooked in hotter water."
      option_explanations:
        - |
          Pressure does not push heat; the cooking rate rises because the liquid water is hotter.
        - |
          A higher external pressure raises, not lowers, the boiling point: more vapour pressure is needed to match it.
        - |
          The water does boil, but at a higher temperature; the pressure is set by a valve that lets steam escape.
        - |
          Correct. Boiling requires vapour pressure = external pressure; water reaches 2 atm of vapour pressure at about 120 °C, so the liquid stays 20 °C hotter than in an open pot.
      answer: 3

    - slug: chem-u05-w20-q07
      type: multiple_choice
      topic_code: "5.6"
      source: "NIST Chemistry WebBook (carbon dioxide phase data)"
      points: 1
      prompt: |
        Solid carbon dioxide ("dry ice") at 1 atm turns directly into gas at −78.5 °C instead of melting. Which feature of the CO₂ phase diagram explains this?
      options:
        - "Its triple point (−56.6 °C, 5.11 atm) lies above 1 atm, so there is no liquid region at 1 atm."
        - "Its critical point lies below room temperature."
        - "Its solid–liquid line leans to the left, like water's."
        - "Its liquid–gas line ends at 1 atm."
      option_explanations:
        - |
          Correct. Below the triple-point pressure of 5.11 atm the only phases are solid and gas, so heating at 1 atm crosses the sublimation line only.
        - |
          CO₂'s critical point is at 31 °C and 73 atm; it concerns the end of the liquid–gas line, not the absence of liquid at 1 atm.
        - |
          CO₂'s solid–liquid line leans right, as for most substances; the slope of that line does not decide whether a liquid exists at 1 atm.
        - |
          The liquid–gas line runs from the triple point (5.11 atm) up to the critical point (73 atm); it never reaches down to 1 atm, which is the real point.
      answer: 0

    - slug: chem-u05-w20-q08
      type: multiple_choice
      topic_code: "5.6"
      source: "NIST Chemistry WebBook (vapour pressures)"
      points: 1
      prompt: |
        At 25 °C the vapour pressures of diethyl ether, ethanol and water are about 530 torr, 59 torr and 23.8 torr. Which ranking of their intermolecular forces, weakest to strongest, is consistent with these values?
      options:
        - "water < ethanol < diethyl ether"
        - "ethanol < water < diethyl ether"
        - "diethyl ether < ethanol < water"
        - "diethyl ether < water < ethanol"
      option_explanations:
        - |
          This is the order of vapour pressures from lowest to highest, which is the order of forces from strongest to weakest, the reverse of what was asked.
        - |
          Ethanol's vapour pressure (59 torr) is higher than water's, so ethanol's forces are weaker than water's, not stronger.
        - |
          Correct. The highest vapour pressure (ether, 530 torr) means molecules escape most easily, so its forces are weakest; water, with two O–H bonds per molecule for hydrogen bonding, has the lowest vapour pressure and the strongest forces.
        - |
          Water has a lower vapour pressure than ethanol, so water's forces are the strongest, not ethanol's.
      answer: 2

    - slug: chem-u05-w20-q09
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A beaker of ice and water is stirred and held at exactly 0 °C while a heater delivers 1,000 J to it. The temperature does not change. What happened to the 1,000 J?
      options:
        - "It was lost, because energy cannot be added without raising the temperature."
        - "It became potential energy as some ice melted, separating water molecules from the solid's structure without speeding them up."
        - "It increased the average kinetic energy of the molecules, but the thermometer is not sensitive enough to show it."
        - "It was stored as kinetic energy in the liquid only, while the ice stayed unchanged."
      option_explanations:
        - |
          Energy is conserved; it did work against intermolecular attractions rather than raising the temperature.
        - |
          Correct. Temperature measures average kinetic energy, which stays fixed during melting; the added heat goes into potential energy as hydrogen bonds in the ice are loosened (about 3 g of ice melts per 1,000 J).
        - |
          Any rise in average kinetic energy is a rise in temperature; the thermometer reads 0 °C because the kinetic energy really did not change.
        - |
          Ice and water at 0 °C share the same average kinetic energy; the heat changes some ice into water, not the energy of motion of either.
      answer: 1
      explanation: |
        Review of 1.6: heat is energy transferred; temperature is average kinetic energy. During a phase change the two separate.

    - slug: chem-u05-w20-q10
      type: multiple_choice
      topic_code: "5.4"
      source: "NIST Chemistry WebBook (vapour pressure of water)"
      points: 1
      prompt: |
        A student collects hydrogen over water at 30 °C (vapour pressure 31.8 torr) rather than at 20 °C (17.5 torr). Compared with the 20 °C experiment at the same barometric pressure, how does the correction for water vapour change?
      options:
        - "It is larger, because the vapour pressure of water rises with temperature, so more of the total pressure belongs to water vapour."
        - "It is smaller, because warm gases hold less water vapour."
        - "It is the same, because the barometric pressure is unchanged."
        - "No correction is needed at 30 °C, because the water vapour condenses."
      option_explanations:
        - |
          Correct. 31.8 torr must be subtracted instead of 17.5 torr; the hydrogen's partial pressure is a smaller share of the total at the higher temperature.
        - |
          Warmer air holds more water vapour, not less; evaporation increases with temperature.
        - |
          The correction depends on the water's vapour pressure, which depends on temperature, not on the barometer reading.
        - |
          Water vapour is present in equilibrium with the liquid at every temperature; the correction is never zero.
      answer: 0
      explanation: |
        Review of 5.4 with this week's idea: the over-water correction is a vapour-pressure value, and vapour pressure climbs with temperature.

    - slug: chem-u05-w20-q11
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        On the phase diagram of water the solid–liquid line leans slightly to the left, so that increasing the pressure on ice at −1 °C can melt it. Which property of water is responsible?
      options:
        - "Water has a very high heat of vaporisation."
        - "Water's triple point is below 1 atm."
        - "Water boils at 100 °C at 1 atm."
        - "Ice is less dense than liquid water, so pressure favours the liquid."
      option_explanations:
        - |
          The heat of vaporisation concerns the liquid–gas line, not the slope of the melting line.
        - |
          Most substances have triple points below 1 atm; that does not determine which way the melting line leans.
        - |
          The normal boiling point is one point on the liquid–gas line and says nothing about the melting line's slope.
        - |
          Correct. Pressure favours the denser phase. Because ice (0.917 g/mL) is less dense than liquid water (1.00 g/mL), squeezing ice pushes it toward the liquid, so the melting point falls as pressure rises.
      answer: 3

    # ---- Select all
    - slug: chem-u05-w20-q12
      type: multi_select
      topic_code: "5.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following processes absorb energy from the surroundings? Select all that apply.
      options:
        - "Ice melting in a glass of lemonade"
        - "Water vapour condensing on a cold mirror"
        - "Sweat evaporating from skin"
        - "Dry ice subliming on a stage"
        - "Liquid wax solidifying on a candle"
      option_explanations:
        - |
          Correct. Melting is endothermic: the ice takes heat of fusion from the lemonade, cooling it.
        - |
          Condensation is exothermic; the mirror warms slightly as the vapour gives up its heat of vaporisation.
        - |
          Correct. Evaporation is vaporisation, which absorbs energy; that energy comes from the skin, which is why sweating cools you.
        - |
          Correct. Sublimation is endothermic, which is why dry ice chills the air around it into visible fog.
        - |
          Freezing (solidifying) releases energy as the molecules settle into the solid's structure.
      answer: [0, 2, 3]

    - slug: chem-u05-w20-q13
      type: multi_select
      topic_code: "3.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly connect intermolecular forces to the behaviour of liquids? Select all that apply.
      options:
        - "A liquid with stronger intermolecular forces has a lower vapour pressure at a given temperature."
        - "A liquid with stronger intermolecular forces has a higher normal boiling point."
        - "Hydrogen bonding explains why water's heat of vaporisation is much larger than that of similar-sized molecules without O–H or N–H bonds."
        - "Dispersion forces are strongest in small, light molecules."
        - "A liquid with a high vapour pressure evaporates slowly."
      option_explanations:
        - |
          Correct. Stronger attractions hold molecules in the liquid, so fewer escape into the vapour.
        - |
          Correct. More vapour pressure must be built up to reach the external pressure, which needs a higher temperature.
        - |
          Correct. Each water molecule can form hydrogen bonds through two O–H bonds and two lone pairs, which is why 2,260 J/g is needed to separate them.
        - |
          Dispersion forces grow with the number of electrons and the size of the molecule; they are weakest in small, light molecules.
        - |
          A high vapour pressure means molecules escape easily, so such a liquid (like diethyl ether) evaporates quickly.
      answer: [0, 1, 2]
      explanation: |
        Review of 3.6: vapour pressure, boiling point and heat of vaporisation are three measurements of the same intermolecular forces.

    # ---- True / false
    - slug: chem-u05-w20-q14
      type: true_false
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: While a pure substance boils at constant pressure, its temperature stays constant even though heat is being added continuously.
      answer: true
      explanation: |
        True. The added heat goes into separating the molecules (potential energy), not into faster motion (kinetic energy), so the temperature holds at the boiling point until all the liquid has become gas. On a heating curve this is the long upper plateau.

    - slug: chem-u05-w20-q15
      type: true_false
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Heat and temperature are the same quantity measured in different units.
      answer: false
      explanation: |
        False. Heat is energy transferred because of a temperature difference, measured in joules; temperature is a measure of the average kinetic energy of particles, measured in kelvin or °C. A bathtub of warm water holds more heat than a cup of boiling water even though its temperature is lower, and a melting ice cube absorbs heat with no temperature change at all.

