  # ---- Short answer
  - slug: chem-u05-exam-q38
    type: short_answer
    topic_code: "5.4"
    source: "PubChem (molar masses)"
    points: 3
    prompt: |
      Butane burns in a camping stove: 2 C₄H₁₀(g) + 13 O₂(g) → 8 CO₂(g) + 10 H₂O(g). Answer (a), (b) and (c).

      (a) What volume of oxygen, at the same temperature and pressure as the butane, is needed to burn 1.50 L of butane?
      (b) A canister holds 227 g of butane (58.12 g/mol). What volume of CO₂ at 25 °C and 1.00 atm is produced when all of it burns?
      (c) Explain why part (a) can be solved without converting to moles but part (b) cannot.
    answer: |
      (a) 1.50 L C₄H₁₀ × (13 L O₂ / 2 L C₄H₁₀) = 9.75 L of O₂.
      (b) 227 g ÷ 58.12 g/mol = 3.906 mol C₄H₁₀; × 8/2 = 15.62 mol CO₂; V = nRT/P = (15.62 × 0.08206 × 298)/1.00 = 382 L of CO₂.
      (c) In (a) both substances are gases at the same conditions, so by Avogadro's law their volumes are in the same ratio as their moles, and the coefficients can be read as litres. In (b) the starting quantity is a mass, which must be converted to moles through the molar mass before the mole ratio and the ideal gas law can be applied.
    explanation: |
      Three points, one per part.

      (a) 1 pt: 9.75 L (accept 9.7–9.8).

      (b) 1 pt: 3.91 mol butane, 15.6 mol CO₂, about 382 L (accept 375–390 L). Zero if 22.4 L/mol is used at 25 °C (350 L).

      (c) 1 pt: Avogadro's law makes volume ratios equal mole ratios only for gases at the same T and P; a mass must go through moles.

  - slug: chem-u05-exam-q39
    type: short_answer
    topic_code: "5.6"
    source: "NIST Chemistry WebBook (vapour pressures)"
    points: 3
    stimulus: |
      Vapour pressures of two liquids at several temperatures, in torr:

      | Temperature (°C) | Ethanol | Water |
      |---|---|---|
      | 20 | 44 | 17.5 |
      | 40 | 134 | 55.3 |
      | 60 | 352 | 149 |
      | 78 | 760 | 329 |
      | 100 | 1,690 | 760 |
    prompt: |
      Using the table, answer (a), (b) and (c).

      (a) State the normal boiling point of each liquid and explain how the table shows it.
      (b) Explain in terms of intermolecular forces why ethanol has the higher vapour pressure at every temperature.
      (c) Estimate the temperature at which water would boil if the external pressure were 329 torr, and explain your reasoning.
    answer: |
      (a) Ethanol 78 °C, water 100 °C: the normal boiling point is the temperature at which the vapour pressure reaches 760 torr (1 atm), and the table shows ethanol reaching 760 torr at 78 °C and water at 100 °C.
      (b) Both liquids hydrogen-bond, but each ethanol molecule has only one O–H group and a nonpolar ethyl group, while water has two O–H bonds and two lone pairs and forms a more extensive hydrogen-bonded network. Weaker overall attractions in ethanol let more molecules escape into the vapour at any temperature.
      (c) About 78 °C. A liquid boils when its vapour pressure equals the external pressure, and the table shows water's vapour pressure is 329 torr at 78 °C.
    explanation: |
      Three points, one per part.

      (a) 1 pt: both boiling points correct, with the 760 torr criterion stated.

      (b) 1 pt: ethanol's weaker (less extensive) hydrogen bonding, or water's stronger intermolecular forces, explained with structural reference (one O–H versus two, nonpolar chain). Zero for "ethanol is lighter" alone.

      (c) 1 pt: 78 °C, with the reasoning that boiling occurs when vapour pressure equals external pressure.

  # ---- Long answer
  - slug: chem-u05-exam-q40
    type: long_answer
    topic_code: "5.5"
    source: "NIST Chemistry WebBook (water data)"
    points: 6
    prompt: |
      A 20.0 g block of ice at −10.0 °C is placed in a sealed, rigid, insulated 10.0 L container that also holds 0.500 mol of dry air at 25 °C. The system is then heated slowly until all the water has become steam at 110 °C. (Ice c = 2.09 J/(g·°C); water c = 4.184 J/(g·°C); steam c = 2.01 J/(g·°C); ΔH_fus = 334 J/g; ΔH_vap = 2,260 J/g; H₂O 18.02 g/mol.)

      Write a full account that (1) lists the five stages the water passes through and calculates the heat required for each, then totals it in kJ; (2) explains why the temperature does not change during two of the stages even though heat is being added; (3) calculates the partial pressure of the air in the container at the final temperature of 110 °C (383 K), using the ideal gas law; and (4) calculates the partial pressure of the water vapour at 383 K and the total pressure in the container, and comments on whether the water vapour would behave ideally at this pressure.
    answer: |
      (1) Warm ice: 20.0 × 2.09 × 10.0 = 418 J. Melt: 20.0 × 334 = 6,680 J. Warm water: 20.0 × 4.184 × 100.0 = 8,368 J. Boil: 20.0 × 2,260 = 45,200 J. Warm steam: 20.0 × 2.01 × 10.0 = 402 J. Total 61,068 J = 61.1 kJ.

      (2) During melting and boiling the added energy goes into overcoming intermolecular attractions (potential energy) as the solid structure is loosened or the liquid's hydrogen bonds are broken, not into faster molecular motion. Temperature measures average kinetic energy, so it holds steady until the phase change is complete.

      (3) P_air = nRT/V = (0.500 × 0.08206 × 383)/10.0 = 15.71/10.0 = 1.57 atm.

      (4) Moles of water: 20.0/18.02 = 1.11 mol. P_water = (1.11 × 0.08206 × 383)/10.0 = 34.9/10.0 = 3.49 atm. Total (Dalton's law) = 1.57 + 3.49 = 5.06 atm. At 3.49 atm and only 10 °C above its normal boiling point, water vapour is close to its condensation conditions, so its hydrogen bonding would cause noticeable deviation from ideal behaviour; in fact water's vapour pressure at 110 °C is only about 1.4 atm, so at 3.49 atm some of the water would condense rather than all remaining as vapour. The ideal-gas answer is an upper estimate.
    explanation: |
      Six points.

      Heating stages (0–2): 1 pt for all five stages identified in order with the correct formula for each (mcΔT on slopes, mΔH on plateaus); 1 pt for the total of about 61.1 kJ (accept 60.5–61.5; individual values 418, 6,680, 8,368, 45,200, 402 J).

      Constant temperature (0–1): energy during a phase change goes into potential energy (overcoming attractions), not kinetic energy, and temperature measures kinetic energy.

      Air partial pressure (0–1): 1.57 atm (accept 1.55–1.60) with T = 383 K.

      Water vapour and total (0–2): 1 pt for 1.11 mol and P_water ≈ 3.49 atm (accept 3.4–3.6) and total ≈ 5.06 atm by Dalton's law; 1 pt for a comment that water vapour near its condensation point, with hydrogen bonding, deviates from ideal behaviour (full credit also for noting that 3.49 atm exceeds water's vapour pressure at 110 °C, so condensation would occur).

      Common errors: using 4.184 for every stage; omitting the ice or steam warming stages; using 110 °C in place of 383 K; adding partial pressures of air and water with moles instead of pressures.
