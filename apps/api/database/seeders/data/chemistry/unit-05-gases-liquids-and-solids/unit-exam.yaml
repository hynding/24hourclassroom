    source: "NIST Chemistry WebBook (water data)"
    points: 1
    prompt: |
      How much heat is needed to warm 100.0 g of water from 25.0 °C to 100.0 °C and then boil all of it? Use c = 4.184 J/(g·°C) and ΔH_vap = 2,260 J/g. Give your answer in kJ to one decimal place.
    answer: { value: 257.4, tolerance: 0.5 }
