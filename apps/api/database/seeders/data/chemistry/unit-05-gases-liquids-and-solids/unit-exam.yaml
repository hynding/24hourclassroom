  - slug: chem-u05-exam-q36
    type: numeric
    topic_code: "5.4"
    source: "PubChem (molar masses)"
    points: 1
    prompt: |
      A cylinder contains 8.00 g of helium (4.00 g/mol) and 32.0 g of oxygen (32.00 g/mol) at a total pressure of 3.00 atm. What is the partial pressure of oxygen? Give your answer in atm to two decimal places.
    answer: { value: 1.00, tolerance: 0.01 }
    explanation: |
      Convert to moles first: 8.00/4.00 = 2.00 mol He; 32.0/32.00 = 1.00 mol O₂. X_O₂ = 1.00/3.00 = 0.333. P_O₂ = 0.333 × 3.00 atm = 1.00 atm. Using the mass fraction (32/40 = 0.80) would wrongly give 2.40 atm.

  - slug: chem-u05-exam-q37
