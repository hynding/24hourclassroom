  # ---- Numeric
  - slug: chem-u05-exam-q34
    type: numeric
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    prompt: |
      A rigid tank holds gas at 3.00 atm and 300 K. It is heated to 450 K. What is the new pressure? Give your answer in atm to two decimal places.
    answer: { value: 4.50, tolerance: 0.01 }
    explanation: |
      Gay-Lussac's law: P₂ = P₁ × T₂/T₁ = 3.00 atm × 450/300 = 4.50 atm. The volume is fixed, so the pressure rises in proportion to the kelvin temperature.

  - slug: chem-u05-exam-q35
