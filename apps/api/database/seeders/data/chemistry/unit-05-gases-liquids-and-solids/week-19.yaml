        The molar mass of sodium azide, NaN₃ (Na 22.99, N 14.01), is ____ g/mol.
      answer: ["65.02", "65.0", "65", "65.02 g/mol", "65.0 g/mol"]
      explanation: |
        22.99 + 3 × 14.01 = 22.99 + 42.03 = 65.02 g/mol. This is the first number needed in the air-bag problem, where moles of nitrogen gas from PV = nRT are converted back to grams of azide.

    # ---- Numeric
    - slug: chem-u05-w19-q18
      type: numeric
      topic_code: "5.4"
      source: "PubChem (molar mass of zinc)"
      points: 1
      prompt: |
        Zinc reacts with excess hydrochloric acid: Zn(s) + 2 HCl(aq) → ZnCl₂(aq) + H₂(g). What volume of hydrogen at STP is produced from 6.54 g of zinc (65.38 g/mol)? Give your answer in litres to two decimal places.
      answer: { value: 2.24, tolerance: 0.01 }
      explanation: |
        6.54 g ÷ 65.38 g/mol = 0.100 mol Zn → 0.100 mol H₂ (1:1) → 0.100 mol × 22.4 L/mol = 2.24 L at STP.

    - slug: chem-u05-w19-q19
      type: numeric
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A flask contains 0.300 mol of nitrogen and 0.100 mol of oxygen at a total pressure of 2.00 atm. What is the partial pressure of oxygen? Give your answer in atm to three decimal places.
      answer: { value: 0.500, tolerance: 0.005 }
      explanation: |
        X_O₂ = 0.100/(0.300 + 0.100) = 0.250. P_O₂ = 0.250 × 2.00 atm = 0.500 atm. Nitrogen supplies the other 1.50 atm.

    - slug: chem-u05-w19-q20
      type: numeric
      topic_code: "5.4"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        Potassium chlorate decomposes: 2 KClO₃(s) → 2 KCl(s) + 3 O₂(g). What volume of oxygen, at 25 °C and 1.00 atm, is produced by 12.26 g of KClO₃ (122.55 g/mol)? Give your answer in litres to two decimal places.
      answer: { value: 3.67, tolerance: 0.02 }
      explanation: |
        12.26 g ÷ 122.55 g/mol = 0.1000 mol KClO₃ → × 3/2 = 0.1500 mol O₂. V = nRT/P = (0.1500 × 0.08206 × 298)/1.00 = 3.67 L. (Using 22.4 L/mol would give 3.36 L, wrong because the gas is not at STP.)

    # ---- Short answer
    - slug: chem-u05-w19-q21
      type: short_answer
      topic_code: "5.4"
      source: "general knowledge"
      points: 3
      prompt: |
        An automobile air bag inflates when sodium azide decomposes: 2 NaN₃(s) → 2 Na(s) + 3 N₂(g). A bag must be filled with 50.0 L of nitrogen at 1.00 atm and 27 °C. Answer (a), (b) and (c).

        (a) Calculate the moles of nitrogen needed.
        (b) Calculate the mass of sodium azide (65.02 g/mol) that must decompose.
        (c) Explain why the litre-ratio shortcut (reading coefficients as litres) cannot be used for this problem.
      answer: |
        (a) n = PV/(RT) = (1.00 atm × 50.0 L)/(0.08206 L·atm/(mol·K) × 300 K) = 50.0/24.62 = 2.03 mol N₂.
        (b) 2.03 mol N₂ × (2 mol NaN₃ / 3 mol N₂) = 1.354 mol NaN₃; × 65.02 g/mol = 88.0 g of NaN₃.
        (c) The shortcut rests on Avogadro's law, which relates volumes of gases at the same T and P. Sodium azide is a solid, so its coefficient is a mole ratio only; the nitrogen volume must be converted to moles with PV = nRT before the ratio is applied.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 2.03 mol (accept 2.0–2.1) with T = 300 K.

        (b) 1 pt: 2:3 ratio applied and 88.0 g (accept 87–89 g). Using 3:2 (198 g) earns nothing.

        (c) 1 pt: because NaN₃ is a solid (not a gas at the same conditions), coefficients give mole ratios, not volume ratios; Avogadro's law applies only to gases.

    - slug: chem-u05-w19-q22
      type: short_answer
      topic_code: "5.4"
      source: "NIST Chemistry WebBook (vapour pressure of water)"
      points: 3
      stimulus: |
        Two students collect oxygen from the same reaction over water in identical apparatus. Student A works at 20 °C, where water's vapour pressure is 17.5 torr; student B works at 30 °C, where it is 31.8 torr. Both collect 200 mL of gas at a barometric pressure of 760 torr.
      prompt: |
        Using the information, answer (a), (b) and (c).

        (a) Calculate the partial pressure of oxygen in each student's sample.
        (b) Explain why student B's sample contains a smaller mole fraction of oxygen even though the barometric pressure is the same.
        (c) Explain, without calculating, whether student A or student B collected more moles of oxygen, considering both the pressure and the temperature.
      answer: |
        (a) A: 760 − 17.5 = 742.5 torr (0.977 atm). B: 760 − 31.8 = 728.2 torr (0.958 atm).
        (b) The vapour pressure of water rises with temperature, so at 30 °C more water evaporates into the collected gas; water vapour takes a larger share of the fixed 760 torr total, leaving oxygen a smaller mole fraction (728/760 = 0.958 versus 742.5/760 = 0.977).
        (c) Student A. A's oxygen is at a higher partial pressure (742.5 versus 728.2 torr) and a lower temperature (293 versus 303 K); in n = PV/(RT) both differences raise n for the same 200 mL, so A's sample holds more moles of oxygen.
      explanation: |
        Three points, one per part.

        (a) 1 pt: both partial pressures correct (742.5 and 728.2 torr, or 0.977 and 0.958 atm).

        (b) 1 pt: vapour pressure of water increases with temperature, so water vapour occupies a larger fraction of the total pressure at 30 °C; mole fraction of O₂ = P_O₂/P_total.

        (c) 1 pt: student A, with both reasons: higher partial pressure of O₂ and lower kelvin temperature both increase n = PV/(RT) at equal V. One reason alone earns half credit at the teacher's discretion.

    # ---- Long answer
    - slug: chem-u05-w19-q23
      type: long_answer
      topic_code: "5.4"
      source: "general knowledge"
      points: 6
      prompt: |
        A chemist needs to find the percentage of calcium carbonate in a sample of impure limestone. She plans to react a weighed sample with excess hydrochloric acid, CaCO₃(s) + 2 HCl(aq) → CaCl₂(aq) + H₂O(l) + CO₂(g), collect the carbon dioxide over water, and work back from the gas volume to the mass of CaCO₃.

        Write a full account that (1) lists the measurements required and explains why each is needed; (2) explains how Dalton's law is used to find the pressure of the CO₂; (3) carries out the calculation for a 1.500 g sample that gives 285 mL of gas over water at 22 °C (vapour pressure 19.8 torr) and 755 torr barometric pressure (CaCO₃ 100.09 g/mol); and (4) states one assumption of the method and how it would affect the result if it were wrong.
      answer: |
        (1) Mass of the limestone sample (to find the percentage); volume of gas collected (to find moles of CO₂); temperature of the gas (for T in PV = nRT and for the vapour pressure of water); barometric pressure (the total pressure in the tube once the water levels are matched).

        (2) The collected gas is CO₂ mixed with water vapour. Dalton's law: P_total = P_CO₂ + P_water, so P_CO₂ = P_barometer − P_water(at that temperature) = 755 − 19.8 = 735.2 torr.

        (3) P_CO₂ = 735.2/760 = 0.9674 atm; V = 0.285 L; T = 295 K. n = PV/(RT) = (0.9674 × 0.285)/(0.08206 × 295) = 0.2757/24.21 = 0.01139 mol CO₂. The equation gives 1 mol CaCO₃ per mol CO₂, so 0.01139 mol CaCO₃ × 100.09 g/mol = 1.140 g. Percentage: 1.140/1.500 × 100 = 76.0% CaCO₃.

        (4) The method assumes all the CO₂ is captured and none dissolves in the water of the collecting trough. CO₂ is moderately soluble, so some gas is lost to the water; the measured volume is then too low, the moles of CO₂ too low, and the calculated percentage of CaCO₃ too low. (Other acceptable assumptions: the impurities do not react with acid to give gas, otherwise the result is too high; the gas is at the thermometer's temperature; the water levels were matched so P_total = P_barometer.)
      explanation: |
        Six points.

        Measurements (0–1): mass of sample, gas volume, temperature, barometric pressure, each with its purpose. Three of four with purposes earns the point.

        Dalton's law (0–1): P_CO₂ = P_total − P_water with the correct vapour pressure (19.8 torr) and value (735.2 torr, or 0.967 atm).

        Calculation (0–3): 1 pt for n(CO₂) ≈ 0.0114 mol with correct conversions (0.285 L, 295 K, 0.967 atm); 1 pt for the 1:1 ratio and mass of CaCO₃ ≈ 1.14 g; 1 pt for the percentage ≈ 76% (accept 75–77%).

        Assumption (0–1): a specific assumption with the direction of the error if it fails (CO₂ dissolving → result too low; gas-producing impurities → result too high; unmatched water levels or a temperature error, with direction reasoned).

        Common errors: using 22.4 L/mol at 22 °C; not subtracting the vapour pressure; mixing torr and atm; reporting grams of CaCO₃ as the percentage.
