week: 19
unit: 5
title: "Gas Stoichiometry and Dalton's Law of Partial Pressures"
topics: ["5.4"]
guide: guides/week-19.md
guide_description: |
  Gas volumes in stoichiometry: the law of combining volumes for gases at the same conditions, the mass-to-volume
  route through moles and PV = nRT, limiting reactants with gases, then Dalton's law of partial pressures, mole
  fractions and the correction for a gas collected over water, with a vapour-pressure table from NIST data.
flashcards_description: |
  27 cards on volume ratios, mass-to-gas-volume stoichiometry at STP and at lab conditions, Dalton's law, mole
  fractions and the over-water correction.

flashcards:
  - front: Law of combining volumes → the rule and who found it
    back: |
      Gases at the same temperature and pressure react in volume ratios that are small whole numbers equal to the coefficients of the balanced equation (Gay-Lussac, 1808). 2 H₂ + O₂ → 2 H₂O means 2 L + 1 L → 2 L of vapour.
    topic_code: "5.4"
  - front: Why volume ratios equal mole ratios for gases
    back: |
      Avogadro's law: at the same T and P, equal volumes hold equal numbers of molecules. So litres are proportional to moles, and the coefficients can be read as litres.
    topic_code: "5.4"
  - front: When the litre-ratio shortcut fails
    back: |
      Whenever a solid or liquid is involved, or the gases are at different temperatures or pressures. Then coefficients are mole ratios only, and you must go through moles.
    topic_code: "5.4"
  - front: Mass-to-gas-volume stoichiometry → the route
    back: |
      grams of A → moles of A (÷ molar mass) → moles of B (× mole ratio) → litres of B (× 22.4 L/mol at STP, or V = nRT/P otherwise).
    topic_code: "5.4"
  - front: Gas-volume-to-mass stoichiometry → the route
    back: |
      litres of A → moles of A (÷ 22.4 at STP, or n = PV/RT) → moles of B (× mole ratio) → grams of B (× molar mass). The air-bag problem (65.0 L N₂ → 126 g NaN₃) runs this way.
    topic_code: "5.4"
  - front: Zinc and hydrochloric acid → hydrogen volume at STP from 3.27 g Zn
    back: |
      Zn + 2 HCl → ZnCl₂ + H₂. 3.27 g ÷ 65.38 g/mol = 0.0500 mol Zn → 0.0500 mol H₂ → 0.0500 × 22.4 = 1.12 L at STP. At 22 °C and 0.980 atm it would be 1.23 L.
    topic_code: "5.4"
  - front: Propane combustion → oxygen and CO₂ volumes from 15.0 L propane
    back: |
      C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O. At the same conditions, 15.0 L of propane needs 75.0 L of O₂ and makes 45.0 L of CO₂; multiply by the coefficient ratio.
    topic_code: "5.4"
  - front: Limiting reactant when both reactants are gases at the same conditions
    back: |
      Divide each gas's volume by its coefficient; the smallest quotient is limiting. 10.0 L H₂ and 10.0 L O₂: H₂ gives 10.0/2 = 5.0, O₂ gives 10.0/1 = 10.0, so H₂ limits and 10.0 L of water vapour forms.
    topic_code: "5.4"
  - front: Dalton's law of partial pressures → the statement
    back: |
      The total pressure of a mixture of non-reacting gases is the sum of the partial pressures of its components: P_total = P₁ + P₂ + P₃ + … (John Dalton, 1801).
    topic_code: "5.4"
  - front: Partial pressure → definition
    back: |
      The pressure a gas in a mixture would exert if it alone filled the container at the same temperature. From PV = nRT it is proportional to that gas's moles.
    topic_code: "5.4"
  - front: Why Dalton's law follows from KMT
    back: |
      Ideal gas particles have no attractions and negligible volume, so each gas in a mixture collides with the walls exactly as if the others were absent; the pressures simply add.
    topic_code: "5.4"
  - front: Mole fraction → definition and formula
    back: |
      X_A = n_A / n_total, the moles of one component divided by the total moles of all components. Mole fractions in a mixture always add up to 1; it has no units.
    topic_code: "5.4"
  - front: Partial pressure from mole fraction
    back: |
      P_A = X_A × P_total. A mixture at 760 torr that is 40.0% CO₂ by moles has P_CO₂ = 0.400 × 760 = 304 torr.
    topic_code: "5.4"
  - front: Partial pressure of oxygen in air at sea level
    back: |
      Air is about 21% O₂ by moles, so at 1.00 atm the oxygen partial pressure is about 0.21 atm (160 torr). It is the partial pressure, not the percentage, that the lungs respond to.
    topic_code: "5.4"
  - front: Why breathing is hard on Everest → Dalton's law explanation
    back: |
      The air is still 21% oxygen, but the total pressure at the summit is about 0.33 atm, so the oxygen partial pressure is only about 0.069 atm, a third of its sea-level value.
    topic_code: "5.4"
  - front: Partial pressures of a He and O₂ mixture → the calculation
    back: |
      10.0 L at 298 K with 2.00 mol He and 0.500 mol O₂: P_He = nRT/V = 4.89 atm, P_O₂ = 1.22 atm, P_total = 6.11 atm. Check: X_O₂ = 0.200 and 0.200 × 6.11 = 1.22.
    topic_code: "5.4"
  - front: Collecting a gas over water → what the trapped gas contains
    back: |
      The gas plus water vapour. Water evaporates into the bubble until the vapour reaches its vapour pressure at that temperature, so the collected sample is a mixture.
    topic_code: "5.4"
  - front: Over-water correction → the equation
    back: |
      P_gas = P_total − P_water, where P_water is the vapour pressure of water at the collection temperature and P_total equals atmospheric pressure once the water levels are matched.
    topic_code: "5.4"
  - front: Vapour pressure of water at 20 °C, 25 °C and 30 °C
    back: |
      17.5 torr at 20 °C, 23.8 torr at 25 °C, 31.8 torr at 30 °C (NIST data, rounded). It depends on temperature only, not on how much gas is collected or on the atmospheric pressure.
    topic_code: "5.4"
  - front: Oxygen collected over water at 25 °C and 752 torr → moles in 250 mL
    back: |
      P_O₂ = 752 − 23.8 = 728 torr = 0.958 atm. n = PV/(RT) = (0.958 × 0.250)/(0.08206 × 298) = 9.79 × 10⁻³ mol. Skipping the correction overstates n by about 3%.
    topic_code: "5.4"
  - front: Why the water levels are matched before reading an over-water volume
    back: |
      When the water inside and outside the collecting tube is level, the pressure of the trapped gas mixture equals atmospheric pressure, so the barometer reading can be used as P_total.
    topic_code: "5.4"
  - front: Error spotting → subtracting 23.8 from a pressure in atm
    back: |
      Vapour pressures in the table are in torr. Convert the atmospheric pressure to torr first (or the vapour pressure to atm: 23.8/760 = 0.0313 atm) before subtracting.
    topic_code: "5.4"
  - front: Air bag chemistry → the equation and the stoichiometry
    back: |
      2 NaN₃(s) → 2 Na(s) + 3 N₂(g). To fill 65.0 L at 1.10 atm and 300 K: n(N₂) = PV/RT = 2.90 mol, × 2/3 = 1.94 mol NaN₃, × 65.02 g/mol = 126 g.
    topic_code: "5.4"
  - front: Molar volume at lab conditions versus STP in stoichiometry
    back: |
      Use 22.4 L/mol only at 0 °C and 1 atm. At 22 °C and 0.980 atm, a mole is RT/P = (0.08206 × 295)/0.980 = 24.7 L; use V = nRT/P.
    topic_code: "5.4"
  - front: Checking a partial-pressure answer
    back: |
      Every partial pressure must be smaller than the total, the partial pressures must add to the total, and the mole fractions must add to 1. A partial pressure larger than P_total means moles and grams were mixed up.
    topic_code: "5.4"
  - front: Mole fraction from masses → the trap
    back: |
      Convert each mass to moles first. 32.0 g O₂ and 28.0 g N₂ are 1.00 mol each, so X = 0.500 for both, even though the masses differ.
    topic_code: "5.4"
  - front: Calcium carbonate decomposition → CO₂ volume at STP from 10.0 g
    back: |
      CaCO₃ → CaO + CO₂. 10.0 g ÷ 100.09 g/mol = 0.0999 mol → 0.0999 mol CO₂ → 2.24 L at STP.
    topic_code: "5.4"

quiz:
  description: |
    23 questions · about 40 minutes · topic 5.4 (gas stoichiometry, Dalton's law of partial pressures, mole
    fractions and gases collected over water), with review of balancing equations (4.1), mass stoichiometry and
    limiting reactants (4.6, 4.7), the mole (4.4), the ideal gas law (5.3) and kinetic molecular theory (5.1).
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set A: hydrogen collected over water (5.4, 4.7)
    - slug: chem-u05-w19-q01
      type: multiple_choice
      topic_code: "5.4"
      source: "NIST Chemistry WebBook (vapour pressure of water)"
      points: 1
      stimulus: |
        A student reacts 0.243 g of magnesium ribbon with excess hydrochloric acid and collects the hydrogen over water at 25 °C. After levelling the water inside and outside the tube, the volume of gas is 251 mL. The barometer reads 758 torr. The vapour pressure of water at 25 °C is 23.8 torr.

        Mg(s) + 2 HCl(aq) → MgCl₂(aq) + H₂(g)
      prompt: |
        What is the partial pressure of the hydrogen in the collecting tube?
      options:
        - "758 torr"
        - "734 torr"
        - "782 torr"
        - "23.8 torr"
      option_explanations:
        - |
          758 torr is the total pressure of the hydrogen plus water vapour; the hydrogen alone exerts less.
        - |
          Correct. Dalton's law: P_H₂ = P_total − P_water = 758 − 23.8 = 734 torr.
        - |
          Adding the vapour pressure is backwards; water vapour is part of the 758 torr, not extra to it.
        - |
          23.8 torr is the partial pressure of the water vapour, not of the hydrogen.
      answer: 1

    - slug: chem-u05-w19-q02
      type: multiple_choice
      topic_code: "5.4"
      source: "NIST Chemistry WebBook (vapour pressure of water)"
      points: 1
      stimulus: |
        A student reacts 0.243 g of magnesium ribbon with excess hydrochloric acid and collects the hydrogen over water at 25 °C. After levelling the water inside and outside the tube, the volume of gas is 251 mL. The barometer reads 758 torr. The vapour pressure of water at 25 °C is 23.8 torr.

        Mg(s) + 2 HCl(aq) → MgCl₂(aq) + H₂(g)
      prompt: |
        How many moles of hydrogen were collected?
      options:
        - "0.0102 mol"
        - "2.48 mol"
        - "0.118 mol"
        - "9.92 × 10⁻³ mol"
      option_explanations:
        - |
          0.0102 mol is what you get without the water-vapour correction (758 torr); it is about 3% too high.
        - |
          2.48 mol is the result of using 251 mL as litres; 251 mL is 0.251 L.
        - |
          0.118 mol comes from using 25 K instead of 298 K; a sample this small cannot contain a tenth of a mole.
        - |
          Correct. P = 734/760 = 0.966 atm; n = PV/(RT) = (0.966 × 0.251)/(0.08206 × 298) = 0.2425/24.45 = 9.92 × 10⁻³ mol.
      answer: 3

    - slug: chem-u05-w19-q03
      type: multiple_choice
      topic_code: "4.7"
      source: "PubChem (molar mass of magnesium)"
      points: 1
      stimulus: |
        A student reacts 0.243 g of magnesium ribbon with excess hydrochloric acid and collects the hydrogen over water at 25 °C. After levelling the water inside and outside the tube, the volume of gas is 251 mL. The barometer reads 758 torr. The vapour pressure of water at 25 °C is 23.8 torr.

        Mg(s) + 2 HCl(aq) → MgCl₂(aq) + H₂(g)
      prompt: |
        The student's corrected result is 9.92 × 10⁻³ mol of H₂. What is the percent yield of hydrogen?
      options:
        - "99.2%"
        - "49.6%"
        - "102%"
        - "24.3%"
      option_explanations:
        - |
          Correct. Theoretical: 0.243 g ÷ 24.31 g/mol = 0.0100 mol Mg → 0.0100 mol H₂. Yield = 9.92 × 10⁻³ / 0.0100 = 99.2%.
        - |
          49.6% would follow from a 2:1 ratio, but the equation makes one mole of H₂ per mole of Mg.
        - |
          A yield over 100% would need more hydrogen than the magnesium can produce; it comes from using the uncorrected 0.0102 mol.
        - |
          24.3 is the molar mass of magnesium, not a percentage.
      answer: 0
      explanation: |
        Review of 4.7: percent yield = actual ÷ theoretical × 100, with the theoretical amount from the limiting reactant.

    # ---- Single items
    - slug: chem-u05-w19-q04
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Methane burns according to CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(g). What volume of oxygen is required to burn 5.0 L of methane completely, both gases measured at the same temperature and pressure?
      options:
        - "2.5 L"
        - "5.0 L"
        - "10 L"
        - "22.4 L"
      option_explanations:
        - |
          2.5 L is the volume of O₂ for 1.25 L of CH₄, or the result of dividing by 2 instead of multiplying.
        - |
          Equal volumes would mean a 1:1 ratio, but the equation needs two O₂ for every CH₄.
        - |
          Correct. For gases at the same conditions, volume ratios equal mole ratios: 5.0 L CH₄ × (2 L O₂ / 1 L CH₄) = 10 L O₂.
        - |
          22.4 L is the molar volume at STP; nothing in the question involves one mole of gas.
      answer: 2

    - slug: chem-u05-w19-q05
      type: multiple_choice
      topic_code: "5.4"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        Potassium chlorate decomposes on heating: 2 KClO₃(s) → 2 KCl(s) + 3 O₂(g). What volume of oxygen at STP is produced from 0.400 mol of KClO₃?
      options:
        - "13.4 L"
        - "8.96 L"
        - "5.97 L"
        - "26.9 L"
      option_explanations:
        - |
          Correct. 0.400 mol KClO₃ × (3 mol O₂ / 2 mol KClO₃) = 0.600 mol O₂; 0.600 × 22.4 L/mol = 13.4 L.
        - |
          8.96 L is 0.400 mol × 22.4, which skips the 3:2 mole ratio.
        - |
          5.97 L uses the ratio upside down (2/3 instead of 3/2).
        - |
          26.9 L would be 1.20 mol of O₂, twice the correct amount.
      answer: 0

    - slug: chem-u05-w19-q06
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        At the summit of a high mountain the air pressure is 0.40 atm, and the air is still about 21% oxygen by moles. Which statement correctly explains why breathing is difficult there?
      options:
        - "The percentage of oxygen in the air falls at high altitude."
        - "Oxygen molecules move more slowly at high altitude, so they are harder to absorb."
        - "The water vapour in the air displaces the oxygen."
        - "The partial pressure of oxygen is only about 0.084 atm, far below the 0.21 atm at sea level."
      option_explanations:
        - |
          The composition of dry air is nearly constant up to high altitudes; the mole fraction of O₂ stays near 0.21.
        - |
          Molecular speed depends on temperature, and cold air at altitude has only slightly slower molecules; this is not the reason.
        - |
          High-altitude air is very dry; water vapour is a smaller fraction there, not a larger one.
        - |
          Correct. P_O₂ = X_O₂ × P_total = 0.21 × 0.40 = 0.084 atm. The lungs load oxygen according to its partial pressure, which is what has fallen.
      answer: 3

    - slug: chem-u05-w19-q07
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A container holds 2.0 mol of N₂, 1.0 mol of O₂ and 1.0 mol of Ar at a total pressure of 4.0 atm. What is the partial pressure of nitrogen?
      options:
        - "1.0 atm"
        - "2.0 atm"
        - "4.0 atm"
        - "0.50 atm"
      option_explanations:
        - |
          1.0 atm is the partial pressure of the O₂ or the Ar, each with a mole fraction of 0.25.
        - |
          Correct. X_N₂ = 2.0/4.0 = 0.50; P_N₂ = 0.50 × 4.0 atm = 2.0 atm.
        - |
          4.0 atm is the total pressure; nitrogen is only half the moles, so it contributes half the pressure.
        - |
          0.50 is the mole fraction of nitrogen, not its partial pressure; it must be multiplied by the total pressure.
      answer: 1

    - slug: chem-u05-w19-q08
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        When the combustion of ethane is balanced with the smallest whole-number coefficients, ___ C₂H₆ + ___ O₂ → ___ CO₂ + ___ H₂O, what is the coefficient of O₂?
      options:
        - "5"
        - "3.5"
        - "7"
        - "4"
      option_explanations:
        - |
          Five O₂ would supply ten oxygen atoms, but 4 CO₂ + 6 H₂O need fourteen.
        - |
          3.5 balances the equation for one C₂H₆ but is not a whole number; doubling everything gives 2, 7, 4, 6.
        - |
          Correct. 2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O: carbon 4 = 4, hydrogen 12 = 12, oxygen 14 = 8 + 6.
        - |
          Four O₂ give eight oxygen atoms, which cannot supply 4 CO₂ (eight) and 6 H₂O (six) together.
      answer: 2
      explanation: |
        Review of 4.1: a correct gas-volume ratio depends on a correctly balanced equation; odd oxygen counts are fixed by doubling.

    - slug: chem-u05-w19-q09
      type: multiple_choice
      topic_code: "4.6"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        What mass of oxygen is needed to burn 16.0 g of methane completely? CH₄ + 2 O₂ → CO₂ + 2 H₂O (CH₄ 16.04 g/mol; O₂ 32.00 g/mol)
      options:
        - "63.8 g"
        - "32.0 g"
        - "16.0 g"
        - "8.0 g"
      option_explanations:
        - |
          Correct. 16.0 g ÷ 16.04 g/mol = 0.998 mol CH₄; × 2 = 1.995 mol O₂; × 32.00 g/mol = 63.8 g.
        - |
          32.0 g is one mole of O₂, but two moles are needed for each mole of methane.
        - |
          Equal masses would need a 1:1 ratio of equal molar masses; neither is true here.
        - |
          8.0 g of O₂ is a quarter of a mole, far too little for a mole of methane.
      answer: 0
      explanation: |
        Review of 4.6: grams → moles → mole ratio → grams, the backbone of this week's gas problems too.

    - slug: chem-u05-w19-q10
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A reaction produces 0.250 mol of CO₂ at 35 °C and 0.950 atm. What volume does the gas occupy?
      options:
        - "5.60 L"
        - "0.756 L"
        - "7.17 L"
        - "6.65 L"
      option_explanations:
        - |
          5.60 L is 0.250 × 22.4, the STP volume, but the gas is at 35 °C and 0.950 atm, not STP.
        - |
          0.756 L comes from using 35 K instead of 308 K.
        - |
          7.17 L would need a temperature of about 332 K (59 °C); the arithmetic went wrong somewhere.
        - |
          Correct. V = nRT/P = (0.250 × 0.08206 × 308)/0.950 = 6.319/0.950 = 6.65 L.
      answer: 3
      explanation: |
        Review of 5.3: away from STP the ideal gas law, not 22.4 L/mol, converts moles to litres.

    - slug: chem-u05-w19-q11
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student collects oxygen over water but forgets to subtract the vapour pressure of water before calculating the moles of oxygen. How does this affect the result?
      options:
        - "The calculated moles are too low, because the water vapour was not counted."
        - "The calculated moles are too high, because the pressure used includes the water vapour's contribution."
        - "There is no effect, because water vapour is not a gas."
        - "The calculated moles are too high only if the temperature is above 100 °C."
      option_explanations:
        - |
          The water vapour should not be counted at all; including it in the pressure attributes its collisions to oxygen.
        - |
          Correct. The total pressure is larger than the oxygen's partial pressure, so n = PV/(RT) with the total pressure overstates the oxygen by the vapour's share (about 3% at 25 °C).
        - |
          Water vapour is a gas that exerts its own partial pressure inside the collecting tube.
        - |
          Water has a vapour pressure at every temperature; the correction matters at room temperature, where gases are usually collected.
      answer: 1

    # ---- Select all
    - slug: chem-u05-w19-q12
      type: multi_select
      topic_code: "5.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about a mixture of helium and neon in a rigid container are correct? Select all that apply.
      options:
        - "The total pressure is the sum of the helium and neon partial pressures."
        - "The gas with the larger mole fraction has the larger partial pressure."
        - "The partial pressure of helium depends on how much neon is present."
        - "The mole fractions of helium and neon add up to 1."
        - "Because neon atoms are heavier, each neon atom contributes more to the pressure than each helium atom."
      option_explanations:
        - |
          Correct. That is Dalton's law of partial pressures.
        - |
          Correct. P_A = X_A × P_total, so partial pressure is proportional to mole fraction.
        - |
          Helium's partial pressure is n_He RT/V, which does not involve neon at all; ideal gases ignore one another.
        - |
          Correct. Mole fractions are each component's share of the total moles, so they sum to 1.
        - |
          At the same temperature every particle has the same average kinetic energy and contributes equally to the pressure; mass does not matter.
      answer: [0, 1, 3]

    - slug: chem-u05-w19-q13
      type: multi_select
      topic_code: "4.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        6.0 L of hydrogen and 6.0 L of oxygen, at the same temperature and pressure, are ignited: 2 H₂(g) + O₂(g) → 2 H₂O(g). Which statements are correct? Select all that apply.
      options:
        - "Hydrogen is the limiting reactant."
        - "Oxygen is the limiting reactant."
        - "6.0 L of water vapour forms (at the original conditions)."
        - "3.0 L of oxygen is left over."
        - "12 L of water vapour forms."
      option_explanations:
        - |
          Correct. H₂: 6.0/2 = 3.0; O₂: 6.0/1 = 6.0. The smaller quotient belongs to hydrogen.
        - |
          Oxygen is in excess: only 3.0 L of it is needed to react with 6.0 L of hydrogen.
        - |
          Correct. 6.0 L H₂ × (2 L H₂O / 2 L H₂) = 6.0 L of water vapour.
        - |
          Correct. 6.0 L of H₂ uses 3.0 L of O₂, leaving 6.0 − 3.0 = 3.0 L.
        - |
          12 L would require 12 L of hydrogen; the product volume equals the hydrogen volume because the H₂:H₂O ratio is 2:2.
      answer: [0, 2, 3]
      explanation: |
        Review of 4.7: divide each amount by its coefficient; for gases at the same conditions, litres work as well as moles.

    # ---- True / false
    - slug: chem-u05-w19-q14
      type: true_false
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In the reaction 2 Mg(s) + O₂(g) → 2 MgO(s), 2 L of magnesium reacts with 1 L of oxygen.
      answer: false
      explanation: |
        False. The law of combining volumes applies only to gases at the same temperature and pressure. Magnesium and magnesium oxide are solids, so their coefficients are mole ratios, not litre ratios; the magnesium must be converted to moles through its molar mass.

    - slug: chem-u05-w19-q15
      type: true_false
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: According to kinetic molecular theory, 1.0 mol of argon and 1.0 mol of helium in the same container at the same temperature contribute equal partial pressures, even though argon atoms are ten times heavier.
      answer: true
      explanation: |
        True. At a given temperature every gas has the same average kinetic energy per particle; heavier argon atoms move more slowly but hit harder, and the two effects cancel. Equal moles at equal T and V give equal partial pressures, which is why Dalton's law and the ideal gas law never mention the identity of the gas.

    # ---- Fill in the blank
    - slug: chem-u05-w19-q16
      type: fill_blank
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        In any gas mixture, the mole fractions of all the components add up to ____.
      answer: ["1", "1.0", "1.00", "one", "unity"]
      explanation: |
        Each mole fraction is that component's share of the total moles, so the shares sum to 1. The same is true of the fractions of the total pressure, which is Dalton's law restated.

    - slug: chem-u05-w19-q17
      type: fill_blank
