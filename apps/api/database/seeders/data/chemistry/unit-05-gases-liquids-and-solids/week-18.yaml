week: 18
unit: 5
title: "The Combined and Ideal Gas Laws"
topics: ["5.3"]
guide: guides/week-18.md
guide_description: |
  How the three simple gas laws fold into the combined gas law, Avogadro's law and the 22.4 L molar volume at STP,
  then the ideal gas law PV = nRT: choosing the right R, solving for any one variable, and rearranging it to find
  the density or the molar mass of a gas. Worked examples include a weather balloon, a compressed oxygen cylinder
  and identifying an unknown gas from a weighing.
flashcards_description: |
  27 cards on the combined gas law, Avogadro's law, molar volume, the ideal gas law and its constant R, and the
  density and molar-mass forms of PV = nRT.

flashcards:
  - front: Combined gas law → the equation and when to use it
    back: |
      P₁V₁/T₁ = P₂V₂/T₂ for a fixed amount of gas. Use it when a sample moves from one state to another and two of P, V and T change at once; cancel any variable that stays constant.
    topic_code: "5.3"
  - front: Recovering Boyle's law from the combined gas law
    back: |
      Set T₁ = T₂ so the temperatures cancel, leaving P₁V₁ = P₂V₂. Charles's law (constant P) and Gay-Lussac's law (constant V) fall out the same way.
    topic_code: "5.3"
  - front: Avogadro's law → the statement and the proportionality
    back: |
      At the same temperature and pressure, equal volumes of gases contain equal numbers of particles, so V is proportional to n. Doubling the moles of gas doubles the volume.
    topic_code: "5.3"
  - front: Why Avogadro's law follows from KMT
    back: |
      Pressure depends only on how many particles there are and how fast they move. If particles have no volume and no attractions, their identity is irrelevant, so one mole of any gas fills the same volume at a given T and P.
    topic_code: "5.3"
  - front: Molar volume of a gas at STP
    back: |
      22.4 L per mole at 0 °C and 1 atm. It converts litres to moles in one step for any gas, but only at STP; elsewhere use PV = nRT.
    topic_code: "5.3"
  - front: Molar volume at room conditions (25 °C, 1 atm)
    back: |
      About 24.5 L/mol, from V = nRT/P = (1)(0.08206)(298)/1. Using 22.4 L/mol at 25 °C is a common error worth about 9%.
    topic_code: "5.3"
  - front: Ideal gas law → the equation and what each symbol means
    back: |
      PV = nRT. P pressure, V volume in litres, n amount in moles, R the gas constant, T temperature in kelvin. It describes one state of a gas; the combined law describes a change.
    topic_code: "5.3"
  - front: R in L·atm units → value and when to use it
    back: |
      0.08206 L·atm/(mol·K). Use it when pressure is in atmospheres and volume in litres. Convert torr to atm (divide by 760) before using it.
    topic_code: "5.3"
  - front: R in SI units → value and when to use it
    back: |
      8.314 J/(mol·K), which is the same as 8.314 L·kPa/(mol·K) because 1 L·kPa = 1 J. Use it when pressure is in kPa and volume in litres.
    topic_code: "5.3"
  - front: Where the number 0.08206 comes from
    back: |
      One mole of an ideal gas at 273.15 K and 1 atm occupies 22.414 L, so R = PV/(nT) = (1 × 22.414)/(1 × 273.15) = 0.08206 L·atm/(mol·K).
    topic_code: "5.3"
  - front: Ideal gas law solved for n
    back: |
      n = PV/(RT). Example: 6.00 L at 2.50 atm and 300 K holds (2.50 × 6.00)/(0.08206 × 300) = 0.609 mol.
    topic_code: "5.3"
  - front: Ideal gas law solved for P
    back: |
      P = nRT/V. Example: 0.750 mol in 10.0 L at 313 K exerts (0.750 × 8.314 × 313)/10.0 = 195 kPa, or 1.93 atm with the other R.
    topic_code: "5.3"
  - front: Ideal gas law solved for V and for T
    back: |
      V = nRT/P and T = PV/(nR). Always rearrange with symbols first, then substitute numbers with units, so the units of R dictate the units of the answer.
    topic_code: "5.3"
  - front: Ideal gas law versus combined gas law → which to use
    back: |
      One state, three of P, V, n, T known, one unknown: ideal gas law. The same sample before and after a change, with n fixed: combined gas law. Both work, but the combined law is faster for changes.
    topic_code: "5.3"
  - front: Density of a gas from the ideal gas law
    back: |
      d = PM/(RT), where M is the molar mass. Density rises with pressure and molar mass and falls with temperature. Nitrogen at 20 °C and 0.950 atm: (0.950 × 28.02)/(0.08206 × 293) = 1.11 g/L.
    topic_code: "5.3"
  - front: Molar mass of a gas from a weighing
    back: |
      M = mRT/(PV), or M = dRT/P from a density. Weigh a known volume at known P and T and solve. A 0.500 L flask holding 0.918 g at 373 K and 1.00 atm gives 56.2 g/mol.
    topic_code: "5.3"
  - front: Molar mass from density at STP → the shortcut
    back: |
      M = d × 22.4 L/mol. A gas of density 1.96 g/L at STP has M = 43.9 g/mol, which identifies it as CO₂ (44.01 g/mol).
    topic_code: "5.3"
  - front: Why hot-air balloons rise → the gas-law reason
    back: |
      Density d = PM/(RT): at the same pressure and molar mass, warmer air is less dense than the cooler air outside, so the balloon is buoyant. Helium balloons rise instead because M is small.
    topic_code: "5.3"
  - front: Average molar mass of air
    back: |
      About 29 g/mol, a weighted average of N₂ (28.02, 78%) and O₂ (32.00, 21%) with a little argon. A gas with M below 29 is lighter than air (He, CH₄, NH₃); above 29 is heavier (CO₂, Cl₂, SO₂).
    topic_code: "5.3"
  - front: Checking direction before computing a combined-law answer
    back: |
      Decide separately whether each change should raise or lower the unknown. Pressure 755 → 320 torr: volume up (×2.36). Temperature 295 → 238 K: volume down (×0.81). Net ×1.90. If the arithmetic disagrees, a ratio is upside down.
    topic_code: "5.3"
  - front: Units of V in PV = nRT
    back: |
      Litres, with either value of R. Convert millilitres by dividing by 1,000 (250 mL = 0.250 L) and cubic metres by multiplying by 1,000.
    topic_code: "5.3"
  - front: Error spotting → an ideal gas answer of 1.93 reported as kPa
    back: |
      1.93 is what 0.08206 L·atm/(mol·K) gives, so it is in atm. With 8.314 L·kPa/(mol·K) the same calculation gives 195 kPa. The R chosen decides the unit of the answer.
    topic_code: "5.3"
  - front: Real gases and the ideal gas law → when PV = nRT works best
    back: |
      At high temperature and low pressure, where particles are fast and far apart. Deviations grow near the condensation point and at pressures of hundreds of atmospheres, when attractions and particle volume matter.
    topic_code: "5.3"
  - front: Mass of a gas from PV = nRT
    back: |
      Find n = PV/(RT), then multiply by the molar mass. A 12.0 L oxygen cylinder at 150 atm and 298 K holds 73.6 mol, which is 73.6 × 32.00 = 2,355 g.
    topic_code: "5.3"
  - front: Litres to moles at STP → the conversion factor
    back: |
      Divide litres by 22.4 L/mol. 11.2 L is 0.500 mol; 44.8 L is 2.00 mol; 5.60 L is 0.250 mol. Reverse it (multiply by 22.4) to go from moles to litres.
    topic_code: "5.3"
  - front: Significant figures with R
    back: |
      R = 0.08206 has four significant figures, so it rarely limits the answer; the measured P, V, n or T usually does. Keep an extra digit in intermediate steps and round once.
    topic_code: "5.3"
  - front: Torr in the ideal gas law → what to do first
    back: |
      Divide by 760 to convert to atm, then use 0.08206 L·atm/(mol·K). 740 torr is 0.974 atm. There is no commonly used R in torr units.
    topic_code: "5.3"

quiz:
  description: |
    23 questions · about 40 minutes · topic 5.3 (the combined and ideal gas laws, Avogadro's law, molar volume,
    gas density and molar mass), with review of the simple gas laws (5.2), kinetic molecular theory (5.1), the mole
    and molar mass (4.4) and significant figures (1.4). Multiple choice, select-all, true/false and numeric items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: identifying a gas from a weighing (5.3, 4.4)
    - slug: chem-u05-w18-q01
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student fills an evacuated 0.250 L flask with an unknown gas at 1.00 atm and 27 °C. The gas in the flask has a mass of 0.650 g.
      prompt: |
        How many moles of gas are in the flask?
      options:
        - "0.113 mol"
        - "0.0925 mol"
        - "0.0102 mol"
        - "0.250 mol"
      option_explanations:
        - |
          0.113 comes from using 27 K instead of 300 K; the temperature must be converted to kelvin before substituting.
        - |
          0.0925 is 0.250 L ÷ 2.70, which has no meaning here; the denominator must be R × T = 0.08206 × 300 = 24.6.
        - |
          Correct. n = PV/(RT) = (1.00 atm × 0.250 L)/(0.08206 L·atm/(mol·K) × 300 K) = 0.250/24.6 = 0.0102 mol.
        - |
          0.250 is the volume in litres; a volume is not an amount of gas unless the conditions are STP and you divide by 22.4 L/mol.
      answer: 2
      explanation: |
        Skill: solving the ideal gas law for n. Convert 27 °C to 300 K, then divide PV by RT.

    - slug: chem-u05-w18-q02
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student fills an evacuated 0.250 L flask with an unknown gas at 1.00 atm and 27 °C. The gas in the flask has a mass of 0.650 g.
      prompt: |
        What is the molar mass of the gas?
      options:
        - "64.0 g/mol"
        - "2.60 g/mol"
        - "16.0 g/mol"
        - "5.76 g/mol"
      option_explanations:
        - |
          Correct. M = mRT/(PV) = (0.650 g × 0.08206 × 300 K)/(1.00 atm × 0.250 L) = 16.0/0.250 = 64.0 g/mol; equivalently 0.650 g ÷ 0.0102 mol.
        - |
          2.60 g/mol is the mass divided by the volume in litres (0.650/0.250); that is a density in g/L, not a molar mass.
        - |
          16.0 is the value of mRT, the numerator, before dividing by PV = 0.250 L·atm.
        - |
          5.76 comes from using 27 K instead of 300 K in the numerator; kelvin is required.
      answer: 0
      explanation: |
        Skill: the molar-mass form of the ideal gas law. Mass over moles, where moles come from PV/(RT).

    - slug: chem-u05-w18-q03
      type: multiple_choice
      topic_code: "4.4"
      source: "PubChem (molar masses)"
      points: 1
      stimulus: |
        A student fills an evacuated 0.250 L flask with an unknown gas at 1.00 atm and 27 °C. The gas in the flask has a mass of 0.650 g.
      prompt: |
        The student's calculated molar mass is 64.0 g/mol. Which of these gases is the sample most likely to be?
      options:
        - "Carbon dioxide, CO₂"
        - "Oxygen, O₂"
        - "Chlorine, Cl₂"
        - "Sulfur dioxide, SO₂"
      option_explanations:
        - |
          CO₂ has a molar mass of 12.01 + 2(16.00) = 44.01 g/mol, well below 64.
        - |
          O₂ is 2(16.00) = 32.00 g/mol, exactly half the measured value.
        - |
          Cl₂ is 2(35.45) = 70.90 g/mol, about 11% too high to match a measurement of 64.0.
        - |
          Correct. SO₂ is 32.06 + 2(16.00) = 64.06 g/mol, matching the measured 64.0 g/mol within the experiment's precision.
      answer: 3
      explanation: |
        Review of 4.4: molar mass from the formula and the periodic table is the bridge between a gas measurement and an identity.

    # ---- Single items
    - slug: chem-u05-w18-q04
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A weather balloon rises from the ground (1.00 atm, 20 °C) to an altitude where the pressure is 0.400 atm and the temperature is −40 °C. Without calculating exactly, which statement about its volume is correct?
      options:
        - "It decreases, because the colder temperature contracts the gas."
        - "It increases, because the pressure drop expands the gas by more than the cooling shrinks it."
        - "It stays the same, because the two changes cancel exactly."
        - "It increases by a factor of exactly 2.5, because only pressure affects volume."
      option_explanations:
        - |
          Cooling from 293 K to 233 K shrinks the gas by a factor of 0.80, but the pressure drop expands it by a factor of 2.5; the net effect is expansion.
        - |
          Correct. Combined law: V₂/V₁ = (P₁/P₂)(T₂/T₁) = 2.5 × 0.795 ≈ 2.0; the balloon roughly doubles in volume.
        - |
          The factors are 2.5 and 0.80; their product is about 2.0, not 1, so the changes do not cancel.
        - |
          Temperature affects volume too; ignoring the cooling overstates the expansion by about 20%.
      answer: 1

    - slug: chem-u05-w18-q05
      type: multiple_choice
      topic_code: "5.3"
      source: "NIST CODATA (gas constant)"
      points: 1
      prompt: |
        A problem gives a pressure in kilopascals and a volume in litres. Which value of R should be used in PV = nRT so that no unit conversion is needed?
      options:
        - "0.08206 L·atm/(mol·K)"
        - "22.4 L/mol"
        - "6.022 × 10²³ mol⁻¹"
        - "8.314 L·kPa/(mol·K)"
      option_explanations:
        - |
          This R works with atmospheres; using it with kPa gives a value of n that is 101.3 times too large.
        - |
          22.4 L/mol is the molar volume at STP, not the gas constant; it has no pressure unit.
        - |
          6.022 × 10²³ is Avogadro's number, which counts particles per mole and is not used in the ideal gas law.
        - |
          Correct. 8.314 J/(mol·K) is identical to 8.314 L·kPa/(mol·K) because 1 L·kPa = 1 J, so pressures in kPa drop straight in.
      answer: 3

    - slug: chem-u05-w18-q06
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Two identical balloons at the same temperature and pressure are filled, one with helium and one with carbon dioxide, to the same volume. Which statement is correct?
      options:
        - "Both balloons contain the same number of molecules, but the carbon dioxide balloon is heavier."
        - "The helium balloon contains more atoms because helium atoms are smaller."
        - "The carbon dioxide balloon contains more molecules because CO₂ is denser."
        - "Both balloons have the same mass because they have the same volume."
      option_explanations:
        - |
          Correct. Avogadro's law: equal volumes at the same T and P hold equal numbers of particles. With 44.01 g/mol against 4.00 g/mol, the CO₂ balloon is eleven times heavier.
        - |
          Particle size is irrelevant in an ideal gas; the number of particles depends only on V, T and P.
        - |
          CO₂ is denser because each molecule is heavier, not because there are more of them.
        - |
          Equal volume means equal moles, and equal moles of gases with different molar masses have different masses.
      answer: 0

    - slug: chem-u05-w18-q07
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        What volume does 0.400 mol of nitrogen gas occupy at STP?
      options:
        - "11.2 L"
        - "56.0 L"
        - "8.96 L"
        - "22.4 L"
      option_explanations:
        - |
          11.2 L is the volume of 0.500 mol at STP, not 0.400 mol.
        - |
          56.0 L comes from dividing 22.4 by 0.400 instead of multiplying.
        - |
          Correct. V = n × 22.4 L/mol = 0.400 × 22.4 = 8.96 L. The same result comes from V = nRT/P with T = 273 K and P = 1 atm.
        - |
          22.4 L is the volume of exactly one mole at STP.
      answer: 2

    - slug: chem-u05-w18-q08
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A gas sample is compressed from 6.00 L to 1.50 L while held at a constant temperature of 25 °C. Which single law gives the new pressure most directly, and by what factor does the pressure change?
      options:
        - "Charles's law; the pressure rises by a factor of 4"
        - "Boyle's law; the pressure rises by a factor of 4"
        - "Gay-Lussac's law; the pressure falls by a factor of 4"
        - "Boyle's law; the pressure falls by a factor of 4"
      option_explanations:
        - |
          Charles's law relates volume and temperature at constant pressure; here it is the temperature that is constant.
        - |
          Correct. With T constant, P₁V₁ = P₂V₂; the volume is divided by 4, so the pressure is multiplied by 4.
        - |
          Gay-Lussac's law needs constant volume, and the volume here changes; the direction is also wrong.
        - |
          The law is right but the direction is wrong: compressing a gas raises its pressure.
      answer: 1
      explanation: |
        Review of 5.2: when only P and V change, the combined law reduces to Boyle's law.

    - slug: chem-u05-w18-q09
      type: multiple_choice
      topic_code: "4.4"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        How many moles of carbon dioxide are in 8.80 g of CO₂ (molar mass 44.01 g/mol)?
      options:
        - "387 mol"
        - "0.500 mol"
        - "5.00 mol"
        - "0.200 mol"
      option_explanations:
        - |
          387 is 8.80 × 44.01; multiplying mass by molar mass gives g²/mol, not moles.
        - |
          0.500 mol of CO₂ would have a mass of 22.0 g, not 8.80 g.
        - |
          5.00 is the inverse ratio (44.01/8.80); a mass smaller than the molar mass must be less than one mole.
        - |
          Correct. n = m/M = 8.80 g / 44.01 g/mol = 0.200 mol.
      answer: 3
      explanation: |
        Review of 4.4: moles = mass ÷ molar mass. This conversion is the first step of every gas problem that gives a mass.

    - slug: chem-u05-w18-q10
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        According to d = PM/(RT), which change would make a sample of air LESS dense?
      options:
        - "Raising its temperature at constant pressure"
        - "Raising its pressure at constant temperature"
        - "Replacing some of the nitrogen with argon (39.95 g/mol) at the same T and P"
        - "Cooling it at constant pressure"
      option_explanations:
        - |
          Correct. T is in the denominator, so warming the air at fixed pressure lowers its density; this is why warm air rises and hot-air balloons fly.
        - |
          P is in the numerator: compressing air packs more molecules into each litre and raises the density.
        - |
          Argon is heavier than nitrogen (28.02 g/mol), so the average molar mass M rises and the density with it.
        - |
          Cooling lowers T, which raises the density; cold air sinks.
      answer: 0

    - slug: chem-u05-w18-q11
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student computes V = nRT/P with n = 0.50 mol, R = 0.08206 L·atm/(mol·K), T = 298 K and P = 1.00 atm and gets 12.22694 L on the calculator. How should the answer be reported?
      options:
        - "12.22694 L, because every calculator digit is meaningful"
        - "12 L, because the least precise measurement, 0.50 mol, has two significant figures"
        - "12.2 L, because R has four significant figures and the answer should have one fewer"
        - "12.23 L, because temperature has three significant figures and pressure has three"
      option_explanations:
        - |
          A calculated result can never be more precise than the data it came from; reporting seven digits implies a precision the measurements do not have.
        - |
          Correct. In multiplication and division the result carries the smallest number of significant figures among the inputs; 0.50 mol has two, so the volume is 12 L.
        - |
          R is a constant known to more figures than the data, so it does not limit the answer; and there is no "one fewer" rule.
        - |
          Three significant figures would be right only if the least precise input had three; 0.50 mol has two.
      answer: 1
      explanation: |
        Review of 1.4: the measured quantity with the fewest significant figures sets the precision of a product or quotient.

    # ---- Select all
    - slug: chem-u05-w18-q12
      type: multi_select
      topic_code: "5.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the ideal gas law PV = nRT are correct? Select all that apply.
      options:
        - "The temperature T must be in kelvin."
        - "The value of R depends on the units chosen for pressure and volume."
        - "It can be used directly to find the final volume of a gas that is heated and compressed, without knowing n."
        - "Rearranged, it gives the density of a gas as d = PM/(RT)."
        - "It predicts that one mole of any ideal gas occupies 22.4 L at STP."
      option_explanations:
        - |
          Correct. R is defined with kelvin temperature; a Celsius value gives a wrong or even negative result.
        - |
          Correct. 0.08206 L·atm/(mol·K) and 8.314 L·kPa/(mol·K) are the same constant expressed in different pressure units.
        - |
          Finding a final state from an initial state without n is the job of the combined gas law; PV = nRT needs n (or needs to be applied twice).
        - |
          Correct. Substituting n = m/M and d = m/V into PV = nRT gives d = PM/(RT).
        - |
          Correct. V = nRT/P = (1 mol)(0.08206)(273.15 K)/(1 atm) = 22.4 L.
      answer: [0, 1, 3, 4]

    - slug: chem-u05-w18-q13
      type: multi_select
      topic_code: "5.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Avogadro's law says that equal volumes of different gases at the same temperature and pressure contain equal numbers of particles. Which assumptions of kinetic molecular theory make this true? Select all that apply.
      options:
        - "The particles themselves have negligible volume, so a big molecule takes no more room than a small one."
        - "The particles do not attract one another, so their chemical identity does not change the pressure they exert."
        - "All gas particles have the same mass."
        - "Average kinetic energy depends only on temperature, so at a given T every gas pushes on the walls with the same average energy per particle."
        - "Collisions between particles are inelastic."
      option_explanations:
        - |
          Correct. If particle size were significant, a mole of large molecules would need more room than a mole of small ones.
        - |
          Correct. Attractions would make some gases exert less pressure for the same number of particles; assuming none makes the count all that matters.
        - |
          Gas particles differ enormously in mass (H₂ at 2 g/mol, SO₂ at 64 g/mol); KMT does not assume equal masses, and it does not need to.
        - |
          Correct. Equal average kinetic energy per particle at the same T means the pressure depends only on how many particles there are per litre.
        - |
          KMT assumes elastic collisions; inelastic collisions would drain kinetic energy and are not part of the model.
      answer: [0, 1, 3]
      explanation: |
        Review of 5.1 applied to 5.3: Avogadro's law is a consequence of a gas being "all empty space and motion".

    # ---- True / false
    - slug: chem-u05-w18-q14
      type: true_false
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: One mole of any ideal gas occupies 22.4 L at 25 °C and 1 atm.
      answer: false
      explanation: |
        False. 22.4 L/mol is the molar volume at STP, which is 0 °C and 1 atm. At 25 °C (298 K) the molar volume is nRT/P = (0.08206)(298)/1 = 24.5 L. The 22.4 shortcut is valid only at STP.

    - slug: chem-u05-w18-q15
      type: true_false
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: If a fixed amount of gas has its pressure doubled and its kelvin temperature doubled at the same time, its volume is unchanged.
      answer: true
      explanation: |
        True. In the combined gas law V₂ = V₁ × (P₁/P₂) × (T₂/T₁) = V₁ × (1/2) × 2 = V₁. The Boyle effect (halving) and the Charles effect (doubling) cancel exactly.

    # ---- Fill in the blank
    - slug: chem-u05-w18-q16
      type: fill_blank
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        At STP one mole of an ideal gas occupies ____ litres.
      answer: ["22.4", "22.4 L", "22.4 litres", "22.4 liters", "22.41", "22.414"]
      explanation: |
        V = nRT/P = (1 mol)(0.08206 L·atm/(mol·K))(273.15 K)/(1 atm) = 22.4 L. The molar volume is the same for every ideal gas, which is Avogadro's law in numbers.

    - slug: chem-u05-w18-q17
      type: fill_blank
      topic_code: "4.4"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        The molar mass of oxygen gas, O₂, is ____ g/mol.
      answer: ["32.00", "32", "32.0", "32.00 g/mol", "32 g/mol"]
      explanation: |
        Oxygen gas is diatomic, so its molar mass is twice the atomic mass of oxygen: 2 × 16.00 = 32.00 g/mol. Forgetting the subscript 2 and using 16.00 g/mol is the classic error in gas density problems.

    # ---- Numeric
    - slug: chem-u05-w18-q18
      type: numeric
      topic_code: "5.3"
      source: "NIST CODATA (gas constant)"
      points: 1
      prompt: |
        How many moles of gas are in a 6.00 L container at 2.50 atm and 300 K? Use R = 0.08206 L·atm/(mol·K). Give your answer in moles to three decimal places.
      answer: { value: 0.609, tolerance: 0.005 }
      explanation: |
        n = PV/(RT) = (2.50 atm × 6.00 L)/(0.08206 L·atm/(mol·K) × 300 K) = 15.0/24.62 = 0.609 mol.

    - slug: chem-u05-w18-q19
      type: numeric
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A gas occupies 3.00 L at 100 kPa and 280 K. What is its volume at 150 kPa and 350 K? Give your answer in litres to two decimal places.
      answer: { value: 2.50, tolerance: 0.01 }
      explanation: |
        Combined gas law: V₂ = P₁V₁T₂/(P₂T₁) = (100 × 3.00 × 350)/(150 × 280) = 105,000/42,000 = 2.50 L. The pressure rise shrinks the gas by 2/3 and the warming expands it by 1.25; 3.00 × 0.667 × 1.25 = 2.50.

    - slug: chem-u05-w18-q20
      type: numeric
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A gas has a density of 1.25 g/L at STP. What is its molar mass? Give your answer in g/mol to one decimal place.
      answer: { value: 28.0, tolerance: 0.1 }
      explanation: |
        At STP one mole occupies 22.4 L, so M = d × 22.4 L/mol = 1.25 × 22.4 = 28.0 g/mol. The same comes from M = dRT/P = (1.25 × 0.08206 × 273.15)/1.00 = 28.0. Nitrogen (28.02) and carbon monoxide (28.01) both fit.

    # ---- Short answer
    - slug: chem-u05-w18-q21
      type: short_answer
      topic_code: "5.3"
      source: "general knowledge"
      points: 3
      prompt: |
        A 2.00 L steel cylinder contains 0.800 mol of helium at 27 °C. Answer (a), (b) and (c).

        (a) Calculate the pressure in the cylinder in atm.
        (b) The cylinder is heated to 127 °C. Explain which law gives the new pressure most directly, and find it.
        (c) A second, identical cylinder holds 0.800 mol of argon at 27 °C. Explain whether its pressure is higher, lower or the same as the helium cylinder's, and why.
      answer: |
        (a) P = nRT/V = (0.800 mol × 0.08206 L·atm/(mol·K) × 300 K)/2.00 L = 19.69/2.00 = 9.85 atm.
        (b) The volume and amount are fixed, so Gay-Lussac's law P₁/T₁ = P₂/T₂ applies: P₂ = 9.85 atm × (400 K/300 K) = 13.1 atm. (The ideal gas law with T = 400 K gives the same 13.1 atm.)
        (c) The same. The ideal gas law contains n, V and T but nothing about the identity of the gas; 0.800 mol of argon at the same T and V exerts the same 9.85 atm, because at a given temperature every gas has the same average kinetic energy per particle and the same number of particles hit the walls.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 9.85 atm (accept 9.8–9.9) with T converted to 300 K. Zero if 27 K is used.

        (b) 1 pt: names Gay-Lussac's law (or the combined law with V constant, or a second ideal-gas calculation) and gets 13.1 atm (accept 13.0–13.2). Zero for a ratio of Celsius temperatures.

        (c) 1 pt: the same pressure, because the ideal gas law (Avogadro's law, KMT) does not depend on the gas's identity; equal moles at equal T and V give equal P. Zero for "argon is heavier so the pressure is higher".

    - slug: chem-u05-w18-q22
      type: short_answer
      topic_code: "5.3"
      source: "general knowledge"
      points: 3
      stimulus: |
        A student measures the mass of 1.00 L of two gases at 25 °C and 1.00 atm.

        | Gas | Mass of 1.00 L (g) |
        |---|---|
        | Gas A | 0.164 |
        | Gas B | 1.80 |
      prompt: |
        Using the table, answer (a), (b) and (c).

        (a) Calculate the molar mass of gas A and suggest its identity.
        (b) Calculate the molar mass of gas B and suggest its identity.
        (c) Explain, using the ideal gas law, why the two 1.00 L samples contain the same number of molecules despite their very different masses.
      answer: |
        (a) M = dRT/P = (0.164 g/L × 0.08206 × 298 K)/1.00 atm = 4.01 g/mol: helium (4.00 g/mol).
        (b) M = (1.80 × 0.08206 × 298)/1.00 = 44.0 g/mol: carbon dioxide (44.01 g/mol).
        (c) n = PV/(RT) depends only on P, V and T, which are identical for both samples (1.00 atm, 1.00 L, 298 K), so both hold 0.0409 mol. The masses differ because each CO₂ molecule is eleven times heavier than a helium atom, not because there are more of them.
      explanation: |
        Three points, one per part.

        (a) 1 pt: about 4.0 g/mol and helium. Accept 3.9–4.1.

        (b) 1 pt: about 44 g/mol and carbon dioxide (accept propane, 44.10, or N₂O, 44.01, as alternatives with the right number). Accept 43.5–44.5.

        (c) 1 pt: the number of moles depends only on P, V and T (Avogadro's law), so equal volumes at the same conditions hold equal numbers of molecules; mass differs because molar mass differs. Zero for "the heavier gas has more molecules".

    # ---- Long answer
    - slug: chem-u05-w18-q23
      type: long_answer
      topic_code: "5.3"
      source: "general knowledge"
      points: 6
      prompt: |
        You are given a sealed glass bulb of known volume, a balance, a thermometer, a barometer and a vacuum pump, and asked to determine the molar mass of an unknown gas that is supplied from a cylinder.

        Write a procedure and an analysis that (1) lists the measurements you would make and in what order; (2) shows how to turn those measurements into a molar mass, starting from PV = nRT and giving the final equation; (3) works through the calculation for a bulb of 0.350 L, an empty mass of 85.210 g, a filled mass of 85.830 g, a temperature of 24 °C and a pressure of 748 torr; and (4) identifies two sources of error and says whether each would make the calculated molar mass too high or too low.
      answer: |
        (1) Evacuate the bulb with the pump and weigh it (m_empty). Fill it with the unknown gas from the cylinder, let it reach room temperature, open it briefly to the air so the inside pressure equals the barometer reading, close it and weigh again (m_full). Record the room temperature and the barometer pressure. The bulb's volume is given (or found by weighing it full of water).

        (2) Mass of gas m = m_full − m_empty. From PV = nRT with n = m/M: M = mRT/(PV).

        (3) m = 85.830 − 85.210 = 0.620 g. T = 24 + 273 = 297 K. P = 748/760 = 0.984 atm. M = (0.620 g × 0.08206 L·atm/(mol·K) × 297 K)/(0.984 atm × 0.350 L) = 15.11/0.3444 = 43.9 g/mol. The gas is consistent with carbon dioxide (44.01 g/mol).

        (4) If the bulb was not fully evacuated before the first weighing, m_empty is too high, m is too low and M comes out too low. If the gas was still warmer than the thermometer reading when the bulb was closed, the true T is higher than recorded, so fewer moles are present than calculated and M (which is m ÷ n) comes out too low. If air leaked in during filling, the measured mass is a mixture with air (29 g/mol): for a gas heavier than air M comes out too low, for a lighter gas too high. Water vapour on the glass that evaporated between weighings would make m too small and M too low.
      explanation: |
        Six points.

        Procedure (0–1): a sensible sequence that includes evacuating and weighing the empty bulb, filling, equilibrating to room temperature and pressure, weighing again, and recording T and P.

        Derivation (0–2): 1 pt for m = m_full − m_empty and n = m/M substituted into PV = nRT; 1 pt for the final equation M = mRT/(PV) (or M = dRT/P).

        Calculation (0–2): 1 pt for correct conversions (0.620 g, 297 K, 0.984 atm, 0.350 L); 1 pt for M ≈ 43.9 g/mol (accept 43.5–44.5) with a plausible identification such as CO₂.

        Error analysis (0–1): two distinct sources of error, each with a correct direction for its effect on M (too high or too low) and a reason. One source with direction earns half credit at the teacher's discretion; "human error" earns nothing.

        Common errors: Celsius in RT; forgetting to convert torr to atm; subtracting the masses in the wrong order; stating an error source without its direction.
