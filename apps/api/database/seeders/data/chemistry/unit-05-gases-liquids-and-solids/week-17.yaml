        A 4.00 L sample of a gas has a mass of 5.72 g. What is its density? Give your answer in g/L to two decimal places.
      answer: { value: 1.43, tolerance: 0.01 }
      explanation: |
        Density = mass / volume = 5.72 g / 4.00 L = 1.43 g/L. Gas densities are about a thousand times smaller than liquid densities, which is why they are quoted per litre rather than per millilitre.

    # ---- Short answer
    - slug: chem-u05-w17-q21
      type: short_answer
      topic_code: "5.1"
      source: "general knowledge"
      points: 3
      prompt: |
        A sealed, rigid flask of neon gas is heated from 300 K to 600 K. Answer (a), (b) and (c).

        (a) Describe what happens to the average kinetic energy and the average speed of the neon atoms.
        (b) Using kinetic molecular theory, explain why the pressure in the flask changes, and state by what factor.
        (c) Explain why the same reasoning would NOT predict the pressure correctly if the flask were cooled to 20 K, close to neon's boiling point of 27 K.
      answer: |
        (a) The average kinetic energy doubles, because it is proportional to kelvin temperature and 600 K is twice 300 K. The average speed rises by a factor of about 1.4 (the square root of 2), since KE depends on the square of the speed.
        (b) The faster atoms hit the walls more often and with more force per hit. The volume cannot change, so the extra collision force appears entirely as pressure, which doubles (Gay-Lussac's law: P/T is constant).
        (c) Near 27 K the atoms move so slowly that their weak attractions for one another are no longer negligible, so the ideal-gas assumption of no intermolecular forces fails; the atoms begin to stick together and condense, and the pressure falls below what P/T = constant predicts.
      explanation: |
        Three points, one per part.

        (a) 1 pt: average kinetic energy doubles (proportional to kelvin temperature); speed increases but by less than a factor of 2 (about 1.4). Accept "kinetic energy doubles and the atoms move faster" without the square-root detail.

        (b) 1 pt: pressure doubles, explained by more frequent and more forceful wall collisions with volume fixed. Zero for "pressure increases" with no mechanism or no factor.

        (c) 1 pt: at very low temperature the attractions between atoms are no longer negligible (an assumption of KMT fails), so the gas condenses or deviates from the law. Accept naming particle volume as well, but the key failure here is attractions.

    - slug: chem-u05-w17-q22
      type: short_answer
      topic_code: "5.2"
      source: "general knowledge"
      points: 3
      stimulus: |
        Graph description: A graph of volume (mL, vertical axis, 0 to 120) against temperature (°C, horizontal axis, −300 to 100) for three different gas samples at constant pressure. Each sample's points lie on a straight line. The three lines have different slopes but, when extended to the left as dashed lines, all cross the horizontal axis at the same point, labelled −273 °C.
      prompt: |
        Using the graph description, answer (a), (b) and (c).

        (a) Which gas law does the graph illustrate, and what is held constant?
        (b) Explain the significance of the point where the dashed lines meet the axis.
        (c) A sample on one line has a volume of 80.0 mL at 27 °C. Show how to find its volume at 127 °C, and give the result.
      answer: |
        (a) Charles's law: at constant pressure (and constant amount of gas) the volume of a gas is directly proportional to its kelvin temperature, which is why each sample gives a straight line.
        (b) All the lines reach zero volume at the same temperature, −273 °C. That common point is absolute zero, 0 K; it is the zero of the kelvin scale, the temperature at which an ideal gas would have no volume and its particles no kinetic energy.
        (c) Convert to kelvin: 27 °C = 300 K and 127 °C = 400 K. V₂ = V₁ × T₂/T₁ = 80.0 mL × 400/300 = 107 mL (106.7 mL).
      explanation: |
        Three points, one per part.

        (a) 1 pt: Charles's law, with pressure (and amount) constant. Zero for Boyle's or Gay-Lussac's law.

        (b) 1 pt: the intercept is absolute zero (0 K, −273 °C), the temperature at which volume extrapolates to zero and from which the kelvin scale is measured. Accept "the gas would have zero volume there" with the name absolute zero.

        (c) 1 pt: temperatures converted to 300 K and 400 K and V₂ = 80.0 × 400/300 = 107 mL (accept 106.7). Zero for 80.0 × 127/27 = 376 mL (Celsius used).

    # ---- Long answer
    - slug: chem-u05-w17-q23
      type: long_answer
      topic_code: "5.2"
      source: "general knowledge"
      points: 6
      prompt: |
        A friend claims: "Gases are simple. If you heat one, it just gets bigger. If you squeeze one, it just pushes back. There is no need for three different laws."

        Write a response that (1) explains, using kinetic molecular theory, why heating a gas and squeezing a gas have the effects your friend describes; (2) explains why three separate laws are nevertheless useful, naming each law, its equation and the variable it holds constant; (3) shows with a short calculation why the temperature in these laws must be in kelvin; and (4) describes one real situation in which a gas does not behave as the laws predict and why.
      answer: |
        (1) KMT: gas particles move randomly and their average kinetic energy is proportional to kelvin temperature. Heating makes particles hit the walls harder and more often; if the walls can move, the gas expands until the pressure matches the outside again (Charles). Squeezing shortens the distance between walls, so the particles collide with them more often, and the pressure rises (Boyle). The friend's intuition is the model's prediction.

        (2) Each law isolates one pair of variables with the third held fixed, which is how experiments and problems are set up. Boyle: P₁V₁ = P₂V₂ at constant T. Charles: V₁/T₁ = V₂/T₂ at constant P. Gay-Lussac: P₁/T₁ = P₂/T₂ at constant V. A sealed rigid can needs Gay-Lussac; a free balloon needs Charles; a syringe at room temperature needs Boyle. Using the wrong pair gives nonsense.

        (3) Example: a 1.00 L balloon at 25 °C warmed to 50 °C. In Celsius the ratio 50/25 = 2 predicts 2.00 L, a doubling from a modest warming. In kelvin 323/298 = 1.084 predicts 1.08 L, which matches experiment. Only kelvin is proportional to kinetic energy, with its zero at zero energy, so only kelvin ratios mean anything.

        (4) Water vapour cooled toward 100 °C, or any gas compressed hard and cooled: the assumptions of negligible particle volume and no attractions fail, the molecules stick together and condense, and the pressure drops far below the Boyle or Gay-Lussac prediction. Propane in a tank is a liquid at room temperature for this reason.
      explanation: |
        Six points.

        KMT explanations (0–2): 1 pt for explaining expansion on heating through faster, more forceful and more frequent collisions; 1 pt for explaining the pressure rise on compression through more frequent collisions with no change in speed.

        Three laws (0–2): 1 pt for naming all three laws with correct equations; 1 pt for stating the constant for each and giving at least one reason the separation is useful (matching the law to the situation; isolating two variables).

        Kelvin (0–1): a calculation that contrasts a Celsius ratio with a kelvin ratio, or an example of a negative or absurd result from Celsius, plus the reason (kelvin is proportional to kinetic energy, zero at absolute zero).

        Real deviation (0–1): a specific situation (condensation, high pressure, low temperature, a gas near its boiling point) linked to a failed KMT assumption (attractions or particle volume).

        Common errors: saying heating makes particles "bigger"; claiming Boyle's law is a direct proportion; giving the kelvin reason as "because the formula says so" without the energy link.
