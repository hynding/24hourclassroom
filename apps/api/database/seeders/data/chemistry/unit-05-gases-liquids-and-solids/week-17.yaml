      prompt: |
        A balloon holds 1.50 L of air at 20 °C. It is warmed to 80 °C at constant pressure. What is its new volume? Give your answer in litres to two decimal places.
      answer: { value: 1.81, tolerance: 0.02 }
      explanation: |
        Convert to kelvin first: T₁ = 293.15 K, T₂ = 353.15 K. Charles's law: V₂ = V₁ × T₂/T₁ = 1.50 L × (353.15/293.15) = 1.50 × 1.205 = 1.81 L. Using Celsius (80/20 = 4) would wrongly give 6.00 L.

    - slug: chem-u05-w17-q20
