week: 17
unit: 5
title: "Kinetic Molecular Theory and the Simple Gas Laws"
topics: ["5.1", "5.2"]
guide: guides/week-17.md
guide_description: |
  The kinetic molecular model of a gas and why it explains pressure, how barometers and manometers measure
  pressure and how to convert between atm, kPa, torr and psi, then the three two-variable gas laws (Boyle, Charles,
  Gay-Lussac) with worked examples, a decision table for choosing the law, and why every temperature must be in
  kelvin.
flashcards_description: |
  28 cards on the five statements of kinetic molecular theory, pressure units and instruments, and the three simple
  gas laws with their constants, graphs and equations.

flashcards:
  - front: Kinetic molecular theory → the five assumptions about an ideal gas
    back: |
      Particles are tiny compared with the space between them; they move constantly, randomly and in straight lines; collisions are perfectly elastic; particles neither attract nor repel one another; and average kinetic energy depends only on kelvin temperature.
    topic_code: "5.1"
  - front: Why a gas exerts pressure → the KMT explanation
    back: |
      Pressure is force per unit area. Gas particles collide with the container walls billions of times per second, and each collision pushes on the wall. More frequent or harder collisions mean higher pressure.
    topic_code: "5.1"
  - front: Average kinetic energy of gas particles → what it depends on
    back: |
      Only the kelvin temperature. At the same temperature every gas has the same average kinetic energy, so lighter molecules move faster on average than heavier ones (H₂ at 25 °C averages about 1,900 m/s, O₂ about 480 m/s).
    hint: KE = ½mv²; same KE, smaller m, bigger v.
    topic_code: "5.1"
  - front: Elastic collision in KMT → what is conserved
    back: |
      Total kinetic energy. Particles trade energy when they collide but none is lost to heat or deformation, so a gas in an insulated container keeps the same temperature forever.
    topic_code: "5.1"
  - front: When a real gas stops behaving ideally → the two KMT assumptions that fail
    back: |
      At high pressure the particles' own volume is no longer negligible, and at low temperature their intermolecular attractions are no longer negligible. Hot, dilute gases obey the model best.
    topic_code: "5.1"
  - front: 1 atm expressed in kPa, torr, mm Hg and psi
    back: |
      1 atm = 101.3 kPa = 760 torr = 760 mm Hg = 14.7 psi. Convert through 1 atm: multiply by the target value and divide by the starting one.
    topic_code: "5.1"
  - front: Torr → what it measures and its relation to mm Hg
    back: |
      One torr is the pressure that supports a mercury column 1 mm high, so 1 torr = 1 mm Hg. Sea-level air pressure is about 760 torr.
    topic_code: "5.1"
  - front: Barometer → how Torricelli's instrument reads air pressure
    back: |
      A glass tube full of mercury, sealed at one end, is inverted in a dish of mercury. Air pressure on the dish holds up a column about 760 mm high at sea level; the height of the column is the atmospheric pressure. The gap above the column is a vacuum.
    topic_code: "5.1"
  - front: Manometer → what the height difference tells you
    back: |
      A U-tube of mercury with one arm open to the air and the other connected to a gas sample. The difference in the two mercury levels is the difference between the sample pressure and atmospheric pressure.
    topic_code: "5.1"
  - front: Gauge pressure versus absolute pressure
    back: |
      A tire gauge reads how much the gas exceeds atmospheric pressure. Absolute pressure, the quantity in every gas law, is gauge pressure plus atmospheric pressure (about 101.3 kPa or 14.7 psi).
    topic_code: "5.1"
  - front: STP for gases → the temperature and pressure
    back: |
      Standard temperature and pressure: 0 °C (273.15 K) and 1 atm (101.3 kPa). Used as the reference state for comparing gas volumes.
    topic_code: "5.1"
  - front: Pascal → the SI pressure unit in base units
    back: |
      1 Pa = 1 N/m², one newton of force spread over one square metre. It is small, so gas pressures are usually quoted in kilopascals: 101.3 kPa is one atmosphere.
    topic_code: "5.1"
  - front: Boyle's law → the relationship and its formula
    back: |
      At constant temperature and amount of gas, pressure and volume are inversely proportional: P₁V₁ = P₂V₂. Halve the volume and the pressure doubles.
    topic_code: "5.2"
  - front: Boyle's law explained by KMT
    back: |
      Squeezing a gas into a smaller volume makes each particle hit the walls more often; the collisions are no harder (same temperature), but there are more of them per second, so the pressure rises.
    topic_code: "5.2"
  - front: Graph of P versus V for Boyle's law → its shape
    back: |
      A curve that falls as V rises (a hyperbola), because PV is constant. Plotting P against 1/V instead gives a straight line through the origin.
    topic_code: "5.2"
  - front: Charles's law → the relationship and its formula
    back: |
      At constant pressure and amount of gas, volume is directly proportional to kelvin temperature: V₁/T₁ = V₂/T₂. Double the kelvin temperature and the volume doubles.
    topic_code: "5.2"
  - front: Charles's law explained by KMT
    back: |
      Warmer particles hit the walls harder and more often. For the pressure to stay constant the gas must expand, spreading the same force over a larger area.
    topic_code: "5.2"
  - front: Absolute zero from a Charles's law graph
    back: |
      Lines of volume against Celsius temperature for different gases all reach zero volume at the same point, −273.15 °C. That extrapolated point is 0 K, absolute zero.
    topic_code: "5.2"
  - front: Gay-Lussac's law → the relationship and its formula
    back: |
      At constant volume and amount of gas, pressure is directly proportional to kelvin temperature: P₁/T₁ = P₂/T₂. A sealed can heated from 293 K to 333 K gains about 14% in pressure.
    topic_code: "5.2"
  - front: Gay-Lussac's law explained by KMT
    back: |
      Heating a gas in a rigid container makes the collisions harder and more frequent, but the walls cannot move, so the extra force appears as higher pressure.
    topic_code: "5.2"
  - front: Why gas laws use kelvin, not Celsius
    back: |
      Kelvin temperature is proportional to average kinetic energy, and 0 K means zero kinetic energy. Celsius has an arbitrary zero, so ratios of Celsius temperatures are meaningless (and can give negative volumes).
    topic_code: "5.2"
  - front: Celsius to kelvin → the conversion
    back: |
      K = °C + 273.15. For most gas-law work 273 is accurate enough: 25 °C is 298 K, 0 °C is 273 K, −40 °C is 233 K.
    topic_code: "5.2"
  - front: Which gas law when? → reading the problem for the constant
    back: |
      Same temperature (isothermal) → Boyle, P and V. Constant pressure, free to expand, open balloon → Charles, V and T. Rigid, sealed, constant volume → Gay-Lussac, P and T.
    topic_code: "5.2"
  - front: Units in a two-state gas law problem → what must match
    back: |
      P₁ and P₂ must share one unit, V₁ and V₂ must share one unit, and both temperatures must be in kelvin. The pressure and volume units cancel, so torr and mL are as good as atm and L.
    topic_code: "5.2"
  - front: Inverse proportion versus direct proportion in the gas laws
    back: |
      Inverse: the product is constant (PV = k), so one rises as the other falls. Direct: the ratio is constant (V/T = k), so both rise together. Boyle is inverse; Charles and Gay-Lussac are direct.
    topic_code: "5.2"
  - front: Error spotting → a Charles's law answer that comes out negative
    back: |
      A negative volume or pressure means Celsius temperatures were used. Convert both temperatures to kelvin and recompute; the ratio T₂/T₁ must be positive and close to 1 for everyday temperature changes.
    topic_code: "5.2"
  - front: Scuba diver ascending while holding breath → which law and why it is dangerous
    back: |
      Boyle's law. Rising from 2.8 atm to 1.0 atm would let 4.5 L of lung air expand toward 12.6 L, far more than the lungs can hold, so divers exhale continuously while ascending.
    topic_code: "5.2"
  - front: Aerosol can left in a hot car → which law applies
    back: |
      Gay-Lussac's law: the can's volume is fixed, so rising temperature raises the pressure in proportion to the kelvin temperature. That is why cans carry warnings against heating.
    topic_code: "5.2"

quiz:
  description: |
    23 questions · about 40 minutes · topics 5.1 and 5.2 (kinetic molecular theory, pressure, and the Boyle, Charles
    and Gay-Lussac laws), with review of temperature scales and energy (1.6), significant figures and dimensional
    analysis (1.4, 1.5) and intermolecular forces (3.6). Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: a Boyle's law data table (5.2)
    - slug: chem-u05-w17-q01
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student traps a sample of air in a syringe at 22 °C and records the volume as weights are added to the plunger.

        | Trial | Pressure (kPa) | Volume (mL) |
        |---|---|---|
        | 1 | 101 | 60.0 |
        | 2 | 152 | 40.0 |
        | 3 | 202 | 30.0 |
        | 4 | 303 | 20.0 |
      prompt: |
        Which statement best describes the pattern in the data?
      options:
        - "Pressure and volume rise together, so they are directly proportional."
        - "The product of pressure and volume is roughly constant, so they are inversely proportional."
        - "The ratio of pressure to volume is constant, so the gas obeys Charles's law."
        - "Pressure changes have no measurable effect on the volume."
      option_explanations:
        - |
          The pressure rises from 101 to 303 kPa while the volume falls from 60.0 to 20.0 mL; the two move in opposite directions, not together.
        - |
          Correct. 101 × 60.0 ≈ 6,060; 152 × 40.0 ≈ 6,080; 202 × 30.0 ≈ 6,060; 303 × 20.0 ≈ 6,060. A constant product is the signature of Boyle's law.
        - |
          The ratio P/V goes from 1.7 to 15, nowhere near constant, and Charles's law concerns volume and temperature, which was held at 22 °C throughout.
        - |
          Tripling the pressure cuts the volume to a third; the effect is large and regular.
      answer: 1
      explanation: |
        Skill: analysing data. Test for an inverse relationship by multiplying the two variables; a constant product means Boyle's law.

    - slug: chem-u05-w17-q02
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student traps a sample of air in a syringe at 22 °C and records the volume as weights are added to the plunger.

        | Trial | Pressure (kPa) | Volume (mL) |
        |---|---|---|
        | 1 | 101 | 60.0 |
        | 2 | 152 | 40.0 |
        | 3 | 202 | 30.0 |
        | 4 | 303 | 20.0 |
      prompt: |
        If the student adds enough weight to reach 404 kPa at the same temperature, what volume should the syringe show?
      options:
        - "10.0 mL"
        - "25.0 mL"
        - "15.0 mL"
        - "5.0 mL"
      option_explanations:
        - |
          10.0 mL would require PV = 4,040, well below the constant product of about 6,060 kPa·mL in the table.
        - |
          25.0 mL would give a product of 10,100, far above the table's constant; it is also more than the volume at 303 kPa, which cannot happen when the pressure rises.
        - |
          Correct. V = 6,060 / 404 = 15.0 mL. Equivalently, 404 kPa is four times 101 kPa, so the volume is a quarter of 60.0 mL.
        - |
          5.0 mL would be an eighth of the starting volume, which would need a pressure of about 808 kPa.
      answer: 2
      explanation: |
        Skill: using a model to predict. Once PV is known to be constant, divide it by the new pressure.

    - slug: chem-u05-w17-q03
      type: multiple_choice
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student traps a sample of air in a syringe at 22 °C and records the volume as weights are added to the plunger.

        | Trial | Pressure (kPa) | Volume (mL) |
        |---|---|---|
        | 1 | 101 | 60.0 |
        | 2 | 152 | 40.0 |
        | 3 | 202 | 30.0 |
        | 4 | 303 | 20.0 |
      prompt: |
        Using kinetic molecular theory, why does the pressure rise between trial 1 and trial 4?
      options:
        - "The air molecules move faster because they are being pushed, so each collision is harder."
        - "New air molecules are created when the plunger compresses the gas."
        - "The molecules begin to attract one another strongly at small volumes."
        - "The same molecules, moving at the same average speed, strike the walls more often in the smaller space."
      option_explanations:
        - |
          The temperature was held at 22 °C, so the average kinetic energy and speed of the molecules did not change; collisions are more frequent, not harder.
        - |
          Compression does not create molecules; the syringe is sealed and the amount of gas is constant.
        - |
          Attractions would lower the pressure, not raise it, and in a dilute gas KMT treats them as negligible anyway.
        - |
          Correct. At constant temperature the speed distribution is unchanged, but a smaller volume means a shorter trip between walls and more collisions per second on each square centimetre.
      answer: 3
      explanation: |
        Skill: explaining with a model. Boyle's law at the particle level is about collision frequency, not collision strength.

    # ---- Single items
    - slug: chem-u05-w17-q04
      type: multiple_choice
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement is NOT one of the assumptions of the kinetic molecular theory of an ideal gas?
      options:
        - "Gas particles are in constant, random, straight-line motion."
        - "Gas particles move more slowly as the pressure increases at constant temperature."
        - "Collisions between gas particles are perfectly elastic."
        - "The volume of the particles themselves is negligible compared with the container."
      option_explanations:
        - |
          This is the second assumption of the model: motion is constant and random until a collision changes direction.
        - |
          Correct, this is not an assumption. In KMT the average speed depends only on the kelvin temperature; pressure at constant temperature does not change it.
        - |
          Elastic collisions, with no loss of kinetic energy, are a core assumption; without them a gas would cool down on its own.
        - |
          Negligible particle volume is the first assumption and is why ideal gases are compressible.
      answer: 1

    - slug: chem-u05-w17-q05
      type: multiple_choice
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A weather report gives the air pressure as 99.5 kPa. What is this in torr?
      options:
        - "746 torr"
        - "764 torr"
        - "0.982 torr"
        - "9,950 torr"
      option_explanations:
        - |
          Correct. 99.5 kPa × (760 torr / 101.3 kPa) = 746 torr, a little below the sea-level average of 760 torr, as expected for 99.5 kPa.
        - |
          764 torr comes from inverting the ratio; a pressure below 101.3 kPa must give fewer than 760 torr.
        - |
          0.982 is the pressure in atmospheres, not torr; one more step (× 760) is needed.
        - |
          Multiplying by 100 confuses kPa with Pa and has nothing to do with the torr conversion.
      answer: 0

    - slug: chem-u05-w17-q06
      type: multiple_choice
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      prompt: |
        At 25 °C and 1 atm, helium behaves almost exactly like an ideal gas while water vapour (at 100 °C) deviates noticeably. Which difference between the two best explains this?
      options:
        - "Helium atoms are heavier than water molecules, so they move more slowly."
        - "Water molecules have strong hydrogen bonds between them, while helium atoms have only very weak dispersion forces."
        - "Water vapour contains more molecules per litre than helium at the same pressure."
        - "Helium is an element and water is a compound, and only elements obey the gas laws."
      option_explanations:
        - |
          Helium (4.00 g/mol) is lighter than water (18.02 g/mol), and in any case KMT says mass alone does not cause deviation.
        - |
          Correct. KMT assumes no attractions. Water's hydrogen bonding is a strong intermolecular force that pulls molecules together, lowering the pressure below the ideal prediction; helium's dispersion forces are tiny.
        - |
          At the same temperature and pressure, equal volumes of any gas contain the same number of particles (Avogadro's principle).
        - |
          Many compounds, such as CO₂ and CH₄, behave nearly ideally; being an element or compound is irrelevant.
      answer: 1
      explanation: |
        Review of 3.6: the strength of intermolecular forces decides how far a real gas departs from the ideal model.

    - slug: chem-u05-w17-q07
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A balloon filled at room temperature is placed in a freezer. Which law describes what happens, and what is the result?
      options:
        - "Boyle's law; the balloon expands because the pressure in the freezer is lower."
        - "Gay-Lussac's law; the balloon's pressure drops while its volume stays fixed."
        - "Charles's law; the balloon shrinks because the volume of a gas falls with its kelvin temperature at constant pressure."
        - "Charles's law; the balloon expands because cold air is denser."
      option_explanations:
        - |
          The air pressure inside a freezer is the same atmospheric pressure as outside; nothing in the scenario changes the pressure.
        - |
          A rubber balloon is not rigid, so its volume is free to change; Gay-Lussac's law applies to fixed-volume containers.
        - |
          Correct. The balloon stays at atmospheric pressure, so V/T is constant; a lower kelvin temperature means a smaller volume.
        - |
          Cold air is denser, which is exactly why the gas occupies less volume; the balloon shrinks rather than expanding.
      answer: 2

    - slug: chem-u05-w17-q08
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A rigid steel cylinder of nitrogen reads 150 atm at 27 °C. On a very cold day the cylinder cools to −23 °C. Its pressure is closest to
      options:
        - "128 atm"
        - "175 atm"
        - "−128 atm"
        - "150 atm"
      option_explanations:
        - |
          Correct. T₁ = 300 K, T₂ = 250 K. P₂ = 150 atm × (250/300) = 125 atm; 128 is the nearest option and the only one in the right range.
        - |
          175 atm would be the result of inverting the ratio; cooling a sealed cylinder must lower the pressure.
        - |
          A negative pressure is impossible; it comes from using Celsius temperatures (−23/27) instead of kelvin.
        - |
          The volume is fixed, so the pressure cannot stay the same when the temperature drops by 50 K.
      answer: 0

    - slug: chem-u05-w17-q09
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which temperature is the same as 310 K?
      options:
        - "583 °C"
        - "−37 °C"
        - "310 °C"
        - "37 °C"
      option_explanations:
        - |
          583 comes from adding 273 instead of subtracting it; a temperature of 310 K is only slightly above room temperature.
        - |
          The sign is wrong: 310 K is above 273 K, so the Celsius value must be positive.
        - |
          Kelvin and Celsius differ by 273.15 degrees, so a number can never be the same on both scales.
        - |
          Correct. °C = K − 273.15 = 310 − 273 = 37 °C, normal human body temperature.
      answer: 3
      explanation: |
        Review of 1.6: K = °C + 273.15. Every gas law this unit needs the conversion.

    - slug: chem-u05-w17-q10
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Two sealed flasks at the same temperature contain hydrogen (H₂, 2.016 g/mol) and oxygen (O₂, 32.00 g/mol). Which comparison of the two gases is correct?
      options:
        - "The hydrogen molecules have more average kinetic energy because they are lighter."
        - "The oxygen molecules have more average kinetic energy because they are heavier."
        - "Both gases have the same average kinetic energy, so the hydrogen molecules move faster on average."
        - "Both gases have the same average speed because they are at the same temperature."
      option_explanations:
        - |
          Average kinetic energy depends only on temperature, not on the mass of the molecule.
        - |
          Mass does not change average kinetic energy at a fixed temperature; the heavier molecule simply moves more slowly.
        - |
          Correct. Equal temperatures mean equal average kinetic energy (½mv²). With one-sixteenth the mass, hydrogen molecules must average about four times the speed.
        - |
          Equal temperature fixes the kinetic energy, not the speed; lighter particles move faster.
      answer: 2
      explanation: |
        Review of 1.6 with KMT: temperature measures average kinetic energy. Same temperature, same KE; lighter means faster.

    - slug: chem-u05-w17-q11
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        At STP the density of carbon dioxide gas is 1.96 g/L. What is the mass of 3.50 L of CO₂ at STP?
      options:
        - "1.79 g"
        - "6.86 g"
        - "0.560 g"
        - "5.46 g"
      option_explanations:
        - |
          1.79 g is 3.50 divided by 1.96; dividing volume by density gives the wrong unit (L²/g).
        - |
          Correct. mass = density × volume = 1.96 g/L × 3.50 L = 6.86 g.
        - |
          0.560 comes from dividing 1.96 by 3.50, which gives g/L², not grams.
        - |
          5.46 g would require a density of 1.56 g/L; the multiplication was done incorrectly.
      answer: 1
      explanation: |
        Review of 1.5: density links mass and volume for gases exactly as for solids; let the units guide the setup.

    # ---- Select all
    - slug: chem-u05-w17-q12
      type: multi_select
      topic_code: "5.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which changes would raise the pressure of a fixed amount of gas in a container? Select all that apply.
      options:
        - "Decreasing the volume of the container at constant temperature"
        - "Raising the temperature at constant volume"
        - "Lowering the temperature at constant volume"
        - "Increasing the volume of the container at constant temperature"
        - "Adding more molecules of the same gas at constant volume and temperature"
      option_explanations:
        - |
          Correct. A smaller volume means more collisions per second with each part of the wall (Boyle's law).
        - |
          Correct. Hotter molecules hit the walls harder and more often (Gay-Lussac's law).
        - |
          Cooling slows the molecules; collisions become gentler and rarer, so the pressure falls.
        - |
          A larger volume spreads the same collisions over more wall area and lengthens the trips between walls, so the pressure drops.
        - |
          Correct. More particles mean more collisions per second, so the pressure rises in proportion to the amount of gas.
      answer: [0, 1, 4]

    - slug: chem-u05-w17-q13
      type: multi_select
      topic_code: "5.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the simple gas laws are correct? Select all that apply.
      options:
        - "Boyle's law requires temperature and amount of gas to be constant."
        - "Charles's law predicts that the volume of a gas at constant pressure doubles when its Celsius temperature doubles."
        - "Gay-Lussac's law applies to a gas in a rigid, sealed container."
        - "In Boyle's law, pressure and volume are directly proportional."
        - "Charles's and Gay-Lussac's laws both require the temperature in kelvin."
      option_explanations:
        - |
          Correct. P₁V₁ = P₂V₂ holds only when the gas is neither heated nor added to.
        - |
          The volume doubles when the kelvin temperature doubles; doubling 10 °C to 20 °C raises the kelvin temperature by only 3.5%.
        - |
          Correct. Constant volume is the condition of Gay-Lussac's law, which is why sealed cylinders and aerosol cans are its classic examples.
        - |
          Boyle's law is an inverse relationship: the product PV is constant, so pressure rises as volume falls.
        - |
          Correct. Both are direct proportions with temperature, and a proportion needs a scale whose zero is absolute zero.
      answer: [0, 2, 4]

    # ---- True / false
    - slug: chem-u05-w17-q14
      type: true_false
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: If the pressure on a gas sample is tripled at constant temperature, its volume falls to one-third of its original value.
      answer: true
      explanation: |
        True. Boyle's law says PV is constant at fixed temperature and amount, so multiplying P by 3 divides V by 3.

    - slug: chem-u05-w17-q15
      type: true_false
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: At absolute zero the particles of a substance have the lowest possible kinetic energy, and no temperature below it exists.
      answer: true
      explanation: |
        True. 0 K (−273.15 °C) is the point to which gas volumes and pressures extrapolate to zero; kinetic energy cannot be less than its minimum, so there is no lower temperature. This is why kelvin is the natural scale for gas laws.

    # ---- Fill in the blank
    - slug: chem-u05-w17-q16
      type: fill_blank
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      prompt: |
        One atmosphere of pressure supports a mercury column 760 mm high, so 1 atm = ____ torr.
      answer: ["760", "760 torr", "760.0"]
      explanation: |
        The torr is defined from the millimetre of mercury: 1 torr = 1 mm Hg, and the standard atmosphere is 760 mm Hg, so 1 atm = 760 torr = 101.3 kPa.

    - slug: chem-u05-w17-q17
      type: fill_blank
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A pressure recorded as 0.0450 atm has ____ significant figures.
      answer: ["3", "three"]
      explanation: |
        Leading zeros only place the decimal point and are never significant; the trailing zero after the 5 is significant because it follows a nonzero digit to the right of the decimal point. So 4, 5 and the final 0 count: three significant figures.

    # ---- Numeric
    - slug: chem-u05-w17-q18
      type: numeric
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A gas occupies 2.50 L at 1.20 atm. The pressure is reduced to 0.800 atm at constant temperature. What is the new volume? Give your answer in litres to two decimal places.
      answer: { value: 3.75, tolerance: 0.01 }
      explanation: |
        Boyle's law: V₂ = P₁V₁ / P₂ = (1.20 atm × 2.50 L) / 0.800 atm = 3.00 / 0.800 = 3.75 L. Lower pressure, larger volume, as expected.

    - slug: chem-u05-w17-q19
      type: numeric
