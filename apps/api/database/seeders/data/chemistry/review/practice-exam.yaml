    options:
      - "1.01 atm"
      - "0.0908 atm"
      - "2.02 atm"
      - "0.505 atm"
    option_explanations:
      - |
        Correct. P = nRT ÷ V = 0.0820 × 0.08206 × 300 ÷ 2.00 = 1.01 atm.
      - |
        This uses 27 instead of 300 for the temperature; gas laws need kelvin.
      - |
        This omits the division by the 2.00 L volume.
      - |
        This divides by 4.00 instead of 2.00; check the volume used.
    answer: 0
    explanation: |
      PV = nRT with T in kelvin: P = (0.0820 mol)(0.08206 L·atm/(mol·K))(300 K) ÷ 2.00 L = 1.01 atm.

  - slug: chem-final-q36
    type: multiple_choice
    topic_code: "5.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      A cylinder fitted with a piston holds 0.0820 mol of nitrogen gas in a volume of 2.00 L at 27 °C (300 K). R = 0.08206 L·atm/(mol·K).
    prompt: |
      The piston is locked at 2.00 L and the cylinder is heated to 127 °C. According to the kinetic molecular theory, why does the pressure rise?
    options:
      - "The molecules expand and take up more space."
      - "The molecules move faster, so they strike the walls more often and with more force."
      - "More molecules are created by the heating."
      - "The attractions between molecules increase."
    option_explanations:
      - |
        Gas molecules do not change size; the space between them is what matters, and it is fixed here.
      - |
        Correct. Temperature is proportional to average kinetic energy; faster molecules collide with the walls more frequently and harder, raising the pressure to (400 ÷ 300) × 1.01 = 1.35 atm.
      - |
        Heating changes energy, not the number of molecules; n is constant in a sealed cylinder.
      - |
        The kinetic theory assumes negligible attractions, and warming weakens, not strengthens, their effect.
    answer: 1
    explanation: |
      Gay-Lussac's law (P proportional to T at constant V) follows from KMT: pressure comes from wall collisions, which become more frequent and more forceful as molecules speed up.

  - slug: chem-final-q37
    type: numeric
    topic_code: "5.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A sealed flask contains 0.300 mol of nitrogen and 0.100 mol of oxygen at a total pressure of 2.00 atm. What is the partial pressure of oxygen in atm? Give your answer to three decimal places.
    answer: { value: 0.500, tolerance: 0.005 }
    explanation: |
      Dalton's law: P(O₂) = mole fraction × P(total) = (0.100 ÷ 0.400) × 2.00 atm = 0.500 atm. Nitrogen contributes the other 1.50 atm.

