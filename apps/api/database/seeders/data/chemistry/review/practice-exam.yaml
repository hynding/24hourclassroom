      (c) Explain why a strong acid and a weak acid of the same concentration have different pH values.
    answer: |
      (a) Lemon juice is more acidic. Each pH unit is a factor of ten in [H⁺], so three units is 10³ = 1,000 times: [H⁺] is 1 × 10⁻² M in the juice and 1 × 10⁻⁵ M in the coffee. (b) H⁺(aq) + OH⁻(aq) → H₂O(l); a neutralisation (acid–base) reaction, a double replacement producing water and a salt. (c) A strong acid ionises completely, so [H⁺] equals the acid's concentration; a weak acid ionises only partially (its equilibrium lies far to the left), so [H⁺] is much smaller than the acid's concentration and the pH is higher. For example, 0.10 M HCl has pH 1.0 while 0.10 M ethanoic acid has pH about 2.9.
    explanation: |
      1 point for (a) lemon juice and a factor of 1,000 (10³). 1 point for (b) H⁺ + OH⁻ → H₂O named as neutralisation. 1 point for (c) complete versus partial ionisation with the consequence for [H⁺] and pH.

  # ================= Unit 7 · Energy, Rates and Equilibrium (8)
  - slug: chem-final-q50
