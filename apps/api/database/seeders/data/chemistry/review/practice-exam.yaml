  - slug: chem-final-q52
    type: multiple_choice
    topic_code: "7.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Given C(graphite) + O₂(g) → CO₂(g), ΔH = −393.5 kJ, and 2CO(g) + O₂(g) → 2CO₂(g), ΔH = −566.0 kJ, what is ΔH for 2C(graphite) + O₂(g) → 2CO(g)?
    options:
      - "−959.5 kJ"
      - "+172.5 kJ"
      - "−221.0 kJ"
      - "−1,353.0 kJ"
    option_explanations:
      - |
        This adds the two values as written, but the second equation must be reversed to put CO on the product side.
      - |
        The magnitude is wrong and the sign is backwards; the first equation must be doubled before adding.
      - |
        Correct. Double the first (−787.0 kJ) and reverse the second (+566.0 kJ); CO₂ cancels, giving 2C + O₂ → 2CO with ΔH = −221.0 kJ.
      - |
        This doubles both values and adds them without reversing the second.
    answer: 2
    explanation: |
      Hess's law: arrange the given equations so the target species are on the correct sides (double the first, reverse the second), then add: −787.0 + 566.0 = −221.0 kJ, which is 2 × (−110.5), the formation enthalpy of CO.

  # ---- Stimulus set C: the contact process (7.4, 7.5, 7.6)
  - slug: chem-final-q53
    type: multiple_choice
    topic_code: "7.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      In the manufacture of sulfuric acid, sulfur dioxide is oxidised over a vanadium(V) oxide catalyst at about 450 °C:

      2SO₂(g) + O₂(g) ⇌ 2SO₃(g), ΔH = −198 kJ
    prompt: |
      A sealed vessel is charged with SO₂ and O₂ only, and the concentration of SO₃ is recorded over time. Which description of the graph is correct?
    options:
      - "A straight line rising at a constant rate until the reactants are gone"
      - "A flat line, because the reaction does not begin until a catalyst is added"
      - "A curve that rises slowly at first and then accelerates"
      - "A curve that rises steeply at first, flattens as the reactant concentrations fall, and levels off at equilibrium while both reactions continue"
    option_explanations:
      - |
        Rate depends on reactant concentration, which falls as the reaction proceeds, so the slope decreases.
      - |
        The reaction proceeds without a catalyst, only more slowly; the catalyst changes the rate, not whether it happens.
      - |
        The forward rate is highest at the start when reactant concentrations are highest.
      - |
        Correct. The forward rate falls as SO₂ and O₂ are consumed while the reverse rate rises as SO₃ accumulates; when they are equal the concentrations stop changing.
    answer: 3
    explanation: |
      Collision theory: fewer reactant molecules, fewer effective collisions per second. The plateau is dynamic equilibrium, not a stopped reaction.

  - slug: chem-final-q54
    type: multiple_choice
    topic_code: "7.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      In the manufacture of sulfuric acid, sulfur dioxide is oxidised over a vanadium(V) oxide catalyst at about 450 °C:

      2SO₂(g) + O₂(g) ⇌ 2SO₃(g), ΔH = −198 kJ
    prompt: |
      What is the effect of the vanadium(V) oxide catalyst?
    options:
      - "It provides a pathway with a lower activation energy, so equilibrium is reached faster, but the equilibrium amount of SO₃ is unchanged."
      - "It shifts the equilibrium toward SO₃, increasing the yield."
      - "It makes the reaction more exothermic."
      - "It is consumed and must be replaced for each batch."
    option_explanations:
      - |
        Correct. Catalysts lower Ea for the forward and reverse reactions equally; the composition at equilibrium and Kc are untouched, only the time changes.
      - |
        A catalyst never changes the position of equilibrium; that needs a change in concentration, pressure or temperature.
      - |
        ΔH depends on the reactant and product energy levels, which the catalyst leaves alone.
      - |
        Catalysts are regenerated; the same vanadium(V) oxide serves for years.
    answer: 0
    explanation: |
      Catalyst: lower Ea, faster both ways, same ΔH, same equilibrium, not used up.

  - slug: chem-final-q55
    type: multiple_choice
    topic_code: "7.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      In the manufacture of sulfuric acid, sulfur dioxide is oxidised over a vanadium(V) oxide catalyst at about 450 °C:

      2SO₂(g) + O₂(g) ⇌ 2SO₃(g), ΔH = −198 kJ
    prompt: |
      Which change would increase the equilibrium yield of SO₃?
    options:
      - "Raising the temperature"
      - "Increasing the pressure by reducing the volume"
      - "Removing oxygen from the vessel"
      - "Adding more catalyst"
    option_explanations:
      - |
        The forward reaction is exothermic; heating shifts the equilibrium left and lowers Kc.
      - |
        Correct. Three moles of gas become two, so compression shifts the equilibrium toward the side with fewer gas moles, SO₃.
      - |
        Removing a reactant shifts the equilibrium left to replace it.
      - |
        A catalyst changes the rate only, never the yield.
    answer: 1
    explanation: |
      Le Châtelier: fewer gas moles on the right means pressure favours products; low temperature also favours this exothermic reaction, but industry compromises at 450 °C for rate.

  - slug: chem-final-q56
    type: multi_select
    topic_code: "7.5"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Magnesium ribbon reacts with dilute sulfuric acid. Which changes would increase the rate of reaction? Select all that apply.
    options:
      - "Warming the acid"
      - "Using a larger volume of acid at the same concentration"
      - "Using more concentrated acid"
      - "Cutting the ribbon into small pieces"
      - "Cooling the acid in an ice bath"
    option_explanations:
      - |
        Correct. More collisions, and far more of them with energy above the activation energy.
      - |
        At the same concentration the collisions per second at the magnesium surface are unchanged; more acid affects only how much can react in total.
      - |
        Correct. More H⁺ ions per volume means more frequent collisions with the metal.
      - |
        Correct. Greater surface area exposes more magnesium atoms to collision.
      - |
        Cooling reduces the fraction of collisions with enough energy and slows the reaction.
    answer: [0, 2, 3]
    explanation: |
      Temperature, concentration and surface area are rate factors; volume at fixed concentration is not.

  - slug: chem-final-q57
    type: short_answer
    topic_code: "7.6"
    source: "general knowledge"
    points: 3
    prompt: |
      Dinitrogen tetroxide and nitrogen dioxide are in equilibrium: N₂O₄(g) ⇌ 2NO₂(g), ΔH = +58 kJ. NO₂ is brown; N₂O₄ is colourless.
      (a) Write the expression for Kc.
      (b) At 25 °C an equilibrium mixture has [N₂O₄] = 0.0400 M and [NO₂] = 0.0120 M. Calculate Kc and state what its size tells you about the position of equilibrium.
      (c) Predict and explain the colour change when the mixture is (i) heated and (ii) compressed into a smaller volume.
    answer: |
      (a) Kc = [NO₂]² ÷ [N₂O₄]. (b) Kc = (0.0120)² ÷ 0.0400 = 0.000144 ÷ 0.0400 = 0.0036 (3.6 × 10⁻³). A value much less than 1 means the equilibrium lies well to the left: mostly colourless N₂O₄ with little brown NO₂. (c) (i) Heating: the forward reaction is endothermic (heat is a reactant), so the equilibrium shifts right toward NO₂ and the mixture turns darker brown; Kc increases. (ii) Compressing: one mole of gas becomes two, so higher pressure shifts the equilibrium left toward N₂O₄ (fewer gas moles); after an initial darkening from the gas being squeezed into less space, the colour becomes lighter than it was immediately after compression. Kc is unchanged.
    explanation: |
      1 point for (a) the correct expression with the exponent 2. 1 point for (b) Kc = 0.0036 and "lies to the left, mostly N₂O₄". 1 point for (c) heating darkens (endothermic, shifts right, Kc up) and compressing lightens relative to the compressed state (shift to fewer gas moles, Kc unchanged).

  # ================= Unit 8 · Electrochemistry, Nuclear and Organic (7)
  - slug: chem-final-q58
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the oxidation number of manganese in potassium permanganate, KMnO₄?
    options:
      - "+1"
      - "+4"
      - "+7"
      - "−1"
    option_explanations:
      - |
        +1 is potassium's number; manganese must balance the four oxygens as well.
      - |
        +4 would leave the compound with a net charge of −3.
      - |
        Correct. K is +1 and four oxygens are −8; for a neutral compound Mn = 0 − 1 + 8 = +7.
      - |
        A negative number for a metal in an oxide is not possible; the oxygens carry the negative numbers.
    answer: 2
    explanation: |
      +1 + Mn + 4(−2) = 0, so Mn = +7, its highest state, which is why permanganate is such a strong oxidising agent.

  - slug: chem-final-q59
    type: multiple_choice
    topic_code: "8.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A voltaic cell is made from zinc in Zn²⁺ (E° = −0.76 V) and copper in Cu²⁺ (E° = +0.34 V). What is E°cell and which electrode is the anode?
    options:
      - "0.42 V; copper is the anode."
      - "1.10 V; copper is the anode."
      - "0.42 V; zinc is the anode."
      - "1.10 V; zinc is the anode."
    option_explanations:
      - |
        0.42 V ignores the sign of the zinc potential, and copper, with the higher E°, is the cathode.
      - |
        The voltage is right, but copper is reduced and is therefore the cathode.
      - |
        Zinc is correctly the anode, but E°cell = 0.34 − (−0.76) = 1.10 V, not 0.42 V.
      - |
        Correct. The lower potential (zinc) is oxidised at the anode; E°cell = E°(cathode) − E°(anode) = 0.34 − (−0.76) = 1.10 V.
    answer: 3
    explanation: |
      Higher E° is the cathode; E°cell is the difference, 1.10 V, the classic Daniell cell voltage.

  - slug: chem-final-q60
    type: multiple_choice
    topic_code: "8.4"
    source: "general knowledge"
    points: 1
    prompt: |
      When water containing a little dissolved electrolyte is electrolysed, what is observed at the electrodes?
    options:
      - "Hydrogen at the cathode and oxygen at the anode, with twice the volume of hydrogen"
      - "Oxygen at the cathode and hydrogen at the anode, in equal volumes"
      - "Hydrogen at both electrodes"
      - "Chlorine at the anode and sodium metal at the cathode"
    option_explanations:
      - |
        Correct. 2H₂O + 2e⁻ → H₂ + 2OH⁻ at the cathode and 2H₂O → O₂ + 4H⁺ + 4e⁻ at the anode; overall 2H₂O → 2H₂ + O₂, so the hydrogen volume is double.
      - |
        Reduction (hydrogen formation) occurs at the cathode, oxidation (oxygen) at the anode, and the volumes are 2:1.
      - |
        Hydrogen forms only where reduction happens; the anode releases oxygen.
      - |
        Those are the products of molten sodium chloride; in dilute aqueous solution water is electrolysed instead.
    answer: 0
    explanation: |
      Cathode: reduction of water to H₂. Anode: oxidation of water to O₂. The 2:1 volume ratio follows the 2:1 mole ratio.

  - slug: chem-final-q61
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Complete the fission equation ²³⁵U + ¹n → ¹³⁷Te + ? + 2 ¹n, given that uranium is Z = 92, tellurium Z = 52 and zirconium Z = 40.
    options:
      - "⁹⁹Zr"
      - "⁹⁷Zr"
      - "⁹⁸Zr"
      - "⁹⁷Mo (Z = 42)"
    option_explanations:
      - |
        Mass numbers: 236 − 137 − 2 = 97, not 99.
      - |
        Correct. Mass: 235 + 1 = 236 = 137 + 97 + 2. Atomic number: 92 = 52 + 40 + 0. The fragment is zirconium-97.
      - |
        236 − 137 − 2 leaves 97 for the missing fragment.
      - |
        Atomic numbers must balance: 92 − 52 = 40, zirconium, not 42.
    answer: 1
    explanation: |
      Balance mass numbers and atomic numbers separately; neutrons contribute 1 to the mass count and 0 to the charge count.

  - slug: chem-final-q62
    type: multiple_choice
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the molecular formula of octane, the eight-carbon alkane in petrol?
    options:
      - "C₈H₁₆"
      - "C₈H₁₄"
      - "C₈H₁₈"
      - "C₈H₂₀"
    option_explanations:
      - |
        C₈H₁₆ fits CₙH₂ₙ, the alkene octene, which has a double bond.
      - |
        C₈H₁₄ fits CₙH₂ₙ₋₂, the alkyne octyne, which has a triple bond.
      - |
        Correct. Alkanes are CₙH₂ₙ₊₂: 2(8) + 2 = 18.
      - |
        Twenty hydrogens exceed the maximum eight carbons can bond; no such hydrocarbon exists.
    answer: 2
    explanation: |
      Saturated hydrocarbons follow CₙH₂ₙ₊₂; each double bond removes two hydrogens.

  - slug: chem-final-q63
    type: multiple_choice
    topic_code: "8.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which polymer is formed by condensation polymerisation, with a small molecule released at each link?
    options:
      - "Polyethene, from ethene"
      - "Poly(vinyl chloride), from chloroethene"
      - "Polystyrene, from phenylethene"
      - "Nylon, from a diamine and a dicarboxylic acid"
    option_explanations:
      - |
        Ethene adds through its C=C bond with nothing lost: addition polymerisation.
      - |
        Chloroethene also has a C=C bond and polymerises by addition.
      - |
        Phenylethene (styrene) is another addition monomer.
      - |
        Correct. Each −NH₂ joins each −COOH with loss of a water molecule, forming an amide link; the polymer's mass is less than its monomers' total.
    answer: 3
    explanation: |
      Addition: C=C monomers, no mass lost. Condensation: two-ended monomers, water lost per link (nylon, polyesters, proteins).

  - slug: chem-final-q64
    type: long_answer
    topic_code: "8.3"
    source: "general knowledge"
    points: 6
    prompt: |
      A voltaic cell is built from a magnesium electrode in 1.0 M Mg²⁺ solution and a copper electrode in 1.0 M Cu²⁺ solution, connected by a wire and a potassium nitrate salt bridge. Standard reduction potentials: Cu²⁺/Cu +0.34 V; Mg²⁺/Mg −2.37 V. Write a full account that: (1) assigns oxidation numbers and identifies the species oxidised, the species reduced, the oxidising agent and the reducing agent; (2) writes both half-reactions, labels each electrode as anode or cathode with its sign, and gives the balanced overall equation; (3) calculates E°cell and explains why its sign shows the reaction is spontaneous; (4) describes the direction of electron flow in the wire and of ion flow in the salt bridge, and which electrode gains mass; (5) calculates the mass of copper deposited if the cell delivers 0.200 A for 10.0 minutes (F = 96,485 C/mol; Cu = 63.55 g/mol).
    answer: |
      (1) Mg: 0 → +2 (oxidised); Cu: +2 → 0 (reduced). Magnesium metal is the reducing agent; Cu²⁺ is the oxidising agent. (2) Anode (negative), magnesium: Mg → Mg²⁺ + 2e⁻. Cathode (positive), copper: Cu²⁺ + 2e⁻ → Cu. Both halves involve two electrons, so they add directly: Mg + Cu²⁺ → Mg²⁺ + Cu. (3) E°cell = E°(cathode) − E°(anode) = 0.34 − (−2.37) = 2.71 V. A positive E°cell means the reaction as written releases energy and will drive a current; the species with the higher reduction potential (Cu²⁺) is indeed the one reduced. (4) Electrons flow through the wire from the magnesium anode to the copper cathode. In the salt bridge, nitrate ions move toward the magnesium half-cell to balance the Mg²⁺ being produced, and potassium ions move toward the copper half-cell to replace the Cu²⁺ being removed. The copper electrode gains mass as copper plates onto it; the magnesium electrode loses mass. (5) Q = I × t = 0.200 A × 600 s = 120 C. Moles of electrons = 120 ÷ 96,485 = 1.24 × 10⁻³ mol. Cu²⁺ + 2e⁻ → Cu needs two electrons per atom: 6.22 × 10⁻⁴ mol Cu × 63.55 g/mol = 0.0395 g of copper (about 40 mg).
    explanation: |
      6 points. 1 point: oxidation numbers with Mg oxidised and reducing agent, Cu²⁺ reduced and oxidising agent. 1 point: both half-reactions with correct electrode names and signs, and the overall equation. 1 point: 2.71 V with the spontaneity argument. 1 point: electron flow Mg → Cu in the wire, anions toward the anode and cations toward the cathode, copper gains mass. 1 point: Q = 120 C and 1.24 × 10⁻³ mol electrons. 1 point: 0.0395 g copper (accept 0.039 to 0.040 g). Deduct 1 point for scaling E° by a coefficient or for giving a negative E°cell.
