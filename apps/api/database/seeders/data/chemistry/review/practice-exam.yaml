week: 34
description: |
  A full-length practice version of the two-hour final: 64 items in course order, weighted by unit as the course
  weights them (unit 1 six items, units 2, 3, 5, 6 and 7 eight each, unit 4 eleven, unit 8 seven). Forty multiple
  choice, three select-all, four true/false, four fill-in-the-blank, eight numeric, three short answers (3 points
  each) and two long answers (6 points each); three stimulus sets (a table of molecules, a gas experiment and an
  industrial equilibrium) each carry three consecutive items. Multiple choice, select-all, true/false and numeric
  items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
  answers are graded by your teacher against the scoring notes. Constants: molar masses H 1.008, C 12.01, N 14.01,
  O 16.00, Na 22.99, Cl 35.45, Ca 40.08 g/mol; R = 0.08206 L·atm/(mol·K); water c = 4.184 J/(g·°C); K_w = 1.0 ×
  10⁻¹⁴; F = 96,485 C/mol; Avogadro's number 6.022 × 10²³. Sit it in one two-hour block with a calculator and no
  notes.
questions:
  # ================= Unit 1 · Matter and Measurement (6)
  - slug: chem-final-q01
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following is a homogeneous mixture?
    options:
      - "Air"
      - "Table salt, NaCl"
      - "Granite"
      - "Pure copper wire"
    option_explanations:
      - |
        Correct. Air is a uniform blend of nitrogen, oxygen, argon and other gases that can be separated physically; its composition is the same throughout a sample.
      - |
        Sodium chloride is a compound: a single pure substance with a fixed formula, not a mixture.
      - |
        Granite is a heterogeneous mixture; its mineral grains are visible as distinct regions.
      - |
        Pure copper is an element, a single substance.
    answer: 0
    explanation: |
      A homogeneous mixture (solution) is uniform throughout but variable in composition; a compound has a fixed composition; a heterogeneous mixture has visible regions.

  - slug: chem-final-q02
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      How many significant figures are in the measurement 0.00450 g?
    options:
      - "5"
      - "3"
      - "2"
      - "6"
    option_explanations:
      - |
        Leading zeros only locate the decimal point and are never significant.
      - |
        Correct. The 4, the 5 and the trailing zero after the decimal point are significant; the leading zeros are not.
      - |
        The trailing zero after a decimal point is significant because it reports precision the writer chose to include.
      - |
        Counting every digit including leading zeros overstates the precision.
    answer: 1
    explanation: |
      Leading zeros: never significant. Trailing zeros after a decimal point: always significant. 0.00450 has three.

  - slug: chem-final-q03
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      A swimming pool at 25 °C and a cup of tea at 80 °C are compared. Which statement is correct?
    options:
      - "The tea contains more thermal energy because its temperature is higher."
      - "Heat flows from the pool to the tea if they touch, because the pool has more energy."
      - "The pool contains more thermal energy, but the tea's particles have the higher average kinetic energy."
      - "Thermal energy and temperature are the same thing measured in different units."
    option_explanations:
      - |
        Temperature is average energy per particle; the pool's enormous mass gives it far more total energy.
      - |
        Heat flows from higher to lower temperature, so from the tea to the pool, regardless of total energy.
      - |
        Correct. Temperature measures the average kinetic energy of particles; thermal energy is the total, which scales with mass.
      - |
        Temperature is intensive (independent of amount); thermal energy is extensive.
    answer: 2
    explanation: |
      Temperature: average particle kinetic energy. Thermal energy: total, proportional to mass. Heat flows from hot to cold.

  - slug: chem-final-q04
    type: numeric
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A metal block has a mass of 27.0 g and displaces 10.0 mL of water. Calculate its density in g/mL to two decimal places.
    answer: { value: 2.70, tolerance: 0.01 }
    explanation: |
      d = m ÷ V = 27.0 g ÷ 10.0 mL = 2.70 g/mL, the density of aluminium.

  - slug: chem-final-q05
    type: true_false
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: the rusting of an iron nail is a physical change, because the nail keeps its shape.
    answer: false
    explanation: |
      False. Rusting forms a new substance, iron(III) oxide, with different properties from iron; a change that produces a new substance is chemical, whatever happens to the shape.

  - slug: chem-final-q06
    type: fill_blank
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      In the scientific method, a tentative, testable explanation proposed before an experiment is called a ____.
    answer:
      - "hypothesis"
    explanation: |
      A hypothesis is testable and can be rejected by an experiment; a theory is a well-supported explanation that has survived many tests.

  # ================= Unit 2 · Atomic Structure and the Periodic Table (8)
  - slug: chem-final-q07
    type: multiple_choice
    topic_code: "2.2"
    source: "general knowledge"
    points: 1
    prompt: |
      How many protons and neutrons are in an atom of chlorine-37 (atomic number 17)?
    options:
      - "37 protons, 17 neutrons"
      - "17 protons, 37 neutrons"
      - "20 protons, 17 neutrons"
      - "17 protons, 20 neutrons"
    option_explanations:
      - |
        The atomic number, 17, is the proton count; 37 is the mass number.
      - |
        Neutrons = mass number − atomic number = 37 − 17 = 20, not 37.
      - |
        The proton count is fixed by the element: chlorine always has 17.
      - |
        Correct. Protons = atomic number = 17; neutrons = 37 − 17 = 20.
    answer: 3
    explanation: |
      Atomic number = protons; mass number = protons + neutrons. Chlorine-37 has 17 protons and 20 neutrons.

  - slug: chem-final-q08
    type: multiple_choice
    topic_code: "2.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Chlorine is 75.76% chlorine-35 (mass 34.969 u) and 24.24% chlorine-37 (mass 36.966 u). What is its average atomic mass?
    options:
      - "35.45 u"
      - "35.97 u"
      - "36.00 u"
      - "34.97 u"
    option_explanations:
      - |
        Correct. 0.7576 × 34.969 + 0.2424 × 36.966 = 26.49 + 8.96 = 35.45 u, the periodic-table value.
      - |
        35.97 is the simple average of the two masses, ignoring that chlorine-35 is three times as abundant.
      - |
        36.00 is weighted toward the heavier isotope; the lighter one dominates.
      - |
        34.97 is the mass of chlorine-35 alone; the average must lie between the two isotope masses.
    answer: 0
    explanation: |
      Average atomic mass = Σ(mass × fractional abundance). The result is closer to the more abundant isotope.

  - slug: chem-final-q09
    type: multiple_choice
    topic_code: "2.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Hydrogen's visible spectrum includes a red line at 656 nm and a violet line at 410 nm. Which statement is correct?
    options:
      - "The red photon has more energy because it has the longer wavelength."
      - "The violet photon has more energy, because it has the shorter wavelength and higher frequency, and comes from a larger drop between energy levels."
      - "Both photons have the same energy because they come from the same atom."
      - "The violet line comes from an electron absorbing energy."
    option_explanations:
      - |
        Energy is inversely proportional to wavelength; longer wavelength means less energy.
      - |
        Correct. E = hc ÷ λ: the shorter the wavelength, the higher the frequency and energy; the violet line is the electron falling from level 6 to level 2, the red from 3 to 2.
      - |
        Each line corresponds to a different transition with its own energy difference.
      - |
        Emission lines come from electrons dropping to a lower level and releasing a photon.
    answer: 1
    explanation: |
      Shorter wavelength = higher frequency = higher photon energy = a larger gap between the levels the electron fell between.

  - slug: chem-final-q10
    type: multiple_choice
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the ground-state electron configuration of sulfur (atomic number 16)?
    options:
      - "1s² 2s² 2p⁶ 3s² 3p⁶"
      - "1s² 2s² 2p⁶ 3s¹ 3p⁵"
      - "1s² 2s² 2p⁶ 3s² 3p⁴"
      - "1s² 2s² 2p⁴ 3s² 3p⁶"
    option_explanations:
      - |
        This has 18 electrons; it is argon's configuration.
      - |
        The 3s fills completely before 3p begins to fill; this is not the ground state.
      - |
        Correct. 2 + 2 + 6 + 2 + 4 = 16 electrons, filling in order 1s, 2s, 2p, 3s, 3p; six valence electrons in group 16.
      - |
        2p must hold its full six before 3s starts to fill.
    answer: 2
    explanation: |
      Fill subshells in order of increasing energy: 1s, 2s, 2p, 3s, 3p. Sulfur's six valence electrons (3s² 3p⁴) place it in group 16.

  - slug: chem-final-q11
    type: multiple_choice
    topic_code: "2.8"
    source: "general knowledge"
    points: 1
    prompt: |
      Which atom has the largest atomic radius?
    options:
      - "Sodium (Na)"
      - "Chlorine (Cl)"
      - "Bromine (Br)"
      - "Potassium (K)"
    option_explanations:
      - |
        Sodium is large for its period, but potassium, one period lower, has an extra occupied shell.
      - |
        Chlorine, at the right of period 3, is among the smallest atoms in its period.
      - |
        Bromine is in period 4 but far to the right, where the increasing nuclear charge pulls the shells in.
      - |
        Correct. Radius increases down a group (more shells) and decreases across a period (more nuclear charge); potassium is lowest and furthest left of the four.
    answer: 3
    explanation: |
      Largest atoms are at the bottom left of the table: potassium beats sodium (one more shell) and beats bromine (same period, less nuclear charge pulling on the outer shell).

  - slug: chem-final-q12
    type: numeric
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Iodine-131 has a half-life of 8.0 days. How many grams of an 80.0 g sample remain after 32 days? Give your answer to one decimal place.
    answer: { value: 5.0, tolerance: 0.1 }
    explanation: |
      32 ÷ 8.0 = 4 half-lives. 80.0 → 40.0 → 20.0 → 10.0 → 5.0 g, or 80.0 × (½)⁴ = 5.0 g.

  - slug: chem-final-q13
    type: multi_select
    topic_code: "2.7"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which statements about the periodic table are correct? Select all that apply.
    options:
      - "Elements in the same group have the same number of valence electrons."
      - "The period number equals the number of occupied electron shells."
      - "The noble gases are in group 18 and are chemically unreactive."
      - "Metals are found on the right side of the table."
      - "The halogens are group 17 and form 1− ions."
    option_explanations:
      - |
        Correct. Shared valence electron count is why a group shares chemical behaviour.
      - |
        Correct. Period 3 elements have electrons in three shells.
      - |
        Correct. Their filled outer shells make them stable.
      - |
        Metals occupy the left and centre; nonmetals are on the right, with the staircase between.
      - |
        Correct. One electron short of a full shell, they gain one to form halide ions.
    answer: [0, 1, 2, 4]
    explanation: |
      Groups share valence electrons; periods share shell count; metals are on the left and centre.

  - slug: chem-final-q14
    type: fill_blank
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    prompt: |
      The principle that the total mass of the products of a chemical reaction equals the total mass of the reactants is the law of ____.
    answer:
      - "conservation of mass"
      - "the conservation of mass"
      - "mass conservation"
    explanation: |
      Lavoisier's law of conservation of mass: atoms are rearranged, not created or destroyed, which is why equations must balance.

  # ================= Unit 3 · Chemical Bonding and Nomenclature (8)
  # ---- Stimulus set A: three molecules (3.5, 3.6)
  - slug: chem-final-q15
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Three small molecules and their Lewis structures described in words:

      | Molecule | Central atom | Bonding pairs on central atom | Lone pairs on central atom |
      | --- | --- | --- | --- |
      | H₂O | O | 2 | 2 |
      | CO₂ | C | 2 double bonds | 0 |
      | NH₃ | N | 3 | 1 |
    prompt: |
      What is the molecular shape of ammonia, NH₃?
    options:
      - "Trigonal pyramidal"
      - "Trigonal planar"
      - "Tetrahedral"
      - "Bent"
    option_explanations:
      - |
        Correct. Four electron domains (three bonds, one lone pair) arrange tetrahedrally, but the shape is named for the atoms only: a pyramid with N at the apex, angle about 107°.
      - |
        Trigonal planar requires three domains and no lone pair, as in BF₃; the lone pair pushes the hydrogens down.
      - |
        The electron-domain geometry is tetrahedral, but the molecular shape counts only atoms, giving a pyramid.
      - |
        Bent describes a central atom with two bonds and one or two lone pairs, such as water.
    answer: 0
    explanation: |
      VSEPR: count domains for the arrangement, then name the shape by the atoms. Three bonds plus one lone pair: trigonal pyramidal.

  - slug: chem-final-q16
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Three small molecules and their Lewis structures described in words:

      | Molecule | Central atom | Bonding pairs on central atom | Lone pairs on central atom |
      | --- | --- | --- | --- |
      | H₂O | O | 2 | 2 |
      | CO₂ | C | 2 double bonds | 0 |
      | NH₃ | N | 3 | 1 |
    prompt: |
      Which of the three molecules is nonpolar, and why?
    options:
      - "H₂O, because its O–H bonds are nonpolar"
      - "CO₂, because it is linear and its two polar C=O bond dipoles cancel"
      - "NH₃, because nitrogen and hydrogen have equal electronegativities"
      - "None; every molecule containing oxygen or nitrogen is polar"
    option_explanations:
      - |
        O–H bonds are strongly polar, and water's bent shape leaves a net dipole; water is polar.
      - |
        Correct. Each C=O bond is polar, but with no lone pairs on carbon the molecule is linear and the two dipoles point in opposite directions and cancel.
      - |
        N (3.04) and H (2.20) differ in electronegativity, and the pyramidal shape leaves a net dipole; ammonia is polar.
      - |
        CO₂ contains oxygen and is nonpolar; polarity depends on shape as well as bonds.
    answer: 1
    explanation: |
      A molecule is nonpolar when its bond dipoles cancel by symmetry. Linear CO₂ does; bent H₂O and pyramidal NH₃ do not.

  - slug: chem-final-q17
    type: multiple_choice
    topic_code: "3.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Three small molecules and their Lewis structures described in words:

      | Molecule | Central atom | Bonding pairs on central atom | Lone pairs on central atom |
      | --- | --- | --- | --- |
      | H₂O | O | 2 | 2 |
      | CO₂ | C | 2 double bonds | 0 |
      | NH₃ | N | 3 | 1 |
    prompt: |
      Which molecule has the highest boiling point, and which intermolecular force explains it?
    options:
      - "CO₂, because it has the largest molar mass and the strongest dispersion forces"
      - "NH₃, because it is the most polar"
      - "H₂O, because each molecule can form two hydrogen bonds through its two O–H bonds and two lone pairs"
      - "All three boil at similar temperatures because they are all small molecules"
    option_explanations:
      - |
        CO₂ is nonpolar and held only by dispersion forces; it sublimes at −78 °C.
      - |
        Ammonia hydrogen-bonds but less extensively than water (boiling point −33 °C).
      - |
        Correct. Water's two O–H bonds and two lone pairs let each molecule take part in up to four hydrogen bonds, giving a boiling point of 100 °C, far above the others.
      - |
        Their boiling points span nearly 180 °C because their intermolecular forces differ greatly.
    answer: 2
    explanation: |
      Hydrogen bonding (H on N, O or F attracted to a lone pair) is the strongest intermolecular force among small molecules, and water forms the most of it.

  - slug: chem-final-q18
    type: multiple_choice
    topic_code: "3.2"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the name of Fe₂(SO₄)₃?
    options:
      - "Iron sulfide"
      - "Iron(II) sulfate"
      - "Diiron trisulfate"
      - "Iron(III) sulfate"
    option_explanations:
      - |
        Sulfide is S²⁻; this compound contains the sulfate ion, SO₄²⁻.
      - |
        Three sulfate ions carry 6− in total; two iron ions must supply 6+, so each is 3+, not 2+.
      - |
        Greek prefixes are used for molecular compounds; ionic compounds with a transition metal use a Roman numeral for the charge.
      - |
        Correct. Three SO₄²⁻ (6−) balanced by two Fe³⁺ (6+): iron(III) sulfate.
    answer: 3
    explanation: |
      Work out the metal's charge from the anions: 3 × 2− = 6−, so 2 Fe carry 6+, each 3+. Roman numeral names the charge.

  - slug: chem-final-q19
    type: multiple_choice
    topic_code: "3.1"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the formula of the ionic compound formed between calcium and nitrogen?
    options:
      - "Ca₃N₂"
      - "CaN"
      - "Ca₂N₃"
      - "CaN₂"
    option_explanations:
      - |
        Correct. Calcium forms Ca²⁺ and nitrogen forms N³⁻; three Ca²⁺ (6+) balance two N³⁻ (6−).
      - |
        A 1:1 ratio would leave a net charge of 1−; the charges 2+ and 3− need the ratio 3:2.
      - |
        Two Ca²⁺ (4+) and three N³⁻ (9−) do not balance.
      - |
        One Ca²⁺ against two N³⁻ gives a net 4−.
    answer: 0
    explanation: |
      Cross the charges: Ca²⁺ and N³⁻ give Ca₃N₂, calcium nitride, with total charge zero.

  - slug: chem-final-q20
    type: true_false
    topic_code: "3.7"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: metals conduct electricity because their valence electrons are delocalised and free to move through the lattice of metal ions.
    answer: true
    explanation: |
      True. The "sea of electrons" model explains conductivity, malleability (layers of ions slide without breaking bonds) and lustre.

  - slug: chem-final-q21
    type: multiple_choice
    topic_code: "3.4"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the name of the molecular compound N₂O₅?
    options:
      - "Nitrogen oxide"
      - "Dinitrogen pentoxide"
      - "Nitrogen(V) oxide"
      - "Dinitrogen pentaoxide"
    option_explanations:
      - |
        Without prefixes the name does not distinguish N₂O₅ from NO, NO₂ or N₂O.
      - |
        Correct. Two nonmetals take Greek prefixes: di- for two nitrogens, pent- for five oxygens, with the "a" dropped before "oxide".
      - |
        Roman numerals are used for metals in ionic compounds, not for molecular compounds.
      - |
        The "a" of penta- is dropped before a vowel: pentoxide.
    answer: 1
    explanation: |
      Molecular (nonmetal–nonmetal) compounds use Greek prefixes; mono- is omitted on the first element and the vowel is dropped before "oxide".

  - slug: chem-final-q22
    type: short_answer
    topic_code: "3.3"
    source: "general knowledge"
    points: 3
    prompt: |
      Consider the molecules CO₂, H₂O and NH₃.
      (a) State the total number of valence electrons in each molecule.
      (b) Describe the Lewis structure of CO₂ in words (bonds and lone pairs on each atom) and explain why carbon forms double bonds in it.
      (c) Explain why the bond angle in water (about 104.5°) is smaller than in ammonia (about 107°) even though both are based on a tetrahedral arrangement.
    answer: |
      (a) CO₂: 4 + 2(6) = 16. H₂O: 2(1) + 6 = 8. NH₃: 5 + 3(1) = 8. (b) Carbon is in the centre with a double bond to each oxygen (O=C=O); carbon has no lone pairs; each oxygen has two lone pairs. Sixteen electrons must give every atom an octet: single bonds would leave carbon with only four electrons, so each oxygen shares two pairs with carbon. (c) Lone pairs repel more strongly than bonding pairs because they are held closer to the central atom. Water's oxygen has two lone pairs, which squeeze the two O–H bonds closer together than ammonia's single lone pair squeezes its three N–H bonds; each lone pair reduces the angle by about 2.5° from 109.5°.
    explanation: |
      1 point for (a) 16, 8 and 8. 1 point for (b) two C=O double bonds, two lone pairs on each O, none on C, with the octet reason. 1 point for (c) lone-pair repulsion greater than bonding-pair repulsion, two lone pairs in water versus one in ammonia.

  # ================= Unit 4 · Chemical Reactions and Stoichiometry (11)
  - slug: chem-final-q23
    type: multiple_choice
    topic_code: "4.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which is the correctly balanced equation for aluminium reacting with oxygen to form aluminium oxide?
    options:
      - "Al + O₂ → AlO₂"
      - "2Al + 3O → Al₂O₃"
      - "4Al + 3O₂ → 2Al₂O₃"
      - "2Al + 3O₂ → 2Al₂O₃"
    option_explanations:
      - |
        AlO₂ is not the formula of aluminium oxide; Al³⁺ and O²⁻ give Al₂O₃.
      - |
        Oxygen gas is diatomic, O₂; a balanced equation cannot use lone O atoms.
      - |
        Correct. Al: 4 = 4; O: 6 = 6. The formula Al₂O₃ is kept and only coefficients are changed.
      - |
        Aluminium is unbalanced (2 against 4) and oxygen too (6 against 6 is fine, but Al fails).
    answer: 2
    explanation: |
      Write correct formulas first (Al, O₂, Al₂O₃), then balance with coefficients only: 4Al + 3O₂ → 2Al₂O₃.

  - slug: chem-final-q24
    type: multiple_choice
    topic_code: "4.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂(g) is an example of which reaction type?
    options:
      - "Synthesis"
      - "Decomposition"
      - "Double replacement"
      - "Single replacement"
    option_explanations:
      - |
        Synthesis combines simpler substances into one product; here there are two products.
      - |
        Decomposition breaks one reactant apart; here there are two reactants.
      - |
        Double replacement swaps partners between two compounds; here one reactant is an element.
      - |
        Correct. The element zinc replaces hydrogen in the compound HCl, releasing hydrogen gas.
    answer: 3
    explanation: |
      Element + compound → different element + different compound is single replacement, governed by the activity series.

  - slug: chem-final-q25
    type: multiple_choice
    topic_code: "4.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Solutions of lead(II) nitrate and potassium iodide are mixed. Using the solubility rules (nitrates and group 1 salts are soluble; most iodides are soluble except those of Ag⁺, Pb²⁺ and Hg₂²⁺), what happens?
    options:
      - "A yellow precipitate of lead(II) iodide, PbI₂, forms."
      - "A precipitate of potassium nitrate forms."
      - "No reaction; all possible products are soluble."
      - "Hydrogen gas is released."
    option_explanations:
      - |
        Correct. Swapping partners gives PbI₂ and KNO₃; lead(II) iodide is one of the insoluble iodides and drops out as a bright yellow solid.
      - |
        All nitrates and all potassium salts are soluble; KNO₃ stays in solution as spectator ions.
      - |
        One product, PbI₂, is insoluble, so a double-replacement precipitation does occur.
      - |
        No acid and no active metal are present; nothing produces hydrogen.
    answer: 0
    explanation: |
      Predict the double-replacement products, then check each against the solubility rules: Pb(NO₃)₂ + 2KI → PbI₂(s) + 2KNO₃(aq).

  - slug: chem-final-q26
    type: numeric
    topic_code: "4.4"
    source: "general knowledge"
    points: 1
    prompt: |
      How many moles of calcium carbonate, CaCO₃, are in a 10.0 g sample? Use Ca 40.08, C 12.01 and O 16.00 g/mol, and give your answer to three significant figures.
    answer: { value: 0.0999, tolerance: 0.001 }
    explanation: |
      Molar mass = 40.08 + 12.01 + 3(16.00) = 100.09 g/mol. 10.0 g ÷ 100.09 g/mol = 0.0999 mol.

  - slug: chem-final-q27
    type: multiple_choice
    topic_code: "4.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A compound is 40.0% carbon, 6.7% hydrogen and 53.3% oxygen by mass. What is its empirical formula?
    options:
      - "CHO"
      - "CH₂O"
      - "C₂H₄O"
      - "CH₃O"
    option_explanations:
      - |
        CHO would be about 41% C, 3.4% H and 55% O; the hydrogen content here is twice that.
      - |
        Correct. In 100 g: C 40.0 ÷ 12.01 = 3.33 mol; H 6.7 ÷ 1.008 = 6.65 mol; O 53.3 ÷ 16.00 = 3.33 mol. Dividing by 3.33 gives 1 : 2 : 1, CH₂O.
      - |
        C₂H₄O has twice as much carbon per oxygen as the data show (the C and O mole counts are equal).
      - |
        CH₃O would require about 7.8% hydrogen for 40% carbon; the ratio here is 2 H per C.
    answer: 1
    explanation: |
      Percent to grams to moles, divide by the smallest, round to whole numbers: CH₂O (formaldehyde, and the empirical formula of glucose).

