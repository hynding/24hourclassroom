  - slug: chem-final-q34
    type: multiple_choice
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      A cylinder fitted with a piston holds 0.0820 mol of nitrogen gas in a volume of 2.00 L at 27 °C (300 K). R = 0.08206 L·atm/(mol·K).
    prompt: |
      The piston is pushed in until the volume is 1.00 L while the temperature is held at 27 °C. What happens to the pressure?
    options:
      - "It halves, because the gas has less room to exert force."
      - "It stays the same, because the temperature is constant."
      - "It falls to zero, because the gas is compressed."
      - "It doubles, because the same number of molecules now strike half the wall area twice as often (Boyle's law)."
    option_explanations:
      - |
        Pressure rises when a gas is compressed; halving the volume doubles, not halves, the pressure.
      - |
        Constant temperature means PV is constant, so a change in volume must change the pressure.
      - |
        Compressing a gas increases its pressure; nothing about it approaches zero.
      - |
        Correct. Boyle's law: P₁V₁ = P₂V₂ at constant T and n; halving V doubles P because collisions with the walls become twice as frequent.
    answer: 3
    explanation: |
      Boyle's law: pressure and volume are inversely proportional at constant temperature and amount.

  - slug: chem-final-q35
    type: multiple_choice
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    stimulus: |
