  - slug: chem-final-q49
    type: short_answer
    topic_code: "6.5"
    source: "general knowledge"
    points: 3
    prompt: |
      Two solutions are tested: lemon juice at pH 2 and black coffee at pH 5.
      (a) Which is more acidic, and by what factor do their hydrogen-ion concentrations differ?
