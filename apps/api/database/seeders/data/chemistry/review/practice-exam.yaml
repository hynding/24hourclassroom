  - slug: chem-final-q33
    type: long_answer
    topic_code: "4.7"
    source: "general knowledge"
    points: 6
    prompt: |
      Aluminium reacts with chlorine: 2Al + 3Cl₂ → 2AlCl₃. A student reacts 10.0 g of aluminium with 30.0 g of chlorine gas and collects 32.0 g of aluminium chloride. Molar masses: Al 26.98, Cl₂ 70.90, AlCl₃ 133.33 g/mol. Showing every step: (1) convert each reactant to moles; (2) determine the limiting reactant and justify it with the mole ratio; (3) calculate the theoretical yield of AlCl₃ in grams; (4) calculate the percent yield; (5) calculate the mass of the excess reactant left over; (6) suggest two reasons the yield is below 100%.
    answer: |
      (1) Al: 10.0 ÷ 26.98 = 0.3706 mol. Cl₂: 30.0 ÷ 70.90 = 0.4231 mol. (2) The ratio needed is 2 Al : 3 Cl₂. 0.3706 mol Al would need 0.3706 × 3/2 = 0.5559 mol Cl₂, but only 0.4231 mol is available, so chlorine is the limiting reactant and aluminium is in excess. (Equivalently, 0.4231 mol Cl₂ needs only 0.2821 mol Al.) (3) AlCl₃ from the limiting reactant: 0.4231 mol Cl₂ × (2 mol AlCl₃ ÷ 3 mol Cl₂) = 0.2821 mol × 133.33 g/mol = 37.6 g theoretical yield. (4) Percent yield = 32.0 ÷ 37.6 × 100 = 85.1%. (5) Aluminium used: 0.2821 mol × 26.98 = 7.61 g; left over: 10.0 − 7.61 = 2.39 g (about 2.4 g). (6) Some chlorine may escape before reacting; some aluminium may be coated with unreactive oxide; product may be lost in transfer or filtering; the reaction may not have gone to completion; some aluminium chloride, which is volatile, may sublime away during heating.
    explanation: |
      6 points. 1 point: both mole conversions (0.371 and 0.423 mol). 1 point: chlorine identified as limiting with a ratio argument. 1 point: theoretical yield 37.6 g (accept 37.5 to 37.7). 1 point: 85.1% (accept 85 to 85.3). 1 point: 2.4 g of aluminium left (accept 2.3 to 2.5). 1 point: two plausible reasons for the shortfall. Deduct 1 point if the theoretical yield is computed from the excess reactant.

  # ================= Unit 5 · Gases, Liquids and Solids (8)
