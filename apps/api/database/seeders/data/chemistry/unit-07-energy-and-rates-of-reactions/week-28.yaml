        (b) State what the three results show about the equilibrium constant.
        (c) Flask 2 is warmed to 50 °C and becomes darker brown. State what this tells you about the sign of ΔH for the forward reaction, and what happens to Kc.
      answer: |
        (a) Kc = [NO₂]² ÷ [N₂O₄]. Flask 1: (0.0120)² ÷ 0.0400 = 0.000144 ÷ 0.0400 = 0.0036. Flask 2: (0.0190)² ÷ 0.1000 = 0.000361 ÷ 0.1000 = 0.0036. Flask 3: (0.0060)² ÷ 0.0100 = 0.000036 ÷ 0.0100 = 0.0036. (b) Although the individual concentrations differ, the ratio is the same in every flask: Kc depends only on the temperature, not on the starting amounts. (c) NO₂ is the brown gas, so warming shifted the equilibrium toward NO₂, the endothermic direction; the forward reaction (N₂O₄ → 2NO₂) is therefore endothermic, ΔH positive, and Kc increases at the higher temperature.
      explanation: |
        1 point for (a) the correct expression and three values of about 0.0036. 1 point for (b) Kc is constant at a given temperature regardless of starting amounts. 1 point for (c) ΔH positive (forward endothermic) with the reasoning from the colour, and Kc increases.

    # ---- Long answer
    - slug: chem-u07-w28-q23
      type: long_answer
      topic_code: "7.6"
      source: "general knowledge"
      points: 6
      prompt: |
        Sulfuric acid manufacture depends on the equilibrium 2SO₂(g) + O₂(g) ⇌ 2SO₃(g), ΔH = −198 kJ. In industry it is run at about 450 °C and just above atmospheric pressure over a vanadium(V) oxide catalyst, and about 98 percent of the SO₂ is converted. Write an account that: (1) writes the Kc expression and explains what a large Kc would mean here; (2) predicts, with reasons, the effect on the equilibrium position and on Kc of raising the pressure, raising the temperature and adding the catalyst; (3) explains why 450 °C is chosen even though a lower temperature gives a higher equilibrium yield; (4) explains why high pressure is not used even though it would raise the yield; (5) uses collision theory to explain how the catalyst does its job.
      answer: |
        (1) Kc = [SO₃]² ÷ ([SO₂]²[O₂]). A large Kc means that at equilibrium the mixture is mostly SO₃ with little SO₂ and O₂ left: the conversion is nearly complete. (2) Raising the pressure: three moles of gas become two, so the equilibrium shifts right toward SO₃; Kc is unchanged. Raising the temperature: the forward reaction is exothermic, so heat is a product and heating shifts the equilibrium left toward SO₂ and O₂; Kc decreases. Adding the catalyst: no shift and no change in Kc; equilibrium is reached faster. (3) At a low temperature the equilibrium yield is high but the rate is very low, because few collisions have energy above the activation energy, so the plant would produce SO₃ too slowly to be useful. At 450 °C with the catalyst the reaction reaches equilibrium quickly, and because Kc is still large at that temperature the yield remains about 98 percent; the compromise costs little yield and gains a great deal of rate. (4) The yield is already about 98 percent at low pressure, so compressing the gases would gain at most two percent while requiring expensive, thick-walled, high-pressure equipment and energy for compression; a pressure just above atmospheric is enough to push the gases through the plant. (5) The vanadium(V) oxide provides a different pathway in which SO₂ reacts with the oxide surface and the oxide is then regenerated by O₂; each step has a lower activation energy than the direct reaction, so at 450 °C a far larger fraction of collisions are effective. The catalyst lowers the barrier for both the forward and reverse reactions equally, which is why it speeds the approach to equilibrium without moving it, and it is not consumed.
      explanation: |
        6 points. 1 point: correct Kc expression and the meaning of a large value. 1 point: pressure shift right with the gas-moles reason, Kc unchanged. 1 point: temperature shift left with the exothermic reason, Kc decreases; catalyst no shift. 1 point: the rate-versus-yield compromise explained with activation energy or effective collisions. 1 point: high pressure rejected because the yield is already near complete and the cost is high. 1 point: catalyst explained as a lower-Ea pathway that speeds both directions and is not used up. Deduct 1 point if Kc is said to change with pressure or catalyst.
