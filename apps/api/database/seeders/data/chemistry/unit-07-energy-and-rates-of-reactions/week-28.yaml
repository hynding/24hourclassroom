    # ---- Short answer
    - slug: chem-u07-w28-q21
      type: short_answer
      topic_code: "7.6"
      source: "general knowledge"
      points: 3
      prompt: |
        Methanol is made industrially by CO(g) + 2H₂(g) ⇌ CH₃OH(g), ΔH = −90 kJ.
        (a) State the pressure and temperature conditions that would give the highest equilibrium yield of methanol, giving a reason for each.
        (b) Explain why a real plant uses a temperature of about 250 °C rather than a much lower one.
        (c) A student suggests that a catalyst would raise the yield further. Evaluate this suggestion.
      answer: |
        (a) High pressure, because three moles of gas become one and a shift to the right reduces the pressure; low temperature, because the forward reaction is exothermic (heat is a product) and cooling shifts the equilibrium toward methanol. (b) At low temperature the rate is far too slow: few collisions have the activation energy, so equilibrium would take an uneconomic time to reach. A moderate temperature with a catalyst reaches a somewhat lower-yield equilibrium quickly, and the methanol is condensed out and the gases recycled. (c) Incorrect. A catalyst lowers the activation energy of the forward and reverse reactions equally, so it does not change the position of equilibrium or the yield; it only reduces the time needed to reach that yield.
      explanation: |
        1 point for (a) high pressure with the gas-moles reason and low temperature with the exothermic reason. 1 point for (b) the rate argument (activation energy or fraction of effective collisions) and the compromise. 1 point for (c) rejecting the suggestion because a catalyst affects rate only. Deduct if the student claims the catalyst shifts the equilibrium.

