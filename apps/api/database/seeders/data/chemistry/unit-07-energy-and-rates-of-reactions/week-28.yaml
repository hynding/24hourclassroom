      stimulus: |
        Three sealed flasks of N₂O₄(g) ⇌ 2NO₂(g) at 25 °C, started with different amounts, reach equilibrium with these concentrations:

        | Flask | [N₂O₄] (M) | [NO₂] (M) |
        | --- | --- | --- |
        | 1 | 0.0400 | 0.0120 |
