week: 28
unit: 7
title: "Equilibrium and Le Châtelier's Principle"
topics: ["7.6"]
guide: guides/week-28.md
guide_description: |
  Reversible reactions and the meaning of dynamic equilibrium, how equilibrium is reached in rate terms, writing
  and evaluating the equilibrium constant Kc (solids and liquids omitted, coefficients as exponents) and reading
  its size, Le Châtelier's principle for concentration, pressure and temperature changes, why only temperature
  changes Kc and a catalyst changes nothing but the time, the Haber process compromise, and the equilibria met
  earlier in the course.
flashcards_description: |
  28 cards on reversible reactions, dynamic equilibrium, the Kc expression and its size, each Le Châtelier
  shift with its reason, the Haber process conditions and earlier equilibria.

flashcards:
  - front: Reversible reaction → meaning and symbol
    back: |
      A reaction whose products can re-form the reactants under the same conditions, written with ⇌. Example: 2NO₂(g) ⇌ N₂O₄(g).
    topic_code: "7.6"
  - front: Dynamic equilibrium → three defining facts
    back: |
      Forward and reverse reactions continue at equal rates; concentrations are constant (not equal); it exists only in a closed system.
    topic_code: "7.6"
  - front: Why equilibrium needs a closed system
    back: |
      If a product escapes, the reverse reaction has nothing to act on and the forward reaction runs to completion, as when limestone is heated in an open kiln and CO₂ blows away.
    topic_code: "7.6"
  - front: How a reaction approaches equilibrium, in rate terms
    back: |
      At the start the forward rate is highest and the reverse rate zero; as products build the reverse rate rises and the forward rate falls until they are equal, when concentrations stop changing.
    topic_code: "7.6"
  - front: Kc expression → general form
    back: |
      For aA + bB ⇌ cC + dD: Kc = [C]^c [D]^d ÷ [A]^a [B]^b, with equilibrium concentrations in mol/L and coefficients as exponents.
    topic_code: "7.6"
  - front: What is left out of a Kc expression
    back: |
      Pure solids and pure liquids, because their concentrations do not change. For CaCO₃(s) ⇌ CaO(s) + CO₂(g), Kc = [CO₂].
    topic_code: "7.6"
  - front: Kc for H₂(g) + I₂(g) ⇌ 2HI(g) from [H₂] = [I₂] = 0.020 M, [HI] = 0.140 M
    back: |
      Kc = [HI]² ÷ ([H₂][I₂]) = 0.0196 ÷ 0.00040 = 49.
    topic_code: "7.6"
  - front: Reading the size of Kc
    back: |
      Kc much greater than 1: products dominate, reaction nearly complete. Kc much less than 1: mostly reactants. Kc near 1: substantial amounts of both.
    topic_code: "7.6"
  - front: What Kc depends on, and what it does not
    back: |
      Only temperature. Changing concentrations, pressure or volume, or adding a catalyst, leaves Kc the same; the concentrations rearrange to give the same ratio.
    topic_code: "7.6"
  - front: Le Châtelier's principle → statement
    back: |
      If a change is imposed on a system at equilibrium, the position of equilibrium shifts in the direction that partly counteracts the change.
    topic_code: "7.6"
  - front: Le Châtelier → adding a reactant
    back: |
      Shift right (toward products), consuming some of the added reactant. The forward rate temporarily exceeds the reverse rate. Kc unchanged.
    topic_code: "7.6"
  - front: Le Châtelier → removing a product
    back: |
      Shift right to replace some of what was removed. Industry removes products continuously (liquefying ammonia) to keep the reaction moving forward.
    topic_code: "7.6"
  - front: Le Châtelier → increasing pressure by decreasing volume
    back: |
      Shift toward the side with fewer moles of gas, which lowers the pressure. Count gas moles only. No shift if both sides have equal gas moles.
    topic_code: "7.6"
  - front: Le Châtelier → adding an inert gas at constant volume
    back: |
      No shift. Total pressure rises but the concentration (and partial pressure) of every reacting gas is unchanged.
    topic_code: "7.6"
  - front: Le Châtelier → raising the temperature of an exothermic reaction
    back: |
      Heat is a product, so heating shifts the equilibrium left toward reactants, and Kc decreases.
    topic_code: "7.6"
  - front: Le Châtelier → raising the temperature of an endothermic reaction
    back: |
      Heat is a reactant, so heating shifts the equilibrium right toward products, and Kc increases.
    topic_code: "7.6"
  - front: Why only temperature changes Kc
    back: |
      Heating speeds both reactions but the one with the larger activation energy speeds up more, so the balance point itself moves; a concentration or pressure change only moves the system along the same balance.
    topic_code: "7.6"
  - front: Effect of a catalyst on an equilibrium
    back: |
      None on the position or Kc. It lowers Ea for the forward and reverse reactions equally, so equilibrium is reached sooner with the same composition.
    topic_code: "7.6"
  - front: Haber process → equation and ΔH
    back: |
      N₂(g) + 3H₂(g) ⇌ 2NH₃(g), ΔH = −92 kJ. Four moles of gas become two; exothermic.
    topic_code: "7.6"
  - front: Haber process → conditions and why each is chosen
    back: |
      About 200 atm (high pressure shifts toward fewer gas moles); about 450 °C (a compromise: low temperature favours yield but is too slow); iron catalyst (reaches equilibrium faster); ammonia liquefied out and gases recycled.
    topic_code: "7.6"
  - front: Yield versus rate compromise in industry
    back: |
      For an exothermic equilibrium, low temperature gives the best yield but a hopeless rate; plants run at a moderate temperature with a catalyst and remove the product to drive the reaction on.
    topic_code: "7.6"
  - front: N₂O₄ ⇌ 2NO₂ colour test for shifts
    back: |
      NO₂ is brown, N₂O₄ colourless. Heating (endothermic forward, ΔH = +58 kJ) darkens the tube; compressing briefly darkens then lightens as the equilibrium shifts toward N₂O₄ (fewer gas moles).
    topic_code: "7.6"
  - front: Equilibrium position of a weak acid
    back: |
      CH₃COOH ⇌ H⁺ + CH₃COO⁻ lies far to the left; its Kc is the acid dissociation constant Ka, small for a weak acid, which is why its pH is higher than a strong acid's at the same molarity.
    topic_code: "7.6"
  - front: Saturated solution as an equilibrium
    back: |
      Solid ⇌ dissolved ions, with dissolving and crystallising at equal rates; the concentration holds at the solubility, and added solid simply sits there.
    topic_code: "7.6"
  - front: Water's autoionisation equilibrium
    back: |
      H₂O ⇌ H⁺ + OH⁻, Kw = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴ at 25 °C. Endothermic, so Kw rises with temperature and neutral water is slightly below pH 7 when hot.
    topic_code: "7.6"
  - front: Opening a fizzy drink → the equilibrium explanation
    back: |
      CO₂(g) ⇌ CO₂(aq). Releasing the cap drops the CO₂ pressure, so the equilibrium shifts toward gas and dissolved CO₂ escapes as bubbles.
    topic_code: "7.6"
  - front: Predicting a shift from a volume change for H₂ + I₂ ⇌ 2HI
    back: |
      No shift: two moles of gas on each side, so changing the volume changes both sides' concentrations in the same proportion.
    topic_code: "7.6"
  - front: Kc for 2SO₂ + O₂ ⇌ 2SO₃ from [SO₂] = 0.050, [O₂] = 0.025, [SO₃] = 0.200 M
    back: |
      Kc = [SO₃]² ÷ ([SO₂]²[O₂]) = 0.0400 ÷ (0.0025 × 0.025) = 640. Products strongly favoured.
    topic_code: "7.6"

quiz:
  description: |
    23 questions · about 40 minutes · topic 7.6 (reversible reactions, dynamic equilibrium, the equilibrium
    constant, Le Châtelier's principle, the Haber process), with review of balancing (4.1), the ideal gas law
    (5.3), saturated solutions (6.1), weak acids (6.4), Hess's law (7.3), rates (7.4) and catalysts (7.5). Multiple
    choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: the Haber process (7.6, 7.5)
    - slug: chem-u07-w28-q01
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Ammonia is manufactured by the Haber process:

        N₂(g) + 3H₂(g) ⇌ 2NH₃(g), ΔH = −92 kJ

        The gases are at equilibrium in a steel vessel fitted with a piston.
      prompt: |
        The piston is pushed in, halving the volume. After the system settles, the amount of ammonia will have
      options:
        - "decreased, because the added pressure drives the reaction toward the side with more gas molecules."
        - "stayed the same, because pressure has no effect on an equilibrium."
        - "increased, because the equilibrium shifts toward the side with fewer moles of gas to relieve the pressure."
        - "decreased, because compressing the gases heats them and the reaction is exothermic."
      option_explanations:
        - |
          The shift goes toward fewer gas molecules, not more; fewer molecules in the same space means a lower pressure, which counteracts the compression.
        - |
          Pressure affects any gas equilibrium in which the number of gas moles differs between the two sides, as it does here (4 versus 2).
        - |
          Correct. Four moles of gas on the left become two on the right; shifting right lowers the number of molecules and so partly offsets the pressure increase.
        - |
          The question concerns the equilibrium at the same temperature; the moles-of-gas argument decides the direction, and it favours more ammonia.
      answer: 2
      explanation: |
        Increasing pressure shifts a gas equilibrium toward the side with fewer gas moles. The Haber process runs at about 200 atm for exactly this reason.

    - slug: chem-u07-w28-q02
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Ammonia is manufactured by the Haber process:

        N₂(g) + 3H₂(g) ⇌ 2NH₃(g), ΔH = −92 kJ

        The gases are at equilibrium in a steel vessel fitted with a piston.
      prompt: |
        The vessel is heated from 400 °C to 500 °C at constant volume. What happens to the amount of ammonia and to the value of Kc?
      options:
        - "Ammonia decreases and Kc decreases."
        - "Ammonia increases and Kc increases."
        - "Ammonia decreases but Kc is unchanged."
        - "Ammonia increases but Kc is unchanged."
      option_explanations:
        - |
          Correct. The forward reaction is exothermic, so heat behaves as a product; adding heat shifts the equilibrium left, lowering the ammonia, and because temperature is the one change that alters Kc, Kc falls.
        - |
          Heating favours the endothermic direction, which here is the reverse reaction; ammonia falls.
        - |
          Temperature is the only change that alters Kc; a shift caused by heating comes with a new Kc.
        - |
          The direction is wrong for an exothermic forward reaction, and Kc does change with temperature.
      answer: 0
      explanation: |
        For an exothermic forward reaction, raising the temperature shifts the equilibrium toward reactants and lowers Kc. This is why the Haber process would prefer a low temperature if rate did not matter.

    - slug: chem-u07-w28-q03
      type: multiple_choice
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Ammonia is manufactured by the Haber process:

        N₂(g) + 3H₂(g) ⇌ 2NH₃(g), ΔH = −92 kJ

        The gases are at equilibrium in a steel vessel fitted with a piston.
      prompt: |
        Finely divided iron is used as a catalyst in the Haber process. What is its effect?
      options:
        - "It shifts the equilibrium to the right, increasing the equilibrium yield of ammonia."
        - "It lowers the enthalpy change of the reaction, so less heat is wasted."
        - "It speeds up only the forward reaction, so more ammonia forms before equilibrium."
        - "It lowers the activation energy of both directions equally, so the same equilibrium mixture is reached sooner."
      option_explanations:
        - |
          A catalyst never changes the position of equilibrium or the equilibrium yield; it changes only the time taken to get there.
        - |
          ΔH is fixed by the reactant and product energy levels, which a catalyst leaves untouched.
        - |
          The catalysed pathway is lower in both directions; the reverse reaction speeds up by the same factor as the forward one.
        - |
          Correct. Review of 7.5: a catalyst lowers the single hump that both the forward and reverse reactions must cross, so both accelerate equally and equilibrium is reached faster with no change in composition.
      answer: 3
      explanation: |
        Review of 7.5: catalysts affect rate, not equilibrium position. In the Haber process the iron makes a 450 °C compromise workable by reaching the equilibrium quickly.

    # ---- Singles
    - slug: chem-u07-w28-q04
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly describes a chemical system at dynamic equilibrium?
      options:
        - "The forward and reverse reactions have both stopped."
        - "The forward and reverse reactions continue at equal rates, so the concentrations remain constant."
        - "The concentrations of reactants and products are equal."
        - "The forward reaction has gone to completion and only products remain."
      option_explanations:
        - |
          Both reactions continue; the system appears unchanging only because their effects cancel.
        - |
          Correct. Equal rates in opposite directions produce constant amounts of every substance, which is what "dynamic" and "equilibrium" together mean.
        - |
          Constant is not the same as equal; the equilibrium mixture can be mostly product or mostly reactant, as Kc indicates.
        - |
          A reaction that runs to completion is not at equilibrium; at equilibrium both reactants and products are present.
      answer: 1
      explanation: |
        Dynamic equilibrium: ongoing opposite reactions at equal rates, giving constant (not necessarily equal) concentrations in a closed system.

    - slug: chem-u07-w28-q05
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the correct equilibrium constant expression for 2SO₂(g) + O₂(g) ⇌ 2SO₃(g)?
      options:
        - "Kc = [SO₃] ÷ ([SO₂][O₂])"
        - "Kc = 2[SO₃] ÷ (2[SO₂] + [O₂])"
        - "Kc = [SO₃]² ÷ ([SO₂]²[O₂])"
        - "Kc = [SO₂]²[O₂] ÷ [SO₃]²"
      option_explanations:
        - |
          The coefficients must appear as exponents: [SO₃]² and [SO₂]².
        - |
          Coefficients become exponents, not multipliers, and concentrations are multiplied, never added, in a Kc expression.
        - |
          Correct. Products over reactants, each concentration raised to its coefficient: [SO₃]² on top, [SO₂]² × [O₂] below.
        - |
          This is the reciprocal: reactants over products, which would be Kc for the reverse reaction.
      answer: 2
      explanation: |
        Kc = (product concentrations raised to their coefficients) ÷ (reactant concentrations raised to their coefficients).

    - slug: chem-u07-w28-q06
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        At 25 °C the reaction N₂(g) + O₂(g) ⇌ 2NO(g) has Kc = 4 × 10⁻³¹. What does this value tell you about air at room temperature?
      options:
        - "Almost no NO is present; the equilibrium lies overwhelmingly on the reactant side."
        - "Nitrogen and oxygen react rapidly to form large amounts of NO."
        - "The concentrations of N₂, O₂ and NO are roughly equal."
        - "The reaction is at equilibrium only at very high pressure."
      option_explanations:
        - |
          Correct. A tiny Kc means the product concentration in the numerator is minute compared with the reactants; air contains nitrogen and oxygen with essentially no NO.
        - |
          A small Kc says nothing about speed, and it indicates that little product exists at equilibrium.
        - |
          Roughly equal concentrations would give a Kc near 1, not 10⁻³¹.
        - |
          Kc describes the composition at equilibrium at a given temperature; pressure is not involved in its value.
      answer: 0
      explanation: |
        Kc far below 1 means reactants dominate at equilibrium. NO forms in air only when lightning or an engine supplies the energy for the endothermic reaction.

    - slug: chem-u07-w28-q07
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the correct Kc expression for CaCO₃(s) ⇌ CaO(s) + CO₂(g)?
      options:
        - "Kc = [CaO][CO₂] ÷ [CaCO₃]"
        - "Kc = [CO₂] ÷ [CaCO₃]"
        - "Kc = [CaO] ÷ [CaCO₃]"
        - "Kc = [CO₂]"
      option_explanations:
        - |
          Pure solids are omitted from Kc because their concentrations do not change; both CaCO₃ and CaO are solids.
        - |
          CaCO₃ is a solid and must be left out of the expression.
        - |
          Both species here are solids, and the one gas, CO₂, is the only concentration that varies.
        - |
          Correct. Only the gas appears; the two solids have fixed concentrations that are folded into the constant.
      answer: 3
      explanation: |
        Solids and pure liquids are omitted from Kc. For limestone decomposition, Kc is simply the equilibrium concentration of CO₂ at that temperature.

    - slug: chem-u07-w28-q08
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        In the industrial production of methanol, CO(g) + 2H₂(g) ⇌ CH₃OH(g), the methanol is continuously condensed and removed from the reaction vessel. Why?
      options:
        - "Removing methanol raises the temperature and speeds the reaction."
        - "Removing a product shifts the equilibrium to the right, so more methanol keeps forming."
        - "Removing methanol increases Kc for the reaction."
        - "Liquid methanol would otherwise catalyse the reverse reaction."
      option_explanations:
        - |
          Removing a product does not change the temperature; the effect is on the equilibrium position.
        - |
          Correct. Le Châtelier: taking away a product makes the system replace some of it, so the reaction continues to convert CO and H₂ into methanol.
        - |
          Kc depends only on temperature; removing methanol lowers its concentration and the system shifts to restore the same ratio.
        - |
          Methanol is not a catalyst; the reason is the shift caused by removing a product.
      answer: 1
      explanation: |
        Removing a product shifts the equilibrium toward products. Continuous removal is a standard industrial trick, used for ammonia as well.

    - slug: chem-u07-w28-q09
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A sealed flask containing H₂(g), I₂(g) and HI(g) at equilibrium, H₂(g) + I₂(g) ⇌ 2HI(g), is expanded to twice its volume at constant temperature. The equilibrium
      options:
        - "shifts left, because the pressure decrease favours the reactants."
        - "shifts right, because there are more molecules of product."
        - "does not shift, because both sides contain the same number of moles of gas."
        - "shifts right, because HI is a gas and the reactants are not."
      option_explanations:
        - |
          A pressure change shifts an equilibrium only when the two sides differ in gas moles; here they do not.
        - |
          The coefficient 2 on HI balances the 1 + 1 on the left: two gas moles on each side.
        - |
          Correct. With two moles of gas on each side, expanding the flask lowers all concentrations in the same proportion and the ratio in Kc is unchanged, so no shift occurs.
        - |
          All three substances are gases in this reaction; the moles of gas are equal on the two sides.
      answer: 2
      explanation: |
        Volume and pressure changes shift an equilibrium only toward the side with fewer or more gas moles; equal counts mean no shift.

    - slug: chem-u07-w28-q10
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Pure N₂O₄ is placed in a sealed flask and begins to decompose into NO₂. How do the rates of the forward and reverse reactions change as the system approaches equilibrium?
      options:
        - "The forward rate starts at its maximum and falls; the reverse rate starts at zero and rises until the two are equal."
        - "Both rates start at zero and rise together until they are equal."
        - "The forward rate stays constant while the reverse rate rises to meet it."
        - "Both rates fall to zero when equilibrium is reached."
      option_explanations:
        - |
          Correct. Review of 7.4: rate depends on concentration; with only reactant present the forward rate is highest and the reverse rate is zero, and they converge as reactant is consumed and product builds up.
        - |
          The forward rate cannot start at zero when the reactant concentration is at its highest.
        - |
          The forward rate falls because N₂O₄ is being used up; rates depend on concentration.
        - |
          At equilibrium the rates are equal, not zero; both reactions continue.
      answer: 0
      explanation: |
        Review of 7.4: the forward rate falls and the reverse rate rises until they match. Equilibrium is a meeting of rates, not a stopping of reactions.

    - slug: chem-u07-w28-q11
      type: multiple_choice
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Acetic acid in water, CH₃COOH(aq) ⇌ H⁺(aq) + CH₃COO⁻(aq), has Kc (its Ka) of 1.8 × 10⁻⁵. Which statement about a 0.10 M solution is correct?
      options:
        - "Nearly all the acetic acid molecules have ionised, so the solution behaves like 0.10 M HCl."
        - "The concentration of H⁺ equals the concentration of CH₃COOH at equilibrium."
        - "The equilibrium lies to the right because the products are ions."
        - "Most of the acid remains as molecules, which is why acetic acid is classified as a weak acid."
      option_explanations:
        - |
          A Ka of 1.8 × 10⁻⁵ means only about 1 percent of the molecules ionise; the solution is far less acidic than 0.10 M HCl.
        - |
          A small Ka means [H⁺] is much smaller than [CH₃COOH]; here it is about 1.3 × 10⁻³ M against about 0.10 M.
        - |
          The size of Kc, not the nature of the species, decides the position; a Kc far below 1 lies to the left.
        - |
          Correct. Review of 6.4: a weak acid is one whose ionisation equilibrium lies far to the left, leaving most molecules intact; a tiny Ka is the quantitative version of that definition.
      answer: 3
      explanation: |
        Review of 6.4: weak acids ionise only partially; the equilibrium constant Ka expresses exactly how far. Strong acids have no meaningful reverse reaction.

    # ---- Multi-select
    - slug: chem-u07-w28-q12
      type: multi_select
      topic_code: "7.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about chemical equilibrium and Kc are correct? Select all that apply.
      options:
        - "The same equilibrium composition is reached whether the reaction starts from reactants or from products."
        - "Kc changes when the concentration of a reactant is increased."
        - "Pure solids and liquids are omitted from the Kc expression."
        - "A catalyst reaches the same equilibrium in less time."
        - "Kc for an endothermic reaction increases as the temperature rises."
        - "A large Kc means the reaction is fast."
      option_explanations:
        - |
          Correct. Equilibrium depends only on the substances and the temperature, not on the starting direction.
        - |
          Kc is fixed at a given temperature; adding a reactant shifts the concentrations but the ratio returns to the same value.
        - |
          Correct. Their concentrations are constant and are folded into the constant.
        - |
          Correct. Both forward and reverse activation energies are lowered equally; only the time changes.
        - |
          Correct. Heat is a reactant in an endothermic reaction, so heating shifts right and the product-favouring Kc grows.
        - |
          Kc describes the composition at equilibrium, not the speed of getting there; a reaction with an enormous Kc can be immeasurably slow.
      answer: [0, 2, 3, 4]
      explanation: |
        Kc depends only on temperature and says nothing about rate; catalysts change rate only. These are the two confusions the item targets.

    - slug: chem-u07-w28-q13
      type: multi_select
      topic_code: "5.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A rigid, sealed vessel contains a mixture of N₂, H₂ and NH₃ gases. According to the ideal gas law, which of the following would raise the total pressure inside the vessel? Select all that apply.
      options:
        - "Raising the temperature"
        - "Injecting more nitrogen"
        - "Adding a catalyst"
        - "Cooling the vessel"
        - "Pumping in argon"
      option_explanations:
        - |
          Correct. At constant V and n, P is proportional to T; faster molecules hit the walls harder and more often.
        - |
          Correct. More moles of gas in the same volume at the same temperature means a higher pressure.
        - |
          A solid catalyst adds no gas and changes no temperature, so the total pressure is unaffected.
        - |
          Cooling lowers the pressure; P falls in proportion to the Kelvin temperature.
        - |
          Correct. Argon adds moles of gas, so the total pressure rises even though it takes no part in the reaction.
      answer: [0, 1, 4]
      explanation: |
        Review of 5.3: PV = nRT, so at fixed volume the pressure rises with n or T. Whether a pressure rise shifts the equilibrium is a separate question: argon raises P without changing any reacting gas's concentration.

    # ---- True/false
    - slug: chem-u07-w28-q14
      type: true_false
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: when a reaction reaches equilibrium, the concentrations of the reactants and the products are equal to one another.
      answer: false
      explanation: |
        False. At equilibrium the concentrations are constant, not equal. The value of Kc fixes the ratio: a Kc of 49 for the hydrogen iodide equilibrium means far more HI than H₂ or I₂, and a Kc of 0.0036 for N₂O₄ ⇌ 2NO₂ means mostly N₂O₄.

    - slug: chem-u07-w28-q15
      type: true_false
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: a saturated solution of sodium chloride sitting over undissolved salt crystals is a dynamic equilibrium, with dissolving and crystallising occurring at the same rate.
      answer: true
      explanation: |
        True. Review of 6.1: a saturated solution is the equilibrium NaCl(s) ⇌ Na⁺(aq) + Cl⁻(aq). The amount dissolved stays constant because ions leave and rejoin the crystal at equal rates, which is why extra solid simply sits on the bottom.

    # ---- Fill in the blank
    - slug: chem-u07-w28-q16
      type: fill_blank
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The rule that a system at equilibrium responds to an imposed change by shifting in the direction that partly counteracts the change is called ____ principle.
      answer:
        - "Le Châtelier's"
        - "Le Chatelier's"
        - "Le Châtelier"
