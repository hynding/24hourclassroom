    # ---- Short answer
    - slug: chem-u07-w26-q21
      type: short_answer
      topic_code: "7.3"
      source: "general knowledge"
      points: 3
      prompt: |
        A student needs ΔH for the reaction 2NO(g) + O₂(g) → 2NO₂(g) and has these data: N₂(g) + O₂(g) → 2NO(g), ΔH = +182.6 kJ, and N₂(g) + 2O₂(g) → 2NO₂(g), ΔH = +66.4 kJ.
        (a) State what must be done to the first equation and why.
        (b) Show the addition that produces the target equation and give its ΔH.
        (c) Explain why the result is valid even though the student never ran the target reaction.
      answer: |
        (a) Reverse the first equation, because NO must be on the left side of the target; reversing gives 2NO(g) → N₂(g) + O₂(g), ΔH = −182.6 kJ. (b) Add the reversed first equation to the second as written: 2NO + N₂ + 2O₂ → N₂ + O₂ + 2NO₂. N₂ cancels; 2O₂ on the left against O₂ on the right leaves O₂ on the left; the sum is 2NO(g) + O₂(g) → 2NO₂(g) with ΔH = −182.6 + 66.4 = −116.2 kJ. (c) Enthalpy is a state function, so ΔH depends only on the reactants and products, not the path; Hess's law allows any set of steps with the same net change to be added.
      explanation: |
        1 point for (a) reversing the first equation with the sign change to −182.6 kJ and the reason (NO must be a reactant). 1 point for (b) the correct cancellation and ΔH = −116.2 kJ. 1 point for (c) a state-function or Hess's law justification. Deduct for a positive final answer or for failing to flip the sign.

    - slug: chem-u07-w26-q22
      type: short_answer
      topic_code: "7.3"
      source: "general knowledge"
      points: 3
      stimulus: |
        Average bond energies (kJ/mol): H–H 436; Br–Br 193; H–Br 366.

        Standard enthalpy of formation of HBr(g) from Br₂(g): −51.8 kJ/mol.
      prompt: |
        (a) Estimate ΔH for H₂(g) + Br₂(g) → 2HBr(g) from the bond energies, showing the bonds broken and formed.
        (b) Calculate ΔH for the same reaction from the formation value and compare it with your estimate.
        (c) Explain why a bond-energy estimate agrees so closely with the measured value for this reaction but would not for a reaction producing an ionic solid.
      answer: |
        (a) Broken: H–H (436) + Br–Br (193) = 629 kJ. Formed: 2 × H–Br = 732 kJ. ΔH ≈ 629 − 732 = −103 kJ. (b) ΔH = 2(−51.8) − (0 + 0) = −103.6 kJ. The estimate is within 1 kJ of the tabulated value. (c) Every substance here is a gas of simple diatomic molecules, and each bond energy is a single well-defined value rather than an average over many compounds, so the model fits well. An ionic solid has no discrete molecules; its energy is dominated by the lattice (attraction among many ions), which bond energies do not include, so the estimate would be far off.
      explanation: |
        1 point for (a) the correct count and ΔH ≈ −103 kJ. 1 point for (b) −103.6 kJ and a comparison. 1 point for (c) an explanation that mentions gas-phase diatomic molecules or single-valued bond energies, and the lattice energy or absence of molecules in an ionic solid.

    # ---- Long answer
    - slug: chem-u07-w26-q23
      type: long_answer
      topic_code: "7.3"
      source: "general knowledge"
      points: 6
      prompt: |
        Three students each determine ΔH for the combustion of methane, CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(g). Student A uses standard enthalpies of formation (CH₄ −74.8, CO₂ −393.5, H₂O(g) −241.8 kJ/mol). Student B uses average bond energies (C–H 413, O=O 498, C=O 799, O–H 463 kJ/mol). Student C burns 0.100 g of methane under a beaker of water in the lab and measures the temperature rise.
        (1) Carry out Student A's calculation, showing the equation used.
        (2) Carry out Student B's calculation, listing bonds broken and formed.
        (3) Explain why the two answers differ slightly and which should be regarded as the standard value.
        (4) Predict whether Student C's result will be larger or smaller in magnitude than Student A's and explain why, naming two specific sources of error in the lab method.
        (5) State one advantage of each of the three methods.
      answer: |
        (1) ΔH° = Σ n·ΔH°f(products) − Σ n·ΔH°f(reactants) = [(−393.5) + 2(−241.8)] − [(−74.8) + 2(0)] = −877.1 + 74.8 = −802.3 kJ. (2) Bonds broken: 4 C–H (1,652) + 2 O=O (996) = 2,648 kJ; bonds formed: 2 C=O (1,598) + 4 O–H (1,852) = 3,450 kJ; ΔH ≈ 2,648 − 3,450 = −802 kJ. (3) The two agree closely here, but in general the bond method is an estimate: average bond energies are averaged over many compounds, so the C–H in methane and the O–H in water are not exactly the table values. Formation enthalpies are measured for the specific substances, so Student A's −802.3 kJ is the standard value. (4) Student C's magnitude will be smaller. Heat escapes to the air around the flame, some is absorbed by the beaker rather than the water, combustion may be incomplete (soot or CO forms, releasing less energy), and the water vapour carries heat away. Each of these lowers the temperature rise, so the heat calculated from q = mcΔT, divided by the moles of methane burned, understates the true value. (5) Formation values: exact and quick when a table is available. Bond energies: work for a new compound with no table entry and show where the energy comes from, bond by bond. Calorimetry: a direct measurement needing no prior data, and the only way a table value is ever obtained in the first place.
      explanation: |
        6 points. 1 point: Student A's calculation with the products-minus-reactants equation and −802.3 kJ. 1 point: Student B's bond count (4 C–H, 2 O=O broken; 2 C=O, 4 O–H formed) and about −802 kJ. 1 point: bond energies are averages, formation values are the standard. 1 point: Student C's magnitude is smaller, with the reason that lost heat lowers ΔT. 1 point: two specific lab error sources (heat loss to air, heat absorbed by beaker, incomplete combustion, evaporation). 1 point: one advantage of each method. Deduct 1 point for sign errors in parts (1) or (2).
