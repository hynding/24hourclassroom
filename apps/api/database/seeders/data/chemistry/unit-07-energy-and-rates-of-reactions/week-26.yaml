week: 26
unit: 7
title: "Hess's Law and Enthalpies of Formation"
topics: ["7.3"]
guide: guides/week-26.md
guide_description: |
  Enthalpy as a state function and Hess's law, the three moves for manipulating thermochemical equations
  (reverse, multiply, add) with worked combinations, the definition of standard enthalpy of formation and why
  elements are zero, the products-minus-reactants calculation with a data table, estimating ΔH from average bond
  energies, and when to use each method.
flashcards_description: |
  27 cards on state functions, Hess's law moves, standard states, formation equations, the
  products-minus-reactants equation, bond-energy estimates and the limits of each method.

flashcards:
  - front: State function → definition and two examples
    back: |
      A property that depends only on the current state of a system, not on how it got there. Enthalpy, temperature, pressure and volume are state functions; heat and work are not.
    topic_code: "7.3"
  - front: Hess's law → statement
    back: |
      If a reaction is the sum of two or more steps, its ΔH is the sum of the steps' ΔH values. The route does not matter because enthalpy is a state function.
    topic_code: "7.3"
  - front: Reversing a thermochemical equation → effect on ΔH
    back: |
      The sign of ΔH flips. H₂ + ½O₂ → H₂O(l) is −285.8 kJ, so H₂O(l) → H₂ + ½O₂ is +285.8 kJ.
    topic_code: "7.3"
  - front: Multiplying a thermochemical equation by a factor → effect on ΔH
    back: |
      ΔH is multiplied by the same factor. Doubling 2H₂ + O₂ → 2H₂O(l), ΔH = −571.6 kJ, gives −1,143.2 kJ; halving it gives −285.8 kJ.
    topic_code: "7.3"
  - front: Adding thermochemical equations → what cancels
    back: |
      Add the ΔH values. A species on the left of one equation and the right of another cancels, like an intermediate; partial amounts leave a net coefficient.
    topic_code: "7.3"
  - front: Strategy for a Hess's law problem
    back: |
      Take each species in the target that appears in only one given equation; arrange that equation so the species is on the right side with the right coefficient (reverse or scale); then add and check that everything else cancels.
    topic_code: "7.3"
  - front: Standard state → meaning for an element
    back: |
      The most stable form of the pure element at 1 bar and 25 °C: O₂(g), N₂(g), H₂(g), Cl₂(g), Br₂(l), Hg(l), C(graphite), S₈(s), metals as solids.
    topic_code: "7.3"
  - front: Standard enthalpy of formation ΔH°f → definition
    back: |
      The enthalpy change when one mole of a compound is formed from its elements in their standard states at 1 bar and 25 °C. Units kJ/mol.
    topic_code: "7.3"
  - front: ΔH°f of an element in its standard state
    back: |
      Zero, by definition: forming O₂(g) from O₂(g) changes nothing. Only non-standard forms such as O₃(g) (+142.7) or C(diamond) (+1.9) have nonzero values.
    topic_code: "7.3"
  - front: Formation equation for water, liquid
    back: |
      H₂(g) + ½O₂(g) → H₂O(l), ΔH°f = −285.8 kJ/mol. Exactly one mole of product; a fractional coefficient on O₂ is required.
    topic_code: "7.3"
  - front: Formation equation for ethanol, C₂H₅OH(l)
    back: |
      2C(graphite) + 3H₂(g) + ½O₂(g) → C₂H₅OH(l), ΔH°f = −277.6 kJ/mol.
    topic_code: "7.3"
  - front: Formation equation for ammonia
    back: |
      ½N₂(g) + 3/2 H₂(g) → NH₃(g), ΔH°f = −45.9 kJ/mol. Writing N₂ + 3H₂ → 2NH₃ gives −91.8 kJ, which is for two moles, not the formation value.
    topic_code: "7.3"
  - front: Products-minus-reactants equation for ΔH°rxn
    back: |
      ΔH°rxn = Σ n·ΔH°f(products) − Σ n·ΔH°f(reactants), with n the coefficient of each substance in the balanced equation and elements counted as zero.
    topic_code: "7.3"
  - front: Why products minus reactants works
    back: |
      It is Hess's law with the elements as the common reference: take the reactants apart into elements (the reverse of their formation) and build the products from those elements.
    topic_code: "7.3"
  - front: ΔH°f values of CO₂(g), H₂O(l) and H₂O(g)
    back: |
      CO₂(g) −393.5 kJ/mol; H₂O(l) −285.8 kJ/mol; H₂O(g) −241.8 kJ/mol. The 44.0 kJ difference between the two waters is the enthalpy of vaporisation.
    topic_code: "7.3"
  - front: Positive ΔH°f → what it says about the compound
    back: |
      The compound holds more energy than its elements and tends to decompose; forming it needs an energy input. Examples: NO(g) +91.3, NO₂(g) +33.2, O₃(g) +142.7 kJ/mol.
    topic_code: "7.3"
  - front: Combustion of propane from formation values
    back: |
      C₃H₈ + 5O₂ → 3CO₂ + 4H₂O(l): 3(−393.5) + 4(−285.8) − (−103.8) = −2,219.9 kJ, about −2,220 kJ per mole of propane.
    topic_code: "7.3"
  - front: Average bond energy → definition
    back: |
      The average energy needed to break one mole of a particular bond in gaseous molecules, in kJ/mol. Always positive. Averaged across many compounds, so it is approximate.
    topic_code: "7.3"
  - front: Bond-energy estimate of ΔH → equation
    back: |
      ΔH ≈ Σ(bonds broken) − Σ(bonds formed). Broken bonds cost energy (positive); formed bonds release it (subtracted). Count bonds from Lewis structures.
    topic_code: "7.3"
  - front: Common bond energies to recognise, kJ/mol
    back: |
      H–H 436, O=O 498, O–H 463, C–H 413, C–C 347, C=C 614, C=O 799 (in CO₂), N≡N 945, N–H 391, Cl–Cl 243, H–Cl 432.
    topic_code: "7.3"
  - front: Bond-energy estimate for H₂ + Cl₂ → 2HCl
    back: |
      Broken: 436 + 243 = 679 kJ. Formed: 2 × 432 = 864 kJ. ΔH ≈ −185 kJ. Table value −184.6 kJ.
    topic_code: "7.3"
  - front: Limits of the bond-energy method
    back: |
      Only for gases made of discrete molecules, and only an estimate: average values ignore the molecule a bond sits in, and the method ignores intermolecular forces and lattice energies in liquids and solids.
    topic_code: "7.3"
  - front: Which thermochemistry method is exact and which is an estimate
    back: |
      Hess's law combinations and products-minus-reactants with ΔH°f values are exact (to the data's precision). Bonds broken minus formed is an estimate. Calorimetry is a measurement with error.
    topic_code: "7.3"
  - front: Decomposition of limestone, CaCO₃ → CaO + CO₂, ΔH from formation values
    back: |
      (−635.1) + (−393.5) − (−1,207.6) = +179.0 kJ. Endothermic: lime kilns must be heated strongly.
    topic_code: "7.3"
  - front: Reading a Hess problem where the target appears nowhere directly
    back: |
      Look for species that occur in only one given equation (they fix its direction and scale), and let shared species such as CO₂ or H₂O cancel between equations.
    topic_code: "7.3"
  - front: Why nitrogen oxides form only at high temperature
    back: |
      N₂ + O₂ → 2NO has ΔH = +182.6 kJ: endothermic and needing the N≡N bond (945 kJ/mol) broken. Engines and lightning supply that energy; at room temperature NO does not form.
    topic_code: "7.3"
  - front: Enthalpy of a reaction scaled to a given mass of reactant
    back: |
      Convert mass to moles with the molar mass, then multiply by ΔH per mole of that reactant from the thermochemical equation. 23.0 g ethanol × (1 mol/46.07 g) × 1,366.8 kJ/mol = 682 kJ released.
    topic_code: "7.3"

quiz:
  description: |
    23 questions · about 40 minutes · topic 7.3 (Hess's law, standard enthalpies of formation, products minus
    reactants, bond-energy estimates), with review of thermochemical equations (7.1), calorimetry (7.2), balancing
    (4.1), molar mass and stoichiometry (4.4, 4.6) and Lewis structures (3.3). Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: combustion of ethanol from formation data (7.3, 4.6)
    - slug: chem-u07-w26-q01
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Standard enthalpies of formation at 25 °C:

        | Substance | ΔH°f (kJ/mol) |
        | --- | --- |
        | C₂H₅OH(l) | −277.6 |
        | O₂(g) | 0 |
        | CO₂(g) | −393.5 |
        | H₂O(l) | −285.8 |

        Ethanol burns according to C₂H₅OH(l) + 3O₂(g) → 2CO₂(g) + 3H₂O(l). The molar mass of ethanol is 46.07 g/mol.
      prompt: |
        Which equation represents the standard enthalpy of formation of ethanol, ΔH°f = −277.6 kJ/mol?
      options:
        - "C₂H₅OH(l) + 3O₂(g) → 2CO₂(g) + 3H₂O(l)"
        - "4C(graphite) + 6H₂(g) + O₂(g) → 2C₂H₅OH(l)"
        - "2C(graphite) + 3H₂(g) + ½O₂(g) → C₂H₅OH(l)"
        - "2CO₂(g) + 3H₂O(l) → C₂H₅OH(l) + 3O₂(g)"
      option_explanations:
        - |
          This is the combustion equation, not a formation equation: the reactants are not elements and ethanol is not the product.
        - |
          The reactants are elements, but two moles of ethanol are formed; the formation equation makes exactly one mole, so this ΔH would be −555.2 kJ.
        - |
          Correct. One mole of ethanol is formed from carbon as graphite, hydrogen gas and oxygen gas, the elements in their standard states; the ½ coefficient is required.
        - |
          This is the reverse of combustion; its reactants are compounds, and its ΔH is +1,366.8 kJ, not the formation value.
      answer: 2
      explanation: |
        A formation equation has only elements in their standard states on the left and exactly one mole of the compound on the right. Fractional coefficients are normal.

    - slug: chem-u07-w26-q02
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Standard enthalpies of formation at 25 °C:

        | Substance | ΔH°f (kJ/mol) |
        | --- | --- |
        | C₂H₅OH(l) | −277.6 |
        | O₂(g) | 0 |
        | CO₂(g) | −393.5 |
        | H₂O(l) | −285.8 |

        Ethanol burns according to C₂H₅OH(l) + 3O₂(g) → 2CO₂(g) + 3H₂O(l). The molar mass of ethanol is 46.07 g/mol.
      prompt: |
        What is ΔH° for the combustion of one mole of ethanol as written?
      options:
        - "−1,366.8 kJ"
        - "−1,922.0 kJ"
        - "−401.7 kJ"
        - "+1,366.8 kJ"
      option_explanations:
        - |
          Correct. Products: 2(−393.5) + 3(−285.8) = −1,644.4 kJ. Reactants: −277.6 + 0. ΔH° = −1,644.4 − (−277.6) = −1,366.8 kJ.
        - |
          This adds the ethanol value instead of subtracting it: −1,644.4 + (−277.6). Reactants are subtracted from products.
        - |
          This omits the coefficients 2 and 3 on the products; every ΔH°f must be multiplied by its coefficient.
        - |
          The magnitude is right but the sign is wrong: combustion is exothermic, and products minus reactants gives a negative value here.
      answer: 0
      explanation: |
        ΔH°rxn = Σ n·ΔH°f(products) − Σ n·ΔH°f(reactants) = [2(−393.5) + 3(−285.8)] − [(−277.6) + 3(0)] = −1,366.8 kJ.

    - slug: chem-u07-w26-q03
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Standard enthalpies of formation at 25 °C:

        | Substance | ΔH°f (kJ/mol) |
        | --- | --- |
        | C₂H₅OH(l) | −277.6 |
        | O₂(g) | 0 |
        | CO₂(g) | −393.5 |
        | H₂O(l) | −285.8 |

        Ethanol burns according to C₂H₅OH(l) + 3O₂(g) → 2CO₂(g) + 3H₂O(l). The molar mass of ethanol is 46.07 g/mol.
      prompt: |
        Using ΔH° = −1,366.8 kJ per mole of ethanol, how much heat is released when 23.0 g of ethanol burns completely?
      options:
        - "31,400 kJ"
        - "1,366.8 kJ"
        - "59.4 kJ"
        - "682 kJ"
      option_explanations:
        - |
          This multiplies 23.0 g by 1,366.8 kJ as if the enthalpy were per gram; it is per mole, so the mass must first be converted to moles.
        - |
          This is the heat for one full mole (46.07 g) of ethanol; 23.0 g is about half a mole.
        - |
          This divides 1,366.8 by 23.0, mixing up the mole conversion; moles = 23.0 ÷ 46.07, not 46.07 ÷ 23.0.
        - |
          Correct. 23.0 g ÷ 46.07 g/mol = 0.4992 mol; 0.4992 mol × 1,366.8 kJ/mol = 682 kJ released.
      answer: 3
      explanation: |
        Review of 4.6: convert mass to moles with the molar mass, then multiply by the ΔH per mole of that reactant: 0.4992 mol × 1,366.8 kJ/mol = 682 kJ.

    # ---- Singles
    - slug: chem-u07-w26-q04
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Enthalpy is described as a state function. What does this mean?
      options:
        - "Its value is the same for every substance in the same physical state."
        - "Its change depends only on the initial and final states of the system, not on the path between them."
        - "It can only be measured when the system is at standard conditions."
        - "It is constant for a system no matter what reaction takes place."
      option_explanations:
        - |
          Different substances in the same state have different enthalpies; "state" here refers to the condition of a system, not to solid, liquid or gas.
        - |
          Correct. Like altitude on a hill, enthalpy depends only on where the system is; ΔH is the same whether a reaction takes one step or many, which is the basis of Hess's law.
        - |
          Enthalpy changes can be measured at any conditions; standard conditions are just the agreed reference for tables.
        - |
          Enthalpy changes during a reaction; what stays fixed is that the change does not depend on the route.
      answer: 1
      explanation: |
        A state function depends only on the state of the system. Its change between two states is path-independent, which is why ΔH values can be added like the steps of a journey.

    - slug: chem-u07-w26-q05
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The equation 2H₂O(l) → 2H₂(g) + O₂(g) has ΔH = +571.6 kJ. What is ΔH for H₂(g) + ½O₂(g) → H₂O(l)?
      options:
        - "+571.6 kJ"
        - "−571.6 kJ"
        - "−285.8 kJ"
        - "+285.8 kJ"
      option_explanations:
        - |
          The target equation is reversed and halved relative to the given one, so the sign must change and the value must be halved.
        - |
          The sign is correctly flipped for reversing, but the target equation is for one mole of water, half the given amount, so ΔH must also be halved.
        - |
          Correct. Reversing changes the sign (−571.6 kJ) and halving the coefficients halves the value: −285.8 kJ, the standard enthalpy of formation of liquid water.
        - |
          The value is halved correctly but the sign was not changed; forming water releases heat, so ΔH must be negative.
      answer: 2
      explanation: |
        Reverse the equation (sign flips to −571.6 kJ), then multiply by ½ (−285.8 kJ). Both moves are needed.

    - slug: chem-u07-w26-q06
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which substance has a standard enthalpy of formation of exactly zero?
      options:
        - "Br₂(l)"
        - "Br₂(g)"
        - "O₃(g)"
        - "C(diamond)"
      option_explanations:
        - |
          Correct. Liquid bromine is the stable form of the element at 1 bar and 25 °C, so it is the reference state and its ΔH°f is zero by definition.
        - |
          Bromine gas is not the standard state at 25 °C; its ΔH°f (+30.9 kJ/mol) is the enthalpy of vaporising the liquid.
        - |
          Ozone is an element but not its stable form; O₂(g) is the standard state, and O₃ has ΔH°f = +142.7 kJ/mol.
        - |
          Graphite, not diamond, is the standard state of carbon; diamond has ΔH°f = +1.9 kJ/mol.
      answer: 0
      explanation: |
        Only an element in its most stable form at standard conditions has ΔH°f = 0. Other forms of the same element have small positive values.

    - slug: chem-u07-w26-q07
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Use the equations below to find ΔH for C(graphite) + 2H₂(g) → CH₄(g).

        C(graphite) + O₂(g) → CO₂(g), ΔH = −393.5 kJ
        H₂(g) + ½O₂(g) → H₂O(l), ΔH = −285.8 kJ
        CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l), ΔH = −890.3 kJ
      options:
        - "−1,569.6 kJ"
        - "−74.8 kJ"
        - "+74.8 kJ"
        - "−211.0 kJ"
      option_explanations:
        - |
          This adds all three values as written; the methane equation must be reversed so that CH₄ ends on the right, and its sign flipped.
        - |
          Correct. Keep the first equation, double the second (−571.6 kJ) and reverse the third (+890.3 kJ): −393.5 − 571.6 + 890.3 = −74.8 kJ, the formation enthalpy of methane.
        - |
          The magnitude is right but the sign is wrong: the methane equation is reversed (+890.3), not the others, and the sum comes out negative.
        - |
          This uses the water equation once instead of twice; the target needs 2H₂, so that equation and its ΔH must be doubled.
      answer: 1
      explanation: |
        Arrange each equation so the target species sit on the right sides: first as written, second doubled, third reversed. CO₂ and 2H₂O cancel, 2O₂ cancels, leaving the target with ΔH = −74.8 kJ.

    - slug: chem-u07-w26-q08
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Why does the bond-energy method give only an estimate of ΔH, and only for reactions of gases?
      options:
        - "Bond energies can only be measured at very high temperatures."
        - "The method ignores the energy released when bonds form."
        - "Bond energies are exact, but the method requires an unknown catalyst."
        - "Table values are averages over many molecules, and the method ignores the forces between molecules in liquids and solids."
      option_explanations:
        - |
          Bond energies are determined from many kinds of measurements at ordinary conditions; temperature is not the limitation.
        - |
          The method includes bond formation: the formed bonds' energies are subtracted from the broken bonds' energies.
        - |
          Average bond energies are not exact, and catalysts have nothing to do with the calculation of ΔH.
        - |
          Correct. A tabulated C–H energy is an average across compounds, and the method counts only bonds within molecules, so condensing or dissolving energies are left out.
      answer: 3
      explanation: |
        Average values and the neglect of intermolecular and lattice energies make the method approximate and limited to gas-phase reactions of discrete molecules.

    - slug: chem-u07-w26-q09
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The standard enthalpy of formation of nitrogen monoxide, NO(g), is +91.3 kJ/mol. What does the positive value indicate?
      options:
        - "NO forms readily and releases heat as it does so."
        - "NO is more stable than nitrogen and oxygen gases."
        - "NO holds more energy than its elements and tends to decompose back into them."
        - "Nitrogen and oxygen cannot react under any conditions."
      option_explanations:
        - |
          A positive ΔH°f means forming NO absorbs heat; it does not form readily at ordinary temperatures.
        - |
          A compound with a positive formation enthalpy sits above its elements in energy, so it is less stable than they are, not more.
        - |
          Correct. Energy must be supplied to make NO from N₂ and O₂, so NO stores that energy relative to its elements and is thermodynamically inclined to decompose.
        - |
          They do react, but only when something supplies the energy, as inside a hot engine or a lightning channel.
      answer: 2
      explanation: |
        Positive ΔH°f: the compound is higher in enthalpy than its elements. Such compounds form only with an energy input and are often reactive or unstable.

    - slug: chem-u07-w26-q10
      type: multiple_choice
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        For 2H₂(g) + O₂(g) → 2H₂O(l), ΔH = −571.6 kJ. How much heat is released when 0.500 mol of water forms?
      options:
        - "571.6 kJ"
        - "285.8 kJ"
        - "1,143.2 kJ"
        - "142.9 kJ"
      option_explanations:
        - |
          571.6 kJ is the heat for two moles of water as written, four times the amount formed here.
        - |
          285.8 kJ is the heat per mole of water; 0.500 mol releases half of that.
        - |
          This doubles the equation's value instead of scaling it down to a quarter of the written amount.
        - |
          Correct. The equation gives 571.6 kJ for 2 mol of water, so 285.8 kJ per mole; 0.500 mol × 285.8 kJ/mol = 142.9 kJ.
      answer: 3
      explanation: |
        Review of 7.1: ΔH belongs to the amounts in the equation. Scale by the ratio of moles actually formed to moles written: 0.500 ÷ 2 × 571.6 = 142.9 kJ.

    - slug: chem-u07-w26-q11
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        To use bond energies for the combustion of methane, the bonds in each molecule must be counted from its Lewis structure. Which row counts correctly?
      options:
        - "CH₄: 4 C–H; O₂: 1 O–O single; CO₂: 2 C–O single; H₂O: 2 O–H"
        - "CH₄: 4 C–H; O₂: 1 O=O double; CO₂: 2 C=O double; H₂O: 2 O–H"
        - "CH₄: 4 C–H; O₂: 1 O=O double; CO₂: 1 C=O double; H₂O: 1 O–H"
        - "CH₄: 2 C–H; O₂: 2 O=O double; CO₂: 2 C=O double; H₂O: 2 O–H"
      option_explanations:
        - |
          O₂ has a double bond and CO₂ has two double bonds; single bonds would leave oxygen without an octet.
        - |
          Correct. Methane has four C–H single bonds, O₂ one double bond, CO₂ two C=O double bonds (O=C=O), and water two O–H single bonds.
        - |
          CO₂ has two carbon-oxygen double bonds and water has two O–H bonds, not one each.
        - |
          Methane has four hydrogens, so four C–H bonds, and each O₂ molecule has one double bond, not two.
      answer: 1
      explanation: |
        Review of 3.3: draw the Lewis structures first. Miscounting bonds is the most common error in bond-energy calculations.

    # ---- Multi-select
    - slug: chem-u07-w26-q12
      type: multi_select
      topic_code: "7.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about Hess's law and enthalpies of formation are correct? Select all that apply.
      options:
        - "The ΔH of a reaction is the same whether it occurs in one step or several."
        - "Reversing an equation changes the sign of its ΔH."
        - "ΔH°f of O₂(g) is zero, but ΔH°f of O₃(g) is not."
        - "ΔH°rxn is found by subtracting the products' formation enthalpies from the reactants'."
        - "A formation equation always produces exactly one mole of the compound."
        - "Fractional coefficients are not allowed in thermochemical equations."
      option_explanations:
        - |
          Correct. This is Hess's law, a consequence of enthalpy being a state function.
        - |
          Correct. The reverse process absorbs what the forward process released, and vice versa.
        - |
          Correct. O₂ is oxygen's standard state; ozone is a different, higher-energy form with ΔH°f = +142.7 kJ/mol.
        - |
          Backwards: ΔH°rxn = Σ products − Σ reactants. Subtracting the other way flips the sign.
        - |
          Correct. The definition is per mole of compound formed, which is why fractional coefficients appear on the elements.
        - |
          Fractions are allowed and often needed, because ΔH refers to moles, not molecules, and ½ mol of O₂ is a perfectly good amount.
      answer: [0, 1, 2, 4]
      explanation: |
