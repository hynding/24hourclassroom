        Correct. Greater surface area means more carbonate exposed to collisions with H⁺ ions.
      - |
        Correct. More H⁺ ions per volume means more collisions per second at the marble surface.
      - |
        Cooling lowers the fraction of collisions with energy above Ea and reduces the rate.
      - |
