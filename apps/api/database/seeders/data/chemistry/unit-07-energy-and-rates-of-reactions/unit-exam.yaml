      - |
        Roughly equal amounts correspond to Kc near 1; these values are eight orders of magnitude away from 1 in opposite directions.
      - |
        Correct. Kc far above 1 means the numerator (products) dominates; Kc far below 1 means the denominator (reactants) dominates.
    answer: 3
    explanation: |
      The size of Kc tells where the equilibrium lies, not how quickly it is reached.

  - slug: chem-u07-exam-q23
    type: multiple_choice
