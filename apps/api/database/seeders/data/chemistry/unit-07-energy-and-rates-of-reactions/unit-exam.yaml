  # ---- Short answer
  - slug: chem-u07-exam-q38
    type: short_answer
    topic_code: "7.3"
    source: "general knowledge"
    points: 3
    prompt: |
      Methane reacts with chlorine in light: CH₄(g) + Cl₂(g) → CH₃Cl(g) + HCl(g). Average bond energies (kJ/mol): C–H 413, Cl–Cl 243, C–Cl 339, H–Cl 432.
      (a) Identify the bonds broken and the bonds formed. (Only one C–H bond is broken.)
      (b) Estimate ΔH for the reaction and state whether it is exothermic or endothermic.
      (c) Explain, in terms of bond strengths, why the reaction has the sign you found.
    answer: |
      (a) Broken: one C–H (413) and one Cl–Cl (243). Formed: one C–Cl (339) and one H–Cl (432). (b) ΔH ≈ (413 + 243) − (339 + 432) = 656 − 771 = −115 kJ; exothermic. (c) The bonds formed (C–Cl and H–Cl, 771 kJ in total) are stronger overall than the bonds broken (C–H and Cl–Cl, 656 kJ), so more energy is released in forming the new bonds than was absorbed in breaking the old ones, and the difference leaves as heat.
    explanation: |
      1 point for (a) the correct two bonds broken and two formed. 1 point for (b) about −115 kJ and exothermic. 1 point for (c) an explanation comparing total energy of bonds formed with bonds broken. Deduct if the student says energy is released by breaking bonds.

  - slug: chem-u07-exam-q39
    type: short_answer
    topic_code: "7.5"
    source: "general knowledge"
    points: 3
    stimulus: |
      A student measures the time for a fixed amount of magnesium ribbon to disappear completely in 25 mL of 1.0 M hydrochloric acid at different temperatures.

      | Temperature (°C) | 10 | 20 | 30 | 40 |
      | --- | --- | --- | --- | --- |
      | Time for ribbon to disappear (s) | 160 | 80 | 41 | 20 |
    prompt: |
      (a) Describe the pattern in the data and express it as a rule relating temperature to rate.
      (b) Explain the pattern using collision theory, making clear which effect of temperature is the more important.
      (c) The student repeats the 20 °C trial with 2.0 M acid and the ribbon disappears in 40 s. Explain this result using collision theory, and state whether the amount of hydrogen produced changed.
    answer: |
      (a) Each 10 °C rise roughly halves the time, so the rate (proportional to 1 ÷ time) roughly doubles for every 10 °C increase. (b) At a higher temperature the particles have a higher average kinetic energy. Collisions are slightly more frequent, but the dominant effect is that the energy distribution shifts to higher energies, so a much larger fraction of collisions has energy above the activation energy; many more collisions are effective, and the rate rises steeply. (c) Doubling the concentration doubles the number of H⁺ ions per volume, so collisions with the magnesium surface are twice as frequent and the rate doubles (time halves to 40 s). The amount of hydrogen is unchanged because the magnesium is the limiting reactant and the acid is in excess in both trials.
    explanation: |
      1 point for (a) the doubling-per-10 °C pattern stated in terms of rate. 1 point for (b) the fraction of collisions above Ea identified as the main effect, with collision frequency as the minor one. 1 point for (c) collision frequency doubling with concentration and the amount of hydrogen unchanged because magnesium limits.

  # ---- Long answer
  - slug: chem-u07-exam-q40
    type: long_answer
    topic_code: "7.6"
    source: "general knowledge"
    points: 6
    prompt: |
      Hydrogen peroxide decomposes slowly on its own: 2H₂O₂(l) → 2H₂O(l) + O₂(g). A pinch of manganese dioxide makes the same reaction fizz vigorously. Standard enthalpies of formation: H₂O₂(l) −187.8 kJ/mol; H₂O(l) −285.8 kJ/mol. Write an account that: (1) calculates ΔH° for the reaction as written and states whether it is exothermic or endothermic; (2) describes, in words, the energy diagram for the uncatalysed and catalysed reactions on the same axes, naming what the catalyst changes and what it leaves unchanged; (3) explains using collision theory why the catalysed reaction is so much faster at the same temperature; (4) describes an experiment that would measure the rate of the catalysed reaction and how you would show that the manganese dioxide is not used up; (5) explains why, if the reaction were reversible and at equilibrium, the catalyst would not change the amount of oxygen present at equilibrium.
    answer: |
      (1) ΔH° = [2(−285.8) + 0] − [2(−187.8)] = −571.6 + 375.6 = −196.0 kJ; exothermic. (2) Both curves start at the reactants' level and end at the products' level, 196 kJ lower. The uncatalysed curve rises to a high peak (large Ea); the catalysed curve rises to a much lower peak, possibly with small intermediate dips because the catalysed route has several steps. The catalyst lowers the activation energy; it leaves the reactant and product levels, and so ΔH, unchanged. (3) At a given temperature the particles have a fixed distribution of energies. With the high uncatalysed Ea only a tiny fraction of collisions have enough energy to react; the catalysed route's lower Ea means a far larger fraction of the same collisions are effective, so the rate rises dramatically even though the particles are no more energetic. (4) Put a measured volume of hydrogen peroxide of known concentration in a flask connected to a gas syringe, add a weighed mass of manganese dioxide, and record the volume of oxygen every 10 s; the rate is the volume change per unit time, found from the slope of the graph. To show the catalyst is not consumed, filter, dry and reweigh the manganese dioxide after the reaction: its mass is unchanged, and it will catalyse a fresh sample just as well. (5) A catalyst lowers the activation energy of the forward and reverse reactions by the same amount, so both rates increase by the same factor. The equilibrium position, which is set by the balance of the two rates and by Kc (a function of temperature only), is therefore unchanged; the catalyst would only shorten the time taken to reach the same amount of oxygen.
    explanation: |
      6 points. 1 point: ΔH° = −196.0 kJ, exothermic. 1 point: energy diagram described with two peaks of different height and the same start and end levels, naming Ea changed and ΔH unchanged. 1 point: collision-theory explanation based on the fraction of collisions above Ea. 1 point: a workable rate measurement (gas syringe or mass loss against time). 1 point: a method showing the catalyst is recovered unchanged (reweighing or reuse). 1 point: both directions accelerated equally, so position and Kc unchanged. Deduct 1 point for a positive ΔH or for claiming the catalyst changes ΔH.
