        Correct. Four gas moles become two, so compression shifts toward the right.
      - |
        The forward reaction is exothermic, so heating shifts the equilibrium left, away from ammonia.
      - |
        Correct. Removing a product makes the system replace some of it by shifting right.
      - |
        A catalyst speeds both directions equally and does not shift the equilibrium.
      - |
        Correct. Adding a reactant shifts the equilibrium away from it, toward products.
      - |
