    prompt: |
      For N₂(g) + 3H₂(g) ⇌ 2NH₃(g), ΔH = −92 kJ, which changes shift the equilibrium toward ammonia? Select all that apply.
    options:
      - "Increasing the pressure by decreasing the volume"
      - "Raising the temperature"
