  - slug: chem-u07-exam-q24
    type: multiple_choice
    topic_code: "5.5"
    source: "general knowledge"
    points: 1
    prompt: |
      On a heating curve for water, the temperature stays at 100 °C while the liquid boils even though heat is being added steadily. Where is the added energy going?
    options:
