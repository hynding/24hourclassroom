unit: 7
description: |
  40 questions · about 75 minutes · every topic of unit 7 (7.1 to 7.6: exothermic and endothermic reactions,
  calorimetry, Hess's law and enthalpies of formation, reaction rates and collision theory, rate factors and
  catalysts, equilibrium and Le Châtelier's principle), with review of heat and temperature (1.6), the mole (4.4)
  and heating curves (5.5). Two data sets (a dissolving in a calorimeter and the NO₂/N₂O₄ equilibrium) each carry
  three questions. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
  items are matched automatically; the short answers and the long answer are graded by your teacher against the
  scoring notes. Constants: water c = 4.184 J/(g·°C); molar masses H 1.008, N 14.01, O 16.00 g/mol.
questions:
  # ---- Stimulus set A: ammonium nitrate dissolving in a calorimeter (7.1, 7.2)
  - slug: chem-u07-exam-q01
    type: multiple_choice
    topic_code: "7.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student dissolves 8.00 g of ammonium nitrate (NH₄NO₃, molar mass 80.04 g/mol) in 100.0 g of water in a coffee-cup calorimeter. The temperature of the water falls from 22.0 °C to 16.4 °C. Assume the solution has the specific heat of water, 4.184 J/(g·°C), and that the cup absorbs no heat.
    prompt: |
      What does the temperature change tell you about the dissolving of ammonium nitrate?
    options:
      - "It is exothermic, because heat left the system."
      - "It is endothermic, because the system absorbed heat from the water and ΔH is positive."
      - "It is exothermic, because the water lost heat."
      - "It involves no energy change, because dissolving is a physical process."
    option_explanations:
      - |
        Heat left the water, which is the surroundings, and entered the dissolving salt, which is the system; that is an endothermic process.
      - |
        Correct. The water cooled, so it gave heat to the dissolving process. The system gained heat, ΔH > 0, and the pack-style cooling is the sign of an endothermic change.
      - |
        The water did lose heat, but the water is the surroundings; a system that takes heat from its surroundings is endothermic.
      - |
        Dissolving can absorb or release heat; ammonium nitrate is the classic endothermic case used in cold packs.
    answer: 1
    explanation: |
      The system is the dissolving salt; the water is its surroundings. Surroundings cooling means the system absorbed heat: endothermic, ΔH positive.

  - slug: chem-u07-exam-q02
    type: multiple_choice
    topic_code: "7.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student dissolves 8.00 g of ammonium nitrate (NH₄NO₃, molar mass 80.04 g/mol) in 100.0 g of water in a coffee-cup calorimeter. The temperature of the water falls from 22.0 °C to 16.4 °C. Assume the solution has the specific heat of water, 4.184 J/(g·°C), and that the cup absorbs no heat.
    prompt: |
      How much heat did the water lose?
    options:
      - "23.4 J"
      - "418 J"
      - "9,200 J"
      - "2,340 J"
    option_explanations:
      - |
        This uses the temperature change without the mass or the specific heat; q needs all three factors.
      - |
        418 J would be the heat for a 1 °C change in 100 g of water; the change here is 5.6 °C.
      - |
        This multiplies by the final temperature instead of the temperature change; ΔT is 5.6 °C, not 22 °C.
      - |
        Correct. q = m × c × ΔT = 100.0 g × 4.184 J/(g·°C) × 5.6 °C = 2,343 J, about 2,340 J lost by the water.
    answer: 3
    explanation: |
      q = mcΔT with ΔT = 22.0 − 16.4 = 5.6 °C gives 2,343 J. The water lost this heat; the dissolving absorbed it.

  - slug: chem-u07-exam-q03
    type: multiple_choice
    topic_code: "7.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student dissolves 8.00 g of ammonium nitrate (NH₄NO₃, molar mass 80.04 g/mol) in 100.0 g of water in a coffee-cup calorimeter. The temperature of the water falls from 22.0 °C to 16.4 °C. Assume the solution has the specific heat of water, 4.184 J/(g·°C), and that the cup absorbs no heat.
    prompt: |
      What is the enthalpy change for dissolving ammonium nitrate, in kJ per mole?
    options:
      - "+23.4 kJ/mol"
      - "−23.4 kJ/mol"
      - "+2.34 kJ/mol"
      - "+293 kJ/mol"
    option_explanations:
      - |
        Correct. Moles = 8.00 g ÷ 80.04 g/mol = 0.0999 mol. ΔH = +2,343 J ÷ 0.0999 mol = +23,400 J/mol = +23.4 kJ/mol, positive because the process absorbed heat.
      - |
        The magnitude is right but the sign is wrong: the water cooled, so the dissolving absorbed heat and ΔH is positive.
      - |
        This divides the heat in kJ by the mass in grams rather than by the moles; 8.00 g is only about 0.1 mol.
      - |
        This multiplies by the molar mass instead of dividing the mass by it; ΔH per mole uses the number of moles dissolved.
    answer: 0
    explanation: |
      ΔH = q(system) ÷ n = +2,343 J ÷ 0.0999 mol = +23.4 kJ/mol (the accepted value is about +26 kJ/mol; heat from the cup makes a student's result smaller).

  # ---- Stimulus set B: the NO₂ / N₂O₄ equilibrium (7.6)
  - slug: chem-u07-exam-q04
    type: multiple_choice
    topic_code: "7.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Brown nitrogen dioxide and colourless dinitrogen tetroxide are in equilibrium in a sealed gas syringe at room temperature:

      2NO₂(g) ⇌ N₂O₄(g), ΔH = −58 kJ
    prompt: |
      Which is the correct equilibrium constant expression for the reaction as written?
    options:
      - "Kc = [NO₂]² ÷ [N₂O₄]"
      - "Kc = 2[NO₂] ÷ [N₂O₄]"
      - "Kc = [N₂O₄] ÷ [NO₂]²"
      - "Kc = [N₂O₄] ÷ 2[NO₂]"
    option_explanations:
      - |
        This is the expression for the reverse reaction, N₂O₄ ⇌ 2NO₂; products go on top for the reaction as written.
      - |
        Coefficients become exponents, not multipliers, and the product N₂O₄ belongs in the numerator.
      - |
        Correct. The product N₂O₄ is on top; the reactant NO₂ is on the bottom raised to its coefficient of 2.
      - |
        The coefficient 2 must appear as the exponent on [NO₂], not as a multiplier.
    answer: 2
    explanation: |
      Kc = [products]^coefficients ÷ [reactants]^coefficients = [N₂O₄] ÷ [NO₂]².

  - slug: chem-u07-exam-q05
    type: multiple_choice
    topic_code: "7.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Brown nitrogen dioxide and colourless dinitrogen tetroxide are in equilibrium in a sealed gas syringe at room temperature:

      2NO₂(g) ⇌ N₂O₄(g), ΔH = −58 kJ
    prompt: |
      The plunger is pushed in, halving the volume, and the syringe is kept at constant temperature. After the initial darkening caused by squeezing the gas into less space, what is observed, and why?
    options:
      - "The colour stays as dark as it became, because the equilibrium does not respond to volume."
      - "The colour becomes lighter than it was immediately after compression, because the equilibrium shifts toward N₂O₄, the side with fewer gas moles."
      - "The colour becomes darker still, because the equilibrium shifts toward NO₂ to use up the added pressure."
      - "The colour disappears completely, because all the NO₂ is converted."
    option_explanations:
      - |
        Two gas moles become one in this reaction, so a volume change does shift the equilibrium.
      - |
        Correct. Compressing raises the pressure; the system shifts toward fewer gas moles (N₂O₄), converting some brown NO₂ into colourless N₂O₄ and lightening the colour partway back.
      - |
        A shift toward NO₂ would increase the number of molecules and raise the pressure further, the opposite of counteracting the change.
      - |
        The shift is partial; Kc still requires some NO₂ to be present at the new, higher pressure.
    answer: 1
    explanation: |
      Le Châtelier: increased pressure shifts toward the side with fewer gas moles. Here that lightens the colour, though not all the way back.

  - slug: chem-u07-exam-q06
    type: multiple_choice
    topic_code: "7.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Brown nitrogen dioxide and colourless dinitrogen tetroxide are in equilibrium in a sealed gas syringe at room temperature:

      2NO₂(g) ⇌ N₂O₄(g), ΔH = −58 kJ
    prompt: |
      The syringe is placed in ice water. What happens to the colour and to Kc?
    options:
      - "The colour darkens and Kc decreases."
      - "The colour darkens and Kc is unchanged."
      - "The colour lightens and Kc is unchanged."
      - "The colour lightens and Kc increases."
    option_explanations:
      - |
        Cooling an exothermic reaction favours the forward direction, which produces colourless N₂O₄, so the colour lightens; Kc rises, not falls.
      - |
        The direction is wrong for cooling an exothermic reaction, and temperature always changes Kc.
      - |
        The colour change is right, but temperature is the one change that alters Kc; a shift toward products means a larger Kc.
      - |
        Correct. The forward reaction is exothermic, so heat is a product; removing heat shifts the equilibrium right toward colourless N₂O₄, and the product-favouring Kc increases.
    answer: 3
    explanation: |
      Cooling favours the exothermic direction. Here that is the forward reaction, so the mixture lightens and Kc increases.

  # ---- Singles
  - slug: chem-u07-exam-q07
    type: multiple_choice
    topic_code: "7.1"
    source: "general knowledge"
    points: 1
    prompt: |
      For 2H₂(g) + O₂(g) → 2H₂O(g), ΔH = −483.6 kJ. What is ΔH for H₂O(g) → H₂(g) + ½O₂(g)?
    options:
      - "+241.8 kJ"
      - "−241.8 kJ"
      - "+483.6 kJ"
      - "−967.2 kJ"
    option_explanations:
      - |
        Correct. The target is reversed (sign flips to +483.6 kJ) and halved (+241.8 kJ).
      - |
        The equation is reversed, so the sign must change from negative to positive.
      - |
        The sign is right but the target equation involves one mole of water, half of the given equation.
      - |
        This doubles the magnitude and keeps the wrong sign; the target is reversed and halved.
    answer: 0
    explanation: |
      Reverse: +483.6 kJ. Halve: +241.8 kJ. Decomposing one mole of water vapour absorbs 241.8 kJ.

  - slug: chem-u07-exam-q08
    type: multiple_choice
    topic_code: "7.1"
    source: "general knowledge"
    points: 1
    prompt: |
      On an energy diagram the reactants are drawn at 100 kJ, the peak at 250 kJ and the products at 160 kJ. Which description is correct?
    options:
      - "Exothermic, ΔH = −60 kJ, Ea = 150 kJ"
      - "Exothermic, ΔH = −90 kJ, Ea = 250 kJ"
      - "Endothermic, ΔH = +60 kJ, Ea = 150 kJ"
      - "Endothermic, ΔH = +150 kJ, Ea = 60 kJ"
    option_explanations:
      - |
        The products are above the reactants, so the reaction absorbs energy and ΔH is positive.
      - |
        The sign and the value of ΔH are wrong, and Ea is measured from the reactants' level (250 − 100), not from zero.
      - |
        Correct. Products above reactants means endothermic; ΔH = 160 − 100 = +60 kJ; Ea = 250 − 100 = 150 kJ.
      - |
        The two numbers are swapped: ΔH is the product-reactant difference (60 kJ) and Ea is the climb to the peak (150 kJ).
    answer: 2
    explanation: |
      ΔH = products − reactants = +60 kJ (endothermic). Ea(forward) = peak − reactants = 150 kJ.

  - slug: chem-u07-exam-q09
    type: multiple_choice
    topic_code: "7.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Equal masses of water (c = 4.184 J/(g·°C)) and copper (c = 0.385 J/(g·°C)) each absorb 1,000 J of heat. Which statement is correct?
    options:
      - "Both warm by the same amount, because they absorbed the same heat."
      - "The copper warms about eleven times as much as the water, because its specific heat is lower."
      - "The water warms more, because it has a higher specific heat."
      - "The copper warms less, because metals conduct heat away."
    option_explanations:
      - |
        The temperature rise depends on specific heat as well as heat and mass; equal heat gives unequal rises.
      - |
        Correct. ΔT = q ÷ (m × c); with q and m equal, ΔT is inversely proportional to c, and 4.184 ÷ 0.385 is about 11.
      - |
        A higher specific heat means more heat is needed per degree, so the water warms less, not more.
      - |
        Conduction affects how fast heat spreads, not the final temperature rise for a given amount absorbed; copper's low specific heat makes it warm more.
    answer: 1
    explanation: |
      Specific heat is the heat needed to warm 1 g by 1 °C. The lower the specific heat, the larger the temperature rise for the same heat.

  - slug: chem-u07-exam-q10
    type: multiple_choice
    topic_code: "7.2"
    source: "general knowledge"
    points: 1
    prompt: |
      In the method of mixtures, a hot metal is dropped into cool water in an insulated cup and the final temperature is recorded. Which relationship is the basis of the calculation?
    options:
      - "The metal and the water end at different temperatures proportional to their specific heats."
      - "The heat lost by the metal equals the heat lost by the water."
      - "The temperature change of the metal equals the temperature change of the water."
      - "The heat lost by the metal equals the heat gained by the water, assuming no loss to the surroundings."
    option_explanations:
      - |
        At the end both are at the same temperature; thermal equilibrium is the whole point of waiting for the final reading.
      - |
        The water gains heat while the metal loses it; the two quantities are equal in size and opposite in sign.
      - |
        The temperature changes are usually very different, because the masses and specific heats differ; it is the heats that match.
      - |
        Correct. Energy is conserved: −q(metal) = q(water), so m(metal) × c(metal) × ΔT(metal) = −m(water) × 4.184 × ΔT(water), which is solved for c(metal).
    answer: 3
    explanation: |
      Conservation of energy in an insulated system: the heat the metal loses is the heat the water gains. Both reach the same final temperature.

  - slug: chem-u07-exam-q11
    type: multiple_choice
    topic_code: "7.3"
    source: "general knowledge"
    points: 1
    prompt: |
      To find ΔH for C(graphite) + ½O₂(g) → CO(g) from C(graphite) + O₂(g) → CO₂(g), ΔH = −393.5 kJ, and CO(g) + ½O₂(g) → CO₂(g), ΔH = −283.0 kJ, what must be done to the second equation?
    options:
      - "Reverse it, so that CO appears on the product side, and change the sign of its ΔH to +283.0 kJ."
      - "Double it, so that the oxygen cancels, and double its ΔH."
      - "Leave it unchanged and add the two ΔH values."
      - "Reverse it but keep its ΔH as −283.0 kJ, since enthalpy is a state function."
    option_explanations:
      - |
        Correct. The target has CO as a product; the second equation has it as a reactant, so it is reversed and its ΔH becomes +283.0 kJ. Adding gives −393.5 + 283.0 = −110.5 kJ.
      - |
        Doubling does not move CO to the product side; the oxygen does not need to cancel but to net to ½O₂ on the left.
      - |
        Adding as written would give the sum of two combustion reactions, not the formation of CO.
      - |
        Reversing a reaction always reverses the sign of its ΔH; the state-function property is what makes adding the steps valid, not a reason to keep the sign.
    answer: 0
    explanation: |
      Hess's law move: reverse the second equation (ΔH → +283.0 kJ) and add. CO₂ cancels and the sum is −110.5 kJ.

  - slug: chem-u07-exam-q12
    type: multiple_choice
    topic_code: "7.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of these has a standard enthalpy of formation of zero?
    options:
      - "H₂O(l)"
      - "O₃(g)"
      - "N₂(g)"
      - "CO₂(g)"
    option_explanations:
      - |
        Water is a compound; its ΔH°f is −285.8 kJ/mol.
      - |
        Ozone is an element but not oxygen's standard state (O₂); its ΔH°f is +142.7 kJ/mol.
      - |
        Correct. Nitrogen gas is the stable form of the element at 1 bar and 25 °C, the reference point of the formation scale.
      - |
        Carbon dioxide is a compound; its ΔH°f is −393.5 kJ/mol.
    answer: 2
    explanation: |
      Only elements in their standard states have ΔH°f = 0. N₂(g) qualifies; compounds and non-standard forms such as ozone do not.

  - slug: chem-u07-exam-q13
    type: multiple_choice
    topic_code: "7.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Using ΔH°f values of −74.8 kJ/mol for CH₄(g), −393.5 kJ/mol for CO₂(g) and −285.8 kJ/mol for H₂O(l), what is ΔH° for CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l)?
    options:
      - "−604.5 kJ"
      - "−890.3 kJ"
      - "−1,039.9 kJ"
      - "+890.3 kJ"
    option_explanations:
      - |
        This uses one mole of water instead of two; the coefficient 2 multiplies the water value.
      - |
        Correct. Products: −393.5 + 2(−285.8) = −965.1 kJ. Reactants: −74.8 + 0. ΔH° = −965.1 − (−74.8) = −890.3 kJ.
      - |
        This adds the methane value rather than subtracting it: reactants are subtracted from products.
      - |
        The magnitude is right but combustion is exothermic; products minus reactants gives a negative value.
    answer: 1
    explanation: |
      ΔH° = [(−393.5) + 2(−285.8)] − [(−74.8) + 2(0)] = −890.3 kJ, the standard heat of combustion of methane.

  - slug: chem-u07-exam-q14
    type: multiple_choice
    topic_code: "7.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A student estimates ΔH for a gas-phase reaction from average bond energies and gets −185 kJ; the tabulated value is −184.6 kJ. For a reaction that produces an ionic solid the same method gives an answer hundreds of kJ off. Why?
    options:
      - "Bond energies apply only to reactions that are endothermic."
      - "The student must have made an arithmetic error in the second calculation."
      - "Ionic compounds have no bonds, so there is nothing to subtract."
      - "Bond energies are averages for bonds in gaseous molecules and leave out the lattice energy of an ionic solid."
    option_explanations:
      - |
        The method works for exothermic and endothermic gas reactions alike; the sign of ΔH is not the issue.
      - |
        The discrepancy is built into the method, not the arithmetic: a lattice is not a collection of molecular bonds.
      - |
        Ionic compounds are held together by very strong attractions among many ions; the point is that those are not the molecular bonds the table describes.
      - |
        Correct. The method counts bonds within discrete molecules; the energy of an ionic lattice is not a sum of such bonds, so the estimate misses it entirely.
    answer: 3
    explanation: |
      Bond-energy estimates are approximate even for gases (average values) and inapplicable to ionic solids, whose lattice energy the method cannot represent.

  - slug: chem-u07-exam-q15
    type: multiple_choice
    topic_code: "7.4"
    source: "general knowledge"
    points: 1
    prompt: |
      In a reaction that produces oxygen gas, 36 mL is collected in the first 30 s, and the total reaches 60 mL at 90 s. What is the average rate over the interval from 30 s to 90 s?
    options:
      - "0.40 mL/s"
      - "1.2 mL/s"
      - "0.67 mL/s"
      - "2.0 mL/s"
    option_explanations:
      - |
        Correct. Volume produced between 30 s and 90 s is 60 − 36 = 24 mL over 60 s: 24 ÷ 60 = 0.40 mL/s.
      - |
        1.2 mL/s is the rate over the first 30 s (36 ÷ 30); the question asks about the later interval, when the rate has fallen.
      - |
        0.67 mL/s is the average over the whole 90 s (60 ÷ 90), not over the 30–90 s interval.
      - |
        2.0 mL/s would be 60 mL over 30 s; both the volume change and the time interval are wrong for this choice.
    answer: 0
    explanation: |
      Average rate = change in volume ÷ time interval = 24 mL ÷ 60 s = 0.40 mL/s. Rate falls as the reactant is used up.

  - slug: chem-u07-exam-q16
    type: multiple_choice
    topic_code: "7.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which collision between reactant particles will produce products?
    options:
      - "Any collision, because particles react whenever they touch."
      - "A collision with high energy, whatever the orientation."
      - "A collision with energy at least equal to the activation energy and the correct orientation."
      - "A collision between two particles moving in the same direction."
    option_explanations:
      - |
        Most collisions are ineffective; if every collision reacted, reactions would finish in microseconds.
      - |
        Energy is necessary but not sufficient; the reacting atoms must also meet in the right positions.
      - |
        Correct. Collision theory requires both enough energy to reach the activated complex and an orientation that lets the new bonds form.
      - |
        Direction of travel has nothing to do with it; what matters is the energy and the geometry at the moment of impact.
    answer: 2
    explanation: |
      Effective collisions need energy ≥ Ea and the right orientation. The rate is the rate of effective collisions.

  - slug: chem-u07-exam-q17
    type: multiple_choice
    topic_code: "7.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A reaction has Ea(forward) = 50 kJ and ΔH = +20 kJ. What is Ea(reverse)?
    options:
      - "70 kJ"
      - "30 kJ"
      - "50 kJ"
      - "20 kJ"
    option_explanations:
      - |
        70 kJ would apply if ΔH were −20 kJ (products below the reactants); here the products are above.
      - |
        Correct. The products are 20 kJ above the reactants, so from the products the peak is only 50 − 20 = 30 kJ up.
      - |
        The forward and reverse activation energies are equal only when ΔH is zero.
      - |
        20 kJ is ΔH, the difference between products and reactants, not an activation energy.
    answer: 1
    explanation: |
      Ea(reverse) = Ea(forward) − ΔH = 50 − 20 = 30 kJ. An endothermic forward reaction has an easier reverse.

  - slug: chem-u07-exam-q18
    type: multiple_choice
    topic_code: "7.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which best explains why raising the temperature increases the rate of a reaction?
    options:
      - "It lowers the activation energy."
      - "It makes the reaction more exothermic."
      - "It increases the concentration of the reactants."
      - "It raises the fraction of collisions with energy above the activation energy, and makes collisions somewhat more frequent."
    option_explanations:
      - |
        Ea is fixed by the pathway; temperature changes how many particles can reach it, not its height.
      - |
        ΔH is almost unaffected by temperature and does not govern rate in any case.
      - |
        Concentration is unchanged by heating (in a closed vessel); the effect is on particle energies.
      - |
        Correct. The energy distribution shifts so that many more collisions exceed Ea; the slight increase in collision frequency is the smaller part of the effect.
    answer: 3
    explanation: |
      Temperature acts mainly through the fraction of effective collisions, which is why a 10 °C rise can double the rate.

  - slug: chem-u07-exam-q19
    type: multiple_choice
    topic_code: "7.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement about a catalyst is correct?
    options:
      - "It increases the amount of product formed at equilibrium."
      - "It is used up during the reaction."
      - "It provides an alternative pathway with a lower activation energy and is unchanged at the end."
      - "It raises the kinetic energy of the reactant particles."
    option_explanations:
      - |
        A catalyst changes the time taken to reach the final amount, not the amount itself.
      - |
        A catalyst takes part but is regenerated; the same mass is present at the end.
      - |
        Correct. The lower-Ea route lets a larger fraction of existing collisions succeed; the catalyst is recovered unchanged.
      - |
        Particle energies depend on temperature, which a catalyst does not alter; it moves the Ea line, not the energy distribution.
    answer: 2
    explanation: |
      Catalyst: lower Ea, same ΔH, same products, same equilibrium, faster. Not consumed.

  - slug: chem-u07-exam-q20
    type: multiple_choice
    topic_code: "7.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Two identical samples of zinc, one a lump and one a powder, react with equal volumes of the same acid, the zinc being the limiting reactant. Which graph description of hydrogen volume against time is correct?
    options:
      - "The powder's curve is steeper and reaches the same plateau sooner."
      - "The powder's curve is steeper and reaches a higher plateau."
      - "The two curves are identical, because the mass of zinc is the same."
      - "The lump's curve is steeper, because a lump is more concentrated."
    option_explanations:
      - |
        Correct. Surface area raises the rate (steeper start) but not the amount of product (same plateau), which is fixed by the limiting zinc.
      - |
        The plateau is set by the moles of zinc, which are equal; only the slope differs.
      - |
        Equal mass gives equal product but not equal rate; the powder exposes far more surface to collisions.
      - |
        "Concentration" does not apply to a solid lump; the lump has less exposed surface and reacts more slowly.
    answer: 0
    explanation: |
      Rate factors change the slope; the limiting reactant sets the plateau. Same zinc, same hydrogen, different time.

  - slug: chem-u07-exam-q21
    type: multiple_choice
    topic_code: "7.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement is true of a reversible reaction that has reached equilibrium in a closed container?
    options:
      - "The forward reaction has stopped and only the reverse reaction continues."
      - "The forward and reverse reactions continue at equal rates and the concentrations no longer change."
      - "The reactants have been completely converted into products."
      - "The concentrations of all reactants and products are equal."
    option_explanations:
      - |
        Both reactions continue; neither stops at equilibrium.
      - |
        Correct. Equal opposing rates keep every concentration constant while both reactions go on; this is what dynamic equilibrium means.
      - |
        Complete conversion is the opposite of equilibrium; both reactants and products remain.
      - |
        Concentrations are constant, not equal; the value of Kc fixes their ratio.
    answer: 1
    explanation: |
      Dynamic equilibrium: ongoing opposite reactions at equal rates, constant concentrations, closed system.

