    # ---- Short answer
    - slug: chem-u07-w27-q21
      type: short_answer
      topic_code: "7.5"
      source: "general knowledge"
      points: 3
      prompt: |
        A student draws a Maxwell–Boltzmann distribution for a gas at 300 K and marks the activation energy of a reaction with a vertical line far out on the high-energy tail.
        (a) Describe what happens to the shape and position of the curve when the same gas is heated to 350 K.
        (b) Explain, using the diagram, why the reaction is much faster at 350 K.
        (c) Describe how adding a catalyst would be shown on this diagram and why that also increases the rate.
      answer: |
        (a) The curve shifts to the right and flattens: the peak moves to a higher energy and is lower, and the high-energy tail becomes larger; the total area (number of particles) stays the same. (b) The area under the curve to the right of the Ea line is the fraction of particles with enough energy to react on collision; at 350 K that area is several times larger, so a far greater fraction of collisions are effective, and the rate rises much more than the small increase in collision frequency alone would give. (c) The curve does not change; the Ea line is moved to the left, because the catalysed pathway has a lower activation energy. More of the existing particles now lie to the right of the line, so more collisions are effective and the rate increases.
      explanation: |
        1 point for (a) shift right, peak lower, tail larger, area unchanged. 1 point for (b) the larger area beyond Ea as the reason, with the fraction-of-effective-collisions idea. 1 point for (c) the Ea line moving left with the curve unchanged, and the consequence for effective collisions. Deduct if the student has the catalyst moving the curve or raising particle energy.

    - slug: chem-u07-w27-q22
      type: short_answer
      topic_code: "7.4"
      source: "general knowledge"
      points: 3
      stimulus: |
        Energy diagram described in words: the reactants sit at 50 kJ. The curve rises to a peak at 210 kJ and then falls to the products at 120 kJ. With a catalyst the peak is at 150 kJ; the reactant and product levels are unchanged.
      prompt: |
        (a) State the activation energy and the enthalpy change of the uncatalysed forward reaction, and say whether it is exothermic or endothermic.
        (b) Calculate the activation energy of the uncatalysed reverse reaction.
        (c) Give the catalysed forward and reverse activation energies and explain why the catalyst does not change ΔH.
      answer: |
        (a) Ea(forward) = 210 − 50 = 160 kJ; ΔH = 120 − 50 = +70 kJ; endothermic, since the products are higher than the reactants. (b) Ea(reverse) = 210 − 120 = 90 kJ, which is also 160 − 70. (c) Catalysed: Ea(forward) = 150 − 50 = 100 kJ; Ea(reverse) = 150 − 120 = 30 kJ. ΔH is the difference between the product and reactant levels, and the catalyst changes only the path between them (the peak), not the levels themselves, so ΔH remains +70 kJ.
      explanation: |
        1 point for (a) 160 kJ, +70 kJ, endothermic. 1 point for (b) 90 kJ. 1 point for (c) 100 kJ and 30 kJ, with the explanation that the catalyst changes the peak but not the reactant and product levels.

    # ---- Long answer
    - slug: chem-u07-w27-q23
      type: long_answer
      topic_code: "7.5"
      source: "general knowledge"
      points: 6
      prompt: |
        Design an investigation to find out how temperature affects the rate of the reaction between sodium thiosulfate solution and dilute hydrochloric acid, which slowly produces a cloudy precipitate of sulfur. In your answer: (1) describe the method, including how the rate will be measured and at least four temperatures you would test; (2) identify the independent, dependent and controlled variables, and explain why each controlled variable matters; (3) predict the result and sketch it in words (what a graph of rate against temperature would look like); (4) explain the predicted result using collision theory and the distribution of particle energies; (5) describe one safety precaution and one way to improve the reliability of the data.
      answer: |
        (1) Put 50 mL of 0.10 M sodium thiosulfate in a flask standing on a paper marked with a cross. Warm (or cool) the thiosulfate in a water bath to the target temperature, measured with a thermometer, add 10 mL of 1.0 M HCl, start a stopwatch, swirl once and stop the watch when the cross can no longer be seen through the cloudy solution. Repeat at 20, 30, 40, 50 and 60 °C. Rate is taken as 1 ÷ time. (2) Independent: temperature. Dependent: time for the cross to disappear (rate = 1/time). Controlled: concentrations and volumes of both solutions (concentration is itself a rate factor), the same flask and the same cross (so the same amount of sulfur hides the cross each time), the same observer, and the same method of mixing. (3) Time falls sharply as temperature rises; a graph of rate (1/time) against temperature curves upward, roughly doubling for every 10 °C rise. (4) Higher temperature gives particles higher average kinetic energy. Collisions are a little more frequent, but the main effect is that the Maxwell–Boltzmann distribution shifts right, so a much larger fraction of collisions has energy above the activation energy; many more collisions are effective, so the rate increases faster than linearly. (5) Safety: the reaction releases sulfur dioxide, so work in a ventilated room and dispose of the mixture promptly; wear eye protection. Reliability: repeat each temperature three times and average, discarding anomalies; use a light sensor instead of the eye to judge when the cross disappears.
      explanation: |
        6 points. 1 point: a workable method with a measured rate (time for the cross to vanish or similar) and at least four temperatures. 1 point: variables correctly identified. 1 point: at least two controlled variables with reasons (concentration, volume, flask, observer). 1 point: correct prediction with the shape of the graph. 1 point: collision-theory explanation including the energy distribution and fraction above Ea, not only collision frequency. 1 point: a relevant safety precaution and a reliability improvement. Deduct 1 point if the explanation attributes the change entirely to more frequent collisions.
