week: 27
unit: 7
title: "Reaction Rates, Collision Theory and Catalysts"
topics: ["7.4", "7.5"]
guide: guides/week-27.md
guide_description: |
  Reaction rate as change per unit time, calculating average rates from gas-volume and concentration data,
  the ways a rate is measured, collision theory (energy above the activation energy and correct orientation),
  energy diagrams with the activated complex and forward and reverse activation energies, the Maxwell–Boltzmann
  distribution in words, the six factors that change rate explained by collisions, what a catalyst does and
  does not change, and rate versus amount of product.
flashcards_description: |
  28 cards on rate definitions and calculations, measuring rates, collision theory, activation energy and
  energy diagrams, the energy distribution, each rate factor with its collision-theory reason, and catalysts.

flashcards:
  - front: Reaction rate → definition and common units
    back: |
      The change in amount or concentration of a reactant or product per unit time, quoted as a positive number. Units such as M/s, mL/s or g/s.
    topic_code: "7.4"
  - front: Average rate from two concentration readings
    back: |
      Rate = |Δ[concentration]| ÷ Δt. From 0.800 M to 0.620 M in 60 s: 0.180 M ÷ 60 s = 0.0030 M/s.
    topic_code: "7.4"
  - front: Three ways to measure a rate in the lab
    back: |
      Collect a gas product in a syringe and read its volume against time; follow the mass loss on a balance as gas escapes; time a colour change or the disappearance of a cross under a flask as a precipitate forms.
    topic_code: "7.4"
  - front: Shape of a product-versus-time graph
    back: |
      Steep at first, flattening to a plateau. The slope at any point is the rate; it decreases because reactants are being used up, and the plateau means the limiting reactant is gone.
    topic_code: "7.4"
  - front: Why a reaction slows down as it proceeds
    back: |
      Reactant particles are consumed, so fewer remain to collide; fewer collisions per second means a lower rate. Rate depends on concentration.
    topic_code: "7.4"
  - front: Collision theory → two requirements for an effective collision
    back: |
      The collision must have energy at least equal to the activation energy, and the particles must hit with the correct orientation. Most collisions fail one or both.
    topic_code: "7.4"
  - front: Activation energy → definition
    back: |
      The minimum energy a collision must have for the reaction to happen; the height of the hump on an energy diagram, measured from the reactants' level.
    topic_code: "7.4"
  - front: Activated complex (transition state)
    back: |
      The unstable, highest-energy arrangement at the top of the energy hump, with old bonds partly broken and new bonds partly formed. It cannot be isolated.
    topic_code: "7.4"
  - front: Ea(reverse) from Ea(forward) and ΔH
    back: |
      Ea(reverse) = Ea(forward) − ΔH. For Ea(forward) = 80 kJ and ΔH = −50 kJ, Ea(reverse) = 130 kJ: the products are lower, so the climb back is higher.
    topic_code: "7.4"
  - front: Is a strongly exothermic reaction necessarily fast?
    back: |
      No. The size of Ea and the sign of ΔH are independent. Wood burning is very exothermic yet needs a match, because its Ea is large.
    topic_code: "7.4"
  - front: Why a fire keeps itself going once lit
    back: |
      The heat released by the first effective collisions raises the temperature, giving later collisions the activation energy they need; the reaction supplies its own Ea.
    topic_code: "7.4"
  - front: Maxwell–Boltzmann distribution in words
    back: |
      A graph of number of particles against kinetic energy: zero at zero, rising to a peak at moderate energy, then a long tail to high energies. Only particles right of a vertical line at Ea can react.
    topic_code: "7.5"
  - front: Effect of raising temperature on the energy distribution
    back: |
      The curve shifts right and flattens; the peak moves to higher energy and the high-energy tail grows, so a much larger fraction of particles exceeds Ea.
    topic_code: "7.5"
  - front: Why temperature is the most powerful rate factor
    back: |
      Faster particles collide a little more often, and, much more importantly, a far larger fraction of collisions have energy above Ea. Near room temperature a 10 °C rise roughly doubles many rates.
    topic_code: "7.5"
  - front: Effect of concentration on rate and why
    back: |
      Higher concentration means more particles per volume, so more collisions per second and a faster rate. It does not change the energy of the collisions.
    topic_code: "7.5"
  - front: Effect of pressure on the rate of a gas reaction
    back: |
      Higher pressure (smaller volume) packs gas particles closer, the same as raising concentration: more collisions per second, faster rate.
    topic_code: "7.5"
  - front: Effect of surface area on rate
    back: |
      Only particles at a solid's surface can be struck. A powder exposes far more surface than a lump of the same mass, so it reacts faster; the final amount of product is unchanged.
    topic_code: "7.5"
  - front: Catalyst → definition
    back: |
      A substance that speeds a reaction by providing a different pathway with a lower activation energy and is not used up; it takes part but is regenerated.
    topic_code: "7.5"
  - front: What a catalyst changes on the energy diagram and what it leaves alone
    back: |
      Lowers the hump (Ea) for both the forward and reverse reactions. Leaves the reactant and product levels, and therefore ΔH, exactly where they were.
    topic_code: "7.5"
  - front: Does a catalyst make more product?
    back: |
      No. It changes how quickly the product forms, not how much; the plateau on a product-versus-time graph is reached sooner at the same height.
    topic_code: "7.5"
  - front: Catalyst on the Maxwell–Boltzmann graph
    back: |
      The curve does not move; the Ea line moves left, so a larger fraction of the existing particles already has enough energy to react.
    topic_code: "7.5"
  - front: Three everyday catalysts
    back: |
      Enzymes in living cells; platinum and rhodium in a catalytic converter (CO and nitrogen oxides to CO₂ and N₂); manganese dioxide for the decomposition of hydrogen peroxide.
    topic_code: "7.5"
  - front: Inhibitor
    back: |
      A substance that slows a reaction, often by blocking a catalyst or breaking a chain; preservatives in food and corrosion inhibitors in antifreeze are examples.
    topic_code: "7.5"
  - front: Nature of the reactants as a rate factor
    back: |
      Ions in solution react almost instantly because no bonds need breaking (precipitations, neutralisations); reactions that must break strong covalent bonds, such as those of N₂, are slow.
    topic_code: "7.5"
  - front: Why flour dust can explode but a jar of flour only smoulders
    back: |
      Dispersed in air, every grain is surrounded by oxygen and the total surface area is enormous, so combustion spreads almost instantly; in the jar only surface grains meet the flame.
    topic_code: "7.5"
  - front: Fair test in a rate experiment
    back: |
      Change one factor (concentration, temperature, surface area, catalyst) and hold every other factor constant, including the amounts of reactants, so the measured difference has one cause.
    topic_code: "7.5"
  - front: Rate versus amount of product
    back: |
      Rate factors (temperature, concentration of the excess reactant, surface area, catalyst) change how fast the plateau is reached; only the amount of limiting reactant changes the plateau's height.
    topic_code: "7.5"
  - front: A reaction's rate from a magnesium and acid experiment
    back: |
      Read the volume of hydrogen at two times and divide the change by the interval: 24 mL in the first 20 s is 1.2 mL/s; 16 mL in the next 20 s is 0.8 mL/s.
    topic_code: "7.4"

quiz:
  description: |
    23 questions · about 40 minutes · topics 7.4 and 7.5 (reaction rates, collision theory, activation energy
    and energy diagrams, the factors that change rate, catalysts), with review of kinetic molecular theory (5.1),
    the ideal gas law (5.3), reaction types and the activity series (4.2, 4.3), stoichiometry (4.6), rate of
    dissolving (6.1) and energy diagrams (7.1). Multiple choice, select-all, true/false and numeric items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: magnesium and hydrochloric acid rate data (7.4, 7.5)
    - slug: chem-u07-w27-q01
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 0.050 g strip of magnesium is dropped into 50.0 mL of 1.0 M hydrochloric acid (a large excess) at 20 °C, and the hydrogen produced is collected in a gas syringe.

        | Time (s) | 0 | 10 | 20 | 30 | 40 | 50 | 60 |
        | --- | --- | --- | --- | --- | --- | --- | --- |
        | Volume of H₂ (mL) | 0 | 18 | 31 | 40 | 46 | 49 | 49 |
      prompt: |
        What is the average rate of hydrogen production during the first 30 s?
      options:
        - "40 mL/s"
        - "1.3 mL/s"
        - "0.75 mL/s"
        - "1.8 mL/s"
      option_explanations:
        - |
          40 mL is the volume at 30 s, not a rate; a rate divides the change in volume by the time taken.
        - |
          Correct. 40 mL ÷ 30 s = 1.3 mL/s (1.33 mL/s), the average over the interval.
        - |
          0.75 mL/s is 30 s ÷ 40 mL, the reciprocal; rate is volume per time, not time per volume.
        - |
          1.8 mL/s is the rate over the first 10 s only; the question asks for the average over 30 s, during which the rate was already falling.
      answer: 1
      explanation: |
        Average rate = change in volume ÷ time interval = (40 − 0) mL ÷ 30 s = 1.3 mL/s.

    - slug: chem-u07-w27-q02
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 0.050 g strip of magnesium is dropped into 50.0 mL of 1.0 M hydrochloric acid (a large excess) at 20 °C, and the hydrogen produced is collected in a gas syringe.

        | Time (s) | 0 | 10 | 20 | 30 | 40 | 50 | 60 |
        | --- | --- | --- | --- | --- | --- | --- | --- |
        | Volume of H₂ (mL) | 0 | 18 | 31 | 40 | 46 | 49 | 49 |
      prompt: |
        The volume collected per 10 s falls from 18 mL to 13 mL to 9 mL and so on, and no gas is produced after 50 s. Which explanation is best?
      options:
        - "The hydrogen escapes from the syringe faster as more of it accumulates."
        - "The acid becomes more concentrated as the reaction proceeds, slowing it down."
        - "The temperature falls steadily during the reaction, so collisions become rarer."
        - "The magnesium strip shrinks as it is consumed, so there are fewer collisions each second, and at 50 s it is gone."
      option_explanations:
        - |
          A gas syringe is sealed; the falling increments reflect the reaction slowing, not gas escaping.
        - |
          The acid is in large excess and its concentration barely changes; in any case a higher concentration would speed the reaction, not slow it.
        - |
          This reaction is exothermic, so the temperature if anything rises slightly; the slowdown is not a temperature effect.
        - |
          Correct. Magnesium is the limiting reactant; as it is consumed its surface and amount shrink, collisions per second fall, and once it is used up the rate is zero and the volume plateaus at 49 mL.
      answer: 3
      explanation: |
        Rate falls as a reactant is used up because fewer particles remain to collide. The plateau marks the point at which the limiting reactant (magnesium) is finished.

    - slug: chem-u07-w27-q03
      type: multiple_choice
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 0.050 g strip of magnesium is dropped into 50.0 mL of 1.0 M hydrochloric acid (a large excess) at 20 °C, and the hydrogen produced is collected in a gas syringe.

        | Time (s) | 0 | 10 | 20 | 30 | 40 | 50 | 60 |
        | --- | --- | --- | --- | --- | --- | --- | --- |
        | Volume of H₂ (mL) | 0 | 18 | 31 | 40 | 46 | 49 | 49 |
      prompt: |
        The experiment is repeated with the same magnesium strip and 50.0 mL of 2.0 M hydrochloric acid at 20 °C. Compared with the first run, the graph of volume against time will be
      options:
        - "steeper at the start and reach the same plateau of 49 mL sooner."
        - "steeper at the start and reach a higher plateau of about 98 mL."
        - "identical, because the acid is in excess in both runs."
        - "less steep, because the more concentrated acid is thicker and slows the gas."
      option_explanations:
        - |
          Correct. Doubling the acid concentration doubles the collisions per second with the magnesium surface, so the rate rises; the magnesium still limits the total hydrogen, so the plateau is unchanged.
        - |
          The amount of hydrogen is fixed by the limiting magnesium, not by the excess acid; more acid does not make more product.
        - |
          Excess acid fixes the amount of product, not the rate; a higher concentration still means more collisions per second and a faster reaction.
        - |
          Dilute acid solutions are not noticeably more viscous at 2.0 M, and concentration speeds, not slows, a reaction.
      answer: 0
      explanation: |
        A rate factor changes the slope, not the plateau. The plateau is set by the limiting reactant, which is still the magnesium.

    # ---- Singles
    - slug: chem-u07-w27-q04
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        According to collision theory, which two conditions must a collision satisfy to produce a reaction?
      options:
        - "The particles must be gases and must collide head-on."
        - "The collision must release energy and must involve at least three particles."
        - "The collision must have energy at least equal to the activation energy and the particles must be correctly oriented."
        - "The particles must be at the same temperature and have identical speeds."
      option_explanations:
        - |
          Reactions occur in liquids and solutions as well as gases, and head-on is not the same as correctly oriented.
        - |
          Collisions absorb energy to reach the activated complex, and most reactions proceed through two-particle collisions.
        - |
          Correct. Enough energy to reach the activated complex, and an orientation that brings the reacting atoms together; a collision failing either bounces apart.
        - |
          Particles in any sample have a spread of speeds, and the theory requires nothing about equal speeds.
      answer: 2
      explanation: |
        Two requirements: energy ≥ Ea and correct orientation. Only such effective collisions produce products.

    - slug: chem-u07-w27-q05
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        On an energy diagram, what does the top of the hump between reactants and products represent?
      options:
        - "The products at their most stable arrangement"
        - "The enthalpy change of the reaction"
        - "A stable intermediate that can be collected"
        - "The activated complex, with old bonds partly broken and new bonds partly forming"
      option_explanations:
        - |
          The products sit at the end of the diagram, at a level below the peak.
        - |
          ΔH is the vertical difference between the reactant and product levels, not a point on the curve.
        - |
          The peak is the least stable arrangement along the path and lasts only an instant; it cannot be isolated.
        - |
          Correct. The activated complex, or transition state, is the highest-energy, momentary arrangement through which the reacting particles must pass.
      answer: 3
      explanation: |
        The peak is the activated complex. Its height above the reactants is the activation energy.

    - slug: chem-u07-w27-q06
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A reaction has an activation energy of 75 kJ in the forward direction and ΔH = −40 kJ. What is the activation energy of the reverse reaction?
      options:
        - "115 kJ"
        - "35 kJ"
        - "75 kJ"
        - "40 kJ"
      option_explanations:
        - |
          Correct. The products lie 40 kJ below the reactants, so the climb from products to the peak is 75 + 40 = 115 kJ: Ea(reverse) = Ea(forward) − ΔH = 75 − (−40).
        - |
          35 kJ would be right if the products were 40 kJ above the reactants (ΔH = +40 kJ); here they are below.
        - |
          The forward and reverse activation energies are equal only when ΔH = 0.
        - |
          40 kJ is the magnitude of ΔH, not an activation energy.
      answer: 0
      explanation: |
        Ea(reverse) = Ea(forward) − ΔH. With a negative ΔH the reverse hump is higher than the forward one.

    - slug: chem-u07-w27-q07
      type: multiple_choice
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Manganese dioxide is added to a hydrogen peroxide solution, which then decomposes rapidly. Which statement about the manganese dioxide is correct?
      options:
        - "It is consumed, so the reaction stops when it runs out."
        - "It provides a pathway with a lower activation energy and is recovered unchanged at the end."
        - "It raises the energy of the reactant molecules so more can react."
        - "It makes the decomposition more exothermic."
      option_explanations:
        - |
          A catalyst takes part but is regenerated; the same mass of MnO₂ can be filtered out afterwards.
        - |
          Correct. A catalyst lowers Ea by offering a different route; a larger fraction of collisions then succeed, and the catalyst is not used up.
        - |
          A catalyst does not change the energy of the particles or the shape of their energy distribution; it lowers the barrier they must cross.
        - |
          ΔH depends only on the reactants and products, which a catalyst does not change.
      answer: 1
      explanation: |
        Catalysts lower the activation energy, leave ΔH unchanged and are not consumed. Manganese dioxide is a classic catalyst for peroxide decomposition.

    - slug: chem-u07-w27-q08
      type: multiple_choice
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Equal masses of calcium carbonate, one as a single lump and one as a fine powder, are added to identical volumes of the same acid at the same temperature. Which statement is correct?
      options:
        - "The lump reacts faster because it is denser."
        - "The powder produces more carbon dioxide in total."
        - "The powder reacts faster, but both produce the same total volume of carbon dioxide."
        - "Both react at the same rate because the mass of carbonate is the same."
      option_explanations:
        - |
          Density does not govern rate; the lump has far less exposed surface and reacts more slowly.
        - |
          The total gas depends on the amount of carbonate, which is equal; the powder only produces it faster.
        - |
          Correct. The powder exposes many more surface particles to collisions, so it reacts faster; the same moles of carbonate yield the same moles of CO₂.
        - |
          Equal mass gives equal product, not equal rate; surface area changes how many particles can be struck per second.
      answer: 2
      explanation: |
        Surface area is a rate factor, not an amount factor. Only the limiting reactant's amount sets the total product.

    - slug: chem-u07-w27-q09
      type: multiple_choice
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Why does a 10 °C rise in temperature often double a reaction's rate when the particles' average speed rises by only a few percent?
      options:
        - "The fraction of collisions with energy above the activation energy increases far more than the collision frequency does."
        - "The activation energy of the reaction decreases as the temperature rises."
        - "Heating makes the particles larger, so they collide more often."
        - "The reaction becomes more exothermic at higher temperature."
      option_explanations:
        - |
          Correct. The high-energy tail of the Maxwell–Boltzmann distribution grows sharply with temperature, so many more collisions clear Ea even though collisions are only slightly more frequent.
        - |
          Ea is a property of the pathway and does not change with temperature; what changes is how many particles can reach it.
        - |
          Particle size is unchanged by heating; the small increase in collision frequency comes from speed, not size.
        - |
          ΔH changes only slightly with temperature and has nothing to do with rate.
      answer: 0
      explanation: |
        Temperature acts mostly through the energy distribution: a small shift of the curve to higher energies greatly increases the area beyond Ea.

    - slug: chem-u07-w27-q10
      type: multiple_choice
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Collision theory builds on the kinetic molecular theory. According to that theory, what does the temperature of a sample measure?
      options:
        - "The total energy stored in the sample's chemical bonds"
        - "The number of collisions per second between particles"
        - "The potential energy of the attractions between particles"
        - "The average kinetic energy of the particles"
      option_explanations:
        - |
          Bond energy is chemical potential energy; temperature says nothing about how many bonds a sample contains.
        - |
          Collision frequency depends on temperature and concentration, but temperature itself is defined by particle motion, not collisions.
        - |
          Intermolecular potential energy determines phase and boiling point, not temperature.
        - |
          Correct. Review of 5.1: temperature is proportional to the average kinetic energy of the particles; at any temperature individual particles have a spread of energies around that average.
      answer: 3
      explanation: |
        Review of 5.1: temperature measures average kinetic energy, which is why heating shifts the whole distribution of particle energies to the right.

    - slug: chem-u07-w27-q11
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The rate experiment uses Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g). What type of reaction is this?
      options:
        - "Double replacement"
        - "Single replacement"
        - "Synthesis"
        - "Decomposition"
      option_explanations:
        - |
          A double replacement swaps partners between two compounds; here one reactant is an element.
        - |
          Correct. Review of 4.2: the element magnesium replaces hydrogen in the compound HCl, releasing hydrogen gas.
        - |
          Synthesis combines simpler substances into one product; this reaction produces two.
        - |
          Decomposition breaks one compound into simpler substances; this reaction has two reactants.
      answer: 1
      explanation: |
        Review of 4.2: an element replacing another element in a compound is a single replacement; the activity series (4.3) says magnesium is active enough to do it.

    # ---- Multi-select
    - slug: chem-u07-w27-q12
      type: multi_select
      topic_code: "7.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which changes would increase the rate of a reaction between zinc metal and dilute sulfuric acid? Select all that apply.
      options:
        - "Using zinc powder instead of zinc granules"
        - "Warming the acid from 20 °C to 40 °C"
        - "Using a larger volume of acid at the same concentration"
        - "Using 2.0 M acid instead of 1.0 M acid"
        - "Adding a few drops of copper(II) sulfate solution, which deposits copper that catalyses the reaction"
        - "Diluting the acid with water"
      option_explanations:
        - |
          Correct. Powder exposes more surface, so more zinc atoms can be struck per second.
        - |
          Correct. More collisions, and far more of them with energy above Ea.
        - |
          More acid at the same concentration changes the amount available, not the collisions per second at the zinc surface; the rate is unchanged.
        - |
          Correct. Doubling the concentration doubles the H⁺ ions per volume and the collision frequency.
        - |
          Correct. Copper deposited on the zinc acts as a catalyst for this reaction; the fizzing visibly speeds up.
        - |
          Diluting lowers the concentration of H⁺, giving fewer collisions per second and a slower reaction.
      answer: [0, 1, 3, 4]
      explanation: |
        Surface area, temperature, concentration and a catalyst all increase rate. Volume alone, at fixed concentration, does not; dilution decreases it.

    - slug: chem-u07-w27-q13
      type: multi_select
      topic_code: "6.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Dissolving is a rate process as well. Which of the following increase how quickly sugar dissolves in water without changing how much can dissolve at that temperature? Select all that apply.
      options:
        - "Stirring the solution"
        - "Crushing the sugar crystals"
        - "Adding more water"
        - "Using fine sugar instead of sugar cubes"
        - "Heating the water"
      option_explanations:
        - |
          Correct. Stirring brings fresh water to the crystal surfaces, raising the rate; the solubility at that temperature is unchanged.
        - |
          Correct. Smaller pieces expose more surface, so dissolving is faster; the amount that can dissolve is the same.
        - |
          More water increases the total that can be dissolved; it is an amount change, not a rate factor for a given surface.
        - |
          Correct. Fine sugar has far more surface area than cubes, a pure rate effect.
        - |
          Heating does speed dissolving, but it also raises sugar's solubility, so it changes how much can dissolve as well.
      answer: [0, 1, 3]
      explanation: |
        Review of 6.1: stirring and surface area change only the rate of dissolving; temperature changes both the rate and the solubility, and the amount of solvent changes capacity.

    # ---- True/false
    - slug: chem-u07-w27-q14
      type: true_false
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: a reaction with a negative ΔH has no activation energy, which is why exothermic reactions start on their own.
      answer: false
      explanation: |
        False. Review of 7.1: the energy diagram of an exothermic reaction still rises to a peak before falling below the reactants' level. The sign of ΔH and the size of Ea are independent; paper, with a very negative ΔH of combustion, waits indefinitely for a match.

    - slug: chem-u07-w27-q15
      type: true_false
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: copper is below hydrogen in the activity series, so a copper strip dropped into dilute hydrochloric acid produces no hydrogen no matter how long you wait.
      answer: true
      explanation: |
        True. Review of 4.3: only metals above hydrogen in the activity series displace it from acids. This is not a slow reaction; it is no reaction, which is a different thing from a low rate.

    # ---- Fill in the blank
    - slug: chem-u07-w27-q16
      type: fill_blank
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The minimum energy that colliding particles must have for a reaction to occur is called the ____ energy.
      answer:
        - "activation"
        - "activation energy"
      explanation: |
        Activation energy, Ea, is the height of the hump on an energy diagram measured from the reactants' level.

    - slug: chem-u07-w27-q17
      type: fill_blank
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        In Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g), 0.0100 mol of magnesium reacting with excess acid produces ____ mol of hydrogen gas. (Give three significant figures.)
      answer:
        - "0.0100"
        - "0.010"
        - "0.01"
        - "1.00 × 10⁻²"
        - "1.00 x 10^-2"
      explanation: |
        Review of 4.6: the mole ratio of Mg to H₂ is 1:1, so 0.0100 mol of magnesium gives 0.0100 mol of hydrogen.

    # ---- Numeric
    - slug: chem-u07-w27-q18
      type: numeric
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The concentration of hydrogen peroxide in a solution falls from 0.800 M to 0.620 M in 60.0 s. Calculate the average rate of decomposition in mol/(L·s) to three significant figures, as a positive number.
      answer: { value: 0.00300, tolerance: 0.00005 }
      explanation: |
