    - slug: chem-u07-w25-q23
      type: long_answer
      topic_code: "7.2"
      source: "general knowledge"
      points: 6
      prompt: |
        A student wants to measure the enthalpy change for dissolving solid sodium hydroxide in water using a coffee-cup calorimeter. Design the experiment and the calculation. In your answer: (1) list the measurements you would take and the equipment you would use; (2) explain how the calorimeter is set up so that the heat released stays in the water, and name the two assumptions the coffee-cup method relies on; (3) show, with symbols, how you would calculate q for the water and then ΔH in kJ per mole of NaOH, including the sign; (4) describe two sources of error and whether each would make the measured ΔH magnitude too large or too small.
      answer: |
        (1) Measurements: mass of NaOH (balance, about 2 g to 0.01 g), volume or mass of water (graduated cylinder, 50.0 mL), initial water temperature and highest temperature after dissolving (thermometer or probe reading to 0.1 °C). Equipment: two nested polystyrene cups with a lid, a stirrer, a thermometer. (2) The nested cups and lid insulate the water, so the heat released by dissolving goes into warming the water rather than escaping to the air. The method assumes (a) the solution has the density and specific heat of water (1.00 g/mL, 4.184 J/(g·°C)) and (b) the cups absorb negligible heat, so all the heat released is accounted for by the water's temperature rise. (3) q(water) = m × c × ΔT, with m the mass of water (or solution), c = 4.184 J/(g·°C), and ΔT = T(final) − T(initial). The reaction released this heat, so q(reaction) = −q(water). Moles of NaOH = mass ÷ 40.00 g/mol. ΔH = q(reaction) ÷ n, converted to kJ/mol; since the water warmed, ΔH is negative (the literature value is about −44 kJ/mol). (4) Heat lost to the air or absorbed by the cup and thermometer lowers the measured temperature rise, so the ΔH magnitude comes out too small. Reading the thermometer before the maximum is reached also gives too small a magnitude. Using the mass of water alone instead of water plus NaOH slightly underestimates q, again too small. If NaOH pellets had absorbed moisture from the air, the mass of NaOH is overstated, so the moles are too high and the ΔH magnitude per mole is again too small; a student who stirs vigorously with a warm hand on the cup could, in contrast, add heat and make the magnitude too large.
      explanation: |
        6 points. 1 point: complete list of measurements (mass of solute, amount of water, initial and final temperatures) with sensible equipment. 1 point: insulation explained (nested cups, lid). 1 point: both assumptions (solution behaves as water; calorimeter absorbs negligible heat). 1 point: q = m c ΔT and q(reaction) = −q(water). 1 point: moles from mass ÷ 40.00 g/mol and ΔH = q ÷ n with a negative sign justified by the temperature rise. 1 point: two sources of error with correct direction of effect for each. Deduct 1 point for a positive ΔH or for omitting the sign.
