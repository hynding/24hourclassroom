week: 25
unit: 7
title: "Enthalpy, Specific Heat and Calorimetry"
topics: ["7.1", "7.2"]
guide: guides/week-25.md
guide_description: |
  Exothermic and endothermic reactions explained by bonds broken and formed, the sign convention for ΔH,
  thermochemical equations and how to scale and reverse them, energy diagrams with activation energy, then specific
  heat and q = mcΔT, the coffee-cup calorimeter, converting a temperature rise into ΔH per mole for a
  neutralisation and a dissolving, and the method of mixtures for the specific heat of a metal.
flashcards_description: |
  28 cards on the sign of ΔH, bond energy reasoning, thermochemical equations, energy diagrams, specific heat
  values, q = mcΔT and calorimetry calculations.

flashcards:
  - front: Exothermic reaction → sign of ΔH and what the surroundings feel
    back: |
      ΔH is negative: the system releases heat and the surroundings warm up. Combustion, neutralisation, rusting and respiration are exothermic.
    topic_code: "7.1"
  - front: Endothermic reaction → sign of ΔH and what the surroundings feel
    back: |
      ΔH is positive: the system absorbs heat and the surroundings cool down. Photosynthesis, ammonium nitrate dissolving (cold packs), and every melting or boiling are endothermic.
    topic_code: "7.1"
  - front: Bonds broken and bonds formed → how they decide the sign of ΔH
    back: |
      Breaking bonds always costs energy; forming bonds always releases it. If the bonds formed release more than the bonds broken cost, the reaction is exothermic; if less, endothermic.
    topic_code: "7.1"
  - front: Enthalpy change → definition
    back: |
      ΔH = H_products − H_reactants, the heat absorbed or released by a reaction at constant pressure. It is measured in kJ for the amounts written in the balanced equation.
    topic_code: "7.1"
  - front: System and surroundings in thermochemistry
    back: |
      The system is the reaction (or object) being studied; the surroundings are everything else, including the water in a calorimeter. Energy lost by one is gained by the other: q_system = −q_surroundings.
    topic_code: "7.1"
  - front: A beaker turns cold during a reaction → classify it
    back: |
      Endothermic, ΔH > 0. Heat is flowing from the surroundings (the beaker, your hand) into the system. "Giving off cold" is not a thing; heat is being absorbed.
    topic_code: "7.1"
  - front: Thermochemical equation → what it is and an example
    back: |
      A balanced equation with its ΔH for the moles written: CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(l), ΔH = −890 kJ. Phases must be shown because they change ΔH.
    topic_code: "7.1"
  - front: Scaling a thermochemical equation
    back: |
      ΔH scales with the amount: 2 mol of methane burning releases 2 × 890 = 1,780 kJ; 0.25 mol releases 222.5 kJ. Multiply the coefficients and ΔH by the same factor.
    topic_code: "7.1"
  - front: Reversing a thermochemical equation
    back: |
      Flip the sign of ΔH. CO₂(g) + 2 H₂O(l) → CH₄(g) + 2 O₂(g) has ΔH = +890 kJ. Decomposing 3 mol of liquid water (2 H₂ + O₂ → 2 H₂O, −572 kJ) needs +858 kJ.
    topic_code: "7.1"
  - front: Why ΔH differs for water vapour and liquid water as a product
    back: |
      Methane burning to H₂O(g) releases −802 kJ, to H₂O(l) −890 kJ. The 88 kJ difference is the heat of vaporisation of the 2 mol of water (2 × 44 kJ) that stays stored in the vapour.
    topic_code: "7.1"
  - front: Heat from a mass of fuel → the route
    back: |
      grams → moles (÷ molar mass) → × ΔH per mole. 10.0 g of CH₄ is 0.623 mol, releasing 0.623 × 890 = 555 kJ.
    topic_code: "7.1"
  - front: Energy diagram → the axes and the three things to read
    back: |
      Enthalpy (vertical) against reaction progress (horizontal). Read the reactant level, the product level (their difference is ΔH) and the peak between them (its height above the reactants is the activation energy Ea).
    topic_code: "7.1"
  - front: Activation energy → definition and why exothermic reactions still need it
    back: |
      The minimum energy colliding molecules must have for bonds to start rearranging, the hump on the energy diagram. Even methane, which releases 890 kJ/mol, needs a spark to get over the hump.
    topic_code: "7.1"
  - front: Exothermic energy diagram → shape in words
    back: |
      The curve starts at the reactant level, rises to a peak Ea above it, then falls to a product level that is ΔH below the start. Products lower than reactants.
    topic_code: "7.1"
  - front: Endothermic energy diagram → shape in words
    back: |
      The curve rises from the reactants to a peak, then falls only part way, ending at a product level ΔH above the start. The peak is at least as high as ΔH.
    topic_code: "7.1"
  - front: Specific heat → definition, symbol, unit
    back: |
      The energy needed to raise 1 g of a substance by 1 °C; symbol c; unit J/(g·°C). Water's is 4.184 J/(g·°C), one of the highest of common substances.
    topic_code: "7.2"
  - front: q = mcΔT → each symbol
    back: |
      q heat in J; m mass in g; c specific heat in J/(g·°C); ΔT = T_final − T_initial in °C. Warming gives positive q, cooling negative.
    topic_code: "7.2"
  - front: Specific heats to recognise → water, ethanol, aluminium, iron, copper, lead
    back: |
      Water 4.184; ethanol 2.44; aluminium 0.897; iron 0.449; copper 0.385; lead 0.129, all in J/(g·°C). Metals warm fast; water warms slowly.
    topic_code: "7.2"
  - front: Why water's high specific heat matters
    back: |
      Water absorbs lots of energy for a small temperature rise, so coastal climates are mild, the body uses water to carry heat, and a pot of water heats far more slowly than its metal handle.
    topic_code: "7.2"
  - front: Heat capacity versus specific heat
    back: |
      Specific heat is per gram (J/(g·°C)); heat capacity C = mc is for a whole object (J/°C). A 500 g pan of iron has C = 500 × 0.449 = 225 J/°C.
    topic_code: "7.2"
  - front: Final temperature from q = mcΔT
    back: |
      ΔT = q/(mc), then T_final = T_initial + ΔT. 5,000 J into 100 g of aluminium at 20.0 °C: ΔT = 5,000/(100 × 0.897) = 55.7 °C, so 75.7 °C.
    topic_code: "7.2"
  - front: Coffee-cup calorimeter → what it is and the key equation
    back: |
      Nested insulated cups with a lid and thermometer holding a known mass of water or solution. The water's temperature change gives q_water = m × 4.184 × ΔT, and q_process = −q_water.
    topic_code: "7.2"
  - front: Why q_reaction = −q_water
    back: |
      The insulation keeps energy inside, so whatever heat the water gains the reaction lost (exothermic, water warms) and whatever the water loses the reaction gained (endothermic, water cools).
    topic_code: "7.2"
  - front: Heat of neutralisation from a calorimeter → the steps
    back: |
      Total solution mass (volume × 1.00 g/mL) → q_solution = m × 4.184 × ΔT → q_rxn = −q_solution → ÷ moles of water formed (from the limiting reactant). 50.0 mL + 50.0 mL of 1.00 M, ΔT = 6.8 °C: −2,845 J ÷ 0.0500 mol = −56.9 kJ/mol.
    topic_code: "7.2"
  - front: Heat of solution of ammonium nitrate → the sign and the use
    back: |
      Dissolving 5.00 g in 100.0 g of water cools it by 3.9 °C: q_water = −1,632 J, so q_dissolving = +1,632 J for 0.0625 mol, ΔH = +26.1 kJ/mol. Endothermic, which is why it fills instant cold packs.
    topic_code: "7.2"
  - front: Method of mixtures → finding a metal's specific heat
    back: |
      Heat the metal to 100.0 °C in boiling water, drop it into cool water in a calorimeter, record the final temperature. Heat lost by the metal = heat gained by the water: m_metal c_metal ΔT_metal = −m_water × 4.184 × ΔT_water.
    topic_code: "7.2"
  - front: Error spotting → using the solute's mass in a calorimetry calculation
    back: |
      The mass in q = mcΔT is the mass of everything that changed temperature: the whole solution (water plus dissolved solute), not the solute alone and not one of the two solutions mixed.
    topic_code: "7.2"
  - front: Error spotting → ΔH per mole with the wrong moles
    back: |
      Divide q_rxn by the moles of the limiting reactant (or of the product the ΔH refers to). 50.0 mL of 1.00 M HCl with 50.0 mL of 1.00 M NaOH forms 0.0500 mol of water, not 0.100.
    topic_code: "7.2"

quiz:
  description: |
    23 questions · about 40 minutes · topics 7.1 and 7.2 (exothermic and endothermic reactions, enthalpy,
    thermochemical equations, energy diagrams, specific heat and calorimetry), with review of energy units (1.6),
    covalent bonds (3.3), the mole and stoichiometry (4.4, 4.6), phase changes (5.5), molarity (6.2) and
    neutralisation (6.6). Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: a neutralisation in a coffee-cup calorimeter (7.2, 6.6)
    - slug: chem-u07-w25-q01
      type: multiple_choice
      topic_code: "7.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student mixes 25.0 mL of 2.00 M HCl with 25.0 mL of 2.00 M NaOH in a coffee-cup calorimeter. Both solutions start at 22.0 °C; the temperature of the mixture rises to 35.6 °C. Assume the solution has the density (1.00 g/mL) and specific heat (4.184 J/(g·°C)) of water.
      prompt: |
        How much heat was absorbed by the solution?
      options:
        - "1,420 J"
        - "5,690 J"
        - "209 J"
        - "2,850 J"
      option_explanations:
        - |
          1,420 J uses only 25.0 g, the mass of one of the two solutions; both were warmed.
        - |
          5,690 J doubles the mass to 100 g; the mixture is 50.0 mL, which is 50.0 g.
        - |
          209 J uses ΔT = 1 °C by mistake; the temperature rose by 13.6 °C.
        - |
          Correct. m = 50.0 g; ΔT = 35.6 − 22.0 = 13.6 °C; q = 50.0 × 4.184 × 13.6 = 2,845 J ≈ 2,850 J.
      answer: 3

    - slug: chem-u07-w25-q02
      type: multiple_choice
      topic_code: "7.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student mixes 25.0 mL of 2.00 M HCl with 25.0 mL of 2.00 M NaOH in a coffee-cup calorimeter. Both solutions start at 22.0 °C; the temperature of the mixture rises to 35.6 °C. Assume the solution has the density (1.00 g/mL) and specific heat (4.184 J/(g·°C)) of water.
      prompt: |
        The solution absorbed about 2,850 J. What is ΔH for the reaction per mole of water formed?
      options:
        - "+56.9 kJ/mol"
        - "−56.9 kJ/mol"
        - "−28.5 kJ/mol"
        - "−2.85 kJ/mol"
      option_explanations:
        - |
          The sign is wrong: the solution warmed, so the reaction released heat and ΔH is negative.
        - |
          Correct. q_rxn = −2,850 J; moles of water = 0.0250 L × 2.00 M = 0.0500 mol (HCl and NaOH are equal, 1:1); ΔH = −2,850/0.0500 = −56,900 J/mol = −56.9 kJ/mol.
        - |
          −28.5 kJ/mol divides by 0.100 mol, double-counting the acid and base; the water formed is 0.0500 mol.
        - |
          −2.85 kJ/mol is the heat for this experiment in kJ, not per mole; it must be divided by 0.0500 mol.
      answer: 1

    - slug: chem-u07-w25-q03
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student mixes 25.0 mL of 2.00 M HCl with 25.0 mL of 2.00 M NaOH in a coffee-cup calorimeter. Both solutions start at 22.0 °C; the temperature of the mixture rises to 35.6 °C. Assume the solution has the density (1.00 g/mL) and specific heat (4.184 J/(g·°C)) of water.
      prompt: |
        Which net ionic equation describes the reaction that released the heat, and how many moles of water did it form?
      options:
        - "H⁺(aq) + OH⁻(aq) → H₂O(l); 0.0500 mol"
        - "HCl(aq) + NaOH(aq) → NaCl(s) + H₂O(l); 0.100 mol"
        - "Na⁺(aq) + Cl⁻(aq) → NaCl(aq); 0.0500 mol"
        - "H⁺(aq) + OH⁻(aq) → H₂O(l); 0.100 mol"
      option_explanations:
        - |
          Correct. The net ionic equation omits the spectator ions Na⁺ and Cl⁻; 0.0250 L × 2.00 M = 0.0500 mol of H⁺ meets 0.0500 mol of OH⁻ and forms 0.0500 mol of water.
        - |
          NaCl stays dissolved, so this is not the net ionic equation, and 0.100 mol counts the acid and base twice.
        - |
          Sodium and chloride are spectator ions; they do not react or release heat.
        - |
          The equation is right but the amount is wrong: 0.0500 mol of H⁺ can form only 0.0500 mol of water.
      answer: 0
      explanation: |
        Review of 6.6: the neutralisation titrated last week is the exothermic reaction measured this week.

    # ---- Single items
    - slug: chem-u07-w25-q04
      type: multiple_choice
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Solid barium hydroxide and solid ammonium chloride are stirred together in a beaker. The beaker becomes cold enough to freeze a film of water beneath it. Which statement is correct?
      options:
        - "The reaction is exothermic because it produces cold."
        - "The reaction is exothermic because ΔH is negative whenever a temperature changes."
        - "The reaction is endothermic: it absorbs heat from the surroundings, so ΔH is positive."
        - "No energy change occurs; the cold comes from the water freezing."
      option_explanations:
        - |
          "Cold" is not produced or given off; the beaker cools because heat flows out of it into the reacting mixture.
        - |
          A temperature change can go either way; a falling temperature in the surroundings means an endothermic process.
        - |
          Correct. The system takes heat from the beaker, the bench and the air; for the system ΔH > 0.
        - |
          The water freezes because the reaction has already drawn heat out of it; the energy change is in the reaction.
      answer: 2

    - slug: chem-u07-w25-q05
      type: multiple_choice
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        In terms of chemical bonds, why is the combustion of methane exothermic?
      options:
        - "Breaking the C–H and O=O bonds releases energy."
        - "The energy released in forming the C=O and O–H bonds of the products is greater than the energy needed to break the bonds of the reactants."
        - "No bonds are broken, only formed."
        - "The products contain fewer bonds than the reactants."
      option_explanations:
        - |
          Breaking any bond costs energy; the release comes only from forming bonds.
        - |
          Correct. Four C–H and two O=O bonds are broken (energy in), and two C=O and four O–H bonds are formed (energy out); the output exceeds the input by about 890 kJ per mole.
        - |
          Every reaction breaks some bonds; methane's C–H bonds and oxygen's O=O bonds must open before new ones can form.
        - |
          Counting bonds is not the test; what matters is the total energy of the bonds formed versus broken.
      answer: 1

    - slug: chem-u07-w25-q06
      type: multiple_choice
      topic_code: "7.1"
      source: "NIST Chemistry WebBook (enthalpy of combustion of propane)"
      points: 1
      prompt: |
        C₃H₈(g) + 5 O₂(g) → 3 CO₂(g) + 4 H₂O(l), ΔH = −2,220 kJ. What is ΔH when 0.250 mol of propane burns?
      options:
        - "−8,880 kJ"
        - "+555 kJ"
        - "−2,220 kJ"
        - "−555 kJ"
      option_explanations:
        - |
          −8,880 kJ multiplies by 4 instead of dividing; 0.250 mol is a quarter of the equation's amount.
        - |
          The magnitude is right but the sign is wrong; combustion releases heat, so ΔH stays negative.
        - |
          −2,220 kJ is for 1 mol of propane, the amount written in the equation.
        - |
          Correct. 0.250 mol × (−2,220 kJ/mol) = −555 kJ.
      answer: 3

    - slug: chem-u07-w25-q07
      type: multiple_choice
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Figure description: An energy diagram shows the reactants at 50 kJ, a peak at 200 kJ, and the products at 120 kJ. What are the activation energy and ΔH for the forward reaction?
      options:
        - "Ea = 150 kJ; ΔH = +70 kJ (endothermic)"
        - "Ea = 80 kJ; ΔH = −70 kJ (exothermic)"
        - "Ea = 200 kJ; ΔH = +120 kJ"
        - "Ea = 150 kJ; ΔH = −70 kJ (exothermic)"
      option_explanations:
        - |
          Correct. Ea is the peak minus the reactants, 200 − 50 = 150 kJ; ΔH is products minus reactants, 120 − 50 = +70 kJ, so the products sit above the reactants and the reaction is endothermic.
        - |
          80 kJ is the activation energy of the reverse reaction (peak minus products), and the sign of ΔH is wrong.
        - |
          The absolute heights are not the quantities asked for; both are differences measured from the reactant level.
        - |
          The products are higher than the reactants, so ΔH is positive, not negative.
      answer: 0

    - slug: chem-u07-w25-q08
      type: multiple_choice
      topic_code: "7.2"
      source: "NIST Chemistry WebBook (specific heats)"
      points: 1
      prompt: |
        Equal masses of water (c = 4.184), aluminium (0.897), iron (0.449) and copper (0.385 J/(g·°C)) each absorb 1,000 J of heat. Which shows the largest temperature rise?
      options:
        - "Water"
        - "Aluminium"
        - "Copper"
        - "Iron"
      option_explanations:
        - |
          Water has the largest specific heat, so the same heat raises its temperature the least.
        - |
          Aluminium rises more than water but less than the two heavier metals.
        - |
          Correct. ΔT = q/(mc); the smallest c gives the largest ΔT, and copper's 0.385 J/(g·°C) is the smallest listed.
        - |
          Iron (0.449) is close to copper but still needs slightly more heat per degree.
      answer: 2

    - slug: chem-u07-w25-q09
      type: multiple_choice
      topic_code: "7.2"
      source: "general knowledge"
      points: 1
      prompt: |
        How much heat is released when 200.0 g of water cools from 80.0 °C to 30.0 °C?
      options:
        - "−1,046 J"
        - "−41,840 J"
        - "+41,840 J"
        - "−66,944 J"
      option_explanations:
        - |
          −1,046 J would be the result for a 1.25 °C change; the water cools by 50.0 °C.
        - |
          Correct. q = 200.0 × 4.184 × (30.0 − 80.0) = 200.0 × 4.184 × (−50.0) = −41,840 J; the negative sign shows heat leaving the water.
        - |
          The magnitude is right but cooling releases heat, so q is negative.
        - |
          −66,944 J uses 80.0 °C as ΔT instead of the 50.0 °C change.
      answer: 1

    - slug: chem-u07-w25-q10
      type: multiple_choice
      topic_code: "5.5"
      source: "NIST Chemistry WebBook (water data)"
      points: 1
      prompt: |
        H₂O(l) → H₂O(g) has ΔH = +40.7 kJ/mol at 100 °C. Which statement is correct?
      options:
        - "Boiling water is exothermic because steam is hot."
        - "Condensing steam has ΔH = +40.7 kJ/mol."
        - "Boiling 1 mol of water releases 40.7 kJ to the surroundings."
        - "Boiling is endothermic; condensing 1 mol of steam releases 40.7 kJ."
      option_explanations:
        - |
          The positive ΔH means boiling absorbs heat; the temperature of the steam is irrelevant to the sign.
        - |
          Condensation is the reverse process, so its ΔH is −40.7 kJ/mol.
        - |
          A positive ΔH means heat is absorbed, not released.
        - |
          Correct. Vaporisation absorbs 40.7 kJ/mol (ΔH > 0), and reversing the equation reverses the sign, so condensation releases the same amount.
      answer: 3
      explanation: |
        Review of 5.5: phase changes are the simplest endothermic and exothermic processes, and reversing one flips the sign of ΔH.

    - slug: chem-u07-w25-q11
      type: multiple_choice
      topic_code: "4.6"
      source: "NIST Chemistry WebBook (enthalpy of combustion of methane)"
      points: 1
      prompt: |
        CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(l), ΔH = −890 kJ. How much heat is released when 8.00 g of methane (16.04 g/mol) burns?
      options:
        - "444 kJ"
        - "7,120 kJ"
        - "890 kJ"
        - "111 kJ"
      option_explanations:
        - |
          Correct. 8.00 ÷ 16.04 = 0.499 mol; 0.499 × 890 = 444 kJ released.
        - |
          7,120 kJ multiplies grams by ΔH without converting to moles.
        - |
          890 kJ is for one full mole (16.04 g), twice the mass given.
        - |
          111 kJ would be a quarter of a mole, 4.01 g of methane.
      answer: 0
      explanation: |
        Review of 4.6: grams → moles → the equation's ratio, with ΔH treated like a product with a coefficient.

    # ---- Select all
    - slug: chem-u07-w25-q12
      type: multi_select
      topic_code: "7.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which processes are exothermic? Select all that apply.
      options:
        - "Burning propane in a camping stove"
        - "Ice melting in a glass"
        - "Water vapour condensing on a cold window"
        - "An instant cold pack activating as ammonium nitrate dissolves"
        - "Hydrochloric acid neutralising sodium hydroxide"
      option_explanations:
        - |
          Correct. Combustion releases about 2,220 kJ per mole of propane.
        - |
          Melting absorbs the heat of fusion from the surroundings; it is endothermic.
        - |
          Correct. Condensation releases the heat of vaporisation; the window warms slightly.
        - |
          The pack gets cold because dissolving ammonium nitrate absorbs heat (+26 kJ/mol): endothermic.
        - |
          Correct. Neutralisation releases about 57 kJ per mole of water formed.
      answer: [0, 2, 4]

    - slug: chem-u07-w25-q13
      type: multi_select
      topic_code: "3.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about covalent bonds and energy are correct? Select all that apply.
      options:
        - "Breaking a covalent bond requires an input of energy."
        - "Forming a covalent bond releases energy."
        - "A stronger bond releases more energy when it forms."
        - "Energy is stored in bonds and released when they break."
        - "A reaction is exothermic when the bonds broken are stronger than the bonds formed."
      option_explanations:
        - |
          Correct. The shared electrons hold the atoms together, and pulling them apart costs energy.
        - |
          Correct. Atoms settling into a bond drop to lower potential energy and the difference leaves as heat.
        - |
          Correct. Bond energy is the same quantity in both directions: the energy to break a bond equals the energy released on forming it.
        - |
          This common phrase is backwards: breaking bonds absorbs energy; the release comes from forming new, stronger bonds.
        - |
          If the broken bonds were stronger, more energy would be absorbed than released and the reaction would be endothermic.
      answer: [0, 1, 2]
      explanation: |
        Review of 3.3: bond energy underlies every ΔH; the "energy stored in bonds" slogan is the error to unlearn.

    - slug: chem-u07-w25-q14
      type: true_false
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: an exothermic reaction can still need an input of energy to get started.
      answer: true
      explanation: |
        True. Exothermic describes the overall energy change (products lower than reactants), not the path. Most exothermic reactions, such as burning paper, need an initial push over an activation energy barrier before they release energy.

    - slug: chem-u07-w25-q15
      type: true_false
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: the joule is the SI unit of energy, and one calorie equals 4.184 joules.
      answer: true
      explanation: |
        True. Review of unit 1: the joule (J) is the SI unit of energy, and the thermochemical calorie is defined as exactly 4.184 J. The food "Calorie" is a kilocalorie, 4,184 J.

    - slug: chem-u07-w25-q16
      type: fill_blank
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A reaction that releases energy to its surroundings, so that ΔH is negative, is called ____.
      answer:
        - "exothermic"
        - "an exothermic reaction"
      explanation: |
        Exothermic: heat flows out of the system, the surroundings warm, and ΔH < 0.

    - slug: chem-u07-w25-q17
      type: fill_blank
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A 25.0 mL sample of 2.00 M HCl contains ____ mol of HCl. (Give three significant figures.)
      answer:
        - "0.0500"
        - "0.050"
        - "0.05"
        - "5.00 × 10⁻²"
        - "5.00 x 10^-2"
      explanation: |
