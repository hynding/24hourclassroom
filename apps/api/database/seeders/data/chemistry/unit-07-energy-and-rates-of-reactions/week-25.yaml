      points: 3
      prompt: |
        A cold pack contains solid ammonium nitrate and a pouch of water. Squeezing the pack bursts the pouch, the salt dissolves, and the pack becomes cold.
        (a) Is the dissolving process exothermic or endothermic? State the sign of ΔH.
        (b) Identify the system and the surroundings in this situation.
        (c) Describe how the potential energy of the system changes as the salt dissolves, and where the energy comes from.
      answer: |
        (a) Endothermic; ΔH is positive. (b) The system is the ammonium nitrate and water (the dissolving process); the surroundings are the pack's plastic, the air and the hand or injured limb touching it. (c) The potential energy of the system rises as the ionic lattice is pulled apart and the ions are hydrated: more energy is absorbed breaking the lattice than is released when water surrounds the ions. The energy is drawn from the thermal energy of the surroundings, which is why they cool.
      explanation: |
        1 point for (a) endothermic with ΔH > 0. 1 point for (b) correctly naming the dissolving salt and water as the system and the pack, air and skin as surroundings. 1 point for (c) potential energy of the system increases and the energy comes from the surroundings' thermal energy (the surroundings cool). No credit for saying the cold "flows into" the pack; heat flows from the warm surroundings into the system.

