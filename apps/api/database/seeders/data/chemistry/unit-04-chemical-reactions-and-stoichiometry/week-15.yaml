    # ---- Short answer
    - slug: chem-u04-w15-q23
      type: short_answer
      topic_code: "4.6"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 3
      prompt: |
        Zinc reacts with hydrochloric acid: Zn + 2 HCl → ZnCl₂ + H₂. A student uses 13.08 g of zinc with excess acid. (Zn 65.38, HCl 36.46, ZnCl₂ 136.28, H₂ 2.016 g/mol.)

        (a) Calculate the mass of hydrogen gas produced, showing each leg of the calculation.
        (b) Calculate the mass of hydrochloric acid that reacts.
        (c) Calculate the mass of zinc chloride formed and show that mass is conserved.
      answer: |
        (a) 13.08 g ÷ 65.38 g/mol = 0.2001 mol Zn × (1 mol H₂ ÷ 1 mol Zn) = 0.2001 mol H₂ × 2.016 g/mol = 0.403 g H₂.
        (b) 0.2001 mol Zn × (2 mol HCl ÷ 1 mol Zn) = 0.4002 mol HCl × 36.46 g/mol = 14.59 g HCl.
        (c) 0.2001 mol ZnCl₂ × 136.28 g/mol = 27.27 g. Reactants: 13.08 + 14.59 = 27.67 g; products: 27.27 + 0.403 = 27.67 g. Equal.
      explanation: |
        Scoring: (a) 1 point for 0.403 g with moles of Zn shown (accept 0.40 g). (b) 1 point for 14.6 g using the 2 : 1 ratio. (c) 1 point for 27.3 g ZnCl₂ and a conservation check in which reactant and product totals agree within rounding.

    - slug: chem-u04-w15-q24
      type: short_answer
      topic_code: "4.6"
      source: "general knowledge"
      points: 3
      prompt: |
        A student is asked how many grams of CO₂ form when 25.0 g of glucose, C₆H₁₂O₆ (180.16 g/mol), is burned: C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O. The student writes: 25.0 g ÷ 180.16 = 0.139 mol; 0.139 × 44.01 = 6.11 g CO₂.

        (a) Identify the step the student left out and explain why it matters.
        (b) Give the correct mass of CO₂.
        (c) Without further calculation, explain whether the mass of water formed is greater than, less than or equal to the mass of CO₂, and why.
      answer: |
        (a) The mole ratio was skipped: 0.139 mol of glucose is not 0.139 mol of CO₂. Each glucose molecule yields six CO₂, so the moles of CO₂ are 6 × 0.139 = 0.833 mol. Without that step the answer is six times too small.
        (b) 0.833 mol × 44.01 g/mol = 36.7 g CO₂.
        (c) Less. The same number of moles of water forms (6 : 6 ratio), but water's molar mass (18.02) is less than half of CO₂'s (44.01), so the water weighs less (about 15.0 g).
      explanation: |
        Scoring: (a) 1 point for identifying the missing mole ratio and the factor of 6. (b) 1 point for 36.7 g (accept 36.6–36.8). (c) 1 point for "less" with the reasoning that equal moles but a smaller molar mass give a smaller mass.

    # ---- Long answer
    - slug: chem-u04-w15-q25
      type: long_answer
      topic_code: "4.6"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 6
      prompt: |
        An airbag inflates when sodium azide decomposes: 2 NaN₃(s) → 2 Na(s) + 3 N₂(g). A particular airbag contains 65.0 g of sodium azide (NaN₃ 65.02 g/mol; N₂ 28.02 g/mol; Na 22.99 g/mol). Write a full analysis that (1) finds the moles of sodium azide present; (2) calculates the mass of nitrogen gas produced, showing the mole ratio and every unit; (3) calculates the mass of sodium metal produced; (4) shows that your results obey conservation of mass; and (5) explains, using the mole ratio, why a design that doubled the nitrogen output would need exactly twice the sodium azide, and why a student's claim that "65.0 g of azide gives 65.0 g of nitrogen" cannot be right.
      answer: |
        (1) 65.0 g ÷ 65.02 g/mol = 1.00 mol NaN₃.
        (2) 1.00 mol NaN₃ × (3 mol N₂ ÷ 2 mol NaN₃) = 1.50 mol N₂ × 28.02 g/mol = 42.0 g N₂.
        (3) 1.00 mol NaN₃ × (2 mol Na ÷ 2 mol NaN₃) = 1.00 mol Na × 22.99 g/mol = 23.0 g Na.
        (4) Products: 42.0 + 23.0 = 65.0 g, equal to the 65.0 g of sodium azide that decomposed. Every atom of sodium and nitrogen is accounted for.
        (5) The mole ratio is fixed at 3 mol N₂ per 2 mol NaN₃, so the nitrogen produced is directly proportional to the azide used: twice the azide gives twice the moles and twice the mass of nitrogen. The claim fails because not all of the azide's mass is nitrogen; 23.0 g of it is sodium, which stays behind as metal, so only 42.0 g (the nitrogen fraction, 64.6%) can appear as gas.
      explanation: |
        Scoring (6 points). 1 point: 1.00 mol NaN₃. 2 points: 42.0 g N₂ with the 3 : 2 ratio and units shown (1 point if the ratio is right but arithmetic slips). 1 point: 23.0 g Na. 1 point: conservation check 42.0 + 23.0 = 65.0 g. 1 point: proportionality through the fixed mole ratio and the explanation that sodium's mass remains as metal, so the gas mass must be less than the azide mass. Deduct for applying the ratio to grams or for using 14.01 g/mol for N₂.
