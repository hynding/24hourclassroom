week: 15
unit: 4
title: "Stoichiometry: From Moles of One Thing to Grams of Another"
topics: ["4.6"]
guide: guides/week-15.md
guide_description: |
  The coefficients of a balanced equation as a mole ratio, mole-to-mole conversions, and the three-leg
  mass-to-mass route (grams of given to moles, mole ratio, moles of wanted to grams) written as one chain of
  cancelling units. Worked examples on ammonia synthesis, aluminum displacing copper, calcium carbonate
  decomposition, sodium and chlorine, and iron from its ore, each checked against conservation of mass; the
  direction and conservation checks; the grams-times-ratio trap.
flashcards:
  - front: Stoichiometry → what the word means
    back: |
      The quantitative relationships among reactants and products in a reaction: how much of one substance reacts with or produces how much of another.
    topic_code: "4.6"
  - front: Mole ratio → where it comes from and an example
    back: |
      Two coefficients of a balanced equation, written as a fraction. From N₂ + 3 H₂ → 2 NH₃: 2 mol NH₃ ÷ 3 mol H₂, 3 mol H₂ ÷ 1 mol N₂, and so on.
    topic_code: "4.6"
  - front: Why the mole ratio never limits significant figures
    back: |
      It comes from counting atoms, so it is exact. The measured mass of the given substance sets the significant figures of the answer.
    topic_code: "4.6"
  - front: Mole-to-mole conversion → the single step
    back: |
      Moles of given × (mol wanted ÷ mol given) = moles of wanted. 6.00 mol H₂ × (2 mol NH₃ ÷ 3 mol H₂) = 4.00 mol NH₃.
    topic_code: "4.6"
  - front: Choosing which way up to write the mole ratio
    back: |
      Put the given substance in the denominator so its unit cancels and the wanted substance's unit remains.
    topic_code: "4.6"
  - front: The three legs of a mass-to-mass problem
    back: |
      1. Grams of given ÷ molar mass of given = moles of given. 2. × mole ratio = moles of wanted. 3. × molar mass of wanted = grams of wanted.
    topic_code: "4.6"
  - front: The one step where the chemical equation is used
    back: |
      The mole ratio (leg 2). Legs 1 and 3 are week 14's grams-moles conversions and use only molar masses.
    topic_code: "4.6"
  - front: Mass-to-mass as a single chain of factors
    back: |
      g given × (1 mol ÷ M given) × (mol wanted ÷ mol given) × (M wanted ÷ 1 mol) = g wanted, with every unit cancelling left to right.
    topic_code: "4.6"
  - front: Copper from 5.40 g of aluminum (2 Al + 3 CuCl₂ → 2 AlCl₃ + 3 Cu)
    back: |
      5.40 ÷ 26.98 = 0.200 mol Al × (3 ÷ 2) = 0.300 mol Cu × 63.55 = 19.1 g Cu.
    topic_code: "4.6"
  - front: CO₂ from 50.0 g of CaCO₃ decomposing
    back: |
      50.0 ÷ 100.09 = 0.500 mol CaCO₃ → 0.500 mol CO₂ × 44.01 = 22.0 g. The CaO left is 28.0 g; 22.0 + 28.0 = 50.0 g.
    topic_code: "4.6"
  - front: Chlorine needed for 11.5 g of sodium (2 Na + Cl₂ → 2 NaCl)
    back: |
      11.5 ÷ 22.99 = 0.500 mol Na × (1 ÷ 2) = 0.250 mol Cl₂ × 70.90 = 17.7 g Cl₂. NaCl formed: 29.2 g = 11.5 + 17.7.
    topic_code: "4.6"
  - front: Iron from 1.000 kg of Fe₂O₃ (Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂)
    back: |
      1000 ÷ 159.70 = 6.26 mol Fe₂O₃ × 2 = 12.5 mol Fe × 55.85 = 699 g, the same 69.9% that percent composition gives.
    topic_code: "4.6"
  - front: Water from 8.02 g of methane burning (CH₄ + 2 O₂ → CO₂ + 2 H₂O)
    back: |
      8.02 ÷ 16.04 = 0.500 mol CH₄ × 2 = 1.00 mol H₂O × 18.02 = 18.0 g.
    topic_code: "4.6"
  - front: Hydrogen from 13.08 g of zinc in acid (Zn + 2 HCl → ZnCl₂ + H₂)
    back: |
      13.08 ÷ 65.38 = 0.200 mol Zn → 0.200 mol H₂ × 2.016 = 0.403 g H₂. HCl needed: 0.400 mol × 36.46 = 14.6 g.
    topic_code: "4.6"
  - front: Glucose from 88.0 g of CO₂ in photosynthesis
    back: |
      6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂. 88.0 ÷ 44.01 = 2.00 mol CO₂ × (1 ÷ 6) = 0.333 mol glucose × 180.16 = 60.1 g.
    topic_code: "4.6"
  - front: Oxygen needed to burn 0.250 mol of propane
    back: |
      C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O. 0.250 × 5 = 1.25 mol O₂ (40.0 g).
    topic_code: "4.6"
  - front: The grams-times-ratio trap
    back: |
      5.40 g Al × (3 ÷ 2) = 8.10 g is wrong. Coefficients count particles, not grams; masses of different substances cannot be compared until converted to moles.
    topic_code: "4.6"
  - front: The direction check on a stoichiometry answer
    back: |
      More moles of the wanted substance if its coefficient is larger; more grams per mole if its molar mass is larger. 5.40 g Al gives 19.1 g Cu because copper is heavier and the ratio is 3 : 2.
    topic_code: "4.6"
  - front: The conservation check on a stoichiometry answer
    back: |
      Mass of reactants consumed = mass of products formed. 11.5 g Na + 17.7 g Cl₂ = 29.2 g NaCl. If the sums disagree, a leg of the calculation is wrong.
    topic_code: "4.6"
  - front: Why an unbalanced equation ruins a stoichiometry problem
    back: |
      The mole ratio is read from the coefficients; wrong coefficients give a wrong ratio, and the error carries through to the final mass.
    topic_code: "4.6"
  - front: Molar mass of a diatomic element in stoichiometry
    back: |
      Use the molecule: Cl₂ is 70.90 g/mol, O₂ 32.00, H₂ 2.016, N₂ 28.02. The coefficient in the equation refers to the molecule.
    topic_code: "4.6"
  - front: 'Labelling a problem: the "given" and the "wanted"'
    back: |
      Given: the substance whose amount is stated. Wanted: the substance whose amount is asked for. Write both, with units, before choosing the ratio.
    topic_code: "4.6"
  - front: Reactant-needed problems → the same route
    back: |
      Converting to a reactant uses the same three legs; the mole ratio is simply between two reactants (1 mol Cl₂ ÷ 2 mol Na).
    topic_code: "4.6"
  - front: Significant figures in a mass-to-mass answer
    back: |
      Set by the measured mass given (5.40 g → three figures). Molar masses carry four or more figures and the mole ratio is exact.
    topic_code: "4.6"
  - front: Excess reactant → meaning in this week's problems
    back: |
      "Excess" means there is more than enough of that reactant, so the other reactant's amount alone determines the product. Week 16 handles cases where neither is in excess by assumption.
    topic_code: "4.6"
  - front: Mass-to-moles-of-another-substance (two-leg) problems
    back: |
      Stop after leg 2 when moles are wanted: 50.0 g CaCO₃ ÷ 100.09 = 0.500 mol → 0.500 mol CO₂. Read the unit the question asks for.
    topic_code: "4.6"
  - front: Moles-to-mass-of-another-substance (two-leg) problems
    back: |
      Skip leg 1 when moles are given: 0.300 mol Cu × 63.55 = 19.1 g. Only the legs that change units are needed.
    topic_code: "4.6"
  - front: Checking that a ratio is set up correctly
    back: |
      Write the units and cancel: mol Al × (mol Cu ÷ mol Al) leaves mol Cu. If mol Al does not cancel, the ratio is upside down.
    topic_code: "4.6"
  - front: Iron(III) oxide from 10.0 g of rusting iron (4 Fe + 3 O₂ → 2 Fe₂O₃)
    back: |
      10.0 ÷ 55.85 = 0.179 mol Fe × (2 ÷ 4) = 0.0895 mol Fe₂O₃ × 159.70 = 14.3 g. The extra 4.3 g is oxygen from the air.
    topic_code: "4.6"
  - front: Why the percent-composition shortcut works only sometimes
    back: |
      50.0 g CaCO₃ × (44.01 ÷ 100.09) gives 22.0 g CO₂ because the mole ratio is 1 : 1. With any other ratio the coefficients must be included; the three-leg route always works.
    topic_code: "4.6"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 4.6: mole ratios, mole-to-mole and mass-to-mass
    stoichiometry), with about a third reviewing earlier weeks (molar mass, balancing, predicting products,
    conservation of mass, significant figures and compound names). Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: ammonia synthesis (4.6)
    - slug: chem-u04-w15-q01
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Ammonia is made by N₂(g) + 3 H₂(g) → 2 NH₃(g). Molar masses: N₂ 28.02 g/mol, H₂ 2.016 g/mol, NH₃ 17.03 g/mol. A reactor is charged with 2.00 mol of nitrogen and excess hydrogen.
      prompt: |
        How many moles of ammonia can form?
      options:
        - "1.00 mol"
        - "2.00 mol"
        - "3.00 mol"
        - "4.00 mol"
      option_explanations:
        - |
          1.00 would follow from an inverted ratio (1 mol N₂ ÷ 2 mol NH₃); nitrogen must cancel, not ammonia.
        - |
          A 1 : 1 ratio ignores the coefficient 2 on NH₃; each N₂ molecule supplies two nitrogen atoms, hence two NH₃.
        - |
          3.00 uses the hydrogen coefficient; the ratio needed is between N₂ and NH₃.
        - |
          Correct. 2.00 mol N₂ × (2 mol NH₃ ÷ 1 mol N₂) = 4.00 mol NH₃.
      answer: 3

    - slug: chem-u04-w15-q02
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Ammonia is made by N₂(g) + 3 H₂(g) → 2 NH₃(g). Molar masses: N₂ 28.02 g/mol, H₂ 2.016 g/mol, NH₃ 17.03 g/mol. A reactor is charged with 2.00 mol of nitrogen and excess hydrogen.
      prompt: |
        What mass of hydrogen is consumed?
      options:
        - "6.05 g"
        - "12.1 g"
        - "4.03 g"
        - "2.02 g"
      option_explanations:
        - |
          6.05 g is the mass of 3.00 mol H₂, which would be the amount for 1.00 mol N₂; the reactor holds 2.00 mol.
        - |
          Correct. 2.00 mol N₂ × (3 mol H₂ ÷ 1 mol N₂) = 6.00 mol H₂ × 2.016 g/mol = 12.1 g.
        - |
          4.03 g is 2.00 mol of H₂, a 1 : 1 ratio; three H₂ are needed for each N₂.
        - |
          2.02 g is a single mole of H₂; both the ratio and the amount of nitrogen have been ignored.
      answer: 1

    - slug: chem-u04-w15-q03
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Ammonia is made by N₂(g) + 3 H₂(g) → 2 NH₃(g). Molar masses: N₂ 28.02 g/mol, H₂ 2.016 g/mol, NH₃ 17.03 g/mol. A reactor is charged with 2.00 mol of nitrogen and excess hydrogen.
      prompt: |
        What mass of ammonia is produced, and how does it compare with the total mass of nitrogen and hydrogen consumed?
      options:
        - "68.1 g; equal to 56.0 g of N₂ plus 12.1 g of H₂, as conservation of mass requires"
        - "68.1 g; greater than the reactants' mass because ammonia has three hydrogens"
        - "34.1 g; equal to the mass of nitrogen consumed"
        - "136 g; double the reactants' mass because two moles of ammonia form"
      option_explanations:
        - |
          Correct. 4.00 mol NH₃ × 17.03 g/mol = 68.1 g, and 2.00 mol N₂ (56.0 g) + 6.00 mol H₂ (12.1 g) = 68.1 g.
        - |
          Mass is conserved in every reaction; products never weigh more than the reactants consumed.
        - |
          34.1 g is the mass of only 2.00 mol of ammonia, and the product must also contain the hydrogen's mass.
        - |
          Mass cannot double; the coefficient 2 counts molecules, not a multiplication of mass.
      answer: 0

    # ---- Individual multiple choice (4.6)
    - slug: chem-u04-w15-q04
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which conversion factor converts moles of propane to moles of carbon dioxide for C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O?
      options:
        - "1 mol C₃H₈ ÷ 3 mol CO₂"
        - "5 mol O₂ ÷ 1 mol C₃H₈"
        - "3 mol CO₂ ÷ 1 mol C₃H₈"
        - "44.01 g CO₂ ÷ 1 mol CO₂"
      option_explanations:
        - |
          This is the right pair of substances but upside down; multiplying by it would leave mol C₃H₈² ÷ mol CO₂.
        - |
          This ratio links propane to oxygen, not to carbon dioxide.
        - |
          Correct. The given (mol C₃H₈) is in the denominator and cancels; the wanted (mol CO₂) remains.
        - |
          This is the molar mass of CO₂, used in the final leg to reach grams, not the mole ratio.
      answer: 2

    - slug: chem-u04-w15-q05
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A student calculates the mass of copper from 5.40 g of aluminum (2 Al + 3 CuCl₂ → 2 AlCl₃ + 3 Cu) as 5.40 g × (3 ÷ 2) = 8.10 g. What is the error?
      options:
        - "The ratio should be 2 ÷ 3"
        - "The mole ratio was applied to grams instead of moles"
        - "The molar mass of CuCl₂ should have been used"
        - "Nothing; 8.10 g is correct"
      option_explanations:
        - |
          Inverting the ratio would give 3.60 g, still wrong, because the ratio cannot act on grams at all.
        - |
          Correct. Coefficients count particles. The mass must first become moles (5.40 ÷ 26.98 = 0.200 mol Al), then 0.300 mol Cu, then 19.1 g.
        - |
          CuCl₂ is neither the given nor the wanted substance; its molar mass is not needed here.
        - |
          The correct answer is 19.1 g; copper atoms are far heavier than aluminum atoms.
      answer: 1

    - slug: chem-u04-w15-q06
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        What mass of oxygen is required to burn 8.02 g of methane completely? CH₄ + 2 O₂ → CO₂ + 2 H₂O (CH₄ 16.04 g/mol, O₂ 32.00 g/mol).
      options:
        - "8.00 g"
        - "16.0 g"
        - "64.0 g"
        - "32.0 g"
      option_explanations:
        - |
          8.00 g would be 0.250 mol O₂, half a mole per mole of methane; the ratio is 2 : 1 the other way.
        - |
          16.0 g is 0.500 mol O₂, a 1 : 1 ratio; two O₂ are needed per CH₄.
        - |
          64.0 g is 2.00 mol O₂, which would burn a full mole of methane, but only 0.500 mol is present.
        - |
          Correct. 8.02 ÷ 16.04 = 0.500 mol CH₄ × (2 mol O₂ ÷ 1 mol CH₄) = 1.00 mol O₂ × 32.00 = 32.0 g.
      answer: 3

    - slug: chem-u04-w15-q07
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        In 4 Fe + 3 O₂ → 2 Fe₂O₃, how many moles of iron(III) oxide form from 0.600 mol of iron with excess oxygen?
      options:
        - "0.300 mol"
        - "1.20 mol"
        - "0.450 mol"
        - "0.600 mol"
      option_explanations:
        - |
          Correct. 0.600 mol Fe × (2 mol Fe₂O₃ ÷ 4 mol Fe) = 0.300 mol; two iron atoms go into each formula unit.
        - |
          1.20 mol is the inverted ratio (4 ÷ 2); more product than iron atoms is impossible when each unit holds two irons.
        - |
          0.450 mol uses the oxygen coefficient (3 ÷ 4); the ratio needed is Fe to Fe₂O₃.
        - |
          A 1 : 1 ratio ignores the subscripts: each Fe₂O₃ contains two iron atoms.
      answer: 0

    - slug: chem-u04-w15-q08
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which sequence of steps converts a mass of zinc to a mass of hydrogen gas produced in Zn + 2 HCl → ZnCl₂ + H₂?
      options:
        - "g Zn × mole ratio × molar mass of H₂"
        - "g Zn ÷ molar mass of H₂ × mole ratio × molar mass of Zn"
        - "g Zn ÷ molar mass of Zn × mole ratio × molar mass of H₂"
        - "g Zn × molar mass of Zn × mole ratio ÷ molar mass of H₂"
      option_explanations:
        - |
          Grams must be converted to moles before the mole ratio can be applied.
        - |
          The molar masses are swapped: the given is divided by its own molar mass, the wanted multiplied by its own.
        - |
          Correct. Grams of given to moles (÷ 65.38), mole ratio (1 mol H₂ ÷ 1 mol Zn), moles of wanted to grams (× 2.016).
        - |
          Multiplying grams by a molar mass gives g²/mol; the first leg must divide, the last must multiply.
      answer: 2

    - slug: chem-u04-w15-q09
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Using 50.0 g CaCO₃ × (44.01 ÷ 100.09) = 22.0 g CO₂ gives the right answer for CaCO₃ → CaO + CO₂. For which reaction would the same shortcut (grams × ratio of molar masses) give a wrong answer?
      options:
        - "CaO + CO₂ → CaCO₃, finding CaCO₃ from CO₂"
        - "2 KClO₃ → 2 KCl + 3 O₂, finding O₂ from KClO₃"
        - "Zn + CuSO₄ → ZnSO₄ + Cu, finding Cu from Zn"
        - "HgO decomposing to Hg and O₂, finding Hg from 2 HgO → 2 Hg + O₂"
      option_explanations:
        - |
          The ratio of CO₂ to CaCO₃ is 1 : 1, so the shortcut happens to work.
        - |
          Correct. The mole ratio is 3 mol O₂ per 2 mol KClO₃, not 1 : 1; omitting the coefficients loses a factor of 3/2 and the answer is wrong.
        - |
          Zinc and copper are 1 : 1 in this equation, so the shortcut works.
        - |
          HgO and Hg are 2 : 2, which is 1 : 1, so the shortcut works.
      answer: 1

    - slug: chem-u04-w15-q10
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student measures 5.40 g of aluminum and calculates 19.079 g of copper. How should the answer be reported, and why?
      options:
        - "19.079 g, because the calculator gave five figures"
        - "19 g, because the mole ratio 3 : 2 has one significant figure"
        - "19.08 g, because the molar masses have four significant figures"
        - "19.1 g, because the measured mass has three significant figures"
      option_explanations:
        - |
          A calculator's display does not set precision; the measurement does.
        - |
          The mole ratio is an exact count from the equation and never limits significant figures.
        - |
          The molar masses are known more precisely than the measurement, so they are not the limiting value.
        - |
          Correct. The least precise measured quantity, 5.40 g with three significant figures, limits the answer to three.
      answer: 3

    # ---- Spiral multiple choice (4.4, 4.3, 2.1)
    - slug: chem-u04-w15-q11
      type: multiple_choice
      topic_code: "4.4"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      prompt: |
        Before any stoichiometry on 2 Na + Cl₂ → 2 NaCl, a student needs the molar mass of chlorine gas. What value should be used?
      options:
        - "70.90 g/mol"
        - "35.45 g/mol"
        - "17.73 g/mol"
        - "58.44 g/mol"
      option_explanations:
        - |
          Correct. The reactant is the Cl₂ molecule: 2 × 35.45 = 70.90 g/mol. The coefficient 1 refers to one mole of molecules.
        - |
          35.45 g/mol is the molar mass of chlorine atoms; the equation is written with Cl₂ molecules.
        - |
          Half the atomic mass corresponds to nothing in the equation.
        - |
          58.44 g/mol is the molar mass of sodium chloride, the product.
      answer: 0

    - slug: chem-u04-w15-q12
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A student plans to make copper metal by adding silver to copper(II) sulfate solution and uses stoichiometry to predict the mass of copper. What is wrong with the plan?
      options:
        - "The mole ratio should be 2 : 1, not 1 : 1"
        - "Silver is below copper in the activity series, so no reaction occurs and no copper forms"
        - "Copper(II) sulfate is insoluble, so the silver cannot reach it"
        - "The reaction produces copper(I) sulfate instead"
      option_explanations:
        - |
          A mole ratio exists only for a reaction that happens; the problem is the reaction itself.
        - |
          Correct. Only a metal above copper (such as zinc or iron) can displace it; silver is less active, and stoichiometry cannot predict a product from a reaction that does not occur.
        - |
          Copper(II) sulfate is a soluble sulfate (the blue solution); solubility is not the issue.
        - |
          No copper compound of any charge forms, because silver cannot take copper's place.
      answer: 1

    - slug: chem-u04-w15-q13
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A stoichiometry calculation for 2 Na + Cl₂ → 2 NaCl gives 11.5 g Na, 17.7 g Cl₂ and 29.2 g NaCl. Which law do these three numbers illustrate, and how?
      options:
        - "Definite proportions, because the three masses are in a whole-number ratio"
        - "Multiple proportions, because sodium forms two chlorides"
        - "Conservation of mass, because 11.5 + 17.7 = 29.2"
        - "Avogadro's law, because equal masses contain equal numbers of atoms"
      option_explanations:
        - |
          Definite proportions concerns the fixed ratio within a compound, and the three masses are not in a whole-number ratio.
        - |
          Sodium forms only one chloride; multiple proportions compares two different compounds of the same elements.
        - |
          Correct. The mass of the reactants consumed equals the mass of the product formed; a correct stoichiometry result always passes this check.
        - |
          Equal masses of different elements contain different numbers of atoms; and the statement is not Avogadro's law.
      answer: 2

    # ---- Select all that apply
    - slug: chem-u04-w15-q14
      type: multi_select
      topic_code: "4.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        For the reaction 2 H₂ + O₂ → 2 H₂O, which statements are correct? Select all that apply.
      options:
        - "2 mol of H₂ react with 1 mol of O₂"
        - "2 g of H₂ react with 1 g of O₂"
        - "0.50 mol of O₂ produces 1.0 mol of H₂O"
        - "4.032 g of H₂ react with 32.00 g of O₂ to give 36.03 g of H₂O"
        - "1 mol of H₂ produces 2 mol of H₂O"
      option_explanations:
        - |
          Correct: this is the mole ratio read directly from the coefficients.
        - |
          Wrong: coefficients count moles, not grams; 2 mol H₂ is 4.032 g and 1 mol O₂ is 32.00 g.
        - |
          Correct: 0.50 mol O₂ × (2 mol H₂O ÷ 1 mol O₂) = 1.0 mol H₂O.
        - |
          Correct: these are the masses of 2 mol, 1 mol and 2 mol respectively, and 4.032 + 32.00 = 36.03.
        - |
          Wrong: the H₂ to H₂O ratio is 2 : 2, so 1 mol H₂ gives 1 mol H₂O.
      answer: [0, 2, 3]
      explanation: |
        Coefficients give mole ratios (and, through molar masses, mass relationships that conserve mass); they are never gram ratios directly.

    - slug: chem-u04-w15-q15
      type: multi_select
      topic_code: "4.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are valid conversion factors for the reaction C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O? Select all that apply.
      options:
        - "5 mol O₂ ÷ 1 mol C₃H₈"
        - "4 mol H₂O ÷ 3 mol CO₂"
        - "44.1 g C₃H₈ ÷ 1 mol C₃H₈"
        - "3 g CO₂ ÷ 1 g C₃H₈"
        - "5 mol O₂ ÷ 4 mol CO₂"
      option_explanations:
        - |
          Valid: the coefficients of oxygen and propane.
        - |
          Valid: the coefficients of water and carbon dioxide; products can be related to each other.
        - |
          Valid: the molar mass of propane (3 × 12.01 + 8 × 1.008 = 44.1), used in the first leg.
        - |
          Invalid: coefficients are not gram ratios; the mass of CO₂ per gram of propane is 3 × 44.01 ÷ 44.1, about 2.99, found only through moles.
        - |
          Invalid: the coefficient of CO₂ is 3, not 4; this mixes up the two products.
      answer: [0, 1, 2]
      explanation: |
        A mole ratio pairs two coefficients exactly as written; a molar mass pairs grams with moles of one substance. Nothing relates grams of one substance to grams of another directly.

