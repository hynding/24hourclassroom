      prompt: |
        A bottle contains 15.96 g of copper(II) sulfate, CuSO₄ (Cu 63.55, S 32.06, O 16.00).

        (a) Calculate the molar mass of CuSO₄.
        (b) Calculate the number of moles in the bottle.
        (c) Calculate the number of formula units in the bottle, and the number of oxygen atoms.
      answer: |
        (a) 63.55 + 32.06 + 4(16.00) = 159.61 g/mol.
        (b) 15.96 g ÷ 159.61 g/mol = 0.1000 mol.
        (c) 0.1000 mol × 6.022 × 10²³ = 6.022 × 10²² formula units; each contains 4 O atoms, so 2.409 × 10²³ oxygen atoms.
      explanation: |
        Scoring: (a) 1 point for 159.61 g/mol (accept 159.6). (b) 1 point for 0.1000 mol with the division shown. (c) 1 point for 6.02 × 10²² formula units and 2.41 × 10²³ O atoms (the factor of 4 must appear).

    - slug: chem-u04-w14-q24
      type: short_answer
      topic_code: "4.5"
      source: "general knowledge"
      points: 3
      prompt: |
        A compound of carbon and hydrogen is 85.6% carbon by mass, and its molar mass is 42.1 g/mol.

        (a) Find the empirical formula, showing the mole calculation.
        (b) Find the molecular formula.
        (c) Explain why two different compounds can share the empirical formula you found in (a).
      answer: |
        (a) Per 100 g: C 85.6 ÷ 12.01 = 7.13 mol; H 14.4 ÷ 1.008 = 14.3 mol. Divide by 7.13: C 1, H 2.00. Empirical formula CH₂.
        (b) CH₂ weighs 14.03 g/mol; n = 42.1 ÷ 14.03 = 3.00. Molecular formula C₃H₆ (propene).
        (c) The empirical formula is only a ratio. C₂H₄, C₃H₆ and C₄H₈ all have one carbon for every two hydrogens but different numbers of atoms per molecule; the molar mass is needed to tell them apart.
      explanation: |
        Scoring: (a) 1 point for CH₂ with moles of each element shown. (b) 1 point for C₃H₆ via n = 3. (c) 1 point for explaining that the empirical formula fixes only the ratio and naming at least one other compound with the same ratio.

    # ---- Long answer
    - slug: chem-u04-w14-q25
      type: long_answer
      topic_code: "4.5"
      source: "general knowledge"
      points: 6
      prompt: |
        A student heats 3.22 g of a copper-oxygen compound in a stream of hydrogen, which removes all the oxygen as water; 2.86 g of pure copper remains. A second student does the same with a different copper-oxygen compound: 3.58 g of compound leaves 2.86 g of copper. Write a full analysis that (1) finds the mass of oxygen in each compound; (2) determines the empirical formula of each, showing the mole calculations (Cu 63.55, O 16.00); (3) names each compound using Unit 3's rules; (4) explains how these two results illustrate the law of multiple proportions from week 4; and (5) explains why an empirical formula is all that can be found for an ionic compound.
      answer: |
        (1) First compound: 3.22 − 2.86 = 0.36 g O. Second compound: 3.58 − 2.86 = 0.72 g O.
        (2) Copper in both: 2.86 ÷ 63.55 = 0.0450 mol. First: O 0.36 ÷ 16.00 = 0.0225 mol; Cu : O = 0.0450 : 0.0225 = 2 : 1 → Cu₂O. Second: O 0.72 ÷ 16.00 = 0.0450 mol; Cu : O = 1 : 1 → CuO.
        (3) Cu₂O: copper(I) oxide (each copper is 1+ to balance one O²⁻). CuO: copper(II) oxide.
        (4) For a fixed mass of copper (2.86 g), the masses of oxygen in the two compounds are 0.36 g and 0.72 g, a ratio of 1 : 2, a small whole number. That is the law of multiple proportions, and it follows from atoms combining in whole-number ratios: one oxygen per two copper atoms, or one per one.
        (5) Ionic compounds have no molecules; the crystal is a lattice in which the ions occur in the simplest ratio that cancels charge. There is no "actual molecule" whose atom count could differ from the ratio, so the empirical formula is the formula.
      explanation: |
        Scoring (6 points). 1 point: 0.36 g and 0.72 g of oxygen. 2 points: Cu₂O and CuO with moles shown (1 point if the ratios are right but the mole work is missing or has an arithmetic slip). 1 point: copper(I) oxide and copper(II) oxide with Roman numerals. 1 point: multiple proportions stated as the 1 : 2 oxygen mass ratio for a fixed copper mass, tied to whole-number atom ratios. 1 point: ionic compounds form lattices, not molecules, so only the simplest ratio exists. Deduct for giving formulas without reducing or for naming without Roman numerals.
