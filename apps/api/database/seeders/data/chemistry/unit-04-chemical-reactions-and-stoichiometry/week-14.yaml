week: 14
unit: 4
title: "The Mole, Molar Mass and Formulas from Data"
topics: ["4.4", "4.5"]
guide: guides/week-14.md
guide_description: |
  The mole as a counting unit (Avogadro's number), molar mass from the periodic table for elements and compounds,
  and the mole as the hub of every conversion between grams, moles and particles. Then percent composition from a
  formula, the empirical formula from percent composition or lab masses (percent to mass to moles to ratio, with
  the fraction-clearing step), and the molecular formula from the empirical formula and the molar mass. Worked
  examples on calcium carbonate, water, iron(III) oxide, fertilizers, magnesium oxide and glucose.
flashcards:
  - front: Mole → definition and the number it stands for
    back: |
      The amount of substance containing 6.022 × 10²³ particles (Avogadro's number), the number of atoms in exactly 12 g of carbon-12. A counting unit like a dozen, but enormous.
    topic_code: "4.4"
  - front: Why one mole of carbon has a mass of 12.01 g
    back: |
      Avogadro's number was chosen so that an element's atomic mass in u equals the mass of one mole in grams. Read the periodic table in g/mol.
    topic_code: "4.4"
  - front: Molar mass of a compound → how to compute it
    back: |
      Add the atomic masses of every atom in the formula, multiplying anything in parentheses by the subscript outside. Mg(NO₃)₂ = 24.31 + 2(14.01 + 48.00) = 148.33 g/mol.
    topic_code: "4.4"
  - front: Molar masses to recognise on sight (water, CO₂, NaCl, CaCO₃)
    back: |
      H₂O 18.02; CO₂ 44.01; NaCl 58.44; CaCO₃ 100.09 g/mol.
    topic_code: "4.4"
  - front: The mole as the hub → the two conversion factors
    back: |
      Molar mass (g/mol) links grams and moles; Avogadro's number (particles/mol) links moles and particles. There is no direct route from grams to particles.
    topic_code: "4.4"
  - front: Grams to moles → the operation
    back: |
      Divide by molar mass: mol = g ÷ (g/mol). 25.0 g CaCO₃ ÷ 100.09 g/mol = 0.250 mol.
    topic_code: "4.4"
  - front: Moles to grams → the operation
    back: |
      Multiply by molar mass: g = mol × (g/mol). 0.750 mol NaCl × 58.44 g/mol = 43.8 g.
    topic_code: "4.4"
  - front: Moles to particles → the operation
    back: |
      Multiply by 6.022 × 10²³: 0.500 mol H₂O × 6.022 × 10²³ = 3.01 × 10²³ molecules (and 3 × that many atoms).
    topic_code: "4.4"
  - front: Particles to grams → the route
    back: |
      Particles ÷ 6.022 × 10²³ = moles, then moles × molar mass = grams. 1.505 × 10²⁴ Fe atoms = 2.50 mol = 140 g.
    topic_code: "4.4"
  - front: Molar mass of an ionic compound refers to what
    back: |
      One mole of formula units (6.022 × 10²³ NaCl units), since ionic compounds have no molecules. For a molecular compound it is one mole of molecules.
    topic_code: "4.4"
  - front: Do equal moles mean equal masses?
    back: |
      No. One mole of CO₂ (44.01 g) and one mole of H₂ (2.016 g) contain the same number of molecules but very different masses. Moles count; grams weigh.
    topic_code: "4.4"
  - front: Sense of scale for one mole
    back: |
      A mole of water is 18 mL (a tablespoon); a mole of carbon is a small lump of charcoal; a mole of gold (197 g) is a cube about 2 cm on a side.
    topic_code: "4.4"
  - front: Unit check that catches the grams-moles mistake
    back: |
      Write the units: g × (mol/g) = mol; mol × (g/mol) = g. If the units do not cancel to what you want, you divided when you should have multiplied.
    topic_code: "4.4"
  - front: Percent composition → formula
    back: |
      Mass % of an element = (mass of that element in one mole of compound ÷ molar mass of compound) × 100%. The percents sum to 100.
    topic_code: "4.5"
  - front: Percent composition of water
    back: |
      H: 2.016 ÷ 18.02 = 11.19%; O: 16.00 ÷ 18.02 = 88.81%. The same in every sample (law of definite proportions).
    topic_code: "4.5"
  - front: Percent iron in iron(III) oxide
    back: |
      Fe₂O₃: 111.70 ÷ 159.70 × 100% = 69.94%. A tonne of pure hematite holds at most 699 kg of iron.
    topic_code: "4.5"
  - front: Comparing fertilizers by percent nitrogen
    back: |
      NH₄NO₃: 28.02 ÷ 80.05 = 35.00% N. Urea CO(NH₂)₂: 28.02 ÷ 60.06 = 46.65% N. Urea carries more nitrogen per gram.
    topic_code: "4.5"
  - front: Empirical formula → definition
    back: |
      The simplest whole-number ratio of atoms in a compound: CH₂O for glucose, NO₂ for N₂O₄, CH₃ for ethane. Ionic formulas are already empirical.
    topic_code: "4.5"
  - front: Four steps from percent composition to empirical formula
    back: |
      1. Take 100 g, so percents become grams. 2. Convert each to moles. 3. Divide all by the smallest. 4. Clear any fraction (×2 for .5, ×3 for .33 or .67, ×4 for .25).
    topic_code: "4.5"
  - front: Empirical formula of a compound 40.0% C, 6.7% H, 53.3% O
    back: |
      C 3.33 mol, H 6.65 mol, O 3.33 mol; divide by 3.33: C₁H₂O₁ → CH₂O.
    topic_code: "4.5"
  - front: Empirical formula from a magnesium burning lab (2.43 g Mg → 4.03 g product)
    back: |
      Oxygen = 4.03 − 2.43 = 1.60 g. Mg 2.43 ÷ 24.31 = 0.100 mol; O 1.60 ÷ 16.00 = 0.100 mol. 1 : 1 → MgO.
    topic_code: "4.5"
  - front: Empirical formula of an oxide 69.9% Fe, 30.1% O
    back: |
      Fe 1.25 mol, O 1.88 mol; divide by 1.25: Fe 1, O 1.50; double: Fe₂O₃.
    topic_code: "4.5"
  - front: Mole ratios that must be multiplied, not rounded
    back: |
      1.5 → ×2; 1.33 or 1.67 → ×3; 1.25 or 1.75 → ×4. Only ratios within about ±0.1 of a whole number are rounded.
    topic_code: "4.5"
  - front: Molecular formula → definition and relation to empirical
    back: |
      The actual atom count in one molecule; always a whole-number multiple n of the empirical formula. C₆H₁₂O₆ = 6 × CH₂O.
    topic_code: "4.5"
  - front: Finding n for the molecular formula
    back: |
      n = molar mass of compound ÷ molar mass of empirical formula. CH₂O is 30.03 g/mol; glucose is 180 g/mol; n = 6.
    topic_code: "4.5"
  - front: Three compounds sharing the empirical formula CH₂O
    back: |
      Formaldehyde CH₂O (M 30), acetic acid C₂H₄O₂ (M 60), glucose C₆H₁₂O₆ (M 180). Same ratio, different molecules.
    topic_code: "4.5"
  - front: Molecular formula of the HO compound with M = 34.0 g/mol
    back: |
      HO weighs 17.01 g/mol; n = 34.0 ÷ 17.01 = 2 → H₂O₂, hydrogen peroxide.
    topic_code: "4.5"
  - front: Hydrocarbon 85.6% C, 14.4% H, M = 56.1 → both formulas
    back: |
      C 7.13 mol, H 14.3 mol → CH₂ (14.03 g/mol); n = 56.1 ÷ 14.03 = 4 → C₄H₈.
    topic_code: "4.5"
  - front: Why percent composition is a fixed property of a compound
    back: |
      Definite proportions (week 4): a compound's atoms are in a fixed ratio, so its mass ratio is fixed too. Analysing an unknown's percent composition identifies its formula.
    topic_code: "4.5"
  - front: Using the percent itself as moles → the error
    back: |
      Percents are masses (per 100 g); each must be divided by its element's molar mass before comparing. Skipping that step gives a mass ratio, not an atom ratio.
    topic_code: "4.5"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 4.4 and 4.5: the mole, molar mass, percent
    composition, empirical and molecular formulas), with about a third reviewing earlier weeks (average atomic
    mass, dimensional analysis, balancing, definite proportions, compound names and half-life). Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically;
    the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: magnesium burning lab (4.5)
    - slug: chem-u04-w14-q01
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Lab data: mass of empty crucible 25.00 g; mass of crucible plus magnesium ribbon 27.43 g; mass of crucible plus product after burning in air to constant mass 29.03 g.
      prompt: |
        What mass of oxygen combined with the magnesium?
      options:
        - "4.03 g"
        - "2.43 g"
        - "1.60 g"
        - "29.03 g"
      option_explanations:
        - |
          4.03 g is the mass of the product (29.03 − 25.00), magnesium and oxygen together.
        - |
          2.43 g is the mass of the magnesium ribbon (27.43 − 25.00).
        - |
          Correct. Product 4.03 g minus magnesium 2.43 g = 1.60 g of oxygen taken from the air, by conservation of mass.
        - |
          29.03 g includes the crucible; it is not the mass of any reactant or product.
      answer: 2

    - slug: chem-u04-w14-q02
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Lab data: mass of empty crucible 25.00 g; mass of crucible plus magnesium ribbon 27.43 g; mass of crucible plus product after burning in air to constant mass 29.03 g.
      prompt: |
        What is the empirical formula of the product?
      options:
        - "MgO"
        - "MgO₂"
        - "Mg₂O"
        - "Mg₃O₂"
      option_explanations:
        - |
          Correct. Mg: 2.43 ÷ 24.31 = 0.100 mol; O: 1.60 ÷ 16.00 = 0.100 mol; a 1 : 1 ratio.
        - |
          Two oxygens per magnesium would need 3.20 g of oxygen, twice what was gained.
        - |
          The mass of magnesium is larger, but magnesium atoms are heavier; moles, not grams, give the ratio.
        - |
          A 3 : 2 ratio would require 0.150 mol Mg for every 0.100 mol O; the data give equal moles.
      answer: 0

    - slug: chem-u04-w14-q03
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Lab data: mass of empty crucible 25.00 g; mass of crucible plus magnesium ribbon 27.43 g; mass of crucible plus product after burning in air to constant mass 29.03 g.
      prompt: |
        What is the mass percent of magnesium in the product, and how would it compare in a second trial using twice as much ribbon?
      options:
        - "39.7%; it would double"
        - "60.3%; it would halve"
        - "39.7%; it would stay the same"
        - "60.3%; it would stay the same"
      option_explanations:
        - |
          39.7% is the percent of oxygen, and no percent composition changes with sample size.
        - |
          The percent is right, but a compound's composition is fixed; twice the magnesium takes twice the oxygen.
        - |
          39.7% is the percent of oxygen (1.60 ÷ 4.03), not of magnesium.
        - |
          Correct. 2.43 ÷ 4.03 × 100% = 60.3%; by the law of definite proportions the same compound has the same composition in any amount.
      answer: 3

    # ---- Individual multiple choice (4.4, 4.5)
    - slug: chem-u04-w14-q04
      type: multiple_choice
      topic_code: "4.4"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      prompt: |
        What is the molar mass of calcium hydroxide, Ca(OH)₂?
      options:
        - "57.09 g/mol"
        - "74.10 g/mol"
        - "58.10 g/mol"
        - "114.18 g/mol"
      option_explanations:
        - |
          57.09 counts only one hydroxide: 40.08 + 17.01; the subscript 2 doubles the OH.
        - |
          Correct. 40.08 + 2(16.00 + 1.008) = 40.08 + 34.02 = 74.10 g/mol.
        - |
          58.10 doubles the hydrogen but not the oxygen; everything inside the parentheses is doubled.
        - |
          114.18 doubles the calcium as well, but the subscript applies only to the parentheses.
      answer: 1

    - slug: chem-u04-w14-q05
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        How many moles of carbon dioxide are in 22.0 g of CO₂?
      options:
        - "2.00 mol"
        - "968 mol"
        - "0.611 mol"
        - "0.500 mol"
      option_explanations:
        - |
          2.00 would come from dividing the molar mass by the mass; the operation is backwards.
        - |
          968 comes from multiplying 22.0 by 44.01; grams must be divided by g/mol to give moles.
        - |
          0.611 uses 36.0 g/mol, which omits one oxygen; CO₂ has two.
        - |
          Correct. 22.0 g ÷ 44.01 g/mol = 0.500 mol.
      answer: 3

    - slug: chem-u04-w14-q06
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which sample contains the greatest number of atoms?
      options:
        - "1.0 mol of H₂O"
        - "1.0 mol of He"
        - "1.0 mol of O₂"
        - "1.0 mol of Fe"
      option_explanations:
        - |
          Correct. Every sample holds 6.022 × 10²³ particles, but each water molecule contains three atoms, so this sample has about 1.8 × 10²⁴ atoms.
        - |
          Helium is monatomic: one mole of He is one mole of atoms.
        - |
          Each O₂ molecule has two atoms, so this is two moles of atoms, fewer than water's three.
        - |
          Iron is a metal of single atoms: one mole of Fe atoms, the same count as helium.
      answer: 0

    - slug: chem-u04-w14-q07
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A compound has the empirical formula NO₂ and a molar mass of 92.0 g/mol. What is its molecular formula?
      options:
        - "NO₂"
        - "N₂O"
        - "N₂O₄"
        - "N₄O₈"
      option_explanations:
        - |
          NO₂ itself weighs 46.01 g/mol, half the measured molar mass.
        - |
          N₂O does not have the 1 : 2 ratio of the empirical formula, and its molar mass is 44.02.
        - |
          Correct. 92.0 ÷ 46.01 = 2, so the molecule is twice the empirical formula: N₂O₄, dinitrogen tetroxide.
        - |
          N₄O₈ would have a molar mass of 184, four times the empirical mass.
      answer: 2

    - slug: chem-u04-w14-q08
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the empirical formula of ethane, C₂H₆?
      options:
        - "C₂H₆"
        - "CH₃"
        - "CH₂"
        - "CH"
      option_explanations:
        - |
          C₂H₆ is the molecular formula; its subscripts share the factor 2 and can be reduced.
        - |
          Correct. Dividing both subscripts by 2 gives the simplest whole-number ratio, CH₃.
        - |
          CH₂ is the empirical formula of ethene, C₂H₄, not of ethane.
        - |
          CH is the empirical formula of benzene (C₆H₆) and ethyne (C₂H₂).
      answer: 1

    - slug: chem-u04-w14-q09
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A compound is analysed and found to contain 1.25 mol Fe for every 1.88 mol O. A student rounds the ratio to 1 : 2 and writes FeO₂. What should the student have done?
      options:
        - "Rounded 1.50 down to 1 and written FeO"
        - "Reported FeO₂, since 1.88 is close to 2"
        - "Divided both by 1.88 to get Fe₀.₆₆O"
        - "Divided by 1.25 to get Fe 1 : O 1.50, then doubled to get Fe₂O₃"
      option_explanations:
        - |
          A ratio of 1.50 is nowhere near a whole number and must be cleared by multiplying, not rounded away.
        - |
          The ratio is relative: 1.88 ÷ 1.25 = 1.50, not 2. Comparing to the smaller value is the required step.
        - |
          Dividing by the larger value gives a fraction for iron; always divide by the smallest mole value.
        - |
          Correct. Dividing by the smallest gives 1 : 1.50; doubling clears the half and gives whole-number subscripts, Fe₂O₃.
      answer: 3

    - slug: chem-u04-w14-q10
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        To calculate the molar mass of dinitrogen tetroxide, which formula must be used?
      options:
        - "N₂O₄"
        - "NO₄"
        - "N₄O₂"
        - "N₂O₃"
      option_explanations:
        - |
          Correct. "Di" gives two nitrogen atoms and "tetr" four oxygens: N₂O₄, molar mass 92.02 g/mol.
        - |
          The prefix "di" on nitrogen means two nitrogen atoms, not one.
        - |
          The prefixes are reversed: tetroxide means four oxygens.
        - |
          N₂O₃ would be dinitrogen trioxide; "tetr" calls for four oxygens, not three.
      answer: 0

    # ---- Spiral multiple choice (2.3, 1.5, 4.1)
    - slug: chem-u04-w14-q11
      type: multiple_choice
      topic_code: "2.3"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      prompt: |
        The molar mass of chlorine on the periodic table is 35.45 g/mol, yet no chlorine atom has a mass of 35.45 u. Why?
      options:
        - "The value includes the mass of the electrons, which are not counted in the mass number"
        - "35.45 is the abundance-weighted average of chlorine-35 (about 76%) and chlorine-37 (about 24%)"
        - "Chlorine atoms lose mass when they form Cl₂ molecules"
        - "The table rounds the mass of chlorine-35 up to 35.45"
      option_explanations:
        - |
          Electron mass is tiny and is already included in each isotope's mass; it cannot account for a 0.45 u difference.
        - |
          Correct. A mole of natural chlorine is a mixture of isotopes; its mass is the average, weighted by abundance, so it lies between 35 and 37, nearer 35.
        - |
          Forming a covalent bond changes mass by an amount far too small to measure on this scale.
        - |
          Chlorine-35 has a mass of 34.97 u; 35.45 is not a rounding of it but an average with the heavier isotope.
      answer: 1

    - slug: chem-u04-w14-q12
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which setup correctly converts 0.400 mol of KCl (74.55 g/mol) to grams using dimensional analysis?
      options:
        - "0.400 mol ÷ 74.55 g/mol"
        - "74.55 g/mol ÷ 0.400 mol"
        - "0.400 mol × (74.55 g ÷ 1 mol)"
        - "0.400 mol × (1 mol ÷ 74.55 g)"
      option_explanations:
        - |
          Dividing by g/mol leaves mol²/g, not grams; the unit check fails.
        - |
          This gives g/mol² and a value of 186, which has no meaning here.
        - |
          Correct. The mol units cancel and grams remain: 0.400 × 74.55 = 29.8 g.
        - |
          With the factor upside down the mol units do not cancel; the result would be mol²/g.
      answer: 2

    - slug: chem-u04-w14-q13
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Now that you know what a mole is, how can the coefficients of 2 H₂ + O₂ → 2 H₂O be read?
      options:
        - "2 grams of hydrogen react with 1 gram of oxygen to give 2 grams of water"
        - "2 moles of H₂ react with 1 mole of O₂ to give 2 moles of H₂O"
        - "2 litres of hydrogen react with 1 litre of oxygen at any conditions"
        - "The coefficients have no meaning beyond balancing atoms"
      option_explanations:
        - |
          Coefficients count particles, not grams; 2 mol H₂ is 4.03 g and 1 mol O₂ is 32.00 g.
        - |
          Correct. Multiplying each molecule count by Avogadro's number scales the equation to moles; the ratio 2 : 1 : 2 is the mole ratio used in stoichiometry.
        - |
          Volume ratios hold only for gases at the same temperature and pressure, and water here may be a liquid.
        - |
          The coefficients are the mole ratio, which is what turns a mass of one substance into a mass of another.
      answer: 1

    # ---- Select all that apply
    - slug: chem-u04-w14-q14
      type: multi_select
      topic_code: "4.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about one mole of a substance are correct? Select all that apply.
      options:
        - "It contains 6.022 × 10²³ particles of that substance"
        - "Its mass in grams equals the formula mass in u"
        - "It always has a mass of 12 g"
        - "One mole of O₂ contains 2 × 6.022 × 10²³ oxygen atoms"
        - "One mole of any gas has the same mass"
      option_explanations:
        - |
          Correct: this is the definition of the mole.
        - |
          Correct: molar mass in g/mol is numerically the formula mass in u.
        - |
          Wrong: 12 g is the mass of one mole of carbon-12 only; each substance has its own molar mass.
        - |
          Correct: each O₂ molecule has two atoms, so a mole of molecules holds two moles of atoms.
        - |
          Wrong: equal moles of different gases have equal numbers of molecules but different masses (H₂ 2 g, CO₂ 44 g).
      answer: [0, 1, 3]
      explanation: |
        A mole is a fixed number of particles; its mass depends on what the particles are, and the atom count depends on how many atoms each particle contains.

    - slug: chem-u04-w14-q15
      type: multi_select
      topic_code: "4.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which compounds have the empirical formula CH₂O? Select all that apply.
      options:
        - "C₆H₁₂O₆"
        - "C₂H₄O₂"
        - "C₂H₆O"
        - "CH₂O"
        - "C₃H₆O₃"
      option_explanations:
        - |
          Yes: dividing 6, 12, 6 by 6 gives 1, 2, 1.
        - |
          Yes: 2, 4, 2 reduce to 1, 2, 1 (acetic acid).
        - |
          No: 2, 6, 1 share no common factor and the H : C ratio is 3 : 1 (ethanol).
        - |
          Yes: formaldehyde's molecular formula is already in lowest terms.
        - |
          Yes: 3, 6, 3 reduce to 1, 2, 1 (lactic acid).
      answer: [0, 1, 3, 4]
      explanation: |
        Divide each formula's subscripts by their greatest common factor; four of the five reduce to CH₂O. C₂H₆O has a different ratio.

    # ---- True / false
    - slug: chem-u04-w14-q16
      type: true_false
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: 10.0 g of magnesium contains more atoms than 10.0 g of iron.
      answer: true
      explanation: |
        True. Equal masses hold more of the lighter atom: 10.0 ÷ 24.31 = 0.411 mol Mg against 10.0 ÷ 55.85 = 0.179 mol Fe.

    - slug: chem-u04-w14-q17
      type: true_false
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: a 5.00 g sample of pure water from a glacier and a 500 g sample of pure water from the sea have the same percent composition.
      answer: true
      explanation: |
        True. The law of definite proportions: every sample of a compound has the same mass ratio of its elements (11.19% H, 88.81% O for water), whatever its size or source.

    # ---- Fill in the blank
    - slug: chem-u04-w14-q18
      type: fill_blank
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A formula that gives the simplest whole-number ratio of atoms in a compound, such as CH₂O for glucose, is called the ____ formula.
      answer: ["empirical"]
      explanation: |
        Empirical formula. The molecular formula, C₆H₁₂O₆, is a whole-number multiple of it.

    - slug: chem-u04-w14-q19
      type: fill_blank
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        To find the molar mass of the compound named magnesium ____ , a student writes Mg(NO₃)₂ and obtains 148.33 g/mol.
      answer: ["nitrate"]
      explanation: |
        Nitrate, NO₃⁻. Two nitrate ions balance one Mg²⁺, and the parentheses show both are counted.

    # ---- Numeric
    - slug: chem-u04-w14-q20
      type: numeric
      topic_code: "4.4"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      prompt: |
        Calculate the molar mass of zinc chloride, ZnCl₂ (Zn 65.38, Cl 35.45). Give your answer in g/mol to two decimal places.
      answer:
        value: 136.28
        tolerance: 0.05
      explanation: |
