week: 12
unit: 4
title: "Chemical Equations and Reaction Types"
topics: ["4.1", "4.2"]
guide: guides/week-12.md
guide_description: |
  Reading a chemical equation (reactants, products, coefficients, subscripts, state symbols), writing formulas
  from words with the seven diatomic elements, and balancing by coefficients only with a reliable order (metals,
  other nonmetals, hydrogen, oxygen last; polyatomic ions as units; doubling to clear fractions). Then the five
  reaction types, synthesis, decomposition, single replacement, double replacement and combustion, with the
  fingerprint of each and worked classifications.
flashcards:
  - front: Coefficient versus subscript in 2 H₂O → what each number counts
    back: |
      The coefficient 2 counts molecules (two waters: 4 H, 2 O in total). The subscript 2 counts atoms inside one molecule. Balancing changes coefficients only.
    topic_code: "4.1"
  - front: Why changing a subscript is never allowed when balancing
    back: |
      A subscript is part of the compound's identity. Changing H₂O to H₂O₂ turns water into hydrogen peroxide, a different substance, so the equation would describe a different reaction.
    topic_code: "4.1"
  - front: The seven elements written as diatomic molecules in equations
    back: |
      H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂. Every other free element is written as a single atom (Na, Fe, C, S, Ar).
    topic_code: "4.1"
  - front: Meaning of (s), (l), (g), (aq) after a formula
    back: |
      Solid, liquid, gas, aqueous (dissolved in water). They describe the physical state of each substance in the reaction, not the balancing.
    topic_code: "4.1"
  - front: The law that a balanced equation obeys
    back: |
      Conservation of mass (Lavoisier): atoms are rearranged, not created or destroyed, so each element has the same count on both sides and the total mass is unchanged.
    topic_code: "4.1"
  - front: Order to balance elements that avoids backtracking
    back: |
      Metals, then nonmetals other than H and O, then hydrogen, then oxygen last; a free element (O₂, Cl₂, Fe) last of all because its coefficient changes only one count.
    topic_code: "4.1"
  - front: Handling a polyatomic ion that appears on both sides
    back: |
      Treat it as a single unit (count "SO₄" rather than S and O separately). Example: 3 Ca(OH)₂ + 2 H₃PO₄ → Ca₃(PO₄)₂ + 6 H₂O, balancing PO₄ as two units.
    topic_code: "4.1"
  - front: What to do when balancing leaves a fractional coefficient
    back: |
      Double every coefficient. C₂H₆ + 7/2 O₂ → 2 CO₂ + 3 H₂O becomes 2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O.
    topic_code: "4.1"
  - front: Atom count in 3 Ca(NO₃)₂
    back: |
      3 Ca, 6 N, 18 O. The coefficient multiplies everything; the subscript outside the parentheses multiplies everything inside them.
    topic_code: "4.1"
  - front: Balanced equation for aluminum burning in oxygen
    back: |
      4 Al + 3 O₂ → 2 Al₂O₃. Six oxygens on each side forces the 3 and 2; then four aluminums.
    topic_code: "4.1"
  - front: Balanced combustion of propane C₃H₈
    back: |
      C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O. Carbon gives 3 CO₂, hydrogen gives 4 H₂O, then count 10 O on the right.
    topic_code: "4.1"
  - front: Balanced combustion of butane C₄H₁₀
    back: |
      2 C₄H₁₀ + 13 O₂ → 8 CO₂ + 10 H₂O. One butane would need 13/2 O₂, so everything is doubled. Coefficients sum to 33.
    topic_code: "4.1"
  - front: Final check after placing coefficients
    back: |
      Recount every element on both sides, and divide all coefficients by any common factor (4 H₂ + 2 O₂ → 4 H₂O reduces to 2, 1, 2).
    topic_code: "4.1"
  - front: Word equation to formulas → the two rule sets needed
    back: |
      Unit 3's naming rules for compounds (ionic from charges, molecular from prefixes) plus the diatomic-seven rule for free elements. Write formulas first, balance second.
    topic_code: "4.1"
  - front: Synthesis reaction → general form and fingerprint
    back: |
      A + B → AB. Two or more reactants, exactly one product. 2 Mg + O₂ → 2 MgO; CaO + H₂O → Ca(OH)₂.
    topic_code: "4.2"
  - front: Decomposition reaction → general form and fingerprint
    back: |
      AB → A + B. Exactly one reactant, two or more products; usually needs heat, electricity or light. 2 H₂O₂ → 2 H₂O + O₂.
    topic_code: "4.2"
  - front: Single replacement → general form and fingerprint
    back: |
      A + BC → AC + B. An element plus a compound gives a different element plus a compound. Zn + 2 HCl → ZnCl₂ + H₂.
    topic_code: "4.2"
  - front: Double replacement → general form and fingerprint
    back: |
      AB + CD → AD + CB. Two compounds trade ions; goes when a precipitate, a gas or water forms. AgNO₃ + NaCl → AgCl + NaNO₃.
    topic_code: "4.2"
  - front: Hydrocarbon combustion → reactants and products
    back: |
      Fuel (C, H and maybe O) plus O₂ gives CO₂ and H₂O and releases energy. CH₄ + 2 O₂ → CO₂ + 2 H₂O.
    topic_code: "4.2"
  - front: What heating a metal carbonate produces
    back: |
      The metal oxide and carbon dioxide: CaCO₃ → CaO + CO₂ (decomposition; the lime kiln).
    topic_code: "4.2"
  - front: What heating potassium chlorate produces
    back: |
      Potassium chloride and oxygen gas: 2 KClO₃ → 2 KCl + 3 O₂ (decomposition; a lab source of O₂).
    topic_code: "4.2"
  - front: Electrolysis of water → equation and type
    back: |
      2 H₂O → 2 H₂ + O₂, decomposition driven by electricity. Twice as much hydrogen gas as oxygen by volume.
    topic_code: "4.2"
  - front: Halogen single replacement example
    back: |
      Cl₂ + 2 KBr → 2 KCl + Br₂. A more reactive halogen (higher in group 17) displaces a less reactive one from its salt.
    topic_code: "4.2"
  - front: Acid plus base → reaction type and products
    back: |
      Double replacement (neutralization): acid + base → salt + water. HCl + NaOH → NaCl + H₂O.
    topic_code: "4.2"
  - front: Precipitate as the sign of a double replacement
    back: |
      An insoluble solid that forms when two solutions are mixed; the usual sign that a double replacement reaction has occurred (PbI₂ is bright yellow).
    topic_code: "4.2"
  - front: Metal burning in oxygen → which type to name
    back: |
      2 Mg + O₂ → 2 MgO fits both combustion and synthesis; name it synthesis because the product is a single compound and no CO₂ or H₂O forms.
    topic_code: "4.2"
  - front: Several products but also several reactants → which type
    back: |
      Not decomposition (that needs one reactant). Look for an element plus a compound (single replacement), two compounds (double replacement) or O₂ with CO₂ and H₂O (combustion).
    topic_code: "4.2"
  - front: Why reaction type matters for the next week
    back: |
      The type tells you the pattern of the products; the activity series and solubility rules (week 13) then tell you whether the reaction happens and which product leaves the solution.
    topic_code: "4.2"
  - front: Why coefficients matter beyond atom bookkeeping
    back: |
      They become the mole ratio in stoichiometry (week 15): the conversion factor between amounts of different substances. An unbalanced equation gives wrong ratios and wrong masses.
    topic_code: "4.1"
  - front: Combustion of ethanol C₂H₅OH → balanced equation
    back: |
      C₂H₅OH + 3 O₂ → 2 CO₂ + 3 H₂O. Count the oxygen already in the fuel: right side needs 7 O, ethanol supplies 1, so 3 O₂.
    topic_code: "4.2"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 4.1 and 4.2: reading, writing and balancing
    equations and classifying reactions), with about a third reviewing earlier weeks (ionic and molecular formulas
    and names, conservation of mass, chemical change and ion charges). Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: four reactions (4.1, 4.2)
    - slug: chem-u04-w12-q01
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        Four balanced equations: I. 2 Mg + O₂ → 2 MgO. II. 2 KClO₃ → 2 KCl + 3 O₂. III. Zn + 2 HCl → ZnCl₂ + H₂. IV. AgNO₃ + NaCl → AgCl + NaNO₃.
      prompt: |
        Which equation shows a single replacement reaction?
      options:
        - "I"
        - "II"
        - "III"
        - "IV"
      option_explanations:
        - |
          Two elements combining into one compound is synthesis, not replacement.
        - |
          One reactant breaking into two products is decomposition.
        - |
          Correct. An element (Zn) and a compound (HCl) react to give a different element (H₂) and a compound (ZnCl₂): zinc takes hydrogen's place.
        - |
          Two compounds exchanging ions, with no free element anywhere, is double replacement.
      answer: 2

    - slug: chem-u04-w12-q02
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Four balanced equations: I. 2 Mg + O₂ → 2 MgO. II. 2 KClO₃ → 2 KCl + 3 O₂. III. Zn + 2 HCl → ZnCl₂ + H₂. IV. AgNO₃ + NaCl → AgCl + NaNO₃.
      prompt: |
        In equation II, how many oxygen atoms are on each side?
      options:
        - "6 on each side"
        - "3 on the left, 6 on the right"
        - "6 on the left, 3 on the right"
        - "2 on the left, 2 on the right"
      option_explanations:
        - |
          Correct. Left: 2 KClO₃ contains 2 × 3 = 6 O. Right: 3 O₂ contains 3 × 2 = 6 O. Equal counts are what "balanced" means.
        - |
          The coefficient 2 multiplies the subscript 3 on the left, giving six oxygens there as well.
        - |
          The coefficient 3 multiplies the subscript 2 in O₂, giving six oxygens on the right.
        - |
          Neither side has only two oxygens; coefficients and subscripts must both be counted.
      answer: 0

    - slug: chem-u04-w12-q03
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        Four balanced equations: I. 2 Mg + O₂ → 2 MgO. II. 2 KClO₃ → 2 KCl + 3 O₂. III. Zn + 2 HCl → ZnCl₂ + H₂. IV. AgNO₃ + NaCl → AgCl + NaNO₃.
      prompt: |
        Equation IV produces a white solid when two clear solutions are mixed. What is that solid called, and which type of reaction is IV?
      options:
        - "A residue; decomposition"
        - "A catalyst; synthesis"
        - "A sediment; single replacement"
        - "A precipitate; double replacement"
      option_explanations:
        - |
          Decomposition starts from one reactant; equation IV has two, and "residue" is not the chemical term.
        - |
          A catalyst speeds a reaction without being consumed; the solid here is a product, and two products form, so this is not synthesis.
        - |
          No free element appears in IV, so it is not single replacement; "sediment" is a geology word.
        - |
          Correct. Ag⁺ and Na⁺ trade partners; the insoluble AgCl that forms is a precipitate, the sign that a double replacement has occurred.
      answer: 3

    # ---- Individual multiple choice (4.1, 4.2)
    - slug: chem-u04-w12-q04
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the coefficient of O₂ when the equation Fe + O₂ → Fe₂O₃ is balanced with the smallest whole numbers?
      options:
        - "2"
        - "3"
        - "4"
        - "6"
      option_explanations:
        - |
          Two O₂ give four oxygens, which cannot match the three per Fe₂O₃ in whole numbers.
        - |
          Correct. 4 Fe + 3 O₂ → 2 Fe₂O₃: six oxygen atoms and four iron atoms on each side.
        - |
          Four is the coefficient of Fe, not of O₂.
        - |
          Six O₂ would balance only if every coefficient were doubled (8, 6, 4), which is not the smallest set.
      answer: 1

    - slug: chem-u04-w12-q05
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A student balances H₂ + O₂ → H₂O by writing H₂ + O₂ → H₂O₂. What is wrong?
      options:
        - "Nothing; the atoms are now equal on both sides"
        - "The coefficient of H₂ should also be 2"
        - "Changing the subscript changed the product from water to hydrogen peroxide, a different substance"
        - "Oxygen should be written as a single atom, O"
      option_explanations:
        - |
          The atoms match, but the equation now describes the formation of hydrogen peroxide, not water; the chemistry is wrong.
        - |
          Adding coefficients to the altered equation does not repair it; the product formula itself is wrong.
        - |
          Correct. Subscripts fix a compound's identity; only coefficients may be changed. The correct equation is 2 H₂ + O₂ → 2 H₂O.
        - |
          Free oxygen is diatomic and must be written O₂; that part of the student's equation is correct.
      answer: 2

    - slug: chem-u04-w12-q06
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which set of formulas correctly translates "sodium metal reacts with chlorine gas to form sodium chloride"?
      options:
        - "Na + Cl₂ → NaCl"
        - "Na₂ + Cl₂ → NaCl"
        - "Na + Cl → NaCl"
        - "Na + Cl₂ → NaCl₂"
      option_explanations:
        - |
          Correct. Sodium is a metal written as single atoms, chlorine is one of the diatomic seven, and the product follows from Na⁺ and Cl⁻. Balanced: 2 Na + Cl₂ → 2 NaCl.
        - |
          Sodium is not diatomic; metals are written as single atoms.
        - |
          Chlorine gas exists as Cl₂ molecules, so the free element must carry the subscript 2.
        - |
          NaCl₂ would need a 2+ sodium ion, which does not exist; the charges fix the formula as NaCl.
      answer: 0

    - slug: chem-u04-w12-q07
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which equation represents a synthesis reaction?
      options:
        - "2 NaHCO₃ → Na₂CO₃ + H₂O + CO₂"
        - "Cu + 2 AgNO₃ → Cu(NO₃)₂ + 2 Ag"
        - "C₂H₄ + 3 O₂ → 2 CO₂ + 2 H₂O"
        - "SO₃ + H₂O → H₂SO₄"
      option_explanations:
        - |
          One reactant giving three products is decomposition.
        - |
          An element replacing another element in a compound is single replacement.
        - |
          Oxygen as a reactant with carbon dioxide and water as products is combustion.
        - |
          Correct. Two substances combine into a single product; synthesis need not involve elements, compounds can combine too.
      answer: 3

    - slug: chem-u04-w12-q08
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        What are the products of the complete combustion of methanol, CH₃OH, in excess oxygen?
      options:
        - "C and H₂O"
        - "CO₂ and H₂O"
        - "CO and H₂"
        - "CH₄ and O₂"
      option_explanations:
        - |
          Soot (carbon) forms only when oxygen is insufficient; complete combustion oxidizes all the carbon.
        - |
          Correct. Any fuel of C, H and O burns completely to carbon dioxide and water: 2 CH₃OH + 3 O₂ → 2 CO₂ + 4 H₂O.
        - |
          Carbon monoxide is a product of incomplete combustion, and hydrogen is never left unburned in excess oxygen.
        - |
          These are not products of burning; methane and oxygen would themselves burn.
      answer: 1

    - slug: chem-u04-w12-q09
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Calcium carbonate is heated strongly in a kiln. Which equation and classification are correct?
      options:
        - "CaCO₃ + O₂ → CaO + CO₂; combustion"
        - "CaCO₃ → Ca + C + O₃; decomposition"
        - "CaCO₃ → CaO + CO₂; decomposition"
        - "2 CaCO₃ → 2 CaO + 2 CO₂; synthesis"
      option_explanations:
        - |
          The equation is not balanced (oxygen 5 against 3) and no fuel is burned; heating a carbonate needs no oxygen.
        - |
          Carbonates do not break into free elements on heating, and O₃ (ozone) is not a product here.
        - |
          Correct. One reactant becomes two products, the metal oxide and carbon dioxide; every element balances as written.
        - |
          The coefficients share a factor of 2 and should be reduced, and one reactant giving two products is decomposition, not synthesis.
      answer: 2

    - slug: chem-u04-w12-q10
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        What are the coefficients, in order, when Al + H₂SO₄ → Al₂(SO₄)₃ + H₂ is balanced?
      options:
        - "2, 3, 1, 3"
        - "1, 3, 1, 3"
        - "2, 3, 2, 3"
        - "2, 1, 1, 1"
      option_explanations:
        - |
          Correct. Treat SO₄ as a unit: 3 on the right needs 3 H₂SO₄; that gives 6 H, so 3 H₂; two Al on the right needs 2 Al.
        - |
          One Al on the left cannot supply the two aluminum atoms in Al₂(SO₄)₃.
        - |
          Two Al₂(SO₄)₃ would contain six sulfate units, but 3 H₂SO₄ supplies only three.
        - |
          One H₂SO₄ gives a single sulfate, but the product needs three; hydrogen does not balance either.
      answer: 0

    # ---- Spiral multiple choice (3.2, 2.1, 1.3)
    - slug: chem-u04-w12-q11
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        To write the equation for "barium chloride solution reacts with sodium sulfate solution", a student must first write the formula of barium sulfate. What is it?
      options:
        - "Ba₂SO₄"
        - "Ba(SO₄)₂"
        - "BaS"
        - "BaSO₄"
      option_explanations:
        - |
          Two Ba²⁺ against one SO₄²⁻ would carry a net 2+ charge.
        - |
          One Ba²⁺ against two sulfate ions would carry a net 2− charge.
        - |
          BaS is barium sulfide, from the sulfide ion S²⁻, not the sulfate ion.
        - |
          Correct. Ba²⁺ and SO₄²⁻ cancel one to one. (The full equation: BaCl₂ + Na₂SO₄ → BaSO₄ + 2 NaCl.)
      answer: 3

    - slug: chem-u04-w12-q12
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A sealed flask containing a candle and air has a mass of 250.00 g. The candle is lit by focusing sunlight through the glass, burns for a minute and goes out. What is the mass of the sealed flask afterwards, and why?
      options:
        - "Less than 250.00 g, because wax was burned away"
        - "250.00 g, because the atoms of wax and oxygen were rearranged into CO₂ and H₂O inside the sealed flask"
        - "More than 250.00 g, because combustion adds oxygen to the wax"
        - "Less than 250.00 g, because heat has mass and left through the glass"
      option_explanations:
        - |
          The wax did not vanish; its atoms are now in gaseous products still inside the flask.
        - |
          Correct. Conservation of mass: in a closed system the products contain exactly the atoms of the reactants, so the mass is unchanged.
        - |
          The oxygen that combined with the wax was already inside the flask and already counted in the 250.00 g.
        - |
          Heat is energy transfer, not matter; the loss of energy does not change the mass at any level you can weigh.
      answer: 1

    - slug: chem-u04-w12-q13
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Zinc is dropped into hydrochloric acid: the mixture fizzes, the test tube warms and the zinc slowly disappears. Which observation is the strongest evidence that a chemical change, not a physical one, is occurring?
      options:
        - "The zinc disappears, as it would if it dissolved"
        - "The test tube feels warm, as it would if warm acid had been added"
        - "A gas forms that was not present before"
        - "The liquid level rises slightly"
      option_explanations:
        - |
          Disappearance alone could be dissolving, a physical change; sugar disappears in water without reacting.
        - |
          Warming can accompany physical changes too (dissolving some salts releases heat), so it is weaker evidence.
        - |
          Correct. A new substance appearing, here hydrogen gas from Zn + 2 HCl → ZnCl₂ + H₂, is the defining sign of a chemical change.
        - |
          A small volume change says nothing about new substances; it happens in physical mixing as well.
      answer: 2

    # ---- Select all that apply
    - slug: chem-u04-w12-q14
      type: multi_select
      topic_code: "4.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which equations are correctly balanced? Select all that apply.
      options:
        - "2 Na + Cl₂ → 2 NaCl"
        - "CH₄ + O₂ → CO₂ + 2 H₂O"
        - "2 H₂O₂ → 2 H₂O + O₂"
        - "N₂ + 3 H₂ → 2 NH₃"
        - "Mg + HCl → MgCl₂ + H₂"
      option_explanations:
        - |
          Balanced: 2 Na and 2 Cl on each side, with chlorine correctly written as the diatomic Cl₂.
        - |
          Not balanced: oxygen is 2 on the left and 4 on the right; the correct coefficient of O₂ is 2.
        - |
          Balanced: 4 H and 4 O on each side (2 + 2 on the right).
        - |
          Balanced: 2 N and 6 H on each side; the 3 and 2 are the smallest whole numbers that work.
        - |
          Not balanced: one Cl on the left against two on the right; HCl needs the coefficient 2.
      answer: [0, 2, 3]
      explanation: |
        Count each element on both sides. Only the methane and magnesium equations fail: CH₄ + 2 O₂ → CO₂ + 2 H₂O and Mg + 2 HCl → MgCl₂ + H₂ are the balanced forms.

    - slug: chem-u04-w12-q15
      type: multi_select
      topic_code: "4.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which reactions are double replacement reactions? Select all that apply.
      options:
        - "Pb(NO₃)₂ + 2 KI → PbI₂ + 2 KNO₃"
        - "2 Al + 3 Br₂ → 2 AlBr₃"
        - "HNO₃ + KOH → KNO₃ + H₂O"
        - "Fe + CuSO₄ → FeSO₄ + Cu"
        - "Na₂CO₃ + CaCl₂ → CaCO₃ + 2 NaCl"
      option_explanations:
        - |
          Yes: two ionic compounds swap partners and lead iodide precipitates.
        - |
          No: two elements forming one compound is synthesis.
        - |
          Yes: an acid and a base trade ions to give a salt and water; neutralization is a double replacement.
        - |
          No: a free element (Fe) replaces another (Cu) from its compound, single replacement.
        - |
          Yes: carbonate and chloride ions exchange partners and calcium carbonate precipitates.
      answer: [0, 2, 4]
      explanation: |
        Double replacement has two compounds in and two compounds out, with the positive ions swapped. Any equation with a free element on either side is not double replacement.

    # ---- True / false
    - slug: chem-u04-w12-q16
      type: true_false
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: in the equation 2 NO + O₂ → 2 NO₂, the reactant NO is named nitrogen monoxide and the product NO₂ is named nitrogen dioxide.
      answer: true
      explanation: |
        True. Both are molecular compounds of two nonmetals, so prefixes give the atom counts; "mono" is kept on the second element (monoxide) but dropped from the first.

    - slug: chem-u04-w12-q17
      type: true_false
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: when writing the product of magnesium reacting with nitrogen, the formula must be Mg₃N₂ because Mg forms a 2+ ion and N forms a 3− ion.
      answer: true
      explanation: |
        True. Three Mg²⁺ (6+) balance two N³⁻ (6−). The balanced equation is 3 Mg + N₂ → Mg₃N₂; the formula is set by the ion charges before any balancing.

    # ---- Fill in the blank
    - slug: chem-u04-w12-q18
      type: fill_blank
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A reaction in which a single compound breaks down into two or more simpler substances, often when heated, is called a ____ reaction.
      answer: ["decomposition", "decomposition reaction"]
      explanation: |
        Decomposition: one reactant, several products, as in 2 HgO → 2 Hg + O₂.

    - slug: chem-u04-w12-q19
      type: fill_blank
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        In the equation 2 KClO₃ → 2 KCl + 3 O₂, the reactant is named potassium ____.
      answer: ["chlorate"]
      explanation: |
        Chlorate, the polyatomic ion ClO₃⁻. Chlorite is ClO₂⁻, perchlorate ClO₄⁻ and chloride Cl⁻.

    # ---- Numeric
    - slug: chem-u04-w12-q20
      type: numeric
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
