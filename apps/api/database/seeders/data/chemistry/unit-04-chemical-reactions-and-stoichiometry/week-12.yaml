      prompt: |
        Consider the reaction of iron(III) oxide with carbon monoxide to form iron and carbon dioxide (the blast furnace).

        (a) Write the formulas of all four substances.
        (b) Balance the equation with the smallest whole-number coefficients.
        (c) Show that the balanced equation conserves atoms by counting each element on both sides.
      answer: |
        (a) Fe₂O₃, CO, Fe, CO₂.
        (b) Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂.
        (c) Fe: 2 = 2. C: 3 = 3. O: 3 + 3 = 6 on the left; 3 × 2 = 6 on the right.
      explanation: |
        Scoring: (a) 1 point for all four formulas (iron(III) gives Fe₂O₃; carbon monoxide is CO, not Co). (b) 1 point for 1, 3, 2, 3. (c) 1 point for a correct count of Fe, C and O on both sides showing equality.

    - slug: chem-u04-w12-q24
      type: short_answer
      topic_code: "4.2"
      source: "general knowledge"
      points: 3
      prompt: |
        Three reactions: (i) 2 Al + 3 CuCl₂ → 2 AlCl₃ + 3 Cu; (ii) Na₂SO₄ + BaCl₂ → BaSO₄ + 2 NaCl; (iii) 2 C₈H₁₈ + 25 O₂ → 16 CO₂ + 18 H₂O.

        (a) Classify each reaction by type.
        (b) For reaction (ii), state the observation that shows the reaction has taken place and name the product responsible.
        (c) Explain how you can tell reaction (i) from reaction (ii) without reading the formulas closely.
      answer: |
        (a) (i) single replacement; (ii) double replacement; (iii) combustion.
        (b) A white solid (precipitate) forms when the two clear solutions are mixed: barium sulfate, BaSO₄, which is insoluble.
        (c) Reaction (i) has a free element on each side (Al in, Cu out), the mark of single replacement; reaction (ii) has only compounds on both sides, with the positive ions swapped, the mark of double replacement.
      explanation: |
        Scoring: (a) 1 point for all three types correct. (b) 1 point for a precipitate (white solid) and naming barium sulfate. (c) 1 point for the presence of a free element versus compounds only, or an equivalent fingerprint.

    # ---- Long answer
    - slug: chem-u04-w12-q25
      type: long_answer
      topic_code: "4.1"
      source: "general knowledge"
      points: 6
      prompt: |
        A classmate says: "Balancing an equation is just a puzzle; the numbers don't mean anything real, and if you need an extra oxygen you can just add one to a formula." Write a response that (1) explains what the law of conservation of mass requires of a chemical equation and why, in terms of atoms; (2) explains the different meanings of a coefficient and a subscript, with an example of each; (3) shows why changing a subscript produces a different substance, using H₂O and H₂O₂ or another pair; (4) balances the equation for propane burning, C₃H₈ + O₂ → CO₂ + H₂O, showing your steps; and (5) states what the final coefficients will be used for later in the course.
      answer: |
        (1) Chemical reactions rearrange atoms; they do not create or destroy them, which is Lavoisier's law of conservation of mass. An equation must therefore show the same number of each kind of atom on both sides; otherwise it describes atoms appearing from nowhere or vanishing, which never happens.
        (2) A coefficient counts whole particles: 3 H₂O means three water molecules. A subscript counts atoms inside one particle: the 2 in H₂O means two hydrogen atoms per molecule. Coefficients can be chosen to balance; subscripts are fixed by the compound.
        (3) H₂O is water, a liquid that puts out fires; H₂O₂ is hydrogen peroxide, a bleaching agent that decomposes to release oxygen. Changing the subscript changes the identity of the substance, so the equation would no longer describe the reaction being studied.
        (4) C: 3 on the left, so 3 CO₂. H: 8 on the left, so 4 H₂O. O on the right: 3 × 2 + 4 = 10, so 5 O₂. C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O. Check: C 3 = 3, H 8 = 8, O 10 = 10.
        (5) The coefficients give the mole ratio between substances (1 propane : 5 oxygen : 3 carbon dioxide : 4 water), which stoichiometry uses to convert a mass of one substance into the mass of another, to find the limiting reactant and to calculate yield.
      explanation: |
        Scoring (6 points). 1 point: conservation of mass stated and linked to atoms being rearranged, not created or destroyed. 1 point: coefficient counts particles, subscript counts atoms within a particle, each with a correct example. 1 point: a subscript change gives a different substance, with a concrete pair. 2 points: correct balanced equation C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O with steps shown (1 point if the final equation is right without steps or the steps are right with an arithmetic slip). 1 point: coefficients become mole ratios for stoichiometry (converting between amounts, limiting reactant or yield). Deduct for calling the coefficients masses.
