unit: 4
description: |
  44 questions · about 75 minutes · every topic of Unit 4 (4.1 to 4.7): writing and balancing equations, reaction
  types, predicting products with the activity series and solubility rules, the mole and molar mass, percent
  composition and formulas, mass-to-mass stoichiometry, limiting reactant and percent yield, with some review of
  Units 1 to 3. Two stimulus sets (a precipitation lab and a table of three fuels), select-all, true/false,
  fill-in-the-blank and numeric items, two short-answer questions (3 points each) and one long answer (6 points).
  Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
  matched automatically; the short answers and the long answer are graded by your teacher against the scoring
  notes.
questions:
  # ---- Stimulus set A: a precipitation lab (4.3, 4.7)
  - slug: chem-u04-exam-q01
    type: multiple_choice
    topic_code: "4.3"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    stimulus: |
      Lab record: 2.00 g of calcium chloride, CaCl₂ (110.98 g/mol), and 2.00 g of sodium carbonate, Na₂CO₃ (105.99 g/mol), are each dissolved in water and the solutions mixed. A white solid forms, is filtered, dried and weighed: 1.62 g. Molar mass of CaCO₃: 100.09 g/mol.
    prompt: |
      What is the white solid, and which rule predicts it?
    options:
      - "Sodium chloride; chlorides are insoluble"
      - "Calcium chloride; it is insoluble in excess water"
      - "Calcium carbonate; carbonates are insoluble except with group 1 ions and ammonium"
      - "Sodium carbonate; carbonates are insoluble"
    option_explanations:
      - |
        Sodium chloride is soluble (group 1 compounds always are) and remains in solution.
      - |
        Calcium chloride was dissolved to begin with; chlorides dissolve except with Ag⁺, Pb²⁺ and Hg₂²⁺.
      - |
        Correct. Swapping partners gives CaCO₃ and NaCl; calcium carbonate is an insoluble carbonate (calcium is not group 1), so it precipitates.
      - |
        Sodium carbonate is the soluble exception among carbonates; it was one of the dissolved reactants.
    answer: 2

  - slug: chem-u04-exam-q02
    type: multiple_choice
    topic_code: "4.7"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    stimulus: |
      Lab record: 2.00 g of calcium chloride, CaCl₂ (110.98 g/mol), and 2.00 g of sodium carbonate, Na₂CO₃ (105.99 g/mol), are each dissolved in water and the solutions mixed. A white solid forms, is filtered, dried and weighed: 1.62 g. Molar mass of CaCO₃: 100.09 g/mol.
    prompt: |
      Which reactant is limiting?
    options:
      - "CaCl₂, because 2.00 ÷ 110.98 = 0.0180 mol is fewer than 2.00 ÷ 105.99 = 0.0189 mol in a 1 : 1 reaction"
      - "Na₂CO₃, because it has the smaller molar mass"
      - "Neither, because equal masses were used"
      - "Na₂CO₃, because carbonate carries a 2− charge"
    option_explanations:
      - |
        Correct. CaCl₂ + Na₂CO₃ → CaCO₃ + 2 NaCl is 1 : 1, so the reactant with fewer moles, calcium chloride, runs out first.
      - |
        A smaller molar mass gives more moles per gram, which makes sodium carbonate the excess reactant, not the limiting one.
      - |
        Equal masses are not equal moles; the molar masses differ, and only moles compared through the ratio decide.
      - |
        Ion charge plays no part in limiting-reactant reasoning; the balanced equation already accounts for it.
    answer: 0

  - slug: chem-u04-exam-q03
    type: multiple_choice
    topic_code: "4.7"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    stimulus: |
      Lab record: 2.00 g of calcium chloride, CaCl₂ (110.98 g/mol), and 2.00 g of sodium carbonate, Na₂CO₃ (105.99 g/mol), are each dissolved in water and the solutions mixed. A white solid forms, is filtered, dried and weighed: 1.62 g. Molar mass of CaCO₃: 100.09 g/mol.
    prompt: |
      What is the percent yield of the precipitate?
    options:
      - "81.0%"
      - "40.5%"
      - "111%"
      - "89.8%"
    option_explanations:
      - |
        81.0% divides 1.62 g by 2.00 g, a reactant mass rather than the theoretical yield.
      - |
        40.5% divides by the total 4.00 g of reactants, which is not the theoretical yield either.
      - |
        111% inverts the fraction; a yield over 100% would indicate an impure product.
      - |
        Correct. Theoretical: 0.0180 mol CaCl₂ → 0.0180 mol CaCO₃ × 100.09 = 1.80 g. Yield = 1.62 ÷ 1.80 × 100% = 89.8%.
    answer: 3

  # ---- Stimulus set B: three fuels (4.1, 4.6)
  - slug: chem-u04-exam-q04
    type: multiple_choice
    topic_code: "4.1"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    stimulus: |
      Data table: three hydrocarbon fuels. | Fuel | Formula | Molar mass (g/mol) | Methane | CH₄ | 16.04 | Propane | C₃H₈ | 44.09 | Octane | C₈H₁₈ | 114.22 | Each burns completely in oxygen to carbon dioxide (44.01 g/mol) and water.
    prompt: |
      What are the smallest whole-number coefficients for the combustion of octane, C₈H₁₈ + O₂ → CO₂ + H₂O?
    options:
      - "1, 12.5, 8, 9"
      - "2, 25, 16, 18"
      - "1, 25, 8, 9"
      - "2, 17, 16, 18"
    option_explanations:
      - |
        The fraction 12.5 must be cleared by doubling every coefficient.
      - |
        Correct. One octane needs 8 CO₂ and 9 H₂O, which is 25 oxygen atoms, 12.5 O₂; doubling gives 2, 25, 16, 18. Check: C 16, H 36, O 50 on each side.
      - |
        With a single octane, 25 O₂ supplies 50 oxygen atoms but the products hold only 25.
      - |
        17 O₂ gives 34 oxygen atoms, but 16 CO₂ and 18 H₂O need 50.
    answer: 1

  - slug: chem-u04-exam-q05
    type: multiple_choice
    topic_code: "4.6"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    stimulus: |
      Data table: three hydrocarbon fuels. | Fuel | Formula | Molar mass (g/mol) | Methane | CH₄ | 16.04 | Propane | C₃H₈ | 44.09 | Octane | C₈H₁₈ | 114.22 | Each burns completely in oxygen to carbon dioxide (44.01 g/mol) and water.
    prompt: |
      How many moles of carbon dioxide form when 2.00 mol of propane burns completely?
    options:
      - "2.00 mol"
      - "10.0 mol"
      - "3.00 mol"
      - "6.00 mol"
    option_explanations:
      - |
        A 1 : 1 ratio ignores the three carbon atoms in each propane molecule.
      - |
        10.0 mol is the oxygen consumed (2.00 × 5), not the carbon dioxide formed.
      - |
        3.00 mol is the CO₂ from a single mole of propane; two moles were burned.
      - |
        Correct. C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O; 2.00 mol × (3 ÷ 1) = 6.00 mol CO₂, one for every carbon atom.
    answer: 3

  - slug: chem-u04-exam-q06
    type: multiple_choice
    topic_code: "4.6"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    stimulus: |
      Data table: three hydrocarbon fuels. | Fuel | Formula | Molar mass (g/mol) | Methane | CH₄ | 16.04 | Propane | C₃H₈ | 44.09 | Octane | C₈H₁₈ | 114.22 | Each burns completely in oxygen to carbon dioxide (44.01 g/mol) and water.
    prompt: |
      Which fuel releases the most carbon dioxide per gram of fuel burned, and roughly how much?
    options:
      - "Methane, about 3.1 g CO₂ per gram"
      - "Propane, about 2.7 g CO₂ per gram"
      - "Octane, about 3.1 g CO₂ per gram"
      - "All three release the same, 2.7 g CO₂ per gram"
    option_explanations:
      - |
        Methane gives 44.01 ÷ 16.04 = 2.74 g CO₂ per gram, the least of the three, because it carries the most hydrogen per carbon.
      - |
        Propane gives 3 × 44.01 ÷ 44.09 = 3.00 g CO₂ per gram, more than this figure and less than octane.
      - |
        Correct. Octane: 1 g ÷ 114.22 = 0.00876 mol × 8 = 0.0700 mol CO₂ × 44.01 = 3.08 g. The higher the carbon fraction of the fuel, the more CO₂ per gram.
      - |
        The ratios differ because the carbon-to-hydrogen ratio differs from fuel to fuel.
    answer: 2

  # ---- Individual multiple choice (4.1–4.7 plus review)
  - slug: chem-u04-exam-q07
    type: multiple_choice
    topic_code: "4.1"
    source: "general knowledge"
    points: 1
    prompt: |
      When Ca(OH)₂ + H₃PO₄ → Ca₃(PO₄)₂ + H₂O is balanced with the smallest whole numbers, what is the coefficient of water?
    options:
      - "6"
      - "3"
      - "2"
      - "12"
    option_explanations:
      - |
        Correct. 3 Ca(OH)₂ + 2 H₃PO₄ → Ca₃(PO₄)₂ + 6 H₂O: hydrogen is 6 + 6 = 12 on the left, so 6 waters.
      - |
        Three waters would hold only 6 hydrogens; the reactants supply 12.
      - |
        Two is the coefficient of phosphoric acid, not of water.
      - |
        Twelve is the hydrogen atom count, not the number of water molecules (each holds two).
    answer: 0

  - slug: chem-u04-exam-q08
    type: multiple_choice
    topic_code: "4.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which translation of "iron(III) oxide reacts with hydrogen gas to form iron and water" is correct before balancing?
    options:
      - "FeO + H → Fe + H₂O"
      - "Fe₂O₃ + H₂ → Fe + H₂O"
      - "Fe₃O + H₂ → Fe + H₂O"
      - "Fe₂O₃ + H₂ → Fe₂ + H₂O"
    option_explanations:
      - |
        Iron(III) is Fe³⁺, giving Fe₂O₃, and hydrogen gas is diatomic.
      - |
        Correct. Fe³⁺ with O²⁻ gives Fe₂O₃; hydrogen is H₂; iron metal is a single atom. Balanced: Fe₂O₃ + 3 H₂ → 2 Fe + 3 H₂O.
      - |
        The Roman numeral is the charge of iron, not a subscript; Fe₃O does not balance charges.
      - |
        Iron is a metal written as Fe, not as a diatomic Fe₂.
    answer: 1

  - slug: chem-u04-exam-q09
    type: multiple_choice
    topic_code: "4.1"
    source: "general knowledge"
    points: 1
    prompt: |
      How many atoms of oxygen are represented by 4 Fe(NO₃)₃?
    options:
      - "9"
      - "12"
      - "27"
      - "36"
    option_explanations:
      - |
        Nine oxygens are in a single formula unit; the coefficient multiplies that by four.
      - |
        Twelve counts one oxygen per nitrate times four units, forgetting the subscript 3 on O.
      - |
        Twenty-seven would be three formula units' worth.
      - |
        Correct. Each nitrate holds 3 O, three nitrates give 9, and four formula units give 36.
    answer: 3

  - slug: chem-u04-exam-q10
    type: multiple_choice
    topic_code: "4.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which reaction is a single replacement?
    options:
      - "2 H₂O₂ → 2 H₂O + O₂"
      - "CaO + CO₂ → CaCO₃"
      - "Mg + CuSO₄ → MgSO₄ + Cu"
      - "HCl + NaOH → NaCl + H₂O"
    option_explanations:
      - |
        One reactant giving two products is decomposition.
      - |
        Two compounds combining into one is synthesis.
      - |
        Correct. The free element magnesium takes copper's place and copper is released as a free element.
      - |
        Two compounds exchanging ions, with water formed, is double replacement (neutralization).
    answer: 2

  - slug: chem-u04-exam-q11
    type: multiple_choice
    topic_code: "4.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Ethanol, C₂H₅OH, burns in air. What are the products, and what type of reaction is it?
    options:
      - "CO₂ and H₂O; combustion"
      - "C and H₂O; decomposition"
      - "CO₂ and H₂; single replacement"
      - "C₂H₅O and H₂O; synthesis"
    option_explanations:
      - |
        Correct. A fuel of C, H and O burning in sufficient oxygen gives carbon dioxide and water: C₂H₅OH + 3 O₂ → 2 CO₂ + 3 H₂O.
      - |
        Carbon soot appears only in incomplete combustion, and burning requires a second reactant (O₂), so it is not decomposition.
      - |
        Hydrogen is never left unburned when oxygen is present, and no element replaces another here.
      - |
        Combustion produces several products, not one, and C₂H₅O is not a stable compound.
    answer: 0

  - slug: chem-u04-exam-q12
    type: multiple_choice
    topic_code: "4.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Potassium chlorate is heated and a glowing splint held at the mouth of the tube bursts into flame. Which equation describes the reaction that produced the gas?
    options:
      - "KClO₃ + O₂ → KClO₄"
      - "2 KClO₃ → 2 KCl + 3 O₂"
      - "KClO₃ → K + Cl + 3 O"
      - "2 KClO₃ + 3 H₂ → 2 KCl + 3 H₂O"
    option_explanations:
      - |
        The splint test shows oxygen being released, not absorbed, and heating alone is a decomposition with one reactant.
      - |
        Correct. The chlorate decomposes on heating into the chloride and oxygen gas; the oxygen relights the splint.
      - |
        Free elements must be written in their natural forms (O₂, Cl₂), and chlorate does not break into single atoms.
      - |
        No hydrogen was supplied; the only reactant is the heated solid.
    answer: 1

  - slug: chem-u04-exam-q13
    type: multiple_choice
    topic_code: "4.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which combination gives no reaction?
    options:
      - "Zinc metal in silver nitrate solution"
      - "Chlorine gas bubbled through potassium bromide solution"
      - "Magnesium metal in dilute sulfuric acid"
      - "Copper metal in zinc sulfate solution"
    option_explanations:
      - |
        Zinc is far above silver; silver metal deposits on the zinc.
      - |
        Chlorine is above bromine in the halogen series; bromine is released.
      - |
        Magnesium is above hydrogen and releases H₂ from the acid.
      - |
        Correct. Copper is below zinc in the activity series and cannot displace it; the solution stays colourless and the copper unchanged.
    answer: 3

  - slug: chem-u04-exam-q14
    type: multiple_choice
    topic_code: "4.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Solutions of lead(II) nitrate and sodium sulfate are mixed. Which complete equation is correct?
    options:
      - "Pb(NO₃)₂(aq) + Na₂SO₄(aq) → PbSO₄(s) + 2 NaNO₃(aq)"
      - "Pb(NO₃)₂(aq) + Na₂SO₄(aq) → Pb(SO₄)₂(s) + NaNO₃(aq)"
      - "Pb(NO₃)₂(aq) + Na₂SO₄(aq) → no reaction"
      - "Pb(NO₃)₂(aq) + Na₂SO₄(aq) → PbSO₄(aq) + 2 NaNO₃(s)"
    option_explanations:
      - |
        Correct. Lead(II) sulfate is one of the sulfate exceptions and precipitates; sodium nitrate stays dissolved; the equation balances.
      - |
        Pb²⁺ and SO₄²⁻ combine one to one; Pb(SO₄)₂ is not a neutral formula.
      - |
        A precipitate forms (PbSO₄), so a reaction does occur.
      - |
        The state symbols are reversed: lead sulfate is the insoluble product and sodium nitrate the soluble one.
    answer: 0

  - slug: chem-u04-exam-q15
    type: multiple_choice
    topic_code: "4.3"
    source: "general knowledge"
    points: 1
    prompt: |
      An antacid tablet containing calcium carbonate fizzes in stomach acid (HCl). Which net ionic equation describes the fizzing?
    options:
      - "Ca²⁺(aq) + 2 Cl⁻(aq) → CaCl₂(aq)"
      - "CaCO₃(s) → CaO(s) + CO₂(g)"
      - "CaCO₃(s) + 2 H⁺(aq) → Ca²⁺(aq) + H₂O(l) + CO₂(g)"
      - "2 H⁺(aq) + 2 Cl⁻(aq) → H₂(g) + Cl₂(g)"
    option_explanations:
      - |
        Calcium chloride stays dissolved as separate ions; this is not a reaction, and no gas appears.
      - |
        Thermal decomposition of limestone needs strong heating, not acid; it is not what happens in the stomach.
      - |
        Correct. Carbonate plus acid gives water and carbon dioxide; chloride is the spectator and is removed from the net equation.
      - |
        Hydrochloric acid does not decompose into its elements on contact with a carbonate; the gas is CO₂.
    answer: 2

  - slug: chem-u04-exam-q16
    type: multiple_choice
    topic_code: "4.4"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    prompt: |
      What is the molar mass of ammonium sulfate, (NH₄)₂SO₄ (N 14.01, H 1.008, S 32.06, O 16.00)?
    options:
      - "114.10 g/mol"
      - "132.14 g/mol"
      - "118.11 g/mol"
      - "228.22 g/mol"
    option_explanations:
      - |
        114.10 counts a single ammonium ion; the subscript 2 doubles both the N and the four H.
      - |
        Correct. 2(14.01 + 4 × 1.008) + 32.06 + 4(16.00) = 36.07 + 32.06 + 64.00 = 132.14 g/mol (rounding the intermediate to two decimals).
      - |
        118.11 doubles the nitrogen but not the hydrogens inside the parentheses.
      - |
        228.22 doubles the sulfate as well; the subscript 2 applies only to the ammonium parentheses.
    answer: 1

  - slug: chem-u04-exam-q17
    type: multiple_choice
    topic_code: "4.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which quantity is the largest?
    options:
      - "The number of molecules in 2.0 mol of CO₂"
      - "The number of molecules in 36 g of H₂O"
      - "The number of molecules in 1.0 mol of O₂"
      - "The number of atoms in 1.0 mol of He"
    option_explanations:
      - |
        Correct. 2.0 mol is 1.2 × 10²⁴ molecules, twice any of the one-mole samples; the mass of CO₂ is irrelevant to the count.
      - |
        36 g of water is 2.0 mol, 1.2 × 10²⁴ molecules, equal to option A, but not larger.
      - |
        One mole of O₂ is 6.0 × 10²³ molecules, half of option A.
      - |
        One mole of helium is 6.0 × 10²³ atoms, half the count in two moles of carbon dioxide.
    answer: 0

  - slug: chem-u04-exam-q18
    type: multiple_choice
    topic_code: "4.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A student converts 4.5 × 10²³ molecules of water to grams. Which route is correct?
    options:
      - "Multiply by 18.02 g/mol"
      - "Divide by 18.02 g/mol, then multiply by 6.022 × 10²³"
      - "Multiply by 6.022 × 10²³, then multiply by 18.02 g/mol"
      - "Divide by 6.022 × 10²³ to get moles, then multiply by 18.02 g/mol"
    option_explanations:
      - |
        Molar mass converts moles, not molecules, to grams; the count must first become moles.
      - |
        Both operations are the wrong way round; dividing molecules by a molar mass has no meaning.
      - |
        Multiplying a molecule count by Avogadro's number gives a meaningless enormous number; dividing is required.
      - |
        Correct. 4.5 × 10²³ ÷ 6.022 × 10²³ = 0.75 mol; 0.75 mol × 18.02 g/mol = 13.5 g. Every route passes through moles.
    answer: 3

  - slug: chem-u04-exam-q19
    type: multiple_choice
    topic_code: "4.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A gas is 27.3% carbon and 72.7% oxygen by mass. What is its empirical formula?
    options:
      - "CO"
      - "C₂O₅"
      - "CO₂"
      - "C₃O₈"
    option_explanations:
      - |
        CO would be 42.9% carbon; the mole ratio here is 1 : 2, not 1 : 1.
      - |
        Using the percents as mole numbers gives roughly 27 : 73; each must be divided by its atomic mass first.
      - |
        Correct. C: 27.3 ÷ 12.01 = 2.27 mol; O: 72.7 ÷ 16.00 = 4.54 mol; divide by 2.27: 1 : 2, so CO₂.
      - |
        A 3 : 8 ratio does not match 2.27 : 4.54, which is exactly 1 : 2.
    answer: 2

  - slug: chem-u04-exam-q20
    type: multiple_choice
    topic_code: "4.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A hydrocarbon has the empirical formula CH and a molar mass of 78.1 g/mol. What is its molecular formula?
    options:
      - "C₂H₂"
      - "C₆H₆"
      - "C₄H₄"
      - "CH"
    option_explanations:
      - |
        C₂H₂ has the right ratio but a molar mass of 26.0 g/mol, a third of the measured value.
      - |
        Correct. CH weighs 13.02 g/mol; 78.1 ÷ 13.02 = 6.00, so the molecule is C₆H₆ (benzene).
      - |
        C₄H₄ would weigh 52.1 g/mol; n must be 6, not 4.
      - |
        CH itself weighs 13.02 g/mol; the molecular formula is a multiple of the empirical formula.
    answer: 1

  - slug: chem-u04-exam-q21
    type: multiple_choice
    topic_code: "4.5"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    prompt: |
      What is the mass percent of nitrogen in ammonium sulfate, (NH₄)₂SO₄ (132.14 g/mol)?
    options:
      - "21.20%"
      - "10.60%"
      - "42.40%"
      - "14.01%"
    option_explanations:
      - |
        Correct. Two nitrogen atoms: 2 × 14.01 = 28.02; 28.02 ÷ 132.14 × 100% = 21.20%.
      - |
        10.60% counts only one nitrogen; the formula contains two ammonium ions.
      - |
        42.40% doubles the correct value, as if there were four nitrogens.
      - |
        14.01 is the atomic mass of nitrogen in u, not a percentage of the compound.
    answer: 0

  - slug: chem-u04-exam-q22
    type: multiple_choice
    topic_code: "4.6"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    prompt: |
      What mass of carbon dioxide is released when 100.0 g of calcium carbonate (100.09 g/mol) decomposes completely? CaCO₃ → CaO + CO₂ (CO₂ 44.01 g/mol).
    options:
      - "100.0 g"
      - "22.0 g"
      - "56.1 g"
      - "44.0 g"
    option_explanations:
      - |
        Mass is conserved overall, but the product is split between CaO and CO₂; not all of it leaves as gas.
      - |
        22.0 g would be from 50.0 g of carbonate; the mass here is twice that.
      - |
        56.1 g is the mass of the calcium oxide that remains (0.999 mol × 56.08).
      - |
        Correct. 100.0 ÷ 100.09 = 0.999 mol CaCO₃ → 0.999 mol CO₂ × 44.01 = 44.0 g.
    answer: 3

  - slug: chem-u04-exam-q23
    type: multiple_choice
    topic_code: "4.6"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 1
    prompt: |
      What mass of hydrochloric acid (36.46 g/mol) is needed to react completely with 6.54 g of zinc (65.38 g/mol)? Zn + 2 HCl → ZnCl₂ + H₂.
    options:
      - "3.65 g"
      - "7.29 g"
      - "13.1 g"
      - "0.200 g"
    option_explanations:
      - |
        3.65 g is 0.100 mol HCl, a 1 : 1 ratio; two HCl react with each zinc.
      - |
        Correct. 6.54 ÷ 65.38 = 0.100 mol Zn × (2 mol HCl ÷ 1 mol Zn) = 0.200 mol × 36.46 = 7.29 g.
      - |
        13.1 g doubles the mass of zinc, applying the ratio to grams rather than moles.
      - |
        0.200 is the number of moles of HCl, not its mass in grams.
    answer: 1

  - slug: chem-u04-exam-q24
    type: multiple_choice
    topic_code: "4.6"
    source: "general knowledge"
    points: 1
    prompt: |
      A student calculating the mass of NaCl from 11.5 g of sodium in 2 Na + Cl₂ → 2 NaCl writes: 11.5 ÷ 22.99 = 0.500 mol Na × (2 ÷ 1) = 1.00 mol NaCl × 58.44 = 58.4 g. What went wrong?
    options:
      - "The molar mass of NaCl should be 29.22"
      - "The moles of sodium were calculated incorrectly"
      - "The wrong mole ratio was used; Na to NaCl is 2 : 2, not 1 : 2"
      - "Nothing; 58.4 g is correct"
    option_explanations:
      - |
        58.44 g/mol is the correct molar mass of NaCl.
      - |
        11.5 ÷ 22.99 = 0.500 mol is right; the first leg of the calculation is sound.
      - |
        Correct. The ratio 2 ÷ 1 belongs to NaCl : Cl₂; for Na : NaCl the coefficients are 2 and 2, so 0.500 mol Na gives 0.500 mol NaCl = 29.2 g.
      - |
        58.4 g would violate conservation of mass: 11.5 g Na plus 17.7 g Cl₂ can only give 29.2 g of product.
    answer: 2

  - slug: chem-u04-exam-q25
    type: multiple_choice
    topic_code: "4.7"
    source: "general knowledge"
    points: 1
    prompt: |
      2.0 mol of aluminum and 2.0 mol of chlorine react: 2 Al + 3 Cl₂ → 2 AlCl₃. Which reactant limits, and how much AlCl₃ forms?
    options:
      - "Cl₂ limits; 1.3 mol AlCl₃"
      - "Al limits; 2.0 mol AlCl₃"
      - "Neither limits; 2.0 mol AlCl₃"
      - "Cl₂ limits; 3.0 mol AlCl₃"
    option_explanations:
      - |
        Correct. Al ÷ 2 = 1.0; Cl₂ ÷ 3 = 0.67, so chlorine limits: 2.0 mol Cl₂ × (2 ÷ 3) = 1.3 mol AlCl₃, with 0.67 mol Al left.
      - |
        Aluminum is in excess: 2.0 mol Al would need 3.0 mol Cl₂, but only 2.0 is present.
      - |
        Equal moles are not the required 2 : 3 ratio, so one reactant does run out first.
      - |
        3.0 mol of product cannot form from 2.0 mol of chlorine; each AlCl₃ needs 1.5 Cl₂.
    answer: 0

  - slug: chem-u04-exam-q26
    type: multiple_choice
    topic_code: "4.7"
    source: "general knowledge"
    points: 1
    prompt: |
      A synthesis is reported to have a 45% yield. What does this mean?
    options:
      - "45% of the reactant was the limiting reactant"
      - "The product is 45% pure"
      - "45% of the reactants were left unreacted"
      - "The mass of product obtained was 45% of the mass that the limiting reactant could have produced"
    option_explanations:
      - |
        Percent yield compares product amounts; it says nothing about the proportions of reactants.
      - |
        Purity is a separate measurement; yield compares the recovered mass with the theoretical maximum.
      - |
        Unreacted excess is a different quantity; a low yield can occur even with all reactants consumed, through losses and side reactions.
      - |
        Correct. Percent yield = actual ÷ theoretical × 100%; 45% means a little under half of the possible product was recovered.
    answer: 3

  - slug: chem-u04-exam-q27
    type: multiple_choice
    topic_code: "3.2"
    source: "general knowledge"
    points: 1
    prompt: |
      To write the equation for iron(III) sulfate reacting with barium chloride, which formula for iron(III) sulfate is correct?
    options:
      - "FeSO₄"
      - "Fe₂(SO₄)₃"
      - "Fe₃(SO₄)₂"
      - "Fe(SO₄)₃"
    option_explanations:
      - |
        FeSO₄ is iron(II) sulfate: one Fe²⁺ balancing one SO₄²⁻.
      - |
        Correct. Two Fe³⁺ (6+) balance three SO₄²⁻ (6−); the parentheses show three whole sulfate ions.
      - |
        Three Fe³⁺ (9+) against two sulfates (4−) is far from neutral.
      - |
        One Fe³⁺ against three sulfates leaves a net charge of 3−.
    answer: 1

  - slug: chem-u04-exam-q28
    type: multiple_choice
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Carbon forms two oxides. In one, 1.00 g of carbon is combined with 1.33 g of oxygen; in the other, 1.00 g of carbon is combined with 2.66 g of oxygen. Which law do these data illustrate, and what do they show?
    options:
      - "Conservation of mass; the total mass is the same in both oxides"
      - "Definite proportions; both oxides have the same composition"
      - "Multiple proportions; the oxygen masses are in a 1 : 2 ratio because the atoms combine in whole-number ratios (CO and CO₂)"
      - "Avogadro's law; equal masses of oxygen contain equal numbers of atoms"
    option_explanations:
      - |
        The total masses differ (2.33 g against 3.66 g); conservation of mass is not what the comparison shows.
      - |
        The two oxides have different compositions; definite proportions applies within one compound.
      - |
        Correct. For a fixed mass of carbon the oxygen masses are in the small whole-number ratio 1 : 2, the signature of atoms combining one-to-one and one-to-two.
      - |
        Avogadro's law concerns gas volumes; it is not about masses of oxygen in compounds.
    answer: 2

  # ---- Select all that apply
  - slug: chem-u04-exam-q29
    type: multi_select
    topic_code: "4.2"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which equations represent decomposition reactions? Select all that apply.
    options:
      - "2 NaHCO₃ → Na₂CO₃ + H₂O + CO₂"
      - "2 Na + Cl₂ → 2 NaCl"
      - "2 H₂O → 2 H₂ + O₂"
      - "CH₄ + 2 O₂ → CO₂ + 2 H₂O"
      - "CaCO₃ → CaO + CO₂"
    option_explanations:
      - |
        Yes: one reactant breaks into three products on heating.
      - |
        No: two elements form one compound, synthesis.
      - |
        Yes: electrolysis splits one compound into two elements.
      - |
        No: oxygen is consumed and CO₂ and H₂O form, combustion.
      - |
        Yes: limestone breaks into lime and carbon dioxide on strong heating.
    answer: [0, 2, 4]
    explanation: |
      Decomposition has exactly one reactant and two or more products. Any equation with two reactants is not decomposition.

  - slug: chem-u04-exam-q30
    type: multi_select
    topic_code: "4.3"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which pairs of solutions produce a precipitate when mixed? Select all that apply.
    options:
      - "BaCl₂ and Na₂SO₄"
      - "KNO₃ and NaCl"
      - "AgNO₃ and KI"
      - "NH₄Cl and Na₂CO₃"
      - "MgCl₂ and NaOH"
    option_explanations:
      - |
        Yes: barium sulfate is insoluble (a sulfate exception).
      - |
        No: KCl and NaNO₃ are both soluble; no reaction.
      - |
        Yes: silver iodide is insoluble (an iodide exception).
      - |
        No: (NH₄)₂CO₃ and NaCl are both soluble (ammonium and group 1 compounds always dissolve).
      - |
        Yes: magnesium hydroxide is insoluble (hydroxides are, except with group 1 and ammonium).
    answer: [0, 2, 4]
    explanation: |
      Swap partners and check each product: a precipitate forms only when one of the new compounds is on the insoluble side of the rules.

  - slug: chem-u04-exam-q31
    type: multi_select
    topic_code: "4.6"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      For 2 Al + 3 Cl₂ → 2 AlCl₃, which are valid conversion factors? Select all that apply.
    options:
      - "3 mol Cl₂ ÷ 2 mol Al"
      - "2 mol AlCl₃ ÷ 3 mol Cl₂"
      - "70.90 g Cl₂ ÷ 1 mol Cl₂"
      - "3 g Cl₂ ÷ 2 g Al"
      - "35.45 g Cl₂ ÷ 1 mol Cl₂"
    option_explanations:
      - |
        Valid: the coefficients of chlorine and aluminum.
      - |
        Valid: the coefficients of product and chlorine.
      - |
        Valid: the molar mass of the Cl₂ molecule, 2 × 35.45.
      - |
        Invalid: coefficients are mole ratios, never gram ratios.
      - |
        Invalid: 35.45 g/mol is the molar mass of chlorine atoms; the equation is written with Cl₂ molecules.
    answer: [0, 1, 2]
    explanation: |
      Mole ratios come straight from coefficients; molar masses must match the species as written in the equation (Cl₂, not Cl); nothing converts grams of one substance directly to grams of another.

  # ---- True / false
  - slug: chem-u04-exam-q32
    type: true_false
    topic_code: "4.1"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: the equation N₂ + H₂ → NH₃ can be balanced by changing the product to NH₂, giving N₂ + 2 H₂ → 2 NH₂.
    answer: false
    explanation: |
      False. Changing a subscript changes the substance; NH₂ is not ammonia. Only coefficients may change: N₂ + 3 H₂ → 2 NH₃.

  - slug: chem-u04-exam-q33
    type: true_false
    topic_code: "4.4"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: one mole of sodium chloride contains 6.022 × 10²³ formula units and therefore 1.204 × 10²⁴ ions in total.
    answer: true
    explanation: |
      True. Each NaCl formula unit consists of one Na⁺ and one Cl⁻, so a mole of formula units holds two moles of ions.

  - slug: chem-u04-exam-q34
    type: true_false
    topic_code: "4.7"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: if the percent yield of a reaction is 75%, then 25% of the limiting reactant must still be present unreacted at the end.
    answer: false
    explanation: |
      False. A low yield can arise from product lost during filtering or transfer, side reactions, or impure reactants, with the limiting reactant entirely consumed. Yield measures recovered product, not leftover reactant.

