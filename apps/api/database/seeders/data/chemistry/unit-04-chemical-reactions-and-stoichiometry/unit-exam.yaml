  # ---- Short answer
  - slug: chem-u04-exam-q42
    type: short_answer
    topic_code: "4.5"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 3
    prompt: |
      A white solid is analysed: 36.5% sodium, 25.4% sulfur and 38.1% oxygen by mass (Na 22.99, S 32.06, O 16.00).

      (a) Determine the empirical formula, showing the mole calculation and the ratio step.
      (b) Name the compound.
      (c) Explain why the empirical formula is also the compound's actual formula.
    answer: |
      (a) Per 100 g: Na 36.5 ÷ 22.99 = 1.59 mol; S 25.4 ÷ 32.06 = 0.792 mol; O 38.1 ÷ 16.00 = 2.38 mol. Divide by 0.792: Na 2.00, S 1.00, O 3.01. Empirical formula Na₂SO₃.
      (b) Sodium sulfite (SO₃²⁻ is sulfite, one oxygen fewer than sulfate).
      (c) Na₂SO₃ is ionic: a lattice of Na⁺ and SO₃²⁻ ions in the simplest ratio that cancels charge. There are no molecules, so there is no separate molecular formula; the empirical formula is the formula.
    explanation: |
      Scoring: (a) 1 point for Na₂SO₃ with moles and the divide-by-smallest step shown. (b) 1 point for sodium sulfite (not sulfate, not sulfide). (c) 1 point for recognising an ionic lattice with no molecules, so no multiple of the ratio exists.

  - slug: chem-u04-exam-q43
    type: short_answer
    topic_code: "4.3"
    source: "general knowledge"
    points: 3
    prompt: |
      Two experiments: (i) potassium iodide solution is added to lead(II) acetate solution, Pb(C₂H₃O₂)₂; (ii) sodium nitrate solution is added to potassium chloride solution.

      (a) For (i), predict the products, write the balanced complete equation with state symbols, and describe what is seen.
      (b) For (i), write the net ionic equation and name the spectator ions.
      (c) For (ii), state what happens and justify it with the solubility rules.
    answer: |
      (a) Swap partners: PbI₂ and KC₂H₃O₂. Lead(II) iodide is insoluble (iodide exception for Pb²⁺); potassium acetate is soluble. Pb(C₂H₃O₂)₂(aq) + 2 KI(aq) → PbI₂(s) + 2 KC₂H₃O₂(aq). A bright yellow precipitate forms.
      (b) Pb²⁺(aq) + 2 I⁻(aq) → PbI₂(s). Spectators: K⁺ and C₂H₃O₂⁻.
      (c) No reaction. The swapped products, NaCl and KNO₃, are both soluble (group 1 compounds and all nitrates dissolve), so all four ions simply remain in solution.
    explanation: |
      Scoring: (a) 1 point for the balanced equation with PbI₂(s) and a yellow precipitate. (b) 1 point for the net ionic equation and both spectators. (c) 1 point for "no reaction" with the rule that every product is soluble.

  # ---- Long answer
  - slug: chem-u04-exam-q44
    type: long_answer
    topic_code: "4.7"
    source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
    points: 6
    prompt: |
      Iron and sulfur are heated together: Fe + S → FeS (Fe 55.85, S 32.06, FeS 87.91 g/mol). A student mixes 8.00 g of iron filings with 8.00 g of sulfur powder, heats the mixture until the glow stops, and recovers 10.9 g of iron(II) sulfide. Write a full analysis that (1) classifies the reaction and shows that the equation is balanced; (2) identifies the limiting reactant by calculation; (3) calculates the theoretical yield of FeS and the mass of excess reactant remaining; (4) calculates the percent yield; (5) checks your results against conservation of mass; and (6) explains what the student should change to make the reaction use both reactants completely, giving the required mass.
    answer: |
      (1) Synthesis: two elements form one compound. One Fe and one S on each side; balanced as written.
      (2) Fe: 8.00 ÷ 55.85 = 0.143 mol. S: 8.00 ÷ 32.06 = 0.250 mol. The ratio is 1 : 1, so the reactant with fewer moles, iron, is limiting; sulfur is in excess even though the masses are equal.
      (3) Theoretical yield: 0.143 mol Fe → 0.143 mol FeS × 87.91 = 12.6 g FeS. Sulfur used: 0.143 mol × 32.06 = 4.59 g; remaining: 8.00 − 4.59 = 3.41 g of sulfur.
      (4) Percent yield = 10.9 ÷ 12.6 × 100% = 86.5%.
      (5) Reactants consumed: 8.00 g Fe + 4.59 g S = 12.59 g; product predicted: 12.6 g FeS. Equal, as conservation of mass requires. The total mixture (16.0 g) is also unchanged: 12.6 g FeS + 3.41 g S.
      (6) Use iron and sulfur in a 1 : 1 mole ratio. For 8.00 g of sulfur (0.250 mol) that means 0.250 mol × 55.85 = 13.9 g of iron; or keep 8.00 g of iron and use only 0.143 mol × 32.06 = 4.59 g of sulfur.
    explanation: |
      Scoring (6 points). 1 point: synthesis and the balance check. 1 point: iron limiting with both mole values compared. 1 point: theoretical yield 12.6 g (accept 12.5–12.7) and 3.4 g of sulfur remaining. 1 point: 86.5% (accept 86–87%). 1 point: a conservation check in which consumed reactants equal product. 1 point: a correct mass that gives a 1 : 1 mole ratio (13.9 g Fe for 8.00 g S, or 4.59 g S for 8.00 g Fe). Deduct for choosing the limiting reactant by mass or for computing the yield from sulfur.
