    # ---- Short answer
    - slug: chem-u04-w13-q23
      type: short_answer
      topic_code: "4.3"
      source: "general knowledge"
      points: 3
      prompt: |
        Solutions of copper(II) sulfate and sodium hydroxide are mixed.

        (a) Predict the products and write the balanced complete equation with state symbols.
        (b) Identify the spectator ions and write the net ionic equation.
        (c) Describe what an observer would see, and explain what would be different if sodium nitrate were used instead of sodium hydroxide.
      answer: |
        (a) CuSO₄(aq) + 2 NaOH(aq) → Cu(OH)₂(s) + Na₂SO₄(aq). Copper(II) hydroxide is insoluble (hydroxides are, except with group 1); sodium sulfate is soluble.
        (b) Spectators: Na⁺ and SO₄²⁻. Net ionic: Cu²⁺(aq) + 2 OH⁻(aq) → Cu(OH)₂(s).
        (c) A pale blue solid (precipitate) forms in the blue solution. With sodium nitrate the swapped products, Cu(NO₃)₂ and Na₂SO₄, are both soluble, so no precipitate forms and no reaction occurs; the solution simply stays blue.
      explanation: |
        Scoring: (a) 1 point for correct formulas, balancing and the (s) on Cu(OH)₂. (b) 1 point for naming Na⁺ and SO₄²⁻ as spectators and a correct net ionic equation. (c) 1 point for a precipitate (any reasonable colour) and for recognising no reaction with sodium nitrate because all products are soluble.

    - slug: chem-u04-w13-q24
      type: short_answer
      topic_code: "4.3"
      source: "general knowledge"
      points: 3
      prompt: |
        A student has strips of magnesium, copper and an unknown metal M, plus solutions of magnesium nitrate, copper(II) nitrate and M nitrate. M placed in copper(II) nitrate becomes coated with copper; M placed in magnesium nitrate shows no change.

        (a) Place M in the activity series relative to magnesium and copper, citing the evidence for each placement.
        (b) Predict, with a reason, whether M will react with hydrochloric acid, and state what you cannot be sure of.
        (c) Write the balanced equation for M (assume M forms a 2+ ion) reacting with copper(II) nitrate.
      answer: |
        (a) M is above copper (it displaced copper from its solution) and below magnesium (it could not displace magnesium). Order: Mg > M > Cu.
        (b) Probably yes: most metals between magnesium and copper (Al, Zn, Fe, Ni, Sn, Pb) lie above hydrogen and would release H₂. But the data place M only between Mg and Cu, and hydrogen is also in that interval, so M could lie between hydrogen and copper (like a hypothetical unreactive metal); an acid test is needed to be certain.
        (c) M(s) + Cu(NO₃)₂(aq) → M(NO₃)₂(aq) + Cu(s).
      explanation: |
        Scoring: (a) 1 point for the order Mg > M > Cu with both pieces of evidence. (b) 1 point for predicting a reaction with acid with the reason that M is above copper and most such metals are above hydrogen, and for noting the uncertainty (hydrogen lies in the same interval). (c) 1 point for the balanced equation with a correctly built M(NO₃)₂.

    # ---- Long answer
    - slug: chem-u04-w13-q25
      type: long_answer
      topic_code: "4.3"
      source: "general knowledge"
      points: 6
      prompt: |
        A water sample is suspected to contain dissolved sulfate ions, carbonate ions, or both. You have dilute hydrochloric acid and barium chloride solution. Write a full account that (1) describes a test for carbonate, including the equation for the reaction with a soluble carbonate such as sodium carbonate and the observation; (2) describes a test for sulfate using barium chloride, including the equation with sodium sulfate, the observation, and the solubility rule that makes it work; (3) explains why the acid should be added before the barium chloride when both ions may be present, considering what barium carbonate would do; and (4) identifies the spectator ions in each test and gives each net ionic equation.
      answer: |
        (1) Carbonate test: add dilute hydrochloric acid. Na₂CO₃(aq) + 2 HCl(aq) → 2 NaCl(aq) + H₂O(l) + CO₂(g). Fizzing (effervescence) shows carbon dioxide escaping; the expected carbonic acid decomposes at once, and the gas leaving drives the reaction.
        (2) Sulfate test: add barium chloride solution. Na₂SO₄(aq) + BaCl₂(aq) → BaSO₄(s) + 2 NaCl(aq). A white precipitate forms because sulfates are soluble except with barium, strontium and lead (barium sulfate is an exception to the sulfate rule).
        (3) Carbonates are insoluble except with group 1 and ammonium, so barium would also precipitate white barium carbonate if carbonate were present, giving a false positive for sulfate. Adding acid first destroys any carbonate as CO₂ (and the acid does not affect sulfate), so a white precipitate that then forms with barium chloride can only be barium sulfate.
        (4) Carbonate test: spectators Na⁺ and Cl⁻; net ionic CO₃²⁻(aq) + 2 H⁺(aq) → H₂O(l) + CO₂(g). Sulfate test: spectators Na⁺ and Cl⁻; net ionic Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s).
      explanation: |
        Scoring (6 points). 1 point: balanced carbonate-acid equation with CO₂ and H₂O as products. 1 point: fizzing as the observation and gas escape as the driving force. 1 point: balanced barium chloride-sulfate equation with BaSO₄(s) and the white precipitate observation. 1 point: the solubility rule (sulfates soluble except Ba, Sr, Pb). 1 point: acid first because barium carbonate is also an insoluble white solid and would give a false positive; the acid removes carbonate as CO₂. 1 point: correct spectators and both net ionic equations. Deduct for writing H₂CO₃ as a final product or for copying subscripts into product formulas.
