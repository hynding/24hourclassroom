week: 13
unit: 4
title: "Will It React? The Activity Series and Solubility Rules"
topics: ["4.3"]
guide: guides/week-13.md
guide_description: |
  Predicting single replacement with the activity series of metals (hydrogen as the dividing line, the water and
  acid groups) and the halogen series, rebuilding each product formula from its ions; predicting double
  replacement with a short table of solubility rules, writing "no reaction" when every product stays dissolved;
  gas-forming and water-forming driving forces (carbonate plus acid, neutralization); spectator ions and the net
  ionic equation. Worked examples with lead iodide, barium sulfate, aluminum in copper(II) chloride and sodium in water.
flashcards:
  - front: Activity series rule for a free metal and a metal compound
    back: |
      A free metal replaces, from a compound, any metal below it in the series. If the free metal is lower, no reaction. Zn + CuSO₄ reacts; Cu + ZnSO₄ does not.
    topic_code: "4.3"
  - front: Activity series from most to least active (the version to memorise)
    back: |
      Li, K, Ba, Ca, Na, Mg, Al, Zn, Fe, Ni, Sn, Pb, (H), Cu, Hg, Ag, Au.
    topic_code: "4.3"
  - front: Role of hydrogen in the activity series
    back: |
      Metals above H react with acids to release H₂ gas (Mg + 2 HCl → MgCl₂ + H₂); metals below H (Cu, Hg, Ag, Au) do not react with ordinary acids.
    topic_code: "4.3"
  - front: Metals that react with cold water → products
    back: |
      Li, K, Ba, Ca, Na: metal hydroxide plus hydrogen gas. 2 Na + 2 H₂O → 2 NaOH + H₂. Treat water as H–OH.
    topic_code: "4.3"
  - front: Metals that react with steam but not cold water
    back: |
      Mg, Al, Zn, Fe: metal oxide plus hydrogen. Mg + H₂O(g) → MgO + H₂.
    topic_code: "4.3"
  - front: The noble metals at the bottom of the series
    back: |
      Cu, Hg, Ag, Au: displaced from their compounds by almost every other metal, unreactive with water and dilute acids; gold and silver are found uncombined in nature for this reason.
    topic_code: "4.3"
  - front: Halogen activity series and its rule
    back: |
      F₂ > Cl₂ > Br₂ > I₂. A halogen replaces any halogen below it: Cl₂ + 2 KBr → 2 KCl + Br₂; Br₂ + NaCl gives no reaction.
    topic_code: "4.3"
  - front: Writing the product formula in a single replacement
    back: |
      Build it from the replacing metal's own ion charge, never by copying the old subscript: Al + CuCl₂ gives AlCl₃ (Al³⁺), not AlCl₂.
    topic_code: "4.3"
  - front: Aluminum in copper(II) chloride → balanced equation
    back: |
      2 Al(s) + 3 CuCl₂(aq) → 2 AlCl₃(aq) + 3 Cu(s). Blue colour fades; brown copper deposits.
    topic_code: "4.3"
  - front: Why the activity series roughly follows periodic trends
    back: |
      Metals with low ionization energy (alkali metals) give up electrons most readily and sit at the top; metals that hold electrons tightly (Au, Ag, Cu) sit at the bottom. The order is measured, so a few neighbours differ from the trend.
    topic_code: "4.3"
  - front: Solubility rule for group 1, ammonium and nitrate compounds
    back: |
      Always soluble, no exceptions. Any compound of Na⁺, K⁺, Li⁺, NH₄⁺ or NO₃⁻ (and acetate) stays dissolved, so these ions are nearly always spectators.
    topic_code: "4.3"
  - front: Solubility rule for chlorides, bromides and iodides
    back: |
      Soluble, except with Ag⁺, Pb²⁺ and Hg₂²⁺. AgCl, PbI₂ and PbCl₂ are precipitates.
    topic_code: "4.3"
  - front: Solubility rule for sulfates
    back: |
      Soluble, except with Ba²⁺, Sr²⁺, Pb²⁺ (and Ca²⁺ only slightly). BaSO₄ is the white precipitate used to test for sulfate.
    topic_code: "4.3"
  - front: Solubility rule for carbonates, phosphates and sulfides
    back: |
      Insoluble, except with group 1 ions and ammonium. CaCO₃, Ag₃PO₄ and CuS precipitate; Na₂CO₃ and (NH₄)₂S dissolve.
    topic_code: "4.3"
  - front: Solubility rule for hydroxides
    back: |
      Insoluble, except with group 1 and ammonium (soluble) and Ca²⁺, Sr²⁺, Ba²⁺ (moderately). Fe(OH)₃ and Mg(OH)₂ precipitate.
    topic_code: "4.3"
  - front: Five-step method for predicting a double replacement
    back: |
      1. List the ions. 2. Swap partners. 3. Write each product formula from charges. 4. Check solubility; label (aq) or (s). 5. If a precipitate, gas or water forms, balance; otherwise "no reaction".
    topic_code: "4.3"
  - front: Lead(II) nitrate plus potassium iodide → equation and observation
    back: |
      Pb(NO₃)₂(aq) + 2 KI(aq) → PbI₂(s) + 2 KNO₃(aq). A bright yellow precipitate of lead(II) iodide.
    topic_code: "4.3"
  - front: Barium chloride plus sodium sulfate → equation and use
    back: |
      BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2 NaCl(aq). The white precipitate is the standard test for sulfate ions.
    topic_code: "4.3"
  - front: Mixing NaCl and KNO₃ solutions → what happens
    back: |
      No reaction. The swapped products, NaNO₃ and KCl, are both soluble, so all four ions stay dissolved and nothing has changed.
    topic_code: "4.3"
  - front: The three driving forces of a double replacement
    back: |
      A precipitate (insoluble solid), a gas that escapes, or water (neutralization). Without one of them, no reaction occurs.
    topic_code: "4.3"
  - front: Carbonate plus acid → products and why
    back: |
      Salt + water + CO₂. The expected H₂CO₃ decomposes at once: CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂. The fizz is the test for a carbonate.
    topic_code: "4.3"
  - front: Acid plus base → products and driving force
    back: |
      Salt + water (neutralization). H₂SO₄ + 2 KOH → K₂SO₄ + 2 H₂O; the formation of water drives it even though the salt stays dissolved.
    topic_code: "4.3"
  - front: Other gas-forming double replacements
    back: |
      Sulfite + acid → SO₂ + water + salt; sulfide + acid → H₂S + salt; ammonium salt + hydroxide → NH₃ + water + salt.
    topic_code: "4.3"
  - front: Spectator ion → definition and example
    back: |
      An ion dissolved before and after the reaction, unchanged. In Pb(NO₃)₂ + 2 KI → PbI₂ + 2 KNO₃ the spectators are K⁺ and NO₃⁻.
    topic_code: "4.3"
  - front: Net ionic equation → definition and example
    back: |
      The equation with spectator ions removed, showing only what changes: Pb²⁺(aq) + 2 I⁻(aq) → PbI₂(s).
    topic_code: "4.3"
  - front: Net ionic equation for any silver chloride precipitation
    back: |
      Ag⁺(aq) + Cl⁻(aq) → AgCl(s), whatever soluble silver salt and chloride were mixed.
    topic_code: "4.3"
  - front: Iron in lead(II) nitrate → product and why Fe²⁺
    back: |
      Fe + Pb(NO₃)₂ → Fe(NO₃)₂ + Pb. Iron is above lead; in simple displacement iron usually forms the 2+ ion.
    topic_code: "4.3"
  - front: Copper in hydrochloric acid → what happens
    back: |
      No reaction. Copper is below hydrogen in the activity series, so it cannot release H₂ from an acid.
    topic_code: "4.3"
  - front: Test for a carbonate and test for a sulfate → reagents
    back: |
      Carbonate: add acid, look for fizzing (CO₂). Sulfate: add barium chloride solution, look for a white precipitate (BaSO₄).
    topic_code: "4.3"
  - front: Bromine water added to potassium iodide → observation
    back: |
      Br₂ is above I₂, so Br₂ + 2 KI → 2 KBr + I₂; the solution darkens to the brown of dissolved iodine.
    topic_code: "4.3"
  - front: Silver nitrate plus calcium chloride → balanced equation
    back: |
      2 AgNO₃(aq) + CaCl₂(aq) → 2 AgCl(s) + Ca(NO₃)₂(aq). White precipitate; calcium and nitrate are spectators.
    topic_code: "4.3"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 4.3: the activity series, solubility rules and
    predicting products), with about a third reviewing earlier weeks (balancing, reaction types, ion charges and
    names, periodic trends, density and average atomic mass). Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: three unknown metals (4.3)
    - slug: chem-u04-w13-q01
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Lab results for three unknown metals X, Y and Z and their nitrate solutions: a strip of X in Y(NO₃)₂ solution becomes coated with Y. A strip of Y in Z(NO₃)₂ solution shows no change. A strip of Z in Y(NO₃)₂ solution becomes coated with Y. Only Z and X fizz in dilute hydrochloric acid.
      prompt: |
        What is the order of the three metals in the activity series, from most active to least?
      options:
        - "Y, X, Z"
        - "X, Z, Y"
        - "Z, Y, X"
        - "X, Y, Z"
      option_explanations:
        - |
          Y is replaced by both X and Z and cannot replace Z, so Y is the least active, not the most.
        - |
          Correct. X replaces Y (X above Y). Y cannot replace Z (Z above Y). Z replaces Y (Z above Y). Both X and Z react with acid; the data do not rank X against Z directly, but Y is lowest, and the only listed order with Y last is X, Z, Y.
        - |
          Z above Y is right, but Y does not replace X; X replaced Y, so X is above Y.
        - |
          Y cannot be above Z: Y showed no change in Z(NO₃)₂, while Z did replace Y.
      answer: 1

    - slug: chem-u04-w13-q02
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Lab results for three unknown metals X, Y and Z and their nitrate solutions: a strip of X in Y(NO₃)₂ solution becomes coated with Y. A strip of Y in Z(NO₃)₂ solution shows no change. A strip of Z in Y(NO₃)₂ solution becomes coated with Y. Only Z and X fizz in dilute hydrochloric acid.
      prompt: |
        Where does metal Y sit relative to hydrogen in the activity series, and what evidence shows it?
      options:
        - "Above hydrogen, because it was coated by other metals"
        - "Above hydrogen, because its nitrate dissolves in water"
        - "The data cannot say"
        - "Below hydrogen, because it does not fizz in acid"
      option_explanations:
        - |
          Being coated means Y was displaced by more active metals; that says Y is low in the series, not above hydrogen.
        - |
          Every nitrate is soluble, so that observation ranks nothing.
        - |
          The acid test is exactly the evidence that places a metal above or below hydrogen.
        - |
          Correct. A metal above hydrogen releases H₂ from acid; Y gives no fizz, so Y is below hydrogen, like copper or silver.
      answer: 3

    - slug: chem-u04-w13-q03
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Lab results for three unknown metals X, Y and Z and their nitrate solutions: a strip of X in Y(NO₃)₂ solution becomes coated with Y. A strip of Y in Z(NO₃)₂ solution shows no change. A strip of Z in Y(NO₃)₂ solution becomes coated with Y. Only Z and X fizz in dilute hydrochloric acid.
      prompt: |
        If X is zinc and Y is copper, which equation describes the first test?
      options:
        - "Zn(s) + Cu(NO₃)₂(aq) → Zn(NO₃)₂(aq) + Cu(s)"
        - "Zn(s) + Cu(NO₃)₂(aq) → ZnNO₃(aq) + Cu(s)"
        - "Cu(s) + Zn(NO₃)₂(aq) → Cu(NO₃)₂(aq) + Zn(s)"
        - "Zn(s) + Cu(NO₃)₂(aq) → no reaction"
      option_explanations:
        - |
          Correct. Zinc (Zn²⁺) replaces copper from copper(II) nitrate; zinc nitrate needs two nitrate ions for the 2+ ion, and copper metal coats the strip.
        - |
          ZnNO₃ is not a neutral formula: Zn²⁺ requires two NO₃⁻ ions.
        - |
          This is the reverse test (copper in zinc nitrate), which gives no reaction because copper is below zinc.
        - |
          A coating formed, so a reaction occurred; zinc is above copper.
      answer: 0

    # ---- Individual multiple choice (4.3)
    - slug: chem-u04-w13-q04
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which mixture of solutions produces a precipitate?
      options:
        - "NaNO₃ and KCl"
        - "NH₄Cl and Na₂SO₄"
        - "AgNO₃ and NaBr"
        - "KOH and LiNO₃"
      option_explanations:
        - |
          Swapping gives NaCl and KNO₃, both soluble (group 1 compounds); no reaction.
        - |
          Swapping gives (NH₄)₂SO₄ and NaCl, both soluble; ammonium and group 1 compounds always dissolve.
        - |
          Correct. Swapping gives AgBr, which is one of the bromide exceptions (Ag⁺), a pale yellow precipitate, and NaNO₃, which stays dissolved.
        - |
          Swapping gives KNO₃ and LiOH; group 1 hydroxides and all nitrates are soluble; no reaction.
      answer: 2

    - slug: chem-u04-w13-q05
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        What happens when a piece of silver is placed in dilute sulfuric acid?
      options:
        - "Silver dissolves and hydrogen gas is released"
        - "No reaction occurs, because silver is below hydrogen in the activity series"
        - "Silver sulfate precipitates"
        - "The acid decomposes into sulfur dioxide and water"
      option_explanations:
        - |
          Only metals above hydrogen can release H₂ from an acid; silver cannot.
        - |
          Correct. Silver, copper, mercury and gold sit below hydrogen; they do not displace it from ordinary acids.
        - |
          No silver ions form in the first place, so no silver compound can precipitate.
        - |
          Dilute sulfuric acid is stable; it does not decompose on contact with an unreactive metal.
      answer: 1

    - slug: chem-u04-w13-q06
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Sodium carbonate solution is added to hydrochloric acid. The mixture fizzes. Which equation is correct?
      options:
        - "Na₂CO₃ + 2 HCl → 2 NaCl + H₂CO₃"
        - "Na₂CO₃ + 2 HCl → 2 NaCl + H₂ + CO₃"
        - "Na₂CO₃ + HCl → NaCl + NaHCO₃ + H₂"
        - "Na₂CO₃ + 2 HCl → 2 NaCl + H₂O + CO₂"
      option_explanations:
        - |
          Carbonic acid is the expected swap product, but it decomposes immediately; the fizz is CO₂, which this equation does not show.
        - |
          "CO₃" is not a substance, and the gas from a carbonate and acid is CO₂, not H₂.
        - |
          Hydrogen gas forms when a metal reacts with acid, not when a carbonate does; this equation is also unbalanced.
        - |
          Correct. Carbonate plus acid gives a salt, water and carbon dioxide; the gas escaping drives the reaction.
      answer: 3

    - slug: chem-u04-w13-q07
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Chlorine gas is bubbled through a solution of sodium iodide. What is observed, and why?
      options:
        - "The solution turns brown as iodine forms, because chlorine is more active than iodine"
        - "No change, because both are halogens"
        - "A white precipitate of sodium chloride forms"
        - "Hydrogen gas is released"
      option_explanations:
        - |
          Correct. Cl₂ is above I₂ in the halogen series: Cl₂ + 2 NaI → 2 NaCl + I₂, and dissolved iodine is brown.
        - |
          A more active halogen does displace a less active one; only the reverse (I₂ with NaCl) gives no reaction.
        - |
          Sodium chloride is soluble and stays dissolved; the visible change is the colour of iodine.
        - |
          No hydrogen is present in either reactant.
      answer: 0

    - slug: chem-u04-w13-q08
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        In the reaction Ba(NO₃)₂(aq) + K₂SO₄(aq) → BaSO₄(s) + 2 KNO₃(aq), which ions are spectators?
      options:
        - "Ba²⁺ and SO₄²⁻"
        - "Ba²⁺ and K⁺"
        - "K⁺ and NO₃⁻"
        - "SO₄²⁻ and NO₃⁻"
      option_explanations:
        - |
          Barium and sulfate are the ions that combine into the precipitate; they are the ones that change.
        - |
          Potassium is a spectator, but barium leaves the solution as BaSO₄.
        - |
          Correct. K⁺ and NO₃⁻ are dissolved before and after; the net ionic equation is Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s).
        - |
          Nitrate is a spectator, but sulfate ends up in the solid.
      answer: 2

    - slug: chem-u04-w13-q09
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Calcium metal is dropped into cold water. Which products form?
      options:
        - "CaO and H₂"
        - "Ca(OH)₂ and H₂"
        - "CaH₂ and O₂"
        - "No reaction; calcium is below hydrogen"
      option_explanations:
        - |
          The oxide forms with steam for the mid-series metals; with cold water the very active metals give the hydroxide.
        - |
          Correct. Ca + 2 H₂O → Ca(OH)₂ + H₂; calcium is in the group that reacts with cold water, replacing one hydrogen of each H–OH.
        - |
          Calcium hydride is not formed from water, and oxygen is not released by this reaction.
        - |
          Calcium is near the top of the series, well above hydrogen.
      answer: 1

    - slug: chem-u04-w13-q10
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which pair of solutions, when mixed, gives no reaction?
      options:
        - "FeCl₃ and NaOH"
        - "Pb(NO₃)₂ and KI"
        - "CaCl₂ and Na₂CO₃"
        - "MgSO₄ and KNO₃"
      option_explanations:
        - |
          Iron(III) hydroxide is insoluble (hydroxides are, except with group 1); a brown precipitate forms.
        - |
          Lead(II) iodide is an iodide exception and precipitates as a yellow solid.
        - |
          Calcium carbonate is insoluble (carbonates are, except with group 1 and ammonium); a white precipitate forms.
        - |
          Correct. The swap gives Mg(NO₃)₂ and K₂SO₄: all nitrates and all potassium compounds dissolve, so every ion stays in solution.
      answer: 3

    # ---- Spiral multiple choice (4.1, 3.1, 2.8)
    - slug: chem-u04-w13-q11
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Iron displaces silver from silver nitrate, forming iron(II) nitrate. What is the balanced equation?
      options:
        - "Fe + 2 AgNO₃ → Fe(NO₃)₂ + 2 Ag"
        - "Fe + AgNO₃ → FeNO₃ + Ag"
        - "2 Fe + 2 AgNO₃ → 2 Fe(NO₃)₂ + 2 Ag"
        - "Fe + 2 AgNO₃ → Fe(NO₃)₂ + Ag₂"
      option_explanations:
        - |
          Correct. Fe²⁺ needs two nitrate ions, so two AgNO₃ are consumed and two silver atoms are released; every element balances.
        - |
          FeNO₃ is not neutral (Fe²⁺ with one NO₃⁻); the product formula must be built from the charges.
        - |
          Nitrate does not balance: two on the left, four on the right. The coefficients also share no common factor only because they are wrong.
        - |
          Silver metal is written as single atoms, Ag, not as Ag₂; it is not one of the diatomic elements.
      answer: 0

    - slug: chem-u04-w13-q12
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Magnesium replaces hydrogen from phosphoric acid, H₃PO₄. Which formula for the magnesium salt is correct, and why?
      options:
        - "MgPO₄, because the subscripts are copied from the acid"
        - "Mg₃(PO₄)₂, because three Mg²⁺ balance two PO₄³⁻"
        - "Mg₂(PO₄)₃, because two Mg²⁺ balance three PO₄³⁻"
        - "Mg(PO₄)₂, because magnesium is 2+"
      option_explanations:
        - |
          Subscripts are never copied; Mg²⁺ and PO₄³⁻ do not cancel one to one.
        - |
          Correct. Three 2+ charges (6+) balance two 3− charges (6−); the equation is 3 Mg + 2 H₃PO₄ → Mg₃(PO₄)₂ + 3 H₂.
        - |
          Two 2+ charges (4+) against three 3− charges (9−) leave a net charge of 5−.
        - |
          One Mg²⁺ against two phosphate ions gives a net charge of 4−.
      answer: 1

    - slug: chem-u04-w13-q13
      type: multiple_choice
      topic_code: "2.8"
      source: "general knowledge"
      points: 1
      prompt: |
        The halogen activity series is F₂ > Cl₂ > Br₂ > I₂. Which periodic trend explains this order?
      options:
        - "Atomic radius increases up the group, so the small atoms react faster"
        - "Ionization energy decreases up the group, so fluorine loses electrons most easily"
        - "Electronegativity increases up the group, so fluorine pulls an electron away most strongly"
        - "Metallic character increases up the group"
      option_explanations:
        - |
          Radius decreases up the group, and the explanation is about attracting an electron, not speed.
        - |
          Halogens gain electrons when they react; ionization energy, the cost of losing one, is the wrong property, and it increases up the group anyway.
        - |
          Correct. A halogen reacts by taking an electron; the most electronegative halogen, fluorine, takes it most readily and so displaces every halogen below it.
        - |
          Metallic character increases down a group, and halogens are nonmetals; this is the reverse of the trend.
      answer: 2

    # ---- Select all that apply
    - slug: chem-u04-w13-q14
      type: multi_select
      topic_code: "4.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which compounds are insoluble in water according to the solubility rules? Select all that apply.
      options:
        - "AgCl"
        - "K₃PO₄"
        - "CaCO₃"
        - "PbSO₄"
        - "NH₄OH"
      option_explanations:
        - |
          Insoluble: chlorides dissolve except with silver, lead and mercury(I).
        - |
          Soluble: every potassium compound dissolves, even though most phosphates do not.
        - |
          Insoluble: carbonates dissolve only with group 1 ions and ammonium.
        - |
          Insoluble: sulfates dissolve except with barium, strontium and lead.
        - |
          Soluble: ammonium compounds always dissolve.
      answer: [0, 2, 3]
      explanation: |
        Apply the rules: group 1 and ammonium compounds are always soluble; AgCl, CaCO₃ and PbSO₄ are each a listed exception or an insoluble class.

    - slug: chem-u04-w13-q15
      type: multi_select
      topic_code: "4.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of these single replacement reactions will actually occur? Select all that apply.
      options:
        - "Zn + Pb(NO₃)₂"
        - "Cu + ZnSO₄"
        - "Mg + HCl"
        - "Au + CuCl₂"
        - "Br₂ + KI"
      option_explanations:
        - |
          Yes: zinc is above lead, so zinc replaces lead.
        - |
          No: copper is below zinc and cannot displace it.
        - |
          Yes: magnesium is above hydrogen and releases H₂ from acid.
        - |
          No: gold is at the very bottom of the series and displaces nothing.
        - |
          Yes: bromine is above iodine in the halogen series and displaces it.
      answer: [0, 2, 4]
      explanation: |
        A free element replaces only an element below it in its series. Zn above Pb, Mg above H and Br₂ above I₂ react; Cu below Zn and Au below Cu do not.

    # ---- True / false
    - slug: chem-u04-w13-q16
      type: true_false
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: when two solutions are mixed and every possible product is soluble, a double replacement reaction still occurs but is invisible.
      answer: false
      explanation: |
        False. With no precipitate, gas or water to remove ions, the four ions simply remain dissolved together; nothing has changed, and we write "no reaction".

    - slug: chem-u04-w13-q17
      type: true_false
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: the precipitate formed from iron(III) chloride and sodium hydroxide is correctly named iron(III) hydroxide and has the formula Fe(OH)₃.
      answer: true
      explanation: |
        True. Fe³⁺ needs three hydroxide ions; the Roman numeral carries over because iron keeps its 3+ charge through the double replacement.

    # ---- Fill in the blank
    - slug: chem-u04-w13-q18
      type: fill_blank
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        When solutions of silver nitrate and sodium chloride are mixed, the white solid that forms is silver ____. (Write the name of the anion part, one word.)
      answer: ["chloride"]
      explanation: |
        Silver chloride, AgCl: chlorides are soluble except with Ag⁺, Pb²⁺ and Hg₂²⁺.

