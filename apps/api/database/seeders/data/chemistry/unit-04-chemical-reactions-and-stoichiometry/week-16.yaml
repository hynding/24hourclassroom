week: 16
unit: 4
title: "Limiting Reactant and Percent Yield"
topics: ["4.7"]
guide: guides/week-16.md
guide_description: |
  The limiting reactant as the one that runs out first (the sandwich analogy, then 2 H₂ + O₂ in moles), a
  five-step method that compares reactants through the mole ratio, the theoretical yield from the limiting
  reactant only, and the mass of excess reactant left. Then theoretical, actual and percent yield, working the
  formula in every direction, the reasons real yields fall short and why a yield above 100% signals a problem.
  Worked examples on aluminum with chlorine, nitrogen with hydrogen, zinc with sulfur and calcium carbonate with acid.
flashcards:
  - front: Limiting reactant → definition
    back: |
      The reactant that is completely used up first; when it is gone the reaction stops, so it sets the maximum amount of product.
    topic_code: "4.7"
  - front: Excess reactant → definition
    back: |
      A reactant that is not fully consumed; some of it remains when the limiting reactant runs out.
    topic_code: "4.7"
  - front: The sandwich analogy for limiting reactants
    back: |
      2 bread + 1 cheese → 1 sandwich. With 10 bread and 3 cheese you get 3 sandwiches and 4 bread left: cheese limits even though bread is more plentiful by count.
    topic_code: "4.7"
  - front: 5.0 mol H₂ with 2.0 mol O₂ → which limits and how much water
    back: |
      H₂ needs 2.5 mol O₂; only 2.0 present, so O₂ limits. Water = 2.0 × 2 = 4.0 mol; 1.0 mol H₂ left over.
    topic_code: "4.7"
  - front: Why the reactant with the smaller mass need not be limiting
    back: |
      Mass says nothing about moles (light substances give many moles per gram) and the coefficients may demand several moles of one reactant per mole of the other. Compare moles through the ratio.
    topic_code: "4.7"
  - front: Five steps for a limiting-reactant problem
    back: |
      1. Balance. 2. Moles of each reactant. 3. Use the ratio to see whether one reactant has enough of the other; the one in short supply limits. 4. Product from the limiting reactant only. 5. Excess left = present − needed.
    topic_code: "4.7"
  - front: Divide-by-coefficient shortcut for the limiting reactant
    back: |
      Divide each reactant's moles by its coefficient; the smaller result is the limiting reactant. 0.371 mol Al ÷ 2 = 0.185; 0.423 mol Cl₂ ÷ 3 = 0.141 → Cl₂ limits.
    topic_code: "4.7"
  - front: Aluminum (10.0 g) with chlorine (30.0 g) → limiting reactant
    back: |
      2 Al + 3 Cl₂ → 2 AlCl₃. Al 0.371 mol needs 0.556 mol Cl₂; only 0.423 mol present. Chlorine limits despite having three times the mass.
    topic_code: "4.7"
  - front: Theoretical yield of AlCl₃ from 0.423 mol Cl₂
    back: |
      0.423 × (2 ÷ 3) = 0.282 mol AlCl₃ × 133.33 g/mol = 37.6 g.
    topic_code: "4.7"
  - front: Excess aluminum left after chlorine runs out
    back: |
      Al used = 0.423 × (2 ÷ 3) = 0.282 mol = 7.61 g; left = 10.0 − 7.61 = 2.4 g. Check: 7.61 + 30.0 = 37.6 g of product.
    topic_code: "4.7"
  - front: Nitrogen (28.0 g) with hydrogen (9.00 g) → limiting reactant and ammonia
    back: |
      N₂ 0.999 mol needs 3.00 mol H₂; 4.46 mol present, so N₂ limits. NH₃ = 2.00 mol = 34.0 g; 2.95 g H₂ remains.
    topic_code: "4.7"
  - front: Counterexample to "fewer moles always limits"
    back: |
      N₂ + 3 H₂ → 2 NH₃ with 1.0 mol N₂ and 2.0 mol H₂: hydrogen has more moles but needs to be 3.0 mol, so hydrogen limits.
    topic_code: "4.7"
  - front: Zinc (10.0 g) with sulfur (5.00 g) → limiting reactant and ZnS
    back: |
      Zn + S → ZnS. Zn 0.153 mol, S 0.156 mol; 1 : 1 ratio so zinc, the smaller count, limits. ZnS = 0.153 × 97.44 = 14.9 g.
    topic_code: "4.7"
  - front: Calcium carbonate (10.0 g) with HCl (5.00 g) → CO₂ produced
    back: |
      CaCO₃ 0.0999 mol needs 0.200 mol HCl; 0.137 present, so HCl limits. CO₂ = 0.137 ÷ 2 = 0.0686 mol = 3.02 g.
    topic_code: "4.7"
  - front: Which reactant's moles give the theoretical yield
    back: |
      Only the limiting reactant's. Using the excess reactant overstates the product; adding both reactants' products double-counts.
    topic_code: "4.7"
  - front: Theoretical yield → definition
    back: |
      The maximum mass of product calculated from the limiting reactant, assuming the reaction goes to completion with no losses.
    topic_code: "4.7"
  - front: Actual yield → definition
    back: |
      The mass of product really recovered in the experiment, measured on a balance; almost always less than theoretical.
    topic_code: "4.7"
  - front: Percent yield → formula
    back: |
      Percent yield = (actual yield ÷ theoretical yield) × 100%. 30.1 g recovered from a 37.6 g theoretical yield is 80.1%.
    topic_code: "4.7"
  - front: Finding actual yield from a known percent yield
    back: |
      Actual = (percent ÷ 100) × theoretical. A 65.0% process with a 14.9 g theoretical yield gives 9.69 g.
    topic_code: "4.7"
  - front: Finding the theoretical yield needed for a target amount
    back: |
      Theoretical = actual ÷ (percent ÷ 100). To obtain 12.0 g at 65.0% yield, plan for 18.5 g theoretical, so scale up the reactants.
    topic_code: "4.7"
  - front: Reasons an actual yield is below 100%
    back: |
      Product left on filter paper, in solution or on glassware; incomplete reaction or equilibrium; side reactions; impure reactants; transfer and weighing losses.
    topic_code: "4.7"
  - front: What a yield above 100% means
    back: |
      Impure or wet product (extra mass that is not product), or an error. Mass is conserved; extra product cannot be created.
    topic_code: "4.7"
  - front: Impure reactant → effect on theoretical yield
    back: |
      Only the pure portion reacts: 10.0 g of a 95% pure sample contains 9.5 g of reactant, so the theoretical yield must be computed from 9.5 g.
    topic_code: "4.7"
  - front: Percent yield versus percent composition
    back: |
      Percent yield compares what you got with what was possible in a reaction. Percent composition is the fixed mass fraction of an element in a compound. Different questions.
    topic_code: "4.7"
  - front: Conservation check in a limiting-reactant problem
    back: |
      Mass of limiting reactant + mass of excess reactant actually used = mass of product. 7.61 g Al + 30.0 g Cl₂ = 37.6 g AlCl₃.
    topic_code: "4.7"
  - front: Why manufacturers watch percent yield
    back: |
      A 40% yield wastes over half the raw material; raising it to 80% doubles output for the same input. Yield often decides whether a process is worth running.
    topic_code: "4.7"
  - front: Excess reactant left → how to calculate in grams
    back: |
      Moles needed (from the limiting reactant and the ratio) subtracted from moles present, then multiplied by the molar mass of the excess reactant.
    topic_code: "4.7"
  - front: Magnesium (20.0 g) with oxygen (20.0 g) → which limits
    back: |
      2 Mg + O₂ → 2 MgO. Mg 0.823 mol needs 0.411 mol O₂; 0.625 mol present, so magnesium limits. MgO = 0.823 × 40.31 = 33.2 g.
    topic_code: "4.7"
  - front: Iron (4.0 mol) with oxygen (2.0 mol) → which limits
    back: |
      4 Fe + 3 O₂ → 2 Fe₂O₃. Fe ÷ 4 = 1.0; O₂ ÷ 3 = 0.67, so oxygen limits. Fe₂O₃ = 2.0 × (2 ÷ 3) = 1.33 mol; iron left = 4.0 − 2.67 = 1.33 mol.
    topic_code: "4.7"
  - front: Percent yield of ZnS when 12.8 g is recovered from 10.0 g Zn
    back: |
      Theoretical 14.9 g; 12.8 ÷ 14.9 × 100% = 85.9%.
    topic_code: "4.7"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 4.7: limiting reactant, theoretical and percent
    yield), with about a third reviewing earlier weeks (mass-to-mass stoichiometry, molar mass, balancing,
    reaction types, conservation of mass and percent composition). Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: aluminum and chlorine (4.7)
    - slug: chem-u04-w16-q01
      type: multiple_choice
      topic_code: "4.7"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      stimulus: |
        10.0 g of aluminum is heated with 30.0 g of chlorine gas: 2 Al + 3 Cl₂ → 2 AlCl₃. Molar masses: Al 26.98 g/mol, Cl₂ 70.90 g/mol, AlCl₃ 133.33 g/mol. Moles present: Al 0.371 mol, Cl₂ 0.423 mol.
      prompt: |
        Which reactant is limiting, and why?
      options:
        - "Aluminum, because 10.0 g is less than 30.0 g"
        - "Chlorine, because 0.371 mol Al needs 0.556 mol Cl₂ and only 0.423 mol is present"
        - "Aluminum, because 0.371 mol is fewer moles than 0.423 mol"
        - "Neither; the reactants are in exactly the right ratio"
      option_explanations:
        - |
          Mass alone decides nothing; the comparison must be made in moles through the mole ratio.
        - |
          Correct. The ratio demands 3 mol Cl₂ per 2 mol Al; the chlorine present falls short of that, so chlorine runs out first.
        - |
          Fewer moles would decide only for a 1 : 1 ratio; here each mole of aluminum needs 1.5 mol of chlorine.
        - |
          The exact ratio would be 0.371 : 0.556; the chlorine present (0.423) is well below that.
      answer: 1

    - slug: chem-u04-w16-q02
      type: multiple_choice
      topic_code: "4.7"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      stimulus: |
        10.0 g of aluminum is heated with 30.0 g of chlorine gas: 2 Al + 3 Cl₂ → 2 AlCl₃. Molar masses: Al 26.98 g/mol, Cl₂ 70.90 g/mol, AlCl₃ 133.33 g/mol. Moles present: Al 0.371 mol, Cl₂ 0.423 mol.
      prompt: |
        What is the theoretical yield of aluminum chloride?
      options:
        - "49.5 g"
        - "40.0 g"
        - "56.4 g"
        - "37.6 g"
      option_explanations:
        - |
          49.5 g comes from the aluminum (0.371 mol × 133.33); aluminum is in excess and cannot set the yield.
        - |
          Adding the two reactant masses is not the product mass, because 2.4 g of aluminum is left unreacted.
        - |
          56.4 g uses a 1 : 1 ratio between Cl₂ and AlCl₃; the ratio is 3 : 2.
        - |
          Correct. 0.423 mol Cl₂ × (2 mol AlCl₃ ÷ 3 mol Cl₂) = 0.282 mol × 133.33 g/mol = 37.6 g.
      answer: 3

    - slug: chem-u04-w16-q03
      type: multiple_choice
      topic_code: "4.7"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      stimulus: |
        10.0 g of aluminum is heated with 30.0 g of chlorine gas: 2 Al + 3 Cl₂ → 2 AlCl₃. Molar masses: Al 26.98 g/mol, Cl₂ 70.90 g/mol, AlCl₃ 133.33 g/mol. Moles present: Al 0.371 mol, Cl₂ 0.423 mol.
      prompt: |
        A student recovers 30.1 g of aluminum chloride. What is the percent yield?
      options:
        - "80.1%"
        - "75.3%"
        - "125%"
        - "60.8%"
      option_explanations:
        - |
          Correct. 30.1 g actual ÷ 37.6 g theoretical × 100% = 80.1%.
        - |
          75.3% divides by 40.0 g, the sum of the reactant masses, which is not the theoretical yield.
        - |
          125% inverts the fraction (theoretical ÷ actual); a yield above 100% would signal impure product, not success.
        - |
          60.8% divides by 49.5 g, the yield wrongly computed from the excess aluminum.
      answer: 0

    # ---- Individual multiple choice (4.7)
    - slug: chem-u04-w16-q04
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        1.0 mol of N₂ and 2.0 mol of H₂ are mixed: N₂ + 3 H₂ → 2 NH₃. Which statement is correct?
      options:
        - "N₂ limits because it has fewer moles"
        - "The reactants are in the correct ratio"
        - "H₂ limits because 1.0 mol N₂ needs 3.0 mol H₂ and only 2.0 mol is present"
        - "N₂ limits because nitrogen is heavier"
      option_explanations:
        - |
          Fewer moles does not mean limiting; the ratio requires three times as many moles of hydrogen as nitrogen.
        - |
          The correct ratio would be 1.0 : 3.0; hydrogen falls one mole short.
        - |
          Correct. Hydrogen runs out first; only 0.67 mol N₂ reacts, giving 1.33 mol NH₃, and 0.33 mol N₂ is left.
        - |
          Molar mass is irrelevant once amounts are in moles.
      answer: 2

    - slug: chem-u04-w16-q05
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the best explanation of why an actual yield is usually less than the theoretical yield?
      options:
        - "Some product is lost in transfers, stays dissolved or on the filter, or the reaction does not go to completion"
        - "The theoretical yield is calculated with rounded molar masses"
        - "Mass is not perfectly conserved in chemical reactions"
        - "The limiting reactant is never completely used up"
      option_explanations:
        - |
          Correct. Mechanical losses, incomplete reaction, side reactions and impure reactants all reduce what is recovered.
        - |
          Rounding molar masses changes the theoretical value by a fraction of a percent, far less than typical yield losses.
        - |
          Mass is conserved; the missing product is somewhere (in solution, on glassware, as by-products), not destroyed.
        - |
          By definition the limiting reactant is the one consumed completely if the reaction goes to completion.
      answer: 0

    - slug: chem-u04-w16-q06
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A student reports a percent yield of 108% for a precipitate that was filtered and weighed immediately. What is the most likely explanation?
      options:
        - "The reaction produced extra product from the excess reactant"
        - "The theoretical yield was calculated from the wrong reactant and is too high"
        - "Mass was created during the reaction"
        - "The precipitate was still wet, so water added to its mass"
      option_explanations:
        - |
          The excess reactant cannot react once the limiting reactant is gone; no extra product forms.
        - |
          Using the wrong reactant makes the theoretical yield too high and the percent yield too low, not above 100%.
        - |
          Mass is conserved; a yield above 100% is never a real gain.
        - |
          Correct. Weighing a product that still contains water or other impurities overstates the actual yield; drying it would bring the figure below 100%.
      answer: 3

    - slug: chem-u04-w16-q07
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A reaction has a known yield of 60.0%. A chemist needs 12.0 g of product. What theoretical yield must the chemist plan for?
      options:
        - "7.20 g"
        - "20.0 g"
        - "12.0 g"
        - "72.0 g"
      option_explanations:
        - |
          7.20 g is 60.0% of 12.0 g, the amount that would be recovered if 12.0 g were the theoretical yield; it is the wrong direction.
        - |
          Correct. Theoretical = actual ÷ 0.600 = 12.0 ÷ 0.600 = 20.0 g; the reactants must be scaled to produce 20.0 g in theory.
        - |
          Planning for 12.0 g theoretical would recover only 7.20 g at this yield.
        - |
          72.0 g multiplies by 6 rather than dividing by 0.6.
      answer: 1

    - slug: chem-u04-w16-q08
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        4.0 mol of Fe and 2.0 mol of O₂ react: 4 Fe + 3 O₂ → 2 Fe₂O₃. How many moles of Fe₂O₃ form?
      options:
        - "2.0 mol"
        - "4.0 mol"
        - "1.3 mol"
        - "0.67 mol"
      option_explanations:
        - |
          2.0 mol would come from the iron (4.0 × 2 ÷ 4), but iron is in excess; oxygen limits.
        - |
          4.0 mol ignores both the ratio and the limiting reactant.
        - |
          Correct. Fe ÷ 4 = 1.0 and O₂ ÷ 3 = 0.67, so oxygen limits: 2.0 mol O₂ × (2 ÷ 3) = 1.3 mol Fe₂O₃, with 1.3 mol Fe left over.
        - |
          0.67 is the oxygen moles divided by its coefficient, a comparison number, not the product amount.
      answer: 2

    - slug: chem-u04-w16-q09
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        In a limiting-reactant problem, how is the mass of excess reactant remaining found?
      options:
        - "Subtract the limiting reactant's mass from the excess reactant's mass"
        - "It equals the theoretical yield minus the limiting reactant's mass"
        - "Divide the excess reactant's mass by its coefficient"
        - "Subtract the moles of excess reactant consumed (from the limiting reactant and the ratio) from the moles present, then convert to grams"
      option_explanations:
        - |
          Masses of different substances cannot be subtracted; the amount consumed depends on the mole ratio.
        - |
          The theoretical yield is a product mass; it does not give the leftover reactant directly.
        - |
          Dividing by the coefficient is part of the shortcut for identifying the limiting reactant, not for the leftover.
        - |
          Correct. Present minus consumed, in moles, times the excess reactant's molar mass: 0.371 − 0.282 = 0.089 mol Al × 26.98 = 2.4 g.
      answer: 3

    - slug: chem-u04-w16-q10
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A 60.0 g sample of limestone is 80.0% calcium carbonate by mass. Before calculating the theoretical yield of CO₂ from CaCO₃ → CaO + CO₂, what mass of CaCO₃ should be used?
      options:
        - "60.0 g"
        - "48.0 g"
        - "75.0 g"
        - "12.0 g"
      option_explanations:
        - |
          Only the calcium carbonate reacts; the 20% of other minerals must be excluded.
        - |
          Correct. 0.800 × 60.0 g = 48.0 g of CaCO₃ is present, and the yield is computed from that.
        - |
          75.0 g divides by 0.800 instead of multiplying; the pure portion cannot exceed the sample's mass.
        - |
          12.0 g is the mass of the impurities, not of the carbonate.
      answer: 1

    # ---- Spiral multiple choice (4.6, 4.4, 4.1)
    - slug: chem-u04-w16-q11
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        With excess aluminum, what mass of AlCl₃ (133.33 g/mol) forms from 0.300 mol of Cl₂ in 2 Al + 3 Cl₂ → 2 AlCl₃?
      options:
        - "26.7 g"
        - "40.0 g"
        - "60.0 g"
        - "13.3 g"
      option_explanations:
        - |
          Correct. 0.300 mol Cl₂ × (2 mol AlCl₃ ÷ 3 mol Cl₂) = 0.200 mol × 133.33 g/mol = 26.7 g.
        - |
          40.0 g uses a 1 : 1 ratio; only two AlCl₃ form for every three Cl₂.
        - |
          60.0 g inverts the ratio (3 ÷ 2), giving more product moles than chlorine moles.
        - |
          13.3 g halves the moles of chlorine, which no coefficient in the equation justifies.
      answer: 0

    - slug: chem-u04-w16-q12
      type: multiple_choice
      topic_code: "4.4"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 1
      prompt: |
        Why does 9.00 g of hydrogen gas (H₂, 2.016 g/mol) contain far more moles than 28.0 g of nitrogen gas (N₂, 28.02 g/mol)?
      options:
        - "Hydrogen is a lighter element, so a gram of it holds fewer molecules"
        - "Nitrogen molecules are larger, so they take up more moles per gram"
        - "Moles are mass divided by molar mass, and hydrogen's molar mass is about fourteen times smaller"
        - "It does not; 28.0 g of nitrogen is more moles because it is more grams"
      option_explanations:
        - |
          A gram of a lighter substance holds more molecules, not fewer.
        - |
          Molecule size is not what counts; molar mass is, and a larger molar mass means fewer moles per gram.
        - |
          Correct. 9.00 ÷ 2.016 = 4.46 mol H₂ against 28.0 ÷ 28.02 = 0.999 mol N₂; the small molar mass of H₂ gives many moles per gram.
        - |
          Grams do not translate directly into moles; the comparison requires molar masses.
      answer: 2

    - slug: chem-u04-w16-q13
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A student balances the zinc-sulfur reaction as Zn + S₈ → ZnS and uses it to find the limiting reactant. What must be fixed first?
      options:
        - "Sulfur should be written S, as the molar mass table uses"
        - "The equation must be balanced (8 Zn + S₈ → 8 ZnS) before any mole ratio can be read from it"
        - "Nothing; the ratio of Zn to ZnS is 1 : 1 either way"
        - "Zinc should be written Zn₂"
      option_explanations:
        - |
          S₈ is a legitimate way to write solid sulfur; the problem is that the equation is not balanced.
        - |
          Correct. An unbalanced equation gives a wrong ratio (1 Zn per S₈ instead of 8), so the limiting reactant and the yield would both be wrong.
        - |
          The Zn : ZnS ratio may survive, but the Zn : S₈ ratio, needed to find the limiting reactant, is wrong by a factor of 8.
        - |
          Zinc is a metal written as single atoms; it is not diatomic.
      answer: 1

    # ---- Select all that apply
    - slug: chem-u04-w16-q14
      type: multi_select
      topic_code: "4.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the limiting reactant are correct? Select all that apply.
      options:
        - "It is completely consumed when the reaction goes to completion"
        - "It is always the reactant present in the smaller mass"
        - "It determines the theoretical yield"
        - "It can be identified by dividing each reactant's moles by its coefficient and taking the smaller result"
        - "Adding more of it would produce no more product"
      option_explanations:
        - |
          Correct: by definition it runs out first.
        - |
          Wrong: 30.0 g of chlorine limited against 10.0 g of aluminum; the comparison is in moles through the ratio.
        - |
          Correct: the product is calculated from the limiting reactant's moles.
        - |
          Correct: this shortcut compares each reactant with what the ratio demands.
        - |
          Wrong: adding more of the limiting reactant does make more product (until the other reactant becomes limiting); adding more of the excess reactant does not.
      answer: [0, 2, 3]
      explanation: |
        The limiting reactant is the one that runs out, found by comparing moles through the mole ratio; it, not the smaller mass, fixes the yield.

    - slug: chem-u04-w16-q15
      type: multi_select
      topic_code: "4.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which could lower the percent yield of a precipitate that is filtered, dried and weighed? Select all that apply.
      options:
        - "Some precipitate passes through the filter paper"
        - "The reactant solution was more concentrated than the label stated"
        - "A side reaction consumed part of a reactant"
        - "Product was left on the walls of the beaker"
        - "The precipitate was weighed before it was fully dry"
      option_explanations:
        - |
          Yes: lost product is not weighed, so the actual yield falls.
        - |
          No: more reactant than expected would raise the actual yield relative to the calculated theoretical value, not lower it.
        - |
          Yes: reactant diverted to another product cannot form the intended one.
        - |
          Yes: product not transferred to the filter is never weighed.
        - |
          No: residual water adds mass and raises the apparent yield.
      answer: [0, 2, 3]
      explanation: |
        Anything that loses product or diverts reactant lowers the yield; extra reactant or residual water raises the apparent yield, sometimes above 100%.

    # ---- True / false
    - slug: chem-u04-w16-q16
      type: true_false
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: once the limiting reactant is consumed, the excess reactant continues to react and produces additional product.
      answer: false
      explanation: |
        False. With no limiting reactant left there is nothing for the excess to react with; the leftover excess remains unchanged in the mixture.

    - slug: chem-u04-w16-q17
      type: true_false
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: in the aluminum-chlorine reaction, the mass of AlCl₃ formed (37.6 g) equals the mass of chlorine used (30.0 g) plus the mass of aluminum actually consumed (7.6 g), not the aluminum originally added (10.0 g).
      answer: true
      explanation: |
        True. Conservation of mass applies to what reacts: 30.0 + 7.6 = 37.6 g. The 2.4 g of unreacted aluminum is still aluminum, and the total mass of the mixture (40.0 g) is also unchanged.

    # ---- Fill in the blank
    - slug: chem-u04-w16-q18
      type: fill_blank
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The maximum mass of product that can form from the limiting reactant, calculated before the experiment, is called the ____ yield.
      answer: ["theoretical"]
      explanation: |
        Theoretical yield. The actual yield is what is recovered; percent yield compares the two.

