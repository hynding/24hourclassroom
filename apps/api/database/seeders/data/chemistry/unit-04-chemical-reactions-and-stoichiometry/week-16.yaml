    # ---- Short answer
    - slug: chem-u04-w16-q23
      type: short_answer
      topic_code: "4.7"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 3
      prompt: |
        10.0 g of calcium carbonate reacts with 5.00 g of hydrochloric acid: CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂ (CaCO₃ 100.09, HCl 36.46, CO₂ 44.01 g/mol).

        (a) Determine the limiting reactant, showing the mole comparison.
        (b) Calculate the theoretical yield of carbon dioxide.
        (c) Calculate the mass of the excess reactant left over.
      answer: |
        (a) CaCO₃: 10.0 ÷ 100.09 = 0.0999 mol; HCl: 5.00 ÷ 36.46 = 0.137 mol. The carbonate needs 2 × 0.0999 = 0.200 mol HCl; only 0.137 mol is present, so HCl is limiting.
        (b) 0.137 mol HCl × (1 mol CO₂ ÷ 2 mol HCl) = 0.0686 mol CO₂ × 44.01 = 3.02 g CO₂.
        (c) CaCO₃ consumed = 0.137 ÷ 2 = 0.0686 mol × 100.09 = 6.86 g; left = 10.0 − 6.86 = 3.1 g of CaCO₃.
      explanation: |
        Scoring: (a) 1 point for HCl limiting with moles of both reactants and the 2 : 1 comparison shown. (b) 1 point for 3.02 g (accept 3.0 g). (c) 1 point for about 3.1 g of CaCO₃ remaining, computed from the moles consumed.

    - slug: chem-u04-w16-q24
      type: short_answer
      topic_code: "4.7"
      source: "general knowledge"
      points: 3
      prompt: |
        A student mixes 28.0 g of N₂ with 9.00 g of H₂ (N₂ + 3 H₂ → 2 NH₃) and expects hydrogen to be limiting "because 9.00 g is much less than 28.0 g".

        (a) Show by calculation which reactant actually limits.
        (b) Calculate the theoretical yield of ammonia (17.03 g/mol).
        (c) Explain in one or two sentences why the student's reasoning fails, in terms of moles and the mole ratio.
      answer: |
        (a) N₂: 28.0 ÷ 28.02 = 0.999 mol. H₂: 9.00 ÷ 2.016 = 4.46 mol. Nitrogen needs 3 × 0.999 = 3.00 mol H₂; 4.46 mol is present, so nitrogen is limiting (shortcut: 0.999 ÷ 1 = 0.999 versus 4.46 ÷ 3 = 1.49).
        (b) 0.999 mol N₂ × (2 mol NH₃ ÷ 1 mol N₂) = 2.00 mol × 17.03 = 34.0 g NH₃.
        (c) Mass does not count particles: hydrogen's tiny molar mass makes 9.00 g into 4.46 mol, far more than the 3.00 mol the ratio requires for the nitrogen present. Only a mole comparison through the ratio identifies the limiting reactant.
      explanation: |
        Scoring: (a) 1 point for N₂ limiting with both mole values and the ratio comparison. (b) 1 point for 34.0 g. (c) 1 point for explaining that mass does not reflect moles and that the comparison must use the mole ratio.

    # ---- Long answer
    - slug: chem-u04-w16-q25
      type: long_answer
      topic_code: "4.7"
      source: "NIST Atomic Weights and Isotopic Compositions (rounded)"
      points: 6
      prompt: |
        In a lab, 5.00 g of copper(II) chloride, CuCl₂ (134.45 g/mol), dissolved in water is treated with 1.35 g of aluminum foil (26.98 g/mol): 2 Al + 3 CuCl₂ → 2 AlCl₃ + 3 Cu. The copper is filtered, dried and weighed: 2.10 g (Cu 63.55 g/mol). Write a full analysis that (1) identifies the limiting reactant by calculation; (2) finds the theoretical yield of copper; (3) finds the mass of the excess reactant remaining; (4) calculates the percent yield; and (5) gives two specific, plausible reasons for the shortfall and one observation that would tell you whether aluminum was really in excess at the end.
      answer: |
        (1) CuCl₂: 5.00 ÷ 134.45 = 0.0372 mol. Al: 1.35 ÷ 26.98 = 0.0500 mol. The copper chloride needs 0.0372 × (2 ÷ 3) = 0.0248 mol Al; 0.0500 mol is present, so CuCl₂ is limiting and aluminum is in excess (shortcut: 0.0372 ÷ 3 = 0.0124 versus 0.0500 ÷ 2 = 0.0250).
        (2) 0.0372 mol CuCl₂ × (3 mol Cu ÷ 3 mol CuCl₂) = 0.0372 mol Cu × 63.55 = 2.36 g Cu theoretical.
        (3) Aluminum used: 0.0248 mol × 26.98 = 0.669 g; remaining: 1.35 − 0.669 = 0.68 g of aluminum.
        (4) Percent yield = 2.10 ÷ 2.36 × 100% = 88.9%.
        (5) Reasons: some copper remained on the beaker walls or passed through the filter as fine particles; the reaction was stopped before all the CuCl₂ had reacted (the solution was still faintly blue); a side reaction of aluminum with the acidic solution produced hydrogen rather than displacing copper. Observation: leftover aluminum foil visible in the filter, together with a colourless final solution (all Cu²⁺ consumed), confirms that aluminum was in excess and copper chloride limiting.
      explanation: |
        Scoring (6 points). 1 point: CuCl₂ limiting with both mole values and a ratio comparison. 1 point: theoretical yield 2.36 g (accept 2.35–2.37). 1 point: about 0.68 g of aluminum remaining. 1 point: 88.9% (accept 88.5–89.5). 1 point: two specific reasons for a low yield (losses in transfer or filtering, incomplete reaction, side reaction, product not fully recovered). 1 point: an observation that confirms the excess (unreacted foil remaining, colourless solution). Deduct for computing the yield from aluminum or for applying the ratio to grams.
