# The Chemistry course map. Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\Curriculum\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: Chemistry
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: Chemistry
slug: chem
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full school year of high-school chemistry, one week at a time: a study
  guide, flashcards and a quiz every week, a summary sheet and an exam at the
  end of each of the eight units, and a final-exam prep guide and full
  practice final. It covers what a first chemistry course covers: matter and
  measurement, atomic structure and the periodic table, bonding and naming,
  reactions and stoichiometry, gases and phases, solutions and acids and
  bases, energy and rates, and electrochemistry with a first look at nuclear
  and organic chemistry. Original material written for this course, with
  every constant and data value taken from public-domain sources (NIST,
  PubChem and other U.S. government publications).
teacher: { name: "Chemistry Teacher", email: chemistry@example.com }
student: { name: "Chemistry Student", email: chemistry-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
start_date: 2026-08-31
subject: science
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The practice final's format, what each unit contributes, the formulas and constants to know, how to show work on calculations, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["written for this course", public domain]
attribution: |
  Original study material written for this course. Physical constants,
  thermodynamic data and other values are public domain, taken from U.S.
  government sources (the NIST Chemistry WebBook, NIST CODATA constants,
  PubChem) and rounded for classroom use.
# The eight NGSS science and engineering practices, by number; guides tag topics with them.
practices:
  "1": Asking Questions and Defining Problems
  "2": Developing and Using Models
  "3": Planning and Carrying Out Investigations
  "4": Analyzing and Interpreting Data
  "5": Using Mathematics and Computational Thinking
  "6": Constructing Explanations and Designing Solutions
  "7": Engaging in Argument from Evidence
  "8": Obtaining, Evaluating, and Communicating Information
units:
  - number: 1
    slug: unit-01-matter-and-measurement
    title: Matter, Measurement and the Scientific Method
    weight: "8–10%"
    weeks: [1, 2, 3]
    topics:
      "1.1": Chemistry and the Scientific Method
      "1.2": "Classifying Matter: Elements, Compounds and Mixtures"
      "1.3": Physical and Chemical Properties and Changes
      "1.4": Measurement, SI Units and Significant Figures
      "1.5": Dimensional Analysis and Density
      "1.6": Energy, Temperature and the States of Matter
  - number: 2
    slug: unit-02-atomic-structure-and-the-periodic-table
    title: Atomic Structure and the Periodic Table
    weight: "12–14%"
    weeks: [4, 5, 6, 7]
    topics:
      "2.1": Early Atomic Models and the Laws of Conservation and Definite Proportions
      "2.2": Subatomic Particles, Atomic Number and Isotopes
      "2.3": Average Atomic Mass
      "2.4": "Nuclear Chemistry: Radioactivity and Half-Life"
      "2.5": Light, Electrons and the Bohr Model
      "2.6": Electron Configurations and Orbitals
      "2.7": The Periodic Table and Its Organization
      "2.8": Periodic Trends
  - number: 3
    slug: unit-03-chemical-bonding-and-nomenclature
    title: Chemical Bonding and Nomenclature
    weight: "12–14%"
    weeks: [8, 9, 10, 11]
    topics:
      "3.1": Ions and Ionic Bonding
      "3.2": Naming Ionic Compounds and Polyatomic Ions
      "3.3": Covalent Bonding and Lewis Structures
      "3.4": Naming Molecular Compounds and Acids
      "3.5": Molecular Shape (VSEPR) and Polarity
      "3.6": Intermolecular Forces
      "3.7": Metallic Bonding and the Properties of Solids
  - number: 4
    slug: unit-04-chemical-reactions-and-stoichiometry
    title: Chemical Reactions and Stoichiometry
    weight: "16–18%"
    weeks: [12, 13, 14, 15, 16]
    topics:
      "4.1": Writing and Balancing Chemical Equations
      "4.2": Types of Chemical Reactions
      "4.3": "Predicting Products: the Activity Series and Solubility Rules"
      "4.4": The Mole and Molar Mass
      "4.5": Percent Composition, Empirical and Molecular Formulas
      "4.6": Mole-to-Mole and Mass-to-Mass Stoichiometry
      "4.7": Limiting Reactant and Percent Yield
  - number: 5
    slug: unit-05-gases-liquids-and-solids
    title: Gases, Liquids and Solids
    weight: "12–14%"
    weeks: [17, 18, 19, 20]
    topics:
      "5.1": Kinetic Molecular Theory and Pressure
      "5.2": Boyle's, Charles's and Gay-Lussac's Laws
      "5.3": The Combined and Ideal Gas Laws
      "5.4": Gas Stoichiometry and Dalton's Law of Partial Pressures
      "5.5": Phase Changes and Heating Curves
      "5.6": Phase Diagrams and Vapor Pressure
  - number: 6
    slug: unit-06-solutions-acids-and-bases
    title: Solutions, Acids and Bases
    weight: "12–14%"
    weeks: [21, 22, 23, 24]
    topics:
      "6.1": Solutions, Solubility and Solubility Curves
      "6.2": Molarity and Dilution
      "6.3": Colligative Properties
      "6.4": Properties of Acids and Bases
      "6.5": pH and pOH
      "6.6": Neutralization and Titration
  - number: 7
    slug: unit-07-energy-and-rates-of-reactions
    title: Energy, Rates and Equilibrium
    weight: "12–14%"
    weeks: [25, 26, 27, 28]
    topics:
      "7.1": Exothermic and Endothermic Reactions and Enthalpy
      "7.2": Specific Heat and Calorimetry
      "7.3": Hess's Law and Enthalpies of Formation
      "7.4": Reaction Rates and Collision Theory
      "7.5": Factors Affecting Rate and Catalysts
      "7.6": Equilibrium and Le Châtelier's Principle
  - number: 8
    slug: unit-08-electrochemistry-nuclear-and-organic
    title: Electrochemistry, Nuclear and Organic Chemistry
    weight: "10–12%"
    weeks: [29, 30, 31, 32]
    topics:
      "8.1": Oxidation Numbers and Redox Reactions
      "8.2": Balancing Redox Reactions
      "8.3": Voltaic Cells and Batteries
      "8.4": Electrolysis and Its Applications
      "8.5": Nuclear Fission and Fusion
      "8.6": "Introduction to Organic Chemistry: Hydrocarbons"
      "8.7": Functional Groups and Polymers
