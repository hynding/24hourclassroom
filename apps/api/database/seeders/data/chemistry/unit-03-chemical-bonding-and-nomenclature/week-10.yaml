week: 10
unit: 3
title: "Molecular Shape and Polarity"
topics: ["3.5"]
guide: guides/week-10.md
guide_description: |
  VSEPR from one idea: electron domains repel and spread out. Counting domains (a multiple bond is one), the
  electron-domain geometries for two, three and four domains, the molecular shapes that result when some domains
  are lone pairs (linear, trigonal planar, bent, tetrahedral, trigonal pyramidal) with their angles, and why lone
  pairs compress angles. Then molecular polarity: polar bonds plus shape, when dipoles cancel and when they do not.
  Worked examples on SO₂, NH₄⁺, HCN, CH₃Cl and SO₃.
flashcards_description: |
  30 cards on VSEPR, electron domains, the five shapes and their angles, lone-pair effects, and deciding molecular
  polarity from bond polarity and symmetry.

flashcards:
  - front: VSEPR → the one idea behind every shape
    back: |
      Valence Shell Electron Pair Repulsion: regions of electron density (bonds and lone pairs) around a central atom arrange themselves as far apart as possible to minimise repulsion.
    topic_code: "3.5"
  - front: Electron domain → what counts as one
    back: |
      One lone pair, or one bond of any order. A double or triple bond is a single region of density and counts once. CO₂'s carbon has two domains, not four.
    topic_code: "3.5"
  - front: Electron-domain geometry versus molecular shape → the difference
    back: |
      Electron-domain geometry arranges all domains, lone pairs included (linear, trigonal planar, tetrahedral). Molecular shape describes only where the atoms are; lone pairs push but are not named.
    topic_code: "3.5"
  - front: Two domains → geometry and angle
    back: |
      Linear, 180°. Examples: CO₂, BeCl₂, HCN. With two atoms and no lone pairs the shape is also linear.
    topic_code: "3.5"
  - front: Three domains, no lone pairs → shape and angle
    back: |
      Trigonal planar, 120°, with the central atom in the middle of a flat triangle. Examples: BF₃, SO₃, CH₂O.
    topic_code: "3.5"
  - front: Three domains, one lone pair → shape and angle
    back: |
      Bent, a little under 120° (about 118°). Examples: SO₂, O₃. The lone pair occupies one corner of the triangle.
    topic_code: "3.5"
  - front: Four domains, no lone pairs → shape and angle
    back: |
      Tetrahedral, 109.5°. Examples: CH₄, CCl₄, SiH₄, NH₄⁺. Two bonds in the plane, one toward the viewer, one away.
    topic_code: "3.5"
  - front: Four domains, one lone pair → shape and angle
    back: |
      Trigonal pyramidal, about 107°. Examples: NH₃, PCl₃, PH₃. The central atom sits at the apex of a pyramid with three atoms below.
    topic_code: "3.5"
  - front: Four domains, two lone pairs → shape and angle
    back: |
      Bent, about 104.5°. Examples: H₂O, H₂S, OF₂. Two lone pairs push the two bonds closer together than in ammonia.
    topic_code: "3.5"
  - front: Why lone pairs compress bond angles → the explanation
    back: |
      A lone pair is held by only one nucleus, so it spreads wider and repels more strongly than a bonding pair, pushing the bonds together: CH₄ 109.5°, NH₃ 107°, H₂O 104.5°.
    topic_code: "3.5"
  - front: Shape of SO₂ → worked out
    back: |
      Sulfur has two bonds (one double, one single in each resonance form) and one lone pair: three domains, trigonal planar electron geometry, bent molecular shape, angle a little under 120°.
    topic_code: "3.5"
  - front: Shape of NH₄⁺ → worked out
    back: |
      8 electrons, four N–H bonds, no lone pairs: four domains, tetrahedral, 109.5°. The positive charge does not change the shape.
    topic_code: "3.5"
  - front: Shape of HCN → worked out
    back: |
      H–C≡N: carbon has one single and one triple bond, no lone pairs, so two domains: linear, 180°.
    topic_code: "3.5"
  - front: Five and six domains → the names to recognise
    back: |
      Trigonal bipyramidal (PCl₅, 90° and 120°) and octahedral (SF₆, 90°). Only period 3 and heavier central atoms, which can exceed an octet.
    topic_code: "3.5"
  - front: Dipole → definition and how it is drawn
    back: |
      A separation of partial charge along a bond or across a molecule, drawn as an arrow pointing toward the δ− end. Bond dipoles add like vectors to give the molecular dipole.
    topic_code: "3.5"
  - front: Deciding molecular polarity → the two questions
    back: |
      Are any bonds polar? If not, the molecule is nonpolar. If so, do the bond dipoles cancel? They cancel in a symmetric molecule (no lone pairs on the centre, identical outer atoms); otherwise the molecule is polar.
    topic_code: "3.5"
  - front: Why CO₂ is nonpolar despite polar bonds → explanation
    back: |
      Its two C=O dipoles point in exactly opposite directions along a straight line and cancel. Symmetry, not bond polarity alone, decides.
    topic_code: "3.5"
  - front: Why H₂O is polar → explanation
    back: |
      Its two O–H dipoles are at an angle because the molecule is bent; they add to a net dipole pointing from the hydrogens toward the oxygen.
    topic_code: "3.5"
  - front: Polarity of BF₃, NH₃ and CH₄ → three answers and why
    back: |
      BF₃ nonpolar (trigonal planar, symmetric; dipoles cancel). NH₃ polar (pyramidal, lone pair; dipoles add). CH₄ nonpolar (symmetric tetrahedral; C–H bonds nearly nonpolar anyway).
    topic_code: "3.5"
  - front: CCl₄ versus CHCl₃ → which is polar and why
    back: |
      CCl₄ is nonpolar: four identical polar C–Cl bonds in a tetrahedron cancel. CHCl₃ is polar: replacing one Cl with H breaks the symmetry, leaving a net dipole toward the chlorines.
    topic_code: "3.5"
  - front: SO₂ versus SO₃ → which is polar and why
    back: |
      SO₃ is nonpolar: three S=O dipoles at 120° cancel in the flat triangle. SO₂ is polar: its lone pair bends the molecule, so the two dipoles do not cancel.
    topic_code: "3.5"
  - front: Ozone (O₃) → polar or nonpolar, and the catch
    back: |
      Polar, even though every atom is oxygen. The central oxygen carries a lone pair and the molecule is bent, so the electron distribution is uneven.
    topic_code: "3.5"
  - front: Two-atom molecules → when they are polar
    back: |
      A diatomic molecule is polar whenever its one bond is polar (HCl, HF, CO) and nonpolar when the atoms are identical (H₂, Cl₂, N₂).
    topic_code: "3.5"
  - front: Symmetric formula versus symmetric shape → the trap
    back: |
      H₂O and CO₂ both look like AX₂, but water is bent (polar) and carbon dioxide is linear (nonpolar). Draw the Lewis structure and find the lone pairs before judging symmetry.
    topic_code: "3.5"
  - front: Polarity of CH₃Cl → worked out
    back: |
      Tetrahedral around carbon with three near-nonpolar C–H bonds and one polar C–Cl bond; the outer atoms differ, so nothing cancels the C–Cl dipole. Polar, δ− at chlorine.
    topic_code: "3.5"
  - front: Why molecular polarity matters → two consequences
    back: |
      Polar molecules attract one another more strongly than nonpolar molecules of similar size, so they have higher boiling points, and polar solvents dissolve polar and ionic substances (like dissolves like).
    topic_code: "3.5"
  - front: Water's bent shape → why it matters for the planet
    back: |
      The bend makes water polar; the resulting attractions between molecules keep water liquid at room temperature and let it dissolve salts and sugars.
    topic_code: "3.5"
  - front: Tetrahedral drawing conventions → wedges and dashes
    back: |
      Two bonds drawn in the plane of the page, a solid wedge for a bond coming toward the viewer and a dashed wedge for one going away. The 109.5° angle cannot be shown flat.
    topic_code: "3.5"
  - front: Counting domains from a Lewis structure → the procedure
    back: |
      Draw the Lewis structure first. On the central atom, count each bonded atom once (regardless of bond order) and each lone pair once. The total gives the geometry; the lone-pair count gives the shape.
    topic_code: "3.5"
  - front: Bent at 118° versus bent at 104.5° → how to tell which
    back: |
      Both are called bent, but three domains (one lone pair, as in SO₂) give an angle near 120°, while four domains (two lone pairs, as in H₂O) give an angle near 104.5°.
    topic_code: "3.5"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 3.5: VSEPR shapes and molecular polarity), with
    about a third reviewing earlier weeks (Lewis structures and bond polarity, naming, ionic compounds, periodic
    trends and electron configurations). Multiple choice, select-all, true/false and numeric items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: three molecules compared (3.5)
    - slug: chem-u03-w10-q01
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        | Molecule | Valence electrons | Bonds on central atom | Lone pairs on central atom |
        |---|---|---|---|
        | BeCl₂ | 16 | 2 | 0 |
        | SnCl₂ | 18 | 2 | 1 |
        | H₂S | 8 | 2 | 2 |
      prompt: |
        What are the molecular shapes of the three molecules, in order?
      options:
        - "Linear, bent, bent"
        - "Linear, linear, linear"
        - "Bent, bent, bent"
        - "Linear, trigonal planar, tetrahedral"
      option_explanations:
        - |
          Correct. Two domains give linear BeCl₂; three domains with one lone pair give bent SnCl₂; four domains with two lone pairs give bent H₂S.
        - |
          Lone pairs on tin and sulfur push the bonds out of a straight line; only BeCl₂ has no lone pairs.
        - |
          Beryllium has no lone pairs, so its two bonds sit 180° apart in a straight line.
        - |
          Trigonal planar and tetrahedral describe the electron-domain geometries, not the shapes of the atoms when lone pairs are present.
      answer: 0

    - slug: chem-u03-w10-q02
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        | Molecule | Valence electrons | Bonds on central atom | Lone pairs on central atom |
        |---|---|---|---|
        | BeCl₂ | 16 | 2 | 0 |
        | SnCl₂ | 18 | 2 | 1 |
        | H₂S | 8 | 2 | 2 |
      prompt: |
        Which molecule has the smallest bond angle, and why?
      options:
        - "BeCl₂, because beryllium is the smallest atom"
        - "SnCl₂, because tin is a metal"
        - "H₂S, because two lone pairs repel the bonding pairs more strongly and squeeze them together"
        - "They all have the same angle because each has two bonds"
      option_explanations:
        - |
          BeCl₂ has the largest angle, 180°, because nothing pushes its two bonds out of line.
        - |
          Tin's one lone pair gives an angle just under 120°, larger than sulfur's.
        - |
          Correct. Four domains start at 109.5°, and two lone pairs compress the H–S–H angle to about 92° in H₂S (104.5° in water).
        - |
          The number of lone pairs changes the angle: 180°, about 118° and about 92°.
      answer: 2

    - slug: chem-u03-w10-q03
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        | Molecule | Valence electrons | Bonds on central atom | Lone pairs on central atom |
        |---|---|---|---|
        | BeCl₂ | 16 | 2 | 0 |
        | SnCl₂ | 18 | 2 | 1 |
        | H₂S | 8 | 2 | 2 |
      prompt: |
        All three molecules have polar bonds. Which are polar molecules?
      options:
        - "All three"
        - "SnCl₂ and H₂S only"
        - "BeCl₂ only"
        - "None of them"
      option_explanations:
        - |
          BeCl₂'s two bond dipoles point in opposite directions and cancel, so it is nonpolar.
        - |
          Correct. The bent shapes of SnCl₂ and H₂S prevent their bond dipoles from cancelling; linear BeCl₂ is nonpolar.
        - |
          BeCl₂ is the one nonpolar molecule, for the same reason as CO₂.
        - |
          The two bent molecules have net dipoles.
      answer: 1

    # ---- Multiple choice (3.5)
    - slug: chem-u03-w10-q04
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        How many electron domains surround the carbon atom in formaldehyde, CH₂O (two C–H bonds and one C=O double bond)?
      options:
        - "2"
        - "3"
        - "4"
        - "5"
      option_explanations:
        - |
          Two would ignore one of the three attached atoms.
        - |
          Correct. Each bonded atom counts once regardless of bond order: two H and one O give three domains, trigonal planar.
        - |
          Four would count the double bond twice; a multiple bond is one region of electron density.
        - |
          Five has no basis; carbon has three attached atoms and no lone pairs.
      answer: 1

    - slug: chem-u03-w10-q05
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the molecular shape and approximate bond angle of PCl₃?
      options:
        - "Trigonal planar, 120°"
        - "Tetrahedral, 109.5°"
        - "Bent, 104.5°"
        - "Trigonal pyramidal, about 107°"
      option_explanations:
        - |
          Trigonal planar requires three domains and no lone pair; phosphorus has a lone pair.
        - |
          Tetrahedral is the electron-domain geometry, but the shape of the atoms, with one corner a lone pair, is a pyramid.
        - |
          Bent at 104.5° needs two lone pairs; phosphorus has one.
        - |
          Correct. Phosphorus has three bonds and one lone pair (26 electrons), four domains with one lone pair: trigonal pyramidal, slightly under 109.5°.
      answer: 3

    - slug: chem-u03-w10-q06
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Carbon tetrachloride, CCl₄, contains four polar C–Cl bonds yet the molecule is nonpolar. Why?
      options:
        - "The bonds are arranged symmetrically in a tetrahedron, so the four dipoles cancel"
        - "Chlorine and carbon have equal electronegativities"
        - "The molecule is flat, so the dipoles lie in one plane"
        - "Lone pairs on carbon balance the bond dipoles"
      option_explanations:
        - |
          Correct. Four equal dipoles pointing to the corners of a regular tetrahedron sum to zero.
        - |
          Chlorine (3.16) is considerably more electronegative than carbon (2.55); each bond is polar.
        - |
          CCl₄ is tetrahedral, not flat; the cancellation is three-dimensional.
        - |
          Carbon in CCl₄ has four bonds and no lone pairs.
      answer: 0

    - slug: chem-u03-w10-q07
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which molecule is polar?
      options:
        - "BF₃"
        - "CO₂"
        - "NH₃"
        - "CH₄"
      option_explanations:
        - |
          Trigonal planar with three identical B–F bonds and no lone pair: the dipoles cancel.
        - |
          Linear with two opposing C=O dipoles that cancel.
        - |
          Correct. Trigonal pyramidal with a lone pair; the three N–H dipoles add to a net dipole toward nitrogen.
        - |
          Symmetric tetrahedral, and the C–H bonds are nearly nonpolar.
      answer: 2

    - slug: chem-u03-w10-q08
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Why is the H–N–H angle in ammonia (about 107°) smaller than the H–C–H angle in methane (109.5°)?
      options:
        - "Nitrogen is a larger atom than carbon"
        - "Ammonia has three bonds instead of four, so the bonds spread out more"
        - "The lone pair on nitrogen repels the bonding pairs more strongly than a bonding pair would, pushing them closer together"
        - "Ammonia is trigonal planar"
      option_explanations:
        - |
          Nitrogen is actually slightly smaller than carbon; size is not the explanation.
        - |
          Fewer bonds with no lone pair would spread out more; the lone pair occupies the fourth position and squeezes the others.
        - |
          Correct. Held by one nucleus only, the lone pair spreads wider and compresses the H–N–H angle below the tetrahedral value.
        - |
          Ammonia has four electron domains and is trigonal pyramidal, not planar.
      answer: 2

    - slug: chem-u03-w10-q09
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which pair of molecules has the same molecular shape?
      options:
        - "H₂O and CO₂"
        - "NH₃ and BF₃"
        - "SO₂ and CO₂"
        - "CH₄ and NH₄⁺"
      option_explanations:
        - |
          Water is bent (two lone pairs); carbon dioxide is linear.
        - |
          Ammonia is trigonal pyramidal (lone pair); boron trifluoride is trigonal planar.
        - |
          Sulfur dioxide is bent because of the lone pair on sulfur; carbon dioxide, with no lone pairs on carbon, is linear.
        - |
          Correct. Both have four bonds and no lone pairs on the central atom: tetrahedral, 109.5°.
      answer: 3

    # ---- Spiral review
    - slug: chem-u03-w10-q10
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Before the shape of SO₂ can be predicted, its Lewis structure must be drawn. How many valence electrons does it contain, and what feature of the structure determines the shape?
      options:
        - "16 electrons; two double bonds and no lone pair on sulfur"
        - "18 electrons; a lone pair on sulfur in addition to its two bonds"
        - "12 electrons; a triple bond"
        - "18 electrons; three lone pairs on sulfur"
      option_explanations:
        - |
          Sulfur has 6 and each oxygen 6, so 18, not 16; and with 18 electrons sulfur keeps a lone pair.
        - |
          Correct. 6 + 6 + 6 = 18; one S=O and one S–O (resonance) plus a lone pair on sulfur gives three domains and a bent shape.
        - |
          The count is 18 and no triple bond is needed.
        - |
          Sulfur has only one lone pair; three would exceed its six valence electrons once bonds are counted.
      answer: 1

    - slug: chem-u03-w10-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The polar molecule PCl₃ and the nonpolar molecule BeCl₂ are both named with prefixes. What are their names?
      options:
        - "Phosphorus trichloride and beryllium dichloride"
        - "Phosphorus(III) chloride and beryllium(II) chloride"
        - "Monophosphorus trichloride and beryllium chloride"
        - "Phosphorus chloride and beryllium dichloride"
      option_explanations:
        - |
          Correct. Both are treated as molecular compounds here: one phosphorus, three chlorines; one beryllium, two chlorines.
        - |
          Roman numerals are for ionic compounds of variable-charge metals.
        - |
          Mono- is never used on the first element.
        - |
          The second element always carries a prefix: trichloride.
      answer: 0

    - slug: chem-u03-w10-q12
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The ammonium ion is tetrahedral. What is the formula of the ionic compound it forms with the phosphate ion?
      options:
        - "NH₄PO₄"
        - "NH₄(PO₄)₃"
        - "(NH₄)₂PO₄"
        - "(NH₄)₃PO₄"
      option_explanations:
        - |
          One NH₄⁺ (1+) with one PO₄³⁻ (3−) leaves a net charge of 2−.
        - |
          Three phosphates would give 9−, far from balanced by one ammonium.
        - |
          Two ammoniums (2+) do not balance a 3− phosphate.
        - |
          Correct. Three NH₄⁺ ions (3+) balance one PO₄³⁻ (3−); the repeated polyatomic ion goes in parentheses.
      answer: 3

    - slug: chem-u03-w10-q13
      type: multiple_choice
      topic_code: "2.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Both H₂O and H₂S are bent molecules, but water is more polar. Which trend explains this?
      options:
        - "Oxygen is more electronegative than sulfur, so the O–H bonds are more polar than S–H bonds"
        - "Sulfur has a larger atomic radius, so its molecule is flatter"
        - "Oxygen has more valence electrons than sulfur"
        - "Water has more lone pairs than hydrogen sulfide"
      option_explanations:
        - |
          Correct. Electronegativity decreases down group 16 (O 3.44, S 2.58), so each O–H bond dipole is larger than an S–H one, and the net dipole of water is larger.
        - |
          H₂S is actually more sharply bent (about 92°); shape is not the main difference here.
        - |
          Both have six valence electrons; they are in the same group.
        - |
          Both central atoms carry two lone pairs.
      answer: 0

    # ---- Multi-select
    - slug: chem-u03-w10-q14
      type: multi_select
      topic_code: "3.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following molecules are nonpolar? Select all that apply.
      options:
        - "CF₄"
        - "H₂O"
        - "CO₂"
        - "CHCl₃"
        - "N₂"
      option_explanations:
        - |
          Correct. Four identical polar C–F bonds in a tetrahedron cancel.
        - |
          Bent, with two O–H dipoles that add; strongly polar.
        - |
          Correct. Linear, with opposing C=O dipoles that cancel.
        - |
          One C–H and three C–Cl bonds break the tetrahedral symmetry; polar.
        - |
          Correct. Two identical atoms share electrons equally; no dipole at all.
      answer: [0, 2, 4]

    - slug: chem-u03-w10-q15
      type: multi_select
      topic_code: "3.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following statements about VSEPR are correct? Select all that apply.
      options:
        - "A triple bond counts as one electron domain"
        - "Four electron domains always give a tetrahedral molecular shape"
        - "Lone pairs repel more strongly than bonding pairs"
        - "The molecular shape describes the positions of the atoms, not the lone pairs"
        - "Three domains with no lone pairs give a trigonal planar molecule with 120° angles"
      option_explanations:
        - |
          Correct. All the electrons of a multiple bond lie between the same two nuclei and form one region of density.
        - |
          Four domains give a tetrahedral electron geometry, but the shape is pyramidal with one lone pair and bent with two.
        - |
          Correct. A lone pair is attracted to one nucleus only, so it spreads out and pushes harder, compressing bond angles.
        - |
          Correct. Water is called bent, not tetrahedral, even though its lone pairs occupy two tetrahedral positions.
        - |
          Correct. BF₃ and SO₃ are flat triangles with 120° bond angles.
      answer: [0, 2, 3, 4]

    # ---- True / false
    - slug: chem-u03-w10-q16
      type: true_false
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Any molecule that contains polar bonds is a polar molecule.
      answer: false
      explanation: |
        False. Bond dipoles are vectors and can cancel. CO₂, BF₃, CCl₄ and SO₃ all contain polar bonds arranged symmetrically and are nonpolar molecules. A molecule is polar only when its bond dipoles do not cancel.

    - slug: chem-u03-w10-q17
      type: true_false
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Ionic compounds such as NaCl are made of individual NaCl molecules with a definite shape.
      answer: false
      explanation: |
        False. An ionic solid is a continuous lattice in which each ion is surrounded by several ions of opposite charge; there are no molecules, and VSEPR shapes apply to molecules and polyatomic ions, not to ionic lattices.

    # ---- Fill in the blank
    - slug: chem-u03-w10-q18
      type: fill_blank
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        The molecular shape of a molecule with four electron domains, three of which are bonds and one a lone pair, is called trigonal ____.
      answer: ["pyramidal"]
      explanation: |
        Ammonia is the standard example: the nitrogen sits at the apex of a pyramid above three hydrogens, with the lone pair pointing up and compressing the angle to about 107°.

    - slug: chem-u03-w10-q19
      type: fill_blank
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The acid with the formula HClO₄, derived from the perchlorate ion, is named ____ acid.
      answer: ["perchloric"]
      explanation: |
        Perchlorate (ClO₄⁻) ends in -ate, so its acid ends in -ic and keeps the per- prefix: perchloric acid. No hydro- prefix, because the acid contains oxygen.

    # ---- Numeric
    - slug: chem-u03-w10-q20
      type: numeric
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the ideal bond angle, in degrees, in a molecule with four bonding domains and no lone pairs on the central atom, such as methane? Give your answer to one decimal place.
      answer: { value: 109.5, tolerance: 0.1 }
      explanation: |
        Four domains spread to the corners of a regular tetrahedron, where every angle at the centre is 109.5°. Lone pairs reduce this: about 107° in ammonia and 104.5° in water.

    - slug: chem-u03-w10-q21
      type: numeric
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Technetium-99m has a half-life of 6.0 hours. A 240 mg dose is prepared. What mass remains after 18 hours? Give your answer in mg to the nearest whole number.
      answer: { value: 30, tolerance: 0.5 }
      explanation: |
        18 ÷ 6.0 = 3 half-lives. 240 → 120 → 60 → 30 mg.

    - slug: chem-u03-w10-q22
      type: numeric
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student measures the H–O–H bond angle in a model of water as 101.0°. The accepted value is 104.5°. What is the percent error? Give your answer as a percentage to one decimal place.
      answer: { value: 3.3, tolerance: 0.1 }
      explanation: |
        Percent error = |101.0 − 104.5| ÷ 104.5 × 100 = 3.5 ÷ 104.5 × 100 = 3.35%, reported as 3.3% (3.4% is accepted with alternative rounding).

    # ---- Short answer
    - slug: chem-u03-w10-q23
      type: short_answer
      topic_code: "3.5"
      source: "general knowledge"
      points: 3
      prompt: |
        Consider the molecules CH₂Cl₂ (dichloromethane, carbon central) and XeF₂ (which has three lone pairs on xenon).

        (a) For CH₂Cl₂, count the electron domains on carbon, name the electron-domain geometry and the molecular shape, and give the approximate bond angles.
        (b) Explain whether CH₂Cl₂ is polar or nonpolar.
        (c) XeF₂ is linear and nonpolar. Explain how it can be linear even though xenon has five electron domains.
      answer: |
        (a) Four domains (two C–H and two C–Cl bonds, no lone pairs). Electron-domain geometry tetrahedral; molecular shape tetrahedral; bond angles about 109.5°.
        (b) Polar. The C–Cl bonds are polar and the C–H bonds nearly nonpolar, and because the outer atoms are not all the same, the dipoles do not cancel; the net dipole points toward the chlorines.
        (c) Xenon's five domains (two bonds, three lone pairs) adopt a trigonal bipyramidal electron geometry. The three lone pairs occupy the three equatorial positions, leaving the two fluorines at the axial positions, 180° apart. The molecular shape, which counts atoms only, is linear, and the two equal, opposite Xe–F dipoles cancel.
      explanation: |
        Three points, one per part.

        (a) 1 pt: four domains, tetrahedral geometry and shape, about 109.5°.

        (b) 1 pt: polar, because the outer atoms differ so the dipoles do not cancel.

        (c) 1 pt: lone pairs occupy positions in the electron geometry but are not counted in the shape; with the fluorines opposite each other the molecule is linear and the dipoles cancel.

    - slug: chem-u03-w10-q24
      type: short_answer
      topic_code: "3.5"
      source: "general knowledge"
      points: 3
      stimulus: |
        | Molecule | Shape | Boiling point (°C) |
        |---|---|---|
        | CO₂ | linear | −78 (sublimes) |
        | SO₂ | bent | −10 |
        | H₂O | bent | 100 |
      prompt: |
        Using the table, answer (a), (b) and (c).

        (a) Explain why CO₂ is linear but SO₂ is bent, even though both are triatomic oxides.
        (b) State which of the three molecules are polar and justify each answer using shape and bond polarity.
        (c) Suggest how molecular polarity helps explain the order of the boiling points.
      answer: |
        (a) Carbon in CO₂ has two double bonds and no lone pairs: two domains, linear. Sulfur in SO₂ has two bonds and one lone pair: three domains, and the lone pair bends the molecule.
        (b) CO₂ is nonpolar: its two polar C=O dipoles point in opposite directions and cancel. SO₂ is polar: its bent shape leaves a net dipole. H₂O is polar: bent, with two strongly polar O–H bonds that add to a large net dipole.
        (c) Polar molecules attract one another more strongly than nonpolar molecules of similar size, so more energy is needed to separate them into a gas. Nonpolar CO₂ has the lowest boiling point, polar SO₂ is higher, and water, which is very polar (and forms especially strong attractions between its molecules), is highest.
      explanation: |
        Three points, one per part.

        (a) 1 pt: domain counts (2 versus 3) and the lone pair on sulfur as the cause of bending.

        (b) 1 pt: CO₂ nonpolar, SO₂ and H₂O polar, with shape-based reasons.

        (c) 1 pt: stronger attractions between polar molecules raise boiling points; the trend matches polarity.

    # ---- Long answer
    - slug: chem-u03-w10-q25
      type: long_answer
      topic_code: "3.5"
      source: "general knowledge"
      points: 6
      prompt: |
        Methane (CH₄), ammonia (NH₃) and water (H₂O) each have four electron domains around their central atom, yet they have different shapes, bond angles and polarities.

        Explain, step by step, how VSEPR theory predicts the shape and bond angle of each molecule from its Lewis structure, why the bond angles decrease from methane to water, and why methane is nonpolar while ammonia and water are polar. Include the direction of the net dipole in the polar molecules and state one physical consequence of water's polarity.
      answer: |
        Lewis structures first. Methane: carbon with four C–H bonds, no lone pairs (8 electrons). Ammonia: nitrogen with three N–H bonds and one lone pair (8 electrons). Water: oxygen with two O–H bonds and two lone pairs (8 electrons). Each central atom has four electron domains, so VSEPR places the domains at the corners of a tetrahedron, the arrangement that keeps four regions of negative charge as far apart as possible, with ideal angles of 109.5°.

        The molecular shape counts only atoms. Methane, with four atoms at the corners, is tetrahedral. Ammonia, with one corner occupied by a lone pair, is trigonal pyramidal. Water, with two corners taken by lone pairs, is bent.

        The angles shrink from 109.5° (CH₄) to about 107° (NH₃) to about 104.5° (H₂O) because a lone pair is attracted to only one nucleus, spreads out more than a bonding pair, and repels neighbouring bonding pairs more strongly. One lone pair squeezes the three N–H bonds together; two lone pairs squeeze the O–H bonds even more.

        Methane is nonpolar: C–H bonds are only slightly polar, and the four identical bonds in a symmetric tetrahedron cancel in any case. Ammonia is polar: the three N–H dipoles point toward the more electronegative nitrogen and, because of the pyramidal shape, add to a net dipole pointing from the hydrogens toward the nitrogen and its lone pair. Water is polar: its two strongly polar O–H dipoles are at an angle and add to a net dipole pointing from the hydrogens toward the oxygen.

        Because water is polar, its molecules attract one another strongly, which gives water its unusually high boiling point for such a small molecule (100 °C) and lets it dissolve ionic and polar substances.
      explanation: |
        Six points.

        1 pt: correct Lewis structures with lone-pair counts (0, 1, 2) and four domains each.

        1 pt: tetrahedral electron geometry from VSEPR, with the shapes tetrahedral, trigonal pyramidal and bent.

        1 pt: bond angles 109.5°, about 107°, about 104.5°.

        1 pt: angle decrease explained by stronger lone-pair repulsion.

        1 pt: methane nonpolar (symmetry and weakly polar bonds); ammonia and water polar with net dipoles toward N and O.

        1 pt: a physical consequence of water's polarity (high boiling point, dissolving ionic or polar substances).
