    # ---- Short answer
    - slug: chem-u03-w09-q23
      type: short_answer
      topic_code: "3.3"
      source: "general knowledge"
      points: 3
      prompt: |
        Consider the molecules ammonia (NH₃) and formaldehyde (CH₂O, carbon central).

        (a) Count the valence electrons in each molecule and describe (in words or text drawing) the Lewis structure of each, including any multiple bond and all lone pairs.
        (b) State the number of bonding pairs and lone pairs on the central atom of each.
        (c) Classify the N–H and C=O bonds as nonpolar, polar covalent or ionic (electronegativities: H 2.20, C 2.55, N 3.04, O 3.44) and mark the partial charges.
      answer: |
        (a) NH₃: 5 + 3 = 8 electrons; nitrogen bonded to three hydrogens with one lone pair on nitrogen. CH₂O: 4 + 2 + 6 = 12 electrons; carbon bonded to two hydrogens by single bonds and to oxygen by a double bond, with two lone pairs on oxygen. (Single C–O would leave carbon with six, so the double bond is required.)
        (b) Nitrogen: 3 bonding pairs, 1 lone pair. Carbon: 4 bonding pairs (two in the double bond), 0 lone pairs.
        (c) N–H: 3.04 − 2.20 = 0.84, polar covalent, N δ− and H δ+. C=O: 3.44 − 2.55 = 0.89, polar covalent, O δ− and C δ+.
      explanation: |
        Three points, one per part.

        (a) 1 pt: both electron counts (8 and 12) and correct structures, including the C=O double bond and the lone pairs.

        (b) 1 pt: N 3 bonding, 1 lone; C 4 bonding, 0 lone.

        (c) 1 pt: both bonds polar covalent with the correct δ− atoms.

    - slug: chem-u03-w09-q24
      type: short_answer
      topic_code: "3.4"
      source: "general knowledge"
      points: 3
      stimulus: |
        | Formula | Student's name |
        |---|---|
        | Cl₂O | chlorine oxide |
        | HNO₂ | nitric acid |
        | FeBr₃ | iron tribromide |
        | H₂S(aq) | hydrosulfuric acid |
        | P₄S₃ | tetraphosphorus trisulfide |
      prompt: |
        Using the table, answer (a), (b) and (c).

        (a) Identify which names are wrong and give the correct name for each.
        (b) Explain the rule the student broke with "iron tribromide".
        (c) Explain how you decide whether a formula beginning with H should be named as an acid, and what distinguishes the naming of HNO₂ from that of H₂S(aq).
      answer: |
        (a) Cl₂O should be dichlorine monoxide; HNO₂ should be nitrous acid (nitrite → -ous); FeBr₃ should be iron(III) bromide. H₂S(aq) and P₄S₃ are correct.
        (b) FeBr₃ is an ionic compound (metal + nonmetal), so prefixes are not used; iron forms more than one ion, so its charge is shown with a Roman numeral worked out from the three Br⁻ ions: iron(III).
        (c) A formula with H first and an anion after it is an acid when dissolved in water. HNO₂ is an oxyacid (its anion contains oxygen), so the anion ending changes: nitrite gives nitrous acid, with no hydro- prefix. H₂S(aq) is a binary acid (no oxygen), so it takes hydro- and -ic: hydrosulfuric acid.
      explanation: |
        Three points, one per part.

        (a) 1 pt: all three errors found and corrected (dichlorine monoxide, nitrous acid, iron(III) bromide).

        (b) 1 pt: ionic compounds take no prefixes; variable-charge metals take a Roman numeral from charge balance.

        (c) 1 pt: acid recognised by leading H; oxyacid versus binary acid naming distinguished.

    # ---- Long answer
    - slug: chem-u03-w09-q25
      type: long_answer
      topic_code: "3.3"
      source: "general knowledge"
      points: 6
      prompt: |
        Compare how sodium and chlorine bond in sodium chloride with how two chlorine atoms bond in Cl₂ and how hydrogen and chlorine bond in HCl.

        Your answer should: explain, using electron configurations and electronegativities (Na 0.93, H 2.20, Cl 3.16), why each pair transfers or shares electrons; draw or describe the Lewis structure of Cl₂ and HCl, counting bonding and lone pairs; classify the three bonds as ionic, nonpolar covalent or polar covalent and mark any partial charges; and explain why NaCl is a high-melting solid while Cl₂ and HCl are gases at room temperature.
      answer: |
        Sodium is [Ne] 3s¹ with a low ionization energy and electronegativity 0.93; chlorine is [Ne] 3s² 3p⁵ with electronegativity 3.16. The difference, 2.23, is so large that chlorine takes sodium's electron outright: Na⁺ and Cl⁻ form, each with a noble-gas configuration, and the compound is ionic.

        Two chlorine atoms have identical electronegativities (difference 0), so neither can take an electron from the other. Each contributes one electron to a shared pair: Cl–Cl, a single nonpolar covalent bond, with each chlorine keeping three lone pairs (14 valence electrons: one bonding pair and six lone pairs). Both atoms count the shared pair and reach an octet.

        Hydrogen (2.20) and chlorine (3.16) differ by 0.96, too small for transfer but large enough for unequal sharing. H–Cl has one bonding pair and three lone pairs on chlorine (8 electrons). The pair sits closer to chlorine, so Cl is δ− and H is δ+: a polar covalent bond.

        NaCl is a lattice in which every ion attracts every neighbouring opposite ion; separating them takes a great deal of energy, so it melts at 801 °C. Cl₂ and HCl are separate molecules; the covalent bonds inside each molecule are strong, but the attractions between molecules are weak, so the molecules fly apart easily and both substances are gases at room temperature.
      explanation: |
        Six points.

        1 pt: NaCl explained by configurations and a large electronegativity difference leading to electron transfer.

        1 pt: Cl₂ explained by equal electronegativities leading to equal sharing.

        1 pt: correct Lewis descriptions of Cl₂ (1 bonding pair, 6 lone pairs) and HCl (1 bonding pair, 3 lone pairs).

        1 pt: the three bonds classified as ionic, nonpolar covalent and polar covalent, with δ− on Cl in HCl.

        1 pt: NaCl's high melting point explained by the ionic lattice.

        1 pt: the gaseous state of Cl₂ and HCl explained by weak attractions between separate molecules despite strong bonds within them.
