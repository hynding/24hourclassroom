week: 9
unit: 3
title: "Sharing Electrons: Covalent Bonds, Lewis Structures and Molecular Names"
topics: ["3.3", "3.4"]
guide: guides/week-09.md
guide_description: |
  Why nonmetals share electrons, single, double and triple bonds and how bond order sets length and strength, a
  seven-step method for Lewis structures with worked examples (water, carbon dioxide, ammonia, nitrate with
  resonance), the exceptions to the octet rule, and bond polarity from electronegativity differences. Then naming:
  Greek prefixes for binary molecular compounds, hydro- -ic for binary acids and -ate/-ic, -ite/-ous for oxyacids.
flashcards_description: |
  32 cards on covalent bonding, the Lewis-structure method and its exceptions, resonance, bond polarity, prefix
  naming of molecular compounds and the two acid-naming patterns.

flashcards:
  - front: Covalent bond → definition and who forms it
    back: |
      A pair of electrons shared between two atoms, formed between nonmetals because neither has a low enough ionization energy to give electrons up. Both atoms count the shared pair toward their octets.
    topic_code: "3.3"
  - front: Molecule versus formula unit → what each formula counts
    back: |
      A molecular formula counts the actual atoms in one molecule (H₂O, C₆H₁₂O₆). An ionic formula unit gives only the simplest ratio of ions in a lattice (NaCl, CaCl₂).
    topic_code: "3.3"
  - front: Lewis structure → what the lines and dots mean
    back: |
      Each line is a bonding pair (two shared electrons); each pair of dots is a lone pair on one atom. The structure shows only valence electrons.
    topic_code: "3.3"
  - front: Bonding pair versus lone pair → definitions
    back: |
      A bonding pair is shared between two atoms and drawn as a line. A lone pair belongs to one atom and is drawn as two dots. Water's oxygen has two of each.
    topic_code: "3.3"
  - front: Single, double and triple bonds → shared pairs and examples
    back: |
      One, two or three shared pairs: H–H, O=O, N≡N. Bond order 1, 2, 3.
    topic_code: "3.3"
  - front: Bond order and bond length and strength → the relation
    back: |
      Higher bond order means a shorter and stronger bond: C–C 154 pm, C=C 134 pm, C≡C 120 pm, with bond energy rising in the same order.
    topic_code: "3.3"
  - front: Why N₂ is so unreactive → bond explanation
    back: |
      Its triple bond is one of the strongest known; breaking it takes about 945 kJ/mol, so nitrogen molecules rarely react at ordinary temperatures.
    topic_code: "3.3"
  - front: Lewis structure method → the seven steps
    back: |
      Count valence electrons (adjust for charge); place the least electronegative atom (never H) in the centre; single-bond the outer atoms; complete outer octets; put leftovers on the centre; make multiple bonds if the centre lacks an octet; check the total.
    topic_code: "3.3"
  - front: Counting valence electrons for an ion → the charge adjustment
    back: |
      Add one electron per unit of negative charge, subtract one per unit of positive charge. NO₃⁻: 5 + 18 + 1 = 24. NH₄⁺: 5 + 4 − 1 = 8.
    topic_code: "3.3"
  - front: Lewis structure of water → the count and the picture
    back: |
      8 electrons: H–O–H with two lone pairs on oxygen. Oxygen has two bonding pairs and two lone pairs, a full octet; each hydrogen has two electrons.
    topic_code: "3.3"
  - front: Lewis structure of carbon dioxide → why double bonds are needed
    back: |
      16 electrons. Single bonds and full oxygen octets use all 16 but leave carbon with only four, so one lone pair from each oxygen becomes a bond: O=C=O, each oxygen keeping two lone pairs.
    topic_code: "3.3"
  - front: Lewis structure of ammonia → the lone pair
    back: |
      8 electrons: three N–H bonds use six, and the remaining two sit on nitrogen as a lone pair. That lone pair shapes the molecule and makes ammonia a base.
    topic_code: "3.3"
  - front: Resonance → definition and the nitrate example
    back: |
      Two or more Lewis structures differing only in where electrons are placed; the real molecule is their average. In NO₃⁻ the N=O double bond can be on any of the three oxygens, so all three N–O bonds are identical.
    topic_code: "3.3"
  - front: Octet rule exceptions → the four kinds
    back: |
      Hydrogen takes two electrons. Beryllium (BeCl₂, 4) and boron (BF₃, 6) are stable with fewer. Period 3 and below can exceed eight (PCl₅ 10, SF₆ 12). Odd-electron molecules (NO, NO₂) cannot give every atom an octet.
    topic_code: "3.3"
  - front: Diatomic elements → the seven
    back: |
      H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂. They exist as two-atom molecules, so their formulas in equations carry the subscript 2.
    topic_code: "3.3"
  - front: Bond polarity → what makes a bond polar and the symbols
    back: |
      Unequal sharing when the two atoms differ in electronegativity. The more electronegative atom is δ− and its partner δ+. In H–Cl the chlorine end is δ−.
    topic_code: "3.3"
  - front: Electronegativity difference ranges → nonpolar, polar, ionic
    back: |
      Under about 0.4: nonpolar covalent (H–H, C–H). About 0.4 to 1.7: polar covalent (O–H 1.24, H–Cl 0.96). Above about 1.7: ionic (Na–Cl 2.23). The boundaries are approximate.
    topic_code: "3.3"
  - front: C–Cl bond classification → worked out
    back: |
      Cl 3.16 − C 2.55 = 0.61, polar covalent; chlorine is the δ− end.
    topic_code: "3.3"
  - front: Ionic or molecular? → the first decision before naming
    back: |
      Metal + nonmetal (or ammonium + anion): ionic, name by charges, no prefixes. Nonmetal + nonmetal: molecular, name with Greek prefixes. Formula starting with H: an acid.
    topic_code: "3.4"
  - front: Greek prefixes one to ten → the list
    back: |
      mono-, di-, tri-, tetra-, penta-, hexa-, hepta-, octa-, nona-, deca-.
    topic_code: "3.4"
  - front: Prefix rules for binary molecular compounds → the three details
    back: |
      No mono- on the first element; the second element always takes a prefix and ends in -ide; drop the final a or o of a prefix before oxide (monoxide, pentoxide). CO is carbon monoxide; N₂O₅ is dinitrogen pentoxide.
    topic_code: "3.4"
  - front: Naming N₂O₄, PCl₅ and SF₆ → the names
    back: |
      Dinitrogen tetroxide, phosphorus pentachloride, sulfur hexafluoride.
    topic_code: "3.4"
  - front: Common molecules with everyday names → the four to know
    back: |
      H₂O water, NH₃ ammonia, CH₄ methane, H₂O₂ hydrogen peroxide. Their systematic prefix names are not used.
    topic_code: "3.4"
  - front: Acid → definition and how to spot one from a formula
    back: |
      A compound that releases H⁺ ions in water. Its formula is written with hydrogen first: HCl, HNO₃, H₂SO₄. The number of H equals the charge on the anion.
    topic_code: "3.4"
  - front: Binary acid naming → the pattern and examples
    back: |
      hydro- + stem + -ic acid, for hydrogen plus one nonmetal in water: HCl hydrochloric acid, HBr hydrobromic acid, H₂S hydrosulfuric acid, HF hydrofluoric acid.
    topic_code: "3.4"
  - front: Hydrogen chloride versus hydrochloric acid → the difference
    back: |
      HCl as a pure gas is named hydrogen chloride (a molecular compound). Dissolved in water, HCl(aq), it is hydrochloric acid.
    topic_code: "3.4"
  - front: Oxyacid naming → the -ate/-ic and -ite/-ous rule
    back: |
      No hydro- prefix. The anion's -ate becomes -ic acid and -ite becomes -ous acid: nitrate → nitric acid (HNO₃); nitrite → nitrous acid (HNO₂). Sulfur and phosphorus keep a syllable: sulfuric, phosphorous.
    topic_code: "3.4"
  - front: Sulfuric, sulfurous, carbonic, phosphoric acids → formulas
    back: |
      H₂SO₄ (from sulfate), H₂SO₃ (from sulfite), H₂CO₃ (from carbonate), H₃PO₄ (from phosphate). The hydrogens match the anion charge.
    topic_code: "3.4"
  - front: Chlorine oxyacids → perchloric to hypochlorous
    back: |
      HClO₄ perchloric, HClO₃ chloric, HClO₂ chlorous, HClO hypochlorous acid; the prefixes per- and hypo- carry over from the anion names.
    topic_code: "3.4"
  - front: Acetic acid → formula and the anion it comes from
    back: |
      HC₂H₃O₂ (also written CH₃COOH), from the acetate ion C₂H₃O₂⁻. Only the first hydrogen is acidic.
    topic_code: "3.4"
  - front: Naming HClO₂ and writing perbromic acid → worked out
    back: |
      HClO₂ contains chlorite (ClO₂⁻), so chlorous acid. Perbromate is BrO₄⁻, so perbromic acid is HBrO₄.
    topic_code: "3.4"
  - front: Hydronitric acid → why that name is wrong
    back: |
      The hydro- prefix is reserved for binary acids (no oxygen). HNO₃ contains the nitrate ion, so it is nitric acid.
    topic_code: "3.4"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 3.3 and 3.4: covalent bonding, Lewis structures
    and naming molecular compounds and acids), with about a third reviewing earlier weeks (ionic compounds and
    their names, periodic trends, electron configurations and the mass laws). Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: electronegativity table (3.3)
    - slug: chem-u03-w09-q01
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge (Pauling electronegativities, standard values)"
      points: 1
      stimulus: |
        | Element | H | C | N | O | F | Na | Cl | K |
        |---|---|---|---|---|---|---|---|---|
        | Electronegativity | 2.20 | 2.55 | 3.04 | 3.44 | 3.98 | 0.93 | 3.16 | 0.82 |
      prompt: |
        Using the table, which bond is the most polar covalent bond?
      options:
        - "C–H"
        - "N–H"
        - "O–H"
        - "C–N"
      option_explanations:
        - |
          2.55 − 2.20 = 0.35, essentially nonpolar.
        - |
          3.04 − 2.20 = 0.84, polar but less so than O–H.
        - |
          Correct. 3.44 − 2.20 = 1.24, the largest difference among these covalent bonds, with oxygen δ−.
        - |
          3.04 − 2.55 = 0.49, only slightly polar.
      answer: 2

    - slug: chem-u03-w09-q02
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge (Pauling electronegativities, standard values)"
      points: 1
      stimulus: |
        | Element | H | C | N | O | F | Na | Cl | K |
        |---|---|---|---|---|---|---|---|---|
        | Electronegativity | 2.20 | 2.55 | 3.04 | 3.44 | 3.98 | 0.93 | 3.16 | 0.82 |
      prompt: |
        Which pair of elements would form a bond best described as ionic?
      options:
        - "C and O"
        - "H and Cl"
        - "N and F"
        - "K and F"
      option_explanations:
        - |
          3.44 − 2.55 = 0.89: polar covalent, two nonmetals sharing electrons.
        - |
          3.16 − 2.20 = 0.96: polar covalent; HCl is a molecular gas.
        - |
          3.98 − 3.04 = 0.94: polar covalent between two nonmetals.
        - |
          Correct. 3.98 − 0.82 = 3.16, far above 1.7, and a metal with a nonmetal: electrons transfer to give K⁺ and F⁻.
      answer: 3

    - slug: chem-u03-w09-q03
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge (Pauling electronegativities, standard values)"
      points: 1
      stimulus: |
        | Element | H | C | N | O | F | Na | Cl | K |
        |---|---|---|---|---|---|---|---|---|
        | Electronegativity | 2.20 | 2.55 | 3.04 | 3.44 | 3.98 | 0.93 | 3.16 | 0.82 |
      prompt: |
        In a C–F bond, which atom carries the partial negative charge, and why?
      options:
        - "Fluorine, because it is more electronegative and pulls the shared electrons toward itself"
        - "Carbon, because it has more valence electrons"
        - "Carbon, because it is the central atom"
        - "Neither, because covalent bonds share electrons equally"
      option_explanations:
        - |
          Correct. 3.98 against 2.55 is a large difference; the shared pair spends more time near fluorine, which becomes δ−.
        - |
          Carbon has four valence electrons to fluorine's seven, and the valence count does not decide polarity anyway.
        - |
          Being central says nothing about electron pull; electronegativity does.
        - |
          Only bonds between identical or near-identical atoms share equally; C–F is strongly polar.
      answer: 0

    # ---- Multiple choice (3.3)
    - slug: chem-u03-w09-q04
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        How many lone pairs are on the central atom in the Lewis structure of water, H₂O?
      options:
        - "0"
        - "1"
        - "2"
        - "3"
      option_explanations:
        - |
          Oxygen has six valence electrons; two bonds account for only two of them.
        - |
          One lone pair would leave oxygen with six electrons, short of an octet.
        - |
          Correct. Two O–H bonds use two of oxygen's six electrons; the other four form two lone pairs, completing the octet.
        - |
          Three lone pairs plus two bonds would give oxygen ten electrons, more than it has.
      answer: 2

    - slug: chem-u03-w09-q05
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A student draws CO₂ as O–C–O with single bonds and three lone pairs on each oxygen. What is wrong, and how is it fixed?
      options:
        - "Nothing is wrong; carbon can have four electrons"
        - "Carbon has only four electrons; converting one lone pair on each oxygen into a bond gives O=C=O with octets on all three atoms"
        - "There are too few electrons; add four more to carbon"
        - "Oxygen should be the central atom"
      option_explanations:
        - |
          Carbon needs an octet, and a structure leaving it with four is not acceptable when double bonds can fix it.
        - |
          Correct. The 16 electrons are all placed, but moving a lone pair from each oxygen into a shared pair completes carbon's octet without changing the total.
        - |
          The electron count of 16 is already used up; adding electrons would make the structure an ion.
        - |
          Carbon is less electronegative than oxygen and belongs in the centre.
      answer: 1

    - slug: chem-u03-w09-q06
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which molecule contains a triple bond?
      options:
        - "O₂"
        - "Cl₂"
        - "N₂"
        - "H₂O"
      option_explanations:
        - |
          Each oxygen needs two more electrons, so O₂ has a double bond.
        - |
          Each chlorine needs one electron, so Cl₂ has a single bond.
        - |
          Correct. Each nitrogen has five valence electrons and needs three more, so the two atoms share three pairs: N≡N.
        - |
          Water has two single O–H bonds and no multiple bonds at all.
      answer: 2

    - slug: chem-u03-w09-q07
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The nitrate ion, NO₃⁻, can be drawn with the double bond on any one of its three oxygens. What does this indicate about the actual ion?
      options:
        - "The ion flips rapidly among three different structures"
        - "One N–O bond is double and the other two are single at any moment"
        - "The drawing is wrong and only one structure is correct"
        - "The three N–O bonds are identical, intermediate between single and double, and the structures are resonance forms"
      option_explanations:
        - |
          Resonance is not a rapid switching; the real ion is a single blended structure.
        - |
          Measurements show all three bonds have the same length, so no one bond is double.
        - |
          Each of the three drawings is equally valid; the set of them describes the ion.
        - |
          Correct. Resonance structures differ only in electron placement; the real ion averages them, giving three equal bonds of order 1⅓.
      answer: 3

    - slug: chem-u03-w09-q08
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which molecule is an exception to the octet rule because its central atom has only six electrons?
      options:
        - "BF₃"
        - "NH₃"
        - "CH₄"
        - "H₂S"
      option_explanations:
        - |
          Correct. Boron has three valence electrons and forms three bonds, giving it six electrons; BF₃ is stable this way.
        - |
          Nitrogen has three bonds and a lone pair, a full octet.
        - |
          Carbon in methane has four single bonds, a complete octet of eight electrons.
        - |
          Sulfur has two bonds and two lone pairs, eight electrons.
      answer: 0

    # ---- Multiple choice (3.4)
    - slug: chem-u03-w09-q09
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the correct name of N₂O₅?
      options:
        - "Nitrogen(V) oxide"
        - "Dinitrogen pentoxide"
        - "Nitrogen pentoxide"
        - "Dinitrogen pentaoxide"
      option_explanations:
        - |
          Roman numerals are for ionic compounds with variable-charge metals; nitrogen and oxygen are both nonmetals.
        - |
          Correct. Two nitrogens take di-, five oxygens take penta-, and the a is dropped before oxide.
        - |
          The first element needs a prefix when there is more than one atom of it.
        - |
          The final a of penta- is dropped before oxide: pentoxide.
      answer: 1

    - slug: chem-u03-w09-q10
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which formula-name pair for an acid is correct?
      options:
        - "H₂SO₃, sulfurous acid"
        - "HNO₃, hydronitric acid"
        - "HCl(aq), chloric acid"
        - "H₃PO₄, phosphorous acid"
      option_explanations:
        - |
          Correct. H₂SO₃ contains the sulfite ion, and -ite becomes -ous acid.
        - |
          The hydro- prefix is only for binary acids; HNO₃ contains nitrate and is nitric acid.
        - |
          Aqueous HCl is a binary acid, hydrochloric acid; chloric acid is HClO₃.
        - |
          H₃PO₄ contains phosphate (-ate), so it is phosphoric acid; phosphorous acid is H₃PO₃.
      answer: 0

    # ---- Spiral review
    - slug: chem-u03-w09-q11
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A student names CaCl₂ "calcium dichloride" and SCl₂ "sulfur chloride". What is the correct pair of names?
      options:
        - "Calcium dichloride and sulfur dichloride"
        - "Calcium chloride and sulfur dichloride"
        - "Calcium(II) chloride and sulfur(II) chloride"
        - "Calcium chloride and sulfur chloride"
      option_explanations:
        - |
          Prefixes are not used for ionic compounds; the charges already fix the ratio in calcium chloride.
        - |
          Correct. Calcium chloride is ionic (metal + nonmetal, no prefix); sulfur dichloride is molecular (two nonmetals) and needs the prefix.
        - |
          Calcium has only one charge, so no numeral is used, and numerals are never used for molecular compounds.
        - |
          The molecular compound needs a prefix because sulfur forms several chlorides.
      answer: 1

    - slug: chem-u03-w09-q12
      type: multiple_choice
      topic_code: "2.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Fluorine is the most electronegative element. Which statement about its position on the periodic table explains this?
      options:
        - "It is at the bottom left, where atoms are largest"
        - "It is a noble gas with a full shell"
        - "It is in the lower middle among the transition metals"
        - "It is at the top right, where atoms are small and the effective nuclear charge on valence electrons is high"
      option_explanations:
        - |
          Bottom-left elements such as cesium are the least electronegative.
        - |
          Fluorine is a halogen, one electron short of a full shell; noble gases are generally not assigned electronegativities.
        - |
          Transition metals have moderate electronegativities, far below fluorine's.
        - |
          Correct. Small size and strong effective nuclear charge let fluorine pull bonding electrons toward itself more than any other element.
      answer: 3

    - slug: chem-u03-w09-q13
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which comparison between an ionic compound and a molecular compound is correct?
      options:
        - "Both consist of discrete molecules"
        - "Ionic compounds form by electron transfer and exist as lattices; molecular compounds form by electron sharing and exist as separate molecules"
        - "Molecular compounds conduct electricity when molten; ionic compounds never conduct"
        - "Ionic compounds form between two nonmetals; molecular compounds form between a metal and a nonmetal"
      option_explanations:
        - |
          Ionic compounds have no molecules; their formulas give ratios of ions in a lattice.
        - |
          Correct. Transfer gives ions that pack into a lattice; sharing gives molecules with a fixed atom count.
        - |
          It is the reverse: molten ionic compounds conduct because their ions move; molten molecular compounds do not.
        - |
          The pairings are reversed: metal plus nonmetal is ionic, nonmetal plus nonmetal is molecular.
      answer: 1

    # ---- Multi-select
    - slug: chem-u03-w09-q14
      type: multi_select
      topic_code: "3.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following names are correct for the formulas given? Select all that apply.
      options:
        - "PCl₃, phosphorus trichloride"
        - "CO, carbon monoxide"
        - "HBr(aq), hydrobromic acid"
        - "SO₂, sulfur oxide"
        - "HClO, chlorous acid"
      option_explanations:
        - |
          Correct. One phosphorus (no prefix) and three chlorines (tri-).
        - |
          Correct. One oxygen takes mono-, with the extra o dropped before oxide.
        - |
          Correct. A binary acid takes hydro- and -ic.
        - |
          The second element always takes a prefix: sulfur dioxide.
        - |
          HClO contains hypochlorite, so it is hypochlorous acid; chlorous acid is HClO₂.
      answer: [0, 1, 2]

    - slug: chem-u03-w09-q15
      type: multi_select
      topic_code: "3.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following statements about Lewis structures are correct? Select all that apply.
      options:
        - "Hydrogen is never the central atom"
        - "The total number of electrons shown equals the total valence electrons of the atoms, adjusted for any charge"
        - "A double bond counts as four electrons toward each bonded atom's octet"
        - "Every atom in every stable molecule has exactly eight electrons"
        - "Lone pairs are electrons not shared between atoms"
      option_explanations:
        - |
          Correct. Hydrogen forms only one bond, so it is always on the outside.
        - |
          Correct. Lewis structures account for all valence electrons, with extra electrons for anions and fewer for cations.
        - |
          Correct. Two shared pairs are four electrons, and both atoms count all four.
        - |
          Hydrogen has two, boron in BF₃ six, and phosphorus in PCl₅ ten; the octet rule has exceptions.
        - |
          Correct. Lone pairs sit on one atom and are drawn as pairs of dots.
      answer: [0, 1, 2, 4]

    # ---- True / false
    - slug: chem-u03-w09-q16
      type: true_false
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A triple bond is longer than a single bond between the same two atoms.
      answer: false
      explanation: |
        False. More shared pairs pull the nuclei closer together, so a triple bond is shorter and stronger than a double bond, which is shorter and stronger than a single bond (C≡C 120 pm, C=C 134 pm, C–C 154 pm).

    - slug: chem-u03-w09-q17
      type: true_false
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The number of valence electrons an atom brings to a Lewis structure is the number of electrons in its highest occupied energy level.
      answer: true
      explanation: |
        True. Valence electrons are the outer s and p electrons; for main-group elements the count equals the last digit of the group number. Oxygen (2s² 2p⁴) brings six, nitrogen five, chlorine seven.

    # ---- Fill in the blank
    - slug: chem-u03-w09-q18
      type: fill_blank
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The compound with the formula SF₆ is named sulfur ____.
      answer: ["hexafluoride"]
      explanation: |
        Six fluorine atoms take the prefix hexa- and the -ide ending. Sulfur, as the single first element, takes no prefix. SF₆ is also a classic octet-rule exception with twelve electrons around sulfur.

    - slug: chem-u03-w09-q19
      type: fill_blank
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Carbon forms two oxides, CO and CO₂, in which the masses of oxygen combining with a fixed mass of carbon are in a 1:2 ratio. This illustrates the law of ____ proportions.
      answer: ["multiple"]
      explanation: |
        The law of multiple proportions says that when two elements form more than one compound, the masses of one combining with a fixed mass of the other are in small whole-number ratios, evidence for atoms combining in whole numbers.

    # ---- Numeric
    - slug: chem-u03-w09-q20
      type: numeric
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        How many valence electrons must be shown in the Lewis structure of the sulfate ion, SO₄²⁻? Give a whole number.
      answer: { value: 32, tolerance: 0 }
      explanation: |
        Sulfur contributes 6, each of four oxygens 6 (24), and the 2− charge adds 2: 6 + 24 + 2 = 32 electrons, or 16 pairs.

