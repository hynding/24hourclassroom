week: 8
unit: 3
title: "Ions, Ionic Bonds and Naming Ionic Compounds"
topics: ["3.1", "3.2"]
guide: guides/week-08.md
guide_description: |
  Why metals lose and nonmetals gain electrons (the octet rule), the charges of main-group ions and their
  configurations, the ionic bond and the crystal lattice, and how lattice energy explains the properties of ionic
  compounds. Then formulas by charge balance, the criss-cross method, polyatomic ions and parentheses, the Stock
  system of Roman numerals for variable-charge metals, and naming in both directions. Worked examples on ion
  configurations, formula writing and naming with Roman numerals.
flashcards_description: |
  32 cards on ion formation and charges, the ionic lattice and its properties, formula writing, the common
  polyatomic ions, Roman-numeral naming and the mistakes to avoid.

flashcards:
  - front: Octet rule → statement and the exceptions among small atoms
    back: |
      Atoms gain, lose or share electrons to end up with eight valence electrons, the arrangement of a noble gas. Hydrogen, lithium and beryllium aim for two (helium's configuration).
    topic_code: "3.1"
  - front: Why metals form cations → the two reasons
    back: |
      Metals have few valence electrons (one to three) and low ionization energies, so losing those electrons to reach the previous noble gas's configuration is easy. Sodium (3s¹) loses one to become Na⁺.
    topic_code: "3.1"
  - front: Why nonmetals form anions → the two reasons
    back: |
      Nonmetals have five to seven valence electrons and high electronegativities, so gaining a few electrons to complete an octet is favourable. Chlorine (3s² 3p⁵) gains one to become Cl⁻.
    topic_code: "3.1"
  - front: Ion charges by group → the main-group pattern
    back: |
      Group 1: 1+. Group 2: 2+. Group 13: 3+. Group 15: 3−. Group 16: 2−. Group 17: 1−. Groups 14 and 18 rarely form simple ions.
    topic_code: "3.1"
  - front: Electron configuration of Ca²⁺ and S²⁻ → the noble gas they match
    back: |
      Ca²⁺ is [Ar] (lost 4s²); S²⁻ is [Ne] 3s² 3p⁶, also argon's configuration. Both have 18 electrons.
    topic_code: "3.1"
  - front: Variable-charge metals → examples and the fixed ones
    back: |
      Iron (2+, 3+), copper (1+, 2+), lead and tin (2+, 4+), cobalt, nickel, chromium, manganese, mercury and gold vary. Zinc (2+), silver (1+), cadmium (2+), aluminium (3+) and groups 1 and 2 are fixed.
    topic_code: "3.1"
  - front: Ionic bond → definition
    back: |
      The electrostatic attraction between a cation and an anion, formed when electrons are transferred from a metal to a nonmetal. Each ion attracts every neighbouring ion of opposite charge, not just one partner.
    topic_code: "3.1"
  - front: Crystal lattice → description for sodium chloride
    back: |
      A repeating three-dimensional array in which each Na⁺ is surrounded by six Cl⁻ and each Cl⁻ by six Na⁺. There are no molecules; the formula NaCl gives only the ratio.
    topic_code: "3.1"
  - front: Formula unit → why ionic compounds have no molecules
    back: |
      The lattice extends in every direction, so no small group of ions belongs together. The formula unit is the smallest whole-number ratio of ions, such as CaCl₂, and is reduced to lowest terms.
    topic_code: "3.1"
  - front: Lattice energy → definition and what makes it large
    back: |
      The energy released when separated gaseous ions come together to form the solid lattice. It is larger for smaller ions and for higher charges: MgO (2+, 2−) far exceeds NaCl (1+, 1−).
    topic_code: "3.1"
  - front: Melting points of ionic compounds → why high, and why MgO beats NaCl
    back: |
      Melting means pulling every ion away from its neighbours against strong attractions, so melting points are high: NaCl 801 °C. MgO melts at 2,852 °C because its ions carry double charges and are smaller.
    topic_code: "3.1"
  - front: Brittleness of ionic crystals → the layer-shift explanation
    back: |
      A blow slides one layer of ions over the next, bringing like charges face to face. The repulsion splits the crystal, so ionic solids shatter instead of bending.
    topic_code: "3.1"
  - front: Conductivity of ionic compounds → solid, molten and dissolved
    back: |
      Solid: no, the ions are locked in the lattice. Molten or dissolved in water: yes, the ions are free to move and carry current. Dissolved ionic compounds are electrolytes.
    topic_code: "3.1"
  - front: Writing an ionic formula → the charge-balance rule
    back: |
      Total positive charge must equal total negative charge, using the smallest whole numbers. Ca²⁺ with Cl⁻ needs two chlorides: CaCl₂. Al³⁺ with O²⁻ needs 2 Al and 3 O: Al₂O₃.
    topic_code: "3.2"
  - front: Criss-cross method → how it works and the reduction step
    back: |
      Swap the charge numbers into subscripts: Al³⁺ O²⁻ → Al₂O₃. Then reduce to lowest terms: Mg²⁺ O²⁻ → Mg₂O₂ → MgO. Always check the charges multiply out to zero.
    topic_code: "3.2"
  - front: Parentheses in ionic formulas → when to use them
    back: |
      Only around a polyatomic ion that appears more than once: Ca(NO₃)₂, (NH₄)₂SO₄. A single polyatomic ion takes no parentheses: NaNO₃, K₂SO₄.
    topic_code: "3.2"
  - front: Ammonium, hydroxide, nitrate, nitrite → formulas and charges
    back: |
      NH₄⁺ (the only common polyatomic cation), OH⁻, NO₃⁻, NO₂⁻.
    topic_code: "3.2"
  - front: Sulfate, sulfite, carbonate, phosphate → formulas and charges
    back: |
      SO₄²⁻, SO₃²⁻, CO₃²⁻, PO₄³⁻. Sulfite has one fewer oxygen than sulfate; the charge is the same.
    topic_code: "3.2"
  - front: Acetate, hydrogen carbonate, cyanide, permanganate → formulas and charges
    back: |
      C₂H₃O₂⁻ (acetate), HCO₃⁻ (hydrogen carbonate or bicarbonate), CN⁻ (cyanide), MnO₄⁻ (permanganate).
    topic_code: "3.2"
  - front: Chlorate series (perchlorate to hypochlorite) → formulas and the naming pattern
    back: |
      ClO₄⁻ perchlorate, ClO₃⁻ chlorate, ClO₂⁻ chlorite, ClO⁻ hypochlorite; all 1−. Per- adds an oxygen to -ate; hypo- removes one from -ite.
    topic_code: "3.2"
  - front: Chromate and dichromate → formulas
    back: |
      CrO₄²⁻ chromate and Cr₂O₇²⁻ dichromate, both 2−.
    topic_code: "3.2"
  - front: -ide, -ite and -ate endings → what each tells you
    back: |
      -ide: a monatomic anion (chloride Cl⁻, sulfide S²⁻, oxide O²⁻), with hydroxide and cyanide as exceptions. -ite and -ate: polyatomic ions containing oxygen, -ate with one more oxygen than -ite.
    topic_code: "3.2"
  - front: Naming a binary ionic compound → the rule
    back: |
      Cation name (the element's name) then anion stem plus -ide, with no prefixes: MgO magnesium oxide, K₂S potassium sulfide, AlCl₃ aluminium chloride.
    topic_code: "3.2"
  - front: Stock system (Roman numerals) → what the numeral means and who needs it
    back: |
      The numeral is the charge on one cation, used for metals that form more than one ion: FeCl₃ iron(III) chloride, Cu₂O copper(I) oxide. Groups 1 and 2, Al, Zn, Ag and Cd never take a numeral.
    topic_code: "3.2"
  - front: Finding the Roman numeral from a formula → the method
    back: |
      Total the anion charges, then divide by the number of metal ions. Fe₂O₃: three O²⁻ make 6−, shared by two Fe, so 3+ each: iron(III) oxide. The subscript is not the numeral.
    topic_code: "3.2"
  - front: Iron(II) versus iron(III) compounds → FeO, Fe₂O₃, FeCl₂, FeCl₃
    back: |
      FeO iron(II) oxide; Fe₂O₃ iron(III) oxide; FeCl₂ iron(II) chloride; FeCl₃ iron(III) chloride. The numeral changes the formula because the charge changes.
    topic_code: "3.2"
  - front: Formula of magnesium phosphate → working it out
    back: |
      Mg²⁺ and PO₄³⁻: the least common multiple of 2 and 3 is 6, so three Mg²⁺ (6+) and two PO₄³⁻ (6−): Mg₃(PO₄)₂.
    topic_code: "3.2"
  - front: Formula of ammonium sulfate → working it out
    back: |
      NH₄⁺ and SO₄²⁻: two ammonium ions balance one sulfate: (NH₄)₂SO₄. Parentheses because the polyatomic cation appears twice.
    topic_code: "3.2"
  - front: Naming Cr₂(SO₄)₃ → the steps
    back: |
      Three sulfates (2− each) total 6−; two chromiums share 6+, so each is 3+. Chromium(III) sulfate.
    topic_code: "3.2"
  - front: Sodium chloride formula error (NaCl₂) → why it is wrong
    back: |
      Na⁺ and Cl⁻ balance one to one. A second chloride would give a net charge of 1−, and compounds are neutral. Subscripts come from charge balance, not habit.
    topic_code: "3.2"
  - front: Prefixes (di-, tri-) in ionic names → why they are not used
    back: |
      The ion charges already fix the ratio, so "calcium dichloride" is wrong; CaCl₂ is calcium chloride. Prefixes belong to molecular compounds such as carbon dioxide.
    topic_code: "3.2"
  - front: Electrolyte → definition and the ionic connection
    back: |
      A substance whose solution (or melt) conducts electricity because it contains mobile ions. Ionic compounds that dissolve in water are electrolytes; the lattice comes apart into separate ions.
    topic_code: "3.1"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 3.1 and 3.2: ions, ionic bonding and naming
    ionic compounds), with about a third reviewing earlier weeks (electron configurations, periodic trends, ions
    and isotopes, average atomic mass and properties of matter). Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: properties of three solids (3.1)
    - slug: chem-u03-w08-q01
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge (NIST Chemistry WebBook melting points, rounded)"
      points: 1
      stimulus: |
        | Solid | Melting point (°C) | Conducts as solid? | Conducts when molten? | Conducts when dissolved in water? |
        |---|---|---|---|---|
        | A | 801 | no | yes | yes |
        | B | 2,852 | no | yes | barely soluble |
        | C | 0 | no | no | does not dissolve as ions |
      prompt: |
        Which conclusion about solids A and B is best supported by the table?
      options:
        - "Both are ionic compounds, because they conduct only when their ions are free to move"
        - "Both are metals, because they conduct electricity"
        - "A is ionic and B is molecular, because B is barely soluble"
        - "Neither is ionic, because neither conducts as a solid"
      option_explanations:
        - |
          Correct. Insulating as solids but conducting when molten is the signature of an ionic lattice whose ions are locked in place until melted.
        - |
          Metals conduct in the solid state; A and B do not.
        - |
          Low solubility does not rule out an ionic compound; B's very high melting point and conductivity when molten point to a strongly bonded ionic lattice such as MgO.
        - |
          Ionic solids do not conduct as solids precisely because their ions cannot move; conduction when molten is the decisive evidence.
      answer: 0

    - slug: chem-u03-w08-q02
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge (NIST Chemistry WebBook melting points, rounded)"
      points: 1
      stimulus: |
        | Solid | Melting point (°C) | Conducts as solid? | Conducts when molten? | Conducts when dissolved in water? |
        |---|---|---|---|---|
        | A | 801 | no | yes | yes |
        | B | 2,852 | no | yes | barely soluble |
        | C | 0 | no | no | does not dissolve as ions |
      prompt: |
        Solid A is sodium chloride and solid B is magnesium oxide. Which statement best explains why B melts at a far higher temperature than A?
      options:
        - "B's lattice contains more ions than A's"
        - "B's ions carry 2+ and 2− charges and are smaller, so the attractions in its lattice are much stronger"
        - "Oxygen is a gas at room temperature"
        - "B contains covalent bonds and A does not"
      option_explanations:
        - |
          Melting point depends on the strength of attraction between ions, not on how many ions a sample has.
        - |
          Correct. Doubly charged, small ions give a lattice energy several times that of NaCl, so far more energy is needed to pull the ions apart.
        - |
          The oxide ion in the lattice is not oxygen gas; the state of the element is irrelevant.
        - |
          Both are ionic lattices; magnesium oxide is held by ionic attractions, just stronger ones.
      answer: 1

    - slug: chem-u03-w08-q03
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge (NIST Chemistry WebBook melting points, rounded)"
      points: 1
      stimulus: |
        | Solid | Melting point (°C) | Conducts as solid? | Conducts when molten? | Conducts when dissolved in water? |
        |---|---|---|---|---|
        | A | 801 | no | yes | yes |
        | B | 2,852 | no | yes | barely soluble |
        | C | 0 | no | no | does not dissolve as ions |
      prompt: |
        Why does solid A conduct electricity when dissolved in water but not as a dry crystal?
      options:
        - "Water supplies the electrons that carry the current"
        - "The crystal's electrons are too tightly bound, but dissolving frees them"
        - "In the crystal the ions are fixed in the lattice; in solution the ions separate and move freely to carry charge"
        - "Dissolving converts the ionic compound into a metal"
      option_explanations:
        - |
          The charge carriers in solution are the dissolved ions, not electrons from water.
        - |
          Conduction in an electrolyte is by moving ions, not freed electrons.
        - |
          Correct. Current requires mobile charged particles; the lattice holds the ions rigidly, while water separates them into free Na⁺ and Cl⁻.
        - |
          Dissolving is a physical change; sodium chloride remains an ionic compound in solution.
      answer: 2

    # ---- Multiple choice (3.1)
    - slug: chem-u03-w08-q04
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which ion would nitrogen (group 15) be expected to form, and which noble gas configuration would it have?
      options:
        - "N⁵⁺, helium"
        - "N³⁺, helium"
        - "N⁵⁻, argon"
        - "N³⁻, neon"
      option_explanations:
        - |
          Losing five electrons from a small, electronegative atom is far too costly; nonmetals gain electrons.
        - |
          Nitrogen has five valence electrons and gains three rather than losing three.
        - |
          Gaining five would exceed an octet; nitrogen needs only three to complete it.
        - |
          Correct. Nitrogen (2s² 2p³) gains three electrons to reach 2s² 2p⁶, neon's configuration.
      answer: 3

    - slug: chem-u03-w08-q05
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Why does solid potassium bromide shatter when struck with a hammer rather than bending like a metal?
      options:
        - "A shift of one layer of ions brings like charges opposite each other, and their repulsion splits the crystal"
        - "The ionic bonds are too weak to hold the crystal together"
        - "The electrons in the lattice are free to move"
        - "Bromide ions are gases that escape when the crystal is hit"
      option_explanations:
        - |
          Correct. Ionic crystals are hard but brittle because displacing a layer puts cation against cation and anion against anion.
        - |
          Ionic attractions are strong, which is why the melting point is high; brittleness comes from the arrangement, not weakness.
        - |
          Free electrons are a feature of metals and explain why metals bend; ionic solids have none.
        - |
          Bromide ions are part of the solid lattice; nothing escapes as gas.
      answer: 0

    - slug: chem-u03-w08-q06
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which pair of elements is most likely to form an ionic compound?
      options:
        - "Carbon and oxygen"
        - "Calcium and fluorine"
        - "Nitrogen and hydrogen"
        - "Sulfur and chlorine"
      option_explanations:
        - |
          Two nonmetals share electrons rather than transferring them; CO₂ is molecular.
        - |
          Correct. A group 2 metal with low ionization energy and a group 17 nonmetal with high electronegativity transfer electrons to give Ca²⁺ and F⁻.
        - |
          Both are nonmetals; ammonia is a molecular compound.
        - |
          Both are nonmetals with similar electronegativities; they form covalent bonds.
      answer: 1

    # ---- Multiple choice (3.2)
    - slug: chem-u03-w08-q07
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the correct formula for aluminium sulfate?
      options:
        - "AlSO₄"
        - "Al₂SO₄"
        - "Al₂(SO₄)₃"
        - "Al₃(SO₄)₂"
      option_explanations:
        - |
          One Al³⁺ and one SO₄²⁻ leave a net charge of 1+; the compound must be neutral.
        - |
          Two Al³⁺ (6+) with one sulfate (2−) is not balanced.
        - |
          Correct. Two Al³⁺ give 6+ and three SO₄²⁻ give 6−; parentheses show the sulfate unit is taken three times.
        - |
          Three Al³⁺ (9+) with two sulfates (4−) is unbalanced; the charges were criss-crossed the wrong way.
      answer: 2

    - slug: chem-u03-w08-q08
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the name of Fe₂O₃?
      options:
        - "Iron(II) oxide"
        - "Diiron trioxide"
        - "Iron oxide"
        - "Iron(III) oxide"
      option_explanations:
        - |
          Three O²⁻ total 6−, shared by two iron ions, so each is 3+, not 2+. FeO is iron(II) oxide.
        - |
          Prefixes are used for molecular compounds of nonmetals; ionic compounds are named by charge.
        - |
          Iron forms two different oxides, so the name must specify the charge with a Roman numeral.
        - |
          Correct. 6− from three oxides divided between two irons gives 3+ each: iron(III) oxide.
      answer: 3

    - slug: chem-u03-w08-q09
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which formula is written correctly for calcium hydroxide?
      options:
        - "Ca(OH)₂"
        - "CaOH₂"
        - "Ca₂OH"
        - "CaOH"
      option_explanations:
        - |
          Correct. Ca²⁺ needs two OH⁻ ions, and a repeated polyatomic ion goes in parentheses.
        - |
          Without parentheses the subscript 2 applies only to hydrogen, giving a different (impossible) compound.
        - |
          Two Ca²⁺ (4+) with one OH⁻ (1−) is unbalanced.
        - |
          One Ca²⁺ with one OH⁻ leaves a net charge of 1+.
      answer: 0

    - slug: chem-u03-w08-q10
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Sodium-24, used as a tracer, has a half-life of 15.0 hours. A sample starts with 200 mg. How much sodium-24 remains after 45.0 hours?
      options:
        - "66.7 mg"
        - "25.0 mg"
        - "50.0 mg"
        - "12.5 mg"
      option_explanations:
        - |
          Dividing 200 by 3 treats decay as linear; the amount halves each half-life instead.
        - |
          Correct. 45.0 ÷ 15.0 = 3 half-lives: 200 → 100 → 50.0 → 25.0 mg.
        - |
          50.0 mg is what remains after two half-lives, 30.0 hours.
        - |
          12.5 mg would require four half-lives, 60.0 hours.
      answer: 1

    # ---- Spiral review
    - slug: chem-u03-w08-q11
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following ions has the same electron configuration as argon?
      options:
        - "Na⁺"
        - "O²⁻"
        - "K⁺"
        - "Br⁻"
      option_explanations:
        - |
          Na⁺ has 10 electrons, neon's configuration.
        - |
          O²⁻ has 10 electrons, also neon's configuration.
        - |
          Correct. Potassium (19) loses one electron to leave 18, 1s² 2s² 2p⁶ 3s² 3p⁶, exactly argon.
        - |
          Br⁻ has 36 electrons, krypton's configuration.
      answer: 2

    - slug: chem-u03-w08-q12
      type: multiple_choice
      topic_code: "2.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Which ion is the largest?
      options:
        - "Mg²⁺"
        - "Na⁺"
        - "F⁻"
        - "O²⁻"
      option_explanations:
        - |
          Mg²⁺ has 10 electrons held by 12 protons, the tightest pull of the four and the smallest radius.
        - |
          Na⁺ has 10 electrons held by 11 protons, smaller than the anions.
        - |
          F⁻ has 10 electrons and 9 protons; it is large but oxygen's ion has one proton fewer.
        - |
          Correct. All four have 10 electrons; O²⁻ has only 8 protons holding them, so its cloud is the most expanded.
      answer: 3

    - slug: chem-u03-w08-q13
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Sodium metal and chlorine gas react to form sodium chloride, a white crystalline solid. Which statement correctly classifies this change and the evidence for it?
      options:
        - "A chemical change, because a new substance with entirely different properties has formed"
        - "A physical change, because the sodium and chlorine are still present in the crystal"
        - "A physical change, because no energy was involved"
        - "A chemical change, because the product is a mixture"
      option_explanations:
        - |
          Correct. A reactive metal and a toxic gas become an edible crystalline salt; new properties mean a new substance and a chemical change.
        - |
          The elements are no longer present as themselves; they exist as Na⁺ and Cl⁻ ions in a compound.
        - |
          The reaction releases a great deal of light and heat, and energy change is not the criterion anyway.
        - |
          Sodium chloride is a compound with a fixed ratio, not a mixture.
      answer: 0

    # ---- Multi-select
    - slug: chem-u03-w08-q14
      type: multi_select
      topic_code: "3.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following formula-name pairs are correct? Select all that apply.
      options:
        - "K₂SO₄, potassium sulfate"
        - "NaNO₂, sodium nitrate"
        - "Mg₃(PO₄)₂, magnesium phosphate"
        - "PbO₂, lead(IV) oxide"
        - "NH₄Cl, ammonium chlorine"
      option_explanations:
        - |
          Correct. Two K⁺ balance one SO₄²⁻, and sulfate is the name of SO₄²⁻.
        - |
          NO₂⁻ is nitrite; nitrate is NO₃⁻, so the name is wrong.
        - |
          Correct. Three Mg²⁺ (6+) balance two PO₄³⁻ (6−).
        - |
          Correct. Two O²⁻ (4−) require Pb⁴⁺, so the Roman numeral is IV.
        - |
          The anion Cl⁻ is named chloride, not chlorine; ammonium chloride is correct.
      answer: [0, 2, 3]

    - slug: chem-u03-w08-q15
      type: multi_select
      topic_code: "3.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are typical properties of ionic compounds? Select all that apply.
      options:
        - "High melting points"
        - "Conduct electricity as solids"
        - "Conduct electricity when dissolved in water"
        - "Brittle crystals"
        - "Exist as discrete molecules"
      option_explanations:
        - |
          Correct. Strong attractions throughout the lattice must be overcome to melt the solid.
        - |
          Ions in a solid lattice cannot move, so ionic solids are insulators until melted or dissolved.
        - |
          Correct. Dissolved ions are free to move and carry current; ionic compounds are electrolytes.
        - |
          Correct. Shifting a layer of ions brings like charges together, and repulsion splits the crystal.
        - |
          Ionic compounds form continuous lattices with no separate molecules; the formula gives only a ratio.
      answer: [0, 2, 3]

    # ---- True / false
    - slug: chem-u03-w08-q16
      type: true_false
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The Roman numeral in a name such as iron(III) chloride tells you the subscript on iron in the formula.
      answer: false
      explanation: |
        False. The Roman numeral gives the charge on one iron ion (3+). The formula FeCl₃ has a subscript of 1 on iron; the 3 is on chlorine, placed to balance the 3+ charge with three Cl⁻ ions.

    - slug: chem-u03-w08-q17
      type: true_false
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Every element in group 2 of the periodic table forms an ion with a 2+ charge.
      answer: true
      explanation: |
        True. The alkaline earth metals all have the valence configuration ns², and losing both electrons gives the previous noble gas's configuration: Mg²⁺, Ca²⁺, Sr²⁺, Ba²⁺.

    # ---- Fill in the blank
    - slug: chem-u03-w08-q18
      type: fill_blank
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The polyatomic ion with the formula NH₄⁺ is called ____.
      answer: ["ammonium", "the ammonium ion", "ammonium ion"]
      explanation: |
        Ammonium is the only common polyatomic cation. Compounds such as NH₄Cl and (NH₄)₂SO₄ contain it; ammonia, NH₃, is the neutral molecule.

    - slug: chem-u03-w08-q19
      type: fill_blank
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A calcium ion, Ca²⁺, has 20 protons and ____ electrons.
      answer: ["18", "eighteen"]
      explanation: |
        Electrons = Z − charge = 20 − 2 = 18. The two 4s electrons have been lost, leaving argon's configuration.

