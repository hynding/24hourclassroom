    # ---- Short answer
    - slug: chem-u03-w08-q23
      type: short_answer
      topic_code: "3.2"
      source: "general knowledge"
      points: 3
      prompt: |
        A student writes the following formulas and names. Three contain errors.

        1. Sodium sulfide: Na₂S
        2. Calcium nitrate: CaNO₃
        3. Copper(II) oxide: Cu₂O
        4. Iron(II) phosphate: Fe₃(PO₄)₂
        5. Magnesium dichloride: MgCl₂

        (a) Identify which entries are wrong.
        (b) Give the correct formula or name for each wrong entry.
        (c) For entry 3, explain how the Roman numeral determines the formula.
      answer: |
        (a) Entries 2, 3 and 5 are wrong.
        (b) Calcium nitrate is Ca(NO₃)₂ (two nitrates needed, in parentheses). Copper(II) oxide is CuO (Cu₂O is copper(I) oxide). MgCl₂ is magnesium chloride; prefixes such as "di-" are not used for ionic compounds.
        (c) Copper(II) means Cu²⁺. The oxide ion is O²⁻, so one copper balances one oxide: CuO. With copper(I), Cu⁺, two coppers are needed per oxide, Cu₂O.
      explanation: |
        Three points, one per part.

        (a) 1 pt: entries 2, 3 and 5 identified (and 1 and 4 accepted as correct).

        (b) 1 pt: Ca(NO₃)₂, CuO and magnesium chloride.

        (c) 1 pt: the numeral is the cation charge; charge balance with O²⁻ gives CuO versus Cu₂O.

    - slug: chem-u03-w08-q24
      type: short_answer
      topic_code: "3.1"
      source: "general knowledge"
      points: 3
      prompt: |
        Lithium (Z = 3) reacts with oxygen (Z = 8) to form an ionic compound.

        (a) Write the electron configurations of a lithium atom and an oxygen atom, and state how many electrons each must lose or gain to reach a noble-gas configuration.
        (b) Give the formula of the compound and explain how the charges determine it.
        (c) Lithium oxide melts at about 1,440 °C. Explain this high melting point in terms of the structure of the solid.
      answer: |
        (a) Li: 1s² 2s¹, loses one electron to reach helium's 1s². O: 1s² 2s² 2p⁴, gains two to reach neon's 2s² 2p⁶.
        (b) Li₂O. Each Li⁺ carries 1+ and each O²⁻ carries 2−, so two lithium ions are needed to balance one oxide ion.
        (c) The solid is a crystal lattice in which every Li⁺ is attracted to several surrounding O²⁻ ions and vice versa. Melting requires enough energy to pull all these ions away from one another against strong electrostatic attractions, so the temperature needed is very high.
      explanation: |
        Three points, one per part.

        (a) 1 pt: both configurations and the loss of one (Li) and gain of two (O).

        (b) 1 pt: Li₂O with the charge-balance explanation.

        (c) 1 pt: lattice of ions with strong attractions in all directions requiring much energy to separate.

    # ---- Long answer
    - slug: chem-u03-w08-q25
      type: long_answer
      topic_code: "3.1"
      source: "general knowledge"
      points: 6
      prompt: |
        Magnesium chloride (MgCl₂) and sodium chloride (NaCl) are both ionic solids.

        Explain, starting from the electron configurations of the atoms, how each compound forms and why its formula has the ratio it does. Describe the structure of the resulting solids and use that structure to explain three characteristic properties of ionic compounds. Finally, explain why magnesium oxide (MgO, melting point 2,852 °C) has a far higher melting point than sodium chloride (801 °C), and how you would write the name and formula of the compound magnesium forms with the phosphate ion.
      answer: |
        Sodium is [Ne] 3s¹; losing one electron gives Na⁺ with neon's full-octet configuration. Magnesium is [Ne] 3s²; losing both valence electrons gives Mg²⁺, also neon-like. Chlorine is [Ne] 3s² 3p⁵; gaining one electron gives Cl⁻ with argon's configuration. Compounds must be neutral: one Na⁺ balances one Cl⁻, so NaCl; one Mg²⁺ needs two Cl⁻, so MgCl₂. The electrons lost by the metal are exactly those gained by the chlorine atoms.

        The ions do not pair off into molecules. Each cation attracts every nearby anion and each anion every nearby cation, so the ions pack into a crystal lattice that repeats in three dimensions; in NaCl every ion has six oppositely charged neighbours. The formula is a formula unit, the simplest ratio.

        Three properties follow. High melting points: melting means separating every ion from its neighbours against strong electrostatic attractions, so NaCl melts at 801 °C. Brittleness: a blow shifts a layer of ions, bringing like charges opposite one another, and the repulsion splits the crystal. Conductivity only when molten or dissolved: the solid's ions are fixed in place, but in a melt or a solution they move freely and carry current, which is why dissolved ionic compounds are electrolytes.

        Magnesium oxide melts far higher than sodium chloride because Mg²⁺ and O²⁻ each carry twice the charge of Na⁺ and Cl⁻ and are smaller ions, so the electrostatic attraction between them, and the lattice energy, is several times greater; much more energy is needed to pull the ions apart.

        Magnesium with phosphate: Mg²⁺ and PO₄³⁻; the least common multiple of 2 and 3 is 6, so three Mg²⁺ and two PO₄³⁻: Mg₃(PO₄)₂, magnesium phosphate.
      explanation: |
        Six points.

        1 pt: configurations of Na, Mg and Cl and the electrons lost or gained to reach noble-gas configurations.

        1 pt: charge balance explains NaCl versus MgCl₂.

        1 pt: lattice structure described, with no molecules and the formula as a ratio.

        1 pt: three properties (melting point, brittleness, conductivity) each explained from the structure.

        1 pt: the doubly charged, smaller ions of MgO give stronger attractions and a much higher melting point than NaCl.

        1 pt: Mg₃(PO₄)₂ named magnesium phosphate with the charge-balance reasoning.
