  # ---- Short answer
  - slug: chem-u03-exam-q42
    type: short_answer
    topic_code: "3.3"
    source: "general knowledge"
    points: 3
    prompt: |
      For the molecule formaldehyde, CH₂O (carbon central), (a) state the total number of valence electrons and describe the Lewis structure, including any multiple bond; (b) give the molecular shape and bond angle; (c) state whether the molecule is polar and name the strongest intermolecular force between formaldehyde molecules.
    answer: |
      (a) 12 valence electrons (C 4, H 1 + 1, O 6). Carbon is bonded to two hydrogens by single bonds and to oxygen by a double bond; oxygen carries two lone pairs. Carbon and oxygen each have an octet, each hydrogen has two electrons.
      (b) Three electron domains on carbon (two single bonds and one double bond), no lone pairs: trigonal planar, bond angles about 120°.
      (c) Polar. The C=O bond is strongly polar (ΔEN 0.89) and nothing opposite it cancels it, so the molecule has a net dipole toward oxygen. Strongest intermolecular force: dipole-dipole (no hydrogen bonding, because no hydrogen is bonded to the oxygen).
    explanation: |
      Scoring: (a) 1 point: 4 + 2 + 6 = 12 electrons; two C–H single bonds and a C=O double bond, with two lone pairs on oxygen (every atom satisfied, carbon with an octet). (b) 1 point: three domains on carbon and no lone pair, so trigonal planar, about 120°. (c) 1 point: polar, because the single C=O dipole is not cancelled by the nearly nonpolar C–H bonds; the strongest force is dipole-dipole (no hydrogen bonding: no H on O). Any correct, well-reasoned answer earns the point.

  - slug: chem-u03-exam-q43
    type: short_answer
    topic_code: "3.7"
    source: "NIST Chemistry WebBook (rounded)"
    points: 3
    prompt: |
      Magnesium oxide, MgO, melts at 2,852 °C; sodium fluoride, NaF, melts at 993 °C. Both are ionic solids with the same crystal structure and ions of similar size. (a) Explain, in terms of ion charges, why MgO melts so much higher. (b) State one property other than melting point that both solids share because they are ionic, and explain it. (c) Explain why neither solid conducts electricity until it is melted.
    answer: |
      (a) MgO is made of Mg²⁺ and O²⁻; NaF of Na⁺ and F⁻. The attraction between ions grows with the product of their charges, so the 2+/2− lattice of MgO is held about four times more strongly than the 1+/1− lattice of NaF (a much larger lattice energy), and far more thermal energy is needed to break it apart.
      (b) Both are brittle: a sharp blow shifts one layer of ions so that like charges line up, repel, and the crystal cleaves. (Hard, high-melting, and dissolving to give conducting solutions are also acceptable, with the explanation tied to fixed ions.)
      (c) Electrical conduction needs charged particles that can move. In the solid every ion is locked in place in the lattice; melting frees the ions so they can carry current.
    explanation: |
      Scoring: (a) 1 point: MgO is built of 2+ and 2− ions, NaF of 1+ and 1− ions; the electrostatic attraction (lattice energy) grows with the product of the charges, roughly four times larger for MgO, so far more energy is needed to pull its ions apart. (b) 1 point: both are brittle (a blow slides a layer so like charges meet and repel, splitting the crystal), or both are hard, or both have high melting points relative to molecular solids; the explanation must connect the property to a lattice of fixed ions. (c) 1 point: conduction needs mobile charged particles; in the solid the ions are locked in the lattice, and only on melting (or dissolving) are they free to carry current.

  # ---- Long answer
  - slug: chem-u03-exam-q44
    type: long_answer
    topic_code: "3.6"
    source: "NIST Chemistry WebBook (rounded)"
    points: 6
    prompt: |
      A student is given four liquids and their boiling points: pentane C₅H₁₂ (36 °C), 1-butanol C₄H₉OH (118 °C), diethyl ether (C₂H₅)₂O (35 °C) and octane C₈H₁₈ (126 °C). All four have molar masses between 72 and 114 g/mol. Write a full explanation, grounded in bonding and intermolecular forces, that (1) identifies the strongest intermolecular force present in each liquid, (2) explains why 1-butanol boils so much higher than diethyl ether even though both have the formula C₄H₁₀O, (3) explains why octane boils higher than pentane although both are nonpolar hydrocarbons, and (4) states, with a reason, whether boiling any of these liquids breaks covalent bonds. Use correct terms throughout.
    answer: |
      (1) Pentane and octane contain only C–C and C–H bonds, which are essentially nonpolar, so their only intermolecular force is London dispersion. Diethyl ether has polar C–O bonds and a bent arrangement at oxygen, so it is polar: dipole-dipole forces plus dispersion, but no hydrogen bonding because its hydrogens are bonded to carbon. 1-Butanol has an O–H group, so it forms hydrogen bonds (its strongest force), in addition to dipole-dipole and dispersion forces.
      (2) The two C₄H₁₀O isomers have identical molar masses and similar dispersion forces, so the difference must come from the other forces. Butanol's hydrogen bonds are much stronger than the ether's dipole-dipole attractions, so its molecules need far more energy to separate: 118 °C against 35 °C.
      (3) Octane (114 g/mol) has more electrons and a longer chain than pentane (72 g/mol). Larger, more easily distorted electron clouds and more surface contact give larger momentary dipoles, so octane's dispersion forces are stronger and its boiling point is 90 °C higher.
      (4) No. Boiling is a physical change that overcomes intermolecular forces and lets intact molecules escape as a gas; the covalent bonds inside each molecule are unchanged, which is why the vapour of each liquid is still the same compound.
    explanation: |
      Scoring (6 points). 1 point: pentane and octane: dispersion forces only (nonpolar C–H and C–C bonds). 1 point: diethyl ether: dipole-dipole (polar C–O bonds, bent at oxygen) plus dispersion; no hydrogen bonding because no H is bonded to O. 1 point: 1-butanol: hydrogen bonding (an O–H group) plus dipole-dipole and dispersion. 1 point: butanol's hydrogen bonds are much stronger than ether's dipole-dipole forces, so more energy is needed to separate its molecules, giving a boiling point about 80 °C higher at the same molar mass. 1 point: octane has more electrons and a larger surface area than pentane, so its momentary dipoles are larger and its dispersion forces stronger; 126 °C versus 36 °C. 1 point: no covalent bonds break on boiling; vaporization overcomes forces between molecules while each molecule stays intact (a physical change). Deduct for confusing intramolecular bonds with intermolecular forces or for claiming hydrogen bonding in the ether.
