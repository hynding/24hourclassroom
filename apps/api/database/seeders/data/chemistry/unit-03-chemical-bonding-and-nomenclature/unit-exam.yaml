unit: 3
description: |
  44 questions · about 75 minutes · every topic of Unit 3 (3.1 to 3.7): ions and ionic bonding, naming ionic and
  molecular compounds and acids, Lewis structures, VSEPR shapes and polarity, intermolecular forces, metallic bonding
  and the four kinds of solids, with some review of Units 1 and 2. Two stimulus sets (a table of four unknown solids
  and a table of three molecules), select-all, true/false, fill-in-the-blank and numeric items, two short-answer
  questions (3 points each) and one long answer (6 points). Multiple choice, select-all, true/false and numeric
  items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
  answer are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: four unknown solids (3.7, 3.1)
  - slug: chem-u03-exam-q01
    type: multiple_choice
    topic_code: "3.7"
    source: "NIST Chemistry WebBook (rounded)"
    points: 1
    stimulus: |
      Data table: four unknown solids. | Solid | Melting point | Hardness | Conducts as a solid? | Conducts when molten? | Dissolves in water? | W | 801 °C | hard but brittle | no | yes | yes | X | 1,085 °C | malleable | yes | yes | no | Y | 115 °C | soft, crumbles | no | no | no | Z | above 3,500 °C | extremely hard | no | no | no |
    prompt: |
      Which solid is an ionic compound?
    options:
      - "W"
      - "X"
      - "Y"
      - "Z"
    option_explanations:
      - |
        Correct. Conducting only when molten (ions freed from the lattice), a high melting point, brittleness and water solubility are the ionic fingerprint; W behaves like sodium chloride.
      - |
        X conducts as a solid and is malleable, which points to a sea of mobile electrons: a metal, not an ionic lattice.
      - |
        Y melts at 115 °C and never conducts; weak intermolecular forces between neutral molecules fit a molecular solid such as sulfur.
      - |
        Z never conducts even when molten, so it contains no ions; its extreme hardness and melting point fit a covalent-network solid.
    answer: 0

  - slug: chem-u03-exam-q02
    type: multiple_choice
    topic_code: "3.7"
    source: "NIST Chemistry WebBook (rounded)"
    points: 1
    stimulus: |
      Data table: four unknown solids. | Solid | Melting point | Hardness | Conducts as a solid? | Conducts when molten? | Dissolves in water? | W | 801 °C | hard but brittle | no | yes | yes | X | 1,085 °C | malleable | yes | yes | no | Y | 115 °C | soft, crumbles | no | no | no | Z | above 3,500 °C | extremely hard | no | no | no |
    prompt: |
      What best explains why solid X conducts electricity while solid W does not?
    options:
      - "X contains ions that are free to move; W contains only neutral atoms"
      - "X has covalent bonds, which carry current; W has ionic bonds, which do not"
      - "X has delocalized valence electrons that move through the whole solid; W's ions are locked in a lattice"
      - "X is dissolved in water during the test; W is dry"
    option_explanations:
      - |
        A metal's charge carriers are electrons, not ions, and W contains ions, not neutral atoms; the roles are reversed.
      - |
        Covalent bonds hold electrons between two specific atoms and do not conduct; diamond (Z) has covalent bonds and is an insulator.
      - |
        Correct. In a metal the valence electrons belong to the whole crystal and drift under a voltage; in an ionic solid the charged particles are fixed in place until the solid melts.
      - |
        The table reports conductivity of the solids themselves; the explanation must come from their structure, not from a test condition.
    answer: 2

  - slug: chem-u03-exam-q03
    type: multiple_choice
    topic_code: "3.6"
    source: "NIST Chemistry WebBook (rounded)"
    points: 1
    stimulus: |
      Data table: four unknown solids. | Solid | Melting point | Hardness | Conducts as a solid? | Conducts when molten? | Dissolves in water? | W | 801 °C | hard but brittle | no | yes | yes | X | 1,085 °C | malleable | yes | yes | no | Y | 115 °C | soft, crumbles | no | no | no | Z | above 3,500 °C | extremely hard | no | no | no |
    prompt: |
      Which substance is the most likely identity of solid Y, and what holds its particles together?
    options:
      - "Copper, held by metallic bonding"
      - "Diamond, held by a network of covalent bonds"
      - "Sodium chloride, held by ionic bonds"
      - "Sulfur (S₈ molecules), held by London dispersion forces"
    option_explanations:
      - |
        Copper conducts as a solid and melts at 1,085 °C; that is solid X.
      - |
        Diamond's covalent network makes it the hardest of the four and gives an enormous melting point; that is solid Z.
      - |
        Sodium chloride conducts when molten and dissolves in water; that is solid W.
      - |
        Correct. A soft, non-conducting solid melting at 115 °C is molecular; S₈ rings are nonpolar, so only dispersion forces hold the crystal together, and little energy is needed to melt it.
    answer: 3

  # ---- Stimulus set B: three molecules (3.5, 3.6)
  - slug: chem-u03-exam-q04
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge (Pauling electronegativities, rounded)"
    points: 1
    stimulus: |
      Data table: three molecules. | Label | Formula | Molecular shape | Largest bond ΔEN | Lone pairs on central atom | A | CO₂ | linear | 0.89 | 0 | B | H₂O | bent | 1.24 | 2 | C | CCl₄ | tetrahedral | 0.61 | 0 |
    prompt: |
      Which of the three molecules are polar?
    options:
      - "A only"
      - "B only"
      - "A and B"
      - "A, B and C"
    option_explanations:
      - |
        CO₂'s two polar bonds point in exactly opposite directions and cancel; the molecule is nonpolar despite the large ΔEN.
      - |
        Correct. Only water has polar bonds that do not cancel: its two lone pairs bend the molecule, so the bond dipoles add to a net dipole toward oxygen.
      - |
        A is linear and symmetric; its dipoles cancel. Bond polarity alone does not make a molecule polar.
      - |
        CCl₄'s four identical polar bonds are arranged symmetrically around carbon and cancel exactly; it is nonpolar.
    answer: 1

  - slug: chem-u03-exam-q05
    type: multiple_choice
    topic_code: "3.6"
    source: "NIST Chemistry WebBook (rounded)"
    points: 1
    stimulus: |
      Data table: three molecules. | Label | Formula | Molecular shape | Largest bond ΔEN | Lone pairs on central atom | A | CO₂ | linear | 0.89 | 0 | B | H₂O | bent | 1.24 | 2 | C | CCl₄ | tetrahedral | 0.61 | 0 |
    prompt: |
      The boiling points are 100 °C, 77 °C and −78 °C (sublimation), in some order. Which assignment is correct, and why?
    options:
      - "A 100 °C, B 77 °C, C −78 °C: the most polar bonds give the highest boiling point"
      - "B 100 °C, A 77 °C, C −78 °C: polar molecules boil higher than nonpolar ones"
      - "B 100 °C, C 77 °C, A −78 °C: hydrogen bonding is strongest, then dispersion grows with electron count"
      - "C 100 °C, B 77 °C, A −78 °C: the heaviest molecule always boils highest"
    option_explanations:
      - |
        CO₂ is nonpolar and is the lightest of the three, so it has the weakest intermolecular forces and the lowest boiling point, not the highest.
      - |
        Water is correctly placed, but CCl₄ (154 g/mol, many electrons) has far stronger dispersion forces than CO₂ (44 g/mol) and boils well above it.
      - |
        Correct. Water hydrogen-bonds (100 °C); CCl₄ is nonpolar but large, with dispersion forces strong enough for a 77 °C boiling point; small nonpolar CO₂ has the weakest forces (−78 °C).
      - |
        Mass matters only within one force type; water is the lightest molecule yet boils highest because hydrogen bonds outweigh CCl₄'s dispersion forces.
    answer: 2

  - slug: chem-u03-exam-q06
    type: multiple_choice
    topic_code: "3.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Data table: three molecules. | Label | Formula | Molecular shape | Largest bond ΔEN | Lone pairs on central atom | A | CO₂ | linear | 0.89 | 0 | B | H₂O | bent | 1.24 | 2 | C | CCl₄ | tetrahedral | 0.61 | 0 |
    prompt: |
      A drop of water and a drop of CCl₄ are placed on glass. The water forms a bead; the CCl₄ spreads out. Which statement explains the difference?
    options:
      - "Water's hydrogen bonds pull its molecules strongly toward one another, giving it high surface tension"
      - "CCl₄ has the stronger intermolecular forces, which pull it flat"
      - "Water is denser, so gravity holds it in a bead"
      - "Water molecules repel one another more strongly than CCl₄ molecules do"
    option_explanations:
      - |
        Correct. Surface tension comes from the cohesion between molecules; water's hydrogen bonds make that cohesion strong, so the surface contracts into a bead.
      - |
        CCl₄ has only dispersion forces, weaker per molecule than water's hydrogen bonds; weak cohesion lets it spread.
      - |
        Density does not create beading; mercury, far denser, beads for the same reason water does: strong cohesion.
      - |
        Molecules in a liquid attract, not repel; beading is a sign of strong attraction between water molecules.
    answer: 0

  # ---- Individual multiple choice (3.1–3.7 plus review)
  - slug: chem-u03-exam-q07
    type: multiple_choice
    topic_code: "3.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which ion does a calcium atom (Z = 20, [Ar] 4s²) form, and why?
    options:
      - "Ca⁻, by gaining one electron to pair its 4s electron"
      - "Ca²⁺, by losing its two 4s electrons to reach argon's configuration"
      - "Ca²⁻, by gaining two electrons to fill the 4p sublevel"
      - "Ca⁺, by losing one 4s electron"
    option_explanations:
      - |
        A metal with two valence electrons loses them; gaining one would leave it far from a full shell.
      - |
        Correct. Removing both 4s electrons leaves the stable [Ar] configuration; group 2 metals form 2+ ions.
      - |
        Reaching a full 4p sublevel would need six more electrons, impossible for an atom with low electronegativity.
      - |
        Losing one electron leaves a lone 4s electron; the second is still easy to remove, so calcium does not stop at 1+.
    answer: 1

  - slug: chem-u03-exam-q08
    type: multiple_choice
    topic_code: "3.1"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the formula of the compound formed between aluminum and sulfur?
    options:
      - "AlS"
      - "Al₂S₃"
      - "Al₃S₂"
      - "AlS₂"
    option_explanations:
      - |
        Al³⁺ and S²⁻ do not cancel one to one; 3+ and 2− leave a net charge.
      - |
        Correct. Two Al³⁺ (6+) balance three S²⁻ (6−); criss-crossing the charges gives Al₂S₃.
      - |
        This reverses the subscripts: three Al³⁺ (9+) against two S²⁻ (4−) is far from neutral.
      - |
        One Al³⁺ against two S²⁻ gives a net charge of 1−; ionic formulas must be neutral.
    answer: 1

  - slug: chem-u03-exam-q09
    type: multiple_choice
    topic_code: "3.2"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the correct name of Fe₂(SO₄)₃?
    options:
      - "Iron sulfate"
      - "Diiron trisulfate"
      - "Iron(III) sulfate"
      - "Iron(II) sulfate"
    option_explanations:
      - |
        Iron forms more than one ion, so the name must state its charge with a Roman numeral.
      - |
        Prefixes belong to molecular compounds; an ionic compound is named by its ions.
      - |
        Correct. Three sulfate ions carry 6−, so two iron ions carry 6+, 3+ each: iron(III) sulfate.
      - |
        Iron(II) sulfate is FeSO₄, one Fe²⁺ balancing one SO₄²⁻.
    answer: 2

  - slug: chem-u03-exam-q10
    type: multiple_choice
    topic_code: "3.2"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the formula of ammonium phosphate?
    options:
      - "NH₄PO₄"
      - "(NH₄)₂PO₄"
      - "NH₄(PO₄)₃"
      - "(NH₄)₃PO₄"
    option_explanations:
      - |
        NH₄⁺ (1+) and PO₄³⁻ (3−) do not balance one to one.
      - |
        Two ammonium ions give only 2+ against phosphate's 3−.
      - |
        This gives one 1+ ion against three 3− ions, a net charge of 8−.
      - |
        Correct. Three NH₄⁺ ions balance one PO₄³⁻; parentheses show that the whole ammonium ion is taken three times.
    answer: 3

  - slug: chem-u03-exam-q11
    type: multiple_choice
    topic_code: "3.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which pair of names and formulas is matched correctly?
    options:
      - "NaNO₂, sodium nitrate"
      - "K₂SO₃, potassium sulfite"
      - "CuO, copper(I) oxide"
      - "MgCl₂, magnesium dichloride"
    option_explanations:
      - |
        NO₂⁻ is nitrite; nitrate is NO₃⁻. The "-ite" ion has one fewer oxygen.
      - |
        Correct. SO₃²⁻ is sulfite (one fewer oxygen than sulfate), and two K⁺ balance its 2− charge.
      - |
        One O²⁻ requires the copper ion to be 2+, so CuO is copper(II) oxide; copper(I) oxide is Cu₂O.
      - |
        Magnesium has a fixed 2+ charge and the compound is ionic, so no prefix is used: magnesium chloride.
    answer: 1

  - slug: chem-u03-exam-q12
    type: multiple_choice
    topic_code: "3.4"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the name of P₂O₅?
    options:
      - "Phosphorus oxide"
      - "Phosphorus(V) oxide"
      - "Diphosphorus pentoxide"
      - "Diphosphorus pentaoxygen"
    option_explanations:
      - |
        Two nonmetals need prefixes to tell P₂O₅ from other phosphorus oxides such as P₄O₆.
      - |
        Roman numerals are for metals of variable charge; phosphorus and oxygen form a molecular compound.
      - |
        Correct. "Di" for two phosphorus atoms, "penta" for five oxygens, and the second element ends in "-ide" (the a in penta is dropped before the o).
      - |
        The second element's name is changed to its "-ide" form; "oxygen" is never used unchanged in a compound name.
    answer: 2

  - slug: chem-u03-exam-q13
    type: multiple_choice
    topic_code: "3.4"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the name of the acid HClO₃(aq)?
    options:
      - "Chloric acid"
      - "Hydrochloric acid"
      - "Chlorous acid"
      - "Perchloric acid"
    option_explanations:
      - |
        Correct. The anion ClO₃⁻ is chlorate; an "-ate" anion gives an "-ic" acid: chloric acid.
      - |
        Hydrochloric acid is HCl, a binary acid with no oxygen; the "hydro-" prefix belongs only to binary acids.
      - |
        Chlorous acid comes from chlorite, ClO₂⁻, and is HClO₂.
      - |
        Perchloric acid comes from perchlorate, ClO₄⁻, and is HClO₄.
    answer: 0

  - slug: chem-u03-exam-q14
    type: multiple_choice
    topic_code: "3.3"
    source: "general knowledge"
    points: 1
    prompt: |
      In the Lewis structure of carbon dioxide, how many lone pairs are on the carbon atom and how many on each oxygen?
    options:
      - "Carbon 2, each oxygen 2"
      - "Carbon 0, each oxygen 2"
      - "Carbon 0, each oxygen 3"
      - "Carbon 1, each oxygen 1"
    option_explanations:
      - |
        Carbon's four valence electrons are all used in the two double bonds; it has no lone pairs.
      - |
        Correct. Sixteen electrons: two C=O double bonds use eight, and the remaining eight sit as two lone pairs on each oxygen, giving every atom an octet.
      - |
        Three lone pairs on each oxygen would be twenty electrons in total, four more than CO₂ has.
      - |
        This leaves carbon with only one bond's worth of electrons and oxygen short of an octet.
    answer: 1

  - slug: chem-u03-exam-q15
    type: multiple_choice
    topic_code: "3.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which comparison of the C–O, C=O and C≡O bonds is correct?
    options:
      - "C–O is the shortest and strongest"
      - "All three have the same length because the same two atoms are involved"
      - "C=O is longer than C–O because it has more electrons"
      - "C≡O is the shortest and strongest"
    option_explanations:
      - |
        A single bond is the longest and weakest of the three; more shared pairs pull the nuclei closer.
      - |
        Bond length depends on bond order, not only on the atoms; CO (triple) is 113 pm while a C–O single bond is about 143 pm.
      - |
        More shared electrons shorten the bond, not lengthen it; C=O is about 120 pm against 143 pm for C–O.
      - |
        Correct. Triple bonds share six electrons, draw the atoms closest together and need the most energy to break.
    answer: 3

  - slug: chem-u03-exam-q16
    type: multiple_choice
    topic_code: "3.3"
    source: "general knowledge (Pauling electronegativities, rounded)"
    points: 1
    prompt: |
      Using electronegativities (K 0.82, Br 2.96, H 2.20, Cl 3.16, N 3.04), which bond is best described as nonpolar covalent?
    options:
      - "K–Br"
      - "H–Cl"
      - "N–Cl"
      - "H–N"
    option_explanations:
      - |
        ΔEN = 2.14 between a metal and a nonmetal: ionic, not covalent.
      - |
        ΔEN = 0.96; the electrons sit nearer chlorine, so H–Cl is a polar covalent bond.
      - |
        Correct. ΔEN = 0.12, well under 0.4, so the pair is shared almost equally.
      - |
        ΔEN = 0.84: polar covalent, with nitrogen the δ− end (the bond responsible for ammonia's hydrogen bonding).
    answer: 2

  - slug: chem-u03-exam-q17
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge"
    points: 1
    prompt: |
      What are the molecular shape and approximate bond angle of NF₃?
    options:
      - "Trigonal pyramidal, about 107°"
      - "Trigonal planar, 120°"
      - "Tetrahedral, 109.5°"
      - "Bent, about 104.5°"
    option_explanations:
      - |
        Correct. Nitrogen has three bonds and one lone pair (four domains); the atoms form a pyramid and the lone pair compresses the angle below 109.5°.
      - |
        Trigonal planar needs three domains with no lone pair, as in BF₃; nitrogen in NF₃ keeps a lone pair.
      - |
        Tetrahedral is the electron-domain geometry, but the molecular shape names only the atoms, three of them.
      - |
        Bent describes two bonded atoms and two lone pairs, as in water; NF₃ has three bonded atoms.
    answer: 0

  - slug: chem-u03-exam-q18
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which molecule has polar bonds but is nonpolar overall?
    options:
      - "NH₃"
      - "H₂S"
      - "CH₂Cl₂"
      - "BF₃"
    option_explanations:
      - |
        Ammonia's trigonal pyramidal shape leaves the three N–H dipoles uncancelled: polar.
      - |
        Hydrogen sulfide is bent like water, so its two S–H dipoles add rather than cancel.
      - |
        Two C–Cl and two C–H bonds around a tetrahedral carbon are not all the same, so the dipoles do not cancel: polar.
      - |
        Correct. Three identical B–F bonds at 120° in a flat triangle cancel exactly; boron has no lone pair to break the symmetry.
    answer: 3

  - slug: chem-u03-exam-q19
    type: multiple_choice
    topic_code: "3.6"
    source: "NIST Chemistry WebBook (rounded)"
    points: 1
    prompt: |
      Ethanol (C₂H₅OH, 46 g/mol) boils at 78 °C while dimethyl ether (CH₃OCH₃, also 46 g/mol) boils at −24 °C. What explains the difference?
    options:
      - "Ethanol has stronger dispersion forces because it is heavier"
      - "Ethanol's covalent bonds are stronger and harder to break"
      - "Dimethyl ether is nonpolar and ethanol is polar"
      - "Ethanol's O–H group hydrogen-bonds; dimethyl ether has no H bonded to oxygen"
    option_explanations:
      - |
        The two compounds have the same molar mass, so their dispersion forces are similar; something else must be responsible.
      - |
        Boiling separates molecules without breaking covalent bonds; bond strength does not set boiling point.
      - |
        Both molecules are polar (the C–O bonds are polar and the shapes are bent at oxygen); polarity alone does not account for a 100 °C gap.
      - |
        Correct. Only ethanol has hydrogen bonded directly to oxygen, so only ethanol forms hydrogen bonds between molecules, which take far more energy to overcome.
    answer: 3

  - slug: chem-u03-exam-q20
    type: multiple_choice
    topic_code: "3.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Why does brass (copper with zinc atoms substituted into the lattice) resist bending more than pure copper?
    options:
      - "Zinc atoms are a different size, so the layers of atoms cannot slide past one another as easily"
      - "Zinc forms ionic bonds with copper, locking the lattice"
      - "Brass has fewer delocalized electrons, so the metallic bonds are stronger"
      - "Zinc atoms remove the electron sea, making brass a covalent-network solid"
    option_explanations:
      - |
        Correct. In a pure metal identical atoms slide in smooth layers; a foreign atom of a different size disrupts the layers and resists slipping, so the alloy is harder.
      - |
        Two metals do not transfer electrons to form ions; brass is a metallic solid with an electron sea.
      - |
        Zinc contributes its own valence electrons; the hardness comes from disrupted layers, not from fewer electrons.
      - |
        Brass conducts and is malleable, both signs that the electron sea remains; it is not a covalent network.
    answer: 0

  - slug: chem-u03-exam-q21
    type: multiple_choice
    topic_code: "3.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement about the bonding in potassium bromide is correct?
    options:
      - "Each K atom shares one electron with one Br atom to form a KBr molecule"
      - "Each K atom transfers one electron to a Br atom, and the resulting ions attract in every direction in a lattice"
      - "K and Br atoms are held together by a sea of delocalized electrons"
      - "K and Br form a covalent bond because their electronegativities are similar"
    option_explanations:
      - |
        A metal and a nonmetal transfer rather than share, and ionic compounds form lattices, not discrete molecules.
      - |
        Correct. K⁺ and Br⁻ form, and each ion is surrounded by ions of opposite charge; the formula KBr is a ratio, not a molecule.
      - |
        An electron sea describes a metal; bromine is a nonmetal that keeps the electron it gains.
      - |
        ΔEN = 2.96 − 0.82 = 2.14, a very large difference that marks the bond as ionic.
    answer: 1

  - slug: chem-u03-exam-q22
    type: multiple_choice
    topic_code: "3.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which compound is named with prefixes, and why?
    options:
      - "CaF₂, because fluorine is a halogen"
      - "FeCl₃, because iron has more than one possible charge"
      - "SF₆, because it is a compound of two nonmetals"
      - "Na₂S, because sodium has a fixed charge"
    option_explanations:
      - |
        Calcium fluoride is ionic (metal plus nonmetal) and is named by its ions; the subscript follows from the charges.
      - |
        Iron's variable charge calls for a Roman numeral, iron(III) chloride, not prefixes.
      - |
        Correct. Two nonmetals form a molecular compound, and prefixes state the atom count: sulfur hexafluoride.
      - |
        Sodium sulfide is ionic; a fixed charge means no numeral and no prefix are needed.
    answer: 2

  - slug: chem-u03-exam-q23
    type: multiple_choice
    topic_code: "2.8"
    source: "general knowledge"
    points: 1
    prompt: |
      Of the four isoelectronic ions below, each with 10 electrons, which has the largest radius?
    options:
      - "Na⁺"
      - "Mg²⁺"
      - "F⁻"
      - "O²⁻"
    option_explanations:
      - |
        Sodium's cation lost its outer level; with 11 protons on 10 electrons it is smaller than a neon atom.
      - |
        Magnesium's 12 protons hold the same 10 electrons even more tightly; Mg²⁺ is the smallest of the four.
      - |
        Fluoride is larger than the cations but has nine protons pulling on 10 electrons, a tighter hold than oxide's eight.
      - |
        Correct. All four ions have 10 electrons; oxide has the fewest protons (8), so its electron cloud is held least tightly and spreads the widest.
    answer: 3

  - slug: chem-u03-exam-q24
    type: multiple_choice
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Which configuration describes the sulfide ion, S²⁻?
    options:
      - "[Ne] 3s² 3p⁶"
      - "[Ne] 3s² 3p⁴"
      - "[Ne] 3s² 3p²"
      - "[Ar] 4s²"
    option_explanations:
      - |
        Correct. Sulfur ([Ne] 3s² 3p⁴) gains two electrons to fill 3p, matching argon's configuration.
      - |
        This is the neutral sulfur atom; the ion has two more electrons.
      - |
        This would be a 2+ ion; a nonmetal gains electrons rather than losing them.
      - |
        Sulfide has 18 electrons, the same as argon; it does not begin a new level.
    answer: 0

  - slug: chem-u03-exam-q25
    type: multiple_choice
    topic_code: "2.2"
    source: "general knowledge"
    points: 1
    prompt: |
      How many protons, neutrons and electrons are in one ³⁵Cl⁻ ion?
    options:
      - "17 p, 18 n, 18 e"
      - "17 p, 18 n, 16 e"
      - "18 p, 17 n, 18 e"
      - "17 p, 35 n, 17 e"
    option_explanations:
      - |
        Correct. Z = 17 protons; neutrons = 35 − 17 = 18; a 1− charge means one extra electron, 18.
      - |
        Sixteen electrons would give a 1+ charge; chloride has gained an electron.
      - |
        Changing the proton count changes the element; an ion of chlorine always has 17 protons.
      - |
        The mass number 35 is protons plus neutrons, not the neutron count alone.
    answer: 0

  - slug: chem-u03-exam-q26
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Brass, sodium chloride and iron are, respectively, examples of which classes of matter?
    options:
      - "Compound, compound, element"
      - "Homogeneous mixture, compound, element"
      - "Element, heterogeneous mixture, compound"
      - "Homogeneous mixture, element, compound"
    option_explanations:
      - |
        Brass has no fixed composition (the zinc content varies), so it is a mixture rather than a compound.
      - |
        Correct. Brass is a solid solution of copper and zinc in variable proportion; NaCl has a fixed ratio of two elements; iron is one kind of atom.
      - |
        Sodium chloride's composition is uniform and fixed, which makes it a compound, not a mixture.
      - |
        Sodium chloride contains two elements chemically combined; iron is a single element.
    answer: 1

  - slug: chem-u03-exam-q27
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Liquid water boils and the vapour is collected. Which description of the change is correct?
    options:
      - "Chemical change: O–H bonds break to release hydrogen and oxygen"
      - "Chemical change: the water molecules are converted into steam molecules"
      - "Physical change: hydrogen bonds between molecules are overcome but each H₂O molecule is unchanged"
      - "Physical change: the covalent bonds stretch but do not break"
    option_explanations:
      - |
        Boiling produces water vapour, not hydrogen and oxygen; the covalent bonds stay intact.
      - |
        Steam is water in the gas state; the molecules are identical to those in the liquid.
      - |
        Correct. Boiling is a physical change that separates molecules by overcoming intermolecular forces; the molecule's identity is untouched.
      - |
        The covalent bonds are not what boiling acts on; the intermolecular forces are.
    answer: 2

  - slug: chem-u03-exam-q28
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Solid iodine is warmed gently and turns directly into purple vapour. In terms of particles and energy, what happens?
    options:
      - "Added energy breaks I–I covalent bonds and releases iodine atoms"
      - "Added energy lets I₂ molecules overcome the dispersion forces holding the crystal and move apart as a gas"
      - "Removing energy frees the molecules from the lattice"
      - "The molecules shrink, so they slip out of the lattice"
    option_explanations:
      - |
        Sublimation leaves the I₂ molecules whole; purple vapour is I₂, not iodine atoms.
      - |
        Correct. Heating raises the molecules' kinetic energy until they escape the weak dispersion forces of the molecular solid; sublimation is a physical change.
      - |
        Changing from solid to gas always requires energy to be added, not removed.
      - |
        Particles do not change size with temperature; they change speed and spacing.
    answer: 1

  # ---- Select all that apply
  - slug: chem-u03-exam-q29
    type: multi_select
    topic_code: "3.6"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which molecules can form hydrogen bonds with other molecules of the same substance? Select all that apply.
    options:
      - "HF"
      - "CH₄"
      - "CH₃OH"
      - "H₂S"
      - "NH₃"
    option_explanations:
      - |
        Yes: hydrogen bonded to fluorine, the most electronegative element, hydrogen-bonds strongly.
      - |
        No: carbon is not electronegative enough; methane's hydrogens carry almost no partial charge.
      - |
        Yes: methanol's O–H group hydrogen-bonds, which is why it is a liquid while methane is a gas.
      - |
        No: sulfur's electronegativity (2.58) is too low and its atom too large; H₂S has only dipole-dipole and dispersion forces.
      - |
        Yes: the N–H bonds and nitrogen's lone pair let ammonia molecules hydrogen-bond.
    answer: [0, 2, 4]
    explanation: |
      Hydrogen bonding requires H bonded directly to N, O or F. HF, CH₃OH and NH₃ qualify; CH₄ and H₂S do not.

  - slug: chem-u03-exam-q30
    type: multi_select
    topic_code: "3.2"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which formulas are written correctly for the compound named? Select all that apply.
    options:
      - "Magnesium hydroxide, Mg(OH)₂"
      - "Copper(II) nitrate, CuNO₃"
      - "Potassium carbonate, K₂CO₃"
      - "Aluminum nitride, AlN"
      - "Lithium sulfate, LiSO₄"
    option_explanations:
      - |
        Correct: Mg²⁺ needs two OH⁻ ions, and parentheses show that the whole hydroxide ion is doubled.
      - |
        Wrong: Cu²⁺ needs two nitrate ions, Cu(NO₃)₂; CuNO₃ would be copper(I) nitrate.
      - |
        Correct: carbonate is 2−, so two K⁺ ions are needed to balance one CO₃²⁻.
      - |
        Correct: Al³⁺ and N³⁻ cancel one to one.
      - |
        Wrong: Li⁺ is 1+ and sulfate is 2−, so two lithium ions are needed, Li₂SO₄.
    answer: [0, 2, 3]
    explanation: |
      Check each formula by adding the charges: Mg(OH)₂, K₂CO₃ and AlN are neutral; CuNO₃ and LiSO₄ are not balanced for the stated metal charges.

  - slug: chem-u03-exam-q31
    type: multi_select
    topic_code: "3.5"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which molecules have a tetrahedral arrangement of electron domains around the central atom? Select all that apply.
    options:
      - "H₂O"
      - "CO₂"
      - "NH₃"
      - "SiH₄"
      - "SO₃"
    option_explanations:
      - |
        Yes: two bonds plus two lone pairs is four domains, tetrahedral electron geometry (bent molecular shape).
      - |
        No: two double bonds are two domains, linear.
      - |
        Yes: three bonds plus one lone pair is four domains (trigonal pyramidal shape).
      - |
        Yes: four Si–H bonds and no lone pairs, tetrahedral in both electron geometry and shape.
      - |
        No: three S=O domains and no lone pair on sulfur, trigonal planar.
    answer: [0, 2, 3]
    explanation: |
      Count domains: lone pairs plus bonds (a multiple bond is one domain). Four domains means tetrahedral electron geometry regardless of the molecular shape name.

  # ---- True / false
  - slug: chem-u03-exam-q32
