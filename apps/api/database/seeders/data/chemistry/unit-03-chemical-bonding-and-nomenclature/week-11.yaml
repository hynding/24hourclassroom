week: 11
unit: 3
title: "Forces Between Molecules, Metals and the Kinds of Solids"
topics: ["3.6", "3.7"]
guide: guides/week-11.md
guide_description: |
  Intermolecular forces against covalent bonds; London dispersion, dipole-dipole and hydrogen bonding, how to
  decide which a substance has, and how they set boiling point, vapour pressure, viscosity and surface tension,
  with the hydride boiling-point anomaly as evidence. Then the electron-sea model of metallic bonding and the
  properties it explains, alloys, and the four kinds of solids (ionic, molecular, covalent-network, metallic)
  compared by particles, bonding, melting point, hardness and conductivity. Worked examples on ranking boiling
  points, ethanol against dimethyl ether, and identifying a solid from its properties.
flashcards_description: |
  32 cards on the three intermolecular forces and their evidence, the properties they control, the electron-sea
  model, alloys, and the four classes of solids with examples.

flashcards:
  - front: Intermolecular versus intramolecular forces → the distinction
    back: |
      Intramolecular forces are the covalent bonds inside a molecule; breaking them is a chemical change. Intermolecular forces (IMFs) are the much weaker attractions between separate molecules; overcoming them melts or boils the substance without changing the molecules.
    topic_code: "3.6"
  - front: What breaks when water boils → bonds or forces?
    back: |
      Only the hydrogen bonds between water molecules. No O–H bonds break; the steam is still H₂O molecules, just separated.
    topic_code: "3.6"
  - front: London dispersion forces → origin and who has them
    back: |
      Momentary uneven electron distribution gives an instantaneous dipole that induces a dipole in a neighbour; the two attract briefly. Present between all molecules and atoms, and the only force between nonpolar ones.
    topic_code: "3.6"
  - front: Dispersion force strength → what it depends on
    back: |
      The number of electrons (so molecular size and mass) and the shape: larger molecules and long thin molecules with more surface contact have stronger dispersion forces. F₂ and Cl₂ are gases, Br₂ a liquid, I₂ a solid.
    topic_code: "3.6"
  - front: Alkane boiling points (CH₄ to C₅H₁₂) → the trend and its cause
    back: |
      −162, −89, −42, −1, 36 °C: each added CH₂ adds electrons and surface area, strengthening the dispersion forces that are the only IMF in these nonpolar molecules.
    topic_code: "3.6"
  - front: Dipole-dipole forces → definition and an example comparison
    back: |
      Attraction between the δ+ end of one polar molecule and the δ− end of another, added to the dispersion forces always present. Polar acetone (56 °C) boils far above nonpolar butane (−1 °C) of similar mass.
    topic_code: "3.6"
  - front: Hydrogen bond → the strict definition
    back: |
      An attraction between a hydrogen atom bonded to N, O or F in one molecule and a lone pair on N, O or F in a neighbouring molecule. The strongest IMF (about 10–40 kJ/mol), but still far weaker than a covalent bond.
    topic_code: "3.6"
  - front: Why only N, O and F give hydrogen bonds → the reason
    back: |
      They are small and very electronegative, so an H bonded to them is stripped of electron density, a concentrated δ+ that a lone pair on another N, O or F attracts strongly. C–H bonds are not polar enough.
    topic_code: "3.6"
  - front: Group 16 hydride boiling points → the water anomaly as evidence
    back: |
      H₂S −60, H₂Se −41, H₂Te −2 °C rise with size as dispersion predicts; water, the smallest, should be near −80 °C but boils at 100 °C because of hydrogen bonding. NH₃ and HF show the same jump above the trend.
    topic_code: "3.6"
  - front: Ethanol versus dimethyl ether (both C₂H₆O) → which boils higher and why
    back: |
      Ethanol (78 °C), because its O–H group hydrogen-bonds; dimethyl ether (−24 °C) has all its hydrogens on carbon and cannot. Same formula, different IMFs.
    topic_code: "3.6"
  - front: Deciding which IMF dominates → the four-step procedure
    back: |
      Ionic or metallic? Not IMFs. Nonpolar? Dispersion only. Polar? Dispersion plus dipole-dipole. H on N, O or F? Add hydrogen bonding, which then dominates.
    topic_code: "3.6"
  - front: Strongest IMF in Br₂, HCl, NH₃, CO₂ → the four answers
    back: |
      Br₂ dispersion; HCl dipole-dipole; NH₃ hydrogen bonding; CO₂ dispersion (it is nonpolar despite polar bonds).
    topic_code: "3.6"
  - front: Vapour pressure → definition and its link to IMFs
    back: |
      The pressure exerted by vapour in equilibrium with its liquid in a closed container. Weak IMFs let molecules escape easily, giving high vapour pressure (volatile acetone); strong IMFs give low vapour pressure (water, glycerol).
    topic_code: "3.6"
  - front: Viscosity and surface tension → how IMFs affect them
    back: |
      Both rise with IMF strength. Glycerol, with three O–H groups, is viscous; water's hydrogen bonding gives it high surface tension, so it beads and supports insects.
    topic_code: "3.6"
  - front: Why ice floats → hydrogen bonding explanation
    back: |
      In ice each water molecule hydrogen-bonds to four neighbours in an open hexagonal network that holds the molecules farther apart than in the liquid, so ice is less dense (0.92 g/cm³) than water.
    topic_code: "3.6"
  - front: Ranking CH₄, CH₃F, CH₃OH by boiling point → the order and reason
    back: |
      CH₄ (−162 °C, dispersion only) < CH₃F (−78 °C, dipole-dipole) < CH₃OH (65 °C, hydrogen bonding).
    topic_code: "3.6"
  - front: Relative strength of IMFs and covalent bonds → the numbers
    back: |
      Dispersion and dipole-dipole: a few kJ/mol; hydrogen bonds: about 10–40 kJ/mol; covalent bonds: roughly 150–1,000 kJ/mol. IMFs decide state and boiling point; bonds decide chemical identity.
    topic_code: "3.6"
  - front: Metallic bond → the electron-sea model
    back: |
      Metal cations sit in an ordered lattice while their valence electrons are delocalised, free to move through the whole sample. The attraction between the cations and this electron sea is the metallic bond.
    topic_code: "3.7"
  - front: Why metals conduct electricity and heat → electron-sea explanation
    back: |
      The delocalised electrons move freely and carry charge (current) and kinetic energy (heat) through the metal. Metals conduct as solids and as liquids, unlike ionic compounds.
    topic_code: "3.7"
  - front: Why metals are malleable and ductile → electron-sea explanation
    back: |
      When layers of cations slide, the electron sea moves with them and the attraction is kept; no like charges are forced together, so the metal deforms instead of shattering as an ionic crystal does.
    topic_code: "3.7"
  - front: Lustre of metals → explanation
    back: |
      The mobile electrons absorb and re-emit light across the visible range, so a clean metal surface reflects light and looks shiny.
    topic_code: "3.7"
  - front: Melting points of metals → what makes metallic bonding stronger
    back: |
      More delocalised valence electrons and smaller cations give stronger bonding: sodium (1 valence electron) melts at 98 °C, aluminium (3) at 660 °C, iron at 1,538 °C, tungsten at 3,422 °C. Mercury is liquid at −39 °C.
    topic_code: "3.7"
  - front: Alloy → definition and why alloys are harder than pure metals
    back: |
      A mixture of a metal with other elements. Atoms of a different size disrupt the orderly layers so they slide less easily, making the alloy harder and stronger. Steel (Fe + C), brass (Cu + Zn), bronze (Cu + Sn), sterling silver (Ag + Cu).
    topic_code: "3.7"
  - front: Four kinds of solids → particles and what holds each together
    back: |
      Ionic: ions held by ionic bonds. Molecular: molecules held by IMFs. Covalent-network: atoms held by covalent bonds in one giant structure. Metallic: cations held by the electron sea.
    topic_code: "3.7"
  - front: Molecular solids → properties and examples
    back: |
      Low melting points (ice 0 °C, sugar 186 °C, dry ice sublimes at −78 °C), soft, nonconducting, because only weak IMFs must be overcome. Examples: H₂O, CO₂, sucrose, I₂.
    topic_code: "3.7"
  - front: Covalent-network solids → properties and examples
    back: |
      Very high melting points (diamond about 3,550 °C, quartz 1,710 °C), very hard, usually insulators, insoluble, because melting means breaking covalent bonds. Examples: diamond, graphite, SiO₂, SiC.
    topic_code: "3.7"
  - front: Diamond versus graphite → structure and properties
    back: |
      Diamond: each carbon bonded to four others in a rigid tetrahedral network; hardest natural substance, insulator. Graphite: each carbon bonded to three in flat sheets held by dispersion forces, with a delocalised electron per atom; soft, slippery, conducts.
    topic_code: "3.7"
  - front: Conductivity as a test for solid type → the three outcomes
    back: |
      Conducts as a solid: metallic. Conducts only when molten or dissolved: ionic. Conducts in no state: molecular or covalent-network (graphite excepted).
    topic_code: "3.7"
  - front: "Identifying a solid: 1,710 °C, very hard, never conducts → the answer"
    back: |
      Covalent-network. The melting point rules out molecular; no conduction when molten rules out ionic and metallic. Quartz (SiO₂) fits.
    topic_code: "3.7"
  - front: Classifying dry ice, copper, salt, silicon carbide → the four types
    back: |
      Dry ice (CO₂) molecular; copper metallic; sodium chloride ionic; silicon carbide covalent-network.
    topic_code: "3.7"
  - front: Ionic solid conductivity versus metallic → why they differ
    back: |
      Metals carry current with free electrons that are present in the solid. Ionic solids have no free electrons; their charge carriers are the ions themselves, which can move only once the lattice is melted or dissolved.
    topic_code: "3.7"
  - front: Why candle wax melts in your hand but salt does not → solid types
    back: |
      Wax is a molecular solid of large nonpolar hydrocarbons held by dispersion forces, overcome at about 50–60 °C. Salt is an ionic lattice needing 801 °C to pull its ions apart.
    topic_code: "3.7"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 3.6 and 3.7: intermolecular forces, metallic
    bonding and the kinds of solids), with about a third reviewing earlier weeks (molecular polarity, Lewis
    structures, ionic compounds, periodic trends and phase changes). Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: boiling points of hydrides (3.6)
    - slug: chem-u03-w11-q01
      type: multiple_choice
      topic_code: "3.6"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 1
      stimulus: |
        | Compound | H₂O | H₂S | H₂Se | H₂Te |
        |---|---|---|---|---|
        | Molar mass (g/mol) | 18.0 | 34.1 | 81.0 | 129.6 |
        | Boiling point (°C) | 100 | −60 | −41 | −2 |
      prompt: |
        Which statement best explains the boiling points of H₂S, H₂Se and H₂Te?
      options:
        - "Dispersion forces increase with molecular size, so the larger molecules need more energy to separate"
        - "Hydrogen bonding strengthens down the group"
        - "The molecules become more polar down the group"
        - "Heavier molecules move more slowly and so condense at higher temperatures regardless of forces"
      option_explanations:
        - |
          Correct. From sulfur to tellurium the number of electrons rises, strengthening the London dispersion forces and raising the boiling point steadily.
        - |
          None of these three can hydrogen-bond; only N, O and F are small and electronegative enough.
        - |
          Electronegativity falls down the group, so the molecules become less polar, not more.
        - |
          Boiling point is set by the strength of attractions, not by molecular speed; mass matters only through the dispersion forces.
      answer: 0

    - slug: chem-u03-w11-q02
      type: multiple_choice
      topic_code: "3.6"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 1
      stimulus: |
        | Compound | H₂O | H₂S | H₂Se | H₂Te |
        |---|---|---|---|---|
        | Molar mass (g/mol) | 18.0 | 34.1 | 81.0 | 129.6 |
        | Boiling point (°C) | 100 | −60 | −41 | −2 |
      prompt: |
        If the trend of the three heavier compounds continued, water would boil near −80 °C. Why does it boil at 100 °C?
      options:
        - "Water molecules are the heaviest"
        - "Hydrogen bonding between water molecules is far stronger than the dispersion and dipole-dipole forces in the other hydrides"
        - "The O–H covalent bonds are stronger than S–H bonds"
        - "Water is nonpolar and the others are polar"
      option_explanations:
        - |
          Water is the lightest of the four; mass argues for the lowest boiling point.
        - |
          Correct. Hydrogen bonded to oxygen attracts the lone pairs of neighbouring molecules strongly, and separating hydrogen-bonded molecules takes much more energy.
        - |
          Covalent bonds within the molecules do not break on boiling; only forces between molecules matter.
        - |
          Water is strongly polar; all four are polar bent molecules.
      answer: 1

    - slug: chem-u03-w11-q03
      type: multiple_choice
      topic_code: "3.6"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 1
      stimulus: |
        | Compound | H₂O | H₂S | H₂Se | H₂Te |
        |---|---|---|---|---|
        | Molar mass (g/mol) | 18.0 | 34.1 | 81.0 | 129.6 |
        | Boiling point (°C) | 100 | −60 | −41 | −2 |
      prompt: |
        Which other pair of hydrides would show the same kind of anomaly as water and H₂S?
      options:
        - "CH₄ and SiH₄"
        - "HCl and HBr"
        - "NH₃ and PH₃"
        - "H₂Se and H₂Te"
      option_explanations:
        - |
          Neither CH₄ nor SiH₄ can hydrogen-bond; their boiling points follow the dispersion trend smoothly.
        - |
          HCl and HBr both lack hydrogen bonding (Cl and Br are too large); the anomaly in group 17 is HF against HCl.
        - |
          Correct. Ammonia hydrogen-bonds (H on N) and boils at −33 °C, far above phosphine's −88 °C, although phosphine is heavier.
        - |
          Both follow the dispersion trend; neither can hydrogen-bond.
      answer: 2

    # ---- Multiple choice (3.6)
    - slug: chem-u03-w11-q04
      type: multiple_choice
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which force is the only intermolecular attraction between molecules of carbon dioxide?
      options:
        - "Hydrogen bonding"
        - "Ionic bonding"
        - "Dipole-dipole forces"
        - "London dispersion forces"
      option_explanations:
        - |
          CO₂ has no hydrogen at all, so hydrogen bonding is impossible; H-bonding needs H bonded to N, O or F.
        - |
          Carbon dioxide is a molecular compound of two nonmetals; ionic bonding is not an intermolecular force.
        - |
          CO₂ is linear and nonpolar, so it has no permanent dipole for dipole-dipole attraction.
        - |
          Correct. Dispersion forces act between all molecules and are the only IMF for a nonpolar molecule; they are weak enough that CO₂ is a gas at room temperature.
      answer: 3

    - slug: chem-u03-w11-q05
      type: multiple_choice
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which molecule can form hydrogen bonds with other molecules of the same kind?
      options:
        - "CH₄"
        - "CH₃OH"
        - "CH₃Cl"
        - "H₂"
      option_explanations:
        - |
          All of methane's hydrogens are on carbon, which is not electronegative enough.
        - |
          Correct. Methanol's O–H hydrogen is attracted to the oxygen lone pair of a neighbouring molecule.
        - |
          Chloromethane is polar, but its hydrogens are bonded to carbon and chlorine is too large to hydrogen-bond effectively.
        - |
          Hydrogen gas is nonpolar; hydrogen bonding needs H bonded to N, O or F.
      answer: 1

    - slug: chem-u03-w11-q06
      type: multiple_choice
      topic_code: "3.6"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 1
      prompt: |
        Which liquid is expected to have the highest vapour pressure at 25 °C?
      options:
        - "Water (boiling point 100 °C)"
        - "Ethanol (boiling point 78 °C)"
        - "Diethyl ether (boiling point 35 °C)"
        - "Glycerol (boiling point 290 °C)"
      option_explanations:
        - |
          Water's strong hydrogen bonding keeps its molecules in the liquid; its vapour pressure is modest.
        - |
          Ethanol hydrogen-bonds too, though less extensively than water.
        - |
          Correct. The lowest boiling point signals the weakest intermolecular forces, so the most molecules escape into the vapour at a given temperature.
        - |
          Three O–H groups give glycerol very strong hydrogen bonding and a very low vapour pressure.
      answer: 2

    - slug: chem-u03-w11-q07
      type: multiple_choice
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Iodine, I₂, is a solid at room temperature while chlorine, Cl₂, is a gas. Both are nonpolar. What explains the difference?
      options:
        - "Iodine molecules have more electrons, so their dispersion forces are much stronger"
        - "Iodine forms hydrogen bonds"
        - "The I–I covalent bond is stronger than the Cl–Cl bond"
        - "Iodine is an ionic solid"
      option_explanations:
        - |
          Correct. Dispersion forces grow with the size of the electron cloud; I₂ (106 electrons) attracts its neighbours far more strongly than Cl₂ (34).
        - |
          Neither halogen contains hydrogen, so hydrogen bonding cannot be the explanation.
        - |
          The I–I bond is actually weaker than Cl–Cl, and bond strength within molecules does not set the melting point anyway.
        - |
          Iodine is a molecular solid of I₂ molecules; it is not ionic.
      answer: 0

    # ---- Multiple choice (3.7)
    - slug: chem-u03-w11-q08
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        According to the electron-sea model, why can copper be hammered into thin sheets while sodium chloride shatters?
      options:
        - "Copper atoms are smaller than sodium and chloride ions"
        - "Copper has stronger bonds than sodium chloride"
        - "Copper's bonds are covalent and directional"
        - "When copper's cation layers slide, the delocalised electrons move with them and keep the attraction; in NaCl a slide brings like charges together, which repel"
      option_explanations:
        - |
          Atomic size does not decide malleability; the nature of the bonding does.
        - |
          Bond strength is not the issue; NaCl's lattice is very strongly held yet brittle.
        - |
          Metallic bonding is nondirectional; it is covalent-network solids that have rigid directional bonds.
        - |
          Correct. The mobile electron sea tolerates rearrangement of the cations, whereas an ionic lattice's fixed charges repel once displaced.
      answer: 3

    - slug: chem-u03-w11-q09
      type: multiple_choice
      topic_code: "3.7"
      source: "NIST Chemistry WebBook (melting points, rounded)"
      points: 1
      prompt: |
        A solid melts at 3,550 °C, is extremely hard and does not conduct electricity. Which kind of solid is it?
      options:
        - "Covalent-network"
        - "Molecular"
        - "Ionic"
        - "Metallic"
      option_explanations:
        - |
          Correct. Only a giant structure of covalent bonds (diamond) combines such a high melting point with hardness and no conductivity.
        - |
          Molecular solids are soft and melt at low temperatures because only IMFs hold them.
        - |
          Ionic solids melt high but far below 3,550 °C and conduct when molten.
        - |
          A metal would conduct electricity as a solid.
      answer: 0

    - slug: chem-u03-w11-q10
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Why is brass (copper with zinc) harder than pure copper?
      options:
        - "Zinc forms ionic bonds with copper"
        - "Zinc atoms of a different size disrupt the regular layers of copper atoms, so the layers slide less easily"
        - "Brass contains covalent-network regions"
        - "Zinc removes the delocalised electrons"
      option_explanations:
        - |
          Both are metals; the alloy is held by metallic bonding, not ionic bonds.
        - |
          Correct. Atoms of a different size jam the slip of layers that makes a pure metal soft, strengthening the alloy.
        - |
          Brass is a solid solution of two metals with no covalent network.
        - |
          The electron sea remains; brass still conducts electricity well.
      answer: 1

    # ---- Spiral review
    - slug: chem-u03-w11-q11
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Before deciding whether dipole-dipole forces exist between SO₂ molecules, you must know whether SO₂ is polar. What is its shape and polarity?
      options:
        - "Linear and nonpolar"
        - "Trigonal planar and nonpolar"
        - "Bent and nonpolar"
        - "Bent and polar"
      option_explanations:
        - |
          Sulfur's lone pair bends the molecule; it is not linear like CO₂.
        - |
          Trigonal planar is the electron-domain geometry; with a lone pair the molecular shape is bent.
        - |
          A bent molecule with two polar bonds has a net dipole.
        - |
          Correct. Three domains with one lone pair give a bent shape; the S=O dipoles do not cancel, so SO₂ is polar and has dipole-dipole forces.
      answer: 3

    - slug: chem-u03-w11-q12
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which property distinguishes a metallic solid from an ionic solid most clearly in the laboratory?
      options:
        - "Metals have higher melting points"
        - "Only ionic solids are crystalline"
        - "Metals conduct electricity as solids; ionic solids conduct only when molten or dissolved"
        - "Ionic solids are always soft"
      option_explanations:
        - |
          Melting points overlap widely: sodium melts at 98 °C while magnesium oxide melts at 2,852 °C.
        - |
          Both metals and ionic compounds form crystalline lattices.
        - |
          Correct. Free electrons give metals solid-state conductivity; ionic solids need mobile ions, which exist only in the melt or solution.
        - |
          Ionic solids are hard and brittle, not soft.
      answer: 2

    - slug: chem-u03-w11-q13
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        At the boiling point of a liquid the temperature stays constant while energy is added. In terms of intermolecular forces, what is the energy doing?
      options:
        - "Breaking the covalent bonds within the molecules"
        - "Increasing the average kinetic energy of the molecules"
        - "Converting the molecules into atoms"
        - "Overcoming the attractions between molecules so they can separate into the gas, raising their potential energy"
      option_explanations:
        - |
          Boiling is a physical change; the molecules leave intact.
        - |
          Constant temperature means the average kinetic energy is not rising during the phase change.
        - |
          The gas consists of the same molecules as the liquid.
        - |
          Correct. The energy pulls molecules apart against their intermolecular forces; the gain is potential energy, not kinetic.
      answer: 3

    # ---- Multi-select
    - slug: chem-u03-w11-q14
      type: multi_select
      topic_code: "3.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following substances exhibit hydrogen bonding between their molecules? Select all that apply.
      options:
        - "NH₃"
        - "HF"
        - "CH₃OCH₃ (dimethyl ether)"
        - "H₂O₂"
        - "HBr"
      option_explanations:
        - |
          Correct. Hydrogen bonded to nitrogen, with a lone pair on nitrogen to accept.
        - |
          Correct. Hydrogen bonded to fluorine, the most electronegative element.
        - |
          Its hydrogens are all on carbon; the oxygen's lone pairs have no suitable H on neighbouring ether molecules to attract.
        - |
          Correct. Hydrogen peroxide has O–H bonds and oxygen lone pairs.
        - |
          Bromine is too large and not electronegative enough; HBr has only dipole-dipole and dispersion forces.
      answer: [0, 1, 3]

    - slug: chem-u03-w11-q15
      type: multi_select
      topic_code: "3.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are properties explained by the electron-sea model of metals? Select all that apply.
      options:
        - "Electrical conductivity in the solid state"
        - "Brittleness"
        - "Malleability"
        - "Metallic lustre"
        - "Low melting points for all metals"
      option_explanations:
        - |
          Correct. Delocalised electrons are free to carry current through the solid.
        - |
          Metals are not brittle; the mobile electron sea lets layers slide without shattering.
        - |
          Correct. Layers of cations can shift while the electron sea maintains the attraction.
        - |
          Correct. Mobile electrons absorb and re-emit visible light, giving the shiny surface.
        - |
          Melting points range from −39 °C (mercury) to 3,422 °C (tungsten); many metals melt very high.
      answer: [0, 2, 3]

    # ---- True / false
    - slug: chem-u03-w11-q16
      type: true_false
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A hydrogen bond is a covalent bond between a hydrogen atom and an oxygen atom.
      answer: false
      explanation: |
        False. A hydrogen bond is an intermolecular attraction between an H already covalently bonded to N, O or F and a lone pair on N, O or F of a different molecule. It is much weaker than the covalent O–H bond and is broken when water boils, while the covalent bonds survive.

    - slug: chem-u03-w11-q17
      type: true_false
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: When ice melts, the covalent O–H bonds inside the water molecules break.
      answer: false
      explanation: |
        False. Melting overcomes the hydrogen bonds between molecules; each H₂O molecule stays intact with its two covalent O–H bonds. Breaking covalent bonds would be a chemical change producing new substances.

    # ---- Fill in the blank
    - slug: chem-u03-w11-q18
      type: fill_blank
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The weak attractions that arise from momentary, shifting dipoles in electron clouds and exist between all molecules are called London ____ forces.
      answer: ["dispersion"]
      explanation: |
        London dispersion forces are the only intermolecular force in nonpolar substances and grow stronger with the size of the electron cloud, which is why iodine is a solid while chlorine is a gas.

    - slug: chem-u03-w11-q19
      type: fill_blank
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The molecular compound with the formula N₂O₄, named with Greek prefixes, is dinitrogen ____.
      answer: ["tetroxide", "tetraoxide"]
      explanation: |
        Four oxygens take the prefix tetra-, with its final a dropped before oxide: dinitrogen tetroxide. The prefix system is used because nitrogen and oxygen form several different compounds.

