    # ---- Short answer
    - slug: chem-u03-w11-q23
      type: short_answer
      topic_code: "3.6"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 3
      stimulus: |
        | Substance | Formula | Molar mass (g/mol) | Boiling point (°C) |
        |---|---|---|---|
        | Propane | C₃H₈ | 44.1 | −42 |
        | Acetaldehyde | C₂H₄O | 44.1 | 20 |
        | Ethanol | C₂H₆O | 46.1 | 78 |
      prompt: |
        Using the table, answer (a), (b) and (c).

        (a) Identify the strongest intermolecular force present in each substance.
        (b) Explain why acetaldehyde boils about 60 °C higher than propane although their molar masses are identical.
        (c) Explain why ethanol boils higher still, even though its molar mass is only slightly greater than acetaldehyde's.
      answer: |
        (a) Propane: London dispersion only (nonpolar). Acetaldehyde: dipole-dipole (polar C=O group), plus dispersion. Ethanol: hydrogen bonding (O–H group), plus dipole-dipole and dispersion.
        (b) With equal molar masses the dispersion forces are similar, so the difference is acetaldehyde's permanent dipole: dipole-dipole attractions between its molecules require more energy to overcome, raising the boiling point.
        (c) Ethanol's hydrogen on oxygen hydrogen-bonds to the oxygen lone pairs of neighbouring molecules. Hydrogen bonds are much stronger than ordinary dipole-dipole forces, so separating ethanol molecules takes still more energy; the small mass difference cannot account for a 58 °C gap.
      explanation: |
        Three points, one per part.

        (a) 1 pt: dispersion, dipole-dipole, hydrogen bonding respectively.

        (b) 1 pt: equal dispersion, difference due to dipole-dipole forces in the polar molecule.

        (c) 1 pt: hydrogen bonding in ethanol as the dominant and strongest force.

    - slug: chem-u03-w11-q24
      type: short_answer
      topic_code: "3.7"
      source: "general knowledge"
      points: 3
      prompt: |
        Four unknown solids are tested: W melts at 660 °C and conducts electricity as a solid; X melts at 2,852 °C, does not conduct as a solid but conducts when molten; Y melts at 186 °C and never conducts; Z does not melt below 2,000 °C, is very hard and never conducts.

        (a) Classify each solid as ionic, molecular, covalent-network or metallic.
        (b) Describe the particles and the attractions in solid Y, and explain its low melting point.
        (c) Explain why X does not conduct as a solid but does when molten, while W conducts in both states.
      answer: |
        (a) W metallic (aluminium fits); X ionic (magnesium oxide fits); Y molecular (sucrose fits); Z covalent-network (silicon carbide or quartz fits).
        (b) Y consists of discrete molecules held together only by intermolecular forces (dispersion, dipole-dipole or hydrogen bonds). These are far weaker than chemical bonds, so little energy is needed to separate the molecules and the solid melts at a low temperature.
        (c) X's charge carriers are its ions, which are locked in the lattice in the solid and free to move only when it melts. W's charge carriers are delocalised valence electrons, present and mobile in the solid metal and in the liquid alike.
      explanation: |
        Three points, one per part.

        (a) 1 pt: all four correctly classified.

        (b) 1 pt: molecules held by weak IMFs, so low melting point.

        (c) 1 pt: mobile ions only when molten versus mobile electrons in both states.

    # ---- Long answer
    - slug: chem-u03-w11-q25
      type: long_answer
      topic_code: "3.6"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 6
      prompt: |
        Water (H₂O, boiling point 100 °C), hydrogen sulfide (H₂S, −60 °C), methane (CH₄, −162 °C) and sodium chloride (NaCl, 1,413 °C) have very different boiling points.

        For each substance, identify the particles present and the strongest attraction between them. Explain, in terms of those attractions, the order of the four boiling points, including why water boils far above hydrogen sulfide despite being lighter, why methane is lowest, and why sodium chloride is in a different category altogether. Then describe one everyday consequence of water's intermolecular forces.
      answer: |
        Methane consists of nonpolar CH₄ molecules (symmetric tetrahedral, nearly nonpolar C–H bonds). The only attraction between them is the London dispersion force, which is weak for such a small molecule with few electrons, so methane boils at −162 °C, the lowest of the four.

        Hydrogen sulfide consists of bent, polar H₂S molecules. Besides dispersion forces (stronger than methane's because H₂S has more electrons) they attract by dipole-dipole forces, so H₂S boils higher, at −60 °C. Sulfur is too large and not electronegative enough for hydrogen bonding.

        Water consists of bent, polar H₂O molecules whose hydrogens are bonded to oxygen. Each molecule hydrogen-bonds to several neighbours, and hydrogen bonds are far stronger than dipole-dipole or dispersion forces. Although water is lighter than H₂S, separating hydrogen-bonded molecules takes much more energy, so water boils at 100 °C, about 160 °C above the trend that size alone would predict.

        Sodium chloride contains no molecules at all. It is a lattice of Na⁺ and Cl⁻ ions held by ionic bonds, full electrostatic attractions between charged particles that act throughout the crystal. These are chemical bonds, not intermolecular forces, and breaking enough of them to vaporise the substance requires about 1,413 °C.

        Everyday consequence: water's hydrogen bonding gives it a high heat capacity and high boiling point, so lakes and oceans moderate climate and sweat cools the body by evaporating; it also makes ice less dense than water, so ice floats and lakes freeze from the top down.
      explanation: |
        Six points.

        1 pt: methane identified as nonpolar with dispersion forces only, explaining the lowest boiling point.

        1 pt: H₂S identified as polar with dipole-dipole forces, boiling above methane.

        1 pt: water's hydrogen bonding identified and explained (H on O, lone pairs).

        1 pt: the water versus H₂S anomaly explained by hydrogen bonding outweighing size.

        1 pt: NaCl as an ionic lattice held by ionic bonds rather than IMFs, giving a far higher boiling point.

        1 pt: a correct everyday consequence of water's hydrogen bonding.
