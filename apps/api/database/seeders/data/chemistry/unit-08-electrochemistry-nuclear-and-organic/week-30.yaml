    # ---- Short answer
    - slug: chem-u08-w30-q21
      type: short_answer
      topic_code: "8.3"
      source: "general knowledge"
      points: 3
      prompt: |
        A voltaic cell is made from a nickel electrode in 1.0 M Ni²⁺ solution and a silver electrode in 1.0 M Ag⁺ solution, connected by a wire and a salt bridge. Standard reduction potentials: Ag⁺/Ag +0.80 V; Ni²⁺/Ni −0.26 V.
        (a) Identify the anode and the cathode and write the half-reaction at each.
        (b) Calculate E°cell and write the balanced overall equation.
        (c) State which electrode gains mass as the cell runs, and in which direction the cations in the salt bridge move.
      answer: |
        (a) Nickel, with the lower E°, is the anode: Ni → Ni²⁺ + 2e⁻. Silver is the cathode: Ag⁺ + e⁻ → Ag. (b) E°cell = 0.80 − (−0.26) = 1.06 V. Overall (silver half doubled to balance electrons): Ni + 2Ag⁺ → Ni²⁺ + 2Ag; the voltage stays 1.06 V. (c) The silver electrode gains mass as Ag⁺ is reduced onto it; the nickel electrode loses mass. Cations in the salt bridge move toward the cathode (silver side) to replace the positive charge being removed as Ag⁺ plates out.
      explanation: |
        1 point for (a) correct electrodes with both half-reactions. 1 point for (b) 1.06 V and the balanced equation, with the voltage not doubled. 1 point for (c) silver gains mass and cations move toward the cathode.

    - slug: chem-u08-w30-q22
      type: short_answer
      topic_code: "8.4"
      source: "general knowledge"
      points: 3
      stimulus: |
        A student electrolyses water containing a little dissolved sodium sulfate using two inert electrodes, collecting the gas from each in an inverted test tube. After ten minutes the tube over electrode X holds 20.0 mL of gas and the tube over electrode Y holds 10.0 mL. A glowing splint relights in the gas from Y; the gas from X burns with a squeaky pop.
      prompt: |
        (a) Identify the gas at each electrode and state which electrode is the cathode.
        (b) Write the half-reaction occurring at each electrode.
        (c) Explain why the volumes are in a 2:1 ratio.
      answer: |
        (a) X produces hydrogen (squeaky pop) and is the cathode, where reduction occurs; Y produces oxygen (relights a glowing splint) and is the anode. (b) Cathode (X): 2H₂O + 2e⁻ → H₂ + 2OH⁻. Anode (Y): 2H₂O → O₂ + 4H⁺ + 4e⁻. (c) Combining the half-reactions so the electrons cancel (cathode half doubled) gives 2H₂O → 2H₂ + O₂: two moles of hydrogen per mole of oxygen. Equal moles of gas occupy equal volumes at the same temperature and pressure, so the hydrogen volume is twice the oxygen volume. Equivalently, four electrons release one O₂ but two H₂.
      explanation: |
        1 point for (a) hydrogen at X (cathode) and oxygen at Y (anode) with the test evidence. 1 point for (b) both half-reactions. 1 point for (c) the 2:1 mole ratio from the overall equation linked to equal volumes for equal moles.

    # ---- Long answer
    - slug: chem-u08-w30-q23
      type: long_answer
      topic_code: "8.4"
      source: "general knowledge"
      points: 6
      prompt: |
        A jeweller wants to silver-plate a brass key. Write an account of how this is done and the chemistry behind it. Include: (1) a description of the electrolytic cell, naming the electrolyte, what the key is connected to and what the other electrode is made of, with the sign of each electrode; (2) the half-reaction at each electrode and an explanation of why the concentration of silver ions in the solution stays constant; (3) an explanation of why an external power supply is needed, contrasting this cell with a voltaic cell; (4) a calculation of the mass of silver deposited by a current of 0.500 A flowing for 15.0 minutes (F = 96,485 C/mol; Ag = 107.87 g/mol); (5) two practical factors that would affect the quality or thickness of the plating.
      answer: |
        (1) The key is cleaned and connected to the negative terminal of a power supply, making it the cathode; a bar of pure silver is connected to the positive terminal as the anode; both are dipped in a solution containing silver ions (silver nitrate, or a silver cyanide bath in industry). Cathode negative, anode positive, since this is an electrolytic cell. (2) At the key (cathode): Ag⁺ + e⁻ → Ag, depositing silver. At the silver bar (anode): Ag → Ag⁺ + e⁻, dissolving silver. For every electron pushed into the key, one is pulled from the bar, so each Ag⁺ removed from solution at the cathode is replaced by one released at the anode and the concentration does not change; only the bar wears away. (3) Left to themselves, silver ions would not plate onto brass in any useful way, and silver metal would not dissolve: the reaction as set up is not spontaneous. A voltaic cell runs a spontaneous reaction (positive E°cell) and produces current; an electrolytic cell uses current from a supply to force a non-spontaneous reaction, so the signs of the electrodes are reversed and energy is consumed rather than produced. (4) Q = I × t = 0.500 A × 900 s = 450 C. Moles of electrons = 450 ÷ 96,485 = 0.00466 mol. One electron per silver ion, so 0.00466 mol Ag × 107.87 g/mol = 0.503 g of silver. (5) Thickness depends on current and time (more charge, more silver) and on the key's surface area (the same mass spread over a larger area is thinner). Quality depends on a clean, grease-free surface so the silver adheres, on a moderate current (too high a current gives a rough, powdery deposit), and on stirring or a well-formulated bath to keep the ion concentration even at the surface.
      explanation: |
        6 points. 1 point: cell described with the key as cathode (negative), a silver anode (positive) and a silver-ion electrolyte. 1 point: both half-reactions. 1 point: constant concentration explained by equal dissolving and plating. 1 point: non-spontaneous versus spontaneous contrast with the reversed signs. 1 point: 0.503 g (accept 0.50 to 0.51 g) with Q = 450 C shown. 1 point: two sensible practical factors. Deduct 1 point if the key is placed at the anode.
