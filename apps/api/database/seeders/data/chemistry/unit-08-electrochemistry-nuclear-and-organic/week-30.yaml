week: 30
unit: 8
title: "Voltaic Cells, Batteries and Electrolysis"
topics: ["8.3", "8.4"]
guide: guides/week-30.md
guide_description: |
  The voltaic cell: half-cells, anode and cathode, salt bridge, electron and ion flow and cell notation; the
  table of standard reduction potentials and E°cell = E°(cathode) − E°(anode); why a positive E°cell means
  spontaneous; the dry cell, lead-acid, lithium-ion and fuel cells; corrosion and sacrificial anodes; then
  electrolytic cells, the products from molten NaCl and from water, electroplating and aluminium extraction, and
  Faraday's law with Q = I × t and 96,485 C per mole of electrons.
flashcards_description: |
  29 cards on cell parts and signs, electron and ion flow, reading the reduction potential table, E°cell
  calculations, battery chemistries, corrosion, electrolysis products, electroplating and Faraday calculations.

flashcards:
  - front: Voltaic (galvanic) cell → what it is
    back: |
      A device in which a spontaneous redox reaction is split into two half-cells so that the electrons travel through an external wire and do electrical work.
    topic_code: "8.3"
  - front: Half-cell → definition and the Zn/Cu example
    back: |
      A metal electrode in contact with a solution of its own ions: zinc in Zn²⁺(aq) and copper in Cu²⁺(aq). Two half-cells joined by a wire and a salt bridge make a cell.
    topic_code: "8.3"
  - front: Anode and cathode → which process at each (every cell)
    back: |
      Anode: oxidation. Cathode: reduction. "An ox, red cat." The names follow the process, in voltaic and electrolytic cells alike.
    topic_code: "8.3"
  - front: Electrode signs in a voltaic cell
    back: |
      Anode negative (electrons leave it into the wire); cathode positive (electrons arrive). The opposite of an electrolytic cell.
    topic_code: "8.3"
  - front: Direction of electron flow in a voltaic cell
    back: |
      From the anode to the cathode through the external wire. Electrons never travel through the solution or the salt bridge.
    topic_code: "8.3"
  - front: Salt bridge → what it contains and does
    back: |
      A gel of an inert salt such as KNO₃. Anions (NO₃⁻) drift to the anode and cations (K⁺) to the cathode, keeping both solutions neutral and completing the circuit. Without it the current stops.
    topic_code: "8.3"
  - front: Cell notation for the zinc–copper cell
    back: |
      Zn | Zn²⁺ || Cu²⁺ | Cu. Anode on the left, salt bridge as the double line, cathode on the right.
    topic_code: "8.3"
  - front: Standard reduction potential E° → what it measures
    back: |
      The voltage of a half-reaction written as a reduction, measured against the hydrogen electrode (0.00 V) at 1 M and 25 °C. More positive means a stronger pull for electrons.
    topic_code: "8.3"
  - front: Reading the reduction potential table
    back: |
      Top (most positive): strongest oxidising agents (F₂ +2.87 V). Bottom (most negative): strongest reducing agents (Li −3.04 V). The metals run in reverse activity-series order.
    topic_code: "8.3"
  - front: E°cell formula and the sign rule
    back: |
      E°cell = E°(cathode) − E°(anode), using table values as listed. Positive E°cell: spontaneous. Negative: you have the electrodes reversed. Zero: equilibrium (a dead battery).
    topic_code: "8.3"
  - front: E°cell for zinc and copper
    back: |
      Cu²⁺/Cu +0.34 V is the cathode; Zn²⁺/Zn −0.76 V is the anode. E°cell = 0.34 − (−0.76) = 1.10 V.
    topic_code: "8.3"
  - front: E°cell for magnesium and silver
    back: |
      E°cell = 0.80 − (−2.37) = 3.17 V. Overall Mg + 2Ag⁺ → Mg²⁺ + 2Ag. The coefficient 2 does not change the voltage.
    topic_code: "8.3"
  - front: Why E° is never multiplied by a coefficient
    back: |
      Voltage is energy per unit of charge, independent of how much reacts. Balancing electrons changes the amounts, not the potential.
    topic_code: "8.3"
  - front: Alkaline dry cell chemistry
    back: |
      Zinc oxidised at the anode, manganese dioxide reduced at the cathode, potassium hydroxide paste electrolyte; about 1.5 V; not rechargeable.
    topic_code: "8.3"
  - front: Lead-acid battery → reaction and why 12 V
    back: |
      Pb + PbO₂ + 2H₂SO₄ → 2PbSO₄ + 2H₂O. Pb oxidised (0 → +2) at the anode; PbO₂ reduced (+4 → +2) at the cathode; about 2 V per cell, six cells in series. Rechargeable by electrolysis.
    topic_code: "8.3"
  - front: Why the electrolyte density of a lead-acid battery falls on discharge
    back: |
      Sulfuric acid is consumed and water is produced, so the solution becomes less dense; a garage tests the charge by measuring the density.
    topic_code: "8.3"
  - front: Lithium-ion battery → how it works and why lithium
    back: |
      Li⁺ ions shuttle between a graphite anode and a metal-oxide cathode in a non-aqueous electrolyte. Lithium's very negative E° (−3.04 V) and tiny mass give high voltage (about 3.7 V) and high energy per kilogram.
    topic_code: "8.3"
  - front: Hydrogen fuel cell
    back: |
      H₂ oxidised at the anode, O₂ reduced at the cathode; overall 2H₂ + O₂ → 2H₂O, the only product being water. Fuel is fed in continuously rather than stored inside.
    topic_code: "8.3"
  - front: Rusting as an electrochemical cell
    back: |
      Under a water drop, one region of iron is the anode (Fe → Fe²⁺ + 2e⁻) and another the cathode (O₂ + 2H₂O + 4e⁻ → 4OH⁻); the water is the salt bridge. Salt water conducts better and speeds it up.
    topic_code: "8.3"
  - front: Sacrificial anode → how it protects steel
    back: |
      A block of zinc or magnesium, with a more negative E° than iron, is attached to the hull or pipe; it is oxidised in preference and feeds electrons to the iron, keeping the iron as the cathode. It is replaced when consumed.
    topic_code: "8.3"
  - front: Electrolytic cell → definition and electrode signs
    back: |
      A cell in which an external power supply forces a non-spontaneous redox reaction. Anode is still oxidation but now positive; cathode still reduction but now negative.
    topic_code: "8.4"
  - front: Electrolysis of molten sodium chloride
    back: |
      Cathode: Na⁺ + e⁻ → Na(l). Anode: 2Cl⁻ → Cl₂(g) + 2e⁻. The salt must be molten for the ions to move. This is how sodium and chlorine are made.
    topic_code: "8.4"
  - front: Electrolysis of water → half-reactions and gas ratio
    back: |
      Cathode: 2H₂O + 2e⁻ → H₂ + 2OH⁻. Anode: 2H₂O → O₂ + 4H⁺ + 4e⁻. Overall 2H₂O → 2H₂ + O₂; hydrogen has twice the volume of oxygen.
    topic_code: "8.4"
  - front: Electroplating → which electrode is the object and why
    back: |
      The object is the cathode (it receives metal by reduction, Ag⁺ + e⁻ → Ag); the anode is a bar of the plating metal that dissolves at the same rate, keeping the solution concentration constant.
    topic_code: "8.4"
  - front: Aluminium extraction by electrolysis
    back: |
      Al₂O₃ dissolved in molten cryolite at about 950 °C; Al³⁺ reduced at the carbon cathode, oxygen formed at carbon anodes which burn away. Three electrons per atom make it very energy-hungry; recycling saves about 95 percent.
    topic_code: "8.4"
  - front: Faraday's constant and Q = I × t
    back: |
      One mole of electrons carries 96,485 C. Charge in coulombs = current in amperes × time in seconds. Moles of electrons = Q ÷ 96,485.
    topic_code: "8.4"
  - front: Faraday calculation → the three-step recipe
    back: |
      1. Q = I × t (seconds). 2. Moles e⁻ = Q ÷ 96,485. 3. Divide by the electrons per ion (Ag⁺ 1, Cu²⁺ 2, Al³⁺ 3) for moles of metal, then multiply by molar mass.
    topic_code: "8.4"
  - front: Copper deposited by 2.00 A for 30.0 min
    back: |
      Q = 2.00 × 1,800 = 3,600 C; 3,600 ÷ 96,485 = 0.0373 mol e⁻; ÷ 2 = 0.01866 mol Cu; × 63.55 = 1.19 g.
    topic_code: "8.4"
  - front: Silver deposited by the same charge as 1.19 g of copper
    back: |
      Ag⁺ needs one electron per atom, so 0.0373 mol of silver forms: 0.0373 × 107.87 = 4.02 g. Same charge, twice the atoms, heavier atoms.
    topic_code: "8.4"

quiz:
  description: |
    23 questions · about 40 minutes · topics 8.3 and 8.4 (voltaic cells, reduction potentials and E°cell,
    batteries, corrosion, electrolysis, electroplating, Faraday's law), with review of the activity series (4.3),
    gas stoichiometry (5.4), energy changes (7.1), oxidation numbers (8.1) and half-reactions (8.2). Multiple
    choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
    Constants: F = 96,485 C/mol; standard reduction potentials Ag⁺/Ag +0.80 V, Cu²⁺/Cu +0.34 V, Ni²⁺/Ni −0.26 V,
    Zn²⁺/Zn −0.76 V, Al³⁺/Al −1.66 V, Mg²⁺/Mg −2.37 V.
  questions:
    # ---- Stimulus set A: the zinc–copper cell (8.3)
    - slug: chem-u08-w30-q01
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A voltaic cell is built from a zinc strip in 1.0 M zinc sulfate and a copper strip in 1.0 M copper(II) sulfate, joined by a wire through a voltmeter and by a salt bridge of potassium nitrate gel.

        | Reduction half-reaction | E° (V) |
        | --- | --- |
        | Cu²⁺ + 2e⁻ → Cu | +0.34 |
        | Zn²⁺ + 2e⁻ → Zn | −0.76 |
      prompt: |
        Which electrode is the anode, what is its sign, and which way do electrons flow in the wire?
      options:
        - "Copper is the anode, positive; electrons flow from copper to zinc."
        - "Zinc is the anode, positive; electrons flow from zinc to copper."
        - "Zinc is the anode, negative; electrons flow from zinc to copper."
        - "Copper is the anode, negative; electrons flow from zinc to copper."
      option_explanations:
        - |
          Copper has the higher reduction potential, so Cu²⁺ is reduced there: copper is the cathode, not the anode.
        - |
          Zinc is the anode, but in a voltaic cell the anode is negative because electrons leave it into the wire.
        - |
          Correct. Zinc, with the lower E°, is oxidised (anode); electrons it releases make it the negative terminal and travel through the wire to the copper cathode.
        - |
          The copper electrode receives the electrons and is the positive cathode, where Cu²⁺ is reduced.
      answer: 2
      explanation: |
        The half-cell with the lower E° is the anode. Oxidation there releases electrons, so the anode is negative in a voltaic cell and electrons flow anode → cathode through the wire.

    - slug: chem-u08-w30-q02
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A voltaic cell is built from a zinc strip in 1.0 M zinc sulfate and a copper strip in 1.0 M copper(II) sulfate, joined by a wire through a voltmeter and by a salt bridge of potassium nitrate gel.

        | Reduction half-reaction | E° (V) |
        | --- | --- |
        | Cu²⁺ + 2e⁻ → Cu | +0.34 |
        | Zn²⁺ + 2e⁻ → Zn | −0.76 |
      prompt: |
        What voltage should the voltmeter read?
      options:
        - "1.10 V"
        - "−0.42 V"
        - "0.42 V"
        - "2.20 V"
      option_explanations:
        - |
          Correct. E°cell = E°(cathode) − E°(anode) = 0.34 − (−0.76) = 1.10 V.
        - |
          A negative value means the electrodes have been assigned backwards; subtract the anode's potential from the cathode's.
        - |
          0.42 V is 0.76 − 0.34, which ignores the sign of the zinc potential; subtracting a negative number adds.
        - |
          2.20 V doubles the voltage as if the two electrons per ion counted; potentials are never multiplied by coefficients.
      answer: 0
      explanation: |
        E°cell = 0.34 − (−0.76) = 1.10 V. The subtraction of a negative anode potential is where most errors occur.

    - slug: chem-u08-w30-q03
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A voltaic cell is built from a zinc strip in 1.0 M zinc sulfate and a copper strip in 1.0 M copper(II) sulfate, joined by a wire through a voltmeter and by a salt bridge of potassium nitrate gel.

        | Reduction half-reaction | E° (V) |
        | --- | --- |
        | Cu²⁺ + 2e⁻ → Cu | +0.34 |
        | Zn²⁺ + 2e⁻ → Zn | −0.76 |
      prompt: |
        The salt bridge is removed and the voltmeter drops to zero. Why?
      options:
        - "Electrons can no longer travel from the zinc to the copper."
        - "The zinc stops dissolving because the potassium nitrate was the oxidising agent."
        - "The copper(II) ions are used up without the bridge."
        - "Charge builds up in each beaker (positive at the anode, negative at the cathode), which stops further electron flow; the bridge's ions had been neutralising it."
      option_explanations:
        - |
          The wire still connects the electrodes; electrons never travelled through the bridge in the first place.
        - |
          Potassium nitrate is inert; Cu²⁺ is the oxidising agent, and the zinc stops dissolving because the circuit is incomplete, not because an agent is missing.
        - |
          The Cu²⁺ ions are still there; without the bridge they cannot be reduced because the resulting charge imbalance has no outlet.
        - |
          Correct. As Zn²⁺ forms at the anode and Cu²⁺ is consumed at the cathode, the solutions would become charged; nitrate ions drifting to the anode and potassium ions to the cathode keep them neutral and complete the circuit.
      answer: 3
      explanation: |
        The salt bridge completes the circuit with ion flow and prevents charge build-up. Electrons use the wire; ions use the bridge.

    # ---- Singles
    - slug: chem-u08-w30-q04
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Using Ag⁺/Ag +0.80 V and Mg²⁺/Mg −2.37 V, what is E°cell for a magnesium–silver voltaic cell?
      options:
        - "1.57 V"
        - "3.17 V"
        - "−1.57 V"
        - "3.97 V"
      option_explanations:
        - |
          1.57 V is 2.37 − 0.80, which treats the magnesium potential as positive; subtracting −2.37 adds 2.37.
        - |
          Correct. Silver, with the higher E°, is the cathode: E°cell = 0.80 − (−2.37) = 3.17 V.
        - |
          A negative result would mean the cell was set up with the electrodes reversed; the spontaneous cell has silver as cathode.
        - |
          3.97 V adds an extra 0.80 as if the coefficient 2 on Ag⁺ doubled its potential; potentials are not scaled.
      answer: 1
      explanation: |
        E°cell = E°(cathode) − E°(anode) = 0.80 − (−2.37) = 3.17 V. Overall: Mg + 2Ag⁺ → Mg²⁺ + 2Ag.

    - slug: chem-u08-w30-q05
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Using Ag⁺/Ag +0.80 V, Cu²⁺/Cu +0.34 V and Zn²⁺/Zn −0.76 V, which reaction is spontaneous as written?
      options:
        - "Cu²⁺ + Zn²⁺ → Cu + Zn"
        - "Zn²⁺ + Cu → Zn + Cu²⁺"
        - "2Ag + Cu²⁺ → 2Ag⁺ + Cu"
        - "Cu + 2Ag⁺ → Cu²⁺ + 2Ag"
      option_explanations:
        - |
          Two ions cannot both be reduced; something must be oxidised, and this equation has no reducing agent.
        - |
          E°cell = −0.76 − 0.34 = −1.10 V; the reverse (zinc reducing Cu²⁺) is the spontaneous direction.
        - |
          E°cell = 0.34 − 0.80 = −0.46 V; silver metal does not reduce copper ions.
        - |
          Correct. E°cell = 0.80 − 0.34 = +0.46 V; copper reduces Ag⁺, plating silver onto copper wire while the solution turns blue.
      answer: 3
      explanation: |
        A reaction is spontaneous when the species reduced has the higher E° than the species oxidised: E°cell positive.

    - slug: chem-u08-w30-q06
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A lead-acid battery discharges according to Pb + PbO₂ + 2H₂SO₄ → 2PbSO₄ + 2H₂O. Which statement about the lead is correct?
      options:
        - "Lead in PbO₂ goes from +4 to +2, so PbO₂ is reduced and is the cathode material."
        - "Lead metal goes from 0 to +4, so it is the cathode material."
        - "Both lead species are oxidised, and the sulfuric acid is reduced."
        - "Lead in PbO₂ goes from +4 to 0, forming lead metal at the anode."
      option_explanations:
        - |
          Correct. Review of 8.1: O is −2, so Pb in PbO₂ is +4; in PbSO₄ (sulfate 2−) it is +2. A fall in oxidation number is reduction, which happens at the cathode.
        - |
          Lead metal goes from 0 to +2 (in PbSO₄), an oxidation; the anode is where oxidation happens.
        - |
          One lead is oxidised (0 → +2) and the other reduced (+4 → +2); sulfur stays +6 throughout.
        - |
          The product on both sides is PbSO₄ with lead at +2; no lead metal is formed on discharge.
      answer: 0
      explanation: |
        Review of 8.1: assign oxidation numbers first. Pb (0 → +2) is oxidised at the anode; PbO₂ (+4 → +2) is reduced at the cathode; both end as PbSO₄.

    - slug: chem-u08-w30-q07
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Blocks of zinc are bolted to the steel hull of a ship. Why does this slow the rusting of the hull?
      options:
        - "Zinc coats the whole hull with a waterproof layer."
        - "Zinc is a stronger oxidising agent than iron, so it removes oxygen from the water."
        - "Zinc has a more negative reduction potential than iron, so it is oxidised instead of the iron, which becomes the cathode."
        - "Zinc raises the pH of the seawater, which prevents corrosion."
      option_explanations:
        - |
          A bolted block covers only a small area; its protection is electrochemical, not a physical barrier (that is galvanising).
        - |
          Zinc is a reducing agent, not an oxidising agent; it gives electrons rather than removing oxygen.
        - |
          Correct. With E° of −0.76 V against iron's −0.44 V, zinc is the stronger reducing agent; it is the anode of the zinc–iron cell and corrodes sacrificially while the hull is protected.
        - |
          Seawater pH is unchanged in any significant way; the effect is the sacrificial oxidation of zinc.
      answer: 2
      explanation: |
        A sacrificial anode is a more active metal that corrodes in place of the structure it protects. Magnesium is used the same way on buried pipelines.

    - slug: chem-u08-w30-q08
      type: multiple_choice
      topic_code: "8.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Molten sodium chloride is electrolysed. What forms at each electrode?
      options:
        - "Sodium at the anode and chlorine at the cathode"
        - "Sodium at the cathode and chlorine at the anode"
        - "Hydrogen at the cathode and oxygen at the anode"
        - "Chlorine at both electrodes"
      option_explanations:
        - |
          Reduction (Na⁺ + e⁻ → Na) happens at the cathode and oxidation (2Cl⁻ → Cl₂ + 2e⁻) at the anode, not the reverse.
        - |
          Correct. Cations migrate to the negative cathode and are reduced to sodium metal; anions migrate to the positive anode and are oxidised to chlorine gas.
        - |
          Hydrogen and oxygen come from electrolysing water; molten NaCl contains no water.
        - |
          Chloride is only oxidised, and only at the anode; the cathode reduces sodium ions.
      answer: 1
      explanation: |
        Electrolysis of molten NaCl: cathode Na⁺ + e⁻ → Na; anode 2Cl⁻ → Cl₂ + 2e⁻. Both products are manufactured this way.

    - slug: chem-u08-w30-q09
      type: multiple_choice
      topic_code: "8.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A steel spoon is to be silver-plated. How should the electrolytic cell be set up?
      options:
        - "Spoon as the anode, silver bar as the cathode, in silver nitrate solution"
        - "Spoon as the cathode, silver bar as the anode, in sodium chloride solution"
        - "Spoon as the anode, steel bar as the cathode, in silver nitrate solution"
        - "Spoon as the cathode, silver bar as the anode, in silver nitrate solution"
      option_explanations:
        - |
          Metal deposits by reduction, which occurs at the cathode; a spoon made the anode would dissolve, not gain silver.
        - |
          The electrolyte must supply Ag⁺ ions; sodium chloride contains none and would produce chlorine instead.
        - |
          The object must be the cathode, and a steel cathode would deposit nothing useful; the anode should be silver to replenish Ag⁺.
        - |
          Correct. Ag⁺ + e⁻ → Ag at the spoon (cathode); Ag → Ag⁺ + e⁻ at the silver anode, keeping the solution's Ag⁺ concentration steady.
      answer: 3
      explanation: |
        Electroplating: object = cathode, plating metal = anode, electrolyte contains the plating metal's ions.

    - slug: chem-u08-w30-q10
      type: multiple_choice
      topic_code: "8.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly contrasts a voltaic cell with an electrolytic cell?
      options:
        - "In both, oxidation occurs at the anode, but the anode is negative in a voltaic cell and positive in an electrolytic cell."
        - "In a voltaic cell reduction occurs at the anode; in an electrolytic cell it occurs at the cathode."
        - "A voltaic cell requires an external power supply; an electrolytic cell produces one."
        - "The cathode is negative in both types of cell."
      option_explanations:
        - |
          Correct. The names follow the processes in both cells; the signs reverse because a power supply pulls electrons from the electrolytic anode rather than the anode pushing them out.
        - |
          Oxidation is at the anode and reduction at the cathode in every cell.
        - |
          This is backwards: a voltaic cell produces current from a spontaneous reaction; an electrolytic cell consumes current to drive a non-spontaneous one.
        - |
          The cathode is positive in a voltaic cell (electrons arrive there spontaneously) and negative in an electrolytic cell (the supply pushes electrons in).
      answer: 0
      explanation: |
        Same processes at the same-named electrodes; opposite signs and opposite energy flow (produced versus consumed).

    - slug: chem-u08-w30-q11
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Water is electrolysed and the gases from the two electrodes are collected separately at the same temperature and pressure. What is observed, and why?
      options:
        - "Equal volumes of hydrogen and oxygen, because one molecule of water gives one of each."
        - "Twice as much hydrogen by volume as oxygen, because 2H₂O → 2H₂ + O₂ gives twice the moles of H₂ and equal moles of gas occupy equal volumes."
        - "Twice as much oxygen by volume as hydrogen, because oxygen atoms are heavier."
        - "Sixteen times as much oxygen by mass as hydrogen, so sixteen times the volume."
      option_explanations:
        - |
          Each water molecule has two hydrogens and one oxygen; the balanced equation gives two H₂ for every O₂.
        - |
          Correct. Review of 5.4: gas volumes are proportional to moles at the same conditions (Avogadro), so the 2:1 mole ratio appears as a 2:1 volume ratio.
        - |
          Mass does not set volume for gases; the mole ratio does, and hydrogen has the larger number of moles.
        - |
          The mass ratio of oxygen to hydrogen is 8:1 (16 ÷ 2), but volume follows moles, which are 1:2 the other way.
      answer: 1
      explanation: |
        Review of 5.4: equal volumes of gases at the same conditions contain equal moles, so the volume ratio of H₂ to O₂ equals the coefficient ratio, 2:1.

    # ---- Multi-select
    - slug: chem-u08-w30-q12
      type: multi_select
      topic_code: "8.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about a voltaic cell are correct? Select all that apply.
      options:
        - "Oxidation occurs at the anode."
        - "Electrons travel through the salt bridge from one half-cell to the other."
        - "The electrode with the higher standard reduction potential is the cathode."
        - "A positive E°cell indicates a spontaneous reaction."
        - "The anode gains mass as the cell runs."
        - "Anions in the salt bridge move toward the anode."
      option_explanations:
        - |
          Correct. Anode and oxidation go together in every cell.
        - |
          Electrons travel only through the external wire; ions move through the salt bridge.
        - |
          Correct. The stronger pull for electrons wins the reduction and is the cathode.
        - |
          Correct. E°cell > 0 means the reaction as arranged releases energy and drives a current.
        - |
          The anode dissolves as its metal is oxidised to ions; the cathode gains mass.
        - |
          Correct. Negative ions move to balance the positive ions being produced at the anode.
      answer: [0, 2, 3, 5]
      explanation: |
        Electron path (wire only) and the direction of mass change (anode loses, cathode gains) are the two tested confusions.

    - slug: chem-u08-w30-q13
      type: multi_select
      topic_code: "8.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are correctly written reduction half-reactions? Select all that apply.
      options:
        - "Ag⁺ + e⁻ → Ag"
        - "Zn → Zn²⁺ + 2e⁻"
        - "Cl₂ + 2e⁻ → 2Cl⁻"
        - "Fe³⁺ + e⁻ → Fe²⁺"
        - "Al³⁺ + 2e⁻ → Al"
      option_explanations:
        - |
          Correct. Silver ion gains one electron to become the metal; atoms and charge balance.
        - |
          This is an oxidation: electrons are on the product side and zinc's oxidation number rises.
        - |
          Correct. Chlorine gains two electrons to form two chloride ions; charge −2 on each side.
        - |
          Correct. Iron(III) gains one electron to become iron(II); the number falls from +3 to +2.
        - |
          Charge does not balance: Al³⁺ needs three electrons, not two, to become neutral aluminium.
      answer: [0, 2, 3]
