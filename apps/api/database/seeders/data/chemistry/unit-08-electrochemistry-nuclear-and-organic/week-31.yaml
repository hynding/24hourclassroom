    # ---- Short answer
    - slug: chem-u08-w31-q21
      type: short_answer
      topic_code: "8.5"
      source: "general knowledge"
      points: 3
      prompt: |
        A pressurised-water fission reactor uses enriched uranium fuel rods surrounded by water, with boron control rods and a steel-and-concrete containment building.
        (a) Explain why the fuel is enriched and what "enriched" means.
        (b) Describe the two jobs the water does and explain why the chain reaction would stop if the water were lost.
        (c) Explain why a reactor cannot explode like a nuclear weapon, and identify the hazard that does remain after shutdown.
      answer: |
        (a) Natural uranium is only 0.7 percent uranium-235, the fissile isotope; enrichment raises that to about 3 to 5 percent so that enough fissions occur to sustain a chain reaction in the reactor's geometry. (b) The water is the moderator, slowing fast fission neutrons to the speeds uranium-235 captures efficiently, and the coolant, carrying heat from the core to the steam generators. Without water the neutrons stay fast, too few are captured and the chain reaction dies; but the core also loses its cooling. (c) A weapon needs about 90 percent uranium-235 assembled into a supercritical mass in a microsecond; 3 to 5 percent fuel cannot do this. The remaining hazard is decay heat and radiation from the highly radioactive fission fragments, which continue after the chain reaction stops and can melt the fuel if cooling fails.
      explanation: |
        1 point for (a) enrichment defined as raising the U-235 fraction from 0.7 percent to 3 to 5 percent, with the reason. 1 point for (b) moderator and coolant roles and the fast-neutron reason for the chain stopping. 1 point for (c) the enrichment contrast with weapons and decay heat or fission-product radioactivity as the residual hazard.

    - slug: chem-u08-w31-q22
      type: short_answer
      topic_code: "8.5"
      source: "general knowledge"
      points: 3
      stimulus: |
        Approximate energy released per gram of fuel:

        | Process | Energy per gram (J) | Main products |
        | --- | --- | --- |
        | Burning coal | 3 × 10⁴ | CO₂, water, ash |
        | Fission of uranium-235 | 8 × 10¹⁰ | Radioactive fragments, neutrons |
        | Deuterium–tritium fusion | 3 × 10¹¹ | Helium, neutrons |
      prompt: |
        (a) Calculate how many times more energy fission releases per gram than coal, and explain in terms of forces why the difference is so large.
        (b) Explain, using the binding-energy-per-nucleon curve, why fusion releases even more energy per gram than fission.
        (c) Give one reason, from the products column, why fusion is considered a cleaner energy source than fission.
      answer: |
        (a) 8 × 10¹⁰ ÷ 3 × 10⁴ ≈ 2.7 × 10⁶, nearly three million times. Burning rearranges electrons, held by electrical forces of a few electronvolts per atom; fission rearranges nucleons, held by the nuclear force, about a million times stronger, so each atom releases about a million times more energy. (b) The curve rises steeply from hydrogen to helium and then only gently falls from iron to uranium. Fusing hydrogen isotopes into helium moves each nucleon far up the steep part (about 3.5 MeV per nucleon), whereas fission moves nucleons only a short way up the shallow slope (about 0.9 MeV per nucleon); and light nuclei have fewer nucleons per gram of mass wasted, so the energy per gram is higher. (c) Fusion's product is helium, which is not radioactive, whereas fission leaves radioactive fragments that must be stored for centuries.
      explanation: |
        1 point for (a) a ratio of about 2.7 million and the nuclear-versus-electrical force explanation. 1 point for (b) correct use of the curve (steep rise for light nuclei, shallow decline for heavy ones). 1 point for (c) helium versus radioactive fragments.

    # ---- Long answer
    - slug: chem-u08-w31-q23
      type: long_answer
      topic_code: "8.5"
      source: "general knowledge"
      points: 6
      prompt: |
        A town council is deciding whether to support a proposed fusion research facility, and a member says: "Fusion is just fission under a different name; it will produce the same radioactive waste and the same risk of a runaway reaction." Write a response that: (1) explains, with a balanced example of each, how fission and fusion differ as nuclear reactions; (2) explains where the energy of each comes from, using mass defect and the binding-energy-per-nucleon curve; (3) compares the fuels and the products of the two processes; (4) addresses the claim about a runaway reaction by contrasting the chain reaction and critical mass of fission with the conditions fusion requires; (5) gives a balanced judgement about what fusion can and cannot yet deliver, including at least one real obstacle.
      answer: |
        (1) Fission splits a heavy nucleus after it absorbs a neutron: ²³⁵U + ¹n → ¹⁴¹Ba + ⁹²Kr + 3 ¹n (236 = 236; 92 = 92). Fusion joins light nuclei: ²H + ³H → ⁴He + ¹n (5 = 5; 2 = 2). (2) In both, the products weigh less than the reactants and the mass defect appears as energy by E = mc². On the binding-energy-per-nucleon curve (steep rise to a peak at iron-56, then a gentle decline) fission moves nucleons from uranium (about 7.6 MeV per nucleon) up to medium nuclei (about 8.5), releasing about 200 MeV per event; fusion moves nucleons from hydrogen isotopes far up the steep part to helium, 17.6 MeV per event but about four times more per nucleon and per gram. (3) Fission fuel is uranium-235 (enriched from 0.7 to 3 to 5 percent) or plutonium; fusion fuel is deuterium from seawater and tritium bred from lithium. Fission leaves intensely radioactive fragments needing isolation for millennia. Fusion yields helium, which is harmless, and neutrons that slowly make the reactor structure radioactive; that activated steel is its only long-lived waste. (4) Fission can run away because each fission releases about three neutrons that cause more fissions; a reactor is held at critical mass by control rods and a moderator, and losing control can at worst melt the core. Fusion has no chain reaction: it occurs only while a plasma is held at about 100 million K by magnetic fields, and any failure cools the plasma within seconds and stops the reaction. Only a few grams of fuel are present at any moment, so a runaway is physically impossible. (5) Fusion is not yet a power source: experiments have produced fusion energy but not sustained net electricity, and real obstacles remain: holding the plasma stably for long periods, building a wall that survives decades of neutron bombardment, and breeding enough tritium. Supporting research is reasonable given the reward, but the council should not expect electricity from it for decades.
      explanation: |
        6 points. 1 point: both reactions correctly described with a balanced equation each. 1 point: energy explained via mass defect and the curve, with fusion higher per nucleon. 1 point: fuels and products compared, including the activated structure as fusion's waste. 1 point: chain reaction and critical mass contrasted with fusion's need for sustained extreme conditions, concluding that runaway is impossible. 1 point: a balanced judgement naming at least one genuine obstacle. 1 point: overall clarity and correct use of the terms fission, fusion, nucleon, binding energy and plasma. Deduct 1 point for claiming fusion produces no radioactivity at all or that a fission reactor can explode like a bomb.
