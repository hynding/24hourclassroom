week: 31
unit: 8
title: "Nuclear Fission and Fusion"
topics: ["8.5"]
guide: guides/week-31.md
guide_description: |
  Mass defect, binding energy and E = mc² as the source of nuclear energy; the binding-energy-per-nucleon
  curve described in words and why fission of heavy nuclei and fusion of light nuclei both release energy;
  balancing fission equations and the chain reaction; critical mass; the parts of a fission reactor and what each
  does; fusion in the Sun and in tokamaks and why it needs 100 million K; fission versus fusion versus
  combustion, including energy per gram.
flashcards_description: |
  28 cards on mass defect, binding energy, the binding-energy curve, fission equations, chain reactions and
  critical mass, reactor components, fusion conditions, and the comparison of fission, fusion and chemical
  energy.

flashcards:
  - front: Nucleon → definition
    back: |
      A proton or a neutron, the particles of a nucleus. The mass number A counts the nucleons; the atomic number Z counts the protons.
    topic_code: "8.5"
  - front: Mass defect → definition
    back: |
      The amount by which a nucleus is lighter than the sum of its separate protons and neutrons. For helium-4: 4.03188 u of parts versus 4.00151 u assembled, a defect of 0.03037 u.
    topic_code: "8.5"
  - front: Binding energy → definition and the helium-4 value
    back: |
      The energy equivalent of the mass defect: what you must supply to pull a nucleus into separate nucleons, or what is released when they bind. Helium-4: 0.03037 u × 931.5 MeV/u = 28.3 MeV.
    topic_code: "8.5"
  - front: E = mc² → meaning and the two useful forms
    back: |
      Mass and energy are equivalent. In SI: E (J) = m (kg) × (2.998 × 10⁸ m/s)². In nuclear units: 1 u of mass = 931.5 MeV of energy.
    topic_code: "8.5"
  - front: Energy from converting exactly 1.00 g of matter
    back: |
      E = 0.00100 kg × (2.998 × 10⁸)² = 8.99 × 10¹³ J, roughly the energy of burning 3,000 tonnes of coal. Fission converts about 0.1 percent of its fuel's mass, fusion about 0.4 percent.
    topic_code: "8.5"
  - front: Why nuclear reactions release about a million times more energy than chemical ones
    back: |
      The nuclear force binding nucleons is about a million times stronger than the electrical attraction binding electrons, so the mass converted per atom is about a million times larger.
    topic_code: "8.5"
  - front: Binding-energy-per-nucleon curve → shape in words
    back: |
      Low for hydrogen, rising steeply through helium, carbon and oxygen to a broad maximum of about 8.8 MeV per nucleon near iron-56 and nickel-62, then sloping gently down to about 7.6 MeV at uranium.
    topic_code: "8.5"
  - front: Why fission releases energy, in terms of the curve
    back: |
      A heavy nucleus (A ≈ 235) splits into two medium nuclei (A ≈ 90 to 140) that sit higher on the curve; the nucleons become more tightly bound and about 0.9 MeV per nucleon, about 200 MeV per fission, is released.
    topic_code: "8.5"
  - front: Why fusion releases energy, in terms of the curve
    back: |
      Very light nuclei sit on the steep low part of the curve; joining them into helium moves their nucleons far up it, releasing about 3.5 MeV per nucleon, 17.6 MeV for one deuterium–tritium fusion.
    topic_code: "8.5"
  - front: Why iron cannot be a nuclear fuel
    back: |
      Iron-56 sits at the peak of the binding-energy curve; neither splitting it nor fusing it moves nucleons to a more tightly bound state, so neither releases energy.
    topic_code: "8.5"
  - front: Fission → definition and a typical equation
    back: |
      A heavy nucleus absorbs a neutron and splits into two medium nuclei plus neutrons: ²³⁵U + ¹n → ¹⁴¹Ba + ⁹²Kr + 3 ¹n. The fragments vary from event to event.
    topic_code: "8.5"
  - front: Checking a fission equation
    back: |
      Mass numbers must balance (235 + 1 = 141 + 92 + 3) and atomic numbers must balance (92 + 0 = 56 + 36 + 0). Solve for a missing fragment or the number of neutrons from the two sums.
    topic_code: "8.5"
  - front: Chain reaction → how it starts and grows
    back: |
      Each fission releases on average 2.4 neutrons; each can cause another fission. If more than one per fission does, the number of fissions grows geometrically.
    topic_code: "8.5"
  - front: Critical mass → definition
    back: |
      The smallest amount of fissile material in which exactly one neutron per fission, on average, causes another fission, so the chain sustains itself. Smaller lumps lose too many neutrons through the surface.
    topic_code: "8.5"
  - front: Fissile isotopes and natural uranium
    back: |
      Uranium-235 and plutonium-239 fission with slow neutrons. Natural uranium is 99.3 percent U-238 (not fissile with slow neutrons) and 0.7 percent U-235; reactor fuel is enriched to 3 to 5 percent, weapons to about 90 percent.
    topic_code: "8.5"
  - front: Moderator → role in a reactor
    back: |
      Water or graphite around the fuel rods slows the fast fission neutrons to the speeds uranium-235 captures best. Remove it and the chain reaction dies out.
    topic_code: "8.5"
  - front: Control rods → role in a reactor
    back: |
      Boron or cadmium rods absorb neutrons. Lowered, they slow the chain reaction; raised, they speed it; fully inserted, they shut the reactor down.
    topic_code: "8.5"
  - front: Coolant and containment → roles in a reactor
    back: |
      Coolant (usually water) carries heat from the core to make steam for turbines and often doubles as moderator. Containment (steel and concrete) holds in radiation and fission products if something fails.
    topic_code: "8.5"
  - front: Why a reactor cannot explode like a bomb, and what the real hazard is
    back: |
      Fuel at 3 to 5 percent U-235 cannot form a supercritical mass. The hazard is the heat and radioactivity of the fission fragments, which continue after shutdown and must be cooled and then isolated for millennia.
    topic_code: "8.5"
  - front: Fusion in the Sun → net reaction and conditions
    back: |
      4 ¹H → ⁴He + 2 positrons + energy, in several steps, at 15 million K and enormous pressure in the core; about 0.7 percent of the mass is converted.
    topic_code: "8.5"
  - front: Deuterium–tritium fusion → equation and energy
    back: |
      ²H + ³H → ⁴He + ¹n, releasing 17.6 MeV. Mass defect: 5.03015 u − 5.01126 u = 0.01889 u, × 931.5 = 17.6 MeV.
    topic_code: "8.5"
  - front: Why fusion needs about 100 million K
    back: |
      Nuclei are positively charged and repel; only at that temperature do they collide fast enough to overcome the repulsion and come within range of the nuclear force. Matter at that temperature is a plasma.
    topic_code: "8.5"
  - front: Plasma → definition
    back: |
      A gas so hot that its atoms have lost their electrons, leaving a mixture of bare nuclei and free electrons. No solid container can touch it; tokamaks confine it with magnetic fields.
    topic_code: "8.5"
  - front: Advantages of fusion over fission
    back: |
      Fuel from seawater (deuterium) and lithium (tritium); helium as the product; no chain reaction to run away (the plasma simply cools); only the activated reactor structure as long-lived waste.
    topic_code: "8.5"
  - front: Obstacles to fusion power
    back: |
      Reaching and holding 100 million K, confining the plasma long enough, and building a wall that survives the neutron flux; experiments have produced fusion energy but not yet net power for a plant.
    topic_code: "8.5"
  - front: Energy per gram → fission, fusion and coal
    back: |
      Fission of uranium-235: about 8 × 10¹⁰ J/g. Deuterium–tritium fusion: about 3 × 10¹¹ J/g. Burning coal: about 3 × 10⁴ J/g. Fission beats coal by about three million times.
    topic_code: "8.5"
  - front: Decay versus fission → the difference
    back: |
      Radioactive decay is spontaneous and emits a small particle (alpha, beta, gamma), leaving a nucleus nearly as large. Fission is triggered by a neutron and splits the nucleus into two roughly equal fragments plus neutrons.
    topic_code: "8.5"
  - front: Energy from fissioning one gram of uranium-235
    back: |
      1.00 g ÷ 235.04 g/mol × 6.022 × 10²³ = 2.56 × 10²¹ atoms; × 200 MeV × 1.602 × 10⁻¹³ J/MeV = 8.2 × 10¹⁰ J.
    topic_code: "8.5"

quiz:
  description: |
    23 questions · about 40 minutes · topic 8.5 (mass defect and binding energy, the binding-energy curve,
    fission equations and chain reactions, reactor design, fusion and its conditions, energy comparisons), with
    review of nuclear notation and isotopes (2.2), radioactive decay and half-life (2.4), the mole (4.4) and
    energy changes (7.1). Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Constants: c = 2.998 × 10⁸ m/s; 1 u = 931.5 MeV; 1 MeV = 1.602 × 10⁻¹³ J;
    Avogadro's number 6.022 × 10²³.
  questions:
    # ---- Stimulus set A: a uranium-235 fission (8.5, 4.4)
    - slug: chem-u08-w31-q01
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        One of the many ways uranium-235 can split after absorbing a neutron:

        ²³⁵U + ¹n → ¹⁴¹Ba + ⁹²Kr + x ¹n + energy

        Uranium has atomic number 92, barium 56 and krypton 36. Each fission releases about 200 MeV. The molar mass of uranium-235 is 235.04 g/mol.
      prompt: |
        How many neutrons, x, are released in this fission?
      options:
        - "2"
        - "3"
        - "4"
        - "1"
      option_explanations:
        - |
          Mass numbers: 235 + 1 = 236 on the left; 141 + 92 = 233 on the right, leaving 3 for neutrons, not 2.
        - |
          Correct. 236 − 233 = 3 neutrons; atomic numbers also balance (92 = 56 + 36, neutrons contributing 0).
        - |
          Four neutrons would give 237 mass units on the right against 236 on the left.
        - |
          One neutron would leave the right side at 234, short of the 236 on the left.
      answer: 1
      explanation: |
        Balance the mass numbers: 236 = 141 + 92 + x, so x = 3. Atomic numbers: 92 = 56 + 36. The average over all fission paths is about 2.4 neutrons.

    - slug: chem-u08-w31-q02
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        One of the many ways uranium-235 can split after absorbing a neutron:

        ²³⁵U + ¹n → ¹⁴¹Ba + ⁹²Kr + x ¹n + energy

        Uranium has atomic number 92, barium 56 and krypton 36. Each fission releases about 200 MeV. The molar mass of uranium-235 is 235.04 g/mol.
      prompt: |
        Why can this reaction become a chain reaction?
      options:
        - "The barium and krypton fragments are radioactive and decay into more uranium."
        - "The energy released heats the uranium until it melts and splits on its own."
        - "The fragments collide with other uranium nuclei and break them apart."
        - "Each fission releases more neutrons than it consumed, and each of those can trigger another fission."
      option_explanations:
        - |
          The fragments decay to lighter, more stable nuclei, never back to uranium; the chain is carried by neutrons.
        - |
          Fission is triggered by neutron capture, not by heat; a lump of uranium at any temperature does not spontaneously chain-react without enough neutrons.
        - |
          The charged fragments stop within a fraction of a millimetre; they do not cause further fissions.
        - |
          Correct. One neutron in, three out: if more than one of them is captured by another uranium-235 nucleus, the number of fissions grows geometrically.
      answer: 3
      explanation: |
        A chain reaction needs a reaction that produces its own trigger. Here each fission consumes one neutron and releases about three.

    - slug: chem-u08-w31-q03
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        One of the many ways uranium-235 can split after absorbing a neutron:

        ²³⁵U + ¹n → ¹⁴¹Ba + ⁹²Kr + x ¹n + energy

        Uranium has atomic number 92, barium 56 and krypton 36. Each fission releases about 200 MeV. The molar mass of uranium-235 is 235.04 g/mol.
      prompt: |
        How many uranium-235 atoms are in a 1.00 g sample?
      options:
        - "2.56 × 10²¹"
        - "6.02 × 10²³"
        - "1.42 × 10²⁶"
        - "2.35 × 10²"
      option_explanations:
        - |
          Correct. Review of 4.4: 1.00 g ÷ 235.04 g/mol = 4.25 × 10⁻³ mol; × 6.022 × 10²³ = 2.56 × 10²¹ atoms.
        - |
          6.02 × 10²³ atoms is one mole, which would weigh 235 g, not 1 g.
        - |
          This multiplies by the molar mass instead of dividing: 235 × 6.022 × 10²³. A gram is far less than a mole of uranium.
        - |
          235 is the molar mass in grams; the number of atoms in a gram is enormous, found through moles and Avogadro's number.
      answer: 0
      explanation: |
        Review of 4.4: grams → moles (divide by molar mass) → atoms (multiply by Avogadro's number). Fissioning them all would release about 8 × 10¹⁰ J.

    # ---- Singles
    - slug: chem-u08-w31-q04
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A helium-4 nucleus has a mass of 4.00151 u, while two protons and two neutrons weighed separately total 4.03188 u. What is the missing 0.03037 u called, and what became of it?
      options:
        - "The mass number; it was rounded away."
        - "Radiation; it was emitted as gamma rays when the atom was weighed."
        - "The mass defect; it was released as the binding energy when the nucleons came together."
        - "An isotope effect; it belongs to a different isotope of helium."
      option_explanations:
        - |
          The mass number is the whole number 4; the missing mass is a real, measurable difference.
        - |
          Weighing an atom emits nothing; the mass was converted to energy when the nucleus formed, long before.
        - |
          Correct. The nucleus is lighter than its parts because the energy released on binding, E = mc², has mass; that energy is the binding energy (28.3 MeV for helium-4).
        - |
          Both figures describe helium-4; the difference is the mass defect of that single isotope.
      answer: 2
      explanation: |
        Mass defect = mass of separate nucleons − mass of nucleus. Its energy equivalent is the binding energy that holds the nucleus together.

    - slug: chem-u08-w31-q05
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best expresses the meaning of E = mc²?
      options:
        - "Energy travels at the speed of light squared."
        - "Mass and energy are equivalent, and a small mass converts to a very large energy because c² is enormous."
        - "A nucleus loses energy equal to its mass every second."
        - "Only nuclear reactions convert mass to energy; chemical reactions never do."
      option_explanations:
        - |
          c² is not a speed; it is the conversion factor between mass and energy.
        - |
          Correct. One gram of mass corresponds to 8.99 × 10¹³ J because (2.998 × 10⁸)² is about 9 × 10¹⁶.
        - |
          The equation is a conversion between quantities, not a rate of loss.
        - |
          Chemical reactions also convert mass to energy, but the amount (nanograms per mole) is too small to weigh.
      answer: 1
      explanation: |
        E = mc² states the equivalence of mass and energy; the huge value of c² explains why tiny mass changes yield enormous energies.

    - slug: chem-u08-w31-q06
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        What is meant by the critical mass of a fissile material?
      options:
        - "The mass at which the material becomes radioactive"
        - "The mass of fuel a reactor uses in one year"
        - "The mass above which the material melts from its own decay heat"
        - "The smallest mass in which, on average, one neutron from each fission goes on to cause another, so the chain reaction sustains itself"
      option_explanations:
        - |
          Radioactivity is a property of the isotope at any mass; critical mass concerns neutrons, not decay.
        - |
          Fuel consumption is unrelated; a reactor holds its fuel at criticality continuously.
        - |
          Decay heat is a hazard of spent fuel, not the definition of criticality.
        - |
          Correct. Below the critical mass too many neutrons escape through the surface and the chain dies; at it, the reaction holds steady; above it, the reaction grows.
      answer: 3
      explanation: |
        Critical mass is about neutron economy: enough material that neutrons find another nucleus before escaping.

    - slug: chem-u08-w31-q07
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the function of the control rods in a fission reactor?
      options:
        - "They absorb neutrons, so lowering them slows the chain reaction and raising them speeds it."
        - "They slow the neutrons so that uranium-235 can capture them."
        - "They carry heat from the core to the steam generators."
        - "They supply the neutrons that start the chain reaction."
      option_explanations:
        - |
          Correct. Boron or cadmium rods soak up neutrons; the operator sets the reaction rate by how far they are inserted, and fully inserting them shuts the reactor down.
        - |
          Slowing neutrons is the moderator's job (water or graphite), not the control rods'.
        - |
          Heat transfer is the coolant's job; control rods neither carry heat nor generate it.
        - |
          Neutrons come from the fissions themselves (and a small starter source); the rods remove neutrons, not add them.
      answer: 0
      explanation: |
        Control rods = neutron absorbers that set the reaction rate. Moderator = neutron slower. Coolant = heat carrier.

    - slug: chem-u08-w31-q08
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        If the moderator were removed from a water-moderated reactor while the fuel and control rods stayed in place, what would happen to the chain reaction?
      options:
        - "It would speed up, because nothing would slow the neutrons."
        - "It would be unaffected, because the moderator only cools the core."
        - "It would die out, because fast neutrons are captured by uranium-235 far less readily than slow ones."
        - "It would switch to fusion of the water's hydrogen."
      option_explanations:
        - |
          Fast neutrons are less, not more, likely to cause fission in uranium-235; without slowing, most are lost.
        - |
          The water does cool the core, but its moderating role is essential to sustaining the chain in this reactor type.
        - |
          Correct. Uranium-235 captures slow neutrons efficiently; fission neutrons are fast, so without a moderator too few are captured and the reaction stops.
        - |
          Fusion needs 100 million K; nothing in a fission reactor approaches that.
      answer: 2
      explanation: |
        Moderators slow neutrons to the speeds at which uranium-235 fission is likely. Loss of moderator stops the chain reaction (though decay heat remains).

    - slug: chem-u08-w31-q09
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Why does fusion require temperatures of about 100 million K?
      options:
        - "To melt the metal container that holds the fuel"
        - "So that the positively charged nuclei collide fast enough to overcome their mutual repulsion and come within range of the nuclear force"
        - "To make the hydrogen atoms heavy enough to split"
        - "Because fusion is endothermic and needs the heat as a reactant"
      option_explanations:
        - |
          No container touches the plasma; it is held by magnetic fields or inertia, and the heat is for the nuclei, not the walls.
        - |
          Correct. Like charges repel; only at enormous speeds do two nuclei get close enough (about 10⁻¹⁵ m) for the short-range nuclear force to bind them.
        - |
          Fusion joins nuclei; it does not split them, and heat does not change an atom's mass.
        - |
          Fusion is strongly exothermic; the heat is needed to start the collisions, as an activation energy, not as a reactant.
      answer: 1
      explanation: |
        The electrical repulsion between nuclei is the barrier; temperature supplies the kinetic energy to overcome it. The result is a plasma.

    - slug: chem-u08-w31-q10
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Uranium-235 and uranium-238 are both found in natural uranium. How do they differ?
      options:
        - "They have different numbers of protons."
        - "Uranium-238 has three more electrons."
        - "They are different elements with similar chemistry."
        - "They have the same 92 protons but 143 and 146 neutrons respectively."
      option_explanations:
        - |
          Both are uranium, so both have 92 protons; a different proton count would make a different element.
        - |
          Neutral atoms of both isotopes have 92 electrons; the mass difference is in the nucleus.
        - |
          Isotopes are the same element; their chemistry is identical, which is why separating them is so difficult.
        - |
          Correct. Review of 2.2: isotopes share an atomic number and differ in neutron count: 235 − 92 = 143 and 238 − 92 = 146.
      answer: 3
      explanation: |
        Review of 2.2: neutrons = mass number − atomic number. The three-neutron difference decides whether slow neutrons cause fission.

    - slug: chem-u08-w31-q11
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Uranium-238 undergoes alpha decay. What is the product nucleus?
      options:
        - "Thorium-234 (Z = 90)"
        - "Uranium-234 (Z = 92)"
        - "Neptunium-238 (Z = 93)"
        - "Plutonium-242 (Z = 94)"
      option_explanations:
        - |
          Correct. Review of 2.4: an alpha particle is ⁴He (Z = 2), so the mass number falls by 4 and the atomic number by 2: ²³⁸U → ²³⁴Th + ⁴He.
        - |
          Losing four mass units without changing Z would require emitting four neutrons, which is not alpha decay.
        - |
          Z rising by one with no mass change describes beta decay, not alpha decay.
        - |
          Gaining mass and protons is capture, not decay; alpha decay makes the nucleus smaller.
      answer: 0
      explanation: |
        Review of 2.4: alpha decay removes two protons and two neutrons. This spontaneous decay is distinct from fission, which needs a neutron and splits the nucleus roughly in half.

    # ---- Multi-select
    - slug: chem-u08-w31-q12
      type: multi_select
      topic_code: "8.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly compare fission and fusion? Select all that apply.
      options:
        - "Fission splits a heavy nucleus; fusion joins light nuclei."
        - "Fusion releases more energy per nucleon than fission."
        - "Fission is currently used in commercial power stations; fusion is not."
        - "Fusion produces large amounts of long-lived radioactive fission fragments."
        - "Both release energy because the products are more tightly bound per nucleon than the reactants."
        - "Fusion can run away in a chain reaction if the control rods fail."
      option_explanations:
        - |
          Correct. Uranium-235 splits into two medium fragments; hydrogen isotopes join to form helium.
        - |
          Correct. About 3.5 MeV per nucleon for deuterium–tritium fusion against about 0.9 MeV for fission.
        - |
          Correct. Fission plants have operated since the 1950s; fusion experiments have not yet produced sustained net power.
        - |
          Fusion's product is helium; its only long-lived waste is the reactor structure activated by neutrons.
        - |
          Correct. Both move nucleons toward the iron-56 peak of the binding-energy curve.
        - |
          Fusion has no chain reaction and no control rods; if confinement fails the plasma cools and the reaction simply stops.
      answer: [0, 1, 2, 4]
      explanation: |
        Fusion's waste and safety profile is its chief attraction; the two false statements apply to fission, not fusion.

    - slug: chem-u08-w31-q13
      type: multi_select
      topic_code: "2.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Fission fragments are radioactive. Which statements about the types of radiation they emit are correct? Select all that apply.
      options:
        - "An alpha particle is a helium nucleus and is stopped by a sheet of paper."
        - "A beta particle is an electron emitted from the nucleus when a neutron becomes a proton."
        - "Gamma rays are high-energy electromagnetic radiation that need thick lead or concrete to stop."
        - "Beta decay lowers the atomic number by one."
        - "Gamma emission changes neither the mass number nor the atomic number."
      option_explanations:
        - |
          Correct. Two protons and two neutrons, charge 2+, heavy and slow, with very little penetrating power.
        - |
          Correct. In beta decay a neutron converts to a proton and the electron leaves the nucleus; Z rises by one.
        - |
          Correct. Gamma rays carry no charge or mass and are the most penetrating.
        - |
          Beta decay raises Z by one (neutron → proton + electron); it does not lower it.
        - |
          Correct. Gamma emission releases energy from an excited nucleus without changing its identity.
      answer: [0, 1, 2, 4]
      explanation: |
        Review of 2.4: alpha (⁴He, −4 A, −2 Z), beta (electron, Z + 1), gamma (energy only). Spent fuel is dangerous mainly because of beta and gamma emission from the fragments.

    # ---- True/false
    - slug: chem-u08-w31-q14
      type: true_false
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: the Sun's energy comes from the fusion of hydrogen nuclei into helium in its core.
      answer: true
      explanation: |
        True. At about 15 million K and enormous pressure, hydrogen nuclei fuse in several steps to helium-4, net 4 ¹H → ⁴He + 2 positrons + energy, converting about 0.7 percent of the mass to energy.

    - slug: chem-u08-w31-q15
      type: true_false
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: the energy released by burning one gram of coal is roughly the same as the energy released by fissioning one gram of uranium-235, because both are exothermic processes.
      answer: false
      explanation: |
        False. Review of 7.1: both are exothermic, but a chemical ΔH comes from rearranging electrons (a few eV per atom), while fission rearranges nucleons (about 200 MeV per atom). Coal gives about 3 × 10⁴ J/g; uranium-235 fission gives about 8 × 10¹⁰ J/g, nearly three million times more.

    # ---- Fill in the blank
    - slug: chem-u08-w31-q16
      type: fill_blank
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A fission in which the neutrons released go on to cause further fissions, which release more neutrons, is called a ____ reaction.
      answer:
        - "chain"
        - "chain reaction"
        - "nuclear chain"
      explanation: |
        A chain reaction is self-propagating because each fission produces the neutrons that trigger the next. Critical mass is the amount needed to sustain it.

    - slug: chem-u08-w31-q17
      type: fill_blank
      topic_code: "2.2"
