week: 32
unit: 8
title: "Hydrocarbons, Functional Groups and Polymers"
topics: ["8.6", "8.7"]
guide: guides/week-32.md
guide_description: |
  Why carbon has a chemistry of its own; alkanes, alkenes and alkynes with their general formulas and the first
  ten names; saturated versus unsaturated and the bromine-water test; structural isomers and basic branch
  naming; the boiling-point trend; complete and incomplete combustion; fractional distillation and cracking;
  then the alcohol, carboxylic acid, ester, amine and halide functional groups, oxidation of ethanol and
  esterification, addition polymers from alkenes, condensation polymers including polyesters, nylon and
  proteins, and the properties and recycling of plastics.
flashcards_description: |
  30 cards on carbon's bonding, the alkane series and general formulas, isomers, alkenes and alkynes, the
  bromine test, combustion equations, distillation and cracking, each functional group with an example, the
  two reactions of ethanol, addition and condensation polymers, and plastics.

flashcards:
  - front: Why carbon forms so many compounds
    back: |
      Four strong covalent bonds, including strong C–C bonds, so carbon builds chains, branches and rings of any length with single, double or triple bonds, and still has bonds left for hydrogen and other elements.
    topic_code: "8.6"
  - front: Hydrocarbon → definition and the three families
    back: |
      A compound of carbon and hydrogen only. Alkanes (single bonds), alkenes (a C=C double bond) and alkynes (a C≡C triple bond).
    topic_code: "8.6"
  - front: General formulas of alkanes, alkenes and alkynes
    back: |
      Alkanes CₙH₂ₙ₊₂ (hexane C₆H₁₄); alkenes CₙH₂ₙ (hexene C₆H₁₂); alkynes CₙH₂ₙ₋₂ (hexyne C₆H₁₀).
    topic_code: "8.6"
  - front: Names of the first ten alkanes
    back: |
      Methane, ethane, propane, butane, pentane, hexane, heptane, octane, nonane, decane (C₁ to C₁₀). The prefixes are reused for every organic family.
    topic_code: "8.6"
  - front: Saturated versus unsaturated hydrocarbons
    back: |
      Saturated: only single bonds, every carbon holding its maximum hydrogens (alkanes); unreactive. Unsaturated: a double or triple bond that can open to add atoms (alkenes, alkynes); reactive.
    topic_code: "8.6"
  - front: Trend in alkane boiling points and its cause
    back: |
      Boiling point rises with chain length (methane −162 °C, butane −0.5 °C, octane 126 °C) because larger nonpolar molecules have stronger London dispersion forces. C₁ to C₄ are gases at room temperature.
    topic_code: "8.6"
  - front: Structural isomers → definition and the C₄H₁₀ pair
    back: |
      Same molecular formula, different arrangement of atoms. C₄H₁₀ is butane (straight chain, bp −0.5 °C) or 2-methylpropane (branched, bp −12 °C); the branched isomer boils lower because it packs less closely.
    topic_code: "8.6"
  - front: The three isomers of C₅H₁₂
    back: |
      Pentane (straight), 2-methylbutane (one methyl on a four-carbon chain), 2,2-dimethylpropane (two methyls on the middle carbon of a three-carbon chain).
    topic_code: "8.6"
  - front: Naming a branched alkane → the rule
    back: |
      Find the longest continuous chain for the parent name; number it from the end nearer the branch; name each branch as an alkyl group (methyl, ethyl) with its position; use di-, tri- for repeats: 2,3-dimethylbutane.
    topic_code: "8.6"
  - front: Bromine-water test for unsaturation
    back: |
      Shake with orange bromine water. An alkene decolourises it as Br₂ adds across the double bond (C₂H₄ + Br₂ → C₂H₄Br₂); an alkane leaves it orange.
    topic_code: "8.6"
  - front: Hydrogenation of alkenes → use
    back: |
      H₂ adds across C=C over a nickel catalyst, converting unsaturated liquid vegetable oils into more saturated solid fats (margarine).
    topic_code: "8.6"
  - front: Complete combustion of a hydrocarbon → products and balancing order
    back: |
      CO₂ and H₂O with a blue flame. Balance carbon, then hydrogen, then oxygen last: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O; 2C₈H₁₈ + 25O₂ → 16CO₂ + 18H₂O.
    topic_code: "8.6"
  - front: Incomplete combustion → cause, products and sign
    back: |
      Limited oxygen gives carbon monoxide (toxic, colourless, odourless) and soot in place of some CO₂, with less energy released; a yellow, smoky flame is the sign.
    topic_code: "8.6"
  - front: Fractional distillation of crude oil
    back: |
      Crude oil is a mixture of hydrocarbons separated by boiling point in a column that is hot at the bottom and cool at the top: refinery gases at the top, then petrol, kerosene, diesel, lubricating oil, bitumen at the bottom.
    topic_code: "8.6"
  - front: Cracking → what it is and why it is done
    back: |
      Heating long alkanes with a catalyst breaks them into a shorter alkane and an alkene: C₁₀H₂₂ → C₈H₁₈ + C₂H₄. It meets the demand for petrol and supplies the ethene that makes plastics.
    topic_code: "8.6"
  - front: Mass of CO₂ from burning 57.1 g of octane
    back: |
      Octane 114.22 g/mol; 57.1 ÷ 114.22 = 0.500 mol; 8 CO₂ per octane gives 4.00 mol × 44.01 = 176 g. Roughly three kilograms of CO₂ per kilogram of petrol.
    topic_code: "8.6"
  - front: Functional group → definition
    back: |
      An atom or group of atoms that gives a family of compounds its characteristic reactions; the carbon skeleton is the frame, the functional group does the reacting.
    topic_code: "8.7"
  - front: Alcohols → group, example and a property
    back: |
      −OH; names end -ol; ethanol C₂H₅OH. The polar, hydrogen-bonding OH makes ethanol mix with water and boil at 78 °C, against −89 °C for ethane.
    topic_code: "8.7"
  - front: Carboxylic acids → group, example and a property
    back: |
      −COOH; names end -oic acid; ethanoic (acetic) acid CH₃COOH. Weak acids: the acid of vinegar, which turns litmus red and fizzes with carbonates.
    topic_code: "8.7"
  - front: Esters → group, how they are made, where they are found
    back: |
      −COO− linking two carbon chains; made from a carboxylic acid and an alcohol with loss of water; fruity smells, solvents, fats and oils.
    topic_code: "8.7"
  - front: Amines and halides → groups and examples
    back: |
      Amine −NH₂ (methylamine, weak bases; the group of amino acids). Halide −Cl or −Br (chloroethane; chloroethene, the PVC monomer).
    topic_code: "8.7"
  - front: Oxidation of ethanol → equation and sign
    back: |
      C₂H₅OH + 2[O] → CH₃COOH + H₂O, by acidified dichromate (orange to green) or by bacteria in open wine. Carbon's oxidation number rises; wine becomes vinegar.
    topic_code: "8.7"
  - front: Esterification → equation and naming the ester
    back: |
      CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O with concentrated sulfuric acid as catalyst. Ester named alcohol part first, acid part second: ethyl ethanoate. Reversible; the reverse is hydrolysis.
    topic_code: "8.7"
  - front: Fermentation → equation and conditions
    back: |
      C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ by yeast enzymes at about 35 °C without oxygen; the source of ethanol in drinks and biofuel.
    topic_code: "8.7"
  - front: Addition polymerisation → description and the ethene example
    back: |
      Monomers with C=C bonds open the double bond and link in a chain; nothing is lost. n C₂H₄ → (−CH₂−CH₂−)ₙ, polyethene. Monomer ethene; repeat unit −CH₂−CH₂−.
    topic_code: "8.7"
  - front: Four addition polymers and their monomers
    back: |
      Polypropene from propene (ropes, crates); PVC from chloroethene (pipes, cables); PTFE from tetrafluoroethene (non-stick); polystyrene from phenylethene (foam packaging).
    topic_code: "8.7"
  - front: Degree of polymerisation from molar mass
    back: |
      n = polymer molar mass ÷ monomer molar mass. Polyethene of 56,100 g/mol ÷ 28.05 g/mol = 2,000 ethene units.
    topic_code: "8.7"
  - front: Condensation polymerisation → description and examples
    back: |
      Monomers with a reactive group at each end join with the loss of a small molecule (usually water) at every link. Diacid + diol → polyester (PET); diacid + diamine → nylon; amino acids → proteins.
    topic_code: "8.7"
  - front: Thermoplastic versus thermoset
    back: |
      Thermoplastics (polyethene, PET): long chains held by weak forces slide when warmed, so they soften, mould and recycle. Thermosets (epoxy, bakelite): covalently cross-linked chains cannot slide, so they are rigid and do not melt.
    topic_code: "8.7"
  - front: Why plastics persist in the environment and what can be done
    back: |
      No organism has enzymes for CH₂ chains, so polyalkenes last for centuries and fragment into microplastics. Responses: mechanical and chemical recycling, incineration for energy, biodegradable polyesters such as polylactic acid.
    topic_code: "8.7"

quiz:
  description: |
    23 questions · about 40 minutes · topics 8.6 and 8.7 (hydrocarbons, isomers, combustion, distillation and
    cracking, functional groups, ethanol's reactions, addition and condensation polymers, plastics), with review
    of mixtures (1.2), molecular shape (3.5), intermolecular forces (3.6), balancing (4.1), molar mass and
    percent composition (4.4, 4.5) and oxidation numbers (8.1). Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes. Molar masses: C 12.01, H 1.008,
    O 16.00 g/mol.
  questions:
    # ---- Stimulus set A: the alkane series (8.6, 3.6)
    - slug: chem-u08-w32-q01
      type: multiple_choice
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Boiling points of the straight-chain alkanes:

        | Alkane | Carbons | Boiling point (°C) |
        | --- | --- | --- |
        | Methane | 1 | −162 |
        | Ethane | 2 | −89 |
        | Propane | 3 | −42 |
        | Butane | 4 | −0.5 |
        | Pentane | 5 | 36 |
        | Hexane | 6 | 69 |
        | Octane | 8 | 126 |
      prompt: |
        What is the molecular formula of hexane?
      options:
        - "C₆H₁₂"
        - "C₆H₁₀"
        - "C₆H₁₄"
        - "C₆H₁₆"
      option_explanations:
        - |
          C₆H₁₂ fits CₙH₂ₙ, the alkene formula; it is hexene, with one double bond.
        - |
          C₆H₁₀ fits CₙH₂ₙ₋₂, an alkyne with a triple bond.
        - |
          Correct. Alkanes are CₙH₂ₙ₊₂: 2(6) + 2 = 14 hydrogens.
        - |
          Sixteen hydrogens would need more than four bonds on some carbon; no hydrocarbon with six carbons can hold them.
      answer: 2
      explanation: |
        Alkane general formula CₙH₂ₙ₊₂: each chain carbon carries two hydrogens plus one extra at each end.

    - slug: chem-u08-w32-q02
      type: multiple_choice
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Boiling points of the straight-chain alkanes:

        | Alkane | Carbons | Boiling point (°C) |
        | --- | --- | --- |
        | Methane | 1 | −162 |
        | Ethane | 2 | −89 |
        | Propane | 3 | −42 |
        | Butane | 4 | −0.5 |
        | Pentane | 5 | 36 |
        | Hexane | 6 | 69 |
        | Octane | 8 | 126 |
      prompt: |
        Why does the boiling point rise steadily as the chain gets longer?
      options:
        - "Larger molecules have more electrons and more surface contact, so their London dispersion forces are stronger and more energy is needed to separate them."
        - "Longer chains form more hydrogen bonds between molecules."
        - "Longer chains have stronger C–C covalent bonds that must be broken on boiling."
        - "Larger molecules are more polar, so dipole–dipole forces increase."
      option_explanations:
        - |
          Correct. Review of 3.6: alkanes are nonpolar, so dispersion forces are their only intermolecular attraction, and those grow with molecular size.
        - |
          Alkanes have no O–H or N–H bonds and cannot hydrogen-bond.
        - |
          Boiling separates molecules; it does not break covalent bonds within them.
        - |
          C–H bonds are almost nonpolar and the molecules are symmetrical; alkanes have no significant dipoles.
      answer: 0
      explanation: |
        Review of 3.6: for nonpolar molecules, boiling point tracks the strength of dispersion forces, which increase with molecular size.

    - slug: chem-u08-w32-q03
      type: multiple_choice
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Boiling points of the straight-chain alkanes:

        | Alkane | Carbons | Boiling point (°C) |
        | --- | --- | --- |
        | Methane | 1 | −162 |
        | Ethane | 2 | −89 |
        | Propane | 3 | −42 |
        | Butane | 4 | −0.5 |
        | Pentane | 5 | 36 |
        | Hexane | 6 | 69 |
        | Octane | 8 | 126 |
      prompt: |
        Which of these alkanes are gases at 25 °C and 1 atm?
      options:
        - "Methane only"
        - "Methane, ethane, propane and butane"
        - "Methane, ethane, propane, butane and pentane"
        - "All of them, because alkanes are fuels"
      option_explanations:
        - |
          Any alkane whose boiling point is below 25 °C is a gas at that temperature, and four of them qualify.
        - |
          Correct. Their boiling points (−162 to −0.5 °C) are all below 25 °C; pentane, boiling at 36 °C, is a liquid.
        - |
          Pentane boils at 36 °C, above room temperature, so it is a liquid at 25 °C.
        - |
          Being a fuel says nothing about state; octane, the main component of petrol, is a liquid.
      answer: 1
      explanation: |
        A substance is a gas at a temperature above its boiling point. C₁ to C₄ alkanes are gases at room temperature, which is why butane is sold in pressurised canisters.

    # ---- Singles
    - slug: chem-u08-w32-q04
      type: multiple_choice
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly distinguishes alkenes from alkanes?
      options:
        - "Alkenes contain oxygen; alkanes do not."
        - "Alkenes are saturated; alkanes are unsaturated."
        - "Alkenes have the general formula CₙH₂ₙ₊₂."
        - "Alkenes contain a C=C double bond, making them unsaturated and more reactive."
      option_explanations:
        - |
          Both are hydrocarbons, containing only carbon and hydrogen.
        - |
          This is reversed: alkanes, with only single bonds, are saturated; alkenes are unsaturated.
        - |
          CₙH₂ₙ₊₂ is the alkane formula; alkenes are CₙH₂ₙ.
        - |
          Correct. The double bond can open to add atoms (bromine, hydrogen, or another alkene), which alkanes cannot do.
      answer: 3
      explanation: |
        Unsaturation means a multiple bond with room to add more atoms. Alkenes have one; alkanes have none.

    - slug: chem-u08-w32-q05
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the shape around each carbon atom in an alkane, and what is the bond angle?
      options:
        - "Trigonal planar, 120°"
        - "Tetrahedral, 109.5°"
        - "Linear, 180°"
        - "Square planar, 90°"
      option_explanations:
        - |
          Trigonal planar describes a carbon with a double bond (as in an alkene), which has three electron domains.
        - |
          Correct. Review of 3.5: four single bonds and no lone pairs give four electron domains, which VSEPR places at the corners of a tetrahedron; a chain of such carbons is a zigzag.
        - |
          Linear is the shape at a triple-bonded carbon (as in ethyne), with two electron domains.
        - |
          Square planar does not occur for carbon; four domains repel into three dimensions, not a square.
      answer: 1
      explanation: |
        Review of 3.5: four bonding domains around carbon give a tetrahedral shape with 109.5° angles, which is why drawn chains are really zigzags.

    - slug: chem-u08-w32-q06
      type: multiple_choice
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Two unlabelled test tubes contain hexane and hexene. A few drops of orange bromine water are shaken with each. What is observed?
      options:
        - "Both turn colourless, because bromine reacts with all hydrocarbons."
        - "Both stay orange, because bromine is unreactive."
        - "The hexene turns the bromine water colourless; the hexane leaves it orange."
        - "The hexane turns the bromine water colourless; the hexene leaves it orange."
      option_explanations:
        - |
          Alkanes have no double bond to add bromine across, so hexane does not decolourise bromine water.
        - |
          Bromine adds readily across a C=C double bond, so the alkene reacts.
        - |
          Correct. Bromine adds across hexene's double bond (C₆H₁₂ + Br₂ → C₆H₁₂Br₂), removing the orange colour; saturated hexane does not react.
        - |
          This is reversed: it is the unsaturated hexene that reacts with bromine.
      answer: 2
      explanation: |
        The bromine-water test detects unsaturation: decolourisation means a double (or triple) bond is present.

    - slug: chem-u08-w32-q07
      type: multiple_choice
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A gas heater burns with a yellow, smoky flame instead of a blue one. What does this indicate, and why is it dangerous?
      options:
        - "Incomplete combustion from insufficient oxygen is producing carbon monoxide and soot; carbon monoxide is toxic."
        - "Complete combustion is producing extra carbon dioxide, which is toxic at low concentrations."
        - "The fuel contains sulfur, which burns yellow."
        - "The heater is producing hydrogen gas, which may explode."
      option_explanations:
        - |
          Correct. With limited oxygen some carbon ends as CO (colourless, odourless, binds to haemoglobin) and as glowing soot, which colours the flame yellow; less energy is released too.
        - |
          Complete combustion gives a clean blue flame, and CO₂ is not toxic at the levels a heater produces; CO is the danger.
        - |
          Natural gas and propane are desulfurised; the yellow glow is incandescent carbon particles from incomplete combustion.
        - |
          Burning hydrocarbons do not release hydrogen gas; the hydrogen becomes water in either kind of combustion.
      answer: 0
      explanation: |
        Blue flame: complete combustion to CO₂ and H₂O. Yellow, sooty flame: incomplete combustion, with CO and carbon among the products.

    - slug: chem-u08-w32-q08
      type: multiple_choice
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Ethanol has the formula C₂H₅OH. Which functional group does it contain, and to which family does it belong?
      options:
        - "−COOH; it is a carboxylic acid."
        - "−NH₂; it is an amine."
        - "C=C; it is an alkene."
        - "−OH; it is an alcohol."
      option_explanations:
        - |
          −COOH is the carboxylic acid group, found in ethanoic acid, CH₃COOH, the oxidation product of ethanol.
        - |
          −NH₂ contains nitrogen, which ethanol does not have.
        - |
          Ethanol has only single bonds between its carbons; its reactivity comes from the OH group.
        - |
          Correct. The hydroxyl group −OH makes ethanol an alcohol (name ending -ol), polar and able to hydrogen-bond with water.
      answer: 3
      explanation: |
        The −OH group defines alcohols. It is responsible for ethanol's solubility in water and its 78 °C boiling point.

    - slug: chem-u08-w32-q09
      type: multiple_choice
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A bottle of wine left open turns sour over several weeks. What has happened chemically?
      options:
        - "The ethanol has fermented into glucose."
        - "Bacteria have oxidised the ethanol to ethanoic acid, a weak carboxylic acid."
        - "The ethanol has polymerised into a long chain."
        - "The water has evaporated, concentrating the sugar."
      option_explanations:
        - |
          Fermentation runs the other way, glucose to ethanol, and needs yeast without oxygen.
        - |
          Correct. Acetobacter use oxygen from the air to oxidise C₂H₅OH to CH₃COOH; vinegar is dilute ethanoic (acetic) acid, which is why the wine tastes sour.
        - |
          Ethanol has no C=C bond and does not polymerise under these conditions.
        - |
          Evaporation would not make the wine acidic; the sourness is a new carboxylic acid.
      answer: 1
      explanation: |
        Oxidation of an alcohol gives a carboxylic acid: wine to vinegar. In the lab, acidified dichromate does the same job and turns from orange to green.

    - slug: chem-u08-w32-q10
      type: multiple_choice
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Ethene polymerises to polyethene. Which statement about the process and the product is correct?
      options:
        - "Water is released each time two ethene molecules join."
        - "The polymer keeps one double bond per repeat unit."
        - "The double bond of each ethene opens so the molecules link into a saturated chain of −CH₂−CH₂− units, with no atoms lost."
        - "Polyethene has a smaller molar mass than ethene because bonds are broken."
      option_explanations:
        - |
          Loss of water marks condensation polymerisation; ethene adds without losing anything.
        - |
          The double bonds are used up in forming the chain links; polyethene is fully saturated, which is why it is so unreactive.
        - |
          Correct. Addition polymerisation: n C₂H₄ → (−CH₂−CH₂−)ₙ, with the polymer's formula exactly n times the monomer's.
        - |
          Polyethene is thousands of times heavier than ethene; the chain is built from thousands of monomers.
      answer: 2
      explanation: |
        In addition polymerisation the C=C opens and links to the next monomer; the repeat unit −CH₂−CH₂− has the same atoms as ethene.

    - slug: chem-u08-w32-q11
      type: multiple_choice
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A polyester is made from a dicarboxylic acid and a diol. How does this polymerisation differ from the formation of polyethene?
      options:
        - "A molecule of water is lost at every link, so the polymer's mass is less than the total mass of its monomers; this is condensation polymerisation."
        - "It requires a C=C double bond in each monomer."
        - "It produces a polymer with no oxygen atoms."
        - "It is identical; all polymers form by addition."
      option_explanations:
        - |
          Correct. Each −COOH joins each −OH by esterification, releasing H₂O; the monomers need two reactive ends, not a double bond.
        - |
          Double bonds are the feature of addition monomers; condensation monomers need a reactive group at each end.
        - |
          The ester links −COO− contain oxygen; polyesters are rich in it.
        - |
          There are two mechanisms, addition (ethene, propene, PVC) and condensation (polyesters, nylon, proteins).
      answer: 0
      explanation: |
        Condensation polymerisation joins monomers with loss of a small molecule; PET, nylon and proteins all form this way.

    # ---- Multi-select
    - slug: chem-u08-w32-q12
      type: multi_select
      topic_code: "8.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about polymers and plastics are correct? Select all that apply.
      options:
        - "The monomer of PVC is chloroethene, CH₂=CHCl."
        - "Proteins are condensation polymers of amino acids."
        - "Thermoplastics soften on heating because their chains are held together only by weak intermolecular forces."
        - "Polyethene biodegrades quickly because bacteria have enzymes for CH₂ chains."
        - "Thermosets can be melted and remoulded repeatedly."
        - "The degree of polymerisation is the number of monomer units in a polymer chain."
      option_explanations:
        - |
          Correct. Vinyl chloride adds through its C=C to give poly(vinyl chloride).
        - |
          Correct. Each amino acid's −COOH joins the next one's −NH₂ with loss of water.
        - |
          Correct. Warmed chains slide past one another, so the plastic can be moulded and recycled by remelting.
        - |
          No organism digests polyalkene chains; polyethene persists for centuries, fragmenting into microplastics.
        - |
          Thermosets are covalently cross-linked and cannot melt; they char instead.
        - |
          Correct. n in (−CH₂−CH₂−)ₙ; found from polymer molar mass ÷ monomer molar mass.
      answer: [0, 1, 2, 5]
      explanation: |
        Thermoplastic versus thermoset follows from chain-to-chain bonding; biodegradability follows from whether organisms have enzymes for the links.

    - slug: chem-u08-w32-q13
      type: multi_select
      topic_code: "4.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following combustion equations are correctly balanced? Select all that apply.
      options:
        - "C₃H₈ + 5O₂ → 3CO₂ + 4H₂O"
        - "CH₄ + O₂ → CO₂ + 2H₂O"
        - "2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O"
        - "C₂H₄ + 3O₂ → 2CO₂ + 2H₂O"
        - "C₆H₁₄ + 9O₂ → 6CO₂ + 7H₂O"
      option_explanations:
        - |
          Correct. Carbon 3 = 3; hydrogen 8 = 8; oxygen 10 = 6 + 4, so every element balances.
        - |
          Oxygen is 2 on the left but 4 on the right; the coefficient of O₂ must be 2.
        - |
          Correct. Carbon 4 = 4; hydrogen 12 = 12; oxygen 14 = 8 + 6, so every element balances.
        - |
          Correct. Carbon 2 = 2; hydrogen 4 = 4; oxygen 6 = 4 + 2, so every element balances.
        - |
          Oxygen is 18 on the left but 12 + 7 = 19 on the right; the balanced form is 2C₆H₁₄ + 19O₂ → 12CO₂ + 14H₂O.
