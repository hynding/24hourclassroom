      prompt: |
        (a) Write the molecular formulas of the alkane, the alkene and the alkyne that each contain five carbon atoms, and name the alkane.
        (b) Name the three structural isomers of C₅H₁₂ and explain why the most branched one has the lowest boiling point.
        (c) Describe a test that would distinguish pentane from pentene, giving the observation for each.
      answer: |
        (a) Alkane C₅H₁₂ (pentane); alkene C₅H₁₀ (pentene); alkyne C₅H₈ (pentyne). (b) Pentane, 2-methylbutane and 2,2-dimethylpropane. The most branched isomer, 2,2-dimethylpropane, is the most compact and nearly spherical, so its molecules have less surface contact with one another; the London dispersion forces are weaker and less energy is needed to separate them, giving the lowest boiling point (about 10 °C, against 36 °C for pentane). (c) Shake each with orange bromine water. Pentene decolourises it, because bromine adds across the C=C double bond; pentane leaves it orange, because a saturated alkane has no double bond to react.
      explanation: |
        1 point for (a) all three formulas with the name pentane. 1 point for (b) the three isomer names and the dispersion-force explanation of the boiling point. 1 point for (c) the bromine-water test with both observations. Accept the hydrogenation test or burning behaviour only if the observations are correctly stated.

    - slug: chem-u08-w32-q22
      type: short_answer
      topic_code: "8.7"
      source: "general knowledge"
      points: 3
      stimulus: |
        A student warms ethanoic acid with ethanol and a few drops of concentrated sulfuric acid, then pours the mixture into a beaker of sodium carbonate solution. A sweet, fruity smell rises and a layer of oily liquid floats on the water.

        CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O
      prompt: |
        (a) Name the functional group in each reactant and in the organic product, and name the product.
        (b) State the type of reaction and the role of the sulfuric acid.
        (c) Explain why the product floats as a separate layer and why it smells, and suggest why the mixture is poured into sodium carbonate solution.
      answer: |
        (a) Ethanoic acid has the carboxylic acid group −COOH; ethanol has the alcohol (hydroxyl) group −OH; the product has the ester group −COO− and is ethyl ethanoate. (b) Esterification, a condensation reaction in which the acid and alcohol join with the loss of water; it is reversible. The concentrated sulfuric acid is a catalyst (and absorbs water, which shifts the equilibrium toward the ester). (c) The ester has no −OH group and cannot hydrogen-bond with water, so it is almost insoluble and, being less dense, floats as a layer. Its weak intermolecular forces make it volatile, so molecules reach the nose easily; esters have characteristic fruity smells. The sodium carbonate neutralises the leftover ethanoic and sulfuric acids, so their sharp smells and corrosiveness do not mask the ester, and the fizzing stops when the acids are gone.
      explanation: |
        1 point for (a) the three groups correctly named and the product named ethyl ethanoate. 1 point for (b) esterification (condensation) and sulfuric acid as catalyst. 1 point for (c) insolubility from lack of hydrogen bonding, volatility explaining the smell, and neutralisation of leftover acid.

    # ---- Long answer
    - slug: chem-u08-w32-q23
      type: long_answer
      topic_code: "8.7"
      source: "general knowledge"
      points: 6
      prompt: |
        A supermarket is choosing between polyethene bags, PET (polyester) bottles and polylactic acid (PLA, a biodegradable polyester) cups, and asks you to explain the chemistry behind each. Write an account that: (1) explains how polyethene is made from ethene, naming the type of polymerisation, the monomer and the repeat unit, and where the ethene comes from; (2) explains how a polyester such as PET or PLA is made, naming the type of polymerisation and the functional groups involved; (3) relates the properties of polyethene (flexible, waterproof, unreactive, softens when heated) to its structure and bonding; (4) explains why polyethene persists in the environment while PLA can biodegrade, in terms of their chemical links; (5) gives a reasoned recommendation about which material to use for which purpose, mentioning at least one way each can be recycled or disposed of.
      answer: |
        (1) Ethene, CH₂=CH₂, is obtained by cracking long alkanes from crude oil. Under heat, pressure and a catalyst its double bonds open and thousands of molecules link: n C₂H₄ → (−CH₂−CH₂−)ₙ. Addition polymerisation: monomer ethene, repeat unit −CH₂−CH₂−, no atoms lost. (2) PET is made from a dicarboxylic acid and a diol: the −COOH group at each end of the acid reacts with an −OH group of the diol by esterification, forming an ester link −COO− and releasing a water molecule at every join. PLA is made from lactic acid, which carries both groups, so each molecule links to the next the same way. Because water is lost at each link, this is condensation polymerisation. (3) Polyethene is a long saturated chain of nonpolar C–C and C–H bonds. Chains attract only by dispersion forces, so they slide when warmed (a thermoplastic that softens and moulds) and bend easily. Nonpolar chains repel water, so it is waterproof. With no double bonds or functional groups, only strong C–C and C–H bonds, it is unreactive. (4) No organism has enzymes that break the C–C backbone of polyethene, so it persists for centuries and fragments into microplastics. PLA's chain is joined by ester links, which can be hydrolysed, the reverse of esterification; soil and compost microorganisms have enzymes for ester bonds, so in warm, moist compost PLA breaks down to lactic acid, then CO₂ and water, within months. PET's ester links can also be hydrolysed, but its stiff crystalline structure makes this very slow. (5) Polyethene bags: cheap, strong and waterproof; recyclable by remelting, never compostable, so use where reuse and collection are assured. PET bottles: strong, clear and gas-tight; recycled by remelting or by hydrolysis back to monomers, so a deposit-return scheme makes sense. PLA cups: only where industrial composting exists, because PLA contaminates PET recycling and barely degrades in landfill or the sea. Overall: reuse first, PET with recycling, PLA only with composting.
      explanation: |
        6 points. 1 point: addition polymerisation of ethene correctly described with monomer, repeat unit and cracking as the source. 1 point: condensation polymerisation via ester links between −COOH and −OH with loss of water. 1 point: each polyethene property linked to a structural feature (dispersion forces, nonpolar chains, saturated strong bonds). 1 point: persistence versus biodegradability explained through C–C backbone versus hydrolysable ester links. 1 point: a reasoned recommendation with at least one disposal or recycling route per material. 1 point: correct and consistent use of monomer, polymer, repeat unit, thermoplastic and functional-group vocabulary. Deduct 1 point for saying polyethene retains double bonds or that PLA biodegrades anywhere.
