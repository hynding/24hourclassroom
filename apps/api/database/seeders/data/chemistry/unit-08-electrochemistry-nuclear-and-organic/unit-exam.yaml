  - slug: chem-u08-exam-q35
    type: numeric
    topic_code: "8.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A current of 0.800 A flows for 25.0 minutes through a silver nitrate solution. What mass of silver is deposited? Use F = 96,485 C/mol and Ag = 107.87 g/mol, and give your answer in grams to two decimal places.
    answer: { value: 1.34, tolerance: 0.02 }
    explanation: |
      Q = 0.800 A × 1,500 s = 1,200 C. Moles e⁻ = 1,200 ÷ 96,485 = 0.01244 mol. Ag⁺ + e⁻ → Ag: 0.01244 mol × 107.87 g/mol = 1.34 g.

  - slug: chem-u08-exam-q36
