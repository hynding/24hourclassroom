  # ---- Short answer
  - slug: chem-u08-exam-q38
    type: short_answer
    topic_code: "8.4"
    source: "general knowledge"
    points: 3
    prompt: |
      Molten sodium chloride and an aqueous solution of sodium sulfate are each electrolysed with inert electrodes.
      (a) Write the half-reaction at each electrode for the molten sodium chloride and name the products.
      (b) For the sodium sulfate solution, hydrogen forms at one electrode and oxygen at the other. Write the half-reaction at each electrode and state which electrode is which.
      (c) Explain why solid sodium chloride cannot be electrolysed and why an external power supply is needed in both cases.
    answer: |
      (a) Cathode: Na⁺ + e⁻ → Na(l), sodium metal. Anode: 2Cl⁻ → Cl₂(g) + 2e⁻, chlorine gas. (b) Cathode (negative): 2H₂O + 2e⁻ → H₂ + 2OH⁻, hydrogen. Anode (positive): 2H₂O → O₂ + 4H⁺ + 4e⁻, oxygen; the sodium and sulfate ions only carry the current. (c) In a solid the ions are fixed in the lattice and cannot move to the electrodes; melting (or dissolving) frees them. Both reactions are non-spontaneous (their E°cell would be negative), so energy must be supplied to force electrons from the anode to the cathode against the natural direction.
    explanation: |
      1 point for (a) both half-reactions with sodium and chlorine identified. 1 point for (b) both water half-reactions with the correct electrodes and signs. 1 point for (c) mobility of ions and the non-spontaneous nature of the reactions.

  - slug: chem-u08-exam-q39
    type: short_answer
    topic_code: "8.7"
    source: "general knowledge"
    points: 3
    stimulus: |
      Three compounds:

      A: CH₃CH₂OH
      B: CH₃COOH
      C: CH₃COOCH₂CH₃
    prompt: |
      (a) Name the functional group and the family of each compound.
      (b) Write the equation by which A and B combine to form C, naming the type of reaction and the catalyst used.
      (c) State which of the three has the highest boiling point and explain why in terms of intermolecular forces.
    answer: |
      (a) A: −OH, alcohol (ethanol). B: −COOH, carboxylic acid (ethanoic acid). C: −COO− ester link, ester (ethyl ethanoate). (b) CH₃COOH + CH₃CH₂OH ⇌ CH₃COOCH₂CH₃ + H₂O; esterification, a condensation reaction with loss of water, catalysed by concentrated sulfuric acid and reversible. (c) B, ethanoic acid (118 °C), boils highest. Its −COOH group forms two hydrogen bonds per molecule (pairs of acid molecules link head to head), stronger than the single hydrogen bond of ethanol's −OH (78 °C); the ester has no O–H bond, cannot hydrogen-bond with itself, and boils lowest (77 °C).
    explanation: |
      1 point for (a) all three groups and families correctly named. 1 point for (b) the correct equation with esterification and sulfuric acid as catalyst. 1 point for (c) ethanoic acid highest with a hydrogen-bonding explanation and the ester lowest because it cannot hydrogen-bond with itself.

  # ---- Long answer
  - slug: chem-u08-exam-q40
    type: long_answer
    topic_code: "8.3"
    source: "general knowledge"
    points: 6
    prompt: |
      A car battery is a lead-acid battery of six cells. On discharge the overall reaction is Pb + PbO₂ + 2H₂SO₄ → 2PbSO₄ + 2H₂O, and each cell produces about 2 V. Write an account that: (1) assigns oxidation numbers to lead in Pb, PbO₂ and PbSO₄ and identifies which electrode is the anode and which the cathode during discharge; (2) explains why the battery is a voltaic cell on discharge and an electrolytic cell while the car's alternator recharges it, including what happens to the signs of the electrodes and the direction of the reaction; (3) explains why the six cells are connected in series and what voltage results; (4) explains why measuring the density of the electrolyte tells a mechanic the state of charge; (5) calculates the charge, in coulombs, and the moles of electrons that flow when the battery delivers 200 A for 3.00 s to start the engine (F = 96,485 C/mol).
    answer: |
      (1) Pb metal is 0; in PbO₂ (O −2) lead is +4; in PbSO₄ (sulfate 2−) lead is +2. Lead metal goes 0 → +2 and is oxidised, so the lead plate is the anode; lead(IV) oxide goes +4 → +2 and is reduced, so the PbO₂ plate is the cathode. Both end as lead(II) sulfate. (2) On discharge the reaction is spontaneous (positive E°cell), electrons flow from the lead anode (negative) through the starter motor to the PbO₂ cathode (positive): a voltaic cell. When the alternator applies a larger voltage the other way, it forces electrons back in: the reaction runs in reverse, 2PbSO₄ + 2H₂O → Pb + PbO₂ + 2H₂SO₄, regenerating the plates and the acid. That is electrolysis, an electrolytic cell; the plate that was the anode now undergoes reduction, so the names swap while the lead plate remains the negative terminal. (3) In series the voltages add: six cells at about 2 V give about 12 V, enough for the starter motor and electrical system; in parallel the voltage would stay at 2 V and only the capacity would increase. (4) Discharge consumes sulfuric acid and produces water, so the electrolyte becomes more dilute and less dense; recharging restores the acid. A hydrometer reading near 1.28 g/mL means fully charged, near 1.10 g/mL means discharged. (5) Q = I × t = 200 A × 3.00 s = 600 C. Moles of electrons = 600 ÷ 96,485 = 0.00622 mol. Since each lead atom supplies two electrons, about 0.00311 mol (0.64 g) of lead is converted to lead sulfate per start.
    explanation: |
      6 points. 1 point: oxidation numbers 0, +4, +2 with Pb as anode and PbO₂ as cathode. 1 point: discharge as a spontaneous voltaic process with correct signs. 1 point: recharge as electrolysis with the reaction reversed. 1 point: series connection adds to 12 V. 1 point: acid consumed, density falls, as the state-of-charge test. 1 point: Q = 600 C and 0.00622 mol of electrons. Deduct 1 point for reversing anode and cathode on discharge.
