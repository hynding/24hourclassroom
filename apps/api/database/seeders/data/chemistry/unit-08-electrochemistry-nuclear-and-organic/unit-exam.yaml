unit: 8
description: |
  40 questions · about 75 minutes · every topic of unit 8 (8.1 to 8.7: oxidation numbers and redox, balancing
  half-reactions, voltaic cells and batteries, electrolysis and Faraday's law, fission and fusion, hydrocarbons,
  functional groups and polymers), with review of radioactive decay (2.4) and the activity series (4.3). Two data
  sets (an iron–silver cell and a reactor fission) each carry three questions. Multiple choice, select-all,
  true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
  answers and the long answer are graded by your teacher against the scoring notes. Constants: F = 96,485 C/mol;
  1 u = 931.5 MeV; molar masses C 12.01, H 1.008, O 16.00, Ag 107.87 g/mol; standard reduction potentials
  Ag⁺/Ag +0.80 V, Cu²⁺/Cu +0.34 V, Fe²⁺/Fe −0.44 V, Zn²⁺/Zn −0.76 V, Al³⁺/Al −1.66 V.
questions:
  # ---- Stimulus set A: an iron–silver voltaic cell (8.1, 8.2, 8.3)
  - slug: chem-u08-exam-q01
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      A voltaic cell is built from an iron electrode in 1.0 M Fe²⁺ solution and a silver electrode in 1.0 M Ag⁺ solution, joined by a wire and a salt bridge.

      | Reduction half-reaction | E° (V) |
      | --- | --- |
      | Ag⁺ + e⁻ → Ag | +0.80 |
      | Fe²⁺ + 2e⁻ → Fe | −0.44 |
    prompt: |
      In this cell, which species is oxidised and which is the reducing agent?
    options:
      - "Ag⁺ is oxidised; Fe is the reducing agent."
      - "Fe is oxidised; Fe is the reducing agent."
      - "Fe is oxidised; Ag⁺ is the reducing agent."
      - "Ag is oxidised; Ag is the reducing agent."
    option_explanations:
      - |
        Ag⁺ gains electrons (+1 → 0), which is reduction, not oxidation.
      - |
        Correct. Iron, with the lower reduction potential, loses electrons (0 → +2); the species that is oxidised is by definition the reducing agent.
      - |
        Ag⁺ accepts the electrons and is reduced, which makes it the oxidising agent.
      - |
        Silver metal is a product here, formed as Ag⁺ is reduced; nothing oxidises it.
    answer: 1
    explanation: |
      The half-cell with the lower E° is oxidised. Iron loses electrons and is both the oxidised species and the reducing agent; Ag⁺ is reduced and is the oxidising agent.

  - slug: chem-u08-exam-q02
    type: multiple_choice
    topic_code: "8.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      A voltaic cell is built from an iron electrode in 1.0 M Fe²⁺ solution and a silver electrode in 1.0 M Ag⁺ solution, joined by a wire and a salt bridge.

      | Reduction half-reaction | E° (V) |
      | --- | --- |
      | Ag⁺ + e⁻ → Ag | +0.80 |
      | Fe²⁺ + 2e⁻ → Fe | −0.44 |
    prompt: |
      What is the balanced overall equation for the cell reaction?
    options:
      - "Fe + Ag⁺ → Fe²⁺ + Ag"
      - "Fe²⁺ + 2Ag → Fe + 2Ag⁺"
      - "2Fe + Ag⁺ → 2Fe²⁺ + Ag"
      - "Fe + 2Ag⁺ → Fe²⁺ + 2Ag"
    option_explanations:
      - |
        Charge is +1 on the left and +2 on the right; iron's two electrons need two silver ions.
      - |
        This is the reverse reaction, which has a negative E°cell and does not occur spontaneously.
      - |
        Two irons would release four electrons while one silver ion accepts only one; neither atoms' charge nor electrons balance.
      - |
        Correct. Fe → Fe²⁺ + 2e⁻ and 2 × (Ag⁺ + e⁻ → Ag) add to Fe + 2Ag⁺ → Fe²⁺ + 2Ag; charge +2 on both sides.
    answer: 3
    explanation: |
      Double the silver half-reaction so two electrons are gained, then add. Check: Fe 1 = 1, Ag 2 = 2, charge +2 = +2.

  - slug: chem-u08-exam-q03
    type: multiple_choice
    topic_code: "8.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      A voltaic cell is built from an iron electrode in 1.0 M Fe²⁺ solution and a silver electrode in 1.0 M Ag⁺ solution, joined by a wire and a salt bridge.

      | Reduction half-reaction | E° (V) |
      | --- | --- |
      | Ag⁺ + e⁻ → Ag | +0.80 |
      | Fe²⁺ + 2e⁻ → Fe | −0.44 |
    prompt: |
      What is E°cell, and which electrode is the positive terminal?
    options:
      - "1.24 V; silver is positive."
      - "0.36 V; silver is positive."
      - "2.04 V; silver is positive."
      - "1.24 V; iron is positive."
    option_explanations:
      - |
        Correct. E°cell = 0.80 − (−0.44) = 1.24 V; electrons arrive at the silver cathode, which is the positive terminal of a voltaic cell.
      - |
        0.36 V is 0.80 − 0.44, which ignores the negative sign of the iron potential.
      - |
        2.04 V doubles the silver potential as if the coefficient 2 scaled it; potentials are not multiplied by coefficients.
      - |
        The voltage is right, but the anode (iron) is the negative terminal of a voltaic cell; the cathode (silver) is positive.
    answer: 0
    explanation: |
      E°cell = E°(cathode) − E°(anode) = 0.80 − (−0.44) = 1.24 V. In a voltaic cell the cathode is positive.

  # ---- Stimulus set B: fission in a reactor (8.5)
  - slug: chem-u08-exam-q04
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      In a water-cooled reactor, uranium-235 in the fuel rods absorbs a neutron and splits. One of many outcomes:

      ²³⁵U + ¹n → ¹⁴⁰Xe + ⁹⁴Sr + x ¹n + about 200 MeV

      Uranium has atomic number 92, xenon 54 and strontium 38.
    prompt: |
      The water surrounding the fuel rods acts as the moderator. What does it do?
    options:
      - "It absorbs neutrons so that the reaction cannot run away."
      - "It supplies the neutrons that trigger each fission."
      - "It slows the fast fission neutrons so that uranium-235 captures them readily."
      - "It converts the fission fragments into stable isotopes."
    option_explanations:
      - |
        Absorbing neutrons is the control rods' job (boron, cadmium); the moderator keeps neutrons in play.
      - |
        Neutrons come from the fissions themselves; water adds none.
      - |
        Correct. Fast neutrons are poorly captured by uranium-235; after collisions with hydrogen in water they slow to speeds at which fission is likely, sustaining the chain.
      - |
        Fission fragments decay on their own schedule; nothing in the reactor changes that.
    answer: 2
    explanation: |
      Moderator = neutron slower; control rods = neutron absorbers; coolant = heat carrier. In many reactors water does the first and third jobs.

  - slug: chem-u08-exam-q05
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      In a water-cooled reactor, uranium-235 in the fuel rods absorbs a neutron and splits. One of many outcomes:

      ²³⁵U + ¹n → ¹⁴⁰Xe + ⁹⁴Sr + x ¹n + about 200 MeV

      Uranium has atomic number 92, xenon 54 and strontium 38.
    prompt: |
      How many neutrons, x, are released?
    options:
      - "1"
      - "2"
      - "3"
      - "4"
    option_explanations:
      - |
        One neutron would make the right side 235, short of the 236 on the left.
      - |
        Correct. 235 + 1 = 236; 140 + 94 = 234; so x = 2. Atomic numbers: 92 = 54 + 38.
      - |
        Three neutrons would give 237 on the right against 236 on the left.
      - |
        Four would give 238; mass number must balance exactly.
    answer: 1
    explanation: |
      Balance mass numbers: 236 − 234 = 2 neutrons. Atomic numbers already balance (92 = 54 + 38) since neutrons contribute zero.

  - slug: chem-u08-exam-q06
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      In a water-cooled reactor, uranium-235 in the fuel rods absorbs a neutron and splits. One of many outcomes:

      ²³⁵U + ¹n → ¹⁴⁰Xe + ⁹⁴Sr + x ¹n + about 200 MeV

      Uranium has atomic number 92, xenon 54 and strontium 38.
    prompt: |
      Where does the 200 MeV come from?
    options:
      - "From the chemical bonds between uranium atoms in the fuel pellet"
      - "From the kinetic energy of the incoming neutron"
      - "From the electrons stripped off the uranium atom"
      - "From a decrease in mass: the products are lighter than the reactants, and the difference appears as energy by E = mc²"
    option_explanations:
      - |
        Chemical bonds hold a few electronvolts each, a hundred million times too little; the energy is nuclear.
      - |
        A slow neutron carries a tiny fraction of an electronvolt; it triggers the split but does not supply the energy.
      - |
        Electrons are not involved in the nuclear change; the energy comes from the nucleons' binding.
      - |
        Correct. The fragments are more tightly bound per nucleon than uranium, so their total mass is less; the mass defect of about 0.2 u is released as about 200 MeV.
    answer: 3
    explanation: |
      Nuclear energy is converted mass. The products sit higher on the binding-energy-per-nucleon curve than uranium, so mass is lost and energy released.

  # ---- Singles
  - slug: chem-u08-exam-q07
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the oxidation number of sulfur in the sulfate ion, SO₄²⁻?
    options:
      - "+2"
      - "−2"
      - "+6"
      - "+8"
    option_explanations:
      - |
        +2 would make the ion's total charge −6 (2 − 8), not −2.
      - |
        −2 is the charge on the whole ion, not sulfur's oxidation number.
      - |
        Correct. Four oxygens contribute −8; for the total to be −2, sulfur must be +6.
      - |
        +8 would give a total of 0, making the ion neutral; it carries a 2− charge.
    answer: 2
    explanation: |
      S + 4(−2) = −2, so S = +6. Sulfur is +6 in sulfate, sulfuric acid and sulfur trioxide.

  - slug: chem-u08-exam-q08
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of these reactions is a redox reaction?
    options:
      - "Fe₂O₃ + 3CO → 2Fe + 3CO₂"
      - "BaCl₂ + Na₂SO₄ → BaSO₄ + 2NaCl"
      - "H₂SO₄ + 2KOH → K₂SO₄ + 2H₂O"
      - "CaCO₃ → CaO + CO₂"
    option_explanations:
      - |
        Correct. Iron goes from +3 to 0 (reduced) and carbon from +2 to +4 (oxidised); this is the blast-furnace reaction.
      - |
        A precipitation: Ba stays +2, S +6, O −2, Na +1, Cl −1; partners swap with no electron transfer.
      - |
        A neutralisation: no oxidation number changes.
      - |
        Decomposition of a carbonate: Ca +2, C +4, O −2 on both sides; a decomposition is redox only if a free element appears.
    answer: 0
    explanation: |
      Check for a change in oxidation number. Only the iron oxide reduction has one; the others rearrange ions without electron transfer.

  - slug: chem-u08-exam-q09
    type: multiple_choice
    topic_code: "8.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which is the correctly balanced half-reaction for dichromate being reduced to chromium(III) in acidic solution?
    options:
      - "Cr₂O₇²⁻ + 6e⁻ → 2Cr³⁺ + 7O²⁻"
      - "Cr₂O₇²⁻ + 7H⁺ + 3e⁻ → 2Cr³⁺ + 7H₂O"
      - "Cr₂O₇²⁻ + 14H⁺ → 2Cr³⁺ + 7H₂O + 6e⁻"
      - "Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O"
    option_explanations:
      - |
        Oxide ions do not exist free in acidic solution; oxygen is balanced with water and hydrogen ions.
      - |
        Hydrogen does not balance (7 against 14) and the charge does not either (+2 against +6).
      - |
        Electrons are on the product side, which would make this an oxidation; dichromate is being reduced.
      - |
        Correct. Seven waters balance oxygen, fourteen H⁺ balance hydrogen, and six electrons balance the charge (−2 + 14 − 6 = +6 = 2 × +3); each Cr goes +6 → +3.
    answer: 3
    explanation: |
      The four steps: balance Cr (2), add 7H₂O for O, add 14H⁺ for H, add 6e⁻ to the left for charge. Two chromiums each gain three electrons.

  - slug: chem-u08-exam-q10
    type: multiple_choice
    topic_code: "8.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Aluminium reduces silver ions: Al → Al³⁺ + 3e⁻ and Ag⁺ + e⁻ → Ag. What is the balanced net ionic equation?
    options:
      - "Al + Ag⁺ → Al³⁺ + Ag"
      - "Al + 3Ag⁺ → Al³⁺ + 3Ag"
      - "3Al + Ag⁺ → 3Al³⁺ + Ag"
      - "2Al + 3Ag⁺ → 2Al³⁺ + 3Ag"
    option_explanations:
      - |
        Charge is +1 on the left and +3 on the right; three electrons from aluminium need three silver ions.
      - |
        Correct. Multiply the silver half by 3 so three electrons are gained; charge is +3 on both sides.
      - |
        Three aluminiums release nine electrons while one silver ion takes one; nothing balances.
      - |
        Six electrons released against three accepted; this ratio is for a 2+ ion such as Cu²⁺, not Ag⁺.
    answer: 1
    explanation: |
      Equalise the electrons at three: one Al gives three, three Ag⁺ take three. Check charge: +3 = +3.

  - slug: chem-u08-exam-q11
    type: multiple_choice
    topic_code: "8.3"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the role of the salt bridge in a voltaic cell?
    options:
      - "It allows ions to move between the half-cells, keeping each solution electrically neutral and completing the circuit."
      - "It carries electrons from the anode to the cathode."
      - "It supplies the metal ions that are reduced at the cathode."
      - "It prevents any ions from moving between the two solutions."
    option_explanations:
      - |
        Correct. Anions drift toward the anode and cations toward the cathode, balancing the charges created as the electrodes react; without it the current stops.
      - |
        Electrons travel only through the external wire; the bridge carries ions.
      - |
        The bridge holds an inert salt such as KNO₃; the reducing ions come from the cathode's own solution.
      - |
        The opposite: the bridge exists precisely to let ions move while keeping the solutions from mixing.
    answer: 0
    explanation: |
      Salt bridge: ion path and charge balance. Wire: electron path. Both are needed for a current.

  - slug: chem-u08-exam-q12
    type: multiple_choice
    topic_code: "8.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Why do lithium-ion batteries give a higher voltage and more energy per kilogram than lead-acid batteries?
    options:
      - "Lithium is a stronger oxidising agent than lead."
      - "Lithium batteries contain more sulfuric acid."
      - "Lithium has one of the most negative reduction potentials (−3.04 V) and a very small atomic mass."
      - "Lithium batteries are not rechargeable, so they store more energy."
    option_explanations:
      - |
        Lithium is a powerful reducing agent, not an oxidising agent; it gives up its electron readily.
      - |
        Lithium reacts violently with water; lithium-ion cells use a non-aqueous electrolyte and no acid.
      - |
        Correct. The very negative potential gives a large cell voltage (about 3.7 V), and the light atoms mean many moles of electrons per kilogram.
      - |
        Lithium-ion batteries are rechargeable; that is their main use.
    answer: 2
    explanation: |
      Voltage depends on the gap in reduction potentials; energy per mass favours light elements. Lithium wins on both.

  - slug: chem-u08-exam-q13
    type: multiple_choice
    topic_code: "8.4"
    source: "general knowledge"
    points: 1
    prompt: |
      In an electrolytic cell, which statement is correct?
    options:
      - "Reduction occurs at the anode."
      - "The cell produces electrical energy from a spontaneous reaction."
      - "The anode is negative, as in a voltaic cell."
      - "An external power supply drives a non-spontaneous reaction; the anode is positive and the cathode negative."
    option_explanations:
      - |
        Oxidation is at the anode in every cell, voltaic or electrolytic.
      - |
        That describes a voltaic cell; an electrolytic cell consumes electrical energy.
      - |
        The signs reverse in electrolysis: the supply pulls electrons from the anode, making it positive.
      - |
        Correct. The supply forces electrons into the cathode (negative, reduction) and out of the anode (positive, oxidation).
    answer: 3
    explanation: |
      Same processes at the same-named electrodes, opposite signs, energy consumed rather than produced.

  - slug: chem-u08-exam-q14
    type: multiple_choice
    topic_code: "8.4"
    source: "general knowledge"
    points: 1
    prompt: |
      To copper-plate an iron nail, how should the cell be arranged?
    options:
      - "Nail as anode, copper strip as cathode, in copper(II) sulfate solution"
      - "Nail as cathode, copper strip as anode, in copper(II) sulfate solution"
      - "Nail as cathode, iron strip as anode, in sodium chloride solution"
      - "Nail as anode, copper strip as cathode, in sulfuric acid"
    option_explanations:
      - |
        A nail made the anode would dissolve rather than gain copper; metal deposits at the cathode.
      - |
        Correct. Cu²⁺ + 2e⁻ → Cu at the nail; the copper anode dissolves (Cu → Cu²⁺ + 2e⁻) and keeps the solution's Cu²⁺ constant.
      - |
        The solution must contain copper ions to deposit copper; sodium chloride has none.
      - |
        The nail must be the cathode, and the electrolyte must supply Cu²⁺ ions.
    answer: 1
    explanation: |
      Electroplating rule: object = cathode, plating metal = anode, electrolyte = that metal's ions.

  - slug: chem-u08-exam-q15
    type: multiple_choice
    topic_code: "8.4"
    source: "general knowledge"
    points: 1
    prompt: |
      The same quantity of charge is passed through a silver nitrate solution and an aluminium salt melt. How do the moles of metal deposited compare?
    options:
      - "Three times as many moles of silver as of aluminium, because Ag⁺ needs one electron and Al³⁺ needs three."
      - "Equal moles, because the charge is the same."
      - "Three times as many moles of aluminium as of silver."
      - "It depends on the current, not the charge."
    option_explanations:
      - |
        Correct. Moles of metal = moles of electrons ÷ electrons per ion; one electron per silver, three per aluminium.
      - |
        Equal charge means equal moles of electrons, but each aluminium ion consumes three of them.
      - |
        This is reversed; aluminium needs more electrons per atom, so fewer atoms are deposited.
      - |
        Current and time together fix the charge; the charge, with the ion's charge, fixes the moles.
    answer: 0
    explanation: |
      Faraday: moles of metal = Q ÷ (96,485 × n), with n the electrons per ion. Silver (n = 1) gets three times the moles of aluminium (n = 3).

  - slug: chem-u08-exam-q16
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Why does a small lump of uranium-235 not sustain a chain reaction, while a larger one of the same purity does?
    options:
      - "Small lumps are too cold for fission to occur."
      - "Small lumps contain no neutrons."
      - "In a small lump too many neutrons escape through the surface before causing another fission; above the critical mass enough are captured."
      - "Large lumps have a different isotope composition."
    option_explanations:
      - |
        Fission is triggered by neutron capture and is independent of temperature.
      - |
        Fissions release neutrons in any lump; the issue is whether they find another nucleus before escaping.
      - |
        Correct. Surface area grows more slowly than volume, so a bigger lump keeps a larger fraction of its neutrons inside; critical mass is where exactly one neutron per fission goes on to cause another.
      - |
        The purity is the same by assumption; size alone decides neutron escape.
    answer: 2
    explanation: |
      Critical mass is a matter of neutron economy: enough material that neutrons meet nuclei before leaving.

  - slug: chem-u08-exam-q17
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which comparison of fission and fusion is correct?
    options:
      - "Fission releases more energy per nucleon because uranium nuclei are larger."
      - "Fusion is used in commercial power plants; fission is still experimental."
      - "Both require a critical mass of fuel."
      - "Fusion releases more energy per nucleon, because light nuclei sit on the steep part of the binding-energy curve far below helium."
    option_explanations:
      - |
        Per nucleon, fission yields about 0.9 MeV and D–T fusion about 3.5 MeV; size does not favour fission.
      - |
        The reverse: fission plants have run since the 1950s; fusion has not yet produced net power.
      - |
        Critical mass applies to fission chain reactions only; fusion needs temperature and confinement, not a minimum mass.
      - |
        Correct. The binding-energy-per-nucleon curve rises steeply from hydrogen to helium, so fusing light nuclei moves nucleons far up it.
    answer: 3
    explanation: |
      Energy per nucleon follows the binding-energy curve: steep for light nuclei (fusion), shallow for heavy ones (fission).

  - slug: chem-u08-exam-q18
    type: multiple_choice
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the molecular formula of the alkene with five carbon atoms?
    options:
      - "C₅H₁₂"
      - "C₅H₁₀"
      - "C₅H₈"
      - "C₅H₁₄"
    option_explanations:
      - |
        C₅H₁₂ fits CₙH₂ₙ₊₂, which is the alkane pentane, with no double bond.
      - |
        Correct. Alkenes are CₙH₂ₙ: pentene, C₅H₁₀, with one C=C double bond.
      - |
        C₅H₈ fits CₙH₂ₙ₋₂, which is the alkyne pentyne, with a triple bond.
      - |
        Fourteen hydrogens exceed what five carbons can bond to; no such hydrocarbon exists.
    answer: 1
    explanation: |
      Alkane CₙH₂ₙ₊₂, alkene CₙH₂ₙ, alkyne CₙH₂ₙ₋₂: each multiple bond removes two hydrogens.

  - slug: chem-u08-exam-q19
    type: multiple_choice
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Butane and 2-methylpropane are structural isomers. What does that mean?
    options:
      - "They have the same molecular formula, C₄H₁₀, but different arrangements of their atoms."
      - "They have the same structure but different molecular formulas."
      - "They are the same compound drawn two ways."
      - "They differ by one carbon atom in the chain."
    option_explanations:
      - |
        Correct. Both are C₄H₁₀; butane is a straight chain and 2-methylpropane is branched, and they have different boiling points.
      - |
        Isomers share the formula; it is the structure that differs.
      - |
        They are different substances with different properties, not two drawings of one.
      - |
        Both have four carbons; one chain is straight and the other branched.
    answer: 0
    explanation: |
      Structural isomers: same formula, different connectivity, different compounds.

  - slug: chem-u08-exam-q20
    type: multiple_choice
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Bromine water is shaken with an unknown liquid hydrocarbon and the orange colour disappears. What can be concluded?
    options:
      - "The hydrocarbon is an alkane."
      - "The hydrocarbon has been burned."
      - "The hydrocarbon is unsaturated, with a C=C or C≡C bond that bromine added across."
      - "The hydrocarbon is a polymer."
    option_explanations:
      - |
        Alkanes do not react with bromine water at room temperature; the colour would remain.
      - |
        No combustion occurs; the colour change is an addition reaction.
      - |
        Correct. Decolourising bromine water is the standard test for unsaturation; the bromine atoms add across the multiple bond.
      - |
        Addition polymers are saturated and do not decolourise bromine water.
    answer: 2
    explanation: |
      Bromine water test: colourless means unsaturated (alkene or alkyne); still orange means saturated.

  - slug: chem-u08-exam-q21
    type: multiple_choice
    topic_code: "8.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which functional group is present in CH₃CH₂COOH, and to what family does the compound belong?
    options:
      - "−OH; alcohol"
      - "−NH₂; amine"
      - "−COO−; ester"
      - "−COOH; carboxylic acid"
    option_explanations:
      - |
        An alcohol has −OH attached to a carbon with no doubly bonded oxygen; here the OH is part of a −COOH group.
      - |
        There is no nitrogen in the formula, so it cannot contain an amine group.
      - |
        An ester has a carbon chain on both sides of −COO−; here the group ends in hydrogen.
      - |
        Correct. The terminal −COOH makes this propanoic acid, a weak carboxylic acid.
    answer: 3
    explanation: |
      −COOH defines carboxylic acids (names ending -oic acid). With three carbons this is propanoic acid.

  - slug: chem-u08-exam-q22
    type: multiple_choice
    topic_code: "8.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement correctly distinguishes addition from condensation polymerisation?
    options:
      - "Addition polymerisation needs monomers with two functional groups; condensation needs a double bond."
      - "Addition polymerisation opens C=C bonds and loses no atoms; condensation joins monomers with the loss of a small molecule such as water."
      - "Addition polymers are always biodegradable; condensation polymers never are."
      - "Only condensation polymerisation produces long chains."
    option_explanations:
      - |
        This is reversed: double bonds are needed for addition, two-ended functional groups for condensation.
      - |
        Correct. Polyethene forms by addition (formula n × C₂H₄); polyesters and nylon form by condensation with water released at every link.
      - |
        Polyethene (addition) persists for centuries; PLA (condensation polyester) biodegrades; the pattern is the other way if anything.
      - |
        Both routes produce chains of thousands of units.
    answer: 1
    explanation: |
      Addition: C=C opens, nothing lost. Condensation: two reactive ends join, water lost. The mass test distinguishes them.

  - slug: chem-u08-exam-q23
    type: multiple_choice
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Strontium-90, a fission product, undergoes beta decay. What is the product nucleus? (Strontium has atomic number 38.)
    options:
      - "Rubidium-90 (Z = 37)"
      - "Strontium-89 (Z = 38)"
      - "Yttrium-90 (Z = 39)"
      - "Krypton-86 (Z = 36)"
    option_explanations:
      - |
        A decrease in Z describes positron emission or electron capture, not ordinary beta decay.
      - |
        Beta decay does not change the mass number; a neutron becomes a proton.
      - |
        Correct. Review of 2.4: in beta decay a neutron turns into a proton and an electron is emitted, so Z rises by one and A is unchanged: ⁹⁰Sr → ⁹⁰Y + e⁻.
      - |
        A drop of 4 in A and 2 in Z would be alpha decay.
    answer: 2
    explanation: |
      Review of 2.4: beta decay: A unchanged, Z + 1. The emitted electron is what makes fission products hazardous for decades.

  - slug: chem-u08-exam-q24
    type: multiple_choice
    topic_code: "4.3"
    source: "general knowledge"
    points: 1
    prompt: |
      The activity series lists Mg above Zn above Cu above Ag. Which prediction follows?
    options:
      - "Zinc metal will reduce Cu²⁺ ions, depositing copper."
      - "Copper metal will reduce Zn²⁺ ions, depositing zinc."
      - "Silver metal will displace magnesium from Mg²⁺ solution."
      - "No metal in the list can reduce Ag⁺."
    option_explanations:
      - |
        Correct. Review of 4.3: a metal higher in the series gives electrons to the ions of any metal below it; zinc is above copper, so Zn + Cu²⁺ → Zn²⁺ + Cu, the reaction of the zinc–copper cell.
      - |
        Copper is below zinc and cannot reduce its ions; the reverse happens.
      - |
        Silver is at the bottom; it reduces nothing above it.
      - |
        Every metal above silver (all three) reduces Ag⁺.
    answer: 0
    explanation: |
      Review of 4.3: the activity series is the reduction-potential table in words. Higher = stronger reducing agent.

  # ---- Multi-select
  - slug: chem-u08-exam-q25
    type: multi_select
    topic_code: "8.1"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which statements about redox reactions are correct? Select all that apply.
    options:
      - "The oxidising agent gains electrons."
      - "Oxidation and reduction can occur separately in different reactions."
      - "In 2Na + Cl₂ → 2NaCl, sodium is the reducing agent."
      - "An element in its free state has an oxidation number of 0."
      - "Oxygen's oxidation number is −1 in hydrogen peroxide."
      - "A precipitation reaction is a redox reaction because ions are involved."
    option_explanations:
      - |
        Correct. The oxidising agent takes the electrons and is itself reduced.
      - |
        Electrons must go somewhere; every oxidation is paired with a reduction in the same reaction.
      - |
        Correct. Sodium loses electrons (0 → +1), so it is oxidised and is the reducing agent.
      - |
        Correct. Na, Cl₂, O₂, Fe: all 0 as elements.
      - |
        Correct. The peroxide exception: two oxygens share −2, so each is −1.
      - |
        Ions swapping partners involves no change in oxidation number; precipitation is never redox.
    answer: [0, 2, 3, 4]
    explanation: |
      Redox requires a change in oxidation number, with oxidation and reduction always paired. Precipitation and neutralisation are not redox.

  - slug: chem-u08-exam-q26
    type: multi_select
    topic_code: "8.3"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which statements about electrochemical cells are correct? Select all that apply.
    options:
      - "In a voltaic cell, the electrode with the lower reduction potential is the anode."
      - "Electrons flow through the external wire from anode to cathode in a voltaic cell."
      - "A catalyst in the salt bridge increases the cell voltage."
      - "In electrolysis, cations are reduced at the cathode."
      - "Doubling the coefficients of the cell reaction doubles E°cell."
      - "A rechargeable battery is a voltaic cell on discharge and an electrolytic cell on recharge."
    option_explanations:
      - |
        Correct. The half-cell less able to attract electrons is oxidised.
      - |
        Correct. Electrons leave the negative anode and arrive at the positive cathode.
      - |
        Voltage depends on the two half-reactions' potentials; the bridge only carries ions.
      - |
        Correct. Positive ions migrate to the negative cathode and gain electrons.
      - |
        Potentials are intensive; coefficients change the amount reacting, not the voltage.
      - |
        Correct. Discharge runs the spontaneous reaction; the charger forces it backwards.
    answer: [0, 1, 3, 5]
    explanation: |
      The two false statements are the two classic errors: scaling E° by coefficients and giving the salt bridge a role in voltage.

  - slug: chem-u08-exam-q27
    type: multi_select
    topic_code: "8.6"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which statements about hydrocarbons and organic compounds are correct? Select all that apply.
    options:
      - "Alkanes are saturated hydrocarbons with the general formula CₙH₂ₙ₊₂."
      - "The boiling points of straight-chain alkanes decrease as the chain lengthens."
      - "Incomplete combustion of a hydrocarbon can produce carbon monoxide."
      - "Cracking converts long alkanes into shorter alkanes and alkenes."
      - "Ethanol and ethanoic acid contain the same functional group."
      - "Crude oil is separated by fractional distillation according to boiling point."
    option_explanations:
      - |
        Correct. Only single bonds, maximum hydrogen.
      - |
        Boiling points increase with chain length because dispersion forces grow with molecular size.
      - |
        Correct. Limited oxygen gives CO and soot instead of CO₂, with a yellow smoky flame.
      - |
        Correct. Heat and a catalyst break C–C bonds, supplying petrol-range alkanes and ethene for plastics.
      - |
        Ethanol has −OH (alcohol); ethanoic acid has −COOH (carboxylic acid); the acid is the oxidation product of the alcohol.
      - |
        Correct. Each fraction condenses at the height in the column where the temperature matches its boiling range.
    answer: [0, 2, 3, 5]
    explanation: |
      The boiling-point trend and the distinction between −OH and −COOH are the points most often confused.

  # ---- True/false
  - slug: chem-u08-exam-q28
    type: true_false
    topic_code: "8.3"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: in a voltaic cell the anode is the negative electrode, because the electrons released by oxidation leave from it into the external circuit.
    answer: true
    explanation: |
      True. Oxidation at the anode releases electrons, which flow out through the wire; that makes the anode the negative terminal. In an electrolytic cell the power supply reverses the signs, but the anode is still where oxidation occurs.

  - slug: chem-u08-exam-q29
    type: true_false
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: a nuclear power reactor can explode like a nuclear bomb if its control rods fail.
    answer: false
    explanation: |
      False. Reactor fuel is only 3 to 5 percent uranium-235; a weapon needs about 90 percent assembled into a supercritical mass in a microsecond. A reactor that loses control can overheat and melt its core, a serious accident, but not a nuclear explosion.

  - slug: chem-u08-exam-q30
    type: true_false
    topic_code: "8.7"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: polyethene contains no carbon–carbon double bonds, even though it is made from ethene, which has one.
    answer: true
    explanation: |
      True. In addition polymerisation each ethene's double bond opens to form the single bonds that link the chain; the product is a saturated chain of −CH₂−CH₂− units, which is why polyethene is so unreactive.

