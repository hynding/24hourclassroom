        A 3.27 g strip of zinc dissolves completely in excess copper(II) sulfate solution according to Zn + Cu²⁺ → Zn²⁺ + Cu. What mass of copper is deposited? Use molar masses Zn 65.38 and Cu 63.55 g/mol, and give your answer in grams to two decimal places.
      answer: { value: 3.18, tolerance: 0.02 }
