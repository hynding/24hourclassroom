week: 29
unit: 8
title: "Oxidation Numbers and Redox Reactions"
topics: ["8.1", "8.2"]
guide: guides/week-29.md
guide_description: |
  Oxidation and reduction as electron loss and gain, the rules for assigning oxidation numbers with worked
  cases (sulfate, dichromate, permanganate, peroxide), spotting redox by changes in oxidation number, naming the
  oxidising and reducing agents, writing half-reactions, balancing half-reactions in acidic solution with water
  and hydrogen ions, combining them so electrons cancel, checking atoms and charge, and counting moles of
  electrons.
flashcards_description: |
  28 cards on OIL RIG, each oxidation-number rule, worked oxidation numbers, redox versus non-redox reaction
  types, oxidising and reducing agents, half-reactions, the acid-solution balancing steps and electron counting.

flashcards:
  - front: Oxidation → definition in terms of electrons and oxidation number
    back: |
      Loss of electrons; the oxidation number increases. Zn → Zn²⁺ + 2e⁻ is an oxidation. OIL: Oxidation Is Loss.
    topic_code: "8.1"
  - front: Reduction → definition in terms of electrons and oxidation number
    back: |
      Gain of electrons; the oxidation number decreases. Cu²⁺ + 2e⁻ → Cu is a reduction. RIG: Reduction Is Gain.
    topic_code: "8.1"
  - front: Why oxidation and reduction always occur together
    back: |
      Electrons cannot accumulate or vanish; every electron lost by one species is gained by another. The combined process is a redox reaction.
    topic_code: "8.1"
  - front: Oxidation number → what it is and is not
    back: |
      A bookkeeping charge assigned as if every bond were ionic, with shared electrons given to the more electronegative atom. Real for monatomic ions; formal for atoms in molecules. A change signals electron transfer.
    topic_code: "8.1"
  - front: Oxidation number rule for pure elements and monatomic ions
    back: |
      A pure element is 0 (Fe, O₂, S₈, Cl₂). A monatomic ion has its charge (Na⁺ +1, Cl⁻ −1, Al³⁺ +3).
    topic_code: "8.1"
  - front: Oxidation number rules for group 1, group 2 and aluminium in compounds
    back: |
      Group 1 metals +1, group 2 metals +2, aluminium +3, always.
    topic_code: "8.1"
  - front: Oxidation number of hydrogen in compounds, with the exception
    back: |
      +1 with nonmetals (HCl, H₂O, CH₄). −1 in metal hydrides such as NaH and CaH₂, where the metal is more electropositive.
    topic_code: "8.1"
  - front: Oxidation number of oxygen in compounds, with the exceptions
    back: |
      −2 almost always. −1 in peroxides (H₂O₂, Na₂O₂). Positive only when bonded to fluorine (OF₂). Fluorine is always −1.
    topic_code: "8.1"
  - front: The sum rule for oxidation numbers
    back: |
      The oxidation numbers add to the total charge: 0 for a neutral compound, the ion's charge for a polyatomic ion. Use it to find the one unknown.
    topic_code: "8.1"
  - front: Oxidation number of S in H₂SO₄ and SO₄²⁻
    back: |
      +6 in both. H₂SO₄: +2 + S − 8 = 0. SO₄²⁻: S − 8 = −2.
    topic_code: "8.1"
  - front: Oxidation number of Mn in MnO₄⁻ and Cr in Cr₂O₇²⁻
    back: |
      Mn: −1 + 8 = +7. Cr: 2Cr − 14 = −2, so each Cr is +6. Both are strong oxidising agents because these high numbers want to fall.
    topic_code: "8.1"
  - front: Oxidation number of N in HNO₃, NO₂, NO and NH₃
    back: |
      HNO₃ +5; NO₂ +4; NO +2; NH₃ −3. Nitrogen spans −3 to +5, which is why it has so many oxides.
    topic_code: "8.1"
  - front: Oxidation number of C in CH₄, C, CO and CO₂
    back: |
      CH₄ −4; C 0; CO +2; CO₂ +4. Combustion of a hydrocarbon raises carbon's number: carbon is oxidised.
    topic_code: "8.1"
  - front: How to tell whether a reaction is redox
    back: |
      Assign oxidation numbers to every atom on both sides. If any number changed, electrons moved and it is redox; if nothing changed, it is not.
    topic_code: "8.1"
  - front: Reaction types from unit 4 that are always redox, and those that never are
    back: |
      Always: single replacement, combustion, synthesis or decomposition involving a free element. Never: double replacement (precipitation) and acid–base neutralisation.
    topic_code: "8.1"
  - front: Oxidising agent → definition and example
    back: |
      The species that accepts electrons and is itself reduced. In Zn + Cu²⁺, Cu²⁺ is the oxidising agent. Name the whole species (MnO₄⁻, not Mn).
    topic_code: "8.1"
  - front: Reducing agent → definition and example
    back: |
      The species that donates electrons and is itself oxidised. In Zn + Cu²⁺, zinc metal is the reducing agent. Active metals are good reducing agents.
    topic_code: "8.1"
  - front: Oxidation numbers in 2KClO₃ → 2KCl + 3O₂
    back: |
      Cl goes +5 → −1 (reduced); O goes −2 → 0 (oxidised). Both changes occur within KClO₃, which is therefore both the oxidising and the reducing agent.
    topic_code: "8.1"
  - front: Half-reaction → definition
    back: |
      One half of a redox reaction, oxidation or reduction, written with its electrons shown: Zn → Zn²⁺ + 2e⁻ (oxidation, electrons on the right); Cu²⁺ + 2e⁻ → Cu (reduction, electrons on the left).
    topic_code: "8.2"
  - front: Combining half-reactions when the electron counts differ
    back: |
      Multiply each half by whatever makes the electrons equal, then add so they cancel. Al → Al³⁺ + 3e⁻ (×2) and Cu²⁺ + 2e⁻ → Cu (×3) give 2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu.
    topic_code: "8.2"
  - front: Four steps to balance a half-reaction in acidic solution
    back: |
      1. Balance all elements except O and H. 2. Add H₂O to balance O. 3. Add H⁺ to the other side to balance H. 4. Add electrons to the more positive side to balance charge.
    topic_code: "8.2"
  - front: Permanganate half-reaction in acid
    back: |
      MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O. Mn goes +7 → +2, five electrons gained. Purple to colourless, so it is its own indicator.
    topic_code: "8.2"
  - front: Dichromate half-reaction in acid
    back: |
      Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O. Each Cr goes +6 → +3; two Cr, so six electrons. Orange to green.
    topic_code: "8.2"
  - front: Permanganate and iron(II) overall equation
    back: |
      MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 4H₂O + 5Fe³⁺. Charge check: +17 on both sides. The basis of a redox titration for iron.
    topic_code: "8.2"
  - front: Copper and nitrate in acid, balanced
    back: |
      Cu + 2NO₃⁻ + 4H⁺ → Cu²⁺ + 2NO₂ + 2H₂O, from Cu → Cu²⁺ + 2e⁻ and 2 × (NO₃⁻ + 2H⁺ + e⁻ → NO₂ + H₂O). The brown gas is NO₂.
    topic_code: "8.2"
  - front: Two checks on a balanced redox equation
    back: |
      Every element balances, and the total charge on the left equals the total charge on the right. A redox equation that balances atoms but not charge is wrong.
    topic_code: "8.2"
  - front: Moles of electrons from a half-reaction
    back: |
      Multiply the moles of the species by the electrons per formula unit in its half-reaction: 0.600 mol Al → Al³⁺ releases 1.80 mol e⁻; 0.500 mol Fe³⁺ → Fe needs 1.50 mol e⁻.
    topic_code: "8.2"
  - front: Mass of copper deposited by 3.27 g of zinc in Cu²⁺ solution
    back: |
      3.27 g ÷ 65.38 g/mol = 0.0500 mol Zn; the equation is 1:1 (both two-electron changes), so 0.0500 mol Cu × 63.55 g/mol = 3.18 g.
    topic_code: "8.2"

quiz:
  description: |
    23 questions · about 40 minutes · topics 8.1 and 8.2 (oxidation numbers, identifying redox reactions and
    their agents, half-reactions, balancing in acidic solution, counting electrons), with review of ions (3.1),
    polyatomic ions (3.2), subatomic particles (2.2), periodic trends (2.8), reaction types and the activity
    series (4.2, 4.3) and stoichiometry (4.6). Multiple choice, select-all, true/false and numeric items are graded
    at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded
    by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: zinc in copper(II) sulfate (8.1, 8.2)
    - slug: chem-u08-w29-q01
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        A strip of zinc is placed in blue copper(II) sulfate solution. Over an hour the blue colour fades, the zinc strip becomes thinner, and a brown-red deposit builds up on it. The net ionic equation is

        Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)
      prompt: |
        Which species is oxidised, and what is the evidence?
      options:
        - "Cu²⁺ is oxidised; the evidence is the fading blue colour."
        - "Zn is oxidised; its oxidation number rises from 0 to +2 as the strip dissolves into Zn²⁺ ions."
        - "Cu is oxidised; the evidence is the brown-red deposit."
        - "Sulfate is oxidised; it carries the charge between the two metals."
      option_explanations:
        - |
          Cu²⁺ goes from +2 to 0, a decrease: it is reduced, which is why the blue colour of Cu²⁺ fades.
        - |
          Correct. Zinc atoms lose two electrons each and enter the solution as Zn²⁺; a rise in oxidation number is oxidation.
        - |
          Copper metal is the product of reduction, deposited as Cu²⁺ gains electrons.
        - |
          Sulfate is a spectator ion; its oxidation numbers (S +6, O −2) do not change.
      answer: 1
      explanation: |
        Oxidation is loss of electrons and a rise in oxidation number. Zinc, 0 → +2, is oxidised; the thinning strip is the visible evidence.

    - slug: chem-u08-w29-q02
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        A strip of zinc is placed in blue copper(II) sulfate solution. Over an hour the blue colour fades, the zinc strip becomes thinner, and a brown-red deposit builds up on it. The net ionic equation is

        Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)
      prompt: |
        Which species is the oxidising agent?
      options:
        - "Zn(s), because it causes the copper to be deposited"
        - "Zn²⁺(aq), because it is the oxidised form of zinc"
        - "Cu(s), because copper is a less active metal"
        - "Cu²⁺(aq), because it accepts the electrons and is itself reduced"
      option_explanations:
        - |
          Zinc gives up electrons; a species that donates electrons is the reducing agent.
        - |
          Zn²⁺ is a product; the agents are the reactants that exchange electrons.
        - |
          Copper metal is produced by the reaction and takes no electrons from anything.
        - |
          Correct. The oxidising agent takes the electrons and is reduced; Cu²⁺ takes two electrons from zinc and becomes copper metal.
      answer: 3
      explanation: |
        The oxidising agent is reduced. Cu²⁺ (+2 → 0) gains electrons, so it is the oxidising agent; Zn is the reducing agent.

    - slug: chem-u08-w29-q03
      type: multiple_choice
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        A strip of zinc is placed in blue copper(II) sulfate solution. Over an hour the blue colour fades, the zinc strip becomes thinner, and a brown-red deposit builds up on it. The net ionic equation is

        Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)
      prompt: |
        Which pair of half-reactions correctly describes the process?
      options:
        - "Zn → Zn²⁺ + 2e⁻ and Cu²⁺ + 2e⁻ → Cu"
        - "Zn + 2e⁻ → Zn²⁺ and Cu²⁺ → Cu + 2e⁻"
        - "Zn → Zn²⁺ + e⁻ and Cu²⁺ + e⁻ → Cu"
        - "Zn²⁺ + 2e⁻ → Zn and Cu → Cu²⁺ + 2e⁻"
      option_explanations:
        - |
          Correct. Zinc loses two electrons (oxidation, electrons on the right) and the copper ion gains two (reduction, electrons on the left); the electron counts match and cancel.
        - |
          The electrons are on the wrong sides: a species forming a positive ion loses electrons, so they belong on the product side.
        - |
          The charges do not balance: Zn²⁺ carries a 2+ charge, so two electrons are involved in each half.
        - |
          These are the reverse half-reactions, describing copper dissolving and zinc depositing, which does not happen.
      answer: 0
      explanation: |
        Oxidation half: Zn → Zn²⁺ + 2e⁻. Reduction half: Cu²⁺ + 2e⁻ → Cu. Each balances in atoms and charge, and adding them cancels the electrons.

    # ---- Singles
    - slug: chem-u08-w29-q04
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        When a zinc atom becomes a Zn²⁺ ion, what happens to its electrons, and what is this change called?
      options:
        - "It gains two electrons; this is reduction."
        - "It gains two protons; this is ionisation."
        - "It loses two electrons; this is oxidation."
        - "It loses two protons; this is oxidation."
      option_explanations:
        - |
          A positive ion has fewer electrons than the neutral atom, so electrons were lost, and loss of electrons is oxidation.
        - |
          Chemical changes never alter the number of protons; the 2+ charge comes from losing two negative electrons.
        - |
          Correct. Review of 3.1: metal atoms form cations by losing their outer electrons; losing electrons is, by definition, oxidation.
        - |
          The nucleus is untouched in a chemical reaction; the charge arises from losing electrons, not protons.
      answer: 2
      explanation: |
        Review of 3.1: cations form by electron loss. Every cation-forming step is an oxidation, which is why active metals are reducing agents.

    - slug: chem-u08-w29-q05
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the oxidation number of chromium in the dichromate ion, Cr₂O₇²⁻?
      options:
        - "+12"
        - "+6"
        - "+7"
        - "+3"
      option_explanations:
        - |
          +12 is the total for both chromium atoms; the oxidation number is per atom, so divide by two.
        - |
          Correct. Seven oxygens contribute −14; the ion is −2, so the two chromiums total +12 and each is +6.
        - |
          +7 is manganese's number in permanganate; dichromate's oxygen count and charge give +6 for chromium.
        - |
          +3 is chromium's number in Cr³⁺, the product when dichromate is reduced, not in dichromate itself.
      answer: 1
      explanation: |
        2Cr + 7(−2) = −2, so 2Cr = +12 and Cr = +6. Dichromate is reduced to Cr³⁺ in redox titrations.

    - slug: chem-u08-w29-q06
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following is a redox reaction?
      options:
        - "AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)"
        - "HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)"
        - "NaCl(s) → Na⁺(aq) + Cl⁻(aq)"
        - "2Na(s) + Cl₂(g) → 2NaCl(s)"
      option_explanations:
        - |
          A precipitation: Ag stays +1, Cl stays −1, N and O are unchanged; ions simply change partners.
        - |
          A neutralisation: no oxidation number changes; H⁺ and OH⁻ combine without electron transfer.
        - |
          Dissolving separates ions that already exist in the crystal; Na is +1 and Cl is −1 before and after.
        - |
          Correct. Sodium goes 0 → +1 (oxidised) and chlorine 0 → −1 (reduced); electrons move from sodium atoms to chlorine atoms.
      answer: 3
      explanation: |
        A reaction is redox only if oxidation numbers change. Synthesis from elements always involves a change; precipitation, neutralisation and dissolving do not.

    - slug: chem-u08-w29-q07
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly pairs a process with its effect on electrons and oxidation number?
      options:
        - "Reduction: electrons gained, oxidation number decreases."
        - "Reduction: electrons lost, oxidation number decreases."
        - "Oxidation: electrons gained, oxidation number increases."
        - "Oxidation: electrons lost, oxidation number decreases."
      option_explanations:
        - |
          Correct. RIG: reduction is gain of electrons, and adding negative charge lowers the oxidation number.
        - |
          Reduction involves gaining electrons; losing electrons is oxidation.
        - |
          Oxidation is loss, not gain; gaining electrons lowers the oxidation number.
        - |
          Losing electrons is indeed oxidation, but removing negative charge raises the oxidation number, not lowers it.
      answer: 0
      explanation: |
        OIL RIG: Oxidation Is Loss (number rises), Reduction Is Gain (number falls).

    - slug: chem-u08-w29-q08
      type: multiple_choice
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the correctly balanced half-reaction for permanganate being reduced to manganese(II) in acidic solution?
      options:
        - "MnO₄⁻ + 5e⁻ → Mn²⁺ + 2O₂"
        - "MnO₄⁻ + 4H⁺ + 3e⁻ → Mn²⁺ + 2H₂O"
        - "MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O"
        - "MnO₄⁻ + 8H⁺ → Mn²⁺ + 4H₂O + 5e⁻"
      option_explanations:
        - |
          Oxygen in acidic solution is balanced with water, not released as O₂; the charges do not balance either (−6 against +2).
        - |
          Atoms are unbalanced: four oxygens need four waters, which need eight hydrogen ions; and the charge (+1 versus +2) does not balance.
        - |
          Correct. Mn balanced; 4H₂O balances oxygen; 8H⁺ balances hydrogen; charge left is −1 + 8 − 5 = +2, matching Mn²⁺. Mn goes +7 → +2, five electrons gained.
        - |
          The electrons are on the product side, which would make this an oxidation; permanganate is being reduced, so the electrons must be reactants.
      answer: 2
      explanation: |
        Follow the four steps: balance Mn, add H₂O for O, add H⁺ for H, add electrons to balance charge. The result gains five electrons, matching Mn's change from +7 to +2.

    - slug: chem-u08-w29-q09
      type: multiple_choice
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Aluminium metal reduces copper(II) ions. Using Al → Al³⁺ + 3e⁻ and Cu²⁺ + 2e⁻ → Cu, what is the balanced net ionic equation?
      options:
        - "Al + Cu²⁺ → Al³⁺ + Cu"
        - "2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu"
        - "3Al + 2Cu²⁺ → 3Al³⁺ + 2Cu"
        - "Al + 3Cu²⁺ → Al³⁺ + 3Cu"
      option_explanations:
        - |
          Charge does not balance: +2 on the left and +3 on the right; the electrons lost (3) and gained (2) are unequal.
        - |
          Correct. Multiply the aluminium half by 2 (6 electrons lost) and the copper half by 3 (6 electrons gained); the sum balances atoms and gives +6 charge on both sides.
        - |
          These coefficients are swapped: 3 Al would release 9 electrons while 2 Cu²⁺ accept only 4.
        - |
          Charge is +6 on the left and +3 on the right; one aluminium supplies only three electrons, enough for 1.5 copper ions.
      answer: 1
      explanation: |
        Equalise electrons at 6: 2Al give 6, 3Cu²⁺ take 6. Check charge: 3(+2) = +6 on the left, 2(+3) = +6 on the right.

    - slug: chem-u08-w29-q10
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Using the activity series (part of which reads: Mg > Al > Zn > Fe > H > Cu > Ag), which redox reaction will occur?
      options:
        - "Cu(s) + Zn²⁺(aq) → Cu²⁺(aq) + Zn(s)"
        - "Ag(s) + 2H⁺(aq) → Ag⁺(aq) + H₂(g)"
        - "Cu(s) + Fe²⁺(aq) → Cu²⁺(aq) + Fe(s)"
        - "Cu(s) + 2Ag⁺(aq) → Cu²⁺(aq) + 2Ag(s)"
      option_explanations:
        - |
          Copper is below zinc, so it cannot give electrons to Zn²⁺; the reverse reaction is the one that happens.
        - |
          Silver is below hydrogen in the series and does not displace hydrogen from acids.
        - |
          Copper is below iron, so Fe²⁺ cannot be reduced by copper metal.
        - |
          Correct. Review of 4.3: copper is above silver, so copper metal reduces Ag⁺ ions, coating itself with silver crystals while the solution turns blue.
      answer: 3
      explanation: |
        Review of 4.3: a metal reduces the ions of any metal below it in the activity series. The series is a ranking of reducing strength.

    - slug: chem-u08-w29-q11
      type: multiple_choice
      topic_code: "2.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Sodium and potassium are powerful reducing agents, while fluorine and chlorine are powerful oxidising agents. Which periodic trend explains this?
      options:
        - "Atomic radius increases across a period, making halogens larger."
        - "Group 1 metals have high electronegativity and the halogens have low electronegativity."
        - "Group 1 metals have low ionisation energies and give up electrons easily; halogens have high electronegativities and attract electrons strongly."
        - "All elements on the left of the table are gases, which lose electrons readily."
      option_explanations:
        - |
          Radius decreases across a period, and size alone does not decide electron transfer.
        - |
          The trend is the other way: electronegativity is lowest at the bottom left and highest at the top right.
        - |
          Correct. Review of 2.8: a low ionisation energy means an electron is easily removed (a reducing agent), and a high electronegativity means electrons are strongly attracted (an oxidising agent).
        - |
          Group 1 elements are solid metals; their reducing power comes from their low ionisation energies, not their state.
      answer: 2
      explanation: |
        Review of 2.8: ionisation energy and electronegativity decide who gives and who takes electrons. Redox agents are the periodic trends in action.

    # ---- Multi-select
    - slug: chem-u08-w29-q12
      type: multi_select
      topic_code: "8.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about oxidation numbers are correct? Select all that apply.
      options:
        - "An atom in a pure element has an oxidation number of 0."
        - "Oxygen is −2 in every compound without exception."
        - "The oxidation numbers in a neutral compound add to zero."
        - "A monatomic ion's oxidation number equals its charge."
        - "Hydrogen is −1 in metal hydrides such as NaH."
        - "The oxidation number of an atom in a molecule is the real charge it carries."
      option_explanations:
        - |
          Correct. Fe, O₂, S₈ and Cl₂ are all 0; no electrons have been shifted toward another element.
        - |
          Oxygen is −1 in peroxides such as H₂O₂ and positive when bonded to fluorine.
        - |
          Correct. For an ion they add to the ion's charge instead.
        - |
          Correct. Na⁺ is +1, S²⁻ is −2; for monatomic ions the number is the actual charge.
        - |
          Correct. When hydrogen is bonded to a less electronegative metal, it takes the electron and is assigned −1.
        - |
          In a molecule the number is a bookkeeping device that assigns shared electrons to the more electronegative atom; sulfur is not really +6 in H₂SO₄.
      answer: [0, 2, 3, 4]
      explanation: |
        The two exceptions to know are peroxides (O −1) and metal hydrides (H −1), and the number is formal for atoms in molecules.

    - slug: chem-u08-w29-q13
      type: multi_select
      topic_code: "4.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which types of reaction from unit 4 are always redox reactions? Select all that apply.
      options:
        - "Combustion"
        - "Double replacement"
        - "Single replacement"
        - "Acid–base neutralisation"
        - "Synthesis of a compound from its elements"
      option_explanations:
        - |
          Correct. Oxygen goes from 0 to −2 and the fuel's carbon or other element is oxidised.
        - |
          Ions swap partners with no change in oxidation number; precipitations are never redox.
        - |
          Correct. A free element replaces an element in a compound, which requires electrons to move.
        - |
          H⁺ and OH⁻ combine into water with no change in any oxidation number.
        - |
          Correct. Elements start at 0 and end with nonzero numbers in the compound; electrons are transferred or shared unequally.
      answer: [0, 2, 4]
      explanation: |
        Review of 4.2: any reaction with a free element on one side only is redox; double replacement and neutralisation never are.

    # ---- True/false
    - slug: chem-u08-w29-q14
      type: true_false
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: the oxidising agent in a redox reaction is itself reduced.
      answer: true
      explanation: |
        True. The oxidising agent takes electrons from another species (oxidising it) and, by gaining those electrons, is reduced. Likewise the reducing agent is oxidised. The names describe what the species does to its partner.

    - slug: chem-u08-w29-q15
      type: true_false
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: an ion with a 2+ charge has two fewer electrons than protons, because forming it removed two electrons while the nucleus was unchanged.
      answer: true
      explanation: |
        True. Review of 2.2: chemical changes never alter the number of protons. A neutral atom has equal protons and electrons; losing two electrons leaves a net 2+ charge, which is what oxidation to a 2+ ion means.

    # ---- Fill in the blank
    - slug: chem-u08-w29-q16
      type: fill_blank
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        In hydrogen peroxide, H₂O₂, the oxidation number of each oxygen atom is ____.
      answer:
        - "-1"
        - "−1"
        - "minus one"
        - "minus 1"
        - "negative one"
        - "-1 (minus one)"
      explanation: |
        Hydrogen contributes +2 in total; the two oxygens must sum to −2, so each is −1. Peroxides are the exception to oxygen's usual −2.

