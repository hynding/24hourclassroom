    # ---- Short answer
    - slug: chem-u08-w29-q21
      type: short_answer
      topic_code: "8.1"
      source: "general knowledge"
      points: 3
      prompt: |
        Potassium chlorate decomposes when heated: 2KClO₃(s) → 2KCl(s) + 3O₂(g).
        (a) Assign oxidation numbers to chlorine and oxygen on both sides.
        (b) State which element is oxidised and which is reduced, with the change in each oxidation number.
        (c) Explain why potassium chlorate can be described as both the oxidising agent and the reducing agent in this reaction.
      answer: |
        (a) In KClO₃: K +1, Cl +5, O −2. In KCl: K +1, Cl −1. In O₂: O 0. (b) Oxygen is oxidised (−2 → 0, each atom losing two electrons); chlorine is reduced (+5 → −1, each atom gaining six electrons). Per two formula units, six oxygens lose twelve electrons and two chlorines gain twelve. (c) Both the element that loses electrons (oxygen) and the element that gains them (chlorine) are inside the same compound, so KClO₃ supplies the electrons and accepts them; it is simultaneously the reducing agent and the oxidising agent.
      explanation: |
        1 point for (a) correct numbers, in particular Cl +5 in chlorate and O 0 in O₂. 1 point for (b) oxygen oxidised and chlorine reduced with the correct changes. 1 point for (c) the explanation that both changes occur within one compound. Accept "disproportionation-like" descriptions only if the two elements are correctly identified.

    - slug: chem-u08-w29-q22
      type: short_answer
      topic_code: "8.2"
      source: "general knowledge"
      points: 3
      stimulus: |
        In acidic solution, permanganate ions oxidise iron(II) ions to iron(III) ions and are themselves reduced to manganese(II) ions. The half-reactions are

        Fe²⁺ → Fe³⁺ + e⁻
        MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O
      prompt: |
        (a) Combine the half-reactions into a balanced net ionic equation, showing how you made the electrons cancel.
        (b) Verify that the total charge balances on both sides.
        (c) A 25.0 mL sample of iron(II) solution needs 0.00200 mol of MnO₄⁻ to reach the end point. How many moles of Fe²⁺ were in the sample?
      answer: |
        (a) Multiply the iron half-reaction by 5 so that five electrons are lost: 5Fe²⁺ → 5Fe³⁺ + 5e⁻. Add to the permanganate half-reaction; the 5e⁻ cancel: MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 4H₂O + 5Fe³⁺. (b) Left: (−1) + 8(+1) + 5(+2) = +17. Right: (+2) + 0 + 5(+3) = +17. Charge balances, and atoms balance (Mn 1, O 4, H 8, Fe 5). (c) The ratio is 5 mol Fe²⁺ per 1 mol MnO₄⁻, so 0.00200 mol × 5 = 0.0100 mol of Fe²⁺.
      explanation: |
        1 point for (a) the correct multiplied and summed equation with the electrons cancelled. 1 point for (b) the +17 = +17 check. 1 point for (c) 0.0100 mol Fe²⁺ from the 5:1 ratio.

    # ---- Long answer
    - slug: chem-u08-w29-q23
      type: long_answer
      topic_code: "8.2"
      source: "general knowledge"
      points: 6
      prompt: |
        Copper metal dissolves in concentrated nitric acid, releasing brown nitrogen dioxide gas and forming a blue solution of copper(II) ions. The unbalanced net ionic equation is Cu + NO₃⁻ → Cu²⁺ + NO₂ (acidic solution). Write a full account that: (1) assigns oxidation numbers to copper and nitrogen on both sides and identifies what is oxidised and what is reduced; (2) names the oxidising agent and the reducing agent as species; (3) writes and balances the two half-reactions, showing the steps used to add water, hydrogen ions and electrons; (4) combines them into a balanced net ionic equation and checks both atoms and charge; (5) calculates the moles of NO₂ produced when 1.27 g of copper (molar mass 63.55 g/mol) dissolves.
      answer: |
        (1) Cu: 0 → +2, oxidised. N in NO₃⁻: +5 (−1 = N − 6); N in NO₂: +4; nitrogen is reduced. (2) The oxidising agent is the nitrate ion, NO₃⁻ (it takes electrons and is reduced); the reducing agent is copper metal, Cu (it gives electrons and is oxidised). (3) Oxidation half: Cu → Cu²⁺ + 2e⁻ (atoms balanced; charge 0 on the left and +2 − 2 = 0 on the right). Reduction half: NO₃⁻ → NO₂; nitrogen is balanced; three oxygens on the left against two on the right, so add one H₂O to the right: NO₃⁻ → NO₂ + H₂O; two hydrogens on the right, so add 2H⁺ to the left: NO₃⁻ + 2H⁺ → NO₂ + H₂O; charge is −1 + 2 = +1 on the left and 0 on the right, so add one electron to the left: NO₃⁻ + 2H⁺ + e⁻ → NO₂ + H₂O. (4) Multiply the reduction half by 2 so that two electrons are gained: 2NO₃⁻ + 4H⁺ + 2e⁻ → 2NO₂ + 2H₂O. Add to the oxidation half; the electrons cancel: Cu + 2NO₃⁻ + 4H⁺ → Cu²⁺ + 2NO₂ + 2H₂O. Atoms: Cu 1 and 1; N 2 and 2; O 6 and 4 + 2 = 6; H 4 and 4. Charge: left 0 − 2 + 4 = +2; right +2 + 0 + 0 = +2. (5) Moles of copper = 1.27 g ÷ 63.55 g/mol = 0.0200 mol. Two NO₂ per copper, so 0.0400 mol of NO₂ is produced.
      explanation: |
        6 points. 1 point: oxidation numbers (Cu 0 → +2; N +5 → +4) with copper oxidised and nitrogen reduced. 1 point: NO₃⁻ named as oxidising agent and Cu as reducing agent, as species. 1 point: both half-reactions balanced, with the water, H⁺ and electron steps shown for the nitrate half. 1 point: the reduction half doubled and the correct overall equation. 1 point: atom and charge checks shown (+2 = +2). 1 point: 0.0400 mol NO₂. Deduct 1 point for naming "nitrogen" rather than NO₃⁻ as the oxidising agent.
