    - slug: chem-u01-w02-q23
      type: long_answer
      topic_code: "1.4"
      source: "general knowledge"
      points: 6
      prompt: |
        Two students determine the density of the same metal cylinder. Student A measures its mass once on a balance that reads to 0.1 g and its volume once by water displacement in a cylinder graduated every 1 mL. Student B measures mass three times on a balance reading to 0.001 g and volume three times in a cylinder graduated every 0.1 mL, then averages.

        Explain why Student B's density is likely to be both more precise and reported with more significant figures, and describe a situation in which Student B's result could still be less accurate than Student A's. In your answer define accuracy, precision and significant figures, explain how the instruments limit the significant figures of the result, and state what each student should do to detect and reduce error.
      answer: |
        Precision is how closely repeated measurements agree; accuracy is how close a result is to the true value; significant figures are the certain digits of a measurement plus one estimated digit, so they reflect the instrument's resolution.

        Student B's instruments read to more decimal places, so each measurement carries more significant figures (for example 27.431 g rather than 27.4 g, and 10.2 mL rather than 10 mL). When density is calculated by division, the measurement with the fewest significant figures limits the answer: A's result is limited to about two figures, B's to three. Averaging three readings also reduces random scatter, so B's result is more precise.

        B's result could still be less accurate if there is a systematic error: a balance that is miscalibrated and reads 0.5 g high every time, a cylinder read from above so every volume is low, or an air bubble clinging to the cylinder in every trial. Such errors shift every reading the same way, so the readings agree with each other yet all miss the true value. A's cruder instruments could, by luck or because they were calibrated, give a result closer to the accepted density.

        To detect error, both students should compare their density with the accepted value and compute a percent error, check the balance with a known mass, read the meniscus at eye level, tap the cylinder to dislodge bubbles, and repeat trials to see the scatter. Precision is improved by repetition and better instruments; accuracy is improved by calibration and correct technique.
      explanation: |
        Six points.

        1 pt: correct definitions of accuracy and precision as distinct ideas.

        1 pt: significant figures defined as certain digits plus one estimated digit, tied to the instrument's resolution.

        1 pt: explains that the measurement with the fewest significant figures limits the calculated density, with the comparison between A's and B's instruments.

        1 pt: explains that averaging repeated readings reduces random error and so improves precision.

        1 pt: describes a systematic error (miscalibration, parallax, trapped bubble) that would make B precise but inaccurate.

        1 pt: names at least two sensible ways to detect or reduce error (calibration against a standard, percent error against the accepted value, correct meniscus reading, repetition).
