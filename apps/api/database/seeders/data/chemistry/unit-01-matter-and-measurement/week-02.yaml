week: 2
unit: 1
title: "Properties, Changes and Measuring Well"
topics: ["1.3", "1.4"]
guide: guides/week-02.md
guide_description: |
  Physical against chemical properties and changes, the evidence that signals a chemical change and why none of it
  is proof alone, intensive against extensive properties. Then measurement: SI units and prefixes, kelvin,
  significant figures and the rounding rules for each operation, accuracy versus precision and percent error.
  Worked examples on classifying changes, a mass-and-density calculation with correct rounding, and percent error.
flashcards_description: |
  29 cards on physical and chemical properties and changes, intensive and extensive properties, SI units and
  prefixes, significant-figure rules, accuracy, precision and percent error.

flashcards:
  - front: Physical property → definition and five examples
    back: |
      A property observed or measured without changing what the substance is: colour, density, melting point, electrical conductivity, solubility. Measuring it leaves the substance unchanged.
    topic_code: "1.3"
  - front: Chemical property → definition and examples
    back: |
      Describes how a substance can change into a different substance: flammability, reactivity with acid, tendency to rust or tarnish. It can only be seen by letting the change happen.
    topic_code: "1.3"
  - front: Physical change → what stays the same
    back: |
      The identity of the substance. Melting, boiling, dissolving, cutting and crushing change form or state only; the same substance is still present and can usually be recovered physically.
    topic_code: "1.3"
  - front: Chemical change → the one true test
    back: |
      A new substance with new properties has formed. Burning, rusting, baking and digestion all make substances that were not there before.
    topic_code: "1.3"
  - front: Signs of a chemical change → the five clues
    back: |
      Gas forms without boiling; a precipitate forms when solutions mix; an unexpected colour change; heat or light is released or the mixture cools on its own; the change is hard to reverse. Each clue can also appear in a physical change, so none is proof alone.
    topic_code: "1.3"
  - front: Bubbles in boiling water → physical or chemical?
    back: |
      Physical. The bubbles are water vapour, the same substance in a different state. Bubbles count as a sign of chemical change only when no boiling is happening.
    topic_code: "1.3"
  - front: Dissolving sugar in water → physical or chemical, and why
    back: |
      Physical. The sugar molecules are spread among water molecules but are unchanged; evaporating the water gives the sugar back.
    topic_code: "1.3"
  - front: Silver tarnishing → physical or chemical, and the product
    back: |
      Chemical. The black layer is silver sulfide, a new compound formed from silver and sulfur compounds in the air.
    topic_code: "1.3"
  - front: Precipitate → definition
    back: |
      An insoluble solid that forms when two solutions are mixed, a common sign of a chemical change. Example: a white solid when silver nitrate and sodium chloride solutions meet.
    topic_code: "1.3"
  - front: Intensive property → definition and examples
    back: |
      A property that does not depend on the amount of sample: density, boiling point, melting point, colour, conductivity. Intensive properties identify a substance.
    topic_code: "1.3"
  - front: Extensive property → definition and examples
    back: |
      A property that scales with the amount of sample: mass, volume, length, total energy content. Doubling the sample doubles it.
    topic_code: "1.3"
  - front: Density as intensive → why a ratio of two extensive properties is intensive
    back: |
      Mass and volume both double when the sample doubles, so their ratio, the density, stays the same. That is why density identifies a material regardless of sample size.
    topic_code: "1.3"
  - front: SI base units → the five chemistry uses most
    back: |
      Metre (length), kilogram (mass), second (time), kelvin (temperature), mole (amount of substance). Litre and gram are convenient lab units derived from or related to these.
    topic_code: "1.4"
  - front: Millilitre, cubic centimetre and litre → the relations
    back: |
      1 mL = 1 cm³ exactly, and 1 L = 1,000 mL = 1 dm³. These are defined relations, so they never limit significant figures.
    topic_code: "1.4"
  - front: SI prefixes kilo, centi, milli, micro, nano → their powers of ten
    back: |
      kilo (k) = 10³; centi (c) = 10⁻²; milli (m) = 10⁻³; micro (µ) = 10⁻⁶; nano (n) = 10⁻⁹. So 2.5 kg = 2,500 g and 350 mL = 0.350 L.
    topic_code: "1.4"
  - front: Celsius to kelvin → the conversion and the zero
    back: |
      K = °C + 273.15 (273 is fine for classroom work). 25 °C = 298 K. A kelvin and a Celsius degree are the same size; only the zero point differs. Kelvin never goes negative.
    topic_code: "1.4"
  - front: Significant figures → what they represent in a measurement
    back: |
      The digits known with certainty plus one estimated digit. A millimetre ruler gives 23.4 mm: 2 and 3 are certain, 4 is estimated. Writing 23.40 would claim precision the ruler lacks.
    topic_code: "1.4"
  - front: Zeros between non-zero digits → significant or not
    back: |
      Always significant. 4.073 has four significant figures; 1,005 has four.
    topic_code: "1.4"
  - front: Leading zeros (0.0047) → significant or not
    back: |
      Never significant; they only place the decimal point. 0.0047 has two significant figures, the same as 4.7 × 10⁻³.
    topic_code: "1.4"
  - front: Trailing zeros (4.700 versus 4700) → the decimal-point rule
    back: |
      Trailing zeros are significant when the number has a decimal point: 4.700 has four. Without one, 4700 is ambiguous; write 4.7 × 10³ (two) or 4.700 × 10³ (four) to be clear.
    topic_code: "1.4"
  - front: Exact numbers → how they affect significant figures
    back: |
      Counted objects and defined conversions (12 eggs, 1,000 mL per litre, 100 cm per metre) have unlimited significant figures and never limit the precision of a result.
    topic_code: "1.4"
  - front: Significant figures when multiplying or dividing → the rule
    back: |
      The answer keeps as many significant figures as the measurement with the fewest. 2.4 × 3.567 = 8.56, reported as 8.6 because 2.4 has only two.
    topic_code: "1.4"
  - front: Significant figures when adding or subtracting → the rule
    back: |
      The answer keeps as many decimal places as the measurement with the fewest. 12.11 + 0.3 + 1.045 = 13.455, reported as 13.5 because 0.3 has one decimal place.
    topic_code: "1.4"
  - front: Rounding in a multi-step calculation → when to round
    back: |
      Only at the end. Carry at least one extra guard digit through intermediate steps; rounding each step lets errors pile up.
    topic_code: "1.4"
  - front: Scientific notation → why chemists use it
    back: |
      It keeps very large and very small numbers readable and makes significant figures unambiguous: 0.000052 g is 5.2 × 10⁻⁵ g, clearly two significant figures.
    topic_code: "1.4"
  - front: Accuracy versus precision → the two definitions
    back: |
      Accuracy is closeness to the true or accepted value. Precision is closeness of repeated measurements to each other. A miscalibrated balance can be precise and inaccurate at the same time.
    topic_code: "1.4"
  - front: Precise but inaccurate → what it usually means about the method
    back: |
      A systematic error: something consistently shifts every reading the same way, such as a miscalibrated balance or a misread meniscus. Repeating the measurement will not fix it; recalibrating will.
    topic_code: "1.4"
  - front: Percent error → formula
    back: |
      Percent error = |measured − accepted| ÷ accepted × 100. A density of 2.58 g/cm³ against an accepted 2.70 g/cm³ gives 0.12 ÷ 2.70 × 100 = 4.4%.
    topic_code: "1.4"
  - front: Reading a meniscus → the rule for a graduated cylinder
    back: |
      Read the bottom of the curved surface at eye level. Reading from above or below gives a consistent error in every trial, which hurts accuracy without hurting precision.
    topic_code: "1.4"

quiz:
  description: |
    22 questions · about 35 minutes · mostly on this week (topics 1.3 and 1.4: properties, changes and
    measurement), with about a third reviewing week 1 (the scientific method and classifying matter). Multiple
    choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Multiple choice (1.3)
    - slug: chem-u01-w02-q01
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following is a chemical property of magnesium?
      options:
        - "It burns in air with a bright white flame"
        - "It is a silvery solid at room temperature"
        - "It conducts electricity"
        - "Its density is 1.74 g/cm³"
      option_explanations:
        - |
          Correct. Burning turns magnesium into magnesium oxide, a new substance; the ability to do that is a chemical property.
        - |
          Colour and state are observed without changing the metal, so they are physical properties.
        - |
          Conductivity is measured while the magnesium stays magnesium, so it is physical.
        - |
          Density is a ratio of mass to volume measured without any change in identity; it is physical and intensive.
      answer: 0

    - slug: chem-u01-w02-q02
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A student mixes two clear, colourless solutions and a white solid immediately forms. What is the best conclusion?
      options:
        - "A chemical change probably occurred because a precipitate formed"
        - "A physical change occurred because the solid can be filtered out"
        - "No change occurred because both solutions were colourless"
        - "The solutions must have been frozen by mixing"
      option_explanations:
        - |
          Correct. A precipitate appearing when two solutions are mixed is a standard sign that a new, insoluble substance has been produced.
        - |
          Being able to filter the product says nothing about how it formed; the solid is a new substance that was not in either solution.
        - |
          The appearance of a solid is a change; colour is not the only kind of evidence.
        - |
          Mixing two room-temperature liquids does not freeze them; the solid is a product, not ice.
      answer: 0

    - slug: chem-u01-w02-q04
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which change is physical?
      options:
        - "Iron forming rust in damp air"
        - "Bread turning brown in a toaster"
        - "Dry ice turning into carbon dioxide gas"
        - "A match burning"
      option_explanations:
        - |
          Rust is iron oxide, a new substance formed from iron and oxygen; this is chemical.
        - |
          Browning is a reaction between sugars and proteins that makes new compounds; it is chemical.
        - |
          Correct. Dry ice is solid CO₂; subliming to gaseous CO₂ changes the state but not the substance.
        - |
          Burning produces carbon dioxide, water and ash; new substances mean a chemical change.
      answer: 2

    # ---- Multiple choice (1.4)
    - slug: chem-u01-w02-q05
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        How many significant figures are in the measurement 0.004060 g?
      options:
        - "Three"
        - "Seven"
        - "Six"
        - "Four"
      option_explanations:
        - |
          Three would ignore the trailing zero after the 6, which is significant because the number has a decimal point.
        - |
          Seven counts every digit including the zero before the decimal point, none of which carry measurement information.
        - |
          Six counts the leading zeros after the decimal point, which are never significant.
        - |
          Correct. The digits 4, 0, 6 and the final 0 are significant; the two leading zeros only place the decimal point.
      answer: 3

    - slug: chem-u01-w02-q06
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        What is 3.25 cm × 1.4 cm, reported to the correct number of significant figures?
      options:
        - "4.55 cm²"
        - "4.550 cm²"
        - "4.6 cm²"
        - "5 cm²"
      option_explanations:
        - |
          4.55 keeps three significant figures, but 1.4 has only two, so the product cannot have three.
        - |
          Four significant figures claims more precision than either measurement had.
        - |
          Correct. 3.25 × 1.4 = 4.55; the factor with the fewest significant figures (1.4, two) limits the answer to two, giving 4.6 cm².
        - |
          One significant figure throws away precision that the measurements did provide.
      answer: 2

    - slug: chem-u01-w02-q07
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Four students measure the mass of a 50.00 g standard. Whose results are precise but not accurate?
      options:
        - "52.31 g, 52.33 g, 52.32 g"
        - "49.98 g, 50.01 g, 50.00 g"
        - "48.2 g, 51.9 g, 49.8 g"
        - "45.1 g, 55.0 g, 50.3 g"
      option_explanations:
        - |
          Correct. The readings agree with each other to 0.02 g (precise) but all sit about 2.3 g high (not accurate), the signature of a systematic error.
        - |
          These cluster tightly around the true value, so they are both precise and accurate.
        - |
          These scatter by several grams, so they are not precise, though their average is near 50 g.
        - |
          A spread of ten grams is neither precise nor consistently off in one direction.
      answer: 0

    - slug: chem-u01-w02-q08
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which conversion is correct?
      options:
        - "2.5 L = 250 mL"
        - "0.45 kg = 45 g"
        - "3.2 km = 3,200 m"
        - "75 cm = 7.5 m"
      option_explanations:
        - |
          One litre is 1,000 mL, so 2.5 L is 2,500 mL, not 250.
        - |
          A kilogram is 1,000 g, so 0.45 kg is 450 g.
        - |
          Correct. Kilo- means 10³, so 3.2 km × 1,000 m/km = 3,200 m.
        - |
          There are 100 cm in a metre, so 75 cm is 0.75 m; the conversion went the wrong way.
      answer: 2

    # ---- Spiral review (1.1, 1.2)
    - slug: chem-u01-w02-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which sample is a heterogeneous mixture?
      options:
        - "A glass of sweet tea with no sugar left at the bottom"
        - "Helium in a balloon"
        - "A bar of pure gold"
        - "A bowl of vegetable soup"
      option_explanations:
        - |
          With the sugar fully dissolved, the tea is uniform throughout and so homogeneous.
        - |
          Helium is a single element; a balloon of it is a pure substance.
        - |
          Pure gold is an element, a pure substance, not a mixture at all.
        - |
          Correct. Soup has visibly different parts (broth, vegetables) in different places; it is heterogeneous.
      answer: 3

    - slug: chem-u01-w02-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A student concludes that "the law of conservation of mass" explains why atoms are never destroyed in a reaction. What is wrong with this statement?
      options:
        - "Nothing; laws explain the causes of phenomena"
        - "A law describes what is observed; the explanation in terms of atoms is a theory"
        - "Mass is not actually conserved in chemical reactions"
        - "Laws apply only to physics, not chemistry"
      option_explanations:
        - |
          Laws summarise observations; they do not say why those observations happen.
        - |
          Correct. The law states that mass is unchanged; atomic theory explains it by saying atoms are rearranged, not created or destroyed. The student reversed the roles.
        - |
          In ordinary chemical reactions mass is conserved to every measurable precision; that is exactly what the law states.
        - |
          Both laws and theories occur throughout science; chemistry has many laws.
      answer: 1

    - slug: chem-u01-w02-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Ink from a marker is spotted on filter paper and the paper's edge is dipped in water. As the water climbs, the spot separates into blue and yellow bands. Which separation method is this, and what does it show?
      options:
        - "Distillation; the ink has two boiling points"
        - "Filtration; the ink contained insoluble particles"
        - "Chromatography; the ink was a mixture of at least two dyes"
        - "Evaporation; the water removed one of the dyes"
      option_explanations:
        - |
          Nothing was boiled or condensed; distillation uses boiling point differences.
        - |
          Filtration removes solids too large to pass through paper, but here the dyes travel with the water.
        - |
          Correct. Paper chromatography separates components that travel at different speeds with the solvent; two bands mean the ink was a mixture.
        - |
          The water carried the dyes rather than leaving one behind; evaporation separates a dissolved solid from its solvent.
      answer: 2

    - slug: chem-u01-w02-q24
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A student tests whether a fertilizer makes bean plants grow taller by growing ten plants with fertilizer and ten identical plants without it. What is the purpose of the ten plants grown without fertilizer?
      options:
        - "They are the independent variable"
        - "They remove the need to measure height"
        - "They show that fertilizer is harmful"
        - "They serve as a control group, giving a baseline for comparison"
      option_explanations:
        - |
          The independent variable is whether fertilizer is given; the unfertilized plants are one condition of it, not the variable itself.
        - |
          Height must still be measured for both groups; the control group gives the comparison, not a shortcut.
        - |
          The control group is not designed to show harm; it shows what happens when nothing is changed.
        - |
          Correct. Without an untreated group there is nothing to compare the fertilized plants against, so any growth could not be credited to the fertilizer.
      answer: 3

    # ---- Multi-select
    - slug: chem-u01-w02-q13
      type: multi_select
      topic_code: "1.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are chemical changes? Select all that apply.
      options:
        - "Milk going sour"
        - "Water freezing"
        - "A copper roof turning green"
        - "Sugar dissolving in coffee"
        - "A candle wick burning"
      option_explanations:
        - |
          Correct. Bacteria convert milk sugar to lactic acid, a new substance with a new taste and smell.
        - |
          Freezing changes state only; the ice is still water.
        - |
          Correct. The green layer is a new copper compound formed by reaction with air and moisture.
        - |
          Dissolved sugar is unchanged and can be recovered by evaporation; this is physical.
        - |
          Correct. Combustion produces carbon dioxide and water from the wax and wick.
      answer: [0, 2, 4]

    - slug: chem-u01-w02-q14
      type: multi_select
      topic_code: "1.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following numbers have exactly three significant figures? Select all that apply.
      options:
        - "0.0520"
        - "520"
        - "5.20 × 10²"
        - "502"
        - "0.502"
      option_explanations:
        - |
          Correct. The leading zeros are not significant; 5, 2 and the trailing 0 after a decimal point are.
        - |
          Without a decimal point the trailing zero is ambiguous; 520 is usually read as two significant figures.
        - |
          Correct. Scientific notation makes it explicit: 5, 2 and 0 are all significant.
        - |
          Correct. The zero between 5 and 2 is significant, giving three.
        - |
          Correct. The leading zero is not significant; 5, 0 and 2 are.
      answer: [0, 2, 3, 4]

    # ---- True / false
    - slug: chem-u01-w02-q15
      type: true_false
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A temperature change during a process proves that a chemical change has occurred.
      answer: false
      explanation: |
        False. Temperature changes accompany many physical changes: dissolving ammonium nitrate cools water, and condensing steam releases heat. A temperature change is a clue to look further, not proof; only the formation of a new substance settles it.

    - slug: chem-u01-w02-q16
      type: true_false
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A set of measurements can be precise without being accurate.
      answer: true
      explanation: |
        True. Precision is agreement among repeated readings; accuracy is agreement with the true value. A miscalibrated balance gives readings that agree closely with each other but are all wrong by the same amount.

    # ---- Fill in the blank
    - slug: chem-u01-w02-q17
      type: fill_blank
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The SI base unit of mass is the ____.
      answer: ["kilogram", "kg"]
      explanation: |
        The kilogram is the SI base unit of mass, even though laboratory balances usually read in grams. The gram is one thousandth of a kilogram.

    - slug: chem-u01-w02-q18
      type: fill_blank
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A property such as density or boiling point that does not depend on the size of the sample is called an ____ property.
      answer: ["intensive"]
      explanation: |
        Intensive properties are independent of amount and therefore identify a substance; extensive properties such as mass and volume scale with the sample.

    # ---- Numeric
    - slug: chem-u01-w02-q19
      type: numeric
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student measures the boiling point of a liquid as 76.4 °C. The accepted value is 78.3 °C. What is the percent error? Give your answer as a percentage to one decimal place.
      answer: { value: 2.4, tolerance: 0.1 }
      explanation: |
        Percent error = |76.4 − 78.3| ÷ 78.3 × 100 = 1.9 ÷ 78.3 × 100 = 2.43%, which rounds to 2.4%. The absolute value makes the error positive whether the reading was high or low.

    - slug: chem-u01-w02-q20
      type: numeric
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Convert 37.0 °C to kelvin. Give your answer to one decimal place.
      answer: { value: 310.2, tolerance: 0.3 }
      explanation: |
        K = °C + 273.15 = 37.0 + 273.15 = 310.15 K, reported as 310.2 K (310 K is acceptable with the rounded 273). Body temperature is about 310 K.

    - slug: chem-u01-w02-q25
      type: true_false
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The elements in a compound can be separated from each other by filtration or evaporation.
      answer: false
      explanation: |
        False. Filtration and evaporation are physical separations that work only on mixtures. The elements in a compound are chemically bonded in a fixed ratio and can be separated only by a chemical change such as electrolysis or decomposition by heat.

    - slug: chem-u01-w02-q26
      type: fill_blank
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A tentative, testable explanation or prediction, often written in the form "if … then … because …", is called a ____.
      answer: ["hypothesis"]
      explanation: |
        A hypothesis is proposed before the experiment and must be specific enough that the results could show it to be wrong. It differs from a theory, which is a well-tested explanation supported by much evidence.

    - slug: chem-u01-w02-q27
      type: numeric
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A 250.0 g sample of a mixture of sand and iron filings is passed under a magnet, which removes 62.5 g of iron. What is the mass percent of sand in the original mixture? Give your answer as a percentage to one decimal place.
      answer: { value: 75.0, tolerance: 0.1 }
      explanation: |
        Sand mass = 250.0 − 62.5 = 187.5 g. Mass percent of sand = 187.5 ÷ 250.0 × 100 = 75.0%. The magnet separates the mixture physically because only the iron is magnetic.

    # ---- Short answer
    - slug: chem-u01-w02-q21
      type: short_answer
      topic_code: "1.4"
      source: "general knowledge"
      points: 3
      stimulus: |
        | Measurement | Value |
        |---|---|
        | Mass of empty graduated cylinder | 32.18 g |
        | Mass of cylinder plus liquid | 46.4 g |
        | Volume of liquid | 18.0 mL |
      prompt: |
        Using the table, answer (a), (b) and (c).

        (a) Calculate the mass of the liquid, reported to the correct number of significant figures, and explain the rule you used.
        (b) Calculate the density of the liquid in g/mL to the correct number of significant figures.
        (c) The liquid is suspected to be ethanol (accepted density 0.789 g/mL). Calculate the percent error and state whether the result supports the identification.
      answer: |
        (a) 46.4 − 32.18 = 14.22 g, reported as 14.2 g. For subtraction the result keeps the fewest decimal places, and 46.4 g has only one.
        (b) Density = 14.2 g ÷ 18.0 mL = 0.7889 g/mL, reported as 0.789 g/mL (three significant figures, since both 14.2 and 18.0 have three).
        (c) Percent error = |0.789 − 0.789| ÷ 0.789 × 100 = 0.0% (using the unrounded 0.7889 gives 0.01%). The measured density matches ethanol's, which supports the identification, though other liquids could share that density.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 14.2 g with the decimal-place rule for subtraction named. 14.22 g without rounding earns no credit for the rule.

        (b) 1 pt: 0.789 g/mL (accept 0.79 if the student carried 14.2 as three figures but rounded conservatively, with the significant-figure rule for division stated).

        (c) 1 pt: percent error near 0% and a sensible conclusion that the data are consistent with ethanol, ideally noting that a matching density alone is not proof.

    - slug: chem-u01-w02-q22
      type: short_answer
      topic_code: "1.3"
      source: "general knowledge"
      points: 3
      prompt: |
        A strip of magnesium is placed in a test tube of hydrochloric acid. Bubbles form rapidly, the tube becomes hot, and after a few minutes the magnesium has disappeared and the solution is clear.

        (a) Identify two observations that suggest a chemical change took place.
        (b) Explain why the disappearance of the magnesium is not the same as the magnesium melting or dissolving physically.
        (c) Name one physical property and one chemical property of magnesium that could be read from this description.
      answer: |
        (a) Gas bubbles formed without heating, and the tube became hot on its own (heat released).
        (b) Melting would need a temperature of about 650 °C, far above what acid at room temperature reaches, and the metal would reappear on cooling. Physical dissolving would give back the metal on evaporation. Here the magnesium reacted to form a new dissolved compound (magnesium chloride) and hydrogen gas, so it cannot be recovered by physical means.
        (c) Physical: magnesium is a solid strip at room temperature (or silvery, or malleable enough to be made into a strip). Chemical: magnesium reacts with acid to form a gas.
      explanation: |
        Three points, one per part.

        (a) 1 pt: two of: gas formed, heat released, the metal was consumed and a new substance formed.

        (b) 1 pt: a clear argument that new substances formed (a gas and a dissolved salt) and that the metal cannot be recovered physically, or that melting needs a far higher temperature.

        (c) 1 pt: one correct physical property (solid, silvery, malleable) and one correct chemical property (reacts with acid, releases hydrogen).

