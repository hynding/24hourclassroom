unit: 1
description: |
  42 questions · about 70 minutes · every topic of Unit 1 (1.1 to 1.6): the scientific method, classifying matter,
  properties and changes, measurement and significant figures, dimensional analysis and density, energy and the
  states of matter. Two stimulus sets (a density lab data table and a described experiment), select-all, true/false,
  fill-in-the-blank and numeric items, two short-answer questions (3 points each) and one long answer (6 points).
  Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
  automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: density lab data (1.4, 1.5)
  - slug: chem-u01-exam-q01
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Three groups measured the mass and volume of samples of the same unknown liquid.

      | Group | Mass of empty beaker (g) | Mass of beaker + liquid (g) | Volume of liquid (mL) |
      |---|---|---|---|
      | 1 | 52.31 | 68.09 | 20.0 |
      | 2 | 48.77 | 72.45 | 30.0 |
      | 3 | 50.02 | 89.48 | 50.0 |

      Reference densities (g/mL): ethanol 0.789, water 0.998, glycerol 1.26, acetone 0.785.
    prompt: |
      What is the density of the liquid according to Group 1's data, to the correct number of significant figures?
    options:
      - "0.79 g/mL"
      - "0.789 g/mL"
      - "0.7890 g/mL"
      - "1.27 g/mL"
    option_explanations:
      - |
        Two significant figures throws away precision: both the mass (15.78 g, four figures) and the volume (20.0 mL, three) support three.
      - |
        Correct. Mass = 68.09 − 52.31 = 15.78 g; 15.78 ÷ 20.0 = 0.789 g/mL, three significant figures limited by the volume.
      - |
        Four significant figures exceed what the three-figure volume allows.
      - |
        1.27 g/mL would come from dividing volume by mass; density is mass over volume.
    answer: 1

  - slug: chem-u01-exam-q02
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Three groups measured the mass and volume of samples of the same unknown liquid.

      | Group | Mass of empty beaker (g) | Mass of beaker + liquid (g) | Volume of liquid (mL) |
      |---|---|---|---|
      | 1 | 52.31 | 68.09 | 20.0 |
      | 2 | 48.77 | 72.45 | 30.0 |
      | 3 | 50.02 | 89.48 | 50.0 |

      Reference densities (g/mL): ethanol 0.789, water 0.998, glycerol 1.26, acetone 0.785.
    prompt: |
      Group 2's liquid mass is 23.68 g and Group 3's is 39.46 g. Which conclusion is best supported by all three groups' data?
    options:
      - "The liquid is glycerol"
      - "The density increases with the volume of the sample"
      - "Group 3 made a large error because its mass is the biggest"
      - "The liquid is ethanol or acetone; density alone cannot tell them apart"
    option_explanations:
      - |
        Glycerol's density, 1.26 g/mL, is far above the 0.789 g/mL the groups measured.
      - |
        23.68 ÷ 30.0 = 0.789 and 39.46 ÷ 50.0 = 0.789: density is the same for every sample size, as an intensive property must be.
      - |
        A larger sample has a larger mass; Group 3's density agrees with the others, so there is no sign of error.
      - |
        Correct. All three groups get 0.789 g/mL, which matches ethanol (0.789) and is within 0.004 of acetone (0.785); another property such as boiling point would be needed.
    answer: 3

  - slug: chem-u01-exam-q03
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      Three groups measured the mass and volume of samples of the same unknown liquid.

      | Group | Mass of empty beaker (g) | Mass of beaker + liquid (g) | Volume of liquid (mL) |
      |---|---|---|---|
      | 1 | 52.31 | 68.09 | 20.0 |
      | 2 | 48.77 | 72.45 | 30.0 |
      | 3 | 50.02 | 89.48 | 50.0 |

      Reference densities (g/mL): ethanol 0.789, water 0.998, glycerol 1.26, acetone 0.785.
    prompt: |
      Which measurement limits the number of significant figures in each group's calculated density?
    options:
      - "The mass of the empty beaker, because it was measured first"
      - "The volume, because it has only three significant figures"
      - "The mass of the beaker plus liquid, because it is the largest number"
      - "None; a calculated density always has four significant figures"
    option_explanations:
      - |
        Order of measurement has nothing to do with significant figures.
      - |
        Correct. The subtracted masses have four significant figures (15.78, 23.68, 39.46 g); each volume has three, so the quotient keeps three.
      - |
        Size does not matter; what matters is how many digits are known with certainty plus one estimate.
      - |
        The number of significant figures in a result depends on the data; here the volumes limit it to three.
    answer: 1

  # ---- Stimulus set B: a described experiment (1.1, 1.3)
  - slug: chem-u01-exam-q04
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student investigates whether the temperature of vinegar affects how fast a piece of chalk (calcium carbonate) dissolves in it. She uses 50.0 mL of vinegar at 10 °C, 25 °C and 40 °C, one trial each, with chalk pieces of the same mass, and times how long each takes to disappear. Bubbles form in every trial and the chalk is gone within minutes. Results: 10 °C, 412 s; 25 °C, 255 s; 40 °C, 148 s.
    prompt: |
      What is the independent variable in this investigation?
    options:
      - "The time for the chalk to disappear"
      - "The volume of vinegar"
      - "The temperature of the vinegar"
      - "The mass of the chalk"
    option_explanations:
      - |
        Time is what she measures to see the effect, so it is the dependent variable.
      - |
        Volume is held at 50.0 mL in every trial; it is a controlled variable.
      - |
        Correct. Temperature is the one factor she deliberately sets to three different values.
      - |
        Chalk mass is kept the same across trials, so it is controlled, not independent.
    answer: 2

  - slug: chem-u01-exam-q05
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student investigates whether the temperature of vinegar affects how fast a piece of chalk (calcium carbonate) dissolves in it. She uses 50.0 mL of vinegar at 10 °C, 25 °C and 40 °C, one trial each, with chalk pieces of the same mass, and times how long each takes to disappear. Bubbles form in every trial and the chalk is gone within minutes. Results: 10 °C, 412 s; 25 °C, 255 s; 40 °C, 148 s.
    prompt: |
      The student describes the chalk as "dissolving". Which observation most strongly suggests that a chemical change, not simple dissolving, is taking place?
    options:
      - "The chalk disappears faster at higher temperature"
      - "Bubbles of gas form as the chalk disappears"
      - "The vinegar volume is 50.0 mL"
      - "The chalk pieces all have the same mass"
    option_explanations:
      - |
        Physical dissolving also speeds up with temperature, so the rate change does not distinguish the two.
      - |
        Correct. Gas forming from a solid in a liquid that is not boiling signals a new substance (carbon dioxide) and so a chemical change.
      - |
        The volume is a controlled variable and says nothing about the type of change.
      - |
        Equal masses are part of the design; they are not evidence about the nature of the change.
    answer: 1

  - slug: chem-u01-exam-q06
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student investigates whether the temperature of vinegar affects how fast a piece of chalk (calcium carbonate) dissolves in it. She uses 50.0 mL of vinegar at 10 °C, 25 °C and 40 °C, one trial each, with chalk pieces of the same mass, and times how long each takes to disappear. Bubbles form in every trial and the chalk is gone within minutes. Results: 10 °C, 412 s; 25 °C, 255 s; 40 °C, 148 s.
    prompt: |
      Which change to the procedure would most improve the reliability of the conclusion?
    options:
      - "Using a different brand of vinegar for each temperature"
      - "Running several trials at each temperature and averaging"
      - "Using larger chalk pieces at the higher temperatures"
      - "Stopping the timer when half the chalk is gone in some trials and all of it in others"
    option_explanations:
      - |
        Changing the vinegar would add a second variable and make the comparison unfair.
      - |
        Correct. One trial per condition gives no idea of the random scatter; replicates show whether the differences are larger than chance.
      - |
        Changing chalk size with temperature confounds the two variables.
      - |
        The end point must be the same in every trial or the times cannot be compared.
    answer: 1

  # ---- Multiple choice, stand-alone
  - slug: chem-u01-exam-q07
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      "Atoms are rearranged but never created or destroyed in a chemical reaction." Which word best describes this statement?
    options:
      - "An observation"
      - "A law"
      - "A theory"
      - "A hypothesis"
    option_explanations:
      - |
        No one observes atoms rearranging directly; the statement interprets many observations.
      - |
        The law is the observed regularity (mass is conserved); this statement explains why.
      - |
        Correct. It is an explanation in terms of atoms, well supported by evidence: a theory.
      - |
        A hypothesis is tentative and untested; this explanation has two centuries of evidence behind it.
    answer: 2

  - slug: chem-u01-exam-q08
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which list contains only pure substances?
    options:
      - "Table salt, distilled water, copper"
      - "Air, nitrogen, oxygen"
      - "Brass, bronze, steel"
      - "Milk, sugar, vinegar"
    option_explanations:
      - |
        Correct. Sodium chloride and water are compounds and copper is an element; all three have fixed composition.
      - |
        Nitrogen and oxygen are elements, but air is a mixture of them and other gases.
      - |
        All three are alloys, solid solutions of metals in variable proportions.
      - |
        Sugar is a compound, but milk and vinegar are mixtures.
    answer: 0

  - slug: chem-u01-exam-q09
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      A mixture of two liquids with boiling points of 56 °C and 100 °C is to be separated so that both liquids are recovered. Which method is best?
    options:
      - "Distillation"
      - "Evaporation in an open dish"
      - "Filtration"
      - "Magnetic separation"
    option_explanations:
      - |
        Correct. Heating boils off the 56 °C liquid first; condensing its vapour collects it, and the 100 °C liquid stays behind.
      - |
        Open evaporation would lose the more volatile liquid to the air instead of recovering it.
      - |
        Filtration separates an insoluble solid from a liquid; two mixed liquids pass through the paper together.
      - |
        Neither liquid is magnetic, so a magnet would separate nothing from this mixture.
    answer: 0

  - slug: chem-u01-exam-q10
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Hydrogen peroxide, H₂O₂, slowly decomposes into water and oxygen gas. What does this tell you about hydrogen peroxide?
    options:
      - "It is a mixture of water and oxygen"
      - "It is an element"
      - "It is a heterogeneous mixture"
      - "It is a compound, because it breaks down into other substances by a chemical change"
    option_explanations:
      - |
        A mixture of water and oxygen would not have a fixed formula or decompose on its own; the oxygen would simply bubble out.
      - |
        An element cannot be broken down into other substances; hydrogen peroxide yields two.
      - |
        Hydrogen peroxide solution is uniform, and the question concerns the substance itself, which is a compound.
      - |
        Correct. A pure substance that decomposes into simpler substances must be a compound, and decomposition is a chemical change.
    answer: 3

  - slug: chem-u01-exam-q11
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which pair lists one physical property and one chemical property of ethanol?
    options:
      - "It mixes with water; it burns with a blue flame"
      - "It is flammable; it reacts with oxygen"
      - "It boils at 78 °C; it is colourless"
      - "It is a liquid; its density is 0.789 g/mL"
    option_explanations:
      - |
        Correct. Mixing with water leaves ethanol unchanged (physical); burning turns it into carbon dioxide and water (chemical).
      - |
        Flammability and reactivity with oxygen are both chemical properties, and they describe the same thing.
      - |
        Boiling point and colour are both physical properties.
      - |
        State and density are both physical properties.
    answer: 0

  - slug: chem-u01-exam-q12
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following is an extensive property?
    options:
      - "Boiling point"
      - "Colour"
      - "Density"
      - "Volume"
    option_explanations:
      - |
        A substance boils at the same temperature whatever the sample size; boiling point is intensive.
      - |
        Colour does not change with the amount of sample.
      - |
        Density is a ratio of two extensive properties and is intensive.
      - |
        Correct. Volume depends on how much of the substance there is.
    answer: 3

  - slug: chem-u01-exam-q13
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which number has four significant figures?
    options:
      - "0.0450"
      - "4500"
      - "4.050"
      - "0.045"
    option_explanations:
      - |
        The leading zeros are not significant; 4, 5 and the trailing 0 give three.
      - |
        With no decimal point the trailing zeros are ambiguous; 4500 is usually read as two significant figures.
      - |
        Correct. The 4, the sandwiched 0, the 5 and the trailing 0 after the decimal point are all significant.
      - |
        Only the 4 and 5 are significant, two in total.
    answer: 2

  - slug: chem-u01-exam-q14
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      What is 100.0 mL − 2.55 mL, reported correctly?
    options:
      - "97.5 mL"
      - "97.45 mL"
      - "97 mL"
      - "97.450 mL"
    option_explanations:
      - |
        Correct. Subtraction keeps the fewest decimal places, one here, so 97.45 rounds to 97.5 mL.
      - |
        Two decimal places claim more than the 100.0 mL measurement, with one, supports.
      - |
        Rounding to a whole number discards a decimal place that both measurements had.
      - |
        Three decimal places exceed the precision of either measurement.
    answer: 0

  - slug: chem-u01-exam-q15
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A student's three measurements of a 10.00 g mass are 9.21 g, 9.19 g and 9.20 g. How should the results be described?
    options:
      - "Accurate and precise"
      - "Accurate but not precise"
      - "Precise but not accurate"
      - "Neither accurate nor precise"
    option_explanations:
      - |
        The readings agree, but they are all about 0.8 g below the true value, so they are not accurate.
      - |
        The readings are nowhere near 10.00 g on average, so they cannot be called accurate.
      - |
        Correct. The readings agree within 0.02 g (precise) but all sit 8% low (not accurate), suggesting a systematic error.
      - |
        The close agreement among readings is precision, which is present.
    answer: 2

  - slug: chem-u01-exam-q16
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which is the correct conversion of 0.0035 L to millilitres?
    options:
      - "0.0000035 mL"
      - "0.35 mL"
      - "35 mL"
      - "3.5 mL"
    option_explanations:
      - |
        Dividing by 1,000 goes the wrong way; a millilitre is smaller than a litre, so the number must get larger.
      - |
        0.35 mL would be 0.00035 L; the factor was applied as 100 rather than 1,000.
      - |
        35 mL is ten times too large; 0.0035 × 1,000 is 3.5.
      - |
        Correct. 0.0035 L × 1,000 mL/L = 3.5 mL.
    answer: 3

  - slug: chem-u01-exam-q17
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A rectangular block of aluminium (density 2.70 g/cm³) measures 5.00 cm × 4.00 cm × 2.00 cm. What is its mass?
    options:
      - "14.8 g"
      - "108 g"
      - "40.0 g"
      - "216 g"
    option_explanations:
      - |
        14.8 g is the volume divided by the density, the wrong rearrangement.
      - |
        Correct. V = 5.00 × 4.00 × 2.00 = 40.0 cm³; m = D × V = 2.70 × 40.0 = 108 g.
      - |
        40.0 is the volume in cm³, not the mass.
      - |
        216 g would need a volume of 80.0 cm³; one dimension was doubled.
    answer: 1

  - slug: chem-u01-exam-q18
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which setup converts 15 m/s to km/h?
    options:
      - "15 m/s × (1 km / 1,000 m) × (3,600 s / 1 h)"
      - "15 m/s × (1,000 m / 1 km) × (1 h / 3,600 s)"
      - "15 m/s × (1 km / 1,000 m) × (1 h / 3,600 s)"
      - "15 m/s × (1,000 m / 1 km) × (3,600 s / 1 h)"
    option_explanations:
      - |
        Correct. Metres cancel to kilometres and seconds cancel to hours: 15 × 3,600 ÷ 1,000 = 54 km/h.
      - |
        Both factors are inverted; neither metres nor seconds cancel.
      - |
        The time factor is inverted; seconds would appear squared in the denominator.
      - |
        The length factor is inverted; metres would appear squared in the numerator.
    answer: 0

  - slug: chem-u01-exam-q19
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Two liquids that do not mix are poured into a cylinder: liquid P (density 0.92 g/mL) and liquid Q (density 1.11 g/mL). A small bead of density 1.00 g/mL is dropped in. Where does the bead come to rest?
    options:
      - "Floating on top of P"
      - "At the boundary between P and Q"
      - "At the bottom of the cylinder"
      - "Suspended in the middle of Q"
    option_explanations:
      - |
        The bead is denser than P, so it sinks through P.
      - |
        Correct. P (0.92) floats on Q (1.11); the bead sinks through P but floats on Q, so it rests at the boundary.
      - |
        The bead is less dense than Q and cannot sink through it.
      - |
        An object of uniform density either floats on a denser liquid or sinks through a less dense one; it does not hover mid-layer.
    answer: 1

  - slug: chem-u01-exam-q20
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Which best describes the particles of a liquid?
    options:
      - "Far apart, moving rapidly in straight lines"
      - "Close together in a fixed, ordered arrangement, vibrating in place"
      - "Motionless and touching"
      - "Close together but free to slide past one another"
    option_explanations:
      - |
        Widely spaced, fast-moving particles describe a gas.
      - |
        A fixed ordered arrangement with particles vibrating in place is a solid.
      - |
        Particles are never motionless above absolute zero; even in solids they vibrate.
      - |
        Correct. Liquid particles remain in contact (fixed volume) but are disordered and mobile (variable shape).
    answer: 3

  - slug: chem-u01-exam-q21
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      A pot of water boils on a stove. While it boils, the thermometer reads a constant 100 °C even though the burner keeps supplying energy. Where does the energy go?
    options:
      - "It is used to separate molecules from the liquid into the gas, raising potential energy"
      - "It raises the kinetic energy of the water molecules"
      - "It is destroyed by the boiling process"
      - "It is stored in the thermometer"
    option_explanations:
      - |
        Correct. At the boiling point added energy overcomes the attractions between molecules, converting liquid to gas without a temperature rise.
      - |
        A constant temperature means the average kinetic energy is not rising.
      - |
        Energy is conserved; it leaves with the steam as potential energy of separated molecules.
      - |
        The thermometer absorbs a negligible amount and reads constant, which is the point of the question.
    answer: 0

  - slug: chem-u01-exam-q22
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      A swimming pool and a cup of coffee are both at 30 °C. Which statement is true?
    options:
      - "The coffee contains more total energy because it is in a smaller container"
      - "Their particles have the same average kinetic energy, but the pool contains far more total energy"
      - "The pool is hotter because it is bigger"
      - "Heat flows from the coffee to the pool because the coffee has fewer particles"
    option_explanations:
      - |
        Total energy scales with the amount of matter; the pool has vastly more.
      - |
        Correct. Equal temperatures mean equal average particle kinetic energy; total energy depends on how many particles there are.
      - |
        Temperature does not depend on size; both are at 30 °C.
      - |
        Heat flows only between objects at different temperatures; at equal temperatures there is no net flow.
    answer: 1

  - slug: chem-u01-exam-q23
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      What is 25 °C in kelvin?
    options:
      - "−248 K"
      - "248 K"
      - "298 K"
      - "398 K"
    option_explanations:
      - |
        Kelvin temperatures are never negative; the conversion adds 273, it does not subtract.
      - |
        248 K results from subtracting 25 from 273; the Celsius value must be added.
      - |
        Correct. K = °C + 273 = 25 + 273 = 298 K.
      - |
        398 K would be 125 °C; 100 too many were added.
    answer: 2

  - slug: chem-u01-exam-q24
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Dissolving solid ammonium nitrate in water makes the solution noticeably colder. Why is this still classified as a physical change?
    options:
      - "Because the temperature went down rather than up"
      - "Because the ammonium nitrate can be recovered unchanged by evaporating the water"
      - "Because all changes in water are physical"
      - "Because no bubbles formed"
    option_explanations:
      - |
        The direction of the temperature change does not decide whether a change is physical or chemical.
      - |
        Correct. The substance keeps its identity; evaporation gives it back, so no new substance formed despite the energy change.
      - |
        Many changes in water are chemical, such as sodium reacting with it.
      - |
        The absence of bubbles is weak evidence; many chemical changes produce no gas.
    answer: 1

  - slug: chem-u01-exam-q25
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which entry in a lab notebook is an inference rather than an observation?
    options:
      - "The powder was white and fine"
      - "The mass of the dish was 24.30 g"
      - "The liquid fizzed when the powder was added"
      - "The powder was probably baking soda"
    option_explanations:
      - |
        Colour and texture are recorded directly by the senses.
      - |
        A balance reading is a direct measurement.
      - |
        Fizzing is seen and heard directly; it is an observation.
      - |
        Correct. Identifying the powder is a conclusion drawn from the observations, which could be wrong.
    answer: 3

  - slug: chem-u01-exam-q26
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      How many cubic centimetres are in 0.0025 m³?
    options:
      - "0.25 cm³"
      - "25 cm³"
      - "250 cm³"
      - "2,500 cm³"
    option_explanations:
      - |
        Multiplying by 100 treats the conversion as linear; cubic units need the factor cubed.
      - |
        25 cm³ uses a factor of 10⁴; the correct factor is 10⁶.
      - |
        250 cm³ uses 10⁵; one more factor of ten is needed.
      - |
        Correct. 1 m³ = (100 cm)³ = 10⁶ cm³, so 0.0025 × 10⁶ = 2,500 cm³.
    answer: 3

  # ---- Multi-select
  - slug: chem-u01-exam-q27
    type: multi_select
    topic_code: "1.2"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following are compounds? Select all that apply.
    options:
      - "Carbon dioxide, CO₂"
      - "Ozone, O₃"
      - "Sodium chloride, NaCl"
      - "Bronze"
      - "Ammonia, NH₃"
    option_explanations:
      - |
        Correct. Carbon and oxygen bonded in a fixed 1:2 ratio.
      - |
        Ozone is three oxygen atoms bonded together: one element, so it is not a compound.
      - |
        Correct. Sodium and chlorine in a fixed 1:1 ratio with properties unlike either element.
      - |
        Bronze is an alloy of copper and tin in variable proportions, a homogeneous mixture.
      - |
        Correct. Nitrogen and hydrogen bonded in a fixed 1:3 ratio.
    answer: [0, 2, 4]

  - slug: chem-u01-exam-q28
    type: multi_select
    topic_code: "1.3"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following observations are commonly used as evidence that a chemical change may have occurred? Select all that apply.
    options:
      - "A precipitate forms when two solutions are mixed"
      - "A liquid changes shape when poured into a new container"
      - "Light is given off"
      - "A gas is produced from a liquid that is not boiling"
      - "A solid is crushed into a powder"
    option_explanations:
      - |
        Correct. An insoluble solid appearing from two clear solutions means a new substance has formed.
      - |
        Liquids always take the shape of their container; this is a property, not a change.
      - |
        Correct. Light released during a process, as in burning, signals energy from a chemical change.
      - |
        Correct. Gas from a non-boiling liquid, such as the fizz of chalk in acid, means a new substance.
      - |
        Crushing changes size and shape only; the substance is unchanged.
    answer: [0, 2, 3]

  - slug: chem-u01-exam-q29
    type: multi_select
    topic_code: "1.4"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following are exact numbers that do not limit the significant figures of a calculation? Select all that apply.
    options:
      - "1,000 mL in 1 L"
      - "The mass of a beaker read as 52.31 g"
      - "24 students in a class"
      - "100 cm in 1 m"
      - "A temperature read as 23.5 °C"
    option_explanations:
      - |
        Correct. The litre is defined as exactly 1,000 mL.
      - |
        A balance reading is a measurement with an estimated last digit.
      - |
        Correct. Counted objects are exact numbers with no uncertainty in their last digit.
      - |
        Correct. The relation between centimetres and metres is a definition.
      - |
        A thermometer reading is a measurement with uncertainty in its last digit.
    answer: [0, 2, 3]

  # ---- True / false
  - slug: chem-u01-exam-q30
    type: true_false
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: Every homogeneous mixture is a liquid.
    answer: false
    explanation: |
      False. Homogeneous means uniform with a single phase, whatever the state. Air is a gaseous solution and brass a solid one.

  - slug: chem-u01-exam-q31
    type: true_false
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: Heat is a form of energy that flows from a hotter object to a colder one.
    answer: true
    explanation: |
      True. Heat is energy in transit driven by a temperature difference; it moves spontaneously from hot to cold and stops when the temperatures are equal.

  - slug: chem-u01-exam-q32
    type: true_false
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: If a sample of copper is cut into three unequal pieces, each piece has the same density as the original.
    answer: true
    explanation: |
      True. Density is intensive: mass and volume both shrink in proportion when the sample is divided, so their ratio is unchanged at about 8.96 g/cm³.

