    prompt: |
      The temperature of −273.15 °C, at which particle motion is at its minimum, is called ____.
    answer: ["absolute zero", "0 K", "zero kelvin"]
    explanation: |
      Absolute zero is 0 K, the starting point of the kelvin scale. Because it is a true zero, kelvin temperature is proportional to the average kinetic energy of particles.

  - slug: chem-u01-exam-q35
    type: fill_blank
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      The SI prefix meaning one thousandth (10⁻³) is ____.
    answer: ["milli", "milli-", "m"]
    explanation: |
      Milli- means 10⁻³: a millilitre is a thousandth of a litre and a millimetre a thousandth of a metre. Kilo- is 10³, centi- 10⁻², micro- 10⁻⁶ and nano- 10⁻⁹.

  # ---- Numeric
  - slug: chem-u01-exam-q36
    type: numeric
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A student measures the density of aluminium as 2.61 g/cm³. The accepted value is 2.70 g/cm³. What is the percent error? Give your answer as a percentage to one decimal place.
    answer: { value: 3.3, tolerance: 0.1 }
    explanation: |
      Percent error = |2.61 − 2.70| ÷ 2.70 × 100 = 0.09 ÷ 2.70 × 100 = 3.33%, reported as 3.3%.

  - slug: chem-u01-exam-q37
    type: numeric
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A metal cylinder has a mass of 154.0 g. When placed in a graduated cylinder containing 30.0 mL of water, the level rises to 47.2 mL. What is the density of the metal? Give your answer in g/cm³ to two decimal places.
    answer: { value: 8.95, tolerance: 0.03 }
    explanation: |
      Volume = 47.2 − 30.0 = 17.2 mL = 17.2 cm³. Density = 154.0 ÷ 17.2 = 8.953 g/cm³, reported as 8.95 g/cm³ (three significant figures). This matches copper, 8.96 g/cm³.

  - slug: chem-u01-exam-q38
    type: numeric
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Convert 4.80 × 10⁴ mg to kilograms. Give your answer in kg to three decimal places.
    answer: { value: 0.048, tolerance: 0.0005 }
    explanation: |
      4.80 × 10⁴ mg × (1 g / 1,000 mg) × (1 kg / 1,000 g) = 4.80 × 10⁻² kg = 0.0480 kg. Each factor of 1,000 moves the decimal three places.

  - slug: chem-u01-exam-q39
    type: numeric
    topic_code: "1.6"
    source: "NIST CODATA (calorie-joule relation)"
    points: 1
    prompt: |
      A glass of juice supplies 110 food Calories. Using 1 Cal = 4.184 kJ, how much energy is that in kilojoules? Give your answer to the nearest whole kJ.
    answer: { value: 460, tolerance: 1 }
    explanation: |
      110 Cal × 4.184 kJ/Cal = 460.2 kJ, which rounds to 460 kJ. The food Calorie is a kilocalorie, a thousand small calories.

  # ---- Short answer
  - slug: chem-u01-exam-q40
    type: short_answer
    topic_code: "1.2"
    source: "general knowledge"
    points: 3
    prompt: |
      A student is given a dry mixture of powdered sulfur (insoluble in water, not magnetic, yellow), sodium chloride (soluble in water) and iron filings (magnetic).

      (a) Describe a procedure to separate the three components and recover each one.
      (b) Explain why the mass percent of sodium chloride in this mixture can take any value, while the mass percent of sodium in pure sodium chloride cannot.
      (c) After the separation, the student heats the recovered sulfur with the recovered iron filings and a black solid forms that is not attracted to a magnet. State what kind of change this is and justify your answer.
    answer: |
      (a) Pass a magnet over the dry mixture to remove the iron filings. Add water and stir to dissolve the sodium chloride; filter to collect the insoluble sulfur on the paper and rinse and dry it. Evaporate the water from the filtrate to recover the sodium chloride.
      (b) The mixture can be made with any proportions, so its mass percent of salt depends on how much was mixed in. Sodium chloride is a compound with a fixed 1:1 ratio of sodium to chlorine, so its mass percent of sodium is a fixed property (about 39.3%).
      (c) A chemical change. A new substance (iron sulfide) with new properties formed: it is black rather than yellow and grey, and it is no longer magnetic, so the iron and sulfur are no longer present as themselves.
    explanation: |
      Three points, one per part.

      (a) 1 pt: magnet, dissolve, filter, evaporate in a workable order, each component recovered.

      (b) 1 pt: variable composition of a mixture versus the fixed formula ratio of a compound.

      (c) 1 pt: chemical change, justified by the formation of a new substance with new properties (colour, loss of magnetism).

  - slug: chem-u01-exam-q41
    type: short_answer
    topic_code: "1.4"
    source: "general knowledge"
    points: 3
    stimulus: |
      | Trial | Mass of sample (g) | Volume of sample (mL) |
      |---|---|---|
      | 1 | 12.6 | 10.0 |
      | 2 | 25.2 | 20.0 |
      | 3 | 37.9 | 30.0 |
    prompt: |
      Using the table, answer (a), (b) and (c).

      (a) Calculate the density from each trial, to the correct number of significant figures, and state what the agreement among them tells you.
      (b) Explain why the ratio mass ÷ volume stays the same although both mass and volume change.
      (c) Reference densities are glycerol 1.26 g/mL and corn syrup 1.38 g/mL. Identify the liquid and give the percent error of the mean density against that reference.
    answer: |
      (a) 12.6 ÷ 10.0 = 1.26 g/mL; 25.2 ÷ 20.0 = 1.26 g/mL; 37.9 ÷ 30.0 = 1.26 g/mL (1.263 rounded to three significant figures). The agreement shows the measurements are precise and consistent.
      (b) Density is an intensive property: doubling the amount doubles both mass and volume, so their ratio is unchanged. The mass-volume graph is a straight line through the origin with the density as its slope.
      (c) The liquid is glycerol. Mean density = 1.26 g/mL; percent error = |1.26 − 1.26| ÷ 1.26 × 100 = 0.0% (using 1.263 gives 0.2%).
    explanation: |
      Three points, one per part.

      (a) 1 pt: three densities of 1.26 g/mL with three significant figures and a statement about precision or consistency.

      (b) 1 pt: density as intensive, with the proportional change in mass and volume explained.

      (c) 1 pt: glycerol identified and a percent error near 0% correctly computed.

  # ---- Long answer
  - slug: chem-u01-exam-q42
    type: long_answer
    topic_code: "1.1"
    source: "general knowledge"
    points: 6
    prompt: |
      A classmate claims that "sugar dissolves faster in hot water than in cold water." Design an investigation to test this claim.

      In your answer: state a testable hypothesis in "if … then … because …" form; identify the independent, dependent and controlled variables; describe the procedure, including how you will make the measurements, what instruments you will use and how many trials you will run; explain how you will decide whether the hypothesis is supported; and explain, using the particle model, why you expect the result you predict. Finally, state whether dissolving sugar is a physical or chemical change and how you could show it.
    answer: |
      Hypothesis: If sugar is added to water at a higher temperature, then it will dissolve in less time, because faster-moving water particles collide with the sugar crystals more often and with more energy.

      Variables: independent, water temperature (for example 10, 25, 40, 55 and 70 °C); dependent, time for a fixed mass of sugar to dissolve completely; controlled, mass of sugar (5.00 g), volume of water (100.0 mL), stirring (none, or the same rate), sugar grain size, beaker type.

      Procedure: measure 100.0 mL of water in a graduated cylinder into a beaker, adjust it to the target temperature in a water bath and check with a thermometer; add 5.00 g of sugar weighed on a balance; start a stopwatch and stop it when no crystals are visible against a black background. Run three trials at each temperature and average them. Record all data in a table with units.

      Analysis: plot mean dissolving time against temperature. If the time falls steadily as temperature rises, and the differences are larger than the spread among the three trials at each temperature, the hypothesis is supported.

      Explanation: at higher temperature the water particles have more kinetic energy; they strike the crystal surfaces more often and harder, breaking sugar molecules away and carrying them off faster.

      Dissolving is a physical change: the sugar can be recovered unchanged by evaporating the water, and no new substance with new properties forms.
    explanation: |
      Six points.

      1 pt: a testable hypothesis in if-then-because form that predicts a direction.

      1 pt: independent, dependent and at least two controlled variables correctly identified.

      1 pt: a procedure with specific measurements and instruments (balance, graduated cylinder, thermometer, stopwatch) and a clear end point.

      1 pt: replicate trials and a method of comparison (averages, a graph, differences larger than scatter).

      1 pt: a particle-model explanation linking temperature to particle motion and collision frequency.

      1 pt: dissolving classified as a physical change with a way to show it (recovery by evaporation).
