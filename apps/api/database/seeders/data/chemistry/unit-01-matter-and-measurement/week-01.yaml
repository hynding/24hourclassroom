week: 1
unit: 1
title: "What Chemistry Is and How Matter Is Sorted"
topics: ["1.1", "1.2"]
guide: guides/week-01.md
guide_description: |
  What chemistry studies and how chemists investigate: the scientific method as a loop, hypotheses that can fail,
  independent, dependent and controlled variables, theory versus law and observation versus inference. Then the
  map of matter: pure substances (elements and compounds) against mixtures (homogeneous and heterogeneous), and
  which separation method fits which mixture. Worked examples on experimental design, a three-part separation and
  mass percent of a mixture.
flashcards_description: |
  28 cards on the scientific method, variables, theory and law, and on classifying matter as element, compound,
  homogeneous or heterogeneous mixture, plus the separation methods.

flashcards:
  - front: Chemistry → the three questions it asks about any sample
    back: |
      What is it made of (composition), how is it put together (structure), and how does it change (reactions). Rust on a bike: iron oxide, formed by iron reacting with oxygen and water, prevented by a coating.
    topic_code: "1.1"
  - front: Matter → the two-part definition
    back: |
      Anything that has mass and occupies space. Light and heat are not matter; air, water and a grain of salt are.
    topic_code: "1.1"
  - front: Scientific method → the six steps as a loop
    back: |
      Observe and ask a question; form a testable hypothesis; design an experiment that changes one factor; collect qualitative and quantitative data; analyse and conclude; communicate so others can repeat it, then start again.
    topic_code: "1.1"
  - front: Hypothesis → what makes one testable
    back: |
      It predicts a specific, measurable outcome that could turn out false, usually as "if … then … because …". "Salt affects boiling" is vague; "10 g of salt in 100 g of water raises the boiling point above 100 °C" can be checked.
    topic_code: "1.1"
  - front: Independent variable → how to spot it in an experiment
    back: |
      The one factor the experimenter deliberately changes between trials. In a test of salt and boiling point, it is the mass of salt added.
    hint: "I change it"
    topic_code: "1.1"
  - front: Dependent variable → how to spot it
    back: |
      The quantity measured to see the effect of the change. In the salt experiment it is the boiling point read from the thermometer.
    hint: "I measure it"
    topic_code: "1.1"
  - front: Controlled variables → why they must stay fixed
    back: |
      Everything else that could affect the result (water volume, pressure, heater, container). If two things change at once, the effect cannot be blamed on either one.
    topic_code: "1.1"
  - front: Control trial → its purpose in a chemistry experiment
    back: |
      A trial with no treatment (plain water with no salt) that gives the baseline. Without it, "the boiling point was 101 °C" has nothing to be compared with.
    topic_code: "1.1"
  - front: Theory versus scientific law → which explains and which describes
    back: |
      A law describes what always happens, often as an equation (mass is conserved). A theory explains why (atoms are rearranged, not created or destroyed). A theory never becomes a law; they answer different questions.
    topic_code: "1.1"
  - front: Observation versus inference → telling them apart in lab notes
    back: |
      An observation is recorded directly ("the flame was green"); an inference is a conclusion drawn from it ("copper is present"). Inferences can be wrong, so note them separately.
    topic_code: "1.1"
  - front: Qualitative versus quantitative data → examples of each
    back: |
      Qualitative data describe without numbers: colour, odour, bubbles, a precipitate. Quantitative data are measured: 24.6 g, 98.2 °C, 50.0 mL.
    topic_code: "1.1"
  - front: Replicate trials → why run each condition more than once
    back: |
      Repeating shows how much results scatter by chance. A difference between conditions means something only if it is larger than that scatter.
    topic_code: "1.1"
  - front: Pure substance → definition and its two kinds
    back: |
      Matter with one fixed composition and therefore fixed properties. It is either an element (one kind of atom) or a compound (two or more elements in a fixed ratio).
    topic_code: "1.2"
  - front: Element → definition with examples
    back: |
      A substance made of only one kind of atom; it cannot be broken down by chemical means. Copper, neon, oxygen gas (O₂) and sulfur (S₈) are all elements.
    topic_code: "1.2"
  - front: Compound → definition and the properties rule
    back: |
      Two or more elements chemically bonded in a fixed ratio by mass. Its properties differ from its elements': sodium (reactive metal) plus chlorine (toxic gas) gives table salt.
    topic_code: "1.2"
  - front: Diatomic molecule of one element (O₂, N₂, Cl₂) → element or compound?
    back: |
      An element. A compound needs at least two different elements. O₂ is two atoms of the same element bonded together.
    topic_code: "1.2"
  - front: Mixture → definition and the separation test
    back: |
      Two or more substances physically combined in any proportion. Because no bonds form between the components, a mixture can be separated by physical means such as filtering or evaporating.
    topic_code: "1.2"
  - front: Homogeneous mixture → what makes it one, with examples
    back: |
      Uniform throughout with a single visible phase; also called a solution. Salt water, vinegar, air and brass are all homogeneous. Solutions can be solid, liquid or gas.
    topic_code: "1.2"
  - front: Heterogeneous mixture → what makes it one, with examples
    back: |
      Its parts are visibly different or not evenly spread: sand in water, oil and water, granite, cereal in milk. Two or more phases are present.
    topic_code: "1.2"
  - front: Alloy → what kind of matter it is
    back: |
      A homogeneous mixture of metals (a solid solution): brass is copper and zinc, sterling silver is silver and copper, steel is iron with a little carbon. The proportions can vary, so it is not a compound.
    topic_code: "1.2"
  - front: Air → how to classify it and why
    back: |
      A homogeneous mixture of gases (about 78% N₂, 21% O₂, 1% Ar, with CO₂ and water vapour). Its composition varies with place and humidity, so it is not a compound.
    topic_code: "1.2"
  - front: Fixed ratio test → mixture or compound?
    back: |
      If any proportion of the parts still makes "the same stuff" (weak or strong tea), it is a mixture. If the ratio is fixed by a formula (always 2 H to 1 O in water), it is a compound.
    topic_code: "1.2"
  - front: Filtration → which mixtures it separates
    back: |
      An insoluble solid from a liquid, using particle size: sand stays on the paper, water passes through. It does nothing for a dissolved solid.
    topic_code: "1.2"
  - front: Evaporation versus distillation → when to use each
    back: |
      Evaporation recovers a dissolved solid by boiling away the liquid (salt from salt water). Distillation recovers the liquid too, by boiling it off and condensing the vapour; it also separates liquids with different boiling points.
    topic_code: "1.2"
  - front: Chromatography → the property it exploits
    back: |
      Components differ in how strongly they stick to a surface versus dissolve in a moving solvent, so they travel different distances. Used to separate the dyes in an ink.
    topic_code: "1.2"
  - front: Sand, salt and iron filings → the four-step separation
    back: |
      Magnet removes the iron; add water to dissolve the salt; filter off the sand; evaporate the filtrate to recover the salt. Each step uses a property only one component has.
    topic_code: "1.2"
  - front: Mass percent of a mixture component → formula
    back: |
      Mass percent = (mass of component ÷ total mass of mixture) × 100. A 50.0 g brass sample with 17.0 g of zinc is 34.0% zinc. For a mixture the percent is whatever was mixed; for a compound it is fixed by the formula.
    topic_code: "1.2"
  - front: Decomposing water with electricity → why it proves water is a compound
    back: |
      Electrolysis makes two new substances, hydrogen and oxygen, with their own properties. A change that produces new substances is chemical, so water cannot be a mixture; it is a compound of H and O.
    topic_code: "1.2"

quiz:
  description: |
    22 questions · about 35 minutes · all on this week (topics 1.1 and 1.2: the scientific method and classifying
    matter), with no review yet because this is week 1. Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes.
  questions:
    # ---- Multiple choice (1.1)
    - slug: chem-u01-w01-q01
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A student measures how the mass of salt dissolved in 100 g of water changes the water's boiling point. Which quantity is the dependent variable?
      options:
        - "The mass of salt added"
        - "The mass of water"
        - "The boiling point of the solution"
        - "The type of thermometer used"
      option_explanations:
        - |
          The mass of salt is what the student chooses and changes, which makes it the independent variable.
        - |
          The mass of water is held at 100 g in every trial, so it is a controlled variable, not something measured for an effect.
        - |
          Correct. The boiling point is what is measured to see the effect of the salt; the measured outcome is the dependent variable.
        - |
          The thermometer should be the same in every trial; it is a controlled variable, not the outcome.
      answer: 2
      explanation: |
        Independent = what you change; dependent = what you measure; controlled = what you keep the same.

    - slug: chem-u01-w01-q02
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best describes the difference between a scientific theory and a scientific law?
      options:
        - "A law is a theory that has been proven true"
        - "A law applies to chemistry; a theory applies to physics"
        - "A theory is a guess; a law is a fact"
        - "A theory explains why something happens; a law describes what happens"
      option_explanations:
        - |
          Theories do not become laws with more evidence; the two are different kinds of statement that answer different questions.
        - |
          Both theories and laws occur in every science; the subject does not decide which word applies.
        - |
          In science a theory is a well-tested explanation backed by much evidence, not a guess, and laws can be refined too.
        - |
          Correct. The law of conservation of mass says mass is unchanged in a reaction; atomic theory explains why, because atoms are only rearranged.
      answer: 3

    - slug: chem-u01-w01-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following is an observation rather than an inference?
      options:
        - "The solution contains copper ions"
        - "The flame turned green when the wire was held in it"
        - "The reaction must have been exothermic"
        - "The sample is probably contaminated"
      option_explanations:
        - |
          Saying copper is present is a conclusion drawn from evidence such as a flame colour, so it is an inference.
        - |
          Correct. The colour of the flame is recorded directly by the senses; no interpretation is added.
        - |
          "Must have been" signals a conclusion reached from something observed, such as the beaker feeling warm.
        - |
          "Probably contaminated" is a judgement about the cause of some observation, not the observation itself.
      answer: 1

    - slug: chem-u01-w01-q04
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A student tests whether light colour affects plant growth by growing one plant under red light on a warm windowsill and one under blue light in a cool basement. What is the main flaw in the design?
      options:
        - "Two plants are too many for a fair test"
        - "Plant height cannot be measured accurately"
        - "More than one variable differs between the two plants"
        - "Red and blue light are the same colour to plants"
      option_explanations:
        - |
          More plants, not fewer, would improve the test by showing how much growth varies by chance.
        - |
          Height is easy to measure with a ruler; the measurement is not the problem.
        - |
          Correct. Temperature and location change along with light colour, so any difference in growth cannot be blamed on the light alone.
        - |
          Plants respond differently to red and blue light; the point of the experiment is exactly that comparison.
      answer: 2

    - slug: chem-u01-w01-q05
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which hypothesis is written so that an experiment could show it to be wrong?
      options:
        - "Stirring probably has something to do with dissolving"
        - "If a sugar cube is stirred in water, then it will dissolve in less time than an unstirred cube, because stirring brings fresh water to its surface"
        - "Sugar is interesting to study in water"
        - "Dissolving is caused by many factors"
      option_explanations:
        - |
          "Something to do with" names no measurable outcome, so no result could contradict it.
        - |
          Correct. It names the change (stirring), the measured outcome (time to dissolve), the predicted direction and a reason, so a timing experiment could support or refute it.
        - |
          A statement of interest predicts nothing and cannot be tested.
        - |
          True but untestable as written: it names no specific factor, direction or measurement.
      answer: 1

    - slug: chem-u01-w01-q06
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which sample is a pure substance?
      options:
        - "Salt water"
        - "Brass"
        - "Milk"
        - "Carbon dioxide"
      option_explanations:
        - |
          Salt water is a homogeneous mixture; the salt can be recovered by evaporating the water, and any amount of salt can be dissolved.
        - |
          Brass is an alloy, a solid solution of copper and zinc in proportions that vary from one brass to another.
        - |
          Milk is a mixture of water, fats, proteins and sugars, and it separates when left standing.
        - |
          Correct. Carbon dioxide is a compound with a fixed composition, one carbon atom to two oxygen atoms, and fixed properties.
      answer: 3

    - slug: chem-u01-w01-q07
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Sodium is a soft metal that reacts violently with water, and chlorine is a toxic yellow-green gas, yet sodium chloride is a harmless white solid used on food. What does this best illustrate?
      options:
        - "Mixtures keep the properties of their components"
        - "Sodium chloride is a heterogeneous mixture of sodium and chlorine"
        - "Elements cannot combine with one another"
        - "A compound has properties different from the elements that make it up"
      option_explanations:
        - |
          Mixtures do keep their components' properties, which is why sodium chloride, which does not, cannot be a mixture.
        - |
          Sodium chloride has a fixed 1:1 ratio and cannot be separated into sodium and chlorine by physical means, so it is a compound.
        - |
          Elements combine readily; the question describes exactly such a combination.
        - |
          Correct. Chemical bonding produces a new substance with its own properties; the metal and the gas are gone, replaced by a salt.
      answer: 3

    - slug: chem-u01-w01-q08
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A sample looks uniform to the eye and under a microscope and has a single phase, but its composition varies from batch to batch. It is best classified as which of the following?
      options:
        - "An element"
        - "A compound"
        - "A homogeneous mixture"
        - "A heterogeneous mixture"
      option_explanations:
        - |
          An element has a fixed composition by definition; a batch-to-batch variation rules out a pure substance.
        - |
          A compound's composition is fixed by its formula and never varies between samples.
        - |
          Correct. Uniform with one phase means homogeneous; variable composition means mixture; together, a solution.
        - |
          A heterogeneous mixture would show visibly distinct regions or phases, which this sample does not.
      answer: 2

    - slug: chem-u01-w01-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which separation method relies on a difference in boiling points?
      options:
        - "Distillation"
        - "Filtration"
        - "Magnetic separation"
        - "Decanting"
      option_explanations:
        - |
          Correct. In distillation the more volatile liquid boils off first, is condensed and collected, leaving less volatile components behind.
        - |
          Filtration uses particle size to hold back an insoluble solid while the liquid passes through.
        - |
          A magnet pulls out magnetic solids such as iron filings; boiling plays no part.
        - |
          Decanting pours a liquid off a settled solid or a denser liquid layer, using density, not boiling point.
      answer: 0

    - slug: chem-u01-w01-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Oxygen gas, O₂, is made of molecules containing two atoms. How is it classified?
      options:
        - "A compound, because it has more than one atom"
        - "A homogeneous mixture of two oxygen atoms"
        - "An element, because every atom is the same kind"
        - "A heterogeneous mixture, because the atoms are separate"
      option_explanations:
        - |
          A compound needs at least two different elements; two atoms of the same element bonded together are still one element.
        - |
          The atoms in O₂ are chemically bonded, not physically mixed, and both are oxygen anyway.
        - |
          Correct. A substance made of only one kind of atom is an element, whether the atoms are single or joined in molecules.
        - |
          The atoms are bonded into a molecule; nothing is mixed, and there is only one kind of atom.
      answer: 2

    - slug: chem-u01-w01-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Passing electricity through water produces hydrogen gas and oxygen gas. Why does this show that water is a compound rather than a mixture?
      options:
        - "The change produced new substances with different properties, so it was a chemical change, not a physical separation"
        - "Mixtures cannot conduct electricity"
        - "Hydrogen and oxygen are both gases"
        - "The water had to be heated first"
      option_explanations:
        - |
          Correct. A mixture can be taken apart by physical means; water needed a chemical change to yield hydrogen and oxygen, which are new substances.
        - |
          Many mixtures conduct electricity, salt water among them; conduction is not the point.
        - |
          The phase of the products is irrelevant; what matters is that they are different substances from water.
        - |
          Electrolysis does not require heating, and heating would not change the argument.
      answer: 0

    # ---- Multi-select
    - slug: chem-u01-w01-q12
      type: multi_select
      topic_code: "1.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are homogeneous mixtures? Select all that apply.
      options:
        - "Vinegar"
        - "Granite"
        - "Air"
        - "Stainless steel"
        - "Muddy water"
      option_explanations:
        - |
          Correct. Vinegar is acetic acid dissolved in water, uniform throughout and of variable strength.
        - |
          Granite shows visible grains of quartz, feldspar and mica, so it is heterogeneous.
        - |
          Correct. Air is a uniform solution of gases whose proportions vary with place and humidity.
        - |
          Correct. Stainless steel is an alloy, a solid solution of iron, chromium and nickel.
        - |
          Suspended soil particles make muddy water visibly non-uniform; they settle out, so it is heterogeneous.
      answer: [0, 2, 3]

    - slug: chem-u01-w01-q13
      type: multi_select
      topic_code: "1.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A student plans to test whether water temperature affects how fast an antacid tablet dissolves. Which of the following should be controlled variables? Select all that apply.
      options:
        - "The volume of water"
        - "The water temperature"
        - "The brand and size of tablet"
        - "The time taken to dissolve"
        - "Whether the water is stirred"
      option_explanations:
        - |
          Correct. More water could dissolve the tablet faster, so the volume must be the same in every trial.
        - |
          Temperature is the independent variable, deliberately changed between trials, not held constant.
        - |
          Correct. A bigger or different tablet would dissolve at a different rate regardless of temperature.
        - |
          Time to dissolve is the dependent variable, the outcome that is measured.
        - |
          Correct. Stirring speeds dissolving, so every trial must be stirred the same way or not at all.
      answer: [0, 2, 4]

    # ---- True / false
    - slug: chem-u01-w01-q14
      type: true_false
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A homogeneous mixture must be a liquid.
      answer: false
      explanation: |
        False. Solutions exist in every state: brass and sterling silver are solid solutions, air is a gaseous one. Homogeneous means uniform throughout with a single phase, not liquid.

    - slug: chem-u01-w01-q15
      type: true_false
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Once enough evidence supports a scientific theory, it is promoted to a scientific law.
      answer: false
      explanation: |
        False. Laws describe what happens; theories explain why. More evidence makes a theory better supported, but it stays a theory because it still answers the "why" question.

    # ---- Fill in the blank
    - slug: chem-u01-w01-q16
      type: fill_blank
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A substance made of two or more elements chemically bonded in a fixed ratio is called a ____.
      answer: ["compound", "chemical compound"]
      explanation: |
        A compound has a formula that fixes the ratio of its elements and properties unlike those of the elements themselves. Water, carbon dioxide and sodium chloride are compounds.

    - slug: chem-u01-w01-q17
      type: fill_blank
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        In an experiment, the factor that the experimenter deliberately changes is called the ____ variable.
      answer: ["independent", "manipulated"]
      explanation: |
        The independent (or manipulated) variable is the cause being tested; the dependent variable is the measured effect, and everything else is controlled.

    # ---- Numeric
    - slug: chem-u01-w01-q18
      type: numeric
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A 40.0 g sample of a salt-and-sand mixture is stirred with water and filtered. The dried sand on the filter paper has a mass of 9.0 g. What is the mass percent of salt in the original mixture? Give your answer as a percentage to one decimal place.
      answer: { value: 77.5, tolerance: 0.2 }
      explanation: |
        Salt mass = 40.0 − 9.0 = 31.0 g. Mass percent = 31.0 ÷ 40.0 × 100 = 77.5%. The sand was insoluble and stayed on the paper; everything else was salt, now dissolved in the filtrate.

    - slug: chem-u01-w01-q19
      type: numeric
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A brass sample has a mass of 125.0 g and is 65.0% copper by mass, the rest zinc. What mass of zinc does it contain? Give your answer in grams to one decimal place.
      answer: { value: 43.75, tolerance: 0.1 }
      explanation: |
        Zinc is 100.0 − 65.0 = 35.0% of the sample. 0.350 × 125.0 g = 43.75 g, which rounds to 43.8 g. (Copper: 0.650 × 125.0 = 81.25 g; the two add to 125.0 g.)

    # ---- Short answer
    - slug: chem-u01-w01-q20
      type: short_answer
      topic_code: "1.2"
      source: "general knowledge"
      points: 3
      prompt: |
        A beaker contains a mixture of iron filings, sugar and small pebbles.

        (a) Describe a sequence of steps that would separate all three components.
        (b) For each step, name the property that lets it work.
        (c) Explain why none of these steps could separate the sugar into carbon, hydrogen and oxygen.
      answer: |
        (a) Pass a magnet over the dry mixture to remove the iron filings. Add water and stir to dissolve the sugar; pour or filter to remove the pebbles. Evaporate the water from the filtrate to recover the sugar.
        (b) Magnetism (only iron is attracted); solubility and particle size (sugar dissolves, pebbles do not and are held back by the filter or left behind when decanting); volatility (water evaporates, sugar does not).
        (c) The steps are all physical separations that use differences between substances in a mixture. Sugar is a compound: its carbon, hydrogen and oxygen are chemically bonded in a fixed ratio, so taking it apart needs a chemical change, not a physical one.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a workable order (magnet, dissolve, filter or decant, evaporate). Accept filtering the pebbles before or after dissolving the sugar as long as the sugar is dissolved before evaporation.

        (b) 1 pt: at least two properties correctly matched to their steps: magnetism, solubility or particle size, boiling point or volatility.

        (c) 1 pt: sugar is a compound whose elements are bonded; separating elements requires a chemical change, which filtration, evaporation and magnets cannot do.

    - slug: chem-u01-w01-q21
      type: short_answer
      topic_code: "1.1"
      source: "general knowledge"
      points: 3
      stimulus: |
        A student writes in a lab notebook: "I added a piece of zinc to the acid. Bubbles formed and the test tube got warm. The gas must be hydrogen and the reaction is exothermic. I think a bigger piece of zinc would make more bubbles."
      prompt: |
        Using the notebook entry, answer (a), (b) and (c).

        (a) Identify one observation and one inference in the entry.
        (b) Rewrite the student's final sentence as a testable hypothesis.
        (c) Name the independent and dependent variables in the experiment that would test it, and one variable that must be controlled.
      answer: |
        (a) Observations: bubbles formed; the tube got warm. Inferences: the gas is hydrogen; the reaction is exothermic.
        (b) "If a larger mass of zinc is added to the same volume and concentration of acid, then a greater volume of gas will be collected, because more zinc is available to react."
        (c) Independent: mass of zinc. Dependent: volume of gas collected (or rate of bubbling). Controlled: acid concentration, acid volume, temperature, size of zinc pieces (surface area).
      explanation: |
        Three points, one per part.

        (a) 1 pt: one correct observation (bubbles, warmth) and one correct inference (hydrogen, exothermic). Zero if the two are swapped.

        (b) 1 pt: a hypothesis naming what will change, what will be measured and a predicted direction; an "if … then" form with a reason is ideal but not required.

        (c) 1 pt: independent = mass (or amount) of zinc; dependent = amount or volume of gas or the rate; plus one sensible controlled variable such as acid concentration, volume or temperature.

    # ---- Long answer
    - slug: chem-u01-w01-q22
      type: long_answer
      topic_code: "1.2"
      source: "general knowledge"
      points: 6
      prompt: |
        A classmate says: "Everything is either an element or a mixture. Compounds are just mixtures of elements that are stuck together really well."

        Write a response that explains, with examples, how chemists distinguish elements, compounds and mixtures. Include the role of fixed composition, the difference between physical separation and chemical decomposition, and what happens to properties when elements form a compound. Explain why air, water and brass each belong where they do.
      answer: |
        Matter is first divided into pure substances and mixtures by composition. A pure substance has one fixed composition and fixed properties; a mixture can be made in any proportion and its parts keep their own properties. Elements and compounds are both pure substances. An element has one kind of atom and cannot be broken down chemically (copper, neon, O₂). A compound has two or more elements bonded in a fixed ratio, such as water (always 2 H to 1 O by atoms, 11.2% H by mass).

        The classmate's claim fails on three tests. Composition: a mixture's proportions vary (tea can be weak or strong), but a compound's are fixed by its formula. Separation: a mixture comes apart by physical means (filtering sand from water, evaporating salt water), while a compound needs a chemical change, such as electrolysis of water into hydrogen and oxygen. Properties: a mixture's components keep their properties, but a compound's properties are new: sodium is a reactive metal and chlorine a toxic gas, yet sodium chloride is table salt.

        Air is a homogeneous mixture of gases in variable proportions that can be separated by cooling and distillation. Water is a compound with a fixed ratio that needs electricity to decompose. Brass is a solid solution of copper and zinc in variable proportions that keeps the metallic properties of both, so it is a mixture, not a compound. Compounds are therefore a separate category, not well-mixed mixtures.
      explanation: |
        Six points.

        1 pt: states the pure substance versus mixture division and that compounds are pure substances, directly contradicting the claim.

        1 pt: fixed versus variable composition, with at least one example of each.

        1 pt: physical separation of mixtures versus chemical decomposition of compounds, with a named method for each (filtration, evaporation, distillation versus electrolysis or heating to decompose).

        1 pt: properties: components of a mixture keep their properties; a compound has new properties (sodium chloride or a similar example).

        1 pt: correctly places air (homogeneous mixture), water (compound) and brass (homogeneous mixture or alloy) with a reason for each.

        1 pt: clear organisation and accurate use of terms (element, compound, homogeneous, heterogeneous) throughout.
