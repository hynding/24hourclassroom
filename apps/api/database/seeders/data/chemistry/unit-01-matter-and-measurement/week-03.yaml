    - slug: chem-u01-w03-q23
      type: long_answer
      topic_code: "1.6"
      source: "general knowledge"
      points: 6
      prompt: |
        Use the particle model of matter to explain the following everyday observations, naming the state or phase change in each: a solid brick keeps its shape; water poured into a glass takes the glass's shape but does not fill it; a sealed balloon of air can be squeezed smaller; a puddle disappears on a warm day even though the water never boils; dew forms on grass at night.

        Your answer should describe the arrangement and motion of particles in each state, explain the role of attractions between particles compared with their motion, and state for each phase change whether energy is absorbed or released.
      answer: |
        The particle model says matter is made of tiny particles in constant motion that attract one another; the state depends on whether the attractions or the motion dominate.

        A brick is a solid: its particles are packed closely in a fixed, ordered arrangement and only vibrate in place because the attractions between them are much stronger than their motion. That is why it keeps its shape and volume and cannot be compressed.

        Water in a glass is a liquid: the particles are still in contact, so the volume is fixed and the liquid does not expand to fill the glass, but they are disordered and slide past one another, so the water takes the shape of the glass. Attractions and motion are roughly balanced.

        Air in a balloon is a gas: the particles are far apart, moving fast in straight lines with only weak attractions. Squeezing the balloon pushes them into the empty space between them, so a gas is compressible, unlike a solid or a liquid.

        A puddle disappears by evaporation, vaporization that occurs at the surface below the boiling point. The fastest-moving surface particles have enough energy to escape the attractions of their neighbours and become gas. This absorbs energy from the surroundings, which is why evaporation cools.

        Dew forms by condensation: water vapour in the cool night air loses energy, the particles slow, and attractions pull them together into liquid drops on the cold grass. Condensation releases energy to the surroundings.
      explanation: |
        Six points.

        1 pt: the particle model stated: particles in constant motion, attracting each other, with the state set by motion versus attraction.

        1 pt: the solid explained: fixed, ordered, vibrating particles; attractions dominate; fixed shape and volume.

        1 pt: the liquid explained: particles in contact but sliding; fixed volume, variable shape.

        1 pt: the gas explained: widely spaced, fast particles; compressibility due to empty space.

        1 pt: evaporation identified as surface vaporization below the boiling point, with energy absorbed.

        1 pt: dew identified as condensation with energy released, particles slowing and attractions pulling them together.
