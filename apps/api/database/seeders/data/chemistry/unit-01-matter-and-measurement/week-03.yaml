      prompt: |
        A 250 mL cup of water at 80 °C and a 5.0 L bucket of water at 40 °C sit on a bench.

        (a) Which sample has the higher average kinetic energy of its particles? Explain.
        (b) Which sample contains more total energy? Explain.
        (c) A metal spoon at 20 °C is placed in each container. Describe the direction of heat flow in each case and when it stops.
      answer: |
        (a) The cup at 80 °C: temperature measures the average kinetic energy of the particles, and the cup's is higher.
        (b) The bucket: it has twenty times as much water, and although each particle has less energy on average, the total energy of 5.0 L at 40 °C far exceeds that of 250 mL at 80 °C.
        (c) In both cases heat flows from the water (hotter) into the spoon (colder). Heat flow stops when the spoon and the water reach the same temperature; the bucket's temperature barely changes, while the cup's drops noticeably.
      explanation: |
        Three points, one per part.

        (a) 1 pt: the 80 °C cup, with temperature identified as a measure of average kinetic energy.

        (b) 1 pt: the bucket, with the reasoning that total energy depends on the amount of substance as well as temperature.

        (c) 1 pt: heat flows from water to spoon in both cases (hot to cold) until the temperatures are equal.

