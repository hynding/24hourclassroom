week: 3
unit: 1
title: "Unit Conversions, Density, Energy and States"
topics: ["1.5", "1.6"]
guide: guides/week-03.md
guide_description: |
  Dimensional analysis with conversion factors that cancel units, including squared and cubed units and rates;
  density in all three rearrangements, water displacement and the mass-volume graph; energy, heat and temperature
  at the particle level with the kelvin scale; the particle model of solids, liquids and gases and the six phase
  changes. Worked examples on multi-step conversions, identifying a metal by density and compressibility.
flashcards_description: |
  30 cards on conversion factors and dimensional analysis, density calculations and reference values, kinetic and
  potential energy, heat versus temperature, the kelvin scale, and the particle model of the three states.

flashcards:
  - front: Conversion factor → how to build one from an equality
    back: |
      Write the equality as a fraction equal to 1, either way up: from 1 L = 1,000 mL come 1,000 mL / 1 L and 1 L / 1,000 mL. Choose the one whose denominator cancels the unit you have.
    topic_code: "1.5"
  - front: Dimensional analysis → the one check that catches an upside-down factor
    back: |
      Write every unit and cancel as you go. If the unit you want to remove does not cancel, the factor is inverted. Units that survive must be the units of the answer.
    topic_code: "1.5"
  - front: Converting cubic units (cm³ to m³) → the factor to use
    back: |
      Cube the length factor: (1 m / 100 cm)³ = 1 m³ / 1,000,000 cm³. So 2,500 cm³ = 2.5 × 10⁻³ m³. Forgetting to cube gives an answer off by a factor of 10,000.
    topic_code: "1.5"
  - front: Converting a rate (mi/h to m/s) → the procedure
    back: |
      Convert numerator and denominator separately in one chain: 65 mi/h × (1,609 m / 1 mi) × (1 h / 3,600 s) = 29 m/s.
    topic_code: "1.5"
  - front: Exact conversion factors and significant figures → the rule
    back: |
      Defined relations (100 cm = 1 m, 1,000 mL = 1 L, 2.54 cm = 1 in exactly) have unlimited significant figures. Only the measured starting quantity limits the answer.
    topic_code: "1.5"
  - front: Density → formula and units
    back: |
      D = m ÷ V. Solids in g/cm³, liquids in g/mL (the same size unit, since 1 mL = 1 cm³), gases in g/L. Density is intensive: it identifies a substance.
    topic_code: "1.5"
  - front: Density formula → solving for mass or volume
    back: |
      m = D × V and V = m ÷ D. Check units: a density in g/cm³ needs a volume in cm³ (or mL). 50.0 g of ethanol (0.789 g/mL) occupies 50.0 ÷ 0.789 = 63.4 mL.
    topic_code: "1.5"
  - front: Water displacement → finding the volume of an irregular solid
    back: |
      Volume = final water level − initial level. From 25.0 mL rising to 31.4 mL the object is 6.4 mL = 6.4 cm³. The subtraction sets the significant figures of the density that follows.
    topic_code: "1.5"
  - front: Mass-volume graph → what the slope means
    back: |
      Mass on the vertical axis against volume on the horizontal gives a straight line through the origin whose slope is the density. A steeper line is a denser substance.
    topic_code: "1.5"
  - front: Floating and sinking → the density rule
    back: |
      An object floats in a fluid less dense than itself sinks; one denser than the fluid sinks. Ice (0.92 g/cm³) floats on water (1.00); gold (19.3) sinks in mercury (13.5).
    topic_code: "1.5"
  - front: Density of water → the value and its usefulness
    back: |
      About 1.00 g/mL (0.998 at 20 °C, 1.000 at 4 °C). It is the reference for floating and sinking and makes 1 mL of water weigh about 1 g.
    topic_code: "1.5"
  - front: Densities of aluminium, iron, copper, lead and gold → rounded values
    back: |
      Al 2.70, Fe 7.87, Cu 8.96, Pb 11.3, Au 19.3 g/cm³. A measured density near one of these, with the colour, identifies the metal.
    topic_code: "1.5"
  - front: Energy → definition and SI unit
    back: |
      The capacity to do work or transfer heat, measured in joules (J); 1 kJ = 1,000 J. A food Calorie is 4.184 kJ, a small calorie 4.184 J.
    topic_code: "1.6"
  - front: Kinetic energy at the particle level → what it depends on
    back: |
      The motion of the particles (moving, rotating, vibrating). The higher the temperature, the higher the average kinetic energy of the particles.
    topic_code: "1.6"
  - front: Potential energy at the particle level → where it is stored
    back: |
      In the arrangement of particles and the bonds and attractions between them. Chemical changes rearrange atoms and so change potential energy; phase changes change it by separating or bringing together particles.
    topic_code: "1.6"
  - front: Temperature → what it actually measures
    back: |
      The average kinetic energy of the particles in a sample. It does not depend on sample size: a cup of tea and a bathtub can be at the same temperature.
    topic_code: "1.6"
  - front: Heat → the definition chemists use
    back: |
      Energy transferred from a hotter object to a colder one because of their temperature difference. It is energy in transit, not something a body "contains"; the transfer stops when temperatures are equal.
    topic_code: "1.6"
  - front: Heat versus temperature → cup of tea versus bathtub
    back: |
      At the same temperature they have the same average particle kinetic energy, but the bath has far more particles and so far more total energy to transfer. Temperature is an average; heat flow depends on total energy.
    topic_code: "1.6"
  - front: Absolute zero → value in °C and what happens to particles
    back: |
      0 K = −273.15 °C. Particle motion is at its minimum; it is the true zero of the kelvin scale, so kelvin temperatures are proportional to average kinetic energy.
    topic_code: "1.6"
  - front: Kelvin scale → why doubling K doubles average kinetic energy but doubling °C does not
    back: |
      Kelvin starts at a true zero of motion; Celsius starts at water's freezing point, an arbitrary zero. 400 K has twice the average kinetic energy of 200 K; 40 °C does not have twice that of 20 °C.
    topic_code: "1.6"
  - front: Food Calorie to kilojoules → the factor
    back: |
      1 Cal (kilocalorie) = 4.184 kJ. A 150 Cal snack is 150 × 4.184 = 628 kJ.
    topic_code: "1.6"
  - front: Particle model of matter → the three claims
    back: |
      All matter is made of tiny particles; they are in constant motion; they attract one another. The state of a substance depends on how particle motion (temperature) compares with the strength of attraction.
    topic_code: "1.6"
  - front: Solid state → shape, volume and particle behaviour
    back: |
      Fixed shape and fixed volume; not compressible. Particles are tightly packed in an ordered arrangement and vibrate in place; attractions dominate.
    topic_code: "1.6"
  - front: Liquid state → shape, volume and particle behaviour
    back: |
      Takes the shape of its container but has a fixed volume; barely compressible. Particles are close together but disordered and slide past one another.
    topic_code: "1.6"
  - front: Gas state → shape, volume and particle behaviour
    back: |
      Fills the shape and volume of any container; easily compressible. Particles are far apart, move fast and freely, and attractions are weak compared with their motion.
    topic_code: "1.6"
  - front: Why gases compress and liquids do not → particle explanation
    back: |
      Gas particles are separated by large empty spaces, so pushing them closer is easy. Liquid and solid particles are already touching; there is almost no empty space to remove.
    topic_code: "1.6"
  - front: Six phase changes → names and directions
    back: |
      Melting (s→l), freezing (l→s), vaporization (l→g, by evaporation or boiling), condensation (g→l), sublimation (s→g), deposition (g→s).
    topic_code: "1.6"
  - front: Phase changes that absorb energy versus release it → which is which
    back: |
      Melting, vaporization and sublimation absorb energy (particles are separated). Freezing, condensation and deposition release energy (particles come together).
    topic_code: "1.6"
  - front: Temperature during a phase change → what it does and why
    back: |
      It stays constant until the change is complete. The energy added goes into overcoming attractions between particles (potential energy), not into making them move faster.
    topic_code: "1.6"
  - front: Evaporation versus boiling → the difference
    back: |
      Evaporation happens only at the surface and at any temperature, as the fastest particles escape. Boiling happens throughout the liquid at the boiling point, when bubbles of vapour form inside it.
    topic_code: "1.6"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 1.5 and 1.6: dimensional analysis, density, energy
    and the states of matter), with about a third reviewing weeks 1 and 2 (classifying matter, properties and
    changes, significant figures). Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Multiple choice (1.5)
    - slug: chem-u01-w03-q01
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which setup correctly converts 2.5 hours to seconds?
      options:
        - "2.5 h × (1 h / 60 min) × (1 min / 60 s)"
        - "2.5 h × (60 min / 1 h) × (1 min / 60 s)"
        - "2.5 h × (60 s / 1 min) × (1 h / 60 min)"
        - "2.5 h × (60 min / 1 h) × (60 s / 1 min)"
      option_explanations:
        - |
          Both factors are upside down: hours would not cancel and the result would have units of h²/s.
        - |
          The first factor is right but the second is inverted; minutes do not cancel and the answer comes out in min²/s.
        - |
          Hours appear in the numerator of the second factor, so they never cancel; the units do not work.
        - |
          Correct. Hours cancel with the first factor, minutes with the second, leaving seconds: 2.5 × 60 × 60 = 9,000 s.
      answer: 3

    - slug: chem-u01-w03-q02
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A block of metal has a mass of 236 g and a volume of 30.0 cm³. Using the densities Al 2.70, Fe 7.87, Cu 8.96 and Pb 11.3 g/cm³, which metal is it most likely to be?
      options:
        - "Iron"
        - "Aluminium"
        - "Copper"
        - "Lead"
      option_explanations:
        - |
          Correct. 236 g ÷ 30.0 cm³ = 7.87 g/cm³, which matches iron.
        - |
          Aluminium would give a mass of only 2.70 × 30.0 = 81 g for this volume.
        - |
          Copper at 8.96 g/cm³ would have a mass of about 269 g for 30.0 cm³.
        - |
          Lead at 11.3 g/cm³ would have a mass of about 339 g for 30.0 cm³.
      answer: 0

    - slug: chem-u01-w03-q03
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: Mass in grams is plotted on the vertical axis against volume in cm³ on the horizontal axis for three substances. Each gives a straight line through the origin. Line X passes through (10 cm³, 27 g), line Y through (10 cm³, 79 g) and line Z through (10 cm³, 113 g). What does the slope of each line represent, and which substance is densest?
      options:
        - "The slope is the mass; X is densest"
        - "The slope is the volume; Y is densest"
        - "The slope is the density; Z is densest"
        - "The slope is the temperature; Z is densest"
      option_explanations:
        - |
          Mass is a single coordinate, not a slope, and X has the smallest mass per volume.
        - |
          Volume is the horizontal axis; the slope is rise over run, mass per volume, and Y is not the steepest line.
        - |
          Correct. Slope = mass ÷ volume = density. Z has 11.3 g/cm³ (lead), Y 7.9 (iron) and X 2.7 (aluminium).
        - |
          Temperature is not plotted; the graph relates mass and volume only.
      answer: 2

    # ---- Multiple choice (1.6)
    - slug: chem-u01-w03-q05
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement about heat and temperature is correct?
      options:
        - "Temperature measures the average kinetic energy of particles; heat is energy transferred because of a temperature difference"
        - "Heat and temperature are two names for the same quantity"
        - "A large object always has a higher temperature than a small one"
        - "Heat flows from a cold object to a hot one until both are the same temperature"
      option_explanations:
        - |
          Correct. Temperature is an average per particle; heat is the energy that moves from hotter to colder and stops when temperatures match.
        - |
          They are different: a bath and a cup of tea at the same temperature can transfer very different amounts of heat.
        - |
          Size does not set temperature; an iceberg is larger and colder than a cup of coffee.
        - |
          Heat flows spontaneously from hot to cold, never the reverse, until the temperatures are equal.
      answer: 0

    - slug: chem-u01-w03-q06
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A sample of ice is heated steadily. While it is melting, the temperature stays at 0 °C. What is the added energy doing during this time?
      options:
        - "Increasing the average speed of the water molecules"
        - "Being destroyed, since the thermometer does not change"
        - "Escaping as light"
        - "Separating molecules from their fixed positions in the solid, raising potential energy"
      option_explanations:
        - |
          A constant temperature means the average kinetic energy, and so the average speed, is not changing.
        - |
          Energy is conserved; it is stored in the sample even though the temperature does not rise.
        - |
          Melting ice gives off no light; the energy stays in the water.
        - |
          Correct. During a phase change the energy overcomes the attractions holding particles in place, so potential energy rises while kinetic energy, and temperature, stays constant.
      answer: 3

    - slug: chem-u01-w03-q07
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Why can a gas be compressed into a much smaller volume while a liquid cannot?
      options:
        - "Gas particles are softer than liquid particles"
        - "Liquid particles repel each other strongly"
        - "Gas particles are far apart with empty space between them; liquid particles are already in contact"
        - "Liquids have fewer particles than gases"
      option_explanations:
        - |
          Particles are the same whether the substance is a gas or a liquid; hardness is not the explanation.
        - |
          Particles in a liquid attract one another; it is their close contact, not repulsion, that prevents compression.
        - |
          Correct. Compressing a gas mainly closes the empty space between widely separated particles; a liquid has almost no such space.
        - |
          The number of particles depends on the sample, not the state; a litre of liquid has far more particles than a litre of gas.
      answer: 2

    - slug: chem-u01-w03-q08
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Frost forms on a cold windowpane overnight from water vapour in the air. Which phase change is this, and is energy absorbed or released by the water?
      options:
        - "Freezing; energy is absorbed"
        - "Deposition; energy is released"
        - "Condensation; energy is absorbed"
        - "Sublimation; energy is released"
      option_explanations:
        - |
          Freezing is liquid to solid; here vapour becomes solid directly, and forming a solid releases energy rather than absorbing it.
        - |
          Correct. Gas turning directly into solid is deposition, and bringing particles together into an ordered solid releases energy to the surroundings.
        - |
          Condensation gives a liquid, not frost, and it releases energy.
        - |
          Sublimation is the reverse process, solid to gas, and it absorbs energy.
      answer: 1

    # ---- Spiral review
    - slug: chem-u01-w03-q09
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A density is calculated as 24.8 g ÷ 9.2 mL. How should the result be reported?
      options:
        - "2.695 g/mL"
        - "2.70 g/mL"
        - "2.6957 g/mL"
        - "2.7 g/mL"
      option_explanations:
        - |
          Four significant figures exceed what the 9.2 mL measurement, with two, can support.
        - |
          Three significant figures are more than the two-figure volume allows.
        - |
          Reporting five figures claims precision that neither measurement had.
        - |
          Correct. For division the answer keeps the fewest significant figures of the data, two from 9.2 mL, so 2.6957 rounds to 2.7 g/mL.
      answer: 3

    - slug: chem-u01-w03-q10
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following describes a physical change that is accompanied by a release of energy?
      options:
        - "Steam condensing on a cold mirror"
        - "Natural gas burning on a stove"
        - "Ice melting in a glass"
        - "Iron rusting on a gate"
      option_explanations:
        - |
          Correct. Condensation is a change of state, so physical, and gas particles releasing energy as they come together into a liquid.
        - |
          Burning releases energy but makes new substances, so it is a chemical change.
        - |
          Melting is physical, but it absorbs energy from the surroundings rather than releasing it.
        - |
          Rusting releases energy slowly, but it forms a new compound, iron oxide, so it is chemical.
      answer: 0

    - slug: chem-u01-w03-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Seawater is boiled and the vapour is collected and condensed, leaving salt behind in the flask. What does this procedure demonstrate about seawater?
      options:
        - "Seawater is a compound of salt and water"
        - "Seawater is an element"
        - "Seawater is a mixture, because its parts were separated by a physical process"
        - "Boiling is a chemical change"
      option_explanations:
        - |
          A compound cannot be separated into its parts by boiling; a fixed-ratio substance would distil unchanged.
        - |
          Seawater contains many substances, so it cannot be an element.
        - |
          Correct. Distillation is a physical separation; anything it takes apart must have been a mixture.
        - |
          Boiling changes the state of water without forming a new substance, so it is a physical change.
      answer: 2

    - slug: chem-u01-w03-q24
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A student wants to find out whether the colour of a container affects how quickly water in it warms in sunlight. Which design gives the fairest test?
      options:
        - "Two containers of different colours and sizes, placed in different windows"
        - "One black container in the sun and one white container in the shade"
        - "Identical containers of different colours, holding equal volumes of water, placed side by side in the same sunlight"
        - "One container, painted black on one day and white on the next, measured at different times"
      option_explanations:
        - |
          Size and location change along with colour, so any difference could come from either.
        - |
          Sun versus shade changes the light itself; colour is no longer the only difference.
        - |
          Correct. Only colour differs; volume, container, light and time are controlled, so a difference in warming can be attributed to colour.
        - |
          Different days bring different weather and sun angles, so the two trials are not comparable.
      answer: 2

    # ---- Multi-select
    - slug: chem-u01-w03-q12
      type: multi_select
      topic_code: "1.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following phase changes absorb energy from the surroundings? Select all that apply.
      options:
        - "Melting"
        - "Condensation"
        - "Sublimation"
        - "Freezing"
        - "Vaporization"
      option_explanations:
        - |
          Correct. Energy must be supplied to free particles from their fixed positions in the solid.
        - |
          Gas particles coming together into a liquid release energy, which is why steam burns are severe.
        - |
          Correct. Going straight from solid to gas separates particles completely and needs energy input.
        - |
          Freezing releases energy as particles settle into an ordered solid.
        - |
          Correct. Particles leaving the liquid must overcome the attractions holding them, which takes energy.
      answer: [0, 2, 4]

    - slug: chem-u01-w03-q13
      type: multi_select
      topic_code: "1.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Water has a density of 1.00 g/mL. Which of the following objects would float in water? Select all that apply. (Densities in g/cm³: ice 0.92, cork 0.24, aluminium 2.70, ethanol 0.789, iron 7.87.)
      options:
        - "An ice cube"
        - "A cork"
        - "An aluminium cube"
        - "A sealed bottle filled completely with ethanol, ignoring the bottle's own mass"
        - "An iron nail"
      option_explanations:
        - |
          Correct. Ice at 0.92 g/cm³ is less dense than water, which is why icebergs float.
        - |
          Correct. Cork at 0.24 g/cm³ is far less dense than water.
        - |
          Aluminium at 2.70 g/cm³ is denser than water and sinks.
        - |
          Correct. Ethanol at 0.789 g/cm³ is less dense than water, so a container of it floats if the container's mass is ignored.
        - |
          Iron at 7.87 g/cm³ is much denser than water and sinks.
      answer: [0, 1, 3]

    # ---- True / false
    - slug: chem-u01-w03-q14
      type: true_false
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A sample at 400 K has twice the average particle kinetic energy of the same sample at 200 K.
      answer: true
      explanation: |
        True. The kelvin scale starts at absolute zero, where particle motion is minimal, so average kinetic energy is proportional to kelvin temperature. The same claim would be false for 40 °C and 20 °C because the Celsius zero is arbitrary.

    - slug: chem-u01-w03-q15
      type: true_false
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: To convert a volume from cm³ to m³ you divide by 100.
      answer: false
      explanation: |
        False. The length factor must be cubed: (100 cm / 1 m)³ = 1,000,000 cm³ per m³, so you divide by 10⁶. Dividing by 100 gives an answer 10,000 times too large.

    # ---- Fill in the blank
    - slug: chem-u01-w03-q16
      type: fill_blank
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The change of state directly from a solid to a gas, as when dry ice disappears without melting, is called ____.
      answer: ["sublimation"]
      explanation: |
        Sublimation skips the liquid state. Dry ice (solid CO₂) sublimes at −78 °C at normal pressure; the reverse process, gas to solid, is deposition.

    - slug: chem-u01-w03-q17
      type: fill_blank
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A change that produces one or more new substances with different properties is a ____ change.
      answer: ["chemical"]
      explanation: |
        A chemical change forms new substances; a physical change alters state, shape or form only. Burning and rusting are chemical; melting and dissolving are physical.

    # ---- Numeric
    - slug: chem-u01-w03-q18
      type: numeric
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A sample of ethanol has a mass of 39.5 g. Using a density of 0.789 g/mL, what volume does it occupy? Give your answer in mL to one decimal place.
      answer: { value: 50.1, tolerance: 0.1 }
      explanation: |
        V = m ÷ D = 39.5 g ÷ 0.789 g/mL = 50.06 mL, reported as 50.1 mL (three significant figures). Check: 50.1 × 0.789 = 39.5 g.

    - slug: chem-u01-w03-q19
      type: numeric
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Convert 0.650 km to centimetres. Give your answer as a whole number of centimetres.
      answer: { value: 65000, tolerance: 1 }
      explanation: |
        0.650 km × (1,000 m / 1 km) × (100 cm / 1 m) = 65,000 cm, or 6.50 × 10⁴ cm to three significant figures. The conversion factors are exact, so only the 0.650 limits the precision.

    - slug: chem-u01-w03-q20
      type: numeric
      topic_code: "1.6"
      source: "NIST CODATA (calorie-joule relation)"
      points: 1
      prompt: |
        A granola bar provides 210 food Calories. Using 1 Cal = 4.184 kJ, how many kilojoules is that? Give your answer in kJ to the nearest whole number.
      answer: { value: 879, tolerance: 1 }
      explanation: |
        210 Cal × 4.184 kJ/Cal = 878.6 kJ, which rounds to 879 kJ (8.8 × 10² kJ to two significant figures). A food Calorie is a kilocalorie, so it is a thousand times a small calorie of 4.184 J.

    - slug: chem-u01-w03-q25
      type: true_false
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Repeating a measurement many times and averaging will correct for a miscalibrated balance.
      answer: false
      explanation: |
        False. A miscalibrated balance introduces a systematic error that shifts every reading the same way; averaging reduces only random scatter. The fix is to calibrate the balance against a known mass.

    - slug: chem-u01-w03-q26
      type: fill_blank
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A mixture that is uniform throughout, such as salt water or brass, is described as ____.
      answer: ["homogeneous", "a solution", "solution"]
      explanation: |
        A homogeneous mixture, or solution, has one visible phase and the same composition everywhere in the sample; a heterogeneous mixture has visibly different parts.

    # ---- Short answer
    - slug: chem-u01-w03-q21
      type: short_answer
      topic_code: "1.5"
      source: "general knowledge"
      points: 3
      stimulus: |
        A student is given an irregular lump of shiny grey metal and asked to identify it. The lump has a mass of 85.6 g. Placed in a graduated cylinder containing 50.0 mL of water, it raises the level to 60.9 mL. Reference densities (g/cm³): aluminium 2.70, zinc 7.13, iron 7.87, copper 8.96, lead 11.3.
      prompt: |
        Using the information, answer (a), (b) and (c).

        (a) Calculate the volume of the lump and explain why water displacement was used instead of a ruler.
        (b) Calculate the density to the correct number of significant figures and identify the metal.
        (c) The student then cuts the lump in half. State what happens to its mass, its volume and its density, and explain which of these is intensive.
      answer: |
        (a) V = 60.9 − 50.0 = 10.9 mL = 10.9 cm³. The lump is irregular, so length × width × height cannot be measured; the water it displaces equals its volume.
        (b) D = 85.6 g ÷ 10.9 cm³ = 7.853 g/cm³, reported as 7.85 g/cm³ (three significant figures). This matches iron (7.87), and zinc (7.13) is too far off.
        (c) Mass and volume each halve (about 42.8 g and 5.45 cm³), but density stays 7.85 g/cm³ because it is the ratio of the two. Density is intensive; mass and volume are extensive.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 10.9 cm³ (or mL) with a reason for displacement (irregular shape).

        (b) 1 pt: density 7.85 g/cm³ with three significant figures and the identification as iron. Accept 7.9 g/cm³ with iron if the student argues the volume has only two reliable figures.

        (c) 1 pt: mass and volume halve, density unchanged, with density named as intensive and the others extensive.

