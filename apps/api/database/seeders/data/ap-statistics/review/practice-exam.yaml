  - slug: apstats-final-q39
    type: multiple_choice
    topic_code: "5.1"
    source: "AP Statistics CED, Topic 5.1"
    points: 1
    prompt: |
      A scatterplot shows the age in years (x) and the asking price (y) of 40 used cars of one model (hypothetical data). Prices drop steeply over the first few years and then level off, and one 6-year-old car is priced far above the others of its age. Which description is best?
    options:
