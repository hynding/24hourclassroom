        Correct. The slope −0.0214 is the change in predicted y per one-unit increase in x: predicted sleep falls by about 0.0214 hours (about 1.3 minutes) for each extra minute of phone use.
      - |
        The slope describes the predicted (average) change, not an exact change for each individual; real students scatter around the line with S = 0.58 hours.
