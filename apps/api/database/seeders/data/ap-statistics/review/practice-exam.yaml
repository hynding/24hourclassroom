week: 34
description: |
  A full practice final: 70 questions · about 4 hours 15 minutes · all five units. Questions 1–46 are a mock
  AP Statistics exam in the May 2027 format. The real exam is on Tuesday, May 11, 2027 (2027-05-11), in the
  afternoon session, and is fully digital in the Bluebook app: multiple-choice answers are selected and free
  responses are typed (use Bluebook's Ω menu for symbols such as x̄ and p̂, and write an interval as "from 2.5
  to 5.5"). Calculators are allowed throughout (an approved graphing calculator, and Desmos is built into
  Bluebook), and a reference booklet of formulas and normal, t and chi-square tables is provided. Section I,
  questions 1–42, is 42 four-option multiple-choice questions in 1 hour 30 minutes, 50% of the score, in
  roughly the AP unit proportions (11 on Unit 1, 8 on Unit 2, 9 on Unit 3, 7 on Unit 4, 7 on Unit 5) and
  including two sets of three questions on one shared prompt: questions 12–14 on a probability distribution
  and questions 36–38 on a computer regression output. Section II, questions 43–46, is four free-response
  questions in 1 hour 30 minutes, 50% of the score, 10 points each: question 43 formulates an investigative
  question and designs an experiment (Practices 1 and 2); question 44 compares two distributions and
  interprets them (Practices 3 and 4); question 45 is an inference question, a two-sample t-test; question
  46 combines data collection, regression analysis and interpretation (Practices 2, 3 and 4). Questions
  47–70 (about 45 minutes) are not AP format: select-all, true/false, numeric, fill-in-the-blank and
  short-answer practice across all five units, including a shared-context set on a two-way table, so that
  the final also rehearses every other item type in the course. Multiple choice, select-all, true/false and
  numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers (3
  points each) and the four free-response questions (10 points each, scored against a point-by-point guide
  in the AP style) are graded by your teacher. Calculators are allowed on every question; round as each
  prompt asks.
questions:
  # ---- Section I: multiple choice (q01-q42). Unit 1: q01-q11.
  - slug: apstats-final-q01
    type: multiple_choice
    topic_code: "1.1"
    source: "AP Statistics CED, Topic 1.1"
    points: 1
    prompt: |
      A student council wants to use data to learn about students' sleep on school nights. Which of the following is a statistical investigative question?
    options:
      - "How many hours did you sleep last night?"
      - "How many hours did the student council president sleep last night?"
      - "Do students at this school who have a first-period class tend to sleep fewer hours on school nights than students who do not?"
      - "Is sleep important for teenagers?"
    option_explanations:
      - |
        This is a survey question: it is what you would ask one student to collect a data value, not the question the whole study answers about a group.
      - |
        This asks for one person's single value, so there is no variability and no group to describe; a statistical question anticipates variability across many individuals.
      - |
        Correct. It names the population (students at this school), the variable (hours of sleep on school nights) and a comparison (first-period class or not), and it anticipates variability, so data can answer it.
      - |
        This is an opinion question with no defined population or measurable variable; data on sleep cannot settle what "important" means.
    answer: 2
  - slug: apstats-final-q02
    type: multiple_choice
    topic_code: "1.2"
    source: "AP Statistics CED, Topic 1.2"
    points: 1
    prompt: |
      A school nurse records four pieces of information about each student who visits the health office. Which of them is a quantitative variable?
    options:
      - "The student's homeroom number"
      - "The student's body temperature, in degrees Fahrenheit"
      - "Whether or not the student was sent home"
      - "The reason for the visit (illness, injury, medication or other)"
    option_explanations:
      - |
        A homeroom number is a label written with digits; averaging homeroom numbers means nothing, so it is categorical.
      - |
        Correct. Temperature is a measured number for which arithmetic such as an average or a difference makes sense, so it is quantitative.
      - |
        Sent home or not places each student in one of two groups, so it is a categorical (binary) variable.
      - |
        The reason for the visit places each student into a category; counting categories does not make the variable itself quantitative.
    answer: 1
  - slug: apstats-final-q03
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Statistics CED, Topic 1.3"
    points: 1
    prompt: |
      A cafeteria recorded the lunch choice of 160 students on one day (hypothetical data): pizza 52, salad 24, sandwich 36, hot meal 48. What proportion of these students chose either a hot meal or a salad?
    options:
      - "0.30"
      - "0.15"
      - "0.55"
      - "0.45"
    option_explanations:
      - |
        0.30 = 48/160 is the proportion who chose a hot meal only; the salad count of 24 was left out.
      - |
        0.15 = 24/160 is the proportion who chose a salad only; the hot-meal count of 48 was left out.
      - |
        0.55 = (52 + 36)/160 is the proportion who chose pizza or a sandwich, the complement of the requested group.
      - |
        Correct. Add the two category counts and divide by the total: (48 + 24)/160 = 72/160 = 0.45.
    answer: 3
  - slug: apstats-final-q04
    type: multiple_choice
    topic_code: "1.6"
    source: "AP Statistics CED, Topic 1.6"
    points: 1
    prompt: |
      The one-way commute times of 120 students at a large high school have mean 24.6 minutes, median 18 minutes, minimum 4 minutes and maximum 75 minutes. Which description of the shape of the distribution is most consistent with these statistics?
    options:
      - "Skewed to the right"
      - "Skewed to the left"
      - "Roughly symmetric"
      - "Uniform"
    option_explanations:
      - |
        Correct. The mean (24.6) is well above the median (18), and the maximum is 57 minutes above the median while the minimum is only 14 below it: a long right tail of long commutes pulls the mean up.
      - |
        A left-skewed distribution has a long tail of small values that pulls the mean below the median; here the mean is above the median.
      - |
        In a roughly symmetric distribution the mean and median are close; a gap of 6.6 minutes with a far-off maximum points to skew, not symmetry.
      - |
        A uniform distribution is symmetric, with the mean close to the median; these statistics show a long tail on the high side.
    answer: 0
  - slug: apstats-final-q05
    type: multiple_choice
    topic_code: "1.7"
    source: "AP Statistics CED, Topic 1.7"
    points: 1
    prompt: |
      The five-number summary of the minutes 50 students spent on homework one evening is: minimum 12, Q1 30, median 38, Q3 46, maximum 81. By the 1.5 × IQR rule, which of the minimum and the maximum are outliers?
    options:
      - "Both the minimum and the maximum"
      - "Neither the minimum nor the maximum"
      - "The maximum only"
      - "The minimum only"
    option_explanations:
      - |
        The lower fence is Q1 − 1.5 × IQR = 30 − 24 = 6, and 12 is above it, so the minimum is not an outlier.
      - |
        The upper fence is Q3 + 1.5 × IQR = 46 + 24 = 70, and 81 is above it, so the maximum is an outlier.
      - |
        Correct. IQR = 46 − 30 = 16 and 1.5 × 16 = 24, so the fences are 6 and 70. Only 81 is beyond a fence.
      - |
        This flags the minimum because it is far below the median, but 12 is above the lower fence of 6; the maximum, 81, is the value beyond its fence of 70.
    answer: 2
  - slug: apstats-final-q06
    type: multiple_choice
    topic_code: "1.7"
    source: "AP Statistics CED, Topic 1.7"
    points: 1
    prompt: |
      A biology class measured 30 trees. The largest height, 14.2 m, was typed into the data set as 41.2 m by mistake. After the error is corrected, 14.2 m is still the largest height. Which pair of summary statistics is unchanged by the correction?
    options:
      - "The mean and the standard deviation"
      - "The median and the interquartile range"
      - "The mean and the median"
      - "The range and the interquartile range"
    option_explanations:
      - |
        The mean and standard deviation use every value, so lowering one value by 27 m lowers both; they are not resistant.
      - |
        Correct. The median and quartiles depend only on the order of the middle values; the largest value stays the largest, so the median, Q1, Q3 and the IQR do not change.
      - |
        The median is unchanged, but the mean drops by 27/30 = 0.9 m because it uses every value.
      - |
        The IQR is unchanged, but the range is maximum − minimum, and the maximum falls from 41.2 to 14.2.
    answer: 1
  - slug: apstats-final-q07
    type: multiple_choice
    topic_code: "1.8"
    source: "AP Statistics CED, Topic 1.8"
    points: 1
    prompt: |
      A boxplot of the resting heart rates of 80 students has its box from 64 to 78 beats per minute and the median line at 70. About how many of the 80 students have resting heart rates between 64 and 78 beats per minute?
    options:
      - "20"
      - "60"
      - "It cannot be estimated without knowing the mean."
      - "40"
    option_explanations:
      - |
        20 is 25% of 80, the share in one quarter; the box runs from Q1 to Q3 and so holds two quarters of the data.
      - |
        60 is 75% of 80, the share below Q3 (or above Q1), not between the two quartiles.
      - |
        The quartiles alone fix the share inside the box at about half; a boxplot does not use the mean.
      - |
        Correct. The box spans Q1 to Q3, which contains the middle 50% of the data: about 0.5 × 80 = 40 students.
    answer: 3
  - slug: apstats-final-q08
    type: multiple_choice
    topic_code: "1.9"
    source: "AP Statistics CED, Topic 1.9"
    points: 1
    prompt: |
      Test scores for two class periods (hypothetical) are summarised below. Period 2 (n = 28): median 78, IQR 10, range 35. Period 5 (n = 30): median 74, IQR 22, range 48. Which comparison is supported by these statistics?
    options:
      - "Period 2 has a higher median score and less variability, by both the IQR and the range, than Period 5."
      - "Period 5 has a higher center than Period 2 because its range is larger."
      - "Every student in Period 2 scored higher than every student in Period 5."
      - "Period 2's scores are more spread out than Period 5's because its median is higher."
    option_explanations:
      - |
        Correct. Center: median 78 versus 74, so Period 2 is higher. Variability: IQR 10 versus 22 and range 35 versus 48, so Period 2 is less variable.
      - |
        The range measures spread, not center; the medians (78 versus 74) show Period 2 has the higher center.
      - |
        Medians and spreads describe the groups, not every individual; with ranges of 35 and 48 the two distributions surely overlap.
      - |
        This mixes up center and spread; a higher median says nothing about variability, and Period 2's IQR and range are both smaller.
    answer: 0
  - slug: apstats-final-q09
    type: multiple_choice
    topic_code: "1.11"
    source: "AP Statistics CED, Topic 1.11"
    points: 1
    prompt: |
      A high school has 40 homerooms. To survey students about a new schedule, the principal randomly selects 4 homerooms and surveys every student in those 4 homerooms. What type of sample is this?
    options:
      - "A stratified random sample"
      - "A cluster sample"
      - "A simple random sample"
      - "A systematic random sample"
    option_explanations:
      - |
        A stratified sample takes a random sample from every group; here only 4 of the 40 homerooms contribute anyone.
      - |
        Correct. The homerooms are clusters: a random sample of whole clusters is chosen and every individual in each chosen cluster is surveyed.
      - |
        In a simple random sample every set of n students is equally likely; here two students from different homerooms can be chosen together only if both homerooms are picked, so not every set is equally likely.
      - |
        A systematic sample picks every kth individual from an ordered list after a random start; nothing here is chosen at fixed intervals.
    answer: 1
  - slug: apstats-final-q10
    type: multiple_choice
    topic_code: "1.12"
    source: "AP Statistics CED, Topic 1.12"
    points: 1
    prompt: |
      A school's website posts a poll: "Should the school day start later? Vote yes or no." Of the 530 votes, 412 are yes. What is the most serious problem with using 412/530 ≈ 0.78 to estimate the proportion of all the school's students who favour a later start?
    options:
      - "The sample is too small to say anything about the school."
      - "Nonresponse bias, because some of the students selected for the poll did not answer."
      - "Voluntary response bias: people with strong opinions choose to vote, so 0.78 probably overstates support."
      - "Response bias caused by a leading question."
    option_explanations:
      - |
        530 responses is plenty for a precise estimate if they were a random sample; the problem is how the respondents chose themselves, which a larger sample would not fix.
      - |
        Nonresponse needs a selected sample in which some people fail to answer; nobody was selected here, since anyone who wanted to could vote.
      - |
        Correct. Respondents selected themselves, and those who care most (likely students eager for a later start) are the most likely to vote, so the estimate is probably too high.
      - |
        The wording offers both answers neutrally, so the question is not leading; the bias comes from who chooses to respond.
    answer: 2
  - slug: apstats-final-q11
    type: multiple_choice
    topic_code: "1.13"
    source: "AP Statistics CED, Topic 1.13"
    points: 1
    prompt: |
      Sixty student volunteers are randomly assigned, 30 each, to study a word list either with music playing or in silence. The silence group's mean score on a memory test is significantly higher. Which conclusion is appropriate?
    options:
      - "Studying in silence causes higher memory scores for all students in the country."
      - "Silence is associated with higher scores, but no cause-and-effect conclusion is possible."
      - "The result applies to every student at the school because 60 is a large sample."
      - "Studying in silence causes higher memory scores for volunteers like these, but the result cannot be generalised to a larger population."
    option_explanations:
      - |
        Random assignment supports cause and effect, but the subjects were volunteers, not a random sample, so the conclusion cannot be extended to all students in the country.
      - |
        This is the conclusion for an observational study; here treatments were randomly assigned, so a significant difference does support a causal conclusion.
      - |
        Generalising to a population needs random sampling from it; a sample size, however large, does not make volunteers representative.
      - |
        Correct. Random assignment allows a cause-and-effect conclusion; because the subjects were volunteers rather than a random sample, it applies only to subjects like these.
    answer: 3
  # ---- Unit 2: q12-q19. Shared-prompt set on a probability distribution (q12-q14).
  - slug: apstats-final-q12
    type: multiple_choice
    topic_code: "2.8"
    source: "AP Statistics CED, Topic 2.8"
    points: 1
    stimulus: |
      At a school café (hypothetical), let X be the number of smoothies bought by a randomly selected customer. The probability distribution of X is shown in the table.

      | x | 0 | 1 | 2 | 3 |
      |---|---|---|---|---|
      | P(X = x) | 0.30 | 0.45 | 0.20 | 0.05 |
    prompt: |
      What is the probability that a randomly selected customer buys at least 2 smoothies?
    options:
      - "0.25"
      - "0.20"
      - "0.70"
      - "0.75"
    option_explanations:
      - |
        Correct. P(X ≥ 2) = P(X = 2) + P(X = 3) = 0.20 + 0.05 = 0.25.
      - |
        0.20 is P(X = 2) alone; "at least 2" also includes buying 3 smoothies.
      - |
        0.70 = 1 − 0.30 is P(X ≥ 1), at least one smoothie, not at least two.
      - |
        0.75 = 0.30 + 0.45 is P(X ≤ 1), the complement of the event asked for.
    answer: 0
  - slug: apstats-final-q13
    type: multiple_choice
    topic_code: "2.9"
    source: "AP Statistics CED, Topic 2.9"
    points: 1
    stimulus: |
      At a school café (hypothetical), let X be the number of smoothies bought by a randomly selected customer. The probability distribution of X is shown in the table.

      | x | 0 | 1 | 2 | 3 |
      |---|---|---|---|---|
      | P(X = x) | 0.30 | 0.45 | 0.20 | 0.05 |
    prompt: |
      What is the expected value (mean) of X?
    options:
      - "1.50"
      - "0.25"
      - "1.00"
      - "1.70"
    option_explanations:
      - |
        1.50 is the plain average of the values 0, 1, 2 and 3, which ignores that the values have different probabilities.
      - |
        0.25 is the average of the four probabilities (they always sum to 1, so this is always 1/4); the mean weights the values by their probabilities.
      - |
        Correct. E(X) = Σ x · P(X = x) = 0(0.30) + 1(0.45) + 2(0.20) + 3(0.05) = 0 + 0.45 + 0.40 + 0.15 = 1.00 smoothie.
      - |
        1.70 = Σ x² · P(X = x), which squares the values; that sum is a step toward the variance, not the mean.
    answer: 2
  - slug: apstats-final-q14
    type: multiple_choice
    topic_code: "2.9"
    source: "AP Statistics CED, Topic 2.9"
    points: 1
    stimulus: |
      At a school café (hypothetical), let X be the number of smoothies bought by a randomly selected customer. The probability distribution of X is shown in the table.

      | x | 0 | 1 | 2 | 3 |
      |---|---|---|---|---|
      | P(X = x) | 0.30 | 0.45 | 0.20 | 0.05 |
    prompt: |
      To two decimal places, what is the standard deviation of X?
    options:
      - "0.70"
      - "0.84"
      - "1.12"
      - "1.30"
    option_explanations:
      - |
        0.70 is the variance, Σ (x − 1)² P(X = x) = 0.30 + 0 + 0.20 + 0.20 = 0.70; the standard deviation is its square root.
      - |
        Correct. With mean 1, Var(X) = (0 − 1)²(0.30) + (1 − 1)²(0.45) + (2 − 1)²(0.20) + (3 − 1)²(0.05) = 0.30 + 0 + 0.20 + 0.20 = 0.70, so SD(X) = √0.70 ≈ 0.84 smoothie.
      - |
        1.12 is the standard deviation of the four values 0, 1, 2, 3 treated as equally likely; the probabilities must weight the squared deviations.
      - |
        1.30 = √1.70 takes the square root of Σ x² P(X = x) without subtracting the squared mean (1² = 1) first.
    answer: 1
  - slug: apstats-final-q15
    type: multiple_choice
    topic_code: "2.2"
    source: "AP Statistics CED, Topic 2.2"
    points: 1
    prompt: |
      A random sample of 250 students at a large high school was classified by whether they keep a phone in the bedroom overnight and whether they usually sleep 8 or more hours (hypothetical data).

      | | 8 or more hours | Under 8 hours | Total |
      |---|---|---|---|
      | Phone in bedroom | 42 | 108 | 150 |
      | No phone in bedroom | 63 | 37 | 100 |
      | Total | 105 | 145 | 250 |

      What proportion of the students who do not keep a phone in the bedroom usually sleep 8 or more hours?
    options:
      - "0.252"
      - "0.60"
      - "0.42"
      - "0.63"
    option_explanations:
      - |
        0.252 = 63/250 is the joint proportion of all 250 students who have no phone in the bedroom and sleep 8 or more hours; the question conditions on the 100 with no phone.
      - |
        0.60 = 63/105 reverses the condition: it is the proportion of students sleeping 8 or more hours who have no phone in the bedroom.
      - |
        0.42 = 105/250 is the marginal proportion of all students who sleep 8 or more hours, ignoring the phone condition.
      - |
        Correct. Restrict to the 100 students with no phone in the bedroom: 63/100 = 0.63.
    answer: 3
  - slug: apstats-final-q16
    type: multiple_choice
    topic_code: "2.3"
    source: "AP Statistics CED, Topic 2.3"
    points: 1
    prompt: |
      A basketball player makes 70% of her free throws, and her shots are independent. Which procedure correctly simulates the outcome of one of her free throws?
    options:
      - "Read one random digit: 0 to 6 is a made shot and 7 to 9 is a miss."
      - "Read one random digit: 0 to 7 is a made shot and 8 to 9 is a miss."
      - "Roll a fair six-sided die: 1 to 4 is a made shot and 5 to 6 is a miss."
      - "Flip a fair coin: heads is a made shot and tails is a miss."
    option_explanations:
      - |
        Correct. Seven of the ten equally likely digits (0, 1, 2, 3, 4, 5, 6) mean a make, so P(make) = 7/10 = 0.70, and fresh random digits keep the shots independent.
      - |
        Eight digits (0 to 7) mean a make, which gives P(make) = 0.80, not 0.70; counting 0 to 7 as seven digits is the error.
      - |
        Four of six faces give P(make) = 4/6 ≈ 0.667, close to but not equal to 0.70.
      - |
        A coin gives P(make) = 0.50; having two outcomes does not make them occur in the player's 70/30 proportions.
    answer: 0
  - slug: apstats-final-q17
    type: multiple_choice
    topic_code: "2.10"
    source: "AP Statistics CED, Topic 2.10"
    points: 1
    prompt: |
      At a hypothetical orchard, 15% of apples have a skin blemish. A worker selects 12 apples at random, and blemishes occur independently. What is the probability that at most 2 of the 12 apples are blemished?
    options:
      - "0.2924"
      - "0.2642"
      - "0.7358"
      - "0.4435"
    option_explanations:
      - |
        0.2924 = P(X = 2) alone, binompdf(12, 0.15, 2); "at most 2" also includes 0 and 1 blemished apples.
      - |
        0.2642 = 1 − P(X ≤ 2) = P(X ≥ 3), the complement of the event asked for.
      - |
        Correct. X = number blemished is binomial with n = 12 and p = 0.15. P(X ≤ 2) = P(0) + P(1) + P(2) = 0.1422 + 0.3012 + 0.2924 = 0.7358 (binomcdf(12, 0.15, 2)).
      - |
        0.4435 = P(X ≤ 1), "fewer than 2"; at most 2 includes exactly 2.
    answer: 2
  - slug: apstats-final-q18
    type: multiple_choice
    topic_code: "2.11"
    source: "AP Statistics CED, Topic 2.11"
    points: 1
    prompt: |
      In a large school district (hypothetical), the heights of tenth-grade girls are approximately normally distributed with mean 64.5 inches and standard deviation 2.5 inches. What proportion of these girls are taller than 68 inches?
    options:
      - "0.9192"
      - "0.0808"
      - "0.1615"
      - "0.4192"
    option_explanations:
      - |
        0.9192 is the area to the left of z = 1.4, the proportion shorter than 68 inches; the question asks for the right tail.
      - |
        Correct. z = (68 − 64.5)/2.5 = 1.4, and P(Z > 1.4) = 1 − 0.9192 = 0.0808.
      - |
        0.1615 doubles the tail area, as for a two-sided probability P(\|Z\| > 1.4); only heights above 68 inches are asked for.
      - |
        0.4192 = 0.9192 − 0.5 is the area between the mean and 68 inches, not the area beyond 68.
    answer: 1
  - slug: apstats-final-q19
    type: multiple_choice
    topic_code: "2.12"
    source: "AP Statistics CED, Topic 2.12"
    points: 1
    prompt: |
      The time customers spend in a hypothetical bike shop is strongly skewed to the right, with mean 21 minutes and standard deviation 16 minutes. A random sample of 64 customers is selected. Which best describes the sampling distribution of the sample mean time x̄?
    options:
      - "Approximately normal, with mean 21 minutes and standard deviation 16 minutes"
      - "Skewed to the right, with mean 21 minutes and standard deviation 2 minutes"
      - "Approximately normal, with mean 21 minutes and standard deviation 0.25 minutes"
      - "Approximately normal, with mean 21 minutes and standard deviation 2 minutes"
    option_explanations:
      - |
        16 minutes is σ, the spread of individual customers; sample means vary less, with standard deviation σ/√n.
      - |
        The population is skewed, but with n = 64 ≥ 30 the Central Limit Theorem makes the distribution of x̄ approximately normal; the population's shape does not carry over.
      - |
        0.25 = 16/64 divides σ by n instead of by √n = 8.
      - |
        Correct. The mean of x̄ is μ = 21, its standard deviation is σ/√n = 16/√64 = 2 minutes, and because n = 64 is large the Central Limit Theorem says the shape is approximately normal.
    answer: 3
  # ---- Unit 3: q20-q28.
  - slug: apstats-final-q20
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Statistics CED, Topic 3.1"
    points: 1
    prompt: |
      To estimate the mean weekly study time of a school's students, a club surveys students it finds in the library at lunch, a method that tends to overestimate study time. If the club increases its sample from 100 to 400 students, still chosen in the library, what happens?
    options:
      - "The variability of the estimate is about halved, but the bias is unchanged."
      - "The bias is removed, because a larger sample is more representative."
      - "The variability of the estimate is quartered, and the bias is removed."
      - "Neither the bias nor the variability changes."
    option_explanations:
      - |
        Correct. The standard deviation of an estimator is proportional to 1/√n, so multiplying n by 4 divides it by √4 = 2. Bias comes from the method (library students study more), and a bigger sample from the same place keeps it.
      - |
        A bigger sample from the same biased location estimates the wrong thing more precisely; sample size reduces variability, not bias.
      - |
        Variability scales with 1/√n, not 1/n, so quadrupling n halves it; and the bias stays.
      - |
        A larger sample does reduce variability (by a factor of 2 here), even though it leaves the bias alone.
    answer: 0
  - slug: apstats-final-q21
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Statistics CED, Topic 3.2"
    points: 1
    prompt: |
      In a large school district, 62% of students ride a school bus. For random samples of 150 students from the district, what is the standard deviation of the sampling distribution of the sample proportion p̂ who ride a bus?
    options:
      - "0.0016"
      - "0.0396"
      - "0.4854"
      - "0.0408"
    option_explanations:
      - |
        0.0016 = (0.62)(0.38)/150 is the variance of p̂; the standard deviation is its square root.
      - |
        Correct. SD(p̂) = √(p(1 − p)/n) = √((0.62)(0.38)/150) = √0.001571 ≈ 0.0396.
      - |
        0.4854 = √((0.62)(0.38)) leaves out n; that is the standard deviation for one student's yes/no outcome, not for a sample proportion.
      - |
        0.0408 = √(0.25/150) uses p = 0.5 instead of the known population proportion p = 0.62.
    answer: 1
  - slug: apstats-final-q22
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Statistics CED, Topic 3.3"
    points: 1
    prompt: |
      In a random sample of 400 students from a large school district, 248 say they eat breakfast on school days. Which is a 95% confidence interval for the proportion of all students in the district who eat breakfast on school days?
    options:
      - "From 0.580 to 0.660"
      - "From 0.596 to 0.644"
      - "From 0.572 to 0.668"
      - "From 0.557 to 0.683"
    option_explanations:
      - |
        This uses z* = 1.645, the critical value for 90% confidence: 0.62 ± 1.645(0.0243). A 95% interval needs z* = 1.96.
      - |
        This is p̂ ± one standard error, 0.62 ± 0.0243; the critical value z* = 1.96 is missing from the margin of error.
      - |
        Correct. p̂ = 248/400 = 0.62, SE = √((0.62)(0.38)/400) ≈ 0.0243, and 0.62 ± 1.96(0.0243) = 0.62 ± 0.0476, from 0.572 to 0.668.
      - |
        This uses z* = 2.576, the critical value for 99% confidence: 0.62 ± 2.576(0.0243) = 0.62 ± 0.0625. A 95% interval needs z* = 1.96, which gives a narrower interval.
    answer: 2
  - slug: apstats-final-q23
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Statistics CED, Topic 3.4"
    points: 1
    prompt: |
      A 95% confidence interval for the proportion of all families in a school district who support a proposed new bus route is from 0.46 to 0.58. A board member claims that a majority of the district's families support the route. Which statement is correct?
    options:
      - "The interval supports the claim, because its midpoint, 0.52, is above 0.50."
      - "The interval shows the claim is false, because it contains values below 0.50."
      - "There is a 95% probability that the true proportion is above 0.50."
      - "The interval does not give convincing evidence for the claim, because plausible values from 0.46 to 0.50 are not a majority."
    option_explanations:
      - |
        The midpoint is just p̂; every value in the interval is plausible, and some of them (0.46 to 0.50) are not a majority.
      - |
        Values above 0.50 are plausible too, so the interval cannot show the claim is false; it only fails to give convincing evidence for it.
      - |
        The 95% describes the method's long-run capture rate, not a probability about the fixed parameter; and part of the interval lies below 0.50.
      - |
        Correct. The interval includes 0.50 and values below it, so a proportion of 0.50 or less is plausible: there is not convincing evidence that a majority support the route.
    answer: 3
  - slug: apstats-final-q24
    type: multiple_choice
    topic_code: "3.5"
    source: "AP Statistics CED, Topic 3.5"
    points: 1
    prompt: |
      Last year, 30% of a school's students bought lunch on Fridays. After a menu change, the cafeteria manager wants to know whether the proportion has increased, and she will survey a random sample of 250 students. Which hypotheses should she test?
    options:
      - "H₀: p = 0.30 and Hₐ: p > 0.30, where p is the proportion of all students at the school who now buy lunch on Fridays"
      - "H₀: p̂ = 0.30 and Hₐ: p̂ > 0.30, where p̂ is the proportion of the sampled students who buy lunch on Fridays"
      - "H₀: p = 0.30 and Hₐ: p ≠ 0.30, where p is the proportion of all students at the school who now buy lunch on Fridays"
      - "H₀: p > 0.30 and Hₐ: p = 0.30, where p is the proportion of all students at the school who now buy lunch on Fridays"
    option_explanations:
      - |
        Correct. Hypotheses are about the parameter p, the null hypothesis states the old value 0.30, and the question "has it increased?" makes the alternative one-sided, p > 0.30.
      - |
        Hypotheses are always about population parameters; p̂ is a statistic that will be known once the sample is taken, so there is nothing to test about it.
      - |
        The manager asks specifically whether the proportion increased, so the alternative is one-sided (>), not two-sided (≠).
      - |
        This reverses the hypotheses: the null hypothesis carries the equality (no change), and the claim seeking evidence goes in the alternative.
    answer: 0
  - slug: apstats-final-q25
    type: multiple_choice
    topic_code: "3.7"
    source: "AP Statistics CED, Topic 3.7"
    points: 1
    prompt: |
      A city (hypothetical) reports that 30% of its teenagers own a bicycle. A youth group thinks the proportion is higher. In a random sample of 250 of the city's teenagers, 88 own a bicycle. For a test of H₀: p = 0.30 against Hₐ: p > 0.30, which are the test statistic and p-value?
    options:
      - "z = 1.79 and p-value ≈ 0.073"
      - "z = 1.79 and p-value ≈ 0.036"
      - "z = 1.72 and p-value ≈ 0.043"
      - "z = 1.79 and p-value ≈ 0.964"
    option_explanations:
      - |
        0.073 doubles the tail area, the p-value for a two-sided alternative; Hₐ: p > 0.30 is one-sided.
      - |
        Correct. p̂ = 88/250 = 0.352. z = (0.352 − 0.30)/√((0.30)(0.70)/250) = 0.052/0.02898 ≈ 1.79, and the p-value is P(Z ≥ 1.79) ≈ 0.036.
      - |
        This uses p̂ = 0.352 in the standard error, √((0.352)(0.648)/250); a test's standard error assumes H₀ is true and uses p₀ = 0.30.
      - |
        0.964 is the area to the left of z = 1.79; for Hₐ: p > 0.30 the p-value is the area to the right.
    answer: 1
  - slug: apstats-final-q26
    type: multiple_choice
    topic_code: "3.8"
    source: "AP Statistics CED, Topic 3.8"
    points: 1
    prompt: |
      A school nurse tests H₀: p = 0.10 against Hₐ: p > 0.10, where p is the proportion of all students at the school who are behind on a required vaccination. If she rejects H₀, she will run a reminder campaign. Which describes a Type II error in this context?
    options:
      - "Concluding that more than 10% of students are behind when in fact 10% are, so an unneeded campaign is run"
      - "Concluding that exactly 10% of students are behind, which proves the null hypothesis"
      - "Not finding convincing evidence that more than 10% are behind when in fact more than 10% are, so a needed campaign is not run"
      - "Getting a sample proportion above 0.10 by chance even though the true proportion is 0.10"
    option_explanations:
      - |
        This is a Type I error: rejecting a true null hypothesis.
      - |
        A test never proves H₀; failing to reject it means only that the evidence was not convincing, and that alone is not an error.
      - |
        Correct. A Type II error is failing to reject H₀ when Hₐ is true: more than 10% are behind, the test misses it, and the campaign that is needed does not happen.
      - |
        A sample proportion that differs from p by chance is ordinary sampling variability, not an error in the decision; an error is a wrong conclusion about H₀.
    answer: 2
  - slug: apstats-final-q27
    type: multiple_choice
    topic_code: "3.11"
    source: "AP Statistics CED, Topic 3.11"
    points: 1
    prompt: |
      Independent random samples of ninth graders and twelfth graders at a large school were asked whether they prefer digital textbooks. A 95% confidence interval for p₉ − p₁₂, the difference between the proportions of all ninth graders and all twelfth graders at the school who prefer digital textbooks, is from −0.04 to 0.12. Which conclusion is correct?
    options:
      - "There is convincing evidence that a higher proportion of ninth graders prefer digital textbooks, because most of the interval is positive."
      - "There is convincing evidence that the two proportions are equal, because the interval contains 0."
      - "Between −4% and 12% of ninth graders prefer digital textbooks more than twelfth graders do."
      - "The interval does not give convincing evidence of a difference, because 0 is a plausible value for p₉ − p₁₂."
    option_explanations:
      - |
        Every value in the interval is plausible, including 0 and the negative values; how much of the interval is positive does not matter.
      - |
        Containing 0 means 0 is plausible, not that it is proven; other values such as 0.10 are plausible too. Never conclude that H₀ is true.
      - |
        The interval estimates a difference between two population proportions, not a share of individual students.
      - |
        Correct. Because 0 (no difference) lies in the interval, the data do not give convincing evidence that the proportions differ.
    answer: 3
  - slug: apstats-final-q28
    type: multiple_choice
    topic_code: "3.15"
    source: "AP Statistics CED, Topic 3.15"
    points: 1
    prompt: |
      A random sample of 300 students at a large high school is classified by grade (9, 10, 11 or 12) and by preferred place to study (home, library or café). A chi-square test for independence is carried out on the 4 × 3 table of counts. How many degrees of freedom does the test have?
    options:
      - "6"
      - "12"
      - "11"
      - "299"
    option_explanations:
      - |
        Correct. df = (number of rows − 1)(number of columns − 1) = (4 − 1)(3 − 1) = 3 × 2 = 6.
      - |
        12 is the number of cells, rows × columns; each variable loses one degree of freedom, giving (4 − 1)(3 − 1).
      - |
        11 = cells − 1 subtracts only one degree of freedom for the whole table; in a two-way table both the row and column totals are fixed, so each variable loses one: (4 − 1)(3 − 1).
      - |
        299 = n − 1 mixes in the rule for a one-sample t procedure; chi-square degrees of freedom depend on the table's dimensions, not on n.
    answer: 0
  # ---- Unit 4: q29-q35.
  - slug: apstats-final-q29
    type: multiple_choice
    topic_code: "4.1"
    source: "AP Statistics CED, Topic 4.1"
    points: 1
    prompt: |
      When constructing a confidence interval for a population mean μ from one random sample, why is a t* critical value used rather than a z* critical value?
    options:
      - "Because the sample size is less than 30"
      - "Because σ is unknown and is estimated by s, which adds variability that the t distributions account for"
      - "Because the population distribution is not normal"
      - "Because the sample mean is a biased estimator of μ"
    option_explanations:
      - |
        The t distribution is used whenever s replaces σ, whatever the sample size; n ≥ 30 matters for the Normal condition, not for the choice of t.
      - |
        Correct. The standard error s/√n uses s in place of the unknown σ; s varies from sample to sample, so the standardised statistic follows a t distribution with heavier tails than z.
      - |
        Non-normality is handled by the large-sample condition; the reason for t is estimating σ with s, which applies even to a normal population.
      - |
        x̄ is an unbiased estimator of μ; the t distribution adjusts for the extra variability from estimating σ, not for bias.
    answer: 1
  - slug: apstats-final-q30
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Statistics CED, Topic 4.2"
    points: 1
    prompt: |
      A random sample of 25 students at a large high school reported a mean of 7.2 hours of sleep on school nights, with standard deviation 1.1 hours. A dotplot of the data shows no strong skew and no outliers. Which is a 95% confidence interval for the mean school-night sleep of all students at the school?
    options:
      - "From 6.769 to 7.631 hours"
      - "From 4.930 to 9.470 hours"
      - "From 6.746 to 7.654 hours"
      - "From 6.824 to 7.576 hours"
    option_explanations:
      - |
        This uses z* = 1.96 instead of t* with df = 24; when σ is estimated by s the critical value is t* = 2.064.
      - |
        This uses s = 1.1 as the standard error without dividing by √25 = 5, so the margin of error is five times too large.
      - |
        Correct. One-sample t-interval for μ: df = 24, t* = 2.064, SE = 1.1/√25 = 0.22, and 7.2 ± 2.064(0.22) = 7.2 ± 0.454, from 6.746 to 7.654 hours.
      - |
        This uses t* = 1.711, the critical value for 90% confidence with df = 24; 95% confidence needs t* = 2.064.
    answer: 2
  - slug: apstats-final-q31
    type: multiple_choice
    topic_code: "4.3"
    source: "AP Statistics CED, Topic 4.3"
    points: 1
    prompt: |
      Twenty randomly selected members of a running club each ran one mile in their old shoes and one mile in a new model, in random order. A 95% confidence interval for the mean difference in time (old − new) is from −0.8 to 2.6 seconds. Which conclusion is correct?
    options:
      - "The new shoes make runners faster, because most of the interval is positive."
      - "The interval shows that the new shoes make no difference."
      - "95% of the club's runners ran between 0.8 seconds slower and 2.6 seconds faster in the new shoes."
      - "Because 0 is in the interval, there is not convincing evidence that the mean difference in time (old − new) differs from 0."
    option_explanations:
      - |
        All values in the interval are plausible, including 0 and negative values (new shoes slower), so the interval gives no convincing evidence of an improvement.
      - |
        0 is plausible but so are differences up to 2.6 seconds; failing to find evidence of a difference does not show there is none.
      - |
        The interval estimates the mean difference for all club members, not the range of individual runners' differences.
      - |
        Correct. Zero, meaning no mean difference, is a plausible value for μ_diff, so the data do not provide convincing evidence that the new shoes change mean mile time.
    answer: 3
  - slug: apstats-final-q32
    type: multiple_choice
    topic_code: "4.4"
    source: "AP Statistics CED, Topic 4.4"
    points: 1
    prompt: |
      A teacher records each of 30 randomly selected students' scores on a vocabulary pretest in September and on a posttest in December. Which procedure is appropriate for testing whether the mean score improved?
    options:
      - "A paired t-test for the mean difference (posttest − pretest)"
      - "A two-sample t-test for the difference between two population means"
      - "A two-sample z-test for the difference between two population proportions"
      - "A chi-square test for homogeneity"
    option_explanations:
      - |
        Correct. Each student gives two scores, so the data are paired: compute each student's difference and run a one-sample t-test on the differences, H₀: μ_diff = 0 against Hₐ: μ_diff > 0.
      - |
        A two-sample t-test needs two independent groups; here the same 30 students produce both scores, so the scores are dependent.
      - |
        Test scores are quantitative, so the parameter is a mean, not a proportion.
      - |
        A chi-square test compares distributions of a categorical variable; scores are quantitative and paired.
    answer: 0
  - slug: apstats-final-q33
    type: multiple_choice
    topic_code: "4.5"
    source: "AP Statistics CED, Topic 4.5"
    points: 1
    prompt: |
      A hypothetical delivery service promises a mean delivery time of 30 minutes. A consumer group suspects the mean is longer and records a random sample of 36 deliveries: x̄ = 32.1 minutes and s = 6.4 minutes. For a test of H₀: μ = 30 against Hₐ: μ > 30, which are the test statistic and p-value?
    options:
      - "t = 1.97 and p-value ≈ 0.057"
      - "t = 1.97 and p-value ≈ 0.028"
      - "t = 0.33 and p-value ≈ 0.37"
      - "t = 1.97 and p-value ≈ 0.972"
    option_explanations:
      - |
        0.057 is the two-sided p-value, twice the upper tail; Hₐ: μ > 30 is one-sided.
      - |
        Correct. SE = 6.4/√36 = 1.0667, t = (32.1 − 30)/1.0667 ≈ 1.97 with df = 35, and the p-value is P(t ≥ 1.97) ≈ 0.028.
      - |
        This divides by s = 6.4 instead of s/√n = 1.067, so t is far too small.
      - |
        0.972 is the area to the left of t = 1.97; for Hₐ: μ > 30 the p-value is the area to the right.
    answer: 1
  - slug: apstats-final-q34
    type: multiple_choice
    topic_code: "4.8"
    source: "AP Statistics CED, Topic 4.8"
    points: 1
    prompt: |
      Independent random samples of juniors at two large high schools, A and B, reported their daily screen time. A 95% confidence interval for μ_A − μ_B, the difference in mean daily screen time between all juniors at school A and all juniors at school B, is from 0.3 to 1.1 hours. Which is a correct interpretation?
    options:
      - "There is a 95% probability that μ_A − μ_B is between 0.3 and 1.1 hours."
      - "95% of juniors at school A spend 0.3 to 1.1 hours more on screens each day than juniors at school B."
      - "We are 95% confident that the interval from 0.3 to 1.1 hours captures the true difference in mean daily screen time (school A − school B) for all juniors at the two schools."
      - "If many samples were taken, 95% of the sample differences would fall between 0.3 and 1.1 hours."
    option_explanations:
      - |
        The parameter is fixed and this interval either captures it or not; 95% describes the method's long-run capture rate, not a probability for this interval.
      - |
        The interval is about the difference in population means, not about how individual students compare.
      - |
        Correct. This is the confidence-interval template: confidence level, the interval, and the parameter in context (a difference in population means, school A − school B).
      - |
        The confidence level says that 95% of intervals built this way capture μ_A − μ_B; it does not say where future sample differences will fall.
    answer: 2
  - slug: apstats-final-q35
    type: multiple_choice
    topic_code: "4.10"
    source: "AP Statistics CED, Topic 4.10"
    points: 1
    prompt: |
      Forty student volunteers were randomly assigned to drink a caffeinated or a decaffeinated drink before a reaction-time test. A two-sample t-test of H₀: μ_C − μ_D = 0 against Hₐ: μ_C − μ_D ≠ 0 gives a p-value of 0.083. Using α = 0.05, which conclusion is correct?
    options:
      - "Reject H₀; there is convincing evidence that caffeine changes mean reaction time."
      - "Fail to reject H₀; this proves that caffeine has no effect on mean reaction time."
      - "Reject H₀, because 0.083 is a small probability."
      - "Fail to reject H₀; there is not convincing evidence that caffeine changes mean reaction time for students like these."
    option_explanations:
      - |
        The p-value 0.083 is greater than α = 0.05, so the decision is to fail to reject H₀, not to reject it.
      - |
        Failing to reject H₀ never proves it; the data are simply not convincing evidence of a difference.
      - |
        "Small" is judged against α: 0.083 > 0.05, so the result is not significant at the 5% level.
      - |
        Correct. Because 0.083 > 0.05, we fail to reject H₀. There is not convincing evidence that caffeine changes the mean reaction time of volunteers like these; random assignment would have allowed a causal conclusion had the result been significant.
    answer: 3
  # ---- Unit 5: q36-q42. Shared-prompt set on a regression output (q36-q38).
  - slug: apstats-final-q36
    type: multiple_choice
    topic_code: "5.3"
    source: "AP Statistics CED, Topic 5.3"
    points: 1
    stimulus: |
      For a random sample of 30 students at a large high school (hypothetical data), x is the number of minutes a student used a phone in bed before sleeping one night and y is the student's hours of sleep that night. The scatterplot shows a moderate, linear, negative association for phone times from 0 to 120 minutes. Computer output for the least-squares regression:

