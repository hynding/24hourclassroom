  - slug: apstats-final-q41
    type: multiple_choice
    topic_code: "5.5"
    source: "AP Statistics CED, Topic 5.5"
    points: 1
    prompt: |
      For a class of students, x is the number of practice problems completed before a quiz and y is the quiz score out of 100 (hypothetical data). The summary statistics are x̄ = 20, s_x = 4, ȳ = 65, s_y = 10 and r = 0.72. What is the equation of the least-squares regression line?
    options:
      - "ŷ = 29 + 1.8x"
      - "ŷ = 59.24 + 0.288x"
      - "ŷ = 65 + 1.8x"
      - "ŷ = 15 + 2.5x"
    option_explanations:
      - |
        Correct. Slope b = r(s_y/s_x) = 0.72(10/4) = 1.8. The line passes through (x̄, ȳ), so a = ȳ − b·x̄ = 65 − 1.8(20) = 29.
      - |
        This inverts the ratio, b = r(s_x/s_y) = 0.72(4/10) = 0.288, which is the slope for predicting x from y.
      - |
        This uses ȳ = 65 as the intercept; the intercept is the predicted y when x = 0, a = ȳ − b·x̄ = 29.
      - |
        This uses b = s_y/s_x = 2.5 without the factor r, then a = 65 − 2.5(20) = 15.
    answer: 0
  - slug: apstats-final-q42
    type: multiple_choice
    topic_code: "5.5"
    source: "AP Statistics CED, Topic 5.5"
    points: 1
    prompt: |
      Using children aged 3 to 10 years (hypothetical data), a paediatric clinic fits the least-squares line ŷ = 82 + 6.1x, where x is age in years and ŷ is predicted height in centimetres, with r = 0.97. Which statement about using this line to predict the height of a 30-year-old is best?
    options:
      - "The predicted height is 265 cm, and it is reliable because r is close to 1."
      - "The predicted height of 265 cm is too low, because growth speeds up in adulthood."
      - "The line can be used for any age, because its slope is positive."
      - "The prediction, 82 + 6.1(30) = 265 cm, is an extrapolation far beyond ages 3 to 10, so it is not reliable."
    option_explanations:
      - |
        A strong correlation describes the pattern within ages 3 to 10 only; it gives no assurance that the line holds at age 30.
      - |
        Growth slows and stops in adulthood, so 265 cm is far too high, not too low; the real issue is predicting outside the data.
      - |
        The sign of the slope has nothing to do with where the model applies; predictions are trustworthy only within the range of the x data.
      - |
        Correct. ŷ = 82 + 6.1(30) = 265 cm, an impossible height: age 30 is far outside the 3 to 10 years used to fit the line, so the prediction is an unreliable extrapolation.
    answer: 3
  # ---- Section II: free response (q43-q46), 10 points each.
  - slug: apstats-final-q43
    type: long_answer
    topic_code: "1.13"
    source: "AP Statistics CED, Topic 1.13"
    points: 10
    stimulus: |
      A large high school (hypothetical) is considering a 10-minute mid-morning movement break, during which students walk or stretch. For a four-week study, 120 students volunteer: 40 from each of grades 10, 11 and 12. At the end of the four weeks every participant takes the same 20-minute attention test, scored from 0 to 100. Half of the participants will have the movement break each morning; the other half will spend the same 10 minutes in silent reading.
    prompt: |
      Free-response question 1.

      (A) Write a statistical investigative question that this study could answer. Your question should name the group of interest, the variable to be measured and the comparison.

      (B) Identify the experimental units, the treatments and the response variable in this study.

      (C) Describe how to carry out a randomized block design for this study, using grade level as the blocking variable. Include how you would carry out the random assignment.

      (D) Explain why blocking by grade level might be beneficial in this study.

      (E) Suppose the movement-break group has a significantly higher mean attention score. Describe the conclusion that can be drawn, including the kind of conclusion and the group to which it applies.
    answer: |
      (A) For students like the 120 volunteers at this school, do those who have a daily 10-minute movement break tend to score higher on a 20-minute attention test after four weeks than those who spend the 10 minutes in silent reading?
      (B) Experimental units: the 120 student volunteers. Treatments: a daily 10-minute mid-morning movement break, and 10 minutes of silent reading. Response variable: the score (0 to 100) on the attention test at the end of the four weeks.
      (C) Form three blocks by grade: the 40 tenth graders, the 40 eleventh graders and the 40 twelfth graders. Within each block, write each student's name on an identical slip, mix the slips in a container and draw 20; those 20 get the movement break and the other 20 get silent reading. (Equivalently, number the students in a block 1–40 and use a random number generator to choose 20 different numbers.) Do this separately in all three blocks. After four weeks, compare the mean attention scores of the two treatments within each block and then combine the results.
      (D) Attention test scores are likely to differ by grade level (for example, older students may have more practice with timed tests or different schedules). Blocking by grade compares the two treatments within groups of similar students, so differences between grades do not add to the variability in the treatment comparison. This reduces variability and makes a real difference between the treatments easier to detect.
      (E) Because the treatments were randomly assigned, a significant difference supports a cause-and-effect conclusion: the movement break causes higher mean attention scores. Because the participants were volunteers rather than a random sample, the conclusion applies only to students like these 120 volunteers, not to all students at the school.
    explanation: |
      Ten points.
      (A) 2 points: 1 for a question that names the group (students at this school, or students like these volunteers) and the variable (attention test score); 1 for the comparison between the two treatments, phrased as a question that anticipates variability ("tend to score higher", "is the mean score higher"). A question asked of one person ("How did you score?") earns 0.
      (B) 2 points: 1 for identifying the experimental units as the 120 students and the response variable as the attention test score; 1 for naming both treatments (movement break and silent reading). Calling the grade levels the treatments loses the treatments point.
      (C) 3 points: 1 for forming blocks by grade (three blocks of 40); 1 for random assignment of the treatments within each block, separately, with equal groups of 20; 1 for a complete random mechanism (slips drawn from a container, or a random number generator choosing 20 distinct labels from 1–40, ignoring repeats). Randomly assigning all 120 at once, ignoring the blocks, earns at most 1 point for (C).
      (D) 2 points: 1 for a reason in context that grade level may be associated with attention scores; 1 for explaining that blocking accounts for that source of variability so that differences between the treatments are easier to detect. "To make the groups equal" without the variability idea earns at most 1 point.
      (E) 1 point: requires both parts: a cause-and-effect conclusion justified by random assignment, and scope limited to volunteers like these (not generalisable to all students because there was no random sampling).
  - slug: apstats-final-q44
    type: long_answer
    topic_code: "1.9"
    source: "AP Statistics CED, Topic 1.9"
    points: 10
    stimulus: |
      A counselor at a large high school selected a random sample of 75 students (hypothetical data) and recorded each student's usual way of getting to school and one-way commute time in minutes. Summary statistics for the two largest groups are shown.

      | Group | n | Mean | SD | Min | Q1 | Median | Q3 | Max |
      |---|---|---|---|---|---|---|---|---|
      | Bus riders | 40 | 26.3 | 10.4 | 8 | 18 | 24 | 31 | 62 |
      | Car riders | 35 | 14.6 | 5.2 | 5 | 11 | 14 | 18 | 27 |
    prompt: |
      Free-response question 2.

      (A) Compare the distributions of commute time for bus riders and car riders. Address shape, center, variability and outliers, and use the 1.5 × IQR rule to justify your statements about outliers.

      (B) For the bus riders, which measure of center, the mean or the median, better describes a typical commute time? Explain.

      (C) A student says, "At least a quarter of the bus riders in the sample had a longer commute than every car rider in the sample." Do the summary statistics support this statement? Justify your answer.

      (D) The counselor concludes that riding the bus causes students to have longer commutes, and that a bus rider could shorten the commute by switching to a car. Explain why this conclusion is not justified by these data, naming a specific variable in your explanation.
    answer: |
      (A) Shape: the bus riders' times are skewed to the right (the mean 26.3 is above the median 24, the maximum is 31 minutes above Q3 while the minimum is only 10 below Q1, and there is a high outlier); the car riders' times are roughly symmetric to slightly right-skewed (mean 14.6 close to the median 14, quartiles nearly evenly spaced around the median). Center: the median commute for bus riders (24 minutes) is greater than for car riders (14 minutes). Variability: the bus riders' times are more variable: IQR 31 − 18 = 13 minutes versus 18 − 11 = 7 minutes, and range 54 versus 22 minutes (SD 10.4 versus 5.2). Outliers: for bus riders the fences are 18 − 1.5(13) = −1.5 and 31 + 1.5(13) = 50.5, so the maximum of 62 minutes is an outlier; for car riders the fences are 11 − 1.5(7) = 0.5 and 18 + 1.5(7) = 28.5, and the minimum 5 and maximum 27 lie inside them, so there are no outliers.
      (B) The median. The bus riders' distribution is skewed to the right with a high outlier (62 minutes), which pulls the mean (26.3) above the typical value; the median (24) is resistant to the skew and the outlier.
      (C) Yes. At least 25% of the bus riders have commute times at or above the bus Q3 of 31 minutes, and 31 is greater than the car riders' maximum of 27 minutes. So at least a quarter of the sampled bus riders had longer commutes than every sampled car rider.
      (D) This is an observational study: the students chose how they travel, and no treatment was randomly assigned, so the association cannot show cause and effect. A confounding variable such as distance from home to school is likely: students who live farther away may be more likely to ride the bus (or less likely to have someone who can drive them) and also have longer commutes, so distance, not the bus, could explain the difference. A student who switched to a car would still live just as far away.
    explanation: |
      Ten points.
      (A) 4 points, 1 each, all in context (commute times) and with comparative language ("greater than", "more variable"): shape (bus right-skewed; car roughly symmetric or slightly right-skewed); center (bus median 24 greater than car median 14; comparing means is also acceptable if stated); variability (bus IQR 13 or range 54 greater than car IQR 7 or range 22); outliers (bus fences −1.5 and 50.5 shown, so 62 is an outlier; car fences 0.5 and 28.5 shown, so no outliers). Listing the two groups' values without a comparison earns no point for that feature. An outlier claim without the fence calculation earns no outlier point.
      (B) 2 points: 1 for choosing the median; 1 for the reason that the right skew or the high outlier (62) pulls the mean up while the median is resistant. Choosing the median with no reason earns 1 point.
      (C) 2 points: 1 for "yes" with the comparison of the bus Q3 (31) with the car maximum (27); 1 for the reasoning that at least 25% of bus riders are at or above Q3. A "yes" based only on the medians or the means earns 0.
      (D) 2 points: 1 for stating that the data are observational (no random assignment of travel mode), so cause and effect cannot be concluded; 1 for a specific, plausible confounding variable (such as distance from home to school) and how it is linked to both travel mode and commute time. A variable named without the link to both earns at most 1 point for (D).
  - slug: apstats-final-q45
    type: long_answer
    topic_code: "4.10"
    source: "AP Statistics CED, Topic 4.10"
    points: 10
    stimulus: |
      A school garden club (hypothetical) tested whether a new fertilizer increases the growth of bean plants. Forty-eight seedlings of the same variety were randomly assigned, 24 to the new fertilizer and 24 to the standard fertilizer, and grown under the same conditions. After four weeks each plant's height was measured in centimetres. Dotplots of both groups are roughly symmetric, with no outliers.

      | Fertilizer | n | Mean height (cm) | SD (cm) |
      |---|---|---|---|
      | New | 24 | 31.4 | 4.8 |
      | Standard | 24 | 28.6 | 5.3 |
    prompt: |
      Free-response question 3.

      (A) State appropriate hypotheses for testing whether the new fertilizer produces a greater mean height after four weeks. Define any parameters you use.

      (B) Identify the appropriate inference procedure and verify that the conditions for it are met.

      (C) Calculate the test statistic and the p-value. Show your work.

      (D) Using α = 0.05, state your conclusion in the context of the study.

      (E) Interpret the p-value in context.

      (F) Based on your conclusion in (D), which type of error, Type I or Type II, could you have made? Describe that error in context.
    answer: |
      (A) Let μ_N = the true mean height after four weeks of bean seedlings like these grown with the new fertilizer, and μ_S = the true mean height after four weeks of such seedlings grown with the standard fertilizer. H₀: μ_N − μ_S = 0; Hₐ: μ_N − μ_S > 0.
      (B) A two-sample t-test for the difference between two means, μ_N − μ_S. Random: the 48 seedlings were randomly assigned to the two fertilizers. Normal: each group has only 24 plants (fewer than 30), but the dotplots of both groups are roughly symmetric with no outliers, so the t procedure is reasonable. (No 10% condition is needed, because the data come from random assignment, not from sampling without replacement.)
      (C) SE = √(4.8²/24 + 5.3²/24) = √(0.96 + 1.1704) = √2.1304 ≈ 1.460. t = (31.4 − 28.6)/1.460 ≈ 1.92. With the calculator's df ≈ 45.6, the p-value = P(t ≥ 1.92) ≈ 0.031. (With the conservative df = 23, p-value ≈ 0.034.)
      (D) Because the p-value ≈ 0.031 < α = 0.05, we reject H₀. There is convincing evidence that the new fertilizer produces a greater mean height after four weeks than the standard fertilizer for bean seedlings like these. Because the treatments were randomly assigned, the higher mean can be attributed to the new fertilizer.
      (E) Assuming H₀ is true (the two fertilizers produce the same mean height), there is about a 0.031 probability of getting a difference in sample means (new − standard) of 2.8 cm or more by chance alone, through the random assignment.
      (F) Because we rejected H₀, we could have made a Type I error: concluding that the new fertilizer produces a greater mean height when in fact it does not (the true means are equal), so the club might switch to the new fertilizer for no benefit.
    explanation: |
      Ten points.
      (A) 2 points: 1 for correct hypotheses about the difference in population (true) means with a one-sided alternative, H₀: μ_N − μ_S = 0 and Hₐ: μ_N − μ_S > 0 (or H₀: μ_N = μ_S, Hₐ: μ_N > μ_S); 1 for defining both parameters in context as true mean heights for each fertilizer. Hypotheses written with x̄ or with sample values earn 0 for the first point.
      (B) 2 points: 1 for naming the two-sample t-test for a difference in means (accept a name or the formula with t); 1 for checking Random (random assignment) and Normal (n = 24 < 30 in each group, so referring to the dotplots showing no strong skew or outliers). Saying "n ≥ 30" or omitting the reference to the dotplots loses the second point. A paired t-test or a z-test earns 0 for the first point.
      (C) 2 points: 1 for t ≈ 1.92 with the correct standard error shown (accept 1.91 to 1.93); 1 for a p-value consistent with t and a one-sided alternative, about 0.031 (accept 0.03 to 0.035, including the conservative df = 23 value). A two-sided p-value (about 0.061) loses the second point.
      (D) 2 points: 1 for comparing the p-value with α = 0.05 and the decision to reject H₀; 1 for the conclusion in context about the mean height with "convincing evidence" language, not definitive language ("proves") and not about the sample means.
      (E) 1 point: requires "assuming H₀ is true", the probability (0.031), a difference in sample means of 2.8 cm or more (the direction of Hₐ), and "by chance" (random assignment).
      (F) 1 point: Type I error, described in context: concluding the new fertilizer increases mean height when it does not. Naming Type II, or giving a definition with no context, earns 0. A Type I answer consistent with an incorrect "reject" in (D) still earns the point.
  - slug: apstats-final-q46
    type: long_answer
    topic_code: "5.3"
    source: "AP Statistics CED, Topic 5.3"
    points: 10
    stimulus: |
      A cross-country coach selected a random sample of 18 runners from the list of all runners in a large high school league (hypothetical data). For each runner she recorded x = average training miles per week during the season (from 12 to 45 miles) and y = the runner's best 5-kilometre race time, in minutes. The scatterplot shows a strong, negative, linear association, and the residual plot shows no pattern. Computer output for the least-squares regression:

      | Predictor | Coef |
      |---|---|
      | Constant | 24.86 |
      | Miles | −0.214 |

      S = 0.92, R-sq = 64.0%
    prompt: |
      Free-response question 4.

      (A) Before taking her random sample, the coach considered instead posting a request on the league's social-media page asking runners to report their weekly miles and best times. Describe one source of bias in that plan and explain how it would likely affect the estimated relationship or the reported values.

      (B) Interpret the slope of the least-squares regression line in context.

      (C) One runner in the sample averaged 30 miles per week and had a best time of 17.9 minutes. Calculate and interpret this runner's residual.

      (D) Interpret the values of S = 0.92 and R-sq = 64.0% in context.

      (E) The coach tells her team, "Running more miles each week will make you faster." Explain whether the study supports this statement, and comment on using the line to predict the time of a runner who averages 70 miles per week.
    answer: |
      (A) Voluntary response bias: runners choose whether to respond, and those who are proud of their training and race times (more miles, faster times) are the most likely to reply, so the responses would over-represent dedicated, fast runners; the sample would probably overstate typical miles and understate typical times for league runners. Response bias is also possible: self-reported miles and times may be exaggerated (miles rounded up, times rounded down).
      (B) For each additional mile of average weekly training, the predicted best 5-km time decreases by about 0.214 minutes (about 13 seconds).
      (C) ŷ = 24.86 − 0.214(30) = 24.86 − 6.42 = 18.44 minutes. Residual = y − ŷ = 17.9 − 18.44 = −0.54 minutes. This runner's best time was 0.54 minutes faster than the time predicted by the least-squares line for a runner who averages 30 miles per week.
      (D) S = 0.92: the actual best 5-km times typically differ from the times predicted by the least-squares line (using weekly miles) by about 0.92 minutes. R-sq = 64.0%: about 64.0% of the variation in best 5-km times is accounted for by the linear relationship with average weekly training miles.
      (E) The study does not support the cause-and-effect statement. The runners were randomly sampled, so the negative association can be generalised to runners in this league, but miles were not randomly assigned: this is an observational study, and other variables (natural ability, age, years of experience, coaching) could influence both how much a runner trains and how fast they are. Also, 70 miles per week is far outside the observed range of 12 to 45 miles, so ŷ = 24.86 − 0.214(70) ≈ 9.88 minutes is an extrapolation and should not be trusted (it would be a world-class time).
    explanation: |
      Ten points.
      (A) 2 points: 1 for naming a specific bias (voluntary response, or response bias from self-reporting) with the mechanism in context (who chooses to respond, or why the reports would be inaccurate); 1 for a plausible direction (overstated miles or understated times, or over-representation of dedicated, fast runners). Naming "bias" without a mechanism earns 0.
      (B) 2 points: 1 for the rate, a decrease of 0.214 minutes per additional weekly mile, in context; 1 for "predicted" (or "on average") language. "The time decreases by 0.214" without "predicted" earns 1 point.
      (C) 2 points: 1 for ŷ = 18.44 and residual = −0.54 minutes, showing the calculation; 1 for the interpretation: the runner's actual time was 0.54 minutes less (faster) than predicted for a runner with 30 weekly miles. A residual computed as ŷ − y (0.54) earns at most 1 point.
      (D) 2 points: 1 for S as the typical distance between actual and predicted times, about 0.92 minutes, in context; 1 for R-sq as the percent of variation in race times accounted for by the linear relationship with weekly miles. "64% of the times are explained" or "64% of the points are on the line" earns 0 for the second point.
      (E) 2 points: 1 for explaining that without random assignment the study cannot show cause and effect (a confounding variable may be named), while random sampling allows generalising the association to the league; 1 for identifying 70 miles per week as an extrapolation beyond the 12–45 mile range, so the prediction is unreliable. A statement that the study proves training causes faster times earns 0 for the first point.
  # ---- Beyond the AP format (q47-q70): the other item types, all five units.
  - slug: apstats-final-q47
    type: fill_blank
    topic_code: "1.11"
    source: "AP Statistics CED, Topic 1.11"
    points: 1
    prompt: |
      A principal divides the school's students by grade level and takes a simple random sample of 25 students from each of the four grades. This design is called a ____ random sample. (One word.)
    answer: ["stratified"]
    explanation: |
      The grades are strata (groups of similar individuals), and a separate simple random sample is taken from every stratum: a stratified random sample. It differs from a cluster sample, which randomly chooses a few whole groups and includes everyone in them.
  - slug: apstats-final-q48
    type: multi_select
    topic_code: "1.13"
    source: "AP Statistics CED, Topic 1.13"
    points: 1
    partial_credit: true
    prompt: |
      In a hypothetical driving-simulator study, 50 volunteer drivers are randomly assigned, 25 each, to drive a course either while answering text messages or with their phones switched off. The response is the number of lane-departure errors. Which statements are true? Select all that apply.
    options:
      - "If the difference in mean errors is statistically significant, random assignment allows the conclusion that texting causes more lane departures for drivers like these."
      - "The results can be generalised to all licensed drivers because the treatments were randomly assigned."
      - "The phones-off group serves as a control group for comparison."
      - "A placebo is required for this study to count as an experiment."
      - "If the person who counts lane departures does not know which treatment each driver received, that person is blinded."
    option_explanations:
      - |
        Correct. Random assignment balances other variables between the groups on average, so a significant difference can be attributed to the treatment for subjects like these.
      - |
        Generalising to a population needs a random sample from it; these are volunteers, so random assignment supports cause and effect but not generalisation to all drivers.
      - |
        Correct. The phones-off drivers provide the baseline that the texting group is compared with.
      - |
        An experiment is defined by imposing treatments; a placebo is useful in some studies (often medical) but is not required, and there is no sensible placebo for texting here.
      - |
        Correct. Blinding the evaluator keeps knowledge of the treatment from influencing how errors are counted.
    answer: [0, 2, 4]
  - slug: apstats-final-q49
    type: numeric
    topic_code: "1.7"
    source: "AP Statistics CED, Topic 1.7"
    points: 1
    prompt: |
      A student recorded her hours of sleep on eight school nights: 6.5, 7, 7.5, 8, 5.5, 9, 7, 6. What is the sample standard deviation of these values? Give your answer to two decimal places.
    answer: { value: 1.12, tolerance: 0.006 }
    explanation: |
      The mean is 56.5/8 = 7.0625 hours. The squared deviations sum to 8.71875, so s² = 8.71875/(8 − 1) = 1.2455 and s = √1.2455 ≈ 1.12 hours. Dividing by n = 8 instead of n − 1 = 7 gives 1.04, the population formula.
  - slug: apstats-final-q50
    type: true_false
    topic_code: "1.6"
    source: "AP Statistics CED, Topic 1.6"
    points: 1
    prompt: |
      True or false: For a distribution of quiz scores that is strongly skewed to the left (a few very low scores), the mean is typically less than the median.
    answer: true
    explanation: |
      True. The few very low scores pull the mean toward the long left tail, while the median, which depends only on the middle of the ordered data, is resistant to them. So the mean is typically below the median.
  - slug: apstats-final-q51
    type: short_answer
    topic_code: "1.1"
    source: "AP Statistics CED, Topic 1.1"
    points: 3
    prompt: |
      A student plans to ask classmates, "How many minutes did you spend on homework last night?"
      (a) Explain why this is a survey question rather than a statistical investigative question.
      (b) Write a statistical investigative question for her school that uses this information to compare two groups, and name the variable or variables involved.
    answer: |
      (a) It is asked of one person and collects that person's single data value; it does not ask about a group, does not describe the variability across many students, and does not name a population or a comparison. It is a question used to gather data for an investigation.
      (b) Example: "Do juniors at this school tend to spend more time on homework on a school night than sophomores at this school?" Variables: minutes spent on homework (quantitative) and grade, junior or sophomore (categorical).
    explanation: |
      Three points. 1 point for (a): the survey question gathers one individual's response, while an investigative question asks about a group and anticipates variability. 1 point for an investigative question that names a population (students at her school) and a comparison of two groups. 1 point for naming the variables: homework time (quantitative) and the grouping variable (categorical). A question about a single student, or one with no comparison, earns no point for the second part.
  # Shared-context set on a two-way table (q52-q55).
  - slug: apstats-final-q52
    type: numeric
    topic_code: "2.6"
    source: "AP Statistics CED, Topic 2.6"
    points: 1
    stimulus: |
      A random sample of 200 students at a large high school (hypothetical data) was classified by grade group and by whether the student has a part-time job. One of these 200 students is chosen at random.

      | | Part-time job | No part-time job | Total |
      |---|---|---|---|
      | Grades 9–10 | 18 | 82 | 100 |
      | Grades 11–12 | 46 | 54 | 100 |
      | Total | 64 | 136 | 200 |
    prompt: |
      Find P(part-time job | grades 11–12). Give your answer to two decimal places.
    answer: { value: 0.46, tolerance: 0.005 }
    explanation: |
      Condition on the 100 students in grades 11–12: 46 of them have a part-time job, so P(job | grades 11–12) = 46/100 = 0.46. Dividing by the 64 students with a job instead gives P(grades 11–12 | job) = 46/64 ≈ 0.72, the reversed conditional.
  - slug: apstats-final-q53
    type: fill_blank
    topic_code: "2.7"
    source: "AP Statistics CED, Topic 2.7"
    points: 1
    stimulus: |
      A random sample of 200 students at a large high school (hypothetical data) was classified by grade group and by whether the student has a part-time job. One of these 200 students is chosen at random.

      | | Part-time job | No part-time job | Total |
      |---|---|---|---|
      | Grades 9–10 | 18 | 82 | 100 |
      | Grades 11–12 | 46 | 54 | 100 |
      | Total | 64 | 136 | 200 |
    prompt: |
      P(grades 9–10 or part-time job) = ____. Give your answer as a decimal.
    answer: ["0.73", ".73", "73%", "146/200", "73/100"]
    explanation: |
      General addition rule: P(grades 9–10 or job) = P(grades 9–10) + P(job) − P(grades 9–10 and job) = 100/200 + 64/200 − 18/200 = 146/200 = 0.73. Adding without subtracting the overlap of 18 counts those students twice and gives 0.82.
  - slug: apstats-final-q54
    type: true_false
    topic_code: "2.7"
    source: "AP Statistics CED, Topic 2.7"
    points: 1
    stimulus: |
      A random sample of 200 students at a large high school (hypothetical data) was classified by grade group and by whether the student has a part-time job. One of these 200 students is chosen at random.

      | | Part-time job | No part-time job | Total |
      |---|---|---|---|
      | Grades 9–10 | 18 | 82 | 100 |
      | Grades 11–12 | 46 | 54 | 100 |
      | Total | 64 | 136 | 200 |
    prompt: |
      True or false: For the student chosen at random, the events "has a part-time job" and "is in grades 11–12" are independent.
    answer: false
    explanation: |
      False. P(job) = 64/200 = 0.32, but P(job | grades 11–12) = 46/100 = 0.46. Knowing the student is in grades 11–12 changes the probability of having a job, so the events are not independent. (Equivalently, P(job and grades 11–12) = 0.23, while P(job) · P(grades 11–12) = 0.32 × 0.50 = 0.16.)
  - slug: apstats-final-q55
    type: multi_select
    topic_code: "2.5"
    source: "AP Statistics CED, Topic 2.5"
    points: 1
    partial_credit: true
    stimulus: |
      A random sample of 200 students at a large high school (hypothetical data) was classified by grade group and by whether the student has a part-time job. One of these 200 students is chosen at random.

      | | Part-time job | No part-time job | Total |
      |---|---|---|---|
      | Grades 9–10 | 18 | 82 | 100 |
      | Grades 11–12 | 46 | 54 | 100 |
      | Total | 64 | 136 | 200 |
    prompt: |
      Which statements are true? Select all that apply.
    options:
      - "The events \"in grades 9–10\" and \"in grades 11–12\" are mutually exclusive."
      - "The events \"has a part-time job\" and \"in grades 11–12\" are mutually exclusive."
      - "P(grades 11–12 | part-time job) = 46/64 ≈ 0.72."
      - "P(part-time job | grades 11–12) equals P(grades 11–12 | part-time job)."
      - "In these data, a higher proportion of students in grades 11–12 than in grades 9–10 have a part-time job, so there is an association between grade group and having a job."
    option_explanations:
      - |
        Correct. No student is in both grade groups, so P(grades 9–10 and grades 11–12) = 0: the events cannot happen together.
      - |
        46 students are in both, so the events can occur together; P(job and grades 11–12) = 0.23, not 0.
      - |
        Correct. Among the 64 students with a job, 46 are in grades 11–12: 46/64 ≈ 0.72.
      - |
        The two conditionals have different denominators: 46/100 = 0.46 versus 46/64 ≈ 0.72. Reversing the condition changes the probability.
      - |
        Correct. The conditional proportions with a job are 46/100 = 0.46 in grades 11–12 and 18/100 = 0.18 in grades 9–10; different conditional distributions show an association in these data.
    answer: [0, 2, 4]
  - slug: apstats-final-q56
    type: numeric
    topic_code: "2.10"
    source: "AP Statistics CED, Topic 2.10"
    points: 1
    prompt: |
      In a large school, 25% of students walk to school. A random sample of 40 students is selected, and X is the number in the sample who walk. What is the standard deviation of X? Give your answer to two decimal places.
    answer: { value: 2.74, tolerance: 0.006 }
    explanation: |
      X is approximately binomial with n = 40 and p = 0.25 (the sample is less than 10% of a large school). SD(X) = √(np(1 − p)) = √(40 × 0.25 × 0.75) = √7.5 ≈ 2.74 students. The value 7.5 is the variance, and np = 10 is the mean.
  - slug: apstats-final-q57
    type: multi_select
    topic_code: "3.15"
    source: "AP Statistics CED, Topic 3.15"
    points: 1
    partial_credit: true
    prompt: |
      Independent random samples of 9th, 10th and 11th graders at a large school were asked their preferred lunch option (hot meal, salad bar or lunch from home). A chi-square test for homogeneity gives χ² = 14.2, and all expected counts are greater than 5. Which statements are true? Select all that apply.
    options:
      - "The degrees of freedom are (3 − 1)(3 − 1) = 4."
      - "The p-value is about 0.0067."
      - "At α = 0.05, there is convincing evidence that the distribution of preferred lunch option is not the same for all three grade levels."
      - "The test requires every observed count to be at least 5."
      - "A large χ² value means that the observed counts are close to the expected counts."
    option_explanations:
      - |
        Correct. The table has 3 grade levels and 3 lunch options, so df = (3 − 1)(3 − 1) = 4.
      - |
        Correct. P(χ² ≥ 14.2) with df = 4 is about 0.0067 (χ²cdf(14.2, 1E99, 4)).
      - |
        Correct. 0.0067 < 0.05, so we reject H₀ that the distributions are the same: there is convincing evidence that the distribution of preferred lunch option differs for at least one grade level.
      - |
        The Large Counts condition is about expected counts (each at least 5), not observed counts.
      - |
        χ² = Σ (observed − expected)²/expected, so a large value means the observed counts are far from the expected counts.
    answer: [0, 1, 2]
  - slug: apstats-final-q58
    type: numeric
    topic_code: "3.3"
    source: "AP Statistics CED, Topic 3.3"
    points: 1
    prompt: |
      A student newspaper wants to estimate the proportion of all students at a large school who support a later start time, with a margin of error of at most 0.04 at 95% confidence. With no earlier estimate of the proportion, what is the smallest sample size that guarantees this? Give a whole number.
    answer: { value: 601, tolerance: 0 }
    explanation: |
      Use p̂ = 0.5, which makes p̂(1 − p̂) as large as possible: 1.96 √(0.25/n) ≤ 0.04 gives n ≥ (1.96/0.04)² × 0.25 = 600.25. Round up to 601, because 600 would give a margin of error slightly larger than 0.04.
  - slug: apstats-final-q59
    type: fill_blank
    topic_code: "3.8"
    source: "AP Statistics CED, Topic 3.8"
    points: 1
    prompt: |
      In a significance test, rejecting a null hypothesis that is actually true is called a Type ____ error. (Answer with a numeral or a word.)
    answer: ["1", "i", "one"]
    explanation: |
      A Type I error rejects a true H₀; its probability, when H₀ is true, is the significance level α. A Type II error fails to reject a false H₀.
  - slug: apstats-final-q60
    type: true_false
    topic_code: "3.6"
    source: "AP Statistics CED, Topic 3.6"
    points: 1
    prompt: |
      True or false: In a test of H₀: p = 0.40 against Hₐ: p > 0.40, where p is the proportion of all students at a school who bike to school, a p-value of 0.03 means there is a 0.03 probability that H₀ is true.
    answer: false
    explanation: |
      False. A p-value is computed assuming H₀ is true, so it cannot be the probability that H₀ is true. Correct interpretation: assuming p = 0.40, there is a 0.03 probability of getting a sample proportion as large as or larger than the one observed by chance alone.
  - slug: apstats-final-q61
    type: short_answer
    topic_code: "3.12"
    source: "AP Statistics CED, Topic 3.12"
    points: 3
    prompt: |
      Independent random samples at a large school found that 54 of 120 juniors and 38 of 125 sophomores have taken a practice college-entrance exam. A counselor wants to test whether the proportion is higher for juniors than for sophomores.
      (a) State the hypotheses, defining the parameters.
      (b) Using the pooled proportion, check the Large Counts condition.
      (c) Calculate the test statistic.
    answer: |
      (a) p_J = the proportion of all juniors at the school who have taken a practice exam; p_S = the proportion of all sophomores at the school who have. H₀: p_J − p_S = 0; Hₐ: p_J − p_S > 0.
      (b) Pooled p̂_c = (54 + 38)/(120 + 125) = 92/245 ≈ 0.3755. Expected counts: 120(0.3755) ≈ 45.1, 120(0.6245) ≈ 74.9, 125(0.3755) ≈ 46.9 and 125(0.6245) ≈ 78.1, all at least 10, so the condition is met.
      (c) p̂_J = 54/120 = 0.45 and p̂_S = 38/125 = 0.304. z = (0.45 − 0.304)/√(0.3755 × 0.6245 × (1/120 + 1/125)) = 0.146/0.0619 ≈ 2.36.
    explanation: |
      Three points. 1 point for (a): hypotheses about the difference in population proportions with Hₐ: p_J − p_S > 0 and both parameters defined in context. 1 point for (b): the pooled proportion and four counts (or n·p̂_c and n(1 − p̂_c) for each group) all shown to be at least 10. 1 point for (c): z ≈ 2.36 (accept 2.35 to 2.37) with the pooled standard error. (For reference, the one-sided p-value is about 0.009.)
  - slug: apstats-final-q62
    type: numeric
    topic_code: "4.2"
    source: "AP Statistics CED, Topic 4.2"
    points: 1
    prompt: |
      A one-sample t-interval for a mean is to be built at 90% confidence from a random sample of 15 bags of trail mix. What critical value t* should be used? Give your answer to three decimal places.
    answer: { value: 1.761, tolerance: 0.001 }
    explanation: |
      df = n − 1 = 14. For 90% confidence, 5% lies in each tail, so t* = invT(0.95, 14) ≈ 1.761. The z* value for 90% confidence, 1.645, is too small because it ignores the extra variability from estimating σ with s.
  - slug: apstats-final-q63
    type: true_false
    topic_code: "4.4"
    source: "AP Statistics CED, Topic 4.4"
    points: 1
    prompt: |
      True or false: Twenty students each have their reaction time measured once with the dominant hand and once with the non-dominant hand. A two-sample t-test for μ₁ − μ₂ is the appropriate procedure for comparing the mean reaction times.
    answer: false
    explanation: |
      False. Each student provides both measurements, so the data are paired and the two sets of times are not independent. Compute each student's difference (dominant − non-dominant) and use a paired t-test on the mean difference μ_diff.
  - slug: apstats-final-q64
    type: multi_select
    topic_code: "4.7"
    source: "AP Statistics CED, Topic 4.7"
    points: 1
    partial_credit: true
    prompt: |
      Independent random samples of 18 students from each of two large high schools recorded their minutes of daily reading. A two-sample t-interval for μ₁ − μ₂ is planned. Which statements describe conditions that must be checked? Select all that apply.
    options:
      - "Each sample is a random sample from its school."
      - "Each sample of 18 is no more than 10% of its school's students."
      - "Because each sample has fewer than 30 students, the data in each group should show no strong skew or outliers."
      - "The two samples must have equal standard deviations."
      - "The two samples must be paired student by student."
    option_explanations:
      - |
        Correct. The Random condition: both groups come from random samples (or from random assignment in an experiment).
      - |
        Correct. Sampling without replacement needs n ≤ 10% of each population for the standard error formula to be accurate; 18 students is a small share of a large school.
      - |
        Correct. With n = 18 < 30 in each group, the Normal condition is checked by graphing each sample and seeing no strong skew or outliers.
      - |
        The two-sample t procedure used in AP Statistics does not assume equal standard deviations; its standard error √(s₁²/n₁ + s₂²/n₂) uses each sample's own s.
      - |
        Pairing is the opposite of what is required here: the two samples must be independent of each other.
    answer: [0, 1, 2]
  - slug: apstats-final-q65
    type: fill_blank
    topic_code: "4.2"
    source: "AP Statistics CED, Topic 4.2"
    points: 1
    prompt: |
      A one-sample t-interval for a population mean is built from a random sample of 20 commute times. The critical value t* comes from the t distribution with df = ____.
    answer: ["19"]
    explanation: |
      For a one-sample t procedure, df = n − 1 = 20 − 1 = 19.
  - slug: apstats-final-q66
    type: short_answer
    topic_code: "4.5"
    source: "AP Statistics CED, Topic 4.5"
    points: 3
    prompt: |
      Twelve randomly selected students at a large school had their typing speed measured before and after a two-week keyboarding course. For d = after − before, in words per minute, the mean difference was 4.5 and the standard deviation of the differences was 6.4. A paired t-test of H₀: μ_d = 0 against Hₐ: μ_d > 0 gives t ≈ 2.44 with df = 11 and a p-value of about 0.017.
      (a) Interpret the p-value in context.
      (b) State a conclusion at α = 0.05 in context.
    answer: |
      (a) Assuming the true mean change in typing speed is 0 (the course makes no difference on average), there is about a 0.017 probability of getting a sample mean improvement of 4.5 words per minute or more by chance alone.
      (b) Because the p-value ≈ 0.017 < α = 0.05, we reject H₀. There is convincing evidence that the true mean typing speed of students at this school increases after the course (μ_d > 0).
    explanation: |
      Three points. 2 points for (a): 1 for "assuming H₀ is true" (true mean difference 0); 1 for the probability 0.017 of a mean difference of 4.5 words per minute or greater (the direction of Hₐ) by chance. Saying "a 0.017 probability that H₀ is true" earns 0 for (a). 1 point for (b): the comparison with α, the decision to reject H₀, and a conclusion about the true mean difference in context with "convincing evidence" language. Because there was no control group, the improvement cannot be attributed to the course alone, but the question asks only about the change in mean speed.
  - slug: apstats-final-q67
    type: numeric
    topic_code: "5.3"
    source: "AP Statistics CED, Topic 5.3"
    points: 1
    prompt: |
      In a biology lab, the least-squares line ŷ = 41.6 + 2.35x predicts a sunflower's height in centimetres from x, the number of days since planting, for plants observed from day 10 to day 40. What is the predicted height of a sunflower 28 days after planting? Give your answer to one decimal place.
    answer: { value: 107.4, tolerance: 0.05 }
    explanation: |
      ŷ = 41.6 + 2.35(28) = 41.6 + 65.8 = 107.4 cm. Day 28 is inside the observed range of 10 to 40 days, so this is an interpolation, not an extrapolation.
  - slug: apstats-final-q68
    type: true_false
    topic_code: "5.2"
    source: "AP Statistics CED, Topic 5.2"
    points: 1
    prompt: |
      True or false: If the correlation between weekly hours of practice and free-throw percentage for the players on a basketball team is r = 0.9, then 90% of the variation in free-throw percentage is accounted for by the linear relationship with hours of practice.
    answer: false
    explanation: |
      False. The proportion of variation accounted for is r², not r: 0.9² = 0.81, so about 81% of the variation in free-throw percentage is accounted for by the linear relationship with practice hours.
  - slug: apstats-final-q69
    type: fill_blank
    topic_code: "5.4"
    source: "AP Statistics CED, Topic 5.4"
    points: 1
    prompt: |
      A least-squares line predicts that a student will score 75.4 on a quiz. The student actually scores 72. The student's residual is ____.
    answer: ["-3.4", "−3.4"]
    explanation: |
      Residual = actual − predicted = 72 − 75.4 = −3.4. The negative residual means the student scored 3.4 points below the line's prediction.
  - slug: apstats-final-q70
    type: multi_select
    topic_code: "5.5"
    source: "AP Statistics CED, Topic 5.5"
    points: 1
    partial_credit: true
    prompt: |
      A scatterplot shows 15 hypothetical points with a moderate positive linear pattern. A 16th point is added whose x-value is far to the right of all the others and whose y-value falls well below the line through the first 15. Which statements about least-squares regression are true? Select all that apply.
    options:
      - "A point whose x-value is far from x̄ has high leverage."
      - "Removing an influential point can change the slope of the least-squares line substantially."
      - "The least-squares regression line always passes through the point (x̄, ȳ)."
      - "The point with the largest residual always has the most influence on the slope."
      - "The least-squares line is the line that minimises the sum of the absolute values of the residuals."
    option_explanations:
      - |
        Correct. Leverage depends on how far a point's x-value is from x̄; a far-right point can pull the line toward itself.
      - |
        Correct. An influential point is one whose removal changes the slope, intercept or correlation markedly; the 16th point here would flatten the slope.
      - |
        Correct. Because a = ȳ − b·x̄, the point (x̄, ȳ) always satisfies ŷ = a + bx.
      - |
        A point with a large residual but an x-value near x̄ may barely change the slope; influence depends mostly on leverage, and a high-leverage point can even have a small residual because it pulls the line toward it.
      - |
        Least squares minimises the sum of the squared residuals, Σ (y − ŷ)², not the sum of their absolute values.
    answer: [0, 1, 2]
