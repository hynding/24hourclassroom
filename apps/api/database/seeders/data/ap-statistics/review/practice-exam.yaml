  - slug: apstats-final-q40
    type: multiple_choice
    topic_code: "5.4"
    source: "AP Statistics CED, Topic 5.4"
    points: 1
    prompt: |
      In a residual plot for a least-squares line predicting the weight of a puppy from its age in weeks (hypothetical data), the residuals are positive for the youngest puppies, negative in the middle ages and positive again for the oldest, forming a U shape. What does this indicate?
    options:
      - "The linear model is appropriate, because there are both positive and negative residuals."
      - "A linear model is not appropriate, because the residuals show a curved pattern."
      - "The correlation between age and weight must be close to 0."
      - "The least-squares line must have a slope of 0."
    option_explanations:
      - |
        Least-squares residuals always include positive and negative values (they sum to 0); appropriateness needs them to be scattered with no pattern.
      - |
        Correct. A clear curve in the residual plot means the relationship is not linear, so a straight-line model misses the pattern; a good linear model leaves residuals randomly scattered around 0.
      - |
        A curved relationship can still have a strong correlation; the residual plot shows the form is wrong, not that the association is weak.
      - |
        The residual plot says nothing about the size of the slope; a steep line can still leave a curved pattern in its residuals.
