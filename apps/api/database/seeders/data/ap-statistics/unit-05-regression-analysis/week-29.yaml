    - slug: apstats-u05-w29-q19
      type: fill_blank
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      prompt: |
        In a Normal distribution of commute times with mean 50 minutes and standard deviation 4 minutes, a commute of 60 minutes has a z-score of ____.
      answer: ["2.5", "2.50", "+2.5"]
      explanation: |
        z = (60 − 50)/4 = 2.5. The same standardizing step, applied to both x and y, is what the correlation formula averages over.
