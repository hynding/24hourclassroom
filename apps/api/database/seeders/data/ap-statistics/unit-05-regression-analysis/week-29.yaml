    - slug: apstats-u05-w29-q21
      type: numeric
      topic_code: "2.10"
      source: "AP Statistics CED, Topic 2.10"
      points: 1
      prompt: |
        On a typical day, 20% of a café's customers order a hot drink, independently of one another. For a random group of 10 customers, find the probability that exactly 3 order a hot drink. Give your answer to three decimal places.
      answer: { value: 0.201, tolerance: 0.001 }
      explanation: |
        X = number of hot-drink orders is binomial with n = 10 and p = 0.20. P(X = 3) = C(10, 3)(0.20)³(0.80)⁷ = 120 × 0.008 × 0.2097 = 0.201.
    - slug: apstats-u05-w29-q22
      type: short_answer
      topic_code: "5.1"
      source: "AP Statistics CED, Topic 5.1"
      points: 3
      prompt: |
        A hypothetical survey records the hours per week that 10 students work at part-time jobs and each student's GPA.

        | Hours worked | 0 | 4 | 6 | 8 | 10 | 12 | 15 | 18 | 20 | 25 |
        |---|---|---|---|---|---|---|---|---|---|---|
        | GPA | 3.6 | 3.7 | 3.4 | 3.5 | 3.2 | 3.3 | 3.0 | 2.9 | 3.8 | 2.6 |

        (a) Describe the relationship between hours worked and GPA shown by these data.
        (b) The correlation for all 10 students is r = −0.618. Without the student who works 20 hours, r = −0.959. Explain why removing one student changes r so much.
      answer: |
        (a) There is a strong, negative, linear association between hours worked per week and GPA for most of these students: GPA tends to fall as hours rise. The student who works 20 hours with a GPA of 3.8 is an outlier, far above the pattern.
        (b) r is not resistant. The 20-hour student is above average in hours and above average in GPA, so this point contributes a positive product of z-scores, against the negative trend of the other nine. Removing it leaves points that follow a tight negative line, so r moves from −0.618 to −0.959.
      explanation: |
        Three points. (a) 2 points: 1 for direction, form and strength (negative, linear, strong for the main pattern), 1 for naming the outlier (20 hours, GPA 3.8) and using context (hours worked, GPA). Lose the context point if variables are not named. (b) 1 point: r is not resistant, with the reason that the outlier goes against the trend (positive z-score product) and so weakens r.
    - slug: apstats-u05-w29-q23
      type: short_answer
      topic_code: "4.8"
      source: "AP Statistics CED, Topic 4.8"
      points: 3
      prompt: |
        In a randomized experiment, 60 volunteer students were split at random between a no-phone-after-9 group and a usual-habits group. A 95% confidence interval for μ_usual − μ_no-phone, the difference in true mean hours of sleep per night, is (−0.92, −0.21).

        (a) Interpret the interval in context.
        (b) Does the interval give convincing evidence that the no-phone rule changes mean sleep for volunteers like these? Explain.
      answer: |
        (a) We are 95% confident that the interval from −0.92 to −0.21 hours captures the true difference in mean nightly sleep (usual habits minus no phone) for volunteers like these. That is, the no-phone rule increases mean sleep by between about 0.21 and 0.92 hours.
        (b) Yes. Every value in the interval is negative, so 0 (no difference) is not a plausible value for μ_usual − μ_no-phone. Because the treatments were randomly assigned, we can conclude that the rule causes more sleep, on average, for volunteers like these.
      explanation: |
        Three points. (a) 2 points: 1 for "95% confident" with the interval capturing the true difference in means (not a probability, not about sample means), 1 for context naming the order of subtraction or translating the direction. (b) 1 point: yes, because 0 is not in the interval, with random assignment mentioned for the causal claim.
    - slug: apstats-u05-w29-q24
      type: long_answer
      topic_code: "5.2"
      source: "AP Statistics CED, Topic 5.2"
      points: 6
      prompt: |
        A hypothetical maths department records, for 7 students, the number of after-school tutoring sessions attended in a term and the student's final exam score.

        | Sessions | 1 | 2 | 2 | 3 | 4 | 5 | 6 |
        |---|---|---|---|---|---|---|---|
        | Exam score | 62 | 66 | 71 | 70 | 78 | 80 | 85 |

        (A) Identify the explanatory and response variables, and explain your choice.
        (B) Describe the relationship between sessions attended and exam score.
        (C) The correlation is r = 0.971. Interpret it in context. Would r change if exam scores were reported as percentages of a 120-point exam instead of raw points? Explain.
        (D) The department head concludes, "Tutoring sessions raise exam scores." Explain why these data do not support that conclusion, and describe a study that could.
      answer: |
        (A) Sessions attended is explanatory and exam score is the response, because the question is whether attending sessions helps explain or predict exam performance.
        (B) There is a strong, positive, linear association between tutoring sessions attended and final exam score for these 7 students, with no obvious outliers.
        (C) r = 0.971 indicates a very strong, positive, linear association between sessions attended and exam score. Converting to percentages multiplies every score by the same positive constant (100/120), which leaves each z-score unchanged, so r stays 0.971.
        (D) The students chose how many sessions to attend, so the data are observational. Motivation is a lurking variable: motivated students may attend more sessions and also study more on their own, raising scores. To test causation, randomly assign students (for example, volunteers) to a tutoring group or a no-tutoring group (or to different numbers of sessions), keep other conditions the same, and compare mean exam scores.
      explanation: |
        Six points. (A) 1 point: correct roles with a reason. (B) 2 points: 1 for direction, form and strength; 1 for context (both variables named) and a comment on unusual features (none). (C) 1 point: interpretation of r naming strong, positive, linear and both variables, and "unchanged" with the reason (linear change of units, z-scores unchanged); both pieces needed. (D) 2 points: 1 for observational data with a plausible lurking variable explained (motivation, prior ability); 1 for an experiment with random assignment of tutoring and a comparison of the response.
