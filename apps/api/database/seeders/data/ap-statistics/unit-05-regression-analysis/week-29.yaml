week: 29
unit: 5
title: "Scatterplots and Correlation"
topics: ["5.1", "5.2"]
guide: guides/week-29.md
guide_description: |
  Two quantitative variables on the same individuals: choosing the explanatory and response variables,
  describing a scatterplot by direction, form, strength and unusual features in context, the correlation r as
  the average product of z-scores, its properties (no units, symmetric in x and y, linear only, not resistant),
  and why correlation in observational data is not causation. Worked examples: evening phone minutes and hours
  of sleep for 12 students, r computed by hand from z-scores for five basketball players' practice hours and
  free throws, a strongly curved speed and fuel-economy pattern with r = 0.058, one outlier that drops r from
  0.930 to 0.317, and a lurking variable behind pools and ice-cream shops.
flashcards_description: |
  32 cards on explanatory and response variables, describing scatterplots, the correlation r and its
  properties, estimating r from a description, outliers and r, and correlation versus causation.

flashcards:
  - front: Explanatory versus response variable in a scatterplot → which goes on which axis
    back: |
      The explanatory variable (the one that may explain or predict) goes on the horizontal x-axis; the response (the outcome) goes on the vertical y-axis.
    topic_code: "5.1"
  - front: Phone minutes after 9 p.m. and hours of sleep → which is explanatory
    back: |
      Phone minutes is explanatory (x); hours of sleep is the response (y), because the question asks whether phone use helps explain sleep.
    topic_code: "5.1"
  - front: Describing a scatterplot → the four features to name
    back: |
      Direction (positive or negative), form (linear, curved, clusters), strength (strong, moderate, weak) and unusual features (outliers, gaps, clusters), all in context.
    topic_code: "5.1"
  - front: Positive association between two quantitative variables → meaning
    back: |
      Above-average values of x tend to go with above-average values of y, and below-average with below-average: y tends to rise as x rises.
    topic_code: "5.1"
  - front: Negative association between two quantitative variables → meaning
    back: |
      Above-average values of x tend to go with below-average values of y: y tends to fall as x rises.
    topic_code: "5.1"
  - front: Form of a scatterplot → the three possibilities to check
    back: |
      Linear (points follow a straight band), curved or nonlinear (points bend), or clusters (separate groups of points).
    topic_code: "5.1"
  - front: Strength of a scatterplot → what it describes
    back: |
      How closely the points follow the form. Tightly packed around a line is strong; widely scattered is weak.
    topic_code: "5.1"
  - front: Outlier in a scatterplot → how to report it
    back: |
      Name it by its coordinates and context, for example "the student who worked 20 hours a week with a GPA of 3.8 is far above the pattern."
    topic_code: "5.1"
  - front: Investigative question for two quantitative variables → what it names
    back: |
      The population, the two quantitative variables, and the relationship of interest, for example "For students at this school, is evening phone time associated with hours of sleep?"
    topic_code: "5.1"
  - front: Model description of a scatterplot of phone minutes versus sleep
    back: |
      "There is a moderately strong, negative, linear association between minutes of evening phone use and hours of sleep for these 12 students, with no obvious outliers."
    topic_code: "5.1"
  - front: Correlation r → what it measures
    back: |
      The direction and strength of the linear association between two quantitative variables.
    topic_code: "5.2"
  - front: Correlation r → formula using z-scores
    back: |
      r = (1/(n − 1)) Σ zₓ · z_y, where zₓ = (x − x̄)/sₓ and z_y = (y − ȳ)/s_y.
    topic_code: "5.2"
  - front: Why products of z-scores make r positive for a positive association
    back: |
      Points above average in both variables or below average in both give positive products; when those points dominate, the sum and r are positive.
    topic_code: "5.2"
  - front: Correlation r → possible values
    back: |
      −1 ≤ r ≤ 1. r = 1 or r = −1 only when every point lies exactly on a line.
    topic_code: "5.2"
  - front: Interpreting r = −0.81 for phone minutes and sleep → template
    back: |
      "There is a moderately strong, negative, linear association between evening phone minutes and hours of sleep." Name direction, strength, linear and both variables.
    topic_code: "5.2"
  - front: Changing units (°F to °C, minutes to hours) → effect on r
    back: |
      None. A linear change of units leaves every z-score the same, so r is unchanged. r has no units.
    topic_code: "5.2"
  - front: Swapping the explanatory and response variables → effect on r
    back: |
      None. The z-score formula is symmetric in x and y, so r is the same either way.
    topic_code: "5.2"
  - front: Correlation r for a curved pattern → caution
    back: |
      r measures only linear association. A strong curve can give r near 0 (an arch) or r near ±1 (a gentle bend), so look at the plot first.
    topic_code: "5.2"
  - front: Speed and fuel economy arch with r = 0.058 → correct sentence
    back: |
      "There is almost no linear association, but a strong curved association, between speed and fuel economy."
    topic_code: "5.2"
  - front: Is r resistant to outliers?
    back: |
      No. Like the mean and standard deviation, r is built from x̄, ȳ, sₓ and s_y, so one unusual point can raise or lower it a lot.
    topic_code: "5.2"
  - front: Free-throw data, adding a player at 8 hours with 6 made → what happened to r
    back: |
      r fell from 0.930 to 0.317: the new point is above average in x and far below average in y, adding a large negative product.
    topic_code: "5.2"
  - front: Outlier that lies along the trend but far from the other points → effect on r
    back: |
      It usually makes |r| larger, because it adds a large product with the same sign as the trend.
    topic_code: "5.2"
  - front: Estimating r from a scatterplot description → rough guide
    back: |
      Points almost on a line: |r| about 0.9 or more. Clear trend with visible scatter: about 0.6 to 0.8. Faint trend: about 0.3 or less. Sign from the direction.
    topic_code: "5.2"
  - front: Correlation for two categorical variables → why it is wrong
    back: |
      r needs two quantitative variables. For two categorical variables, compare conditional proportions from a two-way table.
    topic_code: "5.2"
  - front: Lurking variable in a correlation → definition
    back: |
      A variable not in the analysis that is related to both x and y and can create, hide or exaggerate their association.
    topic_code: "5.2"
  - front: Pools and ice-cream shops across towns (r = 0.88) → why no causation
    back: |
      Town population is a lurking variable that drives both counts; the data are observational, so building pools would not open shops.
    topic_code: "5.2"
  - front: Showing that x causes changes in y → the design needed
    back: |
      A randomized experiment: randomly assign individuals to values (or levels) of x, control other variables, and compare the responses.
    topic_code: "5.2"
  - front: Strong correlation from a random sample → what you may conclude
    back: |
      That the association holds in the population sampled. Not cause and effect, which needs random assignment.
    topic_code: "5.2"
  - front: r computed from five players with products of z-scores adding to 3.718 → value
    back: |
      r = 3.718/(5 − 1) = 0.930 (divide by n − 1, not n).
    topic_code: "5.2"
  - front: Error-spot → "r = 0, so hours of sunlight and plant height are unrelated"
    back: |
      r = 0 means no linear association. The plot could still show a strong curve.
    topic_code: "5.2"
  - front: Error-spot → "r = 0.85, so 85% of the points are on the line"
    back: |
      r is not a percentage of points. It describes a strong positive linear association. (The percentage idea belongs to r², in week 32.)
    topic_code: "5.2"
  - front: Error-spot → "the correlation between phone use and sleep is strong and negative"
    back: |
      Incomplete: it omits form. Say "a strong, negative, linear association", and only after the plot shows a linear form.
    topic_code: "5.1"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 5.1 and 5.2: explanatory and response
    variables, describing scatterplots, the correlation r and its properties, outliers, and correlation versus
    causation), with 8 questions (33%) reviewing earlier units (summary statistics, experimental design, two-way
    tables, the Normal and binomial distributions, p-values and inference for two means). Opens with a
    shared-context set on a school café's hot-drink sales. Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes. Calculators are allowed throughout.
  questions:
    # ---- Stimulus set: hot drinks and temperature (5.1, 5.2)
    - slug: apstats-u05-w29-q01
      type: multiple_choice
      topic_code: "5.1"
      source: "AP Statistics CED, Topic 5.1"
      points: 1
      stimulus: |
        A hypothetical school café records the daily high temperature (°F) and the number of hot drinks sold on 8 school days.

        | High temperature (°F) | 38 | 42 | 47 | 51 | 55 | 60 | 64 | 70 |
        |---|---|---|---|---|---|---|---|---|
        | Hot drinks sold | 92 | 95 | 80 | 81 | 70 | 66 | 62 | 51 |
      prompt: |
        The café manager wants to know whether the temperature helps predict hot-drink sales. How should the scatterplot be set up?
      options:
        - "Hot drinks sold on the horizontal axis, because sales are what the manager cares about most"
        - "Either variable on either axis, because the axes do not matter for a scatterplot"
        - "High temperature on the horizontal axis and hot drinks sold on the vertical axis"
        - "Day number on the horizontal axis and both variables on the vertical axis"
      option_explanations:
        - |
          Reversed. The variable we care about predicting is the response, and the response goes on the vertical axis.
        - |
          When one variable is meant to predict the other, the axes matter: the explanatory variable goes on x, and the regression line later predicts y from x.
        - |
          Correct. Temperature is the explanatory variable (it may help predict sales), so it goes on the x-axis; hot drinks sold is the response on the y-axis.
        - |
          That would be a time plot of two series, not a scatterplot of the relationship between temperature and sales.
      answer: 2
    - slug: apstats-u05-w29-q02
      type: multiple_choice
      topic_code: "5.1"
      source: "AP Statistics CED, Topic 5.1"
      points: 1
      stimulus: |
        A hypothetical school café records the daily high temperature (°F) and the number of hot drinks sold on 8 school days.

        | High temperature (°F) | 38 | 42 | 47 | 51 | 55 | 60 | 64 | 70 |
        |---|---|---|---|---|---|---|---|---|
        | Hot drinks sold | 92 | 95 | 80 | 81 | 70 | 66 | 62 | 51 |
      prompt: |
        Which description of the scatterplot is best?
      options:
        - "A strong, negative, linear association between daily high temperature and hot drinks sold, with no clear outliers"
        - "A strong, positive, linear association between daily high temperature and hot drinks sold"
        - "A weak, negative, curved association, because the points do not lie exactly on a line"
        - "A strong negative correlation, so warmer weather causes students to buy fewer hot drinks"
      option_explanations:
        - |
          Correct. Sales fall steadily as temperature rises (negative), along a straight band (linear), with little scatter (strong), and no point stands apart.
        - |
          The direction is wrong: higher temperatures go with fewer hot drinks, so the association is negative.
        - |
          Points need not lie exactly on a line to be strong and linear. These follow a straight band closely, with no bend.
        - |
          These are observational data, so they do not show causation, and the description omits form and context features.
      answer: 0
    - slug: apstats-u05-w29-q03
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Statistics CED, Topic 5.2"
      points: 1
      stimulus: |
        A hypothetical school café records the daily high temperature (°F) and the number of hot drinks sold on 8 school days.

        | High temperature (°F) | 38 | 42 | 47 | 51 | 55 | 60 | 64 | 70 |
        |---|---|---|---|---|---|---|---|---|
        | Hot drinks sold | 92 | 95 | 80 | 81 | 70 | 66 | 62 | 51 |
      prompt: |
        Which value is the correlation between high temperature and hot drinks sold?
      options:
        - "0.98"
        - "−0.45"
        - "−1.35"
        - "−0.98"
      option_explanations:
        - |
          Right strength, wrong sign: sales go down as temperature goes up, so r must be negative.
        - |
          Too weak. The points hug a straight line closely, which means |r| is near 1, not near 0.45.
        - |
          Impossible: r is always between −1 and 1. This value is close to the slope of the regression line (about −1.34 drinks per degree), not r.
        - |
          Correct. Technology gives r = −0.979: a strong, negative, linear association.
      answer: 3
    - slug: apstats-u05-w29-q04
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Statistics CED, Topic 5.2"
      points: 1
      stimulus: |
        A hypothetical school café records the daily high temperature (°F) and the number of hot drinks sold on 8 school days.

        | High temperature (°F) | 38 | 42 | 47 | 51 | 55 | 60 | 64 | 70 |
        |---|---|---|---|---|---|---|---|---|
        | Hot drinks sold | 92 | 95 | 80 | 81 | 70 | 66 | 62 | 51 |
      prompt: |
        The manager converts every temperature to degrees Celsius with C = (F − 32) · 5/9 and recomputes the correlation. What happens?
      options:
        - "The correlation shrinks toward 0, because Celsius numbers are smaller"
        - "The correlation is unchanged, because a linear change of units leaves every z-score the same"
        - "The correlation is multiplied by 5/9"
        - "The correlation changes sign, because 32 is subtracted from each temperature"
      option_explanations:
        - |
          Smaller numbers do not mean a weaker association. r depends on standardized values, which do not change.
        - |
          Correct. Subtracting 32 and multiplying by the positive constant 5/9 shift and rescale every temperature equally, so each z-score and therefore r = −0.979 stay the same.
        - |
          Multiplying by 5/9 rescales the standard deviation by 5/9 as well, so the z-scores, and r, are unchanged. (The slope would change; r does not.)
        - |
          Subtracting a constant moves every point left by the same amount; it does not reverse the direction of the trend.
      answer: 1
    # ---- Topics 5.1 and 5.2
    - slug: apstats-u05-w29-q05
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Statistics CED, Topic 5.2"
      points: 1
      prompt: |
        For 40 students at a hypothetical school, the correlation between hours of sleep the night before a quiz and the quiz score is r = 0.62. Which interpretation is correct?
      options:
        - "62% of the students who slept more scored higher on the quiz."
        - "There is a moderate, positive, linear association between hours of sleep and quiz score for these students."
        - "Each extra hour of sleep raises a student's quiz score by 0.62 points."
        - "Getting more sleep causes a moderate increase in quiz scores."
      option_explanations:
        - |
          r is not a percentage of students. It is a unitless measure of linear strength and direction.
        - |
          Correct. r = 0.62 is positive and of moderate size, and it describes linear association between the two named variables.
        - |
          That is an interpretation of a slope, which has units (points per hour); r is unitless and is not a slope unless both variables are standardized.
        - |
          These are observational data, so a correlation cannot show that sleep causes higher scores.
      answer: 1
    - slug: apstats-u05-w29-q06
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Statistics CED, Topic 5.2"
      points: 1
      prompt: |
        Across 50 hypothetical school districts, the number of library books per student and the average reading score have correlation r = 0.71. The board president says, "Buying more library books will raise reading scores." What is the best response?
      options:
        - "She is right, because r = 0.71 is a strong positive correlation."
        - "She is right only if r is above 0.80."
        - "She is wrong, because r would need to be negative for books to matter."
        - "The data are observational; a lurking variable such as district funding could raise both book counts and reading scores."
      option_explanations:
        - |
          No size of r turns observational data into evidence of cause and effect; this confuses correlation with causation.
        - |
          There is no cut-off for r that establishes causation; only a randomized experiment does.
        - |
          A positive r is exactly what a beneficial effect would produce. The problem is not the sign but the lack of random assignment.
        - |
          Correct. Districts were not randomly assigned book counts. Wealthier districts can afford more books and also have other advantages that raise scores, so the association may not be causal.
      answer: 3
    - slug: apstats-u05-w29-q07
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Statistics CED, Topic 5.2"
      points: 1
      prompt: |
        A biology class grows bean plants with different daily amounts of water. Plant height rises with water up to about 60 mL a day, then falls as the soil becomes waterlogged; the points form a clear arch. The correlation is r = 0.04. Which statement is correct?
      options:
        - "There is very little linear association, but a strong curved association between water and plant height."
        - "Water and plant height are not related, because r is close to 0."
        - "There is a weak positive linear association, so more water slightly helps."
        - "The correlation must be a calculation error, because the plot shows a clear pattern."
      option_explanations:
        - |
          Correct. r measures only linear association. An arch rises and falls, so the positive and negative z-score products cancel, even though the curved relationship is strong.
        - |
          r near 0 rules out only a linear relationship. The arch shows the variables are strongly related.
        - |
          Reading only the sign and size of r ignores the plot. The pattern is curved, so describing it as linear is wrong.
        - |
          An arch naturally gives r near 0; the calculation is fine. This is why the scatterplot must be checked before using r.
      answer: 0
    - slug: apstats-u05-w29-q08
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Statistics CED, Topic 5.2"
      points: 1
      prompt: |
        Ten hypothetical runners' weekly training miles and 5K times have r = −0.85. One more runner is added who trains far more miles than anyone else but has the slowest 5K time of the group (she ran injured). What happens to the correlation?
      options:
        - "It moves closer to −1, because the new point is far from the others."
        - "It stays −0.85, because r is resistant to outliers."
        - "It moves toward 0 (and could even turn positive), because the new point goes against the negative trend."
        - "It becomes exactly 0, because one point cancels the pattern."
      option_explanations:
        - |
          A far-away point strengthens r only when it follows the trend. This one is above average in miles and above average in time, which works against a negative r.
        - |
          r is not resistant: it is built from means and standard deviations, which are pulled by unusual values.
        - |
          Correct. The new runner has a large positive zₓ and a large positive z_y, so the product is a large positive number added to a negative sum, weakening r and possibly reversing its sign.
        - |
          One point changes r, but there is no reason the result would be exactly 0; the size of the change depends on the data.
      answer: 2
    - slug: apstats-u05-w29-q09
      type: multiple_choice
      topic_code: "5.1"
      source: "AP Statistics CED, Topic 5.1"
      points: 1
      prompt: |
        A student wants to investigate commuting at her school. Which is a statistical investigative question about the relationship between two quantitative variables?
      options:
        - "How long is your commute to school, in minutes?"
        - "Do students at this school prefer the bus or the car?"
        - "For students at this school, is the distance from home to school associated with the length of the morning commute in minutes?"
        - "What was the longest commute recorded at this school last year?"
      option_explanations:
        - |
          That is a survey question asked of one person, not an investigative question about a population and a relationship.
        - |
          This compares one categorical variable (preferred mode) and involves no quantitative relationship.
        - |
          Correct. It names the population (students at this school), two quantitative variables (distance and commute time) and the relationship of interest, and it anticipates variability.
        - |
          This asks for a single value, which does not anticipate variability or involve a second variable.
      answer: 2
    # ---- Spiral review
    - slug: apstats-u05-w29-q10
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        A counsellor finds a strong negative correlation between evening phone minutes and hours of sleep among students who answered a survey. Which study would allow her to conclude that limiting evening phone use causes students to sleep more?
      options:
        - "Survey a larger random sample of students and recompute the correlation"
        - "Randomly assign volunteer students to either keep their phone out of the bedroom after 9 p.m. or follow their usual habits for two weeks, then compare mean sleep"
        - "Compare sleep for students who choose to give up their phones with students who do not"
        - "Ask students whether they think their phone use reduces their sleep"
      option_explanations:
        - |
          A larger random sample allows better generalisation of the association, but it is still observational and cannot show cause and effect.
        - |
          Correct. Random assignment of the treatment balances lurking variables such as homework load between the groups, so a difference in mean sleep can be attributed to the phone rule.
        - |
          Students who choose to give up their phones may differ in many ways (self-discipline, schedules); without random assignment those variables are confounded with the treatment.
        - |
          Opinions about the cause are not measurements of the response and are open to response bias.
      answer: 1
    - slug: apstats-u05-w29-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Statistics CED, Topic 2.2"
      points: 1
      prompt: |
        A hypothetical survey records whether each of 200 students plays a school sport (yes or no) and whether the student eats breakfast most days (yes or no). Which summary would show an association between the two variables?
      options:
        - "The correlation between the two variables is 0.4."
        - "More of the students surveyed eat breakfast than skip it."
        - "The number of athletes is larger than the number of non-athletes."
        - "The proportion of athletes who eat breakfast (0.72) is different from the proportion of non-athletes who do (0.48)."
      option_explanations:
        - |
          Correlation needs two quantitative variables; both of these are categorical.
        - |
          That is a marginal distribution of one variable; it says nothing about how breakfast relates to sports.
        - |
          Another marginal fact about one variable, which cannot show an association.
        - |
          Correct. For two categorical variables, an association shows up as different conditional proportions across the groups.
      answer: 3
    - slug: apstats-u05-w29-q12
      type: multiple_choice
      topic_code: "4.10"
      source: "AP Statistics CED, Topic 4.10"
      points: 1
      prompt: |
        Volunteers were randomly assigned to a no-phone-after-9 group or a usual-habits group. A two-sample t-test of H₀: μ₁ − μ₂ = 0 against Hₐ: μ₁ − μ₂ > 0, where μ₁ and μ₂ are the true mean hours of sleep under the two conditions, gives p-value = 0.034. Which conclusion is correct at α = 0.05?
      options:
        - "Because 0.034 < 0.05, we reject H₀. There is convincing evidence that keeping phones away after 9 p.m. increases mean sleep for volunteers like these."
        - "Because 0.034 < 0.05, we accept Hₐ and have proved that phones reduce sleep for all teenagers."
        - "Because 0.034 < 0.05, we fail to reject H₀; there is no evidence of a difference."
        - "There is a 0.034 probability that the null hypothesis is true."
      option_explanations:
        - |
          Correct. The p-value is below α, so we reject H₀; random assignment supports a causal conclusion, limited to volunteers like those in the study.
        - |
          Tests never "prove", and volunteers were not a random sample of all teenagers, so the conclusion cannot be generalised that far.
        - |
          The decision rule is reversed: a p-value below α leads to rejecting H₀.
        - |
          A p-value is computed assuming H₀ is true; it is not the probability that H₀ is true.
      answer: 0
    - slug: apstats-u05-w29-q13
      type: multiple_choice
      topic_code: "3.6"
      source: "AP Statistics CED, Topic 3.6"
      points: 1
      prompt: |
        A test of H₀: p = 0.40 against Hₐ: p > 0.40, where p is the proportion of all students at a school who drink a hot drink at least once a week, gives p̂ = 0.47 from a random sample and p-value = 0.08. Which is the correct interpretation of the p-value?
      options:
        - "Assuming the true proportion is 0.40, there is a 0.08 probability of getting a sample proportion of 0.47 or more by chance alone."
        - "There is a 0.08 probability that the true proportion is 0.40."
        - "There is a 0.08 probability that the true proportion is greater than 0.40."
        - "Assuming the true proportion is 0.47, there is a 0.08 probability of getting a sample proportion of 0.40 or less."
      option_explanations:
        - |
          Correct. The p-value is computed under H₀ (p = 0.40) and gives the probability of a result at least as extreme as the one observed, in the direction of Hₐ.
        - |
          This treats the p-value as a probability about the parameter; the parameter is fixed and the p-value assumes H₀ is true.
        - |
          The p-value is not the probability that Hₐ is true; it is a probability about sample results computed assuming H₀.
        - |
          This swaps the roles of the statistic and the parameter: the calculation assumes the null value 0.40, not the sample value 0.47.
      answer: 0
    # ---- Mixed formats
    - slug: apstats-u05-w29-q14
      type: multi_select
      topic_code: "5.1"
      source: "AP Statistics CED, Topic 5.1"
      points: 1
      partial_credit: true
      prompt: |
        A scatterplot shows the age in months (x) and resale value in dollars (y) of 25 hypothetical used phones of one model. Values fall quickly in the first year and then level off; the points bend like a ski slope and lie close to that curve. One phone, 10 months old, sold for far more than any phone of similar age. Which statements correctly describe the scatterplot? Select all that apply.
      options:
        - "The association between age and resale value is negative."
        - "The form is curved rather than linear."
        - "The association is strong around its curved form."
        - "The 10-month-old phone that sold for much more is an outlier."
        - "Because the form is curved, there is no association between age and value."
      option_explanations:
        - |
          Correct. Older phones tend to sell for less, so the direction is negative.
        - |
          Correct. Values drop steeply and then level off, which is a curve, not a straight band.
        - |
          Correct. The points lie close to the curve, so the relationship is strong even though it is not linear.
        - |
          Correct. A point far above the pattern for its x-value is an outlier and should be named in the description.
        - |
          A curved pattern is still an association; only the linear description (and r) is inappropriate.
      answer: [0, 1, 2, 3]
    - slug: apstats-u05-w29-q15
      type: multi_select
      topic_code: "5.2"
      source: "AP Statistics CED, Topic 5.2"
      points: 1
      partial_credit: true
      prompt: |
        For a data set of students' arm spans and heights, both measured in centimetres, r = 0.94. Which statements are true? Select all that apply.
      options:
        - "If both measurements are converted to inches, r is still 0.94."
        - "If height is used as the explanatory variable instead of arm span, r is still 0.94."
        - "r = 0.94 means arm span and height are measured in the same units."
        - "Adding one student whose arm span is very long but whose height is very short could change r a lot."
        - "r = 0.94 means that 94% of the students have an arm span close to their height."
      option_explanations:
        - |
          Correct. A change of units rescales every value equally and leaves the z-scores, and r, unchanged.
        - |
          Correct. The formula for r is symmetric in x and y.
        - |
          r is unitless; it would be the same with arm span in inches and height in centimetres.
        - |
          Correct. r is not resistant; a point far against the trend can pull it down sharply.
        - |
          r is not a percentage of individuals; it measures the strength and direction of linear association.
      answer: [0, 1, 3]
    - slug: apstats-u05-w29-q16
      type: true_false
      topic_code: "5.2"
      source: "AP Statistics CED, Topic 5.2"
      points: 1
      prompt: |
        True or false: If the correlation between two quantitative variables is 0, there is no relationship of any kind between them.
      answer: false
      explanation: |
        False. r = 0 means no linear association. A strong curved relationship, such as an arch, can produce r near 0, which is why the scatterplot must be checked.
    - slug: apstats-u05-w29-q17
      type: true_false
      topic_code: "1.7"
      source: "AP Statistics CED, Topic 1.7"
      points: 1
      prompt: |
        True or false: The interquartile range of a data set is resistant to outliers, but the standard deviation is not.
      answer: true
      explanation: |
        True. The IQR uses only the quartiles, which barely move when an extreme value is added; the standard deviation uses every deviation from the mean, so one extreme value can inflate it. The correlation r, built from means and standard deviations, is not resistant either.
