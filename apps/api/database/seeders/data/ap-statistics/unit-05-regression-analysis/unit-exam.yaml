  - slug: apstats-u05-exam-q41
    type: short_answer
    topic_code: "5.4"
    source: "AP Statistics CED, Topic 5.4"
    points: 3
    prompt: |
      For 32 hypothetical houses, a regression of monthly winter heating cost (dollars) on house size (hundreds of square feet) gives ŷ = 28 + 6.5x.

      (a) A 20-hundred-square-foot house has a heating cost of $171. Calculate and interpret its residual.
      (b) The residual plot shows residuals that are negative for small houses, positive for medium houses and negative for large houses. What does this tell you about the linear model?
      (c) Explain why the correlation alone could not have revealed the problem in (b).
    answer: |
      (a) ŷ = 28 + 6.5(20) = 158, so the residual is 171 − 158 = 13 dollars. The house's actual heating cost is $13 more than the cost predicted by the line from its size.
      (b) The residuals form an arch (curved pattern), so the relationship between size and heating cost is curved and a linear model is not appropriate.
      (c) r measures only the strength of a linear association; curved data can still have r close to ±1, so a strong r cannot show that the form is linear.
    explanation: |
      Three points, one per part. (a) residual 13 with ŷ = 158 shown and the interpretation "$13 more than predicted" in context. (b) curved (arch) pattern, so a linear model is not appropriate. (c) r measures linear strength only; a curved relationship can have a strong r.
  - slug: apstats-u05-exam-q42
    type: short_answer
    topic_code: "5.5"
    source: "AP Statistics CED, Topic 5.5"
    points: 3
    prompt: |
      A hypothetical bakery records the number of loaves baked and the hours of oven time on 26 days. Regression output:

      | Predictor | Coef | SE Coef | T | P |
      |---|---|---|---|---|
      | Constant | 1.84 | 0.41 | 4.49 | 0.000 |
      | Loaves | 0.052 | 0.004 | 13.00 | 0.000 |

      S = 0.62 · R-sq = 87.6% · R-sq(adj) = 87.1%

      (a) Write the equation of the least-squares line, defining your variables.
      (b) Interpret R-sq in context.
      (c) A student says, "The P-value of 0.000 for Loaves shows the model is appropriate." Explain what you should use instead to judge whether the linear model is appropriate on this course.
    answer: |
      (a) predicted oven hours = 1.84 + 0.052 (loaves), where loaves is the number of loaves baked that day.
      (b) About 87.6% of the variation in daily oven time is accounted for by the linear model relating oven time to the number of loaves baked.
      (c) The SE Coef, T and P columns are for inference about the slope, which is not part of this course, and a small P-value does not show the form is linear anyway. Use a residual plot: random scatter with no curve or fan supports a linear model (together with r² and s to judge how well it fits).
    explanation: |
      Three points, one per part. (a) correct coefficients with ŷ or "predicted" and variables named. (b) r² template in context. (c) residual plot named as the check for appropriateness (no pattern), with a note that the P column is not used here.
  # ---- Free-response questions (10 points each)
  - slug: apstats-u05-exam-q43
    type: long_answer
    topic_code: "5.5"
    source: "AP Statistics CED, Topic 5.5"
    points: 10
    prompt: |
      A high school football coach measures the vertical jump (cm) and 40-yard sprint time (seconds) of 10 hypothetical players.

      | Player | A | B | C | D | E | F | G | H | I | J |
      |---|---|---|---|---|---|---|---|---|---|---|
      | Jump (cm) | 48 | 52 | 55 | 58 | 60 | 63 | 66 | 70 | 72 | 38 |
      | Sprint (s) | 5.32 | 5.18 | 5.15 | 5.02 | 5.05 | 4.88 | 4.85 | 4.71 | 4.70 | 5.10 |

      With all 10 players: predicted sprint time = 5.955 − 0.0165 (jump), r = −0.834, s = 0.120 seconds.
      Without player J: predicted sprint time = 6.572 − 0.0263 (jump), r = −0.990, s = 0.033 seconds.

      (A) Describe the relationship between vertical jump and sprint time for these 10 players.
      (B) Using the line for all 10 players, interpret the slope in context.
      (C) Using the line for all 10 players, calculate and interpret the residual for player E.
      (D) Player J recently recovered from a knee injury. Classify player J as an outlier, a high-leverage point, an influential point, or a combination, and justify your answer using the two lines.
      (E) The coach concludes, "Training players to jump higher will make them faster sprinters." Explain whether these data support that conclusion, and describe how the coach could investigate it.
    answer: |
      (A) There is a strong, negative, linear association between vertical jump and 40-yard sprint time: players who jump higher tend to have faster (lower) sprint times. Player J (38 cm, 5.10 s) is unusual: his jump is far lower than everyone else's, and his time is much faster than the pattern of the other nine would predict.
      (B) For each additional centimetre of vertical jump, the predicted 40-yard sprint time decreases by 0.0165 seconds.
      (C) ŷ = 5.955 − 0.0165(60) = 4.965 seconds, so the residual is 5.05 − 4.965 = 0.085 seconds (0.084 with unrounded coefficients). Player E's actual sprint time is about 0.085 seconds slower (greater) than the time predicted by the line from his 60 cm jump.
      (D) Player J is a high-leverage point, because his jump (38 cm) is far from the other jumps (48 to 72 cm) and from x̄. He is also influential: removing him changes the slope from −0.0165 to −0.0263 seconds per cm (it becomes about 60% steeper), changes the intercept from 5.955 to 6.572, and strengthens r from −0.834 to −0.990. He is also an outlier relative to the other nine players' pattern (the line without him predicts 6.572 − 0.0263(38) = 5.57 seconds, but he ran 5.10), and his removal shrinks s from 0.120 to 0.033 seconds.
      (E) No. The players were not randomly assigned to jump training; the data are observational. A lurking variable such as leg strength or overall athletic ability could make players both jump higher and sprint faster. To investigate, the coach could randomly assign volunteer players to a jump-training programme or a regular-training group for several weeks, keep other training the same, and compare the mean change in sprint times between the groups.
    explanation: |
      Ten points. (A) 2 points: 1 for direction, form and strength (strong, negative, linear) in context; 1 for identifying player J as unusual with his values. (B) 2 points: 1 for "predicted" sprint time decreasing by 0.0165 seconds; 1 for "each additional centimetre of jump" (both variables in context, correct units). (C) 2 points: 1 for ŷ ≈ 4.965 and residual ≈ 0.085 (accept 0.08 to 0.09); 1 for the interpretation (actual time about 0.085 s greater than predicted from a 60 cm jump). (D) 2 points: 1 for high leverage with the reason (jump far from the others); 1 for influential, justified by the change in slope (or r, or intercept) when J is removed, with the values quoted. Calling J only an outlier earns at most 1 point. (E) 2 points: 1 for "no" because the data are observational, with a plausible lurking variable; 1 for an experiment with random assignment of jump training, control of other training and a comparison of sprint times. Required language: "predicted" in (B), residual = actual − predicted in (C).
  - slug: apstats-u05-exam-q44
    type: long_answer
    topic_code: "5.5"
    source: "AP Statistics CED, Topic 5.5"
    points: 10
    prompt: |
      A hypothetical pizza shop takes a random sample of 40 deliveries from last month and records the delivery distance (miles, from 0.5 to 8.0) and the delivery time (minutes, from order to door). The scatterplot is linear, and the residual plot shows random scatter of roughly constant width. A histogram of the residuals is roughly symmetric and mound-shaped.

      | Predictor | Coef | SE Coef | T | P |
      |---|---|---|---|---|
      | Constant | 9.2737 | 1.0241 | 9.06 | 0.000 |
      | Distance | 3.1550 | 0.2155 | 14.64 | 0.000 |

      S = 3.1486 · R-sq = 84.9% · R-sq(adj) = 84.5%

      (A) Interpret the slope and the y-intercept in context.
      (B) Find the predicted delivery time for an order 5 miles away.
      (C) The shop promises delivery within 30 minutes. Assume that delivery times for orders 5 miles away are approximately Normal, with mean equal to the predicted time in (B) and standard deviation equal to S. Find the probability that a 5-mile order takes more than 30 minutes.
      (D) On one evening, 6 independent orders are all 5 miles away. Using your answer to (C), find the probability that at least one of the 6 takes more than 30 minutes.
      (E) Interpret R-sq in context. The manager wants to use the line to predict the time for a 15-mile delivery to a new neighbourhood. Comment on this plan.
    answer: |
      (A) Slope: for each additional mile of distance, the predicted delivery time increases by about 3.16 minutes. Intercept: an order 0 miles away has a predicted delivery time of about 9.27 minutes, which can be read as the time to make and box the pizza (though 0 miles is just outside the 0.5 to 8.0 mile range of the data).
      (B) ŷ = 9.2737 + 3.1550(5) = 25.05 minutes.
      (C) Let T = delivery time for a 5-mile order, approximately Normal with mean 25.05 and SD 3.1486. z = (30 − 25.05)/3.1486 = 1.57. P(T > 30) = P(Z > 1.57) ≈ 0.058.
      (D) Let X = number of the 6 orders that take more than 30 minutes; X is binomial with n = 6 and p = 0.058. P(X ≥ 1) = 1 − P(X = 0) = 1 − (1 − 0.058)⁶ = 1 − 0.942⁶ ≈ 1 − 0.699 = 0.301.
      (E) About 84.9% of the variation in delivery time is accounted for by the linear model relating delivery time to distance. A 15-mile delivery is far outside the 0.5 to 8.0 miles in the data, so using the line there is extrapolation: traffic, highways or driver routes could change the relationship, and the prediction (about 56.6 minutes) is not reliable. The sample came from last month's deliveries, so even within range it describes the shop's deliveries under similar conditions.
