      - "Random scatter of roughly constant width around 0"
      - "Residuals that fan out as x increases"
      - "An arch: negative, then positive, then negative"
      - "Some positive and some negative residuals"
    option_explanations:
      - |
        Correct. A U shape means the relationship is curved.
      - |
        Random scatter with constant width is exactly what an appropriate linear model produces.
      - |
        Correct. A fan means predictions become less precise as x grows.
      - |
