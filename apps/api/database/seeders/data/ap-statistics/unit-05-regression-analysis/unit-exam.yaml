      Ten points. (A) 2 points: 1 for the slope with "predicted", about 3.16 minutes per additional mile, in context; 1 for the intercept as the predicted time at 0 miles (about 9.27 minutes) with a sensible comment (preparation time, or outside the data). (B) 1 point: 25.05 minutes (accept 25.0 to 25.1). (C) 3 points: 1 for naming the Normal distribution with mean 25.05 and SD 3.1486 (or a labelled sketch); 1 for the boundary 30 and the direction (greater than), with z ≈ 1.57 or a calculator command with labelled values; 1 for the probability ≈ 0.058 (accept 0.057 to 0.059). (D) 2 points: 1 for identifying a binomial setting (n = 6, p from (C)) or the complement 1 − P(none late); 1 for ≈ 0.30 (accept 0.29 to 0.31, or a value consistent with an incorrect (C)). (E) 2 points: 1 for the r² interpretation in context; 1 for identifying the 15-mile prediction as extrapolation beyond 8 miles, with a reason it may be unreliable.
