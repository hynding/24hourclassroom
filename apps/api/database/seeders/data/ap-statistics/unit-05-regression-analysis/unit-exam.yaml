  - slug: apstats-u05-exam-q32
    type: true_false
    topic_code: "5.2"
    source: "AP Statistics CED, Topic 5.2"
    points: 1
    prompt: |
      True or false: The correlation between arm span and height is the same whether arm span or height is used as the explanatory variable.
    answer: true
    explanation: |
      True. r = (1/(n − 1)) Σ zₓ z_y is symmetric in x and y, so swapping the variables does not change it. (The regression line does change: the line predicting height from arm span is not the line predicting arm span from height.)
  - slug: apstats-u05-exam-q33
    type: true_false
    topic_code: "5.5"
    source: "AP Statistics CED, Topic 5.5"
    points: 1
    prompt: |
      True or false: A high-leverage point is always an influential point.
    answer: false
    explanation: |
      False. A high-leverage point (x far from x̄) is influential only if removing it noticeably changes the line. If it lies along the pattern of the other points, removing it changes the slope very little.
  - slug: apstats-u05-exam-q34
    type: true_false
    topic_code: "5.4"
    source: "AP Statistics CED, Topic 5.4"
    points: 1
    prompt: |
      True or false: The residuals from a least-squares regression line always add up to 0.
    answer: true
    explanation: |
      True. Because the least-squares line passes through (x̄, ȳ), the positive and negative residuals balance exactly, so their sum (and mean) is 0. Small departures in hand calculations come from rounding the coefficients.
