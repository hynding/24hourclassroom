      type: numeric
      topic_code: "4.5"
      source: "AP Statistics CED, Topic 4.5"
      points: 1
      prompt: |
        A school tests H₀: μ = 8 against Hₐ: μ < 8, where μ is the mean hours of sleep per school night for all its students. A random sample of 36 students gives x̄ = 7.4 hours and s = 1.5 hours. Find the test statistic t, to two decimal places.
      answer: { value: -2.40, tolerance: 0.006 }
      explanation: |
        t = (x̄ − μ₀)/(s/√n) = (7.4 − 8)/(1.5/√36) = −0.6/0.25 = −2.40, with df = 35.
    - slug: apstats-u05-w31-q22
      type: short_answer
      topic_code: "5.4"
      source: "AP Statistics CED, Topic 5.4"
      points: 3
      prompt: |
        For 20 hypothetical used bicycles, a regression of resale price (dollars) on age (years) gives ŷ = 410 − 32x. A 5-year-old bicycle sold for $190.

        (a) Calculate the residual for this bicycle.
        (b) Interpret the residual in context.
        (c) The residual plot for all 20 bicycles shows residuals that are positive for the youngest and oldest bicycles and negative for middle-aged ones. What does this suggest about the linear model?
      answer: |
        (a) ŷ = 410 − 32(5) = 250 dollars, so the residual is 190 − 250 = −60 dollars.
        (b) The actual resale price of this 5-year-old bicycle is $60 less than the price predicted by the regression line from its age.
        (c) The residuals form a U-shaped (curved) pattern, so the relationship between age and price is curved and a linear model is not appropriate (prices drop quickly at first and then level off).
      explanation: |
        Three points, one per part. (a) −60 with the predicted value 250 shown. (b) "$60 less than predicted" with context (resale price, age of 5 years); a wrong sign from (a) carried through correctly earns this point. (c) curved/U-shaped pattern, so a linear model is not appropriate.
    - slug: apstats-u05-w31-q23
      type: short_answer
      topic_code: "3.14"
      source: "AP Statistics CED, Topic 3.14"
      points: 3
      prompt: |
        A random sample of 80 ninth graders and an independent random sample of 80 twelfth graders at a large school report how they usually get to school.

        | | Bus | Car | Walk | Total |
        |---|---|---|---|---|
        | Ninth grade | 42 | 24 | 14 | 80 |
        | Twelfth grade | 18 | 46 | 16 | 80 |
        | Total | 60 | 70 | 30 | 160 |

        (a) Name the appropriate chi-square test and state its hypotheses.
        (b) Find the expected count of twelfth graders who usually travel by car, and explain whether the expected counts condition is met.
      answer: |
        (a) A chi-square test for homogeneity, because there are two separate random samples (one per grade). H₀: the distribution of usual travel mode is the same for all ninth graders and all twelfth graders at the school. Hₐ: the distributions of travel mode are not the same for the two grades.
        (b) Expected = (80 × 70)/160 = 35. The smallest expected count is (80 × 30)/160 = 15, so all expected counts (30, 35 and 15 in each row) are at least 5 and the condition is met.
      explanation: |
        Three points. (a) 2 points: 1 for "chi-square test for homogeneity" (a test for independence with a correct reason earns no credit here, because there are two samples), 1 for hypotheses about the population distributions of travel mode for the two grades. (b) 1 point: expected count 35 with the calculation, and all expected counts ≥ 5.
    - slug: apstats-u05-w31-q24
      type: long_answer
      topic_code: "5.4"
      source: "AP Statistics CED, Topic 5.4"
      points: 6
      prompt: |
        A veterinary clinic records the age (weeks) and weight (kg) of 9 hypothetical puppies of one breed. The regression line is ŷ = 0.722 + 0.4167x, with r = 0.962.

        | Age (weeks) | 8 | 10 | 12 | 14 | 16 | 18 | 20 | 22 | 24 |
        |---|---|---|---|---|---|---|---|---|---|
        | Weight (kg) | 3.1 | 4.6 | 6.0 | 7.2 | 8.1 | 8.8 | 9.3 | 9.6 | 9.8 |
        | Residual | ? | −0.29 | 0.28 | 0.64 | ? | 0.58 | 0.24 | −0.29 | −0.92 |

        (A) Calculate the two missing residuals (ages 8 and 16 weeks).
        (B) Interpret the residual for the 16-week-old puppy in context.
        (C) Describe the pattern a residual plot of these residuals against age would show.
        (D) A student says, "r = 0.962, so the linear model is clearly appropriate." Do you agree? Explain, and describe what the residual pattern says about the line's predictions for very young and older puppies.
      answer: |
        (A) Age 8: ŷ = 0.722 + 0.4167(8) = 4.06, residual = 3.1 − 4.06 = −0.96 kg. Age 16: ŷ = 0.722 + 0.4167(16) = 7.39, residual = 8.1 − 7.39 = 0.71 kg.
        (B) The actual weight of the 16-week-old puppy is 0.71 kg more than the weight predicted by the regression line from its age.
        (C) The residuals are negative at the youngest ages, positive in the middle (12 to 20 weeks) and negative again at the oldest ages: an arch (curved) pattern, not random scatter.
        (D) Disagree. A high r measures linear strength but cannot show the form is linear; the arch in the residual plot shows the growth curve bends (puppies gain quickly and then level off). The line overpredicts the weights of the youngest and the oldest puppies (negative residuals) and underpredicts in the middle, so a linear model is not appropriate; a curved model would fit better.
      explanation: |
        Six points. (A) 2 points: 1 for each residual (−0.96 and 0.71; accept −0.95 to −0.96 and 0.71 to 0.72), each with ŷ shown. (B) 1 point: 0.71 kg more than predicted, in context (weight, 16 weeks). (C) 1 point: negative, positive, negative (an arch or curve), described as a systematic pattern. (D) 2 points: 1 for disagreeing because r cannot establish linearity and the residual plot is curved; 1 for stating that the line overpredicts at both ends (young and older puppies) and underpredicts in the middle.
