        df = 24, t* = 2.064. Margin of error = 2.064 × 1.3/√25 = 2.064 × 0.26 = 0.537. Upper endpoint = 7.1 + 0.537 = 7.637 hours (interval 6.563 to 7.637).
    - slug: apstats-u05-w30-q22
      type: short_answer
      topic_code: "5.3"
      source: "AP Statistics CED, Topic 5.3"
      points: 3
      prompt: |
        A hypothetical school records the daily heating cost of its gym (dollars) and the outdoor high temperature (°F) on 40 winter and spring days with highs from 20°F to 75°F. The regression line is

        predicted heating cost = 68.5 − 0.86 (temperature)

        (a) Interpret the slope in context.
        (b) Interpret the y-intercept in context, and say whether the data support it.
        (c) A colleague uses the line to predict the heating cost on a 90°F day. Compute the prediction and comment on it.
      answer: |
        (a) For each additional degree Fahrenheit of outdoor high temperature, the predicted daily heating cost decreases by $0.86.
        (b) On a day with an outdoor high of 0°F, the predicted heating cost is $68.50. 0°F is outside the observed range of 20°F to 75°F, so this is an extrapolation and the data do not directly support it.
        (c) ŷ = 68.5 − 0.86(90) = −8.90 dollars. A negative cost is impossible; 90°F is outside the range of the data (heating cost cannot fall below 0, so the pattern must level off), so this extrapolation is not trustworthy.
      explanation: |
        Three points, one per part. (a) slope with "predicted", the direction (decreases), units (dollars per degree) and context. (b) intercept as the predicted cost at 0°F, with the comment that 0°F is outside the data. (c) −$8.90 (or −8.9) and the comment that it is an extrapolation outside 20 to 75°F; just saying "negative" without naming extrapolation earns no point.
    - slug: apstats-u05-w30-q23
      type: short_answer
      topic_code: "3.8"
      source: "AP Statistics CED, Topic 3.8"
      points: 3
      prompt: |
        A school will install more bike racks if there is convincing evidence that more than 15% of its students bike to school. It tests H₀: p = 0.15 against Hₐ: p > 0.15, where p is the proportion of all students at the school who bike to school, using a random sample.

        (a) Describe a Type I error in context, and its consequence.
        (b) Describe a Type II error in context, and its consequence.
        (c) Name one way the school could reduce the probability of a Type II error.
      answer: |
        (a) A Type I error would be concluding that more than 15% of students bike when in fact the true proportion is 0.15. The school would spend money on racks that are not needed.
        (b) A Type II error would be failing to find convincing evidence that more than 15% bike when the true proportion really is greater than 0.15. The school would not install racks, and bikes would be crowded or locked to fences.
        (c) Take a larger random sample (or use a larger α, which raises the Type I error risk).
      explanation: |
        Three points, one per part. (a) rejecting H₀ when p = 0.15 is true, in context, with a consequence. (b) failing to reject H₀ when p > 0.15 is true, in context, with a consequence. (c) increase the sample size (or increase α, acknowledging the trade-off). Do not award (a) or (b) for answers that only restate "reject a true null" without context.
    - slug: apstats-u05-w30-q24
      type: long_answer
      topic_code: "5.3"
      source: "AP Statistics CED, Topic 5.3"
      points: 6
      prompt: |
        An English teacher records, for 8 hypothetical book reports, the length in pages and the number of minutes she needed to grade it.

        | Pages | 2 | 3 | 4 | 5 | 6 | 8 | 9 | 10 |
        |---|---|---|---|---|---|---|---|---|
        | Minutes to grade | 7 | 9 | 10 | 13 | 14 | 17 | 20 | 21 |

        The scatterplot shows a strong, positive, linear pattern.

        (A) Use technology to find the equation of the regression line for predicting grading time from pages. Define any variables you use.
        (B) Interpret the slope of the line in context.
        (C) Interpret the y-intercept in context. Does it have a sensible meaning here? Explain.
        (D) Predict the grading time for a 7-page report and for a 30-page report. Which prediction is more trustworthy? Explain.
      answer: |
        (A) predicted minutes = 3.51 + 1.764 (pages), where pages is the length of the report and predicted minutes is the predicted grading time. (Technology: a = 3.5096, b = 1.7643.)
        (B) For each additional page in a report, the predicted grading time increases by about 1.76 minutes.
        (C) For a report with 0 pages, the predicted grading time is about 3.5 minutes. It has a loose meaning (fixed time to read the rubric and enter the grade), but no report had fewer than 2 pages, so 0 pages is outside the data and the value is an extrapolation.
        (D) 7 pages: 3.51 + 1.764(7) ≈ 15.9 minutes. 30 pages: 3.51 + 1.764(30) ≈ 56.4 minutes. The 7-page prediction is more trustworthy: 7 is inside the observed 2 to 10 page range (interpolation), while 30 is far outside it (extrapolation), where grading time might grow differently.
      explanation: |
        Six points. (A) 2 points: 1 for a ≈ 3.51 and b ≈ 1.76 (accept 3.5 and 1.76 or better), 1 for ŷ or "predicted" with both variables defined in context. (B) 1 point: "predicted", increase of about 1.76 minutes per additional page, context. (C) 1 point: the predicted time at 0 pages, with a comment that 0 pages is outside the data (an answer that says it has a reasonable meaning as fixed overhead also earns the point if it notes x = 0 was not observed). (D) 2 points: 1 for both predictions (about 15.9 and 56.4 minutes), 1 for choosing 7 pages with interpolation versus extrapolation explained.
