    - slug: apstats-u05-w32-q20
      type: numeric
      topic_code: "5.5"
      source: "AP Statistics CED, Topic 5.5"
      points: 1
      prompt: |
        For a hypothetical sample of students, hours of weekly practice (x) and a music test score (y) have x̄ = 6, sₓ = 2.5, ȳ = 40, s_y = 8 and r = 0.75. Find the y-intercept of the least-squares line for predicting score from practice hours, to one decimal place.
      answer: { value: 25.6, tolerance: 0.051 }
      explanation: |
        b = r · s_y/sₓ = 0.75 × 8/2.5 = 2.4 points per hour. a = ȳ − b x̄ = 40 − 2.4(6) = 40 − 14.4 = 25.6.
    - slug: apstats-u05-w32-q21
      type: numeric
      topic_code: "3.13"
      source: "AP Statistics CED, Topic 3.13"
      points: 1
      prompt: |
        A two-sample z-test for p₁ − p₂ compares the proportions of students who use the online practice set weekly at two schools. Random samples give p̂₁ = 0.62 (n₁ = 150) and p̂₂ = 0.50 (n₂ = 160). Using the pooled proportion, find the test statistic z, to two decimal places.
      answer: { value: 2.13, tolerance: 0.011 }
      explanation: |
        Pooled p̂ = (93 + 80)/310 = 0.558. SE = √(0.558 × 0.442 × (1/150 + 1/160)) = 0.0564. z = (0.62 − 0.50)/0.0564 = 2.13.
    - slug: apstats-u05-w32-q22
      type: short_answer
      topic_code: "5.5"
      source: "AP Statistics CED, Topic 5.5"
      points: 3
      prompt: |
        A student council records the daily high temperature (°F, from 55 to 91) and the number of ice-cream cones sold at a school stand on 22 hypothetical days. The scatterplot is linear and the residual plot shows no pattern.

        | Predictor | Coef | SE Coef | T | P |
        |---|---|---|---|---|
        | Constant | −19.2621 | 13.6024 | −1.42 | 0.172 |
        | Temperature | 1.3063 | 0.1864 | 7.01 | 0.000 |

        S = 9.0485 · R-sq = 71.1% · R-sq(adj) = 69.6%

        (a) Write the equation of the least-squares line, defining your variables.
        (b) Interpret the value of S in context.
        (c) Find the correlation r, and interpret R-sq in context.
      answer: |
        (a) predicted cones sold = −19.2621 + 1.3063 (temperature), where temperature is the daily high in °F.
        (b) The actual number of cones sold on a day typically varies by about 9 cones from the number predicted by the line using that day's high temperature.
        (c) r = +√0.711 = 0.843 (positive because the slope is positive). About 71.1% of the variation in the number of cones sold is accounted for by the linear model relating cones sold to daily high temperature.
      explanation: |
        Three points, one per part. (a) correct coefficients with ŷ or "predicted" and both variables named. (b) s as the typical distance between actual and predicted cones sold, with units and context. (c) r = 0.843 with the positive sign justified, and the r² interpretation in context; both needed.
    - slug: apstats-u05-w32-q23
      type: short_answer
      topic_code: "4.9"
      source: "AP Statistics CED, Topic 4.9"
      points: 3
      prompt: |
        A teacher wants to know whether students who use an online practice set score higher, on average, than students who do not. She randomly assigns 30 volunteers to use the set and 30 not to use it, and records each student's quiz score.

        (a) Name the appropriate inference procedure.
        (b) State the hypotheses, defining the parameters.
        (c) State and check the conditions, given that boxplots of both groups' scores show no strong skew or outliers.
      answer: |
        (a) A two-sample t-test for a difference in means, μ₁ − μ₂.
        (b) H₀: μ₁ − μ₂ = 0 and Hₐ: μ₁ − μ₂ > 0, where μ₁ is the true mean quiz score for students like these who use the practice set and μ₂ is the true mean quiz score for students like these who do not.
        (c) Random: the students were randomly assigned to the two groups. Normal/large sample: both groups have n = 30, and the boxplots show no strong skew or outliers, so the sampling distribution of x̄₁ − x̄₂ is approximately Normal. (No 10% condition is needed for random assignment.)
      explanation: |
        Three points, one per part. (a) two-sample t-test for μ₁ − μ₂ (a paired test earns no credit: the groups are separate). (b) one-sided hypotheses about population means with both parameters defined in context. (c) random assignment named, and the Normal/large sample condition checked with the sample sizes or the boxplots.
    - slug: apstats-u05-w32-q24
      type: long_answer
      topic_code: "5.5"
      source: "AP Statistics CED, Topic 5.5"
      points: 6
      prompt: |
        A hypothetical ride service records the distance (miles) and fare (dollars) for 10 rides. Nine are ordinary rides of 3 to 15 miles; the tenth is a 30-mile ride to the airport charged a flat fare of $12.00. For all 10 rides: x̄ = 11.3 miles, sₓ = 7.631 miles, ȳ = $8.40, s_y = $2.580, r = 0.860, s = $1.40.

        (A) Use the summary statistics to find the least-squares line for predicting fare from distance. Show your work.
        (B) Interpret the slope in context.
        (C) Interpret r² in context.
        (D) Find the residual for the airport ride.
        (E) Without the airport ride, the line is predicted fare = 2.73 + 0.572 (distance) and r = 0.987. Describe the airport ride as an outlier, a high-leverage point, an influential point, or a combination, and explain using the change in the line.
      answer: |
        (A) b = r · s_y/sₓ = 0.860 × 2.580/7.631 = 0.291 dollars per mile. a = ȳ − b x̄ = 8.40 − 0.291(11.3) = 5.11. Predicted fare = 5.11 + 0.291 (distance).
        (B) For each additional mile of distance, the predicted fare increases by about $0.29.
        (C) r² = 0.860² = 0.740: about 74% of the variation in fares is accounted for by the linear model relating fare to distance.
        (D) ŷ = 5.11 + 0.291(30) = 13.84, so the residual is 12.00 − 13.84 = −1.84 dollars: the airport fare is $1.84 less than predicted.
        (E) The airport ride is a high-leverage point (30 miles is far from the other distances of 3 to 15 miles and from x̄) and it is influential: removing it nearly doubles the slope (0.291 to 0.572 dollars per mile), changes the intercept (5.11 to 2.73) and raises r from 0.860 to 0.987. Its residual (−1.84) is not huge, because the point pulls the line toward itself, so it is not mainly an outlier; its influence comes from its leverage combined with not following the per-mile pattern (a flat fare).
      explanation: |
        Six points. (A) 2 points: 1 for b ≈ 0.291 from the formula with work shown, 1 for a ≈ 5.11 and the equation with ŷ or "predicted" and variables named. (B) 1 point: slope with "predicted", about $0.29 per additional mile. (C) 1 point: r² ≈ 0.74 (accept 73.9% to 74%) with the template in context. (D) 1 point: −1.84 (accept −1.8 to −1.9) with ŷ shown. (E) 1 point: high leverage and influential, justified by the large change in slope (or r) when it is removed; an answer that calls it only an outlier earns no credit.
