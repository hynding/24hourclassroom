week: 13
unit: 2
title: "The Normal Distribution"
topics: ["2.11"]
guide: guides/week-13.md
guide_description: |
  Density curves and the normal distribution N(μ, σ), how the mean and standard deviation shape the curve, the
  empirical rule (68–95–99.7), z-scores and the standard normal distribution, finding areas below, above and
  between values with a complete four-part write-up, percentiles and working backwards to an unknown standard
  deviation, and checking whether a normal model is reasonable. Worked examples: the empirical rule for nightly
  sleep (mean 7.1 hours, SD 1.2 hours), the proportion sleeping between 6.5 and 8 hours, comparing a chemistry
  score with a history score by z-scores, the 90th percentile of sleep, the standard deviation a juice machine
  needs so that only 2% of bottles are underfilled, and why homework times are not normal.
flashcards_description: |
  30 cards on density curves, the normal parameters, the empirical rule, z-scores, normal areas and percentiles,
  working backwards to μ or σ, the four-part write-up, and when a normal model is not appropriate.

flashcards:
  - front: Density curve → two defining properties
    back: |
      It is never below the horizontal axis, and the total area under it is exactly 1. Area over an interval = proportion of values in that interval.
    topic_code: "2.11"
  - front: Continuous model, P(X = one exact value) → what it equals
    back: |
      0: a single point has no area. So P(X < a) = P(X ≤ a) for a normal model.
    topic_code: "2.11"
  - front: Normal distribution N(μ, σ) → shape and what fixes it
    back: |
      Symmetric, single-peaked and bell-shaped; completely determined by its mean μ (centre) and standard deviation σ (spread).
    topic_code: "2.11"
  - front: Normal curve → where the mean and median sit
    back: |
      Both at the centre, under the peak: in a normal distribution mean = median.
    topic_code: "2.11"
  - front: Normal curve inflection points → location
    back: |
      At μ − σ and μ + σ, where the curve changes from bending down to bending up.
    topic_code: "2.11"
  - front: Normal curve, increasing σ with μ fixed → what happens to the picture
    back: |
      The curve becomes lower and wider (total area stays 1); the centre does not move.
    topic_code: "2.11"
  - front: Normal curve, increasing μ with σ fixed → what happens to the picture
    back: |
      The whole curve slides right; its shape and spread are unchanged.
    topic_code: "2.11"
  - front: Empirical rule → the three percentages
    back: |
      About 68% within μ ± σ, 95% within μ ± 2σ, 99.7% within μ ± 3σ. Normal distributions only.
    topic_code: "2.11"
  - front: Empirical rule → proportion above μ + σ
    back: |
      About 16%: (100% − 68%)/2.
    topic_code: "2.11"
  - front: Empirical rule → proportion above μ + 2σ
    back: |
      About 2.5%: (100% − 95%)/2. So μ + 2σ is about the 97.5th percentile.
    topic_code: "2.11"
  - front: Sleep N(7.1, 1.2) hours → interval holding the middle 95%
    back: |
      7.1 ± 2(1.2): from 4.7 to 9.5 hours.
    topic_code: "2.11"
  - front: z-score formula → and what it measures
    back: |
      z = (x − μ)/σ: how many standard deviations x is above (+) or below (−) the mean. No units.
    topic_code: "2.11"
  - front: Standard normal distribution → definition
    back: |
      N(0, 1): the distribution of z-scores from any normal distribution.
    topic_code: "2.11"
  - front: Interpreting a z-score of 0.625 for a 20-hour battery (mean 18.5 h) → template
    back: |
      A battery lasting 20 hours lasts 0.625 standard deviations longer than the mean battery life of 18.5 hours.
    topic_code: "2.11"
  - front: Comparing scores from different distributions → method
    back: |
      Convert each to a z-score; the larger z (or the more negative z when lower is better, as in race times) is the relatively better performance.
    topic_code: "2.11"
  - front: Chemistry 88 (mean 76, SD 8) versus history 41 (mean 34, SD 4) → which is relatively better
    back: |
      Chemistry z = 1.50, history z = 1.75: the history score.
    topic_code: "2.11"
  - front: Normal area question → the four parts of a full answer
    back: |
      (1) Name the distribution and the probability: X is N(7.1, 1.2), P(X < 6). (2) z-score or labelled calculator inputs. (3) The area. (4) The answer in context.
    topic_code: "2.11"
  - front: Sleep N(7.1, 1.2) → proportion sleeping under 6 hours
    back: |
      z = (6 − 7.1)/1.2 = −0.92; area 0.18. About 18% of students sleep less than 6 hours.
    topic_code: "2.11"
  - front: Area between two values a and b in a normal model → method
    back: |
      Area to the left of b minus area to the left of a (or normalcdf(a, b, μ, σ)).
    topic_code: "2.11"
  - front: normalcdf versus invNorm → when to use each
    back: |
      normalcdf: you know the value(s), want the area. invNorm: you know the area to the left, want the value.
    topic_code: "2.11"
  - front: Finding a normal percentile → steps
    back: |
      Find z with the given area to its left (invNorm or table), then x = μ + zσ.
    topic_code: "2.11"
  - front: Sleep N(7.1, 1.2) → 90th percentile
    back: |
      z = 1.2816; x = 7.1 + 1.2816(1.2) = 8.64 hours.
    topic_code: "2.11"
  - front: Cut-off for the top 5% of a normal distribution → which percentile
    back: |
      The 95th percentile (area 0.95 to the left), z = 1.645. Not the 5th percentile.
    topic_code: "2.11"
  - front: Unknown σ from a percentile → method
    back: |
      Find z for the known area, then solve z = (x − μ)/σ for σ: σ = (x − μ)/z.
    topic_code: "2.11"
  - front: Juice machine, mean 350 mL, only 2% under 340 mL → required σ
    back: |
      z = −2.054; σ = (340 − 350)/(−2.054) = 4.87 mL.
    topic_code: "2.11"
  - front: Quick check that a non-negative variable is not normal → rule of thumb
    back: |
      If the mean is less than about 2 SDs above 0, a normal model puts a noticeable share below 0, so the data must be skewed right.
    topic_code: "2.11"
  - front: Homework times, mean 52 min, SD 38 min, minimum 0 → normal or not?
    back: |
      Not normal: a normal model gives P(X < 0) ≈ 0.086, impossible for a time. The distribution is skewed right.
    topic_code: "2.11"
  - front: Error-spot → "z = (15 − 18.5)/2.4² for a battery with σ = 2.4 hours"
    back: |
      Divide by the standard deviation, not the variance: z = (15 − 18.5)/2.4 = −1.46.
    topic_code: "2.11"
  - front: Error-spot → "about 95% of homework times are within 2 SDs of the mean, by the empirical rule"
    back: |
      The empirical rule holds only for normal distributions; homework times are skewed right, so the percentages do not apply.
    topic_code: "2.11"
  - front: Error-spot → "normalcdf(−1000, 6, 7.1, 1.2)" as a complete answer
    back: |
      Bare calculator syntax earns no credit on its own. Name the distribution N(7.1, 1.2), state P(X < 6) or z = −0.92, give 0.18 and answer in context.
    topic_code: "2.11"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 2.11: normal curves and their parameters, the
    empirical rule, z-scores, areas, percentiles, working backwards, and when a normal model is reasonable), with
    9 questions (36%) reviewing weeks 8 to 12 (two-way tables, simulation, probability rules, conditional
    probability, discrete random variables and the binomial distribution). Opens with a shared-context set on
    phone battery life. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. A calculator is allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: battery life (2.11)
    - slug: apstats-u02-w13-q01
      type: multiple_choice
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      stimulus: |
        For a hypothetical phone model, the battery life on a full charge under typical use is approximately normally distributed with mean 18.5 hours and standard deviation 2.4 hours.
      prompt: |
        What proportion of these phones have a battery life of less than 15 hours?
      options:
        - "0.928"
        - "0.272"
        - "0.072"
        - "0.025"
      option_explanations:
        - |
          0.928 is the area to the right of 15 hours, the proportion lasting longer than 15 hours: the wrong tail.
        - |
          0.272 comes from dividing by the variance: (15 − 18.5)/5.76 = −0.61. A z-score divides by the standard deviation.
        - |
          Correct. z = (15 − 18.5)/2.4 = −1.46, and the area to the left of z = −1.46 is about 0.072. About 7.2% of these phones last less than 15 hours.
        - |
          0.025 treats 15 hours as two standard deviations below the mean, but it is only 1.46 SDs below (2 SDs below is 13.7 hours).
      answer: 2
    - slug: apstats-u02-w13-q02
      type: multiple_choice
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      stimulus: |
        For a hypothetical phone model, the battery life on a full charge under typical use is approximately normally distributed with mean 18.5 hours and standard deviation 2.4 hours.
      prompt: |
        What proportion of these phones have a battery life between 16 and 21 hours?
      options:
        - "0.702"
        - "0.851"
        - "0.149"
        - "0.298"
      option_explanations:
        - |
          Correct. z = (16 − 18.5)/2.4 = −1.04 and z = (21 − 18.5)/2.4 = 1.04; the area between is 0.851 − 0.149 = 0.702.
        - |
          0.851 is the area to the left of 21 hours only; the phones lasting under 16 hours must be subtracted.
        - |
          0.149 is the area to the left of 16 hours, the proportion lasting less than 16 hours.
        - |
          0.298 is the area outside the interval (both tails together), the complement of the proportion asked for.
      answer: 0
    - slug: apstats-u02-w13-q03
      type: numeric
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      stimulus: |
        For a hypothetical phone model, the battery life on a full charge under typical use is approximately normally distributed with mean 18.5 hours and standard deviation 2.4 hours.
      prompt: |
        The manufacturer advertises the battery life of the longest-lasting 5% of these phones. What battery life separates the top 5% from the rest? Give your answer in hours to two decimal places.
      answer: { value: 22.45, tolerance: 0.02 }
      explanation: |
        The top 5% lie above the 95th percentile. The z-score with 0.95 to its left is 1.645, so x = 18.5 + 1.645(2.4) = 22.45 hours.
    - slug: apstats-u02-w13-q04
      type: multiple_choice
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      stimulus: |
        For a hypothetical phone model, the battery life on a full charge under typical use is approximately normally distributed with mean 18.5 hours and standard deviation 2.4 hours.
      prompt: |
        A phone of this model lasts 20 hours, so its z-score is 0.625. Which is the correct interpretation of this z-score?
      options:
        - "The phone's battery lasted 0.625 hours longer than the mean battery life."
        - "62.5% of phones of this model have a battery life shorter than 20 hours."
        - "The phone's battery lasted 1.5 standard deviations longer than the mean battery life."
        - "The phone's battery lasted 0.625 standard deviations longer than the mean battery life of 18.5 hours."
      option_explanations:
        - |
          A z-score is measured in standard deviations, not hours; 20 hours is 1.5 hours above the mean, which is 0.625 SDs.
        - |
          A z-score is not a percentile. The area to the left of z = 0.625 is about 0.734, so about 73% of phones last less than 20 hours.
        - |
          1.5 is the difference in hours (20 − 18.5); dividing by σ = 2.4 converts it to 0.625 standard deviations.
        - |
          Correct. z = (20 − 18.5)/2.4 = 0.625: the battery life is 0.625 standard deviations above the mean of 18.5 hours.
      answer: 3
    # ---- Independent items
    - slug: apstats-u02-w13-q05
      type: multiple_choice
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      prompt: |
        At a hypothetical farm, egg weights are approximately normal with mean 58 grams and standard deviation 4 grams. By the empirical rule, about what percent of eggs weigh between 50 and 66 grams?
      options:
        - "68%"
        - "95%"
        - "99.7%"
        - "47.5%"
      option_explanations:
        - |
          68% is the share within one standard deviation (54 to 66 grams); 50 to 66 grams reaches two SDs on each side.
        - |
          Correct. 50 = 58 − 2(4) and 66 = 58 + 2(4), so the interval is μ ± 2σ, which holds about 95% of a normal distribution.
        - |
          99.7% is the share within three standard deviations, from 46 to 70 grams.
        - |
          47.5% is the share between the mean and two SDs on one side only; this interval extends two SDs on both sides.
      answer: 1
    - slug: apstats-u02-w13-q06
      type: multiple_choice
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      prompt: |
        For the same eggs (approximately normal, mean 58 grams, SD 4 grams), the empirical rule says that about what percent of eggs weigh more than 62 grams?
      options:
        - "34%"
        - "32%"
        - "68%"
        - "16%"
      option_explanations:
        - |
          34% is the share between the mean (58 g) and one SD above it (62 g); the question asks for the share above 62 g.
        - |
          32% is the share more than one SD from the mean on either side; only the upper tail is wanted.
        - |
          68% is the share within one SD of the mean, between 54 and 62 grams.
        - |
          Correct. 62 = μ + σ. About 68% lie within one SD, leaving 32% outside, split evenly: about 16% above 62 grams.
      answer: 3
    - slug: apstats-u02-w13-q07
      type: multiple_choice
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      prompt: |
        At a hypothetical track meet, a long jumper jumps 5.6 m in an event where jumps have mean 5.1 m and SD 0.3 m. A 1,600-m runner finishes in 320 seconds in an event where times have mean 345 seconds and SD 12 seconds. Both distributions are approximately normal. Which athlete performed better relative to the field?
      options:
        - "The jumper, because her z-score of 1.67 is greater than the runner's z-score of −2.08"
        - "The jumper, because 5.6 m is above the mean while 320 seconds is below the mean"
        - "The runner, because her time is 2.08 standard deviations faster than the mean, while the jump is only 1.67 standard deviations above the mean"
        - "Neither can be compared, because the events are measured in different units."
      option_explanations:
        - |
          Comparing signed z-scores ignores that a lower time is better. The runner's −2.08 is 2.08 SDs in the good direction, more than the jumper's 1.67.
        - |
          Being below the mean is good for a race time. Direction must be read in context, and the sizes of the z-scores decide the comparison.
        - |
          Correct. Jumper: z = (5.6 − 5.1)/0.3 = 1.67. Runner: z = (320 − 345)/12 = −2.08. Lower times are better, so the runner was 2.08 SDs better than average, the jumper 1.67.
        - |
          z-scores have no units, which is exactly what makes performances in different units comparable.
      answer: 2
    - slug: apstats-u02-w13-q08
      type: multiple_choice
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      prompt: |
        A hypothetical cereal-filling machine puts a mean of 510 grams into each box, and fill weights are approximately normal. The plant manager wants only 1% of boxes to contain less than 500 grams. What is the largest standard deviation the machine can have?
      options:
        - "About 4.30 grams"
        - "About 23.26 grams"
        - "About 6.08 grams"
        - "About 2.33 grams"
      option_explanations:
        - |
          Correct. The z-score with 0.01 to its left is −2.326. Solve −2.326 = (500 − 510)/σ: σ = 10/2.326 ≈ 4.30 grams.
        - |
          23.26 multiplies the 10-gram gap by z instead of dividing by it; σ = (x − μ)/z.
        - |
          6.08 = 10/1.645 uses the z-score for 5% in one tail, not 1%.
        - |
          2.33 is the z-score itself; it still has to be converted into grams using the 10-gram gap.
      answer: 0
    - slug: apstats-u02-w13-q09
      type: multiple_choice
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      prompt: |
        Distribution A is normal with mean 50 and standard deviation 5. Distribution B is normal with mean 50 and standard deviation 10. Which statement is true?
      options:
        - "B's curve is taller than A's, because B has the larger standard deviation."
        - "B's curve is lower and wider than A's, and both are centred at 50."
        - "B's curve is centred to the right of A's."
        - "A has a larger proportion of values above 60 than B does."
      option_explanations:
        - |
          A larger SD spreads the same total area (1) over a wider range, so the curve must be lower, not taller.
        - |
          Correct. Equal means put both peaks at 50; B's larger SD spreads its area more widely, so its curve is lower and wider.
        - |
          The means are equal, so the centres coincide; the SD changes only the spread.
        - |
          60 is 2 SDs above the mean for A (about 2.3% above) but only 1 SD for B (about 16% above), so B has the larger share.
      answer: 1
    - slug: apstats-u02-w13-q10
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Statistics CED, Topic 2.3"
      points: 1
      prompt: |
        A student wants to simulate a free throw that succeeds with probability 0.3, using one random digit from 0 to 9 for each shot. Which assignment of digits models the shot correctly?
      options:
        - "Digits 0, 1, 2, 3 represent a made shot; 4 to 9 represent a miss."
        - "Digit 3 represents a made shot, because 3 corresponds to 30%; all other digits represent a miss."
        - "Digits 0, 1, 2 represent a made shot; 3 to 8 represent a miss; 9 is ignored."
        - "Digits 0, 1, 2 represent a made shot; 3 to 9 represent a miss."
      option_explanations:
        - |
          Four of the ten digits gives a success probability of 0.4, not 0.3.
        - |
          One digit out of ten gives a probability of 0.1. The number of digits assigned, not their value, sets the probability.
        - |
          Ignoring 9 leaves nine usable digits, three of them successes, so the probability becomes 3/9 ≈ 0.33.
        - |
          Correct. Three of the ten equally likely digits represent success, so each shot succeeds with probability 3/10 = 0.3.
      answer: 3
    - slug: apstats-u02-w13-q11
      type: multiple_choice
      topic_code: "2.10"
      source: "AP Statistics CED, Topic 2.10"
      points: 1
      prompt: |
        On a hypothetical bus route, 25% of riders pay with a phone app, independently of one another. For a random group of 8 riders, what is the probability that exactly 2 pay with the app?
      options:
        - "0.311"
        - "0.063"
        - "0.011"
        - "0.679"
      option_explanations:
        - |
          Correct. X is binomial with n = 8, p = 0.25: P(X = 2) = 8C2 · 0.25² · 0.75⁶ = 28 · 0.0625 · 0.178 ≈ 0.311.
        - |
          0.063 = 0.25² considers only the two app users and ignores the six other riders and the different orders.
        - |
          0.011 = 0.25² · 0.75⁶ is the probability of one particular order; the 8C2 = 28 orders are missing.
        - |
          0.679 = binomcdf(8, 0.25, 2) is P(X ≤ 2), not exactly 2.
      answer: 0
    - slug: apstats-u02-w13-q12
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Statistics CED, Topic 2.9"
      points: 1
      prompt: |
        X = the number of siblings of a randomly chosen student in a hypothetical club, with P(X = 0) = 0.5, P(X = 1) = 0.3 and P(X = 2) = 0.2. The mean of X is 0.7. What is the standard deviation of X?
      options:
        - "0.61"
        - "1.05"
        - "0.78"
        - "0.70"
      option_explanations:
        - |
          0.61 = Σ(x − μ)²P(x) is the variance; the standard deviation is its square root.
        - |
          1.05 = √(Σx²P(x)) = √1.1 forgets to subtract the mean: the variance is 1.1 − 0.7² = 0.61.
        - |
          Correct. Variance = (0 − 0.7)²(0.5) + (1 − 0.7)²(0.3) + (2 − 0.7)²(0.2) = 0.245 + 0.027 + 0.338 = 0.61, so σ = √0.61 ≈ 0.78 siblings.
        - |
          0.70 is the mean, not the standard deviation.
      answer: 2
    - slug: apstats-u02-w13-q13
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Statistics CED, Topic 2.2"
      points: 1
      prompt: |
        A hypothetical survey of 150 students at one school asked whether they keep their phone in the bedroom overnight and whether they usually sleep 8 or more hours.

        | | 8+ hours | Under 8 hours | Total |
        |---|---|---|---|
        | Phone in bedroom | 18 | 72 | 90 |
        | No phone in bedroom | 27 | 33 | 60 |
        | Total | 45 | 105 | 150 |

        Which statement is supported by these data?
      options:
        - "Keeping a phone in the bedroom causes students to sleep less."
        - "In this sample, 45% of students without a phone in the bedroom sleep 8+ hours, compared with 20% of those with one, so phone location and sleep are associated."
        - "80% of the students who sleep under 8 hours keep a phone in the bedroom."
        - "There is no association, because more students sleep under 8 hours (105) than 8 or more (45) in both groups."
      option_explanations:
        - |
          This is an observational survey with no random assignment, so it can show an association but not cause and effect.
        - |
          Correct. Conditional proportions: 27/60 = 0.45 without a phone versus 18/90 = 0.20 with one. The proportions differ a lot, so the variables are associated in this sample.
        - |
          80% = 72/90 is the proportion of phone-in-bedroom students who sleep under 8 hours; of those sleeping under 8 hours, 72/105 ≈ 69% keep a phone there. The condition is swapped.
        - |
          Association is judged by comparing conditional proportions across groups (0.20 versus 0.45), not by whether the same category is the majority in both.
      answer: 1
    - slug: apstats-u02-w13-q14
      type: multi_select
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 2
      partial_credit: true
      prompt: |
        X has a normal distribution with mean μ and standard deviation σ. Which statements are true? Select all that apply.
      options:
        - "The mean and the median of X are equal."
        - "Increasing σ, with μ unchanged, makes the curve taller and narrower."
        - "About 16% of values of X lie above μ + σ."
        - "P(X = μ) = 0.5"
        - "The curve's inflection points are at μ − σ and μ + σ."
      option_explanations:
        - |
          Correct. A normal curve is symmetric about μ, so half the area lies on each side of the mean, which makes it the median too.
        - |
          A larger σ spreads the area out: the curve becomes lower and wider, not taller.
        - |
          Correct. About 68% lie within μ ± σ, leaving 32% outside, half of it (16%) above μ + σ.
        - |
          For a continuous distribution any exact value has probability 0; it is P(X ≤ μ) that equals 0.5.
        - |
          Correct. One standard deviation either side of the mean is where the curve changes from bending down to bending up.
      answer: [0, 2, 4]
    - slug: apstats-u02-w13-q15
      type: multi_select
      topic_code: "2.10"
      source: "AP Statistics CED, Topic 2.10"
      points: 2
      partial_credit: true
      prompt: |
        For which random variables is a binomial model appropriate? Select all that apply.
      options:
        - "The number of heads in 12 flips of a fair coin"
        - "The number of red cards in 10 cards drawn with replacement from a standard 52-card deck"
        - "The number of cards drawn from a shuffled deck until the first ace appears"
        - "The number absent on a given day among 6 friends who always ride to school together in one car"
        - "The number of defective bulbs among 20 chosen at random from a production run of 50,000 bulbs, 2% of which are defective"
      option_explanations:
        - |
          Correct. Each flip is heads or tails, n = 12 is fixed, flips are independent and p = 0.5 every time.
        - |
          Correct. Drawing with replacement keeps the trials independent with p = 26/52 = 0.5 on each of the fixed 10 draws.
        - |
          The count is of draws until the first ace, so the number of trials is not fixed; this is not binomial.
        - |
          The friends share a car, so if one is absent because the car breaks down the others probably are too; the trials are not independent.
        - |
          Correct. Each bulb is defective or not, n = 20 is fixed, p = 0.02, and 20 is far below 10% of 50,000, so the picks are approximately independent.
      answer: [0, 1, 4]
    - slug: apstats-u02-w13-q16
      type: true_false
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 1
      prompt: |
        True or false: For any distribution of a quantitative variable, about 95% of the values lie within two standard deviations of the mean.
      answer: false
      explanation: |
        False. The 68–95–99.7 percentages describe normal distributions only. A strongly skewed distribution, or one with outliers, can have a quite different share within two standard deviations of its mean.
    - slug: apstats-u02-w13-q17
      type: true_false
      topic_code: "2.4"
      source: "AP Statistics CED, Topic 2.4"
      points: 1
      prompt: |
        True or false: After a fair coin lands tails five times in a row, the probability of heads on the sixth flip is greater than 0.5, because heads is "due".
      answer: false
      explanation: |
        False. Flips of a fair coin are independent, so the probability of heads on the next flip is still 0.5. The law of large numbers describes the long-run relative frequency over many flips; it does not make short-run outcomes correct themselves.
