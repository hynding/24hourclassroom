      source: "AP Statistics CED, Topic 2.11"
      points: 3
      prompt: |
        A hypothetical survey of students' nightly homework time reports mean 52 minutes, standard deviation 38 minutes, median 41 minutes and minimum 0 minutes.

        (a) If homework time were normal with this mean and standard deviation, what proportion of students would do less than 0 minutes of homework?
        (b) Use your answer to (a) to explain why a normal model is not appropriate for these times.
        (c) What other evidence in the summary points the same way, and what shape is the distribution likely to have?
      answer: |
        (a) z = (0 − 52)/38 = −1.37; P(Z < −1.37) ≈ 0.086, about 8.6% of students.
        (b) A homework time cannot be negative, so a model that puts about 9% of students below 0 minutes does not fit the data; the distribution cannot be normal.
        (c) The mean (52) is well above the median (41), which a long right tail produces. The distribution is likely skewed right: many students near 0 to 60 minutes and a few with very long homework times.
      explanation: |
        Three points, one per part. (a) 0.086 (accept 0.085 to 0.09) with the z-score or labelled calculator inputs. (b) the explicit link: negative times are impossible, so a normal model with this mean and SD cannot describe the data. (c) mean greater than median as evidence, with "skewed right".
    - slug: apstats-u02-w13-q24
      type: short_answer
      topic_code: "2.10"
      source: "AP Statistics CED, Topic 2.10"
      points: 3
      prompt: |
        For the hypothetical phone model with battery life normal, mean 18.5 hours, SD 2.4 hours, the proportion of phones lasting less than 15 hours is 0.072. A school buys 6 of these phones, chosen at random from a large shipment. Let X = the number of the 6 phones whose battery lasts less than 15 hours.

        (a) Name the distribution of X and its parameters, and say why it applies.
        (b) Find the probability that at least one of the 6 phones lasts less than 15 hours.
        (c) Find the mean of X and interpret it in context.
      answer: |
        (a) X is binomial with n = 6 and p = 0.072: each phone lasts under 15 hours or not, there are 6 phones, the phones are chosen at random from a large shipment so they are independent (6 is far below 10% of the shipment), and each has the same probability 0.072.
        (b) P(X ≥ 1) = 1 − P(X = 0) = 1 − (1 − 0.0724)⁶ ≈ 0.363 (rounding p to 0.072 first gives 1 − 0.928⁶ ≈ 0.361).
        (c) μ = np = 6(0.072) ≈ 0.43 phones. If the school bought many sets of 6 phones, the number lasting less than 15 hours would average about 0.43 per set in the long run.
      explanation: |
        Three points, one per part. (a) binomial, n = 6, p = 0.072, with at least independence (random selection from a large shipment) and the fixed n mentioned. (b) 0.363 (accept 0.36 to 0.364) via the complement. (c) 0.43 with a long-run-average interpretation; "the school will get 0.43 short-lived phones" earns no point.
    - slug: apstats-u02-w13-q25
      type: long_answer
      topic_code: "2.11"
      source: "AP Statistics CED, Topic 2.11"
      points: 6
      prompt: |
        At a hypothetical middle school, the weights of students' loaded backpacks are approximately normal with mean 6.8 kg and standard deviation 1.5 kg.

        (A) What proportion of backpacks weigh more than 9 kg? Show your work.

        (B) What proportion of backpacks weigh between 5 kg and 8 kg?

        (C) The school nurse plans to talk with the students whose backpacks are among the heaviest 15%. Above what weight is a backpack in the heaviest 15%?

        (D) Four students are chosen at random, independently. Find the probability that at least one of them carries a backpack heavier than 9 kg.
      answer: |
        (A) Let X = backpack weight, X is N(6.8, 1.5). z = (9 − 6.8)/1.5 = 1.47; P(X > 9) = P(Z > 1.47) ≈ 0.071. About 7.1% of backpacks weigh more than 9 kg.
        (B) z = (5 − 6.8)/1.5 = −1.20 and z = (8 − 6.8)/1.5 = 0.80. P(5 < X < 8) = 0.7881 − 0.1151 ≈ 0.673. About 67% of backpacks weigh between 5 and 8 kg.
        (C) The heaviest 15% lie above the 85th percentile. z = 1.036, so x = 6.8 + 1.036(1.5) ≈ 8.35 kg. Backpacks heavier than about 8.35 kg are in the heaviest 15%.
        (D) Each student independently has probability 0.071 of a backpack over 9 kg. P(at least one) = 1 − (1 − 0.0712)⁴ ≈ 0.256 with the unrounded probability (the table value 0.0708 for z = 1.47, or 0.929⁴, gives about 0.255).
      explanation: |
        Six points.
        (A) 1 point: 0.071 (accept 0.070 to 0.072) with the distribution named and the z-score or labelled calculator inputs, answered in context.
        (B) 2 points: 1 for both z-scores (or both labelled bounds) and the subtraction of areas; 1 for 0.673 (accept 0.67).
        (C) 2 points: 1 for using the 85th percentile (area 0.85 to the left, z ≈ 1.04); 1 for 8.35 kg (accept 8.3 to 8.4). Using the 15th percentile (5.25 kg) earns at most 1 point if the method is otherwise correct.
        (D) 1 point: 0.256 (accept 0.25 to 0.26) using the complement and the multiplication rule for independent events (or binomial with n = 4, p = 0.071).
