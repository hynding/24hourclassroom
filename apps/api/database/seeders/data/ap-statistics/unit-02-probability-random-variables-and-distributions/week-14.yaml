      prompt: |
        During a hypothetical online exam, a student's laptop battery fails with probability 0.10 and, independently, the school Wi-Fi fails with probability 0.05.

        (a) Find the probability that both fail.
        (b) Find the probability that at least one of them fails.
        (c) Are the events "battery fails" and "Wi-Fi fails" mutually exclusive? Explain.
      answer: |
        (a) Independent events: P(both) = 0.10 × 0.05 = 0.005.
        (b) P(battery or Wi-Fi) = 0.10 + 0.05 − 0.005 = 0.145 (or 1 − 0.90 × 0.95 = 0.145).
        (c) No. P(both) = 0.005 is not 0, so both can happen together; independent events with positive probabilities cannot be mutually exclusive.
      explanation: |
        Three points, one per part. (a) 0.005 using the multiplication rule for independent events. (b) 0.145 by the general addition rule or the complement. (c) "not mutually exclusive" with the reason P(both) ≠ 0.
