      prompt: |
        In a hypothetical city, 4% of adults ride a bicycle to work. A reporter takes a random sample of 100 adults from the city's 250,000 adults and records p̂, the proportion who bike to work.

        (a) Find the mean and standard deviation of the sampling distribution of p̂, checking the condition that the standard deviation formula needs.
        (b) Is the sampling distribution of p̂ approximately normal? Justify your answer.
        (c) Describe the likely shape, and explain what sample size would be needed for a normal model.
      answer: |
        (a) Mean = p = 0.04. 100 ≤ 10% of 250,000, so SD(p̂) = √(0.04 · 0.96/100) = √0.000384 ≈ 0.0196.
        (b) No. np = 100(0.04) = 4, which is less than 10, so the Large Counts condition fails.
        (c) The sampling distribution of p̂ is skewed right: p̂ cannot go below 0, which is only about 2 SDs below the mean, while it can go far above. A normal model needs np ≥ 10, so n ≥ 10/0.04 = 250 (then n(1 − p) = 240 ≥ 10 as well).
      explanation: |
        Three points, one per part. (a) mean 0.04 and SD ≈ 0.0196 with the 10% condition checked. (b) "not approximately normal" with np = 4 < 10 shown. (c) skewed right with a reason and n ≥ 250.
    - slug: apstats-u02-w14-q24
      type: short_answer
