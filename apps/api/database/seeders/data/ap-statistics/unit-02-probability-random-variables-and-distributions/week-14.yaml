      type: long_answer
      topic_code: "2.12"
      source: "AP Statistics CED, Topic 2.12"
      points: 6
      prompt: |
        At a hypothetical high school of 1,500 students, one-way commute times are skewed right, with mean 24 minutes and standard deviation 11 minutes.

        (A) Can you use a normal model to find the probability that one randomly chosen student's commute is longer than 30 minutes? Explain.

        (B) A random sample of 50 students is selected. Describe the sampling distribution of x̄, the sample mean commute time: give its shape, mean and standard deviation, and check the conditions that justify each.

        (C) Find the probability that the sample mean commute time for the 50 students is more than 27 minutes.

        (D) How large a random sample would be needed for the standard deviation of the sampling distribution of x̄ to be 1 minute?
      answer: |
        (A) No. The population of commute times is skewed right, so a normal model does not describe individual students, and we do not know the population's exact shape.
        (B) Shape: approximately normal, by the Central Limit Theorem, because n = 50 ≥ 30. Mean: 24 minutes (x̄ is unbiased for μ). SD: 50 ≤ 10% of 1,500 = 150, so SD(x̄) = 11/√50 ≈ 1.56 minutes.
        (C) z = (27 − 24)/1.556 = 1.93; P(x̄ > 27) ≈ 0.027. About 2.7% of random samples of 50 students would have a mean commute above 27 minutes.
        (D) 11/√n = 1 gives √n = 11, so n = 121 students (still under 10% of 1,500).
      explanation: |
        Six points.
        (A) 1 point: "no" with the reason that the population is skewed, not normal (the CLT does not apply to one individual).
        (B) 3 points: 1 for "approximately normal" justified by the CLT with n = 50 ≥ 30; 1 for mean 24; 1 for SD ≈ 1.56 with the 10% condition (50 ≤ 150) checked. Using σ = 11 as the SD earns no SD point.
        (C) 1 point: 0.027 (accept 0.026 to 0.028) with the z-score or labelled calculator inputs using SD(x̄).
        (D) 1 point: n = 121 with the equation shown.
