week: 8
unit: 2
title: "Two-Way Tables and Their Summary Statistics"
topics: ["2.1", "2.2"]
guide: guides/week-08.md
guide_description: |
  Two-way tables for two categorical variables: joint, marginal and conditional relative frequencies and the
  "out of whom?" question that picks the denominator; side-by-side bar charts, segmented bar charts and mosaic
  plots; deciding whether two categorical variables are associated by comparing conditional distributions; the
  difference of conditional proportions as a summary statistic; and why an association in an observational
  study is not cause and effect. Worked examples: how 400 sophomores and seniors get to school, phones in the
  bedroom and 8 hours of sleep for 250 students, and building the "no association" table for part-time jobs by
  class year.
flashcards_description: |
  30 cards on joint, marginal and conditional relative frequencies, choosing the right denominator, segmented
  bar charts and mosaic plots, describing an association between two categorical variables, the difference of
  conditional proportions, and the limits of an observational two-way table.

flashcards:
  - front: Two-way table → what each cell and each margin holds
    back: |
      Each cell counts individuals in one row category and one column category. Row totals and column totals (the margins) count each category of one variable alone; the corner is the grand total.
    topic_code: "2.1"
  - front: Joint relative frequency in a two-way table → formula and meaning
    back: |
      Cell count ÷ grand total. The proportion of all individuals who are in that row category and that column category.
    topic_code: "2.1"
  - front: Marginal distribution in a two-way table → how to compute it
    back: |
      Divide each row total (or each column total) by the grand total. It describes one variable and ignores the other.
    topic_code: "2.1"
  - front: Conditional distribution in a two-way table → how to compute it
    back: |
      Divide each cell in one row by that row's total (or each cell in one column by that column's total). The proportions add to 1 within that row or column.
    topic_code: "2.1"
  - front: Joint, marginal or conditional → the "out of whom?" test
    back: |
      Out of everyone, for two categories → joint. Out of everyone, for one variable → marginal. Out of one row or one column only → conditional.
    topic_code: "2.1"
  - front: Travel survey (400 sophomores and seniors) → joint relative frequency of "senior and car"
    back: |
      128/400 = 0.32: 32% of all the students surveyed are seniors who come by car.
    topic_code: "2.1"
  - front: Travel survey → proportion of sophomores who ride the bus versus proportion of bus riders who are sophomores
    back: |
      96/180 ≈ 0.533 (divide by sophomores) versus 96/140 ≈ 0.686 (divide by bus riders). Different denominators, different questions.
    topic_code: "2.1"
  - front: "\"Proportion of drivers who are seniors\" → which total goes in the denominator"
    back: |
      The driver total (the column total for car). The group after "of" is the group you condition on.
    topic_code: "2.1"
  - front: Side-by-side bar chart of counts → when it can mislead
    back: |
      When the groups have different sizes: a bigger group has taller bars even if its conditional distribution is the same. Plot conditional percents instead.
    topic_code: "2.1"
  - front: Segmented bar chart → how it is built
    back: |
      One bar per category of the explanatory variable, each bar 100% tall, divided into segments by the conditional distribution of the other variable.
    topic_code: "2.1"
  - front: Segmented bar chart → what no association looks like
    back: |
      Every bar is divided at the same heights: the segments line up across the bars, because every conditional distribution is the same.
    topic_code: "2.2"
  - front: Mosaic plot → what bar width, segment height and tile area show
    back: |
      Width: the marginal proportion of each bar category. Height within a bar: the conditional proportion. Area of a tile: the joint relative frequency.
    topic_code: "2.1"
  - front: Mosaic plot with a wider column for seniors → what that tells you
    back: |
      Seniors are a larger share of the whole sample. It says nothing about how seniors answered; segment heights show that.
    topic_code: "2.1"
  - front: Association between two categorical variables → definition
    back: |
      The variables are associated if the conditional distribution of one variable differs across the categories of the other. Knowing one value changes what you expect for the other.
    topic_code: "2.2"
  - front: No association between two categorical variables → what the conditional distributions look like
    back: |
      All the conditional distributions are identical, and each one equals the marginal distribution of that variable.
    topic_code: "2.2"
  - front: Difference of conditional proportions → what it summarises
    back: |
      p̂₁ − p̂₂ for the same outcome in two groups. Near 0 suggests little association; the farther from 0, the stronger the association in the sample.
    topic_code: "2.2"
  - front: Phones and sleep (250 students) → conditional proportions sleeping 8+ hours
    back: |
      Phone in bedroom: 42/180 ≈ 0.233. No phone: 34/70 ≈ 0.486. Difference ≈ 0.252, so phone location and sleep are associated in this sample.
    topic_code: "2.2"
  - front: Phones and sleep → why the survey cannot show phones cause less sleep
    back: |
      It is observational: students chose where their phones stay. A confounder such as strict household bedtime rules could affect both phone location and sleep.
    topic_code: "2.2"
  - front: Marginal proportion versus the conditional proportions → where it must fall
    back: |
      Between the smallest and the largest conditional proportion: it is a weighted average of them, pulled toward the larger group.
    topic_code: "2.2"
  - front: Building a no-association table from a marginal of 60% with jobs (80 juniors, 120 seniors) → cell counts
    back: |
      Juniors: 0.60 × 80 = 48 job, 32 no job. Seniors: 0.60 × 120 = 72 job, 48 no job. Both conditional proportions equal 0.60.
    topic_code: "2.2"
  - front: Comparing two schools of different sizes on walking to school → what to compare
    back: |
      Conditional proportions, not counts. 180 walkers of 900 is 20%; 90 walkers of 300 is 30%, so walking is more common at the smaller school.
    topic_code: "2.2"
  - front: Writing up an association between two categorical variables → the three things to include
    back: |
      Name both variables in context; compare specific conditional proportions with clear denominators; say which way the association goes (which group is more likely to have which outcome).
    topic_code: "2.2"
  - front: "\"Associated\" versus \"correlated\" → which word fits two categorical variables"
    back: |
      Associated. Correlation measures the linear relationship between two quantitative variables (week 29).
    topic_code: "2.2"
  - front: Explanatory variable in a two-way table → which direction to condition
    back: |
      Condition on the explanatory variable: compute the distribution of the response within each explanatory category, and compare those.
    topic_code: "2.1"
  - front: Equal row totals in a two-way table → what they tell you about association
    back: |
      Nothing. Association depends on the conditional distributions inside the rows, not on whether the rows have the same totals.
    topic_code: "2.2"
  - front: Association found in a random sample of a school → scope of the conclusion
    back: |
      It can be generalised to the whole school (the population sampled), but it is still an association, not cause and effect, unless treatments were randomly assigned.
    topic_code: "2.2"
  - front: Conditional proportions within one row → the check that you divided correctly
    back: |
      They add to 1 (100%) across the row, apart from rounding. Joint relative frequencies add to 1 over the whole table instead.
    topic_code: "2.1"
  - front: Error-spot → "40 of the 80 eleventh graders eat school lunch, so the joint relative frequency is 0.50"
    back: |
      40/80 is a conditional proportion (out of eleventh graders). The joint relative frequency divides by the grand total: 40/320 = 0.125.
    topic_code: "2.1"
  - front: Error-spot → "more students walk at the large school (180 versus 90), so walking is more common there"
    back: |
      Counts from groups of different sizes cannot be compared. As proportions, 180/900 = 0.20 is less than 90/300 = 0.30.
    topic_code: "2.2"
  - front: Error-spot → "students without a phone in the bedroom sleep more, so removing phones will improve sleep"
    back: |
      That is a cause-and-effect claim from an observational survey. Only an experiment with random assignment could support it.
    topic_code: "2.2"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topics 2.1 and 2.2: joint, marginal and conditional
    relative frequencies, segmented bar charts and mosaic plots, and describing an association between two
    categorical variables), with 9 questions (41%) reviewing weeks 1 to 7 (investigative questions, frequency
    tables, summary statistics and outliers, comparing distributions, sampling methods and bias, and the scope of
    observational studies). Opens with a shared-context set on one two-way table. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes. Calculators are allowed.
  questions:
    # ---- Stimulus set: school lunch by grade (2.1, 2.2)
    - slug: apstats-u02-w08-q01
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Statistics CED, Topic 2.1"
      points: 1
      stimulus: |
        A hypothetical high school surveyed a random sample of 80 students from each grade and asked whether they usually eat the school lunch.

        | Grade | Eats school lunch | Does not | Total |
        |---|---|---|---|
        | 9 | 62 | 18 | 80 |
        | 10 | 55 | 25 | 80 |
        | 11 | 40 | 40 | 80 |
        | 12 | 31 | 49 | 80 |
        | Total | 188 | 132 | 320 |
      prompt: |
        What proportion of all 320 students surveyed are eleventh graders who eat the school lunch?
      options:
        - "0.500"
        - "0.213"
        - "0.125"
        - "0.588"
      option_explanations:
        - |
          40/80 = 0.500 is the conditional proportion of eleventh graders who eat lunch; the question asks out of all 320 students.
        - |
          40/188 ≈ 0.213 conditions on eating school lunch (the proportion of lunch eaters who are eleventh graders), not on the whole sample.
        - |
          Correct. This is a joint relative frequency: the cell count over the grand total, 40/320 = 0.125.
        - |
          188/320 ≈ 0.588 is the marginal proportion of all students who eat school lunch, ignoring grade.
      answer: 2
    - slug: apstats-u02-w08-q02
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Statistics CED, Topic 2.1"
      points: 1
      stimulus: |
        A hypothetical high school surveyed a random sample of 80 students from each grade and asked whether they usually eat the school lunch.

        | Grade | Eats school lunch | Does not | Total |
        |---|---|---|---|
        | 9 | 62 | 18 | 80 |
        | 10 | 55 | 25 | 80 |
        | 11 | 40 | 40 | 80 |
        | 12 | 31 | 49 | 80 |
        | Total | 188 | 132 | 320 |
      prompt: |
        Among the students who eat the school lunch, what proportion are twelfth graders?
      options:
        - "0.165"
        - "0.388"
        - "0.097"
        - "0.250"
      option_explanations:
        - |
          Correct. Condition on the lunch eaters: 31 of the 188 students who eat school lunch are twelfth graders, 31/188 ≈ 0.165.
        - |
          31/80 ≈ 0.388 is the reversed conditional: the proportion of twelfth graders who eat lunch, not the proportion of lunch eaters who are twelfth graders.
        - |
          31/320 ≈ 0.097 divides by the grand total, giving the joint relative frequency instead of a conditional proportion.
        - |
          80/320 = 0.250 is the marginal proportion of twelfth graders in the whole sample; it ignores who eats lunch.
      answer: 0
    - slug: apstats-u02-w08-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Statistics CED, Topic 2.2"
      points: 1
      stimulus: |
        A hypothetical high school surveyed a random sample of 80 students from each grade and asked whether they usually eat the school lunch.

        | Grade | Eats school lunch | Does not | Total |
        |---|---|---|---|
        | 9 | 62 | 18 | 80 |
        | 10 | 55 | 25 | 80 |
        | 11 | 40 | 40 | 80 |
        | 12 | 31 | 49 | 80 |
        | Total | 188 | 132 | 320 |
      prompt: |
        Which statement best describes the relationship between grade and eating the school lunch in this sample?
      options:
        - "There is no association, because each grade has the same number of students."
        - "Moving up a grade causes students to stop eating the school lunch."
        - "There is an association, because more students eat the school lunch (188) than do not (132)."
        - "There is an association: the proportion who eat the school lunch falls from 0.775 in grade 9 to 0.388 in grade 12."
      option_explanations:
        - |
          Equal row totals say nothing about association; what matters is whether the conditional distributions differ across grades, and they do.
        - |
          A survey is an observational study with no treatment imposed, so it can show an association but not that grade causes the change.
        - |
          188 versus 132 is the marginal distribution of one variable; it cannot show a relationship between the two variables.
        - |
          Correct. The conditional proportions eating lunch are 62/80 = 0.775, 55/80 ≈ 0.688, 40/80 = 0.500 and 31/80 ≈ 0.388; they differ by grade, so the variables are associated.
      answer: 3
    - slug: apstats-u02-w08-q04
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Statistics CED, Topic 2.2"
      points: 1
      stimulus: |
        A hypothetical high school surveyed a random sample of 80 students from each grade and asked whether they usually eat the school lunch.

        | Grade | Eats school lunch | Does not | Total |
        |---|---|---|---|
        | 9 | 62 | 18 | 80 |
        | 10 | 55 | 25 | 80 |
        | 11 | 40 | 40 | 80 |
        | 12 | 31 | 49 | 80 |
        | Total | 188 | 132 | 320 |
      prompt: |
        What is the difference between the proportion of ninth graders and the proportion of twelfth graders who eat the school lunch (grade 9 minus grade 12)?
      options:
        - "31"
        - "0.388"
        - "0.097"
        - "0.165"
      option_explanations:
        - |
          62 − 31 = 31 is a difference in counts, not in proportions; a summary statistic for association compares conditional proportions.
        - |
          Correct. 62/80 − 31/80 = 0.775 − 0.3875 = 0.3875 ≈ 0.388: the proportion eating school lunch is about 39 percentage points higher in grade 9.
        - |
          62/320 − 31/320 ≈ 0.097 subtracts joint relative frequencies, dividing by the grand total instead of each grade's total.
        - |
          62/188 − 31/188 ≈ 0.165 conditions on lunch eaters (column proportions), which compares grade shares, not lunch rates.
      answer: 1
    # ---- Independent items
    - slug: apstats-u02-w08-q05
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Statistics CED, Topic 2.1"
      points: 1
      prompt: |
        A hypothetical district surveyed 600 ninth graders and 150 twelfth graders about where they usually study (home, library or café). Which display is best for comparing the two grades' study locations?
      options:
        - "A side-by-side bar chart of the counts for each location"
        - "A segmented bar chart with one 100% bar per grade, divided by study location"
        - "One pie chart of study location for all 750 students combined"
        - "A histogram of study location for each grade"
      option_explanations:
        - |
          With 600 versus 150 students, the ninth-grade bars would be taller almost everywhere just because the group is bigger; counts hide the comparison.
        - |
          Correct. Scaling each bar to 100% shows each grade's conditional distribution of study location, so groups of different sizes compare fairly.
        - |
          A single pie chart shows only the marginal distribution of study location and cannot show any difference between the grades.
        - |
          A histogram is for a quantitative variable; study location is categorical, so it needs a bar-type display.
      answer: 1
    - slug: apstats-u02-w08-q06
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Statistics CED, Topic 2.2"
      points: 1
      prompt: |
        In a hypothetical random sample of 500 students from grades 9 to 12, 30% own a pet. If pet ownership and grade level are not associated, what percent of the ninth graders in the sample own a pet?
      options:
        - "It cannot be determined without the number of ninth graders."
        - "25%, because there are four grade levels"
        - "The same number of pet owners as in every other grade"
        - "30%"
      option_explanations:
        - |
          The number of ninth graders would be needed for a count, but the question asks for a percent, and no association fixes that percent.
        - |
          25% is one grade's share if the grades were equal in size; it confuses the grade distribution with the pet-owning rate.
        - |
          No association means equal proportions, not equal counts; a larger grade would have more pet owners at the same rate.
        - |
          Correct. With no association, every conditional distribution equals the marginal distribution, so 30% of each grade own a pet.
      answer: 3
    - slug: apstats-u02-w08-q07
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Statistics CED, Topic 2.1"
      points: 1
      prompt: |
        A mosaic plot shows class year (four columns) and whether each student in a hypothetical sample has a part-time job (two segments per column). The senior column is much wider than the freshman column. What does the extra width show?
      options:
        - "Seniors make up a larger share of the sample than freshmen do."
        - "A larger proportion of seniors than freshmen have a part-time job."
        - "Class year and having a part-time job are associated."
        - "Most students with part-time jobs are seniors."
      option_explanations:
        - |
          Correct. In a mosaic plot, column width is proportional to the marginal distribution of the column variable, so a wider column means more seniors in the sample.
        - |
          The proportion with a job is read from the segment heights within each column, not from the column width.
        - |
          Association shows up as segments at different heights across columns; widths alone say nothing about it.
        - |
          That is a conditional proportion among job holders, which needs the tile areas, not just the column width.
      answer: 0
    - slug: apstats-u02-w08-q08
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Statistics CED, Topic 2.2"
      points: 1
      prompt: |
        In a hypothetical town, 180 of the 900 students at North High walk to school and 90 of the 300 students at South High walk. A parent says walking is more common at North High. Which response is correct?
      options:
        - "The parent is right, because 180 is twice 90."
        - "The schools cannot be compared because they have different numbers of students."
        - "Walking is more common at South High: 0.30 of its students walk, compared with 0.20 at North High."
        - "Walking is equally common, because the difference in walkers (90) is small compared with 1,200."
      option_explanations:
        - |
          Counts from groups of different sizes are not comparable; North High has three times as many students, so more walkers is expected.
        - |
          Different group sizes are exactly why we convert to conditional proportions, which can then be compared.
        - |
          Correct. 180/900 = 0.20 and 90/300 = 0.30, so the proportion who walk is 10 percentage points higher at South High.
        - |
          90/1,200 mixes a difference in counts with the grand total; the conditional proportions 0.20 and 0.30 are clearly different.
      answer: 2
    - slug: apstats-u02-w08-q09
      type: multiple_choice
      topic_code: "1.7"
      source: "AP Statistics CED, Topic 1.7"
      points: 1
      prompt: |
        In a hypothetical survey, the number of text messages students sent in one day has a strongly right-skewed distribution with several very large values. Which pair of statistics best summarises the center and variability?
      options:
        - "Mean and standard deviation"
        - "Mean and interquartile range"
        - "Median and standard deviation"
        - "Median and interquartile range"
      option_explanations:
        - |
          The mean and standard deviation are pulled toward the long right tail and the large values, so they overstate the typical value and spread.
        - |
          The IQR is resistant, but the mean is not; it would still be dragged upward by the very large values.
        - |
          The median is resistant, but the standard deviation is inflated by the large values, so this pair mixes resistant and non-resistant measures.
        - |
          Correct. For a strongly skewed distribution with outliers, the median and IQR are resistant measures of center and variability.
      answer: 3
    - slug: apstats-u02-w08-q10
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Statistics CED, Topic 1.12"
      points: 1
      prompt: |
        A school newspaper posts an online poll asking whether the school day should start later; 85% of the 212 students who respond say yes. Which statement about this result is most accurate?
      options:
        - "It is unbiased because 212 is a large sample."
        - "It probably overestimates support, because students who feel strongly about a later start are the most likely to respond."
        - "It suffers from undercoverage, because the poll was online."
        - "It shows that 85% of all students at the school want a later start."
      option_explanations:
        - |
          A large sample does not fix bias; a voluntary response sample of any size can be systematically off.
        - |
          Correct. This is a voluntary response sample: people with strong opinions (here, those who want a later start) choose to respond, so it likely overstates support.
        - |
          Undercoverage could matter if some students cannot reach the poll, but the main problem is that respondents chose themselves.
        - |
          The respondents were not randomly selected, so the 85% cannot be generalised to all students at the school.
      answer: 1
    - slug: apstats-u02-w08-q11
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        A hypothetical survey of a random sample of 300 students at one high school found that students who play a team sport were more likely than other students to report earning mostly A's and B's. Which conclusion is appropriate?
      options:
        - "At this school, playing a team sport is associated with higher reported grades, but the survey cannot show that sports cause better grades."
        - "Playing a team sport causes students at this school to earn better grades."
        - "The result applies to all high school students in the country."
        - "There is no relationship, because the students were not randomly assigned to play sports."
      option_explanations:
        - |
          Correct. Random sampling lets us generalise the association to this school, but with no random assignment, confounders (such as time management or family support) could explain it.
        - |
          Causation needs random assignment of the treatment; students chose whether to play, so this is an observational study.
        - |
          The sample was drawn from one school, so the population for generalising is that school, not every high school.
        - |
          Lack of random assignment limits causal claims; it does not erase the association seen in the data.
      answer: 0
    - slug: apstats-u02-w08-q12
      type: multiple_choice
      topic_code: "1.8"
      source: "AP Statistics CED, Topic 1.8"
      points: 1
      prompt: |
        For a hypothetical sample of commute times, Q1 = 18 minutes and Q3 = 30 minutes. Which commute time would be identified as a high outlier by the 1.5 × IQR rule?
      options:
        - "44 minutes"
        - "47 minutes"
        - "49 minutes"
        - "37 minutes"
      option_explanations:
        - |
          44 exceeds Q3 + IQR = 42, but the rule uses 1.5 × IQR: the upper fence is 30 + 18 = 48, and 44 is below it.
        - |
          47 exceeds 1.5 × Q3 = 45, but the fence adds 1.5 × IQR to Q3, giving 48; 47 is not an outlier.
        - |
          Correct. IQR = 30 − 18 = 12, so the upper fence is Q3 + 1.5 × 12 = 30 + 18 = 48 minutes, and 49 is above it.
        - |
          37 is above Q1 + 1.5 × IQR = 36, but the upper fence is measured from Q3, not Q1.
      answer: 2
    - slug: apstats-u02-w08-q13
      type: multi_select
      topic_code: "2.1"
      source: "AP Statistics CED, Topic 2.1"
      points: 2
      partial_credit: true
      prompt: |
        A hypothetical smoothie shop recorded the size of 200 orders and whether a protein add-in was chosen.

        | Size | Protein | No protein | Total |
        |---|---|---|---|
        | Small | 30 | 50 | 80 |
        | Medium | 36 | 44 | 80 |
        | Large | 24 | 16 | 40 |
        | Total | 90 | 110 | 200 |

        Which statements are true? Select all that apply.
      options:
        - "The joint relative frequency of large orders with protein is 0.12."
        - "Among orders with protein, 40% were medium."
        - "Among small orders, 30% had protein."
        - "The marginal distribution of size is 40% small, 40% medium and 20% large."
        - "Size and protein are not associated, because the protein counts for the three sizes are similar."
      option_explanations:
        - |
          Correct. 24/200 = 0.12: the cell count over the grand total.
        - |
          Correct. Condition on protein orders: 36/90 = 0.40.
        - |
          30 is the count, not the percent. Among small orders, 30/80 = 0.375, or 37.5%, had protein.
        - |
          Correct. Row totals over 200: 80/200 = 0.40, 80/200 = 0.40, 40/200 = 0.20.
        - |
          Similar counts are not the test; the conditional proportions with protein are 0.375, 0.45 and 0.60, which rise with size, so the variables are associated.
      answer: [0, 1, 3]
    - slug: apstats-u02-w08-q14
      type: multi_select
      topic_code: "1.11"
      source: "AP Statistics CED, Topic 1.11"
      points: 2
      partial_credit: true
      prompt: |
        A principal wants to survey 100 of the school's 1,200 students about the new schedule. Which of these plans produce a random sample? Select all that apply.
      options:
        - "Number the students 1 to 1,200 and use a random number generator to choose 100 different numbers."
        - "Randomly choose 25 students from each of the four grades."
        - "Survey the first 100 students who arrive at school on Monday."
        - "Randomly select 4 of the school's 48 homerooms and survey every student in them."
        - "Ask teachers to choose students they think will give thoughtful answers."
      option_explanations:
        - |
          Correct. This is a simple random sample: every set of 100 students is equally likely to be chosen.
        - |
          Correct. This is a stratified random sample with grades as strata; chance chooses the students within each grade.
        - |
          This is a convenience sample: early arrivals (bus riders, students with early activities) may differ systematically from others.
        - |
          Correct. This is a cluster sample: chance chooses the homerooms, and every student in a chosen homeroom is surveyed (4 rooms of about 25 is about 100).
        - |
          Teachers' judgement replaces chance, so this sample can be biased toward students teachers prefer.
      answer: [0, 1, 3]
    - slug: apstats-u02-w08-q15
      type: true_false
      topic_code: "2.2"
      source: "AP Statistics CED, Topic 2.2"
      points: 1
      prompt: |
        True or false: If the conditional distribution of favourite school subject is exactly the same for students who play an instrument and students who do not, then playing an instrument and favourite subject are not associated in that data.
      answer: true
      explanation: |
        True. No association means every conditional distribution of one variable is the same across the categories of the other. Identical conditional distributions are exactly that situation, and each then equals the marginal distribution.
    - slug: apstats-u02-w08-q16
      type: true_false
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      prompt: |
        True or false: When two boxplots of sleep hours are compared, the group whose boxplot has the larger range must also have the larger interquartile range.
      answer: false
      explanation: |
        False. The range depends only on the minimum and maximum, so one extreme value can make it large, while the IQR measures the spread of the middle 50%. A group can have a larger range and a smaller IQR.
    - slug: apstats-u02-w08-q17
      type: fill_blank
      topic_code: "2.1"
      source: "AP Statistics CED, Topic 2.1"
      points: 1
      prompt: |
        In a hypothetical survey of 250 students, 45 are both in the band and on a sports team. The joint relative frequency of being in the band and on a sports team, as a decimal, is ____.
      answer: ["0.18", ".18", "18%", "9/50", "0.180"]
      explanation: |
        A joint relative frequency divides the count in both categories by the grand total: 45/250 = 0.18.
