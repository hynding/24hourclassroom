    - slug: apstats-u02-w08-q19
      type: numeric
      topic_code: "1.7"
      source: "AP Statistics CED, Topic 1.7"
      points: 1
      prompt: |
        Five students recorded how long their walk to school took, in minutes: 12, 15, 9, 20, 14. Find the sample standard deviation, rounded to two decimal places.
      answer: { value: 4.06, tolerance: 0.006 }
      explanation: |
        The mean is 70/5 = 14. Deviations: −2, 1, −5, 6, 0; squared: 4, 1, 25, 36, 0, summing to 66. Divide by n − 1 = 4: 16.5. s = √16.5 ≈ 4.06 minutes.
    - slug: apstats-u02-w08-q20
      type: short_answer
      topic_code: "2.2"
      source: "AP Statistics CED, Topic 2.2"
      points: 3
      prompt: |
        A hypothetical high school athletic department recorded, for 240 athletes, whether each athlete chose to do a dynamic warm-up routine before practice and whether the athlete was injured during the season.

        | | Injured | Not injured | Total |
        |---|---|---|---|
        | Warm-up | 18 | 132 | 150 |
        | No warm-up | 21 | 69 | 90 |
        | Total | 39 | 201 | 240 |

        (a) Compute the proportion injured for each group.
        (b) Do these data show an association between the warm-up routine and injury? Explain using your answer to (a).
        (c) The coach concludes that the warm-up prevents injuries. Is this conclusion justified? Explain.
      answer: |
        (a) Warm-up: 18/150 = 0.12. No warm-up: 21/90 ≈ 0.233.
        (b) Yes. The proportion injured is about 11 percentage points lower for athletes who did the warm-up (0.12 versus 0.233), so the conditional distributions of injury differ and the variables are associated in these data.
        (c) No. Athletes chose whether to warm up, so this is an observational study. A confounding variable, such as experience or overall conditioning, could make athletes both more likely to warm up and less likely to be injured. Only an experiment that randomly assigns the warm-up could show it prevents injuries.
      explanation: |
        Three points. (a) 1 point: both conditional proportions, 0.12 and about 0.233 (fractions acceptable). (b) 1 point: says there is an association and supports it by comparing the two conditional proportions (not counts). (c) 1 point: not justified because the study is observational (no random assignment), with a plausible confounder or a statement that random assignment is needed.
    - slug: apstats-u02-w08-q21
      type: short_answer
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 2
      prompt: |
        A student council member wants to ask students "Do you eat breakfast?" to learn whether breakfast habits differ between students who ride the bus and students who do not.

        (a) Rewrite this as a statistical investigative question that names the population and the comparison.
        (b) Identify the two variables the investigation would record, and classify each as categorical or quantitative.
      answer: |
        (a) For example: "At our high school this year, do students who ride the bus differ from students who do not in the proportion who usually eat breakfast on school days?"
        (b) Whether the student rides the bus (categorical) and whether the student usually eats breakfast on school days (categorical).
      explanation: |
        Two points. (a) 1 point: an investigative question (asked of the data, not of one student) that names a population (for example, students at this school) and the comparison between bus riders and non-riders. A survey question asked of an individual does not earn the point. (b) 1 point: both variables named and both correctly classified as categorical.
    - slug: apstats-u02-w08-q22
      type: long_answer
      topic_code: "2.2"
      source: "AP Statistics CED, Topics 2.1–2.2"
      points: 6
      prompt: |
        A hypothetical city library surveyed a random sample of 500 of its patrons about their age group and the book format they prefer.

        | Age group | Print | E-book | Audiobook | Total |
        |---|---|---|---|---|
        | Teen | 40 | 50 | 30 | 120 |
        | Adult | 110 | 90 | 50 | 250 |
        | Senior | 95 | 15 | 20 | 130 |
        | Total | 245 | 155 | 100 | 500 |

        (A) Give the marginal distribution of preferred format as proportions.

        (B) Compute the conditional distribution of preferred format for teens and for seniors.

        (C) Describe how a segmented bar chart of preferred format by age group would show your answer to (B).

        (D) Is there an association between age group and preferred format among these patrons? Justify your answer, and state to whom the conclusion applies.
      answer: |
        (A) Print 245/500 = 0.49, e-book 155/500 = 0.31, audiobook 100/500 = 0.20.
        (B) Teens: print 40/120 ≈ 0.333, e-book 50/120 ≈ 0.417, audiobook 30/120 = 0.250. Seniors: print 95/130 ≈ 0.731, e-book 15/130 ≈ 0.115, audiobook 20/130 ≈ 0.154.
        (C) There would be one 100% bar per age group. The teen bar would be split about 33% / 42% / 25%, and the senior bar about 73% / 12% / 15%, so the print segment would be far taller in the senior bar and the e-book segment far taller in the teen bar.
        (D) Yes. The conditional distributions differ greatly: about 73% of seniors prefer print compared with about 33% of teens, and about 42% of teens prefer e-books compared with about 12% of seniors. Because the patrons were a random sample of the library's patrons, the association can be generalised to all patrons of this library (but it is an association, not a cause-and-effect claim).
      explanation: |
        Six points. (A) 1 point: all three marginal proportions (0.49, 0.31, 0.20), with the grand total as denominator. (B) 2 points: 1 for the teen conditional distribution and 1 for the senior conditional distribution, each divided by the correct row total (fractions or percents acceptable). (C) 1 point: bars each scaled to 100% with segments matching the conditional distributions, and a description of how the segments differ. (D) 2 points: 1 for "associated" justified by comparing specific conditional proportions across age groups (not counts); 1 for generalising to all patrons of this library because of the random sample, without a causal claim.
