      points: 3
      prompt: |
        A hypothetical school club sells 300 raffle tickets for $2 each. One ticket wins $100 and two tickets win $25 each. Let X = the net gain for a person who buys one ticket.

        (a) Give the probability distribution of X.
        (b) Find the expected value of X.
        (c) Interpret the expected value in context.
      answer: |
        (a) X = 98 with probability 1/300; X = 23 with probability 2/300; X = −2 with probability 297/300.
        (b) E(X) = 98(1/300) + 23(2/300) + (−2)(297/300) = (98 + 46 − 594)/300 = −450/300 = −$1.50.
        (c) If a person bought many, many tickets in raffles like this one, the average net gain would be about −$1.50 per ticket: buyers lose about $1.50 per ticket in the long run.
      explanation: |
        Three points, one per part. (a) all three net values (prize minus the $2 cost) with correct probabilities that add to 1. (b) −$1.50 with work shown (using gross payouts of 100, 25 and 0 and subtracting 2 at the end is also acceptable). (c) a long-run average interpretation in context; "you will lose $1.50 on your ticket" does not earn the point.
    - slug: apstats-u02-w11-q21
      type: short_answer
      topic_code: "2.7"
      source: "AP Statistics CED, Topic 2.7"
      points: 2
      prompt: |
        For a randomly chosen student at a hypothetical school, P(takes Spanish) = 0.45, P(plays in the orchestra) = 0.30, and P(takes Spanish or plays in the orchestra) = 0.60.

        (a) Find P(takes Spanish and plays in the orchestra).
        (b) Are the two events independent? Justify.
      answer: |
        (a) By the general addition rule, 0.60 = 0.45 + 0.30 − P(both), so P(both) = 0.15.
        (b) No. If they were independent, P(both) would be 0.45 × 0.30 = 0.135, but it is 0.15. (Equivalently, P(orchestra | Spanish) = 0.15/0.45 ≈ 0.333 ≠ 0.30.)
      explanation: |
        Two points. (a) 1 point: 0.15 from the general addition rule. (b) 1 point: "not independent" with a correct numerical justification (the product check or a conditional-probability comparison).
    - slug: apstats-u02-w11-q22
      type: long_answer
      topic_code: "2.9"
      source: "AP Statistics CED, Topics 2.8–2.9"
      points: 6
      prompt: |
        A hypothetical school fair runs a dice game. It costs $2 to play. The player rolls two fair six-sided dice. If the dice show doubles (the same number), the player receives $8. If the sum is 7, the player receives $3. Otherwise the player receives nothing. Let X = the player's net gain for one play.

        (A) Give the probability distribution of X.

        (B) Find the mean of X and interpret it in context.

        (C) Find the standard deviation of X.

        (D) The organisers want the game to be fair. If the $3 prize for a sum of 7 stays the same, what amount should the doubles prize be? Show your work.
      answer: |
        (A) Doubles: 6 of 36 outcomes; sum 7: 6 of 36 (no overlap, since doubles have even sums); other: 24 of 36.
        X = 6 (8 − 2) with probability 6/36 = 1/6; X = 1 (3 − 2) with probability 1/6; X = −2 with probability 24/36 = 2/3.
        (B) μ_X = 6(1/6) + 1(1/6) + (−2)(2/3) = 1 + 0.1667 − 1.3333 ≈ −$0.17. If many, many games were played, players would lose about 17 cents per play on average.
        (C) σ²_X = (6 + 0.1667)²(1/6) + (1 + 0.1667)²(1/6) + (−2 + 0.1667)²(2/3) ≈ 6.338 + 0.227 + 2.241 = 8.806, so σ_X ≈ $2.97.
        (D) Let the doubles prize be w. Fair means μ_X = 0: (w − 2)(1/6) + 1(1/6) + (−2)(2/3) = 0. Multiply by 6: w − 2 + 1 − 8 = 0, so w = $9.
      explanation: |
        Six points. (A) 2 points: 1 for correct probabilities 1/6, 1/6, 2/3 (adding to 1); 1 for net-gain values 6, 1 and −2 (gross payouts lose this point). (B) 2 points: 1 for μ_X ≈ −0.17; 1 for a long-run average interpretation in context (players lose about 17 cents per play over many plays). (C) 1 point: σ_X ≈ 2.97 (accept 2.96 to 2.98). (D) 1 point: setting the expected net gain to 0 and solving to get a $9 doubles prize.
