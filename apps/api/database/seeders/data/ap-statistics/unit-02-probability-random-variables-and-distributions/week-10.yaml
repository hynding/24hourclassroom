        A hypothetical school building has three smoke detectors in one hallway. Each detects a fire with probability 0.8, independently of the others. Find the probability that at least one detector detects a fire, to three decimal places.
      answer: { value: 0.992, tolerance: 0.0006 }
      explanation: |
        P(none detects) = 0.2 × 0.2 × 0.2 = 0.008 because the detectors are independent. By the complement rule, P(at least one) = 1 − 0.008 = 0.992.
