        Two fair six-sided dice are rolled. The probability that the sum is 7, written as a fraction in lowest terms, is ____.
      answer: ["1/6", "6/36", "0.167", ".167", "0.1667", "16.7%"]
      explanation: |
        Six of the 36 equally likely ordered pairs give a sum of 7: (1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1). So the probability is 6/36 = 1/6.
