      prompt: |
        On a hypothetical streaming service, 35% of accounts are family plans and the rest are individual plans. 60% of family-plan accounts and 20% of individual-plan accounts watch mostly on a TV. An account is chosen at random.

        (a) Find the probability that the account watches mostly on a TV.
        (b) Given that the account watches mostly on a TV, find the probability that it is a family plan.
        (c) Are the events "family plan" and "watches mostly on a TV" independent? Justify.
      answer: |
        (a) P(TV) = 0.35 × 0.60 + 0.65 × 0.20 = 0.21 + 0.13 = 0.34.
        (b) P(family | TV) = 0.21/0.34 ≈ 0.618.
        (c) No. P(TV | family) = 0.60 but P(TV) = 0.34; knowing the plan type changes the probability (equivalently P(family | TV) ≈ 0.618 ≠ P(family) = 0.35).
      explanation: |
        Three points, one per part. (a) 0.34 with the work shown (a tree or the two products added). (b) 0.618 (accept 0.62) from P(family and TV)/P(TV). (c) "not independent" justified by comparing a conditional probability with the matching unconditional probability; a bare "no" earns nothing.
