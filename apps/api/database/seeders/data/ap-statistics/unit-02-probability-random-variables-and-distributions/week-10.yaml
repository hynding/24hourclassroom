      prompt: |
        A game uses a coin that is supposed to be fair. In 50 tosses it landed heads 32 times. A student simulated 200 sets of 50 tosses of a fair coin and found 32 or more heads in 6 of the 200 sets.

        (a) Estimate the probability of getting 32 or more heads in 50 tosses of a fair coin.
        (b) Does the result give convincing evidence that the coin is biased toward heads? Explain.
      answer: |
        (a) 6/200 = 0.03.
        (b) Yes. If the coin were fair, 32 or more heads in 50 tosses would happen only about 3% of the time. That is unusual enough that chance alone is not a plausible explanation, so the result is convincing evidence that the coin lands heads more than half the time.
      explanation: |
        Two points. (a) 1 point: 0.03. (b) 1 point: a conclusion in context based on the estimate being small (assuming the coin is fair, the result is unusual), stated as evidence rather than proof.
    - slug: apstats-u02-w10-q22
      type: long_answer
      topic_code: "2.6"
      source: "AP Statistics CED, Topics 2.5–2.7"
      points: 6
      prompt: |
        A hypothetical media company surveyed a random sample of 800 adults about their age group and their main source of news.

        | Age group | Online | TV | Print | Total |
        |---|---|---|---|---|
        | Under 40 | 252 | 84 | 24 | 360 |
        | 40 and over | 154 | 198 | 88 | 440 |
        | Total | 406 | 282 | 112 | 800 |

        One adult is chosen at random from the 800.

        (A) Find P(online) and P(online | under 40).

        (B) Find P(under 40 or online).

        (C) Are "under 40" and "online" independent? Justify your answer.

        (D) Two different adults are chosen at random from the 800, without replacement. Find the probability that both name print as their main source.
      answer: |
        (A) P(online) = 406/800 ≈ 0.508. P(online | under 40) = 252/360 = 0.70.
        (B) P(under 40 or online) = 360/800 + 406/800 − 252/800 = 514/800 ≈ 0.643.
        (C) No. P(online | under 40) = 0.70, but P(online) ≈ 0.508. Knowing the adult is under 40 changes the probability of online news, so the events are not independent. (Equivalently, P(under 40) · P(online) = 0.45 × 0.5075 ≈ 0.228 ≠ P(under 40 and online) = 0.315.)
        (D) P(both print) = (112/800)(111/799) ≈ 0.0194.
      explanation: |
        Six points. (A) 2 points: 1 for P(online) ≈ 0.508 and 1 for P(online | under 40) = 0.70, each with the correct denominator. (B) 1 point: 0.643 by the general addition rule (or by adding the cells 252 + 84 + 24 + 154 = 514). (C) 2 points: 1 for comparing P(online | under 40) with P(online) (or the product check), 1 for the correct conclusion "not independent" in context. (D) 1 point: (112/800)(111/799) ≈ 0.0194, with the second factor conditional on the first draw. (112/800)² ≈ 0.0196 treats the draws as independent (with replacement) and does not earn the point.
