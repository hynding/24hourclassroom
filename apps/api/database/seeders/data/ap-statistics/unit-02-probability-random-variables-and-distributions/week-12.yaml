    - slug: apstats-u02-w12-q23
      type: short_answer
      topic_code: "2.10"
      source: "AP Statistics CED, Topic 2.10"
      points: 3
      prompt: |
        About 10% of people are left-handed. For each situation, state whether X is binomial (or approximately binomial) and justify your answer by naming the condition that holds or fails.

        (a) A teacher chooses 10 students at random, without replacement, from her class of 32, and X = the number who are left-handed.
        (b) A researcher chooses 10 students at random, without replacement, from a school of 1,200, and X = the number who are left-handed.
        (c) A researcher asks randomly chosen students one at a time until she finds a left-handed student, and X = the number of students asked.
      answer: |
        (a) Not binomial. Sampling is without replacement and 10 is more than 10% of 32 (3.2), so the trials are not close to independent: each pick noticeably changes the chance for the next.
        (b) Approximately binomial with n = 10 and p ≈ 0.10: each student is left-handed or not, n = 10 is fixed, the chance is the same for each random pick, and 10 ≤ 10% of 1,200 = 120, so the trials are approximately independent.
        (c) Not binomial. The number of trials is not fixed in advance; X counts the trials themselves.
      explanation: |
        Three points, one per part. Each needs the correct decision with the specific reason: (a) the 10% condition fails (10 > 3.2), so independence fails; (b) all conditions met, with the 10% check 10 ≤ 120 stated; (c) no fixed number of trials. A decision without a reason earns no point.
    - slug: apstats-u02-w12-q24
      type: short_answer
      topic_code: "2.6"
      source: "AP Statistics CED, Topic 2.6"
      points: 3
      prompt: |
        At a hypothetical high school, 20% of students ride the late bus. Of late-bus riders, 30% arrive late to first period; of students who do not ride the late bus, 5% arrive late. A student is chosen at random.

        (a) Find the probability that the student arrives late to first period.
        (b) Given that the student arrived late, find the probability that the student rides the late bus.
        (c) Are the events "rides the late bus" and "arrives late" independent? Justify with probabilities.
      answer: |
        (a) P(late) = 0.20(0.30) + 0.80(0.05) = 0.06 + 0.04 = 0.10.
        (b) P(late bus | late) = P(late bus and late)/P(late) = 0.06/0.10 = 0.60.
        (c) Not independent: P(late | late bus) = 0.30 is not equal to P(late) = 0.10 (equivalently, 0.60 ≠ 0.20).
      explanation: |
        Three points, one per part. (a) 0.10 with both branches shown. (b) 0.60 with the conditional probability formula or tree. (c) "not independent" with a correct comparison of a conditional and an unconditional probability; the decision alone earns no point.
    - slug: apstats-u02-w12-q25
      type: long_answer
      topic_code: "2.10"
      source: "AP Statistics CED, Topic 2.10"
      points: 6
      prompt: |
        A hypothetical school bus company claims that 90% of its morning runs arrive on time. A student records her bus for 15 school days and finds it was on time on only 10 of them. Assume that the claim is true and that days are independent, and let X = the number of the 15 days the bus is on time.

        (A) Explain why X can be modelled as a binomial random variable, and state n and p.

        (B) Find the mean and standard deviation of X, and interpret the mean in context.

        (C) Find P(X ≤ 10).

        (D) Does the student's record give convincing evidence that the true on-time rate for her bus is less than 90%? Explain using your answer to (C).
      answer: |
        (A) Each day the bus is on time (success) or not (failure); the 15 days are a fixed number of trials; days are assumed independent; and the probability of being on time is the same, 0.90, each day. So X is binomial with n = 15 and p = 0.90.
        (B) μ = np = 15(0.90) = 13.5 days; σ = √(15 · 0.90 · 0.10) = √1.35 ≈ 1.16 days. If the claim is true and the student recorded many 15-day stretches, the bus would be on time on about 13.5 of the 15 days per stretch, on average, in the long run.
        (C) P(X ≤ 10) = binomcdf(15, 0.90, 10) ≈ 0.0127.
        (D) Yes. If the bus really arrived on time 90% of the time, a record of 10 or fewer on-time days out of 15 would happen only about 1.3% of the time by chance. Because that is so unlikely, the record gives convincing evidence that the true on-time rate for her bus is less than 90%. (It does not prove the claim false.)
      explanation: |
        Six points.
        (A) 2 points: 1 for naming all four conditions in context (two outcomes, fixed 15 days, independence, same p = 0.90); 1 for n = 15 and p = 0.90. Listing "BINS" without context earns at most 1 point.
        (B) 2 points: 1 for μ = 13.5 and σ ≈ 1.16 (σ = 1.35 is the variance and earns no credit for the SD); 1 for interpreting the mean as a long-run average over many 15-day stretches. "She will be on time 13.5 days" earns no interpretation point.
        (C) 1 point: 0.0127 (accept 0.013), with the binomial setup shown (binomcdf(15, 0.9, 10) or a sum of binomial probabilities).
        (D) 1 point: a "yes" conclusion that compares the result with what is expected by chance, cites the small probability from (C) conditionally ("if the claim were true"), and states the conclusion about the true on-time rate in context. A response that says the probability that the claim is true is 0.013 earns no point.
