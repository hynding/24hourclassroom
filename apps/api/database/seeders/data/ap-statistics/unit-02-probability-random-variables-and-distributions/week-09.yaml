    - slug: apstats-u02-w09-q20
      type: short_answer
      topic_code: "2.3"
      source: "AP Statistics CED, Topic 2.3"
      points: 3
      prompt: |
        A hypothetical regional airline says 85% of its flights arrive on time. Describe how to use a table of random digits to estimate the probability that at least 9 of the airline's next 10 flights arrive on time. State any assumption you make.
      answer: |
        Assume the flights are independent and each arrives on time with probability 0.85.
        Model: read pairs of digits; 00–84 = on time, 85–99 = late (85 of 100 pairs).
        Trial: read 10 pairs (one per flight) and count how many are on time; record whether the count is 9 or 10.
        Repeat this many times (for example, 1,000 trials). The estimated probability is the number of trials with at least 9 on-time flights divided by the number of trials.
      explanation: |
        Three points. 1 point: a correct digit assignment giving probability 0.85 (pairs, such as 00–84) with independence stated or implied. 1 point: one trial clearly described (10 pairs, count on-time flights, record whether the count is at least 9). 1 point: repeat many times and estimate the probability as the proportion of trials with at least 9 on time.
    - slug: apstats-u02-w09-q21
      type: short_answer
      topic_code: "2.2"
      source: "AP Statistics CED, Topics 2.1–2.2"
      points: 2
      prompt: |
        In a hypothetical survey of 160 students, 48 of the 64 students with a public library card and 36 of the 96 students without one said they read for pleasure every week.

        (a) Compute the proportion who read for pleasure weekly in each group.
        (b) Is having a library card associated with reading for pleasure in this sample? Justify.
      answer: |
        (a) Card: 48/64 = 0.75. No card: 36/96 = 0.375.
        (b) Yes. Students with a library card are twice as likely to read for pleasure weekly (0.75 versus 0.375); because the conditional proportions differ, the variables are associated in this sample.
      explanation: |
        Two points. (a) 1 point: both conditional proportions (0.75 and 0.375). (b) 1 point: "associated" justified by comparing the conditional proportions (not counts). A causal claim does not earn the point.
    - slug: apstats-u02-w09-q22
      type: long_answer
      topic_code: "2.3"
      source: "AP Statistics CED, Topics 2.3–2.4"
      points: 6
      prompt: |
        A hypothetical coffee shop says that 1 in 5 of its scratch cards wins a free drink. Jordan gets one card on each of 10 visits and wins nothing. He wonders whether the shop's claim is true.

        (A) Describe how to use random digits to simulate Jordan's 10 cards, assuming the shop's claim is true.

        (B) A computer ran 100 trials of your simulation and recorded the number of winning cards in each trial:

        | Wins | 0 | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|---|
        | Trials | 9 | 27 | 30 | 26 | 6 | 2 |

        Use the results to estimate the probability of no wins in 10 cards if the claim is true.

        (C) Does Jordan's result give convincing evidence that fewer than 1 in 5 cards win? Explain.

        (D) Jordan's friend says, "Run 1,000 trials instead and the estimate will be exactly right." Is the friend correct? Explain.
      answer: |
        (A) Assume the cards are independent, each winning with probability 0.2. Use one digit per card: 0–1 = win, 2–9 = no win. One trial: read 10 digits and count the wins; record the number of wins (or whether there were 0).
        (B) 9 of the 100 trials had 0 wins, so the estimate is 9/100 = 0.09.
        (C) No. If the shop's claim is true, getting no wins in 10 cards happens about 9% of the time, which is not unusual. Chance alone is a plausible explanation, so Jordan's result is not convincing evidence that fewer than 1 in 5 cards win (though it does not prove the claim is true either).
        (D) No. By the law of large numbers, more trials make the estimate tend to be closer to the true probability, but a simulation still has random variation, so 1,000 trials will give a better estimate, not an exact one.
      explanation: |
        Six points. (A) 2 points: 1 for a digit assignment giving probability 0.2 (such as 0–1 = win) with independence stated or implied; 1 for one trial (10 digits, count wins) and what is recorded. (B) 1 point: 9/100 = 0.09. (C) 2 points: 1 for interpreting 0.09 as the chance of this result when the claim is true (not unusual); 1 for the conclusion in context, "not convincing evidence", without claiming the claim is proven. (D) 1 point: not exact; more trials make the estimate closer on average (law of large numbers) but random variation remains.
