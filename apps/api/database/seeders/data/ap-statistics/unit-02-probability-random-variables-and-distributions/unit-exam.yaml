    prompt: |
      True or false: Because the probability of rolling a six with a fair die is 1/6, rolling a fair die 600 times will produce exactly 100 sixes.
    answer: false
    explanation: |
      False. A probability describes the long-run relative frequency. In 600 rolls the number of sixes varies by chance (it is binomial with mean 100 and SD about 9.1), so exactly 100 is just one of many possible results.
  - slug: apstats-u02-exam-q31
    type: true_false
    topic_code: "2.11"
    source: "AP Statistics CED, Topic 2.11"
    points: 1
    prompt: |
      True or false: A z-score of −2.5 means that the value is 2.5 units below the mean.
    answer: false
    explanation: |
      False. A z-score counts standard deviations, not units: z = −2.5 means the value is 2.5 standard deviations below the mean. With SD 4, for example, that is 10 units below.
  - slug: apstats-u02-exam-q32
    type: true_false
