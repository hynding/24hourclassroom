  - slug: apstats-u02-exam-q27
    type: multiple_choice
    topic_code: "2.10"
    source: "AP Statistics CED, Topic 2.10"
    points: 1
    prompt: |
      A hypothetical school vending machine fails to deliver a snack on 3% of purchases, independently. Over 20 purchases, what is the probability of at least one failure?
    options:
      - "0.600"
      - "0.456"
      - "0.544"
      - "0.336"
    option_explanations:
      - |
        0.600 = 20 × 0.03 adds the probabilities, which double-counts purchases with more than one failure; it is the expected number of failures, not a probability.
      - |
        Correct. X is binomial with n = 20, p = 0.03. P(X ≥ 1) = 1 − P(X = 0) = 1 − 0.97²⁰ ≈ 1 − 0.544 = 0.456.
      - |
        0.544 = 0.97²⁰ is the probability of no failures, the complement of the event asked about.
      - |
        0.336 is P(X = 1), exactly one failure; "at least one" also includes two or more.
    answer: 1
  - slug: apstats-u02-exam-q28
    type: multi_select
    topic_code: "2.7"
    source: "AP Statistics CED, Topic 2.7"
    points: 2
    partial_credit: true
    prompt: |
      For two events, P(A) = 0.5, P(B) = 0.3 and P(A and B) = 0.15. Which statements are true? Select all that apply.
    options:
      - "A and B are mutually exclusive."
      - "A and B are independent."
      - "P(A or B) = 0.65"
      - "P(A | B) = 0.5"
      - "P(A or B) = 0.8"
    option_explanations:
      - |
        P(A and B) = 0.15 is not 0, so A and B can happen together; they are not mutually exclusive.
      - |
        Correct. P(A)P(B) = 0.5 × 0.3 = 0.15 = P(A and B), which is the condition for independence.
      - |
        Correct. P(A or B) = 0.5 + 0.3 − 0.15 = 0.65 by the general addition rule.
      - |
        Correct. P(A | B) = 0.15/0.3 = 0.5, which equals P(A), as independence requires.
      - |
        0.8 = 0.5 + 0.3 forgets to subtract the overlap P(A and B) = 0.15.
    answer: [1, 2, 3]
  - slug: apstats-u02-exam-q29
    type: multi_select
    topic_code: "2.12"
    source: "AP Statistics CED, Topic 2.12"
    points: 2
    partial_credit: true
    prompt: |
      A large population is strongly skewed right with mean 80 and standard deviation 16. A random sample of 64 is taken. Which statements are true? Select all that apply.
    options:
      - "The mean of the sampling distribution of x̄ is 80."
      - "The 64 values in the sample will be approximately normally distributed."
      - "The standard deviation of the sampling distribution of x̄ is 2."
      - "The sampling distribution of x̄ is approximately normal."
      - "Doubling the sample size to 128 would make the standard deviation of x̄ equal to 1."
    option_explanations:
      - |
        Correct. x̄ is an unbiased estimator of μ, so its sampling distribution is centred at 80.
      - |
        The sample data resemble the population, so they will be skewed right; the CLT is about x̄, not the individual values.
      - |
        Correct. SD(x̄) = 16/√64 = 16/8 = 2 (the population is large, so the 10% condition holds).
      - |
        Correct. n = 64 ≥ 30, so by the Central Limit Theorem the sampling distribution of x̄ is approximately normal.
      - |
        Doubling n gives 16/√128 ≈ 1.41; reaching 1 would need n = 256, four times the sample size.
    answer: [0, 2, 3]
  - slug: apstats-u02-exam-q30
    type: true_false
    topic_code: "2.4"
    source: "AP Statistics CED, Topic 2.4"
