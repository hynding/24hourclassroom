  - slug: apstats-u02-exam-q41
    type: short_answer
    topic_code: "2.3"
    source: "AP Statistics CED, Topic 2.3"
    points: 3
    prompt: |
      A hypothetical basketball player makes 60% of her three-point shots, and her shots are independent. A student wants to estimate, by simulation with random digits, the probability that the player makes at least 3 of her next 5 three-point attempts.

      (a) Describe how to assign the random digits 0 to 9 to the outcomes of one shot.
      (b) Describe what one trial of the simulation is and what is recorded for it.
      (c) The student runs 50 trials, and 34 of them have at least 3 made shots. State the estimate, and explain how to make the estimate more reliable.
    answer: |
      (a) Let digits 0 to 5 represent a made shot and 6 to 9 a miss, so each shot is made with probability 6/10 = 0.6.
      (b) One trial: read 5 random digits (5 shots) and record whether at least 3 of them are 0 to 5 (at least 3 made shots).
      (c) Estimate: 34/50 = 0.68. Run many more trials (for example 1,000 or more); by the law of large numbers the relative frequency gets closer to the true probability (which is 0.683 by the binomial formula).
    explanation: |
      Three points, one per part. (a) a digit assignment with exactly 6 of 10 equally likely digits for a make. (b) a trial of exactly 5 digits with the "at least 3 makes" outcome recorded. (c) 0.68 and "more trials" with a reason. An assignment such as "0 to 6 = make" earns no point for (a).
  - slug: apstats-u02-exam-q42
    type: short_answer
    topic_code: "2.9"
    source: "AP Statistics CED, Topic 2.9"
    points: 3
    prompt: |
      A hypothetical school club sells 500 raffle tickets at $5 each. One ticket wins $500, two tickets win $100 each and five tickets win $20 each; the other 492 tickets win nothing. Let X = the net gain (prize minus the $5 cost) for a person who buys one ticket.

      (a) Write the probability distribution of X.
      (b) Find the mean of X.
      (c) Interpret the mean in context.
    answer: |
      (a) X = $495 with probability 1/500 = 0.002; X = $95 with probability 2/500 = 0.004; X = $15 with probability 5/500 = 0.010; X = −$5 with probability 492/500 = 0.984.
      (b) μ_X = 495(0.002) + 95(0.004) + 15(0.010) + (−5)(0.984) = 0.99 + 0.38 + 0.15 − 4.92 = −$3.40.
      (c) If a person bought tickets in many raffles like this one, their net gain would average about −$3.40 per ticket in the long run: they would lose about $3.40 per ticket on average.
    explanation: |
      Three points, one per part. (a) all four net values (prize minus $5) with probabilities summing to 1; listing prizes without subtracting the cost earns no point. (b) −$3.40 with the work shown. (c) a long-run-average interpretation in context; "each person loses $3.40" earns no point.
  - slug: apstats-u02-exam-q43
    type: long_answer
    topic_code: "2.2"
    source: "AP Statistics CED, Topic 2.2"
    points: 10
    prompt: |
      A student journalist at a hypothetical high school of 2,100 students wants to know whether students who eat breakfast on school days are more likely to feel alert in first period than students who skip breakfast. She selects a simple random sample of 250 students and asks each one two questions. The results:

      | | Alert | Not alert | Total |
      |---|---|---|---|
      | Eats breakfast | 96 | 54 | 150 |
      | Skips breakfast | 38 | 62 | 100 |
      | Total | 134 | 116 | 250 |

      (A) Write a statistical investigative question that this study could answer. Identify the two variables and state whether each is categorical or quantitative.

      (B) Calculate the proportion of students who feel alert in each breakfast group. Describe what a segmented bar chart of these data, with one bar for each breakfast group, would show.

      (C) Based on your answers to (B), is there an association between eating breakfast and feeling alert for these students? Explain.

      (D) The journalist writes, "Eating breakfast makes students more alert." Explain whether this conclusion is justified by her study, and briefly describe how a study could be designed to investigate cause and effect.

      (E) One of the 250 students is selected at random. Find P(eats breakfast | alert). Are the events "eats breakfast" and "alert" independent? Justify your answer.
    answer: |
      (A) For example: "At this high school, is the proportion of students who feel alert in first period higher among students who eat breakfast on school days than among students who skip breakfast?" The variables are whether a student eats breakfast (categorical) and whether the student feels alert in first period (categorical).
      (B) Eats breakfast: 96/150 = 0.64 alert. Skips breakfast: 38/100 = 0.38 alert. In the segmented bar chart, each bar has height 100%; the "alert" segment fills 64% of the eats-breakfast bar but only 38% of the skips-breakfast bar, so the "not alert" segment is larger for skippers (62% versus 36%).
      (C) Yes. The proportion of students who feel alert is much higher for those who eat breakfast (0.64) than for those who skip it (0.38). Because the conditional distributions of alertness differ between the groups, the variables are associated in this sample.
      (D) Not justified. This is an observational study: students chose whether to eat breakfast, so other variables (for example amount of sleep, or how early a student wakes up) could be related to both breakfast and alertness. Because the sample was random, the association can be generalised to the school's students, but not as cause and effect. To investigate causation, randomly assign volunteer students to eat or not eat a provided breakfast on school days (a randomised experiment), then compare the proportions who report feeling alert.
      (E) P(eats breakfast | alert) = 96/134 ≈ 0.716. P(eats breakfast) = 150/250 = 0.60. Since 0.716 ≠ 0.60, the events are not independent.
    explanation: |
      Ten points.
      (A) 2 points: 1 for an investigative question that names the population (students at this school) and the comparison between breakfast groups; a yes/no survey question such as "Do you eat breakfast?" earns no point. 1 for both variables identified as categorical.
      (B) 2 points: 1 for both conditional proportions, 0.64 and 0.38; 1 for a correct description of the segmented bar chart (equal-height bars divided by conditional proportions, alert segment larger for breakfast eaters).
      (C) 2 points: 1 for "yes, associated"; 1 for justification that compares conditional proportions (not counts) from (B).
      (D) 2 points: 1 for "not justified" because the study is observational (no random assignment), with a plausible confounding variable or the statement that other variables may explain the difference; 1 for a design that randomly assigns students to breakfast conditions and compares alertness. Generalising to the school's students because of random sampling may be mentioned but is not required.
      (E) 2 points: 1 for 0.716 (accept 96/134); 1 for "not independent" justified by comparing P(eats breakfast | alert) with P(eats breakfast) (or an equivalent comparison such as P(alert | eats breakfast) = 0.64 versus P(alert) = 0.536).
  - slug: apstats-u02-exam-q44
    type: long_answer
    topic_code: "2.12"
    source: "AP Statistics CED, Topic 2.12"
    points: 10
    prompt: |
      A hypothetical drink machine fills cups with an amount that is approximately normally distributed with mean 250 mL and standard deviation 8 mL. A cup "overflows" if it receives more than 260 mL.

      (A) Find the probability that a randomly selected cup overflows.

      (B) Ten cups are filled independently. Let X = the number of the 10 cups that overflow. Explain why X has a binomial distribution, and find P(X = 2).

      (C) Find the probability that at least one of the 10 cups overflows.

      (D) Let x̄ be the mean amount in the 10 cups. Describe the sampling distribution of x̄ (shape, mean and standard deviation), and find P(x̄ > 255).

      (E) The probability that a single cup receives more than 255 mL is 0.266. Explain why the probability in (D) is so much smaller.
    answer: |
      (A) Let A = amount in a cup, A is N(250, 8). z = (260 − 250)/8 = 1.25; P(A > 260) = P(Z > 1.25) ≈ 0.106.
      (B) Each cup overflows or does not (two outcomes); there are a fixed 10 cups; cups are filled independently; and each cup overflows with the same probability 0.106. So X is binomial with n = 10 and p = 0.106. P(X = 2) = 10C2 (0.106)²(0.894)⁸ ≈ 0.206.
      (C) P(X ≥ 1) = 1 − P(X = 0) = 1 − (0.894)¹⁰ ≈ 1 − 0.326 = 0.674 (0.673 if p is not rounded).
      (D) The population of amounts is normal, so the sampling distribution of x̄ is normal (for any n), with mean 250 mL and standard deviation 8/√10 ≈ 2.53 mL. z = (255 − 250)/2.53 = 1.98; P(x̄ > 255) ≈ 0.024.
      (E) An average of 10 cups varies much less than a single cup (SD 2.53 mL versus 8 mL), because high and low fills tend to balance out. So 255 mL is only 0.625 SDs above the mean for one cup but about 1.98 SDs above the mean for x̄, which puts much less area above it.
    explanation: |
      Ten points.
      (A) 2 points: 1 for the distribution and the z-score (or labelled normalcdf inputs: lower 260, upper ∞, mean 250, SD 8); 1 for 0.106 (accept 0.105 to 0.106).
      (B) 3 points: 1 for the binomial conditions in context (two outcomes, fixed n = 10, independence, same p); 1 for n = 10 and p equal to the answer to (A); 1 for P(X = 2) ≈ 0.206 (accept 0.205 to 0.206, or a value consistent with an incorrect p from (A)).
      (C) 1 point: 0.674 (accept 0.672 to 0.675) by the complement.
      (D) 3 points: 1 for "normal" justified by the normal population (the CLT is not needed and does not apply to n = 10); 1 for mean 250 and SD 8/√10 ≈ 2.53; 1 for P(x̄ > 255) ≈ 0.024. Using SD 8 for x̄ earns at most the first point.
      (E) 1 point: the mean of 10 cups has a smaller standard deviation (σ/√n) than a single cup, so 255 mL is many more standard deviations above the mean for x̄ than for one cup.
