      answer: { value: 2.179, tolerance: 0.002 }
      explanation: |
        SE = √(3.4²/22 + 4.1²/26) = √(0.5255 + 0.6465) = √1.1720 ≈ 1.0826. Margin of error = 2.013 × 1.0826 ≈ 2.179 kernels.
    - slug: apstats-u04-w27-q22
      type: short_answer
      topic_code: "4.8"
      source: "AP Statistics CED, Topic 4.8"
      points: 3
      prompt: |
        A middle school randomly assigns 50 volunteer classrooms, 25 to standing desks (S) and 25 to regular desks (R). After a month, a 99% confidence interval for μS − μR, the difference in mean daily step counts per student, is (210, 1,480) steps.

        (a) Do the data give convincing evidence that standing desks increase mean daily steps? Explain, including what kind of conclusion the design allows.
        (b) A furniture company claims standing desks add 2,000 steps a day on average. Is that claim plausible? Explain.
        (c) Would a 95% interval from the same data contain 0? Explain without computing it.
      answer: |
        (a) Yes. The entire interval is above 0, so 0 is not a plausible value of μS − μR, and the classrooms were randomly assigned to desk type, so we can conclude that standing desks cause an increase in mean daily steps (for classrooms like these volunteers).
        (b) No. 2,000 steps is above the interval, so it is not a plausible value of the mean difference at the 99% level.
        (c) No. A 95% interval is centered at the same estimate (845 steps) but is narrower than the 99% interval, so it lies inside (210, 1,480) and still excludes 0.
      explanation: |
        Three points, one per part. (a) yes, with "0 is not in the interval" and the causal conclusion justified by random assignment (scope limited to classrooms like these is acceptable but not required). (b) not plausible because 2,000 is outside (above) the interval. (c) no, because the 95% interval is narrower with the same center, so it stays inside (210, 1,480).
    - slug: apstats-u04-w27-q23
      type: short_answer
      topic_code: "4.4"
      source: "AP Statistics CED, Topic 4.4"
      points: 3
      prompt: |
        A computer teacher wants to know whether students type faster on a split keyboard than on a standard keyboard. Each of 15 randomly selected students types the same passage on both keyboards, in a random order, and words per minute are recorded.

        (a) Name the appropriate test and explain why it is the right one.
        (b) Define the parameter and state the hypotheses.
        (c) Why does the teacher randomise the order of the keyboards?
      answer: |
        (a) A paired t-test for a population mean difference, because each student types on both keyboards, so the two measurements are linked; we analyse the 15 differences (split − standard).
        (b) μ_d = the true mean difference in typing speed (split − standard, words per minute) for all students at the school. H₀: μ_d = 0; Hₐ: μ_d > 0.
        (c) So that practice or fatigue effects (typing the passage a second time) are not confounded with the keyboard: neither keyboard always gets the benefit of going second.
      explanation: |
        Three points, one per part. (a) paired t-test (for a mean difference) with the reason that each student gives both measurements. (b) μ_d defined in context with the direction of subtraction, and correct one-sided hypotheses about μ_d (not about x̄_d). (c) a reason tied to order effects such as learning the passage or fatigue.
    - slug: apstats-u04-w27-q24
      type: long_answer
      topic_code: "4.7"
      source: "AP Statistics CED, Topic 4.7"
      points: 6
      prompt: |
        A physics class compares two paper-airplane designs. Twenty identical sheets of paper are randomly assigned, 10 to Design A and 10 to Design B; each airplane is thrown once by the same launcher. Flight distances (meters):

        | Design | Distances (m) |
        |---|---|
        | A | 11.2, 13.5, 9.8, 12.7, 14.1, 10.9, 12.2, 13.8, 11.6, 12.9 |
        | B | 10.1, 9.4, 11.8, 8.7, 10.6, 12.0, 9.9, 10.8, 9.2, 11.1 |

        Summary statistics: Design A x̄ = 12.27, s = 1.389; Design B x̄ = 10.36, s = 1.099. Neither sample has outliers, and dotplots of both are roughly symmetric.

        (A) Name the appropriate procedure and define the parameter.

        (B) Check the conditions for the procedure.

        (C) Construct a 95% confidence interval. State which degrees of freedom you used.

        (D) Interpret the interval, and say whether it gives convincing evidence that Design A flies farther on average.
      answer: |
        (A) A two-sample t-interval for μA − μB, where μA = the true mean flight distance of airplanes made with Design A and μB = the true mean flight distance with Design B (thrown by this launcher).
        (B) Random: the sheets were randomly assigned to the two designs. 10%: not needed, because this is an experiment, not a sample from a population. Normal: both samples are small (10 each), but the dotplots are roughly symmetric with no outliers, so a t procedure is reasonable.
        (C) x̄A − x̄B = 1.91 m. SE = √(1.389²/10 + 1.099²/10) ≈ 0.560. Calculator df ≈ 17.1, t* ≈ 2.109: 1.91 ± 1.181, giving (0.73, 3.09) m. (Conservative df = 9, t* = 2.262: 1.91 ± 1.267, giving (0.64, 3.18) m.)
        (D) We are 95% confident that the interval from 0.73 to 3.09 m captures the true difference (A minus B) in mean flight distance for airplanes like these. Because the whole interval is above 0, there is convincing evidence that Design A flies farther on average, and because the designs were randomly assigned, the design caused the difference (for this launcher and paper).
      explanation: |
        Six points.
        (A) 1 point: two-sample t-interval named, with μA and μB defined in context (the order of subtraction clear).
        (B) 2 points: 1 for Random (random assignment); 1 for Normal checked with the dotplots for both small samples (no strong skew, no outliers). Claiming n ≥ 30 or checking only one group earns 0 for Normal.
        (C) 2 points: 1 for the point estimate 1.91 and SE ≈ 0.560 (or the formula with values); 1 for the interval (0.73, 3.09) with calculator df ≈ 17.1, or (0.64, 3.18) with conservative df = 9, and the df named. An interval without the df stated earns at most 1 point in (C).
        (D) 1 point: interpretation with "confident", the parameter in context and the order of subtraction, plus "convincing evidence" because 0 is not in the interval.
