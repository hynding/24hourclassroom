      source: "AP Statistics CED, Topic 4.8"
      points: 1
      prompt: |
        True or false: A 95% two-sample t-interval for μ₁ − μ₂ of (−1.4, 2.9) shows that the two population means are equal.
      answer: false
      explanation: |
        False. Because 0 is inside the interval, a difference of 0 is plausible, so there is not convincing evidence of a difference; but every value from −1.4 to 2.9 is also plausible. An interval can never show that two means are exactly equal.
    - slug: apstats-u04-w27-q18
      type: true_false
      topic_code: "4.2"
      source: "AP Statistics CED, Topic 4.2"
      points: 1
      prompt: |
        True or false: For the same confidence level, the critical value t* for a one-sample t-interval with df = 9 is larger than z*.
      answer: true
      explanation: |
        True. t distributions have heavier tails than the standard normal, so their critical values are larger: for 95%, t* = 2.262 with df = 9 versus z* = 1.960. As df grows, t* approaches z*.
