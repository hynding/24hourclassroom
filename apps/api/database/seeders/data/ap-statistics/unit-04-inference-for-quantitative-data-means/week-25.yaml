    - slug: apstats-u04-w25-q16
      type: true_false
      topic_code: "4.5"
      source: "AP Statistics CED, Topic 4.5"
      points: 1
      prompt: |
        True or false: A one-sample t-test of H₀: μ = 15 minutes for the mean time students spend on a homework app gives a p-value of 0.40. This shows that the true mean is 15 minutes.
      answer: false
      explanation: |
        False. A large p-value means the data are consistent with μ = 15, so we fail to reject H₀ and there is not convincing evidence that the mean differs from 15. It does not show that μ equals 15; many nearby values are also consistent with the data.
    - slug: apstats-u04-w25-q17
      type: true_false
      topic_code: "4.1"
      source: "AP Statistics CED, Topic 4.1"
      points: 1
      prompt: |
        True or false: For random samples of 10 from a strongly right-skewed population, the sampling distribution of x̄ is approximately normal.
      answer: false
      explanation: |
        False. With strong skew, n = 10 is too small for the Central Limit Theorem to make the sampling distribution of x̄ approximately normal; it stays noticeably right-skewed. This is why the Normal condition for t procedures checks the sample for strong skew when n < 30.
