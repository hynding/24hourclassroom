      source: "AP Statistics CED, Topic 4.2"
      points: 1
      prompt: |
        A random sample of 18 tomato plants grown in a school greenhouse has mean height x̄ = 42.6 cm and standard deviation s = 5.3 cm, with no strong skew or outliers. Find the upper endpoint of a 90% confidence interval for the mean height of all such plants. Give your answer to two decimal places.
      answer: { value: 44.77, tolerance: 0.01 }
      explanation: |
        df = 17, t* = 1.740. Margin of error = 1.740 · 5.3/√18 ≈ 2.17. Upper endpoint = 42.6 + 2.17 ≈ 44.77 cm (the interval is about 40.43 to 44.77 cm).
    - slug: apstats-u04-w24-q21
      type: numeric
      topic_code: "3.3"
      source: "AP Statistics CED, Topic 3.3"
      points: 1
      prompt: |
        In a random sample of 400 adults in a county, 58% say they would use a new bike-share program. Find the margin of error of a 95% confidence interval for the proportion of all adults in the county who would use it. Give your answer to three decimal places.
      answer: { value: 0.048, tolerance: 0.001 }
      explanation: |
        Margin of error = z* · √(p̂(1 − p̂)/n) = 1.96 · √(0.58 · 0.42/400) ≈ 1.96 · 0.0247 ≈ 0.048.
    - slug: apstats-u04-w24-q22
      type: short_answer
      topic_code: "4.2"
      source: "AP Statistics CED, Topic 4.2"
      points: 3
      prompt: |
        A gym teacher records the number of push-ups six students complete in the morning and again in the afternoon of the same day.

        | Student | 1 | 2 | 3 | 4 | 5 | 6 |
        |---|---|---|---|---|---|---|
        | Morning | 18 | 25 | 12 | 30 | 22 | 15 |
        | Afternoon | 21 | 27 | 15 | 31 | 26 | 16 |

        (a) Explain why these data should be analysed as paired data.
        (b) Compute the differences (afternoon − morning), their mean and their standard deviation.
        (c) Explain why a two-sample procedure that compares the morning mean with the afternoon mean would be inappropriate here.
      answer: |
        (a) Each student is measured twice, so each morning count is linked to one afternoon count from the same student.
        (b) Differences: 3, 2, 3, 1, 4, 1. Mean x̄_diff ≈ 2.33 push-ups; s_diff ≈ 1.21 push-ups.
        (c) The two sets of counts are not independent samples. Students differ a lot in strength (12 to 31 push-ups), and a two-sample procedure would treat that person-to-person variation as noise, hiding the small but consistent within-student gain that the differences reveal.
      explanation: |
        Three points, one per part. (a) the same students measured twice (or "the values are linked by student"). (b) all six differences, with mean 2.33 and SD 1.21 (accept 2.3 and 1.2). (c) the samples are dependent, not independent, with the idea that pairing removes between-student variation. A response that only says "because it is paired" in (c) earns no credit.
    - slug: apstats-u04-w24-q23
      type: short_answer
      topic_code: "3.11"
      source: "AP Statistics CED, Topic 3.11"
      points: 2
      prompt: |
        A school compares the proportion of students who bring lunch from home at two campuses. From independent random samples, a 95% confidence interval for p_North − p_South is from −0.02 to 0.09, where p_North and p_South are the proportions of all students at each campus who bring lunch from home.

        (a) Interpret the interval in context.
        (b) Does the interval give convincing evidence that the two campuses differ? Explain.
      answer: |
        (a) We are 95% confident that the interval from −0.02 to 0.09 captures the true difference (North − South) in the proportions of all students who bring lunch from home.
        (b) No. The interval contains 0, so no difference is a plausible value; there is not convincing evidence that the proportions differ.
      explanation: |
        Two points. (a) "95% confident" with the interval, the order of subtraction and the parameter in context (proportions of all students at the two campuses). (b) "no" because 0 is in the interval. Claiming the campuses are the same (accepting no difference) loses point (b).
    - slug: apstats-u04-w24-q24
      type: long_answer
      topic_code: "4.2"
      source: "AP Statistics CED, Topic 4.2"
      points: 6
      prompt: |
        A cross-country coach wants to know whether a new racing shoe lowers mile times. Eight runners on the team each run a timed mile in their old shoe and in the new shoe, a week apart, with a coin flip deciding which shoe each runner wears first. The times, in seconds:

        | Runner | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
        |---|---|---|---|---|---|---|---|---|
        | Old shoe | 412 | 385 | 448 | 401 | 395 | 430 | 377 | 419 |
        | New shoe | 405 | 381 | 440 | 399 | 389 | 428 | 375 | 410 |

        (A) Explain why a paired procedure is appropriate, and define the parameter you will estimate.

        (B) The differences (old − new) are 7, 4, 8, 2, 6, 2, 2, 9 seconds; a dotplot of them shows no strong skew or outliers. Check the conditions for a paired t-interval.

        (C) Construct a 95% confidence interval for the parameter.

        (D) Interpret the interval in context.

        (E) The shoe's maker claims it lowers mile times by 10 seconds on average. Does the interval support this claim? Explain.
      answer: |
        (A) Each runner ran in both shoes, so the two times for a runner are linked; we analyse the differences. μ_diff = the true mean difference in mile time (old shoe − new shoe), in seconds, for runners like these.
        (B) Random: the order of the shoes was randomly assigned for each runner (the runners are not a random sample, so results apply to runners like these). 10%: not needed for inference about a treatment with random assignment (no sampling from a population). Normal: n = 8 < 30, but the dotplot of differences shows no strong skew or outliers, so a t procedure is reasonable.
        (C) Paired t-interval for μ_diff: x̄_diff = 5.0, s_diff ≈ 2.88, df = 7, t* = 2.365. 5.0 ± 2.365 · 2.88/√8 = 5.0 ± 2.41, from about 2.59 to 7.41 seconds.
        (D) We are 95% confident that the interval from 2.59 to 7.41 seconds captures the true mean difference (old − new) in mile time for runners like these; that is, the new shoe lowers mean mile time by between about 2.6 and 7.4 seconds.
        (E) No. 10 seconds is above the whole interval, so it is not a plausible value of μ_diff; there is convincing evidence that the mean improvement is less than 10 seconds. (The interval does give convincing evidence of some improvement, since it lies entirely above 0, and random assignment of order lets us attribute it to the shoe.)
      explanation: |
        Six points.
        (A) 1 point: the reason for pairing (each runner measured in both shoes) and μ_diff defined in context with the order of subtraction.
        (B) 1 point: Random (random order of shoes) and Normal (n < 30, differences show no strong skew or outliers) both checked in context. Checking the Normal condition on the two sets of times rather than the differences does not earn the point.
        (C) 2 points: 1 for naming the paired t-interval with correct x̄_diff = 5.0, s_diff ≈ 2.88 and df = 7 (t* = 2.365); 1 for the interval (2.59, 7.41), with values from 2.5 to 2.7 and 7.3 to 7.5 accepted.
        (D) 1 point: "95% confident" with the endpoints, "true mean difference" and context, including the order of subtraction. Language about individual runners or a probability that μ_diff is in the interval loses the point.
        (E) 1 point: "no" because 10 is outside (above) the interval, with "plausible" or "convincing evidence" language.
