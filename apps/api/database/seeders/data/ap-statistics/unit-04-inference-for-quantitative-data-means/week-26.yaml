    - slug: apstats-u04-w26-q16
      type: true_false
      topic_code: "4.6"
      source: "AP Statistics CED, Topic 4.6"
      points: 1
      prompt: |
        True or false: For independent random samples, the standard deviation of x̄₁ − x̄₂ equals σ₁/√n₁ − σ₂/√n₂.
      answer: false
      explanation: |
        False. Standard deviations do not subtract (or add). For independent samples the variances add: SD(x̄₁ − x̄₂) = √(σ₁²/n₁ + σ₂²/n₂), which is larger than either σ₁/√n₁ or σ₂/√n₂.
    - slug: apstats-u04-w26-q17
      type: true_false
      topic_code: "2.12"
      source: "AP Statistics CED, Topic 2.12"
      points: 1
      prompt: |
        True or false: A class simulates 500 random samples of size 4 and 500 random samples of size 40 from the same strongly right-skewed population. The dotplot of the 500 sample means for n = 40 will be less spread out and closer to symmetric than the dotplot of the 500 sample means for n = 4.
      answer: true
      explanation: |
        True. The spread of the sample means is σ/√n, so it is √10 ≈ 3.2 times smaller for n = 40 than for n = 4; and by the Central Limit Theorem the means of the larger samples pile up in a much more nearly normal (symmetric) shape, while the means of samples of 4 stay noticeably right-skewed.
