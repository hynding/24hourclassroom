      type: short_answer
      topic_code: "4.6"
      source: "AP Statistics CED, Topic 4.6"
      points: 3
      prompt: |
        A coffee shop owner wants to compare the serving temperature of drinks at her two locations. Over a month, North serves about 4,000 drinks and South about 2,500. She measures a random sample of 35 drinks at North and a random sample of 20 drinks at South. Past records show South's serving temperatures are approximately normal; North's are somewhat left-skewed.

        Check, in context, each condition needed for the sampling distribution of x̄N − x̄S to be approximately normal with standard deviation √(σN²/35 + σS²/20).
      answer: |
        Random: both samples are random samples of drinks from their own location, and they are selected separately, so the samples are independent of each other.
        10%: 35 ≤ 10% of 4,000 (400) and 20 ≤ 10% of 2,500 (250), so drinks within each sample can be treated as independent.
        Normal: North's sample has 35 ≥ 30 drinks, so the Central Limit Theorem makes x̄N approximately normal despite the left skew; South's sample is only 20, but South's temperatures are approximately normal, so x̄S is normal. Hence x̄N − x̄S is approximately normal.
      explanation: |
        Three points, one per condition. Random: two random samples, independent of each other, in context. 10%: both comparisons made with numbers (35 ≤ 400 and 20 ≤ 250). Normal: North justified by n = 35 ≥ 30 (Central Limit Theorem) and South by the approximately normal population; a response that applies "n ≥ 30" to the total of 55, or that ignores South's small sample, earns no point for Normal.
    - slug: apstats-u04-w26-q23
      type: short_answer
      topic_code: "4.3"
      source: "AP Statistics CED, Topic 4.3"
      points: 3
      prompt: |
        A random sample of 28 students at a large school recorded their nightly sleep for a week before and a week after a sleep-hygiene workshop. A 95% paired t-interval for μ_d, the true mean of (after − before) nightly sleep for all students at the school who would take the workshop, is (0.12 hours, 0.58 hours).

        (a) Does the interval give convincing evidence that the workshop is associated with more sleep on average? Explain.
        (b) The workshop's leader claims the average gain is 30 minutes. Is that claim plausible? Explain.
        (c) A parent claims the average gain is a full hour. Is that claim plausible? Explain.
      answer: |
        (a) Yes. Every value in the interval is positive (0 is not in the interval), so 0, no change, is not a plausible value of μ_d; the data give convincing evidence that the mean after-minus-before difference is greater than 0.
        (b) Yes. 30 minutes = 0.5 hours, which lies inside (0.12, 0.58), so it is a plausible value of μ_d.
        (c) No. 1 hour lies above the interval, so it is not a plausible value of μ_d at the 95% level.
      explanation: |
        Three points, one per part. (a) yes, with the reason that 0 is not in the interval (all values positive). (b) converts 30 minutes to 0.5 hours and notes it is inside the interval, so plausible (not "proven"). (c) notes 1 hour is outside (above) the interval, so not plausible. Deduct the (b) point for saying the interval proves the leader is right.
    - slug: apstats-u04-w26-q24
      type: long_answer
      topic_code: "4.6"
      source: "AP Statistics CED, Topic 4.6"
      points: 6
      prompt: |
        Hypothetically, eggs from Farm A have mean weight 58.0 grams with standard deviation 4.0 grams, and eggs from Farm B have mean weight 56.5 grams with standard deviation 5.0 grams. Each farm produces tens of thousands of eggs a week. An inspector selects independent random samples of 36 eggs from Farm A and 40 eggs from Farm B and computes x̄A − x̄B.

        (A) Find the mean and the standard deviation of the sampling distribution of x̄A − x̄B.

        (B) Describe the shape of the sampling distribution of x̄A − x̄B and justify your answer.

        (C) Find the probability that the Farm B sample has a mean weight at least as large as the Farm A sample, P(x̄A − x̄B ≤ 0).

        (D) The inspector's samples give x̄A − x̄B = −1.0 gram. Assuming the stated means and standard deviations are correct, how surprising is this result? What does it suggest?
      answer: |
        (A) Mean = μA − μB = 58.0 − 56.5 = 1.5 grams. SD = √(4.0²/36 + 5.0²/40) = √(0.4444 + 0.625) = √1.0694 ≈ 1.034 grams (valid because the samples are independent and each is far less than 10% of a week's eggs).
        (B) Approximately normal: both samples are large (36 ≥ 30 and 40 ≥ 30), so by the Central Limit Theorem each sample mean is approximately normal, and so is their difference.
        (C) z = (0 − 1.5)/1.034 ≈ −1.45, so P(x̄A − x̄B ≤ 0) ≈ 0.073.
        (D) z = (−1.0 − 1.5)/1.034 ≈ −2.42, and P(x̄A − x̄B ≤ −1.0) ≈ 0.008. If the stated values were correct, a difference this low would happen in fewer than 1% of samples, so it is very surprising; it suggests that the true difference in mean weight is smaller than 1.5 grams (perhaps Farm B's eggs are now as heavy as or heavier than Farm A's).
      explanation: |
        Six points.
        (A) 2 points: 1 for the mean 1.5 grams; 1 for the SD ≈ 1.034 grams with the formula shown. Adding SDs, subtracting variances or omitting the sample sizes earns 0 for the SD.
        (B) 1 point: "approximately normal" with the Central Limit Theorem justified by both samples being at least 30 (each sample named).
        (C) 1 point: probability ≈ 0.073 (accept 0.07 to 0.075) with the normal calculation shown (z or normalcdf with mean and SD labelled).
        (D) 2 points: 1 for a probability of about 0.008 (or z ≈ −2.42); 1 for concluding the result is unusual under the stated parameters and that it is evidence the true mean difference is less than 1.5 grams. Saying the result "proves" the farms changed earns at most 1 point.
