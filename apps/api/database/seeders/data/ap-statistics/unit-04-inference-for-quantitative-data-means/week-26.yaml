      prompt: |
        Lunch-line wait times at a large high school are right-skewed with mean 6.4 minutes and standard deviation 2.8 minutes. For a random sample of 40 students, find the probability that the sample mean wait time is more than 7 minutes. Give your answer to three decimal places.
      answer: { value: 0.088, tolerance: 0.003 }
      explanation: |
        n = 40 ≥ 30, so by the Central Limit Theorem x̄ is approximately normal with mean 6.4 and SD 2.8/√40 ≈ 0.443. z = (7 − 6.4)/0.443 ≈ 1.36, and P(z > 1.36) ≈ 0.088 (calculator: 0.0877).
