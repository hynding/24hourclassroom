      source: "AP Statistics CED, Topic 4.10"
      points: 1
      prompt: |
        Independent random samples give x̄₁ = 58.3, s₁ = 7.4, n₁ = 20 and x̄₂ = 53.9, s₂ = 8.8, n₂ = 24. Find the two-sample t statistic for H₀: μ₁ − μ₂ = 0, to two decimal places.
      answer: { value: 1.80, tolerance: 0.01 }
      explanation: |
        SE = √(7.4²/20 + 8.8²/24) = √(2.738 + 3.227) = √5.965 ≈ 2.442. t = (58.3 − 53.9)/2.442 = 4.4/2.442 ≈ 1.80 (calculator df ≈ 42.0).
    - slug: apstats-u04-w28-q22
      type: short_answer
      topic_code: "4.10"
      source: "AP Statistics CED, Topic 4.10"
      points: 3
      prompt: |
        A physical-education teacher takes random samples of 20 student-athletes and 25 non-athletes at a large high school and measures hand-grip strength (kg). She tests H₀: μA − μN = 0 against Hₐ: μA − μN > 0, where μA and μN are the true mean grip strengths of all athletes and all non-athletes at the school, at α = 0.01. The observed difference is x̄A − x̄N = 4.6 kg, and the 2-SampTTest output is t = 2.21, df = 37.6, p-value = 0.017.

        (a) Interpret the p-value in context.
        (b) State the conclusion of the test at α = 0.01.
        (c) Which type of error could the teacher have made? Describe it in context.
      answer: |
        (a) Assuming there is no difference in true mean grip strength between athletes and non-athletes at the school (μA − μN = 0), there is a 0.017 probability of getting a difference in sample means of 4.6 kg or more (athletes higher) by chance alone.
        (b) Because p-value = 0.017 > α = 0.01, we fail to reject H₀. There is not convincing evidence at the 1% level that the mean grip strength of all athletes at the school is greater than that of all non-athletes.
        (c) A Type II error: athletes really do have a greater mean grip strength than non-athletes, but the test failed to find convincing evidence of it.
      explanation: |
        Three points, one per part. (a) assumes H₀ in context, gives 0.017, and describes "a difference of 4.6 kg or more" in the direction of Hₐ. (b) compares 0.017 with 0.01, fails to reject, and states the conclusion in context with "not convincing evidence" (no "accept H₀"). (c) Type II error, described in context (the true mean for athletes is greater but the test did not detect it).
    - slug: apstats-u04-w28-q23
      type: short_answer
      topic_code: "4.8"
      source: "AP Statistics CED, Topic 4.8"
      points: 3
      prompt: |
        A clinic randomly assigns 80 patients, 40 to a new check-in system and 40 to the old one. A 95% confidence interval for μ_new − μ_old, the difference in mean waiting time (minutes), is (−8.2, −1.5).

        (a) Interpret the interval in context.
        (b) Does the interval give convincing evidence that the new system reduces mean waiting time? Explain.
        (c) The software vendor claims the new system saves 10 minutes on average. Is that claim plausible? Explain.
      answer: |
        (a) We are 95% confident that the interval from −8.2 to −1.5 minutes captures the true difference (new minus old) in mean waiting time; that is, the new system's mean wait is between 1.5 and 8.2 minutes shorter, for patients like these.
        (b) Yes. Every value in the interval is negative, so 0 is not plausible; because patients were randomly assigned, there is convincing evidence that the new system causes a shorter mean wait.
        (c) No. Saving 10 minutes corresponds to μ_new − μ_old = −10, which lies outside (below) the interval, so it is not plausible at the 95% level.
      explanation: |
        Three points, one per part. (a) confidence level, parameter in context and the order of subtraction (or a correct translation into "shorter by 1.5 to 8.2 minutes"). (b) yes, because the interval lies entirely below 0, with random assignment supporting the causal wording. (c) not plausible because −10 is outside the interval; responses comparing +10 to the interval earn the point only if they explain the sign.
    - slug: apstats-u04-w28-q24
      type: long_answer
      topic_code: "4.10"
      source: "AP Statistics CED, Topic 4.10"
      points: 8
      prompt: |
        A robotics club wants to know whether Brand X AA batteries run their toy robot longer than Brand Y batteries. They buy batteries from several stores and treat them as random samples of each brand's production (millions of batteries). Run times, in minutes:

        | Brand | Run time (minutes) |
        |---|---|
        | X | 128, 141, 135, 122, 146, 138, 131, 143, 136 |
        | Y | 124, 119, 133, 127, 115, 130, 121, 126, 118, 129 |

        Summary statistics: Brand X x̄ = 135.56, s = 7.60, n = 9; Brand Y x̄ = 124.20, s = 5.83, n = 10. Dotplots of both samples are roughly symmetric with no outliers.

        (A) Define the parameters and state the hypotheses.

        (B) Name the procedure and check its conditions.

        (C) Calculate the test statistic and the p-value. State which degrees of freedom you used.

        (D) At α = 0.05, state your conclusion in context.

        (E) Based on your conclusion, which type of error could the club have made? Describe it in context.
      answer: |
        (A) μX = the true mean run time of the robot on all Brand X batteries; μY = the true mean run time on all Brand Y batteries. H₀: μX − μY = 0; Hₐ: μX − μY > 0.
        (B) Two-sample t-test for μX − μY. Random: treated as random samples of each brand, selected independently. 10%: 9 and 10 are far less than 10% of millions of batteries. Normal: both samples are small, but their dotplots are roughly symmetric with no outliers, so the t procedure is reasonable.
        (C) SE = √(7.60²/9 + 5.83²/10) ≈ 3.133. t = (135.56 − 124.20)/3.133 ≈ 3.62. Calculator df ≈ 15.0, p-value ≈ 0.0013. (Conservative df = 8: p-value ≈ 0.0034.)
        (D) Because p-value ≈ 0.0013 < α = 0.05, we reject H₀. There is convincing evidence that the true mean run time of the robot is longer with Brand X batteries than with Brand Y batteries.
        (E) Because we rejected H₀, a Type I error is possible: concluding that Brand X runs the robot longer on average when, in fact, the two brands have the same mean run time.
      explanation: |
        Eight points.
        (A) 2 points: 1 for both parameters defined in context (true mean run times of all batteries of each brand); 1 for H₀: μX − μY = 0 and the one-sided Hₐ: μX − μY > 0 (hypotheses in terms of x̄ earn 0).
        (B) 2 points: 1 for naming the two-sample t-test (a paired test earns 0 for the whole part); 1 for Random and Normal both checked in context, with the Normal check based on the dotplots of both small samples (the 10% check is expected but its omission alone does not lose the point).
        (C) 2 points: 1 for t ≈ 3.62 with the SE shown; 1 for the p-value ≈ 0.0013 with calculator df ≈ 15.0, or ≈ 0.0034 with conservative df = 8, and the df named.
        (D) 1 point: compares the p-value with 0.05, rejects H₀, and concludes in context with "convincing evidence" about the true mean run times.
        (E) 1 point: Type I error, described in context, consistent with the decision in (D).
