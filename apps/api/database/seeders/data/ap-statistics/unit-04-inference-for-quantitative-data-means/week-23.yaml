    - slug: apstats-u04-w23-q20
      type: numeric
      topic_code: "4.1"
      source: "AP Statistics CED, Topic 4.1"
      points: 1
      prompt: |
        In a city, commute times to work are skewed to the right with mean 24 minutes and standard deviation 11 minutes. A transit planner surveys a random sample of 50 commuters. Find the probability that the sample mean commute time is greater than 27 minutes. Give your answer to three decimal places.
      answer: { value: 0.027, tolerance: 0.0015 }
      explanation: |
        n = 50 ≥ 30, so by the Central Limit Theorem x̄ is approximately normal with mean 24 and SD 11/√50 ≈ 1.556 minutes. z = (27 − 24)/1.556 ≈ 1.93, and P(z > 1.93) ≈ 0.027 (table 0.0268).
    - slug: apstats-u04-w23-q21
      type: numeric
      topic_code: "2.10"
      source: "AP Statistics CED, Topic 2.10"
      points: 1
      prompt: |
        A basketball player makes 30% of her three-point attempts, and attempts are independent. In a game she takes 10 three-point shots. Find the probability that she makes at most 2 of them. Give your answer to three decimal places.
      answer: { value: 0.383, tolerance: 0.001 }
      explanation: |
        X = number made is binomial with n = 10 and p = 0.30. P(X ≤ 2) = P(0) + P(1) + P(2) = 0.0282 + 0.1211 + 0.2335 ≈ 0.383 (binomcdf(10, 0.3, 2)).
    - slug: apstats-u04-w23-q22
      type: short_answer
      topic_code: "4.1"
      source: "AP Statistics CED, Topic 4.1"
      points: 3
      prompt: |
        Return to the commuters in the city where commute times are skewed to the right with mean 24 minutes and standard deviation 11 minutes.

        (a) Can you use a normal model to find the probability that one randomly selected commuter's time is more than 30 minutes? Explain.
        (b) Can you use a normal model to find the probability that the mean of a random sample of 60 commuters is more than 30 minutes? Explain.
        (c) Without calculating, which of the two probabilities (if both were known) would be smaller? Explain.
      answer: |
        (a) No. A single commute time comes from the population distribution, which is skewed to the right, so normal probabilities would be wrong.
        (b) Yes. With a random sample of n = 60 ≥ 30, the Central Limit Theorem says the sampling distribution of x̄ is approximately normal, with mean 24 and SD 11/√60 ≈ 1.42 minutes (assuming 60 is less than 10% of all commuters).
        (c) The probability for the sample mean. Means vary much less than individual times (SD 1.42 versus 11), so a mean as high as 30, about 4.2 standard deviations above 24, is far less likely than one commute that long.
      explanation: |
        Three points, one per part. (a) "no" with the reason that the population (and so a single value) is skewed, not normal. (b) "yes" citing the Central Limit Theorem with n = 60 ≥ 30 (the SD 11/√60 is a bonus, not required). (c) the sample mean's probability is smaller, because SD(x̄) = σ/√n is much smaller than σ. A response that says the CLT makes individual times normal earns no credit in (a).
    - slug: apstats-u04-w23-q23
      type: short_answer
      topic_code: "3.7"
      source: "AP Statistics CED, Topic 3.7"
      points: 3
      prompt: |
        A town claims that 65% of its households recycle. A student group suspects the true proportion is lower. They test H₀: p = 0.65 against Hₐ: p < 0.65, where p is the proportion of all households in the town that recycle. In a random sample of 300 households, 180 recycle (p̂ = 0.60). The test statistic is z ≈ −1.82, and the p-value is about 0.035.

        (a) Interpret the p-value in context.
        (b) State the conclusion of the test at α = 0.05 in context.
        (c) Would the conclusion change at α = 0.01? Explain.
      answer: |
        (a) Assuming that 65% of all households in the town recycle, there is about a 0.035 probability of getting a sample proportion of 0.60 or lower in a random sample of 300 households by chance alone.
        (b) Because p-value = 0.035 < α = 0.05, we reject H₀. There is convincing evidence that the proportion of all households in the town that recycle is less than 0.65.
        (c) Yes. Because 0.035 > 0.01, at α = 0.01 we would fail to reject H₀; there would not be convincing evidence that fewer than 65% recycle.
      explanation: |
        Three points, one per part. (a) a conditional probability that assumes H₀ (p = 0.65), names the observed result "0.60 or lower" and says "by chance" in context. (b) compares 0.035 with 0.05, says "reject H₀" and gives a conclusion about all households with "convincing evidence" language. (c) "yes" with the comparison 0.035 > 0.01 and "fail to reject". Saying "accept H₀" in (c), or that 0.035 is the probability H₀ is true in (a), loses that point.
    - slug: apstats-u04-w23-q24
      type: long_answer
      topic_code: "4.1"
      source: "AP Statistics CED, Topic 4.1"
      points: 6
      prompt: |
        A pizza shop's delivery times are approximately normal with mean μ = 32 minutes and standard deviation σ = 7 minutes. The shop makes thousands of deliveries a month.

        (A) Find the probability that one randomly selected delivery takes more than 35 minutes.

        (B) A manager selects a random sample of 9 deliveries from last month. Describe the shape, centre and spread of the sampling distribution of x̄, the mean delivery time of the 9, and justify the shape.

        (C) Find the probability that the mean delivery time of the 9 is more than 35 minutes.

        (D) Explain why the probability in (C) is smaller than the probability in (A).

        (E) Suppose instead that delivery times were strongly skewed to the right, with the same μ and σ. Which, if any, of the calculations in (A) and (C) would still be valid? What sample size would let the manager use a normal model for x̄?
      answer: |
        (A) z = (35 − 32)/7 ≈ 0.43; P(X > 35) ≈ 0.334.
        (B) Normal, because the population of delivery times is normal (so x̄ is normal for any n). Mean = μ = 32 minutes. SD(x̄) = 7/√9 = 7/3 ≈ 2.33 minutes (valid because 9 is far less than 10% of thousands of deliveries).
        (C) z = (35 − 32)/2.333 ≈ 1.29; P(x̄ > 35) ≈ 0.099.
        (D) A mean of 9 deliveries varies less than a single delivery (SD 2.33 versus 7 minutes), because unusually long and short times tend to balance out. So 35 minutes is farther above the centre in SD units for the mean (z ≈ 1.29) than for one delivery (z ≈ 0.43).
        (E) Neither. A single time would come from a skewed population, and a mean of only 9 from a strongly skewed population is not approximately normal. A sample of at least about 30 deliveries (n ≥ 30) would let the Central Limit Theorem justify a normal model for x̄; individual times would still not be normal.
      explanation: |
        Six points.
        (A) 1 point: z ≈ 0.43 (or calculator work with mean 32 and SD 7) and probability ≈ 0.334 (0.33 to 0.335 accepted).
        (B) 2 points: 1 for mean 32 and SD 7/√9 ≈ 2.33; 1 for "normal" justified by the normal population (not by the CLT, since n = 9). Citing the CLT for the shape loses this point.
        (C) 1 point: z ≈ 1.29 using SD 2.33 and probability ≈ 0.099 (0.098 to 0.100 accepted). Using σ = 7 earns nothing here.
        (D) 1 point: the mean has a smaller standard deviation than individual values, so 35 is more standard deviations above 32.
        (E) 1 point: neither calculation is valid, and n ≥ 30 (or "a large sample") lets the CLT apply to x̄. Both parts are needed.
