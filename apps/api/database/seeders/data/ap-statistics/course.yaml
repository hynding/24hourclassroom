# The AP Statistics course map (the redesigned course, effective fall 2026,
# first exam May 2027). Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\Curriculum\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: AP Statistics
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: AP Statistics
slug: apstats
# The course's site-wide address, /courses/ap-statistics (App\Support\Slugs).
site_slug: ap-statistics
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full school year of AP Statistics, following the redesigned course that
  starts in fall 2026, one week at a time: a study guide, a flashcard deck
  and a quiz every week, a summary sheet and an exam at the end of each of
  the five units (exploring one-variable data and collecting data;
  probability, random variables and probability distributions; inference for
  proportions, including chi-square tests; inference for means; and
  regression analysis), and an exam-prep guide with a 70-question practice
  final whose first 46 questions follow the May 2027 AP Statistics exam
  format (42 multiple choice, then four 10-point free-response questions).
  Original material written around the College Board AP Statistics Course
  and Exam Description, with original worked examples, invented data sets,
  questions and cards.
  Free to copy, adapt and share under CC BY 4.0, crediting 24 Hour
  Classroom.
teacher: { name: "AP Statistics Teacher", email: apstats@example.com }
student: { name: "AP Statistics Student", email: apstats-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# The AP exam is Tuesday 2027-05-11, session 2 (College Board AP Central);
# weeks 33-34 review, then buffer weeks before exam week 37.
start_date: 2026-08-31
exam_date: 2027-05-11
subject: math
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The May 2027 AP Statistics exam format (fully digital in Bluebook, 42 four-option multiple-choice questions and four 10-point free-response questions, calculators allowed), how the practice final maps onto it, the four free-response question types and how they are scored, the inference procedures and the conditions and conclusion language to know cold, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["AP Statistics Course and Exam Description", "CC BY 4.0"]
attribution: |
  Original study material written for this course and organised around the
  College Board AP Statistics Course and Exam Description (effective fall
  2026). Every explanation, worked example, data set, flashcard and question
  was written for this course; all data are invented. © 2026 24 Hour
  Classroom, licensed under CC BY 4.0
  (https://creativecommons.org/licenses/by/4.0/).
# The four statistical practices, by their CED numbers; guides tag topics with them.
practices:
  "1": Formulate Questions
  "2": Collect Data
  "3": Analyze Data
  "4": Interpret Results
# The redesigned course's five units and 55 topics (CED, effective fall 2026).
# Weights are the CED's multiple-choice exam weightings.
units:
  - number: 1
    slug: unit-01-one-variable-data-and-collecting-data
    title: Exploring One-Variable Data and Collecting Data
    weight: "20–30%"
    weeks: [1, 2, 3, 4, 5, 6, 7]
    topics:
      "1.1": "Introducing Statistics: What Can We Learn from Data?"
      "1.2": Variables
      "1.3": Tabular Representation and Summary Statistics for One Categorical Variable
      "1.4": Graphical Representations for One Categorical Variable
      "1.5": Graphical Representations for One Quantitative Variable
      "1.6": Descriptions for One Quantitative Variable Distributions
      "1.7": Summary Statistics for One Quantitative Variable
      "1.8": Graphical Representations of Summary Statistics for One Quantitative Variable
      "1.9": Comparisons of the Distributions for One Quantitative Variable
      "1.10": The Investigative Question Revisited and Data Collection
      "1.11": Random Sampling
      "1.12": Potential Problems with Sampling
      "1.13": Experimental Design
  - number: 2
    slug: unit-02-probability-random-variables-and-distributions
    title: Probability, Random Variables, and Probability Distributions
    weight: "15–25%"
    weeks: [8, 9, 10, 11, 12, 13, 14]
    topics:
      "2.1": Tabular and Graphical Representations for the Distributions of Two Categorical Variables
      "2.2": Summary Statistics for Two Categorical Variables
      "2.3": Estimating Probabilities Using Simulation
      "2.4": Introduction to Probability
      "2.5": Mutually Exclusive Events
      "2.6": Conditional Probability
      "2.7": Independent Events and Unions of Events
      "2.8": Introduction to Random Variables and Probability Distributions
      "2.9": Parameters of Random Variables
      "2.10": The Binomial Distribution
      "2.11": The Normal Distribution
      "2.12": Sampling Distributions and the Central Limit Theorem
  - number: 3
    slug: unit-03-inference-for-categorical-data-proportions
    title: "Inference for Categorical Data: Proportions"
    weight: "15–25%"
    weeks: [15, 16, 17, 18, 19, 20, 21, 22]
    topics:
      "3.1": Estimators
      "3.2": Sampling Distributions for Sample Proportions
      "3.3": Constructing a Confidence Interval for a Population Proportion
      "3.4": Justifying a Claim Based on a Confidence Interval for a Population Proportion
      "3.5": Setting Up a Test for a Population Proportion
      "3.6": p-Values
      "3.7": Carrying Out a Test for a Population Proportion
      "3.8": Potential Errors When Performing Tests
      "3.9": Sampling Distributions for the Difference Between Sample Proportions
      "3.10": Constructing a Confidence Interval for the Difference Between Two Population Proportions
      "3.11": Justifying a Claim Based on a Confidence Interval for the Difference Between Two Population Proportions
      "3.12": Setting Up a Test for the Difference Between Two Population Proportions
      "3.13": Carrying Out a Test for the Difference Between Two Population Proportions
      "3.14": Setting Up a Chi-Square Test for Homogeneity or Independence
      "3.15": Carrying Out a Chi-Square Test for Homogeneity or Independence
  - number: 4
    slug: unit-04-inference-for-quantitative-data-means
    title: "Inference for Quantitative Data: Means"
    weight: "10–20%"
    weeks: [23, 24, 25, 26, 27, 28]
    topics:
      "4.1": Sampling Distributions for Sample Means
      "4.2": Constructing a Confidence Interval for a Population Mean or Population Mean Difference
      "4.3": Justifying a Claim Based on a Confidence Interval for a Population Mean or Population Mean Difference
      "4.4": Setting Up a Test for a Population Mean or Population Mean Difference
      "4.5": Carrying Out a Test for a Population Mean or Population Mean Difference
      "4.6": Sampling Distributions for the Difference Between Two Sample Means
      "4.7": Constructing a Confidence Interval for the Difference Between Two Population Means
      "4.8": Justifying a Claim Based on a Confidence Interval for the Difference Between Two Population Means
      "4.9": Setting Up a Test for the Difference Between Two Population Means
      "4.10": Carrying Out a Test for the Difference Between Two Population Means
  - number: 5
    slug: unit-05-regression-analysis
    title: Regression Analysis
    weight: "10–20%"
    weeks: [29, 30, 31, 32]
    topics:
      "5.1": Graphical Representations Between Two Quantitative Variables
      "5.2": Correlation
      "5.3": Linear Regression Models
      "5.4": Residuals
      "5.5": Least-Squares Regression
