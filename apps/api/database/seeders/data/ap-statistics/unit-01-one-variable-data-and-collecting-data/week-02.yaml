week: 2
unit: 1
title: Summarizing and Graphing One Categorical Variable
topics: ["1.3", "1.4"]
guide: guides/week-02.md
guide_description: |
  Frequency tables and relative frequency tables for one categorical variable, proportions and percentages as
  summary statistics, the mode, and why a mean or median of categories means nothing; then bar charts
  (frequency and relative frequency), pie charts and when they are appropriate, and the ways a graph of
  categorical data can mislead (a vertical axis that does not start at zero, pictographs, percentages that do
  not add to 100%). Worked examples: a frequency and relative frequency table for how 160 students get to
  school, recovering counts and a missing relative frequency from 250 cafeteria lunches, a bar chart and pie
  chart of those lunches with the pie angles, and a truncated-axis bar chart that makes 52 look three times as
  big as 44.
flashcards_description: |
  30 cards on frequency and relative frequency tables, proportions, percentages and the mode for one
  categorical variable, bar charts, pie charts and their angles, choosing a display, and spotting misleading
  graphs of categorical data.

flashcards:
  - front: "Frequency table for one categorical variable → what it lists"
    back: |
      Each category and its count (frequency): the number of individuals in that category. The counts add to the total number of individuals, n.
    topic_code: "1.3"
  - front: "Relative frequency of a category → formula"
    back: |
      Count in the category ÷ total number of individuals. It is a proportion between 0 and 1; times 100 it is a percentage.
    topic_code: "1.3"
  - front: "Relative frequencies in one table → what they must add to"
    back: |
      1 (or 100%), apart from rounding, when every individual is in exactly one category.
    topic_code: "1.3"
  - front: "Summary statistics for one categorical variable → which ones exist"
    back: |
      Counts (frequencies), proportions or percentages (relative frequencies), and the mode. Means, medians and standard deviations do not apply to categories.
    topic_code: "1.3"
  - front: "Mode of a categorical variable → definition"
    back: |
      The category with the highest frequency (the most common category). A distribution can have two modes if two categories tie.
    topic_code: "1.3"
  - front: "160 students' way to school: 58 bus, 44 family car, 22 walk, 12 bike, 24 drive themselves → relative frequencies"
    back: |
      0.3625, 0.275, 0.1375, 0.075, 0.15. They add to 1. The mode is bus.
    topic_code: "1.3"
  - front: "Recovering a count from a relative frequency → method"
    back: |
      Count = relative frequency × total. For example, 34% of 250 lunches is 0.34 × 250 = 85 lunches.
    topic_code: "1.3"
  - front: "Missing relative frequency in a table → how to find it"
    back: |
      Subtract the sum of the others from 1. For 0.34, 0.24, 0.14 and 0.22, the missing category is 1 − 0.94 = 0.06.
    topic_code: "1.3"
  - front: "Why report relative frequencies, not just counts → reason"
    back: |
      Proportions put groups of different sizes on the same scale. 30 of 60 and 45 of 150 are very different (0.50 versus 0.30) even though 45 > 30.
    topic_code: "1.3"
  - front: "Stating a proportion in context → model sentence"
    back: |
      “About 36% (58 of 160) of the surveyed students usually take the bus to school.” Give the number, the group and the category.
    topic_code: "1.3"
  - front: "Bar chart → how it is built"
    back: |
      One bar per category, with gaps between bars; bar height shows the count or the relative frequency; all bars have the same width; the vertical axis starts at 0.
    topic_code: "1.4"
  - front: "Frequency bar chart versus relative frequency bar chart → what changes"
    back: |
      Only the vertical scale (counts or proportions). The bars have exactly the same relative heights, so the picture is identical.
    topic_code: "1.4"
  - front: "Order of categories in a bar chart → rule"
    back: |
      For unordered categories any order is allowed; sorting by frequency often helps. For ordered categories (small, medium, large) keep the natural order.
    topic_code: "1.4"
  - front: "Gaps between bars in a bar chart → why they are there"
    back: |
      The categories are separate groups with no number line between them. A histogram (week 3) has touching bars because its intervals cover a number line.
    topic_code: "1.4"
  - front: "Pie chart → when it is appropriate"
    back: |
      When the categories are parts of one whole: every individual is in exactly one category and the percentages add to 100%.
    topic_code: "1.4"
  - front: "Pie chart slice angle → formula"
    back: |
      Relative frequency × 360°. A category with relative frequency 0.34 gets 0.34 × 360° = 122.4°.
    topic_code: "1.4"
  - front: "Survey where students could pick more than one favourite → pie chart or bar chart?"
    back: |
      Bar chart. The percentages add to more than 100%, so they are not parts of one whole and cannot be slices of one pie.
    topic_code: "1.4"
  - front: "Bar chart versus pie chart → which is easier for comparing similar categories"
    back: |
      A bar chart: lengths on a common baseline are easier to compare by eye than angles or areas of slices.
    topic_code: "1.4"
  - front: "Truncated vertical axis on a bar chart → what goes wrong"
    back: |
      Starting the axis above 0 exaggerates differences. With an axis starting at 40, counts 52 and 44 draw bars of height 12 and 4, so 52 looks three times as big as 44 (the real ratio is about 1.18).
    topic_code: "1.4"
  - front: "Pictograph with scaled pictures → why it misleads"
    back: |
      Doubling a picture's height and width multiplies its area by 4, so a category with twice the count looks four times as big.
    topic_code: "1.4"
  - front: "Choosing a display for one categorical variable → the two standard choices"
    back: |
      A bar chart (always works) or a pie chart (only for parts of one whole). Histograms, dotplots, stemplots and boxplots are for quantitative variables.
    topic_code: "1.4"
  - front: "Describing a bar chart of one categorical variable → what to say"
    back: |
      Which category is most common (the mode) and least common, how the proportions compare, all in context with the numbers: “Bus is the most common way to school (36%), about two and a half times as common as walking (14%).”
    topic_code: "1.4"
  - front: "Relative frequency table → what it cannot tell you"
    back: |
      The number of individuals. 0.25 could be 1 of 4 or 250 of 1,000, so always report n alongside proportions.
    topic_code: "1.3"
  - front: "Percentages that add to 99% or 101% → when that is acceptable"
    back: |
      When each percentage was rounded; the unrounded relative frequencies add to exactly 100%.
    topic_code: "1.3"
  - front: "Categories with tiny counts → a common fix"
    back: |
      Combine them into an “Other” category, and say so, so the table and graph stay readable.
    topic_code: "1.3"
  - front: "250 cafeteria lunches: pizza 85, sandwich 60, salad bar 35, hot entrée 55, other 15 → mode and its proportion"
    back: |
      Pizza, with 85/250 = 0.34 (34%) of lunches.
    topic_code: "1.3"
  - front: "Error-spot → “The mean favourite colour is 2.6” after coding red = 1, blue = 2, green = 3"
    back: |
      The codes are labels. Their average depends on an arbitrary choice of codes and means nothing; report counts, proportions and the mode.
    topic_code: "1.3"
  - front: "Error-spot → a bar chart whose bars touch and whose width varies by category"
    back: |
      Bars in a bar chart have equal widths and gaps between them; only the heights carry information. Varying widths make wide bars look bigger.
    topic_code: "1.4"
  - front: "Error-spot → a pie chart of “sports students play” where the slices add to 140%"
    back: |
      Students can play several sports, so the categories overlap. Use a bar chart of the percentage of students who play each sport.
    topic_code: "1.4"
  - front: "Investigative question about one categorical variable → the summary that answers it"
    back: |
      A proportion (or the full set of relative frequencies) for the named population, with a bar chart. For “What proportion of students at our school walk to school?”, report the sample proportion who walk.
    topic_code: "1.3"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topics 1.3 and 1.4: frequency and relative frequency
    tables, proportions and the mode, bar charts and pie charts, and misleading graphs), with 7 questions (32%)
    reviewing week 1 (investigative questions and survey questions, categorical and quantitative variables).
    Opens with a shared-context set on one survey table. Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes. Calculators are allowed throughout AP
    Statistics.
  questions:
    # ---- Stimulus set: how 200 students most often listen to music (1.3, 1.4)
    - slug: apstats-u01-w02-q01
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Statistics CED, Topic 1.3"
      points: 1
      stimulus: |
        A random sample of 200 students at a large high school were asked, "How do you most often listen to music?" Each student gave exactly one answer.

        | Way of listening | Number of students |
        |---|---|
        | Streaming app | 124 |
        | Radio | 18 |
        | Video site | 46 |
        | Downloads or CDs | 12 |
        | Total | 200 |
      prompt: |
        What is the relative frequency of students who most often listen through a video site?
      options:
        - "46"
        - "0.46"
        - "0.23"
        - "0.37"
      option_explanations:
        - |
          46 is the frequency (count); a relative frequency divides the count by the total number of students.
        - |
          0.46 divides 46 by 100 instead of by the 200 students surveyed.
        - |
          Correct. Relative frequency = count ÷ total = 46/200 = 0.23, so 23% of the sampled students most often use a video site.
        - |
          0.37 is 46/124, which divides by the streaming count instead of by the total of 200.
      answer: 2
    - slug: apstats-u01-w02-q02
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Statistics CED, Topic 1.3"
      points: 1
      stimulus: |
        A random sample of 200 students at a large high school were asked, "How do you most often listen to music?" Each student gave exactly one answer.

        | Way of listening | Number of students |
        |---|---|
        | Streaming app | 124 |
        | Radio | 18 |
        | Video site | 46 |
        | Downloads or CDs | 12 |
        | Total | 200 |
      prompt: |
        Which statement correctly gives the mode of this distribution?
      options:
        - "The mode is streaming app, chosen by 62% of the sampled students."
        - "The mode is 124."
        - "The mode is downloads or CDs, the category with the lowest count."
        - "The mode is 50 students, the mean count per category."
      option_explanations:
        - |
          Correct. The mode of a categorical variable is the most common category: streaming app, with 124/200 = 0.62 of the students.
        - |
          124 is the frequency of the mode; the mode itself is a category, streaming app.
        - |
          The mode is the most frequent category, not the least frequent one.
        - |
          200/4 = 50 is an average count per category, a meaningless summary here; the mode is a category, not a number.
      answer: 0
    - slug: apstats-u01-w02-q03
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Statistics CED, Topic 1.4"
      points: 1
      stimulus: |
        A random sample of 200 students at a large high school were asked, "How do you most often listen to music?" Each student gave exactly one answer.

        | Way of listening | Number of students |
        |---|---|
        | Streaming app | 124 |
        | Radio | 18 |
        | Video site | 46 |
        | Downloads or CDs | 12 |
        | Total | 200 |
      prompt: |
        Which display is appropriate for these data?
      options:
        - "A histogram of the four counts"
        - "A bar chart with one bar for each way of listening"
        - "A dotplot of the four counts 124, 18, 46 and 12"
        - "A boxplot of the way each student listens"
      option_explanations:
        - |
          A histogram is for a quantitative variable split into intervals of a number line; way of listening is categorical.
        - |
          Correct. Way of listening is categorical, so a bar chart (one bar per category, height = count or proportion) displays its distribution.
        - |
          A dotplot of the four counts treats the counts as data values; the variable here is the category each student chose.
        - |
          A boxplot needs a quantitative variable with a median and quartiles; categories have neither.
      answer: 1
    - slug: apstats-u01-w02-q04
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Statistics CED, Topic 1.4"
      points: 1
      stimulus: |
        A random sample of 200 students at a large high school were asked, "How do you most often listen to music?" Each student gave exactly one answer.

        | Way of listening | Number of students |
        |---|---|
        | Streaming app | 124 |
        | Radio | 18 |
        | Video site | 46 |
        | Downloads or CDs | 12 |
        | Total | 200 |
      prompt: |
        A pie chart is made of these data. What is the angle of the slice for radio?
      options:
        - "18°"
        - "9°"
        - "64.8°"
        - "32.4°"
      option_explanations:
        - |
          18° uses the count as the angle; the angle is the relative frequency times 360°.
        - |
          9° uses the percentage (9%) as the angle instead of multiplying the proportion by 360°.
        - |
          64.8° is 18/100 × 360°, dividing by 100 instead of by the total of 200 students.
        - |
          Correct. Relative frequency 18/200 = 0.09, and 0.09 × 360° = 32.4°.
      answer: 3
    # ---- Independent items
    - slug: apstats-u01-w02-q05
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Statistics CED, Topic 1.3"
      points: 1
      prompt: |
        In a survey of 240 customers at a hypothetical bakery, 35% said their favourite item was a cinnamon roll. How many of the surveyed customers chose the cinnamon roll?
      options:
        - "35"
        - "84"
        - "69"
        - "156"
      option_explanations:
        - |
          35 is the percentage, not the count; the count is the proportion times the number of customers.
        - |
          Correct. Count = relative frequency × total = 0.35 × 240 = 84 customers.
        - |
          69 is roughly 240/3.5, dividing by the percentage instead of multiplying by the proportion.
        - |
          156 = 0.65 × 240 is the number who did not choose the cinnamon roll.
      answer: 1
    - slug: apstats-u01-w02-q06
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Statistics CED, Topic 1.4"
      points: 1
      prompt: |
        A school newsletter shows a bar chart of the number of students who signed up for two clubs: robotics (52) and drama (44). The vertical axis starts at 40, so the robotics bar looks three times as tall as the drama bar. By what factor does the robotics count actually exceed the drama count?
      options:
        - "3"
        - "8"
        - "About 1.18"
        - "About 0.85"
      option_explanations:
        - |
          3 is the ratio of the drawn bar heights (12 above 40 versus 4 above 40), which the truncated axis exaggerates.
        - |
          8 is the difference, 52 − 44, not the factor by which one count exceeds the other.
        - |
          Correct. 52/44 ≈ 1.18: robotics has about 18% more sign-ups. Starting the axis at 40 makes the difference look far larger.
        - |
          0.85 is 44/52, the drama count as a fraction of robotics, which is the ratio upside down.
      answer: 2
    - slug: apstats-u01-w02-q07
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Statistics CED, Topic 1.4"
      points: 1
      prompt: |
        A survey asked students to name every after-school activity they take part in. The results: sports 48%, music 31%, clubs 37%, part-time job 22%, none 15%. Why is a pie chart not appropriate for these results?
      options:
        - "Students could name more than one activity, so the percentages add to more than 100% and are not parts of one whole."
        - "A pie chart cannot show five categories."
        - "Pie charts can show only counts, not percentages."
        - "The categories are quantitative."
      option_explanations:
        - |
          Correct. The percentages add to 153%. Slices of a pie must be non-overlapping parts of one whole adding to 100%; a bar chart of the percentages is the right display.
        - |
          A pie chart can show any number of categories; the problem is that these categories overlap.
        - |
          A pie chart's slices are usually drawn from percentages (relative frequency × 360°), so percentages are not the problem.
        - |
          The activities are categories; the issue is that one student can be in several of them, not the variable type.
      answer: 0
    - slug: apstats-u01-w02-q08
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Statistics CED, Topic 1.3"
      points: 1
      prompt: |
        A relative frequency table for the type of phone plan held by customers of a hypothetical phone shop shows: prepaid 0.30, family plan 0.25, individual plan 0.15, and business plan with its value smudged. Every customer has exactly one plan type. What is the relative frequency of business plans?
      options:
        - "0.70"
        - "0.15"
        - "It cannot be found without the counts."
        - "0.30"
      option_explanations:
        - |
          0.70 is the sum of the three known relative frequencies; the missing one is what is left over from 1.
        - |
          0.15 repeats the individual-plan value; there is no reason the missing category matches it.
        - |
          The counts are not needed: relative frequencies of non-overlapping categories add to 1, so the missing value is 1 minus the rest.
        - |
          Correct. 0.30 + 0.25 + 0.15 = 0.70, so business plans have relative frequency 1 − 0.70 = 0.30.
      answer: 3
    - slug: apstats-u01-w02-q09
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Statistics CED, Topic 1.4"
      points: 1
      prompt: |
        A student makes two bar charts of the same categorical data: one with counts on the vertical axis and one with relative frequencies. How do the two charts compare?
      options:
        - "The relative frequency chart has shorter bars for the larger categories."
        - "The charts look different because relative frequencies add to 1."
        - "The bars have the same relative heights; only the numbers on the vertical axis differ."
        - "Only the relative frequency chart may start its axis at zero."
      option_explanations:
        - |
          Every count is divided by the same total, so every bar shrinks by the same factor and the larger categories stay larger.
        - |
          Dividing all counts by the same n rescales the axis but does not change the shape of the chart.
        - |
          Correct. Each relative frequency is count ÷ n with the same n, so the bars keep their proportions; only the axis labels change.
        - |
          Both kinds of bar chart should start their vertical axis at zero so that bar heights are honest.
      answer: 2
    - slug: apstats-u01-w02-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      prompt: |
        A track coach records, for each athlete, the event they compete in most (sprints, distance, jumps or throws) and their best time in the 400 m. Which statement correctly classifies these two variables?
      options:
        - "Both are quantitative, because the coach can count how many athletes are in each event."
        - "Main event is categorical; best 400 m time is quantitative and continuous."
        - "Main event is quantitative; best 400 m time is categorical."
        - "Both are categorical, because the 400 m is one event."
      option_explanations:
        - |
          Counting how many individuals fall in each category is how we summarise a categorical variable; it does not make the variable quantitative.
        - |
          Correct. Main event places each athlete into a group, and a time can take any value in an interval, so it is quantitative and continuous.
        - |
          The classification is reversed: events are groups, and times are measured numbers that can be averaged.
        - |
          The 400 m time is a measurement for each athlete that can be averaged, so that variable is quantitative.
      answer: 1
    - slug: apstats-u01-w02-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        "Is there an association between the number of hours students at our school work at part-time jobs each week and their hours of homework each week?" Which data would the investigator need?
      options:
        - "The proportion of students at our school who have a part-time job"
        - "Hours of homework from students with jobs and, separately, from students without jobs"
        - "Hours worked per week for every student, and homework hours for a different set of students"
        - "Hours worked per week and hours of homework per week, both recorded for each student in the study"
      option_explanations:
        - |
          A single proportion answers a summary question about one categorical variable, not an association between two quantitative variables.
        - |
          That design answers a comparison question about two groups and loses the number of hours worked.
        - |
          An association needs both values on the same individual so they can be paired; different students cannot be paired.
        - |
          Correct. An association question needs two variables measured on the same individuals, so each student provides a pair (hours worked, homework hours).
      answer: 3
    - slug: apstats-u01-w02-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        A student is investigating, "What proportion of students at our school have visited the school library this month?" Which is a survey question that collects the data for this investigation?
      options:
        - "Have you visited the school library at least once this month? (yes or no)"
        - "What proportion of students at our school have visited the library this month?"
        - "How many books does the school library own?"
        - "Do students who visit the library get higher grades than students who do not?"
      option_explanations:
        - |
          Correct. Each student answers with one value (yes or no) of the categorical variable, and the proportion of yes answers addresses the investigative question.
        - |
          This is the investigative question itself; no single student can answer it.
        - |
          This has one fixed answer from the library's records and collects nothing about students' visits.
        - |
          This is a different, comparison investigative question; it is not asked of one student and does not collect the needed variable.
      answer: 0
    - slug: apstats-u01-w02-q13
      type: multi_select
      topic_code: "1.4"
      source: "AP Statistics CED, Topic 1.4"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about bar charts of one categorical variable are true? Select all that apply.
      options:
        - "The bars are separated by gaps because the categories are separate groups."
        - "The width of each bar should be proportional to the category's count."
        - "The vertical axis should start at zero."
        - "For unordered categories, the bars may be arranged in any order, such as from most to least frequent."
        - "A bar chart can be used only when the percentages add to exactly 100%."
      option_explanations:
        - |
          Correct. The categories are not points on a number line, so the bars do not touch (unlike a histogram).
        - |
          All bars have the same width; only height carries information. Varying the widths distorts the visual comparison.
        - |
          Correct. Bar heights are compared by eye, so a truncated axis exaggerates differences.
        - |
          Correct. Unordered categories have no natural order; sorting by frequency often makes the chart easier to read.
        - |
          That restriction applies to pie charts. A bar chart can show overlapping categories whose percentages add to more than 100%.
      answer: [0, 2, 3]
    - slug: apstats-u01-w02-q14
      type: multi_select
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 2
      partial_credit: true
      prompt: |
        A hypothetical food truck records the variables below for each order. Which are quantitative? Select all that apply.
      options:
        - "Total price of the order in dollars"
        - "Payment method (cash, card or phone)"
        - "Number of items in the order"
        - "Order ticket number"
        - "Time in minutes from ordering to pickup"
      option_explanations:
        - |
          Correct. Price is a numerical amount that can be averaged (continuous for practical purposes).
        - |
          Payment method places each order into one of three groups, so it is categorical.
        - |
          Correct. Number of items is a count, so it is quantitative and discrete.
        - |
          Ticket numbers label orders; their average means nothing, so the variable is categorical.
        - |
          Correct. Waiting time is a measurement that can take any value in an interval: quantitative and continuous.
      answer: [0, 2, 4]
    - slug: apstats-u01-w02-q15
      type: true_false
      topic_code: "1.3"
      source: "AP Statistics CED, Topic 1.3"
      points: 1
      prompt: |
        True or false: After coding the colours of cars in a parking lot as 1 = white, 2 = black, 3 = silver and 4 = red, the mean of the codes is a useful summary of car colour.
      answer: false
      explanation: |
        False. The codes are arbitrary labels; recoding the colours in a different order would change the "mean" completely. Car colour is categorical, so summarise it with counts, proportions and the mode.
    - slug: apstats-u01-w02-q16
      type: true_false
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        True or false: "How many minutes is the drive from our school to the state capital at the speed limit?" is a statistical investigative question.
      answer: false
      explanation: |
        False. It asks for one fixed value (a distance divided by a speed), so it anticipates no variability across individuals and needs no data analysis. A statistical question would be about something that varies, such as the drive times of many trips.
    - slug: apstats-u01-w02-q17
      type: fill_blank
      topic_code: "1.3"
      source: "AP Statistics CED, Topic 1.3"
      points: 1
      prompt: |
        For a categorical variable, the category with the highest frequency is called the ____.
      answer: ["mode", "the mode"]
      explanation: |
        The mode is the most common category. It is the one measure of "typical" that makes sense for categorical data.
    - slug: apstats-u01-w02-q18
      type: fill_blank
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        "Did you eat breakfast this morning?" is a survey question asked of each student, while "What proportion of students at our school eat breakfast on school days?" is a statistical ____ question (one word).
      answer: ["investigative"]
      explanation: |
        The second question is a statistical investigative question: it is about a group, anticipates variability, and is answered by summarising many students' answers to the survey question.
    - slug: apstats-u01-w02-q19
      type: numeric
      topic_code: "1.3"
      source: "AP Statistics CED, Topic 1.3"
      points: 1
      prompt: |
        At a hypothetical animal shelter, 64 of the 180 animals adopted last year were cats. What proportion of the adopted animals were cats? Give your answer to three decimal places.
      answer: { value: 0.356, tolerance: 0.0006 }
      explanation: |
        Relative frequency = 64/180 = 0.3556, or 0.356 to three decimal places: about 35.6% of the adopted animals were cats.
    - slug: apstats-u01-w02-q20
      type: short_answer
      topic_code: "1.4"
      source: "AP Statistics CED, Topic 1.4"
      points: 3
      prompt: |
        A hypothetical smoothie shop's poster shows its sales last month: 300 berry smoothies and 150 mango smoothies. Each is drawn as a cup. The berry cup is twice as tall and twice as wide as the mango cup.

        (a) How many times as many berry smoothies as mango smoothies were sold?
        (b) How many times as large does the berry cup look, by area? Explain.
        (c) Describe a display that shows these sales honestly.
      answer: |
        (a) 300/150 = 2 times as many.
        (b) About 4 times as large: doubling both the height and the width multiplies the area by 2 × 2 = 4, so the picture exaggerates the difference.
        (c) A bar chart with one bar for each flavour, equal bar widths, and a vertical axis that starts at 0 (heights 300 and 150), or two cups of the same size with only the height (or the number of cup icons) proportional to sales.
      explanation: |
        Three points, one per part. (a) the ratio 2. (b) the area factor 4 with the reason (both dimensions doubled). (c) a display in which only one dimension encodes the count, starting from zero: a bar chart with equal widths, or repeated icons of equal size.
    - slug: apstats-u01-w02-q21
      type: short_answer
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 3
      prompt: |
        A student asks, "What is the most popular way for students at our school to get to school, and what proportion of students use it?"

        (a) Identify the population and the variable in this investigative question, and classify the variable.
        (b) Write a survey question that would collect the data.
        (c) Name one numerical summary and one graph the student should use to answer the question, and say why they fit this variable.
      answer: |
        (a) Population: all students at our school. Variable: usual way of getting to school; categorical.
        (b) "How do you usually get to school? (bus, driven by family, drive yourself, walk, bike, other)"
        (c) The mode with its relative frequency (or a relative frequency table), and a bar chart (a pie chart also works, because each student gives one answer). Both suit a categorical variable: the question asks for the most common category and its proportion.
      explanation: |
        Three points, one per part. (a) population and variable named, variable classified as categorical. (b) a question one student can answer with one category. (c) a categorical summary (mode, proportion or relative frequency table) and a categorical graph (bar chart or pie chart) with a reason tied to the variable type or the question; a mean, histogram or boxplot earns nothing for (c).
    - slug: apstats-u01-w02-q22
      type: long_answer
      topic_code: "1.3"
      source: "AP Statistics CED, Topic 1.3"
      points: 6
      prompt: |
        A random sample of 160 students at a large high school were asked how they usually get to school. Each student gave one answer.

        | Way to school | Bus | Family car | Walk | Bike | Drive themselves |
        |---|---|---|---|---|---|
        | Count | 58 | 44 | 22 | 12 | 24 |

        (A) Make a relative frequency table for these data, giving each relative frequency to four decimal places.

        (B) What proportion of the sampled students get to school some way other than by bus or family car?

        (C) Describe how to draw a bar chart of these data, and describe the distribution in context.

        (D) Is a pie chart also an appropriate display? Explain, and give the angle of the slice for walking.

        (E) A parent says, "More students drive themselves than bike, so driving is about twice as popular as biking." Use the data to check the claim.
      answer: |
        (A) Bus 58/160 = 0.3625; family car 44/160 = 0.2750; walk 22/160 = 0.1375; bike 12/160 = 0.0750; drive themselves 24/160 = 0.1500. They add to 1.
        (B) Walk, bike or drive themselves: (22 + 12 + 24)/160 = 58/160 = 0.3625 (equivalently 1 − 0.3625 − 0.2750).
        (C) Put the five ways on the horizontal axis with equal-width, separated bars, and the count (or relative frequency) on a vertical axis starting at 0, with bar heights 58, 44, 22, 12, 24. The bus is the most common way to school (about 36% of the sampled students), followed by family car (27.5%); biking is the least common (7.5%). About 64% arrive by bus or family car.
        (D) Yes: each student gave exactly one answer, so the categories are non-overlapping parts of one whole and the relative frequencies add to 1. Walking: 0.1375 × 360° = 49.5°.
        (E) The claim is correct about the order, and the ratio checks out: 24/12 = 2, so twice as many sampled students drive themselves as bike (15% versus 7.5%).
      explanation: |
        Six points. (A) 1 point: all five relative frequencies correct (count ÷ 160). (B) 1 point: 0.3625 (or 36.25%). (C) 2 points: 1 for a correct construction (categories on one axis, equal widths with gaps, heights from counts or proportions, axis from 0); 1 for a description in context that names the most common category with its proportion and compares at least one other category with numbers. A description with no numbers or no context earns 0 for that point. (D) 1 point: "yes" with the reason that categories are non-overlapping and add to 100%, and the angle 49.5°. (E) 1 point: checks with counts or proportions (24 versus 12, ratio 2) and concludes the claim holds for this sample.
