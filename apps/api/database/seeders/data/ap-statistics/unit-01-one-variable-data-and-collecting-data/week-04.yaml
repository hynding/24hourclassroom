    - slug: apstats-u01-w04-q17
      type: true_false
      topic_code: "1.7"
      source: "AP Statistics CED, Topic 1.7"
      points: 1
      prompt: |
        True or false: Changing the largest value in a data set from 85 to 850 changes the median of the data set.
      answer: false
      explanation: |
        False (as long as the data set has more than two values). The median depends only on the middle value or values of the ordered list. Making the largest value larger keeps it the largest, so the middle does not move; the median is resistant. The mean, standard deviation and range would all change.
    - slug: apstats-u01-w04-q18
      type: true_false
      topic_code: "1.6"
      source: "AP Statistics CED, Topic 1.6"
      points: 1
      prompt: |
        True or false: A histogram with a tall peak at the left and a long, low tail stretching to the right is skewed left.
      answer: false
      explanation: |
        False. Skew is named for the long tail. A tail stretching to the right means the distribution is skewed right.
