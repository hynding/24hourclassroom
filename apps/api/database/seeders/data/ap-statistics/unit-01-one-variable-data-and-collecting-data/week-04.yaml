      answer: { value: 3.92, tolerance: 0.006 }
      explanation: |
        Mean = 32/4 = 8. Deviations: −4, −2, 1, 5. Squares: 16, 4, 1, 25, sum 46. Divide by n − 1 = 3: 15.33. s = √15.33 ≈ 3.92 minutes.
    - slug: apstats-u01-w04-q22
      type: numeric
      topic_code: "1.7"
      source: "AP Statistics CED, Topic 1.7"
      points: 1
      prompt: |
        A survey of 50 households recorded the number of pets in each household.

        | Number of pets | 0 | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|---|
        | Households | 14 | 18 | 10 | 5 | 2 | 1 |

        Find the mean number of pets per household, to two decimal places.
      answer: { value: 1.32, tolerance: 0.005 }
      explanation: |
        Total pets = 0(14) + 1(18) + 2(10) + 3(5) + 4(2) + 5(1) = 0 + 18 + 20 + 15 + 8 + 5 = 66. Mean = 66/50 = 1.32 pets per household.
    - slug: apstats-u01-w04-q23
      type: short_answer
      topic_code: "1.8"
      source: "AP Statistics CED, Topic 1.8"
      points: 3
      prompt: |
        A random sample of 40 students at a large high school reported their one-way commute times. The five-number summary is: minimum 4, Q1 12, median 18, Q3 28, maximum 65 minutes. The two longest commutes are 47 and 65 minutes.

        (a) Use the 1.5 × IQR rule to determine whether there are any outliers. Show your work.
        (b) Describe how the boxplot should be drawn, including where each whisker ends.
        (c) What does the boxplot suggest about the shape of the distribution? Explain.
      answer: |
        (a) IQR = 28 − 12 = 16 minutes; 1.5 × 16 = 24. Lower fence 12 − 24 = −12; upper fence 28 + 24 = 52. The 65-minute commute is above 52, so it is an outlier; 47 is not. No value is below −12.
        (b) A box from 12 to 28 minutes with a line at 18; the left whisker from 12 down to 4; the right whisker from 28 up to 47 (the longest commute that is not an outlier); the 65-minute commute as a separate point; a scale labelled in minutes.
        (c) Skewed right: the right whisker (28 to 47) is much longer than the left (4 to 12), the median is closer to Q1 than to Q3, and there is a high outlier.
      explanation: |
        Three points, one per part. (a) IQR 16, the fence 52 (and −12), and the conclusion that 65 is an outlier. (b) the box and median correct and the right whisker ending at 47 (not at 52 or 65), with the outlier plotted separately. (c) "skewed right" supported by at least one feature of the boxplot.
    - slug: apstats-u01-w04-q24
      type: short_answer
      topic_code: "1.6"
      source: "AP Statistics CED, Topic 1.6"
      points: 4
      prompt: |
        The stemplot shows the lengths, in centimetres, of 18 trout caught and released in a hypothetical stream survey.

        ```
        2 | 3
        2 |
        3 | 1 2 4
        3 | 5 6 6 7 8 9
        4 | 0 0 1 2 3
        4 | 5 7
        5 | 1
        Key: 3 | 6 = 36 cm
        ```

        Describe the distribution of trout lengths.
      answer: |
        Shape: roughly symmetric and unimodal, apart from one short fish (23 cm), with a peak in the upper 30s.
        Centre: the median is the average of the 9th and 10th lengths, (38 + 39)/2 = 38.5 cm.
        Variability: lengths range from 23 to 51 cm (range 28 cm); all but one are between 31 and 51 cm.
        Unusual features: a gap between 23 and 31 cm, so the 23 cm trout is a possible low outlier.
      explanation: |
        Four points, one per feature, each in context (trout lengths, cm). Shape: roughly symmetric or slightly skewed left (because of the 23 cm fish); either earns the point. Centre: median 38.5 cm (accept 38 to 39 cm, or the mean, about 38.3 cm). Variability: the range 28 cm or the interval 23 to 51 cm. Unusual features: the 23 cm fish as a possible outlier or the gap from 23 to 31 cm.
    - slug: apstats-u01-w04-q25
      type: long_answer
      topic_code: "1.8"
      source: "AP Statistics CED, Topic 1.8"
      points: 6
      prompt: |
        A random sample of 16 students at a large high school who have part-time jobs reported how many hours they worked last week. The ordered data are:

        6, 8, 9, 10, 10, 12, 12, 14, 15, 15, 16, 18, 20, 22, 25, 38

        A calculator gives a mean of 15.625 hours and a standard deviation of 7.92 hours.

        (A) Find the five-number summary.

        (B) Use the 1.5 × IQR rule to identify any outliers. Show your work.

        (C) Describe a boxplot of these data, including where each whisker ends.

        (D) Compare the mean and the median, and explain what the comparison suggests about the shape.

        (E) A student council report wants a single number for the typical number of hours worked. Should it use the mean or the median? Explain, and interpret your chosen value in context.
      answer: |
        (A) Minimum 6; Q1 = (10 + 10)/2 = 10 (median of the first 8 values); median = (14 + 15)/2 = 14.5 (average of the 8th and 9th values); Q3 = (18 + 20)/2 = 19 (median of the last 8 values); maximum 38 hours.
        (B) IQR = 19 − 10 = 9; 1.5 × 9 = 13.5. Fences: 10 − 13.5 = −3.5 and 19 + 13.5 = 32.5. The value 38 > 32.5 is an outlier; no value is below −3.5.
        (C) A box from 10 to 19 hours with a line at 14.5; the left whisker from 10 down to 6; the right whisker from 19 up to 25 (the largest value that is not an outlier); 38 plotted as a separate point; a scale in hours.
        (D) The mean (15.6 hours) is greater than the median (14.5 hours). The high outlier and the longer right side pull the mean up, which suggests the distribution is skewed right.
        (E) The median, 14.5 hours, because it is resistant to the 38-hour outlier and the right skew, which inflate the mean. Interpretation: half of the sampled working students worked 14.5 hours or less last week, and half worked 14.5 hours or more.
      explanation: |
        Six points. (A) 1 point: all five values correct (6, 10, 14.5, 19, 38). (B) 2 points: 1 for the IQR and a correct upper fence of 32.5 (lower fence optional unless a low value is claimed as an outlier); 1 for identifying 38 as the only outlier, with the comparison 38 > 32.5. (C) 1 point: box and median correct, right whisker ending at 25 (not 32.5 or 38), outlier plotted separately. (D) 1 point: mean > median with the conclusion "skewed right" (or "pulled up by the high outlier"). (E) 1 point: chooses the median with the resistance reason and interprets 14.5 hours in context (half at or below). Choosing the mean earns 0 for (E).
