week: 1
unit: 1
title: Investigative Questions and Variables
topics: ["1.1", "1.2"]
guide: guides/week-01.md
guide_description: |
  What statistics is for (learning from data that vary), the four-step investigative process that matches the
  course's four practices, how a statistical investigative question differs from a survey question, the three
  kinds of investigative question (summary, comparison, association) and the parts a good one names
  (population, variable or variables, what is being described), and how the question decides what data to
  collect and how to analyse them. Then individuals and variables in a data table, categorical versus
  quantitative variables, discrete versus continuous, and numbers that are only labels. Worked examples:
  sorting six questions about student sleep into survey and investigative questions, refining "Are phones bad
  for students?" into an investigative question, classifying the seven columns of a class data table, and
  deciding how a hypothetical gym should record members' workout length.
flashcards_description: |
  31 cards on statistical investigative questions and survey questions, the parts of a good investigative
  question, summary, comparison and association questions, individuals and variables, categorical and
  quantitative variables, discrete and continuous variables, and numbers that are labels.

flashcards:
  - front: "Statistics as a subject → what it studies, in one sentence"
    back: |
      How to collect, organise, analyse and interpret data so that we can learn from them even though individuals vary.
    topic_code: "1.1"
  - front: "Variability in a statistics investigation → why it is the reason statistics exists"
    back: |
      If every individual gave the same value, one measurement would answer the question. Because values differ from person to person (and sample to sample), we need methods that describe and reason about that variation.
    topic_code: "1.1"
  - front: "The four-step investigative process → the steps in order"
    back: |
      Formulate a question, collect data, analyse the data, interpret the results in context. They match the course's four practices.
    topic_code: "1.1"
  - front: "Statistical investigative question → definition"
    back: |
      A question about a group that anticipates variability and is answered by collecting and analysing data from many individuals, such as “How many hours do juniors at our school typically sleep on school nights?”
    topic_code: "1.1"
  - front: "Survey question (data-collection question) → definition"
    back: |
      A question asked of each individual to collect one piece of data, such as “How many hours did you sleep last night?” Each person's answer is one value of a variable.
    topic_code: "1.1"
  - front: "Survey question versus investigative question → how to tell them apart"
    back: |
      A survey question is answered by one person with one value. An investigative question is about a whole group, expects the answers to vary, and is answered by summarising many values.
    topic_code: "1.1"
  - front: "Good investigative question → the three things it names"
    back: |
      The population (the group of interest), the variable or variables to measure, and what is being described: a typical value or proportion, a comparison, or an association.
    topic_code: "1.1"
  - front: "Summary (descriptive) investigative question → example from school life"
    back: |
      “What proportion of seniors at our school have a driver's licence?” One group, one variable, describe it.
    topic_code: "1.1"
  - front: "Comparison investigative question → example from school life"
    back: |
      “Do ninth graders at our school spend more time on homework per night than twelfth graders?” Two or more groups, one variable, compare them.
    topic_code: "1.1"
  - front: "Association investigative question → example from school life"
    back: |
      “Is there a relationship between weekly hours of part-time work and GPA among juniors at our school?” One group, two variables measured on the same individuals.
    topic_code: "1.1"
  - front: "Not a statistical question → “How many students are enrolled at our school this year?”"
    back: |
      It has one fixed answer (a single count from the office), so it anticipates no variability. Make it statistical by asking about something that varies across students.
    topic_code: "1.1"
  - front: "Investigative question → how it drives data collection"
    back: |
      Its population says whom to collect data from; its variables say what to measure on each individual; its type (summary, comparison, association) says whether you need groups or pairs of measurements on the same individuals.
    topic_code: "1.1"
  - front: "Investigative question → how it drives the analysis"
    back: |
      A summary question calls for one graph and summary; a comparison question for side-by-side displays of the groups; an association question for a display of two variables together.
    topic_code: "1.1"
  - front: "Population in an investigative question → definition"
    back: |
      The entire group of individuals the question is about, such as “all students at our school” or “all ninth graders in the district”.
    topic_code: "1.1"
  - front: "Sample in an investigation → definition"
    back: |
      The part of the population from which data are actually collected. Units 1 (topics 1.10–1.13) and 3 study how to choose one well.
    topic_code: "1.1"
  - front: "Refining “Are phones bad for students?” → one acceptable investigative question"
    back: |
      “Do students at our school who report more than 4 hours of daily recreational phone use typically get less sleep on school nights than students who report 4 hours or fewer?” It names the population, both variables and the comparison.
    topic_code: "1.1"
  - front: "Individuals (cases) in a data set → definition"
    back: |
      The objects described by the data: people, animals, plants, schools, days, purchases. Each individual is one row of a data table.
    topic_code: "1.2"
  - front: "Variable in a data set → definition"
    back: |
      A characteristic recorded for each individual that can take different values. Each variable is one column of a data table.
    topic_code: "1.2"
  - front: "Categorical variable → definition and two examples"
    back: |
      Places each individual into one of several groups or categories. Examples: favourite sport; whether a student has a part-time job (yes or no).
    topic_code: "1.2"
  - front: "Quantitative variable → definition and two examples"
    back: |
      Takes numerical values for which arithmetic (such as an average) makes sense. Examples: hours of sleep last night; commute time in minutes.
    topic_code: "1.2"
  - front: "Quick test for quantitative → the question to ask"
    back: |
      Does it make sense to average the values, or to say one value is so many units more than another? If yes, quantitative. If the numbers are only labels, categorical.
    topic_code: "1.2"
  - front: "ZIP code, jersey number, phone number → variable type"
    back: |
      Categorical. They are recorded as numbers, but they are labels: the average ZIP code of a class means nothing.
    topic_code: "1.2"
  - front: "Discrete quantitative variable → definition and example"
    back: |
      Takes a countable set of values with gaps between them, usually counts: number of siblings, goals scored in a game, texts sent yesterday.
    topic_code: "1.2"
  - front: "Continuous quantitative variable → definition and example"
    back: |
      Can take any value in an interval, limited only by the measuring tool: height, time to run a mile, mass of an apple, hours of sleep.
    topic_code: "1.2"
  - front: "Exercise recorded as 0–2, 3–5, or 6 or more hours → variable type as recorded"
    back: |
      Categorical (ordered categories). The underlying amount of exercise is quantitative, but once grouped into ranges you can count categories, not average values.
    topic_code: "1.2"
  - front: "Data table layout → what rows and columns hold"
    back: |
      Rows are individuals (one per person, plant, day ...); columns are variables. Each cell is one individual's value of one variable.
    topic_code: "1.2"
  - front: "Satisfaction rated “unsatisfied / neutral / satisfied” → variable type"
    back: |
      Categorical. The categories have a natural order, but they are not numbers you can average.
    topic_code: "1.2"
  - front: "Variable type → why it matters for the rest of the course"
    back: |
      It decides the graphs and summaries you may use: bar charts and proportions for categorical variables (week 2); dotplots, histograms, means and standard deviations for quantitative ones (weeks 3 and 4).
    topic_code: "1.2"
  - front: "Error-spot → “Jersey number is quantitative because it is a number.”"
    back: |
      Being written as a number is not enough. Jersey numbers label players; averaging them is meaningless, so the variable is categorical.
    topic_code: "1.2"
  - front: "Error-spot → “How much sleep did you get last night?” offered as an investigative question"
    back: |
      That is a survey question: one person answers with one value. The investigative question is about the group, such as “How much sleep do students at our school typically get on a school night?”
    topic_code: "1.1"
  - front: "Error-spot → an investigative question that names no population"
    back: |
      “Do teenagers sleep enough?” leaves unclear whose data to collect. Name the group (for example, “students at our school this semester”) and the variable (“hours of sleep on school nights”).
    topic_code: "1.1"

quiz:
  description: |
    22 questions · about 40 minutes · on this week's topics (1.1 and 1.2: statistical investigative questions and
    survey questions, the parts and kinds of investigative question, individuals and variables, categorical and
    quantitative variables, discrete and continuous variables). This is the first week, so there is no review of
    earlier weeks. Opens with a shared-context set on one class data table. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes. Calculators are
    allowed throughout AP Statistics, though this quiz needs none.
  questions:
    # ---- Stimulus set: one class data table (1.2)
    - slug: apstats-u01-w01-q01
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      stimulus: |
        A statistics class recorded six variables for each student in the class. The first four rows of the data table are shown.

        | Student | Sleep last night (hours) | Siblings | Favourite sport | Home ZIP code | Commute (minutes) | Part-time job |
        |---|---|---|---|---|---|---|
        | Ava | 7.5 | 2 | Soccer | 00211 | 12 | Yes |
        | Ben | 6.0 | 0 | Basketball | 00205 | 25 | No |
        | Chloe | 8.25 | 1 | None | 00211 | 8 | No |
        | Dev | 5.5 | 3 | Track | 00217 | 31 | Yes |
      prompt: |
        How many of the six variables (not counting the student's name) are categorical?
      options:
        - "2"
        - "3"
        - "4"
        - "1"
      option_explanations:
        - |
          Two counts only favourite sport and part-time job, and misses that home ZIP code is also a label, so it is categorical too.
        - |
          Correct. Favourite sport, home ZIP code and part-time job place students into groups. Sleep, siblings and commute are quantitative.
        - |
          Four would add a quantitative variable such as siblings; a count of siblings can be averaged, so it is quantitative.
        - |
          One counts only the yes/no variable; favourite sport and ZIP code also place each student into a category.
      answer: 1
    - slug: apstats-u01-w01-q02
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      stimulus: |
        A statistics class recorded six variables for each student in the class. The first four rows of the data table are shown.

        | Student | Sleep last night (hours) | Siblings | Favourite sport | Home ZIP code | Commute (minutes) | Part-time job |
        |---|---|---|---|---|---|---|
        | Ava | 7.5 | 2 | Soccer | 00211 | 12 | Yes |
        | Ben | 6.0 | 0 | Basketball | 00205 | 25 | No |
        | Chloe | 8.25 | 1 | None | 00211 | 8 | No |
        | Dev | 5.5 | 3 | Track | 00217 | 31 | Yes |
      prompt: |
        Which variable is quantitative and discrete?
      options:
        - "Sleep last night (hours)"
        - "Home ZIP code"
        - "Siblings"
        - "Commute (minutes)"
      option_explanations:
        - |
          Sleep is quantitative but continuous: it can take any value in an interval (7.5, 8.25, ...), limited only by how precisely it is measured.
        - |
          ZIP codes are numbers used as labels; averaging them is meaningless, so the variable is categorical, not quantitative.
        - |
          Correct. Number of siblings is a count (0, 1, 2, ...) with gaps between possible values, so it is quantitative and discrete.
        - |
          Commute time is quantitative but continuous; it is recorded to the nearest minute, but time itself can take any value.
      answer: 2
    - slug: apstats-u01-w01-q03
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      stimulus: |
        A statistics class recorded six variables for each student in the class. The first four rows of the data table are shown.

        | Student | Sleep last night (hours) | Siblings | Favourite sport | Home ZIP code | Commute (minutes) | Part-time job |
        |---|---|---|---|---|---|---|
        | Ava | 7.5 | 2 | Soccer | 00211 | 12 | Yes |
        | Ben | 6.0 | 0 | Basketball | 00205 | 25 | No |
        | Chloe | 8.25 | 1 | None | 00211 | 8 | No |
        | Dev | 5.5 | 3 | Track | 00217 | 31 | Yes |
      prompt: |
        What are the individuals in this data set?
      options:
        - "The students in the class"
        - "The six variables in the column headings"
        - "All students at the school"
        - "The numbers and words in the cells of the table"
      option_explanations:
        - |
          Correct. Each row describes one student in the class, so the students in the class are the individuals (cases).
        - |
          The column headings are the variables, the characteristics recorded about each individual, not the individuals themselves.
        - |
          The data describe only this class. Calling the whole school the individuals confuses the students measured with a larger population.
        - |
          The cell entries are the values of the variables; the individuals are the objects those values describe.
      answer: 0
    # ---- Independent items
    - slug: apstats-u01-w01-q04
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        Which of these is a statistical investigative question?
      options:
        - "How many minutes did you spend on homework last night?"
        - "How many minutes is the lunch period at our school?"
        - "What is your favourite subject?"
        - "How many minutes do students at our school typically spend on homework on a weeknight, and how much does that vary?"
      option_explanations:
        - |
          This is a survey question: one student answers it with one value. It collects data rather than asking about the group.
        - |
          The lunch period has one fixed length set by the school, so the question anticipates no variability and needs no data analysis.
        - |
          This is a survey question asked of an individual; each answer is one value of the categorical variable favourite subject.
        - |
          Correct. It is about a group (students at our school), names a variable (weeknight homework minutes), and expects the values to vary.
      answer: 3
    - slug: apstats-u01-w01-q05
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        A student wants to investigate how much water students at her school drink during the school day. Which is a survey question she could ask each student to collect the data?
      options:
        - "About how many bottles of water (500 mL each) did you drink during school today?"
        - "What is the typical amount of water students at our school drink during a school day?"
        - "Do students at our school drink more water on days with PE than on days without?"
        - "Is there an association between water intake and hours of sport among students at our school?"
      option_explanations:
        - |
          Correct. One student answers it with one value, giving one data point for the variable bottles of water drunk at school today.
        - |
          This is the investigative question itself: it is about the whole group and is answered by summarising many students' answers.
        - |
          This is a comparison investigative question about groups of days; a single student cannot answer it with one value.
        - |
          This is an association investigative question about two variables across the group, not a question an individual answers.
      answer: 0
    - slug: apstats-u01-w01-q06
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        "Do students at our school who play a varsity sport typically sleep more on school nights than students who do not play a varsity sport?" What kind of statistical investigative question is this?
      options:
        - "A summary question about one group and one variable"
        - "An association question about two quantitative variables"
        - "A comparison question about one variable in two groups"
        - "A survey question asked of each student"
      option_explanations:
        - |
          The question splits students into two groups (varsity and not) and asks how they differ, so it is more than a summary of one group.
        - |
          Varsity status is categorical and is used to form groups; an association question relates two variables measured on the same individuals, typically both quantitative.
        - |
          Correct. It compares the variable hours of sleep on school nights between two groups: varsity athletes and other students.
        - |
          It is about the whole student body and needs many students' data; a survey question would be “How many hours did you sleep last night?”
      answer: 2
    - slug: apstats-u01-w01-q07
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        Which question is NOT a statistical question, because it does not anticipate variability in data?
      options:
        - "What proportion of students at our school walk to school?"
        - "How long do batteries of one brand typically last in a game controller?"
        - "How do the heights of the tomato plants in our greenhouse vary?"
        - "How many players are on the field for one soccer team during play?"
      option_explanations:
        - |
          Students differ in how they get to school, so answering requires collecting data from many students and summarising it.
        - |
          Battery lifetimes vary from battery to battery, so the question anticipates variability and is statistical.
        - |
          The question asks about variation directly: plant heights differ, and describing that variation is a statistical task.
        - |
          Correct. The rules fix the answer at 11, so there is nothing that varies to collect or summarise.
      answer: 3
    - slug: apstats-u01-w01-q08
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      prompt: |
        A student computes the mean of the home ZIP codes of everyone in her class and gets 210.6. What is wrong with this summary?
      options:
        - "She should have used the median, because ZIP codes are skewed."
        - "ZIP code is a categorical variable, so a mean of its values has no meaning."
        - "She should round the mean to a whole number, 00211."
        - "Nothing; ZIP codes are numbers, so their mean is a valid summary."
      option_explanations:
        - |
          Swapping the mean for the median does not help: any numerical summary of labels is meaningless, whatever the shape.
        - |
          Correct. ZIP codes are labels for areas, so the variable is categorical. Summarise it with counts or proportions in each ZIP code.
        - |
          Rounding treats the number as a meaningful amount; a ZIP code of 00211 for the average is still meaningless.
        - |
          Being written as numbers does not make a variable quantitative; the question to ask is whether arithmetic on the values makes sense.
      answer: 1
    - slug: apstats-u01-w01-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      prompt: |
        A health survey asks students how much they exercised last week and records each answer as one of "0–2 hours", "3–5 hours" or "6 or more hours". As recorded, what type of variable is this?
      options:
        - "Categorical, with ordered categories"
        - "Quantitative and continuous, because time is continuous"
        - "Quantitative and discrete, because there are three possible values"
        - "It cannot be classified until the data are collected."
      option_explanations:
        - |
          Correct. Each student is placed into one of three ranges. The ranges have a natural order, but we can only count them, not average them.
        - |
          The underlying amount of exercise is continuous, but the survey records only a range, so the recorded variable is categorical.
        - |
          Having few possible values does not make a variable quantitative; the values are ranges (labels), not numbers that can be averaged.
        - |
          The type depends on how the variable is defined and recorded, which the survey design already settles before any data arrive.
      answer: 0
    - slug: apstats-u01-w01-q10
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        "What is the typical weekly allowance of ninth graders in our school district?" What population does this investigative question name?
      options:
        - "The ninth graders who answer the survey"
        - "Every student in the school district"
        - "The weekly allowance of each student"
        - "All ninth graders in the school district"
      option_explanations:
        - |
          The students who answer are a sample (the part of the population from which data are collected), not the whole group the question is about.
        - |
          The question restricts the group to ninth graders; including every grade widens the population beyond what is asked.
        - |
          Weekly allowance is the variable being measured, not the group of individuals the question is about.
        - |
          Correct. The question asks about all ninth graders in the district, so that whole group is the population.
      answer: 3
    - slug: apstats-u01-w01-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        "Is there an association between daily recreational phone use and hours of sleep among juniors at our school?" What data does this question require?
      options:
        - "Phone use from one group of juniors and sleep from a different group of juniors"
        - "Hours of sleep for juniors who own a phone and for juniors who do not"
        - "Both daily recreational phone use and hours of sleep, recorded for each junior in the study"
        - "Daily recreational phone use for every student at the school"
      option_explanations:
        - |
          An association needs both variables on the same individuals; measuring them on different students gives no way to pair them up.
        - |
          This turns the question into a comparison of two groups and ignores the amount of phone use, one of the two variables named.
        - |
          Correct. An association question needs two variables measured on the same individuals, so each junior contributes a pair of values.
        - |
          The population is juniors, not every student, and the question also needs hours of sleep, not just phone use.
      answer: 2
    - slug: apstats-u01-w01-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      prompt: |
        For each runner on a cross-country team, a coach records four variables. Which one is quantitative and continuous?
      options:
        - "The runner's grade level group (underclass or upperclass)"
        - "The runner's time to finish a 5 km race"
        - "The number of races the runner has finished this season"
        - "Whether the runner set a personal best this season"
      option_explanations:
        - |
          Underclass and upperclass are two groups, so this variable is categorical, not quantitative.
        - |
          Correct. Finishing time can take any value in an interval (19 min 42.36 s, for example), limited only by the stopwatch, so it is continuous.
        - |
          A number of races is a count (0, 1, 2, ...), so it is quantitative but discrete, not continuous.
        - |
          Yes or no places each runner into a category, so this variable is categorical.
      answer: 1
    - slug: apstats-u01-w01-q13
      type: multi_select
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 2
      partial_credit: true
      prompt: |
        A school nurse's records include the variables below for each student. Which are categorical? Select all that apply.
      options:
        - "Blood type (A, B, AB or O)"
        - "Number of visits to the nurse this year"
        - "Locker number"
        - "Allergy severity rated mild, moderate or severe"
        - "Height in centimetres"
      option_explanations:
        - |
          Correct. Blood type places each student into one of four groups.
        - |
          A number of visits is a count that can be averaged, so it is quantitative (and discrete).
        - |
          Correct. Locker numbers are labels; the average locker number means nothing, so the variable is categorical.
        - |
          Correct. Mild, moderate and severe are ordered categories, not numbers that can be averaged.
        - |
          Height is a measurement with units that can be averaged, so it is quantitative (and continuous).
      answer: [0, 2, 3]
    - slug: apstats-u01-w01-q14
      type: multi_select
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 2
      partial_credit: true
      prompt: |
        Which features belong to a well-written statistical investigative question? Select all that apply.
      options:
        - "It names the population the question is about."
        - "It can be answered by asking one person one time."
        - "It names the variable or variables to be measured."
        - "It has a single correct answer that can be looked up."
        - "It anticipates that the data will vary from individual to individual."
      option_explanations:
        - |
          Correct. Naming the group (for example, “juniors at our school”) tells you whom to collect data from.
        - |
          A question one person can answer with one value is a survey question, the tool for collecting the data.
        - |
          Correct. Naming the variable tells you what to measure or record on each individual.
        - |
          A question with one fixed, looked-up answer anticipates no variability, so it is not statistical at all.
        - |
          Correct. Expecting variability is what makes a question statistical: the answer comes from summarising many varied values.
      answer: [0, 2, 4]
    - slug: apstats-u01-w01-q15
      type: true_false
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      prompt: |
        True or false: A variable whose values are recorded as numbers is always a quantitative variable.
      answer: false
      explanation: |
        False. Numbers can be labels, as with ZIP codes, jersey numbers and locker numbers. A variable is quantitative only when arithmetic on its values, such as an average, makes sense.
    - slug: apstats-u01-w01-q16
      type: true_false
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 1
      prompt: |
        True or false: "What proportion of students at our school bring lunch from home on a typical day?" is a statistical investigative question.
      answer: true
      explanation: |
        True. It names a population (students at our school) and a categorical variable (brings lunch from home or not), and it anticipates variability, since some students bring lunch and some do not. It is answered by collecting data from many students and computing a proportion.
    - slug: apstats-u01-w01-q17
      type: fill_blank
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      prompt: |
        A variable that places each individual into one of several groups, such as favourite music genre, is called a ____ variable.
      answer: ["categorical", "qualitative"]
      explanation: |
        A categorical (qualitative) variable records which group or category each individual belongs to. Its values are summarised with counts and proportions, not averages.
    - slug: apstats-u01-w01-q18
      type: fill_blank
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      prompt: |
        The number of goals a hockey team scores in a game is a quantitative variable that is ____ (one word), because its possible values are counts with gaps between them.
      answer: ["discrete"]
      explanation: |
        Goals are counted: 0, 1, 2, ... with nothing in between, so the variable is discrete. A measurement such as time of possession, which can take any value in an interval, would be continuous.
    - slug: apstats-u01-w01-q19
      type: numeric
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      prompt: |
        A data table from a survey of 45 students has one row per student and records 6 variables for each student (there is no name column). How many data values (cells, not counting the header row) does the table hold?
      answer: { value: 270, tolerance: 0 }
      explanation: |
        Each of the 45 rows (individuals) holds one value for each of the 6 columns (variables): 45 × 6 = 270 values.
    - slug: apstats-u01-w01-q20
      type: short_answer
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 3
      prompt: |
        A student council member asks, "Are phones bad for students?"

        (a) Explain why this is not yet a good statistical investigative question.
        (b) Rewrite it as a statistical investigative question about students at your school.
        (c) For your question, identify the population and the variable or variables, and state whether each variable is categorical or quantitative.
      answer: |
        (a) It names no population, does not say what would be measured ("bad" is not a variable), and does not say what would be summarised or compared.
        (b) One acceptable question: "Do students at our school who use their phones recreationally for more than 4 hours a day typically get less sleep on school nights than students who use them for 4 hours or less?"
        (c) Population: all students at our school. Variables: daily recreational phone use, grouped as more than 4 hours or 4 hours or less (categorical as used here), and hours of sleep on a school night (quantitative).
      explanation: |
        Three points, one per part. (a) at least two of: no population, no measurable variable, no clear summary, comparison or association. (b) a question about a named group of students that anticipates variability and names a measurable variable (any summary, comparison or association question earns the point; a survey question asked of one person does not). (c) the population and every variable named in (b), each correctly typed. If phone use is kept as hours (an association question), it is quantitative.
    - slug: apstats-u01-w01-q21
      type: short_answer
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 3
      prompt: |
        A hypothetical animal shelter records these variables for each dog it takes in: breed, age in months, weight in kilograms, kennel number, and number of previous owners.

        (a) Classify each variable as categorical or quantitative.
        (b) For each quantitative variable, say whether it is discrete or continuous.
        (c) A volunteer says kennel number must be quantitative "because it is a number". Explain why the volunteer is wrong.
      answer: |
        (a) Categorical: breed, kennel number. Quantitative: age in months, weight in kilograms, number of previous owners.
        (b) Number of previous owners is discrete (a count). Weight is continuous. Age is continuous in reality (time), although recording it in whole months makes the recorded values look discrete; either answer earns credit with that reasoning.
        (c) Kennel numbers are labels that identify a location. Arithmetic on them means nothing (the average kennel number is not a meaningful amount), so the variable is categorical.
      explanation: |
        Three points, one per part. (a) all five classified correctly (four of five earns the point only if the error is age). (b) previous owners discrete and weight continuous, with age either way if reasoned. (c) the explanation that kennel numbers are labels and that averaging or other arithmetic on them is meaningless.
    - slug: apstats-u01-w01-q22
      type: long_answer
      topic_code: "1.1"
      source: "AP Statistics CED, Topic 1.1"
      points: 6
      prompt: |
        A high school's cafeteria manager wonders whether students who eat breakfast at home are less likely to buy a mid-morning snack from the school's snack bar. She plans to collect data from students at the school.

        (A) Write a statistical investigative question that the manager could investigate. Your question should name the population and the variables.

        (B) Write two survey questions that she could ask each student to collect the data needed to answer your investigative question.

        (C) Identify each variable in your investigative question as categorical or quantitative.

        (D) Is your investigative question a summary, comparison or association question? Explain how its type tells the manager what kind of data she needs from each student.

        (E) Explain why the manager cannot answer the investigative question by asking a single student.
      answer: |
        (A) "Among students at our school, is the proportion who buy a mid-morning snack at the snack bar lower for students who usually eat breakfast at home than for students who usually do not?"
        (B) "Do you usually eat breakfast at home on school days? (yes or no)" and "Did you buy a snack at the snack bar this morning? (yes or no)" (or "On how many of the last five school days did you buy a snack at the snack bar?").
        (C) Eats breakfast at home: categorical (yes or no). Buys a snack: categorical (yes or no), or quantitative if recorded as a number of days.
        (D) A comparison question: it compares the snack-buying variable between two groups (breakfast eaters and non-eaters). So each student must report both which group they are in and their snack-buying value, and the data must include students from both groups.
        (E) Students vary: some breakfast eaters buy snacks and some do not. One student gives one pair of answers, which says nothing about the proportions in either group; the question is about the pattern across many students.
      explanation: |
        Six points. (A) 2 points: 1 for a question about a named population (students at the school) that anticipates variability, 1 for naming both variables (breakfast at home and snack buying). A survey question asked of one person earns 0 for (A). (B) 1 point: two questions an individual can answer, one for each variable. (C) 1 point: both variables correctly typed (categorical, or quantitative if the student's (B) records a count). (D) 1 point: "comparison" (or "association" if both variables are quantitative in the student's design) with the consequence that both variables are recorded for each student and both groups are represented. (E) 1 point: the answer depends on variability across many students; one student's answers cannot reveal a proportion or a typical value.
