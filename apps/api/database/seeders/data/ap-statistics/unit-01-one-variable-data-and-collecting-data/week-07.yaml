    # ---- True/false
    - slug: apstats-u01-w07-q18
      type: true_false
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        True or false: Random assignment guarantees that the treatment groups in an experiment are identical on every variable except the treatment.
      answer: false
      explanation: |
        False. Random assignment makes the groups similar on average and prevents systematic differences, but chance differences between groups remain. That is why we ask whether an observed difference is larger than random assignment alone would plausibly produce.
    - slug: apstats-u01-w07-q19
      type: true_false
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        True or false: In a randomized experiment, a difference between the treatment groups is called statistically significant when it is too large to be plausibly explained by the chance variation of random assignment alone.
      answer: true
      explanation: |
        True. Even with no treatment effect, random assignment produces some difference between groups by chance. A statistically significant difference is one larger than that chance variation would plausibly create, which is evidence of a real treatment effect.
    # ---- Fill in the blank
    - slug: apstats-u01-w07-q20
      type: fill_blank
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        Forming groups of experimental units that are similar on a variable related to the response, and then randomly assigning treatments separately within each group, is called ____.
      answer: ["blocking", "a randomized block design", "randomized block design", "block design", "randomized blocking"]
      explanation: |
        Blocking (a randomized block design). The groups are blocks; comparing treatments within blocks removes the variation between blocks from the comparison.
    - slug: apstats-u01-w07-q21
      type: fill_blank
      topic_code: "1.7"
      source: "AP Statistics CED, Topic 1.7"
      points: 1
      prompt: |
        Five students reported the number of hours they volunteered last month: 4, 7, 7, 9, 13. The mean is ____ hours.
      answer: ["8", "8.0", "8 hours"]
      explanation: |
        Mean = (4 + 7 + 7 + 9 + 13)/5 = 40/5 = 8 hours.
