week: 7
unit: 1
title: Experimental Design
topics: ["1.13"]
guide: guides/week-07.md
guide_description: |
  Designing experiments that can answer cause-and-effect questions: experimental units, explanatory and response
  variables, factors, levels and treatments; confounding; the four principles (comparison, random assignment,
  control and replication); control groups, placebos and blinding; completely randomized, randomized block and
  matched pairs designs, with how to describe random assignment so someone else could carry it out; statistical
  significance as a first idea; and the scope of inference from random selection and random assignment. Worked
  examples: a two-factor tomato fertilizer and watering study with six treatments, a completely randomized
  design for a nap and reaction-time experiment, a randomized block design and a matched pairs typing test on
  two keyboards (with the mean difference computed), and four studies sorted into the scope-of-inference grid.
flashcards_description: |
  32 cards on the vocabulary of experiments, confounding, the four principles of design, control groups,
  placebos and blinding, the three designs and when to use each, describing random assignment, statistical
  significance, and what random selection and random assignment each allow you to conclude.

flashcards:
  - front: Experimental unit versus subject → the difference
    back: |
      The experimental unit is the smallest thing a treatment is assigned to (a plant, a classroom, a person). When the units are people, they are called subjects (or participants).
    topic_code: "1.13"
  - front: Explanatory and response variables in an experiment → roles
    back: |
      The explanatory variable is the one the researcher manipulates (the factor); the response variable is the outcome measured to see the effect.
    topic_code: "1.13"
  - front: Factor, level and treatment → how they relate
    back: |
      A factor is an explanatory variable; its levels are the specific values used; a treatment is one combination of levels applied to a unit.
    topic_code: "1.13"
  - front: Two factors with 3 and 2 levels → number of treatments
    back: |
      3 × 2 = 6 treatments, one for every combination of a level of the first factor with a level of the second.
    topic_code: "1.13"
  - front: Confounding variable → full definition
    back: |
      A variable related to the explanatory variable and also to the response, so that its effect on the response cannot be separated from the effect of the explanatory variable.
    topic_code: "1.13"
  - front: Teacher uses method 1 in the morning class and method 2 in the afternoon class → the flaw
    back: |
      Time of day (and the two classes' other differences) is confounded with teaching method; a difference in scores cannot be credited to the method.
    topic_code: "1.13"
  - front: Four principles of experimental design → list
    back: |
      Comparison (at least two treatments), random assignment of treatments to units, control of other variables, and replication (enough units in each treatment).
    topic_code: "1.13"
  - front: Random assignment → what it accomplishes
    back: |
      It creates treatment groups that are roughly equivalent on every variable, measured or not, so a large difference in responses can be attributed to the treatments.
    topic_code: "1.13"
  - front: Replication in a single experiment → why it is needed
    back: |
      With several units per treatment, the natural variation between units can be told apart from a treatment effect. One unit per treatment shows nothing.
    topic_code: "1.13"
  - front: Control (of other variables) → what it means in practice
    back: |
      Keep everything except the treatment the same for every unit (same soil, same timing, same instructions), which reduces variability in the response.
    topic_code: "1.13"
  - front: Control group → purpose
    back: |
      Gives a baseline for comparison: what happens with no treatment, an inactive treatment or the current standard treatment.
    topic_code: "1.13"
  - front: Placebo → definition
    back: |
      An inactive treatment made to look like the real one (a sugar pill, plain-flavoured gum), so subjects cannot tell which group they are in.
    topic_code: "1.13"
  - front: Placebo effect → definition
    back: |
      Subjects respond to a treatment simply because they believe they are receiving one, even when it is inactive.
    topic_code: "1.13"
  - front: Single-blind versus double-blind experiment
    back: |
      Single-blind: either the subjects or the people measuring the response do not know who got which treatment. Double-blind: neither knows.
    topic_code: "1.13"
  - front: Blinding the evaluator → when it matters most
    back: |
      When the response is judged (rating an essay, scoring a posture, deciding whether a symptom improved), because an evaluator who knows the treatment may judge differently.
    topic_code: "1.13"
  - front: Completely randomized design → definition
    back: |
      All experimental units are randomly assigned to the treatments in one step, with no grouping beforehand.
    topic_code: "1.13"
  - front: Describing random assignment of 60 volunteers to two treatments → the steps
    back: |
      Number the volunteers 1 to 60; use a random number generator to pick 30 different numbers from 1 to 60 (ignore repeats); those volunteers get treatment 1, the other 30 get treatment 2.
    topic_code: "1.13"
  - front: Random assignment with cards → a valid description
    back: |
      Shuffle 30 cards marked "nap" and 30 marked "rest" in a box; each volunteer draws one without replacement and receives the treatment on the card.
    topic_code: "1.13"
  - front: Randomized block design → how it works
    back: |
      Group units into blocks of similar units (on a variable related to the response), then randomly assign the treatments separately within each block.
    topic_code: "1.13"
  - front: Blocking → why it helps
    back: |
      It removes the variation between blocks from the comparison, so the treatment effect is easier to detect. Block to reduce variability; randomize to avoid confounding.
    topic_code: "1.13"
  - front: Good blocking variable → how to choose one
    back: |
      A variable you expect to affect the response (prior fitness for a running test, field location for crops, grade for a reading test).
    topic_code: "1.13"
  - front: Matched pairs design → two forms
    back: |
      Each subject receives both treatments in a random order, or subjects are paired by similarity and one of each pair is randomly assigned to each treatment.
    topic_code: "1.13"
  - front: Matched pairs typing test, two keyboards (week 7 example) → what the design does
    back: |
      Each student types on both keyboards in random order. Comparing each student with themself removes the large differences in typing skill between students.
    topic_code: "1.13"
  - front: Order of treatments in a matched pairs design → why randomize it
    back: |
      Practice or fatigue could make the second trial better or worse; randomizing the order (a coin flip per subject) keeps order from being confounded with treatment.
    topic_code: "1.13"
  - front: Statistically significant (first look) → meaning
    back: |
      An observed difference between treatment groups too large to be plausibly explained by the chance variation of random assignment alone.
    topic_code: "1.13"
  - front: Scope of inference grid → the four cells
    back: |
      Random selection and random assignment: cause and effect, for the population. Random assignment only: cause and effect, for units like those in the study. Random selection only: association, for the population. Neither: association, for the sample only.
    topic_code: "1.13"
  - front: Volunteers randomly assigned to treatments → what can and cannot be concluded
    back: |
      Cause and effect for volunteers like these (random assignment), but no generalization to a larger population (no random selection).
    topic_code: "1.13"
  - front: Ethics in an experiment on people → the basics
    back: |
      Informed consent, no avoidable harm, confidentiality of individual data, and review of the plan before it starts.
    topic_code: "1.13"
  - front: Experiment versus observational study → when an experiment is impossible
    back: |
      When assigning the treatment would be unethical or impractical (assigning teens to vape, assigning family income); then observational studies are the only option and cause stays unproven.
    topic_code: "1.13"
  - front: Error-spot → "random assignment makes the two groups identical"
    back: |
      It makes them similar on average, not identical; chance differences remain. That chance variation is what statistical significance is judged against.
    topic_code: "1.13"
  - front: Error-spot → "the experiment used random assignment, so the results apply to all students in the country"
    back: |
      Random assignment supports cause and effect. Generalizing to a population needs random selection from that population.
    topic_code: "1.13"
  - front: Error-spot → "we blocked by gender to make the groups random"
    back: |
      Blocking groups similar units to reduce variability; randomness still has to come from random assignment within each block.
    topic_code: "1.13"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 1.13: experimental units, factors and treatments,
    confounding, the principles of experimental design, control groups, placebos and blinding, completely
    randomized, randomized block and matched pairs designs, and scope of inference), with 8 questions (32%)
    reviewing weeks 4 to 6 (summary statistics and boxplots, comparing distributions, data collection, random
    sampling and sampling bias). Opens with a four-question shared-context set on a music-and-running experiment.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. A calculator is allowed throughout.
  questions:
    # ---- Stimulus set: music and the 1-mile run (1.13)
    - slug: apstats-u01-w07-q01
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      stimulus: |
        A physical education teacher at a hypothetical high school wants to know whether listening to upbeat music through earbuds during a timed 1-mile run lowers students' run times. Forty-eight students volunteer: 24 are members of a school sports team and 24 are not. Each student will run the mile once, either with music or without, and the time in minutes will be recorded.
      prompt: |
        Identify the experimental units, the explanatory variable and the response variable.
      options:
        - "Units: all students at the school; explanatory: run time; response: music or no music"
        - "Units: the 24 team members; explanatory: team membership; response: run time"
        - "Units: the two groups of 24; explanatory: music; response: team membership"
        - "Units: the 48 student volunteers; explanatory: music or no music; response: 1-mile run time"
      option_explanations:
        - |
          The units are the individuals who actually receive treatments, the 48 volunteers, and this reverses the variables: music is manipulated and run time is measured.
        - |
          Treatments go to all 48 volunteers, and team membership is a characteristic of students, not something the teacher assigns.
        - |
          Treatments are assigned to individual students, so each student is a unit; team membership is not a response.
        - |
          Correct. Each volunteer receives a treatment, the teacher manipulates whether music is played, and the run time is the outcome measured.
      answer: 3
    - slug: apstats-u01-w07-q02
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      stimulus: |
        A physical education teacher at a hypothetical high school wants to know whether listening to upbeat music through earbuds during a timed 1-mile run lowers students' run times. Forty-eight students volunteer: 24 are members of a school sports team and 24 are not. Each student will run the mile once, either with music or without, and the time in minutes will be recorded.
      prompt: |
        Ignoring team membership for now, which procedure correctly assigns treatments in a completely randomized design with 24 students per treatment?
      options:
        - "Let each student choose whether to run with music."
        - "Number the students 1 to 48, use a random number generator to select 24 different numbers from 1 to 48, give music to those students and no music to the rest."
        - "Give music to the 24 team members and no music to the other 24."
        - "Give music to the first 24 students who arrive at the track."
      option_explanations:
        - |
          Students who choose music may be the ones who already run with music and train more; self-selection confounds the treatment with fitness.
        - |
          Correct. Every student is labelled, a random mechanism without repeats picks the music group, and the remaining 24 form the comparison group.
        - |
          Team membership would be completely confounded with music: team members are likely faster anyway, so any difference could be due to fitness.
        - |
          Arrival order is not random; early arrivers may be more eager or more fit, which could be confounded with the treatment.
      answer: 1
    - slug: apstats-u01-w07-q03
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      stimulus: |
        A physical education teacher at a hypothetical high school wants to know whether listening to upbeat music through earbuds during a timed 1-mile run lowers students' run times. Forty-eight students volunteer: 24 are members of a school sports team and 24 are not. Each student will run the mile once, either with music or without, and the time in minutes will be recorded.
      prompt: |
        The teacher decides to block by team membership, randomly assigning 12 team members and 12 non-members to each treatment. What is the main reason for this?
      options:
        - "Team members probably run faster than non-members; blocking separates that source of variation so the effect of music is easier to detect."
        - "Blocking lets the results be generalized to every student at the school."
        - "Blocking replaces random assignment, so no randomization is needed."
        - "Blocking guarantees that the music group will have the faster times."
      option_explanations:
        - |
          Correct. Run times depend strongly on fitness, which team membership reflects. Comparing music with no music within each block removes the team/non-team difference from the comparison and reduces variability.
        - |
          Generalizing to the school requires random selection; these students are volunteers, and blocking does not change that.
        - |
          Treatments are still randomly assigned within each block; blocking adds to randomization, it does not replace it.
        - |
          Blocking makes the comparison fairer and more precise; it cannot guarantee any particular result.
      answer: 0
    - slug: apstats-u01-w07-q04
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      stimulus: |
        A physical education teacher at a hypothetical high school wants to know whether listening to upbeat music through earbuds during a timed 1-mile run lowers students' run times. Forty-eight students volunteer: 24 are members of a school sports team and 24 are not. Each student will run the mile once, either with music or without, and the time in minutes will be recorded.
      prompt: |
        The music group's mean time turns out to be lower, and the difference is statistically significant. Which conclusion is appropriate?
      options:
        - "Music causes lower run times for all students at the school, because treatments were randomly assigned."
        - "Music is associated with lower run times, but no cause-and-effect conclusion is possible because the students were not a random sample."
        - "Music caused lower run times for these volunteers, but the result cannot be generalized to all students at the school because the volunteers were not randomly selected."
        - "The experiment proves that music lowers run times for every runner."
      option_explanations:
        - |
          Random assignment supports cause and effect, but only for units like these volunteers. Extending to the whole school needs random selection.
        - |
          This mixes up the two kinds of randomness: random assignment, which this study had, is what supports a causal conclusion; random selection is about generalizing.
        - |
          Correct. Random assignment allows a cause-and-effect conclusion for the volunteers; without random selection, the conclusion extends only to students like them.
        - |
          Statistics never proves, and a difference in means does not say every runner improved.
      answer: 2
    # ---- Experimental design (1.13)
    - slug: apstats-u01-w07-q05
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        A science teacher tries a new lab-based unit with her 2nd-period class and the usual lecture-based unit with her 6th-period class. The 2nd-period class scores higher on the unit test. Why can't the teacher conclude that the lab-based unit caused the higher scores?
      options:
        - "The sample sizes are too small to find any difference."
        - "The test was not a census of the whole school."
        - "Class period is confounded with teaching method: the classes could differ in time of day, prior achievement or other ways that affect scores."
        - "A teacher cannot give two different units in the same year."
      option_explanations:
        - |
          A small sample makes chance variation larger, but the decisive flaw here is that the method was not randomly assigned.
        - |
          A census is about data collection for describing a population; the issue is a cause-and-effect comparison.
        - |
          Correct. Treatments were assigned by class, not at random, so anything that differs between the classes (alertness at different times of day, which students are in each class) is mixed up with the effect of the method.
        - |
          Teaching two units is fine; the issue is that each method went to one intact class, so method and class are inseparable.
      answer: 2
    - slug: apstats-u01-w07-q06
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        In an experiment on whether a peppermint-scented patch reduces headaches during exam week, one group gets the scented patch and the other gets an identical-looking unscented patch. What is the purpose of the unscented patch?
      options:
        - "It is a placebo, so any effect of simply wearing a patch and expecting relief is the same in both groups."
        - "It is a blocking variable, so the groups are more similar."
        - "It increases the sample size of the experiment."
        - "It lets the results be generalized to all students."
      option_explanations:
        - |
          Correct. Students in both groups believe they might have the real patch, so the placebo effect is balanced, and a difference can be attributed to the scent.
        - |
          Blocking groups similar units before assignment; the unscented patch is a treatment given to the comparison group.
        - |
          The number of subjects is the same whatever the comparison group receives.
        - |
          Generalizing depends on how subjects were selected, not on what the control group receives.
      answer: 0
    - slug: apstats-u01-w07-q07
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        In a study of two posture-training programs, physical therapists rate each student's posture from photographs at the end. The students know which program they followed, but the therapists rating the photographs do not. Which description is correct?
      options:
        - "The experiment is double-blind."
        - "The experiment is not blind at all."
        - "The experiment uses a placebo."
        - "The experiment is single-blind: the evaluators do not know the treatments."
      option_explanations:
        - |
          Double-blind requires that neither the subjects nor the evaluators know the treatments; here the students know.
        - |
          The raters are blind, which counts: blinding either the subjects or the evaluators makes the experiment single-blind.
        - |
          Both groups receive a real program; no inactive imitation treatment is described.
        - |
          Correct. Only one party, the people who measure the response, is blind. That matters because rating posture is a judgement that knowledge of the program could sway.
      answer: 3
    - slug: apstats-u01-w07-q08
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        To compare two brands of running shoes for wear, a coach gives each of 20 runners one shoe of each brand, with a coin flip deciding which brand goes on the left foot. After a month the tread wear of every shoe is measured. What design is this?
      options:
        - "A completely randomized design"
        - "A matched pairs design"
        - "An observational study"
        - "A cluster sample"
      option_explanations:
        - |
          In a completely randomized design each unit would get one treatment; here each runner wears both brands.
        - |
          Correct. Each runner is a pair of feet receiving both treatments, with random assignment of brand to foot, so runner-to-runner differences (weight, distance run) cancel out of each comparison.
        - |
          The coach imposes the treatments (which brand on which foot), so this is an experiment.
        - |
          Cluster sampling is a way to select a sample for a survey, not a way to assign treatments.
      answer: 1
    - slug: apstats-u01-w07-q09
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        A researcher selects an SRS of 200 students from a large school district and records whether each student eats breakfast and the student's first-period quiz average. Breakfast eaters have a noticeably higher average. Which conclusion is justified?
      options:
        - "Eating breakfast causes higher quiz averages for the district's students."
        - "Eating breakfast causes higher quiz averages, but only for these 200 students."
        - "Nothing can be concluded, because the study was not an experiment."
        - "In the district, students who eat breakfast tend to have higher quiz averages, but cause and effect cannot be concluded."
      option_explanations:
        - |
          Random selection allows generalizing to the district, but without random assignment the study cannot separate breakfast from other variables such as sleep or family routines.
        - |
          No random assignment occurred, so no causal conclusion is justified, even for the students in the sample.
        - |
          An observational study with a random sample does support a conclusion: an association in the population.
        - |
          Correct. The random sample lets the association extend to the district; with no random assignment, it remains an association.
      answer: 3
    - slug: apstats-u01-w07-q10
      type: multiple_choice
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        A district tests a new math curriculum by randomly assigning 10 of its 20 algebra classrooms to the new curriculum and the other 10 to the current one. At the end of the year it compares each classroom's mean test score. What are the experimental units?
      options:
        - "The individual students in the 20 classrooms"
        - "The two curricula"
        - "The 20 classrooms"
        - "The end-of-year test scores"
      option_explanations:
        - |
          Students did not receive treatments individually: whole classrooms were assigned, so a student's curriculum depends on the classroom.
        - |
          The curricula are the treatments (the levels of the factor), not the units.
        - |
          Correct. The experimental unit is the smallest thing a treatment is randomly assigned to; here that is a classroom, and each classroom gives one response (its mean score).
        - |
          The test scores are the response variable measured on the units.
      answer: 2
    # ---- Review (weeks 4-6)
    - slug: apstats-u01-w07-q11
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Statistics CED, Topic 1.12"
      points: 1
      prompt: |
        A hypothetical county library emails a satisfaction survey to a random sample of 800 card holders. 160 reply, and most of the replies come from people who visit the library weekly. What is the main problem and its likely effect?
      options:
        - "Nonresponse: frequent visitors, who probably like the library more, are over-represented, so satisfaction is likely overestimated."
        - "Voluntary response: card holders chose to sign up for library cards."
        - "Undercoverage: the sample was too small for the county."
        - "No problem, because the 800 were chosen at random."
      option_explanations:
        - |
          Correct. 640 of the 800 randomly chosen card holders (80%) did not reply, and those who did reply are heavy users, who likely rate the library higher than typical card holders do.
        - |
          The sample was randomly chosen from card holders; getting a card does not make the survey sample self-selected. The trouble is the people who did not answer.
        - |
          Undercoverage is about who can be selected, not sample size; every card holder had a chance to be chosen.
        - |
          Random selection does not protect against a low, uneven response rate.
      answer: 0
    - slug: apstats-u01-w07-q12
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Statistics CED, Topic 1.11"
      points: 1
      prompt: |
        A farm wants to estimate the mean weight of its pumpkins, which are loaded into 50 crates of about 40 pumpkins each. Workers randomly choose 5 crates and weigh every pumpkin in them. What sampling method is this?
      options:
        - "Stratified random sampling, with crates as strata"
        - "Cluster sampling, with crates as clusters"
        - "Simple random sampling"
        - "Systematic random sampling"
      option_explanations:
        - |
          Stratified sampling would take some pumpkins from every crate; here only 5 crates are used, but all pumpkins in them.
        - |
          Correct. An SRS of crates is chosen and every pumpkin in each chosen crate is weighed: the crates are clusters. It saves the effort of unloading all 50 crates.
        - |
          In an SRS of pumpkins, two pumpkins from different crates and two from the same crate would be equally likely to be chosen together; here pumpkins come in whole crates.
        - |
          No ordered list with every kth pumpkin is used.
      answer: 1
    - slug: apstats-u01-w07-q13
      type: multiple_choice
      topic_code: "1.10"
      source: "AP Statistics CED, Topic 1.10"
      points: 1
      prompt: |
        Which investigative question can be answered with an observational study alone?
      options:
        - "Does taking a standardized test in the morning instead of the afternoon raise scores?"
        - "Does a daily reminder text cause students to turn in more homework?"
        - "Does adding fertilizer to bean plants make them grow taller?"
        - "Do students at our school who work part-time jobs tend to have lower GPAs than those who do not?"
      option_explanations:
        - |
          "Raise" asks about a cause, which needs random assignment of testing times.
        - |
          "Cause" calls for an experiment that randomly assigns students to receive texts or not.
        - |
          "Make them grow taller" is a causal question about fertilizer, which needs an experiment.
        - |
          Correct. "Tend to have" asks about an association between two variables as they occur, which an observational study with a random sample of the school's students can answer.
      answer: 3
    - slug: apstats-u01-w07-q14
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      prompt: |
        Daily high temperatures for one month in two hypothetical towns: Bayview has median 64 °F and IQR 6 °F; Ridgecrest has median 64 °F and IQR 15 °F. Both distributions are roughly symmetric. Which comparison is correct?
      options:
        - "Ridgecrest is warmer, because its IQR is larger."
        - "The two towns have the same distribution of temperatures."
        - "The towns have the same median high (64 °F), but Ridgecrest's highs are much more variable (IQR 15 vs 6 °F)."
        - "Bayview's highs are more variable, because its IQR is smaller."
      option_explanations:
        - |
          The IQR measures spread, not center; equal medians say the typical high is the same.
        - |
          Equal centers and similar shapes do not make the distributions the same; their spreads differ greatly.
        - |
          Correct. The centers match, and Ridgecrest's middle half spans 15 °F against Bayview's 6 °F, so its temperatures swing much more.
        - |
          A smaller IQR means less variability, so Bayview's highs are the more consistent.
      answer: 2
    - slug: apstats-u01-w07-q15
      type: multiple_choice
      topic_code: "1.8"
      source: "AP Statistics CED, Topic 1.8"
      points: 1
      prompt: |
        The five-number summary of the number of points scored per game by a hypothetical basketball player over a season is 4, 11, 15, 19, 34. Which values, if any, are outliers by the 1.5 × IQR rule?
      options:
        - "Only 34"
        - "Only 4"
        - "Both 4 and 34"
        - "Neither; there are no outliers"
      option_explanations:
        - |
          Correct. IQR = 19 − 11 = 8, so the fences are 11 − 12 = −1 and 19 + 12 = 31. The maximum 34 is above 31; the minimum 4 is above −1.
        - |
          The lower fence is 11 − 1.5(8) = −1, and 4 is above it, so 4 is not an outlier.
        - |
          Only the upper fence (31) is crossed; 4 lies well inside the lower fence of −1.
        - |
          34 is greater than the upper fence 19 + 1.5(8) = 31, so it is an outlier.
      answer: 0
    # ---- Select-all
    - slug: apstats-u01-w07-q16
      type: multi_select
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 2
      partial_credit: true
      prompt: |
        A student plans to test whether a new plant food increases the number of tomatoes per plant, using 40 seedlings in a school greenhouse. Which choices follow the principles of a well-designed experiment? Select all that apply.
      options:
        - "Randomly assign 20 seedlings to receive the plant food and 20 to receive plain water."
        - "Give the plant food to the 20 healthiest-looking seedlings so the effect will be easier to see."
        - "Keep the pot size, soil, light and watering schedule the same for all 40 plants."
        - "Use 20 plants per treatment rather than 1 per treatment."
        - "Put all plant-food pots on the sunny side of the greenhouse to save time."
      option_explanations:
        - |
          Correct. Random assignment of treatments to seedlings balances other differences between plants (comparison and random assignment).
        - |
          Hand-picking the healthiest plants confounds plant health with the treatment; any extra tomatoes could be due to health.
        - |
          Correct. Holding other variables constant (control) reduces variability in the response, so a treatment effect is easier to see.
        - |
          Correct. Replication: with many plants per treatment, the natural variation among plants can be told apart from the effect of the plant food.
        - |
          Placing every treated plant in the sun confounds sunlight with plant food; the pots should be randomly placed, or blocked by location.
      answer: [0, 2, 3]
    - slug: apstats-u01-w07-q17
      type: multi_select
      topic_code: "1.12"
      source: "AP Statistics CED, Topic 1.12"
      points: 2
      partial_credit: true
      prompt: |
        A city council wants to know what proportion of its residents support a new bus route. Which plans are likely to produce a biased estimate? Select all that apply.
      options:
        - "Asking riders at the city's busiest bus stop one morning"
        - "Asking an SRS of residents from a complete address list, by an anonymous mailed survey with follow-up visits to non-responders"
        - "Posting a phone-in line advertised on local radio"
        - "Asking an SRS of residents, \"Wouldn't you agree that better buses help everyone?\""
        - "Asking a larger SRS of 2,000 residents instead of 500, with neutral wording"
      option_explanations:
        - |
          Correct. A convenience sample of current riders, who likely favour more bus service, would overestimate support.
        - |
          Random selection from a complete frame, anonymity and follow-up for nonresponse address the main sources of bias; this is a sound plan.
        - |
          Correct. A phone-in line is a voluntary response sample: people with strong opinions call, so the result is not representative.
        - |
          Correct. The leading wording pushes respondents toward agreeing, a response bias that would overestimate support.
        - |
          A larger SRS with neutral wording reduces sampling variability and introduces no bias; it is a better, not a biased, plan.
