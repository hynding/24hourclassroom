    - slug: apstats-u01-w07-q22
      type: numeric
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 1
      prompt: |
        A food science class tests how baking temperature (325 °F, 350 °F or 375 °F) and type of flour (all-purpose, whole wheat) affect the height of muffins. Every combination of temperature and flour is used, with 4 muffin tins for each combination. How many treatments are there? Give a whole number.
      answer: { value: 6, tolerance: 0 }
      explanation: |
        A treatment is one combination of factor levels: 3 temperatures × 2 flours = 6 treatments. (With 4 tins each, the experiment uses 24 tins; the 4 is replication, not extra treatments.)
    # ---- Short answer
    - slug: apstats-u01-w07-q23
      type: short_answer
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 3
      prompt: |
        A researcher has 50 volunteers for an experiment comparing two memory techniques: making up a story that links the words, or repeating the words aloud. Each volunteer will study a list of 30 words with one technique and then write down as many as they recall.

        (a) Describe how to randomly assign the volunteers to the two techniques so that 25 use each.
        (b) Explain why the person who counts the recalled words should not know which technique each volunteer used.
      answer: |
        (a) Number the volunteers 1 to 50. Use a random number generator to produce random integers from 1 to 50, ignoring repeats, until 25 different numbers are chosen. Those 25 volunteers use the story technique; the remaining 25 repeat the words aloud. (Equivalent: 25 slips marked "story" and 25 marked "repeat", mixed in a container, each volunteer drawing one without replacement.)
        (b) If the counter knew the technique and expected one to work better, they might, even unintentionally, be more lenient with borderline spellings for that group. Keeping the evaluator blind prevents this bias in measuring the response.
      explanation: |
        Three points.
        2 points for (a): 1 point for labelling every volunteer and using a random mechanism without repeats; 1 point for stating how the chosen labels determine the two groups of 25.
        1 point for (b): the evaluator's knowledge could influence how responses are counted or judged (for example, lenient with misspellings), so blinding prevents biased measurement.
    - slug: apstats-u01-w07-q24
      type: short_answer
      topic_code: "1.12"
      source: "AP Statistics CED, Topic 1.12"
      points: 3
      prompt: |
        To estimate the mean amount students at a hypothetical high school spend on lunch each week, a club surveys the students eating in the school cafeteria during one lunch period.

        (a) Name the type of sample.
        (b) Explain how this sample is likely to bias the estimate, including the direction of the bias.
        (c) Describe one change that would reduce the bias.
      answer: |
        (a) A convenience sample.
        (b) Students in the cafeteria are likely to be buying school lunch, while students who bring lunch from home or eat elsewhere are under-represented. Students who buy lunch probably spend more per week than students who bring it, so the estimate is likely too high. Only one lunch period is sampled, which may also miss students in other periods.
        (c) Select a simple random sample (or a sample stratified by lunch period) from the school's full enrollment list and survey those students wherever they eat.
      explanation: |
        Three points.
        1 point: (a) convenience sample.
        1 point: (b) identifies who is over- or under-represented, explains how they differ in spending, and states the direction (overestimate).
        1 point: (c) a random selection method from a complete list of students (SRS or stratified random sample).
    # ---- Long answer
    - slug: apstats-u01-w07-q25
      type: long_answer
      topic_code: "1.13"
      source: "AP Statistics CED, Topic 1.13"
      points: 6
      prompt: |
        A health teacher wants to know whether chewing sugar-free gum during a 30-minute timed reading test lowers students' self-reported test anxiety (a score from 0 to 40 on a short questionnaire taken right after the test). Sixty students in grades 10 and 12 volunteer: 30 sophomores and 30 seniors. The teacher believes seniors, with more testing experience, generally report less anxiety.

        (A) Identify the explanatory variable, the response variable and the experimental units.

        (B) Describe a randomized block design for this experiment, including how treatments are assigned.

        (C) The comparison group will chew nothing. A colleague suggests the comparison group should instead be given a stick of unflavoured wax to chew. Explain what advantage the colleague's suggestion has.

        (D) Explain why blocking by grade is a reasonable choice.

        (E) Suppose the gum group reports significantly lower anxiety. To whom can the conclusion be applied, and what kind of conclusion is it?
      answer: |
        (A) Explanatory: whether the student chews gum (gum or no gum). Response: self-reported anxiety score (0 to 40). Units: the 60 student volunteers.
        (B) Form two blocks: the 30 sophomores and the 30 seniors. Within the sophomores, number the students 1 to 30 and use a random number generator to choose 15 different numbers; those students chew gum and the other 15 do not. Repeat separately for the seniors. All students take the same reading test in the same conditions, and anxiety scores are compared between gum and no gum within each block, then combined.
        (C) Chewing anything might relax students or change their expectations. With a wax placebo, both groups go through the act of chewing, so a difference in anxiety can be credited to the gum itself rather than to chewing or to the belief that chewing helps.
        (D) The teacher expects seniors to report less anxiety than sophomores, so grade is related to the response. Blocking removes that grade-to-grade variation from the comparison, making the effect of gum easier to detect.
        (E) Because treatments were randomly assigned, the teacher can conclude that chewing gum caused lower anxiety scores. Because the students were volunteers, not a random sample, the conclusion applies only to students like these volunteers, not to all students.
      explanation: |
        Six points.
        (A) 1 point: all three identified correctly in context.
        (B) 2 points: 1 for forming blocks by grade and randomly assigning treatments separately within each block (a random mechanism, equal or stated group sizes); 1 for comparing the treatments within blocks with other conditions held the same.
        (C) 1 point: explains that a placebo-like comparison balances the effect of chewing (or of expectations) across groups, isolating the effect of the gum.
        (D) 1 point: grade is believed to affect anxiety, so blocking reduces variability in the comparison.
        (E) 1 point: cause and effect (random assignment) for students like the volunteers only (no random selection).
