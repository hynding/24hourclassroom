week: 5
unit: 1
title: Comparing Distributions of a Quantitative Variable
topics: ["1.9"]
guide: guides/week-05.md
guide_description: |
  Comparing two or more distributions of one quantitative variable: the four features (shape, center,
  variability, unusual features) written with comparative language and in context, the displays that put groups
  side by side (back-to-back stemplots, parallel boxplots, stacked dotplots and histograms on a common scale),
  choosing resistant or non-resistant summaries to match the shapes, and the investigative question that names
  the groups being compared. Worked examples: commute times at two hypothetical high schools in a back-to-back
  stemplot, nightly sleep of 9th and 12th graders from two five-number summaries (with an outlier check), plant
  heights under LED and fluorescent lights compared with means and standard deviations, and one comparison
  rewritten from a weak answer into a full-credit one.
flashcards_description: |
  32 cards on comparing distributions: the four features in comparative language, reading back-to-back
  stemplots and parallel boxplots, matching summary statistics to shape, relative frequency for groups of
  different sizes, and the classic errors in written comparisons.

flashcards:
  - front: Comparing two distributions → the four features to address
    back: |
      Shape, center, variability and unusual features (outliers, gaps, clusters), for every group, in context.
    topic_code: "1.9"
  - front: Comparing two distributions → what "comparative language" means
    back: |
      Use words such as greater than, less than, about the same as, more variable than. Listing each group's statistics side by side without comparing them does not earn credit.
    topic_code: "1.9"
  - front: Comparing centers of two skewed distributions → which statistic
    back: |
      Compare medians. The median is resistant, so a long tail or an outlier does not drag it.
    topic_code: "1.9"
  - front: Comparing variability when one group has an outlier → which statistic
    back: |
      Compare IQRs. The standard deviation and range are pulled upward by an outlier; the IQR is not.
    topic_code: "1.9"
  - front: Comparing two roughly symmetric distributions with no outliers → statistics to use
    back: |
      Means and standard deviations are fine (medians and IQRs are also acceptable). Use the same pair for both groups.
    topic_code: "1.9"
  - front: One group skewed, the other symmetric → which summaries to compare
    back: |
      Use medians and IQRs for both groups, so the comparison is like with like.
    topic_code: "1.9"
  - front: Back-to-back stemplot → how to read the left side
    back: |
      The stems are shared in the middle. Leaves on the left are read from the stem outward, so "8 2 | 6" on the left means 62 and 68.
    topic_code: "1.9"
  - front: Back-to-back stemplot → what it is good for
    back: |
      Comparing two groups of modest size (roughly 10 to 50 values each) while keeping every data value visible.
    topic_code: "1.9"
  - front: Parallel boxplots → what they make easy to compare
    back: |
      Medians, quartiles, IQRs, ranges and outliers across several groups on one common scale.
    topic_code: "1.9"
  - front: Parallel boxplots → three things they cannot show
    back: |
      The number of observations in each group, the mean, and gaps or clusters inside a box or whisker (a bimodal shape can hide in a boxplot).
    topic_code: "1.9"
  - front: Median of one group above the third quartile of another → what it means
    back: |
      At least half of the first group's values exceed about 75% of the second group's values: a large difference in center.
    topic_code: "1.9"
  - front: Stacked dotplots or histograms for comparison → the axis rule
    back: |
      Use the same scale on the horizontal axis for every group, lined up vertically, or the eye compares the wrong positions.
    topic_code: "1.9"
  - front: Histograms of groups with different sample sizes → what to plot
    back: |
      Relative frequency (proportion or percent) on the vertical axis, so a larger group does not look "bigger" just because it has more values.
    topic_code: "1.9"
  - front: Comparing variability → "more variable" in context
    back: |
      "Lakeside's race times vary more than Ridgeview's (IQR 2.8 vs 2.1 minutes)": the times are more spread out, not "higher".
    topic_code: "1.9"
  - front: Overlap between two distributions → why it matters
    back: |
      A difference in centers with heavy overlap means many individuals in the "lower" group still exceed many in the "higher" group. Say "tend to", not "all".
    topic_code: "1.9"
  - front: '"Tend to" language in a comparison → why it is used'
    back: |
      Distributions describe groups, not every individual. "Seniors tend to sleep less than freshmen" is correct; "every senior sleeps less" usually is not.
    topic_code: "1.9"
  - front: Investigative question for a comparison → its parts
    back: |
      It names the population(s), the quantitative variable and the groups compared, and anticipates variability: "Do students at North tend to have shorter commutes than students at South?"
    topic_code: "1.9"
  - front: Commute times, North vs South (week 5 example) → the comparison
    back: |
      North: right-skewed with a high outlier (47 min), median 18, IQR 10. South: roughly symmetric, median 28, IQR 10. North's typical commute is shorter; spreads are similar by IQR.
    topic_code: "1.9"
  - front: Sleep, 9th vs 12th graders (week 5 example) → key fact from the boxplots
    back: |
      The 9th-grade median (7.75 h) is above the 12th-grade Q3 (7.25 h), so more than half of 9th graders sleep more than about three quarters of seniors.
    topic_code: "1.9"
  - front: Plant heights, LED vs fluorescent (week 5 example) → the comparison
    back: |
      Both roughly symmetric, no outliers. LED mean 21.8 cm vs fluorescent 17.9 cm (about 3.9 cm taller); SDs about equal (2.0 vs 1.9 cm).
    topic_code: "1.9"
  - front: Mean noticeably greater than median in one group → what it suggests
    back: |
      Right skew or a high outlier in that group, pulling the mean up. Check with a graph before choosing summaries.
    topic_code: "1.9"
  - front: Same median and IQR in two groups → can the shapes differ?
    back: |
      Yes. The five-number summaries can match while one group is bimodal and the other is unimodal, or the tails differ beyond the quartiles.
    topic_code: "1.9"
  - front: Outliers in a comparison → what to do with them
    back: |
      Identify them (1.5 × IQR rule or two SDs, whichever the question uses), name them in context, and do not delete them unless they are errors.
    topic_code: "1.9"
  - front: Comparing more than two groups → efficient display
    back: |
      Parallel boxplots on one axis; describe the order of the centers and which group is most and least variable.
    topic_code: "1.9"
  - front: Context in a comparison → what to include
    back: |
      The variable and its units, and the group names: "minutes of commute for North students", not "the data" or "group 1".
    topic_code: "1.9"
  - front: Difference in centers → how to state it with a number
    back: |
      "The median for South is about 10 minutes greater than the median for North (28 vs 18 minutes)." A size, a direction and units.
    topic_code: "1.9"
  - front: Shape in a comparison → what to say
    back: |
      Name each shape (roughly symmetric, skewed left/right, uniform, unimodal or bimodal) and say whether the shapes are similar or different.
    topic_code: "1.9"
  - front: A comparison does not prove a cause → why
    back: |
      Observed groups (athletes vs non-athletes, 9th vs 12th graders) differ in many ways. Cause and effect needs a randomized experiment (week 7).
    topic_code: "1.9"
  - front: Larger spread in one group → what it means for prediction
    back: |
      A single value from that group is harder to predict: individuals differ more from the group's center.
    topic_code: "1.9"
  - front: Error-spot → "Lakeside's median time is greater, so Lakeside's runners are faster"
    back: |
      A greater race time is slower. Read the variable's meaning before turning a comparison into words.
    topic_code: "1.9"
  - front: Error-spot → "Period 2 mean 79, SD 9; Period 5 mean 78, SD 13" as a full comparison
    back: |
      Numbers listed side by side compare nothing. Say which is greater or more variable, by about how much, and describe shape and outliers too.
    topic_code: "1.9"
  - front: Error-spot → "the boxplot for seniors is longer, so there are more seniors"
    back: |
      A longer box or whisker means more spread, not more people. Boxplots do not show sample size.
    topic_code: "1.9"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 1.9: comparing distributions of a quantitative
    variable with comparative language, back-to-back stemplots, parallel boxplots and matched summary statistics),
    with 9 questions (39%) reviewing weeks 1 to 4 (variables, frequency tables, graphs of categorical and
    quantitative data, describing shape, summary statistics and the 1.5 × IQR outlier rule). Opens with a
    four-question shared-context set on two cross-country teams. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes. A calculator is allowed throughout.
  questions:
    # ---- Stimulus set: two cross-country teams (1.9, 1.8, 1.7)
    - slug: apstats-u01-w05-q01
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      stimulus: |
        A coach recorded the 5-kilometre race times, in minutes, of the 14 runners on each of two hypothetical cross-country teams at the same meet.

        | Team | n | Mean | SD | Min | Q1 | Median | Q3 | Max |
        |---|---|---|---|---|---|---|---|---|
        | Ridgeview | 14 | 21.4 | 1.6 | 18.9 | 20.3 | 21.2 | 22.4 | 24.8 |
        | Lakeside | 14 | 22.9 | 3.1 | 19.5 | 20.8 | 21.9 | 23.6 | 33.0 |
      prompt: |
        The coach wants one measure of center and one measure of variability to compare the two teams fairly. Which pair is most appropriate?
      options:
        - "Means and standard deviations, because both teams have the same number of runners"
        - "Medians and IQRs, because Lakeside's distribution has a high outlier that pulls its mean and standard deviation upward"
        - "Means and IQRs, because the mean uses every runner and the IQR ignores the extremes"
        - "Ranges only, because the fastest and slowest runners decide a team's result"
      option_explanations:
        - |
          Equal sample sizes do not protect the mean and SD from an outlier. Lakeside's 33.0 is far above its other times, so its mean (22.9) sits well above its median (21.9).
        - |
          Correct. Lakeside's upper fence is 23.6 + 1.5(2.8) = 27.8, so 33.0 is an outlier. Medians and IQRs are resistant, so they compare typical times and spreads without being dragged by one runner.
        - |
          Mixing a non-resistant center with a resistant spread is inconsistent, and the mean is exactly the statistic the outlier distorts here.
        - |
          The range uses only the two most extreme values, so Lakeside's single 33.0 decides it. It says nothing about the typical runner.
      answer: 1
    - slug: apstats-u01-w05-q02
      type: numeric
      topic_code: "1.8"
      source: "AP Statistics CED, Topic 1.8"
      points: 1
      stimulus: |
        A coach recorded the 5-kilometre race times, in minutes, of the 14 runners on each of two hypothetical cross-country teams at the same meet.

        | Team | n | Mean | SD | Min | Q1 | Median | Q3 | Max |
        |---|---|---|---|---|---|---|---|---|
        | Ridgeview | 14 | 21.4 | 1.6 | 18.9 | 20.3 | 21.2 | 22.4 | 24.8 |
        | Lakeside | 14 | 22.9 | 3.1 | 19.5 | 20.8 | 21.9 | 23.6 | 33.0 |
      prompt: |
        Using the 1.5 × IQR rule, find the upper fence for Lakeside's times, in minutes. Give your answer to one decimal place.
      answer: { value: 27.8, tolerance: 0.05 }
      explanation: |
        IQR = Q3 − Q1 = 23.6 − 20.8 = 2.8 minutes. Upper fence = Q3 + 1.5 × IQR = 23.6 + 4.2 = 27.8 minutes. Lakeside's maximum, 33.0, is above it, so it is an outlier.
    - slug: apstats-u01-w05-q03
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      stimulus: |
        A coach recorded the 5-kilometre race times, in minutes, of the 14 runners on each of two hypothetical cross-country teams at the same meet.

        | Team | n | Mean | SD | Min | Q1 | Median | Q3 | Max |
        |---|---|---|---|---|---|---|---|---|
        | Ridgeview | 14 | 21.4 | 1.6 | 18.9 | 20.3 | 21.2 | 22.4 | 24.8 |
        | Lakeside | 14 | 22.9 | 3.1 | 19.5 | 20.8 | 21.9 | 23.6 | 33.0 |
      prompt: |
        Which statement is a correct comparison of the two distributions?
      options:
        - "Lakeside's runners are faster, because Lakeside's median time is greater than Ridgeview's."
        - "Ridgeview's times are more variable, because Ridgeview's standard deviation is smaller."
        - "Every Lakeside runner was slower than every Ridgeview runner."
        - "Lakeside's median time (21.9 min) is greater than Ridgeview's (21.2 min), and Lakeside's times are more variable (IQR 2.8 vs 2.1 min)."
      option_explanations:
        - |
          A greater race time means a slower runner. Lakeside's greater median says its typical runner was slower, not faster.
        - |
          A smaller standard deviation means less spread, not more. This reverses the meaning of the statistic.
        - |
          Lakeside's fastest time (19.5) beats Ridgeview's median (21.2), so the distributions overlap heavily. A difference in centers describes tendencies, not every individual.
        - |
          Correct. The medians differ by 0.7 minutes in Lakeside's direction, and the IQRs are 23.6 − 20.8 = 2.8 and 22.4 − 20.3 = 2.1, so Lakeside's middle half is more spread out.
      answer: 3
    - slug: apstats-u01-w05-q04
      type: multiple_choice
      topic_code: "1.7"
      source: "AP Statistics CED, Topic 1.7"
      points: 1
      stimulus: |
        A coach recorded the 5-kilometre race times, in minutes, of the 14 runners on each of two hypothetical cross-country teams at the same meet.

        | Team | n | Mean | SD | Min | Q1 | Median | Q3 | Max |
        |---|---|---|---|---|---|---|---|---|
        | Ridgeview | 14 | 21.4 | 1.6 | 18.9 | 20.3 | 21.2 | 22.4 | 24.8 |
        | Lakeside | 14 | 22.9 | 3.1 | 19.5 | 20.8 | 21.9 | 23.6 | 33.0 |
      prompt: |
        Lakeside's 33.0-minute runner turned out to have stopped with a cramp, and the coach removes that time. What happens to Lakeside's mean and median?
      options:
        - "The mean drops to about 22.1 minutes; the median changes very little."
        - "The median drops by about 0.8 minutes; the mean changes very little."
        - "Both drop by about 0.8 minutes."
        - "Neither changes, because only one of 14 values was removed."
      option_explanations:
        - |
          Correct. The total of the 14 times is 22.9 × 14 = 320.6, so the new mean is (320.6 − 33.0)/13 ≈ 22.1. The median moves from the average of the 7th and 8th values to the 7th value, a small shift, because the median is resistant.
        - |
          This swaps the two statistics. The median depends only on the middle of the ordered list; the mean uses the size of every value, so it reacts to the outlier.
        - |
          The mean and median do not respond equally to an extreme value: the mean is non-resistant and the median is resistant.
        - |
          The mean uses every value, so removing a value 10 minutes above the rest certainly changes it, from 22.9 to about 22.1.
      answer: 0
    # ---- Comparing distributions (1.9)
    - slug: apstats-u01-w05-q05
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      prompt: |
        A teacher gave the same 100-point unit test to two class periods. The back-to-back stemplot shows the scores (14 students in each period). Key: 7 | 2 means 72.

        ```
            Period 2 |   | Period 5
                     | 5 | 5
                 8 2 | 6 | 4 6
           8 7 5 4 1 | 7 | 0 2 3 6 9
           8 6 4 3 1 | 8 | 0 2 5
                 3 0 | 9 | 1 7 9
        ```

        Which statement is best supported by the stemplot?
      options:
        - "Period 2 scored much higher, because its leaves are written on the left."
        - "Period 5's median is about 10 points lower than Period 2's."
        - "The medians are close (79.5 and 77.5), but Period 5's scores are more spread out (range 44 vs 31 points)."
        - "Period 5 has an outlier at 55, because it is the only score in the 50s."
      option_explanations:
        - |
          Which side a group is drawn on has no meaning. The leaves on the left are simply read from the stem outward.
        - |
          The 7th and 8th ordered scores give medians of (78 + 81)/2 = 79.5 for Period 2 and (76 + 79)/2 = 77.5 for Period 5: 2 points apart, not 10.
        - |
          Correct. Medians 79.5 and 77.5 differ by 2 points. Ranges: 93 − 62 = 31 and 99 − 55 = 44, and the IQRs (12 vs 15) agree that Period 5 is more variable.
        - |
          Being alone in a stem is not the outlier rule. For Period 5, Q1 = 70 and Q3 = 85, so the lower fence is 70 − 22.5 = 47.5, and 55 is not an outlier.
      answer: 2
    - slug: apstats-u01-w05-q06
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      prompt: |
        A school surveyed students about their daily phone screen time, in hours. Five-number summaries for the two grades are below.

        | Grade | Min | Q1 | Median | Q3 | Max |
        |---|---|---|---|---|---|
        | 10th | 1.0 | 3.0 | 4.5 | 6.0 | 9.5 |
        | 12th | 0.5 | 2.0 | 3.0 | 4.5 | 8.0 |

        Which conclusion is supported by these summaries?
      options:
        - "About half of the 10th graders reported more screen time than about three quarters of the 12th graders."
        - "More 10th graders than 12th graders were surveyed, because the 10th-grade values are larger."
        - "The mean screen time is 4.5 hours for 10th graders and 3.0 hours for 12th graders."
        - "Every 10th grader reported more screen time than every 12th grader."
      option_explanations:
        - |
          Correct. The 10th-grade median (4.5 h) equals the 12th-grade Q3 (4.5 h): about 50% of 10th graders are above 4.5 hours, while about 75% of 12th graders are at or below it.
        - |
          A five-number summary does not show how many students are in each group. Larger values are not more people.
        - |
          These are the medians. A five-number summary does not give the mean, and the two need not be equal.
        - |
          The ranges overlap almost completely (1.0–9.5 and 0.5–8.0), so many 12th graders exceed many 10th graders.
      answer: 0
    - slug: apstats-u01-w05-q07
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      prompt: |
        A student wants to compare the heights of 25 players in a youth volleyball league with the heights of 180 students in the same grade at a middle school, using two histograms stacked one above the other. What should the vertical axes show so the comparison is fair?
      options:
        - "Frequency, because the counts show where most people are"
        - "Frequency, with the volleyball histogram drawn taller to make up for the smaller group"
        - "Height, because height is the variable of interest"
        - "Relative frequency (percent of each group), on the same horizontal scale"
      option_explanations:
        - |
          With 180 students against 25 players, the student bars would tower over the player bars at every height, hiding the shapes and centers.
        - |
          Stretching one graph by eye is not a fair fix; converting each bar to a proportion of its group is.
        - |
          Height belongs on the horizontal axis of a histogram; the vertical axis shows how many or what proportion fall in each interval.
        - |
          Correct. Percents put groups of different sizes on the same footing, and a shared horizontal scale lets the eye compare centers and spreads directly.
      answer: 3
    - slug: apstats-u01-w05-q08
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      prompt: |
        Monthly electricity bills for 40 apartments in one building are roughly symmetric with no outliers. Bills for 40 houses on a nearby street are strongly skewed to the right. Which summaries should be used to compare the two groups' centers and variability?
      options:
        - "The mean and SD for the apartments and the median and IQR for the houses"
        - "The median and IQR for both groups"
        - "The mean and SD for both groups, because both groups have 40 values"
        - "The range for both groups, because it is the simplest measure"
      option_explanations:
        - |
          Each statistic may suit its own group, but comparing a mean with a median (or an SD with an IQR) is not like with like.
        - |
          Correct. The houses' skew makes the mean and SD misleading for them, and a fair comparison uses the same resistant pair, median and IQR, for both groups.
        - |
          Equal sample sizes do not fix skew: the long right tail pulls the houses' mean and SD upward.
        - |
          The range uses only the two extremes and is the measure most affected by a long tail.
      answer: 1
    - slug: apstats-u01-w05-q09
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      prompt: |
        Which is a statistical investigative question that calls for comparing two distributions of a quantitative variable?
      options:
        - "How many hours did you sleep last night?"
        - "What percent of students at our school play a sport?"
        - "Do students at our school who play a sport tend to sleep more on school nights than students who do not?"
        - "Did Maya sleep more than Jordan last night?"
      option_explanations:
        - |
          This is a survey question asked of one person. It collects data but does not ask about a group or a comparison.
        - |
          This asks about one categorical variable (plays a sport: yes or no) for one group, summarised by a proportion.
        - |
          Correct. It names the population (students at our school), the quantitative variable (school-night sleep) and the two groups, and "tend to" anticipates variability within each group.
        - |
          This compares two individuals. A statistical question is about a group and expects variability in the answers.
      answer: 2
    # ---- Review (weeks 1-4)
    - slug: apstats-u01-w05-q10
      type: multiple_choice
      topic_code: "1.6"
      source: "AP Statistics CED, Topic 1.6"
      points: 1
      prompt: |
        A histogram of the prices of 60 used bikes listed on a hypothetical local marketplace has most bars between $50 and $200 and a few bars stretching out to $900. How should the shape be described?
      options:
        - "Skewed to the right"
        - "Skewed to the left"
        - "Roughly symmetric"
        - "Uniform"
      option_explanations:
        - |
          Correct. Most values pile up at the low end and a long tail stretches toward the high prices, which is right skew (the tail names the direction).
        - |
          Left skew has the long tail toward small values. Here the tail stretches toward large prices.
        - |
          A symmetric histogram has matching left and right halves; this one has a long tail on one side only.
        - |
          A uniform histogram has bars of about equal height across the range, not a pile at one end.
      answer: 0
    - slug: apstats-u01-w05-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Statistics CED, Topic 1.2"
      points: 1
      prompt: |
        A cafeteria records, for each student who buys lunch, the student's ID number, grade level (9 to 12), the entrée chosen, and the total cost of the lunch. Which variable is quantitative?
      options:
        - "Student ID number"
        - "Entrée chosen"
        - "Grade level, when it is used only to label which grade a student is in"
        - "Total cost of the lunch"
      option_explanations:
        - |
          An ID number is a label. Averaging ID numbers means nothing, so it is categorical even though it is written with digits.
        - |
          The entrée places each student in a category (pasta, salad, sandwich...), so it is categorical.
        - |
          Used as a label for groups, grade level is categorical; arithmetic on the labels is not the point.
        - |
          Correct. Cost is a measured amount in dollars, and differences and averages of costs are meaningful.
      answer: 3
    - slug: apstats-u01-w05-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Statistics CED, Topic 1.4"
      points: 1
      prompt: |
        A student council asked 150 students which of five fundraisers they prefer and recorded one choice per student. Which display is appropriate for these data?
      options:
        - "A histogram with the five fundraisers on the horizontal axis"
        - "A bar chart of the percent of students choosing each fundraiser"
        - "A boxplot of the fundraiser choices"
        - "A stemplot of the fundraiser choices"
      option_explanations:
        - |
          A histogram needs a quantitative variable on a number line. Fundraiser choice is categorical, so its bars should be separated and in any order.
        - |
          Correct. Fundraiser preference is one categorical variable, and a bar chart of counts or percents displays its distribution.
        - |
          A boxplot needs a median and quartiles, which do not exist for categories with no numerical order.
        - |
          A stemplot splits numbers into stems and leaves; category names cannot be split that way.
      answer: 1
    - slug: apstats-u01-w05-q13
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Statistics CED, Topic 1.5"
      points: 1
      prompt: |
        A dotplot shows the number of books read over the summer by 20 students. Which feature can be read from the dotplot but not from a boxplot of the same data?
      options:
        - "The median"
        - "The interquartile range"
        - "The individual data values, including any gaps or clusters"
        - "The minimum and maximum"
      option_explanations:
        - |
          A boxplot marks the median with the line inside the box, so both displays show it.
        - |
          The IQR is the width of the box, so a boxplot shows it directly.
        - |
          Correct. A dotplot keeps every value, so gaps, clusters and repeated values are visible. A boxplot reduces the data to five numbers and any outliers.
        - |
          A boxplot shows the extremes at the ends of its whiskers (or as outlier points).
      answer: 2
    # ---- Select-all
    - slug: apstats-u01-w05-q14
      type: multi_select
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 2
      partial_credit: true
      prompt: |
        Parallel boxplots show the weekly hours worked at part-time jobs by students at two schools.

        | School | Min | Q1 | Median | Q3 | Max |
        |---|---|---|---|---|---|
        | Central | 4 | 8 | 12 | 15 | 22 |
        | Hillcrest | 2 | 5 | 8 | 12 | 30 |

        Hillcrest's maximum (30) is plotted as an outlier. Which statements are supported? Select all that apply.
      options:
        - "Central's median is 4 hours greater than Hillcrest's."
        - "The IQRs are equal (7 hours each)."
        - "Hillcrest has more students who work, because its whisker is longer."
        - "At least 75% of Hillcrest students work 12 hours or fewer, the same as Central's median."
        - "Hillcrest's mean must be greater than Central's mean, because of the outlier."
      option_explanations:
        - |
          Correct. 12 − 8 = 4 hours, so Central's typical student works about 4 more hours a week.
        - |
          Correct. Central: 15 − 8 = 7; Hillcrest: 12 − 5 = 7. The middle halves are equally spread.
        - |
          A longer whisker shows a wider spread of values, not a larger number of students. Boxplots do not show sample size.
        - |
          Correct. Hillcrest's Q3 is 12, so about 75% of its students work 12 hours or fewer, and 12 is Central's median.
        - |
          An outlier pulls Hillcrest's mean up, but not necessarily above Central's; the boxplots do not give the means, so this cannot be concluded.
      answer: [0, 1, 3]
    - slug: apstats-u01-w05-q15
      type: multi_select
      topic_code: "1.7"
      source: "AP Statistics CED, Topic 1.7"
      points: 2
      partial_credit: true
      prompt: |
        A data set of daily step counts for a class contains one value far above the rest. Which statistics are resistant to that extreme value? Select all that apply.
      options:
        - "The median"
        - "The mean"
        - "The interquartile range"
        - "The standard deviation"
        - "The first quartile"
      option_explanations:
        - |
          Correct. The median depends only on the middle position of the ordered data, so one extreme value barely moves it.
        - |
          The mean adds every value, so one very large step count pulls it upward.
        - |
          Correct. The IQR uses Q1 and Q3, which sit inside the data and ignore how far the extreme value lies.
        - |
          The SD squares deviations from the mean, so a far-off value inflates it heavily.
        - |
          Correct. Q1 is the median of the lower half; an extreme high value does not affect it.
      answer: [0, 2, 4]
    # ---- True/false
    - slug: apstats-u01-w05-q16
      type: true_false
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      prompt: |
        True or false: If two distributions of test scores have the same median and the same IQR, they must have the same shape.
      answer: false
      explanation: |
        False. Equal medians and IQRs describe only the center and the middle half. One distribution could be bimodal and the other unimodal, or the tails beyond the quartiles could be very different (one skewed, one symmetric).
    - slug: apstats-u01-w05-q17
      type: true_false
      topic_code: "1.8"
      source: "AP Statistics CED, Topic 1.8"
      points: 1
      prompt: |
        True or false: A boxplot of waiting times at a clinic can look perfectly ordinary even when the waiting times form two separate clusters.
      answer: true
      explanation: |
        True. A boxplot shows only the five-number summary and outliers. A gap between two clusters can fall inside the box or a whisker and disappear; a dotplot, stemplot or histogram would show it.
