    # ---- Numeric
    - slug: apstats-u01-w05-q20
      type: numeric
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 1
      prompt: |
        Minutes spent on homework last night, for two small study groups:

        Group 1: 12, 15, 15, 18, 21, 24, 30
        Group 2: 9, 10, 14, 16, 16, 19, 22, 25

        Find (median of Group 1) − (median of Group 2), in minutes. Give an exact answer.
      answer: { value: 2, tolerance: 0.01 }
      explanation: |
        Group 1 has 7 values, so its median is the 4th: 18. Group 2 has 8 values, so its median is the average of the 4th and 5th: (16 + 16)/2 = 16. The difference is 18 − 16 = 2 minutes: Group 1's typical homework time was 2 minutes longer.
    # ---- Short answer
    - slug: apstats-u01-w05-q21
      type: short_answer
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 3
      prompt: |
        A hypothetical bakery timed how long, in minutes, customers waited for a custom cake order at its two locations over one month. A student summarised the data like this:

        | Location | n | Shape | Median | IQR | Outliers |
        |---|---|---|---|---|---|
        | Downtown | 30 | skewed right | 14 | 9 | 41, 46 |
        | Mall | 30 | roughly symmetric | 11 | 5 | none |

        Write a comparison of the two distributions of waiting time that addresses shape, center, variability and unusual features, in context and with comparative language.
      answer: |
        Shape: Downtown's waiting times are skewed to the right, while the Mall's are roughly symmetric.
        Center: the median wait at Downtown (14 minutes) is about 3 minutes greater than at the Mall (11 minutes).
        Variability: Downtown's waits are more variable than the Mall's (IQR 9 minutes versus 5 minutes).
        Unusual features: Downtown has two high outliers (41 and 46 minutes); the Mall has none.
      explanation: |
        Three points.
        1 point: shape and unusual features for both locations (skewed right with outliers 41 and 46 at Downtown; roughly symmetric with no outliers at the Mall).
        1 point: center compared with comparative language ("Downtown's median wait is greater than the Mall's", with 14 vs 11 minutes or a difference of about 3 minutes).
        1 point: variability compared with comparative language (Downtown more variable, IQR 9 vs 5 minutes).
        Deduct a point (once) if the answer has no context (no mention of waiting time or the locations), or if statistics are listed without being compared.
    - slug: apstats-u01-w05-q22
      type: short_answer
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 2
      prompt: |
        Daily high temperatures in July for two hypothetical cities have these summaries.

        | City | Mean | Median | SD | IQR |
        |---|---|---|---|---|
        | Port Ellis | 78.2 °F | 78.0 °F | 3.1 °F | 4.0 °F |
        | Dry Mesa | 96.4 °F | 99.0 °F | 7.8 °F | 6.0 °F |

        (a) What does the relationship between the mean and the median suggest about the shape of each distribution?
        (b) Which pair of statistics would you use to compare the two cities, and why?
      answer: |
        (a) Port Ellis: the mean (78.2) and median (78.0) are almost equal, suggesting a roughly symmetric distribution. Dry Mesa: the mean (96.4) is noticeably less than the median (99.0), suggesting left skew (a tail of cooler days pulling the mean down).
        (b) Median and IQR for both cities, because Dry Mesa's distribution appears skewed, and the median and IQR are resistant to the tail; using the same pair for both keeps the comparison like with like.
      explanation: |
        Two points.
        1 point: (a) roughly symmetric for Port Ellis (mean ≈ median) and skewed left for Dry Mesa (mean < median), each linked to the mean–median relationship.
        1 point: (b) median and IQR for both cities, justified by the apparent skew in Dry Mesa (resistance) and the need to use the same statistics for both groups.
    # ---- Long answer
    - slug: apstats-u01-w05-q23
      type: long_answer
      topic_code: "1.9"
      source: "AP Statistics CED, Topic 1.9"
      points: 6
      prompt: |
        A student asked 12 classmates who play a school sport and 12 who do not how many minutes they exercised outside of practice yesterday.

        Sport: 35, 42, 48, 50, 55, 58, 60, 62, 65, 70, 75, 120
        No sport: 0, 5, 10, 12, 15, 18, 20, 22, 25, 30, 35, 40

        (A) Write a statistical investigative question that these data could help answer.

        (B) Find the five-number summary for each group.

        (C) Use the 1.5 × IQR rule to determine whether either group has an outlier. Show your work.

        (D) Compare the two distributions of exercise time, in context.

        (E) A friend concludes, "Playing a school sport makes students exercise more outside practice." Explain why these data cannot support that conclusion.
      answer: |
        (A) For example: "Among students in our class, do those who play a school sport tend to exercise more outside practice than those who do not?"
        (B) Sport: min 35, Q1 49, median 59, Q3 67.5, max 120. No sport: min 0, Q1 11, median 19, Q3 27.5, max 40.
        (C) Sport: IQR = 67.5 − 49 = 18.5; fences 49 − 27.75 = 21.25 and 67.5 + 27.75 = 95.25. 120 > 95.25, so 120 is an outlier. No sport: IQR = 16.5; fences 11 − 24.75 = −13.75 and 27.5 + 24.75 = 52.25. All values lie between the fences: no outliers.
        (D) The median exercise time for sport players (59 minutes) is about 40 minutes greater than for non-players (19 minutes). The variability is similar (IQR 18.5 vs 16.5 minutes). Apart from the high outlier at 120 minutes among sport players, both distributions are roughly symmetric. The distributions barely overlap: every sport player exercised at least 35 minutes, more than all but two non-players.
        (E) This is an observational comparison of students who chose whether to play a sport, not an experiment with random assignment. Students who play sports may differ in other ways (they may enjoy exercise more, or have more free time), so the difference cannot be attributed to playing a sport. The classmates are also not a random sample of a larger population.
      explanation: |
        Six points.
        (A) 1 point: a question about a group (not individuals) that names the quantitative variable (exercise time) and the two groups being compared.
        (B) 1 point: both five-number summaries correct (Q1 and Q3 as medians of the lower and upper halves; accept calculator quartiles if consistent).
        (C) 1 point: both IQRs and fences shown, with 120 identified as an outlier among sport players and none among non-players.
        (D) 2 points: 1 point for comparing centers with comparative language and numbers (59 vs 19 minutes); 1 point for comparing variability (similar IQRs) and mentioning shape or the outlier. Context (exercise minutes, the two groups) required for full credit.
        (E) 1 point: identifies the study as observational (no random assignment of sport participation) and names a plausible other difference between the groups, so cause and effect cannot be concluded.
