      source: "AP Statistics CED, Topic 3.5"
      points: 1
      prompt: |
        True or false: For a test about the proportion of a factory's light bulbs that fail early, it is acceptable to write the hypotheses as H₀: p̂ = 0.04 and Hₐ: p̂ > 0.04.
      answer: false
      explanation: |
        False. Hypotheses are always about the parameter: H₀: p = 0.04 and Hₐ: p > 0.04, where p = the proportion of all the factory's bulbs that fail early. The sample proportion p̂ is known once the data are collected.
