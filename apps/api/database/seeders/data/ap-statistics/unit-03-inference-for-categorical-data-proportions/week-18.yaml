      points: 1
      prompt: |
        A city says 25% of its residents use the bike-share system. A survey of a simple random sample of 300 residents finds 93 users. Compute the test statistic z for H₀: p = 0.25 against Hₐ: p > 0.25. Give your answer to two decimal places.
      answer: { value: 2.40, tolerance: 0.006 }
      explanation: |
        p̂ = 93/300 = 0.31. SD = √(0.25 · 0.75 / 300) = 0.025. z = (0.31 − 0.25)/0.025 = 2.40. (Large Counts: 75 and 225 are both at least 10.)
    - slug: apstats-u03-w18-q20
      type: short_answer
      topic_code: "3.8"
      source: "AP Statistics CED, Topic 3.8"
      points: 3
      prompt: |
        A hypothetical town tests H₀: p = 0.05 against Hₐ: p > 0.05, where p is the proportion of the town's private wells with unsafe nitrate levels. If the test gives convincing evidence for Hₐ, the town will pay for free water testing and filters for every household with a well.

        (a) Describe a Type I error in context and one consequence.
        (b) Describe a Type II error in context and one consequence.
        (c) Which error is more serious here, and should the town choose α = 0.01 or α = 0.10? Explain.
      answer: |
        (a) Type I: the town concludes that more than 5% of its private wells have unsafe nitrate levels when in fact only 5% do. Consequence: it spends money on testing and filters that were not needed.
        (b) Type II: the town does not find convincing evidence that more than 5% of wells are unsafe when in fact more than 5% are. Consequence: households keep drinking unsafe water without filters.
        (c) A Type II error is more serious, because it leaves people exposed to a health risk, while a Type I error only wastes money. The town should use α = 0.10: a larger α raises the power of the test and lowers the chance of a Type II error.
      explanation: |
        Three points, one per part. (a) the error described in context (conclude more than 5% unsafe when really 5%) with a plausible consequence. (b) the error in context (fail to find evidence when really more than 5%) with a consequence. (c) a choice of the more serious error with a reason and α = 0.10 linked to reducing Type II errors (choosing α = 0.01 earns the point only if it is consistently argued that a Type I error is more serious). Definitions without context earn no credit.
    - slug: apstats-u03-w18-q21
      type: short_answer
      topic_code: "3.4"
      source: "AP Statistics CED, Topic 3.4"
      points: 3
      prompt: |
        A 95% confidence interval for the proportion of all students at a large high school who want a later start time is (0.53, 0.64).

        (a) Is there convincing evidence that a majority of the school's students want a later start? Explain.
        (b) Is there convincing evidence that more than 60% want a later start? Explain.
        (c) Would a two-sided test of H₀: p = 0.50 at α = 0.05 reject H₀? Explain how you know without computing a p-value.
      answer: |
        (a) Yes. Every value in the interval is above 0.50, so 0.50 and every lower value are not plausible; there is convincing evidence that more than half of the school's students want a later start.
        (b) No. 0.60 is inside the interval, and so are values below it (such as 0.55), so it is plausible that 60% or fewer want a later start.
        (c) Yes. 0.50 is outside the 95% interval, and a two-sided test at α = 0.05 rejects H₀ when the null value is not a plausible value in the matching 95% interval.
      explanation: |
        Three points, one per part, each needing the reason tied to the interval: (a) yes, because 0.50 lies below the interval; (b) no, because 0.60 is inside it; (c) yes, because 0.50 is outside the 95% interval, which matches a two-sided test at α = 0.05. "Yes" or "no" with no reference to the interval earns no credit.
    - slug: apstats-u03-w18-q22
      type: long_answer
      topic_code: "3.7"
      source: "AP Statistics CED, Topic 3.7"
      points: 8
      prompt: |
        Last year 64% of the students at a hypothetical high school of 2,500 students passed the state fitness test. This year the school introduced a new physical education programme. The PE department wants to know whether the pass rate has increased. It selects a simple random sample of 200 students; 141 of them pass the test this year. Use α = 0.05.

        (A) State the hypotheses, defining the parameter.

        (B) Name the procedure and check the conditions.

        (C) Compute the test statistic and the p-value.

        (D) State your conclusion in context.

        (E) Which type of error could the department have made? Describe it in context.

        (F) The head of PE says the test proves the new programme caused the pass rate to rise. Give one reason this claim is not justified.
      answer: |
        (A) H₀: p = 0.64, Hₐ: p > 0.64, where p = the proportion of all students at the school who pass the fitness test this year.
        (B) One-sample z-test for a population proportion. Random: SRS. 10%: 200 ≤ 10% of 2,500 = 250. Large Counts: 200(0.64) = 128 and 200(0.36) = 72 are both at least 10.
        (C) p̂ = 141/200 = 0.705. SD = √(0.64 · 0.36 / 200) ≈ 0.0339. z = (0.705 − 0.64)/0.0339 ≈ 1.92. p-value = P(Z ≥ 1.92) ≈ 0.028.
        (D) Because the p-value of about 0.028 is less than α = 0.05, we reject H₀. There is convincing evidence that the proportion of all students at the school who pass the fitness test this year is greater than 0.64.
        (E) Type I error: concluding that the pass rate has increased above 64% when in fact it is still 64%.
        (F) This was not an experiment: there was no random assignment of students to the new programme and a comparison group, so other changes since last year (a different test day, a new student body, more practice) could explain the rise. A significance test also never "proves" anything.
      explanation: |
        Eight points. (A) 1 point: hypotheses about p with ">" and p defined in context. (B) 1 point: procedure named and all three conditions checked with numbers (Large Counts with p₀: 128 and 72). (C) 2 points: 1 for z ≈ 1.92 with the formula shown using p₀; 1 for the p-value ≈ 0.028 (0.027 to 0.028). (D) 2 points: 1 for the decision linked to the comparison of the p-value with α; 1 for the conclusion in context about all students with "convincing evidence" language. "Accept" or a conclusion about the sample loses this point. (E) 1 point: Type I, described in context. (F) 1 point: no random assignment or control group, so a causal conclusion is not supported (confounding named or described).
