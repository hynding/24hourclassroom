      partial_credit: true
      prompt: |
        A school's science club randomly assigns 120 pea seeds to be soaked overnight and 120 to be planted dry. 87 soaked seeds and 70 dry seeds sprout. The club plans a 90% two-sample z-interval for p_soak − p_dry. Which statements are correct? Select all that apply.
      options:
        - "The Random condition is met because the seeds were randomly assigned to the two treatments."
        - "The 10% condition must be checked by comparing 120 with 10% of all pea seeds of this variety."
        - "Large Counts is met because 87, 33, 70 and 50 are all at least 10."
        - "Large Counts is met because the total sample size, 240, is at least 30."
        - "The interval is about 0.142 ± 0.100."
      option_explanations:
        - |
          Correct. In an experiment, random assignment to treatments satisfies the Random condition.
        - |
          The 10% condition is for sampling without replacement from a population; in a randomized experiment it does not apply.
        - |
          Correct. Each group has at least 10 successes and 10 failures: 87 and 33 sprouted and not; 70 and 50.
        - |
          The "n ≥ 30" rule belongs to means. For proportions, check successes and failures in each group.
        - |
          Correct. 0.725 − 0.583 = 0.142; SE = √(0.725·0.275/120 + 0.583·0.417/120) ≈ 0.0607; 1.645 · 0.0607 ≈ 0.100.
      answer: [0, 2, 4]
