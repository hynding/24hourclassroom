    - slug: apstats-u03-w19-q22
      type: short_answer
      topic_code: "3.9"
      source: "AP Statistics CED, Topic 3.9"
      points: 3
      prompt: |
        At hypothetical North High, 40% of all students walk to school; at South High, 30% do. Each school has about 2,000 students. A reporter takes a random sample of 150 North students and an independent random sample of 120 South students.

        (a) Give the mean and standard deviation of the sampling distribution of p̂_N − p̂_S.
        (b) Explain why the sampling distribution is approximately normal and why the SD formula is appropriate.
        (c) Find the probability that the South sample has the higher proportion of walkers.
      answer: |
        (a) Mean = 0.40 − 0.30 = 0.10. SD = √(0.4·0.6/150 + 0.3·0.7/120) = √(0.0016 + 0.00175) ≈ 0.0579.
        (b) Large Counts: 150(0.4) = 60, 150(0.6) = 90, 120(0.3) = 36, 120(0.7) = 84 are all at least 10, so approximately normal. 10%: 150 and 120 are each less than 10% of about 2,000 students, so the SD formula applies.
        (c) South higher means p̂_N − p̂_S < 0. z = (0 − 0.10)/0.0579 ≈ −1.73; P(Z < −1.73) ≈ 0.042.
      explanation: |
        Three points, one per part. (a) mean 0.10 and SD ≈ 0.058 (both needed). (b) all four counts shown to be at least 10 and the 10% condition checked for both schools. (c) the event written as p̂_N − p̂_S < 0 and a probability of about 0.042 (0.04 accepted from a table).
    - slug: apstats-u03-w19-q23
      type: short_answer
      topic_code: "3.4"
      source: "AP Statistics CED, Topic 3.4"
      points: 3
      prompt: |
        A 95% confidence interval for the proportion of all students in a large hypothetical school district who have a part-time job is (0.31, 0.39). The superintendent says that 40% of the district's students have a part-time job.

        (a) Is the superintendent's claim plausible according to the interval? Explain.
        (b) Does the interval give convincing evidence that fewer than 40% of the district's students have a part-time job? Explain.
        (c) Name one value that the interval suggests is plausible for the true proportion.
      answer: |
        (a) No. 0.40 is not inside the interval, so it is not a plausible value for the true proportion.
        (b) Yes. Every plausible value in the interval, 0.31 to 0.39, is less than 0.40, so the interval gives convincing evidence that the true proportion is below 0.40.
        (c) Any value from 0.31 to 0.39, such as 0.35.
      explanation: |
        Three points. (a) "not plausible" because 0.40 is outside the interval. (b) "convincing evidence" because the whole interval is below 0.40 (not "proves"). (c) any value in the interval. Language about the sample rather than the population proportion loses the point for that part.
    - slug: apstats-u03-w19-q24
      type: long_answer
      topic_code: "3.10"
      source: "AP Statistics CED, Topic 3.10"
      points: 6
      prompt: |
        A hypothetical regional transit agency wants to compare interest in a new weekend bus line in two cities. It surveys a random sample of 240 adult commuters in Riverton (about 30,000 commuters) and an independent random sample of 230 adult commuters in Millbrook (about 25,000 commuters). In Riverton, 156 say they would use the line; in Millbrook, 121 say so.

        (A) Name the appropriate procedure for estimating the difference, and define the parameter in context.

        (B) Check the conditions for the procedure.

        (C) Construct a 95% confidence interval for the parameter.

        (D) Interpret the interval in context.

        (E) Interpret the 95% confidence level in context.
      answer: |
        (A) A two-sample z-interval for p_R − p_M, where p_R is the proportion of all adult commuters in Riverton who would use the weekend line and p_M is the same proportion for all adult commuters in Millbrook.
        (B) Random: two independent random samples. 10%: 240 < 10% of 30,000 and 230 < 10% of 25,000. Large Counts: 156, 84, 121 and 109 are all at least 10.
        (C) p̂_R = 156/240 = 0.650, p̂_M = 121/230 ≈ 0.526; difference ≈ 0.124. SE = √(0.65·0.35/240 + 0.526·0.474/230) ≈ 0.0451. 0.124 ± 1.96(0.0451) = 0.124 ± 0.088, from about 0.036 to 0.212.
        (D) We are 95% confident that the interval from 0.036 to 0.212 captures the true difference (Riverton minus Millbrook) in the proportions of all adult commuters who would use the weekend bus line.
        (E) If the agency repeatedly took independent random samples of these sizes from both cities and built a 95% interval each time, about 95% of those intervals would capture the true difference p_R − p_M.
      explanation: |
        Six points.
        (A) 1 point: procedure named (two-sample z-interval for a difference in proportions) and the parameter defined with both populations and the order of subtraction.
        (B) 2 points: 1 for Random and 10% for both cities; 1 for all four Large Counts shown to be at least 10. Writing "n ≥ 30" for Large Counts earns nothing for that point.
        (C) 1 point: interval (0.036, 0.212), allowing (0.035, 0.213) from rounding, with the point estimate and SE shown or the calculator procedure named with its inputs.
        (D) 1 point: "95% confident" that the interval captures the difference in population proportions, in context, with the order. Statements about samples or individual commuters earn nothing.
        (E) 1 point: long-run capture rate of the method over repeated sampling, in context. "95% probability that the true difference is in this interval" earns nothing.
