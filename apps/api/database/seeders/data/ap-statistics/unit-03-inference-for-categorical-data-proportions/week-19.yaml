        A statistic is an unbiased estimator when the mean of its sampling distribution equals the value of the ____ it estimates.
      answer: ["parameter", "population parameter", "the parameter"]
      explanation: |
        Unbiased means the sampling distribution is centered at the parameter. For example, the mean of the sampling distribution of p̂₁ − p̂₂ is p₁ − p₂.
