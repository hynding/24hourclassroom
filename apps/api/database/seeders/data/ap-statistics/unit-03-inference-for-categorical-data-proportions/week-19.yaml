    - slug: apstats-u03-w19-q17
      type: true_false
      topic_code: "3.9"
      source: "AP Statistics CED, Topic 3.9"
      points: 1
      prompt: |
        True or false: The standard deviation of the sampling distribution of p̂₁ − p̂₂ is equal to SD(p̂₁) + SD(p̂₂).
      answer: false
      explanation: |
        False. SD(p̂₁ − p̂₂) = √(p₁(1 − p₁)/n₁ + p₂(1 − p₂)/n₂): the p(1 − p)/n terms are added under one square root, which gives a value smaller than SD(p̂₁) + SD(p̂₂).
    - slug: apstats-u03-w19-q18
