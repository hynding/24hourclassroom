    - slug: apstats-u03-w15-q20
      type: short_answer
      topic_code: "3.1"
      source: "AP Statistics CED, Topic 3.1"
      points: 3
      prompt: |
        A school newspaper wants to estimate the proportion of all 2,000 students at its school who have a library card. The true proportion is 0.45. Two methods were simulated 500 times each:

        - Method 1: ask a simple random sample of 40 students. The 500 estimates had mean 0.451 and SD 0.079.
        - Method 2: ask the first 120 students who walk into the school library. The 500 estimates had mean 0.682 and SD 0.042.

        (a) Is each method biased or unbiased? Justify using the simulation results.
        (b) Which method has less variability, and why would you expect that?
        (c) Which method would you recommend, and what single change would make it even better?
      answer: |
        (a) Method 1 appears unbiased: its estimates are centred at 0.451, essentially the true 0.45. Method 2 is biased upward: centred at 0.682, far above 0.45, because students entering the library are more likely to have a library card.
        (b) Method 2 (SD 0.042 versus 0.079), because its samples are three times larger.
        (c) Method 1, because an unbiased method is preferred and low variability cannot make up for bias. Increasing Method 1's random sample size (for example to 120 or 200, still within 10% of 2,000) would reduce its variability.
      explanation: |
        Three points. (a) 1 point: both judgements, each justified by comparing the simulated mean with 0.45 (the reason for Method 2's bias in context is welcome but the comparison is required). (b) 1 point: Method 2 with the SD comparison and the larger sample size as the reason. (c) 1 point: Method 1 because it is unbiased, plus a larger random sample as the improvement. "Use Method 2 because it is less variable" earns no credit in (c).
    - slug: apstats-u03-w15-q21
      type: short_answer
      topic_code: "2.12"
      source: "AP Statistics CED, Topic 2.12"
      points: 3
      prompt: |
        A hypothetical state has 90,000 high school seniors, and 34% of them have a driver's licence. A researcher takes a simple random sample of 500 seniors; 182 of them have a licence. Describe each of the following in this context, naming its centre where you can:

        (a) the population distribution
        (b) the distribution of the sample data
        (c) the sampling distribution of p̂
      answer: |
        (a) The licence status of all 90,000 seniors: 34% "has a licence" and 66% "does not". Its parameter is p = 0.34.
        (b) The licence status of the 500 sampled seniors: 182 yes and 318 no, so p̂ = 182/500 = 0.364.
        (c) The distribution of p̂ over all possible random samples of 500 seniors: mean 0.34, SD = √(0.34 · 0.66 / 500) ≈ 0.0212 (500 ≤ 9,000), and approximately normal because 500(0.34) = 170 and 500(0.66) = 330 are both at least 10.
      explanation: |
        Three points, one per part. (a) all 90,000 seniors with p = 0.34. (b) the 500 sampled seniors with p̂ = 0.364. (c) the distribution of p̂ across all samples of 500 with mean 0.34 and either the SD (≈ 0.021) or the normal shape justified by Large Counts. Describing (a) or (b) as "normal" loses that point.
    - slug: apstats-u03-w15-q22
      type: long_answer
      topic_code: "3.2"
      source: "AP Statistics CED, Topic 3.2"
      points: 6
      prompt: |
        A hypothetical school district reports that 35% of its 9,000 high school students use a phone during family dinner on most nights. A researcher plans to take a simple random sample of 200 of these students.

        (A) Describe the shape, centre and variability of the sampling distribution of p̂, the sample proportion who use a phone during dinner. Check any conditions you rely on.

        (B) Find the probability that more than 40% of the sampled students use a phone during dinner.

        (C) The researcher's sample gives p̂ = 0.42. Assuming the district's 35% figure is correct, find the probability of a sample proportion of 0.42 or more. Does this result give a reason to doubt the district's figure? Explain.

        (D) How would the standard deviation of p̂ change if the researcher used samples of 800 students instead? Show the new value.
      answer: |
        (A) Shape: approximately normal, because np = 200(0.35) = 70 and n(1 − p) = 200(0.65) = 130 are both at least 10. Centre: mean of the sampling distribution of p̂ = 0.35. Variability: 200 ≤ 10% of 9,000 = 900, so SD(p̂) = √(0.35 · 0.65 / 200) ≈ 0.0337.
        (B) z = (0.40 − 0.35)/0.0337 ≈ 1.48; P(p̂ > 0.40) = P(Z > 1.48) ≈ 0.069.
        (C) z = (0.42 − 0.35)/0.0337 ≈ 2.08; P(p̂ ≥ 0.42) ≈ 0.019. Yes: if 35% were correct, only about 1.9% of random samples of 200 would give 42% or more, so a result this high is unusual and gives some reason to doubt that the district's proportion is 0.35 (it suggests the proportion is higher).
        (D) SD(p̂) = √(0.35 · 0.65 / 800) ≈ 0.0169, half of 0.0337, because the sample size was multiplied by 4. (800 ≤ 900, so the 10% condition still holds.)
      explanation: |
        Six points. (A) 2 points: 1 for the mean 0.35 and SD ≈ 0.034 with the 10% check in context; 1 for "approximately normal" justified by Large Counts with both counts (70 and 130). (B) 1 point: correct z (or normalcdf with mean and SD named) and probability ≈ 0.069 (0.069 to 0.070). (C) 2 points: 1 for probability ≈ 0.019; 1 for the conclusion that the result is unusual if p = 0.35, so the figure is in doubt, with the reasoning tied to the small probability. Saying the probability "proves" the district wrong earns at most 1 point in (C). (D) 1 point: SD ≈ 0.017 and the statement that it is halved because n is four times as large.
