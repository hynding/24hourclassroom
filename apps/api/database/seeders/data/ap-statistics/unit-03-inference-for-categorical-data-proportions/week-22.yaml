    - slug: apstats-u03-w22-q22
      type: short_answer
      topic_code: "3.14"
      source: "AP Statistics CED, Topic 3.14"
      points: 3
      prompt: |
        A hypothetical high school (about 1,100 athletes and 1,500 non-athletes) takes independent random samples of 100 athletes and 100 non-athletes and asks how much they usually sleep on school nights.

        | Group | Under 7 hours | 7 to 8 hours | Over 8 hours | Total |
        |---|---|---|---|---|
        | Athletes | 48 | 32 | 20 | 100 |
        | Non-athletes | 30 | 40 | 30 | 100 |
        | Total | 78 | 72 | 50 | 200 |

        (a) Name the appropriate chi-square test and state its hypotheses.
        (b) Compute the expected count for athletes who sleep over 8 hours.
        (c) Check the conditions for the test.
      answer: |
        (a) A chi-square test for homogeneity. H₀: the distribution of usual school-night sleep is the same for all athletes and all non-athletes at the school. Hₐ: the distributions are not the same.
        (b) 100 · 50/200 = 25.
        (c) Random: independent random samples of athletes and non-athletes. 10%: 100 < 10% of about 1,100 athletes (110) and 100 < 10% of about 1,500 non-athletes (150). Expected counts: 39, 36 and 25 in each row, all at least 5.
      explanation: |
        Three points, one per part. (a) homogeneity (two separate samples) with hypotheses in words about the two populations' distributions. (b) 25. (c) Random, the 10% check for both groups, and all expected counts shown to be at least 5.
    - slug: apstats-u03-w22-q23
      type: short_answer
      topic_code: "3.10"
      source: "AP Statistics CED, Topic 3.10"
      points: 3
      prompt: |
        A hypothetical museum surveys independent random samples of visitors on weekdays and on weekends: 72 of 180 weekday visitors and 50 of 160 weekend visitors bought something at the gift shop. Thousands of people visit on each kind of day.

        (a) Check the conditions for a two-sample z-interval for p_weekday − p_weekend.
        (b) Construct a 95% confidence interval for p_weekday − p_weekend.
        (c) Interpret the interval in context.
      answer: |
        (a) Random: independent random samples of weekday and weekend visitors. 10%: 180 and 160 are each less than 10% of the thousands of visitors. Large Counts: 72, 108, 50 and 110 are all at least 10.
        (b) p̂_weekday = 0.400, p̂_weekend = 0.3125; difference 0.0875. SE = √(0.4·0.6/180 + 0.3125·0.6875/160) ≈ 0.0517. 0.0875 ± 1.96(0.0517) = 0.0875 ± 0.101, from about −0.014 to 0.189.
        (c) We are 95% confident that the interval from −0.014 to 0.189 captures the true difference (weekday minus weekend) in the proportions of all visitors who buy something at the gift shop.
      explanation: |
        Three points, one per part. (a) all three conditions in context, with four Large Counts. (b) interval about (−0.014, 0.189). (c) "95% confident" that the interval captures the difference in population proportions, with the order and context; probability language earns nothing.
    - slug: apstats-u03-w22-q24
      type: long_answer
      topic_code: "3.15"
      source: "AP Statistics CED, Topic 3.15"
      points: 7
      prompt: |
        A hypothetical county parks department asks residents of three towns which improvement it should fund first. It surveys an independent random sample of 100 adults in each town (each town has more than 5,000 adults).

        | Town | Playground | Walking trails | Sports courts | Total |
        |---|---|---|---|---|
        | Alden | 42 | 35 | 23 | 100 |
        | Brook | 30 | 46 | 24 | 100 |
        | Carver | 25 | 33 | 42 | 100 |
        | Total | 97 | 114 | 89 | 300 |

        (A) State the appropriate hypotheses.

        (B) Name the test and check its conditions.

        (C) Compute the test statistic, the degrees of freedom and the p-value.

        (D) State the conclusion at α = 0.05 in context.

        (E) Identify the cell that contributes most to the test statistic, and describe what it shows.
      answer: |
        (A) H₀: the distribution of preferred park improvement is the same for all adults in Alden, Brook and Carver. Hₐ: the distributions are not all the same.
        (B) Chi-square test for homogeneity. Random: independent random samples from the three towns. 10%: 100 < 10% of more than 5,000 adults in each town. Expected counts: 100 · 97/300 ≈ 32.3, 100 · 114/300 = 38.0, 100 · 89/300 ≈ 29.7 in each row, all at least 5.
        (C) χ² = Σ (O − E)²/E ≈ 15.01, df = (3 − 1)(3 − 1) = 4, p-value = P(χ² ≥ 15.01) ≈ 0.005.
        (D) Because the p-value 0.005 < α = 0.05, we reject H₀. There is convincing evidence that the distribution of preferred park improvement is not the same for adults in the three towns.
        (E) Carver and sports courts: observed 42 against expected 29.7, contribution (42 − 29.7)²/29.7 ≈ 5.13. Carver residents choose sports courts much more often than they would if all three towns had the same distribution.
      explanation: |
        Seven points.
        (A) 1 point: hypotheses in words about the distributions in the three town populations, with "not all the same" as the alternative.
        (B) 2 points: 1 for naming the chi-square test for homogeneity with the Random condition; 1 for the 10% condition and the expected counts (shown, with all at least 5). Checking observed counts instead of expected counts earns nothing for the second point.
        (C) 2 points: 1 for χ² ≈ 15.0 with df = 4; 1 for p-value ≈ 0.005.
        (D) 1 point: reject H₀ by comparing p-value with α, and "convincing evidence" that the distributions differ, in context.
        (E) 1 point: Carver/sports courts identified with observed above expected, interpreted in context.
