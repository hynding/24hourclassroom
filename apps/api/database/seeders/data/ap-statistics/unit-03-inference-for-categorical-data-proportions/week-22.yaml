      points: 2
      partial_credit: true
      prompt: |
        A chi-square test for homogeneity compares the distribution of favourite season among independent random samples of students from three large hypothetical schools. It gives χ² = 4.1, df = 6, p-value ≈ 0.66. Which statements are correct at α = 0.05? Select all that apply.
      options:
        - "Fail to reject H₀, because 0.66 > 0.05."
        - "There is not convincing evidence that the distribution of favourite season differs among the three schools."
        - "The test shows that the distribution of favourite season is the same at all three schools."
        - "A χ² of 4.1 is below the mean of the chi-square distribution with 6 df, so it is typical of what chance alone produces."
        - "There is a 0.66 probability that H₀ is true."
      option_explanations:
        - |
          Correct. The p-value is larger than α, so H₀ is not rejected.
        - |
          Correct. This is the right wording after failing to reject H₀.
        - |
          Failing to reject H₀ never shows that it is true; the distributions might differ by amounts too small to detect.
        - |
          Correct. A chi-square distribution has mean equal to df (6), so 4.1 is an unremarkable value under H₀.
        - |
          The p-value assumes H₀ is true; it is not the probability that H₀ is true.
      answer: [0, 1, 3]
    - slug: apstats-u03-w22-q17
      type: true_false
      topic_code: "3.14"
      source: "AP Statistics CED, Topic 3.14"
      points: 1
      prompt: |
        True or false: A chi-square test for independence may be carried out on a two-way table of row percentages instead of counts, because the percentages show the same pattern.
      answer: false
      explanation: |
        False. The χ² statistic depends on the sample size; the same percentages from 100 people and from 1,000 people give very different χ² values and p-values. The test must use counts.
    - slug: apstats-u03-w22-q18
      type: true_false
      topic_code: "3.13"
      source: "AP Statistics CED, Topic 3.13"
      points: 1
      prompt: |
        True or false: For a 2 × 2 table comparing the proportions of successes in two groups, the chi-square test for homogeneity gives the same p-value as the two-sided two-sample z-test for p₁ − p₂.
      answer: true
      explanation: |
        True. For a 2 × 2 table χ² = z², and the chi-square distribution with 1 df is the distribution of Z², so the upper-tail chi-square p-value equals the two-sided z p-value.
