      prompt: |
        A hypothetical orchard randomly assigns 200 young apple trees to two pruning methods (100 each). After one season, 40 trees with the first method and 28 with the second have fruit. Find the test statistic z for a two-sample z-test of H₀: p₁ = p₂, with p̂₁ − p̂₂ in the numerator. Give your answer to two decimal places.
      answer: { value: 1.79, tolerance: 0.01 }
      explanation: |
        p̂₁ = 0.40, p̂₂ = 0.28, p̂_c = 68/200 = 0.34. SD = √(0.34 · 0.66 · (1/100 + 1/100)) ≈ 0.0670. z = 0.12/0.0670 ≈ 1.79.
