    - slug: apstats-u03-w17-q20
      type: short_answer
      topic_code: "3.5"
      source: "AP Statistics CED, Topic 3.5"
      points: 3
      prompt: |
        A hypothetical town reports that 18% of its 6,000 households compost food scraps. After a campaign, an environmental club wants to know whether the proportion has increased. The club plans to survey a simple random sample of 150 households.

        (a) State the hypotheses the club should test, defining the parameter.
        (b) Check the conditions for a one-sample z-test for a proportion.
        (c) Explain why the Large Counts check uses 0.18 rather than the club's sample proportion.
      answer: |
        (a) H₀: p = 0.18, Hₐ: p > 0.18, where p = the proportion of all households in the town that compost food scraps after the campaign.
        (b) Random: a simple random sample of households. 10%: 150 ≤ 10% of 6,000 = 600. Large Counts: 150(0.18) = 27 and 150(0.82) = 123 are both at least 10.
        (c) The test is carried out assuming the null hypothesis is true, so the expected numbers of successes and failures are based on p₀ = 0.18.
      explanation: |
        Three points, one per part. (a) both hypotheses about p with a one-sided ">" alternative and p defined in context. (b) all three conditions checked with numbers and context. (c) the reason: a test assumes H₀ is true. Hypotheses written with p̂ earn no credit for (a).
    - slug: apstats-u03-w17-q21
      type: short_answer
      topic_code: "2.10"
      source: "AP Statistics CED, Topic 2.10"
      points: 3
      prompt: |
        A student suspects a coin is biased toward heads. She flips it 12 times and gets 10 heads.

        (a) If the coin is fair, what is the distribution of X, the number of heads in 12 flips? Name it and give its parameters.
        (b) Find P(X ≥ 10) if the coin is fair.
        (c) What does your answer to (b) suggest about the coin? Explain.
      answer: |
        (a) Binomial with n = 12 and p = 0.5 (fixed number of independent flips, each heads or tails, same probability).
        (b) P(X ≥ 10) = P(10) + P(11) + P(12) = (66 + 12 + 1)/4096 = 79/4096 ≈ 0.019.
        (c) If the coin were fair, 10 or more heads in 12 flips would happen only about 1.9% of the time, so this result is unusual and gives evidence that the coin is biased toward heads. (This probability is a p-value from the binomial distribution.)
      explanation: |
        Three points. (a) binomial with both parameters, n = 12 and p = 0.5. (b) 0.019, with work (the three binomial probabilities or binomcdf: 1 − binomcdf(12, 0.5, 9)). Computing only P(X = 10) ≈ 0.016 does not earn (b). (c) a conclusion that the result is unusual if the coin is fair, so there is evidence of bias toward heads; "proves the coin is biased" does not earn (c).
    - slug: apstats-u03-w17-q22
      type: long_answer
      topic_code: "3.6"
      source: "AP Statistics CED, Topic 3.6"
      points: 6
      prompt: |
        A hypothetical national survey found that 25% of high school students sleep 8 or more hours on school nights. A counsellor wants to know whether the proportion at her school of 1,800 students is different. She takes a simple random sample of 120 students; 21 of them sleep 8 or more hours on school nights.

        (A) State the hypotheses, defining the parameter.

        (B) Name the procedure and check the conditions.

        (C) Compute the test statistic and the p-value.

        (D) Interpret the p-value in context.

        (E) Suppose the counsellor had asked instead whether the proportion at her school is lower than 25%, before collecting data. What would the p-value be, and why?
      answer: |
        (A) H₀: p = 0.25, Hₐ: p ≠ 0.25, where p = the proportion of all 1,800 students at the school who sleep 8 or more hours on school nights.
        (B) One-sample z-test for a population proportion. Random: SRS. 10%: 120 ≤ 180. Large Counts: 120(0.25) = 30 and 120(0.75) = 90 are both at least 10.
        (C) p̂ = 21/120 = 0.175. SD = √(0.25 · 0.75 / 120) ≈ 0.0395. z = (0.175 − 0.25)/0.0395 ≈ −1.90. p-value = 2 · P(Z ≤ −1.90) ≈ 0.058.
        (D) Assuming 25% of all students at the school sleep 8 or more hours, there is a 0.058 probability of getting a sample proportion at least as far from 0.25 as 0.175 (in either direction) by chance alone.
        (E) About 0.029: with Hₐ: p < 0.25 only the lower tail counts, P(Z ≤ −1.90) ≈ 0.029, half of the two-sided p-value.
      explanation: |
        Six points. (A) 1 point: hypotheses about p with a two-sided alternative and p defined in context. (B) 1 point: procedure named and all three conditions checked, with Large Counts using p₀ (30 and 90). (C) 2 points: 1 for z ≈ −1.90 with the formula shown using p₀; 1 for the two-sided p-value ≈ 0.058 (0.057 to 0.058). (D) 1 point: the interpretation includes the assumption p = 0.25, the probability, and "at least as far from 0.25 as 0.175" in context; omitting the assumption earns no credit. (E) 1 point: ≈ 0.029 with the reason that only one tail counts.
