      source: "AP Statistics CED, Topic 3.3"
      points: 1
      prompt: |
        True or false: With the same sample data, a 99% confidence interval for a population proportion is narrower than a 90% confidence interval.
      answer: false
      explanation: |
        False. Higher confidence needs a larger critical value (2.576 instead of 1.645) multiplying the same standard error, so the 99% interval is wider.
