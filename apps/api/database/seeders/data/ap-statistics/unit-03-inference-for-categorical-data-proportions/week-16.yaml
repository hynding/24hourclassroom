        In a large county, 65% of all registered voters voted in the last local election. For a simple random sample of 300 registered voters, find the probability that more than 70% of the sample voted in that election. Give your answer to three decimal places.
      answer: { value: 0.035, tolerance: 0.0015 }
      explanation: |
        Mean 0.65, SD(p̂) = √(0.65 · 0.35 / 300) ≈ 0.0275 (300 is far below 10% of a large county). Large Counts: 195 and 105. z = (0.70 − 0.65)/0.0275 ≈ 1.82, and P(Z > 1.82) ≈ 0.035.
    - slug: apstats-u03-w16-q20
      type: short_answer
      topic_code: "3.3"
      source: "AP Statistics CED, Topic 3.3"
      points: 3
      prompt: |
        A youth charity takes a simple random sample of 360 teenagers in a large city; 117 of them volunteered in the past month. Construct and interpret a 90% confidence interval for the proportion of all teenagers in the city who volunteered in the past month. Show the conditions and the calculation.
      answer: |
        One-sample z-interval for p, where p = the proportion of all teenagers in the city who volunteered in the past month.
        Conditions: random sample; 360 is less than 10% of all teenagers in a large city; 117 and 243 are both at least 10.
        p̂ = 117/360 = 0.325. SE = √(0.325 · 0.675 / 360) ≈ 0.0247. 0.325 ± 1.645(0.0247) = 0.325 ± 0.041 = (0.284, 0.366).
        We are 90% confident that the interval from 0.284 to 0.366 captures the true proportion of all teenagers in the city who volunteered in the past month.
      explanation: |
        Three points. 1 point: procedure named or formula given, with all three conditions checked in context (Random, 10%, Large Counts with 117 and 243). 1 point: correct interval (0.284, 0.366) with work shown (z* = 1.645 and the SE). 1 point: interpretation in context naming the population proportion and 90% confidence. An interpretation that says "90% probability" or refers to the sample earns no credit for that point.
    - slug: apstats-u03-w16-q21
      type: short_answer
      topic_code: "1.11"
      source: "AP Statistics CED, Topic 1.11"
      points: 3
      prompt: |
        A school with 400 students in each of grades 9 to 12 wants to estimate the proportion of all its students who use the school's study app. App use is known to rise sharply with grade.

        (a) Describe how to select a stratified random sample of 120 students.
        (b) Explain why the stratified sample would give a less variable estimate of the school's proportion than a simple random sample of 120.
      answer: |
        (a) Use grade as the strata. From an alphabetical list of each grade, number the students 001 to 400 and use a random number generator to pick 30 different numbers in each grade (ignoring repeats), for 120 students in all. Survey those students.
        (b) App use differs a lot between grades but is similar within a grade. A stratified sample guarantees each grade is represented in its correct share, so the estimate cannot swing because a sample happened to contain too many seniors or too many ninth-graders. That removes a source of sample-to-sample variation, so the estimates vary less than those from an SRS of the same size.
      explanation: |
        Three points. (a) 2 points: 1 for forming strata by grade, 1 for a random selection of 30 from each grade described clearly (labels, a random mechanism, no repeats). (b) 1 point: responses are similar within grades and different between them, so stratifying controls that variation and reduces variability. Saying the stratified sample is "less biased" does not earn (b): both methods are unbiased.
    - slug: apstats-u03-w16-q22
      type: long_answer
      topic_code: "3.4"
      source: "AP Statistics CED, Topic 3.4"
      points: 6
      prompt: |
        A hypothetical state health department surveyed a simple random sample of 450 of the state's teenagers. Of these, 279 said they are woken by a phone notification at night at least once a week.

        (A) Construct a 95% confidence interval for the proportion of all the state's teenagers who are woken by a phone notification at least once a week. Name the procedure, define the parameter and check the conditions.

        (B) Interpret the interval in context.

        (C) A newspaper claims that "most teenagers" are woken by a notification at least once a week. A phone company claims that the figure is 70%. Use the interval to evaluate each claim.

        (D) Would a 99% confidence interval from the same data lead to the same verdict on the newspaper's claim? Justify with the 99% interval.
      answer: |
        (A) One-sample z-interval for p, where p = the proportion of all the state's teenagers who are woken by a phone notification at night at least once a week. Random: SRS. 10%: 450 is less than 10% of a state's teenagers. Large Counts: 279 and 171 are both at least 10. p̂ = 279/450 = 0.62; SE = √(0.62 · 0.38 / 450) ≈ 0.0229; 0.62 ± 1.96(0.0229) = 0.62 ± 0.045 = (0.575, 0.665).
        (B) We are 95% confident that the interval from 0.575 to 0.665 captures the true proportion of all the state's teenagers who are woken by a phone notification at night at least once a week.
        (C) Newspaper: every value in the interval is above 0.50, so there is convincing evidence that most (more than half) of the state's teenagers are woken at least once a week. Phone company: 0.70 is above the interval, so it is not plausible; there is convincing evidence that the proportion is less than 0.70.
        (D) Yes. 99%: 0.62 ± 2.576(0.0229) = 0.62 ± 0.059 = (0.561, 0.679). The whole interval is still above 0.50, so the verdict on the newspaper's claim is unchanged.
      explanation: |
        Six points. (A) 3 points: 1 for naming the procedure and defining p in context; 1 for all three conditions checked in context (Random, 10%, Large Counts with 279 and 171); 1 for the correct interval (0.575, 0.665) with work. (B) 1 point: "95% confident" that the interval captures the proportion of all the state's teenagers; no credit for probability language or for referring to the sample. (C) 1 point: both verdicts, each tied to where the claimed value lies relative to the interval (0.50 below the interval, 0.70 above it), with "convincing evidence" language. (D) 1 point: the 99% interval (about 0.561 to 0.679) and the statement that it still lies entirely above 0.50.
