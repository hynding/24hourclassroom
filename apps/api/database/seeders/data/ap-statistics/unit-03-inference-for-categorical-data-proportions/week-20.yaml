      source: "AP Statistics CED, Topic 3.11"
      points: 3
      prompt: |
        A hypothetical regional planning office compares the proportions of all commuters in two large suburbs who carpool, using independent random samples. For p_A − p_B it reports a 90% interval of (0.012, 0.148) and a 99% interval of (−0.026, 0.186).

        (a) What does the 90% interval let the office conclude?
        (b) What does the 99% interval let the office conclude?
        (c) A council member says the two intervals contradict each other. Explain why they do not.
      answer: |
        (a) Every plausible value in the 90% interval is positive, so at 90% confidence there is convincing evidence that a higher proportion of all commuters in suburb A carpool than in suburb B.
        (b) The 99% interval contains 0, so at 99% confidence there is not convincing evidence that the proportions differ.
        (c) Both come from the same data and point estimate (0.08). The 99% interval uses a larger z* (2.576 instead of 1.645), so it is wider and reaches 0. Requiring more confidence widens the set of plausible values; the evidence is convincing at one level and not at the other.
      explanation: |
        Three points, one per part. (a) convincing evidence that p_A > p_B, in context, with the reason (interval entirely above 0). (b) not convincing evidence of a difference because 0 is in the interval; saying the proportions are equal loses the point. (c) higher confidence → larger z* → wider interval from the same data.
