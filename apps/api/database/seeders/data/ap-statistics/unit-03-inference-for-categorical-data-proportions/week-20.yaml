    - slug: apstats-u03-w20-q24
      type: long_answer
      topic_code: "3.11"
      source: "AP Statistics CED, Topic 3.11"
      points: 7
      prompt: |
        A hypothetical fitness centre wants to know whether offering new members a free personal-training session helps them keep coming. Of 300 people who joined in January, 150 were randomly assigned to be offered the session and 150 were not. Three months later, 96 of those offered the session and 78 of the others were still visiting at least once a week.

        (A) Name the appropriate procedure for estimating the difference, define the parameter, and check the conditions.

        (B) Construct a 95% confidence interval for the parameter.

        (C) The manager claims that the free session increases the proportion of members who keep visiting weekly. Does the interval support the claim? Explain.

        (D) The owner claims that the session increases that proportion by at least 15 percentage points. Does the interval support this claim? Explain.

        (E) To whom can the conclusion in part (C) be applied, and is it a cause-and-effect conclusion? Explain.
      answer: |
        (A) A two-sample z-interval for p_S − p_N, where p_S and p_N are the true proportions of new members like these who would still visit at least weekly after three months when offered the session and when not offered it. Random: members were randomly assigned to the two groups. 10%: not needed, since no sampling from a population. Large Counts: 96, 54, 78 and 72 are all at least 10.
        (B) p̂_S = 96/150 = 0.64, p̂_N = 78/150 = 0.52, difference 0.12. SE = √(0.64·0.36/150 + 0.52·0.48/150) ≈ 0.0566. 0.12 ± 1.96(0.0566) = 0.12 ± 0.111, from about 0.009 to 0.231.
        (C) Yes. Every value in the interval is positive, so 0 is not plausible: there is convincing evidence that offering the session increases the proportion of members like these who keep visiting weekly.
        (D) No. Increases of 0.15 or more are plausible, but so are increases from about 0.009 to 0.15, so the interval does not give convincing evidence of an increase of at least 15 percentage points (the claim is plausible but not established).
        (E) Because the session was randomly assigned, the conclusion is causal: the offer caused the increase. The members were not a random sample of all members (they were January joiners at one centre), so the conclusion applies to new members like these.
      explanation: |
        Seven points.
        (A) 2 points: 1 for the procedure with the parameter defined (both treatments, the response and the order); 1 for Random (random assignment) and all four Large Counts, with the 10% condition correctly set aside or not required.
        (B) 1 point: interval about (0.009, 0.231), with work or the calculator procedure and its inputs named.
        (C) 2 points: 1 for "yes" because the interval is entirely above 0; 1 for the conclusion in context using "convincing evidence" (not "proves").
        (D) 1 point: "no" with the reason that plausible values below 0.15 exist (the lower endpoint is below 0.15).
        (E) 1 point: causal because of random assignment, and the conclusion limited to members like these because there was no random sample.
