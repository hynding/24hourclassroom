      source: "AP Statistics CED, Topic 3.7"
      points: 1
      prompt: |
        A test of H₀: p = 0.50, where p is the proportion of all voters in a hypothetical town who favour a new library, uses a random sample of 100 voters with p̂ = 0.60. The test statistic is z = ____.
      answer: ["2", "2.0", "2.00", "+2"]
      explanation: |
        z = (0.60 − 0.50)/√(0.50·0.50/100) = 0.10/0.05 = 2.00. The test uses p₀ = 0.50 in the standard deviation.
