      explanation: |
        p̂_C = 0.400, p̂_W = 0.300; p̂_c = 109/310 ≈ 0.3516. SD = √(0.3516 · 0.6484 · (1/160 + 1/150)) ≈ 0.0543. z = 0.100/0.0543 ≈ 1.84.
    - slug: apstats-u03-w21-q22
      type: short_answer
      topic_code: "3.12"
      source: "AP Statistics CED, Topic 3.12"
      points: 3
      prompt: |
        A hypothetical city wants to know whether a smaller proportion of households on its east side than on its west side recycle glass. It surveys independent random samples of 300 east-side households (132 recycle glass) and 280 west-side households (147 recycle glass). Each side has more than 20,000 households.

        (a) Define the parameters and state the hypotheses.
        (b) Compute the pooled proportion and check all conditions for a two-sample z-test.
        (c) Explain why the pooled proportion, rather than the two separate sample proportions, is used in this test's standard deviation.
      answer: |
        (a) p_E = the proportion of all east-side households that recycle glass; p_W = the same for all west-side households. H₀: p_E − p_W = 0; Hₐ: p_E − p_W < 0.
        (b) p̂_c = (132 + 147)/(300 + 280) = 279/580 ≈ 0.481. Random: independent random samples from each side. 10%: 300 and 280 are each less than 10% of more than 20,000 households. Large Counts: 300(0.481) ≈ 144.3, 300(0.519) ≈ 155.7, 280(0.481) ≈ 134.7, 280(0.519) ≈ 145.3, all at least 10.
        (c) The test statistic is computed assuming H₀ is true, so both samples estimate the same proportion; combining them gives the best estimate of that common proportion.
      explanation: |
        Three points, one per part. (a) both parameters defined in context and hypotheses about parameters with the < alternative. (b) p̂_c ≈ 0.481 and all three conditions (Random, 10% for both sides, all four Large Counts). (c) the reason: the test assumes H₀: p_E = p_W.
    - slug: apstats-u03-w21-q23
      type: short_answer
      topic_code: "3.11"
      source: "AP Statistics CED, Topic 3.11"
      points: 3
      prompt: |
        A hypothetical seed company randomly assigns 400 garden plots to be planted with a new or an old variety of carrot seed (200 each). A 95% interval for p_new − p_old, the difference in the true proportions of seeds that germinate, is (−0.08, 0.02). A competitor's advertisement says, "The new seed germinates less often than the old seed."

        (a) Does the interval give convincing evidence for the advertisement's claim? Explain.
        (b) A sales manager says the interval shows the two seeds germinate equally often. Is this correct? Explain.
        (c) If the interval had been (−0.12, −0.03), what could the company conclude, and could it attribute the difference to the seed variety? Explain.
      answer: |
        (a) No. The interval contains 0, so a difference of 0 is plausible; there is not convincing evidence that the new seed germinates less often.
        (b) No. 0 is plausible, but so are differences from −0.08 to 0.02; the interval does not show the proportions are equal.
        (c) Every plausible value would be negative, giving convincing evidence that the new seed germinates less often (by about 3 to 12 percentage points). Because the varieties were randomly assigned to plots, the difference could be attributed to the variety.
      explanation: |
        Three points, one per part. (a) "no" because 0 is in the interval. (b) "no": not convincing evidence of a difference is not evidence of equality. (c) convincing evidence that p_new < p_old with the reason (interval entirely below 0) and causation justified by random assignment.
    - slug: apstats-u03-w21-q24
      type: long_answer
      topic_code: "3.13"
      source: "AP Statistics CED, Topic 3.13"
      points: 7
      prompt: |
        A hypothetical health department asks whether the proportion of students who have completed a CPR course differs between two large high schools, Hilltop (about 2,400 students) and Lakeside (about 2,300 students). In a random sample of 210 Hilltop students, 84 have completed a CPR course; in an independent random sample of 200 Lakeside students, 66 have.

        (A) Define the parameters and state the hypotheses.

        (B) Name the procedure and check its conditions.

        (C) Compute the test statistic and the p-value.

        (D) State the conclusion at α = 0.05 in context.

        (E) Based on your conclusion, which type of error could have been made? Describe it in context.
      answer: |
        (A) p_H = the proportion of all Hilltop students who have completed a CPR course; p_L = the same for all Lakeside students. H₀: p_H − p_L = 0; Hₐ: p_H − p_L ≠ 0.
        (B) Two-sample z-test for p_H − p_L. Random: independent random samples from each school. 10%: 210 < 10% of 2,400 = 240 and 200 < 10% of 2,300 = 230. Large Counts: p̂_c = 150/410 ≈ 0.366; 210(0.366) ≈ 76.8, 210(0.634) ≈ 133.2, 200(0.366) ≈ 73.2, 200(0.634) ≈ 126.8, all at least 10.
        (C) p̂_H = 0.400, p̂_L = 0.330, difference 0.070. SD = √(0.366 · 0.634 · (1/210 + 1/200)) ≈ 0.0476. z ≈ 1.47. p-value = 2 · P(Z ≥ 1.47) ≈ 0.141.
        (D) Because the p-value 0.141 > α = 0.05, we fail to reject H₀. There is not convincing evidence that the proportions of all students who have completed a CPR course differ between Hilltop and Lakeside.
        (E) A Type II error: the proportions of students with CPR training really do differ between the two schools, but the test did not find convincing evidence of the difference.
      explanation: |
        Seven points.
        (A) 1 point: both parameters defined in context and two-sided hypotheses about parameters.
        (B) 2 points: 1 for naming the two-sample z-test for a difference in proportions and checking Random; 1 for the 10% condition for both schools and Large Counts with all four values (computed with p̂_c, or with the observed counts 84, 126, 66, 134).
        (C) 2 points: 1 for z ≈ 1.47 with the pooled SD shown (or the calculator procedure with inputs); 1 for the two-sided p-value ≈ 0.14. A one-sided p-value (≈ 0.07) earns only the first point.
        (D) 1 point: fail to reject, comparing p-value with α, with "not convincing evidence" of a difference in context. "Accept H₀" or "the proportions are equal" earns nothing.
        (E) 1 point: Type II error, described in context as failing to detect a difference that exists.
