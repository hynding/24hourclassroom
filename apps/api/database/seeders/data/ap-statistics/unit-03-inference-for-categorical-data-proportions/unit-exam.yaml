    type: numeric
    topic_code: "3.10"
    source: "AP Statistics CED, Topic 3.10"
    points: 1
    prompt: |
      In independent random samples of 250 customers at each of two hypothetical cafés, 130 at the first and 105 at the second order a pastry with their drink. Find the margin of error of a 90% two-sample z-interval for p₁ − p₂. Give your answer to three decimal places.
    answer: { value: 0.073, tolerance: 0.001 }
    explanation: |
      p̂₁ = 0.52, p̂₂ = 0.42. SE = √(0.52·0.48/250 + 0.42·0.58/250) ≈ 0.0444. Margin of error = 1.645 · 0.0444 ≈ 0.073.
  - slug: apstats-u03-exam-q39
    type: short_answer
    topic_code: "3.8"
    source: "AP Statistics CED, Topic 3.8"
    points: 3
    prompt: |
      A hypothetical utility company will replace all the water meters in a neighbourhood if it finds convincing evidence that more than 5% of them read incorrectly. It tests H₀: p = 0.05 against Hₐ: p > 0.05, where p is the proportion of all meters in the neighbourhood that read incorrectly, using a random sample of meters.

      (a) Describe a Type I error in context and give one consequence.
      (b) Describe a Type II error in context and give one consequence.
      (c) Residents are overcharged when faulty meters stay in service. Which error would residents consider more serious, and should the company use α = 0.01 or α = 0.10 to protect them? Explain.
    answer: |
      (a) Concluding that more than 5% of the meters read incorrectly when in fact 5% do. Consequence: the company spends money replacing meters that did not need replacing.
      (b) Not finding convincing evidence that more than 5% read incorrectly when in fact more than 5% do. Consequence: faulty meters stay in service and residents may be overcharged.
      (c) The Type II error. To make it less likely, the company should use the larger significance level, α = 0.10, which increases power (at the cost of more Type I errors).
    explanation: |
      Three points, one per part. (a) Type I error in context with a plausible consequence. (b) Type II error in context with a plausible consequence. (c) Type II named as more serious for residents, α = 0.10 chosen, with the reason that a larger α increases power / lowers P(Type II).
  - slug: apstats-u03-exam-q40
    type: short_answer
    topic_code: "3.2"
    source: "AP Statistics CED, Topic 3.2"
    points: 3
    prompt: |
      At a hypothetical university with about 30,000 students, 35% of all students live on campus. A student newspaper surveys a random sample of 250 students.

      (a) Give the mean and standard deviation of the sampling distribution of p̂, the sample proportion who live on campus, and justify the SD formula.
      (b) Explain why the sampling distribution is approximately normal.
      (c) Find the probability that fewer than 30% of the sample live on campus.
    answer: |
      (a) Mean = p = 0.35. SD = √(0.35·0.65/250) ≈ 0.0302. The formula applies because 250 is less than 10% of 30,000 students.
      (b) np = 250(0.35) = 87.5 and n(1 − p) = 250(0.65) = 162.5 are both at least 10.
      (c) z = (0.30 − 0.35)/0.0302 ≈ −1.66; P(p̂ < 0.30) ≈ P(Z < −1.66) ≈ 0.049.
    explanation: |
      Three points, one per part. (a) mean 0.35 and SD ≈ 0.030 with the 10% condition. (b) both counts shown to be at least 10. (c) a probability of about 0.049 (0.048 to 0.05 accepted) with the z-score or calculator inputs shown.
  - slug: apstats-u03-exam-q41
    type: long_answer
    topic_code: "3.11"
    source: "AP Statistics CED, Topic 3.11"
    points: 10
    prompt: |
      A hypothetical high school wants to know whether a 10-minute guided mindfulness session at the start of each school day reduces the proportion of students who report feeling highly stressed. 240 students volunteer for a six-week study. Half of them will do the morning session, and half will spend the 10 minutes in a regular homeroom. At the end of the six weeks, each student answers a survey question: "In the past week, have you felt highly stressed most days?" (yes or no).

      (A) Identify the explanatory variable and the response variable.

      (B) Describe how to randomly assign the 240 volunteers to the two groups.

      (C) The school considers blocking by grade level (9, 10, 11, 12). Explain why blocking by grade might be useful here, and describe how the random assignment would change.

      (D) The study is carried out without blocking. 46 of the 120 mindfulness students and 64 of the 120 homeroom students answer "yes". Construct a 95% confidence interval for p_M − p_H, the difference in the true proportions of students like these who would report feeling highly stressed under each condition. Show the conditions.

      (E) Does the interval give convincing evidence that the mindfulness session reduces the proportion of students who feel highly stressed? Explain, and state to whom the conclusion applies.
    answer: |
      (A) Explanatory variable: the morning activity (mindfulness session or regular homeroom). Response variable: whether the student reports feeling highly stressed most days in the past week (yes or no).
      (B) Number the volunteers 1 to 240. Use a random number generator to choose 120 different numbers from 1 to 240 (ignoring repeats); those students do the mindfulness session and the remaining 120 have regular homeroom. (Equivalently, write the names on identical slips, mix them well and draw 120 for the mindfulness group.)
      (C) Stress levels may differ by grade (for example, seniors with applications and exams may report more stress), and grade may also affect how students respond to the session. Blocking by grade makes the treatment groups balanced on grade and lets the comparison be made within grades, reducing variability so a treatment effect is easier to detect. The assignment would be done separately within each grade: in each grade's group of volunteers, randomly assign half to mindfulness and half to homeroom.
      (D) Two-sample z-interval for p_M − p_H. Random: students were randomly assigned to the two conditions. 10%: not needed (random assignment, not sampling). Large Counts: 46, 74, 64 and 56 are all at least 10. p̂_M = 46/120 ≈ 0.383, p̂_H = 64/120 ≈ 0.533; difference = −0.150. SE = √(0.383·0.617/120 + 0.533·0.467/120) ≈ 0.0636. −0.150 ± 1.96(0.0636) = −0.150 ± 0.125, from about −0.275 to −0.025.
      (E) Yes. Every value in the interval is negative, so 0 is not a plausible value of p_M − p_H: there is convincing evidence that the mindfulness session reduces the proportion of students who report feeling highly stressed (by roughly 2.5 to 27.5 percentage points). Because the conditions were randomly assigned, the reduction can be attributed to the session. Because the students were volunteers, not a random sample of the school, the conclusion applies to students like these volunteers.
    explanation: |
      Ten points (2027 format).
      (A) 1 point: both variables identified correctly, the response as a categorical variable.
      (B) 2 points: 1 for a random mechanism (numbers with a random number generator, slips drawn from a container) that a reader could carry out; 1 for producing two groups of 120 (handling repeats, or the remaining students forming the second group).
      (C) 2 points: 1 for explaining that grade is related to stress (the response), so blocking reduces variability or makes groups comparable on grade; 1 for describing random assignment within each grade.
      (D) 3 points: 1 for the procedure with Random and Large Counts (four counts) and the 10% condition correctly set aside; 1 for the point estimate and SE; 1 for the interval (−0.275, −0.025), allowing rounding.
      (E) 2 points: 1 for "yes" because the whole interval is below 0 (0 not plausible), with "convincing evidence" in context; 1 for scope: causal because of random assignment, and limited to volunteers like these because there was no random sample.
  - slug: apstats-u03-exam-q42
    type: long_answer
    topic_code: "3.15"
    source: "AP Statistics CED, Topic 3.15"
    points: 10
    prompt: |
      A hypothetical city library takes one random sample of 320 of its cardholders (it has about 60,000) and records each person's age group and preferred book format.

      | Age group | Print | E-book | Audiobook | Total |
      |---|---|---|---|---|
      | Teen (13–19) | 30 | 45 | 25 | 100 |
      | Adult (20–59) | 48 | 52 | 40 | 140 |
      | Senior (60+) | 42 | 23 | 15 | 80 |
      | Total | 120 | 120 | 80 | 320 |

      (A) Name the appropriate chi-square test and explain why it, rather than the other chi-square test for two-way tables, fits this design.

      (B) State the hypotheses.

      (C) Compute the expected counts for the senior row, and check all conditions for the test.

      (D) The test statistic is χ² ≈ 11.79. Give the degrees of freedom and the p-value, and state the conclusion at α = 0.05 in context.

      (E) Identify the cell with the largest contribution to χ², and describe what it shows about preferred formats.

      (F) A library board member says, "This proves that getting older makes people prefer print." Give two reasons this statement is not justified.
    answer: |
      (A) A chi-square test for independence: the library took one random sample and classified each cardholder on two categorical variables (age group and format). A test for homogeneity would need separate random samples from each age group.
      (B) H₀: there is no association between age group and preferred book format among all the library's cardholders. Hₐ: there is an association between age group and preferred format among all the cardholders.
      (C) Senior row: 80 · 120/320 = 30 (print), 80 · 120/320 = 30 (e-book), 80 · 80/320 = 20 (audiobook). Random: one random sample of cardholders. 10%: 320 < 10% of about 60,000. Large Counts: the expected counts are 37.5, 37.5, 25 (teen), 52.5, 52.5, 35 (adult) and 30, 30, 20 (senior), all at least 5.
      (D) df = (3 − 1)(3 − 1) = 4. p-value = P(χ² ≥ 11.79) ≈ 0.019. Because 0.019 < α = 0.05, reject H₀. There is convincing evidence of an association between age group and preferred book format among all of the library's cardholders.
      (E) Senior/print: (42 − 30)²/30 = 4.80. Seniors prefer print more often than they would if format preference were unrelated to age (42 observed against 30 expected).
      (F) First, a significance test gives convincing evidence, never proof (a Type I error is possible). Second, this is an observational study (a random sample with no random assignment), so it shows an association, not that age causes the preference; other variables, such as habits formed before e-books existed or comfort with devices, may explain it. (Also acceptable: the sample shows a difference between age groups at one time, not a change within people as they age.)
