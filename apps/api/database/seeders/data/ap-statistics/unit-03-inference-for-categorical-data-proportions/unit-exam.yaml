      Ten points (2027 format).
      (A) 1 point: test for independence, with the reason (one sample classified on two variables).
      (B) 1 point: hypotheses in words about association in the population of cardholders.
      (C) 2 points: 1 for the three senior expected counts (30, 30, 20); 1 for Random, 10% and all expected counts at least 5. Checking observed counts instead earns nothing for the second point.
      (D) 3 points: 1 for df = 4; 1 for p-value ≈ 0.019; 1 for rejecting H₀ by comparing with α and a "convincing evidence" conclusion in context. "Accept" or causal language loses the third point.
      (E) 1 point: senior/print identified, with observed above expected interpreted in context.
      (F) 2 points: 1 for "tests do not prove" (or convincing evidence only); 1 for "association, not causation" because there was no random assignment (or the cross-sectional point).
