unit: 3
description: |
  42 questions · about 90 minutes · every topic of Unit 3 (3.1 to 3.15): estimators and bias, the sampling
  distribution of p̂, one-sample z-intervals and the claims they support, setting up and carrying out a one-sample
  z-test, p-values, Type I and Type II errors and power, the sampling distribution of p̂₁ − p̂₂, two-sample
  z-intervals and the claims they support, two-sample z-tests, and chi-square tests for homogeneity and
  independence. Includes three shared-context sets (a four-question set on a district breakfast survey, a four-
  question set on a randomized tutoring experiment, and a three-question set on a two-way table of streaming
  plans and devices), select-all, true/false, fill-in-the-blank and numeric items, two short-answer questions
  (3 points each) and two free-response questions in the 2027 AP style (10 points each: one on experimental
  design and a two-proportion interval, one chi-square test for independence). A calculator is allowed
  throughout. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
  items are matched automatically; the short answers and free-response questions are graded by your teacher
  against the scoring notes.
questions:
  # ---- Stimulus set A: breakfast survey (3.3, 3.4, 3.5, 3.7)
  - slug: apstats-u03-exam-q01
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Statistics CED, Topic 3.3"
    points: 1
    stimulus: |
      A large hypothetical school district (about 12,000 students) surveys a random sample of 400 of its students. 148 of them say they ate breakfast before school every day last week. The district's nutrition office has claimed that 40% of its students eat breakfast every school day. Let p be the proportion of all students in the district who ate breakfast before school every day last week.
    prompt: |
      Which is the 95% confidence interval for p?
    options:
      - "(0.330, 0.410)"
      - "(0.323, 0.417)"
      - "(0.369, 0.371)"
      - "(0.322, 0.418)"
    option_explanations:
      - |
        This uses z* = 1.645, which gives a 90% interval rather than a 95% one.
      - |
        Correct. p̂ = 148/400 = 0.37, SE = √(0.37·0.63/400) ≈ 0.0241, and 0.37 ± 1.96(0.0241) = 0.37 ± 0.047.
      - |
        This forgets the square root: 1.96 · (0.37·0.63/400) is a margin of only about 0.001.
      - |
        This uses p₀ = 0.40 in the standard error; an interval estimates p and uses p̂ = 0.37 instead.
    answer: 1
  - slug: apstats-u03-exam-q02
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Statistics CED, Topic 3.4"
    points: 1
    stimulus: |
      A large hypothetical school district (about 12,000 students) surveys a random sample of 400 of its students. 148 of them say they ate breakfast before school every day last week. The district's nutrition office has claimed that 40% of its students eat breakfast every school day. Let p be the proportion of all students in the district who ate breakfast before school every day last week.
    prompt: |
      What does the 95% confidence interval say about the nutrition office's claim of 40%?
    options:
      - "The claim is false, because the sample proportion is 0.37, not 0.40."
      - "The claim is proven, because 0.40 is inside the interval."
      - "The claim is false, because 0.40 is close to the upper endpoint."
      - "0.40 is a plausible value of p, so the interval does not give convincing evidence against the claim."
    option_explanations:
      - |
        Sample proportions vary from the parameter by chance; the interval, not p̂ alone, decides whether 0.40 is plausible.
      - |
        A value inside the interval is plausible, not proven; many other values are plausible too.
      - |
        Every value inside the interval is plausible, wherever it lies.
      - |
        Correct. 0.40 lies between 0.323 and 0.417, so it is a plausible value; the data do not contradict the claim.
    answer: 3
  - slug: apstats-u03-exam-q03
    type: multiple_choice
    topic_code: "3.5"
    source: "AP Statistics CED, Topic 3.5"
    points: 1
    stimulus: |
      A large hypothetical school district (about 12,000 students) surveys a random sample of 400 of its students. 148 of them say they ate breakfast before school every day last week. The district's nutrition office has claimed that 40% of its students eat breakfast every school day. Let p be the proportion of all students in the district who ate breakfast before school every day last week.
    prompt: |
      A school board member suspects that fewer than 40% of the district's students eat breakfast every school day. Which hypotheses should be tested?
    options:
      - "H₀: p = 0.40; Hₐ: p < 0.40"
      - "H₀: p̂ = 0.40; Hₐ: p̂ < 0.40"
      - "H₀: p = 0.37; Hₐ: p < 0.37"
      - "H₀: p < 0.40; Hₐ: p = 0.40"
    option_explanations:
      - |
        Correct. The null hypothesis is the claimed value; the board member's suspicion (fewer than 40%) is the one-sided alternative.
      - |
        Hypotheses are about the parameter p, not the sample proportion, which is already known to be 0.37.
      - |
        0.37 is the sample result; hypotheses use the claimed value 0.40, and must be set before seeing the data.
      - |
        These are reversed: the equality belongs in H₀ and the suspicion being tested in Hₐ.
    answer: 0
  - slug: apstats-u03-exam-q04
    type: multiple_choice
    topic_code: "3.7"
    source: "AP Statistics CED, Topic 3.7"
    points: 1
    stimulus: |
      A large hypothetical school district (about 12,000 students) surveys a random sample of 400 of its students. 148 of them say they ate breakfast before school every day last week. The district's nutrition office has claimed that 40% of its students eat breakfast every school day. Let p be the proportion of all students in the district who ate breakfast before school every day last week.
    prompt: |
      The board member carries out a one-sample z-test of the hypotheses in the previous question at α = 0.05. Which result and conclusion are correct?
    options:
      - "z ≈ −1.24, p-value ≈ 0.107; fail to reject H₀"
      - "z ≈ −1.22, p-value ≈ 0.221; fail to reject H₀"
      - "z ≈ −1.22, p-value ≈ 0.110; fail to reject H₀. There is not convincing evidence that fewer than 40% of all students in the district eat breakfast every school day."
      - "z ≈ −1.22, p-value ≈ 0.110; accept H₀. Exactly 40% of the district's students eat breakfast every school day."
    option_explanations:
      - |
        This uses p̂ = 0.37 in the standard deviation; a test assumes H₀ and uses p₀ = 0.40: √(0.4·0.6/400) ≈ 0.0245.
      - |
        0.221 doubles the tail area, as for a two-sided test, but the alternative here is p < 0.40.
      - |
        Correct. z = (0.37 − 0.40)/√(0.40·0.60/400) ≈ −1.22 and P(Z ≤ −1.22) ≈ 0.110 > 0.05, so fail to reject H₀.
      - |
        A test never accepts H₀ or shows the parameter equals 0.40; it only fails to find convincing evidence against it.
    answer: 2
  # ---- Stimulus set B: tutoring experiment (3.12, 3.13, 3.10, 3.11)
  - slug: apstats-u03-exam-q05
    type: multiple_choice
    topic_code: "3.12"
    source: "AP Statistics CED, Topic 3.12"
    points: 1
    stimulus: |
      A hypothetical high school wants to compare two kinds of help for ninth graders who failed a first algebra quiz. It randomly assigns 300 such students: 150 to weekly peer tutoring and 150 to an online video series. On the retake, 99 of the tutoring group and 81 of the video group pass. Let p_T and p_V be the true proportions of students like these who would pass the retake with each kind of help. The school asks whether the pass rates differ.
    prompt: |
      Which hypotheses match the school's question?
    options:
      - "H₀: p_T − p_V = 0; Hₐ: p_T − p_V > 0"
      - "H₀: p_T − p_V = 0; Hₐ: p_T − p_V ≠ 0"
      - "H₀: p̂_T − p̂_V = 0; Hₐ: p̂_T − p̂_V ≠ 0"
      - "H₀: p_T − p_V ≠ 0; Hₐ: p_T − p_V = 0"
    option_explanations:
      - |
        The school asks whether the pass rates differ, not whether tutoring is better, so the alternative is two-sided.
      - |
        Correct. No difference under H₀; "differ" gives the two-sided alternative.
      - |
        Hypotheses concern the true proportions, not the sample proportions.
      - |
        The equality belongs in H₀; these hypotheses are reversed.
    answer: 1
  - slug: apstats-u03-exam-q06
    type: multiple_choice
    topic_code: "3.13"
    source: "AP Statistics CED, Topic 3.13"
    points: 1
    stimulus: |
      A hypothetical high school wants to compare two kinds of help for ninth graders who failed a first algebra quiz. It randomly assigns 300 such students: 150 to weekly peer tutoring and 150 to an online video series. On the retake, 99 of the tutoring group and 81 of the video group pass. Let p_T and p_V be the true proportions of students like these who would pass the retake with each kind of help. The school asks whether the pass rates differ.
    prompt: |
      Which is the result of the two-sample z-test at α = 0.05?
    options:
      - "z ≈ 2.12, p-value ≈ 0.017; reject H₀"
      - "z ≈ 3.00, p-value ≈ 0.003; reject H₀"
      - "z ≈ 2.12, p-value ≈ 0.034; fail to reject H₀, because the p-value is less than α"
      - "z ≈ 2.12, p-value ≈ 0.034; reject H₀"
    option_explanations:
      - |
        0.017 is the one-tail area; the school's two-sided question needs both tails, 2(0.017) ≈ 0.034.
      - |
        3.00 uses √(p̂_c(1 − p̂_c)/150), one group's sample size only; the SD needs (1/150 + 1/150).
      - |
        The decision rule is backwards: a p-value below α means H₀ is rejected.
      - |
        Correct. p̂_c = 180/300 = 0.60; SD = √(0.6·0.4·(2/150)) ≈ 0.0566; z = 0.12/0.0566 ≈ 2.12; two-sided p ≈ 0.034 < 0.05.
    answer: 3
  - slug: apstats-u03-exam-q07
    type: multiple_choice
    topic_code: "3.10"
    source: "AP Statistics CED, Topic 3.10"
    points: 1
    stimulus: |
      A hypothetical high school wants to compare two kinds of help for ninth graders who failed a first algebra quiz. It randomly assigns 300 such students: 150 to weekly peer tutoring and 150 to an online video series. On the retake, 99 of the tutoring group and 81 of the video group pass. Let p_T and p_V be the true proportions of students like these who would pass the retake with each kind of help. The school asks whether the pass rates differ.
    prompt: |
      Which is the 95% two-sample z-interval for p_T − p_V?
    options:
      - "(0.010, 0.230)"
      - "(0.028, 0.212)"
      - "(−0.230, −0.010)"
      - "(−0.036, 0.276)"
    option_explanations:
      - |
        Correct. 0.66 − 0.54 = 0.12; SE = √(0.66·0.34/150 + 0.54·0.46/150) ≈ 0.0561; 0.12 ± 1.96(0.0561) = 0.12 ± 0.110.
      - |
        This uses z* = 1.645, giving a 90% interval.
      - |
        This is the interval for p_V − p_T, the reverse order of subtraction.
      - |
        This uses the sum of the two standard errors (about 0.079) instead of the combined SE.
    answer: 0
  - slug: apstats-u03-exam-q08
    type: multiple_choice
    topic_code: "3.11"
    source: "AP Statistics CED, Topic 3.11"
    points: 1
    stimulus: |
      A hypothetical high school wants to compare two kinds of help for ninth graders who failed a first algebra quiz. It randomly assigns 300 such students: 150 to weekly peer tutoring and 150 to an online video series. On the retake, 99 of the tutoring group and 81 of the video group pass. Let p_T and p_V be the true proportions of students like these who would pass the retake with each kind of help. The school asks whether the pass rates differ.
    prompt: |
      Based on the 95% interval for p_T − p_V, which conclusion is justified?
    options:
      - "Tutoring raises the pass rate by exactly 12 percentage points."
      - "Tutoring would raise the pass rate for all ninth graders in the country."
      - "There is convincing evidence that peer tutoring leads to a higher pass rate than the videos for students like these, and the difference can be attributed to the kind of help."
      - "No cause-and-effect conclusion is possible, because the students were not a random sample."
    option_explanations:
      - |
        0.12 is the point estimate, one plausible value; the interval gives a range from about 1 to 23 points.
      - |
        The students were not randomly selected from all ninth graders, so the result applies to students like these only.
      - |
        Correct. Every plausible value is positive, and random assignment supports a causal conclusion for students like these.
      - |
        Random assignment, not random sampling, is what supports cause and effect; random sampling governs generalisation.
    answer: 2
  # ---- Stimulus set C: streaming plans (3.14, 3.15)
  - slug: apstats-u03-exam-q09
    type: multiple_choice
    topic_code: "3.14"
    source: "AP Statistics CED, Topic 3.14"
    points: 1
    stimulus: |
      A hypothetical streaming service takes one random sample of 300 of its customers (it has over 200,000) and records each customer's plan and the device they watch on most.

      | Plan | TV | Phone | Computer | Total |
      |---|---|---|---|---|
      | Basic | 40 | 22 | 18 | 80 |
      | Standard | 52 | 30 | 38 | 120 |
      | Premium | 28 | 20 | 52 | 100 |
      | Total | 120 | 72 | 108 | 300 |
    prompt: |
      Assuming there is no association between plan and main device, what is the expected count of premium customers who watch mostly on a computer?
    options:
      - "52"
      - "36"
      - "33.3"
      - "28.8"
    option_explanations:
      - |
        52 is the observed count, not the count H₀ predicts.
      - |
        Correct. Expected count = (row total)(column total)/(table total) = 100 · 108/300 = 36.
      - |
        33.3 splits the premium row evenly across three devices, ignoring the column totals.
      - |
        28.8 = 80 · 108/300 uses the basic row's total instead of the premium row's.
    answer: 1
  - slug: apstats-u03-exam-q10
    type: multiple_choice
    topic_code: "3.15"
    source: "AP Statistics CED, Topic 3.15"
    points: 1
    stimulus: |
      A hypothetical streaming service takes one random sample of 300 of its customers (it has over 200,000) and records each customer's plan and the device they watch on most.

      | Plan | TV | Phone | Computer | Total |
      |---|---|---|---|---|
      | Basic | 40 | 22 | 18 | 80 |
      | Standard | 52 | 30 | 38 | 120 |
      | Premium | 28 | 20 | 52 | 100 |
      | Total | 120 | 72 | 108 | 300 |
    prompt: |
      A chi-square test for independence gives χ² ≈ 18.85. What are the degrees of freedom and the p-value?
    options:
      - "df = 8, p-value ≈ 0.016"
      - "df = 9, p-value ≈ 0.027"
      - "df = 4, p-value ≈ 0.9992"
      - "df = 4, p-value ≈ 0.0008"
    option_explanations:
      - |
        df = 8 is the number of cells minus 1; for a two-way table df = (3 − 1)(3 − 1) = 4.
      - |
        df = 9 is the number of cells; for a two-way table df = (rows − 1)(columns − 1).
      - |
        0.9992 is the area to the left of 18.85; the chi-square p-value is the upper tail.
      - |
        Correct. df = (3 − 1)(3 − 1) = 4, and P(χ² ≥ 18.85) with 4 df ≈ 0.0008.
    answer: 3
  - slug: apstats-u03-exam-q11
    type: multiple_choice
    topic_code: "3.15"
    source: "AP Statistics CED, Topic 3.15"
    points: 1
    stimulus: |
      A hypothetical streaming service takes one random sample of 300 of its customers (it has over 200,000) and records each customer's plan and the device they watch on most.

      | Plan | TV | Phone | Computer | Total |
      |---|---|---|---|---|
      | Basic | 40 | 22 | 18 | 80 |
      | Standard | 52 | 30 | 38 | 120 |
      | Premium | 28 | 20 | 52 | 100 |
      | Total | 120 | 72 | 108 | 300 |
    prompt: |
      Which conclusion and follow-up are correct at α = 0.05?
    options:
      - "There is convincing evidence of an association between plan and main device among all the service's customers; premium customers watch on a computer more often than independence would predict."
      - "There is convincing evidence that choosing the premium plan causes customers to watch on a computer."
      - "There is not convincing evidence of an association, because some observed counts are below 25."
      - "There is convincing evidence of an association; basic customers watch on a computer more often than expected."
    option_explanations:
      - |
        Correct. p ≈ 0.0008 < 0.05, so reject H₀. The largest contribution is premium/computer: (52 − 36)²/36 ≈ 7.11, with more observed than expected.
      - |
        One random sample shows an association, not causation; no plans were assigned.
      - |
        The decision comes from the p-value, not from the size of individual counts; the expected-count condition (all at least 5) is met.
      - |
        Basic customers watch on a computer less often than expected: 18 observed against 28.8 expected.
    answer: 0
  # ---- Independent items
  - slug: apstats-u03-exam-q12
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Statistics CED, Topic 3.1"
    points: 1
    prompt: |
      A sampling method for estimating the proportion of a town's households with solar panels produces sample proportions whose sampling distribution is centered at the true proportion but is very spread out. How should the method be described?
    options:
      - "Biased with low variability"
      - "Biased with high variability"
      - "Unbiased with high variability"
      - "Unbiased with low variability"
    option_explanations:
      - |
        The distribution is centered at the true proportion, so the method is not biased, and it is widely spread, not tightly clustered.
      - |
        Being centered at the parameter means the method is unbiased; the wide spread is variability, not bias.
      - |
        Correct. Centered at the parameter means unbiased; a wide spread means high variability (a larger sample would reduce it).
      - |
        The method is unbiased, but a very spread-out distribution means high, not low, variability.
    answer: 2
  - slug: apstats-u03-exam-q13
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Statistics CED, Topic 3.1"
    points: 1
    prompt: |
      Three statistics are proposed for estimating the proportion of all students at a hypothetical university who own a car. Statistic 1's sampling distribution is centered at the true proportion with SD 0.02. Statistic 2's is centered at the true proportion with SD 0.05. Statistic 3's is centered 0.06 above the true proportion with SD 0.02. Which statistic is the best estimator?
    options:
      - "Statistic 2, because a wider spread is more likely to include the true value"
      - "Statistic 1, because it is unbiased and has the smallest variability"
      - "Statistic 3, because it has small variability"
      - "All three are equally good, because they have the same sample size"
    option_explanations:
      - |
        A wider spread means individual estimates miss by more; an estimator is a single number, not an interval.
      - |
        Correct. Statistic 1 is both unbiased (centered at the parameter) and the least variable.
      - |
        Statistic 3 has low variability but is biased: its estimates cluster around the wrong value.
      - |
        The three statistics behave differently, so they are not equally good, whatever the sample size.
    answer: 1
  - slug: apstats-u03-exam-q14
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Statistics CED, Topic 3.2"
    points: 1
    prompt: |
      At a large hypothetical bicycle chain, 12% of all bicycles sold are electric. For random samples of 150 sales, what is the standard deviation of the sampling distribution of p̂, the sample proportion of electric bicycles?
    options:
      - "About 0.0265"
      - "About 0.325"
      - "About 0.0007"
      - "About 0.0086"
    option_explanations:
      - |
        Correct. SD(p̂) = √(0.12·0.88/150) = √0.000704 ≈ 0.0265 (valid because 150 is less than 10% of the chain's sales).
      - |
        0.325 is √(0.12·0.88), the SD for a single sale; it has not been divided by n.
      - |
        0.0007 is the variance p(1 − p)/n; the square root has not been taken.
      - |
        0.0086 is p(1 − p)/√n, which takes the square root of n only.
    answer: 0
  - slug: apstats-u03-exam-q15
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Statistics CED, Topic 3.2"
    points: 1
    prompt: |
      In a hypothetical large city, 30% of all adults commute by public transit. For a random sample of 200 adults, what is the approximate probability that the sample proportion who commute by transit is at least 0.35?
    options:
      - "About 0.939"
      - "About 0.457"
      - "About 0.122"
      - "About 0.061"
    option_explanations:
      - |
        0.939 is the probability that p̂ is less than 0.35, the wrong tail.
      - |
        0.457 uses √(0.3·0.7) as the SD, forgetting to divide by n.
      - |
        0.122 doubles the tail area as if the question were two-sided.
      - |
        Correct. SD = √(0.3·0.7/200) ≈ 0.0324 (60 and 140 ≥ 10, so approximately normal); z = 0.05/0.0324 ≈ 1.54; P(Z ≥ 1.54) ≈ 0.061.
    answer: 3
  - slug: apstats-u03-exam-q16
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Statistics CED, Topic 3.3"
    points: 1
    prompt: |
      A hypothetical polling club wants a 95% confidence interval for the proportion of all voters in a state who support a ballot measure, with a margin of error of at most 0.03. It has no prior estimate of the proportion. What is the smallest sample size that guarantees this?
    options:
      - "33"
      - "752"
      - "1,068"
      - "1,067"
    option_explanations:
      - |
        33 comes from (1.96/0.03) · 0.5 without squaring; the formula is n = (z*/m)² p*(1 − p*).
      - |
        752 uses z* = 1.645, the 90% critical value.
      - |
        Correct. n = (1.96/0.03)² · 0.5 · 0.5 ≈ 1,067.1, and the sample size is always rounded up, to 1,068.
      - |
        1,067 rounds down; with 1,067 the margin of error would be slightly over 0.03, so round up.
    answer: 2
  - slug: apstats-u03-exam-q17
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Statistics CED, Topic 3.4"
    points: 1
    prompt: |
      A 99% confidence interval for the proportion of all residents of a hypothetical county who support a new library tax is (0.56, 0.64). Does the interval give convincing evidence that a majority of residents support the tax?
    options:
      - "No, because a 99% interval is too wide to support any claim."
      - "Yes, because every plausible value in the interval is greater than 0.50."
      - "Yes, because 99% of residents support the tax."
      - "No, because 0.50 is not in the interval, so the claim cannot be judged."
    option_explanations:
      - |
        A 99% interval is wider, but this one still lies entirely above 0.50, which supports the claim.
      - |
        Correct. The whole interval is above 0.50, so there is convincing evidence that more than half of all residents support the tax.
      - |
        99% is the confidence level of the method, not the proportion of supporters.
      - |
        0.50 lying outside (below) the interval is exactly what makes "a majority" convincing.
    answer: 1
  - slug: apstats-u03-exam-q18
    type: multiple_choice
    topic_code: "3.5"
    source: "AP Statistics CED, Topic 3.5"
    points: 1
    prompt: |
      A hypothetical school says that 25% of its students bike to school. A student believes the true proportion is higher and plans to survey a random sample. With p = the proportion of all students at the school who bike to school, which hypotheses should she use?
    options:
      - "H₀: p = 0.25; Hₐ: p > 0.25"
      - "H₀: p̂ = 0.25; Hₐ: p̂ > 0.25"
      - "H₀: p > 0.25; Hₐ: p = 0.25"
      - "H₀: p = 0.25; Hₐ: p ≠ 0.25"
    option_explanations:
      - |
        Correct. The school's claim is the null value; the student's belief that it is higher gives a one-sided alternative.
      - |
        Hypotheses are statements about the parameter p, not the sample statistic.
      - |
        The null hypothesis takes the equality; the belief being tested goes in Hₐ.
      - |
        The student suspects a higher proportion, so the alternative should be one-sided (>), chosen before seeing data.
    answer: 0
  - slug: apstats-u03-exam-q19
    type: multiple_choice
    topic_code: "3.6"
    source: "AP Statistics CED, Topic 3.6"
    points: 1
    prompt: |
      A hypothetical pizza shop tests H₀: p = 0.15 against Hₐ: p > 0.15, where p is the proportion of all its deliveries that arrive late. In a random sample of deliveries, p̂ = 0.19 and the p-value is 0.04. Which is the correct interpretation of the p-value?
    options:
      - "There is a 0.04 probability that 15% of all deliveries arrive late."
      - "There is a 0.04 probability that the sample proportion of 0.19 is wrong."
      - "4% of all deliveries arrive later than expected."
      - "Assuming 15% of all deliveries arrive late, there is a 0.04 probability of getting a sample proportion of 0.19 or greater by chance alone."
    option_explanations:
      - |
        The p-value is computed by assuming H₀ is true; it is not the probability that H₀ is true.
      - |
        The sample proportion is a fact about the sample; the p-value describes how unusual it would be under H₀.
      - |
        The p-value is a probability about the test statistic, not a proportion of deliveries.
      - |
        Correct. It states the assumption (p = 0.15), the observed result, the direction ("or greater") and "by chance alone".
    answer: 3
  - slug: apstats-u03-exam-q20
    type: multiple_choice
    topic_code: "3.6"
    source: "AP Statistics CED, Topic 3.6"
    points: 1
    prompt: |
      A one-sample z-test of H₀: p = 0.50 against Hₐ: p ≠ 0.50, about the proportion of all adults in a hypothetical city who prefer a four-day school week, gives z = 2.45. What is the p-value?
    options:
      - "About 0.007"
      - "About 0.993"
      - "About 0.014"
      - "About 0.986"
    option_explanations:
      - |
        0.007 is one tail; the two-sided alternative needs both tails.
      - |
        0.993 is the area to the left of 2.45, the wrong tail.
      - |
        Correct. p-value = 2 · P(Z ≥ 2.45) ≈ 2(0.0071) ≈ 0.014.
      - |
        0.986 is 1 minus the two-sided p-value, the area between −2.45 and 2.45.
    answer: 2
  - slug: apstats-u03-exam-q21
    type: multiple_choice
    topic_code: "3.7"
    source: "AP Statistics CED, Topic 3.7"
    points: 1
    prompt: |
      A test of H₀: p = 0.60 against Hₐ: p > 0.60, where p is the proportion of all customers at a hypothetical gym who renew their membership, gives a p-value of 0.08. Using α = 0.05, which conclusion is correct?
    options:
      - "Reject H₀; there is convincing evidence that more than 60% of customers renew."
      - "Fail to reject H₀; there is not convincing evidence that more than 60% of all the gym's customers renew."
      - "Fail to reject H₀; exactly 60% of the gym's customers renew."
      - "Reject H₀, because 0.08 is close to 0.05."
    option_explanations:
      - |
        The p-value 0.08 is greater than α = 0.05, so H₀ is not rejected.
      - |
        Correct. 0.08 > 0.05, so fail to reject H₀, stated with "not convincing evidence" in context.
      - |
        Failing to reject H₀ never shows that p equals 0.60.
      - |
        The decision compares the p-value with α; "close" does not count.
    answer: 1
  - slug: apstats-u03-exam-q22
    type: multiple_choice
    topic_code: "3.8"
    source: "AP Statistics CED, Topic 3.8"
    points: 1
    prompt: |
      A hypothetical electronics store tests H₀: p = 0.10 against Hₐ: p > 0.10, where p is the proportion of all batteries from a supplier that are defective. If the test shows convincing evidence for Hₐ, the store will change suppliers. Which describes a Type I error?
    options:
      - "Concluding that more than 10% of the batteries are defective, and changing suppliers, when in fact 10% are defective"
      - "Concluding that 10% are defective when in fact more than 10% are"
      - "Failing to find convincing evidence that more than 10% are defective when in fact more than 10% are"
      - "Finding a sample proportion of defective batteries above 0.10"
    option_explanations:
      - |
        Correct. A Type I error rejects a true H₀: the store abandons a supplier whose defect rate really is 10%.
      - |
        A test never concludes that H₀ is true; this also describes missing a real problem, which is a Type II error.
      - |
        This is a Type II error: failing to reject H₀ when Hₐ is true.
      - |
        A sample result is not a decision; errors are wrong decisions about the parameter.
    answer: 0
  - slug: apstats-u03-exam-q23
    type: multiple_choice
    topic_code: "3.8"
    source: "AP Statistics CED, Topic 3.8"
    points: 1
    prompt: |
      For a test about the proportion of all students at a hypothetical school who use the library each week, the significance level is changed from 0.01 to 0.05 with the sample size unchanged. What happens to the probabilities of the two errors?
    options:
      - "Both decrease."
      - "P(Type I) decreases and P(Type II) increases."
      - "Both increase."
      - "P(Type I) increases and P(Type II) decreases."
    option_explanations:
      - |
        For a fixed sample size the two error probabilities move in opposite directions; reducing both needs a larger sample.
      - |
        This is the effect of lowering α, the opposite change.
      - |
        Making rejection easier cannot increase the chance of failing to reject a false H₀.
      - |
        Correct. α = P(Type I) rises to 0.05; rejecting is easier, so power rises and P(Type II) falls.
    answer: 3
  - slug: apstats-u03-exam-q24
    type: multiple_choice
    topic_code: "3.8"
    source: "AP Statistics CED, Topic 3.8"
    points: 1
    prompt: |
      A hypothetical city will replace its water filters with a cheaper model only if a test gives convincing evidence that the cheaper model removes a contaminant from at least as large a proportion of samples as required. Wrongly concluding that the cheaper model is good enough could put residents at risk. Which significance level is most appropriate?
    options:
      - "α = 0.10, because it gives the test the most power"
      - "α = 0.50, because the two errors are equally likely"
      - "α = 0.01, because a Type I error here is serious, so its probability should be kept small"
      - "The level does not matter, because the p-value decides"
    option_explanations:
      - |
        A larger α raises power but also raises the chance of the dangerous Type I error.
      - |
        α = 0.50 would reject H₀ half the time even when it is true; that is not a sensible test.
      - |
        Correct. The serious mistake is wrongly rejecting H₀ (a Type I error), whose probability is α, so α should be small.
      - |
        The decision compares the p-value with α, so the choice of α matters and should reflect the consequences of each error.
    answer: 2
  - slug: apstats-u03-exam-q25
    type: multiple_choice
    topic_code: "3.9"
    source: "AP Statistics CED, Topic 3.9"
    points: 1
    prompt: |
      At two large hypothetical high schools, 45% of all students at Oak and 38% of all students at Pine have a library card. Independent random samples of 200 Oak students and 180 Pine students are taken. What are the mean and standard deviation of the sampling distribution of p̂_Oak − p̂_Pine?
    options:
      - "Mean 0.07, SD about 0.0025"
      - "Mean 0.07, SD about 0.0505"
      - "Mean 0.83, SD about 0.0505"
      - "Mean 0.07, SD about 0.0714"
    option_explanations:
      - |
        0.0025 is the variance (the sum under the square root); the SD is its square root.
      - |
        Correct. Mean = 0.45 − 0.38 = 0.07; SD = √(0.45·0.55/200 + 0.38·0.62/180) ≈ 0.0505.
      - |
        0.83 adds the two proportions; the mean of a difference is the difference p₁ − p₂.
      - |
        0.0714 adds the two separate SDs; the terms are added under one square root.
    answer: 1
  - slug: apstats-u03-exam-q26
    type: multiple_choice
    topic_code: "3.9"
    source: "AP Statistics CED, Topic 3.9"
    points: 1
    prompt: |
      For the Oak and Pine samples in the previous question (p_Oak = 0.45, p_Pine = 0.38, samples of 200 and 180), what is the approximate probability that the Pine sample has a higher proportion of library-card holders than the Oak sample?
    options:
      - "About 0.083"
      - "About 0.917"
      - "About 0.500"
      - "About 0.165"
    option_explanations:
      - |
        Correct. The event is p̂_Oak − p̂_Pine < 0. z = (0 − 0.07)/0.0505 ≈ −1.39 and P(Z < −1.39) ≈ 0.083 (all four counts are at least 10, so normal).
      - |
        0.917 is the probability that Oak's sample proportion is higher, the complement.
      - |
        0.500 would be right only if p_Oak = p_Pine; the distribution is centered at 0.07.
      - |
        0.165 doubles the tail as if the question were two-sided.
    answer: 0
  - slug: apstats-u03-exam-q27
    type: multiple_choice
    topic_code: "3.10"
    source: "AP Statistics CED, Topic 3.10"
    points: 1
    prompt: |
      A hypothetical health survey reports a 95% confidence interval of (0.03, 0.11) for the difference between the proportions of all teenagers and all adults in a state who drink a sugary drink every day. What does the 95% confidence level mean?
    options:
      - "95% of teenagers drink between 3 and 11 percentage points more sugary drinks than adults."
      - "There is a 95% probability that the true difference lies between 0.03 and 0.11."
      - "95% of all samples will give a difference in sample proportions between 0.03 and 0.11."
      - "If many pairs of random samples were taken and a 95% interval built from each, about 95% of the intervals would capture the true difference in proportions."
    option_explanations:
      - |
        The interval is about a difference between two population proportions, not about how individuals behave.
      - |
        The true difference is fixed; this particular interval either captures it or not.
      - |
        Sample differences vary around the true difference, not around this interval.
      - |
        Correct. The confidence level is the long-run capture rate of the method.
    answer: 3
  - slug: apstats-u03-exam-q28
    type: multiple_choice
    topic_code: "3.12"
    source: "AP Statistics CED, Topic 3.12"
    points: 1
    prompt: |
      Independent random samples from two large hypothetical towns find that 12 of 80 adults in East Town and 30 of 90 adults in West Town own an electric car. Which is a correct Large Counts check for a two-sample z-test of H₀: p_E = p_W?
    options:
      - "Met, because both samples have at least 30 adults."
      - "Met, because 12 + 30 = 42 is at least 10."
      - "Met: p̂_c = 42/170 ≈ 0.247, and 80(0.247) ≈ 19.8, 80(0.753) ≈ 60.2, 90(0.247) ≈ 22.2 and 90(0.753) ≈ 67.8 are all at least 10."
      - "Not met, because East Town's sample proportion, 0.15, is less than 0.5."
    option_explanations:
      - |
        "At least 30" is the rule for means; proportions need expected successes and failures of at least 10 in each group.
      - |
        The total number of successes is not the check; each group needs at least 10 expected successes and 10 expected failures.
      - |
        Correct. A test assumes H₀, so the counts are computed with the pooled proportion, and all four are at least 10.
      - |
        A proportion does not need to be near 0.5; it only needs enough expected successes and failures.
    answer: 2
  - slug: apstats-u03-exam-q29
    type: multiple_choice
    topic_code: "3.14"
    source: "AP Statistics CED, Topic 3.14"
    points: 1
    prompt: |
      A hypothetical sleep researcher randomly assigns 150 volunteers to use one of three sleep apps (50 each) for a month, then records each volunteer's usual bedtime category (before 10 p.m., 10–11 p.m., 11 p.m.–midnight, after midnight). Which test should be used to decide whether the bedtime distribution differs by app?
    options:
      - "A chi-square test for independence"
      - "A chi-square test for homogeneity"
      - "A two-sample z-test for p₁ − p₂"
      - "A one-sample z-test for p"
    option_explanations:
      - |
        Independence uses one sample classified on two variables; here the researcher created three treatment groups by random assignment.
      - |
        Correct. Three randomly assigned treatment groups and one categorical response: compare the response distributions with a test for homogeneity.
      - |
        A two-sample z-test compares one proportion in two groups; there are three groups and four categories.
      - |
        A one-sample test is about one proportion in one population.
    answer: 1
  - slug: apstats-u03-exam-q30
    type: multiple_choice
    topic_code: "3.15"
    source: "AP Statistics CED, Topic 3.15"
    points: 1
    prompt: |
      A chi-square test for independence on a two-way table of counts gives χ² = 5.2. If every count in the table were doubled, keeping the same proportions, what would happen?
    options:
      - "χ² would double to 10.4, the df would stay the same, and the p-value would be smaller."
      - "χ² would stay at 5.2, because the proportions are unchanged."
      - "χ² would double, and the df would double too, so the p-value would stay the same."
      - "χ² would be halved, because the expected counts double."
    option_explanations:
      - |
        Correct. Each (O − E)²/E doubles when O and E both double, so χ² doubles; df depends only on the table's shape, so the p-value falls.
      - |
        χ² depends on the counts, not only the proportions; this is why the test must use counts.
      - |
        df = (r − 1)(c − 1) depends on the number of rows and columns, which have not changed.
      - |
        The numerator (O − E)² grows by a factor of 4 while E grows by 2, so each term doubles, not halves.
    answer: 0
  - slug: apstats-u03-exam-q31
    type: multi_select
    topic_code: "3.1"
