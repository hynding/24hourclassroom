    - slug: apcalcbc-u06-w16-q23
      type: short_answer
      topic_code: "6.12"
      source: "AP Calculus CED, Topic 6.12"
      points: 3
      prompt: |
        Let f(x) = (x + 5)/(x² + x − 2).

        (a) Write f(x) as a sum of partial fractions.
        (b) Evaluate ∫ from 2 to 4 of f(x) dx exactly.
        (c) Explain why the Fundamental Theorem cannot be applied directly to ∫ from 0 to 2 of f(x) dx.
      answer: |
        (a) x² + x − 2 = (x + 2)(x − 1). x + 5 = A(x − 1) + B(x + 2): x = 1 gives 6 = 3B, B = 2; x = −2 gives 3 = −3A, A = −1. So f(x) = −1/(x + 2) + 2/(x − 1).
        (b) [−ln|x + 2| + 2 ln|x − 1|] from 2 to 4 = (−ln 6 + 2 ln 3) − (−ln 4 + 0) = ln(9 · 4/6) = ln 6.
        (c) f is not continuous on [0, 2]: it has a vertical asymptote at x = 1, inside the interval, so the theorem's hypothesis fails (the integral is improper, the topic of next week).
      explanation: |
        Three points, one per part. (a) Both constants correct (A = −1, B = 2) with the factored denominator. (b) ln 6, or an equivalent such as 2 ln 3 − ln(3/2), from correct logarithm antiderivatives. (c) Names the discontinuity (vertical asymptote) at x = 1 inside [0, 2] and that the Fundamental Theorem needs f continuous on the interval.
    - slug: apcalcbc-u06-w16-q24
      type: short_answer
      topic_code: "6.14"
      source: "AP Calculus CED, Topic 6.14"
      points: 3
      prompt: |
        For each integral, name the technique you would use and find the antiderivative.

        (a) ∫ x·e^(x²) dx
        (b) ∫ x·eˣ dx
        (c) ∫ 1/(x² + 2x + 2) dx
      answer: |
        (a) u-substitution with u = x², du = 2x dx: (1/2)e^(x²) + C.
        (b) Integration by parts with u = x, dv = eˣ dx: x eˣ − eˣ + C.
        (c) Completing the square, x² + 2x + 2 = (x + 1)² + 1: arctan(x + 1) + C.
      explanation: |
        Three points, one per part; each needs both a suitable technique and a correct antiderivative (the + C may be missing once without penalty). (a) Substitution, (1/2)e^(x²). (b) Parts, (x − 1)eˣ. (c) Completing the square, arctan(x + 1). A student who reaches the correct antiderivative by another valid method earns the point.
    - slug: apcalcbc-u06-w16-q25
      type: long_answer
      topic_code: "6.11"
      source: "AP Calculus CED, Topic 6.11"
      points: 6
      prompt: |
        Let f(x) = x·e^(−x) for x ≥ 0. Let R be the region bounded by the graph of f, the x-axis and the vertical line x = 2.

        (A) Find f′(x). Find the absolute maximum value of f on the interval 0 ≤ x ≤ 2, and justify your answer.

        (B) Use integration by parts to find the exact area of R. Show the choice of u and dv.

        (C) Find the average value of f on the interval 0 ≤ x ≤ 2.

        (D) Let g(x) = ∫ from 0 to x of t·e^(−t) dt for x ≥ 0. At what value of x does the graph of g have a point of inflection? Justify your answer.
      answer: |
        (A) f′(x) = e^(−x) − x e^(−x) = (1 − x)e^(−x). f′(x) = 0 only at x = 1. Candidates: f(0) = 0, f(1) = 1/e ≈ 0.368, f(2) = 2/e² ≈ 0.271. The absolute maximum value on [0, 2] is 1/e, at x = 1.
        (B) u = x, dv = e^(−x) dx, so du = dx and v = −e^(−x). Area = [−x e^(−x)] from 0 to 2 + ∫ from 0 to 2 of e^(−x) dx = −2e^(−2) + [−e^(−x)] from 0 to 2 = −2e^(−2) − e^(−2) + 1 = 1 − 3e^(−2) ≈ 0.594.
        (C) Average value = (1/(2 − 0)) ∫ from 0 to 2 of f(x) dx = (1 − 3e^(−2))/2 ≈ 0.297.
        (D) g′(x) = x e^(−x) and g″(x) = (1 − x)e^(−x). g″ changes from positive to negative at x = 1 (e^(−x) > 0 always), so the graph of g has a point of inflection at x = 1.
      explanation: |
        Six points. (A) 1 point for f′(x) = (1 − x)e^(−x); 1 point for the maximum 1/e at x = 1 justified by a Candidates Test (f(0), f(1), f(2)) or by f′ changing from positive to negative at the only critical point. (B) 1 point for a correct parts setup (u = x, dv = e^(−x) dx, v = −e^(−x)); 1 point for 1 − 3e^(−2), with the boundary term evaluated at both limits. (C) 1 point for (1 − 3e^(−2))/2, read from the answer to (B). (D) 1 point for x = 1 with the justification that g″ = f′ changes sign there; "g″(1) = 0" alone does not earn the point.
