      source: "AP Calculus CED, Topic 6.13"
      points: 3
      prompt: |
        Consider ∫ from 0 to 1 of ln x dx.

        (a) Explain why this integral is improper, and write it as a limit of definite integrals.
        (b) Use integration by parts to find ∫ from t to 1 of ln x dx for 0 < t < 1.
        (c) Evaluate the limit, showing how you handle t ln t, and state whether the integral converges.
      answer: |
        (a) ln x → −∞ as x → 0⁺, so the integrand is unbounded at the lower limit. ∫ from 0 to 1 of ln x dx = lim (t→0⁺) ∫ from t to 1 of ln x dx.
        (b) u = ln x, dv = dx, v = x: [x ln x − x] from t to 1 = (0 − 1) − (t ln t − t) = −1 − t ln t + t.
        (c) t ln t = (ln t)/(1/t), of the form −∞/∞; L'Hospital's Rule gives (1/t)/(−1/t²) = −t → 0. So the limit is −1 − 0 + 0 = −1. The integral converges to −1.
      explanation: |
        Three points, one per part. (a) Names the unbounded integrand at x = 0 and writes the one-sided limit (t → 0⁺). (b) −1 − t ln t + t, or an equivalent, from a correct parts antiderivative. (c) Shows t ln t → 0 (by L'Hospital's Rule on (ln t)/(1/t) or equivalent reasoning) and concludes convergence to −1.
