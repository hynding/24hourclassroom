    - slug: apcalcbc-u06-w17-q25
      type: long_answer
      topic_code: "6.13"
      source: "AP Calculus CED, Topic 6.13"
      points: 6
      prompt: |
        Let f(x) = 6/((x + 1)(x + 2)) for x ≥ 0.

        (A) Write f(x) as a sum of partial fractions.

        (B) Write ∫ from 0 to ∞ of f(x) dx as a limit and evaluate it, or show that it diverges.

        (C) A student writes ∫ from 0 to ∞ of f(x) dx = ∫ from 0 to ∞ of 6/(x + 1) dx − ∫ from 0 to ∞ of 6/(x + 2) dx. Show that ∫ from 0 to ∞ of 6/(x + 1) dx diverges, and explain why the student's step is not valid.

        (D) Let F(t) = ∫ from 0 to t of f(x) dx for t ≥ 0. Explain why F is increasing, and find lim (t→∞) F(t).
      answer: |
        (A) 6 = A(x + 2) + B(x + 1). x = −1 gives A = 6; x = −2 gives 6 = −B, B = −6. f(x) = 6/(x + 1) − 6/(x + 2).
        (B) ∫ from 0 to ∞ of f(x) dx = lim (b→∞) ∫ from 0 to b of f(x) dx = lim (b→∞) [6 ln((x + 1)/(x + 2))] from 0 to b = lim (b→∞) 6 ln((b + 1)/(b + 2)) − 6 ln(1/2) = 6 ln 1 + 6 ln 2 = 6 ln 2 ≈ 4.159. It converges.
        (C) ∫ from 0 to ∞ of 6/(x + 1) dx = lim (b→∞) 6 ln(b + 1) = ∞, so it diverges (and so does the other piece). The split gives ∞ − ∞, which has no value; an improper integral may be split into a difference only when both pieces converge. The logarithms must be combined on [0, b] before taking the limit.
        (D) By the Fundamental Theorem, F′(t) = f(t) = 6/((t + 1)(t + 2)) > 0 for t ≥ 0, so F is increasing. lim (t→∞) F(t) = ∫ from 0 to ∞ of f(x) dx = 6 ln 2.
      explanation: |
        Six points. (A) 1 point for A = 6 and B = −6. (B) 1 point for the limit notation lim (b→∞) ∫ from 0 to b with the combined logarithm antiderivative; 1 point for 6 ln 2 with the limit of ln((b + 1)/(b + 2)) shown to be 0. (C) 1 point for showing lim (b→∞) 6 ln(b + 1) = ∞; 1 point for explaining that the split produces ∞ − ∞ (both pieces diverge), so the step is invalid. (D) 1 point for F′(t) = f(t) > 0 and the limit 6 ln 2 (the answer from (B) may be imported).
