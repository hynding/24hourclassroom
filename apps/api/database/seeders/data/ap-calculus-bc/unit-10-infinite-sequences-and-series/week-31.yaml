    - slug: apcalcbc-u10-w31-q23
      type: long_answer
      topic_code: "10.13"
      source: "AP Calculus CED, Topic 10.13"
      points: 7
      prompt: |
        Let f be the function defined by the power series

        f(x) = ∑ (n = 1 to ∞) (−1)^(n+1) (x − 4)ⁿ/(n·2ⁿ) = (x − 4)/2 − (x − 4)²/8 + (x − 4)³/24 − ⋯

        for all x where the series converges.

        (A) Use the Ratio Test to find the radius of convergence of the series.

        (B) Find the interval of convergence. Justify your conclusion at each endpoint.

        (C) Write the first three nonzero terms and the general term of the series for f′(x). Find the interval of convergence of this series, with justification at each endpoint.

        (D) Use the first two nonzero terms of the series for f to approximate f(5). Show that this approximation differs from f(5) by less than 0.05.
      answer: |
        (A) |aₙ₊₁/aₙ| = |x − 4|/2 · n/(n + 1) → |x − 4|/2. The series converges when |x − 4|/2 < 1, so R = 2.
        (B) At x = 6: ∑ (−1)^(n+1) 2ⁿ/(n·2ⁿ) = ∑ (−1)^(n+1)/n, which converges by the Alternating Series Test (1/n decreases to 0). At x = 2: ∑ (−1)^(n+1)(−2)ⁿ/(n·2ⁿ) = ∑ (−1)^(2n+1)/n = −∑ 1/n, the negative of the harmonic series, which diverges. Interval: 2 < x ≤ 6.
        (C) f′(x) = 1/2 − (x − 4)/4 + (x − 4)²/8 − ⋯ = ∑ (n = 1 to ∞) (−1)^(n+1)(x − 4)^(n−1)/2ⁿ. The radius is still 2. At x = 6 the terms are (−1)^(n+1)/2, and at x = 2 they are all 1/2; neither goes to 0, so both endpoints diverge by the nth Term Test. Interval: 2 < x < 6.
        (D) f(5) ≈ 1/2 − 1/8 = 3/8 = 0.375. At x = 5 the series is ∑ (−1)^(n+1)/(n·2ⁿ), alternating with terms 1/(n·2ⁿ) that decrease to 0, so the error is at most the first omitted term, 1/(3·2³) = 1/24 ≈ 0.0417 < 0.05.
      explanation: |
        Seven points. (A) 1 point: correct ratio limit |x − 4|/2 and R = 2. (B) 2 points: 1 for x = 6 included with the Alternating Series Test (or "alternating harmonic series converges"), 1 for x = 2 excluded with the harmonic series named, and the interval 2 < x ≤ 6 stated. (C) 2 points: 1 for the three terms and general term of f′, 1 for the interval 2 < x < 6 with an nth Term Test reason at each endpoint. (D) 2 points: 1 for 3/8, 1 for the alternating series error bound with its conditions and 1/24 < 0.05. A Lagrange-based argument with a correct bound also earns the final point.
