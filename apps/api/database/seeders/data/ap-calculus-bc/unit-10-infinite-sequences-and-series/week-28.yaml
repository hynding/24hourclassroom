week: 28
unit: 10
title: "The Integral Test, p-Series and Comparison Tests"
topics: ["10.4", "10.5", "10.6"]
guide: guides/week-28.md
guide_description: |
  The integral test and its three hypotheses (the function is positive, continuous and decreasing), and why the
  integral's value is not the series' sum; the harmonic series and the p-series ∑ 1/nᵖ, which converge exactly when
  p > 1; and the direct comparison and limit comparison tests, with the exact conditions AP readers look for.
  Worked examples: the integral test on ∑ n/(n² + 1) (divergent) and on ∑ (n = 2 to ∞) 1/(n(ln n)²) (convergent),
  why the harmonic series diverges, classifying five p-series after rewriting them, direct comparisons for
  ∑ 1/(n² + 5) and ∑ (n = 3 to ∞) (ln n)/n, and limit comparisons for ∑ (2n + 1)/(n³ + 4) and ∑ 1/(2n − 1).
flashcards_description: |
  30 cards on the integral test and its hypotheses, the harmonic series, p-series, direct comparison, limit
  comparison, choosing a comparison series by dominant terms, the justification sentences for each test, and the
  error patterns in comparing in the wrong direction and equating an integral with a sum.

flashcards:
  - front: Integral test → hypotheses on f
    back: |
      f(n) = aₙ, and f is positive, continuous and decreasing for x ≥ N (some starting value). All three must be checked and stated.
    topic_code: "10.4"
  - front: Integral test → conclusion when its hypotheses hold
    back: |
      ∑ (n = N to ∞) aₙ and ∫ from N to ∞ of f(x) dx either both converge or both diverge.
    topic_code: "10.4"
  - front: Integral test with ∫ from 1 to ∞ of f(x) dx = 1/4 → is the series' sum 1/4?
    back: |
      No. The test gives convergence only. For decreasing f the sum ∑ (n = 1 to ∞) f(n) is larger than ∫ from 1 to ∞ of f(x) dx, because left-endpoint rectangles lie above the graph.
    topic_code: "10.4"
  - front: Integral test → how to show f is decreasing
    back: |
      Show f′(x) < 0 for x ≥ N, or argue that the denominator increases while the numerator stays positive and fixed.
    topic_code: "10.4"
  - front: ∑ (n = 1 to ∞) n/(n² + 1) by the integral test → verdict
    back: |
      f(x) = x/(x² + 1) is positive, continuous and decreasing for x ≥ 1; ∫ from 1 to ∞ of f = lim (1/2)ln(x² + 1) − (1/2)ln 2 = ∞. The series diverges.
    topic_code: "10.4"
  - front: ∑ (n = 2 to ∞) 1/(n(ln n)²) by the integral test → verdict
    back: |
      With u = ln x, ∫ from 2 to ∞ of dx/(x(ln x)²) = [−1/ln x] from 2 to ∞ = 1/ln 2, finite. The series converges.
    topic_code: "10.4"
  - front: ∑ (n = 1 to ∞) (2 + sin n)/n² → why the integral test does not apply
    back: |
      f(x) = (2 + sin x)/x² is positive and continuous but not eventually decreasing (sin x keeps wiggling). Use direct comparison with 3/n² instead.
    topic_code: "10.4"
  - front: Harmonic series ∑ (n = 1 to ∞) 1/n → behaviour and reason
    back: |
      Diverges, although 1/n → 0. Integral test: ∫ from 1 to ∞ of dx/x = lim ln b = ∞. Its partial sums grow like ln n.
    topic_code: "10.5"
  - front: p-series ∑ (n = 1 to ∞) 1/nᵖ → when it converges
    back: |
      Exactly when p > 1. It diverges for p ≤ 1 (p = 1 is the harmonic series).
    topic_code: "10.5"
  - front: ∑ (n = 1 to ∞) √n/n² → p-series form and verdict
    back: |
      √n/n² = 1/n^(3/2), a p-series with p = 3/2 > 1: converges.
    topic_code: "10.5"
  - front: ∑ (n = 1 to ∞) 1/∛n → p-series form and verdict
    back: |
      1/n^(1/3), a p-series with p = 1/3 ≤ 1: diverges.
    topic_code: "10.5"
  - front: ∑ (n = 1 to ∞) 7/n → behaviour
    back: |
      7 times the harmonic series: diverges. A nonzero constant multiple never changes convergence.
    topic_code: "10.5"
  - front: ∑ (n = 1 to ∞) n^(−π) → behaviour
    back: |
      1/n^π with p = π ≈ 3.14 > 1: converges.
    topic_code: "10.5"
  - front: p-series test → justification sentence
    back: |
      "∑ 1/n^(3/2) is a p-series with p = 3/2 > 1, so it converges." Name p and compare it with 1.
    topic_code: "10.5"
  - front: Direct comparison test → statement
    back: |
      Suppose 0 ≤ aₙ ≤ bₙ for all n ≥ N. If ∑ bₙ converges, then ∑ aₙ converges. If ∑ aₙ diverges, then ∑ bₙ diverges.
    topic_code: "10.6"
  - front: Direct comparison → the two useless directions
    back: |
      Smaller than a divergent series, or larger than a convergent one, proves nothing. You need "smaller than convergent" or "larger than divergent".
    topic_code: "10.6"
  - front: ∑ (n = 1 to ∞) 1/(n² + 5) by direct comparison → argument
    back: |
      0 < 1/(n² + 5) < 1/n² for all n ≥ 1, and ∑ 1/n² converges (p = 2 > 1), so ∑ 1/(n² + 5) converges.
    topic_code: "10.6"
  - front: ∑ (n = 3 to ∞) (ln n)/n by direct comparison → argument
    back: |
      For n ≥ 3, ln n > 1, so (ln n)/n > 1/n > 0. The harmonic series diverges, so ∑ (ln n)/n diverges.
    topic_code: "10.6"
  - front: ∑ (n = 1 to ∞) 2ⁿ/(3ⁿ + 1) by direct comparison → argument
    back: |
      0 < 2ⁿ/(3ⁿ + 1) < 2ⁿ/3ⁿ = (2/3)ⁿ, and the geometric series ∑ (2/3)ⁿ converges (|r| < 1), so the series converges.
    topic_code: "10.6"
  - front: Limit comparison test → statement
    back: |
      If aₙ > 0, bₙ > 0 and lim (n→∞) aₙ/bₙ = L with 0 < L < ∞, then ∑ aₙ and ∑ bₙ both converge or both diverge.
    topic_code: "10.6"
  - front: Limit comparison → how to choose bₙ
    back: |
      Keep only the dominant (highest-power) part of the numerator and of the denominator. (2n + 1)/(n³ + 4) behaves like 2n/n³, so take bₙ = 1/n².
    topic_code: "10.6"
  - front: ∑ (n = 1 to ∞) (2n + 1)/(n³ + 4) by limit comparison → verdict
    back: |
      With bₙ = 1/n², lim aₙ/bₙ = lim (2n³ + n²)/(n³ + 4) = 2, and 0 < 2 < ∞. ∑ 1/n² converges, so the series converges.
    topic_code: "10.6"
  - front: ∑ (n = 1 to ∞) 1/(2n − 1) by limit comparison → verdict
    back: |
      With bₙ = 1/n, lim n/(2n − 1) = 1/2, and 0 < 1/2 < ∞. The harmonic series diverges, so this series diverges.
    topic_code: "10.6"
  - front: Limit comparison giving L = 0 or L = ∞ → conclusion
    back: |
      Generally none from the basic test: pick a better comparison series whose dominant terms match, so the limit is a positive finite number.
    topic_code: "10.6"
  - front: Limit comparison justification → what AP readers want
    back: |
      Name bₙ and its behaviour, show the limit, and state 0 < L < ∞: "lim aₙ/(1/n²) = 2, a finite positive number, and ∑ 1/n² converges, so ∑ aₙ converges by the limit comparison test."
    topic_code: "10.6"
  - front: Direct comparison versus limit comparison → when to prefer the limit test
    back: |
      When the inequality goes the wrong way. 1/(n² − 3) is larger than 1/n², so direct comparison with 1/n² fails, but lim (1/(n² − 3))/(1/n²) = 1 settles it at once.
    topic_code: "10.6"
  - front: Series with positive terms, tests from this week → which to try first
    back: |
      Rational or root expressions: p-series or limit comparison. Something easy to integrate (with ln n or x e^(−x²) pieces): the integral test. Bounded wiggles like sin n: direct comparison.
    topic_code: "10.6"
  - front: Error-spot → "1/(n² + n) < 1/n and ∑ 1/n diverges, so ∑ 1/(n² + n) diverges"
    back: |
      Being smaller than a divergent series proves nothing. Compare with 1/n² instead: 1/(n² + n) < 1/n², and ∑ 1/n² converges, so the series converges.
    topic_code: "10.6"
  - front: Error-spot → "∑ 1/√n converges because it is a p-series and p = 1/2 > 0"
    back: |
      The condition is p > 1, not p > 0. With p = 1/2 ≤ 1 the series diverges.
    topic_code: "10.5"
  - front: Error-spot → "∫ from 1 to ∞ of x e^(−x²) dx = 1/(2e), so ∑ n e^(−n²) = 1/(2e)"
    back: |
      The integral test gives convergence, not the sum. Here the first term alone, 1/e ≈ 0.368, already exceeds 1/(2e) ≈ 0.184.
    topic_code: "10.4"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 10.4, 10.5 and 10.6: the integral test, the harmonic
    series and p-series, and the direct and limit comparison tests), with 8 questions (about 35%) reviewing earlier
    weeks (the nth term test and geometric series from week 27, partial fractions and improper integrals from weeks
    16 and 17, logistic growth from week 20, and parametric arc length from week 24). Opens with a shared-context set
    on the integral test for ∑ n e^(−n²). Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. No calculator is needed.
  questions:
    # ---- Stimulus set: the integral test for ∑ n e^(−n²) (10.4, 10.3)
    - slug: apcalcbc-u10-w28-q01
      type: multiple_choice
      topic_code: "10.4"
      source: "AP Calculus CED, Topic 10.4"
      points: 1
      stimulus: |
        Consider the series ∑ (n = 1 to ∞) n e^(−n²) and the function f(x) = x e^(−x²), so that f(n) is the nth term of the series. Note that f′(x) = (1 − 2x²)e^(−x²).
      prompt: |
        Which statement gives the conditions on f that must be verified before the integral test is applied on [1, ∞)?
      options:
        - "f is positive, continuous and decreasing for x ≥ 1."
        - "f is positive and continuous for x ≥ 1; whether f decreases does not matter."
        - "f is increasing for x ≥ 1, so the integral is an upper bound."
        - "lim (x→∞) f(x) = 0; nothing else needs to be checked."
      option_explanations:
        - |
          Correct. For x ≥ 1, x > 0 and e^(−x²) > 0, so f is positive; it is continuous; and f′(x) = (1 − 2x²)e^(−x²) < 0 because 2x² > 1, so f is decreasing.
        - |
          Decreasing is a required hypothesis: the comparison between the rectangles and the area only works when f is decreasing.
        - |
          f′(x) = (1 − 2x²)e^(−x²) is negative for x ≥ 1, so f is decreasing there, not increasing.
        - |
          A limit of 0 is only the nth term condition, which never proves convergence; the integral test needs positive, continuous and decreasing.
      answer: 0
    - slug: apcalcbc-u10-w28-q02
      type: multiple_choice
      topic_code: "10.4"
      source: "AP Calculus CED, Topic 10.4"
      points: 1
      stimulus: |
        Consider the series ∑ (n = 1 to ∞) n e^(−n²) and the function f(x) = x e^(−x²), so that f(n) is the nth term of the series. Note that f′(x) = (1 − 2x²)e^(−x²).
      prompt: |
        What is the value of ∫ from 1 to ∞ of x e^(−x²) dx?
      options:
        - "1/e"
        - "−1/(2e)"
        - "1/(2e)"
        - "The integral diverges."
      option_explanations:
        - |
          1/e forgets the factor 1/2 from the substitution u = x², du = 2x dx.
        - |
          −1/(2e) evaluates in the wrong order, lower limit minus upper limit.
        - |
          Correct. With u = x², ∫ x e^(−x²) dx = −(1/2)e^(−x²). So the integral is lim (b→∞) [−(1/2)e^(−b²) + (1/2)e^(−1)] = 1/(2e).
        - |
          e^(−x²) decays very fast, so the area is finite: the limit of the proper integrals is 1/(2e).
      answer: 2
    - slug: apcalcbc-u10-w28-q03
      type: multiple_choice
      topic_code: "10.4"
      source: "AP Calculus CED, Topic 10.4"
      points: 1
      stimulus: |
        Consider the series ∑ (n = 1 to ∞) n e^(−n²) and the function f(x) = x e^(−x²), so that f(n) is the nth term of the series. Note that f′(x) = (1 − 2x²)e^(−x²).
      prompt: |
        What does the integral test conclude about ∑ (n = 1 to ∞) n e^(−n²)?
      options:
        - "The series converges, and its sum is 1/(2e)."
        - "The series converges, but its sum is not given by the value of the integral."
        - "The series diverges, because the integral is positive."
        - "The test is inconclusive, because f is not decreasing on all of [0, ∞)."
      option_explanations:
        - |
          The integral test decides convergence only. The sum is larger than the integral: the first term alone, 1/e ≈ 0.368, exceeds 1/(2e) ≈ 0.184.
        - |
          Correct. The hypotheses hold on [1, ∞) and the improper integral converges, so the series converges; the integral's value is not the sum.
        - |
          A positive, finite integral means convergence; divergence would need the integral to be infinite.
        - |
          The hypotheses are needed only from the series' starting index on (here x ≥ 1), and f is decreasing there.
      answer: 1
    - slug: apcalcbc-u10-w28-q04
      type: true_false
      topic_code: "10.3"
      source: "AP Calculus CED, Topic 10.3"
      points: 1
      stimulus: |
        Consider the series ∑ (n = 1 to ∞) n e^(−n²) and the function f(x) = x e^(−x²), so that f(n) is the nth term of the series. Note that f′(x) = (1 − 2x²)e^(−x²).
      prompt: |
        True or false: Because lim (n→∞) n e^(−n²) = 0, the nth term test by itself shows that this series converges.
      answer: false
      explanation: |
        False. The nth term test can only show divergence; a limit of 0 makes it inconclusive. The series does converge, but that conclusion comes from the integral test.
    # ---- Independent items
    - slug: apcalcbc-u10-w28-q05
      type: multiple_choice
      topic_code: "10.5"
      source: "AP Calculus CED, Topic 10.5"
      points: 1
      prompt: |
        Which of the following series converges?
      options:
        - "∑ (n = 1 to ∞) 1/√n"
        - "∑ (n = 1 to ∞) n/n^(5/2)"
        - "∑ (n = 1 to ∞) n^(−1)"
        - "∑ (n = 1 to ∞) ∛n/n"
      option_explanations:
        - |
          1/√n = 1/n^(1/2), a p-series with p = 1/2 ≤ 1, so it diverges.
        - |
          Correct. n/n^(5/2) = 1/n^(3/2), a p-series with p = 3/2 > 1, so it converges.
        - |
          n^(−1) = 1/n is the harmonic series, which diverges.
        - |
          ∛n/n = 1/n^(2/3), a p-series with p = 2/3 ≤ 1, so it diverges.
      answer: 1
    - slug: apcalcbc-u10-w28-q06
      type: multiple_choice
      topic_code: "10.5"
      source: "AP Calculus CED, Topic 10.5"
      points: 1
      prompt: |
        For which values of the constant p does ∑ (n = 1 to ∞) 1/n^(3p + 4) converge?
      options:
        - "p > −4/3"
        - "p ≥ −1"
        - "p > 1"
        - "p > −1"
      option_explanations:
        - |
          p > −4/3 only makes the exponent 3p + 4 positive, so that the terms approach 0; convergence needs the exponent greater than 1.
        - |
          p = −1 gives exponent 1, the harmonic series, which diverges; the inequality must be strict.
        - |
          This applies the p-series condition to the constant p itself instead of to the whole exponent 3p + 4.
        - |
          Correct. This is a p-series with exponent 3p + 4, which converges exactly when 3p + 4 > 1, that is p > −1.
      answer: 3
    - slug: apcalcbc-u10-w28-q07
      type: multiple_choice
      topic_code: "10.6"
      source: "AP Calculus CED, Topic 10.6"
      points: 1
      prompt: |
        Which argument correctly uses the direct comparison test to determine whether ∑ (n = 1 to ∞) 1/(n² + 4n) converges?
      options:
        - "0 < 1/(n² + 4n) ≤ 1/n² for all n ≥ 1, and ∑ 1/n² converges, so the series converges."
        - "1/(n² + 4n) ≥ 1/(5n²) for all n ≥ 1, and ∑ 1/(5n²) converges, so the series converges."
        - "1/(n² + 4n) ≤ 1/n for all n ≥ 1, and ∑ 1/n diverges, so the series diverges."
        - "1/(n² + 4n) ≤ 1/(4n) for all n ≥ 1, and ∑ 1/(4n) diverges, so the series diverges."
      option_explanations:
        - |
          Correct. n² + 4n ≥ n² makes the terms no larger than 1/n², and ∑ 1/n² is a convergent p-series (p = 2 > 1), so the smaller positive series converges.
        - |
          The inequality is true, but being larger than a convergent series proves nothing; the comparison runs in the useless direction.
        - |
          Being smaller than a divergent series proves nothing, and the series in fact converges.
        - |
          Again smaller than a divergent series: no conclusion is possible from this comparison.
      answer: 0
    - slug: apcalcbc-u10-w28-q08
      type: multiple_choice
      topic_code: "10.6"
      source: "AP Calculus CED, Topic 10.6"
      points: 1
      prompt: |
        The limit comparison test is applied to ∑ (n = 1 to ∞) (3n² − 1)/(n⁴ + 2n), comparing with ∑ 1/n². Which gives the correct limit and conclusion?
      options:
        - "The limit is 3; the series diverges because the limit is greater than 1."
        - "The limit is 0; the series converges because the terms approach 0."
        - "The limit is 3; the series converges because 0 < 3 < ∞ and ∑ 1/n² converges."
        - "The limit is 3; the test is inconclusive because the limit is not 1."
      option_explanations:
        - |
          This confuses the limit comparison test with the ratio test; any finite positive limit means both series behave the same way.
        - |
          0 is lim aₙ, not lim aₙ/(1/n²); the comparison divides by bₙ first.
        - |
          Correct. aₙ/(1/n²) = (3n⁴ − n²)/(n⁴ + 2n) → 3, a finite positive number, and ∑ 1/n² converges (p = 2 > 1), so the series converges.
        - |
          The limit need only be finite and positive; it does not have to equal 1.
      answer: 2
    - slug: apcalcbc-u10-w28-q09
      type: multiple_choice
      topic_code: "10.5"
      source: "AP Calculus CED, Topic 10.5"
      points: 1
      prompt: |
        Which statement about ∑ (n = 1 to ∞) 5/(2n) is true?
      options:
        - "It converges, because its terms approach 0."
        - "It converges, because it is a p-series with p = 1 and p > 0."
        - "It converges to (5/2) ln 2."
        - "It diverges, because it is 5/2 times the harmonic series."
      option_explanations:
        - |
          Terms approaching 0 never proves convergence; the harmonic series is the standard counterexample.
        - |
          A p-series converges only for p > 1; with p = 1 it is the harmonic series, which diverges.
        - |
          The series has no finite sum at all; its partial sums grow like (5/2) ln n.
        - |
          Correct. 5/(2n) = (5/2)(1/n), and a nonzero constant multiple of the divergent harmonic series diverges.
      answer: 3
    - slug: apcalcbc-u10-w28-q10
      type: multiple_choice
      topic_code: "10.4"
      source: "AP Calculus CED, Topic 10.4"
      points: 1
      prompt: |
        Why can the integral test not be applied to ∑ (n = 1 to ∞) (2 + sin n)/n² with f(x) = (2 + sin x)/x²?
      options:
        - "f is not positive for x ≥ 1."
        - "f is not decreasing for large x."
        - "f is not continuous for x ≥ 1."
        - "The terms of the series do not approach 0."
      option_explanations:
        - |
          2 + sin x ≥ 1 > 0, so f is positive for every x ≥ 1.
        - |
          Correct. The sin x in the numerator keeps f rising and falling slightly, so f is never eventually decreasing. (Direct comparison with 3/n² shows the series converges.)
        - |
          f is a quotient of continuous functions with denominator x² ≠ 0 for x ≥ 1, so it is continuous there.
        - |
          The terms are at most 3/n², so they do approach 0.
      answer: 1
    - slug: apcalcbc-u10-w28-q11
      type: multiple_choice
      topic_code: "10.2"
      source: "AP Calculus CED, Topic 10.2"
      points: 1
      prompt: |
        What is the sum of ∑ (n = 1 to ∞) (−2)ⁿ⁺¹/5ⁿ?
      options:
        - "4/3"
        - "−10/7"
        - "4/7"
        - "20/7"
      option_explanations:
        - |
          4/3 uses r = 2/5 and drops the negative sign of the ratio; with r = −2/5, 1 − r = 7/5.
        - |
          −10/7 uses −2, the n = 0 term, as the first term; the series starts at n = 1, where the term is 4/5.
        - |
          Correct. The first term (n = 1) is (−2)²/5 = 4/5 and r = −2/5, so the sum is (4/5)/(1 + 2/5) = (4/5)/(7/5) = 4/7.
        - |
          20/7 uses the numerator 4 as the first term and forgets to divide by 5¹.
      answer: 2
    - slug: apcalcbc-u10-w28-q12
      type: multiple_choice
      topic_code: "10.3"
      source: "AP Calculus CED, Topic 10.3"
      points: 1
      prompt: |
        What can be concluded about ∑ (n = 1 to ∞) (n + 1)/√(4n² + 3)?
      options:
        - "It diverges by the nth term test, because its terms approach 1/2."
        - "It converges, because its terms approach 1/2, which is less than 1."
        - "The nth term test is inconclusive, because the limit of the terms is not 0."
        - "It diverges by the nth term test, because its terms approach 1/4."
      option_explanations:
        - |
          Correct. Dividing numerator and denominator by n, (1 + 1/n)/√(4 + 3/n²) → 1/√4 = 1/2 ≠ 0, so the series diverges.
        - |
          Comparing a limit with 1 belongs to the ratio test applied to aₙ₊₁/aₙ; terms that approach a nonzero number force divergence.
        - |
          This reverses the test: a nonzero limit is exactly when the nth term test gives a conclusion (divergence).
        - |
          The conclusion is right but the limit is wrong: √(4n²) = 2n, not 4n, so the limit is 1/2.
      answer: 0
    - slug: apcalcbc-u10-w28-q13
      type: multiple_choice
      topic_code: "6.13"
      source: "AP Calculus CED, Topic 6.13"
      points: 1
      prompt: |
        What is the value of ∫ from e to ∞ of 1/(x(ln x)²) dx?
      options:
        - "−1"
        - "1/e"
        - "The integral diverges."
        - "1"
      option_explanations:
        - |
          −1 drops the minus sign of the antiderivative: ∫ u⁻² du = −u⁻¹, so the antiderivative is −1/ln x.
        - |
          1/e evaluates −1/x instead of −1/ln x; the substitution u = ln x must be carried through to the end.
        - |
          (ln x)² in the denominator makes the integrand small enough: with u = ln x it becomes ∫ from 1 to ∞ of u⁻² du, which converges.
        - |
          Correct. With u = ln x, du = dx/x, the integral is ∫ from 1 to ∞ of u⁻² du = [−1/u] from 1 to ∞ = 0 − (−1) = 1.
      answer: 3
    - slug: apcalcbc-u10-w28-q14
      type: multiple_choice
      topic_code: "6.12"
      source: "AP Calculus CED, Topic 6.12"
      points: 1
      prompt: |
        Which is ∫ 1/(x² + 3x + 2) dx?
      options:
        - "ln|x + 2| − ln|x + 1| + C"
        - "ln|x + 1| − ln|x + 2| + C"
        - "ln|x² + 3x + 2| + C"
        - "ln|(x + 1)(x + 2)| + C"
      option_explanations:
        - |
          The signs are swapped. 1/((x + 1)(x + 2)) = 1/(x + 1) − 1/(x + 2), so the x + 1 term is the positive one.
        - |
          Correct. 1/((x + 1)(x + 2)) = A/(x + 1) + B/(x + 2) with A = 1 (set x = −1) and B = −1 (set x = −2), so the integral is ln|x + 1| − ln|x + 2| + C.
        - |
