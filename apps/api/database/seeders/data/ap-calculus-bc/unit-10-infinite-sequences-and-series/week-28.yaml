    - slug: apcalcbc-u10-w28-q22
      type: short_answer
      topic_code: "7.9"
      source: "AP Calculus CED, Topic 7.9"
      points: 3
      prompt: |
        A hypothetical population of birds on an island satisfies the logistic differential equation dP/dt = 0.4P(1 − P/500), where t is in years, and P(0) = 100.
        (a) Find lim (t→∞) P(t).
        (b) What is the population when it is growing fastest?
        (c) Is the graph of P concave up or concave down at the moment when P = 100? Explain.
      answer: |
        (a) The carrying capacity is 500, and P(0) = 100 is between 0 and 500, so lim (t→∞) P(t) = 500.
        (b) A logistic population grows fastest at half the carrying capacity, P = 250.
        (c) Concave up. d²P/dt² = 0.4(1 − 2P/500) · dP/dt; at P = 100, dP/dt = 0.4 · 100 · 0.8 = 32 > 0 and 1 − 200/500 = 0.6 > 0, so d²P/dt² > 0. (Equivalently, P < 250, so dP/dt is still increasing.)
      explanation: |
        Three points, one per part. (a) 500. (b) 250. (c) Concave up with a reason: the sign of d²P/dt², or P below half the carrying capacity so the growth rate is increasing.
    - slug: apcalcbc-u10-w28-q23
      type: long_answer
      topic_code: "10.4"
      source: "AP Calculus CED, Topic 10.4"
      points: 6
      prompt: |
        Let f(x) = 2x/(x² + 3)², so that f′(x) = 6(1 − x²)/(x² + 3)³.
        (A) Use the integral test to determine whether ∑ (n = 1 to ∞) 2n/(n² + 3)² converges or diverges. Verify the hypotheses of the test.
        (B) Use the direct comparison test, with a p-series, to confirm your answer to part (A).
        (C) Determine whether ∑ (n = 1 to ∞) 2n/(n² + 3) converges or diverges. Justify your answer.
        (D) Explain why ∑ (n = 1 to ∞) 2n/(n² + 3)² is greater than the value of the integral you found in part (A).
      answer: |
        (A) For x ≥ 1, f(x) > 0 and f is continuous (its denominator is never 0). f′(x) = 6(1 − x²)/(x² + 3)³ ≤ 0 for x ≥ 1 (negative for x > 1), so f is decreasing on [1, ∞). ∫ from 1 to ∞ of 2x/(x² + 3)² dx = lim (b→∞) [−1/(x² + 3)] from 1 to b = lim (b→∞) (−1/(b² + 3) + 1/4) = 1/4. The improper integral converges, so by the integral test the series converges.
        (B) For n ≥ 1, 0 < 2n/(n² + 3)² < 2n/n⁴ = 2/n³, because (n² + 3)² > n⁴. ∑ 2/n³ is 2 times a p-series with p = 3 > 1, so it converges, and by the direct comparison test so does ∑ 2n/(n² + 3)².
        (C) Compare with ∑ 1/n: lim (n→∞) [2n/(n² + 3)] / [1/n] = lim 2n²/(n² + 3) = 2, and 0 < 2 < ∞. Both series have positive terms and the harmonic series diverges, so ∑ 2n/(n² + 3) diverges by the limit comparison test.
        (D) Since f is decreasing, on each interval [n, n + 1] the rectangle of height f(n) and width 1 lies above the graph, so f(n) > ∫ from n to n + 1 of f(x) dx. Adding over n = 1, 2, 3, … gives ∑ (n = 1 to ∞) f(n) > ∫ from 1 to ∞ of f(x) dx = 1/4. (Indeed the first two terms alone, 1/8 + 4/49 ≈ 0.207, are close to 1/4, and the sum is about 0.313.)
      explanation: |
        Six points. (A) 1 point for verifying positive, continuous and decreasing on [1, ∞) (using f′); 1 point for the integral value 1/4 (or a correct finite limit) and the conclusion "converges by the integral test". (B) 1 point for a correct inequality 0 < aₙ < 2/n³ (or another convergent p-series bound) with the conclusion. (C) 1 point for a correct comparison series 1/n and the limit 2; 1 point for "diverges" with 0 < L < ∞ and the harmonic series' divergence stated. (D) 1 point for the left-endpoint rectangle argument using that f is decreasing. Saying "the sum equals 1/4" anywhere loses the conclusion point in (A).
