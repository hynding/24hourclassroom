    - slug: apcalcbc-u10-w29-q22
      type: short_answer
      topic_code: "10.9"
      source: "AP Calculus CED, Topic 10.9"
      points: 3
      prompt: |
        Consider the series ∑ (n = 1 to ∞) (−1)ⁿ⁺¹ n/(n² + 1).
        (a) Show that the series converges, verifying each condition of the test you use. (You may use that f(x) = x/(x² + 1) has f′(x) = (1 − x²)/(x² + 1)².)
        (b) Determine whether ∑ (n = 1 to ∞) n/(n² + 1) converges.
        (c) Is the series ∑ (n = 1 to ∞) (−1)ⁿ⁺¹ n/(n² + 1) absolutely convergent, conditionally convergent or divergent? Explain.
      answer: |
        (a) Alternating series test: the terms alternate in sign; bₙ = n/(n² + 1) decreases because f′(x) = (1 − x²)/(x² + 1)² ≤ 0 for x ≥ 1 (negative for x > 1); and lim (n→∞) n/(n² + 1) = 0. So the series converges.
        (b) lim (n→∞) [n/(n² + 1)]/(1/n) = lim n²/(n² + 1) = 1, and 0 < 1 < ∞. Both series have positive terms and ∑ 1/n diverges, so ∑ n/(n² + 1) diverges by the limit comparison test.
        (c) Conditionally convergent: the series converges by (a), but the series of absolute values diverges by (b).
      explanation: |
        Three points, one per part. (a) All three alternating series test conditions stated, with a reason for decreasing. (b) "Diverges" with a valid test (limit comparison with 1/n with 0 < L < ∞, or the integral test with ∫ x/(x² + 1) dx = (1/2)ln(x² + 1) → ∞). (c) "Conditionally convergent" with reference to both (a) and (b).
    - slug: apcalcbc-u10-w29-q23
      type: short_answer
      topic_code: "10.4"
      source: "AP Calculus CED, Topic 10.4"
      points: 3
      prompt: |
        Consider the series ∑ (n = 1 to ∞) 1/(n² + 1).
        (a) Verify that f(x) = 1/(x² + 1) satisfies the hypotheses of the integral test on [1, ∞).
        (b) Evaluate ∫ from 1 to ∞ of 1/(x² + 1) dx.
        (c) State what the integral test tells you about the series, and whether the series' sum equals your answer to (b).
      answer: |
        (a) For x ≥ 1, f(x) > 0, f is continuous (x² + 1 is never 0), and f is decreasing because x² + 1 increases (f′(x) = −2x/(x² + 1)² < 0).
        (b) ∫ from 1 to b of dx/(x² + 1) = arctan b − arctan 1 → π/2 − π/4 = π/4 as b → ∞.
        (c) The improper integral converges, so the series converges by the integral test. Its sum is not π/4: the test gives convergence only (the sum is greater than π/4, since the first term alone is 1/2 and the sum exceeds the integral).
      explanation: |
        Three points, one per part. (a) Positive, continuous and decreasing, each with a reason. (b) π/4 (about 0.785) as a limit. (c) "Converges by the integral test" and a statement that the sum is not π/4.
    - slug: apcalcbc-u10-w29-q24
      type: long_answer
      topic_code: "10.9"
      source: "AP Calculus CED, Topic 10.9"
      points: 6
      prompt: |
        For each series, determine whether it is absolutely convergent, conditionally convergent or divergent. Justify each answer, naming the tests you use and verifying their conditions.
        (A) ∑ (n = 1 to ∞) (−1)ⁿ (n + 1)/2ⁿ
        (B) ∑ (n = 1 to ∞) (−1)ⁿ⁺¹/(√n + 1)
        (C) ∑ (n = 1 to ∞) (−1)ⁿ 2n/(n + 3)
      answer: |
        (A) Ratio test on the absolute values: |aₙ₊₁/aₙ| = [(n + 2)/2ⁿ⁺¹] · [2ⁿ/(n + 1)] = (n + 2)/(2(n + 1)) → 1/2. Since 1/2 < 1, the series converges absolutely.
        (B) Alternating series test: the terms alternate in sign; bₙ = 1/(√n + 1) decreases because √n + 1 increases; and lim (n→∞) 1/(√n + 1) = 0. So the series converges. For the absolute values, lim [1/(√n + 1)]/[1/√n] = lim √n/(√n + 1) = 1, with 0 < 1 < ∞, and ∑ 1/√n is a p-series with p = 1/2 ≤ 1, which diverges. So ∑ 1/(√n + 1) diverges by limit comparison, and the series is conditionally convergent.
        (C) |aₙ| = 2n/(n + 3) → 2 ≠ 0, so the terms do not approach 0 (they swing between values near 2 and near −2). The series diverges by the nth term test.
      explanation: |
        Six points. (A) 1 point for the ratio of absolute values set up and simplified to (n + 2)/(2(n + 1)); 1 point for the limit 1/2 < 1 and the conclusion "absolutely convergent". (B) 1 point for all three alternating series test conditions; 1 point for showing ∑ 1/(√n + 1) diverges (limit comparison with 1/√n, L = 1, p = 1/2 ≤ 1, or direct comparison 1/(√n + 1) ≥ 1/(2√n)); 1 point for "conditionally convergent". (C) 1 point for "divergent" with the nth term test (limit of |aₙ| is 2, not 0). An answer for (B) of "conditionally convergent" with no test of the absolute values earns only the first point of (B).
