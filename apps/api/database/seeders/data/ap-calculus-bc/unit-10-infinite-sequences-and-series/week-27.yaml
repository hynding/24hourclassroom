    - slug: apcalcbc-u10-w27-q22
      type: short_answer
      topic_code: "10.1"
      source: "AP Calculus CED, Topic 10.1"
      points: 3
      prompt: |
        Consider the series ∑ (n = 1 to ∞) (1/n − 1/(n + 2)).
        (a) Write out the partial sum S₄ term by term and find its value, showing which pieces cancel.
        (b) Find a formula for the nth partial sum Sₙ.
        (c) Determine whether the series converges. If it converges, find its sum.
      answer: |
        (a) S₄ = (1 − 1/3) + (1/2 − 1/4) + (1/3 − 1/5) + (1/4 − 1/6). The −1/3 and +1/3 cancel, and so do −1/4 and +1/4, leaving S₄ = 1 + 1/2 − 1/5 − 1/6 = 17/15.
        (b) Every negative piece −1/(k + 2) cancels with the positive piece two terms later, except the last two. So Sₙ = 1 + 1/2 − 1/(n + 1) − 1/(n + 2) = 3/2 − 1/(n + 1) − 1/(n + 2).
        (c) As n → ∞, 1/(n + 1) and 1/(n + 2) approach 0, so lim (n→∞) Sₙ = 3/2. The series converges to 3/2.
      explanation: |
        Three points, one per part. (a) S₄ = 17/15 (about 1.133) with the cancellation shown. (b) A correct formula for Sₙ, in any equivalent form. (c) The sum 3/2, justified as the limit of the partial sums; an answer that says "converges because the terms go to 0" earns no point for (c).
    - slug: apcalcbc-u10-w27-q23
      type: short_answer
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 3
      prompt: |
        Let f(x) = (2/3)x^(3/2) for 0 ≤ x ≤ 3.
        (a) Write an integral expression for the length of the graph of f from x = 0 to x = 3.
        (b) Evaluate the integral in part (a).
        (c) The straight segment from (0, 0) to (3, f(3)) has length √21 ≈ 4.583. Explain why your answer to (b) must be at least this large.
      answer: |
        (a) f′(x) = x^(1/2), so the length is ∫ from 0 to 3 of √(1 + (f′(x))²) dx = ∫ from 0 to 3 of √(1 + x) dx.
        (b) ∫ from 0 to 3 of √(1 + x) dx = (2/3)(1 + x)^(3/2) from 0 to 3 = (2/3)(8 − 1) = 14/3 ≈ 4.667.
        (c) The straight segment is the shortest path between its endpoints, so any curve joining (0, 0) and (3, 2√3) is at least √21 long; 14/3 ≈ 4.667 > 4.583 agrees.
      explanation: |
        Three points, one per part. (a) The integrand √(1 + x) (or √(1 + (√x)²)) with limits 0 and 3. (b) 14/3 (about 4.667). (c) The shortest-path (chord versus arc) reason; comparing the two numbers alone, with no reason, earns no point.
    - slug: apcalcbc-u10-w27-q24
      type: long_answer
      topic_code: "10.2"
      source: "AP Calculus CED, Topic 10.2"
      points: 6
      prompt: |
        A hypothetical patient takes a 100 mg dose of a medicine once a day. By the time of the next dose, the body has removed 40% of the medicine that was present, so 60% of it remains. Let Aₙ be the amount of medicine, in mg, in the body just after the nth dose, so A₁ = 100.
        (A) Find A₂ and A₃.
        (B) Write Aₙ as a sum of n terms, and use the formula for a geometric partial sum to write Aₙ in closed form.
        (C) Find lim (n→∞) Aₙ. Explain why the limit exists.
        (D) The doctor wants the long-run amount just after a dose to be at most 300 mg. What is the largest daily dose D, in mg, that achieves this?
        (E) A student says, "250 − Aₙ approaches 0, so the series ∑ (n = 1 to ∞) (250 − Aₙ) converges." Is the student's reasoning valid? Does the series converge? If it converges, find its sum.
      answer: |
        (A) A₂ = 100 + 0.6(100) = 160 mg. A₃ = 100 + 0.6(160) = 196 mg.
        (B) Aₙ = 100 + 100(0.6) + 100(0.6)² + … + 100(0.6)^(n−1), a geometric partial sum with first term 100 and ratio 0.6. So Aₙ = 100(1 − 0.6ⁿ)/(1 − 0.6) = 250(1 − 0.6ⁿ).
        (C) Because |0.6| < 1, 0.6ⁿ → 0, so lim (n→∞) Aₙ = 250 mg. (Equivalently, the geometric series ∑ (n = 0 to ∞) 100(0.6)ⁿ converges to 100/(1 − 0.6) = 250.)
        (D) With dose D the long-run amount is D/(1 − 0.6) = 2.5D. 2.5D ≤ 300 gives D ≤ 120 mg.
        (E) The reasoning is not valid: terms approaching 0 never proves that a series converges (∑ 1/n has terms approaching 0 and diverges). But the series does converge: 250 − Aₙ = 250(0.6)ⁿ, a geometric series with ratio 0.6 and |0.6| < 1. Its sum is (first term)/(1 − r) = 250(0.6)/(0.4) = 150/0.4 = 375.
      explanation: |
        Six points. (A) 1 point for A₂ = 160 and A₃ = 196. (B) 1 point for the geometric sum with first term 100 and ratio 0.6 and the closed form 250(1 − 0.6ⁿ) or 100(1 − 0.6ⁿ)/0.4. (C) 1 point for 250 with the reason |r| = 0.6 < 1 (0.6ⁿ → 0). (D) 1 point for D = 120 mg. (E) 1 point for saying the reasoning is invalid because the nth term test cannot prove convergence; 1 point for recognizing the geometric series 250(0.6)ⁿ with |r| < 1 and the sum 375.
