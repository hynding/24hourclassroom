      answer: true
      explanation: |
        True. Over a common denominator, (1/2)(x + 1) − (1/2)(x − 1) = 1, so the right side is 1/((x − 1)(x + 1)) = 1/(x² − 1). This partial-fraction split is also what makes ∑ 1/(n² − 1) telescope.
