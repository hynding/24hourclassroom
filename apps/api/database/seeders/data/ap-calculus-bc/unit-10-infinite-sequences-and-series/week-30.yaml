    - slug: apcalcbc-u10-w30-q22
      type: short_answer
      topic_code: "9.2"
      source: "AP Calculus CED, Topic 9.2"
      points: 3
      prompt: |
        A curve is defined by the parametric equations x = t² and y = t³ − 3t for t > 0.

        (a) Find dy/dx in terms of t.
        (b) Find the value of dy/dx at t = 2.
        (c) Find d²y/dx² at t = 2 and state whether the curve is concave up or concave down there.
      answer: |
        (a) dy/dx = (dy/dt)/(dx/dt) = (3t² − 3)/(2t).
        (b) At t = 2: (12 − 3)/4 = 9/4.
        (c) dy/dx = (3/2)t − 3/(2t), so d/dt (dy/dx) = 3/2 + 3/(2t²), which is 3/2 + 3/8 = 15/8 at t = 2. Then d²y/dx² = (15/8)/(dx/dt) = (15/8)/4 = 15/32 > 0, so the curve is concave up at t = 2.
      explanation: |
        Three points, one per part. (a) (3t² − 3)/(2t) or an equivalent form. (b) 9/4. (c) 15/32 with concave up; the point requires dividing d/dt (dy/dx) by dx/dt (an answer of 15/8 earns nothing for (c)).
