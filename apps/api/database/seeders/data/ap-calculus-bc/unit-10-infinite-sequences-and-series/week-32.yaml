        (B) Find the interval of convergence of the series in part (A).

        (C) Use your answer to part (A) to write the first four nonzero terms and the general term of the Maclaurin series for f.

        (D) Find the interval of convergence of the series for f. Justify your conclusion at each endpoint.

        (E) Use the first two nonzero terms of the series for f to approximate f(1/2) = ln(5/4). Show that the approximation differs from f(1/2) by less than 0.006.
      answer: |
        (A) g(x) = (1/2) · 1/(1 + x/2) = (1/2) · 1/(1 − (−x/2)) = 1/2 − x/4 + x²/8 − x³/16 + ⋯ = ∑ (n = 0 to ∞) (−1)ⁿ xⁿ/2ⁿ⁺¹.
        (B) Geometric with ratio −x/2: converges when |x/2| < 1, so −2 < x < 2 (at x = ±2 the terms have size 1/2 and do not go to 0).
        (C) Integrating from 0 to x: f(x) = x/2 − x²/8 + x³/24 − x⁴/64 + ⋯ = ∑ (n = 0 to ∞) (−1)ⁿ x^(n+1)/((n + 1)2ⁿ⁺¹).
        (D) The radius is still 2. At x = 2: ∑ (−1)ⁿ 2ⁿ⁺¹/((n + 1)2ⁿ⁺¹) = ∑ (−1)ⁿ/(n + 1), the alternating harmonic series, which converges by the Alternating Series Test. At x = −2: ∑ (−1)ⁿ(−2)ⁿ⁺¹/((n + 1)2ⁿ⁺¹) = −∑ 1/(n + 1), which diverges (harmonic). Interval: −2 < x ≤ 2.
        (E) f(1/2) ≈ (1/2)/2 − (1/2)²/8 = 1/4 − 1/32 = 7/32 = 0.21875. At x = 1/2 the series alternates and its terms (1/2)^(n+1)/((n + 1)2ⁿ⁺¹) = 1/((n + 1)4ⁿ⁺¹) decrease to 0, so the error is at most the next term, (1/2)³/24 = 1/192 ≈ 0.0052 < 0.006.
      explanation: |
        Six points. (A) 1 point for the four terms and the general term (−1)ⁿ xⁿ/2ⁿ⁺¹ (equivalent forms accepted). (B) 1 point for −2 < x < 2. (C) 1 point for the four terms and general term of f, obtained by integrating (a missing or wrong constant of integration loses the point; f(0) = 0 means none is needed). (D) 1 point for −2 < x ≤ 2 with the Alternating Series Test at x = 2 and the harmonic series at x = −2. (E) 1 point for 7/32; 1 point for the alternating series error bound, its conditions, and 1/192 < 0.006. For reference, ln 1.25 ≈ 0.22314, so the actual error is about 0.0044.
