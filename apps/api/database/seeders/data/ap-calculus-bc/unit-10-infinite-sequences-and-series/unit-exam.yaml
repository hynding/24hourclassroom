unit: 10
description: |
  46 questions · about 90 minutes · every topic of Unit 10 (10.1 to 10.15): partial sums and the meaning of convergence,
  geometric series, the nth term test, the integral test, harmonic and p-series, direct and limit comparison, the
  alternating series test, the ratio test, absolute and conditional convergence, the alternating series error bound,
  Taylor polynomials, the Lagrange error bound, radius and interval of convergence, Taylor and Maclaurin series, and
  building new power series from known ones. Includes two shared-context sets of four questions (a series given by its
  partial sums and a function given by a table of derivatives at x = 1), select-all, true/false, fill-in-the-blank and
  numeric items, two short-answer questions (3 points each) and two free-response questions in the AP style (9 points
  each: one calculator-allowed Taylor polynomial with a Lagrange error bound in a context, one no-calculator power
  series question on the interval of convergence and the series for a derivative and an integral). Items marked
  (Calculator.) may use a graphing calculator; the rest are meant to be done by hand. Multiple choice, select-all,
  true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
  answers and free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a series given by its partial sums (10.1, 10.3)
  - slug: apcalcbc-u10-exam-q01
    type: multiple_choice
    topic_code: "10.1"
    source: "AP Calculus CED, Topic 10.1"
    points: 1
    stimulus: |
      A series ∑ (n = 1 to ∞) aₙ has nth partial sum Sₙ = a₁ + a₂ + … + aₙ = 4n/(n + 1) for every positive integer n.
    prompt: |
      What is the sum of the series ∑ (n = 1 to ∞) aₙ?
    options:
      - "2"
      - "0"
      - "4"
      - "The series diverges."
    option_explanations:
      - |
        2 is S₁ = 4/2, the first partial sum only. The sum of the series is the limit of Sₙ as n → ∞, not one partial sum.
      - |
        0 is the limit of the terms aₙ, not of the partial sums. The terms going to 0 says nothing about the value of the sum.
      - |
        Correct. The sum of a series is the limit of its partial sums: lim (n→∞) 4n/(n + 1) = 4, so the series converges to 4.
      - |
        The partial sums have a finite limit, 4, so by definition the series converges; a series diverges only when Sₙ has no finite limit.
    answer: 2
  - slug: apcalcbc-u10-exam-q02
    type: fill_blank
    topic_code: "10.1"
    source: "AP Calculus CED, Topic 10.1"
    points: 1
    stimulus: |
      A series ∑ (n = 1 to ∞) aₙ has nth partial sum Sₙ = a₁ + a₂ + … + aₙ = 4n/(n + 1) for every positive integer n.
    prompt: |
      The third term of the series is a₃ = ____. (Give an exact fraction or a decimal to three places.)
    answer: ["1/3", "1 / 3", "0.333", ".333"]
    explanation: |
      Each term is the difference of consecutive partial sums: a₃ = S₃ − S₂ = 12/4 − 8/3 = 3 − 8/3 = 1/3. (In general aₙ = 4/(n(n + 1)).)
  - slug: apcalcbc-u10-exam-q03
    type: true_false
    topic_code: "10.3"
    source: "AP Calculus CED, Topic 10.3"
    points: 1
    stimulus: |
      A series ∑ (n = 1 to ∞) aₙ has nth partial sum Sₙ = a₁ + a₂ + … + aₙ = 4n/(n + 1) for every positive integer n.
    prompt: |
      True or false: lim (n→∞) aₙ = 0, so the nth term test shows that this series converges.
    answer: false
    explanation: |
      False. The terms do go to 0 (aₙ = 4/(n(n + 1))), and the series does converge, but the reason is that the partial sums have the limit 4. The nth term test can only show divergence: when lim aₙ = 0 it is inconclusive (the harmonic series has terms going to 0 and diverges).
  - slug: apcalcbc-u10-exam-q04
    type: multiple_choice
    topic_code: "10.1"
    source: "AP Calculus CED, Topic 10.1"
    points: 1
    stimulus: |
      A series ∑ (n = 1 to ∞) aₙ has nth partial sum Sₙ = a₁ + a₂ + … + aₙ = 4n/(n + 1) for every positive integer n.
    prompt: |
      What is the value of ∑ (n = 3 to ∞) aₙ, the series with its first two terms removed?
    options:
      - "4"
      - "4/3"
      - "8/3"
      - "1/3"
    option_explanations:
      - |
        4 is the sum of the whole series. Removing a₁ and a₂ changes the sum by S₂, even though it does not change whether the series converges.
      - |
        Correct. The tail is the full sum minus the first two terms: 4 − S₂ = 4 − 8/3 = 4/3.
      - |
        8/3 is S₂ = a₁ + a₂, the part that was removed, not the part that remains.
      - |
        1/3 is the single term a₃, the first term of the tail, not the sum of every term from n = 3 on.
    answer: 1
  # ---- Stimulus set B: a function given by a table of derivatives (10.11, 10.12, 10.14)
  - slug: apcalcbc-u10-exam-q05
    type: multiple_choice
    topic_code: "10.11"
    source: "AP Calculus CED, Topic 10.11"
    points: 1
    stimulus: |
      A function g has derivatives of all orders on an interval containing 1 ≤ x ≤ 1.5. Its values and derivatives at x = 1 are shown, and |g⁽⁴⁾(x)| ≤ 30 for all x in 1 ≤ x ≤ 1.5.

      | g(1) | g′(1) | g″(1) | g‴(1) |
      |---|---|---|---|
      | 2 | −3 | 4 | −12 |
    prompt: |
      Which is the third-degree Taylor polynomial for g about x = 1?
    options:
      - "2 − 3(x − 1) + 4(x − 1)² − 12(x − 1)³"
      - "2 − 3(x − 1) + 2(x − 1)² − 4(x − 1)³"
      - "2 − 3(x + 1) + 2(x + 1)² − 2(x + 1)³"
      - "2 − 3(x − 1) + 2(x − 1)² − 2(x − 1)³"
    option_explanations:
      - |
        This uses the derivatives as coefficients without dividing by k!. The coefficient of (x − 1)ᵏ is g⁽ᵏ⁾(1)/k!, so 4 becomes 2 and −12 becomes −2.
      - |
        This divides g‴(1) by 3 instead of 3! = 6. The cubic coefficient is −12/6 = −2.
      - |
        The coefficients are right but the powers are of (x + 1), which centers the polynomial at x = −1. About x = 1 the powers are of (x − 1).
      - |
        Correct. P₃(x) = g(1) + g′(1)(x − 1) + g″(1)/2! (x − 1)² + g‴(1)/3! (x − 1)³ = 2 − 3(x − 1) + (4/2)(x − 1)² + (−12/6)(x − 1)³.
    answer: 3
  - slug: apcalcbc-u10-exam-q06
    type: numeric
    topic_code: "10.11"
    source: "AP Calculus CED, Topic 10.11"
    points: 1
    stimulus: |
      A function g has derivatives of all orders on an interval containing 1 ≤ x ≤ 1.5. Its values and derivatives at x = 1 are shown, and |g⁽⁴⁾(x)| ≤ 30 for all x in 1 ≤ x ≤ 1.5.

      | g(1) | g′(1) | g″(1) | g‴(1) |
      |---|---|---|---|
      | 2 | −3 | 4 | −12 |
    prompt: |
      Use the third-degree Taylor polynomial for g about x = 1 to approximate g(1.2). Give your answer to three decimal places.
    answer: { value: 1.464, tolerance: 0.001 }
    explanation: |
      P₃(1.2) = 2 − 3(0.2) + 2(0.2)² − 2(0.2)³ = 2 − 0.6 + 0.08 − 0.016 = 1.464.
  - slug: apcalcbc-u10-exam-q07
    type: multiple_choice
    topic_code: "10.12"
    source: "AP Calculus CED, Topic 10.12"
    points: 1
    stimulus: |
      A function g has derivatives of all orders on an interval containing 1 ≤ x ≤ 1.5. Its values and derivatives at x = 1 are shown, and |g⁽⁴⁾(x)| ≤ 30 for all x in 1 ≤ x ≤ 1.5.

      | g(1) | g′(1) | g″(1) | g‴(1) |
      |---|---|---|---|
      | 2 | −3 | 4 | −12 |
    prompt: |
      Which is the Lagrange error bound for |g(1.2) − P₃(1.2)|, where P₃ is the third-degree Taylor polynomial for g about x = 1?
    options:
      - "0.002"
      - "0.048"
      - "0.008"
      - "0.01"
    option_explanations:
      - |
        Correct. |g(1.2) − P₃(1.2)| ≤ max |g⁽⁴⁾| · |1.2 − 1|⁴/4! = 30 · (0.2)⁴/24 = 30 · 0.0016/24 = 0.002.
      - |
        0.048 is 30 · (0.2)⁴, which leaves out the division by 4! = 24.
      - |
        0.008 divides by 3! = 6 instead of 4! = 24. The bound for P₃ uses the fourth derivative and 4!.
      - |
        0.01 is 30 · (0.2)³/24, which uses the third power of the distance. The power matches the derivative used, so it is (0.2)⁴.
    answer: 0
  - slug: apcalcbc-u10-exam-q08
    type: fill_blank
    topic_code: "10.14"
    source: "AP Calculus CED, Topic 10.14"
    points: 1
    stimulus: |
      A function g has derivatives of all orders on an interval containing 1 ≤ x ≤ 1.5. Its values and derivatives at x = 1 are shown, and |g⁽⁴⁾(x)| ≤ 30 for all x in 1 ≤ x ≤ 1.5.

      | g(1) | g′(1) | g″(1) | g‴(1) |
      |---|---|---|---|
      | 2 | −3 | 4 | −12 |
    prompt: |
      In the Taylor series for g′(x) about x = 1, the coefficient of (x − 1)² is ____.
    answer: ["-6", "−6", "- 6", "− 6"]
    explanation: |
      The Taylor series of g′ about 1 has coefficient (g′)″(1)/2! = g‴(1)/2 = −12/2 = −6 on (x − 1)². Equivalently, differentiate the series of g term by term: the term −2(x − 1)³ becomes −6(x − 1)².
  # ---- Geometric series and the nth term test (10.2, 10.3)
  - slug: apcalcbc-u10-exam-q09
    type: multiple_choice
    topic_code: "10.2"
    source: "AP Calculus CED, Topic 10.2"
    points: 1
    prompt: |
      What is the sum of ∑ (n = 0 to ∞) 3(−2/5)ⁿ?
    options:
      - "5"
      - "−6/7"
      - "The series diverges because its terms alternate in sign."
      - "15/7"
    option_explanations:
      - |
        5 is 3/(1 − 2/5), which drops the negative sign of the ratio. With r = −2/5 the denominator is 1 − (−2/5) = 7/5.
      - |
        −6/7 is the sum starting at n = 1, whose first term is 3(−2/5) = −6/5. Here the first term (n = 0) is 3.
      - |
        A geometric series converges whenever |r| < 1, whatever the sign of r. Here |r| = 2/5 < 1.
      - |
        Correct. Geometric with first term a = 3 and ratio r = −2/5, |r| < 1, so the sum is a/(1 − r) = 3/(7/5) = 15/7.
    answer: 3
  - slug: apcalcbc-u10-exam-q10
    type: numeric
    topic_code: "10.2"
    source: "AP Calculus CED, Topic 10.2"
    points: 1
    prompt: |
      Find the sum of the geometric series ∑ (n = 2 to ∞) 5(1/3)ⁿ. Give your answer as a decimal to three places.
    answer: { value: 0.8333, tolerance: 0.001 }
    explanation: |
      The first term (n = 2) is 5/9 and the ratio is 1/3, so the sum is (5/9)/(1 − 1/3) = (5/9)(3/2) = 5/6 ≈ 0.833.
  - slug: apcalcbc-u10-exam-q11
    type: multiple_choice
    topic_code: "10.2"
    source: "AP Calculus CED, Topic 10.2"
    points: 1
    prompt: |
      For which values of x does the series ∑ (n = 0 to ∞) ((2x − 1)/3)ⁿ converge?
    options:
      - "−1 < x < 2"
      - "0 < x < 1"
      - "−1 ≤ x ≤ 2"
      - "−2 < x < 1"
    option_explanations:
      - |
        Correct. A geometric series converges exactly when |r| < 1: |2x − 1|/3 < 1 gives −3 < 2x − 1 < 3, so −2 < 2x < 4 and −1 < x < 2.
      - |
        0 < x < 1 solves |2x − 1| < 1, which forgets the division by 3 in the ratio.
      - |
        At x = −1 the ratio is −1 and at x = 2 it is 1; in both cases the terms do not go to 0, so a geometric series never converges at |r| = 1.
      - |
        −2 < x < 1 comes from solving −3 < 2x + 1 < 3, a sign slip on the −1 in the ratio.
    answer: 0
  - slug: apcalcbc-u10-exam-q12
    type: multiple_choice
    topic_code: "10.3"
    source: "AP Calculus CED, Topic 10.3"
    points: 1
    prompt: |
      Which series can be shown to diverge by the nth term test?
    options:
      - "∑ (n = 1 to ∞) 1/n"
      - "∑ (n = 1 to ∞) n/(2n + 1)"
      - "∑ (n = 1 to ∞) (−1)ⁿ/n"
      - "∑ (n = 1 to ∞) 1/n²"
    option_explanations:
      - |
        The harmonic series does diverge, but its terms 1/n go to 0, so the nth term test is inconclusive; divergence comes from the integral test or the p-series rule.
      - |
        Correct. lim (n→∞) n/(2n + 1) = 1/2 ≠ 0, and a series whose terms do not go to 0 must diverge.
      - |
        The terms (−1)ⁿ/n go to 0, so the nth term test says nothing; this series in fact converges by the alternating series test.
      - |
        The terms 1/n² go to 0, so the nth term test is inconclusive; this is a convergent p-series with p = 2.
    answer: 1
  - slug: apcalcbc-u10-exam-q13
    type: true_false
    topic_code: "10.3"
    source: "AP Calculus CED, Topic 10.3"
    points: 1
    prompt: |
      True or false: if the series ∑ (n = 1 to ∞) bₙ converges, then lim (n→∞) bₙ = 0.
    answer: true
    explanation: |
      True. bₙ = Sₙ − Sₙ₋₁, and if Sₙ → S then Sₙ₋₁ → S too, so bₙ → S − S = 0. This is the statement behind the nth term test (its contrapositive: terms not going to 0 means divergence). The converse is false.
  # ---- Integral test, p-series and comparisons (10.4, 10.5, 10.6)
  - slug: apcalcbc-u10-exam-q14
    type: multiple_choice
    topic_code: "10.4"
    source: "AP Calculus CED, Topic 10.4"
    points: 1
    prompt: |
      What does the integral test show about ∑ (n = 2 to ∞) 1/(n (ln n)²)?
    options:
      - "The series converges, and its sum is 1/ln 2."
      - "The series diverges, because ∫ from 2 to ∞ of 1/(x (ln x)²) dx grows like ln(ln x)."
      - "The test does not apply, because 1/(x (ln x)²) is not decreasing for x ≥ 2."
      - "The series converges, because ∫ from 2 to ∞ of 1/(x (ln x)²) dx = 1/ln 2 is finite."
    option_explanations:
      - |
        The integral test shows only that the series converges; the value of the improper integral is not the sum of the series (the series begins with 1/(2 (ln 2)²) ≈ 1.04 alone).
      - |
        ln(ln x) is the antiderivative of 1/(x ln x), with the logarithm to the first power. With u = ln x this integrand is 1/u², whose antiderivative is −1/u.
      - |
        For x ≥ 2 the function is positive and continuous, and both x and (ln x)² increase, so their reciprocal product decreases: the hypotheses hold.
      - |
        Correct. With u = ln x, ∫ from 2 to ∞ of dx/(x (ln x)²) = lim (b→∞) [−1/ln x] from 2 to b = 1/ln 2. The function is positive, continuous and decreasing, so the series converges.
    answer: 3
  - slug: apcalcbc-u10-exam-q15
    type: true_false
    topic_code: "10.4"
    source: "AP Calculus CED, Topic 10.4"
    points: 1
    prompt: |
      True or false: if f is positive, continuous and decreasing for x ≥ 1 and ∫ from 1 to ∞ of f(x) dx = 2, then ∑ (n = 1 to ∞) f(n) = 2.
    answer: false
    explanation: |
      False. The integral test says only that the series converges. The sum and the integral differ: each term f(n) is the area of a rectangle of width 1, which is more than the area under the decreasing graph on [n, n + 1], so the sum is larger than 2 (it lies between 2 and f(1) + 2).
  - slug: apcalcbc-u10-exam-q16
    type: fill_blank
    topic_code: "10.4"
    source: "AP Calculus CED, Topic 10.4"
    points: 1
    prompt: |
      To apply the integral test to ∑ (n = 1 to ∞) n e^(−n²), you evaluate ∫ from 1 to ∞ of x e^(−x²) dx = ____. (Give the exact value or a decimal to three places.)
    answer: ["1/(2e)", "1/2e", "1/(2 e)", "e^(-1)/2", "(1/2)e^(-1)", "1/(2*e)", "0.184", ".184"]
    explanation: |
      With u = x², du = 2x dx: ∫ from 1 to ∞ of x e^(−x²) dx = lim (b→∞) [−½ e^(−x²)] from 1 to b = 0 + ½ e^(−1) = 1/(2e) ≈ 0.184. The integral is finite, so the series converges.
  - slug: apcalcbc-u10-exam-q17
    type: multi_select
    topic_code: "10.5"
    source: "AP Calculus CED, Topic 10.5"
    points: 2
    partial_credit: true
    prompt: |
      Which of these series converge? Select all that apply.
    options:
      - "∑ (n = 1 to ∞) 1/n^1.01"
      - "∑ (n = 1 to ∞) 1/√n"
      - "∑ (n = 1 to ∞) n^(−3/2)"
      - "∑ (n = 1 to ∞) n/n³"
      - "∑ (n = 1 to ∞) 5/n"
    option_explanations:
      - |
        Correct. A p-series with p = 1.01 > 1 converges, however close p is to 1.
      - |
        1/√n = 1/n^(1/2) is a p-series with p = 1/2 ≤ 1, so it diverges.
      - |
        Correct. n^(−3/2) = 1/n^(3/2), a p-series with p = 3/2 > 1.
      - |
        Correct. n/n³ simplifies to 1/n², a p-series with p = 2 > 1.
      - |
        5/n is 5 times the harmonic series; a nonzero constant multiple of a divergent series diverges.
    answer: [0, 2, 3]
  - slug: apcalcbc-u10-exam-q18
    type: multiple_choice
    topic_code: "10.5"
    source: "AP Calculus CED, Topic 10.5"
    points: 1
    prompt: |
      For which values of the constant p does ∑ (n = 1 to ∞) 1/n^(2p − 1) converge?
    options:
      - "p > 1/2"
      - "p ≥ 1"
      - "p > 1"
      - "p > 0"
    option_explanations:
      - |
        p > 1/2 makes the exponent 2p − 1 positive, which only makes the terms go to 0. Convergence needs the exponent greater than 1.
      - |
        At p = 1 the exponent is 1 and the series is the harmonic series, which diverges, so p = 1 must be excluded.
      - |
        Correct. This is a p-series with exponent 2p − 1, which converges exactly when 2p − 1 > 1, that is p > 1.
      - |
        p > 0 does not even guarantee positive exponents (p = 0.25 gives 1/n^(−0.5) = √n); the condition is 2p − 1 > 1.
    answer: 2
  - slug: apcalcbc-u10-exam-q19
    type: multiple_choice
    topic_code: "10.6"
    source: "AP Calculus CED, Topic 10.6"
    points: 1
    prompt: |
      Which statement correctly determines the behavior of ∑ (n = 2 to ∞) (3n + 1)/(n³ − 2)?
    options:
      - "It diverges by limit comparison with ∑ 1/n, because the degrees differ by 1."
      - "It converges by limit comparison with ∑ 1/n²: the limit of the ratio of terms is 3, a positive finite number."
      - "It converges by direct comparison, because (3n + 1)/(n³ − 2) ≤ 3/n² for all n ≥ 2."
      - "It diverges by the nth term test."
    option_explanations:
      - |
        The terms behave like 3n/n³ = 3/n²: the denominator's degree is 2 more than the numerator's. Compared with 1/n the ratio of terms goes to 0, which with a divergent series proves nothing.
      - |
        Correct. lim (n→∞) [(3n + 1)/(n³ − 2)] / (1/n²) = lim (3n³ + n²)/(n³ − 2) = 3, positive and finite, and ∑ 1/n² converges (p = 2), so the series converges.
      - |
        The inequality is false: 3n + 1 > 3n and n³ − 2 < n³, so each term is larger than 3/n². The conclusion is right but this argument does not prove it.
      - |
        The terms go to 0 (degree 1 over degree 3), so the nth term test is inconclusive.
    answer: 1
  - slug: apcalcbc-u10-exam-q20
    type: multiple_choice
    topic_code: "10.6"
    source: "AP Calculus CED, Topic 10.6"
    points: 1
    prompt: |
      Which argument correctly determines whether ∑ (n = 1 to ∞) 1/(√n + 3) converges?
    options:
      - "1/(√n + 3) < 1/√n and ∑ 1/√n diverges, so the series diverges by direct comparison."
      - "1/(√n + 3) < 1/n² for every n and ∑ 1/n² converges, so the series converges by direct comparison."
      - "The terms go to 0, so the series converges."
      - "lim (n→∞) [1/(√n + 3)] / (1/√n) = 1 and ∑ 1/√n diverges, so the series diverges by limit comparison."
    option_explanations:
      - |
        Being smaller than a divergent series proves nothing; direct comparison shows divergence only when the terms are larger than those of a divergent series.
      - |
        The inequality is false: at n = 4, 1/(2 + 3) = 0.2 but 1/16 = 0.0625. Terms like 1/√n are much larger than 1/n² for large n.
      - |
        Terms going to 0 is necessary but not sufficient for convergence; the harmonic series is the standard counterexample.
      - |
        Correct. The ratio √n/(√n + 3) → 1, a positive finite limit, and ∑ 1/√n is a divergent p-series (p = 1/2), so the series diverges.
    answer: 3
  - slug: apcalcbc-u10-exam-q21
    type: fill_blank
    topic_code: "10.6"
    source: "AP Calculus CED, Topic 10.6"
    points: 1
    prompt: |
      To test ∑ (n = 1 to ∞) (2n² + 1)/(n⁴ + 3n) by limit comparison with ∑ (n = 1 to ∞) 1/n², you compute lim (n→∞) [(2n² + 1)/(n⁴ + 3n)] / (1/n²) = ____.
    answer: ["2"]
    explanation: |
      [(2n² + 1)/(n⁴ + 3n)] · n² = (2n⁴ + n²)/(n⁴ + 3n) → 2. The limit is positive and finite and ∑ 1/n² converges, so the series converges.
  # ---- Alternating series, ratio test, absolute and conditional convergence (10.7, 10.8, 10.9)
  - slug: apcalcbc-u10-exam-q22
    type: multiple_choice
    topic_code: "10.7"
    source: "AP Calculus CED, Topic 10.7"
    points: 1
    prompt: |
      Which series converges by the alternating series test?
    options:
      - "∑ (n = 1 to ∞) (−1)ⁿ (1 + 1/n)"
      - "∑ (n = 1 to ∞) (−1)ⁿ 2ⁿ/n"
      - "∑ (n = 2 to ∞) (−1)ⁿ/ln n"
      - "∑ (n = 1 to ∞) (−1)ⁿ n/(n + 1)"
    option_explanations:
      - |
        The magnitudes 1 + 1/n decrease but go to 1, not 0, so the alternating series test fails and the series diverges by the nth term test.
      - |
        The magnitudes 2ⁿ/n grow without bound, so they neither decrease nor go to 0; the series diverges by the nth term test.
      - |
        Correct. bₙ = 1/ln n is positive, decreasing (ln n increases) and goes to 0, so the alternating series converges.
      - |
        The magnitudes n/(n + 1) increase toward 1, not 0, so the alternating series test does not apply and the series diverges.
    answer: 2
  - slug: apcalcbc-u10-exam-q23
    type: multiple_choice
    topic_code: "10.7"
    source: "AP Calculus CED, Topic 10.7"
    points: 1
    prompt: |
      A series has the form ∑ (n = 1 to ∞) (−1)ⁿ⁺¹ bₙ. Which set of conditions is enough for the alternating series test to conclude that the series converges?
    options:
      - "bₙ → 0 as n → ∞"
      - "bₙ > 0, bₙ₊₁ ≤ bₙ for every n, and bₙ → 0 as n → ∞"
      - "∑ (n = 1 to ∞) bₙ converges"
