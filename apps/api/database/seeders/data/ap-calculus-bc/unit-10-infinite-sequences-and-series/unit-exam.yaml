  # ---- Short answers
  - slug: apcalcbc-u10-exam-q43
    type: short_answer
    topic_code: "10.9"
    source: "AP Calculus CED, Topic 10.9"
    points: 3
    prompt: |
      Determine whether ∑ (n = 1 to ∞) (−1)ⁿ⁺¹ n/(n² + 1) converges absolutely, converges conditionally, or diverges. Justify your answer, naming each test you use and checking its conditions.
    answer: |
      Converges conditionally. Absolute values: n/(n² + 1) compared with 1/n gives lim [n/(n² + 1)] / (1/n) = lim n²/(n² + 1) = 1, positive and finite, and ∑ 1/n diverges, so ∑ n/(n² + 1) diverges by limit comparison. The series itself: bₙ = n/(n² + 1) > 0, bₙ → 0, and bₙ is decreasing for n ≥ 1 because the derivative of x/(x² + 1) is (1 − x²)/(x² + 1)² ≤ 0 for x ≥ 1. By the alternating series test the series converges. It converges but not absolutely, so the convergence is conditional.
    explanation: |
      Three points. 1 point: shows ∑ n/(n² + 1) diverges, by limit comparison with the harmonic series (limit 1) or by the integral test (∫ from 1 to ∞ of x/(x² + 1) dx = lim ½ ln(x² + 1) diverges). A direct comparison n/(n² + 1) ≤ 1/n does not earn this point (it points the wrong way). 1 point: applies the alternating series test with all three conditions checked: positive, decreasing (a derivative or n/(n² + 1) ≥ (n + 1)/((n + 1)² + 1) argument) and limit 0. 1 point: the conclusion "converges conditionally", supported by both earlier parts.
  - slug: apcalcbc-u10-exam-q44
    type: short_answer
    topic_code: "10.4"
    source: "AP Calculus CED, Topic 10.4"
    points: 3
    prompt: |
      Use the integral test to determine whether ∑ (n = 1 to ∞) n/(n² + 1)² converges or diverges. Verify the hypotheses of the test.
    answer: |
      Let f(x) = x/(x² + 1)². For x ≥ 1, f is positive and continuous, and f′(x) = (1 − 3x²)/(x² + 1)³ < 0, so f is decreasing. With u = x² + 1: ∫ from 1 to ∞ of x/(x² + 1)² dx = lim (b→∞) [−1/(2(x² + 1))] from 1 to b = 0 + 1/4 = 1/4. The improper integral converges, so by the integral test the series converges.
    explanation: |
      Three points. 1 point: states that f(x) = x/(x² + 1)² is positive, continuous and decreasing for x ≥ 1, with a reason for decreasing (f′(x) = (1 − 3x²)/(x² + 1)³ < 0 for x ≥ 1). 1 point: evaluates the improper integral as a limit, getting 1/4. 1 point: concludes the series converges because the integral converges. Saying the series converges to 1/4 loses the last point: the integral's value is not the sum.
  # ---- Free response
  - slug: apcalcbc-u10-exam-q45
    type: long_answer
    topic_code: "10.12"
    source: "AP Calculus CED, Topic 10.12"
    points: 9
    prompt: |
      (Calculator.) A hypothetical batch of soup is taken off a stove and left to cool. Its temperature, in degrees Celsius, t minutes later is H(t), where H has derivatives of all orders. The table gives H and its first three derivatives at t = 0.

      | H(0) | H′(0) | H″(0) | H‴(0) |
      |---|---|---|---|
      | 82.4 | −5.6 | 0.84 | −0.096 |

      For 0 ≤ t ≤ 3, the fourth derivative satisfies |H⁽⁴⁾(t)| ≤ 0.018.

      (A) Write the third-degree Taylor polynomial P₃(t) for H about t = 0.

      (B) Use P₃ to approximate the temperature of the soup at t = 3 minutes.

      (C) Use the Lagrange error bound to find an upper bound on |H(3) − P₃(3)|. Could the temperature of the soup at t = 3 be 69.05 degrees Celsius? Explain why or why not.

      (D) Let A(x) = ∫ from 0 to x of H(t) dt. Use P₃ to write the fourth-degree Taylor polynomial for A about x = 0, and use it to approximate the average temperature of the soup over the first 3 minutes.
    answer: |
      (A) P₃(t) = 82.4 − 5.6t + (0.84/2)t² + (−0.096/6)t³ = 82.4 − 5.6t + 0.42t² − 0.016t³.
      (B) P₃(3) = 82.4 − 16.8 + 3.78 − 0.432 = 68.948 degrees Celsius.
      (C) |H(3) − P₃(3)| ≤ max |H⁽⁴⁾(t)| · 3⁴/4! ≤ 0.018 · 81/24 = 0.06075. So 68.948 − 0.06075 ≤ H(3) ≤ 68.948 + 0.06075, that is 68.887 ≤ H(3) ≤ 69.009. Since 69.05 > 69.009, the temperature at t = 3 cannot be 69.05 degrees Celsius.
      (D) A(0) = 0 and A′ = H, so integrate P₃ term by term: A₄(x) = 82.4x − 2.8x² + 0.14x³ − 0.004x⁴. A₄(3) = 247.2 − 25.2 + 3.78 − 0.324 = 225.456. Average temperature ≈ A(3)/3 ≈ 225.456/3 = 75.152 degrees Celsius.
    explanation: |
      Nine points. (A) 2 points: 1 point for the constant and linear terms 82.4 − 5.6t; 1 point for the quadratic and cubic terms 0.42t² − 0.016t³ (dividing by 2! and 3!). Leaving the derivatives undivided earns at most 1 point. (B) 1 point for 68.948 (accept 68.95), consistent with the student's P₃. (C) 3 points: 1 point for the form max |H⁽⁴⁾| · |3 − 0|⁴/4!, 1 point for the value 0.06075 (accept 0.061), and 1 point for the conclusion "no" with the reason that 69.05 exceeds P₃(3) + bound ≈ 69.009 (or that |69.05 − 68.948| = 0.102 is larger than the bound). (D) 3 points: 1 point for using A(0) = 0 and A′ = H to integrate term by term, 1 point for A₄(x) = 82.4x − 2.8x² + 0.14x³ − 0.004x⁴, and 1 point for the average value 75.152 (accept 75.15), with A(3)/3 shown. Using the alternating series error bound in (C) earns no point there: the signs of the higher terms of H's series are not known.
  - slug: apcalcbc-u10-exam-q46
    type: long_answer
    topic_code: "10.13"
    source: "AP Calculus CED, Topic 10.13"
    points: 9
    prompt: |
      No calculator. The function f is defined by the power series f(x) = ∑ (n = 1 to ∞) (x − 2)ⁿ/(n · 3ⁿ) = (x − 2)/3 + (x − 2)²/18 + (x − 2)³/81 + … for all x for which the series converges.

      (A) Use the ratio test to find the radius of convergence of the series.

      (B) Find the interval of convergence of the series. Justify your conclusion at each endpoint.

      (C) Write the first three nonzero terms and the general term of the power series for f′(x) about x = 2. Then find the sum of this series as an expression in x, for x in its open interval of convergence.

      (D) Let g(x) = ∫ from 2 to x of f(t) dt. Write the first three nonzero terms and the general term of the power series for g(x) about x = 2.
    answer: |
      (A) |aₙ₊₁/aₙ| = |x − 2|ⁿ⁺¹/((n + 1)3ⁿ⁺¹) · (n · 3ⁿ)/|x − 2|ⁿ = (n/(n + 1)) · |x − 2|/3 → |x − 2|/3. The series converges when |x − 2|/3 < 1, so the radius of convergence is 3.
      (B) The open interval is −1 < x < 5. At x = 5 the series is ∑ 3ⁿ/(n · 3ⁿ) = ∑ 1/n, the harmonic series, which diverges. At x = −1 the series is ∑ (−3)ⁿ/(n · 3ⁿ) = ∑ (−1)ⁿ/n; the magnitudes 1/n are positive, decreasing and go to 0, so it converges by the alternating series test. The interval of convergence is −1 ≤ x < 5.
      (C) f′(x) = ∑ (n = 1 to ∞) (x − 2)ⁿ⁻¹/3ⁿ = 1/3 + (x − 2)/9 + (x − 2)²/27 + …. This is geometric with first term 1/3 and ratio (x − 2)/3, so for −1 < x < 5 its sum is (1/3)/(1 − (x − 2)/3) = 1/(5 − x).
      (D) g(x) = ∑ (n = 1 to ∞) (x − 2)ⁿ⁺¹/(n(n + 1)3ⁿ) = (x − 2)²/6 + (x − 2)³/54 + (x − 2)⁴/324 + ….
    explanation: |
      Nine points. (A) 2 points: 1 point for setting up the ratio |aₙ₊₁/aₙ| and its limit |x − 2|/3; 1 point for radius 3. (B) 3 points: 1 point for the endpoint x = 5 with the conclusion "diverges" because it is the harmonic series (or a p-series with p = 1); 1 point for the endpoint x = −1 with the conclusion "converges" by the alternating series test with its conditions named; 1 point for the interval −1 ≤ x < 5, consistent with the endpoint analysis. (C) 2 points: 1 point for 1/3 + (x − 2)/9 + (x − 2)²/27 and the general term (x − 2)ⁿ⁻¹/3ⁿ (or (x − 2)ⁿ/3ⁿ⁺¹ starting at n = 0); 1 point for the sum 1/(5 − x) from the geometric series formula. (D) 2 points: 1 point for the three terms (x − 2)²/6 + (x − 2)³/54 + (x − 2)⁴/324; 1 point for the general term (x − 2)ⁿ⁺¹/(n(n + 1)3ⁿ). A constant of integration other than 0 loses a point in (D): g(2) = 0.
