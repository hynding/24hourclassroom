# The AP Calculus BC course map. BC builds on AP Calculus AB: the AB course's
# weekly guides, flashcards, quizzes, unit exams and summaries are reused
# as they are (a week file that says `reuse: [AB weeks]`, a unit that says
# `reuse_unit_exam: true`), at BC's faster pace, and BC adds its own weeks
# for the BC-only topics (6.11-6.13, 7.5, 7.9, 8.13, Units 9-10), its own
# Unit 9 and 10 exams and summaries, an exam-prep guide and a practice final.
# Seeding BC seeds AB first, for the same teacher (CurriculumSeeder).
title: AP Calculus BC
prefix: AP Calculus BC
slug: apcalcbc
builds_on: ap-calculus-ab
site_slug: ap-calculus-bc
description: >
  A full school year of AP Calculus BC, for a student who has finished
  Precalculus. It moves through all of AP Calculus AB at a faster pace, reusing
  that course's weekly study guides, flashcards, quizzes, unit exams and
  summaries, and adds a week of its own for each BC topic: integration by
  parts, partial fractions and improper integrals; Euler's method and logistic
  growth; arc length; parametric, polar and vector-valued functions (Unit 9);
  and infinite sequences and series (Unit 10), with their own study guides,
  flashcards, quizzes, unit exams and summaries. It ends with an exam-prep
  guide and a practice final whose first 48 questions follow the May 2027 AP
  Calculus BC exam format (42 multiple choice, then six free-response
  questions). Original material written around the College Board AP Calculus
  AB and BC Course and Exam Description, with original worked examples,
  questions and cards.
  Free to copy, adapt and share under CC BY 4.0, crediting 24 Hour
  Classroom.
# The same demo teacher as AP Calculus AB: the reused AB items must be the
# BC course owner's own, so both courses always have one owner.
teacher: { name: "AP Calculus AB Teacher", email: apcalcab@example.com }
student: { name: "AP Calculus BC Student", email: apcalcbc-student@example.com }
# Monday of week 1. The AP exam is Monday 2027-05-10, session 1 (AP Central).
start_date: 2026-08-31
exam_date: 2027-05-10
subject: math
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The May 2027 AP Calculus BC exam format and calculator rules, how the practice final maps onto it, the free-response question types and how they are scored, the BC unit weightings, the series tests, error bounds and parametric, polar and vector facts to know cold, and a two-week review plan.
attribution_markers: ["AP Calculus AB and BC Course and Exam Description", "CC BY 4.0"]
attribution: |
  Original study material written for this course and organised around the
  College Board AP Calculus AB and BC Course and Exam Description. Every
  explanation, worked example, data set, flashcard and question was written
  for this course. © 2026 24 Hour Classroom, licensed under CC BY 4.0
  (https://creativecommons.org/licenses/by/4.0/).
practices:
  "1": Implementing Mathematical Processes
  "2": Connecting Representations
  "3": Justification
  "4": Communication and Notation
