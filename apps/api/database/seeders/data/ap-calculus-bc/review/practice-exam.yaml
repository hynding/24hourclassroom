week: 34
description: |
  A full practice final: 70 questions · about 4 hours · all ten units. Questions 1–48 are a mock AP
  Calculus BC exam in the May 2027 format. The real exam is a hybrid digital exam on Monday, May 10, 2027
  (2027-05-10), session 1: multiple-choice and free-response prompts appear in the Bluebook app,
  multiple-choice answers are entered there, and free-response answers are handwritten in a paper booklet.
  Section I is 42 multiple-choice questions in 1 hour 40 minutes, 50% of the score: Part A, questions 1–29,
  no calculator (62 minutes); Part B, questions 30–42, graphing calculator required (38 minutes; marked
  "(Calculator.)"). Section II is six free-response questions in 1 hour 30 minutes, 50% of the score: Part A,
  questions 43–44, graphing calculator required (30 minutes: grain loaded into and removed from a silo, and
  the region between a limaçon and a circle in polar form); Part B, questions 45–48, no calculator (60
  minutes: an accumulation function from a graph with an improper integral, a differential equation with a
  tangent line, Euler's method and separation of variables, an area, volume and perimeter question, and a
  power series with its interval of convergence, a Taylor polynomial and an alternating series error bound).
  The units appear roughly in proportion to the BC weightings, so about two fifths of questions 1–48 are
  BC-only content: series, parametric, polar and vector-valued functions, integration by parts, partial
  fractions, improper integrals, Euler's method, logistic growth and arc length. Questions 49–70 (about 45
  minutes) are not AP format: select-all, true/false, fill-in-the-blank, numeric and short-answer practice
  across all ten units, opening with a shared-context set on a particle moving in the plane. Multiple choice,
  select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
  automatically; the short answers (3 points each) and the six free-response questions (9 points each,
  scored like the AP exam) are graded by your teacher against the scoring notes. Keep the calculator in
  radian mode and give decimal answers to three decimal places.
questions:
  # ---- Section I, Part A: no calculator (q01-q29).
  - slug: apcalcbc-final-q01
    type: multiple_choice
    topic_code: "1.6"
    source: "AP Calculus CED, Topic 1.6"
    points: 1
    prompt: |
      What is lim (x→5) (√(x + 4) − 3)/(x − 5)?
    options:
      - "1/3"
      - "6"
      - "1/6"
      - "The limit does not exist."
    option_explanations:
      - |
        This multiplies by the conjugate but then keeps only √(x + 4) in the denominator, giving 1/√9 = 1/3; the conjugate sum √9 + 3 = 6 belongs there.
      - |
        6 is the value of the conjugate √(x + 4) + 3 at x = 5; after cancelling, that sum sits in the denominator, so the limit is its reciprocal.
      - |
        Correct. Multiply by the conjugate: (x + 4 − 9)/((x − 5)(√(x + 4) + 3)) = 1/(√(x + 4) + 3) for x ≠ 5, which tends to 1/(3 + 3) = 1/6.
      - |
        Substitution gives 0/0, an indeterminate form, not proof that the limit fails to exist; rationalising the numerator removes the factor x − 5.
    answer: 2
  - slug: apcalcbc-final-q02
    type: multiple_choice
    topic_code: "1.15"
    source: "AP Calculus CED, Topic 1.15"
    points: 1
    prompt: |
      What is lim (x→−∞) √(4x² + 1)/(x + 3)?
    options:
      - "−2"
      - "2"
      - "−1/2"
      - "−∞"
    option_explanations:
      - |
        Correct. For x < 0, √(x²) = |x| = −x, so √(4x² + 1)/(x + 3) = −√(4 + 1/x²)/(1 + 3/x), which tends to −√4/1 = −2.
      - |
        This divides the root by √(x²) as if it were x; for negative x, √(x²) = −x, which supplies the negative sign.
      - |
        This flips the ratio of the leading coefficients, dividing 1 by 2 instead of 2 by 1, and keeps the correct negative sign.
      - |
        This compares 4x² with x and forgets the square root; √(4x² + 1) grows like 2|x|, the same rate as the denominator, so the limit is finite.
    answer: 0
  - slug: apcalcbc-final-q03
    type: multiple_choice
    topic_code: "2.2"
    source: "AP Calculus CED, Topic 2.2"
    points: 1
    prompt: |
      What is lim (h→0) (ln(e + h) − 1)/h?
    options:
      - "1"
      - "1/e"
      - "0"
      - "e"
    option_explanations:
      - |
        This reads the limit as the derivative of ln x at x = 1, but the base point is e, since ln e = 1 is what is subtracted.
      - |
        Correct. Because ln e = 1, this is the limit definition of the derivative of ln x at x = e, which is 1/e.
      - |
        Setting h = 0 gives 0/0, which is indeterminate; the expression is a difference quotient whose limit is a derivative.
      - |
        This inverts the derivative of ln x: d/dx ln x = 1/x, so at x = e the value is 1/e, not e.
    answer: 1
  - slug: apcalcbc-final-q04
    type: multiple_choice
    topic_code: "2.6"
    source: "AP Calculus CED, Topic 2.6"
    points: 1
    prompt: |
      If f(x) = 4√x − 3/x + e², what is f′(4)?
    options:
      - "19/16 + e²"
      - "13/16"
      - "67/16"
      - "19/16"
    option_explanations:
      - |
        e² is a constant, so its derivative is 0; it should not survive into f′(4).
      - |
        This differentiates −3/x as −3/x²; the power rule gives −3 · (−1)x⁻² = +3/x², so the second term is added.
      - |
        This takes the derivative of 4√x as 4 · √x instead of 4 · (1/2)x^(−1/2) = 2/√x, giving 4 + 3/16 = 67/16.
      - |
        Correct. f′(x) = 2/√x + 3/x² + 0, so f′(4) = 2/2 + 3/16 = 19/16.
    answer: 3
  - slug: apcalcbc-final-q05
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Calculus CED, Topic 3.2"
    points: 1
    prompt: |
      The point (1, 1) lies on the curve x² + 3xy + y³ = 5. What is the slope of the line tangent to the curve at (1, 1)?
    options:
      - "5/6"
      - "−5/6"
      - "−1/3"
      - "−8/3"
    option_explanations:
      - |
        This drops the negative sign when solving: dy/dx = −(2x + 3y)/(3x + 3y²), and at (1, 1) that is −5/6.
      - |
        Correct. Differentiating gives 2x + 3y + 3x(dy/dx) + 3y²(dy/dx) = 0, so dy/dx = −(2x + 3y)/(3x + 3y²) = −5/(3 + 3) = −5/6.
      - |
        This differentiates 3xy as 3(dy/dx) without the product rule, losing the 3y term: 2 + 6(dy/dx) = 0.
      - |
        This forgets the dy/dx on the derivative of y³, treating it as 3y² alone: 2 + 3 + 3 + 3(dy/dx) = 0.
    answer: 1
  - slug: apcalcbc-final-q06
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Calculus CED, Topic 3.3"
    points: 1
    prompt: |
      Let f(x) = x³ + 4x − 1, and let h be the inverse function of f. What is h′(4)?
    options:
      - "1/52"
      - "7"
      - "1/7"
      - "1/3"
    option_explanations:
      - |
        This evaluates f′ at 4, the input of h, instead of at h(4) = 1: 1/f′(4) = 1/(48 + 4) = 1/52.
      - |
        7 is f′(1), the slope of f at (1, 4); the inverse has the reciprocal slope at (4, 1).
      - |
        Correct. f(1) = 1 + 4 − 1 = 4, so h(4) = 1 and h′(4) = 1/f′(1) = 1/(3 + 4) = 1/7.
      - |
        This differentiates x³ + 4x − 1 as 3x², dropping the 4 from 4x, so f′(1) comes out as 3.
    answer: 2
  - slug: apcalcbc-final-q07
    type: multiple_choice
    topic_code: "4.7"
    source: "AP Calculus CED, Topic 4.7"
    points: 1
    prompt: |
      What is lim (x→0) (x − sin x)/x³?
    options:
      - "1/6"
      - "1/2"
      - "0"
      - "1"
    option_explanations:
      - |
        Correct. The form is 0/0. L'Hospital's Rule gives (1 − cos x)/(3x²), still 0/0; then sin x/(6x), still 0/0; then cos x/6, which tends to 1/6.
      - |
        This differentiates x³ as x² in the first step, getting (1 − cos x)/x², whose limit is 1/2; the derivative of x³ is 3x².
      - |
        After one application, (1 − cos x)/(3x²) is still the indeterminate form 0/0, not 0; it needs two more applications.
      - |
        This treats the expression like sin x/x and reports 1; subtracting sin x from x leaves a difference that is far smaller than x near 0.
    answer: 0
  - slug: apcalcbc-final-q08
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Calculus CED, Topic 4.2"
    points: 1
    prompt: |
      A particle moves along the x-axis with position x(t) = t³ − 9t² + 24t for t > 0. For which values of t is the particle speeding up?
    options:
      - "t > 3 only"
      - "0 < t < 2 and t > 4"
      - "2 < t < 4"
      - "2 < t < 3 and t > 4"
    option_explanations:
      - |
        This uses only the acceleration, a(t) = 6t − 18 > 0; speeding up needs velocity and acceleration to have the same sign.
      - |
        These are the times when the velocity v(t) = 3(t − 2)(t − 4) is positive, which says the particle moves right, not that it speeds up.
      - |
        These are the times when the velocity is negative (moving left); on 3 < t < 4 the acceleration is positive, so the particle slows down there.
      - |
        Correct. v(t) = 3(t − 2)(t − 4) and a(t) = 6(t − 3). Both are negative on 2 < t < 3 and both positive for t > 4, so the speed increases on those intervals.
    answer: 3
  - slug: apcalcbc-final-q09
    type: multiple_choice
    topic_code: "5.1"
    source: "AP Calculus CED, Topic 5.1"
    points: 1
    prompt: |
      Let f(x) = x³ − x. What value of c in the open interval (0, 2) satisfies the conclusion of the Mean Value Theorem for f on [0, 2]?
    options:
      - "1"
      - "√3/3"
      - "2√3/3"
      - "√(7/3)"
    option_explanations:
      - |
        1 is the midpoint of the interval; the Mean Value Theorem point is where f′ equals the average rate of change, which need not be the midpoint.
      - |
        At c = √3/3, f′(c) = 0; that is the Rolle's Theorem condition, which applies only when f(0) = f(2), and here f(2) = 6.
      - |
        Correct. The average rate of change is (f(2) − f(0))/2 = (6 − 0)/2 = 3. Solving f′(c) = 3c² − 1 = 3 gives c² = 4/3, and c = 2/√3 = 2√3/3 is in (0, 2).
      - |
        This sets f′(c) equal to the change f(2) − f(0) = 6 without dividing by the width 2, solving 3c² − 1 = 6.
    answer: 2
  - slug: apcalcbc-final-q10
    type: multiple_choice
    topic_code: "5.4"
    source: "AP Calculus CED, Topic 5.4"
    points: 1
    prompt: |
      The derivative of a function f is f′(x) = (x − 3)(x + 1)²e^(−x). Which describes the relative extrema of f?
    options:
      - "a relative maximum at x = −1 and a relative minimum at x = 3"
      - "a relative minimum at x = 3 only"
      - "a relative maximum at x = 3 only"
      - "relative minima at x = −1 and x = 3"
    option_explanations:
      - |
        f′(−1) = 0, but (x + 1)² and e^(−x) are never negative, so f′ is negative on both sides of x = −1 and does not change sign there.
      - |
        Correct. The sign of f′ is the sign of x − 3, since (x + 1)²e^(−x) ≥ 0. f′ changes from negative to positive at x = 3 (a relative minimum) and does not change sign at x = −1.
      - |
        This reverses the first derivative test: f′ goes from negative to positive at x = 3, which gives a relative minimum, not a maximum.
      - |
        This counts every zero of f′ as an extremum; at x = −1 the squared factor keeps f′ negative on both sides, so there is no extremum.
    answer: 1
  - slug: apcalcbc-final-q11
    type: multiple_choice
    topic_code: "5.6"
    source: "AP Calculus CED, Topic 5.6"
    points: 1
    prompt: |
      At what value of x does the graph of f(x) = x·e^(−2x) have a point of inflection?
    options:
      - "1"
      - "1/2"
      - "2"
      - "0"
    option_explanations:
      - |
        Correct. f′(x) = e^(−2x)(1 − 2x) and f″(x) = e^(−2x)(4x − 4). f″ changes from negative to positive at x = 1, so the graph has a point of inflection there.
      - |
        x = 1/2 is where f′ = 0, the relative maximum of f, not where the concavity changes.
      - |
        2 is the inflection point of x·e^(−x); with e^(−2x) the chain rule doubles the factors and moves it to x = 1.
      - |
        f(0) = 0, but f″(0) = −4 ≠ 0, so the graph is concave down at x = 0, not changing concavity.
    answer: 0
  - slug: apcalcbc-final-q12
    type: multiple_choice
    topic_code: "6.4"
    source: "AP Calculus CED, Topic 6.4"
    points: 1
    prompt: |
      Let F(x) = ∫ from 2 to 3x of √(t² + 7) dt. What is F′(1)?
    options:
      - "4"
      - "12 − √11"
      - "6√2"
      - "12"
    option_explanations:
      - |
        This is √((3x)² + 7) at x = 1 without the chain-rule factor 3 from the upper limit 3x.
      - |
        This also subtracts the integrand at the lower limit, √(2² + 7) = √11, but the lower limit is a constant, so it contributes nothing.
      - |
        This substitutes t = x instead of t = 3x, giving 3√(1 + 7) = 6√2; the integrand is evaluated at the upper limit 3x = 3.
      - |
        Correct. By the Fundamental Theorem with the chain rule, F′(x) = √((3x)² + 7) · 3, so F′(1) = 3√16 = 12.
    answer: 3
  - slug: apcalcbc-final-q13
    type: multiple_choice
    topic_code: "6.9"
    source: "AP Calculus CED, Topic 6.9"
    points: 1
    prompt: |
      What is ∫ from 1 to e of (ln x)²/x dx?
    options:
      - "1/3"
      - "(e³ − 1)/3"
      - "1/2"
      - "1"
    option_explanations:
      - |
        Correct. With u = ln x, du = dx/x and the limits become u = 0 to u = 1: ∫₀¹ u² du = 1/3.
      - |
        This substitutes u = ln x but keeps the x-limits 1 and e, evaluating u³/3 from 1 to e.
      - |
        This integrates as if the integrand were (ln x)/x, using u²/2 instead of u³/3.
      - |
        This uses the antiderivative u³ without dividing by 3.
    answer: 0
  - slug: apcalcbc-final-q14
    type: multiple_choice
    topic_code: "6.11"
    source: "AP Calculus CED, Topic 6.11"
    points: 1
    prompt: |
      Which is ∫ x sec² x dx?
    options:
      - "x tan x − ln|cos x| + C"
      - "(x²/2) tan x + C"
      - "x tan x + ln|cos x| + C"
      - "x tan x − sec² x + C"
    option_explanations:
      - |
        This is a sign slip in ∫ tan x dx, which equals −ln|cos x|; subtracting it gives +ln|cos x|.
      - |
        This integrates each factor separately and multiplies the results; there is no product rule for integrals of that kind.
      - |
        Correct. By parts with u = x, dv = sec² x dx: v = tan x, so the integral is x tan x − ∫ tan x dx = x tan x + ln|cos x| + C. Check: the derivative is tan x + x sec² x − tan x = x sec² x.
      - |
        This differentiates tan x instead of integrating it in the last step: ∫ tan x dx is −ln|cos x|, not sec² x.
    answer: 2
  - slug: apcalcbc-final-q15
    type: multiple_choice
    topic_code: "6.12"
    source: "AP Calculus CED, Topic 6.12"
    points: 1
    prompt: |
      What is ∫ from 2 to 4 of 2/(x² − 1) dx?
    options:
      - "ln(5/9)"
      - "(1/2) ln(9/5)"
      - "ln 5"
      - "ln(9/5)"
    option_explanations:
      - |
        This reverses the partial fractions to 1/(x + 1) − 1/(x − 1), which changes the sign of the answer.
      - |
        This decomposes 1/(x² − 1) and forgets the factor 2 in the numerator, so each coefficient is half its true size.
      - |
        This uses ln(x² − 1) as the antiderivative, which would need 2x, not 2, in the numerator.
      - |
        Correct. 2/((x − 1)(x + 1)) = 1/(x − 1) − 1/(x + 1), so the integral is [ln|x − 1| − ln|x + 1|] from 2 to 4 = (ln 3 − ln 5) − (0 − ln 3) = ln(9/5).
    answer: 3
  - slug: apcalcbc-final-q16
    type: multiple_choice
    topic_code: "6.13"
    source: "AP Calculus CED, Topic 6.13"
    points: 1
    prompt: |
      What is ∫ from 3 to ∞ of 4/(x − 1)³ dx?
    options:
      - "1"
      - "1/2"
      - "−1/2"
      - "The integral diverges."
    option_explanations:
      - |
        This uses −1/(x − 1)² as the antiderivative of 1/(x − 1)³, forgetting to divide by the new exponent's 2.
      - |
        Correct. lim (b→∞) [−2/(x − 1)²] from 3 to b = lim (b→∞) (−2/(b − 1)² + 2/4) = 0 + 1/2 = 1/2.
      - |
        This subtracts in the wrong order, F(3) − F(b), which flips the sign; a positive integrand cannot have a negative integral.
      - |
        The integrand behaves like 4/x³, a p-integral with p = 3 > 1, so it converges; divergence would need p ≤ 1.
    answer: 1
  - slug: apcalcbc-final-q17
    type: multiple_choice
    topic_code: "7.5"
    source: "AP Calculus CED, Topic 7.5"
    points: 1
    prompt: |
      Let y = f(x) be the solution of dy/dx = 3x − y + 1 with f(0) = 1. What is the approximation of f(1) from Euler's method with two steps of equal size, starting at x = 0?
    options:
      - "1"
      - "1.75"
      - "2.5"
      - "0.75"
    option_explanations:
      - |
        This takes one step of size 1 with the slope 0 at (0, 1): 1 + 1 · 0 = 1. The question asks for two steps of size 0.5.
      - |
        Correct. Step size 0.5. At (0, 1) the slope is 0 − 1 + 1 = 0, so f(0.5) ≈ 1 + 0.5(0) = 1. At (0.5, 1) the slope is 1.5 − 1 + 1 = 1.5, so f(1) ≈ 1 + 0.5(1.5) = 1.75.
      - |
        This adds each slope to y without multiplying by the step size 0.5: 1 + 0 = 1, then 1 + 1.5 = 2.5.
      - |
        0.75 is only the change in the second step, 0.5 · 1.5; it must be added to the value 1 from the first step.
    answer: 1
  - slug: apcalcbc-final-q18
    type: multiple_choice
    topic_code: "7.9"
    source: "AP Calculus CED, Topic 7.9"
    points: 1
    prompt: |
      A hypothetical fish population P(t) in a lake satisfies dP/dt = 0.4P(1 − P/600), with P(0) = 100. What is the population at the moment it is growing fastest?
    options:
      - "600"
      - "240"
      - "300"
      - "350"
    option_explanations:
      - |
        600 is the carrying capacity, the limit of P(t) as t → ∞; there dP/dt = 0, so the population is barely growing.
      - |
        240 multiplies the rate constant 0.4 by the carrying capacity 600, which is not a population value from the model.
      - |
        Correct. dP/dt = 0.4P − (0.4/600)P² is a downward parabola in P with its vertex at half the carrying capacity, P = 300, where the growth rate is greatest.
      - |
        This averages the initial population and the carrying capacity, (100 + 600)/2; the fastest growth is at half the carrying capacity whatever P(0) is.
    answer: 2
  - slug: apcalcbc-final-q19
    type: multiple_choice
    topic_code: "8.5"
    source: "AP Calculus CED, Topic 8.5"
    points: 1
    prompt: |
      What is the area of the region enclosed by the curve x = y² and the line x = 6 − y?
    options:
      - "−125/6"
      - "27/2"
      - "22/3"
      - "125/6"
    option_explanations:
      - |
        This subtracts right minus left the wrong way round, ∫ (y² − (6 − y)) dy; an area must be positive.
      - |
        This integrates only from y = −3 to y = 0, the part of the region below the x-axis.
      - |
        This integrates only from y = 0 to y = 2, the part of the region above the x-axis.
      - |
        Correct. The curves meet where y² = 6 − y, at y = −3 and y = 2, and x = 6 − y is on the right. Area = ∫ from −3 to 2 of (6 − y − y²) dy = 22/3 − (−27/2) = 125/6.
    answer: 3
  - slug: apcalcbc-final-q20
    type: multiple_choice
    topic_code: "8.13"
    source: "AP Calculus CED, Topic 8.13"
    points: 1
    prompt: |
      Which integral gives the length of the curve y = ln(cos x) from x = 0 to x = π/4?
    options:
      - "∫ from 0 to π/4 of sec x dx"
      - "∫ from 0 to π/4 of √(1 + (ln(cos x))²) dx"
      - "∫ from 0 to π/4 of (1 + tan² x) dx"
      - "∫ from 0 to π/4 of √(1 − tan² x) dx"
    option_explanations:
      - |
        Correct. dy/dx = −sin x/cos x = −tan x, so √(1 + (dy/dx)²) = √(1 + tan² x) = √(sec² x) = sec x, which is positive on [0, π/4].
      - |
        This puts the function y itself under the square root; the arc length formula uses the derivative dy/dx.
      - |
        This forgets the square root in √(1 + (dy/dx)²); 1 + tan² x = sec² x, and the length element is its square root.
      - |
        This squares −tan x as −tan² x; (−tan x)² = tan² x, so the term under the root is 1 + tan² x.
    answer: 0
  - slug: apcalcbc-final-q21
    type: multiple_choice
    topic_code: "9.1"
    source: "AP Calculus CED, Topic 9.1"
    points: 1
    prompt: |
      A curve is defined by x = t² − 4t and y = t³ + t. What is the slope of the line tangent to the curve at the point where t = 3?
    options:
      - "1/14"
      - "28"
      - "13"
      - "14"
    option_explanations:
      - |
        This divides dx/dt by dy/dt; the slope is dy/dx = (dy/dt)/(dx/dt).
      - |
        28 is dy/dt = 3t² + 1 at t = 3; it still has to be divided by dx/dt = 2.
      - |
        This differentiates t³ + t as 3t² − 1, a sign slip, giving 26/2 = 13.
      - |
        Correct. dy/dx = (dy/dt)/(dx/dt) = (3t² + 1)/(2t − 4); at t = 3 this is 28/2 = 14.
    answer: 3
  - slug: apcalcbc-final-q22
    type: multiple_choice
    topic_code: "9.2"
    source: "AP Calculus CED, Topic 9.2"
    points: 1
    prompt: |
      A curve is given by x = t² and y = t³ for t > 0. What is the value of d²y/dx² at t = 2?
    options:
      - "3/2"
      - "3/8"
      - "6"
      - "3"
    option_explanations:
      - |
        This differentiates dy/dx = 3t/2 with respect to t and stops; d²y/dx² = (d/dt(dy/dx))/(dx/dt), so 3/2 must be divided by 2t = 4.
      - |
        Correct. dy/dx = 3t²/(2t) = 3t/2. Then d²y/dx² = (d/dt (3t/2))/(dx/dt) = (3/2)/(2t), which is 3/8 at t = 2.
      - |
