    explanation: |
      Three points. 1 point: differentiating S = 4πr² with respect to t, with dS/dt = −8 (the negative sign for a decrease). 1 point: dr/dt = −1/(4π) cm/min. 1 point: dV/dt = −16 cm³/min with units, from dV/dt = 4πr²(dr/dt). Substituting r = 4 before differentiating earns no credit for the last two points.
