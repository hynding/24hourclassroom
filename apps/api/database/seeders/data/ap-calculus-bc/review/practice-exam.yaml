    prompt: |
      True or false: For dy/dx = y with y(0) = 1, Euler's method with two steps of size 0.5 gives an approximation of y(1) that is greater than the exact value e.
    answer: false
    explanation: |
      False. Step 1: y(0.5) ≈ 1 + 0.5(1) = 1.5. Step 2: y(1) ≈ 1.5 + 0.5(1.5) = 2.25. The exact value is e ≈ 2.718, so the Euler approximation is smaller. The solution y = eˣ is concave up, so each Euler step, which follows a tangent line, falls below the curve.
