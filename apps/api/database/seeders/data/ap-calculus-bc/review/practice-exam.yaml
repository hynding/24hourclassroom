      (D) Write, but do not evaluate, an integral expression for the area of the region that is inside C and outside L.
    answer: |
      (A) The curves meet where 3 + 2 sin θ = 4, so sin θ = 1/2 and θ = π/6 or θ = 5π/6. Area of S = (1/2) ∫ from π/6 to 5π/6 of ((3 + 2 sin θ)² − 16) dθ ≈ 6.022. (Exactly 13√3/2 − 5π/3.)
      (B) dr/dθ = 2 cos θ, so at θ = 2.5, dr/dθ = 2 cos 2.5 ≈ −1.602. Since r > 0 and dr/dθ < 0, the point on L is moving closer to the origin as θ increases through 2.5: its distance from the origin is decreasing at about 1.602 units per radian.
      (C) x = r cos θ = (3 + 2 sin θ) cos θ and y = r sin θ = (3 + 2 sin θ) sin θ. dy/dx = (dy/dθ)/(dx/dθ); at θ = π/4 this is ≈ −1.943 (calculator numerical derivatives; exactly −1 − 2√2/3).
      (D) (1/2) ∫ from 5π/6 to 13π/6 of (16 − (3 + 2 sin θ)²) dθ. Equivalent forms: 16π − (1/2) ∫ from 0 to 2π of (3 + 2 sin θ)² dθ + (area of S); or (1/2) ∫ from −7π/6 to π/6 of (16 − (3 + 2 sin θ)²) dθ.
    explanation: |
      Nine points.
      (A) 3 points: 1 for the limits π/6 and 5π/6 (from 3 + 2 sin θ = 4); 1 for the integrand (1/2)((3 + 2 sin θ)² − 16), with the 1/2 and both radii squared; 1 for 6.022 (accept 6.02). Squaring the difference, (3 + 2 sin θ − 4)², earns no integrand point.
      (B) 2 points: 1 for dr/dθ ≈ −1.602 (accept −1.60); 1 for the interpretation that the point is moving toward the origin (its distance from the origin is decreasing), which needs r > 0 to be noticed or stated. "The curve is decreasing" earns no point.
      (C) 2 points: 1 for dy/dx = (dy/dθ)/(dx/dθ) with x = r cos θ and y = r sin θ; 1 for −1.943 (accept −1.94). Reporting dr/dθ at π/4 as the slope earns nothing.
      (D) 2 points: 1 for limits that sweep the part of C outside L, from 5π/6 to 13π/6 (or an equivalent interval of length 4π/3 through 3π/2); 1 for the integrand (1/2)(16 − (3 + 2 sin θ)²). A correct equivalent built from the circle's area 16π earns both points.
