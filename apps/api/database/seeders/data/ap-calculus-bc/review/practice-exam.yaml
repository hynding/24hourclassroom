    prompt: |
      A spherical soap bubble shrinks so that its surface area decreases at a constant 8 square centimetres per minute.
      (a) How fast is the radius changing at the instant the radius is 4 centimetres?
      (b) How fast is the volume changing at that instant? Include units.
    answer: |
      (a) S = 4πr², so dS/dt = 8πr(dr/dt). With dS/dt = −8 and r = 4: −8 = 32π(dr/dt), so dr/dt = −1/(4π) ≈ −0.080 cm per minute; the radius decreases at 1/(4π) cm per minute.
