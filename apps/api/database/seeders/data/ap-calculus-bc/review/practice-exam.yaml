  - slug: apcalcbc-final-q45
    type: long_answer
    topic_code: "6.5"
    source: "AP Calculus CED, Topic 6.5"
    points: 9
    stimulus: |
      The continuous function f is defined for x ≥ −2. On the interval −2 ≤ x ≤ 6, the graph of f consists of four line segments joining, in order, the points (−2, 0), (0, 2), (2, 2), (4, −2) and (6, −1). For x > 6, f(x) = −8/(x − 4)³. Let g(x) = ∫ from 0 to x of f(t) dt.
    prompt: |
      (No calculator.) Free-response question 3.

      (A) Find g(4) and g(−2).

      (B) Find the x-coordinate of each point at which g has a relative minimum or a relative maximum on the open interval (−2, 6). Classify each one and justify your answer.

      (C) On what open intervals contained in (−2, 6) is the graph of g concave down? Give a reason for your answer.

      (D) Evaluate the improper integral ∫ from 6 to ∞ of f(x) dx, showing the limit, and use it to find lim (x→∞) g(x).
    answer: |
      (A) g(4) = ∫ from 0 to 4 of f(t) dt. On [0, 2] the rectangle has area 4. On [2, 4], f(t) = −2t + 6 crosses zero at t = 3, giving a triangle of area 1 above the axis and one of area 1 below, so that part contributes 0. g(4) = 4. g(−2) = −∫ from −2 to 0 of f(t) dt = −(1/2)(2)(2) = −2.
      (B) g′(x) = f(x). On (−2, 6), f = 0 only at x = 3. g has a relative maximum at x = 3 because g′ = f changes from positive to negative there. There is no relative minimum on (−2, 6): f is positive on (−2, 3) and negative on (3, 6).
      (C) g″(x) = f′(x). The graph of g is concave down on (2, 4), because g′ = f is decreasing there. (On (0, 2), f is constant, so g is linear there; on (−2, 0) and (4, 6), f is increasing, so g is concave up.)
      (D) ∫ from 6 to ∞ of −8/(x − 4)³ dx = lim (b→∞) [4/(x − 4)²] from 6 to b = lim (b→∞) (4/(b − 4)² − 4/4) = 0 − 1 = −1. g(6) = g(4) + ∫ from 4 to 6 of f(t) dt = 4 + (1/2)(2)(−2 + −1) = 4 − 3 = 1. Therefore lim (x→∞) g(x) = g(6) + ∫ from 6 to ∞ of f(t) dt = 1 + (−1) = 0.
    explanation: |
      Nine points.
      (A) 2 points: 1 for g(4) = 4; 1 for g(−2) = −2. Reversed limits giving +2 for g(−2) is the usual error and earns no point.
      (B) 2 points: 1 for the relative maximum at x = 3; 1 for the reason "g′ = f changes from positive to negative at x = 3". Naming a relative minimum anywhere in (−2, 6) loses the first point.
      (C) 2 points: 1 for the interval (2, 4) only; 1 for the reason "g′ = f is decreasing" (or g″ = f′ < 0). Including (0, 2) loses the interval point.
      (D) 3 points: 1 for writing the improper integral as a limit, lim (b→∞) ∫ from 6 to b; 1 for the antiderivative 4/(x − 4)² and the value −1; 1 for g(6) = 1 and lim (x→∞) g(x) = 0. Writing "4/∞²" or evaluating "at ∞" without a limit loses the first point.
  - slug: apcalcbc-final-q46
    type: long_answer
    topic_code: "7.7"
    source: "AP Calculus CED, Topic 7.7"
    points: 9
    stimulus: |
      Let y = f(x) be the particular solution of the differential equation dy/dx = (y − 1)(2x + 1) with initial condition f(0) = 3.
    prompt: |
      (No calculator.) Free-response question 4.

      (A) Write an equation for the line tangent to the graph of f at x = 0, and use it to approximate f(0.2).

      (B) Find d²y/dx² at the point (0, 3). Is the approximation in part (A) an overestimate or an underestimate of f(0.2)? Give a reason for your answer.

      (C) Use Euler's method, starting at x = 0 with two steps of equal size, to approximate f(0.2). Show the work that leads to your answer.

      (D) Find y = f(x), the particular solution of the differential equation with the initial condition f(0) = 3.
    answer: |
      (A) At (0, 3), dy/dx = (3 − 1)(0 + 1) = 2. Tangent line: y = 3 + 2x. f(0.2) ≈ 3 + 2(0.2) = 3.4.
      (B) d²y/dx² = (dy/dx)(2x + 1) + 2(y − 1). At (0, 3): 2 · 1 + 2 · 2 = 6. Since d²y/dx² > 0 at (0, 3), the graph of f is concave up near x = 0, so the tangent line lies below the graph and 3.4 is an underestimate of f(0.2).
      (C) Step size 0.1. At (0, 3) the slope is 2, so f(0.1) ≈ 3 + 0.1(2) = 3.2. At (0.1, 3.2) the slope is (2.2)(1.2) = 2.64, so f(0.2) ≈ 3.2 + 0.1(2.64) = 3.464.
      (D) Separate: dy/(y − 1) = (2x + 1) dx. Integrate: ln|y − 1| = x² + x + C. At (0, 3): ln 2 = C. So |y − 1| = 2e^(x² + x), and since y − 1 = 2 > 0 at the initial point, y = 1 + 2e^(x² + x).
    explanation: |
      Nine points.
      (A) 2 points: 1 for the tangent line y = 3 + 2x (any equivalent form); 1 for the approximation 3.4.
      (B) 2 points: 1 for d²y/dx² = (dy/dx)(2x + 1) + 2(y − 1) and the value 6 at (0, 3); 1 for "underestimate" with the reason that the graph is concave up (d²y/dx² > 0) near x = 0. Forgetting the product rule (missing the 2(y − 1) term) loses the first point.
      (C) 1 point: Euler's method with steps of 0.1, showing the intermediate value 3.2 and the slope 2.64, ending at 3.464.
      (D) 4 points: 1 for separating the variables; 1 for the antiderivatives ln|y − 1| and x² + x; 1 for the constant of integration and using the initial condition to find C = ln 2; 1 for solving for y = 1 + 2e^(x² + x). A student who does not separate the variables earns none of these 4 points; a student who adds the constant only after solving for y earns at most 2.
  - slug: apcalcbc-final-q47
    type: long_answer
    topic_code: "8.12"
    source: "AP Calculus CED, Topic 8.12"
    points: 9
    stimulus: |
      Let R be the region in the first quadrant enclosed by the graphs of y = 2√x and y = x, which intersect at the origin and at the point (4, 4).
    prompt: |
      (No calculator.) Free-response question 5.

      (A) Find the area of R.

      (B) Find the volume of the solid generated when R is revolved about the horizontal line y = 5.

      (C) R is the base of a solid whose cross sections perpendicular to the x-axis are squares. Find the volume of the solid.

      (D) Write, but do not evaluate, an expression involving one or more integrals that gives the perimeter of R.
    answer: |
      (A) On [0, 4], 2√x ≥ x. Area = ∫ from 0 to 4 of (2√x − x) dx = [(4/3)x^(3/2) − x²/2] from 0 to 4 = 32/3 − 8 = 8/3.
      (B) The line y = 5 lies above R, so the outer radius is 5 − x (to the lower curve) and the inner radius is 5 − 2√x. V = π ∫ from 0 to 4 of ((5 − x)² − (5 − 2√x)²) dx = π ∫ from 0 to 4 of (x² − 14x + 20√x) dx = π(64/3 − 112 + 320/3) = π(128 − 112) = 16π.
      (C) The side of the square at x is 2√x − x. V = ∫ from 0 to 4 of (2√x − x)² dx = ∫ from 0 to 4 of (4x − 4x^(3/2) + x²) dx = 32 − 256/5 + 64/3 = 32/15.
      (D) The boundary is the segment of y = x from (0, 0) to (4, 4), of length 4√2, and the arc of y = 2√x. Writing that arc as x = y²/4 for 0 ≤ y ≤ 4, dx/dy = y/2, so its length is ∫ from 0 to 4 of √(1 + y²/4) dy. Perimeter = 4√2 + ∫ from 0 to 4 of √(1 + y²/4) dy. (Equivalently 4√2 + ∫ from 0 to 4 of √(1 + 1/x) dx, an improper but convergent integral.)
    explanation: |
      Nine points.
      (A) 2 points: 1 for the integral ∫ from 0 to 4 of (2√x − x) dx; 1 for 8/3.
      (B) 3 points: 1 for the constant π and the limits 0 and 4; 1 for the integrand (5 − x)² − (5 − 2√x)², with both radii measured from y = 5 and the larger one first; 1 for 16π. Using radii x and 2√x (revolving about the x-axis) earns at most the first point.
      (C) 2 points: 1 for the integral of (2√x − x)²; 1 for 32/15.
      (D) 2 points: 1 for a correct arc length integral for y = 2√x (in y as shown, or in x); 1 for adding the segment length 4√2. Forgetting the square root in the arc length integrand loses the first point.
  - slug: apcalcbc-final-q48
    type: long_answer
    topic_code: "10.13"
    source: "AP Calculus CED, Topic 10.13"
    points: 9
    stimulus: |
      The function f is defined by the power series f(x) = ∑ (n = 1 to ∞) (−1)^(n+1)(x + 1)ⁿ/(n · 4ⁿ) = (x + 1)/4 − (x + 1)²/32 + (x + 1)³/192 − ⋯ for all x at which the series converges.
    prompt: |
      (No calculator.) Free-response question 6.

      (A) Find the interval of convergence of the series. Show the work that leads to your answer, including the analysis of the endpoints.

      (B) Find the first three nonzero terms and the general term of the power series for f′(x) about x = −1.

      (C) Show that f′(x) = 1/(x + 5) for x in the open interval of convergence.

      (D) Use the second-degree Taylor polynomial for f about x = −1 to approximate f(1). Use the alternating series error bound to show that this approximation differs from f(1) by less than 1/20.
    answer: |
      (A) Ratio test: |aₙ₊₁/aₙ| = (n/(n + 1)) · |x + 1|/4 → |x + 1|/4 as n → ∞. The series converges when |x + 1|/4 < 1, that is −5 < x < 3, and diverges when |x + 1| > 4. At x = 3 the series is ∑ (−1)^(n+1)/n, the alternating harmonic series, which converges by the alternating series test (terms 1/n decrease to 0). At x = −5 the series is ∑ (−1)^(n+1)(−1)ⁿ/n = −∑ 1/n, a multiple of the harmonic series, which diverges. Interval of convergence: −5 < x ≤ 3.
      (B) Differentiating term by term: f′(x) = 1/4 − (x + 1)/16 + (x + 1)²/64 − ⋯ + (−1)^(n+1)(x + 1)^(n−1)/4ⁿ + ⋯.
      (C) The series in (B) is geometric with first term 1/4 and ratio −(x + 1)/4, which has absolute value less than 1 on −5 < x < 3. Its sum is (1/4)/(1 + (x + 1)/4) = 1/(4 + x + 1) = 1/(x + 5).
      (D) P₂(x) = (x + 1)/4 − (x + 1)²/32, so f(1) ≈ P₂(1) = 2/4 − 4/32 = 1/2 − 1/8 = 3/8. At x = 1 the series is 2/4 − 4/32 + 8/192 − ⋯ = 1/2 − 1/8 + 1/24 − ⋯, which alternates, with terms 2ⁿ/(n · 4ⁿ) = 1/(n · 2ⁿ) decreasing in absolute value to 0. By the alternating series error bound, |f(1) − 3/8| is at most the first omitted term, 1/24, and 1/24 < 1/20.
    explanation: |
      Nine points.
      (A) 3 points: 1 for setting up the ratio test and the limit |x + 1|/4; 1 for the open interval −5 < x < 3 (radius 4); 1 for both endpoint conclusions with reasons: converges at x = 3 (alternating series test) and diverges at x = −5 (harmonic series). The endpoint point needs a reason for each endpoint.
      (B) 2 points: 1 for the first three nonzero terms 1/4 − (x + 1)/16 + (x + 1)²/64; 1 for the general term (−1)^(n+1)(x + 1)^(n−1)/4ⁿ (or an equivalent with a shifted index).
      (C) 2 points: 1 for identifying the series as geometric with ratio −(x + 1)/4; 1 for the sum (1/4)/(1 + (x + 1)/4) simplified to 1/(x + 5).
      (D) 2 points: 1 for the approximation 3/8; 1 for the error bound 1/24 with the comparison 1/24 < 1/20, citing the alternating series error bound (alternating terms decreasing in absolute value to 0). Using a Lagrange bound is acceptable only with a correct bound on the third derivative.
