  - slug: apcalcbc-final-q70
    type: short_answer
    topic_code: "2.4"
    source: "AP Calculus CED, Topic 2.4"
    points: 3
    prompt: |
      Let f(x) = ax² + 1 for x ≤ 1 and f(x) = bx + 3 for x > 1, where a and b are constants. Find the values of a and b for which f is differentiable at x = 1. Show the two conditions you use.
    answer: |
      Continuity at x = 1: a(1)² + 1 = b(1) + 3, so a + 1 = b + 3. Equal one-sided derivatives at x = 1: 2a(1) = b, so b = 2a. Substituting: a + 1 = 2a + 3, so a = −2 and b = −4.
