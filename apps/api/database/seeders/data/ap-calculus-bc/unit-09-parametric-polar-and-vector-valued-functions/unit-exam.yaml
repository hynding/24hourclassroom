    answer: |
      (a) dx/dt = eᵗ and dy/dt = 2e^(2t) − 4eᵗ, so dy/dx = (2e^(2t) − 4eᵗ)/eᵗ = 2eᵗ − 4.
      (b) dy/dx = 0 when eᵗ = 2, so t = ln 2. Then x = 2 and y = 4 − 8 = −4: the point is (2, −4).
      (c) d/dt (dy/dx) = 2eᵗ, so d²y/dx² = 2eᵗ/eᵗ = 2. Since d²y/dx² = 2 > 0 for every t, the curve is concave up everywhere.
    explanation: |
      Three points, one per part. (a) dy/dx = 2eᵗ − 4 (or the unsimplified quotient). (b) The point (2, −4); giving only t = ln 2 does not earn the point. (c) d²y/dx² = 2 found by dividing d/dt (dy/dx) by dx/dt, and "concave up because d²y/dx² > 0". A student who reports d²y/dt² or forgets to divide by dx/dt does not earn the point.
  - slug: apcalcbc-u09-exam-q42
    type: short_answer
