    prompt: |
      No calculator. The circle r = 3cos θ (traced once for −π/2 ≤ θ ≤ π/2) and the limaçon r = 2 − cos θ (for 0 ≤ θ ≤ 2π) intersect at two points.

      (A) Find the polar angles θ of the two intersection points with −π/2 ≤ θ ≤ π/2. Then find the area of the region that is inside the circle and outside the limaçon.

      (B) Find the slope of the line tangent to the limaçon at the point where θ = π/2, and write an equation of that tangent line in rectangular coordinates.

      (C) A particle moves along the limaçon so that dθ/dt = 3 for all time t. Find dr/dt at the instant the particle is at θ = π/3. Is the particle moving toward or away from the pole at that instant? Give a reason.

      (D) Write, but do not evaluate, an expression involving one or more integrals for the area of the region that is inside both the circle and the limaçon.
    answer: |
      (A) 3cos θ = 2 − cos θ gives cos θ = 1/2, so θ = −π/3 and θ = π/3. On −π/3 < θ < π/3 the circle is farther from the pole. Area = (1/2)∫ from −π/3 to π/3 of (9cos²θ − (2 − cos θ)²) dθ = (1/2)∫ from −π/3 to π/3 of (8cos²θ + 4cos θ − 4) dθ = (1/2)∫ from −π/3 to π/3 of (4cos(2θ) + 4cos θ) dθ = (1/2)[2sin(2θ) + 4sin θ] from −π/3 to π/3 = (1/2)(2√3 + 4√3) = 3√3.
      (B) r = 2 − cos θ and r′ = sin θ. At θ = π/2: r = 2, r′ = 1. dy/dθ = r′ sin θ + r cos θ = 1 and dx/dθ = r′ cos θ − r sin θ = −2, so dy/dx = −1/2. The point is (x, y) = (2cos(π/2), 2sin(π/2)) = (0, 2). Tangent line: y = 2 − x/2.
      (C) dr/dt = (dr/dθ)(dθ/dt) = sin θ · 3 = 3√3/2 at θ = π/3. Because r = 2 − cos(π/3) = 3/2 > 0 and dr/dt > 0, the distance from the pole is increasing: the particle is moving away from the pole.
      (D) For |θ| ≤ π/3 the limaçon is closer to the pole; for π/3 ≤ |θ| ≤ π/2 the circle is. By symmetry about the polar axis, Area = 2[(1/2)∫ from 0 to π/3 of (2 − cos θ)² dθ + (1/2)∫ from π/3 to π/2 of 9cos²θ dθ] (which equals 9π/4 − 3√3, the circle's area minus the answer to (A)).
    explanation: |
      Nine points. (A) 1 point for θ = ±π/3; 1 point for the integral (1/2)∫ from −π/3 to π/3 of (9cos²θ − (2 − cos θ)²) dθ, with the 1/2, the difference of squares and the limits (an equivalent form using symmetry, ∫ from 0 to π/3, is fine); 1 point for 3√3. (B) 1 point for dy/dx = −1/2 using dy/dθ and dx/dθ; 1 point for the tangent line y = 2 − x/2 (or y − 2 = −(1/2)(x − 0)) at the point (0, 2). (C) 1 point for dr/dt = 3√3/2 by the chain rule; 1 point for "away from the pole because r > 0 and dr/dt > 0". (D) 1 point for the limaçon piece on 0 ≤ θ ≤ π/3 (or −π/3 to π/3) and 1 point for the circle piece on π/3 ≤ θ ≤ π/2, each with the factor 1/2 (and doubled for symmetry, or written over both symmetric intervals). An answer of 9π/4 − 3√3 with a correct expression also earns both points.
