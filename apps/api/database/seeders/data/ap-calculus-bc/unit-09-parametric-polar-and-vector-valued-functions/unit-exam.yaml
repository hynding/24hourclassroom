unit: 9
description: |
  44 questions · about 90 minutes · every topic of Unit 9 (9.1 to 9.9): defining and differentiating parametric
  equations, second derivatives and concavity of parametric curves, parametric arc length, vector-valued functions
  and their derivatives and integrals, motion along a parametric or vector path (velocity, speed, acceleration,
  displacement and total distance), polar coordinates and slopes of polar curves, and the area of a polar region
  bounded by one curve or by two curves. Includes three shared-context sets of four questions (a parametric curve, a
  particle with a vector position function and a limaçon), select-all, true/false, fill-in-the-blank and numeric
  items, two short-answer questions (3 points each) and two free-response questions in the AP style (9 points each:
  one calculator-active particle moving along a parametric path, one no-calculator question on the areas and
  tangent lines of two polar curves). Items marked (Calculator.) need a graphing calculator; the rest are meant to
  be done by hand. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
  items are matched automatically; the short answers and free-response items are graded by your teacher against
  the scoring notes.
questions:
  # ---- Stimulus set A: a parametric curve (9.1, 9.2, 9.3)
  - slug: apcalcbc-u09-exam-q01
    type: multiple_choice
    topic_code: "9.1"
    source: "AP Calculus CED, Topic 9.1"
    points: 1
    stimulus: |
      A curve C is defined by the parametric equations x(t) = t² − 1 and y(t) = t³ − 3t for all real t.
    prompt: |
      What is the slope of the line tangent to C at the point where t = 2?
    options:
      - "4/9"
      - "9"
      - "9/4"
      - "3"
    option_explanations:
      - |
        4/9 is (dx/dt)/(dy/dt), the reciprocal of the slope. The slope of the curve is dy/dx = (dy/dt)/(dx/dt).
      - |
        9 is dy/dt = 3(2)² − 3 at t = 2 alone; it is the rate of change of y with respect to t, not with respect to x.
      - |
        Correct. dy/dt = 3t² − 3 = 9 and dx/dt = 2t = 4 at t = 2, so dy/dx = (dy/dt)/(dx/dt) = 9/4.
      - |
        3 comes from dropping the −3 in dy/dt (using 3t² = 12) and dividing by dx/dt = 4; the constant multiple of t in y also contributes to dy/dt.
    answer: 2
  - slug: apcalcbc-u09-exam-q02
    type: multiple_choice
    topic_code: "9.1"
    source: "AP Calculus CED, Topic 9.1"
    points: 1
    stimulus: |
      A curve C is defined by the parametric equations x(t) = t² − 1 and y(t) = t³ − 3t for all real t.
    prompt: |
      At which points (x, y) does C have a horizontal tangent line?
    options:
      - "(0, −2) and (0, 2)"
      - "(−1, 0) only"
      - "(1, −2) and (−1, 2)"
      - "(0, −2), (0, 2) and (−1, 0)"
    option_explanations:
      - |
        Correct. dy/dt = 3t² − 3 = 0 at t = ±1, where dx/dt = 2t = ±2 ≠ 0. At t = 1 the point is (0, −2); at t = −1 it is (0, 2).
      - |
        (−1, 0) is where dx/dt = 2t = 0 (t = 0) while dy/dt = −3 ≠ 0: that is a vertical tangent, not a horizontal one.
      - |
        These pair the parameter values t = 1 and t = −1 with the y-values; the x-coordinate must be computed from x(t) = t² − 1, which is 0 for both.
      - |
        This list includes (−1, 0), where dx/dt = 0 and the tangent is vertical; a horizontal tangent needs dy/dt = 0 with dx/dt ≠ 0.
    answer: 0
  - slug: apcalcbc-u09-exam-q03
    type: multiple_choice
    topic_code: "9.2"
    source: "AP Calculus CED, Topic 9.2"
    points: 1
    stimulus: |
      A curve C is defined by the parametric equations x(t) = t² − 1 and y(t) = t³ − 3t for all real t.
    prompt: |
      What is the value of d²y/dx² at t = 2?
    options:
      - "15/8"
      - "6"
      - "15/2"
      - "15/32"
    option_explanations:
      - |
        15/8 is d/dt (dy/dx) at t = 2, with dy/dx = (3t² − 3)/(2t). It still has to be divided by dx/dt = 4.
      - |
        6 is (d²y/dt²)/(d²x/dt²) = 6t/2 at t = 2. The second derivative of a parametric curve is not a ratio of second derivatives.
      - |
        15/2 multiplies d/dt (dy/dx) = 15/8 by dx/dt = 4 instead of dividing by it.
      - |
        Correct. dy/dx = (3t² − 3)/(2t) = (3/2)(t − 1/t), so d/dt (dy/dx) = (3/2)(1 + 1/t²) = 15/8 at t = 2. Then d²y/dx² = (15/8)/(dx/dt) = (15/8)/4 = 15/32.
    answer: 3
  - slug: apcalcbc-u09-exam-q04
    type: multiple_choice
    topic_code: "9.3"
    source: "AP Calculus CED, Topic 9.3"
    points: 1
    stimulus: |
      A curve C is defined by the parametric equations x(t) = t² − 1 and y(t) = t³ − 3t for all real t.
    prompt: |
      Which expression gives the length of C from t = 0 to t = 2?
    options:
      - "∫ from 0 to 2 of √((t² − 1)² + (t³ − 3t)²) dt"
      - "∫ from 0 to 2 of √(4t² + (3t² − 3)²) dt"
      - "∫ from 0 to 2 of √(1 + ((3t² − 3)/(2t))²) dt"
      - "∫ from 0 to 2 of (2t + 3t² − 3) dt"
    option_explanations:
      - |
        This uses x(t) and y(t) themselves. Arc length adds the speed √((dx/dt)² + (dy/dt)²), which is built from the derivatives.
      - |
        Correct. dx/dt = 2t and dy/dt = 3t² − 3, so the length is ∫ from 0 to 2 of √((2t)² + (3t² − 3)²) dt.
      - |
        √(1 + (dy/dx)²) is the integrand for a curve y = f(x) integrated with respect to x. With dt, the factor dx/dt is missing (and dx/dt = 0 at t = 0, so the integrand is not even defined there).
      - |
        This adds dx/dt and dy/dt without squaring and taking the root, which is not the length of the velocity vector.
    answer: 1
  # ---- Stimulus set B: a particle with a vector position function (9.4, 9.6)
  - slug: apcalcbc-u09-exam-q05
    type: multiple_choice
    topic_code: "9.4"
    source: "AP Calculus CED, Topic 9.4"
    points: 1
    stimulus: |
      A particle moves in the xy-plane so that its position at time t ≥ 0 is r(t) = ⟨t³ − 3t², 2t² − 8t⟩.
    prompt: |
      What is the velocity vector of the particle at t = 3?
    options:
      - "⟨0, −6⟩"
      - "⟨9, 4⟩"
      - "⟨12, 4⟩"
      - "⟨21, 4⟩"
    option_explanations:
      - |
        ⟨0, −6⟩ is the position r(3) = ⟨27 − 27, 18 − 24⟩; the velocity is the derivative of the position.
      - |
        Correct. v(t) = r′(t) = ⟨3t² − 6t, 4t − 8⟩, so v(3) = ⟨27 − 18, 12 − 8⟩ = ⟨9, 4⟩.
      - |
        ⟨12, 4⟩ is the acceleration a(3) = ⟨6t − 6, 4⟩ at t = 3, one derivative too many.
      - |
        ⟨21, 4⟩ differentiates 3t² as 6 instead of 6t, giving x′(t) = 3t² − 6 and x′(3) = 21.
    answer: 1
  - slug: apcalcbc-u09-exam-q06
    type: numeric
    topic_code: "9.6"
    source: "AP Calculus CED, Topic 9.6"
    points: 1
    stimulus: |
      A particle moves in the xy-plane so that its position at time t ≥ 0 is r(t) = ⟨t³ − 3t², 2t² − 8t⟩.
    prompt: |
      What is the speed of the particle at t = 1?
    answer: { value: 5, tolerance: 0.001 }
    explanation: |
      v(1) = ⟨3 − 6, 4 − 8⟩ = ⟨−3, −4⟩, so the speed is |v(1)| = √(9 + 16) = 5.
  - slug: apcalcbc-u09-exam-q07
    type: multiple_choice
    topic_code: "9.6"
    source: "AP Calculus CED, Topic 9.6"
    points: 1
    stimulus: |
      A particle moves in the xy-plane so that its position at time t ≥ 0 is r(t) = ⟨t³ − 3t², 2t² − 8t⟩.
    prompt: |
      At what time or times t ≥ 0 is the particle at rest?
    options:
      - "t = 0 and t = 2"
      - "t = 0 only"
      - "t = 1 only"
      - "t = 2 only"
    option_explanations:
      - |
        x′(t) = 3t(t − 2) is 0 at both t = 0 and t = 2, but at t = 0 the vertical velocity is y′(0) = −8 ≠ 0, so the particle is moving then.
      - |
        At t = 0, x′(0) = 0 but y′(0) = −8, so the particle is moving straight down, not at rest.
      - |
        t = 1 is where the horizontal acceleration 6t − 6 is 0; rest requires both velocity components to be 0.
      - |
        Correct. At rest means v(t) = ⟨0, 0⟩. y′(t) = 4t − 8 = 0 only at t = 2, and x′(2) = 12 − 12 = 0 too, so t = 2 is the only time.
    answer: 3
  - slug: apcalcbc-u09-exam-q08
    type: multiple_choice
    topic_code: "9.6"
    source: "AP Calculus CED, Topic 9.6"
    points: 1
    stimulus: |
      A particle moves in the xy-plane so that its position at time t ≥ 0 is r(t) = ⟨t³ − 3t², 2t² − 8t⟩.
    prompt: |
      Is the speed of the particle increasing or decreasing at t = 1, and why?
    options:
      - "Decreasing, because v(1) · a(1) = −16 < 0"
      - "Increasing, because a(1) = ⟨0, 4⟩ has a positive component"
      - "Decreasing, because x′(1) = −3 < 0"
      - "Increasing, because the speed at t = 1 is 5 > 0"
    option_explanations:
      - |
        Correct. v(1) = ⟨−3, −4⟩ and a(1) = ⟨0, 4⟩, so v(1) · a(1) = 0 − 16 = −16. A negative dot product means the acceleration opposes the motion and the speed is decreasing.
      - |
        A positive acceleration component does not by itself increase the speed; here it points against the downward velocity component, and the dot product with v is negative.
      - |
        The sign of x′ tells only that the particle moves left; speed changes according to the sign of v · a, not the sign of one velocity component.
      - |
        A speed is never negative, so speed > 0 says nothing about whether it is increasing; that depends on the sign of v · a.
    answer: 0
  # ---- Stimulus set C: a limaçon (9.7, 9.8)
  - slug: apcalcbc-u09-exam-q09
    type: multiple_choice
    topic_code: "9.7"
    source: "AP Calculus CED, Topic 9.7"
    points: 1
    stimulus: |
      The polar curve r = 3 + 2cos θ, for 0 ≤ θ ≤ 2π, is a limaçon that does not pass through the pole.
    prompt: |
      What are the rectangular coordinates (x, y) of the point on the curve where θ = 2π/3?
    options:
      - "(√3, −1)"
      - "(2, 2π/3)"
      - "(−1, √3)"
      - "(−2, 2√3)"
    option_explanations:
      - |
        (√3, −1) swaps the formulas; x = r cos θ and y = r sin θ, with r = 2: x = 2(−1/2) = −1, y = 2(√3/2) = √3.
      - |
        (2, 2π/3) is the point's polar form (r, θ), not its rectangular coordinates.
      - |
        Correct. r = 3 + 2cos(2π/3) = 3 − 1 = 2, so x = 2cos(2π/3) = −1 and y = 2sin(2π/3) = √3.
      - |
        (−2, 2√3) uses r = 4, from a sign slip cos(2π/3) = +1/2; cos(2π/3) is −1/2, so r = 2.
    answer: 2
  - slug: apcalcbc-u09-exam-q10
    type: multiple_choice
    topic_code: "9.7"
    source: "AP Calculus CED, Topic 9.7"
    points: 1
    stimulus: |
      The polar curve r = 3 + 2cos θ, for 0 ≤ θ ≤ 2π, is a limaçon that does not pass through the pole.
    prompt: |
      What is the slope dy/dx of the curve at the point where θ = π/2?
    options:
      - "2/3"
      - "3/2"
      - "−2"
      - "−2/3"
    option_explanations:
      - |
        Correct. With r′ = dr/dθ = −2sin θ, dy/dx = (r′ sin θ + r cos θ)/(r′ cos θ − r sin θ). At θ = π/2, r = 3 and r′ = −2: dy/dx = (−2 + 0)/(0 − 3) = 2/3.
      - |
        3/2 is (dx/dθ)/(dy/dθ), the reciprocal of the slope.
      - |
        −2 is dr/dθ at θ = π/2, the rate of change of r with respect to θ; the slope of the curve is (dy/dθ)/(dx/dθ).
      - |
        −2/3 drops the minus sign in dx/dθ = r′ cos θ − r sin θ, writing the denominator as +3.
    answer: 0
  - slug: apcalcbc-u09-exam-q11
    type: multiple_choice
    topic_code: "9.7"
    source: "AP Calculus CED, Topic 9.7"
    points: 1
    stimulus: |
      The polar curve r = 3 + 2cos θ, for 0 ≤ θ ≤ 2π, is a limaçon that does not pass through the pole.
    prompt: |
      Which statement about the curve at θ = π/3 is true?
    options:
      - "dr/dθ = √3, so the point on the curve is moving away from the pole as θ increases."
      - "dr/dθ = −√3, so the point on the curve is moving toward the pole as θ increases."
      - "dr/dθ = −√3, so the curve is decreasing (its slope dy/dx is negative) there."
      - "dr/dθ = 4, so the point on the curve is 4 units from the pole."
    option_explanations:
      - |
        This drops the minus sign in the derivative of cos θ; dr/dθ = −2sin θ = −√3, which is negative.
      - |
        Correct. dr/dθ = −2sin(π/3) = −√3 < 0, so r (the distance from the pole, since r > 0) is decreasing: the point moves toward the pole.
      - |
        dr/dθ describes how the distance from the pole changes, not the slope of the curve in the xy-plane, which needs the full dy/dx formula.
      - |
        4 is r(π/3) = 3 + 2(1/2), the distance from the pole, not the derivative dr/dθ.
    answer: 1
  - slug: apcalcbc-u09-exam-q12
    type: multiple_choice
    topic_code: "9.8"
    source: "AP Calculus CED, Topic 9.8"
    points: 1
    stimulus: |
      The polar curve r = 3 + 2cos θ, for 0 ≤ θ ≤ 2π, is a limaçon that does not pass through the pole.
    prompt: |
      What is the area of the region enclosed by the curve?
    options:
      - "22π"
      - "13π"
      - "11π/2"
      - "11π"
    option_explanations:
      - |
        22π is ∫ from 0 to 2π of r² dθ without the factor 1/2 from the area of a sector, (1/2)r² Δθ.
      - |
        13π treats cos²θ as 1: (1/2)∫ from 0 to 2π of (9 + 12cos θ + 4) dθ = 13π. Over a full period cos²θ averages 1/2.
      - |
        11π/2 integrates only from 0 to π, which traces the upper half of the curve.
      - |
        Correct. Area = (1/2)∫ from 0 to 2π of (3 + 2cos θ)² dθ = (1/2)∫ from 0 to 2π of (9 + 12cos θ + 4cos²θ) dθ = (1/2)(18π + 0 + 4π) = 11π.
    answer: 3
  # ---- Single items
  - slug: apcalcbc-u09-exam-q13
    type: multiple_choice
    topic_code: "9.1"
    source: "AP Calculus CED, Topic 9.1"
    points: 1
    prompt: |
      A curve is given by x = 2 + 3cos t and y = −1 + 3sin t for 0 ≤ t ≤ 2π. Which rectangular equation describes the curve?
    options:
      - "(x + 2)² + (y − 1)² = 9"
      - "(x − 2)² + (y + 1)² = 3"
      - "(x − 2)² + (y + 1)² = 9"
      - "x² + y² = 9"
    option_explanations:
      - |
        The signs of the center are reversed. From x − 2 = 3cos t and y + 1 = 3sin t, the center is (2, −1).
      - |
        The radius is 3, so the right side is 3² = 9: (3cos t)² + (3sin t)² = 9(cos²t + sin²t) = 9.
      - |
        Correct. cos t = (x − 2)/3 and sin t = (y + 1)/3, and cos²t + sin²t = 1 gives (x − 2)² + (y + 1)² = 9, a circle of radius 3 centered at (2, −1).
      - |
        x² + y² = 9 ignores the shifts 2 and −1 added to the cosine and sine terms; that circle is centered at the origin.
    answer: 2
  - slug: apcalcbc-u09-exam-q14
    type: multiple_choice
    topic_code: "9.1"
    source: "AP Calculus CED, Topic 9.1"
    points: 1
    prompt: |
      A curve is given by x = e^(2t) and y = sin(πt). Which is an equation of the line tangent to the curve at t = 0?
    options:
      - "y = (π/2)(x − 1)"
      - "y = (2/π)(x − 1)"
      - "y = (π/2)x"
      - "y = π(x − 1)"
    option_explanations:
      - |
        Correct. At t = 0 the point is (e⁰, sin 0) = (1, 0). dy/dt = π cos(πt) = π and dx/dt = 2e^(2t) = 2, so the slope is π/2 and the line is y = (π/2)(x − 1).
      - |
        2/π is (dx/dt)/(dy/dt), the reciprocal of the slope.
      - |
        The slope π/2 is right, but the line must pass through the point (1, 0), where x = e⁰ = 1, not through the origin.
      - |
        π comes from forgetting the chain-rule factor 2 in dx/dt = 2e^(2t), taking dx/dt = 1.
    answer: 0
  - slug: apcalcbc-u09-exam-q15
    type: multiple_choice
    topic_code: "9.2"
    source: "AP Calculus CED, Topic 9.2"
    points: 1
    prompt: |
      A curve is given by x = 3 − 2t and y = t³ − 3t for all real t. For which values of t is the curve concave up?
    options:
      - "Exactly when t < 0"
      - "Exactly when t > 0"
      - "Exactly when |t| > 1"
      - "Exactly when |t| < 1"
    option_explanations:
      - |
        This uses d/dt (dy/dx) = −3t without dividing by dx/dt = −2. Because dx/dt is negative, skipping the division reverses the sign.
      - |
        Correct. dy/dx = (3t² − 3)/(−2), so d/dt (dy/dx) = −3t and d²y/dx² = (−3t)/(−2) = 3t/2, which is positive exactly when t > 0.
      - |
        |t| > 1 is where dy/dt = 3t² − 3 is positive; the sign of dy/dt is not the concavity of the curve.
      - |
        |t| < 1 is where dy/dx = −(3t² − 3)/2 is positive, which tells where the curve rises as x increases, not where it is concave up.
    answer: 1
  - slug: apcalcbc-u09-exam-q16
    type: multiple_choice
    topic_code: "9.3"
    source: "AP Calculus CED, Topic 9.3"
    points: 1
    prompt: |
      What is the length of the curve x = t², y = t³/3 from t = 0 to t = √5?
    options:
      - "38/3"
      - "9"
      - "5 + 5√5/3"
      - "19/3"
    option_explanations:
      - |
        38/3 drops the 1/2 in the substitution u = 4 + t², du = 2t dt; the antiderivative of t√(4 + t²) is (1/3)(4 + t²)^(3/2), not (2/3)(4 + t²)^(3/2).
      - |
        9 evaluates (1/3)(4 + t²)^(3/2) only at the upper limit, (1/3)(27), and forgets to subtract the value 8/3 at t = 0.
      - |
        5 + 5√5/3 is ∫ from 0 to √5 of (2t + t²) dt, adding dx/dt and dy/dt instead of taking the length of the velocity vector.
      - |
        Correct. √((2t)² + (t²)²) = t√(4 + t²) for t ≥ 0, so L = ∫ from 0 to √5 of t√(4 + t²) dt = (1/3)(4 + t²)^(3/2) from 0 to √5 = (27 − 8)/3 = 19/3.
    answer: 3
  - slug: apcalcbc-u09-exam-q17
    type: multiple_choice
    topic_code: "9.4"
    source: "AP Calculus CED, Topic 9.4"
    points: 1
    prompt: |
      For the vector-valued function r(t) = ⟨e^(2t), ln(t + 1)⟩, what is r″(0)?
    options:
      - "⟨4, 1⟩"
      - "⟨2, −1⟩"
      - "⟨4, −1⟩"
      - "⟨2, 1⟩"
    option_explanations:
      - |
        The second component has the wrong sign: d/dt [1/(t + 1)] = −1/(t + 1)², which is −1 at t = 0.
      - |
        ⟨2, −1⟩ applies the chain-rule factor 2 only once to e^(2t); the second derivative of e^(2t) is 4e^(2t).
      - |
        Correct. r′(t) = ⟨2e^(2t), 1/(t + 1)⟩ and r″(t) = ⟨4e^(2t), −1/(t + 1)²⟩, so r″(0) = ⟨4, −1⟩.
      - |
        ⟨2, 1⟩ is r′(0), the first derivative; the question asks for the second derivative.
    answer: 2
  - slug: apcalcbc-u09-exam-q18
    type: multiple_choice
    topic_code: "9.5"
    source: "AP Calculus CED, Topic 9.5"
    points: 1
    prompt: |
      Evaluate ∫ from 0 to 1 of ⟨4t³, π cos(πt/2)⟩ dt.
    options:
      - "⟨1, 2⟩"
      - "⟨1, π⟩"
      - "⟨1, π²/2⟩"
      - "3"
    option_explanations:
      - |
        Correct. Integrate each component: ∫ from 0 to 1 of 4t³ dt = 1, and ∫ from 0 to 1 of π cos(πt/2) dt = π · (2/π) sin(πt/2) from 0 to 1 = 2. The result is the vector ⟨1, 2⟩.
      - |
        ⟨1, π⟩ forgets to divide by the inner derivative π/2 when antidifferentiating cos(πt/2).
      - |
        ⟨1, π²/2⟩ multiplies by the inner derivative π/2 instead of dividing by it.
      - |
        3 adds the two components; the integral of a vector-valued function is a vector, found component by component.
    answer: 0
  - slug: apcalcbc-u09-exam-q19
    type: multiple_choice
    topic_code: "9.5"
    source: "AP Calculus CED, Topic 9.5"
    points: 1
    prompt: |
      A particle's velocity is v(t) = ⟨2t + 1, 3t² − 4⟩, and its position at t = 0 is ⟨1, −2⟩. What is its position at t = 2?
    options:
      - "⟨6, 0⟩"
      - "⟨5, 8⟩"
      - "⟨5, 2⟩"
      - "⟨7, −2⟩"
    option_explanations:
      - |
        ⟨6, 0⟩ is the displacement ∫ from 0 to 2 of v(t) dt; the initial position ⟨1, −2⟩ must be added.
      - |
        ⟨5, 8⟩ is the velocity v(2), not the position.
      - |
        ⟨5, 2⟩ subtracts the initial position from the displacement instead of adding it.
      - |
        Correct. ∫ from 0 to 2 of v(t) dt = ⟨t² + t, t³ − 4t⟩ from 0 to 2 = ⟨6, 0⟩, so r(2) = ⟨1, −2⟩ + ⟨6, 0⟩ = ⟨7, −2⟩.
    answer: 3
  - slug: apcalcbc-u09-exam-q20
    type: multiple_choice
    topic_code: "9.6"
    source: "AP Calculus CED, Topic 9.6"
    points: 1
    prompt: |
      (Calculator.) A particle moves in the plane with velocity v(t) = ⟨ln(1 + t²), 2cos t⟩. What is the total distance the particle travels from t = 0 to t = 2?
    options:
      - "2.315"
      - "3.040"
      - "3.252"
