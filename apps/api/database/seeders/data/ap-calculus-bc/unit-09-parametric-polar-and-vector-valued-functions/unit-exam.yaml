      Three points, one per part. (a) v(t) = ⟨3t² − 3, 4 − 2t⟩ with both constants from v(0). (b) r(t) = ⟨t³ − 3t, 1 + 4t − t²⟩ with both constants from r(0). (c) (−2, 4) with the reason x′(1) = 0 and y′(1) ≠ 0. Omitting the check that y′(1) ≠ 0 loses the point only if the answer is not otherwise justified.
