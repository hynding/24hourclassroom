  # ---- Short answer
  - slug: apcalcbc-u09-exam-q41
    type: short_answer
    topic_code: "9.2"
    source: "AP Calculus CED, Topic 9.2"
    points: 3
    prompt: |
      A curve is given by x = eᵗ and y = e^(2t) − 4eᵗ for all real t.

      (a) Find dy/dx in terms of t.
      (b) Find the point (x, y) where the curve has a horizontal tangent line.
