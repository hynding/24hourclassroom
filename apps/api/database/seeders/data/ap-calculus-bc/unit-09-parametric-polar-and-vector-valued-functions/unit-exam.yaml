      (b) r(t) = ⟨t³ − 3t + D₁, 4t − t² + D₂⟩ with r(0) = ⟨0, 1⟩, so r(t) = ⟨t³ − 3t, 1 + 4t − t²⟩.
      (c) The motion is vertical when x′(t) = 3t² − 3 = 0 and y′(t) ≠ 0. For t > 0 that is t = 1, where y′(1) = 2 ≠ 0. The position is r(1) = ⟨1 − 3, 1 + 4 − 1⟩ = (−2, 4).
