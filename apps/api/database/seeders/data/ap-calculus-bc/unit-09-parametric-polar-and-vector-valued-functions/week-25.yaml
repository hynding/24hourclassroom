      answer: { value: 1, tolerance: 0 }
      explanation: |
        By parts, ∫ x e^(−x) dx = −x e^(−x) − e^(−x). From 0 to b this is (−b e^(−b) − e^(−b)) − (0 − 1). As b → ∞, b e^(−b) → 0 and e^(−b) → 0, so the integral converges to 1.
