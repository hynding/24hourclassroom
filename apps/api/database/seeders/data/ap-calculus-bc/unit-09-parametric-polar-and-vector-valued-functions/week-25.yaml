        Six points. (A) 1 point for ⟨−4, 2⟩. (B) 1 point for the algebra showing the speed is 1 + t²; 1 point for ∫ from 0 to 3 of (1 + t²) dt = 12. (C) 1 point for (−6, 10) with the initial position used. (D) 1 point for 1 < t ≤ 3 and the vertical tangent at t = 1 with x′ = 0, y′ ≠ 0. (E) 1 point for "increasing" justified by the derivative of the speed (or the dot product) being positive; a positive speed alone does not earn the point.
