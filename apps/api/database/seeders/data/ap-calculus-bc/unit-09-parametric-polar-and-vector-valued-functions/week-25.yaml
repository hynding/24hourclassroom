        (B) (1 − t²)² + (2t)² = 1 − 2t² + t⁴ + 4t² = (1 + t²)², so the speed is √((1 + t²)²) = 1 + t². Distance = ∫ from 0 to 3 of (1 + t²) dt = 3 + 9 = 12.
