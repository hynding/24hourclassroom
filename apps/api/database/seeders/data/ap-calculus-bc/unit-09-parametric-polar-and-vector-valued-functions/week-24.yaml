      source: "AP Calculus CED, Topics 9.1–9.3"
      points: 6
      prompt: |
        A curve C is defined by x(t) = t²/2 and y(t) = (1/3)(2t + 1)^(3/2) for 0 ≤ t ≤ 4.

        (A) Find dy/dx in terms of t, and write an equation of the line tangent to C at t = 4.

        (B) Find d²y/dx² in terms of t. Is C concave up or concave down at t = 4? Justify.

        (C) Show that (dx/dt)² + (dy/dt)² = (t + 1)², and find the length of C.

        (D) Does C have a horizontal tangent line at any point with 0 < t ≤ 4? Justify.
      answer: |
        (A) dx/dt = t and dy/dt = (1/3)(3/2)(2t + 1)^(1/2)(2) = √(2t + 1), so dy/dx = √(2t + 1)/t. At t = 4 the point is (8, 9) and the slope is 3/4: y − 9 = (3/4)(x − 8).
        (B) d/dt [√(2t + 1)/t] = [t/√(2t + 1) − √(2t + 1)]/t² = −(t + 1)/(t²√(2t + 1)). Divide by dx/dt = t: d²y/dx² = −(t + 1)/(t³√(2t + 1)). At t = 4 this is −5/192 < 0, so C is concave down at t = 4.
        (C) t² + (√(2t + 1))² = t² + 2t + 1 = (t + 1)². So L = ∫ from 0 to 4 of √((t + 1)²) dt = ∫ from 0 to 4 of (t + 1) dt = 8 + 4 = 12.
        (D) No. A horizontal tangent needs dy/dt = 0, but dy/dt = √(2t + 1) ≥ 1 > 0 for all t in the interval.
      explanation: |
        Six points. (A) 1 point for dy/dx = √(2t + 1)/t; 1 point for the tangent line through (8, 9) with slope 3/4. (B) 1 point for d²y/dx² (any equivalent form, including the division by dx/dt) and the conclusion concave down from its negative value at t = 4. (C) 1 point for the algebra showing the sum of squares is (t + 1)²; 1 point for the integral ∫ from 0 to 4 of (t + 1) dt and the value 12 (√((t + 1)²) = t + 1 because t + 1 > 0). (D) 1 point for "no" with dy/dt = √(2t + 1) never zero.
