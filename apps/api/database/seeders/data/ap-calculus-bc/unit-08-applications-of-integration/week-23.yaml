week: 23
unit: 8
title: "Arc Length and Distance Along a Curve"
topics: ["8.13"]
guide: guides/week-23.md
guide_description: |
  The arc length of a smooth curve y = f(x), L = ∫ from a to b of √(1 + (f′(x))²) dx, built from chord lengths and the
  Mean Value Theorem; the same formula for x = g(y) with limits in y; exact lengths when 1 + (f′)² is linear or a
  perfect square; rewriting a curve with a vertical tangent as x = g(y); calculator evaluation when there is no
  elementary antiderivative; arc length as distance traveled along a curve; and sums of chords as underestimates.
  Worked examples: the line y = 2x + 1 checked against the distance formula, y = (2/3)x^(3/2), y = x³/6 + 1/(2x),
  x = y²/4 − (1/2) ln y, y = x^(2/3) rewritten in y, one arch of y = sin x with a calculator, and a hypothetical ski run.
flashcards_description: |
  30 cards on the arc length formula and where it comes from, arc length for x = g(y), the perfect-square and linear
  patterns that give exact lengths, smoothness and vertical tangents, calculator setups, distance traveled along a
  curve, chord sums, and how shifts, reflections and stretches change length, with three error-spot cards.

flashcards:
  - front: Arc length of y = f(x) from x = a to x = b → formula and hypothesis
    back: |
      L = ∫ from a to b of √(1 + (f′(x))²) dx, for f with a continuous derivative on [a, b] (a smooth curve).
    topic_code: "8.13"
  - front: Arc length of x = g(y) from y = c to y = d → formula
    back: |
      L = ∫ from c to d of √(1 + (g′(y))²) dy, with c and d the y-values at the ends of the curve.
    topic_code: "8.13"
  - front: Arc length formula → where the square root comes from
    back: |
      A small chord has length √(Δx² + Δy²) = √(1 + (Δy/Δx)²) Δx by the Pythagorean theorem; Δy/Δx becomes f′(x) in the limit.
    topic_code: "8.13"
  - front: Arc length derivation → role of the Mean Value Theorem
    back: |
      On each small piece, Δy/Δx = f′(cₖ) for some cₖ in the piece, so the sum of chord lengths is exactly a Riemann sum for √(1 + (f′)²).
    topic_code: "8.13"
  - front: Arc length element ds for y = f(x) → expression
    back: |
      ds = √(1 + (dy/dx)²) dx, the length of a tiny piece of the curve; L = ∫ ds.
    topic_code: "8.13"
  - front: Arc length of y = f(x) on [a, b] compared with b − a → inequality and reason
    back: |
      L ≥ b − a, because the integrand √(1 + (f′)²) is at least 1. Equality only for a horizontal segment.
    topic_code: "8.13"
  - front: Arc length compared with the straight-line distance between the endpoints → which is larger
    back: |
      The arc length is at least the straight-line distance; they are equal only when the curve is a segment.
    topic_code: "8.13"
  - front: Line y = 2x + 1 from x = 0 to x = 3 → arc length, two ways
    back: |
      ∫₀³ √(1 + 4) dx = 3√5; the distance from (0, 1) to (3, 7) is √(9 + 36) = 3√5.
    topic_code: "8.13"
  - front: y = (2/3)x^(3/2) → simplified arc length integrand
    back: |
      f′(x) = √x, so √(1 + (f′)²) = √(1 + x), which integrates to (2/3)(1 + x)^(3/2).
    topic_code: "8.13"
  - front: y = (2/3)x^(3/2) from x = 0 to x = 3 → length
    back: |
      ∫₀³ √(1 + x) dx = (2/3)(8 − 1) = 14/3.
    topic_code: "8.13"
  - front: Perfect-square pattern for exact arc lengths → when it works
    back: |
      If f′ = A − B with AB = 1/4, then 1 + (f′)² = (A + B)², so the square root is |A + B|.
    topic_code: "8.13"
  - front: y = x³/6 + 1/(2x) → 1 + (y′)² as a perfect square
    back: |
      y′ = x²/2 − 1/(2x²), and 1 + (y′)² = (x²/2 + 1/(2x²))².
    topic_code: "8.13"
  - front: y = x³/6 + 1/(2x) from x = 1 to x = 2 → length
    back: |
      ∫₁² (x²/2 + 1/(2x²)) dx = [x³/6 − 1/(2x)] from 1 to 2 = 17/12.
    topic_code: "8.13"
  - front: x = y²/4 − (1/2) ln y from y = 1 to y = e → length
    back: |
      dx/dy = y/2 − 1/(2y), so the integrand is y/2 + 1/(2y); L = [y²/4 + (1/2) ln y] from 1 to e = (e² + 1)/4.
    topic_code: "8.13"
  - front: y = x^(2/3) from x = 0 to x = 8 → why rewrite it as x = y^(3/2)
    back: |
      f′(x) = (2/3)x^(−1/3) is undefined at x = 0 (vertical tangent), so the x-integral is improper; in y, g′(y) = (3/2)√y is continuous on [0, 4].
    topic_code: "8.13"
  - front: x = y^(3/2) from y = 0 to y = 4 → length
    back: |
      ∫₀⁴ √(1 + (9/4)y) dy = (8/27)(10√10 − 1) ≈ 9.073.
    topic_code: "8.13"
  - front: Smooth curve, for arc length purposes → meaning
    back: |
      The defining function has a continuous derivative on the interval: no corners, cusps or vertical tangents there.
    topic_code: "8.13"
  - front: Curve with a corner at x = c, such as y = |x − c| → how to find its length
    back: |
      Split the integral at x = c and add the lengths of the two smooth pieces.
    topic_code: "8.13"
  - front: (Calculator.) Length of y = x³ from x = 0 to x = 1 → setup and value
    back: |
      ∫₀¹ √(1 + 9x⁴) dx ≈ 1.548. No elementary antiderivative, so use the calculator.
    topic_code: "8.13"
  - front: (Calculator.) Length of one arch of y = sin x → setup and value
    back: |
      ∫ from 0 to π of √(1 + cos²x) dx ≈ 3.820 (the area under the arch is 2; do not confuse them).
    topic_code: "8.13"
  - front: Arc length questions on the AP exam → what earns the setup point
    back: |
      The correct integrand √(1 + (f′)²) with the correct limits in the correct variable; the value then comes from the calculator to three decimal places.
    topic_code: "8.13"
  - front: Object moving along a curve from one end to the other without doubling back → distance traveled
    back: |
      The arc length of the curve between the two points. The speed changes only how long the trip takes.
    topic_code: "8.13"
  - front: Hypothetical ski run y = 40 − 0.1x², 0 ≤ x ≤ 20 meters → distance skied
    back: |
      ∫₀²⁰ √(1 + 0.04x²) dx ≈ 46.468 meters, a little more than the straight-line distance √(20² + 40²) ≈ 44.721 meters.
    topic_code: "8.13"
  - front: Sum of chord lengths through points on a curve → over or under the arc length?
    back: |
      An underestimate: each chord is shorter than the arc it spans. More points give a closer estimate.
    topic_code: "8.13"
  - front: Shifting a graph up by 5 or reflecting it in the x-axis → effect on its arc length
    back: |
      None. Both leave (f′)² unchanged, so the integrand and the length are the same.
    topic_code: "8.13"
  - front: Stretching a graph vertically, y = 2f(x) → effect on its arc length
    back: |
      The length changes, but it is not doubled in general: the integrand becomes √(1 + 4(f′)²). (A horizontal segment keeps its length.)
    topic_code: "8.13"
  - front: y = eˣ on [0, 1] and y = ln x on [1, e] → their lengths
    back: |
      Equal. The curves are reflections of each other across y = x, and reflection preserves length; both integrals are about 2.003.
    topic_code: "8.13"
  - front: Error-spot → arc length of y = x³ written as ∫₀¹ √(1 + 3x²) dx
    back: |
      The derivative 3x² was not squared. The integrand is √(1 + (3x²)²) = √(1 + 9x⁴).
    topic_code: "8.13"
  - front: Error-spot → length of x = y³ for 0 ≤ y ≤ 2 written as ∫₀⁸ √(1 + 9y⁴) dy
    back: |
      The limits are x-values. With dy the limits must be y-values: ∫₀² √(1 + 9y⁴) dy.
    topic_code: "8.13"
  - front: Error-spot → length of y = sin x on [0, π] given as 2
    back: |
      2 is the area under the arch, ∫ sin x dx. The length is ∫ √(1 + cos²x) dx ≈ 3.820.
    topic_code: "8.13"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topic 8.13: arc length of y = f(x) and x = g(y), exact
    lengths from perfect squares, calculator lengths, and distance traveled along a curve), with 8 questions (33%)
    reviewing weeks 6, 17, 20, 21 and 22 (the chain rule, improper integrals, Euler's method, logistic models, average
    value and volumes by discs and washers). Opens with a shared-context set on one function whose arc length simplifies.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes. Items
    marked "(Calculator.)" need a graphing calculator; the rest do not.
  questions:
    # ---- Stimulus set: f(x) = (1/3)(x² + 2)^(3/2) (3.1, 8.13, 8.1)
    - slug: apcalcbc-u08-w23-q01
      type: multiple_choice
      topic_code: "3.1"
      source: "AP Calculus CED, Topic 3.1"
      points: 1
      stimulus: |
        Let f(x) = (1/3)(x² + 2)^(3/2) for 0 ≤ x ≤ 3.
      prompt: |
        What is f′(x)?
      options:
        - "(1/2)√(x² + 2)"
        - "3x√(x² + 2)"
        - "x√(x² + 2)"
        - "(2/3)x√(x² + 2)"
      option_explanations:
        - |
          This applies the power rule to the outside but forgets the chain rule factor 2x, the derivative of x² + 2.
        - |
          This drops the constant 1/3 in front: (3/2) · 2x · (x² + 2)^(1/2) still has to be multiplied by 1/3.
        - |
          Correct. f′(x) = (1/3) · (3/2)(x² + 2)^(1/2) · 2x = x√(x² + 2) by the chain rule.
        - |
          This lowers the exponent to 1/2 and multiplies by 2x and 1/3 but never brings down the exponent 3/2 as a factor.
      answer: 2
    - slug: apcalcbc-u08-w23-q02
      type: multiple_choice
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 1
      stimulus: |
        Let f(x) = (1/3)(x² + 2)^(3/2) for 0 ≤ x ≤ 3.
      prompt: |
        Which integral gives the length of the graph of f from x = 0 to x = 3?
      options:
        - "∫₀³ √(1 + x²(x² + 2)) dx"
        - "∫₀³ √(1 + (1/9)(x² + 2)³) dx"
        - "∫₀³ √(1 + x√(x² + 2)) dx"
        - "∫₀³ (1 + x²(x² + 2)) dx"
      option_explanations:
        - |
          Correct. (f′(x))² = (x√(x² + 2))² = x²(x² + 2), and the arc length is ∫₀³ √(1 + (f′(x))²) dx.
        - |
          This squares f itself instead of its derivative; arc length depends on the slope f′.
        - |
          This adds f′ without squaring it; the formula comes from the Pythagorean theorem, so the slope is squared.
        - |
          This leaves out the square root, so it does not measure length (it is larger than the true length here).
      answer: 0
    - slug: apcalcbc-u08-w23-q03
      type: numeric
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 1
      stimulus: |
        Let f(x) = (1/3)(x² + 2)^(3/2) for 0 ≤ x ≤ 3.
      prompt: |
        Find the exact length of the graph of f from x = 0 to x = 3.
      answer: { value: 12, tolerance: 0.001 }
      explanation: |
        1 + (f′)² = 1 + x⁴ + 2x² = (x² + 1)², so √(1 + (f′)²) = x² + 1 (positive). L = ∫₀³ (x² + 1) dx = [x³/3 + x] from 0 to 3 = 9 + 3 = 12.
    - slug: apcalcbc-u08-w23-q04
      type: multiple_choice
      topic_code: "8.1"
      source: "AP Calculus CED, Topic 8.1"
      points: 1
      stimulus: |
        Let f(x) = (1/3)(x² + 2)^(3/2) for 0 ≤ x ≤ 3.
      prompt: |
        The arc length integrand for f simplifies to x² + 1. What is the average value of x² + 1 on the interval [0, 3]?
      options:
        - "12"
        - "5.5"
        - "6"
        - "4"
      option_explanations:
        - |
          12 is ∫₀³ (x² + 1) dx, the total; the average value divides it by the length of the interval, 3.
        - |
          5.5 averages the endpoint values (1 + 10)/2; that is the average of two values, not the average value of the function.
        - |
          6 divides the integral 12 by 2 instead of by the interval length 3 − 0 = 3.
        - |
          Correct. Average value = (1/(3 − 0)) ∫₀³ (x² + 1) dx = 12/3 = 4.
      answer: 3
    # ---- Independent items
    - slug: apcalcbc-u08-w23-q05
      type: multiple_choice
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 1
      prompt: |
        Which integral gives the length of the curve y = ln x from x = 1 to x = e?
      options:
        - "∫ from 1 to e of √(1 + (ln x)²) dx"
        - "∫ from 1 to e of √(1 + 1/x²) dx"
        - "∫ from 1 to e of √(1 + 1/x) dx"
        - "∫ from 0 to 1 of √(1 + 1/x²) dx"
      option_explanations:
        - |
          This squares the function ln x instead of its derivative 1/x.
        - |
          Correct. dy/dx = 1/x, so (dy/dx)² = 1/x² and L = ∫ from 1 to e of √(1 + 1/x²) dx.
        - |
          This uses the derivative 1/x without squaring it.
        - |
          0 and 1 are the y-values at the ends of the curve; an integral in x needs the x-values 1 and e.
      answer: 1
    - slug: apcalcbc-u08-w23-q06
      type: multiple_choice
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 1
      prompt: |
        A curve is given by x = y³ for 0 ≤ y ≤ 2. Which integral gives its length?
      options:
        - "∫₀⁸ √(1 + 9y⁴) dy"
        - "∫₀² √(1 + 3y²) dy"
        - "∫₀² √(1 + 9y⁴) dy"
        - "∫₀² (1 + 9y⁴) dy"
      option_explanations:
        - |
          0 and 8 are the x-values at the ends; with dy the limits must be the y-values 0 and 2.
        - |
          This uses dx/dy = 3y² without squaring it; the integrand is √(1 + (3y²)²).
        - |
          Correct. dx/dy = 3y², so (dx/dy)² = 9y⁴, and L = ∫ from y = 0 to y = 2 of √(1 + 9y⁴) dy.
        - |
          The square root is missing, so this does not give a length.
      answer: 2
    - slug: apcalcbc-u08-w23-q07
      type: multiple_choice
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 1
      prompt: |
        What is the length of the graph of y = (4/3)x from x = 0 to x = 6?
      options:
        - "10"
        - "8"
        - "14"
        - "6"
      option_explanations:
        - |
          Correct. L = ∫₀⁶ √(1 + 16/9) dx = (5/3)(6) = 10, which matches the distance from (0, 0) to (6, 8).
        - |
          8 is only the vertical change from y = 0 to y = 8; the segment also moves 6 units horizontally.
        - |
          14 adds the horizontal and vertical changes; lengths combine by the Pythagorean theorem, √(6² + 8²).
        - |
          6 is only the horizontal extent b − a; the arc length integrand √(1 + (4/3)²) is larger than 1.
      answer: 0
    - slug: apcalcbc-u08-w23-q08
      type: multiple_choice
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 1
      prompt: |
        (Calculator.) What is the length of the curve y = x³ from x = 0 to x = 1?
      options:
        - "1.064"
        - "1.380"
        - "2.800"
        - "1.548"
      option_explanations:
        - |
          1.064 is ∫₀¹ √(1 + x⁶) dx, which squares the function x³ instead of its derivative 3x².
        - |
          1.380 is ∫₀¹ √(1 + 3x²) dx: the derivative 3x² was not squared.
        - |
          2.800 is ∫₀¹ (1 + 9x⁴) dx = 1 + 9/5, which leaves out the square root.
        - |
          Correct. y′ = 3x², so L = ∫₀¹ √(1 + 9x⁴) dx ≈ 1.548 by calculator (no elementary antiderivative exists).
      answer: 3
    - slug: apcalcbc-u08-w23-q09
      type: multiple_choice
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 1
      prompt: |
        (Calculator.) What is the length of the curve y = cos x from x = 0 to x = π/2?
      options:
        - "1.000"
        - "1.910"
        - "2.000"
        - "2.356"
      option_explanations:
        - |
          1.000 is the area under the curve, ∫ from 0 to π/2 of cos x dx, not its length.
        - |
          Correct. y′ = −sin x, so L = ∫ from 0 to π/2 of √(1 + sin²x) dx ≈ 1.910 by calculator.
        - |
          2.000 is ∫ from 0 to π/2 of √(1 + sin x) dx: the derivative was not squared (and its sign was dropped).
        - |
          2.356 is ∫ from 0 to π/2 of (1 + sin²x) dx = 3π/4, which leaves out the square root.
      answer: 1
    - slug: apcalcbc-u08-w23-q10
      type: multiple_choice
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 1
      prompt: |
        A bead slides along a wire shaped like the curve y = √x, from the point (1, 1) to the point (9, 3), without turning back. Which expression gives the distance the bead travels?
      options:
        - "∫₁⁹ √(1 + x) dx"
        - "∫₁³ √(1 + 1/(4x)) dx"
        - "∫₁⁹ √(1 + 1/(4x)) dx"
        - "√(8² + 2²)"
      option_explanations:
        - |
          This squares the function √x instead of its derivative 1/(2√x).
        - |
          1 and 3 are the y-values at the ends; an integral in x needs the x-values 1 and 9.
        - |
          Correct. The distance along the wire is the arc length: y′ = 1/(2√x), (y′)² = 1/(4x), so it is ∫₁⁹ √(1 + 1/(4x)) dx ≈ 8.268.
        - |
          √68 ≈ 8.246 is the straight-line distance between the endpoints; the bead follows the curve, which is longer.
      answer: 2
    - slug: apcalcbc-u08-w23-q11
      type: multiple_choice
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 1
      prompt: |
        The piece of the curve y = x³ with 1 ≤ x ≤ 2 is rewritten as x = y^(1/3). Which integral in y gives its length?
      options:
        - "∫₁⁸ √(1 + (1/9)y^(−4/3)) dy"
        - "∫₁² √(1 + (1/9)y^(−4/3)) dy"
        - "∫₁⁸ √(1 + (1/3)y^(−2/3)) dy"
        - "∫₁⁸ √(1 + 9y⁴) dy"
      option_explanations:
        - |
          Correct. dx/dy = (1/3)y^(−2/3), so (dx/dy)² = (1/9)y^(−4/3); y runs from 1³ = 1 to 2³ = 8. (It equals ∫₁² √(1 + 9x⁴) dx ≈ 7.082.)
        - |
          1 and 2 are the x-values at the ends; with dy the limits are the y-values 1 and 8.
        - |
          This uses dx/dy = (1/3)y^(−2/3) without squaring it.
        - |
          √(1 + 9y⁴) comes from the derivative of y = x³ with x replaced by y; with x = y^(1/3) the derivative to square is dx/dy = (1/3)y^(−2/3).
      answer: 0
    - slug: apcalcbc-u08-w23-q12
      type: multiple_choice
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 1
      prompt: |
        To find the length of y = x^(2/3) from x = 0 to x = 8, a student rewrites the curve as x = y^(3/2) for 0 ≤ y ≤ 4. What is the best reason for doing so?
      options:
        - "Arc length integrals in x always need a calculator, but integrals in y never do."
        - "The graph of y = x^(2/3) fails the vertical line test, so it is not a function of x."
        - "Integrating in y gives a shorter length, which is the correct one."
        - "dy/dx = (2/3)x^(−1/3) is undefined at x = 0, while dx/dy = (3/2)y^(1/2) is continuous on [0, 4]."
      option_explanations:
        - |
          Whether a calculator is needed depends on the integrand, not the variable; many integrals in either variable have exact values.
        - |
          y = x^(2/3) passes the vertical line test: each x gives one y. The trouble is the vertical tangent at x = 0.
        - |
          The curve is the same, so its length is the same in either variable; only the integral is easier to handle in y.
        - |
          Correct. The vertical tangent at x = 0 makes the x-integrand unbounded there (an improper integral), while in y the integrand √(1 + (9/4)y) is continuous, giving (8/27)(10√10 − 1) ≈ 9.073.
      answer: 3
    - slug: apcalcbc-u08-w23-q13
      type: multiple_choice
      topic_code: "7.5"
      source: "AP Calculus CED, Topic 7.5"
      points: 1
      prompt: |
        Let y = f(x) be the solution of dy/dx = y − x with f(0) = 2. Using Euler's method with two steps of size 0.5, what is the approximation of f(1)?
      options:
        - "3"
        - "4.25"
        - "4"
        - "3.75"
      option_explanations:
        - |
          3 is the approximation of f(0.5) after only the first step.
        - |
          Correct. Slope 2 − 0 = 2 gives f(0.5) ≈ 3; slope 3 − 0.5 = 2.5 gives f(1) ≈ 3 + 1.25 = 4.25.
        - |
          4 is a single step of size 1 with the starting slope 2; two steps need a new slope at x = 0.5.
        - |
          3.75 computes the second slope with the old y-value, 2 − 0.5 = 1.5, instead of the updated value 3.
      answer: 1
    - slug: apcalcbc-u08-w23-q14
      type: multiple_choice
      topic_code: "7.9"
      source: "AP Calculus CED, Topic 7.9"
      points: 1
      prompt: |
        A hypothetical population satisfies dP/dt = 0.5P − 0.001P², with 0 < P(0) < 250. For what value of P is the population growing fastest?
      options:
        - "500"
        - "125"
        - "250"
        - "0.5"
      option_explanations:
        - |
          500 is the carrying capacity, where the growth rate 0.001P(500 − P) is zero.
        - |
          125 halves the carrying capacity twice; the fastest growth is at half of 500, which is 250.
        - |
          Correct. 0.5P − 0.001P² = 0.001P(500 − P), a downward parabola in P with zeros 0 and 500 and its vertex at P = 250 = M/2.
        - |
          0.5 is the coefficient of P (the relative growth rate for small P), not a population value.
      answer: 2
    - slug: apcalcbc-u08-w23-q15
      type: multiple_choice
      topic_code: "8.9"
      source: "AP Calculus CED, Topic 8.9"
      points: 1
      prompt: |
        The region bounded by y = √x, the x-axis and the line x = 9 is revolved about the x-axis. What is the volume of the solid?
      options:
        - "18π"
        - "81π/2"
        - "18"
        - "81π"
