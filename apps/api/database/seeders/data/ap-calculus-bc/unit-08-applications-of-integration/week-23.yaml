      points: 1
      prompt: |
        True or false: If the solution of a differential equation is concave up on an interval, then Euler's method on that interval gives an overestimate.
      answer: false
      explanation: |
        False. A concave-up curve lies above its tangent lines, so each Euler step lands below the curve and the approximation is an underestimate. Euler overestimates when the solution is concave down.
