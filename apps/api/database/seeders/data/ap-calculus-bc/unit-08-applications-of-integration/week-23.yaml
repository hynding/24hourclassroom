    - slug: apcalcbc-u08-w23-q22
      type: short_answer
      topic_code: "8.13"
      source: "AP Calculus CED, Topic 8.13"
      points: 3
      prompt: |
        Let y = x⁴/8 + 1/(4x²) for 1 ≤ x ≤ 2.

        (a) Find dy/dx.
        (b) Show that 1 + (dy/dx)² is a perfect square.
        (c) Find the exact length of the curve from x = 1 to x = 2.
      answer: |
        (a) dy/dx = x³/2 − 1/(2x³).
        (b) (dy/dx)² = x⁶/4 − 1/2 + 1/(4x⁶), so 1 + (dy/dx)² = x⁶/4 + 1/2 + 1/(4x⁶) = (x³/2 + 1/(2x³))².
        (c) For 1 ≤ x ≤ 2, x³/2 + 1/(2x³) > 0, so L = ∫₁² (x³/2 + 1/(2x³)) dx = [x⁴/8 − 1/(4x²)] from 1 to 2 = (2 − 1/16) − (1/8 − 1/4) = 33/16.
      explanation: |
        Three points, one per part. (a) dy/dx = x³/2 − 1/(2x³). (b) The expansion with the middle term −1/2 becoming +1/2, written as (x³/2 + 1/(2x³))². (c) 33/16 (2.0625) from the antiderivative x⁴/8 − 1/(4x²) evaluated at both limits; the square root must be taken as the positive expression.
    - slug: apcalcbc-u08-w23-q23
      type: short_answer
      topic_code: "8.11"
      source: "AP Calculus CED, Topics 8.4, 8.11 and 8.13"
      points: 3
      prompt: |
        Let R be the region in the first quadrant bounded by the graphs of y = x and y = x².

        (a) Find the area of R.
        (b) Find the volume of the solid generated when R is revolved about the x-axis.
        (c) Write, but do not evaluate, an integral for the length of the curved part of the boundary of R.
      answer: |
        (a) The curves meet at x = 0 and x = 1, and x ≥ x² there. Area = ∫₀¹ (x − x²) dx = 1/2 − 1/3 = 1/6.
        (b) Washers with outer radius x and inner radius x²: V = π ∫₀¹ (x² − x⁴) dx = π(1/3 − 1/5) = 2π/15.
        (c) The curved part is y = x² for 0 ≤ x ≤ 1: L = ∫₀¹ √(1 + 4x²) dx (about 1.479).
      explanation: |
        Three points, one per part. (a) 1/6 with the correct integrand (top minus bottom) and limits 0 to 1. (b) 2π/15 with the washer integrand π(x² − x⁴); π((x − x²)²) earns no point. (c) ∫₀¹ √(1 + 4x²) dx, or the equivalent ∫₀¹ √(1 + 1/(4y)) dy; the value is not required.
