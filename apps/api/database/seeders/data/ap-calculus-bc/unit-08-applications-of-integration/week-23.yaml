      type: long_answer
      topic_code: "8.13"
      source: "AP Calculus CED, Topics 8.4 and 8.13"
      points: 7
      prompt: |
        (Calculator.) The profile of a hypothetical grassy hill is modeled by y = 8 − x²/8 for −8 ≤ x ≤ 8, where x and y are measured in meters and y = 0 is ground level.

        (A) Write an integral that gives the length of the hill's profile from x = −8 to x = 8, and use your calculator to evaluate it.

        (B) A hiker walks over the hill along the profile, from x = −8 to x = 8, at a constant speed of 0.8 meters per second. How long does the walk take?

        (C) A student approximates the length of the profile using the two straight segments from (−8, 0) to (0, 8) and from (0, 8) to (8, 0). Find this approximation, and explain why it must be less than your answer to part (A).

        (D) Find the area of the hill's cross section, the region between the profile and the x-axis.
      answer: |
        (A) y′ = −x/4, so L = ∫ from −8 to 8 of √(1 + x²/16) dx ≈ 23.663 meters.
        (B) The distance walked is the arc length, so the time is 23.663/0.8 ≈ 29.579 seconds.
        (C) Each segment has length √(8² + 8²) = 8√2, so the approximation is 16√2 ≈ 22.627 meters. Each segment is the straight line between two points of the curve, the shortest path between them, so it is shorter than the arc it replaces; the sum of the two chords is less than the arc length.
        (D) Area = ∫ from −8 to 8 of (8 − x²/8) dx = [8x − x³/24] from −8 to 8 = (64 − 64/3) − (−64 + 64/3) = 256/3 ≈ 85.333 square meters.
      explanation: |
        Seven points. (A) 1 point for the integrand √(1 + (−x/4)²) or √(1 + x²/16) with limits −8 and 8; 1 point for 23.663 (correct to three decimal places; 23.663 whether rounded or truncated). (B) 1 point for 29.579 seconds (or the answer to (A) divided by 0.8), with units. (C) 1 point for 16√2 ≈ 22.627; 1 point for the reason that a chord is the shortest path between its endpoints, so each segment is shorter than the arc it spans. (D) 1 point for the integral of 8 − x²/8 from −8 to 8; 1 point for 256/3 ≈ 85.333 square meters.
