        Three points, one per part. (a) 400 (thousand). (b) S = 200 and 25 thousand subscribers per month; both values with units for the point. (c) Concave up with a reason based on d²S/dt² > 0 at S = 100 (either the expression for d²S/dt² evaluated, or "S < M/2 = 200 while S is increasing").
    - slug: apcalcbc-u07-w20-q23
      type: short_answer
      topic_code: "7.7"
      source: "AP Calculus CED, Topic 7.7"
      points: 3
      prompt: |
        Find the particular solution y = h(x) of the differential equation dy/dx = 2x/y with initial condition h(0) = 3. Show the separation of variables and explain your choice of sign.
      answer: |
        Separate: y dy = 2x dx. Integrate: y²/2 = x² + C. With x = 0, y = 3: 9/2 = C, so y² = 2x² + 9. Since h(0) = 3 > 0, take the positive square root: h(x) = √(2x² + 9).
      explanation: |
        One point for separating the variables correctly (y dy = 2x dx, both differentials present). One point for antiderivatives with a constant of integration, y²/2 = x² + C. One point for using the initial condition and giving h(x) = √(2x² + 9), choosing the positive root because h(0) = 3 is positive. No point for the last step if the constant is added only after solving for y.
    - slug: apcalcbc-u07-w20-q24
      type: long_answer
      topic_code: "7.9"
      source: "AP Calculus CED, Topics 7.5 and 7.9"
      points: 7
      prompt: |
        The number of fish in a hypothetical lake is modeled by a function F that satisfies the logistic differential equation dF/dt = 0.2F(1 − F/2000), where t is measured in years. At t = 0 there are 400 fish.

        (A) Find lim (t→∞) F(t). For what value of F is the fish population growing fastest?

        (B) Use Euler's method, starting at t = 0 with two steps of equal size, to approximate F(2). Show the work that leads to your answer.

        (C) Find d²F/dt² in terms of F. Use it to determine whether the approximation in part (B) is an overestimate or an underestimate of F(2). Explain your reasoning.

        (D) Is there a time t > 0 at which F(t) = 2500? Explain.
      answer: |
        (A) The carrying capacity is 2000 and F(0) = 400 > 0, so lim (t→∞) F(t) = 2000 fish. The population grows fastest when F = 2000/2 = 1000 fish.
        (B) Steps of Δt = 1. At (0, 400): dF/dt = 0.2 · 400 · (1 − 0.2) = 64, so F(1) ≈ 400 + 64 = 464. At (1, 464): dF/dt = 0.2 · 464 · (1 − 0.232) = 71.2704, so F(2) ≈ 464 + 71.2704 = 535.2704 (about 535 fish).
        (C) dF/dt = 0.2F − 0.0001F², so d²F/dt² = (0.2 − 0.0002F) · dF/dt = 0.2(1 − F/1000) · 0.2F(1 − F/2000). For 400 ≤ F < 1000, every factor is positive, so d²F/dt² > 0 and the graph of F is concave up on 0 ≤ t ≤ 2 (F stays between 400 and 1000 there: F increases from 400 at a rate never above the maximum kM/4 = 100 fish per year, so F(2) ≤ 600). A concave-up curve lies above its tangent segments, so the Euler approximation is an underestimate.
        (D) No. F(0) = 400 < 2000, and F = 2000 is an equilibrium solution; a solution starting below 2000 stays below 2000 (it increases toward 2000 without reaching it), so F(t) is never 2500.
      explanation: |
        Seven points. (A) 1 point: limit 2000; 1 point: F = 1000. (B) 1 point: the first Euler step to F(1) ≈ 464 with the slope 64 shown; 1 point: the second step with the slope recomputed at F = 464, F(2) ≈ 535.27 (accept 535.270 or 535). (C) 1 point: d²F/dt² = (0.2 − 0.0002F) dF/dt or the equivalent product in F; 1 point: underestimate, justified by d²F/dt² > 0 for 400 ≤ F < 1000 (concave up, so the tangent steps lie below the curve). A conclusion without the concavity reason earns no point. (D) 1 point: no, with the reason that F increases toward the equilibrium 2000 and never exceeds it (equivalently dF/dt > 0 only while F < 2000 and F = 2000 cannot be crossed).
