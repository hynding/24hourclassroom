      points: 3
      prompt: |
        The number of hypothetical subscribers to a new app, in thousands, satisfies dS/dt = 0.25S(1 − S/400), where t is in months and S(0) = 80.

        (a) Find lim (t→∞) S(t).
        (b) For what value of S is the number of subscribers growing fastest? What is the growth rate then, with units?
        (c) Is the graph of S concave up or concave down at the moment when S = 100? Justify.
      answer: |
        (a) The model is logistic with carrying capacity 400 and S(0) = 80 > 0, so lim (t→∞) S(t) = 400 thousand subscribers.
        (b) Fastest growth at S = 400/2 = 200 thousand. The rate then is 0.25 · 200 · (1 − 1/2) = 25 thousand subscribers per month.
        (c) d²S/dt² = 0.25(1 − 2S/400) · dS/dt. At S = 100, 1 − 200/400 = 1/2 > 0 and dS/dt = 0.25 · 100 · (3/4) = 18.75 > 0, so d²S/dt² > 0: concave up.
