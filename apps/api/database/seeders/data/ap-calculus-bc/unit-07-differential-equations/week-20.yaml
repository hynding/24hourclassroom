      answer: { value: 0.5, tolerance: 0.001 }
      explanation: |
        ∫ from 0 to b of e^(−2x) dx = [−(1/2)e^(−2x)] from 0 to b = 1/2 − (1/2)e^(−2b). As b → ∞, e^(−2b) → 0, so the integral converges to 1/2 = 0.5.
