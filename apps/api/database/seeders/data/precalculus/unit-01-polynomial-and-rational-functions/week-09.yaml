    - slug: precalc-u01-w09-q21
      type: short_answer
      topic_code: "1.14"
      source: "AP Precalculus CED, Topic 1.14"
      points: 3
      stimulus: |
        The table shows the height of a seedling, in centimeters, x days after it was first measured. The data are hypothetical.

        | x (days) | 0 | 2 | 4 | 6 | 8 |
        |---|---|---|---|---|---|
        | height (cm) | 3.1 | 4.9 | 7.2 | 8.8 | 11.0 |
      prompt: |
        (Calculator.) A linear regression on these data gives ŷ = 0.985x + 3.06.

        (a) Interpret the slope of the model in context, with units.
        (b) Use the model to predict the height on day 5, and find the residual on day 6.
        (c) Give one reason why using this model to predict the height on day 60 would be unreliable.
      answer: |
        (a) According to the model, the seedling grows about 0.985 cm per day.
        (b) Day 5: ŷ = 0.985(5) + 3.06 ≈ 7.99 cm. Day 6: ŷ = 0.985(6) + 3.06 = 8.97 cm, so the residual is 8.8 − 8.97 = −0.17 cm (the model overestimates slightly).
        (c) Day 60 is far outside the observed 0 to 8 days. The model assumes growth continues at a constant rate, but plant growth slows as the plant matures (the model would predict about 62 cm), so the extrapolation is not supported by the data.
      explanation: |
        Three points, one per part. (a) a rate with units, phrased as a model prediction. (b) both the prediction (about 7.99 cm) and the residual −0.17 cm, with actual − predicted. (c) a valid limitation: extrapolation beyond the data and/or the constant-rate assumption.
    - slug: precalc-u01-w09-q22
      type: short_answer
      topic_code: "1.13"
      source: "AP Precalculus CED, Topic 1.13"
      points: 3
      prompt: |
        A hypothetical water tank, empty at time t = 0, is filled by a pump at 30 liters per minute for the first 10 minutes. Then the pump switches to a slower rate of 12 liters per minute until the tank is full at t = 40 minutes.

        (a) Explain why a piecewise function is an appropriate model, and write a piecewise model V(t) for the volume in liters.
        (b) Find V(25) and interpret it in context.
        (c) At what time does the tank contain 600 liters? State the contextual domain and range of V.
      answer: |
        (a) The rate of change of the volume is constant on each interval but changes at t = 10, so a single linear function cannot describe the whole process. V(t) = 30t for 0 ≤ t ≤ 10, and V(t) = 300 + 12(t − 10) for 10 < t ≤ 40.
        (b) V(25) = 300 + 12(15) = 480. After 25 minutes the tank holds 480 liters.
        (c) 300 + 12(t − 10) = 600 gives t − 10 = 25, so t = 35 minutes. Domain 0 ≤ t ≤ 40; range 0 ≤ V ≤ 660, since V(40) = 300 + 12(30) = 660 liters.
      explanation: |
        Three points, one per part. (a) a reason tied to the change in rate and a correct two-piece model. (b) 480 liters with an interpretation. (c) t = 35 minutes, plus the domain [0, 40] and range [0, 660].
    - slug: precalc-u01-w09-q23
      type: long_answer
      topic_code: "1.14"
      source: "AP Precalculus CED, Topic 1.14"
      points: 6
      prompt: |
        During a dry season, the depth of water in a reservoir is measured every 4 weeks. The data are hypothetical.

        | t (weeks) | 0 | 4 | 8 |
        |---|---|---|---|
        | depth (meters) | 12.0 | 10.4 | 9.6 |

        The depth is modeled by a quadratic function d(t) = at² + bt + c.

        (A) (i) Use the three data points to find a, b and c. Show the work that leads to your answer.
        (ii) Use the model to estimate the depth at t = 6 weeks. Include units.

        (B) (i) Find the average rate of change of d over [0, 8] and interpret it in context.
        (ii) Is the rate at which the depth changes increasing or decreasing over [0, 8]? Justify using the model.

        (C) (i) The model has its minimum at t = 10 and predicts that the depth rises after that. Explain one limitation of the model that this reveals.
        (ii) A fourth measurement at t = 12 weeks is 8.9 meters. Find the residual at t = 12 and explain what it suggests about the model.
      answer: |
        (A)(i) From (0, 12.0): c = 12. From (4, 10.4): 16a + 4b = −1.6. From (8, 9.6): 64a + 8b = −2.4. Doubling the first gives 32a + 8b = −3.2; subtracting, 32a = 0.8, so a = 0.025, and then 4b = −1.6 − 0.4 = −2, so b = −0.5. d(t) = 0.025t² − 0.5t + 12.
        (ii) d(6) = 0.025(36) − 3 + 12 = 9.9 meters.
        (B)(i) (9.6 − 12.0)/(8 − 0) = −0.3 m per week: over the first 8 weeks the depth fell by 0.3 meters per week on average.
        (ii) Increasing. a = 0.025 > 0, so d is concave up and its rate of change is increasing (becoming less negative): the depth falls more slowly as time passes. The average rates −0.4 m/week on [0, 4] and −0.2 m/week on [4, 8] confirm this.
        (C)(i) Nothing in a dry season makes the water rise, yet the quadratic must turn upward after its vertex. The model is only reasonable over (roughly) the observed weeks 0 to 8; extrapolating past the vertex is not supported.
        (ii) d(12) = 0.025(144) − 6 + 12 = 9.6. Residual = 8.9 − 9.6 = −0.7 m. The model overestimates the depth at week 12, which supports the limitation in (C)(i): the quadratic is not appropriate beyond the data it was built from.
      explanation: |
        Six points, one per sub-part. (A)(i) a system from the three points solved correctly (a = 0.025, b = −0.5, c = 12). (A)(ii) 9.9 meters with units. (B)(i) −0.3 with units and an interpretation. (B)(ii) "increasing" justified by concavity (a > 0) or by comparing average rates on [0, 4] and [4, 8]. (C)(i) a limitation tied to the context (the predicted rise after week 10 contradicts a dry season; restrict the domain). (C)(ii) residual −0.7 m computed as actual − predicted, with the conclusion that the model overestimates beyond the data.
