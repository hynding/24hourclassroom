    - slug: precalc-u01-w07-q23
      type: long_answer
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 6
      prompt: |
        The function f is given by f(x) = (2x³ − 3x² − 8x + 12)/(x² − x − 2).

        (A) (i) Use the factor theorem to show that x − 2 is a factor of the numerator.
        (ii) Factor the numerator and the denominator completely.

        (B) (i) The graph of f has a hole. Find its coordinates.
        (ii) Find the real zeros of f and the equation of its vertical asymptote.

        (C) (i) For x ≠ 2, write f(x) in the form q(x) + r/(x + 1), where q is a polynomial and r is a constant. State the equation of the slant asymptote.
        (ii) For large positive x, is the graph of f above or below its slant asymptote? Justify your answer.
      answer: |
        (A)(i) Let N(x) = 2x³ − 3x² − 8x + 12. N(2) = 16 − 12 − 16 + 12 = 0, so x − 2 is a factor.
        (ii) Dividing N by x − 2 gives 2x² + x − 6 = (2x − 3)(x + 2), so N(x) = (x − 2)(2x − 3)(x + 2). The denominator is x² − x − 2 = (x − 2)(x + 1).
        (B)(i) For x ≠ 2, f(x) = (2x − 3)(x + 2)/(x + 1). At x = 2 this is (1)(4)/3 = 4/3, so the hole is at (2, 4/3).
        (ii) Zeros 3/2 and −2. Vertical asymptote x = −1 (the factor x + 1 does not cancel).
        (C)(i) (2x − 3)(x + 2) = 2x² + x − 6. Dividing by x + 1 (synthetic with −1: 2, 1, −6 → 2, −1, −5) gives f(x) = 2x − 1 − 5/(x + 1) for x ≠ 2. Slant asymptote y = 2x − 1.
        (ii) Below. For large positive x, x + 1 is positive, so −5/(x + 1) is a small negative number and f(x) = (2x − 1) − 5/(x + 1) is slightly less than 2x − 1.
      explanation: |
        Six points, one per sub-part. (A)(i) N(2) = 0 computed and the factor theorem cited. (A)(ii) both complete factorizations. (B)(i) hole (2, 4/3). (B)(ii) zeros 3/2 and −2 (not 2) and x = −1. (C)(i) correct quotient and remainder, with y = 2x − 1 stated as the asymptote. (C)(ii) "below" with the sign of −5/(x + 1) as the reason; no point for "below" without a reason.
