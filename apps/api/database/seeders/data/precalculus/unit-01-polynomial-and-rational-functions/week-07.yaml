week: 7
unit: 1
title: "Equivalent Representations of Polynomial and Rational Expressions"
topics: ["1.11"]
guide: guides/week-07.md
guide_description: |
  Which form of a polynomial or rational function answers which question; the factoring toolkit (common factor,
  grouping, difference of squares, sum and difference of cubes, quadratic type); polynomial long division and
  synthetic division; the remainder and factor theorems; rewriting a rational function as quotient +
  remainder/divisor to find a slant asymptote; and Pascal's triangle with the binomial theorem. Worked examples
  include dividing x⁴ − 2x³ + 3x − 1 by x² + 1, finding k so that x + 2 is a factor, the slant asymptote of
  (2x² + 3x − 1)/(x + 2), and the x³ coefficient of (2x − 1)⁵.
flashcards_description: |
  30 cards on equivalent forms, factoring patterns, long and synthetic division, the remainder and factor
  theorems, slant asymptotes by division, and binomial expansion.

flashcards:
  - front: Standard vs factored vs quotient-plus-remainder form → what each reveals
    back: |
      Standard: degree, leading coefficient, vertical intercept. Factored: zeros, sign and multiplicity. Quotient + remainder/divisor: the slant or horizontal asymptote and the part that blows up near a vertical asymptote.
    topic_code: "1.11"
  - front: Equivalent expressions → meaning
    back: |
      They give the same output for every input in their common domain. (x² − 9)/(x − 3) and x + 3 agree everywhere except x = 3, where only the second is defined.
    topic_code: "1.11"
  - front: Factor by grouping x³ + 2x² − 9x − 18 → result
    back: |
      x²(x + 2) − 9(x + 2) = (x + 2)(x² − 9) = (x + 2)(x − 3)(x + 3).
    topic_code: "1.11"
  - front: Sum of cubes a³ + b³ → factored form
    back: |
      (a + b)(a² − ab + b²). Example: x³ + 27 = (x + 3)(x² − 3x + 9).
    topic_code: "1.11"
  - front: Difference of cubes a³ − b³ → factored form
    back: |
      (a − b)(a² + ab + b²). Example: 8x³ − 1 = (2x − 1)(4x² + 2x + 1).
    topic_code: "1.11"
  - front: Cube-formula signs → memory aid
    back: |
      The binomial's sign matches the original; the middle sign of the trinomial is the opposite; the last sign is always +. The trinomial has no real zeros.
    topic_code: "1.11"
  - front: Factor x⁴ − 5x² + 4 → method and result
    back: |
      Quadratic type: with u = x², u² − 5u + 4 = (u − 1)(u − 4). So (x² − 1)(x² − 4) = (x − 1)(x + 1)(x − 2)(x + 2).
    topic_code: "1.11"
  - front: Division algorithm for polynomials → statement
    back: |
      p(x) = d(x) · q(x) + r(x), where the remainder r is 0 or has degree less than the divisor d. Equivalently p/d = q + r/d.
    topic_code: "1.11"
  - front: Polynomial long division → the repeating step
    back: |
      Divide the leading terms, multiply the divisor by that term, subtract, bring down. Stop when the remainder's degree is less than the divisor's.
    topic_code: "1.11"
  - front: Zero placeholders in division → why they matter
    back: |
      Every power must have a column. Dividing x³ − 7x + 6 needs coefficients 1, 0, −7, 6; leaving out the 0 misaligns every later step.
    topic_code: "1.11"
  - front: (x⁴ − 2x³ + 3x − 1) ÷ (x² + 1) → quotient and remainder
    back: |
      Quotient x² − 2x − 1, remainder 5x. Check: (x² + 1)(x² − 2x − 1) + 5x = x⁴ − 2x³ + 3x − 1.
    topic_code: "1.11"
  - front: Synthetic division → when you can use it
    back: |
      Only for a divisor of the form x − a (degree 1, leading coefficient 1). For x + a use −a. For a quadratic divisor use long division.
    topic_code: "1.11"
  - front: Synthetic division of 2x³ − 3x² + 4x − 5 by x − 2 → bottom row
    back: |
      2, 1, 6 | 7. Quotient 2x² + x + 6, remainder 7. Bring down, multiply by 2, add, repeat.
    topic_code: "1.11"
  - front: Bottom row of synthetic division → how to read it
    back: |
      The last number is the remainder; the others are the quotient's coefficients, starting one degree below the dividend.
    topic_code: "1.11"
  - front: Remainder theorem → statement
    back: |
      The remainder when p(x) is divided by x − a equals p(a), because p(a) = (a − a)q(a) + r = r.
    topic_code: "1.11"
  - front: Remainder of x⁴ − 3x³ + 2x − 7 divided by x + 1 → value
    back: |
      p(−1) = 1 + 3 − 2 − 7 = −5. The divisor x + 1 means a = −1.
    topic_code: "1.11"
  - front: Factor theorem → statement
    back: |
      x − a is a factor of p(x) exactly when p(a) = 0, that is, when a is a zero. It is the remainder theorem with remainder 0.
    topic_code: "1.11"
  - front: k so that x + 2 divides x³ + kx² − x − 2 → value
    back: |
      Set p(−2) = 0: −8 + 4k + 2 − 2 = 0, so k = 2. Then the cubic factors as (x + 2)(x − 1)(x + 1).
    topic_code: "1.11"
  - front: Known zero 1 of x³ − 6x² + 11x − 6 → remaining zeros
    back: |
      Divide by x − 1: quotient x² − 5x + 6 = (x − 2)(x − 3). Zeros 1, 2, 3.
    topic_code: "1.11"
  - front: Slant asymptote → when it occurs and how to find it
    back: |
      When the numerator's degree is exactly one more than the denominator's. Divide; the quotient (a linear function) is the asymptote, and the remainder term goes to 0.
    topic_code: "1.11"
  - front: (2x² + 3x − 1)/(x + 2) → quotient-plus-remainder form
    back: |
      2x − 1 + 1/(x + 2). Slant asymptote y = 2x − 1; for large positive x the graph is just above the line.
    topic_code: "1.11"
  - front: (x² − x − 2)/(x − 4) → slant asymptote
    back: |
      Dividing gives x + 3 + 10/(x − 4), so the slant asymptote is y = x + 3. The term 10/(x − 4) is what blows up near x = 4.
    topic_code: "1.11"
  - front: Degree of numerator two more than denominator → end behaviour
    back: |
      The quotient is a quadratic (or higher), so there is no line asymptote; the graph follows y = q(x), a parabola-shaped curve, at the ends.
    topic_code: "1.11"
  - front: Pascal's triangle row 5 → entries
    back: |
      1, 5, 10, 10, 5, 1. Each entry is the sum of the two above it in row 4 (1, 4, 6, 4, 1).
    topic_code: "1.11"
  - front: Binomial theorem → general term of (a + b)ⁿ
    back: |
      C(n, k)aⁿ⁻ᵏbᵏ for k = 0, 1, …, n, where C(n, k) = n!/(k!(n − k)!). The exponents in every term add to n.
    topic_code: "1.11"
  - front: Expand (x + 2)⁴ → result
    back: |
      Row 4 coefficients 1, 4, 6, 4, 1 with powers of 2: x⁴ + 8x³ + 24x² + 32x + 16.
    topic_code: "1.11"
  - front: Coefficient of x³ in (2x − 1)⁵ → value
    back: |
      C(5, 2)(2x)³(−1)² = 10 · 8 · 1 = 80. Raise both the 2 and the −1 to their powers.
    topic_code: "1.11"
  - front: Error-spot → "x³ − 8 = (x − 2)(x² − 2x + 4)"
    back: |
      The middle sign is wrong. a³ − b³ = (a − b)(a² + ab + b²), so x³ − 8 = (x − 2)(x² + 2x + 4). Expanding the wrong version gives x³ − 4x² + 8x − 8.
    topic_code: "1.11"
  - front: Error-spot → "dividing by x + 3, so put 3 in the synthetic box"
    back: |
      x + 3 = x − (−3), so the number in the box is −3. Using 3 divides by x − 3 instead and gives p(3) as the remainder.
    topic_code: "1.11"
  - front: Error-spot → "the slant asymptote of (2x² + 3x − 1)/(x + 2) is y = 2x − 1 + 1/(x + 2)"
    back: |
      The asymptote is the quotient only, y = 2x − 1. The remainder term 1/(x + 2) is what shrinks to 0 as x → ±∞.
    topic_code: "1.11"

quiz:
  description: |
    23 questions · about 45 minutes · mostly on this week (topic 1.11: factoring patterns, long and synthetic
    division, the remainder and factor theorems, slant asymptotes by division, and the binomial theorem), with
    about a third reviewing weeks 1 to 6 (rates of change, polynomial zeros and sign, end behavior, holes and
    asymptotes). Opens with a shared-context set of four questions on one cubic. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes. No calculator is needed.
  questions:
    # ---- Stimulus set: one cubic (1.11, 1.5)
    - slug: precalc-u01-w07-q01
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      stimulus: |
        Let p(x) = x³ − 2x² − 5x + 6. It is known that p(1) = 0.
      prompt: |
        What is the remainder when p(x) is divided by x + 1?
      options:
        - "0"
        - "12"
        - "8"
        - "−8"
      option_explanations:
        - |
          0 is p(1), the remainder for the divisor x − 1. Dividing by x + 1 means evaluating at x = −1.
        - |
          This treats −2(−1)² as +2. Squaring −1 gives 1, so the term is −2 and the total is −1 − 2 + 5 + 6 = 8.
        - |
          Correct. By the remainder theorem the remainder is p(−1) = −1 − 2 + 5 + 6 = 8.
        - |
          The remainder theorem gives p(−1) itself, not its opposite; p(−1) = 8 is positive.
      answer: 2
    - slug: precalc-u01-w07-q02
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      stimulus: |
        Let p(x) = x³ − 2x² − 5x + 6. It is known that p(1) = 0.
      prompt: |
        What is the quotient when p(x) is divided by x − 1?
      options:
        - "x² − x − 6"
        - "x² − 3x − 2"
        - "x² − 2x − 5"
        - "x³ − x² − 6x"
      option_explanations:
        - |
          Correct. Synthetic division with 1 on coefficients 1, −2, −5, 6 gives 1, −1, −6 and remainder 0, so the quotient is x² − x − 6.
        - |
          This is the quotient for dividing by x + 1 (synthetic division with −1), which also leaves a remainder of 8.
        - |
          This just copies the first three coefficients of p without doing the multiply-and-add steps.
        - |
          Dividing a cubic by a linear factor gives a quadratic; the quotient starts one degree lower than p.
      answer: 0
    - slug: precalc-u01-w07-q03
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      stimulus: |
        Let p(x) = x³ − 2x² − 5x + 6. It is known that p(1) = 0.
      prompt: |
        Which of these lists all the zeros of p?
      options:
        - "1, 2 and −3"
        - "−1, 3 and −2"
        - "1 and 6"
        - "1, 3 and −2"
      option_explanations:
        - |
          The quotient x² − x − 6 factors as (x − 3)(x + 2), not (x − 2)(x + 3); check: (x − 2)(x + 3) = x² + x − 6.
        - |
          These have the wrong sign throughout; the factor (x − 1) gives the zero 1, not −1.
        - |
          6 is the constant term of the quotient, not a zero; the quotient x² − x − 6 must still be factored.
        - |
          Correct. p(x) = (x − 1)(x² − x − 6) = (x − 1)(x − 3)(x + 2), so the zeros are 1, 3 and −2.
      answer: 3
    - slug: precalc-u01-w07-q04
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      stimulus: |
        Let p(x) = x³ − 2x² − 5x + 6. It is known that p(1) = 0.
      prompt: |
        For which values of x is p(x) < 0?
      options:
        - "−2 < x < 1 or x > 3"
        - "x < −2 or 1 < x < 3"
        - "1 < x < 3 only"
        - "x < 1"
      option_explanations:
        - |
          These are the intervals where p is positive; with a positive leading coefficient, a cubic is negative on the far left.
        - |
          Correct. p(x) = (x − 1)(x − 3)(x + 2) has simple zeros −2, 1, 3. It is negative far left (odd degree, positive leading coefficient) and the sign flips at each zero: −, +, −, +.
        - |
          This misses the leftmost interval. For x < −2 all three factors are negative, so their product is negative.
        - |
          The sign changes at every simple zero, so p cannot be negative on all of x < 1; it is positive between −2 and 1.
      answer: 1
    # ---- Independent items
    - slug: precalc-u01-w07-q05
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      prompt: |
        What are the quotient and remainder when 2x³ + 5x² − 4 is divided by x + 3?
      options:
        - "Quotient 2x² + 11x + 33, remainder 95"
        - "Quotient 2x² − x + 3, remainder −13"
        - "Quotient 2x − 1, remainder −1"
        - "Quotient 2x² − x − 3, remainder 5"
      option_explanations:
        - |
          This uses 3 instead of −3 in synthetic division, which divides by x − 3.
        - |
          Correct. Synthetic division with −3 on 2, 5, 0, −4: bring down 2; 5 − 6 = −1; 0 + 3 = 3; −4 − 9 = −13.
        - |
          This leaves out the 0 placeholder for the missing x term, so the coefficients 2, 5, −4 are misaligned.
        - |
          The third step is 0 + (−1)(−3) = 3, not −3; with −3 the remainder becomes −4 + 9 = 5, which is also wrong.
      answer: 1
    - slug: precalc-u01-w07-q06
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      prompt: |
        What is the slant asymptote of the graph of f(x) = (3x² − 2x + 4)/(x − 1)?
      options:
        - "y = 3x"
        - "y = 3x − 5"
        - "y = 3x + 1 + 5/(x − 1)"
        - "y = 3x + 1"
      option_explanations:
        - |
          The ratio of leading terms gives only the slope; the division also produces a constant term, +1.
        - |
          This comes from synthetic division with −1, which divides by x + 1 rather than x − 1.
        - |
          This is f itself rewritten. The asymptote is only the quotient; the remainder term 5/(x − 1) goes to 0.
        - |
          Correct. Synthetic division with 1 on 3, −2, 4 gives 3, 1 and remainder 5, so f(x) = 3x + 1 + 5/(x − 1) and the asymptote is y = 3x + 1.
      answer: 3
    - slug: precalc-u01-w07-q07
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      prompt: |
        What is the coefficient of x² in the expansion of (x + 2)⁵?
      options:
        - "80"
        - "10"
        - "40"
        - "32"
      option_explanations:
        - |
          Correct. The x² term has 2 raised to the power 3: C(5, 3) · 2³ = 10 · 8 = 80.
        - |
          10 is the binomial coefficient C(5, 3) alone; it still has to be multiplied by 2³ = 8.
        - |
          This pairs C(5, 2) = 10 with 2² = 4, which gives the x³ term, not the x² term.
        - |
          32 = 2⁵ is the constant term, where x does not appear at all.
      answer: 0
    - slug: precalc-u01-w07-q08
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      prompt: |
        For what value of k is x − 3 a factor of x³ − kx + 6?
      options:
        - "7"
        - "−11"
        - "11"
        - "9"
      option_explanations:
        - |
          This sets p(−3) = 0, which tests the factor x + 3 instead of x − 3.
        - |
          The equation 27 − 3k + 6 = 0 gives 3k = 33, so k is positive 11; the sign was lost when solving.
        - |
          Correct. By the factor theorem p(3) = 0: 27 − 3k + 6 = 0, so k = 11.
        - |
          This ignores the constant term: 27 − 3k = 0 gives 9, but the +6 must be included.
      answer: 2
    - slug: precalc-u01-w07-q09
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      prompt: |
        Which is the complete factorization of 27x³ + 8 over the real numbers?
      options:
        - "(3x + 2)(9x² + 6x + 4)"
        - "(3x + 2)³"
        - "(3x − 2)(9x² + 6x + 4)"
        - "(3x + 2)(9x² − 6x + 4)"
      option_explanations:
        - |
          The middle sign of the trinomial must be the opposite of the binomial's sign; this version expands to 27x³ + 36x² + 24x + 8.
        - |
          (3x + 2)³ expands to 27x³ + 54x² + 36x + 8, which has middle terms the sum of cubes does not.
        - |
          This is the pattern for a difference of cubes, 27x³ − 8.
        - |
          Correct. With a = 3x and b = 2, a³ + b³ = (a + b)(a² − ab + b²) = (3x + 2)(9x² − 6x + 4); the trinomial has no real zeros.
      answer: 3
    - slug: precalc-u01-w07-q10
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Precalculus CED, Topic 1.9"
      points: 1
      prompt: |
        Which lists every vertical asymptote of the graph of y = (x² − 1)/(x² + 3x + 2)?
      options:
        - "x = −1 and x = −2"
        - "x = −2 only"
        - "x = 1 and x = −1"
        - "x = −1 only"
      option_explanations:
        - |
          The factor (x + 1) appears in both numerator and denominator and cancels, so x = −1 gives a hole, not an asymptote.
        - |
          Correct. (x − 1)(x + 1)/((x + 1)(x + 2)) simplifies to (x − 1)/(x + 2); only x + 2 remains in the denominator.
        - |
          These are the zeros of the numerator; asymptotes come from the denominator.
        - |
          x = −1 cancels and becomes a hole; the remaining denominator factor x + 2 gives the asymptote.
      answer: 1
    - slug: precalc-u01-w07-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      stimulus: |
        | x | 1.9 | 2.0 | 2.1 |
        |---|---|---|---|
        | f(x) | 3.61 | 4.00 | 4.41 |
      prompt: |
        Using the average rate of change over [1.9, 2.1], what is the best estimate of the rate of change of f at x = 2?
      options:
        - "4"
        - "0.8"
        - "8"
        - "4.41"
      option_explanations:
        - |
          Correct. (4.41 − 3.61)/(2.1 − 1.9) = 0.80/0.2 = 4, an average rate over a small interval centred on 2.
        - |
          0.8 is the change in f only; it must be divided by the change in x, 0.2.
        - |
          This divides 0.8 by 0.1, but the interval [1.9, 2.1] has length 0.2.
        - |
          4.41 is an output value, f(2.1), not a rate of change.
      answer: 0
    - slug: precalc-u01-w07-q12
      type: multiple_choice
      topic_code: "1.10"
      source: "AP Precalculus CED, Topic 1.10"
      points: 1
      prompt: |
        What are the coordinates of the hole in the graph of y = (x² − 2x − 8)/(x² − 16)?
      options:
        - "(4, 0)"
        - "(−4, 1/2)"
        - "(4, 3/4)"
        - "(4, 1/2)"
      option_explanations:
        - |
          The y-coordinate comes from the simplified function, not from the cancelled factor.
        - |
          (x + 4) does not cancel, so x = −4 is a vertical asymptote; the hole is at x = 4.
        - |
          Correct. (x − 4)(x + 2)/((x − 4)(x + 4)) simplifies to (x + 2)/(x + 4), which is 6/8 = 3/4 at x = 4.
        - |
          (x + 2)/(x + 4) at x = 4 is 6/8, not 4/8; the numerator is x + 2.
      answer: 2
    - slug: precalc-u01-w07-q13
      type: multi_select
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are equivalent to x⁴ − 16 for every real x? Select all that apply.
      options:
        - "(x² − 4)(x² + 4)"
        - "(x − 2)(x + 2)(x² + 4)"
        - "(x − 2)²(x + 2)²"
        - "(x² + 4)² − 8x²"
        - "(x − 2)(x³ + 2x² + 4x + 8)"
      option_explanations:
        - |
          Correct. x⁴ − 16 is a difference of squares, (x²)² − 4².
        - |
          Correct. Factoring x² − 4 further as (x − 2)(x + 2) keeps the expression equal.
        - |
          (x − 2)²(x + 2)² = (x² − 4)² = x⁴ − 8x² + 16, which has an extra x² term and the wrong constant.
        - |
          (x² + 4)² − 8x² = x⁴ + 8x² + 16 − 8x² = x⁴ + 16, not x⁴ − 16.
        - |
          Correct. Synthetic division of x⁴ − 16 by x − 2 gives quotient x³ + 2x² + 4x + 8 and remainder 0.
      answer: [0, 1, 4]
    - slug: precalc-u01-w07-q14
      type: multi_select
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 2
      partial_credit: true
      prompt: |
        Let f(x) = (x² + 2x + 3)/(x + 1), which can be rewritten as f(x) = x + 1 + 2/(x + 1). Which statements are true? Select all that apply.
      options:
        - "The graph of f has the slant asymptote y = x + 1."
        - "The graph of f has the vertical asymptote x = −1."
        - "f has no real zeros."
        - "The graph of f has the horizontal asymptote y = 1."
        - "For large positive x, the graph of f lies below its slant asymptote."
      option_explanations:
        - |
          Correct. The quotient x + 1 is linear and the remainder term 2/(x + 1) approaches 0 as x → ±∞.
        - |
          Correct. The denominator is zero at −1 and the numerator there is 1 − 2 + 3 = 2, not 0, so nothing cancels.
        - |
          Correct. The numerator x² + 2x + 3 has discriminant 4 − 12 = −8 < 0, so it is never zero for real x.
        - |
          The numerator's degree is one more than the denominator's, so the graph has a slant asymptote, not a horizontal one.
        - |
          For large positive x, 2/(x + 1) is a small positive number, so f(x) is slightly more than x + 1: the graph lies above the asymptote.
      answer: [0, 1, 2]
    - slug: precalc-u01-w07-q15
      type: true_false
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      prompt: |
        True or false: When x⁵⁰ − 1 is divided by x + 1, the remainder is 0.
      answer: true
      explanation: |
        True. By the remainder theorem the remainder is p(−1) = (−1)⁵⁰ − 1 = 1 − 1 = 0, because an even power of −1 is 1. So x + 1 is a factor of x⁵⁰ − 1.
    - slug: precalc-u01-w07-q16
      type: true_false
      topic_code: "1.8"
      source: "AP Precalculus CED, Topic 1.8"
      points: 1
      prompt: |
        True or false: x = 0 is part of the solution set of x/(x − 2) > 0.
      answer: false
      explanation: |
        False. At x = 0 the expression equals 0/(−2) = 0, and 0 is not greater than 0. The solution set is x < 0 or x > 2; 0 would be included only for ≥.
    - slug: precalc-u01-w07-q17
      type: fill_blank
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      prompt: |
        The coefficient of x³ in the expansion of (x − 2)⁶ is ____.
      answer: ["-160", "−160"]
      explanation: |
        The x³ term has (−2) raised to the power 3: C(6, 3) · (−2)³ = 20 · (−8) = −160. The odd power keeps the negative sign.
