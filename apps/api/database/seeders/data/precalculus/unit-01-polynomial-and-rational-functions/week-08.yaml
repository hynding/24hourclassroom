week: 8
unit: 1
title: "Transformations of Functions"
topics: ["1.12"]
guide: guides/week-08.md
guide_description: |
  The general form g(x) = a · f(b(x − h)) + k and what each parameter does; the point rule for mapping points of f
  to points of g; transformations of a function given by a table; how zeros, asymptotes, holes, extrema, domain
  and range move; writing a transformed function from a description or from its features; and how symmetry and
  rates of change behave. Worked examples include factoring f(2x − 6) as f(2(x − 3)), the domain and range of
  −3f(2(x − 1)) + 2, and finding a in a/(x − 1) − 2 from one point.
flashcards_description: |
  30 cards on translations, dilations and reflections, the point rule, transformed tables, and the effect of a
  transformation on zeros, asymptotes, domain and range.

flashcards:
  - front: g(x) = a · f(b(x − h)) + k → which parameters act on outputs
    back: |
      a and k, the ones outside f. They behave as they look: multiply outputs by a, then add k.
    topic_code: "1.12"
  - front: g(x) = a · f(b(x − h)) + k → which parameters act on inputs
    back: |
      b and h, the ones inside f. They behave "backwards": the graph is compressed by a factor of 1/|b| and shifted right by h.
    topic_code: "1.12"
  - front: f(x − 3) vs f(x + 3) → direction of shift
    back: |
      f(x − 3) is the graph of f moved right 3; f(x + 3) is moved left 3. The value f(c) now appears at the input c + 3 (or c − 3).
    topic_code: "1.12"
  - front: f(x) + 4 → effect on the graph
    back: |
      Every output increases by 4, so the graph moves up 4. Rates of change are unchanged; zeros generally move.
    topic_code: "1.12"
  - front: 3f(x) → effect on the graph
    back: |
      A vertical stretch by a factor of 3: every output is tripled. Points on the x-axis stay put, so zeros do not change.
    topic_code: "1.12"
  - front: f(2x) → effect on the graph
    back: |
      A horizontal compression by a factor of 1/2: the output f(c) now occurs at x = c/2. A zero at 6 moves to 3.
    topic_code: "1.12"
  - front: f(x/3) → effect on the graph
    back: |
      A horizontal stretch by a factor of 3 (b = 1/3): the output f(c) now occurs at x = 3c. A zero at 2 moves to 6.
    topic_code: "1.12"
  - front: −f(x) vs f(−x) → which reflection
    back: |
      −f(x) reflects over the x-axis (outputs change sign); f(−x) reflects over the y-axis (inputs change sign).
    topic_code: "1.12"
  - front: Point rule for a · f(b(x − h)) + k → formula
    back: |
      (x₀, y₀) on f moves to (x₀/b + h, a·y₀ + k) on g. Inputs: divide by b, add h. Outputs: multiply by a, add k.
    topic_code: "1.12"
  - front: (2, −4) on f → point on 3f(x + 5) − 1
    back: |
      (2 − 5, 3(−4) − 1) = (−3, −13). Check: g(−3) = 3f(2) − 1 = −13.
    topic_code: "1.12"
  - front: f(2x − 6) → describe the transformation
    back: |
      Factor: f(2(x − 3)). Compress horizontally by a factor of 1/2, then shift right 3 (not 6).
    topic_code: "1.12"
  - front: f(3x + 9) → describe the transformation
    back: |
      f(3(x + 3)): compress horizontally by a factor of 1/3, then shift left 3.
    topic_code: "1.12"
  - front: Transformed table for f(x − 3) + 1 → which inputs to use
    back: |
      Inputs where x − 3 is in f's table. If f is known at 0 to 4, use x = 3 to 7, and add 1 to each output.
    topic_code: "1.12"
  - front: Zeros of f(x) = x³ − 4x → zeros of f(2x)
    back: |
      f has zeros −2, 0, 2. f(2x) is zero when 2x is one of these, so x = −1, 0, 1.
    topic_code: "1.12"
  - front: Zeros under a vertical dilation or reflection → what changes
    back: |
      Nothing. a · f(x) is zero exactly where f(x) is zero, for any nonzero a, including a = −1.
    topic_code: "1.12"
  - front: Zeros under f(x) + k → what changes
    back: |
      They must be found again: a vertical shift can create, remove or move zeros in ways no simple rule predicts.
    topic_code: "1.12"
  - front: Vertical asymptote x = c of f → under a · f(b(x − h)) + k
    back: |
      Moves to x = c/b + h. Only the input parameters affect a vertical asymptote.
    topic_code: "1.12"
  - front: Horizontal asymptote y = L of f → under a · f(b(x − h)) + k
    back: |
      Moves to y = aL + k. Only the output parameters affect a horizontal asymptote.
    topic_code: "1.12"
  - front: (2x + 7)/(x + 3) → as a transformation of 1/x
    back: |
      It equals 2 + 1/(x + 3): 1/x shifted left 3 and up 2. Vertical asymptote x = −3, horizontal asymptote y = 2.
    topic_code: "1.12"
  - front: Domain [−2, 4] of f → domain of f(2(x − 1))
    back: |
      Need −2 ≤ 2(x − 1) ≤ 4, so −1 ≤ x − 1 ≤ 2 and 0 ≤ x ≤ 3. Domain [0, 3].
    topic_code: "1.12"
  - front: Range [−1, 5] of f → range of −3f(x) + 2
    back: |
      Each output y becomes −3y + 2: −1 → 5 and 5 → −13. Range [−13, 5]; the negative a reverses the endpoints.
    topic_code: "1.12"
  - front: Maximum of f under a negative vertical dilation → what it becomes
    back: |
      A minimum. With a < 0 every output changes sign, so the highest point becomes the lowest and concave up becomes concave down.
    topic_code: "1.12"
  - front: Reflect x² over the x-axis, stretch by 3, shift right 2 and up 5 → formula
    back: |
      g(x) = −3(x − 2)² + 5, with vertex (2, 5) and opening down.
    topic_code: "1.12"
  - front: Transformation of 1/x with asymptotes x = 1, y = −2 through (2, 1) → formula
    back: |
      g(x) = a/(x − 1) − 2 and g(2) = a − 2 = 1, so a = 3: g(x) = 3/(x − 1) − 2.
    topic_code: "1.12"
  - front: Stretch by 2 then shift up 3, vs shift up 3 then stretch by 2 → formulas
    back: |
      2f(x) + 3 versus 2(f(x) + 3) = 2f(x) + 6. Order matters when both act on outputs.
    topic_code: "1.12"
  - front: Even function under f(−x) → what happens
    back: |
      Nothing: f(−x) = f(x), so reflecting over the y-axis leaves the graph unchanged. Example: x⁴ − 3x².
    topic_code: "1.12"
  - front: Average rate of change under a · f(x) + k → effect
    back: |
      Every average rate of change is multiplied by a; adding k changes none of them, since both endpoint values shift equally.
    topic_code: "1.12"
  - front: Error-spot → "f(x + 2) is f shifted right 2"
    back: |
      It is shifted left 2. f(x + 2) at x = c gives f(c + 2), so the value f's graph had at c + 2 now appears at c, two units to the left.
    topic_code: "1.12"
  - front: Error-spot → "f(2x) stretches the graph horizontally by 2"
    back: |
      It compresses horizontally by a factor of 1/2. The value f(6) is reached at x = 3, closer to the y-axis.
    topic_code: "1.12"
  - front: Error-spot → "f has zeros 1 and 4, so f(x) − 2 has zeros −1 and 2"
    back: |
      A vertical shift does not move the zeros sideways. f(x) − 2 = 0 means f(x) = 2, which has to be solved from f itself.
    topic_code: "1.12"

quiz:
  description: |
    23 questions · about 45 minutes · mostly on this week (topic 1.12: translations, dilations and reflections,
    the point rule, transformed tables, and the effect on zeros, asymptotes, domain and range), with about a third
    reviewing weeks 1 to 7 (rates of change, polynomial behavior, zeros and holes of rational functions, and
    equivalent forms). Opens with a shared-context set of four questions on one table of values. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically;
    the short answers and the long answer are graded by your teacher against the scoring notes. No calculator is
    needed.
  questions:
    # ---- Stimulus set: a table of values and a transformation (1.12, 1.3)
    - slug: precalc-u01-w08-q01
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      stimulus: |
        Selected values of a function f are shown. The function g is defined by g(x) = 3f(x − 1) − 4.

        | x | −2 | −1 | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|---|---|
        | f(x) | 5 | 2 | 1 | 2 | 5 | 10 |
      prompt: |
        What is the value of g(2)?
      options:
        - "26"
        - "11"
        - "−6"
        - "2"
      option_explanations:
        - |
          This evaluates f at 2 + 1 = 3 instead of 2 − 1 = 1; g(2) uses f(x − 1).
        - |
          This uses f(2) and ignores the shift inside f; the input to f is 2 − 1 = 1.
        - |
          This subtracts 4 before multiplying, 3(f(1) − 4); the order in 3f(x − 1) − 4 is multiply, then subtract.
        - |
          Correct. g(2) = 3f(2 − 1) − 4 = 3f(1) − 4 = 3(2) − 4 = 2.
      answer: 3
    - slug: precalc-u01-w08-q02
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      stimulus: |
        Selected values of a function f are shown. The function g is defined by g(x) = 3f(x − 1) − 4.

        | x | −2 | −1 | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|---|---|
        | f(x) | 5 | 2 | 1 | 2 | 5 | 10 |
      prompt: |
        The point (0, 1) is on the graph of f. Which point must be on the graph of g?
      options:
        - "(−1, −1)"
        - "(1, −1)"
        - "(1, 3)"
        - "(1, −9)"
      option_explanations:
        - |
          The output is right but the shift goes the wrong way: f(x − 1) moves the graph right 1, so the input is 0 + 1 = 1.
        - |
          Correct. The input moves right 1 to x = 1, and the output becomes 3(1) − 4 = −1. Check: g(1) = 3f(0) − 4 = −1.
        - |
          This applies the vertical stretch but forgets the vertical shift of −4.
        - |
          This computes 3(1 − 4), shifting before stretching; the output rule is 3y − 4.
      answer: 1
    - slug: precalc-u01-w08-q03
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      stimulus: |
        Selected values of a function f are shown. The function g is defined by g(x) = 3f(x − 1) − 4.

        | x | −2 | −1 | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|---|---|
        | f(x) | 5 | 2 | 1 | 2 | 5 | 10 |
      prompt: |
        Based on the table, for which values of x is g(x) = 11?
      options:
        - "x = −1 and x = 3"
        - "x = −2 and x = 2"
        - "x = −3 and x = 1"
        - "x = 3 only"
      option_explanations:
        - |
          Correct. 3f(x − 1) − 4 = 11 means f(x − 1) = 5, which happens when x − 1 = −2 or x − 1 = 2, so x = −1 or x = 3.
        - |
          These are the inputs where f itself equals 5; each must be shifted right 1 for g.
        - |
          These shift the inputs left instead of right; x − 1 = −2 gives x = −1, not −3.
        - |
          f(x − 1) = 5 has two solutions in the table: x − 1 = 2 and also x − 1 = −2, since f(−2) = 5.
      answer: 0
    - slug: precalc-u01-w08-q04
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      stimulus: |
        Selected values of a function f are shown. The function g is defined by g(x) = 3f(x − 1) − 4.

        | x | −2 | −1 | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|---|---|
        | f(x) | 5 | 2 | 1 | 2 | 5 | 10 |
      prompt: |
        Which statement about the average rates of change of f over the consecutive intervals [−2, −1], [−1, 0], …, [2, 3] is true?
      options:
        - "They are constant, so f could be linear."
        - "They decrease by 2 each time, so the graph of f is concave down."
        - "They increase by 2 each time, so the graph of f is concave up."
        - "They increase by 2 each time, so the graph of f is concave down."
      option_explanations:
        - |
          The rates are −3, −1, 1, 3 and 5, which are not equal, so f is not linear.
        - |
          From −3 to −1 to 1 the rates are getting larger, not smaller.
        - |
          Correct. The rates are −3, −1, 1, 3, 5, increasing by 2 each time; increasing rates of change mean concave up, consistent with a quadratic.
        - |
          The arithmetic is right, but increasing rates of change correspond to concave up, not concave down.
      answer: 2
    # ---- Independent items
    - slug: precalc-u01-w08-q05
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      prompt: |
        Which sequence of transformations takes the graph of y = f(x) to the graph of y = −2f(x) + 3?
      options:
        - "A vertical stretch by a factor of 2, a reflection over the x-axis, then a translation up 3"
        - "A horizontal compression by a factor of 1/2, a reflection over the y-axis, then a translation up 3"
        - "A vertical stretch by a factor of 2, a reflection over the x-axis, then a translation down 3"
        - "A vertical stretch by a factor of 2, a reflection over the y-axis, then a translation up 3"
      option_explanations:
        - |
          Correct. The −2 outside f multiplies outputs by 2 and changes their sign (reflection over the x-axis), and the +3 moves the graph up.
        - |
          The −2 is outside f, so it acts on outputs (vertical), not on inputs (horizontal).
        - |
          +3 added to the outputs moves the graph up, not down.
        - |
          A negative factor outside f changes the sign of outputs, which is a reflection over the x-axis; f(−x) would reflect over the y-axis.
      answer: 0
    - slug: precalc-u01-w08-q06
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      prompt: |
        Which description takes the graph of y = f(x) to the graph of y = f(2x − 6)?
      options:
        - "A horizontal compression by a factor of 1/2, then a translation right 6"
        - "A horizontal stretch by a factor of 2, then a translation right 3"
        - "A horizontal compression by a factor of 1/2, then a translation right 3"
        - "A horizontal compression by a factor of 1/2, then a translation left 3"
      option_explanations:
        - |
          After compressing, the shift is read from the factored form 2(x − 3), so it is 3 units, not 6.
        - |
          Multiplying the input by 2 compresses the graph horizontally; it does not stretch it.
        - |
          Correct. f(2x − 6) = f(2(x − 3)): compress horizontally by a factor of 1/2, then shift right 3.
        - |
          The factor is (x − 3), which shifts right; (x + 3) would shift left.
      answer: 2
    - slug: precalc-u01-w08-q07
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      prompt: |
        The function g is given by g(x) = −1/(x + 4) − 3. What are the asymptotes of the graph of g?
      options:
        - "Vertical x = 4, horizontal y = −3"
        - "Vertical x = −4, horizontal y = 3"
        - "Vertical x = −3, horizontal y = −4"
        - "Vertical x = −4, horizontal y = −3"
      option_explanations:
        - |
          The factor (x + 4) is zero at x = −4; the graph of 1/x has moved left 4, not right.
        - |
          The −3 outside the fraction moves the horizontal asymptote down 3, to y = −3.
        - |
          These are swapped: the input shift gives the vertical asymptote and the output shift gives the horizontal one.
        - |
          Correct. g is 1/x reflected over the x-axis, shifted left 4 and down 3, so its asymptotes move from x = 0, y = 0 to x = −4, y = −3.
      answer: 3
    - slug: precalc-u01-w08-q08
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      prompt: |
        A polynomial f has zeros −3, 1 and 4 only. What are the zeros of g(x) = f(x/2)?
      options:
        - "−3/2, 1/2 and 2"
        - "−6, 2 and 8"
        - "−3, 1 and 4"
        - "−5, −1 and 2"
      option_explanations:
        - |
          This divides the zeros by 2. g(x) = 0 when x/2 is a zero of f, so x is twice each zero.
        - |
          Correct. g(x) = 0 when x/2 = −3, 1 or 4, that is, x = −6, 2 or 8: a horizontal stretch by a factor of 2.
        - |
          A horizontal dilation moves every nonzero zero; only a vertical dilation would leave them in place.
        - |
          This shifts each zero left 2, which would be f(x + 2), not f(x/2).
      answer: 1
    - slug: precalc-u01-w08-q09
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      prompt: |
        A function f has domain [−2, 4]. What is the domain of g(x) = f(2(x − 1))?
      options:
        - "[−4, 8]"
        - "[−1, 2]"
        - "[0, 3]"
        - "[−3, 9]"
      option_explanations:
        - |
          This doubles the endpoints, a horizontal stretch, and forgets the shift; f(2(x − 1)) compresses instead.
        - |
          This compresses the domain correctly but forgets the translation right 1.
        - |
          Correct. Need −2 ≤ 2(x − 1) ≤ 4, so −1 ≤ x − 1 ≤ 2 and 0 ≤ x ≤ 3.
        - |
          This stretches by 2 and shifts by 1 in the wrong order and direction; solve −2 ≤ 2(x − 1) ≤ 4 directly.
      answer: 2
    - slug: precalc-u01-w08-q10
      type: multiple_choice
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      prompt: |
        Which expression is equivalent to (2x + 7)/(x + 3) for all x ≠ −3?
      options:
        - "2 + 1/(x + 3)"
        - "2 + 7/(x + 3)"
        - "2x + 1/(x + 3)"
        - "2 − 1/(x + 3)"
      option_explanations:
        - |
          Correct. 2(x + 3) = 2x + 6, and 2x + 7 − (2x + 6) = 1, so the quotient is 2 with remainder 1.
        - |
          The remainder is what is left after subtracting 2(x + 3) = 2x + 6 from 2x + 7, which is 1, not 7.
        - |
          The quotient of 2x by x is the constant 2, not 2x.
        - |
          The sign of the remainder is wrong: 2x + 7 − (2x + 6) = +1.
      answer: 0
    - slug: precalc-u01-w08-q11
      type: multiple_choice
      topic_code: "1.6"
      source: "AP Precalculus CED, Topic 1.6"
      points: 1
      prompt: |
        Which describes the end behavior of p(x) = −(x − 1)⁴ + 3?
      options:
        - "lim as x → ±∞ of p(x) = 3"
        - "lim as x → ±∞ of p(x) = −∞"
        - "lim as x → −∞ of p(x) = ∞ and lim as x → ∞ of p(x) = −∞"
        - "lim as x → ±∞ of p(x) = ∞"
      option_explanations:
        - |
          3 is the maximum value of p (at x = 1), not a limit; a polynomial of degree 4 is unbounded at both ends.
        - |
          Correct. Expanded, the leading term is −x⁴: even degree and negative coefficient, so both ends go down.
        - |
          Opposite ends belong to odd-degree polynomials; this one has degree 4.
        - |
          The negative sign in front reflects x⁴ over the x-axis, so both ends go down, not up.
      answer: 1
    - slug: precalc-u01-w08-q12
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Precalculus CED, Topic 1.9"
      points: 1
      prompt: |
        Let h(x) = (x + 3)/(x − 1)². Which statement is true?
      options:
        - "lim as x → 1⁻ of h(x) = −∞ and lim as x → 1⁺ of h(x) = ∞"
        - "lim as x → 1 of h(x) = 4, so the graph has a hole at x = 1."
        - "lim as x → 1⁻ of h(x) = ∞ and lim as x → 1⁺ of h(x) = −∞"
        - "lim as x → 1⁻ of h(x) = ∞ and lim as x → 1⁺ of h(x) = ∞"
      option_explanations:
        - |
          (x − 1)² is positive on both sides of 1, so the sign does not change across the asymptote.
        - |
          Nothing cancels, so x = 1 is a vertical asymptote; 4 is just the numerator's value there.
        - |
          The squared factor is positive on both sides and the numerator is near 4, so neither side goes to −∞.
        - |
          Correct. Near 1 the numerator is about 4 and (x − 1)² is a small positive number on both sides, so h(x) → ∞ from both directions.
      answer: 3
    - slug: precalc-u01-w08-q13
      type: multi_select
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 2
      partial_credit: true
      prompt: |
        A rational function f has a zero at x = 1, a vertical asymptote x = 4 and a horizontal asymptote y = 0. Let g(x) = f(x + 2) − 3. Which statements must be true? Select all that apply.
      options:
        - "The graph of g has the vertical asymptote x = 2."
        - "The graph of g has the vertical asymptote x = 6."
        - "The graph of g has the horizontal asymptote y = −3."
        - "g(−1) = 0"
        - "g(−1) = −3"
      option_explanations:
        - |
          Correct. f(x + 2) is f shifted left 2, so the asymptote x = 4 moves to x = 2 (where x + 2 = 4).
        - |
          This shifts the asymptote right 2; the +2 inside f shifts the graph left.
        - |
          Correct. The horizontal asymptote y = 0 moves down 3 with the outputs.
        - |
          g(−1) = f(1) − 3 = 0 − 3 = −3. The vertical shift moves the zero off the axis.
        - |
          Correct. g(−1) = f(−1 + 2) − 3 = f(1) − 3 = −3.
      answer: [0, 2, 4]
    - slug: precalc-u01-w08-q14
      type: multi_select
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 2
      partial_credit: true
      prompt: |
        Let p(x) = (x − 2)²(x + 1)(x² + 4). Which statements are true? Select all that apply.
      options:
        - "p has degree 5."
        - "The graph of p touches the x-axis at x = 2 without crossing it."
        - "p has exactly three distinct real zeros."
        - "2i and −2i are zeros of p."
        - "p(x) > 0 for every x > 2."
      option_explanations:
        - |
          Correct. The degrees of the factors add: 2 + 1 + 2 = 5.
        - |
          Correct. x = 2 has even multiplicity (2), so the sign of p does not change there and the graph bounces.
        - |
          The distinct real zeros are 2 and −1 only; x² + 4 has no real zeros.
        - |
          Correct. x² + 4 = 0 gives x² = −4, so x = ±2i, a conjugate pair.
        - |
          Correct. For x > 2 every factor is positive: (x − 2)² > 0, x + 1 > 0 and x² + 4 > 0.
      answer: [0, 1, 3, 4]
    - slug: precalc-u01-w08-q15
      type: true_false
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      prompt: |
        True or false: The graph of y = f(−x) is the reflection of the graph of y = f(x) over the x-axis.
      answer: false
      explanation: |
        False. Replacing x by −x changes the sign of the input, which reflects the graph over the y-axis. The reflection over the x-axis is y = −f(x).
    - slug: precalc-u01-w08-q16
      type: true_false
      topic_code: "1.10"
      source: "AP Precalculus CED, Topic 1.10"
      points: 1
      prompt: |
        True or false: The graphs of y = (x² − 25)/(x − 5) and y = x + 5 are identical.
      answer: false
      explanation: |
        False. The two expressions agree for every x ≠ 5, but the first is undefined at x = 5, so its graph is the line y = x + 5 with a hole at (5, 10).
    - slug: precalc-u01-w08-q17
