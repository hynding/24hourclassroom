      points: 3
      prompt: |
        Let f(x) = 1/x² and g(x) = −2/(x − 3)² + 4.

        (a) Write g in terms of f and describe, in order, the transformations that take the graph of f to the graph of g.
        (b) State the equations of the vertical and horizontal asymptotes of g.
        (c) The range of f is (0, ∞). Find the range of g and explain how you found it.
      answer: |
        (a) g(x) = −2f(x − 3) + 4. Translate right 3, stretch vertically by a factor of 2, reflect over the x-axis, then translate up 4. (The stretch and reflection may come in either order, as long as both come before the vertical translation.)
        (b) Vertical asymptote x = 3; horizontal asymptote y = 4.
        (c) Each output y > 0 of f becomes −2y + 4, which is less than 4 and takes every value below 4. Range (−∞, 4).
      explanation: |
        Three points, one per part. (a) the formula and all four transformations with the vertical shift last. (b) both asymptotes. (c) range (−∞, 4) with the reasoning that −2y + 4 < 4 for y > 0; the endpoint must be excluded.
    - slug: precalc-u01-w08-q23
      type: long_answer
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 6
      prompt: |
        Let f(x) = x² − 4x, whose graph is a parabola with vertex (2, −4) and zeros 0 and 4. The function g is defined by g(x) = −2f(x + 1) + 3.

        (A) (i) Describe the transformations that take the graph of f to the graph of g.
        (ii) Find the coordinates of the vertex of the graph of g, and state whether that vertex is a maximum or a minimum.

        (B) (i) Write g(x) in standard form.
        (ii) Explain why the zeros of g are not found by shifting the zeros of f left 1, and find the exact zeros of g.

        (C) (i) The average rate of change of f over [0, 2] is −2. Without computing g at any point, find the average rate of change of g over [−1, 1]. Explain your reasoning.
        (ii) State the range of g.
      answer: |
        (A)(i) Translate left 1, stretch vertically by a factor of 2, reflect over the x-axis, then translate up 3.
        (ii) The vertex (2, −4) moves to (2 − 1, −2(−4) + 3) = (1, 11). Because a = −2 < 0 the parabola opens down, so (1, 11) is a maximum.
        (B)(i) g(x) = −2[(x + 1)² − 4(x + 1)] + 3 = −2(x² − 2x − 3) + 3 = −2x² + 4x + 9.
        (ii) The vertical shift of +3 changes which inputs give an output of 0, so the zeros of f do not simply move. Solving −2x² + 4x + 9 = 0: x = (4 ± √(16 + 72))/4 = (4 ± √88)/4 = 1 ± √22/2.
        (C)(i) The interval [−1, 1] for g corresponds to inputs x + 1 in [0, 2] for f. The vertical dilation multiplies every average rate of change by −2 and the vertical shift adds nothing, so the average rate of change of g is −2 · (−2) = 4. (Check: g(1) = 11, g(−1) = 3, and (11 − 3)/2 = 4.)
        (ii) The maximum value is 11 and the parabola opens down, so the range is (−∞, 11].
      explanation: |
        Six points, one per sub-part. (A)(i) all four transformations, with the vertical shift after the dilation and reflection. (A)(ii) vertex (1, 11) identified as a maximum. (B)(i) correct standard form. (B)(ii) a valid reason (the vertical shift changes where the output is 0) and both exact zeros. (C)(i) 4 with the interval correspondence and the factor −2 explained. (C)(ii) (−∞, 11].
