      source: "AP Precalculus CED, Topic 1.7"
      points: 1
      prompt: |
        A hypothetical tank starts with 10 L of water holding 2 g of salt. Brine flows in at 1 L per minute and nothing flows out, so after t minutes the concentration is C(t) = (2 + 0.3t)/(10 + t) grams per litre. What value, in grams per litre, does C(t) approach as t → ∞? Give the exact value.
      answer: { value: 0.3, tolerance: 0.001 }
      explanation: |
        Numerator and denominator both have degree 1, so the limit is the ratio of leading coefficients, 0.3/1 = 0.3 g/L: the concentration of the incoming brine.
    - slug: precalc-u01-w05-q20
      type: numeric
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        What is the average rate of change of f(x) = 3x² − 4x on the interval [1, 5]? Give the exact value.
      answer: { value: 14, tolerance: 0 }
      explanation: |
        f(1) = 3 − 4 = −1 and f(5) = 75 − 20 = 55, so (55 − (−1))/(5 − 1) = 56/4 = 14. (Shortcut for a quadratic: a(p + q) + b = 3 · 6 − 4 = 14.)
    - slug: precalc-u01-w05-q21
      type: short_answer
      topic_code: "1.6"
      source: "AP Precalculus CED, Topic 1.6"
      points: 3
      prompt: |
        Let q(x) = (2 − x)(x + 1)²(3x − 1).

        (a) Without expanding fully, find the degree and leading coefficient of q.
        (b) Write the end behaviour of q using limit notation.
        (c) Explain why q has a global maximum but no global minimum.
      answer: |
        (a) Leading term (−x)(x²)(3x) = −3x⁴: degree 4, leading coefficient −3.
        (b) lim as x → −∞ of q(x) = −∞ and lim as x → ∞ of q(x) = −∞.
        (c) Both ends go to −∞, so the outputs are unbounded below (no global minimum). A polynomial is continuous, so with both ends falling, the graph has a highest point, the largest of its relative maxima, which is the global maximum.
      explanation: |
        Three points, one per part. (a) degree 4 and leading coefficient −3. (b) both limits correct, in limit notation. (c) a reason tied to both ends going to −∞.
    - slug: precalc-u01-w05-q22
      type: short_answer
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 3
      prompt: |
        Consider the inequality x⁴ − 5x² + 4 ≤ 0.

        (a) Factor x⁴ − 5x² + 4 completely.
        (b) List the zeros and their multiplicities.
        (c) Solve the inequality using a sign chart.
      answer: |
        (a) (x² − 1)(x² − 4) = (x − 1)(x + 1)(x − 2)(x + 2).
        (b) −2, −1, 1, 2, each of multiplicity 1.
        (c) The leading coefficient is positive and every zero is simple, so the sign alternates from the right: positive for x > 2, negative on (1, 2), positive on (−1, 1), negative on (−2, −1), positive for x < −2. Including the zeros (≤): [−2, −1] ∪ [1, 2].
      explanation: |
        Three points, one per part. (a) complete factorisation into four linear factors. (b) all four zeros with multiplicity 1. (c) [−2, −1] ∪ [1, 2] with endpoints included, supported by a sign chart or test values.
    - slug: precalc-u01-w05-q23
      type: short_answer
      topic_code: "1.7"
      source: "AP Precalculus CED, Topic 1.7"
      points: 3
      prompt: |
        Let r(x) = (x² − 4x + 5)/(x − 2).

        (a) Show that r(x) = (x − 2) + 1/(x − 2) for x ≠ 2.
        (b) State the slant asymptote of the graph of r and describe the end behaviour of r with limit notation.
        (c) For large positive x, is the graph of r above or below its slant asymptote? Explain.
      answer: |
        (a) x² − 4x + 5 = (x² − 4x + 4) + 1 = (x − 2)² + 1. Dividing by x − 2 gives (x − 2) + 1/(x − 2).
        (b) As x → ±∞, 1/(x − 2) → 0, so the slant asymptote is y = x − 2. lim as x → ∞ of r(x) = ∞ and lim as x → −∞ of r(x) = −∞.
        (c) Above: for x > 2, 1/(x − 2) > 0, so r(x) is slightly greater than x − 2.
      explanation: |
        Three points, one per part. (a) rewriting the numerator as (x − 2)² + 1 (or an equivalent division). (b) y = x − 2 and both limits. (c) above, with the sign of 1/(x − 2) as the reason.
    - slug: precalc-u01-w05-q24
      type: long_answer
      topic_code: "1.7"
      source: "AP Precalculus CED, Topic 1.7"
      points: 6
      prompt: |
        A hypothetical model gives the concentration of a medicine in a patient's blood as C(t) = 8t/(t² + 4) milligrams per litre, t hours after a dose, for t ≥ 0. A graph shows that C has its only maximum at t = 2.

        (A) (i) Find C(2) and C(6), and the average rate of change of C over 2 ≤ t ≤ 6. Include units.
        (ii) Interpret the average rate of change in context.

        (B) Find lim as t → ∞ of C(t). Justify your answer by comparing degrees, and interpret the result in context.

        (C) State the maximum concentration, and the intervals of t on which C is increasing and decreasing.

        (D) The medicine is effective while the concentration is at least 1 mg/L. Find the interval of time during which the medicine is effective. Give exact values and decimals to the nearest hundredth.
      answer: |
        (A)(i) C(2) = 16/8 = 2 mg/L and C(6) = 48/40 = 1.2 mg/L. Average rate = (1.2 − 2)/(6 − 2) = −0.8/4 = −0.2 mg/L per hour.
        (ii) Between 2 and 6 hours after the dose, the concentration fell by 0.2 mg/L per hour on average.
        (B) The numerator has degree 1 and the denominator degree 2; the ratio of leading terms 8t/t² = 8/t → 0. So lim as t → ∞ of C(t) = 0: in the long run the medicine is cleared from the blood.
        (C) Maximum concentration C(2) = 2 mg/L. C is increasing on 0 < t < 2 and decreasing for t > 2.
        (D) 8t/(t² + 4) ≥ 1 with t² + 4 > 0 gives 8t ≥ t² + 4, so t² − 8t + 4 ≤ 0. The zeros of t² − 8t + 4 are t = 4 ± 2√3, and the upward parabola is ≤ 0 between them. Effective for 4 − 2√3 ≤ t ≤ 4 + 2√3, about 0.54 ≤ t ≤ 7.46 hours (roughly 6.93 hours in all).
      explanation: |
        Six points: (A) 2 points: 1 for C(2) = 2, C(6) = 1.2 and the rate −0.2 mg/L per hour; 1 for an interpretation with units and the time interval. (B) 1 point for 0 with a degree comparison and a contextual interpretation. (C) 1 point for the maximum 2 mg/L with both intervals. (D) 2 points: 1 for reaching t² − 8t + 4 ≤ 0 (multiplying by the positive denominator), 1 for the interval [4 − 2√3, 4 + 2√3] ≈ [0.54, 7.46].
