      source: "AP Precalculus CED, Topic 1.10"
      points: 3
      prompt: |
        Let r(x) = (x² − x − 6)/(x² − 5x + 6).

        (a) Factor r, state its domain, and give the coordinates of any hole.
        (b) Identify any vertical asymptote and describe the behavior of r on each side of it using one-sided limit notation. Justify the signs.
        (c) Find the real zeros of r and its vertical intercept.
      answer: |
        (a) r(x) = (x − 3)(x + 2)/((x − 3)(x − 2)). Domain: all real x except 2 and 3. The factor (x − 3) cancels, leaving (x + 2)/(x − 2), which is 5/1 = 5 at x = 3, so there is a hole at (3, 5).
        (b) Vertical asymptote x = 2. Near 2 the numerator x + 2 is about 4 (positive). For x slightly more than 2, x − 2 is small and positive, so lim as x → 2⁺ of r(x) = ∞; for x slightly less than 2, x − 2 is small and negative, so lim as x → 2⁻ of r(x) = −∞.
        (c) The only real zero is x = −2 (x = 3 is excluded). r(0) = (−6)/6 = −1, so the vertical intercept is (0, −1).
      explanation: |
        Three points, one per part. (a) correct factoring, both excluded values and the hole (3, 5). (b) x = 2 with both one-sided limits correct and a sign justification. (c) the zero −2 only (not 3) and the intercept (0, −1).
    - slug: precalc-u01-w06-q22
