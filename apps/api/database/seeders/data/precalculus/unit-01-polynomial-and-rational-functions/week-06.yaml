        (a) List the critical values and say which come from the numerator and which from the denominator.
        (b) Give the sign of the expression on each interval, explaining what happens to the sign at x = 1.
        (c) State the solution set and justify which endpoints are included.
      answer: |
        (a) Numerator zeros: 1 (multiplicity 2) and −3. Denominator zero: 4.
        (b) x < −3: (+)(−)/(−) positive. −3 < x < 1: (+)(+)/(−) negative. 1 < x < 4: (+)(+)/(−) negative. x > 4: positive. The sign does not change at x = 1 because (x − 1)² has even multiplicity and is never negative.
        (c) −3 ≤ x < 4. Both −3 and 1 make the expression 0, so they are included (1 is already inside the interval); 4 makes the denominator zero, so it is excluded.
      explanation: |
        Three points, one per part. (a) all three critical values correctly sorted. (b) four correct signs with the even-multiplicity explanation at x = 1. (c) the solution −3 ≤ x < 4 with a reason for including −3 and excluding 4.
    - slug: precalc-u01-w06-q23
      type: long_answer
      topic_code: "1.9"
      source: "AP Precalculus CED, Topic 1.9"
      points: 6
      prompt: |
        The function g is given by g(x) = (2x² − 8)/(x² − x − 6).

        (A) (i) Write g in factored form and state the domain of g.
        (ii) Find the real zeros of g. Explain why x = −2 is not a zero of g even though the numerator is 0 there.

        (B) (i) The graph of g has a hole. Find its coordinates and express the behavior of g near that input using limit notation.
        (ii) Identify the vertical asymptote of the graph of g. Use one-sided limits to describe the behavior of g on each side, and justify your answer.

        (C) (i) Solve g(x) > 0. Show a sign analysis.
        (ii) Describe the end behavior of g using limit notation.
      answer: |
        (A)(i) g(x) = 2(x − 2)(x + 2)/((x − 3)(x + 2)). Domain: all real x except −2 and 3.
        (ii) The only zero is x = 2. At x = −2 the denominator is also 0, so g(−2) is undefined; an input outside the domain cannot be a zero.
        (B)(i) For x ≠ −2, g(x) = 2(x − 2)/(x − 3). At x = −2 this is 2(−4)/(−5) = 8/5. Hole at (−2, 8/5), and lim as x → −2 of g(x) = 8/5.
        (ii) x = 3. Near 3 the simplified numerator 2(x − 2) is about 2 (positive). For x just above 3, x − 3 is small and positive, so lim as x → 3⁺ of g(x) = ∞. For x just below 3, x − 3 is small and negative, so lim as x → 3⁻ of g(x) = −∞.
        (C)(i) Critical values −2 (hole), 2 (zero), 3 (asymptote). Using 2(x − 2)/(x − 3): positive for x < 2, negative on (2, 3), positive for x > 3. Excluding −2, where g is undefined: g(x) > 0 for x < −2, −2 < x < 2, or x > 3.
        (ii) Numerator and denominator both have degree 2 with leading coefficients 2 and 1, so lim as x → ∞ of g(x) = 2 and lim as x → −∞ of g(x) = 2 (horizontal asymptote y = 2).
