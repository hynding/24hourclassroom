week: 6
unit: 1
title: "Zeros, Vertical Asymptotes and Holes of Rational Functions"
topics: ["1.8", "1.9", "1.10"]
guide: guides/week-06.md
guide_description: |
  How to factor a rational function and sort every special input into a zero, a vertical asymptote or a hole;
  solving rational inequalities with a sign chart; one-sided limit notation for the behaviour on each side of a
  vertical asymptote, including the even-multiplicity case; and finding the coordinates of a hole by evaluating
  the simplified function. Worked examples include a full classification of (2x² + 2x − 12)/(x² − 4), the
  inequality 2x/(x + 1) ≤ 1, and the hole-on-the-axis case (x − 1)²(x + 2)/((x − 1)(x − 4)).
flashcards_description: |
  30 cards on zeros of rational functions, rational inequalities, vertical asymptotes and one-sided limits, holes
  and their coordinates, and the multiplicity rules that decide between a hole and an asymptote.

flashcards:
  - front: Zeros of a rational function p(x)/q(x) → where they come from
    back: |
      Real zeros of the numerator p that are in the domain, that is, where q is not also zero. A fraction is 0 only when its top is 0 and its bottom is not.
    topic_code: "1.8"
  - front: Domain of a rational function → which form to read it from
    back: |
      The original, unsimplified form. Every real zero of the original denominator is excluded, even one that cancels later.
    topic_code: "1.8"
  - front: Zeros of (x³ − x)/(x² + x) → list them
    back: |
      Only x = 1. Factored, it is x(x − 1)(x + 1)/(x(x + 1)); 0 and −1 make the denominator zero, so they are holes, not zeros.
    topic_code: "1.8"
  - front: Zeros of (x² + 4)/(x − 1) → how many real ones
    back: |
      None. x² + 4 ≥ 4 for every real x, so the numerator is never zero and the graph never meets the x-axis.
    topic_code: "1.8"
  - front: Rational inequality → the four steps
    back: |
      Get 0 on one side and combine into one fraction; factor; mark every zero of the numerator and denominator on a number line; test the sign on each interval and read off the answer.
    topic_code: "1.8"
  - front: Rational inequality with ≤ or ≥ → which critical values are included
    back: |
      Numerator zeros (where the expression equals 0) are included. Denominator zeros never are: the expression does not exist there.
    topic_code: "1.8"
  - front: Solve (x − 2)(x + 1)/(x − 4) < 0 → answer
    back: |
      Critical values −1, 2, 4. The signs are −, +, −, + from left to right, so the solution is x < −1 or 2 < x < 4.
    topic_code: "1.8"
  - front: Solve 2x/(x + 1) ≤ 1 → first move
    back: |
      Subtract 1 and combine, (x − 1)/(x + 1) ≤ 0, rather than multiplying by x + 1, whose sign is unknown. Solution −1 < x ≤ 1.
    topic_code: "1.8"
  - front: Solve (x + 3)/(x − 1) ≥ 0 → answer
    back: |
      Signs +, −, + around −3 and 1. Include −3 (numerator zero), exclude 1 (denominator zero): x ≤ −3 or x > 1.
    topic_code: "1.8"
  - front: Sign flips in a sign chart → when a factor flips it
    back: |
      A factor of odd multiplicity flips the sign as x passes its zero; an even-multiplicity factor such as (x − 2)² leaves the sign unchanged. This holds in the numerator and the denominator alike.
    topic_code: "1.8"
  - front: Vertical asymptote of a rational function → condition
    back: |
      x = a where the denominator is zero and the factor (x − a) does not cancel completely with the numerator. Near a, the outputs grow without bound.
    topic_code: "1.9"
  - front: lim as x → a⁺ → what the ⁺ means
    back: |
      x approaches a from the right, through values greater than a (a + 0.1, a + 0.01, …). The ⁻ version approaches from the left.
    topic_code: "1.9"
  - front: (x + 1)/(x − 2) near x = 2 → one-sided limits
    back: |
      The numerator is near 3. From the right, x − 2 is small and positive, so the limit is ∞; from the left it is small and negative, so the limit is −∞.
    topic_code: "1.9"
  - front: 1/(x + 1)² near x = −1 → one-sided limits
    back: |
      (x + 1)² is a small positive number on both sides, so both one-sided limits are ∞. An even power in the denominator sends both sides the same way.
    topic_code: "1.9"
  - front: Odd vs even multiplicity at a vertical asymptote → graph behaviour
    back: |
      Odd: the two sides head to opposite infinities (one up, one down). Even: both sides head to the same infinity.
    topic_code: "1.9"
  - front: (x − 5)/((x − 1)(x + 3)) near x = 1 → signs
    back: |
      Right of 1: (−)/((+)(+)) is negative, so −∞. Left of 1: (−)/((−)(+)) is positive, so ∞. Read the sign of each factor just beside the asymptote.
    topic_code: "1.9"
  - front: Table of values near x = a → how it shows an asymptote
    back: |
      Outputs grow without bound in size as x gets closer to a, for example 31, 301, 3001 at a + 0.1, a + 0.01, a + 0.001.
    topic_code: "1.9"
  - front: Can a graph cross its vertical asymptote → answer
    back: |
      No. The function is undefined at x = a, so no point of the graph lies on the line x = a. (A horizontal asymptote can be crossed.)
    topic_code: "1.9"
  - front: Vertical asymptotes of (x + 4)/(x² − 16) → answer
    back: |
      Only x = 4. The denominator is (x − 4)(x + 4), and (x + 4) cancels, giving a hole at x = −4 instead.
    topic_code: "1.9"
  - front: Hole in a rational graph → condition
    back: |
      A factor (x − a) shared by numerator and denominator, with the numerator's multiplicity at least the denominator's. The graph has one missing point at x = a.
    topic_code: "1.10"
  - front: Coordinates of a hole → method
    back: |
      Cancel the common factor, then substitute a into the simplified function. If the result is L, the hole is at (a, L) and lim as x → a of r(x) = L.
    topic_code: "1.10"
  - front: Hole of (x² + 2x − 15)/(x − 3) → coordinates
    back: |
      (x + 5)(x − 3)/(x − 3) = x + 5 for x ≠ 3, so the hole is at (3, 8). The graph is the line y = x + 5 with an open circle there.
    topic_code: "1.10"
  - front: Hole of (2x² + 2x − 12)/(x² − 4) → coordinates
    back: |
      2(x + 3)(x − 2)/((x − 2)(x + 2)) simplifies to 2(x + 3)/(x + 2); at x = 2 that is 10/4 = 5/2. Hole at (2, 5/2).
    topic_code: "1.10"
  - front: Hole of (x² − 1)/(x² − 2x − 3) → coordinates
    back: |
      (x − 1)(x + 1)/((x − 3)(x + 1)) → (x − 1)/(x − 3), which is (−2)/(−4) = 1/2 at x = −1. Hole at (−1, 1/2).
    topic_code: "1.10"
  - front: (x − 1)/(x − 1)³ at x = 1 → hole or asymptote
    back: |
      Vertical asymptote. After cancelling one factor it is 1/(x − 1)², and the denominator is still zero at 1. The denominator's multiplicity was larger.
    topic_code: "1.10"
  - front: Hole of (x − 1)²(x + 2)/((x − 1)(x − 4)) → coordinates
    back: |
      Simplified, (x − 1)(x + 2)/(x − 4) is 0 at x = 1, so the hole is at (1, 0). It sits on the x-axis, but 1 is not a zero because the function is undefined there.
    topic_code: "1.10"
  - front: Hole in limit notation → how to write it
    back: |
      lim as x → a of r(x) = L, a finite number, while r(a) is undefined. Both one-sided limits equal L.
    topic_code: "1.10"
  - front: Error-spot → "x = 3 is a vertical asymptote of (x² − 9)/(x − 3)"
    back: |
      The factor (x − 3) cancels completely: the function equals x + 3 for x ≠ 3. There is a hole at (3, 6), not an asymptote.
    topic_code: "1.10"
  - front: Error-spot → "(x² − 9)/(x² − x − 6) has zeros at 3 and −3"
    back: |
      At x = 3 the denominator (x − 3)(x + 2) is also zero, so the function is undefined there: that is a hole at (3, 6/5). The only zero is −3.
    topic_code: "1.8"
  - front: Error-spot → "(x + 5)/(x − 2) ≤ 0, so the answer is −5 ≤ x ≤ 2"
    back: |
      x = 2 makes the denominator zero, so it can never be in the solution. The correct answer is −5 ≤ x < 2.
    topic_code: "1.8"

quiz:
  description: |
    23 questions · about 45 minutes · mostly on this week (topics 1.8 to 1.10: zeros of rational functions,
    rational inequalities, vertical asymptotes with one-sided limits, and holes), with about a third reviewing
    weeks 1 to 5 (rates of change, polynomial behaviour and zeros, and end behaviour). Opens with a shared-context
    set of four questions on one rational function. Multiple choice, select-all, true/false and numeric items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes. No calculator is needed.
  questions:
    # ---- Stimulus set: one rational function (1.8, 1.9, 1.10, 1.7)
    - slug: precalc-u01-w06-q01
      type: multiple_choice
      topic_code: "1.8"
      source: "AP Precalculus CED, Topic 1.8"
      points: 1
      stimulus: |
        Let r(x) = (2x² + 2x − 12)/(x² − 4), which factors as r(x) = 2(x + 3)(x − 2)/((x − 2)(x + 2)).
      prompt: |
        What are the real zeros of r?
      options:
        - "−3 and 2"
        - "−3 only"
        - "−3, 2 and −2"
        - "2 and −2"
      option_explanations:
        - |
          x = 2 also makes the denominator zero, so r(2) is undefined; 2 is the location of a hole, not a zero.
        - |
          Correct. The numerator is zero at −3 and 2, but 2 is excluded from the domain, so only x = −3 gives r(x) = 0.
        - |
          −2 is a zero of the denominator only, which produces a vertical asymptote, and 2 is a hole.
        - |
          These are the zeros of the denominator, which are excluded from the domain rather than zeros of r.
      answer: 1
    - slug: precalc-u01-w06-q02
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Precalculus CED, Topic 1.9"
      points: 1
      stimulus: |
        Let r(x) = (2x² + 2x − 12)/(x² − 4), which factors as r(x) = 2(x + 3)(x − 2)/((x − 2)(x + 2)).
      prompt: |
        Which statement correctly describes r near x = −2?
      options:
        - "lim as x → −2⁻ of r(x) = ∞ and lim as x → −2⁺ of r(x) = −∞"
        - "lim as x → −2 of r(x) = 1/2, so the graph has a hole at x = −2"
        - "lim as x → −2⁻ of r(x) = ∞ and lim as x → −2⁺ of r(x) = ∞"
        - "lim as x → −2⁻ of r(x) = −∞ and lim as x → −2⁺ of r(x) = ∞"
      option_explanations:
        - |
          The signs are reversed. Just left of −2, x + 2 is negative while 2(x + 3) is near 2, so r is large and negative there.
        - |
          The factor (x + 2) does not cancel, so x = −2 is a vertical asymptote and the outputs are unbounded, not approaching a finite value.
        - |
          Both sides would go the same way only if (x + 2) appeared to an even power; here it has multiplicity 1, so the sides differ.
        - |
          Correct. Simplified, r(x) = 2(x + 3)/(x + 2), with numerator near 2. Left of −2 the denominator is a small negative number (−∞); right of −2 it is small and positive (∞).
      answer: 3
    - slug: precalc-u01-w06-q03
      type: multiple_choice
      topic_code: "1.10"
      source: "AP Precalculus CED, Topic 1.10"
      points: 1
      stimulus: |
        Let r(x) = (2x² + 2x − 12)/(x² − 4), which factors as r(x) = 2(x + 3)(x − 2)/((x − 2)(x + 2)).
      prompt: |
        The graph of r has a hole. What are its coordinates?
      options:
        - "(2, 5/2)"
        - "(2, 0)"
        - "(−2, 1/2)"
        - "(2, 5/4)"
      option_explanations:
        - |
          Correct. Cancelling (x − 2) leaves 2(x + 3)/(x + 2), which equals 2 · 5/4 = 5/2 at x = 2.
        - |
          2 is the x-coordinate, but the y-coordinate comes from the simplified function, not from setting the cancelled factor to 0.
        - |
          (x + 2) does not cancel, so x = −2 is an asymptote; the hole is where the common factor (x − 2) is zero.
        - |
          This drops the factor 2 in the numerator: (x + 3)/(x + 2) at 2 is 5/4, but r has 2(x + 3) on top.
      answer: 0
    - slug: precalc-u01-w06-q04
      type: multiple_choice
      topic_code: "1.7"
      source: "AP Precalculus CED, Topic 1.7"
      points: 1
      stimulus: |
        Let r(x) = (2x² + 2x − 12)/(x² − 4), which factors as r(x) = 2(x + 3)(x − 2)/((x − 2)(x + 2)).
      prompt: |
        Which describes the end behavior of r?
      options:
        - "lim as x → ±∞ of r(x) = 0"
        - "lim as x → ±∞ of r(x) = 3"
        - "lim as x → ±∞ of r(x) = 2"
        - "lim as x → ∞ of r(x) = ∞ and lim as x → −∞ of r(x) = −∞"
      option_explanations:
        - |
          A limit of 0 at both ends happens when the denominator has the higher degree; here the degrees are equal.
        - |
          3 is the ratio of the constant terms, −12/−4; end behavior depends on the leading terms, not the constants.
        - |
          Correct. Both numerator and denominator have degree 2, so r(x) approaches the ratio of leading coefficients, 2/1 = 2, at both ends.
        - |
          Unbounded end behavior requires the numerator's degree to be larger than the denominator's; these degrees are equal.
      answer: 2
    # ---- Independent items
    - slug: precalc-u01-w06-q05
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Precalculus CED, Topic 1.9"
      points: 1
      prompt: |
        Which function satisfies lim as x → 3⁻ of f(x) = −∞ and lim as x → 3⁺ of f(x) = −∞?
      options:
        - "f(x) = 1/(x − 3)²"
        - "f(x) = −1/(x − 3)"
        - "f(x) = −1/(x − 3)²"
        - "f(x) = (x − 3)/(x − 3)²"
      option_explanations:
        - |
          (x − 3)² is positive on both sides of 3, so this function goes to +∞ on both sides, not −∞.
        - |
          With an odd power the two sides differ: left of 3 this is −1/(negative) = +∞, and right of 3 it is −∞.
        - |
          Correct. (x − 3)² is a small positive number on both sides of 3, so −1/(x − 3)² is large and negative from both directions.
        - |
          This simplifies to 1/(x − 3) for x ≠ 3, which goes to −∞ from the left but +∞ from the right.
      answer: 2
    - slug: precalc-u01-w06-q06
      type: multiple_choice
      topic_code: "1.8"
      source: "AP Precalculus CED, Topic 1.8"
      points: 1
      prompt: |
        What are the real zeros of g(x) = (x³ − 4x)/(x² − 2x)?
      options:
        - "−2 only"
        - "0, 2 and −2"
        - "0 and −2"
        - "2 and −2"
      option_explanations:
        - |
          Correct. g(x) = x(x − 2)(x + 2)/(x(x − 2)). The numerator is zero at 0, 2 and −2, but 0 and 2 are excluded from the domain, leaving only −2.
        - |
          These are the zeros of the numerator, but 0 and 2 also make the denominator zero, so g is undefined there.
        - |
          x = 0 makes the denominator x(x − 2) zero, so g(0) does not exist and 0 cannot be a zero.
        - |
          x = 2 makes the denominator zero; g has a hole at x = 2, not a zero.
      answer: 0
    - slug: precalc-u01-w06-q07
      type: multiple_choice
      topic_code: "1.10"
      source: "AP Precalculus CED, Topic 1.10"
      points: 1
      prompt: |
        Which function has a hole at x = 4 (and not a vertical asymptote there)?
      options:
        - "y = (x − 4)/(x² − 8x + 16)"
        - "y = (x + 4)/(x − 4)"
        - "y = (x² − 16)/(x + 4)"
        - "y = (x² − 16)/(x − 4)"
      option_explanations:
        - |
          The denominator is (x − 4)², so one factor remains after cancelling and x = 4 is a vertical asymptote.
        - |
          Nothing cancels; the denominator alone is zero at 4, which gives a vertical asymptote.
        - |
          This function is defined at x = 4 (its value is 0 there); its hole is at x = −4, where x + 4 cancels.
        - |
          Correct. (x − 4)(x + 4)/(x − 4) = x + 4 for x ≠ 4, so the graph is a line with a hole at (4, 8).
      answer: 3
    - slug: precalc-u01-w06-q08
      type: multiple_choice
      topic_code: "1.8"
      source: "AP Precalculus CED, Topic 1.8"
      points: 1
      prompt: |
        What is the solution set of (x − 3)/(x + 4) ≥ 0?
      options:
        - "x ≤ −4 or x ≥ 3"
        - "x < −4 or x ≥ 3"
        - "−4 < x ≤ 3"
        - "−4 ≤ x ≤ 3"
      option_explanations:
        - |
          x = −4 makes the denominator zero, so the expression does not exist there and −4 cannot be included.
        - |
          Correct. The sign is positive for x < −4, negative between −4 and 3, and positive for x > 3. Include 3 (the expression is 0) but not −4.
        - |
          This is where the expression is negative or zero, the solution of ≤ 0 rather than ≥ 0.
        - |
          This is the ≤ 0 region and also wrongly includes −4, where the denominator is zero.
      answer: 1
    - slug: precalc-u01-w06-q09
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Precalculus CED, Topic 1.9"
      points: 1
      stimulus: |
        Selected values of a rational function h are shown.

        | x | 0.9 | 0.99 | 0.999 | 1.001 | 1.01 | 1.1 |
        |---|---|---|---|---|---|---|
        | h(x) | −20 | −200 | −2000 | 2000 | 200 | 20 |
      prompt: |
        Which statement is best supported by the table?
      options:
        - "lim as x → 1⁻ of h(x) = ∞ and lim as x → 1⁺ of h(x) = −∞"
        - "lim as x → 1 of h(x) = 0"
        - "lim as x → 1⁻ of h(x) = −∞ and lim as x → 1⁺ of h(x) = ∞"
        - "The graph of h has a hole at x = 1."
      option_explanations:
        - |
          This swaps the sides. Inputs below 1 (0.9, 0.99, 0.999) give large negative outputs, so the left-hand limit is −∞.
        - |
          The outputs grow in size as x approaches 1; they do not settle near 0 or any other finite number.
        - |
          Correct. From the left the outputs are −20, −200, −2000, decreasing without bound; from the right they are 20, 200, 2000, increasing without bound.
        - |
          At a hole the outputs approach a finite value from both sides. Here they become unbounded, which signals a vertical asymptote.
      answer: 2
    - slug: precalc-u01-w06-q10
      type: multiple_choice
      topic_code: "1.6"
      source: "AP Precalculus CED, Topic 1.6"
      points: 1
      prompt: |
        Let p(x) = −2x⁵ + 7x² + 1. Which describes the end behavior of p?
      options:
        - "lim as x → −∞ of p(x) = ∞ and lim as x → ∞ of p(x) = −∞"
        - "lim as x → −∞ of p(x) = −∞ and lim as x → ∞ of p(x) = ∞"
        - "lim as x → ±∞ of p(x) = −∞"
        - "lim as x → ±∞ of p(x) = ∞"
      option_explanations:
        - |
          Correct. The leading term −2x⁵ has odd degree and a negative coefficient: large negative x gives a large positive value, large positive x gives a large negative value.
        - |
          This is the behavior of a positive leading coefficient; the coefficient −2 reverses both ends.
        - |
          Both ends match only for even degree. The degree here is 5, so the ends go in opposite directions.
        - |
          Both ends up describes an even-degree polynomial with a positive leading coefficient, not −2x⁵.
      answer: 0
    - slug: precalc-u01-w06-q11
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        A polynomial p with real coefficients has a zero of multiplicity 2 at x = 3 and a zero at x = 1 + 2i. What is the least possible degree of p?
      options:
        - "2"
        - "3"
        - "5"
        - "4"
      option_explanations:
        - |
          The double zero at 3 alone accounts for degree 2; the complex zero adds more.
        - |
          This counts 1 + 2i but forgets that its conjugate 1 − 2i must also be a zero when the coefficients are real.
        - |
          There is no reason for an extra zero; 3, 3, 1 + 2i and 1 − 2i already give a valid polynomial of degree 4.
        - |
          Correct. With real coefficients, 1 − 2i must also be a zero. Counting multiplicity: 3, 3, 1 + 2i, 1 − 2i gives at least 4 zeros, so degree at least 4.
      answer: 3
    - slug: precalc-u01-w06-q12
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      stimulus: |
        | x | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | f(x) | 5 | 8 | 15 | 26 | 41 |
      prompt: |
        Which conclusion about f is best supported by the table?
      options:
        - "f is linear, because the outputs increase every time x increases by 1."
        - "f is quadratic, because the average rates of change over consecutive unit intervals increase by a constant 4."
        - "f is quadratic, because the average rates of change over consecutive unit intervals are constant."
        - "f is cubic, because the outputs increase faster and faster."
      option_explanations:
        - |
          A linear function needs equal changes over equal intervals; the changes here are 3, 7, 11 and 15, which are not equal.
        - |
          Correct. The average rates of change are 3, 7, 11, 15, and these increase by 4 each time (constant second differences), the signature of a quadratic.
        - |
          Constant average rates of change describe a linear function; here the rates themselves change, at a constant rate.
        - |
          Growing faster is true of quadratics too. A cubic needs constant third differences, but here the second differences are already constant.
      answer: 1
    - slug: precalc-u01-w06-q13
      type: multi_select
      topic_code: "1.10"
      source: "AP Precalculus CED, Topic 1.10"
      points: 2
      partial_credit: true
      prompt: |
        Let f(x) = (x² − 4x)/(x² − 2x − 8). Which statements are true? Select all that apply.
      options:
        - "f has a zero at x = 4."
        - "The graph of f has a hole at (4, 2/3)."
        - "The line x = −2 is a vertical asymptote of the graph of f."
        - "lim as x → −2⁺ of f(x) = ∞"
        - "The graph of f passes through the origin."
      option_explanations:
        - |
          f(x) = x(x − 4)/((x − 4)(x + 2)). x = 4 also makes the denominator zero, so f(4) is undefined; 4 is a hole, not a zero.
        - |
          Correct. Cancelling (x − 4) leaves x/(x + 2), which is 4/6 = 2/3 at x = 4.
        - |
          Correct. The factor (x + 2) stays in the denominator after cancelling, so the outputs are unbounded near −2.
        - |
          Just right of −2 the simplified numerator x is near −2 (negative) and x + 2 is small and positive, so f(x) → −∞, not ∞.
        - |
          Correct. 0 is in the domain and f(0) = 0/(−8) = 0, so (0, 0) is on the graph.
      answer: [1, 2, 4]
    - slug: precalc-u01-w06-q14
      type: multi_select
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are odd functions, that is, satisfy f(−x) = −f(x) for every x? Select all that apply.
      options:
        - "f(x) = x³ − 4x"
        - "f(x) = x⁵ + x³"
        - "f(x) = x³ + 2"
        - "f(x) = x⁴ − x"
        - "f(x) = −7x"
      option_explanations:
        - |
          Correct. Both terms have odd powers: f(−x) = −x³ + 4x = −(x³ − 4x).
        - |
          Correct. f(−x) = −x⁵ − x³ = −f(x); every term is an odd power.
        - |
          The constant 2 is an even-power term (2x⁰): f(−x) = −x³ + 2, which is not −f(x) = −x³ − 2.
        - |
          This mixes an even power (x⁴) with an odd one (x), so f(−x) = x⁴ + x matches neither f(x) nor −f(x).
        - |
          Correct. f(−x) = 7x = −(−7x); a line through the origin is symmetric about the origin.
