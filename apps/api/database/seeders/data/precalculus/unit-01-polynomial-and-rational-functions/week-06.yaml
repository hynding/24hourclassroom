        Six points, one per sub-part. (A)(i) correct factoring and both excluded values. (A)(ii) zero 2 only, with the domain reason for −2. (B)(i) hole (−2, 8/5) with the limit statement. (B)(ii) x = 3 and both one-sided limits with a sign justification (no point without the justification). (C)(i) correct solution set that excludes −2 and 3 (accept interval notation). (C)(ii) both limits equal to 2.
