week: 1
unit: 1
title: "Change in Tandem and Rates of Change"
topics: ["1.1", "1.2"]
guide: guides/week-01.md
guide_description: |
  Functions as two quantities changing in tandem, read from formulas, tables, graphs and words; increasing and
  decreasing intervals, concavity as a changing rate of change, and zeros located by sign changes in a table;
  average rate of change as the slope of a secant line, and the rate of change at a point estimated from shrinking
  intervals. Worked examples: a hypothetical drone-altitude table, an overnight temperature table, and estimating
  the rate of change of x² at x = 3.
flashcards_description: |
  30 cards on functions and their representations, increasing and decreasing, concavity, zeros, average rate of
  change and secant lines, and estimating a rate of change at a point.

flashcards:
  - front: Function → defining property
    back: |
      Each input is paired with exactly one output. Two inputs may share an output, but one input can never have two outputs.
    topic_code: "1.1"
  - front: Change in tandem → what it means
    back: |
      Two quantities vary together: as the input changes, the output changes according to the function's rule. The height of a drone and the time since launch change in tandem.
    topic_code: "1.1"
  - front: Four representations of a function → list them
    back: |
      Formula, table, graph and verbal description. AP questions often give one and ask you to reason about another.
    topic_code: "1.1"
  - front: Increasing on an interval → precise meaning
    back: |
      For every a < b in the interval, f(a) < f(b). As inputs rise, outputs rise.
    topic_code: "1.1"
  - front: Decreasing on an interval → precise meaning
    back: |
      For every a < b in the interval, f(a) > f(b). As inputs rise, outputs fall.
    topic_code: "1.1"
  - front: Intervals of increase → stated in inputs or outputs?
    back: |
      Inputs. Say "h is increasing on 0 < t < 6", not "increasing from 5 m to 113 m".
    topic_code: "1.1"
  - front: Concave up → meaning in terms of rate of change
    back: |
      The rate of change is increasing. The graph bends upward: an increasing function speeds up, a decreasing one falls less and less steeply.
    topic_code: "1.1"
  - front: Concave down → meaning in terms of rate of change
    back: |
      The rate of change is decreasing. The graph bends downward: an increasing function slows down, a decreasing one falls more and more steeply.
    topic_code: "1.1"
  - front: Decreasing and concave up → describe the graph
    back: |
      Falling, but less and less steeply, like a cooling cup of coffee approaching room temperature.
    topic_code: "1.1"
  - front: Increasing and concave down → describe the graph
    back: |
      Rising, but more and more slowly, like a phone battery approaching full charge.
    topic_code: "1.1"
  - front: Point of inflection → meaning
    back: |
      A point where the graph changes concavity, so the rate of change switches from increasing to decreasing or the reverse.
    topic_code: "1.1"
  - front: Changes over equal intervals 8, 20, 26, 26, 20, 8 → concavity
    back: |
      All positive, so increasing. The changes grow and then shrink, so concave up at first and concave down later, with a point of inflection near where the changes peak.
    topic_code: "1.1"
  - front: Relative maximum → where it occurs
    back: |
      Where a function switches from increasing to decreasing. A relative minimum is where it switches from decreasing to increasing.
    topic_code: "1.1"
  - front: Zero of a function → definition
    back: |
      An input a with f(a) = 0. On the graph it is an x-intercept (a, 0).
    topic_code: "1.1"
  - front: Sign change in a table, f(1) > 0 and f(2) < 0 → conclusion
    back: |
      If f is continuous, it has at least one zero between x = 1 and x = 2. Without continuity (a break in the graph) the conclusion can fail.
    topic_code: "1.1"
  - front: Average rate of change on [a, b] → formula
    back: |
      (f(b) − f(a))/(b − a): change in output divided by change in input.
    topic_code: "1.2"
  - front: Average rate of change → units
    back: |
      Output units per input unit. Altitude in metres against time in minutes gives metres per minute.
    topic_code: "1.2"
  - front: Secant line through (a, f(a)) and (b, f(b)) → link to rates
    back: |
      Its slope is the average rate of change of f on [a, b].
    topic_code: "1.2"
  - front: Average rate of change of x² − 4x on [1, 5] → compute
    back: |
      f(1) = −3, f(5) = 5, so (5 − (−3))/(5 − 1) = 8/4 = 2.
    topic_code: "1.2"
  - front: Average rate of change 0 on [a, b] → what it tells you
    back: |
      Only that f(a) = f(b). The function may have risen and fallen in between; it need not be constant.
    topic_code: "1.2"
  - front: Sign of an average rate of change → what it tells you
    back: |
      Positive: the output is higher at the end of the interval than at the start. Negative: lower. It says nothing about what happens inside the interval.
    topic_code: "1.2"
  - front: Rate of change at a point → how to estimate it
    back: |
      Compute average rates of change over smaller and smaller intervals around the point and see what value they approach.
    topic_code: "1.2"
  - front: Rate of change of x² at x = 3 → estimate
    back: |
      [3, 3.01] gives 6.01 and [2.99, 3] gives 5.99; the averages close in on 6.
    topic_code: "1.2"
  - front: Symmetric interval [a − h, a + h] → why use it to estimate a rate
    back: |
      It usually balances the overestimate on one side against the underestimate on the other. For x² at x = 3, [2.9, 3.1] gives exactly 6.
    topic_code: "1.2"
  - front: Secant lines shrinking toward one point → what they approach
    back: |
      The line that just touches the curve at that point (the tangent line). Its slope is the rate of change at the point.
    topic_code: "1.2"
  - front: Average rates over consecutive equal intervals increasing → concavity
    back: |
      Concave up on that stretch. If the average rates decrease, concave down.
    topic_code: "1.2"
  - front: Rate of −30 m/min vs +20 m/min → which is faster?
    back: |
      −30 m/min: speed of change is the absolute value, 30 > 20. The sign gives the direction (falling).
    topic_code: "1.2"
  - front: Error-spot → "(f(5) − f(1))/(1 − 5) is the average rate on [1, 5]"
    back: |
      The subtraction order must match top and bottom: (f(5) − f(1))/(5 − 1). Mixing orders flips the sign.
    topic_code: "1.2"
  - front: Error-spot → "f is concave up, so it must be increasing"
    back: |
      Concavity and direction are independent. A decreasing function can be concave up (falling more and more slowly).
    topic_code: "1.1"
  - front: Error-spot → "the rate of change at x = 2 is f(2)"
    back: |
      f(2) is an output value, not a rate. A rate compares a change in output with a change in input, such as (f(2.01) − f(2))/0.01.
    topic_code: "1.2"

quiz:
  description: |
    23 questions · about 40 minutes · all on this week (topics 1.1 and 1.2: functions as change in tandem,
    increasing and decreasing, concavity, zeros, average rates of change and rates of change at a point). As the
    first week there is no spiral review. Opens with a shared-context set on a hypothetical reservoir table.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. No calculator needed.
  questions:
    # ---- Stimulus set: a hypothetical reservoir level table (1.1, 1.2)
    - slug: precalc-u01-w01-q01
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      stimulus: |
        A hypothetical model gives the water level L(d), in metres, of a reservoir d days after the start of a dry spell. L is continuous.

        | d (days) | 0 | 2 | 4 | 6 | 8 | 10 |
        |---|---|---|---|---|---|---|
        | L(d) (m) | 12.0 | 11.2 | 10.0 | 8.4 | 7.8 | 7.6 |
      prompt: |
        What is the average rate of change of L over the interval 0 ≤ d ≤ 6?
      options:
        - "0.6 metres per day"
        - "−0.6 metres per day"
        - "−3.6 metres per day"
        - "−1.4 metres per day"
      option_explanations:
        - |
          The level fell from 12.0 to 8.4, so the change is negative; this subtracts in the wrong order.
        - |
          Correct. (L(6) − L(0))/(6 − 0) = (8.4 − 12.0)/6 = −3.6/6 = −0.6 metres per day.
        - |
          −3.6 m is the total change in level; it still has to be divided by the 6 days.
        - |
          This divides the final level 8.4 by 6 (and makes it negative) instead of dividing the change in level.
      answer: 1
    - slug: precalc-u01-w01-q02
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 1
      stimulus: |
        A hypothetical model gives the water level L(d), in metres, of a reservoir d days after the start of a dry spell. L is continuous.

        | d (days) | 0 | 2 | 4 | 6 | 8 | 10 |
        |---|---|---|---|---|---|---|
        | L(d) (m) | 12.0 | 11.2 | 10.0 | 8.4 | 7.8 | 7.6 |
      prompt: |
        Based on the table, which best describes L on the interval 0 < d < 6?
      options:
        - "Increasing and concave down"
        - "Decreasing and concave up"
        - "Increasing and concave up"
        - "Decreasing and concave down"
      option_explanations:
        - |
          Every listed level is lower than the one before, so L is decreasing, not increasing.
        - |
          The two-day changes are −0.8, −1.2, −1.6, which are getting more negative, so the rate is decreasing: that is concave down.
        - |
          L falls throughout the interval, and the changes −0.8, −1.2, −1.6 are decreasing, so neither part fits.
        - |
          Correct. The changes −0.8, −1.2, −1.6 are all negative (decreasing) and are themselves decreasing, so the level falls faster and faster: concave down.
      answer: 3
    - slug: precalc-u01-w01-q03
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      stimulus: |
        A hypothetical model gives the water level L(d), in metres, of a reservoir d days after the start of a dry spell. L is continuous.

        | d (days) | 0 | 2 | 4 | 6 | 8 | 10 |
        |---|---|---|---|---|---|---|
        | L(d) (m) | 12.0 | 11.2 | 10.0 | 8.4 | 7.8 | 7.6 |
      prompt: |
        Using the symmetric interval 6 ≤ d ≤ 10, estimate the rate of change of L at d = 8.
      options:
        - "−0.2 metres per day"
        - "−0.8 metres per day"
        - "7.8 metres per day"
        - "−0.3 metres per day"
      option_explanations:
        - |
          Correct. (L(10) − L(6))/(10 − 6) = (7.6 − 8.4)/4 = −0.8/4 = −0.2 metres per day.
        - |
          −0.8 m is the change in level over the four days; it must be divided by 4.
        - |
          7.8 m is the level at d = 8, an output value, not a rate of change.
        - |
          −0.3 comes from the left-hand interval [6, 8] only, (7.8 − 8.4)/2; the question asks for the symmetric interval [6, 10].
      answer: 0
    # ---- Independent items
    - slug: precalc-u01-w01-q04
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 1
      prompt: |
        A continuous function f has the values below.

        | x | −2 | −1 | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|---|---|
        | f(x) | 4 | 1 | −2 | −1 | 3 | 5 |

        On which intervals must f have a zero?
      options:
        - "(−2, −1) and (0, 1)"
        - "(0, 1) only"
        - "(−1, 0) and (1, 2)"
        - "(1, 2) only"
      option_explanations:
        - |
          On these intervals the outputs keep the same sign (4 and 1 are both positive; −2 and −1 are both negative), so no zero is guaranteed.
        - |
          f(0) = −2 and f(1) = −1 are both negative, so there is no sign change on (0, 1).
        - |
          Correct. f changes from 1 to −2 between x = −1 and 0, and from −1 to 3 between x = 1 and 2; a continuous function must cross 0 in each.
        - |
          This misses the sign change from f(−1) = 1 to f(0) = −2, which also forces a zero.
      answer: 2
    - slug: precalc-u01-w01-q05
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        What is the average rate of change of f(x) = x³ − 2x on the interval [1, 3]?
      options:
        - "22"
        - "10"
        - "11"
        - "−11"
      option_explanations:
        - |
          22 is the change f(3) − f(1) = 21 − (−1); it still has to be divided by 3 − 1 = 2.
        - |
          This uses f(1) = 1, but f(1) = 1 − 2 = −1, so the change is 22, not 20.
        - |
          Correct. f(1) = −1 and f(3) = 27 − 6 = 21, so (21 − (−1))/(3 − 1) = 22/2 = 11.
        - |
          The sign is wrong: this subtracts the outputs in one order and the inputs in the other.
      answer: 2
    - slug: precalc-u01-w01-q06
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 1
      prompt: |
        Which description fits a function that is decreasing and concave up on an interval?
      options:
        - "The graph falls, but less and less steeply."
        - "The graph falls more and more steeply."
        - "The graph rises more and more steeply."
        - "The graph rises, but less and less steeply."
      option_explanations:
        - |
          Correct. Decreasing means falling; concave up means the rate of change is increasing, so the negative slopes move toward 0 and the fall flattens out.
        - |
          Falling more and more steeply means the rate is getting more negative (decreasing), which is concave down.
        - |
          A rising graph is increasing, not decreasing; this describes increasing and concave up.
        - |
          A rising graph is increasing; rising more slowly describes increasing and concave down.
      answer: 0
    - slug: precalc-u01-w01-q07
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        The secant line through the points (2, g(2)) and (6, g(6)) on the graph of g has slope −3. Which statement must be true?
      options:
        - "g is decreasing on the interval [2, 6]."
        - "g(6) = −3"
        - "g(6) − g(2) = −3"
        - "g(6) − g(2) = −12"
      option_explanations:
        - |
          A negative average rate only says g(6) < g(2); g could rise and fall in between.
        - |
          The slope −3 is a rate of change, not an output value of g.
        - |
          The slope is the change in output divided by the change in input, 6 − 2 = 4; this forgets to multiply back by 4.
        - |
          Correct. Slope = (g(6) − g(2))/(6 − 2) = −3, so g(6) − g(2) = −3 · 4 = −12.
      answer: 3
    - slug: precalc-u01-w01-q08
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 1
      prompt: |
        Over consecutive intervals of equal length, the changes in a function's output are 5, 3, 2 and 1.5. Which best describes the function on this domain?
      options:
        - "Increasing and concave up"
        - "Increasing and concave down"
        - "Decreasing and concave down"
        - "Decreasing and concave up"
      option_explanations:
        - |
          The changes are positive but shrinking, so the rate of change is decreasing; concave up would need growing changes.
        - |
          Correct. Positive changes mean the outputs rise; the changes shrink from 5 to 1.5, so the rate of change decreases: concave down.
        - |
          Every change is positive, so the outputs are rising, not falling.
        - |
          Positive changes mean the function is increasing; shrinking changes mean concave down, not up.
      answer: 1
    - slug: precalc-u01-w01-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        The average rate of change of f(x) = x³ on [2, 2.001] is 12.006001. What is the best estimate of the rate of change of f at x = 2?
      options:
        - "About 12"
        - "About 8"
        - "About 4"
        - "About 6"
      option_explanations:
        - |
          Correct. On a very short interval starting at x = 2 the average rate is 12.006, so the rate of change at x = 2 is about 12.
        - |
          8 is f(2) = 2³, an output value, not a rate of change.
        - |
          4 would be the rate for x² at x = 2; this function is x³.
        - |
          6 is 3 · 2, which leaves out a factor of x; the computed averages are near 12.
      answer: 0
    - slug: precalc-u01-w01-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        A hypothetical phone battery shows 20% charge at 1:00 p.m. and 80% at 1:40 p.m. What is the average rate of change of the charge over that time?
      options:
        - "About 0.67 percentage points per minute"
        - "60 percentage points per minute"
        - "1.5 percentage points per minute"
        - "2 percentage points per minute"
      option_explanations:
        - |
          40/60 ≈ 0.67 divides the time by the change in charge, inverting the rate.
        - |
          60 is the total change in charge; it must be divided by the 40 minutes.
        - |
          Correct. (80 − 20)/(40 − 0) = 60/40 = 1.5 percentage points per minute.
        - |
          80/40 divides the final reading by the time instead of the change in reading.
      answer: 2
    - slug: precalc-u01-w01-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 1
      prompt: |
        Each set of ordered pairs lists (input, output). Which set could define a function?
      options:
        - "{(1, 2), (1, 3), (2, 4)}"
        - "{(0, 0), (2, 1), (2, −1)}"
        - "{(3, 1), (4, 2), (3, 5)}"
        - "{(1, 5), (2, 5), (3, 5)}"
      option_explanations:
        - |
          The input 1 is paired with two outputs, 2 and 3, which a function never allows.
        - |
          The input 2 is paired with both 1 and −1, so this is not a function.
        - |
          The input 3 appears with outputs 1 and 5, so this is not a function.
        - |
          Correct. Each input 1, 2, 3 has exactly one output. Sharing the output 5 is allowed; it is a constant function on these inputs.
      answer: 3
    - slug: precalc-u01-w01-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        The rate of change of a quantity h is −8 units per second at t = 1 and +5 units per second at t = 4. Which statement is correct?
      options:
        - "h is changing faster at t = 4, because 5 > −8."
        - "h is changing faster at t = 1, and it is decreasing then."
        - "h is increasing at t = 1."
        - "h is changing equally fast at both times."
      option_explanations:
        - |
          Speed of change compares absolute values: |−8| = 8 is larger than 5, so t = 1 is faster.
        - |
          Correct. |−8| > |5|, so h changes faster at t = 1; the negative sign means h is decreasing at that moment.
        - |
          A negative rate of change means h is decreasing at t = 1, not increasing.
        - |
          The sizes are 8 and 5, which are different, so the speeds are not equal.
      answer: 1
    - slug: precalc-u01-w01-q13
      type: multi_select
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 2
      partial_credit: true
      prompt: |
        A continuous function f is defined on [0, 10]. Its graph rises from (0, 1) to a peak at (4, 9), falls to (8, 2), then rises to (10, 5), with no other turns. Which statements must be true? Select all that apply.
      options:
        - "f is increasing on 0 < x < 4."
        - "f has a relative maximum at x = 4."
        - "f has a zero between x = 4 and x = 8."
        - "The average rate of change of f on [0, 10] is 0.4."
        - "f is decreasing on 4 < x < 10."
      option_explanations:
        - |
          Correct. The graph rises from (0, 1) to (4, 9) with no turns in between.
        - |
          Correct. f switches from increasing to decreasing at x = 4, so f(4) = 9 is a relative maximum.
        - |
          The lowest point after the peak is (8, 2), which is above the x-axis, so f never reaches 0 there.
        - |
          Correct. (f(10) − f(0))/(10 − 0) = (5 − 1)/10 = 0.4.
        - |
          f rises again from (8, 2) to (10, 5), so it is decreasing only on 4 < x < 8.
      answer: [0, 1, 3]
    - slug: precalc-u01-w01-q14
      type: multi_select
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 2
      partial_credit: true
      prompt: |
        Let g(x) = x² − 6x + 5. Which statements are true? Select all that apply.
      options:
        - "The average rate of change of g on [0, 6] is 0."
        - "g is constant on [0, 6]."
        - "The average rate of change of g on [0, 2] is −4."
        - "The average rate of change of g on [3, 4] is −1."
        - "g has zeros at x = 1 and x = 5."
      option_explanations:
        - |
          Correct. g(0) = 5 and g(6) = 36 − 36 + 5 = 5, so the change is 0.
        - |
          A zero average rate only means g(0) = g(6); g dips to −4 at x = 3 in between.
        - |
          Correct. g(0) = 5 and g(2) = 4 − 12 + 5 = −3, so (−3 − 5)/2 = −4.
        - |
          g(3) = −4 and g(4) = −3, so the average rate is (−3 − (−4))/1 = +1, not −1.
        - |
          Correct. g(x) = (x − 1)(x − 5), which is 0 at x = 1 and x = 5.
      answer: [0, 2, 4]
    - slug: precalc-u01-w01-q15
      type: true_false
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 1
      prompt: |
        True or false: If a function is concave up on an interval, it must be increasing on that interval.
      answer: false
      explanation: |
        False. Concave up means the rate of change is increasing. A function can be decreasing and concave up, such as f(x) = x² on x < 0, where the graph falls less and less steeply.
    - slug: precalc-u01-w01-q16
      type: true_false
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        True or false: The average rate of change of f on [a, b] equals the slope of the line through (a, f(a)) and (b, f(b)).
      answer: true
      explanation: |
        True. That line is the secant line, and its slope is (f(b) − f(a))/(b − a), which is exactly the average rate of change.
    - slug: precalc-u01-w01-q17
      type: fill_blank
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        The average rate of change of f(x) = 1/x on the interval [1, 4] is ____.
      answer: ["-1/4", "−1/4", "-0.25", "−0.25", "-.25", "−.25"]
      explanation: |
        f(1) = 1 and f(4) = 1/4, so (1/4 − 1)/(4 − 1) = (−3/4)/3 = −1/4.
    - slug: precalc-u01-w01-q18
      type: fill_blank
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 1
      prompt: |
        The function f(x) = (x − 2)(x + 5) has its negative zero at x = ____.
      answer: ["-5", "−5"]
      explanation: |
        f(x) = 0 when x − 2 = 0 or x + 5 = 0, so the zeros are 2 and −5. The negative zero is −5.
    - slug: precalc-u01-w01-q19
      type: numeric
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        A hypothetical model gives a cyclist's distance from home as d(t) = 0.2t² + 3t kilometres, t hours after leaving. What is the average rate of change of d on [2, 4], in kilometres per hour? Give the exact value.
      answer: { value: 4.2, tolerance: 0.001 }
      explanation: |
        d(2) = 0.8 + 6 = 6.8 and d(4) = 3.2 + 12 = 15.2, so (15.2 − 6.8)/(4 − 2) = 8.4/2 = 4.2 km/h.
    - slug: precalc-u01-w01-q20
      type: numeric
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        Estimate the rate of change of f(x) = x² + x at x = 2 by computing the average rate of change on the symmetric interval [1.9, 2.1].
      answer: { value: 5, tolerance: 0.001 }
      explanation: |
        f(2.1) = 4.41 + 2.1 = 6.51 and f(1.9) = 3.61 + 1.9 = 5.51, so (6.51 − 5.51)/(2.1 − 1.9) = 1/0.2 = 5.
    - slug: precalc-u01-w01-q21
      type: short_answer
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 3
      prompt: |
        A continuous function f has the values below.

        | x | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
        |---|---|---|---|---|---|---|---|
        | f(x) | 10 | 6 | 3 | 1 | 0 | 0.5 | 2 |

        (a) Based on the table, on what interval does f appear to be decreasing, and on what interval increasing? Name the zero shown in the table.
        (b) Is f concave up or concave down on 0 < x < 6? Justify using the changes over consecutive intervals.
        (c) Find the average rate of change of f on [0, 6].
      answer: |
        (a) Decreasing on 0 < x < 4, increasing on 4 < x < 6; f(4) = 0, so x = 4 is a zero (and appears to be a relative minimum).
        (b) The changes over consecutive unit intervals are −4, −3, −2, −1, 0.5, 1.5. They increase throughout, so the rate of change is increasing and f is concave up.
        (c) (f(6) − f(0))/(6 − 0) = (2 − 10)/6 = −8/6 = −4/3.
      explanation: |
        Three points, one per part. (a) both intervals stated in terms of x and the zero x = 4. (b) concave up with the list of changes (or a clear statement that they increase). (c) −4/3 (or about −1.33).
    - slug: precalc-u01-w01-q22
      type: short_answer
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 3
      prompt: |
        Let f(x) = √x. You may use √9.1 ≈ 3.01662 and √8.9 ≈ 2.98329.

        (a) Compute the average rate of change of f on [9, 9.1].
        (b) Compute the average rate of change of f on [8.9, 9].
        (c) Use your results to estimate the rate of change of f at x = 9, and explain why the true value lies between your two answers.
      answer: |
        (a) (3.01662 − 3)/0.1 = 0.1662.
        (b) (3 − 2.98329)/0.1 = 0.1671.
        (c) About 0.1667 (the average of the two, or the symmetric-interval value (3.01662 − 2.98329)/0.2 ≈ 0.1667). The graph of √x is concave down, so its rate of change is decreasing: the left-hand interval averages slightly larger rates and the right-hand interval slightly smaller rates than the rate at x = 9, which therefore lies between 0.1662 and 0.1671.
      explanation: |
        Three points, one per part. (a) about 0.166. (b) about 0.167. (c) an estimate between the two (about 0.167 or 1/6) with a reason referring to the rate of change decreasing (concave down) or the averages approaching from both sides.
    - slug: precalc-u01-w01-q23
      type: long_answer
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 6
      prompt: |
        A hypothetical oven is switched on at time t = 0. Its internal temperature T(t), in degrees Celsius, t minutes later is recorded below. T is continuous.

        | t (min) | 0 | 2 | 4 | 6 | 8 | 10 |
        |---|---|---|---|---|---|---|
        | T(t) (°C) | 20 | 80 | 125 | 155 | 172 | 180 |

        (A) (i) Find the average rate of change of T over 0 ≤ t ≤ 10. Include units.
        (ii) Find the average rates of change over 0 ≤ t ≤ 4 and 6 ≤ t ≤ 10, and explain what the comparison says about how the oven heats.

        (B) Is T concave up or concave down on 0 < t < 10? Justify your answer using the table.

        (C) (i) Use the symmetric interval 2 ≤ t ≤ 6 to estimate the rate of change of T at t = 4. Include units.
        (ii) Without further calculation, is the rate of change of T at t = 8 greater than or less than the rate at t = 4? Justify your answer.
      answer: |
        (A)(i) (180 − 20)/(10 − 0) = 160/10 = 16 °C per minute.
        (ii) On [0, 4]: (125 − 20)/4 = 26.25 °C/min. On [6, 10]: (180 − 155)/4 = 6.25 °C/min. The oven is always heating, but it heats much faster early on and slows down as it approaches its final temperature.
        (B) Concave down. The changes over consecutive 2-minute intervals are 60, 45, 30, 17 and 8 °C. They are positive (T increasing) but decreasing, so the rate of change of T is decreasing, which means T is concave down.
        (C)(i) (T(6) − T(2))/(6 − 2) = (155 − 80)/4 = 18.75 °C per minute.
        (ii) Less. T is concave down, so its rate of change decreases as t increases; the rate at t = 8 is smaller than the rate at t = 4. (The table supports this: the change on [6, 10] is 25 °C against 75 °C on [2, 6].)
      explanation: |
        Six points: (A)(i) 1 point for 16 with units (°C per minute). (A)(ii) 1 point for both averages, 26.25 and 6.25, with an interpretation that heating slows. (B) 2 points: 1 for concave down, 1 for a justification that cites decreasing changes over equal intervals. (C)(i) 1 point for 18.75 °C per minute. (C)(ii) 1 point for "less" with a reason based on concavity or decreasing average rates.
