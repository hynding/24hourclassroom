  # ---- Select all
  - slug: precalc-u01-exam-q29
    type: multi_select
    topic_code: "1.5"
    source: "AP Precalculus CED, Topic 1.5"
    points: 2
    partial_credit: true
    prompt: |
      Let p(x) = x⁴ − 1. Which statements are true? Select all that apply.
    options:
      - "p has exactly two real zeros."
      - "The graph of p touches the x-axis at x = 1 without crossing it."
      - "i is a zero of p."
      - "−i is not a zero of p."
      - "p has four zeros, counting non-real zeros."
    option_explanations:
      - |
        Correct. x⁴ − 1 = (x − 1)(x + 1)(x² + 1); the real zeros are 1 and −1.
      - |
        x = 1 is a zero of multiplicity 1, so p changes sign there and the graph crosses.
      - |
        Correct. i⁴ − 1 = 1 − 1 = 0; the factor x² + 1 gives the zeros ±i.
      - |
        Non-real zeros of a polynomial with real coefficients come in conjugate pairs; (−i)⁴ − 1 = 0, so −i is a zero.
      - |
        Correct. Degree 4 gives exactly four complex zeros counting multiplicity: 1, −1, i and −i.
    answer: [0, 2, 4]
  - slug: precalc-u01-exam-q30
    type: multi_select
    topic_code: "1.9"
    source: "AP Precalculus CED, Topic 1.9"
    points: 2
    partial_credit: true
    prompt: |
      Let f(x) = (x² − 4)/(x − 1)². Which statements are true? Select all that apply.
    options:
      - "lim as x → 1⁺ of f(x) = ∞"
      - "lim as x → 1⁻ of f(x) = −∞"
      - "The graph of f has the horizontal asymptote y = 1."
      - "The graph of f has a hole at x = 1."
      - "The zeros of f are −2 and 2."
    option_explanations:
      - |
        Near 1 the numerator is about 1 − 4 = −3 (negative) and (x − 1)² is small and positive, so f(x) → −∞ from the right too.
      - |
        Correct. The numerator is near −3 and (x − 1)² is a small positive number, so f(x) → −∞ from the left (and from the right).
      - |
        Correct. Both degrees are 2 and both leading coefficients are 1, so f(x) → 1 as x → ±∞.
      - |
        The numerator (x − 2)(x + 2) does not share the factor (x − 1), so x = 1 is a vertical asymptote, not a hole.
      - |
        Correct. The numerator is zero at ±2, and neither makes the denominator zero.
    answer: [1, 2, 4]
  - slug: precalc-u01-exam-q31
    type: multi_select
    topic_code: "1.12"
    source: "AP Precalculus CED, Topic 1.12"
    points: 2
    partial_credit: true
    prompt: |
      A function f has zeros at x = −1 and x = 5, and its maximum value is 9, at x = 2. Let g(x) = −f(x) + 4. Which statements must be true? Select all that apply.
    options:
      - "The minimum value of g is −5, at x = 2."
      - "g has zeros at x = −1 and x = 5."
      - "g(−1) = 4"
      - "g(5) = 4"
      - "The graph of g is the graph of f reflected over the y-axis and translated up 4."
    option_explanations:
      - |
        Correct. Reflecting over the x-axis turns the maximum 9 into a minimum −9 at the same input, and the shift up 4 makes it −5.
      - |
        g(−1) = −f(−1) + 4 = 0 + 4 = 4, not 0. The vertical shift moves the zeros of f off the axis.
      - |
        Correct. g(−1) = −f(−1) + 4 = −0 + 4 = 4.
      - |
        Correct. g(5) = −f(5) + 4 = 4, for the same reason.
      - |
        The negative sign is outside f, so it reflects over the x-axis; a reflection over the y-axis would be f(−x).
    answer: [0, 2, 3]
  - slug: precalc-u01-exam-q32
    type: multi_select
    topic_code: "1.11"
    source: "AP Precalculus CED, Topic 1.11"
    points: 2
    partial_credit: true
    prompt: |
      Which are factors of p(x) = x³ − 7x − 6? Select all that apply.
    options:
      - "x − 1"
      - "x + 1"
      - "x − 2"
      - "x − 3"
      - "x + 2"
    option_explanations:
      - |
        p(1) = 1 − 7 − 6 = −12 ≠ 0, so by the factor theorem x − 1 is not a factor.
      - |
        Correct. p(−1) = −1 + 7 − 6 = 0, so by the factor theorem x + 1 is a factor.
      - |
        p(2) = 8 − 14 − 6 = −12 ≠ 0, so x − 2 is not a factor.
      - |
        Correct. p(3) = 27 − 21 − 6 = 0, so x − 3 is a factor by the factor theorem.
      - |
        Correct. p(−2) = −8 + 14 − 6 = 0. Together, p(x) = (x + 1)(x − 3)(x + 2).
    answer: [1, 3, 4]
  # ---- True or false
  - slug: precalc-u01-exam-q33
    type: true_false
    topic_code: "1.1"
    source: "AP Precalculus CED, Topic 1.1"
    points: 1
    prompt: |
      True or false: If a function is increasing on an interval, then its graph must be concave up on that interval.
    answer: false
    explanation: |
      False. Increasing describes the outputs (they rise); concavity describes the rate of change. A function can rise more and more slowly, which is increasing and concave down: the water level filling a tank whose pump is slowing down, or y = √x for x > 0.
  - slug: precalc-u01-exam-q34
    type: true_false
    topic_code: "1.10"
    source: "AP Precalculus CED, Topic 1.10"
    points: 1
    prompt: |
      True or false: The function y = (x − 2)²/(x − 2) has a zero at x = 2.
    answer: false
    explanation: |
      False. x = 2 makes the denominator zero, so the function is undefined there and cannot equal 0. Its graph is the line y = x − 2 with a hole at (2, 0).
  - slug: precalc-u01-exam-q35
    type: true_false
    topic_code: "1.6"
    source: "AP Precalculus CED, Topic 1.6"
    points: 1
    prompt: |
      True or false: Every polynomial function of odd degree has at least one real zero.
    answer: true
    explanation: |
      True. An odd-degree polynomial has opposite end behaviors (one end goes to ∞ and the other to −∞), and a polynomial's graph has no breaks, so it must cross the x-axis at least once.
