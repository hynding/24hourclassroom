  # ---- Modeling (1.13, 1.14) and rates (1.2)
  - slug: precalc-u01-exam-q26
    type: multiple_choice
    topic_code: "1.13"
    source: "AP Precalculus CED, Topic 1.13"
    points: 1
    prompt: |
      A driver plans a 120 km trip. Which type of function best models the constant average speed v, in km per hour, needed to complete the trip in t hours?
    options:
      - "Linear: v = 120 − t"
      - "Quadratic: v = 120t − t²"
      - "Linear: v = 120t"
      - "Rational: v = 120/t"
    option_explanations:
      - |
        Taking 1 hour longer does not reduce the speed by a fixed amount; halving the time doubles the speed.
      - |
        Nothing in the context suggests a maximum speed at some middle time; distance = speed × time gives a quotient, not a product.
      - |
        This increases the speed as the time increases, the opposite of the situation.
      - |
        Correct. Distance = speed × time, so v = 120/t. Speed is inversely proportional to time, with a vertical asymptote at t = 0 and v → 0 as t grows.
    answer: 3
  - slug: precalc-u01-exam-q27
    type: multiple_choice
    topic_code: "1.14"
