unit: 1
description: |
  45 questions · about 90 minutes · every topic of Unit 1 (1.1 to 1.14): change in tandem and rates of change,
  linear and quadratic rates, polynomial behavior, complex zeros and end behavior, rational functions and their
  end behavior, zeros, vertical asymptotes and holes, equivalent forms and division, transformations, and
  building and choosing models. Includes three shared-context sets of three questions (a draining tank, a
  rational function, and market attendance data), select-all, true/false, fill-in-the-blank and numeric items,
  two short-answer questions (3 points each) and two free-response questions in the AP style (6 points each: one
  on function concepts, one on a modeling context). Items marked (Calculator.) need a graphing calculator; the
  rest are meant to be done by hand. Multiple choice, select-all, true/false and numeric items are graded at
  once; fill-in-the-blank items are matched automatically; the free-response items are graded by your teacher
  against the scoring notes.
questions:
  # ---- Stimulus set A: a draining tank (1.1, 1.2, 1.3)
  - slug: precalc-u01-exam-q01
    type: multiple_choice
    topic_code: "1.1"
    source: "AP Precalculus CED, Topic 1.1"
    points: 1
    stimulus: |
      Water drains from a tank. The height of the water, H, in centimeters, is recorded every 2 minutes. The data are hypothetical.

      | t (minutes) | 0 | 2 | 4 | 6 | 8 |
      |---|---|---|---|---|---|
      | H(t) (cm) | 80 | 62 | 47 | 35 | 26 |
    prompt: |
      Which description of H on the interval 0 ≤ t ≤ 8 is consistent with the data?
    options:
      - "Decreasing and concave down"
      - "Decreasing and concave up"
      - "Increasing and concave up"
      - "Decreasing at a constant rate"
    option_explanations:
      - |
        The changes −18, −15, −12, −9 are getting larger (less negative), so the rate of change is increasing, which means concave up, not down.
      - |
        Correct. H falls every interval, so it is decreasing, and the changes −18, −15, −12, −9 increase, so the graph is concave up: the water level falls more slowly over time.
      - |
        The heights go down from 80 to 26, so H is decreasing, not increasing.
      - |
        The changes over equal 2-minute intervals are not equal (−18, −15, −12, −9), so the rate is not constant.
    answer: 1
  - slug: precalc-u01-exam-q02
    type: multiple_choice
    topic_code: "1.2"
    source: "AP Precalculus CED, Topic 1.2"
    points: 1
    stimulus: |
      Water drains from a tank. The height of the water, H, in centimeters, is recorded every 2 minutes. The data are hypothetical.

      | t (minutes) | 0 | 2 | 4 | 6 | 8 |
      |---|---|---|---|---|---|
      | H(t) (cm) | 80 | 62 | 47 | 35 | 26 |
    prompt: |
      What is the average rate of change of H over the interval 2 ≤ t ≤ 6?
    options:
      - "−27 cm per minute"
      - "6.75 cm per minute"
      - "−13.5 cm per minute"
      - "−6.75 cm per minute"
    option_explanations:
      - |
        −27 cm is the total change in height; it must be divided by the 4 minutes elapsed.
      - |
        The height decreases over the interval, so the average rate of change is negative.
      - |
        This divides by 2, the number of table steps, instead of by the 4 minutes between t = 2 and t = 6.
      - |
        Correct. (H(6) − H(2))/(6 − 2) = (35 − 62)/4 = −27/4 = −6.75 cm per minute.
    answer: 3
  - slug: precalc-u01-exam-q03
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Precalculus CED, Topic 1.3"
    points: 1
    stimulus: |
      Water drains from a tank. The height of the water, H, in centimeters, is recorded every 2 minutes. The data are hypothetical.

      | t (minutes) | 0 | 2 | 4 | 6 | 8 |
      |---|---|---|---|---|---|
      | H(t) (cm) | 80 | 62 | 47 | 35 | 26 |
    prompt: |
      Which conclusion about a model for H is best supported by the data?
    options:
      - "A quadratic model fits, because the changes over equal intervals increase by a constant 3 cm."
      - "A linear model fits, because H decreases on every interval."
      - "A quadratic model whose graph is concave down fits, because the changes decrease in size."
      - "A cubic model is needed, because the data are not linear."
    option_explanations:
      - |
        Correct. The changes are −18, −15, −12, −9, and the second differences are all 3. Constant second differences over equal steps indicate a quadratic, here concave up.
      - |
        A linear model needs equal changes over equal intervals; these changes are −18, −15, −12, −9.
      - |
        The changes grow from −18 toward −9, so the rate of change is increasing and the graph is concave up, not concave down.
      - |
        Not being linear does not make a model cubic; the second differences are already constant, so a quadratic is enough.
    answer: 0
  # ---- Polynomial functions (1.4, 1.5, 1.6)
  - slug: precalc-u01-exam-q04
    type: multiple_choice
    topic_code: "1.4"
    source: "AP Precalculus CED, Topic 1.4"
    points: 1
    prompt: |
      Let f(x) = x⁴ − 4x². Which statement is true?
    options:
      - "f is odd, and the graph of f has a local maximum at (0, 0)."
      - "f is even, and the graph of f has a local minimum at (0, 0)."
      - "f is even, and the graph of f has a local maximum at (0, 0) and local minimums at x = −√2 and x = √2."
      - "f is even, and the graph of f has an absolute maximum at (0, 0)."
    option_explanations:
      - |
        Both terms are even powers, so f(−x) = f(x): f is even, not odd.
      - |
        Near 0, −4x² dominates x⁴, so f(x) < 0 just to either side of 0; (0, 0) is a local maximum, not a minimum.
      - |
        Correct. f(−x) = f(x), so f is even. f(x) = x²(x² − 4) is negative near 0 on both sides, so (0, 0) is a local maximum; the minimums are f(±√2) = 4 − 8 = −4.
      - |
        The leading term x⁴ sends f to ∞ at both ends, so f has no absolute maximum; (0, 0) is only a local maximum.
    answer: 2
  - slug: precalc-u01-exam-q05
    type: multiple_choice
    topic_code: "1.4"
    source: "AP Precalculus CED, Topic 1.4"
    points: 1
    prompt: |
      (Calculator.) The graph of p(x) = x³ − 6x² + 9x + 1 has a local maximum at x = 1 and a local minimum at x = 3. At what value of x does the graph of p have a point of inflection?
    options:
      - "x = 2"
      - "x = 1"
      - "x = 3"
      - "x = 0"
    option_explanations:
      - |
        Correct. The rate of change of p decreases until x = 2 and increases after it, so the graph changes from concave down to concave up there. For a cubic it lies midway between the two extrema.
      - |
        x = 1 is the local maximum, where p changes from increasing to decreasing, not where its concavity changes.
      - |
        x = 3 is the local minimum, where p changes from decreasing to increasing, not where its concavity changes.
      - |
        x = 0 is where the graph meets the y-axis (p(0) = 1); the graph is still concave down there.
    answer: 0
  - slug: precalc-u01-exam-q06
    type: multiple_choice
    topic_code: "1.5"
    source: "AP Precalculus CED, Topic 1.5"
    points: 1
    prompt: |
      Which polynomial of least degree with real coefficients and leading coefficient 1 has zeros 3 and 1 − i?
    options:
      - "(x − 3)(x − 1 + i)"
      - "(x + 3)(x² − 2x + 2)"
      - "(x − 3)(x² + 2x + 2)"
      - "(x − 3)(x² − 2x + 2)"
    option_explanations:
      - |
        This has a non-real coefficient. With real coefficients the conjugate 1 + i must also be a zero, so the least degree is 3.
      - |
        The factor x + 3 gives the zero −3, not 3.
      - |
        x² + 2x + 2 has zeros −1 ± i, not 1 ± i.
      - |
        Correct. The zeros 1 − i and 1 + i give (x − 1)² + 1 = x² − 2x + 2, and the zero 3 gives x − 3. Expanded: x³ − 5x² + 8x − 6.
    answer: 3
  - slug: precalc-u01-exam-q07
    type: multiple_choice
    topic_code: "1.5"
    source: "AP Precalculus CED, Topic 1.5"
    points: 1
    prompt: |
      Let p(x) = (x + 1)³(x − 2)². Which describes the graph of p at its x-intercepts?
    options:
      - "It touches the x-axis without crossing at x = −1 and crosses at x = 2."
      - "It crosses the x-axis at x = −1 and touches without crossing at x = 2."
      - "It crosses the x-axis at both x = −1 and x = 2."
      - "It touches the x-axis without crossing at both x = −1 and x = 2."
    option_explanations:
      - |
        This reverses the rule: odd multiplicity (3, at x = −1) crosses; even multiplicity (2, at x = 2) touches.
      - |
        Correct. x = −1 has odd multiplicity 3, so the sign changes and the graph crosses (flattening as it does); x = 2 has even multiplicity 2, so the sign does not change and the graph bounces.
      - |
        (x − 2)² is never negative, so p does not change sign at x = 2; the graph only touches there.
      - |
        (x + 1)³ changes sign at x = −1, so the graph must cross there.
    answer: 1
  - slug: precalc-u01-exam-q08
    type: multiple_choice
    topic_code: "1.6"
    source: "AP Precalculus CED, Topic 1.6"
    points: 1
    prompt: |
      Let p(x) = (2 − x)(x + 3)². Which describes the end behavior of p?
    options:
      - "lim as x → ±∞ of p(x) = ∞"
      - "lim as x → −∞ of p(x) = −∞ and lim as x → ∞ of p(x) = ∞"
      - "lim as x → −∞ of p(x) = ∞ and lim as x → ∞ of p(x) = −∞"
      - "lim as x → ±∞ of p(x) = −∞"
    option_explanations:
      - |
        Matching ends need even degree; this product has degree 1 + 2 = 3.
      - |
        This is the behavior of a cubic with a positive leading coefficient, but (2 − x) contributes −x, making the leading term −x³.
      - |
        Correct. The leading term is (−x)(x²) = −x³: odd degree, negative coefficient, so it rises to the left and falls to the right.
      - |
        Both ends down needs even degree with a negative leading coefficient; this polynomial has odd degree 3.
    answer: 2
  - slug: precalc-u01-exam-q09
    type: multiple_choice
    topic_code: "1.4"
    source: "AP Precalculus CED, Topic 1.4"
    points: 1
    prompt: |
      (Calculator.) On which interval is p(x) = x³ − 6x + 1 decreasing? Values are rounded to three decimal places.
    options:
      - "−1.414 < x < 1.414"
      - "x < −1.414 and x > 1.414"
      - "−1.414 < x < 0"
      - "x < 0"
    option_explanations:
      - |
        Correct. Graphing shows a local maximum at x ≈ −1.414 and a local minimum at x ≈ 1.414 (that is, ±√2); p decreases between them.
      - |
        These are the intervals where p is increasing: a cubic with positive leading coefficient rises on both outer intervals.
      - |
        p keeps decreasing past x = 0 until its local minimum at x ≈ 1.414.
      - |
        For x < −1.414 the graph is rising toward its local maximum, so p is not decreasing on all of x < 0.
    answer: 0
  # ---- Rational end behavior (1.7)
  - slug: precalc-u01-exam-q10
    type: multiple_choice
    topic_code: "1.7"
    source: "AP Precalculus CED, Topic 1.7"
    points: 1
    prompt: |
      What is lim as x → −∞ of (3x³ − 1)/(x² + 4)?
    options:
      - "3"
      - "0"
      - "∞"
      - "−∞"
    option_explanations:
      - |
        3 is the ratio of leading coefficients, which is the limit only when the degrees are equal; here the numerator has the higher degree.
      - |
        A limit of 0 occurs when the denominator has the higher degree; here it is the numerator.
      - |
        The ratio of leading terms is 3x³/x² = 3x, which is negative for large negative x.
      - |
        Correct. For large |x| the function behaves like 3x³/x² = 3x, and 3x → −∞ as x → −∞.
    answer: 3
  - slug: precalc-u01-exam-q11
    type: multiple_choice
    topic_code: "1.7"
    source: "AP Precalculus CED, Topic 1.7"
    points: 1
    prompt: |
      What is the horizontal asymptote of the graph of y = (4 − x²)/(2x² + 5x)?
    options:
      - "y = 1/2"
      - "y = −1/2"
      - "y = 0"
      - "There is no horizontal asymptote."
    option_explanations:
      - |
        The leading term of the numerator is −x², so the ratio of leading coefficients is −1/2; the sign was dropped.
      - |
        Correct. Both degrees are 2, and the leading coefficients are −1 and 2, so y → −1/2 as x → ±∞.
      - |
        y = 0 requires the denominator to have the higher degree; the degrees here are equal.
      - |
        Equal degrees always give a horizontal asymptote, at the ratio of leading coefficients.
    answer: 1
  # ---- Stimulus set B: one rational function (1.8, 1.10, 1.9)
  - slug: precalc-u01-exam-q12
    type: multiple_choice
    topic_code: "1.8"
    source: "AP Precalculus CED, Topic 1.8"
    points: 1
    stimulus: |
      Let r(x) = (x² + 2x − 3)/(x² − x − 12).
    prompt: |
      What are the real zeros of r?
    options:
      - "1 and −3"
      - "−3 and 4"
      - "1 only"
      - "4 only"
    option_explanations:
      - |
        r(x) = (x + 3)(x − 1)/((x − 4)(x + 3)). x = −3 also makes the denominator zero, so r(−3) is undefined: −3 is a hole, not a zero.
      - |
        These are the zeros of the denominator, which are excluded from the domain.
      - |
        Correct. The numerator (x + 3)(x − 1) is zero at −3 and 1, but −3 is excluded from the domain, so the only zero is 1.
      - |
        4 makes the denominator zero, giving a vertical asymptote; zeros come from the numerator.
    answer: 2
  - slug: precalc-u01-exam-q13
    type: multiple_choice
    topic_code: "1.10"
    source: "AP Precalculus CED, Topic 1.10"
    points: 1
    stimulus: |
      Let r(x) = (x² + 2x − 3)/(x² − x − 12).
    prompt: |
      What are the coordinates of the hole in the graph of r?
    options:
      - "(−3, 4/7)"
      - "(−3, 0)"
      - "(−3, 1)"
      - "(−3, −4/7)"
    option_explanations:
      - |
        Correct. Cancelling (x + 3) leaves (x − 1)/(x − 4), which equals (−4)/(−7) = 4/7 at x = −3.
      - |
        The y-coordinate comes from the simplified function evaluated at −3, not from the cancelled factor.
      - |
        1 is the horizontal asymptote, which describes the ends of the graph, not the hole.
      - |
        (−4)/(−7) is positive: two negatives divide to a positive.
    answer: 0
  - slug: precalc-u01-exam-q14
    type: multiple_choice
    topic_code: "1.9"
    source: "AP Precalculus CED, Topic 1.9"
    points: 1
    stimulus: |
      Let r(x) = (x² + 2x − 3)/(x² − x − 12).
    prompt: |
      Which statement describes the behavior of r near x = 4?
    options:
      - "lim as x → 4 of r(x) = 3"
      - "lim as x → 4⁻ of r(x) = ∞ and lim as x → 4⁺ of r(x) = ∞"
      - "lim as x → 4⁻ of r(x) = ∞ and lim as x → 4⁺ of r(x) = −∞"
      - "lim as x → 4⁻ of r(x) = −∞ and lim as x → 4⁺ of r(x) = ∞"
    option_explanations:
      - |
        3 is the value of the simplified numerator x − 1 at 4; the denominator is approaching 0, so the outputs are unbounded.
      - |
        (x − 4) has odd multiplicity, so the sign of r changes across x = 4; both sides cannot go to ∞.
      - |
        The signs are reversed: just left of 4, x − 4 is negative while x − 1 is near 3, so r is large and negative.
      - |
        Correct. Simplified, r(x) = (x − 1)/(x − 4) with numerator near 3. Left of 4 the denominator is small and negative (−∞); right of 4 it is small and positive (∞).
    answer: 3
  # ---- Rational functions and equivalent forms (1.8–1.11)
  - slug: precalc-u01-exam-q15
    type: multiple_choice
    topic_code: "1.8"
    source: "AP Precalculus CED, Topic 1.8"
    points: 1
    prompt: |
      What is the solution set of (x² − 9)/(x + 1) ≥ 0?
    options:
      - "x ≤ −3 or −1 < x ≤ 3"
      - "−3 ≤ x < −1 or x ≥ 3"
      - "−3 ≤ x ≤ −1 or x ≥ 3"
      - "x ≥ 3 only"
    option_explanations:
      - |
        This is the solution of ≤ 0: the expression is negative for x < −3 and for −1 < x < 3.
      - |
        Correct. (x − 3)(x + 3)/(x + 1) has critical values −3, −1, 3 and signs −, +, −, + from left to right. Include −3 and 3 (value 0) but not −1 (undefined).
      - |
        x = −1 makes the denominator zero, so the expression does not exist there and −1 cannot be included.
      - |
        The expression is also positive between −3 and −1: for example, at x = −2 it is (−5)/(−1) = 5.
    answer: 1
  - slug: precalc-u01-exam-q16
    type: multiple_choice
    topic_code: "1.9"
    source: "AP Precalculus CED, Topic 1.9"
    points: 1
    prompt: |
      Which lists every vertical asymptote of the graph of y = (x + 2)/(x² + 2x)?
    options:
      - "x = 0 and x = −2"
      - "x = −2 only"
      - "x = 0 only"
      - "There are no vertical asymptotes."
    option_explanations:
      - |
        (x + 2)/(x(x + 2)): the factor x + 2 cancels, so x = −2 is a hole, not an asymptote.
      - |
        x = −2 is where the common factor cancels (a hole); the remaining factor x gives the asymptote.
      - |
        Correct. The function simplifies to 1/x for x ≠ −2, and x = 0 is still a zero of the denominator.
      - |
        Only one denominator factor cancels; the factor x remains and produces a vertical asymptote at x = 0.
    answer: 2
  - slug: precalc-u01-exam-q17
    type: multiple_choice
    topic_code: "1.10"
    source: "AP Precalculus CED, Topic 1.10"
    points: 1
    prompt: |
      What are the coordinates of the hole in the graph of y = (x³ − 8)/(x − 2)?
    options:
      - "(2, 12)"
      - "(2, 4)"
      - "(2, 0)"
      - "(2, 8)"
    option_explanations:
      - |
        Correct. x³ − 8 = (x − 2)(x² + 2x + 4), so for x ≠ 2 the function is x² + 2x + 4, which is 4 + 4 + 4 = 12 at x = 2.
      - |
        This uses only x² from the quotient; the full quotient x² + 2x + 4 equals 12 at x = 2.
      - |
        The y-coordinate comes from the simplified function, not from the cancelled factor x − 2.
      - |
        8 is 2³, the value of x³ alone; the function simplifies to x² + 2x + 4 before evaluating.
    answer: 0
  - slug: precalc-u01-exam-q18
    type: multiple_choice
    topic_code: "1.11"
    source: "AP Precalculus CED, Topic 1.11"
    points: 1
    prompt: |
      What is the result of dividing x³ + 2x² − 5x − 6 by x + 3?
    options:
      - "x² + 5x + 10, remainder 24"
      - "x³ − x² − 2x, remainder 0"
      - "x² + 2x − 5, remainder −6"
      - "x² − x − 2, remainder 0"
    option_explanations:
      - |
        This uses 3 instead of −3 in synthetic division, which divides by x − 3.
      - |
        Dividing a cubic by a linear factor lowers the degree by one, so the quotient must be quadratic.
      - |
        This copies the dividend's coefficients without the multiply-and-add steps of synthetic division.
      - |
        Correct. Synthetic division with −3 on 1, 2, −5, −6: 1; 2 − 3 = −1; −5 + 3 = −2; −6 + 6 = 0. So x + 3 is a factor and the quotient is x² − x − 2.
    answer: 3
  - slug: precalc-u01-exam-q19
    type: multiple_choice
    topic_code: "1.11"
    source: "AP Precalculus CED, Topic 1.11"
    points: 1
    prompt: |
      What is the slant asymptote of the graph of y = (2x² − 5x + 1)/(x − 2)?
    options:
      - "y = 2x"
      - "y = 2x − 1"
      - "y = 2x − 9"
      - "y = 2x − 1 − 1/(x − 2)"
    option_explanations:
      - |
        The ratio of leading terms gives only the slope; the division also produces a constant term, −1.
      - |
        Correct. Synthetic division with 2 on 2, −5, 1 gives 2, −1 and remainder −1, so y = 2x − 1 − 1/(x − 2) and the asymptote is y = 2x − 1.
      - |
        This comes from synthetic division with −2, which divides by x + 2 instead of x − 2.
      - |
        This is the function itself, rewritten; the asymptote is only the quotient 2x − 1.
    answer: 1
  - slug: precalc-u01-exam-q20
    type: multiple_choice
    topic_code: "1.11"
    source: "AP Precalculus CED, Topic 1.11"
    points: 1
    prompt: |
      What is the coefficient of x² in the expansion of (3x − 2)⁴?
    options:
      - "6"
      - "54"
      - "216"
      - "−216"
    option_explanations:
      - |
        6 is the binomial coefficient C(4, 2) alone; it must be multiplied by 3² and (−2)².
      - |
        This includes 3² = 9 but leaves out (−2)² = 4: 6 · 9 = 54.
      - |
        Correct. C(4, 2)(3x)²(−2)² = 6 · 9x² · 4 = 216x².
      - |
        (−2) is raised to an even power, 2, so the term is positive.
    answer: 2
  # ---- Transformations (1.12)
  - slug: precalc-u01-exam-q21
    type: multiple_choice
    topic_code: "1.12"
    source: "AP Precalculus CED, Topic 1.12"
    points: 1
    prompt: |
      The point (3, 5) is on the graph of y = f(x). Which point must be on the graph of g(x) = −f(x/2) + 1?
    options:
      - "(6, −4)"
      - "(3/2, −4)"
      - "(6, 6)"
      - "(6, −6)"
    option_explanations:
      - |
        Correct. g(6) = −f(6/2) + 1 = −f(3) + 1 = −5 + 1 = −4. The input is stretched by 2 and the output reflected, then raised 1.
      - |
        Dividing the input by 2 inside f stretches the graph horizontally, so the x-coordinate doubles to 6 rather than halving.
      - |
        This ignores the negative sign; the output 5 becomes −5 before adding 1.
      - |
        This adds 1 before reflecting, −(5 + 1); the rule is −5 + 1 = −4.
    answer: 0
  - slug: precalc-u01-exam-q22
    type: multiple_choice
    topic_code: "1.12"
    source: "AP Precalculus CED, Topic 1.12"
    points: 1
    prompt: |
      A function f has range [−2, 6]. What is the range of g(x) = (1/2)f(x + 3) − 1?
    options:
      - "[−1, 3]"
      - "[−3, 5]"
      - "[−4, 12]"
      - "[−2, 2]"
    option_explanations:
      - |
        This halves the range but forgets the vertical translation down 1.
      - |
        This shifts the range down 1 but forgets the vertical compression by 1/2.
      - |
        This doubles the outputs; the factor 1/2 compresses them instead.
      - |
        Correct. Each output y becomes y/2 − 1: −2 → −2 and 6 → 2. The +3 inside f moves the graph sideways and does not change the range.
    answer: 3
  # ---- Stimulus set C: market attendance data (1.13, 1.14)
  - slug: precalc-u01-exam-q23
    type: multiple_choice
    topic_code: "1.13"
    source: "AP Precalculus CED, Topic 1.13"
    points: 1
    stimulus: |
      The weekly attendance A, in hundreds of people, at a seasonal outdoor market is recorded x weeks after it opens. The data are hypothetical.

      | x (weeks) | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
      |---|---|---|---|---|---|---|---|
      | A (hundreds) | 12 | 25 | 33 | 37 | 35 | 28 | 16 |

      A quadratic regression on these data gives A ≈ −2.524x² + 20.905x − 6.571.
    prompt: |
      Which reason best supports choosing a quadratic model for these data?
    options:
      - "The attendance is always positive."
      - "The attendance rises to a single maximum and then falls, and the second differences are roughly constant (about −5)."
      - "The attendance levels off toward a horizontal asymptote."
      - "The attendance changes direction, which only a cubic can model."
    option_explanations:
      - |
        Being positive does not point to any particular model type; many functions stay positive on this interval.
      - |
        Correct. First differences 13, 8, 4, −2, −7, −12; second differences −5, −4, −6, −5, −5. One maximum and nearly constant second differences indicate a quadratic, concave down.
      - |
        The attendance falls steadily after week 4 rather than levelling off, so there is no sign of an asymptote.
      - |
        A quadratic changes direction once, at its vertex; a cubic is needed only for an inflection or two turning points.
    answer: 1
