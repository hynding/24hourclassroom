  # ---- Short answer
  - slug: precalc-u01-exam-q42
    type: short_answer
    topic_code: "1.11"
    source: "AP Precalculus CED, Topic 1.11"
    points: 3
    prompt: |
      Let p(x) = x³ + x² − 10x + 8.

      (a) Show that x − 1 is a factor of p(x).
      (b) Factor p(x) completely.
      (c) Solve p(x) < 0, showing a sign analysis.
    answer: |
      (a) p(1) = 1 + 1 − 10 + 8 = 0, so by the factor theorem x − 1 is a factor.
      (b) Synthetic division with 1 on 1, 1, −10, 8 gives 1, 2, −8 and remainder 0, so p(x) = (x − 1)(x² + 2x − 8) = (x − 1)(x + 4)(x − 2).
      (c) Zeros −4, 1, 2, each of multiplicity 1. With a positive leading coefficient and odd degree, p is negative for x < −4, positive on (−4, 1), negative on (1, 2) and positive for x > 2 (check x = 0: p(0) = 8 > 0). So p(x) < 0 for x < −4 or 1 < x < 2.
    explanation: |
      Three points, one per part. (a) p(1) = 0 with the factor theorem cited (or division with remainder 0). (b) the complete factorization. (c) the solution x < −4 or 1 < x < 2 supported by a sign chart or test values; endpoints excluded.
  - slug: precalc-u01-exam-q43
    type: short_answer
    topic_code: "1.12"
    source: "AP Precalculus CED, Topic 1.12"
    points: 3
    prompt: |
      Let g(x) = (3x − 5)/(x − 2).

      (a) Rewrite g(x) in the form a + b/(x − h), showing your work.
      (b) Describe the transformations that take the graph of f(x) = 1/x to the graph of g.
      (c) State the equations of the asymptotes of g, and give the domain and range of g.
    answer: |
      (a) 3(x − 2) = 3x − 6, and 3x − 5 − (3x − 6) = 1, so g(x) = 3 + 1/(x − 2).
      (b) g(x) = f(x − 2) + 3: translate the graph of 1/x right 2 units and up 3 units.
      (c) Vertical asymptote x = 2; horizontal asymptote y = 3. Domain: all real x except 2. Range: all real y except 3.
    explanation: |
      Three points, one per part. (a) the correct rewritten form with division or regrouping shown. (b) both translations with the correct directions. (c) both asymptotes plus the domain and range (the asymptote values excluded).
  # ---- Free response (AP style)
  - slug: precalc-u01-exam-q44
    type: long_answer
    topic_code: "1.5"
    source: "AP Precalculus CED, Topic 1.5"
    points: 6
    prompt: |
      Function concepts. The polynomial function p is given by p(x) = (x + 2)(x − 1)²(x − 4).

      (A) (i) Find the zeros of p, and for each, state whether the graph of p crosses the x-axis or touches it without crossing. Justify using multiplicity.
      (ii) Describe the end behavior of p using limit notation. Justify your answer.

      (B) (i) Solve p(x) ≥ 0. Show a sign analysis.
      (ii) The average rate of change of p over [−2, 4] is 0. Explain why this does not mean that p is constant on that interval, using a value of p.

      (C) (i) Let g(x) = p(x − 1). Find the zeros of g.
      (ii) Let h(x) = p(x)/(x² − 5x + 4). Find the coordinates of every hole in the graph of h, and explain why x = 1 is not a zero of h.
    answer: |
      (A)(i) Zeros −2, 1 and 4. At −2 and 4 the factors have odd multiplicity (1), so p changes sign and the graph crosses. At 1 the factor (x − 1)² has even multiplicity, so p does not change sign and the graph touches without crossing.
      (ii) The leading term is x · x² · x = x⁴: even degree, positive coefficient. So lim as x → −∞ of p(x) = ∞ and lim as x → ∞ of p(x) = ∞.
      (B)(i) Signs: x < −2: (−)(+)(−) = positive; −2 < x < 1: (+)(+)(−) = negative; 1 < x < 4: negative (no change at the even zero); x > 4: positive. p(x) ≥ 0 for x ≤ −2, x = 1, or x ≥ 4.
      (ii) p(−2) = p(4) = 0, so the average rate is (0 − 0)/6 = 0. That only says the endpoint values are equal; in between p takes other values, for example p(0) = (2)(1)(−4) = −8.
      (C)(i) g(x) = 0 when x − 1 is −2, 1 or 4, so the zeros of g are −1, 2 and 5.
      (ii) x² − 5x + 4 = (x − 1)(x − 4), so h(x) = (x + 2)(x − 1)²(x − 4)/((x − 1)(x − 4)) = (x + 2)(x − 1) for x ≠ 1, 4. Holes at (1, 0) and (4, 18), since (3)(0) = 0 and (6)(3) = 18. x = 1 is not in the domain of h, so h(1) is undefined and 1 cannot be a zero, even though the hole lies on the x-axis.
    explanation: |
      Six points, one per sub-part. (A)(i) all three zeros with cross/touch tied to multiplicity. (A)(ii) both limits equal to ∞ with the leading term x⁴ as the reason. (B)(i) the full solution including the isolated point x = 1, supported by signs. (B)(ii) the explanation that equal endpoint values do not imply a constant function, with a correct value such as p(0) = −8. (C)(i) zeros −1, 2, 5. (C)(ii) both holes (1, 0) and (4, 18) and the domain argument for x = 1.
  - slug: precalc-u01-exam-q45
    type: long_answer
    topic_code: "1.14"
    source: "AP Precalculus CED, Topic 1.14"
    points: 6
    prompt: |
      Modeling a non-periodic context. After a single dose of a medication, the concentration of the medication in a patient's blood is modeled by C(t) = 20t/(t² + 4), where C(t) is in milligrams per liter and t is the time in hours since the dose, for t ≥ 0. The model is hypothetical. According to the model, the concentration reaches its maximum, 5 mg/L, at t = 2.

      (A) (i) Find the average rate of change of C over [0, 2]. Interpret your answer in context, with units.
      (ii) Find the average rate of change of C over [2, 4]. Compare it with your answer in (i) and explain what the comparison says about the concentration.

      (B) (i) Find lim as t → ∞ of C(t) and interpret it in context.
      (ii) State one assumption or limitation of this model.

      (C) The medication is effective while the concentration is at least 3 mg/L.
      (i) Find, algebraically, the values of t at which C(t) = 3.
      (ii) For how long is the medication effective, according to the model? Give an exact answer and a decimal approximation, with units.
    answer: |
      (A)(i) C(0) = 0 and C(2) = 40/8 = 5, so the average rate is (5 − 0)/2 = 2.5 mg/L per hour. Over the first 2 hours the concentration rose on average by 2.5 milligrams per liter each hour.
      (ii) C(4) = 80/20 = 4, so the average rate is (4 − 5)/2 = −0.5 mg/L per hour. After the peak the concentration falls, and it falls much more slowly (0.5 mg/L per hour) than it rose (2.5 mg/L per hour).
      (B)(i) The denominator has the higher degree (2 versus 1), so lim as t → ∞ of C(t) = 0. In the long run the medication is cleared from the blood: the concentration approaches 0 mg/L.
      (ii) Any one: the model describes a single dose only (no further doses); it assumes every patient absorbs and clears the medication in the same way; it is valid only for t ≥ 0; it never reaches exactly 0, although in reality the medication is eventually gone.
      (C)(i) 20t/(t² + 4) = 3 gives 20t = 3t² + 12, so 3t² − 20t + 12 = 0, that is (3t − 2)(t − 6) = 0. t = 2/3 or t = 6.
      (ii) C(t) ≥ 3 for 2/3 ≤ t ≤ 6 (the concentration rises through 3 at t = 2/3, peaks at 5, and falls through 3 at t = 6). The medication is effective for 6 − 2/3 = 16/3 hours, about 5.33 hours (5 hours 20 minutes).
    explanation: |
      Six points, one per sub-part. (A)(i) 2.5 with units and an interpretation. (A)(ii) −0.5 with a comparison (rises faster than it falls, or the concentration is now decreasing). (B)(i) limit 0 with a contextual interpretation. (B)(ii) one reasonable assumption or limitation stated in context. (C)(i) the equation solved algebraically to give t = 2/3 and t = 6. (C)(ii) 16/3 hours ≈ 5.33 hours, with units.
