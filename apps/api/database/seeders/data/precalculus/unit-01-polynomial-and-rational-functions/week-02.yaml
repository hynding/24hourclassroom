    - slug: precalc-u01-w02-q21
      type: short_answer
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 3
      prompt: |
        A function f has the values below.

        | x | −1 | 0 | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|---|---|
        | f(x) | 0 | 5 | 8 | 9 | 8 | 5 | 0 |

        (a) Use first and second differences to show that the table is consistent with a quadratic function.
        (b) Find the leading coefficient a and write f in vertex form.
        (c) State where f is increasing and whether it is concave up or concave down, with a reason based on the rates of change.
      answer: |
        (a) First differences 5, 3, 1, −1, −3, −5; second differences all −2. Constant second differences over equal steps fit a quadratic.
        (b) With step 1, 2a = −2, so a = −1. The vertex is at (2, 9) by symmetry, so f(x) = −(x − 2)² + 9. (Check: f(0) = −4 + 9 = 5.)
        (c) f is increasing for x < 2 (the first differences are positive before x = 2). It is concave down because the rates of change decrease by 2 each step.
      explanation: |
        Three points, one per part. (a) correct differences and the conclusion. (b) a = −1 and the vertex form −(x − 2)² + 9. (c) increasing for x < 2 and concave down, justified by decreasing rates (or negative second differences).
    - slug: precalc-u01-w02-q22
      type: short_answer
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 3
      prompt: |
        Let k(x) = x³ − x.

        (a) Find the average rate of change of k on [0, 2].
        (b) Estimate the rate of change of k at x = 1 using the symmetric interval [0.9, 1.1]. Show your work.
        (c) The values of k at x = 0, 1, 2, 3, 4 are 0, 0, 6, 24, 60. Use differences to explain why k is not a quadratic function.
      answer: |
        (a) k(0) = 0 and k(2) = 8 − 2 = 6, so (6 − 0)/2 = 3.
        (b) k(1.1) = 1.331 − 1.1 = 0.231 and k(0.9) = 0.729 − 0.9 = −0.171, so (0.231 − (−0.171))/0.2 = 0.402/0.2 = 2.01. The rate of change at x = 1 is about 2.
        (c) First differences 0, 6, 18, 36; second differences 6, 12, 18. The second differences are not constant, so the rates of change do not change at a constant rate and k is not quadratic.
      explanation: |
        Three points, one per part. (a) 3. (b) 2.01 (or about 2) with the two function values shown. (c) correct second differences and the statement that they are not constant.
    - slug: precalc-u01-w02-q23
      type: long_answer
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 6
      prompt: |
        A hypothetical theatre studies how weekly ticket revenue R(x), in dollars, depends on the ticket price x, in dollars.

        | x (dollars) | 10 | 12 | 14 | 16 | 18 |
        |---|---|---|---|---|---|
        | R(x) (dollars) | 3500 | 3600 | 3500 | 3200 | 2700 |

        (A) (i) Use differences to show that the data are consistent with a quadratic model.
        (ii) Find the leading coefficient a of the quadratic. Show how the input step affects your calculation.

        (B) Find the average rate of change of R over 10 ≤ x ≤ 14 and interpret it in context.

        (C) (i) Write R in vertex form.
        (ii) State the price that maximises revenue and the maximum revenue.

        (D) Explain, in terms of rates of change, what the concavity of R means for the theatre as the price rises above $12.
      answer: |
        (A)(i) First differences 100, −100, −300, −500; second differences −200, −200, −200. Constant second differences over equal $2 steps fit a quadratic.
        (ii) With step h = 2 the second difference is 2ah² = 8a, so 8a = −200 and a = −25.
        (B) (3500 − 3500)/(14 − 10) = 0 dollars per dollar. Over this range of prices revenue ends where it started: the gain from 10 to 12 is undone from 12 to 14 (the interval is symmetric about the vertex).
        (C)(i) The vertex is at x = 12, R = 3600, so R(x) = −25(x − 12)² + 3600. (Check: R(16) = −25 · 16 + 3600 = 3200.)
        (ii) A price of $12 maximises revenue at $3,600 per week.
        (D) R is concave down (a < 0), so its rate of change keeps decreasing. Above $12 the rate is negative and becomes more negative: each further $2 price rise loses $200 more revenue than the previous one (−100, −300, −500), so raising the price costs the theatre more and more.
      explanation: |
        Six points: (A)(i) 1 point for the differences and conclusion. (A)(ii) 1 point for a = −25 using 2ah² with h = 2 (a = −100 or −50 earns 0). (B) 1 point for 0 with an interpretation that revenue is the same at $10 and $14. (C)(i) 1 point for −25(x − 12)² + 3600. (C)(ii) 1 point for $12 and $3,600. (D) 1 point for linking concave down to decreasing (increasingly negative) rates and the growing revenue loss.
