week: 2
unit: 1
title: "Rates of Change in Linear and Quadratic Functions"
topics: ["1.3"]
guide: guides/week-02.md
guide_description: |
  Linear functions as the functions with a constant rate of change, tested with first differences or with
  average rates when the inputs are unevenly spaced; quadratic functions as the functions whose average rates of
  change over equal intervals change at a constant rate (constant second differences equal to 2ah²); the sign of a
  and concavity; and vertex form as the place where the rate of change switches sign. Worked examples: a
  hypothetical taxi fare table, a thrown-ball height model, recovering a quadratic from a table, and a ticket
  revenue model.
flashcards_description: |
  30 cards on constant rates of change, first and second differences, why quadratic rates change linearly, the
  sign of a and concavity, and vertex form.

flashcards:
  - front: Linear function's average rate of change → what is special
    back: |
      It is the same number m (the slope) on every interval. Over an interval of length Δx the output changes by m · Δx.
    topic_code: "1.3"
  - front: Average rate of mx + b on [x₁, x₂] → simplify
    back: |
      (mx₂ + b − mx₁ − b)/(x₂ − x₁) = m. The intercept cancels and the slope is left, whichever interval you choose.
    topic_code: "1.3"
  - front: Linear function → concave up or down?
    back: |
      Neither. Its rate of change never changes, so the graph is straight.
    topic_code: "1.3"
  - front: Table with equally spaced inputs, equal first differences → conclusion
    back: |
      The data are consistent with a linear function. The common first difference divided by the input step is the slope.
    topic_code: "1.3"
  - front: Table x 0, 1, 3, 4 with y 5, 7, 9, 11 → linear?
    back: |
      No. The outputs rise by 2 each time but the steps are 1, 2, 1, so the rates are 2, 1, 2. Always divide by the step.
    topic_code: "1.3"
  - front: Fare table (2 mi, $8.00), (5 mi, $13.25), (9 mi, $20.25) → base fee
    back: |
      Rates 5.25/3 = 1.75 and 7/4 = 1.75 dollars per mile are equal, so linear: F = 1.75d + 4.50, base fee $4.50.
    topic_code: "1.3"
  - front: Linear f with f(3) = 11 and rate −2.5 → f(10)
    back: |
      Δx = 7, so Δy = −2.5 · 7 = −17.5 and f(10) = 11 − 17.5 = −6.5.
    topic_code: "1.3"
  - front: Second differences → definition
    back: |
      The changes between consecutive first differences in a table with equally spaced inputs.
    topic_code: "1.3"
  - front: Constant nonzero second differences → what kind of function
    back: |
      A quadratic. Its average rates over consecutive equal-length intervals change by the same amount each time.
    topic_code: "1.3"
  - front: Average rate of ax² + bx + c on [x, x + h] → formula
    back: |
      2ax + ah + b, a linear function of x with slope 2a. That is why quadratic rates change at a constant rate.
    topic_code: "1.3"
  - front: Second difference with input step 1 → link to a
    back: |
      It equals 2a. For 2x² − x + 3 the second differences are 4.
    topic_code: "1.3"
  - front: Second difference with input step h → link to a
    back: |
      It equals 2ah². For −5t² + 15t + 2 with h = 0.5 it is 2(−5)(0.25) = −2.5.
    topic_code: "1.3"
  - front: Average rates of a quadratic over consecutive intervals of length h → how they change
    back: |
      They change by 2ah each step. For the ball model with a = −5 and h = 0.5, the rates drop by 5 m/s each half second.
    topic_code: "1.3"
  - front: Table y 5, 8, 15, 26, 41 at x = 0 to 4 → formula
    back: |
      Second differences 4, so a = 2; c = 5; 2 + b + 5 = 8 gives b = 1. y = 2x² + x + 5.
    topic_code: "1.3"
  - front: Quadratic with a > 0 → rates and concavity
    back: |
      The rates of change increase, so the parabola is concave up everywhere and the vertex is a minimum.
    topic_code: "1.3"
  - front: Quadratic with a < 0 → rates and concavity
    back: |
      The rates of change decrease, so the parabola is concave down everywhere and the vertex is a maximum.
    topic_code: "1.3"
  - front: Quadratic and points of inflection → how many
    back: |
      None. Its rates change in one direction only, so its concavity never switches.
    topic_code: "1.3"
  - front: Vertex form a(x − h)² + k → what it shows
    back: |
      The vertex (h, k), the axis of symmetry x = h, and from the sign of a whether (h, k) is a minimum or a maximum.
    topic_code: "1.3"
  - front: Vertex of a parabola → what happens to the rate of change there
    back: |
      The rate switches sign: from negative to positive at a minimum (a > 0), from positive to negative at a maximum (a < 0).
    topic_code: "1.3"
  - front: Average rate of a quadratic on an interval symmetric about its vertex → value
    back: |
      0. The outputs at the two ends are equal by symmetry, so the change in output is 0.
    topic_code: "1.3"
  - front: Average rate of a quadratic on [p, q] → shortcut
    back: |
      a(p + q) + b, which equals the rate of change at the midpoint (p + q)/2. For x² − 5x on [1, 7]: 8 − 5 = 3.
    topic_code: "1.3"
  - front: 2x² − 12x + 7 → vertex form
    back: |
      2(x² − 6x + 9) + 7 − 18 = 2(x − 3)² − 11. Minimum −11 at x = 3.
    topic_code: "1.3"
  - front: x² + 8x + 10 → vertex form
    back: |
      (x² + 8x + 16) + 10 − 16 = (x + 4)² − 6. Vertex (−4, −6).
    topic_code: "1.3"
  - front: Ball height −5t² + 15t + 2 → maximum
    back: |
      −5(t − 1.5)² + 13.25: the ball peaks at 13.25 m when t = 1.5 s, where the average rates switch from positive to negative.
    topic_code: "1.3"
  - front: Revenue model 600x − 25x² → best price
    back: |
      −25(x − 12)² + 3600: revenue peaks at $3,600 at a price of $12. Revenue changes over $2 steps fall by $200 each step.
    topic_code: "1.3"
  - front: Outputs 1, 9, 33, 73 at inputs 0, 2, 4, 6 → find a
    back: |
      Second differences are 16 and 16, and 2ah² = 2a · 4 = 8a = 16, so a = 2.
    topic_code: "1.3"
  - front: Linear vs quadratic → change pattern in one line each
    back: |
      Linear: constant rate of change (equal first differences). Quadratic: the rate of change changes at a constant rate (equal second differences).
    topic_code: "1.3"
  - front: Error-spot → "second differences of 4 mean a = 4"
    back: |
      With input step 1 the second difference is 2a, so a = 2. With step h it is 2ah².
    topic_code: "1.3"
  - front: Error-spot → "(x + 4)² − 6 has vertex (4, −6)"
    back: |
      a(x − h)² + k has vertex (h, k), and x + 4 = x − (−4), so the vertex is (−4, −6).
    topic_code: "1.3"
  - front: Error-spot → "equal average rates on [0, 2] and [2, 4] prove f is linear"
    back: |
      Two equal rates are not enough. x(x − 2)(x − 4) + 4x has rate 4 on both intervals but is a cubic. Linear means equal rates on every interval.
    topic_code: "1.3"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 1.3: constant rates of change, first and second
    differences, quadratic rate patterns and concavity, and vertex form), with 7 questions (about 30%) reviewing
    week 1 (increasing and decreasing, concavity, average rates of change and rates at a point). Opens with a
    shared-context set on a hypothetical thrown-ball table. Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes. No calculator needed.
  questions:
    # ---- Stimulus set: a hypothetical thrown-ball table (1.3, 1.2)
    - slug: precalc-u01-w02-q01
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      stimulus: |
        A hypothetical model gives the height h(t), in metres, of a ball t seconds after it is thrown upward.

        | t (s) | 0 | 0.5 | 1 | 1.5 | 2 | 2.5 | 3 |
        |---|---|---|---|---|---|---|---|
        | h(t) (m) | 2 | 8.25 | 12 | 13.25 | 12 | 8.25 | 2 |
      prompt: |
        Which feature of the table is evidence that h is a quadratic function of t?
      options:
        - "The heights are symmetric about t = 1.5."
        - "The changes in h over consecutive half-second intervals are equal."
        - "The changes in h over consecutive half-second intervals decrease by 2.5 each time."
        - "The height increases and then decreases."
      option_explanations:
        - |
          Symmetry fits a parabola, but many non-quadratic functions are symmetric too; it is not the defining rate pattern.
        - |
          The changes are 6.25, 3.75, 1.25, −1.25, −3.75, −6.25, which are not equal; equal changes would mean linear.
        - |
          Correct. The first differences fall by 2.5 every step, so the second differences are constant: the rate of change changes at a constant rate, the signature of a quadratic.
        - |
          Rising then falling describes a relative maximum, which many kinds of functions have; it does not identify a quadratic.
      answer: 2
    - slug: precalc-u01-w02-q02
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      stimulus: |
        A hypothetical model gives the height h(t), in metres, of a ball t seconds after it is thrown upward.

        | t (s) | 0 | 0.5 | 1 | 1.5 | 2 | 2.5 | 3 |
        |---|---|---|---|---|---|---|---|
        | h(t) (m) | 2 | 8.25 | 12 | 13.25 | 12 | 8.25 | 2 |
      prompt: |
        What is the average rate of change of h over 0 ≤ t ≤ 1.5?
      options:
        - "7.5 metres per second"
        - "11.25 metres per second"
        - "About 8.83 metres per second"
        - "−7.5 metres per second"
      option_explanations:
        - |
          Correct. (13.25 − 2)/(1.5 − 0) = 11.25/1.5 = 7.5 metres per second.
        - |
          11.25 m is the change in height; it still has to be divided by the 1.5 seconds.
        - |
          13.25/1.5 ≈ 8.83 divides the final height, not the change in height, by the time.
        - |
          The ball is higher at t = 1.5 than at t = 0, so the average rate is positive; this subtracts in the wrong order.
      answer: 0
    - slug: precalc-u01-w02-q03
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      stimulus: |
        A hypothetical model gives the height h(t), in metres, of a ball t seconds after it is thrown upward.

        | t (s) | 0 | 0.5 | 1 | 1.5 | 2 | 2.5 | 3 |
        |---|---|---|---|---|---|---|---|
        | h(t) (m) | 2 | 8.25 | 12 | 13.25 | 12 | 8.25 | 2 |
      prompt: |
        How do the average rates of change of h over consecutive half-second intervals behave?
      options:
        - "They all equal 7.5 metres per second."
        - "They decrease by 2.5 metres per second every half second."
        - "Each is the previous one multiplied by the same factor."
        - "They decrease by 5 metres per second every half second."
      option_explanations:
        - |
          7.5 m/s is the average over [0, 1.5] only; over each half second the rates differ (12.5, 7.5, 2.5, ...).
        - |
          2.5 m is the drop in the change of height; as rates, divide by 0.5 s, giving a drop of 5 m/s.
        - |
          The rates 12.5, 7.5, 2.5, −2.5 decrease by subtraction, not by a constant factor (they even change sign).
        - |
          Correct. Dividing the changes by 0.5 gives rates 12.5, 7.5, 2.5, −2.5, −7.5, −12.5 m/s, which fall by 5 each step (2ah = 2(−5)(0.5)).
      answer: 3
    # ---- Independent items
    - slug: precalc-u01-w02-q04
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        Which table could represent a linear function?
      options:
        - "x: 0, 1, 2, 3 and y: 2, 4, 8, 16"
        - "x: 0, 2, 4, 6 and y: 7, 4, 1, −2"
        - "x: 0, 1, 2, 3 and y: 1, 2, 4, 7"
        - "x: 0, 1, 3, 4 and y: 5, 7, 9, 11"
      option_explanations:
        - |
          The changes are 2, 4, 8 over equal steps, so the rate is not constant (the outputs double, which is exponential).
        - |
          Correct. Each step of 2 in x lowers y by 3, so the rate is −3/2 everywhere.
        - |
          The changes 1, 2, 3 over equal steps are not equal; their constant second difference suggests a quadratic.
        - |
          The outputs rise by 2 each time, but the input steps are 1, 2, 1, so the rates are 2, 1, 2: not constant.
      answer: 1
    - slug: precalc-u01-w02-q05
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        For f(x) = 3x² − 2x + 1, the average rates of change over consecutive intervals of length 1 increase by the same amount each time. What is that amount?
      options:
        - "3"
        - "6"
        - "−2"
        - "12"
      option_explanations:
        - |
          3 is a itself; the rates change by 2a times the step length, not by a.
        - |
          Correct. Consecutive average rates over length-h intervals differ by 2ah = 2 · 3 · 1 = 6.
        - |
          −2 is the coefficient b, which shifts every rate equally but does not change the step-to-step difference.
        - |
          12 is 4a, double the true amount; the difference is 2a for intervals of length 1.
      answer: 1
    - slug: precalc-u01-w02-q06
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        Which is f(x) = x² + 8x + 10 written in vertex form?
      options:
        - "f(x) = (x − 4)² − 6"
        - "f(x) = (x + 4)² + 10"
        - "f(x) = (x + 8)² − 54"
        - "f(x) = (x + 4)² − 6"
      option_explanations:
        - |
          (x − 4)² expands to x² − 8x + 16, which has the wrong sign on the x-term.
        - |
          (x + 4)² adds 16 that was not in the original, so 16 must be subtracted: 10 − 16 = −6.
        - |
          Completing the square uses half of 8, which is 4, not the whole coefficient 8.
        - |
          Correct. x² + 8x + 16 − 16 + 10 = (x + 4)² − 6, with vertex (−4, −6).
      answer: 3
    - slug: precalc-u01-w02-q07
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 1
      prompt: |
        On which interval is f(x) = −2(x − 1)² + 8 increasing?
      options:
        - "x < 1"
        - "x > 1"
        - "x < 8"
        - "−1 < x < 3"
      option_explanations:
        - |
          Correct. With a = −2 < 0 the vertex (1, 8) is a maximum, so f rises to the left of x = 1 and falls to the right.
        - |
          To the right of the maximum at x = 1 the function decreases.
        - |
          8 is the maximum output k, not an input; intervals of increase are stated in x.
        - |
          −1 and 3 are the zeros of f; f increases on part of this interval but decreases on 1 < x < 3.
      answer: 0
    - slug: precalc-u01-w02-q08
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        The average rate of change of f(x) = x² − 5x over [1, 7] is 3. At which input is the rate of change of f also equal to 3?
      options:
        - "x = 1"
        - "x = 2.5"
        - "x = 4"
        - "x = 7"
      option_explanations:
        - |
          At the left endpoint the rate is 2(1) − 5 = −3, far below the average.
        - |
          x = 2.5 is the vertex, where the rate of change is 0, not 3.
        - |
          Correct. For a quadratic the average rate on [p, q] equals the rate at the midpoint (p + q)/2 = 4, where the rate is 2(4) − 5 = 3.
        - |
          At the right endpoint the rate is 2(7) − 5 = 9, above the average.
      answer: 2
    - slug: precalc-u01-w02-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        A hypothetical population P (in thousands) has P(4.9) = 96.2, P(5) = 100 and P(5.1) = 103.6, with t in years. Using the symmetric interval [4.9, 5.1], estimate the rate of change of P at t = 5.
      options:
        - "100 thousand per year"
        - "3.8 thousand per year"
        - "38 thousand per year"
        - "37 thousand per year"
      option_explanations:
        - |
          100 is P(5), the population itself, not a rate of change.
        - |
          3.8 is the change P(5) − P(4.9) over 0.1 year, not divided by 0.1, and it uses only the left interval.
        - |
          38 comes from the left-hand interval [4.9, 5] only; the question asks for the symmetric interval.
        - |
          Correct. (P(5.1) − P(4.9))/(5.1 − 4.9) = (103.6 − 96.2)/0.2 = 7.4/0.2 = 37 thousand per year.
      answer: 3
    - slug: precalc-u01-w02-q10
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        A hypothetical taxi fare F (dollars) is a linear function of the distance d (miles). A 2-mile trip costs $8.00 and a 5-mile trip costs $13.25. What does a 0-mile trip cost (the base fee)?
      options:
        - "$8.00"
        - "$4.50"
        - "$1.75"
        - "$6.25"
      option_explanations:
        - |
          $8.00 is the cost of the 2-mile trip; the base fee is the cost at d = 0.
        - |
          Correct. The rate is (13.25 − 8.00)/3 = $1.75 per mile, so F(0) = 8.00 − 2(1.75) = $4.50.
        - |
          $1.75 is the rate (dollars per mile), the slope, not the intercept.
        - |
          This subtracts one mile's worth (1.75) from $8.00; moving from 2 miles back to 0 is two miles.
      answer: 1
    - slug: precalc-u01-w02-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        For which function do the average rates of change over consecutive intervals of equal length decrease?
      options:
        - "f(x) = 2x² − 9x"
        - "g(x) = x² + 100"
        - "h(x) = 5 + 3x − 0.5x²"
        - "k(x) = 4x − 1"
      option_explanations:
        - |
          The leading coefficient 2 is positive, so the rates increase (concave up); the −9x does not change that.
        - |
          a = 1 > 0, so the rates increase; the constant 100 only shifts the graph up.
        - |
          Correct. The leading coefficient is −0.5 < 0, so consecutive rates change by 2ah < 0: they decrease, and h is concave down.
        - |
          A linear function has the same rate, 4, on every interval, so its rates neither increase nor decrease.
      answer: 2
    - slug: precalc-u01-w02-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 1
      prompt: |
        The graph of a quadratic g passes through (−1, 6), (2, −3) and (5, 6), and its vertex is (2, −3). On which interval is g decreasing?
      options:
        - "x < 2"
        - "x > 2"
        - "x < −3"
        - "−1 < x < 5"
      option_explanations:
        - |
          Correct. The vertex (2, −3) is lower than the other points, so it is a minimum; g falls to the left of x = 2 and rises after.
        - |
          To the right of the minimum g rises, from −3 at x = 2 up to 6 at x = 5.
        - |
          −3 is the minimum output, not an input; intervals are stated in x.
        - |
          g decreases only on part of this interval; from x = 2 to 5 it increases.
      answer: 0
    - slug: precalc-u01-w02-q13
      type: multi_select
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 2
      partial_credit: true
      prompt: |
        Let f(x) = −3x² + 12x − 5. Which statements are true? Select all that apply.
      options:
        - "The average rates of change over consecutive intervals of length 1 decrease by 6 each time."
        - "f is concave up."
        - "f(x) = −3(x − 2)² + 7"
        - "f is increasing for x > 2."
        - "The average rate of change of f on [0, 4] is 0."
      option_explanations:
        - |
          Correct. Consecutive rates differ by 2ah = 2(−3)(1) = −6.
        - |
          The leading coefficient −3 is negative, so the rates decrease and f is concave down.
        - |
          Correct. −3(x² − 4x + 4) + 7 = −3x² + 12x − 12 + 7 = −3x² + 12x − 5.
        - |
          The vertex (2, 7) is a maximum, so f decreases for x > 2.
        - |
          Correct. f(0) = −5 and f(4) = −48 + 48 − 5 = −5; [0, 4] is symmetric about the vertex x = 2.
      answer: [0, 2, 4]
    - slug: precalc-u01-w02-q14
      type: multi_select
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 2
      partial_credit: true
      prompt: |
        Which functions are both increasing and concave up on the interval 0 < x < 3? Select all that apply.
      options:
        - "f(x) = x²"
        - "g(x) = −x² + 10"
        - "h(x) = (x + 1)²"
        - "k(x) = 3x + 2"
        - "m(x) = −(x − 5)²"
      option_explanations:
        - |
          Correct. The vertex is at 0, so x² rises on 0 < x < 3, and a = 1 > 0 makes it concave up.
        - |
          With a = −1 and vertex at 0, g falls on 0 < x < 3 and is concave down.
        - |
          Correct. The vertex is at x = −1, so h rises for x > −1, and a = 1 > 0 makes it concave up.
        - |
          k is increasing, but it is linear, so it is not concave up (its rate of change is constant).
        - |
          m rises for x < 5, but a = −1 < 0 makes it concave down.
      answer: [0, 2]
    - slug: precalc-u01-w02-q15
      type: true_false
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        True or false: If a function has average rate of change 4 on [0, 2] and also 4 on [2, 4], then it must be linear.
      answer: false
      explanation: |
        False. A linear function has the same rate on every interval, and two intervals are not enough to show that. For example, f(x) = x(x − 2)(x − 4) + 4x has f(0) = 0, f(2) = 8 and f(4) = 16, so its average rate is 4 on both intervals, yet it is a cubic.
    - slug: precalc-u01-w02-q16
      type: true_false
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        True or false: For f(x) = ax² + bx + c, the second differences of a table with input step 1 all equal 2a.
      answer: true
      explanation: |
        True. The average rate on [x, x + 1] is 2ax + a + b, which grows by 2a each time x increases by 1. With step 1 the first differences are those rates, so the second differences are all 2a.
    - slug: precalc-u01-w02-q17
      type: fill_blank
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        The outputs 5, 8, 15, 26, 41 at the inputs x = 0, 1, 2, 3, 4 come from a quadratic whose leading coefficient is a = ____.
      answer: ["2"]
      explanation: |
        First differences 3, 7, 11, 15; second differences 4. With input step 1, 2a = 4, so a = 2. (The quadratic is 2x² + x + 5.)
    - slug: precalc-u01-w02-q18
      type: fill_blank
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        The average rate of change of f(x) = x² − 3x on the interval [−1, 2] is ____.
      answer: ["-2", "−2"]
      explanation: |
        f(−1) = 1 + 3 = 4 and f(2) = 4 − 6 = −2, so (−2 − 4)/(2 − (−1)) = −6/3 = −2.
