week: 4
unit: 1
title: "Polynomial Functions and Complex Zeros"
topics: ["1.5"]
guide: guides/week-04.md
guide_description: |
  Real and non-real zeros and why only real zeros give x-intercepts; multiplicity and whether the graph crosses or
  touches at an intercept; the Fundamental Theorem of Algebra and conjugate pairs; building a polynomial from its
  zeros and a point; and solving polynomial inequalities with sign charts. Worked examples: the zeros of
  x³ − 2x² + 4x − 8, the graph of (x + 2)(x − 1)²(x − 4), the least-degree polynomial with zeros 3 and 1 + 2i, and
  the inequality x³ − x² − 6x ≥ 0.
flashcards_description: |
  30 cards on zeros, factors and intercepts, non-real zeros, multiplicity and graph shape, the Fundamental Theorem
  of Algebra, conjugate pairs, building polynomials from zeros, and sign-chart inequalities.

flashcards:
  - front: Real zero a of p → three equivalent statements
    back: |
      p(a) = 0; (x − a) is a factor of p(x); (a, 0) is an x-intercept of the graph.
    topic_code: "1.5"
  - front: Non-real zero → does it show on the graph?
    back: |
      No. The graph is drawn in the real plane, so a zero like 2i gives a factor but no x-intercept.
    topic_code: "1.5"
  - front: Complex number a + bi → when is it real?
    back: |
      When b = 0. Every real number is a complex number; "non-real" means b ≠ 0.
    topic_code: "1.5"
  - front: x² + 4 = 0 → solutions
    back: |
      x² = −4, so x = ±2i. There are no real solutions, but there are two complex ones.
    topic_code: "1.5"
  - front: Zeros of x³ − 2x² + 4x − 8 → find by grouping
    back: |
      x²(x − 2) + 4(x − 2) = (x − 2)(x² + 4): zeros 2, 2i, −2i. One x-intercept, (2, 0).
    topic_code: "1.5"
  - front: Zeros of x² − 4x + 13 → quadratic formula
    back: |
      (4 ± √(16 − 52))/2 = (4 ± 6i)/2 = 2 ± 3i. No x-intercepts.
    topic_code: "1.5"
  - front: Multiplicity of a zero → definition
    back: |
      The number of times its factor (x − a) appears in the complete factorisation. In x³(x + 5)², 0 has multiplicity 3 and −5 has multiplicity 2.
    topic_code: "1.5"
  - front: Odd multiplicity (1, 3, 5, …) → graph at the intercept
    back: |
      The graph crosses the x-axis and the sign of p changes. Multiplicity 1 crosses like a line; 3 or more flattens like a cubic as it crosses.
    topic_code: "1.5"
  - front: Even multiplicity (2, 4, …) → graph at the intercept
    back: |
      The graph touches the x-axis and turns back; the sign of p does not change there.
    topic_code: "1.5"
  - front: (x + 2)(x − 1)²(x − 4) → behaviour at each intercept
    back: |
      Crosses at −2, touches and turns at 1, crosses at 4. Degree 4 with positive leading coefficient, so both ends go up.
    topic_code: "1.5"
  - front: Fundamental Theorem of Algebra → statement
    back: |
      A polynomial of degree n ≥ 1 has exactly n complex zeros, counted with multiplicity.
    topic_code: "1.5"
  - front: Degree n → maximum number of real zeros and x-intercepts
    back: |
      At most n of each. Some zeros may be non-real or repeated, giving fewer intercepts.
    topic_code: "1.5"
  - front: Conjugate pair property → statement
    back: |
      If a polynomial has real coefficients and a + bi (b ≠ 0) is a zero, then a − bi is also a zero.
    topic_code: "1.5"
  - front: (x − (a + bi))(x − (a − bi)) → expand
    back: |
      (x − a)² + b² = x² − 2ax + a² + b², a quadratic with real coefficients.
    topic_code: "1.5"
  - front: Conjugate pair 2 ± 3i → quadratic factor
    back: |
      x² − 4x + 13, since (x − 2)² + 9 = x² − 4x + 4 + 9.
    topic_code: "1.5"
  - front: Odd-degree polynomial with real coefficients → guaranteed real zeros?
    back: |
      At least one. Non-real zeros come in pairs, so an odd count cannot be all non-real; also the ends go in opposite directions.
    topic_code: "1.5"
  - front: Degree 6, real coefficients, exactly 2 simple real zeros → non-real zeros?
    back: |
      6 − 2 = 4 non-real zeros, forming two conjugate pairs.
    topic_code: "1.5"
  - front: Degree 4, real coefficients, zeros include 3 and 2i → the rest
    back: |
      −2i must also be a zero; the fourth zero must be real (a non-real one would need its own conjugate).
    topic_code: "1.5"
  - front: Least-degree real polynomial with zeros 3 and 1 + 2i → find it
    back: |
      Include 1 − 2i: (x − 3)(x² − 2x + 5) = x³ − 5x² + 11x − 15.
    topic_code: "1.5"
  - front: k(x + 1)²(x − 3) through (1, −16) → find k
    back: |
      k · 4 · (−2) = −8k = −16, so k = 2: p(x) = 2(x + 1)²(x − 3).
    topic_code: "1.5"
  - front: Zeros alone → what they do not determine
    back: |
      The leading coefficient. k(x − r₁)(x − r₂)… has the same zeros for every nonzero k; one more point fixes k.
    topic_code: "1.5"
  - front: Sign chart for a polynomial inequality → steps
    back: |
      Factor completely, mark the real zeros, find the sign on each interval (test a value or use multiplicities and end behaviour), then read off the intervals that fit.
    topic_code: "1.5"
  - front: x³ − x² − 6x ≥ 0 → solution
    back: |
      x(x − 3)(x + 2) ≥ 0 on [−2, 0] ∪ [3, ∞). Zeros are included because of ≥.
    topic_code: "1.5"
  - front: (x − 1)²(x² + 4) > 0 → solution
    back: |
      x² + 4 > 0 always and (x − 1)² > 0 except at 1, so all real x with x ≠ 1.
    topic_code: "1.5"
  - front: Strict vs non-strict inequality → what happens to the zeros
    back: |
      For > or < the zeros are excluded (p = 0 there); for ≥ or ≤ they are included.
    topic_code: "1.5"
  - front: Calculator zero feature → what it can and cannot find
    back: |
      It finds real zeros (x-intercepts) only. Non-real zeros never appear on a graph or in a zero search.
    topic_code: "1.5"
  - front: Degree-4 graph with only two x-intercepts → possible explanations
    back: |
      The other two zeros are a non-real conjugate pair, or one or both intercepts are repeated zeros (even multiplicity, or odd multiplicity 3).
    topic_code: "1.5"
  - front: Error-spot → "x² = −4 gives x = ±2"
    back: |
      (±2)² = 4, not −4. The solutions are ±2i, since (2i)² = 4i² = −4.
    topic_code: "1.5"
  - front: Error-spot → "1 + 2i is a zero, so the least degree is 2 with zeros 3 and 1 + 2i"
    back: |
      For real coefficients, 1 − 2i must be a zero too, so the least degree with zeros 3 and 1 + 2i is 3.
    topic_code: "1.5"
  - front: Error-spot → "(x + 3)(x − 2)² < 0 on x < −3 and on x = 2"
    back: |
      At x = 2 the expression equals 0, which is not less than 0. The solution is x < −3 only.
    topic_code: "1.5"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topic 1.5: real and non-real zeros, multiplicity, the
    Fundamental Theorem of Algebra, conjugate pairs, building polynomials and sign-chart inequalities), with 7
    questions (about 30%) reviewing weeks 1 to 3 (rates of change, quadratic patterns and vertex form, even and odd
    functions, extrema and differences). Opens with a shared-context set of four items on one degree-5
    polynomial. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes. No calculator needed.
  questions:
    # ---- Stimulus set: one degree-5 polynomial (1.5)
    - slug: precalc-u01-w04-q01
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      stimulus: |
        Let p(x) = (x + 3)(x − 1)²(x² + 4).
      prompt: |
        How many complex zeros does p have, counted with multiplicity?
      options:
        - "3"
        - "4"
        - "5"
        - "2"
      option_explanations:
        - |
          3 counts the distinct linear-looking factors only; (x − 1)² counts twice and x² + 4 contributes two zeros.
        - |
          4 counts (x − 1)² twice but misses that x² + 4 contributes two zeros, or counts it once.
        - |
          Correct. The degree is 1 + 2 + 2 = 5, so by the Fundamental Theorem of Algebra there are 5 zeros: −3, 1, 1, 2i, −2i.
        - |
          2 counts only the distinct real zeros, −3 and 1, ignoring multiplicity and the non-real zeros.
      answer: 2
    - slug: precalc-u01-w04-q02
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      stimulus: |
        Let p(x) = (x + 3)(x − 1)²(x² + 4).
      prompt: |
        What does the graph of p do at x = 1?
      options:
        - "It touches the x-axis and turns back without crossing."
        - "It crosses the x-axis like a line."
        - "It flattens and crosses the x-axis like a cubic."
        - "Nothing special; x = 1 is not an x-intercept."
      option_explanations:
        - |
          Correct. x = 1 has multiplicity 2 (even), so (x − 1)² does not change sign and the graph bounces off the axis.
        - |
          Crossing like a line happens at a zero of multiplicity 1, such as x = −3 here.
        - |
          Flattening and crossing needs odd multiplicity of at least 3; here the multiplicity is 2.
        - |
          p(1) = 0 because of the factor (x − 1)², so (1, 0) is an x-intercept.
      answer: 0
    - slug: precalc-u01-w04-q03
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      stimulus: |
        Let p(x) = (x + 3)(x − 1)²(x² + 4).
      prompt: |
        What is the solution set of p(x) > 0?
      options:
        - "x > −3"
        - "x > 1"
        - "−3 < x < 1"
        - "x > −3 with x ≠ 1"
      option_explanations:
        - |
          This includes x = 1, where p(1) = 0, which is not greater than 0.
        - |
          p is also positive between −3 and 1, because (x − 1)² and x² + 4 are positive there and x + 3 > 0.
        - |
          p is positive for x > 1 too; the even-multiplicity zero at 1 does not change the sign.
        - |
          Correct. x² + 4 and (x − 1)² are positive except at x = 1, so p has the sign of x + 3: positive for x > −3, but p(1) = 0 must be excluded.
      answer: 3
    - slug: precalc-u01-w04-q04
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      stimulus: |
        Let p(x) = (x + 3)(x − 1)²(x² + 4).
      prompt: |
        What are the non-real zeros of p?
      options:
        - "2 and −2"
        - "2i and −2i"
        - "4i and −4i"
        - "2i only"
      option_explanations:
        - |
          (±2)² = 4, so these solve x² = 4, not x² + 4 = 0; they are also real.
        - |
          Correct. x² + 4 = 0 gives x² = −4, so x = ±2i, a conjugate pair.
        - |
          (4i)² = −16, not −4; the square root of 4 must be taken.
        - |
          Real coefficients force non-real zeros to come in conjugate pairs, so −2i is a zero too.
      answer: 1
    # ---- Independent items
    - slug: precalc-u01-w04-q05
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        What are all the zeros of f(x) = x³ − 2x² + 4x − 8?
      options:
        - "2 only"
        - "−2, 2i and −2i"
        - "2, 2i and −2i"
        - "2, 4i and −4i"
      option_explanations:
        - |
          2 is the only real zero, but x² + 4 also gives two non-real zeros, and a cubic has three zeros in all.
        - |
          The factor from grouping is (x − 2), whose zero is +2, not −2.
        - |
          Correct. Grouping gives x²(x − 2) + 4(x − 2) = (x − 2)(x² + 4), so the zeros are 2 and ±2i.
        - |
          x² + 4 = 0 gives x = ±√(−4) = ±2i; this forgets to take the square root of 4.
      answer: 2
    - slug: precalc-u01-w04-q06
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        Which polynomial has real coefficients, the least possible degree, leading coefficient 1, and zeros 3 and 1 + 2i?
      options:
        - "(x − 3)(x − 1 − 2i)"
        - "(x − 3)(x² − 2x − 3)"
        - "(x + 3)(x² − 2x + 5)"
        - "(x − 3)(x² − 2x + 5)"
      option_explanations:
        - |
          This has the right zeros but its coefficients are not real; the conjugate 1 − 2i must also be included.
        - |
          x² − 2x − 3 = (x − 3)(x + 1) has real zeros 3 and −1, not 1 ± 2i; the pair gives (x − 1)² + 4.
        - |
          The factor (x + 3) gives the zero −3 instead of 3; the sign in the linear factor is flipped.
        - |
          Correct. The conjugate pair 1 ± 2i gives (x − 1)² + 4 = x² − 2x + 5, and (x − 3) gives the zero 3: degree 3.
      answer: 3
    - slug: precalc-u01-w04-q07
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        The graph of a polynomial flattens and crosses the x-axis at x = −2, and touches the x-axis and turns back at x = 3. It has no other x-intercepts. Which could be the polynomial?
      options:
        - "(x − 2)³(x + 3)²"
        - "(x + 2)³(x − 3)²"
        - "(x + 2)²(x − 3)³"
        - "(x + 2)(x − 3)"
      option_explanations:
        - |
          The signs are reversed: these factors give zeros at 2 and −3.
        - |
          Correct. Multiplicity 3 at −2 flattens and crosses; multiplicity 2 at 3 touches and turns back.
        - |
          The multiplicities are swapped: this bounces at −2 and flattens through 3.
        - |
          Both zeros have multiplicity 1, so the graph would cross cleanly at both and never bounce.
      answer: 1
    - slug: precalc-u01-w04-q08
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        What is the solution set of x³ − x² − 6x ≥ 0?
      options:
        - "[−2, 0] ∪ [3, ∞)"
        - "(−∞, −2] ∪ [0, 3]"
        - "[3, ∞)"
        - "(−2, 0) ∪ (3, ∞)"
      option_explanations:
        - |
          Correct. x(x − 3)(x + 2) is positive on (−2, 0) and (3, ∞), and the zeros −2, 0 and 3 are included because of ≥.
        - |
          These are the intervals where the expression is negative (or zero); test x = −3: (−3)(−6)(−1) = −18 < 0.
        - |
          This misses the interval [−2, 0], where the expression is also non-negative (at x = −1 it is 4).
        - |
          The inequality is ≥, so the zeros must be included.
      answer: 0
    - slug: precalc-u01-w04-q09
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        Which function is even?
      options:
        - "f(x) = x³ − x"
        - "g(x) = x⁴ + x"
        - "h(x) = 3x⁴ − x² + 9"
        - "k(x) = (x − 1)²"
      option_explanations:
        - |
          Only odd powers appear, so f is odd: f(−x) = −f(x).
        - |
          The term x is an odd power, so g(−x) = x⁴ − x, which is neither g(x) nor −g(x).
        - |
          Correct. Only even powers (including the constant 9 = 9x⁰) appear, so h(−x) = h(x).
        - |
          Expanded, k(x) = x² − 2x + 1 has an odd-power term; its graph is symmetric about x = 1, not the y-axis.
      answer: 2
    - slug: precalc-u01-w04-q10
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        A polynomial with real coefficients has degree 6 and exactly two real zeros, each of multiplicity 1. How many non-real zeros does it have?
      options:
        - "2"
        - "6"
        - "0"
        - "4"
      option_explanations:
        - |
          This pairs the two real zeros with only two non-real ones, a total of 4; a degree-6 polynomial needs 6 zeros.
        - |
          6 is the total number of zeros; two of them are real.
        - |
          With only two real zeros, the other four zeros guaranteed by the Fundamental Theorem of Algebra must be non-real.
        - |
          Correct. The Fundamental Theorem of Algebra gives 6 zeros; 2 are real, so 4 are non-real (two conjugate pairs).
      answer: 3
    - slug: precalc-u01-w04-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        A table of a quadratic function uses inputs spaced 2 apart, and its second differences are all 24. What is the leading coefficient?
      options:
        - "3"
        - "12"
        - "24"
        - "6"
      option_explanations:
        - |
          Correct. With step h the second difference is 2ah², so 2a · 4 = 8a = 24 and a = 3.
        - |
          12 solves 2a = 24, which is the rule for step 1; here the step is 2.
        - |
          24 is the second difference itself, not a.
        - |
          6 divides 24 by 4 (h²) but forgets the factor 2 in 2ah².
      answer: 0
    - slug: precalc-u01-w04-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        What is the average rate of change of f(x) = x(x − 2)² on the interval [0, 3]?
      options:
        - "3"
        - "1"
        - "0"
        - "−1"
      option_explanations:
        - |
          3 is the change f(3) − f(0); it still has to be divided by 3 − 0.
        - |
          Correct. f(0) = 0 and f(3) = 3 · 1 = 3, so (3 − 0)/(3 − 0) = 1.
        - |
          0 would be the average on [0, 2], where f(0) = f(2) = 0, not on [0, 3].
        - |
          The output rises from 0 to 3, so the average rate is positive.
      answer: 1
    - slug: precalc-u01-w04-q13
      type: multi_select
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 2
      partial_credit: true
      prompt: |
        A polynomial p with real coefficients has degree 4. Two of its zeros are 3 and 2i, each of multiplicity 1. Which statements must be true? Select all that apply.
      options:
        - "−2i is also a zero of p."
        - "p has exactly 4 complex zeros, counted with multiplicity."
        - "The remaining zero of p is a real number."
        - "The graph of p crosses the x-axis exactly 4 times."
        - "x² − 4 is a factor of p(x)."
      option_explanations:
        - |
          Correct. Real coefficients force the conjugate of 2i, which is −2i, to be a zero.
        - |
          Correct. By the Fundamental Theorem of Algebra a degree-4 polynomial has exactly 4 zeros counted with multiplicity.
        - |
          Correct. Three zeros are 3, 2i and −2i; a non-real fourth zero would need its own conjugate, making five.
        - |
          The zeros ±2i give no x-intercepts, so the graph meets the axis at most twice.
        - |
          The pair ±2i gives the factor x² + 4; x² − 4 would give the real zeros ±2.
      answer: [0, 1, 2]
    - slug: precalc-u01-w04-q14
      type: multi_select
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 2
      partial_credit: true
      prompt: |
        A polynomial q has degree 4 and a negative leading coefficient. Which statements must be true? Select all that apply.
      options:
        - "q has a global maximum."
        - "q has a global minimum."
        - "q has at most 3 relative extrema."
        - "q is an even function."
        - "q has at most 4 real zeros."
      option_explanations:
        - |
          Correct. Both ends go to −∞, so the highest of the relative maxima is the largest output overall.
        - |
          Both ends go to −∞, so there is no smallest output.
        - |
          Correct. A degree-n polynomial has at most n − 1 turning points.
        - |
          Even degree does not make a function even; −x⁴ + x has degree 4 but q(−1) = −2 ≠ q(1) = 0.
        - |
          Correct. By the Fundamental Theorem of Algebra there are exactly 4 complex zeros, so at most 4 are real.
      answer: [0, 2, 4]
    - slug: precalc-u01-w04-q15
      type: true_false
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        True or false: A polynomial with real coefficients can have exactly one non-real zero.
      answer: false
      explanation: |
        False. For real coefficients, non-real zeros come in conjugate pairs: if a + bi is a zero, so is a − bi. So the number of non-real zeros (with multiplicity) is always even.
    - slug: precalc-u01-w04-q16
      type: true_false
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        True or false: Every polynomial of degree 3 with real coefficients has at least one real zero.
      answer: true
      explanation: |
        True. It has 3 complex zeros; non-real ones come in pairs, so at most 2 are non-real and at least one is real. Graphically, the ends of an odd-degree polynomial go in opposite directions, so the graph must cross the x-axis.
    - slug: precalc-u01-w04-q17
      type: fill_blank
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        In vertex form, x² − 10x + 31 = (x − 5)² + ____.
      answer: ["6"]
      explanation: |
        (x − 5)² = x² − 10x + 25, and 31 − 25 = 6, so x² − 10x + 31 = (x − 5)² + 6. The vertex is (5, 6).
    - slug: precalc-u01-w04-q18
      type: fill_blank
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        Expanding (x − (2 + 3i))(x − (2 − 3i)) gives x² − 4x + ____.
      answer: ["13"]
      explanation: |
        The product is (x − 2)² − (3i)² = x² − 4x + 4 + 9 = x² − 4x + 13, using i² = −1.
    - slug: precalc-u01-w04-q19
      type: numeric
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        The polynomial p(x) = k(x + 1)(x − 2)² passes through the point (0, 8). What is k?
      answer: { value: 2, tolerance: 0 }
      explanation: |
        p(0) = k · (1) · (−2)² = 4k. Setting 4k = 8 gives k = 2.
    - slug: precalc-u01-w04-q20
      type: numeric
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        A cubic polynomial has leading coefficient 5. A table of its values uses inputs spaced 1 apart. What is the constant value of its third differences?
      answer: { value: 30, tolerance: 0 }
      explanation: |
        For degree n with input step 1 the constant nth difference is aₙ · n!. Here 5 · 3! = 5 · 6 = 30.
    - slug: precalc-u01-w04-q21
      type: short_answer
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 3
      prompt: |
        A polynomial p has a zero of multiplicity 2 at x = −1 and a zero of multiplicity 1 at x = 3, has no other zeros, has degree 3, and passes through (1, −16).

        (a) Write a formula for p(x).
        (b) Describe the behaviour of the graph of p at each x-intercept, and state the end behaviour.
        (c) Solve p(x) ≤ 0.
      answer: |
        (a) p(x) = k(x + 1)²(x − 3) with p(1) = k · 4 · (−2) = −8k = −16, so k = 2: p(x) = 2(x + 1)²(x − 3).
        (b) At x = −1 (even multiplicity) the graph touches the axis and turns back; at x = 3 (multiplicity 1) it crosses. Degree 3 with leading coefficient 2 > 0: down on the left, up on the right.
        (c) 2(x + 1)² ≥ 0 always, so p(x) ≤ 0 exactly when x − 3 ≤ 0 or x = −1. The solution is x ≤ 3 (which already includes −1).
      explanation: |
        Three points, one per part. (a) 2(x + 1)²(x − 3), with k found from the point. (b) touch at −1, cross at 3, and correct end behaviour. (c) x ≤ 3, with the endpoint included.
    - slug: precalc-u01-w04-q22
      type: short_answer
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 3
      prompt: |
        Let q(x) = x⁴ − 8x² + 3. Its relative extrema occur at x = −2, x = 0 and x = 2.

        (a) Show algebraically that q is an even function.
        (b) Find the relative extreme values, classify each, and state the global maximum or minimum of q, if any.
        (c) Explain why q has exactly four real zeros.
      answer: |
        (a) q(−x) = (−x)⁴ − 8(−x)² + 3 = x⁴ − 8x² + 3 = q(x).
        (b) q(0) = 3 is a relative maximum; q(−2) = q(2) = 16 − 32 + 3 = −13 are relative minima. Degree 4 with positive leading coefficient: the global minimum is −13 (at x = ±2) and there is no global maximum.
        (c) q falls from ∞ to −13 on x < −2, rises from −13 to 3 on −2 < x < 0, falls from 3 to −13 on 0 < x < 2 and rises to ∞ on x > 2. Each of these four monotonic stretches crosses 0 exactly once, giving four real zeros (consistent with at most 4 for degree 4).
      explanation: |
        Three points, one per part. (a) a correct computation of q(−x). (b) all three values classified and the global minimum −13 with no global maximum. (c) an argument from the extrema and end behaviour (sign changes) giving four crossings.
    - slug: precalc-u01-w04-q23
      type: short_answer
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 3
      prompt: |
        A polynomial f with real coefficients has degree 5. Its zeros include 1 − i and 4i.

        (a) List every zero of f that you can determine, and explain why.
        (b) How many real zeros does f have, counted with multiplicity? Justify.
        (c) Write a quadratic with real coefficients that has the zeros 1 ± i.
      answer: |
        (a) 1 − i, 1 + i, 4i and −4i: real coefficients force each conjugate to be a zero too.
        (b) Exactly one. Degree 5 gives 5 zeros counted with multiplicity; four are the non-real zeros in (a), so the fifth must be real (a non-real fifth zero would need a conjugate).
        (c) (x − 1)² + 1 = x² − 2x + 2.
      explanation: |
        Three points, one per part. (a) all four zeros with the conjugate-pair reason. (b) one real zero with the counting argument. (c) x² − 2x + 2 (or any nonzero multiple).
    - slug: precalc-u01-w04-q24
      type: long_answer
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 6
      prompt: |
        Let p(x) = x⁴ − 2x³ + 5x² − 8x + 4. It is known that 2i is a zero of p and that x = 1 is a zero of multiplicity 2.

        (A) (i) Explain why −2i must also be a zero of p, and write the quadratic factor of p(x) that corresponds to the zeros 2i and −2i.
        (ii) Write p(x) in factored form as a product of factors with real coefficients.

        (B) How many x-intercepts does the graph of p have? Describe the behaviour of the graph at each one.

        (C) Solve p(x) > 0. Justify your answer.

        (D) Find the average rate of change of p on the interval [0, 2].
      answer: |
        (A)(i) p has real coefficients, so its non-real zeros come in conjugate pairs; the conjugate of 2i is −2i. The pair gives (x − 2i)(x + 2i) = x² + 4.
        (ii) The double zero at 1 gives (x − 1)², and the degrees add to 4, so p(x) = (x − 1)²(x² + 4). (Check: (x² − 2x + 1)(x² + 4) = x⁴ − 2x³ + 5x² − 8x + 4.)
        (B) One x-intercept, (1, 0). The zeros ±2i are non-real and give no intercepts. At x = 1 the multiplicity is 2, so the graph touches the axis and turns back.
        (C) x² + 4 > 0 for every real x, and (x − 1)² > 0 for every x except x = 1, where it is 0. So p(x) > 0 for all real x except x = 1. Solution: x ≠ 1, that is (−∞, 1) ∪ (1, ∞).
        (D) p(0) = 4 and p(2) = (1)²(8) = 8, so (8 − 4)/(2 − 0) = 2.
      explanation: |
        Six points: (A)(i) 1 point for the conjugate-pair reason (real coefficients) and the factor x² + 4. (A)(ii) 1 point for (x − 1)²(x² + 4). (B) 1 point for exactly one intercept at (1, 0) with the touch-and-turn behaviour. (C) 2 points: 1 for the solution x ≠ 1, 1 for a justification based on the signs of both factors (or a correct sign chart). (D) 1 point for 2.
