week: 3
unit: 1
title: "Polynomial Functions and Rates of Change"
topics: ["1.4"]
guide: guides/week-03.md
guide_description: |
  Polynomial vocabulary (degree, leading term and coefficient) from standard and factored form; relative and global
  extrema and when each exists; points of inflection as places where the rate of change switches direction; even
  and odd functions by symmetry and by the f(−x) test; and constant nth differences for a degree-n polynomial.
  Worked examples: the extrema and inflection point of x³ − 3x, the global minimum of x⁴ − 4x², a cubic's
  inflection point halfway between its extrema, and a hypothetical open-box volume model.
flashcards_description: |
  30 cards on degree and leading coefficient, relative and global extrema, turning points, points of inflection,
  even and odd functions, and nth differences.

flashcards:
  - front: Polynomial function → what makes an expression one
    back: |
      A sum of terms aₖxᵏ with whole-number exponents k ≥ 0 and real coefficients. No negative or fractional exponents, no variables in denominators.
    topic_code: "1.4"
  - front: Degree and leading coefficient of (2x − 1)³(x + 4) → find without expanding
    back: |
      Leading term (2x)³ · x = 8x⁴: degree 4, leading coefficient 8.
    topic_code: "1.4"
  - front: Polynomial graph → two shape guarantees
    back: |
      It is smooth (no corners) and unbroken (no gaps, jumps or asymptotes). So a sign change forces a zero, and the graph must turn between two zeros.
    topic_code: "1.4"
  - front: Relative maximum → where it happens
    back: |
      Where the function switches from increasing to decreasing. The maximum value is the output there.
    topic_code: "1.4"
  - front: Relative minimum → where it happens
    back: |
      Where the function switches from decreasing to increasing. The minimum value is the output there.
    topic_code: "1.4"
  - front: Global (absolute) maximum → meaning
    back: |
      The largest output over the whole domain. It may not exist: x³ has no global maximum.
    topic_code: "1.4"
  - front: Odd-degree polynomial on all reals → global extrema?
    back: |
      None. One end goes to ∞ and the other to −∞, so no output is largest or smallest.
    topic_code: "1.4"
  - front: Even-degree polynomial, positive leading coefficient → global extrema?
    back: |
      A global minimum (the lowest relative minimum) and no global maximum. Negative leading coefficient: a global maximum only.
    topic_code: "1.4"
  - front: Polynomial on a closed interval [a, b] → where the global extrema are
    back: |
      At relative extrema inside the interval or at the endpoints a and b. Both a global maximum and minimum always exist.
    topic_code: "1.4"
  - front: Degree n → maximum number of turning points
    back: |
      n − 1. A quintic has at most 4 relative extrema; a cubic at most 2.
    topic_code: "1.4"
  - front: Two consecutive real zeros of a polynomial → what lies between
    back: |
      At least one relative extremum: the graph leaves the axis and must turn back to meet it again.
    topic_code: "1.4"
  - front: x³ − 3x → relative extrema
    back: |
      Relative maximum 2 at x = −1 and relative minimum −2 at x = 1. Neither is global (odd degree).
    topic_code: "1.4"
  - front: x⁴ − 4x² → global minimum
    back: |
      −4, at x = −√2 and x = √2. The relative maximum 0 at x = 0 is not global; there is no global maximum.
    topic_code: "1.4"
  - front: Point of inflection → what changes there
    back: |
      Concavity. The rate of change switches from increasing to decreasing or from decreasing to increasing.
    topic_code: "1.4"
  - front: Rate of change at a smooth relative extremum → value
    back: |
      0. The graph is momentarily flat as it switches direction.
    topic_code: "1.4"
  - front: Rate of change at a point of inflection → what is special
    back: |
      It reaches a relative maximum or minimum: the curve is steepest (or least steep) there compared with nearby points.
    topic_code: "1.4"
  - front: Cubic ax³ + bx² + cx + d → its point of inflection
    back: |
      Exactly one, at x = −b/(3a), halfway between the relative extrema when there are two. The graph is symmetric about it.
    topic_code: "1.4"
  - front: −x³ + 6x² − 9x + 5 with extrema (1, 1) and (3, 5) → inflection point
    back: |
      Halfway, x = 2, and p(2) = 3: the point (2, 3). Concave up for x < 2, concave down for x > 2.
    topic_code: "1.4"
  - front: x³ − 3x → concavity
    back: |
      Concave down on x < 0, concave up on x > 0, with a point of inflection at (0, 0).
    topic_code: "1.4"
  - front: Even function → definition and graph
    back: |
      f(−x) = f(x) for every x in the domain; the graph is symmetric about the y-axis.
    topic_code: "1.4"
  - front: Odd function → definition and graph
    back: |
      f(−x) = −f(x) for every x in the domain; the graph is symmetric about the origin (unchanged by a 180° rotation).
    topic_code: "1.4"
  - front: Polynomial with only even powers, like x⁴ − 4x² + 7 → even or odd?
    back: |
      Even. A constant counts as an even power (x⁰). Replacing x by −x changes nothing.
    topic_code: "1.4"
  - front: Odd polynomial like 2x⁵ − 7x → which point is always on its graph
    back: |
      The origin: f(0) = −f(0) forces f(0) = 0. Every odd polynomial has only odd powers and no constant term.
    topic_code: "1.4"
  - front: Even f with f(3) = −7 → f(−3); odd g with g(3) = −7 → g(−3)
    back: |
      f(−3) = −7 (same output). g(−3) = 7 (opposite output).
    topic_code: "1.4"
  - front: Degree n polynomial with equally spaced inputs → which differences are constant
    back: |
      The nth differences. Linear: first; quadratic: second; cubic: third. The (n + 1)th differences are 0.
    topic_code: "1.4"
  - front: Constant nth difference with step 1 → link to aₙ
    back: |
      aₙ · n!. Cubic: 6a. Quartic: 24a. For 3x⁴ + x it is 72.
    topic_code: "1.4"
  - front: Third differences of −12 with step 1 → degree and leading coefficient
    back: |
      Degree 3, and 6a = −12 gives a = −2.
    topic_code: "1.4"
  - front: Error-spot → "x³ + 1 is odd because x³ is odd"
    back: |
      The constant spoils it: (−x)³ + 1 = −x³ + 1, which is not −(x³ + 1) = −x³ − 1. A mix of odd and even powers is neither.
    topic_code: "1.4"
  - front: Error-spot → "the relative maximum of x³ − 3x is −1"
    back: |
      −1 is where the maximum occurs. The maximum value is the output f(−1) = 2.
    topic_code: "1.4"
  - front: Error-spot → "f(2) = f(−2), so f is even"
    back: |
      Evenness needs f(−x) = f(x) for every x. One matching pair proves nothing; one mismatching pair is enough to show f is not even.
    topic_code: "1.4"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 1.4: degree and leading coefficient, relative and
    global extrema, points of inflection, even and odd functions, and nth differences), with 7 questions (about
    30%) reviewing weeks 1 and 2 (rates of change, concavity from tables, quadratic rate patterns and vertex form).
    Opens with a shared-context set on one cubic. Multiple choice, select-all, true/false and numeric items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes. A graphing calculator helps only on the long answer, where
    its output is given.
  questions:
    # ---- Stimulus set: one cubic (1.4, 1.2)
    - slug: precalc-u01-w03-q01
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      stimulus: |
        The polynomial p(x) = −x³ + 6x² − 9x + 5 has a relative minimum at x = 1 and a relative maximum at x = 3, and no other relative extrema.

        | x | 0 | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|---|
        | p(x) | 5 | 1 | 3 | 5 | 1 | −15 |
      prompt: |
        On which interval is p increasing?
      options:
        - "x < 1"
        - "x > 3"
        - "0 < x < 4"
        - "1 < x < 3"
      option_explanations:
        - |
          p falls from 5 at x = 0 to the relative minimum 1 at x = 1, so it is decreasing for x < 1.
        - |
          After the relative maximum at x = 3, p decreases (5, 1, −15).
        - |
          p decreases on 0 < x < 1 and on 3 < x < 4, so it is not increasing on this whole interval.
        - |
          Correct. p switches from decreasing to increasing at the minimum x = 1 and back to decreasing at the maximum x = 3.
      answer: 3
    - slug: precalc-u01-w03-q02
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      stimulus: |
        The polynomial p(x) = −x³ + 6x² − 9x + 5 has a relative minimum at x = 1 and a relative maximum at x = 3, and no other relative extrema.

        | x | 0 | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|---|
        | p(x) | 5 | 1 | 3 | 5 | 1 | −15 |
      prompt: |
        Which point is the point of inflection of the graph of p?
      options:
        - "(1, 1)"
        - "(2, 3)"
        - "(3, 5)"
        - "(0, 5)"
      option_explanations:
        - |
          (1, 1) is the relative minimum, where p changes direction, not concavity.
        - |
          Correct. A cubic's inflection point lies halfway between its extrema, at x = 2 (also −b/(3a) = −6/(−3) = 2), and p(2) = 3.
        - |
          (3, 5) is the relative maximum, where the rate of change is 0, not where concavity changes.
        - |
          (0, 5) is the vertical intercept; the concavity does not change there.
      answer: 1
    - slug: precalc-u01-w03-q03
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      stimulus: |
        The polynomial p(x) = −x³ + 6x² − 9x + 5 has a relative minimum at x = 1 and a relative maximum at x = 3, and no other relative extrema.

        | x | 0 | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|---|
        | p(x) | 5 | 1 | 3 | 5 | 1 | −15 |
      prompt: |
        Considering all real numbers x, which statement about the global extrema of p is true?
      options:
        - "p has no global maximum and no global minimum."
        - "The global maximum of p is 5."
        - "The global minimum of p is 1."
        - "p has a global maximum of 5 and a global minimum of 1."
      option_explanations:
        - |
          Correct. p has odd degree with leading coefficient −1, so p(x) → ∞ as x → −∞ and p(x) → −∞ as x → ∞; no output is largest or smallest.
        - |
          5 is only a relative maximum: for negative x the outputs grow without bound (p(−1) = 21 already exceeds 5).
        - |
          1 is only a relative minimum: p(5) = −15 is already smaller.
        - |
          These are the relative extrema; an odd-degree polynomial has no global extrema on all real numbers.
      answer: 0
    - slug: precalc-u01-w03-q04
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      stimulus: |
        The polynomial p(x) = −x³ + 6x² − 9x + 5 has a relative minimum at x = 1 and a relative maximum at x = 3, and no other relative extrema.

        | x | 0 | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|---|
        | p(x) | 5 | 1 | 3 | 5 | 1 | −15 |
      prompt: |
        What is the average rate of change of p on the interval [0, 3]?
      options:
        - "5/3"
        - "−4"
        - "0"
        - "5"
      option_explanations:
        - |
          5/3 divides p(3) by 3; the numerator should be the change p(3) − p(0) = 0.
        - |
          −4 is the change from x = 0 to x = 1 only, not over the whole interval [0, 3].
        - |
          Correct. p(0) = 5 and p(3) = 5, so (5 − 5)/(3 − 0) = 0, even though p falls and rises in between.
        - |
          5 is the output at both ends; the average rate compares their difference with the change in x.
      answer: 2
    # ---- Independent items
    - slug: precalc-u01-w03-q05
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        What are the degree and leading coefficient of p(x) = (2x − 1)³(x + 4)?
      options:
        - "Degree 4, leading coefficient 8"
        - "Degree 3, leading coefficient 2"
        - "Degree 4, leading coefficient 2"
        - "Degree 4, leading coefficient 6"
      option_explanations:
        - |
          Correct. The leading term is (2x)³ · x = 8x⁴.
        - |
          The factor (x + 4) adds one more power of x, and the 2 is cubed along with x.
        - |
          The 2 in (2x − 1) is raised to the third power, giving 8, not 2.
        - |
          6 multiplies 2 by the exponent 3; the coefficient is 2³ = 8.
      answer: 0
    - slug: precalc-u01-w03-q06
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        Which function is odd?
      options:
        - "f(x) = x³ + 1"
        - "g(x) = x⁴ − x²"
        - "h(x) = x² + x"
        - "k(x) = 2x⁵ − 7x"
      option_explanations:
        - |
          The constant 1 is an even power: f(−x) = −x³ + 1, which is not −f(x) = −x³ − 1.
        - |
          Only even powers appear, so g(−x) = g(x): g is even, not odd.
        - |
          A mix of an even and an odd power: h(−x) = x² − x, which is neither h(x) nor −h(x).
        - |
          Correct. Only odd powers appear: k(−x) = −2x⁵ + 7x = −k(x).
      answer: 3
    - slug: precalc-u01-w03-q07
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        A table of a cubic polynomial with inputs spaced 1 apart has constant third differences of 12. What is the leading coefficient?
      options:
        - "12"
        - "4"
        - "2"
        - "6"
      option_explanations:
        - |
          12 is the third difference itself, which equals 6a for a cubic with step 1.
        - |
          This divides by 3 (the degree); the divisor should be 3! = 6.
        - |
          Correct. With step 1, the constant third difference of a cubic is a · 3! = 6a, so 6a = 12 and a = 2.
        - |
          This divides by 2, the factor used for quadratics; a cubic uses 3! = 6.
      answer: 2
    - slug: precalc-u01-w03-q08
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        What is the greatest possible number of relative extrema (turning points) for a polynomial of degree 5?
      options:
        - "5"
        - "4"
        - "3"
        - "6"
      option_explanations:
        - |
          5 is the greatest possible number of real zeros, not turning points.
        - |
          Correct. A polynomial of degree n has at most n − 1 turning points, so at most 4.
        - |
          A quintic can have 4 turning points, for example (x + 2)(x + 1)x(x − 1)(x − 2), which turns between each pair of its five zeros.
        - |
          The number of turning points is less than the degree, never more.
      answer: 1
    - slug: precalc-u01-w03-q09
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        A function f is even, and f(3) = −7. What is f(−3)?
      options:
        - "7"
        - "−7"
        - "3"
        - "−3"
      option_explanations:
        - |
          Changing the sign of the output is what an odd function does; an even function keeps it.
        - |
          Correct. Even means f(−x) = f(x), so f(−3) = f(3) = −7.
        - |
          3 is the original input, not an output of f; the question asks for f(−3).
        - |
          −3 is the new input; the question asks for the output f(−3).
      answer: 1
    - slug: precalc-u01-w03-q10
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        For which function do the average rates of change over consecutive intervals of length 1 decrease by 4 each time?
      options:
        - "y = −2x² + 5x"
        - "y = −4x² + 5x"
        - "y = −4x + 5"
        - "y = 2x² − 4x"
      option_explanations:
        - |
          Correct. Consecutive rates of a quadratic differ by 2ah = 2(−2)(1) = −4.
        - |
          With a = −4 the rates drop by 2(−4) = −8 each step, not −4.
        - |
          A linear function has the same rate (−4) on every interval; its rates do not change at all.
        - |
          a = 2 > 0 makes the rates increase by 4, not decrease.
      answer: 0
    - slug: precalc-u01-w03-q11
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        The rate of change of a polynomial f is increasing for x < 2 and decreasing for x > 2. Which statement must be true?
      options:
        - "f has a relative maximum at x = 2."
        - "f is increasing for x < 2."
        - "f(2) = 0"
        - "The graph of f has a point of inflection at x = 2."
      option_explanations:
        - |
          A relative maximum needs f itself to switch from increasing to decreasing; here it is the rate of change that switches.
        - |
          An increasing rate of change means concave up, which can happen while f decreases (with negative slopes moving toward 0).
        - |
          Nothing is said about the output at x = 2; inflection points need not be zeros.
        - |
          Correct. The rate switches from increasing to decreasing, so f changes from concave up to concave down at x = 2.
      answer: 3
    - slug: precalc-u01-w03-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 1
      prompt: |
        A polynomial g has a relative maximum of 4 at x = −1 and a relative minimum of −3 at x = 2, and g is decreasing on −1 < x < 2. How many zeros does g have on the interval (−1, 2)?
      options:
        - "None"
        - "At least two"
        - "Exactly one"
        - "It cannot be determined."
      option_explanations:
        - |
          g goes continuously from 4 down to −3, so it must pass through 0 somewhere in between.
        - |
          A decreasing function takes each output only once on the interval, so it cannot hit 0 twice.
        - |
          Correct. g is continuous and changes from 4 to −3, so it crosses 0; because it is decreasing throughout, it crosses only once.
        - |
          The values at the ends and the fact that g is decreasing are enough to fix the count at one.
      answer: 2
    - slug: precalc-u01-w03-q13
      type: multi_select
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 2
      partial_credit: true
      prompt: |
        Let f(x) = x⁴ − 4x². Its relative extrema occur at x = −√2, x = 0 and x = √2. Which statements are true? Select all that apply.
      options:
        - "f is an even function."
        - "The global minimum value of f is −4."
        - "f has a global maximum."
        - "f has exactly three turning points."
        - "f is an odd function."
      option_explanations:
        - |
          Correct. Only even powers appear, so f(−x) = f(x).
        - |
          Correct. f(±√2) = 4 − 8 = −4, lower than the relative maximum f(0) = 0, and an even-degree polynomial with positive leading coefficient has a global minimum.
        - |
          Both ends go to ∞, so there is no largest output; f(0) = 0 is only a relative maximum.
        - |
          Correct. The three extrema at −√2, 0 and √2 are three turning points, the most a degree-4 polynomial can have.
        - |
          f(−x) = f(x), not −f(x); for example f(1) = −3 and f(−1) = −3, not 3.
      answer: [0, 1, 3]
    - slug: precalc-u01-w03-q14
      type: multi_select
      topic_code: "1.1"
      source: "AP Precalculus CED, Topic 1.1"
      points: 2
      partial_credit: true
      prompt: |
        A continuous function h has the values below.

        | x | 0 | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|---|
        | h(x) | 2 | 5 | 6 | 6 | 5 | 2 |

        Which statements are supported by the table? Select all that apply.
      options:
        - "h appears to be concave down on 0 < x < 5."
        - "h is increasing on 0 < x < 5."
        - "The average rate of change of h on [0, 5] is 0."
        - "h must have a zero on (0, 5)."
        - "The average rate of change of h on [1, 2] is greater than on [3, 4]."
      option_explanations:
        - |
          Correct. The changes 3, 1, 0, −1, −3 are decreasing, so the rate of change is decreasing.
        - |
          h falls from 6 to 2 for x > 3, so it is not increasing on the whole interval.
        - |
          Correct. h(0) = h(5) = 2, so the change in output is 0.
        - |
          Every listed value is positive and there is no sign change, so no zero is forced.
        - |
          Correct. On [1, 2] the rate is 1; on [3, 4] it is −1.
      answer: [0, 2, 4]
    - slug: precalc-u01-w03-q15
      type: true_false
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        True or false: Every polynomial function of odd degree has a global maximum on the set of all real numbers.
      answer: false
      explanation: |
        False. For odd degree one end of the graph goes to ∞ and the other to −∞, so there is no largest output. For example x³ takes arbitrarily large values.
    - slug: precalc-u01-w03-q16
      type: true_false
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        True or false: A polynomial whose terms all have even powers of x (a constant term counts as x⁰) is an even function.
      answer: true
      explanation: |
        True. (−x)ᵏ = xᵏ for every even k, so replacing x with −x leaves every term, and the polynomial, unchanged: f(−x) = f(x).
    - slug: precalc-u01-w03-q17
      type: fill_blank
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        For p(x) = 3x⁴ + x, a table with inputs spaced 1 apart has constant fourth differences equal to ____.
      answer: ["72"]
      explanation: |
        For degree n with step 1 the constant nth difference is aₙ · n!. Here 3 · 4! = 3 · 24 = 72.
    - slug: precalc-u01-w03-q18
      type: fill_blank
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        The average rate of change of f(x) = x³ − 3x on the interval [−2, 2] is ____.
      answer: ["1"]
      explanation: |
        f(−2) = −8 + 6 = −2 and f(2) = 8 − 6 = 2, so (2 − (−2))/(2 − (−2)) = 4/4 = 1.
    - slug: precalc-u01-w03-q19
      type: numeric
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 1
      prompt: |
        The relative extrema of f(x) = x³ − 3x occur at x = −1 and x = 1. What is the relative maximum value of f?
      answer: { value: 2, tolerance: 0 }
      explanation: |
        f(−1) = −1 + 3 = 2 and f(1) = 1 − 3 = −2. The cubic rises to x = −1 and then falls, so the relative maximum value is 2 (it occurs at x = −1).
    - slug: precalc-u01-w03-q20
      type: numeric
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 1
      prompt: |
        What is the maximum value of g(x) = −x² + 6x − 4? Give the exact value.
      answer: { value: 5, tolerance: 0 }
      explanation: |
        Complete the square: −(x² − 6x + 9) − 4 + 9 = −(x − 3)² + 5. With a = −1 < 0 the vertex is a maximum, so the maximum value is 5, at x = 3.
    - slug: precalc-u01-w03-q21
      type: short_answer
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 3
      prompt: |
        A polynomial f has the values below.

        | x | −3 | −2 | −1 | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|---|---|---|
        | f(x) | −18 | −2 | 2 | 0 | −2 | 2 | 18 |

        (a) Use differences to find the degree of the lowest-degree polynomial that fits the table, and its leading coefficient.
        (b) Assuming f has its relative extrema at listed inputs, identify the relative maximum and relative minimum values and where they occur.
        (c) Does the table suggest that f is even, odd or neither? Justify using specific values.
      answer: |
        (a) First differences 16, 4, −2, −2, 4, 16; second −12, −6, 0, 6, 12; third 6, 6, 6, 6. Constant third differences: degree 3. With step 1, 6a = 6, so a = 1. (The function is x³ − 3x.)
        (b) Relative maximum 2 at x = −1; relative minimum −2 at x = 1.
        (c) Odd: f(−x) = −f(x) for every pair in the table, for example f(−2) = −2 = −f(2) and f(−3) = −18 = −f(3), and f(0) = 0.
      explanation: |
        Three points, one per part. (a) constant third differences, degree 3 and a = 1. (b) both extrema with their locations (values, not just inputs). (c) odd, supported by at least two paired values.
    - slug: precalc-u01-w03-q22
      type: short_answer
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 3
      prompt: |
        Two functions A and B have the values below.

        | x | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | A(x) | 7 | 4 | 1 | −2 | −5 |
        | B(x) | 1 | 3 | 9 | 19 | 33 |

        (a) One function is linear and one is quadratic. Identify which is which, using differences.
        (b) Write a formula for the linear function.
        (c) Write a formula for the quadratic function.
      answer: |
        (a) A has constant first differences (−3 each step), so A is linear. B has first differences 2, 6, 10, 14 and constant second differences 4, so B is quadratic.
        (b) A(x) = −3x + 7.
        (c) 2a = 4 gives a = 2; B(0) = 1 gives c = 1; B(1) = 2 + b + 1 = 3 gives b = 0. So B(x) = 2x² + 1.
      explanation: |
        Three points, one per part. (a) both identifications with the supporting differences. (b) −3x + 7. (c) 2x² + 1.
    - slug: precalc-u01-w03-q23
      type: long_answer
      topic_code: "1.4"
      source: "AP Precalculus CED, Topic 1.4"
      points: 6
      prompt: |
        A hypothetical packaging designer makes an open box from a 20 cm by 12 cm sheet of card by cutting a square of side x cm from each corner and folding up the sides. The volume of the box is V(x) = x(20 − 2x)(12 − 2x) cubic centimetres.

        (A) (i) Explain why the domain of V in this context is 0 < x < 6.
        (ii) State the degree and leading coefficient of V.

        (B) (Calculator.) A graphing calculator shows that V has a relative maximum at x ≈ 2.427, where V ≈ 262.68. Interpret this in context, and explain why it is also the global maximum of V on 0 < x < 6.

        (C) Find the average rates of change of V on [1, 2] and on [3, 4]. Include units, and explain what the signs tell you.

        (D) Using V(0) = 0, V(1) and V(2), decide whether V appears concave up or concave down on 0 < x < 2. Justify your answer.
      answer: |
        (A)(i) The cut x must be positive, and the shorter side 12 − 2x must stay positive, so x < 6. (The longer side 20 − 2x is then positive too.)
        (ii) The leading term is x · (−2x) · (−2x) = 4x³: degree 3, leading coefficient 4.
        (B) Cutting squares of side about 2.43 cm gives the largest possible box, with volume about 262.7 cm³. On the domain, V is near 0 as x → 0 and as x → 6 and has only this one turning point inside the interval, so it rises to this value and then falls: no other volume in the domain is larger.
        (C) V(1) = 1 · 18 · 10 = 180, V(2) = 2 · 16 · 8 = 256, V(3) = 3 · 14 · 6 = 252, V(4) = 4 · 12 · 4 = 192. On [1, 2]: (256 − 180)/1 = 76 cm³ per cm. On [3, 4]: (192 − 252)/1 = −60 cm³ per cm. Volume increases as the cut grows from 1 to 2 cm (before the maximum) and decreases from 3 to 4 cm (after it).
        (D) The changes on [0, 1] and [1, 2] are 180 and 76 cm³. Over equal intervals the change is decreasing, so the rate of change is decreasing and V appears concave down on 0 < x < 2.
      explanation: |
        Six points: (A)(i) 1 point for both conditions x > 0 and 12 − 2x > 0. (A)(ii) 1 point for degree 3 and leading coefficient 4. (B) 1 point for the interpretation (cut size and maximum volume with units) together with a reason it is global on the domain. (C) 2 points: 1 for both rates 76 and −60 with units, 1 for interpreting the signs as volume increasing then decreasing. (D) 1 point for concave down justified by decreasing changes over equal intervals.
