    type: short_answer
    topic_code: "3.14"
    source: "AP Precalculus CED, Topic 3.14"
    points: 3
    prompt: |
      Consider the polar function r = 4 cos(2θ) for 0 ≤ θ ≤ 2π.
      (a) How many petals does its graph have? Explain how you know.
