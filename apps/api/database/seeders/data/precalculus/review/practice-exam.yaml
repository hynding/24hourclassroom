  # ---- Section II: free response (q43-q46), 6 points each. FRQ 1-2 calculator, FRQ 3-4 no calculator.
  - slug: precalc-final-q43
    type: long_answer
    topic_code: "2.7"
    source: "AP Precalculus CED, Topic 2.7"
    points: 6
    prompt: |
      (Calculator. Free-response question 1: Function Concepts.)

      Let f(x) = (2x + 3)/(x − 1) and g(x) = 3 ln x + 1.

      (A) (i) Find the value of g(f(4)), to three decimal places.
      (ii) Find all values of x, for x > 0, where f(x) = g(x). Give each to three decimal places.

      (B) (i) Find an expression for f⁻¹(x).
      (ii) Use limit notation to describe the end behaviour of f as x increases without bound, and the behaviour of f as x approaches 1 from the right.

      (C) Find the average rates of change of g over the intervals [1, 3] and [3, 5]. Use them to explain whether the graph of g is concave up or concave down on [1, 5].
    answer: |
      (A)(i) f(4) = 11/3, so g(f(4)) = 3 ln(11/3) + 1 ≈ 4.898.
      (ii) Graphing y = f(x) and y = g(x) for x > 0 (or the difference f(x) − g(x)) gives intersections at x ≈ 0.182 and x ≈ 3.094.
      (B)(i) Swap and solve: x = (2y + 3)/(y − 1) gives xy − x = 2y + 3, so y(x − 2) = x + 3 and f⁻¹(x) = (x + 3)/(x − 2).
      (ii) lim (x → ∞) f(x) = 2 (equal degrees, ratio of leading coefficients) and lim (x → 1⁺) f(x) = ∞ (the numerator approaches 5 while the denominator is a small positive number).
      (C) Over [1, 3]: (g(3) − g(1))/2 = (3 ln 3)/2 ≈ 1.648. Over [3, 5]: (g(5) − g(3))/2 = (3 ln(5/3))/2 ≈ 0.766. The average rates of change over consecutive equal-length intervals are decreasing, so the graph of g is concave down on [1, 5].
    explanation: |
      Six points.
      (A)(i) 1 point: 4.898 (or 4.897/4.898 with supporting work).
      (A)(ii) 1 point: both values, 0.182 and 3.094. Only one value earns no point.
      (B)(i) 1 point: (x + 3)/(x − 2) or an equivalent expression.
      (B)(ii) 1 point: both limit statements in correct notation (lim f(x) = 2 as x → ∞ and lim f(x) = ∞ as x → 1⁺). Words without limit notation earn no point.
      (C) 2 points: 1 point for both average rates of change (1.648 and 0.766, or exact forms); 1 point for concluding concave down because the average rates of change are decreasing over consecutive equal intervals. The conclusion needs that reason.
  - slug: precalc-final-q44
    type: long_answer
    topic_code: "2.5"
    source: "AP Precalculus CED, Topic 2.5"
    points: 6
    stimulus: |
      A cup of tea is left to cool in a room kept at 20°C (hypothetical data). Its temperature T, in degrees Celsius, t minutes after it was poured is recorded below.

      | t (minutes) | 0 | 10 | 20 |
      |---|---|---|---|
      | T(t) (°C) | 90 | 62 | 45.6 |

      The temperature is modelled by T(t) = 20 + a · bᵗ.
    prompt: |
      (Calculator. Free-response question 2: Modeling a Non-Periodic Context.)

      (A) (i) Use the values at t = 0 and t = 10 to find a and b. Give b to four decimal places.
      (ii) Use the model to predict the temperature at t = 20. Does the model overestimate or underestimate the recorded value?

      (B) (i) According to the model, at what time t does the tea reach 30°C? Give your answer to two decimal places.
      (ii) Find the average rate of change of the recorded temperature over [0, 10], with units, and interpret it in context.

      (C) (i) Use limit notation to describe the model's temperature in the long run, and explain what this value means in context.
      (ii) State one assumption about the situation that the model relies on.
    answer: |
      (A)(i) T(0) = 20 + a = 90, so a = 70. T(10) = 20 + 70b¹⁰ = 62 gives b¹⁰ = 0.6, so b = 0.6^(1/10) ≈ 0.9502.
      (ii) T(20) = 20 + 70(0.6)² = 20 + 25.2 = 45.2°C. The record is 45.6°C, so the model underestimates (by 0.4°C).
      (B)(i) 20 + 70(0.6)^(t/10) = 30 gives (0.6)^(t/10) = 1/7, so t = 10 ln(1/7)/ln(0.6) ≈ 38.09 minutes.
      (ii) (62 − 90)/(10 − 0) = −2.8 °C per minute: over the first 10 minutes the tea cooled by 2.8 degrees per minute on average.
      (C)(i) lim (t → ∞) T(t) = 20, because 70bᵗ → 0 for 0 < b < 1. In the long run the tea's temperature approaches the room temperature, 20°C.
      (ii) For example: the room stays at a constant 20°C; or the tea is not reheated, stirred or topped up while it cools.
    explanation: |
      Six points.
      (A)(i) 1 point: a = 70 and b ≈ 0.9502 (accept 0.950).
      (A)(ii) 1 point: 45.2 and 'underestimates'.
      (B)(i) 1 point: t ≈ 38.09 (accept 38.09 or 38.1 with work).
      (B)(ii) 1 point: −2.8 with units °C per minute and an interpretation that mentions the first 10 minutes and average cooling.
      (C)(i) 1 point: the limit statement equal to 20 in correct notation, with the room-temperature interpretation.
      (C)(ii) 1 point: any reasonable assumption tied to the context (constant room temperature, no reheating, etc.).
  - slug: precalc-final-q45
    type: long_answer
    topic_code: "3.7"
    source: "AP Precalculus CED, Topic 3.7"
    points: 6
    stimulus: |
      A Ferris wheel (hypothetical) turns at a constant speed. A rider's seat is at its lowest point, 5 metres above the ground, at time t = 0 minutes. The table gives the seat's height h(t), in metres.

      | t (minutes) | 0 | 2 | 4 | 6 | 8 |
      |---|---|---|---|---|---|
      | h(t) (m) | 5 | 25 | 45 | 25 | 5 |

      The seat's height is modelled by a sinusoidal function h(t) = a cos(bt) + d.
    prompt: |
      (No calculator. Free-response question 3: Modeling a Periodic Context.)

      (A) (i) Find the values of a, b and d. Show the work that leads to each.
      (ii) On which interval between t = 0 and t = 8 is h increasing and its graph concave down? Explain briefly.

      (B) (i) Find the exact height of the seat at t = 1.
      (ii) Find all times t in [0, 8] when the seat is 35 metres above the ground. Give exact values.

      (C) The wheel is sped up so that one full turn takes 6 minutes instead of 8. Which of a, b and d change, and what is the new value of each one that changes? Explain.
    answer: |
      (A)(i) The midline is halfway between the minimum 5 and maximum 45, so d = 25. The amplitude is (45 − 5)/2 = 20; the seat starts at the minimum, so the cosine is reflected: a = −20. The period is 8 minutes, so b = 2π/8 = π/4. Model: h(t) = −20 cos(πt/4) + 25.
      (ii) 2 < t < 4. h increases from the minimum at t = 0 to the maximum at t = 4, and the graph is concave down while it is above the midline, from t = 2 to t = 6; both hold on (2, 4).
      (B)(i) h(1) = −20 cos(π/4) + 25 = 25 − 20(√2/2) = 25 − 10√2 metres.
      (ii) −20 cos(πt/4) + 25 = 35 gives cos(πt/4) = −1/2, so πt/4 = 2π/3 or 4π/3 (for 0 ≤ πt/4 ≤ 2π), giving t = 8/3 and t = 16/3 minutes.
      (C) Only b changes: the period is now 6, so b = 2π/6 = π/3. The highest and lowest points are unchanged, so the amplitude (a = −20, still starting at the bottom) and the midline (d = 25) stay the same.
    explanation: |
      Six points.
      (A)(i) 1 point: a = −20, b = π/4 and d = 25 with supporting work (a = 20 with a different phase earns the point only if the resulting model matches the table).
      (A)(ii) 1 point: the interval (2, 4) with a reason that refers to increasing to the maximum and concave down above the midline.
      (B)(i) 1 point: 25 − 10√2 exactly.
      (B)(ii) 1 point: both times, 8/3 and 16/3.
      (C) 2 points: 1 point for identifying that only b changes, to π/3; 1 point for explaining that the amplitude and midline are unchanged because the wheel's size and height are the same.
  - slug: precalc-final-q46
    type: long_answer
    topic_code: "2.13"
    source: "AP Precalculus CED, Topic 2.13"
    points: 6
    prompt: |
      (No calculator. Free-response question 4: Symbolic Manipulations.)

      (A) (i) Solve log₂ x + log₂(x − 6) = 4 for x. Show that any solution you reject is extraneous.
      (ii) Solve 5 · 3^(2x) = 40 for x. Give an exact answer.

      (B) (i) Rewrite 2cos²θ + sin θ − 1 as an expression in sin θ only.
      (ii) Solve 2cos²θ + sin θ − 1 = 0 for θ in the interval [0, 2π).

      (C) Let k(x) = ln x + ln(x + 3).
      (i) Rewrite k(x) as a single natural logarithm.
      (ii) State the domain of k. Explain why the domain of the single logarithm you wrote in (i), taken on its own, is different.
    answer: |
      (A)(i) log₂(x(x − 6)) = 4, so x² − 6x = 16, x² − 6x − 16 = 0, (x − 8)(x + 2) = 0, x = 8 or x = −2. x = −2 makes log₂ x undefined (and log₂(−8) too), so it is extraneous. Solution: x = 8 (check: log₂ 8 + log₂ 2 = 3 + 1 = 4).
      (ii) 3^(2x) = 8, so 2x = log₃ 8 and x = (log₃ 8)/2 = ln 8/(2 ln 3).
      (B)(i) Using cos²θ = 1 − sin²θ: 2(1 − sin²θ) + sin θ − 1 = −2sin²θ + sin θ + 1.
      (ii) −2sin²θ + sin θ + 1 = 0 ⟺ 2sin²θ − sin θ − 1 = 0 ⟺ (2 sin θ + 1)(sin θ − 1) = 0. sin θ = 1 gives θ = π/2; sin θ = −1/2 gives θ = 7π/6 and 11π/6.
      (C)(i) k(x) = ln(x(x + 3)) = ln(x² + 3x).
      (ii) k needs x > 0 and x + 3 > 0, so its domain is x > 0. ln(x² + 3x) on its own only needs x² + 3x > 0, which also holds for x < −3 (both factors negative). The rewritten form is equivalent to k only on x > 0.
    explanation: |
      Six points, one per part.
      (A)(i) x = 8 with x = −2 rejected for a stated reason.
      (A)(ii) x = (log₃ 8)/2 or ln 8/(2 ln 3), or an equivalent exact form.
      (B)(i) −2sin²θ + sin θ + 1, using the Pythagorean identity.
      (B)(ii) all three solutions π/2, 7π/6, 11π/6 and no others.
      (C)(i) ln(x² + 3x) or ln(x(x + 3)).
      (C)(ii) domain x > 0 and an explanation mentioning that x² + 3x > 0 also allows x < −3.
