week: 34
description: |
  A full practice final: 70 questions · about 3 hours 15 minutes · all four units. Questions 1–46 are a
  mock AP Precalculus exam in the May 2027 format, on Units 1–3 only: Section I Part A, 29 multiple choice
  without a calculator (about 65 minutes); Part B, 13 multiple choice with a graphing calculator (about 40
  minutes); then Section II, four free-response questions (about 70 minutes): function concepts and a
  non-periodic model with a calculator, a periodic model and symbolic manipulations without one. Questions
  47–70 (about 40 minutes) cover Unit 4, which the AP exam does not test, and add select-all, true/false,
  fill-in-the-blank, numeric and short-answer practice across the year, including a shared-context set on
  a moving particle. Multiple choice, select-all, true/false
  and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
  answers (3 points each) and the four free-response questions (6 points each) are graded by your teacher
  against the scoring notes. Keep the calculator in radian mode.
questions:
  # ---- Section I, Part A: no calculator (q01-q29). Units 1-3; q01-q03 share a table.
  - slug: precalc-final-q01
    type: multiple_choice
    topic_code: "1.2"
    source: "AP Precalculus CED, Topic 1.2"
    points: 1
    stimulus: |
      The table gives selected values of an increasing function f.

      | x | 0 | 2 | 4 | 6 | 8 |
      |---|---|---|---|---|---|
      | f(x) | 1 | 7 | 11 | 13 | 14 |
    prompt: |
      What is the average rate of change of f over the interval [2, 6]?
    options:
      - "6"
      - "2/3"
      - "3"
      - "3/2"
    option_explanations:
      - |
        6 is the change in f, f(6) − f(2), not divided by the change in x, which is 4.
      - |
        This is the change in x over the change in f, (6 − 2)/(13 − 7): the ratio is upside down.
      - |
        This divides the change in f by 2, the number of table steps, instead of by the change in x, 6 − 2 = 4.
      - |
        Correct. (f(6) − f(2))/(6 − 2) = (13 − 7)/4 = 6/4 = 3/2.
    answer: 3
  - slug: precalc-final-q02
    type: multiple_choice
    topic_code: "1.1"
    source: "AP Precalculus CED, Topic 1.1"
    points: 1
    stimulus: |
      The table gives selected values of an increasing function f.

      | x | 0 | 2 | 4 | 6 | 8 |
      |---|---|---|---|---|---|
      | f(x) | 1 | 7 | 11 | 13 | 14 |
    prompt: |
      Which statement about f on the interval [0, 8] is best supported by the table?
    options:
      - "f is increasing and its graph is concave up."
      - "f is increasing and its graph is concave down."
      - "f is decreasing and its graph is concave down."
      - "The rate of change of f is increasing on [0, 8]."
    option_explanations:
      - |
        Concave up would need the average rates of change to increase; here they fall from 3 to 1/2.
      - |
        Correct. The values rise, so f is increasing, and the average rates of change over consecutive equal intervals, 3, 2, 1, 1/2, are decreasing, which is the signature of concave down.
      - |
        Every output is larger than the one before it, so f is increasing, not decreasing.
      - |
        The average rates of change over [0, 2], [2, 4], [4, 6], [6, 8] are 3, 2, 1, 1/2, so the rate of change is decreasing.
    answer: 1
  - slug: precalc-final-q03
    type: multiple_choice
    topic_code: "1.2"
    source: "AP Precalculus CED, Topic 1.2"
    points: 1
    stimulus: |
      The table gives selected values of an increasing function f.

      | x | 0 | 2 | 4 | 6 | 8 |
      |---|---|---|---|---|---|
      | f(x) | 1 | 7 | 11 | 13 | 14 |
    prompt: |
      Using the average rates of change over [2, 4] and [4, 6], which is the best estimate of the rate of change of f at x = 4?
    options:
      - "1.5"
      - "11"
      - "2.75"
      - "0.5"
    option_explanations:
      - |
        Correct. The average rates of change are (11 − 7)/2 = 2 and (13 − 11)/2 = 1; the rate at x = 4 lies between them, and their mean, 1.5, is the best estimate.
      - |
        11 is the value f(4), an output, not a rate of change.
      - |
        This is f(4)/4 = 11/4, the average rate of change over [0, 4] measured from the origin rather than from f(0) = 1.
      - |
        0.5 is the difference between the two neighbouring rates (2 − 1), not an estimate of the rate itself.
    answer: 0
  - slug: precalc-final-q04
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Precalculus CED, Topic 1.3"
    points: 1
    prompt: |
      For a quadratic function g, the average rates of change over the consecutive intervals [0, 1], [1, 2] and [2, 3] are 7, 3 and −1. What is the average rate of change of g over [3, 4]?
    options:
      - "−5"
      - "−1"
      - "−4"
      - "−9"
    option_explanations:
      - |
        Correct. For a quadratic, average rates of change over consecutive equal intervals change by a constant amount, here −4 each time: 7, 3, −1, −5.
      - |
        This assumes the rate stays the same, which would make g linear; for a quadratic the rates change at a constant rate.
      - |
        −4 is the constant change between successive rates, not the next rate itself.
      - |
        This subtracts 8 instead of 4: the rates fall by 4 per interval, so the next one is −1 − 4 = −5.
    answer: 0
  - slug: precalc-final-q05
    type: multiple_choice
    topic_code: "1.4"
    source: "AP Precalculus CED, Topic 1.4"
    points: 1
    prompt: |
      A polynomial function p is defined for all real x. The rate of change of p is increasing for x < 2 and decreasing for x > 2. Which statement must be true?
    options:
      - "p has a local maximum at x = 2."
      - "The graph of p has a point of inflection at x = 2, where it changes from concave down to concave up."
      - "The graph of p has a point of inflection at x = 2, where it changes from concave up to concave down."
      - "p(2) = 0."
    option_explanations:
      - |
        A local maximum is where p itself switches from increasing to decreasing; this statement is about the rate of change of p, which tells us about concavity.
      - |
        Increasing rate of change means concave up, so to the left of 2 the graph is concave up, not concave down.
      - |
        Correct. A point of inflection is where the rate of change switches between increasing and decreasing; increasing rate means concave up, so the graph goes from concave up to concave down.
      - |
        Nothing about the rate of change tells us the value of p at 2; the graph may not touch the x-axis there.
    answer: 2
  - slug: precalc-final-q06
    type: multiple_choice
    topic_code: "1.5"
    source: "AP Precalculus CED, Topic 1.5"
    points: 1
    prompt: |
      A polynomial function with real coefficients has degree 4. Two of its zeros are 3 and 2 − i. Which of the following must also be a zero?
    options:
      - "−2 + i"
      - "−3"
      - "−2 − i"
      - "2 + i"
    option_explanations:
      - |
        The conjugate keeps the real part and changes the sign of the imaginary part; −2 + i changes the real part instead.
      - |
        Real zeros do not come in ± pairs; nothing forces −3 to be a zero.
      - |
        This negates the whole number; the conjugate of 2 − i is 2 + i.
      - |
        Correct. Non-real zeros of a polynomial with real coefficients come in conjugate pairs, so 2 − i forces 2 + i.
    answer: 3
  - slug: precalc-final-q07
    type: multiple_choice
    topic_code: "1.5"
    source: "AP Precalculus CED, Topic 1.5"
    points: 1
    prompt: |
      At which of its zeros does the graph of p(x) = (x − 1)²(x + 3)³(x − 4) touch the x-axis without crossing it?
    options:
      - "x = −3"
      - "x = 4"
      - "x = 1"
      - "x = −1"
    option_explanations:
      - |
        (x + 3) has odd multiplicity 3, so the graph crosses at x = −3 (flattening as it does).
      - |
        (x − 4) has multiplicity 1, so the graph crosses the axis there.
      - |
        Correct. The factor (x − 1) has even multiplicity 2, so p does not change sign at x = 1 and the graph bounces off the axis.
      - |
        −1 is not a zero: the factor (x − 1) gives the zero x = 1.
    answer: 2
  - slug: precalc-final-q08
    type: multiple_choice
    topic_code: "1.7"
    source: "AP Precalculus CED, Topic 1.7"
    points: 1
    prompt: |
      What is lim (x → ∞) of (3x² − 5)/(6x² + x)?
    options:
      - "0"
      - "∞"
      - "3"
      - "1/2"
    option_explanations:
      - |
        The limit is 0 only when the denominator has the higher degree; here the degrees are equal.
      - |
        The outputs grow without bound only when the numerator has the higher degree.
      - |
        3 is the leading coefficient of the numerator alone; with equal degrees the limit is that coefficient divided by the denominator's leading coefficient, 6.
      - |
        Correct. Numerator and denominator have the same degree, so the limit is the ratio of leading coefficients, 3/6 = 1/2.
    answer: 3
  - slug: precalc-final-q09
    type: multiple_choice
    topic_code: "1.10"
    source: "AP Precalculus CED, Topic 1.10"
    points: 1
    prompt: |
      Let r(x) = (x² − 4)/(x² − x − 2). Which statement is true?
    options:
      - "The graph of r has vertical asymptotes at x = 2 and x = −1."
      - "The graph of r has a hole at (2, 4/3) and a vertical asymptote at x = −1."
      - "r has a zero at x = 2 and a vertical asymptote at x = −1."
      - "The graph of r has a hole at (2, 0) and a vertical asymptote at x = −1."
    option_explanations:
      - |
        x − 2 cancels with a numerator factor, so x = 2 is a hole, not an asymptote.
      - |
        Correct. r(x) = (x − 2)(x + 2)/((x − 2)(x + 1)); the common factor gives a hole at x = 2 with y = (2 + 2)/(2 + 1) = 4/3, and x + 1 = 0 gives the asymptote.
      - |
        r is undefined at x = 2, so it cannot be a zero there; its only zero is x = −2.
      - |
        The hole's y-coordinate comes from the simplified function (x + 2)/(x + 1) at x = 2, which is 4/3, not 0.
    answer: 1
  - slug: precalc-final-q10
    type: multiple_choice
    topic_code: "1.11"
    source: "AP Precalculus CED, Topic 1.11"
    points: 1
    prompt: |
      What are the quotient and remainder when x³ − 2x² + 5 is divided by x + 2?
    options:
      - "Quotient x², remainder 5"
      - "Quotient x² − 4x + 8, remainder −11"
      - "Quotient x − 4, remainder 13"
      - "Quotient x² − 4x + 8, remainder 21"
    option_explanations:
      - |
        This divides by x − 2 (using 2 instead of −2 in synthetic division).
      - |
        Correct. Synthetic division with −2 on coefficients 1, −2, 0, 5 gives 1, −4, 8 and remainder −11; check: p(−2) = −8 − 8 + 5 = −11.
      - |
        This leaves out the placeholder 0 for the missing x term, so only three coefficients were divided.
      - |
        The last step is 5 + (−2)(8) = 5 − 16 = −11, not 5 + 16.
    answer: 1
  - slug: precalc-final-q11
    type: multiple_choice
    topic_code: "1.12"
    source: "AP Precalculus CED, Topic 1.12"
    points: 1
    prompt: |
      The point (1, 4) is on the graph of y = f(x). Which point must be on the graph of g(x) = −2f(x − 3) + 1?
    options:
      - "(−2, −7)"
      - "(4, −10)"
      - "(4, −9)"
      - "(4, −7)"
    option_explanations:
      - |
        f(x − 3) shifts the graph right 3, not left: x − 3 = 1 gives x = 4.
      - |
        This adds 1 before multiplying by −2; the order is multiply f's output by −2, then add 1.
      - |
        The vertical shift is +1, giving −8 + 1 = −7, not −8 − 1.
      - |
        Correct. The input shifts right 3, so x = 1 + 3 = 4; the output is −2 · 4 + 1 = −7.
    answer: 3
  - slug: precalc-final-q12
    type: multiple_choice
    topic_code: "2.1"
    source: "AP Precalculus CED, Topic 2.1"
    points: 1
    prompt: |
      A geometric sequence has g₂ = 12 and g₅ = 96. Which expression gives gₙ for n ≥ 0?
    options:
      - "3 · 8ⁿ"
      - "28n − 44"
      - "12 · 2ⁿ"
      - "3 · 2ⁿ"
    option_explanations:
      - |
        8 is the ratio over three steps, r³; the common ratio is its cube root, 2.
      - |
        This treats the sequence as arithmetic (common difference 84/3 = 28); a geometric sequence changes by a constant ratio.
      - |
        This uses g₂ as the starting value g₀; it gives g₂ = 48, not 12.
      - |
        Correct. Three steps multiply by r³ = 96/12 = 8, so r = 2, and g₀ = g₂/r² = 12/4 = 3.
    answer: 3
  - slug: precalc-final-q13
    type: multiple_choice
    topic_code: "2.3"
    source: "AP Precalculus CED, Topic 2.3"
    points: 1
    prompt: |
      Which statement describes f(x) = 5(0.8)ˣ?
    options:
      - "f is decreasing, its graph is concave up, and lim (x → ∞) f(x) = 0."
      - "f is decreasing, its graph is concave down, and lim (x → ∞) f(x) = 0."
      - "f is increasing, its graph is concave up, and lim (x → ∞) f(x) = ∞."
      - "f is decreasing, its graph is concave up, and lim (x → ∞) f(x) = 5."
    option_explanations:
      - |
        Correct. A base between 0 and 1 with a positive coefficient gives decay; exponential graphs with a > 0 are always concave up, and the outputs approach the asymptote y = 0.
      - |
        With a = 5 > 0 the graph of abˣ is concave up for any base b; the decreases get smaller, not larger.
      - |
        The base 0.8 is less than 1, so f decreases.
      - |
        5 is the initial value f(0); the horizontal asymptote of 5(0.8)ˣ is y = 0.
    answer: 0
  - slug: precalc-final-q14
    type: multiple_choice
    topic_code: "2.4"
    source: "AP Precalculus CED, Topic 2.4"
    points: 1
    prompt: |
      Which expression is equivalent to 2^(x + 3)?
    options:
      - "2ˣ + 8"
      - "8 · 2ˣ"
      - "6 · 2ˣ"
      - "(1/8) · 2ˣ"
    option_explanations:
      - |
        Exponents that add correspond to factors that multiply, not to terms that add.
      - |
        Correct. By the product rule for exponents, 2^(x + 3) = 2ˣ · 2³ = 8 · 2ˣ: a horizontal shift of an exponential is a vertical dilation.
      - |
        2³ means 2 · 2 · 2 = 8, not 2 · 3 = 6; the factor is 8.
      - |
        That is 2^(x − 3); adding 3 in the exponent multiplies by 2³.
    answer: 1
  - slug: precalc-final-q15
    type: multiple_choice
    topic_code: "2.7"
    source: "AP Precalculus CED, Topic 2.7"
    points: 1
    prompt: |
      Let f(x) = x² + 1 and g(x) = √(x − 3). What is the domain of f(g(x))?
    options:
      - "All real numbers"
      - "x ≥ 2"
      - "x ≥ 3"
      - "x ≥ −1"
    option_explanations:
      - |
        The simplified form x − 2 hides the restriction: g(x) must exist before f can be applied.
      - |
        This sets the simplified expression x − 2 ≥ 0, but nothing requires f(g(x)) to be nonnegative; the restriction comes from g's square root.
      - |
        Correct. g is applied first and needs x − 3 ≥ 0. Although f(g(x)) simplifies to x − 2, the composition is still undefined where g is undefined.
      - |
        This is not tied to any part of either function; the inside function g needs x ≥ 3.
    answer: 2
  - slug: precalc-final-q16
    type: multiple_choice
    topic_code: "2.8"
    source: "AP Precalculus CED, Topic 2.8"
    points: 1
    prompt: |
      What is the inverse of f(x) = (2x − 1)/3?
    options:
      - "f⁻¹(x) = 3/(2x − 1)"
      - "f⁻¹(x) = (3x − 1)/2"
      - "f⁻¹(x) = (2x + 1)/3"
      - "f⁻¹(x) = (3x + 1)/2"
    option_explanations:
      - |
        This is the reciprocal 1/f(x), not the inverse function.
      - |
        Undoing 'subtract 1' means adding 1: 3x = 2y − 1 gives 2y = 3x + 1.
      - |
        This changes only the sign; the inverse must undo the multiplication by 2 and the division by 3 as well.
      - |
        Correct. Swap and solve: x = (2y − 1)/3 gives 3x = 2y − 1, so y = (3x + 1)/2.
    answer: 3
  - slug: precalc-final-q17
    type: multiple_choice
    topic_code: "2.9"
    source: "AP Precalculus CED, Topic 2.9"
    points: 1
    prompt: |
      What is the value of log₂(1/8)?
    options:
      - "3"
      - "1/3"
      - "−1/3"
      - "−3"
    option_explanations:
      - |
        2³ = 8, not 1/8; the reciprocal needs a negative exponent.
      - |
        A logarithm is an exponent on the base 2; 2^(1/3) is the cube root of 2, not 1/8.
      - |
        2^(−1/3) = 1/∛2, not 1/8; the exponent is −3.
      - |
        Correct. 2⁻³ = 1/8, so the exponent that turns 2 into 1/8 is −3.
    answer: 3
  - slug: precalc-final-q18
    type: multiple_choice
    topic_code: "2.12"
    source: "AP Precalculus CED, Topic 2.12"
    points: 1
    prompt: |
      For x > 0 and y > 0, which expression is equivalent to ln(x³/y)?
    options:
      - "3 ln x / ln y"
      - "(ln x)³ − ln y"
      - "3 ln x − ln y"
      - "3(ln x − ln y)"
    option_explanations:
      - |
        The log of a quotient is a difference of logs, not a quotient of logs.
      - |
        The power property moves the exponent in front as a factor: ln(x³) = 3 ln x, not (ln x)³.
      - |
        Correct. The quotient property gives ln(x³) − ln y, and the power property gives 3 ln x.
      - |
        The exponent 3 applies only to x, so only ln x is multiplied by 3.
    answer: 2
  - slug: precalc-final-q19
    type: multiple_choice
    topic_code: "2.13"
    source: "AP Precalculus CED, Topic 2.13"
    points: 1
    prompt: |
      What are all solutions of log₃(x + 1) + log₃(x − 1) = 1?
    options:
      - "x = 2 only"
      - "x = 2 and x = −2"
      - "x = 3/2"
      - "x = √2"
    option_explanations:
      - |
        Correct. log₃((x + 1)(x − 1)) = 1 gives x² − 1 = 3, so x = ±2; x = −2 makes both arguments negative, so it is extraneous.
      - |
        x = −2 gives log₃(−1), which is undefined; it must be rejected.
      - |
        This adds the arguments, (x + 1) + (x − 1) = 3; the sum of two logs is the log of the product.
      - |
        This sets x² − 1 = 1 instead of 3¹ = 3; the equation log₃(A) = 1 means A = 3.
    answer: 0
  - slug: precalc-final-q20
    type: multiple_choice
    topic_code: "2.15"
    source: "AP Precalculus CED, Topic 2.15"
    points: 1
    prompt: |
      Data plotted with log₁₀ y on the vertical axis against x fall on the line log₁₀ y = 0.3x + 2. Which model fits the data?
    options:
      - "y = 0.3x + 2"
      - "y = 2 · (0.3)ˣ"
      - "y = 2 · 10^(0.3x)"
      - "y = 100 · (10^0.3)ˣ"
    option_explanations:
      - |
        This is the equation of the line for log₁₀ y, not for y; the semi-log line must be undone by exponentiating.
      - |
        The slope and intercept are exponents of 10 here, not the base and initial value directly.
      - |
        The intercept 2 is log₁₀ of the initial value, so the initial value is 10² = 100, not 2.
      - |
        Correct. Exponentiating both sides gives y = 10^(0.3x + 2) = 10² · (10^0.3)ˣ: a line on a semi-log plot means an exponential model.
    answer: 3
  - slug: precalc-final-q21
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Precalculus CED, Topic 3.3"
    points: 1
    prompt: |
      What is the exact value of cos(4π/3)?
    options:
      - "1/2"
      - "−1/2"
      - "−√3/2"
      - "√3/2"
    option_explanations:
      - |
        This has the right size but the wrong sign: the terminal ray of 4π/3 points into Quadrant III, where x-coordinates are negative.
      - |
        Correct. 4π/3 is in Quadrant III with reference angle π/3; cos(π/3) = 1/2 and cosine is negative in Quadrant III.
      - |
        √3/2 is the sine of π/3 (or the cosine of π/6); the reference angle here is π/3, whose cosine is 1/2.
      - |
        This uses the wrong reference value and the wrong sign; cos(4π/3) = −cos(π/3) = −1/2.
    answer: 1
  - slug: precalc-final-q22
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Precalculus CED, Topic 3.2"
    points: 1
    prompt: |
      An arc on a circle of radius 6 cm subtends a central angle of 2π/3 radians. What is the length of the arc?
    options:
      - "π/9 cm"
      - "720 cm"
      - "4π cm"
      - "12π cm"
    option_explanations:
      - |
        This divides the angle by the radius; arc length is the radius times the angle.
      - |
        This multiplies the radius by the angle in degrees (120°); s = rθ needs radians.
      - |
        Correct. s = rθ = 6 · 2π/3 = 4π cm, with θ in radians.
      - |
        12π is the whole circumference, 2π · 6; the arc is only a third of it.
    answer: 2
  - slug: precalc-final-q23
    type: multiple_choice
    topic_code: "3.6"
    source: "AP Precalculus CED, Topic 3.6"
    points: 1
    prompt: |
      What are the period and range of f(θ) = 3 sin(2(θ − π/4)) − 1?
    options:
      - "Period π, range [−4, 2]"
      - "Period 4π, range [−4, 2]"
      - "Period π, range [−3, 3]"
      - "Period π/4, range [−4, 2]"
    option_explanations:
      - |
        Correct. The period is 2π/2 = π; the midline is y = −1 and the amplitude 3, so the outputs run from −4 to 2.
      - |
        A factor of 2 on the input compresses the graph: the period is 2π/2, not 2π · 2.
      - |
        This ignores the vertical shift of −1, which moves the midline to y = −1.
      - |
        π/4 is the horizontal (phase) shift of the graph, not its period, which is 2π/2 = π.
    answer: 0
  - slug: precalc-final-q24
    type: multiple_choice
    topic_code: "3.8"
    source: "AP Precalculus CED, Topic 3.8"
    points: 1
    prompt: |
      Which of the following is a vertical asymptote of the graph of y = tan(x/2)?
    options:
      - "x = π/4"
      - "x = π/2"
      - "x = 0"
      - "x = π"
    option_explanations:
      - |
        This multiplies π/2 by 1/2; solving x/2 = π/2 gives x = π.
      - |
        π/2 is an asymptote of tan x, but the input here is x/2, which stretches the graph horizontally by 2.
      - |
        tan(0/2) = 0, so x = 0 is a zero of the function, not an asymptote.
      - |
        Correct. tan u has asymptotes where u = π/2 + kπ; u = x/2 = π/2 gives x = π.
    answer: 3
  - slug: precalc-final-q25
    type: multiple_choice
    topic_code: "3.9"
    source: "AP Precalculus CED, Topic 3.9"
    points: 1
    prompt: |
      What is the value of sin⁻¹(sin(5π/6))?
    options:
      - "π/6"
      - "5π/6"
      - "−π/6"
      - "7π/6"
    option_explanations:
      - |
        Correct. sin(5π/6) = 1/2, and sin⁻¹ returns the angle in [−π/2, π/2] with that sine, which is π/6.
      - |
        5π/6 is outside the range [−π/2, π/2] of sin⁻¹, so sin⁻¹ cannot return it.
      - |
        sin(−π/6) = −1/2, but sin(5π/6) is positive.
      - |
