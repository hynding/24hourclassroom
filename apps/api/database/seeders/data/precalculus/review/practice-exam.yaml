        Correct. Completing the square gives 9(x − 2)² + 4(y + 1)² = 36, so (x − 2)²/4 + (y + 1)²/9 = 1: semi-axes 2 (horizontal) and 3 (vertical).
      - |
        (x − 2)² and (y + 1)² put the centre at (2, −1); the signs inside the squares are opposite to the coordinates.
      - |
        Both squared terms have positive coefficients after completing the square, which gives an ellipse; a hyperbola needs opposite signs.
      - |
