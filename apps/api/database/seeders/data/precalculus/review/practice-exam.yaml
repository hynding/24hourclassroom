  - slug: precalc-final-q59
    type: multi_select
    topic_code: "4.14"
    source: "AP Precalculus CED, Topic 4.14"
    points: 2
    partial_credit: true
    stimulus: |
      A school library tracks where students study each week (hypothetical). Of the students in the library one week, 80% are in the library the next week and 20% move to the study hall. Of the students in the study hall, 30% move to the library the next week and 70% stay. No students join or leave the two groups.
    prompt: |
      Which statements are true? Select all that apply.
    options:
      - "In the long run, 60% of these students study in the library each week."
      - "If every student is in the library this week, 80% are there next week."
      - "If every student is in the library this week, 70% are there in two weeks."
      - "If every student is in the library this week, 64% are there in two weeks."
      - "The long-run share depends on where the students start."
    option_explanations:
      - |
        Correct. At the steady state the flows balance: 0.2p = 0.3(1 − p), so p = 0.6.
      - |
        Correct. 80% of the library group stays, and the study hall is empty, so nobody moves in.
      - |
        Correct. After one week 0.8 in library, 0.2 in hall; after two, 0.8·0.8 + 0.2·0.3 = 0.70.
      - |
        0.64 counts only students who stayed both weeks; it misses the 6% who moved back from the study hall.
      - |
        For this transition matrix every starting distribution approaches the same steady state, 60% library and 40% study hall.
    answer: [0, 1, 2]
  - slug: precalc-final-q60
    type: short_answer
    topic_code: "4.4"
    source: "AP Precalculus CED, Topic 4.4"
    points: 3
    prompt: |
      (a) Write parametric equations for the circle with centre (2, −1) and radius 3, traced once counterclockwise starting at (5, −1). State the interval for t.
      (b) Write parametric equations for the line segment from (−1, 4) to (3, 2), with 0 ≤ t ≤ 1.
      (c) The relation x² + xy + y² = 7 is defined implicitly. Find every point on its graph with x = 1, and explain what this shows about whether y is a function of x.
    answer: |
      (a) x(t) = 2 + 3 cos t, y(t) = −1 + 3 sin t, 0 ≤ t ≤ 2π. At t = 0 this gives (5, −1), and increasing t moves counterclockwise.
      (b) x(t) = −1 + 4t, y(t) = 4 − 2t, 0 ≤ t ≤ 1.
      (c) 1 + y + y² = 7 gives y² + y − 6 = 0, (y + 3)(y − 2) = 0, so the points are (1, 2) and (1, −3). One input gives two outputs, so y is not a function of x on the whole graph.
    explanation: |
      Three points, one per part. (a) centre, radius, counterclockwise from (5, −1) and the interval. (b) correct start and end points at t = 0 and t = 1. (c) both points and the not-a-function conclusion with its reason.
