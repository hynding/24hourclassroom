  - slug: precalc-final-q53
    type: multiple_choice
    topic_code: "4.11"
    source: "AP Precalculus CED, Topic 4.11"
    points: 1
    prompt: |
      What is the inverse of the matrix [[4, 3], [2, 2]]?
    options:
      - "[[2, −3], [−2, 4]]"
      - "[[1, −3/2], [−1, 2]]"
      - "[[1/4, 1/3], [1/2, 1/2]]"
      - "[[1, 3/2], [1, 2]]"
    option_explanations:
      - |
        This is the right adjusted matrix but it was not divided by the determinant, 2.
      - |
        Correct. The determinant is 4·2 − 3·2 = 2; swap the diagonal, negate the off-diagonal entries and divide by 2: (1/2)[[2, −3], [−2, 4]].
      - |
        The inverse of a matrix is not found by taking reciprocals of its entries.
      - |
        The off-diagonal entries must change sign as well as the diagonal entries swapping.
