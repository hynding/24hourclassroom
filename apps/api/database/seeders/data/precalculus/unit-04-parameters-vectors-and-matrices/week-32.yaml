    - slug: precalc-u04-w32-q21
      type: short_answer
      topic_code: "4.12"
      source: "AP Precalculus CED, Topic 4.12"
      points: 3
      prompt: |
        Let M = [[1, 3], [0, 1]], and let the triangle T have vertices (0, 0), (2, 0) and (0, 1).

        (a) Find the vertices of the image of T under M.
        (b) Find the areas of T and of its image, and explain how det M predicts the result.
        (c) Describe the transformation in words, and write the matrix of the transformation that undoes it.
      answer: |
        (a) M sends (0, 0) to (0, 0), (2, 0) to (2, 0) and (0, 1) to (0 + 3, 1) = (3, 1).
        (b) T has base 2 and height 1, so area 1. The image has the same base 2 on the x-axis and height 1, so area 1. det M = 1 − 0 = 1, so areas are multiplied by 1: unchanged.
        (c) A horizontal shear by 3: (x, y) → (x + 3y, y); points on the x-axis stay fixed and each point slides right by three times its height. The inverse is [[1, −3], [0, 1]].
      explanation: |
        Three points, one per part. (a) all three image vertices. (b) both areas equal to 1 with the determinant explanation. (c) the description as a horizontal shear and the inverse matrix.
    - slug: precalc-u04-w32-q22
      type: short_answer
      topic_code: "4.13"
      source: "AP Precalculus CED, Topic 4.13"
      points: 3
      prompt: |
        Let R = [[0, −1], [1, 0]] (rotation by π/2) and D = [[2, 0], [0, 2]] (dilation by 2).

        (a) Find the matrix of the transformation "rotate by π/2, then dilate by 2".
        (b) Find the image of ⟨1, 3⟩ under this transformation.
        (c) By what factor does it scale areas? Find the matrix of the inverse transformation and describe it in words.
      answer: |
        (a) "R, then D" is DR = [[2, 0], [0, 2]] · [[0, −1], [1, 0]] = [[0, −2], [2, 0]].
        (b) [[0, −2], [2, 0]] · ⟨1, 3⟩ = ⟨−6, 2⟩.
        (c) det = 0 − (−4) = 4, so areas are multiplied by 4. Inverse: (1/4)[[0, 2], [−2, 0]] = [[0, 1/2], [−1/2, 0]], which shrinks by a factor of 1/2 and rotates by −π/2 (clockwise a quarter turn).
      explanation: |
        Three points, one per part. (a) the product in the correct order (here RD happens to give the same matrix, but the order must be justified). (b) ⟨−6, 2⟩. (c) the factor 4 and the inverse matrix with a correct description.
    - slug: precalc-u04-w32-q23
      type: long_answer
      topic_code: "4.14"
      source: "AP Precalculus CED, Topics 4.13 and 4.14"
      points: 6
      prompt: |
        In a hypothetical model, a town of 10,000 households chooses between two internet providers, Northline and Swiftnet. Each year 85% of Northline households stay with Northline and 15% switch to Swiftnet; 90% of Swiftnet households stay and 10% switch to Northline. Let xₙ = [[Nₙ], [Sₙ]] be the numbers of households after n years, with xₙ₊₁ = Txₙ. In year 0, x₀ = [[6000], [4000]].

        (A) (i) Write the transition matrix T and explain what its first column represents.
            (ii) Find x₁ and x₂.
        (B) (i) Find the steady-state vector for 10,000 households.
            (ii) Verify that it is unchanged by T, and describe what happens to Northline's share in the long run.
        (C) (i) Find T⁻¹ and use it to estimate how many households used each provider one year before year 0.
            (ii) State one assumption of this model and explain how it could make long-range predictions unreliable.
      answer: |
        (A)(i) T = [[0.85, 0.10], [0.15, 0.90]]. The first column describes this year's Northline households: 0.85 of them are with Northline next year and 0.15 are with Swiftnet.
        (ii) x₁ = [[0.85 · 6000 + 0.10 · 4000], [0.15 · 6000 + 0.90 · 4000]] = [[5100 + 400], [900 + 3600]] = [[5500], [4500]]. x₂ = [[4675 + 450], [825 + 4050]] = [[5125], [4875]].
        (B)(i) Tx = x gives 0.85N + 0.10S = N, so 0.10S = 0.15N and N : S = 2 : 3. With 10,000 households, x = [[4000], [6000]].
        (ii) T · [[4000], [6000]] = [[3400 + 600], [600 + 5400]] = [[4000], [6000]]. Northline's count falls from 6,000 toward 4,000 (a 40% share) in the long run, approaching but not reaching it in any finite number of years.
        (C)(i) det T = 0.765 − 0.015 = 0.75. T⁻¹ = (1/0.75)[[0.90, −0.10], [−0.15, 0.85]] = [[1.2, −2/15], [−0.2, 17/15]] ≈ [[1.2, −0.133], [−0.2, 1.133]]. T⁻¹x₀ = [[7200 − 533.3], [−1200 + 4533.3]] ≈ [[6667], [3333]]: about 6,667 Northline and 3,333 Swiftnet households a year earlier.
        (ii) For example: the model assumes the switching rates stay at 15% and 10% every year. A price change or a new competitor would change those rates, so predictions many years ahead (or behind) could be far off. (Also acceptable: the number of households is fixed; households behave independently of their history.)
      explanation: |
        Six points. (A) 1 point for T with a correct interpretation of column 1; 1 point for x₁ = [[5500], [4500]] and x₂ = [[5125], [4875]]. (B) 1 point for the steady state [[4000], [6000]]; 1 point for the verification and the long-run description. (C) 1 point for T⁻¹ and about 6,667 and 3,333; 1 point for a relevant assumption with an explanation of its effect.
