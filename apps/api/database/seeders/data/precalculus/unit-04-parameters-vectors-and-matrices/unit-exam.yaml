  # ---- Short answer
  - slug: precalc-u04-exam-q42
    type: short_answer
    topic_code: "4.4"
    source: "AP Precalculus CED, Topics 4.4 and 4.5"
    points: 3
    prompt: |
      Consider the circle (x + 1)² + (y − 2)² = 16.

      (a) Write a parametrization, with t in seconds, that traces the circle counterclockwise once every 8 seconds, starting at its rightmost point.
      (b) Where is the point at t = 2?
      (c) Find both points of the circle with x = 1, and the first time after t = 0 that your moving point reaches one of them.
    answer: |
      (a) Centre (−1, 2), radius 4, b = 2π/8 = π/4: x(t) = −1 + 4 cos(πt/4), y(t) = 2 + 4 sin(πt/4), starting at (3, 2).
      (b) t = 2: x = −1 + 4 cos(π/2) = −1, y = 2 + 4 sin(π/2) = 6, so (−1, 6), the top of the circle.
      (c) (1 + 1)² + (y − 2)² = 16 gives (y − 2)² = 12, y = 2 ± 2√3: the points (1, 2 + 2√3) and (1, 2 − 2√3). The moving point reaches x = 1 when cos(πt/4) = 1/2, first at πt/4 = π/3, so t = 4/3 s, at (1, 2 + 2√3) (moving counterclockwise from (3, 2), it goes up first).
    explanation: |
      Three points, one per part. (a) a correct parametrization with the right centre, radius, start, direction and period. (b) (−1, 6). (c) both points with x = 1 and the time 4/3 s at (1, 2 + 2√3).
  - slug: precalc-u04-exam-q43
    type: short_answer
    topic_code: "4.12"
    source: "AP Precalculus CED, Topics 4.12 and 4.13"
    points: 3
    prompt: |
      A transformation first reflects the plane in the x-axis and then stretches it horizontally by a factor of 3.

      (a) Write the matrix of each step and the matrix of the combined transformation.
      (b) Find the image of the triangle with vertices (0, 0), (1, 0) and (1, 2).
      (c) Compare the areas of the triangle and its image, and explain the result using the determinant, including what its sign tells you.
    answer: |
      (a) Reflection F = [[1, 0], [0, −1]]; stretch S = [[3, 0], [0, 1]]. "F, then S" is SF = [[3, 0], [0, −1]].
      (b) (0, 0) → (0, 0); (1, 0) → (3, 0); (1, 2) → (3, −2).
      (c) The triangle has area (1/2)(1)(2) = 1; the image has area (1/2)(3)(2) = 3. det(SF) = −3: |det| = 3 is the area scale factor, and the negative sign shows the orientation is reversed by the reflection.
    explanation: |
      Three points, one per part. (a) both step matrices and SF in the correct order (here FS gives the same matrix, but the order must be stated correctly). (b) all three image vertices. (c) areas 1 and 3 with the determinant −3 explained as scale factor 3 plus reversed orientation.
  # ---- Extended response
  - slug: precalc-u04-exam-q44
    type: long_answer
    topic_code: "4.9"
    source: "AP Precalculus CED, Topics 4.6, 4.7 and 4.9"
    points: 6
    prompt: |
      In a hypothetical model, a robot patrols an elliptical track. Its position in metres t seconds after it starts is

      p(t) = ⟨6 cos(πt/6), 4 sin(πt/6)⟩.

      (A) (i) Show that the robot's path is the ellipse x²/36 + y²/16 = 1.
          (ii) How long does one lap take, and in which direction (clockwise or counterclockwise) does the robot travel? Justify.
      (B) (i) Find the robot's exact position at t = 2 and at t = 3.
          (ii) Find the displacement and the average velocity of the robot on [0, 3].
      (C) (i) Find the slope of the segment of the path from t = 2 to t = 3, exactly and to the nearest hundredth.
          (ii) Find the foci of the track.
    answer: |
      (A)(i) x/6 = cos(πt/6) and y/4 = sin(πt/6), so x²/36 + y²/16 = cos²(πt/6) + sin²(πt/6) = 1.
      (ii) One lap takes 2π/(π/6) = 12 seconds. At t = 0 the robot is at (6, 0); at t = 3 it is at (0, 4), above the centre, so it moves counterclockwise.
      (B)(i) t = 2: ⟨6 cos(π/3), 4 sin(π/3)⟩ = ⟨3, 2√3⟩. t = 3: ⟨6 cos(π/2), 4 sin(π/2)⟩ = ⟨0, 4⟩.
      (ii) Displacement p(3) − p(0) = ⟨0, 4⟩ − ⟨6, 0⟩ = ⟨−6, 4⟩. Average velocity ⟨−6, 4⟩/3 = ⟨−2, 4/3⟩ m/s.
      (C)(i) Δx = 0 − 3 = −3 and Δy = 4 − 2√3, so the slope is (4 − 2√3)/(−3) = (2√3 − 4)/3 ≈ −0.18.
      (ii) c² = 36 − 16 = 20, c = 2√5 ≈ 4.47, so the foci are (2√5, 0) and (−2√5, 0).
    explanation: |
      Six points. (A) 1 point for the identity argument; 1 point for 12 seconds and counterclockwise with a reason. (B) 1 point for both positions; 1 point for the displacement ⟨−6, 4⟩ and average velocity ⟨−2, 4/3⟩. (C) 1 point for the slope (2√3 − 4)/3 ≈ −0.18; 1 point for the foci (±2√5, 0).
  - slug: precalc-u04-exam-q45
    type: long_answer
    topic_code: "4.14"
    source: "AP Precalculus CED, Topics 4.11 and 4.14"
    points: 6
    prompt: |
      In a hypothetical model, a car-rental company has 500 cars at two locations, the Airport and Downtown. Each week 70% of the cars at the Airport stay there and 30% are returned Downtown; 20% of the cars Downtown are returned to the Airport and 80% stay Downtown. Let xₙ = [[Aₙ], [Dₙ]] be the numbers of cars after n weeks, with xₙ₊₁ = Txₙ. This week, x₀ = [[250], [250]].

      (A) (i) Write the transition matrix T.
          (ii) Find x₁ and x₂.
      (B) (i) Find the steady-state distribution of the 500 cars.
          (ii) The company would like to keep 250 cars at the Airport every week without moving any cars itself. Does the model suggest this is possible? Explain.
      (C) (i) Find det T and T⁻¹.
          (ii) Use T⁻¹ to find how many cars were at each location last week.
    answer: |
      (A)(i) T = [[0.7, 0.2], [0.3, 0.8]] (column 1: from the Airport; column 2: from Downtown).
      (ii) x₁ = [[0.7 · 250 + 0.2 · 250], [0.3 · 250 + 0.8 · 250]] = [[225], [275]]. x₂ = [[157.5 + 55], [67.5 + 220]] = [[212.5], [287.5]].
      (B)(i) Tx = x requires 0.3A = 0.2D, so A : D = 2 : 3; with 500 cars, [[200], [300]]. Check: 0.7(200) + 0.2(300) = 200.
      (ii) No. Starting from 250 at the Airport, the number falls (225, then 212.5) toward the steady state of 200. Unless the rates change or the company relocates cars, about 50 fewer than wanted will be at the Airport in the long run.
      (C)(i) det T = 0.56 − 0.06 = 0.5. T⁻¹ = (1/0.5)[[0.8, −0.2], [−0.3, 0.7]] = [[1.6, −0.4], [−0.6, 1.4]].
      (ii) x₋₁ = T⁻¹x₀ = [[1.6 · 250 − 0.4 · 250], [−0.6 · 250 + 1.4 · 250]] = [[300], [200]]: 300 at the Airport and 200 Downtown. (Check: T · [[300], [200]] = [[210 + 40], [90 + 160]] = [[250], [250]].)
    explanation: |
      Six points. (A) 1 point for T with columns as "from" states; 1 point for x₁ and x₂. (B) 1 point for [[200], [300]]; 1 point for "no" with the trend toward 200 as justification. (C) 1 point for det 0.5 and T⁻¹; 1 point for [[300], [200]].
