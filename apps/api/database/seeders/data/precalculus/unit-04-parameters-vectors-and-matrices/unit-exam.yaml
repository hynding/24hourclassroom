  # ---- True/false
  - slug: precalc-u04-exam-q33
    type: true_false
    topic_code: "4.4"
    source: "AP Precalculus CED, Topic 4.4"
    points: 1
    prompt: |
      True or false: The parametrization x = sin t, y = cos t, for 0 ≤ t ≤ 2π, traces the unit circle counterclockwise.
    answer: false
    explanation: |
      False. At t = 0 the point is (0, 1), the top, and at t = π/2 it is (1, 0), to the right. Moving from the top to the right is clockwise.
  - slug: precalc-u04-exam-q34
    type: true_false
    topic_code: "4.13"
    source: "AP Precalculus CED, Topic 4.13"
    points: 1
    prompt: |
      True or false: If the matrix of a linear transformation has a negative determinant, the transformation reverses orientation (it includes a reflection).
    answer: true
    explanation: |
      True. The sign of the determinant records orientation: positive keeps the order of ⟨1, 0⟩ and ⟨0, 1⟩ counterclockwise, negative flips it. For example, the reflection [[1, 0], [0, −1]] has determinant −1.
  - slug: precalc-u04-exam-q35
    type: true_false
    topic_code: "3.12"
    source: "AP Precalculus CED, Topic 3.12"
    points: 1
    prompt: |
      True or false: sin²θ = (1 − cos 2θ)/2 for every real number θ.
    answer: true
    explanation: |
      True. cos 2θ = 1 − 2sin²θ, so 2sin²θ = 1 − cos 2θ and sin²θ = (1 − cos 2θ)/2.
