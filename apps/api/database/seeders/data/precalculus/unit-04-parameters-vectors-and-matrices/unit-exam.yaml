        The 0.3 is in column 2, row 1: 30% of evening members switch to morning. Morning members stay at the rate 0.6.
      - |
        Correct. 0.6 + 0.4 = 1 and 0.3 + 0.7 = 1: every member ends up in one of the two states.
      - |
