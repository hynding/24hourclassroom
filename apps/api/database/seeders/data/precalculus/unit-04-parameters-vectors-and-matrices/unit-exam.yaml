unit: 4
description: |
  45 questions · about 85 minutes · every topic of Unit 4 (4.1 to 4.14): parametric functions and planar
  motion, rates of change along a path, parametric circles and segments, implicitly defined curves, conic
  sections and their parametrizations, vectors and vector-valued functions, matrices, determinants and inverses,
  linear transformations, and transition-matrix models, with a little review of Units 2 and 3. Includes three
  shared-context sets of three questions (a kicked football, an ellipse, and a transformation matrix),
  select-all, true/false, fill-in-the-blank and numeric items, two short-answer questions (3 points each) and
  two extended responses (6 points each). Multiple choice, select-all, true/false and numeric items are graded
  at once; fill-in-the-blank items are matched automatically; the free-response items are graded by your
  teacher against the scoring notes. Items marked (Calculator.) need a graphing calculator; the rest are meant
  to be done by hand. Unit 4 is not assessed on the AP exam.
questions:
  # ---- Stimulus set A: a kicked football (4.2, 4.3)
  - slug: precalc-u04-exam-q01
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Precalculus CED, Topic 4.2"
    points: 1
    stimulus: |
      In a hypothetical model, a football is kicked so that its position in feet t seconds after the kick is x(t) = 45t, y(t) = 2 + 60t − 16t², where x is the horizontal distance from the kicker and y is the height above the ground.
    prompt: |
      What is the greatest height the football reaches?
    options:
      - "60 ft"
      - "58.25 ft"
      - "114.5 ft"
      - "46 ft"
    option_explanations:
      - |
        60 ft/s is the initial upward speed, the coefficient of t, not a height.
      - |
        Correct. The vertex of y is at t = −60/(2 · (−16)) = 1.875 s, and y(1.875) = 2 + 112.5 − 56.25 = 58.25 ft.
      - |
        This is 2 + 60(1.875), which leaves out the −16t² term at the vertex time.
      - |
        This is y(1) = 2 + 60 − 16; the ball is still rising at t = 1, since the vertex is at t = 1.875.
    answer: 1
  - slug: precalc-u04-exam-q02
    type: multiple_choice
    topic_code: "4.3"
    source: "AP Precalculus CED, Topic 4.3"
    points: 1
    stimulus: |
      In a hypothetical model, a football is kicked so that its position in feet t seconds after the kick is x(t) = 45t, y(t) = 2 + 60t − 16t², where x is the horizontal distance from the kicker and y is the height above the ground.
    prompt: |
      What is the average rate of change of the football's height with respect to time on the interval [0, 2]?
    options:
      - "58 ft/s"
      - "45 ft/s"
      - "56 ft/s"
      - "28 ft/s"
    option_explanations:
      - |
        58 ft is the height y(2), not a change in height per second.
      - |
        45 ft/s is Δx/Δt, the horizontal rate, not the rate of change of the height.
      - |
        56 ft is the change in height Δy, which still has to be divided by Δt = 2.
      - |
        Correct. y(0) = 2 and y(2) = 2 + 120 − 64 = 58, so Δy/Δt = (58 − 2)/2 = 28 ft/s.
    answer: 3
  - slug: precalc-u04-exam-q03
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Precalculus CED, Topic 4.2"
    points: 1
    stimulus: |
      In a hypothetical model, a football is kicked so that its position in feet t seconds after the kick is x(t) = 45t, y(t) = 2 + 60t − 16t², where x is the horizontal distance from the kicker and y is the height above the ground.
    prompt: |
      (Calculator.) How far from the kicker does the football land?
    options:
      - "About 170.2 ft"
      - "About 168.8 ft"
      - "About 3.78 ft"
      - "About 84.4 ft"
    option_explanations:
      - |
        Correct. 16t² − 60t − 2 = 0 has positive root t = (60 + √3728)/32 ≈ 3.783 s, and x ≈ 45 · 3.783 ≈ 170.2 ft.
      - |
        This solves 60t − 16t² = 0 (t = 3.75), ignoring the 2-foot starting height, so the landing time is slightly too early.
      - |
        3.78 is the landing time in seconds; the question asks for the horizontal distance x at that time.
      - |
        This is x at the highest point (t = 1.875), about halfway; the ball keeps travelling until y = 0.
    answer: 0
  # ---- Independent items
  - slug: precalc-u04-exam-q04
    type: multiple_choice
    topic_code: "4.1"
    source: "AP Precalculus CED, Topic 4.1"
    points: 1
    prompt: |
      Which equation in x and y describes the path of x = 3 − t, y = 2t + 1?
    options:
      - "y = 2x − 5"
      - "x = 7 − 2y"
      - "y = 7 − 2x"
      - "y = 2x + 7"
    option_explanations:
      - |
        This uses t = x − 3; solving x = 3 − t for t gives t = 3 − x.
      - |
        This swaps the roles of x and y in the result.
      - |
        Correct. t = 3 − x, so y = 2(3 − x) + 1 = 7 − 2x.
      - |
        This mishandles the sign when distributing: 2(3 − x) = 6 − 2x, not 6 + 2x.
    answer: 2
  - slug: precalc-u04-exam-q05
    type: multiple_choice
    topic_code: "4.1"
    source: "AP Precalculus CED, Topic 4.1"
    points: 1
    prompt: |
      Which describes the path of x = eᵗ, y = e^(2t), for all real t?
    options:
      - "The part of the parabola y = x² with x > 0"
      - "The entire parabola y = x²"
      - "The line y = 2x for x > 0"
      - "The part of the parabola y = x² with x ≥ 1"
    option_explanations:
      - |
        Correct. e^(2t) = (eᵗ)² = x², and x = eᵗ takes every positive value but no others.
      - |
        y = x² is right, but x = eᵗ is never zero or negative, so the left half of the parabola is missing.
      - |
        e^(2t) is (eᵗ)², not 2eᵗ; doubling the exponent squares the power.
      - |
        This assumes t ≥ 0; for negative t, x = eᵗ lies between 0 and 1, which is also part of the path.
    answer: 0
  - slug: precalc-u04-exam-q06
    type: multiple_choice
    topic_code: "4.3"
    source: "AP Precalculus CED, Topic 4.3"
    points: 1
    prompt: |
      (Calculator.) A path is given by x(t) = ln(t + 1), y(t) = 2ᵗ. To the nearest hundredth, what is the slope of the segment of the path from t = 1 to t = 3?
    options:
      - "0.12"
      - "3.00"
      - "0.35"
      - "8.66"
    option_explanations:
      - |
        This is Δx/Δy = 0.693/6; the slope of the path is Δy/Δx.
      - |
        3 is Δy/Δt = 6/2, the vertical rate, not the slope of the path.
      - |
        0.35 is Δx/Δt = (ln 4 − ln 2)/2, the horizontal rate.
      - |
        Correct. Δx = ln 4 − ln 2 = ln 2 ≈ 0.6931 and Δy = 8 − 2 = 6, so the slope is 6/0.6931 ≈ 8.66.
    answer: 3
  - slug: precalc-u04-exam-q07
    type: multiple_choice
    topic_code: "4.4"
    source: "AP Precalculus CED, Topic 4.4"
    points: 1
    prompt: |
      A point moves according to x = 2 + 3 cos(4πt), y = −1 + 3 sin(4πt), with t in seconds. How long does one full revolution take?
    options:
      - "2 seconds"
      - "1/2 second"
      - "4π seconds"
      - "π/2 seconds"
    option_explanations:
      - |
        This inverts the period; with b = 4π the point turns twice every second, not once every two seconds.
      - |
        Correct. One revolution takes 2π/b = 2π/(4π) = 1/2 second.
      - |
        4π is the coefficient b; the time per revolution is 2π divided by b.
      - |
        This divides 2π by 4 instead of by the full coefficient 4π.
    answer: 1
  - slug: precalc-u04-exam-q08
    type: multiple_choice
    topic_code: "4.4"
    source: "AP Precalculus CED, Topic 4.4"
    points: 1
    prompt: |
      The parametrization x = 4 − 6t, y = 1 + 2t, 0 ≤ t ≤ 1, traces a line segment. Where does it start and end?
    options:
      - "From (−6, 2) to (4, 1)"
      - "From (−2, 3) to (4, 1)"
      - "From (4, 1) to (−2, 3)"
      - "From (4, 1) to (−6, 2)"
    option_explanations:
      - |
        (−6, 2) is the change vector, the coefficients of t, not a point on the segment.
      - |
        These are the right endpoints in the wrong order: at t = 0 the point is (4, 1).
      - |
        Correct. t = 0 gives (4, 1) and t = 1 gives (4 − 6, 1 + 2) = (−2, 3).
      - |
        (−6, 2) is the change, which must be added to the start: the end is (4, 1) + (−6, 2) = (−2, 3).
    answer: 2
  - slug: precalc-u04-exam-q09
    type: multiple_choice
    topic_code: "4.5"
    source: "AP Precalculus CED, Topic 4.5"
    points: 1
    prompt: |
      Which points of the curve x² − xy + y² = 7 have x = 2?
    options:
      - "(2, 3) and (2, −1)"
      - "(2, −3) and (2, 1)"
      - "(2, √3) and (2, −√3)"
      - "(2, 3) only"
    option_explanations:
      - |
        Correct. 4 − 2y + y² = 7 gives y² − 2y − 3 = (y − 3)(y + 1) = 0, so y = 3 or y = −1.
      - |
        These solve y² + 2y − 3 = 0; the term −xy at x = 2 is −2y, not +2y.
      - |
        This drops the −xy term and solves 4 + y² = 7.
      - |
        y = 3 works, but the quadratic has a second root, y = −1: 4 + 2 + 1 = 7.
    answer: 0
  - slug: precalc-u04-exam-q10
    type: multiple_choice
    topic_code: "4.5"
    source: "AP Precalculus CED, Topic 4.5"
    points: 1
    prompt: |
      What is the slope of the line tangent to the circle (x − 1)² + (y − 2)² = 25 at the point (−2, 6)?
    options:
      - "−4/3"
      - "4/3"
      - "−3/4"
      - "3/4"
    option_explanations:
      - |
        −4/3 is the slope of the radius from (1, 2) to (−2, 6); the tangent is perpendicular to it.
      - |
        This is the negative of the radius's slope, not its negative reciprocal.
      - |
        This takes the reciprocal of the radius's slope but keeps its sign; perpendicular slopes have opposite signs.
      - |
        Correct. The radius has slope (6 − 2)/(−2 − 1) = −4/3, and the tangent is perpendicular, so its slope is 3/4.
    answer: 3
  # ---- Stimulus set B: one ellipse (4.6, 4.7)
  - slug: precalc-u04-exam-q11
    type: multiple_choice
    topic_code: "4.6"
    source: "AP Precalculus CED, Topic 4.6"
    points: 1
    stimulus: |
      Consider the conic 4x² + 9y² − 16x + 54y + 61 = 0.
    prompt: |
      Which is the equation of the conic in standard form?
    options:
      - "(x − 2)²/9 − (y + 3)²/4 = 1"
      - "(x − 2)²/9 + (y + 3)²/4 = 1"
      - "(x + 2)²/9 + (y − 3)²/4 = 1"
      - "(x − 2)²/4 + (y + 3)²/9 = 1"
    option_explanations:
      - |
        Both squared terms have positive coefficients (4 and 9), so the conic is an ellipse, not a hyperbola.
      - |
        Correct. 4(x − 2)² − 16 + 9(y + 3)² − 81 + 61 = 0 gives 4(x − 2)² + 9(y + 3)² = 36; divide by 36.
      - |
        The shifts have the wrong signs: x² − 4x completes to (x − 2)² and y² + 6y to (y + 3)².
      - |
        Dividing 4(x − 2)² by 36 leaves a denominator of 9 under x, not 4.
    answer: 1
  - slug: precalc-u04-exam-q12
    type: multiple_choice
    topic_code: "4.6"
    source: "AP Precalculus CED, Topic 4.6"
    points: 1
    stimulus: |
      Consider the conic 4x² + 9y² − 16x + 54y + 61 = 0.
    prompt: |
      Where are the foci of the conic?
    options:
      - "(2 ± √13, −3)"
      - "(2, −3 ± √5)"
      - "(2 ± √5, −3)"
      - "(2 ± 5, −3)"
    option_explanations:
      - |
        This uses c² = a² + b² = 13, the hyperbola rule; for an ellipse c² = a² − b².
      - |
        c = √5 is right, but the major axis is horizontal (the larger denominator, 9, is under x).
      - |
        Correct. The ellipse (x − 2)²/9 + (y + 3)²/4 = 1 has c² = 9 − 4 = 5, so the foci are (2 ± √5, −3).
      - |
        5 is c², not c; the foci are √5 from the centre.
    answer: 2
  - slug: precalc-u04-exam-q13
    type: multiple_choice
    topic_code: "4.7"
    source: "AP Precalculus CED, Topic 4.7"
    points: 1
    stimulus: |
      Consider the conic 4x² + 9y² − 16x + 54y + 61 = 0.
    prompt: |
      Which parametrization traces the conic once for 0 ≤ t ≤ 2π?
    options:
      - "x = 2 + 9 cos t, y = −3 + 4 sin t"
      - "x = 2 + 2 cos t, y = −3 + 3 sin t"
      - "x = −2 + 3 cos t, y = 3 + 2 sin t"
      - "x = 2 + 3 cos t, y = −3 + 2 sin t"
    option_explanations:
      - |
        The coefficients must be the semi-axes a = 3 and b = 2, not a² and b².
      - |
        The semi-axes are swapped, which would make the ellipse taller than it is wide.
      - |
        The shifts have the wrong signs: the centre is (2, −3), not (−2, 3).
      - |
        Correct. ((x − 2)/3)² + ((y + 3)/2)² = cos²t + sin²t = 1, which is the standard form (x − 2)²/9 + (y + 3)²/4 = 1.
    answer: 3
  # ---- Independent items
  - slug: precalc-u04-exam-q14
    type: multiple_choice
    topic_code: "4.6"
    source: "AP Precalculus CED, Topic 4.6"
    points: 1
    prompt: |
      What is the directrix of the parabola (y − 1)² = −8(x + 2)?
    options:
      - "x = 0"
      - "x = −4"
      - "y = 3"
      - "x = −2"
    option_explanations:
      - |
        Correct. Vertex (−2, 1) and 4p = −8, so p = −2: the parabola opens left, the focus is (−4, 1) and the directrix is x = h − p = −2 + 2 = 0.
      - |
        x = −4 passes through the focus; the directrix is on the other side of the vertex.
      - |
        The squared variable is y, so the parabola opens sideways and its directrix is a vertical line x = constant.
      - |
        x = −2 passes through the vertex; the directrix is |p| = 2 units from the vertex.
    answer: 0
  - slug: precalc-u04-exam-q15
    type: multiple_choice
    topic_code: "4.6"
    source: "AP Precalculus CED, Topic 4.6"
    points: 1
    prompt: |
      What are the asymptotes of the hyperbola (y + 1)²/4 − (x − 3)²/9 = 1?
    options:
      - "y + 1 = ±(3/2)(x − 3)"
      - "y + 1 = ±(2/3)(x − 3)"
      - "y − 1 = ±(2/3)(x + 3)"
      - "y + 1 = ±(4/9)(x − 3)"
    option_explanations:
      - |
        This inverts the slope. For an up–down hyperbola with a = 2 (under y) and b = 3, the slopes are ±a/b = ±2/3.
      - |
        Correct. Setting (y + 1)²/4 = (x − 3)²/9 gives y + 1 = ±(2/3)(x − 3), lines through the centre (3, −1).
      - |
        The centre is (3, −1), so the lines use x − 3 and y + 1.
      - |
        The slopes use the square roots of the denominators, 2 and 3, not 4 and 9.
    answer: 1
  - slug: precalc-u04-exam-q16
    type: multiple_choice
    topic_code: "4.7"
    source: "AP Precalculus CED, Topic 4.7"
    points: 1
    prompt: |
      Which curve is traced by x = 2 + sec t, y = tan t (for t where both are defined)?
    options:
      - "(x − 2)² + y² = 1"
      - "y² − (x − 2)² = 1"
      - "(x − 2)² − y² = 1"
      - "(x + 2)² − y² = 1"
    option_explanations:
      - |
        This would come from cosine and sine; secant and tangent satisfy sec²t − tan²t = 1, a difference.
      - |
        This has the wrong sign; sec²t − tan²t = 1 puts the x-term first.
      - |
        Correct. sec t = x − 2 and tan t = y, and sec²t − tan²t = 1 gives (x − 2)² − y² = 1, a hyperbola opening left and right.
      - |
        sec t = x − 2, so the shift is x − 2, centring the hyperbola at (2, 0).
    answer: 2
  - slug: precalc-u04-exam-q17
    type: multiple_choice
    topic_code: "4.8"
    source: "AP Precalculus CED, Topic 4.8"
    points: 1
    prompt: |
      What is the direction angle (between 0 and 2π) of the vector ⟨−3, −3⟩?
    options:
      - "π/4"
      - "3π/4"
      - "7π/4"
      - "5π/4"
    option_explanations:
      - |
        tan⁻¹((−3)/(−3)) = tan⁻¹(1) = π/4 points into Quadrant I; both components are negative, so the vector is in Quadrant III.
      - |
        3π/4 is in Quadrant II, where the x-component is negative but the y-component is positive.
      - |
        7π/4 is in Quadrant IV, where the y-component is negative but the x-component is positive.
      - |
        Correct. Both components are negative (Quadrant III) and the reference angle is π/4, so θ = π + π/4 = 5π/4.
    answer: 3
  - slug: precalc-u04-exam-q18
    type: multiple_choice
    topic_code: "4.8"
    source: "AP Precalculus CED, Topic 4.8"
    points: 1
    prompt: |
      (Calculator.) To the nearest hundredth of a radian, what is the angle between the vectors ⟨2, 1⟩ and ⟨−1, 3⟩?
    options:
      - "1.43"
      - "0.14"
      - "1.71"
      - "1.57"
    option_explanations:
      - |
        Correct. u · v = −2 + 3 = 1, ‖u‖ = √5, ‖v‖ = √10, so cos θ = 1/√50 ≈ 0.1414 and θ ≈ 1.43 radians.
      - |
        0.14 is cos θ, not θ; take the inverse cosine.
      - |
        This uses a dot product of −1 instead of +1; (2)(−1) + (1)(3) = 1.
      - |
        1.57 ≈ π/2 would need a dot product of exactly 0; here it is 1, so the angle is slightly less than π/2.
    answer: 0
  - slug: precalc-u04-exam-q19
    type: multiple_choice
    topic_code: "4.9"
    source: "AP Precalculus CED, Topic 4.9"
    points: 1
    prompt: |
      (Calculator.) An object's position is p(t) = ⟨2t, 5 − t²⟩. To the nearest hundredth, what is the magnitude of its average velocity on the interval [1, 4]?
    options:
      - "16.16"
      - "5.39"
      - "7.00"
      - "4.58"
    option_explanations:
      - |
        16.16 is the magnitude of the displacement ⟨6, −15⟩; it still has to be divided by the 3 seconds elapsed.
      - |
        Correct. p(4) − p(1) = ⟨8, −11⟩ − ⟨2, 4⟩ = ⟨6, −15⟩; divided by 3 this is ⟨2, −5⟩, with magnitude √29 ≈ 5.39.
      - |
        This adds |2| and |−5|; a magnitude uses the Pythagorean theorem.
      - |
        This computes √(25 − 4); the squares of the components add: √(4 + 25).
    answer: 1
  # ---- Stimulus set C: one transformation matrix (4.11, 4.12, 4.13)
  - slug: precalc-u04-exam-q20
    type: multiple_choice
    topic_code: "4.12"
    source: "AP Precalculus CED, Topic 4.12"
    points: 1
    stimulus: |
      Let M = [[2, 1], [−1, 3]] (written row by row) act on column vectors in the plane.
    prompt: |
      What is the image of the point (1, 1) under M?
    options:
      - "(1, 4)"
      - "(2, 3)"
      - "(3, 2)"
      - "(3, 4)"
    option_explanations:
      - |
        This multiplies by the columns instead of the rows (the transpose of M).
      - |
        This uses only the diagonal entries and ignores the off-diagonal 1 and −1.
      - |
        Correct. Row 1: 2(1) + 1(1) = 3. Row 2: −1(1) + 3(1) = 2. The image is (3, 2).
      - |
        This drops the sign of −1 in row 2: −1 + 3 = 2, not 1 + 3 = 4.
    answer: 2
  - slug: precalc-u04-exam-q21
    type: multiple_choice
    topic_code: "4.13"
    source: "AP Precalculus CED, Topic 4.13"
    points: 1
    stimulus: |
      Let M = [[2, 1], [−1, 3]] (written row by row) act on column vectors in the plane.
    prompt: |
      M sends the unit square (vertices (0, 0), (1, 0), (1, 1), (0, 1)) to a parallelogram. What is the parallelogram's area?
    options:
      - "5"
      - "1"
      - "−7"
      - "7"
    option_explanations:
      - |
        This computes 6 − 1; the determinant is (2)(3) − (1)(−1) = 6 + 1.
      - |
        Only transformations with |det| = 1 preserve area; this matrix stretches the square.
      - |
        The determinant here is +7, and an area is never negative in any case.
      - |
        Correct. The area scale factor is |det M| = |6 − (−1)| = 7, and the unit square has area 1, so the image has area 7.
    answer: 3
  - slug: precalc-u04-exam-q22
    type: multiple_choice
    topic_code: "4.11"
    source: "AP Precalculus CED, Topic 4.11"
    points: 1
    stimulus: |
      Let M = [[2, 1], [−1, 3]] (written row by row) act on column vectors in the plane.
    prompt: |
      Which matrix represents the transformation that undoes M?
    options:
      - "(1/7)[[3, −1], [1, 2]]"
      - "(1/7)[[2, 1], [−1, 3]]"
      - "(1/5)[[3, −1], [1, 2]]"
      - "(1/7)[[−3, 1], [−1, −2]]"
    option_explanations:
      - |
        Correct. M⁻¹ = (1/det M)[[d, −b], [−c, a]] = (1/7)[[3, −1], [1, 2]]. Check: M · [[3, −1], [1, 2]] = [[7, 0], [0, 7]].
      - |
        This divides M by its determinant without swapping the diagonal or negating the off-diagonal entries.
      - |
        The rearrangement is right, but det M = 6 + 1 = 7, not 5.
      - |
        Every sign is flipped; this is −M⁻¹, as if det M were −7.
    answer: 0
  # ---- Independent items
  - slug: precalc-u04-exam-q23
    type: multiple_choice
    topic_code: "4.10"
    source: "AP Precalculus CED, Topic 4.10"
    points: 1
    prompt: |
      What is the product [[1, 0, 2], [−1, 3, 1]] · [[3], [1], [−1]]?
    options:
      - "[[3, 0, −2], [−3, 3, −1]]"
      - "[[1], [−1]]"
      - "[[5], [−1]]"
      - "The product is not defined."
    option_explanations:
      - |
        This multiplies each column of the first matrix by an entry of the vector but never adds; each row must be dotted with the column.
      - |
        Correct. Row 1: 3 + 0 − 2 = 1. Row 2: −3 + 3 − 1 = −1. A 2 × 3 matrix times a 3 × 1 matrix gives a 2 × 1 matrix.
      - |
        Row 1 becomes 3 + 0 + 2 here, ignoring the sign of the −1 in the third entry.
      - |
        (2 × 3)(3 × 1) has matching inner dimensions, so the product is defined and is 2 × 1.
    answer: 1
  - slug: precalc-u04-exam-q24
    type: multiple_choice
    topic_code: "4.11"
    source: "AP Precalculus CED, Topic 4.11"
    points: 1
    prompt: |
      (Calculator.) Use an inverse matrix to solve the system 1.2x + 0.5y = 3.1, 0.8x − 0.3y = 0.4. To the nearest hundredth, which is the solution?
    options:
      - "x = 2.63, y = 1.49"
      - "x = −1.49, y = −2.63"
      - "x = 1.49, y = 2.63"
      - "x = 3.92, y = 2.36"
    option_explanations:
      - |
        The values are swapped; check: 1.2(2.63) + 0.5(1.49) ≈ 3.90, not 3.1.
      - |
        Both signs are flipped, as if the determinant −0.76 had been entered as 0.76.
      - |
        Correct. With A = [[1.2, 0.5], [0.8, −0.3]], det A = −0.76 and A⁻¹B ≈ [[1.4868], [2.6316]]. Check: 1.2(1.4868) + 0.5(2.6316) ≈ 3.1.
      - |
        This multiplies the constants by A instead of A⁻¹: A · [[3.1], [0.4]] = [[3.92], [2.36]]. The solution is X = A⁻¹B.
    answer: 2
  - slug: precalc-u04-exam-q25
    type: multiple_choice
    topic_code: "4.12"
    source: "AP Precalculus CED, Topic 4.12"
    points: 1
    prompt: |
