    option_explanations:
      - |
        This swaps the coordinates, (x, y) → (y, x), which is the reflection in y = x.
      - |
        This sends (x, y) to (−x, −y), the rotation by π about the origin.
      - |
        This sends ⟨1, 0⟩ to ⟨0, 1⟩, a counterclockwise rotation by π/2, not a reflection.
      - |
        Correct. Reflecting in y = −x sends (x, y) to (−y, −x), so ⟨1, 0⟩ → ⟨0, −1⟩ and ⟨0, 1⟩ → ⟨−1, 0⟩: those are the columns.
