    - slug: precalc-u04-w29-q21
      type: short_answer
      topic_code: "4.6"
      source: "AP Precalculus CED, Topic 4.6"
      points: 3
      prompt: |
        Consider the conic x² + 4y² − 6x + 16y + 9 = 0.

        (a) Complete the square to write the equation in standard form.
        (b) Identify the conic and give its centre, vertices and co-vertices.
        (c) Find the exact coordinates of the foci.
      answer: |
        (a) (x² − 6x + 9) + 4(y² + 4y + 4) = −9 + 9 + 16, so (x − 3)² + 4(y + 2)² = 16, and (x − 3)²/16 + (y + 2)²/4 = 1.
        (b) An ellipse with centre (3, −2), a = 4 (horizontal), b = 2. Vertices (7, −2) and (−1, −2); co-vertices (3, 0) and (3, −4).
        (c) c² = 16 − 4 = 12, c = 2√3, so the foci are (3 + 2√3, −2) and (3 − 2√3, −2).
      explanation: |
        Three points, one per part. (a) correct standard form (the 16 on the right must account for the factor 4). (b) ellipse with centre, both vertices and both co-vertices. (c) both foci in exact form.
    - slug: precalc-u04-w29-q22
      type: short_answer
      topic_code: "4.7"
      source: "AP Precalculus CED, Topic 4.7"
      points: 3
      prompt: |
        Consider the hyperbola (x − 1)²/9 − (y + 2)²/4 = 1.

        (a) Write a parametrization of the hyperbola using secant and tangent.
        (b) Show algebraically that your parametrization satisfies the equation, naming the identity you use.
        (c) Find the exact point given by t = π/4, and state the interval of t (between −π and π) that traces the right branch.
      answer: |
        (a) x = 1 + 3 sec t, y = −2 + 2 tan t (t ≠ ±π/2).
        (b) (x − 1)²/9 − (y + 2)²/4 = (9 sec²t)/9 − (4 tan²t)/4 = sec²t − tan²t = 1, by the Pythagorean identity 1 + tan²t = sec²t.
        (c) sec(π/4) = √2 and tan(π/4) = 1, so the point is (1 + 3√2, 0). The right branch has x > 1, so sec t > 0: −π/2 < t < π/2.
      explanation: |
        Three points, one per part. (a) a correct parametrization. (b) the substitution reduced to sec²t − tan²t = 1 with the identity named. (c) the point (1 + 3√2, 0) and the interval −π/2 < t < π/2.
    - slug: precalc-u04-w29-q23
      type: long_answer
      topic_code: "4.6"
      source: "AP Precalculus CED, Topics 4.6 and 4.7"
      points: 6
      prompt: |
        A hypothetical museum has an elliptical "whispering gallery". Its floor plan is an ellipse 50 m long and 30 m wide. Place the centre of the floor at the origin with the long axis along the x-axis, distances in metres.

        (A) (i) Write an equation of the ellipse in standard form.
            (ii) Find the foci. A whisper at one focus is heard clearly at the other; how far apart must two visitors stand to use this effect?
        (B) The wall is traced by x(t) = 25 cos t, y(t) = 15 sin t.
            (i) Find the exact point on the wall at t = π/3.
            (ii) Show that the distances from this point to the two foci add to 50 m, and explain why that total is expected.
        (C) (i) Show that the point (20, 9) lies on the wall.
            (ii) Find the width of the gallery measured along the line x = 20, which passes through one focus.
      answer: |
        (A)(i) a = 25 and b = 15: x²/625 + y²/225 = 1.
        (ii) c² = 625 − 225 = 400, c = 20. Foci (20, 0) and (−20, 0), so the visitors stand 40 m apart.
        (B)(i) (25 cos(π/3), 15 sin(π/3)) = (12.5, 15√3/2), about (12.5, 12.99).
        (ii) y² = 225 · 3/4 = 168.75. Distance to (20, 0): √((12.5 − 20)² + 168.75) = √(56.25 + 168.75) = √225 = 15. Distance to (−20, 0): √(32.5² + 168.75) = √(1056.25 + 168.75) = √1225 = 35. Sum 15 + 35 = 50. Expected because every point on an ellipse has distances to the foci adding to 2a = 50 m, the length of the major axis.
        (C)(i) 20²/625 + 9²/225 = 400/625 + 81/225 = 0.64 + 0.36 = 1.
        (ii) At x = 20, y²/225 = 1 − 0.64 = 0.36, so y² = 81 and y = ±9. The width along x = 20 is 9 − (−9) = 18 m.
      explanation: |
        Six points. (A) 1 point for the equation; 1 point for foci (±20, 0) and 40 m. (B) 1 point for the exact point; 1 point for the distances 15 and 35 summing to 50 with the 2a explanation. (C) 1 point for the verification; 1 point for y = ±9 and the width 18 m.
