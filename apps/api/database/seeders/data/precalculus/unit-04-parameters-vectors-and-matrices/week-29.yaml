week: 29
unit: 4
title: "Conic Sections and Their Parametrizations"
topics: ["4.6", "4.7"]
guide: guides/week-29.md
guide_description: |
  Parabolas (focus, directrix, vertex), ellipses (vertices, co-vertices, foci with c² = a² − b²) and hyperbolas
  (vertices, foci with c² = a² + b², asymptotes) in standard form; classifying a conic from its squared terms
  and completing the square to reach standard form; and parametrizing ellipses with cosine and sine, hyperbolas
  with secant and tangent, and parabolas with x = t. Worked examples: placing a receiver in a hypothetical
  satellite dish, the ellipse x² + 4y² − 6x + 16y + 9 = 0, and verifying a hyperbola parametrization.
flashcards_description: |
  30 cards on the standard forms of parabolas, ellipses and hyperbolas, foci and asymptotes, completing the
  square, classifying conics, and parametrizing conics with trigonometric identities.

flashcards:
  - front: Parabola (x − h)² = 4p(y − k) → focus and directrix
    back: |
      Focus (h, k + p), directrix y = k − p. It opens up if p > 0 and down if p < 0; the vertex is halfway between focus and directrix.
    topic_code: "4.6"
  - front: Parabola (y − k)² = 4p(x − h) → focus and directrix
    back: |
      Focus (h + p, k), directrix x = h − p. It opens right if p > 0 and left if p < 0.
    topic_code: "4.6"
  - front: x² = 8y → focus and directrix
    back: |
      4p = 8, p = 2: focus (0, 2), directrix y = −2. The point (4, 2) is 4 units from both.
    topic_code: "4.6"
  - front: y² = −12x → focus and directrix
    back: |
      4p = −12, p = −3: focus (−3, 0), directrix x = 3. It opens to the left.
    topic_code: "4.6"
  - front: Hypothetical dish 60 cm wide, 9 cm deep → focal distance
    back: |
      x² = 4py through (30, 9): 900 = 36p, p = 25 cm. The receiver sits 25 cm above the vertex.
    topic_code: "4.6"
  - front: Ellipse definition → in terms of foci
    back: |
      All points whose distances to two foci add to the constant 2a, the length of the major axis.
    topic_code: "4.6"
  - front: Ellipse (x − h)²/a² + (y − k)²/b² = 1 with a > b → vertices, co-vertices, foci
    back: |
      Vertices (h ± a, k), co-vertices (h, k ± b), foci (h ± c, k) with c² = a² − b².
    topic_code: "4.6"
  - front: Direction of an ellipse's major axis → how to tell
    back: |
      The larger denominator. Under x it is horizontal; under y it is vertical.
    topic_code: "4.6"
  - front: (x + 2)²/25 + (y − 4)²/9 = 1 → foci
    back: |
      c² = 25 − 9 = 16, c = 4. Centre (−2, 4), horizontal major axis, so foci (2, 4) and (−6, 4).
    topic_code: "4.6"
  - front: x²/169 + y²/144 = 1 → foci
    back: |
      c² = 169 − 144 = 25, so c = 5 and the foci are (±5, 0).
    topic_code: "4.6"
  - front: Hyperbola definition → in terms of foci
    back: |
      All points whose distances to two foci differ by the constant 2a (in absolute value).
    topic_code: "4.6"
  - front: Hyperbola (x − h)²/a² − (y − k)²/b² = 1 → vertices, foci, asymptotes
    back: |
      Vertices (h ± a, k), foci (h ± c, k) with c² = a² + b², asymptotes y − k = ±(b/a)(x − h). It opens left and right.
    topic_code: "4.6"
  - front: Direction of a hyperbola → how to tell
    back: |
      The positive squared term, not the larger denominator. Positive x-term: opens left–right; positive y-term: opens up–down.
    topic_code: "4.6"
  - front: 9x² − 4y² = 36 → standard form, foci, asymptotes
    back: |
      x²/4 − y²/9 = 1; c² = 13, foci (±√13, 0); asymptotes y = ±(3/2)x.
    topic_code: "4.6"
  - front: (y − 1)²/16 − (x + 2)²/9 = 1 → vertices and foci
    back: |
      Opens up and down from centre (−2, 1). a = 4: vertices (−2, 5), (−2, −3). c = 5: foci (−2, 6), (−2, −4).
    topic_code: "4.6"
  - front: Asymptotes of a hyperbola → why they exist
    back: |
      Far from the centre the 1 on the right side is negligible, so the curve approaches the lines where (x − h)²/a² − (y − k)²/b² = 0, the diagonals of the a-by-b box.
    topic_code: "4.6"
  - front: Classifying Ax² + Cy² + Dx + Ey + F = 0 → rule
    back: |
      A, C same sign: ellipse (circle if A = C). Opposite signs: hyperbola. Exactly one of A, C zero: parabola. Degenerate cases show up when you complete the square.
    topic_code: "4.6"
  - front: x² + 4y² − 6x + 16y + 9 = 0 → standard form
    back: |
      (x − 3)² + 4(y + 2)² = 16, so (x − 3)²/16 + (y + 2)²/4 = 1: ellipse, centre (3, −2), a = 4, b = 2.
    topic_code: "4.6"
  - front: 4x² − 9y² − 8x − 36y − 68 = 0 → standard form
    back: |
      4(x − 1)² − 9(y + 2)² = 36, so (x − 1)²/9 − (y + 2)²/4 = 1: hyperbola, centre (1, −2), opening left and right.
    topic_code: "4.6"
  - front: Ellipse with a = b → what it is
    back: |
      A circle: c² = a² − a² = 0, so both foci coincide at the centre.
    topic_code: "4.6"
  - front: Parametrizing an ellipse → formula and identity
    back: |
      x = h + a cos t, y = k + b sin t, 0 ≤ t ≤ 2π, counterclockwise from (h + a, k). It works because cos²t + sin²t = 1.
    topic_code: "4.7"
  - front: Parametrizing x²/a² − y²/b² = 1 → formula and identity
    back: |
      x = a sec t, y = b tan t, because sec²t − tan²t = 1. Exclude t = π/2 and 3π/2, where sec and tan are undefined.
    topic_code: "4.7"
  - front: x = a sec t, y = b tan t → which t give which branch
    back: |
      −π/2 < t < π/2 gives sec t > 0, the right branch; π/2 < t < 3π/2 gives sec t < 0, the left branch.
    topic_code: "4.7"
  - front: Parametrizing an up–down hyperbola y²/a² − x²/b² = 1 → formula
    back: |
      x = b tan t, y = a sec t. For y²/9 − x² = 1: x = tan t, y = 3 sec t.
    topic_code: "4.7"
  - front: Parametrizing a graph y = f(x) → simplest method
    back: |
      x = t, y = f(t). For a sideways curve x = g(y), use y = t, x = g(t).
    topic_code: "4.7"
  - front: y = x² − 4x → a parametrization with the vertex at t = 0
    back: |
      x = t + 2, y = t² − 4, since (t + 2)² − 4(t + 2) = t² − 4. At t = 0 the point is the vertex (2, −4).
    topic_code: "4.7"
  - front: Checking a parametrization of an implicit curve → method
    back: |
      Substitute x(t) and y(t) into the equation and simplify to a true identity. For x = 1 + 3 sec t, y = −2 + 2 tan t in (x − 1)²/9 − (y + 2)²/4 = 1: sec²t − tan²t = 1.
    topic_code: "4.7"
  - front: Error-spot → "foci of x²/16 − y²/9 = 1 use c² = 16 − 9"
    back: |
      That is the ellipse rule. For a hyperbola c² = a² + b² = 25, so the foci are (±5, 0), outside the vertices.
    topic_code: "4.6"
  - front: Error-spot → "x²/25 + y²/9 = 1 has vertices (±25, 0)"
    back: |
      a² = 25, so a = 5 and the vertices are (±5, 0). The denominators are squares of the semi-axes.
    topic_code: "4.6"
  - front: Error-spot → "4(y² + 4y) becomes 4(y + 2)² by adding 4 to both sides"
    back: |
      Adding 4 inside the bracket adds 4 · 4 = 16 to that side, so 16 must be added to the other side too.
    topic_code: "4.6"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 4.6 and 4.7: parabolas, ellipses and
    hyperbolas, completing the square, and parametrizing conics), with about a third reviewing weeks 27–28 and
    Units 1 and 3 (parametric circles, implicit curves, rates along a path, rational asymptotes,
    transformations, secant and inverse trigonometric values). Opens with a shared-context set on one ellipse.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. No calculator is needed.
  questions:
    # ---- Stimulus set: one ellipse (4.6, 4.7)
    - slug: precalc-u04-w29-q01
      type: multiple_choice
      topic_code: "4.6"
      source: "AP Precalculus CED, Topic 4.6"
      points: 1
      stimulus: |
        Consider the ellipse (x + 2)²/25 + (y − 4)²/9 = 1.
      prompt: |
        What are the centre and the vertices (the endpoints of the major axis)?
      options:
        - "Centre (2, −4); vertices (7, −4) and (−3, −4)"
        - "Centre (−2, 4); vertices (−2, 9) and (−2, −1)"
        - "Centre (−2, 4); vertices (3, 4) and (−7, 4)"
        - "Centre (−2, 4); vertices (23, 4) and (−27, 4)"
      option_explanations:
        - |
          The signs of the centre are reversed: (x + 2) means h = −2 and (y − 4) means k = 4.
        - |
          The larger denominator, 25, is under the x-term, so the major axis is horizontal, not vertical.
        - |
          Correct. Centre (−2, 4); a² = 25 under x gives a = 5, so the vertices are (−2 ± 5, 4) = (3, 4) and (−7, 4).
        - |
          This moves 25 units from the centre; the semi-major axis is a = √25 = 5.
      answer: 2
    - slug: precalc-u04-w29-q02
      type: multiple_choice
      topic_code: "4.6"
      source: "AP Precalculus CED, Topic 4.6"
      points: 1
      stimulus: |
        Consider the ellipse (x + 2)²/25 + (y − 4)²/9 = 1.
      prompt: |
        Where are the foci of the ellipse?
      options:
        - "(2, 4) and (−6, 4)"
        - "(−2 + √34, 4) and (−2 − √34, 4)"
        - "(−2, 8) and (−2, 0)"
        - "(1, 4) and (−5, 4)"
      option_explanations:
        - |
          Correct. c² = a² − b² = 25 − 9 = 16, so c = 4 and the foci are (−2 ± 4, 4) on the horizontal major axis.
        - |
          This uses c² = a² + b² = 34, the hyperbola rule; for an ellipse c² = a² − b².
        - |
          c = 4 is right, but the foci lie on the major axis, which is horizontal here.
        - |
          This uses c = b = 3; c comes from c² = a² − b² = 16, so c = 4.
      answer: 0
    - slug: precalc-u04-w29-q03
      type: multiple_choice
      topic_code: "4.7"
      source: "AP Precalculus CED, Topic 4.7"
      points: 1
      stimulus: |
        Consider the ellipse (x + 2)²/25 + (y − 4)²/9 = 1.
      prompt: |
        Which parametrization traces this ellipse once for 0 ≤ t ≤ 2π?
      options:
        - "x = −2 + 25 cos t, y = 4 + 9 sin t"
        - "x = −2 + 3 cos t, y = 4 + 5 sin t"
        - "x = 2 + 5 cos t, y = −4 + 3 sin t"
        - "x = −2 + 5 cos t, y = 4 + 3 sin t"
      option_explanations:
        - |
          The coefficients must be the semi-axes a = 5 and b = 3, not their squares.
        - |
          The semi-axes are swapped; this ellipse would be 3 wide and 5 tall about the centre, a vertical major axis.
        - |
          The shifts have the wrong signs; the centre is (−2, 4).
        - |
          Correct. ((x + 2)/5)² + ((y − 4)/3)² = cos²t + sin²t = 1, and t from 0 to 2π goes round once.
      answer: 3
    # ---- Independent items
    - slug: precalc-u04-w29-q04
      type: multiple_choice
      topic_code: "4.6"
      source: "AP Precalculus CED, Topic 4.6"
      points: 1
      prompt: |
        What is the focus of the parabola x² = 8y?
      options:
        - "(0, 8)"
        - "(0, 2)"
        - "(2, 0)"
        - "(0, −2)"
      option_explanations:
        - |
          8 is 4p, not p; the focus is p = 2 units from the vertex.
        - |
          Correct. 4p = 8 gives p = 2, and the parabola opens up from the vertex (0, 0), so the focus is (0, 2).
        - |
          x² = 4py opens up or down, so the focus is on the y-axis, not the x-axis.
        - |
          y = −2 is the directrix; the focus is on the other side of the vertex, inside the parabola.
      answer: 1
    - slug: precalc-u04-w29-q05
      type: multiple_choice
      topic_code: "4.6"
      source: "AP Precalculus CED, Topic 4.6"
      points: 1
      prompt: |
        What type of conic is the graph of 4x² − 9y² − 8x − 36y − 68 = 0?
      options:
        - "Ellipse"
        - "Parabola"
        - "Hyperbola"
        - "Circle"
      option_explanations:
        - |
          An ellipse needs x² and y² coefficients of the same sign; here they are 4 and −9.
        - |
          A parabola has only one squared variable; this equation has both x² and y².
        - |
          Correct. The squared terms have opposite signs. Completing the square gives (x − 1)²/9 − (y + 2)²/4 = 1.
        - |
          A circle needs equal x² and y² coefficients with the same sign; 4 and −9 are neither.
      answer: 2
    - slug: precalc-u04-w29-q06
      type: multiple_choice
      topic_code: "4.6"
      source: "AP Precalculus CED, Topic 4.6"
      points: 1
      prompt: |
        What are the asymptotes of the hyperbola x²/16 − y²/9 = 1?
      options:
        - "y = ±(4/3)x"
        - "y = ±(9/16)x"
        - "x = ±4"
        - "y = ±(3/4)x"
      option_explanations:
        - |
          This inverts the slope; for x²/a² − y²/b² = 1 the slopes are ±b/a = ±3/4.
        - |
          This uses the squares a² and b²; the slopes use a = 4 and b = 3.
        - |
          The lines x = ±4 pass through the vertices; the asymptotes go through the centre with slopes ±b/a.
        - |
          Correct. With a = 4 and b = 3, the asymptotes are y = ±(b/a)x = ±(3/4)x, the diagonals of the 8-by-6 box.
      answer: 3
    - slug: precalc-u04-w29-q07
      type: multiple_choice
      topic_code: "4.6"
      source: "AP Precalculus CED, Topic 4.6"
      points: 1
      prompt: |
        Completing the square shows that x² + y² − 6x + 4y − 12 = 0 is a circle. What are its centre and radius?
      options:
        - "Centre (3, −2), radius 5"
        - "Centre (−3, 2), radius 5"
        - "Centre (3, −2), radius √12"
        - "Centre (3, −2), radius 25"
      option_explanations:
        - |
          Correct. (x² − 6x + 9) + (y² + 4y + 4) = 12 + 9 + 4, so (x − 3)² + (y + 2)² = 25: centre (3, −2), radius 5.
        - |
          The signs are reversed: x² − 6x completes to (x − 3)², giving h = 3, and y² + 4y to (y + 2)², giving k = −2.
        - |
          This forgets to add the 9 and 4 used to complete the squares to the right side; r² = 12 + 9 + 4 = 25.
        - |
          25 is r², the right side of the equation; the radius is √25 = 5.
      answer: 0
    - slug: precalc-u04-w29-q08
      type: multiple_choice
      topic_code: "4.7"
      source: "AP Precalculus CED, Topic 4.7"
      points: 1
      prompt: |
        Which parametrization describes the hyperbola x²/4 − y²/9 = 1?
      options:
        - "x = 2 cos t, y = 3 sin t"
        - "x = 2 sec t, y = 3 tan t"
        - "x = 2 tan t, y = 3 sec t"
        - "x = 4 sec t, y = 9 tan t"
      option_explanations:
        - |
          This gives x²/4 + y²/9 = cos²t + sin²t = 1, an ellipse, not a hyperbola.
        - |
          Correct. x²/4 − y²/9 = sec²t − tan²t = 1.
        - |
          This gives y²/9 − x²/4 = sec²t − tan²t = 1, the hyperbola that opens up and down.
        - |
          The coefficients should be a = 2 and b = 3, not a² and b².
      answer: 1
    - slug: precalc-u04-w29-q09
      type: multiple_choice
      topic_code: "4.7"
      source: "AP Precalculus CED, Topic 4.7"
      points: 1
      prompt: |
        Which parametrization traces the entire parabola y = x² − 4x?
      options:
        - "x = t, y = t² + 4t"
        - "x = t − 2, y = t² − 4"
        - "x = t², y = t⁴ − 4t²"
        - "x = t + 2, y = t² − 4"
      option_explanations:
        - |
          This gives y = x² + 4x; the sign of the linear term is wrong.
        - |
          Substituting gives y = (x + 2)² − 4 = x² + 4x, a parabola with vertex (−2, −4), not (2, −4).
        - |
          This satisfies y = x² − 4x but x = t² ≥ 0, so it misses the part of the parabola with x < 0.
        - |
          Correct. (t + 2)² − 4(t + 2) = t² + 4t + 4 − 4t − 8 = t² − 4, and x = t + 2 takes every real value.
      answer: 3
    - slug: precalc-u04-w29-q10
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Precalculus CED, Topic 4.4"
      points: 1
      prompt: |
        Which parametrization traces the circle x² + y² = 9 counterclockwise, starting at (0, 3)?
      options:
        - "x = 3 sin t, y = 3 cos t"
        - "x = 3 cos t, y = 3 sin t"
        - "x = −3 sin t, y = 3 cos t"
        - "x = 3 cos t, y = −3 sin t"
      option_explanations:
        - |
          This starts at (0, 3), but x increases at first, so the point moves right from the top: clockwise.
        - |
          This is counterclockwise but starts at (3, 0), not (0, 3).
        - |
          Correct. t = 0 gives (0, 3), and at t = π/2 the point is (−3, 0): it moved left from the top, which is counterclockwise.
        - |
          This starts at (3, 0) and moves clockwise.
      answer: 2
    - slug: precalc-u04-w29-q11
      type: multiple_choice
      topic_code: "3.11"
      source: "AP Precalculus CED, Topic 3.11"
      points: 1
      prompt: |
        What is the exact value of sec(π/3)?
      options:
        - "2"
        - "1/2"
        - "2/√3"
        - "√3"
      option_explanations:
        - |
          Correct. sec(π/3) = 1/cos(π/3) = 1/(1/2) = 2.
        - |
          1/2 is cos(π/3) itself; secant is its reciprocal.
        - |
          2/√3 is csc(π/3) = 1/sin(π/3); secant is the reciprocal of cosine.
        - |
          √3 is tan(π/3) = sin/cos, not the reciprocal of cosine.
      answer: 0
    - slug: precalc-u04-w29-q12
      type: multiple_choice
      topic_code: "1.7"
      source: "AP Precalculus CED, Topic 1.7"
      points: 1
      prompt: |
        What is the horizontal asymptote of r(x) = (6x² − 1)/(2x² + 5)?
      options:
        - "y = 0"
        - "y = 3"
        - "y = −1/5"
        - "y = 6"
      option_explanations:
        - |
          y = 0 is the asymptote when the denominator has the higher degree; here the degrees are equal.
        - |
          Correct. The degrees are equal, so the asymptote is the ratio of leading coefficients, 6/2 = 3.
        - |
          −1/5 is the ratio of the constant terms, which matters near x = 0, not as x → ±∞.
        - |
          6 is only the numerator's leading coefficient; it must be divided by the denominator's, 2.
      answer: 1
    - slug: precalc-u04-w29-q13
      type: multi_select
      topic_code: "4.6"
      source: "AP Precalculus CED, Topic 4.6"
      points: 2
      partial_credit: true
      prompt: |
        Consider the hyperbola (y − 1)²/16 − (x + 2)²/9 = 1. Which statements are true? Select all that apply.
      options:
        - "It opens up and down."
        - "Its centre is (2, −1)."
        - "Its vertices are (−2, 5) and (−2, −3)."
        - "Its asymptotes have slopes 3/4 and −3/4."
        - "Its foci are (−2, 6) and (−2, −4)."
      option_explanations:
        - |
          Correct. The y-term is the positive one, so the branches open up and down.
        - |
          (y − 1) and (x + 2) give the centre (−2, 1); the signs here are reversed.
        - |
          Correct. a² = 16 under the y-term, so a = 4 and the vertices are (−2, 1 ± 4).
        - |
          For an up–down hyperbola the slopes are ±a/b = ±4/3, not ±3/4.
        - |
          Correct. c² = a² + b² = 16 + 9 = 25, c = 5, so the foci are (−2, 1 ± 5).
      answer: [0, 2, 4]
    - slug: precalc-u04-w29-q14
      type: multi_select
      topic_code: "4.5"
      source: "AP Precalculus CED, Topic 4.5"
      points: 2
      partial_credit: true
      prompt: |
        Consider the curve defined implicitly by x² − y² = 9. Which statements are true? Select all that apply.
      options:
        - "The equation defines y as a function of x."
        - "The point (5, 4) is on the curve."
        - "There are points on the curve with −3 < x < 3."
        - "The vertical line x = 3 meets the curve at exactly one point."
        - "The curve has vertical tangent lines at (3, 0) and (−3, 0)."
      option_explanations:
        - |
          At x = 5, both y = 4 and y = −4 work, so y is not a function of x.
        - |
          Correct. Substituting gives 5² − 4² = 25 − 16 = 9.
        - |
          For |x| < 3, y² = x² − 9 would be negative, so there are no points there.
        - |
          Correct. x = 3 gives y² = 0, so the only point is (3, 0).
        - |
          Correct. The branches y = ±√(x² − 9) meet at x = ±3, where the curve turns back, so the tangents there are vertical.
      answer: [1, 3, 4]
    - slug: precalc-u04-w29-q15
      type: true_false
      topic_code: "4.7"
      source: "AP Precalculus CED, Topic 4.7"
      points: 1
      prompt: |
        True or false: The parametrization x = sec t, y = tan t, for 0 ≤ t < 2π with t ≠ π/2 and t ≠ 3π/2, traces only the right branch of the hyperbola x² − y² = 1.
      answer: false
      explanation: |
        False. For π/2 < t < 3π/2, cos t < 0, so sec t < 0 and the point is on the left branch. Only the restriction −π/2 < t < π/2 traces the right branch alone.
    - slug: precalc-u04-w29-q16
      type: true_false
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      prompt: |
        True or false: The graph of (x − 3)²/25 + (y + 1)²/9 = 1 is the graph of x²/25 + y²/9 = 1 translated 3 units to the right and 1 unit down.
      answer: true
      explanation: |
        True. Replacing x by x − 3 shifts a graph 3 units right, and replacing y by y + 1 shifts it 1 unit down. The centre moves from (0, 0) to (3, −1).
    - slug: precalc-u04-w29-q17
      type: fill_blank
      topic_code: "4.6"
      source: "AP Precalculus CED, Topic 4.6"
      points: 1
      prompt: |
        The foci of the ellipse x²/169 + y²/144 = 1 are (c, 0) and (−c, 0), where c = ____.
      answer: ["5", "5.0"]
      explanation: |
        For an ellipse c² = a² − b² = 169 − 144 = 25, so c = 5.
    - slug: precalc-u04-w29-q18
      type: fill_blank
