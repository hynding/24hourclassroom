    - slug: precalc-u04-w30-q21
      type: short_answer
      topic_code: "4.8"
      source: "AP Precalculus CED, Topic 4.8"
      points: 3
      prompt: |
        A hypothetical boat heads straight across a river 120 m wide at 8 m/s relative to the water, while the current carries it downstream at 3 m/s. Let the far bank be in the +x direction and the current in the −y direction.

        (a) Write the boat's velocity relative to the riverbank as a vector.
        (b) Find the boat's speed relative to the bank (exact and to the nearest hundredth) and the angle its path makes with the straight-across direction, to the nearest degree.
        (c) How long does the crossing take, and how far downstream does the boat land?
      answer: |
        (a) ⟨8, 0⟩ + ⟨0, −3⟩ = ⟨8, −3⟩ m/s.
        (b) √(64 + 9) = √73 ≈ 8.54 m/s. The angle below the +x direction is tan⁻¹(3/8) ≈ 21°.
        (c) Only the x-component carries the boat across: 120/8 = 15 s. In that time the current carries it 3 · 15 = 45 m downstream.
      explanation: |
        Three points, one per part. (a) the vector ⟨8, −3⟩. (b) speed √73 ≈ 8.54 m/s and an angle of about 21° (accept 20.6°). (c) 15 s and 45 m downstream.
    - slug: precalc-u04-w30-q22
      type: short_answer
      topic_code: "4.8"
      source: "AP Precalculus CED, Topic 4.8"
      points: 3
      prompt: |
        Let u = ⟨2, 5⟩ and v = ⟨10, −4⟩.

        (a) Compute u · v and state what it tells you about the angle between u and v.
        (b) Find ‖u‖ and ‖v‖ in exact simplest form, and show that ‖v‖ = 2‖u‖.
        (c) Find the unit vector in the direction of v.
      answer: |
        (a) u · v = 20 − 20 = 0, so u and v are perpendicular (the angle is π/2).
        (b) ‖u‖ = √(4 + 25) = √29; ‖v‖ = √(100 + 16) = √116 = 2√29 = 2‖u‖.
        (c) v/‖v‖ = ⟨10, −4⟩/(2√29) = ⟨5/√29, −2/√29⟩ = ⟨5√29/29, −2√29/29⟩.
      explanation: |
        Three points, one per part. (a) dot product 0 and the conclusion perpendicular. (b) both magnitudes with √116 simplified to 2√29. (c) the unit vector in any equivalent exact form.
    - slug: precalc-u04-w30-q23
      type: long_answer
      topic_code: "4.9"
      source: "AP Precalculus CED, Topic 4.9"
      points: 6
      prompt: |
        In a model, a signal flare is fired from the top of a 50 m tower. Its position in metres t seconds after firing is

        p(t) = ⟨10t, 50 + 30t − 5t²⟩, for 0 ≤ t ≤ 6.

        (A) (i) Find the flare's position at t = 0 and at t = 4.
            (ii) Find the displacement on [0, 4] and its magnitude, to the nearest tenth of a metre.
        (B) (i) Find the average velocity on [0, 4] and on [4, 6].
            (ii) Describe the flare's motion on [4, 6] using the components of the average velocity.
        (C) (i) Find the average velocity on [2, 4].
            (ii) Explain why its vertical component is 0, and what that suggests about when the flare is highest. Find that greatest height.
      answer: |
        (A)(i) p(0) = ⟨0, 50⟩; p(4) = ⟨40, 50 + 120 − 80⟩ = ⟨40, 90⟩.
        (ii) Displacement ⟨40, 40⟩, magnitude 40√2 ≈ 56.6 m.
        (B)(i) On [0, 4]: ⟨40, 40⟩/4 = ⟨10, 10⟩ m/s. p(6) = ⟨60, 50 + 180 − 180⟩ = ⟨60, 50⟩, so on [4, 6]: ⟨20, −40⟩/2 = ⟨10, −20⟩ m/s.
        (ii) On [4, 6] the flare moves right at an average of 10 m/s while falling at an average of 20 m/s; it ends at its starting height, 50 m.
        (C)(i) p(2) = ⟨20, 50 + 60 − 20⟩ = ⟨20, 90⟩ and p(4) = ⟨40, 90⟩, so the average velocity is ⟨20, 0⟩/2 = ⟨10, 0⟩ m/s.
        (ii) The flare is at the same height (90 m) at t = 2 and t = 4, so its net vertical change is 0. Because the height is a quadratic in t, it is symmetric about its vertex, which must be halfway between, at t = 3. The greatest height is 50 + 90 − 45 = 95 m.
      explanation: |
        Six points. (A) 1 point for both positions; 1 point for ⟨40, 40⟩ and 56.6 m. (B) 1 point for both average velocities; 1 point for a description using both components with units. (C) 1 point for ⟨10, 0⟩; 1 point for the symmetry argument giving t = 3 and the height 95 m.
