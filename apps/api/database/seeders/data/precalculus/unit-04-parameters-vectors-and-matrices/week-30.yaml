week: 30
unit: 4
title: "Vectors and Vector-Valued Functions"
topics: ["4.8", "4.9"]
guide: guides/week-30.md
guide_description: |
  Vectors in component form, the vector between two points, magnitude and direction angle (with quadrant
  checks), components from magnitude and direction, unit vectors, addition, subtraction and scalar
  multiplication, and the dot product with the angle between vectors and perpendicularity; then position as a
  vector-valued function, displacement and average velocity, and the difference between displacement and
  distance. Worked examples: a hypothetical plane in a crosswind, a boat crossing a river, and a point moving on
  a circle.
flashcards_description: |
  30 cards on component form, magnitude and direction, unit vectors, vector arithmetic, the dot product and
  angles, position vectors, displacement, and average velocity versus average speed.

flashcards:
  - front: Vector from P(1, 2) to Q(5, −1) → component form
    back: |
      Q − P = ⟨5 − 1, −1 − 2⟩ = ⟨4, −3⟩. Subtract the initial point from the terminal point.
    topic_code: "4.8"
  - front: Magnitude of ⟨a, b⟩ → formula
    back: |
      ‖⟨a, b⟩‖ = √(a² + b²), from the Pythagorean theorem. ‖⟨4, −3⟩‖ = 5.
    topic_code: "4.8"
  - front: Direction angle of ⟨a, b⟩ → how to find it
    back: |
      tan θ = b/a, then check the quadrant: tan⁻¹ only returns angles in (−π/2, π/2), so add π when a < 0.
    topic_code: "4.8"
  - front: ⟨−4, 3⟩ versus ⟨4, −3⟩ → direction angles
    back: |
      Same ratio b/a = −3/4 but opposite directions: ⟨4, −3⟩ has θ ≈ −0.644 (Quadrant IV); ⟨−4, 3⟩ has θ ≈ π − 0.644 ≈ 2.498 (Quadrant II).
    topic_code: "4.8"
  - front: Magnitude m and direction θ → components
    back: |
      ⟨m cos θ, m sin θ⟩. Magnitude 10 at 5π/6 gives ⟨−5√3, 5⟩.
    topic_code: "4.8"
  - front: Unit vector in the direction of v → formula
    back: |
      v/‖v‖. For ⟨−5, 12⟩, ‖v‖ = 13, so the unit vector is ⟨−5/13, 12/13⟩.
    topic_code: "4.8"
  - front: i and j → meaning
    back: |
      The standard unit vectors i = ⟨1, 0⟩ and j = ⟨0, 1⟩. ⟨4, −3⟩ = 4i − 3j.
    topic_code: "4.8"
  - front: Vector addition → by components and by picture
    back: |
      Add matching components. Geometrically, place the second vector's tail at the first vector's tip; the sum runs from the first tail to the last tip (the parallelogram diagonal).
    topic_code: "4.8"
  - front: Scalar multiple kv → effect
    back: |
      Multiplies the magnitude by |k|; reverses the direction if k < 0. −2⟨3, −4⟩ = ⟨−6, 8⟩, twice as long and opposite.
    topic_code: "4.8"
  - front: u = ⟨3, −4⟩, v = ⟨−2, 6⟩ → 2u − v
    back: |
      ⟨6, −8⟩ − ⟨−2, 6⟩ = ⟨8, −14⟩, magnitude √260 = 2√65.
    topic_code: "4.8"
  - front: Hypothetical plane heading north at 300 km/h, wind toward the east at 40 km/h → ground speed
    back: |
      ⟨40, 300⟩, so √(40² + 300²) = √91,600 ≈ 302.7 km/h, about 7.6° east of north.
    topic_code: "4.8"
  - front: Boat at 8 m/s straight across a 120 m river, current 3 m/s → time and drift
    back: |
      Velocity ⟨8, −3⟩. Crossing time 120/8 = 15 s; drift 3 · 15 = 45 m downstream; speed √73 ≈ 8.54 m/s.
    topic_code: "4.8"
  - front: Dot product ⟨a₁, b₁⟩ · ⟨a₂, b₂⟩ → formula
    back: |
      a₁a₂ + b₁b₂, a number. ⟨3, −4⟩ · ⟨−2, 6⟩ = −6 − 24 = −30.
    topic_code: "4.8"
  - front: Angle between two vectors → formula
    back: |
      cos θ = (u · v)/(‖u‖ ‖v‖), with 0 ≤ θ ≤ π. For ⟨1, 2⟩ and ⟨3, 1⟩: 5/(√5 · √10) = 1/√2, so θ = π/4.
    topic_code: "4.8"
  - front: Perpendicular vectors → dot product test
    back: |
      u · v = 0. ⟨4, k⟩ ⊥ ⟨6, −3⟩ when 24 − 3k = 0, so k = 8.
    topic_code: "4.8"
  - front: Sign of u · v → what it says about the angle
    back: |
      Positive: acute. Zero: right angle. Negative: obtuse. The sign is the sign of cos θ.
    topic_code: "4.8"
  - front: u · u → equals
    back: |
      ‖u‖², because the angle between u and itself is 0 and cos 0 = 1. ⟨3, −4⟩ · ⟨3, −4⟩ = 25 = 5².
    topic_code: "4.8"
  - front: Vector-valued function → meaning
    back: |
      A function whose output is a vector, such as the position p(t) = ⟨x(t), y(t)⟩. It packages a parametric function into one object.
    topic_code: "4.9"
  - front: Displacement on [a, b] → definition
    back: |
      p(b) − p(a), the vector from where the object started to where it ended up.
    topic_code: "4.9"
  - front: Average velocity on [a, b] → formula
    back: |
      (p(b) − p(a))/(b − a) = ⟨Δx/Δt, Δy/Δt⟩, the two average rates of change from parametric motion as one vector.
    topic_code: "4.9"
  - front: p(t) = ⟨t², 3t − 1⟩ from t = 1 to t = 3 → displacement and average velocity
    back: |
      ⟨9, 8⟩ − ⟨1, 2⟩ = ⟨8, 6⟩ over 2 seconds, so the average velocity is ⟨4, 3⟩ (magnitude 5).
    topic_code: "4.9"
  - front: p(t) = ⟨2 + 3t, 1 − 4t⟩ → velocity and speed
    back: |
      Constant velocity ⟨3, −4⟩ on every interval, speed 5. The path is a straight line through (2, 1).
    topic_code: "4.9"
  - front: p(t) = ⟨3 cos(πt/2), 3 sin(πt/2)⟩ on [0, 2] → displacement and distance
    back: |
      Displacement ⟨−3, 0⟩ − ⟨3, 0⟩ = ⟨−6, 0⟩; distance travelled is half the circumference, 3π ≈ 9.42.
    topic_code: "4.9"
  - front: Displacement versus distance travelled → difference
    back: |
      Displacement is the net change in position (a vector); distance is the total length of the path. One lap of a track: displacement ⟨0, 0⟩, distance = circumference.
    topic_code: "4.9"
  - front: Magnitude of average velocity versus average speed → comparison
    back: |
      ‖average velocity‖ ≤ average speed, with equality only for straight-line motion that never turns back.
    topic_code: "4.9"
  - front: Ball p(t) = ⟨40t, 6 + 48t − 16t²⟩ on [1, 2] → average velocity
    back: |
      ⟨80, 38⟩ − ⟨40, 38⟩ = ⟨40, 0⟩: horizontal, because the ball rose and fell back to the same height.
    topic_code: "4.9"
  - front: Average velocity over shorter intervals → what it approaches
    back: |
      The instantaneous velocity at that moment, whose components are the rates of change of x and y. Calculus makes this exact.
    topic_code: "4.9"
  - front: Error-spot → "‖⟨3, −4⟩ + ⟨−2, 6⟩‖ = 5 + √40"
    back: |
      Magnitudes do not add. Add components first: ⟨1, 2⟩, magnitude √5 ≈ 2.24, far less than 5 + √40 ≈ 11.3.
    topic_code: "4.8"
  - front: Error-spot → "⟨3, −4⟩ · ⟨−2, 6⟩ = ⟨−6, −24⟩"
    back: |
      The dot product is a number: add the products, −6 + (−24) = −30.
    topic_code: "4.8"
  - front: Error-spot → "one lap at 5 m/s average speed means average velocity 5 m/s"
    back: |
      After a full lap the displacement is zero, so the average velocity is ⟨0, 0⟩. Speed counts the path; velocity counts only the net change.
    topic_code: "4.9"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 4.8 and 4.9: component form, magnitude and
    direction, vector arithmetic, the dot product and angles, position vectors, displacement and average
    velocity), with about a third reviewing weeks 28–29 and Units 2 and 3 (conics and their parametrizations,
    parametric circles, complex numbers in polar form, identities, logarithms, sinusoids). Opens with a
    shared-context set on two vectors. Multiple choice, select-all, true/false and numeric items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes. A calculator is needed only for the item marked (Calculator.) and
    for decimal approximations in the short answers.
  questions:
    # ---- Stimulus set: two vectors (4.8)
    - slug: precalc-u04-w30-q01
      type: multiple_choice
      topic_code: "4.8"
      source: "AP Precalculus CED, Topic 4.8"
      points: 1
      stimulus: |
        Let u = ⟨3, −4⟩ and v = ⟨−2, 6⟩.
      prompt: |
        What is the magnitude of u?
      options:
        - "−1"
        - "7"
        - "25"
        - "5"
      option_explanations:
        - |
          This adds the components, 3 + (−4); a magnitude is a length and is never negative.
        - |
          This adds the absolute values 3 + 4; the magnitude uses the Pythagorean theorem.
        - |
          25 is 3² + (−4)², the square of the magnitude; take the square root.
        - |
          Correct. By the Pythagorean theorem, ‖u‖ = √(3² + (−4)²) = √25 = 5.
      answer: 3
    - slug: precalc-u04-w30-q02
      type: multiple_choice
      topic_code: "4.8"
      source: "AP Precalculus CED, Topic 4.8"
      points: 1
      stimulus: |
        Let u = ⟨3, −4⟩ and v = ⟨−2, 6⟩.
      prompt: |
        What is 2u − v?
      options:
        - "⟨4, −2⟩"
        - "⟨8, −14⟩"
        - "⟨5, −10⟩"
        - "⟨−8, 14⟩"
      option_explanations:
        - |
          This is 2u + v: ⟨6 + (−2), −8 + 6⟩. Subtracting v changes the sign of each of its components.
        - |
          Correct. 2u = ⟨6, −8⟩, and ⟨6, −8⟩ − ⟨−2, 6⟩ = ⟨6 + 2, −8 − 6⟩ = ⟨8, −14⟩.
        - |
          This is u − v; the scalar 2 must multiply u before subtracting.
        - |
          This is v − 2u, the opposite vector; the order of subtraction matters.
      answer: 1
    - slug: precalc-u04-w30-q03
      type: multiple_choice
      topic_code: "4.8"
      source: "AP Precalculus CED, Topic 4.8"
      points: 1
      stimulus: |
        Let u = ⟨3, −4⟩ and v = ⟨−2, 6⟩.
      prompt: |
        What is the dot product u · v?
      options:
        - "−30"
        - "⟨−6, −24⟩"
        - "18"
        - "‖u‖‖v‖ = 5√40 ≈ 31.6"
      option_explanations:
        - |
          Correct. u · v = (3)(−2) + (−4)(6) = −6 − 24 = −30. It is negative, so the angle between u and v is obtuse.
        - |
          These are the products of matching components, but the dot product adds them into a single number.
        - |
          This treats (−4)(6) as +24; the product of a negative and a positive is negative.
        - |
          ‖u‖‖v‖ is only part of u · v = ‖u‖‖v‖ cos θ; the cosine of the angle is missing.
      answer: 0
    # ---- Independent items
    - slug: precalc-u04-w30-q04
      type: multiple_choice
      topic_code: "4.8"
      source: "AP Precalculus CED, Topic 4.8"
      points: 1
      prompt: |
        What is the angle between the vectors ⟨1, 2⟩ and ⟨3, 1⟩?
      options:
        - "π/6"
        - "π/3"
        - "π/4"
        - "1/√2"
      option_explanations:
        - |
          cos(π/6) = √3/2 ≈ 0.866, but the cosine of the angle here is 5/√50 ≈ 0.707.
        - |
          cos(π/3) = 1/2, but cos θ = 5/(√5 · √10) = 1/√2 here.
        - |
          Correct. The dot product is 3 + 2 = 5 and the magnitudes are √5 and √10, so cos θ = 5/√50 = 1/√2 and θ = π/4.
        - |
          1/√2 is cos θ, not the angle; the angle whose cosine is 1/√2 is π/4.
      answer: 2
    - slug: precalc-u04-w30-q05
      type: multiple_choice
      topic_code: "4.8"
      source: "AP Precalculus CED, Topic 4.8"
      points: 1
      prompt: |
        A vector has magnitude 10 and direction angle 5π/6. What is its component form?
      options:
        - "⟨−5√3, 5⟩"
        - "⟨5, −5√3⟩"
        - "⟨5√3, 5⟩"
        - "⟨−5, 5√3⟩"
      option_explanations:
        - |
          Correct. ⟨10 cos(5π/6), 10 sin(5π/6)⟩ = ⟨10(−√3/2), 10(1/2)⟩ = ⟨−5√3, 5⟩, in Quadrant II.
        - |
          The x-component is m cos θ and the y-component m sin θ; this swaps them and the signs.
        - |
          cos(5π/6) is negative, because 5π/6 is in Quadrant II, so the x-component is −5√3.
        - |
          These are the components for 2π/3, whose reference angle is π/3, not π/6.
      answer: 0
    - slug: precalc-u04-w30-q06
      type: multiple_choice
      topic_code: "4.8"
      source: "AP Precalculus CED, Topic 4.8"
      points: 1
      prompt: |
        What is the unit vector in the direction of ⟨−5, 12⟩?
      options:
        - "⟨−5/17, 12/17⟩"
        - "⟨5/13, −12/13⟩"
        - "⟨−5/169, 12/169⟩"
        - "⟨−5/13, 12/13⟩"
      option_explanations:
        - |
          This divides by |−5| + 12 = 17; the magnitude is √(25 + 144) = 13.
        - |
          This has magnitude 1 but points in the opposite direction.
        - |
          This divides by ‖v‖² = 169 instead of ‖v‖ = 13, so its length is 1/13, not 1.
        - |
          Correct. ‖⟨−5, 12⟩‖ = 13, and dividing each component by 13 gives a vector of length 1 in the same direction.
      answer: 3
    - slug: precalc-u04-w30-q07
      type: multiple_choice
      topic_code: "4.8"
      source: "AP Precalculus CED, Topic 4.8"
      points: 1
      prompt: |
        For what value of k is ⟨4, k⟩ perpendicular to ⟨6, −3⟩?
      options:
        - "−8"
        - "8"
        - "−2"
        - "2"
      option_explanations:
        - |
          This solves 24 + 3k = 0; the dot product is 24 − 3k because k is multiplied by −3.
        - |
          Correct. Perpendicular means the dot product is 0: (4)(6) + (k)(−3) = 24 − 3k = 0, so k = 8.
        - |
          k = −2 makes ⟨4, −2⟩ parallel to ⟨6, −3⟩ (same slope −1/2), not perpendicular.
        - |
          This sets 4/k = 2, inverting the slope of ⟨4, k⟩; its slope is k/4, which must be 2.
      answer: 1
    - slug: precalc-u04-w30-q08
      type: multiple_choice
      topic_code: "4.9"
      source: "AP Precalculus CED, Topic 4.9"
      points: 1
      prompt: |
        An object's position is p(t) = ⟨t², 3t − 1⟩. What is its displacement from t = 1 to t = 3?
      options:
        - "⟨9, 8⟩"
        - "⟨4, 3⟩"
        - "⟨8, 6⟩"
        - "⟨10, 10⟩"
      option_explanations:
        - |
          ⟨9, 8⟩ is the position p(3), not the change in position from t = 1.
        - |
          ⟨4, 3⟩ is the average velocity (displacement divided by 2 seconds), not the displacement itself.
        - |
          Correct. p(3) − p(1) = ⟨9, 8⟩ − ⟨1, 2⟩ = ⟨8, 6⟩.
        - |
          This adds p(3) and p(1); displacement subtracts the starting position from the ending one.
      answer: 2
    - slug: precalc-u04-w30-q09
      type: multiple_choice
      topic_code: "4.9"
      source: "AP Precalculus CED, Topic 4.9"
      points: 1
      prompt: |
        An object's position is p(t) = ⟨4t − 1, t³⟩. What is its average velocity on the interval [0, 2]?
      options:
        - "⟨4, 4⟩"
        - "⟨8, 8⟩"
        - "⟨7, 8⟩"
        - "4√2"
      option_explanations:
        - |
          Correct. p(2) − p(0) = ⟨7, 8⟩ − ⟨−1, 0⟩ = ⟨8, 8⟩, and dividing by 2 gives ⟨4, 4⟩.
        - |
          ⟨8, 8⟩ is the displacement; average velocity divides it by the elapsed time, 2.
        - |
          ⟨7, 8⟩ is the position at t = 2, not a change divided by time.
        - |
          4√2 is the magnitude of the average velocity; the average velocity itself is a vector.
      answer: 0
    - slug: precalc-u04-w30-q10
      type: multiple_choice
      topic_code: "4.6"
      source: "AP Precalculus CED, Topic 4.6"
      points: 1
      prompt: |
        Where are the vertices (endpoints of the major axis) of the ellipse 9x² + 4y² = 36?
      options:
        - "(±3, 0)"
        - "(±2, 0)"
        - "(0, ±9)"
        - "(0, ±3)"
      option_explanations:
        - |
          Dividing by 36 gives x²/4 + y²/9 = 1; the 9 is under y, so the major axis is vertical, not horizontal.
        - |
          (±2, 0) are the co-vertices, the endpoints of the shorter axis.
        - |
          9 is a² under y; the semi-major axis is a = 3.
        - |
          Correct. x²/4 + y²/9 = 1 has its larger denominator under y, so a = 3 and the vertices are (0, ±3).
      answer: 3
    - slug: precalc-u04-w30-q11
      type: multiple_choice
      topic_code: "3.13"
      source: "AP Precalculus CED, Topic 3.13"
      points: 1
      prompt: |
        Which is the polar form of the complex number −1 + i√3?
      options:
        - "2(cos(π/3) + i sin(π/3))"
        - "2(cos(2π/3) + i sin(2π/3))"
        - "4(cos(2π/3) + i sin(2π/3))"
        - "2(cos(−π/3) + i sin(−π/3))"
      option_explanations:
        - |
          This is 1 + i√3 in Quadrant I; −1 + i√3 has a negative real part, so it is in Quadrant II.
        - |
          Correct. r = √(1 + 3) = 2, and the point (−1, √3) is in Quadrant II with reference angle π/3, so θ = 2π/3.
        - |
          4 is r² = (−1)² + (√3)²; the modulus is r = √4 = 2.
        - |
          tan⁻¹(√3/(−1)) = −π/3 points into Quadrant IV; the angle must be corrected by π to 2π/3.
      answer: 1
    - slug: precalc-u04-w30-q12
      type: multi_select
      topic_code: "4.9"
      source: "AP Precalculus CED, Topic 4.9"
      points: 2
      partial_credit: true
      prompt: |
        A point's position in metres after t seconds is p(t) = ⟨3 cos(πt/2), 3 sin(πt/2)⟩. Which statements are true? Select all that apply.
      options:
        - "The displacement from t = 0 to t = 2 is ⟨−6, 0⟩."
        - "The average velocity on [0, 2] is ⟨−3, 0⟩ metres per second."
        - "The distance travelled from t = 0 to t = 2 is 6 metres."
        - "The displacement from t = 0 to t = 4 is the zero vector."
        - "‖p(t)‖ = 3 for every t."
      option_explanations:
        - |
          Correct. p(0) = ⟨3, 0⟩ and p(2) = ⟨3 cos π, 3 sin π⟩ = ⟨−3, 0⟩, so the displacement is ⟨−6, 0⟩.
        - |
          Correct. ⟨−6, 0⟩ divided by 2 seconds is ⟨−3, 0⟩ m/s.
        - |
          6 m is the straight-line distance; the point travels along a half circle of radius 3, a distance of 3π ≈ 9.42 m.
        - |
          Correct. The period is 2π/(π/2) = 4, so at t = 4 the point is back at ⟨3, 0⟩.
        - |
          Correct. ‖p(t)‖ = √(9cos² + 9sin²) = 3, since the point stays on the circle of radius 3.
      answer: [0, 1, 3, 4]
    - slug: precalc-u04-w30-q13
      type: multi_select
      topic_code: "4.7"
      source: "AP Precalculus CED, Topic 4.7"
      points: 2
      partial_credit: true
      prompt: |
        Which parametrizations trace the entire ellipse x²/9 + y² = 1? Select all that apply.
      options:
        - "x = 3 cos t, y = sin t, 0 ≤ t ≤ 2π"
        - "x = 3 sin t, y = cos t, 0 ≤ t ≤ 2π"
        - "x = 9 cos t, y = sin t, 0 ≤ t ≤ 2π"
        - "x = 3 cos t, y = sin t, 0 ≤ t ≤ π"
        - "x = cos t, y = 3 sin t, 0 ≤ t ≤ 2π"
      option_explanations:
        - |
          Correct. x²/9 + y² = cos²t + sin²t = 1, and a full turn of t traces the whole curve counterclockwise.
        - |
          Correct. x²/9 + y² = sin²t + cos²t = 1; this starts at the top and goes clockwise, but still traces the whole ellipse.
        - |
          This gives x²/81 + y² = 1, an ellipse twice as wide; the coefficient must be a = 3.
        - |
          This satisfies the equation, but t from 0 to π traces only the upper half.
        - |
          This gives x² + y²/9 = 1, an ellipse that is tall rather than wide.
      answer: [0, 1]
    - slug: precalc-u04-w30-q14
      type: true_false
      topic_code: "4.9"
      source: "AP Precalculus CED, Topic 4.9"
      points: 1
      prompt: |
        True or false: For any motion, the magnitude of the average velocity over an interval equals the average speed over that interval.
      answer: false
      explanation: |
        False. Average velocity uses the displacement; average speed uses the distance travelled. On one lap of a circular track the displacement is zero, so the average velocity is ⟨0, 0⟩, while the average speed is positive. They agree only for straight-line motion without turning back.
    - slug: precalc-u04-w30-q15
      type: true_false
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      prompt: |
        True or false: cos(2θ) = 1 − 2sin²θ for every real number θ.
      answer: true
      explanation: |
        True. cos(2θ) = cos²θ − sin²θ, and replacing cos²θ by 1 − sin²θ (Pythagorean identity) gives 1 − 2sin²θ.
    - slug: precalc-u04-w30-q16
      type: fill_blank
      topic_code: "4.8"
      source: "AP Precalculus CED, Topic 4.8"
      points: 1
      prompt: |
        The magnitude of the vector ⟨−7, 24⟩ is ____.
      answer: ["25"]
      explanation: |
        √((−7)² + 24²) = √(49 + 576) = √625 = 25.
    - slug: precalc-u04-w30-q17
      type: fill_blank
      topic_code: "4.4"
      source: "AP Precalculus CED, Topic 4.4"
      points: 1
      prompt: |
        The parametric function x = 5 + 2 cos t, y = −3 + 2 sin t traces a circle with radius ____.
      answer: ["2"]
      explanation: |
        The coefficient of cos t and sin t is the radius: (x − 5)² + (y + 3)² = 4cos²t + 4sin²t = 4 = 2².
