    - slug: precalc-u04-w28-q21
      type: short_answer
      topic_code: "4.4"
      source: "AP Precalculus CED, Topic 4.4"
      points: 3
      prompt: |
        In a hypothetical model, a Ferris wheel has radius 20 m, its centre is 22 m above the ground, and it turns once every 4 minutes. A rider boards at the bottom and first moves to the right. Place the centre at x = 0, with y measured from the ground.

        (a) Write parametric equations x(t), y(t) for the rider's position t minutes after boarding.
        (b) Find the rider's position at t = 1 and at t = 3, and say where on the wheel each is.
        (c) Find the two times in the first revolution when the rider is 32 m above the ground.
      answer: |
        (a) x(t) = 20 sin(πt/2), y(t) = 22 − 20 cos(πt/2). (Start (0, 2); b = 2π/4 = π/2; moving right from the bottom is counterclockwise.)
        (b) t = 1: (20 sin(π/2), 22 − 20 cos(π/2)) = (20, 22), the right end of the horizontal diameter. t = 3: (20 sin(3π/2), 22 − 20 cos(3π/2)) = (−20, 22), the left end.
        (c) 22 − 20 cos(πt/2) = 32 gives cos(πt/2) = −1/2, so πt/2 = 2π/3 or 4π/3, giving t = 4/3 and t = 8/3 minutes.
      explanation: |
        Three points, one per part. (a) both equations with the correct start and direction (accept any equivalent form that starts at (0, 2) and moves right). (b) both positions with descriptions. (c) both times, 4/3 and 8/3 minutes.
    - slug: precalc-u04-w28-q22
      type: short_answer
      topic_code: "4.5"
      source: "AP Precalculus CED, Topic 4.5"
      points: 3
      prompt: |
        Consider the curve defined implicitly by x² + xy + y² = 7.

        (a) Show that the point (2, 1) lies on the curve.
        (b) Find every point on the curve with x = 2.
        (c) Treat the equation as a quadratic in y. Find the x-values at which a vertical line meets the curve at exactly one point, and explain what this says about the tangent lines there.
      answer: |
        (a) 2² + (2)(1) + 1² = 4 + 2 + 1 = 7, so (2, 1) is on the curve.
        (b) 4 + 2y + y² = 7 gives y² + 2y − 3 = (y + 3)(y − 1) = 0, so y = 1 or y = −3: the points (2, 1) and (2, −3).
        (c) y² + xy + (x² − 7) = 0 has discriminant x² − 4(x² − 7) = 28 − 3x². Exactly one y when 28 − 3x² = 0, so x = ±√(28/3) = ±2√21/3 ≈ ±3.06. For larger |x| there are no points, so these are the left and right edges of the curve, where the two branches meet; the tangent lines there are vertical.
      explanation: |
        Three points, one per part. (a) the substitution giving 7. (b) both points. (c) the discriminant 28 − 3x², the values x = ±√(28/3), and the conclusion that the tangents are vertical where the branches meet.
    - slug: precalc-u04-w28-q23
      type: long_answer
      topic_code: "4.4"
      source: "AP Precalculus CED, Topics 4.4 and 4.5"
      points: 6
      prompt: |
        In a hypothetical model, a cyclist rides around a circular track centred at the origin. Her position in metres t seconds after she passes the point (50, 0) is

        x(t) = 50 cos(πt/30), y(t) = 50 sin(πt/30).

        (A) (i) How many seconds does one lap take?
            (ii) Find her exact position at t = 10.
        (B) A straight service path runs across the track from (50, 0) to (−30, 40).
            (i) Write a parametrization of the path for 0 ≤ s ≤ 1, starting at (50, 0).
            (ii) Show that (−30, 40) is on the track, and find the midpoint of the service path.
        (C) (i) Write an equation in x and y, not involving t, for the track.
            (ii) Find both points of the track with x = 30. Explain why the track is not the graph of a function of x, and state which of the two points the cyclist reaches first after t = 0.
      answer: |
        (A)(i) Period 2π/(π/30) = 60 seconds.
        (ii) At t = 10 the angle is π/3: (50 cos(π/3), 50 sin(π/3)) = (25, 25√3).
        (B)(i) Changes −80 and 40: x(s) = 50 − 80s, y(s) = 40s, 0 ≤ s ≤ 1.
        (ii) (−30)² + 40² = 900 + 1600 = 2500 = 50², so the point is on the track. Midpoint at s = 1/2: (10, 20).
        (C)(i) x² + y² = 2500.
        (ii) 900 + y² = 2500 gives y² = 1600, y = ±40: the points (30, 40) and (30, −40). One x-value gives two y-values, so the track fails the vertical line test. She rides counterclockwise from (50, 0) (y becomes positive first), so she reaches (30, 40), in Quadrant I, before (30, −40).
      explanation: |
        Six points. (A) 1 point for 60 seconds; 1 point for (25, 25√3). (B) 1 point for a correct segment parametrization; 1 point for verifying (−30, 40) and the midpoint (10, 20). (C) 1 point for x² + y² = 2500; 1 point for both points, the vertical-line reason and (30, 40) first with a reason based on direction.
