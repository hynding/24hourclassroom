    - slug: precalc-u04-w27-q21
      type: short_answer
      topic_code: "4.1"
      source: "AP Precalculus CED, Topic 4.1"
      points: 3
      prompt: |
        A path is given by x(t) = 2t − 1, y(t) = t² − t for −1 ≤ t ≤ 2.

        (a) Complete a table of t, x and y for t = −1, 0, 1, 2.
        (b) Eliminate the parameter to write y as a function of x, simplified.
        (c) State the interval of x-values on the path and the direction in which it is traced as t increases.
      answer: |
        (a) t = −1: (−3, 2); t = 0: (−1, 0); t = 1: (1, 0); t = 2: (3, 2).
        (b) t = (x + 1)/2, so y = ((x + 1)/2)² − (x + 1)/2 = (x² + 2x + 1)/4 − (2x + 2)/4 = (x² − 1)/4.
        (c) x runs from −3 to 3, so −3 ≤ x ≤ 3. Since x = 2t − 1 increases with t, the path (part of the upward parabola y = (x² − 1)/4) is traced from left to right, from (−3, 2) to (3, 2).
      explanation: |
        Three points, one per part. (a) all four points correct. (b) a correct substitution and the simplified y = (x² − 1)/4 (accept unsimplified but correct). (c) the interval −3 ≤ x ≤ 3 and left to right with a reason.
    - slug: precalc-u04-w27-q22
      type: short_answer
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 3
      prompt: |
        The polar curve r = 2 cos θ can be written as a parametric function with θ as the parameter.

        (a) Write x(θ) and y(θ).
        (b) Find the rectangular points for θ = 0, θ = π/4 and θ = π/2.
        (c) Use x² + y² = r² and x = r cos θ to write a rectangular equation for the curve, and identify it.
      answer: |
        (a) x(θ) = r cos θ = 2cos²θ, y(θ) = r sin θ = 2 cos θ sin θ.
        (b) θ = 0: (2, 0). θ = π/4: x = 2(1/2) = 1, y = 2(√2/2)(√2/2) = 1, so (1, 1). θ = π/2: (0, 0).
        (c) Multiply r = 2 cos θ by r: r² = 2r cos θ, so x² + y² = 2x. Completing the square, (x − 1)² + y² = 1: the circle with centre (1, 0) and radius 1.
      explanation: |
        Three points, one per part. (a) both component functions. (b) all three points. (c) the equation x² + y² = 2x or (x − 1)² + y² = 1 with centre and radius identified.
    - slug: precalc-u04-w27-q23
      type: long_answer
      topic_code: "4.2"
      source: "AP Precalculus CED, Topics 4.2 and 4.3"
      points: 6
      prompt: |
        In a hypothetical model, a soccer ball is kicked from the ground. Its horizontal and vertical positions, in feet, t seconds after the kick are

        x(t) = 36t and y(t) = 48t − 16t², for 0 ≤ t ≤ 3.

        (A) (i) Find the time at which the ball is highest and its height then.
            (ii) Find the time at which the ball lands and its horizontal distance from the kick at that time.
        (B) (i) Find the average rate of change of y with respect to t on [0, 1] and on [2, 3], with units.
            (ii) Interpret the signs of your two answers in the context of the ball's motion.
        (C) (i) Find the slope of the path of the ball between t = 0 and t = 1.
            (ii) A wall 8 feet tall stands 99 feet from the kick, in the ball's path. Does the ball pass over the wall? Justify your answer.
      answer: |
        (A)(i) y(t) = −16t² + 48t has its vertex at t = −48/(2 · (−16)) = 1.5 s, and y(1.5) = 72 − 36 = 36 feet.
        (ii) y(t) = 16t(3 − t) = 0 at t = 0 and t = 3; the ball lands at t = 3 s, when x(3) = 108 feet.
        (B)(i) y(0) = 0, y(1) = 32, y(2) = 32, y(3) = 0. On [0, 1]: (32 − 0)/1 = 32 ft/s. On [2, 3]: (0 − 32)/1 = −32 ft/s.
        (ii) Positive on [0, 1]: the ball is rising, gaining 32 feet of height per second on average. Negative on [2, 3]: the ball is falling, losing 32 feet per second on average.
        (C)(i) Δx = 36 and Δy = 32 on [0, 1], so the slope is 32/36 = 8/9.
        (ii) The ball reaches x = 99 when 36t = 99, t = 2.75 s. Then y(2.75) = 48(2.75) − 16(2.75)² = 132 − 121 = 11 feet. Since 11 > 8, the ball passes over the wall (by 3 feet).
      explanation: |
        Six points. (A) 1 point for t = 1.5 s and 36 ft; 1 point for t = 3 s and 108 ft. (B) 1 point for 32 ft/s and −32 ft/s with units; 1 point for interpreting rising versus falling in context. (C) 1 point for the slope 8/9; 1 point for finding t = 2.75 and y = 11 ft and concluding the ball clears the 8-foot wall.
