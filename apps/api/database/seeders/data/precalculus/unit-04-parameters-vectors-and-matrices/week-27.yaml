      points: 1
      prompt: |
        (Calculator.) In a model, a softball is hit from a height of 3 feet, and its position in feet after t seconds is x(t) = 30t, y(t) = 3 + 40t − 16t². How far does the ball travel horizontally before it hits the ground? Give your answer to the nearest tenth of a foot.
      answer: { value: 77.2, tolerance: 0.06 }
      explanation: |
        Solve 3 + 40t − 16t² = 0, i.e. 16t² − 40t − 3 = 0. The positive root is t = (40 + √(1600 + 192))/32 = (40 + √1792)/32 ≈ 2.5729 s. Then x ≈ 30 · 2.5729 ≈ 77.2 feet.
    - slug: precalc-u04-w27-q20
