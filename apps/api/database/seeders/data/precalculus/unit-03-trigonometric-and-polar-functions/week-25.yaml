week: 25
unit: 3
title: "Polar Coordinates and Polar Graphs"
topics: ["3.13", "3.14"]
guide: guides/week-25.md
guide_description: |
  Polar coordinates (r, θ), including negative r and the many names of one point; converting points and simple
  equations between polar and rectangular form; complex numbers in the form r(cos θ + i sin θ) and why their
  angles add when they multiply; and polar graphs: circles, roses and limaçons (including cardioids), with the
  graph of r against θ on rectangular axes as a guide to where the curve meets the pole and where r is negative.
  Worked examples include (−3, 3) to polar, r = 6 cos θ to a circle, 1 + i√3 in polar form, a table for
  r = 2 + 2 cos θ, and a quarter-by-quarter trace of r = 2 cos(2θ).
flashcards_description: |
  30 cards on plotting and converting polar points and equations, complex numbers in polar form, the families
  of polar curves, petal and loop rules, and reading a θ–r graph.

flashcards:
  - front: Polar point (r, θ) → how to plot it
    back: |
      Face the direction θ, measured anticlockwise from the positive x-axis, and move a directed distance r along that ray (backwards if r is negative).
    topic_code: "3.13"
  - front: Polar point with negative r, (−r, θ) → equivalent point
    back: |
      (−r, θ) is the same point as (r, θ + π): the same distance, in the opposite direction. (−3, 2π/3) lies in direction 5π/3.
    topic_code: "3.13"
  - front: Other polar names for (2, π/6) → examples
    back: |
      (2, 13π/6), (2, −11π/6), (−2, 7π/6): add 2πn to the angle, or negate r and add π.
    topic_code: "3.13"
  - front: Polar to rectangular → formulas
    back: |
      x = r cos θ and y = r sin θ. These are week 18's definitions of sine and cosine on a circle of radius r.
    topic_code: "3.13"
  - front: Rectangular to polar → formulas and the catch
    back: |
      r² = x² + y² and tan θ = y/x. The catch: tan⁻¹(y/x) only returns angles in (−π/2, π/2), so check the quadrant of (x, y).
    topic_code: "3.13"
  - front: (4, 2π/3) in rectangular coordinates → point
    back: |
      x = 4 cos(2π/3) = −2, y = 4 sin(2π/3) = 2√3. The point is (−2, 2√3).
    topic_code: "3.13"
  - front: (−3, 3) in polar coordinates, r > 0 → point
    back: |
      r = 3√2. tan θ = −1 and the point is in quadrant II, so θ = 3π/4 (not tan⁻¹(−1) = −π/4). Answer (3√2, 3π/4).
    topic_code: "3.13"
  - front: (2, −2√3) in polar coordinates, r > 0, 0 ≤ θ < 2π → point
    back: |
      r = 4 and the point is in quadrant IV with tan θ = −√3, so θ = 5π/3. Answer (4, 5π/3).
    topic_code: "3.13"
  - front: r = 6 cos θ in rectangular form → equation and graph
    back: |
      r² = 6r cos θ gives x² + y² = 6x, or (x − 3)² + y² = 9: a circle of radius 3 centred at (3, 0), through the pole.
    topic_code: "3.13"
  - front: The line x = 5 in polar form → equation
    back: |
      r cos θ = 5, so r = 5 sec θ.
    topic_code: "3.13"
  - front: The line y = x in polar form → equation
    back: |
      r sin θ = r cos θ gives tan θ = 1, so θ = π/4 (negative r covers the other half of the line).
    topic_code: "3.13"
  - front: Complex number a + bi in polar form → formula
    back: |
      a + bi = r(cos θ + i sin θ), where r = √(a² + b²) is the modulus and θ is an argument with a = r cos θ, b = r sin θ.
    topic_code: "3.13"
  - front: 1 + i√3 in polar form → result
    back: |
      r = √(1 + 3) = 2 and θ = π/3 (quadrant I, tan θ = √3): 2(cos(π/3) + i sin(π/3)).
    topic_code: "3.13"
  - front: −2 − 2i in polar form → result
    back: |
      r = 2√2 and θ = 5π/4 (quadrant III, tan θ = 1): 2√2(cos(5π/4) + i sin(5π/4)).
    topic_code: "3.13"
  - front: 4(cos(5π/6) + i sin(5π/6)) as a + bi → result
    back: |
      a = 4(−√3/2) = −2√3 and b = 4(1/2) = 2, so −2√3 + 2i.
    topic_code: "3.13"
  - front: Multiplying complex numbers in polar form → rule
    back: |
      Multiply the moduli and add the arguments: r₁(cos α + i sin α) · r₂(cos β + i sin β) = r₁r₂(cos(α + β) + i sin(α + β)), by the sum identities.
    topic_code: "3.13"
  - front: Table for r = 2 + 2 cos θ → key values
    back: |
      θ = 0: 4; π/2: 2; π: 0; 3π/2: 2. A cardioid with its cusp at the pole, symmetric about the x-axis.
    topic_code: "3.14"
  - front: r = a cos θ and r = a sin θ → shapes
    back: |
      Circles through the pole with diameter |a|: r = a cos θ has centre (a/2, 0) on the x-axis; r = a sin θ has centre (0, a/2) on the y-axis.
    topic_code: "3.14"
  - front: r = a (constant) → shape
    back: |
      A circle of radius |a| centred at the pole. (θ = constant is a line through the pole.)
    topic_code: "3.14"
  - front: Rose r = a cos(nθ) → number and length of petals
    back: |
      Petal length |a|. n petals if n is odd; 2n petals if n is even. r = 4 cos(3θ): 3 petals; r = 3 sin(2θ): 4 petals.
    topic_code: "3.14"
  - front: Why odd n roses have only n petals → reason
    back: |
      Between θ = π and 2π the negative r values land exactly on petals already drawn, so the curve retraces itself. With even n they draw new petals.
    topic_code: "3.14"
  - front: Limaçon r = a + b cos θ → three cases
    back: |
      |a| < |b|: inner loop (r goes negative); |a| = |b|: cardioid (r touches 0); |a| > |b|: no loop (r stays positive).
    topic_code: "3.14"
  - front: r = 1 + 2 cos θ → when is it at the pole
    back: |
      r = 0 when cos θ = −1/2: θ = 2π/3 and 4π/3. The inner loop is traced between them, while r < 0.
    topic_code: "3.14"
  - front: Symmetry of a polar graph in cos θ or in sin θ → which axis
    back: |
      Equations in cos θ are symmetric about the x-axis (cos(−θ) = cos θ); equations in sin θ are symmetric about the y-axis.
    topic_code: "3.14"
  - front: θ–r graph crossing r = 0 → meaning for the polar curve
    back: |
      The polar curve passes through the pole at that angle. Between such crossings the curve traces one loop or petal.
    topic_code: "3.14"
  - front: θ–r graph below the axis → meaning for the polar curve
    back: |
      r is negative, so the points lie in the direction θ + π, on the opposite side of the pole from the ray at angle θ.
    topic_code: "3.14"
  - front: r = 2 cos(2θ) for π/4 < θ < π/2 → where the points are
    back: |
      r is negative, so the points are in directions θ + π between 5π/4 and 3π/2: quadrant III, part of the petal on the negative y-axis.
    topic_code: "3.14"
  - front: Error-spot → "(−3, 3) has θ = tan⁻¹(−1) = −π/4"
    back: |
      −π/4 points into quadrant IV, but (−3, 3) is in quadrant II. Use the quadrant: θ = 3π/4.
    topic_code: "3.13"
  - front: Error-spot → "r = 4 cos(2θ) has 2 petals"
    back: |
      For even n the rose has 2n petals: r = 4 cos(2θ) has 4 petals of length 4. Only odd n gives n petals.
    topic_code: "3.14"
  - front: Error-spot → "|3 + 4i| = 25"
    back: |
      The modulus is the distance from 0: √(3² + 4²) = 5. 25 is the square of the modulus.
    topic_code: "3.13"

quiz:
  description: |
    25 questions · about 45 minutes · mostly on this week (topics 3.13 and 3.14: polar coordinates, conversions,
    complex numbers in polar form, and polar graphs), with seven items (28%) reviewing earlier weeks (reciprocal
    functions, identities, trigonometric equations, inverse tangent, sine graph features and holes of rational
    functions). Opens with a shared-context set on the limaçon r = 2 + 4 cos θ. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes. No calculator is needed.
  questions:
    # ---- Stimulus set: the limaçon r = 2 + 4 cos θ (3.13, 3.14)
    - slug: precalc-u03-w25-q01
      type: multiple_choice
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 1
      stimulus: |
        Consider the polar function r = 2 + 4 cos θ for 0 ≤ θ < 2π.
      prompt: |
        Which best describes the graph?
      options:
        - "A cardioid"
        - "A limaçon with an inner loop"
        - "A limaçon with no inner loop"
        - "A rose with 4 petals"
      option_explanations:
        - |
          A cardioid needs |a| = |b|, as in 2 + 2 cos θ; here |a| = 2 and |b| = 4 are unequal.
        - |
          Correct. In r = a + b cos θ with |a| = 2 < |b| = 4, r becomes negative for some θ, and those values trace an inner loop.
        - |
          A limaçon has no inner loop only when |a| > |b|, so that r never reaches 0; here r = 0 at two angles.
        - |
          A rose has the form a cos(nθ) with no constant term; the 4 is the coefficient of cos θ, not a petal count.
      answer: 1
    - slug: precalc-u03-w25-q02
      type: multiple_choice
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 1
      stimulus: |
        Consider the polar function r = 2 + 4 cos θ for 0 ≤ θ < 2π.
      prompt: |
        For which values of θ does the graph pass through the pole?
      options:
        - "θ = π only"
        - "θ = π/3 and 5π/3"
        - "θ = π/2 and 3π/2"
        - "θ = 2π/3 and 4π/3"
      option_explanations:
        - |
          At θ = π, r = 2 − 4 = −2, not 0; this would be right for the cardioid 2 + 2 cos θ, not this limaçon.
        - |
          These solve cos θ = +1/2, a sign error; at θ = π/3, r = 2 + 2 = 4.
        - |
          At these angles cos θ = 0, so r = 2: the curve crosses the y-axis there, two units from the pole.
        - |
          Correct. r = 0 gives cos θ = −1/2, which happens at 2π/3 and 4π/3.
      answer: 3
    - slug: precalc-u03-w25-q03
      type: multiple_choice
      topic_code: "3.13"
      source: "AP Precalculus CED, Topic 3.13"
      points: 1
      stimulus: |
        Consider the polar function r = 2 + 4 cos θ for 0 ≤ θ < 2π.
      prompt: |
        What are the rectangular coordinates of the point on the graph where θ = π?
      options:
        - "(2, 0)"
        - "(−2, 0)"
        - "(6, 0)"
        - "(0, −2)"
      option_explanations:
        - |
          Correct. r(π) = 2 − 4 = −2. Then x = r cos θ = (−2)(−1) = 2 and y = r sin θ = 0. The negative r sends the point to the right of the pole, the tip of the inner loop.
        - |
          This plots r = −2 in the direction θ = π as if r were positive; a negative r is plotted in the opposite direction, θ + π = 0.
        - |
          This uses cos π = +1, giving r = 6 (the value at θ = 0) instead of r = −2.
        - |
          This puts the point on the y-axis; with θ = π the ray is horizontal, so y = r sin π = 0.
      answer: 0
    # ---- Polar coordinates and complex numbers (3.13)
    - slug: precalc-u03-w25-q04
      type: multiple_choice
      topic_code: "3.13"
      source: "AP Precalculus CED, Topic 3.13"
      points: 1
      prompt: |
        What are the rectangular coordinates of the polar point (6, 5π/6)?
      options:
        - "(3, −3√3)"
        - "(−3, 3√3)"
        - "(−3√3, 3)"
        - "(3√3, 3)"
      option_explanations:
        - |
          This swaps sine and cosine: 6 sin(5π/6) = 3 was used for x and 6 cos(5π/6) = −3√3 for y.
        - |
          This is the point at angle 2π/3: it uses the reference angle π/3 instead of π/6 (5π/6 = π − π/6).
        - |
          Correct. x = 6 cos(5π/6) = 6(−√3/2) = −3√3 and y = 6 sin(5π/6) = 6(1/2) = 3.
        - |
          This uses the quadrant I reference angle π/6 without the sign: cosine is negative in quadrant II.
      answer: 2
    - slug: precalc-u03-w25-q05
      type: multiple_choice
      topic_code: "3.13"
      source: "AP Precalculus CED, Topic 3.13"
      points: 1
      prompt: |
        Which gives polar coordinates of the rectangular point (−4, 4), with r > 0 and 0 ≤ θ < 2π?
      options:
        - "(4√2, 7π/4)"
        - "(4√2, 3π/4)"
        - "(32, 3π/4)"
        - "(4√2, −π/4)"
      option_explanations:
        - |
          7π/4 has tangent −1 but points into quadrant IV, to the point (4, −4); (−4, 4) is in quadrant II.
        - |
          Correct. r = √(16 + 16) = 4√2, and the quadrant II angle with tan θ = −1 is 3π/4.
        - |
          32 is r² = 16 + 16, not r; the distance from the pole is r = √32 = 4√2.
        - |
          tan⁻¹(−1) = −π/4 is outside [0, 2π) and points into quadrant IV; the calculator answer needs a quadrant check.
      answer: 1
    - slug: precalc-u03-w25-q06
      type: multiple_choice
      topic_code: "3.13"
      source: "AP Precalculus CED, Topic 3.13"
      points: 1
      prompt: |
        Which polar coordinates name the same point as (2, π/6)?
      options:
        - "(−2, π/6)"
        - "(2, −π/6)"
        - "(2, 7π/6)"
        - "(−2, 7π/6)"
      option_explanations:
        - |
          Negating r without changing the angle sends the point to the opposite side of the pole, in direction 7π/6.
        - |
          (2, −π/6) is the reflection of the point across the x-axis, in quadrant IV.
        - |
          Adding π to the angle without negating r sends the point to the opposite side of the pole, in quadrant III.
        - |
          Correct. (−r, θ + π) is the same point as (r, θ): facing 7π/6 and walking backwards 2 units lands at direction π/6, distance 2.
      answer: 3
    - slug: precalc-u03-w25-q07
      type: multiple_choice
      topic_code: "3.13"
      source: "AP Precalculus CED, Topic 3.13"
      points: 1
      prompt: |
        Which rectangular equation has the same graph as the polar equation r = 8 sin θ?
      options:
        - "x² + (y − 4)² = 16"
        - "x² + (y − 8)² = 64"
        - "(x − 4)² + y² = 16"
        - "x² + y² = 64"
      option_explanations:
        - |
          Correct. r² = 8r sin θ gives x² + y² = 8y; completing the square, x² + (y − 4)² = 16, a circle of radius 4 centred at (0, 4).
        - |
          This treats 8 as the radius; the 8 in r = 8 sin θ is the diameter of the circle, so the radius is 4.
        - |
          This puts the centre on the x-axis, which is the graph of r = 8 cos θ; sine moves it to the y-axis.
        - |
          This is the graph of r = 8, a circle centred at the pole; r = 8 sin θ varies with θ and passes through the pole.
      answer: 0
    - slug: precalc-u03-w25-q08
      type: multiple_choice
      topic_code: "3.13"
      source: "AP Precalculus CED, Topic 3.13"
      points: 1
      prompt: |
        Which is the polar form of the complex number z = −1 + i√3?
      options:
        - "2(cos(−π/3) + i sin(−π/3))"
        - "4(cos(2π/3) + i sin(2π/3))"
        - "2(cos(2π/3) + i sin(2π/3))"
        - "2(cos(π/3) + i sin(π/3))"
      option_explanations:
        - |
          tan⁻¹(√3/(−1)) = −π/3 points into quadrant IV; z sits at (−1, √3) in quadrant II.
        - |
          4 is the square of the modulus, a² + b² = 1 + 3; the modulus is √4 = 2.
        - |
          Correct. r = √(1 + 3) = 2, and (−1, √3) is in quadrant II with reference angle π/3, so θ = 2π/3.
        - |
          This is 1 + i√3; the real part −1 puts z in quadrant II, so the angle is π − π/3.
      answer: 2
    # ---- Polar graphs (3.14)
    - slug: precalc-u03-w25-q09
      type: multiple_choice
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 1
      prompt: |
        How many petals does the graph of r = 5 sin(4θ) have?
      options:
        - "4"
        - "5"
        - "8"
        - "10"
      option_explanations:
        - |
          n petals is the rule for odd n; for even n, the negative r values draw new petals, giving 2n.
        - |
          5 is the petal length (the coefficient a), not the number of petals.
        - |
          Correct. n = 4 is even, so the rose has 2n = 8 petals, each of length 5.
        - |
          This doubles the coefficient 5; the petal count depends on n = 4, not on a.
      answer: 2
    - slug: precalc-u03-w25-q10
      type: multiple_choice
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 1
      prompt: |
        Which polar equation has a graph that is a circle of diameter 6 passing through the pole, with its centre on the positive x-axis?
      options:
        - "r = 6 cos θ"
        - "r = 6"
        - "r = 6 sin θ"
        - "r = 3 cos θ"
      option_explanations:
        - |
          Correct. r = 6 cos θ is (x − 3)² + y² = 9: diameter 6, centre (3, 0), and r = 0 at θ = π/2, so it passes through the pole.
        - |
          r = 6 is a circle centred at the pole with radius 6; it never passes through the pole.
        - |
          r = 6 sin θ is the right size and passes through the pole, but its centre is (0, 3) on the y-axis.
        - |
          In r = a cos θ, a is the diameter; r = 3 cos θ has diameter 3.
      answer: 0
    - slug: precalc-u03-w25-q11
      type: multiple_choice
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 1
      prompt: |
        The graph of r = 3 cos θ, drawn on rectangular axes with θ horizontal and r vertical, falls from r = 3 at θ = 0 to r = 0 at θ = π/2 and to r = −3 at θ = π. For π/2 < θ < π, in which quadrant of the xy-plane do the corresponding points of the polar curve lie?
      options:
        - "Quadrant I"
        - "Quadrant II"
        - "Quadrant III"
        - "Quadrant IV"
      option_explanations:
        - |
          Quadrant I is traced for 0 < θ < π/2, where r is positive; the question asks about the angles after π/2.
        - |
          The angles are in quadrant II, but r is negative there, so the points go in the opposite direction.
        - |
          Quadrant III is opposite to quadrant I; reversing a quadrant II direction gives quadrant IV.
        - |
          Correct. r < 0 sends each point in the direction θ + π, between 3π/2 and 2π. Check: x = 3 cos²θ > 0 and y = 3 cos θ sin θ < 0.
      answer: 3
    - slug: precalc-u03-w25-q12
      type: multi_select
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the graph of r = 3 cos(2θ) are true? Select all that apply.
      options:
        - "It is a rose with 4 petals."
        - "Each petal has length 6."
        - "The graph passes through the pole at θ = π/4."
        - "The graph is a cardioid."
        - "The polar point (−3, π/2) lies on the graph."
      option_explanations:
        - |
          Correct. n = 2 is even, so there are 2n = 4 petals.
        - |
          The petal length is |a| = 3, the largest value of |r|; 6 doubles it.
        - |
          Correct. r(π/4) = 3 cos(2 · π/4) = 3 cos(π/2) = 0, so the curve is at the pole.
        - |
          A cardioid has the form a + b cos θ with |a| = |b|; this equation has no constant term and a multiple angle.
        - |
          Correct. r(π/2) = 3 cos π = −3, so (−3, π/2) is on the graph; it is the rectangular point (0, −3).
      answer: [0, 2, 4]
    - slug: precalc-u03-w25-q13
      type: multi_select
      topic_code: "3.13"
      source: "AP Precalculus CED, Topic 3.13"
      points: 2
      partial_credit: true
      prompt: |
        Which polar coordinates name the rectangular point (0, −5)? Select all that apply.
      options:
        - "(5, 3π/2)"
        - "(−5, π/2)"
        - "(5, −π/2)"
        - "(−5, 3π/2)"
        - "(5, π/2)"
      option_explanations:
        - |
          Correct. Facing 3π/2 (straight down) and walking 5 reaches (0, −5).
        - |
          Correct. Facing π/2 (straight up) and walking 5 backwards reaches (0, −5).
        - |
          Correct. −π/2 is the same direction as 3π/2.
        - |
          Facing straight down and walking backwards lands at (0, 5), the opposite point.
        - |
          Facing straight up and walking 5 forwards lands at (0, 5).
      answer: [0, 1, 2]
    - slug: precalc-u03-w25-q14
      type: true_false
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 1
      prompt: |
        True or false: The graph of r = 1 + 3 sin θ is a cardioid.
      answer: false
      explanation: |
        False. In r = a + b sin θ, a cardioid needs |a| = |b|. Here |a| = 1 < |b| = 3, so r becomes negative (when sin θ < −1/3) and the graph is a limaçon with an inner loop.
    - slug: precalc-u03-w25-q15
      type: true_false
      topic_code: "3.9"
      source: "AP Precalculus CED, Topic 3.9"
      points: 1
      prompt: |
        True or false: tan⁻¹(−1) = 3π/4.
      answer: false
      explanation: |
        False. tan(3π/4) = −1, but the range of tan⁻¹ is (−π/2, π/2), so tan⁻¹(−1) = −π/4. This is why converting (−4, 4) to polar coordinates needs a quadrant check.
    - slug: precalc-u03-w25-q16
      type: fill_blank
      topic_code: "3.13"
      source: "AP Precalculus CED, Topic 3.13"
      points: 1
      prompt: |
        The rectangular point (5, −12) is at distance r = ____ from the pole.
      answer: ["13"]
      explanation: |
        r = √(5² + (−12)²) = √(25 + 144) = √169 = 13.
    - slug: precalc-u03-w25-q17
      type: fill_blank
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 1
      prompt: |
        The graph of r = 2 cos(3θ) has ____ petals.
      answer: ["3", "three"]
      explanation: |
        n = 3 is odd, so the rose has n = 3 petals (each of length 2). The negative values of r retrace petals already drawn.
    # ---- Spiral review
    - slug: precalc-u03-w25-q18
      type: multiple_choice
      topic_code: "3.11"
      source: "AP Precalculus CED, Topic 3.11"
      points: 1
      prompt: |
        What is the exact value of cot(5π/3)?
      options:
        - "√3/3"
        - "−√3/3"
        - "−√3"
        - "−2√3/3"
      option_explanations:
        - |
          The size is right, but 5π/3 is in quadrant IV, where tangent and cotangent are negative.
        - |
          Correct. At 5π/3 the point is (1/2, −√3/2), so cot = x/y = (1/2)/(−√3/2) = −1/√3 = −√3/3.
        - |
          −√3 is tan(5π/3) = y/x; cotangent is the reciprocal, x/y.
        - |
