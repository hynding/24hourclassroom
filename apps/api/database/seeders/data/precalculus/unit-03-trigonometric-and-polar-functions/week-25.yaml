    - slug: precalc-u03-w25-q24
      type: short_answer
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 3
      prompt: |
        (a) Show that (sin x + cos x)² = 1 + sin(2x) for all x.
        (b) Use part (a) to solve (sin x + cos x)² = 1 on [0, 2π).
        (c) Use part (a) to find the largest value of (sin x + cos x)², and one x at which it occurs.
      answer: |
        (a) (sin x + cos x)² = sin²x + 2 sin x cos x + cos²x = (sin²x + cos²x) + 2 sin x cos x = 1 + sin(2x).
        (b) 1 + sin(2x) = 1 gives sin(2x) = 0, so 2x = 0, π, 2π, 3π on [0, 4π), and x = 0, π/2, π, 3π/2.
        (c) sin(2x) is at most 1, so the largest value is 2, reached when 2x = π/2, for example at x = π/4.
      explanation: |
        Three points, one per part. (a) expansion with both the Pythagorean and double-angle identities named or used. (b) all four solutions. (c) the maximum 2 with a valid x (π/4 or 5π/4).
    - slug: precalc-u03-w25-q25
      type: long_answer
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 6
      prompt: |
        Consider the polar function r = f(θ) = 1 + 2 sin θ for 0 ≤ θ < 2π.

        (A) (i) Find r for θ = 0, π/6, π/2, 7π/6 and 3π/2.
        (ii) Classify the graph of f and justify your answer using the coefficients.

        (B) (i) Find the rectangular coordinates of the point on the graph where θ = π/6.
        (ii) Find the rectangular coordinates of the point on the graph where θ = 3π/2, and explain why this point is above the pole even though the angle 3π/2 points straight down.

        (C) Find all values of θ in [0, 2π) at which the graph passes through the pole. Describe what the graph does for θ between these values, referring to the sign of r.
      answer: |
        (A)(i) f(0) = 1, f(π/6) = 1 + 2(1/2) = 2, f(π/2) = 3, f(7π/6) = 1 + 2(−1/2) = 0, f(3π/2) = 1 − 2 = −1.
        (ii) It has the form a + b sin θ with |a| = 1 < |b| = 2, so it is a limaçon with an inner loop.
        (B)(i) r = 2: x = 2 cos(π/6) = √3, y = 2 sin(π/6) = 1. The point is (√3, 1).
        (ii) r = −1: x = (−1) cos(3π/2) = 0, y = (−1) sin(3π/2) = (−1)(−1) = 1. The point is (0, 1). Because r is negative, the point is plotted in the direction 3π/2 + π = π/2, straight up from the pole.
        (C) r = 0 when sin θ = −1/2: θ = 7π/6 and 11π/6. For 7π/6 < θ < 11π/6, sin θ < −1/2 so r < 0, and each point is plotted in the direction θ + π, between π/6 and 5π/6, above the pole: this traces the small inner loop, which reaches up to (0, 1).
      explanation: |
        Six points.
        (A)(i) 1 point: all five values.
        (A)(ii) 1 point: limaçon with an inner loop, justified by |a| < |b| (or by r taking negative values).
        (B)(i) 1 point: (√3, 1).
        (B)(ii) 1 point: (0, 1) with the explanation that negative r reverses the direction.
        (C) 2 points: 1 for θ = 7π/6 and 11π/6; 1 for describing the inner loop traced while r < 0, with points plotted in the opposite direction (above the pole).
