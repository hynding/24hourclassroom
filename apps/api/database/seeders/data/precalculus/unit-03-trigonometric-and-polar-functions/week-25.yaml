      points: 3
      prompt: |
        Let z = −3 + 3√3 i and w = 4(cos(7π/4) + i sin(7π/4)).

        (a) Find the modulus of z and an argument θ with 0 ≤ θ < 2π. Explain how you chose the quadrant.
        (b) Write z in polar form.
        (c) Write w in the form a + bi.
      answer: |
        (a) |z| = √(9 + 27) = √36 = 6. tan θ = 3√3/(−3) = −√3. The point (−3, 3√3) has negative real part and positive imaginary part, so it is in quadrant II, and θ = π − π/3 = 2π/3.
        (b) z = 6(cos(2π/3) + i sin(2π/3)).
        (c) w = 4(√2/2) + 4(−√2/2)i = 2√2 − 2√2 i.
      explanation: |
