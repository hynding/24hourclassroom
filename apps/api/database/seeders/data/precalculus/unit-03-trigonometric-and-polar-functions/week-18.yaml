    - slug: precalc-u03-w18-q22
      type: short_answer
      topic_code: "3.1"
      source: "AP Precalculus CED, Topic 3.1"
      points: 3
      prompt: |
        At a hypothetical harbour, a tide gauge records high water at 3:00 a.m. The next high water is at 3:24 p.m. the same day, and the pattern repeats with the same period.

        (a) State the period of the tide in hours.
        (b) Predict the times of the next two high waters after 3:24 p.m.
        (c) Assuming each cycle is symmetric, so that low water falls halfway between consecutive high waters, predict the time of the low water between 3:00 a.m. and 3:24 p.m., and say why the symmetry assumption matters.
      answer: |
        (a) From 3:00 a.m. to 3:24 p.m. is 12 hours 24 minutes, so the period is 12.4 hours.
        (b) 3:24 p.m. + 12 h 24 min = 3:48 a.m. the next day; adding 12 h 24 min again gives 4:12 p.m. the next day.
        (c) Halfway is 6 h 12 min after 3:00 a.m., at 9:12 a.m. Periodicity alone says only that the pattern repeats; it does not say where in the cycle the minimum falls, so locating low water at the midpoint needs the extra assumption that the rise and fall take equal times.
      explanation: |
        Three points, one per part. (a) 12.4 hours (or 12 h 24 min). (b) both times, 3:48 a.m. and 4:12 p.m. the next day. (c) 9:12 a.m. with a reason that periodicity alone does not fix where the minimum lies within a cycle.
    - slug: precalc-u03-w18-q23
      type: long_answer
      topic_code: "3.2"
      source: "AP Precalculus CED, Topic 3.2"
      points: 6
      prompt: |
        A hypothetical playground roundabout has radius 2 m. Put a coordinate system in metres with its origin at the centre of the roundabout. A child sits on the rim, starting at the point (2, 0), and the roundabout turns counterclockwise at a steady rate of one full turn every 8 seconds.

        (A) (i) Through what angle, in radians, has the roundabout turned after 3 seconds?
        (ii) How far along the rim has the child travelled after 3 seconds? Give an exact answer and a decimal to the nearest hundredth, with units.

        (B) At a later moment the child is at the point (−1.2, 1.6).
        (i) Find sin θ, cos θ and tan θ for an angle θ in standard position whose terminal ray passes through the child.
        (ii) Name the quadrant of the child's position and explain how the signs in (i) agree with it.

        (C) Let y(t) be the child's vertical coordinate, in metres, t seconds after the start.
        (i) Explain why y is a periodic function and state its period.
        (ii) The child's vertical coordinate at t = 1.5 is about 1.85 m. Find y(17.5) and y(−6.5), and justify your answers.
      answer: |
        (A) (i) 3 seconds is 3/8 of a turn, so the angle is (3/8)(2π) = 3π/4 radians.
        (ii) s = rθ = 2 · 3π/4 = 3π/2 ≈ 4.71 m.
        (B) (i) r = √(1.44 + 2.56) = 2, as it must be on the rim. sin θ = 1.6/2 = 0.8, cos θ = −1.2/2 = −0.6, tan θ = 1.6/(−1.2) = −4/3.
        (ii) Quadrant II. There x < 0 and y > 0, so sine (y/r) is positive, cosine (x/r) is negative, and tangent (y/x) is negative, as found.
        (C) (i) Every 8 seconds the roundabout makes a full turn and the child returns to the same position, so y(t + 8) = y(t) for all t, and no shorter time brings the child back to the same point. The period is 8 seconds.
        (ii) 17.5 = 1.5 + 2 · 8 and −6.5 = 1.5 − 8, so both inputs differ from 1.5 by whole periods: y(17.5) = y(−6.5) = y(1.5) ≈ 1.85 m.
      explanation: |
        Six points, two per part. (A) 1 point for 3π/4; 1 point for 3π/2 ≈ 4.71 m with units. (B) 1 point for all three ratios (r = 2 may be implicit); 1 point for quadrant II with the sign explanation. (C) 1 point for the full-turn argument and period 8 s; 1 point for both values with the whole-period justification.
