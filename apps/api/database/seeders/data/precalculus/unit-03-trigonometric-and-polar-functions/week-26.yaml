      source: "AP Precalculus CED, Topic 3.15"
      points: 3
      prompt: |
        Consider the cardioid r = 2 + 2 sin θ for 0 ≤ θ < 2π.

        (a) On which intervals is r increasing, and on which is it decreasing?
        (b) Find the average rate of change of r over [π/2, π]. Interpret your answer in terms of the distance from the pole.
        (c) Is the distance from the pole increasing or decreasing on (π, 3π/2)? Justify your answer.
      answer: |
        (a) r follows sin θ: increasing on (0, π/2) and (3π/2, 2π); decreasing on (π/2, 3π/2).
        (b) r(π/2) = 4 and r(π) = 2, so (2 − 4)/(π/2) = −4/π ≈ −1.27 units per radian. Since r is positive on this interval, the distance from the pole decreases on average by about 1.27 units per radian as θ goes from π/2 to π.
        (c) Decreasing. On (π, 3π/2), r = 2 + 2 sin θ falls from 2 to 0 and stays non-negative, so |r| decreases and the curve approaches the pole, reaching it at θ = 3π/2 (the cusp).
      explanation: |
        Three points, one per part. (a) both kinds of interval correct. (b) −4/π (or −1.27) with an interpretation that mentions the distance decreasing per radian. (c) decreasing, justified by r being positive (non-negative) and decreasing.
