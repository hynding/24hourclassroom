        (ii) Find the rectangular coordinates of the point on the graph where θ = 0, and explain why it lies on the negative x-axis.
      answer: |
        (A)(i) f(0) = 2 − 4 = −2 and f(π/3) = 2 − 4(1/2) = 0. Average rate = (0 − (−2))/(π/3) = 6/π ≈ 1.91 units per radian.
