        (C)(i) |f(θ)| = 2. f(θ) = 2 gives cos θ = 0: θ = π/2, 3π/2. f(θ) = −2 gives cos θ = 1: θ = 0. So θ = 0, π/2, 3π/2.
        (ii) f(0) = −2, so x = −2 cos 0 = −2 and y = −2 sin 0 = 0: the point (−2, 0). The angle 0 points along the positive x-axis, but r is negative, so the point is plotted in the opposite direction, along the negative x-axis.
