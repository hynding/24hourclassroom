week: 26
unit: 3
title: "Rates of Change in Polar Functions"
topics: ["3.15"]
guide: guides/week-26.md
guide_description: |
  How r = f(θ) changing relates to a polar curve moving toward or away from the pole: the four cases built from
  the sign of r and the direction of its change; using the θ–r graph to find where a curve is farthest from or
  closest to the pole; computing and interpreting the average rate of change of r per radian; and estimating the
  rate at one angle from a formula or a table. Worked examples include the inner loop of r = 1 + 2 cos θ, the
  farthest point of r = −1 + 3 cos θ (where r is most negative), and a hypothetical sprinkler whose reach is
  r = 4 + 2 cos θ metres.
flashcards_description: |
  28 cards on r versus distance from the pole, reading the θ–r graph, farthest and closest points, average rates
  of change of r with units and interpretation, and estimating a rate at one angle.

flashcards:
  - front: Distance from the pole of the polar point (r, θ) → formula
    back: |
      |r|. A negative r still gives a positive distance; (−3, θ) is 3 units from the pole.
    topic_code: "3.15"
  - front: r positive and increasing → motion relative to the pole
    back: |
      The distance |r| increases: the point moves away from the pole.
    topic_code: "3.15"
  - front: r positive and decreasing → motion relative to the pole
    back: |
      The distance decreases: the point moves toward the pole.
    topic_code: "3.15"
  - front: r negative and increasing → motion relative to the pole
    back: |
      r rises toward 0, so |r| shrinks: the point moves toward the pole, even though r is increasing.
    topic_code: "3.15"
  - front: r negative and decreasing → motion relative to the pole
    back: |
      r becomes more negative, so |r| grows: the point moves away from the pole, even though r is decreasing.
    topic_code: "3.15"
  - front: Same-sign rule for distance from the pole → statement
    back: |
      The distance from the pole increases when r and its change have the same sign, and decreases when they have opposite signs.
    topic_code: "3.15"
  - front: θ–r graph moving away from the θ-axis → meaning
    back: |
      |r| is growing, so the polar curve is moving away from the pole. Moving toward the θ-axis means approaching the pole.
    topic_code: "3.15"
  - front: θ–r graph touching the θ-axis → meaning
    back: |
      r = 0 there, so the polar curve passes through the pole at that angle.
    topic_code: "3.15"
  - front: Farthest point of a polar curve from the pole → how to find it
    back: |
      Find the largest value of |r|: compare the maximum of r with the absolute value of the minimum of r. The deepest trough of the θ–r graph can win.
    topic_code: "3.15"
  - front: Farthest point of r = −1 + 3 cos θ → where and how far
    back: |
      r runs from 2 (θ = 0) down to −4 (θ = π). The largest |r| is 4 at θ = π: the rectangular point (4, 0).
    topic_code: "3.15"
  - front: r = 3 + 2 sin θ on (0, π/2) and (π/2, π) → motion
    back: |
      r > 0 throughout. It rises from 3 to 5 on (0, π/2): away from the pole. It falls back to 3 on (π/2, π): toward the pole. Farthest point at θ = π/2.
    topic_code: "3.15"
  - front: r = 1 + 2 cos θ on (2π/3, π) → motion
    back: |
      r falls from 0 to −1: negative and decreasing, so the distance grows from 0 to 1. The point moves away from the pole along the inner loop.
    topic_code: "3.15"
  - front: r = 1 + 2 cos θ on (π, 4π/3) → motion
    back: |
      r rises from −1 to 0: negative and increasing, so the distance shrinks to 0. The point returns to the pole, closing the inner loop.
    topic_code: "3.15"
  - front: r = 4 cos θ on (π/2, π) → motion
    back: |
      r falls from 0 to −4: negative and decreasing, so the point moves away from the pole.
    topic_code: "3.15"
  - front: r = 3 sin(2θ) on [0, π/2] → motion
    back: |
      r rises from 0 to 3 on (0, π/4) (away from the pole) and falls back to 0 on (π/4, π/2) (toward it): one petal with its tip at θ = π/4.
    topic_code: "3.15"
  - front: Average rate of change of r = f(θ) on [θ₁, θ₂] → formula and units
    back: |
      (f(θ₂) − f(θ₁))/(θ₂ − θ₁), in units of r per radian. It is the slope of a secant line on the θ–r graph.
    topic_code: "3.15"
  - front: Average rate of change of r = 3 + 2 sin θ on [0, π/2] → value
    back: |
      (5 − 3)/(π/2) = 4/π ≈ 1.27 units per radian. r is positive, so the curve moves away from the pole at that average rate.
    topic_code: "3.15"
  - front: Average rate of change of r = 1 + 2 cos θ on [2π/3, π] → value and meaning
    back: |
      (−1 − 0)/(π/3) = −3/π ≈ −0.95 per radian. r decreases on average, but r is negative, so the distance from the pole increases.
    topic_code: "3.15"
  - front: Average rate of change of r = 5 sin(2θ) on [0, π/4] → value
    back: |
      (5 − 0)/(π/4) = 20/π ≈ 6.37 units per radian.
    topic_code: "3.15"
  - front: Average rate of change of r = 2θ + 1 on [0, π] → value
    back: |
      ((2π + 1) − 1)/π = 2: for a linear r(θ) the average rate is the constant slope.
    topic_code: "3.15"
  - front: Sprinkler reach r = 4 + 2 cos θ m on [0, π/2] → average rate and meaning
    back: |
      (4 − 6)/(π/2) = −4/π ≈ −1.27 m per radian: as the spray turns, its reach shrinks about 1.27 m per radian on average (hypothetical model).
    topic_code: "3.15"
  - front: Interpreting an average rate of change of r → what to include
    back: |
      The quantity (r, or the distance), the interval of θ, the value with units per radian, and whether the curve moves toward or away from the pole.
    topic_code: "3.15"
  - front: Estimating the rate of change of r at one angle → method
    back: |
      Compute the average rate over a small interval centred on the angle, such as θ ± 0.01, or use the two neighbouring table entries.
    topic_code: "3.15"
  - front: Rate of change of r = 3 + 2 sin θ at θ = π/6 → estimate
    back: |
      Over [π/6 − 0.01, π/6 + 0.01] the average rate is about 1.73 units per radian (it settles near √3 ≈ 1.732).
    topic_code: "3.15"
  - front: Table estimate with g(π/3) = 2.6, g(2π/3) = 3.7 → rate at π/2
    back: |
      (3.7 − 2.6)/(π/3) = 3.3/π ≈ 1.05 units per radian.
    topic_code: "3.15"
  - front: Error-spot → "r is increasing, so the point is moving away from the pole"
    back: |
      Only if r is positive. When r is negative and increasing, |r| is shrinking and the point approaches the pole.
    topic_code: "3.15"
  - front: Error-spot → "the farthest point is where r is largest"
    back: |
      Distance is |r|. For r = −1 + 3 cos θ the largest r is 2 but the most negative r is −4, so the farthest point is 4 units away.
    topic_code: "3.15"
  - front: Error-spot → "the average rate of change of r over [0°, 90°] is Δr/90"
    back: |
      Rates of change of polar functions are per radian: divide by π/2, not by 90.
    topic_code: "3.15"

quiz:
  description: |
    25 questions · about 45 minutes · mostly on this week (topic 3.15: whether r and the distance from the pole are
    increasing or decreasing, farthest points, and average and estimated rates of change of r), with seven items
    (28%) reviewing earlier weeks (polar coordinates and roses, identities, trigonometric equations, a sinusoidal
    model, logarithm properties and complex zeros). Opens with a shared-context set built on a table of values.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. A calculator helps with the decimal answers but is not required; no item is marked (Calculator.).
  questions:
    # ---- Stimulus set: a polar function given by a table (3.15)
    - slug: precalc-u03-w26-q01
      type: multiple_choice
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      stimulus: |
        A polar function r = g(θ) has the values below (rounded to three decimal places where needed). The function g is decreasing on [0, π/2] and increasing on [π/2, π].

        θ = 0: r = 2
        θ = π/6: r = 0
        θ = π/3: r = −1.464
        θ = π/2: r = −2
        θ = 2π/3: r = −1.464
        θ = 5π/6: r = 0
        θ = π: r = 2
      prompt: |
        What is the average rate of change of r with respect to θ over the interval [0, π/2]?
      options:
        - "−4"
        - "8/π"
        - "−8/π"
        - "−π/8"
      option_explanations:
        - |
          −4 is the change in r, g(π/2) − g(0); it still has to be divided by the change in θ, π/2.
        - |
          This subtracts in the wrong order in the numerator only: g(0) − g(π/2) = 4, giving a positive rate for a decreasing function.
        - |
          Correct. (g(π/2) − g(0))/(π/2 − 0) = (−2 − 2)/(π/2) = −8/π ≈ −2.55 per radian.
        - |
          This divides the change in θ by the change in r; the rate of change of r is Δr/Δθ.
      answer: 2
    - slug: precalc-u03-w26-q02
      type: multiple_choice
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      stimulus: |
        A polar function r = g(θ) has the values below (rounded to three decimal places where needed). The function g is decreasing on [0, π/2] and increasing on [π/2, π].

        θ = 0: r = 2
        θ = π/6: r = 0
        θ = π/3: r = −1.464
        θ = π/2: r = −2
        θ = 2π/3: r = −1.464
        θ = 5π/6: r = 0
        θ = π: r = 2
      prompt: |
        As θ increases from π/6 to π/2, is the distance between the point (r, θ) and the pole increasing or decreasing?
      options:
        - "Increasing, because r is negative and decreasing"
        - "Decreasing, because r is decreasing"
        - "Increasing, because r is increasing"
        - "Decreasing, because r is negative"
      option_explanations:
        - |
          Correct. r goes from 0 to −2: negative and decreasing, so |r| grows from 0 to 2 and the point moves away from the pole.
        - |
          A decreasing r means a shrinking distance only when r is positive; here r is negative, so |r| grows.
        - |
          The conclusion is right but the reason is wrong: g is decreasing on this interval, not increasing.
        - |
          The sign of r alone does not decide the direction; the distance |r| = 0, 1.464, 2 is growing.
      answer: 0
    - slug: precalc-u03-w26-q03
      type: numeric
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      stimulus: |
        A polar function r = g(θ) has the values below (rounded to three decimal places where needed). The function g is decreasing on [0, π/2] and increasing on [π/2, π].

        θ = 0: r = 2
        θ = π/6: r = 0
        θ = π/3: r = −1.464
        θ = π/2: r = −2
        θ = 2π/3: r = −1.464
        θ = 5π/6: r = 0
        θ = π: r = 2
      prompt: |
        Estimate the rate of change of r with respect to θ at θ = π/3, using the average rate of change over [π/6, π/2]. Give your answer to the nearest hundredth.
      answer: { value: -1.91, tolerance: 0.01 }
      explanation: |
        (g(π/2) − g(π/6))/(π/2 − π/6) = (−2 − 0)/(π/3) = −6/π ≈ −1.91 units of r per radian.
    # ---- r, distance and rates (3.15)
    - slug: precalc-u03-w26-q04
      type: multiple_choice
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      prompt: |
        For the polar curve r = 4 cos θ, which statement describes the points on the curve as θ increases from 0 to π/2?
      options:
        - "They move away from the pole, because θ is increasing."
        - "They move closer to the pole, because r is positive and decreasing."
        - "They move away from the pole, because r is positive."
        - "They stay the same distance from the pole, because the graph is a circle."
      option_explanations:
        - |
          The distance depends on r, not on θ itself; r falls from 4 to 0 on this interval.
        - |
          Correct. cos θ falls from 1 to 0, so r falls from 4 to 0 while positive: the distance from the pole decreases to 0.
        - |
          A positive r tells you the direction of the point, not whether it is getting farther away; r is shrinking here.
        - |
          r = 4 cos θ is a circle, but it passes through the pole rather than being centred there, so distances from the pole vary.
      answer: 1
    - slug: precalc-u03-w26-q05
      type: multiple_choice
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      prompt: |
        What is the average rate of change of r = 5 sin(2θ) with respect to θ over the interval [0, π/4]?
      options:
        - "5"
        - "5π/4"
        - "π/20"
        - "20/π"
      option_explanations:
        - |
          5 is the change in r, from 0 to 5; it must be divided by the change in θ, π/4.
        - |
          This multiplies the change in r by the change in θ instead of dividing.
        - |
          This divides Δθ by Δr; the rate of change of r is Δr/Δθ.
        - |
          Correct. (5 sin(π/2) − 5 sin 0)/(π/4) = 5/(π/4) = 20/π ≈ 6.37 units per radian.
      answer: 3
    - slug: precalc-u03-w26-q06
      type: multiple_choice
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      prompt: |
        For a polar function r = f(θ), with r in centimetres, the average rate of change of f over [π/6, π/3] is 2.4. Which is the best interpretation?
      options:
        - "On average, r increases by 2.4 cm for each radian that θ increases between π/6 and π/3."
        - "The point travels 2.4 cm along the curve as θ goes from π/6 to π/3."
        - "On average, r increases by 2.4 cm for each degree that θ increases between π/6 and π/3."
        - "The points at θ = π/6 and θ = π/3 are 2.4 cm apart."
      option_explanations:
        - |
          Correct. An average rate of change of r is the change in r per radian of change in θ over the stated interval.
        - |
          Distance travelled along the curve is arc length, a different quantity; the rate compares Δr with Δθ.
        - |
          The angle is measured in radians; the interval π/6 to π/3 has length π/6 radians, not 30 units.
        - |
          The rate is not a distance between two points; the change in r over the interval is 2.4 · π/6 ≈ 1.26 cm.
      answer: 0
    - slug: precalc-u03-w26-q07
      type: multiple_choice
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      prompt: |
        On an interval of θ, the values of a polar function r = f(θ) are negative and increasing. What can be concluded about the points on the curve over that interval?
      options:
        - "They are moving away from the pole."
        - "Their distance from the pole is constant."
        - "They are moving toward the pole."
        - "Nothing can be concluded without a formula for f."
      option_explanations:
        - |
          An increasing r means moving away only when r is positive; a negative r rising toward 0 has a shrinking absolute value.
        - |
          A constant distance needs |r| constant; here r is changing, so |r| changes too.
        - |
          Correct. r rises toward 0, so |r| decreases: the points approach the pole.
        - |
          The sign of r and the direction of its change are enough: opposite signs mean the distance is decreasing.
      answer: 2
    - slug: precalc-u03-w26-q08
      type: multiple_choice
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      prompt: |
        For r = 2 + 3 sin θ, on which interval is the distance between the point (r, θ) and the pole increasing throughout?
      options:
        - "(0, π/2)"
        - "(π/2, π)"
        - "(π, 7π/6)"
        - "(π/2, 3π/2)"
      option_explanations:
        - |
          Correct. sin θ rises from 0 to 1, so r rises from 2 to 5 while positive: the distance increases throughout.
        - |
          sin θ falls from 1 to 0, so r falls from 5 to 2 while positive: the distance decreases.
        - |
          sin θ falls from 0 to −1/2, so r falls from 2 to 1/2 while positive: the distance decreases.
        - |
          r decreases throughout, but it changes sign (r = 0 when sin θ = −2/3), so the distance first decreases and then increases; it is not increasing throughout.
      answer: 0
    - slug: precalc-u03-w26-q09
      type: multiple_choice
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      prompt: |
        What is the greatest distance from the pole of any point on the graph of r = −1 + 3 cos θ?
      options:
        - "1"
        - "2"
        - "3"
        - "4"
      option_explanations:
        - |
          1 is |−1|, the constant term; at θ = π/2 the point is 1 unit away, but other points are farther.
        - |
          2 is the largest value of r (at θ = 0); the most negative value, −4, is farther from the pole.
        - |
          3 is the coefficient of cos θ; distances are values of |r|, which reach 4.
        - |
          Correct. r ranges from −4 (at θ = π) to 2 (at θ = 0), so the largest |r| is 4.
      answer: 3
    - slug: precalc-u03-w26-q10
      type: multiple_choice
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      prompt: |
        A hypothetical garden sprinkler waters a region whose edge is the polar curve r = 5 + 3 cos θ, in metres from the sprinkler head. What is the average rate of change of r over [0, π/2]?
      options:
        - "3/(π/2) = 6/π metres per radian"
        - "−6/π metres per radian"
        - "−3 metres per radian"
        - "−π/6 metres per radian"
      option_explanations:
        - |
          This subtracts in the wrong order: r(0) − r(π/2) = 8 − 5 = 3; the later value comes first, 5 − 8 = −3.
        - |
          Correct. r(0) = 8 and r(π/2) = 5, so (5 − 8)/(π/2) = −6/π ≈ −1.91 m per radian; the reach shrinks as the spray turns.
        - |
          −3 m is the change in r; dividing by the change in angle, π/2, gives the rate per radian.
        - |
          This divides the change in θ by the change in r; the rate is Δr/Δθ.
      answer: 1
    - slug: precalc-u03-w26-q11
      type: multi_select
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 2
      partial_credit: true
      prompt: |
        Consider r = 3 sin(2θ) for 0 ≤ θ ≤ π/2. Which statements are true? Select all that apply.
      options:
        - "r is increasing on (0, π/4)."
        - "The distance from the pole is increasing on (π/4, π/2)."
        - "The point farthest from the pole on this interval is at θ = π/4, at distance 3."
        - "The average rate of change of r over [0, π/2] is 0."
        - "r is negative on (0, π/2)."
      option_explanations:
        - |
          Correct. 2θ runs over (0, π/2), where sine increases, so r rises from 0 to 3.
        - |
          r falls from 3 to 0 while positive on (π/4, π/2), so the distance decreases.
        - |
          Correct. r reaches its maximum 3 at θ = π/4 (2θ = π/2), the tip of the petal.
        - |
          Correct. r(0) = 0 and r(π/2) = 3 sin π = 0, so the change in r, and the average rate, is 0.
        - |
          sin(2θ) > 0 for 0 < 2θ < π, so r is positive on (0, π/2).
      answer: [0, 2, 3]
    - slug: precalc-u03-w26-q12
      type: multi_select
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 2
      partial_credit: true
      prompt: |
        Consider r = 1 + 2 cos θ for 2π/3 < θ < π. Which statements are true? Select all that apply.
      options:
        - "r < 0 throughout the interval."
        - "r is decreasing on the interval."
        - "The distance from the pole is decreasing on the interval."
        - "The points of the curve lie in quadrant II."
        - "The average rate of change of r over [2π/3, π] is −3/π."
      option_explanations:
        - |
          Correct. cos θ < −1/2 on this interval, so 1 + 2 cos θ < 0.
        - |
          Correct. cos θ decreases from −1/2 to −1, so r decreases from 0 to −1.
        - |
          r is negative and decreasing, so |r| increases from 0 to 1: the distance increases.
        - |
          The angles are in quadrant II, but r < 0 sends the points in the directions θ + π, which are in quadrant IV.
        - |
          Correct. (r(π) − r(2π/3))/(π − 2π/3) = (−1 − 0)/(π/3) = −3/π.
      answer: [0, 1, 4]
    - slug: precalc-u03-w26-q13
      type: true_false
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      prompt: |
        True or false: If a polar function r = f(θ) is increasing on an interval, then the points on its graph are moving away from the pole on that interval.
      answer: false
      explanation: |
        False. If r is negative and increasing (for example from −3 to −1), the distance |r| shrinks and the points move toward the pole. The statement holds only where r is positive.
    - slug: precalc-u03-w26-q14
      type: true_false
      topic_code: "3.13"
      source: "AP Precalculus CED, Topic 3.13"
      points: 1
      prompt: |
        True or false: The polar point (−2, π/3) lies in quadrant III.
      answer: true
      explanation: |
        True. A negative r is plotted in the direction θ + π = 4π/3, which is in quadrant III. Its rectangular coordinates are (−1, −√3).
    - slug: precalc-u03-w26-q15
      type: fill_blank
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      prompt: |
        The average rate of change of r = 2θ + 1 with respect to θ over [0, π] is ____.
      answer: ["2"]
      explanation: |
        r(0) = 1 and r(π) = 2π + 1, so the average rate is (2π + 1 − 1)/π = 2. A linear function of θ has a constant rate.
    - slug: precalc-u03-w26-q16
      type: fill_blank
      topic_code: "3.15"
      source: "AP Precalculus CED, Topic 3.15"
      points: 1
      prompt: |
        If r is negative and decreasing on an interval of θ, then the distance between the point (r, θ) and the pole is ____ (increasing or decreasing).
      answer: ["increasing"]
      explanation: |
        r becomes more negative, so |r| grows: r and its change have the same sign, so the distance increases.
    # ---- Spiral review
    - slug: precalc-u03-w26-q17
      type: multiple_choice
      topic_code: "3.14"
      source: "AP Precalculus CED, Topic 3.14"
      points: 1
      prompt: |
        How many petals does the graph of r = 6 sin(5θ) have?
      options:
        - "6"
        - "10"
        - "5"
        - "12"
      option_explanations:
        - |
          6 is the petal length |a|, not the number of petals.
        - |
          2n petals is the rule for even n; for odd n = 5 the negative values of r retrace petals already drawn.
        - |
          Correct. n = 5 is odd, so the rose has n = 5 petals, each of length 6.
        - |
          This doubles the coefficient 6; the number of petals depends on n, not on a.
      answer: 2
    - slug: precalc-u03-w26-q18
      type: multiple_choice
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      prompt: |
        For all x with cos x ≠ sin x, the expression cos(2x)/(cos x − sin x) is equivalent to which of the following?
      options:
        - "cos x + sin x"
        - "cos x − sin x"
        - "1"
        - "−(cos x + sin x)"
      option_explanations:
        - |
          Correct. cos(2x) = cos²x − sin²x = (cos x − sin x)(cos x + sin x); cancelling the common factor leaves cos x + sin x.
        - |
          This treats cos(2x) as (cos x − sin x)², but the identity is a difference of squares, not a square.
        - |
          This treats cos(2x) as equal to cos x − sin x; it is cos²x − sin²x.
        - |
          This uses sin²x − cos²x for cos(2x); the order is cos²x − sin²x, which gives the positive sum.
      answer: 0
