        (c) Use your model to find the first time t > 0 at which the weight is 12 cm above the floor.
      answer: |
        (a) Midline (14 + 6)/2 = 10, amplitude (14 − 6)/2 = 4, period 3 so b = 2π/3, starting at a maximum so use cosine: h(t) = 10 + 4 cos(2πt/3).
        (b) Midline h = 10: the weight's rest height, halfway between the highest and lowest points, is 10 cm. Amplitude 4: the weight moves 4 cm above and 4 cm below that height.
        (c) 10 + 4 cos(2πt/3) = 12 gives cos(2πt/3) = 1/2, so 2πt/3 = π/3 (the first positive solution) and t = 0.5 seconds.
      explanation: |
