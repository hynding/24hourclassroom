      explanation: |
        Three points, one per part. (a) all four solutions, including both signs of the square root (a solution missing the negative root earns 0). (b) a correct general solution, either the compact π-periodic form or four families with + 2πn. (c) the correct three pieces with open endpoints at the boundary values and 0 included.
