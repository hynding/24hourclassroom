week: 23
unit: 3
title: "Trigonometric Equations and Inequalities"
topics: ["3.10"]
guide: guides/week-23.md
guide_description: |
  How to solve sin x = k, cos x = k and tan x = k on [0, 2π) and in general, using reference angles, quadrant
  signs and the periods 2π and π; using an inverse function for one solution and symmetry for the rest; equations
  with an inside multiplier such as sin(2x); equations that are quadratic in sine or cosine or share a common
  factor; and inequalities solved with boundary values. Worked examples include 2 sin x cos x = cos x (factor,
  never divide), 2 cos²x + 3 sin x − 3 = 0, and a hypothetical Ferris wheel model asking how long a rider is
  at least 29 m up.
flashcards_description: |
  30 cards on solving trigonometric equations on an interval and in general, multiple-angle equations, factoring
  quadratic and common-factor forms, calculator solutions, and trigonometric inequalities.

flashcards:
  - front: Solutions of sin x = 1/2 on [0, 2π) → list
    back: |
      π/6 and 5π/6. The reference angle is π/6, and sine is positive in quadrants I and II, so the second answer is π − π/6.
    topic_code: "3.10"
  - front: Solutions of sin x = −1/2 on [0, 2π) → list
    back: |
      7π/6 and 11π/6. Reference angle π/6; sine is negative in quadrants III and IV, giving π + π/6 and 2π − π/6.
    topic_code: "3.10"
  - front: General solution of sin x = −1/2 → write it
    back: |
      x = 7π/6 + 2πn or x = 11π/6 + 2πn, where n is any integer. Add the period 2π to each solution in one cycle.
    topic_code: "3.10"
  - front: Solutions of 2 cos x + √3 = 0 on [0, 2π) → list
    back: |
      cos x = −√3/2, reference angle π/6, cosine negative in quadrants II and III: x = 5π/6 and 7π/6.
    topic_code: "3.10"
  - front: General solution of tan x = 1 → write it
    back: |
      x = π/4 + πn. Tangent has period π, so one solution plus multiples of π covers both π/4 and 5π/4 in each 2π.
    topic_code: "3.10"
  - front: General solution of tan x = −√3 → two equivalent forms
    back: |
      x = −π/3 + πn, or x = 2π/3 + πn. Both describe the same set: −π/3 + π = 2π/3.
    topic_code: "3.10"
  - front: Three-step routine for sin x = k → steps
    back: |
      Isolate sin x; find the reference angle from |k|; place it in every quadrant where sine has the sign of k (then add 2πn if all solutions are wanted). If |k| > 1, stop: no solutions.
    topic_code: "3.10"
  - front: Second solution of sin x = k from x₁ = sin⁻¹ k → formula
    back: |
      x₂ = π − sin⁻¹ k, the mirror image of x₁ across the y-axis (same height on the unit circle). Then add 2πn to both.
    topic_code: "3.10"
  - front: Second solution of cos x = k from x₁ = cos⁻¹ k → formula
    back: |
      x₂ = 2π − cos⁻¹ k (or −cos⁻¹ k), the mirror image across the x-axis (same x-coordinate on the unit circle).
    topic_code: "3.10"
  - front: Solutions of cos x = 0.3 on [0, 2π) → to three decimals
    back: |
      cos⁻¹(0.3) ≈ 1.266 and 2π − 1.266 ≈ 5.017. Quadrants I and IV, where cosine is positive.
    topic_code: "3.10"
  - front: Solutions of sin x = −0.6 on [0, 2π) → to three decimals
    back: |
      sin⁻¹(−0.6) ≈ −0.644 is outside the interval; add 2π to get 5.640. The mirror solution is π + 0.644 ≈ 3.785.
    topic_code: "3.10"
  - front: sin x = 1.2 → how many solutions
    back: |
      None. Sine and cosine only take values in [−1, 1], so any equation that isolates to sin x = k with |k| > 1 has no real solutions.
    topic_code: "3.10"
  - front: Solving sin(2x) = k on [0, 2π) → which interval for 2x
    back: |
      Solve for u = 2x on [0, 4π), two full cycles, then divide every solution by 2. Expect twice as many solutions as for sin x = k.
    topic_code: "3.10"
  - front: Solutions of sin(2x) = √3/2 on [0, 2π) → list
    back: |
      2x = π/3, 2π/3, 7π/3, 8π/3 on [0, 4π), so x = π/6, π/3, 7π/6, 4π/3.
    topic_code: "3.10"
  - front: Solutions of cos(x/2) = 0 on [0, 2π) → list
    back: |
      x/2 runs over [0, π), where cosine is 0 only at π/2. So x = π, a single solution: the stretch halves the number of cycles.
    topic_code: "3.10"
  - front: Counting solutions of sin(bx) = k → quick rule
    back: |
      On an interval of length L the function completes L/P cycles (P = 2π/b). A level strictly between −1 and 1 is hit twice per full cycle. sin(4x) = 0.2 on [0, 2π): 4 cycles, 8 solutions.
    topic_code: "3.10"
  - front: 2 sin²x − sin x − 1 = 0 → factored form and solutions on [0, 2π)
    back: |
      (2 sin x + 1)(sin x − 1) = 0. sin x = −1/2 gives 7π/6, 11π/6; sin x = 1 gives π/2.
    topic_code: "3.10"
  - front: Equation quadratic in cos x → method
    back: |
      Let u = cos x, factor the quadratic in u, then solve cos x = each root (discarding roots outside [−1, 1]). 2 cos²x − cos x − 1 = 0 gives cos x = −1/2 or 1: 2π/3, 4π/3, 0.
    topic_code: "3.10"
  - front: 2 sin x cos x = cos x → solutions on [0, 2π)
    back: |
      cos x (2 sin x − 1) = 0. cos x = 0 gives π/2, 3π/2; sin x = 1/2 gives π/6, 5π/6. Four solutions.
    topic_code: "3.10"
  - front: Mixed sin²x and cos x in one equation → what to do first
    back: |
      Use sin²x + cos²x = 1 to write everything in one function, e.g. replace sin²x by 1 − cos²x, then solve the quadratic in cos x.
    topic_code: "3.10"
  - front: 2 cos²x + 3 sin x − 3 = 0 → solutions on [0, 2π)
    back: |
      Replace cos²x by 1 − sin²x: 2 sin²x − 3 sin x + 1 = 0, so (2 sin x − 1)(sin x − 1) = 0. x = π/6, π/2, 5π/6.
    topic_code: "3.10"
  - front: Trigonometric inequality → the method
    back: |
      Solve the related equation for the boundary values (include asymptotes for tangent), split the interval into pieces, and decide each piece from the graph, the unit circle or a test value.
    topic_code: "3.10"
  - front: sin x ≥ 1/2 on [0, 2π) → solution set
    back: |
      [π/6, 5π/6]. The sine graph is at or above the line y = 1/2 between its two crossings.
    topic_code: "3.10"
  - front: 2 cos x + 1 > 0 on [0, 2π) → solution set
    back: |
      cos x > −1/2, boundaries 2π/3 and 4π/3. Solution [0, 2π/3) ∪ (4π/3, 2π); the middle piece contains π, where cos x = −1.
    topic_code: "3.10"
  - front: tan x > 1 on [0, 2π) → solution set
    back: |
      (π/4, π/2) ∪ (5π/4, 3π/2). Tangent rises on each branch from tan x = 1 up to the vertical asymptote.
    topic_code: "3.10"
  - front: Ferris wheel h(t) = 20 − 18 cos(πt/5) → time at least 29 m per revolution
    back: |
      cos(πt/5) ≤ −1/2 gives 2π/3 ≤ πt/5 ≤ 4π/3, so 10/3 ≤ t ≤ 20/3. That is 10/3 ≈ 3.33 minutes of each 10-minute revolution (hypothetical model).
    topic_code: "3.10"
  - front: Solving trig equations on a graphing calculator → method
    back: |
      Radian mode; graph y₁ = the left side and y₂ = the right side on the stated interval; use intersect once per crossing. Equations like sin x = x/3 can only be solved this way.
    topic_code: "3.10"
  - front: Error-spot → "sin⁻¹(0.5) = π/6, so the answer to sin x = 0.5 on [0, 2π) is π/6"
    back: |
      The inverse function gives one principal value. The unit circle has a second point at height 0.5, at 5π/6. Always look for the mirror solution.
    topic_code: "3.10"
  - front: Error-spot → "divide sin x cos x = cos x by cos x to get sin x = 1"
    back: |
      Dividing by cos x loses every solution with cos x = 0. Factor instead: cos x (sin x − 1) = 0 gives π/2 and 3π/2 on [0, 2π).
    topic_code: "3.10"
  - front: Error-spot → "tan x = 1 has general solution π/4 + 2πn"
    back: |
      Tangent's period is π, not 2π. Using 2πn misses 5π/4, 9π/4, … . The correct family is π/4 + πn.
    topic_code: "3.10"

quiz:
  description: |
    25 questions · about 45 minutes · mostly on this week (topic 3.10: solving trigonometric equations on an
    interval and in general, multiple-angle and factorable equations, and inequalities), with seven items (28%)
    reviewing earlier weeks (unit-circle values, sinusoid features, tangent, inverse trigonometric functions,
    the spring model and exponential equations). Opens with a shared-context set on a hypothetical harbour depth
    model. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items
    are matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes. Two items are marked (Calculator.); the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: a hypothetical harbour depth model (3.10)
    - slug: precalc-u03-w23-q01
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      stimulus: |
        A hypothetical model of the water depth at a harbour is d(t) = 6 + 2 sin(πt/6), where d is the depth in metres and t is the number of hours after midnight, 0 ≤ t < 24.
      prompt: |
        At what times in 0 ≤ t < 12 is the depth exactly 7 metres?
      options:
        - "t = 1 only"
        - "t = 1 and t = 11"
        - "t = 1 and t = 5"
        - "t = 2 and t = 4"
      option_explanations:
        - |
          This stops at the principal value: sin(πt/6) = 1/2 gives πt/6 = π/6 first, but π − π/6 = 5π/6 also works, giving t = 5.
        - |
          This uses the cosine-style mirror angle 2π − π/6 = 11π/6, but sine is negative there; sin(11π/6) = −1/2, so d(11) = 5, not 7.
        - |
          Correct. 6 + 2 sin(πt/6) = 7 gives sin(πt/6) = 1/2, so πt/6 = π/6 or 5π/6, and t = 1 or t = 5.
        - |
          This treats π/3 as the angle whose sine is 1/2; in fact sin(π/3) = √3/2, so d(2) = 6 + √3 ≈ 7.73, not 7.
      answer: 2
    - slug: precalc-u03-w23-q02
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      stimulus: |
        A hypothetical model of the water depth at a harbour is d(t) = 6 + 2 sin(πt/6), where d is the depth in metres and t is the number of hours after midnight, 0 ≤ t < 24.
      prompt: |
        A boat needs at least 7 metres of water. During which times in 0 ≤ t < 12 can it use the harbour?
      options:
        - "1 ≤ t ≤ 5"
        - "0 ≤ t ≤ 1 or 5 ≤ t < 12"
        - "7 ≤ t ≤ 11"
        - "3 ≤ t ≤ 9"
      option_explanations:
        - |
          Correct. The boundary times are t = 1 and t = 5, and between them sin(πt/6) ≥ 1/2 (at t = 3 the depth is the maximum, 8 m).
        - |
          This picks the pieces outside the boundaries, where the depth is below 7 m; for example d(9) = 6 + 2 sin(3π/2) = 4.
        - |
          This solves sin(πt/6) ≤ −1/2, the times when the depth is at most 5 m, instead of at least 7 m.
        - |
          This centres an interval on the wrong time; at t = 9 the depth is at its minimum of 4 m, so the boat cannot enter then.
      answer: 0
    - slug: precalc-u03-w23-q03
      type: numeric
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      stimulus: |
        A hypothetical model of the water depth at a harbour is d(t) = 6 + 2 sin(πt/6), where d is the depth in metres and t is the number of hours after midnight, 0 ≤ t < 24.
      prompt: |
        For how many hours in total during 0 ≤ t < 24 is the depth at most 5 metres? Give a whole number.
      answer: { value: 8, tolerance: 0 }
      explanation: |
        d(t) ≤ 5 means sin(πt/6) ≤ −1/2. With u = πt/6 running over [0, 4π), sin u ≤ −1/2 on [7π/6, 11π/6] and [19π/6, 23π/6]. So t is in [7, 11] or [19, 23]: 4 + 4 = 8 hours.
    # ---- Equations on an interval and in general (3.10)
    - slug: precalc-u03-w23-q04
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      prompt: |
        What are all solutions of 2 cos x − 1 = 0 on the interval [0, 2π)?
      options:
        - "π/6 and 11π/6"
        - "π/3 and 5π/3"
        - "π/3 and 2π/3"
        - "π/3 only"
      option_explanations:
        - |
          These angles have cosine √3/2, not 1/2; the reference angle for a cosine of 1/2 is π/3, not π/6.
        - |
          Correct. cos x = 1/2 has reference angle π/3, and cosine is positive in quadrants I and IV: π/3 and 2π − π/3 = 5π/3.
        - |
          This uses the quadrants where sine is positive; cos(2π/3) = −1/2, so 2π/3 is not a solution.
        - |
          π/3 is the principal value cos⁻¹(1/2), but the quadrant IV angle 5π/3 has the same cosine and is also in the interval.
      answer: 1
    - slug: precalc-u03-w23-q05
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      prompt: |
        Which of the following describes all solutions of tan x = −√3? (n is any integer.)
      options:
        - "x = −π/3 + 2πn"
        - "x = π/3 + πn"
        - "x = 5π/6 + πn"
        - "x = 2π/3 + πn"
      option_explanations:
        - |
          The angle −π/3 is right, but tangent repeats every π, so adding only 2πn misses solutions such as 2π/3.
        - |
          This drops the sign: tan(π/3) = √3, not −√3, so every member of this family gives +√3.
        - |
          This uses the reference angle π/6; tan(5π/6) = −1/√3 = −√3/3, not −√3.
        - |
          Correct. tan(2π/3) = sin(2π/3)/cos(2π/3) = (√3/2)/(−1/2) = −√3, and tangent has period π, so 2π/3 + πn gives every solution.
      answer: 3
    - slug: precalc-u03-w23-q06
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      prompt: |
        What are all solutions of sin(2x) = 1 on the interval [0, 2π)?
      options:
        - "x = π/4 only"
        - "x = π"
        - "x = π/4 and 5π/4"
        - "x = π/4 and 3π/4"
      option_explanations:
        - |
          2x runs over [0, 4π), two full cycles, so sin(2x) reaches 1 twice: at 2x = π/2 and at 2x = 5π/2.
        - |
          This solves sin x = 1 (x = π/2) and then doubles, instead of solving for 2x and halving; sin(2π) = 0.
        - |
          Correct. sin u = 1 at u = π/2 + 2πn. With u = 2x on [0, 4π): u = π/2, 5π/2, so x = π/4 and 5π/4.
        - |
          This applies the π − θ mirror to x; but sin(2 · 3π/4) = sin(3π/2) = −1, so 3π/4 is a minimum, not a solution.
      answer: 2
    - slug: precalc-u03-w23-q07
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      prompt: |
        What are all solutions of 2 sin²x + sin x − 1 = 0 on the interval [0, 2π)?
      options:
        - "7π/6, 11π/6 and π/2"
        - "π/6, 5π/6 and 3π/2"
        - "π/6 and 3π/2"
        - "π/3, 5π/3 and π"
      option_explanations:
        - |
          This comes from factoring as (2 sin x + 1)(sin x − 1), which expands to 2 sin²x − sin x − 1; the middle sign is wrong.
        - |
          Correct. (2 sin x − 1)(sin x + 1) = 0, so sin x = 1/2 (π/6, 5π/6) or sin x = −1 (3π/2).
        - |
          The factoring is right, but sin x = 1/2 has a second solution in quadrant II, 5π/6, which is missing.
        - |
          These solve cos x = 1/2 and cos x = −1, treating the equation as if it were in cosine instead of sine.
      answer: 1
    - slug: precalc-u03-w23-q08
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      prompt: |
        What is the solution set of cos x < √2/2 on the interval [0, 2π)?
      options:
        - "[0, π/4) ∪ (7π/4, 2π)"
        - "(π/4, 3π/4)"
        - "(π/4, 5π/4)"
        - "(π/4, 7π/4)"
      option_explanations:
        - |
          These are the pieces where cos x is greater than √2/2 (test x = 0, where cos 0 = 1); the inequality is reversed.
        - |
          π/4 and 3π/4 are where sine equals √2/2; cos(3π/4) = −√2/2, so the boundary there is wrong and (3π/4, 7π/4) is missed.
        - |
          This uses the tangent-style partner π + π/4; cos(5π/4) = −√2/2, which is not a boundary, and (5π/4, 7π/4) is missed.
        - |
          Correct. cos x = √2/2 at π/4 and 7π/4, and between them (test x = π, where cos π = −1) cosine is below √2/2.
      answer: 3
    - slug: precalc-u03-w23-q09
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      prompt: |
        (Calculator.) What are all solutions of sin x = 0.4 on the interval [0, 2π), to three decimal places?
      options:
        - "x ≈ 0.412 and x ≈ 2.730"
        - "x ≈ 0.412 and x ≈ 5.871"
        - "x ≈ 0.412 only"
        - "x ≈ 23.578 and x ≈ 156.422"
      option_explanations:
        - |
          Correct. sin⁻¹(0.4) ≈ 0.412, and the mirror solution with the same height is π − 0.412 ≈ 2.730 (quadrant II).
        - |
          2π − 0.412 is the cosine-style mirror; there sin x ≈ −0.4, so 5.871 is not a solution.
        - |
          The calculator gives only the principal value; the quadrant II angle π − 0.412 ≈ 2.730 is also a solution.
        - |
          These are the correct angles in degrees; the interval [0, 2π) is in radians, so the calculator must be in radian mode.
      answer: 0
    - slug: precalc-u03-w23-q10
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      prompt: |
        How many solutions does cos(3x) = 0.5 have on the interval [0, 2π)?
      options:
        - "1"
        - "2"
        - "3"
        - "6"
      option_explanations:
        - |
          This counts only the principal value, 3x = π/3 (x = π/9); each cycle of cos(3x) has two points at height 0.5.
        - |
          This ignores the inside multiplier and counts the solutions of cos x = 0.5 instead.
        - |
          The function does complete three cycles on [0, 2π), but each cycle crosses the level 0.5 twice, not once.
        - |
          Correct. 3x runs over [0, 6π), three full cycles, with two solutions per cycle: x = π/9, 5π/9, 7π/9, 11π/9, 13π/9, 17π/9.
      answer: 3
    - slug: precalc-u03-w23-q11
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      prompt: |
        A student solves 2 sin x cos x = √3 cos x on [0, 2π) by dividing both sides by cos x, and gets x = π/3 and x = 2π/3. Which solutions did the student lose?
      options:
        - "0 and π"
        - "π/2 and 3π/2"
        - "π/6 and 11π/6"
        - "4π/3 and 5π/3"
      option_explanations:
        - |
          These are where sin x = 0, but they do not satisfy the equation: at x = 0 the left side is 0 and the right side is √3.
        - |
          Correct. Factoring gives cos x (2 sin x − √3) = 0; dividing by cos x discards cos x = 0, which happens at π/2 and 3π/2.
        - |
          These solve cos x = √3/2, which is not a factor of the equation; at π/6 the left side is √3/2 but the right side is 3/2.
        - |
          These solve sin x = −√3/2, a sign error; at 4π/3 the left side is 2(−√3/2)(−1/2) = √3/2, not equal to the right side −√3/2.
      answer: 1
    - slug: precalc-u03-w23-q12
      type: multi_select
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are solutions of cos(2x) = 0? Select all that apply.
      options:
        - "π/4"
        - "π/2"
        - "3π/4"
        - "3π/2"
        - "7π/4"
      option_explanations:
        - |
          Correct. 2 · π/4 = π/2, and cos(π/2) = 0.
        - |
          2 · π/2 = π, and cos π = −1, not 0. This value solves cos x = 0, not cos(2x) = 0.
        - |
          Correct. 2 · 3π/4 = 3π/2, and cos(3π/2) = 0.
        - |
          2 · 3π/2 = 3π, and cos(3π) = −1. Like π/2, it solves cos x = 0 rather than cos(2x) = 0.
        - |
          Correct. 2 · 7π/4 = 7π/2 = 3π/2 + 2π, and cosine is 0 there.
      answer: [0, 2, 4]
    - slug: precalc-u03-w23-q13
      type: multi_select
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 2
      partial_credit: true
      prompt: |
        Which equations have exactly two solutions on the interval [0, 2π)? Select all that apply.
      options:
        - "sin x = 0.3"
        - "cos x = −1"
        - "tan x = −2"
        - "sin(2x) = 0.5"
        - "cos x = 1.1"
        - "2 cos x = −√3"
      option_explanations:
        - |
          Correct. 0.3 is strictly between −1 and 1, so the horizontal line crosses one cycle of sine twice (quadrants I and II).
        - |
          cos x = −1 only at x = π in one cycle: the level −1 is the minimum, touched once, not crossed twice.
        - |
          Correct. Tangent has period π, so on [0, 2π) it takes every value exactly twice, here in quadrants II and IV.
        - |
          sin(2x) completes two cycles on [0, 2π), so it reaches 0.5 four times: π/12, 5π/12, 13π/12, 17π/12.
        - |
          Cosine never exceeds 1, so cos x = 1.1 has no solutions at all.
        - |
          Correct. cos x = −√3/2 gives 5π/6 and 7π/6, two solutions.
      answer: [0, 2, 5]
    - slug: precalc-u03-w23-q14
      type: true_false
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      prompt: |
        True or false: Because sin⁻¹(0.8) ≈ 0.927, the only solution of sin x = 0.8 on [0, 2π) is x ≈ 0.927.
      answer: false
      explanation: |
        False. sin⁻¹ returns only the principal value. The angle π − 0.927 ≈ 2.214 in quadrant II has the same sine, so there are two solutions on [0, 2π).
    - slug: precalc-u03-w23-q15
      type: true_false
      topic_code: "3.4"
      source: "AP Precalculus CED, Topic 3.4"
      points: 1
      prompt: |
