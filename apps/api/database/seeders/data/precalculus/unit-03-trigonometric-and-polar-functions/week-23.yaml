        A hypothetical model for the air temperature inside a greenhouse is T(t) = 22 − 6 cos(πt/12), where T is in degrees Celsius and t is the number of hours after midnight, 0 ≤ t < 24.

        (A) (i) Find the maximum and minimum temperatures predicted by the model and the times at which they occur.
        (ii) Find the average rate of change of T from t = 0 to t = 6. Include units and interpret your answer.

        (B) Find all times in 0 ≤ t < 24 at which the model predicts a temperature of exactly 25 °C. Show the work that leads to your answer.

        (C) Ventilation fans switch on whenever the temperature is above 25 °C.
        (i) For how many hours per day do the fans run, according to the model? Justify your answer.
        (ii) A classmate solved part (B) by computing t = (12/π) · cos⁻¹(−1/2) on a calculator and reported a single time. Explain why this approach gives only one of the answers and how the second can be found.
      answer: |
        (A)(i) The cosine term ranges from −6 to 6, so T ranges from 16 to 28. The minimum 16 °C occurs when cos(πt/12) = 1, at t = 0 (midnight); the maximum 28 °C occurs when cos(πt/12) = −1, at πt/12 = π, t = 12 (noon).
        (ii) T(0) = 22 − 6 = 16 and T(6) = 22 − 6 cos(π/2) = 22. Average rate of change = (22 − 16)/(6 − 0) = 1 °C per hour: over the first six hours after midnight the temperature rises on average by 1 degree Celsius each hour.
        (B) 22 − 6 cos(πt/12) = 25 gives cos(πt/12) = −1/2. With u = πt/12 on [0, 2π): u = 2π/3 or 4π/3. So t = 8 or t = 16: 8 a.m. and 4 p.m.
        (C)(i) T(t) > 25 means cos(πt/12) < −1/2, which holds for 2π/3 < u < 4π/3 (test u = π, where cos π = −1). So 8 < t < 16, and the fans run for 8 hours per day.
        (ii) cos⁻¹ returns a single value in [0, π], here 2π/3, which gives t = 8. Cosine takes the value −1/2 a second time in each cycle, at 2π − 2π/3 = 4π/3 (the reflection across the x-axis of the unit circle), giving t = 16.
      explanation: |
        Six points.
        (A)(i) 1 point: both extreme values with their times.
        (A)(ii) 1 point: 1 °C per hour with units and a contextual interpretation (no point for the value without units).
        (B) 2 points: 1 for reducing to cos(πt/12) = −1/2 with correct angles 2π/3 and 4π/3; 1 for t = 8 and t = 16.
        (C)(i) 1 point: 8 hours with justification (the interval 8 < t < 16 and why it, not its complement, is the solution).
        (C)(ii) 1 point: the inverse cosine gives only the principal value in [0, π]; the second solution comes from the symmetry 2π − θ.
