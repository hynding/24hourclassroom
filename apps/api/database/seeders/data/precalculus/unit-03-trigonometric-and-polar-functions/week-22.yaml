      prompt: |
        Let g(θ) = 2 tan(θ/2).

        (a) Find the period of g.
        (b) Find the vertical asymptotes of g, and the zero of g on the branch between them that contains θ = 0.
        (c) Find g(π/2) and g(−π/2), and explain how these values are consistent with g being an odd function that is increasing on that branch.
      answer: |
        (a) Period π/(1/2) = 2π.
        (b) Asymptotes where θ/2 = π/2 + kπ, that is θ = π + 2kπ; the branch containing 0 lies between θ = −π and θ = π. Its zero is θ = 0, since g(0) = 2 tan 0 = 0.
        (c) g(π/2) = 2 tan(π/4) = 2 and g(−π/2) = 2 tan(−π/4) = −2. They are opposites, as an odd function requires (g(−θ) = −g(θ)), and −π/2 < 0 < π/2 with −2 < 0 < 2 shows the outputs increasing across the branch.
      explanation: |
        Three points, one per part. (a) 2π. (b) asymptotes θ = π + 2kπ (at least θ = ±π) and the zero at 0. (c) both values and a correct link to odd symmetry and increasing behaviour.
    - slug: precalc-u03-w22-q23
      type: long_answer
      topic_code: "3.8"
      source: "AP Precalculus CED, Topic 3.8"
      points: 6
      prompt: |
        A hypothetical security camera is mounted 20 m from a long straight wall and turns to follow movement. When the camera makes an angle θ radians with the perpendicular from the camera to the wall, it points at a spot x(θ) = 20 tan θ metres along the wall from the foot of that perpendicular (positive to the right). The camera's motion is limited to −π/2 < θ < π/2.

        (A) (i) Find the exact value of x(π/6), and a decimal to the nearest hundredth.
        (ii) Explain, in terms of the tangent function and the context, what happens to x(θ) as θ → π/2⁻.

        (B) Use tan(π/12) = 2 − √3 for this part.
        (i) Find the average rate of change of x over [0, π/12] and over [π/6, π/4], each to the nearest hundredth of a metre per radian.
        (ii) Explain how the comparison in (i) reflects the concavity of the graph of x on (0, π/2).

        (C) (i) Find the angle at which the camera points at a spot 20 m to the right, and, using a calculator, the angle for a spot 35 m to the right, to the nearest hundredth of a radian.
        (ii) Explain why the inverse tangent function gives exactly one angle for each spot on the wall in this context.
      answer: |
        (A) (i) x(π/6) = 20 tan(π/6) = 20/√3 = 20√3/3 ≈ 11.55 m.
        (ii) As θ → π/2⁻, tan θ → ∞ because cos θ → 0⁺ while sin θ → 1, so x(θ) → ∞: the camera turns towards a direction parallel to the wall, and the spot it points at moves further and further along the wall without bound. θ = π/2 is a vertical asymptote of the graph of x.
        (B) (i) Over [0, π/12]: x(π/12) − x(0) = 20(2 − √3) ≈ 5.359, divided by π/12 gives ≈ 20.47 m per radian. Over [π/6, π/4]: x(π/4) − x(π/6) = 20 − 20√3/3 ≈ 8.453, divided by π/12 gives ≈ 32.29 m per radian.
        (ii) Both intervals have length π/12, and the average rate of change is larger on the later interval. Increasing rates of change over equal intervals mean the graph of x is concave up on (0, π/2): each extra bit of turning moves the spot further along the wall the larger θ already is.
        (C) (i) 20 tan θ = 20 gives tan θ = 1, so θ = tan⁻¹(1) = π/4. 20 tan θ = 35 gives θ = tan⁻¹(1.75) ≈ 1.05 radians.
        (ii) The camera's angles −π/2 < θ < π/2 are exactly the restricted domain on which tangent is one-to-one and takes every real value once, and that interval is the range of tan⁻¹. So each position x along the wall corresponds to exactly one angle, θ = tan⁻¹(x/20).
      explanation: |
        Six points. (A) 1 point for 20√3/3 ≈ 11.55 m; 1 point for x → ∞ with a reason (asymptote, cos θ → 0) and a contextual description. (B) 1 point for both rates, 20.47 and 32.29 (accept answers within 0.01); 1 point for linking increasing rates over equal intervals to concave up. (C) 1 point for π/4 and 1.05; 1 point for explaining that the context's domain is tangent's restricted domain, the range of tan⁻¹, so the angle is unique.
