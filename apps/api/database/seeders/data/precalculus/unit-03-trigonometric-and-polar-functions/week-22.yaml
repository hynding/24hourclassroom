week: 22
unit: 3
title: "The Tangent Function and Inverse Trigonometric Functions"
topics: ["3.8", "3.9"]
guide: guides/week-22.md
guide_description: |
  Tangent as the slope of the terminal ray and as sin θ/cos θ; the graph of y = tan θ with period π, vertical
  asymptotes, zeros, concavity and odd symmetry; transformed tangent functions with period π/|b|; then why
  sine, cosine and tangent need restricted domains, the ranges of sin⁻¹, cos⁻¹ and tan⁻¹, their graphs, and
  evaluating them and their compositions. Worked examples: features of 3 tan(θ − π/4) + 1, sin⁻¹(−1/2) and
  cos⁻¹(−√2/2), sin⁻¹(sin(5π/6)), cos(sin⁻¹(3/5)) with a triangle, and a ladder angle.
flashcards_description: |
  30 cards on tangent as slope, the tangent graph and its transformations, restricted domains, ranges of the
  inverse functions, special inverse values and compositions.

flashcards:
  - front: tan θ as a slope → which slope
    back: |
      The slope of the terminal ray of θ: y/x for any point (x, y) on it. On the unit circle, sin θ/cos θ.
    topic_code: "3.8"
  - front: Why the period of tangent is π → reason
    back: |
      θ and θ + π give opposite rays on the same line through the origin, with the same slope. So tan(θ + π) = tan θ.
    topic_code: "3.8"
  - front: Vertical asymptotes of y = tan θ → where and why
    back: |
      θ = π/2 + kπ, where cos θ = 0 and the terminal ray is vertical. Near them the outputs grow without bound.
    topic_code: "3.8"
  - front: Zeros of y = tan θ → where
    back: |
      θ = kπ, where sin θ = 0 and the terminal ray is horizontal.
    topic_code: "3.8"
  - front: tan θ as θ → π/2⁻ and θ → −π/2⁺ → limits
    back: |
      tan θ → ∞ as θ → π/2⁻ (sin → 1, cos → 0⁺) and tan θ → −∞ as θ → −π/2⁺.
    topic_code: "3.8"
  - front: Increasing or decreasing → y = tan θ between asymptotes
    back: |
      Always increasing on every interval between consecutive asymptotes, from −∞ to ∞. It has no maximum or minimum.
    topic_code: "3.8"
  - front: Concavity of y = tan θ on (−π/2, π/2) → pattern
    back: |
      Concave down on (−π/2, 0), concave up on (0, π/2); the zero at 0 is a point of inflection. The pattern repeats every π.
    topic_code: "3.8"
  - front: Domain and range of y = tan θ → state them
    back: |
      Domain: all θ except π/2 + kπ. Range: all real numbers. Tangent has no amplitude.
    topic_code: "3.8"
  - front: Period of a tan(b(θ + c)) + d → formula
    back: |
      π/|b|, not 2π/|b|. tan(3θ) has period π/3; 2 tan(θ/2) has period 2π.
    topic_code: "3.8"
  - front: Asymptotes of 3 tan(θ − π/4) + 1 → where
    back: |
      Where θ − π/4 = π/2 + kπ, so θ = 3π/4 + kπ (…, −π/4, 3π/4, …). The branch's centre is (π/4, 1).
    topic_code: "3.8"
  - front: Negative a in a tan(b(θ + c)) + d → effect
    back: |
      Each branch is reflected, so the function is decreasing between asymptotes. −tan(θ + π/6) decreases on (−2π/3, π/3).
    topic_code: "3.8"
  - front: Slope of a line through the origin at angle 2π/3 → value
    back: |
      tan(2π/3) = (√3/2)/(−1/2) = −√3.
    topic_code: "3.8"
  - front: Why sine needs a restricted domain for an inverse → reason
    back: |
      Sine repeats every output (sin(π/6) = sin(5π/6) = 1/2), so it is not one-to-one. On [−π/2, π/2] it takes each value in [−1, 1] once.
    topic_code: "3.9"
  - front: sin⁻¹ x → domain and range
    back: |
      Domain [−1, 1]; range [−π/2, π/2] (right half of the unit circle).
    topic_code: "3.9"
  - front: cos⁻¹ x → domain and range
    back: |
      Domain [−1, 1]; range [0, π] (top half of the unit circle), where cosine takes every value from −1 to 1 once.
    topic_code: "3.9"
  - front: tan⁻¹ x → domain and range
    back: |
      Domain all real numbers; range (−π/2, π/2), open because tangent is undefined at ±π/2.
    topic_code: "3.9"
  - front: Graph of y = tan⁻¹ x → asymptotes
    back: |
      Horizontal asymptotes y = −π/2 and y = π/2. Tangent's vertical asymptotes become horizontal after reflecting across y = x.
    topic_code: "3.9"
  - front: Graph of y = cos⁻¹ x → endpoints and direction
    back: |
      From (−1, π) down to (1, 0), decreasing, passing through (0, π/2).
    topic_code: "3.9"
  - front: sin⁻¹(−1/2) → value and why not 11π/6
    back: |
      −π/6. The answer must lie in [−π/2, π/2]; 11π/6 has the same sine but is outside that range.
    topic_code: "3.9"
  - front: cos⁻¹(−√2/2) → value
    back: |
      3π/4. Inverse cosine answers lie in [0, π], so a negative input gives a quadrant II angle.
    topic_code: "3.9"
  - front: tan⁻¹(−√3) → value
    back: |
      −π/3, the angle in (−π/2, π/2) with tangent −√3.
    topic_code: "3.9"
  - front: sin⁻¹(sin θ) = θ → when it holds
    back: |
      Only for θ in [−π/2, π/2]. sin⁻¹(sin(5π/6)) = sin⁻¹(1/2) = π/6, not 5π/6.
    topic_code: "3.9"
  - front: sin(sin⁻¹ x) = x → when it holds
    back: |
      For every x in [−1, 1]: whatever angle sin⁻¹ returns, its sine is x. Outside [−1, 1], sin⁻¹ x is undefined.
    topic_code: "3.9"
  - front: cos(sin⁻¹(3/5)) → value with a triangle
    back: |
      θ = sin⁻¹(3/5) is in quadrant I; a right triangle with opposite 3 and hypotenuse 5 has adjacent 4, so cos θ = 4/5.
    topic_code: "3.9"
  - front: tan(cos⁻¹(−1/2)) → value
    back: |
      cos⁻¹(−1/2) = 2π/3, and tan(2π/3) = −√3.
    topic_code: "3.9"
  - front: Ladder 6 m long, top 5.2 m up a wall → angle with the ground
    back: |
      θ = sin⁻¹(5.2/6) ≈ 1.05 radians (about 60°). The context needs an acute angle, which sin⁻¹ returns.
    topic_code: "3.9"
  - front: sin⁻¹ x notation → what it does not mean
    back: |
      It is not 1/sin x. The −1 marks the inverse function; 1/sin x is csc x.
    topic_code: "3.9"
  - front: Error-spot → "tan(2θ) has period π because tangent's period is π"
    back: |
      The dilation changes it: period π/|b| = π/2.
    topic_code: "3.8"
  - front: Error-spot → "cos⁻¹(cos(−π/3)) = −π/3"
    back: |
      cos⁻¹ never returns a negative angle. cos(−π/3) = 1/2 and cos⁻¹(1/2) = π/3.
    topic_code: "3.9"
  - front: Error-spot → "cos(sin⁻¹(−3/5)) = −4/5"
    back: |
      sin⁻¹(−3/5) is in quadrant IV, where cosine is positive, so the value is 4/5.
    topic_code: "3.9"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 3.8 and 3.9: tangent as slope, the tangent
    graph and its transformations, restricted domains, inverse trigonometric values and compositions), with
    about 30% reviewing weeks 18–21 (tangent from a point, exact values, sinusoid features) and Units 1 and 2
    (end behaviour, logarithm properties, logarithmic equations). Includes a shared-context set on
    f(θ) = 3 tan(θ − π/4) + 1. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes. Items marked (Calculator.) need a calculator; the rest are designed
    to be done by hand.
  questions:
    # ---- Stimulus set: a transformed tangent (3.8)
    - slug: precalc-u03-w22-q01
      type: multiple_choice
      topic_code: "3.8"
      source: "AP Precalculus CED, Topic 3.8"
      points: 1
      stimulus: |
        Let f(θ) = 3 tan(θ − π/4) + 1.
      prompt: |
        What is the period of f?
      options:
        - "2π"
        - "π"
        - "π/4"
        - "3π"
      option_explanations:
        - |
          2π is the period of sine and cosine; tangent repeats every π.
        - |
          Correct. b = 1, so the period is π/|b| = π. The 3, the shift and the +1 do not change it.
        - |
          π/4 is the horizontal shift, which moves the graph without changing its period.
        - |
          The vertical dilation by 3 does not affect the period; only b does.
      answer: 1
    - slug: precalc-u03-w22-q02
      type: multiple_choice
      topic_code: "3.8"
      source: "AP Precalculus CED, Topic 3.8"
      points: 1
      stimulus: |
        Let f(θ) = 3 tan(θ − π/4) + 1.
      prompt: |
        Which line is a vertical asymptote of the graph of f?
      options:
        - "θ = π/2"
        - "θ = π/4"
        - "θ = 3π/4"
        - "θ = 0"
      option_explanations:
        - |
          θ = π/2 is an asymptote of tan θ, but the graph of f is shifted π/4 to the right.
        - |
          At θ = π/4 the inside is 0 and f(π/4) = 1; this is the centre of a branch, not an asymptote.
        - |
          Correct. Asymptotes occur where θ − π/4 = π/2 + kπ; k = 0 gives θ = 3π/4.
        - |
          f(0) = 3 tan(−π/4) + 1 = −2 is defined, so θ = 0 is not an asymptote.
      answer: 2
    - slug: precalc-u03-w22-q03
      type: multiple_choice
      topic_code: "3.8"
      source: "AP Precalculus CED, Topic 3.8"
      points: 1
      stimulus: |
        Let f(θ) = 3 tan(θ − π/4) + 1.
      prompt: |
        What is the value of f(π/2)?
      options:
        - "4"
        - "3"
        - "1"
        - "−2"
      option_explanations:
        - |
          Correct. f(π/2) = 3 tan(π/4) + 1 = 3 · 1 + 1 = 4.
        - |
          This finds 3 tan(π/4) = 3 but leaves off the vertical translation +1.
        - |
          1 is f(π/4), the centre of the branch, where the tangent is 0.
        - |
          This adds π/4 instead of subtracting: 3 tan(3π/4) + 1 = −3 + 1 = −2.
      answer: 0
    - slug: precalc-u03-w22-q04
      type: multiple_choice
      topic_code: "3.8"
      source: "AP Precalculus CED, Topic 3.8"
      points: 1
      stimulus: |
        Let f(θ) = 3 tan(θ − π/4) + 1.
      prompt: |
        Which statement describes f(θ) as θ approaches 3π/4 from the left?
      options:
        - "f(θ) → −∞"
        - "f(θ) → 1"
        - "f(θ) → 0"
        - "f(θ) → ∞"
      option_explanations:
        - |
          That happens approaching 3π/4 from the right, at the start of the next branch; from the left the branch is rising.
        - |
          1 is the value at the centre of the branch, θ = π/4, not near the asymptote.
        - |
          Near an asymptote the outputs grow without bound; they do not settle at 0.
        - |
          Correct. As θ → 3π/4⁻, θ − π/4 → π/2⁻, so tan(θ − π/4) → ∞, and with a = 3 > 0, f(θ) → ∞.
      answer: 3
    # ---- Topics 3.8 and 3.9
    - slug: precalc-u03-w22-q05
      type: multiple_choice
      topic_code: "3.8"
      source: "AP Precalculus CED, Topic 3.8"
      points: 1
      prompt: |
        On which interval is y = tan θ increasing and concave down?
      options:
        - "(−π/2, 0)"
        - "(0, π/2)"
        - "(−π/2, π/2)"
        - "(−π, −π/2)"
      option_explanations:
        - |
          Correct. Tangent increases on the whole branch, and to the left of its zero at 0 it rises more and more slowly towards 0, so it is concave down.
        - |
          Tangent increases here, but faster and faster towards the asymptote, so it is concave up.
        - |
          The concavity changes at θ = 0, so the graph is not concave down on the whole branch.
        - |
          This interval is (0, π/2) shifted by −π, so the graph is concave up there.
      answer: 0
    - slug: precalc-u03-w22-q06
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Precalculus CED, Topic 3.2"
      points: 1
      prompt: |
        The terminal ray of an angle θ in standard position passes through (4, −3). What is tan θ?
      options:
        - "−4/3"
        - "3/4"
        - "−3/4"
        - "−3/5"
      option_explanations:
        - |
          −4/3 is x/y, the reciprocal of the slope; tan θ = y/x.
        - |
          The size is right, but the ray falls from the origin to (4, −3), so the slope is negative.
        - |
          Correct. tan θ = y/x = −3/4, the slope of the terminal ray in quadrant IV.
        - |
          −3/5 is y/r = sin θ; tangent divides by x, not by r.
      answer: 2
    - slug: precalc-u03-w22-q07
      type: multiple_choice
      topic_code: "3.9"
      source: "AP Precalculus CED, Topic 3.9"
      points: 1
      prompt: |
        What is the value of sin⁻¹(−1/2)?
      options:
        - "7π/6"
        - "11π/6"
        - "−π/3"
        - "−π/6"
      option_explanations:
        - |
          sin(7π/6) = −1/2, but 7π/6 is not in [−π/2, π/2], the range of inverse sine.
        - |
          11π/6 has sine −1/2 and is coterminal with the answer, but the range of inverse sine is [−π/2, π/2].
        - |
          sin(−π/3) = −√3/2, not −1/2; this mixes up the π/6 and π/3 values.
        - |
          Correct. −π/6 is in [−π/2, π/2] and sin(−π/6) = −1/2.
      answer: 3
    - slug: precalc-u03-w22-q08
      type: multiple_choice
      topic_code: "3.9"
      source: "AP Precalculus CED, Topic 3.9"
      points: 1
      prompt: |
        What is the value of cos⁻¹(−√2/2)?
      options:
        - "−π/4"
        - "3π/4"
        - "5π/4"
        - "π/4"
      option_explanations:
        - |
          Inverse cosine never returns a negative angle, and cos(−π/4) = √2/2 is positive anyway.
        - |
          Correct. The range of inverse cosine is [0, π], and cos(3π/4) = −√2/2.
        - |
          cos(5π/4) = −√2/2, but 5π/4 is outside [0, π], the range of inverse cosine.
        - |
          cos(π/4) = √2/2; the input is negative, so the angle must be in quadrant II.
      answer: 1
    - slug: precalc-u03-w22-q09
      type: multiple_choice
      topic_code: "3.9"
      source: "AP Precalculus CED, Topic 3.9"
      points: 1
      prompt: |
        What is the value of sin⁻¹(sin(4π/5))?
      options:
        - "4π/5"
        - "−π/5"
        - "π/5"
        - "−4π/5"
      option_explanations:
        - |
          The inverse undoes sine only on [−π/2, π/2], and 4π/5 is outside that interval.
        - |
          sin(4π/5) is positive, so the answer must be a positive angle in [−π/2, π/2].
        - |
          Correct. sin(4π/5) = sin(π − 4π/5) = sin(π/5), and π/5 is in [−π/2, π/2].
        - |
          −4π/5 is outside the range [−π/2, π/2] and has a negative sine.
      answer: 2
    - slug: precalc-u03-w22-q10
      type: multiple_choice
      topic_code: "3.9"
      source: "AP Precalculus CED, Topic 3.9"
      points: 1
      prompt: |
        What is the exact value of cos(tan⁻¹(3/4))?
      options:
        - "4/5"
        - "3/5"
        - "3/4"
        - "5/4"
      option_explanations:
        - |
          Correct. θ = tan⁻¹(3/4) is in quadrant I; a right triangle with opposite 3 and adjacent 4 has hypotenuse 5, so cos θ = 4/5.
        - |
          3/5 is opposite/hypotenuse, which is sin θ.
        - |
          3/4 is tan θ itself; the question asks for the cosine of the angle.
        - |
          5/4 is hypotenuse/adjacent, the reciprocal of the cosine; a cosine cannot exceed 1.
      answer: 0
    # ---- Spiral review
    - slug: precalc-u03-w22-q11
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 1
      prompt: |
        Which expression is equal to sin(θ − π/2) for every θ?
      options:
        - "cos θ"
        - "−sin θ"
        - "cos(θ − π/2)"
        - "−cos θ"
      option_explanations:
        - |
          cos θ = sin(θ + π/2), a shift to the left; this expression shifts sine to the right.
        - |
          −sin θ is sin(θ + π), a shift of half a period, not a quarter.
        - |
          cos(θ − π/2) shifts cosine right by π/2, which gives sin θ, not sin(θ − π/2).
        - |
          Correct. Shifting sine right by π/2 moves its minimum to θ = 0, which is the graph of −cos θ; check θ = 0: sin(−π/2) = −1 = −cos 0.
      answer: 3
    - slug: precalc-u03-w22-q12
      type: multiple_choice
      topic_code: "2.12"
      source: "AP Precalculus CED, Topic 2.12"
      points: 1
      prompt: |
        For x > 0, which expression is equivalent to log₅(25x³)?
      options:
        - "3 log₅(25x)"
        - "2 + 3 log₅ x"
        - "25 + 3 log₅ x"
        - "6 log₅ x"
      option_explanations:
        - |
          The exponent 3 applies only to x, not to 25, so it cannot be brought out of the whole product.
        - |
          Correct. log₅ 25 + log₅ x³ = 2 + 3 log₅ x, by the product and power properties.
        - |
          The product property gives log₅ 25, which is 2, not 25.
        - |
          This multiplies the exponents of 5² and x³; the product property adds the logs instead.
      answer: 1
    - slug: precalc-u03-w22-q13
      type: multi_select
      topic_code: "3.9"
      source: "AP Precalculus CED, Topic 3.9"
      points: 2
      partial_credit: true
      prompt: |
        Which statements are true? Select all that apply.
      options:
        - "cos⁻¹(cos(−π/3)) = −π/3"
        - "The range of sin⁻¹ x is [−π/2, π/2]."
        - "sin⁻¹(2) = π/2 + 1"
        - "The domain of cos⁻¹ x is [−1, 1]."
        - "tan⁻¹ x → π/2 as x → ∞."
      option_explanations:
        - |
          cos(−π/3) = 1/2 and cos⁻¹(1/2) = π/3; inverse cosine never returns a negative angle.
        - |
          Correct. Sine is restricted to [−π/2, π/2] to define its inverse, so that interval is the range of sin⁻¹.
        - |
          No angle has a sine of 2, so sin⁻¹(2) is undefined; the domain of sin⁻¹ is [−1, 1].
        - |
          Correct. Cosine takes values only from −1 to 1, so those are the only inputs inverse cosine accepts.
        - |
          Correct. The graph of tan⁻¹ has horizontal asymptote y = π/2 on the right, from tangent's vertical asymptote at π/2.
      answer: [1, 3, 4]
    - slug: precalc-u03-w22-q14
      type: multi_select
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 2
      partial_credit: true
      prompt: |
        A hypothetical model gives the temperature in a cold-storage room as h(t) = 10 + 4 sin(πt/6) degrees Celsius, t hours after a cooling cycle starts. Which statements are true? Select all that apply.
      options:
        - "The midline of h is h = 10."
        - "The amplitude of h is 8."
        - "The period of h is 12 hours."
        - "The minimum temperature occurs at t = 6."
        - "The maximum temperature is 14 degrees Celsius."
      option_explanations:
        - |
          Correct. The constant d = 10 is the midline, the average temperature over a cycle.
        - |
          The amplitude is |a| = 4; 8 is the full distance from minimum to maximum.
        - |
          Correct. The period is 2π/(π/6) = 12 hours.
        - |
          h(6) = 10 + 4 sin π = 10, the midline. The minimum is at t = 9, where sin(3π/2) = −1.
        - |
          Correct. The maximum is d + |a| = 10 + 4 = 14, at t = 3.
      answer: [0, 2, 4]
    - slug: precalc-u03-w22-q15
      type: true_false
      topic_code: "3.8"
      source: "AP Precalculus CED, Topic 3.8"
      points: 1
      prompt: |
        True or false: The period of y = tan(2θ) is π.
      answer: false
      explanation: |
        False. The period of a tan(bθ) is π/|b|, so tan(2θ) has period π/2. Its asymptotes are at θ = π/4 + kπ/2.
    - slug: precalc-u03-w22-q16
      type: true_false
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        True or false: sin(π/3) = 2 sin(π/6).
      answer: false
      explanation: |
        False. sin(π/3) = √3/2 ≈ 0.866, but 2 sin(π/6) = 2 · 1/2 = 1. Doubling the angle does not double the sine.
    - slug: precalc-u03-w22-q17
      type: fill_blank
      topic_code: "3.9"
      source: "AP Precalculus CED, Topic 3.9"
      points: 1
      prompt: |
        The exact value of tan⁻¹(1), in radians, is ____.
      answer: ["π/4", "pi/4", "(1/4)π", "1/4π", "0.25π"]
      explanation: |
        tan(π/4) = 1 and π/4 lies in (−π/2, π/2), the range of inverse tangent.
    - slug: precalc-u03-w22-q18
      type: fill_blank
      topic_code: "1.7"
      source: "AP Precalculus CED, Topic 1.7"
      points: 1
      prompt: |
        The limit of (3x² + 1)/(x³ − 2) as x → ∞ is ____.
      answer: ["0"]
      explanation: |
        The denominator has the higher degree, so the ratio of leading terms is 3x²/x³ = 3/x, which approaches 0.
    - slug: precalc-u03-w22-q19
      type: numeric
      topic_code: "3.9"
      source: "AP Precalculus CED, Topic 3.9"
      points: 1
      prompt: |
        (Calculator.) A ladder 6 m long leans against a vertical wall, and its top is 5.2 m above level ground. To the nearest hundredth of a radian, what angle does the ladder make with the ground?
      answer: { value: 1.05, tolerance: 0.01 }
      explanation: |
        The ladder is the hypotenuse and the height is opposite the angle, so sin θ = 5.2/6 and θ = sin⁻¹(5.2/6) ≈ 1.048, which is 1.05 radians to the nearest hundredth (about 60°).
    - slug: precalc-u03-w22-q20
      type: numeric
      topic_code: "2.13"
      source: "AP Precalculus CED, Topic 2.13"
      points: 1
      prompt: |
        Solve log₂(x + 3) = 5. Give the exact value of x.
      answer: { value: 29, tolerance: 0 }
      explanation: |
        Rewrite in exponential form: x + 3 = 2⁵ = 32, so x = 29. Check: log₂ 32 = 5.
    - slug: precalc-u03-w22-q21
      type: short_answer
      topic_code: "3.9"
      source: "AP Precalculus CED, Topic 3.9"
      points: 3
      prompt: |
        Answer without a calculator.

        (a) Find the exact value of cos⁻¹(−1/2), and explain why it is not −2π/3 or 4π/3.
        (b) Find the exact value of sin(cos⁻¹(−1/2)).
        (c) A student writes cos⁻¹(cos(5π/3)) = 5π/3. Explain the error and give the correct value.
      answer: |
        (a) 2π/3. The range of inverse cosine is [0, π]; −2π/3 and 4π/3 both have cosine −1/2 but lie outside that range.
        (b) sin(2π/3) = √3/2.
        (c) Inverse cosine undoes cosine only for angles in [0, π], and 5π/3 is not in that interval. cos(5π/3) = 1/2, and cos⁻¹(1/2) = π/3, so the correct value is π/3.
      explanation: |
        Three points, one per part. (a) 2π/3 with a reference to the range [0, π]. (b) √3/2. (c) identifies that 5π/3 is outside [0, π] and gives π/3.
