  # ---- True or false
  - slug: precalc-u03-exam-q35
    type: true_false
    topic_code: "3.1"
    source: "AP Precalculus CED, Topic 3.1"
    points: 1
    prompt: |
      True or false: If f is periodic with period 4, then f(x + 8) = f(x) for every x in the domain of f.
    answer: true
    explanation: |
      True. Shifting the input by one period leaves the output unchanged, and 8 is two periods: f(x + 8) = f((x + 4) + 4) = f(x + 4) = f(x).
  - slug: precalc-u03-exam-q36
    type: true_false
    topic_code: "3.11"
    source: "AP Precalculus CED, Topic 3.11"
    points: 1
    prompt: |
      True or false: The range of y = sec x is [−1, 1].
    answer: false
    explanation: |
      False. [−1, 1] is the range of cosine. Since |cos x| ≤ 1, its reciprocal satisfies |sec x| ≥ 1, so the range of secant is (−∞, −1] ∪ [1, ∞).
