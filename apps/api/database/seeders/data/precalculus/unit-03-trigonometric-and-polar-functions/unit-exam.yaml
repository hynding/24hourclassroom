unit: 3
description: |
  46 questions · about 90 minutes · every topic of Unit 3 (3.1 to 3.15): periodic phenomena, sine, cosine and
  tangent on circles and the unit circle, sinusoidal graphs, transformations and models, the tangent and inverse
  trigonometric functions, equations and inequalities, the reciprocal functions and identities, polar coordinates,
  complex numbers in polar form, polar graphs and rates of change in polar functions, with a little review of
  Units 1 and 2. Includes three shared-context sets (a hypothetical temperature model, an angle through a given
  point, and a limaçon), select-all, true/false, fill-in-the-blank and numeric items, two short-answer questions
  (3 points each) and two free-response questions in the AP style (6 points each: a periodic modelling context and
  symbolic manipulation). Seven items are marked (Calculator.); the rest are designed to be done by hand. Multiple
  choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
  automatically; the free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a hypothetical monthly temperature model (3.5, 3.7, 3.10)
  - slug: precalc-u03-exam-q01
    type: multiple_choice
    topic_code: "3.7"
    source: "AP Precalculus CED, Topic 3.7"
    points: 1
    stimulus: |
      In a hypothetical model, the average monthly temperature T in a city, in degrees Celsius, varies sinusoidally with the month number t (t = 1 for January, t = 2 for February, and so on), with a period of 12 months. The lowest average, 4 °C, occurs at t = 1, and the highest, 28 °C, occurs at t = 7.
    prompt: |
      Which function fits this description?
    options:
      - "T(t) = 16 + 12 cos(π(t − 1)/6)"
      - "T(t) = 16 − 12 cos(π(t − 1)/6)"
      - "T(t) = 16 − 12 cos(π(t − 1)/12)"
      - "T(t) = 16 − 24 cos(π(t − 1)/6)"
    option_explanations:
      - |
        This has its maximum, 28, at t = 1; the model needs the minimum there, so the cosine must be negated.
      - |
        Correct. Midline (28 + 4)/2 = 16, amplitude (28 − 4)/2 = 12, b = 2π/12 = π/6, and −cos starting at t = 1 puts the minimum 4 at t = 1 and the maximum 28 at t = 7.
      - |
        π/12 gives a period of 24 months, using the half-period from minimum to maximum as if it were a quarter of a cycle.
      - |
        24 is the full range, 28 − 4; the amplitude is half of it, so this model would run from −8 °C to 40 °C.
    answer: 1
  - slug: precalc-u03-exam-q02
    type: multiple_choice
    topic_code: "3.5"
    source: "AP Precalculus CED, Topic 3.5"
    points: 1
    stimulus: |
      In a hypothetical model, the average monthly temperature T in a city, in degrees Celsius, varies sinusoidally with the month number t (t = 1 for January, t = 2 for February, and so on), with a period of 12 months. The lowest average, 4 °C, occurs at t = 1, and the highest, 28 °C, occurs at t = 7.
    prompt: |
      On which interval is T increasing and its graph concave up?
    options:
      - "4 < t < 7"
      - "7 < t < 10"
      - "10 < t < 13"
      - "1 < t < 4"
    option_explanations:
      - |
        T is increasing on (4, 7), but above the midline, approaching the maximum, the graph is concave down.
      - |
        After the maximum at t = 7, T is decreasing, and above the midline it is concave down.
      - |
        Below the midline after t = 10 the graph is concave up, but T is decreasing toward the minimum at t = 13.
      - |
        Correct. From the minimum at t = 1 to the rising midline crossing at t = 4 (where T = 16), T increases and the graph bends upward.
    answer: 3
  - slug: precalc-u03-exam-q03
    type: multiple_choice
    topic_code: "3.10"
    source: "AP Precalculus CED, Topic 3.10"
    points: 1
    stimulus: |
      In a hypothetical model, the average monthly temperature T in a city, in degrees Celsius, varies sinusoidally with the month number t (t = 1 for January, t = 2 for February, and so on), with a period of 12 months. The lowest average, 4 °C, occurs at t = 1, and the highest, 28 °C, occurs at t = 7.
    prompt: |
      (Calculator.) Using the model that fits this description, during which interval of 1 ≤ t ≤ 13 is the average temperature at least 25 °C?
    options:
      - "5.620 ≤ t ≤ 8.380"
      - "4.620 ≤ t ≤ 7.380"
      - "1 ≤ t ≤ 5.620 or 8.380 ≤ t ≤ 13"
      - "5.620 ≤ t ≤ 7"
    option_explanations:
      - |
        Correct. 16 − 12 cos(π(t − 1)/6) ≥ 25 gives cos(π(t − 1)/6) ≤ −0.75, so 2.419 ≤ π(t − 1)/6 ≤ 2π − 2.419. Then t − 1 is between 4.620 and 7.380, and t is between 5.620 and 8.380.
      - |
        These are the values of t − 1; the horizontal shift of 1 month has to be added back to get t.
      - |
        These are the times when the temperature is at most 25 °C, the complement of the required set.
      - |
        This stops at the maximum, t = 7; the temperature stays at or above 25 °C after the peak until t ≈ 8.380, by symmetry.
    answer: 0
  # ---- Stimulus set B: an angle through a given point (3.2, 3.11, 3.12)
  - slug: precalc-u03-exam-q04
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Precalculus CED, Topic 3.2"
    points: 1
    stimulus: |
      An angle θ is in standard position, and its terminal ray passes through the point (−8, 15).
    prompt: |
      What is the exact value of cos θ?
    options:
      - "−8/15"
      - "15/17"
      - "−8/17"
      - "8/17"
    option_explanations:
      - |
        This divides x by y, which is cot θ; cos θ = x/r, where r is the distance from the origin.
      - |
        15/17 = y/r is sin θ; cosine uses the x-coordinate.
      - |
        Correct. r = √(64 + 225) = 17, so cos θ = x/r = −8/17.
      - |
        The point has x = −8, in quadrant II, so cosine is negative.
    answer: 2
  - slug: precalc-u03-exam-q05
    type: multiple_choice
    topic_code: "3.11"
    source: "AP Precalculus CED, Topic 3.11"
    points: 1
    stimulus: |
      An angle θ is in standard position, and its terminal ray passes through the point (−8, 15).
    prompt: |
      What is the exact value of cot θ?
    options:
      - "−8/15"
      - "−15/8"
      - "−17/8"
      - "17/15"
    option_explanations:
      - |
        Correct. cot θ = cos θ/sin θ = x/y = −8/15.
      - |
        −15/8 = y/x is tan θ; cotangent is its reciprocal.
      - |
        −17/8 = r/x is sec θ, the reciprocal of cosine.
      - |
        17/15 = r/y is csc θ, the reciprocal of sine.
    answer: 0
  - slug: precalc-u03-exam-q06
    type: multiple_choice
    topic_code: "3.12"
    source: "AP Precalculus CED, Topic 3.12"
    points: 1
    stimulus: |
      An angle θ is in standard position, and its terminal ray passes through the point (−8, 15).
    prompt: |
      What is the exact value of cos(2θ)?
    options:
      - "161/289"
      - "−16/17"
      - "−240/289"
      - "−161/289"
    option_explanations:
      - |
        This is sin²θ − cos²θ = (225 − 64)/289; the identity is cos²θ − sin²θ, so the sign is reversed.
      - |
        This is 2 cos θ; cos(2θ) is not twice cos θ.
      - |
        −240/289 = 2 sin θ cos θ is sin(2θ), not cos(2θ).
      - |
        Correct. cos(2θ) = cos²θ − sin²θ = 64/289 − 225/289 = −161/289.
    answer: 3
  # ---- Stimulus set C: a limaçon (3.13, 3.14, 3.15)
  - slug: precalc-u03-exam-q07
    type: multiple_choice
    topic_code: "3.14"
    source: "AP Precalculus CED, Topic 3.14"
    points: 1
    stimulus: |
      Consider the polar function r = f(θ) = 3 + 6 sin θ for 0 ≤ θ < 2π.
    prompt: |
      Which best describes the graph of f?
    options:
      - "A cardioid"
      - "A limaçon with an inner loop"
      - "A rose with 6 petals"
      - "A circle of diameter 6 through the pole"
    option_explanations:
      - |
        A cardioid needs |a| = |b|; here |a| = 3 and |b| = 6.
      - |
        Correct. r = a + b sin θ with |a| = 3 < |b| = 6, so r is negative for some θ and an inner loop forms.
      - |
        A rose has the form a sin(nθ) with no constant term; 6 is the coefficient of sin θ, not a petal count.
      - |
        r = 6 sin θ alone would be that circle; the added constant 3 makes the graph a limaçon.
    answer: 1
  - slug: precalc-u03-exam-q08
    type: multiple_choice
    topic_code: "3.15"
    source: "AP Precalculus CED, Topic 3.15"
    points: 1
    stimulus: |
      Consider the polar function r = f(θ) = 3 + 6 sin θ for 0 ≤ θ < 2π.
    prompt: |
      As θ increases from π/2 to π, which describes the points (f(θ), θ)?
    options:
      - "r is increasing, so the points move away from the pole."
      - "r is negative, so the points move toward the pole."
      - "r is positive and decreasing, so the points move toward the pole."
      - "r is positive and decreasing, so the points move away from the pole."
    option_explanations:
      - |
        sin θ decreases from 1 to 0 on this interval, so r decreases, from 9 to 3.
      - |
        r runs from 9 to 3 on this interval, so it is positive throughout.
      - |
        Correct. r falls from 9 to 3 while positive, so the distance |r| decreases and the points approach the pole.
      - |
        The description of r is right, but a positive, decreasing r means the distance from the pole is shrinking.
    answer: 2
  - slug: precalc-u03-exam-q09
    type: multiple_choice
    topic_code: "3.13"
    source: "AP Precalculus CED, Topic 3.13"
    points: 1
    stimulus: |
      Consider the polar function r = f(θ) = 3 + 6 sin θ for 0 ≤ θ < 2π.
    prompt: |
      What are the rectangular coordinates of the point on the graph where θ = 3π/2?
    options:
      - "(0, 3)"
      - "(0, −3)"
      - "(0, −9)"
      - "(−3, 0)"
    option_explanations:
      - |
        Correct. f(3π/2) = 3 − 6 = −3. Then x = −3 cos(3π/2) = 0 and y = −3 sin(3π/2) = 3. The negative r sends the point up, the top of the inner loop.
      - |
        This plots r = −3 in the direction 3π/2 as if r were positive; negative r points the opposite way.
      - |
        This uses sin(3π/2) = +1 to get r = 9 and then plots it downward; sin(3π/2) = −1, so r = −3.
      - |
        This places |r| on the x-axis; the ray at 3π/2 is vertical, so x = r cos(3π/2) = 0.
    answer: 0
  - slug: precalc-u03-exam-q10
    type: numeric
    topic_code: "3.15"
    source: "AP Precalculus CED, Topic 3.15"
    points: 1
    stimulus: |
      Consider the polar function r = f(θ) = 3 + 6 sin θ for 0 ≤ θ < 2π.
    prompt: |
      Find the average rate of change of f with respect to θ over [0, π/6]. Give your answer to the nearest hundredth.
    answer: { value: 5.73, tolerance: 0.01 }
    explanation: |
      f(0) = 3 and f(π/6) = 3 + 6(1/2) = 6. Average rate = (6 − 3)/(π/6) = 18/π ≈ 5.73 units per radian.
  # ---- Topics 3.1 to 3.14
  - slug: precalc-u03-exam-q11
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Precalculus CED, Topic 3.1"
    points: 1
    prompt: |
      A periodic function f has period 5, with f(2) = 7 and f(4) = −1. What is f(17)?
    options:
      - "−1"
      - "35"
      - "21"
      - "7"
    option_explanations:
      - |
        This reduces 17 by 13 to reach 4, but 13 is not a multiple of the period 5; only multiples of 5 can be removed.
      - |
        This multiplies f(2) by the period; periodic outputs repeat, they do not scale with the number of cycles.
      - |
        This adds 7 for each of the three periods between 2 and 17; a periodic function returns the same output each cycle.
      - |
        Correct. 17 = 2 + 3 · 5, so f(17) = f(2) = 7.
    answer: 3
  - slug: precalc-u03-exam-q12
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Precalculus CED, Topic 3.2"
    points: 1
    prompt: |
      (Calculator.) A point moves on a circle of radius 6 centred at the origin. To three decimal places, what are its coordinates when it is at an angle of 2 radians in standard position?
    options:
      - "(5.456, −2.497)"
      - "(−2.497, 5.456)"
      - "(5.996, 0.209)"
      - "(−0.416, 0.909)"
    option_explanations:
      - |
        This swaps the coordinates; the x-coordinate is 6 cos 2 and the y-coordinate is 6 sin 2.
      - |
        Correct. (6 cos 2, 6 sin 2) ≈ (6(−0.416), 6(0.909)) ≈ (−2.497, 5.456), in quadrant II since 2 is between π/2 and π.
      - |
        These come from a calculator in degree mode (2°); the angle is 2 radians.
      - |
        These are cos 2 and sin 2 on the unit circle; on a circle of radius 6 both must be multiplied by 6.
    answer: 1
  - slug: precalc-u03-exam-q13
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Precalculus CED, Topic 3.3"
    points: 1
    prompt: |
      What is the exact value of cos(11π/6)?
    options:
      - "−√3/2"
      - "1/2"
      - "√3/2"
      - "−1/2"
    option_explanations:
      - |
        The reference angle π/6 is right, but 11π/6 is in quadrant IV, where cosine (the x-coordinate) is positive.
      - |
        1/2 is the cosine of a reference angle of π/3; the reference angle of 11π/6 is 2π − 11π/6 = π/6.
      - |
        Correct. 11π/6 is in quadrant IV with reference angle π/6; its unit-circle point is (√3/2, −1/2).
      - |
        −1/2 is sin(11π/6), the y-coordinate, not the cosine.
    answer: 2
  - slug: precalc-u03-exam-q14
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Precalculus CED, Topic 3.4"
    points: 1
    prompt: |
      On which interval is y = cos θ both increasing and concave down?
    options:
      - "(0, π/2)"
      - "(π/2, π)"
      - "(π, 3π/2)"
      - "(3π/2, 2π)"
    option_explanations:
      - |
        Cosine is concave down here (above its midline) but decreasing from its maximum at 0.
      - |
        Cosine is decreasing here toward its minimum at π, and concave up below the midline.
      - |
        Cosine is increasing here, but below the midline it is concave up.
      - |
        Correct. After crossing the midline at 3π/2 the graph keeps rising toward the maximum at 2π, bending downward.
    answer: 3
  - slug: precalc-u03-exam-q15
    type: multiple_choice
    topic_code: "3.5"
    source: "AP Precalculus CED, Topic 3.5"
    points: 1
    prompt: |
      What are the period and range of f(θ) = 2 sin(πθ/4) + 1?
    options:
      - "Period 8, range [−1, 3]"
      - "Period π/2, range [−1, 3]"
      - "Period 8, range [1, 3]"
      - "Period 8, range [−2, 2]"
    option_explanations:
      - |
        Correct. Period 2π/(π/4) = 8; outputs run from 1 − 2 = −1 to 1 + 2 = 3.
      - |
        This multiplies 2π by π/4 instead of dividing; the period is 2π/b.
      - |
        This runs only from the midline to the maximum; the graph also goes 2 units below the midline.
      - |
        This ignores the vertical translation +1, which moves the whole range up by 1.
    answer: 0
  - slug: precalc-u03-exam-q16
    type: multiple_choice
    topic_code: "3.6"
    source: "AP Precalculus CED, Topic 3.6"
    points: 1
    prompt: |
      The graph of y = sin(2θ − π/3) is a horizontal translation of the graph of y = sin(2θ). Which translation?
    options:
      - "Right by π/3"
      - "Right by π/6"
      - "Left by π/6"
      - "Left by π/3"
    option_explanations:
      - |
        The 2 must be factored out first: sin(2θ − π/3) = sin(2(θ − π/6)), so the shift is π/6, not π/3.
      - |
        Correct. sin(2θ − π/3) = sin(2(θ − π/6)), a translation right by π/6.
      - |
        Subtracting inside the function moves the graph right, not left.
      - |
        This both skips factoring out the 2 and reverses the direction of the shift.
    answer: 1
  - slug: precalc-u03-exam-q17
    type: multiple_choice
    topic_code: "3.6"
    source: "AP Precalculus CED, Topic 3.6"
    points: 1
    prompt: |
      The graph of g is obtained from the graph of y = sin θ by a vertical dilation by a factor of 3, then a reflection over the θ-axis, then a vertical translation up 2 units. Which is g(θ)?
    options:
      - "g(θ) = 3 sin θ − 2"
      - "g(θ) = −3 sin(θ + 2)"
      - "g(θ) = −3 sin θ + 2"
      - "g(θ) = −3(sin θ + 2)"
    option_explanations:
      - |
        This misses the reflection (the coefficient should be −3) and translates down instead of up.
      - |
        Adding 2 inside the function is a horizontal translation left by 2, not a vertical translation.
      - |
        Correct. Dilate: 3 sin θ; reflect: −3 sin θ; translate up 2: −3 sin θ + 2.
      - |
        This translates before dilating and reflecting: −3(sin θ + 2) = −3 sin θ − 6, which moves the midline down to −6.
    answer: 2
  - slug: precalc-u03-exam-q18
    type: multiple_choice
    topic_code: "3.7"
    source: "AP Precalculus CED, Topic 3.7"
    points: 1
    prompt: |
      (Calculator.) A sinusoidal regression on hypothetical water-level data gives y = 4.2 sin(0.52t − 1.1) + 10.3, where y is in feet and t is hours after midnight. According to the model, what is the period of the water level, to the nearest hundredth of an hour?
    options:
      - "0.52 hours"
      - "8.40 hours"
      - "3.27 hours"
      - "12.08 hours"
    option_explanations:
      - |
        0.52 is the frequency constant b, not the period; the period is 2π/b.
      - |
        8.4 is twice the amplitude, the vertical distance from minimum to maximum in feet, not a time.
      - |
        This multiplies b by 2π instead of dividing 2π by b.
      - |
        Correct. Period = 2π/0.52 ≈ 12.08 hours.
    answer: 3
  - slug: precalc-u03-exam-q19
    type: multiple_choice
    topic_code: "3.8"
    source: "AP Precalculus CED, Topic 3.8"
    points: 1
    prompt: |
      Where are the vertical asymptotes of y = tan(θ − π/4)? (n is any integer.)
    options:
      - "θ = 3π/4 + πn"
      - "θ = π/4 + πn"
      - "θ = π/2 + πn"
      - "θ = 3π/4 + 2πn"
    option_explanations:
      - |
        Correct. Asymptotes occur where θ − π/4 = π/2 + πn, that is θ = 3π/4 + πn.
      - |
        These are the zeros of the translated tangent, where θ − π/4 = πn.
      - |
        These are the asymptotes of tan θ before the translation right by π/4.
      - |
        The location is right, but tangent's asymptotes repeat every π, not every 2π; this misses half of them.
    answer: 0
  - slug: precalc-u03-exam-q20
    type: multiple_choice
    topic_code: "3.8"
    source: "AP Precalculus CED, Topic 3.8"
    points: 1
    prompt: |
      What is the period of y = 2 tan(3θ)?
    options:
      - "π"
      - "2π/3"
      - "π/3"
      - "3π"
    option_explanations:
      - |
        π is the period of tan θ; the inside factor 3 compresses the graph horizontally.
      - |
        2π/3 uses the sine and cosine formula 2π/|b|; tangent's basic period is π.
      - |
        Correct. The period of tan(bθ) is π/|b| = π/3. The factor 2 is a vertical dilation and does not affect the period.
      - |
        This multiplies π by 3 instead of dividing.
    answer: 2
  - slug: precalc-u03-exam-q21
    type: multiple_choice
    topic_code: "3.9"
    source: "AP Precalculus CED, Topic 3.9"
    points: 1
    prompt: |
      (Calculator.) To three decimal places, what is cos⁻¹(−0.6)?
    options:
      - "−0.927"
      - "2.214"
      - "4.069"
      - "126.870"
    option_explanations:
      - |
        The range of cos⁻¹ is [0, π], so its output is never negative; −0.927 is −cos⁻¹(0.6).
      - |
        Correct. cos⁻¹(−0.6) ≈ 2.214, which lies in [0, π] (quadrant II, where cosine is negative).
      - |
        cos(4.069) = −0.6 too, but 4.069 is outside the range [0, π] of the inverse cosine.
      - |
        This is the angle in degrees; the calculator should be in radian mode.
    answer: 1
  - slug: precalc-u03-exam-q22
    type: multiple_choice
    topic_code: "3.9"
    source: "AP Precalculus CED, Topic 3.9"
    points: 1
    prompt: |
      What is the exact value of sin(cos⁻¹(−3/5))?
    options:
      - "−4/5"
      - "−3/5"
      - "4/3"
      - "4/5"
    option_explanations:
      - |
        This places the angle in quadrant III or IV; cos⁻¹ returns an angle in [0, π], where sine is never negative.
      - |
        −3/5 is the cosine of the angle (the input to cos⁻¹); sine and inverse cosine do not cancel.
      - |
        4/3 is a ratio of the triangle's legs (opposite over adjacent, in size); sine is opposite over hypotenuse.
      - |
        Correct. θ = cos⁻¹(−3/5) is in quadrant II with cos θ = −3/5, so sin θ = +√(1 − 9/25) = 4/5.
    answer: 3
  - slug: precalc-u03-exam-q23
    type: multiple_choice
    topic_code: "3.10"
    source: "AP Precalculus CED, Topic 3.10"
    points: 1
    prompt: |
      (Calculator.) What are all solutions of cos x = −0.35 on the interval [0, 2π), to three decimal places?
    options:
      - "1.928 only"
      - "1.928 and 1.213"
      - "1.928 and 4.355"
      - "1.928 and 5.070"
    option_explanations:
      - |
        cos⁻¹ gives only the principal value; the reflection across the x-axis, 2π − 1.928, has the same cosine.
      - |
        1.213 = π − 1.928 is the sine-style mirror; cos(1.213) = +0.35.
      - |
        Correct. cos⁻¹(−0.35) ≈ 1.928 (quadrant II), and 2π − 1.928 ≈ 4.355 (quadrant III) has the same cosine.
      - |
        5.070 = π + 1.928 is the tangent-style partner; cos(5.070) = +0.35.
    answer: 2
  - slug: precalc-u03-exam-q24
    type: multiple_choice
    topic_code: "3.11"
    source: "AP Precalculus CED, Topic 3.11"
    points: 1
    prompt: |
      Which statement is true about the graph of y = csc x on the interval (0, π)?
    options:
      - "It has a local minimum at (π/2, 1)."
      - "It has a local maximum at (π/2, 1)."
      - "It has a zero at x = π/2."
      - "It has a vertical asymptote at x = π/2."
    option_explanations:
      - |
        Correct. sin x rises to 1 at π/2 and falls back, so its reciprocal falls to 1 and rises again: a local minimum at (π/2, 1).
      - |
        sin x has a maximum there; its reciprocal has a minimum, since dividing 1 by the largest value gives the smallest result.
      - |
        csc x = 1/sin x is never 0; x = π/2 is a zero of cos x and cot x.
      - |
        csc x has asymptotes where sin x = 0 (x = 0 and π here); π/2 is an asymptote of sec x.
    answer: 0
  - slug: precalc-u03-exam-q25
    type: multiple_choice
    topic_code: "3.12"
    source: "AP Precalculus CED, Topic 3.12"
    points: 1
    prompt: |
