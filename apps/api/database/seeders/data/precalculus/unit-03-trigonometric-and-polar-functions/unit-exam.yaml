  # ---- Short answer
  - slug: precalc-u03-exam-q43
    type: short_answer
    topic_code: "3.10"
    source: "AP Precalculus CED, Topic 3.10"
    points: 3
    prompt: |
      Consider the equation 2 cos(2x) + 1 = 0.

      (a) Find all solutions on [0, 2π). Show how the interval for 2x is used.
      (b) Write the general solution, using n for any integer.
      (c) Solve the inequality 2 cos(2x) + 1 < 0 on [0, 2π).
    answer: |
      (a) cos(2x) = −1/2. With u = 2x on [0, 4π): u = 2π/3, 4π/3, 8π/3, 10π/3. So x = π/3, 2π/3, 4π/3, 5π/3.
      (b) 2x = 2π/3 + 2πn or 4π/3 + 2πn, so x = π/3 + πn or x = 2π/3 + πn.
      (c) cos u < −1/2 for 2π/3 < u < 4π/3 and 8π/3 < u < 10π/3, so π/3 < x < 2π/3 or 4π/3 < x < 5π/3.
    explanation: |
      Three points, one per part. (a) all four solutions, using the doubled interval (two solutions only earns 0). (b) a correct general solution with period π for x (four families with + 2πn are also acceptable). (c) both open intervals.
  - slug: precalc-u03-exam-q44
    type: short_answer
    topic_code: "3.15"
    source: "AP Precalculus CED, Topic 3.15"
    points: 3
    prompt: |
      Consider the rose r = 4 sin(3θ).

      (a) On [0, π/3], on which interval is r increasing and on which is it decreasing?
      (b) Find the average rate of change of r over [0, π/6]. Include units of r per radian.
      (c) Is the distance from the pole increasing or decreasing on (π/3, π/2)? Justify your answer.
    answer: |
      (a) 3θ runs over [0, π]. r increases on (0, π/6), where 3θ is in (0, π/2), and decreases on (π/6, π/3), where 3θ is in (π/2, π).
      (b) r(0) = 0 and r(π/6) = 4 sin(π/2) = 4, so (4 − 0)/(π/6) = 24/π ≈ 7.64 units of r per radian.
      (c) Increasing. On (π/3, π/2), 3θ is in (π, 3π/2), where sine is negative and decreasing, so r falls from 0 to −4. r is negative and decreasing, so |r| increases from 0 to 4.
    explanation: |
      Three points, one per part. (a) both intervals. (b) 24/π (or 7.64). (c) increasing, with both the sign of r and its direction of change.
  # ---- Free response (AP style)
  - slug: precalc-u03-exam-q45
    type: long_answer
    topic_code: "3.7"
    source: "AP Precalculus CED, Topic 3.7"
    points: 6
    prompt: |
      A hypothetical Ferris wheel has a diameter of 40 metres, and its centre is 24 metres above the ground. It turns at a constant rate, making one full revolution every 8 minutes. A rider boards at the lowest point of the wheel at time t = 0 minutes. The rider's height above the ground, in metres, is modelled by h(t) = a cos(bt) + d.

      (A) (i) Find the values of a, b and d. Show the work that leads to your answers.
      (ii) Find the average rate of change of h over the interval 1 ≤ t ≤ 3. Express your answer as a decimal approximation with units.

      (B) Is the rate of change of h increasing or decreasing on the interval 2 < t < 4? Give a reason for your answer.

      (C) (i) Find all times t in the first revolution, 0 ≤ t ≤ 8, at which the rider is exactly 34 metres above the ground.
      (ii) For how many minutes of each revolution is the rider at least 34 metres above the ground? Justify your answer.
    answer: |
      (A)(i) The midline is the centre height, d = 24. The amplitude is the radius, 20; the rider starts at the minimum, so a = −20. The period is 8, so b = 2π/8 = π/4. h(t) = −20 cos(πt/4) + 24.
      (ii) h(1) = 24 − 20 cos(π/4) = 24 − 10√2 ≈ 9.858 and h(3) = 24 − 20 cos(3π/4) = 24 + 10√2 ≈ 38.142. Average rate of change = (38.142 − 9.858)/2 = 10√2 ≈ 14.142 metres per minute.
      (B) Decreasing. On 2 < t < 4, h is above its midline (h(2) = 24) and rising toward its maximum at t = 4, so its graph is concave down: h is still increasing, but more and more slowly.
      (C)(i) −20 cos(πt/4) + 24 = 34 gives cos(πt/4) = −1/2. With πt/4 in [0, 2π]: πt/4 = 2π/3 or 4π/3, so t = 8/3 and t = 16/3 minutes.
      (ii) h(t) ≥ 34 when cos(πt/4) ≤ −1/2, that is 2π/3 ≤ πt/4 ≤ 4π/3 (the part of the cycle around the maximum at t = 4). So 8/3 ≤ t ≤ 16/3, which lasts 16/3 − 8/3 = 8/3 ≈ 2.667 minutes of each revolution.
    explanation: |
      Six points.
      (A)(i) 2 points: 1 for a = −20 and d = 24 (with reasons); 1 for b = π/4.
      (A)(ii) 1 point: 14.142 (or 10√2) metres per minute; the units are required.
      (B) 1 point: decreasing, with a reason based on concavity (concave down between the midline crossing and the maximum) or on the rising part of the curve flattening.
      (C)(i) 1 point: t = 8/3 and t = 16/3 (or 2.667 and 5.333).
      (C)(ii) 1 point: 8/3 ≈ 2.667 minutes, with the interval 8/3 ≤ t ≤ 16/3 identified as the one where h ≥ 34.
  - slug: precalc-u03-exam-q46
    type: long_answer
    topic_code: "3.12"
    source: "AP Precalculus CED, Topic 3.12"
    points: 6
    prompt: |
      Directions: answer each part, showing the work that leads to your answer.

      (A) (i) Solve sin(2x) = cos x for all values of x in the interval [0, 2π).
      (ii) Solve sec²x = 2 tan x + 4 for all values of x in the interval (−π/2, π/2). Give exact answers; an answer may involve an inverse trigonometric function.

      (B) Rewrite (1 − cos(2x))/sin(2x) as a single trigonometric function of x, for x where the expression is defined.

      (C) Rewrite cos(x + π/3) in the form a cos x + b sin x, where a and b are exact constants.
    answer: |
      (A)(i) 2 sin x cos x − cos x = 0, so cos x (2 sin x − 1) = 0. cos x = 0 gives x = π/2, 3π/2; sin x = 1/2 gives x = π/6, 5π/6. Solutions: π/6, π/2, 5π/6, 3π/2.
      (ii) Replace sec²x by 1 + tan²x: 1 + tan²x = 2 tan x + 4, so tan²x − 2 tan x − 3 = 0 and (tan x − 3)(tan x + 1) = 0. tan x = −1 gives x = −π/4; tan x = 3 gives x = tan⁻¹ 3 (≈ 1.249). Both are in (−π/2, π/2).
      (B) 1 − cos(2x) = 1 − (1 − 2 sin²x) = 2 sin²x, and sin(2x) = 2 sin x cos x. So the expression is 2 sin²x/(2 sin x cos x) = sin x/cos x = tan x.
      (C) cos(x + π/3) = cos x cos(π/3) − sin x sin(π/3) = (1/2) cos x − (√3/2) sin x, so a = 1/2 and b = −√3/2.
    explanation: |
      Six points.
      (A)(i) 2 points: 1 for factoring cos x (2 sin x − 1) = 0 without dividing by cos x; 1 for all four solutions.
      (A)(ii) 2 points: 1 for the quadratic in tan x from the Pythagorean identity; 1 for x = −π/4 and x = tan⁻¹ 3.
      (B) 1 point: tan x, with the double-angle identities shown.
      (C) 1 point: a = 1/2 and b = −√3/2 with the sum identity shown.
