    - slug: precalc-u03-w19-q23
      type: long_answer
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 6
      prompt: |
        Viewed from below, the tip of a hypothetical ceiling-fan blade moves on a circle of radius 60 cm. Place the centre of the circle at the origin, with the tip starting at (60, 0) and turning counterclockwise. Answer without a calculator and give exact values.

        (A) (i) Find the coordinates of the tip after it has turned through 2π/3 radians.
        (ii) Find the coordinates of the tip after it has turned through 7π/4 radians.

        (B) Find every angle θ in [0, 2π) at which the tip's vertical coordinate is −30 cm. Explain your reasoning using reference angles and signs.

        (C) At a certain moment the tip's horizontal coordinate is 36 cm and its vertical coordinate is negative.
        (i) Use the Pythagorean identity to find the vertical coordinate.
        (ii) Find tan θ for the angle θ that the blade makes at that moment, and interpret it in terms of the blade's position.
      answer: |
        (A) (i) (60 cos(2π/3), 60 sin(2π/3)) = (60 · (−1/2), 60 · √3/2) = (−30, 30√3).
        (ii) (60 cos(7π/4), 60 sin(7π/4)) = (60 · √2/2, 60 · (−√2/2)) = (30√2, −30√2).
        (B) 60 sin θ = −30 gives sin θ = −1/2. The first-quadrant angle with sine 1/2 is π/6, so the reference angle is π/6. Sine is negative in quadrants III and IV, giving θ = π + π/6 = 7π/6 and θ = 2π − π/6 = 11π/6.
        (C) (i) cos θ = 36/60 = 0.6, so sin²θ = 1 − 0.36 = 0.64 and sin θ = −0.8 (negative, as given). The vertical coordinate is 60 · (−0.8) = −48 cm.
        (ii) tan θ = sin θ/cos θ = −0.8/0.6 = −4/3. It is the slope of the blade, the segment from the centre (0, 0) to the tip (36, −48): the blade points down and to the right, dropping 4 cm for every 3 cm across.
      explanation: |
        Six points. (A) 1 point each for (−30, 30√3) and (30√2, −30√2). (B) 1 point for sin θ = −1/2 with reference angle π/6; 1 point for both 7π/6 and 11π/6 (no point if extra angles are included). (C) 1 point for −48 cm with the identity used and the sign chosen from the given information; 1 point for tan θ = −4/3 with the slope interpretation.
