week: 19
unit: 3
title: "Sine and Cosine Values on the Unit Circle"
topics: ["3.3"]
guide: guides/week-19.md
guide_description: |
  The unit circle as the place where the point at angle θ is (cos θ, sin θ); exact values at the quadrantal
  angles and at π/6, π/4 and π/3 from the special right triangles; reference angles and the signs in each
  quadrant; symmetries such as cos(−θ) = cos θ and sin(π − θ) = sin θ; and tan θ = sin θ/cos θ with the
  Pythagorean identity sin²θ + cos²θ = 1. Worked examples: sin(5π/6), cos(4π/3), cos(11π/3), finding cos θ
  from sin θ = 3/5 in quadrant II, and sin θ and cos θ from tan θ = 2 in quadrant III.
flashcards_description: |
  30 cards on unit-circle coordinates, the special-angle values, reference angles, signs by quadrant,
  symmetry identities, and the Pythagorean identity.

flashcards:
  - front: Point at angle θ on the unit circle → coordinates
    back: |
      (cos θ, sin θ). Cosine is the horizontal coordinate and sine the vertical coordinate, because r = 1.
    topic_code: "3.3"
  - front: Range of values of sin θ and cos θ → why
    back: |
      Both lie in [−1, 1], because they are coordinates of a point on a circle of radius 1.
    topic_code: "3.3"
  - front: Quadrantal angles 0, π/2, π, 3π/2 → unit-circle points
    back: |
      (1, 0), (0, 1), (−1, 0), (0, −1). So cos π = −1, sin(3π/2) = −1, and cos(π/2) = sin π = 0.
    topic_code: "3.3"
  - front: sin(π/4) and cos(π/4) → exact values and why
    back: |
      Both √2/2. The point has equal coordinates a with a² + a² = 1, so a = 1/√2 = √2/2 ≈ 0.707.
    topic_code: "3.3"
  - front: Point at π/6 on the unit circle → coordinates
    back: |
      (√3/2, 1/2). Half an equilateral triangle of side 1 has short leg 1/2 opposite 30° and long leg √3/2.
    topic_code: "3.3"
  - front: Point at π/3 on the unit circle → coordinates
    back: |
      (1/2, √3/2). The larger angle has the larger height: sin(π/3) = √3/2 > sin(π/6) = 1/2.
    topic_code: "3.3"
  - front: tan(π/6), tan(π/4), tan(π/3) → exact values
    back: |
      √3/3 (that is, 1/√3), 1 and √3. Each is sin/cos: for π/3, (√3/2)/(1/2) = √3.
    topic_code: "3.3"
  - front: tan(π/2) → value
    back: |
      Undefined. The point is (0, 1), so sin/cos = 1/0. The terminal ray is vertical and has no slope.
    topic_code: "3.3"
  - front: Reference angle → definition
    back: |
      The acute angle between the terminal ray and the x-axis (never the y-axis). It is between 0 and π/2.
    topic_code: "3.3"
  - front: Reference angle in quadrants II, III, IV → formulas for θ in [0, 2π)
    back: |
      II: π − θ. III: θ − π. IV: 2π − θ. For 5π/6, 4π/3 and 7π/4 these give π/6, π/3 and π/4.
    topic_code: "3.3"
  - front: Signs of cos, sin, tan in quadrant II → pattern
    back: |
      cos negative, sin positive, tan negative. Only sine (the y-coordinate) is positive there.
    topic_code: "3.3"
  - front: Signs of cos, sin, tan in quadrant III → pattern
    back: |
      cos negative, sin negative, tan positive. A negative over a negative makes the slope positive.
    topic_code: "3.3"
  - front: Signs of cos, sin, tan in quadrant IV → pattern
    back: |
      cos positive, sin negative, tan negative. Only cosine (the x-coordinate) is positive there.
    topic_code: "3.3"
  - front: Exact value recipe for any special angle → three steps
    back: |
      Replace θ with a coterminal angle in [0, 2π); find the quadrant and reference angle; take the first-quadrant value and attach the quadrant's sign.
    topic_code: "3.3"
  - front: cos(4π/3) → exact value with reasoning
    back: |
      Quadrant III, reference angle π/3, cosine negative: −1/2.
    topic_code: "3.3"
  - front: sin(5π/6) → exact value with reasoning
    back: |
      Quadrant II, reference angle π/6, sine positive: 1/2.
    topic_code: "3.3"
  - front: tan(7π/4) → exact value with reasoning
    back: |
      Quadrant IV, reference angle π/4, tangent negative: −1.
    topic_code: "3.3"
  - front: cos(11π/3) → exact value with reasoning
    back: |
      11π/3 − 2π = 5π/3, quadrant IV, reference angle π/3, cosine positive: 1/2.
    topic_code: "3.3"
  - front: sin(−3π/4) → exact value with reasoning
    back: |
      −3π/4 + 2π = 5π/4, quadrant III, reference angle π/4, sine negative: −√2/2.
    topic_code: "3.3"
  - front: Angles in [0, 2π) with cos θ = −√3/2 → find them
    back: |
      Reference angle π/6; cosine is negative in II and III, so θ = 5π/6 and 7π/6.
    topic_code: "3.3"
  - front: cos(−θ) and sin(−θ) → identities and why
    back: |
      cos(−θ) = cos θ and sin(−θ) = −sin θ: reflecting across the x-axis keeps x and flips y. Cosine is even, sine is odd.
    topic_code: "3.3"
  - front: sin(π − θ) and cos(π − θ) → identities
    back: |
      sin(π − θ) = sin θ and cos(π − θ) = −cos θ: reflecting across the y-axis keeps y and flips x.
    topic_code: "3.3"
  - front: sin(θ + π), cos(θ + π), tan(θ + π) → identities
    back: |
      A half turn flips both coordinates: sin(θ + π) = −sin θ, cos(θ + π) = −cos θ, and so tan(θ + π) = tan θ.
    topic_code: "3.3"
  - front: tan θ in terms of sine and cosine → formula
    back: |
      tan θ = sin θ/cos θ, defined when cos θ ≠ 0. It is the slope of the segment from the origin to (cos θ, sin θ).
    topic_code: "3.3"
  - front: Pythagorean identity sin²θ + cos²θ = 1 → where it comes from
    back: |
      The point (cos θ, sin θ) lies on the unit circle x² + y² = 1. It holds for every θ.
    topic_code: "3.3"
  - front: sin θ = 3/5 in quadrant II → cos θ and tan θ
    back: |
      cos²θ = 1 − 9/25 = 16/25; cosine is negative in II, so cos θ = −4/5 and tan θ = −3/4.
    topic_code: "3.3"
  - front: tan θ = 2 in quadrant III → sin θ and cos θ
    back: |
      Use the point (−1, −2) on the ray: r = √5, so cos θ = −√5/5 and sin θ = −2√5/5.
    topic_code: "3.3"
  - front: Error-spot → "the reference angle of 2π/3 is π/6"
    back: |
      π/6 is the angle to the y-axis. The reference angle is measured to the x-axis: π − 2π/3 = π/3.
    topic_code: "3.3"
  - front: Error-spot → "cos²θ = 16/25, so cos θ = 4/5" in quadrant II
    back: |
      Taking the square root gives ±4/5. In quadrant II cosine is negative, so cos θ = −4/5.
    topic_code: "3.3"
  - front: Error-spot → "sin(π/6) = √3/2"
    back: |
      That is sin(π/3). At π/6 the point is low on the circle, (√3/2, 1/2), so sin(π/6) = 1/2.
    topic_code: "3.3"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 3.3: unit-circle coordinates, special-angle
    values, reference angles, signs by quadrant, symmetry, and the Pythagorean identity), with about 30%
    reviewing week 18 (radians, periodicity) and Units 1 and 2 (complex zeros, rates of change, logarithms,
    exponential and logarithmic equations). Includes a shared-context set on the angle 7π/6. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
    No calculator is needed; exact values are expected.
  questions:
    # ---- Stimulus set: one angle (3.3)
    - slug: precalc-u03-w19-q01
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      stimulus: |
        Let θ = 7π/6, an angle in standard position.
      prompt: |
        What is the reference angle of θ?
      options:
        - "5π/6"
        - "π/6"
        - "π/3"
        - "−π/6"
      option_explanations:
        - |
          5π/6 is the quadrant II angle with the same reference angle; it is not acute, so it cannot be a reference angle.
        - |
          Correct. 7π/6 is in quadrant III, so the reference angle is 7π/6 − π = π/6.
        - |
          π/3 is the angle between the terminal ray and the negative y-axis; reference angles are measured to the x-axis.
        - |
          Reference angles are positive acute angles; −π/6 is a different angle, in quadrant IV.
      answer: 1
    - slug: precalc-u03-w19-q02
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      stimulus: |
        Let θ = 7π/6, an angle in standard position.
      prompt: |
        At which point does the terminal ray of θ meet the unit circle?
      options:
        - "(−1/2, −√3/2)"
        - "(√3/2, 1/2)"
        - "(−√3/2, 1/2)"
        - "(−√3/2, −1/2)"
      option_explanations:
        - |
          These are the coordinates at 4π/3, whose reference angle is π/3; for π/6 the horizontal coordinate has the larger size.
        - |
          This is the point at π/6 with no signs changed; in quadrant III both coordinates are negative.
        - |
          This is the point at 5π/6 in quadrant II; at 7π/6 the vertical coordinate is negative too.
        - |
          Correct. The reference angle π/6 gives sizes √3/2 and 1/2, and in quadrant III both coordinates are negative.
      answer: 3
    - slug: precalc-u03-w19-q03
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      stimulus: |
        Let θ = 7π/6, an angle in standard position.
      prompt: |
        What is tan θ?
      options:
        - "√3/3"
        - "−√3/3"
        - "√3"
        - "−√3"
      option_explanations:
        - |
          Correct. tan θ = (−1/2)/(−√3/2) = 1/√3 = √3/3, positive because both coordinates are negative in quadrant III.
        - |
          In quadrant III sine and cosine are both negative, so their quotient is positive.
        - |
          √3 is cos θ/sin θ, the fraction upside down; tan θ = sin θ/cos θ.
        - |
          This both inverts the fraction and gives the wrong sign; tangent is positive in quadrant III.
      answer: 0
    - slug: precalc-u03-w19-q04
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      stimulus: |
        Let θ = 7π/6, an angle in standard position.
      prompt: |
        Which other angle in the interval [0, 2π) has the same sine as θ?
      options:
        - "5π/6"
        - "π/6"
        - "11π/6"
        - "4π/3"
      option_explanations:
        - |
          sin(5π/6) = 1/2, but sin(7π/6) = −1/2; quadrant II has positive sines.
        - |
          sin(π/6) = 1/2, positive; the reference angle matches but the sign does not.
        - |
          Correct. sin θ = −1/2, and the other angle with reference angle π/6 where sine is negative is in quadrant IV: 2π − π/6 = 11π/6.
        - |
          4π/3 is in quadrant III but has reference angle π/3, so sin(4π/3) = −√3/2.
      answer: 2
    # ---- Topic 3.3
    - slug: precalc-u03-w19-q05
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        What is the exact value of cos(3π/4)?
      options:
        - "√2/2"
        - "−√3/2"
        - "−√2"
        - "−√2/2"
      option_explanations:
        - |
          The size is right, but 3π/4 is in quadrant II, where cosine is negative.
        - |
          −√3/2 is the cosine of 5π/6, whose reference angle is π/6, not π/4.
        - |
          −√2 is 1/cos(3π/4), the reciprocal; the cosine of a unit-circle angle can never be smaller than −1.
        - |
          Correct. Reference angle π/4 gives size √2/2, and cosine is negative in quadrant II.
      answer: 3
    - slug: precalc-u03-w19-q06
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        What is the exact value of sin(−π/3)?
      options:
        - "−√3/2"
        - "√3/2"
        - "−1/2"
        - "1/2"
      option_explanations:
        - |
          Correct. Sine is odd: sin(−π/3) = −sin(π/3) = −√3/2. The angle is in quadrant IV, where sine is negative.
        - |
          This ignores the negative angle; turning clockwise by π/3 lands below the x-axis, where sine is negative.
        - |
          The sign is right, but 1/2 is the size of the cosine at π/3, not the sine.
        - |
          1/2 is cos(−π/3); sine is the vertical coordinate.
      answer: 0
    - slug: precalc-u03-w19-q07
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        If sin θ = 5/13 and θ is in quadrant II, what is cos θ?
      options:
        - "12/13"
        - "−8/13"
        - "−12/13"
        - "−5/12"
      option_explanations:
        - |
          cos²θ = 144/169 gives the size 12/13, but cosine is negative in quadrant II.
        - |
          This subtracts 13 − 5 = 8 instead of using the Pythagorean identity, which works with squares.
        - |
          Correct. cos²θ = 1 − 25/169 = 144/169, so cos θ = ±12/13, and the negative value fits quadrant II.
        - |
          −5/12 is tan θ = sin θ/cos θ, not cos θ.
      answer: 2
    - slug: precalc-u03-w19-q08
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        Which expression is equal to sin(2π/3)?
      options:
        - "sin(−π/3)"
        - "sin(π/3)"
        - "cos(2π/3)"
        - "sin(4π/3)"
      option_explanations:
        - |
          sin(−π/3) = −√3/2, negative, while sin(2π/3) = √3/2.
        - |
          Correct. By the symmetry sin(π − θ) = sin θ, sin(2π/3) = sin(π/3) = √3/2.
        - |
          cos(2π/3) = −1/2; at the same angle, sine and cosine are different coordinates.
        - |
          4π/3 is a half turn from π/3 and has sine −√3/2, the opposite sign.
      answer: 1
    - slug: precalc-u03-w19-q09
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        An angle θ satisfies cos θ < 0 and tan θ > 0. In which quadrant is its terminal ray?
      options:
        - "Quadrant III"
        - "Quadrant II"
        - "Quadrant IV"
        - "Quadrant I"
      option_explanations:
        - |
          Correct. tan θ = sin θ/cos θ > 0 with cos θ < 0 forces sin θ < 0, so both coordinates are negative.
        - |
          In quadrant II cosine is negative but sine is positive, so tangent is negative.
        - |
          In quadrant IV cosine is positive, which contradicts cos θ < 0.
        - |
          In quadrant I cosine is positive, which contradicts cos θ < 0.
      answer: 0
    # ---- Spiral review
    - slug: precalc-u03-w19-q10
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Precalculus CED, Topic 3.2"
      points: 1
      prompt: |
        An arc of length 15 cm on a circle of radius 5 cm subtends a central angle θ. If θ is drawn in standard position, in which quadrant is its terminal ray?
      options:
        - "Quadrant I"
        - "Quadrant II"
        - "Quadrant III"
        - "Quadrant IV"
      option_explanations:
        - |
          θ = 15/5 = 3 radians, not 3 degrees; 3 radians is more than π/2 ≈ 1.57, so it is past quadrant I.
        - |
          Correct. θ = s/r = 3 radians, and π/2 ≈ 1.57 < 3 < π ≈ 3.14, so the terminal ray is in quadrant II.
        - |
          Quadrant III starts at π ≈ 3.14, and 3 radians is just short of that.
        - |
          Quadrant IV needs an angle between 3π/2 ≈ 4.71 and 2π; check θ = s/r = 3.
      answer: 1
    - slug: precalc-u03-w19-q11
      type: multiple_choice
      topic_code: "2.12"
      source: "AP Precalculus CED, Topic 2.12"
      points: 1
      prompt: |
        What is the value of log₂ 40 − log₂ 5?
      options:
        - "log₂ 35"
        - "8"
        - "3"
        - "log₂ 40/log₂ 5"
      option_explanations:
        - |
          The quotient property turns a difference of logs into the log of a quotient, not of a difference.
        - |
          40/5 = 8 is the argument of the log; log₂ 8 still has to be evaluated.
        - |
          Correct. log₂ 40 − log₂ 5 = log₂(40/5) = log₂ 8 = 3.
        - |
          A quotient of logs is a change-of-base expression (about 2.29), not the difference of the logs.
      answer: 2
    - slug: precalc-u03-w19-q12
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        A polynomial with real coefficients has zeros 4 and 2 − i. What is the smallest degree it can have?
      options:
        - "2"
        - "4"
        - "6"
        - "3"
      option_explanations:
        - |
          This counts only the zeros listed; with real coefficients the conjugate 2 + i must also be a zero.
        - |
          This adds −4 as a "conjugate" of 4 as well; real zeros do not need a partner.
        - |
          This doubles every zero, but nothing forces a repeated zero; the minimum uses each zero once.
        - |
          Correct. Non-real zeros of a real polynomial come in conjugate pairs, so 4, 2 − i and 2 + i are zeros: degree at least 3, e.g. (x − 4)(x² − 4x + 5).
      answer: 3
    - slug: precalc-u03-w19-q13
      type: multi_select
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 2
      partial_credit: true
      prompt: |
        Which of these values equal 1/2? Select all that apply.
      options:
        - "sin(π/6)"
        - "cos(2π/3)"
        - "sin(5π/6)"
        - "cos(5π/3)"
        - "sin(7π/6)"
      option_explanations:
        - |
          Correct. The point at π/6 is (√3/2, 1/2), so sin(π/6) = 1/2.
        - |
          2π/3 is in quadrant II, where cosine is negative: cos(2π/3) = −1/2.
        - |
          Correct. 5π/6 is in quadrant II with reference angle π/6, and sine is positive there.
        - |
          Correct. 5π/3 is in quadrant IV with reference angle π/3, and cosine is positive there.
        - |
          7π/6 is in quadrant III, where sine is negative: sin(7π/6) = −1/2.
      answer: [0, 2, 3]
    - slug: precalc-u03-w19-q14
      type: multi_select
      topic_code: "2.11"
      source: "AP Precalculus CED, Topic 2.11"
      points: 2
      partial_credit: true
      prompt: |
        Let f(x) = log₂(x − 1). Which statements are true? Select all that apply.
      options:
        - "The domain of f is x > 1."
        - "The graph of f has a vertical asymptote at x = 1."
        - "The graph of f passes through (3, 1)."
        - "The graph of f is concave up."
        - "The range of f is y > 0."
      option_explanations:
        - |
          Correct. The argument x − 1 must be positive, so x > 1.
        - |
          Correct. As x → 1⁺, x − 1 → 0⁺ and f(x) → −∞, so x = 1 is a vertical asymptote.
        - |
          Correct. f(3) = log₂(3 − 1) = log₂ 2 = 1, since 2¹ = 2.
        - |
          With base 2 > 1 the graph rises ever more slowly, so it is concave down.
        - |
          The range of a logarithmic function is all real numbers; for example f(1.5) = log₂ 0.5 = −1.
      answer: [0, 1, 2]
    - slug: precalc-u03-w19-q15
      type: true_false
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        True or false: cos(θ + π) = −cos θ for every angle θ.
      answer: true
      explanation: |
        True. Adding π rotates the point (cos θ, sin θ) a half turn to (−cos θ, −sin θ), so the horizontal coordinate changes sign. Check: cos(π/3 + π) = cos(4π/3) = −1/2 = −cos(π/3).
    - slug: precalc-u03-w19-q16
      type: true_false
      topic_code: "3.1"
      source: "AP Precalculus CED, Topic 3.1"
      points: 1
      prompt: |
        True or false: If the average rate of change of a periodic function over [a, b] is 0, then b − a must be a whole-number multiple of the period.
      answer: false
      explanation: |
        False. A zero average rate of change only says f(a) = f(b). A wave passes each middle value twice per cycle, so f(a) = f(b) can happen over part of a period: for the unit-circle height, sin(π/6) = sin(5π/6) = 1/2, giving average rate of change 0 over [π/6, 5π/6], an interval of length 2π/3, not a multiple of 2π.
    - slug: precalc-u03-w19-q17
      type: fill_blank
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        The reference angle of 5π/3, in radians, is ____.
      answer: ["π/3", "pi/3", "1π/3"]
      explanation: |
        5π/3 is in quadrant IV, so the reference angle is 2π − 5π/3 = π/3.
    - slug: precalc-u03-w19-q18
      type: fill_blank
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        If cos θ = 0.6 and θ is in quadrant IV, then sin θ = ____.
      answer: ["-0.8", "−0.8", "-.8", "−.8", "-4/5", "−4/5"]
      explanation: |
        sin²θ = 1 − 0.36 = 0.64, so sin θ = ±0.8; sine is negative in quadrant IV, so sin θ = −0.8.
    - slug: precalc-u03-w19-q19
      type: numeric
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        What is the average rate of change of f(x) = x³ − 2x over the interval [1, 3]? Give the exact value.
      answer: { value: 11, tolerance: 0 }
      explanation: |
        f(3) = 27 − 6 = 21 and f(1) = 1 − 2 = −1, so the average rate of change is (21 − (−1))/(3 − 1) = 22/2 = 11.
    - slug: precalc-u03-w19-q20
      type: numeric
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        Without a calculator, find the exact value of 4 sin²(π/3) + 2 cos(π).
      answer: { value: 1, tolerance: 0 }
      explanation: |
        sin(π/3) = √3/2, so sin²(π/3) = 3/4 and 4 · 3/4 = 3. cos π = −1, so 2 cos π = −2. Total 3 − 2 = 1.
    - slug: precalc-u03-w19-q21
      type: short_answer
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 3
      prompt: |
        An angle θ is in quadrant III and sin θ = −2/3.

        (a) Find the exact value of cos θ, showing how you chose the sign.
        (b) Find the exact value of tan θ.
        (c) Find the exact values of sin(θ + π) and cos(−θ), and explain which symmetry of the unit circle you used for each.
      answer: |
        (a) cos²θ = 1 − 4/9 = 5/9, so cos θ = ±√5/3. In quadrant III cosine is negative, so cos θ = −√5/3.
        (b) tan θ = (−2/3)/(−√5/3) = 2/√5 = 2√5/5.
        (c) A half turn flips both coordinates, so sin(θ + π) = −sin θ = 2/3. Reflecting across the x-axis keeps the horizontal coordinate, so cos(−θ) = cos θ = −√5/3.
      explanation: |
        Three points, one per part. (a) −√5/3 with the quadrant used to choose the sign. (b) 2/√5 or 2√5/5. (c) both values, each with a correct symmetry (half turn; reflection across the x-axis, or cosine is even).
