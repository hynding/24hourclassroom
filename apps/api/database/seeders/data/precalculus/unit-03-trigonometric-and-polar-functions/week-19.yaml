      answer: |
        (a) 125 = 5³, so 2x − 1 = 3 and x = 2.
        (b) log₃(x(x + 6)) = 3, so x(x + 6) = 27, x² + 6x − 27 = 0, (x + 9)(x − 3) = 0, giving x = 3 or x = −9. The solution is x = 3.
