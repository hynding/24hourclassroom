    - slug: precalc-u03-w21-q21
      type: short_answer
      topic_code: "3.6"
      source: "AP Precalculus CED, Topic 3.6"
      points: 3
      prompt: |
        Let f(θ) = 3 sin(2(θ − π/4)) + 1.

        (a) Describe the vertical transformations of y = sin θ that produce f, and state the range of f.
        (b) Describe the horizontal transformations, and state the period of f.
        (c) Find the coordinates of the first maximum of f to the right of θ = π/4, showing your reasoning.
      answer: |
        (a) A vertical dilation by a factor of 3 followed by a translation up 1. Range [−2, 4].
        (b) A horizontal dilation by a factor of 1/2 and a translation π/4 to the right. Period 2π/2 = π.
        (c) Sine has its first maximum when its input is π/2. 2(θ − π/4) = π/2 gives θ − π/4 = π/4, so θ = π/2. f(π/2) = 3 · 1 + 1 = 4, so the point is (π/2, 4).
      explanation: |
        Three points, one per part. (a) dilation by 3, up 1, and range [−2, 4]. (b) dilation by 1/2, right π/4, and period π. (c) (π/2, 4) with the input set equal to π/2 (or an equivalent argument from a quarter period after the shifted start).
    - slug: precalc-u03-w21-q22
      type: short_answer
      topic_code: "2.7"
      source: "AP Precalculus CED, Topic 2.7"
      points: 3
      prompt: |
        Let f(x) = sin x and g(x) = 2x + π/3.

        (a) Find the exact value of f(g(π/6)).
        (b) Find the exact value of g(f(π/2)).
        (c) Write f(g(x)) in the form sin(b(x + c)) and state its period and horizontal shift relative to y = sin(2x).
      answer: |
        (a) g(π/6) = π/3 + π/3 = 2π/3, and f(2π/3) = sin(2π/3) = √3/2.
        (b) f(π/2) = 1, and g(1) = 2 + π/3.
        (c) f(g(x)) = sin(2x + π/3) = sin(2(x + π/6)). Period 2π/2 = π; it is the graph of sin(2x) shifted π/6 to the left.
      explanation: |
        Three points, one per part. (a) √3/2. (b) 2 + π/3 (order of composition respected). (c) sin(2(x + π/6)) with period π and shift π/6 left.
    - slug: precalc-u03-w21-q23
      type: long_answer
      topic_code: "3.7"
      source: "AP Precalculus CED, Topic 3.7"
      points: 6
      prompt: |
        The depth of water at the end of a hypothetical pier is modelled by a sinusoidal function D(t), in metres, where t is the number of hours after midnight. On one day, low water of 1.2 m occurs at 4:00 a.m. and the next high water, 5.0 m, occurs at 10:15 a.m.

        (A) (i) Find the period, amplitude and midline of D.
        (ii) Write an equation for D(t).

        (B) (i) (Calculator.) Use your model to find the depth at 1:00 p.m., to the nearest hundredth of a metre.
        (ii) Is the depth increasing or decreasing at 1:00 p.m.? Justify your answer using the model's features, not a calculator graph.

        (C) (i) Between 10:15 a.m. and the next low water, at what time is the depth decreasing fastest? Explain.
        (ii) The harbour master notes that on this coast the water usually takes longer to fall than to rise. Explain how this would affect the model, and describe a kind of model that could account for it.
      answer: |
        (A) (i) Low to high takes 6.25 hours, half a period, so the period is 12.5 hours. Amplitude (5.0 − 1.2)/2 = 1.9 m; midline (5.0 + 1.2)/2 = 3.1 m.
        (ii) The minimum is at t = 4, so D(t) = 3.1 − 1.9 cos((2π/12.5)(t − 4)), that is, 3.1 − 1.9 cos(0.16π(t − 4)). (Equivalent forms, such as 3.1 + 1.9 cos((2π/12.5)(t − 10.25)), also earn credit.)
        (B) (i) D(13) = 3.1 − 1.9 cos(0.16π · 9) = 3.1 − 1.9 cos(1.44π) ≈ 3.1 − 1.9(−0.1874) ≈ 3.46 m.
        (ii) Decreasing. High water is at t = 10.25 and the next low water is half a period later, at t = 16.5 (4:30 p.m.); t = 13 lies between them, where the sinusoid falls from its maximum to its minimum.
        (C) (i) A sinusoid changes fastest at its midline crossing, halfway between the maximum at t = 10.25 and the minimum at t = 16.5: t = 13.375, about 1:22 p.m., when the depth is 3.1 m.
        (ii) A single sinusoid always takes equal times to rise and to fall (half a period each), so it would predict the low water too early and the falling water too fast. A piecewise sinusoidal model, with one sinusoidal piece for the rise (shorter half-period) and another for the fall (longer half-period), joined at the high and low water, could match the data better.
      explanation: |
        Six points. (A) 1 point for period 12.5 h, amplitude 1.9 m and midline 3.1 m; 1 point for a correct equation (any equivalent form, with b = 2π/12.5). (B) 1 point for 3.46 m (consistent with the student's model); 1 point for "decreasing" justified by t = 13 lying between the high at 10.25 and the low at 16.5. (C) 1 point for about 1:22 p.m. (t = 13.375) with the midline-crossing reason; 1 point for explaining that a single sinusoid has equal rise and fall times and proposing a piecewise sinusoidal model.
