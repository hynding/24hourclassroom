    - slug: precalc-u03-w24-q23
      type: short_answer
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 3
      prompt: |
        Angle α is in quadrant I with cos α = 3/5, and angle β is in quadrant II with sin β = 5/13.

        (a) Find the exact values of sin α and cos β.
        (b) Find the exact value of sin(α + β).
        (c) Find the exact value of cos(α + β), and use the signs of sin(α + β) and cos(α + β) to state the quadrant of α + β.
      answer: |
        (a) sin α = √(1 − 9/25) = 4/5 (positive in quadrant I). cos β = −√(1 − 25/169) = −12/13 (negative in quadrant II).
        (b) sin(α + β) = sin α cos β + cos α sin β = (4/5)(−12/13) + (3/5)(5/13) = −48/65 + 15/65 = −33/65.
        (c) cos(α + β) = cos α cos β − sin α sin β = (3/5)(−12/13) − (4/5)(5/13) = −36/65 − 20/65 = −56/65. Both sine and cosine are negative, so α + β is in quadrant III.
      explanation: |
        Three points, one per part. (a) both values with correct signs. (b) −33/65 with the identity shown. (c) −56/65 and quadrant III, justified by the two signs.
    - slug: precalc-u03-w24-q24
      type: short_answer
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 3
      prompt: |
        Consider the equation 2 cos²x + cos x = 0.

        (a) Factor the left side.
        (b) Find all solutions on [0, 2π).
        (c) Solve the inequality 2 cos²x + cos x > 0 on [0, 2π).
      answer: |
        (a) cos x (2 cos x + 1).
        (b) cos x = 0 gives π/2 and 3π/2; cos x = −1/2 gives 2π/3 and 4π/3.
        (c) The product is positive when both factors have the same sign. Both positive: cos x > 0, on [0, π/2) and (3π/2, 2π). Both negative: cos x < −1/2, on (2π/3, 4π/3). Solution: [0, π/2) ∪ (2π/3, 4π/3) ∪ (3π/2, 2π). (Test values: x = 0 gives 3 > 0; x = 3π/5, where cos x ≈ −0.31, gives about −0.12 < 0; x = π gives 1 > 0.)
      explanation: |
        Three points, one per part. (a) correct factoring. (b) all four solutions. (c) all three pieces with open endpoints at the boundary values (and 0 included); one piece missing earns 0 for this part.
    - slug: precalc-u03-w24-q25
      type: long_answer
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 6
      prompt: |
        Let f(x) = cos(2x) + sin x.

        (A) (i) Rewrite f(x) as an expression involving sin x only, with no multiple angles.
        (ii) Solve f(x) = 0 for x in [0, 2π). Show the work that leads to your answer.

        (B) Show that tan x + cot x = 2 csc(2x) for all x where both sides are defined. Show each step.

        (C) Use a sum identity with angles π/3 and π/4 to find the exact value of sin(7π/12).
      answer: |
        (A)(i) cos(2x) = 1 − 2 sin²x, so f(x) = 1 − 2 sin²x + sin x, or −2 sin²x + sin x + 1.
        (ii) −2 sin²x + sin x + 1 = 0 gives 2 sin²x − sin x − 1 = 0, so (2 sin x + 1)(sin x − 1) = 0. sin x = 1 gives x = π/2; sin x = −1/2 gives x = 7π/6 and 11π/6. Solutions: π/2, 7π/6, 11π/6.
        (B) tan x + cot x = sin x/cos x + cos x/sin x = (sin²x + cos²x)/(sin x cos x) = 1/(sin x cos x). Multiply top and bottom by 2: 2/(2 sin x cos x) = 2/sin(2x) = 2 csc(2x).
        (C) sin(7π/12) = sin(π/3 + π/4) = sin(π/3)cos(π/4) + cos(π/3)sin(π/4) = (√3/2)(√2/2) + (1/2)(√2/2) = (√6 + √2)/4.
      explanation: |
        Six points.
        (A)(i) 1 point: 1 − 2 sin²x + sin x (or equivalent).
        (A)(ii) 2 points: 1 for factoring the quadratic in sin x correctly; 1 for all three solutions (no point if a solution is missing or extra).
        (B) 2 points: 1 for combining into 1/(sin x cos x) using the Pythagorean identity; 1 for connecting to 2/sin(2x) = 2 csc(2x) with the double-angle identity. Working on both sides at once earns at most 1.
        (C) 1 point: (√6 + √2)/4 with the sum identity shown.
