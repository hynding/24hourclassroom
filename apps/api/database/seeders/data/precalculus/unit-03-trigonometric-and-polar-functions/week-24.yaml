week: 24
unit: 3
title: "Secant, Cosecant, Cotangent and Trigonometric Identities"
topics: ["3.11", "3.12"]
guide: guides/week-24.md
guide_description: |
  The reciprocal functions sec x, csc x and cot x: exact values, signs, domains, and graphs whose asymptotes sit at
  the zeros of cosine or sine; the three Pythagorean identities; the sum, difference and double-angle identities;
  how to prove an identity by transforming one side; and how identities turn equations such as sin(2x) = sin x and
  cos(2x) + cos x = 0 into factorable ones. Worked examples include all six values from sin θ = 3/5 in quadrant
  II, the exact value of cos(π/12), and proofs that sec x − cos x = sin x tan x and tan x + cot x = sec x csc x.
flashcards_description: |
  31 cards on the reciprocal functions and their graphs, the Pythagorean, sum, difference and double-angle
  identities, proof strategy, and solving equations with identities.

flashcards:
  - front: sec x, csc x, cot x → definitions
    back: |
      sec x = 1/cos x, csc x = 1/sin x, cot x = cos x/sin x. Each takes the sign of the function it is built from (cot has the sign of tan).
    topic_code: "3.11"
  - front: Reciprocal functions on the unit circle point (x, y) → values
    back: |
      sec θ = 1/x, csc θ = 1/y, cot θ = x/y, wherever the denominator is not 0.
    topic_code: "3.11"
  - front: sec(π/3) → exact value
    back: |
      cos(π/3) = 1/2, so sec(π/3) = 2.
    topic_code: "3.11"
  - front: cot(3π/4) → exact value
    back: |
      The point is (−√2/2, √2/2), so cot(3π/4) = x/y = −1.
    topic_code: "3.11"
  - front: sec(5π/6) → exact value
    back: |
      cos(5π/6) = −√3/2, so sec(5π/6) = −2/√3 = −2√3/3.
    topic_code: "3.11"
  - front: Six trig values from sin θ = 3/5, θ in quadrant II → list
    back: |
      cos θ = −4/5, tan θ = −3/4, csc θ = 5/3, sec θ = −5/4, cot θ = −4/3. The quadrant decides the sign of cosine.
    topic_code: "3.11"
  - front: Domain of y = sec x → description
    back: |
      All real x except where cos x = 0, that is x ≠ π/2 + πn. Those excluded inputs are the vertical asymptotes.
    topic_code: "3.11"
  - front: Graph of y = sec x → key features
    back: |
      Period 2π; asymptotes x = π/2 + πn; local minimum value 1 at x = 2πn and local maximum value −1 at x = π + 2πn; range (−∞, −1] ∪ [1, ∞); no x-intercepts.
    topic_code: "3.11"
  - front: Graph of y = csc x → key features
    back: |
      Period 2π; asymptotes at x = πn (zeros of sine); local minimum 1 at π/2 + 2πn, local maximum −1 at 3π/2 + 2πn; range (−∞, −1] ∪ [1, ∞).
    topic_code: "3.11"
  - front: Graph of y = cot x → key features
    back: |
      Period π; asymptotes at x = πn; zeros at x = π/2 + πn; decreasing on every branch; odd function, cot(−x) = −cot x.
    topic_code: "3.11"
  - front: Reciprocal of a function near 0 or near ±1 → what happens
    back: |
      Near 0 the reciprocal is very large in size (a vertical asymptote at an exact zero); at ±1 the reciprocal equals the same value, so the turning points of sine and cosine are shared.
    topic_code: "3.11"
  - front: Where csc x is decreasing on (0, π) → interval and reason
    back: |
      (0, π/2): there sin x increases from 0 to 1 while positive, so its reciprocal decreases from very large values to 1.
    topic_code: "3.11"
  - front: Vertical asymptotes of y = sec(2x) → equation
    back: |
      cos(2x) = 0 when 2x = π/2 + πn, so x = π/4 + πn/2.
    topic_code: "3.11"
  - front: Pythagorean identities → all three
    back: |
      sin²x + cos²x = 1; 1 + tan²x = sec²x; 1 + cot²x = csc²x. The last two come from dividing the first by cos²x or by sin²x.
    topic_code: "3.12"
  - front: sec θ from tan θ = 12/5, θ in quadrant III → value
    back: |
      sec²θ = 1 + 144/25 = 169/25, and secant (like cosine) is negative in quadrant III, so sec θ = −13/5.
    topic_code: "3.12"
  - front: (sec²x − 1) cos²x → simplify
    back: |
      sec²x − 1 = tan²x, and tan²x · cos²x = sin²x.
    topic_code: "3.12"
  - front: sin(α ± β) → identity
    back: |
      sin(α ± β) = sin α cos β ± cos α sin β. Sine mixes the functions and keeps the sign.
    topic_code: "3.12"
  - front: cos(α ± β) → identity
    back: |
      cos(α ± β) = cos α cos β ∓ sin α sin β. Cosine matches the functions and flips the sign.
    topic_code: "3.12"
  - front: cos(π/12) via π/3 − π/4 → exact value
    back: |
      (1/2)(√2/2) + (√3/2)(√2/2) = (√6 + √2)/4 ≈ 0.966.
    topic_code: "3.12"
  - front: sin(π/12) via π/3 − π/4 → exact value
    back: |
      (√3/2)(√2/2) − (1/2)(√2/2) = (√6 − √2)/4 ≈ 0.259.
    topic_code: "3.12"
  - front: cos(x − π/2) → simplify with a difference identity
    back: |
      cos x cos(π/2) + sin x sin(π/2) = sin x. The sine graph is the cosine graph shifted right by π/2.
    topic_code: "3.12"
  - front: sin(2θ) → identity
    back: |
      sin(2θ) = 2 sin θ cos θ. With sin θ = 3/5 and cos θ = −4/5: sin(2θ) = −24/25.
    topic_code: "3.12"
  - front: cos(2θ) → the three forms
    back: |
      cos²θ − sin²θ = 2 cos²θ − 1 = 1 − 2 sin²θ. Pick the form that matches the rest of the expression.
    topic_code: "3.12"
  - front: cos(2θ) when cos θ = 1/3 → value
    back: |
      2 cos²θ − 1 = 2/9 − 1 = −7/9.
    topic_code: "3.12"
  - front: Proving an identity → strategy
    back: |
      Start from one side (usually the messier) and transform it into the other: write in sines and cosines, use a Pythagorean identity, combine fractions, factor. Never work on both sides as if they were already equal.
    topic_code: "3.12"
  - front: tan x + cot x → simplified product
    back: |
      (sin²x + cos²x)/(sin x cos x) = 1/(sin x cos x) = sec x csc x.
    topic_code: "3.12"
  - front: sin(2x) = sin x on [0, 2π) → solutions
    back: |
      sin x (2 cos x − 1) = 0: sin x = 0 gives 0, π; cos x = 1/2 gives π/3, 5π/3.
    topic_code: "3.12"
  - front: cos(2x) + cos x = 0 on [0, 2π) → solutions
    back: |
      2 cos²x + cos x − 1 = (2 cos x − 1)(cos x + 1) = 0, so x = π/3, π, 5π/3.
    topic_code: "3.12"
  - front: Error-spot → "sin(α + β) = sin α + sin β"
    back: |
      False in general: with α = β = π/2, sin π = 0 but sin α + sin β = 2. Use sin α cos β + cos α sin β.
    topic_code: "3.12"
  - front: Error-spot → "sec x and cos⁻¹ x mean the same thing"
    back: |
      sec x = 1/cos x is a reciprocal (a ratio of coordinates). cos⁻¹ x is an inverse function: it returns an angle. To solve sec x = 3, rewrite as cos x = 1/3.
    topic_code: "3.11"
  - front: Error-spot → "cos θ = √(1 − sin²θ) always"
    back: |
      The square root gives only the positive value. Use the quadrant: for θ in quadrant II with sin θ = 3/5, cos θ = −4/5.
    topic_code: "3.12"

quiz:
  description: |
    25 questions · about 45 minutes · mostly on this week (topics 3.11 and 3.12: the reciprocal functions and their
    graphs, Pythagorean, sum, difference and double-angle identities, proofs, and solving equations with
    identities), with seven items (28%) reviewing earlier weeks (trigonometric equations, inverse trigonometric
    functions, arc length, tangent, exponential models and inverse functions). Opens with a shared-context set on
    one angle in quadrant IV. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. One item is marked (Calculator.); the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: one angle in quadrant IV (3.11, 3.12)
    - slug: precalc-u03-w24-q01
      type: multiple_choice
      topic_code: "3.11"
      source: "AP Precalculus CED, Topic 3.11"
      points: 1
      stimulus: |
        An angle θ lies in quadrant IV, and cos θ = 5/13.
      prompt: |
        What is the exact value of csc θ?
      options:
        - "13/12"
        - "13/5"
        - "−12/13"
        - "−13/12"
      option_explanations:
        - |
          The size is right, but sine is negative in quadrant IV, so csc θ = 1/sin θ is negative too.
        - |
          13/5 is 1/cos θ, which is sec θ; cosecant is the reciprocal of sine, not cosine.
        - |
          −12/13 is sin θ itself; cosecant is its reciprocal, 1/(−12/13).
        - |
          Correct. sin²θ = 1 − 25/169 = 144/169, and sine is negative in quadrant IV, so sin θ = −12/13 and csc θ = −13/12.
      answer: 3
    - slug: precalc-u03-w24-q02
      type: multiple_choice
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      stimulus: |
        An angle θ lies in quadrant IV, and cos θ = 5/13.
      prompt: |
        What is the exact value of sin(2θ)?
      options:
        - "−120/169"
        - "120/169"
        - "−24/13"
        - "−60/169"
      option_explanations:
        - |
          Correct. sin(2θ) = 2 sin θ cos θ = 2(−12/13)(5/13) = −120/169.
        - |
          This takes sin θ = +12/13; in quadrant IV the sine is negative, which makes sin(2θ) negative.
        - |
          This doubles the sine, treating sin(2θ) as 2 sin θ = −24/13, a value that is not even between −1 and 1.
        - |
          This computes sin θ cos θ and forgets the factor 2 in 2 sin θ cos θ.
      answer: 0
    - slug: precalc-u03-w24-q03
      type: multiple_choice
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      stimulus: |
        An angle θ lies in quadrant IV, and cos θ = 5/13.
      prompt: |
        What is the exact value of cos(2θ)?
      options:
        - "119/169"
        - "1"
        - "−119/169"
        - "10/13"
      option_explanations:
        - |
          This computes sin²θ − cos²θ = 144/169 − 25/169; the identity is cos²θ − sin²θ, so the sign is reversed.
        - |
          This adds cos²θ + sin²θ, the Pythagorean identity, instead of subtracting.
        - |
          Correct. cos(2θ) = 2 cos²θ − 1 = 2(25/169) − 1 = 50/169 − 169/169 = −119/169.
        - |
          This doubles the cosine, treating cos(2θ) as 2 cos θ; cos(2θ) is not a multiple of cos θ.
      answer: 2
    # ---- Reciprocal functions and identities (3.11, 3.12)
    - slug: precalc-u03-w24-q04
      type: multiple_choice
      topic_code: "3.11"
      source: "AP Precalculus CED, Topic 3.11"
      points: 1
      prompt: |
        What is the exact value of sec(2π/3)?
      options:
        - "2"
        - "−2"
        - "−1/2"
        - "2√3/3"
      option_explanations:
        - |
          The size is right, but 2π/3 is in quadrant II, where cosine, and so secant, is negative.
        - |
          Correct. cos(2π/3) = −1/2, so sec(2π/3) = 1/(−1/2) = −2.
        - |
          −1/2 is cos(2π/3) itself; secant is its reciprocal.
        - |
          2√3/3 = 1/(√3/2) is csc(2π/3), the reciprocal of sine, not of cosine.
      answer: 1
    - slug: precalc-u03-w24-q05
      type: multiple_choice
      topic_code: "3.11"
      source: "AP Precalculus CED, Topic 3.11"
      points: 1
      prompt: |
        Where are the vertical asymptotes of y = csc x? (n is any integer.)
      options:
        - "x = π/2 + πn"
        - "x = π/2 + 2πn"
        - "x = πn"
        - "x = 2πn"
      option_explanations:
        - |
          These are where cos x = 0, the asymptotes of sec x; cosecant is undefined where sin x = 0.
        - |
          At these inputs sin x = 1, so csc x = 1: they are the local minima of cosecant, not asymptotes.
        - |
          Correct. csc x = 1/sin x is undefined wherever sin x = 0, which is at every integer multiple of π.
        - |
          sin x = 0 at x = 2πn, but also at x = π + 2πn; this list misses half of the asymptotes.
      answer: 2
    - slug: precalc-u03-w24-q06
      type: multiple_choice
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      prompt: |
        Using π/12 = π/3 − π/4, what is the exact value of cos(π/12)?
      options:
        - "(√6 + √2)/4"
        - "(√6 − √2)/4"
        - "(1 − √2)/2"
        - "(√6 + √2)/2"
      option_explanations:
        - |
          Correct. cos(π/3 − π/4) = cos(π/3)cos(π/4) + sin(π/3)sin(π/4) = √2/4 + √6/4 = (√6 + √2)/4.
        - |
          This uses a minus sign in the middle; cos(α − β) has a plus sign. (√6 − √2)/4 is sin(π/12).
        - |
          This distributes cosine over the subtraction, cos(π/3) − cos(π/4); cosine is not linear, and the result is negative, impossible for an acute angle.
        - |
          The products are each over 2 · 2 = 4, not 2; (√6 + √2)/2 ≈ 1.93 is larger than 1, which no cosine can be.
      answer: 0
    - slug: precalc-u03-w24-q07
      type: multiple_choice
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      prompt: |
        For all x where it is defined, (sec²x − 1)/sec²x is equivalent to which expression?
      options:
        - "−1"
        - "cos²x"
        - "tan²x"
        - "sin²x"
      option_explanations:
        - |
          This cancels sec²x from the numerator as if it were a factor; sec²x − 1 is a difference, so sec²x cannot be cancelled.
        - |
          cos²x = 1/sec²x would be right only if the numerator were 1; the numerator is sec²x − 1.
        - |
          The numerator is tan²x, but it is still divided by sec²x: tan²x/sec²x = (sin²x/cos²x) · cos²x.
        - |
          Correct. sec²x − 1 = tan²x, and tan²x/sec²x = (sin²x/cos²x) · cos²x = sin²x. (Equivalently 1 − cos²x.)
      answer: 3
    - slug: precalc-u03-w24-q08
      type: multiple_choice
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      prompt: |
        Which expression is equivalent to cos(x − π/2) for all x?
      options:
        - "cos x"
        - "sin x"
        - "−sin x"
        - "−cos x"
      option_explanations:
        - |
          This treats the shift as having no effect (or distributes, cos x − cos(π/2) = cos x); a horizontal shift by π/2 changes the function.
        - |
          Correct. cos x cos(π/2) + sin x sin(π/2) = cos x · 0 + sin x · 1 = sin x.
        - |
          −sin x is cos(x + π/2); the difference identity cos(α − β) has a plus sign, giving +sin x.
        - |
          −cos x is cos(x − π), a shift by π; a shift by π/2 turns cosine into sine.
      answer: 1
    - slug: precalc-u03-w24-q09
      type: multiple_choice
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      prompt: |
        What are all solutions of sin(2x) = sin x on the interval [0, 2π)?
      options:
        - "π/3 and 5π/3"
        - "0 and π"
        - "0, π/3, π and 5π/3"
        - "0, π/6, π and 5π/6"
      option_explanations:
        - |
          This divides both sides by sin x, losing the solutions where sin x = 0 (x = 0 and π).
        - |
          These come from the factor sin x = 0 only; the factor 2 cos x − 1 = 0 also gives π/3 and 5π/3.
        - |
          Correct. 2 sin x cos x − sin x = sin x (2 cos x − 1) = 0, so sin x = 0 (0, π) or cos x = 1/2 (π/3, 5π/3).
        - |
          This rewrites sin(2x) as 2 sin²x, giving sin x (2 sin x − 1) = 0; the identity is sin(2x) = 2 sin x cos x.
      answer: 2
    - slug: precalc-u03-w24-q10
      type: multiple_choice
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      prompt: |
        Which expression is equivalent to cos(2x) for all x?
      options:
        - "1 − 2 sin²x"
        - "2 sin x cos x"
        - "1 − 2 cos²x"
        - "2 cos x"
      option_explanations:
        - |
          Correct. cos(2x) = cos²x − sin²x = (1 − sin²x) − sin²x = 1 − 2 sin²x.
        - |
          2 sin x cos x is sin(2x), the sine double-angle identity, not the cosine one.
        - |
          The cosine-only form is 2 cos²x − 1; 1 − 2 cos²x is its negative, −cos(2x).
        - |
          This treats cosine like multiplication by a number; for example cos(2 · 0) = 1 but 2 cos 0 = 2.
      answer: 0
    - slug: precalc-u03-w24-q11
      type: multi_select
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are identities, true for every x (or every α and β) where both sides are defined? Select all that apply.
      options:
        - "1 + tan²x = sec²x"
        - "sin(α + β) = sin α + sin β"
        - "cot²x + 1 = csc²x"
        - "sin(2x) = 2 sin x"
        - "cos²x − sin²x = cos(2x)"
      option_explanations:
        - |
          Correct. Divide sin²x + cos²x = 1 by cos²x.
        - |
          Not an identity: with α = β = π/2, the left side is sin π = 0 and the right side is 2.
        - |
          Correct. Divide sin²x + cos²x = 1 by sin²x.
        - |
          Not an identity: at x = π/2 the left side is sin π = 0 and the right side is 2. The identity is 2 sin x cos x.
        - |
          Correct. This is the first form of the cosine double-angle identity, from cos(x + x).
      answer: [0, 2, 4]
    - slug: precalc-u03-w24-q12
      type: multi_select
      topic_code: "3.11"
      source: "AP Precalculus CED, Topic 3.11"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about f(x) = cot x are true? Select all that apply.
      options:
        - "f has period π."
        - "f is decreasing on each interval between consecutive vertical asymptotes."
        - "The vertical asymptotes of f are at x = π/2 + πn."
        - "f(π/2) = 0."
        - "The range of f is [−1, 1]."
        - "f(−x) = −f(x) for every x in the domain."
      option_explanations:
        - |
          Correct. cot x = 1/tan x where defined, and tangent has period π, so cotangent does too.
        - |
          Correct. On (0, π), cot x falls from very large positive values to very large negative values; every branch is a translate of this one.
        - |
          These are the zeros of cot x (where cos x = 0); the asymptotes are where sin x = 0, at x = πn.
        - |
          Correct. cot(π/2) = cos(π/2)/sin(π/2) = 0/1 = 0.
        - |
          Cotangent is unbounded, like tangent; its range is all real numbers.
        - |
          Correct. cot(−x) = cos(−x)/sin(−x) = cos x/(−sin x) = −cot x, so cotangent is odd.
      answer: [0, 1, 3, 5]
    - slug: precalc-u03-w24-q13
      type: true_false
      topic_code: "3.11"
      source: "AP Precalculus CED, Topic 3.11"
      points: 1
      prompt: |
        True or false: The graph of y = sec x has no x-intercepts.
      answer: true
      explanation: |
        True. sec x = 1/cos x, and a fraction with numerator 1 is never 0. The graph's branches stay at or above 1 or at or below −1.
    - slug: precalc-u03-w24-q14
      type: true_false
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      prompt: |
        True or false: cos(α + β) = cos α + cos β for all angles α and β.
      answer: false
      explanation: |
        False. For α = β = 0, the left side is cos 0 = 1 and the right side is 2. The identity is cos(α + β) = cos α cos β − sin α sin β.
    - slug: precalc-u03-w24-q15
      type: fill_blank
      topic_code: "3.11"
      source: "AP Precalculus CED, Topic 3.11"
      points: 1
      prompt: |
        The exact value of csc(7π/6) is ____.
      answer: ["-2", "−2"]
      explanation: |
        sin(7π/6) = −1/2 (quadrant III, reference angle π/6), so csc(7π/6) = 1/(−1/2) = −2.
    - slug: precalc-u03-w24-q16
      type: fill_blank
      topic_code: "3.12"
      source: "AP Precalculus CED, Topic 3.12"
      points: 1
      prompt: |
        If sin θ = 0.6 and cos θ = 0.8, then sin(2θ) = ____.
      answer: ["0.96", ".96", "24/25"]
      explanation: |
        sin(2θ) = 2 sin θ cos θ = 2(0.6)(0.8) = 0.96.
    # ---- Spiral review
    - slug: precalc-u03-w24-q17
      type: multiple_choice
      topic_code: "3.10"
      source: "AP Precalculus CED, Topic 3.10"
      points: 1
      prompt: |
        What are all solutions of tan²x = 3 on the interval [0, π)?
      options:
        - "π/3 only"
        - "π/3 and 2π/3"
        - "π/3 and 4π/3"
        - "π/6 and 5π/6"
      option_explanations:
        - |
          This keeps only tan x = √3; taking a square root gives tan x = ±√3, and tan x = −√3 at 2π/3.
        - |
          Correct. tan x = √3 at π/3 and tan x = −√3 at 2π/3, both in [0, π).
        - |
          4π/3 is outside [0, π), and it solves tan x = √3 again rather than tan x = −√3.
        - |
          These solve tan x = ±1/√3 (reference angle π/6); tan x = ±√3 has reference angle π/3.
      answer: 1
    - slug: precalc-u03-w24-q18
      type: multiple_choice
      topic_code: "3.9"
      source: "AP Precalculus CED, Topic 3.9"
      points: 1
      prompt: |
        What is the exact value of sin⁻¹(sin(5π/6))?
      options:
        - "5π/6"
        - "−π/6"
        - "1/2"
        - "π/6"
      option_explanations:
        - |
          sin⁻¹ and sin do not simply cancel: the output of sin⁻¹ must lie in [−π/2, π/2], and 5π/6 does not.
        - |
          The output must have sine equal to +1/2, but sin(−π/6) = −1/2.
        - |
          1/2 is the inside value sin(5π/6); the inverse sine of 1/2 is still to be taken.
        - |
          Correct. sin(5π/6) = 1/2, and the angle in [−π/2, π/2] with sine 1/2 is π/6.
      answer: 3
