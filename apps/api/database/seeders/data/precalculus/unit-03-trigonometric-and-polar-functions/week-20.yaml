week: 20
unit: 3
title: "Graphs of Sine and Cosine; Sinusoidal Functions"
topics: ["3.4", "3.5"]
guide: guides/week-20.md
guide_description: |
  How the graphs of y = sin θ and y = cos θ come from unwrapping the unit circle; their domain, range,
  period, zeros, extremes, symmetry, intervals of increase and decrease, concavity, and how their rate of
  change is greatest at midline crossings; then sinusoidal functions a sin(b(θ + c)) + d with amplitude,
  period, midline, maximum and minimum, and cosine as sine shifted left by π/2. Worked examples: a table of
  average rates of change of sin θ, features of −4 sin(θ/3) + 2 and 3 cos(2θ) − 1, and building
  4 cos(2θ) + 1 from a description.
flashcards_description: |
  30 cards on the features of the sine and cosine graphs, concavity and rates of change, amplitude, period,
  midline and extremes of sinusoids, and the cosine–sine shift.

flashcards:
  - front: Graph of y = sin θ from the unit circle → what is plotted
    back: |
      The vertical coordinate of the point at angle θ, plotted against θ. As the point goes round once, the height goes 0, 1, 0, −1, 0.
    topic_code: "3.4"
  - front: Graph of y = cos θ from the unit circle → what is plotted
    back: |
      The horizontal coordinate of the point at angle θ against θ. It goes 1, 0, −1, 0, 1 over one turn.
    topic_code: "3.4"
  - front: y = sin θ and y = cos θ → domain, range, period
    back: |
      Domain all real numbers, range [−1, 1], period 2π. Both have midline y = 0 and amplitude 1.
    topic_code: "3.4"
  - front: Zeros of y = sin θ → general form
    back: |
      θ = kπ for any integer k: …, −π, 0, π, 2π, …. The point on the unit circle is on the x-axis.
    topic_code: "3.4"
  - front: Zeros of y = cos θ → general form
    back: |
      θ = π/2 + kπ for any integer k: ±π/2, ±3π/2, …. The point on the unit circle is on the y-axis.
    topic_code: "3.4"
  - front: Maxima and minima of y = sin θ → where
    back: |
      Maximum 1 at θ = π/2 + 2kπ (top of the circle); minimum −1 at θ = 3π/2 + 2kπ (bottom).
    topic_code: "3.4"
  - front: Maxima and minima of y = cos θ → where
    back: |
      Maximum 1 at θ = 2kπ; minimum −1 at θ = π + 2kπ.
    topic_code: "3.4"
  - front: y = sin θ on [0, 2π] → increasing and decreasing intervals
    back: |
      Increasing on [0, π/2] and [3π/2, 2π]; decreasing on [π/2, 3π/2]. The point rises whenever it is on the right half of the circle.
    topic_code: "3.4"
  - front: y = cos θ on [0, 2π] → increasing and decreasing intervals
    back: |
      Decreasing on [0, π], increasing on [π, 2π]. The point moves left across the top half and right across the bottom half.
    topic_code: "3.4"
  - front: Concavity of y = sin θ on (0, 2π) → pattern
    back: |
      Concave down on (0, π), where the graph is above its midline; concave up on (π, 2π), below the midline.
    topic_code: "3.4"
  - front: Points of inflection of a sinusoid → where
    back: |
      At the midline crossings, where concavity switches. For sin θ these are θ = kπ, the zeros.
    topic_code: "3.4"
  - front: Where a sinusoid changes fastest and slowest → rule
    back: |
      Fastest at midline crossings, slowest (rate near 0) at maxima and minima. sin θ rises by 0.5 over [0, π/6] but only about 0.134 over [π/3, π/2].
    topic_code: "3.4"
  - front: Symmetry of sine and cosine graphs → odd or even
    back: |
      Sine is odd (symmetric about the origin): sin(−θ) = −sin θ. Cosine is even (symmetric about the y-axis): cos(−θ) = cos θ.
    topic_code: "3.4"
  - front: y = cos θ decreasing and concave up on [0, 2π] → interval
    back: |
      (π/2, π): cosine decreases on [0, π] and is concave up on (π/2, 3π/2).
    topic_code: "3.4"
  - front: Sinusoidal function → general form
    back: |
      f(θ) = a sin(b(θ + c)) + d (or a cos(b(θ + c)) + d), with a ≠ 0 and b ≠ 0.
    topic_code: "3.5"
  - front: Amplitude of a sin(b(θ + c)) + d → formula
    back: |
      |a|, the distance from the midline to a maximum. From data: (max − min)/2. The amplitude of −4 sin θ is 4.
    topic_code: "3.5"
  - front: Period of a sin(b(θ + c)) + d → formula
    back: |
      2π/|b|. sin(4θ) has period π/2; sin(θ/3) has period 6π; sin(πθ/6) has period 12.
    topic_code: "3.5"
  - front: Midline of a sinusoid from its maximum and minimum → formula
    back: |
      y = (max + min)/2. Maximum 9 and minimum −3 give midline y = 3 and amplitude 6.
    topic_code: "3.5"
  - front: Maximum and minimum of a sin(bθ) + d → formulas
    back: |
      Maximum d + |a|, minimum d − |a|. For 2 − 5 cos θ: maximum 7, minimum −3.
    topic_code: "3.5"
  - front: Negative a in a sinusoid → effect
    back: |
      Reflects the graph across its midline. −sin θ starts on the midline going down; −cos θ starts at a minimum.
    topic_code: "3.5"
  - front: Features of −4 sin(θ/3) + 2 → list
    back: |
      Amplitude 4, period 6π, midline y = 2, maximum 6, minimum −2; it starts on the midline going down at θ = 0.
    topic_code: "3.5"
  - front: f(θ) = 3 cos(2θ) − 1 → one cycle on [0, π]
    back: |
      Maximum 2 at 0, midline −1 at π/4, minimum −4 at π/2, midline at 3π/4, maximum at π. The period is 2π/2 = π.
    topic_code: "3.5"
  - front: Midline y = 1, maximum 5 at θ = 0, period π → equation
    back: |
      Amplitude 4, b = 2π/π = 2, and a maximum at 0 suits cosine: f(θ) = 4 cos(2θ) + 1.
    topic_code: "3.5"
  - front: cos θ written with sine → identity
    back: |
      cos θ = sin(θ + π/2): the cosine graph is the sine graph shifted π/2 to the left. Equivalently sin θ = cos(θ − π/2).
    topic_code: "3.5"
  - front: Choosing sine or cosine from the starting point → rule of thumb
    back: |
      Max at the start: cos. Midline going up: sin. Min at the start: −cos. Midline going down: −sin. Either function can describe any sinusoid with a suitable shift.
    topic_code: "3.5"
  - front: Frequency of a sinusoid → definition
    back: |
      Cycles per unit of input: |b|/(2π), the reciprocal of the period. Period 0.5 s means 2 cycles per second.
    topic_code: "3.5"
  - front: Period 6 → value of |b|
    back: |
      |b| = 2π/6 = π/3. Solve period = 2π/|b| for |b|.
    topic_code: "3.5"
  - front: Error-spot → "the period of sin(4θ) is 4"
    back: |
      The period is 2π/|b| = 2π/4 = π/2. A larger b means a shorter period, not a longer one.
    topic_code: "3.5"
  - front: Error-spot → "the amplitude of −3 cos θ is −3"
    back: |
      Amplitude is a distance, so it is |−3| = 3. The negative sign reflects the graph across the midline.
    topic_code: "3.5"
  - front: Error-spot → "sin θ is concave up on (0, π) because it is increasing at first"
    back: |
      Increasing and concave up are different. On (0, π/2) sine increases but its rate of change shrinks, so it is concave down on all of (0, π).
    topic_code: "3.4"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 3.4 and 3.5: features of the sine and
    cosine graphs, concavity and rates of change, amplitude, period, midline and extremes of sinusoids, and
    cosine as shifted sine), with about 30% reviewing weeks 18–19 (radians, arc length, exact values) and
    Units 1 and 2 (transformations, division, exponential models). Includes a shared-context set on
    f(θ) = 3 cos(2θ) − 1. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes. No calculator is needed.
  questions:
    # ---- Stimulus set: one sinusoid (3.5, 3.4)
    - slug: precalc-u03-w20-q01
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 1
      stimulus: |
        Let f(θ) = 3 cos(2θ) − 1.
      prompt: |
        What is the maximum value of f?
      options:
        - "3"
        - "2"
        - "4"
        - "−1"
      option_explanations:
        - |
          3 is the amplitude, the distance from the midline to the maximum; the midline is y = −1, not y = 0.
        - |
          Correct. The maximum of a sinusoid is d + |a| = −1 + 3 = 2, reached when cos(2θ) = 1.
        - |
          4 is the distance from the midline to the maximum plus 1; adding |d| instead of d gives the wrong height.
        - |
          −1 is the midline value, the average of the maximum and minimum, not the maximum.
      answer: 1
    - slug: precalc-u03-w20-q02
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 1
      stimulus: |
        Let f(θ) = 3 cos(2θ) − 1.
      prompt: |
        What is the period of f?
      options:
        - "2π"
        - "π/2"
        - "4π"
        - "π"
      option_explanations:
        - |
          2π is the period of cos θ; the factor 2 inside compresses the graph horizontally.
        - |
          π/2 would need b = 4; the period is 2π divided by b = 2.
        - |
          This multiplies 2π by b instead of dividing; a factor greater than 1 makes the cycles shorter.
        - |
          Correct. The period is 2π/|b| = 2π/2 = π.
      answer: 3
    - slug: precalc-u03-w20-q03
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 1
      stimulus: |
        Let f(θ) = 3 cos(2θ) − 1.
      prompt: |
        What is the exact value of f(π/3)?
      options:
        - "1/2"
        - "−1/2"
        - "−5/2"
        - "3√3/2 − 1"
      option_explanations:
        - |
          This uses cos(π/3) = 1/2, forgetting to double the input: f(π/3) needs cos(2π/3).
        - |
          This gets 3 cos(2π/3) = −3/2 but then adds 1 instead of subtracting it.
        - |
          Correct. f(π/3) = 3 cos(2π/3) − 1 = 3(−1/2) − 1 = −5/2.
        - |
          This uses sin(2π/3) = √3/2 in place of cos(2π/3) = −1/2.
      answer: 2
    - slug: precalc-u03-w20-q04
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Precalculus CED, Topic 3.4"
      points: 1
      stimulus: |
        Let f(θ) = 3 cos(2θ) − 1.
      prompt: |
        On which interval is f decreasing throughout?
      options:
        - "[0, π/2]"
        - "[π/2, π]"
        - "[0, π]"
        - "[π/4, 3π/4]"
      option_explanations:
        - |
          Correct. f starts at its maximum 2 at θ = 0 and falls to its minimum −4 at θ = π/2, half a period later.
        - |
          On [π/2, π] f climbs from its minimum back to its maximum, so it is increasing.
        - |
          [0, π] is one whole period, which contains both the fall and the rise.
        - |
          f falls on [π/4, π/2] but rises on [π/2, 3π/4], so it is not decreasing throughout.
      answer: 0
    # ---- Topics 3.4 and 3.5
    - slug: precalc-u03-w20-q05
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Precalculus CED, Topic 3.4"
      points: 1
      prompt: |
        On which interval is y = sin θ both increasing and concave down?
      options:
        - "(0, π/2)"
        - "(π/2, π)"
        - "(π, 3π/2)"
        - "(3π/2, 2π)"
      option_explanations:
        - |
          Correct. Sine rises from 0 to 1 here, but its rate of increase shrinks as it nears the peak, so it is concave down.
        - |
          Sine is concave down here but decreasing, from 1 back to 0.
        - |
          Sine is decreasing here (from 0 to −1), and it is concave up because it is below the midline.
        - |
          Sine is increasing here, but it is below its midline, so it is concave up.
      answer: 0
    - slug: precalc-u03-w20-q06
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Precalculus CED, Topic 3.4"
      points: 1
      prompt: |
        What are all the zeros of y = cos θ in the interval [0, 2π]?
      options:
        - "0, π and 2π"
        - "π/2 only"
        - "π/2 and 3π/2"
        - "π/2, 3π/2 and 5π/2"
      option_explanations:
        - |
          These are the zeros of sin θ; cosine equals 1 at 0 and 2π and −1 at π.
        - |
          cos(3π/2) = 0 too: the point (0, −1) at the bottom of the unit circle has horizontal coordinate 0.
        - |
          Correct. cos θ is the horizontal coordinate, which is 0 at the top (π/2) and bottom (3π/2) of the unit circle.
        - |
          cos(5π/2) is 0, but 5π/2 is greater than 2π, so it lies outside the interval.
      answer: 2
    - slug: precalc-u03-w20-q07
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 1
      prompt: |
        What are the amplitude and period of y = −4 sin(θ/3) + 2?
      options:
        - "Amplitude −4, period 6π"
        - "Amplitude 4, period 6π"
        - "Amplitude 4, period 2π/3"
        - "Amplitude 6, period 6π"
      option_explanations:
        - |
          Amplitude is a distance and cannot be negative; the sign of a is a reflection.
        - |
          Correct. Amplitude |−4| = 4 and period 2π/(1/3) = 6π.
        - |
          2π/3 multiplies 2π by b = 1/3 instead of dividing by it.
        - |
          6 is the maximum, d + |a| = 2 + 4; the amplitude is measured from the midline y = 2.
      answer: 1
    - slug: precalc-u03-w20-q08
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 1
      prompt: |
        A sinusoidal function has midline y = 1, a maximum value of 5 at θ = 0, and period π. Which equation describes it?
      options:
        - "y = 5 cos(2θ) + 1"
        - "y = 4 cos(θ/2) + 1"
        - "y = 4 sin(2θ) + 1"
        - "y = 4 cos(2θ) + 1"
      option_explanations:
        - |
          This uses the maximum value as the amplitude; its maximum would be 5 + 1 = 6.
        - |
          cos(θ/2) has period 4π; period π needs b = 2π/π = 2.
        - |
          At θ = 0 this equals 1, the midline, not the maximum 5; sine starts on its midline.
        - |
          Correct. Amplitude 5 − 1 = 4, b = 2 for period π, and cosine has its maximum at θ = 0.
      answer: 3
    - slug: precalc-u03-w20-q09
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 1
      prompt: |
        Which expression is equal to cos θ for every θ?
      options:
        - "sin(θ − π/2)"
        - "sin(θ + π)"
        - "sin(θ + π/2)"
        - "sin θ + π/2"
      option_explanations:
        - |
          Shifting sine right by π/2 puts its minimum at θ = 0, which gives −cos θ.
        - |
          A half-period shift reflects sine: sin(θ + π) = −sin θ.
        - |
          Correct. Shifting the sine graph left by π/2 moves its maximum from π/2 to 0, which is the cosine graph.
        - |
          Adding π/2 outside the sine shifts the graph up, not sideways; its maximum would be 1 + π/2.
      answer: 2
    # ---- Spiral review
    - slug: precalc-u03-w20-q10
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 1
      prompt: |
        What is the exact value of sin(11π/6)?
      options:
        - "1/2"
        - "−1/2"
        - "−√3/2"
        - "√3/2"
      option_explanations:
        - |
          The reference angle π/6 gives size 1/2, but 11π/6 is in quadrant IV, where sine is negative.
        - |
          Correct. 11π/6 is in quadrant IV with reference angle π/6, and sine is negative there.
        - |
          −√3/2 is the sine of 5π/3, whose reference angle is π/3.
        - |
          √3/2 is cos(11π/6), the horizontal coordinate, not the sine.
      answer: 1
    - slug: precalc-u03-w20-q11
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      prompt: |
        The function g is defined by g(x) = f(x − 3) + 2. How is the graph of g related to the graph of f?
      options:
        - "Translated 3 units right and 2 units up"
        - "Translated 3 units left and 2 units up"
        - "Translated 3 units right and 2 units down"
        - "Translated 2 units right and 3 units up"
      option_explanations:
        - |
          Correct. Replacing x with x − 3 moves the graph 3 units right, and adding 2 to the output moves it up 2.
        - |
          Inside the function the shift is opposite to the sign: x − 3 means right, not left.
        - |
          Adding 2 outside the function raises every output, which is a shift up.
        - |
          This swaps the two numbers; the 3 inside the function controls the horizontal shift.
      answer: 0
    - slug: precalc-u03-w20-q12
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Precalculus CED, Topic 2.5"
      points: 1
      prompt: |
        In a hypothetical lab, a sample of a radioactive substance decays from 80 mg to 20 mg in 12 hours. Assuming exponential decay, what is the half-life?
      options:
        - "12 hours"
        - "3 hours"
        - "24 hours"
        - "6 hours"
      option_explanations:
        - |
          12 hours is the time to fall to a quarter of the original amount, which is two half-lives.
        - |
          This divides 12 by 4 because a quarter remains, but a quarter is two halvings, not four.
        - |
          The amount fell by more than half in 12 hours, so the half-life must be shorter than 12 hours.
        - |
          Correct. 80 → 40 → 20 is two halvings, so two half-lives take 12 hours and one takes 6 hours.
      answer: 3
    - slug: precalc-u03-w20-q13
      type: multi_select
      topic_code: "3.4"
      source: "AP Precalculus CED, Topic 3.4"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the graph of y = cos θ are true? Select all that apply.
      options:
        - "It is symmetric about the y-axis."
        - "Its period is 2π."
        - "It has a maximum at θ = 0."
        - "It is concave up on the interval (−π/2, π/2)."
        - "Its zeros are θ = kπ for every integer k."
      option_explanations:
        - |
          Correct. Cosine is even: cos(−θ) = cos θ, so the graph is its own mirror image in the y-axis.
        - |
          Correct. The point on the unit circle returns to its start after a full turn of 2π.
        - |
          Correct. cos 0 = 1, the largest value cosine takes.
        - |
          On (−π/2, π/2) cosine is above its midline, around its peak, so it is concave down.
        - |
          θ = kπ are the zeros of sine; cosine is ±1 there. Its zeros are π/2 + kπ.
      answer: [0, 1, 2]
    - slug: precalc-u03-w20-q14
      type: multi_select
      topic_code: "3.3"
      source: "AP Precalculus CED, Topic 3.3"
      points: 2
      partial_credit: true
      prompt: |
        Which of these values equal −√3/2? Select all that apply.
      options:
        - "cos(−π/6)"
        - "cos(5π/6)"
        - "sin(2π/3)"
        - "sin(4π/3)"
        - "sin(5π/3)"
      option_explanations:
        - |
          Cosine is even, so cos(−π/6) = cos(π/6) = √3/2, which is positive.
        - |
          Correct. 5π/6 is in quadrant II with reference angle π/6, and cosine is negative there.
        - |
          2π/3 is in quadrant II, where sine is positive: sin(2π/3) = √3/2.
        - |
          Correct. 4π/3 is in quadrant III with reference angle π/3, and sine is negative there.
        - |
          Correct. 5π/3 is in quadrant IV with reference angle π/3, and sine is negative there.
      answer: [1, 3, 4]
    - slug: precalc-u03-w20-q15
      type: true_false
      topic_code: "3.4"
      source: "AP Precalculus CED, Topic 3.4"
      points: 1
      prompt: |
        True or false: The graph of y = sin θ changes from concave down to concave up at θ = π.
      answer: true
      explanation: |
        True. On (0, π) sine is above its midline and concave down; on (π, 2π) it is below its midline and concave up. θ = π is a midline crossing and a point of inflection.
    - slug: precalc-u03-w20-q16
      type: true_false
      topic_code: "2.3"
      source: "AP Precalculus CED, Topic 2.3"
      points: 1
      prompt: |
        True or false: The function f(x) = 5(0.8)ˣ is decreasing and concave up on its whole domain.
      answer: true
      explanation: |
        True. With 0 < b = 0.8 < 1 and a = 5 > 0, the outputs shrink by the same factor each step, so they fall by smaller and smaller amounts: decreasing and concave up, levelling off towards the asymptote y = 0.
    - slug: precalc-u03-w20-q17
      type: fill_blank
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 1
      prompt: |
        The period of y = 7 sin(4θ) − 3 is ____.
      answer: ["π/2", "pi/2", "(1/2)π", "0.5π", "1/2π"]
      explanation: |
        The period is 2π/|b| = 2π/4 = π/2. The amplitude 7 and midline −3 do not affect the period.
    - slug: precalc-u03-w20-q18
      type: fill_blank
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 1
      prompt: |
        The maximum value of y = 2 − 5 cos θ is ____.
      answer: ["7"]
      explanation: |
        The midline is y = 2 and the amplitude is |−5| = 5, so the maximum is 2 + 5 = 7 (reached when cos θ = −1).
    - slug: precalc-u03-w20-q19
      type: numeric
      topic_code: "3.4"
      source: "AP Precalculus CED, Topic 3.4"
      points: 1
      prompt: |
        Find the average rate of change of y = sin θ over the interval [0, π/6]. Give your answer to the nearest hundredth.
      answer: { value: 0.95, tolerance: 0.01 }
      explanation: |
        (sin(π/6) − sin 0)/(π/6 − 0) = (1/2)/(π/6) = 3/π ≈ 0.95.
    - slug: precalc-u03-w20-q20
      type: numeric
      topic_code: "1.11"
      source: "AP Precalculus CED, Topic 1.11"
      points: 1
      prompt: |
        What is the remainder when x³ − 4x + 7 is divided by x − 2? Give the exact value.
      answer: { value: 7, tolerance: 0 }
      explanation: |
        By the remainder theorem the remainder is p(2) = 8 − 8 + 7 = 7.
    - slug: precalc-u03-w20-q21
      type: short_answer
      topic_code: "3.5"
      source: "AP Precalculus CED, Topic 3.5"
      points: 3
      prompt: |
        A sinusoidal function g has a maximum value of 9 at x = 1, and the next minimum after that is −3, at x = 4.

        (a) Find the midline and the amplitude of g.
        (b) Find the period of g, and the value of |b| in the form g(x) = a cos(b(x + c)) + d.
        (c) Find g(7) and g(2.5), and justify each answer using features of a sinusoid.
      answer: |
        (a) Midline y = (9 + (−3))/2 = 3; amplitude (9 − (−3))/2 = 6.
        (b) A maximum and the next minimum are half a period apart, so the period is 2 · (4 − 1) = 6 and |b| = 2π/6 = π/3.
        (c) x = 7 is one period after the maximum at x = 1, so g(7) = 9. x = 2.5 is halfway between the maximum at 1 and the minimum at 4, a quarter period from each, where a sinusoid crosses its midline, so g(2.5) = 3.
      explanation: |
        Three points, one per part. (a) midline y = 3 and amplitude 6. (b) period 6 (from max to min being half a period) and |b| = π/3. (c) both values with justifications (one period later; quarter period from an extreme is on the midline).
    - slug: precalc-u03-w20-q22
      type: short_answer
      topic_code: "3.2"
      source: "AP Precalculus CED, Topic 3.2"
      points: 3
      prompt: |
        A hypothetical garden sprinkler throws water 8 m and turns back and forth through an angle of 135°.

        (a) Write 135° in radians.
        (b) Find the length of the arc along the outer edge of the wetted region. Give an exact answer and a decimal to the nearest tenth of a metre.
        (c) The sprinkler turns at a steady rate of one full turn's worth of angle every 40 seconds. Find its rate in radians per second and the time it takes to sweep through the 135° angle once.
      answer: |
        (a) 135 · π/180 = 3π/4.
        (b) s = rθ = 8 · 3π/4 = 6π ≈ 18.8 m.
        (c) 2π radians per 40 s is π/20 radians per second. Time = (3π/4)/(π/20) = 15 seconds (check: 135/360 of 40 s = 15 s).
      explanation: |
        Three points, one per part. (a) 3π/4. (b) 6π ≈ 18.8 m with radians used in s = rθ. (c) π/20 rad/s and 15 s.
    - slug: precalc-u03-w20-q23
      type: long_answer
      topic_code: "3.4"
      source: "AP Precalculus CED, Topic 3.4"
      points: 6
      prompt: |
        In a model of a hypothetical paddle wheel, the height above the water of the tip of one paddle is h(θ) = 1.5 + 2 sin θ metres, where θ is the angle, in radians, through which the wheel has turned since the paddle was horizontal and rising. Answer without a calculator except where a decimal is asked for.

        (A) (i) State the amplitude, midline and period of h.
        (ii) Find the maximum and minimum heights of the tip, and the values of θ in [0, 2π] at which they occur.

        (B) (i) On which interval or intervals in [0, 2π] is h increasing?
        (ii) On which interval in (0, 2π) is h concave down? Explain what this means for how the tip's height changes.

        (C) (i) Find every θ in [0, 2π] at which the tip is 2.5 m above the water.
        (ii) Find the average rate of change of h over [0, π/6] and over [π/3, π/2], each to the nearest hundredth of a metre per radian. Explain how the comparison is consistent with your answer to (B)(ii).
      answer: |
        (A) (i) Amplitude 2 m, midline h = 1.5 m, period 2π.
        (ii) Maximum 1.5 + 2 = 3.5 m at θ = π/2; minimum 1.5 − 2 = −0.5 m at θ = 3π/2 (the tip is 0.5 m under the water).
        (B) (i) h increases on [0, π/2] and on [3π/2, 2π], where sin θ increases.
        (ii) h is concave down on (0, π), where the tip is above the midline. The rate of change of the height is decreasing there: the tip rises more and more slowly up to the top, then falls faster and faster down to the midline.
        (C) (i) 1.5 + 2 sin θ = 2.5 gives sin θ = 1/2, so θ = π/6 or θ = 5π/6.
        (ii) Over [0, π/6]: (2.5 − 1.5)/(π/6) = 6/π ≈ 1.91 m per radian. Over [π/3, π/2]: (3.5 − (1.5 + √3))/(π/6) = 6(2 − √3)/π ≈ 0.51 m per radian. The tip is rising on both intervals, but more slowly on the later one; decreasing rates of change over consecutive equal intervals are what concave down means, consistent with (B)(ii).
      explanation: |
        Six points. (A) 1 point for amplitude 2, midline 1.5 and period 2π; 1 point for 3.5 m at π/2 and −0.5 m at 3π/2. (B) 1 point for both increasing intervals and concave down on (0, π) with a correct meaning (rate of change decreasing). (C) 1 point for π/6 and 5π/6; 1 point for both rates (1.91 and 0.51); 1 point for linking the decreasing rates to concave down.
