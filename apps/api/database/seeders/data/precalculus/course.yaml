# The Precalculus course map. Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\Curriculum\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: Precalculus
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: Precalculus
slug: precalc
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full school year of Precalculus, aligned to AP Precalculus, for a student
  who has finished Algebra 2, one week at a time: a study guide, a flashcard
  deck and a quiz every week, a summary sheet and an exam at the end of each
  of the four units (polynomial and rational functions; exponential and
  logarithmic functions; trigonometric and polar functions; and parametric
  functions, conic sections, vectors and matrices), and an exam-prep guide
  with a 70-question practice final whose first 46 questions follow the May
  2027 AP Precalculus exam format (42 multiple choice, then four free-response
  questions). Original material written around the College Board AP
  Precalculus Course and Exam Description, with original worked examples,
  questions and cards.
  Free to copy, adapt and share under CC BY 4.0, crediting 24 Hour
  Classroom.
teacher: { name: "Precalculus Teacher", email: precalc@example.com }
student: { name: "Precalculus Student", email: precalc-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# The AP exam is Tuesday 2027-05-11, session 1 (College Board AP Central);
# weeks 33-34 review, then buffer weeks before exam week 37.
start_date: 2026-08-31
exam_date: 2027-05-11
subject: math
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The May 2027 AP exam format and calculator rules, how the practice final maps onto it, the four free-response question types and how they are scored, the formulas and procedures to know cold for every unit, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["AP Precalculus Course and Exam Description", "CC BY 4.0"]
attribution: |
  Original study material written for this course and organised around the
  College Board AP Precalculus Course and Exam Description. Every
  explanation, worked example, data set, flashcard and question was written
  for this course. © 2026 24 Hour Classroom, licensed under CC BY 4.0
  (https://creativecommons.org/licenses/by/4.0/).
# The three mathematical practices, by their CED numbers; guides tag topics with them.
practices:
  "1": Procedural and Symbolic Fluency
  "2": Multiple Representations
  "3": Communication and Reasoning
units:
  - number: 1
    slug: unit-01-polynomial-and-rational-functions
    title: Polynomial and Rational Functions
    weight: "30–40%"
    weeks: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    topics:
      "1.1": Change in Tandem
      "1.2": Rates of Change
      "1.3": Rates of Change in Linear and Quadratic Functions
      "1.4": Polynomial Functions and Rates of Change
      "1.5": Polynomial Functions and Complex Zeros
      "1.6": Polynomial Functions and End Behavior
      "1.7": Rational Functions and End Behavior
      "1.8": Rational Functions and Zeros
      "1.9": Rational Functions and Vertical Asymptotes
      "1.10": Rational Functions and Holes
      "1.11": Equivalent Representations of Polynomial and Rational Expressions
      "1.12": Transformations of Functions
      "1.13": Function Model Selection and Assumption Articulation
      "1.14": Function Model Construction and Application
  - number: 2
    slug: unit-02-exponential-and-logarithmic-functions
    title: Exponential and Logarithmic Functions
    weight: "25–40%"
    weeks: [10, 11, 12, 13, 14, 15, 16, 17]
    topics:
      "2.1": Change in Arithmetic and Geometric Sequences
      "2.2": Change in Linear and Exponential Functions
      "2.3": Exponential Functions
      "2.4": Exponential Function Manipulation
      "2.5": Exponential Function Context and Data Modeling
      "2.6": Competing Function Model Validation
      "2.7": Composition of Functions
      "2.8": Inverse Functions
      "2.9": Logarithmic Expressions
      "2.10": Inverses of Exponential Functions
      "2.11": Logarithmic Functions
      "2.12": Logarithmic Function Manipulation
      "2.13": Exponential and Logarithmic Equations and Inequalities
      "2.14": Logarithmic Function Context and Data Modeling
      "2.15": Semi-log Plots
  - number: 3
    slug: unit-03-trigonometric-and-polar-functions
    title: Trigonometric and Polar Functions
    weight: "30–35%"
    weeks: [18, 19, 20, 21, 22, 23, 24, 25, 26]
    topics:
      "3.1": Periodic Phenomena
      "3.2": Sine, Cosine, and Tangent
      "3.3": Sine and Cosine Function Values
      "3.4": Sine and Cosine Function Graphs
      "3.5": Sinusoidal Functions
      "3.6": Sinusoidal Function Transformations
      "3.7": Sinusoidal Function Context and Data Modeling
      "3.8": The Tangent Function
      "3.9": Inverse Trigonometric Functions
      "3.10": Trigonometric Equations and Inequalities
      "3.11": The Secant, Cosecant, and Cotangent Functions
      "3.12": Equivalent Representations of Trigonometric Functions
      "3.13": Trigonometry and Polar Coordinates
      "3.14": Polar Function Graphs
      "3.15": Rates of Change in Polar Functions
  # Not assessed on the AP exam (0% weighting in the CED); taught here as the
  # rest of a full precalculus course.
  - number: 4
    slug: unit-04-parameters-vectors-and-matrices
    title: Functions Involving Parameters, Vectors, and Matrices
    weight: "not on the AP exam"
    weeks: [27, 28, 29, 30, 31, 32]
    topics:
      "4.1": Parametric Functions
      "4.2": Parametric Functions Modeling Planar Motion
      "4.3": Parametric Functions and Rates of Change
      "4.4": Parametrically Defined Circles and Lines
      "4.5": Implicitly Defined Functions
      "4.6": Conic Sections
      "4.7": Parametrization of Implicitly Defined Functions
      "4.8": Vectors
      "4.9": Vector-Valued Functions
      "4.10": Matrices
      "4.11": The Inverse and Determinant of a Matrix
      "4.12": Linear Transformations and Matrices
      "4.13": Matrices as Functions
      "4.14": Matrices Modeling Contexts
