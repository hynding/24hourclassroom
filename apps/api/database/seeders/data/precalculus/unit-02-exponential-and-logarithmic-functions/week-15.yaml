    - slug: precalc-u02-w15-q22
      type: short_answer
      topic_code: "2.11"
      source: "AP Precalculus CED, Topic 2.11"
      points: 3
      prompt: |
        A table gives values of a function h.

        x: 2, 4, 8, 16, 32
        h(x): 1, 2.5, 4, 5.5, 7

        (a) Explain why a logarithmic function is a suitable model for h.
        (b) Find a model of the form h(x) = a + b log₂ x that fits the table exactly.
        (c) Use your model to predict h(128), and state whether h is concave up or concave down.
      answer: |
        (a) Each input is double the one before, and each output is 1.5 more than the one before: when inputs are multiplied by a constant factor, outputs change by a constant amount. That is the logarithmic pattern.
        (b) Each doubling adds 1.5, so b = 1.5. At x = 2: a + 1.5 · 1 = 1, so a = −0.5. h(x) = −0.5 + 1.5 log₂ x. (Check: h(32) = −0.5 + 1.5 · 5 = 7.)
        (c) h(128) = −0.5 + 1.5 · 7 = 10. h is concave down: it is increasing, but it takes ever longer input intervals to add the same 1.5 (b > 0 and base 2 > 1).
      explanation: |
        Three points, one per part. (a) must name both the multiplicative input pattern and the additive output pattern. (b) correct a and b (an equivalent correct model such as 1.5 log₂(x/2) + 1 earns the point). (c) the value 10 and concave down with a reason.
    - slug: precalc-u02-w15-q23
      type: short_answer
      topic_code: "2.12"
      source: "AP Precalculus CED, Topic 2.12"
      points: 3
      prompt: |
        (a) For x > 0 and y > 0, expand log₂(8x³/√y) completely.
        (b) For x > 0, write ln x + 2 ln(x + 3) − ln 4 as a single logarithm.
        (c) Using log 2 ≈ 0.301 and log 3 ≈ 0.477, estimate log 0.6 without a calculator. Show the properties you use.
      answer: |
        (a) log₂ 8 + log₂(x³) − log₂(y^(1/2)) = 3 + 3 log₂ x − (1/2) log₂ y.
        (b) ln x + ln((x + 3)²) − ln 4 = ln(x(x + 3)²/4).
        (c) 0.6 = 6/10 = (2 · 3)/10, so log 0.6 = log 2 + log 3 − log 10 ≈ 0.301 + 0.477 − 1 = −0.222.
      explanation: |
        Three points, one per part. (a) all three terms correct, including log₂ 8 = 3 and the coefficient 1/2. (b) a single correct logarithm. (c) −0.222 (accept −0.22) with the properties shown; a negative value is expected because 0.6 < 1.
    - slug: precalc-u02-w15-q24
      type: long_answer
      topic_code: "2.11"
      source: "AP Precalculus CED, Topic 2.11"
      points: 6
      prompt: |
        (Calculator.) In a hypothetical study, a learner's score on a vocabulary test after t weeks of practice with an app is modelled by S(t) = 20 + 12 log₂(t + 1), for 0 ≤ t ≤ 31.

        (A) (i) Find S(0) and S(7), and the average rate of change of S over 0 ≤ t ≤ 7. Include units.
            (ii) Find the average rate of change of S over 7 ≤ t ≤ 15. Use your two rates to explain whether the graph of S is concave up or concave down on 0 ≤ t ≤ 15.
        (B) (i) Use the change-of-base formula to write S in the form S(t) = 20 + k ln(t + 1). Give k to the nearest hundredth.
            (ii) Use a property of logarithms to show that whenever t + 1 doubles, the model's score rises by exactly 12 points.
        (C) A student says the model predicts that the score will eventually exceed every number, so it is fine to use it for t = 1,000. Use a limit to describe the model's end behaviour, and give one reason the model should not be used far beyond its domain.
      answer: |
        (A)(i) S(0) = 20 + 12 log₂ 1 = 20 points. S(7) = 20 + 12 log₂ 8 = 20 + 36 = 56 points. Average rate of change = (56 − 20)/(7 − 0) = 36/7 ≈ 5.14 points per week.
        (A)(ii) S(15) = 20 + 12 log₂ 16 = 68, so the rate over [7, 15] is (68 − 56)/8 = 1.5 points per week. The average rate of change decreases from about 5.14 to 1.5 over consecutive intervals while S keeps increasing, which is consistent with a graph that is concave down.
        (B)(i) log₂(t + 1) = ln(t + 1)/ln 2, so S(t) = 20 + (12/ln 2) ln(t + 1) ≈ 20 + 17.31 ln(t + 1).
        (B)(ii) If t + 1 is replaced by 2(t + 1), then 12 log₂(2(t + 1)) = 12(log₂ 2 + log₂(t + 1)) = 12 + 12 log₂(t + 1). So the score is 12 points higher.
        (C) lim (t → ∞) S(t) = ∞: the formula increases without bound, though very slowly (S(1,000) ≈ 139.6). But the model was built only for 0 ≤ t ≤ 31, and a real test has a maximum possible score, so extrapolating to t = 1,000 is not justified.
      explanation: |
        Six points. (A)(i) 1 point: S(0) = 20, S(7) = 56 and 36/7 ≈ 5.14 points per week (units required). (A)(ii) 2 points: 1 for 1.5 points per week; 1 for concluding concave down because the rate decreases. (B)(i) 1 point: k ≈ 17.31 (accept 17.3) with the change-of-base step shown. (B)(ii) 1 point: a correct use of the product property showing the increase of 12. (C) 1 point: the limit statement (or equivalent words) together with one valid limitation, such as the domain of the data or a maximum test score.
