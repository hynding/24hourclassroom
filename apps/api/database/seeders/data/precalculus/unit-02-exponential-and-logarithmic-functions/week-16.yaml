    - slug: precalc-u02-w16-q21
      type: short_answer
      topic_code: "2.13"
      source: "AP Precalculus CED, Topic 2.13"
      points: 3
      prompt: |
        Consider the equation log₂(x + 2) + log₂(x − 5) = 3.

        (a) Use a property of logarithms to write the left side as a single logarithm, then rewrite the equation in exponential form.
        (b) Solve the resulting equation.
        (c) Check each candidate in the original equation, state the solution set, and explain why any candidate is rejected.
      answer: |
        (a) log₂((x + 2)(x − 5)) = 3, so (x + 2)(x − 5) = 2³ = 8.
        (b) x² − 3x − 10 = 8, so x² − 3x − 18 = 0 and (x − 6)(x + 3) = 0. Candidates: x = 6 and x = −3.
        (c) x = 6: log₂ 8 + log₂ 1 = 3 + 0 = 3. ✓ x = −3: log₂(−1) and log₂(−8) are undefined, so −3 is extraneous. Solution set: {6}. The original equation needs x + 2 > 0 and x − 5 > 0, that is x > 5; condensing allowed x < −2 as well, which is where −3 came from.
      explanation: |
        Three points, one per part. (a) the product property and the exponential form (x + 2)(x − 5) = 8. (b) both candidates 6 and −3 from correct algebra. (c) the check of both values, the solution {6}, and a reason referring to undefined logarithms (or the domain x > 5).
    - slug: precalc-u02-w16-q22
      type: short_answer
      topic_code: "2.5"
      source: "AP Precalculus CED, Topic 2.5"
      points: 3
      prompt: |
        (Calculator.) A hypothetical population of fish in a lake is modelled by P(t) = 800e^(0.05t), where t is years after the lake was stocked.

        (a) What was the initial population, and what does the 0.05 represent?
        (b) By what percent does the population grow each year, to the nearest hundredth of a percent?
        (c) Find the doubling time to the nearest hundredth of a year. Show your work.
      answer: |
        (a) P(0) = 800 fish. The 0.05 is the continuous growth rate, 5% per year compounded continuously.
        (b) Each year the population is multiplied by e^0.05 ≈ 1.0513, so it grows by about 5.13% per year.
        (c) 800e^(0.05t) = 1,600 gives e^(0.05t) = 2, so 0.05t = ln 2 and t = ln 2 / 0.05 ≈ 13.86 years.
      explanation: |
        Three points, one per part. (a) 800 fish and the meaning of 0.05 as a continuous rate. (b) 5.13% (accept 5.1%) from the one-year factor e^0.05. (c) 13.86 years with the logarithm step shown.
    - slug: precalc-u02-w16-q23
      type: long_answer
      topic_code: "2.13"
      source: "AP Precalculus CED, Topic 2.13"
      points: 6
      prompt: |
        Answer each part. Show the steps that lead to your answers.

        (A) (i) Solve 2 · 5^(x+1) = 18 for x. Give an exact answer and a decimal to the nearest thousandth.
            (ii) Solve ln x + ln(x + 4) = ln 12 for x. Check any candidates.
        (B) Solve the inequality 5(0.6)ˣ ≤ 1. Give the boundary to the nearest hundredth and explain the direction of your answer.
        (C) Let f(x) = 2 + 3^(x−1).
            (i) Find f⁻¹(x).
            (ii) State the domain and range of f⁻¹.
      answer: |
        (A)(i) 5^(x+1) = 9, so x + 1 = log₅ 9 and x = log₅ 9 − 1 = ln 9 / ln 5 − 1 ≈ 0.365.
        (A)(ii) ln(x(x + 4)) = ln 12, so x² + 4x − 12 = 0 and (x + 6)(x − 2) = 0. x = 2 checks: ln 2 + ln 6 = ln 12. x = −6 makes ln x undefined, so it is extraneous. Solution: x = 2.
        (B) (0.6)ˣ ≤ 0.2, so x ln 0.6 ≤ ln 0.2. Since ln 0.6 < 0, dividing by it reverses the inequality: x ≥ ln 0.2 / ln 0.6 ≈ 3.15. This makes sense because 5(0.6)ˣ is decreasing, so it stays at or below 1 from the boundary onward.
        (C)(i) Swap: x = 2 + 3^(y−1), so 3^(y−1) = x − 2, y − 1 = log₃(x − 2) and f⁻¹(x) = 1 + log₃(x − 2).
        (C)(ii) f has domain all real numbers and range y > 2, so f⁻¹ has domain x > 2 and range all real numbers.
      explanation: |
        Six points. (A)(i) 1 point: an exact form (log₅ 9 − 1 or equivalent) and 0.365. (A)(ii) 2 points: 1 for the candidates 2 and −6 from correct algebra; 1 for rejecting −6 with a reason and giving x = 2. (B) 1 point: x ≥ 3.15 with the reversal explained (dividing by a negative log, or the function decreasing). (C)(i) 1 point: a correct inverse in any equivalent form. (C)(ii) 1 point: domain x > 2 and range all real numbers.
