    - slug: precalc-u02-w17-q22
      type: short_answer
      topic_code: "2.14"
      source: "AP Precalculus CED, Topic 2.14"
      points: 3
      prompt: |
        (Calculator.) Sound level in decibels is L = 10 log(I/I₀), where I is the intensity of a sound and I₀ is a fixed reference intensity.

        (a) A hypothetical fan has intensity I = 10^6.5 · I₀. Find its sound level.
        (b) A hypothetical leaf blower has a sound level of 80 dB. How many times as intense as the fan is it? Give your answer to the nearest tenth.
        (c) If the fan's intensity is tripled, by how many decibels does its sound level increase? Give your answer to the nearest hundredth.
      answer: |
        (a) L = 10 log(10^6.5) = 10 · 6.5 = 65 dB.
        (b) 80 − 65 = 15 = 10 log(ratio), so the ratio is 10^1.5 ≈ 31.6. The leaf blower is about 31.6 times as intense.
        (c) The increase is 10 log 3 ≈ 4.77 dB, regardless of the starting level, because 10 log(3I/I₀) = 10 log 3 + 10 log(I/I₀).
      explanation: |
        Three points, one per part. (a) 65 dB. (b) 31.6, with the level difference converted to a ratio. (c) 4.77 dB, with the product property or a direct computation (75 − 65 is not accepted; any correct method leading to 4.77 is).
    - slug: precalc-u02-w17-q23
      type: short_answer
      topic_code: "2.15"
      source: "AP Precalculus CED, Topic 2.15"
      points: 3
      prompt: |
        (Calculator.) A hypothetical table gives values of a quantity y.

        x: 0, 1, 2, 3
        y: 200, 140, 98, 68.6

        (a) Compute log y for each x (to three decimal places) and explain what the results show about the data.
        (b) Use the slope and intercept of the line through (x, log y) to write an exponential model for y.
        (c) Interpret the base of your model as a percent change.
      answer: |
        (a) log y ≈ 2.301, 2.146, 1.991, 1.836. The values drop by a constant 0.155 each step, so (x, log y) lies on a line and the data are exponential.
        (b) Slope ≈ −0.155 = log b, so b = 10^(−0.155) ≈ 0.70; intercept 2.301 = log a, so a = 10^2.301 ≈ 200. Model: y = 200 · (0.7)ˣ.
        (c) Each increase of 1 in x multiplies y by 0.7, a decrease of 30% per unit.
      explanation: |
        Three points, one per part. (a) the four log values and the conclusion that a constant difference means exponential data. (b) the model y = 200(0.7)ˣ obtained from slope and intercept (small rounding differences such as 0.699 accepted). (c) a 30% decrease per unit of x.
    - slug: precalc-u02-w17-q24
      type: long_answer
      topic_code: "2.15"
      source: "AP Precalculus CED, Topic 2.15"
      points: 6
      prompt: |
        (Calculator.) The concentration C, in milligrams per litre, of a hypothetical chemical in a tank is measured t hours after a filter is switched on.

        t (hours): 0, 2, 4, 6, 8
        C (mg/L): 80, 51.2, 32.8, 21.0, 13.4

        (A) (i) Show that the data are approximately consistent with an exponential model by examining ratios of consecutive values.
            (ii) Find ln C at t = 0 and at t = 8, and use them to compute the slope of the line through the points (t, ln C). Give values to three decimal places.
        (B) (i) Use your slope and the intercept ln 80 to write an exponential model C(t) = a · bᵗ, with b to the nearest hundredth.
            (ii) Interpret b in the context of the problem.
        (C) (i) Use your model to find when the concentration first falls below 5 mg/L. Give your answer to the nearest tenth of an hour.
            (ii) Explain why the points (t, ln C) lie close to a straight line, and state one reason the model might not be valid for large t.
      answer: |
        (A)(i) 51.2/80 = 0.64, 32.8/51.2 ≈ 0.641, 21.0/32.8 ≈ 0.640, 13.4/21.0 ≈ 0.638. The ratios over equal 2-hour intervals are nearly constant (about 0.64), which is the exponential pattern.
        (A)(ii) ln 80 ≈ 4.382 and ln 13.4 ≈ 2.595. Slope ≈ (2.595 − 4.382)/8 ≈ −0.223.
        (B)(i) b = e^(−0.223) ≈ 0.80 and a = e^(ln 80) = 80, so C(t) = 80 · (0.80)ᵗ.
        (B)(ii) Each hour the concentration is multiplied by 0.80: it decreases by about 20% per hour.
        (C)(i) 80(0.8)ᵗ < 5 gives (0.8)ᵗ < 1/16, so t ln 0.8 < ln(1/16). Dividing by the negative ln 0.8 reverses the inequality: t > ln(1/16)/ln 0.8 ≈ 12.4 hours.
        (C)(ii) If C = a · bᵗ then ln C = ln a + t ln b, which is linear in t, so exponential data give (nearly) collinear points. For large t the model predicts the concentration approaching 0 forever; in practice the filter may stop removing chemical below some level, or the measurements may reach the limit of detection, so the model may not hold.
      explanation: |
        Six points, one per sub-part. (A)(i) at least three ratios with the conclusion that they are nearly constant. (A)(ii) both ln values and a slope of about −0.223 (accept −0.22). (B)(i) C(t) = 80(0.80)ᵗ (accept b from 0.79 to 0.81 consistent with the student's slope). (B)(ii) a 20% decrease per hour (or multiplied by 0.80 each hour), in context. (C)(i) about 12.4 hours with the reversal of the inequality handled correctly (accept 12.3 to 12.5 consistent with the student's b). (C)(ii) the log-linear algebra plus one sensible limitation.
