    - slug: precalc-u02-w12-q23
      type: long_answer
      topic_code: "2.6"
      source: "AP Precalculus CED, Topic 2.6"
      points: 6
      prompt: |
        A calculator is allowed on this question. The table shows the total views, in thousands, of a hypothetical online video t days after it was posted, with residuals for three regression models:
        linear L(t) = 6.29t − 1.95, quadratic Q(t) = 0.80t² + 1.50t + 2.04 and exponential E(t) = 2.64(1.627)ᵗ.

        | t (days) | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
        |---|---|---|---|---|---|---|---|
        | Views (thousands) | 2.1 | 4.2 | 8.4 | 13.5 | 20.9 | 29.6 | 39.7 |
        | Residual for L | 4.05 | −0.14 | −2.23 | −3.42 | −2.31 | 0.10 | 3.91 |
        | Residual for Q | 0.06 | −0.14 | 0.16 | −0.24 | 0.06 | 0.06 | −0.14 |
        | Residual for E | −0.54 | −0.10 | 1.41 | 2.13 | 2.40 | −0.50 | ? |

        (A) (i) Find the residual for E at t = 6. Show your computation.
            (ii) Interpret your answer to (A)(i) in context.
        (B) (i) Which of the three models is most appropriate for these data? Justify your choice using the residuals.
            (ii) Use the first and second differences of the views to explain why your choice in (B)(i) is reasonable.
        (C) (i) Use your chosen model to predict the total views on day 10, with units.
            (ii) Give one reason why using the model to predict the total views on day 60 may not be valid.
      answer: |
        (A)(i) E(6) = 2.64(1.627)⁶ ≈ 48.97, so the residual is 39.7 − 48.97 ≈ −9.27.
        (A)(ii) The exponential model overestimates the total views on day 6 by about 9.27 thousand views.
        (B)(i) The quadratic model Q. Its residuals are all small (at most 0.24 thousand in size) and alternate in sign with no pattern. L's residuals form a U-shape (positive, negative, positive), and E's residuals form a pattern that ends with a large negative value, so both have the wrong shape.
        (B)(ii) First differences 2.1, 4.2, 5.1, 7.4, 8.7, 10.1 are increasing, so the data are not linear. Second differences 2.1, 0.9, 2.3, 1.3, 1.4 are roughly constant (around 1.6), which is the pattern of a quadratic. Ratios of consecutive values fall from 2.0 to about 1.34, so they are not constant, which argues against exponential.
        (C)(i) Q(10) = 0.80(100) + 1.50(10) + 2.04 = 97.04, so about 97 thousand total views.
        (C)(ii) Day 60 is far outside the data (days 0–6). The quadratic predicts Q(60) ≈ 2,972 thousand views because it keeps accelerating, but interest in a video usually levels off, so the pattern is unlikely to continue that long.
      explanation: |
        Six points.
        (A) 1 point for E(6) ≈ 48.97 and residual ≈ −9.27 (accept −9.2 to −9.3); 1 point for interpreting it as an overestimate of about 9.3 thousand views on day 6.
        (B) 1 point for choosing Q with a residual-based justification that addresses the patterns of L or E; 1 point for using differences (non-constant first, roughly constant second) to support the quadratic.
        (C) 1 point for about 97 thousand views with units; 1 point for a valid limitation tied to extrapolation or context.
