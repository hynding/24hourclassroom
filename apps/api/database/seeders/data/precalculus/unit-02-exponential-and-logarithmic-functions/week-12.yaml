    # ---- Short answers
    - slug: precalc-u02-w12-q21
      type: short_answer
      topic_code: "2.5"
      source: "AP Precalculus CED, Topic 2.5"
      points: 3
      prompt: |
        A calculator is allowed. A hypothetical town had 1,800 residents in year t = 2 and 1,200 residents in year t = 5. Assume the population follows an exponential model P(t) = a · bᵗ.

        (a) Find b and a, rounding b to four decimal places and a to the nearest whole number.
        (b) By what percent does the population change each year?
        (c) Without using your rounded model, predict the population in year 8 and explain your reasoning.
      answer: |
        (a) b³ = 1200/1800 = 2/3, so b = (2/3)^(1/3) ≈ 0.8736. a = 1800/b² ≈ 2359.
        (b) The factor 0.8736 means a decrease of about 12.6% per year.
        (c) Over any 3-year interval the population is multiplied by 2/3. From year 5 to year 8 is 3 years, so P(8) = 1200 · 2/3 = 800 residents.
      explanation: |
        Three points, one per part. (a) b ≈ 0.8736 from b³ = 2/3 and a ≈ 2359 (accept 2358–2359). (b) a decrease of about 12.6% per year, stated as a decrease. (c) 800 with the 3-year factor reasoning.
    - slug: precalc-u02-w12-q22
      type: short_answer
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 3
      prompt: |
        A function f has these values.

        | x | 0 | 3 | 6 | 9 |
        |---|---|---|---|---|
        | f(x) | 40 | 50 | 62.5 | 78.125 |

        (a) Show that the data are consistent with an exponential function and not a linear one.
        (b) Write an exponential function f that fits the table.
        (c) Find f(12), and find the factor by which f changes per unit increase in x, to four decimal places. (A calculator is allowed.)
      answer: |
        (a) The inputs are equally spaced by 3. Differences 10, 12.5, 15.625 are not constant, so f is not linear; ratios 50/40 = 62.5/50 = 78.125/62.5 = 1.25 are constant, so f is exponential.
        (b) f(x) = 40(1.25)^(x/3).
        (c) f(12) = 40(1.25)⁴ = 97.65625. The per-unit factor is 1.25^(1/3) ≈ 1.0772.
      explanation: |
        Three points, one per part. (a) constant ratios over equal input steps and non-constant differences. (b) any equivalent form, such as 40(1.25)^(x/3) or 40(1.0772)ˣ. (c) f(12) = 97.65625 (accept 97.66) and the factor ≈ 1.0772.
