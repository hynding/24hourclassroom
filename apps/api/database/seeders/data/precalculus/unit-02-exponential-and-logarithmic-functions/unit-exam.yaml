  - slug: precalc-u02-exam-q36
    type: true_false
    topic_code: "2.8"
    source: "AP Precalculus CED, Topic 2.8"
    points: 1
    prompt: |
      True or false: The function f(x) = x², with domain all real numbers, has an inverse function.
    answer: false
    explanation: |
      False. f is not one-to-one: f(2) = f(−2) = 4, so an inverse could not decide whether 4 should go back to 2 or −2. Restricting the domain to x ≥ 0 gives a one-to-one function whose inverse is √x.
  - slug: precalc-u02-exam-q37
    type: true_false
    topic_code: "2.4"
    source: "AP Precalculus CED, Topic 2.4"
    points: 1
    prompt: |
      True or false: Shifting the graph of y = 2ˣ left 3 units gives the same graph as stretching it vertically by a factor of 8.
    answer: true
    explanation: |
      True. A left shift of 3 gives y = 2^(x+3) = 2³ · 2ˣ = 8 · 2ˣ, which is the vertical stretch by 8. For exponential functions, a horizontal translation is always equivalent to a vertical dilation.
  - slug: precalc-u02-exam-q38
    type: fill_blank
    topic_code: "2.13"
    source: "AP Precalculus CED, Topic 2.13"
    points: 1
    prompt: |
      Give the exact value as a fraction or decimal: the solution of 2^(3x) = 32^(x−1) is x = ____
    answer: ["5/2", "2.5", "2 1/2"]
    explanation: |
      32 = 2⁵, so 32^(x−1) = 2^(5x−5). Then 3x = 5x − 5, so x = 5/2. Check: 2^(3 · 2.5) = 2^7.5 and 32^(1.5) = (2⁵)^1.5 = 2^7.5.
  - slug: precalc-u02-exam-q39
    type: fill_blank
    topic_code: "1.5"
    source: "AP Precalculus CED, Topic 1.5"
    points: 1
    prompt: |
      A polynomial with real coefficients has zeros 4 and 2 − i. The least possible degree of the polynomial is ____
    answer: ["3", "three"]
    explanation: |
      Non-real zeros of a polynomial with real coefficients come in conjugate pairs, so 2 + i is also a zero. With 4, 2 − i and 2 + i there are at least three zeros, so the degree is at least 3.
  - slug: precalc-u02-exam-q40
    type: numeric
    topic_code: "2.5"
    source: "AP Precalculus CED, Topic 2.5"
    points: 1
    prompt: |
      (Calculator.) A hypothetical medicine has a half-life of 8 hours in the body. A patient takes 120 mg. How many milligrams remain after 20 hours? Give your answer to the nearest hundredth.
    answer: { value: 21.21, tolerance: 0.01 }
    explanation: |
