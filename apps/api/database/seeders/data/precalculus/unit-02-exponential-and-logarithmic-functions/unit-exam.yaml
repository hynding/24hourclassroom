  - slug: precalc-u02-exam-q41
    type: numeric
    topic_code: "2.14"
    source: "AP Precalculus CED, Topic 2.14"
    points: 1
    prompt: |
      (Calculator.) Sound level in decibels is L = 10 log(I/I₀). A hypothetical concert speaker produces an intensity 3.2 × 10⁸ times the reference intensity I₀. What is its sound level, to the nearest tenth of a decibel?
    answer: { value: 85.1, tolerance: 0.1 }
    explanation: |
      L = 10 log(3.2 × 10⁸) = 10(log 3.2 + 8) ≈ 10(0.505 + 8) = 85.05, which rounds to 85.1 dB.
  - slug: precalc-u02-exam-q42
    type: short_answer
    topic_code: "2.8"
    source: "AP Precalculus CED, Topic 2.8"
    points: 3
    prompt: |
      Let f(x) = 4 + √(x − 2) for x ≥ 2.

      (a) Find a formula for f⁻¹(x).
      (b) State the domain and range of f⁻¹.
      (c) Verify that f(f⁻¹(x)) = x for every x in the domain of f⁻¹.
    answer: |
      (a) Swap: x = 4 + √(y − 2), so √(y − 2) = x − 4, y − 2 = (x − 4)² and f⁻¹(x) = (x − 4)² + 2.
      (b) f has domain x ≥ 2 and range y ≥ 4 (√ is at least 0). So f⁻¹ has domain x ≥ 4 and range y ≥ 2.
      (c) f(f⁻¹(x)) = 4 + √((x − 4)² + 2 − 2) = 4 + √((x − 4)²) = 4 + |x − 4|. For x ≥ 4, |x − 4| = x − 4, so f(f⁻¹(x)) = x.
    explanation: |
      Three points, one per part. (a) the correct formula (with or without the domain stated). (b) domain x ≥ 4 and range y ≥ 2; the domain restriction is essential, since (x − 4)² + 2 on all reals is not one-to-one. (c) a correct composition that handles √((x − 4)²) = x − 4 using x ≥ 4.
  - slug: precalc-u02-exam-q43
    type: short_answer
    topic_code: "2.12"
    source: "AP Precalculus CED, Topic 2.12"
    points: 3
    prompt: |
      Use log₂ 3 ≈ 1.585 and log₂ 5 ≈ 2.322, together with properties of logarithms, to answer each part without a calculator. Show the properties you use.

      (a) Estimate log₂ 45.
      (b) Estimate log₂ 0.6.
      (c) Estimate log₃ 5.
    answer: |
      (a) 45 = 3² · 5, so log₂ 45 = 2 log₂ 3 + log₂ 5 ≈ 3.170 + 2.322 = 5.492.
      (b) 0.6 = 3/5, so log₂ 0.6 = log₂ 3 − log₂ 5 ≈ 1.585 − 2.322 = −0.737.
      (c) By change of base, log₃ 5 = log₂ 5 / log₂ 3 ≈ 2.322/1.585 ≈ 1.465.
    explanation: |
      Three points, one per part. (a) 5.492 (accept 5.49) with the power and product properties. (b) −0.737 (accept −0.74) with the quotient property. (c) 1.465 (accept 1.46 or 1.47) with change of base written as a quotient of base-2 logs.
  - slug: precalc-u02-exam-q44
    type: long_answer
    topic_code: "2.6"
    source: "AP Precalculus CED, Topic 2.6"
    points: 6
    prompt: |
      (Calculator.) A hypothetical lake is stocked with trout. The population P, in hundreds of trout, is estimated each year for 5 years, where t is years after stocking.

      t: 0, 1, 2, 3, 4, 5
      P: 12, 15.6, 20.3, 26.4, 34.3, 44.6

      Two models are proposed: a linear model L(t) = 9.45 + 6.43t and an exponential model E(t) = 12(1.3)ᵗ.

      (A) (i) Use ratios of consecutive values to explain why an exponential model is reasonable for these data.
          (ii) Find the average rate of change of P over 0 ≤ t ≤ 5. Include units.
      (B) (i) Find the residuals of both models at t = 0, t = 3 and t = 5.
          (ii) Which model is more appropriate? Justify your answer using your residuals.
      (C) (i) Use the exponential model to find when the population reaches 10,000 trout. Give your answer to the nearest hundredth of a year.
          (ii) Give one reason why the exponential model may not be valid for predictions many years after stocking.
    answer: |
      (A)(i) 15.6/12 = 1.3, 20.3/15.6 ≈ 1.301, 26.4/20.3 ≈ 1.300, 34.3/26.4 ≈ 1.299, 44.6/34.3 ≈ 1.300. The ratios over equal one-year steps are nearly constant at 1.3, so the population is multiplied by about the same factor each year, which is exponential behaviour.
      (A)(ii) (44.6 − 12)/(5 − 0) = 32.6/5 = 6.52 hundred trout per year (about 652 trout per year).
      (B)(i) Linear: L(0) = 9.45, residual 12 − 9.45 = 2.55; L(3) = 28.74, residual 26.4 − 28.74 = −2.34; L(5) = 41.6, residual 44.6 − 41.6 = 3.00. Exponential: E(0) = 12, residual 0; E(3) = 26.364, residual ≈ 0.04; E(5) ≈ 44.555, residual ≈ 0.04.
      (B)(ii) The exponential model is more appropriate. Its residuals are all very close to 0, while the linear model's residuals are larger and follow a pattern (positive, negative, positive), showing that the line misses the upward curvature of the data.
      (C)(i) 10,000 trout is P = 100. 12(1.3)ᵗ = 100 gives (1.3)ᵗ = 25/3, so t = ln(25/3)/ln 1.3 ≈ 8.08 years.
      (C)(ii) A lake has limited food and space, so the population cannot keep growing by 30% a year; growth will slow as it approaches the lake's carrying capacity. (Fishing or disease could also change the pattern.) The data cover only 5 years, so predictions far beyond that are extrapolation.
    explanation: |
      Six points, one per sub-part. (A)(i) at least three ratios and the conclusion that a nearly constant ratio indicates exponential change. (A)(ii) 6.52 with units of hundreds of trout per year. (B)(i) all six residuals, computed as actual − predicted (allow ±0.01 rounding). (B)(ii) chooses the exponential model with a justification that refers to residual size and the linear model's pattern. (C)(i) 8.08 years with a logarithm step shown (accept 8.1). (C)(ii) one valid limitation in context.
  - slug: precalc-u02-exam-q45
    type: long_answer
    topic_code: "2.13"
    source: "AP Precalculus CED, Topic 2.13"
    points: 6
    prompt: |
      Answer each part without a calculator. Show the steps that lead to your answers.

      (A) Solve each equation for x. Give exact answers.
          (i) ln(x + 3) − ln(x − 1) = ln 5
          (ii) e^(2x) − 3eˣ − 10 = 0
      (B) (i) Rewrite g(x) = 4 · 8^(x/3) in the form a · bˣ, where a and b are constants.
          (ii) For x > 0, rewrite k(x) = log₂(32x) − log₂(x²) in the form c + d log₂ x, where c and d are constants.
      (C) Use your answer to (B)(i) to solve the inequality g(x) > 128.
    answer: |
      (A)(i) ln((x + 3)/(x − 1)) = ln 5, so (x + 3)/(x − 1) = 5, x + 3 = 5x − 5 and x = 2. Check: ln 5 − ln 1 = ln 5, and both arguments are positive. x = 2.
      (A)(ii) With u = eˣ: u² − 3u − 10 = 0, so (u − 5)(u + 2) = 0. eˣ = 5 gives x = ln 5. eˣ = −2 has no solution because eˣ > 0. x = ln 5.
      (B)(i) 8^(x/3) = (2³)^(x/3) = 2ˣ, so g(x) = 4 · 2ˣ (a = 4, b = 2).
      (B)(ii) log₂(32x) − log₂(x²) = log₂ 32 + log₂ x − 2 log₂ x = 5 − log₂ x (c = 5, d = −1).
      (C) 4 · 2ˣ > 128 gives 2ˣ > 32 = 2⁵. Since 2ˣ is increasing, x > 5.
    explanation: |
      Six points. (A)(i) 1 point: x = 2 with the quotient property used (a check is expected). (A)(ii) 2 points: 1 for the substitution and factoring to eˣ = 5 or eˣ = −2; 1 for x = ln 5 with the negative case rejected and a reason. (B)(i) 1 point: g(x) = 4 · 2ˣ. (B)(ii) 1 point: 5 − log₂ x. (C) 1 point: x > 5 with the increasing property (or matching bases) as justification.
