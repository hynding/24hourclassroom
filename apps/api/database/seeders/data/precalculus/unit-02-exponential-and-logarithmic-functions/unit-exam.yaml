  - slug: precalc-u02-exam-q31
    type: multi_select
    topic_code: "2.15"
    source: "AP Precalculus CED, Topic 2.15"
    points: 2
    partial_credit: true
    prompt: |
      A data set plotted on a semi-log plot (vertical axis logarithmically scaled) falls on a straight line with positive slope. Which statements must be true? Select all that apply.
    options:
