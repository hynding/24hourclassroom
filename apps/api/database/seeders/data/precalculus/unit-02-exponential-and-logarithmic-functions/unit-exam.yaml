  - slug: precalc-u02-exam-q28
    type: multiple_choice
    topic_code: "2.14"
    source: "AP Precalculus CED, Topic 2.14"
    points: 1
    prompt: |
      (Calculator.) Acidity is measured by pH = −log H, where H is the hydrogen-ion concentration. Hypothetical solution A has pH 3.2 and solution B has pH 4.9. To the nearest tenth, how many times the hydrogen-ion concentration of B is the concentration of A?
    options:
      - "1.7"
      - "50.1"
      - "0.02"
      - "1.5"
    option_explanations:
      - |
        1.7 is the difference in pH; it is the exponent on 10, not the ratio.
      - |
        Correct. H_A/H_B = 10^(−3.2)/10^(−4.9) = 10^1.7 ≈ 50.1.
      - |
        0.02 ≈ 10^(−1.7) is the ratio the other way round; the lower pH (A) has the higher concentration.
      - |
        1.5 ≈ 4.9/3.2 divides the pH values, which are logarithms, not concentrations.
