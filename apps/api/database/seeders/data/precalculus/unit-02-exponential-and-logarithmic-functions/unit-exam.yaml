  - slug: precalc-u02-exam-q29
    type: multiple_choice
    topic_code: "2.14"
    source: "AP Precalculus CED, Topic 2.14"
    points: 1
    prompt: |
      (Calculator.) A hypothetical model of the form y = a + b log₂ x passes through (2, 3) and (16, 9). Which gives the model and its prediction at x = 50, to the nearest hundredth?
    options:
      - "y = 1 + 2 log₂ x; y = 101.00"
      - "y = 3 + 2 log₂ x; y = 14.29"
      - "y = 1 + 2 log x; y = 4.40"
      - "y = 1 + 2 log₂ x; y = 12.29"
    option_explanations:
      - |
        The model is right, but 101 = 1 + 2 · 50 drops the logarithm when evaluating.
      - |
        a is not the first y-value: at x = 2, log₂ 2 = 1, so a + b = 3 and a = 1.
      - |
        The parameters are for base 2; switching to base 10 at the prediction step gives the wrong value.
      - |
        Correct. log₂ 2 = 1 and log₂ 16 = 4, so a + b = 3 and a + 4b = 9, giving b = 2, a = 1. Then y(50) = 1 + 2 log₂ 50 ≈ 1 + 2(5.644) ≈ 12.29.
    answer: 3
  - slug: precalc-u02-exam-q30
    type: multiple_choice
    topic_code: "2.15"
    source: "AP Precalculus CED, Topic 2.15"
