      - "lim (x → 0⁺) f(x) = −∞"
      - "The range of f is y > 0."
    option_explanations:
      - |
        Correct. 4² = 16, so log₄ 16 = 2 and (16, 2) is on the graph.
      - |
        Correct. 4^(1/2) = √4 = 2, so log₄ 2 = 1/2 and (2, 1/2) is on the graph.
      - |
        With base 4 > 1, the log graph increases at a decreasing rate: concave down.
      - |
        Correct. As x approaches 0 from the right, log₄ x decreases without bound; x = 0 is the vertical asymptote.
