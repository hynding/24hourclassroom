  - slug: precalc-u02-exam-q32
    type: multiple_choice
    topic_code: "1.12"
    source: "AP Precalculus CED, Topic 1.12"
    points: 1
    prompt: |
      The function g is defined by g(x) = −f(2x) + 3. Which sequence of transformations takes the graph of f to the graph of g?
    options:
      - "A horizontal stretch by a factor of 2, a reflection across the x-axis, then a shift up 3"
      - "A horizontal compression by a factor of 1/2, a reflection across the y-axis, then a shift up 3"
      - "A horizontal compression by a factor of 1/2, a reflection across the x-axis, then a shift up 3"
      - "A horizontal compression by a factor of 1/2, a reflection across the x-axis, then a shift down 3"
    option_explanations:
      - |
        Replacing x by 2x compresses horizontally by 1/2; a stretch by 2 would use x/2.
      - |
        The negative sign is outside f, so it negates outputs: a reflection across the x-axis, not the y-axis.
      - |
        Correct. 2x inside compresses horizontally by 1/2, the minus outside reflects across the x-axis, and +3 shifts up 3.
      - |
        +3 outside the function moves the graph up, not down.
    answer: 2
  - slug: precalc-u02-exam-q33
    type: multiple_choice
    topic_code: "1.9"
    source: "AP Precalculus CED, Topic 1.9"
    points: 1
    prompt: |
      Where does the graph of r(x) = (x + 3)/(x² − 9) have vertical asymptotes?
    options:
      - "x = 3 and x = −3"
      - "x = 3 only"
      - "x = −3 only"
      - "There are no vertical asymptotes."
    option_explanations:
      - |
        The factor x + 3 cancels, so x = −3 gives a hole, not an asymptote.
      - |
        Correct. r(x) = (x + 3)/((x − 3)(x + 3)) = 1/(x − 3) for x ≠ −3, so x = 3 is the only vertical asymptote; x = −3 is a hole.
      - |
        x = −3 is where the common factor cancels (a hole); the asymptote comes from the factor that remains, x − 3.
      - |
        The factor x − 3 does not cancel, so the outputs grow without bound near x = 3.
    answer: 1
  - slug: precalc-u02-exam-q34
    type: multi_select
    topic_code: "2.11"
    source: "AP Precalculus CED, Topic 2.11"
    points: 2
    partial_credit: true
    prompt: |
      Let f(x) = log₄ x. Which statements are true? Select all that apply.
    options:
      - "The graph of f passes through (16, 2)."
      - "The graph of f passes through (2, 1/2)."
