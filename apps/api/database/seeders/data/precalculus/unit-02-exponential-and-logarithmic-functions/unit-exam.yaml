      - "The data fit a model y = a · bˣ with b > 1."
      - "On ordinary axes, the data also lie on a straight line."
      - "The slope of the semi-log line equals the growth factor b."
      - "The vertical intercept of the semi-log line is log a, where a is the value at x = 0."
    option_explanations:
      - |
        Correct. A straight line on a semi-log plot means log y is linear in x, so y is exponential; a positive slope means growth.
      - |
        Correct. The slope is log b > 0, so b > 1.
      - |
        On ordinary axes exponential data curve upward; they look straight only after the log is taken.
      - |
        The slope is log b; the factor is 10^(slope).
      - |
        Correct. At x = 0, log y = log a, so the intercept is the log of the initial value.
