  - slug: precalc-u02-exam-q35
    type: multi_select
    topic_code: "2.5"
    source: "AP Precalculus CED, Topic 2.5"
    points: 2
    partial_credit: true
    prompt: |
      A hypothetical herd of deer is modelled by P(t) = 500(0.92)ᵗ, where t is years after a survey. Which statements are supported by the model? Select all that apply.
    options:
      - "The herd had 500 deer at the time of the survey."
      - "The herd decreases by 8% each year."
      - "The herd decreases by 40 deer each year."
      - "The herd falls to half its size after between 8 and 9 years."
      - "The model predicts 420 deer after 2 years."
    option_explanations:
      - |
        Correct. At the survey t = 0, and P(0) = 500(0.92)⁰ = 500.
      - |
        Correct. The factor 0.92 = 1 − 0.08, a decrease of 8% per year.
      - |
        40 deer is 8% of 500, the first year's loss only; later losses are smaller because each is 8% of a smaller herd.
      - |
        Correct. (0.92)ᵗ = 0.5 gives t = ln 0.5 / ln 0.92 ≈ 8.3 years.
      - |
