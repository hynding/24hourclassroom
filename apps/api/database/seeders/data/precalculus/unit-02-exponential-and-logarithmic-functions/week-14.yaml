      source: "AP Precalculus CED, Topic 2.5"
      points: 1
      prompt: |
        A hypothetical substance has a half-life of 6 hours. A sample starts at 80 mg. How many milligrams remain after 18 hours?
      answer: { value: 10, tolerance: 0 }
      explanation: |
        18 hours is 18/6 = 3 half-lives, so the amount is 80 · (1/2)³ = 80/8 = 10 mg. As a model, A(t) = 80 · (1/2)^(t/6).
    - slug: precalc-u02-w14-q21
      type: short_answer
      topic_code: "2.9"
      source: "AP Precalculus CED, Topic 2.9"
      points: 3
      prompt: |
        A hypothetical "brightness index" for light sources is defined by B = log I, where I is the intensity of the source in standard units.

        (a) A source has intensity 10,000 units. What is its brightness index?
        (b) Two sources have indexes 2.4 and 4.4. How many times as intense is the brighter source? Show how you know.
        (c) A source has intensity 5,000 units. Without a calculator, state which two consecutive integers its index lies between, and explain why its index is not 3.5 even though 5,000 is halfway between 0 and 10,000.
      answer: |
        (a) B = log 10,000 = 4, because 10⁴ = 10,000.
        (b) I₁ = 10^2.4 and I₂ = 10^4.4, so I₂/I₁ = 10^(4.4 − 2.4) = 10² = 100. The brighter source is 100 times as intense.
        (c) 10³ = 1,000 < 5,000 < 10,000 = 10⁴, so B is between 3 and 4. The index measures the exponent on 10, not the size directly: index 3.5 means 10^3.5 ≈ 3,162, and halfway in index between 3 and 4 is a multiplicative halfway (√10 times 1,000), not an additive one. (5,000 has index about 3.70.)
      explanation: |
        Three points, one per part. (a) the value 4 with the exponential reason. (b) 100 times, with the difference of indexes used as a power of 10. (c) between 3 and 4 with the power-of-10 bracket, plus a correct explanation that equal index steps are equal factors, not equal amounts.
    - slug: precalc-u02-w14-q22
      type: short_answer
      topic_code: "2.10"
      source: "AP Precalculus CED, Topic 2.10"
      points: 3
      prompt: |
        Let f(x) = (1/3)ˣ.

        (a) Write a formula for f⁻¹(x) using a logarithm, and evaluate f⁻¹(9).
        (b) State the domain, range and asymptote of f⁻¹.
        (c) Is f⁻¹ increasing or decreasing? Justify your answer using the behaviour of f.
      answer: |
        (a) f⁻¹(x) = log_(1/3) x. Since (1/3)⁻² = 9, f⁻¹(9) = −2.
        (b) Domain x > 0; range all real numbers; vertical asymptote x = 0 (the reflection of the horizontal asymptote y = 0 of f).
        (c) Decreasing. f is decreasing because its base 1/3 is between 0 and 1. If a < b then f(a) > f(b); swapping inputs and outputs, larger inputs of f⁻¹ give smaller outputs, so f⁻¹ is also decreasing. For example f⁻¹(1/3) = 1 and f⁻¹(9) = −2.
      explanation: |
        Three points, one per part. (a) the logarithm with base 1/3 and the value −2. (b) all three features (domain, range and vertical asymptote). (c) decreasing, with a justification that refers to f decreasing and the swap of inputs and outputs (a pair of example values is enough support).
    - slug: precalc-u02-w14-q23
      type: long_answer
      topic_code: "2.10"
      source: "AP Precalculus CED, Topic 2.10"
      points: 6
      prompt: |
        A hypothetical app's number of users is modelled by U(t) = 10^(t/2) thousand users, where t is the number of months after launch, for 0 ≤ t ≤ 8.

        (A) (i) Find U(4) and interpret it in context.
            (ii) Find the average rate of change of U over the interval 2 ≤ t ≤ 4. Include units.
        (B) (i) Write t as a function of U.
            (ii) Use your function to find the time when the app reaches 1,000 thousand (one million) users. Show your work.
        (C) (i) State the domain and range of the function from (B)(i) in this context.
            (ii) The points (t, U) for t = 0, 2, 4, 6 and 8 are plotted with U on a base-10 logarithmic scale. Explain why the plotted points are equally spaced vertically.
      answer: |
        (A)(i) U(4) = 10^(4/2) = 10² = 100. Four months after launch the app has 100 thousand users.
        (A)(ii) U(2) = 10¹ = 10 and U(4) = 100, so the average rate of change is (100 − 10)/(4 − 2) = 45 thousand users per month.
        (B)(i) U = 10^(t/2) gives t/2 = log U, so t = 2 log U.
        (B)(ii) t = 2 log 1,000 = 2 · 3 = 6. The app reaches one million users 6 months after launch.
        (C)(i) The inverse swaps the original domain and range. U(0) = 1 and U(8) = 10⁴ = 10,000, and U is increasing, so the domain of t(U) is 1 ≤ U ≤ 10,000 (thousand users) and its range is 0 ≤ t ≤ 8 (months).
        (C)(ii) The U-values are 1, 10, 100, 1,000 and 10,000, each 10 times the one before. On a base-10 log scale each factor of 10 is one unit of height (the positions are log U = 0, 1, 2, 3, 4), so the points are equally spaced vertically.
      explanation: |
        Six points, one per sub-part. (A)(i) 100 with an interpretation naming 4 months and 100 thousand users. (A)(ii) 45 with units of thousand users per month (no point without units). (B)(i) t = 2 log U or an equivalent form such as t = log(U²) or t = 2 log₁₀ U. (B)(ii) 6 months, with work shown from the inverse or from solving 10^(t/2) = 1,000. (C)(i) domain 1 ≤ U ≤ 10,000 and range 0 ≤ t ≤ 8; both needed. (C)(ii) an explanation that equal factors of 10 correspond to equal steps on a log scale (listing the log values 0 to 4 is enough).
