week: 14
unit: 2
title: "Logarithmic Expressions and Inverses of Exponentials"
topics: ["2.9", "2.10"]
guide: guides/week-14.md
guide_description: |
  What a logarithm is (an exponent: log_b c = a means bᵃ = c), how to evaluate logarithms exactly or estimate
  them between integers, the common and natural logarithms, and how to read a logarithmic scale; then why
  y = log_b x is the inverse of y = bˣ, with swapped tables, domains, ranges and asymptotes. Worked examples:
  log₂₇ 9, placing values on a log scale, inverting a table of 3ˣ, and turning a hypothetical growth model
  into a "time to reach" function.
flashcards_description: |
  31 cards on converting between logarithmic and exponential form, exact logarithm values, common and natural
  logs, logarithmic scales, and logarithms as inverses of exponential functions.

flashcards:
  - front: log_b c = a → the equivalent exponential statement
    back: |
      bᵃ = c. The logarithm is the exponent: the base stays the base, the log is the power, the argument is the result. log₃ 81 = 4 because 3⁴ = 81.
    topic_code: "2.9"
  - front: Allowed bases and arguments for log_b c → the restrictions
    back: |
      b > 0 and b ≠ 1, and c > 0. Base 1 gives only the output 1, a negative base gives non-real powers, and no real power of a positive base is 0 or negative.
    topic_code: "2.9"
  - front: log_b 1 for any allowed base → value and reason
    back: |
      0, because b⁰ = 1. So log₇ 1 = ln 1 = log 1 = 0.
    topic_code: "2.9"
  - front: log_b b for any allowed base → value and reason
    back: |
      1, because b¹ = b. So log₁₂ 12 = 1 and ln e = 1.
    topic_code: "2.9"
  - front: log_b(bᵏ) → simplify
    back: |
      k. The exponent on b that produces bᵏ is k: log₅(5⁻²) = −2 and ln e^0.7 = 0.7.
    topic_code: "2.9"
  - front: log₂ 64 → evaluate
    back: |
      6, because 2⁶ = 64.
    topic_code: "2.9"
  - front: log₃(1/27) → evaluate
    back: |
      −3, because 3⁻³ = 1/27. An argument between 0 and 1 gives a negative log when the base is greater than 1.
    topic_code: "2.9"
  - front: log₂₅ 5 → evaluate
    back: |
      1/2, because 25^(1/2) = √25 = 5.
    topic_code: "2.9"
  - front: log₂₇ 9 → evaluate by a common base
    back: |
      2/3. Write 27ᵃ = 9 as 3^(3a) = 3², so 3a = 2. Check: 27^(2/3) = (∛27)² = 9.
    topic_code: "2.9"
  - front: log₈ 32 → evaluate by a common base
    back: |
      5/3. 8ᵃ = 32 becomes 2^(3a) = 2⁵, so a = 5/3.
    topic_code: "2.9"
  - front: Common logarithm log x → which base, and log 0.001
    back: |
      Base 10. log 0.001 = −3 because 10⁻³ = 0.001.
    topic_code: "2.9"
  - front: Natural logarithm ln x → which base, and ln(1/e²)
    back: |
      Base e ≈ 2.71828. ln(1/e²) = ln e⁻² = −2.
    topic_code: "2.9"
  - front: log₅ 40 → which two integers it lies between
    back: |
      2 and 3, because 5² = 25 < 40 < 125 = 5³ and larger exponents give larger powers of 5. (It is about 2.29.)
    topic_code: "2.9"
  - front: Common log of a 6-digit whole number → its range
    back: |
      Between 5 and 6. A number from 100,000 up to 999,999 lies between 10⁵ and 10⁶, so its common log is at least 5 and less than 6.
    topic_code: "2.9"
  - front: 5ˣ = 40 → logarithmic form
    back: |
      x = log₅ 40. Whenever the unknown is an exponent, the logarithm names it.
    topic_code: "2.9"
  - front: log_x 125 = 3 → find x
    back: |
      Rewrite as x³ = 125, so x = 5.
    topic_code: "2.9"
  - front: Base-10 logarithmic scale → what one unit to the right means
    back: |
      Multiply the value by 10. Positions 0, 1, 2, 3 stand for the values 1, 10, 100, 1,000.
    topic_code: "2.9"
  - front: Positions 1.3 and 3.3 on a base-10 log scale → compare the values
    back: |
      The positions differ by 2, so the second value is 10² = 100 times the first. A difference in position is a ratio of values.
    topic_code: "2.9"
  - front: Position 2.5 on a base-10 log scale → value represented
    back: |
      10^2.5 = 100√10 ≈ 316, much nearer 100 than 1,000 in value even though it is halfway in position.
    topic_code: "2.9"
  - front: Inverse of f(x) = bˣ → formula and why it exists
    back: |
      f⁻¹(x) = log_b x. An exponential function is always increasing or always decreasing, so it is one-to-one and has an inverse.
    topic_code: "2.10"
  - front: y = 2ˣ through (3, 8) → matching point on y = log₂ x
    back: |
      (8, 3). Inverse functions swap inputs and outputs, so every point (a, b) on y = 2ˣ becomes (b, a) on y = log₂ x.
    topic_code: "2.10"
  - front: Domain and range of y = log_b x → state them
    back: |
      Domain x > 0, range all real numbers: the exponential's domain and range, swapped.
    topic_code: "2.10"
  - front: Asymptote of y = log_b x → which one, and where it comes from
    back: |
      The vertical asymptote x = 0. It is the reflection over y = x of the exponential's horizontal asymptote y = 0.
    topic_code: "2.10"
  - front: Graph of y = log_b x versus y = bˣ → geometric relationship
    back: |
      Each is the reflection of the other across the line y = x. Key points (0, 1) and (1, b) on the exponential become (1, 0) and (b, 1) on the logarithm.
    topic_code: "2.10"
  - front: Inverse of y = eˣ and of y = 10ˣ → name them
    back: |
      y = ln x and y = log x. The natural and common logarithms are the inverses of the two most used exponential functions.
    topic_code: "2.10"
  - front: log_b(bˣ) versus b^(log_b x) → when each equals x
    back: |
      log_b(bˣ) = x for every real x; b^(log_b x) = x only for x > 0, because log_b x is undefined otherwise. Example: 7^(log₇ 12) = 12.
    topic_code: "2.10"
  - front: Inverse of y = (1/2)ˣ → increasing or decreasing
    back: |
      y = log_(1/2) x, which is decreasing, like the exponential it undoes. A function and its inverse always share the direction of monotonicity.
    topic_code: "2.10"
  - front: N(t) = 2ᵗ thousand cells → time as a function of size
    back: |
      t = log₂ N. The inverse answers "when is this size reached?": log₂ 32 = 5, so 32 thousand cells after 5 hours (a hypothetical model).
    topic_code: "2.10"
  - front: Error-spot → "log₂ 8 = 4 because 8 ÷ 2 = 4"
    back: |
      A logarithm is an exponent, not a quotient. 2³ = 8, so log₂ 8 = 3.
    topic_code: "2.9"
  - front: Error-spot → "the inverse of 3ˣ is 1/3ˣ"
    back: |
      1/3ˣ = 3⁻ˣ is the reciprocal, a reflection over the y-axis. The inverse function, which undoes 3ˣ, is log₃ x.
    topic_code: "2.10"
  - front: Error-spot → "log 0 = 1 since 10⁰ = 1"
    back: |
      10⁰ = 1 says log 1 = 0. log 0 is undefined: no power of 10 equals 0.
    topic_code: "2.9"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 2.9 and 2.10: logarithms as exponents, exact
    and estimated values, common and natural logs, logarithmic scales, and logarithms as inverses of exponential
    functions), with 7 of 23 reviewing earlier weeks (linear versus exponential change, exponential functions and
    their rewriting, half-life models, composition and inverse functions). Opens with a shared-context set on a
    table of 2ˣ and its inverse. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. No calculator is needed.
  questions:
    # ---- Stimulus set: a table of 2ˣ and its inverse (2.9, 2.10)
    - slug: precalc-u02-w14-q01
      type: multiple_choice
      topic_code: "2.10"
      source: "AP Precalculus CED, Topic 2.10"
      points: 1
      stimulus: |
        Selected values of the exponential function f(x) = 2ˣ are shown below. Let g be the inverse function of f.

        x: −3, −1, 0, 2, 5
        f(x): 1/8, 1/2, 1, 4, 32
      prompt: |
        What is g(32)?
      options:
        - "1/32"
        - "5"
        - "16"
        - "2³²"
      option_explanations:
        - |
          1/32 is the reciprocal of 32. The inverse function undoes f; it is not the reciprocal of an output.
        - |
          Correct. f(5) = 32, and an inverse swaps inputs and outputs, so g(32) = 5. Equivalently, log₂ 32 = 5.
        - |
          16 comes from dividing 32 by 2, treating log₂ 32 as a quotient instead of an exponent.
        - |
          2³² is f(32), the function applied again rather than undone.
      answer: 1
    - slug: precalc-u02-w14-q02
      type: multiple_choice
      topic_code: "2.10"
      source: "AP Precalculus CED, Topic 2.10"
      points: 1
      stimulus: |
        Selected values of the exponential function f(x) = 2ˣ are shown below. Let g be the inverse function of f.

        x: −3, −1, 0, 2, 5
        f(x): 1/8, 1/2, 1, 4, 32
      prompt: |
        Which describes the domain and range of g?
      options:
        - "Domain: all real numbers; range: y > 0"
        - "Domain: x ≥ 0; range: all real numbers"
        - "Domain: x > 0; range: y > 0"
        - "Domain: x > 0; range: all real numbers"
      option_explanations:
        - |
          These are the domain and range of f itself. For the inverse they swap.
        - |
          0 is not in the domain of g, because 0 is never an output of 2ˣ; log₂ 0 is undefined.
        - |
          The range of g is the domain of f, which is all real numbers; g(1/8) = −3 is a negative output.
        - |
          Correct. The domain of g is the range of f (positive numbers) and the range of g is the domain of f (all real numbers).
      answer: 3
    - slug: precalc-u02-w14-q03
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Precalculus CED, Topic 2.9"
      points: 1
      stimulus: |
        Selected values of the exponential function f(x) = 2ˣ are shown below. Let g be the inverse function of f.

        x: −3, −1, 0, 2, 5
        f(x): 1/8, 1/2, 1, 4, 32
      prompt: |
        The table shows that g(1/8) = −3, that is, log₂(1/8) = −3. Which equation says the same thing in exponential form?
      options:
        - "2⁻³ = 1/8"
        - "(1/8)⁻³ = 2"
        - "log_(1/8) 2 = −3"
        - "2^(1/8) = −3"
      option_explanations:
        - |
          Correct. log_b c = a means bᵃ = c; with b = 2, a = −3 and c = 1/8 this is 2⁻³ = 1/8.
        - |
          This swaps the base and the argument. In fact (1/8)⁻³ = 8³ = 512, not 2.
        - |
          This is still logarithmic form, with base and argument swapped; log_(1/8) 2 is actually −1/3.
        - |
          This uses the argument as the exponent. Any power of 2 is positive, so it cannot equal −3.
      answer: 0
    - slug: precalc-u02-w14-q04
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Precalculus CED, Topic 2.9"
      points: 1
      prompt: |
        What is the value of log₈ 4?
      options:
        - "1/2"
        - "2"
        - "2/3"
        - "3/2"
      option_explanations:
        - |
          8^(1/2) = √8 ≈ 2.83, not 4. The exponent must turn 2³ into 2², which takes 2/3.
        - |
          2 is 8 ÷ 4, treating the logarithm as a quotient. 8² = 64, not 4.
        - |
          Correct. 8ᵃ = 4 means 2^(3a) = 2², so 3a = 2 and a = 2/3. Check: 8^(2/3) = (∛8)² = 4.
        - |
          3/2 is log₄ 8, with the base and argument swapped: 4^(3/2) = 8.
      answer: 2
    - slug: precalc-u02-w14-q05
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Precalculus CED, Topic 2.9"
      points: 1
      prompt: |
        What is the value of log 0.001?
      options:
        - "3"
        - "−2"
        - "−1/3"
        - "−3"
      option_explanations:
        - |
          The sign is wrong: 10³ = 1,000. A number between 0 and 1 has a negative common log.
        - |
          This counts the two zeros after the decimal point instead of the place value: 0.01 = 10⁻², but 0.001 = 10⁻³.
        - |
          −1/3 confuses the exponent with a reciprocal or root; 10^(−1/3) ≈ 0.464.
        - |
          Correct. log means base 10, and 10⁻³ = 1/1,000 = 0.001, so log 0.001 = −3.
      answer: 3
    - slug: precalc-u02-w14-q06
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Precalculus CED, Topic 2.9"
      points: 1
      prompt: |
        The value of log₃ 50 lies between which two consecutive integers?
      options:
        - "16 and 17"
        - "3 and 4"
        - "5 and 6"
        - "7 and 8"
      option_explanations:
        - |
          50 ÷ 3 ≈ 16.7 treats the logarithm as a division; 3¹⁶ is over 40 million.
        - |
          Correct. 3³ = 27 < 50 < 81 = 3⁴, and larger exponents give larger powers of 3, so log₃ 50 is between 3 and 4.
        - |
          This brackets 50 between powers of 2 (2⁵ = 32 and 2⁶ = 64), the wrong base.
        - |
          √50 ≈ 7.07 answers a different question (what number squared gives 50), not which exponent on 3 gives 50.
      answer: 1
    - slug: precalc-u02-w14-q07
      type: multiple_choice
      topic_code: "2.10"
      source: "AP Precalculus CED, Topic 2.10"
      points: 1
      prompt: |
        The graph of y = log₄ x is the reflection across the line y = x of the graph of which function?
      options:
        - "y = 4ˣ"
        - "y = x⁴"
        - "y = (1/4)ˣ"
        - "y = log_(1/4) x"
      option_explanations:
        - |
          Correct. log₄ x is the inverse of 4ˣ, and the graph of an inverse is the reflection of the original across y = x.
        - |
          x⁴ is a power function with the variable in the base. It is not one-to-one, and its inverse would be a root, not a logarithm.
        - |
          (1/4)ˣ is the reflection of 4ˣ across the y-axis; its inverse is log_(1/4) x, a decreasing function.
        - |
          log_(1/4) x = −log₄ x is the reflection of y = log₄ x across the x-axis, not across y = x.
      answer: 0
    - slug: precalc-u02-w14-q08
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Precalculus CED, Topic 2.9"
      points: 1
      prompt: |
        A number line uses a base-10 logarithmic scale: the value 1 is at position 0 and the value 10 is at position 1. Value P is at position 1.5 and value Q is at position 4.5. Which statement is true?
      options:
        - "Q is 3 times P."
        - "Q is 30 times P."
        - "Q is 1,000 times P."
        - "Q is 10^4.5 times P."
      option_explanations:
        - |
          3 is the difference of the positions. On a log scale that difference is an exponent, so the ratio is 10³, not 3.
        - |
          30 multiplies the position difference by 10 instead of using it as a power of 10.
        - |
          Correct. Q/P = 10^4.5 / 10^1.5 = 10^(4.5 − 1.5) = 10³ = 1,000.
        - |
          10^4.5 is Q itself compared with the value 1 at position 0, not compared with P.
      answer: 2
    - slug: precalc-u02-w14-q09
      type: multiple_choice
      topic_code: "2.10"
      source: "AP Precalculus CED, Topic 2.10"
      points: 1
      prompt: |
        In a hypothetical model, a video has V = 10ᵈ thousand views d days after it is posted, for 0 ≤ d ≤ 4. Which function gives the number of days d needed to reach V thousand views?
      options:
        - "d = 10^V"
        - "d = log V"
        - "d = V/10"
        - "d = 10^(−V)"
      option_explanations:
        - |
          This applies the original exponential again instead of undoing it; it does not return d = 2 when V = 100.
        - |
          Correct. Solving V = 10ᵈ for d gives d = log₁₀ V = log V; for example V = 100 gives d = 2.
        - |
          Dividing by 10 treats the model as if V were 10 times d; it gives d = 10 for V = 100 instead of 2.
        - |
          10^(−V) is the reciprocal of 10^V, not an inverse function.
      answer: 1
    - slug: precalc-u02-w14-q10
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Precalculus CED, Topic 2.8"
      points: 1
      prompt: |
        Let f(x) = 2x + 6. Which expression gives f⁻¹(x)?
      options:
        - "1/(2x + 6)"
        - "x/2 − 6"
        - "2x − 6"
        - "(x − 6)/2"
      option_explanations:
        - |
          1/(2x + 6) is the reciprocal of f, not the function that undoes it.
        - |
          The steps are undone in the wrong order: f multiplies by 2 and then adds 6, so the inverse must subtract 6 first. Check: f(1) = 8 but 8/2 − 6 = −2.
        - |
          This undoes the addition but keeps the multiplication by 2. Check: f(1) = 8 but 2 · 8 − 6 = 10.
        - |
          Correct. Swap and solve: x = 2y + 6 gives y = (x − 6)/2. Check: f(1) = 8 and (8 − 6)/2 = 1.
      answer: 3
    - slug: precalc-u02-w14-q11
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Precalculus CED, Topic 2.4"
      points: 1
      prompt: |
        Which expression is equivalent to 8^(x/3) for all real x?
      options:
        - "(8ˣ)/3"
        - "(8/3)ˣ"
        - "2ˣ"
        - "2^(x/9)"
      option_explanations:
        - |
          Dividing the exponent by 3 is not the same as dividing the power by 3; at x = 3 the original is 8 but this gives 512/3.
        - |
          The exponent x/3 cannot be split by moving the 3 into the base; at x = 3 this gives 512/27, not 8.
        - |
          Correct. 8 = 2³, so 8^(x/3) = (2³)^(x/3) = 2^(3 · x/3) = 2ˣ.
        - |
          Rewriting the base as 2³ multiplies the exponent by 3; dividing it by 3 again gives the wrong exponent.
      answer: 2
    - slug: precalc-u02-w14-q12
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Precalculus CED, Topic 2.7"
      points: 1
      prompt: |
        Functions f and g have these values: f(1) = 4, f(2) = 1, f(4) = 3; g(1) = 2, g(3) = 4, g(4) = 1. What is f(g(3))?
      options:
        - "3"
        - "4"
        - "1"
        - "Undefined, because f(3) is not given"
      option_explanations:
        - |
          Correct. Work inside out: g(3) = 4, then f(4) = 3.
        - |
          4 is g(3), the inner step only; f still has to be applied to it.
        - |
          1 is g(g(3)) = g(4), applying g twice instead of g then f.
        - |
          This reads the composition in the wrong order, as g(f(3)). In f(g(3)) the inner function is g, and g(3) is given.
      answer: 0
    - slug: precalc-u02-w14-q13
      type: multi_select
      topic_code: "2.9"
      source: "AP Precalculus CED, Topic 2.9"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are equal to 2? Select all that apply.
      options:
        - "log₃ 9"
        - "log₁₆ 4"
        - "ln e²"
        - "log 20"
        - "log_(1/2)(1/4)"
        - "log₂ 2"
      option_explanations:
        - |
          Correct. 3² = 9, so the exponent on 3 that gives 9 is 2: log₃ 9 = 2.
        - |
          16^(1/2) = 4, so log₁₆ 4 = 1/2. The value 2 would be log₄ 16.
        - |
          Correct. ln e² asks for the exponent on e that gives e², which is 2.
        - |
          log 20 is between 1 and 2 (about 1.30), since 10 < 20 < 100. Doubling the argument from 10 does not double the log.
        - |
          Correct. (1/2)² = 1/4, so log_(1/2)(1/4) = 2.
        - |
          log₂ 2 = 1, because 2¹ = 2; any logarithm of its own base is 1.
      answer: [0, 2, 4]
    - slug: precalc-u02-w14-q14
      type: multi_select
      topic_code: "2.3"
      source: "AP Precalculus CED, Topic 2.3"
      points: 2
      partial_credit: true
      prompt: |
        Let f(x) = 5 · (0.4)ˣ. Which statements are true? Select all that apply.
      options:
        - "f is decreasing on its entire domain."
        - "The graph of f has the horizontal asymptote y = 0."
        - "f(0) = 2"
        - "The graph of f is concave down."
        - "The limit of f(x) as x → −∞ is ∞."
      option_explanations:
        - |
          Correct. The base 0.4 is between 0 and 1 and the coefficient 5 is positive, so f is a decreasing exponential.
        - |
          Correct. As x → ∞, (0.4)ˣ → 0, so f(x) → 0 and the graph approaches y = 0.
        - |
          f(0) = 5 · (0.4)⁰ = 5 · 1 = 5. The value 2 comes from multiplying 5 by 0.4, which is f(1).
        - |
          A positive multiple of bˣ is always concave up: the decreases get smaller (5, 2, 0.8, …), so the graph flattens upward.
        - |
          Correct. For negative x, (0.4)ˣ = 2.5^(−x) grows without bound, so f(x) → ∞ as x → −∞.
      answer: [0, 1, 4]
    - slug: precalc-u02-w14-q15
      type: true_false
      topic_code: "2.9"
      source: "AP Precalculus CED, Topic 2.9"
      points: 1
      prompt: |
        True or false: log₂(−8) = −3.
      answer: false
      explanation: |
        False. log₂(−8) would need 2ᵃ = −8, but every power of 2 is positive, so log₂(−8) is undefined. The true statement nearby is log₂(1/8) = −3: a logarithm can be negative, but its argument cannot.
    - slug: precalc-u02-w14-q16
      type: true_false
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 1
      prompt: |
        True or false: The data x = 0, 1, 2, 3 with outputs y = 4, 6, 9, 13.5 can be modelled exactly by a linear function.
      answer: false
      explanation: |
        False. The differences 2, 3, 4.5 are not constant, so no linear function fits exactly. The ratios 6/4 = 9/6 = 13.5/9 = 1.5 are constant, so the data are exactly exponential: y = 4 · (1.5)ˣ.
    - slug: precalc-u02-w14-q17
      type: fill_blank
      topic_code: "2.9"
      source: "AP Precalculus CED, Topic 2.9"
      points: 1
      prompt: |
        Give the exact value as a fraction or decimal: log₉ 27 = ____
      answer: ["3/2", "1.5", "1 1/2"]
      explanation: |
        9ᵃ = 27 means 3^(2a) = 3³, so 2a = 3 and a = 3/2. Check: 9^(3/2) = (√9)³ = 27.
    - slug: precalc-u02-w14-q18
      type: fill_blank
      topic_code: "2.8"
      source: "AP Precalculus CED, Topic 2.8"
      points: 1
      prompt: |
        If f(x) = x³ + 1, then f⁻¹(28) = ____
      answer: ["3"]
      explanation: |
        f⁻¹(28) is the input that f sends to 28: x³ + 1 = 28 gives x³ = 27, so x = 3. Check: f(3) = 28.
    - slug: precalc-u02-w14-q19
      type: numeric
      topic_code: "2.9"
      source: "AP Precalculus CED, Topic 2.9"
      points: 1
      prompt: |
        Evaluate log₂(√2 / 8) exactly. Give your answer as a decimal.
      answer: { value: -2.5, tolerance: 0 }
      explanation: |
        √2 / 8 = 2^(1/2) / 2³ = 2^(1/2 − 3) = 2^(−5/2). So log₂(√2 / 8) = −5/2 = −2.5.
    - slug: precalc-u02-w14-q20
      type: numeric
