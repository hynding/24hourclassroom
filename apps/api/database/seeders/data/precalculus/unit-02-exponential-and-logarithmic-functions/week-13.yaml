    - slug: precalc-u02-w13-q24
      type: long_answer
      topic_code: "2.8"
      source: "AP Precalculus CED, Topic 2.8"
      points: 6
      prompt: |
        No calculator. Let f(x) = (4x − 1)/(x + 2) for x ≠ −2, and let g(x) = √(x − 1) for x ≥ 1.

        (A) (i) Find f⁻¹(x).
            (ii) State the domain and the range of f⁻¹, and explain how they are related to f.
        (B) (i) Find the value of f(g(5)), as an exact value.
            (ii) Find the domain of f(g(x)). Explain your reasoning.
        (C) (i) Find f(0), then use your answer to (A)(i) to find f⁻¹(f(0)).
            (ii) Show algebraically that f(f⁻¹(x)) = x for every x in the domain of f⁻¹.
      answer: |
        (A)(i) Swap and solve: x = (4y − 1)/(y + 2), so xy + 2x = 4y − 1, xy − 4y = −2x − 1, y(x − 4) = −(2x + 1), and f⁻¹(x) = (2x + 1)/(4 − x).
        (A)(ii) Domain of f⁻¹: all real x ≠ 4. Range of f⁻¹: all real y ≠ −2. The domain of f⁻¹ is the range of f (f has horizontal asymptote y = 4 and never equals 4), and the range of f⁻¹ is the domain of f (x ≠ −2).
        (B)(i) g(5) = √4 = 2, and f(2) = (8 − 1)/(2 + 2) = 7/4.
        (B)(ii) x must be in the domain of g, so x ≥ 1. Then g(x) ≥ 0, so g(x) is never −2, the only input f rejects. The domain of f(g(x)) is x ≥ 1.
        (C)(i) f(0) = −1/2. f⁻¹(−1/2) = (2(−1/2) + 1)/(4 + 1/2) = 0/(9/2) = 0, so f⁻¹(f(0)) = 0, the original input.
        (C)(ii) f(f⁻¹(x)) = [4(2x + 1)/(4 − x) − 1] / [(2x + 1)/(4 − x) + 2]. Multiply numerator and denominator by (4 − x): [8x + 4 − (4 − x)] / [2x + 1 + 2(4 − x)] = 9x/9 = x, for x ≠ 4.
      explanation: |
        Six points.
        (A) 1 point for f⁻¹(x) = (2x + 1)/(4 − x) or an equivalent form such as −(2x + 1)/(x − 4); 1 point for the domain x ≠ 4 and range y ≠ −2 with the swap explanation.
        (B) 1 point for 7/4; 1 point for the domain x ≥ 1 with the reason that g(x) is never −2.
        (C) 1 point for f(0) = −1/2 and f⁻¹(f(0)) = 0; 1 point for a complete algebraic simplification to x.
