    # ---- Short answers
    - slug: precalc-u02-w13-q22
      type: short_answer
      topic_code: "2.8"
      source: "AP Precalculus CED, Topic 2.8"
      points: 3
      prompt: |
        A hypothetical taxi company charges F(m) = 3.50 + 2.25m dollars for a trip of m miles.

        (a) Find F⁻¹(d), the inverse of F, as a function of the fare d in dollars.
        (b) Find F⁻¹(30) to the nearest hundredth and interpret it in context with units.
        (c) Verify that F(F⁻¹(d)) = d.
      answer: |
        (a) d = 3.50 + 2.25m gives m = (d − 3.50)/2.25, so F⁻¹(d) = (d − 3.50)/2.25.
        (b) F⁻¹(30) = 26.50/2.25 ≈ 11.78. A $30 fare pays for a trip of about 11.78 miles.
        (c) F(F⁻¹(d)) = 3.50 + 2.25 · (d − 3.50)/2.25 = 3.50 + d − 3.50 = d.
      explanation: |
        Three points, one per part. (a) a correct inverse in any equivalent form. (b) 11.78 with an interpretation that names dollars as the input and miles as the output. (c) a correct algebraic simplification to d.
    - slug: precalc-u02-w13-q23
      type: short_answer
      topic_code: "1.10"
      source: "AP Precalculus CED, Topic 1.10"
      points: 3
      prompt: |
        Let r(x) = (x² − x − 6)/(x² − 9).

        (a) Find the coordinates of any hole in the graph of r.
        (b) Find the equation of any vertical asymptote of r.
        (c) Find the zero(s) of r and the equation of the horizontal asymptote.
      answer: |
        (a) r(x) = (x − 3)(x + 2)/((x − 3)(x + 3)) = (x + 2)/(x + 3) for x ≠ 3. The hole is at x = 3, y = 5/6: (3, 5/6).
        (b) x = −3, where the simplified denominator is zero and the numerator is not.
        (c) Zero: x = −2. Horizontal asymptote: y = 1 (equal degrees, leading coefficients 1/1).
      explanation: |
        Three points, one per part. (a) the hole (3, 5/6) with factoring shown. (b) x = −3 only (not x = 3). (c) the zero −2 and the asymptote y = 1.
