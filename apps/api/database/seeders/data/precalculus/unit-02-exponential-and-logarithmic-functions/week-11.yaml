week: 11
unit: 2
title: "Exponential Functions and Their Manipulation"
topics: ["2.3", "2.4"]
guide: guides/week-11.md
guide_description: |
  The graph of f(x) = abˣ and of abˣ + k: domain, range, horizontal asymptote, increasing or decreasing, concavity,
  and end behaviour in limit notation; the exponent rules as tools; why a horizontal translation of an
  exponential is a vertical dilation; changing the base and the time unit of a model; and the number e. Worked
  examples: analysing −3 · 2ˣ + 6, rewriting 5 · 3^(x − 2), a hypothetical population that doubles every 5 hours,
  and converting an annual growth factor to a monthly one.
flashcards_description: |
  30 cards on the features of exponential graphs, limit notation for their ends, exponent rules, translation as
  dilation, changing bases and time units, and the number e.

flashcards:
  - front: f(x) = abˣ → restrictions on a and b
    back: |
      a ≠ 0, b > 0 and b ≠ 1. With b = 1 the function is constant; with b ≤ 0, bˣ is undefined for many inputs (such as x = 1/2).
    topic_code: "2.3"
  - front: Domain and range of f(x) = abˣ with a > 0 → state
    back: |
      Domain: all real numbers. Range: (0, ∞). Every output has the sign of a, and bˣ is never 0.
    topic_code: "2.3"
  - front: Horizontal asymptote of abˣ + k → state
    back: |
      y = k. For −3 · 2ˣ + 6 the asymptote is y = 6, and since a < 0 the graph lies below it.
    topic_code: "2.3"
  - front: Vertical intercept of abˣ → read it off
    back: |
      (0, a), because b⁰ = 1. For abˣ + k it is (0, a + k).
    topic_code: "2.3"
  - front: Increasing or decreasing from a and b → rule
    back: |
      Increasing when a > 0, b > 1 or a < 0, 0 < b < 1. Decreasing when a > 0, 0 < b < 1 or a < 0, b > 1. Never both.
    topic_code: "2.3"
  - front: Concavity of f(x) = abˣ → rule
    back: |
      Concave up everywhere if a > 0, concave down everywhere if a < 0. The base does not affect concavity.
    topic_code: "2.3"
  - front: Relative extrema and inflection points of abˣ → how many
    back: |
      None. The function is always increasing or always decreasing, and its concavity never changes.
    topic_code: "2.3"
  - front: lim as x→∞ and x→−∞ of 3 · 2ˣ → values
    back: |
      lim as x→∞ is ∞; lim as x→−∞ is 0. Growth: up on the right, flattening onto the asymptote y = 0 on the left.
    topic_code: "2.3"
  - front: lim as x→∞ and x→−∞ of 7(0.9)ˣ → values
    back: |
      lim as x→∞ is 0; lim as x→−∞ is ∞. Decay reverses the ends of growth.
    topic_code: "2.3"
  - front: Graph of (1/2)ˣ compared with 2ˣ → relationship
    back: |
      A reflection across the y-axis, because (1/2)ˣ = 2^(−x). Both pass through (0, 1).
    topic_code: "2.3"
  - front: Why 2ˣ is concave up → numerical reason
    back: |
      Over unit steps from x = −3 the increases are 1/8, 1/4, 1/2, 1, 2, 4: the rate of change keeps increasing.
    topic_code: "2.3"
  - front: Product rule bᵐ · bⁿ → statement and example
    back: |
      bᵐ · bⁿ = b^(m + n). Example: 2³ · 2ˣ = 2^(x + 3).
    topic_code: "2.4"
  - front: Power rule (bᵐ)ⁿ → statement and example
    back: |
      (bᵐ)ⁿ = b^(mn). Example: (3²)ˣ = 3^(2x) = 9ˣ.
    topic_code: "2.4"
  - front: Negative exponent b^(−n) → meaning
    back: |
      b^(−n) = 1/bⁿ. So 2^(−x) = (1/2)ˣ and 5^(−2) = 1/25.
    topic_code: "2.4"
  - front: Rational exponent 16^(3/4) → evaluate
    back: |
      Take the 4th root, then cube: (⁴√16)³ = 2³ = 8.
    topic_code: "2.4"
  - front: 2^(x + 3) as a vertical dilation → rewrite
    back: |
      2^(x + 3) = 2³ · 2ˣ = 8 · 2ˣ. Shifting 2ˣ left 3 units is the same as stretching it vertically by 8.
    topic_code: "2.4"
  - front: 2^(x − 4) → rewrite as abˣ
    back: |
      2^(x − 4) = 2^(−4) · 2ˣ = (1/16) · 2ˣ. A shift right by 4 is a vertical compression by 1/16.
    topic_code: "2.4"
  - front: 5 · 3^(x − 2) → rewrite as abˣ
    back: |
      5 · 3^(−2) · 3ˣ = (5/9) · 3ˣ. The base stays 3; only the initial value changes.
    topic_code: "2.4"
  - front: 4ˣ with base 2 → rewrite
    back: |
      4ˣ = (2²)ˣ = 2^(2x). Changing the base is a horizontal dilation: 4ˣ is 2ˣ compressed horizontally by 1/2.
    topic_code: "2.4"
  - front: 9^(x/2) · 3^(x + 1) → simplify
    back: |
      9^(x/2) = 3ˣ, so the product is 3^(2x + 1) = 3 · 9ˣ.
    topic_code: "2.4"
  - front: P(t) = 400 · 2^(t/5) → meaning of the 5
    back: |
      The exponent rises by 1 each time t rises by 5, so the quantity doubles every 5 time units.
    topic_code: "2.4"
  - front: Hourly factor of 400 · 2^(t/5) (t in hours) → compute
    back: |
      2^(t/5) = (2^(1/5))ᵗ ≈ 1.1487ᵗ, so the population grows by about 14.9% per hour.
    topic_code: "2.4"
  - front: Monthly factor for an annual factor of 1.06 → compute
    back: |
      m¹² = 1.06, so m = 1.06^(1/12) ≈ 1.00487: about 0.487% per month, not 0.5%. B(t) = 1000(1.06)ᵗ ≈ 1000(1.00487)^(12t).
    topic_code: "2.4"
  - front: Annual factor for 1% growth per month → compute
    back: |
      1.01¹² ≈ 1.1268, so about 12.7% per year. Compounding makes it more than 12%.
    topic_code: "2.4"
  - front: The number e → definition and value
    back: |
      The limit of (1 + 1/n)ⁿ as n → ∞, about 2.71828. (n = 10 gives 2.5937; n = 1000 gives 2.7169.)
    topic_code: "2.4"
  - front: e^(0.3t) → rewrite with a decimal base
    back: |
      e^(0.3t) = (e^0.3)ᵗ ≈ 1.3499ᵗ: growth of about 35% per unit of t.
    topic_code: "2.4"
  - front: e^(−0.5x) → growth or decay
    back: |
      Decay: e^(−0.5x) = (e^(−0.5))ˣ ≈ 0.6065ˣ, a base between 0 and 1.
    topic_code: "2.4"
  - front: Error-spot → "2^(x + 3) = 2ˣ + 8"
    back: |
      Adding exponents corresponds to multiplying powers: 2^(x + 3) = 2ˣ · 2³ = 8 · 2ˣ. Check at x = 1: 2⁴ = 16, but 2 + 8 = 10.
    topic_code: "2.4"
  - front: Error-spot → "6% per year means multiply by 0.06"
    back: |
      0.06 is the growth rate; the growth factor is 1 + 0.06 = 1.06. Multiplying by 0.06 would shrink the quantity by 94%.
    topic_code: "2.4"
  - front: Error-spot → "the graph of 5 · 2ˣ − 3 has asymptote y = 0"
    back: |
      Subtracting 3 shifts the whole graph, asymptote included, down 3 units. The asymptote is y = −3 and the range is (−3, ∞).
    topic_code: "2.3"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 2.3 and 2.4: graphs, asymptotes, concavity and
    end behaviour of exponential functions; exponent rules, translation as dilation, changing bases and time
    units, and e), with 7 questions reviewing week 10 and Unit 1 (sequences, linear vs exponential change,
    polynomial end behaviour, holes, the remainder theorem and transformations). Opens with a shared-context set
    on one exponential function. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. A calculator helps only on items marked "(Calculator.)" and on the long
    answer.
  questions:
    # ---- Stimulus set: f(x) = −3 · 2ˣ + 6 (2.3)
    - slug: precalc-u02-w11-q01
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Precalculus CED, Topic 2.3"
      points: 1
      stimulus: |
        Let f(x) = −3 · 2ˣ + 6.
      prompt: |
        What are the range of f and the equation of its horizontal asymptote?
      options:
        - "Range (6, ∞); asymptote y = 6"
        - "Range (−∞, 6); asymptote y = 6"
        - "Range (−∞, 0); asymptote y = 0"
        - "Range all real numbers; asymptote y = −3"
      option_explanations:
        - |
          The coefficient −3 is negative, so −3 · 2ˣ is always negative and f(x) is always less than 6, not greater.
        - |
          Correct. 2ˣ > 0, so −3 · 2ˣ < 0 and f(x) = −3 · 2ˣ + 6 < 6. As x → −∞, f(x) → 6, so y = 6 is the asymptote.
        - |
          This describes −3 · 2ˣ without the + 6. Adding 6 shifts the graph and its asymptote up 6 units.
        - |
          An exponential function never takes every real value, and −3 is the coefficient a, which does not set the asymptote.
      answer: 1
    - slug: precalc-u02-w11-q02
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Precalculus CED, Topic 2.3"
      points: 1
      stimulus: |
        Let f(x) = −3 · 2ˣ + 6.
      prompt: |
        Which describes f on its whole domain?
      options:
        - "Increasing and concave up"
        - "Increasing and concave down"
        - "Decreasing and concave up"
        - "Decreasing and concave down"
      option_explanations:
        - |
          This describes 3 · 2ˣ. The negative coefficient reflects the graph across a horizontal line, reversing both the direction and the bend.
        - |
          With b = 2 > 1, 2ˣ increases, so −3 · 2ˣ decreases. A negative a with b > 1 gives a decreasing function.
        - |
          The direction is right, but a negative coefficient makes the graph concave down: the decreases get larger and larger (−3, −6, −12, … over unit steps from x = 0).
        - |
          Correct. a = −3 < 0 and b = 2 > 1, so f is decreasing; a < 0 makes it concave down. Over unit steps from x = 0 the changes −3, −6, −12 are decreasing.
      answer: 3
    - slug: precalc-u02-w11-q03
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Precalculus CED, Topic 2.3"
      points: 1
      stimulus: |
        Let f(x) = −3 · 2ˣ + 6.
      prompt: |
        Which statement about the end behaviour of f is correct?
      options:
        - "lim as x→−∞ of f(x) = 6 and lim as x→∞ of f(x) = −∞"
        - "lim as x→−∞ of f(x) = 0 and lim as x→∞ of f(x) = −∞"
        - "lim as x→−∞ of f(x) = −∞ and lim as x→∞ of f(x) = 6"
        - "lim as x→−∞ of f(x) = 6 and lim as x→∞ of f(x) = ∞"
      option_explanations:
        - |
          Correct. As x → −∞, 2ˣ → 0, so f(x) → 0 + 6 = 6. As x → ∞, 2ˣ → ∞ and −3 · 2ˣ → −∞, so f(x) → −∞.
        - |
          2ˣ approaches 0 on the left, but f adds 6, so f approaches 6 rather than 0.
        - |
          This reverses the ends. With base 2 > 1, the term 2ˣ vanishes as x → −∞ and blows up as x → ∞.
        - |
          The right-hand limit has the wrong sign: −3 · 2ˣ becomes a large negative number, so f(x) → −∞.
      answer: 0
    - slug: precalc-u02-w11-q04
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Precalculus CED, Topic 2.4"
      points: 1
      prompt: |
        Which expression is equivalent to 2^(x + 3) for all real x?
      options:
        - "2ˣ + 8"
        - "6 · 2ˣ"
        - "8 · 2ˣ"
        - "2^(3x)"
      option_explanations:
        - |
          Exponent addition corresponds to multiplication of powers, not addition: at x = 1, 2⁴ = 16 but 2 + 8 = 10.
        - |
          This multiplies the base by the exponent (2 · 3 = 6) instead of evaluating 2³ = 8.
        - |
          Correct. 2^(x + 3) = 2ˣ · 2³ = 8 · 2ˣ, so a left shift of 3 is a vertical stretch by 8.
        - |
          2^(3x) = (2ˣ)³ = 8ˣ, which multiplies the exponent instead of adding to it.
      answer: 2
    - slug: precalc-u02-w11-q05
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Precalculus CED, Topic 2.4"
      points: 1
      prompt: |
        Which expression is equivalent to 8^(2x/3)?
      options:
        - "4ˣ"
        - "2ˣ"
        - "16ˣ"
        - "(16/3)ˣ"
      option_explanations:
        - |
          Correct. 8^(2x/3) = (2³)^(2x/3) = 2^(2x) = (2²)ˣ = 4ˣ.
        - |
          (2³)^(2x/3) = 2^(2x), not 2ˣ; the factor 2 in the exponent was dropped.
        - |
          This multiplies 8 by 2 instead of taking the cube root first: 8^(2/3) = 4, not 16.
        - |
          This computes 8 · 2/3 instead of 8^(2/3). A rational exponent means a root and a power, not a product.
      answer: 0
    - slug: precalc-u02-w11-q06
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Precalculus CED, Topic 2.4"
      points: 1
      prompt: |
        A hypothetical bacteria population is modelled by P(t) = 400 · 2^(t/5), where t is in hours. By what factor does the population grow each hour?
      options:
        - "2/5"
        - "2^(1/5)"
        - "1.2"
        - "2⁵"
      option_explanations:
        - |
          2/5 = 0.4 is less than 1, which would mean decay. The exponent t/5 means a fifth root of 2 per hour, not 2 divided by 5.
        - |
          Correct. 2^(t/5) = (2^(1/5))ᵗ, so each hour multiplies the population by 2^(1/5) ≈ 1.149.
        - |
          This spreads the 100% doubling evenly as 20% per hour, ignoring compounding. Five hours at 1.2 would give 1.2⁵ ≈ 2.49, not 2.
        - |
          2⁵ = 32 is the factor over 25 hours if the population doubled every 5 hours; it reverses the role of the 5.
      answer: 1
    - slug: precalc-u02-w11-q07
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Precalculus CED, Topic 2.4"
      points: 1
      prompt: |
        A hypothetical account balance is A(t) = 2000(1.04)ᵗ, where t is in years. Which expression gives the same balance and shows the monthly growth factor?
      options:
        - "2000(1.04/12)^(12t)"
        - "2000(1.04)^(12t)"
        - "2000(1.0033)ᵗ"
        - "2000(1.04^(1/12))^(12t)"
      option_explanations:
        - |
          1.04/12 ≈ 0.087 is less than 1, so this would shrink the balance. The monthly factor is a 12th root, not a 12th part.
        - |
          This applies the annual factor 1.04 every month, which is 12 times too many years of growth.
        - |
          1.04^(1/12) ≈ 1.0033 is the monthly factor, but here it is applied only once per year (exponent t), so the balance grows far too slowly.
        - |
          Correct. (1.04^(1/12))^(12t) = 1.04ᵗ by the power rule, and 1.04^(1/12) ≈ 1.0033 is the factor applied each of the 12t months.
      answer: 3
    - slug: precalc-u02-w11-q08
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Precalculus CED, Topic 2.3"
      points: 1
      prompt: |
        Which function is decreasing and concave up on its whole domain?
      options:
        - "f(x) = −5(0.6)ˣ"
        - "f(x) = 5(1.6)ˣ"
        - "f(x) = 5(0.6)ˣ"
        - "f(x) = −5(1.6)ˣ"
      option_explanations:
        - |
          A negative coefficient with 0 < b < 1 gives an increasing, concave down function: the outputs rise toward 0 from below.
        - |
          With a > 0 and b > 1 the function is increasing (exponential growth), though it is concave up.
        - |
          Correct. a = 5 > 0 makes it concave up, and 0 < b = 0.6 < 1 with a > 0 makes it decreasing: exponential decay.
        - |
          A negative coefficient with b > 1 is decreasing but concave down.
      answer: 2
    - slug: precalc-u02-w11-q09
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Precalculus CED, Topic 2.4"
      points: 1
      prompt: |
        (Calculator.) The function g(t) = e^(0.2t) can be written as g(t) = bᵗ. To four decimal places, what is b?
      options:
        - "1.2214"
        - "1.2000"
        - "0.5437"
        - "7.3891"
      option_explanations:
        - |
          Correct. e^(0.2t) = (e^0.2)ᵗ, and e^0.2 ≈ 1.2214, so g grows by about 22.1% per unit of t.
        - |
          This treats 0.2 as the growth rate with base e replaced by 1 + 0.2. Continuous growth at rate 0.2 gives a factor of e^0.2, which is slightly more than 1.2.
        - |
          0.5437 is 0.2 · e, a product instead of a power.
        - |
          7.3891 is e², which uses 2 instead of 0.2 as the exponent.
      answer: 0
    # ---- Spiral review
    - slug: precalc-u02-w11-q10
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Precalculus CED, Topic 2.1"
      points: 1
      prompt: |
        A geometric sequence has g₃ = 54 and common ratio 3. What is g₀?
      options:
        - "18"
        - "45"
        - "2"
        - "6"
      option_explanations:
        - |
          18 is g₂, one step back. From g₃ to g₀ is three steps, so divide by 3 three times.
        - |
          This subtracts 3 three times (54 − 9), treating the ratio as a common difference.
        - |
          Correct. g₀ = g₃ / r³ = 54/27 = 2. Check: 2, 6, 18, 54.
        - |
          6 is g₁; this steps back only two times.
      answer: 2
    - slug: precalc-u02-w11-q11
      type: multiple_choice
      topic_code: "1.6"
      source: "AP Precalculus CED, Topic 1.6"
      points: 1
      prompt: |
        Which describes the end behaviour of p(x) = −2x⁵ + 40x² + 1?
      options:
        - "lim as x→−∞ of p(x) = −∞ and lim as x→∞ of p(x) = ∞"
        - "lim as x→±∞ of p(x) = ∞"
        - "lim as x→±∞ of p(x) = −∞"
        - "lim as x→−∞ of p(x) = ∞ and lim as x→∞ of p(x) = −∞"
      option_explanations:
        - |
          This is the end behaviour of a positive leading coefficient with odd degree; here the leading coefficient is −2.
        - |
          Both ends up needs an even degree with a positive leading coefficient. The 40x² term does not control the ends.
        - |
          Both ends down needs an even degree. The degree is 5, so the ends go in opposite directions.
        - |
          Correct. The leading term −2x⁵ has odd degree and a negative coefficient: large negative x gives large positive outputs, and large positive x gives large negative outputs.
      answer: 3
    - slug: precalc-u02-w11-q12
      type: multiple_choice
      topic_code: "1.10"
      source: "AP Precalculus CED, Topic 1.10"
      points: 1
      prompt: |
        The graph of r(x) = (x² − 4)/(x + 2) has a hole. What are its coordinates?
      options:
        - "(2, 0)"
        - "(−2, −4)"
        - "(−2, 0)"
        - "(−2, 4)"
      option_explanations:
        - |
          x = 2 is a zero of r (r(2) = 0), not a hole; the cancelled factor is (x + 2), at x = −2.
        - |
          Correct. r(x) = (x − 2)(x + 2)/(x + 2) = x − 2 for x ≠ −2, so the hole is at x = −2 with y = −2 − 2 = −4.
        - |
          The x-coordinate is right, but the y-coordinate comes from the simplified function x − 2 at x = −2, which is −4, not 0.
        - |
          This evaluates x + 2 or 2 − x at x = −2 instead of the simplified function x − 2.
      answer: 1
    # ---- Select-all, true/false, fill-in, numeric
    - slug: precalc-u02-w11-q13
      type: multi_select
      topic_code: "2.3"
      source: "AP Precalculus CED, Topic 2.3"
      points: 2
      partial_credit: true
      prompt: |
        Let g(x) = 4(1/2)ˣ. Which statements are true? Select all that apply.
      options:
        - "The graph of g has vertical intercept (0, 1)."
        - "g is decreasing on its whole domain."
        - "g is concave up on its whole domain."
        - "The graph of g has exactly one x-intercept."
        - "lim as x→∞ of g(x) = 0"
      option_explanations:
        - |
          g(0) = 4 · 1 = 4, so the vertical intercept is (0, 4). (0, 1) is the intercept of (1/2)ˣ alone.
        - |
          Correct. a = 4 > 0 and 0 < b = 1/2 < 1, so g is exponential decay and decreases everywhere.
        - |
          Correct. A positive coefficient makes an exponential function concave up; the decreases 2, 1, 1/2, … shrink in size.
        - |
          4(1/2)ˣ is always positive, so the graph never meets the x-axis; it only approaches the asymptote y = 0.
        - |
          Correct. As x grows, (1/2)ˣ shrinks toward 0, so g(x) → 0.
      answer: [1, 2, 4]
    - slug: precalc-u02-w11-q14
      type: multi_select
      topic_code: "2.4"
      source: "AP Precalculus CED, Topic 2.4"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are equivalent to 3^(2x + 1) for all real x? Select all that apply.
      options:
        - "3 · 9ˣ"
        - "27ˣ"
        - "9ˣ + 3"
        - "3 · 3^(2x)"
        - "9^(x + 1/2)"
      option_explanations:
        - |
          Correct. 3^(2x + 1) = 3¹ · 3^(2x) = 3 · (3²)ˣ = 3 · 9ˣ.
        - |
          27ˣ = 3^(3x), which has exponent 3x instead of 2x + 1. At x = 0 it gives 1, not 3.
        - |
          Adding 1 to the exponent multiplies by 3; it does not add 3. At x = 0, 9⁰ + 3 = 4, not 3.
        - |
          Correct. This is the product rule: 3^(2x + 1) = 3^(2x) · 3¹.
        - |
          Correct. 9^(x + 1/2) = (3²)^(x + 1/2) = 3^(2x + 1).
      answer: [0, 3, 4]
    - slug: precalc-u02-w11-q15
      type: true_false
      topic_code: "2.3"
      source: "AP Precalculus CED, Topic 2.3"
      points: 1
      prompt: |
        True or false: Some exponential function of the form f(x) = abˣ has a relative maximum.
      answer: false
      explanation: |
        False. For any allowed a and b, f is either increasing on its whole domain or decreasing on its whole domain, so it never changes direction and has no relative maximum or minimum.
    - slug: precalc-u02-w11-q16
      type: true_false
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 1
      prompt: |
        True or false: The values of f(x) = 5 · 3ˣ at x = 0, 2, 4, 6 form a geometric sequence with common ratio 9.
      answer: true
      explanation: |
        True. Each input step of 2 multiplies the output by 3² = 9: the values are 5, 45, 405, 3645. Equally spaced inputs to an exponential function give a geometric sequence of outputs.
    - slug: precalc-u02-w11-q17
      type: fill_blank
      topic_code: "2.4"
      source: "AP Precalculus CED, Topic 2.4"
      points: 1
      prompt: |
        For all x, 2^(x − 4) = k · 2ˣ, where k = ____.
      answer: ["1/16", "0.0625", ".0625", "2^-4", "2^(-4)"]
      explanation: |
        2^(x − 4) = 2ˣ · 2^(−4) = (1/16) · 2ˣ, so k = 1/16. A shift 4 units right is a vertical compression by the factor 1/16.
    - slug: precalc-u02-w11-q18
      type: fill_blank
      topic_code: "1.11"
