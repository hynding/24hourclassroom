    # ---- Short answers
    - slug: precalc-u02-w11-q21
      type: short_answer
      topic_code: "2.4"
      source: "AP Precalculus CED, Topic 2.4"
      points: 3
      prompt: |
        The mass, in milligrams, of a hypothetical radioactive sample t days after it is measured is M(t) = 1200(1/2)^(t/8).

        (a) Show that M(t + 8) = (1/2) · M(t), and explain what this says about the sample.
        (b) Rewrite M in the form M(t) = a · bᵗ, giving b to three decimal places. (A calculator is allowed.)
        (c) Using part (b), by what percent does the mass decrease each day?
      answer: |
        (a) M(t + 8) = 1200(1/2)^((t + 8)/8) = 1200(1/2)^(t/8) · (1/2)¹ = (1/2) · M(t). Every 8 days the mass is halved: the half-life is 8 days.
        (b) (1/2)^(t/8) = ((1/2)^(1/8))ᵗ, and (1/2)^(1/8) ≈ 0.917, so M(t) ≈ 1200(0.917)ᵗ.
        (c) The daily factor 0.917 means each day keeps about 91.7% of the mass, a decrease of about 8.3% per day.
      explanation: |
        Three points, one per part. (a) correct exponent manipulation and the half-life interpretation. (b) b = (1/2)^(1/8) ≈ 0.917 with a = 1200. (c) about 8.3% per day (accept 8.2%–8.3%), stated as a decrease.
    - slug: precalc-u02-w11-q22
      type: short_answer
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 3
      prompt: |
        Let g(x) = 2^(x − 1) + 3.

        (a) Describe the transformations that take the graph of y = 2ˣ to the graph of g.
        (b) State the horizontal asymptote and the range of g.
        (c) Show that g can also be described using a vertical dilation of y = 2ˣ instead of a horizontal translation, and name the dilation factor.
      answer: |
        (a) A translation 1 unit right and 3 units up.
        (b) Asymptote y = 3; range (3, ∞).
        (c) 2^(x − 1) = 2^(−1) · 2ˣ = (1/2) · 2ˣ, so g(x) = (1/2) · 2ˣ + 3: a vertical compression by the factor 1/2 followed by a shift 3 units up.
      explanation: |
        Three points, one per part. (a) both translations with correct directions. (b) asymptote and range. (c) the exponent rewrite and the factor 1/2.
    # ---- Long answer (AP free-response style)
    - slug: precalc-u02-w11-q23
      type: long_answer
      topic_code: "2.4"
      source: "AP Precalculus CED, Topic 2.4"
      points: 6
      prompt: |
        A calculator is allowed on this question. The number of registered users of a hypothetical study app is modelled by U(t) = 3000(1.25)ᵗ, where t is the number of years since launch.

        (A) (i) Interpret the meaning of 3000 and of 1.25 in context.
            (ii) Rewrite U in the form U(t) = 3000 · q^(4t), where q is a quarterly (3-month) growth factor. Give q to four decimal places and interpret it.
        (B) (i) Find the average rate of change of U over [0, 2] and over [2, 4]. Include units.
            (ii) Explain what your answers to (B)(i) show about the concavity of the graph of U.
        (C) (i) Write lim as t→−∞ of U(t) and explain what the horizontal asymptote of the model means for the formula, even though the app did not exist before launch.
            (ii) Show that U(t + 2) = k · U(t) for a constant k, find k, and explain how this shows that a horizontal translation of U is a vertical dilation.
      answer: |
        (A)(i) 3000 is the number of users at launch (t = 0). 1.25 is the yearly growth factor: the number of users is multiplied by 1.25, a 25% increase, each year.
        (A)(ii) q⁴ = 1.25, so q = 1.25^(1/4) ≈ 1.0574 and U(t) ≈ 3000(1.0574)^(4t). Each quarter the number of users grows by about 5.74%.
        (B)(i) U(0) = 3000, U(2) = 4687.5, U(4) = 7324.21875. Over [0, 2]: (4687.5 − 3000)/2 = 843.75 users per year. Over [2, 4]: (7324.22 − 4687.5)/2 ≈ 1318.36 users per year.
        (B)(ii) The average rate of change over equal-length consecutive intervals increases (843.75 < 1318.36), so the rate of change is increasing and the graph is concave up, as for any abˣ with a > 0.
        (C)(i) lim as t→−∞ of U(t) = 0. Mathematically the formula approaches 0 users for large negative t, so y = 0 is the horizontal asymptote; in context the model is only meaningful for t ≥ 0, so this describes the formula, not real users before launch.
        (C)(ii) U(t + 2) = 3000(1.25)^(t + 2) = 1.25² · 3000(1.25)ᵗ = 1.5625 · U(t), so k = 1.5625. Shifting the graph of U left 2 units gives the same graph as multiplying every output by 1.5625.
      explanation: |
        Six points.
        (A) 1 point for interpreting both 3000 (initial users) and 1.25 (yearly factor, 25% growth); 1 point for q ≈ 1.0574 with interpretation (about 5.74% per quarter).
        (B) 1 point for both average rates of change with units; 1 point for linking increasing rates over equal intervals to concave up.
        (C) 1 point for the limit 0 with a sensible note about the model's domain; 1 point for k = 1.5625 with the exponent work and the translation–dilation statement.
