week: 10
unit: 2
title: "Sequences and Linear vs Exponential Change"
topics: ["2.1", "2.2"]
guide: guides/week-10.md
guide_description: |
  Arithmetic sequences (constant difference, aₙ = a₀ + dn) and geometric sequences (constant ratio, gₙ = g₀rⁿ),
  including the anchored forms that start from any known term; how linear functions change by equal amounts and
  exponential functions by equal factors over equal-length input intervals; testing tables for each pattern; and
  building the linear and the exponential function through two points. Worked examples: finding d and r from
  non-adjacent terms, a geometric sequence with two possible ratios, a table with inputs two apart, and a
  hypothetical cell culture beside a growing seedling.
flashcards_description: |
  30 cards on arithmetic and geometric sequences, additive versus multiplicative change, reading tables, and
  building linear and exponential functions through two points.

flashcards:
  - front: Arithmetic sequence → defining property
    back: |
      Consecutive terms differ by the same number d, the common difference. 4, 11, 18, 25, … has d = 7.
    topic_code: "2.1"
  - front: Geometric sequence → defining property
    back: |
      Consecutive terms have the same ratio r (r ≠ 0), the common ratio. 3, 6, 12, 24, … has r = 2.
    topic_code: "2.1"
  - front: nth term of an arithmetic sequence from a₀ → formula
    back: |
      aₙ = a₀ + dn. After n steps you have added d exactly n times. It is slope–intercept form with d as the slope.
    topic_code: "2.1"
  - front: nth term of an arithmetic sequence from any term aₖ → formula
    back: |
      aₙ = aₖ + d(n − k), the point–slope form of the sequence. Example: a₃ = 17, d = 5 gives a₂₀ = 17 + 5 · 17 = 102.
    topic_code: "2.1"
  - front: nth term of a geometric sequence from g₀ → formula
    back: |
      gₙ = g₀ · rⁿ. After n steps you have multiplied by r exactly n times. Example: g₀ = 2, r = 3 gives g₄ = 162.
    topic_code: "2.1"
  - front: nth term of a geometric sequence from any term gₖ → formula
    back: |
      gₙ = gₖ · r^(n − k). Example: g₂ = 18, r = 3 gives g₅ = 18 · 27 = 486.
    topic_code: "2.1"
  - front: Common difference from a₃ = 17 and a₈ = 42 → compute
    back: |
      d = (42 − 17)/(8 − 3) = 25/5 = 5. Divide the change in terms by the number of steps, not the number of terms.
    topic_code: "2.1"
  - front: Common ratio from g₂ = 18 and g₅ = 486 → compute
    back: |
      486/18 = 27 = r³, so r = 3. The quotient of two terms is r raised to the number of steps between them.
    topic_code: "2.1"
  - front: Geometric sequence with g₁ = 12 and g₃ = 3 → possible ratios
    back: |
      3/12 = 1/4 = r², so r = 1/2 or r = −1/2. Both 12, 6, 3 and 12, −6, 3 work; extra information (such as positive terms) is needed to choose.
    topic_code: "2.1"
  - front: Geometric sequence with negative ratio → what the terms do
    back: |
      The signs alternate: 5, −15, 45, −135, … has r = −3. It is not the restriction of any exponential function abˣ, because b must be positive.
    topic_code: "2.1"
  - front: Geometric sequence with 0 < r < 1 and positive terms → behaviour
    back: |
      It decreases toward 0 without reaching it: 800, 200, 50, 12.5, … with r = 1/4.
    topic_code: "2.1"
  - front: Sequence starting at a₁ instead of a₀ → adjusted formulas
    back: |
      aₙ = a₁ + d(n − 1) and gₙ = g₁ · rⁿ⁻¹. Check which index a problem uses before writing a formula.
    topic_code: "2.1"
  - front: Arithmetic sequence ↔ linear function → connection
    back: |
      An arithmetic sequence is a linear function restricted to whole-number inputs; d is the slope and a₀ is the vertical intercept.
    topic_code: "2.2"
  - front: Geometric sequence ↔ exponential function → connection
    back: |
      A geometric sequence with positive ratio is an exponential function abˣ restricted to whole-number inputs; r plays the role of b and g₀ the role of a.
    topic_code: "2.2"
  - front: Linear function over equal-length input intervals → how outputs change
    back: |
      By equal amounts (additively). For f(x) = b + mx, each step of Δx adds m · Δx, so the average rate of change is the constant m.
    topic_code: "2.2"
  - front: Exponential function over equal-length input intervals → how outputs change
    back: |
      By equal factors (multiplicatively, or by equal percentages). For f(x) = abˣ, each step of Δx multiplies the output by b^Δx.
    topic_code: "2.2"
  - front: Why f(x + 1) = b · f(x) for f(x) = abˣ → algebra
    back: |
      f(x + 1) = ab^(x + 1) = abˣ · b¹ = b · f(x). Each unit step multiplies by b, whatever x is.
    topic_code: "2.2"
  - front: Differences f(x + 1) − f(x) for f(x) = abˣ → pattern
    back: |
      They equal abˣ(b − 1), which is itself multiplied by b each step. So the average rates of change over consecutive unit intervals form a geometric sequence.
    topic_code: "2.2"
  - front: Table test for linear vs exponential → procedure
    back: |
      Check the inputs are evenly spaced. Constant differences of outputs ⟹ linear; constant ratios ⟹ exponential; neither constant ⟹ neither model fits exactly.
    topic_code: "2.2"
  - front: Table x = 0, 2, 4, 6 with y = 3, 12, 48, 192 → model
    back: |
      Outputs multiply by 4 every 2 units, so b² = 4, b = 2, and y = 3 · 2ˣ.
    topic_code: "2.2"
  - front: Exponential function through (x₁, y₁) and (x₂, y₂) → method
    back: |
      y₂/y₁ = b^(x₂ − x₁), so b = (y₂/y₁)^(1/(x₂ − x₁)); then a = y₁ / b^(x₁).
    topic_code: "2.2"
  - front: Linear and exponential functions through (1, 6) and (4, 48) → both
    back: |
      Linear: slope 42/3 = 14, y = 14x − 8. Exponential: 48/6 = 8 = b³, b = 2, a = 3, y = 3 · 2ˣ. They agree only at the two given points.
    topic_code: "2.2"
  - front: Exponential through (2, 80) and (5, 10) → find it
    back: |
      10/80 = 1/8 = b³, so b = 1/2 and a = 80/(1/2)² = 320: y = 320 · (1/2)ˣ.
    topic_code: "2.2"
  - front: "\"Grows by 40 per year\" vs \"grows by 40% per year\" → which is which"
    back: |
      Adding 40 each year is linear (additive) change. Multiplying by 1.40 each year is exponential (multiplicative) change.
    topic_code: "2.2"
  - front: Exponential 2ˣ vs linear 100x → which wins and when
    back: |
      100x leads at x = 9 (900 vs 512), but 2¹⁰ = 1024 > 1000, and from then on 2ˣ stays ahead and pulls away. An increasing exponential eventually exceeds any linear function.
    topic_code: "2.2"
  - front: Exponential inputs 0, 2, 4, 6, … → what the outputs form
    back: |
      A geometric sequence with ratio b². Arithmetic inputs into an exponential function give geometric outputs.
    topic_code: "2.2"
  - front: Hypothetical culture of 200 cells tripling hourly → formula
    back: |
      C(t) = 200 · 3ᵗ after t hours: multiplicative change with factor 3 per hour.
    topic_code: "2.2"
  - front: Error-spot → "a₃ to a₈ is six steps"
    back: |
      It is five steps (8 − 3). There are six terms from a₃ to a₈ inclusive, but only five gaps between them, and d is the change per gap.
    topic_code: "2.1"
  - front: Error-spot → "differences 9, 9, 9 so the table is linear with slope 9"
    back: |
      Only if the inputs are 1 apart. With x = 0, 3, 6, 9 the slope is 9/3 = 3. Always divide the output change by the input step.
    topic_code: "2.2"
  - front: Error-spot → "r² = 1/4 so r = 1/2"
    back: |
      r = −1/2 also satisfies r² = 1/4. Keep both unless the problem rules one out, for example by saying every term is positive.
    topic_code: "2.1"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 2.1 and 2.2: arithmetic and geometric sequences,
    additive versus multiplicative change, table tests and two-point models), with 7 questions reviewing Unit 1
    (average rate of change, second differences, complex zeros, rational end behaviour and asymptotes,
    transformations). Opens with a shared-context set on a hypothetical membership table. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
    No calculator is needed except where an item says so.
  questions:
    # ---- Stimulus set: hypothetical membership table (2.2)
    - slug: precalc-u02-w10-q01
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 1
      stimulus: |
        A hypothetical gym tracks members (in hundreds) at two branches, t years after opening.

        | t (years) | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | Branch P | 120 | 150 | 180 | 210 | 240 |
        | Branch Q | 120 | 144 | 172.8 | 207.36 | 248.832 |
      prompt: |
        Which statement best describes how membership changes at the two branches?
      options:
        - "Both branches change linearly, because both columns increase every year."
        - "P changes exponentially and Q changes linearly."
        - "P changes linearly (adds 30 per year) and Q changes exponentially (multiplies by 1.2 per year)."
        - "Neither branch fits a linear or exponential pattern."
      option_explanations:
        - |
          Increasing every year is not the test. Q's yearly increases are 24, 28.8, 34.56, 41.472, which are not constant, so Q is not linear.
        - |
          This swaps the two. P has constant differences of 30 (additive change); Q has constant ratios of 1.2 (multiplicative change).
        - |
          Correct. P's differences are all 30, so P is linear. Q's ratios are all 144/120 = 1.2, so Q is exponential with factor 1.2.
        - |
          Both patterns are exact: P has constant differences and Q has constant ratios. Checking both differences and ratios reveals them.
      answer: 2
    - slug: precalc-u02-w10-q02
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 1
      stimulus: |
        A hypothetical gym tracks members (in hundreds) at two branches, t years after opening.

        | t (years) | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | Branch P | 120 | 150 | 180 | 210 | 240 |
        | Branch Q | 120 | 144 | 172.8 | 207.36 | 248.832 |
      prompt: |
        Which function gives Branch Q's membership t years after opening?
      options:
        - "Q(t) = 120 + 24t"
        - "Q(t) = 120(1.2)ᵗ"
        - "Q(t) = 120(0.2)ᵗ"
        - "Q(t) = 144(1.2)ᵗ"
      option_explanations:
        - |
          This uses only the first-year increase of 24 as if it repeated. Q's increases grow each year, so a linear model fails at t = 2 (it gives 168, not 172.8).
        - |
          Correct. The initial value is Q(0) = 120 and each year multiplies by 144/120 = 1.2, so Q(t) = 120(1.2)ᵗ.
        - |
          0.2 is the growth rate (20%), not the growth factor. Multiplying by 0.2 each year would shrink the membership.
        - |
          144 is Q(1), not Q(0). With 144 as the coefficient, Q(0) would be 144 instead of 120.
      answer: 1
    - slug: precalc-u02-w10-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 1
      stimulus: |
        A hypothetical gym tracks members (in hundreds) at two branches, t years after opening.

        | t (years) | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | Branch P | 120 | 150 | 180 | 210 | 240 |
        | Branch Q | 120 | 144 | 172.8 | 207.36 | 248.832 |
      prompt: |
        At which whole number of years t does Branch Q first have more members than Branch P?
      options:
        - "t = 1"
        - "t = 2"
        - "t = 3"
        - "t = 4"
      option_explanations:
        - |
          At t = 1, Q has 144 and P has 150, so P is still ahead. Q's first increase (24) is smaller than P's (30).
        - |
          At t = 2, Q has 172.8 and P has 180, so P is still ahead even though the gap is closing.
        - |
          At t = 3, Q has 207.36 and P has 210, so P is still narrowly ahead.
        - |
          Correct. At t = 4, Q has 248.832 and P has 240. Q multiplies by 1.2 each year while P only adds 30, so once Q passes P it stays ahead.
      answer: 3
    - slug: precalc-u02-w10-q04
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Precalculus CED, Topic 2.1"
      points: 1
      prompt: |
        An arithmetic sequence has a₂ = 11 and a₉ = 46. What is a₂₀?
      options:
        - "101"
        - "106"
        - "96"
        - "89.75"
      option_explanations:
        - |
          Correct. d = (46 − 11)/(9 − 2) = 35/7 = 5, so a₀ = 11 − 2 · 5 = 1 and a₂₀ = 1 + 5 · 20 = 101.
        - |
          This adds 5 for twenty-one steps instead of twenty, which is what you get by treating a₂ as a₁ and counting from there incorrectly.
        - |
          This counts 17 steps from a₂ instead of 18 (20 − 2 = 18): 11 + 5 · 17 = 96. Count steps as the difference of indices.
        - |
          This divides by 8 steps (the number of terms from a₂ to a₉ inclusive) instead of 7, giving d = 4.375 and a₂₀ = 11 + 18 · 4.375 = 89.75. There are 7 gaps between a₂ and a₉, so d = 5.
      answer: 0
    - slug: precalc-u02-w10-q05
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Precalculus CED, Topic 2.1"
      points: 1
      prompt: |
        A geometric sequence has g₁ = 6 and g₄ = 162. Which formula gives gₙ?
      options:
        - "gₙ = 6 · 3ⁿ"
        - "gₙ = 6 + 52n"
        - "gₙ = 2 · 3ⁿ"
        - "gₙ = 2 · 9ⁿ"
      option_explanations:
        - |
          This uses g₁ = 6 as the initial term g₀. Then g₁ would be 18, not 6.
        - |
          This treats the sequence as arithmetic. The terms multiply rather than add; 162/6 = 27 is a ratio, not a sum of equal steps.
        - |
          Correct. 162/6 = 27 = r³ over three steps, so r = 3. Then g₀ = 6/3 = 2, and gₙ = 2 · 3ⁿ (check: 2 · 3⁴ = 162).
        - |
          This takes r = 27/3 = 9, dividing the ratio by the number of steps instead of taking the cube root.
      answer: 2
    - slug: precalc-u02-w10-q06
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 1
      prompt: |
        A function f has f(0) = 7, f(2) = 28, f(4) = 112 and f(6) = 448. Which exponential function fits these values?
      options:
        - "f(x) = 7 · 4ˣ"
        - "f(x) = 7 · 2ˣ"
        - "f(x) = 7 + 10.5x"
        - "f(x) = 4 · 7ˣ"
      option_explanations:
        - |
          The outputs multiply by 4 every 2 units, not every 1 unit. 7 · 4ˣ would give f(2) = 112.
        - |
          Correct. Each 2-unit step multiplies by 4, so b² = 4 and b = 2. With f(0) = 7, f(x) = 7 · 2ˣ, and f(6) = 7 · 64 = 448.
        - |
          This is the line through the first two points only. The outputs grow by a constant factor, not a constant amount, so a line misses f(4).
        - |
          This swaps a and b. The initial value f(0) is 7, so 7 is the coefficient a.
      answer: 1
    - slug: precalc-u02-w10-q07
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 1
      prompt: |
        Which exponential function passes through (1, 10) and (3, 90)?
      options:
        - "y = 10 · 3ˣ"
        - "y = 10 · 9ˣ"
        - "y = 40x − 30"
        - "y = (10/3) · 3ˣ"
      option_explanations:
        - |
          This uses 10 as the value at x = 0. Then y(1) would be 30, not 10.
        - |
          9 is the factor over two units (90/10), so b² = 9; it is not b itself.
        - |
          This is the linear function through the two points, not an exponential one.
        - |
          Correct. 90/10 = 9 = b², so b = 3, and a = 10/3¹ = 10/3. Check: (10/3) · 27 = 90.
      answer: 3
    - slug: precalc-u02-w10-q08
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Precalculus CED, Topic 2.1"
      points: 1
      prompt: |
        Which list could be the first four terms of a geometric sequence?
      options:
        - "40, −20, 10, −5"
        - "2, 4, 6, 8"
        - "1, 4, 9, 16"
        - "3, 6, 12, 18"
      option_explanations:
        - |
          Correct. Each term is the previous one times −1/2: 40 · (−1/2) = −20, −20 · (−1/2) = 10, 10 · (−1/2) = −5.
        - |
          This is arithmetic (d = 2). The ratios 2, 1.5, 1.33 are not constant.
        - |
          These are perfect squares: differences 3, 5, 7 and ratios 4, 2.25, 1.78 are both non-constant.
        - |
          The first two ratios are 2 but 18/12 = 1.5, so the ratio is not constant; the last step adds 6 instead of doubling.
      answer: 0
    # ---- Unit 1 review
    - slug: precalc-u02-w10-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Precalculus CED, Topic 1.2"
      points: 1
      prompt: |
        What is the average rate of change of f(x) = x³ − 2x over the interval [1, 3]?
      options:
        - "22"
        - "10"
        - "11"
        - "22/3"
      option_explanations:
        - |
          22 is the change in f, f(3) − f(1) = 21 − (−1). It still has to be divided by the interval length 2.
        - |
          This uses f(1) = 1 instead of −1 (forgetting the −2x term at x = 1): (21 − 1)/2 = 10.
        - |
          Correct. f(3) = 27 − 6 = 21 and f(1) = 1 − 2 = −1, so the average rate of change is (21 − (−1))/(3 − 1) = 22/2 = 11.
        - |
          This divides the change 22 by 3, the right endpoint, instead of by the interval length 3 − 1 = 2.
      answer: 2
    - slug: precalc-u02-w10-q10
      type: multiple_choice
      topic_code: "1.7"
      source: "AP Precalculus CED, Topic 1.7"
      points: 1
      prompt: |
        Which describes the end behaviour of r(x) = (6x² − 1)/(3x² + x)?
      options:
        - "lim as x→∞ of r(x) is ∞"
        - "lim as x→±∞ of r(x) is 2, so y = 2 is a horizontal asymptote"
        - "lim as x→±∞ of r(x) is 0, so y = 0 is a horizontal asymptote"
        - "lim as x→±∞ of r(x) is 6"
      option_explanations:
        - |
          The degrees of numerator and denominator are equal (both 2), so the function levels off; it does not grow without bound.
        - |
          Correct. Equal degrees, so for large |x| the function behaves like the ratio of leading terms 6x²/3x² = 2.
        - |
          A horizontal asymptote at 0 needs the denominator's degree to exceed the numerator's; here they are equal.
        - |
          6 is the numerator's leading coefficient alone. The end behaviour is the ratio of leading coefficients, 6/3.
      answer: 1
    - slug: precalc-u02-w10-q11
      type: multiple_choice
      topic_code: "1.12"
      source: "AP Precalculus CED, Topic 1.12"
      points: 1
      prompt: |
        The graph of g(x) = f(x − 3) + 2 is obtained from the graph of f by which transformation?
      options:
        - "A shift 3 units left and 2 units up"
        - "A shift 3 units right and 2 units down"
        - "A vertical stretch by 3 and a shift 2 units up"
        - "A shift 3 units right and 2 units up"
      option_explanations:
        - |
          Replacing x by x − 3 moves the graph right, not left: the point that f reaches at x = 0, g reaches at x = 3.
        - |
          Adding 2 outside the function raises every output by 2, so the shift is up, not down.
        - |
          The 3 is subtracted inside the input, which is a horizontal translation; a vertical stretch would be 3f(x).
        - |
          Correct. f(x − 3) shifts the graph 3 units right, and adding 2 to every output shifts it 2 units up.
      answer: 3
    - slug: precalc-u02-w10-q12
      type: multiple_choice
      topic_code: "1.9"
      source: "AP Precalculus CED, Topic 1.9"
      points: 1
      prompt: |
        Where does r(x) = (x + 1)/(x² − 9) have vertical asymptotes?
      options:
        - "x = 3 and x = −3"
        - "x = −1 only"
        - "x = 9 only"
        - "x = 3, x = −3 and x = −1"
      option_explanations:
        - |
          Correct. x² − 9 = (x − 3)(x + 3) is zero at x = ±3, and the numerator x + 1 is not zero there, so both are vertical asymptotes.
        - |
          x = −1 makes the numerator zero, which gives a zero of r (an x-intercept), not an asymptote.
        - |
          The denominator is zero where x² = 9, that is x = ±3, not where x = 9.
        - |
          x = −1 is a zero of r: r(−1) = 0/(−8) = 0. Only zeros of the denominator that do not cancel give asymptotes.
      answer: 0
    # ---- Select-all, true/false, fill-in, numeric
    - slug: precalc-u02-w10-q13
      type: multi_select
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 2
      partial_credit: true
      prompt: |
        Which situations describe exponential (multiplicative) change? Select all that apply.
      options:
        - "A hypothetical town's population grows by 3% each year."
        - "A car rental costs $40 plus $0.25 per mile driven."
        - "The amount of a medication in the body falls by half every 6 hours."
        - "A candle gets 1.2 cm shorter every hour."
        - "An investment's value is multiplied by 1.05 every year."
      option_explanations:
        - |
          Correct. Growing by 3% means multiplying by 1.03 every year: equal factors over equal time intervals.
        - |
          Each mile adds the same $0.25, so the cost changes by equal amounts over equal intervals: linear, not exponential.
        - |
          Correct. Halving every 6 hours multiplies the amount by 1/2 over each 6-hour interval, a constant factor.
        - |
          The candle loses the same length (1.2 cm) each hour, which is additive change, so it is linear.
        - |
          Correct. A constant factor of 1.05 per year is exactly the exponential pattern f(t) = a(1.05)ᵗ.
      answer: [0, 2, 4]
    - slug: precalc-u02-w10-q14
      type: multi_select
      topic_code: "2.1"
      source: "AP Precalculus CED, Topic 2.1"
      points: 2
      partial_credit: true
      prompt: |
        A sequence is defined by aₙ = 40 − 6n for n = 0, 1, 2, …. Which statements are true? Select all that apply.
      options:
        - "The common difference is −6."
        - "a₅ = 10"
        - "The sequence is geometric with common ratio −6."
        - "The first negative term is a₇."
        - "a₁₀ = −30"
      option_explanations:
        - |
          Correct. Each increase of 1 in n changes 40 − 6n by −6, so the sequence is arithmetic with d = −6.
        - |
          Correct. a₅ = 40 − 6 · 5 = 40 − 30 = 10.
        - |
          The terms 40, 34, 28, … differ by a constant −6; their ratios (0.85, 0.82, …) are not constant, so the sequence is not geometric.
        - |
          Correct. a₆ = 40 − 36 = 4 is still positive and a₇ = 40 − 42 = −2 is the first negative term.
        - |
          a₁₀ = 40 − 6 · 10 = 40 − 60 = −20. The value −30 would need an initial term of 30 rather than 40.
      answer: [0, 1, 3]
    - slug: precalc-u02-w10-q15
      type: true_false
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 1
      prompt: |
        True or false: If a function's output increases by 10% over every input interval of length 1, then the function is linear.
      answer: false
      explanation: |
        False. Increasing by 10% means multiplying by 1.1 over each unit interval, which is a constant ratio. That is the signature of an exponential function, f(x) = a(1.1)ˣ. The amount added grows each step, so the rate of change is not constant.
    - slug: precalc-u02-w10-q16
      type: true_false
      topic_code: "1.5"
      source: "AP Precalculus CED, Topic 1.5"
      points: 1
      prompt: |
        True or false: Every polynomial of degree 5 with real coefficients has at least one real zero.
      answer: true
      explanation: |
        True. A degree-5 polynomial has 5 complex zeros counting multiplicity, and non-real zeros of a real polynomial come in conjugate pairs. Pairs account for an even number of zeros, so at least one of the five must be real. (End behaviour gives the same conclusion: an odd-degree polynomial goes to opposite infinities at the two ends, so it must cross the x-axis.)
    - slug: precalc-u02-w10-q17
