    # ---- Short answers
    - slug: precalc-u02-w10-q21
      type: short_answer
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 3
      prompt: |
        The points (2, 12) and (4, 48) lie on the graph of a function h.

        (a) Find the linear function L whose graph passes through both points.
        (b) Find the exponential function E(x) = abˣ whose graph passes through both points.
        (c) Find L(6) and E(6), and explain in terms of additive and multiplicative change why the exponential value is larger.
      answer: |
        (a) Slope (48 − 12)/(4 − 2) = 18, so L(x) = 12 + 18(x − 2) = 18x − 24.
        (b) 48/12 = 4 = b², so b = 2; a = 12/2² = 3, so E(x) = 3 · 2ˣ.
        (c) L(6) = 108 − 24 = 84 and E(6) = 3 · 64 = 192. From x = 4 to x = 6 the linear function adds the same 36 it added from 2 to 4, while the exponential function multiplies by the same factor 4 it used from 2 to 4, and 4 · 48 = 192 is much more than 48 + 36 = 84.
      explanation: |
        Three points, one per part. (a) correct slope and equation in any equivalent form. (b) b = 2 and a = 3 with work. (c) both values and an explanation contrasting a constant added amount with a constant multiplying factor over equal input intervals.
    - slug: precalc-u02-w10-q22
      type: short_answer
      topic_code: "1.3"
      source: "AP Precalculus CED, Topic 1.3"
      points: 3
      prompt: |
        A function g has these values.

        | x | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | g(x) | 1 | 3 | 9 | 19 | 33 |

        (a) Compute the first and second differences of g and say which kind of function the table fits.
        (b) A student notices that g(1)/g(0) = 3 and g(2)/g(1) = 3 and concludes g is exponential. Explain why the student is wrong.
        (c) Write a formula for g.
      answer: |
        (a) First differences 2, 6, 10, 14; second differences 4, 4, 4. Constant second differences over equal input steps mean g fits a quadratic function.
        (b) An exponential function needs the same ratio over every equal-length interval. g(3)/g(2) = 19/9 ≈ 2.11 and g(4)/g(3) = 33/19 ≈ 1.74 are not 3, so the ratios are not constant; two matching ratios are a coincidence of the first three values.
        (c) The second difference is 2a = 4, so a = 2; g(0) = 1 gives c = 1; g(1) = 2 + b + 1 = 3 gives b = 0. g(x) = 2x² + 1.
      explanation: |
        Three points, one per part. (a) both lists of differences and the conclusion "quadratic". (b) at least one later ratio computed and the point that every ratio must be equal. (c) g(x) = 2x² + 1 with supporting work or a check of all five values.
    # ---- Long answer (AP free-response style)
    - slug: precalc-u02-w10-q23
      type: long_answer
      topic_code: "2.2"
      source: "AP Precalculus CED, Topic 2.2"
      points: 6
      prompt: |
        A calculator is allowed on this question. A hypothetical community library begins lending e-books. In month t = 0 it records 250 loans, and in month t = 2 it records 360 loans. A librarian considers two models: a linear model L(t) and an exponential model E(t).

        (A) (i) Find L(t), the linear model through the two data points.
            (ii) Find E(t) = abᵗ, the exponential model through the two data points.
        (B) (i) Use each model to predict the number of loans in month 5. Show the computations.
            (ii) Suppose the library actually records 610 loans in month 5 (a hypothetical value). Which model's prediction is closer? Justify your answer numerically.
        (C) (i) Describe how each model changes from one month to the next, using the words "adds" and "multiplies", and state the monthly change for each model.
            (ii) Find the average rate of change of E over [0, 2] and over [2, 4]. Explain why these two values are different even though the intervals have the same length.
      answer: |
        (A)(i) Slope (360 − 250)/2 = 55 loans per month, so L(t) = 250 + 55t.
        (A)(ii) a = E(0) = 250 and 360/250 = 1.44 = b², so b = 1.2 and E(t) = 250(1.2)ᵗ.
        (B)(i) L(5) = 250 + 275 = 525 loans. E(5) = 250 · 1.2⁵ = 250 · 2.48832 ≈ 622 loans.
        (B)(ii) The exponential model is closer: |622.08 − 610| ≈ 12 loans, while |525 − 610| = 85 loans.
        (C)(i) The linear model adds 55 loans every month. The exponential model multiplies the number of loans by 1.2 every month, an increase of 20% of the current month's loans.
        (C)(ii) Over [0, 2]: (360 − 250)/2 = 55 loans per month. E(4) = 250 · 1.2⁴ = 518.4, so over [2, 4]: (518.4 − 360)/2 = 79.2 loans per month. The intervals have equal length, but an exponential function changes by equal factors, not equal amounts: the same 44% increase over each 2-month interval is applied to a larger starting value on [2, 4], so the amount of change, and hence the average rate of change, is larger.
      explanation: |
        Six points.
        (A) 1 point for L(t) = 250 + 55t; 1 point for E(t) = 250(1.2)ᵗ with b found from b² = 1.44.
        (B) 1 point for both predictions (525 and about 622); 1 point for choosing the exponential model with both differences (about 12 and 85) shown.
        (C) 1 point for "adds 55 per month" and "multiplies by 1.2 per month" (or 20% growth); 1 point for both average rates (55 and 79.2) with the explanation that equal factors applied to a larger value give a larger amount of change.
