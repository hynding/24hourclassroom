  - slug: appsych-u03-exam-q44
    type: long_answer
    topic_code: "3.4"
    source: "Original item; AP-style Article Analysis Question; CED Topics 3.1 and 3.4, Skills 2.A, 2.B, 2.D, 3.C, 4.B"
    points: 7
    stimulus: |
      A hypothetical study, invented for this course. Summary of an article in an imagined developmental journal.

      Participants: 96 five-year-olds from four public preschools in one city, all of whom failed a pretest on conservation of number (judging that a spread-out row of 7 coins has more coins than a short row of 7 coins).

      Method: Children were randomly assigned to one of three 15-minute sessions. In the peer condition, each child solved number problems with a 7-year-old who already conserved and was asked to explain his or her answers. In the adult hint condition, an adult asked guiding questions ("What would happen if we pushed the coins back together?") and gave fewer hints as the child improved. In the control condition, the child solved the same problems alone. One week later, a tester who did not know each child's condition gave six new conservation problems; a child passed by solving at least five correctly with a correct reason.

      Results: Pass rates were 44% (peer), 53% (adult hint) and 16% (control). A chi-square test showed the difference among conditions was statistically significant (p = 0.004).

      Ethics: Parents gave written permission, each child agreed to play, children could stop at any time, and records used code numbers. After the study, children in the control condition were offered an adult hint session.
    prompt: |
      Using the study summary, answer each part.

      (A) Identify the research method used in the study.
      (B) State the operational definition of conservation in the post-test.
      (C) Describe what the pass rates and the p-value show.
      (D) Identify one ethical guideline applied in the study.
      (E) Explain the extent to which the findings may or may not be generalizable, using specific details from the study.
      (F) Explain how the findings support or refute the claim that social interaction promotes cognitive development, using a psychological concept from Vygotsky's theory. (2 points)
    answer: |
      (A) An experiment: children were randomly assigned to the peer, adult hint or control condition.
      (B) Solving at least five of six new conservation problems correctly, with a correct reason, one week after the session.
      (C) Children who worked with a peer (44%) or got adult hints (53%) passed far more often than children who worked alone (16%); p = 0.004 means differences this large would be unlikely if the conditions had no effect.
      (D) Informed consent from parents (with child assent), the right to withdraw, confidentiality (code numbers), or offering the beneficial session to the control group afterward.
      (E) Limited: all 96 children were 5-year-olds from four public preschools in one city who failed a pretest, and the test came one week later, so results may not generalize to other ages, places or long-term learning. Random assignment supports conclusions about these children.
      (F) Supports the claim. In both social conditions a more skilled partner worked within each child's zone of proximal development: the adult gave scaffolding, guiding questions that faded as the child improved, and these children passed most often. Children who worked alone, without that support, rarely began to conserve.
    explanation: |
      Seven points.
      (A) 1 point: experiment (random assignment to conditions). Correlational or quasi-experimental earns 0.
      (B) 1 point: at least five of six new conservation problems correct with a correct reason, at the one-week test.
      (C) 1 point: both social conditions had higher pass rates than control AND the p-value interpreted as the difference being unlikely to be due to chance. Saying p shows the effect is large earns 0.
      (D) 1 point: any guideline in the summary (parental consent/child assent, right to withdraw, confidentiality, offering the treatment to controls), tied to the study.
      (E) 1 point: a judgment about generalizability supported by a specific study detail (one city, four public preschools, 5-year-olds only, children who failed the pretest, one-week delay).
      (F) 2 points. 1 point for stating that the findings support the claim with evidence from the results (higher pass rates in the peer and adult hint conditions than alone). 1 point for correctly explaining a Vygotskian concept (zone of proximal development or scaffolding) applied to the study. Piaget's stages alone earn no point for the concept.
  - slug: appsych-u03-exam-q45
    type: long_answer
    topic_code: "3.6"
    source: "Original item; AP-style Evidence-Based Question; CED Topics 3.5, 3.6 and 3.8, Skills 4.A and 4.B"
    points: 7
    stimulus: |
      Three hypothetical studies, invented for this course.

      Source A. A research team randomly assigned 140 volunteer families with newborns to weekly home visits that coached parents to notice and respond promptly to their baby's cues, or to standard care. At 12 months, coders blind to group used the Strange Situation. Securely attached: 68% of program children, 49% of standard-care children (statistically significant).

      Source B. A longitudinal study recorded a full day of home speech for 120 toddlers at 18 months and counted the back-and-forth conversational turns between child and adults. At 3 years, testers who had not heard the recordings measured each child's vocabulary. Turns per day correlated r = +0.48 with vocabulary at 3 years, and the correlation remained positive after accounting for family income.

      Source C. A team randomly assigned 80 two-year-olds to eight shared reading sessions over four weeks. In one condition, the adult asked open questions, praised the child's answers and expanded on them ("Yes, a red truck! Where is it going?"); in the other, the adult read the same books aloud without pausing. On a test of the books' new words, the question-and-praise group learned a mean of 9.1 words (SD = 2.8) and the read-aloud group 5.2 words (SD = 2.6), a significant difference.
    prompt: |
      Using the sources, answer each part.

      (A) Propose a specific and defensible claim based in psychological science that responds to the question: How does responsive interaction with caregivers affect young children's development?
      (B)(i) Support your claim using at least one piece of specific and relevant evidence from one of the sources.
      (B)(ii) Explain how the evidence from (B)(i) supports your claim, using a psychological theory or concept. (2 points)
      (C)(i) Support your claim using an additional piece of specific and relevant evidence from a different source than the one used in (B)(i).
      (C)(ii) Explain how the evidence from (C)(i) supports your claim, using a different psychological theory or concept than the one used in (B)(ii). (2 points)
    answer: |
      (A) Responsive, back-and-forth interaction with caregivers promotes young children's social-emotional and language development.
      (B)(i) Source A: in an experiment, 68% of children whose parents were coached to respond promptly to their cues were securely attached at 12 months, compared with 49% in standard care.
      (B)(ii) Attachment: sensitive, responsive caregiving teaches an infant that the caregiver is a reliable secure base, which is what secure attachment in the Strange Situation reflects. Because families were randomly assigned, the program's responsiveness can be judged a cause of the higher rate of secure attachment.
      (C)(i) Source C: two-year-olds whose adult asked questions, praised and expanded their answers learned a mean of 9.1 new words versus 5.2 in the read-aloud condition.
      (C)(ii) Operant conditioning: praise is positive reinforcement that increases the child's attempts to name and talk about pictures, giving more practice with new words. (An interactionist account of language, in which a readiness for language develops through social exchange, also fits, as does scaffolding.) Source B adds longitudinal support: more conversational turns at 18 months went with larger vocabularies at 3 years (r = +0.48).
    explanation: |
      Seven points.
      (A) 1 point: a defensible claim that responds to the question (for example, responsive interaction improves attachment and/or language). A claim that merely restates the question earns 0.
      (B)(i) 1 point: specific, accurate evidence from one source (a statistic or finding, with the source identified).
      (B)(ii) 2 points: 1 point for correctly defining or applying a psychological concept to the evidence (for example, attachment and a secure base, sensitive caregiving, the interactionist view of language, reinforcement, scaffolding or zone of proximal development); 1 point for explaining how the evidence, through that concept, supports the claim in (A).
      (C)(i) 1 point: specific, accurate evidence from a different source.
      (C)(ii) 2 points: the same two points as (B)(ii), with a different concept. Reusing the concept from (B)(ii) earns 0 for the concept point.
      For Source B, a response that treats the correlation as proof of causation can earn the evidence point but not the point for explaining support.
