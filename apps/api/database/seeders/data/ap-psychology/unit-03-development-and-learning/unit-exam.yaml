unit: 3
description: |
  45 questions · about 90 minutes · every topic of Unit 3 (3.1 to 3.9): developmental themes and designs,
  physical development from conception to old age, gender and sexual orientation, Piaget, Vygotsky and
  cognitive aging, language development, attachment, temperament, parenting and Erikson, classical
  conditioning, operant conditioning, and social, cognitive and neurological factors in learning. Includes
  three shared-context sets (four questions on a hypothetical memory study using two designs, three on a
  hypothetical vocabulary study, three on hypothetical conditioning data), select-all, true/false and
  fill-in-the-blank items, one short-answer question (3 points) and two free-response questions in the AP
  format (7 points each: an Article Analysis Question on one invented study and an Evidence-Based Question on
  three invented studies). Multiple choice, select-all and true/false items are graded at once;
  fill-in-the-blank items are matched automatically; the short answer and the free-response questions are
  graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: one memory question, two designs (3.1, 3.4)
  - slug: appsych-u03-exam-q01
    type: multiple_choice
    topic_code: "3.1"
    source: "Original item; CED Topic 3.1, Skill 2.A"
    points: 1
    stimulus: |
      Hypothetical studies, invented for this course. Study 1 tested 400 adults in the same year, 100 in each of four age groups, on a timed reasoning test with new puzzles (scored 0 to 60). Study 2 tested 100 adults when they were 30 and again when they were 45, 60 and 75, using the same kind of test.

      | Age | Study 1 mean score | Study 2 mean score |
      |---|---|---|
      | 30 | 44 | 44 |
      | 45 | 39 | 43 |
      | 60 | 33 | 41 |
      | 75 | 26 | 36 |

      In Study 2, 38 of the 100 original participants had dropped out by age 75.
    prompt: |
      Which designs did the two studies use?
    options:
      - "Study 1 was longitudinal; Study 2 was cross-sectional."
      - "Both were cross-sectional."
      - "Study 1 was cross-sectional; Study 2 was longitudinal."
      - "Study 1 was an experiment; Study 2 was a case study."
    option_explanations:
      - |
        This reverses the designs: Study 1 compared different people at one time, and Study 2 retested the same people.
      - |
        Study 2 measured the same 100 people repeatedly over 45 years, which is longitudinal, not cross-sectional.
      - |
        Correct. Study 1 compared age groups at one time (cross-sectional); Study 2 followed the same people (longitudinal).
      - |
        Neither study manipulated a variable or examined one person in depth; both compare ages.
    answer: 2
  - slug: appsych-u03-exam-q02
    type: multiple_choice
    topic_code: "3.1"
    source: "Original item; CED Topic 3.1, Skill 2.D"
    points: 1
    stimulus: |
      Hypothetical studies, invented for this course. Study 1 tested 400 adults in the same year, 100 in each of four age groups, on a timed reasoning test with new puzzles (scored 0 to 60). Study 2 tested 100 adults when they were 30 and again when they were 45, 60 and 75, using the same kind of test.

      | Age | Study 1 mean score | Study 2 mean score |
      |---|---|---|
      | 30 | 44 | 44 |
      | 45 | 39 | 43 |
      | 60 | 33 | 41 |
      | 75 | 26 | 36 |

      In Study 2, 38 of the 100 original participants had dropped out by age 75.
    prompt: |
      Which is the best explanation for why Study 1 shows a steeper decline than Study 2?
    options:
      - "Cohort effects: older groups in Study 1 grew up with less schooling and less test experience."
      - "Study 1 had a larger sample, which always produces larger differences."
      - "Study 2 used random assignment to age groups."
      - "Study 1 participants were tested more often and suffered from fatigue."
    option_explanations:
      - |
        Correct. In a cross-sectional design, age groups also differ by era, so part of the gap reflects generational differences rather than aging.
      - |
        Sample size affects precision, not the size of the true difference between age groups.
      - |
        Age cannot be randomly assigned, and Study 2 followed one group of people over time.
      - |
        Study 1 tested each person once; repeated testing happened only in Study 2.
    answer: 0
  - slug: appsych-u03-exam-q03
    type: multiple_choice
    topic_code: "3.1"
    source: "Original item; CED Topic 3.1, Skill 2.D"
    points: 1
    stimulus: |
      Hypothetical studies, invented for this course. Study 1 tested 400 adults in the same year, 100 in each of four age groups, on a timed reasoning test with new puzzles (scored 0 to 60). Study 2 tested 100 adults when they were 30 and again when they were 45, 60 and 75, using the same kind of test.

      | Age | Study 1 mean score | Study 2 mean score |
      |---|---|---|
      | 30 | 44 | 44 |
      | 45 | 39 | 43 |
      | 60 | 33 | 41 |
      | 75 | 26 | 36 |

      In Study 2, 38 of the 100 original participants had dropped out by age 75.
    prompt: |
      How might the 38 dropouts have biased Study 2?
    options:
      - "They make the study cross-sectional."
      - "They prove that the test was unreliable."
      - "They have no effect, because dropouts are always random."
      - "If the dropouts were less healthy, the remaining sample may overstate how well people keep their reasoning skills."
    option_explanations:
      - |
        The remaining participants are still the same people measured over time, so the design stays longitudinal.
      - |
        Dropout concerns who remains in the sample, not whether the test gives consistent scores.
      - |
        People who leave long studies often differ from those who stay, so attrition is rarely random.
      - |
        Correct. Attrition can leave a healthier, more able sample, which would make the decline look smaller than it really is.
    answer: 3
  - slug: appsych-u03-exam-q04
    type: multiple_choice
    topic_code: "3.4"
    source: "Original item; CED Topic 3.4, Skill 1.A"
    points: 1
    stimulus: |
      Hypothetical studies, invented for this course. Study 1 tested 400 adults in the same year, 100 in each of four age groups, on a timed reasoning test with new puzzles (scored 0 to 60). Study 2 tested 100 adults when they were 30 and again when they were 45, 60 and 75, using the same kind of test.

      | Age | Study 1 mean score | Study 2 mean score |
      |---|---|---|
      | 30 | 44 | 44 |
      | 45 | 39 | 43 |
      | 60 | 33 | 41 |
      | 75 | 26 | 36 |

      In Study 2, 38 of the 100 original participants had dropped out by age 75.
    prompt: |
      A timed test of reasoning with new puzzles mainly measures which kind of intelligence, and how would a vocabulary test likely have differed?
    options:
      - "Crystallized intelligence; vocabulary scores would decline faster."
      - "Fluid intelligence; vocabulary scores would likely hold steady or rise with age."
      - "Crystallized intelligence; vocabulary scores would show the same pattern."
      - "Fluid intelligence; vocabulary scores would fall to zero by age 75."
    option_explanations:
      - |
        Reasoning about new problems under time pressure is fluid intelligence; vocabulary is the crystallized kind that holds up.
      - |
        Correct. New-puzzle reasoning taps fluid intelligence, which declines gradually; vocabulary is crystallized and tends to hold steady or grow.
      - |
        New puzzles under time pressure measure fluid, not crystallized, intelligence, and vocabulary follows a different pattern.
      - |
        Vocabulary is among the most stable abilities in later life; nothing suggests it would vanish.
    answer: 1
  - slug: appsych-u03-exam-q05
    type: multiple_choice
    topic_code: "3.2"
    source: "Original item; CED Topic 3.2, Skill 1.A"
    points: 1
    prompt: |
      When a newborn's palm is pressed with a finger, the baby's fingers close tightly around it. Which reflex is this?
    options:
      - "Rooting"
      - "Grasping"
      - "Moro"
      - "Babinski"
    option_explanations:
      - |
        Rooting is turning toward a touch on the cheek and opening the mouth.
      - |
        Correct. The grasping (palmar) reflex closes the fingers around an object pressed into the palm.
      - |
        The Moro reflex is flinging the arms out in response to a sudden loss of support or loud noise.
      - |
        The Babinski reflex is the toes fanning out when the sole of the foot is stroked.
    answer: 1
  - slug: appsych-u03-exam-q06
    type: multiple_choice
    topic_code: "3.2"
    source: "Original item; CED Topic 3.2, Skill 1.A"
    points: 1
    prompt: |
      Which pairing of a prenatal stage with its main event is correct?
    options:
      - "Germinal stage: major organs form"
      - "Fetal stage: the zygote implants in the uterine wall"
      - "Embryonic stage: the fetus gains most of its birth weight"
      - "Embryonic stage: major organs and structures form"
    option_explanations:
      - |
        The germinal stage covers rapid cell division and implantation; organs form in the embryonic stage.
      - |
        Implantation happens in the germinal stage, in roughly the first two weeks.
      - |
        Most weight gain happens in the fetal stage, from about week 9 to birth.
      - |
        Correct. From about weeks 3 to 8, major organs and structures form, making this the stage most vulnerable to teratogens.
    answer: 3
  - slug: appsych-u03-exam-q07
    type: multiple_choice
    topic_code: "3.2"
    source: "Original item; CED Topic 3.2, Skill 1.A"
    points: 1
    prompt: |
      Which statement about the adolescent brain is most accurate?
    options:
      - "The prefrontal cortex continues to mature into the mid-20s, after reward-sensitive limbic areas."
      - "The brain stops changing by age 12."
      - "Adolescents have fewer synapses than infants because neurons die from lack of sleep."
      - "The limbic system is the last brain region to mature."
    option_explanations:
      - |
        Correct. Myelination and pruning in the frontal lobes continue into the mid-20s, so impulse control matures after reward sensitivity.
      - |
        The brain keeps changing throughout adolescence and adulthood through pruning, myelination and plasticity.
      - |
        Synapse numbers fall mainly because of pruning of unused connections, not neuron death from lack of sleep.
      - |
        The limbic system matures earlier; the prefrontal cortex is the last to finish developing.
    answer: 0
  - slug: appsych-u03-exam-q08
    type: multiple_choice
    topic_code: "3.3"
    source: "Original item; CED Topic 3.3, Skill 1.A"
    points: 1
    prompt: |
      Which is the best example of gender expression?
    options:
      - "A person's sex chromosomes"
      - "A person's attraction to people of another gender"
      - "The clothing and hairstyle a person chooses to present themselves"
      - "A culture's expectation that men should not cry"
    option_explanations:
      - |
        Sex chromosomes are biological characteristics, part of sex rather than gender expression.
      - |
        Attraction to others describes sexual orientation, not how a person outwardly presents gender.
      - |
        Correct. Gender expression is how a person outwardly shows gender, through clothing, hairstyle and behavior.
      - |
        A cultural expectation about how a gender should behave is a gender role.
    answer: 2
  - slug: appsych-u03-exam-q09
    type: multiple_choice
    topic_code: "3.3"
    source: "Original item; CED Topic 3.3, Skill 3.C"
    points: 1
    prompt: |
      A hypothetical meta-analysis finds that the average difference between women and men on a measure of self-esteem is d = 0.10. Which statement is the best interpretation?
    options:
      - "Nearly all men have higher self-esteem than nearly all women."
      - "The difference is very small, and the two distributions overlap almost completely."
      - "The difference is large because it was found across many studies."
      - "The difference cannot be interpreted without the median."
    option_explanations:
      - |
        A d of 0.10 means the group means differ by a tenth of a standard deviation, so the distributions overlap heavily.
      - |
        Correct. An effect size of about 0.1 is very small; most individuals in each group fall within the range of the other.
      - |
        Combining many studies makes the estimate more precise, but it does not make a small effect large.
      - |
        The effect size already expresses the difference relative to the spread, so the median is not needed.
    answer: 1
  - slug: appsych-u03-exam-q10
    type: multiple_choice
    topic_code: "3.3"
    source: "Original item; CED Topic 3.3, Skill 1.A"
    points: 1
    prompt: |
      A 4-year-old sees a picture of a man feeding a baby and later remembers it as a woman feeding a baby. Which explanation fits best?
    options:
      - "Gender schema theory"
      - "The fraternal birth order effect"
      - "Prenatal androgen exposure"
      - "Operant extinction"
    option_explanations:
      - |
        Correct. A gender schema shapes how children encode and recall information, so schema-inconsistent details are distorted to fit.
      - |
        The fraternal birth order effect concerns sexual orientation, not memory for pictures.
      - |
        Prenatal hormones act before birth; they do not explain a specific memory error about a picture.
      - |
        Extinction is the fading of an unreinforced behavior, unrelated to this memory distortion.
    answer: 0
  - slug: appsych-u03-exam-q11
    type: multiple_choice
    topic_code: "3.3"
    source: "Original item; CED Topic 3.3, Skill 4.B"
    points: 1
    prompt: |
      Which conclusion about the development of sexual orientation is best supported by research?
    options:
      - "It is determined by the parenting style a child experiences."
      - "It is controlled by a single identified gene."
      - "It is classified as a psychological disorder when it is not heterosexual."
      - "Genetic and prenatal influences both appear to contribute, with no single cause identified."
    option_explanations:
      - |
        Research has found no good evidence that parenting style determines sexual orientation.
      - |
        Large genetic studies find many variants of small effect, not one gene.
      - |
        No sexual orientation is classified as a disorder; homosexuality was removed from the American Psychiatric Association's manual in 1973.
      - |
        Correct. Twin and genetic studies, along with prenatal findings such as the fraternal birth order effect, point to multiple contributing influences.
    answer: 3
  # ---- Stimulus set B: a hypothetical vocabulary study (3.5, 3.4)
  - slug: appsych-u03-exam-q12
    type: multiple_choice
    topic_code: "3.5"
    source: "Original item; CED Topic 3.5, Skill 3.A"
    points: 1
    stimulus: |
      A hypothetical study, invented for this course. A research team recorded a full day of speech at home for 60 children at 18 months and counted the conversational turns (back-and-forth exchanges) between each child and adults. At 30 months, testers who had not heard the recordings measured each child's spoken vocabulary.

      | Conversational turns per day at 18 months | Number of children | Mean words spoken at 30 months |
      |---|---|---|
      | Fewer than 200 | 20 | 310 |
      | 200 to 400 | 20 | 420 |
      | More than 400 | 20 | 530 |

      Across all 60 children, the correlation between turns and vocabulary was r = +0.52.
    prompt: |
      Which statement best describes the relationship?
    options:
      - "A strong negative relationship: more turns, fewer words"
      - "No relationship, because the groups were equal in size"
      - "A moderate positive relationship: more conversational turns went with larger vocabularies"
      - "A perfect relationship, because every child with more turns had more words"
    option_explanations:
      - |
        The correlation is positive (+0.52) and vocabulary rises across the groups, so the relationship is not negative.
      - |
        Equal group sizes say nothing about the relationship; the means and r show a clear association.
      - |
        Correct. An r of +0.52 is a moderate positive correlation, and mean vocabulary rises from 310 to 530 words across the groups.
      - |
        A perfect relationship would be r = +1.00; with r = +0.52, many children do not follow the trend.
    answer: 2
  - slug: appsych-u03-exam-q13
    type: multiple_choice
    topic_code: "3.5"
    source: "Original item; CED Topic 3.5, Skill 2.D"
    points: 1
    stimulus: |
      A hypothetical study, invented for this course. A research team recorded a full day of speech at home for 60 children at 18 months and counted the conversational turns (back-and-forth exchanges) between each child and adults. At 30 months, testers who had not heard the recordings measured each child's spoken vocabulary.

      | Conversational turns per day at 18 months | Number of children | Mean words spoken at 30 months |
      |---|---|---|
      | Fewer than 200 | 20 | 310 |
      | 200 to 400 | 20 | 420 |
      | More than 400 | 20 | 530 |

      Across all 60 children, the correlation between turns and vocabulary was r = +0.52.
    prompt: |
      Which is a reason the study cannot show that conversation causes vocabulary growth?
    options:
      - "Children who are already more talkative may draw more conversation from adults."
      - "The testers did not hear the recordings."
      - "Vocabulary was measured a year after the conversations."
      - "The study used three groups of equal size."
    option_explanations:
      - |
        Correct. Reverse causation is possible: a child's own early language skill could produce more turns, so the direction of influence is unclear.
      - |
        Blind testers reduce bias in measuring vocabulary; this strengthens the study rather than limiting causal claims.
      - |
        Measuring vocabulary later helps establish time order; the problem is that conversation was not manipulated.
      - |
        Equal group sizes are a feature of how the results were summarized and do not prevent causal claims.
    answer: 0
  - slug: appsych-u03-exam-q14
    type: multiple_choice
    topic_code: "3.5"
    source: "Original item; CED Topic 3.5, Skill 4.B"
    points: 1
    stimulus: |
      A hypothetical study, invented for this course. A research team recorded a full day of speech at home for 60 children at 18 months and counted the conversational turns (back-and-forth exchanges) between each child and adults. At 30 months, testers who had not heard the recordings measured each child's spoken vocabulary.

      | Conversational turns per day at 18 months | Number of children | Mean words spoken at 30 months |
      |---|---|---|
      | Fewer than 200 | 20 | 310 |
      | 200 to 400 | 20 | 420 |
      | More than 400 | 20 | 530 |

      Across all 60 children, the correlation between turns and vocabulary was r = +0.52.
    prompt: |
      Which view of language acquisition do these results fit best?
    options:
      - "A purely nativist view in which experience plays no role"
      - "The view that language is fixed at birth and does not develop"
      - "Linguistic relativity, in which language determines thought"
      - "An interactionist view in which a readiness for language develops through social interaction"
    option_explanations:
      - |
        A purely nativist view would not predict that the amount of conversation relates to vocabulary.
      - |
        Vocabulary clearly develops between 18 and 30 months, so language is not fixed at birth.
      - |
        Linguistic relativity concerns language's influence on thought, not how language is acquired.
      - |
        Correct. The link between back-and-forth conversation and later vocabulary fits a view in which biological readiness unfolds through interaction.
    answer: 3
  - slug: appsych-u03-exam-q15
    type: multiple_choice
    topic_code: "3.4"
    source: "Original item; CED Topic 3.4, Skill 1.A"
    points: 1
    prompt: |
      A 3-year-old says the moon is following the car because it wants to come home with her. Which feature of preoperational thought is this?
    options:
      - "Conservation"
      - "Animism"
      - "Reversibility"
      - "Hypothetical reasoning"
    option_explanations:
      - |
        Conservation is understanding that quantity stays the same despite changes in shape; it is absent in this stage.
      - |
        Correct. Giving lifelike qualities and wishes to objects such as the moon is animism.
      - |
        Reversibility is mentally undoing an action, a concrete operational ability.
      - |
        Hypothetical reasoning is a formal operational ability that develops in adolescence.
    answer: 1
  - slug: appsych-u03-exam-q16
    type: multiple_choice
    topic_code: "3.4"
    source: "Original item; CED Topic 3.4, Skill 4.B"
    points: 1
    prompt: |
      Researchers found that infants only a few months old look longer at events in which a toy seems to pass through a solid wall. What does this finding suggest about Piaget's theory?
    options:
      - "Piaget overestimated infants' abilities."
      - "Infants are in the formal operational stage."
      - "Infants may understand something about objects earlier than Piaget proposed."
      - "Object permanence never develops."
    option_explanations:
      - |
        The finding suggests the opposite: infants know more, earlier, than Piaget's methods showed.
      - |
        Formal operations involve abstract reasoning; the finding concerns basic expectations about objects.
      - |
        Correct. Longer looking at impossible events suggests some understanding of objects before the 8 months Piaget proposed for object permanence.
      - |
        Object permanence clearly develops; the question is how early, not whether.
    answer: 2
  - slug: appsych-u03-exam-q17
    type: multiple_choice
    topic_code: "3.4"
    source: "Original item; CED Topic 3.4, Skill 1.A"
    points: 1
    prompt: |
      A 16-year-old is sure that nobody has ever felt heartbreak as deeply as she does. Which concept describes this belief?
    options:
      - "Imaginary audience"
      - "Centration"
      - "Theory of mind"
      - "Personal fable"
    option_explanations:
      - |
        The imaginary audience is the feeling of being watched and judged by others, not a belief in one's uniqueness.
      - |
        Centration is focusing on one aspect of a problem, a preoperational limitation.
      - |
        Theory of mind is understanding others' mental states; her belief actually underestimates others' feelings.
      - |
        Correct. The personal fable is an adolescent's belief that their experiences are unique.
    answer: 3
  - slug: appsych-u03-exam-q18
    type: multiple_choice
    topic_code: "3.5"
    source: "Original item; CED Topic 3.5, Skill 1.A"
    points: 1
    prompt: |
      The words "dogs" and "walked" each contain how many morphemes?
    options:
      - "Two each"
      - "One each"
      - "Three each"
      - "Four and six, one per letter"
    option_explanations:
      - |
        Correct. Dog + s (plural) and walk + ed (past tense) each combine two units of meaning.
      - |
        The endings -s and -ed carry meaning (plural, past tense), so each word has more than one morpheme.
      - |
        Each word has only a root and one meaningful ending, so three is too many.
      - |
        Letters are not units of meaning; morphemes are the smallest meaningful parts of words.
    answer: 0
  - slug: appsych-u03-exam-q19
    type: multiple_choice
    topic_code: "3.5"
    source: "Original item; CED Topic 3.5, Skill 1.A"
    points: 1
    prompt: |
      A child who moved to a new country at age 4 speaks the new language without an accent; her parents, who moved as adults, have strong accents despite years of practice. Which concept best explains this?
    options:
      - "Overregularization"
      - "Linguistic relativity"
      - "A sensitive period for language learning"
      - "Telegraphic speech"
    option_explanations:
      - |
        Overregularization is applying grammar rules to exceptions, not differences in accent by age of learning.
      - |
        Linguistic relativity concerns language shaping thought, not why children learn accents more easily.
      - |
        Correct. Language, including its sounds, is learned most easily in childhood, so early learners more often reach native-like pronunciation.
      - |
        Telegraphic speech is a toddler's two-word stage, not a difference between child and adult learners.
    answer: 2
  - slug: appsych-u03-exam-q20
    type: multiple_choice
    topic_code: "3.6"
    source: "Original item; CED Topic 3.6, Skill 1.A"
    points: 1
    prompt: |
      In the Strange Situation, a toddler clings to his mother before she leaves, screams when she goes, and at reunion both reaches for her and pushes her away angrily. Which pattern is this?
    options:
      - "Secure"
      - "Insecure-avoidant"
      - "Disorganized"
      - "Insecure-anxious (resistant)"
    option_explanations:
      - |
        A securely attached child is comforted quickly at reunion rather than angrily resisting.
      - |
        An avoidant child shows little distress and ignores the caregiver at reunion.
      - |
        Disorganized attachment involves confused behavior such as freezing; this child shows a consistent mix of clinging and anger.
      - |
        Correct. High distress at separation and a mix of contact-seeking and resistance at reunion define the anxious (resistant) pattern.
    answer: 3
  - slug: appsych-u03-exam-q21
    type: multiple_choice
    topic_code: "3.6"
    source: "Original item; CED Topic 3.6, Skill 1.A"
    points: 1
    prompt: |
      A 45-year-old feels restless and unfulfilled until she starts coaching a youth soccer team, which gives her a sense of purpose. According to Erikson, she is working through
    options:
      - "intimacy versus isolation"
      - "generativity versus stagnation"
      - "integrity versus despair"
      - "identity versus role confusion"
    option_explanations:
      - |
        Intimacy versus isolation is the young-adult crisis about close relationships.
      - |
        Correct. In middle adulthood, contributing to the next generation (generativity) counters a sense of stagnation.
      - |
        Integrity versus despair is the late-adult crisis of looking back on life.
      - |
        Identity versus role confusion is the adolescent crisis.
    answer: 1
  - slug: appsych-u03-exam-q22
    type: multiple_choice
    topic_code: "3.6"
    source: "Original item; CED Topic 3.6, Skill 2.D"
    points: 1
    prompt: |
      A study finds that children of authoritative parents tend to have higher self-esteem. Which conclusion is most appropriate?
    options:
      - "Authoritative parenting is associated with higher self-esteem, but the design may not show cause and effect."
      - "Authoritative parenting causes higher self-esteem in every culture."
      - "Children's self-esteem determines their parents' style."
      - "Parenting style has no relationship with children's outcomes."
    option_explanations:
      - |
        Correct. Parenting studies are mostly correlational, so the link is real but its cause is uncertain (reverse causation, third variables).
      - |
        Correlational data cannot establish cause, and associations differ across cultures.
      - |
        Reverse causation is one possibility, not a conclusion the data establish.
      - |
        The study found an association, so saying there is no relationship contradicts the result.
    answer: 0
  - slug: appsych-u03-exam-q23
    type: multiple_choice
    topic_code: "3.6"
    source: "Original item; CED Topic 3.6, Skill 1.A"
    points: 1
    prompt: |
      A shy, slow-to-warm-up child thrives with a teacher who gives her extra time to adjust to new activities. Which concept explains her success?
    options:
      - "Imprinting"
      - "Foreclosure"
      - "Goodness of fit"
      - "Learned helplessness"
    option_explanations:
      - |
        Imprinting is rapid attachment during a critical period in some animals.
      - |
        Foreclosure is an identity status in which a person commits without exploring.
      - |
        Correct. Goodness of fit is the match between a child's temperament and the environment's demands and responses.
      - |
        Learned helplessness is passivity after uncontrollable events; this child is thriving.
    answer: 2
  # ---- Stimulus set C: hypothetical conditioning data (3.7, 3.8)
  - slug: appsych-u03-exam-q24
    type: multiple_choice
    topic_code: "3.7"
    source: "Original item; CED Topic 3.7, Skill 3.A"
    points: 1
    stimulus: |
