week: 17
unit: 3
title: Social and Emotional Development Across the Lifespan
topics: ["3.6"]
guide: guides/week-17.md
guide_description: |
  Attachment: Harlow's cloth and wire mothers and contact comfort, Bowlby's secure base, stranger and
  separation anxiety, Ainsworth's Strange Situation and the secure, avoidant, anxious and disorganized
  patterns; temperament types and goodness of fit; Baumrind's parenting styles and why the evidence is
  correlational; Erikson's eight psychosocial stages; identity statuses, peers and emerging adulthood;
  Bronfenbrenner's ecological systems; adverse childhood experiences and resilience; love, work and
  well-being in adulthood and later life. Worked examples: a hypothetical correlation between parental warmth
  and self-esteem, and an ethical experiment on a home-visiting program.
flashcards_description: |
  30 cards on attachment research and patterns, temperament, parenting styles, Erikson's stages, identity
  statuses, emerging adulthood, ecological systems, resilience and adult development.

flashcards:
  - front: "Attachment → definition"
    back: |
      An enduring emotional bond between a child and a caregiver, shown by seeking closeness and distress at separation.
    topic_code: "3.6"
  - front: "Harlow's cloth and wire mothers → finding"
    back: |
      Infant rhesus monkeys clung to a soft cloth mother that gave no food rather than a wire mother with milk, especially when frightened.
    topic_code: "3.6"
  - front: "Contact comfort → definition"
    back: |
      The comfort an infant gets from soft physical contact; Harlow's work showed it matters more for attachment than feeding.
    topic_code: "3.6"
  - front: "Harlow's research → ethical criticism"
    back: |
      Rearing monkeys with artificial mothers or in isolation caused lasting distress; modern guidelines require that harm to animals be justified and minimized.
    topic_code: "3.6"
  - front: "Secure base → definition"
    back: |
      Bowlby's term for a caregiver from whom a securely attached child confidently explores and to whom the child returns for comfort.
    topic_code: "3.6"
  - front: "Stranger anxiety → definition and timing"
    back: |
      Fear or wariness of unfamiliar people, typically emerging around 8 months, when infants have formed schemas for familiar faces.
    topic_code: "3.6"
  - front: "Separation anxiety → definition"
    back: |
      Distress when a caregiver leaves, peaking in late infancy and fading through the toddler years.
    topic_code: "3.6"
  - front: "Strange Situation → procedure"
    back: |
      Ainsworth's lab procedure for 1-year-olds: play with the caregiver, a stranger enters, the caregiver leaves and returns; reunion behavior is coded.
    topic_code: "3.6"
  - front: "Secure attachment → Strange Situation behavior"
    back: |
      Explores with the caregiver as a base, may be upset at separation, and is quickly comforted at reunion.
    topic_code: "3.6"
  - front: "Insecure-avoidant attachment → Strange Situation behavior"
    back: |
      Little distress at separation; ignores or avoids the caregiver at reunion.
    topic_code: "3.6"
  - front: "Insecure-anxious (resistant) attachment → Strange Situation behavior"
    back: |
      Clings and explores little, is very upset at separation, and is hard to comfort at reunion, often mixing contact-seeking with anger.
    topic_code: "3.6"
  - front: "Disorganized attachment → Strange Situation behavior"
    back: |
      Confused or contradictory behavior at reunion, such as approaching and then freezing; a pattern added by later researchers.
    topic_code: "3.6"
  - front: "Sensitive caregiving → link to attachment"
    back: |
      Responsive, consistent care is associated with secure attachment; secure attachment modestly predicts later social and emotional competence.
    topic_code: "3.6"
  - front: "Temperament → definition"
    back: |
      A person's characteristic emotional reactivity, activity level and intensity, visible from infancy, partly heritable and moderately stable.
    topic_code: "3.6"
  - front: "Easy, difficult and slow-to-warm-up → temperament types"
    back: |
      Thomas and Chess's types: easy (regular, positive, adaptable), difficult (irregular, intense, negative to change), slow-to-warm-up (mildly negative, adapts gradually).
    topic_code: "3.6"
  - front: "Goodness of fit → definition"
    back: |
      The match between a child's temperament and the demands and responses of the caregiving environment.
    topic_code: "3.6"
  - front: "Authoritative parenting → definition"
    back: |
      High warmth and high demands: clear rules explained with reasons, open to discussion. Associated with positive outcomes in many studies.
    topic_code: "3.6"
  - front: "Authoritarian parenting → definition"
    back: |
      Low warmth and high demands: strict rules, obedience expected, little explanation.
    topic_code: "3.6"
  - front: "Permissive and uninvolved parenting → definitions"
    back: |
      Permissive: high warmth, few rules. Uninvolved (neglectful): little warmth and little supervision.
    topic_code: "3.6"
  - front: "Parenting style research → main limitation"
    back: |
      It is mostly correlational: children's temperaments can shape parenting, and third variables such as income can affect both; findings also vary by culture.
    topic_code: "3.6"
  - front: "Erikson stages 1–4 → crises in order"
    back: |
      Trust versus mistrust; autonomy versus shame and doubt; initiative versus guilt; competence (industry) versus inferiority.
    topic_code: "3.6"
  - front: "Erikson stages 5–8 → crises in order"
    back: |
      Identity versus role confusion; intimacy versus isolation; generativity versus stagnation; integrity versus despair.
    topic_code: "3.6"
  - front: "Identity achievement versus foreclosure → difference"
    back: |
      Achievement: exploring options and then committing. Foreclosure: committing (often to parents' values) without exploring.
    topic_code: "3.6"
  - front: "Moratorium and diffusion → identity statuses"
    back: |
      Moratorium: actively exploring without commitment yet. Diffusion: neither exploring nor committed.
    topic_code: "3.6"
  - front: "Emerging adulthood → definition"
    back: |
      Arnett's term for roughly 18 to the mid-20s in many industrialized societies: continued exploration before full adult roles.
    topic_code: "3.6"
  - front: "Microsystem and mesosystem → definitions"
    back: |
      Microsystem: settings the child is directly in (family, school, peers). Mesosystem: links between those settings (parent-teacher contact).
    topic_code: "3.6"
  - front: "Exosystem, macrosystem and chronosystem → definitions"
    back: |
      Exosystem: settings that affect the child indirectly (a parent's job). Macrosystem: cultural values and laws. Chronosystem: change over time.
    topic_code: "3.6"
  - front: "Resilience → definition"
    back: |
      Adapting well despite adversity, often supported by protective factors such as a caring adult relationship.
    topic_code: "3.6"
  - front: "Social clock → definition"
    back: |
      A culture's expected timing for life events such as leaving home, marriage and retirement.
    topic_code: "3.6"
  - front: "Well-being in later life → research finding"
    back: |
      Life satisfaction does not plunge in old age; many older adults focus on fewer, closer relationships and attend relatively more to positive information.
    topic_code: "3.6"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 3.6: attachment, temperament, parenting styles,
    Erikson, identity, ecological systems and adult development), with 8 questions (36%) reviewing weeks 14–16
    (research ethics and designs, imprinting, gender roles, theory of mind, babbling) and Unit 1 (hormones,
    heritability). Opens with a shared-context set on one hypothetical study. Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical caregiving program experiment (3.6, 3.1)
    - slug: appsych-u03-w17-q01
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 2.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 120 volunteer families with newborns to a program of weekly home visits that coached parents to respond quickly and warmly to their baby's signals (60 families) or to standard care (60 families). At 12 months, each child was observed in the Strange Situation by coders who did not know the family's group.

        | Attachment pattern | Program group | Standard care |
        |---|---|---|
        | Secure | 42 (70%) | 30 (50%) |
        | Insecure-avoidant | 9 (15%) | 15 (25%) |
        | Insecure-anxious | 6 (10%) | 12 (20%) |
        | Disorganized | 3 (5%) | 3 (5%) |
      prompt: |
        Which research method did the team use?
      options:
        - "A correlational study"
        - "A cross-sectional study"
        - "An experiment"
        - "Naturalistic observation"
      option_explanations:
        - |
          A correlational study measures existing variables; here the team assigned families to conditions.
        - |
          A cross-sectional study compares different age groups at one time; all children here were 12 months old.
        - |
          Correct. Families were randomly assigned to a program or standard care (the independent variable), and attachment was measured as the outcome.
        - |
          Naturalistic observation records behavior in natural settings without intervening; the Strange Situation is a structured lab procedure after an intervention.
      answer: 2
    - slug: appsych-u03-w17-q02
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 120 volunteer families with newborns to a program of weekly home visits that coached parents to respond quickly and warmly to their baby's signals (60 families) or to standard care (60 families). At 12 months, each child was observed in the Strange Situation by coders who did not know the family's group.

        | Attachment pattern | Program group | Standard care |
        |---|---|---|
        | Secure | 42 (70%) | 30 (50%) |
        | Insecure-avoidant | 9 (15%) | 15 (25%) |
        | Insecure-anxious | 6 (10%) | 12 (20%) |
        | Disorganized | 3 (5%) | 3 (5%) |
      prompt: |
        One child in the standard care group played without checking on his mother, showed no distress when she left, and turned away from her when she returned. How would the coders classify him?
      options:
        - "Insecure-avoidant"
        - "Secure"
        - "Insecure-anxious"
        - "Disorganized"
      option_explanations:
        - |
          Correct. Little distress at separation and avoiding the caregiver at reunion define the insecure-avoidant pattern.
        - |
          A securely attached child seeks and is comforted by the caregiver at reunion rather than turning away.
        - |
          An insecure-anxious child is very distressed at separation and clings at reunion, the opposite of this behavior.
        - |
          Disorganized attachment involves confused or contradictory reunion behavior, not consistent avoidance.
      answer: 0
    - slug: appsych-u03-w17-q03
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.B"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 120 volunteer families with newborns to a program of weekly home visits that coached parents to respond quickly and warmly to their baby's signals (60 families) or to standard care (60 families). At 12 months, each child was observed in the Strange Situation by coders who did not know the family's group.

        | Attachment pattern | Program group | Standard care |
        |---|---|---|
        | Secure | 42 (70%) | 30 (50%) |
        | Insecure-avoidant | 9 (15%) | 15 (25%) |
        | Insecure-anxious | 6 (10%) | 12 (20%) |
        | Disorganized | 3 (5%) | 3 (5%) |
      prompt: |
        Which added procedure would best address the ethics of this study?
      options:
        - "Telling parents the program is a parenting test so that they behave naturally"
        - "Leaving every child alone for at least 10 minutes so that distress is measured fully"
        - "Withholding all results from families so that later studies are not affected"
        - "Ending a separation early if a child becomes very distressed, and offering the program to standard-care families afterward"
      option_explanations:
        - |
          Misleading parents about the program would undermine informed consent and is not needed for this design.
        - |
          Prolonged separations would cause unnecessary distress; the procedure uses brief separations for that reason.
        - |
          Participants are entitled to a debriefing; withholding all results is not an ethical safeguard.
        - |
          Correct. Minimizing harm during separations and giving the control group access to a beneficial program after the study both protect participants.
      answer: 3
    - slug: appsych-u03-w17-q04
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 4.B"
      points: 1
      prompt: |
        In Harlow's research, frightened infant monkeys ran to a cloth-covered mother that gave no milk rather than to a wire mother that fed them. Which conclusion does this support?
      options:
        - "Attachment depends mainly on which caregiver provides food."
        - "Contact comfort plays a central role in attachment."
        - "Monkeys do not form attachments to caregivers."
        - "Attachment is formed through imprinting on the first moving object."
      option_explanations:
        - |
          The monkeys preferred the mother that did not feed them, which contradicts a feeding-based account.
        - |
          Correct. The preference for soft contact, especially under stress, showed that contact comfort matters more than nourishment.
        - |
          The infants clearly bonded with the cloth mother, seeking it for comfort and security.
        - |
          Neither artificial mother moved, so the result is not explained by imprinting on a moving object.
      answer: 1
    - slug: appsych-u03-w17-q05
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        At a new daycare, 2-year-old Ava hangs back and fusses mildly for the first few days, then gradually joins in and seems content. Which temperament type does this fit best?
      options:
        - "Slow-to-warm-up"
        - "Difficult"
        - "Easy"
        - "Insecure-avoidant"
      option_explanations:
        - |
          Correct. A slow-to-warm-up child reacts mildly negatively to new situations and adapts gradually.
        - |
          A difficult child reacts intensely and negatively to change and is irregular in routines, more than Ava's mild fussing.
        - |
          An easy child adapts quickly and positively to new situations, without the initial hanging back.
        - |
          Insecure-avoidant is an attachment pattern seen in caregiver reunions, not a temperament type.
      answer: 0
    - slug: appsych-u03-w17-q06
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        Malik's parents set a firm curfew, explain why it matters, listen to his arguments and sometimes adjust the rule. Which parenting style is this?
      options:
        - "Authoritarian"
        - "Permissive"
        - "Authoritative"
        - "Uninvolved"
      option_explanations:
        - |
          Authoritarian parents set rules without explanation or discussion; Malik's parents explain and listen.
        - |
          Permissive parents set few rules; Malik's parents enforce a firm curfew.
        - |
          Correct. Combining clear rules with warmth, reasons and openness to discussion is authoritative parenting.
        - |
          Uninvolved parents offer little warmth or supervision, unlike these engaged parents.
      answer: 2
    - slug: appsych-u03-w17-q07
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        A 4-year-old keeps inventing games and organizing other children to play them. According to Erikson, if adults criticize her plans harshly, she may develop a sense of
      options:
        - "mistrust"
        - "role confusion"
        - "inferiority"
        - "guilt"
      option_explanations:
        - |
          Trust versus mistrust is the infancy crisis about whether needs will be met, not about starting activities.
        - |
          Role confusion is the adolescent outcome of failing to form a coherent identity.
        - |
          Inferiority is the elementary-school outcome tied to skills and schoolwork.
        - |
          Correct. In the preschool crisis of initiative versus guilt, harsh criticism of a child's plans can leave the child feeling guilty about taking initiative.
      answer: 3
    - slug: appsych-u03-w17-q08
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        Lena has always planned to become a lawyer like her parents and has never considered any other career or set of values. In Marcia's terms, her identity status is
      options:
        - "identity achievement"
        - "foreclosure"
        - "moratorium"
        - "diffusion"
      option_explanations:
        - |
          Identity achievement follows a period of exploration; Lena has committed without exploring.
        - |
          Correct. Foreclosure is commitment, often to parents' choices and values, without exploring alternatives.
        - |
          Moratorium is active exploration without commitment yet; Lena is committed and has not explored.
        - |
          Diffusion is neither exploring nor committed; Lena has a firm commitment.
      answer: 1
    - slug: appsych-u03-w17-q09
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        A child's teacher and parents meet regularly and share strategies to help him with reading. In Bronfenbrenner's theory, this connection is part of the
      options:
        - "mesosystem"
        - "microsystem"
        - "exosystem"
        - "chronosystem"
      option_explanations:
        - |
          Correct. The mesosystem is the set of links between the child's microsystems, such as home and school.
        - |
          Home and school are each a microsystem; the relationship between them is the mesosystem.
        - |
          The exosystem includes settings the child is not part of, such as a parent's workplace.
        - |
          The chronosystem is change over time, such as a move or a historical event.
      answer: 0
    - slug: appsych-u03-w17-q10
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        At 3 months, Theo smiles at everyone; at 9 months, he cries when his aunt, whom he rarely sees, tries to hold him. What best explains the change?
      options:
        - "He has developed an insecure attachment."
        - "He has entered the preoperational stage."
        - "He has formed schemas for familiar faces and now shows stranger anxiety."
        - "He has failed the crisis of trust versus mistrust."
      option_explanations:
        - |
          Stranger anxiety is a normal milestone among securely and insecurely attached infants alike; it does not indicate insecurity.
        - |
          The preoperational stage begins around age 2; Theo is an infant in the sensorimotor stage.
        - |
          Correct. Around 8 months, infants recognize familiar faces and become wary of people who do not fit those schemas.
        - |
          Wariness of strangers is a typical development, not evidence of mistrust in his caregivers.
      answer: 2
    - slug: appsych-u03-w17-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 1.A"
      points: 1
      prompt: |
        A 5-year-old tries to cheer up her upset brother by giving him his favorite stuffed rabbit rather than her own favorite doll. Which development does this show?
      options:
        - "Egocentrism"
        - "Theory of mind"
        - "Object permanence"
        - "Conservation"
      option_explanations:
        - |
          An egocentric child would offer what she herself likes; choosing her brother's favorite shows the opposite.
        - |
          Correct. She understands her brother's desires differ from her own, a sign of theory of mind.
        - |
          Object permanence is knowing hidden objects still exist; nothing is hidden here.
        - |
          Conservation is understanding quantity under changes of shape, unrelated to comforting someone.
      answer: 1
    - slug: appsych-u03-w17-q12
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A"
      points: 1
      prompt: |
        Levels of a hormone rise during childbirth, nursing and close physical contact, and the hormone is linked to bonding and trust. Which hormone is it?
      options:
        - "Melatonin"
        - "Adrenaline"
        - "Ghrelin"
        - "Oxytocin"
      option_explanations:
        - |
          Melatonin, from the pineal gland, regulates sleep and the circadian rhythm rather than bonding.
        - |
          Adrenaline prepares the body for fight or flight; it is not the hormone tied to nursing and bonding.
        - |
          Ghrelin signals hunger from the stomach and is unrelated to childbirth and attachment.
        - |
          Correct. Oxytocin is released during childbirth, nursing and close contact and is associated with social bonding.
      answer: 3
    - slug: appsych-u03-w17-q13
      type: multiple_choice
      topic_code: "3.5"
      source: "Original item; CED Topic 3.5, Skill 1.A"
      points: 1
      prompt: |
        A 6-month-old repeats "ba-ba-ba" and "da-da-da" while playing alone. This stage of language development is called
      options:
        - "babbling"
        - "telegraphic speech"
        - "the one-word stage"
        - "overregularization"
      option_explanations:
        - |
          Correct. Babbling, repeated consonant-vowel syllables, typically begins at about 4 to 6 months and is not yet meaningful speech.
        - |
          Telegraphic speech is two-word phrases at about 18 to 24 months, such as "more milk."
        - |
          The one-word stage, around the first birthday, uses single words with meaning.
        - |
          Overregularization is a preschool grammar error such as "goed," which requires words and rules.
      answer: 0
    - slug: appsych-u03-w17-q14
      type: multi_select
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which pairings of a life stage with Erikson's crisis are correct? Select all that apply.
      options:
        - "Toddlerhood: autonomy versus shame and doubt"
        - "Adolescence: intimacy versus isolation"
        - "Elementary school years: competence (industry) versus inferiority"
        - "Late adulthood: integrity versus despair"
        - "Infancy: initiative versus guilt"
      option_explanations:
        - |
          Correct. Toddlers work toward doing things for themselves, Erikson's autonomy versus shame and doubt.
        - |
          Adolescence is identity versus role confusion; intimacy versus isolation belongs to young adulthood.
        - |
          Correct. School-age children focus on mastering skills, competence versus inferiority.
        - |
          Correct. Older adults look back on their lives, integrity versus despair.
        - |
          Infancy is trust versus mistrust; initiative versus guilt belongs to the preschool years.
      answer: [0, 2, 3]
    - slug: appsych-u03-w17-q15
      type: multi_select
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.D"
      points: 2
      partial_credit: true
      prompt: |
        A survey finds that children of authoritative parents have higher grades. Which are reasons the survey cannot show that authoritative parenting causes higher grades? Select all that apply.
      options:
        - "Children who do well in school may make it easier for parents to be warm and reasonable."
        - "Family income could influence both parenting style and grades."
        - "Parenting style was measured, not randomly assigned."
        - "A survey cannot measure grades."
      option_explanations:
        - |
          Correct. Reverse causation is possible: a child's behavior and success can shape how parents respond.
        - |
          Correct. A third variable such as income could produce both the parenting style and the grades.
        - |
          Correct. Without manipulation and random assignment, the study is correlational and cannot establish cause.
        - |
          Grades can be gathered by survey or from records; the problem is the design, not whether grades can be measured.
      answer: [0, 1, 2]
    - slug: appsych-u03-w17-q16
      type: true_false
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        True or false: Research shows that life satisfaction typically falls sharply in old age.
      answer: false
      explanation: |
        False. Many older adults report as much or more well-being than younger adults. They tend to focus on fewer, emotionally closer relationships and attend relatively more to positive information.
    - slug: appsych-u03-w17-q17
      type: true_false
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 1
      prompt: |
        True or false: Konrad Lorenz's goslings followed him because they imprinted on him during a critical period shortly after hatching.
      answer: true
      explanation: |
        True. Newly hatched goslings form a bond with the first moving object they see during a brief critical period; Lorenz's goslings saw him first and followed him.
    - slug: appsych-u03-w17-q18
      type: fill_blank
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        Harlow concluded that the soft touch of the cloth mother, which he called contact ____, was central to the infant monkeys' attachment.
      answer: ["comfort"]
      explanation: |
        Contact comfort, the reassurance from soft physical contact, mattered more than which mother provided milk.
    - slug: appsych-u03-w17-q19
      type: fill_blank
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 1.A"
      points: 1
      prompt: |
        A culture's expectations about how people of a particular gender should behave, such as who should stay home with young children, are called gender ____.
      answer: ["roles", "role"]
      explanation: |
        Gender roles are cultural expectations; they differ across cultures and change over time, which is evidence that they are largely learned.
    - slug: appsych-u03-w17-q20
      type: short_answer
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 3
      prompt: |
        Describe how a 1-year-old with each attachment pattern below would most likely behave when the caregiver returns in the Strange Situation.

        (a) Secure
        (b) Insecure-avoidant
        (c) Insecure-anxious (resistant)
      answer: |
        (a) Greets or goes to the caregiver, is quickly comforted, and returns to playing.
        (b) Ignores or turns away from the caregiver, showing little sign of having missed them.
        (c) Seeks contact but stays upset and hard to soothe, often pushing away or showing anger while clinging.
      explanation: |
        Three points, one per part. Each must describe reunion behavior: comfort-seeking and quick soothing (a); avoidance or indifference (b); distress plus mixed contact-seeking and resistance (c).
    - slug: appsych-u03-w17-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skills 1.A and 3.A"
      points: 3
      prompt: |
        In a hypothetical twin study, infant temperament ratings correlated r = +0.60 within identical-twin pairs and r = +0.30 within fraternal-twin pairs.

        (a) What does this pattern suggest about genetic influence on temperament?
        (b) Explain why the identical-twin correlation is not +1.00.
        (c) Explain how goodness of fit shows that temperament and environment interact.
      answer: |
        (a) Identical twins, who share their genes, are more alike than fraternal twins, so genes contribute to temperament.
        (b) Identical twins still have different experiences (prenatal position, illnesses, how others treat them) and ratings contain measurement error, so they are not identical in temperament.
        (c) The same temperament can lead to different outcomes depending on the environment: a difficult baby with patient, consistent caregivers often does well, while the same baby with harsh or inconsistent care may struggle.
      explanation: |
        Three points, one per part. (a) a genetic contribution inferred from the higher identical-twin correlation. (b) non-shared environment or measurement error. (c) outcomes depend on the match between temperament and caregiving.
    - slug: appsych-u03-w17-q22
      type: long_answer
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skills 2.A, 2.D, 3.A and 4.B"
      points: 6
      stimulus: |
        A hypothetical study, invented for this course. A research team observed 150 infants in the Strange Situation at 12 months and classified each as securely or insecurely attached. When the children were 8, their teachers, who had no information about the earlier results, rated each child's peer competence on a 1 to 10 scale (10 = gets along with others very well). The securely attached children's mean rating was 7.4 (SD = 1.5); the insecurely attached children's mean was 6.6 (SD = 1.7). Thirty families had moved away and could not be found by age 8. Parents gave informed consent at both points, and records were kept confidential.
      prompt: |
        (A) Identify the research method used.
        (B) State the operational definition of peer competence.
        (C) Describe what the means and standard deviations suggest about the size of the difference between groups.
        (D) Identify one ethical guideline the researchers followed.
        (E) Explain how losing 30 families could affect the findings.
        (F) Explain whether the results show that secure attachment causes better peer relationships.
      answer: |
        (A) A longitudinal, correlational study: the same children were followed from 12 months to age 8, and attachment was measured, not manipulated.
        (B) Teachers' ratings of each 8-year-old on a 1 to 10 scale of getting along with others.
        (C) Securely attached children were rated higher on average (7.4 versus 6.6), but the 0.8-point difference is about half a standard deviation, a modest difference with substantial overlap between groups.
        (D) Informed consent, or confidentiality of records.
        (E) Attrition: if the families who moved differ systematically (for example, more family stress), the remaining sample may not represent the original one, biasing the comparison.
        (F) No. Attachment was not randomly assigned; something else, such as sensitive parenting continuing through childhood or the child's temperament, could explain both early attachment and later peer competence.
      explanation: |
        Six points. (A) 1 point: longitudinal or correlational. (B) 1 point: the teachers' 1–10 rating at age 8. (C) 1 point: securely attached higher on average AND the difference described as modest or overlapping relative to the SDs. (D) 1 point: informed consent or confidentiality. (E) 1 point: attrition explained as possible bias in the remaining sample. (F) 1 point: no causal conclusion, with the lack of random assignment or a named third variable.
