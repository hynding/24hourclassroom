week: 14
unit: 3
title: How Developmental Psychologists Study Change, and the Body Across the Lifespan
topics: ["3.1", "3.2"]
guide: guides/week-14.md
guide_description: |
  The three debates of developmental psychology (nature and nurture, continuity and stages, stability and
  change); cross-sectional, longitudinal and cross-sequential designs with cohort effects and attrition;
  habituation and preferential looking for studying infants; research ethics with children (parental
  permission and assent); prenatal stages and teratogens; newborn reflexes, maturation and motor milestones;
  critical and sensitive periods and imprinting; puberty and the adolescent brain; physical change in
  adulthood and later life. Worked examples: a hypothetical cross-sectional memory study and a correlation
  between exercise and memory in older adults.
flashcards_description: |
  30 cards on the developmental debates, cross-sectional and longitudinal designs, cohort effects and
  attrition, infant research methods, prenatal stages and teratogens, newborn reflexes, maturation, critical
  periods, puberty, the adolescent brain and aging.

flashcards:
  - front: "Developmental psychology → what it studies"
    back: |
      Physical, cognitive and social-emotional change across the whole lifespan, from conception to death.
    topic_code: "3.1"
  - front: "Nature-nurture debate in development → the modern answer"
    back: |
      Genes and environment interact: genetic tendencies shape the experiences a child has, and experiences shape which genes are expressed (epigenetics).
    topic_code: "3.1"
  - front: "Continuity versus stages → the two pictures of development"
    back: |
      Continuity: gradual, cumulative change, like a ramp (learning theorists). Stages: distinct, qualitatively different steps, like a staircase (Piaget, Erikson).
    topic_code: "3.1"
  - front: "Stability versus change → what the evidence shows"
    back: |
      Both. Temperament and personality traits show real stability, which grows with age, yet people also change substantially across adolescence and adulthood.
    topic_code: "3.1"
  - front: "Cross-sectional design → definition"
    back: |
      Compares people of different ages at the same point in time. Fast and cheap, but open to cohort effects.
    topic_code: "3.1"
  - front: "Longitudinal design → definition"
    back: |
      Follows the same people and measures them repeatedly over time. Shows change within individuals, but is slow, costly and open to attrition.
    topic_code: "3.1"
  - front: "Cross-sequential design → definition"
    back: |
      Several age cohorts are tested at once and then each is followed for a few years, separating age effects from cohort effects.
    topic_code: "3.1"
  - front: "Cohort effect → definition"
    back: |
      A difference between age groups caused by the historical era they grew up in (schooling, nutrition, technology), not by age itself.
    topic_code: "3.1"
  - front: "Attrition in a longitudinal study → why it biases results"
    back: |
      The people who drop out often differ from those who stay (for example, in health or motivation), so the remaining sample is no longer representative.
    topic_code: "3.1"
  - front: "Age as a variable → why it is never randomly assigned"
    back: |
      Researchers cannot assign people to be 5 or 50, so comparisons between ages are correlational or quasi-experimental, not true experiments on age.
    topic_code: "3.1"
  - front: "Habituation paradigm → how it shows infant discrimination"
    back: |
      Show a stimulus until looking time falls; if looking time rises for a new stimulus, the infant can tell the two apart.
    topic_code: "3.1"
  - front: "Preferential looking → what it measures"
    back: |
      Which of two side-by-side stimuli an infant looks at longer; a reliable preference shows the infant can discriminate them.
    topic_code: "3.1"
  - front: "Research with children → consent rules"
    back: |
      Parental (guardian) permission plus the child's own assent in age-appropriate words; the child may stop at any time; data stay confidential; an IRB reviews the plan.
    topic_code: "3.1"
  - front: "Germinal stage → timing and events"
    back: |
      Conception to about 2 weeks: the zygote divides rapidly and implants in the uterine wall.
    topic_code: "3.2"
  - front: "Embryonic stage → timing and events"
    back: |
      About weeks 3–8: major organs and body structures form; the stage most vulnerable to structural harm from teratogens.
    topic_code: "3.2"
  - front: "Fetal stage → timing and events"
    back: |
      Week 9 to birth: organs grow and mature, weight increases, and the fetus can respond to sounds.
    topic_code: "3.2"
  - front: "Teratogen → definition and examples"
    back: |
      An agent that can cross the placenta and harm prenatal development: alcohol, nicotine, some drugs and medicines, and infections such as rubella.
    topic_code: "3.2"
  - front: "Fetal alcohol spectrum disorders → what they can include"
    back: |
      Effects of prenatal alcohol exposure, which may include distinctive facial features, smaller head size, and lifelong learning, memory and attention difficulties.
    topic_code: "3.2"
  - front: "Rooting reflex → what it is"
    back: |
      A newborn turns toward a touch on the cheek and opens the mouth, which helps the baby find the nipple.
    topic_code: "3.2"
  - front: "Moro reflex → what it is"
    back: |
      A startle response to a sudden loss of support or a loud noise: the arms fling outward and then pull back in.
    topic_code: "3.2"
  - front: "Grasping and Babinski reflexes → what they are"
    back: |
      Grasping: fingers close around an object pressed into the palm. Babinski: the toes fan out when the sole is stroked.
    topic_code: "3.2"
  - front: "Maturation → definition"
    back: |
      Biologically driven growth that unfolds in a set sequence, such as the order of motor milestones, largely independent of experience.
    topic_code: "3.2"
  - front: "Motor milestones → sequence versus timing"
    back: |
      The sequence (lift head, roll, sit, crawl, stand, walk) is nearly universal because of maturation; the timing varies with individual differences and culture.
    topic_code: "3.2"
  - front: "Synaptic pruning → what it does"
    back: |
      Unused neural connections are eliminated while used ones are strengthened: “use it or lose it.” Pruning continues through adolescence.
    topic_code: "3.2"
  - front: "Critical period versus sensitive period → difference"
    back: |
      A critical period is a fixed window in which an experience must occur; a sensitive period is a window in which learning is easiest but still possible later.
    topic_code: "3.2"
  - front: "Imprinting → definition and classic example"
    back: |
      Rapid attachment formed during a critical period; Konrad Lorenz found newly hatched goslings followed the first moving object they saw, including him.
    topic_code: "3.2"
  - front: "Primary sex characteristics → definition"
    back: |
      The reproductive organs themselves, such as the ovaries, uterus and testes, which mature during puberty.
    topic_code: "3.2"
  - front: "Secondary sex characteristics → definition"
    back: |
      Non-reproductive traits that change at puberty: breast development, voice deepening, and body and facial hair.
    topic_code: "3.2"
  - front: "Menarche and spermarche → definitions"
    back: |
      Menarche is the first menstrual period; spermarche is the first ejaculation. Both are landmarks of puberty.
    topic_code: "3.2"
  - front: "Adolescent brain → why risk-taking rises"
    back: |
      Reward-sensitive limbic circuits mature earlier than the prefrontal cortex, which supports impulse control and judgment and keeps maturing into the mid-20s.
    topic_code: "3.2"
  - front: "Menopause → definition"
    back: |
      The end of menstruation, usually around age 50, marking the end of fertility; it follows a decline in estrogen.
    topic_code: "3.2"
  - front: "Physical aging → typical changes"
    back: |
      Slower reaction time, reduced vision and hearing, and some loss of muscle strength and brain volume; exercise and social and mental activity are associated with healthier aging.
    topic_code: "3.2"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topics 3.1 and 3.2: developmental debates and
    designs, infant research methods, prenatal development, reflexes, maturation, puberty and aging), with 7
    questions (32%) reviewing Units 1 and 2 (heredity and environment, neurons, the brain, sleep and
    perception). Opens with a shared-context set on one hypothetical study. Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: hypothetical reaction-time study (3.1)
    - slug: appsych-u03-w14-q01
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team measured simple reaction time (the number of milliseconds to press a key after a light appears, averaged over 20 trials) in 240 volunteers: 60 people in each of four age groups, all tested in the same month.

        | Age group | Mean reaction time (ms) | Standard deviation (ms) |
        |---|---|---|
        | 20-year-olds | 250 | 30 |
        | 40-year-olds | 270 | 32 |
        | 60-year-olds | 300 | 40 |
        | 80-year-olds | 350 | 55 |
      prompt: |
        Which research design did the team use?
      options:
        - "Longitudinal design"
        - "Experiment with random assignment to age groups"
        - "Cross-sectional design"
        - "Case study"
      option_explanations:
        - |
          A longitudinal design measures the same people repeatedly over time; here each person was tested once.
        - |
          Age cannot be randomly assigned, so comparing age groups is never a true experiment on age.
        - |
          Correct. People of different ages were compared at a single point in time, which defines a cross-sectional design.
        - |
          A case study examines one person or a small group in depth; this study compared 240 people on one measure.
      answer: 2
    - slug: appsych-u03-w14-q02
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.D"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team measured simple reaction time (the number of milliseconds to press a key after a light appears, averaged over 20 trials) in 240 volunteers: 60 people in each of four age groups, all tested in the same month.

        | Age group | Mean reaction time (ms) | Standard deviation (ms) |
        |---|---|---|
        | 20-year-olds | 250 | 30 |
        | 40-year-olds | 270 | 32 |
        | 60-year-olds | 300 | 40 |
        | 80-year-olds | 350 | 55 |
      prompt: |
        Which alternative explanation is the main limitation of concluding that aging itself slows reaction time?
      options:
        - "The age groups grew up in different eras, so differences in experience such as video games or computer use could explain part of the gap."
        - "The same people were tested too many times, so practice effects made them faster."
        - "Participants dropped out over the years, leaving only the healthiest people."
        - "The researchers manipulated reaction time, so it cannot also be the dependent variable."
      option_explanations:
        - |
          Correct. This is a cohort effect: in a cross-sectional design, age groups also differ in the era they grew up in, which is confounded with age.
        - |
          Each person was tested in one session, so repeated testing across years did not occur in this design.
        - |
          Attrition is a weakness of longitudinal designs; nobody was followed over the years in this study.
        - |
          Reaction time was measured, not manipulated; it is the dependent variable and age group is the grouping variable.
      answer: 0
    - slug: appsych-u03-w14-q03
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 3.B"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team measured simple reaction time (the number of milliseconds to press a key after a light appears, averaged over 20 trials) in 240 volunteers: 60 people in each of four age groups, all tested in the same month.

        | Age group | Mean reaction time (ms) | Standard deviation (ms) |
        |---|---|---|
        | 20-year-olds | 250 | 30 |
        | 40-year-olds | 270 | 32 |
        | 60-year-olds | 300 | 40 |
        | 80-year-olds | 350 | 55 |
      prompt: |
        What do the standard deviations in the table show?
      options:
        - "Older participants were faster on average than younger ones."
        - "Every 80-year-old was slower than every 20-year-old."
        - "The difference between the groups is statistically significant."
        - "Reaction times varied more from person to person in the older groups than in the younger groups."
      option_explanations:
        - |
          The means rise with age, so older groups were slower on average; standard deviations describe spread, not speed.
        - |
          With standard deviations of 30 and 55 ms, the two distributions could overlap; a mean difference does not mean every individual differs.
        - |
          Statistical significance requires an inferential test and a p-value; standard deviations alone describe variability only.
        - |
          Correct. The standard deviation measures the typical distance from the group mean, and it grows from 30 ms to 55 ms with age.
      answer: 3
    - slug: appsych-u03-w14-q04
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 1
      prompt: |
        A teratogen is most likely to cause a major structural defect, such as a malformed heart, if exposure happens during which period?
      options:
        - "The germinal stage, before implantation"
        - "The embryonic stage, about weeks 3 to 8"
        - "The final month of the fetal stage"
        - "The first month after birth"
      option_explanations:
        - |
          The germinal stage comes before organs begin forming; severe damage then more often ends the pregnancy than causes a specific defect.
        - |
          Correct. Major organs and structures form during the embryonic stage, so it is the most vulnerable period for structural defects.
        - |
          By the late fetal stage the organs have already formed and are growing, so structural malformations are less likely.
        - |
          A teratogen is defined by its effect on prenatal development; after birth the agent no longer acts through the placenta.
      answer: 1
    - slug: appsych-u03-w14-q05
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 1
      prompt: |
        A nurse gently lowers a newborn's head a short distance; the baby flings out both arms and then pulls them back toward the body. Which reflex is this?
      options:
        - "Moro reflex"
        - "Rooting reflex"
        - "Babinski reflex"
        - "Grasping reflex"
      option_explanations:
        - |
          Correct. The Moro (startle) reflex is a response to a sudden loss of support: the arms extend outward and then come back in.
        - |
          The rooting reflex is turning toward a touch on the cheek and opening the mouth, not an arm movement.
        - |
          The Babinski reflex is the fanning of the toes when the sole of the foot is stroked.
        - |
          The grasping reflex is the fingers closing around an object pressed into the palm.
      answer: 0
    - slug: appsych-u03-w14-q06
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 1
      prompt: |
        Infants around the world sit before they crawl and crawl before they walk, although the age at which they walk differs from culture to culture. Which concept best explains the common order?
      options:
        - "Habituation"
        - "Imprinting"
        - "Maturation"
        - "Cohort effect"
      option_explanations:
        - |
          Habituation is a decrease in response to a repeated stimulus; it does not set the order of motor skills.
        - |
          Imprinting is rapid attachment during a critical period in some animals, not the sequence of human motor skills.
        - |
          Correct. Maturation is biologically timed growth of the nervous system and muscles, which fixes the order of milestones while experience shifts timing.
        - |
          A cohort effect is a difference between generations; it does not explain why the sequence is the same everywhere.
      answer: 2
    - slug: appsych-u03-w14-q07
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 1
      prompt: |
        A 16-year-old takes risks while driving with friends that she would not take alone. Which description of brain development best explains this?
      options:
        - "Her occipital lobe has not yet finished developing, so she cannot see hazards."
        - "Her brain has stopped producing new synapses, so she cannot learn from mistakes."
        - "Her cerebellum matured before her brainstem, which upset her balance."
        - "Her reward-sensitive limbic circuits have matured earlier than her prefrontal cortex, which supports impulse control."
      option_explanations:
        - |
          The occipital lobe processes vision and matures early; the problem is judgment under social reward, not seeing.
        - |
          Adolescent brains keep forming and pruning synapses; learning continues throughout life.
        - |
          The brainstem matures very early; this pairing has nothing to do with risk-taking around peers.
        - |
          Correct. Limbic reward circuits mature before the prefrontal cortex, so the pull of rewards, especially around peers, can outrun self-control.
      answer: 3
    - slug: appsych-u03-w14-q08
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.C"
      points: 1
      prompt: |
        In a hypothetical study, 4-month-olds see a red circle repeatedly until their looking time drops. They are then shown a red square, and their looking time increases sharply. What can the researchers conclude?
      options:
        - "The infants prefer squares to circles."
        - "The infants can discriminate between the circle and the square."
        - "The infants have object permanence."
        - "The infants have become tired of all shapes."
      option_explanations:
        - |
          A preference would need a side-by-side comparison; recovery of looking after habituation shows the new shape was detected as different.
        - |
          Correct. Habituation followed by renewed looking shows the infant noticed the change, so it can tell the two shapes apart.
        - |
          Object permanence concerns knowing an object exists when hidden; nothing was hidden in this procedure.
        - |
          If the infants were tired of all shapes, looking time would stay low for the square; it rose instead.
      answer: 1
    - slug: appsych-u03-w14-q09
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.B"
      points: 1
      prompt: |
        A research team wants 7-year-olds to complete a 20-minute puzzle task. Which procedure meets ethical guidelines for research with children?
      options:
        - "Obtain a parent's written permission and the child's own agreement, and let the child stop at any time."
        - "Obtain the child's signature on an adult consent form, since the child is the participant."
        - "Skip consent because a puzzle task carries no risk."
        - "Obtain the school principal's permission and tell parents after the study ends."
      option_explanations:
        - |
          Correct. Children cannot give legal consent, so researchers get parental permission plus the child's assent and honor the right to withdraw.
        - |
          A 7-year-old cannot give legally valid informed consent; a parent or guardian must give permission.
        - |
          Low risk does not remove the need for informed permission; an IRB still requires it for this kind of study.
        - |
          A principal cannot substitute for a parent's permission, and telling parents afterward is not informed consent.
      answer: 0
    - slug: appsych-u03-w14-q10
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 3.A"
      points: 1
      prompt: |
        In a hypothetical twin study, the age at which children first walked correlated r = +0.80 within identical-twin pairs and r = +0.45 within fraternal-twin pairs. What does this pattern suggest?
      options:
        - "Walking age is determined entirely by the environment."
        - "Fraternal twins share more genes than identical twins."
        - "Genes contribute to individual differences in walking age."
        - "Walking age cannot be studied with correlations."
      option_explanations:
        - |
          If only environment mattered, identical and fraternal twins raised together would be about equally similar; here identical twins are much more similar.
        - |
          Identical twins share essentially all their genes; fraternal twins share about half, like ordinary siblings.
        - |
          Correct. Greater similarity in genetically identical pairs than in fraternal pairs points to a genetic contribution to the trait.
        - |
          Twin studies routinely use correlations to estimate how much genes and environment contribute to a trait.
      answer: 2
    - slug: appsych-u03-w14-q11
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A"
      points: 1
      prompt: |
        A 4-year-old has much of one hemisphere removed to stop severe seizures, and over the next years recovers most language and motor abilities. Which concept best explains the recovery?
      options:
        - "Lateralization"
        - "Myelination"
        - "Habituation"
        - "Neuroplasticity"
      option_explanations:
        - |
          Lateralization is the specialization of each hemisphere; the recovery shows functions moving, which is the opposite of fixed specialization.
        - |
          Myelination speeds neural transmission but does not by itself let the remaining hemisphere take over lost functions.
        - |
          Habituation is a decline in response to a repeated stimulus; it does not explain recovery of function.
        - |
          Correct. Neuroplasticity is the brain's capacity to reorganize, and it is greatest in young children, so the other hemisphere can take over.
      answer: 3
    - slug: appsych-u03-w14-q12
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 1
      prompt: |
        Most crawling infants in the classic visual cliff studies refused to cross a glass surface over an apparent drop, even when a parent called them. What perceptual ability do these studies test?
      options:
        - "Color constancy"
        - "Depth perception"
        - "Selective attention"
        - "Perceptual set"
      option_explanations:
        - |
          Color constancy is seeing an object's color as stable under different lighting; the cliff tests whether infants see a drop.
        - |
          Correct. Refusing to cross the apparent drop shows the infants perceive depth, which researchers took as evidence it develops early.
        - |
          Selective attention is focusing on some stimuli and ignoring others; the cliff is designed to test seeing a drop.
        - |
          Perceptual set is a mental predisposition from expectations; the visual cliff measures depth perception.
      answer: 1
    - slug: appsych-u03-w14-q13
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A"
      points: 1
      prompt: |
        Through childhood and adolescence, more of the brain's axons become coated with myelin. What effect does this have?
      options:
        - "Neural impulses travel faster along the axon."
        - "Neurons release more neurotransmitter at each synapse."
        - "The threshold for firing is removed, so neurons fire constantly."
        - "Neurons stop forming new connections."
      option_explanations:
        - |
          Correct. The myelin sheath insulates the axon and lets the impulse jump between gaps, greatly speeding transmission.
        - |
          Myelin covers the axon; the amount of neurotransmitter released at the terminals is a separate process.
        - |
          Neurons still follow the all-or-none principle and need to reach threshold; myelin does not remove it.
        - |
          Myelination does not stop synapse formation; the brain keeps forming connections throughout life.
      answer: 0
    - slug: appsych-u03-w14-q14
      type: multi_select
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are secondary sex characteristics? Select all that apply.
      options:
        - "Deepening of the voice"
        - "Maturation of the ovaries"
        - "Growth of facial and body hair"
        - "Breast development"
        - "Maturation of the testes"
      option_explanations:
        - |
          Correct. Voice deepening is a change outside the reproductive organs, so it is a secondary sex characteristic.
        - |
          The ovaries are reproductive organs, which makes their maturation a primary sex characteristic.
        - |
          Correct. Facial and body hair are non-reproductive traits that change at puberty: secondary sex characteristics.
        - |
          Correct. Breasts are not reproductive organs in this classification, so their development is a secondary sex characteristic.
        - |
          The testes are reproductive organs, which makes their maturation a primary sex characteristic.
      answer: [0, 2, 3]
    - slug: appsych-u03-w14-q15
      type: multi_select
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.D"
      points: 2
      partial_credit: true
      prompt: |
        A research team plans to follow 500 children from age 2 to age 20. Which are weaknesses of this longitudinal design? Select all that apply.
      options:
        - "Some families will drop out, and those who stay may differ from those who leave."
        - "The study will take many years and be expensive to run."
        - "Age differences will be confounded with the different eras in which the age groups grew up."
        - "Repeated testing may make children better at the tasks through practice."
      option_explanations:
        - |
          Correct. Attrition shrinks the sample and biases it when dropouts differ systematically from those who remain.
        - |
          Correct. Following people for 18 years takes long-term funding and staff, a practical weakness of longitudinal work.
        - |
          This cohort confound is the weakness of cross-sectional designs; a longitudinal study follows one cohort.
        - |
          Correct. Taking similar tests again and again can produce practice effects that look like developmental change.
      answer: [0, 1, 3]
    - slug: appsych-u03-w14-q16
      type: true_false
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 1.A"
      points: 1
      prompt: |
        True or false: If the heritability of height in a population is about 0.80, then about 80% of any one person's height comes from their genes.
      answer: false
      explanation: |
        False. Heritability describes how much of the variation among people in a particular population can be attributed to genetic differences. It says nothing about how much of one individual's trait comes from genes, and it can change when the environment changes.
    - slug: appsych-u03-w14-q17
      type: true_false
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Skill 1.A"
      points: 1
      prompt: |
        True or false: Newborns spend a much larger share of their sleep in REM sleep than adults do.
      answer: true
      explanation: |
        True. About half of a newborn's sleep is REM sleep, compared with roughly a fifth to a quarter in adults. The REM share falls across childhood, one more example of physical change across the lifespan.
    - slug: appsych-u03-w14-q18
      type: fill_blank
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 1
      prompt: |
        Alcohol, nicotine and the rubella virus can each cross the placenta and harm prenatal development; any such agent is called a ____.
      answer: ["teratogen", "teratogens", "a teratogen"]
      explanation: |
        A teratogen is any agent that can disrupt prenatal development. Its effects depend on dose, timing and genetic susceptibility.
    - slug: appsych-u03-w14-q19
      type: fill_blank
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.D"
      points: 1
      prompt: |
        When 70-year-olds score lower than 30-year-olds on a computer task partly because they grew up without computers, the difference is a ____ effect (one word).
      answer: ["cohort", "generational", "generation"]
      explanation: |
        A cohort effect is a difference between age groups caused by the era they grew up in. It is the main weakness of cross-sectional designs.
    - slug: appsych-u03-w14-q20
      type: short_answer
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skills 3.A and 2.D"
      points: 3
      prompt: |
        A hypothetical survey of 400 adults aged 65 to 85 found that weekly hours of physical activity correlated r = +0.35 with scores on a memory test.

        (a) Describe the direction and strength of this relationship.
        (b) Explain why the survey cannot show that physical activity improves memory.
        (c) Describe a study design that could test whether physical activity causes better memory in older adults.
      answer: |
        (a) Positive and weak to moderate: older adults who are more active tend to score somewhat higher, with many exceptions.
        (b) It is correlational: the variables were measured, not manipulated. A third variable such as overall health could raise both, or better memory could lead people to stay active.
        (c) An experiment: randomly assign older adults to an exercise program or a control group (for example, a waitlist or stretching class) for several months, then compare memory scores, with testers blind to group.
      explanation: |
        Three points, one per part. (a) positive direction and a strength described as weak, moderate or weak-to-moderate. (b) the variables were not manipulated, plus a third variable or reverse direction. (c) random assignment to an activity condition and a comparison condition, with memory measured afterward; a design without random assignment earns nothing for (c).
    - slug: appsych-u03-w14-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 1.A"
      points: 3
      prompt: |
        A toddler with a genetically influenced, very active temperament is often told to sit still by adults, and gets fewer chances to play quietly with books.

        (a) Explain how this example shows an interaction of heredity and environment.
        (b) Explain how an adoption study could help separate genetic and environmental influences on a child's activity level.
        (c) Name the developmental debate this example illustrates.
      answer: |
        (a) The genetic tendency (high activity) changes how adults respond to the child, and those responses (more correction, fewer quiet activities) shape the child's later behavior: genes influence the environment the child experiences.
        (b) Compare adopted children's activity levels with those of their biological parents (shared genes, different home) and their adoptive parents (shared home, different genes); more similarity to biological parents suggests genetic influence.
        (c) The nature-nurture debate.
      explanation: |
        Three points, one per part. (a) a link running from the gene-based trait to the environment and back to behavior. (b) both comparisons (biological versus adoptive parents) with the correct inference. (c) nature and nurture (heredity and environment).
    - slug: appsych-u03-w14-q22
      type: long_answer
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skills 2.A, 2.B, 3.B and 4.B"
      points: 6
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 180 pregnant volunteers at three city clinics. In confidential interviews, each reported how many alcoholic drinks she had per week during pregnancy, and the team grouped the participants as none (n = 110), light (n = 50) or moderate (n = 20). When the children turned 6, testers who did not know the group of each child gave them an attention task scored from 0 to 40 (higher = better sustained attention). Mean scores were 31 (none), 28 (light) and 24 (moderate). The correlation between drinks per week and attention score was r = −0.31. Parents gave written informed consent, children gave verbal assent, and all records were stored under code numbers.
      prompt: |
        (A) Identify the research method used, and explain why it is not an experiment.
        (B) State the operational definition of attention in this study.
        (C) Describe what the correlation of r = −0.31 shows.
        (D) Identify one ethical guideline the researchers followed.
        (E) Explain one reason the findings may not generalize to all children.
        (F) Explain how the findings support the claim that alcohol is a teratogen, and give one alternative explanation the design cannot rule out.
      answer: |
        (A) A correlational (longitudinal) study: drinking was measured, not assigned, so it is not an experiment; it would be unethical to assign alcohol.
        (B) The child's score from 0 to 40 on the attention task at age 6.
        (C) A negative, moderate relationship: more prenatal drinks per week went with lower attention scores at age 6.
        (D) Informed consent (parents) with child assent, or confidentiality (records under code numbers).
        (E) Volunteers from three city clinics may not represent rural families or people who chose not to volunteer; only 20 children were in the moderate group.
        (F) Children exposed to more alcohol had lower attention scores, consistent with alcohol crossing the placenta and harming brain development. But families who drank more may differ in other ways (nutrition, smoking, stress, home environment) that could also lower attention.
      explanation: |
        Six points. (A) 1 point: correlational or observational (longitudinal accepted) with the reason that alcohol use was not manipulated. (B) 1 point: the 0–40 attention task score at age 6. (C) 1 point: negative direction and the meaning in context (more drinking, lower attention); a strength word is not required. (D) 1 point: informed consent/assent, or confidentiality, tied to the stimulus. (E) 1 point: a sampling limit tied to the study (volunteers, three city clinics, small moderate group). (F) 1 point: links the pattern to teratogen effects AND names a confounding variable; a claim that the study proves causation earns 0.
