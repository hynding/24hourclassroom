week: 16
unit: 3
title: How Thinking and Language Develop
topics: ["3.4", "3.5"]
guide: guides/week-16.md
guide_description: |
  Piaget's schemas, assimilation and accommodation, and his four stages (sensorimotor, preoperational,
  concrete operational, formal operational) with object permanence, egocentrism, conservation, centration,
  reversibility and abstract reasoning; later research that challenged Piaget's timing; Vygotsky's zone of
  proximal development, scaffolding and private speech; theory of mind and false-belief tasks; adolescent
  egocentrism; fluid and crystallized intelligence in adulthood; phonemes, morphemes, semantics, syntax and
  pragmatics; babbling, one-word and telegraphic speech and overregularization; learning, nativist and
  interactionist accounts of language; sensitive periods, linguistic relativity and the brain's language
  areas. Worked examples: a cross-sectional trap in aging research and a hypothetical experiment on
  infant-directed speech.
flashcards_description: |
  30 cards on Piaget's processes and stages, critiques of Piaget, Vygotsky, theory of mind, adolescent
  egocentrism, cognitive aging, the units of language, language milestones and theories of language
  acquisition.

flashcards:
  - front: "Schema (Piaget) → definition"
    back: |
      A mental framework that organizes knowledge about an object, event or idea.
    topic_code: "3.4"
  - front: "Assimilation → definition and example"
    back: |
      Fitting a new experience into an existing schema, such as a toddler calling a cat a “doggy.”
    topic_code: "3.4"
  - front: "Accommodation → definition and example"
    back: |
      Changing an existing schema or creating a new one to fit new experience, such as forming a separate “cat” schema.
    topic_code: "3.4"
  - front: "Sensorimotor stage → ages and focus"
    back: |
      Birth to about 2: infants learn through senses and actions and develop object permanence.
    topic_code: "3.4"
  - front: "Object permanence → definition"
    back: |
      Understanding that objects continue to exist when they cannot be seen; Piaget placed it at around 8 months.
    topic_code: "3.4"
  - front: "Preoperational stage → ages and features"
    back: |
      About 2 to 7: symbolic thought and pretend play, but egocentrism, centration, irreversibility, animism and no conservation.
    topic_code: "3.4"
  - front: "Egocentrism (Piaget) → definition and test"
    back: |
      Difficulty taking another's perspective; in the three-mountains task, young children described their own view when asked what a doll could see.
    topic_code: "3.4"
  - front: "Conservation → definition"
    back: |
      Understanding that quantity (number, volume, mass) stays the same despite changes in shape or arrangement.
    topic_code: "3.4"
  - front: "Centration and irreversibility → definitions"
    back: |
      Centration: focusing on one feature (height of a glass) and ignoring others. Irreversibility: being unable to mentally undo an action.
    topic_code: "3.4"
  - front: "Animism → definition"
    back: |
      Giving lifelike qualities to objects, such as believing the moon follows the car; common in the preoperational stage.
    topic_code: "3.4"
  - front: "Concrete operational stage → ages and features"
    back: |
      About 7 to 11: conservation, reversibility and logical reasoning about concrete objects and events.
    topic_code: "3.4"
  - front: "Formal operational stage → ages and features"
    back: |
      About 12 and up: abstract, hypothetical reasoning and systematic testing of ideas; not reached by everyone in every domain.
    topic_code: "3.4"
  - front: "Critiques of Piaget → three main points"
    back: |
      Infants understand objects earlier than he thought (looking-time studies); development is more continuous and uneven; culture and schooling affect performance.
    topic_code: "3.4"
  - front: "Zone of proximal development → definition"
    back: |
      Vygotsky's term for the gap between what a child can do alone and what the child can do with guidance from a more skilled person.
    topic_code: "3.4"
  - front: "Scaffolding → definition"
    back: |
      Temporary support (hints, modeling, breaking a task into steps) given within the zone of proximal development and gradually withdrawn.
    topic_code: "3.4"
  - front: "Private speech (Vygotsky) → definition"
    back: |
      Children talking aloud to themselves to guide a task, which Vygotsky saw as thought becoming internalized.
    topic_code: "3.4"
  - front: "Theory of mind → definition and typical age"
    back: |
      Understanding that others have beliefs, desires and knowledge different from one's own; most children pass false-belief tasks around age 4 or 5.
    topic_code: "3.4"
  - front: "False-belief task → what it tests"
    back: |
      Whether a child predicts that a character will look where the character last saw an object, not where the child knows it is now.
    topic_code: "3.4"
  - front: "Imaginary audience and personal fable → definitions"
    back: |
      Imaginary audience: an adolescent's sense that everyone is watching and judging. Personal fable: the belief that one's experiences are unique and that risks will not apply.
    topic_code: "3.4"
  - front: "Crystallized versus fluid intelligence in aging → pattern"
    back: |
      Crystallized (knowledge, vocabulary) holds steady or grows into later life; fluid (fast reasoning with new problems) and processing speed decline gradually after early adulthood.
    topic_code: "3.4"
  - front: "Phoneme → definition"
    back: |
      The smallest distinct unit of sound in a language, such as the sound of “sh.”
    topic_code: "3.5"
  - front: "Morpheme → definition and example"
    back: |
      The smallest unit that carries meaning: “unhappily” has three (un + happy + ly).
    topic_code: "3.5"
  - front: "Syntax and semantics → difference"
    back: |
      Syntax: rules for ordering words into sentences. Semantics: the meaning of words and sentences.
    topic_code: "3.5"
  - front: "Pragmatics → definition"
    back: |
      The social rules for using language, such as taking turns or speaking more simply to a young child.
    topic_code: "3.5"
  - front: "Babbling → timing and change"
    back: |
      Repeated syllables starting around 4 to 6 months; by about 10 months babbling narrows toward the sounds of the home language.
    topic_code: "3.5"
  - front: "Telegraphic speech → definition"
    back: |
      Two-word-stage speech (about 18 to 24 months) that keeps content words and drops the rest, such as “more juice,” in the language's word order.
    topic_code: "3.5"
  - front: "Overregularization → definition and significance"
    back: |
      Applying a grammar rule to exceptions (“I goed,” “two mouses”); it shows children are learning rules, not just copying adults.
    topic_code: "3.5"
  - front: "Chomsky's nativist view → core idea"
    back: |
      Humans are born with a capacity for grammar (universal grammar or a language acquisition device), so exposure is enough to acquire a language's rules.
    topic_code: "3.5"
  - front: "Skinner's learning view of language → core idea and limit"
    back: |
      Language is learned through association, imitation and reinforcement; it does not explain overregularization or the speed of grammar learning.
    topic_code: "3.5"
  - front: "Sensitive period for language → evidence"
    back: |
      Early second-language learners more often reach native-like accent and grammar; deaf children without early sign or spoken language exposure tend to have lasting grammar difficulties.
    topic_code: "3.5"
  - front: "Linguistic relativity → definition and status"
    back: |
      Whorf's hypothesis that language shapes thought; the strong form has little support, a weak form (language influences attention and memory) has some.
    topic_code: "3.5"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topics 3.4 and 3.5: Piaget, Vygotsky, theory of
    mind, adolescent egocentrism, cognitive aging, the units of language, language milestones and theories),
    with 8 questions (36%) reviewing weeks 14 and 15 (developmental designs, the developing brain, effect sizes)
    and Units 1 and 2 (language areas of the brain, fluid and crystallized intelligence). Opens with a
    shared-context set on one hypothetical study. Multiple choice, select-all and true/false items are graded
    at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical conservation study (3.4, 3.1)
    - slug: appsych-u03-w16-q01
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team tested 160 children, 40 at each of four ages, all in the same school year. Each child watched juice poured from a short, wide glass into a tall, thin glass and was asked whether there was more juice, less juice or the same amount. A child passed by answering "the same" and giving a reason.

        | Age | Percentage of children who passed |
        |---|---|
        | 4 | 10% |
        | 6 | 35% |
        | 8 | 80% |
        | 10 | 95% |
      prompt: |
        According to Piaget, why did most 4-year-olds fail the task?
      options:
        - "They lacked object permanence, so they forgot the juice existed."
        - "They were in the formal operational stage and overthought the question."
        - "They had already accommodated their schema for liquids."
        - "They were in the preoperational stage and focused on the height of the liquid alone."
      option_explanations:
        - |
          Object permanence develops in infancy; 4-year-olds know the juice still exists but misjudge its amount.
        - |
          Formal operations begin around age 12; 4-year-olds are far from that stage.
        - |
          Accommodating a correct schema would help them pass; the failure shows they have not yet reorganized their thinking about quantity.
        - |
          Correct. Preoperational children lack conservation because of centration on one dimension (height) and irreversibility.
      answer: 3
    - slug: appsych-u03-w16-q02
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 1.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team tested 160 children, 40 at each of four ages, all in the same school year. Each child watched juice poured from a short, wide glass into a tall, thin glass and was asked whether there was more juice, less juice or the same amount. A child passed by answering "the same" and giving a reason.

        | Age | Percentage of children who passed |
        |---|---|
        | 4 | 10% |
        | 6 | 35% |
        | 8 | 80% |
        | 10 | 95% |
      prompt: |
        An 8-year-old who passed explains, "If you poured it back, it would be the same as before." Which ability does this show?
      options:
        - "Reversibility"
        - "Animism"
        - "Egocentrism"
        - "Object permanence"
      option_explanations:
        - |
          Correct. Mentally undoing the pour is reversibility, a hallmark of concrete operational thought that supports conservation.
        - |
          Animism is giving lifelike qualities to objects; the child is reasoning about quantity, not treating juice as alive.
        - |
          Egocentrism is difficulty taking another's view; the child's answer is about reversing an action.
        - |
          Object permanence is knowing hidden objects still exist; the juice is never hidden in this task.
      answer: 0
    - slug: appsych-u03-w16-q03
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.D"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team tested 160 children, 40 at each of four ages, all in the same school year. Each child watched juice poured from a short, wide glass into a tall, thin glass and was asked whether there was more juice, less juice or the same amount. A child passed by answering "the same" and giving a reason.

        | Age | Percentage of children who passed |
        |---|---|
        | 4 | 10% |
        | 6 | 35% |
        | 8 | 80% |
        | 10 | 95% |
      prompt: |
        The team now wants to know whether individual children acquire conservation suddenly or gradually. Which change to the design would best answer that question?
      options:
        - "Test more children at each age in the same school year."
        - "Randomly assign children to the four age groups."
        - "Follow the same children and test them every few months from age 4 to age 10."
        - "Report the median age instead of percentages."
      option_explanations:
        - |
          A larger cross-sectional sample still compares different children and cannot show how any one child changes.
        - |
          Age cannot be randomly assigned, so this is not a possible design.
        - |
          Correct. A longitudinal design tracks change within each child, showing whether conservation appears suddenly or gradually.
        - |
          Changing the summary statistic does not add information about change within individual children.
      answer: 2
    - slug: appsych-u03-w16-q04
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 1.A"
      points: 1
      prompt: |
        A toddler who knows only round balls is handed an oval football. After it bounces strangely, he stops calling it a ball and starts calling it "bumpy." In Piaget's terms, what has he done?
      options:
        - "Assimilated the football into his ball schema"
        - "Accommodated by changing his schemas to fit the new object"
        - "Shown egocentrism by ignoring the football's shape"
        - "Shown conservation of the football's mass"
      option_explanations:
        - |
          Assimilation would mean treating the football as an ordinary ball; he changed his categories instead.
        - |
          Correct. Creating a new category for an object that does not fit an existing schema is accommodation.
        - |
          Egocentrism is difficulty taking another's perspective; this scenario involves categorizing an object.
        - |
          Conservation concerns quantity under transformation; nothing about the football's amount was changed.
      answer: 1
    - slug: appsych-u03-w16-q05
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 1.A"
      points: 1
      prompt: |
        A 5-month-old stops reaching for a toy as soon as it is covered with a cloth; a 10-month-old pulls the cloth away. In Piaget's view, the older infant has developed
      options:
        - "conservation"
        - "object permanence"
        - "theory of mind"
        - "formal operations"
      option_explanations:
        - |
          Conservation is understanding quantity under changes of shape; it develops in middle childhood, not infancy.
        - |
          Correct. Searching for a hidden toy shows the infant knows it still exists out of sight: object permanence.
        - |
          Theory of mind concerns understanding others' beliefs; it typically develops around age 4 or 5.
        - |
          Formal operations involve abstract reasoning and begin in adolescence.
      answer: 1
    - slug: appsych-u03-w16-q06
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 1.A"
      points: 1
      prompt: |
        A girl cannot solve a jigsaw puzzle alone, but she finishes it when her father suggests she start with the edge pieces, and next time she does it herself. Which concept describes the range of tasks in which this help works?
      options:
        - "Concrete operational stage"
        - "Imaginary audience"
        - "Zone of proximal development"
        - "Accommodation"
      option_explanations:
        - |
          The concrete operational stage is Piaget's age-based stage; the scenario stresses what she can do with guidance.
        - |
          The imaginary audience is an adolescent feeling of being watched, unrelated to guided problem-solving.
        - |
          Correct. The zone of proximal development is the gap between what a child can do alone and with help; the father's hint is scaffolding within it.
        - |
          Accommodation is changing a schema; the scenario highlights social support for learning, Vygotsky's emphasis.
      answer: 2
    - slug: appsych-u03-w16-q07
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 1.A"
      points: 1
      prompt: |
        A child sees a crayon box and is surprised to find candles inside. Asked what a friend who has not looked will think is inside, the child says "crayons." What does this answer show?
      options:
        - "A developed theory of mind"
        - "Egocentrism"
        - "Lack of object permanence"
        - "Overregularization"
      option_explanations:
        - |
          Correct. Predicting the friend's false belief shows the child understands that others' knowledge can differ from his own.
        - |
          An egocentric child would say "candles," assuming the friend knows what he knows.
        - |
          The child keeps track of the hidden contents, so object permanence is not in question.
        - |
          Overregularization is a language error such as "goed," unrelated to reasoning about beliefs.
      answer: 0
    - slug: appsych-u03-w16-q08
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 1.A"
      points: 1
      prompt: |
        A 14-year-old refuses to go to school after a bad haircut, sure that everyone will stare at him all day. Which concept describes this?
      options:
        - "Personal fable"
        - "Centration"
        - "Animism"
        - "Imaginary audience"
      option_explanations:
        - |
          The personal fable is believing one's experiences are unique or that risks will not apply; this is about feeling watched.
        - |
          Centration is focusing on one feature of a problem; this concerns his belief about others' attention.
        - |
          Animism is giving lifelike qualities to objects, typical of young children.
        - |
          Correct. The imaginary audience is an adolescent's feeling of being constantly observed and judged by others.
      answer: 3
    - slug: appsych-u03-w16-q09
      type: multiple_choice
      topic_code: "3.5"
      source: "Original item; CED Topic 3.5, Skill 1.A"
      points: 1
      prompt: |
        How many morphemes are in the word "unbreakable"?
      options:
        - "Three"
        - "One"
        - "Two"
        - "Four"
      option_explanations:
        - |
          Correct. Un (not), break (the root) and able (can be) each carry meaning, so the word has three morphemes.
        - |
          The prefix and suffix each add meaning, so the word is more than one morpheme.
        - |
          Both the prefix "un" and the suffix "able" carry meaning in addition to "break," giving more than two.
        - |
          Four would require another meaningful unit; the letters within "break" are phonemes, not morphemes.
      answer: 0
    - slug: appsych-u03-w16-q10
      type: multiple_choice
      topic_code: "3.5"
      source: "Original item; CED Topic 3.5, Skill 4.B"
      points: 1
      prompt: |
        A 3-year-old says, "We buyed two sheeps." Which conclusion is best supported?
      options:
        - "The child is copying errors heard from parents."
        - "The child is applying grammar rules to words that are exceptions."
        - "The child has a language disorder affecting Wernicke's area."
        - "The child is still in the babbling stage."
      option_explanations:
        - |
          Adults rarely say "buyed" or "sheeps," so imitation cannot easily explain these forms.
        - |
          Correct. This is overregularization: applying the rules for past tense and plurals to irregular words, which shows rule learning.
        - |
          Overregularization is a normal part of language development and does not signal brain damage.
        - |
          Babbling is pre-word sound play; this child speaks a full sentence with grammar.
      answer: 1
    - slug: appsych-u03-w16-q11
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 1
      prompt: |
        Between early childhood and adolescence, the number of synapses in many areas of the cortex decreases even as thinking becomes faster and more efficient. Which process explains this?
      options:
        - "Neurogenesis"
        - "Habituation"
        - "Myelin loss"
        - "Synaptic pruning"
      option_explanations:
        - |
          Neurogenesis is the formation of new neurons, which would not reduce the number of synapses.
        - |
          Habituation is a decline in response to a repeated stimulus, not a structural change in connections.
        - |
          Myelination increases through childhood and adolescence; losing myelin would slow thinking.
        - |
          Correct. Unused connections are pruned while used ones are strengthened, making neural networks more efficient.
      answer: 3
    - slug: appsych-u03-w16-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A"
      points: 1
      prompt: |
        After a stroke, a man understands what people say to him but speaks slowly in short, effortful phrases. Damage to which area is most likely?
      options:
        - "Wernicke's area"
        - "The occipital lobe"
        - "Broca's area"
        - "The cerebellum"
      option_explanations:
        - |
          Damage to Wernicke's area mainly impairs comprehension, often with fluent but meaningless speech, the opposite pattern.
        - |
          The occipital lobe processes vision; damage there affects sight rather than speech production.
        - |
          Correct. Broca's area in the left frontal lobe supports speech production, so damage causes halting speech with comprehension largely intact.
        - |
          The cerebellum coordinates movement and balance; it is not the main area for producing language.
      answer: 2
    - slug: appsych-u03-w16-q13
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 1.A"
      points: 1
      prompt: |
        A 72-year-old does very well on a vocabulary test but takes longer than younger adults to solve unfamiliar logic puzzles. This pattern illustrates
      options:
        - "stable crystallized intelligence with declining fluid intelligence"
        - "declining crystallized intelligence with stable fluid intelligence"
        - "the Flynn effect"
        - "the personal fable"
      option_explanations:
        - |
          Correct. Accumulated knowledge such as vocabulary holds up with age, while fast reasoning about new problems tends to decline.
        - |
          This reverses the usual pattern; vocabulary is crystallized and tends to stay strong in later life.
        - |
          The Flynn effect is the rise in average test scores across generations, not change within one person's life.
        - |
          The personal fable is an adolescent belief in one's uniqueness, unrelated to intellectual aging.
      answer: 0
    - slug: appsych-u03-w16-q14
      type: multi_select
      topic_code: "3.5"
      source: "Original item; CED Topic 3.5, Skill 4.B"
      points: 2
      partial_credit: true
      prompt: |
        Which observations support Chomsky's nativist view of language acquisition? Select all that apply.
      options:
        - "Children around the world pass through similar language milestones in the same order."
        - "Children produce forms such as \"mouses\" that adults rarely say."
        - "Children learn the accent of the people around them."
        - "Children acquire complex grammar quickly from limited and imperfect input."
      option_explanations:
        - |
          Correct. Similar milestones across very different languages fit a shared biological capacity for language.
        - |
          Correct. Novel rule-based errors suggest children extract grammar rules rather than simply imitating.
        - |
          Learning the local accent shows the role of imitation and exposure, which fits the learning view better.
        - |
          Correct. The speed of grammar learning from imperfect input was a central argument for an inborn grammar capacity.
      answer: [0, 1, 3]
    - slug: appsych-u03-w16-q15
      type: multi_select
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.C"
      points: 2
      partial_credit: true
      prompt: |
        A hypothetical lab shows 4-month-olds a ball rolling behind a screen and then appearing to pass through a solid wall. Which design features would strengthen the conclusion that infants expect objects to be solid? Select all that apply.
      options:
        - "Comparing looking time at the impossible event with looking time at a possible event"
        - "Having observers who do not know which event was shown score the looking times"
        - "Counterbalancing the order in which infants see the possible and impossible events"
        - "Asking the infants' parents what they think their babies expected"
      option_explanations:
        - |
          Correct. Longer looking at the impossible event than at a possible one is the evidence; without a comparison there is no baseline.
        - |
          Correct. Blind scoring prevents observers' expectations from biasing the measured looking times.
        - |
          Correct. Counterbalancing stops order effects, such as boredom on the second event, from being confused with surprise.
        - |
          Parents' guesses are not a valid measure of what infants expect and add bias rather than evidence.
      answer: [0, 1, 2]
    - slug: appsych-u03-w16-q16
      type: true_false
      topic_code: "3.5"
      source: "Original item; CED Topic 3.5, Skill 1.A"
      points: 1
      prompt: |
        True or false: Young infants can tell apart many speech sounds from languages they have never heard, but by about the end of their first year they become less able to distinguish sounds their home language does not use.
      answer: true
      explanation: |
        True. Perception narrows toward the home language's phonemes during the first year, an early example of a sensitive period in language development.
    - slug: appsych-u03-w16-q17
      type: true_false
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 3.C"
      points: 1
      prompt: |
        True or false: If a difference between two groups is statistically significant, it must be a large difference.
      answer: false
      explanation: |
        False. Significance means the difference is unlikely to be due to chance. With a very large sample, a tiny difference can be significant; the effect size (such as Cohen's d) tells how large it is.
    - slug: appsych-u03-w16-q18
      type: fill_blank
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.A"
      points: 1
      prompt: |
        A design that tests several age groups at once and then follows each group for a few years, separating age effects from cohort effects, is called a cross-____ design.
      answer: ["sequential", "sequence"]
      explanation: |
        A cross-sequential design combines cross-sectional and longitudinal features, so researchers can check whether an age difference holds across cohorts more cheaply than a full longitudinal study.
    - slug: appsych-u03-w16-q19
      type: fill_blank
      topic_code: "3.5"
      source: "Original item; CED Topic 3.5, Skill 1.A"
      points: 1
      prompt: |
        A 20-month-old's two-word sentences such as "Mommy go" and "want ball" are called ____ speech.
      answer: ["telegraphic", "telegraph"]
      explanation: |
        Telegraphic speech keeps the key content words and drops function words, like an old-fashioned telegram, while following the language's word order.
    - slug: appsych-u03-w16-q20
      type: short_answer
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 1.A"
      points: 3
      prompt: |
        A 9-year-old is struggling with long division.

        (a) In which of Piaget's stages is the child likely to be, and what does that stage predict about the kind of explanation that will help?
        (b) Describe how a teacher could use scaffolding to help.
        (c) Explain one difference between Piaget's and Vygotsky's views of what drives cognitive development.
      answer: |
        (a) Concrete operational; explanations tied to concrete objects or pictures (for example, sharing counters into groups) will help more than abstract rules alone.
        (b) The teacher works the first steps with the child, gives hints or a checklist for each step, then withdraws support as the child succeeds alone.
        (c) Piaget stressed the child's own exploration and maturation through stages; Vygotsky stressed social interaction with more skilled people and language.
      explanation: |
        Three points, one per part. (a) concrete operational with a concrete-materials implication. (b) temporary, adjustable support that is gradually removed. (c) individual discovery and stages versus social interaction and culture.
    - slug: appsych-u03-w16-q21
      type: short_answer
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skills 1.A and 2.C"
      points: 3
      prompt: |
        In a hypothetical experiment, 80 adolescents were randomly assigned to complete a driving simulation either alone or while two friends watched. Those watched by friends ran 40% more yellow lights.

        (a) Identify the independent and dependent variables.
        (b) Explain why random assignment allows a causal conclusion here.
        (c) Use brain development to explain the result.
      answer: |
        (a) IV: whether friends were watching (alone versus with friends). DV: the number of yellow lights run in the simulation.
        (b) Random assignment spreads other differences (risk-taking personality, driving experience) evenly across the groups, so the difference can be attributed to the presence of friends.
        (c) Reward-sensitive limbic circuits mature before the prefrontal cortex, so in adolescence the social reward of peers can outweigh still-developing impulse control.
      explanation: |
        Three points, one per part. (a) both variables correctly identified. (b) random assignment equalizes participant differences between conditions. (c) earlier-maturing reward system and later-maturing prefrontal cortex linked to peers.
    - slug: appsych-u03-w16-q22
      type: long_answer
      topic_code: "3.5"
      source: "Original item; CED Topic 3.5, Skills 2.A, 2.D, 3.A and 4.B"
      points: 6
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 90 adults who had moved to the United States from countries where English is not spoken and who had lived in the U.S. for at least 10 years. The participants' age when they arrived ranged from 3 to 30. Each judged 200 English sentences as grammatical or not, and the score was the number judged correctly. The correlation between age at arrival and grammar score was r = −0.68. Participants signed consent forms, were told they could stop at any time, and were identified only by code numbers.
      prompt: |
        (A) Identify the research method used.
        (B) State the operational definition of English grammar skill.
        (C) Describe what the correlation of r = −0.68 shows.
        (D) Identify one ethical guideline the researchers followed.
        (E) Explain one reason the findings may not generalize to all second-language learners.
        (F) Explain how the findings support the idea of a sensitive period for language, and give one other variable that could explain the relationship.
      answer: |
        (A) A correlational study (age at arrival was measured, not manipulated).
        (B) The number of the 200 English sentences correctly judged as grammatical or ungrammatical.
        (C) A strong negative relationship: people who arrived at older ages tended to have lower grammar scores.
        (D) Informed consent, the right to withdraw, or confidentiality (code numbers).
        (E) Only 90 immigrants to the U.S. learning English were studied; learners of other languages, or people taught in classrooms rather than by immersion, may differ.
        (F) Learning a language earlier went with better grammar, consistent with language being acquired most easily in childhood. But people who arrived younger also attended U.S. schools and may have spoken more English every day, so amount of exposure could explain the relationship.
      explanation: |
        Six points. (A) 1 point: correlational. (B) 1 point: the score on the 200-sentence grammaticality task. (C) 1 point: negative direction stated in context (later arrival, lower scores). (D) 1 point: consent, withdrawal or confidentiality tied to the stimulus. (E) 1 point: a sampling limit from the study. (F) 1 point: links earlier arrival and higher scores to a sensitive period AND names a plausible third variable (schooling, daily English use, motivation); stating that the study proves a sensitive period earns 0.
