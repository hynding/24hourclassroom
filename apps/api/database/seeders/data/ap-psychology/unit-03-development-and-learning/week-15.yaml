week: 15
unit: 3
title: Gender and Sexual Orientation
topics: ["3.3"]
guide: guides/week-15.md
guide_description: |
  Sex and gender; intersex variations; gender identity (cisgender, transgender, nonbinary), gender roles,
  gender expression and gender typing; biological influences (prenatal and pubertal hormones), social
  learning theory and gender schema theory; the size of psychological sex and gender differences, with
  overlapping distributions, effect size (Cohen's d) and the difference between significance and size;
  sexual orientation and what research shows about its development (not a disorder, not explained by
  parenting, many genes of small effect, prenatal influences, the fraternal birth order effect); and research
  methods for sensitive topics (anonymity, social desirability bias, sampling). Worked examples: a
  hypothetical spatial-test result with d = 0.2, and hypothetical twin concordance data.
flashcards_description: |
  30 cards on sex and gender, gender identity and roles, gender typing, biological, social learning and
  gender schema accounts, effect sizes and overlapping distributions, sexual orientation research, and
  studying sensitive topics.

flashcards:
  - front: "Sex (in psychology) → definition"
    back: |
      Biological characteristics: sex chromosomes, gonads, hormones and anatomy.
    topic_code: "3.3"
  - front: "Gender → definition"
    back: |
      The roles, behaviors, expectations and identities a culture associates with being female, male or another gender.
    topic_code: "3.3"
  - front: "Intersex → definition"
    back: |
      Describes people born with sex characteristics (chromosomes, gonads, hormones or anatomy) that do not fit typical definitions of female or male.
    topic_code: "3.3"
  - front: "Gender identity → definition"
    back: |
      A person's internal sense of their own gender.
    topic_code: "3.3"
  - front: "Cisgender and transgender → definitions"
    back: |
      Cisgender: gender identity matches the sex assigned at birth. Transgender: gender identity differs from the sex assigned at birth.
    topic_code: "3.3"
  - front: "Nonbinary → definition"
    back: |
      A gender identity that is not exclusively female or male.
    topic_code: "3.3"
  - front: "Gender role → definition"
    back: |
      A culture's set of expectations about how people of a particular gender should behave; roles vary across cultures and change over time.
    topic_code: "3.3"
  - front: "Gender expression → definition"
    back: |
      How a person outwardly presents gender, through clothing, hairstyle, speech and behavior.
    topic_code: "3.3"
  - front: "Gender typing → definition"
    back: |
      The process by which children acquire the behaviors, interests and preferences their culture associates with a gender.
    topic_code: "3.3"
  - front: "Gender identity in early childhood → typical timeline"
    back: |
      By about age 2 or 3 most children label themselves and others by gender; by about 5 to 7 most understand that gender is generally stable over time.
    topic_code: "3.3"
  - front: "Androgens → role in development"
    back: |
      Hormones such as testosterone that guide prenatal development of reproductive anatomy, affect developing brain circuits, and rise at puberty.
    topic_code: "3.3"
  - front: "Prenatal androgen exposure research → finding"
    back: |
      Children exposed to unusually high prenatal androgen levels show, on average, shifts in toy and play preferences, suggesting hormones contribute to some gender-related behavior.
    topic_code: "3.3"
  - front: "Social learning theory of gender → mechanism"
    back: |
      Children are reinforced or discouraged for gender-typed behavior and observe and imitate models such as parents, peers and media characters.
    topic_code: "3.3"
  - front: "Gender schema theory → core idea"
    back: |
      Sandra Bem's proposal that children form a mental framework for organizing information by gender, then seek out and remember information that fits it.
    topic_code: "3.3"
  - front: "Gender schema → effect on memory"
    back: |
      Information that fits the schema is encoded and recalled more easily; inconsistent information may be forgotten or distorted to fit (a man cooking remembered as a woman cooking).
    topic_code: "3.3"
  - front: "Culture and gender roles → evidence they are partly learned"
    back: |
      The content of gender roles (jobs, chores, clothing, emotional expression) varies widely across cultures and has changed within cultures over time.
    topic_code: "3.3"
  - front: "Overlapping distributions → what they mean for group differences"
    back: |
      Even when group means differ, most individuals in one group score within the range of the other group, so a mean difference says little about any individual.
    topic_code: "3.3"
  - front: "Effect size (Cohen's d) → formula and benchmarks"
    back: |
      d = difference between two means ÷ standard deviation. About 0.2 is small, 0.5 medium and 0.8 large.
    topic_code: "3.3"
  - front: "Meta-analysis → definition"
    back: |
      A statistical method that combines the results of many studies to estimate an overall effect size.
    topic_code: "3.3"
  - front: "Gender differences meta-analyses → general finding"
    back: |
      Most psychological differences between women and men are small or near zero; a few, such as some measures of physical aggression and throwing distance, are larger on average.
    topic_code: "3.3"
  - front: "Statistical significance versus effect size → difference"
    back: |
      Significance says a difference is unlikely to be due to chance; effect size says how big it is. A huge sample can make a tiny effect significant.
    topic_code: "3.3"
  - front: "Stereotype threat → definition"
    back: |
      Concern about confirming a negative stereotype about one's group, which can lower performance on a test in that domain.
    topic_code: "3.3"
  - front: "Sexual orientation → definition"
    back: |
      An enduring pattern of emotional, romantic and/or sexual attraction, distinct from sexual behavior and from self-identification.
    topic_code: "3.3"
  - front: "Heterosexual, gay or lesbian, bisexual, asexual → definitions"
    back: |
      Attraction to people of a different gender; to people of the same gender; to more than one gender; little or no sexual attraction to others.
    topic_code: "3.3"
  - front: "Homosexuality and the DSM → history"
    back: |
      It was removed from the American Psychiatric Association's diagnostic manual in 1973; no sexual orientation is classified as a disorder.
    topic_code: "3.3"
  - front: "Parenting and sexual orientation → research finding"
    back: |
      No good evidence that parenting style or family structure determines orientation; studies find no reliable difference in sexual orientation between children of same-gender parents and other children.
    topic_code: "3.3"
  - front: "Genetics of sexual orientation → research finding"
    back: |
      Identical twins are more often alike in orientation than fraternal twins, but far from always; a very large 2019 genetic study found many variants of tiny effect and no single gene.
    topic_code: "3.3"
  - front: "Fraternal birth order effect → definition"
    back: |
      On average, each older biological brother (same mother) slightly raises the probability that a later-born male is gay: a small group-level effect, which some researchers link to the prenatal environment.
    topic_code: "3.3"
  - front: "Social desirability bias → effect on sensitive surveys"
    back: |
      People may underreport stigmatized identities or behaviors to look good; anonymous surveys reduce the bias and usually give higher estimates than face-to-face interviews.
    topic_code: "3.3"
  - front: "Anonymity versus confidentiality → difference"
    back: |
      Anonymity: no one, including the researcher, can link answers to a person. Confidentiality: the researcher can link them but promises not to reveal them.
    topic_code: "3.3"
  - front: "Twin concordance → definition and limit"
    back: |
      The percentage of twin pairs in which both share a trait. Concordance below 100% in identical twins shows non-genetic factors matter too.
    topic_code: "3.3"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 3.3: sex and gender, gender identity and
    roles, theories of gender development, effect sizes for group differences, sexual orientation research and
    methods for sensitive topics), with 7 questions (32%) reviewing week 14 (developmental designs, puberty)
    and Units 1 and 2 (twin studies, hormones, heuristics and biases). Opens with a shared-context set on one
    hypothetical study. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against
    the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical verbal fluency study (3.3)
    - slug: appsych-u03-w15-q01
      type: multiple_choice
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 3.C"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team gave a verbal fluency test (the number of animal names a student can list in 60 seconds) to a random sample of 1,600 high school students, 800 girls and 800 boys.

        | Group | Mean | Standard deviation |
        |---|---|---|
        | Girls | 24 | 6 |
        | Boys | 23 | 6 |

        The difference between the means was statistically significant (p = 0.001), and the effect size was d = 0.17.
      prompt: |
        Which statement best describes the size of the difference?
      options:
        - "Large: a statistically significant result means the groups barely overlap."
        - "Small: the two distributions overlap almost completely."
        - "Medium: a 1-point difference is about half a standard deviation."
        - "Impossible to judge without knowing the median of each group."
      option_explanations:
        - |
          Significance says the difference is unlikely to be due to chance, not that it is large; d = 0.17 is a small effect.
        - |
          Correct. A d of about 0.2 is small by convention, so the distributions overlap heavily and the means differ by a sixth of a standard deviation.
        - |
          A 1-point difference with a standard deviation of 6 is 1 ÷ 6 ≈ 0.17 standard deviations, not half of one.
        - |
          The effect size already compares the mean difference with the spread; medians are not needed to judge its size.
      answer: 1
    - slug: appsych-u03-w15-q02
      type: multiple_choice
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 3.C"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team gave a verbal fluency test (the number of animal names a student can list in 60 seconds) to a random sample of 1,600 high school students, 800 girls and 800 boys.

        | Group | Mean | Standard deviation |
        |---|---|---|
        | Girls | 24 | 6 |
        | Boys | 23 | 6 |

        The difference between the means was statistically significant (p = 0.001), and the effect size was d = 0.17.
      prompt: |
        Why could such a small difference be statistically significant?
      options:
        - "The standard deviations were different for the two groups."
        - "The researchers used random assignment to groups."
        - "The test measured a skill that has no variability."
        - "With 1,600 participants, even a small difference is unlikely to be due to chance."
      option_explanations:
        - |
          Both standard deviations were 6, and unequal spreads would not make a small difference significant anyway.
        - |
          Gender was not randomly assigned; this is a comparison of existing groups, so random assignment did not happen.
        - |
          The standard deviations of 6 show the scores varied a good deal; a skill with no variability would have a standard deviation of 0.
        - |
          Correct. Large samples estimate means precisely, so a tiny difference can reach significance even when its practical size is small.
      answer: 3
    - slug: appsych-u03-w15-q03
      type: multiple_choice
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 3.C"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team gave a verbal fluency test (the number of animal names a student can list in 60 seconds) to a random sample of 1,600 high school students, 800 girls and 800 boys.

        | Group | Mean | Standard deviation |
        |---|---|---|
        | Girls | 24 | 6 |
        | Boys | 23 | 6 |

        The difference between the means was statistically significant (p = 0.001), and the effect size was d = 0.17.
      prompt: |
        A girl and a boy from this school are chosen at random. What do the results allow you to say about their scores?
      options:
        - "Very little: because the distributions overlap heavily, either student could easily score higher."
        - "The girl will score exactly 1 point higher than the boy."
        - "The girl will certainly score higher, because the result is significant."
        - "The boy will score higher, because boys have less variability."
      option_explanations:
        - |
          Correct. Group averages that differ by a sixth of a standard deviation say almost nothing about which of two individuals will score higher.
        - |
          The 1-point gap is between group means; individual scores vary with a standard deviation of 6.
        - |
          Significance concerns the group means, not individuals; many boys outscore many girls when the effect is this small.
        - |
          The two groups had the same standard deviation, and lower variability would not make a boy score higher.
      answer: 0
    - slug: appsych-u03-w15-q04
      type: multiple_choice
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 1.A"
      points: 1
      prompt: |
        Which is an example of gender rather than sex?
      options:
        - "A person's sex chromosomes"
        - "The hormones produced by a person's gonads"
        - "A culture's expectation about who should care for young children"
        - "The anatomy of a person's reproductive organs"
      option_explanations:
        - |
          Sex chromosomes are biological characteristics, so they fall under sex rather than gender.
        - |
          Hormones produced by the gonads are biological, so they are part of sex as psychologists define it.
        - |
          Correct. Expectations about caregiving are cultural roles, which is what gender refers to.
        - |
          Reproductive anatomy is a biological characteristic, so it is part of sex rather than gender.
      answer: 2
    - slug: appsych-u03-w15-q05
      type: multiple_choice
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 1.A"
      points: 1
      prompt: |
        Shown a picture of a man knitting, 5-year-old Leo later recalls that the picture showed a woman knitting. Which theory best explains his error?
      options:
        - "Social learning theory, because Leo was reinforced for remembering pictures"
        - "Gender schema theory, because Leo's framework about gender distorted his memory"
        - "Habituation, because Leo had grown used to pictures of knitting"
        - "Maturation, because memory develops in a fixed sequence"
      option_explanations:
        - |
          Nothing in the scenario involves reinforcement or imitation; the error comes from how Leo organized the information.
        - |
          Correct. A gender schema leads children to encode and recall information so it fits their beliefs about gender, so the knitter becomes a woman.
        - |
          Habituation is a decreasing response to a repeated stimulus; it would not turn a man in a picture into a woman in memory.
        - |
          Maturation concerns biologically timed growth; it does not explain a memory distorted to fit a gender belief.
      answer: 1
    - slug: appsych-u03-w15-q06
      type: multiple_choice
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 1.A"
      points: 1
      prompt: |
        Maya watches her older brother get praised for fixing a bike and then starts asking to help with repairs. Which account of gender development fits this best?
      options:
        - "Social learning theory"
        - "Gender schema theory"
        - "Prenatal hormone exposure"
        - "Imprinting during a critical period"
      option_explanations:
        - |
          Correct. Maya observed a model being reinforced and then imitated the behavior: observational learning with vicarious reinforcement.
        - |
          Gender schema theory stresses a child's mental framework guiding attention and memory; this scenario centers on observing a rewarded model.
        - |
          Prenatal hormones act before birth; this behavior followed directly from watching someone be praised.
        - |
          Imprinting is rapid attachment in some animals during a critical period, not learning a skill by watching.
      answer: 0
    - slug: appsych-u03-w15-q07
      type: multiple_choice
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 1.A"
      points: 1
      prompt: |
        Sam was assigned male at birth and has an internal sense of being a woman. Which term describes Sam's gender identity?
      options:
        - "Intersex"
        - "Cisgender"
        - "Bisexual"
        - "Transgender"
      option_explanations:
        - |
          Intersex describes sex characteristics that do not fit typical patterns; Sam's description concerns gender identity.
        - |
          Cisgender describes a gender identity that matches the sex assigned at birth, which is not Sam's case.
        - |
          Bisexual describes a sexual orientation, attraction to more than one gender; it says nothing about gender identity.
        - |
          Correct. A transgender person has a gender identity that differs from the sex they were assigned at birth.
      answer: 3
    - slug: appsych-u03-w15-q08
      type: multiple_choice
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 3.C"
      points: 1
      prompt: |
        In a hypothetical twin study of sexual orientation, concordance was 32% for identical twins and 16% for fraternal twins. Which conclusion is best supported?
      options:
        - "Sexual orientation is determined entirely by genes."
        - "Sexual orientation is determined entirely by family environment."
        - "Genes contribute to sexual orientation, but non-genetic factors also matter."
        - "The data show that a single gene determines sexual orientation."
      option_explanations:
        - |
          If genes alone determined it, identical twins, who share their genes, would be concordant in nearly 100% of pairs, not 32%.
        - |
          Identical twins are twice as concordant as fraternal twins raised in similar homes, which points to some genetic influence.
        - |
          Correct. Higher identical-twin concordance suggests a genetic contribution, and concordance far below 100% shows other factors contribute too.
        - |
          Twin concordance cannot identify specific genes, and large genetic studies point to many variants of small effect.
      answer: 2
    - slug: appsych-u03-w15-q09
      type: multiple_choice
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 2.B"
      points: 1
      prompt: |
        A research team plans a survey of high school students that asks about gender identity. Which procedure best protects participants and reduces social desirability bias?
      options:
        - "Anonymous online responses with no names collected, and permission to skip any question"
        - "Face-to-face interviews in which a teacher records each student's answers by name"
        - "Asking students to raise their hands in class for each answer category"
        - "Collecting names so that answers can be shared with parents afterward"
      option_explanations:
        - |
          Correct. Anonymity protects privacy and makes honest answers easier, and the right to skip questions respects voluntary participation.
        - |
          Named, face-to-face answers to a teacher raise social desirability bias and put private information at risk.
        - |
          Public answers in class remove all privacy and invite peer pressure, which biases responses and can harm students.
        - |
          Sharing identified answers would break confidentiality, a core ethical protection for sensitive research.
      answer: 0
    - slug: appsych-u03-w15-q10
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.A"
      points: 1
      prompt: |
        A research team asks the same 90 children at ages 2, 4 and 6 whether a boy can grow up to be a mother, to see when they understand that gender is generally stable. Which design is this?
      options:
        - "Cross-sectional"
        - "Longitudinal"
        - "Case study"
        - "Experiment"
      option_explanations:
        - |
          A cross-sectional design compares different children of different ages at one time; here the same children are retested.
        - |
          Correct. Measuring the same children repeatedly as they grow is a longitudinal design.
        - |
          A case study examines one person or a small group in depth; this follows 90 children on one question.
        - |
          No variable is manipulated and age is not assigned, so this is not an experiment.
      answer: 1
    - slug: appsych-u03-w15-q11
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 1
      prompt: |
        Which change during puberty involves a primary sex characteristic?
      options:
        - "Growth of underarm hair"
        - "Deepening of the voice"
        - "Widening of the shoulders"
        - "Maturation of the ovaries or testes"
      option_explanations:
        - |
          Body hair is a non-reproductive trait that changes at puberty, so it is a secondary sex characteristic.
        - |
          The voice deepens because the larynx grows, a non-reproductive change: a secondary sex characteristic.
        - |
          Shoulder growth changes body shape but involves no reproductive organ, so it is secondary.
        - |
          Correct. The ovaries and testes are reproductive organs, so their maturation is a primary sex characteristic.
      answer: 3
    - slug: appsych-u03-w15-q12
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A"
      points: 1
      prompt: |
        Compared with messages sent by the nervous system, messages sent by hormones such as testosterone and estrogen are generally
      options:
        - "faster, because they travel along myelinated axons"
        - "limited to the synapse between two neurons"
        - "slower but longer lasting, because they travel through the bloodstream"
        - "produced only during puberty"
      option_explanations:
        - |
          Hormones travel in the blood, not along axons, and are slower than neural impulses.
        - |
          Neurotransmitters act across a synapse; hormones circulate through the bloodstream to targets throughout the body.
        - |
          Correct. Endocrine glands release hormones into the bloodstream, so their effects are slower to arrive but longer lasting than neural signals.
        - |
          Sex hormones act before birth, rise at puberty and continue to be produced through adulthood.
      answer: 2
    - slug: appsych-u03-w15-q13
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.B"
      points: 1
      prompt: |
        A coach who believes girls are worse at strategy games notices every chess match a girl on the team loses and overlooks the ones she wins. Which cognitive bias is this?
      options:
        - "Confirmation bias"
        - "Functional fixedness"
        - "The framing effect"
        - "Mental set from a successful algorithm"
      option_explanations:
        - |
          Correct. Confirmation bias is seeking or noticing information that supports an existing belief while ignoring evidence against it.
        - |
          Functional fixedness is seeing an object only in its usual use; it does not explain selective attention to evidence.
        - |
          The framing effect is a change in decisions caused by how information is worded; nothing here is reworded.
        - |
          A mental set is approaching problems in a way that worked before; the coach is filtering evidence to fit a belief.
      answer: 0
    - slug: appsych-u03-w15-q14
      type: multi_select
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 4.B"
      points: 2
      partial_credit: true
      prompt: |
        Which statements are supported by research on sexual orientation? Select all that apply.
      options:
        - "No sexual orientation is classified as a psychological disorder."
        - "Parenting style has been shown to determine a child's sexual orientation."
        - "Genetic studies point to many genetic variants, each with a small effect."
        - "A single gene determines whether a person is gay."
        - "Identical twins are more often alike in sexual orientation than fraternal twins."
      option_explanations:
        - |
          Correct. Homosexuality was removed from the American Psychiatric Association's manual in 1973, and no orientation is classed as a disorder.
        - |
          Research has found no good evidence that parenting style or family structure determines sexual orientation.
        - |
          Correct. A very large genetic study found many variants with tiny effects rather than one decisive gene.
        - |
          No single gene has been found; the genetic influence is spread across many variants and is only part of the picture.
        - |
          Correct. Twin studies find higher concordance in identical twins, though well below 100%, suggesting a moderate genetic influence.
      answer: [0, 2, 4]
    - slug: appsych-u03-w15-q15
      type: multi_select
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 2.D"
      points: 2
      partial_credit: true
      prompt: |
        A research team wants an accurate estimate of how many adults in a state identify as bisexual. Which choices would improve the estimate? Select all that apply.
      options:
        - "Drawing a random sample of adults from the whole state"
        - "Recruiting participants only at one university's student center"
        - "Using an anonymous self-administered questionnaire"
        - "Defining the identity terms clearly in the question wording"
      option_explanations:
        - |
          Correct. Random sampling gives every adult a chance to be chosen, so the sample can represent the state's population.
        - |
          A single student center is a convenience sample of young students that would not represent all adults in the state.
        - |
          Correct. Anonymity reduces social desirability bias, so people are more likely to report a stigmatized identity honestly.
        - |
          Correct. Estimates change with wording, so clear, consistent definitions improve the validity of the measure.
      answer: [0, 2, 3]
    - slug: appsych-u03-w15-q16
      type: true_false
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 1.A"
      points: 1
      prompt: |
        True or false: Gender identity and sexual orientation are two words for the same thing.
      answer: false
      explanation: |
        False. Gender identity is a person's internal sense of their own gender; sexual orientation is an enduring pattern of attraction to others. A person's gender identity does not tell you their orientation, or the reverse.
    - slug: appsych-u03-w15-q17
      type: true_false
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 1
      prompt: |
        True or false: On average, puberty begins earlier in girls than in boys, although timing varies widely among healthy individuals.
      answer: true
      explanation: |
        True. On average girls begin puberty a year or two before boys. Both groups show a wide normal range, and early or late timing relative to peers can affect how adolescents feel and are treated.
    - slug: appsych-u03-w15-q18
      type: fill_blank
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 1.A"
      points: 1
      prompt: |
        Sandra Bem's theory that children organize information through a mental framework about gender is called gender ____ theory.
      answer: ["schema", "schemas"]
      explanation: |
        Gender schema theory holds that once children have a gender schema, they attend to, encode and remember information in ways that fit it.
    - slug: appsych-u03-w15-q19
      type: fill_blank
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 1.A"
      points: 1
      prompt: |
        Identical twins, who develop from a single fertilized egg and share essentially all their genes, are also called ____ twins.
      answer: ["monozygotic", "mono-zygotic", "mz"]
      explanation: |
        Monozygotic twins come from one zygote that splits; dizygotic (fraternal) twins come from two eggs and share about half their genes, like ordinary siblings.
    - slug: appsych-u03-w15-q20
      type: short_answer
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 1.A"
      points: 3
      prompt: |
        Jordan, a 17-year-old, was assigned female at birth, identifies as a woman, often wears her school's soccer jersey and is attracted to women. In her family's culture, girls are expected to help cook for holidays.

        (a) Identify Jordan's gender identity and whether she is cisgender or transgender.
        (b) Identify one gender role described in the scenario.
        (c) Explain why Jordan's sexual orientation cannot be inferred from her gender identity or her clothing.
      answer: |
        (a) Jordan identifies as a woman, which matches her sex assigned at birth, so she is cisgender.
        (b) The cultural expectation that girls help cook for holidays.
        (c) Gender identity (her sense of being a woman) and gender expression (the jersey) are separate from sexual orientation (whom she is attracted to); the scenario tells us her attraction directly, and none of the other features predicts it.
      explanation: |
        Three points, one per part. (a) woman and cisgender. (b) the holiday cooking expectation (or another cultural expectation clearly drawn from the scenario). (c) explains that orientation is attraction to others, distinct from identity and from expression; an answer that links clothing to orientation earns 0.
    - slug: appsych-u03-w15-q21
      type: short_answer
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.D"
      points: 3
      prompt: |
        A research team wants to know whether children's preference for same-gender playmates grows stronger between ages 3 and 9.

        (a) Describe how the team could study this with a cross-sectional design.
        (b) Describe one weakness of that design for this question.
        (c) Explain one advantage a longitudinal design would have.
      answer: |
        (a) Observe groups of 3-, 5-, 7- and 9-year-olds during free play in the same month, recording the percentage of play time each child spends with same-gender playmates, and compare the age groups.
        (b) Cohort effects: the age groups grew up with different schools, media or social trends, so differences may reflect the era rather than age. (Different children in each group also add individual differences.)
        (c) Following the same children from 3 to 9 shows how each child's preference changes, removing cohort differences between age groups.
      explanation: |
        Three points, one per part. (a) different age groups measured at one time, with a measure of playmate preference. (b) cohort effects, or another valid weakness tied to comparing different children. (c) change within the same individuals, or no cohort confound; "more accurate" alone earns nothing.
    - slug: appsych-u03-w15-q22
      type: long_answer
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skills 2.A, 2.C, 3.B and 4.B"
      points: 6
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 120 children aged 4 and 5 at preschools in one county. Each child was randomly assigned to see a new toy (a wooden puzzle box) described as "a toy for girls," "a toy for boys" or with no label. Each child then had 5 minutes of free play with the box and two other toys, and an observer who did not know the label condition recorded the seconds spent playing with the box. Among girls, mean play time was 130 seconds (girls label), 55 seconds (boys label) and 95 seconds (no label); among boys, it was 50, 140 and 100 seconds. Parents gave written permission, children agreed to play, and families were told the purpose of the labels afterward.
      prompt: |
        (A) Identify the research method, and the independent variable.
        (B) State the operational definition of interest in the toy.
        (C) Describe what the means show for girls who heard "a toy for boys" compared with the no-label condition.
        (D) Identify one ethical guideline the researchers followed.
        (E) Explain one reason the results may not generalize to all children.
        (F) Explain how the results support gender schema theory.
      answer: |
        (A) An experiment; the independent variable is the toy's label (for girls, for boys, no label).
        (B) The number of seconds the child played with the puzzle box during 5 minutes of free play, as recorded by a blind observer.
        (C) Girls who heard the box was for boys played with it far less (55 seconds) than girls who heard no label (95 seconds).
        (D) Informed consent from parents (with child assent), or debriefing (families told the purpose afterward).
        (E) All children came from preschools in one county, and only 4- and 5-year-olds were tested, so results may differ in other cultures or ages.
        (F) Children played more with a toy labeled for their own gender and less with one labeled for the other gender, even though the toy was identical: the label activated their gender schema ("toys for people like me"), which guided their choices.
      explanation: |
        Six points. (A) 1 point: experiment AND the label as the IV. (B) 1 point: seconds of play with the box in the 5-minute session. (C) 1 point: the comparison 55 versus 95 seconds (less play with the other-gender label). (D) 1 point: parental permission/assent or debriefing, tied to the stimulus. (E) 1 point: a sampling limit from the study (one county, preschoolers only). (F) 1 point: links same-gender-label preference to a schema about what fits one's own gender; a social learning account with no reference to labels or schemas earns 0.
