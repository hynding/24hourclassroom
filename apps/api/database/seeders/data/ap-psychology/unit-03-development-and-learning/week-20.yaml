week: 20
unit: 3
title: Learning by Watching, Thinking and Wiring
topics: ["3.9"]
guide: guides/week-20.md
guide_description: |
  Observational learning and Bandura's Bobo doll studies, vicarious reinforcement and punishment, learning
  versus performance, and the four processes of modeling (attention, retention, reproduction, motivation);
  prosocial and antisocial modeling and what media violence research can and cannot show; Köhler's insight
  learning, Tolman and Honzik's latent learning and cognitive maps, and learned helplessness as a cognitive
  factor; mirror neurons and the debate about them, the amygdala, cerebellum and hippocampus in learning,
  dopamine prediction signals and long-term potentiation; a side-by-side comparison of classical conditioning,
  operant conditioning and observational learning. Worked examples: labeling a scenario that mixes modeling
  and reinforcement, and reading hypothetical latent learning data.
flashcards_description: |
  30 cards on observational learning, the Bobo doll studies, modeling processes, prosocial and antisocial
  models, insight and latent learning, cognitive maps, learned helplessness, mirror neurons, the brain in
  learning and comparing the three kinds of learning.

flashcards:
  - front: "Observational learning → definition"
    back: |
      Learning by watching others (models), without needing direct reinforcement; also called social learning or modeling.
    topic_code: "3.9"
  - front: "Bobo doll study (1961) → procedure"
    back: |
      Preschoolers watched an adult act aggressively toward an inflatable doll, play quietly, or saw no model; then each was left with toys including the doll.
    topic_code: "3.9"
  - front: "Bobo doll study (1961) → finding"
    back: |
      Children who watched the aggressive model imitated its specific aggressive acts and words far more than children in the other groups.
    topic_code: "3.9"
  - front: "Bobo doll follow-up (1965) → finding"
    back: |
      Children who saw the model punished imitated less, but all children reproduced the acts when offered a reward: consequences affected performance, not learning.
    topic_code: "3.9"
  - front: "Learning versus performance → distinction"
    back: |
      A behavior can be learned through observation and stored without being shown; whether it is performed depends on expected consequences.
    topic_code: "3.9"
  - front: "Vicarious reinforcement → definition"
    back: |
      Seeing a model rewarded for a behavior, which makes the observer more likely to imitate it.
    topic_code: "3.9"
  - front: "Vicarious punishment → definition"
    back: |
      Seeing a model punished for a behavior, which makes the observer less likely to imitate it.
    topic_code: "3.9"
  - front: "Bandura's four processes of modeling → list"
    back: |
      Attention (noticing the model), retention (remembering the behavior), reproduction (being able to perform it), motivation (having a reason to).
    topic_code: "3.9"
  - front: "Which models get imitated most → characteristics"
    back: |
      Models who are similar to the observer, admired, powerful or seen being rewarded.
    topic_code: "3.9"
  - front: "Prosocial modeling → definition"
    back: |
      Modeling of helpful behavior such as sharing and comforting; most effective when the model's actions match their words.
    topic_code: "3.9"
  - front: "Antisocial modeling → definition"
    back: |
      Modeling of harmful behavior such as aggression, which can help explain aggression running in families.
    topic_code: "3.9"
  - front: "“Do as I say, not as I do” → research finding"
    back: |
      When a model's words and actions conflict, children tend to imitate the actions.
    topic_code: "3.9"
  - front: "Media violence research → what the designs show"
    back: |
      Lab experiments show short-term increases in aggressive thoughts and behavior; long-term evidence is mostly correlational and the effect size is debated.
    topic_code: "3.9"
  - front: "Insight learning → definition"
    back: |
      A sudden realization of a problem's solution after a period without progress, rather than gradual trial and error.
    topic_code: "3.9"
  - front: "Köhler's chimpanzees → finding"
    back: |
      Chimpanzees such as Sultan suddenly joined sticks or stacked boxes to reach fruit, which Köhler interpreted as insight.
    topic_code: "3.9"
  - front: "Latent learning → definition"
    back: |
      Learning that occurs without reinforcement and stays hidden until there is a reason to show it.
    topic_code: "3.9"
  - front: "Tolman and Honzik (1930) → procedure and finding"
    back: |
      Rats that explored a maze unrewarded for 10 days and then found food made far fewer errors almost immediately, matching always-rewarded rats.
    topic_code: "3.9"
  - front: "Cognitive map → definition"
    back: |
      A mental representation of the layout of an environment, such as the map Tolman's rats formed of a maze.
    topic_code: "3.9"
  - front: "Latent learning → why it challenged behaviorism"
    back: |
      Learning happened without reinforcement and was not visible in behavior, so learning cannot be defined only as reinforced changes in behavior.
    topic_code: "3.9"
  - front: "Learned helplessness → as a cognitive factor"
    back: |
      An expectation that one's actions do not affect outcomes, which reduces later attempts to learn or escape.
    topic_code: "3.9"
  - front: "Mirror neurons → definition"
    back: |
      Neurons, first recorded in the premotor cortex of macaque monkeys, that fire both when acting and when watching another do the same action.
    topic_code: "3.9"
  - front: "Mirror neurons → current status"
    back: |
      Mirroring activity is well documented; claims that mirror neurons explain human imitation, empathy or language are debated.
    topic_code: "3.9"
  - front: "Amygdala → role in learning"
    back: |
      Central to learning fear, such as conditioned fear of a stimulus paired with something painful or frightening.
    topic_code: "3.9"
  - front: "Cerebellum → role in learning"
    back: |
      Essential for simple motor conditioning such as eyeblink conditioning, and for learning timed movements.
    topic_code: "3.9"
  - front: "Hippocampus → role in learning"
    back: |
      Supports learning places and facts, including forming cognitive maps of the environment.
    topic_code: "3.9"
  - front: "Dopamine prediction signal → what it does"
    back: |
      Dopamine neurons fire more when a reward is better than expected and less when an expected reward fails to arrive, helping the brain learn what predicts reward.
    topic_code: "3.9"
  - front: "Long-term potentiation → definition"
    back: |
      A lasting strengthening of a synapse after repeated stimulation; a leading candidate for the cellular basis of learning and memory.
    topic_code: "3.9"
  - front: "Classical, operant and observational learning → what is learned"
    back: |
      Classical: a link between two stimuli. Operant: a link between a behavior and its consequence. Observational: a behavior seen in a model.
    topic_code: "3.9"
  - front: "Classical, operant and observational learning → key figures"
    back: |
      Classical: Pavlov and Watson. Operant: Thorndike and Skinner. Observational: Bandura.
    topic_code: "3.9"
  - front: "Labeling a learning scenario → routine"
    back: |
      Automatic response to a cue: classical. Voluntary behavior changed by its own consequence: operant. Copying without prior reinforcement: observational. Sudden or hidden learning: insight or latent.
    topic_code: "3.9"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 3.9: observational learning, the Bobo doll
    studies, insight and latent learning, mirror neurons and the brain in learning, comparing kinds of
    learning), with 7 questions (32%) reviewing weeks 15–19 (gender typing, parenting, classical and operant
    conditioning) and Unit 1 (the amygdala). Opens with a shared-context set on one hypothetical study.
    Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical prosocial modeling experiment (3.9)
    - slug: appsych-u03-w20-q01
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 2.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. Ninety 6-year-olds were randomly assigned to watch one of three short videos. In the first, an adult gave half of her 10 stickers to a child who had none, and another adult praised her warmly. In the second, the adult gave away half her stickers and nothing else happened. In the third, the adult sorted stickers with no other child present. Each child then received 10 stickers and was told they could put any number in an envelope for a child who had none. The number donated was recorded.

        | Video | Mean stickers donated (out of 10) | Standard deviation |
        |---|---|---|
        | Sharing model, praised | 4.8 | 1.9 |
        | Sharing model, no consequence | 3.6 | 2.0 |
        | No sharing shown | 1.9 | 1.7 |
      prompt: |
        Which research method was used, and what was the independent variable?
      options:
        - "An experiment; the video each child watched"
        - "An experiment; the number of stickers donated"
        - "A correlational study; the child's age"
        - "A case study; the adult's praise"
      option_explanations:
        - |
          Correct. Children were randomly assigned to three video conditions, the manipulated independent variable.
        - |
          The number of stickers donated was measured as the outcome, so it is the dependent variable.
        - |
          Children were randomly assigned to conditions, so this is an experiment, and all were 6 years old.
        - |
          A case study examines one person in depth; this compared 90 children across three conditions.
      answer: 0
    - slug: appsych-u03-w20-q02
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. Ninety 6-year-olds were randomly assigned to watch one of three short videos. In the first, an adult gave half of her 10 stickers to a child who had none, and another adult praised her warmly. In the second, the adult gave away half her stickers and nothing else happened. In the third, the adult sorted stickers with no other child present. Each child then received 10 stickers and was told they could put any number in an envelope for a child who had none. The number donated was recorded.

        | Video | Mean stickers donated (out of 10) | Standard deviation |
        |---|---|---|
        | Sharing model, praised | 4.8 | 1.9 |
        | Sharing model, no consequence | 3.6 | 2.0 |
        | No sharing shown | 1.9 | 1.7 |
      prompt: |
        The difference between the two sharing-model groups (4.8 versus 3.6) best illustrates
      options:
        - "latent learning"
        - "insight learning"
        - "vicarious reinforcement"
        - "negative reinforcement"
      option_explanations:
        - |
          Latent learning is learning without reinforcement that stays hidden; the comparison here is about seeing a model rewarded.
        - |
          Insight is a sudden solution to a problem; sharing stickers is not a problem the children had to solve.
        - |
          Correct. Children who saw the model praised donated more, showing that observing a model's reward increases imitation.
        - |
          Negative reinforcement removes an aversive stimulus from the learner; these children received nothing themselves.
      answer: 2
    - slug: appsych-u03-w20-q03
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 2.C"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. Ninety 6-year-olds were randomly assigned to watch one of three short videos. In the first, an adult gave half of her 10 stickers to a child who had none, and another adult praised her warmly. In the second, the adult gave away half her stickers and nothing else happened. In the third, the adult sorted stickers with no other child present. Each child then received 10 stickers and was told they could put any number in an envelope for a child who had none. The number donated was recorded.

        | Video | Mean stickers donated (out of 10) | Standard deviation |
        |---|---|---|
        | Sharing model, praised | 4.8 | 1.9 |
        | Sharing model, no consequence | 3.6 | 2.0 |
        | No sharing shown | 1.9 | 1.7 |
      prompt: |
        The team wonders whether children in the second group learned the sharing behavior as well as the first group but simply chose not to show it. Which added step would test this?
      options:
        - "Ask parents how generous each child usually is."
        - "Afterward, offer every child a small prize for showing exactly what the adult in the video did."
        - "Repeat the study with older children."
        - "Report the median number of stickers instead of the mean."
      option_explanations:
        - |
          Parent reports measure general generosity, not whether the child learned the specific behavior in the video.
        - |
          Correct. As in Bandura's 1965 follow-up, an incentive to reproduce the behavior separates what was learned from what was performed.
        - |
          Changing the age group addresses generalizability, not the difference between learning and performance.
        - |
          A different summary statistic describes the same behavior and cannot reveal hidden learning.
      answer: 1
    - slug: appsych-u03-w20-q04
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 1.A"
      points: 1
      prompt: |
        What was the main finding of Bandura's 1961 Bobo doll experiment?
      options:
        - "Children who were rewarded for hitting the doll hit it more often."
        - "Children became less aggressive after watching an aggressive adult, because they released their anger."
        - "Children imitated aggression only after the adult was rewarded."
        - "Children who watched an aggressive adult model imitated the model's specific aggressive acts more than other children."
      option_explanations:
        - |
          The children were not rewarded for hitting the doll; they imitated what they had watched.
        - |
          The results were the opposite: watching aggression increased aggression rather than releasing it.
        - |
          In the 1961 study the model received no reward; the effect of seeing consequences was tested in a later study.
        - |
          Correct. Children exposed to the aggressive model copied its particular actions and words, showing learning by observation.
      answer: 3
    - slug: appsych-u03-w20-q05
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 1.A"
      points: 1
      prompt: |
        Ji-woo rides through a new neighborhood as a passenger for weeks without paying attention to directions. When a road closes on her first day driving, she finds a side route right away. Which concept best explains this?
      options:
        - "Latent learning"
        - "Shaping"
        - "Vicarious punishment"
        - "Stimulus discrimination"
      option_explanations:
        - |
          Correct. She formed a cognitive map without reinforcement, and the learning showed only when she needed it.
        - |
          Shaping reinforces successive approximations; no one reinforced her for learning the streets.
        - |
          Vicarious punishment is seeing a model punished; no model or punishment is involved.
        - |
          Discrimination is responding to one stimulus but not similar ones; the point here is hidden knowledge of the layout.
      answer: 0
    - slug: appsych-u03-w20-q06
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 1.A"
      points: 1
      prompt: |
        After an hour of failed attempts, a student stops working on a puzzle and goes for a walk. Halfway down the street, the solution suddenly comes to her. Which kind of learning is this?
      options:
        - "Operant conditioning"
        - "Insight learning"
        - "Classical conditioning"
        - "Observational learning"
      option_explanations:
        - |
          Operant conditioning strengthens behaviors through consequences; the solution appeared without any reinforced trials.
        - |
          Correct. A sudden reorganization of a problem that produces the solution, after no gradual progress, is insight.
        - |
          Classical conditioning pairs two stimuli; no stimulus pairing is involved.
        - |
          No model was watched, so observational learning does not apply.
      answer: 1
    - slug: appsych-u03-w20-q07
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 4.B"
      points: 1
      prompt: |
        Which statement about mirror neurons is best supported by current evidence?
      options:
        - "Mirror neurons have been proven to be the cause of human empathy."
        - "Mirror neurons exist only in humans."
        - "Neurons that fire both when acting and when watching the same action have been recorded in monkeys, and their role in human abilities is debated."
        - "Mirror neurons were discovered in the cerebellum of rats."
      option_explanations:
        - |
          Links to empathy have been proposed, but the claim that mirror neurons cause empathy is not established.
        - |
          They were first recorded in macaque monkeys, and similar mirroring activity has been measured in humans.
        - |
          Correct. Single-neuron recordings in macaques showed mirroring, while claims about imitation, empathy and language in humans remain debated.
        - |
          They were first recorded in the premotor cortex of macaque monkeys, not the cerebellum of rats.
      answer: 2
    - slug: appsych-u03-w20-q08
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 1.A"
      points: 1
      prompt: |
        A 4-year-old watches her father juggle three balls, remembers exactly what he did and wants to try, but her hands cannot yet catch quickly enough. Which of Bandura's processes is missing?
      options:
        - "Attention"
        - "Retention"
        - "Motivation"
        - "Reproduction"
      option_explanations:
        - |
          She watched closely, so attention to the model was present.
        - |
          She remembers what he did, so retention is present.
        - |
          She wants to try, so motivation is present.
        - |
          Correct. Reproduction requires the physical ability to perform the behavior, which she does not yet have.
      answer: 3
    - slug: appsych-u03-w20-q09
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 1.A"
      points: 1
      prompt: |
        A boy who has never been rewarded for fixing anything watches his grandmother fix a leaky faucet and later fixes one himself. Which kind of learning explains his first attempt?
      options:
        - "Observational learning"
        - "Classical conditioning"
        - "Operant conditioning through shaping"
        - "Higher-order conditioning"
      option_explanations:
        - |
          Correct. He copied a behavior he watched a model perform, without having been reinforced for it first.
        - |
          Classical conditioning links two stimuli and produces automatic responses, not a learned skill like fixing a faucet.
        - |
          Shaping requires reinforcing successive approximations; he had never been reinforced for fixing things.
        - |
          Higher-order conditioning builds a new conditioned stimulus from an established one, unrelated to imitating a skill.
      answer: 0
    - slug: appsych-u03-w20-q10
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 2.D"
      points: 1
      prompt: |
        A hypothetical survey of 2,000 teenagers finds that hours per week of violent video games correlate r = +0.18 with self-reported aggressive acts. Which conclusion is most appropriate?
      options:
        - "Violent games cause teenagers to become much more aggressive."
        - "There is a weak positive association, and the design cannot show which variable causes the other."
        - "There is no relationship, because 0.18 is less than 0.5."
        - "Aggressive teenagers are proven to choose violent games."
      option_explanations:
        - |
          A correlational survey cannot establish causation, and 0.18 is a weak relationship, not a large one.
        - |
          Correct. The correlation is positive and weak, and without random assignment the direction of influence and third variables remain open.
        - |
          A correlation of 0.18 is weak but not zero; it shows a small positive association.
        - |
          Reverse causation is one possibility, but a correlation cannot prove any particular causal direction.
      answer: 1
    - slug: appsych-u03-w20-q11
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 1
      prompt: |
        A teacher gives pop quizzes at unpredictable times, so students review a little every day. Which reinforcement schedule does studying fall under?
      options:
        - "Fixed ratio"
        - "Variable ratio"
        - "Variable interval"
        - "Fixed interval"
      option_explanations:
        - |
          A fixed ratio rewards after a set number of responses; the quizzes depend on time, not on how much students study.
        - |
          A variable ratio rewards after an unpredictable number of responses; here the timing is what is unpredictable.
        - |
          Correct. Reinforcement depends on the passage of an unpredictable amount of time, which produces slow, steady responding.
        - |
          A fixed interval would mean quizzes at predictable times, which produces cramming just before them.
      answer: 2
    - slug: appsych-u03-w20-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A"
      points: 1
      prompt: |
        A person with damage to a structure deep in both temporal lobes no longer shows conditioned fear to a tone that was paired with a loud noise. Which structure was most likely damaged?
      options:
        - "The occipital lobe"
        - "Broca's area"
        - "The thalamus"
        - "The amygdala"
      option_explanations:
        - |
          The occipital lobe processes vision and is at the back of the brain, not deep in the temporal lobes.
        - |
          Broca's area is in the frontal lobe and supports speech production, not fear learning.
        - |
          The thalamus relays sensory information; it is not the key structure for learning fear.
        - |
          Correct. The amygdala, in the limbic system within the temporal lobes, is central to fear and to learning conditioned fear.
      answer: 3
    - slug: appsych-u03-w20-q13
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        Whenever a family's dog hears the jingle of its leash, it runs to the door wagging, because the jingle has always come just before walks. The jingle is the
      options:
        - "conditioned stimulus"
        - "unconditioned stimulus"
        - "unconditioned response"
        - "conditioned response"
      option_explanations:
        - |
          Correct. The jingle was once neutral and now triggers excitement because it reliably predicts walks.
        - |
          The walk, not the jingle, naturally produces excitement without learning, so it is the unconditioned stimulus.
        - |
          The jingle is a stimulus; the unconditioned response is the dog's natural excitement at a walk.
        - |
          The conditioned response is the excitement at the jingle; the jingle itself is the stimulus.
      answer: 0
    - slug: appsych-u03-w20-q14
      type: multi_select
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 4.B"
      points: 2
      partial_credit: true
      prompt: |
        Which findings challenged the strict behaviorist view that learning is only a change in behavior produced by reinforcement? Select all that apply.
      options:
        - "Rats that explored a maze without food made few errors as soon as food was introduced."
        - "Children imitated an aggressive model without being reinforced themselves."
        - "Pigeons pecked faster on a variable ratio schedule than on a fixed interval schedule."
        - "Chimpanzees suddenly solved a reaching problem after a pause, rather than by gradual trial and error."
      option_explanations:
        - |
          Correct. Latent learning shows learning can occur without reinforcement and stay hidden until needed.
        - |
          Correct. Observational learning occurred without direct reinforcement of the children.
        - |
          Schedule effects on response rate are a central finding of operant conditioning and fit the behaviorist view.
        - |
          Correct. Insight suggests a cognitive reorganization of the problem rather than gradual reinforcement of responses.
      answer: [0, 1, 3]
    - slug: appsych-u03-w20-q15
      type: multi_select
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which scenarios involve a variable schedule of reinforcement? Select all that apply.
      options:
        - "A fisher catches a fish after an unpredictable number of casts."
        - "A factory worker is paid for every 50 parts assembled."
        - "A person refreshes a social media page, and new posts appear at unpredictable times."
        - "A salaried employee is paid every two weeks."
      option_explanations:
        - |
          Correct. Catches depend on an unpredictable number of casts, a variable ratio schedule.
        - |
          Pay after every 50 parts is a fixed ratio schedule: the number is set.
        - |
          Correct. New posts reward the first refresh after an unpredictable time, a variable interval schedule.
        - |
          Pay every two weeks follows a set time, so it is fixed, not variable.
      answer: [0, 2]
    - slug: appsych-u03-w20-q16
      type: true_false
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 1.A"
      points: 1
      prompt: |
        True or false: In Bandura's 1965 follow-up study, children who saw the aggressive model punished had not learned the aggressive behaviors.
      answer: false
      explanation: |
        False. They imitated less at first, but when offered a reward to show what the model did, they reproduced the aggressive acts as well as the other children. Seeing punishment affected performance, not learning.
    - slug: appsych-u03-w20-q17
      type: true_false
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 1.A"
      points: 1
      prompt: |
        True or false: Social learning theory explains gender typing partly through children's imitation of same-gender models and reinforcement for gender-typed behavior.
      answer: true
      explanation: |
        True. Social learning theory holds that children learn gender-typed behavior by observing and imitating models and by being reinforced or discouraged for particular behaviors.
    - slug: appsych-u03-w20-q18
      type: fill_blank
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 1.A"
      points: 1
      prompt: |
        Tolman proposed that his rats had formed a cognitive ____, a mental representation of the maze's layout.
      answer: ["map", "maps"]
      explanation: |
        A cognitive map is a mental representation of an environment's layout; it let the unrewarded rats perform well as soon as reward appeared.
    - slug: appsych-u03-w20-q19
      type: fill_blank
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 1
      prompt: |
        Teaching a dog to roll over by reinforcing it first for lying down, then for rolling onto its side, then for a full roll is called ____.
      answer: ["shaping"]
      explanation: |
        Shaping reinforces successive approximations of a target behavior until the full behavior appears.
    - slug: appsych-u03-w20-q20
      type: short_answer
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 1.A"
      points: 3
      prompt: |
        Identify the kind of learning (classical conditioning, operant conditioning or observational learning) in each scenario, and explain your choice.

        (a) After watching a classmate get laughs for a silly dance, Omar does the same dance at a party.
        (b) Every time Omar's phone plays a certain ringtone, it is his best friend calling, and the ringtone now makes him smile.
        (c) Omar's grandmother pays him $2 each time he reads a chapter, and he reads more often.
      answer: |
        (a) Observational learning: he imitated a model he saw being reinforced (vicarious reinforcement), without being reinforced himself first.
        (b) Classical conditioning: the ringtone (CS) was paired with calls from his friend (US), so it now triggers an automatic happy response (CR).
        (c) Operant conditioning: a voluntary behavior (reading) increases because it is followed by a reward (positive reinforcement).
      explanation: |
        Three points, one per part. Each needs the correct kind of learning AND a reason (model; stimulus pairing with an automatic response; consequence of a voluntary behavior).
    - slug: appsych-u03-w20-q21
      type: short_answer
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skills 1.A and 2.D"
      points: 3
      prompt: |
        A hypothetical survey finds that children whose parents often use spanking show more aggression toward peers.

        (a) Use observational learning to explain one way spanking could increase children's aggression.
        (b) Identify the parenting style most associated with frequent harsh punishment and low warmth.
        (c) Explain one reason the survey cannot show that spanking causes aggression.
      answer: |
        (a) Parents who hit model aggression as a way to handle conflict, and children may imitate the model with peers.
        (b) Authoritarian.
        (c) It is correlational: aggressive children may provoke more spanking (reverse causation), or a third variable such as family stress could cause both.
      explanation: |
        Three points, one per part. (a) the parent as a model whose aggression is imitated. (b) authoritarian. (c) reverse causation or a named third variable, or the lack of random assignment.
    - slug: appsych-u03-w20-q22
      type: long_answer
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skills 2.A, 2.B, 3.C and 4.B"
      points: 6
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 60 adults who had never played chess. Half were randomly assigned to watch 30 minutes of video of an expert explaining and playing chess openings; the other half watched 30 minutes of a nature documentary. All participants were told only that the study was about "attention to video." Afterward, each played five practice positions against a computer, and an expert who did not know the group assignments scored each player's moves from 0 to 50. The chess-video group averaged 34 (SD = 6) and the documentary group averaged 22 (SD = 7); the difference was statistically significant (p under 0.001). Participants were told the real purpose at the end and could withdraw their data.
      prompt: |
        (A) Identify the research method used.
        (B) State the operational definition of chess skill.
        (C) Describe what the means and the p-value show.
        (D) Identify one ethical issue in the procedure and how it was handled.
        (E) Explain one reason the findings may not generalize.
        (F) Explain how the results support observational learning, and identify which of Bandura's four processes the scoring task required.
      answer: |
        (A) An experiment: participants were randomly assigned to watch the chess video or the documentary.
        (B) The expert's 0 to 50 score of each player's moves on five practice positions against a computer.
        (C) The chess-video group scored 12 points higher on average (34 versus 22), about two standard deviations apart, and the p-value shows a difference this large would be very unlikely by chance.
        (D) Deception about the study's purpose (it was described as about attention); it was handled by debriefing at the end and the option to withdraw data.
        (E) Only 60 adult volunteers who had never played chess, tested right after the video, so results may not apply to children, other skills or long-term retention.
        (F) People who watched a skilled model play scored higher without practicing or being reinforced themselves, so they learned by observation. The task required retention (remembering the moves) and reproduction (performing them on the board).
      explanation: |
        Six points. (A) 1 point: experiment, with random assignment noted or implied. (B) 1 point: the 0–50 expert score on the five positions. (C) 1 point: higher mean for the chess-video group AND the significance interpreted as unlikely to be due to chance. (D) 1 point: deception with debriefing (or the right to withdraw data). (E) 1 point: a sampling or timing limit tied to the study. (F) 1 point: links higher scores to learning from a model without direct reinforcement AND names retention or reproduction.
