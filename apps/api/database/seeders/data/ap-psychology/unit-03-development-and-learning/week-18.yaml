week: 18
unit: 3
title: Classical Conditioning
topics: ["3.7"]
guide: guides/week-18.md
guide_description: |
  Learning, habituation and associative learning; Pavlov's research and the neutral, unconditioned and
  conditioned stimuli and responses, with a three-question method for labeling any scenario; acquisition,
  extinction, spontaneous recovery, generalization, discrimination and higher-order conditioning; Watson and
  Rayner's Little Albert study and its ethical problems; counterconditioning and aversive conditioning; taste
  aversion, biological preparedness and the role of prediction; classical conditioning in advertising, fear,
  drug cues and emotion. Worked examples: a fear of the dentist's drill labeled step by step, and a
  hypothetical eyeblink conditioning data set read as acquisition, extinction and spontaneous recovery.
flashcards_description: |
  30 cards on learning and habituation, the elements of classical conditioning, its processes, Pavlov, Little
  Albert, counterconditioning, taste aversion, biological preparedness, prediction and everyday examples.

flashcards:
  - front: "Learning → definition"
    back: |
      A relatively lasting change in behavior or knowledge due to experience, not to maturation, fatigue or injury.
    topic_code: "3.7"
  - front: "Habituation → definition"
    back: |
      Non-associative learning: a decrease in response to a stimulus repeated without consequence, like ceasing to notice a ticking clock.
    topic_code: "3.7"
  - front: "Associative learning → two main kinds"
    back: |
      Classical conditioning (linking two stimuli) and operant conditioning (linking a behavior with its consequence).
    topic_code: "3.7"
  - front: "Classical conditioning → definition"
    back: |
      Learning in which a neutral stimulus, after pairing with a stimulus that naturally triggers a response, comes to trigger a similar response.
    topic_code: "3.7"
  - front: "Unconditioned stimulus (US) → definition"
    back: |
      A stimulus that triggers a response naturally, without learning, such as food in the mouth or a loud noise.
    topic_code: "3.7"
  - front: "Unconditioned response (UR) → definition"
    back: |
      The automatic, unlearned response to the US, such as salivating to food or startling at a loud noise.
    topic_code: "3.7"
  - front: "Neutral stimulus (NS) → definition"
    back: |
      A stimulus that at first triggers no relevant response; it becomes the CS after pairing with the US.
    topic_code: "3.7"
  - front: "Conditioned stimulus (CS) → definition"
    back: |
      A formerly neutral stimulus that, after pairing with the US, triggers a learned response.
    topic_code: "3.7"
  - front: "Conditioned response (CR) → definition"
    back: |
      The learned response to the CS, usually similar to the UR.
    topic_code: "3.7"
  - front: "Labeling a conditioning scenario → three questions"
    back: |
      What causes a response without learning (US, and its UR)? What was paired with it and began neutral (NS, then CS)? What does the CS now trigger (CR)?
    topic_code: "3.7"
  - front: "Pavlov's research → what he did"
    back: |
      Around 1900 he repeatedly presented a neutral sound just before food; the dogs came to salivate at the sound alone.
    topic_code: "3.7"
  - front: "Acquisition → definition and best timing"
    back: |
      The initial learning of the CS-US association; it works best when the CS comes shortly before the US and reliably predicts it.
    topic_code: "3.7"
  - front: "Backward conditioning → why it works poorly"
    back: |
      When the US comes before the NS, the NS predicts nothing, so little or no conditioning occurs.
    topic_code: "3.7"
  - front: "Extinction (classical) → definition"
    back: |
      The weakening of the CR when the CS is presented repeatedly without the US.
    topic_code: "3.7"
  - front: "Spontaneous recovery → definition and meaning"
    back: |
      The reappearance of an extinguished CR after a rest period, showing that extinction suppresses rather than erases learning.
    topic_code: "3.7"
  - front: "Stimulus generalization → definition"
    back: |
      Responding to stimuli similar to the CS, such as fearing all dogs after being bitten by one.
    topic_code: "3.7"
  - front: "Stimulus discrimination → definition"
    back: |
      Learning to respond to the CS but not to similar stimuli that were never paired with the US.
    topic_code: "3.7"
  - front: "Higher-order conditioning → definition"
    back: |
      An established CS serves as a US for a new neutral stimulus, so the new stimulus also triggers the CR without the original US.
    topic_code: "3.7"
  - front: "Little Albert study → procedure and labels"
    back: |
      Watson and Rayner (1920) paired a white rat with a loud noise. US: noise; UR: fear; CS: rat; CR: fear of the rat, which generalized to furry objects.
    topic_code: "3.7"
  - front: "Little Albert study → ethical problems"
    back: |
      Deliberate distress to an infant, doubtful informed consent, no deconditioning before the study ended, no follow-up.
    topic_code: "3.7"
  - front: "Counterconditioning → definition"
    back: |
      Replacing an unwanted CR with an incompatible one, as when Mary Cover Jones paired a feared rabbit with enjoyable food.
    topic_code: "3.7"
  - front: "Aversive conditioning → definition"
    back: |
      Pairing cues for an unwanted behavior with an unpleasant state so the cues come to trigger aversion.
    topic_code: "3.7"
  - front: "Taste aversion → features"
    back: |
      Avoiding a food after illness that followed eating it; forms in one trial and with hours between taste and illness.
    topic_code: "3.7"
  - front: "Garcia and Koelling (1966) → finding"
    back: |
      Rats linked taste with nausea and light-and-sound cues with shock, but not taste with shock or light-and-sound with nausea.
    topic_code: "3.7"
  - front: "Biological preparedness → definition"
    back: |
      An evolved readiness to learn some associations easily (taste with illness, fear with snakes or heights).
    topic_code: "3.7"
  - front: "Prediction in classical conditioning → key finding"
    back: |
      Pairing alone is not enough: the CS must reliably predict the US. If the US happens just as often without the CS, little conditioning occurs.
    topic_code: "3.7"
  - front: "Advertising → classical conditioning example"
    back: |
      A product (NS) is paired with attractive images or music (US) so the product alone comes to evoke positive feelings (CR).
    topic_code: "3.7"
  - front: "Drug cues → classical conditioning example"
    back: |
      Places and objects associated with drug use become CSs that trigger craving, which helps explain relapse in familiar settings.
    topic_code: "3.7"
  - front: "Classical versus operant conditioning → difference"
    back: |
      Classical: two stimuli are associated and responses are automatic. Operant: a voluntary behavior is associated with its consequences.
    topic_code: "3.7"
  - front: "Error-spot → “The CS is salivation”"
    back: |
      Salivation is a response. The CS is the stimulus (the sound) that triggers it; salivation to the sound is the CR.
    topic_code: "3.7"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 3.7: the elements and processes of classical
    conditioning, Pavlov, Little Albert, taste aversion and everyday applications), with 8 questions (36%)
    reviewing weeks 14–17 (critical periods, Piaget, language, gender, temperament, parenting) and Units 1 and 2
    (the autonomic nervous system, implicit memory). Opens with a shared-context set on hypothetical conditioning
    data. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set: hypothetical eyeblink conditioning data (3.7)
    - slug: appsych-u03-w18-q01
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A lab played a tone just before a gentle puff of air to the eye of 20 rabbits, which made them blink. In each session, some trials presented the tone alone, and the lab recorded the percentage of tone-alone trials on which the rabbit blinked.

        | Session | Procedure | Blinks on tone-alone trials |
        |---|---|---|
        | 1 | Tone followed by air puff | 5% |
        | 5 | Tone followed by air puff | 50% |
        | 10 | Tone followed by air puff | 85% |
        | 11 | Tone only, no air puff | 70% |
        | 16 | Tone only, no air puff | 15% |
        | 17 (after a day's rest) | Tone only, no air puff | 45% |
      prompt: |
        What explains the rise from 15% to 45% in session 17?
      options:
        - "Generalization"
        - "Spontaneous recovery"
        - "Higher-order conditioning"
        - "Acquisition"
      option_explanations:
        - |
          Generalization is responding to stimuli similar to the CS; the same tone was used throughout.
        - |
          Correct. After extinction and a rest, the extinguished response partly returned, which is spontaneous recovery.
        - |
          Higher-order conditioning requires pairing a new stimulus with an established CS; no new stimulus was introduced.
        - |
          Acquisition requires pairing the tone with the air puff, but session 17 presented the tone alone.
      answer: 1
    - slug: appsych-u03-w18-q02
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 2.C"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A lab played a tone just before a gentle puff of air to the eye of 20 rabbits, which made them blink. In each session, some trials presented the tone alone, and the lab recorded the percentage of tone-alone trials on which the rabbit blinked.

        | Session | Procedure | Blinks on tone-alone trials |
        |---|---|---|
        | 1 | Tone followed by air puff | 5% |
        | 5 | Tone followed by air puff | 50% |
        | 10 | Tone followed by air puff | 85% |
        | 11 | Tone only, no air puff | 70% |
        | 16 | Tone only, no air puff | 15% |
        | 17 (after a day's rest) | Tone only, no air puff | 45% |
      prompt: |
        How is the conditioned response operationally defined in this study?
      options:
        - "The loudness of the tone in decibels"
        - "Whether the rabbit blinked when the air puff hit its eye"
        - "The number of sessions each rabbit completed"
        - "The percentage of tone-alone trials on which the rabbit blinked"
      option_explanations:
        - |
          Tone loudness describes the stimulus, not the learned response being measured.
        - |
          Blinking to the air puff is the unconditioned response, which needs no learning.
        - |
          Session number marks the phase of the procedure; it is not the measured response.
        - |
          Correct. The learned response is blinking to the tone alone, measured as a percentage of tone-alone trials.
      answer: 3
    - slug: appsych-u03-w18-q03
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A lab played a tone just before a gentle puff of air to the eye of 20 rabbits, which made them blink. In each session, some trials presented the tone alone, and the lab recorded the percentage of tone-alone trials on which the rabbit blinked.

        | Session | Procedure | Blinks on tone-alone trials |
        |---|---|---|
        | 1 | Tone followed by air puff | 5% |
        | 5 | Tone followed by air puff | 50% |
        | 10 | Tone followed by air puff | 85% |
        | 11 | Tone only, no air puff | 70% |
        | 16 | Tone only, no air puff | 15% |
        | 17 (after a day's rest) | Tone only, no air puff | 45% |
      prompt: |
        In this procedure, the puff of air is the
      options:
        - "unconditioned stimulus"
        - "conditioned stimulus"
        - "unconditioned response"
        - "neutral stimulus"
      option_explanations:
        - |
          Correct. The air puff makes the rabbit blink without any learning, so it is the unconditioned stimulus.
        - |
          The conditioned stimulus is the tone, which became meaningful only after pairing with the air puff.
        - |
          The unconditioned response is the blink to the air puff; the air puff itself is a stimulus.
        - |
          The air puff triggered blinking from the start, so it was never neutral.
      answer: 0
    - slug: appsych-u03-w18-q04
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        Before each vaccination, a nurse wipes a toddler's arm with an alcohol swab. After a few visits, the toddler starts crying as soon as she smells the swab. What is the conditioned stimulus?
      options:
        - "The pain of the injection"
        - "Crying at the injection"
        - "The smell of the alcohol swab"
        - "Crying at the smell"
      option_explanations:
        - |
          The pain triggers crying without learning, so it is the unconditioned stimulus.
        - |
          Crying at the injection is the unconditioned response, an unlearned reaction to pain.
        - |
          Correct. The smell was originally neutral and, after pairing with the painful injection, now triggers crying.
        - |
          Crying at the smell is the conditioned response, the learned reaction to the conditioned stimulus.
      answer: 2
    - slug: appsych-u03-w18-q05
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        After being stung by a bee, a boy becomes nervous around wasps, hornets and even large flies. Which process does this show?
      options:
        - "Stimulus generalization"
        - "Stimulus discrimination"
        - "Extinction"
        - "Habituation"
      option_explanations:
        - |
          Correct. The fear response has spread from the original stimulus to similar ones, which is generalization.
        - |
          Discrimination would mean responding only to bees and not to other insects.
        - |
          Extinction is the weakening of a response; his fear is spreading, not fading.
        - |
          Habituation is a decrease in response to a repeated harmless stimulus; his response is growing.
      answer: 0
    - slug: appsych-u03-w18-q06
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        A dog gets excited at the sound of its owner's car, which always comes before a walk, but stays calm when other cars pull into the driveway. This shows
      options:
        - "spontaneous recovery"
        - "stimulus discrimination"
        - "higher-order conditioning"
        - "backward conditioning"
      option_explanations:
        - |
          Spontaneous recovery is the return of an extinguished response after rest; nothing was extinguished here.
        - |
          Correct. The dog responds to the specific stimulus that predicts walks and not to similar sounds that do not.
        - |
          Higher-order conditioning uses an established CS to condition a new stimulus; only one stimulus is involved.
        - |
          Backward conditioning is presenting the US before the NS; here the car sound comes before the walk.
      answer: 1
    - slug: appsych-u03-w18-q07
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        Hours after eating a new curry, Priya had a stomach virus and vomited. She knows the virus caused it, but for years the smell of curry has made her feel queasy. Which concept best explains this?
      options:
        - "Higher-order conditioning"
        - "Habituation"
        - "Taste aversion, a biologically prepared association"
        - "Stimulus discrimination"
      option_explanations:
        - |
          Higher-order conditioning needs an established CS to condition a second stimulus; this is a single taste-illness pairing.
        - |
          Habituation would weaken her response with exposure; instead a strong response formed after one episode.
        - |
          Correct. Taste-illness associations form in one trial, over long delays and despite knowing the real cause, because of biological preparedness.
        - |
          Discrimination narrows a response to one stimulus; the issue here is how readily the aversion formed.
      answer: 2
    - slug: appsych-u03-w18-q08
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        A child has learned to feel anxious at the sound of the dentist's drill. Later, the dentist's office always plays the same song in the waiting room before the drill is heard, and the song alone starts to make the child anxious. Which process is this?
      options:
        - "Extinction"
        - "Counterconditioning"
        - "Spontaneous recovery"
        - "Higher-order conditioning"
      option_explanations:
        - |
          Extinction would weaken the anxiety; here anxiety spreads to a new stimulus.
        - |
          Counterconditioning replaces a fear response with a pleasant one, the reverse of what happened.
        - |
          Spontaneous recovery is the return of an extinguished response after rest; nothing was extinguished.
        - |
          Correct. The drill sound, already a CS, served like a US for the song, so the song became a new CS.
      answer: 3
    - slug: appsych-u03-w18-q09
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        In Watson and Rayner's study with Little Albert, what was the unconditioned response?
      options:
        - "Albert's fear and crying when the loud noise sounded"
        - "The white rat"
        - "The loud noise of a steel bar being struck"
        - "Albert's fear of the white rat after conditioning"
      option_explanations:
        - |
          Correct. Fear and crying at the sudden loud noise required no learning, so it is the unconditioned response.
        - |
          The white rat began as a neutral stimulus and became the conditioned stimulus.
        - |
          The loud noise is the unconditioned stimulus, the thing that naturally triggered fear.
        - |
          Fear of the rat was learned, so it is the conditioned response.
      answer: 0
    - slug: appsych-u03-w18-q10
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      prompt: |
        A man cannot form new long-term memories of events after a brain injury, yet in a conditioning task over several days he begins to blink at a tone that predicts an air puff, though he cannot remember the earlier sessions. What does this suggest?
      options:
        - "Classical conditioning depends on explicit, episodic memory."
        - "The man is faking his memory problem."
        - "Classical conditioning can be stored as implicit memory, separate from explicit memory."
        - "Conditioning occurs only in short-term memory."
      option_explanations:
        - |
          If conditioning depended on episodic memory, he could not have learned the blink without remembering the sessions.
        - |
          Learning without conscious recollection is a well-documented pattern, so faking is not the best explanation.
        - |
          Correct. Conditioned responses are a form of implicit (nondeclarative) memory that can be intact when explicit memory is impaired.
        - |
          The learning lasted across several days, so it was stored in long-term memory, not only short-term memory.
      answer: 2
    - slug: appsych-u03-w18-q11
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        Which parenting description fits the authoritarian style?
      options:
        - "Few rules, lots of warmth and freedom to decide"
        - "Strict rules enforced without explanation, with obedience expected"
        - "Clear rules explained with reasons, plus warmth and discussion"
        - "Little warmth and little supervision"
      option_explanations:
        - |
          Few rules with high warmth describes permissive parenting.
        - |
          Correct. Authoritarian parenting combines high demands with low warmth and little explanation.
        - |
          Rules explained with warmth and discussion describe authoritative parenting.
        - |
          Low warmth with little supervision describes uninvolved (neglectful) parenting.
      answer: 1
    - slug: appsych-u03-w18-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Skill 1.A"
      points: 1
      prompt: |
        When a person with a conditioned fear of elevators steps into one, her heart races, her breathing speeds up and her palms sweat. Which division of the nervous system produces these responses?
      options:
        - "The somatic nervous system"
        - "The parasympathetic nervous system"
        - "The central nervous system only"
        - "The sympathetic nervous system"
      option_explanations:
        - |
          The somatic nervous system controls voluntary skeletal muscles, not heart rate and sweating.
        - |
          The parasympathetic division calms the body, slowing the heart rather than speeding it.
        - |
          These responses are carried out by autonomic nerves outside the brain and spinal cord, not by the central nervous system alone.
        - |
          Correct. The sympathetic division of the autonomic nervous system produces fight-or-flight arousal such as a racing heart and sweating.
      answer: 3
    - slug: appsych-u03-w18-q13
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 1.A"
      points: 1
      prompt: |
        On a phone call, a 3-year-old nods in answer to her grandmother's question. In Piaget's terms, this reflects
      options:
        - "egocentrism"
        - "conservation"
        - "formal operational thought"
        - "accommodation"
      option_explanations:
        - |
          Correct. Assuming the grandmother can see her nod reflects preoperational egocentrism, difficulty taking another's point of view.
        - |
          Conservation concerns quantity under changes of shape and has nothing to do with this scenario.
        - |
          Formal operational thought is abstract reasoning that begins around adolescence.
        - |
          Accommodation is changing a schema; the child is using her own perspective without adjusting it.
      answer: 0
    - slug: appsych-u03-w18-q14
      type: multi_select
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which scenarios are examples of classical conditioning? Select all that apply.
      options:
        - "A cat runs to the kitchen at the sound of the can opener."
        - "A student studies harder after earning praise for a good grade."
        - "A man feels hungry when he sees the golden arches of a fast-food restaurant."
        - "A child cleans her room to avoid losing phone privileges."
        - "A woman feels calm when she smells the lotion her late grandmother used."
      option_explanations:
        - |
          Correct. The sound of the can opener has been paired with food, so it now triggers an anticipatory response.
        - |
          Studying more after praise is a voluntary behavior strengthened by its consequence: operant conditioning.
        - |
          Correct. The logo has been paired with food, so it alone triggers a hunger response.
        - |
          Cleaning to avoid losing a privilege is a behavior shaped by consequences: operant conditioning.
        - |
          Correct. The scent was paired with a comforting person, so it now triggers a calm emotional response.
      answer: [0, 2, 4]
    - slug: appsych-u03-w18-q15
      type: multi_select
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 2.B"
      points: 2
      partial_credit: true
      prompt: |
        Which features of Watson and Rayner's 1920 Little Albert study would violate modern ethical guidelines? Select all that apply.
      options:
        - "Deliberately causing fear and distress in an infant"
        - "Ending the study without removing the conditioned fear"
        - "Using a white rat as a stimulus"
        - "Uncertainty about whether the mother gave fully informed consent"
      option_explanations:
        - |
          Correct. Intentionally distressing an infant without a protective purpose fails the duty to minimize harm.
        - |
          Correct. Researchers today must leave participants no worse off; Albert was not deconditioned.
        - |
          Showing a child a tame animal is not itself unethical; the problem was pairing it with frightening noise.
        - |
          Correct. Informed consent from a parent or guardian is required for research with children.
      answer: [0, 1, 3]
    - slug: appsych-u03-w18-q16
      type: true_false
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        True or false: Extinction permanently erases a conditioned association.
      answer: false
      explanation: |
        False. An extinguished response can return after a rest (spontaneous recovery) and can be relearned faster than it was first learned, so extinction suppresses the response rather than erasing the association.
    - slug: appsych-u03-w18-q17
      type: true_false
      topic_code: "3.5"
      source: "Original item; CED Topic 3.5, Skill 4.B"
      points: 1
      prompt: |
        True or false: Errors such as "I runned" and "two foots" are evidence that young children learn grammar rules rather than only imitating adults.
      answer: true
      explanation: |
        True. Adults rarely say these forms, so children are not copying them. Overregularization shows children have extracted rules for past tense and plurals and are applying them to irregular words.
    - slug: appsych-u03-w18-q18
      type: fill_blank
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        A baby's characteristic emotional style, such as being easy, difficult or slow-to-warm-up, is called the baby's ____.
      answer: ["temperament", "temperaments"]
      explanation: |
        Temperament is a person's characteristic emotional reactivity and intensity, visible from infancy, partly heritable and moderately stable.
    - slug: appsych-u03-w18-q19
      type: fill_blank
      topic_code: "3.2"
      source: "Original item; CED Topic 3.2, Skill 1.A"
      points: 1
      prompt: |
        A fixed window of time in which a particular experience must occur for normal development, such as the brief window for imprinting in goslings, is called a ____ period.
      answer: ["critical"]
      explanation: |
        A critical period is a fixed window; a sensitive period is a window when learning is easiest but still possible later, which describes most human cases such as language.
    - slug: appsych-u03-w18-q20
      type: short_answer
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 3
      prompt: |
        A sports drink company runs ads in which its new bottle appears again and again alongside clips of cheering crowds and winning goals that make viewers feel excited.

        (a) Identify the unconditioned stimulus and the conditioned stimulus.
        (b) Identify the conditioned response.
        (c) Explain what would happen to viewers' response to the bottle if the company kept showing the bottle without the exciting clips, and name the process.
      answer: |
        (a) US: the exciting clips (cheering crowds, winning goals). CS: the drink bottle.
        (b) Feeling excited or positive when seeing the bottle alone.
        (c) The positive response to the bottle would gradually weaken because the bottle no longer predicts the exciting clips: extinction.
      explanation: |
        Three points, one per part. (a) both stimuli labeled correctly. (b) the excitement or positive feeling evoked by the bottle alone. (c) the response weakens, named as extinction.
    - slug: appsych-u03-w18-q21
      type: short_answer
      topic_code: "3.3"
      source: "Original item; CED Topic 3.3, Skill 1.A"
      points: 3
      prompt: |
        A 6-year-old boy refuses a purple backpack, saying, "Purple is for girls."

        (a) Explain how social learning theory could account for his belief.
        (b) Explain how gender schema theory could account for it.
        (c) Explain why this belief is an example of gender rather than sex.
      answer: |
        (a) He may have seen peers or media models teased or praised for color choices, or been discouraged himself, and imitated what was rewarded.
        (b) He has formed a gender schema that sorts colors by gender and, knowing he is a boy, rejects what his schema labels as for girls.
        (c) Color preferences are cultural expectations that differ across places and eras, not biological characteristics such as chromosomes or anatomy.
      explanation: |
        Three points, one per part. (a) modeling or reinforcement. (b) a mental framework organizing information by gender that guides his choices. (c) cultural rather than biological.
    - slug: appsych-u03-w18-q22
      type: long_answer
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skills 2.A, 2.B, 3.B and 4.B"
      points: 6
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 80 college students and randomly assigned them to two groups. Both groups saw 40 slides. In the paired group, each image of a new, unknown brand of sparkling water was followed immediately by a pleasant image (a sunset, a puppy, smiling friends). In the unpaired group, the same brand images and pleasant images were shown the same number of times but in a random order, never one right after the other. Participants were told the study was about memory for pictures. Afterward, each rated how much they liked the brand from 1 (dislike) to 7 (like very much). The paired group's mean was 5.4 (SD = 1.0); the unpaired group's mean was 4.3 (SD = 1.1); the difference was statistically significant (p = 0.002). All participants were then told the real purpose of the study.
      prompt: |
        (A) Identify the research method used, and the independent variable.
        (B) State the operational definition of liking the brand.
        (C) Explain what the statement "statistically significant (p = 0.002)" means for this result.
        (D) Identify one ethical issue raised by the procedure and how the researchers addressed it.
        (E) Explain one reason the findings may not generalize to all consumers.
        (F) Explain how the results support classical conditioning, labeling the US, CS and CR.
      answer: |
        (A) An experiment; the IV is whether brand images were paired with (immediately followed by) pleasant images or shown unpaired.
        (B) Each participant's rating of the brand on the 1 to 7 scale.
        (C) A difference as large as 5.4 versus 4.3 would be very unlikely (about 2 in 1,000) if the pairing had no effect, so the difference is unlikely to be due to chance.
        (D) Deception: participants were told the study was about memory; the researchers debriefed everyone afterward with the real purpose.
        (E) Only 80 college students were tested, who may differ in age and buying habits from other consumers, and a lab slideshow differs from real advertising.
        (F) The pleasant images (US) naturally trigger positive feelings (UR). When the brand (NS, becoming the CS) reliably came just before them, it came to evoke positive feelings itself (CR), so the paired group liked the brand more. Because both groups saw the same images equally often, the pairing, not mere exposure, explains the difference.
      explanation: |
        Six points. (A) 1 point: experiment AND paired versus unpaired presentation as the IV. (B) 1 point: the 1–7 liking rating. (C) 1 point: the difference is unlikely to be due to chance alone; saying it proves the effect is large earns 0. (D) 1 point: deception paired with debriefing. (E) 1 point: a sampling or setting limit tied to the study. (F) 1 point: correct US, CS and CR AND a link to the higher paired-group mean.
