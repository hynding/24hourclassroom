week: 19
unit: 3
title: Operant Conditioning
topics: ["3.8"]
guide: guides/week-19.md
guide_description: |
  Thorndike's puzzle boxes and the law of effect; Skinner's operant chamber; positive and negative
  reinforcement and punishment, with a two-question method for classifying any consequence; escape and
  avoidance; primary, secondary and generalized reinforcers and token economies; immediate reinforcement and
  delay discounting; shaping, chaining and discriminative stimuli; operant extinction, the extinction burst
  and spontaneous recovery; continuous and partial reinforcement and the fixed and variable ratio and
  interval schedules; the limits of punishment; instinctive drift, superstitious behavior and learned
  helplessness. Worked examples: classifying a pain reliever as negative reinforcement, and reading a
  hypothetical cumulative record for four schedules.
flashcards_description: |
  30 cards on the law of effect, the four kinds of consequence, reinforcer types, shaping and chaining,
  extinction, reinforcement schedules, punishment, instinctive drift, superstitious behavior and learned
  helplessness.

flashcards:
  - front: "Operant conditioning → definition"
    back: |
      Learning in which a voluntary behavior becomes more or less likely depending on its consequences.
    topic_code: "3.8"
  - front: "Law of effect → definition"
    back: |
      Thorndike's principle: behaviors followed by satisfying consequences become more likely; those followed by unpleasant consequences, less likely.
    topic_code: "3.8"
  - front: "Thorndike's puzzle boxes → finding"
    back: |
      Hungry cats escaped by chance at first, then faster over trials as the successful behavior was strengthened by its consequence.
    topic_code: "3.8"
  - front: "Operant chamber (Skinner box) → what it is"
    back: |
      A box in which an animal presses a bar or pecks a key for food or water while each response is recorded over time.
    topic_code: "3.8"
  - front: "Reinforcement versus punishment → defining difference"
    back: |
      Reinforcement increases the behavior it follows; punishment decreases it.
    topic_code: "3.8"
  - front: "Positive and negative (operant) → meaning"
    back: |
      Positive: a stimulus is added. Negative: a stimulus is removed. Neither means good or bad.
    topic_code: "3.8"
  - front: "Positive reinforcement → definition and example"
    back: |
      Adding a desirable stimulus to increase a behavior, such as praise after finishing homework.
    topic_code: "3.8"
  - front: "Negative reinforcement → definition and example"
    back: |
      Removing an aversive stimulus to increase a behavior, such as the seatbelt alarm stopping when you buckle up.
    topic_code: "3.8"
  - front: "Positive punishment → definition and example"
    back: |
      Adding an aversive stimulus to decrease a behavior, such as extra chores after breaking curfew.
    topic_code: "3.8"
  - front: "Negative punishment → definition and example"
    back: |
      Removing a desirable stimulus to decrease a behavior, such as losing phone time or a time-out from play.
    topic_code: "3.8"
  - front: "Escape versus avoidance learning → difference"
    back: |
      Escape: acting to end an aversive event already happening. Avoidance: acting to prevent it. Both are negative reinforcement.
    topic_code: "3.8"
  - front: "Primary reinforcer → definition"
    back: |
      A reinforcer that satisfies a biological need without learning, such as food, water or relief from pain.
    topic_code: "3.8"
  - front: "Secondary (conditioned) reinforcer → definition"
    back: |
      A reinforcer that gains power through association with primary reinforcers, such as praise, grades or a trainer's clicker.
    topic_code: "3.8"
  - front: "Generalized reinforcer → definition"
    back: |
      A secondary reinforcer linked with many primary reinforcers, such as money.
    topic_code: "3.8"
  - front: "Token economy → definition"
    back: |
      A system that gives tokens for target behaviors, which can later be exchanged for rewards; used in classrooms and treatment settings.
    topic_code: "3.8"
  - front: "Delay discounting → definition"
    back: |
      Valuing a reward less the longer one must wait for it, so a small reward now is often chosen over a larger one later.
    topic_code: "3.8"
  - front: "Shaping → definition"
    back: |
      Reinforcing successive approximations of a target behavior until the full behavior appears.
    topic_code: "3.8"
  - front: "Chaining → definition"
    back: |
      Linking several behaviors into a sequence, each step reinforced by the chance to do the next, ending in a reinforcer.
    topic_code: "3.8"
  - front: "Discriminative stimulus → definition"
    back: |
      A cue that signals when a behavior will be reinforced, such as a green light for a pigeon or an open sign on a store.
    topic_code: "3.8"
  - front: "Extinction burst → definition"
    back: |
      A temporary increase in a behavior when reinforcement first stops, before the behavior declines.
    topic_code: "3.8"
  - front: "Continuous versus partial reinforcement → effect on extinction"
    back: |
      Continuous reinforcement gives fast learning and fast extinction; partial reinforcement gives slower learning and much greater resistance to extinction.
    topic_code: "3.8"
  - front: "Fixed ratio schedule → rule and pattern"
    back: |
      Reinforcement after a set number of responses; high rate with a brief pause after each reinforcer.
    topic_code: "3.8"
  - front: "Variable ratio schedule → rule and pattern"
    back: |
      Reinforcement after an unpredictable number of responses; the highest, steadiest rate and the most resistance to extinction (slot machines).
    topic_code: "3.8"
  - front: "Fixed interval schedule → rule and pattern"
    back: |
      Reinforcement for the first response after a set time; responding speeds up as the time approaches, then drops (scalloped pattern).
    topic_code: "3.8"
  - front: "Variable interval schedule → rule and pattern"
    back: |
      Reinforcement for the first response after an unpredictable time; slow, steady responding (checking for messages).
    topic_code: "3.8"
  - front: "Punishment → main drawbacks"
    back: |
      It suppresses behavior without teaching an alternative, can create fear of the punisher, and physical punishment models aggression.
    topic_code: "3.8"
  - front: "Effective punishment → conditions"
    back: |
      Immediate, consistent and paired with reinforcement of a better behavior; mild negative punishment is generally preferred to harsh positive punishment.
    topic_code: "3.8"
  - front: "Instinctive drift → definition and example"
    back: |
      Trained animals drifting back toward instinctive behaviors; the Brelands' raccoons rubbed coins together instead of depositing them.
    topic_code: "3.8"
  - front: "Superstitious behavior (operant) → explanation"
    back: |
      A behavior strengthened by accidental reinforcement; Skinner's pigeons fed at fixed times developed rituals unrelated to the food.
    topic_code: "3.8"
  - front: "Learned helplessness → definition and study"
    back: |
      Passive giving-up after repeated uncontrollable aversive events; Seligman's dogs that could not escape shocks later failed to escape avoidable ones.
    topic_code: "3.8"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 3.8: reinforcement and punishment, reinforcer
    types, shaping, extinction, schedules, the limits of punishment, instinctive drift and learned
    helplessness), with 7 questions (32%) reviewing weeks 16–18 (scaffolding, language theories, ecological
    systems, classical conditioning) and Unit 1 (dopamine). Opens with a shared-context set on one hypothetical
    study. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set: a hypothetical reinforcement schedule study (3.8)
    - slug: appsych-u03-w19-q01
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. Forty pigeons were randomly assigned, 10 per group, to earn food by pecking a key on one of four schedules for 10 daily sessions. Then food was stopped completely (extinction), and the lab counted the pecks in the first hour without food.

        | Schedule | Mean pecks per hour in training | Mean pecks in the first hour of extinction |
        |---|---|---|
        | Continuous reinforcement | 1,100 | 120 |
        | Fixed ratio (every 20th peck) | 4,600 | 850 |
        | Fixed interval (first peck after 60 seconds) | 1,700 | 560 |
        | Variable ratio (on average every 20th peck) | 5,900 | 2,300 |
      prompt: |
        Which conclusion about resistance to extinction do the data support?
      options:
        - "Continuous reinforcement produced the most resistance to extinction."
        - "All four schedules were equally resistant to extinction."
        - "Interval schedules were more resistant to extinction than ratio schedules."
        - "The variable ratio schedule produced the most resistance to extinction."
      option_explanations:
        - |
          The continuous group pecked the least (120) once food stopped, so it was the least resistant to extinction.
        - |
          The extinction counts range from 120 to 2,300, so the schedules clearly differed.
        - |
          The fixed interval group (560) pecked less in extinction than both ratio groups (850 and 2,300).
        - |
          Correct. The variable ratio group kept pecking most (2,300) without food, because any peck might have been the one that paid.
      answer: 3
    - slug: appsych-u03-w19-q02
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. Forty pigeons were randomly assigned, 10 per group, to earn food by pecking a key on one of four schedules for 10 daily sessions. Then food was stopped completely (extinction), and the lab counted the pecks in the first hour without food.

        | Schedule | Mean pecks per hour in training | Mean pecks in the first hour of extinction |
        |---|---|---|
        | Continuous reinforcement | 1,100 | 120 |
        | Fixed ratio (every 20th peck) | 4,600 | 850 |
        | Fixed interval (first peck after 60 seconds) | 1,700 | 560 |
        | Variable ratio (on average every 20th peck) | 5,900 | 2,300 |
      prompt: |
        During training, which group would most likely peck slowly just after each reinforcer and then faster and faster as the next reinforcer became available?
      options:
        - "Continuous reinforcement"
        - "Fixed interval"
        - "Variable ratio"
        - "Fixed ratio"
      option_explanations:
        - |
          On continuous reinforcement every peck pays, so there is no reason to wait and then speed up.
        - |
          Correct. On a fixed interval, pecks early in the interval never pay, so responding pauses after food and speeds up near the end: a scalloped pattern.
        - |
          A variable ratio produces a high, steady rate because the next reinforcer could come with any peck.
        - |
          A fixed ratio gives a brief pause after reinforcement but then a high, steady burst, not a gradual speed-up tied to time.
      answer: 1
    - slug: appsych-u03-w19-q03
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 2.C"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. Forty pigeons were randomly assigned, 10 per group, to earn food by pecking a key on one of four schedules for 10 daily sessions. Then food was stopped completely (extinction), and the lab counted the pecks in the first hour without food.

        | Schedule | Mean pecks per hour in training | Mean pecks in the first hour of extinction |
        |---|---|---|
        | Continuous reinforcement | 1,100 | 120 |
        | Fixed ratio (every 20th peck) | 4,600 | 850 |
        | Fixed interval (first peck after 60 seconds) | 1,700 | 560 |
        | Variable ratio (on average every 20th peck) | 5,900 | 2,300 |
      prompt: |
        What is the independent variable in this study?
      options:
        - "The reinforcement schedule"
        - "The number of pecks in the first hour of extinction"
        - "The number of pigeons in each group"
        - "The number of training sessions"
      option_explanations:
        - |
          Correct. The researchers assigned each pigeon to a schedule, the variable they manipulated.
        - |
          Pecks during extinction are measured as an outcome, so they are a dependent variable.
        - |
          Group size (10 each) was held constant; it is not what the researchers varied.
        - |
          Every group had 10 sessions, so the number of sessions was a controlled variable.
      answer: 0
    - slug: appsych-u03-w19-q04
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 1
      prompt: |
        Whenever Dev starts his homework, his mother stops reminding him about it. Dev now starts his homework earlier each evening. Which consequence is at work?
      options:
        - "Positive reinforcement"
        - "Positive punishment"
        - "Negative reinforcement"
        - "Negative punishment"
      option_explanations:
        - |
          Nothing pleasant is added; the change is that an annoying stimulus is taken away.
        - |
          Punishment would decrease the behavior, but Dev starts his homework more readily.
        - |
          Correct. The behavior increases and an aversive stimulus (the reminders) is removed, which is negative reinforcement.
        - |
          Negative punishment removes something desirable to decrease a behavior; the behavior here increases.
      answer: 2
    - slug: appsych-u03-w19-q05
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 1
      prompt: |
        A coach benches a player for the next game after he argues with a referee, and the player stops arguing with referees. Which consequence is this?
      options:
        - "Negative punishment"
        - "Negative reinforcement"
        - "Positive punishment"
        - "Positive reinforcement"
      option_explanations:
        - |
          Correct. Something desirable (playing time) is removed and the behavior decreases, which is negative punishment.
        - |
          Negative reinforcement increases a behavior by removing something unpleasant; arguing decreased.
        - |
          Positive punishment adds an unpleasant stimulus; here a desirable privilege was taken away.
        - |
          Positive reinforcement adds something desirable to increase behavior; arguing decreased.
      answer: 0
    - slug: appsych-u03-w19-q06
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 1
      prompt: |
        A dog gets a squirt of water from a spray bottle each time it jumps on the couch, and it soon stops jumping on the couch. Which consequence is this?
      options:
        - "Negative reinforcement"
        - "Negative punishment"
        - "Positive reinforcement"
        - "Positive punishment"
      option_explanations:
        - |
          Negative reinforcement would increase a behavior; jumping on the couch decreased.
        - |
          Negative punishment removes something pleasant; here an unpleasant squirt is added.
        - |
          Positive reinforcement adds something pleasant to increase behavior; the squirt is unpleasant and the behavior decreased.
        - |
          Correct. An aversive stimulus is added and the behavior decreases, which is positive punishment.
      answer: 3
    - slug: appsych-u03-w19-q07
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 1
      prompt: |
        A speech therapist praises a child first for any sound starting with "s," then only for "sp," and finally only for the full word "spoon." Which technique is the therapist using?
      options:
        - "Chaining"
        - "Shaping"
        - "Counterconditioning"
        - "Higher-order conditioning"
      option_explanations:
        - |
          Chaining links separate behaviors into a sequence; here one behavior is built up gradually.
        - |
          Correct. Reinforcing successive approximations of a target behavior is shaping.
        - |
          Counterconditioning replaces an emotional response with an incompatible one; this teaches a new behavior.
        - |
          Higher-order conditioning pairs a new stimulus with an established CS; this uses reinforcement of behavior.
      answer: 1
    - slug: appsych-u03-w19-q08
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 1
      prompt: |
        In a classroom token economy, students earn stickers for finishing assignments and trade them for extra recess. The stickers are best described as
      options:
        - "primary reinforcers"
        - "discriminative stimuli"
        - "secondary (conditioned) reinforcers"
        - "negative reinforcers"
      option_explanations:
        - |
          Primary reinforcers meet biological needs without learning; stickers have value only because of what they buy.
        - |
          A discriminative stimulus signals when a behavior will be reinforced; the stickers are the reinforcers themselves.
        - |
          Correct. Stickers gain value through their link with rewards such as recess, which makes them secondary reinforcers.
        - |
          Negative reinforcement removes something aversive; stickers are added to increase a behavior.
      answer: 2
    - slug: appsych-u03-w19-q09
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 1
      prompt: |
        Pigs trained to carry wooden coins to a "piggy bank" began dropping the coins and rooting them along the ground with their snouts, which delayed their food. Which concept explains this?
      options:
        - "Instinctive drift"
        - "Learned helplessness"
        - "Spontaneous recovery"
        - "Stimulus generalization"
      option_explanations:
        - |
          Correct. Instinctive drift is the tendency of trained animals to revert to instinctive behaviors, such as rooting for food, even at the cost of reinforcement.
        - |
          Learned helplessness is passivity after uncontrollable aversive events; the pigs were active and not shocked.
        - |
          Spontaneous recovery is the return of an extinguished response after rest; rooting was never conditioned and extinguished.
        - |
          Generalization is responding to stimuli similar to a trained one; rooting is a different, instinctive behavior.
      answer: 0
    - slug: appsych-u03-w19-q10
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 1
      prompt: |
        Parents decide to stop giving their toddler a cookie whenever he whines. For the first few days, his whining becomes louder and more frequent before it finally fades. What is the temporary increase called?
      options:
        - "Spontaneous recovery"
        - "An extinction burst"
        - "Positive punishment"
        - "Shaping"
      option_explanations:
        - |
          Spontaneous recovery is the return of a response after a rest, not the surge when reinforcement first stops.
        - |
          Correct. When reinforcement stops, a behavior often briefly intensifies, an extinction burst, before it declines.
        - |
          No unpleasant stimulus is added; the parents are withholding a reinforcer.
        - |
          Shaping reinforces successive approximations; here reinforcement is being removed entirely.
      answer: 1
    - slug: appsych-u03-w19-q11
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        A trainer clicks a clicker every time she gives a dolphin a fish. After many pairings, the click alone makes the dolphin approach eagerly. In classical conditioning terms, the click is the
      options:
        - "unconditioned stimulus"
        - "unconditioned response"
        - "conditioned response"
        - "conditioned stimulus"
      option_explanations:
        - |
          The fish is the unconditioned stimulus; the click had no meaning before it was paired with fish.
        - |
          The click is a stimulus, not a response; the unconditioned response is the dolphin's reaction to fish.
        - |
          The conditioned response is the eager approach to the click; the click itself is a stimulus.
        - |
          Correct. The once-neutral click now triggers a learned response after pairing with fish, which also makes it a secondary reinforcer.
      answer: 3
    - slug: appsych-u03-w19-q12
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A"
      points: 1
      prompt: |
        Which neurotransmitter is most closely linked with the brain's reward pathways that are activated by reinforcers?
      options:
        - "Acetylcholine"
        - "GABA"
        - "Dopamine"
        - "Melatonin"
      option_explanations:
        - |
          Acetylcholine is most associated with muscle action and memory, not the reward pathways.
        - |
          GABA is the main inhibitory neurotransmitter and is not the key reward signal.
        - |
          Correct. Dopamine pathways signal reward and help strengthen behaviors that lead to better-than-expected outcomes.
        - |
          Melatonin is a hormone that regulates sleep, not a reward neurotransmitter.
      answer: 2
    - slug: appsych-u03-w19-q13
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A"
      points: 1
      prompt: |
        A mother's employer moves her to a night shift, so she is less available to help her son with homework. In Bronfenbrenner's theory, the workplace change is part of the son's
      options:
        - "exosystem"
        - "microsystem"
        - "mesosystem"
        - "macrosystem"
      option_explanations:
        - |
          Correct. The exosystem includes settings the child is not part of, such as a parent's workplace, that still affect the child.
        - |
          The microsystem is settings the child is directly in; the son does not take part in his mother's workplace.
        - |
          The mesosystem links two of the child's own settings, such as home and school.
        - |
          The macrosystem is broad cultural values and laws, not one employer's scheduling decision.
      answer: 0
    - slug: appsych-u03-w19-q14
      type: multi_select
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which scenarios are examples of negative reinforcement? Select all that apply.
      options:
        - "Taking an antacid to relieve heartburn, and taking it sooner next time"
        - "Losing driving privileges after a speeding ticket"
        - "Leaving for school early to avoid heavy traffic"
        - "Getting a bonus for selling the most cars"
        - "Putting on sunglasses to stop the glare, and wearing them more often"
      option_explanations:
        - |
          Correct. Removing an unpleasant stimulus (heartburn) increases the behavior of taking an antacid.
        - |
          Losing a privilege to decrease a behavior is negative punishment, not reinforcement.
        - |
          Correct. Avoiding an aversive event (traffic) strengthens leaving early: avoidance learning is negative reinforcement.
        - |
          A bonus adds something desirable, which is positive reinforcement.
        - |
          Correct. Removing glare strengthens the behavior of wearing sunglasses.
      answer: [0, 2, 4]
    - slug: appsych-u03-w19-q15
      type: multi_select
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 4.B"
      points: 2
      partial_credit: true
      prompt: |
        According to research on punishment, which practices make punishment more effective or reduce its drawbacks? Select all that apply.
      options:
        - "Delivering the consequence immediately after the behavior"
        - "Applying the consequence consistently every time"
        - "Using harsh physical punishment so the lesson sticks"
        - "Reinforcing a desirable alternative behavior at the same time"
      option_explanations:
        - |
          Correct. Immediate consequences are linked more clearly to the behavior that caused them.
        - |
          Correct. Inconsistent punishment acts like partial reinforcement of the misbehavior and is less effective.
        - |
          Harsh physical punishment is associated with fear, aggression and behavior problems and models aggression.
        - |
          Correct. Punishment alone does not teach what to do; reinforcing an alternative fills that gap.
      answer: [0, 1, 3]
    - slug: appsych-u03-w19-q16
      type: true_false
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 1
      prompt: |
        True or false: Negative reinforcement decreases the behavior it follows.
      answer: false
      explanation: |
        False. All reinforcement increases behavior. Negative reinforcement does so by removing an aversive stimulus; a consequence that decreases behavior is punishment.
    - slug: appsych-u03-w19-q17
      type: true_false
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        True or false: After a conditioned response has been extinguished, it can reappear after a rest period even without new pairings.
      answer: true
      explanation: |
        True. This is spontaneous recovery. It shows that extinction suppresses the conditioned response rather than erasing the original learning.
    - slug: appsych-u03-w19-q18
      type: fill_blank
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A"
      points: 1
      prompt: |
        Replacing a fear response to a stimulus with a relaxed, pleasant response, as Mary Cover Jones did with a boy who feared rabbits, is called ____.
      answer: ["counterconditioning", "counter-conditioning", "counter conditioning"]
      explanation: |
        Counterconditioning pairs the feared stimulus with something that triggers a response incompatible with fear, such as eating enjoyable food. It underlies exposure-based therapies.
    - slug: appsych-u03-w19-q19
      type: fill_blank
      topic_code: "3.4"
      source: "Original item; CED Topic 3.4, Skill 1.A"
      points: 1
      prompt: |
        In Vygotsky's theory, the temporary support an adult gives a child within the zone of proximal development, and gradually removes, is called ____.
      answer: ["scaffolding", "scaffold"]
      explanation: |
        Scaffolding (hints, modeling, breaking a task into steps) lets a child succeed at a task slightly beyond what the child can do alone, then fades as skill grows.
    - slug: appsych-u03-w19-q20
      type: short_answer
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A"
      points: 3
      prompt: |
        Identify the reinforcement schedule in each scenario, and explain your choice.

        (a) A farm worker is paid $5 for every 10 baskets of apples picked.
        (b) A student checks a website for concert tickets, which go on sale at unannounced times.
        (c) A person plays a scratch-off lottery ticket, which wins after an unpredictable number of tickets.
      answer: |
        (a) Fixed ratio: reinforcement comes after a set number of responses (10 baskets).
        (b) Variable interval: the first check after an unpredictable amount of time is reinforced, regardless of how many checks.
        (c) Variable ratio: reinforcement depends on the number of tickets played, and that number is unpredictable.
      explanation: |
        Three points, one per part. Each needs the correct schedule AND a reason that names number versus time and fixed versus unpredictable.
    - slug: appsych-u03-w19-q21
      type: short_answer
      topic_code: "3.5"
      source: "Original item; CED Topic 3.5, Skill 4.B"
      points: 3
      prompt: |
        B. F. Skinner argued that children learn language through reinforcement and imitation; Noam Chomsky argued that children have an inborn capacity for grammar.

        (a) Describe one observation that supports Skinner's view.
        (b) Describe one observation that supports Chomsky's view.
        (c) Explain the interactionist view that most researchers now hold.
      answer: |
        (a) Children learn the vocabulary and accent of the people around them, and parents' smiles and attention reinforce early words such as "mama."
        (b) Children produce overregularizations like "goed" that adults rarely say, and children everywhere pass through similar milestones quickly despite imperfect input.
        (c) Children have a biological readiness for language, but it develops through social interaction, such as infant-directed speech and conversation with caregivers.
      explanation: |
        Three points, one per part. (a) imitation or reinforcement evidence. (b) overregularization, universal milestones or rapid grammar learning. (c) biology and social experience combined.
    - slug: appsych-u03-w19-q22
      type: long_answer
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skills 2.A, 2.C, 3.B and 4.B"
      points: 6
      stimulus: |
        A hypothetical study, invented for this course. In one school district, 16 fourth-grade classrooms were randomly assigned to use a token economy (students earned points for finishing work and traded them for small privileges on Fridays) or to continue as usual for 8 weeks. In the final week, observers who did not know each class's condition recorded every student's minutes on task during a 40-minute work period. The token-economy classes averaged 31 minutes on task (SD = 5); the usual-practice classes averaged 26 minutes (SD = 6). Parents received a letter describing the study and could opt their child out of observation, and no student names were recorded.
      prompt: |
        (A) Identify the research method and the dependent variable.
        (B) State the operational definition of the dependent variable.
        (C) Describe what the means and standard deviations show.
        (D) Identify one ethical guideline the researchers followed.
        (E) Explain one reason the findings may not generalize.
        (F) Explain how operant conditioning accounts for the results, and describe one risk if the tokens were suddenly removed.
      answer: |
        (A) An experiment (classrooms randomly assigned to conditions); the dependent variable is time on task.
        (B) The number of minutes each student spent on task during a 40-minute work period in the final week, recorded by blind observers.
        (C) Token-economy classes averaged 5 more minutes on task than usual-practice classes; with standard deviations of about 5 to 6 minutes, the difference is roughly one standard deviation, a large difference, though the groups still overlap.
        (D) Parents were informed and could opt out, or confidentiality (no names recorded).
        (E) Only fourth graders in one district were studied for 8 weeks, so results may differ for other ages, schools or longer periods.
        (F) Tokens are secondary reinforcers delivered after finishing work, so working became more likely (positive reinforcement). If tokens were removed suddenly, on-task behavior could undergo extinction, possibly with an extinction burst first, unless it had come to be maintained by other reinforcers.
      explanation: |
        Six points. (A) 1 point: experiment AND time on task as the DV. (B) 1 point: minutes on task in the 40-minute period. (C) 1 point: higher mean for token classes with the spread taken into account (difference about one SD, or overlap noted). (D) 1 point: informed opt-out or confidentiality. (E) 1 point: a limit on population or duration tied to the study. (F) 1 point: secondary or positive reinforcement explains the increase AND extinction named as the risk.
