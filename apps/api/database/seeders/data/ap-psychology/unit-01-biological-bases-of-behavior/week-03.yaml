week: 3
unit: 1
title: Neurons, Neurotransmitters, Hormones and Drugs
topics: ["1.3"]
guide: guides/week-03.md
guide_description: |
  The neuron (dendrites, cell body, axon, myelin, terminal buttons) and glial cells; sensory neurons,
  interneurons and motor neurons in the reflex arc; neural firing (resting potential, threshold, depolarization,
  the action potential, the refractory period and the all-or-nothing principle) and how intensity is coded; the
  synapse, excitatory and inhibitory neurotransmitters and reuptake; acetylcholine, dopamine, serotonin,
  norepinephrine, glutamate, GABA, endorphins and substance P; multiple sclerosis and myasthenia gravis;
  hormones (adrenaline, leptin, ghrelin, melatonin, oxytocin); and psychoactive drugs as agonists, antagonists
  and reuptake inhibitors, with stimulants, depressants, hallucinogens and opioids, tolerance, withdrawal and
  addiction. Worked example: an invented double-blind caffeine and reaction-time experiment.
flashcards_description: |
  32 cards on the parts of a neuron, glial cells, the reflex arc, the action potential, neurotransmitters and
  their roles, multiple sclerosis and myasthenia gravis, hormones, and how psychoactive drugs work.

flashcards:
  - front: "Dendrites → function"
    back: |
      Branching fibers that receive messages from other neurons and carry them toward the cell body.
    topic_code: "1.3"
  - front: "Cell body (soma) → function"
    back: |
      Contains the nucleus, keeps the neuron alive and combines the incoming signals.
    topic_code: "1.3"
  - front: "Axon → function"
    back: |
      The long fiber that carries the action potential away from the cell body toward the terminal buttons.
    topic_code: "1.3"
  - front: "Myelin sheath → function"
    back: |
      Fatty insulation, made by glial cells, around many axons; it greatly speeds the action potential.
    topic_code: "1.3"
  - front: "Terminal buttons → function"
    back: |
      Knobs at the ends of the axon that release neurotransmitters into the synapse.
    topic_code: "1.3"
  - front: "Glial cells → roles"
    back: |
      Support neurons: supply nutrients, form myelin, remove debris and help guide connections.
    topic_code: "1.3"
  - front: "Synapse → definition"
    back: |
      The tiny gap between the axon terminal of a sending neuron and the dendrite or cell body of a receiving neuron.
    topic_code: "1.3"
  - front: "Sensory, motor and interneurons → jobs"
    back: |
      Sensory neurons carry input toward the CNS; interneurons inside the CNS connect and process; motor neurons carry commands out to muscles and glands.
    topic_code: "1.3"
  - front: "Reflex arc → sequence"
    back: |
      Receptor → sensory neuron → interneuron in the spinal cord → motor neuron → muscle; the brain is informed afterward.
    topic_code: "1.3"
  - front: "Resting potential → what it is"
    back: |
      The neuron's negative inside charge at rest (about −70 millivolts) relative to the outside.
    topic_code: "1.3"
  - front: "Threshold → definition"
    back: |
      The level of combined stimulation a neuron must reach to fire an action potential.
    topic_code: "1.3"
  - front: "Action potential → what happens"
    back: |
      Sodium channels open, positive ions rush in (depolarization), and the charge travels down the axon; potassium ions then flow out to restore the resting charge.
    topic_code: "1.3"
  - front: "Refractory period → definition"
    back: |
      The brief recovery period after an action potential during which the neuron cannot fire again.
    topic_code: "1.3"
  - front: "All-or-nothing principle → meaning"
    back: |
      A neuron fires at full strength or not at all; stimulus intensity is coded by firing rate and the number of neurons firing, not by action-potential size.
    topic_code: "1.3"
  - front: "Excitatory vs inhibitory neurotransmitter"
    back: |
      Excitatory makes the receiving neuron more likely to fire; inhibitory makes it less likely.
    topic_code: "1.3"
  - front: "Reuptake → definition"
    back: |
      The sending neuron reabsorbs excess neurotransmitter from the synapse, ending its effect.
    topic_code: "1.3"
  - front: "Acetylcholine → roles"
    back: |
      Triggers muscle contraction; supports attention and memory. Its neurons decline in Alzheimer's disease.
    topic_code: "1.3"
  - front: "Dopamine → roles"
    back: |
      Movement, motivation and reward. Too little is linked to Parkinson's disease; excess activity to schizophrenia.
    topic_code: "1.3"
  - front: "Serotonin → roles"
    back: |
      Mood, sleep and appetite; low activity is linked to depression.
    topic_code: "1.3"
  - front: "Glutamate vs GABA"
    back: |
      Glutamate is the brain's main excitatory neurotransmitter; GABA is its main inhibitory neurotransmitter.
    topic_code: "1.3"
  - front: "Endorphins and substance P → roles"
    back: |
      Substance P carries pain signals; endorphins are natural painkillers that dampen pain and create pleasure.
    topic_code: "1.3"
  - front: "Multiple sclerosis → cause of symptoms"
    back: |
      The immune system damages myelin in the brain and spinal cord, slowing or disrupting neural signals.
    topic_code: "1.3"
  - front: "Myasthenia gravis → cause of symptoms"
    back: |
      The immune system interferes with acetylcholine receptors at the junction of nerves and muscles, causing muscle weakness and fatigue.
    topic_code: "1.3"
  - front: "Hormones vs neurotransmitters"
    back: |
      Hormones travel through the bloodstream, act more slowly and last longer; neurotransmitters cross a synapse almost instantly.
    topic_code: "1.3"
  - front: "Adrenaline (epinephrine) → role"
    back: |
      Released by the adrenal glands; prolongs the sympathetic fight-or-flight response.
    topic_code: "1.3"
  - front: "Leptin vs ghrelin"
    back: |
      Leptin, from fat cells, signals fullness; ghrelin, from the stomach, signals hunger.
    topic_code: "1.3"
  - front: "Melatonin → role"
    back: |
      Released by the pineal gland as darkness falls; promotes sleepiness.
    topic_code: "1.3"
  - front: "Oxytocin → role"
    back: |
      Promotes social bonding and trust; involved in childbirth and nursing.
    topic_code: "1.3"
  - front: "Agonist vs antagonist (drugs)"
    back: |
      An agonist mimics or strengthens a neurotransmitter's effect; an antagonist blocks its receptors and weakens its effect.
    topic_code: "1.3"
  - front: "Reuptake inhibitor → effect"
    back: |
      Blocks reabsorption, so the neurotransmitter stays in the synapse longer (SSRIs for serotonin; cocaine for dopamine).
    topic_code: "1.3"
  - front: "Drug classes → four to know"
    back: |
      Stimulants (caffeine, nicotine, cocaine, amphetamines), depressants (alcohol), hallucinogens (LSD, psilocybin; marijuana is usually grouped here, though its effects are mixed), opioids (morphine, heroin, fentanyl).
    topic_code: "1.3"
  - front: "Tolerance, withdrawal, addiction"
    back: |
      Tolerance: more drug needed for the same effect. Withdrawal: distress after stopping. Addiction: compulsive use despite harm.
    topic_code: "1.3"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on Topic 1.3 (the neuron, the reflex arc, neural firing,
    neurotransmitters, hormones and psychoactive drugs), with 7 questions (32%) reviewing weeks 1 and 2 (research
    methods and ethics, heredity and environment, and the divisions of the nervous system). Opens with a
    shared-context set on one invented animal study. Multiple choice, select-all and true/false items are graded
    at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded
    by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented animal study (1.3, 1.1)
    - slug: appsych-u01-w03-q01
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      stimulus: |
        A hypothetical laboratory study (invented for this course). Rats learned to press a lever to receive a drop of sugar water. The rats were then randomly assigned to receive an injection of either saline (salt water) or Drug X, a compound that binds to dopamine receptors without activating them. Over the next 30 minutes, the saline group pressed the lever a mean of 112 times and the Drug X group a mean of 41 times.
      prompt: |
        How does Drug X act on dopamine?
      options:
        - "As an agonist, because it binds to dopamine receptors"
        - "As a reuptake inhibitor, because it keeps dopamine in the synapse"
        - "As an antagonist, because it occupies the receptors and blocks dopamine's effect"
        - "As a hormone, because it was injected into the body"
      option_explanations:
        - |
          Binding alone does not make a drug an agonist; an agonist must activate the receptor or strengthen the neurotransmitter's effect.
        - |
          A reuptake inhibitor acts on the sending neuron's reabsorption; Drug X acts on the receiving neuron's receptors.
        - |
          Correct. A substance that occupies receptors without activating them blocks the neurotransmitter, which makes it an antagonist.
        - |
          Hormones are made by glands and travel in the blood; how a substance enters the body does not make it a hormone.
      answer: 2
    - slug: appsych-u01-w03-q02
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 3"
      points: 1
      stimulus: |
        A hypothetical laboratory study (invented for this course). Rats learned to press a lever to receive a drop of sugar water. The rats were then randomly assigned to receive an injection of either saline (salt water) or Drug X, a compound that binds to dopamine receptors without activating them. Over the next 30 minutes, the saline group pressed the lever a mean of 112 times and the Drug X group a mean of 41 times.
      prompt: |
        Which interpretation of the results best fits what is known about dopamine?
      options:
        - "Blocking dopamine reduced the rats' motivation to work for a reward."
        - "Blocking dopamine made the rats hungrier for sugar water."
        - "Drug X raised serotonin, which reduced the rats' movement."
        - "The saline injection increased lever pressing by stimulating dopamine release."
      option_explanations:
        - |
          Correct. Dopamine is central to motivation and reward, so blocking its receptors fits the drop from 112 to 41 presses.
        - |
          Hungrier rats would press more, not less; the results show reduced reward-seeking.
        - |
          The study describes Drug X acting on dopamine receptors and measured nothing about serotonin.
        - |
          Saline is the inactive control condition; the difference reflects Drug X lowering pressing, not saline raising it.
      answer: 0
    - slug: appsych-u01-w03-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 1
      stimulus: |
        A hypothetical laboratory study (invented for this course). Rats learned to press a lever to receive a drop of sugar water. The rats were then randomly assigned to receive an injection of either saline (salt water) or Drug X, a compound that binds to dopamine receptors without activating them. Over the next 30 minutes, the saline group pressed the lever a mean of 112 times and the Drug X group a mean of 41 times.
      prompt: |
        Which ethical safeguard applies to this study?
      options:
        - "Each rat must give informed consent before the injection."
        - "Each rat must be debriefed about the purpose of the study."
        - "No ethical review is needed, because the participants are animals."
        - "An animal care committee must review the study, and the rats must be housed humanely with pain and distress kept to a minimum."
      option_explanations:
        - |
          Animals cannot give informed consent; that guideline applies to human participants.
        - |
          Debriefing is a duty to human participants after deception; it has no meaning for rats.
        - |
          Animal research is reviewed by its own committee and must follow guidelines for humane treatment.
        - |
          Correct. Research with animals must be approved by an animal care committee and must minimize pain and distress and provide humane housing.
      answer: 3
    # ---- Independent items
    - slug: appsych-u01-w03-q04
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      prompt: |
        Why does a firm squeeze of the arm feel stronger than a light touch, given that action potentials are all-or-nothing?
      options:
        - "The firm squeeze produces larger action potentials."
        - "The firm squeeze makes neurons fire more often and activates more neurons."
        - "The firm squeeze makes the refractory period longer."
        - "The firm squeeze changes the neurotransmitter from inhibitory to excitatory."
      option_explanations:
        - |
          Action potentials do not grow with stimulus strength; that is the meaning of all-or-nothing.
        - |
          Correct. Intensity is coded by firing rate and by the number of neurons firing, not by the size of each action potential.
        - |
          A longer refractory period would reduce firing, not signal a stronger stimulus.
        - |
          Stimulus strength does not switch a neurotransmitter's type; each neurotransmitter acts on its own receptors.
      answer: 1
    - slug: appsych-u01-w03-q05
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      prompt: |
        A person's immune system gradually damages the myelin around axons in the brain and spinal cord. Which condition does this describe, and why do symptoms appear?
      options:
        - "Multiple sclerosis; signals travel more slowly or are disrupted along the damaged axons."
        - "Myasthenia gravis; acetylcholine receptors at the muscles are blocked."
        - "Parkinson's disease; dopamine-producing neurons die."
        - "Alzheimer's disease; acetylcholine-producing neurons are lost."
      option_explanations:
        - |
          Correct. Multiple sclerosis involves damage to myelin in the central nervous system, which slows or disrupts neural transmission.
        - |
          Myasthenia gravis affects acetylcholine receptors where nerves meet muscles, not myelin in the brain and spinal cord.
        - |
          Parkinson's disease involves the loss of dopamine-producing neurons, not damage to myelin.
        - |
          Alzheimer's disease involves loss of neurons, including acetylcholine-producing ones, rather than myelin damage.
      answer: 0
    - slug: appsych-u01-w03-q06
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      prompt: |
        A selective serotonin reuptake inhibitor (SSRI) is prescribed for depression. What is its direct effect at the synapse?
      options:
        - "It blocks serotonin receptors on the receiving neuron."
        - "It destroys serotonin before it is released."
        - "It slows the reabsorption of serotonin, so serotonin stays active in the synapse longer."
        - "It turns serotonin into dopamine."
      option_explanations:
        - |
          Blocking receptors would be an antagonist effect, the opposite of what an SSRI is designed to do.
        - |
          Destroying serotonin would reduce its availability; an SSRI increases it.
        - |
          Correct. By inhibiting reuptake, an SSRI leaves more serotonin in the synapse to act on receptors.
        - |
          SSRIs do not convert one neurotransmitter into another; they affect serotonin reuptake only.
      answer: 2
    - slug: appsych-u01-w03-q07
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      prompt: |
        Lena touches a cactus and pulls her hand back before she feels the prick. Which sequence describes the reflex?
      options:
        - "Motor neuron → interneuron → sensory neuron"
        - "Sensory neuron → interneuron in the spinal cord → motor neuron"
        - "Sensory neuron → brain → motor neuron"
        - "Interneuron → sensory neuron → motor neuron"
      option_explanations:
        - |
          This runs backward: the message begins with a sensory neuron at the skin and ends with a motor neuron at the muscle.
        - |
          Correct. The sensory neuron carries the signal to the spinal cord, an interneuron relays it, and a motor neuron pulls the hand away.
        - |
          The withdrawal starts before the brain registers pain; the spinal cord handles the reflex.
        - |
          Interneurons sit between sensory and motor neurons; the arc cannot start with an interneuron.
      answer: 1
    - slug: appsych-u01-w03-q08
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      prompt: |
        Alcohol increases the effect of the brain's main inhibitory neurotransmitter. Which neurotransmitter is this, and which drug class does that place alcohol in?
      options:
        - "Glutamate; stimulant"
        - "Dopamine; hallucinogen"
        - "Serotonin; opioid"
        - "GABA; depressant"
      option_explanations:
        - |
          Glutamate is the main excitatory neurotransmitter, and alcohol slows rather than speeds neural activity.
        - |
          Dopamine is not the main inhibitory neurotransmitter, and alcohol is not classed as a hallucinogen.
        - |
          Serotonin is not the main inhibitory neurotransmitter, and opioids are a different class that act on endorphin receptors.
        - |
          Correct. GABA is the main inhibitory neurotransmitter; boosting it slows neural activity, which makes alcohol a depressant.
      answer: 3
    - slug: appsych-u01-w03-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1 (spiral review)"
      points: 1
      prompt: |
        After a near-miss on the highway, a driver's heart keeps pounding for several minutes even though the danger is over. What best explains the lingering arousal?
      options:
        - "The somatic nervous system is still contracting the heart muscle."
        - "The parasympathetic nervous system has stopped working."
        - "The sympathetic response triggered the adrenal glands to release adrenaline, which keeps acting through the bloodstream."
        - "The spinal cord blocked messages from the brain."
      option_explanations:
        - |
          Heart rate is controlled by the autonomic system, not by voluntary somatic commands.
        - |
          The parasympathetic system is working to calm the body; it simply takes time to overcome circulating hormones.
        - |
          Correct. Sympathetic arousal stimulates adrenaline release, and because hormones travel in the blood their effects outlast the threat.
        - |
          Nothing in the scenario suggests a blocked spinal cord; the driver is responding normally to stress.
      answer: 2
    - slug: appsych-u01-w03-q10
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      prompt: |
        Shortly before lunch, Tomas's stomach releases a hormone that makes him feel hungry. Which hormone is it?
      options:
        - "Ghrelin"
        - "Leptin"
        - "Melatonin"
        - "Oxytocin"
      option_explanations:
        - |
          Correct. Ghrelin, released by the stomach, signals hunger.
        - |
          Leptin comes from fat cells and signals fullness, which reduces hunger.
        - |
          Melatonin, from the pineal gland, promotes sleep; it does not signal hunger.
        - |
          Oxytocin is associated with social bonding, childbirth and nursing, not hunger.
      answer: 0
    - slug: appsych-u01-w03-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      prompt: |
        A student who once felt alert after one cup of coffee now needs three cups to feel the same effect. Which term describes this change?
      options:
        - "Withdrawal"
        - "Reuptake"
        - "Refractory period"
        - "Tolerance"
      option_explanations:
        - |
          Withdrawal is the discomfort that follows stopping a drug, not the need for a larger dose.
        - |
          Reuptake is a synaptic process of reabsorbing neurotransmitter, not a change in response to repeated drug use.
        - |
          The refractory period is a neuron's brief recovery after firing; it has nothing to do with caffeine dose.
        - |
          Correct. Tolerance is the need for more of a drug to produce the same effect after repeated use.
      answer: 3
    - slug: appsych-u01-w03-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 3 (spiral review)"
      points: 1
      prompt: |
        A hypothetical study of 400 adults finds a correlation of r = +0.22 between the number of copies of a particular gene variant a person carries and their score on a novelty-seeking scale. Which statement is best supported?
      options:
        - "The gene variant causes novelty seeking."
        - "There is a weak positive relationship; many other genetic and environmental factors must also be involved."
        - "There is a strong negative relationship between the gene variant and novelty seeking."
        - "Novelty seeking causes people to carry more copies of the gene variant."
      option_explanations:
        - |
          A correlation cannot establish cause, and a weak one leaves most of the variation unexplained.
        - |
          Correct. r = +0.22 is a weak positive relationship, so the variant accounts for little of the difference in novelty seeking.
        - |
          The positive sign shows a positive relationship, and 0.22 is weak, not strong.
        - |
          Genes are present from conception, so behavior cannot change how many copies a person carries; this is also a causal claim.
      answer: 1
    - slug: appsych-u01-w03-q13
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      prompt: |
        A person's eyelids droop and arm muscles tire quickly because the immune system interferes with receptors where nerves meet muscles. Which neurotransmitter's action is most directly reduced?
      options:
        - "Serotonin"
        - "Endorphins"
        - "Acetylcholine"
        - "GABA"
      option_explanations:
        - |
          Serotonin is linked to mood, sleep and appetite, not to signals that trigger muscle contraction.
        - |
          Endorphins relieve pain; they do not carry the message that makes skeletal muscles contract.
        - |
          Correct. Acetylcholine triggers muscle contraction; in myasthenia gravis its receptors at the muscles are disrupted.
        - |
          GABA is the main inhibitory neurotransmitter in the brain, not the messenger at the nerve-muscle junction.
      answer: 2
    - slug: appsych-u01-w03-q14
      type: multi_select
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 2
      partial_credit: true
      prompt: |
        Which of these substances are classed as stimulants? Select all that apply.
      options:
        - "Caffeine"
        - "Alcohol"
        - "Nicotine"
        - "Cocaine"
        - "Morphine"
      option_explanations:
        - |
          Correct. Caffeine increases alertness and neural activity, so it is a stimulant.
        - |
          Alcohol slows neural activity by boosting GABA, so it is a depressant.
        - |
          Correct. Nicotine increases arousal and heart rate, so it is a stimulant.
        - |
          Correct. Cocaine blocks the reuptake of dopamine and other neurotransmitters, producing intense stimulation.
        - |
          Morphine is an opioid: it relieves pain by acting on endorphin receptors and slows breathing.
      answer: [0, 2, 3]
    - slug: appsych-u01-w03-q15
      type: multi_select
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1 (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are part of the peripheral nervous system? Select all that apply.
      options:
        - "The sympathetic nervous system"
        - "The spinal cord"
        - "The somatic nervous system"
        - "The parasympathetic nervous system"
        - "The brain"
      option_explanations:
        - |
          Correct. The sympathetic branch belongs to the autonomic division of the peripheral nervous system.
        - |
          The spinal cord is part of the central nervous system with the brain.
        - |
          Correct. The somatic division of the peripheral system carries body senses in and voluntary motor commands out.
        - |
          Correct. The parasympathetic branch belongs to the autonomic division of the peripheral nervous system.
        - |
          The brain is the main part of the central nervous system.
      answer: [0, 2, 3]
    - slug: appsych-u01-w03-q16
      type: true_false
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      prompt: |
        True or false: Communication within a neuron is electrical, while communication between neurons is chemical.
      answer: true
      explanation: |
        True. The action potential is an electrical charge traveling down the axon; at the synapse, neurotransmitters carry the message chemically to the next cell.
    - slug: appsych-u01-w03-q17
      type: true_false
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 1
      prompt: |
        True or false: In a double-blind drug study, the participants know whether they received the drug, but the researchers collecting data do not.
      answer: false
      explanation: |
        False. In a double-blind study neither the participants nor the researchers collecting data know who received the drug or the placebo. When only the participants are unaware, the study is single-blind.
    - slug: appsych-u01-w03-q18
      type: fill_blank
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 1
      prompt: |
        The fatty layer of insulation that covers many axons and speeds neural transmission is the ____ sheath.
      answer: ["myelin"]
      explanation: |
        The myelin sheath, formed by glial cells, lets the action potential jump between gaps along the axon. Its breakdown in the central nervous system is the hallmark of multiple sclerosis.
    - slug: appsych-u01-w03-q19
      type: fill_blank
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1 (spiral review)"
      points: 1
      prompt: |
        The branch of the autonomic nervous system that slows the heart and lets digestion resume after a scare is the ____ nervous system.
      answer: ["parasympathetic", "parasympathetic nervous system"]
      explanation: |
        The parasympathetic branch calms the body and conserves energy, reversing the sympathetic branch's arousal.
    - slug: appsych-u01-w03-q20
      type: short_answer
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1"
      points: 3
      prompt: |
        Describe what happens when a neuron fires.

        (a) What must happen for the neuron to produce an action potential?
        (b) Describe the movement of charged particles during the action potential.
        (c) What happens at the terminal buttons when the action potential arrives?
      answer: |
        (a) The combined excitatory input must push the neuron's charge past its threshold (excitatory signals must outweigh inhibitory ones).
        (b) Channels open and positively charged sodium ions flow into the axon (depolarization); the change moves down the axon, and potassium ions then flow out to restore the negative resting charge.
        (c) The terminal buttons release neurotransmitters into the synapse, where they bind to receptor sites on the receiving neuron.
      explanation: |
        Three points, one per part. (a) reaching threshold. (b) positive ions (sodium) entering, or depolarization traveling down the axon. (c) release of neurotransmitters into the synapse. A description that has the signal move from axon to dendrites earns 0 for that part.
    - slug: appsych-u01-w03-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practices 1–2 (spiral review)"
      points: 3
      prompt: |
        A hypothetical twin study (invented for this course) finds that nicotine dependence is more similar between identical twins than between fraternal twins.

        (a) Explain what this pattern suggests about genetic influence.
        (b) A student concludes, "If your identical twin is dependent on nicotine, you will be too." Explain why this is wrong.
        (c) Name one environmental factor that could also influence nicotine dependence.
      answer: |
        (a) Identical twins share essentially all their genes and fraternal twins about half, so greater similarity among identical twins suggests genes contribute to nicotine dependence.
        (b) Genetic influence raises the likelihood but does not determine an outcome; identical twins often differ, and heritability describes variation in a population, not one person's destiny.
        (c) For example, peers who smoke, parents who smoke, availability and price of nicotine products, advertising, or stress.
      explanation: |
        Three points, one per part. (a) the genetic-similarity reasoning. (b) the point that genes influence probability, not certainty (or that heritability applies to groups). (c) any plausible environmental factor.
    - slug: appsych-u01-w03-q22
      type: long_answer
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practices 1–4 (Article Analysis Question)"
      points: 7
      stimulus: |
        A hypothetical study (invented for this course). Researchers recruited 90 adult volunteers aged 18 to 25 through flyers at one university. After giving written informed consent, participants were randomly assigned to drink a coffee with 200 mg of caffeine or an identical decaffeinated coffee. Neither the participants nor the research assistants testing them knew which drink each had received. Thirty minutes later, each participant completed 50 trials of a task in which they pressed a key as soon as a light appeared; reaction time was the average time in milliseconds over the 50 trials. Mean reaction time was 268 ms (SD = 22) in the caffeine group and 289 ms (SD = 25) in the decaf group; the difference was statistically significant (p = .002). Participants were told the study's purpose at the end.
      prompt: |
        Answer each part.

        (A) Identify the research method used in this study.
        (B) State the operational definition of reaction time.
        (C) Describe what the statistical result (p = .002) shows.
        (D) Identify one ethical guideline the researchers followed, with evidence.
        (E) Evaluate how well these findings generalize to high school students.
        (F) Explain how the findings support or refute the claim that caffeine speeds reactions because it is a stimulant. (2 points)
      answer: |
        (A) An experiment: the drink (caffeine or decaf) was manipulated and participants were randomly assigned.
        (B) The average time in milliseconds to press the key after the light appeared, over 50 trials.
        (C) The 21 ms difference between groups is statistically significant: if caffeine had no real effect, a difference this large would occur by chance only about 2 times in 1,000.
        (D) Informed consent (written consent before the study), or debriefing (told the purpose at the end).
        (E) Limited: the sample was 18- to 25-year-olds from one university who volunteered; teens may differ in body size, caffeine habits and sensitivity, so the results may not apply to high school students.
        (F) The findings support the claim. Caffeine is a stimulant that increases neural activity and alertness, and the caffeine group reacted faster than the decaf group; because the design was double-blind with random assignment, the faster reactions can be attributed to the caffeine rather than to expectations.
      explanation: |
        Seven points. (A) 1 point: experiment, with or without the reason. (B) 1 point: average milliseconds to respond across the 50 trials. (C) 1 point: the difference is statistically significant (unlikely due to chance); saying it shows a large effect or proves the claim earns 0. (D) 1 point: a guideline with matching evidence (informed consent or debriefing). (E) 1 point: a specific feature of the sample (age, one university, volunteers) linked to whether results apply to high school students. (F) 2 points: 1 for stating that the findings support the claim with the faster caffeine-group mean; 1 for explaining with the concept of a stimulant increasing neural activity (or with the double-blind, random-assignment design ruling out alternative explanations).
