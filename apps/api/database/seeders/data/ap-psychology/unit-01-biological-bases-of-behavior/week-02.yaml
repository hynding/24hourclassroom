week: 2
unit: 1
title: The Nervous System's Big Picture
topics: ["1.2"]
guide: guides/week-02.md
guide_description: |
  How the nervous system is organized: the central nervous system (brain and spinal cord) and the peripheral
  nervous system; afferent (sensory) and efferent (motor) pathways; the somatic division (body senses and
  voluntary skeletal muscles) and the autonomic division (organs and glands); and the sympathetic and
  parasympathetic branches as accelerator and brake, organ by organ. What a spinal cord injury shows about the
  cord as a two-way pathway, and why a polygraph measures arousal rather than lying. Worked examples: a surprise
  quiz, a sprint and lunch, and an invented experiment comparing heart rates during suspenseful and calm film
  clips (method, variables, means and standard deviations, ethics and limits).
flashcards_description: |
  30 cards on the central and peripheral nervous systems, the spinal cord, afferent and efferent pathways, the
  somatic and autonomic divisions, sympathetic and parasympathetic effects on each organ, homeostasis,
  operational definitions of arousal, and the polygraph.

flashcards:
  - front: "Central nervous system → parts"
    back: |
      The brain and the spinal cord.
    topic_code: "1.2"
  - front: "Peripheral nervous system → definition"
    back: |
      All the nerves outside the brain and spinal cord, connecting the central nervous system to the senses, muscles, organs and glands.
    topic_code: "1.2"
  - front: "Nerve → definition"
    back: |
      A bundle of axons that carries messages between the central nervous system and the body.
    topic_code: "1.2"
  - front: "Spinal cord → two jobs"
    back: |
      A two-way pathway for messages between the brain and the body, and a center for some simple reflexes that happen without the brain.
    topic_code: "1.2"
  - front: "Spinal cord injury → typical effect"
    back: |
      Loss of sensation and voluntary movement in the parts of the body served below the injury, because messages can no longer pass the damaged section.
    topic_code: "1.2"
  - front: "Afferent pathway → direction"
    back: |
      Sensory: carries information from the body toward the central nervous system ("afferent arrives").
    topic_code: "1.2"
  - front: "Efferent pathway → direction"
    back: |
      Motor: carries commands from the central nervous system out to muscles and glands ("efferent exits").
    topic_code: "1.2"
  - front: "Somatic nervous system → what it controls"
    back: |
      Voluntary movement of skeletal muscles, and the sensory input from the skin, muscles and joints.
    topic_code: "1.2"
  - front: "Autonomic nervous system → what it controls"
    back: |
      Glands and internal organs, such as the heart, lungs, stomach and intestines, largely without conscious effort.
    topic_code: "1.2"
  - front: "Somatic vs autonomic → quick test"
    back: |
      Could you decide to do it right now? Kicking a ball: somatic. Changing your digestion rate: autonomic.
    topic_code: "1.2"
  - front: "Sympathetic nervous system → overall role"
    back: |
      Arouses the body and mobilizes energy for action in an emergency or challenge ("fight or flight").
    topic_code: "1.2"
  - front: "Parasympathetic nervous system → overall role"
    back: |
      Calms the body after arousal and conserves energy ("rest and digest").
    topic_code: "1.2"
  - front: "Heart rate → sympathetic vs parasympathetic"
    back: |
      Sympathetic speeds it up; parasympathetic slows it down.
    topic_code: "1.2"
  - front: "Pupils → sympathetic vs parasympathetic"
    back: |
      Sympathetic dilates (widens) them; parasympathetic constricts (narrows) them.
    topic_code: "1.2"
  - front: "Digestion → sympathetic vs parasympathetic"
    back: |
      Sympathetic slows or halts digestion; parasympathetic lets it resume.
    topic_code: "1.2"
  - front: "Salivation → sympathetic vs parasympathetic"
    back: |
      Sympathetic reduces saliva (the dry mouth of nerves); parasympathetic increases it.
    topic_code: "1.2"
  - front: "Breathing → sympathetic effect"
    back: |
      Breathing speeds up and the airways widen, bringing in more oxygen for the muscles.
    topic_code: "1.2"
  - front: "Stored energy → sympathetic effect"
    back: |
      The liver releases glucose into the blood so the muscles have fuel.
    topic_code: "1.2"
  - front: "Adrenal glands → link to the sympathetic system"
    back: |
      Sympathetic activation stimulates the adrenal glands to release stress hormones such as adrenaline (epinephrine), which prolong the arousal.
    topic_code: "1.2"
  - front: "Sweating → which branch"
    back: |
      Sympathetic activation increases sweating, which is why skin conductance is used to measure arousal.
    topic_code: "1.2"
  - front: "Homeostasis → definition"
    back: |
      The body's tendency to keep its internal state (temperature, heart rate, blood sugar) steady; the two autonomic branches help by pushing in opposite directions.
    topic_code: "1.2"
  - front: "Fight-or-flight response → when it happens"
    back: |
      Whenever a situation is appraised as a threat or challenge, from a predator to a test or a stage performance.
    topic_code: "1.2"
  - front: "After the danger passes → which branch"
    back: |
      The parasympathetic branch takes over: heart rate slows, breathing calms, digestion resumes.
    topic_code: "1.2"
  - front: "Skin conductance → what it measures"
    back: |
      How easily skin conducts a tiny electrical current; sweat raises it, so it is an operational definition of sympathetic arousal.
    topic_code: "1.2"
  - front: "Polygraph → what it actually records"
    back: |
      Autonomic arousal (heart rate, breathing, skin conductance, blood pressure), not lying itself; anxious honest people can look deceptive.
    topic_code: "1.2"
  - front: "Validity → definition"
    back: |
      The extent to which a measure actually measures the concept it claims to measure.
    topic_code: "1.2"
  - front: "Reflex → where it can be handled"
    back: |
      In the spinal cord, without waiting for the brain, which is why you pull away from a hot pan before you feel the pain.
    topic_code: "1.2"
  - front: "Voluntary movement → path of the command"
    back: |
      Brain → spinal cord → somatic motor (efferent) nerves → skeletal muscles.
    topic_code: "1.2"
  - front: "Slow breathing → effect on the autonomic system"
    back: |
      It tends to shift balance toward the parasympathetic branch, slowing the heart: a way to influence the autonomic system indirectly.
    topic_code: "1.2"
  - front: "Arousal → why the same state can feel different"
    back: |
      Sympathetic arousal is similar in fear, excitement and anger; how people interpret the situation shapes which emotion they feel (Unit 4).
    topic_code: "1.2"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on Topic 1.2 (central and peripheral nervous systems, somatic and
    autonomic divisions, sympathetic and parasympathetic effects), with 7 questions (32%) reviewing week 1
    (heredity and environment, research methods, ethics and statistics). Opens with a shared-context set on one
    invented experiment. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against
    the scoring notes.
  questions:
    # ---- Stimulus set: an invented film-clip experiment (1.2)
    - slug: appsych-u01-w02-q01
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 1
      stimulus: |
        A hypothetical experiment (invented for this course). Eighty high school volunteers were randomly assigned to watch a 5-minute clip that was either suspenseful (a chase scene) or calm (a nature scene). Heart rate was recorded by a chest strap, and pupil diameter by a camera, during the final minute of the clip.

        | Condition | n | Mean heart rate (bpm) | Mean pupil diameter (mm) |
        |---|---|---|---|
        | Suspense clip | 40 | 94 | 5.1 |
        | Nature clip | 40 | 75 | 3.9 |
      prompt: |
        Which division of the nervous system is most responsible for the higher heart rate and larger pupils in the suspense group?
      options:
        - "The somatic nervous system"
        - "The sympathetic nervous system"
        - "The parasympathetic nervous system"
        - "The spinal cord acting as a reflex center"
      option_explanations:
        - |
          The somatic system controls voluntary skeletal muscles and body senses, not heart rate or pupil size.
        - |
          Correct. Sympathetic arousal speeds the heart and dilates the pupils, matching the suspense group's results.
        - |
          The parasympathetic branch slows the heart and constricts the pupils, the opposite of what the suspense group shows.
        - |
          Spinal reflexes are fast withdrawals and similar responses; the pattern here is whole-body autonomic arousal.
      answer: 1
    - slug: appsych-u01-w02-q02
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 2"
      points: 1
      stimulus: |
        A hypothetical experiment (invented for this course). Eighty high school volunteers were randomly assigned to watch a 5-minute clip that was either suspenseful (a chase scene) or calm (a nature scene). Heart rate was recorded by a chest strap, and pupil diameter by a camera, during the final minute of the clip.

        | Condition | n | Mean heart rate (bpm) | Mean pupil diameter (mm) |
        |---|---|---|---|
        | Suspense clip | 40 | 94 | 5.1 |
        | Nature clip | 40 | 75 | 3.9 |
      prompt: |
        Which correctly identifies the independent variable and one dependent variable?
      options:
        - "Independent: heart rate; dependent: type of clip"
        - "Independent: random assignment; dependent: pupil diameter"
        - "Independent: the volunteers' age; dependent: heart rate"
        - "Independent: type of clip; dependent: heart rate in beats per minute"
      option_explanations:
        - |
          This reverses the variables: the clip is manipulated, and heart rate is the measured outcome.
        - |
          Random assignment is how participants are placed into conditions, not the variable that is manipulated.
        - |
          Age was not manipulated; random assignment should spread ages evenly across the two clip groups.
        - |
          Correct. The researcher manipulates the type of clip and measures heart rate (and pupil diameter) as outcomes.
      answer: 3
    - slug: appsych-u01-w02-q03
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 1
      stimulus: |
        A hypothetical experiment (invented for this course). Eighty high school volunteers were randomly assigned to watch a 5-minute clip that was either suspenseful (a chase scene) or calm (a nature scene). Heart rate was recorded by a chest strap, and pupil diameter by a camera, during the final minute of the clip.

        | Condition | n | Mean heart rate (bpm) | Mean pupil diameter (mm) |
        |---|---|---|---|
        | Suspense clip | 40 | 94 | 5.1 |
        | Nature clip | 40 | 75 | 3.9 |
      prompt: |
        Ten minutes after the suspense clip ends, the suspense group's heart rate has returned to about 76 bpm. Which process best explains the change?
      options:
        - "The parasympathetic nervous system calming the body back toward its resting state"
        - "The sympathetic nervous system becoming more active"
        - "The somatic nervous system relaxing the heart muscle by choice"
        - "The adrenal glands releasing more stress hormones"
      option_explanations:
        - |
          Correct. Once the threat passes, the parasympathetic branch slows the heart and restores homeostasis.
        - |
          More sympathetic activity would keep the heart rate high or raise it, not bring it down.
        - |
          The heart is not a skeletal muscle under voluntary somatic control; its rate is set by the autonomic system.
        - |
          Stress hormones prolong arousal; releasing more would slow the return to a resting heart rate.
      answer: 0
    # ---- Independent items
    - slug: appsych-u01-w02-q04
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 1
      prompt: |
        A student steps on a sharp stone. Which pathway first carries the information about the stone toward the spinal cord?
      options:
        - "Efferent nerves of the autonomic nervous system"
        - "Efferent nerves of the somatic nervous system"
        - "Afferent (sensory) nerves of the somatic nervous system"
        - "The parasympathetic nervous system"
      option_explanations:
        - |
          Efferent nerves carry commands away from the central nervous system, and the autonomic system serves organs and glands, not the skin of the foot.
        - |
          Somatic efferent nerves carry motor commands out to muscles; the message about the stone travels inward.
        - |
          Correct. Touch and pain from the skin travel inward along afferent somatic nerves to the spinal cord.
        - |
          The parasympathetic branch calms internal organs; it does not carry sensations from the skin.
      answer: 2
    - slug: appsych-u01-w02-q05
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 1
      prompt: |
        Forty minutes after a large lunch, Marisol is sitting quietly in class and her stomach is busy digesting. Which branch of the nervous system is most active?
      options:
        - "Sympathetic, because digestion requires energy"
        - "Somatic, because she chose to eat"
        - "Central, because digestion is controlled by the spinal cord alone"
        - "Parasympathetic, because it supports digestion during rest"
      option_explanations:
        - |
          Sympathetic arousal slows or stops digestion to free energy for action; it is not dominant while resting after a meal.
        - |
          Choosing to eat used the somatic system, but digesting food is automatic and autonomic.
        - |
          Digestion is regulated mainly by the autonomic nerves of the peripheral system, not by the spinal cord alone.
        - |
          Correct. The parasympathetic branch dominates during rest and lets digestion proceed ("rest and digest").
      answer: 3
    - slug: appsych-u01-w02-q06
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 1
      prompt: |
        After a diving accident damages the spinal cord in the middle of the back, a person cannot feel or voluntarily move their legs but has full use of their arms. What best explains this pattern?
      options:
        - "The damage destroyed the brain's motor areas for the legs."
        - "Messages to and from the legs must pass the damaged section of the cord, while messages for the arms enter and leave above it."
        - "The autonomic nervous system controls the legs and the somatic system controls the arms."
        - "The legs' muscles were damaged in the accident."
      option_explanations:
        - |
          The injury is in the spinal cord, not the brain; the brain's motor areas can still issue commands that cannot get through.
        - |
          Correct. The spinal cord is a two-way pathway, so damage blocks sensation and voluntary movement only for body parts served below the injury.
        - |
          Both arms and legs have voluntary skeletal muscles controlled by the somatic system.
        - |
          The loss of feeling as well as movement points to a broken pathway in the nervous system, not damaged muscle.
      answer: 1
    - slug: appsych-u01-w02-q07
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 2"
      points: 1
      prompt: |
        A polygraph records heart rate, breathing and skin conductance while a person answers questions. What is the main problem with using it as a "lie detector"?
      options:
        - "It measures autonomic arousal, which can come from anxiety or anger as well as lying, so its validity as a measure of lying is weak."
        - "It measures only somatic activity, which cannot change during questioning."
        - "It is too sensitive and detects every lie perfectly, so innocent people never fail it."
        - "It measures brain waves, which cannot be recorded through the skin."
      option_explanations:
        - |
          Correct. Arousal has many causes, so an honest but nervous person may look deceptive; the measure does not validly capture lying.
        - |
          Heart rate, breathing and skin conductance are autonomic, and they change a great deal during questioning.
        - |
          Polygraphs make errors in both directions; nervous truthful people can "fail" and calm liars can pass.
        - |
          A polygraph records autonomic measures, not brain waves; recording brain waves is what an EEG does.
      answer: 0
    - slug: appsych-u01-w02-q08
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 1
      prompt: |
        A soccer player decides to kick the ball toward the goal. Which part of the nervous system carries the command to her leg muscles?
      options:
        - "The sympathetic nervous system"
        - "The afferent nerves of the leg"
        - "The somatic nervous system's motor nerves"
        - "The parasympathetic nervous system"
      option_explanations:
        - |
          The sympathetic branch may raise her heart rate during the game, but it does not direct voluntary leg movements.
        - |
          Afferent nerves carry sensation inward; a command to a muscle travels out along efferent (motor) nerves.
        - |
          Correct. Voluntary movement of skeletal muscles is controlled by the somatic nervous system's motor (efferent) nerves.
        - |
          The parasympathetic branch calms organs and supports digestion; it does not move skeletal muscles.
      answer: 2
    - slug: appsych-u01-w02-q09
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 1
      prompt: |
        In a hypothetical adoption study, adopted teens' anxiety scores correlate r = +0.35 with their biological parents' scores and r = +0.05 with their adoptive parents' scores. What do these results suggest?
      options:
        - "The adoptive home is the main influence on differences in anxiety."
        - "Genetic differences contribute to differences in anxiety in this sample."
        - "Anxiety is entirely inherited."
        - "Biological parents caused their children's anxiety by how they raised them."
      option_explanations:
        - |
          The correlation with adoptive parents is near zero, so the shared home shows little link with anxiety here.
        - |
          Correct. The teens resemble the parents who gave them genes but not their home, pointing to a genetic contribution.
        - |
          A correlation of 0.35 leaves most of the variation unexplained, so "entirely inherited" goes far beyond the data.
        - |
          The biological parents did not raise these teens, so their resemblance cannot come from parenting.
      answer: 1
    - slug: appsych-u01-w02-q10
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 1
      prompt: |
        A researcher picks 200 names at random from every student enrolled in a large school district, then flips a coin to decide whether each student practices a breathing exercise or reads quietly. What does the coin flip accomplish?
      options:
        - "It makes the sample representative of the district."
        - "It guarantees the results are statistically significant."
        - "It removes the need for informed consent."
        - "It makes the two groups similar at the start, so differences afterward can be attributed to the exercise."
      option_explanations:
        - |
          Choosing names at random from the district is what makes the sample representative; the coin flip is random assignment.
        - |
          Random assignment does not guarantee any particular result; significance depends on the size of the difference and the sample.
        - |
          Every design still needs informed consent (and assent for minors); random assignment changes nothing about that.
        - |
          Correct. The coin flip is random assignment, which balances other factors between groups and supports a causal conclusion.
      answer: 3
    - slug: appsych-u01-w02-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 3 (spiral review)"
      points: 1
      prompt: |
        Resting heart rates in a hypothetical sample of teens are normally distributed with a mean of 70 bpm and a standard deviation of 10 bpm. About what percentile is a resting heart rate of 80 bpm?
      options:
        - "84th"
        - "68th"
        - "50th"
        - "95th"
      option_explanations:
        - |
          Correct. 80 bpm is 1 SD above the mean: 50% fall below the mean and about 34% between the mean and +1 SD, so about 84% fall at or below 80.
        - |
          68% is the share within 1 SD on both sides of the mean, not the share below +1 SD.
        - |
          The 50th percentile is the mean itself, 70 bpm.
        - |
          95% is the share within 2 SD of the mean; 80 bpm is only 1 SD above it.
      answer: 0
    - slug: appsych-u01-w02-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 1
      prompt: |
        Moments before giving a speech, Devin feels his body's sympathetic response in full swing. Which change would NOT be expected?
      options:
        - "His heart beats faster."
        - "His mouth feels dry."
        - "His stomach speeds up digestion."
        - "His palms sweat."
      option_explanations:
        - |
          A faster heart rate is a classic sympathetic effect, so it would be expected.
        - |
          Sympathetic arousal reduces salivation, producing a dry mouth, so it would be expected.
        - |
          Correct. Sympathetic arousal slows or halts digestion; speeding it up is a parasympathetic effect.
        - |
          Sweating increases under sympathetic arousal, so sweaty palms would be expected.
      answer: 2
    - slug: appsych-u01-w02-q13
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 3 (spiral review)"
      points: 1
      prompt: |
        A hypothetical study of 20,000 adults finds that a relaxation app lowers resting heart rate by an average of 0.4 bpm, p = .01. Which statement is most accurate?
      options:
        - "The effect is large, because the p-value is small."
        - "The effect is statistically significant but small, so its practical importance is doubtful."
        - "The result is not statistically significant."
        - "The result proves the app works for every user."
      option_explanations:
        - |
          A small p-value says the result is unlikely to be chance, not that the effect is large; huge samples make tiny effects significant.
        - |
          Correct. p = .01 is below .05, so the result is significant, but a 0.4 bpm drop is a very small effect size.
        - |
          p = .01 is below the usual .05 cutoff, so the result is statistically significant.
        - |
          An average effect says nothing certain about each individual, and no study "proves" a claim for everyone.
      answer: 1
    - slug: appsych-u01-w02-q14
      type: multi_select
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 2
      partial_credit: true
      prompt: |
        A cyclist swerves to avoid a car that suddenly pulls out. Which changes are produced by her sympathetic nervous system? Select all that apply.
      options:
        - "Pupils dilate"
        - "Heart rate increases"
        - "Digestion speeds up"
        - "Glucose is released into the blood"
        - "Breathing slows"
      option_explanations:
        - |
          Correct. Sympathetic arousal widens the pupils, letting in more light.
        - |
          Correct. A faster heart pumps more blood to the muscles during an emergency.
        - |
          Digestion slows under sympathetic arousal; speeding up digestion is parasympathetic.
        - |
          Correct. The liver releases stored glucose to fuel the muscles.
        - |
          Breathing speeds up under sympathetic arousal; slowing is a parasympathetic effect.
      answer: [0, 1, 3]
    - slug: appsych-u01-w02-q15
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        A hypothetical researcher wants to show that a stressful video raises skin conductance. Which design features would strengthen a causal conclusion? Select all that apply.
      options:
        - "Randomly assigning participants to the stressful video or a neutral video"
        - "Letting participants choose which video to watch"
        - "Keeping the room, time of day and video length the same for both groups"
        - "Having a technician who does not know each participant's condition record skin conductance"
        - "Comparing only participants who already report high stress"
      option_explanations:
        - |
          Correct. Random assignment makes the groups similar beforehand, so differences can be attributed to the video.
        - |
          Self-selection creates a confound: people who choose the stressful video may already differ in arousal.
        - |
          Correct. Holding other conditions constant removes possible confounding variables.
        - |
          Correct. A blind technician cannot let expectations influence measurement, which reduces experimenter bias.
        - |
          Studying only already-stressed people narrows the sample and does not create a comparison that isolates the video's effect.
      answer: [0, 2, 3]
    - slug: appsych-u01-w02-q16
      type: true_false
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 1
      prompt: |
        True or false: The spinal cord is part of the peripheral nervous system.
      answer: false
      explanation: |
        False. The spinal cord and the brain together form the central nervous system. The peripheral nervous system is every nerve outside them.
    - slug: appsych-u01-w02-q17
      type: true_false
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 1
      prompt: |
        True or false: A detailed case study of one person whose heart rate never rises under stress shows how most people's nervous systems respond to stress.
      answer: false
      explanation: |
        False. A case study gives rich detail about one person, often an unusual one, so its findings may not generalize to others. Claims about most people need larger, representative samples.
    - slug: appsych-u01-w02-q18
      type: fill_blank
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 1
      prompt: |
        The branch of the autonomic nervous system that arouses the body for "fight or flight" is the ____ nervous system.
      answer: ["sympathetic", "sympathetic nervous system"]
      explanation: |
        The sympathetic branch speeds the heart, dilates the pupils, slows digestion and releases stored energy. The parasympathetic branch reverses these changes.
    - slug: appsych-u01-w02-q19
      type: fill_blank
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 1
      prompt: |
        A factor other than the independent variable that differs between groups and could explain the results is a ____ variable.
      answer: ["confounding", "confound", "confounded"]
      explanation: |
        A confounding variable offers an alternative explanation. Random assignment and holding conditions constant are the main defenses against confounds.
    - slug: appsych-u01-w02-q20
      type: short_answer
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1"
      points: 3
      prompt: |
        Jordan is texting a friend when a loud bang sounds outside. He jumps, his heart races, and a few minutes later, realizing it was a car backfiring, he relaxes.

        (a) Which division of the peripheral nervous system controls his thumbs as he types? Explain.
        (b) Which branch produces his racing heart? Name one other change it would produce.
        (c) Which branch helps him relax afterward? Describe one change it produces.
      answer: |
        (a) The somatic nervous system, because typing is a voluntary movement of skeletal muscles.
        (b) The sympathetic nervous system. It would also dilate his pupils, speed his breathing, increase sweating, slow digestion or release glucose.
        (c) The parasympathetic nervous system, which slows his heart rate back toward resting (or slows breathing, or lets digestion resume).
      explanation: |
        Three points, one per part. (a) somatic with the voluntary skeletal-muscle reason. (b) sympathetic with a correct additional effect. (c) parasympathetic with a correct calming effect. Naming the right branch with a wrong effect earns 0 for that part.
    - slug: appsych-u01-w02-q21
      type: short_answer
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 2"
      points: 3
      prompt: |
        A hypothetical researcher wants to test whether five minutes of slow breathing reduces sympathetic arousal in students before a test.

        (a) Give an operational definition of sympathetic arousal for this study.
        (b) Describe an appropriate control condition.
        (c) Identify one ethical guideline the researcher must follow and explain how to apply it here.
      answer: |
        (a) Heart rate in beats per minute measured by a wrist monitor in the minute before the test (or skin conductance, or pupil diameter in millimeters).
        (b) A group randomly assigned to sit quietly for five minutes breathing normally (or reading a neutral passage), so that time and setting match the breathing group.
        (c) Informed consent: students (with a parent's consent, if minors, and the students' own assent) learn what the study involves and agree before taking part. Or freedom to withdraw, or confidentiality of test and heart-rate data.
      explanation: |
        Three points, one per part. (a) a measurable physiological or rating procedure that yields a number. (b) a comparison condition that differs only in the breathing exercise. (c) a named guideline with a specific application to this study; naming a guideline with no application earns 0.
    - slug: appsych-u01-w02-q22
      type: long_answer
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practices 1–3"
      points: 6
      stimulus: |
        A hypothetical correlational study (invented for this course). Researchers asked 150 high school seniors at three schools to wear a wrist monitor for one week during the college application season. Each student's average resting heart rate was recorded, and each student also completed a 20-item "application stress" questionnaire (scores 20 to 100). Students and their parents signed consent forms. The correlation between questionnaire score and average resting heart rate was r = +0.38.
      prompt: |
        Answer each part.

        (A) Identify which branch of the autonomic nervous system would be linked to a higher resting heart rate, and explain why.
        (B) State the operational definition of stress in this study.
        (C) Describe the relationship shown by r = +0.38.
        (D) Explain why the study cannot show that application stress causes a higher heart rate.
        (E) Identify one ethical guideline that was followed.
        (F) Explain how the parasympathetic nervous system could be relevant to students whose heart rates stay low despite high stress scores.
      answer: |
        (A) The sympathetic branch, because it speeds the heart as part of arousal.
        (B) The score from 20 to 100 on the 20-item application stress questionnaire.
        (C) A moderate positive relationship: students with higher stress scores tended to have higher resting heart rates.
        (D) No variable was manipulated and there was no random assignment; a third variable (such as caffeine, fitness or sleep) could raise both, or the direction could be reversed.
        (E) Informed consent: students and parents signed consent forms.
        (F) The parasympathetic branch slows the heart; students whose parasympathetic activity is strong (for example, because they recover quickly or use calming strategies) may keep low heart rates even when they report stress.
      explanation: |
        Six points, one per part. (A) sympathetic with the heart-rate reason. (B) the questionnaire score. (C) direction and strength in context; any causal wording earns 0. (D) lack of manipulation or random assignment, or a named third variable. (E) informed consent with the evidence. (F) the parasympathetic branch's calming (heart-slowing) role applied to these students.
