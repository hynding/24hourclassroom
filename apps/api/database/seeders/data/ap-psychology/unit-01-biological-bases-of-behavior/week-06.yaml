week: 6
unit: 1
title: Sensation
topics: ["1.6"]
guide: guides/week-06.md
guide_description: |
  Sensation and transduction; absolute and difference thresholds and Weber's law; signal detection theory (hits,
  misses, false alarms and correct rejections, and the response criterion); sensory adaptation, sensory
  interaction and synesthesia. Vision: wavelength and amplitude, the path of light, accommodation, near- and
  farsightedness, rods and cones, the blind spot, trichromatic and opponent-process theories, afterimages, color
  vision deficiency, prosopagnosia and blindsight. Hearing: frequency and amplitude, the path of sound, place,
  frequency and volley theories, sound localization, conductive and sensorineural hearing loss. Then taste and
  supertasters, smell, touch, pain and gate-control theory, phantom limb sensations, kinesthesis and the
  vestibular sense. Worked example: Weber's law with weights.
flashcards_description: |
  34 cards on transduction, thresholds and Weber's law, signal detection, adaptation and sensory interaction,
  the eye and color vision, the ear and pitch theories, hearing loss, taste, smell, pain and the body senses.

flashcards:
  - front: "Sensation vs perception"
    back: |
      Sensation is detecting physical energy with sense receptors; perception is organizing and interpreting those sensations.
    topic_code: "1.6"
  - front: "Transduction → definition"
    back: |
      Converting physical energy (light, sound waves, chemicals, pressure) into neural signals the brain can use.
    topic_code: "1.6"
  - front: "Absolute threshold → definition"
    back: |
      The minimum stimulus intensity a person can detect 50% of the time.
    topic_code: "1.6"
  - front: "Difference threshold (JND) → definition"
    back: |
      The smallest difference between two stimuli that a person can detect 50% of the time.
    topic_code: "1.6"
  - front: "Weber's law → statement"
    back: |
      To be noticed as different, two stimuli must differ by a constant proportion of the original, not a constant amount.
    topic_code: "1.6"
  - front: "Signal detection theory → main idea"
    back: |
      Whether we detect a faint stimulus depends on its strength and on our expectations, motivation, experience and alertness.
    topic_code: "1.6"
  - front: "Signal detection → hit, miss, false alarm, correct rejection"
    back: |
      Hit: signal present, "yes". Miss: present, "no". False alarm: absent, "yes". Correct rejection: absent, "no".
    topic_code: "1.6"
  - front: "Sensory adaptation → definition"
    back: |
      Reduced sensitivity to a constant, unchanging stimulus, such as no longer noticing the smell of your own home.
    topic_code: "1.6"
  - front: "Sensory interaction → example"
    back: |
      Smell shaping taste: food tastes bland when your nose is blocked.
    topic_code: "1.6"
  - front: "Synesthesia → definition"
    back: |
      Stimulation of one sense produces an experience in another, such as seeing specific colors for numbers or sounds.
    topic_code: "1.6"
  - front: "Wavelength and amplitude of light → what each determines"
    back: |
      Wavelength determines hue (color); amplitude determines brightness.
    topic_code: "1.6"
  - front: "Lens → accommodation"
    back: |
      The lens changes shape to focus images of near or far objects on the retina.
    topic_code: "1.6"
  - front: "Nearsightedness vs farsightedness"
    back: |
      Nearsighted: image focuses in front of the retina, so distant objects blur. Farsighted: focuses behind it, so near objects blur.
    topic_code: "1.6"
  - front: "Rods → features"
    back: |
      About 120 million per eye, mostly in the periphery; work in dim light and detect black, white, gray and motion.
    topic_code: "1.6"
  - front: "Cones → features"
    back: |
      About 6 million per eye, concentrated in the fovea; detect color and fine detail in good light.
    topic_code: "1.6"
  - front: "Fovea → definition"
    back: |
      The central point of focus on the retina, packed with cones.
    topic_code: "1.6"
  - front: "Blind spot → cause"
    back: |
      Where the optic nerve leaves the eye there are no rods or cones, so no image is detected there.
    topic_code: "1.6"
  - front: "Path from receptor to brain (vision)"
    back: |
      Rods and cones → bipolar cells → ganglion cells → optic nerve → thalamus → visual cortex in the occipital lobe.
    topic_code: "1.6"
  - front: "Trichromatic theory → claim"
    back: |
      Three types of cones, most sensitive to short (blue), medium (green) and long (red) wavelengths, combine to produce all colors (Young–Helmholtz).
    topic_code: "1.6"
  - front: "Opponent-process theory → claim"
    back: |
      After the cones, visual cells work in opposing pairs (red–green, blue–yellow, black–white); it explains afterimages (Hering).
    topic_code: "1.6"
  - front: "Afterimage → example and explanation"
    back: |
      Stare at red, then look at white and see green: the fatigued red response rebounds to its opponent.
    topic_code: "1.6"
  - front: "Dichromatism vs monochromatism"
    back: |
      Dichromatism: one of the three cone types missing or not working, often red–green confusion, more common in males. Monochromatism: no color vision, very rare.
    topic_code: "1.6"
  - front: "Prosopagnosia → definition"
    back: |
      Face blindness: inability to recognize faces, even familiar ones, despite normal vision.
    topic_code: "1.6"
  - front: "Blindsight → definition"
    back: |
      After visual cortex damage, people report seeing nothing in part of the visual field yet respond to objects there above chance.
    topic_code: "1.6"
  - front: "Frequency and amplitude of sound → what each determines"
    back: |
      Frequency determines pitch; amplitude determines loudness (measured in decibels).
    topic_code: "1.6"
  - front: "Path of sound through the ear"
    back: |
      Outer ear → eardrum → hammer, anvil, stirrup → oval window → cochlea fluid → basilar membrane and hair cells → auditory nerve.
    topic_code: "1.6"
  - front: "Place theory vs frequency theory"
    back: |
      Place: pitch depends on where the basilar membrane vibrates (explains high pitches). Frequency: the nerve fires at the sound's frequency (explains low pitches).
    topic_code: "1.6"
  - front: "Volley theory → claim"
    back: |
      Groups of auditory neurons fire in alternating turns so together they can code frequencies higher than one neuron can fire.
    topic_code: "1.6"
  - front: "Conductive vs sensorineural hearing loss"
    back: |
      Conductive: mechanical damage to the eardrum or middle-ear bones. Sensorineural: damage to hair cells or the auditory nerve, often from noise or aging.
    topic_code: "1.6"
  - front: "Five basic tastes"
    back: |
      Sweet, salty, sour, bitter and umami (savory).
    topic_code: "1.6"
  - front: "Supertasters → definition"
    back: |
      People with more taste buds than average who experience tastes, especially bitter, more intensely.
    topic_code: "1.6"
  - front: "Gate-control theory → claim"
    back: |
      A neural "gate" in the spinal cord lets pain signals through or blocks them; large-fiber activity and messages from the brain can close it (Melzack and Wall, 1965).
    topic_code: "1.6"
  - front: "Phantom limb sensations → explanation"
    back: |
      After amputation, brain areas that represented the limb keep generating sensations, including pain, without input from it.
    topic_code: "1.6"
  - front: "Kinesthesis vs vestibular sense"
    back: |
      Kinesthesis: position and movement of body parts (receptors in muscles and joints). Vestibular: head position and balance (semicircular canals in the inner ear).
    topic_code: "1.6"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on Topic 1.6 (thresholds, signal detection, adaptation, vision,
    hearing, taste, smell, touch, pain and the body senses), with 6 questions (27%) reviewing weeks 1 to 5. Opens
    with a shared-context set on an invented hearing-test data table and ends with an Evidence-Based Question.
    Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented signal detection table (1.6)
    - slug: appsych-u01-w06-q01
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 3"
      points: 1
      stimulus: |
        A hypothetical hearing study (invented for this course). Two listeners each completed 200 trials. On 100 trials a very faint tone was played; on the other 100 there was silence. On every trial the listener said "yes" (tone) or "no" (no tone).

        | Listener | Hits (yes when tone played) | False alarms (yes when silent) |
        |---|---|---|
        | Listener A | 82 | 30 |
        | Listener B | 61 | 4 |
      prompt: |
        Which statement best describes the difference between the two listeners?
      options:
        - "Listener A says yes more readily, detecting more tones but also reporting more tones that were not there."
        - "Listener A has better hearing in every way, because A has more hits."
        - "Listener B has more misses and more false alarms than Listener A."
        - "The two listeners responded in the same way."
      option_explanations:
        - |
          Correct. A has more hits (82 versus 61) and far more false alarms (30 versus 4), the pattern of a more liberal response criterion.
        - |
          More hits alone do not show better hearing; A's 30 false alarms show A also says yes when no tone is present.
        - |
          B has more misses (39 versus 18) but far fewer false alarms (4 versus 30).
        - |
          The hit and false-alarm counts differ greatly, so the listeners used different response criteria.
      answer: 0
    - slug: appsych-u01-w06-q02
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 3"
      points: 1
      stimulus: |
        A hypothetical hearing study (invented for this course). Two listeners each completed 200 trials. On 100 trials a very faint tone was played; on the other 100 there was silence. On every trial the listener said "yes" (tone) or "no" (no tone).

        | Listener | Hits (yes when tone played) | False alarms (yes when silent) |
        |---|---|---|
        | Listener A | 82 | 30 |
        | Listener B | 61 | 4 |
      prompt: |
        How many correct rejections did Listener B make?
      options:
        - "61"
        - "39"
        - "4"
        - "96"
      option_explanations:
        - |
          61 is B's number of hits, the trials on which a tone was played and B said yes.
        - |
          39 is B's number of misses (100 tone trials − 61 hits), not correct rejections.
        - |
          4 is B's number of false alarms, the silent trials on which B wrongly said yes.
        - |
          Correct. On the 100 silent trials B said yes 4 times, so B correctly said no on 100 − 4 = 96 trials.
      answer: 3
    - slug: appsych-u01-w06-q03
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practices 1–2"
      points: 1
      stimulus: |
        A hypothetical hearing study (invented for this course). Two listeners each completed 200 trials. On 100 trials a very faint tone was played; on the other 100 there was silence. On every trial the listener said "yes" (tone) or "no" (no tone).

        | Listener | Hits (yes when tone played) | False alarms (yes when silent) |
        |---|---|---|
        | Listener A | 82 | 30 |
        | Listener B | 61 | 4 |
      prompt: |
        The researchers repeat the test with Listener B, now paying a bonus for every hit and charging nothing for false alarms. According to signal detection theory, what should happen?
      options:
        - "B's absolute threshold for the tone will physically change."
        - "B will say yes more readily, so both hits and false alarms will rise."
        - "B's hits will rise and false alarms will fall to zero."
        - "Nothing, because detection depends only on the strength of the tone."
      option_explanations:
        - |
          The bonus changes B's willingness to say yes, not the sensitivity of B's ears.
        - |
          Correct. Motivation shifts the response criterion: rewarding hits makes B more liberal, raising hits and false alarms together.
        - |
          A more liberal criterion means more yes responses on silent trials too, so false alarms rise rather than fall.
        - |
          Signal detection theory holds that detection depends on the person's motivation and expectations as well as stimulus strength.
      answer: 1
    # ---- Independent items
    - slug: appsych-u01-w06-q04
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 1
      prompt: |
        Where in the eye does transduction of light into neural signals take place?
      options:
        - "In the cornea"
        - "In the lens"
        - "In the rods and cones of the retina"
        - "In the optic nerve"
      option_explanations:
        - |
          The cornea bends light as it enters the eye but does not convert it into neural signals.
        - |
          The lens focuses light on the retina; it contains no receptor cells.
        - |
          Correct. Rods and cones are the receptor cells that convert light energy into neural signals.
        - |
          The optic nerve carries signals that have already been transduced; it does not detect light.
      answer: 2
    - slug: appsych-u01-w06-q05
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 1
      prompt: |
        On a dark hike, Zoe notices that a faint trail marker is easier to see when she looks slightly to the side of it than straight at it. Why?
      options:
        - "Cones in the fovea work best in dim light."
        - "Rods, concentrated outside the fovea, work best in dim light."
        - "The blind spot is located at the fovea."
        - "The lens cannot accommodate in the dark."
      option_explanations:
        - |
          Cones need good light; in dim light the cone-packed fovea is not very sensitive.
        - |
          Correct. Looking to the side places the image on the periphery, where the light-sensitive rods are concentrated.
        - |
          The blind spot is where the optic nerve leaves the eye, not at the fovea.
        - |
          Accommodation concerns focusing near and far; it does not explain better sensitivity off-center in dim light.
      answer: 1
    - slug: appsych-u01-w06-q06
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 1
      prompt: |
        After staring at a red, black and green flag for a minute and then looking at a white wall, Sam sees a green, white and red flag. Which theory best explains this?
      options:
        - "Opponent-process theory"
        - "Trichromatic theory"
        - "Place theory"
        - "Gate-control theory"
      option_explanations:
        - |
          Correct. Fatiguing the red, black and green responses lets their opponents (green, white and red) rebound, producing the afterimage.
        - |
          Trichromatic theory explains color detection by three cone types but does not explain why afterimages appear in opposing colors.
        - |
          Place theory explains how pitch is coded on the basilar membrane, not visual afterimages.
        - |
          Gate-control theory explains how pain signals are blocked or let through, not color vision.
      answer: 0
    - slug: appsych-u01-w06-q07
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 3"
      points: 1
      prompt: |
        In a hypothetical lab task, a participant can just tell that a 200-gram package is lighter than a 204-gram package. According to Weber's law, about how much heavier than 600 grams must a package be for her to notice the difference?
      options:
        - "4 grams"
        - "2 grams"
        - "8 grams"
        - "12 grams"
      option_explanations:
        - |
          4 grams treats the difference threshold as a fixed amount; Weber's law says it is a constant proportion.
        - |
          2 grams is smaller than the original 4-gram difference; a heavier package needs a larger change, not a smaller one.
        - |
          8 grams doubles the difference, but the weight tripled, so the change must triple as well.
        - |
          Correct. 4 of 200 grams is 2%, and 2% of 600 grams is 12 grams.
      answer: 3
    - slug: appsych-u01-w06-q08
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 1
      prompt: |
        A drummer who has played loud concerts for 20 years without ear protection now has trouble hearing high-pitched sounds. Which type of hearing loss is most likely, and what was damaged?
      options:
        - "Conductive; the eardrum was punctured"
        - "Conductive; the middle-ear bones stiffened"
        - "Sensorineural; hair cells in the cochlea were damaged"
        - "Sensorineural; the semicircular canals were damaged"
      option_explanations:
        - |
          Conductive loss is mechanical damage to the outer or middle ear, and nothing suggests a punctured eardrum.
        - |
          Stiff middle-ear bones cause conductive loss, which is not the typical result of long noise exposure.
        - |
          Correct. Repeated loud noise damages the hair cells of the cochlea, causing sensorineural hearing loss, often first for high pitches.
        - |
          The semicircular canals serve balance (the vestibular sense), not hearing.
      answer: 2
    - slug: appsych-u01-w06-q09
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1 (spiral review)"
      points: 1
      prompt: |
        Just as he drifts off, Omar feels as if he is falling and jerks awake. In which stage of sleep was he most likely?
      options:
        - "NREM stage 1"
        - "NREM stage 3"
        - "REM sleep"
        - "NREM stage 2, with sleep spindles"
      option_explanations:
        - |
          Correct. Sensations of falling or fleeting images (hypnagogic sensations) are typical of light NREM 1 sleep as one drifts off.
        - |
          NREM 3 is deep sleep reached later in the first cycle; people woken from it are groggy, not jolted awake by a falling sensation.
        - |
          REM does not usually occur just as someone falls asleep (an exception is narcolepsy), and its muscle paralysis prevents jerking.
        - |
          Stage 2 follows stage 1; the falling sensation marks the transition from wakefulness, which is stage 1.
      answer: 0
    - slug: appsych-u01-w06-q10
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 1
      prompt: |
        A high-pitched whistle causes the greatest vibration near the base of the basilar membrane, close to the cochlea's entrance. Which theory of pitch does this observation support?
      options:
        - "Frequency theory"
        - "Volley theory"
        - "Place theory"
        - "Opponent-process theory"
      option_explanations:
        - |
          Frequency theory explains pitch by the rate of neural firing, not by where on the membrane vibration peaks.
        - |
          Volley theory explains how groups of neurons together code frequencies faster than one neuron can fire; it does not concern location.
        - |
          Correct. Place theory says different pitches stimulate different places on the basilar membrane, and it explains high pitches best.
        - |
          Opponent-process theory explains color vision and afterimages, not pitch.
      answer: 2
    - slug: appsych-u01-w06-q11
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1 (spiral review)"
      points: 1
      prompt: |
        Signals from the eyes, ears, tongue and skin are routed to the correct areas of the cortex by one brain structure; smell is the exception. Which structure?
      options:
        - "The hypothalamus"
        - "The thalamus"
        - "The cerebellum"
        - "The amygdala"
      option_explanations:
        - |
          The hypothalamus regulates hunger, thirst and temperature; it does not relay sensory information to the cortex.
        - |
          Correct. The thalamus is the sensory relay station for every sense except smell.
        - |
          The cerebellum coordinates movement and balance; it is not the main relay for incoming senses.
        - |
          The amygdala is involved in emotion, especially fear; it does not route sensory signals to the cortex.
      answer: 1
    - slug: appsych-u01-w06-q12
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 1
      prompt: |
        After banging his knee on a desk, Eli rubs it hard and the pain eases. Which theory best explains this?
      options:
        - "Signal detection theory"
        - "Trichromatic theory"
        - "Frequency theory"
        - "Gate-control theory"
      option_explanations:
        - |
          Signal detection theory concerns detecting faint stimuli and response criteria, not why rubbing reduces pain.
        - |
          Trichromatic theory concerns three types of cones and color vision.
        - |
          Frequency theory concerns how low pitches are coded by neural firing rates.
        - |
          Correct. Rubbing stimulates large fibers that help close the spinal "gate", blocking some pain signals from reaching the brain.
      answer: 3
    - slug: appsych-u01-w06-q13
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 1
      prompt: |
        When Mia first enters her grandmother's house she notices a strong smell of cinnamon, but after twenty minutes she no longer notices it. What explains this?
      options:
        - "Sensory interaction"
        - "Synesthesia"
        - "Transduction failure"
        - "Sensory adaptation"
      option_explanations:
        - |
          Sensory interaction is one sense influencing another, such as smell affecting taste; here one sense simply fades.
        - |
          Synesthesia is one sense triggering an experience in another; nothing like that is described.
        - |
          Her nose still works; it has adapted to a constant smell, and a new smell would be noticed.
        - |
          Correct. Receptors respond less to a constant, unchanging stimulus, so she stops noticing the cinnamon.
      answer: 3
    - slug: appsych-u01-w06-q14
      type: multi_select
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about cones are true? Select all that apply.
      options:
        - "They are concentrated in the fovea."
        - "They are more numerous than rods."
        - "They allow us to see color."
        - "They are best for seeing fine detail in good light."
        - "They are the main receptors for seeing in very dim light."
      option_explanations:
        - |
          Correct. The fovea, the eye's center of focus, is packed with cones.
        - |
          There are about 6 million cones and about 120 million rods in each eye.
        - |
          Correct. Three types of cones underlie color vision (trichromatic theory).
        - |
          Correct. Cones provide sharp, detailed vision when there is enough light.
        - |
          Rods are the receptors for dim light; cones need brighter light.
      answer: [0, 2, 3]
    - slug: appsych-u01-w06-q15
      type: multi_select
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1 (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the chemistry of pain are accurate? Select all that apply.
      options:
        - "Substance P helps transmit pain signals."
        - "Endorphins are the body's natural painkillers."
        - "Opioid drugs such as morphine act on the same receptors as endorphins."
        - "GABA is the neurotransmitter that carries pain signals to the brain."
        - "Tolerance to opioids means a smaller dose produces a stronger effect."
      option_explanations:
        - |
          Correct. Substance P is a neurotransmitter involved in transmitting pain.
        - |
          Correct. Endorphins reduce pain and can produce pleasure, for example during strenuous exercise.
        - |
          Correct. Opioids are agonists at endorphin receptors, which is how they relieve pain.
        - |
          GABA is the main inhibitory neurotransmitter; substance P, not GABA, is the pain transmitter.
        - |
          Tolerance is the opposite: a larger dose is needed for the same effect.
      answer: [0, 1, 2]
    - slug: appsych-u01-w06-q16
      type: true_false
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 1
      prompt: |
        True or false: The semicircular canals of the inner ear provide the vestibular sense, which monitors head position and balance.
      answer: true
      explanation: |
        True. Fluid moving in the semicircular canals and vestibular sacs signals head movement and position. After spinning, the fluid keeps moving briefly, which is why you feel dizzy.
    - slug: appsych-u01-w06-q17
      type: true_false
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 3 (spiral review)"
      points: 1
      prompt: |
        True or false: A hypothetical study reports that a new earplug design reduced hearing damage, p = .20. By the usual standard in psychology, this result is statistically significant.
      answer: false
      explanation: |
        False. Psychologists usually require p less than .05. A p-value of .20 means a difference this large would occur by chance alone fairly often, so the result is not statistically significant.
    - slug: appsych-u01-w06-q18
      type: fill_blank
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 1
      prompt: |
        The process by which hair cells in the cochlea convert vibrations into neural signals is called ____.
      answer: ["transduction", "sensory transduction"]
      explanation: |
        Transduction converts one form of energy into neural signals. In the ear, bending hair cells transduce fluid vibrations; in the eye, rods and cones transduce light.
    - slug: appsych-u01-w06-q19
      type: fill_blank
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1 (spiral review)"
      points: 1
      prompt: |
        Sensory nerves that carry information from the eyes, ears and skin toward the central nervous system are called ____ nerves.
      answer: ["afferent", "sensory"]
      explanation: |
        Afferent (sensory) pathways carry information in toward the central nervous system; efferent (motor) pathways carry commands out.
    - slug: appsych-u01-w06-q20
      type: short_answer
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practice 1"
      points: 3
      prompt: |
        Explain color vision.

        (a) Describe the trichromatic theory of color vision.
        (b) Describe the opponent-process theory and one observation it explains that trichromatic theory does not.
        (c) Explain why a person with red–green dichromatism may have trouble telling ripe red tomatoes from unripe green ones.
      answer: |
        (a) The retina has three kinds of cones, most sensitive to short (blue), medium (green) and long (red) wavelengths; colors are seen from the combined pattern of their activity.
        (b) After the cones, visual cells work in opposing pairs (red–green, blue–yellow, black–white), so exciting one member inhibits the other; it explains afterimages in the opposite color after staring at a color.
        (c) One of the cone types for medium or long wavelengths is missing or works differently, so red and green produce similar signals and look alike.
      explanation: |
        Three points, one per part. (a) three cone types combining. (b) opposing pairs and afterimages (or the fact that no color looks reddish-green). (c) missing or altered cone type linked to red and green looking similar.
    - slug: appsych-u01-w06-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 3
      prompt: |
        A hypothetical researcher wants to test whether drinking caffeine lowers people's absolute threshold for hearing a faint tone.

        (a) Identify the independent and dependent variables.
        (b) Give an operational definition of the dependent variable.
        (c) Explain why the study should be double-blind.
      answer: |
        (a) IV: whether participants drink caffeine (or a placebo). DV: absolute threshold for the tone.
        (b) The quietest tone volume, in decibels, that a participant detects on 50% of trials.
        (c) If participants know they had caffeine they may expect better hearing and say "yes" more readily (demand characteristics), and a tester who knows the condition may influence responses or recording (experimenter bias); keeping both unaware rules these out.
      explanation: |
        Three points, one per part. (a) both variables correct. (b) a measurable procedure, ideally the 50% detection level in decibels. (c) control of both participant expectations and experimenter bias; mentioning only one of the two still earns the point if it is explained.
    - slug: appsych-u01-w06-q22
      type: long_answer
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Practices 1, 2 and 4 (Evidence-Based Question)"
      points: 7
      stimulus: |
        Three hypothetical studies (all invented for this course).

        Source A. A survey of 300 students aged 14 to 18 at four high schools asked how many hours a day they listened to music through earbuds at high volume. Each student's hearing was tested; higher thresholds (in decibels) for high-pitched tones mean poorer hearing. The correlation between daily hours of loud listening and high-pitch thresholds was r = +0.31.

        Source B. Forty adult volunteers were randomly assigned to listen to music for one hour either at a loud volume (about 90 decibels, within workplace safety limits for that length of time) or at a moderate volume (about 70 decibels). Immediately afterward, the loud-volume group's thresholds for high-pitched tones had risen by an average of 6 decibels, compared with 1 decibel in the moderate group. The loud group's thresholds returned to normal within a day. Participants gave informed consent and could stop at any time.

        Source C. A case study describes a 52-year-old professional drummer who never wore ear protection. Tests showed severe loss of hearing for high-pitched sounds in both ears, while hearing for low-pitched sounds was close to normal.
      prompt: |
        Answer each part using the sources.

        (A) Propose a defensible claim about loud sound and hearing.
        (B)(i) Support your claim with evidence from one source.
        (B)(ii) Explain how the evidence supports your claim, using a psychological concept. (2 points)
        (C)(i) Support your claim with evidence from a different source.
        (C)(ii) Explain how this evidence supports your claim, using a different psychological concept from (B)(ii). (2 points)
      answer: |
        (A) Claim: Exposure to loud sound harms hearing, especially for high-pitched sounds.
        (B)(i) Source B: volunteers randomly assigned to an hour of loud music had their high-pitch thresholds rise by 6 decibels, compared with 1 decibel for moderate volume.
        (B)(ii) Because of random assignment, the groups were alike beforehand, so the rise in threshold (a raised absolute threshold, meaning a tone has to be louder to be detected) can be attributed to the loud music; loud sound caused at least a temporary loss.
        (C)(i) Source C: the drummer exposed to loud sound for decades has severe high-pitch loss with near-normal low-pitch hearing.
        (C)(ii) Years of loud sound likely damaged the hair cells of the cochlea, causing sensorineural hearing loss; by place theory, high pitches are coded near the base of the basilar membrane, which fits a loss limited to high pitches.
      explanation: |
        Seven points. (A) 1 point: a defensible claim the sources can support. (B)(i) 1 point: accurate evidence from one source. (B)(ii) 2 points: 1 for explaining how the evidence supports the claim, 1 for correctly using a psychological concept (absolute threshold, random assignment, experiment, sensorineural hearing loss, and so on). (C)(i) 1 point: accurate evidence from a different source. (C)(ii) 2 points: 1 for the explanation, 1 for a different, correctly used concept (hair cells, place theory, case study, correlation, and so on). Source A also works, if the explanation notes that a correlation of +0.31 is a weak-to-moderate positive relationship that cannot by itself show cause.
