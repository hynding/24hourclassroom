unit: 1
description: |
  45 questions · about 90 minutes · every topic of Unit 1 (1.1 to 1.6): heredity and environment, the nervous
  system's divisions, neurons, neurotransmitters, hormones and drugs, the brain and how it is studied, sleep and
  dreams, and sensation, with research methods, ethics and statistics throughout. Includes three shared-context
  sets (three questions on an invented twin and adoption table, three on four invented stroke patients, three on
  an invented study of shift workers), select-all, true/false and fill-in-the-blank items, a short-answer
  question (3 points) and the two free-response types of the AP exam (7 points each): an Article Analysis
  Question on an invented pain study and an Evidence-Based Question on three invented sleep studies. Multiple
  choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
  automatically; the short answer and the free-response questions are graded by your teacher against the
  scoring notes.
questions:
  # ---- Stimulus set A: an invented twin and adoption table (1.1)
  - slug: appsych-u01-exam-q01
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; CED Topic 1.1, Practice 3"
    points: 1
    stimulus: |
      A hypothetical study (invented for this course) measured "persistence" (how long people keep working on a hard puzzle, in minutes) in pairs of relatives. The table shows the correlation between the two members of each kind of pair.

      | Kind of pair | Number of pairs | Correlation (r) |
      |---|---|---|
      | Identical twins raised together | 150 | +0.72 |
      | Identical twins raised apart | 40 | +0.68 |
      | Fraternal twins raised together | 150 | +0.41 |
      | Biological siblings raised together | 120 | +0.39 |
      | Unrelated adoptive siblings raised together | 80 | +0.06 |
    prompt: |
      Which comparison gives the strongest evidence that genes influence persistence?
    options:
      - "Fraternal twins raised together compared with biological siblings raised together"
      - "Identical twins raised together compared with identical twins raised apart"
      - "Identical twins raised apart compared with unrelated adoptive siblings raised together"
      - "Biological siblings raised together compared with fraternal twins raised together"
    option_explanations:
      - |
        Fraternal twins and ordinary siblings share about the same proportion of genes and both share a home, so this comparison isolates neither influence.
      - |
        These pairs share the same genes; the comparison shows how much a shared home adds (very little), not how much genes matter.
      - |
        Correct. Pairs who share genes but not a home (r = +0.68) are far more alike than pairs who share a home but not genes (r = +0.06).
      - |
        Both kinds of pair share about half their genes and a home, so their similar correlations reveal little about genes.
    answer: 2
  - slug: appsych-u01-exam-q02
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; CED Topic 1.1, Practice 3"
    points: 1
    stimulus: |
      A hypothetical study (invented for this course) measured "persistence" (how long people keep working on a hard puzzle, in minutes) in pairs of relatives. The table shows the correlation between the two members of each kind of pair.

      | Kind of pair | Number of pairs | Correlation (r) |
      |---|---|---|
      | Identical twins raised together | 150 | +0.72 |
      | Identical twins raised apart | 40 | +0.68 |
      | Fraternal twins raised together | 150 | +0.41 |
      | Biological siblings raised together | 120 | +0.39 |
      | Unrelated adoptive siblings raised together | 80 | +0.06 |
    prompt: |
      What does the correlation of +0.06 for unrelated adoptive siblings suggest?
    options:
      - "Growing up in the same home does little to make people similar in persistence."
      - "Adoptive siblings are strongly alike in persistence."
      - "Persistence is caused entirely by the home environment."
      - "Adopted children have less persistence than biological children."
    option_explanations:
      - |
        Correct. Unrelated children raised together share a home but no genes, and their near-zero correlation shows the shared home adds little similarity.
      - |
        A correlation of +0.06 is almost zero, which means almost no similarity.
      - |
        If the home caused persistence, children sharing a home would be much more alike than r = +0.06.
      - |
        A correlation describes how alike pair members are, not whether one group scores higher or lower than another.
    answer: 0
  - slug: appsych-u01-exam-q03
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; CED Topic 1.1, Practice 4"
    points: 1
    stimulus: |
      A hypothetical study (invented for this course) measured "persistence" (how long people keep working on a hard puzzle, in minutes) in pairs of relatives. The table shows the correlation between the two members of each kind of pair.

      | Kind of pair | Number of pairs | Correlation (r) |
      |---|---|---|
      | Identical twins raised together | 150 | +0.72 |
      | Identical twins raised apart | 40 | +0.68 |
      | Fraternal twins raised together | 150 | +0.41 |
      | Biological siblings raised together | 120 | +0.39 |
      | Unrelated adoptive siblings raised together | 80 | +0.06 |
    prompt: |
      From these data the researchers estimate the heritability of persistence at about 0.6. A student concludes, "So 60% of my own persistence comes from my genes." What is wrong with the conclusion?
    options:
      - "Heritability can only be estimated from adoption studies."
      - "The heritability must be 0.72, the highest correlation in the table."
      - "Heritability shows that persistence cannot be changed by practice."
      - "Heritability describes how much of the variation among people in a population is linked to genes; it says nothing about one individual."
    option_explanations:
      - |
        Heritability is estimated from twin, adoption and family designs alike; the method is not the student's error.
      - |
        Heritability is not simply the largest correlation; in any case the student's mistake is applying a group statistic to one person.
      - |
        A heritable trait can still change with environment; this claim makes a different error, not a correction.
      - |
        Correct. Heritability is a population statistic about differences among people; it cannot be split into percentages for an individual.
    answer: 3
  # ---- Stimulus set B: four invented stroke patients (1.4)
  - slug: appsych-u01-exam-q04
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; CED Topic 1.4, Practice 1"
    points: 1
    stimulus: |
      Four hypothetical patients (invented for this course) at a neurology clinic. Each is right-handed and had a stroke that damaged one main region.

      | Patient | Main change after the stroke |
      |---|---|
      | P | Weakness in the left arm and left leg; sensation and speech normal |
      | Q | Speaks fluently but says things that make little sense, and struggles to understand others |
      | R | Cannot recognize the faces of family members, though vision tests are normal |
      | S | Unsteady walking and poorly timed movements, with no weakness |
    prompt: |
      Which region was most likely damaged in Patient P?
    options:
      - "The left motor cortex"
      - "The right motor cortex"
      - "The left somatosensory cortex"
      - "The medulla"
    option_explanations:
      - |
        The left motor cortex controls the right side of the body; P's weakness is on the left.
      - |
        Correct. Each motor cortex controls the opposite side of the body, so left-side weakness points to the right motor cortex.
      - |
        The somatosensory cortex handles touch and body position, and P's sensation is normal.
      - |
        The medulla controls heartbeat and breathing; its damage would not produce one-sided weakness alone.
    answer: 1
  - slug: appsych-u01-exam-q05
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; CED Topic 1.4, Practice 1"
    points: 1
    stimulus: |
      Four hypothetical patients (invented for this course) at a neurology clinic. Each is right-handed and had a stroke that damaged one main region.

      | Patient | Main change after the stroke |
      |---|---|
      | P | Weakness in the left arm and left leg; sensation and speech normal |
      | Q | Speaks fluently but says things that make little sense, and struggles to understand others |
      | R | Cannot recognize the faces of family members, though vision tests are normal |
      | S | Unsteady walking and poorly timed movements, with no weakness |
    prompt: |
      Which region was most likely damaged in Patient Q?
    options:
      - "Broca's area in the left frontal lobe"
      - "The occipital lobe"
      - "The hypothalamus"
      - "Wernicke's area in the left temporal lobe"
    option_explanations:
      - |
        Broca's area damage produces slow, effortful speech with comprehension largely spared, the reverse of Q's pattern.
      - |
        The occipital lobe processes vision; its damage would not cause fluent but meaningless speech.
      - |
        The hypothalamus regulates hunger, thirst and temperature, not language.
      - |
        Correct. Fluent speech with little meaning and poor understanding is the pattern of damage to Wernicke's area.
    answer: 3
  - slug: appsych-u01-exam-q06
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; CED Topic 1.4, Practice 1"
    points: 1
    stimulus: |
      Four hypothetical patients (invented for this course) at a neurology clinic. Each is right-handed and had a stroke that damaged one main region.

      | Patient | Main change after the stroke |
      |---|---|
      | P | Weakness in the left arm and left leg; sensation and speech normal |
      | Q | Speaks fluently but says things that make little sense, and struggles to understand others |
      | R | Cannot recognize the faces of family members, though vision tests are normal |
      | S | Unsteady walking and poorly timed movements, with no weakness |
    prompt: |
      Which region was most likely damaged in Patient S?
    options:
      - "The cerebellum"
      - "The amygdala"
      - "The thalamus"
      - "The prefrontal cortex"
    option_explanations:
      - |
        Correct. The cerebellum coordinates balance and the timing of movements, so its damage causes unsteadiness without weakness.
      - |
        The amygdala is involved in emotion, especially fear, not in coordinating movement.
      - |
        The thalamus relays sensory information; its damage would not mainly cause poorly timed movement.
      - |
        The prefrontal cortex supports planning and impulse control, not the coordination of walking.
    answer: 0
  # ---- Stimulus set C: an invented study of shift workers (1.5, 1.1)
  - slug: appsych-u01-exam-q07
    type: multiple_choice
    topic_code: "1.5"
    source: "Original item; CED Topic 1.5, Practice 1"
    points: 1
    stimulus: |
      A hypothetical study (invented for this course) compared 90 hospital nurses who already worked one of three schedules. Each wore a sleep monitor for two weeks and took a reaction-time test at the start of each shift.

      | Schedule | n | Mean sleep per 24 hours (hours) | Mean reaction time (ms) |
      |---|---|---|---|
      | Day shifts only | 30 | 7.1 | 255 |
      | Night shifts only | 30 | 6.4 | 271 |
      | Rotating between day and night | 30 | 5.8 | 290 |
    prompt: |
      Which concept best explains why the rotating group slept least?
    options:
      - "REM rebound"
      - "Sensory adaptation"
      - "Repeated disruption of the circadian rhythm by a constantly changing schedule"
      - "Narcolepsy caused by night work"
    option_explanations:
      - |
        REM rebound is extra REM after deprivation; it would add sleep, not explain why the rotating group sleeps least.
      - |
        Sensory adaptation is reduced sensitivity to a constant stimulus, which has nothing to do with sleep schedules.
      - |
        Correct. Rotating shifts keep pushing the body clock out of step with the sleep schedule, so the clock never settles and sleep suffers.
      - |
        Narcolepsy is a neurological disorder of sudden sleep attacks, not something produced by work schedules.
    answer: 2
  - slug: appsych-u01-exam-q08
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; CED Topic 1.1, Practice 2"
    points: 1
    stimulus: |
      A hypothetical study (invented for this course) compared 90 hospital nurses who already worked one of three schedules. Each wore a sleep monitor for two weeks and took a reaction-time test at the start of each shift.

      | Schedule | n | Mean sleep per 24 hours (hours) | Mean reaction time (ms) |
      |---|---|---|---|
      | Day shifts only | 30 | 7.1 | 255 |
      | Night shifts only | 30 | 6.4 | 271 |
      | Rotating between day and night | 30 | 5.8 | 290 |
    prompt: |
      Why can't the researchers conclude that the rotating schedule caused the slower reaction times?
    options:
      - "Reaction time cannot be measured in milliseconds."
      - "The nurses were not randomly assigned to schedules, so the groups may differ in other ways, such as age or experience."
      - "The groups had equal numbers of nurses."
      - "Sleep monitors record only REM sleep."
    option_explanations:
      - |
        Milliseconds are a standard, precise unit for reaction time; measurement is not the problem.
      - |
        Correct. The nurses chose or were given schedules before the study, so differences in age, health or experience could explain the results.
      - |
        Equal group sizes help comparison; they do not prevent a causal conclusion.
      - |
        Sleep monitors estimate total sleep; nothing in the study depends on recording REM alone.
    answer: 1
  - slug: appsych-u01-exam-q09
    type: multiple_choice
    topic_code: "1.5"
    source: "Original item; CED Topic 1.5, Practice 3"
    points: 1
    stimulus: |
      A hypothetical study (invented for this course) compared 90 hospital nurses who already worked one of three schedules. Each wore a sleep monitor for two weeks and took a reaction-time test at the start of each shift.

      | Schedule | n | Mean sleep per 24 hours (hours) | Mean reaction time (ms) |
      |---|---|---|---|
      | Day shifts only | 30 | 7.1 | 255 |
      | Night shifts only | 30 | 6.4 | 271 |
      | Rotating between day and night | 30 | 5.8 | 290 |
    prompt: |
      Which statement accurately describes the data?
    options:
      - "As mean sleep increases across the groups, mean reaction time also increases."
      - "Every nurse on rotating shifts reacted more slowly than every nurse on day shifts."
      - "The night group slept 1.3 hours less than the day group."
      - "The group with the least sleep had the slowest mean reaction time, 35 ms slower than the day group."
    option_explanations:
      - |
        The reverse: groups with more sleep had lower (faster) mean reaction times.
      - |
        Means describe groups; some rotating-shift nurses may have reacted faster than some day-shift nurses.
      - |
        7.1 − 6.4 = 0.7 hours, not 1.3; 1.3 hours is the difference between the day and rotating groups.
      - |
        Correct. The rotating group slept least (5.8 hours) and had the slowest mean (290 ms), which is 290 − 255 = 35 ms slower than the day group.
    answer: 3
  # ---- Independent items
  - slug: appsych-u01-exam-q10
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; CED Topic 1.1, Practice 2"
    points: 1
    prompt: |
      A hypothetical researcher studies whether violent video games increase aggression in teens. Which is the best operational definition of aggression?
    options:
      - "How hostile a teen feels inside"
      - "The number of seconds a teen chooses to play a loud noise to an opponent in a lab game"
      - "Whether the teen plays violent video games"
      - "A tendency to act in harmful ways"
    option_explanations:
      - |
        Inner hostility is a concept, not a procedure; it does not say how aggression will be measured.
      - |
        Correct. It states a measurable procedure that turns aggression into a number.
      - |
        Playing violent games is the independent variable, not the measure of aggression.
      - |
        This is a conceptual definition; an operational definition must state how the variable is measured.
    answer: 1
  - slug: appsych-u01-exam-q11
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; CED Topic 1.1, Practice 2"
    points: 1
    prompt: |
      In a hypothetical sleep study, a researcher posts each participant's name next to their test scores on a public website. Which ethical guideline has been violated?
    options:
      - "Confidentiality"
      - "Debriefing"
      - "Random assignment"
      - "Replication"
    option_explanations:
      - |
        Correct. Participants' data must be kept private and reported without identifying them.
      - |
        Debriefing explains a study's purpose afterward; the problem here is revealing identities with data.
      - |
        Random assignment is a design feature for causal conclusions, not an ethical guideline.
      - |
        Replication means repeating a study with new participants; it is not an ethical rule.
    answer: 0
  - slug: appsych-u01-exam-q12
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; CED Topic 1.1, Practice 3"
    points: 1
    prompt: |
      Two hypothetical classes take the same reaction-time test. Both have a mean of 300 ms; Class X has a standard deviation of 15 ms and Class Y a standard deviation of 60 ms. Which statement is correct?
    options:
      - "Class Y reacted faster on average."
      - "Class X's scores have a larger range."
      - "Class Y's scores are more spread out around the mean than Class X's."
      - "The two classes have identical distributions."
    option_explanations:
      - |
        The means are equal, so neither class was faster on average.
      - |
        A smaller standard deviation means scores cluster more tightly, which usually goes with a smaller range, not a larger one.
      - |
        Correct. A larger standard deviation means scores typically fall farther from the mean.
      - |
        Equal means with different standard deviations describe different distributions.
    answer: 2
  - slug: appsych-u01-exam-q13
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; CED Topic 1.1, Practice 1"
    points: 1
    prompt: |
      Many people today find sweet, fatty foods hard to resist even though such foods are easy to get. How would an evolutionary psychologist explain this preference?
    options:
      - "Advertising has taught everyone to prefer sweet foods."
      - "The preference is learned only in childhood from parents."
      - "The preference is caused by a sleep disorder."
      - "In ancestral environments where calories were scarce, people who sought energy-rich food were more likely to survive and reproduce."
    option_explanations:
      - |
        Advertising may strengthen preferences, but it is an environmental account, not an evolutionary one.
      - |
        Learning from parents is a social-learning account; the evolutionary perspective asks about adaptation.
      - |
        Nothing links a sleep disorder to a general preference for sweet foods.
      - |
        Correct. A tendency that helped ancestors survive when food was scarce could spread through natural selection, even if it is less useful today.
    answer: 3
  - slug: appsych-u01-exam-q14
    type: multiple_choice
    topic_code: "1.2"
    source: "Original item; CED Topic 1.2, Practice 1"
    points: 1
    prompt: |
      Walking from a dark movie theater into bright sunlight, Grace's pupils narrow without her trying. Which division of the nervous system controls this change?
    options:
      - "The autonomic nervous system"
      - "The somatic nervous system"
      - "The central nervous system alone"
      - "The afferent nerves of the skin"
    option_explanations:
      - |
        Correct. Pupil size is adjusted automatically by the autonomic division, which controls internal muscles and glands.
      - |
        The somatic system controls voluntary skeletal muscles; pupil size is not under voluntary control.
      - |
        The command must travel through peripheral nerves to the eye; the central system does not act alone.
      - |
        Afferent nerves from the skin carry touch information; they do not control the pupils.
    answer: 0
  - slug: appsych-u01-exam-q15
    type: multiple_choice
    topic_code: "1.2"
    source: "Original item; CED Topic 1.2, Practice 1"
    points: 1
    prompt: |
      A rare nerve injury damages only the efferent fibers to a man's right hand. What would you expect?
    options:
      - "He can move the hand but cannot feel touch on it."
      - "He can neither feel nor move the hand, and his heart rate is affected."
      - "He can feel touch on the hand but cannot move it voluntarily."
      - "Nothing changes, because efferent fibers serve only the internal organs."
    option_explanations:
      - |
        Losing feeling would mean damage to afferent (sensory) fibers; efferent fibers carry movement commands.
      - |
        Only the efferent fibers to the hand were damaged, so feeling remains and heart rate is unaffected.
      - |
        Correct. Efferent (motor) fibers carry commands out to the muscles, so movement is lost while sensory (afferent) input remains.
      - |
        Efferent fibers carry commands to skeletal muscles as well as to organs and glands.
    answer: 2
  - slug: appsych-u01-exam-q16
    type: multiple_choice
    topic_code: "1.2"
    source: "Original item; CED Topic 1.2, Practice 1"
    points: 1
    prompt: |
      During a ten-minute slow-breathing exercise, a student's heart rate drops from 88 to 70 beats per minute. Which branch of the nervous system is most likely responsible for the drop?
    options:
      - "The sympathetic nervous system"
      - "The parasympathetic nervous system"
      - "The somatic nervous system"
      - "The reticular activating system"
    option_explanations:
      - |
        The sympathetic branch speeds the heart; a falling heart rate reflects its opposite.
      - |
        Correct. The parasympathetic branch slows the heart and calms the body; slow breathing tends to shift balance toward it.
      - |
        The somatic system controls voluntary skeletal muscles, not heart rate.
      - |
        The reticular activating system controls arousal and alertness in the brain; it is not the branch that slows the heart.
    answer: 1
  - slug: appsych-u01-exam-q17
    type: multiple_choice
    topic_code: "1.2"
    source: "Original item; CED Topic 1.2, Practice 1"
    points: 1
    prompt: |
      A person with a complete spinal cord injury in the middle of the back cannot feel a pinprick on the foot, yet the foot still withdraws when pricked. What explains the withdrawal?
    options:
      - "The brain still receives the pain message through the damaged cord."
      - "The parasympathetic nervous system moves the foot."
      - "The withdrawal is a learned habit controlled by the cortex."
      - "The reflex is handled by neurons in the spinal cord below the injury, without the brain."
    option_explanations:
      - |
        If the brain received the message, the person would feel the pinprick.
      - |
        The parasympathetic branch calms internal organs; it does not move skeletal muscles.
      - |
        Messages from the cortex cannot pass the injury, so the cortex cannot be producing the movement.
      - |
        Correct. Simple reflexes can run through the spinal cord's sensory neurons, interneurons and motor neurons below the injury.
    answer: 3
  - slug: appsych-u01-exam-q18
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; CED Topic 1.3, Practice 1"
    points: 1
    prompt: |
      Immediately after firing, a neuron cannot fire again for a brief moment, no matter how strong the input. What is this period called?
    options:
      - "The threshold"
      - "The resting potential"
      - "The refractory period"
      - "Reuptake"
    option_explanations:
      - |
        The threshold is the level of stimulation needed to fire, not the recovery time afterward.
      - |
        The resting potential is the neuron's negative charge at rest, not a period when it cannot fire.
      - |
        Correct. During the refractory period the neuron recovers and cannot produce another action potential.
      - |
        Reuptake is the reabsorption of neurotransmitter at the synapse, not a recovery period of the axon.
    answer: 2
  - slug: appsych-u01-exam-q19
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; CED Topic 1.3, Practice 1"
    points: 1
    prompt: |
      A drug prevents the sending neuron from reabsorbing dopamine. What is the most direct result?
    options:
      - "Dopamine stays in the synapse longer and keeps stimulating receptors."
      - "Dopamine receptors are blocked."
      - "The neuron stops releasing dopamine."
      - "Dopamine is converted into serotonin."
    option_explanations:
      - |
        Correct. Blocking reuptake leaves more dopamine in the synapse, strengthening its effect; cocaine works this way.
      - |
        Blocking receptors is what an antagonist does; this drug acts on reabsorption.
      - |
        Blocking reuptake does not stop release; it keeps released dopamine active longer.
      - |
        Reuptake inhibitors do not convert one neurotransmitter into another.
    answer: 0
  - slug: appsych-u01-exam-q20
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; CED Topic 1.3, Practice 1"
    points: 1
    prompt: |
      Which neurotransmitter is the brain's main excitatory messenger, important in learning and memory, and in excess can overstimulate the brain?
    options:
      - "GABA"
      - "Glutamate"
      - "Serotonin"
      - "Endorphins"
    option_explanations:
      - |
        GABA is the main inhibitory neurotransmitter, the opposite role.
      - |
        Correct. Glutamate is the main excitatory neurotransmitter; excess can overexcite neurons and is linked to migraines and seizures.
      - |
        Serotonin is linked to mood, sleep and appetite, not described as the main excitatory messenger.
      - |
        Endorphins reduce pain; they are not the brain's main excitatory neurotransmitter.
    answer: 1
  - slug: appsych-u01-exam-q21
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; CED Topic 1.3, Practice 1"
    points: 1
    prompt: |
      A hormone released in large amounts during childbirth and nursing is also linked to trust and social bonding. Which hormone is it?
    options:
      - "Leptin"
      - "Melatonin"
      - "Adrenaline"
      - "Oxytocin"
    option_explanations:
      - |
        Leptin signals fullness; it is not tied to childbirth or bonding.
      - |
        Melatonin promotes sleep; it is not tied to childbirth or bonding.
      - |
        Adrenaline prolongs the fight-or-flight response; it is not the bonding hormone.
      - |
        Correct. Oxytocin is involved in childbirth and nursing and is associated with bonding and trust.
    answer: 3
  - slug: appsych-u01-exam-q22
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; CED Topic 1.3, Practice 1"
    points: 1
    prompt: |
      Morphine, heroin and fentanyl relieve pain and produce euphoria, and in high doses dangerously slow breathing. Which drug class are they?
    options:
      - "Stimulants"
      - "Hallucinogens"
      - "Opioids"
      - "Depressants of the GABA type, like alcohol"
    option_explanations:
      - |
        Stimulants speed up neural activity and raise heart rate; these drugs do the opposite.
      - |
        Hallucinogens chiefly distort perception; these drugs mainly relieve pain.
      - |
        Correct. Opioids act on the brain's endorphin receptors, relieving pain and slowing breathing.
      - |
        These drugs also slow body functions, but they belong to the opioid class, acting on endorphin receptors rather than boosting GABA.
    answer: 2
  - slug: appsych-u01-exam-q23
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; CED Topic 1.4, Practices 1–2"
    points: 1
    prompt: |
      In a hypothetical lesion study approved by an animal care committee, monkeys with a small region of the brain removed no longer show fear of a rubber snake that frightens other monkeys. Which region was most likely lesioned?
    options:
      - "The amygdala"
      - "The cerebellum"
      - "The occipital lobe"
      - "The medulla"
    option_explanations:
      - |
        Correct. The amygdala is central to fear responses, so its removal reduces fear of threats.
      - |
        The cerebellum coordinates movement; its loss would cause clumsiness, not fearlessness.
      - |
        Removing the occipital lobe would impair vision; the monkeys must see the snake to react to it at all.
      - |
        The medulla controls heartbeat and breathing; removing it would threaten survival.
    answer: 0
  - slug: appsych-u01-exam-q24
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; CED Topic 1.4, Practice 2"
    points: 1
    prompt: |
      A researcher wants to know how many milliseconds after a surprising sound the brain's electrical response begins. Which tool is best?
    options:
      - "fMRI"
      - "EEG"
      - "CT scan"
      - "Case study"
    option_explanations:
      - |
        fMRI locates activity well but tracks slower blood-oxygen changes, so it cannot time responses to the millisecond.
      - |
        Correct. EEG records electrical activity with millisecond precision.
      - |
        A CT scan shows brain structure, not moment-to-moment activity.
      - |
        A case study describes one person in depth; it does not measure brain timing.
    answer: 1
  - slug: appsych-u01-exam-q25
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; CED Topic 1.4, Practice 1"
    points: 1
    prompt: |
      Researchers note that the brain region supporting planning, judgment and impulse control is among the last to mature, continuing into the twenties. Which region is it?
    options:
      - "The hippocampus"
      - "The somatosensory cortex"
      - "The prefrontal cortex"
      - "The thalamus"
    option_explanations:
      - |
        The hippocampus helps form new memories, not plan and control impulses.
      - |
        The somatosensory cortex processes touch and body position.
      - |
        Correct. The prefrontal cortex supports executive functions and is one of the last regions to fully mature.
      - |
        The thalamus relays sensory information to the cortex.
    answer: 2
  - slug: appsych-u01-exam-q26
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; CED Topic 1.4, Practice 1"
    points: 1
    prompt: |
      On a map of the somatosensory cortex, the lips and fingertips take up far more space than the back. Why?
    options:
      - "The back has no touch receptors."
      - "The lips and fingertips are controlled by the cerebellum."
      - "The back is represented only in the motor cortex."
      - "Body areas with greater sensitivity have more receptors and more cortex devoted to them."
    option_explanations:
      - |
        The back does have touch receptors, just fewer of them per area than the fingertips.
      - |
        The cerebellum coordinates movement; the map in question is of touch sensation.
      - |
        The back is represented in the somatosensory cortex too, but in a smaller area.
      - |
        Correct. The amount of cortex tracks sensitivity, not size, so densely innervated parts get large areas.
    answer: 3
  - slug: appsych-u01-exam-q27
    type: multiple_choice
    topic_code: "1.5"
    source: "Original item; CED Topic 1.5, Practice 1"
    points: 1
    prompt: |
      Two students study the same vocabulary list at 9 p.m. One sleeps a full night; the other stays up all night. The next day, the student who slept recalls more words. Which function of sleep does this illustrate?
    options:
      - "Memory consolidation"
      - "Protection from predators"
      - "Growth hormone release"
      - "REM sleep behavior disorder"
    option_explanations:
      - |
        Correct. Sleep helps stabilize and strengthen newly learned memories.
      - |
        The protection account explains why sleep evolved at night, not why sleep improves recall.
      - |
        Growth hormone release in deep sleep supports physical growth, not vocabulary recall.
      - |
        REM sleep behavior disorder is a condition in which people act out dreams; it is not a function of sleep.
    answer: 0
  - slug: appsych-u01-exam-q28
    type: multiple_choice
    topic_code: "1.5"
    source: "Original item; CED Topic 1.5, Practice 1"
    points: 1
    prompt: |
      A 68-year-old man has started punching and kicking in his sleep, late in the night, while dreaming that he is defending himself. Which disorder fits best?
    options:
      - "Somnambulism"
      - "REM sleep behavior disorder"
      - "Insomnia"
      - "Narcolepsy"
    option_explanations:
      - |
        Sleepwalking happens in NREM 3, early in the night, and is not tied to acting out a dream.
      - |
        Correct. When the usual REM paralysis fails, the sleeper physically acts out dreams, mostly in the long REM periods late in the night.
      - |
        Insomnia is difficulty falling or staying asleep, not movement during dreams.
      - |
        Narcolepsy involves sudden sleep attacks while awake, not acting out dreams.
    answer: 1
  - slug: appsych-u01-exam-q29
    type: multiple_choice
    topic_code: "1.5"
    source: "Original item; CED Topic 1.5, Practice 1"
    points: 1
    prompt: |
      Many teens feel wide awake at 11 p.m. and groggy at 7 a.m. Which biological change best explains this?
    options:
      - "Teens have fewer REM periods than adults."
      - "Teens' reticular activating systems stop working at night."
      - "During adolescence, melatonin tends to be released later in the evening, shifting the body clock later."
      - "Teens have more NREM 3 sleep, which makes waking easier."
    option_explanations:
      - |
        The number of REM periods does not explain feeling alert late and groggy early.
      - |
        The reticular activating system keeps working; the issue is the timing of the body clock.
      - |
        Correct. A later melatonin release delays sleepiness, so teens fall asleep later and struggle with early mornings.
      - |
        More deep sleep would make waking harder, not explain alertness at 11 p.m.
    answer: 2
  - slug: appsych-u01-exam-q30
    type: multiple_choice
    topic_code: "1.5"
    source: "Original item; CED Topic 1.5, Practice 1"
    points: 1
    prompt: |
      For three months, Dana has lain awake for more than an hour most nights and wakes often before dawn, unable to fall back asleep. Which sleep disorder does this describe?
    options:
      - "Insomnia"
      - "Sleep apnea"
      - "Somnambulism"
      - "Narcolepsy"
    option_explanations:
      - |
        Correct. Persistent difficulty falling asleep or staying asleep defines insomnia.
      - |
        Sleep apnea involves repeated breathing pauses and snoring; Dana's problem is getting and staying asleep.
      - |
        Somnambulism is sleepwalking, not lying awake.
      - |
        Narcolepsy involves sudden sleep attacks during the day, the opposite of trouble sleeping.
    answer: 0
  - slug: appsych-u01-exam-q31
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; CED Topic 1.6, Practice 3"
    points: 1
    prompt: |
      In a hypothetical vision test, a participant detects a dim light on 10% of trials at intensity 1, 30% at intensity 2, 50% at intensity 3 and 85% at intensity 4. What is the participant's absolute threshold?
    options:
      - "Intensity 1"
      - "Intensity 3"
      - "Intensity 4"
      - "Intensity 2"
    option_explanations:
      - |
        The light is detected only 10% of the time at intensity 1, well below the 50% definition.
      - |
        Correct. The absolute threshold is the intensity detected on 50% of trials.
      - |
        Intensity 4 is detected 85% of the time; the threshold is defined at 50%.
      - |
        Intensity 2 is detected only 30% of the time, below the 50% definition.
