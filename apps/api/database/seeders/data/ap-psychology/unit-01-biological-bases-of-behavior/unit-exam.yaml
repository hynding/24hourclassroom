  - slug: appsych-u01-exam-q36
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; CED Topic 1.6, Practice 1"
    points: 1
    prompt: |
      A very low bass note at 50 hertz makes the auditory nerve fire about 50 times per second. Which theory of pitch does this support?
    options:
      - "Place theory"
      - "Opponent-process theory"
      - "Gate-control theory"
      - "Frequency theory"
    option_explanations:
      - |
        Place theory codes pitch by where the basilar membrane vibrates most, and works best for high pitches.
      - |
        Opponent-process theory explains color vision and afterimages, not pitch.
      - |
        Gate-control theory explains how pain signals are let through or blocked.
      - |
        Correct. Frequency theory says the nerve fires at the same rate as the sound's frequency, which explains low pitches.
    answer: 3
  - slug: appsych-u01-exam-q37
    type: multi_select
    topic_code: "1.3"
    source: "Original item; CED Topic 1.3, Practice 1"
    points: 2
    partial_credit: true
    prompt: |
      Which statements about neural firing are accurate? Select all that apply.
    options:
      - "An action potential begins when the neuron's charge passes its threshold."
      - "Positively charged sodium ions flow into the axon during depolarization."
      - "A stronger stimulus produces a larger action potential."
      - "Myelin speeds the action potential along the axon."
      - "Neurotransmitters carry the action potential down the axon."
    option_explanations:
      - |
        Correct. Reaching threshold triggers the action potential.
      - |
        Correct. Sodium ions rushing in depolarize the membrane, creating the action potential.
      - |
        Action potentials are all-or-nothing; a stronger stimulus increases the firing rate, not the size.
      - |
        Correct. Myelin insulates the axon so the signal jumps between gaps and travels faster.
      - |
        The action potential travels electrically down the axon; neurotransmitters work at the synapse.
    answer: [0, 1, 3]
  - slug: appsych-u01-exam-q38
    type: multi_select
    topic_code: "1.6"
    source: "Original item; CED Topic 1.6, Practice 1"
    points: 2
    partial_credit: true
    prompt: |
      Which structures does sound pass through or act on on its way to becoming a neural signal? Select all that apply.
    options:
      - "Eardrum"
      - "Cochlea"
      - "Semicircular canals"
      - "Hair cells on the basilar membrane"
      - "Retina"
    option_explanations:
      - |
        Correct. Sound waves make the eardrum vibrate, passing the vibration to the middle-ear bones.
      - |
        Correct. The fluid-filled cochlea in the inner ear contains the basilar membrane and its hair cells.
      - |
        The semicircular canals sense head movement for balance; they are not part of the hearing pathway.
      - |
        Correct. Hair cells bend with the basilar membrane and transduce vibration into neural signals.
      - |
        The retina is in the eye, where light is transduced.
    answer: [0, 1, 3]
  - slug: appsych-u01-exam-q39
    type: true_false
    topic_code: "1.4"
    source: "Original item; CED Topic 1.4, Practice 1"
    points: 1
    prompt: |
      True or false: In most people, the left hemisphere plays the larger role in producing and understanding language.
    answer: true
    explanation: |
      True. Broca's and Wernicke's areas are usually in the left hemisphere, which is why split-brain patients can usually name only objects shown to the right visual field. The right hemisphere still contributes, for example to emotional tone.
  - slug: appsych-u01-exam-q40
    type: true_false
    topic_code: "1.5"
    source: "Original item; CED Topic 1.5, Practice 1"
    points: 1
    prompt: |
      True or false: Sleepwalking usually occurs during REM sleep, when dreams are most vivid.
    answer: false
    explanation: |
      False. Sleepwalking happens during deep NREM stage 3 sleep, mostly early in the night. During REM the large muscles are normally paralyzed.
  - slug: appsych-u01-exam-q41
    type: fill_blank
    topic_code: "1.2"
    source: "Original item; CED Topic 1.2, Practice 1"
    points: 1
    prompt: |
      The division of the peripheral nervous system that controls voluntary movements of the skeletal muscles is the ____ nervous system.
    answer: ["somatic", "somatic nervous system"]
    explanation: |
