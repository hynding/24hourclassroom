  - slug: appsych-u01-exam-q32
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; CED Topic 1.6, Practice 1"
    points: 1
    prompt: |
      An infection leaves scar tissue that stiffens the tiny bones of a child's middle ear, and sounds seem muffled. Which kind of hearing loss is this?
    options:
      - "Sensorineural hearing loss caused by damaged hair cells"
      - "Sensorineural hearing loss caused by a damaged auditory nerve"
      - "Damage to the vestibular sense"
      - "Conductive hearing loss"
    option_explanations:
      - |
        Hair cells are in the inner ear; the problem described is in the middle ear's bones.
      - |
        The auditory nerve is undamaged here; the problem is the mechanical conduction of sound.
      - |
        The vestibular sense concerns balance, not muffled hearing.
      - |
        Correct. Damage to the mechanical parts that carry sound to the cochlea (eardrum or middle-ear bones) causes conductive hearing loss.
    answer: 3
  - slug: appsych-u01-exam-q33
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; CED Topic 1.6, Practice 1"
    points: 1
    prompt: |
      With a bad cold and a blocked nose, Theo says his favorite soup "tastes like nothing". Which concept explains this?
    options:
      - "Sensory adaptation"
      - "Transduction"
      - "Sensory interaction"
      - "Synesthesia"
    option_explanations:
      - |
        Adaptation is reduced response to a constant stimulus; Theo's soup tastes flat from the first sip.
      - |
        Transduction is converting energy into neural signals; it does not explain why one sense changes another.
      - |
        Correct. Flavor depends heavily on smell, so blocking smell changes what he tastes.
      - |
        Synesthesia is one sense triggering an experience in another, such as seeing colors for sounds.
    answer: 2
  - slug: appsych-u01-exam-q34
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; CED Topic 1.6, Practice 1"
    points: 1
    prompt: |
      In a field sobriety test, a driver is asked to close his eyes and touch his nose with a fingertip. Which sense makes this possible?
    options:
      - "Kinesthesis"
      - "The vestibular sense"
      - "Olfaction"
      - "Gustation"
    option_explanations:
      - |
        Correct. Kinesthesis, from receptors in muscles, tendons and joints, tells you where your body parts are without looking.
      - |
        The vestibular sense tracks head position and balance, not the position of a fingertip relative to the nose.
      - |
        Olfaction is the sense of smell, which plays no part in locating a fingertip.
      - |
        Gustation is the sense of taste, which tells the driver nothing about where his hand is.
    answer: 0
  - slug: appsych-u01-exam-q35
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; CED Topic 1.6, Practice 1"
    points: 1
    prompt: |
      Jamal finds raw broccoli and black coffee unbearably bitter, while his friends barely notice. A taste test shows he has many more taste buds than average. Jamal is most likely a
    options:
      - "nontaster."
      - "supertaster."
      - "medium taster."
      - "person with synesthesia."
    option_explanations:
      - |
        Nontasters have fewer taste buds and notice bitterness less, the opposite of Jamal.
      - |
        Correct. Supertasters have more taste buds and experience tastes, especially bitter, more intensely.
      - |
        Most people are medium tasters, but Jamal's unusual sensitivity and extra taste buds mark him as a supertaster.
      - |
        Synesthesia is one sense triggering another; Jamal simply tastes bitterness strongly.
