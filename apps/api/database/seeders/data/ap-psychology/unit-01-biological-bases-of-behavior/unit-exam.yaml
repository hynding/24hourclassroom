  - slug: appsych-u01-exam-q42
    type: fill_blank
    topic_code: "1.6"
    source: "Original item; CED Topic 1.6, Practice 1"
    points: 1
    prompt: |
      The small central area of the retina that is packed with cones and gives the sharpest vision is the ____.
    answer: ["fovea", "the fovea", "fovea centralis"]
    explanation: |
      The fovea is the eye's point of central focus. Its dense cones give detailed color vision in good light; rods dominate the periphery.
  - slug: appsych-u01-exam-q43
    type: short_answer
    topic_code: "1.3"
    source: "Original item; CED Topic 1.3, Practice 1"
    points: 3
    prompt: |
      Two drugs both affect serotonin. Drug 1 occupies serotonin receptors without activating them. Drug 2 slows the reabsorption of serotonin by the sending neuron.

      (a) Classify each drug's action (agonist, antagonist or reuptake inhibitor).
      (b) Predict how each drug changes serotonin's effect on the receiving neuron.
      (c) Explain why one of these drugs might be used to treat depression.
    answer: |
      (a) Drug 1 is an antagonist; Drug 2 is a reuptake inhibitor.
      (b) Drug 1 weakens serotonin's effect, because serotonin cannot reach the blocked receptors. Drug 2 strengthens it, because serotonin stays in the synapse longer.
      (c) Drug 2: low serotonin activity is linked to depression, and keeping serotonin in the synapse longer increases its activity (this is how SSRIs work).
    explanation: |
      Three points, one per part. (a) both classifications correct. (b) the opposite effects for the two drugs. (c) Drug 2, linked to increased serotonin activity and its association with depression; choosing Drug 1 earns 0.
  - slug: appsych-u01-exam-q44
    type: long_answer
    topic_code: "1.6"
    source: "Original item; CED Topic 1.6, Practices 1–4 (Article Analysis Question)"
    points: 7
    stimulus: |
      A hypothetical study (invented for this course). Researchers recruited 64 adult volunteers aged 18 to 40 through advertisements in one city. All gave written informed consent and were told they could stop at any time. Each participant held one hand in cold water (about 4 °C) for as long as they could, up to 3 minutes. Participants were randomly assigned either to play an absorbing game in a virtual reality headset during the task or to sit with the headset showing a blank gray screen. Pain was measured by asking participants to rate their pain from 0 (none) to 10 (worst imaginable) at the end of the task. The game group's mean pain rating was 4.1 (SD = 1.6); the blank-screen group's mean was 6.3 (SD = 1.8). The difference was statistically significant (p = .001). Participants were told the purpose of the study afterward.
    prompt: |
      Answer each part.

      (A) Identify the research method used in this study.
      (B) State the operational definition of pain.
      (C) Describe what the means show.
      (D) Identify one ethical guideline applied in this study, with evidence.
      (E) Evaluate the extent to which these findings can be generalized to children receiving medical treatment.
      (F) Explain how the findings support or refute the claim that the brain can influence how much pain is felt, using gate-control theory. (2 points)
    answer: |
      (A) An experiment: the type of headset display was manipulated and participants were randomly assigned.
      (B) The 0-to-10 pain rating given at the end of the cold-water task.
      (C) The game group rated their pain lower on average (4.1) than the blank-screen group (6.3), a difference of 2.2 points.
      (D) Informed consent (written consent), the right to withdraw (they could stop at any time), or debriefing (told the purpose afterward).
      (E) Limited: participants were adults aged 18 to 40 from one city, and the pain was brief and lab-induced; children and medical pain may differ, so generalization to children in treatment is uncertain.
      (F) Support. The water and the time limit were the same in both groups, yet the distracted group reported less pain. Gate-control theory holds that messages from the brain, such as attention directed elsewhere, can close the spinal gate and block some pain signals, which fits the lower ratings.
    explanation: |
      Seven points. (A) 1 point: experiment. (B) 1 point: the 0-to-10 rating at the end of the task. (C) 1 point: the game group's mean pain was lower, with the numbers or a clear comparison; describing the standard deviations alone earns 0. (D) 1 point: a guideline with matching evidence. (E) 1 point: a specific sample or task feature (adults, one city, lab-induced brief pain) linked to children in medical settings. (F) 2 points: 1 for stating that the findings support the claim with the group difference; 1 for applying gate-control theory (brain messages or attention closing the spinal gate).
  - slug: appsych-u01-exam-q45
    type: long_answer
    topic_code: "1.5"
    source: "Original item; CED Topic 1.5, Practices 1, 2 and 4 (Evidence-Based Question)"
    points: 7
    stimulus: |
      Three hypothetical studies (all invented for this course).

      Source A. A survey of 1,200 students aged 14 to 18 at 10 high schools asked how many hours they slept on school nights and how many times they had fallen asleep in class in the past month. The correlation between hours of sleep and number of times falling asleep in class was r = −0.42.

      Source B. Fifty volunteers aged 16 to 18 were randomly assigned to sleep either 9 hours or 5 hours a night for five nights in a sleep laboratory. On the sixth morning, the 9-hour group recalled an average of 31 of 40 facts they had studied on day five, and the 5-hour group recalled an average of 22. Parents gave consent and the teens gave assent.

      Source C. A sleep laboratory recorded a 17-year-old over two nights, the first after a normal day and the second after two nights of only 4 hours of sleep. On the second night she entered REM sleep 35 minutes sooner and spent 40% more time in REM.
    prompt: |
      Answer each part using the sources.

      (A) Propose a defensible claim about sleep and teenagers' functioning.
      (B)(i) Support your claim with evidence from one source.
      (B)(ii) Explain how the evidence supports your claim, using a psychological concept. (2 points)
      (C)(i) Support your claim with evidence from a different source.
      (C)(ii) Explain how this evidence supports your claim, using a different psychological concept from (B)(ii). (2 points)
    answer: |
      (A) Claim: Getting too little sleep harms teenagers' learning and alertness, and the brain tries to make up for lost sleep.
      (B)(i) Source B: teens randomly assigned to 9 hours of sleep recalled 31 of 40 facts, compared with 22 for teens assigned to 5 hours.
      (B)(ii) Sleep supports memory consolidation, stabilizing newly learned information; because participants were randomly assigned, the higher recall can be attributed to the extra sleep.
      (C)(i) Source C: after two short nights, the teen entered REM 35 minutes sooner and spent 40% more time in REM.
      (C)(ii) This is REM rebound: after REM deprivation the brain increases REM, showing that lost sleep has a cost the brain works to repay.
    explanation: |
      Seven points. (A) 1 point: a defensible claim the sources can support. (B)(i) 1 point: accurate evidence from one source. (B)(ii) 2 points: 1 for explaining how the evidence supports the claim, 1 for correctly using a psychological concept (memory consolidation, random assignment, experiment, and so on). (C)(i) 1 point: accurate evidence from a different source. (C)(ii) 2 points: 1 for the explanation, 1 for a different, correctly used concept (REM rebound, case study, circadian rhythm, negative correlation, and so on). Source A also works, if the explanation treats r = −0.42 as a moderate negative relationship and does not claim it shows cause.
