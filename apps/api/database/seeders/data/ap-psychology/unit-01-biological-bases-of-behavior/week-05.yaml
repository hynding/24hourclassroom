week: 5
unit: 1
title: Sleep and Dreams
topics: ["1.5"]
guide: guides/week-05.md
guide_description: |
  Consciousness as awareness of self and surroundings, and sleep as its most regular change; circadian rhythms,
  the suprachiasmatic nucleus, light and melatonin, jet lag, shift work and the later body clock of adolescence;
  the stages of sleep (NREM 1 to 3 and REM) with their EEG patterns, the 90-minute cycle and how it changes
  across the night; the functions of sleep (restoration, memory consolidation, growth, protection), the effects
  of sleep loss and REM rebound; the activation-synthesis and consolidation theories of dreaming; and the sleep
  disorders insomnia, narcolepsy, sleep apnea, REM sleep behavior disorder and somnambulism. Worked examples: a
  night's sleep described stage by stage, and the mean, median, mode and range of an invented sleep diary.
flashcards_description: |
  30 cards on consciousness, circadian rhythms and the body clock, jet lag and shift work, the stages of sleep,
  the sleep cycle, the functions of sleep, REM rebound, theories of dreaming, and sleep disorders.

flashcards:
  - front: "Consciousness → definition"
    back: |
      Our awareness of ourselves and our environment.
    topic_code: "1.5"
  - front: "Circadian rhythm → definition"
    back: |
      The body's roughly 24-hour cycle of alertness, body temperature and hormone release.
    topic_code: "1.5"
  - front: "Suprachiasmatic nucleus → role"
    back: |
      A cluster of neurons in the hypothalamus that acts as the master body clock; light reaching the retina resets it.
    topic_code: "1.5"
  - front: "Light and melatonin → relationship"
    back: |
      Darkness lets the pineal gland release melatonin, causing sleepiness; morning light suppresses it.
    topic_code: "1.5"
  - front: "Jet lag → cause"
    back: |
      Crossing time zones faster than the circadian clock can reset; flying east is usually harder than flying west.
    topic_code: "1.5"
  - front: "Shift work → effect on sleep"
    back: |
      Puts the body clock in conflict with daylight, leading to poorer sleep, fatigue and more accidents, especially with rotating night shifts.
    topic_code: "1.5"
  - front: "Adolescent body clock → shift"
    back: |
      Melatonin tends to be released later in the evening, so teens feel alert later and sleepy in the early morning.
    topic_code: "1.5"
  - front: "NREM stage 1 → features"
    back: |
      Light sleep, easily woken; theta waves; fleeting images or a sense of falling (hypnagogic sensations).
    topic_code: "1.5"
  - front: "NREM stage 2 → features"
    back: |
      Clearly asleep; heart rate and temperature drop; sleep spindles and K-complexes on the EEG.
    topic_code: "1.5"
  - front: "NREM stage 3 → features"
    back: |
      Deep, slow-wave sleep with large delta waves; hardest to wake; growth hormone released; sleepwalking occurs here.
    topic_code: "1.5"
  - front: "REM sleep → features"
    back: |
      Rapid eye movements, vivid dreams, fast wake-like brain waves, irregular heart rate and breathing, and paralyzed large muscles.
    topic_code: "1.5"
  - front: "Paradoxical sleep → why REM is called this"
    back: |
      The brain is nearly as active as when awake, yet the body's large muscles are almost completely still.
    topic_code: "1.5"
  - front: "Sleep cycle → length and number"
    back: |
      About 90 minutes; four to six cycles in a full night.
    topic_code: "1.5"
  - front: "Sleep across the night → pattern"
    back: |
      Deep NREM 3 dominates early cycles; REM periods grow longer in later cycles.
    topic_code: "1.5"
  - front: "Alpha waves → when they appear"
    back: |
      When awake but relaxed with eyes closed, just before sleep.
    topic_code: "1.5"
  - front: "Delta waves → stage"
    back: |
      Large, slow brain waves of deep NREM stage 3 sleep.
    topic_code: "1.5"
  - front: "Restoration function of sleep"
    back: |
      Sleep helps repair the body and clear waste products that build up in the brain while awake.
    topic_code: "1.5"
  - front: "Memory consolidation → role of sleep"
    back: |
      Sleep strengthens and stabilizes the day's memories; sleeping after learning improves later recall.
    topic_code: "1.5"
  - front: "Growth and sleep → link"
    back: |
      The pituitary releases growth hormone mostly during deep sleep.
    topic_code: "1.5"
  - front: "Protection theory of sleep → idea"
    back: |
      An evolutionary account: sleeping through dark hours kept our ancestors safe and saved energy when activity was risky.
    topic_code: "1.5"
  - front: "Sleep deprivation → effects"
    back: |
      Poorer attention, memory, mood and reaction time; weaker immunity; greater risk of accidents such as drowsy driving.
    topic_code: "1.5"
  - front: "REM rebound → definition"
    back: |
      The tendency to enter REM sooner and spend more time in it after being deprived of REM sleep.
    topic_code: "1.5"
  - front: "Activation-synthesis theory → claim"
    back: |
      Dreams are the cortex's attempt to make sense of random neural activity sent up from the brainstem during REM.
    topic_code: "1.5"
  - front: "Consolidation theory of dreams → claim"
    back: |
      Dreaming reflects the brain processing, sorting and storing memories from the day.
    topic_code: "1.5"
  - front: "Insomnia → definition"
    back: |
      Persistent difficulty falling asleep or staying asleep.
    topic_code: "1.5"
  - front: "Narcolepsy → definition"
    back: |
      Sudden, uncontrollable attacks of sleep, often entering REM directly, sometimes with brief loss of muscle tone.
    topic_code: "1.5"
  - front: "Sleep apnea → definition"
    back: |
      Repeated pauses in breathing during sleep that briefly wake the sleeper; loud snoring and daytime sleepiness.
    topic_code: "1.5"
  - front: "REM sleep behavior disorder → definition"
    back: |
      The normal muscle paralysis of REM fails, so the sleeper physically acts out dreams.
    topic_code: "1.5"
  - front: "Somnambulism → definition and stage"
    back: |
      Sleepwalking: walking or doing routine actions while asleep, during deep NREM 3; more common in children.
    topic_code: "1.5"
  - front: "Sleep-stage research → how stages were identified"
    back: |
      By recording brain waves (EEG), eye movements and muscle tone through the night in a sleep laboratory.
    topic_code: "1.5"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on Topic 1.5 (consciousness, circadian rhythms, sleep stages and
    cycles, functions of sleep, dream theories and sleep disorders), with 7 questions (32%) reviewing weeks 1 to 4.
    Opens with a shared-context set on an invented sleep-diary data set. Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented sleep data set (1.5, 1.1)
    - slug: appsych-u01-w05-q01
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 3"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). Ten volunteers from one high school's student council wore a wrist monitor for a week. Their average sleep on school nights, in hours, was:

        5.5, 6.0, 6.0, 6.5, 6.5, 6.5, 7.0, 7.5, 8.0, 10.5

        The mean is 7.0 hours.
      prompt: |
        What are the median and the mode of these data?
      options:
        - "Median 7.0 hours; mode 6.0 hours"
        - "Median 6.5 hours; mode 6.5 hours"
        - "Median 6.75 hours; mode 10.5 hours"
        - "Median 8.0 hours; mode 6.5 hours"
      option_explanations:
        - |
          7.0 is the mean, not the median, and 6.0 appears only twice while 6.5 appears three times.
        - |
          Correct. With 10 ordered values the median is the average of the 5th and 6th (6.5 and 6.5), and 6.5 is also the most frequent value.
        - |
          The 5th and 6th values are both 6.5, so the median is 6.5; the mode is the most frequent value, not the largest.
        - |
          8.0 is the 9th value, not the middle; the median is the average of the two middle values.
      answer: 1
    - slug: appsych-u01-w05-q02
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 3"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). Ten volunteers from one high school's student council wore a wrist monitor for a week. Their average sleep on school nights, in hours, was:

        5.5, 6.0, 6.0, 6.5, 6.5, 6.5, 7.0, 7.5, 8.0, 10.5

        The mean is 7.0 hours.
      prompt: |
        Why is the mean higher than the median?
      options:
        - "Most of the students sleep more than 7 hours."
        - "The distribution is negatively skewed by several short sleepers."
        - "One student's 10.5 hours pulls the mean up, a positive skew."
        - "The mean and median are always different by about half an hour."
      option_explanations:
        - |
          Only three of the ten students sleep more than 7 hours; most sleep less.
        - |
          A negative skew would pull the mean below the median; here the mean is above it.
        - |
          Correct. The single high value of 10.5 hours stretches the right tail and pulls the mean above the median.
        - |
          The mean and median are equal in a symmetric distribution; their gap depends on skew and outliers.
      answer: 2
    - slug: appsych-u01-w05-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). Ten volunteers from one high school's student council wore a wrist monitor for a week. Their average sleep on school nights, in hours, was:

        5.5, 6.0, 6.0, 6.5, 6.5, 6.5, 7.0, 7.5, 8.0, 10.5

        The mean is 7.0 hours.
      prompt: |
        What is the most serious limit on generalizing these results to all teens at the school?
      options:
        - "The sample is small and drawn only from student council volunteers, who may not represent all students."
        - "Wrist monitors cannot record sleep at all."
        - "The data should have been collected on weekends only."
        - "The researchers did not use random assignment to sleep conditions."
      option_explanations:
        - |
          Correct. Ten volunteers from one group is a small convenience sample; council members may have different schedules than other students.
        - |
          Wrist monitors give a reasonable estimate of sleep time; the measuring tool is not the main problem for generalizing.
        - |
          School nights match the question being asked; collecting only weekends would make the data less relevant.
        - |
          This is a descriptive study with no conditions to assign; random assignment matters for causal claims, while generalization depends on sampling.
      answer: 0
    # ---- Independent items
    - slug: appsych-u01-w05-q04
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 1
      prompt: |
        After flying from Chicago to London, arriving in the morning local time, Priya feels wide awake at 1 a.m. London time and exhausted at noon. What best explains this?
      options:
        - "She is experiencing REM rebound."
        - "Her suprachiasmatic nucleus has been damaged by the flight."
        - "She has developed narcolepsy."
        - "Her circadian rhythm is still set to Chicago time and has not yet adjusted to London's light-dark cycle."
      option_explanations:
        - |
          REM rebound follows REM deprivation and shows up as faster, longer REM, not as being awake at the wrong time.
        - |
          The body clock is working normally; it just takes several days for light to reset it to a new time zone.
        - |
          Narcolepsy is a chronic disorder of sudden sleep attacks, not a temporary mismatch after travel.
        - |
          Correct. Jet lag occurs when the body clock lags behind local time; flying east is often harder because it requires sleeping earlier.
      answer: 3
    - slug: appsych-u01-w05-q05
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 1
      prompt: |
        A sleep lab records a sleeper with fast, irregular brain waves, darting eyes and almost no muscle tone in the arms and legs. Woken now, she would most likely report what?
      options:
        - "That she was lying awake thinking"
        - "A vivid, story-like dream"
        - "Nothing, because she was in the deepest sleep of the night"
        - "That she was sleepwalking"
      option_explanations:
        - |
          Muscle atonia and rapid eye movements together mark REM sleep, not quiet wakefulness.
        - |
          Correct. Fast brain waves, rapid eye movements and muscle paralysis mark REM sleep, the stage of vivid dreams.
        - |
          The deepest sleep (NREM 3) shows slow delta waves, not fast wake-like ones.
        - |
          Sleepwalking happens in NREM 3, and REM's muscle paralysis prevents walking.
      answer: 1
    - slug: appsych-u01-w05-q06
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 1
      prompt: |
        After several nights of studying until 3 a.m., Leon sleeps 10 hours on Saturday. A sleep lab would most likely find that he entered REM sooner and spent more time in it than usual. What is this called?
      options:
        - "REM rebound"
        - "Sleep apnea"
        - "Circadian rhythm"
        - "Somnambulism"
      option_explanations:
        - |
          Correct. Cutting nights short costs mostly REM, and afterward the brain makes up for it with more REM.
        - |
          Sleep apnea is a disorder of repeated breathing pauses, not extra REM after deprivation.
        - |
          The circadian rhythm is the 24-hour body clock; it does not describe extra REM after deprivation.
        - |
          Somnambulism is sleepwalking during NREM 3, not an increase in REM.
      answer: 0
    - slug: appsych-u01-w05-q07
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 1
      prompt: |
        Ari dreams he is flying over his school, which suddenly turns into a beach. Which explanation would the activation-synthesis theory give?
      options:
        - "The dream is processing and storing his memories of school from that day."
        - "The dream disguises a hidden wish to escape school."
        - "His cortex is building a story from random bursts of neural activity sent up from the brainstem during REM."
        - "The dream shows that his circadian rhythm is disrupted."
      option_explanations:
        - |
          Processing and storing the day's memories is the consolidation account, not activation-synthesis.
        - |
          Hidden wishes are the Freudian, psychodynamic interpretation, which activation-synthesis rejects.
        - |
          Correct. Activation-synthesis says the brain synthesizes a story from random REM activation, so sudden jumps in setting are expected.
        - |
          Dream content does not indicate a disrupted body clock; this answer does not address why dreams occur.
      answer: 2
    - slug: appsych-u01-w05-q08
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 1
      prompt: |
        A college student sometimes falls asleep suddenly during conversations and, when she laughs hard, her knees briefly buckle. Which sleep disorder fits best?
      options:
        - "Insomnia"
        - "Sleep apnea"
        - "Somnambulism"
        - "Narcolepsy"
      option_explanations:
        - |
          Insomnia is difficulty falling or staying asleep, not sudden sleep attacks.
        - |
          Sleep apnea causes breathing pauses at night and daytime sleepiness, but not sudden collapse during strong emotion.
        - |
          Somnambulism is sleepwalking during deep sleep, not falling asleep suddenly while awake.
        - |
          Correct. Narcolepsy involves sudden sleep attacks, and a brief loss of muscle tone during strong emotion is a common feature.
      answer: 3
    - slug: appsych-u01-w05-q09
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1 (spiral review)"
      points: 1
      prompt: |
        The body's master clock, the suprachiasmatic nucleus, sits within which brain structure that also regulates hunger, thirst and body temperature?
      options:
        - "The hypothalamus"
        - "The cerebellum"
        - "The hippocampus"
        - "The occipital lobe"
      option_explanations:
        - |
          Correct. The suprachiasmatic nucleus is part of the hypothalamus, which also regulates hunger, thirst and temperature.
        - |
          The cerebellum coordinates movement and balance; it does not contain the body clock.
        - |
          The hippocampus helps form new memories; it does not regulate hunger, thirst or temperature.
        - |
          The occipital lobe processes vision; light information reaches the clock, but the clock is not in the occipital lobe.
      answer: 0
    - slug: appsych-u01-w05-q10
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1 (spiral review)"
      points: 1
      prompt: |
        Which chemical messenger, released by the pineal gland as darkness falls, promotes sleepiness?
      options:
        - "Adrenaline"
        - "Melatonin"
        - "Ghrelin"
        - "Glutamate"
      option_explanations:
        - |
          Adrenaline, from the adrenal glands, increases arousal; it would work against sleep.
        - |
          Correct. Melatonin is a hormone released by the pineal gland in darkness that makes us sleepy.
        - |
          Ghrelin is a hunger hormone from the stomach, not a sleep signal.
        - |
          Glutamate is the brain's main excitatory neurotransmitter, not a hormone that promotes sleep.
      answer: 1
    - slug: appsych-u01-w05-q11
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 1
      prompt: |
        A man snores loudly, and his partner notices that he stops breathing for several seconds many times a night. He feels exhausted every day. Which disorder is most likely?
      options:
        - "Narcolepsy"
        - "REM sleep behavior disorder"
        - "Insomnia"
        - "Sleep apnea"
      option_explanations:
        - |
          Narcolepsy involves sudden sleep attacks during the day, not breathing pauses at night.
        - |
          REM sleep behavior disorder involves acting out dreams, not repeated pauses in breathing.
        - |
          Insomnia is trouble falling or staying asleep; it does not involve stopped breathing or loud snoring.
        - |
          Correct. Repeated pauses in breathing, loud snoring and daytime exhaustion are the signs of sleep apnea.
      answer: 3
    - slug: appsych-u01-w05-q12
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 1
      prompt: |
        A 7-year-old often walks into the kitchen about an hour after falling asleep and remembers nothing in the morning. In which stage is this most likely to occur?
      options:
        - "REM sleep, late in the night"
        - "NREM stage 1, while drifting off"
        - "NREM stage 3, early in the night"
        - "Awake but relaxed, with alpha waves"
      option_explanations:
        - |
          REM's muscle paralysis normally prevents walking, and REM periods are longest late in the night.
        - |
          NREM 1 is light, brief sleep; sleepwalking occurs in deeper sleep.
        - |
          Correct. Sleepwalking occurs in deep NREM 3 sleep, which is concentrated in the first cycles of the night.
        - |
          The child is asleep and has no memory of the event; relaxed wakefulness does not fit.
      answer: 2
    - slug: appsych-u01-w05-q13
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 3 (spiral review)"
      points: 1
      prompt: |
        A hypothetical survey of 500 teens finds r = −0.45 between minutes of phone use after 11 p.m. and hours of sleep. Which statement is best supported?
      options:
        - "Late phone use causes teens to lose sleep."
        - "Teens who use their phones more after 11 p.m. tend to sleep less; the study cannot show which causes which."
        - "There is no relationship, because the correlation is negative."
        - "Teens who sleep less tend to use their phones less after 11 p.m."
      option_explanations:
        - |
          A survey shows correlation only; a third factor (such as a later body clock) or reversed direction could explain the link.
        - |
          Correct. A moderate negative correlation means more late phone use goes with less sleep, with no causal conclusion.
        - |
          A negative correlation is a relationship in which one variable falls as the other rises; −0.45 is moderate.
        - |
          This describes a positive relationship; with r = −0.45, less sleep goes with more phone use.
      answer: 1
    - slug: appsych-u01-w05-q14
      type: multi_select
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 2
      partial_credit: true
      prompt: |
        Which are features of NREM stage 3 sleep? Select all that apply.
      options:
        - "Large, slow delta waves"
        - "Rapid eye movements and vivid dreams"
        - "Release of growth hormone"
        - "Being very hard to wake"
        - "Becoming longer in the last cycles of the night"
      option_explanations:
        - |
          Correct. Delta waves are the signature of deep, slow-wave sleep.
        - |
          Rapid eye movements and vivid dreams define REM sleep, not NREM 3.
        - |
          Correct. The pituitary releases most growth hormone during deep NREM 3 sleep.
        - |
          Correct. NREM 3 is the deepest stage; sleepers woken from it are groggy and disoriented.
        - |
          NREM 3 shrinks across the night; it is REM that grows longer in later cycles.
      answer: [0, 2, 3]
    - slug: appsych-u01-w05-q15
      type: multi_select
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 2 (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about brain-research tools are accurate? Select all that apply.
      options:
        - "EEG records electrical activity with precise timing, which is why sleep labs use it to identify sleep stages."
        - "fMRI shows changes in blood oxygen that indicate which regions are active."
        - "A CT scan shows moment-to-moment brain activity during dreams."
        - "Case studies of people with brain damage can suggest functions of a region but may not generalize."
        - "EEG pinpoints exactly which small structure deep in the brain is active."
      option_explanations:
        - |
          Correct. EEG's millisecond timing makes it ideal for tracking the rapid changes between sleep stages.
        - |
          Correct. fMRI tracks blood-oxygen changes that accompany neural activity, with good spatial precision.
        - |
          CT shows brain structure, not activity; it cannot show what the brain is doing during dreams.
        - |
          Correct. A case study gives rich detail, but damage is rarely limited to one region and one person may be unusual.
        - |
          EEG records from the scalp and locates activity poorly, especially for deep structures.
      answer: [0, 1, 3]
    - slug: appsych-u01-w05-q16
      type: true_false
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 1
      prompt: |
        True or false: During REM sleep, the body's large muscles are usually active, which is why most people act out their dreams.
      answer: false
      explanation: |
        False. During REM the large muscles are normally paralyzed (atonia), so most people do not act out their dreams. In REM sleep behavior disorder this paralysis fails.
    - slug: appsych-u01-w05-q17
      type: true_false
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1 (spiral review)"
      points: 1
      prompt: |
        True or false: During sleep, the autonomic nervous system keeps the heart beating and the lungs breathing without conscious effort.
      answer: true
      explanation: |
        True. The autonomic division of the peripheral nervous system controls internal organs automatically, asleep or awake. The brainstem's medulla is central to this control.
    - slug: appsych-u01-w05-q18
      type: fill_blank
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 1
      prompt: |
        The body's roughly 24-hour cycle of alertness, temperature and hormone release is called the ____ rhythm.
      answer: ["circadian"]
      explanation: |
        The circadian rhythm is set by light acting on the suprachiasmatic nucleus in the hypothalamus. Jet lag and shift work put it out of step with local time.
    - slug: appsych-u01-w05-q19
      type: fill_blank
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 3 (spiral review)"
      points: 1
      prompt: |
        For the sleep times 5, 6, 7, 8 and 14 hours, the ____ (one word) is 7 hours and is a better measure of center than the mean of 8 hours, because the 14-hour value is an outlier.
      answer: ["median"]
      explanation: |
        The median is the middle value of the ordered data (7 hours). It resists outliers, while the mean (40 ÷ 5 = 8) is pulled toward the 14-hour value.
    - slug: appsych-u01-w05-q20
      type: short_answer
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practice 1"
      points: 3
      prompt: |
        Describe a typical 8-hour night of sleep.

        (a) About how long is one sleep cycle, and how many cycles occur?
        (b) How does the amount of NREM 3 sleep change from the first cycles to the last?
        (c) How does the length of REM periods change, and what does that mean for someone who sleeps only 5 hours?
      answer: |
        (a) About 90 minutes; roughly four to six cycles (about five in 8 hours).
        (b) NREM 3 is longest in the first cycles and shrinks or disappears in the last ones.
        (c) REM periods get longer as the night goes on, so someone who sleeps only 5 hours loses mostly REM sleep from the final cycles.
      explanation: |
        Three points, one per part. (a) about 90 minutes and four to six cycles. (b) deep sleep concentrated early. (c) REM lengthening across the night, applied to the short sleeper losing mainly REM.
    - slug: appsych-u01-w05-q21
      type: short_answer
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practices 1 and 4"
      points: 3
      prompt: |
        Two students argue about why we dream.

        (a) Describe the activation-synthesis theory of dreaming.
        (b) Describe the consolidation theory of dreaming.
        (c) A student dreams about a math test she studied for that evening. Which theory explains this content more directly? Explain.
      answer: |
        (a) During REM the brainstem sends random neural activity to the cortex, which tries to make sense of it by building a story: the dream.
        (b) Dreams reflect the brain processing and storing (consolidating) information and memories from the day.
        (c) The consolidation theory, because it predicts that recent experiences being stored, such as studying for the test, appear in dreams; activation-synthesis treats content as built from random activation.
      explanation: |
        Three points, one per part. (a) random REM activation interpreted by the cortex. (b) memory processing or storage. (c) consolidation, linked to the recent studying. An answer choosing activation-synthesis earns the point only if it explains that the cortex draws on recent memories to make sense of random signals.
    - slug: appsych-u01-w05-q22
      type: long_answer
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Practices 1–4 (Article Analysis Question)"
      points: 7
      stimulus: |
        A hypothetical study (invented for this course). A research team recruited 48 college students aged 18 to 22 through a campus psychology course; all gave written informed consent. In the evening, every participant studied 40 word pairs until they could recall all of them. Participants were then randomly assigned either to sleep normally in a sleep laboratory or to stay awake in the laboratory all night under supervision. After a recovery night of normal sleep for everyone, each participant was tested on the 40 pairs. Recall was measured as the number of pairs correctly recalled out of 40. The sleep group recalled a mean of 33.2 pairs (SD = 3.1); the awake group recalled a mean of 26.5 pairs (SD = 4.4). The difference was statistically significant (p = .001), and the effect size was large. Participants' names were replaced by code numbers.
      prompt: |
        Answer each part.

        (A) Identify the research method used in this study.
        (B) State the operational definition of recall.
        (C) Describe what the standard deviations show about the two groups.
        (D) Identify one ethical guideline the researchers followed, with evidence.
        (E) Evaluate the generalizability of these findings to high school students.
        (F) Explain how the findings support or refute the claim that sleep helps consolidate new memories. (2 points)
      answer: |
        (A) An experiment: sleep condition was manipulated and participants were randomly assigned to sleep or stay awake.
        (B) The number of word pairs (out of 40) recalled correctly at the test after the recovery night.
        (C) Scores in the awake group were more spread out (SD 4.4) than in the sleep group (SD 3.1), so sleep-deprived participants varied more from one another.
        (D) Informed consent: written consent was obtained. Or confidentiality: names were replaced by code numbers.
        (E) Moderately limited: participants were 48 college students from one psychology course, aged 18 to 22; high school students are younger and may sleep differently, so results may not fully generalize, although the basic biology of sleep is similar.
        (F) Support. Both groups learned the pairs to the same level, but the group that slept recalled about 6.7 more pairs, a significant and large difference. Because participants were randomly assigned and everyone had a recovery night before the test, the difference is best explained by sleep consolidating (stabilizing) the new memories rather than by tiredness at the test.
      explanation: |
        Seven points. (A) 1 point: experiment; correlational or naturalistic earns 0. (B) 1 point: number of pairs recalled out of 40. (C) 1 point: the awake group's scores were more variable (more spread out) than the sleep group's; describing means only earns 0. (D) 1 point: informed consent or confidentiality with matching evidence. (E) 1 point: a specific sample feature (college students, one course, age range) linked to high school students. (F) 2 points: 1 for stating that the results support the claim with the difference in mean recall; 1 for explaining with memory consolidation during sleep (or random assignment and the recovery night ruling out fatigue at test).
