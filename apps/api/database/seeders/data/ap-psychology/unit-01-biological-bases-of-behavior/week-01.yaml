week: 1
unit: 1
title: Nature, Nurture and How Psychology Knows
topics: ["1.1"]
guide: guides/week-01.md
guide_description: |
  How heredity and environment interact (the nature–nurture issue, epigenetics, the evolutionary perspective
  and natural selection, and why eugenics was a scientific and moral failure), how family, twin and adoption
  studies separate genetic from environmental influence, and what heritability does and does not mean. Then the
  research toolkit the whole course uses: the scientific method, hindsight bias, experiments, correlational
  studies, case studies, naturalistic observation, surveys and meta-analysis; independent and dependent
  variables, operational definitions, confounds, placebos and blinding; random sampling versus random
  assignment; the ethical guidelines (IRB, informed consent and assent, deception and debriefing,
  confidentiality); and descriptive and inferential statistics (mean, median, mode, range, standard deviation,
  skew, the normal curve, percentile rank, correlation coefficients, statistical significance and effect size).
  Worked example: summarizing an invented set of twin-pair score differences.
flashcards_description: |
  30 cards on nature and nurture, natural selection, eugenics, family, twin and adoption studies, heritability,
  research methods and variables, sampling and assignment, research ethics, and descriptive and inferential
  statistics.

flashcards:
  - front: "Nature–nurture issue → modern answer"
    back: |
      Heredity and environment interact: genes are expressed differently in different environments, and people's genes nudge them toward certain experiences. Neither works alone.
    topic_code: "1.1"
  - front: "Epigenetics → what it studies"
    back: |
      How experience and environment switch genes on or off (change gene expression) without changing the DNA sequence itself.
    topic_code: "1.1"
  - front: "Natural selection → the idea"
    back: |
      Individuals vary, some variation is inherited, and inherited traits that help survival and reproduction become more common over generations (Darwin, 1859).
    topic_code: "1.1"
  - front: "Evolutionary perspective → typical question"
    back: |
      How might this behavior or mental process have helped our ancestors survive and reproduce? The answer is a hypothesis to test, not a proof.
    topic_code: "1.1"
  - front: "Eugenics → what it was"
    back: |
      A movement (named by Francis Galton in 1883) to "improve" humanity by controlling reproduction; it justified forced sterilization and worse. It confused prejudice with biology and ignored environment.
    topic_code: "1.1"
  - front: "Family study → main limitation"
    back: |
      Family members share both genes and environment, so similarity within a family cannot be credited to either one alone.
    topic_code: "1.1"
  - front: "Identical vs fraternal twins → shared genes"
    back: |
      Identical (monozygotic) twins come from one fertilized egg and share essentially all their genes; fraternal (dizygotic) twins come from two eggs and share about half, like other siblings.
    topic_code: "1.1"
  - front: "Twin study → logic"
    back: |
      If identical twins are more alike on a trait than fraternal twins, genes probably contribute. Twins reared apart separate shared genes from shared homes.
    topic_code: "1.1"
  - front: "Adoption study → logic"
    back: |
      Compare adopted children with their biological parents (shared genes) and adoptive parents (shared environment). Resemblance to the biological parents points to genetic influence.
    topic_code: "1.1"
  - front: "Heritability → definition"
    back: |
      The proportion of the variation in a trait among people in a particular population that is linked to genetic differences among them.
    topic_code: "1.1"
  - front: "Heritability → three cautions"
    back: |
      It describes a group, never one individual; it can change when environments change; and it says nothing about the causes of differences between groups.
    topic_code: "1.1"
  - front: "Hindsight bias → definition"
    back: |
      The tendency to believe, after learning an outcome, that you would have predicted it. A reason psychology relies on research rather than common sense.
    topic_code: "1.1"
  - front: "Hypothesis → definition"
    back: |
      A testable, falsifiable prediction, usually derived from a theory, about how variables are related.
    topic_code: "1.1"
  - front: "Replication → why it matters"
    back: |
      Repeating a study with new participants (and often new settings) checks that a finding is reliable rather than a fluke of one sample.
    topic_code: "1.1"
  - front: "Operational definition → definition"
    back: |
      A precise statement of the procedure used to measure or manipulate a variable, such as "number of words recalled from a 20-word list after 10 minutes".
    topic_code: "1.1"
  - front: "Independent variable → definition"
    back: |
      The factor the experimenter deliberately manipulates to see its effect.
    topic_code: "1.1"
  - front: "Dependent variable → definition"
    back: |
      The outcome the experimenter measures; it may depend on the independent variable.
    topic_code: "1.1"
  - front: "Confounding variable → definition"
    back: |
      A factor other than the independent variable that differs between conditions and offers another explanation for the results.
    topic_code: "1.1"
  - front: "Random assignment → purpose"
    back: |
      Placing participants in conditions by chance makes the groups similar before treatment, so a later difference can be attributed to the independent variable.
    topic_code: "1.1"
  - front: "Random sample → purpose"
    back: |
      Giving everyone in the population an equal chance to be chosen makes the sample representative, which supports generalizing the results.
    topic_code: "1.1"
  - front: "Placebo → definition"
    back: |
      An inactive substance or condition given to the control group so that their expectations match those of the experimental group.
    topic_code: "1.1"
  - front: "Double-blind procedure → definition"
    back: |
      Neither the participants nor the researchers collecting data know who is in which condition; it guards against both demand characteristics and experimenter bias.
    topic_code: "1.1"
  - front: "Correlational study → key limit"
    back: |
      It shows whether two variables vary together but cannot show cause: a third variable or reversed direction could explain the link.
    topic_code: "1.1"
  - front: "Case study → strength and weakness"
    back: |
      Rich, in-depth information about one person or group, often about rare conditions; the results may not generalize to anyone else.
    topic_code: "1.1"
  - front: "Informed consent and assent → meaning"
    back: |
      Participants agree to take part after learning what the study involves; for minors a parent gives consent and the child gives assent.
    topic_code: "1.1"
  - front: "Debriefing → when and what"
    back: |
      After the study (required after any deception), participants are told its true purpose and any deception is explained.
    topic_code: "1.1"
  - front: "Institutional Review Board (IRB) → role"
    back: |
      A committee that reviews proposed research with human participants and approves it only if it protects their rights and welfare.
    topic_code: "1.1"
  - front: "Skewed distribution → mean vs median"
    back: |
      Positive skew (a few very high scores): mean above median. Negative skew (a few very low scores): mean below median. The median is the better center for skewed data.
    topic_code: "1.1"
  - front: "Normal curve → 68-95-99.7"
    back: |
      About 68% of scores fall within 1 standard deviation of the mean, 95% within 2 and 99.7% within 3.
    topic_code: "1.1"
  - front: "Statistical significance vs effect size"
    back: |
      Significance (usually p less than .05) says a result is unlikely to be due to chance alone; effect size says how large the difference or relationship is.
    topic_code: "1.1"

quiz:
  description: |
    22 questions · about 40 minutes · on Topic 1.1 (heredity and environment, natural selection, eugenics, twin,
    adoption and family studies, heritability) and the research toolkit used all year (methods, variables,
    sampling and assignment, ethics, descriptive and inferential statistics). Opens with a shared-context set on
    one invented twin study. Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented twin study (1.1)
    - slug: appsych-u01-w01-q01
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course) recruited 120 pairs of identical twins and 120 pairs of same-sex fraternal twins, all aged 16 to 18, through a national twin registry. Each teen completed a 30-item sensation-seeking questionnaire (scores 0 to 30). The correlation between twins' scores was r = +0.58 for identical pairs and r = +0.24 for fraternal pairs. All twins were raised together.
      prompt: |
        Which conclusion is best supported by these results?
      options:
        - "Genes probably contribute to differences in sensation seeking, because the more genetically similar twins were more alike."
        - "Sensation seeking is caused entirely by genes."
        - "Environment has no effect on sensation seeking."
        - "Fraternal twins share more of their environment than identical twins do."
      option_explanations:
        - |
          Correct. Identical twins share about twice the genes of fraternal twins and were more alike (0.58 versus 0.24), which points to a genetic contribution.
        - |
          A correlation of 0.58, well short of 1.00, leaves plenty of room for environment; "entirely" goes far beyond the data.
        - |
          Even identical twins differ considerably, and the design cannot rule environment out; the data say nothing like "no effect".
        - |
          Both kinds of twins were raised together, and nothing in the study measured how much environment each type shares.
      answer: 0
    - slug: appsych-u01-w01-q02
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course) recruited 120 pairs of identical twins and 120 pairs of same-sex fraternal twins, all aged 16 to 18, through a national twin registry. Each teen completed a 30-item sensation-seeking questionnaire (scores 0 to 30). The correlation between twins' scores was r = +0.58 for identical pairs and r = +0.24 for fraternal pairs. All twins were raised together.
      prompt: |
        What is the operational definition of sensation seeking in this study?
      options:
        - "A tendency to look for thrilling and novel experiences"
        - "Whether the teen is an identical or a fraternal twin"
        - "The teen's score from 0 to 30 on the 30-item questionnaire"
        - "The correlation between the twins' scores"
      option_explanations:
        - |
          This is a conceptual definition of the trait; an operational definition states how it was measured in this study.
        - |
          Twin type is the grouping variable the researchers compare, not the measure of sensation seeking.
        - |
          Correct. The procedure that turns sensation seeking into a number is the score on the 30-item questionnaire.
        - |
          The correlation is a statistic summarizing the relationship between twins' scores, not the measure of the trait itself.
      answer: 2
    - slug: appsych-u01-w01-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course) recruited 120 pairs of identical twins and 120 pairs of same-sex fraternal twins, all aged 16 to 18, through a national twin registry. Each teen completed a 30-item sensation-seeking questionnaire (scores 0 to 30). The correlation between twins' scores was r = +0.58 for identical pairs and r = +0.24 for fraternal pairs. All twins were raised together.
      prompt: |
        Which change to the design would best separate the effect of shared genes from the effect of a shared home?
      options:
        - "Using a longer questionnaire with 60 items"
        - "Studying identical twins who were adopted into different homes early in life"
        - "Recruiting twins aged 30 to 40 instead of teens"
        - "Randomly assigning twins to be identical or fraternal"
      option_explanations:
        - |
          A longer questionnaire may measure the trait more reliably, but twins raised together would still share both genes and a home.
        - |
          Correct. Identical twins reared apart share genes but not a home, so their similarity cannot come from a shared household.
        - |
          Older twins may have lived apart longer, but they still grew up together; the confound of a shared upbringing remains.
        - |
          Twin type is set at conception and cannot be assigned; this is why twin studies are not experiments.
      answer: 1
    # ---- Independent items
    - slug: appsych-u01-w01-q04
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 1"
      points: 1
      prompt: |
        Researchers report that the heritability of reading ability in a large sample of children is 0.60. Which statement correctly interprets this?
      options:
        - "60% of each child's reading ability comes from genes."
        - "Reading ability cannot be improved by teaching, because it is mostly genetic."
        - "Any difference in average reading ability between two countries is 60% genetic."
        - "About 60% of the differences in reading ability among children in this population are linked to genetic differences."
      option_explanations:
        - |
          Heritability never applies to one person; it describes the spread of a trait across a population.
        - |
          A heritable trait can still change with environment: teaching, practice and access to books all change reading ability.
        - |
          Heritability within a group says nothing about the cause of differences between groups, which may be entirely environmental.
        - |
          Correct. Heritability is the share of variation among people in a particular population that is associated with genetic variation.
      answer: 3
    - slug: appsych-u01-w01-q05
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 1"
      points: 1
      prompt: |
        An evolutionary psychologist notes that people across many cultures learn to fear heights quickly. Which explanation fits the evolutionary perspective?
      options:
        - "Fear of heights is learned only from parents who are afraid of heights."
        - "Fear of heights is a symptom of a psychological disorder."
        - "Ancestors who were wary of cliffs were more likely to survive and pass on genes that make the fear easy to learn."
        - "Fear of heights is a choice people make after weighing the risks."
      option_explanations:
        - |
          Learning from parents is an environmental, social-learning account, not an explanation in terms of adaptation and natural selection.
        - |
          Ordinary caution about heights is common and adaptive; calling it a disorder does not explain why it is widespread.
        - |
          Correct. The evolutionary perspective explains a widespread tendency by asking how it helped ancestors survive and reproduce.
        - |
          A deliberate cost-benefit choice is a cognitive account and does not explain why the fear appears so readily across cultures.
      answer: 2
    - slug: appsych-u01-w01-q06
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 1
      prompt: |
        A researcher finds that students who sleep more hours have higher grades (r = +0.45). Which conclusion is justified?
      options:
        - "Students who sleep more tend to have higher grades, but the study does not show that sleep causes higher grades."
        - "Getting more sleep causes students' grades to rise."
        - "Higher grades cause students to sleep more."
        - "Sleep and grades are unrelated, because 0.45 is less than 0.50."
      option_explanations:
        - |
          Correct. A positive correlation shows the two variables rise together; a third variable (such as conscientiousness) or reversed direction could explain it.
        - |
          Causation needs an experiment with a manipulated variable and random assignment; a correlation cannot establish it.
        - |
          This reverses the direction but still makes a causal claim that correlational data cannot support.
        - |
          A correlation of +0.45 is a moderate positive relationship; there is no rule that values under 0.50 mean "unrelated".
      answer: 0
    - slug: appsych-u01-w01-q07
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 1
      prompt: |
        In a hypothetical experiment, students are randomly assigned to read a passage either on paper or on a tablet and then answer 15 comprehension questions. What is the dependent variable?
      options:
        - "Whether the passage is on paper or on a tablet"
        - "The students' ages"
        - "The random assignment of students to groups"
        - "The number of comprehension questions answered correctly"
      option_explanations:
        - |
          Paper versus tablet is what the researcher manipulates, so it is the independent variable.
        - |
          Age was neither manipulated nor measured as the outcome; random assignment should balance it across groups.
        - |
          Random assignment is a design feature that makes the groups comparable, not a variable being measured.
        - |
          Correct. The outcome measured to see the effect of the reading medium is the number of questions answered correctly.
      answer: 3
    - slug: appsych-u01-w01-q08
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 1
      prompt: |
        A researcher wants to generalize findings to all high school students in one state. Which procedure best supports that goal?
      options:
        - "Randomly assigning the students who volunteer to a treatment or a control group"
        - "Selecting students by chance from a list of every high school student in the state"
        - "Studying every student in the researcher's own child's school"
        - "Posting an online survey and using everyone who answers"
      option_explanations:
        - |
          Random assignment lets the researcher draw causal conclusions, but volunteers may not represent the whole state.
        - |
          Correct. A random sample from the whole population gives every student an equal chance of selection, which supports generalization.
        - |
          One convenient school is unlikely to represent every high school student in the state; this is a convenience sample.
        - |
          A voluntary response sample over-represents people with strong opinions or free time, so it is biased.
      answer: 1
    - slug: appsych-u01-w01-q09
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 1
      prompt: |
        In a hypothetical study of a new memory supplement, participants are told they are getting the supplement, and the researcher who scores their memory tests knows who received it. What is the best fix for the likely bias?
      options:
        - "Use a larger sample of participants."
        - "Replace random assignment with assignment by age."
        - "Use a double-blind procedure with a placebo pill for the control group."
        - "Measure memory with a longer test."
      option_explanations:
        - |
          A larger sample reduces chance variation but does nothing about expectations held by participants or the scorer.
        - |
          Assigning by age would create a confound and remove the benefit of random assignment; it does not address expectations.
        - |
          Correct. A placebo equalizes participants' expectations, and keeping the scorer unaware of conditions removes experimenter bias.
        - |
          A longer test may be more reliable, but expectations could still shape both performance and scoring.
      answer: 2
    - slug: appsych-u01-w01-q10
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 1
      prompt: |
        A hypothetical study tells participants it is about "taste preferences" when it is really about how hunger affects attention. Which step must follow the study?
      options:
        - "Destroying the data so no one can be identified"
        - "Debriefing participants about the study's true purpose"
        - "Repeating the study with the same participants"
        - "Paying participants twice as much"
      option_explanations:
        - |
          Data must be kept confidential, but destroying them is not required and would not address the deception.
        - |
          Correct. When a study uses deception, participants must be debriefed afterward: told the real purpose and why deception was needed.
        - |
          Replication with new participants checks reliability; it has nothing to do with the ethical duty created by deception.
        - |
          Payment does not make up for deception; the guideline requires debriefing.
      answer: 1
    - slug: appsych-u01-w01-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 3"
      points: 1
      prompt: |
        Five adopted teens in a hypothetical study report the hours they practice music each week: 1, 2, 2, 3, 22. Which measure best describes a typical teen?
      options:
        - "The mean, 6 hours, because it uses every score"
        - "The range, 21 hours"
        - "The median, 2 hours, because the 22-hour score skews the mean"
        - "The standard deviation, because it shows the spread"
      option_explanations:
        - |
          The mean is (1 + 2 + 2 + 3 + 22) ÷ 5 = 6, but the outlier pulls it above four of the five scores, so it misrepresents a typical teen.
        - |
          The range measures spread, not the typical value, and depends on the two most extreme scores.
        - |
          Correct. With one extreme score creating positive skew, the median (2 hours) is the better summary of a typical teen.
        - |
          The standard deviation describes variability, not the center, and it is inflated by the outlier too.
      answer: 2
    - slug: appsych-u01-w01-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 3"
      points: 1
      prompt: |
        Scores on a hypothetical spatial-reasoning test are normally distributed with a mean of 100 and a standard deviation of 15. About what percentage of people score between 85 and 115?
      options:
        - "34%"
        - "50%"
        - "95%"
        - "68%"
      option_explanations:
        - |
          34% is the share between the mean and one standard deviation on one side only; 85 to 115 covers both sides.
        - |
          50% is the share below (or above) the mean, not the share within one standard deviation of it.
        - |
          95% is the share within two standard deviations (70 to 130), not one.
        - |
          Correct. 85 and 115 are one standard deviation below and above the mean, and about 68% of a normal distribution falls within 1 SD.
      answer: 3
    - slug: appsych-u01-w01-q13
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 1"
      points: 1
      prompt: |
        Why do psychologists today point to the history of eugenics when discussing heredity?
      options:
        - "It misused claims about heredity to justify coercion and discrimination, a warning against treating heritable traits as fixed destinies."
        - "It showed that intelligence is fixed at birth."
        - "It proved that environment has no effect on behavior."
        - "It was the first successful use of twin studies."
      option_explanations:
        - |
          Correct. Eugenics justified forced sterilization and other abuses by mistaking prejudice for biology, which is why "heritable" must never be read as "unchangeable".
        - |
          Eugenics assumed traits were fixed, but that assumption was wrong; the movement showed nothing of the kind.
        - |
          Eugenics ignored environment rather than testing it; it proved nothing about environment's role.
        - |
          Eugenics was a social and political movement, not a research design; twin studies are a separate method.
      answer: 0
    - slug: appsych-u01-w01-q14
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are ethical requirements for research with human participants? Select all that apply.
      options:
        - "Participants may withdraw at any time without penalty."
        - "Identifying information is kept confidential."
        - "Participants must never be told the hypothesis, even afterward."
        - "Proposed studies are reviewed by an institutional review board."
        - "Minors may take part only if a parent consents and the minor assents."
      option_explanations:
        - |
          Correct. Freedom to withdraw is a basic right of every participant, whatever the study.
        - |
          Correct. Confidentiality protects participants; results are reported without names.
        - |
          The opposite is true: debriefing after the study explains its purpose, especially when deception was used.
        - |
          Correct. An IRB reviews research with human participants before it begins to protect their rights and welfare.
        - |
          Correct. For minors, a parent or guardian gives consent and the child agrees (assents) as well.
      answer: [0, 1, 3, 4]
    - slug: appsych-u01-w01-q15
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 2
      partial_credit: true
      prompt: |
        A hypothetical researcher observes children on a public playground for a month, recording how often each child shares toys, without interacting with them. Which statements about this study are true? Select all that apply.
      options:
        - "It is naturalistic observation."
        - "It can show that sharing is caused by a child's age."
        - "It describes behavior as it occurs in a real setting."
        - "It has an independent variable manipulated by the researcher."
        - "If children change their behavior because they notice the observer, the results may be distorted."
      option_explanations:
        - |
          Correct. Recording behavior in its natural setting without interfering is naturalistic observation.
        - |
          Nothing is manipulated and children are not randomly assigned, so the study cannot establish cause.
        - |
          Correct. The strength of naturalistic observation is describing real behavior in its everyday setting.
        - |
          The researcher only records behavior; with no manipulated variable, there is no independent variable.
        - |
          Correct. People, children included, may act differently when they know they are watched, which is why observers try to stay unnoticed.
      answer: [0, 2, 4]
    - slug: appsych-u01-w01-q16
      type: true_false
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 3"
      points: 1
      prompt: |
        True or false: A correlation of r = −0.80 shows a weaker relationship than a correlation of r = +0.30.
      answer: false
      explanation: |
        False. The sign gives only the direction; strength is the distance from 0. −0.80 is a strong negative relationship, much stronger than the weak positive +0.30.
    - slug: appsych-u01-w01-q17
      type: true_false
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 1"
      points: 1
      prompt: |
        True or false: Adoption studies help separate genetic and environmental influences because adopted children share genes with one set of parents and their home environment with another.
      answer: true
      explanation: |
        True. Resemblance to biological parents points to genes; resemblance to adoptive parents points to the shared environment. Family studies cannot make this separation.
    - slug: appsych-u01-w01-q18
      type: fill_blank
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 1
      prompt: |
        Placing participants into experimental and control groups by chance, so that the groups are similar before the treatment, is called random ____.
      answer: ["assignment", "assigning"]
      explanation: |
        Random assignment equalizes groups before treatment so a difference afterward can be attributed to the independent variable. Random sampling, by contrast, decides who is in the study.
    - slug: appsych-u01-w01-q19
      type: fill_blank
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 1"
      points: 1
      prompt: |
        The proportion of variation in a trait within a population that can be attributed to genetic differences is called ____.
      answer: ["heritability"]
      explanation: |
        Heritability describes variation within a particular population; it does not apply to an individual and can change when the environment changes.
    - slug: appsych-u01-w01-q20
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2"
      points: 3
      prompt: |
        A hypothetical researcher wants to test whether listening to upbeat music before a test reduces anxiety in high school students.

        (a) Identify the independent and dependent variables.
        (b) Give an operational definition of the dependent variable.
        (c) Explain why the researcher should use random assignment.
      answer: |
        (a) IV: whether students listen to upbeat music (or sit in silence) before the test. DV: anxiety.
        (b) For example, the score on a 10-item test-anxiety questionnaire taken just before the test, or heart rate in beats per minute measured right before the test.
        (c) Random assignment makes the music and silence groups similar on other factors (such as how anxious students already are), so any difference in anxiety can be credited to the music rather than a confound.
      explanation: |
        Three points, one per part. (a) both variables correctly identified. (b) a measurable procedure that yields a number or category for anxiety; "how anxious they feel" earns nothing. (c) an explanation tied to equalizing groups or ruling out confounds so a causal conclusion is possible; describing random sampling earns nothing.
    - slug: appsych-u01-w01-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 3"
      points: 3
      prompt: |
        A hypothetical class of 25 students takes a quiz. The mean is 14 points, the median is 17 points, and the standard deviation is 4 points.

        (a) Is the distribution most likely positively skewed, negatively skewed or symmetric? Explain.
        (b) Which measure of central tendency better represents a typical student? Explain.
        (c) What does the standard deviation of 4 points tell you?
      answer: |
        (a) Negatively skewed: the mean (14) is below the median (17), so a few very low scores are pulling the mean down.
        (b) The median, because it is not pulled by the few extreme low scores.
        (c) Scores typically fall about 4 points from the mean of 14; a larger SD would mean scores are more spread out.
      explanation: |
        Three points, one per part. (a) negative skew with the mean-below-median reasoning. (b) the median, with a reason about resistance to extreme scores. (c) an interpretation of SD as the typical distance of scores from the mean.
    - slug: appsych-u01-w01-q22
      type: long_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practices 2–4 (Article Analysis Question)"
      points: 7
      stimulus: |
        A hypothetical study (invented for this course). Researchers recruited 60 adopted children aged 8 to 10 through adoption agencies in one state; all were adopted before age 1. Parents gave written consent and children gave assent. Each child's level of physical activity was measured as the average number of minutes per day of moderate or vigorous activity recorded by a wrist monitor worn for two weeks. The same measure was taken from each child's biological mother (through the agency, with her consent) and adoptive mother. Activity correlated r = +0.41 between children and their biological mothers and r = +0.22 between children and their adoptive mothers. Names were replaced with code numbers before analysis.
      prompt: |
        Answer each part.

        (A) Identify the research method used in this study.
        (B) State the operational definition of physical activity.
        (C) Describe what the correlation of r = +0.41 shows.
        (D) Identify one ethical guideline that was followed, with evidence from the study.
        (E) Explain one limit on generalizing these findings.
        (F) Explain how the findings support the claim that both heredity and environment influence physical activity. (2 points)
      answer: |
        (A) A correlational study (an adoption study): no variable was manipulated; existing relationships were measured.
        (B) Average minutes per day of moderate or vigorous activity recorded by a wrist monitor over two weeks.
        (C) A moderate positive relationship: children whose biological mothers were more active tended to be more active themselves.
        (D) Informed consent and assent: parents consented and children assented. Or confidentiality: names were replaced by code numbers.
        (E) The sample was 60 children aged 8 to 10 from one state's agencies, all adopted in infancy; results may not apply to older people, other regions or children who are not adopted.
        (F) Children resembled their biological mothers (shared genes, no shared home), pointing to heredity, and also resembled their adoptive mothers somewhat (shared environment, no shared genes), pointing to environment. Both correlations are positive, so both influences appear to matter.
      explanation: |
        Seven points. (A) 1 point: correlational or adoption study; "experiment" earns 0. (B) 1 point: minutes per day of moderate or vigorous activity from the wrist monitor. (C) 1 point: a positive relationship of moderate strength described in context; a causal claim earns 0. (D) 1 point: a named guideline with matching evidence (consent and assent, or confidentiality through code numbers). (E) 1 point: a specific sample feature (size, age, one state, all adopted) linked to who the results may not apply to. (F) 2 points: 1 for linking the biological-mother correlation to heredity (shared genes, no shared home); 1 for linking the adoptive-mother correlation to environment (shared home, no shared genes).
