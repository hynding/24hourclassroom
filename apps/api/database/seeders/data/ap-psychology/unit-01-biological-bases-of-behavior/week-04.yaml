week: 4
unit: 1
title: The Brain
topics: ["1.4"]
guide: guides/week-04.md
guide_description: |
  The brain from the bottom up: the brainstem (medulla and reticular activating system), the cerebellum, and the
  limbic structures (thalamus, hypothalamus and its link to the pituitary, hippocampus, amygdala); the four lobes
  of the cerebral cortex with the motor and somatosensory cortex, the prefrontal cortex, association areas, and
  Broca's and Wernicke's areas; contralateral control, hemispheric specialization and split-brain research;
  neuroplasticity; and the tools behind the findings (case studies such as Phineas Gage, lesioning, EEG, fMRI,
  MRI, CT and PET), with the strength and limit of each. Worked example: predicting what a split-brain patient
  can say and do when a word flashes to one visual field.
flashcards_description: |
  32 cards on the brainstem, cerebellum, limbic structures, the lobes of the cortex and their key areas,
  contralateral control, hemispheric specialization, split-brain research, neuroplasticity and brain-research
  tools.

flashcards:
  - front: "Medulla → function"
    back: |
      Controls heartbeat and breathing; part of the brainstem.
    topic_code: "1.4"
  - front: "Reticular activating system → function"
    back: |
      A nerve network through the brainstem that filters stimuli and controls arousal and alertness; damage can cause coma.
    topic_code: "1.4"
  - front: "Cerebellum → function"
    back: |
      Coordinates smooth, timed movement and balance; supports learning of motor skills.
    topic_code: "1.4"
  - front: "Thalamus → function"
    back: |
      Relays incoming sensory information (all senses except smell) to the appropriate areas of the cortex.
    topic_code: "1.4"
  - front: "Hypothalamus → function"
    back: |
      Regulates hunger, thirst, body temperature and sexual behavior, and directs the pituitary gland.
    topic_code: "1.4"
  - front: "Pituitary gland → role"
    back: |
      The endocrine system's most influential gland; under the hypothalamus's direction it regulates other glands.
    topic_code: "1.4"
  - front: "Hippocampus → function"
    back: |
      Helps form new long-term explicit memories of facts and events.
    topic_code: "1.4"
  - front: "Amygdala → function"
    back: |
      Emotional responses, especially fear and aggression, and detecting threat.
    topic_code: "1.4"
  - front: "Limbic system → members to know"
    back: |
      Thalamus, hypothalamus, hippocampus and amygdala, the structures around the brainstem tied to emotion, drives and memory.
    topic_code: "1.4"
  - front: "Cerebral cortex → description"
    back: |
      The thin, wrinkled outer layer of the cerebrum, responsible for perceiving, thinking, planning and language.
    topic_code: "1.4"
  - front: "Frontal lobe → functions"
    back: |
      Planning, judgment, impulse control and working memory (prefrontal cortex); voluntary movement (motor cortex); speech production (Broca's area).
    topic_code: "1.4"
  - front: "Prefrontal cortex → functions"
    back: |
      Executive functions: planning, decision-making, judgment, impulse control, working memory.
    topic_code: "1.4"
  - front: "Parietal lobe → function"
    back: |
      Processes touch, temperature, pain and body position through the somatosensory cortex.
    topic_code: "1.4"
  - front: "Occipital lobe → function"
    back: |
      Processes visual information; contains the primary visual cortex.
    topic_code: "1.4"
  - front: "Temporal lobe → functions"
    back: |
      Hearing (auditory cortex) and understanding language (Wernicke's area, usually left).
    topic_code: "1.4"
  - front: "Motor cortex → location and function"
    back: |
      A strip at the rear of the frontal lobe that sends commands for voluntary movements.
    topic_code: "1.4"
  - front: "Somatosensory cortex → location and function"
    back: |
      A strip at the front of the parietal lobe that receives touch and body-position sensations.
    topic_code: "1.4"
  - front: "Association areas → role"
    back: |
      Most of the cortex: areas not tied to one sense or movement that integrate information for thinking, remembering and speaking.
    topic_code: "1.4"
  - front: "Broca's area → function and damage"
    back: |
      Usually in the left frontal lobe; controls speech production. Damage causes slow, effortful, broken speech with understanding largely spared.
    topic_code: "1.4"
  - front: "Wernicke's area → function and damage"
    back: |
      Usually in the left temporal lobe; supports understanding language. Damage causes fluent but meaningless speech and poor comprehension.
    topic_code: "1.4"
  - front: "Contralateral control → meaning"
    back: |
      Each hemisphere controls movement and receives sensation from the opposite side of the body.
    topic_code: "1.4"
  - front: "Corpus callosum → function"
    back: |
      A thick band of axons connecting the two hemispheres so they can share information.
    topic_code: "1.4"
  - front: "Hemispheric specialization (lateralization)"
    back: |
      Each hemisphere leads on certain tasks: in most people the left on language, the right on spatial tasks, faces and emotional tone. They still work together.
    topic_code: "1.4"
  - front: "Split-brain patient → why the corpus callosum was cut"
    back: |
      To control severe epilepsy by stopping seizures from spreading between hemispheres.
    topic_code: "1.4"
  - front: "Split-brain → image in the left visual field"
    back: |
      Goes to the right hemisphere: the patient usually cannot name it but can identify it by touch with the left hand.
    topic_code: "1.4"
  - front: "Neuroplasticity → definition"
    back: |
      The brain's ability to reorganize its structure and connections through experience or after injury; strongest in childhood.
    topic_code: "1.4"
  - front: "Phineas Gage → what the case suggested"
    back: |
      After an iron rod passed through his skull in 1848, damaging his frontal lobe (most modern reconstructions say mainly the left), reported changes in his self-control pointed to the frontal lobes' role in planning and impulse control.
    topic_code: "1.4"
  - front: "Lesioning → what it is"
    back: |
      Deliberately destroying a small area of brain tissue (in animals) to see what function is lost; it can show cause.
    topic_code: "1.4"
  - front: "EEG → strength and limit"
    back: |
      Records the brain's electrical activity from scalp electrodes with millisecond timing, but it locates activity poorly.
    topic_code: "1.4"
  - front: "fMRI → what it shows"
    back: |
      Changes in blood oxygen as brain regions become active; shows function with good location, but it is correlational.
    topic_code: "1.4"
  - front: "MRI and CT → what they show"
    back: |
      Detailed pictures of brain structure (such as damage or tumors), not activity.
    topic_code: "1.4"
  - front: "PET scan → what it shows"
    back: |
      Brain activity, by tracking where a radioactive form of glucose is used.
    topic_code: "1.4"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on Topic 1.4 (brainstem, cerebellum, limbic system, the lobes and
    areas of the cortex, hemispheric specialization, split-brain research, neuroplasticity and research tools),
    with 7 questions (32%) reviewing weeks 1 to 3. Opens with a shared-context set on one invented brain-imaging
    study and ends with an Evidence-Based Question. Multiple choice, select-all and true/false items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented fMRI study (1.4)
    - slug: appsych-u01-w04-q01
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 3"
      points: 1
      stimulus: |
        A hypothetical fMRI study (invented for this course). Twenty-four right-handed adult volunteers lay in a scanner and did three tasks in a random order. The table shows the mean percentage increase in activity, compared with rest, in four regions.

        | Region | Listening to spoken sentences | Watching a flickering checkerboard | Tapping right-hand fingers |
        |---|---|---|---|
        | Left temporal lobe (Wernicke's area) | 2.4% | 0.2% | 0.1% |
        | Occipital lobe | 0.3% | 3.1% | 0.2% |
        | Left motor cortex | 0.2% | 0.1% | 2.8% |
        | Right motor cortex | 0.1% | 0.1% | 0.4% |
      prompt: |
        Which result is best explained by the function of the occipital lobe?
      options:
        - "The rise in left temporal activity while listening to sentences"
        - "The rise in left motor cortex activity while tapping"
        - "The small rise in right motor cortex activity while tapping"
        - "The 3.1% rise in occipital activity while watching the checkerboard"
      option_explanations:
        - |
          Wernicke's area in the temporal lobe supports understanding language; this result is explained by the temporal lobe, not the occipital lobe.
        - |
          Finger tapping activates the motor cortex in the frontal lobe, not the occipital lobe.
        - |
          The right motor cortex controls the left side of the body; its small rise has nothing to do with the occipital lobe.
        - |
          Correct. The occipital lobe holds the primary visual cortex, so it responds most to a visual stimulus such as a flickering checkerboard.
      answer: 3
    - slug: appsych-u01-w04-q02
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 3"
      points: 1
      stimulus: |
        A hypothetical fMRI study (invented for this course). Twenty-four right-handed adult volunteers lay in a scanner and did three tasks in a random order. The table shows the mean percentage increase in activity, compared with rest, in four regions.

        | Region | Listening to spoken sentences | Watching a flickering checkerboard | Tapping right-hand fingers |
        |---|---|---|---|
        | Left temporal lobe (Wernicke's area) | 2.4% | 0.2% | 0.1% |
        | Occipital lobe | 0.3% | 3.1% | 0.2% |
        | Left motor cortex | 0.2% | 0.1% | 2.8% |
        | Right motor cortex | 0.1% | 0.1% | 0.4% |
      prompt: |
        Why did the left motor cortex, rather than the right, show the larger increase during right-hand tapping?
      options:
        - "The left hemisphere controls all voluntary movement."
        - "Each hemisphere's motor cortex controls movement on the opposite side of the body."
        - "The right motor cortex was damaged in these volunteers."
        - "Tapping is a language task handled by the left hemisphere."
      option_explanations:
        - |
          Both hemispheres control voluntary movement, each for the opposite side; the left does not control all of it.
        - |
          Correct. Contralateral control means the left motor cortex directs the right hand.
        - |
          Nothing suggests damage; the right motor cortex would be most active if the volunteers tapped with the left hand.
        - |
          Finger tapping is a motor task, not a language task; the result reflects contralateral motor control.
      answer: 1
    - slug: appsych-u01-w04-q03
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 2"
      points: 1
      stimulus: |
        A hypothetical fMRI study (invented for this course). Twenty-four right-handed adult volunteers lay in a scanner and did three tasks in a random order. The table shows the mean percentage increase in activity, compared with rest, in four regions.

        | Region | Listening to spoken sentences | Watching a flickering checkerboard | Tapping right-hand fingers |
        |---|---|---|---|
        | Left temporal lobe (Wernicke's area) | 2.4% | 0.2% | 0.1% |
        | Occipital lobe | 0.3% | 3.1% | 0.2% |
        | Left motor cortex | 0.2% | 0.1% | 2.8% |
        | Right motor cortex | 0.1% | 0.1% | 0.4% |
      prompt: |
        Why did the researchers use fMRI rather than EEG for this study?
      options:
        - "fMRI shows which specific regions are active with good spatial precision, which this study needed."
        - "fMRI records the brain's electrical activity with millisecond timing."
        - "fMRI can show that a region causes a behavior, while EEG cannot."
        - "fMRI shows only brain structure, which was the study's focus."
      option_explanations:
        - |
          Correct. The study compared activity in named regions, and fMRI locates activity much better than EEG does.
        - |
          Millisecond timing of electrical activity is EEG's strength; fMRI tracks slower blood-oxygen changes.
        - |
          fMRI shows activity that accompanies a task, which is correlational; it does not by itself show cause.
        - |
          fMRI measures activity through blood-oxygen changes; structure alone is what MRI and CT show.
      answer: 0
    # ---- Independent items
    - slug: appsych-u01-w04-q04
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 1
      prompt: |
        After a car accident injures the area behind her forehead, a woman remains intelligent and articulate but makes impulsive purchases and has trouble planning her week. Which region was most likely damaged?
      options:
        - "The occipital lobe"
        - "The cerebellum"
        - "The prefrontal cortex"
        - "The medulla"
      option_explanations:
        - |
          The occipital lobe, at the back of the brain, processes vision; its damage would affect sight, not planning.
        - |
          Cerebellar damage disrupts coordination and balance, not planning and impulse control.
        - |
          Correct. The prefrontal cortex, behind the forehead, supports planning, judgment and impulse control.
        - |
          The medulla controls heartbeat and breathing; serious damage there threatens survival rather than planning.
      answer: 2
    - slug: appsych-u01-w04-q05
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 1
      prompt: |
        After surgery that damaged both of his hippocampi, a man can still describe his childhood and play the piano, but he cannot remember people he met yesterday. Which statement best explains this?
      options:
        - "The hippocampus is needed to form new memories of facts and events, but not to keep older ones or perform learned skills."
        - "The hippocampus stores every memory a person has ever formed."
        - "The hippocampus controls the movements needed to play the piano."
        - "The damage must have been to his amygdala, which controls memory for people."
      option_explanations:
        - |
          Correct. The hippocampus helps form new explicit memories; older memories and motor skills rely on other regions.
        - |
          If it stored every memory, he would have lost his childhood memories too.
        - |
          Learned motor skills depend on regions such as the cerebellum; he can still play, so the hippocampus is not controlling it.
        - |
          The amygdala is involved in emotion, especially fear; the described pattern matches hippocampal damage.
      answer: 0
    - slug: appsych-u01-w04-q06
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 1
      prompt: |
        A split-brain patient stares at a dot while the word SPOON flashes briefly to the left of it. What is the patient most likely to do?
      options:
        - "Say “spoon” aloud and point to a spoon with the right hand"
        - "Say “spoon” aloud but be unable to find a spoon by touch"
        - "Fail to see anything at all with either hemisphere"
        - "Say they saw nothing, yet pick out a spoon by touch with the left hand"
      option_explanations:
        - |
          The left visual field sends the word to the right hemisphere, which usually cannot produce speech, so the patient cannot name it.
        - |
          The talking left hemisphere did not receive the word, so the patient would not say it aloud.
        - |
          The right hemisphere did receive the image, as shown by the left hand's ability to find the object.
        - |
          Correct. The right hemisphere received the word; it cannot name it aloud but can guide the left hand it controls to the spoon.
      answer: 3
    - slug: appsych-u01-w04-q07
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 1
      prompt: |
        After a stroke, a man understands what others say but speaks in slow, halting phrases such as "Walk... dog... park." Which area was most likely damaged?
      options:
        - "Wernicke's area in the temporal lobe"
        - "The somatosensory cortex in the parietal lobe"
        - "Broca's area in the frontal lobe"
        - "The thalamus"
      option_explanations:
        - |
          Damage to Wernicke's area causes fluent but meaningless speech and poor understanding, the opposite of this pattern.
        - |
          The somatosensory cortex processes touch and body position, not speech production.
        - |
          Correct. Broca's area controls speech production; damage leaves understanding largely intact but speech slow and broken.
        - |
          The thalamus relays sensory information; its damage would not produce this specific speech pattern.
      answer: 2
    - slug: appsych-u01-w04-q08
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 1
      prompt: |
        A gymnast who has spent years perfecting balance-beam routines relies on smooth, precisely timed movements. Which brain structure is most involved in this coordination?
      options:
        - "The hypothalamus"
        - "The cerebellum"
        - "The amygdala"
        - "The occipital lobe"
      option_explanations:
        - |
          The hypothalamus regulates drives such as hunger, thirst and temperature, not movement coordination.
        - |
          Correct. The cerebellum coordinates balance and timed movement and supports the learning of motor skills.
        - |
          The amygdala is involved in emotion and threat detection, not motor coordination.
        - |
          The occipital lobe processes vision; it helps the gymnast see the beam but does not coordinate the movements.
      answer: 1
    - slug: appsych-u01-w04-q09
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1 (spiral review)"
      points: 1
      prompt: |
        A person with Parkinson's disease has tremors and difficulty starting movements. Which neurotransmitter's shortage is most associated with these symptoms?
      options:
        - "Serotonin"
        - "GABA"
        - "Endorphins"
        - "Dopamine"
      option_explanations:
        - |
          Low serotonin activity is linked to mood problems such as depression, not to the movement symptoms of Parkinson's disease.
        - |
          GABA is the main inhibitory neurotransmitter; low GABA is linked to seizures and anxiety rather than Parkinson's disease.
        - |
          Endorphins relieve pain; they are not the neurotransmitter lost in Parkinson's disease.
        - |
          Correct. Parkinson's disease involves the loss of dopamine-producing neurons that help control movement.
      answer: 3
    - slug: appsych-u01-w04-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Practice 1 (spiral review)"
      points: 1
      prompt: |
        As a roller coaster begins its first drop, Kai grips the bar (his choice) while his heart speeds up (not his choice). Which pair of divisions is responsible for these two responses?
      options:
        - "Somatic for gripping; sympathetic for the faster heart"
        - "Sympathetic for gripping; somatic for the faster heart"
        - "Parasympathetic for gripping; sympathetic for the faster heart"
        - "Somatic for gripping; parasympathetic for the faster heart"
      option_explanations:
        - |
          Correct. Gripping is voluntary skeletal-muscle movement (somatic); the racing heart is sympathetic arousal.
        - |
          This reverses the two: voluntary gripping is somatic, and the automatic heart response is sympathetic.
        - |
          The parasympathetic branch calms internal organs; it does not move skeletal muscles.
        - |
          The parasympathetic branch slows the heart; a faster heart reflects sympathetic arousal.
      answer: 0
    - slug: appsych-u01-w04-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 1
      prompt: |
        A hypothetical study finds that professional pianists have a larger area of motor cortex devoted to the fingers than non-musicians. Why can't the researchers conclude that piano practice caused the difference?
      options:
        - "Brain scans cannot measure the motor cortex."
        - "The groups were not randomly assigned, so people born with larger finger areas might be more likely to become pianists."
        - "The sample included both men and women."
        - "Pianists use only their right hand."
      option_explanations:
        - |
          MRI and fMRI can measure the size and activity of the motor cortex; the problem lies in the design, not the tool.
        - |
          Correct. This is a correlational comparison of existing groups; without random assignment, the direction of cause is unknown.
        - |
          Including men and women does not prevent a causal conclusion; the lack of random assignment does.
        - |
          Pianists use both hands; in any case this statement does not address why cause cannot be inferred.
      answer: 1
    - slug: appsych-u01-w04-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 1
      prompt: |
        A 5-year-old has most of her left hemisphere removed to stop severe seizures. Years later her speech is close to typical for her age. Which concept best explains her recovery?
      options:
        - "Contralateral control"
        - "The all-or-nothing principle"
        - "Neuroplasticity"
        - "Hemispheric specialization"
      option_explanations:
        - |
          Contralateral control describes each hemisphere serving the opposite side of the body; it does not explain recovery of language.
        - |
          The all-or-nothing principle concerns single neurons firing; it does not explain how lost functions are regained.
        - |
          Correct. Especially in young children, the remaining brain can reorganize to take over functions such as language.
        - |
          Specialization would predict lasting language problems after left-hemisphere loss; her recovery shows the brain's flexibility instead.
      answer: 2
    - slug: appsych-u01-w04-q13
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 1
      prompt: |
        Doctors warn that an injury to the lowest part of the brainstem is especially dangerous. Which structure there controls heartbeat and breathing?
      options:
        - "The medulla"
        - "The thalamus"
        - "The hippocampus"
        - "The corpus callosum"
      option_explanations:
        - |
          Correct. The medulla, at the base of the brainstem, controls heartbeat and breathing.
        - |
          The thalamus sits above the brainstem and relays sensory information; it does not run heartbeat and breathing.
        - |
          The hippocampus helps form new memories; it is not in the brainstem.
        - |
          The corpus callosum connects the two hemispheres; it plays no role in heartbeat or breathing.
      answer: 0
    - slug: appsych-u01-w04-q14
      type: multi_select
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly match a brain structure with its function? Select all that apply.
      options:
        - "Thalamus: relays most incoming sensory information to the cortex"
        - "Hypothalamus: regulates hunger, thirst and body temperature"
        - "Amygdala: coordinates balance and fine movement"
        - "Reticular activating system: controls arousal and alertness"
        - "Somatosensory cortex: sends commands for voluntary movement"
      option_explanations:
        - |
          Correct. The thalamus routes sensory information (except smell) to the right areas of the cortex.
        - |
          Correct. The hypothalamus maintains these bodily balances and directs the pituitary gland.
        - |
          Balance and fine coordination are cerebellar functions; the amygdala is involved in emotion, especially fear.
        - |
          Correct. The reticular activating system in the brainstem keeps the brain awake and alert.
        - |
          The somatosensory cortex receives touch and body-position sensations; commands for movement come from the motor cortex.
      answer: [0, 1, 3]
    - slug: appsych-u01-w04-q15
      type: multi_select
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1 (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        Which pairings of a chemical messenger and its role are correct? Select all that apply.
      options:
        - "Melatonin: promotes sleepiness as darkness falls"
        - "Leptin: signals hunger from the stomach"
        - "Acetylcholine: triggers muscle contraction"
        - "Glutamate: the brain's main inhibitory neurotransmitter"
        - "Oxytocin: promotes social bonding"
      option_explanations:
        - |
          Correct. Melatonin, from the pineal gland, rises in darkness and promotes sleep.
        - |
          Leptin comes from fat cells and signals fullness; ghrelin from the stomach signals hunger.
        - |
          Correct. Acetylcholine released at nerve-muscle junctions causes muscles to contract.
        - |
          Glutamate is the main excitatory neurotransmitter; GABA is the main inhibitory one.
        - |
          Correct. Oxytocin is associated with bonding and trust, as well as childbirth and nursing.
      answer: [0, 2, 4]
    - slug: appsych-u01-w04-q16
      type: true_false
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 1
      prompt: |
        True or false: Most people use only about 10% of their brain.
      answer: false
      explanation: |
        False. Brain imaging shows activity throughout the brain over the course of a day, and damage to almost any area causes some loss of function.
    - slug: appsych-u01-w04-q17
      type: true_false
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 1
      prompt: |
        True or false: When other laboratories repeat a brain-imaging study with new participants and find the same result, confidence that the finding is reliable increases.
      answer: true
      explanation: |
        True. Replication with new samples shows that a finding is not a fluke of one group or one lab, which is why it is central to the scientific method.
    - slug: appsych-u01-w04-q18
      type: fill_blank
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 1
      prompt: |
        In split-brain patients, the band of axons that normally connects the two hemispheres, the corpus ____, has been cut.
      answer: ["callosum"]
      explanation: |
        The corpus callosum lets the hemispheres share information. Cutting it to control severe epilepsy revealed how each hemisphere specializes.
    - slug: appsych-u01-w04-q19
      type: fill_blank
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Practice 1 (spiral review)"
      points: 1
      prompt: |
        In a reflex arc, the neuron in the spinal cord that passes the signal from the sensory neuron to the motor neuron is called an ____.
      answer: ["interneuron", "interneurons", "inter-neuron"]
      explanation: |
        Interneurons in the brain and spinal cord connect sensory input to motor output; in a reflex the spinal interneuron acts before the brain is informed.
    - slug: appsych-u01-w04-q20
      type: short_answer
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practice 1"
      points: 3
      prompt: |
        A split-brain patient holds a hidden key in her right hand and a hidden coin in her left hand, without seeing either.

        (a) Which hemisphere receives the touch information from the right hand? Explain.
        (b) Will she be able to name the object in her right hand aloud? Explain.
        (c) Predict what she will say about the object in her left hand, and explain why.
      answer: |
        (a) The left hemisphere, because touch from each side of the body goes to the opposite hemisphere (contralateral control).
        (b) Yes: the left hemisphere usually controls speech, and it received the information about the key.
        (c) She will likely say she does not know or guess wrongly, because the coin's information goes to the right hemisphere, which usually cannot produce speech, and the cut corpus callosum stops it from reaching the left hemisphere.
      explanation: |
        Three points, one per part. (a) left hemisphere with contralateral reasoning. (b) yes, with the left hemisphere's role in speech. (c) cannot name it, with both the right hemisphere's limited speech and the cut corpus callosum (or the information not reaching the left hemisphere).
    - slug: appsych-u01-w04-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Practice 2 (spiral review)"
      points: 3
      prompt: |
        A hypothetical researcher wants to test whether three months of daily memory-game practice increases the size of the hippocampus in older adults.

        (a) Explain why an experiment, rather than a correlational study, is needed to test whether practice causes the change.
        (b) Describe how the researcher should form the comparison group.
        (c) Identify one ethical guideline the researcher must follow and how.
      answer: |
        (a) Only an experiment, which manipulates practice and randomly assigns people to conditions, can rule out third variables and show that practice causes the change; a correlation between game playing and hippocampus size could reflect people with better memories choosing to play.
        (b) Randomly assign volunteers either to the memory games or to a similar activity of equal time (such as watching documentaries), so that the groups are similar at the start.
        (c) Informed consent: explain the scans and time commitment before participants agree. Or the right to withdraw, or confidentiality of brain scans.
      explanation: |
        Three points, one per part. (a) the experiment's manipulation and random assignment linked to causal conclusions. (b) random assignment to a comparable control activity. (c) a named guideline applied to this study.
    - slug: appsych-u01-w04-q22
      type: long_answer
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Practices 1, 2 and 4 (Evidence-Based Question)"
      points: 7
      stimulus: |
        Three hypothetical studies (all invented for this course).

        Source A. A research team scanned 30 adult volunteers with MRI before and after three months of learning to juggle. Gray matter in areas that process visual motion increased by an average of 3%. Three months after they stopped juggling, the increase had partly disappeared.

        Source B. A case study describes a child whose left hemisphere was removed at age 4 to stop severe seizures. At first she could barely speak. By age 12, tests showed her vocabulary at the low end of the typical range for her age, and scans showed language activity in her right hemisphere.

        Source C. Forty young rats were randomly assigned to live for 60 days in either a large cage with toys, tunnels and other rats or a bare cage alone. At the end of the study the cerebral cortex of the rats from the enriched cages was, on average, 6% thicker. The procedures were approved by an animal care committee.
      prompt: |
        Answer each part using the sources.

        (A) Propose a defensible claim about how experience affects the brain.
        (B)(i) Support your claim with evidence from one source.
        (B)(ii) Explain how the evidence supports your claim, using a psychological concept. (2 points)
        (C)(i) Support your claim with evidence from a different source.
        (C)(ii) Explain how this evidence supports your claim, using a different psychological concept from (B)(ii). (2 points)
      answer: |
        (A) Claim: Experience can change the structure and organization of the brain, especially when it is intense or early in life.
        (B)(i) Source C: rats randomly assigned to enriched cages had a 6% thicker cortex than rats in bare cages.
        (B)(ii) Random assignment means the groups started out alike, so the thicker cortex can be attributed to the enriched environment: experience caused a structural change, which is neuroplasticity.
        (C)(i) Source B: after her left hemisphere was removed at age 4, the child's language recovered and language activity appeared in her right hemisphere.
        (C)(ii) In most people language is specialized to the left hemisphere (hemispheric specialization); her right hemisphere taking over shows that early experience and training can reorganize which areas handle a function.
      explanation: |
        Seven points. (A) 1 point: a defensible claim about experience and the brain that the sources can support; restating a source without a claim earns 0. (B)(i) 1 point: accurate evidence from one source. (B)(ii) 2 points: 1 for explaining how that evidence supports the claim, 1 for correctly using a psychological concept (neuroplasticity, random assignment, cerebral cortex, and so on). (C)(i) 1 point: accurate evidence from a different source. (C)(ii) 2 points: 1 for the explanation, 1 for a different, correctly used concept (hemispheric specialization, case study, contralateral control, and so on). Source A also works: gray matter rose with juggling and partly fell after stopping (use it or lose it).
