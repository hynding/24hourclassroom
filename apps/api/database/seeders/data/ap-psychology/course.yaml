# The AP Psychology course map (the revised course, effective fall 2024).
# Week files live under unit-NN-<slug>/week-NN.yaml. Titles and slugs are
# composed by Database\Seeders\Curriculum\Course from the numbers here, so
# nothing in a week file repeats the naming convention.
title: AP Psychology
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: AP Psychology
slug: appsych
# The course's site-wide address, /courses/ap-psychology (App\Support\Slugs).
site_slug: ap-psychology
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full school year of AP Psychology, following the revised course (effective
  fall 2024), one week at a time: a study guide, a flashcard deck and a quiz
  every week, a summary sheet and an exam at the end of each of the five units
  (biological bases of behavior; cognition; development and learning; social
  psychology and personality; and mental and physical health), and an
  exam-prep guide with a practice final in the May 2027 AP Psychology exam
  format (75 four-option multiple-choice questions, then an Article Analysis
  Question and an Evidence-Based Question, 7 points each). Original material written around the College Board AP
  Psychology Course and Exam Description, with original examples, invented
  study summaries and data, questions and cards; research methods and
  statistics are taught throughout, as the course's science practices ask.
  Free to copy, adapt and share under CC BY 4.0, crediting 24 Hour
  Classroom.
teacher: { name: "AP Psychology Teacher", email: appsych@example.com }
student: { name: "AP Psychology Student", email: appsych-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# The AP exam is Friday 2027-05-14, session 2 (College Board AP Students);
# weeks 33-34 review, then buffer weeks before exam week 37.
start_date: 2026-08-31
exam_date: 2027-05-14
subject: science
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The May 2027 AP Psychology exam format (fully digital in Bluebook, 75 four-option multiple-choice questions in 90 minutes, then an Article Analysis Question and an Evidence-Based Question in 70 minutes, 7 points each), how the practice final maps onto it, how each free-response part is scored, the research methods and statistics to know cold, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["AP Psychology Course and Exam Description", "CC BY 4.0"]
attribution: |
  Original study material written for this course and organised around the
  College Board AP Psychology Course and Exam Description (effective fall
  2024). Every explanation, example, study summary, data set, flashcard and
  question was written for this course; every study in a question is
  invented and says so. © 2026 24 Hour Classroom, licensed under CC BY 4.0
  (https://creativecommons.org/licenses/by/4.0/).
# The four science practices, by their CED numbers; guides tag topics with them.
practices:
  "1": Concept Application
  "2": Research Methods and Design
  "3": Data Interpretation
  "4": Argumentation
# The five units and 35 topics (CED, effective fall 2024). Each unit is
# 15-25% of the multiple-choice section.
units:
  - number: 1
    slug: unit-01-biological-bases-of-behavior
    title: Biological Bases of Behavior
    weight: "15–25%"
    weeks: [1, 2, 3, 4, 5, 6]
    topics:
      "1.1": Interaction of Heredity and Environment
      "1.2": Overview of the Nervous System
      "1.3": The Neuron and Neural Firing
      "1.4": The Brain
      "1.5": Sleep
      "1.6": Sensation
  - number: 2
    slug: unit-02-cognition
    title: Cognition
    weight: "15–25%"
    weeks: [7, 8, 9, 10, 11, 12, 13]
    topics:
      "2.1": Perception
      "2.2": Thinking, Problem-Solving, Judgments, and Decision-Making
      "2.3": Introduction to Memory
      "2.4": Encoding Memories
      "2.5": Storing Memories
      "2.6": Retrieving Memories
      "2.7": Forgetting and Other Memory Challenges
      "2.8": Intelligence and Achievement
  - number: 3
    slug: unit-03-development-and-learning
    title: Development and Learning
    weight: "15–25%"
    weeks: [14, 15, 16, 17, 18, 19, 20]
    topics:
      "3.1": Themes and Methods in Developmental Psychology
      "3.2": Physical Development Across the Lifespan
      "3.3": Gender and Sexual Orientation
      "3.4": Cognitive Development Across the Lifespan
      "3.5": Communication and Language Development
      "3.6": Social-Emotional Development Across the Lifespan
      "3.7": Classical Conditioning
      "3.8": Operant Conditioning
      "3.9": Social, Cognitive, and Neurological Factors in Learning
  - number: 4
    slug: unit-04-social-psychology-and-personality
    title: Social Psychology and Personality
    weight: "15–25%"
    weeks: [21, 22, 23, 24, 25, 26]
    topics:
      "4.1": Attribution Theory and Person Perception
      "4.2": Attitude Formation and Attitude Change
      "4.3": Psychology of Social Situations
      "4.4": Psychodynamic and Humanistic Theories of Personality
      "4.5": Social-Cognitive and Trait Theories of Personality
      "4.6": Motivation
      "4.7": Emotion
  - number: 5
    slug: unit-05-mental-and-physical-health
    title: Mental and Physical Health
    weight: "15–25%"
    weeks: [27, 28, 29, 30, 31, 32]
    topics:
      "5.1": Introduction to Health Psychology
      "5.2": Positive Psychology
      "5.3": Explaining and Classifying Psychological Disorders
      "5.4": Selection of Categories of Psychological Disorders
      "5.5": Treatment of Psychological Disorders
