week: 11
unit: 2
title: Storing and Retrieving Memories
topics: ["2.5", "2.6"]
guide: guides/week-11.md
guide_description: |
  Keeping memories and getting them back: consolidation, the hippocampus and sleep, long-term potentiation
  with glutamate and acetylcholine, emotion and the amygdala, anterograde and retrograde amnesia, infantile
  amnesia, Alzheimer's disease and superior autobiographical memory; then recall, recognition and relearning,
  retrieval cues and priming, encoding specificity (context-dependent, state-dependent and mood-congruent
  memory), the testing effect and metacognition. Worked examples: naming three retrieval effects, a
  hypothetical two-by-two context experiment in a library and a gym, and an invented recall-versus-recognition
  demonstration with an order-effect problem.
flashcards_description: |
  30 cards on consolidation and long-term potentiation, the kinds of amnesia, infantile amnesia, Alzheimer's
  disease, superior autobiographical memory, recall, recognition and relearning, retrieval cues, encoding
  specificity, the testing effect, metacognition, and the design of retrieval experiments.

flashcards:
  - front: "Consolidation → definition"
    back: |
      The process by which a new, fragile memory becomes stable and lasting, over hours to years.
    topic_code: "2.5"
  - front: "Hippocampus and consolidation → role"
    back: |
      Helps reorganize new explicit memories and shift them into lasting storage across the cortex, much of it during sleep.
    topic_code: "2.5"
  - front: "Long-term potentiation → what changes at the synapse"
    back: |
      The sending neuron releases neurotransmitter more readily and the receiving neuron becomes more responsive, sometimes by adding receptor sites.
    topic_code: "2.5"
  - front: "Glutamate → role in memory"
    back: |
      The main excitatory neurotransmitter, central to long-term potentiation.
    topic_code: "2.5"
  - front: "Emotion and memory storage → effect"
    back: |
      Stress hormones and amygdala activity during emotional events strengthen consolidation, so emotional events are remembered vividly, though not always accurately.
    topic_code: "2.5"
  - front: "Anterograde amnesia → definition"
    back: |
      Inability to form new long-term memories after brain damage or illness; old memories may remain.
    topic_code: "2.5"
  - front: "Retrograde amnesia → definition"
    back: |
      Loss of memories formed before brain damage or illness, usually hitting the most recent, least consolidated memories hardest.
    topic_code: "2.5"
  - front: "Anterograde versus retrograde → memory trick"
    back: |
      Antero- means forward: no new memories from now on. Retro- means backward: the past is lost.
    topic_code: "2.5"
  - front: "Infantile amnesia → definition"
    back: |
      The normal inability of adults to recall events from roughly the first three or four years of life.
    topic_code: "2.5"
  - front: "Infantile amnesia → explanations"
    back: |
      An immature hippocampus and frontal lobes, little language for encoding events, and a sense of self not yet developed.
    topic_code: "2.5"
  - front: "Alzheimer's disease → effect on memory"
    back: |
      A progressive disease that destroys neurons, beginning with areas including the hippocampus; new memories fail first, then older memories and other abilities. Acetylcholine-producing neurons are lost.
    topic_code: "2.5"
  - front: "Superior autobiographical memory → definition"
    back: |
      A rare ability to recall the events of almost every day of one's life in detail; it does not make people better at memorizing lists.
    topic_code: "2.5"
  - front: "Recall → definition"
    back: |
      Retrieving information without it being presented, as on a fill-in-the-blank or essay question.
    topic_code: "2.6"
  - front: "Recognition → definition"
    back: |
      Identifying information as previously learned, as on a multiple-choice question. Usually easier than recall.
    topic_code: "2.6"
  - front: "Relearning → definition"
    back: |
      Learning something again takes less time than the first time; the time saved reveals memory that recall missed.
    topic_code: "2.6"
  - front: "Retrieval cue → definition"
    back: |
      Any stimulus, such as a word, smell or place, that helps bring a stored memory back to awareness.
    topic_code: "2.6"
  - front: "Priming (in retrieval) → definition"
    back: |
      Activating one association in memory makes related memories easier to retrieve, often without conscious awareness.
    topic_code: "2.6"
  - front: "Encoding specificity principle → definition"
    back: |
      Cues present when a memory was encoded are the most effective cues for retrieving it.
    topic_code: "2.6"
  - front: "Context-dependent memory → definition"
    back: |
      Better recall in the same external setting where the information was learned.
    topic_code: "2.6"
  - front: "Divers study (Godden and Baddeley, 1975) → finding"
    back: |
      Divers who learned words underwater recalled them better underwater; those who learned on land recalled better on land: context-dependent memory.
    topic_code: "2.6"
  - front: "State-dependent memory → definition"
    back: |
      Better recall when in the same internal state (such as calm, tired or caffeinated) as during learning.
    topic_code: "2.6"
  - front: "Mood-congruent memory → definition"
    back: |
      The tendency to recall memories that match one's current mood, such as remembering sad events when sad.
    topic_code: "2.6"
  - front: "Context- versus state-dependent memory → difference"
    back: |
      Context-dependent: the external setting matches. State-dependent: the internal physical or mental state matches.
    topic_code: "2.6"
  - front: "Testing effect → definition"
    back: |
      Actively retrieving information (self-quizzing) improves long-term retention more than restudying it.
    topic_code: "2.6"
  - front: "Testing effect → study strategies that use it"
    back: |
      Practice quizzes, flashcards answered before flipping, and explaining material aloud from memory.
    topic_code: "2.6"
  - front: "Metacognition → definition"
    back: |
      Thinking about one's own thinking, including judging how well one knows something.
    topic_code: "2.6"
  - front: "Illusion of knowing after rereading → why it happens"
    back: |
      Familiar text feels known (recognition), but recall on a test is harder; self-testing gives accurate feedback.
    topic_code: "2.6"
  - front: "Context experiment with two rooms crossed → why cross them"
    back: |
      Learning and testing in both rooms rules out one room simply being a better test setting, showing that the match itself matters.
    topic_code: "2.6"
  - front: "Recall-then-recognition test → design flaw"
    back: |
      If everyone does recall first, the recall attempt may strengthen memory before recognition (an order effect); counterbalance or use separate groups.
    topic_code: "2.6"
  - front: "Retrograde amnesia → error-spot"
    back: |
      "He can't form new memories, so it's retrograde" is wrong: losing the ability to form new memories is anterograde amnesia.
    topic_code: "2.5"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topics 2.5 and 2.6: consolidation, long-term
    potentiation, amnesia, infantile amnesia, recall and recognition, encoding specificity, the testing effect
    and metacognition), with 6 questions (27%) reviewing earlier weeks (memory systems and encoding in 2.3–2.4,
    and the neuron, the brain and research methods from Unit 1). Opens with a shared-context set on one
    hypothetical context-dependent memory experiment. Multiple choice, select-all and true/false items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical context-dependent memory experiment (2.6)
    - slug: appsych-u02-w11-q01
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 1.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team had 60 volunteers learn 24 words while a recording of ocean waves played. Two days later, half were randomly assigned to be tested while the same ocean recording played and half while a recording of city traffic played, at the same volume.

        | Test condition | n | Mean words recalled (of 24) | SD |
        |---|---|---|---|
        | Same sound (ocean) | 30 | 13.5 | 3.0 |
        | Different sound (traffic) | 30 | 9.2 | 3.2 |

        The difference was statistically significant (p = .01).
      prompt: |
        Which concept do these results best support?
      options:
        - "Mood-congruent memory"
        - "Context-dependent memory"
        - "Retrograde amnesia"
        - "Infantile amnesia"
      option_explanations:
        - |
          Mood-congruent memory concerns matching one's mood to the emotional tone of memories; the manipulation here is the external sound environment.
        - |
          Correct. Recall was better when the external setting at testing (the ocean sound) matched the setting at learning, as context-dependent memory predicts.
        - |
          Retrograde amnesia is loss of memories from before brain injury; no injury or memory loss for past events is involved.
        - |
          Infantile amnesia concerns memories from early childhood, which this study of adults learning words does not address.
      answer: 1
    - slug: appsych-u02-w11-q02
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 2.B"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team had 60 volunteers learn 24 words while a recording of ocean waves played. Two days later, half were randomly assigned to be tested while the same ocean recording played and half while a recording of city traffic played, at the same volume.

        | Test condition | n | Mean words recalled (of 24) | SD |
        |---|---|---|---|
        | Same sound (ocean) | 30 | 13.5 | 3.0 |
        | Different sound (traffic) | 30 | 9.2 | 3.2 |

        The difference was statistically significant (p = .01).
      prompt: |
        A critic argues that traffic noise is simply more distracting than ocean sounds, whatever the learning context. Which change to the design would best address this criticism?
      options:
        - "Add two groups who learn with traffic sounds, tested with traffic or with ocean sounds."
        - "Test all participants in silence."
        - "Use a larger sample of participants who all learn and test with ocean sounds."
        - "Increase the number of words from 24 to 48."
      option_explanations:
        - |
          Correct. Crossing learning and testing sounds shows whether matching matters: if traffic learners recall best with traffic, distraction alone cannot explain the effect.
        - |
          Testing everyone in silence removes the comparison between matching and mismatching contexts, so the hypothesis could no longer be tested.
        - |
          If everyone learns and tests with ocean sounds there is no mismatch condition, so the criticism cannot be tested at all.
        - |
          A longer list changes the difficulty but does not separate the effect of matching from the effect of traffic being distracting.
      answer: 0
    - slug: appsych-u02-w11-q03
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team had 60 volunteers learn 24 words while a recording of ocean waves played. Two days later, half were randomly assigned to be tested while the same ocean recording played and half while a recording of city traffic played, at the same volume.

        | Test condition | n | Mean words recalled (of 24) | SD |
        |---|---|---|---|
        | Same sound (ocean) | 30 | 13.5 | 3.0 |
        | Different sound (traffic) | 30 | 9.2 | 3.2 |

        The difference was statistically significant (p = .01).
      prompt: |
        Assuming recall in the same-sound group is roughly normally distributed, about what percentage of that group recalled between 10.5 and 16.5 words?
      options:
        - "34%"
        - "50%"
        - "95%"
        - "68%"
      option_explanations:
        - |
          34% is the share between the mean and one standard deviation on just one side; 10.5 to 16.5 spans both sides.
        - |
          50% is the share above (or below) the mean, not the share within one standard deviation of it.
        - |
          95% is the share within two standard deviations of the mean (7.5 to 19.5), a wider range.
        - |
          Correct. 10.5 and 16.5 are one standard deviation (3.0) below and above the mean of 13.5, and about 68% of a normal distribution lies within one SD.
      answer: 3
    - slug: appsych-u02-w11-q04
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 2.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team had 60 volunteers learn 24 words while a recording of ocean waves played. Two days later, half were randomly assigned to be tested while the same ocean recording played and half while a recording of city traffic played, at the same volume.

        | Test condition | n | Mean words recalled (of 24) | SD |
        |---|---|---|---|
        | Same sound (ocean) | 30 | 13.5 | 3.0 |
        | Different sound (traffic) | 30 | 9.2 | 3.2 |

        The difference was statistically significant (p = .01).
      prompt: |
        Why did the researchers play both recordings at the same volume?
      options:
        - "To make the sample representative of all adults"
        - "To make sure participants gave informed consent"
        - "To control a variable that could otherwise confound the comparison"
        - "To create a second independent variable"
      option_explanations:
        - |
          Volume has nothing to do with who is in the sample; representativeness depends on how participants were selected.
        - |
          Informed consent is an ethical step taken before the study, not a feature of the recordings.
        - |
          Correct. If one recording were louder, loudness rather than the context match could explain the recall difference; holding volume constant removes that confound.
        - |
          Volume was held constant, so it is a controlled variable, not a second variable that was manipulated.
      answer: 2
    # ---- Independent items on 2.5 and 2.6
    - slug: appsych-u02-w11-q05
      type: multiple_choice
      topic_code: "2.5"
      source: "Original item; CED Topic 2.5, Skill 1.A"
      points: 1
      prompt: |
        After a car accident, Mei cannot remember anything from the week before the crash, though she remembers her childhood and has no trouble learning new information. Mei has
      options:
        - "anterograde amnesia"
        - "retrograde amnesia"
        - "infantile amnesia"
        - "superior autobiographical memory"
      option_explanations:
        - |
          Anterograde amnesia prevents new memories; Mei learns new information normally, so this does not fit.
        - |
          Correct. Losing memories from before the injury, especially the most recent and least consolidated ones, is retrograde amnesia.
        - |
          Infantile amnesia concerns the first few years of life, and Mei remembers her childhood.
        - |
          Superior autobiographical memory is unusually complete recall of one's life, the opposite of Mei's memory loss.
      answer: 1
    - slug: appsych-u02-w11-q06
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 1.A"
      points: 1
      prompt: |
        Students do better on a multiple-choice test than on a fill-in-the-blank test covering the same material. The best explanation is that
      options:
        - "recognition tasks provide retrieval cues, while recall tasks require generating the answer"
        - "multiple-choice tests rely on procedural memory"
        - "recall tasks use only sensory memory"
        - "students study harder for multiple-choice tests"
      option_explanations:
        - |
          Correct. Recognition only requires identifying a learned item among options that act as cues; recall requires producing it unaided.
        - |
          Answering factual questions uses explicit memory, not procedural memory for skills.
        - |
          Recall draws on long-term memory, not sensory memory, which lasts only seconds.
        - |
          The comparison covers the same material and does not mention study habits; the difference lies in the retrieval task itself.
      answer: 0
    - slug: appsych-u02-w11-q07
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 1.A"
      points: 1
      prompt: |
        Feeling down after a bad day, Luis finds himself remembering one disappointment after another from the past year. This best illustrates
      options:
        - "context-dependent memory"
        - "the testing effect"
        - "mood-congruent memory"
        - "anterograde amnesia"
      option_explanations:
        - |
          Context-dependent memory depends on the external setting matching; Luis's recall is shaped by his internal mood.
        - |
          The testing effect is improved retention from retrieval practice, not mood biasing which memories come to mind.
        - |
          Correct. Mood-congruent memory is the tendency to recall memories that match one's current emotional state.
        - |
          Anterograde amnesia is an inability to form new memories, which has nothing to do with which old memories come to mind.
      answer: 2
    - slug: appsych-u02-w11-q08
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 1.A"
      points: 1
      prompt: |
        Which study method makes the best use of the testing effect?
      options:
        - "Rereading the chapter three times"
        - "Highlighting key terms in different colors"
        - "Copying the teacher's notes neatly"
        - "Closing the book and writing down everything you remember, then checking"
      option_explanations:
        - |
          Rereading is restudying; it creates familiarity but little active retrieval.
        - |
          Highlighting marks information without requiring you to retrieve it from memory.
        - |
          Copying notes involves reading and writing but no retrieval from memory.
        - |
          Correct. Writing what you remember from memory is retrieval practice, and checking afterward supports accurate metacognition.
      answer: 3
    - slug: appsych-u02-w11-q09
      type: multiple_choice
      topic_code: "2.5"
      source: "Original item; CED Topic 2.5, Skill 1.A"
      points: 1
      prompt: |
        A researcher finds that rats given a drug that blocks long-term potentiation have great difficulty learning a maze. This finding supports the idea that
      options:
        - "memories are stored only in the cerebellum"
        - "learning depends on the strengthening of synaptic connections"
        - "the drug causes infantile amnesia"
        - "memory does not involve neurotransmitters"
      option_explanations:
        - |
          The finding concerns a synaptic process found in many regions, especially the hippocampus; it does not show storage only in the cerebellum.
        - |
          Correct. Blocking LTP, the lasting strengthening of synapses, impairs learning, which suggests that LTP is a neural basis of memory.
        - |
          Infantile amnesia is the normal loss of very early childhood memories in humans, not a drug effect in adult rats.
        - |
          LTP depends on neurotransmitters such as glutamate, so the finding supports their involvement.
      answer: 1
    - slug: appsych-u02-w11-q10
      type: multiple_choice
      topic_code: "2.5"
      source: "Original item; CED Topic 2.5, Skill 1.A"
      points: 1
      prompt: |
        Most adults cannot recall any events from before about age three. Which explanation is most consistent with research on infantile amnesia?
      options:
        - "Young children do not experience emotions."
        - "Young children's memories are repressed because they are traumatic."
        - "Early memories are stored perfectly but are blocked by sleep."
        - "The hippocampus and language skills are still developing, so early events are not encoded or stored in a lasting, retrievable form."
      option_explanations:
        - |
          Young children clearly experience emotions; this is not why early memories are lost.
        - |
          Infantile amnesia is universal and covers ordinary events, so repression of trauma does not explain it.
        - |
          Sleep helps consolidate memories rather than blocking them, and early memories are not thought to be stored perfectly.
        - |
          Correct. An immature hippocampus, limited language and an undeveloped sense of self mean early events are not stored in a lasting, retrievable way.
      answer: 3
    # ---- Spiral review: 2.3, 2.4 and Unit 1
    - slug: appsych-u02-w11-q11
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Which situation is the best example of effortful processing?
      options:
        - "Memorizing the steps of a chemistry procedure for a lab practical"
        - "Knowing that you ate breakfast before you brushed your teeth this morning"
        - "Noticing how often a song played on the radio this week"
        - "Recalling where on the page a picture appeared"
      option_explanations:
        - |
          Correct. Deliberately memorizing procedural steps requires attention and effort, which is effortful processing.
        - |
          The order of everyday events (time) is encoded automatically, without effort.
        - |
          Frequency information is encoded automatically.
        - |
          Spatial location on a page is encoded automatically.
      answer: 0
    - slug: appsych-u02-w11-q12
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Knowing that the hippocampus is part of the limbic system, without remembering when you learned it, is an example of
      options:
        - "episodic memory"
        - "procedural memory"
        - "semantic memory"
        - "echoic memory"
      option_explanations:
        - |
          Episodic memory includes the time and place of a personal experience; this fact is remembered without that context.
        - |
          Procedural memory is for skills, such as riding a bike, not for facts.
        - |
          Correct. General knowledge recalled without its learning context is semantic memory, a form of explicit memory.
        - |
          Echoic memory is a brief auditory sensory store lasting a few seconds.
      answer: 2
    - slug: appsych-u02-w11-q13
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Alzheimer's disease involves the loss of neurons that produce a neurotransmitter important for learning and memory. Which neurotransmitter is it?
      options:
        - "Serotonin"
        - "Acetylcholine"
        - "Endorphins"
        - "GABA"
      option_explanations:
        - |
          Serotonin is linked mainly to mood, appetite and sleep, not to the memory loss central to Alzheimer's disease.
        - |
          Correct. Acetylcholine supports learning, memory and muscle action, and acetylcholine-producing neurons are lost in Alzheimer's disease.
        - |
          Endorphins are the body's natural painkillers; they are not the neurotransmitter lost in Alzheimer's disease.
        - |
          GABA is the main inhibitory neurotransmitter; its role is calming neural activity, not the memory loss of Alzheimer's.
      answer: 1
    - slug: appsych-u02-w11-q14
      type: multi_select
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which situations illustrate the encoding specificity principle? Select all that apply.
      options:
        - "Returning to your childhood home brings back memories you had not thought of in years."
        - "A swimmer who memorized a speech while calm forgets it when nervous at the podium."
        - "Grouping a phone number into three chunks"
        - "The smell of sunscreen reminds you of a beach trip."
        - "Forgetting a list because you were not paying attention when you heard it"
      option_explanations:
        - |
          Correct. Being back in the setting where memories were formed provides context cues that bring them back.
        - |
          Correct. A mismatch between the calm learning state and the nervous testing state impairs retrieval: state-dependent memory.
        - |
          Chunking is an encoding strategy, not an example of encoding cues later helping retrieval.
        - |
          Correct. A smell that was present at encoding acts as a powerful retrieval cue.
        - |
          Failing to attend means the information was never encoded, so this is encoding failure, not a cue mismatch at retrieval.
      answer: [0, 1, 3]
    - slug: appsych-u02-w11-q15
      type: multi_select
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.B (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        Which methods let researchers see the activity or structure of the living human brain? Select all that apply.
      options:
        - "fMRI, which tracks changes in blood flow"
        - "EEG, which records electrical activity through electrodes on the scalp"
        - "A case study of personality traits based on interviews"
        - "MRI, which shows detailed brain structure"
        - "A survey of sleep habits"
      option_explanations:
        - |
          Correct. fMRI shows which areas are more active by measuring changes in blood oxygen and flow.
        - |
          Correct. EEG records the brain's electrical activity, useful for studying sleep stages and timing.
        - |
          Interviews can describe behavior, but they do not image the brain's activity or structure.
        - |
          Correct. MRI uses magnetic fields to produce detailed images of brain structure.
        - |
          Surveys collect self-reports about behavior and do not image the brain.
      answer: [0, 1, 3]
    - slug: appsych-u02-w11-q16
      type: true_false
      topic_code: "2.5"
      source: "Original item; CED Topic 2.5, Skill 1.A"
      points: 1
      prompt: |
        True or false: People with superior autobiographical memory are also unusually good at memorizing lists of unrelated words.
      answer: false
      explanation: |
        False. People with superior autobiographical memory recall the events of their own lives in remarkable detail, but they are typically no better than others at memorizing word lists, which suggests autobiographical memory is a distinct system.
    - slug: appsych-u02-w11-q17
      type: true_false
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: If people count backward for 30 seconds before recalling a list, the recency effect shrinks but the primacy effect largely remains.
      answer: true
      explanation: |
        True. The last items depend on short-term memory, which the distracting task displaces; the first items were rehearsed into long-term memory, so they survive the delay.
    - slug: appsych-u02-w11-q18
      type: fill_blank
      topic_code: "2.5"
      source: "Original item; CED Topic 2.5, Skill 1.A"
      points: 1
      prompt: |
        An inability to form new long-term memories after brain damage is called ____ amnesia.
      answer: ["anterograde"]
      explanation: |
        Anterograde amnesia affects memory going forward from the damage; retrograde amnesia affects memories from before it.
    - slug: appsych-u02-w11-q19
      type: fill_blank
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 1.A"
      points: 1
      prompt: |
        Thinking about your own thinking, such as judging how well you know material before a test, is called ____.
      answer: ["metacognition", "meta-cognition"]
      explanation: |
        Metacognition is awareness of one's own cognitive processes. Self-testing gives more accurate metacognitive judgments than the feeling of familiarity from rereading.
    - slug: appsych-u02-w11-q20
      type: short_answer
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 1.A"
      points: 3
      prompt: |
        Hana studies for her AP Psychology exam at the same desk every afternoon, after her usual cup of tea.

        (a) Explain how context-dependent memory could affect her performance if she takes the exam in a large gym.
        (b) Explain how state-dependent memory could help her on exam day.
        (c) Explain why making practice quizzes would help her more than rereading her notes.
      answer: |
        (a) She learned at her desk, so the gym lacks the context cues present during encoding; her recall may be somewhat worse there.
        (b) If she has her usual tea before the exam, her internal state will match her study state, providing state cues that aid retrieval.
        (c) The testing effect: retrieving information strengthens memory more than restudying, and quizzes show her what she does not yet know (metacognition).
      explanation: |
        Three points, one per part. (a) a mismatch in external setting between study and test. (b) matching the internal state (the tea) at test. (c) retrieval practice strengthens memory, or self-testing improves metacognition; "quizzes are fun" earns nothing.
    - slug: appsych-u02-w11-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.A (spiral review)"
      points: 3
      prompt: |
        A researcher hypothesizes that taking practice quizzes improves exam scores.

        (a) Identify the independent and dependent variables in an experiment testing this hypothesis.
        (b) Describe an appropriate control group.
        (c) Explain why the researcher should use a double-blind procedure when grading the exams.
      answer: |
        (a) IV: whether students take practice quizzes. DV: exam score.
        (b) Students who spend the same amount of time studying the same material without quizzes (for example, rereading).
        (c) If graders know which students took quizzes, their expectations could bias scoring (experimenter bias); keeping graders and students unaware of the hypothesis or condition prevents this. (Single-blind graders accepted if the reason is bias in scoring.)
      explanation: |
        Three points, one per part. (a) both variables. (b) a group equal in study time and material but without quizzes. (c) controlling experimenter bias or expectancy effects in grading.
    - slug: appsych-u02-w11-q22
      type: long_answer
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skills 2.A, 2.C, 3.A, 4.B"
      points: 6
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 120 tenth graders from two schools. All read the same 1,000-word article about volcanoes. Students were randomly assigned either to reread the article for 10 minutes (restudy) or to write down everything they could remember for 10 minutes (retrieval). One week later, the restudy group answered a mean of 42% of test questions correctly (SD 12) and the retrieval group 61% (SD 11). The difference was statistically significant. Parents gave consent, students gave assent, and students could stop at any time.
      prompt: |
        (A) Identify the research method and explain how you know.
        (B) State the operational definition of learning in this study.
        (C) Describe what the means and standard deviations show.
        (D) Identify the ethical guideline shown by letting students stop at any time.
        (E) Explain one reason the results may not generalize to all students.
        (F) Explain how the findings support the claim that self-quizzing is a better study strategy than rereading, using a psychological concept.
      answer: |
        (A) An experiment: the study method was manipulated and students were randomly assigned to conditions.
        (B) The percentage of test questions answered correctly one week later.
        (C) The retrieval group averaged 19 percentage points higher, with similar spread (SDs of 11 and 12), so the difference is large relative to the variability.
        (D) The right to withdraw (part of voluntary informed consent).
        (E) Students came from only two schools and read a single science article; other students, subjects or materials might differ.
        (F) The testing effect: actively retrieving information strengthens memory more than restudying, so the retrieval group remembered more after a week.
      explanation: |
        Six points. (A) 1 point: experiment with manipulation or random assignment. (B) 1 point: percentage correct a week later. (C) 1 point: a correct comparison of means that also uses the SDs. (D) 1 point: right to withdraw. (E) 1 point: a specific sample or material limitation. (F) 1 point: the testing effect (or retrieval practice) linked to the result.
