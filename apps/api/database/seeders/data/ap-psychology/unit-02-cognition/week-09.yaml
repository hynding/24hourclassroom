week: 9
unit: 2
title: How Memory Is Organized
topics: ["2.3"]
guide: guides/week-09.md
guide_description: |
  The map of memory: explicit memory (episodic and semantic) and implicit memory (procedural, priming and
  conditioned responses), prospective memory, the multi-store model (sensory, short-term and long-term memory,
  with attention and maintenance rehearsal), the working memory model (central executive, phonological loop,
  visuospatial sketchpad, episodic buffer), levels of processing, and the brain structures behind each kind of
  memory, with the case of Henry Molaison and long-term potentiation. Worked examples: classifying four
  everyday memories, a hypothetical within-subjects levels-of-processing experiment read through its means and
  standard deviations, and what a single case study can and cannot show.
flashcards_description: |
  30 cards on explicit and implicit memory and their subtypes, prospective memory, the multi-store and
  working memory models, levels of processing, the memory roles of the hippocampus, cerebellum, basal ganglia,
  amygdala and frontal lobes, long-term potentiation, and how memory experiments are designed.

flashcards:
  - front: "Memory → definition"
    back: |
      Learning that persists over time: information that has been encoded, stored and can be retrieved.
    topic_code: "2.3"
  - front: "Explicit (declarative) memory → definition"
    back: |
      Memory of facts and experiences that you can consciously recall and put into words.
    topic_code: "2.3"
  - front: "Episodic memory → definition and example"
    back: |
      Explicit memory of personal experiences tied to a time and place: remembering your first concert.
    topic_code: "2.3"
  - front: "Semantic memory → definition and example"
    back: |
      Explicit memory of general facts and knowledge, separate from when you learned them: knowing that water boils at 100 °C at sea level.
    topic_code: "2.3"
  - front: "Implicit (nondeclarative) memory → definition"
    back: |
      Memory expressed in behavior without conscious recollection: skills, priming and classically conditioned responses.
    topic_code: "2.3"
  - front: "Procedural memory → definition and example"
    back: |
      Implicit memory for how to perform skills and habits, such as swimming or typing. It is easier to do than to describe.
    topic_code: "2.3"
  - front: "Prospective memory → definition"
    back: |
      Remembering to carry out an intended action in the future, such as taking a pill at 8 p.m.
    topic_code: "2.3"
  - front: "Encoding, storage, retrieval → the three memory processes"
    back: |
      Encoding gets information into memory, storage keeps it over time, and retrieval brings it back into awareness.
    topic_code: "2.3"
  - front: "Multi-store model (Atkinson and Shiffrin, 1968) → three stores"
    back: |
      Sensory memory, then short-term memory (for what is attended to), then long-term memory (for what is encoded more deeply).
    topic_code: "2.3"
  - front: "Sensory memory → capacity and duration"
    back: |
      Large capacity, very brief: under a second for visual (iconic) memory and a few seconds for auditory (echoic) memory.
    topic_code: "2.3"
  - front: "Iconic memory versus echoic memory → difference"
    back: |
      Iconic is visual sensory memory (a fraction of a second); echoic is auditory sensory memory (about 3 to 4 seconds).
    topic_code: "2.3"
  - front: "Short-term memory → capacity and duration"
    back: |
      Limited (classically 7 ± 2 items; later estimates nearer 4 chunks), lasting about 20 to 30 seconds without rehearsal.
    topic_code: "2.3"
  - front: "Maintenance rehearsal → definition"
    back: |
      Repeating information to keep it active in short-term memory, like saying a phone number over and over.
    topic_code: "2.3"
  - front: "Long-term memory → capacity and duration"
    back: |
      A relatively permanent store with essentially unlimited capacity.
    topic_code: "2.3"
  - front: "Working memory → definition"
    back: |
      Short-term memory understood as an active workspace for holding and manipulating information, as in mental arithmetic.
    topic_code: "2.3"
  - front: "Working memory model (Baddeley and Hitch, 1974) → components"
    back: |
      Central executive, phonological loop and visuospatial sketchpad; the episodic buffer was added in 2000.
    topic_code: "2.3"
  - front: "Central executive → role"
    back: |
      Directs attention and coordinates the other working-memory components.
    topic_code: "2.3"
  - front: "Phonological loop → role"
    back: |
      Holds and rehearses speech sounds and words, the "inner voice" repeating a list.
    topic_code: "2.3"
  - front: "Visuospatial sketchpad → role"
    back: |
      Holds and manipulates images and spatial layouts, such as picturing a map or rotating a shape.
    topic_code: "2.3"
  - front: "Episodic buffer → role"
    back: |
      Combines information from the other components and from long-term memory into a single integrated episode.
    topic_code: "2.3"
  - front: "Levels of processing (Craik and Lockhart, 1972) → main claim"
    back: |
      The deeper information is processed, the better it is remembered: semantic beats phonemic, which beats structural.
    topic_code: "2.3"
  - front: "Structural, phonemic, semantic processing → examples"
    back: |
      Structural: Is the word in capitals? Phonemic: Does it rhyme with "cat"? Semantic: Is it a kind of tool?
    topic_code: "2.3"
  - front: "Hippocampus → memory role"
    back: |
      Forms new explicit memories and helps consolidate them for long-term storage elsewhere in the cortex.
    topic_code: "2.3"
  - front: "Cerebellum → memory role"
    back: |
      Implicit memories for timed motor responses and classically conditioned reflexes.
    topic_code: "2.3"
  - front: "Basal ganglia → memory role"
    back: |
      Procedural memory for skills and habits.
    topic_code: "2.3"
  - front: "Amygdala → memory role"
    back: |
      Strengthens memories for emotionally significant events.
    topic_code: "2.3"
  - front: "Frontal lobes → memory role"
    back: |
      Working memory, prospective memory, and organizing and retrieving explicit memories.
    topic_code: "2.3"
  - front: "Henry Molaison (H.M.) → what his case showed"
    back: |
      After surgery removed much of his hippocampus in 1953 he could not form new explicit memories, yet he learned mirror tracing: explicit and implicit memory rely on different systems.
    topic_code: "2.3"
  - front: "Long-term potentiation (LTP) → definition"
    back: |
      A lasting increase in a synapse's efficiency after repeated stimulation; a likely neural basis of learning and memory.
    topic_code: "2.3"
  - front: "Within-subjects memory experiment → why counterbalance"
    back: |
      Every participant does every condition, so the order is varied to keep practice or fatigue from favoring whichever condition comes last.
    topic_code: "2.3"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 2.3: kinds of memory, the multi-store and
    working memory models, levels of processing and the brain structures of memory), with 6 questions (27%)
    reviewing earlier weeks (perception and thinking in 2.1–2.2, and the neuron, the brain and research methods
    from Unit 1). Opens with a shared-context set on one hypothetical levels-of-processing experiment. Multiple
    choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical levels-of-processing experiment (2.3)
    - slug: appsych-u02-w09-q01
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 2.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team showed 45 volunteers a list of 45 nouns, one at a time. Each participant answered one of three questions about every word: "Is it printed in red?" (15 words), "Does it rhyme with 'bat'?" (15 words) or "Would it fit in a backpack?" (15 words). The order of the question types was counterbalanced across participants. Thirty minutes later, without warning, everyone wrote down all the words they could remember.

        | Question type | Mean words recalled (of 15) | Standard deviation |
        |---|---|---|
        | Printed in red? | 2.4 | 1.2 |
        | Rhymes with "bat"? | 4.7 | 1.6 |
        | Fits in a backpack? | 8.9 | 2.1 |
      prompt: |
        Which research design does this study use?
      options:
        - "A within-subjects experiment, because each participant experienced all three question types"
        - "A between-subjects experiment, because three different groups answered different questions"
        - "A correlational study, because no variable was manipulated"
        - "A case study, because each participant's recall was recorded"
      option_explanations:
        - |
          Correct. Every participant answered all three kinds of question, so each person served in every condition: a within-subjects (repeated measures) design.
        - |
          There were not separate groups; the same 45 volunteers each answered all three types of question.
        - |
          The researchers manipulated the type of question asked about each word, so this is an experiment, not a correlational study.
        - |
          A case study examines one person or a few in depth; this study compared conditions across 45 volunteers.
      answer: 0
    - slug: appsych-u02-w09-q02
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team showed 45 volunteers a list of 45 nouns, one at a time. Each participant answered one of three questions about every word: "Is it printed in red?" (15 words), "Does it rhyme with 'bat'?" (15 words) or "Would it fit in a backpack?" (15 words). The order of the question types was counterbalanced across participants. Thirty minutes later, without warning, everyone wrote down all the words they could remember.

        | Question type | Mean words recalled (of 15) | Standard deviation |
        |---|---|---|
        | Printed in red? | 2.4 | 1.2 |
        | Rhymes with "bat"? | 4.7 | 1.6 |
        | Fits in a backpack? | 8.9 | 2.1 |
      prompt: |
        Which model of memory do these results most directly support?
      options:
        - "The multi-store model's claim that sensory memory lasts under a second"
        - "The working memory model's division into a phonological loop and a visuospatial sketchpad"
        - "The levels-of-processing model, because deeper, meaning-based processing produced the best recall"
        - "The claim that procedural memory depends on the basal ganglia"
      option_explanations:
        - |
          The study measured recall after 30 minutes, not how long sensory traces last, so it does not test that claim.
        - |
          The study varied depth of processing, not which working-memory component was used, so it does not test that division.
        - |
          Correct. Recall rose from structural (color) to phonemic (rhyme) to semantic (meaning) questions, exactly as levels of processing predicts.
        - |
          The words were explicit, verbal material; the study says nothing about skills or the basal ganglia.
      answer: 2
    - slug: appsych-u02-w09-q03
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 2.B"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team showed 45 volunteers a list of 45 nouns, one at a time. Each participant answered one of three questions about every word: "Is it printed in red?" (15 words), "Does it rhyme with 'bat'?" (15 words) or "Would it fit in a backpack?" (15 words). The order of the question types was counterbalanced across participants. Thirty minutes later, without warning, everyone wrote down all the words they could remember.

        | Question type | Mean words recalled (of 15) | Standard deviation |
        |---|---|---|
        | Printed in red? | 2.4 | 1.2 |
        | Rhymes with "bat"? | 4.7 | 1.6 |
        | Fits in a backpack? | 8.9 | 2.1 |
      prompt: |
        Why did the researchers counterbalance the order of the question types?
      options:
        - "To make sure the sample represented all adults"
        - "To keep practice or fatigue effects from favoring one question type"
        - "To make the dependent variable easier to measure"
        - "To keep participants' identities confidential"
      option_explanations:
        - |
          Representativeness depends on how participants were sampled, not on the order in which conditions were presented.
        - |
          Correct. In a within-subjects design, the condition done last could benefit from practice or suffer from fatigue; varying the order spreads those effects evenly.
        - |
          The dependent variable (words recalled) is measured the same way whatever the order; counterbalancing addresses order effects.
        - |
          Confidentiality concerns protecting data and identities, which is unrelated to the order of conditions.
      answer: 1
    - slug: appsych-u02-w09-q04
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team showed 45 volunteers a list of 45 nouns, one at a time. Each participant answered one of three questions about every word: "Is it printed in red?" (15 words), "Does it rhyme with 'bat'?" (15 words) or "Would it fit in a backpack?" (15 words). The order of the question types was counterbalanced across participants. Thirty minutes later, without warning, everyone wrote down all the words they could remember.

        | Question type | Mean words recalled (of 15) | Standard deviation |
        |---|---|---|
        | Printed in red? | 2.4 | 1.2 |
        | Rhymes with "bat"? | 4.7 | 1.6 |
        | Fits in a backpack? | 8.9 | 2.1 |
      prompt: |
        Which statement about the data is accurate?
      options:
        - "Recall in the backpack condition was the most variable, and its mean was more than three times the mean in the red-print condition."
        - "Every participant recalled more backpack words than red-print words."
        - "The red-print condition had the most spread in recall."
        - "Recall in the rhyme condition was about half of recall in the red-print condition."
      option_explanations:
        - |
          Correct. The backpack condition has the largest SD (2.1), and 8.9 is about 3.7 times 2.4.
        - |
          Means describe groups, not every individual; some participants may have recalled more red-print words than backpack words.
        - |
          The red-print condition has the smallest SD (1.2), so it had the least spread, not the most.
        - |
          The rhyme mean (4.7) is about twice the red-print mean (2.4), not half of it.
      answer: 0
    # ---- Independent items on 2.3
    - slug: appsych-u02-w09-q05
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      prompt: |
        Tomás can recall exactly where he was standing when he heard his team had won the state championship. This is an example of
      options:
        - "semantic memory"
        - "episodic memory"
        - "procedural memory"
        - "iconic memory"
      option_explanations:
        - |
          Semantic memory holds general facts detached from personal context; Tomás remembers a personal event with a time and place.
        - |
          Correct. Episodic memory is explicit memory of personal experiences tied to a specific time and place.
        - |
          Procedural memory is implicit memory for skills; recalling an event is explicit.
        - |
          Iconic memory is visual sensory memory lasting under a second, not a lasting memory of an event.
      answer: 1
    - slug: appsych-u02-w09-q06
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      prompt: |
        An experienced pianist can play a piece flawlessly but cannot say which finger plays which note without looking at her hands. Her playing relies mainly on
      options:
        - "episodic memory, stored in the hippocampus"
        - "echoic memory"
        - "procedural memory, an implicit memory supported by the cerebellum and basal ganglia"
        - "prospective memory"
      option_explanations:
        - |
          Episodic memory is conscious recall of events; she cannot consciously report the finger patterns, which points to implicit memory.
        - |
          Echoic memory is a brief auditory sensory store lasting a few seconds; it cannot hold a learned motor skill.
        - |
          Correct. A skill performed without conscious recall of the steps is procedural memory, supported by the cerebellum and basal ganglia.
        - |
          Prospective memory is remembering to do something in the future, not performing a practiced skill.
      answer: 2
    - slug: appsych-u02-w09-q07
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      prompt: |
        Lena repeats a new locker combination to herself as she walks to her locker. According to the multi-store model, she is using
      options:
        - "maintenance rehearsal to keep the information in short-term memory"
        - "iconic memory to store the combination permanently"
        - "deep semantic processing"
        - "the visuospatial sketchpad"
      option_explanations:
        - |
          Correct. Repeating information keeps it active in short-term memory; that is maintenance rehearsal.
        - |
          Iconic memory is a visual store lasting under a second; it cannot hold a combination for a walk down the hall, let alone permanently.
        - |
          Repeating numbers involves little thought about meaning, so it is shallow rather than deep semantic processing.
        - |
          Repeating numbers silently uses the phonological loop; the sketchpad handles images and spatial information.
      answer: 0
    - slug: appsych-u02-w09-q08
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      prompt: |
        A patient has damage to the hippocampus on both sides of the brain. Which ability is most likely to be impaired?
      options:
        - "Riding a bicycle, a skill learned years ago"
        - "Blinking in response to a conditioned tone"
        - "Recalling the meanings of common words learned in childhood"
        - "Forming new memories of people met after the injury"
      option_explanations:
        - |
          Riding a bike is a procedural memory that depends on the cerebellum and basal ganglia, not the hippocampus.
        - |
          Conditioned reflexes such as eyeblinks depend largely on the cerebellum and usually survive hippocampal damage.
        - |
          Old semantic memories are stored across the cortex and are usually preserved after hippocampal damage.
        - |
          Correct. The hippocampus is needed to form new explicit memories, so new people and events are not retained.
      answer: 3
    - slug: appsych-u02-w09-q09
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      prompt: |
        While solving a multi-step math problem in his head, Kwame holds the intermediate results and decides what to compute next. Which concept best describes this?
      options:
        - "Sensory memory"
        - "Working memory, coordinated by the central executive"
        - "Long-term potentiation"
        - "Semantic memory"
      option_explanations:
        - |
          Sensory memory holds raw input for a moment; it cannot hold and manipulate intermediate results.
        - |
          Correct. Holding and manipulating information while deciding what to do next is working memory, directed by the central executive.
        - |
          Long-term potentiation is the strengthening of synapses with repeated use, a neural process rather than a description of mental arithmetic.
        - |
          Semantic memory supplies the math facts, but holding and updating the intermediate results is working memory.
      answer: 1
    - slug: appsych-u02-w09-q10
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      prompt: |
        Which situation relies most on prospective memory?
      options:
        - "Recalling the plot of a movie seen last week"
        - "Knowing that Mars is the fourth planet from the sun"
        - "Remembering to stop at the store for milk on the way home"
        - "Typing a password without thinking about the letters"
      option_explanations:
        - |
          Recalling a past movie is episodic memory, a memory of the past rather than an intention for the future.
        - |
          Knowing a fact about Mars is semantic memory, not remembering a future action.
        - |
          Correct. Prospective memory is remembering to carry out an intended action at a future time.
        - |
          Typing a password automatically is procedural (implicit) memory.
      answer: 2
    # ---- Spiral review: 2.1, 2.2 and Unit 1
    - slug: appsych-u02-w09-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A student's schema for "dinosaur" includes only huge, scaly reptiles. After learning that many dinosaurs had feathers, she revises her schema. Which process is this?
      options:
        - "Accommodation"
        - "Assimilation"
        - "Functional fixedness"
        - "The availability heuristic"
      option_explanations:
        - |
          Correct. Changing an existing schema to fit new information that does not match it is accommodation.
        - |
          Assimilation fits new information into an existing schema without changing it; here the schema itself changed.
        - |
          Functional fixedness is seeing an object only in its usual use, which has nothing to do with updating a schema.
        - |
          The availability heuristic is a judgment shortcut based on ease of recall, not the revision of a schema.
      answer: 0
    - slug: appsych-u02-w09-q12
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        At a loud party, Jae is absorbed in a conversation but immediately turns when someone across the room says her name. This best illustrates
      options:
        - "change blindness"
        - "the cocktail party effect, a feature of selective attention"
        - "shape constancy"
        - "the phi phenomenon"
      option_explanations:
        - |
          Change blindness is missing a change in a scene; Jae noticed something, her name, rather than missing a change.
        - |
          Correct. Even while attending to one conversation, unattended input is monitored enough that a personally important word, like her name, breaks through.
        - |
          Shape constancy keeps an object's perceived shape stable; it concerns vision, not detecting one's name in noise.
        - |
          The phi phenomenon is apparent motion from flashing lights, unrelated to hearing one's name.
      answer: 1
    - slug: appsych-u02-w09-q13
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 3.A (spiral review)"
      points: 1
      prompt: |
        On a memory test scored from 0 to 50, ten students scored 12, 15, 18, 20, 21, 22, 24, 25, 27 and 46. Which measure of central tendency is most affected by the score of 46?
      options:
        - "The median"
        - "The mode"
        - "The range"
        - "The mean"
      option_explanations:
        - |
          The median is the middle of the ordered scores (21.5 here) and is resistant to an extreme value; it would be the same if 46 were 28.
        - |
          No score repeats, so there is no mode, and an extreme score would not affect a mode anyway.
        - |
          The range is a measure of variability, not central tendency, so it does not answer the question, even though the 46 does stretch it: it would drop from 34 to 15 without the 46.
        - |
          Correct. The mean uses every value, so the outlier of 46 pulls it up (to 23.0, compared with 20.4 for the other nine scores).
      answer: 3
    - slug: appsych-u02-w09-q14
      type: multi_select
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are forms of implicit (nondeclarative) memory? Select all that apply.
      options:
        - "Knowing how to tie your shoes"
        - "Remembering what you ate at your birthday dinner"
        - "Feeling anxious at the sound of a dentist's drill after painful visits"
        - "Recognizing a word faster because you saw it a minute ago"
        - "Stating the year the Declaration of Independence was signed"
      option_explanations:
        - |
          Correct. Tying shoes is a procedural skill performed without conscious recall of the steps.
        - |
          A specific personal event with a time and place is episodic, an explicit memory.
        - |
          Correct. A classically conditioned emotional response is a form of implicit memory.
        - |
          Correct. Faster recognition after prior exposure is priming, an implicit memory effect.
        - |
          Stating a historical fact is semantic memory, which is explicit.
      answer: [0, 2, 3]
    - slug: appsych-u02-w09-q15
      type: multi_select
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        Long-term potentiation strengthens communication between neurons. Which statements about neural communication are accurate? Select all that apply.
      options:
        - "Neurotransmitters cross the synapse from the sending neuron to the receiving neuron."
        - "An action potential travels down the axon toward the axon terminals."
        - "Myelin slows the action potential down."
        - "Reuptake returns some neurotransmitter molecules to the sending neuron."
        - "Dendrites send messages to other neurons."
      option_explanations:
        - |
          Correct. Neurotransmitters released by the sending neuron cross the synaptic gap and bind to receptors on the receiving neuron.
        - |
          Correct. The action potential moves along the axon from the cell body toward the terminals.
        - |
          Myelin insulates the axon and speeds the action potential; its loss slows transmission.
        - |
          Correct. Reuptake is the reabsorption of excess neurotransmitter by the sending neuron.
        - |
          Dendrites receive messages; the axon terminals send them.
      answer: [0, 1, 3]
    - slug: appsych-u02-w09-q16
      type: true_false
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      prompt: |
        True or false: According to the working memory model, it is easier to do two tasks at once when one uses the phonological loop and the other uses the visuospatial sketchpad than when both use the phonological loop.
      answer: true
      explanation: |
        True. The loop and the sketchpad are separate components with their own limited capacity, so tasks that use different components interfere less than tasks that compete for the same one.
    - slug: appsych-u02-w09-q17
      type: true_false
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: The amygdala, part of the limbic system, is involved in emotions such as fear and helps strengthen memories of emotional events.
      answer: true
      explanation: |
        True. The amygdala processes emotions, especially fear and aggression, and its activity during emotional events helps make those memories stronger.
    - slug: appsych-u02-w09-q18
      type: fill_blank
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      prompt: |
        A lasting increase in a synapse's efficiency after repeated stimulation is called long-term ____.
      answer: ["potentiation", "potentiation (ltp)", "ltp"]
      explanation: |
        Long-term potentiation (LTP) is the strengthening of a synapse through repeated use and is considered a neural basis of learning and memory.
    - slug: appsych-u02-w09-q19
      type: fill_blank
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 1
      prompt: |
        The brief, visual form of sensory memory that lasts less than a second is called ____ memory.
      answer: ["iconic", "iconic sensory"]
      explanation: |
        Iconic memory is the visual sensory store: a nearly complete image that fades in a fraction of a second. Its auditory counterpart is echoic memory.
    - slug: appsych-u02-w09-q20
      type: short_answer
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A"
      points: 3
      prompt: |
        Rosa is studying for a biology test on the parts of the cell.

        (a) Using the levels-of-processing model, explain why writing her own explanations of each organelle would help more than rereading her notes.
        (b) Explain how the multi-store model accounts for her forgetting the textbook page number she glanced at while studying.
        (c) Identify the brain structure most needed to form new explicit memories of the material.
      answer: |
        (a) Explaining in her own words requires semantic (deep) processing of meaning, which produces stronger memories than the shallow processing involved in rereading.
        (b) She did not attend to or rehearse the page number, so it never moved beyond sensory or short-term memory and faded.
        (c) The hippocampus.
      explanation: |
        Three points, one per part. (a) deep, meaning-based processing tied to better recall. (b) lack of attention or rehearsal means the information never reached long-term memory. (c) hippocampus; "the brain" or "the cerebellum" earns nothing.
    - slug: appsych-u02-w09-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.A (spiral review)"
      points: 3
      prompt: |
        Much of what psychologists first learned about the hippocampus came from studying one patient in depth.

        (a) Identify the research method that studies one person in great depth.
        (b) Explain one strength of this method for studying memory.
        (c) Explain one limitation of this method.
      answer: |
        (a) A case study.
        (b) It can study rare conditions, such as specific brain damage, that could never be created ethically in an experiment, and provides rich detail.
        (c) Results from one person may not generalize to others, and the method cannot establish cause and effect because nothing is controlled.
      explanation: |
        Three points, one per part. (a) case study. (b) a real strength: access to rare or unethical-to-create cases, depth of detail, or generating hypotheses. (c) a real limitation: poor generalizability, no control or causal conclusions, or possible researcher bias.
    - slug: appsych-u02-w09-q22
      type: long_answer
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skills 1.A, 2.A, 3.A"
      points: 5
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 40 adults. Twenty were randomly assigned to memorize a list of 12 words while also tapping a rhythm with their fingers; the other 20 memorized the same list while repeating the word "the" out loud over and over. Immediately afterward, the first group recalled a mean of 8.1 words (SD 1.5) and the second group a mean of 4.6 words (SD 1.8). The difference was statistically significant. All participants gave informed consent.
      prompt: |
        (A) Identify the independent and dependent variables.
        (B) Use the working memory model to explain why the second group recalled fewer words.
        (C) Explain what "statistically significant" means for this result.
        (D) Identify one ethical requirement, other than informed consent, that the researchers should follow, and explain it.
        (E) Explain how this study could be changed to a within-subjects design, and one advantage of doing so.
      answer: |
        (A) IV: the secondary task (finger tapping or repeating "the"). DV: the number of words recalled.
        (B) Repeating "the" occupies the phonological loop, the same component needed to rehearse the words, so the two tasks compete; tapping does not use the loop.
        (C) A difference this large would be unlikely to occur by chance alone if the secondary task had no real effect.
        (D) Debriefing, confidentiality, or the right to withdraw, with a correct explanation (for example, data must be kept private and unidentified).
        (E) Have every participant do both conditions with different word lists, in counterbalanced order; this controls individual differences in memory ability.
      explanation: |
        Five points. (A) 1 point: both variables correct. (B) 1 point: phonological loop interference with verbal rehearsal (a generic "they were distracted" earns nothing). (C) 1 point: unlikely by chance. (D) 1 point: a different guideline correctly explained. (E) 1 point: each participant does both conditions, plus an advantage (controls individual differences, needs fewer participants).
