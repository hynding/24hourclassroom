week: 12
unit: 2
title: Forgetting and Memory Errors
topics: ["2.7"]
guide: guides/week-12.md
guide_description: |
  Why memories fail and change: Ebbinghaus's forgetting curve, forgetting as encoding failure, storage decay or
  retrieval failure (with the tip-of-the-tongue phenomenon), proactive and retroactive interference, motivated
  forgetting and the debate over repression, and memory as reconstruction: the misinformation effect, false
  memories, source amnesia, imagination inflation and flashbulb memories, with their consequences for
  eyewitness testimony. Worked examples: naming three kinds of interference and retrieval failure, how leading
  questions can reshape a robbery witness's memory, and a hypothetical three-group misinformation experiment
  with a neutral control and the ethics of its deception.
flashcards_description: |
  30 cards on the forgetting curve, encoding failure, decay and retrieval failure, proactive and retroactive
  interference, motivated forgetting and repression, reconstructive memory, the misinformation effect, false
  memories, source amnesia, imagination inflation, flashbulb memories, eyewitness interviewing, and the design
  of memory-distortion studies.

flashcards:
  - front: "Forgetting curve (Ebbinghaus) → shape"
    back: |
      Rapid forgetting soon after learning, then a leveling off: what survives the first few days tends to last.
    topic_code: "2.7"
  - front: "Forgetting curve → study lesson"
    back: |
      Review soon after learning and then at spaced intervals, to catch material before the steep early drop.
    topic_code: "2.7"
  - front: "Encoding failure → definition"
    back: |
      Information never entered long-term memory, usually because it was not attended to.
    topic_code: "2.7"
  - front: "Encoding failure → classic example"
    back: |
      Most people cannot accurately draw a coin they have handled thousands of times, because they never attended to its details.
    topic_code: "2.7"
  - front: "Storage decay → definition"
    back: |
      The gradual fading of a stored memory over time, especially if it is unused or poorly consolidated.
    topic_code: "2.7"
  - front: "Retrieval failure → definition"
    back: |
      A memory is stored but cannot be accessed, often because the right retrieval cue is missing.
    topic_code: "2.7"
  - front: "Tip-of-the-tongue phenomenon → definition"
    back: |
      Feeling sure you know a word or name, perhaps even its first letter, but being unable to retrieve it; a cue often brings it back.
    topic_code: "2.7"
  - front: "Proactive interference → definition and example"
    back: |
      Old learning disrupts recall of new information: entering last year's locker combination on this year's lock.
    topic_code: "2.7"
  - front: "Retroactive interference → definition and example"
    back: |
      New learning disrupts recall of old information: after learning a new phone number, you cannot recall your old one.
    topic_code: "2.7"
  - front: "Proactive versus retroactive → memory trick"
    back: |
      Name the direction of the damage. Pro = forward: old harms new. Retro = backward: new harms old.
    topic_code: "2.7"
  - front: "Sleep and interference → link"
    back: |
      Learning before sleep leaves fewer competing experiences before consolidation, so there is less interference.
    topic_code: "2.7"
  - front: "Motivated forgetting → definition"
    back: |
      Forgetting, or revising a memory, in a way that serves a purpose, such as protecting self-image.
    topic_code: "2.7"
  - front: "Repression as a cause of forgetting → definition"
    back: |
      In Freud's theory, a defense in which anxiety-provoking memories are pushed out of conscious awareness.
    topic_code: "2.7"
  - front: "Repression → why it is controversial"
    back: |
      Traumatic memories are often intrusive rather than lost, and suggestive attempts to "recover" repressed memories can create false memories.
    topic_code: "2.7"
  - front: "Reconstructive memory → definition"
    back: |
      Each retrieval rebuilds a memory from stored fragments plus general knowledge, expectations and later information, so memories can change.
    topic_code: "2.7"
  - front: "Misinformation effect → definition"
    back: |
      Misleading information presented after an event is incorporated into the memory of it.
    topic_code: "2.7"
  - front: "Loftus and Palmer (1974) car-crash study → finding"
    back: |
      People asked how fast cars "smashed into" each other gave higher speed estimates than those asked about cars that "hit", and later were more likely to report broken glass that was never shown.
    topic_code: "2.7"
  - front: "Lost-in-the-mall research (Loftus and colleagues) → finding"
    back: |
      After repeated suggestion that they had been lost in a mall as children, some participants came to recall the invented event, sometimes in detail.
    topic_code: "2.7"
  - front: "False memory → definition"
    back: |
      A recollection of an event that did not happen, or a distorted version of one that did, often held with confidence.
    topic_code: "2.7"
  - front: "Source amnesia → definition"
    back: |
      Remembering information but forgetting or misattributing its source, such as believing you read something that a friend told you.
    topic_code: "2.7"
  - front: "Imagination inflation → definition"
    back: |
      Repeatedly imagining an event makes it feel familiar, which increases confidence that it really happened.
    topic_code: "2.7"
  - front: "Flashbulb memory → definition"
    back: |
      A vivid, detailed memory of a surprising, emotional event, such as where you heard major news.
    topic_code: "2.7"
  - front: "Flashbulb memories → accuracy"
    back: |
      They feel certain, but accounts often change substantially over the years while confidence stays high: vividness is not accuracy.
    topic_code: "2.7"
  - front: "Leading question → definition"
    back: |
      A question that suggests its own answer or assumes a detail ("Did you see the gun?"), which can plant misinformation.
    topic_code: "2.7"
  - front: "Eyewitness interviewing → good practices"
    back: |
      Open-ended, non-leading questions, interviewing witnesses separately, and recording confidence at the first identification.
    topic_code: "2.7"
  - front: "Eyewitness confidence → relationship to accuracy"
    back: |
      Confidence can grow with repetition and suggestion, so a confident witness is not necessarily an accurate one.
    topic_code: "2.7"
  - front: "Misinformation experiment → role of a neutral control group"
    back: |
      It shows memory with no post-event information, a baseline that reveals whether misleading information made memory worse.
    topic_code: "2.7"
  - front: "Misinformation experiment → ethical requirements"
    back: |
      IRB review of the mild deception, informed consent, and debriefing that reveals the misleading detail and allows data withdrawal.
    topic_code: "2.7"
  - front: "Coin-drawing failure → error-spot"
    back: |
      "People forgot what a penny looks like" is wrong: the details were never encoded, so it is encoding failure, not forgetting.
    topic_code: "2.7"
  - front: "Forgetting as a feature → why forgetting can be useful"
    back: |
      Forgetting outdated or irrelevant details (last year's schedule) reduces interference and keeps memory efficient.
    topic_code: "2.7"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 2.7: the forgetting curve, encoding failure,
    decay and retrieval failure, interference, repression, and reconstructive memory with the misinformation
    effect, source amnesia and false memories), with 6 questions (27%) reviewing earlier weeks (perception,
    thinking, encoding and retrieval in 2.1–2.6, and sleep and research methods from Unit 1). Opens with a
    shared-context set on one hypothetical misinformation experiment. Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical misinformation experiment (2.7)
    - slug: appsych-u02-w12-q01
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team showed 120 volunteers a two-minute video of a shoplifting incident in which the shoplifter wore no hat. Volunteers were randomly assigned to answer one of two questionnaires right after the video. Version 1 included the question "Did the shoplifter with the red hat look nervous?" Version 2 asked "Did the shoplifter look nervous?" One week later, everyone was asked, "Was the shoplifter wearing a hat?"

        | Questionnaire | n | Said "yes, a hat" | Said "no hat" |
        |---|---|---|---|
        | Version 1 (mentions a red hat) | 60 | 21 | 39 |
        | Version 2 (no mention) | 60 | 4 | 56 |

        Volunteers were told at the end that the hat question had been misleading and why.
      prompt: |
        Which concept do the results best illustrate?
      options:
        - "Proactive interference"
        - "Encoding failure"
        - "Infantile amnesia"
        - "The misinformation effect"
      option_explanations:
        - |
          Proactive interference is old learning disrupting new learning; here, information given after the event distorted memory of the event.
        - |
          Encoding failure means details were never stored; the problem here is that a false detail was added afterward.
        - |
          Infantile amnesia concerns memories from early childhood, which this study of adult volunteers does not address.
        - |
          Correct. A misleading detail in the questionnaire led far more volunteers to remember a hat that was never there.
      answer: 3
    - slug: appsych-u02-w12-q02
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team showed 120 volunteers a two-minute video of a shoplifting incident in which the shoplifter wore no hat. Volunteers were randomly assigned to answer one of two questionnaires right after the video. Version 1 included the question "Did the shoplifter with the red hat look nervous?" Version 2 asked "Did the shoplifter look nervous?" One week later, everyone was asked, "Was the shoplifter wearing a hat?"

        | Questionnaire | n | Said "yes, a hat" | Said "no hat" |
        |---|---|---|---|
        | Version 1 (mentions a red hat) | 60 | 21 | 39 |
        | Version 2 (no mention) | 60 | 4 | 56 |

        Volunteers were told at the end that the hat question had been misleading and why.
      prompt: |
        What percentage of volunteers who received Version 1 falsely reported a hat?
      options:
        - "35%"
        - "21%"
        - "7%"
        - "65%"
      option_explanations:
        - |
          Correct. 21 of 60 volunteers is 21 ÷ 60 = 0.35, or 35%.
        - |
          21 is the count, not the percentage; the percentage divides by the 60 volunteers in the group.
        - |
          About 7% (4 of 60) is the false-report rate in the Version 2 group, not in Version 1.
        - |
          65% (39 of 60) is the share of Version 1 volunteers who correctly said there was no hat.
      answer: 0
    - slug: appsych-u02-w12-q03
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 2.C"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team showed 120 volunteers a two-minute video of a shoplifting incident in which the shoplifter wore no hat. Volunteers were randomly assigned to answer one of two questionnaires right after the video. Version 1 included the question "Did the shoplifter with the red hat look nervous?" Version 2 asked "Did the shoplifter look nervous?" One week later, everyone was asked, "Was the shoplifter wearing a hat?"

        | Questionnaire | n | Said "yes, a hat" | Said "no hat" |
        |---|---|---|---|
        | Version 1 (mentions a red hat) | 60 | 21 | 39 |
        | Version 2 (no mention) | 60 | 4 | 56 |

        Volunteers were told at the end that the hat question had been misleading and why.
      prompt: |
        Telling volunteers at the end that the hat question had been misleading is an example of
      options:
        - "informed consent"
        - "confidentiality"
        - "debriefing after deception"
        - "random assignment"
      option_explanations:
        - |
          Informed consent comes before participation and describes what the study involves; this explanation came at the end.
        - |
          Confidentiality protects participants' identities and data; it does not involve explaining the deception.
        - |
          Correct. Revealing the deception and the study's purpose after participation is debriefing, required when deception is used.
        - |
          Random assignment placed volunteers into the two versions at the start; it is not something done at the end.
      answer: 2
    - slug: appsych-u02-w12-q04
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 4.B"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team showed 120 volunteers a two-minute video of a shoplifting incident in which the shoplifter wore no hat. Volunteers were randomly assigned to answer one of two questionnaires right after the video. Version 1 included the question "Did the shoplifter with the red hat look nervous?" Version 2 asked "Did the shoplifter look nervous?" One week later, everyone was asked, "Was the shoplifter wearing a hat?"

        | Questionnaire | n | Said "yes, a hat" | Said "no hat" |
        |---|---|---|---|
        | Version 1 (mentions a red hat) | 60 | 21 | 39 |
        | Version 2 (no mention) | 60 | 4 | 56 |

        Volunteers were told at the end that the hat question had been misleading and why.
      prompt: |
        Which recommendation for police interviews is best supported by these results?
      options:
        - "Interview witnesses only after several weeks have passed."
        - "Ask open-ended questions that do not assume details the witness has not mentioned."
        - "Ask witnesses to imagine the crime repeatedly before testifying."
        - "Rely most on the witnesses who are most confident."
      option_explanations:
        - |
          Waiting longer lets memory fade and gives more chances for misinformation; the study does not support delaying interviews.
        - |
          Correct. The question that assumed a hat planted a false detail, so interviews should avoid questions that presuppose details.
        - |
          Repeated imagining causes imagination inflation, increasing confidence in possibly false details.
        - |
          Confidence can be high for false memories, so it is not a reliable guide to accuracy.
      answer: 1
    # ---- Independent items on 2.7
    - slug: appsych-u02-w12-q05
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 1
      prompt: |
        After switching from playing clarinet to saxophone, Ben keeps using clarinet fingerings on the new instrument. This is an example of
      options:
        - "proactive interference"
        - "retroactive interference"
        - "source amnesia"
        - "storage decay"
      option_explanations:
        - |
          Correct. Older learning (clarinet fingerings) is disrupting the performance of newer learning (saxophone): proactive interference.
        - |
          Retroactive interference would be the new saxophone learning making the old clarinet fingerings harder to recall.
        - |
          Source amnesia is misremembering where information came from, not old learning disrupting new.
        - |
          Storage decay is fading of an unused memory; Ben's old memories are intact and intruding.
      answer: 0
    - slug: appsych-u02-w12-q06
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 1
      prompt: |
        Sofia is certain she read about a new study on social media, but she actually heard about it from her teacher. Sofia is experiencing
      options:
        - "retroactive interference"
        - "the tip-of-the-tongue phenomenon"
        - "repression"
        - "source amnesia"
      option_explanations:
        - |
          Retroactive interference is new learning disrupting old memories; Sofia remembers the content but not its origin.
        - |
          The tip-of-the-tongue phenomenon is failing to retrieve a known word; Sofia retrieves the information but misplaces its source.
        - |
          Repression is pushing anxiety-provoking memories from awareness; this neutral memory was not pushed away.
        - |
          Correct. Remembering information but attributing it to the wrong source is source amnesia (source misattribution).
      answer: 3
    - slug: appsych-u02-w12-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 1
      prompt: |
        Which statement best describes the forgetting curve that Ebbinghaus found?
      options:
        - "Forgetting happens at a steady rate for months."
        - "Most forgetting happens soon after learning, and then the rate of forgetting slows."
        - "Little is forgotten at first, but forgetting speeds up over time."
        - "Nothing is forgotten if the material is learned once."
      option_explanations:
        - |
          The curve is not a straight line; loss is fastest at the start.
        - |
          Correct. Retention drops steeply soon after learning and then levels off; what survives the first days tends to last.
        - |
          This reverses the curve: forgetting is fastest at first, not later.
        - |
          Ebbinghaus forgot much of each list within days, so this contradicts his findings.
      answer: 1
    - slug: appsych-u02-w12-q08
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 1
      prompt: |
        Asked to pick the correct drawing of a familiar app icon from several close versions, most students choose wrongly, though they see it every day. The best explanation is
      options:
        - "retroactive interference from newer apps"
        - "repression of the memory"
        - "encoding failure, because they never attended to the icon's details"
        - "imagination inflation"
      option_explanations:
        - |
          Interference would require learning a similar competing icon; the more likely problem is that the details were never stored.
        - |
          Repression concerns anxiety-provoking memories, and an app icon carries no such emotion.
        - |
          Correct. Frequent exposure without attention to details means the details were never encoded, so there is nothing to retrieve.
        - |
          Imagination inflation is greater confidence in imagined events; the students were not imagining the icon.
      answer: 2
    - slug: appsych-u02-w12-q09
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 1
      prompt: |
        Ten years after a major news event, Luca describes vividly and confidently where he was when he heard about it, but his account differs in several details from what he wrote in a journal that day. This best illustrates
      options:
        - "that flashbulb memories can feel certain yet be inaccurate"
        - "anterograde amnesia"
        - "encoding failure of the news event"
        - "the testing effect"
      option_explanations:
        - |
          Correct. Vivid, emotional flashbulb memories are reconstructed over time like other memories, so details change while confidence stays high.
        - |
          Anterograde amnesia prevents new memories from forming; Luca formed and kept a memory, but it changed.
        - |
          He encoded the event, as his journal shows; the problem is distortion over time, not failure to encode.
        - |
          The testing effect is better retention from retrieval practice, which does not explain a confident but inaccurate memory.
      answer: 0
    - slug: appsych-u02-w12-q10
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 1
      prompt: |
        Why do many memory researchers question claims that traumatic memories are commonly repressed and later recovered?
      options:
        - "Traumatic events are never remembered."
        - "Repression has been proven by brain imaging."
        - "Recovered memories are always accurate."
        - "Traumatic memories are often intrusive rather than forgotten, and suggestive techniques can create false memories."
      option_explanations:
        - |
          Traumatic events are often remembered all too well, which is part of the argument against widespread repression.
        - |
          Brain imaging has not established repression; the concept remains contested.
        - |
          Research on false memories shows that some "recovered" memories can be created by suggestion, so they are not always accurate.
        - |
          Correct. Extreme stress often makes memories more intrusive, and research shows suggestion can produce detailed false memories.
      answer: 3
    # ---- Spiral review: 2.1, 2.2, 2.4, 2.6 and Unit 1
    - slug: appsych-u02-w12-q11
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Unable to remember a classmate's name, Tyrese recalls it immediately when someone mentions the club they were both in. The club served as
      options:
        - "a mnemonic device created during encoding"
        - "a source of proactive interference"
        - "a retrieval cue"
        - "an example of the self-reference effect"
      option_explanations:
        - |
          Tyrese did not create a memory aid when he learned the name; the mention of the club simply helped him retrieve it.
        - |
          Proactive interference is old learning disrupting new; the club mention helped rather than hindered recall.
        - |
          Correct. A stimulus associated with the memory brought it back, which is what a retrieval cue does.
        - |
          The self-reference effect concerns encoding information in relation to oneself, not a cue that triggers recall later.
      answer: 2
    - slug: appsych-u02-w12-q12
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A juror is convinced by an eyewitness because the witness seems very confident. A psychologist warns that confidence is not a reliable sign of accuracy. Which bias might keep the juror focused only on evidence that supports the witness?
      options:
        - "Functional fixedness"
        - "Confirmation bias"
        - "Divergent thinking"
        - "The sunk-cost fallacy"
      option_explanations:
        - |
          Functional fixedness concerns seeing objects only in their usual use, not evaluating evidence.
        - |
          Correct. Once convinced, the juror may seek and weigh evidence that supports the belief while dismissing evidence against it.
        - |
          Divergent thinking is generating many possible ideas, which would help the juror consider alternatives rather than bias them.
        - |
          The sunk-cost fallacy concerns persisting because of past investment, not selectively weighing evidence.
      answer: 1
    - slug: appsych-u02-w12-q13
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.A (spiral review)"
      points: 1
      prompt: |
        In a memory experiment, a research assistant who knows the hypothesis interviews participants and may unintentionally phrase questions differently for each group. Which procedure best prevents this problem?
      options:
        - "A double-blind procedure, in which neither the interviewer nor the participants know which condition each participant is in"
        - "A larger sample"
        - "Using a case study instead"
        - "Replacing random assignment with self-selection"
      option_explanations:
        - |
          Correct. Keeping the interviewer unaware of conditions prevents experimenter bias from shaping how questions are asked or scored.
        - |
          A larger sample reduces chance variation but does not remove a bias that affects every interview in one group.
        - |
          A case study cannot compare conditions and does not address bias by the person collecting data.
        - |
          Self-selection would add confounds; it does nothing to prevent the interviewer's expectations from influencing results.
      answer: 0
    - slug: appsych-u02-w12-q14
      type: multi_select
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following can lead people to remember events that did not happen, or to distort real ones? Select all that apply.
      options:
        - "Leading questions asked after the event"
        - "Repeatedly imagining an event"
        - "Spaced retrieval practice of accurate material"
        - "Misattributing the source of information"
        - "Chunking a phone number"
      option_explanations:
        - |
          Correct. Leading questions can plant misinformation that becomes part of the memory.
        - |
          Correct. Imagination inflation increases confidence that imagined events really happened.
        - |
          Spaced retrieval of accurate material strengthens correct memories; it is not a source of distortion.
        - |
          Correct. Source amnesia can lead people to believe they experienced something they only heard or read about.
        - |
          Chunking is an encoding strategy that improves memory and does not create false memories.
      answer: [0, 1, 3]
    - slug: appsych-u02-w12-q15
      type: multi_select
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which situations are examples of retrieval failure rather than encoding failure? Select all that apply.
      options:
        - "Not being able to recall an actor's name until a friend gives its first letter"
        - "Being unable to describe a building's front door because you never looked at it"
        - "Remembering your old address only after driving down your old street"
        - "Not remembering a lecture you slept through"
        - "Recognizing a word on a multiple-choice test that you could not recall on a fill-in test"
      option_explanations:
        - |
          Correct. The name was stored, since a cue brings it back; the problem was getting it out.
        - |
          Never attending to the door means the details were never encoded, so this is encoding failure.
        - |
          Correct. The address was stored, and the context cue of the street made it retrievable.
        - |
          Information presented while you were asleep was never encoded, so this is encoding failure.
        - |
          Correct. Recognition succeeding where recall failed shows the word was stored but hard to retrieve without cues.
      answer: [0, 2, 4]
    - slug: appsych-u02-w12-q16
      type: true_false
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 1
      prompt: |
        True or false: Retroactive interference occurs when older memories make it harder to learn or recall new information.
      answer: false
      explanation: |
        False. That describes proactive interference. Retroactive interference is the reverse: new learning makes older memories harder to recall.
    - slug: appsych-u02-w12-q17
      type: true_false
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: Sleeping after learning can reduce forgetting, partly because fewer new experiences interfere with the material before it is consolidated.
      answer: true
      explanation: |
        True. Sleep supports memory consolidation, and the hours asleep contain little new learning to cause retroactive interference.
    - slug: appsych-u02-w12-q18
      type: fill_blank
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 1
      prompt: |
        When misleading information presented after an event distorts the memory of that event, it is called the ____ effect.
      answer: ["misinformation", "mis-information"]
      explanation: |
        The misinformation effect shows memory is reconstructive: later information can be woven into the memory of the original event.
    - slug: appsych-u02-w12-q19
      type: fill_blank
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        The finding that study spread over several sessions produces better long-term retention than the same study crammed into one session is called the ____ effect.
      answer: ["spacing", "spacing (distributed practice)"]
      explanation: |
        The spacing effect: distributed practice beats massed practice for long-term retention, even when total study time is equal. It also counters the steep early drop of the forgetting curve.
    - slug: appsych-u02-w12-q20
      type: short_answer
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A"
      points: 3
      prompt: |
        Ines learned Italian in middle school and Spanish in high school.

        (a) Give an example of proactive interference she might experience.
        (b) Give an example of retroactive interference she might experience.
        (c) Explain how the tip-of-the-tongue phenomenon shows that some "forgotten" Italian words are still stored.
      answer: |
        (a) When speaking Spanish, Italian words she learned first intrude (old learning disrupts new).
        (b) When she tries to speak Italian now, Spanish words come out instead, and she struggles to recall the Italian (new learning disrupts old).
        (c) She may feel sure she knows an Italian word, even its first letter, and retrieve it once given a cue, so it was stored but temporarily inaccessible.
      explanation: |
        Three points, one per part. (a) old (Italian) harming new (Spanish). (b) new (Spanish) harming old (Italian). (c) the feeling of knowing, partial information or recovery with a cue shows storage with retrieval failure. Reversed directions in (a) and (b) earn nothing for those parts.
