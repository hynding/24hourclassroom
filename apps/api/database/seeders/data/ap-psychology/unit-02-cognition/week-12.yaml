      type: short_answer
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A (spiral review)"
      points: 3
      prompt: |
        Memory and perception both rely on top-down processing.

        (a) Define top-down processing.
        (b) Give an example of top-down processing in perception.
        (c) Explain how top-down processing helps explain reconstructive memory.
      answer: |
        (a) Processing guided by knowledge, expectations and schemas rather than built purely from sensory features.
        (b) Reading a smudged word correctly because the sentence tells you what it must be (or seeing a monster in a log after being told one is there).
        (c) When recalling, people fill gaps with schemas and expectations, so memories shift toward what "should" have happened.
      explanation: |
        Three points, one per part. (a) knowledge or expectation guiding processing. (b) a perceptual example clearly driven by expectation or context. (c) schemas or expectations filling gaps at retrieval, distorting memory.
    - slug: appsych-u02-w12-q22
      type: long_answer
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skills 2.A, 2.C, 3.A, 4.B"
      points: 6
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 80 college students through a psychology course. Each read four short stories said to be about their own childhood, supplied by a parent; three were true and one, about knocking over a tower of cans in a grocery store, was invented. Half the students were randomly assigned to imagine the invented event in detail for five minutes each day for a week; the other half did a word puzzle for the same time. At the end, 18 of 40 (45%) in the imagine group and 7 of 40 (17.5%) in the puzzle group said they remembered the grocery-store event. The difference was statistically significant. Parents and students consented, and students were debriefed about the invented story at the end.
      prompt: |
        (A) Identify the research method and explain how you know.
        (B) State the operational definition of a false memory in this study.
        (C) Explain the difference between the groups using a psychological concept.
        (D) Explain why debriefing was especially important in this study.
        (E) Explain one reason these results might not generalize to the general population.
        (F) Explain how the findings bear on the use of repeated imagining in therapy or police interviews.
      answer: |
        (A) An experiment: imagining versus a puzzle was manipulated, with random assignment.
        (B) Saying they remembered the invented grocery-store event at the end of the week.
        (C) Imagination inflation: repeatedly imagining the event made it feel familiar, and familiarity was mistaken for memory (45% against 17.5%).
        (D) Participants were deceived about their own past, and a false memory could persist; debriefing reveals the deception and corrects the false belief.
        (E) The sample was college students in one psychology course, who may be more or less suggestible than other adults or children.
        (F) Techniques that ask people to imagine events repeatedly can create confident false memories, so they should be avoided when accurate recall matters.
      explanation: |
        Six points. (A) 1 point: experiment, with manipulation or random assignment. (B) 1 point: reporting memory of the invented event. (C) 1 point: imagination inflation (or the misinformation effect or source amnesia, if correctly applied). (D) 1 point: deception about one's own life and the risk of a lasting false memory. (E) 1 point: a specific sample limitation. (F) 1 point: a defensible application to therapy or interviewing grounded in the results.
