week: 13
unit: 2
title: Intelligence and Achievement
topics: ["2.8"]
guide: guides/week-13.md
guide_description: |
  What intelligence is and how it is measured: Spearman's general intelligence and factor analysis, fluid and
  crystallized intelligence, Gardner's multiple intelligences and their critics, Binet's mental age, Terman's
  ratio IQ and modern deviation scores, the misuse of testing in the eugenics movement, aptitude versus
  achievement tests, standardization and the normal curve (mean 100, SD 15) with percentile ranks, test-retest
  and split-half reliability, construct and predictive validity, intellectual disability and giftedness, and
  influences on scores: heritability, the Flynn effect, stereotype threat, cultural bias and mindset. Worked
  examples: reading scores of 85 and 145 on the normal curve, and a hypothetical district's validation study of
  a new reasoning test read through its reliability and validity correlations.
flashcards_description: |
  30 cards on theories of intelligence, the history of testing, aptitude and achievement tests,
  standardization, the normal curve and percentile ranks, reliability and validity, the extremes of
  intelligence, heritability, the Flynn effect, stereotype threat, cultural bias and mindset.

flashcards:
  - front: "Intelligence → working definition"
    back: |
      The ability to learn from experience, solve problems and use knowledge to adapt to new situations.
    topic_code: "2.8"
  - front: "General intelligence (g) → definition"
    back: |
      A general mental ability, proposed by Charles Spearman, that underlies performance on many different kinds of mental tasks.
    topic_code: "2.8"
  - front: "Spearman's evidence for g → what he found"
    back: |
      Scores on different mental tests are positively correlated: people who do well on one tend to do well on others.
    topic_code: "2.8"
  - front: "Factor analysis → definition"
    back: |
      A statistical method that identifies clusters of related items or test scores, used to find underlying abilities such as g.
    topic_code: "2.8"
  - front: "Fluid intelligence → definition and age trend"
    back: |
      Fast, flexible, abstract reasoning on new problems; it tends to decline gradually in later adulthood.
    topic_code: "2.8"
  - front: "Crystallized intelligence → definition and age trend"
    back: |
      Accumulated knowledge and verbal skills; it tends to hold steady or grow with age.
    topic_code: "2.8"
  - front: "Gardner's multiple intelligences → the claim"
    back: |
      There are several relatively independent intelligences: linguistic, logical-mathematical, musical, spatial, bodily-kinesthetic, interpersonal, intrapersonal and naturalist.
    topic_code: "2.8"
  - front: "Gardner's multiple intelligences → main criticisms"
    back: |
      Some "intelligences" look more like talents, measures of them still correlate with g, and the theory is hard to test.
    topic_code: "2.8"
  - front: "Savant syndrome → relevance to intelligence theories"
    back: |
      Extraordinary skill in one area alongside very limited abilities in others; Gardner used it as evidence for separate intelligences.
    topic_code: "2.8"
  - front: "Alfred Binet → contribution"
    back: |
      Built early tests in France to identify children needing extra help in school, using the idea of mental age.
    topic_code: "2.8"
  - front: "Mental age → definition"
    back: |
      The level of performance typical of a given chronological age. A child who performs like a typical 9-year-old has a mental age of 9.
    topic_code: "2.8"
  - front: "Ratio IQ (Terman) → formula and example"
    back: |
      IQ = mental age ÷ chronological age × 100. An 8-year-old with a mental age of 10 scores 125.
    topic_code: "2.8"
  - front: "Deviation IQ → why it replaced the ratio IQ"
    back: |
      The ratio fails for adults; modern tests, such as Wechsler's, compare a person's performance with others of the same age.
    topic_code: "2.8"
  - front: "Eugenics and intelligence testing → the misuse"
    back: |
      Early test scores, often from tests in a language or culture test-takers did not share, were used to justify immigration limits and forced sterilization.
    topic_code: "2.8"
  - front: "Aptitude test versus achievement test → difference"
    back: |
      An aptitude test predicts future performance; an achievement test measures what has already been learned (such as an AP exam).
    topic_code: "2.8"
  - front: "Standardization → definition"
    back: |
      Giving a test under uniform conditions to a large, representative norm group, so later scores can be compared with the group's.
    topic_code: "2.8"
  - front: "Intelligence scores on the normal curve → mean and SD"
    back: |
      Mean 100, standard deviation 15. About 68% score 85–115, about 95% score 70–130, about 99.7% score 55–145.
    topic_code: "2.8"
  - front: "Percentile rank → definition and example"
    back: |
      The percentage of the norm group scoring at or below a score. An intelligence score of 115 is about the 84th percentile.
    topic_code: "2.8"
  - front: "Reliability of a test → definition"
    back: |
      The consistency of a test's scores, often reported as a correlation coefficient.
    topic_code: "2.8"
  - front: "Test-retest versus split-half reliability → difference"
    back: |
      Test-retest: the same people score similarly on two occasions. Split-half: scores on two halves of the test (such as odd and even items) agree.
    topic_code: "2.8"
  - front: "Validity of a test → definition"
    back: |
      The extent to which a test measures or predicts what it claims to.
    topic_code: "2.8"
  - front: "Construct validity versus predictive validity → difference"
    back: |
      Construct: the test measures the concept it claims to. Predictive: scores predict the future behavior the test is meant to predict.
    topic_code: "2.8"
  - front: "Reliable but not valid → example"
    back: |
      A bathroom scale that always reads 5 pounds light is consistent (reliable) but wrong (not valid). A test cannot be valid without being reliable.
    topic_code: "2.8"
  - front: "Intellectual disability → criteria"
    back: |
      Significant limits in intellectual functioning (typically a score of about 70 or below) and in adaptive behavior, beginning in the developmental period.
    topic_code: "2.8"
  - front: "Down syndrome → cause"
    back: |
      An extra copy of chromosome 21; it is associated with intellectual disability of varying degree.
    topic_code: "2.8"
  - front: "Heritability of intelligence → what it means"
    back: |
      The share of variation in scores within a group that is due to genetic differences; it says nothing about an individual and does not mean scores cannot change.
    topic_code: "2.8"
  - front: "Flynn effect → definition and explanation"
    back: |
      Average intelligence test scores rose markedly across the twentieth century; the change is too fast for genes, so environment (nutrition, schooling) is the likely cause.
    topic_code: "2.8"
  - front: "Stereotype threat on tests → definition"
    back: |
      Worry about confirming a negative stereotype about one's group, which can lower performance on a test.
    topic_code: "2.8"
  - front: "Stereotype threat studies (Steele and Aronson) → finding"
    back: |
      Black college students did worse on a hard verbal test described as measuring intellectual ability than when the same test was not described that way.
    topic_code: "2.8"
  - front: "Growth mindset versus fixed mindset → difference"
    back: |
      Growth: ability can be developed with effort and good strategies. Fixed: ability is set. Carol Dweck's research links a growth mindset to persistence; brief school programs have modest effects.
    topic_code: "2.8"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 2.8: theories of intelligence, the history of
    testing, standardization and the normal curve, reliability and validity, and influences on scores), with 6
    questions (27%) reviewing earlier weeks (thinking, memory and forgetting in 2.2–2.7, and heredity, the brain
    and research methods from Unit 1). Opens with a shared-context set on one hypothetical test-validation study.
    Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical test-validation study (2.8)
    - slug: appsych-u02-w13-q01
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A test publisher developed a new 50-item problem-solving test and gave it to 500 eleventh graders in four states. Scores were converted so that the mean is 100 and the standard deviation is 15, and they were approximately normally distributed. The same students took the test again three weeks later, and their senior-year grade point averages were recorded the following year.

        | Comparison | Correlation |
        |---|---|
        | First testing with second testing | r = +0.91 |
        | First testing with senior-year GPA | r = +0.38 |
      prompt: |
        What does the correlation of +0.91 between the two testings indicate?
      options:
        - "The test has high predictive validity."
        - "The test is biased against some groups."
        - "The test has high test-retest reliability."
        - "The test measures crystallized intelligence."
      option_explanations:
        - |
          Predictive validity is shown by the correlation with a later outcome, such as GPA (+0.38), not by agreement between two testings.
        - |
          A test-retest correlation measures consistency; it says nothing about whether the test is fair to different groups.
        - |
          Correct. Students scored very consistently across the two testings, which is high test-retest reliability.
        - |
          Consistency of scores tells us nothing about which kind of intelligence the test measures; that is a question of construct validity.
      answer: 2
    - slug: appsych-u02-w13-q02
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A test publisher developed a new 50-item problem-solving test and gave it to 500 eleventh graders in four states. Scores were converted so that the mean is 100 and the standard deviation is 15, and they were approximately normally distributed. The same students took the test again three weeks later, and their senior-year grade point averages were recorded the following year.

        | Comparison | Correlation |
        |---|---|
        | First testing with second testing | r = +0.91 |
        | First testing with senior-year GPA | r = +0.38 |
      prompt: |
        Which statement best interprets the correlation of +0.38 with senior-year GPA?
      options:
        - "The test causes 38% of students to earn higher grades."
        - "The test has modest predictive validity: higher scores tend to go with higher GPAs, but many other factors also affect GPA."
        - "The test is unreliable, because the correlation is below +0.5."
        - "Students with higher scores always earned higher GPAs."
      option_explanations:
        - |
          A correlation cannot show causation, and r is not a percentage of students affected.
        - |
          Correct. A positive but moderate correlation with a later outcome shows some predictive validity; effort, attendance and courses also matter.
        - |
          Reliability is shown by the +0.91 test-retest correlation; the GPA correlation concerns validity, not consistency.
        - |
          With r = +0.38 the relationship is a tendency with many exceptions, not a rule that always holds.
      answer: 1
    - slug: appsych-u02-w13-q03
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A test publisher developed a new 50-item problem-solving test and gave it to 500 eleventh graders in four states. Scores were converted so that the mean is 100 and the standard deviation is 15, and they were approximately normally distributed. The same students took the test again three weeks later, and their senior-year grade point averages were recorded the following year.

        | Comparison | Correlation |
        |---|---|
        | First testing with second testing | r = +0.91 |
        | First testing with senior-year GPA | r = +0.38 |
      prompt: |
        A student scores 130 on the first testing. Approximately what is her percentile rank?
      options:
        - "50th"
        - "84th"
        - "68th"
        - "98th"
      option_explanations:
        - |
          The 50th percentile is the mean, 100; a score of 130 is well above it.
        - |
          The 84th percentile corresponds to one SD above the mean (115), not two.
        - |
          68% is the share within one SD of the mean, not the percentile rank of a score two SDs above it.
        - |
          Correct. 130 is two standard deviations above the mean; about 97.5% of a normal distribution lies below that point, roughly the 98th percentile.
      answer: 3
    - slug: appsych-u02-w13-q04
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 2.D"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A test publisher developed a new 50-item problem-solving test and gave it to 500 eleventh graders in four states. Scores were converted so that the mean is 100 and the standard deviation is 15, and they were approximately normally distributed. The same students took the test again three weeks later, and their senior-year grade point averages were recorded the following year.

        | Comparison | Correlation |
        |---|---|
        | First testing with second testing | r = +0.91 |
        | First testing with senior-year GPA | r = +0.38 |
      prompt: |
        A school in a fifth state wants to use these norms to place its own eleventh graders. What is the main concern?
      options:
        - "The norm group may not be representative of the school's students, so comparisons to it could mislead."
        - "The test has low test-retest reliability."
        - "The test cannot be scored."
        - "Norms are never needed for standardized tests."
      option_explanations:
        - |
          Correct. Standardization compares scores with a norm group; if that group differs from the school's students, the comparison may be inaccurate.
        - |
          The test-retest correlation of +0.91 shows high reliability, so that is not the concern.
        - |
          Nothing suggests scoring is a problem; scores were converted to a mean of 100 and SD of 15.
        - |
          Norms are the core of standardization: a score means something only in comparison with the norm group.
      answer: 0
    # ---- Independent items on 2.8
    - slug: appsych-u02-w13-q05
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 1.A"
      points: 1
      prompt: |
        A 9-year-old performs on a test like a typical 12-year-old. Using the original ratio formula, her IQ would be
      options:
        - "75"
        - "108"
        - "133"
        - "112"
      option_explanations:
        - |
          75 is chronological age divided by mental age (9 ÷ 12 × 100), the formula upside down.
        - |
          108 is simply 9 × 12, the two ages multiplied, which is not the IQ formula.
        - |
          Correct. IQ = mental age ÷ chronological age × 100 = 12 ÷ 9 × 100 ≈ 133.
        - |
          112 is 100 plus the 12-year mental age, which is not how the ratio IQ is calculated.
      answer: 2
    - slug: appsych-u02-w13-q06
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 1.A"
      points: 1
      prompt: |
        A retired engineer does crossword puzzles faster than ever but finds a new video game's puzzles harder to figure out than his grandchildren do. This pattern best fits
      options:
        - "Gardner's bodily-kinesthetic intelligence"
        - "the Flynn effect"
        - "stereotype threat"
        - "crystallized intelligence holding steady while fluid intelligence declines"
      option_explanations:
        - |
          Bodily-kinesthetic intelligence concerns skill with movement, not the difference between word knowledge and new reasoning.
        - |
          The Flynn effect is a rise in average scores across generations, not one person's pattern of strengths with age.
        - |
          Nothing in the scenario involves worry about confirming a stereotype.
        - |
          Correct. Word knowledge (crystallized) tends to be maintained with age, while speed on new problems (fluid) tends to decline.
      answer: 3
    - slug: appsych-u02-w13-q07
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 1.A"
      points: 1
      prompt: |
        Which is the best example of an achievement test?
      options:
        - "A test of abstract reasoning used to predict success in a pilot-training program"
        - "An end-of-course exam on U.S. history"
        - "A test of spatial ability used to select architecture students"
        - "A test of general reasoning given to kindergartners"
      option_explanations:
        - |
          A test used to predict success in future training is an aptitude test.
        - |
          Correct. An end-of-course exam measures what a student has already learned, which is an achievement test.
        - |
          A test used to select students based on likely future success is an aptitude test.
        - |
          A general reasoning test for young children is designed to estimate ability, not measure learning of specific content.
      answer: 1
    - slug: appsych-u02-w13-q08
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 1.A"
      points: 1
      prompt: |
        Before a math test, one group of women is told the test has shown gender differences in the past, and they score lower than a group told the test shows no gender differences. This result best illustrates
      options:
        - "stereotype threat"
        - "the Flynn effect"
        - "split-half reliability"
        - "crystallized intelligence"
      option_explanations:
        - |
          Correct. Reminding test-takers of a negative stereotype about their group can create worry that lowers performance.
        - |
          The Flynn effect is a rise in average scores across generations, not a drop caused by test instructions.
        - |
          Split-half reliability is consistency between two halves of a test; it does not explain a difference caused by instructions.
        - |
          Crystallized intelligence is accumulated knowledge; the women's knowledge did not change, only the framing of the test.
      answer: 0
    - slug: appsych-u02-w13-q09
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 1.A"
      points: 1
      prompt: |
        Which finding provides the strongest support for Spearman's idea of general intelligence?
      options:
        - "Some people have extraordinary musical talent but limited other abilities."
        - "Average intelligence scores have risen across generations."
        - "People who score well on vocabulary tests also tend to score well on spatial and math tests."
        - "Test scores can be lowered by stereotype threat."
      option_explanations:
        - |
          Exceptional ability in one area with limits in others is evidence Gardner used for separate intelligences, not for g.
        - |
          The Flynn effect concerns change in average scores over time and does not address whether abilities share a common factor.
        - |
          Correct. Positive correlations among scores on different kinds of mental tests are the evidence Spearman used for g.
        - |
          Stereotype threat shows that situations affect scores; it does not speak to whether one general ability underlies them.
      answer: 2
    - slug: appsych-u02-w13-q10
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 1.A"
      points: 1
      prompt: |
        A new intelligence test gives nearly identical scores when people take it twice, but scores do not predict school performance or job success at all. The test is
      options:
        - "reliable but not valid"
        - "valid but not reliable"
        - "both reliable and valid"
        - "neither reliable nor valid"
      option_explanations:
        - |
          Correct. Consistent scores show reliability, but failing to predict what it should shows a lack of validity.
        - |
          The test is consistent, so it is reliable; and a test cannot be valid without being reliable.
        - |
          It fails to predict the outcomes it should, so it lacks predictive validity.
        - |
          Nearly identical scores across testings show the test is reliable.
      answer: 0
    # ---- Spiral review: 2.2, 2.3, 2.7 and Unit 1
    - slug: appsych-u02-w13-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Identical twins raised in different homes have more similar intelligence scores than fraternal twins raised together. What does this finding most directly suggest?
      options:
        - "Environment has no effect on intelligence."
        - "Fraternal twins share no genes."
        - "Intelligence is entirely determined by the home environment."
        - "Genetic factors contribute substantially to differences in intelligence scores."
      option_explanations:
        - |
          Twin and adoption studies also show environmental effects, so the finding does not mean environment has no effect.
        - |
          Fraternal twins share about half their genes on average, like ordinary siblings.
        - |
          If the home environment were everything, twins raised together would be more alike than identical twins raised apart.
        - |
          Correct. Greater similarity between genetically identical people raised apart points to a substantial genetic contribution to variation in scores.
      answer: 3
    - slug: appsych-u02-w13-q12
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        After studying for a chemistry test on Monday night, Aisha studies biology on Tuesday and then finds the chemistry harder to recall on Wednesday. This is
      options:
        - "proactive interference"
        - "retroactive interference"
        - "encoding failure"
        - "infantile amnesia"
      option_explanations:
        - |
          Proactive interference would be the older chemistry learning disrupting the newer biology; here the newer learning harms the older.
        - |
          Correct. The new biology material interferes with recall of the earlier chemistry material, which is retroactive interference.
        - |
          She did encode the chemistry, since she studied it; her trouble comes from interference at recall.
        - |
          Infantile amnesia concerns memories from early childhood and has no connection to studying.
      answer: 1
    - slug: appsych-u02-w13-q13
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        On a creativity section of a test, students are asked to list as many uses for a brick as they can. Which kind of thinking does the section measure?
      options:
        - "Convergent thinking"
        - "Algorithmic thinking"
        - "Divergent thinking"
        - "Crystallized intelligence"
      option_explanations:
        - |
          Convergent thinking narrows possibilities to one correct answer, the opposite of listing many uses.
        - |
          An algorithm is a step-by-step procedure guaranteeing one solution; this task rewards producing many different ideas.
        - |
          Correct. Generating many possible answers to an open-ended problem is divergent thinking, a key part of creativity.
        - |
          Crystallized intelligence is accumulated knowledge; the task measures idea generation, not stored facts.
      answer: 2
    - slug: appsych-u02-w13-q14
      type: multi_select
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 3.A"
      points: 2
      partial_credit: true
      prompt: |
        Intelligence test scores are normally distributed with a mean of 100 and a standard deviation of 15. Which statements are correct? Select all that apply.
      options:
        - "About 68% of people score between 85 and 115."
        - "A score of 70 is two standard deviations below the mean."
        - "Half of all people score above 115."
        - "About 95% of people score between 70 and 130."
        - "A score of 115 is at about the 50th percentile."
      option_explanations:
        - |
          Correct. About 68% of a normal distribution lies within one standard deviation of the mean.
        - |
          Correct. 100 − 2 × 15 = 70, so 70 is two standard deviations below the mean.
        - |
          Half of people score above the mean, 100; only about 16% score above 115.
        - |
          Correct. About 95% of a normal distribution lies within two standard deviations of the mean.
        - |
          115 is one SD above the mean, at about the 84th percentile; the 50th percentile is 100.
      answer: [0, 1, 3]
    - slug: appsych-u02-w13-q15
      type: multi_select
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 4.A"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are evidence that environment influences intelligence test scores? Select all that apply.
      options:
        - "Average scores rose markedly across the twentieth century (the Flynn effect)."
        - "Children adopted from deprived into enriched homes tend to score higher than expected."
        - "Identical twins raised apart have similar scores."
        - "More years of schooling are associated with higher scores."
        - "Scores on different kinds of mental tests are positively correlated."
      option_explanations:
        - |
          Correct. The rise is too fast to be genetic, pointing to environmental causes such as nutrition and schooling.
        - |
          Correct. A change in environment raising scores shows environmental influence.
        - |
          Similarity between identical twins raised apart is evidence for genetic influence, not environmental.
        - |
          Correct. Schooling is associated with higher scores, consistent with environmental influence (though the association alone is correlational).
        - |
          Positive correlations among mental tests are evidence for general intelligence, not for environmental effects.
      answer: [0, 1, 3]
    - slug: appsych-u02-w13-q16
      type: true_false
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 1.A"
      points: 1
      prompt: |
        True or false: A person can be diagnosed with intellectual disability on the basis of an intelligence test score alone.
      answer: false
      explanation: |
        False. Diagnosis requires significant limitations in both intellectual functioning and adaptive behavior (everyday social and practical skills), beginning in the developmental period.
    - slug: appsych-u02-w13-q17
      type: true_false
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: Working memory capacity is limited, so holding many pieces of a problem in mind at once can make reasoning harder.
      answer: true
      explanation: |
        True. Working memory holds only a few chunks at a time; problems that overload it are harder, which is one reason working memory is related to performance on reasoning tests.
    - slug: appsych-u02-w13-q18
      type: fill_blank
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 1.A"
      points: 1
      prompt: |
        The rise in average intelligence test scores across generations is called the ____ effect.
      answer: ["flynn", "flynn's"]
      explanation: |
        The Flynn effect, named for James Flynn, is too fast to be genetic and is attributed to environmental changes such as nutrition and schooling.
    - slug: appsych-u02-w13-q19
      type: fill_blank
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Planning, reasoning and the executive functions drawn on by intelligence tests depend heavily on the prefrontal cortex, at the front of the ____ lobes.
      answer: ["frontal", "frontal lobe", "frontal lobes"]
      explanation: |
        The frontal lobes, especially the prefrontal cortex, support planning, judgment, working memory and abstract reasoning, abilities that many intelligence test items draw on.
    - slug: appsych-u02-w13-q20
      type: short_answer
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 1.A"
      points: 3
      prompt: |
        A school is deciding whether to use a new test to select students for an advanced math program.

        (a) Explain what the school should check to judge the test's reliability.
        (b) Explain what the school should check to judge the test's predictive validity.
        (c) Explain how stereotype threat could make the test less fair for some students.
      answer: |
        (a) Whether students get similar scores when they take the test twice (test-retest) or on two halves of the test (split-half), shown by a high positive correlation.
        (b) Whether scores correlate with later success in the advanced math program, such as grades in the program.
        (c) If a group is stereotyped as weaker in math, reminders of that stereotype could cause anxiety that lowers their scores below their true ability, so the test would underestimate them.
      explanation: |
        Three points, one per part. (a) consistency across testings or halves. (b) correlation with the later outcome the test is meant to predict. (c) worry about confirming a negative group stereotype lowering performance; "the test is biased" without the mechanism earns nothing.
    - slug: appsych-u02-w13-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.B (spiral review)"
      points: 3
      prompt: |
        A study finds a correlation of r = +0.30 between the number of books in a child's home and the child's vocabulary score.

        (a) Describe the direction and strength of this relationship.
        (b) Explain why the study cannot show that books cause better vocabulary.
        (c) Identify a possible third variable that could explain the relationship.
      answer: |
        (a) Positive and weak to moderate: children from homes with more books tend to have somewhat higher vocabulary scores.
        (b) It is correlational: no variable was manipulated and children were not randomly assigned, so the direction of cause is unknown and other variables may be responsible.
        (c) Parents' education or family income, which could affect both the number of books and children's vocabulary.
      explanation: |
        Three points, one per part. (a) positive and weak/moderate. (b) no manipulation or random assignment, so correlation does not show causation. (c) a plausible third variable linked to both.
    - slug: appsych-u02-w13-q22
      type: long_answer
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skills 2.A, 2.C, 3.A, 4.A, 4.B"
      points: 7
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 160 seventh graders from four middle schools. Students were randomly assigned to one of two eight-week after-school programs. The growth-mindset program taught that the brain strengthens with effort and good strategies; the study-skills program taught note-taking only. Before and after the programs, students completed the same 30-item set of challenging math problems. The growth-mindset group's mean score rose from 14.2 to 17.9; the study-skills group's rose from 14.0 to 15.1 (SDs were about 4 in all four cases). The difference in improvement was statistically significant. Parents gave written consent, students gave assent, and scores were reported to the researchers without names.
      prompt: |
        (A) Identify the research method used in this study.
        (B) State the operational definition of math performance.
        (C) Describe what the change in the means shows for each group.
        (D) Identify the ethical guideline shown by reporting scores without names.
        (E) Explain one limit on generalizing the findings.
        (F) Explain how the findings support or refute the claim that beliefs about intelligence can affect achievement, using a psychological concept. (2 points)
      answer: |
        (A) An experiment: the type of program was manipulated and students were randomly assigned.
        (B) The number of challenging math problems solved correctly out of 30.
        (C) The growth-mindset group improved by 3.7 problems on average; the study-skills group by 1.1. Both improved, but the growth-mindset group improved about 2.6 problems more (about two-thirds of an SD).
        (D) Confidentiality (anonymity).
        (E) The sample was seventh graders from four schools, and the outcome was a single math test after eight weeks; older students, other subjects or longer-term outcomes may differ.
        (F) The findings support the claim. Students taught a growth mindset, the belief that ability can be developed, improved more than students in a comparison program of equal length, suggesting that changing beliefs about intelligence led to greater persistence and achievement.
      explanation: |
        Seven points. (A) 1 point: experiment. (B) 1 point: problems solved out of 30. (C) 1 point: both groups' gains compared correctly. (D) 1 point: confidentiality or anonymity. (E) 1 point: a specific limit tied to the sample, setting or measure. (F) 2 points: 1 for stating that the findings support the claim with reference to the data; 1 for correctly using growth mindset (or a related concept such as self-efficacy) to explain why.
