week: 7
unit: 2
title: "Perception: Making Sense of Sensation"
topics: ["2.1"]
guide: guides/week-07.md
guide_description: |
  How the brain turns sensation into perception: bottom-up and top-down processing, schemas and perceptual set
  (context, expectation, emotion, culture), selective attention with the cocktail party effect, inattentional
  blindness and change blindness, the Gestalt principles of figure and ground, proximity, similarity and closure,
  binocular and monocular depth cues, perceptual constancies, and apparent movement. Worked examples: naming the
  processing behind a birdwatcher's identification, grouping on a school map, depth cues in a landscape photo, a
  hypothetical priming experiment on an ambiguous drawing, and an invented driving-simulator study read through
  its means and standard deviations.
flashcards_description: |
  30 cards on bottom-up and top-down processing, schemas and perceptual set, selective attention and its
  failures, Gestalt grouping, binocular and monocular depth cues, perceptual constancy, apparent movement, and
  the research design of perception experiments.

flashcards:
  - front: "Perception → definition"
    back: |
      Organizing and interpreting sensory information so that it has meaning. Sensation detects energy; perception makes sense of it.
    topic_code: "2.1"
  - front: "Bottom-up processing → definition and example"
    back: |
      Analysis that starts from sensory features and builds to a whole: edges and angles assembled into the letter "E".
    topic_code: "2.1"
  - front: "Top-down processing → definition and example"
    back: |
      Analysis guided by knowledge and expectation: reading a smudged word correctly because the sentence tells you what it must be.
    topic_code: "2.1"
  - front: "Schema (in perception) → role"
    back: |
      A mental framework of knowledge about a category. It tells the brain what to expect and so drives top-down processing.
    topic_code: "2.1"
  - front: "Perceptual set → definition"
    back: |
      A temporary readiness to perceive something one way, created by expectation, context, emotion or recent experience.
    topic_code: "2.1"
  - front: "Perceptual set → four influences"
    back: |
      Context, expectations, emotion and motivation, and culture or experience.
    topic_code: "2.1"
  - front: "Context effect in perception → example"
    back: |
      An ambiguous shape is read as the letter B between A and C, and as the number 13 between 12 and 14.
    topic_code: "2.1"
  - front: "Culture and perception → example"
    back: |
      People raised among right-angled buildings have, in some studies, been more prone to certain line-length illusions than people raised among rounded dwellings.
    topic_code: "2.1"
  - front: "Selective attention → definition"
    back: |
      Focusing conscious awareness on a small part of the available sensory input while the rest goes largely unprocessed.
    topic_code: "2.1"
  - front: "Cocktail party effect → what it shows"
    back: |
      You can follow one conversation in a noisy room yet still notice your own name spoken elsewhere: unattended input is monitored at some level.
    topic_code: "2.1"
  - front: "Inattentional blindness → definition"
    back: |
      Failing to notice a fully visible but unexpected object or event because attention is focused elsewhere.
    topic_code: "2.1"
  - front: "Gorilla video study (Simons and Chabris, 1999) → finding"
    back: |
      Many viewers counting basketball passes failed to notice a person in a gorilla suit walking through the scene: inattentional blindness.
    topic_code: "2.1"
  - front: "Change blindness → definition"
    back: |
      Failing to notice that something in a scene has changed between one view and the next, such as a conversation partner being swapped.
    topic_code: "2.1"
  - front: "Inattentional blindness versus change blindness → the difference"
    back: |
      Inattentional blindness: an unexpected object is never noticed. Change blindness: a change from one moment to the next is not noticed.
    topic_code: "2.1"
  - front: "Gestalt → meaning in psychology"
    back: |
      An organized whole. Gestalt psychologists argued that perception groups sensations into wholes that are more than the sum of their parts.
    topic_code: "2.1"
  - front: "Figure-ground → definition"
    back: |
      Organizing a scene into an object (figure) that stands out from its surroundings (ground). Reversible figures, like the vase-faces drawing, swap the two.
    topic_code: "2.1"
  - front: "Gestalt proximity → definition"
    back: |
      Items near one another are grouped together, as when six dots in three close pairs are seen as three groups.
    topic_code: "2.1"
  - front: "Gestalt similarity → definition"
    back: |
      Items that look alike (in color, shape or size) are grouped together, as when fans in the same jersey are seen as one crowd.
    topic_code: "2.1"
  - front: "Gestalt closure → definition"
    back: |
      Filling in gaps to perceive a complete, whole object, as when a circle with a small break is still seen as a circle.
    topic_code: "2.1"
  - front: "Visual cliff (Gibson and Walk, 1960) → finding"
    back: |
      Most crawling infants refused to cross a glass surface over an apparent drop, suggesting depth perception is present early in life.
    topic_code: "2.1"
  - front: "Retinal disparity → depth cue type and how it works"
    back: |
      Binocular. Each eye gets a slightly different image; the bigger the difference, the closer the object.
    topic_code: "2.1"
  - front: "Convergence → depth cue type and how it works"
    back: |
      Binocular. The eyes turn inward to fixate a near object; the brain reads the muscle strain as closeness.
    topic_code: "2.1"
  - front: "Relative size and interposition → depth cue type"
    back: |
      Both monocular. Relative size: the smaller image of two similar objects seems farther. Interposition: an object that blocks another seems closer.
    topic_code: "2.1"
  - front: "Relative clarity, texture gradient, linear perspective → depth cue type"
    back: |
      All monocular. Hazy objects seem far; finer, denser texture seems far; parallel lines that seem to converge signal distance.
    topic_code: "2.1"
  - front: "Size constancy → definition"
    back: |
      Perceiving an object as the same size even as its retinal image grows or shrinks with distance.
    topic_code: "2.1"
  - front: "Shape constancy → definition"
    back: |
      Perceiving an object as the same shape even as its retinal image changes, such as an opening door still seen as a rectangle.
    topic_code: "2.1"
  - front: "Color and lightness constancy → definition"
    back: |
      Perceiving a surface as the same color and brightness under different lighting, because the brain compares it with its surroundings.
    topic_code: "2.1"
  - front: "Apparent movement → two forms"
    back: |
      The phi phenomenon (lights flashed in sequence seem to move) and stroboscopic movement (rapid still frames seem to move, as in film).
    topic_code: "2.1"
  - front: "Perceptual set experiment → typical IV and DV"
    back: |
      IV: what participants see or are told first (the prime). DV: how they report an ambiguous stimulus, operationally defined, for example, as naming an animal.
    topic_code: "2.1"
  - front: "Sensation versus perception → error-spot"
    back: |
      "Recognizing your friend's voice is sensation" is wrong: detecting sound waves is sensation; recognizing whose voice it is, is perception.
    topic_code: "2.1"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 2.1: top-down and bottom-up processing,
    perceptual set, attention, Gestalt grouping, depth cues, constancy and apparent movement), with 7 questions
    (32%) reviewing Unit 1 (research methods, the neuron, the brain and sensation). Opens with a shared-context set
    on one hypothetical priming experiment. Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical priming experiment (2.1)
    - slug: appsych-u02-w07-q01
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 2.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 80 high school volunteers to two groups of 40. Group 1 looked at six photographs of birds; group 2 looked at six photographs of rabbits. Everyone then saw the same ambiguous line drawing for five seconds and wrote down what it showed. The drawing could be read as either a bird or a rabbit.

        | Group | Reported a bird | Reported a rabbit |
        |---|---|---|
        | Saw birds first | 29 | 11 |
        | Saw rabbits first | 12 | 28 |

        A significance test found the difference between groups statistically significant (p = .001). Participants signed consent forms and were told the purpose of the study at the end.
      prompt: |
        What is the independent variable in this study?
      options:
        - "What participants reported the drawing showed"
        - "The five seconds the drawing was shown"
        - "The type of photographs participants saw first"
        - "Whether participants were high school students"
      option_explanations:
        - |
          The report of a bird or rabbit is what the researchers measured, so it is the dependent variable, not the independent one.
        - |
          The viewing time was the same for everyone, so it is a controlled variable held constant, not the variable that was manipulated.
        - |
          Correct. The researchers manipulated which photographs each group saw first (birds or rabbits) and assigned people to those conditions at random.
        - |
          Every participant was a high school student; a feature shared by the whole sample cannot be the variable that differs between groups.
      answer: 2
    - slug: appsych-u02-w07-q02
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 80 high school volunteers to two groups of 40. Group 1 looked at six photographs of birds; group 2 looked at six photographs of rabbits. Everyone then saw the same ambiguous line drawing for five seconds and wrote down what it showed. The drawing could be read as either a bird or a rabbit.

        | Group | Reported a bird | Reported a rabbit |
        |---|---|---|
        | Saw birds first | 29 | 11 |
        | Saw rabbits first | 12 | 28 |

        A significance test found the difference between groups statistically significant (p = .001). Participants signed consent forms and were told the purpose of the study at the end.
      prompt: |
        Which concept best explains the pattern of results?
      options:
        - "Perceptual set created by the photographs seen first"
        - "Change blindness caused by the five-second display"
        - "Retinal disparity between the two eyes' images of the drawing"
        - "Sensory adaptation to the photographs"
      option_explanations:
        - |
          Correct. Seeing birds or rabbits first created an expectation that guided how the ambiguous drawing was interpreted, a top-down perceptual set.
        - |
          Change blindness is missing a change between views; nothing in the drawing changed, and the question is how it was interpreted.
        - |
          Retinal disparity is a binocular depth cue; it says how far away something is, not what a flat drawing represents.
        - |
          Sensory adaptation reduces sensitivity to an unchanging stimulus; it would not push people toward reporting the animal they had just seen.
      answer: 0
    - slug: appsych-u02-w07-q03
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 80 high school volunteers to two groups of 40. Group 1 looked at six photographs of birds; group 2 looked at six photographs of rabbits. Everyone then saw the same ambiguous line drawing for five seconds and wrote down what it showed. The drawing could be read as either a bird or a rabbit.

        | Group | Reported a bird | Reported a rabbit |
        |---|---|---|
        | Saw birds first | 29 | 11 |
        | Saw rabbits first | 12 | 28 |

        A significance test found the difference between groups statistically significant (p = .001). Participants signed consent forms and were told the purpose of the study at the end.
      prompt: |
        Which statement correctly interprets the statistical result?
      options:
        - "There is a 0.1% chance that the priming photographs caused the difference."
        - "The effect of priming is very large because p is small."
        - "Priming affects 99.9% of all people."
        - "A difference this large would be very unlikely if the photographs had no effect, so chance alone is an unlikely explanation."
      option_explanations:
        - |
          A p-value is not the probability that the hypothesis is true or false; it is the probability of results at least this extreme if there were no real effect.
        - |
          Statistical significance and effect size are different: a tiny p can come from a small effect in a big sample. Effect size must be judged separately.
        - |
          A p-value says nothing about the percentage of people affected, and this sample of 80 students cannot speak for all people.
        - |
          Correct. p = .001 means results this extreme would occur about 1 time in 1,000 if priming did nothing, so the difference is statistically significant.
      answer: 3
    - slug: appsych-u02-w07-q04
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 2.C"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 80 high school volunteers to two groups of 40. Group 1 looked at six photographs of birds; group 2 looked at six photographs of rabbits. Everyone then saw the same ambiguous line drawing for five seconds and wrote down what it showed. The drawing could be read as either a bird or a rabbit.

        | Group | Reported a bird | Reported a rabbit |
        |---|---|---|
        | Saw birds first | 29 | 11 |
        | Saw rabbits first | 12 | 28 |

        A significance test found the difference between groups statistically significant (p = .001). Participants signed consent forms and were told the purpose of the study at the end.
      prompt: |
        Telling participants the purpose of the study at the end is an example of which ethical practice?
      options:
        - "Informed consent"
        - "Debriefing"
        - "Confidentiality"
        - "Random sampling"
      option_explanations:
        - |
          Informed consent is agreeing to take part after learning what participation involves; it happens before the study, through the signed forms.
        - |
          Correct. Debriefing means explaining the study's true purpose, and any deception, after participation ends.
        - |
          Confidentiality means keeping participants' identities and data private; the stimulus describes explaining the study, not protecting data.
        - |
          Random sampling is a way of choosing participants from a population, not an ethical step taken after the study.
      answer: 1
    # ---- Independent items on 2.1
    - slug: appsych-u02-w07-q05
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 1
      prompt: |
        Maya reads a sign whose middle letter is smudged as "CAFE" because she knows it is a coffee shop. Which process best describes how she read the sign?
      options:
        - "Bottom-up processing, because she began with the visible letters"
        - "Top-down processing, because her knowledge filled in the smudged letter"
        - "Convergence, because her eyes turned inward to read"
        - "Sensory adaptation, because she has seen many signs"
      option_explanations:
        - |
          Bottom-up processing alone could not resolve the smudged letter; her knowledge of the shop is what decided the reading.
        - |
          Correct. Expectation and knowledge (it is a coffee shop) guided her interpretation of incomplete input, which is top-down processing.
        - |
          Convergence is a binocular depth cue for judging distance; it does not explain how a word is recognized.
        - |
          Sensory adaptation is reduced sensitivity to a constant stimulus, not the use of knowledge to interpret a smudged letter.
      answer: 1
    - slug: appsych-u02-w07-q06
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 1
      prompt: |
        While searching a crowded hallway for her brother, Ana walks right past a friend waving at her and does not notice. Which phenomenon does this illustrate?
      options:
        - "Change blindness"
        - "Shape constancy"
        - "Closure"
        - "Inattentional blindness"
      option_explanations:
        - |
          Change blindness is missing a change from one view to the next; nothing changed here, Ana simply never noticed her friend.
        - |
          Shape constancy keeps an object's perceived shape stable as its retinal image changes; it does not explain missing a person.
        - |
          Closure is filling in gaps to see whole shapes, a Gestalt grouping principle unrelated to what attention misses.
        - |
          Correct. Her attention was focused on finding her brother, so a fully visible, waving friend went unnoticed.
      answer: 3
    - slug: appsych-u02-w07-q07
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 1
      prompt: |
        A logo shows a panda made only of black patches with no outline, yet everyone sees a complete panda. Which Gestalt principle is at work?
      options:
        - "Closure"
        - "Proximity"
        - "Similarity"
        - "Interposition"
      option_explanations:
        - |
          Correct. Viewers fill in the missing outline and perceive a complete figure, which is closure.
        - |
          Proximity groups items that are near each other; the key feature here is the missing outline being filled in.
        - |
          Similarity groups items that look alike; the whole panda is perceived because gaps are filled, not because patches match.
        - |
          Interposition is a monocular depth cue (one object blocking another), not a Gestalt grouping principle.
      answer: 0
    - slug: appsych-u02-w07-q08
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 1
      prompt: |
        A person who has lost sight in one eye can still judge depth fairly well from a painting. Which cue would that person NOT be able to use?
      options:
        - "Linear perspective"
        - "Texture gradient"
        - "Retinal disparity"
        - "Relative size"
      option_explanations:
        - |
          Linear perspective (parallel lines converging) is monocular and is used in paintings, so one eye is enough.
        - |
          Texture gradient is monocular: finer, denser texture signals distance even to a single eye.
        - |
          Correct. Retinal disparity compares the slightly different images of the two eyes, so it needs both eyes.
        - |
          Relative size is monocular: the smaller image of two similar objects seems farther away, with one eye or two.
      answer: 2
    - slug: appsych-u02-w07-q09
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 1
      prompt: |
        As a bus pulls away from a stop, its image on Leo's retina shrinks, yet he does not think the bus is getting smaller. This is
      options:
        - "shape constancy"
        - "the phi phenomenon"
        - "relative clarity"
        - "size constancy"
      option_explanations:
        - |
          Shape constancy concerns an object's form as the viewing angle changes; here the issue is perceived size as distance changes.
        - |
          The phi phenomenon is apparent motion from lights flashed in sequence; the bus really is moving, and the question is its size.
        - |
          Relative clarity is a depth cue (hazy objects seem farther); it does not explain why the bus keeps its perceived size.
        - |
          Correct. Size constancy lets us perceive an object as the same size even as its retinal image changes with distance.
      answer: 3
    - slug: appsych-u02-w07-q10
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.B"
      points: 1
      prompt: |
        A movie appears to show smooth motion even though it is a series of still images projected rapidly. Which concept explains this?
      options:
        - "Stroboscopic movement, a form of apparent movement"
        - "Convergence of the eyes on the screen"
        - "Inattentional blindness to the gaps between frames"
        - "Color constancy across the frames"
      option_explanations:
        - |
          Correct. Rapidly presented still images are perceived as continuous motion: stroboscopic movement, one kind of apparent movement.
        - |
          Convergence signals how near the screen is; it does not create the impression that the images move.
        - |
          Inattentional blindness is failing to notice an unexpected object while attending elsewhere, not the perception of motion from stills.
        - |
          Color constancy keeps colors stable under changing light; it plays no part in seeing motion from still frames.
      answer: 0
    # ---- Spiral review: Unit 1
    - slug: appsych-u02-w07-q11
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Which statement correctly separates sensation from perception?
      options:
        - "Sensation interprets stimuli; perception detects them."
        - "Sensation happens in the brain; perception happens only in the eyes and ears."
        - "Sensation is receptors detecting energy and transducing it into neural signals; perception is the brain organizing and interpreting those signals."
        - "Sensation and perception are two names for the same process."
      option_explanations:
        - |
          This reverses the two: detection is sensation, and interpretation is perception.
        - |
          Sensation begins at the receptors in sense organs, and perception is carried out by the brain, so this has the locations backward.
        - |
          Correct. Sensation is detection and transduction by receptors; perception is the brain's organization and interpretation of the result.
        - |
          They are linked but distinct: you can sense a sound without recognizing it, which shows the two processes differ.
      answer: 2
    - slug: appsych-u02-w07-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        After a stroke, a person's eyes work normally but they cannot recognize familiar faces. Damage to which brain region is most likely?
      options:
        - "Cerebellum, which coordinates balance and fine movement"
        - "The temporal lobe, including areas that specialize in recognizing faces"
        - "Medulla, which controls breathing and heart rate"
        - "Motor cortex, which sends commands to the muscles"
      option_explanations:
        - |
          The cerebellum coordinates movement and balance; damage there causes clumsiness, not a loss of face recognition.
        - |
          Correct. Visual information travels from the occipital lobe to temporal areas that specialize in recognizing faces; damage there can cause face blindness.
        - |
          The medulla controls vital functions such as breathing; damage there threatens life rather than causing a specific recognition problem.
        - |
          The motor cortex controls voluntary movement; it does not recognize faces.
      answer: 1
    - slug: appsych-u02-w07-q13
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.B (spiral review)"
      points: 1
      prompt: |
        A researcher finds a correlation of r = −0.62 between hours of daily phone use and scores on a visual-attention test in a sample of teenagers. Which conclusion is justified?
      options:
        - "Phone use causes attention to decline."
        - "There is no relationship, because the correlation is negative."
        - "Teens with better attention use their phones more."
        - "Higher phone use tends to go with lower attention scores, but the study cannot show which causes which."
      option_explanations:
        - |
          A correlation alone cannot establish cause: a third variable, such as sleep, or the reverse direction could explain it.
        - |
          A negative correlation is a relationship: as one variable rises the other tends to fall. Only r near 0 means little linear relationship.
        - |
          A negative r means higher phone use goes with lower attention scores, the opposite of this statement.
        - |
          Correct. r = −0.62 is a moderately strong negative relationship, but correlation does not show causation.
      answer: 3
    - slug: appsych-u02-w07-q14
      type: multi_select
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are monocular depth cues? Select all that apply.
      options:
        - "Interposition"
        - "Convergence"
        - "Texture gradient"
        - "Linear perspective"
        - "Retinal disparity"
      option_explanations:
        - |
          Correct. An object that blocks part of another is seen as closer, and this works with a single eye.
        - |
          Convergence relies on both eyes turning inward toward a near object, so it is a binocular cue.
        - |
          Correct. Texture growing finer and denser with distance is visible to one eye, so it is monocular.
        - |
          Correct. Parallel lines appearing to converge in the distance is a monocular cue, used constantly by painters.
        - |
          Retinal disparity compares the images of the two eyes, so it is binocular.
      answer: [0, 2, 3]
    - slug: appsych-u02-w07-q15
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.C (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        A researcher plans an experiment in which participants are told they are testing a video game when they are really being tested for inattentional blindness. Which steps are required by ethical guidelines for this deception study? Select all that apply.
      options:
        - "Approval of the procedure by an institutional review board (IRB) before data collection"
        - "Debriefing participants about the real purpose afterward"
        - "Publishing participants' names with their results"
        - "Letting participants withdraw at any time without penalty"
        - "Paying participants enough that they cannot refuse"
      option_explanations:
        - |
          Correct. An IRB reviews a study, especially one with deception, to judge whether its risks are justified before it starts.
        - |
          Correct. Deception is acceptable only if participants are told the true purpose afterward, which is debriefing.
        - |
          Publishing names would violate confidentiality, which protects participants' identities and data.
        - |
          Correct. Participants keep the right to withdraw at any point, whatever the study's design.
        - |
          Payment so large that refusal is unrealistic would be coercive and undermine voluntary consent.
      answer: [0, 1, 3]
    - slug: appsych-u02-w07-q16
      type: true_false
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 1
      prompt: |
        True or false: Perceptual constancy means our perception changes whenever the image on the retina changes.
      answer: false
      explanation: |
        False. Constancy is the opposite: we perceive an object's size, shape and color as stable even though the retinal image changes with distance, angle and lighting.
    - slug: appsych-u02-w07-q17
      type: true_false
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: A neuron fires with the same strength whenever its threshold is reached; a stronger stimulus makes it fire more often, not more strongly.
      answer: true
      explanation: |
        True. Firing is all-or-none: once the threshold is reached the action potential has a fixed size. Intensity is signaled by how often neurons fire and how many fire.
    - slug: appsych-u02-w07-q18
      type: fill_blank
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 1
      prompt: |
        A reversible drawing that can be seen as a vase or as two faces shows how the brain organizes a scene into ____ and ground.
      answer: ["figure", "a figure"]
      explanation: |
        Figure-ground organization separates an object (figure) from its background (ground); in reversible figures the two can swap.
    - slug: appsych-u02-w07-q19
      type: fill_blank
      topic_code: "1.6"
      source: "Original item; CED Topic 1.6, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        The conversion of light energy into neural signals by the rods and cones is called ____.
      answer: ["transduction", "sensory transduction"]
      explanation: |
        Transduction is the conversion of one form of energy into neural impulses. It is the step where sensation begins, before perception can interpret anything.
    - slug: appsych-u02-w07-q20
      type: short_answer
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A"
      points: 3
      prompt: |
        Jordan, a nervous first-time camper, hears a rustle outside the tent at night and is sure it is a bear. In the morning it turns out to have been a raccoon.

        (a) Identify whether Jordan's interpretation reflects mainly bottom-up or top-down processing, and explain.
        (b) Explain how one influence on perceptual set contributed.
        (c) Describe how sensory adaptation (Unit 1) might have affected Jordan's sensitivity to sounds in the quiet campsite.
      answer: |
        (a) Top-down: the rustle itself was ambiguous; Jordan's expectations and fears supplied the interpretation "bear".
        (b) Emotion (fear) or expectation (having heard about bears) primed Jordan to read an ambiguous sound as a threat.
        (c) With little constant background noise, Jordan's auditory system was not adapted to a steady sound, so a new sound stood out sharply; adaptation reduces sensitivity only to unchanging stimuli.
      explanation: |
        Three points, one per part. (a) top-down with a reason tied to expectation or knowledge driving the reading. (b) names emotion, expectation, context or experience and links it to the bear interpretation. (c) explains adaptation as reduced sensitivity to unchanging stimuli and applies it (a changing rustle in a quiet setting is noticed). Calling the rustle itself perception, or adaptation "getting used to bears", earns nothing.
    - slug: appsych-u02-w07-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.A (spiral review)"
      points: 3
      prompt: |
        A student wants to test whether wearing a blindfold over one eye makes people worse at catching a ball.

        (a) Write a hypothesis that names the independent and dependent variables.
        (b) Give an operational definition of the dependent variable.
        (c) Explain why the student should randomly assign participants to conditions.
      answer: |
        (a) People catching with one eye covered (IV: one eye covered or both eyes open) will catch fewer balls (DV: catching performance) than people using both eyes.
        (b) The number of balls caught out of 20 tosses from 5 meters.
        (c) Random assignment spreads differences such as athletic skill evenly across groups, so a difference in catches can be attributed to the blindfold rather than to who was in each group.
      explanation: |
        Three points, one per part. (a) a testable, directional statement naming both variables. (b) a measurable procedure (counts, distances, number of trials). (c) random assignment controls pre-existing differences (confounds), allowing a cause-and-effect conclusion; confusing it with random sampling earns nothing.
    - slug: appsych-u02-w07-q22
      type: long_answer
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skills 2.A, 3.A, 4.B"
      points: 5
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 50 adult drivers through a newspaper advertisement. Each drove a simulated city route twice, once while holding a hands-free phone conversation and once without, in a random order. The dependent variable was the number of pedestrians (out of 12) that the driver failed to brake for. Mean misses were 3.6 (SD 1.2) during phone conversations and 1.1 (SD 0.8) without them; the difference was statistically significant. Drivers gave informed consent and could stop at any time.
      prompt: |
        (A) Identify the research method used in this study.
        (B) Explain how the results illustrate a concept from perception.
        (C) Describe what the standard deviations tell you about the two conditions.
        (D) Explain why the random order of the two drives matters.
        (E) Explain one limit on generalizing the findings to teen drivers.
      answer: |
        (A) An experiment (within-subjects / repeated measures): the researchers manipulated the phone conversation and measured misses.
        (B) Inattentional blindness: attention taken up by the conversation left drivers failing to notice visible pedestrians.
        (C) Both SDs are small relative to the means, so scores clustered near each mean; the phone condition varied somewhat more (1.2 against 0.8).
        (D) Counterbalancing the order prevents practice or fatigue from the first drive from being confused with the effect of the phone.
        (E) The sample was adults recruited by a newspaper ad, so they may differ from teens in driving experience and phone habits.
      explanation: |
        Five points. (A) 1 point: experiment (repeated measures accepted). (B) 1 point: names inattentional blindness or selective attention and links it to missed pedestrians. (C) 1 point: SD as spread around the mean, applied to the two conditions. (D) 1 point: order effects (practice, fatigue) controlled by random order. (E) 1 point: a specific sample feature (adults, volunteers from an ad) linked to why teens might differ.
