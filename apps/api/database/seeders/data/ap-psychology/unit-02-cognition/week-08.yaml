week: 8
unit: 2
title: Thinking, Problem Solving and Decisions
topics: ["2.2"]
guide: guides/week-08.md
guide_description: |
  How we organize knowledge and make judgments: concepts, prototypes and schemas (assimilation and
  accommodation), executive functions and the prefrontal cortex, algorithms, heuristics and insight, the
  availability and representativeness heuristics, and the obstacles to good thinking (mental set, functional
  fixedness, confirmation bias, priming, framing, the gambler's fallacy and the sunk-cost fallacy), then
  creativity with divergent and convergent thinking. Worked examples: naming the heuristic behind a judgment
  about a mall, sorting four everyday decision errors, a hypothetical framing experiment on a school-lunch
  program read through its proportions, and an invented survey correlating crime-news viewing with crime
  estimates.
flashcards_description: |
  30 cards on concepts and prototypes, schemas, executive functions, algorithms and heuristics, the classic
  obstacles to problem solving and judgment, creativity, and how framing and heuristic studies are designed.

flashcards:
  - front: "Concept → definition"
    back: |
      A mental grouping of similar objects, events, ideas or people, such as "vehicle" or "friendship".
    topic_code: "2.2"
  - front: "Prototype → definition and effect"
    back: |
      The most typical example of a concept. Items close to the prototype (a robin for "bird") are categorized faster than atypical ones (a penguin).
    topic_code: "2.2"
  - front: "Schema (in thinking) → definition"
    back: |
      An organized framework of knowledge about something (a restaurant visit, a teacher) that guides how new information is interpreted.
    topic_code: "2.2"
  - front: "Assimilation → definition"
    back: |
      Interpreting new information in terms of an existing schema, such as a toddler calling a cow a "doggy".
    topic_code: "2.2"
  - front: "Accommodation → definition"
    back: |
      Changing an existing schema, or building a new one, to fit information that does not fit, such as the toddler forming a separate "cow" schema.
    topic_code: "2.2"
  - front: "Executive functions → what they include"
    back: |
      Planning, working toward goals, inhibiting impulses, holding information in mind and switching between tasks.
    topic_code: "2.2"
  - front: "Executive functions → brain region"
    back: |
      Mainly the prefrontal cortex in the frontal lobes, which continues to mature into the mid-twenties.
    topic_code: "2.2"
  - front: "Algorithm → definition"
    back: |
      A methodical, step-by-step procedure that guarantees a solution but can be slow, such as trying every combination on a lock.
    topic_code: "2.2"
  - front: "Heuristic → definition"
    back: |
      A mental shortcut or rule of thumb that is fast and usually works, but can lead to errors.
    topic_code: "2.2"
  - front: "Insight → definition"
    back: |
      A sudden realization of a problem's solution, often after a period of being stuck; it contrasts with step-by-step strategies.
    topic_code: "2.2"
  - front: "Availability heuristic → definition"
    back: |
      Judging the likelihood of an event by how easily examples come to mind. Vivid, recent or heavily reported events seem more common than they are.
    topic_code: "2.2"
  - front: "Availability heuristic → example"
    back: |
      After seeing news coverage of a shark attack, a swimmer judges shark attacks to be far more likely than drowning.
    topic_code: "2.2"
  - front: "Representativeness heuristic → definition"
    back: |
      Judging the likelihood of something by how well it matches a prototype, often ignoring base rates.
    topic_code: "2.2"
  - front: "Representativeness heuristic → example"
    back: |
      Guessing that a quiet person who loves poetry is a classics professor rather than a truck driver, though truck drivers are far more numerous.
    topic_code: "2.2"
  - front: "Heuristics researchers → who described availability and representativeness"
    back: |
      Amos Tversky and Daniel Kahneman, in research published in the 1970s.
    topic_code: "2.2"
  - front: "Mental set → definition"
    back: |
      The tendency to approach a problem with a strategy that worked before, even when a better one is available.
    topic_code: "2.2"
  - front: "Water-jar problems (Luchins) → what they showed"
    back: |
      People who had solved several problems with a long formula kept using it even when a simple method would work: mental set.
    topic_code: "2.2"
  - front: "Functional fixedness → definition"
    back: |
      Thinking of an object only in terms of its usual function, which blocks seeing other uses for it.
    topic_code: "2.2"
  - front: "Candle problem (Duncker) → what it showed"
    back: |
      Many people failed to see that the box holding the tacks could serve as a shelf for the candle: functional fixedness.
    topic_code: "2.2"
  - front: "Confirmation bias → definition"
    back: |
      Searching for, noticing and remembering information that supports existing beliefs while ignoring evidence against them.
    topic_code: "2.2"
  - front: "Belief perseverance → definition"
    back: |
      Clinging to a belief even after the evidence on which it was based has been discredited.
    topic_code: "2.2"
  - front: "Priming (in thinking) → definition"
    back: |
      Earlier exposure to a stimulus makes related ideas more accessible, often without awareness, and so influences later judgments.
    topic_code: "2.2"
  - front: "Framing → definition and example"
    back: |
      The way a choice is presented changes the decision: "90% survival" is chosen more often than "10% mortality", though they are the same.
    topic_code: "2.2"
  - front: "Gambler's fallacy → definition"
    back: |
      Believing that past independent random events change the odds of future ones, such as thinking tails is "due" after five heads.
    topic_code: "2.2"
  - front: "Sunk-cost fallacy → definition"
    back: |
      Continuing an investment because of what has already been spent rather than future costs and benefits, like finishing a terrible meal because it was expensive.
    topic_code: "2.2"
  - front: "Overconfidence → definition"
    back: |
      Being more confident in one's judgments and knowledge than their accuracy justifies.
    topic_code: "2.2"
  - front: "Creativity → definition"
    back: |
      The ability to produce ideas that are both novel and useful or valuable.
    topic_code: "2.2"
  - front: "Divergent thinking → definition"
    back: |
      Generating many different possible answers or ideas, as in brainstorming uses for a brick. Central to creativity.
    topic_code: "2.2"
  - front: "Convergent thinking → definition"
    back: |
      Narrowing many possibilities down to the single best answer, as on a multiple-choice test.
    topic_code: "2.2"
  - front: "Framing experiment → why random assignment is needed"
    back: |
      It spreads prior attitudes evenly across the two wordings, so a difference in decisions can be attributed to the frame rather than to who read which version.
    topic_code: "2.2"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 2.2: concepts, schemas, executive functions,
    algorithms and heuristics, obstacles to problem solving, decision biases and creativity), with 7 questions
    (32%) reviewing earlier weeks (perception in 2.1, the brain, neurotransmission and research methods from
    Unit 1). Opens with a shared-context set on one hypothetical framing experiment. Multiple choice, select-all
    and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical framing experiment (2.2)
    - slug: appsych-u02-w08-q01
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 200 college students to read one of two descriptions of a new flu vaccine. The "gain" description said that 80 out of 100 people who received the vaccine were protected. The "loss" description said that 20 out of 100 people who received it were not protected. Students then rated how likely they were to get the vaccine on a scale from 1 (very unlikely) to 7 (very likely).

        | Description | n | Mean rating | Standard deviation |
        |---|---|---|---|
        | Gain | 100 | 5.4 | 1.1 |
        | Loss | 100 | 4.1 | 1.3 |

        The difference between the means was statistically significant.
      prompt: |
        Which concept do the results best illustrate?
      options:
        - "Functional fixedness"
        - "Framing"
        - "The availability heuristic"
        - "Mental set"
      option_explanations:
        - |
          Functional fixedness is seeing an object only in its usual use; no object or problem-solving task is involved here.
        - |
          Correct. Both descriptions give identical information, yet the wording (protected versus not protected) changed willingness to be vaccinated.
        - |
          The availability heuristic depends on how easily examples come to mind; both groups read the same statistic, only worded differently.
        - |
          Mental set is reusing a strategy that worked before; participants were not solving a series of problems.
      answer: 1
    - slug: appsych-u02-w08-q02
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 2.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 200 college students to read one of two descriptions of a new flu vaccine. The "gain" description said that 80 out of 100 people who received the vaccine were protected. The "loss" description said that 20 out of 100 people who received it were not protected. Students then rated how likely they were to get the vaccine on a scale from 1 (very unlikely) to 7 (very likely).

        | Description | n | Mean rating | Standard deviation |
        |---|---|---|---|
        | Gain | 100 | 5.4 | 1.1 |
        | Loss | 100 | 4.1 | 1.3 |

        The difference between the means was statistically significant.
      prompt: |
        What is the operational definition of the dependent variable?
      options:
        - "Whether a student read the gain or the loss description"
        - "Whether a student actually got vaccinated that winter"
        - "The 200 college students in the sample"
        - "A student's rating, from 1 to 7, of how likely they were to get the vaccine"
      option_explanations:
        - |
          The description each student read is what was manipulated, so it is the independent variable, not the dependent one.
        - |
          The study never measured actual vaccination; it measured stated intentions on a rating scale.
        - |
          The students are the participants (the sample), not a variable that was measured.
        - |
          Correct. Willingness to be vaccinated was measured as a 1-to-7 rating, which is exactly how the variable was operationalized.
      answer: 3
    - slug: appsych-u02-w08-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 200 college students to read one of two descriptions of a new flu vaccine. The "gain" description said that 80 out of 100 people who received the vaccine were protected. The "loss" description said that 20 out of 100 people who received it were not protected. Students then rated how likely they were to get the vaccine on a scale from 1 (very unlikely) to 7 (very likely).

        | Description | n | Mean rating | Standard deviation |
        |---|---|---|---|
        | Gain | 100 | 5.4 | 1.1 |
        | Loss | 100 | 4.1 | 1.3 |

        The difference between the means was statistically significant.
      prompt: |
        Which statement about the standard deviations is accurate?
      options:
        - "Ratings in the loss group were somewhat more spread out around their mean than ratings in the gain group."
        - "The loss group had a higher average rating, because its standard deviation is larger."
        - "Because both standard deviations exceed 1, the difference is not meaningful."
        - "The standard deviations show that the gain frame caused higher ratings."
      option_explanations:
        - |
          Correct. Standard deviation measures spread around the mean; 1.3 is larger than 1.1, so loss-group ratings varied a bit more.
        - |
          The standard deviation describes spread, not the average; the loss group's mean (4.1) is the lower one.
        - |
          Standard deviations of about 1 on a 7-point scale are modest; the means differ by 1.3 points and the test found the difference significant.
        - |
          Spread alone says nothing about cause; the causal claim rests on random assignment and the difference in means.
      answer: 0
    - slug: appsych-u02-w08-q04
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 2.D"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 200 college students to read one of two descriptions of a new flu vaccine. The "gain" description said that 80 out of 100 people who received the vaccine were protected. The "loss" description said that 20 out of 100 people who received it were not protected. Students then rated how likely they were to get the vaccine on a scale from 1 (very unlikely) to 7 (very likely).

        | Description | n | Mean rating | Standard deviation |
        |---|---|---|---|
        | Gain | 100 | 5.4 | 1.1 |
        | Loss | 100 | 4.1 | 1.3 |

        The difference between the means was statistically significant.
      prompt: |
        Which is the strongest reason to be cautious about generalizing these results to older adults?
      options:
        - "The study had two groups instead of three."
        - "The dependent variable was measured on a rating scale."
        - "All participants were college students, who may weigh vaccine information differently from older adults."
        - "The researchers used random assignment."
      option_explanations:
        - |
          Two conditions are enough to test whether the frame matters; the number of groups does not limit who the results apply to.
        - |
          A rating scale is a reasonable operational definition; it does not by itself restrict the population the results describe.
        - |
          Correct. Generalizability depends on who was sampled; college students differ in age and health concerns from older adults.
        - |
          Random assignment strengthens the causal conclusion; it is random sampling, not assignment, that bears on generalization.
      answer: 2
    # ---- Independent items on 2.2
    - slug: appsych-u02-w08-q05
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 1
      prompt: |
        After seeing several news stories about lottery winners, Darnell believes his chances of winning are quite good and buys 20 tickets. Which concept best explains his judgment?
      options:
        - "Representativeness heuristic"
        - "Functional fixedness"
        - "Availability heuristic"
        - "Divergent thinking"
      option_explanations:
        - |
          Representativeness compares a case with a prototype; Darnell's judgment rests on how easily winners come to mind.
        - |
          Functional fixedness concerns seeing objects only in their usual use, not estimating the odds of an event.
        - |
          Correct. Vivid, easily recalled stories of winners make winning seem more likely than it is: the availability heuristic.
        - |
          Divergent thinking is generating many possible ideas, a creative process unrelated to estimating likelihood.
      answer: 2
    - slug: appsych-u02-w08-q06
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 1
      prompt: |
        Kira needs to tighten a screw but has no screwdriver. She does not think of using the edge of a coin until a friend suggests it. Kira was experiencing
      options:
        - "functional fixedness"
        - "the sunk-cost fallacy"
        - "confirmation bias"
        - "the gambler's fallacy"
      option_explanations:
        - |
          Correct. Seeing the coin only as money kept Kira from noticing its use as a screwdriver, which is functional fixedness.
        - |
          The sunk-cost fallacy is persisting because of past investment; nothing has been spent or invested here.
        - |
          Confirmation bias is favoring evidence for a belief; Kira is not testing a belief but missing an object's alternative use.
        - |
          The gambler's fallacy is a mistaken belief about random sequences, unrelated to using an object in a new way.
      answer: 0
    - slug: appsych-u02-w08-q07
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 1
      prompt: |
        A roulette wheel has landed on red seven times in a row. A player bets heavily on black, believing it is "due". The player is showing
      options:
        - "the representativeness heuristic, because black is typical of roulette"
        - "mental set, because the player always bets on black"
        - "framing, because the odds were described positively"
        - "the gambler's fallacy"
      option_explanations:
        - |
          Representativeness judges likelihood by resemblance to a prototype; the player is not matching black to a prototype but expecting a past run of reds to change independent odds, which has its own name.
        - |
          Mental set is reusing a strategy that worked before; the player's bet is driven by a belief about the previous spins.
        - |
          No description or wording of the odds is involved; the error comes from the run of past outcomes.
        - |
          Correct. Each spin is independent, so a run of reds does not make black more likely; believing otherwise is the gambler's fallacy.
      answer: 3
    - slug: appsych-u02-w08-q08
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 1
      prompt: |
        Which situation is the best example of the sunk-cost fallacy?
      options:
        - "A student switches majors after one semester because she discovers she dislikes the field."
        - "A company keeps funding a failing product because it has already spent millions developing it."
        - "A shopper buys the brand she has always bought without comparing prices."
        - "A fan predicts his team will win because it won last week."
      option_explanations:
        - |
          Switching away from a poor choice despite past effort is the opposite of the sunk-cost fallacy.
        - |
          Correct. Past spending, which cannot be recovered, is driving the decision instead of the product's future prospects.
        - |
          Buying out of habit reflects a routine or mental shortcut, not continuing because of what has already been spent.
        - |
          This is a prediction from one recent result, not a decision to keep investing because of earlier investment.
      answer: 1
    - slug: appsych-u02-w08-q09
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 1
      prompt: |
        A student who believes left-handed people are more creative notices every left-handed artist she reads about but overlooks the many right-handed ones. This illustrates
      options:
        - "confirmation bias"
        - "an algorithm"
        - "accommodation"
        - "insight"
      option_explanations:
        - |
          Correct. She notices evidence that supports her belief and overlooks evidence against it, which is confirmation bias.
        - |
          An algorithm is a step-by-step procedure that guarantees a solution; selective noticing is a bias, not a procedure.
        - |
          Accommodation would mean changing her schema to fit new evidence; she is protecting her belief instead.
        - |
          Insight is a sudden realization of a solution, not a pattern of selectively attending to supporting cases.
      answer: 0
    - slug: appsych-u02-w08-q10
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 1
      prompt: |
        A teacher asks students to list as many uses for a newspaper as they can in three minutes. The task measures
      options:
        - "convergent thinking"
        - "executive inhibition"
        - "divergent thinking"
        - "the representativeness heuristic"
      option_explanations:
        - |
          Convergent thinking narrows options to one best answer; this task rewards producing many answers.
        - |
          Inhibition is holding back an automatic response; the task asks students to generate ideas, not suppress them.
        - |
          Correct. Generating many different possible uses is divergent thinking, a key part of creativity.
        - |
          Representativeness is a judgment shortcut based on similarity to a prototype; no likelihood judgment is asked for.
      answer: 2
    # ---- Spiral review: 2.1 and Unit 1
    - slug: appsych-u02-w08-q11
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Fans of two rival teams watch the same replay; each group is sure the referee's call favored the other side. Which concept best explains the different perceptions?
      options:
        - "Retinal disparity"
        - "The phi phenomenon"
        - "Size constancy"
        - "Perceptual set"
      option_explanations:
        - |
          Retinal disparity is a binocular depth cue; both groups see the same distances, and the difference lies in interpretation.
        - |
          The phi phenomenon is apparent motion from flashing lights; it does not explain why each group interprets the play differently.
        - |
          Size constancy keeps perceived size stable with distance; it has nothing to do with judging a referee's call.
        - |
          Correct. Loyalties and expectations create a readiness to see the play a certain way, which is perceptual set.
      answer: 3
    - slug: appsych-u02-w08-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A patient with damage to the prefrontal cortex can still recall facts but struggles to plan a meal or resist impulses. Which ability is most clearly affected?
      options:
        - "Basic visual sensation"
        - "Executive functions"
        - "Balance and coordination"
        - "Regulation of heartbeat"
      option_explanations:
        - |
          Basic visual sensation depends on the eyes and occipital lobe, not the prefrontal cortex.
        - |
          Correct. Planning and inhibiting impulses are executive functions, which depend heavily on the prefrontal cortex.
        - |
          Balance and coordination are mainly handled by the cerebellum.
        - |
          Heart rate is regulated by the brainstem's medulla, not the prefrontal cortex.
      answer: 1
    - slug: appsych-u02-w08-q13
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.A (spiral review)"
      points: 1
      prompt: |
        A researcher wants a sample that represents all 2,000 students at a high school. Which method gives every student an equal chance of being selected?
      options:
        - "Surveying the first 100 students who arrive at school"
        - "Posting a survey link that any student may choose to answer"
        - "Surveying all students in two AP classes"
        - "Using a random number generator to choose 100 students from the full enrollment list"
      option_explanations:
        - |
          Early arrivals differ systematically from other students (for example, bus riders), so this convenience sample is biased.
        - |
          A voluntary response sample over-represents students with strong opinions or free time.
        - |
          Two AP classes are a convenience sample that excludes most of the school and differs in academic profile.
        - |
          Correct. Random selection from the full list gives every student an equal chance: a simple random sample.
      answer: 3
    - slug: appsych-u02-w08-q14
      type: multi_select
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are heuristics or biases that can lead to errors in judgment? Select all that apply.
      options:
        - "Availability heuristic"
        - "Using an algorithm to check every possibility"
        - "Representativeness heuristic"
        - "Belief perseverance"
        - "Random assignment"
      option_explanations:
        - |
          Correct. Judging likelihood by ease of recall leads people to overestimate vivid, memorable events.
        - |
          An algorithm guarantees a correct solution if followed; it is slow, but it does not produce judgment errors.
        - |
          Correct. Judging by resemblance to a prototype while ignoring base rates leads to predictable errors.
        - |
          Correct. Holding on to a belief after its evidence is discredited distorts later judgment.
        - |
          Random assignment is a research procedure that reduces confounds; it is not a bias in individual thinking.
      answer: [0, 2, 3]
    - slug: appsych-u02-w08-q15
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.B (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        A survey finds a correlation of r = +0.35 between hours of puzzle-solving per week and scores on a creativity test. Which statements are correct? Select all that apply.
      options:
        - "People who do more puzzles tend to score somewhat higher on the creativity test."
        - "Doing puzzles has been shown to cause creativity."
        - "The relationship is positive but only moderate in strength."
        - "A third variable, such as curiosity, could explain both."
        - "A correlation of +0.35 is stronger than one of −0.60."
      option_explanations:
        - |
          Correct. A positive r means higher values of one variable tend to go with higher values of the other.
        - |
          Correlational data cannot establish cause; only an experiment with random assignment could.
        - |
          Correct. r = +0.35 shows a positive relationship of modest strength; values near ±1 are strong.
        - |
          Correct. A third variable, such as curiosity, could lead people both to do puzzles and to think creatively.
        - |
          Strength depends on the absolute value: |−0.60| is greater than 0.35, so the negative correlation is stronger.
      answer: [0, 2, 3]
    - slug: appsych-u02-w08-q16
      type: true_false
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 1
      prompt: |
        True or false: A heuristic always produces a correct answer if it is followed carefully.
      answer: false
      explanation: |
        False. That describes an algorithm. A heuristic is a shortcut that is fast and usually works, but it can lead to systematic errors such as those caused by availability or representativeness.
    - slug: appsych-u02-w08-q17
      type: true_false
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: Dopamine is a neurotransmitter involved in reward, motivation and movement.
      answer: true
      explanation: |
        True. Dopamine pathways are central to reward and motivation, and the loss of dopamine-producing neurons underlies the movement problems of Parkinson's disease.
    - slug: appsych-u02-w08-q18
      type: fill_blank
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 1
      prompt: |
        The most typical example of a concept, such as a robin for "bird", is called a ____.
      answer: ["prototype", "prototypes"]
      explanation: |
        A prototype is the best example of a category; we categorize new items by comparing them with it, so typical members are recognized faster.
    - slug: appsych-u02-w08-q19
      type: fill_blank
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Seeing six dots arranged as three pairs as three groups illustrates the Gestalt principle of ____.
      answer: ["proximity"]
      explanation: |
        Proximity is grouping items that are close together; the pairs are perceived as units because of their spacing.
    - slug: appsych-u02-w08-q20
      type: short_answer
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A"
      points: 3
      prompt: |
        A town council must decide whether to keep paying for a new stadium that is over budget and behind schedule.

        (a) Explain how the sunk-cost fallacy could influence the council's decision.
        (b) Explain how framing could be used by stadium supporters.
        (c) Explain how confirmation bias could affect a council member who already supports the stadium.
      answer: |
        (a) Members may vote to continue because of the money already spent ("we can't waste what we've invested"), rather than judging whether future costs are worth the future benefits.
        (b) Supporters could describe the project as "90% complete" rather than "still 10% unfinished and over budget", making continuing seem more attractive.
        (c) The member may seek out reports of future benefits and dismiss evidence of cost overruns, strengthening the existing belief.
      explanation: |
        Three points, one per part. Each part must apply the concept to the stadium decision, not just define it. (a) decision driven by past, unrecoverable spending. (b) the same facts worded to sound positive. (c) selective seeking or weighting of supporting evidence.
    - slug: appsych-u02-w08-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.C (spiral review)"
      points: 3
      prompt: |
        A psychologist wants to study the availability heuristic by telling participants that a list contains "mostly famous women" when it really contains equal numbers of famous men and women.

        (a) Identify the ethical issue this design raises.
        (b) Explain what the psychologist must do after the study to address it.
        (c) Explain the role of an institutional review board (IRB) in this study.
      answer: |
        (a) Deception: participants are misled about the list's contents.
        (b) Debrief them: explain the true purpose and the deception, and answer questions.
        (c) The IRB reviews the plan before the study begins and approves deception only if it is necessary and the risks are minimal and outweighed by the benefits.
      explanation: |
        Three points, one per part. (a) names deception. (b) debriefing, with the true purpose revealed. (c) prior review of risks and benefits by an IRB; "the IRB runs the study" earns nothing.
    - slug: appsych-u02-w08-q22
      type: long_answer
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skills 1.A, 2.A, 4.B"
      points: 5
      stimulus: |
        A hypothetical study, invented for this course. A research team randomly assigned 60 volunteers to two groups of 30. The practice group first solved three practice puzzles that could only be solved with a long, five-step method; the no-practice group did no practice puzzles. Everyone then solved one final puzzle, which could be solved with either the five-step method or a simple two-step method. In the practice group, 24 of 30 (80%) used the long method on the final puzzle; in the no-practice group, 7 of 30 (23%) did. Participants gave informed consent and were debriefed.
      prompt: |
        (A) Identify the independent variable.
        (B) Identify the concept from problem solving that the results illustrate, and explain.
        (C) Calculate the difference between the two groups' percentages, and explain what it suggests.
        (D) Explain why random assignment allows a cause-and-effect conclusion here.
        (E) Explain how this finding could apply to a student studying for a math test.
      answer: |
        (A) Whether participants did the long-method practice puzzles (practice or no practice).
        (B) Mental set: having succeeded with the long method, practice-group participants kept using it even when a simpler method was available.
        (C) 80% − 23% = 57 percentage points; a large difference suggesting the practice strongly shaped the strategy chosen.
        (D) Random assignment makes the groups equivalent on average in prior skill and problem-solving style, so the practice is the only systematic difference.
        (E) A student who drills one solution method may keep applying it to problems where another approach would be faster, so they should practice varied problems.
      explanation: |
        Five points. (A) 1 point: practice versus no practice. (B) 1 point: mental set with an explanation tied to reusing a past strategy (functional fixedness earns nothing: no object's use is at issue). (C) 1 point: 57 percentage points with a sensible interpretation. (D) 1 point: groups equivalent on average, so differences are due to the IV. (E) 1 point: a plausible application of mental set to studying.
