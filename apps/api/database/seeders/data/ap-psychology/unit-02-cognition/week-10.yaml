week: 10
unit: 2
title: "Encoding: Getting Information In"
topics: ["2.4"]
guide: guides/week-10.md
guide_description: |
  How information gets into memory: automatic processing (space, time, frequency, well-learned skills) and
  effortful processing, visual, acoustic and semantic encoding, the self-reference effect and imagery,
  maintenance versus elaborative rehearsal, mnemonic devices (chunking, the method of loci, acronyms and
  hierarchies), the spacing effect from Ebbinghaus onward, the serial position effect, and sleep's role in
  consolidation. Worked examples: upgrading a reread-five-times study habit, choosing a mnemonic for depth cues
  and a phone number, reading a hypothetical serial position curve, and an invented spaced-versus-massed
  vocabulary experiment read through its means, standard deviations and effect size.
flashcards_description: |
  30 cards on automatic and effortful processing, types of encoding, the self-reference effect, rehearsal,
  mnemonic devices, the spacing and serial position effects, sleep and consolidation, and how study-strategy
  experiments are designed.

flashcards:
  - front: "Encoding → definition"
    back: |
      The process of getting information into the memory system.
    topic_code: "2.4"
  - front: "Automatic processing → definition"
    back: |
      Unconscious encoding of incidental information, especially space, time and frequency, and of well-learned skills such as reading.
    topic_code: "2.4"
  - front: "Automatic processing → three kinds of incidental information"
    back: |
      Space (where something was), time (when and in what order) and frequency (how often).
    topic_code: "2.4"
  - front: "Effortful processing → definition"
    back: |
      Encoding that requires attention and conscious effort, such as learning a new formula or vocabulary list.
    topic_code: "2.4"
  - front: "Effortful to automatic → example"
    back: |
      Reading takes great effort for a beginner but becomes automatic with practice: a skilled reader cannot look at a familiar word without reading it.
    topic_code: "2.4"
  - front: "Visual, acoustic, semantic encoding → definitions"
    back: |
      Visual: encoding images. Acoustic: encoding sounds, especially the sounds of words. Semantic: encoding meaning.
    topic_code: "2.4"
  - front: "Semantic encoding → why it is strongest"
    back: |
      Meaning connects new information to many existing memories, giving more routes for later retrieval.
    topic_code: "2.4"
  - front: "Self-reference effect → definition"
    back: |
      Information related to oneself is remembered better than other information, because the self is a rich, well-organized schema.
    topic_code: "2.4"
  - front: "Imagery and encoding → effect"
    back: |
      Concrete, easily imagined words are remembered better than abstract ones; a vivid image gives a second route to the memory.
    topic_code: "2.4"
  - front: "Elaborative rehearsal → definition"
    back: |
      Linking new information to existing knowledge and meaning, such as explaining it in your own words or relating it to your life.
    topic_code: "2.4"
  - front: "Maintenance versus elaborative rehearsal → which works better for long-term memory"
    back: |
      Elaborative rehearsal. Simple repetition keeps information in short-term memory but transfers it to long-term memory poorly.
    topic_code: "2.4"
  - front: "Mnemonic device → definition"
    back: |
      A memory aid that uses organization, vivid imagery or verbal patterns to make information easier to encode and retrieve.
    topic_code: "2.4"
  - front: "Chunking → definition"
    back: |
      Organizing items into familiar, meaningful units, such as grouping 1-4-9-2-1-7-7-6 into the years 1492 and 1776.
    topic_code: "2.4"
  - front: "Chunking → why it helps short-term memory"
    back: |
      Short-term memory holds only a few units; chunking makes each unit carry more information.
    topic_code: "2.4"
  - front: "Chunking in experts → example"
    back: |
      A chess master sees a whole familiar board arrangement as one chunk, while a novice must remember each piece separately.
    topic_code: "2.4"
  - front: "Method of loci → definition"
    back: |
      A mnemonic in which items are imagined at locations along a familiar route, then recalled by mentally walking the route.
    topic_code: "2.4"
  - front: "Acronym and acrostic mnemonics → difference"
    back: |
      An acronym forms a word from first letters (HOMES for the Great Lakes); an acrostic forms a sentence ("Every Good Boy Does Fine").
    topic_code: "2.4"
  - front: "Hierarchies → why they help encoding"
    back: |
      Organizing information into categories and subcategories (an outline or concept map) links each fact to related facts, aiding encoding and retrieval.
    topic_code: "2.4"
  - front: "Spacing effect → definition"
    back: |
      Better long-term retention from study spread out over time (distributed practice) than from the same total study crammed together (massed practice).
    topic_code: "2.4"
  - front: "Hermann Ebbinghaus → contribution to encoding"
    back: |
      In the 1880s, testing himself on nonsense syllables, he found that spreading practice over days improved retention: an early demonstration of the spacing effect.
    topic_code: "2.4"
  - front: "Massed practice (cramming) → typical result"
    back: |
      Can produce good performance shortly afterward, but the learning fades quickly compared with spaced study.
    topic_code: "2.4"
  - front: "Serial position effect → definition"
    back: |
      When recalling a list, people remember the first and last items better than those in the middle.
    topic_code: "2.4"
  - front: "Primacy effect → definition and explanation"
    back: |
      Better recall of the first items in a list, usually explained by extra rehearsal that moved them into long-term memory.
    topic_code: "2.4"
  - front: "Recency effect → definition and explanation"
    back: |
      Better recall of the last items in a list, explained by their still being in short-term memory at the time of recall.
    topic_code: "2.4"
  - front: "Delayed recall and the serial position curve → what changes"
    back: |
      After a filled delay of about 30 seconds the recency effect shrinks, because the last items fade from short-term memory, while primacy remains.
    topic_code: "2.4"
  - front: "Sleep and consolidation → link to encoding"
    back: |
      Sleep after learning helps stabilize new memories; an all-nighter both prevents spacing and disrupts consolidation.
    topic_code: "2.4"
  - front: "Spaced versus massed experiment → variables to hold constant"
    back: |
      Total study time, the material, the test and the delay between the last study session and the test.
    topic_code: "2.4"
  - front: "Study-strategy experiment → why random assignment"
    back: |
      It balances prior knowledge and motivation across groups, so a difference in test scores can be attributed to the strategy.
    topic_code: "2.4"
  - front: "Effect size in a study-strategy experiment → meaning"
    back: |
      How large the difference between groups is (often in standard deviation units), which tells a student whether a strategy is worth adopting, beyond whether it is statistically significant.
    topic_code: "2.4"
  - front: "Effortful versus deep → error-spot"
    back: |
      "Effortful processing is always deep" is wrong: repeating a word 20 times takes effort but is shallow; depth is about processing meaning.
    topic_code: "2.4"

quiz:
  description: |
    22 questions · about 40 minutes · mostly on this week (topic 2.4: automatic and effortful processing, kinds
    of encoding, rehearsal, mnemonics, and the spacing and serial position effects), with 6 questions (27%)
    reviewing earlier weeks (thinking and memory systems in 2.2–2.3, and sleep, the nervous system and research
    methods from Unit 1). Opens with a shared-context set on one hypothetical serial position study. Multiple
    choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical serial position study (2.4)
    - slug: appsych-u02-w10-q01
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team read a list of 12 unrelated words aloud to 60 volunteers. Half were randomly assigned to write down all the words they remembered immediately; the other half first counted backward by threes for 30 seconds and then wrote down the words. The table shows the percentage of each group recalling the words in each part of the list.

        | List positions | Immediate recall (%) | Recall after 30-second delay (%) |
        |---|---|---|
        | 1–3 | 70 | 66 |
        | 4–9 | 32 | 30 |
        | 10–12 | 78 | 35 |
      prompt: |
        Which pattern in the immediate-recall group shows the recency effect?
      options:
        - "Recall of positions 1–3 was 70%."
        - "Recall of positions 4–9 was the lowest."
        - "Recall of positions 10–12 was the highest, at 78%."
        - "Recall was about the same in both groups for positions 4–9."
      option_explanations:
        - |
          High recall of the first items is the primacy effect, not the recency effect.
        - |
          Low recall in the middle is part of the serial position curve, but recency refers specifically to the last items.
        - |
          Correct. The recency effect is better recall of the final items in a list, and positions 10–12 were recalled best.
        - |
          The middle positions are similar across groups, but that comparison does not describe recency, which concerns the end of the list.
      answer: 2
    - slug: appsych-u02-w10-q02
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 4.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team read a list of 12 unrelated words aloud to 60 volunteers. Half were randomly assigned to write down all the words they remembered immediately; the other half first counted backward by threes for 30 seconds and then wrote down the words. The table shows the percentage of each group recalling the words in each part of the list.

        | List positions | Immediate recall (%) | Recall after 30-second delay (%) |
        |---|---|---|
        | 1–3 | 70 | 66 |
        | 4–9 | 32 | 30 |
        | 10–12 | 78 | 35 |
      prompt: |
        Which explanation best accounts for the drop in recall of positions 10–12 after the delay?
      options:
        - "The last words had received the most rehearsal, so the delay strengthened them."
        - "Counting backward caused the first words to be forgotten."
        - "The delay group had poorer memories, since they were chosen differently."
        - "The last words were still in short-term memory, and counting backward displaced them before they could be recalled."
      option_explanations:
        - |
          The last words received the least rehearsal, and their recall dropped rather than strengthened.
        - |
          Recall of the first words barely changed (70% to 66%), so the delay did not cause them to be forgotten.
        - |
          Participants were randomly assigned, so the groups should be similar in memory ability; differences in selection cannot explain the drop.
        - |
          Correct. Recency depends on items still being in short-term memory; the counting task displaced them, so recall fell from 78% to 35%.
      answer: 3
    - slug: appsych-u02-w10-q03
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team read a list of 12 unrelated words aloud to 60 volunteers. Half were randomly assigned to write down all the words they remembered immediately; the other half first counted backward by threes for 30 seconds and then wrote down the words. The table shows the percentage of each group recalling the words in each part of the list.

        | List positions | Immediate recall (%) | Recall after 30-second delay (%) |
        |---|---|---|
        | 1–3 | 70 | 66 |
        | 4–9 | 32 | 30 |
        | 10–12 | 78 | 35 |
      prompt: |
        Why did recall of positions 1–3 stay high in both groups?
      options:
        - "The first words received more rehearsal and reached long-term memory, so a short delay did not erase them."
        - "The first words were still in sensory memory at the time of recall."
        - "Counting backward is a mnemonic that strengthens early items."
        - "The first words were processed automatically, without attention."
      option_explanations:
        - |
          Correct. The primacy effect reflects extra rehearsal of early items, which moves them into long-term memory, where a 30-second delay has little effect.
        - |
          Sensory memory lasts at most a few seconds, so it could not hold the first words through the whole list and a delay.
        - |
          Counting backward is a distractor task that blocks rehearsal; it is not a mnemonic and does not strengthen any items.
        - |
          Listening to and remembering a word list takes attention and effort; the advantage of early items comes from rehearsal.
      answer: 0
    - slug: appsych-u02-w10-q04
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 2.A"
      points: 1
      stimulus: |
        A hypothetical study, invented for this course. A research team read a list of 12 unrelated words aloud to 60 volunteers. Half were randomly assigned to write down all the words they remembered immediately; the other half first counted backward by threes for 30 seconds and then wrote down the words. The table shows the percentage of each group recalling the words in each part of the list.

        | List positions | Immediate recall (%) | Recall after 30-second delay (%) |
        |---|---|---|
        | 1–3 | 70 | 66 |
        | 4–9 | 32 | 30 |
        | 10–12 | 78 | 35 |
      prompt: |
        What is the independent variable in this study?
      options:
        - "The percentage of words recalled"
        - "Whether recall was immediate or followed a 30-second counting delay"
        - "The 12 words on the list"
        - "The number of volunteers in each group"
      option_explanations:
        - |
          The percentage recalled is what was measured, the dependent variable.
        - |
          Correct. The researchers manipulated the timing of recall by randomly assigning volunteers to immediate or delayed recall.
        - |
          The words were the same for everyone, so the list is a controlled feature of the study, not a manipulated variable.
        - |
          Group size is a design feature, not a variable whose effect on recall was tested.
      answer: 1
    # ---- Independent items on 2.4
    - slug: appsych-u02-w10-q05
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 1
      prompt: |
        Without trying to, Marcus remembers that the answer to a test question was in the top left corner of a textbook page. This illustrates
      options:
        - "elaborative rehearsal"
        - "the method of loci"
        - "automatic processing of spatial information"
        - "the self-reference effect"
      option_explanations:
        - |
          Elaborative rehearsal is a deliberate effort to connect information with meaning; Marcus did not try to remember the location.
        - |
          The method of loci is a deliberate mnemonic using imagined locations along a route, not unintentional memory for where text appeared.
        - |
          Correct. Information about space, time and frequency is encoded automatically, without conscious effort.
        - |
          The self-reference effect is better memory for information related to oneself; the page location has no link to his self-concept.
      answer: 2
    - slug: appsych-u02-w10-q06
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 1
      prompt: |
        To remember a grocery list, Ava imagines a carton of eggs on her front porch, bread in her hallway and apples on her couch, then mentally walks through her house at the store. She is using
      options:
        - "chunking"
        - "an acronym"
        - "massed practice"
        - "the method of loci"
      option_explanations:
        - |
          Chunking groups items into larger units; Ava is placing each item at a separate imagined location.
        - |
          An acronym is a word made from first letters; Ava is using imagined places, not letters.
        - |
          Massed practice is cramming study into one session; it is not a technique for linking items to places.
        - |
          Correct. Placing items at locations along a familiar route and mentally walking it is the method of loci.
      answer: 3
    - slug: appsych-u02-w10-q07
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 1
      prompt: |
        A student remembers the credit card number 4417 2290 3385 1106 by reading it as four groups of four digits. This is an example of
      options:
        - "chunking"
        - "the recency effect"
        - "automatic processing"
        - "maintenance rehearsal alone"
      option_explanations:
        - |
          Correct. Organizing 16 digits into four units of four makes the number fit the limited capacity of short-term memory.
        - |
          The recency effect is better memory for the last items of a list, not a grouping strategy.
        - |
          Grouping the digits is a deliberate strategy, so it is effortful rather than automatic.
        - |
          Simple repetition is maintenance rehearsal; the key feature here is grouping the digits into units.
      answer: 0
    - slug: appsych-u02-w10-q08
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 1
      prompt: |
        Jada has eight hours to prepare for a psychology exam in two weeks. Based on the spacing effect, which plan is best?
      options:
        - "Studying for eight hours the day before the exam"
        - "Studying for about an hour on eight different days over the two weeks"
        - "Studying for four hours on each of the two days before the exam"
        - "Rereading the textbook once, the night before"
      option_explanations:
        - |
          One long session is massed practice (cramming), which produces poorer long-term retention than spaced study.
        - |
          Correct. Distributing the same total study time across many sessions takes advantage of the spacing effect.
        - |
          Two long back-to-back sessions are still largely massed, with little spacing between them.
        - |
          A single reread is both massed and shallow, the weakest combination for long-term memory.
      answer: 1
    - slug: appsych-u02-w10-q09
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 1
      prompt: |
        Students who rated whether each adjective on a list described themselves later recalled more of the adjectives than students who rated whether each word was long or short. Which concept explains this?
      options:
        - "The primacy effect"
        - "Visual encoding"
        - "The self-reference effect"
        - "Chunking"
      option_explanations:
        - |
          The primacy effect concerns the position of items in a list, not the kind of judgment made about them.
        - |
          Judging word length is closer to visual or structural encoding, which produced the weaker memory here.
        - |
          Correct. Relating information to oneself produces especially deep, well-connected encoding.
        - |
          Chunking groups items into units; the students were not grouping words, but judging them.
      answer: 2
    - slug: appsych-u02-w10-q10
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 1
      prompt: |
        Which is the best example of elaborative rehearsal?
      options:
        - "Saying a new word over and over until the bell rings"
        - "Explaining how a new vocabulary word relates to something that happened to you"
        - "Writing a definition ten times"
        - "Highlighting every sentence in a chapter"
      option_explanations:
        - |
          Repeating a word is maintenance rehearsal: it keeps information active but adds no meaning.
        - |
          Correct. Connecting the word to personal experience links it to existing knowledge, which is elaborative rehearsal.
        - |
          Copying a definition repeatedly is still repetition, not elaboration of its meaning.
        - |
          Highlighting everything involves little thought about meaning and is a shallow strategy.
      answer: 1
    # ---- Spiral review: 2.2, 2.3 and Unit 1
    - slug: appsych-u02-w10-q11
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A student stays up all night cramming for a test. Based on research on sleep and memory, what is the strongest argument against this plan?
      options:
        - "Sleep has no effect on memory, so the plan is fine."
        - "The student will experience REM rebound during the test."
        - "Staying awake increases the recency effect."
        - "Sleep, including REM and deep sleep, helps consolidate new memories, and an all-nighter also eliminates spacing."
      option_explanations:
        - |
          Research consistently links sleep after learning to better memory consolidation, so the claim is false.
        - |
          REM rebound happens during later sleep after deprivation, not while taking a test, and it does not address memory directly.
        - |
          Staying awake does not strengthen the recency effect; it disrupts the consolidation that sleep provides.
        - |
          Correct. Sleep helps stabilize new memories, and cramming in one session gives up the benefits of distributed practice.
      answer: 3
    - slug: appsych-u02-w10-q12
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Which component of the working memory model is most involved when you silently repeat a list of vocabulary words?
      options:
        - "The phonological loop"
        - "The visuospatial sketchpad"
        - "The amygdala"
        - "Iconic memory"
      option_explanations:
        - |
          Correct. The phonological loop holds and rehearses speech-based information, the "inner voice" repeating words.
        - |
          The visuospatial sketchpad handles images and spatial layouts, not silent verbal rehearsal.
        - |
          The amygdala is a brain structure involved in emotion, not a component of the working memory model.
        - |
          Iconic memory is a brief visual sensory store, not part of the working memory model.
      answer: 0
    - slug: appsych-u02-w10-q13
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A student keeps using flashcards for every subject because they worked in Spanish, even for math problems where working examples would help more. This best illustrates
      options:
        - "functional fixedness"
        - "the availability heuristic"
        - "mental set"
        - "the gambler's fallacy"
      option_explanations:
        - |
          Functional fixedness concerns seeing an object only in its usual use; the problem here is sticking with a strategy.
        - |
          Availability involves judging likelihood by ease of recall, not continuing a familiar strategy.
        - |
          Correct. Persisting with an approach that worked before, even when another would work better, is mental set.
        - |
          The gambler's fallacy is a mistaken belief about random sequences and does not apply to choosing a study method.
      answer: 2
    - slug: appsych-u02-w10-q14
      type: multi_select
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are mnemonic devices? Select all that apply.
      options:
        - "Remembering the planets with the sentence 'My Very Eager Mother Just Served Us Nachos'"
        - "Grouping a 10-digit phone number into 3-3-4"
        - "Rereading notes several times"
        - "Imagining each item on a list at a spot along your route to school"
        - "Studying the night before the test"
      option_explanations:
        - |
          Correct. An acrostic sentence built from first letters is a verbal mnemonic.
        - |
          Correct. Chunking organizes information into memorable units and is a mnemonic strategy.
        - |
          Rereading is a shallow, repetitive strategy, not a device that organizes or images the information.
        - |
          Correct. Placing items along a familiar route is the method of loci.
        - |
          Studying the night before describes a schedule (massed practice), not a memory aid.
      answer: [0, 1, 3]
    - slug: appsych-u02-w10-q15
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.B (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        A researcher compares two study methods by letting students choose which one to use, then comparing their test scores. Which statements about this design are accurate? Select all that apply.
      options:
        - "Students who chose each method may differ in motivation, a possible confounding variable."
        - "It is a true experiment, because two methods are compared."
        - "Randomly assigning students to the methods would make a causal conclusion more justified."
        - "Self-selection guarantees that the groups are equivalent."
        - "The study can still show whether method and scores are associated."
      option_explanations:
        - |
          Correct. Students choose for reasons, such as motivation, that may also affect scores, which confounds the comparison.
        - |
          Without random assignment to conditions, it is a quasi-experiment or correlational comparison, not a true experiment.
        - |
          Correct. Random assignment would balance motivation and other differences across groups, supporting a cause-and-effect conclusion.
        - |
          Self-selection tends to produce non-equivalent groups, because people choose for reasons related to the outcome.
        - |
          Correct. The design can show a relationship between method and scores, even though it cannot establish cause.
      answer: [0, 2, 4]
    - slug: appsych-u02-w10-q16
      type: true_false
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 1
      prompt: |
        True or false: The spacing effect occurs only because students in the spaced condition spend more total time studying.
      answer: false
      explanation: |
        False. The spacing effect appears even when total study time is held equal: the same number of minutes spread over several sessions produces better long-term retention than one massed session.
    - slug: appsych-u02-w10-q17
      type: true_false
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: The sympathetic nervous system, which arouses the body in stressful situations, is part of the autonomic nervous system.
      answer: true
      explanation: |
        True. The autonomic nervous system has a sympathetic division (arousing, "fight or flight") and a parasympathetic division (calming), both controlling involuntary functions.
    - slug: appsych-u02-w10-q18
      type: fill_blank
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 1
      prompt: |
        Better recall of the first items in a list is called the ____ effect.
      answer: ["primacy"]
      explanation: |
        The primacy effect reflects the extra rehearsal early items receive, which moves them into long-term memory.
    - slug: appsych-u02-w10-q19
      type: fill_blank
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 1
      prompt: |
        Organizing items into familiar, manageable units, such as grouping letters into "FBI" and "USA", is called ____.
      answer: ["chunking", "chunk"]
      explanation: |
        Chunking lets short-term memory hold more information by making each of its few units carry more.
    - slug: appsych-u02-w10-q20
      type: short_answer
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skill 1.A"
      points: 3
      prompt: |
        Diego must learn the 12 cranial nerves for an anatomy test in three weeks.

        (a) Describe a mnemonic device he could use and explain why it helps.
        (b) Explain how he could use the spacing effect.
        (c) Explain how the self-reference effect could help him learn what each nerve does.
      answer: |
        (a) An acrostic using the first letter of each nerve in order; it chunks 12 items into one memorable sentence and gives a retrieval cue for each.
        (b) Study in short sessions spread over the three weeks rather than cramming the night before, which improves long-term retention.
        (c) Relate each nerve's job to his own experience (for example, the olfactory nerve and his favorite smell), creating deep, personal connections.
      explanation: |
        Three points, one per part. (a) a named mnemonic applied to the nerves, with a reason it aids encoding or retrieval. (b) distributed practice over the three weeks. (c) linking each nerve's function to himself.
    - slug: appsych-u02-w10-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 3.A (spiral review)"
      points: 3
      prompt: |
        On a vocabulary quiz, seven students scored 6, 8, 8, 9, 10, 14 and 15.

        (a) Calculate the mean, the median and the mode.
        (b) Calculate the range.
        (c) Explain which measure of central tendency best represents a typical score, and why.
      answer: |
        (a) Mean = 70 ÷ 7 = 10. Median = 9 (the fourth of seven ordered scores). Mode = 8.
        (b) Range = 15 − 6 = 9.
        (c) The median (9), because the two high scores pull the mean up slightly; the median is resistant to extreme values. (A defense of the mean, since the scores are not far from symmetric, also earns the point if justified.)
      explanation: |
        Three points. (a) 1 point for all three measures correct. (b) 1 point for 9. (c) 1 point for a choice justified by the distribution's shape or resistance to extreme scores.
    - slug: appsych-u02-w10-q22
      type: long_answer
      topic_code: "2.4"
      source: "Original item; CED Topic 2.4, Skills 2.A, 2.B, 3.A, 4.B"
      points: 6
      stimulus: |
        A hypothetical study, invented for this course. A research team recruited 90 students from three high schools and randomly assigned them to learn a list of 40 science terms in one of three ways: rereading the definitions (reread), writing an example of each term from their own life (personal example), or grouping the terms into categories (categories). Each group studied for 30 minutes. Two days later, the reread group recalled a mean of 11.2 definitions, the personal example group 22.6, and the categories group 19.4. The standard deviation in each group was about 4. Students gave assent, parents gave consent, and data were stored without names.
      prompt: |
        (A) Identify the research method and explain how you know.
        (B) Explain the result for the personal example group using a concept from encoding.
        (C) Explain the result for the categories group using a different concept from encoding.
        (D) Using the standard deviations, describe how much the reread and personal example groups overlap.
        (E) Identify the ethical guideline shown by storing data without names.
        (F) Explain one reason these results might not generalize to all high school students.
      answer: |
        (A) An experiment: the researchers manipulated the study method and randomly assigned students to it.
        (B) The self-reference effect (or elaborative rehearsal / semantic encoding): relating terms to one's own life creates deep, well-connected memories.
        (C) Organizing into hierarchies or categories (a mnemonic strategy) links each term to related terms, aiding encoding and retrieval.
        (D) The means differ by 11.4 points, nearly three standard deviations, so the groups overlap very little.
        (E) Confidentiality.
        (F) The students came from only three schools and studied science terms for 30 minutes; other schools, subjects or longer delays might show different results.
      explanation: |
        Six points. (A) 1 point: experiment, with manipulation or random assignment as the reason. (B) 1 point: self-reference or elaborative/semantic encoding applied. (C) 1 point: hierarchies, categories or organization applied (must differ from B). (D) 1 point: a difference of several SDs means little overlap. (E) 1 point: confidentiality (anonymity accepted). (F) 1 point: a sample or task limitation linked to generalizing.
