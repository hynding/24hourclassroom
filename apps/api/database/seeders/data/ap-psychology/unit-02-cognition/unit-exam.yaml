unit: 2
description: |
  45 questions · about 90 minutes · every topic of Unit 2 (2.1 to 2.8): perception, thinking and decision
  making, the systems of memory, encoding, storage, retrieval, forgetting and memory distortion, and intelligence
  and its measurement, with research methods and statistics throughout. Includes three shared-context sets (three
  questions on a change-blindness study, four on a study-strategy experiment, three on a set of intelligence
  test scores), select-all, true/false and fill-in-the-blank items, one short-answer question (3 points), and two
  free-response questions in the AP format (7 points each): an Article Analysis Question on an invented
  memory-training experiment and an Evidence-Based Question on how expectations shape cognition. Multiple choice,
  select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the
  short answer and the free-response questions are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a hypothetical change-blindness study (2.1)
  - slug: appsych-u02-exam-q01
    type: multiple_choice
    topic_code: "2.1"
    source: "Original item; CED Topic 2.1, Skill 1.A"
    points: 1
    stimulus: |
      A hypothetical study, invented for this course. A research team had 100 adult volunteers watch a 30-second video of two people talking at a café table. Midway through, the camera angle changed and, in the new shot, one person's scarf changed from red to blue. Volunteers were randomly assigned to one of two instructions: "Watch the conversation" (50 people) or "Watch for anything in the scene that changes" (50 people). Afterward, everyone was asked whether they had noticed anything change.

      | Instruction | Noticed the scarf change | Did not notice |
      |---|---|---|
      | Watch the conversation | 9 | 41 |
      | Watch for changes | 33 | 17 |
    prompt: |
      Most volunteers told to watch the conversation missed the scarf change. Which phenomenon does this show?
    options:
      - "Inattentional blindness to an unexpected object"
      - "Change blindness"
      - "Size constancy"
      - "The phi phenomenon"
    option_explanations:
      - |
        Inattentional blindness is failing to notice an unexpected object or event; here volunteers failed to notice a change between two shots.
      - |
        Correct. Failing to notice that something in a scene changed from one view to the next is change blindness.
      - |
        Size constancy keeps perceived size stable as distance changes; it does not explain missing a color change.
      - |
        The phi phenomenon is apparent motion created by lights flashed in sequence, unrelated to noticing changes.
    answer: 1
  - slug: appsych-u02-exam-q02
    type: multiple_choice
    topic_code: "2.1"
    source: "Original item; CED Topic 2.1, Skill 3.A"
    points: 1
    stimulus: |
      A hypothetical study, invented for this course. A research team had 100 adult volunteers watch a 30-second video of two people talking at a café table. Midway through, the camera angle changed and, in the new shot, one person's scarf changed from red to blue. Volunteers were randomly assigned to one of two instructions: "Watch the conversation" (50 people) or "Watch for anything in the scene that changes" (50 people). Afterward, everyone was asked whether they had noticed anything change.

      | Instruction | Noticed the scarf change | Did not notice |
      |---|---|---|
      | Watch the conversation | 9 | 41 |
      | Watch for changes | 33 | 17 |
    prompt: |
      What percentage of the "watch for changes" group noticed the scarf change?
    options:
      - "33%"
      - "18%"
      - "34%"
      - "66%"
    option_explanations:
      - |
        33 is the count of people who noticed; the percentage divides that count by the 50 people in the group.
      - |
        18% is 9 out of 50, the rate in the "watch the conversation" group.
      - |
        34% is 17 out of 50, the share of the "watch for changes" group who did not notice.
      - |
        Correct. 33 of 50 is 33 ÷ 50 = 0.66, or 66%.
    answer: 3
  - slug: appsych-u02-exam-q03
    type: multiple_choice
    topic_code: "2.1"
    source: "Original item; CED Topic 2.1, Skill 2.B"
    points: 1
    stimulus: |
      A hypothetical study, invented for this course. A research team had 100 adult volunteers watch a 30-second video of two people talking at a café table. Midway through, the camera angle changed and, in the new shot, one person's scarf changed from red to blue. Volunteers were randomly assigned to one of two instructions: "Watch the conversation" (50 people) or "Watch for anything in the scene that changes" (50 people). Afterward, everyone was asked whether they had noticed anything change.

      | Instruction | Noticed the scarf change | Did not notice |
      |---|---|---|
      | Watch the conversation | 9 | 41 |
      | Watch for changes | 33 | 17 |
    prompt: |
      Why can the researchers conclude that the instructions caused the difference in noticing?
    options:
      - "Volunteers were randomly assigned to the two instructions, so the groups should be similar in other respects."
      - "The sample of 100 adults was large."
      - "The video was only 30 seconds long."
      - "More volunteers noticed in one group than in the other."
    option_explanations:
      - |
        Correct. Random assignment balances pre-existing differences such as attentiveness, so the manipulated instruction is the main systematic difference between groups.
      - |
        Sample size affects how precisely a difference is estimated, but without random assignment a large sample still cannot rule out confounds.
      - |
        The length of the video was the same for everyone and is a controlled feature; it does not by itself justify a causal conclusion.
      - |
        A difference between groups shows that the groups differ, but only random assignment lets that difference be attributed to the instructions.
    answer: 0
  # ---- Perception (2.1)
  - slug: appsych-u02-exam-q04
    type: multiple_choice
    topic_code: "2.1"
    source: "Original item; CED Topic 2.1, Skill 1.A"
    points: 1
    prompt: |
      In a painting, a road narrows as it stretches toward the horizon, and the trees beside it look smaller and hazier. Which pair of depth cues is the painter using?
    options:
      - "Retinal disparity and convergence"
      - "Interposition and texture gradient"
      - "Linear perspective and relative clarity"
      - "Convergence and relative size"
    option_explanations:
      - |
        Both are binocular cues that depend on two eyes looking at a real scene; a flat painting cannot use them.
      - |
        No object is described as blocking another, so interposition is not the cue at work here.
      - |
        Correct. The narrowing road shows linear perspective, and the hazier distant trees show relative clarity (their smaller size adds relative size).
      - |
        Convergence is binocular and cannot be produced by a painting, though relative size is present.
    answer: 2
  - slug: appsych-u02-exam-q05
    type: multiple_choice
    topic_code: "2.1"
    source: "Original item; CED Topic 2.1, Skill 1.A"
    points: 1
    prompt: |
      A new student who has been told that the school's principal is strict interprets the principal's neutral expression as a frown. This best illustrates
    options:
      - "perceptual set"
      - "bottom-up processing"
      - "shape constancy"
      - "the cocktail party effect"
    option_explanations:
      - |
        Correct. An expectation created by what the student was told prepared them to perceive the expression a certain way.
      - |
        Bottom-up processing builds perception from sensory features; here prior information shaped the interpretation.
      - |
        Shape constancy keeps an object's perceived shape stable as viewing angle changes, not the reading of a facial expression.
      - |
        The cocktail party effect is noticing a personally meaningful sound, such as one's name, in a noisy setting.
    answer: 0
  - slug: appsych-u02-exam-q06
    type: multiple_choice
    topic_code: "2.1"
    source: "Original item; CED Topic 2.1, Skill 1.A"
    points: 1
    prompt: |
      A row of street lights flashes on and off in sequence, and drivers see a single light racing down the street. This is an example of
    options:
      - "closure"
      - "retinal disparity"
      - "color constancy"
      - "the phi phenomenon"
    option_explanations:
      - |
        Closure is filling in gaps to see a complete shape, not perceiving motion from sequential lights.
      - |
        Retinal disparity is a binocular depth cue; it does not create the impression of movement.
      - |
        Color constancy keeps perceived color stable under different lighting, unrelated to apparent motion.
      - |
        Correct. Lights flashed in quick succession are perceived as one moving light: the phi phenomenon, a form of apparent movement.
    answer: 3
  # ---- Thinking (2.2)
  - slug: appsych-u02-exam-q07
    type: multiple_choice
    topic_code: "2.2"
    source: "Original item; CED Topic 2.2, Skill 1.A"
    points: 1
    prompt: |
      After hearing about two friends who were in car accidents, Mateo overestimates how often teenagers crash. Which concept best explains his judgment?
    options:
      - "Representativeness heuristic"
      - "Availability heuristic"
      - "Functional fixedness"
      - "Convergent thinking"
    option_explanations:
      - |
        Representativeness judges likelihood by similarity to a prototype; Mateo's estimate is driven by how easily examples come to mind.
      - |
        Correct. Vivid, recent examples are easy to recall, so he judges crashes as more common than they are.
      - |
        Functional fixedness is thinking of objects only in their usual use, not estimating frequencies.
      - |
        Convergent thinking narrows options to one best answer; it does not explain an inflated frequency estimate.
    answer: 1
  - slug: appsych-u02-exam-q08
    type: multiple_choice
    topic_code: "2.2"
    source: "Original item; CED Topic 2.2, Skill 1.A"
    points: 1
    prompt: |
      A student calls a whale a fish because it lives in the ocean and swims. When her teacher explains that whales are mammals, she creates a new category for sea mammals. Creating the new category is an example of
    options:
      - "assimilation"
      - "the sunk-cost fallacy"
      - "accommodation"
      - "priming"
    option_explanations:
      - |
        Assimilation was her first step, fitting the whale into her existing fish schema; changing the schema is something else.
      - |
        The sunk-cost fallacy is continuing an investment because of past costs, unrelated to revising a category.
      - |
        Correct. Changing an existing schema, or creating a new one, to fit information that does not fit is accommodation.
      - |
        Priming is earlier exposure making related ideas more accessible; it does not describe revising a schema.
    answer: 2
  - slug: appsych-u02-exam-q09
    type: multiple_choice
    topic_code: "2.2"
    source: "Original item; CED Topic 2.2, Skill 1.A"
    points: 1
    prompt: |
      A hiring manager decides that an applicant who wears glasses and quotes poetry must be a librarian rather than a salesperson, though there are many more salespeople in the applicant pool. The manager is relying on
    options:
      - "an algorithm"
      - "mental set"
      - "the representativeness heuristic"
      - "the gambler's fallacy"
    option_explanations:
      - |
        An algorithm is a step-by-step procedure that guarantees a solution; the manager is using a quick judgment based on resemblance.
      - |
        Mental set is reusing a previously successful strategy, not judging by how well someone fits a stereotype.
      - |
        Correct. Judging by resemblance to a prototype while ignoring base rates (many more salespeople) is the representativeness heuristic.
      - |
        The gambler's fallacy concerns beliefs about random sequences, not judging a person's occupation.
    answer: 2
  - slug: appsych-u02-exam-q10
    type: multiple_choice
    topic_code: "2.2"
    source: "Original item; CED Topic 2.2, Skill 1.A"
    points: 1
    prompt: |
      Shoppers are more likely to buy yogurt labeled "90% fat-free" than the same yogurt labeled "contains 10% fat". This is an example of
    options:
      - "framing"
      - "confirmation bias"
      - "belief perseverance"
      - "insight"
    option_explanations:
      - |
        Correct. The same information presented in a positive versus a negative way changes the decision, which is framing.
      - |
        Confirmation bias is seeking evidence that supports existing beliefs, not reacting differently to wording.
      - |
        Belief perseverance is clinging to a belief after its evidence is discredited, which is not described here.
      - |
        Insight is a sudden realization of a problem's solution, unrelated to how a label is worded.
    answer: 0
  # ---- Stimulus set B: a hypothetical study-strategy experiment (2.4, 2.6, 2.7)
  - slug: appsych-u02-exam-q11
    type: multiple_choice
    topic_code: "2.6"
    source: "Original item; CED Topic 2.6, Skill 2.A"
    points: 1
    stimulus: |
      A hypothetical study, invented for this course. A research team randomly assigned 240 college students to learn 40 vocabulary words in a new language using one of two methods: restudying the word pairs four times, or studying them once and then testing themselves three times. Each method took 20 minutes. Within each method group, students were randomly assigned to take a final test either 5 minutes or 1 week after learning (60 students per combination).

      | Method | Mean correct after 5 minutes (of 40) | Mean correct after 1 week (of 40) |
      |---|---|---|
      | Restudy | 31 | 14 |
      | Self-testing | 28 | 24 |
    prompt: |
      How many independent variables does this study have?
    options:
      - "One: the learning method"
      - "One: the number of words correct"
      - "Three: the method, the delay and the number correct"
      - "Two: the learning method and the delay before the final test"
    option_explanations:
      - |
        The delay before the final test was also manipulated by random assignment, so it is a second independent variable.
      - |
        The number of words correct is what was measured, the dependent variable, not an independent variable.
      - |
        The number correct is the dependent variable, so only two of these three are independent variables.
      - |
        Correct. The researchers manipulated both the learning method and the delay before testing; words correct is the dependent variable.
    answer: 3
  - slug: appsych-u02-exam-q12
    type: multiple_choice
    topic_code: "2.6"
    source: "Original item; CED Topic 2.6, Skill 3.A"
    points: 1
    stimulus: |
      A hypothetical study, invented for this course. A research team randomly assigned 240 college students to learn 40 vocabulary words in a new language using one of two methods: restudying the word pairs four times, or studying them once and then testing themselves three times. Each method took 20 minutes. Within each method group, students were randomly assigned to take a final test either 5 minutes or 1 week after learning (60 students per combination).

      | Method | Mean correct after 5 minutes (of 40) | Mean correct after 1 week (of 40) |
      |---|---|---|
      | Restudy | 31 | 14 |
      | Self-testing | 28 | 24 |
    prompt: |
      Which conclusion is best supported by the data?
    options:
      - "Restudying is the better method at every delay."
      - "Self-testing produced better retention after a week, even though restudying did slightly better after 5 minutes."
      - "Delay had no effect on either method."
      - "Self-testing helps only when the test is immediate."
    option_explanations:
      - |
        Restudy did better only after 5 minutes (31 against 28); after a week it was far worse (14 against 24).
      - |
        Correct. The testing effect shows up over time: self-testing students kept 24 words after a week, against 14 for restudying.
      - |
        Both methods lost words over the week, restudy much more steeply (31 to 14) than self-testing (28 to 24).
      - |
        Self-testing's advantage appears after the delay, not on the immediate test, so this reverses the pattern.
    answer: 1
  - slug: appsych-u02-exam-q13
    type: multiple_choice
    topic_code: "2.7"
    source: "Original item; CED Topic 2.7, Skill 3.A"
    points: 1
    stimulus: |
      A hypothetical study, invented for this course. A research team randomly assigned 240 college students to learn 40 vocabulary words in a new language using one of two methods: restudying the word pairs four times, or studying them once and then testing themselves three times. Each method took 20 minutes. Within each method group, students were randomly assigned to take a final test either 5 minutes or 1 week after learning (60 students per combination).

      | Method | Mean correct after 5 minutes (of 40) | Mean correct after 1 week (of 40) |
      |---|---|---|
      | Restudy | 31 | 14 |
      | Self-testing | 28 | 24 |
    prompt: |
      The steep drop in the restudy group's scores over the week is most consistent with
    options:
      - "the forgetting curve, which shows rapid loss soon after learning"
      - "infantile amnesia"
      - "the recency effect"
      - "superior autobiographical memory"
    option_explanations:
      - |
        Correct. Ebbinghaus's forgetting curve shows that much of what is learned is lost soon after learning, as the restudy group's scores show.
      - |
        Infantile amnesia concerns memories from the first years of life, not college students' vocabulary learning.
      - |
        The recency effect concerns the last items in a list being recalled best on an immediate test, not loss over a week.
      - |
        Superior autobiographical memory is a rare ability to recall one's own life, unrelated to forgetting vocabulary.
    answer: 0
  - slug: appsych-u02-exam-q14
    type: multiple_choice
    topic_code: "2.4"
    source: "Original item; CED Topic 2.4, Skill 2.B"
    points: 1
    stimulus: |
      A hypothetical study, invented for this course. A research team randomly assigned 240 college students to learn 40 vocabulary words in a new language using one of two methods: restudying the word pairs four times, or studying them once and then testing themselves three times. Each method took 20 minutes. Within each method group, students were randomly assigned to take a final test either 5 minutes or 1 week after learning (60 students per combination).

      | Method | Mean correct after 5 minutes (of 40) | Mean correct after 1 week (of 40) |
      |---|---|---|
      | Restudy | 31 | 14 |
      | Self-testing | 28 | 24 |
    prompt: |
      Why was it important that each method took 20 minutes?
    options:
      - "To make the sample representative of college students"
      - "To protect participants' confidentiality"
      - "So that total study time could not explain differences between methods"
      - "So that the delay became the only dependent variable"
    option_explanations:
      - |
        How long each method took has nothing to do with who was sampled; representativeness depends on how participants were selected.
      - |
        Confidentiality concerns protecting participants' data, not the length of the learning session.
      - |
        Correct. Holding time constant removes a possible confound: if one method took longer, extra time rather than the method could explain the results.
      - |
        The delay is an independent variable, and equal timing does not change what is measured.
    answer: 2
  # ---- Memory systems (2.3)
  - slug: appsych-u02-exam-q15
    type: multiple_choice
    topic_code: "2.3"
    source: "Original item; CED Topic 2.3, Skill 1.A"
    points: 1
    prompt: |
      Which is an example of semantic memory?
    options:
      - "Remembering your eighth-grade graduation"
      - "Knowing how to ride a skateboard"
      - "Remembering to call the dentist tomorrow"
      - "Knowing that the hippocampus helps form new memories"
    option_explanations:
      - |
        A personal event with a time and place is episodic memory.
      - |
        A motor skill is procedural memory, an implicit memory.
      - |
        Remembering to do something in the future is prospective memory.
      - |
        Correct. General factual knowledge, separate from when it was learned, is semantic memory.
    answer: 3
  - slug: appsych-u02-exam-q16
    type: multiple_choice
    topic_code: "2.3"
    source: "Original item; CED Topic 2.3, Skill 1.A"
    points: 1
    prompt: |
      According to the levels-of-processing model, which question about the word "lemon" would lead to the best later recall?
    options:
      - "Is it written in capital letters?"
      - "Is it something you could use to make a drink?"
      - "Does it rhyme with 'demon'?"
      - "How many letters does it have?"
    option_explanations:
      - |
        Noticing letter case is structural, the shallowest level of processing, which produces the weakest recall.
      - |
        Correct. Thinking about meaning is semantic (deep) processing, which produces the best recall.
      - |
        Noticing a rhyme is phonemic, an intermediate level of processing, better than structural but weaker than semantic.
      - |
        Counting letters is structural processing of the word's appearance, a shallow level.
    answer: 1
  - slug: appsych-u02-exam-q17
    type: multiple_choice
    topic_code: "2.3"
    source: "Original item; CED Topic 2.3, Skill 1.A"
    points: 1
    prompt: |
      A man with damage to his cerebellum can still describe last weekend's trip but has trouble learning to respond to a tone with a conditioned eyeblink. This pattern suggests that
    options:
      - "the cerebellum is needed for all explicit memories"
      - "the cerebellum supports some implicit memories, such as conditioned reflexes"
      - "the hippocampus stores all classically conditioned responses"
      - "the cerebellum controls prospective memory"
    option_explanations:
      - |
        He can still describe a recent trip, so explicit memory is intact; the cerebellum is not needed for all explicit memories.
      - |
        Correct. The cerebellum supports implicit memories for timed motor responses and conditioned reflexes, which is what he has lost.
      - |
        Conditioned reflexes such as eyeblinks depend largely on the cerebellum, not the hippocampus.
      - |
        Prospective memory depends mainly on the frontal lobes, and the man's problem concerns conditioning.
    answer: 1
  # ---- Encoding (2.4)
  - slug: appsych-u02-exam-q18
    type: multiple_choice
    topic_code: "2.4"
    source: "Original item; CED Topic 2.4, Skill 1.A"
    points: 1
    prompt: |
      Without trying to memorize it, Ellie knows that she has had soccer practice three times this week. This is an example of
    options:
      - "automatic processing of frequency"
      - "elaborative rehearsal"
      - "the method of loci"
      - "chunking"
    option_explanations:
      - |
        Correct. Information about how often things happen is encoded automatically, without effort.
      - |
        Elaborative rehearsal is a deliberate effort to link information to meaning; Ellie made no effort.
      - |
        The method of loci is a deliberate mnemonic using imagined locations, not unintentional memory for frequency.
      - |
        Chunking is grouping items into units; Ellie's knowledge of the count came without any grouping strategy.
    answer: 0
  - slug: appsych-u02-exam-q19
    type: multiple_choice
    topic_code: "2.4"
    source: "Original item; CED Topic 2.4, Skill 1.A"
    points: 1
    prompt: |
      A teacher reads a list of 15 words, and students immediately write as many as they can. Which words are students most likely to remember?
    options:
      - "Only the words in the middle of the list"
      - "Only the first word"
      - "All words equally"
      - "The first few and the last few words"
    option_explanations:
      - |
        Middle items are usually recalled worst, because they get less rehearsal than early items and are no longer in short-term memory like late ones.
      - |
        The first words are recalled well (primacy), but on an immediate test the last words are recalled well too (recency).
      - |
        Recall follows a U-shaped serial position curve, not a flat line.
      - |
        Correct. The serial position effect produces better recall of early items (primacy) and late items (recency).
    answer: 3
  - slug: appsych-u02-exam-q20
    type: multiple_choice
    topic_code: "2.4"
    source: "Original item; CED Topic 2.4, Skill 1.A"
    points: 1
    prompt: |
      To learn the order of the planets, Kenji imagines each planet sitting on a piece of furniture along his walk from the front door to his bedroom. He is using
    options:
      - "maintenance rehearsal"
      - "an acronym"
      - "the method of loci"
      - "massed practice"
    option_explanations:
      - |
        Maintenance rehearsal is simple repetition; Kenji is linking items to imagined places.
      - |
        An acronym forms a word from first letters; Kenji uses locations, not letters.
      - |
        Correct. Placing items at locations along a familiar route and mentally walking it is the method of loci.
      - |
        Massed practice describes cramming study into one session, not a technique for linking items to places.
    answer: 2
  # ---- Storage (2.5)
  - slug: appsych-u02-exam-q21
    type: multiple_choice
    topic_code: "2.5"
    source: "Original item; CED Topic 2.5, Skill 1.A"
    points: 1
    prompt: |
      After a stroke damages her hippocampus, a woman remembers her childhood clearly but cannot remember the nurse she met an hour ago. She has
    options:
      - "retrograde amnesia"
      - "infantile amnesia"
      - "anterograde amnesia"
      - "source amnesia"
    option_explanations:
      - |
        Retrograde amnesia is loss of memories from before the damage, but her childhood memories are intact.
      - |
        Infantile amnesia is the normal loss of memories from the first years of life, not a result of a stroke.
      - |
        Correct. Being unable to form new long-term memories after brain damage is anterograde amnesia.
      - |
        Source amnesia is misattributing where information came from, not an inability to form new memories.
    answer: 2
  - slug: appsych-u02-exam-q22
    type: multiple_choice
    topic_code: "2.5"
    source: "Original item; CED Topic 2.5, Skill 1.A"
    points: 1
    prompt: |
      Which process is considered a neural basis of learning and memory?
    options:
      - "Reuptake of all neurotransmitters"
      - "Long-term potentiation"
      - "The refractory period"
      - "Sensory adaptation"
    option_explanations:
      - |
        Reuptake clears neurotransmitter from the synapse after each signal; it is not the lasting change thought to store memories.
      - |
        Correct. Long-term potentiation, a lasting increase in synaptic efficiency after repeated stimulation, is a likely neural basis of memory.
      - |
        The refractory period is a brief recovery time after a neuron fires, not a lasting change that stores learning.
      - |
        Sensory adaptation is reduced sensitivity to a constant stimulus, not the storage of memories.
    answer: 1
  # ---- Retrieval (2.6)
  - slug: appsych-u02-exam-q23
    type: multiple_choice
    topic_code: "2.6"
    source: "Original item; CED Topic 2.6, Skill 1.A"
    points: 1
    prompt: |
      A student who studied while calm forgets much of the material when she is very anxious during the test, and remembers it again once she calms down. This illustrates
    options:
      - "state-dependent memory"
      - "context-dependent memory"
      - "proactive interference"
      - "the serial position effect"
    option_explanations:
      - |
        Correct. Retrieval is best when the internal state at testing matches the internal state at learning.
      - |
        Context-dependent memory concerns the external setting, not an internal state such as anxiety.
      - |
        Proactive interference is old learning disrupting new learning, not a change in internal state at retrieval.
      - |
        The serial position effect concerns where items appear in a list, not the learner's emotional state.
    answer: 0
  - slug: appsych-u02-exam-q24
    type: multiple_choice
    topic_code: "2.6"
    source: "Original item; CED Topic 2.6, Skill 1.A"
    points: 1
    prompt: |
      Why is a multiple-choice question usually easier than a fill-in-the-blank question on the same fact?
    options:
      - "Multiple-choice questions measure procedural memory."
      - "Fill-in questions use sensory memory."
      - "Multiple-choice questions involve no retrieval at all."
      - "Multiple-choice questions require recognition, and the options act as retrieval cues."
    option_explanations:
      - |
        Answering factual questions uses explicit memory, not procedural memory for skills.
      - |
        Fill-in questions draw on long-term memory; sensory memory lasts only seconds.
      - |
        Recognition still requires retrieval: comparing the options with stored memories.
      - |
        Correct. Recognizing the right answer among options is easier than recalling it without cues.
    answer: 3
