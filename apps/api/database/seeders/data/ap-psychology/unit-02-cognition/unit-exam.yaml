    points: 1
    prompt: |
      Which situation best illustrates the difference between fluid and crystallized intelligence?
    options:
      - "A child and an adult both score 100 on a test."
      - "A student does better on a test after a good night's sleep."
      - "An older adult knows more vocabulary than a college student but is slower at solving unfamiliar puzzles."
      - "Twins raised apart earn similar scores."
