  - slug: appsych-u02-exam-q43
    type: short_answer
    topic_code: "2.6"
    source: "Original item; CED Topic 2.6, Skill 1.A"
    points: 3
    prompt: |
      Camila is preparing for her AP Psychology exam in six weeks.

      (a) Explain how the spacing effect should shape her study schedule.
      (b) Explain how she could use the testing effect.
      (c) Explain how context-dependent memory might affect her if she studies only in her bedroom.
    answer: |
      (a) She should spread her study across many shorter sessions over the six weeks rather than cramming at the end, because distributed practice produces better long-term retention.
      (b) She should quiz herself (practice questions, flashcards answered before flipping), because retrieving information strengthens memory more than rereading.
      (c) She would be tested in a different setting, without the bedroom's context cues, so recall might be somewhat weaker; studying in varied places reduces this.
    explanation: |
      Three points, one per part. (a) distributed rather than massed practice. (b) self-testing or retrieval practice. (c) mismatch between learning and testing settings reducing retrieval cues.
  # ---- Free response: AAQ
  - slug: appsych-u02-exam-q44
    type: long_answer
    topic_code: "2.4"
    source: "Original item; CED Topics 2.4 and 2.3, Skills 1.A, 2.A, 2.C, 3.A, 4.A, 4.B (AAQ format)"
    points: 7
    stimulus: |
      A hypothetical study, invented for this course and summarized as if it were a published article.

      Researchers recruited 96 adults aged 65 to 80 through advertisements at three community centers in one city. Participants were randomly assigned to one of two four-week programs that met twice a week. In the memory-strategy program, participants learned and practiced the method of loci and chunking. In the comparison program, participants attended lectures on healthy aging for the same amount of time. Before and after the programs, every participant heard a list of 20 common objects and then wrote down as many as they could remember. Memory performance was measured as the number of objects recalled out of 20.

      Results: Before the programs, both groups recalled a mean of about 7 objects. After the programs, the memory-strategy group recalled a mean of 12.4 objects (SD = 3.1) and the comparison group a mean of 7.6 objects (SD = 2.9). The difference between the groups after the programs was statistically significant (p = .002), with a large effect size.

      Ethics: Participants gave written informed consent, were told they could leave the study at any time without losing access to the community center, and their scores were stored under code numbers rather than names. At the end, the comparison group was offered the memory-strategy program.
    prompt: |
      Using the article summary, answer each part.

      (A) Identify the research method used in the study.
      (B) State the operational definition of memory performance.
      (C) Describe what the means and standard deviations after the programs show.
      (D) Identify one ethical guideline applied in the study, and explain how it was applied.
      (E) Explain the extent to which the findings may or may not be generalizable.
      (F) Explain how the findings support or refute the claim that memory strategies can improve recall in older adults, using a psychological concept related to encoding. (2 points)
    answer: |
      (A) An experiment: the program was manipulated and participants were randomly assigned to it.
      (B) The number of objects (out of 20) recalled after hearing the list.
      (C) The strategy group recalled about 4.8 more objects on average (12.4 against 7.6). The SDs (about 3) are similar and smaller than the difference, so the groups overlap only partly; scores within each group varied by about 3 objects.
      (D) Informed consent (written consent before taking part), the right to withdraw (could leave at any time without penalty), or confidentiality (scores stored under code numbers).
      (E) Limited generalizability: participants were volunteers aged 65 to 80 from community centers in one city, who may be more active or motivated than other older adults; the findings may not apply to younger people or to older adults in care settings. Random assignment, however, supports the causal conclusion within this group.
      (F) The findings support the claim: after four weeks, the group trained in the method of loci and chunking recalled substantially more objects than an equal-time comparison group. Chunking organizes items into fewer, meaningful units, and the method of loci links each item to a vivid image in a familiar place, giving deeper encoding and built-in retrieval cues.
    explanation: |
      Seven points.
      (A) 1 point: experiment. "Correlational study", "case study" or "survey" earns nothing.
      (B) 1 point: number of objects recalled out of 20. Restating "memory performance" earns nothing.
      (C) 1 point: an accurate comparison of the means in context; credit also requires correct use of the SDs or an accurate statement about the difference relative to the spread.
      (D) 1 point: a guideline named and linked to the specific procedure in the summary (consent, right to withdraw, confidentiality). Debriefing is accepted only if tied to offering the comparison group the program.
      (E) 1 point: a judgment about generalizability tied to a specific feature of the sample (volunteers, ages 65–80, one city, community centers).
      (F) 2 points: 1 point for stating that the findings support the claim with reference to the results; 1 point for correctly explaining a named encoding concept (method of loci, chunking, mnemonic devices, elaborative or semantic encoding) as the reason recall improved.
  # ---- Free response: EBQ
  - slug: appsych-u02-exam-q45
    type: long_answer
    topic_code: "2.1"
    source: "Original item; CED Topics 2.1, 2.7 and 2.8, Skills 4.A, 4.B, 4.C (EBQ format)"
    points: 7
    stimulus: |
      Three hypothetical studies, invented for this course.

      Source A. A research team randomly assigned 120 college students to read either a news story about a sighting of a rare owl in a local park or a story about the park's new benches. Everyone then looked at the same blurry photograph of a tree in the park and wrote what they saw. Of the owl-story readers, 47% reported seeing a bird in the tree, compared with 12% of the bench-story readers.

      Source B. A research team showed 90 adults a one-minute video of a minor collision in a parking lot. Participants were randomly assigned to be asked either "How fast was the van going when it crashed into the car?" or "How fast was the van going when it touched the car?" A week later, 38% of the "crashed" group and 9% of the "touched" group reported seeing a dented car door, which the video did not show.

      Source C. A research team gave 80 high school students a difficult problem-solving test. Half were randomly told the test "measures natural intelligence and shows differences between groups"; half were told it was "a puzzle task still being developed". Students from a group that is negatively stereotyped about problem-solving ability scored a mean of 11.2 of 25 in the first condition and 15.6 in the second; for other students, the two conditions differed by less than 1 point.
    prompt: |
      Using the sources, develop and justify an argument about how expectations influence cognition.

      (A) Propose a specific and defensible claim based on at least one of the sources that responds to the question.
      (B)(i) Support your claim using at least one piece of specific and relevant evidence from one of the sources.
      (B)(ii) Explain how the evidence from (B)(i) supports your claim, using a psychological concept from the course. (2 points)
      (C)(i) Support your claim using an additional piece of specific and relevant evidence from a different source than the one used in (B)(i).
      (C)(ii) Explain how the evidence from (C)(i) supports your claim, using a different psychological concept from the one used in (B)(ii). (2 points)
    answer: |
      (A) Claim: Expectations created by what people are told can change what they perceive, what they remember, and how well they perform on tests.
      (B)(i) In Source A, 47% of students who read about an owl reported seeing a bird in a blurry photo, compared with 12% of those who read about benches.
      (B)(ii) Perceptual set (top-down processing): the owl story created an expectation that prepared readers to interpret the ambiguous shapes as a bird, so the same image was perceived differently.
      (C)(i) In Source B, 38% of people asked about a van that "crashed into" the car later remembered a dented door that was not shown, compared with 9% of the "touched" group.
      (C)(ii) The misinformation effect (reconstructive memory): the word "crashed" implied a violent collision, and that expectation was woven into the reconstructed memory, adding a detail that never happened. (Source C with stereotype threat is an acceptable alternative for either pair: the expectation that the test would confirm a negative stereotype lowered the stereotyped group's mean from 15.6 to 11.2.)
    explanation: |
      Seven points.
      (A) 1 point: a defensible claim about how expectations influence cognition (perception, memory or performance). A claim that merely restates the question earns nothing.
      (B)(i) 1 point: specific evidence from one source (a named result, such as 47% against 12%), attributed to that source.
      (B)(ii) 2 points: 1 point for correctly naming a relevant concept (perceptual set, top-down processing, misinformation effect, reconstructive memory, stereotype threat); 1 point for explaining how that concept links the evidence to the claim.
      (C)(i) 1 point: specific evidence from a different source.
      (C)(ii) 2 points: 1 point for a different, correctly named concept; 1 point for explaining how it links this evidence to the claim. Using the same concept as in (B)(ii) earns at most 1 of these 2 points.
