  - slug: appsych-u02-exam-q32
    type: multiple_choice
    topic_code: "2.8"
    source: "Original item; CED Topic 2.8, Skill 1.A"
    points: 1
    prompt: |
      Average scores on intelligence tests rose steadily across the twentieth century in many countries. Which explanation is most consistent with this finding?
    options:
      - "Genetic changes in the population over a few generations"
      - "Environmental improvements such as better nutrition and more schooling"
      - "Stereotype threat becoming more common"
      - "Tests becoming less reliable"
    option_explanations:
      - |
        The rise happened too quickly to be explained by genetic change, which takes many generations.
      - |
        Correct. The Flynn effect is usually attributed to environmental changes such as nutrition, education and more complex environments.
      - |
        Stereotype threat lowers performance, so it could not explain rising averages.
      - |
        Less reliable tests would produce inconsistent scores, not a steady rise in averages.
