        Equal scores at different ages say nothing about which kind of intelligence each person relies on.
      - |
        Sleep affecting performance concerns testing conditions, not the distinction between the two kinds of intelligence.
      - |
        Correct. Vocabulary is crystallized intelligence, which holds steady with age; solving new puzzles is fluid intelligence, which tends to decline.
      - |
        Similar scores in twins raised apart bear on heritability, not on fluid versus crystallized intelligence.
