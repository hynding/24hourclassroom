week: 28
unit: 5
title: "Positive Psychology and Well-Being"
topics: ["5.2"]
guide: guides/week-28.md
guide_description: |
  Positive psychology, the scientific study of what helps people and communities flourish: its three pillars
  (positive emotions, positive character and enabling institutions), subjective well-being and how it is
  measured, Fredrickson's broaden-and-build theory, gratitude and kindness research, the six virtues and 24
  character strengths, resilience and protective factors, posttraumatic growth, flow, and why happiness drifts
  back toward a baseline (the adaptation-level phenomenon) and depends on comparison (relative deprivation).
  Worked examples: a student whose good mood broadens his choices and builds friendships, and a hypothetical
  three-group gratitude experiment read from a table of means and standard deviations. Ends with the difference
  between resilience and posttraumatic growth and why correlations about happiness cannot show cause.
flashcards_description: |
  30 cards on positive psychology and its pillars, subjective well-being, broaden-and-build, gratitude and
  kindness, virtues and character strengths, resilience, posttraumatic growth, flow, hedonic adaptation and
  relative deprivation, and how well-being is measured and studied.

flashcards:
  - front: "Positive psychology → definition"
    back: |
      The scientific study of human strengths and of the conditions that help individuals and communities flourish, rather than only of disorders and problems.
    topic_code: "5.2"
  - front: "Positive psychology movement → who launched it and when"
    back: |
      Martin Seligman made it the theme of his year as president of the American Psychological Association (1998), arguing that psychology had focused too narrowly on illness.
    topic_code: "5.2"
  - front: "Three pillars of positive psychology → list"
    back: |
      Positive emotions (well-being, contentment, hope), positive character (strengths and virtues), and positive or enabling institutions (families, schools and communities that foster both).
    topic_code: "5.2"
  - front: "Subjective well-being → definition"
    back: |
      A person's own evaluation of their life: high life satisfaction, frequent positive emotions and infrequent negative emotions. Usually measured by self-report.
    topic_code: "5.2"
  - front: "Life satisfaction scale → what it is"
    back: |
      A short self-report questionnaire, often five items rated agree to disagree, that asks people to judge their life as a whole. A common operational definition of well-being.
    topic_code: "5.2"
  - front: "Experience sampling → how it measures well-being"
    back: |
      Participants are prompted (often by phone) at random moments during the day to report what they are doing and how they feel, reducing reliance on memory.
    topic_code: "5.2"
  - front: "Broaden-and-build theory (Fredrickson) → claim"
    back: |
      Positive emotions broaden our attention and range of thoughts and actions, and over time this builds lasting resources: friendships, skills, resilience.
    topic_code: "5.2"
  - front: "Negative versus positive emotions in broaden-and-build → contrast"
    back: |
      Negative emotions such as fear narrow attention toward a specific threat (useful in danger); positive emotions widen attention and encourage exploration and play.
    topic_code: "5.2"
  - front: "Gratitude → meaning in positive psychology"
    back: |
      Noticing and appreciating the good things in one's life and the people responsible for them. Practices include gratitude lists and letters of thanks.
    topic_code: "5.2"
  - front: "Gratitude-journaling research → typical finding"
    back: |
      In randomized studies, people asked to list things they were grateful for each week reported a more positive outlook than people who listed hassles or neutral events. Effects are usually modest.
    topic_code: "5.2"
  - front: "Prosocial spending research → finding"
    back: |
      People randomly assigned to spend a small sum on someone else reported more happiness that evening than people assigned to spend it on themselves.
    topic_code: "5.2"
  - front: "Character strengths and virtues (Peterson and Seligman) → the six virtues"
    back: |
      Wisdom and knowledge, courage, humanity, justice, temperance, transcendence. Twenty-four character strengths are grouped under them.
    topic_code: "5.2"
  - front: "Virtue of courage → example strengths"
    back: |
      Bravery, perseverance, honesty and zest: strengths of will that help a person act well in the face of opposition or difficulty.
    topic_code: "5.2"
  - front: "Virtue of humanity → example strengths"
    back: |
      Love, kindness and social intelligence: interpersonal strengths of caring for and befriending others.
    topic_code: "5.2"
  - front: "Virtue of temperance → example strengths"
    back: |
      Forgiveness, humility, prudence and self-regulation: strengths that protect against excess.
    topic_code: "5.2"
  - front: "Virtue of transcendence → example strengths"
    back: |
      Appreciation of beauty, gratitude, hope, humor and spirituality: strengths that connect a person to something larger and give meaning.
    topic_code: "5.2"
  - front: "Virtues of wisdom and justice → example strengths"
    back: |
      Wisdom: creativity, curiosity, judgment, love of learning, perspective. Justice: teamwork, fairness, leadership.
    topic_code: "5.2"
  - front: "Signature strengths → meaning"
    back: |
      The few character strengths a person shows most and values as central to who they are. Using them in new ways is a common positive-psychology exercise.
    topic_code: "5.2"
  - front: "Resilience (positive psychology) → definition"
    back: |
      Positive adaptation despite adversity: functioning well, or recovering, after hardship. Common rather than rare, which researchers have called ordinary magic.
    topic_code: "5.2"
  - front: "Protective factors for resilience → examples"
    back: |
      At least one caring, stable adult; close friendships; problem-solving and self-regulation skills; a sense of purpose; supportive schools and communities.
    topic_code: "5.2"
  - front: "Posttraumatic growth (Tedeschi and Calhoun) → definition"
    back: |
      Positive psychological change that some people report after struggling with a highly challenging life event. It comes from the struggle, not from the event itself, and it can coexist with distress.
    topic_code: "5.2"
  - front: "Posttraumatic growth → five areas people report"
    back: |
      Greater appreciation of life, closer relationships, a sense of personal strength, new possibilities in life, and spiritual or existential change.
    topic_code: "5.2"
  - front: "Resilience versus posttraumatic growth → difference"
    back: |
      Resilience is bouncing back to good functioning; posttraumatic growth is changing in ways a person sees as beyond where they were before the struggle.
    topic_code: "5.2"
  - front: "Flow (Csikszentmihalyi) and well-being → definition"
    back: |
      Complete absorption in an activity whose challenge matches one's skill, with focused attention and a lost sense of time; associated with enjoyment and engagement.
    topic_code: "5.2"
  - front: "Adaptation-level phenomenon and happiness → why gains fade"
    back: |
      The tendency to judge new experiences against a neutral level set by recent experience, so the happiness boost from a raise or a new phone fades as it becomes the new normal.
    topic_code: "5.2"
  - front: "Relative deprivation and well-being → the link"
    back: |
      The sense of being worse off than the people we compare ourselves with. Satisfaction depends partly on that comparison, not just on what we have.
    topic_code: "5.2"
  - front: "Income and happiness → general pattern"
    back: |
      More income raises well-being most when it lifts people out of poverty; above that, extra income brings smaller gains, and close relationships predict happiness strongly.
    topic_code: "5.2"
  - front: "Optimism and health → finding"
    back: |
      People with an optimistic explanatory style tend to cope better and report better health. Most studies are correlational, so third variables cannot be ruled out.
    topic_code: "5.2"
  - front: "Positive psychology → a common misunderstanding"
    back: |
      It does not say negative emotions are bad or should be suppressed. Sadness, fear and anger are normal and useful; the field adds the study of strengths alongside the study of problems.
    topic_code: "5.2"
  - front: "Gratitude experiment → why random assignment matters"
    back: |
      It spreads differences such as baseline mood and personality evenly across groups, so a later difference in well-being can be attributed to the gratitude exercise.
    topic_code: "5.2"

quiz:
  description: |
    21 questions · about 35 minutes · mostly on this week (topic 5.2: positive psychology, subjective well-being,
    broaden-and-build, gratitude, virtues and character strengths, resilience, posttraumatic growth, flow and
    hedonic adaptation), with 6 questions (29%) reviewing earlier weeks (stress appraisal, emotion, development,
    personality, thinking and correlation). Opens with a shared-context set on one hypothetical experiment.
    Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical gratitude experiment (5.2)
    - slug: appsych-u05-w28-q01
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 2.B"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). Ninety ninth-graders whose parents gave permission, and who agreed themselves, were randomly assigned to three groups. For three weeks, each evening, the gratitude group wrote down three things that went well that day and why; the kindness group did one small kind act and wrote what it was; the control group wrote down three things they did that day. Before and after, every student completed a 10-item well-being questionnaire (scores 10 to 50, higher means greater well-being).

        | Group | n | Mean change in well-being | Standard deviation |
        |---|---|---|---|
        | Gratitude | 30 | +4.2 | 3.1 |
        | Kindness | 30 | +3.6 | 3.4 |
        | Control | 30 | +0.5 | 3.0 |

        Both the gratitude and kindness groups differed significantly from the control group (p under .01); they did not differ significantly from each other (p = .48).
      prompt: |
        What is the independent variable in this study?
      options:
        - "The change in well-being score"
        - "The type of evening writing activity each student was assigned"
        - "The students' grade level"
        - "The 10-item well-being questionnaire"
      option_explanations:
        - |
          The change in well-being is the outcome that was measured, so it is the dependent variable, not the one manipulated.
        - |
          Correct. The researchers manipulated which activity each student did (gratitude, kindness or neutral), the defining feature of an independent variable.
        - |
          Every participant was a ninth-grader, so grade level did not vary and could not be the independent variable.
        - |
          The questionnaire is the measuring instrument that operationally defines the dependent variable, not something that was manipulated.
      answer: 1
    - slug: appsych-u05-w28-q02
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 2.B"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). Ninety ninth-graders whose parents gave permission, and who agreed themselves, were randomly assigned to three groups. For three weeks, each evening, the gratitude group wrote down three things that went well that day and why; the kindness group did one small kind act and wrote what it was; the control group wrote down three things they did that day. Before and after, every student completed a 10-item well-being questionnaire (scores 10 to 50, higher means greater well-being).

        | Group | n | Mean change in well-being | Standard deviation |
        |---|---|---|---|
        | Gratitude | 30 | +4.2 | 3.1 |
        | Kindness | 30 | +3.6 | 3.4 |
        | Control | 30 | +0.5 | 3.0 |

        Both the gratitude and kindness groups differed significantly from the control group (p under .01); they did not differ significantly from each other (p = .48).
      prompt: |
        Why did the researchers randomly assign students to groups rather than letting them choose an activity?
      options:
        - "To make sure the sample represented all ninth-graders in the country"
        - "To guarantee that every group improved by the same amount"
        - "To keep the students from knowing that they were in a study"
        - "To spread differences such as students' starting mood and personality evenly across the groups"
      option_explanations:
        - |
          Representing a population is the job of random sampling (random selection), not random assignment to conditions.
        - |
          Random assignment does not force equal outcomes; it makes groups similar at the start so differences afterward can be attributed to the activity.
        - |
          The students consented and knew they were in a study; random assignment concerns who gets which condition, not secrecy.
        - |
          Correct. Random assignment makes the groups similar on average in characteristics like mood and optimism, so those cannot explain later differences, reducing confounding.
      answer: 3
    - slug: appsych-u05-w28-q03
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 3.C"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). Ninety ninth-graders whose parents gave permission, and who agreed themselves, were randomly assigned to three groups. For three weeks, each evening, the gratitude group wrote down three things that went well that day and why; the kindness group did one small kind act and wrote what it was; the control group wrote down three things they did that day. Before and after, every student completed a 10-item well-being questionnaire (scores 10 to 50, higher means greater well-being).

        | Group | n | Mean change in well-being | Standard deviation |
        |---|---|---|---|
        | Gratitude | 30 | +4.2 | 3.1 |
        | Kindness | 30 | +3.6 | 3.4 |
        | Control | 30 | +0.5 | 3.0 |

        Both the gratitude and kindness groups differed significantly from the control group (p under .01); they did not differ significantly from each other (p = .48).
      prompt: |
        Which conclusion is best supported by the results?
      options:
        - "For students like these, both gratitude writing and daily kindness raised well-being more than the neutral task, and the study cannot tell which of the two works better."
        - "Gratitude writing works better than kindness, because its mean change (+4.2) is larger than +3.6."
        - "Every student in the gratitude group gained exactly 4.2 points."
        - "Neither activity had any effect, because the standard deviations are larger than the control group's mean."
      option_explanations:
        - |
          Correct. Both differences from control are significant after random assignment, which supports a causal claim for students like these; the gratitude-kindness difference (p = .48) is not significant.
        - |
          A p-value of .48 means a difference of 0.6 points could easily arise by chance, so the study does not show that gratitude beats kindness.
        - |
          +4.2 is the group mean; the standard deviation of 3.1 shows individual students' changes varied around it.
        - |
          Comparing SDs to the control mean is not a test of an effect; the significance tests (p under .01) show both activities differed from control.
      answer: 0
    # ---- Independent items
    - slug: appsych-u05-w28-q04
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 1.A"
      points: 1
      prompt: |
        After a fun afternoon laughing with friends, Priya feels curious enough to join a new club and ends up making several lasting friendships there. Which theory best explains this chain of events?
      options:
        - "The adaptation-level phenomenon"
        - "Relative deprivation"
        - "Broaden-and-build theory"
        - "The general adaptation syndrome"
      option_explanations:
        - |
          The adaptation-level phenomenon explains why good feelings fade as we get used to new circumstances; it does not explain how good feelings build resources.
        - |
          Relative deprivation is feeling worse off than those we compare ourselves with, which is not part of this story.
        - |
          Correct. Positive emotions broadened Priya's openness to new activities, and that exploration built lasting resources: friendships.
        - |
          The general adaptation syndrome describes the body's stages under prolonged stress, not the effects of positive emotion.
      answer: 2
    - slug: appsych-u05-w28-q05
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 1.A"
      points: 1
      prompt: |
        Marcus keeps training for the track team after two injuries and speaks up honestly when a teammate is treated unfairly by others. In Peterson and Seligman's classification, the strengths he shows (perseverance, bravery and honesty) belong mainly to which virtue?
      options:
        - "Courage"
        - "Temperance"
        - "Transcendence"
        - "Wisdom and knowledge"
      option_explanations:
        - |
          Correct. Perseverance, bravery and honesty are grouped under courage, the strengths of will used to act well in the face of difficulty or opposition.
        - |
          Temperance includes forgiveness, humility, prudence and self-regulation, strengths that guard against excess rather than face opposition.
        - |
          Transcendence includes gratitude, hope, humor and appreciation of beauty, strengths that connect a person to larger meaning.
        - |
          Wisdom and knowledge includes curiosity, creativity, judgment and love of learning, which are cognitive strengths, not the ones Marcus shows.
      answer: 0
    - slug: appsych-u05-w28-q06
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 1.A"
      points: 1
      prompt: |
        Two years after a house fire, Elena says she still feels sad about what was lost, but she now values her family more, feels stronger than she thought she was, and has decided to train as a firefighter. Which concept does her account best illustrate?
      options:
        - "Resilience, because she has returned exactly to how she was before"
        - "The exhaustion stage of the general adaptation syndrome"
        - "Hedonic adaptation to her new home"
        - "Posttraumatic growth"
      option_explanations:
        - |
          Resilience means recovering good functioning; Elena describes changes she sees as going beyond where she was before, not a simple return.
        - |
          Exhaustion is a run-down state of depleted resources after long stress; Elena describes new strength and purpose.
        - |
          Hedonic adaptation is getting used to a change so its emotional impact fades; it does not involve the personal changes Elena reports.
        - |
          Correct. Greater appreciation of relationships, a sense of personal strength and new possibilities after a struggle are hallmarks of posttraumatic growth, which can coexist with sadness.
      answer: 3
    - slug: appsych-u05-w28-q07
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 1.A"
      points: 1
      prompt: |
        A researcher finds that most children who grew up amid serious hardship still do well in school and relationships, especially when they had at least one caring, stable adult in their lives. This finding is about
      options:
        - "posttraumatic growth"
        - "resilience and protective factors"
        - "the adaptation-level phenomenon"
        - "flow"
      option_explanations:
        - |
          Posttraumatic growth is reported change beyond one's earlier level after a struggle; the finding here is about doing well despite adversity.
        - |
          Correct. Positive adaptation despite adversity is resilience, and a caring adult is one of the best-documented protective factors.
        - |
          The adaptation-level phenomenon explains how we get used to circumstances, not how children thrive despite adversity.
        - |
          Flow is absorption in a well-matched challenge, which has nothing to do with outcomes after childhood hardship.
      answer: 1
    - slug: appsych-u05-w28-q08
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 2.B"
      points: 1
      prompt: |
        A researcher wants to operationally define subjective well-being. Which measure fits the concept best?
      options:
        - "The number of friends each participant lists on a social media profile"
        - "Each participant's annual household income"
        - "Participants' ratings of their satisfaction with life plus their reported frequency of positive and negative emotions"
        - "The number of hours each participant sleeps"
      option_explanations:
        - |
          A count of online friends may relate to well-being, but it does not ask people to evaluate their own lives or feelings.
        - |
          Income is a possible predictor of well-being, not a measure of how people themselves judge their lives.
        - |
          Correct. Subjective well-being is a person's own evaluation: life satisfaction, frequent positive emotions and infrequent negative emotions, all self-reported.
        - |
          Sleep is a health behavior that may affect mood, but it is not a person's own evaluation of their life.
      answer: 2
    - slug: appsych-u05-w28-q09
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 1.A"
      points: 1
      prompt: |
        Jordan was thrilled with his new phone for a week, but a month later it feels ordinary and he wants the next model. Which concept explains the fading thrill?
      options:
        - "The adaptation-level phenomenon"
        - "Posttraumatic growth"
        - "Tend-and-befriend"
        - "Broaden-and-build theory"
      option_explanations:
        - |
          Correct. We judge experiences against a neutral level set by recent experience; once the new phone becomes normal, it no longer feels exciting.
        - |
          Posttraumatic growth describes positive change after struggling with a highly challenging event, not getting used to a purchase.
        - |
          Tend-and-befriend is a social response to stress, unrelated to a fading thrill from a new possession.
        - |
          Broaden-and-build explains how positive emotions build resources over time, not why their intensity fades.
      answer: 0
    - slug: appsych-u05-w28-q10
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        In a hypothetical study (invented for this course), volunteers watched short videos of animals playing. Half were coached to keep the corners of their mouths raised in a gentle smile throughout; the other half were coached to keep their faces relaxed. The smiling group rated the videos as slightly more enjoyable. Which idea from the emotion unit does this result support?
      options:
        - "The Cannon-Bard theory, because body and feeling occur independently"
        - "The display rules of the participants' culture"
        - "The adaptation-level phenomenon"
        - "The facial feedback hypothesis"
      option_explanations:
        - |
          Cannon-Bard holds that physical arousal and feeling occur at the same time but independently, so the face would not change the feeling.
        - |
          Display rules are cultural norms about when to show emotion; they do not predict that a forced expression changes felt amusement.
        - |
          The adaptation-level phenomenon explains fading happiness over time, not an immediate effect of facial muscles on emotion.
        - |
          Correct. The facial feedback hypothesis says that feedback from facial muscles can intensify the matching emotion. (In real research, effects of posed expressions have been small and replications mixed.)
      answer: 3
    - slug: appsych-u05-w28-q11
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A 16-year-old tries out different friend groups, styles and career ideas while working out what she values. In Erikson's theory, she is working on which psychosocial stage?
      options:
        - "Intimacy versus isolation"
        - "Identity versus role confusion"
        - "Industry versus inferiority"
        - "Generativity versus stagnation"
      option_explanations:
        - |
          Intimacy versus isolation is the young-adult stage of forming close, committed relationships, after identity is largely formed.
        - |
          Correct. Adolescence is Erikson's stage of identity versus role confusion, when teens test roles and values to form a sense of self.
        - |
          Industry versus inferiority is the school-age stage of gaining competence, roughly ages 6 to 12.
        - |
          Generativity versus stagnation is the middle-adult stage of contributing to the next generation through work or family.
      answer: 1
    - slug: appsych-u05-w28-q12
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Before a driving test, Sam thinks, "This is stressful, but I've practiced 40 hours and I know the route." In Lazarus's terms, this thought mainly reflects
      options:
        - "the alarm stage of the general adaptation syndrome"
        - "a daily hassle"
        - "a favorable secondary appraisal of his ability to cope"
        - "relative deprivation"
      option_explanations:
        - |
          The alarm stage is the body's sudden arousal, not a judgment about one's resources.
        - |
          A driving test is a single significant event, and in any case the question is about Sam's thinking, not the type of stressor.
        - |
          Correct. Secondary appraisal asks whether one has the resources to cope; Sam judges that his practice is enough, which lowers the threat.
        - |
          Relative deprivation is feeling worse off than others one compares with, which Sam does not do.
      answer: 2
    - slug: appsych-u05-w28-q13
      type: multi_select
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are among the six virtues in Peterson and Seligman's classification of character strengths and virtues? Select all that apply.
      options:
        - "Courage"
        - "Temperance"
        - "Wealth"
        - "Transcendence"
        - "Popularity"
      option_explanations:
        - |
          Correct. Courage, which includes bravery, perseverance, honesty and zest, is one of the six virtues.
        - |
          Correct. Temperance, which includes forgiveness, humility, prudence and self-regulation, is one of the six virtues.
        - |
          Wealth is a circumstance, not a character virtue, and does not appear in the classification.
        - |
          Correct. Transcendence, which includes gratitude, hope, humor and appreciation of beauty, is one of the six virtues.
        - |
          Popularity is a social status, not a virtue; the six are wisdom, courage, humanity, justice, temperance and transcendence.
      answer: [0, 1, 3]
    - slug: appsych-u05-w28-q14
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 3.A (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        A hypothetical survey (invented for this course) of 400 high school students found a correlation of r = −0.45 between daily hours on social media and scores on a life satisfaction scale. Which statements are correct? Select all that apply.
      options:
        - "Students who spent more hours on social media tended to report lower life satisfaction."
        - "The study shows that social media use lowers life satisfaction."
        - "The relationship is negative and of moderate strength."
        - "Students who are already unhappy might use social media more, so the direction of any causal effect is unclear."
        - "Because r is negative, the relationship is weaker than one with r = +0.45."
      option_explanations:
        - |
          Correct. A negative correlation means that as one variable goes up, the other tends to go down.
        - |
          A survey measured existing behavior without manipulation or random assignment, so it cannot show that social media causes lower satisfaction.
        - |
          Correct. The sign shows the direction (negative), and an absolute value of 0.45 is usually described as moderate.
        - |
          Correct. Reverse causation is possible: unhappiness could lead to more scrolling, or a third variable could drive both.
        - |
          Strength depends on the absolute value; r = −0.45 and r = +0.45 are equally strong, only opposite in direction.
      answer: [0, 2, 3]
    - slug: appsych-u05-w28-q15
      type: true_false
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 1.A"
      points: 1
      prompt: |
        True or false: Positive psychology holds that negative emotions such as sadness and fear are harmful and should be suppressed.
      answer: false
      explanation: |
        False. Positive psychology studies strengths and flourishing alongside, not instead of, the study of problems. Negative emotions are normal and often useful: fear narrows attention onto a threat, and sadness can signal a need for support. Suppressing them is not the goal.
    - slug: appsych-u05-w28-q16
      type: true_false
      topic_code: "4.4"
      source: "Original item; CED Topic 4.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: Carl Rogers argued that unconditional positive regard from others helps people grow toward their full potential.
      answer: true
      explanation: |
        True. In Rogers's humanistic theory, acceptance without conditions (unconditional positive regard), along with genuineness and empathy, creates a climate in which a person's self-concept can become healthy and they can move toward self-actualization. Positive psychology shares the humanistic interest in growth but insists on testing its claims with research.
    - slug: appsych-u05-w28-q17
      type: fill_blank
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 1.A"
      points: 1
      prompt: |
        A guitarist so absorbed in a challenging song that matches her skill that she loses track of time is experiencing what Mihaly Csikszentmihalyi called ____.
      answer: ["flow", "a flow state", "flow state"]
      explanation: |
        Flow is complete absorption in an activity whose challenge matches one's skill, with focused attention and a lost sense of time.
    - slug: appsych-u05-w28-q18
      type: fill_blank
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A student who believes he is unlucky remembers the days the bus was late and overlooks the days it was on time. This tendency to seek and notice evidence that supports an existing belief is called ____ bias.
      answer: ["confirmation", "the confirmation"]
      explanation: |
        Confirmation bias is the tendency to search for and favor information that supports what we already believe. Gratitude exercises are sometimes described as a deliberate counterweight: they direct attention toward good events that would otherwise be overlooked.
    - slug: appsych-u05-w28-q19
      type: short_answer
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 1.A"
      points: 2
      prompt: |
        (a) Define resilience and give an example of it in a teenager.
        (b) Explain how posttraumatic growth differs from resilience.
      answer: |
        (a) Resilience is positive adaptation despite adversity: functioning well or recovering after hardship. Example: a student whose family loses their home keeps up with school and friendships, leaning on a supportive aunt and a coach.
        (b) Resilience is returning to or keeping good functioning; posttraumatic growth is reporting positive change beyond the earlier level after struggling with a highly challenging event, such as a new appreciation of life or closer relationships.
      explanation: |
        Two points. (a) 1 point for a correct definition with a fitting example of adapting well after adversity. (b) 1 point for distinguishing bouncing back (resilience) from changing beyond one's former level (growth).
    - slug: appsych-u05-w28-q20
      type: short_answer
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skills 2.B and 2.D"
      points: 3
      prompt: |
        A student wants to test the claim that doing small acts of kindness raises teenagers' well-being.
        (a) Describe how participants should be placed into groups, and why.
        (b) Give an operational definition of well-being for this study.
        (c) Because participants are minors, identify one ethical requirement beyond the participants' own agreement.
      answer: |
        (a) Randomly assign participants to a kindness condition (for example, three kind acts a week for four weeks) or a control condition (logging three ordinary activities), so that preexisting differences such as mood are spread evenly across the groups.
        (b) For example, each participant's score on a 10-item well-being questionnaire, or their average rating on a 1 to 7 happiness scale reported each evening.
        (c) Written consent from a parent or guardian (with the student's own assent), and approval by an IRB.
      explanation: |
        Three points, one per part. (a) Random assignment with a reason (equal groups, reduces confounding). Letting participants choose earns nothing. (b) A specific, measurable procedure. (c) Parental or guardian consent, or IRB approval; general "be ethical" earns nothing.
    - slug: appsych-u05-w28-q21
      type: long_answer
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skills 1.A and 2.B (concept application)"
      points: 5
      prompt: |
        Tasha is a high school senior. Explain how each of the following concepts could apply to her experience this year. Each part needs a specific application, not just a definition.

        (A) Broaden-and-build theory
        (B) The adaptation-level phenomenon
        (C) Flow
        (D) Relative deprivation
        (E) Operational definition, if her school counselor wanted to measure whether a new advisory program improved seniors' well-being
      answer: |
        (A) After a joyful evening at a friend's party, Tasha feels open and curious and signs up to tutor younger students; over the year the tutoring builds new friendships and skills.
        (B) Tasha is thrilled to get her driver's license, but within a month driving to school feels ordinary because it has become her new baseline.
        (C) When Tasha paints in the art room, the challenge matches her skill so closely that she loses track of time and an hour feels like ten minutes.
        (D) Tasha is pleased with her acceptance to a state university until she compares it with a classmate's offer from a famous school and suddenly feels dissatisfied.
        (E) The counselor could define well-being as each senior's score on a five-item life satisfaction questionnaire given before and after the program.
      explanation: |
        Five points, one per part. Each must apply the concept to Tasha in a way that shows understanding:
        (A) Positive emotion widens her thinking or behavior and leads to lasting resources (both parts needed).
        (B) A positive change loses its emotional effect as it becomes the new normal.
        (C) Absorption in an activity whose challenge matches her skill (loss of time sense or deep focus).
        (D) Feeling worse off because of a comparison with others, not because of her own outcome.
        (E) A specific, measurable procedure for well-being (a named scale score, a rating, a count); "seeing whether seniors are happier" earns nothing.
