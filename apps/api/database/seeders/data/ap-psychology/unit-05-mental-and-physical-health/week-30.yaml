week: 30
unit: 5
title: "Anxiety, Obsessive-Compulsive, Trauma-Related and Mood Disorders"
topics: ["5.4"]
guide: guides/week-30.md
guide_description: |
  The first half of Topic 5.4, in DSM-5-TR terms and person-first language: anxiety disorders (generalized
  anxiety disorder, panic disorder, specific phobia, agoraphobia, social anxiety disorder), obsessive-compulsive
  and related disorders (obsessive-compulsive disorder, hoarding disorder, body dysmorphic disorder), trauma- and
  stressor-related disorders (posttraumatic stress disorder, acute stress disorder), depressive disorders (major
  depressive disorder, persistent depressive disorder) and bipolar disorders (bipolar I and bipolar II), each
  with its key features and the biological, psychological and social factors that research links to it:
  conditioning and preparedness, the amygdala, learned helplessness, rumination, Beck's cognitive triad and
  explanatory style. Worked examples: telling panic disorder from generalized anxiety disorder, bipolar I from
  bipolar II, and a hypothetical longitudinal study of rumination read with percentiles.
flashcards_description: |
  30 cards on the anxiety disorders, obsessive-compulsive and related disorders, posttraumatic stress disorder,
  depressive and bipolar disorders, and the research on their causes (conditioning, preparedness, the amygdala,
  learned helplessness, rumination, the cognitive triad, explanatory style, genes and neurotransmitters), plus
  where to turn for help.

flashcards:
  - front: "Generalized anxiety disorder → core features"
    back: |
      Excessive, hard-to-control worry about many everyday matters (school, health, family) on most days for at least six months, with symptoms such as restlessness, fatigue, poor concentration, irritability, muscle tension or poor sleep.
    topic_code: "5.4"
  - front: "Panic attack → what it is"
    back: |
      A sudden surge of intense fear that peaks within minutes, with symptoms such as pounding heart, shortness of breath, trembling, dizziness or a feeling of losing control. Panic attacks can occur in many disorders and in people with no disorder.
    topic_code: "5.4"
  - front: "Panic disorder → core features"
    back: |
      Recurrent, unexpected panic attacks followed by at least a month of persistent worry about having more attacks or changes in behavior to avoid them.
    topic_code: "5.4"
  - front: "Panic disorder versus generalized anxiety disorder → key difference"
    back: |
      Panic disorder: sudden, intense attacks and fear of the next one. Generalized anxiety disorder: steady, widespread worry about many things, without the sudden peaks.
    topic_code: "5.4"
  - front: "Specific phobia → core features"
    back: |
      Marked, persistent fear of a particular object or situation (heights, spiders, injections, flying) that is out of proportion to the actual danger and leads to avoidance or intense distress.
    topic_code: "5.4"
  - front: "Agoraphobia → core features"
    back: |
      Fear and avoidance of situations where escape might be difficult or help unavailable if panic-like symptoms occurred, such as crowds, public transit or being outside the home alone.
    topic_code: "5.4"
  - front: "Social anxiety disorder → core features"
    back: |
      Intense fear of social situations in which one might be scrutinized or judged, such as speaking in class or eating in public, leading to avoidance or great distress.
    topic_code: "5.4"
  - front: "Classical conditioning of fear (Watson and Rayner, 1920) → the case"
    back: |
      An infant known as Little Albert was conditioned to fear a white rat by pairing it with a loud noise, and the fear generalized to similar furry objects. The study is now seen as unethical: no lasting harm was guarded against and the fear was never removed.
    topic_code: "5.4"
  - front: "Biological preparedness and phobias → meaning"
    back: |
      We learn some fears (snakes, heights, spiders) far more easily than others (cars, electrical outlets), possibly because fearing them helped ancestors survive: an evolutionary explanation.
    topic_code: "5.4"
  - front: "Amygdala in anxiety disorders → research link"
    back: |
      The amygdala, a limbic structure central to detecting threat, tends to respond more strongly to threat cues in many people with anxiety disorders.
    topic_code: "5.4"
  - front: "Avoidance in anxiety → why it keeps fear going"
    back: |
      Escaping or avoiding the feared situation brings relief, which negatively reinforces avoidance, and the person never learns the situation is safe, so the fear does not extinguish.
    topic_code: "5.4"
  - front: "Obsessions (in obsessive-compulsive disorder) → definition"
    back: |
      Recurrent, persistent, unwanted thoughts, urges or images that cause anxiety or distress, such as intrusive fears of contamination or of having left something unsafe.
    topic_code: "5.4"
  - front: "Compulsions (in obsessive-compulsive disorder) → definition"
    back: |
      Repetitive behaviors or mental acts (washing, checking, counting, ordering) a person feels driven to perform to reduce the anxiety from obsessions, often taking over an hour a day.
    topic_code: "5.4"
  - front: "Obsessive-compulsive and related disorders → DSM-5-TR group members"
    back: |
      Obsessive-compulsive disorder, hoarding disorder, body dysmorphic disorder, trichotillomania (hair-pulling disorder) and excoriation (skin-picking) disorder. DSM-5 moved this group out of the anxiety disorders.
    topic_code: "5.4"
  - front: "Hoarding disorder → core features"
    back: |
      Persistent difficulty discarding possessions regardless of their value, because of a perceived need to save them and distress at parting with them, so that living spaces become cluttered and hard to use.
    topic_code: "5.4"
  - front: "Body dysmorphic disorder → core features"
    back: |
      Preoccupation with perceived flaws in physical appearance that others cannot see or see as slight, with repetitive behaviors such as mirror checking or seeking reassurance.
    topic_code: "5.4"
  - front: "Posttraumatic stress disorder → core symptom groups"
    back: |
      After exposure to a traumatic event: intrusive memories, nightmares or flashbacks; avoidance of reminders; negative changes in thinking and mood; and heightened arousal and reactivity (startle, poor sleep, irritability), lasting more than a month.
    topic_code: "5.4"
  - front: "Acute stress disorder versus PTSD → difference"
    back: |
      Similar symptoms after trauma, but acute stress disorder lasts from three days to one month; symptoms lasting longer than a month may meet criteria for PTSD.
    topic_code: "5.4"
  - front: "Trauma exposure and PTSD → why not everyone develops it"
    back: |
      Most people exposed to trauma do not develop PTSD. Risk rises with the severity of the trauma, earlier trauma and little social support, and falls with protective factors: a diathesis-stress pattern.
    topic_code: "5.4"
  - front: "Major depressive disorder → core features"
    back: |
      At least two weeks of depressed mood or loss of interest or pleasure, plus other symptoms such as changes in sleep or appetite, fatigue, feelings of worthlessness or guilt, difficulty concentrating, or thoughts of death, causing distress or impairment.
    topic_code: "5.4"
  - front: "Persistent depressive disorder → core features"
    back: |
      A depressed mood on most days for at least two years in adults (one year in children and adolescents), often milder than a major depressive episode but long-lasting.
    topic_code: "5.4"
  - front: "Seasonal pattern (depressive episodes) → meaning"
    back: |
      A DSM-5-TR specifier for depressive episodes that regularly begin at a particular time of year, most often fall or winter, and lift in spring.
    topic_code: "5.4"
  - front: "Manic episode → core features"
    back: |
      At least a week of abnormally elevated, expansive or irritable mood and increased energy, with symptoms such as inflated self-esteem, decreased need for sleep, racing thoughts, rapid speech and risky decisions, causing marked impairment.
    topic_code: "5.4"
  - front: "Bipolar I versus bipolar II disorder → difference"
    back: |
      Bipolar I: at least one manic episode (depressive episodes are common but not required). Bipolar II: at least one hypomanic episode and at least one major depressive episode, but never a full manic episode.
    topic_code: "5.4"
  - front: "Hypomania → meaning"
    back: |
      A milder, shorter form of mania (at least four days) with elevated mood and energy that others notice, but without the severe impairment of a manic episode.
    topic_code: "5.4"
  - front: "Learned helplessness (Seligman) → meaning and link to depression"
    back: |
      After repeated uncontrollable bad events, an animal or person stops trying to escape or improve the situation even when change becomes possible. Seligman proposed it as one model of depression.
    topic_code: "5.4"
  - front: "Rumination (Nolen-Hoeksema) → meaning and link to depression"
    back: |
      Repetitively focusing on one's distress and its causes and consequences without moving to solutions. It predicts longer and more severe depressive episodes, and on average women ruminate more than men.
    topic_code: "5.4"
  - front: "Beck's cognitive triad → the three parts"
    back: |
      Negative views of the self ("I'm worthless"), the world ("Nobody cares") and the future ("It will never get better"), which Beck proposed maintain depression.
    topic_code: "5.4"
  - front: "Biological factors in depressive and bipolar disorders → examples"
    back: |
      Heritability (bipolar disorder is among the most heritable disorders), differences in neurotransmitter systems such as serotonin and norepinephrine, and stress-hormone activity.
    topic_code: "5.4"
  - front: "Suicide risk and getting help → what to do"
    back: |
      Depressive and bipolar disorders raise the risk of suicide. Warning signs such as talk of wanting to die or being a burden are always taken seriously: tell a trusted adult right away, or call or text 988 (the Suicide & Crisis Lifeline in the U.S.).
    topic_code: "5.4"

quiz:
  description: |
    21 questions · about 35 minutes · mostly on this week (the first half of topic 5.4: anxiety disorders,
    obsessive-compulsive and related disorders, posttraumatic stress disorder, depressive and bipolar disorders
    and the factors linked to them), with 6 questions (29%) reviewing earlier weeks (classical conditioning,
    neurotransmitters, the amygdala, explanatory style, the DSM-5-TR and the diathesis-stress model). Opens with a
    shared-context set on a hypothetical longitudinal study and ends with an Evidence-Based Question in the AP
    format. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set: a hypothetical longitudinal study of rumination (5.4)
    - slug: appsych-u05-w30-q01
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 2.A"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). With parental consent and their own assent, 200 students aged 14 to 16 completed a rumination questionnaire (scores 0 to 60; higher means more repetitive dwelling on distress) in September. One year later, the same students completed a depressive-symptoms checklist. The research team split the September rumination scores into four equal-sized groups (quartiles).

        | September rumination quartile | Students | Share with high depressive-symptom scores a year later |
        |---|---|---|
        | Lowest 25% | 50 | 6% |
        | Second 25% | 50 | 10% |
        | Third 25% | 50 | 16% |
        | Highest 25% | 50 | 30% |

        The correlation between September rumination and later depressive-symptom scores was r = +0.41. The consent form explained that any student who reported thoughts of self-harm would be connected with the school counselor.
      prompt: |
        Which research method does this study use?
      options:
        - "A cross-sectional study, because it compares students of different ages at one time"
        - "An experiment, because the students were sorted into four groups"
        - "A case study, because each student's questionnaire is examined in depth"
        - "A longitudinal study, because the same students were measured twice, a year apart"
      option_explanations:
        - |
          A cross-sectional design compares different age groups at a single time; this study followed the same students across a year.
        - |
          Sorting students by an existing score is not manipulation; nobody was randomly assigned to a level of rumination, so it is not an experiment.
        - |
          A case study examines one person or a very small group in depth; this study measured two variables in 200 students.
        - |
          Correct. Following the same participants over time and measuring them again is a longitudinal design (here also correlational, because nothing was manipulated).
      answer: 3
    - slug: appsych-u05-w30-q02
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 3.B"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). With parental consent and their own assent, 200 students aged 14 to 16 completed a rumination questionnaire (scores 0 to 60; higher means more repetitive dwelling on distress) in September. One year later, the same students completed a depressive-symptoms checklist. The research team split the September rumination scores into four equal-sized groups (quartiles).

        | September rumination quartile | Students | Share with high depressive-symptom scores a year later |
        |---|---|---|
        | Lowest 25% | 50 | 6% |
        | Second 25% | 50 | 10% |
        | Third 25% | 50 | 16% |
        | Highest 25% | 50 | 30% |

        The correlation between September rumination and later depressive-symptom scores was r = +0.41. The consent form explained that any student who reported thoughts of self-harm would be connected with the school counselor.
      prompt: |
        A student's September rumination score is at the 80th percentile of the sample. What does this mean?
      options:
        - "She answered 80% of the rumination questions with the highest rating."
        - "Her score was equal to or higher than the scores of about 80% of the students in the sample."
        - "She has an 80% chance of developing depressive symptoms."
        - "Her score was 80 out of 60 possible points."
      option_explanations:
        - |
          A percentile rank compares a score with other people's scores; it does not describe how she answered individual items.
        - |
          Correct. A percentile rank gives the percentage of scores at or below a given score, so she is in the highest quartile of this sample.
        - |
          A percentile describes position within the sample, not a probability of a future outcome; in her quartile, 30% had high symptom scores later.
        - |
          The scale runs from 0 to 60, so a score of 80 is impossible; a percentile is not a raw score.
      answer: 1
    - slug: appsych-u05-w30-q03
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 2.D"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). With parental consent and their own assent, 200 students aged 14 to 16 completed a rumination questionnaire (scores 0 to 60; higher means more repetitive dwelling on distress) in September. One year later, the same students completed a depressive-symptoms checklist. The research team split the September rumination scores into four equal-sized groups (quartiles).

        | September rumination quartile | Students | Share with high depressive-symptom scores a year later |
        |---|---|---|
        | Lowest 25% | 50 | 6% |
        | Second 25% | 50 | 10% |
        | Third 25% | 50 | 16% |
        | Highest 25% | 50 | 30% |

        The correlation between September rumination and later depressive-symptom scores was r = +0.41. The consent form explained that any student who reported thoughts of self-harm would be connected with the school counselor.
      prompt: |
        Why did the researchers tell participants in advance that a student reporting thoughts of self-harm would be connected with the school counselor?
      options:
        - "Protecting participants' safety can override strict confidentiality, and informed consent requires telling participants about that limit before they agree."
        - "So the researchers could publish the names of students at risk"
        - "Because informed consent is not needed in studies of minors"
        - "To make students less likely to answer honestly, which improves validity"
      option_explanations:
        - |
          Correct. Ethical guidelines put participant welfare first, so a safety plan is needed, and participants must learn of this limit to confidentiality as part of informed consent.
        - |
          Connecting a student with a counselor protects that student; publishing names would violate confidentiality.
        - |
          Studies of minors require parental consent and the minor's assent; this study obtained both.
        - |
          Discouraging honest answers would harm validity, and that is not the purpose of a safety plan.
      answer: 0
    # ---- Independent items
    - slug: appsych-u05-w30-q04
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        Several times in the past two months, Kai has suddenly felt an overwhelming wave of fear with a racing heart, chest tightness and dizziness, peaking within minutes and with no clear trigger. Since then he worries constantly about when the next episode will happen. Which disorder do these symptoms most closely match?
      options:
        - "Generalized anxiety disorder"
        - "Specific phobia"
        - "Panic disorder"
        - "Posttraumatic stress disorder"
      option_explanations:
        - |
          Generalized anxiety disorder involves steady, widespread worry about many everyday matters, not sudden peaks of intense fear.
        - |
          A specific phobia is fear of a particular object or situation; Kai's episodes come without a clear trigger.
        - |
          Correct. Recurrent, unexpected panic attacks followed by persistent worry about future attacks are the core features of panic disorder.
        - |
          PTSD follows exposure to a traumatic event and involves intrusive memories and avoidance of reminders, none of which is described.
      answer: 2
    - slug: appsych-u05-w30-q05
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        For most of the past year, Rosa has worried almost every day about her grades, her parents' health, money and whether her friends are upset with her. She cannot turn the worry off, feels tense and tired, and sleeps poorly. Which disorder do these features most closely match?
      options:
        - "Generalized anxiety disorder"
        - "Panic disorder"
        - "Social anxiety disorder"
        - "Obsessive-compulsive disorder"
      option_explanations:
        - |
          Correct. Excessive, hard-to-control worry about many areas of life on most days for six months or more, with tension, fatigue and poor sleep, matches generalized anxiety disorder.
        - |
          Panic disorder centers on sudden, intense panic attacks, which Rosa does not describe.
        - |
          Social anxiety disorder is fear of being judged in social situations specifically; Rosa's worries span many areas.
        - |
          Obsessive-compulsive disorder involves intrusive obsessions and repetitive compulsions performed to reduce anxiety, not general worry.
      answer: 0
    - slug: appsych-u05-w30-q06
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        Dev has unwanted, intrusive thoughts that he may have left the stove on and caused a fire. To relieve the anxiety, he goes back to check it many times each morning, which often makes him late. In this example, the checking is
      options:
        - "an obsession"
        - "a delusion"
        - "a panic attack"
        - "a compulsion"
      option_explanations:
        - |
          The obsession is the intrusive, unwanted thought about the stove; the checking is what he does in response to it.
        - |
          A delusion is a fixed false belief held despite evidence; Dev's thoughts are unwanted and he does not firmly believe them.
        - |
          A panic attack is a sudden surge of intense fear with physical symptoms, not a repeated behavior.
        - |
          Correct. Compulsions are repetitive behaviors or mental acts performed to reduce the anxiety caused by obsessions.
      answer: 3
    - slug: appsych-u05-w30-q07
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        Six months after a serious car crash, Lena has frequent nightmares about it, avoids riding in cars when she can, startles at sudden noises and feels emotionally numb. Which disorder do these symptoms most closely match?
      options:
        - "Acute stress disorder"
        - "Posttraumatic stress disorder"
        - "Agoraphobia"
        - "Bipolar II disorder"
      option_explanations:
        - |
          Acute stress disorder has similar symptoms but lasts no longer than one month after the trauma; Lena's have lasted six months.
        - |
          Correct. Intrusive memories, avoidance of reminders, negative changes in mood and heightened arousal lasting more than a month after a trauma are the core features of PTSD.
        - |
          Agoraphobia is fear of places where escape might be hard; Lena's avoidance is tied to reminders of a specific trauma.
        - |
          Bipolar II involves hypomanic and major depressive episodes, not trauma-related nightmares and startle.
      answer: 1
    - slug: appsych-u05-w30-q08
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        A person has experienced two major depressive episodes. Last year he also had a ten-day period of greatly elevated mood, sleeping two hours a night without feeling tired, talking rapidly and spending all his savings on impulse, which led to his hospitalization. Which diagnosis do these features fit best?
      options:
        - "Persistent depressive disorder"
        - "Bipolar II disorder"
        - "Bipolar I disorder"
        - "Major depressive disorder with a seasonal pattern"
      option_explanations:
        - |
          Persistent depressive disorder is long-lasting depressed mood with no manic or hypomanic episodes.
        - |
          Bipolar II requires hypomanic episodes but never a full manic episode; an episode severe enough to require hospitalization is mania.
        - |
          Correct. A manic episode (at least a week of elevated mood with decreased need for sleep, rapid speech and risky behavior causing marked impairment) is the defining feature of bipolar I.
        - |
          A depressive disorder cannot include a manic episode; once mania occurs, the diagnosis is in the bipolar group.
      answer: 2
    - slug: appsych-u05-w30-q09
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        After failing several tests despite studying, a student stops studying altogether, even after the class switches to a grading system where effort reliably improves scores. Which concept best describes this pattern?
      options:
        - "Learned helplessness"
        - "Hypomania"
        - "Biological preparedness"
        - "Compulsion"
      option_explanations:
        - |
          Correct. Repeated experiences of having no control can lead a person to stop trying even when their actions would now make a difference, which Seligman proposed as a model of depression.
        - |
          Hypomania is a period of elevated mood and energy, the opposite of giving up.
        - |
          Biological preparedness explains why some fears are learned more easily than others, not why effort stops.
        - |
          A compulsion is a repetitive act performed to reduce anxiety; not acting at all is not a compulsion.
      answer: 0
    - slug: appsych-u05-w30-q10
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        In Watson and Rayner's 1920 study, an infant was shown a white rat while a loud noise was made behind him, until the rat alone produced fear. In classical conditioning terms, what was the white rat after conditioning?
      options:
        - "The unconditioned stimulus"
        - "The unconditioned response"
        - "The conditioned stimulus"
        - "The conditioned response"
      option_explanations:
        - |
          The unconditioned stimulus was the loud noise, which produced fear without any learning.
        - |
          The unconditioned response was the fear produced by the noise before any learning.
        - |
          Correct. The rat began as a neutral stimulus and, after being paired with the noise, became a conditioned stimulus that triggered fear on its own.
        - |
          The conditioned response was the learned fear of the rat, not the rat itself.
      answer: 2
    - slug: appsych-u05-w30-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Which neurotransmitter is most often linked to the regulation of mood, sleep and appetite, and is the target of the most commonly prescribed class of antidepressant medications?
      options:
        - "Acetylcholine"
        - "Serotonin"
        - "GABA"
        - "Endorphins"
      option_explanations:
        - |
          Acetylcholine is most associated with muscle movement and with memory, not mainly with mood regulation.
        - |
          Correct. Serotonin is involved in mood, sleep and appetite, and the most common antidepressants (SSRIs) act on serotonin reuptake.
        - |
          GABA is the brain's main inhibitory neurotransmitter, more often linked to anxiety and to the action of anti-anxiety medications.
        - |
          Endorphins are the body's natural painkillers, linked to pain relief and pleasure rather than to the action of common antidepressants.
      answer: 1
    - slug: appsych-u05-w30-q12
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        DSM-5 moved obsessive-compulsive disorder out of the anxiety disorders into a new group of obsessive-compulsive and related disorders. What does this change best illustrate about the DSM?
      options:
        - "The DSM classifies disorders by their causes, which are now fully known."
        - "Obsessive-compulsive disorder no longer involves anxiety."
        - "Clinicians may now choose whichever category they prefer."
        - "The DSM is revised as research reveals which disorders share features and causes."
      option_explanations:
        - |
          The DSM classifies mainly by symptoms, and the causes of obsessive-compulsive disorder are still not fully known.
        - |
          Anxiety is still part of the experience; the change reflects research on shared features with related disorders such as hoarding.
        - |
          The criteria are standardized precisely so that clinicians do not choose categories by preference.
        - |
          Correct. The manual is updated when research shows that disorders group together differently, as with the obsessive-compulsive and related disorders.
      answer: 3
    - slug: appsych-u05-w30-q13
      type: multi_select
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following can be part of a major depressive episode? Select all that apply.
      options:
        - "Loss of interest or pleasure in activities the person used to enjoy"
        - "Persistent depressed mood most of the day"
        - "Sleeping much more or much less than usual"
        - "Greatly inflated self-esteem and grandiose plans"
        - "Decreased need for sleep with racing thoughts and rapid speech"
        - "Difficulty concentrating or making decisions"
      option_explanations:
        - |
          Correct. Loss of interest or pleasure is one of the two core symptoms of a major depressive episode.
        - |
          Correct. Depressed mood most of the day, nearly every day, is the other core symptom.
        - |
          Correct. Insomnia or sleeping much more than usual are both listed symptoms.
        - |
          Inflated self-esteem and grandiosity are symptoms of mania or hypomania, not depression.
        - |
          A decreased need for sleep with racing thoughts and rapid speech describes mania, not depression, which often brings fatigue.
        - |
          Correct. Trouble concentrating or deciding is a common symptom of a major depressive episode.
      answer: [0, 1, 2, 5]
    - slug: appsych-u05-w30-q14
      type: multi_select
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.A (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        After failing a chemistry test, which explanations show a pessimistic explanatory style (internal, stable and global)? Select all that apply.
      options:
        - "I'm stupid, and I always mess everything up."
        - "The test covered material we hadn't finished in class."
        - "I'm just not smart enough, and I never will be, at school or anything else."
        - "I didn't study this time, but I can study differently for the next test."
        - "I'm a failure at everything I try."
      option_explanations:
        - |
          Correct. It blames the self (internal), assumes it will always be so (stable) and spreads to everything (global).
        - |
          Blaming the test's content is an external, specific explanation, the opposite of the pessimistic style.
        - |
          Correct. Internal (not smart enough), stable (never will be) and global (school or anything else).
        - |
          This is internal but unstable and specific (this time, the next test), typical of an optimistic style.
        - |
          Correct. It is internal (I am), global (at everything) and implies stability, a pessimistic explanation linked to depression.
      answer: [0, 2, 4]
    - slug: appsych-u05-w30-q15
      type: true_false
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        True or false: Bipolar disorder means having two or more separate personalities that take turns controlling behavior.
      answer: false
      explanation: |
        False. Bipolar disorders involve episodes of mood: mania or hypomania and, usually, depression. Separate identities are a feature of dissociative identity disorder, a different and much rarer condition. Everyday slang that calls changing moods "bipolar" spreads this confusion.
    - slug: appsych-u05-w30-q16
      type: true_false
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        True or false: Most people who live through a traumatic event do not go on to develop posttraumatic stress disorder.
      answer: true
      explanation: |
        True. Most people exposed to trauma recover without developing PTSD. Risk is higher with more severe or repeated trauma, earlier trauma and little social support, and lower with protective factors: an example of the diathesis-stress model and of resilience.
    - slug: appsych-u05-w30-q17
      type: fill_blank
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        In bipolar I disorder, a week or more of abnormally elevated or irritable mood with high energy, decreased need for sleep and racing thoughts is called a ____ episode.
      answer: ["manic", "mania", "a manic"]
      explanation: |
        A manic episode is the defining feature of bipolar I disorder. A milder, shorter version without severe impairment is a hypomanic episode, part of bipolar II.
    - slug: appsych-u05-w30-q18
      type: fill_blank
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        The ____, an almond-shaped limbic structure involved in detecting threats, tends to respond more strongly to threat cues in many people with anxiety disorders.
      answer: ["amygdala", "amygdalae", "the amygdala"]
      explanation: |
        The amygdala is central to fear and threat detection. Brain-imaging studies often find stronger amygdala responses to threat cues in people with anxiety disorders, one biological factor among several.
    - slug: appsych-u05-w30-q19
      type: short_answer
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skills 1.A and 2.D"
      points: 2
      prompt: |
        (a) Describe the concept of learned helplessness and explain how it could contribute to depression in a high school student.
        (b) Seligman's original research on learned helplessness exposed dogs to shocks they could not escape. Explain one reason psychologists debate whether research like this is ethical.
      answer: |
        (a) Learned helplessness is the tendency to stop trying after repeated uncontrollable bad events, even when control becomes possible. A student who keeps failing despite effort may conclude nothing she does matters, stop trying, and feel hopeless, which feeds depressed mood and loss of motivation.
        (b) Animal research must minimize pain and distress and be justified by its scientific value; inescapable shocks cause real suffering to animals who cannot consent, so critics question whether the knowledge gained justifies the harm.
      explanation: |
        Two points. (a) 1 point: an accurate description (giving up after uncontrollable events) applied to how it could lead to depressive symptoms in a student. (b) 1 point: an ethical issue such as animal suffering, the need to minimize distress, or weighing harm against scientific benefit.
    - slug: appsych-u05-w30-q20
      type: short_answer
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A (spiral review)"
      points: 2
      prompt: |
        Two firefighters are present at the same serious fire. One develops posttraumatic stress disorder; the other does not. Use the diathesis-stress model to explain one possible reason, naming a specific diathesis and the stressor.
      answer: |
        The fire is the stressor for both. The firefighter who develops PTSD may have a diathesis the other lacks, for example a family history of anxiety disorders, earlier childhood trauma or a more reactive stress-hormone system. The predisposition plus the same severe stressor crosses a threshold for one firefighter but not the other, who may also have protective factors such as strong social support.
      explanation: |
        Two points: 1 for identifying the fire as the stressor shared by both, and 1 for naming a plausible diathesis (genetic, biological or earlier-experience vulnerability) that explains why only one firefighter developed PTSD.
    - slug: appsych-u05-w30-q21
      type: long_answer
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skills 4.A and 4.B (Evidence-Based Question)"
      points: 7
      stimulus: |
        Three hypothetical studies (all invented for this course) on factors linked to anxiety disorders.

        Source A. A research team compared 300 pairs of adult twins. When one identical twin had been diagnosed with an anxiety disorder, the other twin had also been diagnosed 34% of the time; for fraternal twins the figure was 17%. All twins gave informed consent, and records were kept confidential.

        Source B. Ninety college students who reported a strong fear of spiders were randomly assigned either to spend 30 minutes gradually approaching a live spider in a closed tank with a researcher's support, or to spend 30 minutes reading about spiders. One week later, the approach group came significantly closer to the tank (mean 0.4 meters away) than the reading group (mean 2.1 meters away), p under .001. Participants could stop at any time and were debriefed.

        Source C. A longitudinal study followed 500 children from age 8 to age 15. Children whose parents frequently stepped in to help them avoid situations that made them nervous at age 8 were more likely to meet criteria for an anxiety disorder at age 15 (r = +0.29), even after the researchers accounted for the children's anxiety at age 8. Parents gave consent, and the children gave assent.
      prompt: |
        (A) Propose a specific and defensible claim based on at least one of the provided sources that responds to the question: What factors contribute to the development and maintenance of anxiety disorders?

        (B) (i) Support your claim using at least one piece of specific and relevant evidence from one of the sources.
        (ii) Explain how the evidence from part B(i) supports your claim using a psychological concept from this unit or an earlier one.

        (C) (i) Support your claim using an additional piece of specific and relevant evidence from a different source than the one you used in part B(i).
        (ii) Explain how the evidence from part C(i) supports your claim using a different psychological concept than the one you used in part B(ii).
      answer: |
        (A) Anxiety disorders develop from an interaction of genetic predisposition and learned avoidance that keeps fear from fading.
        (B)(i) Source A: when one identical twin had an anxiety disorder, the co-twin did too 34% of the time, compared with 17% for fraternal twins.
        (B)(ii) Identical twins share nearly all their genes and fraternal twins about half, so the doubled concordance points to heritability, a genetic diathesis; because concordance is far below 100%, environment also matters, as the diathesis-stress model predicts.
        (C)(i) Source C: children whose parents often helped them avoid nervous-making situations at 8 were more likely to have an anxiety disorder at 15 (r = +0.29), even controlling for earlier anxiety.
        (C)(ii) The pattern fits negative reinforcement (operant conditioning): avoidance removes anxiety, so it is strengthened, and the child never experiences the situation as safe, so the fear is maintained rather than extinguished. Source C is correlational, so it is consistent with this account rather than proof of it; Source B adds experimental evidence, since approaching the feared object reduced fear.
      explanation: |
        Seven points.
        (A) 1 point: a defensible claim that answers the question and can be supported by the sources (not a restatement of the question).
        (B)(i) 1 point: specific evidence from one source, accurately reported (numbers or a precise description).
        (B)(ii) 2 points: 1 for naming a relevant concept (heritability, diathesis-stress, twin concordance, negative reinforcement, extinction, exposure) and 1 for explaining how the evidence supports the claim through that concept.
        (C)(i) 1 point: specific evidence from a different source.
        (C)(ii) 2 points: 1 for a different concept and 1 for the explanation linking evidence, concept and claim.
        Notes: Source B is an experiment and supports a causal claim about approach reducing fear. Sources A and C are correlational: citing them as evidence that a factor contributes is fine, but an explanation that says either one alone proves cause does not earn the explanation point.
