    - slug: appsych-u05-w27-q19
      type: short_answer
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skills 2.B and 2.C"
      points: 3
      prompt: |
        A researcher wants to study whether students under more stress get sick more often during the school year.

        (a) Give an operational definition of stress the researcher could use.
        (b) Explain why the researcher would most likely use a correlational design rather than an experiment.
        (c) Name one confounding (third) variable that could explain a link between stress and illness, and explain how.
      answer: |
        (a) For example: each student's score on a 20-item stress questionnaire given monthly, or the number of daily hassles logged each day in a diary, or salivary cortisol measured each morning.
        (b) It would be unethical to assign students to experience high, long-lasting stress, so the researcher must measure the stress students already have.
        (c) For example, sleep: students who sleep less may feel more stressed and may also have weaker immune function, so short sleep could produce both high stress and more illness.
      explanation: |
        Three points, one per part. (a) A measurable, specific procedure (a named questionnaire score, a count, a hormone level); "how stressed they feel" alone earns nothing. (b) Ethics of assigning harmful stress (or impossibility of manipulating long-term stress). (c) A plausible third variable linked to BOTH stress and illness, with the link explained (sleep, income, workload, a chronic health condition).
    - slug: appsych-u05-w27-q20
      type: short_answer
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skills 1.A and 4.B"
      points: 2
      prompt: |
        Early research linked the Type A behavior pattern to coronary heart disease.
        (a) Which part of the Type A pattern did later research identify as most closely tied to heart disease?
        (b) Explain one biological pathway by which that trait could harm the heart.
      answer: |
        (a) Hostility and anger (being quick to anger, cynical, aggressive), more than competitiveness or time urgency.
        (b) Frequent anger triggers the sympathetic stress response over and over: heart rate and blood pressure rise and stress hormones are released, and over years this strain contributes to damage in the blood vessels around the heart.
      explanation: |
        Two points. (a) Hostility or anger. (b) A biological link: repeated sympathetic arousal, raised blood pressure or heart rate, or stress hormones (epinephrine, cortisol) affecting the heart and blood vessels over time.
    - slug: appsych-u05-w27-q21
      type: long_answer
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skills 2.A, 2.B, 2.D, 3.C and 4.B (mini article analysis)"
      points: 6
      stimulus: |
        A hypothetical study (invented for this course). Eighty adult employees of one large company volunteered through its wellness program and were randomly assigned to two groups. Once a week for six weeks, the feelings-journal group spent 20 minutes in a phone app writing about how they felt about a current stressor at work or at home; the control group spent 20 minutes in the same app writing a plan of their week's tasks, with no emotional content. Over the following three months, the researchers counted each participant's sick days, using the company's attendance records with the participants' written permission.

        | Group | n | Mean sick days | Standard deviation |
        |---|---|---|---|
        | Feelings journal | 40 | 0.8 | 0.9 |
        | Task planning | 40 | 1.6 | 1.1 |

        The difference was statistically significant (p = .002). Participants signed consent forms, and all were debriefed at the end of the study.
      prompt: |
        (A) Identify the research method used in the study, and explain how you know.
        (B) State the operational definition of the dependent variable.
        (C) Explain what the standard deviations in the table show about the two groups.
        (D) Identify one ethical guideline the researchers followed.
        (E) Explain one reason the findings may not generalize to high school students.
        (F) Explain how the findings support the claim that expressing emotions about stress can improve physical health, using one concept from this week.
      answer: |
        (A) An experiment: the researchers manipulated the independent variable (type of writing) and randomly assigned participants to groups.
        (B) The number of sick days each participant took, counted from the company's attendance records over the three months after the writing sessions.
        (C) The standard deviations (0.9 and 1.1) show how spread out sick-day counts were around each mean; the task-planning group's counts varied a little more from person to person, and both groups vary by about one day around their means.
        (D) Informed consent (signed forms), or debriefing at the end, or permission to use attendance records (confidentiality).
        (E) The sample was adult volunteers at one company; high school students are younger, face different stressors (school rather than work) and may differ in coping skills, so the effect might differ.
        (F) The feelings-journal group took half as many sick days, a significant difference after random assignment. Writing about feelings is a form of emotion-focused coping; reducing distress may lower long-lasting stress hormones such as cortisol, which otherwise suppress the immune system, so participants became ill less often.
      explanation: |
        Six points.
        (A) 1 point: experiment, justified by manipulation of the independent variable or random assignment.
        (B) 1 point: the count of sick days in attendance records over three months (must be measurable; "health" alone earns nothing).
        (C) 1 point: SD as spread or variability of sick days around each group's mean (a comparison of the two groups is not required).
        (D) 1 point: one guideline actually described: informed consent, debriefing, or confidential use of records.
        (E) 1 point: a specific difference between the sample (adult volunteers at one company) and high school students that could change the result.
        (F) 1 point: uses the result (fewer sick days in the feelings-journal group, significant). Linking it to a concept from this week earns the point only with an explanation, such as emotion-focused coping or reduced cortisol and immune suppression (psychoneuroimmunology).
