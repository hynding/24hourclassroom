week: 27
unit: 5
title: "Stress, Coping and Health"
topics: ["5.1"]
guide: guides/week-27.md
guide_description: |
  Health psychology and the biopsychosocial approach to illness: what stress is (a stressor, our appraisal of it
  and our response), eustress and distress, the three kinds of stressors (catastrophes, significant life changes
  and daily hassles), adverse childhood experiences, Lazarus's primary and secondary appraisal, the body's
  response through the sympathetic nervous system and the HPA axis, Selye's general adaptation syndrome,
  fight-or-flight and tend-and-befriend, how long-lasting stress affects the immune system and the heart, and
  problem-focused versus emotion-focused coping. Worked examples: two students appraising the same audition, a
  hypothetical correlational study of daily hassles and nurse visits, and why a correlation between stress and
  colds cannot by itself show cause.
flashcards_description: |
  30 cards on health psychology, stressors and appraisal, the stress response (sympathetic nervous system, HPA
  axis, cortisol), the general adaptation syndrome, tend-and-befriend, stress and the immune system and heart,
  adverse childhood experiences, coping styles, and the research methods used to study stress and health.

flashcards:
  - front: "Health psychology → definition"
    back: |
      The subfield that studies how psychological, behavioral and social factors affect physical health, illness and recovery, and how to promote healthy behavior.
    topic_code: "5.1"
  - front: "Biopsychosocial approach to health → the three levels"
    back: |
      Biological (genes, hormones, immune function), psychological (appraisals, emotions, coping, habits) and social-cultural (relationships, income, discrimination, culture). Illness and health come from all three interacting.
    topic_code: "5.1"
  - front: "Stress (as psychologists use the word) → definition"
    back: |
      The process by which we appraise and respond to events, called stressors, that we judge as threatening or challenging.
    topic_code: "5.1"
  - front: "Eustress versus distress → difference"
    back: |
      Eustress is stress experienced as a positive challenge that motivates (a big game, a performance). Distress is stress experienced as harmful or overwhelming.
    topic_code: "5.1"
  - front: "Catastrophe (stressor type) → definition and example"
    back: |
      A large-scale, unpredictable event that threatens many people at once, such as a hurricane, earthquake, war or pandemic.
    topic_code: "5.1"
  - front: "Significant life change (stressor type) → definition and example"
    back: |
      A major personal transition, welcome or not: moving, a parent's divorce, the death of a loved one, starting a new school or job.
    topic_code: "5.1"
  - front: "Daily hassles (stressor type) → definition and why they matter"
    back: |
      Everyday irritations such as traffic, lost keys, slow Wi-Fi or a noisy sibling. Small one at a time, but they add up, and their total predicts health and mood about as well as rare big events do.
    topic_code: "5.1"
  - front: "Social Readjustment Rating Scale (Holmes and Rahe) → what it measures"
    back: |
      A checklist that assigns life change units to major events (the death of a spouse scores highest). A high total over a year was linked to a higher risk of illness; the link is correlational.
    topic_code: "5.1"
  - front: "Adverse childhood experiences (ACEs) → meaning"
    back: |
      Potentially traumatic events in childhood, such as abuse, neglect or growing up with household violence or instability. More ACEs are associated with higher risk of later health problems, an association, not a destiny; supportive relationships buffer the risk.
    topic_code: "5.1"
  - front: "Primary appraisal (Lazarus) → the question it asks"
    back: |
      Is this event a threat, a challenge, or irrelevant to me? The answer decides whether the event becomes a stressor at all.
    topic_code: "5.1"
  - front: "Secondary appraisal (Lazarus) → the question it asks"
    back: |
      Do I have the resources to cope with it? Feeling able to cope turns a threat into a challenge and lowers the stress response.
    topic_code: "5.1"
  - front: "Fight-or-flight in the stress response → what happens in the body"
    back: |
      The sympathetic nervous system speeds the heart and breathing, raises blood sugar, dilates pupils and slows digestion, and the adrenal medulla releases epinephrine and norepinephrine, preparing the body to act.
    topic_code: "5.1"
  - front: "HPA axis in stress → the chain"
    back: |
      Hypothalamus → pituitary gland (releases ACTH) → adrenal cortex (releases cortisol). A slower, longer-lasting stress response than the sympathetic burst.
    topic_code: "5.1"
  - front: "Cortisol during prolonged stress → role"
    back: |
      A stress hormone from the adrenal cortex that raises blood sugar for energy. Useful briefly; high levels over weeks or months suppress the immune system.
    topic_code: "5.1"
  - front: "General adaptation syndrome (Selye) → the three stages"
    back: |
      Alarm (sudden sympathetic arousal), resistance (body stays aroused and copes, hormones high), exhaustion (reserves run down; vulnerability to illness rises).
    topic_code: "5.1"
  - front: "GAS resistance stage → what it looks like"
    back: |
      The body stays mobilized: temperature, blood pressure and stress hormones remain high while the person keeps coping, as in a student working long days through a three-week exam period.
    topic_code: "5.1"
  - front: "GAS exhaustion stage → what it looks like"
    back: |
      After prolonged stress the body's resources run down; the person is more vulnerable to illness, fatigue and low mood.
    topic_code: "5.1"
  - front: "Tend-and-befriend (Shelley Taylor) → meaning"
    back: |
      A stress response of caring for others (tend) and seeking social support (befriend). Described as more common among women and linked to the hormone oxytocin.
    topic_code: "5.1"
  - front: "Psychoneuroimmunology → definition"
    back: |
      The study of how psychological processes, the nervous and endocrine systems and the immune system interact, for example how long-lasting stress slows healing and raises infection risk.
    topic_code: "5.1"
  - front: "Lymphocytes and stress → the link"
    back: |
      Lymphocytes (B and T cells) are white blood cells that fight infection. Long-lasting stress and high cortisol reduce their activity, so stressed people catch colds more easily and heal more slowly.
    topic_code: "5.1"
  - front: "Stress and colds research → the finding"
    back: |
      In studies where volunteers were deliberately exposed to a cold virus, people who reported more stress were more likely to develop a cold, even with other factors controlled.
    topic_code: "5.1"
  - front: "Type A pattern (Friedman and Rosenman) → traits and the health link"
    back: |
      Competitive, hard-driving, impatient, time-urgent and easily angered. Linked to coronary heart disease; later research pointed to hostility and anger as the harmful part.
    topic_code: "5.1"
  - front: "Type B pattern → traits"
    back: |
      Easygoing and relaxed. In the early studies Type B people had fewer heart attacks than Type A people.
    topic_code: "5.1"
  - front: "Problem-focused coping → definition and example"
    back: |
      Dealing with the stressor itself: making a study plan, talking to the teacher, fixing the broken bike. Works best when the situation is under some control.
    topic_code: "5.1"
  - front: "Emotion-focused coping → definition and example"
    back: |
      Managing your emotional reaction when the stressor cannot be changed: exercising, talking with a friend, reframing, listening to music. Healthy forms help; avoidance such as denial can backfire.
    topic_code: "5.1"
  - front: "Perceived control and stress → the link"
    back: |
      Feeling unable to control a stressor raises the stress response and harms health; a sense of control, even partial, lowers it.
    topic_code: "5.1"
  - front: "Social support and health → the finding"
    back: |
      People with close, supportive relationships tend to have lower stress hormone levels and better health outcomes. Most of this evidence is correlational.
    topic_code: "5.1"
  - front: "Stress and illness studies → why most are correlational"
    back: |
      Researchers cannot ethically assign people to severe or long-lasting stress, so most studies measure existing stress and health. A correlation cannot rule out third variables such as sleep or income.
    topic_code: "5.1"
  - front: "Operational definition of stress in a study → examples"
    back: |
      A score on a stress questionnaire, the number of daily hassles logged in a diary, salivary cortisol level, or heart rate during a timed speech task.
    topic_code: "5.1"
  - front: "Mild stress-induction experiment → ethical safeguards"
    back: |
      Informed consent describing the task, the right to withdraw at any time without penalty, minimal risk approved by an IRB, confidentiality of data, and a full debriefing afterward.
    topic_code: "5.1"

quiz:
  description: |
    21 questions · about 35 minutes · mostly on this week (topic 5.1: stressors and appraisal, the stress
    response, the general adaptation syndrome, tend-and-befriend, stress and the immune system and heart, ACEs and
    coping), with 6 questions (29%) reviewing earlier units (the autonomic nervous system, hormones, sleep, arousal
    and research ethics). Opens with a shared-context set on one hypothetical correlational study. Multiple
    choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically;
    the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical correlational study of daily hassles (5.1)
    - slug: appsych-u05-w27-q01
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 2.A"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course): a research team asked 120 high school juniors who volunteered to log their daily hassles (for example, a missed bus or an argument) in a phone diary every evening for eight weeks. The school nurse's records showed how many times each student visited the nurse for illness over the same eight weeks. The correlation between the average number of hassles per day and the number of nurse visits was r = +0.38 (p = .01).
      prompt: |
        Which research method did the team use?
      options:
        - "An experiment, because the team measured two variables"
        - "A case study, because each student kept a personal diary"
        - "A correlational study, because the team measured existing levels of two variables without manipulating either"
        - "A naturalistic observation, because the team watched students in the school hallways"
      option_explanations:
        - |
          An experiment requires the researcher to manipulate an independent variable and randomly assign participants; here nothing was manipulated.
        - |
          A case study is an in-depth look at one person or a very small group; this study measured the same two variables across 120 students.
        - |
          Correct. The team measured hassles and nurse visits as they naturally occurred and computed the relationship between them, the definition of a correlational study.
        - |
          The data came from diaries and nurse records, not from researchers watching behavior unobtrusively in a natural setting.
      answer: 2
    - slug: appsych-u05-w27-q02
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course): a research team asked 120 high school juniors who volunteered to log their daily hassles (for example, a missed bus or an argument) in a phone diary every evening for eight weeks. The school nurse's records showed how many times each student visited the nurse for illness over the same eight weeks. The correlation between the average number of hassles per day and the number of nurse visits was r = +0.38 (p = .01).
      prompt: |
        Which statement best describes what r = +0.38 shows?
      options:
        - "A moderate positive relationship: students who logged more hassles tended to visit the nurse more often."
        - "A strong negative relationship: more hassles went with fewer nurse visits."
        - "38% of the students visited the nurse because of their hassles."
        - "Hassles caused 38% of the nurse visits."
      option_explanations:
        - |
          Correct. The positive sign means the two variables rise together, and 0.38 is a moderate strength, well short of a perfect +1.00.
        - |
          The sign is positive, not negative, so higher hassle counts went with more nurse visits, not fewer; 0.38 is also not strong.
        - |
          A correlation coefficient is not a percentage of people; it describes the direction and strength of a linear relationship.
        - |
          A correlation cannot establish cause, and r is not a percentage of cases explained by one variable.
      answer: 0
    - slug: appsych-u05-w27-q03
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 4.B"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course): a research team asked 120 high school juniors who volunteered to log their daily hassles (for example, a missed bus or an argument) in a phone diary every evening for eight weeks. The school nurse's records showed how many times each student visited the nurse for illness over the same eight weeks. The correlation between the average number of hassles per day and the number of nurse visits was r = +0.38 (p = .01).
      prompt: |
        A newspaper headline about the study reads, "Daily hassles make teens sick." Which is the best criticism of the headline?
      options:
        - "The correlation is not statistically significant, so there is no relationship at all."
        - "A positive correlation means the hassles protected students from illness."
        - "The sample of 120 students is too large to analyze."
        - "A third variable, such as how much students sleep, could raise both hassles and illness, so the study cannot show that hassles cause illness."
      option_explanations:
        - |
          A p-value of .01 is below the usual .05 cutoff, so the relationship is statistically significant; the problem is the causal wording, not significance.
        - |
          A positive correlation means more hassles went with more nurse visits, the opposite of protection.
        - |
          Larger samples give more reliable estimates; 120 is not too large. The flaw lies in inferring cause from a correlation.
        - |
          Correct. Without manipulation and random assignment, a third variable such as short sleep, or reverse causation (feeling ill makes small problems feel bigger), could explain the link.
      answer: 3
    # ---- Independent items
    - slug: appsych-u05-w27-q04
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A"
      points: 1
      prompt: |
        For three weeks Dana has worked double shifts while her parent is in the hospital. Her stress hormone levels remain high, she keeps up with work and school, and she feels constantly wound up. According to Selye's general adaptation syndrome, which stage is Dana most likely in?
      options:
        - "Alarm"
        - "Resistance"
        - "Exhaustion"
        - "Habituation"
      option_explanations:
        - |
          Alarm is the sudden first burst of sympathetic arousal when a stressor appears, not three weeks of sustained coping.
        - |
          Correct. In resistance the body stays mobilized, with stress hormones high, while the person continues to cope with an ongoing stressor.
        - |
          Exhaustion comes when the body's reserves run down and vulnerability to illness rises; Dana is still coping, so she has not reached it.
        - |
          Habituation is a decreasing response to a repeated stimulus and is not a stage of the general adaptation syndrome.
      answer: 1
    - slug: appsych-u05-w27-q05
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A"
      points: 1
      prompt: |
        After a tornado damages their neighborhood, Mr. Ortiz spends the next days checking on elderly neighbors, organizing meals and calling friends to talk things through. His response best illustrates which concept?
      options:
        - "Fight-or-flight"
        - "The exhaustion stage"
        - "Tend-and-befriend"
        - "Emotion-focused denial"
      option_explanations:
        - |
          Fight-or-flight describes preparing to confront or escape a threat; caring for others and seeking company is a different pattern.
        - |
          Exhaustion is the run-down final stage of the general adaptation syndrome; Mr. Ortiz is active and connected, not depleted.
        - |
          Correct. Caring for others (tending) and seeking out social support (befriending) are the two parts of the tend-and-befriend response.
        - |
          Denial means refusing to acknowledge the stressor; Mr. Ortiz is facing the aftermath directly and reaching out.
      answer: 2
    - slug: appsych-u05-w27-q06
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A"
      points: 1
      prompt: |
        Jamal is anxious about failing chemistry. Which response is an example of problem-focused coping?
      options:
        - "He makes a study schedule and asks his teacher for extra help sessions."
        - "He goes for a long run to clear his head."
        - "He tells himself that one grade does not define him."
        - "He spends the evening playing video games to stop thinking about it."
      option_explanations:
        - |
          Correct. Problem-focused coping acts on the stressor itself; a study plan and extra help target the cause of the worry, the chemistry grade.
        - |
          Running can lower arousal and is a healthy emotion-focused strategy, but it does not change the chemistry grade.
        - |
          Reframing the meaning of a grade manages his emotional reaction, so it is emotion-focused coping.
        - |
          Distraction manages feelings for a while (emotion-focused, and here avoidant); it does nothing about the chemistry grade.
      answer: 0
    - slug: appsych-u05-w27-q07
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A"
      points: 1
      prompt: |
        Two students are told they will give a speech in class tomorrow. Mia thinks, "This is a chance to show what I know." Leo thinks, "This could be humiliating." According to Lazarus, the students differ mainly in their
      options:
        - "general adaptation syndrome stage"
        - "Type A or Type B behavior pattern"
        - "number of daily hassles"
        - "primary appraisal of the same event"
      option_explanations:
        - |
          Both students just heard the news, so neither has moved through stages of prolonged stress; the difference is in how they interpret the event.
        - |
          Type A and Type B are broad behavior patterns linked to heart disease research, not a description of how one event is judged.
        - |
          Both face the same single event; the difference is not how many small irritations they have.
        - |
          Correct. Primary appraisal is judging whether an event is a challenge, a threat or irrelevant. Mia sees a challenge and Leo a threat.
      answer: 3
    - slug: appsych-u05-w27-q08
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A"
      points: 1
      prompt: |
        Which is the best example of a significant life change as a type of stressor?
      options:
        - "A phone battery that dies during the school day"
        - "Moving to a new city and starting at a new high school"
        - "A wildfire that forces a whole region to evacuate"
        - "A long line at the cafeteria"
      option_explanations:
        - |
          A dead phone battery is a brief, everyday irritation, the kind of stressor called a daily hassle.
        - |
          Correct. Moving and changing schools is a major personal transition, the definition of a significant life change.
        - |
          A wildfire that threatens a whole region is a large-scale, unpredictable event, which is a catastrophe.
        - |
          A long line is a small everyday annoyance, a daily hassle rather than a major life transition.
      answer: 1
    - slug: appsych-u05-w27-q09
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A"
      points: 1
      prompt: |
        During a long stretch of stress, the hypothalamus signals the pituitary gland, which signals the adrenal cortex. Which hormone does the adrenal cortex then release in large amounts?
      options:
        - "Melatonin"
        - "Oxytocin"
        - "Cortisol"
        - "Insulin"
      option_explanations:
        - |
          Melatonin comes from the pineal gland and regulates sleep timing; it is not the end point of the stress chain described.
        - |
          Oxytocin, released through the pituitary, is linked to bonding and tend-and-befriend, but it is not made by the adrenal cortex.
        - |
          Correct. The hypothalamus-pituitary-adrenal (HPA) axis ends with the adrenal cortex releasing cortisol, which raises blood sugar and, over time, suppresses immune function.
        - |
          Insulin comes from the pancreas and lowers blood sugar; it is not part of the HPA stress chain.
      answer: 2
    - slug: appsych-u05-w27-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A driver swerves to avoid a deer. Her heart pounds, her breathing speeds up and her digestion slows. Which division of the nervous system produced these changes?
      options:
        - "The sympathetic division of the autonomic nervous system"
        - "The parasympathetic division of the autonomic nervous system"
        - "The somatic nervous system"
        - "The central nervous system's spinal reflex arc only"
      option_explanations:
        - |
          Correct. The sympathetic division arouses the body for action: faster heart rate and breathing, slowed digestion, the alarm reaction of stress.
        - |
          The parasympathetic division calms the body after the threat passes (slower heart rate, resumed digestion), the opposite of these changes.
        - |
          The somatic nervous system controls voluntary skeletal muscles, such as turning the wheel, not heart rate or digestion.
        - |
          A spinal reflex is a quick automatic movement; changes in heart rate and digestion are run by the autonomic nervous system.
      answer: 0
    - slug: appsych-u05-w27-q11
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; CED Topic 1.5, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        During finals, a student sleeps only from 1 a.m. to 5 a.m. instead of her usual 11 p.m. to 7 a.m. Which kind of sleep is she most likely to lose the most of, given how sleep stages are distributed across the night?
      options:
        - "Stage 1 (N1) sleep, which happens mainly at the start of the night"
        - "Deep stage 3 (N3) sleep, which is concentrated late in the night"
        - "Hypnagogic sleep, which happens only after waking"
        - "REM sleep, because REM periods grow longer toward morning"
      option_explanations:
        - |
          N1 is a brief transition at sleep onset and between cycles; cutting the night short removes much more of the later stages.
        - |
          Deep N3 sleep is concentrated early in the night, not late, so a shortened night tends to protect it more than REM.
        - |
          Hypnagogic sensations occur while falling asleep, and there is no sleep stage that happens only after waking.
        - |
          Correct. REM periods lengthen in the later cycles, so cutting off the last hours of sleep removes a large share of REM.
      answer: 3
    - slug: appsych-u05-w27-q12
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A swimmer performs best when she is moderately keyed up before a race, worse when she is very calm, and worse again when she is extremely anxious. Which idea predicts this pattern?
      options:
        - "Drive-reduction theory"
        - "The Yerkes-Dodson law"
        - "The general adaptation syndrome"
        - "Maslow's hierarchy of needs"
      option_explanations:
        - |
          Drive-reduction theory says behavior reduces physiological needs such as hunger; it does not predict an inverted-U link between arousal and performance.
        - |
          Correct. The Yerkes-Dodson law describes an inverted U: performance peaks at a moderate level of arousal and falls at very low and very high arousal.
        - |
          The general adaptation syndrome describes the body's stages during prolonged stress, not how arousal relates to performance on a task.
        - |
          Maslow's hierarchy orders needs from physiological to self-actualization; it says nothing about arousal and performance.
      answer: 1
    - slug: appsych-u05-w27-q13
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.D (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        A hypothetical lab study (invented for this course) will raise volunteers' stress for a few minutes by asking them to give an unprepared speech to a camera, then measure their heart rate. Which safeguards do ethical guidelines require? Select all that apply.
      options:
        - "Informed consent that tells volunteers a stressful speaking task is involved"
        - "Telling volunteers they may stop at any time without penalty"
        - "Approval of the procedure by an institutional review board (IRB) before data collection"
        - "Posting each volunteer's heart rate with their name so results are transparent"
        - "A debriefing afterward that explains the purpose of the study"
      option_explanations:
        - |
          Correct. Participants must agree knowing the main risks, and a stressful task is a risk they should hear about before agreeing.
        - |
          Correct. The right to withdraw at any time without penalty is a core protection, especially for a study meant to feel stressful.
        - |
          Correct. An IRB reviews the risks and safeguards of research with human participants before the study begins.
        - |
          Data must be kept confidential; publishing names alongside physiological data violates participants' privacy.
        - |
          Correct. Debriefing explains the study's purpose and any deception and helps participants leave in at least as good a state as they arrived.
      answer: [0, 1, 2, 4]
    - slug: appsych-u05-w27-q14
      type: multi_select
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        A student's grandparent has a serious illness that the student cannot change. Which of the following are emotion-focused coping strategies? Select all that apply.
      options:
        - "Talking about her feelings with a close friend"
        - "Writing in a journal about what she is grateful for in her grandparent"
        - "Researching the grandparent's treatment schedule to take over the family's medical decisions"
        - "Going for a walk when she feels overwhelmed"
        - "Rearranging her homework schedule so she can visit on weekends"
      option_explanations:
        - |
          Correct. Seeking emotional support helps manage feelings about a stressor that cannot be changed.
        - |
          Correct. Gratitude journaling changes how she feels and thinks about the situation, an emotion-focused strategy.
        - |
          Taking action on the situation is a problem-focused attempt (and medical decisions are not hers to make); it does not target her emotional response.
        - |
          Correct. Exercise lowers physiological arousal and eases distress without changing the stressor itself.
        - |
          Changing her schedule to make visits possible acts on a practical part of the situation, which is problem-focused coping.
      answer: [0, 1, 3]
    - slug: appsych-u05-w27-q15
      type: true_false
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A"
      points: 1
      prompt: |
        True or false: Psychologists consider all stress harmful, so the healthiest goal is a life with no stressors at all.
      answer: false
      explanation: |
        False. Eustress, stress experienced as a motivating challenge, can improve focus and performance, and moderate arousal often helps (the Yerkes-Dodson law). Harm comes mainly from stress that is intense, uncontrollable or long-lasting.
    - slug: appsych-u05-w27-q16
      type: true_false
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: Cortisol acts mainly as a neurotransmitter that crosses a synapse from one neuron to the next.
      answer: false
      explanation: |
        False. Cortisol is a hormone of the endocrine system: the adrenal cortex releases it into the bloodstream, which carries it throughout the body. Hormones act more slowly and last longer than neurotransmitters, which work across a synapse in milliseconds.
    - slug: appsych-u05-w27-q17
      type: fill_blank
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A"
      points: 1
      prompt: |
        Hans Selye called the body's three-stage response to prolonged stress (alarm, resistance, exhaustion) the general ____ syndrome.
      answer: ["adaptation", "adaption"]
      explanation: |
        The general adaptation syndrome: alarm, resistance and exhaustion.
    - slug: appsych-u05-w27-q18
