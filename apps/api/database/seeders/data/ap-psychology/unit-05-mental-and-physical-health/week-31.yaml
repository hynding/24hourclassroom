week: 31
unit: 5
title: "Schizophrenia, Dissociative, Somatic, Eating, Personality and Neurodevelopmental Disorders"
topics: ["5.4"]
guide: guides/week-31.md
guide_description: |
  The second half of Topic 5.4, in DSM-5-TR terms and person-first language: schizophrenia spectrum disorders
  (positive, negative and disorganized symptoms, catatonia, and the research on genes, prenatal factors, dopamine
  and brain structure), dissociative disorders (dissociative amnesia, dissociative identity disorder and the
  debate around it, depersonalization/derealization disorder), somatic symptom and related disorders (somatic
  symptom disorder, illness anxiety disorder, functional neurological symptom disorder), feeding and eating
  disorders (anorexia nervosa, bulimia nervosa, binge-eating disorder), the three clusters of personality
  disorders with antisocial and borderline personality disorder in more detail, and the neurodevelopmental
  disorders ADHD and autism spectrum disorder. Worked examples: sorting symptoms into positive and negative,
  reading a hypothetical brain-imaging comparison with means and standard deviations, and how a retracted,
  fraudulent study fed the false claim that vaccines cause autism.
flashcards_description: |
  32 cards on schizophrenia spectrum disorders and their biological and environmental factors, dissociative
  disorders, somatic symptom and related disorders, feeding and eating disorders, personality disorder clusters,
  antisocial and borderline personality disorders, ADHD, autism spectrum disorder and the vaccine myth.

flashcards:
  - front: "Schizophrenia → core features"
    back: |
      A disorder of disrupted thinking, perception and behavior: two or more of delusions, hallucinations, disorganized speech, grossly disorganized or catatonic behavior, and negative symptoms (at least one of the first three), with signs of the disturbance lasting at least six months.
    topic_code: "5.4"
  - front: "Positive symptoms of schizophrenia → meaning and examples"
    back: |
      Experiences or behaviors added to typical functioning: hallucinations, delusions, disorganized speech and disorganized behavior.
    topic_code: "5.4"
  - front: "Negative symptoms of schizophrenia → meaning and examples"
    back: |
      Reductions or absences of typical functioning: flat affect (little emotional expression), avolition (little motivation), alogia (reduced speech) and social withdrawal.
    topic_code: "5.4"
  - front: "Hallucination (in psychological disorders) → definition"
    back: |
      A perception-like experience with no external stimulus, such as hearing voices no one else hears. In schizophrenia, auditory hallucinations are the most common.
    topic_code: "5.4"
  - front: "Delusion → definition and two common themes"
    back: |
      A fixed false belief held despite clear evidence against it. Persecutory delusions (being plotted against) and grandiose delusions (having special powers or importance).
    topic_code: "5.4"
  - front: "Disorganized speech (word salad) → meaning"
    back: |
      Speech that jumps between loosely related or unrelated ideas, sometimes so jumbled it cannot be followed, reflecting disorganized thinking.
    topic_code: "5.4"
  - front: "Catatonia → meaning"
    back: |
      Marked unusual movement or lack of movement: holding a rigid posture, not responding to the environment, or purposeless excessive movement.
    topic_code: "5.4"
  - front: "Onset of schizophrenia → typical timing"
    back: |
      Usually late adolescence to early adulthood, somewhat earlier on average in men than in women.
    topic_code: "5.4"
  - front: "Dopamine hypothesis of schizophrenia → claim and evidence"
    back: |
      Overactive dopamine signaling in some pathways contributes to positive symptoms. Evidence: medications that block dopamine receptors reduce hallucinations and delusions, and drugs that raise dopamine can produce psychosis-like symptoms.
    topic_code: "5.4"
  - front: "Brain differences in schizophrenia → common findings"
    back: |
      On average, enlarged fluid-filled ventricles, less gray matter in some areas, and reduced activity in the frontal lobes during tasks. These are group averages, not diagnostic tests.
    topic_code: "5.4"
  - front: "Genetics of schizophrenia → twin finding"
    back: |
      If one identical twin has schizophrenia, the other also has it in roughly a third to a half of cases (estimates vary by study), far above fraternal twins (about 10–15%): a strong genetic contribution, but not genetic destiny.
    topic_code: "5.4"
  - front: "Environmental risk factors for schizophrenia → examples"
    back: |
      Prenatal problems such as maternal infection or malnutrition, birth complications, and later stressors. They combine with genetic risk, in a diathesis-stress pattern.
    topic_code: "5.4"
  - front: "Schizophrenia spectrum → other members"
    back: |
      Includes delusional disorder (delusions without other major symptoms), brief psychotic disorder, schizoaffective disorder and schizotypal personality disorder.
    topic_code: "5.4"
  - front: "Dissociation → meaning"
    back: |
      A disruption in the usual integration of memory, identity, awareness or perception, a feeling of being separated from one's thoughts, body or surroundings.
    topic_code: "5.4"
  - front: "Dissociative amnesia → core features"
    back: |
      Inability to recall important personal information, usually about a traumatic or stressful event, that cannot be explained by ordinary forgetting or brain injury. A dissociative fugue (unplanned travel with loss of identity) is a rare form.
    topic_code: "5.4"
  - front: "Dissociative identity disorder → core features"
    back: |
      Two or more distinct identities or personality states, with gaps in memory for everyday events or personal information. Formerly called multiple personality disorder; rare.
    topic_code: "5.4"
  - front: "Dissociative identity disorder → the scientific debate"
    back: |
      One view links it to severe, repeated childhood trauma; a sociocognitive view argues that therapist suggestion and cultural expectations can shape how the symptoms appear. Research continues.
    topic_code: "5.4"
  - front: "Depersonalization/derealization disorder → core features"
    back: |
      Persistent or recurring experiences of feeling detached from one's own body or mind (depersonalization) or that one's surroundings are unreal (derealization), while reality testing stays intact.
    topic_code: "5.4"
  - front: "Somatic symptom disorder → core features"
    back: |
      One or more physical symptoms that are distressing, with excessive thoughts, feelings or behaviors about them, such as constant worry or time spent on the symptoms. The symptoms are real experiences, not faked.
    topic_code: "5.4"
  - front: "Illness anxiety disorder → core features"
    back: |
      Preoccupation with having or getting a serious illness, with few or no actual symptoms, and persistent worry despite reassurance.
    topic_code: "5.4"
  - front: "Functional neurological symptom disorder (conversion disorder) → core features"
    back: |
      Neurological symptoms such as weakness, numbness, unusual movements or loss of vision that are real to the person but inconsistent with recognized neurological disease.
    topic_code: "5.4"
  - front: "Anorexia nervosa → core features"
    back: |
      Restriction of food intake leading to significantly low body weight, intense fear of gaining weight, and a disturbed view of one's own body shape or weight. It has one of the highest mortality rates of any psychological disorder.
    topic_code: "5.4"
  - front: "Bulimia nervosa → core features"
    back: |
      Recurrent episodes of binge eating with a sense of loss of control, followed by recurrent compensatory behaviors, with self-evaluation heavily shaped by body shape and weight.
    topic_code: "5.4"
  - front: "Binge-eating disorder → core features"
    back: |
      Recurrent episodes of eating unusually large amounts with a sense of loss of control and marked distress, without regular compensatory behaviors. The most common eating disorder in the U.S.
    topic_code: "5.4"
  - front: "Feeding and eating disorders → contributing factors"
    back: |
      Genetic and biological factors, perfectionism and low self-esteem, and sociocultural pressures such as idealized body images in media. They affect people of every gender, body size and background.
    topic_code: "5.4"
  - front: "Personality disorder → definition"
    back: |
      An enduring, inflexible pattern of inner experience and behavior that deviates from cultural expectations, begins by adolescence or early adulthood, is stable over time, and causes distress or impairment.
    topic_code: "5.4"
  - front: "Personality disorder clusters → A, B and C"
    back: |
      Cluster A, odd or eccentric: paranoid, schizoid, schizotypal. Cluster B, dramatic, emotional or erratic: antisocial, borderline, histrionic, narcissistic. Cluster C, anxious or fearful: avoidant, dependent, obsessive-compulsive.
    topic_code: "5.4"
  - front: "Antisocial personality disorder → core features"
    back: |
      A pervasive pattern of disregard for and violation of others' rights, such as deceitfulness, impulsivity, aggression and lack of remorse, diagnosed only at 18 or older, with signs of conduct disorder before 15.
    topic_code: "5.4"
  - front: "Borderline personality disorder → core features"
    back: |
      A pervasive pattern of instability in relationships, self-image and emotions, with marked impulsivity and intense fear of abandonment.
    topic_code: "5.4"
  - front: "Attention-deficit/hyperactivity disorder (ADHD) → core features"
    back: |
      A persistent pattern of inattention and/or hyperactivity-impulsivity that interferes with functioning, with several symptoms present before age 12 and in two or more settings, such as home and school.
    topic_code: "5.4"
  - front: "Autism spectrum disorder → core features"
    back: |
      Persistent differences in social communication and interaction, plus restricted, repetitive patterns of behavior, interests or activities, present from early development. Support needs vary widely across the spectrum.
    topic_code: "5.4"
  - front: "Vaccines and autism → what the evidence shows"
    back: |
      Vaccines do not cause autism. The 1998 paper that claimed a link was found to be fraudulent and was retracted in 2010; large studies of many children find no link.
    topic_code: "5.4"

quiz:
  description: |
    21 questions · about 35 minutes · mostly on this week (the second half of topic 5.4: schizophrenia spectrum,
    dissociative, somatic symptom, feeding and eating, personality and neurodevelopmental disorders), with 6
    questions (29%) reviewing earlier weeks and units (perception, research design, brain structures, memory,
    bipolar disorders and the diathesis-stress model). Opens with a shared-context set on a hypothetical
    brain-imaging comparison and ends with an Article Analysis Question in the AP format. Multiple choice,
    select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical brain-imaging comparison (5.4)
    - slug: appsych-u05-w31-q01
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 2.C"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). A research team used structural MRI scans to measure the volume of the lateral ventricles (fluid-filled spaces in the brain) in 40 adults diagnosed with schizophrenia and 40 comparison adults with no psychological disorder. Each comparison adult was matched to a participant with schizophrenia on age, sex and years of education. All participants gave informed consent, and scans were stored under code numbers.

        | Group | n | Mean ventricle volume (mL) | Standard deviation (mL) |
        |---|---|---|---|
        | Schizophrenia | 40 | 24.0 | 7.5 |
        | Comparison | 40 | 18.0 | 6.0 |

        The difference was statistically significant (p = .001).
      prompt: |
        Why can the researchers NOT conclude from this study that enlarged ventricles cause schizophrenia?
      options:
        - "The researchers could not randomly assign people to have schizophrenia or not, so the study is not a true experiment and other factors could explain the difference."
        - "The difference between the means was not statistically significant."
        - "Structural MRI cannot measure the size of brain structures."
        - "Matching on age and sex makes the groups too different to compare."
      option_explanations:
        - |
          Correct. Diagnosis is a preexisting participant characteristic, so this is a nonexperimental (quasi-experimental) comparison; medication, illness duration or other factors could explain the difference, or the disorder could affect the brain.
        - |
          With p = .001, the difference is statistically significant; the problem is the design, not significance.
        - |
          Structural MRI is designed to show brain anatomy, including the size of structures such as the ventricles.
        - |
          Matching makes the groups more similar on age, sex and education, which reduces confounding rather than adding it.
      answer: 0
    - slug: appsych-u05-w31-q02
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 2.C"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). A research team used structural MRI scans to measure the volume of the lateral ventricles (fluid-filled spaces in the brain) in 40 adults diagnosed with schizophrenia and 40 comparison adults with no psychological disorder. Each comparison adult was matched to a participant with schizophrenia on age, sex and years of education. All participants gave informed consent, and scans were stored under code numbers.

        | Group | n | Mean ventricle volume (mL) | Standard deviation (mL) |
        |---|---|---|---|
        | Schizophrenia | 40 | 24.0 | 7.5 |
        | Comparison | 40 | 18.0 | 6.0 |

        The difference was statistically significant (p = .001).
      prompt: |
        What was the purpose of matching each comparison adult to a participant with schizophrenia on age, sex and education?
      options:
        - "To make sure every participant had the same ventricle volume"
        - "To keep participants from knowing which group they were in"
        - "To reduce the chance that differences in age, sex or education explain the difference in ventricle size"
        - "To guarantee that the results apply to every adult in the world"
      option_explanations:
        - |
          Ventricle volume is the variable being measured, so matching on it would make the comparison pointless.
        - |
          Participants knew whether they had a diagnosis; matching concerns which people are compared, not keeping them unaware.
        - |
          Correct. Ventricle size can vary with age, sex and other factors, so matching on them removes those as possible confounding variables.
        - |
          Matching improves the comparison inside the study; generalizing to all adults would require a representative sample.
      answer: 2
    - slug: appsych-u05-w31-q03
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 3.B"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). A research team used structural MRI scans to measure the volume of the lateral ventricles (fluid-filled spaces in the brain) in 40 adults diagnosed with schizophrenia and 40 comparison adults with no psychological disorder. Each comparison adult was matched to a participant with schizophrenia on age, sex and years of education. All participants gave informed consent, and scans were stored under code numbers.

        | Group | n | Mean ventricle volume (mL) | Standard deviation (mL) |
        |---|---|---|---|
        | Schizophrenia | 40 | 24.0 | 7.5 |
        | Comparison | 40 | 18.0 | 6.0 |

        The difference was statistically significant (p = .001).
      prompt: |
        Given the means and standard deviations, which statement is most accurate?
      options:
        - "Every participant with schizophrenia had larger ventricles than every comparison participant."
        - "A brain scan of ventricle size could reliably diagnose schizophrenia in an individual."
        - "The comparison group's scores were more spread out than the schizophrenia group's."
        - "The two groups' scores probably overlap a great deal, so some comparison participants had larger ventricles than some participants with schizophrenia."
      option_explanations:
        - |
          With standard deviations of 6 to 7.5 mL and means only 6 mL apart, many scores in the two groups fall in the same range.
        - |
          Because the distributions overlap so much, a single person's ventricle size cannot tell whether they have schizophrenia; it is a group-average difference.
        - |
          The comparison group's standard deviation (6.0) is smaller than the schizophrenia group's (7.5), so its scores were less spread out.
        - |
          Correct. The means differ by less than one standard deviation of either group, so the distributions overlap substantially even though the average difference is significant.
      answer: 3
    # ---- Independent items
    - slug: appsych-u05-w31-q04
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        A person with schizophrenia reports hearing a voice commenting on her actions when no one else is present. This experience is best classified as
      options:
        - "a negative symptom"
        - "a positive symptom"
        - "a delusion of grandeur"
        - "catatonia"
      option_explanations:
        - |
          Negative symptoms are reductions in typical functioning, such as flat affect or little motivation, not added experiences.
        - |
          Correct. A hallucination adds an experience that is not typically present, which makes it a positive symptom.
        - |
          A delusion is a fixed false belief; hearing a voice is a perception-like experience (a hallucination), not a belief about one's importance.
        - |
          Catatonia involves unusual movement or lack of movement and unresponsiveness, not hearing voices.
      answer: 1
    - slug: appsych-u05-w31-q05
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        A man with schizophrenia speaks very little, shows almost no facial expression when talking about happy or sad events, and has stopped pursuing activities he once cared about. These features are examples of
      options:
        - "positive symptoms"
        - "disorganized speech"
        - "a manic episode"
        - "negative symptoms"
      option_explanations:
        - |
          Positive symptoms add experiences such as hallucinations or delusions; these features are absences.
        - |
          Disorganized speech is jumbled or hard-to-follow talk; this man speaks little, but what he says is not described as disorganized.
        - |
          A manic episode involves elevated mood, high energy and rapid speech, the opposite of this pattern.
        - |
          Correct. Reduced speech (alogia), flat affect and loss of motivation (avolition) are reductions in typical functioning, which define negative symptoms.
      answer: 3
    - slug: appsych-u05-w31-q06
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        Medications that block certain dopamine receptors tend to reduce hallucinations and delusions, while drugs that increase dopamine activity can produce psychosis-like symptoms. These findings support which explanation of schizophrenia?
      options:
        - "The dopamine hypothesis"
        - "The learned helplessness model"
        - "Biological preparedness"
        - "The sociocognitive view of dissociation"
      option_explanations:
        - |
          Correct. Both findings point to overactive dopamine signaling as a contributor to schizophrenia's positive symptoms.
        - |
          Learned helplessness is a model of depression based on uncontrollable events, not of how dopamine relates to psychosis.
        - |
          Biological preparedness explains why some fears, such as of snakes, are learned easily; it is not about dopamine and psychosis.
        - |
          The sociocognitive view concerns how expectations shape dissociative identity disorder, not the effects of dopamine drugs.
      answer: 0
    - slug: appsych-u05-w31-q07
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        A woman reports that she has two distinct identities with different names, voices and preferences, and that she often finds evidence of things she has done with no memory of doing them. Which disorder do these features most closely match?
      options:
        - "Schizophrenia"
        - "Bipolar I disorder"
        - "Dissociative identity disorder"
        - "Depersonalization/derealization disorder"
      option_explanations:
        - |
          Schizophrenia involves symptoms such as hallucinations and delusions, not separate identities; the two are often confused.
        - |
          Bipolar I involves manic and often depressive mood episodes, not distinct identities with memory gaps.
        - |
          Correct. Two or more distinct identities or personality states plus gaps in memory for everyday events are the core features of dissociative identity disorder.
        - |
          Depersonalization/derealization involves feeling detached from oneself or one's surroundings, with identity intact.
      answer: 2
    - slug: appsych-u05-w31-q08
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        A student suddenly develops weakness in one arm. Neurological testing finds no damage that could explain the weakness, and the pattern of symptoms is inconsistent with known nerve disease. The student is not faking. Which diagnosis do these features most closely fit?
      options:
        - "Illness anxiety disorder"
        - "Functional neurological symptom disorder (conversion disorder)"
        - "Dissociative amnesia"
        - "Somatic symptom disorder with no physical symptoms"
      option_explanations:
        - |
          Illness anxiety disorder is preoccupation with having a serious illness with few or no symptoms; the student has a clear neurological symptom.
        - |
          Correct. Real neurological symptoms such as weakness or numbness that are inconsistent with recognized neurological disease define functional neurological symptom disorder.
        - |
          Dissociative amnesia is an inability to recall important personal information, not weakness in a limb.
        - |
          Somatic symptom disorder requires one or more distressing physical symptoms, so the phrase itself is contradictory; this case also centers on a neurological symptom.
      answer: 1
    - slug: appsych-u05-w31-q09
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        Which eating disorder involves recurrent episodes of eating unusually large amounts with a sense of loss of control and marked distress, without regular compensatory behaviors, and is the most common eating disorder in the U.S.?
      options:
        - "Binge-eating disorder"
        - "Bulimia nervosa"
        - "Anorexia nervosa"
        - "Illness anxiety disorder"
      option_explanations:
        - |
          Correct. Binge-eating disorder is defined by recurrent binge episodes with loss of control and distress, without regular compensatory behaviors, and it is the most common eating disorder.
        - |
          Bulimia nervosa also involves binge episodes, but they are followed by recurrent compensatory behaviors.
        - |
          Anorexia nervosa centers on restriction of intake leading to significantly low weight and an intense fear of weight gain.
        - |
          Illness anxiety disorder is preoccupation with having a serious illness, not an eating disorder.
      answer: 0
    - slug: appsych-u05-w31-q10
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        A 30-year-old man has a long history, beginning in his early teens, of lying to and manipulating people for personal gain, breaking laws and showing no remorse when others are hurt. Which personality disorder do these features most closely match?
      options:
        - "Avoidant personality disorder"
        - "Schizoid personality disorder"
        - "Antisocial personality disorder"
        - "Dependent personality disorder"
      option_explanations:
        - |
          Avoidant personality disorder (Cluster C) involves social inhibition and fear of rejection, not manipulation and lawbreaking.
        - |
          Schizoid personality disorder (Cluster A) involves detachment from relationships and limited emotional expression.
        - |
          Correct. A pervasive disregard for others' rights, deceitfulness and lack of remorse, starting before 15 and diagnosed in adulthood, define antisocial personality disorder (Cluster B).
        - |
          Dependent personality disorder (Cluster C) involves an excessive need to be taken care of, the opposite of exploiting others.
      answer: 2
    - slug: appsych-u05-w31-q11
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 1
      prompt: |
        Since early childhood, Theo has found back-and-forth conversation and reading facial expressions difficult, follows the same routines each day and becomes very distressed when they change, and has deep, focused interests in train schedules. Which neurodevelopmental diagnosis do these features most closely fit?
      options:
        - "Attention-deficit/hyperactivity disorder"
        - "Social anxiety disorder"
        - "Obsessive-compulsive disorder"
        - "Autism spectrum disorder"
      option_explanations:
        - |
          ADHD centers on inattention and hyperactivity-impulsivity; Theo's features are social-communication differences and restricted, repetitive patterns.
        - |
          Social anxiety disorder is fear of being judged in social situations, usually developing later; Theo's differences have been present since early childhood.
        - |
          OCD involves unwanted obsessions and compulsions to reduce anxiety; Theo's routines and interests are not described as unwanted intrusions.
        - |
          Correct. Differences in social communication plus restricted, repetitive behaviors and interests, present from early development, are the two core features of autism spectrum disorder.
      answer: 3
    - slug: appsych-u05-w31-q12
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; CED Topic 2.1, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Which statement correctly distinguishes a hallucination from a perceptual illusion?
      options:
        - "A hallucination misinterprets a real stimulus; an illusion has no stimulus at all."
        - "A hallucination is a perception-like experience with no external stimulus; an illusion is a misperception of a real stimulus."
        - "Both describe the same experience with different names."
        - "Illusions happen only in people with psychological disorders."
      option_explanations:
        - |
          This reverses the two: illusions misinterpret something real, and hallucinations occur without a stimulus.
        - |
          Correct. Hallucinations arise without any external input, while illusions such as the Müller-Lyer lines are misreadings of real stimuli that fool almost everyone.
        - |
          They differ precisely in whether a real stimulus is present.
        - |
          Visual illusions fool nearly everyone, because they exploit normal perceptual processes.
      answer: 1
    - slug: appsych-u05-w31-q13
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.A (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        Researchers want to separate the effects of genes and environment on the risk of schizophrenia. Which research designs help do that? Select all that apply.
      options:
        - "Comparing concordance rates in identical twins with those in fraternal twins"
        - "Studying adopted children whose biological parent has schizophrenia, raised by adoptive parents who do not"
        - "A single in-depth case study of one family with several affected members"
        - "Studying identical twins raised apart in different homes"
        - "A survey asking people whether they think schizophrenia is inherited"
      option_explanations:
        - |
          Correct. Identical twins share nearly all their genes and fraternal twins about half, so higher concordance in identical twins points to genetic influence.
        - |
          Correct. Adoption studies separate genetic relatives from the rearing environment, so higher risk in adoptees with an affected biological parent points to genes.
        - |
          One family shares both genes and environment, so a case study cannot separate the two influences.
        - |
          Correct. Twins with the same genes raised in different environments let researchers estimate genetic influence apart from shared rearing.
        - |
          Opinions about heredity measure beliefs, not the actual causes of the disorder.
      answer: [0, 1, 3]
    - slug: appsych-u05-w31-q14
      type: multi_select
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are negative symptoms of schizophrenia? Select all that apply.
      options:
        - "Flat affect, showing little emotional expression"
        - "A belief that neighbors are secretly broadcasting one's thoughts"
        - "Avolition, a marked lack of motivation to start or finish activities"
        - "Hearing voices that no one else hears"
        - "Alogia, a marked reduction in speech"
      option_explanations:
        - |
          Correct. Flat affect is a reduction in typical emotional expression, a negative symptom.
        - |
          A fixed false belief is a delusion, which adds to typical experience and so is a positive symptom.
        - |
          Correct. Avolition is an absence of typical motivation, a negative symptom.
        - |
          Hearing voices is a hallucination, a positive symptom.
        - |
          Correct. Alogia is a reduction in typical speech, a negative symptom.
      answer: [0, 2, 4]
    - slug: appsych-u05-w31-q15
      type: true_false
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A (spiral review of week 30)"
      points: 1
      prompt: |
        True or false: A diagnosis of bipolar II disorder requires at least one full manic episode.
      answer: false
      explanation: |
        False. Bipolar II requires at least one hypomanic episode (milder, at least four days, without severe impairment) and at least one major depressive episode, with no full manic episode. A full manic episode means bipolar I.
    - slug: appsych-u05-w31-q16
      type: true_false
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skills 1.A and 2.D"
      points: 1
      prompt: |
        True or false: Research shows that childhood vaccines cause autism spectrum disorder.
      answer: false
      explanation: |
        False. Large studies of many children find no link between vaccines and autism. The 1998 paper that claimed one was found to be fraudulent and was retracted in 2010, a case study in why research needs honesty, replication and peer review. Autism has strong genetic contributions and its differences are present from early development.
    - slug: appsych-u05-w31-q17
      type: fill_blank
      topic_code: "2.7"
      source: "Original item; CED Topic 2.7, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Unlike dissociative amnesia, which has no physical cause, an inability to recall events from before a head injury is called ____ amnesia.
      answer: ["retrograde"]
      explanation: |
        Retrograde amnesia is loss of memory for events before an injury; anterograde amnesia is the inability to form new memories after it. Dissociative amnesia, by contrast, is not explained by brain injury and usually concerns stressful or traumatic personal information.
    - slug: appsych-u05-w31-q18
      type: fill_blank
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Brain-imaging studies often find reduced activity during tasks in the ____ lobes of people with schizophrenia, the lobes that support planning, judgment and working memory.
      answer: ["frontal", "prefrontal", "frontal lobe", "prefrontal cortex"]
      explanation: |
        The frontal (especially prefrontal) lobes support planning, judgment and working memory. Reduced frontal activity is a common group-level finding in schizophrenia and may relate to negative symptoms and difficulties with organized thinking.
    - slug: appsych-u05-w31-q19
      type: short_answer
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A (spiral review)"
      points: 2
      prompt: |
        Use the diathesis-stress model to explain why one identical twin may develop schizophrenia while the other does not. Name the diathesis and one possible stressor.
      answer: |
        Both twins share the same genetic predisposition (the diathesis), but schizophrenia develops only when that predisposition combines with enough environmental stress. One twin may have faced a stressor the other did not, such as birth complications or a difference in prenatal blood supply, or severe stress in adolescence, so only that twin crossed the threshold.
      explanation: |
        Two points: 1 for the diathesis as the shared genetic vulnerability, and 1 for a plausible environmental stressor that differed between the twins (prenatal or birth complications, infection, severe life stress) explaining the different outcome.
    - slug: appsych-u05-w31-q20
      type: short_answer
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A"
      points: 2
      prompt: |
        Explain how (a) one sociocultural factor and (b) one biological factor may contribute to the development of feeding and eating disorders.
      answer: |
        (a) Sociocultural: media and peer environments that idealize thin or particular body types can lead young people to judge their worth by appearance, raising body dissatisfaction, a risk factor for eating disorders.
        (b) Biological: eating disorders run in families, and twin studies show a genetic contribution, possibly through traits such as anxiety or perfectionism and differences in appetite and reward systems.
      explanation: |
        Two points: 1 for a sociocultural factor with an explanation of how it raises risk (body ideals in media, peer or family pressure, sports that emphasize weight), and 1 for a biological factor with an explanation (heritability, temperament, brain reward or appetite systems). No information about specific eating behaviors is required or credited.
    - slug: appsych-u05-w31-q21
      type: long_answer
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skills 2.A, 2.B, 2.D, 3.A, 3.C and 4.B (Article Analysis Question)"
      points: 7
      stimulus: |
        A hypothetical study (invented for this course). Researchers recruited 600 nine-year-olds from 12 public elementary schools in one state. Parents reported each child's average daily recreational screen time over the previous month. Separately, each child's classroom teacher, who did not know the parents' reports, completed an 18-item attention rating scale on which higher scores mean more frequent attention problems (range 0 to 54). The correlation between daily screen time and attention-scale scores was r = +0.18 (p = .001). Parents gave written consent, children gave verbal assent, and all data were stored under code numbers. The research summary concluded that "the association is small, and screen time explained only about 3% of the variation in attention scores."
      prompt: |
        (A) Identify the research method used in the study.
        (B) State the operational definition of attention problems in the study.
        (C) Describe what the correlation coefficient (r = +0.18) shows about the relationship between screen time and attention scores.
        (D) Identify one ethical guideline the researchers applied in this study.
        (E) Explain the extent to which the research findings may or may not be generalizable to all nine-year-olds in the United States, using specific and relevant evidence from the study.
        (F) Explain how the findings do or do not support the claim that screen time causes attention-deficit/hyperactivity disorder (ADHD), using a psychological concept. (2 points)
      answer: |
        (A) A correlational study: the researchers measured screen time and attention scores as they naturally occurred, without manipulating either.
        (B) Attention problems were each child's score (0 to 54) on the 18-item attention rating scale completed by the classroom teacher.
        (C) r = +0.18 is a weak positive correlation: children with more daily screen time tended to have slightly higher attention-problem scores, but the relationship is weak and many children do not fit the pattern.
        (D) Informed consent from parents (with children's assent), or confidentiality through coded data.
        (E) Limited: the sample of 600 came from 12 schools in a single state, not a random sample of the nation, so children in other states, private or home schools, or different communities may differ. The large sample helps, but location limits generalization.
        (F) The findings do not support the causal claim. Because the study is correlational, a third variable (for example, family stress or less sleep) could raise both screen time and attention problems, or children who already have attention difficulties may be drawn to screens (reverse causation). The correlation is also weak (about 3% of variation), and attention-scale scores are not a diagnosis of ADHD, which is a neurodevelopmental disorder with strong genetic contributions.
      explanation: |
        Seven points.
        (A) 1 point: correlational (nonexperimental) study.
        (B) 1 point: the teacher's score on the 18-item attention rating scale.
        (C) 1 point: a weak positive relationship described in context (more screen time goes with slightly higher attention-problem scores).
        (D) 1 point: one guideline actually applied (parental informed consent, child assent, confidentiality).
        (E) 1 point: a judgment about generalizability supported by a specific feature of the sample (12 schools in one state, not randomly selected nationally).
        (F) 2 points: 1 for stating that the findings do not support the causal claim, and 1 for explaining why with a psychological concept (correlation does not show causation, a named third variable, reverse causation, weak effect size, or that a rating score is not a diagnosis).
