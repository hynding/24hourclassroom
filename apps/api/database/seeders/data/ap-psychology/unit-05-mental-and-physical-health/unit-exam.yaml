unit: 5
description: |
  44 questions · about 90 minutes · every topic of Unit 5 (5.1 to 5.5): stress, appraisal, the stress response and
  coping; positive psychology, character strengths, resilience and posttraumatic growth; defining, classifying and
  explaining psychological disorders; anxiety, obsessive-compulsive, trauma-related, depressive, bipolar,
  schizophrenia spectrum, dissociative, somatic symptom, eating, personality and neurodevelopmental disorders; and
  psychological and biomedical treatments and how they are evaluated. Includes three shared-context sets (three
  questions on a hypothetical cortisol study, three on a hypothetical case description, three on a hypothetical
  therapy trial), select-all, true/false and fill-in-the-blank items, one short-answer question (3 points) and two
  free-response questions in the AP format (7 points each: an Article Analysis Question and an Evidence-Based
  Question). Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are
  matched automatically; the short answer and the free-response questions are graded by your teacher against the
  scoring notes.
questions:
  # ---- Stimulus set A: a hypothetical cortisol study (5.1)
  - slug: appsych-u05-exam-q01
    type: multiple_choice
    topic_code: "5.1"
    source: "Original item; CED Topic 5.1, Skill 2.A"
    points: 1
    stimulus: |
      A hypothetical study (invented for this course). Sixty high school seniors who volunteered, with parental consent, each gave a saliva sample every morning for one week during final exams and for one week during a school vacation. Saliva was analyzed for cortisol. Each student's samples were labeled with a code number rather than a name.

      | Week | Mean morning cortisol (nmol/L) | Standard deviation |
      |---|---|---|
      | Final exams | 14.2 | 4.1 |
      | Vacation | 9.8 | 3.6 |

      Cortisol was significantly higher during exam week (p under .001).
    prompt: |
      Which design did this study use?
    options:
      - "A between-subjects experiment with random assignment to exam or vacation"
      - "A case study of one student's stress"
      - "A within-subjects (repeated measures) design, because each student was measured under both conditions"
      - "A cross-sectional survey of students of different ages"
    option_explanations:
      - |
        Students were not assigned to one condition or the other; every student was measured in both weeks.
      - |
        A case study examines one person or a very small group in depth; this study measured 60 students.
      - |
        Correct. The same participants provided data in both conditions, so each student serves as his or her own comparison.
      - |
        All participants were seniors measured over time, not people of different ages compared at one moment.
    answer: 2
  - slug: appsych-u05-exam-q02
    type: multiple_choice
    topic_code: "5.1"
    source: "Original item; CED Topic 5.1, Skill 1.A"
    points: 1
    stimulus: |
      A hypothetical study (invented for this course). Sixty high school seniors who volunteered, with parental consent, each gave a saliva sample every morning for one week during final exams and for one week during a school vacation. Saliva was analyzed for cortisol. Each student's samples were labeled with a code number rather than a name.

      | Week | Mean morning cortisol (nmol/L) | Standard deviation |
      |---|---|---|
      | Final exams | 14.2 | 4.1 |
      | Vacation | 9.8 | 3.6 |

      Cortisol was significantly higher during exam week (p under .001).
    prompt: |
      Students' cortisol stayed high every morning across the whole exam week while they kept studying and taking tests. Which stage of Selye's general adaptation syndrome does this sustained pattern best represent?
    options:
      - "Resistance"
      - "Alarm"
      - "Exhaustion"
      - "Recovery"
    option_explanations:
      - |
        Correct. In the resistance stage the body stays mobilized, with stress hormones elevated, while the person continues to cope with an ongoing stressor.
      - |
        Alarm is the sudden initial burst of arousal when a stressor first appears, not a week of sustained elevation.
      - |
        Exhaustion comes when reserves are depleted after prolonged stress; the students were still coping effectively.
      - |
        Recovery is not one of Selye's three stages, which are alarm, resistance and exhaustion.
    answer: 0
  - slug: appsych-u05-exam-q03
    type: multiple_choice
    topic_code: "5.1"
    source: "Original item; CED Topic 5.1, Skill 2.B"
    points: 1
    stimulus: |
      A hypothetical study (invented for this course). Sixty high school seniors who volunteered, with parental consent, each gave a saliva sample every morning for one week during final exams and for one week during a school vacation. Saliva was analyzed for cortisol. Each student's samples were labeled with a code number rather than a name.

      | Week | Mean morning cortisol (nmol/L) | Standard deviation |
      |---|---|---|
      | Final exams | 14.2 | 4.1 |
      | Vacation | 9.8 | 3.6 |

      Cortisol was significantly higher during exam week (p under .001).
    prompt: |
      In this study, how was the body's stress response operationally defined?
    options:
      - "How stressed each student said they felt"
      - "Whether the week was an exam week or a vacation week"
      - "The number of hours each student studied"
      - "The level of cortisol in each student's morning saliva sample"
    option_explanations:
      - |
        The study did not collect self-reports of stress; it measured a hormone.
      - |
        The type of week is the condition being compared (the independent variable), not the measure of the stress response.
      - |
        Study time was not measured in this study.
      - |
        Correct. The stress response was measured as morning salivary cortisol in nmol/L, a specific, measurable procedure.
    answer: 3
  # ---- Independent items
  - slug: appsych-u05-exam-q04
    type: multiple_choice
    topic_code: "5.1"
    source: "Original item; CED Topic 5.1, Skill 1.A"
    points: 1
    prompt: |
      Which pair correctly matches each event with its type of stressor?
    options:
      - "A flood that destroys a town: daily hassle; losing your house key: catastrophe"
      - "A pandemic: catastrophe; a sibling who keeps borrowing your headphones: daily hassle"
      - "Starting college: catastrophe; a war: significant life change"
      - "A parent's remarriage: daily hassle; a traffic jam: significant life change"
    option_explanations:
      - |
        This reverses the categories: a flood is a catastrophe and a lost key is a daily hassle.
      - |
        Correct. A pandemic is a large-scale, unpredictable catastrophe, and a sibling borrowing headphones is a small everyday irritation.
      - |
        Starting college is a significant life change and a war is a catastrophe.
      - |
        A parent's remarriage is a significant life change and a traffic jam is a daily hassle.
    answer: 1
  - slug: appsych-u05-exam-q05
    type: multiple_choice
    topic_code: "5.1"
    source: "Original item; CED Topic 5.1, Skill 1.A"
    points: 1
    prompt: |
      A researcher finds that small skin wounds heal more slowly in people caring for a family member with a long-term illness than in a comparison group. Which field most directly studies findings like this?
    options:
      - "Positive psychology"
      - "Psychoanalysis"
      - "Evolutionary psychology"
      - "Psychoneuroimmunology"
    option_explanations:
      - |
        Positive psychology studies strengths and flourishing rather than how stress affects immune function.
      - |
        Psychoanalysis is a therapy and theory about unconscious conflict, not the study of stress and immunity.
      - |
        Evolutionary psychology asks how behaviors may have helped ancestors survive and reproduce, not how stress affects healing.
      - |
        Correct. Psychoneuroimmunology studies how psychological states, the nervous and endocrine systems and the immune system interact, including how long-lasting stress slows healing.
    answer: 3
  - slug: appsych-u05-exam-q06
    type: multiple_choice
    topic_code: "5.2"
    source: "Original item; CED Topic 5.2, Skill 1.A"
    points: 1
    prompt: |
      A student often notices beautiful sunsets, writes thank-you notes and stays hopeful about the future. In Peterson and Seligman's classification, these strengths belong to which virtue?
    options:
      - "Transcendence"
      - "Justice"
      - "Courage"
      - "Wisdom and knowledge"
    option_explanations:
      - |
        Correct. Appreciation of beauty, gratitude and hope are strengths of transcendence, which connect a person to something larger.
      - |
        Justice includes teamwork, fairness and leadership, civic strengths not described here.
      - |
        Courage includes bravery, perseverance, honesty and zest, strengths of will in the face of difficulty.
      - |
        Wisdom and knowledge includes curiosity, creativity, judgment and love of learning, cognitive strengths.
    answer: 0
  - slug: appsych-u05-exam-q07
    type: multiple_choice
    topic_code: "5.2"
    source: "Original item; CED Topic 5.2, Skill 1.A"
    points: 1
    prompt: |
      According to Fredrickson's broaden-and-build theory, why might a team that laughs together during practice develop better problem-solving over a season?
    options:
      - "Laughter lowers cortisol permanently, preventing all illness."
      - "Positive emotions narrow attention onto the single most important task."
      - "Positive emotions widen the range of ideas players consider, and over time this builds resources such as trust and creative skills."
      - "Positive emotions make players adapt so that nothing feels exciting."
    option_explanations:
      - |
        The theory is about broadened thinking and built resources, and no emotion permanently prevents illness.
      - |
        Narrowed attention is what the theory attributes to negative emotions such as fear, not positive ones.
      - |
        Correct. Broadening (more ideas and openness) and building (lasting resources such as trust and skills) are the two parts of the theory.
      - |
        This describes the adaptation-level phenomenon, a different idea about how gains come to feel normal.
    answer: 2
  - slug: appsych-u05-exam-q08
    type: multiple_choice
    topic_code: "5.2"
    source: "Original item; CED Topic 5.2, Skill 1.A"
    points: 1
    prompt: |
      After a serious illness, a teacher says she feels closer to her family, has a new sense of what matters, and has started a project she had put off for years, while still grieving what the illness took from her. Her experience best illustrates
    options:
      - "resilience, because she has returned exactly to her previous state"
      - "posttraumatic growth"
      - "the exhaustion stage of the general adaptation syndrome"
      - "relative deprivation"
    option_explanations:
      - |
        Resilience means recovering or staying well; she describes changes she sees as going beyond her earlier state.
      - |
        Correct. Closer relationships, a new appreciation of life and new possibilities after a struggle are hallmarks of posttraumatic growth, which can coexist with grief.
      - |
        Exhaustion is depletion after prolonged stress, not the positive changes she describes.
      - |
        Relative deprivation is feeling worse off than others one compares with, which is not described.
    answer: 1
  - slug: appsych-u05-exam-q09
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; CED Topic 5.3, Skill 1.A"
    points: 1
    prompt: |
      Which statement best expresses the diathesis-stress model?
    options:
      - "A disorder develops when a predisposition, often genetic, combines with environmental stress."
      - "Disorders are caused entirely by unconscious conflicts from childhood."
      - "Any person exposed to enough stress will develop the same disorder."
      - "Genes alone determine whether a person develops a disorder."
    option_explanations:
      - |
        Correct. The model holds that a vulnerability (diathesis) and stress together produce a disorder; either alone is often not enough.
      - |
        This is a psychodynamic explanation; the diathesis-stress model emphasizes predisposition plus environmental stress.
      - |
        The model predicts that people with different vulnerabilities respond differently to the same stress.
      - |
        The model explicitly includes environmental stress alongside the predisposition.
    answer: 0
  # ---- Stimulus set B: a hypothetical case description (5.4, 5.3, 5.5)
  - slug: appsych-u05-exam-q10
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    stimulus: |
      A hypothetical case (invented for this course). For the past eight months, Jae, a 23-year-old office worker, has been convinced that his coworkers are placing thoughts into his mind through the office lights, despite clear evidence that this is impossible. He reports hearing voices that comment on what he is doing when no one is there. His sentences often jump between unrelated topics. He has withdrawn from friends and rarely shows emotion in his face or voice. Medical tests found no physical illness or substance use that could explain these experiences.
    prompt: |
      Jae's symptoms are most consistent with which disorder?
    options:
      - "Dissociative identity disorder"
      - "Bipolar I disorder"
      - "Generalized anxiety disorder"
      - "Schizophrenia"
    option_explanations:
      - |
        Dissociative identity disorder involves distinct identities and memory gaps, not delusions and hallucinations.
      - |
        Bipolar I is defined by manic episodes; the case describes no elevated mood, decreased need for sleep or similar features.
      - |
        Generalized anxiety disorder is excessive worry about many matters, not fixed false beliefs or hearing voices.
      - |
        Correct. Delusions, hallucinations, disorganized speech and negative symptoms lasting more than six months are characteristic of schizophrenia.
    answer: 3
  - slug: appsych-u05-exam-q11
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    stimulus: |
      A hypothetical case (invented for this course). For the past eight months, Jae, a 23-year-old office worker, has been convinced that his coworkers are placing thoughts into his mind through the office lights, despite clear evidence that this is impossible. He reports hearing voices that comment on what he is doing when no one is there. His sentences often jump between unrelated topics. He has withdrawn from friends and rarely shows emotion in his face or voice. Medical tests found no physical illness or substance use that could explain these experiences.
    prompt: |
      Which of Jae's features is a negative symptom?
    options:
      - "His belief that coworkers place thoughts into his mind"
      - "Rarely showing emotion in his face or voice"
      - "Hearing voices that comment on what he does"
      - "Sentences that jump between unrelated topics"
    option_explanations:
      - |
        A fixed false belief is a delusion, which adds to typical experience and is therefore a positive symptom.
      - |
        Correct. Little emotional expression (flat affect) is a reduction in typical functioning, a negative symptom.
      - |
        Hearing voices is a hallucination, a positive symptom.
      - |
        Disorganized speech adds an unusual pattern to typical functioning and is counted as a positive symptom.
    answer: 1
  - slug: appsych-u05-exam-q12
    type: multiple_choice
    topic_code: "5.5"
    source: "Original item; CED Topic 5.5, Skill 1.A"
    points: 1
    stimulus: |
      A hypothetical case (invented for this course). For the past eight months, Jae, a 23-year-old office worker, has been convinced that his coworkers are placing thoughts into his mind through the office lights, despite clear evidence that this is impossible. He reports hearing voices that comment on what he is doing when no one is there. His sentences often jump between unrelated topics. He has withdrawn from friends and rarely shows emotion in his face or voice. Medical tests found no physical illness or substance use that could explain these experiences.
    prompt: |
      Which class of medication is designed mainly to reduce symptoms like Jae's delusions and hallucinations?
    options:
      - "Benzodiazepines"
      - "Lithium"
      - "Antipsychotics"
      - "Stimulants"
    option_explanations:
      - |
        Benzodiazepines enhance GABA and are used short-term for anxiety, not mainly for psychotic symptoms.
      - |
        Lithium is a mood stabilizer used mainly for bipolar disorders.
      - |
        Correct. Antipsychotic medications, many of which block dopamine receptors, are designed to reduce positive symptoms such as delusions and hallucinations.
      - |
        Stimulants increase dopamine activity and can worsen psychotic symptoms; they are used mainly for ADHD.
    answer: 2
  # ---- Independent items
  - slug: appsych-u05-exam-q13
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; CED Topic 5.3, Skill 2.C"
    points: 1
    prompt: |
      Two psychologists independently diagnose the same 40 people and agree on the diagnosis for 38 of them. This result shows that their diagnoses have
    options:
      - "high inter-rater reliability"
      - "high validity"
      - "high comorbidity"
      - "high prevalence"
    option_explanations:
      - |
        Correct. Agreement between independent raters (38 of 40, or 95%) is inter-rater reliability, a measure of consistency.
      - |
        Agreement does not show the diagnoses are accurate; both raters could share the same error. Validity needs other evidence.
      - |
        Comorbidity is one person having two or more disorders, not agreement between clinicians.
      - |
        Prevalence is how common a disorder is in a population, which this result does not measure.
    answer: 0
  - slug: appsych-u05-exam-q14
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; CED Topic 5.3, Skill 1.B"
    points: 1
    prompt: |
      A psychologist links rising rates of anxiety in a community to unemployment after a factory closed, crowded housing and discrimination. Which perspective is the psychologist taking?
    options:
      - "Biological"
      - "Psychodynamic"
      - "Sociocultural"
      - "Humanistic"
    option_explanations:
      - |
        A biological explanation would focus on genes, brain chemistry or hormones rather than community conditions.
      - |
        A psychodynamic explanation would focus on unconscious conflicts rooted in childhood.
      - |
        Correct. The sociocultural perspective explains disorders through social and cultural conditions such as poverty, housing and discrimination.
      - |
        A humanistic explanation would focus on blocked personal growth and self-concept, not economic and social conditions.
    answer: 2
  - slug: appsych-u05-exam-q15
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; CED Topic 5.3, Skill 1.A"
    points: 1
    prompt: |
      Which statement describes the medical model of psychological disorders?
    options:
      - "Disorders arise only from irrational beliefs that must be disputed."
      - "Disorders are moral failings that a person should overcome by willpower."
      - "Disorders are normal reactions that need no treatment."
      - "Disorders are illnesses with physical causes that can be diagnosed, treated and in many cases cured."
    option_explanations:
      - |
        Irrational beliefs are the focus of cognitive approaches such as REBT, not the medical model.
      - |
        The medical model replaced moralistic views by treating disorders as illnesses rather than personal failings.
      - |
        The medical model holds that disorders are illnesses needing diagnosis and treatment.
      - |
        Correct. The medical model treats disorders as illnesses with physical causes, an approach that reduced blame but can underplay psychological and social factors.
    answer: 3
  - slug: appsych-u05-exam-q16
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    prompt: |
      For a year, Ms. Lin has avoided buses, malls and concerts because she fears she would not be able to escape or get help if she suddenly felt panicky there. Which disorder do these features most closely match?
    options:
      - "Specific phobia"
      - "Agoraphobia"
      - "Social anxiety disorder"
      - "Obsessive-compulsive disorder"
    option_explanations:
      - |
        A specific phobia centers on a particular object or situation; Ms. Lin's fear spans many places where escape might be hard.
      - |
        Correct. Fear and avoidance of situations where escape or help might be difficult if panic-like symptoms occurred defines agoraphobia.
      - |
        Social anxiety disorder is fear of being judged by others, not of being unable to escape.
      - |
        OCD involves obsessions and compulsions, not avoidance of places where escape might be difficult.
    answer: 1
  - slug: appsych-u05-exam-q17
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    prompt: |
      A student skips class presentations, eats lunch alone in the library, and feels intense dread that classmates will judge her as awkward if she speaks. Which disorder do these features most closely match?
    options:
      - "Generalized anxiety disorder"
      - "Social anxiety disorder"
      - "Panic disorder"
      - "Avoidant personality disorder diagnosed in every shy student"
    option_explanations:
      - |
        Generalized anxiety disorder is worry about many everyday matters; this fear is specific to being judged by others.
      - |
        Correct. Intense fear of scrutiny or judgment in social situations, leading to avoidance, is the core of social anxiety disorder.
      - |
        Panic disorder involves recurrent unexpected panic attacks, which are not described.
      - |
        Shyness alone is not a disorder, and a personality disorder requires an enduring, pervasive pattern; this option overgeneralizes.
    answer: 1
  - slug: appsych-u05-exam-q18
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    prompt: |
      Which disorder is grouped with obsessive-compulsive disorder in the DSM-5-TR's obsessive-compulsive and related disorders?
    options:
      - "Hoarding disorder"
      - "Panic disorder"
      - "Posttraumatic stress disorder"
      - "Persistent depressive disorder"
    option_explanations:
      - |
        Correct. Hoarding disorder, body dysmorphic disorder, trichotillomania (hair-pulling disorder) and excoriation (skin-picking) disorder are grouped with OCD.
      - |
        Panic disorder is one of the anxiety disorders.
      - |
        PTSD is in the trauma- and stressor-related disorders group.
      - |
        Persistent depressive disorder is one of the depressive disorders.
    answer: 0
  - slug: appsych-u05-exam-q19
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    prompt: |
      Two weeks after a serious house fire, a teenager has nightmares, avoids the street where it happened and startles easily. Why would a clinician be unlikely to diagnose posttraumatic stress disorder at this point?
    options:
      - "PTSD can only follow military combat."
      - "Nightmares are not a symptom of PTSD."
      - "Teenagers cannot develop PTSD."
      - "PTSD requires symptoms lasting more than a month; similar symptoms from three days to one month are acute stress disorder."
    option_explanations:
      - |
        PTSD can follow many kinds of trauma, including fires, accidents, assaults and disasters.
      - |
        Intrusive memories and nightmares are among the core symptoms of PTSD.
      - |
        PTSD can occur at any age, including adolescence.
      - |
        Correct. Duration distinguishes the two: symptoms lasting three days to one month after trauma fit acute stress disorder, and PTSD requires more than a month.
    answer: 3
  - slug: appsych-u05-exam-q20
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    prompt: |
      For three years, an adult has felt down on most days, with low energy and poor self-esteem, though rarely as severely as in a major depressive episode, and has never had a manic or hypomanic episode. Which diagnosis do these features most closely fit?
    options:
      - "Bipolar II disorder"
      - "Major depressive disorder with a seasonal pattern"
      - "Persistent depressive disorder"
      - "Generalized anxiety disorder"
    option_explanations:
      - |
        Bipolar II requires at least one hypomanic episode, which this person has never had.
      - |
        A seasonal pattern means episodes tied to a time of year; this low mood has lasted continuously for years.
      - |
        Correct. A depressed mood on most days for at least two years in an adult, often milder than a major depressive episode, defines persistent depressive disorder.
      - |
        Generalized anxiety disorder centers on excessive worry, not long-lasting low mood.
    answer: 2
  - slug: appsych-u05-exam-q21
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    prompt: |
      A woman has had two major depressive episodes and, in between, a five-day period of unusually high energy and productivity that friends noticed but that did not impair her work or lead to hospitalization. She has never had a full manic episode. Which diagnosis do these features most closely fit?
    options:
      - "Bipolar II disorder"
      - "Bipolar I disorder"
      - "Persistent depressive disorder"
      - "Schizophrenia"
    option_explanations:
      - |
        Correct. At least one hypomanic episode (milder, at least four days, without severe impairment) plus major depressive episodes, with no full mania, defines bipolar II.
      - |
        Bipolar I requires a full manic episode, which she has never had.
      - |
        Persistent depressive disorder involves no hypomanic or manic episodes.
      - |
        Schizophrenia involves delusions, hallucinations or disorganization, none of which is described.
    answer: 0
  - slug: appsych-u05-exam-q22
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    prompt: |
      After a breakup, Ava spends hours every night replaying what went wrong and asking herself why she feels so bad, without moving toward any plan or action. Research links this pattern most closely to longer depressive episodes. What is it called?
    options:
      - "Catatonia"
      - "Flow"
      - "Transference"
      - "Rumination"
    option_explanations:
      - |
        Catatonia is a disturbance of movement or responsiveness, not repetitive thinking.
      - |
        Flow is absorption in a well-matched challenge, associated with enjoyment rather than distress.
      - |
        Transference is redirecting feelings onto a therapist in psychodynamic therapy.
      - |
        Correct. Rumination is repetitively focusing on one's distress and its causes without moving to solutions, and it predicts longer and more severe depressive episodes.
    answer: 3
  - slug: appsych-u05-exam-q23
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    prompt: |
      Some researchers argue that dissociative identity disorder can be shaped by therapist suggestion and cultural portrayals of the condition. This position is known as the
    options:
      - "dopamine hypothesis"
      - "sociocognitive view"
      - "biological preparedness view"
      - "medical model"
    option_explanations:
      - |
        The dopamine hypothesis concerns schizophrenia's positive symptoms, not dissociative identity disorder.
      - |
        Correct. The sociocognitive view holds that expectations, suggestion and cultural scripts can shape how dissociative identity symptoms appear.
      - |
        Biological preparedness explains why some fears are learned easily, not how dissociative symptoms are shaped.
      - |
        The medical model treats disorders as illnesses with physical causes; it is not this argument about suggestion.
    answer: 1
  - slug: appsych-u05-exam-q24
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    prompt: |
      A man with no physical symptoms spends hours each day researching rare diseases, is convinced he has a serious undiagnosed illness, and keeps worrying even after several normal medical exams. Which disorder do these features most closely fit?
    options:
      - "Functional neurological symptom disorder"
      - "Somatic symptom disorder"
      - "Illness anxiety disorder"
      - "Generalized anxiety disorder"
    option_explanations:
      - |
        Functional neurological symptom disorder involves real neurological symptoms such as weakness or numbness; this man has none.
      - |
        Somatic symptom disorder centers on distressing physical symptoms; this man's preoccupation exists without symptoms.
      - |
        Correct. Preoccupation with having a serious illness, with few or no symptoms and persistent worry despite reassurance, defines illness anxiety disorder.
      - |
        Generalized anxiety disorder is worry about many everyday matters, while this worry is focused on having an illness.
    answer: 2
  - slug: appsych-u05-exam-q25
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skill 1.A"
    points: 1
    prompt: |
      Avoidant and dependent personality disorders belong to which cluster, and what do disorders in that cluster share?
    options:
      - "Cluster A: odd or eccentric patterns"
      - "Cluster B: dramatic, emotional or erratic patterns"
      - "Cluster C: anxious or fearful patterns"
      - "They are not personality disorders but anxiety disorders."
    option_explanations:
      - |
        Cluster A includes paranoid, schizoid and schizotypal personality disorders.
      - |
        Cluster B includes antisocial, borderline, histrionic and narcissistic personality disorders.
      - |
        Correct. Cluster C, the anxious or fearful cluster, includes avoidant, dependent and obsessive-compulsive personality disorders.
      - |
        Both are personality disorders in the DSM-5-TR, defined by enduring, inflexible patterns rather than episodes of anxiety.
    answer: 2
