  - slug: appsych-u05-exam-q31
    type: multiple_choice
    topic_code: "5.5"
    source: "Original item; CED Topic 5.5, Skill 2.B"
    points: 1
    stimulus: |
      A hypothetical study (invented for this course). One hundred fifty adults diagnosed with social anxiety disorder, recruited through clinics in one city, gave informed consent and were randomly assigned to 12 weeks of group CBT, 12 weeks of individual CBT, or a waitlist (they received treatment after the study). A clinician who did not know each participant's group rated social anxiety symptoms before and after (scale 0 to 100).

      | Condition | n | Mean reduction in symptoms | Standard deviation |
      |---|---|---|---|
      | Group CBT | 50 | 22 | 12 |
      | Individual CBT | 50 | 25 | 13 |
      | Waitlist | 50 | 6 | 10 |

      Both CBT conditions improved significantly more than the waitlist (p under .001). The two CBT conditions did not differ significantly (p = .24).
    prompt: |
      Why did the researchers include a waitlist group?
    options:
      - "To give the waitlist group a stronger treatment"
      - "To make the study double-blind for participants"
      - "To ensure that every participant received CBT at the same time"
      - "To estimate how much symptoms change over 12 weeks without the treatment, so the effect of CBT can be separated from time, expectations and regression toward the mean"
    option_explanations:
      - |
        The waitlist group received no treatment during the study; that is its purpose as a control.
      - |
        Participants knew whether they were in therapy or waiting, so a waitlist does not blind them.
      - |
        The waitlist group received CBT only after the study ended, so not everyone was treated at the same time.
      - |
        Correct. A no-treatment comparison shows how much improvement occurs anyway; the waitlist group's 6-point drop is the baseline that CBT must beat.
    answer: 3
  - slug: appsych-u05-exam-q32
    type: multiple_choice
