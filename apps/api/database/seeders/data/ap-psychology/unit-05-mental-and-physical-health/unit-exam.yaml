  - slug: appsych-u05-exam-q42
    type: short_answer
    topic_code: "5.3"
    source: "Original item; CED Topic 5.3, Skill 1.A"
    points: 3
    prompt: |
      Tomas, 16, has had a persistent fear of public speaking since he froze and was laughed at during a class presentation in seventh grade. He now avoids classes with presentations.

      (a) Explain how the behavioral perspective would account for the start and the continuation of his fear.
      (b) Explain how the cognitive perspective would account for his fear.
      (c) Describe one treatment that follows from either perspective.
    answer: |
      (a) Behavioral: being laughed at (an unconditioned stimulus causing embarrassment and fear) was paired with speaking in front of the class, which became a conditioned stimulus for fear. Avoiding presentations brings relief, so avoidance is negatively reinforced, and the fear never extinguishes.
      (b) Cognitive: Tomas holds beliefs such as "Everyone will laugh at me" and "If I stumble, it will be a disaster", overestimating the likelihood and cost of embarrassment, and these thoughts produce anxiety.
      (c) Behavioral: systematic desensitization or gradual exposure, such as speaking first to one friend, then a small group, then the class, while relaxed. Cognitive: cognitive therapy to identify and test his catastrophic thoughts against evidence (or CBT, which combines both).
    explanation: |
      Three points, one per part. (a) Classical conditioning for the start or negative reinforcement of avoidance for the continuation, applied to Tomas (both earn the point if either is applied correctly). (b) A specific maladaptive thought or belief causing his fear. (c) A treatment that matches the chosen perspective and is described, not just named.
  - slug: appsych-u05-exam-q43
    type: long_answer
    topic_code: "5.1"
    source: "Original item; CED Topic 5.1, Skills 2.A, 2.B, 2.C, 2.D, 3.C and 4.B (Article Analysis Question)"
    points: 7
    stimulus: |
      A hypothetical study (invented for this course).

      Participants: 96 undergraduates at one university who volunteered after seeing a flyer for a "study on walking and mood". All gave informed consent.

      Method: Participants were randomly assigned to take a 30-minute walk either along a tree-lined park path or along a busy commercial street, at the same pace and time of day. Before and after the walk, each participant provided a saliva sample, which was analyzed for cortisol, and completed a 10-item perceived-stress questionnaire (scores 10 to 50, higher means more stress). Participants were told the purpose of comparing the two routes only after the study ended, at a debriefing.

      Results: Perceived-stress scores fell by a mean of 6.4 points (SD = 3.9) in the park group and by 2.1 points (SD = 4.2) in the street group. The difference was statistically significant (p under .001), with an effect size of d = 1.06. Cortisol fell more in the park group as well (p = .01).
    prompt: |
      (A) Identify the research method used in the study.
      (B) State the operational definition of perceived stress.
      (C) Describe what the effect size (d = 1.06) shows about the difference between the groups.
      (D) Identify one ethical guideline applied by the researchers.
      (E) Explain the extent to which the research findings may or may not be generalizable, using specific and relevant evidence from the study.
      (F) Explain how the findings support or refute the claim that time in natural settings can reduce the body's stress response, using a psychological concept from this unit. (2 points)
    answer: |
      (A) An experiment: participants were randomly assigned to walk in the park or on the street, and the walking route was manipulated.
      (B) The change in each participant's score (10 to 50) on the 10-item perceived-stress questionnaire from before to after the walk.
      (C) d = 1.06 is a large effect: the park group's average drop in perceived stress was about one standard deviation larger than the street group's, a difference of practical importance, not just a statistically detectable one.
      (D) Informed consent was obtained, and participants were debriefed about the study's purpose afterward (needed because the flyer did not reveal the route comparison).
      (E) Limited: all 96 participants were volunteer undergraduates at one university, so the results may not generalize to older adults, younger students, people with long-term stress or people in other places. Random assignment supports a causal conclusion within this sample, but the sample was not randomly selected.
      (F) The findings support the claim. Because participants were randomly assigned, the larger drops in perceived stress and in cortisol can be attributed to the park route. Cortisol is the end product of the HPA axis, so its lower level shows the body's stress response was reduced, not just participants' feelings, and a calmer, less threatening setting may lead to a more benign appraisal of the situation.
    explanation: |
      Seven points.
      (A) 1 point: experiment.
      (B) 1 point: the change in the 10-item perceived-stress questionnaire score (the questionnaire score alone also earns the point).
      (C) 1 point: a large difference, roughly one standard deviation, or practical significance, beyond the statement that it is unlikely to be chance.
      (D) 1 point: informed consent or debriefing (deception about the study's purpose).
      (E) 1 point: a judgment supported by the sample's features (volunteer undergraduates at one university, not randomly selected).
      (F) 2 points: 1 for stating that the findings support the claim, with reference to the results (greater drop in perceived stress or cortisol in the park group); 1 for explaining with a concept such as the HPA axis and cortisol, cognitive appraisal, the sympathetic and parasympathetic nervous systems, or random assignment allowing a causal conclusion.
  - slug: appsych-u05-exam-q44
    type: long_answer
    topic_code: "5.4"
    source: "Original item; CED Topic 5.4, Skills 4.A and 4.B (Evidence-Based Question)"
    points: 7
    stimulus: |
      Three hypothetical studies (all invented for this course) on depressive disorders.

      Source A. A research team examined 120 adults who had been adopted as infants and had been diagnosed with major depressive disorder. Their biological relatives had a rate of depressive disorders about twice that of their adoptive relatives. All participants consented to the use of their family records, which were kept confidential.

      Source B. A longitudinal study measured the explanatory style of 400 first-year college students in September. Students who explained bad events as internal, stable and global were more than twice as likely as other students to report a depressive episode by the end of the year, especially if they also experienced several negative life events during the year (r = +0.31 between pessimistic explanatory style and later symptom scores).

      Source C. A survey of 1,500 adults found that those who reported strong social support from friends and family had lower depressive-symptom scores (r = −0.37), and that the link was strongest among people who had recently experienced a major loss, such as the death of a loved one.
    prompt: |
      (A) Propose a specific and defensible claim based on at least one of the provided sources that responds to the question: What factors contribute to the development of depressive disorders?

      (B) (i) Support your claim using at least one piece of specific and relevant evidence from one of the sources.
      (ii) Explain how the evidence from part B(i) supports your claim using a psychological concept from this unit or an earlier one.

      (C) (i) Support your claim using an additional piece of specific and relevant evidence from a different source than the one you used in part B(i).
      (ii) Explain how the evidence from part C(i) supports your claim using a different psychological concept than the one you used in part B(ii).
    answer: |
      (A) Depressive disorders develop from an interaction of biological vulnerability, thinking patterns and stressful life events, with social support as a buffer.
      (B)(i) Source A: adopted adults with major depressive disorder had biological relatives with about twice the rate of depressive disorders of their adoptive relatives.
      (B)(ii) Adoption studies separate genes from rearing environment; the higher rate among biological relatives, who share genes but not the household, points to a genetic contribution (heritability), a diathesis that makes depression more likely under stress.
      (C)(i) Source B: students with a pessimistic explanatory style in September were more than twice as likely to have a depressive episode by the end of the year, especially if they also had several negative life events.
      (C)(ii) A pessimistic explanatory style (internal, stable, global), like Beck's cognitive triad, leads people to interpret setbacks as personal, permanent and pervasive, producing hopelessness. The stronger effect with negative events fits the diathesis-stress model: a cognitive vulnerability turns into depression when stress occurs. Because the study is correlational, it shows a prediction, not proof of cause.
    explanation: |
      Seven points.
      (A) 1 point: a defensible claim that answers the question.
      (B)(i) 1 point: specific, accurate evidence from one source.
      (B)(ii) 2 points: 1 for a relevant concept (heritability, adoption study, diathesis-stress model, explanatory style, cognitive triad, learned helplessness, social support or tend-and-befriend, stressors) and 1 for explaining how the evidence supports the claim through that concept.
      (C)(i) 1 point: specific evidence from a different source.
      (C)(ii) 2 points: 1 for a different concept and 1 for the explanation linking evidence, concept and claim.
      Notes: all three sources are nonexperimental. A response that states the correlational sources prove cause loses the explanation point for that part unless it qualifies the claim.
