    points: 1
    stimulus: |
      A hypothetical study (invented for this course). One hundred fifty adults diagnosed with social anxiety disorder, recruited through clinics in one city, gave informed consent and were randomly assigned to 12 weeks of group CBT, 12 weeks of individual CBT, or a waitlist (they received treatment after the study). A clinician who did not know each participant's group rated social anxiety symptoms before and after (scale 0 to 100).

      | Condition | n | Mean reduction in symptoms | Standard deviation |
      |---|---|---|---|
      | Group CBT | 50 | 22 | 12 |
      | Individual CBT | 50 | 25 | 13 |
      | Waitlist | 50 | 6 | 10 |

      Both CBT conditions improved significantly more than the waitlist (p under .001). The two CBT conditions did not differ significantly (p = .24).
    prompt: |
      Which conclusion is best supported by these results?
    options:
      - "Individual CBT is clearly better than group CBT because 25 is greater than 22."
      - "For adults like these, both group and individual CBT reduced social anxiety more than waiting, and the study found no reliable difference between the two formats."
      - "Waiting for treatment makes social anxiety worse."
      - "Every participant who received CBT improved by at least 22 points."
    option_explanations:
      - |
        The 3-point difference was not statistically significant (p = .24), so it could easily be due to chance.
      - |
        Correct. Both CBT conditions beat the waitlist significantly after random assignment, supporting a causal conclusion for similar adults, while the two formats did not differ significantly.
      - |
        The waitlist group's symptoms dropped by 6 points on average; they did not get worse.
      - |
        The means describe group averages; the standard deviations of 12 to 13 show that individual changes varied widely.
    answer: 1
