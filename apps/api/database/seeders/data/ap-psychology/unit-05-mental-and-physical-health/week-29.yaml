week: 29
unit: 5
title: "Explaining and Classifying Psychological Disorders"
topics: ["5.3"]
guide: guides/week-29.md
guide_description: |
  What makes a pattern of thoughts, feelings or behavior a psychological disorder (clinically significant
  disturbance that is usually distressing or dysfunctional, judged against cultural context), how the DSM-5-TR and
  the ICD-11 classify disorders by symptoms and duration, reliability and validity of diagnosis, comorbidity and
  cultural concepts of distress, the biopsychosocial approach and the diathesis-stress model, how the
  biological, psychodynamic, behavioral, cognitive, humanistic, evolutionary and sociocultural perspectives each
  explain a disorder, and the risks of labels and stigma, with Rosenhan's 1973 study and the later doubts about
  it. Worked examples: the same symptoms explained from seven perspectives, a hypothetical inter-rater reliability
  study, and person-first language.
flashcards_description: |
  30 cards on defining a psychological disorder, the DSM-5-TR and ICD-11, reliability and validity of
  diagnosis, comorbidity, prevalence, cultural concepts of distress, the medical model, the biopsychosocial
  approach and diathesis-stress model, the seven perspectives on disorders, labeling and stigma, person-first
  language, the insanity defense, and the Rosenhan study.

flashcards:
  - front: "Psychological disorder → working definition"
    back: |
      A syndrome marked by a clinically significant disturbance in a person's thinking, emotion regulation or behavior, usually with significant distress or impaired functioning (dysfunction), and not simply an expected or culturally approved reaction.
    topic_code: "5.3"
  - front: "Dysfunction in defining a disorder → meaning"
    back: |
      The pattern interferes with daily life: school, work, relationships or self-care. Unusual behavior that causes no dysfunction or distress is usually not a disorder.
    topic_code: "5.3"
  - front: "Distress in defining a disorder → meaning"
    back: |
      The person experiences significant suffering because of the pattern. Distress is common in disorders but not required in every one.
    topic_code: "5.3"
  - front: "Deviance in defining a disorder → why it is not enough"
    back: |
      Being statistically unusual or breaking cultural norms does not make a disorder: rare talents and political dissent are deviant too. Norms also differ across cultures and eras.
    topic_code: "5.3"
  - front: "DSM-5-TR → what it is"
    back: |
      The Diagnostic and Statistical Manual of Mental Disorders, Fifth Edition, Text Revision (American Psychiatric Association, 2022). It lists disorders with criteria based on observable symptoms and their duration.
    topic_code: "5.3"
  - front: "DSM-5-TR → what it does and does not do"
    back: |
      It describes symptoms, duration and diagnostic criteria to make diagnosis consistent. It is mostly atheoretical: it does not say what causes each disorder or prescribe treatment.
    topic_code: "5.3"
  - front: "ICD-11 → what it is"
    back: |
      The World Health Organization's International Classification of Diseases, 11th revision (in effect since 2022). Used worldwide for diagnosis and health statistics, including mental disorders.
    topic_code: "5.3"
  - front: "Reliability of diagnosis → meaning"
    back: |
      Consistency: different clinicians using the same criteria on the same person reach the same diagnosis (inter-rater reliability). Structured interviews raise it.
    topic_code: "5.3"
  - front: "Validity of diagnosis → meaning"
    back: |
      Accuracy: the diagnosis captures a real, distinct condition and predicts things such as its course or which treatments help. A diagnosis can be reliable without being valid.
    topic_code: "5.3"
  - front: "Comorbidity → definition"
    back: |
      Two or more disorders occurring in the same person at the same time, such as an anxiety disorder with a depressive disorder. It is common.
    topic_code: "5.3"
  - front: "Prevalence of psychological disorders → rough U.S. figure"
    back: |
      Federal survey estimates put the share of U.S. adults with a mental illness in a given year at roughly one in five. Disorders are common, not rare.
    topic_code: "5.3"
  - front: "Cultural concepts of distress → DSM-5-TR meaning"
    back: |
      Ways that cultural groups experience, explain and express distress, such as ataque de nervios (described in some Latin American communities) or taijin kyofusho (fear of offending others, described in Japan).
    topic_code: "5.3"
  - front: "Culture and diagnosis → why it matters"
    back: |
      Behaviors normal in one culture (hearing a deceased relative's voice while grieving, in some traditions) may seem unusual in another, so clinicians must judge symptoms in cultural context.
    topic_code: "5.3"
  - front: "Medical model of psychological disorders → claim"
    back: |
      Disorders are illnesses with physical causes that can be diagnosed, treated and in many cases cured, usually in a medical setting. It reduced blame, but it can underplay psychological and social causes.
    topic_code: "5.3"
  - front: "Biopsychosocial approach to disorders → claim"
    back: |
      Disorders arise from interacting biological (genes, brain chemistry), psychological (thoughts, learning, stress) and social-cultural (relationships, poverty, culture) factors.
    topic_code: "5.3"
  - front: "Diathesis-stress model → meaning"
    back: |
      A predisposition (diathesis), often genetic or biological, combines with environmental stress to produce a disorder. Either alone is often not enough.
    topic_code: "5.3"
  - front: "Eclectic approach to disorders → meaning"
    back: |
      Drawing on several perspectives and techniques to explain and treat a disorder, depending on the person and the problem. Most practicing clinicians work this way.
    topic_code: "5.3"
  - front: "Biological perspective on disorders → focus"
    back: |
      Genes, neurotransmitters, hormones and brain structure and function, studied with twin and adoption studies, brain imaging and medications.
    topic_code: "5.3"
  - front: "Psychodynamic perspective on disorders → focus"
    back: |
      Unconscious conflicts, often rooted in childhood experience, expressed indirectly as symptoms. Hard to test scientifically.
    topic_code: "5.3"
  - front: "Behavioral perspective on disorders → focus"
    back: |
      Learned responses: classical conditioning (a fear paired with a place), operant conditioning (avoidance negatively reinforced), and observational learning.
    topic_code: "5.3"
  - front: "Cognitive perspective on disorders → focus"
    back: |
      Maladaptive thought patterns and beliefs, such as catastrophizing, overgeneralizing or a negative explanatory style, that shape emotion and behavior.
    topic_code: "5.3"
  - front: "Humanistic perspective on disorders → focus"
    back: |
      Blocked personal growth: a gap between self-concept and experience, often from conditional acceptance by others, that keeps a person from self-actualizing.
    topic_code: "5.3"
  - front: "Evolutionary perspective on disorders → focus"
    back: |
      Whether tendencies behind a disorder were once adaptive, such as readiness to fear snakes or heights, which may explain why some phobias are far more common than others.
    topic_code: "5.3"
  - front: "Sociocultural perspective on disorders → focus"
    back: |
      Social and cultural conditions: poverty, discrimination, family stress, community support and cultural norms about what counts as a problem.
    topic_code: "5.3"
  - front: "Stigma about psychological disorders → meaning and effect"
    back: |
      Negative stereotypes and discrimination toward people with psychological disorders. It discourages people from seeking help and can lower self-esteem.
    topic_code: "5.3"
  - front: "Person-first language → meaning and example"
    back: |
      Naming the person before the condition: a person with schizophrenia, not a schizophrenic. It signals that a diagnosis describes something a person has, not who they are. (Some communities, such as many autistic people, prefer identity-first language; respect the person's choice.)
    topic_code: "5.3"
  - front: "Diagnostic labels → one benefit and one risk"
    back: |
      Benefit: a shared language that guides treatment, research and insurance. Risk: labels can bias how others interpret behavior and can feed stigma and self-fulfilling expectations.
    topic_code: "5.3"
  - front: "Rosenhan study (1973) → what was reported"
    back: |
      Healthy volunteers reported briefly hearing voices to gain admission to psychiatric hospitals, then acted normally. Staff did not detect them, and most were discharged with a diagnosis of schizophrenia in remission.
    topic_code: "5.3"
  - front: "Rosenhan study → criticisms"
    back: |
      Hospital staff were deceived without consent; one false report is a weak test of diagnosis; and later investigators found records suggesting the study may not have been reported accurately.
    topic_code: "5.3"
  - front: "Insanity defense → is it a diagnosis?"
    back: |
      No. Insanity is a legal term for whether a person could understand or control their actions when a crime occurred. It is not a DSM-5-TR diagnosis, and it is rarely used and rarely succeeds.
    topic_code: "5.3"

quiz:
  description: |
    22 questions · about 35 minutes · mostly on this week (topic 5.3: defining disorders, the DSM-5-TR,
    reliability and validity of diagnosis, comorbidity, culture, the diathesis-stress model, the perspectives,
    stigma and labels), with 6 questions (27%) reviewing earlier weeks (twin studies, heuristics, attribution, brain
    imaging, operant conditioning and resilience). Opens with a shared-context set on a hypothetical reliability
    study. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical inter-rater reliability study (5.3)
    - slug: appsych-u05-w29-q01
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 2.C"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). Trained actors followed 50 written case scripts in recorded mock interviews; no real patients were involved. Two clinicians, working separately and without seeing each other's ratings, assigned a diagnosis to each interview. For 25 interviews they used an unstructured conversation; for the other 25 they used a structured interview that asks every person the same DSM-5-TR-based questions in the same order.

        | Interview type | Interviews | Clinicians gave the same diagnosis |
        |---|---|---|
        | Unstructured | 25 | 15 (60%) |
        | Structured | 25 | 22 (88%) |
      prompt: |
        What property of diagnosis does the percentage of agreement between the two clinicians measure?
      options:
        - "Validity, because it shows the diagnoses were correct"
        - "Comorbidity, because two diagnoses were given"
        - "Inter-rater reliability, the consistency of diagnoses across clinicians"
        - "Prevalence, the share of people with a disorder"
      option_explanations:
        - |
          Two clinicians can agree and both be wrong; agreement alone measures consistency, not accuracy.
        - |
          Comorbidity is one person having two or more disorders at once, not two clinicians rating the same case.
        - |
          Correct. When independent raters reach the same diagnosis, the diagnostic process is reliable between raters.
        - |
          Prevalence is how common a disorder is in a population, which this study did not estimate.
      answer: 2
    - slug: appsych-u05-w29-q02
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 3.A"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). Trained actors followed 50 written case scripts in recorded mock interviews; no real patients were involved. Two clinicians, working separately and without seeing each other's ratings, assigned a diagnosis to each interview. For 25 interviews they used an unstructured conversation; for the other 25 they used a structured interview that asks every person the same DSM-5-TR-based questions in the same order.

        | Interview type | Interviews | Clinicians gave the same diagnosis |
        |---|---|---|
        | Unstructured | 25 | 15 (60%) |
        | Structured | 25 | 22 (88%) |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "In these mock interviews, clinicians agreed more often when they used the structured interview."
        - "Structured interviews make clinicians' diagnoses 88% accurate."
        - "Unstructured interviews cause 40% of people to be misdiagnosed."
        - "The actors' scripts were more realistic in the structured condition."
      option_explanations:
        - |
          Correct. Agreement rose from 60% to 88% with the structured interview, so in these cases the structured format produced more consistent diagnoses.
        - |
          88% is the rate of agreement between the two clinicians; whether their shared diagnosis was right (validity) was not measured.
        - |
          Disagreement is not the same as misdiagnosis, and with mock interviews there were no real people to misdiagnose.
        - |
          Nothing in the study compares how realistic the scripts were, and the conditions differed in interview format.
      answer: 0
    - slug: appsych-u05-w29-q03
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 2.D"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). Trained actors followed 50 written case scripts in recorded mock interviews; no real patients were involved. Two clinicians, working separately and without seeing each other's ratings, assigned a diagnosis to each interview. For 25 interviews they used an unstructured conversation; for the other 25 they used a structured interview that asks every person the same DSM-5-TR-based questions in the same order.

        | Interview type | Interviews | Clinicians gave the same diagnosis |
        |---|---|---|
        | Unstructured | 25 | 15 (60%) |
        | Structured | 25 | 22 (88%) |
      prompt: |
        Why might the researchers have used actors and written scripts instead of recordings of real patients' interviews?
      options:
        - "Actors are always more consistent than real patients, so agreement would be guaranteed."
        - "Real patients cannot have diagnoses, so they could not be studied."
        - "Using actors removes the need for any ethical review."
        - "Scripts let every rater judge identical, known material without exposing real patients' private health information."
      option_explanations:
        - |
          Nothing guarantees agreement; the point of the study was to see how often clinicians agree.
        - |
          Real patients do have diagnoses and are often studied, with consent and confidentiality protections.
        - |
          Research with actors and clinicians as participants still needs ethical review and informed consent.
        - |
          Correct. Scripts give the researchers control over what every clinician sees and protect confidentiality, since no real person's private health information is recorded or shared.
      answer: 3
    # ---- Independent items
    - slug: appsych-u05-w29-q04
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A"
      points: 1
      prompt: |
        Reggie, a professional comedian, wears outrageous costumes on stage and is far more outgoing than most people. He is happy, keeps steady relationships and earns a good living. Why would most psychologists say Reggie does not have a psychological disorder?
      options:
        - "His behavior is statistically unusual."
        - "His unusual behavior causes him no distress and does not interfere with his functioning."
        - "Comedians are excluded from the DSM-5-TR."
        - "Only behavior that harms other people counts as a disorder."
      option_explanations:
        - |
          Being unusual (deviant) is exactly what Reggie's behavior is; deviance alone does not make a disorder, so this cannot be the reason.
        - |
          Correct. A disorder involves clinically significant disturbance that usually causes distress or dysfunction; Reggie's unusual style does neither.
        - |
          No occupation is excluded from diagnosis; the criteria concern symptoms and their effects, not jobs.
        - |
          Most disorders involve distress or impairment to the person themselves; harm to others is not the definition.
      answer: 1
    - slug: appsych-u05-w29-q05
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A"
      points: 1
      prompt: |
        Identical twins share a genetic vulnerability to a depressive disorder. One twin develops the disorder after losing her job and going through a divorce in the same year; the other twin, whose life stays stable, does not. Which model best explains this outcome?
      options:
        - "The medical model, because disorders are purely physical"
        - "The adaptation-level phenomenon"
        - "The diathesis-stress model"
        - "The humanistic perspective's idea of unconditional positive regard"
      option_explanations:
        - |
          A purely physical explanation cannot account for why two twins with the same genes had different outcomes.
        - |
          The adaptation-level phenomenon concerns how we get used to new circumstances, not why a disorder develops.
        - |
          Correct. Both twins share the predisposition (diathesis), but only the twin who faced major stressors developed the disorder.
        - |
          Unconditional positive regard is a humanistic idea about growth and therapy; it does not explain the role of shared genes plus stress.
      answer: 2
    - slug: appsych-u05-w29-q06
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A"
      points: 1
      prompt: |
        Which statement best describes the DSM-5-TR?
      options:
        - "It lists psychological disorders with criteria based on observable symptoms and their duration, without saying what causes most of them."
        - "It explains the unconscious causes of each disorder."
        - "It tells clinicians which medication to prescribe for each disorder."
        - "It is a legal code that decides whether a defendant is insane."
      option_explanations:
        - |
          Correct. The DSM-5-TR is a classification system: its criteria describe symptoms and how long they must last, and it is largely neutral about causes.
        - |
          Explaining disorders through unconscious conflict is the psychodynamic perspective; the manual itself does not take a theoretical position on causes.
        - |
          The manual does not prescribe treatment; treatment decisions are made separately by clinicians and patients.
        - |
          Insanity is a legal term decided by courts, not a DSM-5-TR diagnosis.
      answer: 0
    - slug: appsych-u05-w29-q07
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A"
      points: 1
      prompt: |
        A psychologist explains a client's persistent low mood by pointing to her habit of thinking "Every bad thing that happens is my fault, and it will never get better." Which perspective is the psychologist taking?
      options:
        - "Biological"
        - "Psychodynamic"
        - "Sociocultural"
        - "Cognitive"
      option_explanations:
        - |
          A biological explanation would focus on genes, neurotransmitters or brain activity, not on patterns of thought.
        - |
          A psychodynamic explanation would focus on unconscious conflicts from childhood rather than conscious thought habits.
        - |
          A sociocultural explanation would focus on social conditions such as poverty, discrimination or family stress.
        - |
          Correct. The cognitive perspective explains disorders through maladaptive thoughts, here an internal, stable and global explanatory style.
      answer: 3
    - slug: appsych-u05-w29-q08
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 2.D"
      points: 1
      prompt: |
        In David Rosenhan's 1973 study, healthy volunteers gained admission to psychiatric hospitals by reporting that they had briefly heard voices. By today's ethical standards, what is the clearest problem with the study's procedure?
      options:
        - "The volunteers were paid for their time."
        - "The hospital staff were deceived and studied without their informed consent."
        - "The study used more than one hospital."
        - "The results were published in a scientific journal."
      option_explanations:
        - |
          Paying participants a reasonable amount is common and acceptable, as long as payment is not coercive.
        - |
          Correct. The staff whose judgments were being studied did not know they were participants, and they were never asked for consent before the study.
        - |
          Using several sites improves generalizability; it is not an ethical problem.
        - |
          Publishing results is a normal part of science and allows others to examine and criticize the work.
      answer: 1
    - slug: appsych-u05-w29-q09
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.B"
      points: 1
      prompt: |
        A clinician learns that a client's intense fear of making others uncomfortable by his gaze or body odor matches a pattern described in his home culture. Why does the DSM-5-TR include a section on cultural concepts of distress?
      options:
        - "To show that disorders only occur outside Western countries"
        - "To replace the diagnostic criteria for people from other cultures"
        - "To help clinicians recognize that culture shapes how distress is experienced, explained and expressed"
        - "To classify cultural traditions as disorders"
      option_explanations:
        - |
          Disorders occur in every culture; the point is that their expression and explanation vary with culture.
        - |
          The section does not replace the criteria; it helps clinicians apply them with cultural understanding.
        - |
          Correct. Culture shapes which symptoms people experience, how they describe them and what they believe caused them, so clinicians need that context to judge accurately.
        - |
          The section is meant to prevent cultural practices from being misread as disorders, not to label traditions.
      answer: 2
    - slug: appsych-u05-w29-q10
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 3.A (spiral review)"
      points: 1
      prompt: |
        In a hypothetical twin study (invented for this course), when one twin has a particular disorder, the other twin also has it 45% of the time for identical twins and 15% of the time for fraternal twins. What does this pattern most directly suggest?
      options:
        - "Genes contribute to the disorder, but they do not fully determine it."
        - "The disorder is caused entirely by the environment."
        - "The disorder is caused entirely by genes."
        - "Fraternal twins share more genes than identical twins."
      option_explanations:
        - |
          Correct. Higher concordance in identical twins, who share nearly all their genes, points to a genetic contribution; because it is well under 100%, environment matters too.
        - |
          If only environment mattered, identical and fraternal twins raised together would show similar concordance; here identical twins show three times as much.
        - |
          If genes alone caused it, identical twins would be concordant nearly 100% of the time, not 45%.
        - |
          Identical twins share nearly all their genes; fraternal twins share about half, like ordinary siblings.
      answer: 0
    - slug: appsych-u05-w29-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        After seeing several news stories about violent crimes that mention a suspect's psychiatric history, a person concludes that most people with psychological disorders are dangerous. Research shows that people with psychological disorders are more often victims of violence than perpetrators. Which thinking error explains the person's conclusion?
      options:
        - "Functional fixedness"
        - "The framing effect"
        - "Mental set"
        - "The availability heuristic"
      option_explanations:
        - |
          Functional fixedness is seeing an object only in its usual use; it does not involve estimating how common something is.
        - |
          The framing effect is the way the wording of a choice changes decisions; this is about judging frequency from vivid examples.
        - |
          A mental set is approaching problems in a way that worked before; it does not explain overestimating a rare event.
        - |
          Correct. Vivid, memorable news stories come to mind easily, so the person judges such events as far more common than they are.
      answer: 3
    - slug: appsych-u05-w29-q12
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A classmate who has a depressive disorder stops turning in homework. Another student says, "She's just lazy," without considering that her condition makes concentration and energy hard to sustain. This judgment is an example of
      options:
        - "the self-serving bias"
        - "the fundamental attribution error"
        - "the false consensus effect"
        - "the just-world hypothesis applied to the student's own successes"
      option_explanations:
        - |
          The self-serving bias concerns explaining one's own successes and failures, not another person's behavior.
        - |
          Correct. The student explains someone else's behavior by her character (laziness) and underestimates situational or health factors that affect it.
        - |
          The false consensus effect is overestimating how many people share one's own opinions or behaviors.
        - |
          The just-world hypothesis is the belief that people get what they deserve; the judgment here explains the classmate's behavior by her character, not by what she deserves.
      answer: 1
    - slug: appsych-u05-w29-q13
      type: multi_select
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.B"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following statements use person-first, non-stigmatizing language? Select all that apply.
      options:
        - "My neighbor is a person with bipolar disorder."
        - "The schizophrenics in the study were tested first."
        - "Participants with an anxiety disorder completed the survey."
        - "He has been diagnosed with major depressive disorder."
        - "She's totally psycho about keeping her room clean."
      option_explanations:
        - |
          Correct. Naming the person first and the disorder second signals the diagnosis is something a person has, not their whole identity.
        - |
          Calling people "schizophrenics" defines them by the diagnosis; "people with schizophrenia" is person-first.
        - |
          Correct. "Participants with an anxiety disorder" puts the people before the condition, the standard in research writing.
        - |
          Correct. Saying someone has been diagnosed with a disorder describes the condition without labeling the person.
        - |
          Slang like "psycho" uses a stigmatizing term casually and trivializes real disorders.
      answer: [0, 2, 3]
    - slug: appsych-u05-w29-q14
      type: multi_select
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 2.A (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        Researchers studying the biological perspective on disorders want to see which brain areas are active while participants perform a task. Which methods show brain activity (function), not only structure? Select all that apply.
      options:
        - "fMRI (functional magnetic resonance imaging)"
        - "PET scan"
        - "CT scan"
        - "EEG"
        - "Structural MRI"
      option_explanations:
        - |
          Correct. fMRI tracks changes in blood oxygen, showing which areas become more active during a task.
        - |
          Correct. PET tracks where a radioactive form of glucose is used, revealing active brain areas.
        - |
          A CT scan uses X-rays to show the brain's structure, not its activity.
        - |
          Correct. EEG records the brain's electrical activity through scalp electrodes, with very good timing but poor localization.
        - |
          A structural MRI gives detailed images of anatomy but does not show which areas are active.
      answer: [0, 1, 3]
    - slug: appsych-u05-w29-q15
      type: true_false
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A"
      points: 1
      prompt: |
        True or false: "Insanity" is one of the diagnoses listed in the DSM-5-TR.
      answer: false
      explanation: |
        False. Insanity is a legal concept about whether a person could understand or control their actions at the time of a crime, decided by courts. It is not a psychological diagnosis, and the insanity defense is rarely used and rarely succeeds.
    - slug: appsych-u05-w29-q16
      type: true_false
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A"
      points: 1
      prompt: |
        True or false: A diagnosis can be highly reliable but still not valid.
      answer: true
      explanation: |
        True. Reliability is consistency: clinicians agree. Validity is accuracy: the diagnosis captures a real condition and predicts its course or response to treatment. Clinicians could consistently agree on a category that does not describe a meaningful condition, just as a scale that always reads 2 kilograms too heavy is consistent but wrong.
    - slug: appsych-u05-w29-q17
      type: true_false
      topic_code: "5.2"
      source: "Original item; CED Topic 5.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: Resilience is a rare trait found only in a few exceptional people.
      answer: false
      explanation: |
        False. Research on children facing adversity finds that resilience is common, built from ordinary protective factors such as a caring adult, friendships and problem-solving skills. It is better seen as a process that can be supported than as a fixed, rare trait.
    - slug: appsych-u05-w29-q18
      type: fill_blank
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A"
      points: 1
      prompt: |
        When a person has two or more psychological disorders at the same time, such as an anxiety disorder and a depressive disorder, clinicians call this ____.
      answer: ["comorbidity", "co-morbidity", "co morbidity"]
      explanation: |
        Comorbidity is the co-occurrence of two or more disorders in the same person. It is common, which complicates both research and treatment.
    - slug: appsych-u05-w29-q19
      type: fill_blank
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        A person who fears elevators takes the stairs and feels immediate relief from anxiety, so avoiding elevators becomes more likely. In operant terms, the avoidance is strengthened by ____ reinforcement.
      answer: ["negative"]
      explanation: |
        Negative reinforcement strengthens a behavior by removing something unpleasant, here anxiety. The behavioral perspective uses this to explain why avoidance keeps fears going: the person never learns the elevator is safe.
    - slug: appsych-u05-w29-q20
      type: short_answer
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 1.A"
      points: 2
      prompt: |
        Noah has had an intense fear of dogs since he was bitten at age six; he avoids parks and friends' houses with dogs. Explain how (a) the behavioral perspective and (b) the cognitive perspective would each explain Noah's fear.
      answer: |
        (a) Behavioral: the bite (unconditioned stimulus) caused pain and fear, and dogs became a conditioned stimulus for fear through classical conditioning; avoiding dogs is negatively reinforced because it removes anxiety, so the fear never extinguishes.
        (b) Cognitive: Noah holds beliefs such as "Any dog will bite me" and overestimates the danger (catastrophizing, overgeneralizing from one bite), and these thoughts produce fear and avoidance.
      explanation: |
        Two points. (a) 1 point: conditioning (classical pairing of dogs with pain, or avoidance maintained by negative reinforcement) applied to Noah. (b) 1 point: a specific maladaptive thought or belief about dogs that produces the fear. Definitions without application to Noah earn nothing.
    - slug: appsych-u05-w29-q21
      type: short_answer
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skill 4.B"
      points: 2
      prompt: |
        Explain one benefit and one risk of giving a person a diagnostic label such as "generalized anxiety disorder."
      answer: |
        Benefit: the label gives clinicians, researchers and the person a shared name that can guide evidence-based treatment, access to services or school accommodations, and the relief of knowing others share the experience.
        Risk: others may interpret the person's ordinary behavior through the label, and stigma can lead to discrimination, lowered expectations and reluctance to seek help.
      explanation: |
        Two points: 1 for a benefit (communication, guiding treatment, access to services, validation) and 1 for a risk (stigma, biased interpretation of behavior, self-fulfilling expectations, discrimination), each explained, not just named.
    - slug: appsych-u05-w29-q22
      type: long_answer
      topic_code: "5.3"
      source: "Original item; CED Topic 5.3, Skills 2.A, 2.B, 2.D, 3.C and 4.B (mini article analysis)"
      points: 6
      stimulus: |
        A hypothetical study (invented for this course). One hundred twenty adult volunteers recruited online were randomly assigned to read one of two versions of a short description of a job applicant named Alex. Both versions described the same work history and the same behavior in an interview. In the label version, one sentence added that Alex "has a diagnosis of a psychological disorder and is in treatment"; the no-label version omitted that sentence. Participants then rated how willing they would be to work alongside Alex on a scale from 1 (not at all willing) to 7 (very willing).

        | Version | n | Mean willingness | Standard deviation |
        |---|---|---|---|
        | Label | 60 | 4.1 | 1.4 |
        | No label | 60 | 5.3 | 1.2 |

        The difference was statistically significant (p under .001; effect size d = 0.92). Participants were told the study was about "first impressions of job applicants" and were fully debriefed afterward about its real purpose.
      prompt: |
        (A) Identify the research method used, and explain how you know.
        (B) State the operational definition of willingness to work with Alex.
        (C) Explain what the effect size (d = 0.92) adds to the information given by the p-value.
        (D) Identify one ethical guideline the researchers applied, and explain why it was needed here.
        (E) Explain one reason the results may not generalize to how real employers make hiring decisions.
        (F) Explain how the findings support the claim that diagnostic labels can contribute to stigma, using one concept from this week.
      answer: |
        (A) An experiment: participants were randomly assigned to the label or no-label version, and the researchers manipulated whether the label sentence appeared.
        (B) Each participant's rating, from 1 to 7, of how willing they would be to work alongside Alex.
        (C) The p-value shows the difference is unlikely to be due to chance; d = 0.92 shows the difference is large, almost one standard deviation, so the label made a practically important difference, not just a detectable one.
        (D) Debriefing: participants were misled about the study's purpose (deception), so they had to be told the real purpose afterward and given a chance to ask questions.
        (E) Online volunteers rating a short written description are not employers making real, consequential decisions with full information, so real hiring may differ.
        (F) With everything else identical, adding only a label lowered willingness to work with Alex by 1.2 points. This shows stigma: a negative stereotype attached to the label changed how participants judged the same behavior and applicant.
      explanation: |
        Six points.
        (A) 1 point: experiment, justified by random assignment or manipulation of the label.
        (B) 1 point: the 1 to 7 willingness rating.
        (C) 1 point: effect size describes the size or practical importance of the difference (large), beyond the p-value's statement that it is unlikely to be chance.
        (D) 1 point: debriefing tied to the deception about the study's purpose (informed consent with a reason also earns the point).
        (E) 1 point: a specific difference between the sample or task and real hiring (volunteers versus employers, a description versus an interview, no real stakes).
        (F) 1 point: uses the result (lower willingness in the label condition) and explains it with stigma, labeling or stereotypes biasing perception.
