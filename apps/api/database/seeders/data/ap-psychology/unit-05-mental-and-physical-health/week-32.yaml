week: 32
unit: 5
title: "Treatment of Psychological Disorders"
topics: ["5.5"]
guide: guides/week-32.md
guide_description: |
  How psychological disorders are treated, described scientifically rather than as advice: psychodynamic therapy
  (free association, resistance, transference, interpretation), humanistic person-centered therapy (genuineness,
  unconditional positive regard, empathy, active listening), behavior therapies based on classical and operant
  conditioning (exposure, systematic desensitization, aversive conditioning, token economies), cognitive
  therapies (Beck's cognitive therapy, Ellis's rational emotive behavior therapy), cognitive-behavioral and
  dialectical behavior therapy, group and family therapy, how researchers judge whether therapy works
  (placebo, regression toward the mean, randomized controlled trials, meta-analysis, effect size, the
  therapeutic alliance), cultural humility and the ethics of confidentiality, and the biomedical therapies
  (antipsychotic, antidepressant, antianxiety and mood-stabilizing medications, ECT, rTMS and the history of
  psychosurgery). Worked examples: building an anxiety hierarchy, disputing an irrational belief, and reading a
  hypothetical double-blind, placebo-controlled trial.
flashcards_description: |
  34 cards on psychodynamic, humanistic, behavioral, cognitive, cognitive-behavioral, dialectical behavior, group
  and family therapies, how therapy is evaluated, ethics and culture in therapy, and the biomedical therapies with
  their uses and side effects.

flashcards:
  - front: "Psychotherapy → definition"
    back: |
      Treatment involving psychological techniques, in which a trained professional and a person (or group) interact to reduce distress and improve functioning.
    topic_code: "5.5"
  - front: "Eclectic approach to therapy → meaning"
    back: |
      Using techniques from several forms of therapy, chosen to fit the person and the problem. Most therapists work this way.
    topic_code: "5.5"
  - front: "Psychoanalysis (Freud) → goal"
    back: |
      Bring unconscious conflicts into conscious awareness, giving insight that releases the energy the conflicts consumed. Long, intensive and hard to test scientifically.
    topic_code: "5.5"
  - front: "Free association (psychoanalysis) → technique"
    back: |
      The client says whatever comes to mind, without censoring, so the analyst can look for patterns that point to unconscious material.
    topic_code: "5.5"
  - front: "Resistance (psychoanalysis) → meaning"
    back: |
      Blocking anxiety-laden material from awareness: changing the subject, missing sessions or going blank when approaching a sensitive topic.
    topic_code: "5.5"
  - front: "Transference (psychoanalysis) → meaning"
    back: |
      The client redirects feelings from important relationships, such as with a parent, onto the therapist; the analyst uses it to explore those relationships.
    topic_code: "5.5"
  - front: "Interpretation and dream analysis (psychoanalysis) → meaning"
    back: |
      The analyst suggests the hidden meaning of resistance, transference, slips or dreams (whose remembered content is interpreted for underlying meaning) to promote insight.
    topic_code: "5.5"
  - front: "Modern psychodynamic therapy → how it differs from classic psychoanalysis"
    back: |
      Shorter, face to face, and focused on current relationship patterns and recurring themes, while still looking for underlying feelings and past influences.
    topic_code: "5.5"
  - front: "Person-centered (client-centered) therapy (Rogers) → approach"
    back: |
      A humanistic, nondirective therapy in which the therapist offers genuineness, unconditional positive regard and empathy so the client can grow toward self-acceptance and self-actualization.
    topic_code: "5.5"
  - front: "Active listening → meaning"
    back: |
      Echoing, restating and seeking clarification of what the person says and feels, to show understanding without judging or directing.
    topic_code: "5.5"
  - front: "Insight therapies versus behavior therapies → difference"
    back: |
      Insight therapies (psychodynamic, humanistic) aim to increase self-awareness of underlying causes. Behavior therapies apply learning principles to change problem behaviors directly.
    topic_code: "5.5"
  - front: "Exposure therapy → meaning"
    back: |
      Treating anxiety by having the person face the feared object or situation, in real life, imagination or virtual reality, without escaping, so the fear response extinguishes.
    topic_code: "5.5"
  - front: "Systematic desensitization (Wolpe) → steps"
    back: |
      Learn a relaxation technique; build an anxiety hierarchy from least to most feared situations; pair relaxation with each step in turn, moving up only when calm. A form of counterconditioning.
    topic_code: "5.5"
  - front: "Counterconditioning (Mary Cover Jones) → the early case"
    back: |
      In 1924 Jones reduced a young boy's fear of a rabbit by bringing the rabbit gradually closer while he ate food he enjoyed, pairing the feared stimulus with a pleasant response.
    topic_code: "5.5"
  - front: "Flooding → meaning"
    back: |
      Intense, prolonged exposure to the feared stimulus from the start, rather than in gradual steps, until the fear subsides. Used with consent and care.
    topic_code: "5.5"
  - front: "Aversive conditioning → meaning"
    back: |
      Pairing an unwanted behavior with an unpleasant stimulus so it becomes associated with discomfort, such as a bitter-tasting nail polish to reduce nail biting.
    topic_code: "5.5"
  - front: "Token economy → meaning"
    back: |
      An operant system in which desired behaviors earn tokens (secondary reinforcers) that can be exchanged for privileges or treats. Used in schools, hospitals and residential programs.
    topic_code: "5.5"
  - front: "Cognitive therapy (Beck) → approach"
    back: |
      Helps people identify automatic negative thoughts and cognitive distortions (catastrophizing, overgeneralizing, all-or-nothing thinking), test them against evidence and replace them with more realistic thoughts.
    topic_code: "5.5"
  - front: "Rational emotive behavior therapy (Ellis) → approach"
    back: |
      A confrontational cognitive therapy: the ABC model holds that an activating event (A) leads to consequences (C) through beliefs (B); the therapist vigorously disputes irrational beliefs such as "I must be liked by everyone."
    topic_code: "5.5"
  - front: "Cognitive-behavioral therapy (CBT) → approach"
    back: |
      Combines changing thought patterns with changing behavior through homework and practice. Among the best-supported therapies for anxiety and depressive disorders.
    topic_code: "5.5"
  - front: "Dialectical behavior therapy (Linehan) → approach"
    back: |
      A cognitive-behavioral therapy developed for people with borderline personality disorder that balances acceptance and change, teaching mindfulness, distress tolerance, emotion regulation and interpersonal skills.
    topic_code: "5.5"
  - front: "Group therapy and family therapy → benefits"
    back: |
      Group therapy saves time and cost and shows people they are not alone. Family therapy treats the family as a system and works on communication patterns among its members.
    topic_code: "5.5"
  - front: "Eysenck's 1952 critique of psychotherapy → claim"
    back: |
      Hans Eysenck argued that people receiving psychotherapy improved no more than would be expected through spontaneous remission, which spurred much more careful outcome research.
    topic_code: "5.5"
  - front: "Meta-analysis of psychotherapy outcomes → what it is and what it found"
    back: |
      A statistical method that combines the results of many studies. Early meta-analyses (Smith and Glass, 1977) found the average person in therapy was better off than about three-quarters of untreated people.
    topic_code: "5.5"
  - front: "Therapeutic alliance → meaning and importance"
    back: |
      The bond of trust and shared goals between therapist and client. It is one of the strongest predictors of good outcomes across many kinds of therapy.
    topic_code: "5.5"
  - front: "Regression toward the mean in therapy research → why it matters"
    back: |
      People often start therapy when symptoms are at their worst; extreme states tend to move back toward the average on their own, which can make an ineffective treatment look effective without a control group.
    topic_code: "5.5"
  - front: "Cultural humility in therapy → meaning"
    back: |
      A therapist's ongoing openness to learning about a client's culture, values and identity, and awareness of their own biases. A culturally responsive approach improves the alliance.
    topic_code: "5.5"
  - front: "Confidentiality in therapy → rule and limit"
    back: |
      What a client says is kept private, but therapists must act to protect safety when there is serious risk of harm to the client or others, a duty linked to the 1976 Tarasoff court decision.
    topic_code: "5.5"
  - front: "Antipsychotic medications → use and a major side effect"
    back: |
      Used for schizophrenia and other psychotic disorders; many block dopamine receptors and reduce positive symptoms. Long-term use of older antipsychotics can cause tardive dyskinesia, involuntary movements of the face and body.
    topic_code: "5.5"
  - front: "SSRIs (selective serotonin reuptake inhibitors) → how they work"
    back: |
      Antidepressants that block the reuptake of serotonin, leaving more serotonin in the synapse. Their mood effects usually take several weeks to appear. Also used for anxiety disorders and OCD.
    topic_code: "5.5"
  - front: "Benzodiazepines → use and how they work"
    back: |
      Antianxiety medications that enhance the effect of the inhibitory neurotransmitter GABA. They act quickly but can cause dependence, so they are usually prescribed short-term.
    topic_code: "5.5"
  - front: "Lithium → use"
    back: |
      A mood stabilizer used for bipolar disorders; it reduces the risk of manic and depressive episodes. Blood levels must be monitored because the safe range is narrow.
    topic_code: "5.5"
  - front: "Electroconvulsive therapy (ECT) → use and side effect"
    back: |
      A brief electric current causes a controlled seizure while the patient is under general anesthesia with muscle relaxants. Used mainly for severe depression that has not responded to other treatments; can cause memory loss around the treatment period.
    topic_code: "5.5"
  - front: "rTMS and psychosurgery → contrast"
    back: |
      Repetitive transcranial magnetic stimulation uses magnetic pulses through the scalp, with no anesthesia or seizure, mainly for depression. Psychosurgery removes or destroys brain tissue; the lobotomy, widely used in the 1940s and 1950s, is now abandoned.
    topic_code: "5.5"

quiz:
  description: |
    21 questions · about 35 minutes · mostly on this week (topic 5.5: psychodynamic, humanistic, behavior,
    cognitive and cognitive-behavioral therapies, evaluating therapy, and the biomedical therapies), with 6
    questions (29%) reviewing earlier weeks and units (neurotransmitters and reuptake, extinction, operant
    reinforcement, anxiety disorders and coping). Opens with a shared-context set on a hypothetical double-blind
    medication trial and ends with an Evidence-Based Question in the AP format. Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a hypothetical double-blind trial (5.5)
    - slug: appsych-u05-w32-q01
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 2.B"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). One hundred twenty adults diagnosed with major depressive disorder gave informed consent and were randomly assigned to take either an antidepressant pill or an identical-looking placebo pill daily for eight weeks. Neither the participants nor the clinicians who rated their symptoms knew who received which pill. Symptoms were rated on a depression scale (0 to 52, higher means more severe) at the start and at the end.

        | Group | n | Mean reduction in symptoms | Standard deviation |
        |---|---|---|---|
        | Antidepressant | 60 | 9.5 | 6.0 |
        | Placebo | 60 | 6.0 | 6.0 |

        The difference in reduction was statistically significant (p = .002; effect size d = 0.58). Participants whose symptoms worsened were referred for other care, and all were debriefed.
      prompt: |
        What is the main purpose of keeping both the participants and the symptom raters unaware of who received which pill?
      options:
        - "To make sure that every participant improves by the same amount"
        - "To prevent participants' and raters' expectations from biasing the results"
        - "To allow the researchers to skip informed consent"
        - "To ensure the sample represents all adults with depression"
      option_explanations:
        - |
          A double-blind procedure does not equalize outcomes; it keeps beliefs about the treatment from influencing them.
        - |
          Correct. In a double-blind design, neither participants (placebo effect) nor raters (experimenter bias) can let expectations about the real pill shape the symptom scores.
        - |
          Participants still gave informed consent; they agreed knowing they might receive a placebo.
        - |
          Representativeness depends on how participants are selected (random sampling), not on blinding.
      answer: 1
    - slug: appsych-u05-w32-q02
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 3.C"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). One hundred twenty adults diagnosed with major depressive disorder gave informed consent and were randomly assigned to take either an antidepressant pill or an identical-looking placebo pill daily for eight weeks. Neither the participants nor the clinicians who rated their symptoms knew who received which pill. Symptoms were rated on a depression scale (0 to 52, higher means more severe) at the start and at the end.

        | Group | n | Mean reduction in symptoms | Standard deviation |
        |---|---|---|---|
        | Antidepressant | 60 | 9.5 | 6.0 |
        | Placebo | 60 | 6.0 | 6.0 |

        The difference in reduction was statistically significant (p = .002; effect size d = 0.58). Participants whose symptoms worsened were referred for other care, and all were debriefed.
      prompt: |
        The placebo group's symptoms also dropped by an average of 6 points. Which explanation best accounts for this improvement?
      options:
        - "The placebo pills secretly contained a small dose of the medication."
        - "The raters knew which participants received the placebo."
        - "The improvement proves the antidepressant does not work."
        - "Expectations of improvement (the placebo effect), together with symptoms that were at their worst at the start drifting back toward average (regression toward the mean)"
      option_explanations:
        - |
          A placebo by definition contains no active ingredient; there is no evidence the pills were contaminated.
        - |
          The raters were blind to group, so they could not have known who received the placebo.
        - |
          The antidepressant group improved significantly more than the placebo group, so the medication had an effect beyond placebo.
        - |
          Correct. Believing one may be treated can improve mood, and people often enter treatment at a low point, from which scores tend to improve on their own; that is why a placebo group is essential.
      answer: 3
    - slug: appsych-u05-w32-q03
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 3.C"
      points: 1
      stimulus: |
        A hypothetical study (invented for this course). One hundred twenty adults diagnosed with major depressive disorder gave informed consent and were randomly assigned to take either an antidepressant pill or an identical-looking placebo pill daily for eight weeks. Neither the participants nor the clinicians who rated their symptoms knew who received which pill. Symptoms were rated on a depression scale (0 to 52, higher means more severe) at the start and at the end.

        | Group | n | Mean reduction in symptoms | Standard deviation |
        |---|---|---|---|
        | Antidepressant | 60 | 9.5 | 6.0 |
        | Placebo | 60 | 6.0 | 6.0 |

        The difference in reduction was statistically significant (p = .002; effect size d = 0.58). Participants whose symptoms worsened were referred for other care, and all were debriefed.
      prompt: |
        What does the effect size d = 0.58 tell you that the p-value alone does not?
      options:
        - "The size of the difference: the antidepressant group's mean reduction was a little over half a standard deviation larger than the placebo group's, a moderate effect."
        - "That there is a 58% chance the result is due to chance"
        - "That 58% of participants in the antidepressant group recovered fully"
        - "That the study must be repeated before anyone can believe it"
      option_explanations:
        - |
          Correct. Cohen's d expresses the difference between means in standard deviation units: (9.5 − 6.0) ÷ 6.0 ≈ 0.58, usually described as a moderate effect. The p-value says only that the difference is unlikely to be chance.
        - |
          The probability of a result this large arising by chance is described by the p-value (.002), not by the effect size.
        - |
          Effect size compares group means; it does not give the percentage of individuals who recovered.
        - |
          Replication is always valuable, but that is not what an effect size measures.
      answer: 0
    # ---- Independent items
    - slug: appsych-u05-w32-q04
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 1.A"
      points: 1
      prompt: |
        A therapist teaches a client with a fear of flying to relax her muscles deeply, then has her imagine looking at a picture of an airplane, then visiting an airport, then boarding a plane, moving to the next step only when she stays relaxed. Which technique is the therapist using?
      options:
        - "Aversive conditioning"
        - "Free association"
        - "Systematic desensitization"
        - "A token economy"
      option_explanations:
        - |
          Aversive conditioning pairs an unwanted behavior with something unpleasant; here a feared situation is paired with relaxation.
        - |
          Free association is a psychoanalytic technique of saying whatever comes to mind, not a graded exposure procedure.
        - |
          Correct. Relaxation training, an anxiety hierarchy and pairing relaxation with each step in order are the parts of systematic desensitization.
        - |
          A token economy rewards desired behaviors with exchangeable tokens, an operant technique not used here.
      answer: 2
    - slug: appsych-u05-w32-q05
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 1.A"
      points: 1
      prompt: |
        During months of therapy, a client begins to feel resentful toward her therapist in the same way she felt toward her critical father. A psychodynamic therapist would call this
      options:
        - "transference"
        - "unconditional positive regard"
        - "regression toward the mean"
        - "counterconditioning"
      option_explanations:
        - |
          Correct. Transference is redirecting feelings from important past relationships onto the therapist, which psychodynamic therapists use to explore those relationships.
        - |
          Unconditional positive regard is the accepting attitude a humanistic therapist offers the client, not the client's feelings toward the therapist.
        - |
          Regression toward the mean is a statistical tendency for extreme scores to move toward average, not a feeling in therapy.
        - |
          Counterconditioning replaces a fear response with a pleasant one through conditioning, a behavioral technique.
      answer: 0
    - slug: appsych-u05-w32-q06
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 1.A"
      points: 1
      prompt: |
        A therapist mostly listens, restates the client's feelings ("It sounds like you felt invisible at that dinner"), avoids giving advice and accepts the client without judgment. Which approach does this best describe?
      options:
        - "Rational emotive behavior therapy"
        - "Psychoanalysis"
        - "Exposure therapy"
        - "Person-centered therapy"
      option_explanations:
        - |
          Rational emotive behavior therapy is directive and confrontational, actively disputing irrational beliefs, unlike this nondirective approach.
        - |
          A psychoanalyst interprets unconscious meaning in what the client says rather than mainly reflecting feelings back without judgment.
        - |
          Exposure therapy has the client face feared situations; it is not built on reflecting feelings.
        - |
          Correct. Rogers's person-centered therapy is nondirective and uses active listening, empathy, genuineness and unconditional positive regard.
      answer: 3
    - slug: appsych-u05-w32-q07
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 1.A"
      points: 1
      prompt: |
        A therapist tells a client who is devastated after one friend ignored his message, "Where is the evidence that you must be liked by everyone? It's unpleasant, not a catastrophe." The therapist is vigorously challenging an irrational belief, a hallmark of
      options:
        - "person-centered therapy"
        - "rational emotive behavior therapy"
        - "systematic desensitization"
        - "psychodynamic therapy"
      option_explanations:
        - |
          Person-centered therapists do not confront or dispute the client's beliefs; they listen and reflect without judgment.
        - |
          Correct. Ellis's rational emotive behavior therapy directly disputes irrational "must" beliefs that, in its ABC model, turn events into emotional distress.
        - |
          Systematic desensitization pairs relaxation with a hierarchy of feared situations; it does not dispute beliefs.
        - |
          Psychodynamic therapy explores unconscious conflicts and past relationships rather than disputing conscious beliefs.
      answer: 1
    - slug: appsych-u05-w32-q08
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 1.A"
      points: 1
      prompt: |
        A residential program gives residents points for making their beds, attending group sessions and completing chores; points can be traded for movie nights or snacks. This program is an example of
      options:
        - "aversive conditioning"
        - "systematic desensitization"
        - "a token economy"
        - "dialectical behavior therapy"
      option_explanations:
        - |
          Aversive conditioning pairs an unwanted behavior with something unpleasant; this program adds rewards for desired behaviors.
        - |
          Systematic desensitization reduces fear by pairing relaxation with feared situations, not by rewarding chores.
        - |
          Correct. Points are tokens (secondary reinforcers) earned for desired behaviors and exchanged for rewards, which is operant conditioning in a token economy.
        - |
          Dialectical behavior therapy teaches mindfulness and emotion-regulation skills; it is not a point-reward system.
      answer: 2
    - slug: appsych-u05-w32-q09
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 1.A"
      points: 1
      prompt: |
        Lithium is most commonly prescribed for which condition?
      options:
        - "Bipolar disorders"
        - "Specific phobia"
        - "Attention-deficit/hyperactivity disorder"
        - "Dissociative amnesia"
      option_explanations:
        - |
          Correct. Lithium is a mood stabilizer that reduces the risk of manic and depressive episodes in bipolar disorders.
        - |
          Specific phobias are usually treated with exposure-based therapy, not lithium.
        - |
          ADHD is treated with other medications and behavioral approaches, not lithium.
        - |
          Dissociative amnesia is treated mainly with psychotherapy; lithium has no established role in it.
      answer: 0
    - slug: appsych-u05-w32-q10
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 1.A"
      points: 1
      prompt: |
        Which statement about electroconvulsive therapy (ECT) as it is practiced today is accurate?
      options:
        - "It is given while the patient is fully awake and without medication."
        - "It permanently removes parts of the brain."
        - "It is the first treatment tried for mild anxiety."
        - "It is used mainly for severe depression that has not responded to other treatments, under anesthesia, and can cause memory loss around the treatment period."
      option_explanations:
        - |
          Modern ECT is given under general anesthesia with a muscle relaxant, so the patient is not awake.
        - |
          ECT does not remove brain tissue; that describes psychosurgery, such as the abandoned lobotomy.
        - |
          ECT is reserved mainly for severe depression (and some other serious conditions) after other treatments have failed, not for mild anxiety.
        - |
          Correct. ECT causes a brief controlled seizure under anesthesia, is used mainly for severe, treatment-resistant depression, and can cause memory loss around the time of treatment.
      answer: 3
    - slug: appsych-u05-w32-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Selective serotonin reuptake inhibitors (SSRIs) block the reuptake of serotonin. At the synapse, what is the immediate result?
      options:
        - "Neurons stop producing serotonin."
        - "More serotonin remains in the synaptic gap to act on the receiving neuron's receptors."
        - "Serotonin is converted into dopamine."
        - "The myelin sheath around the axon thickens."
      option_explanations:
        - |
          Blocking reuptake does not stop production; it slows the reabsorption of serotonin already released.
        - |
          Correct. Reuptake is the sending neuron reabsorbing a neurotransmitter; blocking it leaves more serotonin in the synapse for longer.
        - |
          SSRIs do not convert one neurotransmitter into another.
        - |
          Myelin insulates axons and speeds neural impulses; SSRIs act at the synapse, not on myelin.
      answer: 1
    - slug: appsych-u05-w32-q12
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        In exposure therapy, a person with a fear of dogs spends time with calm dogs again and again, and nothing bad happens. In classical conditioning terms, the fear response fades through
      options:
        - "spontaneous recovery"
        - "stimulus generalization"
        - "extinction"
        - "positive reinforcement"
      option_explanations:
        - |
          Spontaneous recovery is the return of a weakened conditioned response after a pause, the opposite of the fading described.
        - |
          Generalization is responding to stimuli similar to the conditioned stimulus, which would spread fear, not reduce it.
        - |
          Correct. When the conditioned stimulus (dogs) repeatedly appears without the unconditioned stimulus (being hurt), the conditioned fear response weakens: extinction.
        - |
          Positive reinforcement is an operant concept, adding a reward to strengthen a behavior; it does not describe a conditioned fear fading.
      answer: 2
    - slug: appsych-u05-w32-q13
      type: multi_select
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skills 3.C and 4.B"
      points: 2
      partial_credit: true
      prompt: |
        Which conclusions about psychotherapy are supported by outcome research? Select all that apply.
      options:
        - "On average, people who receive psychotherapy improve more than similar people who receive no treatment."
        - "The quality of the bond between therapist and client predicts outcomes across many types of therapy."
        - "One single therapy works best for every disorder and every person."
        - "Some therapies have especially strong evidence for particular disorders, such as exposure-based therapy for phobias."
        - "Because many people improve without therapy, therapy has been shown to have no effect."
      option_explanations:
        - |
          Correct. Meta-analyses combining many controlled studies find that, on average, treated people do better than untreated people.
        - |
          Correct. The therapeutic alliance, a bond of trust and shared goals, is one of the most consistent predictors of good outcomes.
        - |
          No single approach is best for everyone; matching treatments to disorders and people is a central idea of evidence-based practice.
        - |
          Correct. Exposure-based approaches for phobias and OCD, and CBT for many anxiety and depressive disorders, have particularly strong support.
        - |
          Some improvement without treatment (spontaneous remission) does occur, but controlled studies show therapy adds benefit beyond it.
      answer: [0, 1, 3]
    - slug: appsych-u05-w32-q14
      type: multi_select
      topic_code: "5.4"
      source: "Original item; CED Topic 5.4, Skill 1.A (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are classified as anxiety disorders in the DSM-5-TR? Select all that apply.
      options:
        - "Generalized anxiety disorder"
        - "Obsessive-compulsive disorder"
        - "Panic disorder"
        - "Posttraumatic stress disorder"
        - "Social anxiety disorder"
      option_explanations:
        - |
          Correct. Generalized anxiety disorder is in the anxiety disorders group.
        - |
          DSM-5 moved obsessive-compulsive disorder into its own group of obsessive-compulsive and related disorders.
        - |
          Correct. Panic disorder is in the anxiety disorders group.
        - |
          PTSD is now in the trauma- and stressor-related disorders group, not the anxiety disorders.
        - |
          Correct. Social anxiety disorder is in the anxiety disorders group.
      answer: [0, 2, 4]
    - slug: appsych-u05-w32-q15
      type: true_false
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 1.A"
      points: 1
      prompt: |
        True or false: Long-term use of some older antipsychotic medications can cause tardive dyskinesia, involuntary movements of the face, tongue and limbs.
      answer: true
      explanation: |
        True. Older antipsychotics block dopamine receptors, including in movement pathways, and long-term use can produce tardive dyskinesia. Newer (atypical) antipsychotics carry a lower risk of it but have other side effects, which is one reason medication decisions are made carefully with a prescriber.
    - slug: appsych-u05-w32-q16
      type: true_false
      topic_code: "5.1"
      source: "Original item; CED Topic 5.1, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: Problem-focused coping is always more helpful than emotion-focused coping.
      answer: false
      explanation: |
        False. Problem-focused coping works best when the situation can be changed. When it cannot, such as a loved one's illness, emotion-focused strategies like seeking support, exercise or reframing are often more helpful. Most people use both.
    - slug: appsych-u05-w32-q17
      type: fill_blank
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 1.A"
      points: 1
      prompt: |
        In psychoanalysis, the client's habit of changing the subject, going blank or missing sessions when approaching painful material is called ____.
      answer: ["resistance"]
      explanation: |
        Resistance is blocking anxiety-laden material from awareness. Psychoanalysts interpret it as a sign that the conversation is near something important.
    - slug: appsych-u05-w32-q18
      type: fill_blank
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Benzodiazepines, a class of antianxiety medications, reduce anxiety by enhancing the effect of ____, the brain's main inhibitory neurotransmitter.
      answer: ["gaba", "gamma-aminobutyric acid", "gamma aminobutyric acid"]
      explanation: |
        GABA is the main inhibitory neurotransmitter. Benzodiazepines make GABA's calming effect stronger, which is why they act quickly, and also why combining them with other depressants such as alcohol is dangerous.
    - slug: appsych-u05-w32-q19
      type: short_answer
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skill 2.D"
      points: 2
      prompt: |
        (a) Explain why confidentiality is essential in therapy.
        (b) Describe one situation in which a therapist may need to share information despite confidentiality.
      answer: |
        (a) Clients need to trust that what they say stays private so they can speak openly about painful or embarrassing experiences; without that trust the therapeutic alliance and the therapy suffer.
        (b) When there is a serious risk of harm, for example a client at risk of harming themselves or a specific threat against another person, the therapist must act to protect safety (the duty to protect associated with the Tarasoff decision), and therapists explain these limits at the start.
      explanation: |
        Two points: 1 for explaining why confidentiality matters (trust, openness, the alliance), and 1 for a recognized limit (serious risk of harm to self or others, suspected child abuse, a court order).
    - slug: appsych-u05-w32-q20
      type: short_answer
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.A (spiral review)"
      points: 2
      prompt: |
        A classroom for students who struggle to stay on task uses a token economy: students earn stickers for finishing assignments and trade ten stickers for extra free time.
        (a) Identify the secondary reinforcer and explain why it is called secondary.
        (b) Explain one drawback of token economies.
      answer: |
        (a) The stickers are secondary (conditioned) reinforcers: they have no value on their own but gain it through their link to the free time they can be traded for.
        (b) Behavior may stop once the tokens stop (it may not generalize outside the program), and the rewards may undermine students' intrinsic motivation for the work.
      explanation: |
        Two points: 1 for identifying the stickers as the secondary reinforcer with the reason (learned value through association with a backup reward), and 1 for a drawback (poor generalization or maintenance once tokens end, the overjustification effect, the effort of running the system).
    - slug: appsych-u05-w32-q21
      type: long_answer
      topic_code: "5.5"
      source: "Original item; CED Topic 5.5, Skills 4.A and 4.B (Evidence-Based Question)"
      points: 7
      stimulus: |
        Three hypothetical studies (all invented for this course) on psychological treatment of depression.

        Source A. A research team randomly assigned 90 adults with major depressive disorder to 16 weekly sessions of cognitive-behavioral therapy (CBT) or to a waitlist control group that received therapy after the study. After 16 weeks, the CBT group's depression scores had dropped by an average of 12 points and the waitlist group's by 4 points (p under .001). All participants gave informed consent.

        Source B. A different team followed 200 adults whose depression had improved with treatment, comparing those who had completed CBT with those who had taken antidepressant medication without therapy and then stopped it. Over the following year, 29% of the CBT group and 52% of the medication-only group had a return of depressive symptoms. Participants were not randomly assigned to their earlier treatment.

        Source C. In a study of 150 clients receiving one of several kinds of therapy for depression, clients rated the strength of their bond with their therapist after the third session. Clients who rated the bond more highly improved more by the end of therapy (r = +0.35).
      prompt: |
        (A) Propose a specific and defensible claim based on at least one of the provided sources that responds to the question: How can psychotherapy help people with depression?

        (B) (i) Support your claim using at least one piece of specific and relevant evidence from one of the sources.
        (ii) Explain how the evidence from part B(i) supports your claim using a psychological concept from this unit or an earlier one.

        (C) (i) Support your claim using an additional piece of specific and relevant evidence from a different source than the one you used in part B(i).
        (ii) Explain how the evidence from part C(i) supports your claim using a different psychological concept than the one you used in part B(ii).
      answer: |
        (A) Psychotherapy can reduce depressive symptoms and lower the risk of relapse, especially when it changes thinking patterns and builds a strong working relationship.
        (B)(i) Source A: the CBT group's scores dropped by 12 points versus 4 points for the waitlist group (p under .001), after random assignment.
        (B)(ii) CBT teaches people to identify and challenge distorted automatic thoughts, the negative views of self, world and future in Beck's cognitive triad, and to re-engage in rewarding activities. Because the study randomly assigned participants and included a control group to account for improvement over time, the greater drop can be attributed to the therapy.
        (C)(i) Source C: clients who rated their bond with the therapist more highly after three sessions improved more (r = +0.35).
        (C)(ii) This is the therapeutic alliance: trust and shared goals help clients engage with therapy and practice what they learn. The study is correlational, so it shows the alliance is associated with improvement rather than proving it causes it; motivated clients might both bond better and improve more.
      explanation: |
        Seven points.
        (A) 1 point: a defensible claim that responds to the question.
        (B)(i) 1 point: specific evidence from one source, accurately reported.
        (B)(ii) 2 points: 1 for a relevant concept (cognitive triad, cognitive distortions, CBT, random assignment, control group, regression toward the mean, relapse, therapeutic alliance) and 1 for explaining how the evidence supports the claim through it.
        (C)(i) 1 point: specific evidence from a different source.
        (C)(ii) 2 points: 1 for a different concept and 1 for an explanation linking evidence, concept and claim.
        Notes: Source B did not randomly assign treatments, so a response that treats it as proof that CBT causes lower relapse loses the explanation point unless it acknowledges the limitation (people who chose CBT may have differed).
