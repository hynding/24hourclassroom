week: 23
unit: 4
title: "The Power of the Situation: Conformity, Obedience and Groups"
topics: ["4.3"]
guide: guides/week-23.md
guide_description: |
  Social norms and roles, individualism, collectivism and multiculturalism, and the false consensus effect;
  conformity in Asch's line studies with normative and informational social influence; Milgram's obedience
  studies, their variations and their ethical problems; the Stanford prison study and its well-documented
  criticisms (the researcher's dual role, demand characteristics, self-selection, failed replication); social
  facilitation, social loafing, deindividuation, group polarization and groupthink; the bystander effect and
  diffusion of responsibility in Darley and Latané's intercom study, prosocial norms, social traps and
  superordinate goals at Robbers Cave. A worked table names five group phenomena; the research section
  evaluates the classic studies.
flashcards_description: |
  32 cards on norms, conformity, Asch, obedience, Milgram and its variations, the Stanford prison study and its
  criticisms, group effects (facilitation, loafing, deindividuation, polarization, groupthink), bystander
  intervention, prosocial norms and conflict resolution.

flashcards:
  - front: "Social norm → definition"
    back: |
      An understood rule for accepted and expected behavior in a group or setting, such as facing the door in an elevator.
    topic_code: "4.3"
  - front: "Social role → definition"
    back: |
      A set of expectations about how a person in a given position (student, coach, guard) should behave.
    topic_code: "4.3"
  - front: "Individualism versus collectivism → difference"
    back: |
      Individualist cultures prioritize personal goals and define the self by personal traits; collectivist cultures prioritize group goals and define the self by relationships and memberships.
    topic_code: "4.3"
  - front: "Multiculturalism → definition"
    back: |
      The coexistence of many cultures within one society, with respect for each culture's traditions and identity.
    topic_code: "4.3"
  - front: "False consensus effect → definition"
    back: |
      Overestimating how many other people share our opinions, beliefs and behaviors.
    topic_code: "4.3"
  - front: "Conformity (social influence) → definition"
    back: |
      Adjusting one's behavior or thinking to match a group standard.
    topic_code: "4.3"
  - front: "Normative social influence → definition"
    back: |
      Going along with a group to gain acceptance or avoid rejection, even when privately disagreeing.
    topic_code: "4.3"
  - front: "Informational social influence → definition"
    back: |
      Going along with a group because we believe the others have better information, especially when the right answer is uncertain.
    topic_code: "4.3"
  - front: "Asch line studies → procedure"
    back: |
      A real participant judged which of three lines matched a standard line while seated among confederates who, on critical trials, unanimously gave the same wrong answer.
    topic_code: "4.3"
  - front: "Asch line studies → main results"
    back: |
      Participants conformed on about a third of critical trials; roughly three-quarters conformed at least once. Alone, people made almost no errors.
    topic_code: "4.3"
  - front: "Asch → effect of one dissenting ally"
    back: |
      A single confederate who gave the correct answer sharply reduced conformity: unanimity is what gives the group its power.
    topic_code: "4.3"
  - front: "Conditions that increase conformity → list"
    back: |
      A unanimous group of about three or more, public responses, admiring or belonging to the group, feeling incompetent or insecure, and a culture that values harmony.
    topic_code: "4.3"
  - front: "Obedience → definition"
    back: |
      Complying with the orders of an authority figure. Conformity responds to peers; obedience responds to commands.
    topic_code: "4.3"
  - front: "Milgram's obedience study → procedure"
    back: |
      A “teacher” was told to give a confederate “learner” shocks rising from 15 to 450 volts for wrong answers; the learner received no real shocks, and an experimenter prodded hesitant teachers to continue.
    topic_code: "4.3"
  - front: "Milgram's obedience study → main result"
    back: |
      In the best-known version, 26 of 40 men (65%) continued to the maximum 450 volts, many while visibly distressed.
    topic_code: "4.3"
  - front: "Milgram's variations → what lowered obedience"
    back: |
      The learner close by or touched, the experimenter giving orders by phone, a less prestigious setting, and especially seeing other teachers refuse.
    topic_code: "4.3"
  - front: "Milgram's obedience study → ethical criticisms"
    back: |
      Deception, severe stress, and prods that made withdrawing feel impossible. Debriefing was done, but current rules on the right to withdraw and protection from harm would not permit it as run.
    topic_code: "4.3"
  - front: "Stanford prison study (1971) → what was done"
    back: |
      24 male college volunteers were randomly assigned as guards or prisoners in a mock basement prison; planned for two weeks, it was stopped after six days.
    topic_code: "4.3"
  - front: "Stanford prison study → main criticisms"
    back: |
      Zimbardo's dual role as superintendent, demand characteristics and coaching of guards, a self-selected “prison life” sample, a small narrow sample, varied guard behavior, failed replication, and ethical harm.
    topic_code: "4.3"
  - front: "Demand characteristics in the prison study → definition and example"
    back: |
      Cues in a study that tell participants what the researcher expects, which can change their behavior and threaten internal validity. In the Stanford prison study, guards were briefed on creating fear.
    topic_code: "4.3"
  - front: "Social facilitation → definition"
    back: |
      The presence of others improves performance on simple or well-learned tasks and impairs it on difficult or new tasks, because arousal strengthens the dominant response.
    topic_code: "4.3"
  - front: "Social loafing → definition and fix"
    back: |
      Less effort in a group when individual contributions are pooled and unidentifiable. Making each person's contribution identifiable reduces it.
    topic_code: "4.3"
  - front: "Deindividuation → definition"
    back: |
      Loss of self-awareness and self-restraint in group situations that bring arousal and anonymity (crowds, masks, uniforms).
    topic_code: "4.3"
  - front: "Group polarization → definition"
    back: |
      Discussion among like-minded people strengthens the group's existing attitudes, pushing them toward an extreme.
    topic_code: "4.3"
  - front: "Groupthink → definition and remedies"
    back: |
      Harmony-seeking decision groups suppress dissent and ignore alternatives (Janis). Remedies: invite critics, assign a devil's advocate, consult outside experts.
    topic_code: "4.3"
  - front: "Bystander effect → definition"
    back: |
      The more people present at an emergency, the less likely any one of them is to help.
    topic_code: "4.3"
  - front: "Diffusion of responsibility → definition"
    back: |
      With others present, each person feels less personal responsibility to act, a main cause of the bystander effect.
    topic_code: "4.3"
  - front: "Darley and Latané (1968) seizure study → result"
    back: |
      Students who believed they alone heard a seizure over an intercom helped about 85% of the time before it ended; those who believed four others heard it helped about 31% of the time.
    topic_code: "4.3"
  - front: "Kitty Genovese case → what to know"
    back: |
      The 1964 news account of 38 passive witnesses prompted bystander research but was later shown to be badly exaggerated.
    topic_code: "4.3"
  - front: "Reciprocity norm versus social responsibility norm → difference"
    back: |
      Reciprocity: help those who have helped us. Social responsibility: help those who depend on us, regardless of return.
    topic_code: "4.3"
  - front: "Social trap → definition"
    back: |
      A situation where each party pursuing its own self-interest produces an outcome that is worse for everyone, such as overfishing a shared lake.
    topic_code: "4.3"
  - front: "Superordinate goals (Robbers Cave) → definition and finding"
    back: |
      Shared goals that require groups to cooperate. In Sherif's camp study, contact alone did not end rivalry between two boys' groups; working together on shared problems did.
    topic_code: "4.3"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 4.3: norms and culture, conformity and Asch,
    obedience and Milgram, the Stanford prison study and its criticisms, group effects, bystander intervention,
    prosocial behavior and conflict), with 7 questions (30%) reviewing earlier weeks (attribution and attitudes
    from weeks 21–22, adolescent identity, memory, the stress response and research ethics). Includes a
    three-question set on one invented bystander study. Multiple choice, select-all and true/false items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented bystander experiment (4.3)
    - slug: appsych-u04-w23-q01
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 2.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team ran 120 adult volunteers one at a time through a "video-call survey" in a campus lab. Each participant was randomly assigned to believe that 0, 2 or 6 other people were on the call (the others were prerecorded). Midway through, a recorded voice on the call said a stack of boxes had fallen on someone in the hallway. The researchers recorded whether the participant left the room to help or report it within two minutes.

        | Others believed present | n | Helped within 2 minutes |
        |---|---|---|
        | 0 | 40 | 34 (85%) |
        | 2 | 40 | 23 (58%) |
        | 6 | 40 | 13 (33%) |

        A test found the differences across groups statistically significant (p under 0.01). Participants were debriefed immediately afterward.
      prompt: |
        What is the independent variable in this study?
      options:
        - "Whether the participant helped within two minutes"
        - "The time of day the session was run"
        - "The 120 adult volunteers"
        - "The number of other people the participant believed were on the call"
      option_explanations:
        - |
          Helping within two minutes is what the researchers measured, so it is the dependent variable, operationally defined by leaving the room in that time.
        - |
          Time of day was not manipulated or reported; if it varied across groups it could be a confounding variable, not the independent variable.
        - |
          The volunteers are the sample; a variable is something manipulated or measured about them.
        - |
          Correct. The researchers manipulated how many others the participant believed were present (0, 2 or 6) and randomly assigned participants to those levels.
      answer: 3
    - slug: appsych-u04-w23-q02
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 3.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team ran 120 adult volunteers one at a time through a "video-call survey" in a campus lab. Each participant was randomly assigned to believe that 0, 2 or 6 other people were on the call (the others were prerecorded). Midway through, a recorded voice on the call said a stack of boxes had fallen on someone in the hallway. The researchers recorded whether the participant left the room to help or report it within two minutes.

        | Others believed present | n | Helped within 2 minutes |
        |---|---|---|
        | 0 | 40 | 34 (85%) |
        | 2 | 40 | 23 (58%) |
        | 6 | 40 | 13 (33%) |

        A test found the differences across groups statistically significant (p under 0.01). Participants were debriefed immediately afterward.
      prompt: |
        Which concept best explains the pattern in the results?
      options:
        - "Diffusion of responsibility: each participant felt less personally responsible as the number of others increased."
        - "Social facilitation: the presence of others improved performance on a well-learned task."
        - "Group polarization: discussion pushed the group toward a more extreme position."
        - "The reciprocity norm: participants helped those who had helped them before."
      option_explanations:
        - |
          Correct. Helping fell from 85% to 33% as the number of believed bystanders rose, the bystander effect, explained by responsibility being spread across more people.
        - |
          Social facilitation concerns performance on tasks with an audience; here, helping decreased as others increased, and helping is not a practiced task.
        - |
          There was no group discussion in the study, so nothing could polarize; participants decided alone.
        - |
          The victim had not helped participants before, so reciprocity does not explain differences between the groups.
      answer: 0
    - slug: appsych-u04-w23-q03
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 2.D"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team ran 120 adult volunteers one at a time through a "video-call survey" in a campus lab. Each participant was randomly assigned to believe that 0, 2 or 6 other people were on the call (the others were prerecorded). Midway through, a recorded voice on the call said a stack of boxes had fallen on someone in the hallway. The researchers recorded whether the participant left the room to help or report it within two minutes.

        | Others believed present | n | Helped within 2 minutes |
        |---|---|---|
        | 0 | 40 | 34 (85%) |
        | 2 | 40 | 23 (58%) |
        | 6 | 40 | 13 (33%) |

        A test found the differences across groups statistically significant (p under 0.01). Participants were debriefed immediately afterward.
      prompt: |
        Which feature of the study most limits how well the results generalize to real emergencies?
      options:
        - "Participants were randomly assigned to conditions."
        - "The differences were statistically significant."
        - "The emergency was heard over a call in a lab, and participants were volunteers who knew they were in a study."
        - "Each group had the same number of participants."
      option_explanations:
        - |
          Random assignment strengthens the causal conclusion (internal validity); it does not limit generalizability.
        - |
          Statistical significance says the differences are unlikely to be due to chance; it is not a limit on generalizing.
        - |
          Correct. A staged emergency heard on a call, in a lab, with volunteers who know they are being studied may not reflect how people act when they witness a real emergency in person.
        - |
          Equal group sizes make comparisons cleaner; they do not reduce generalizability.
      answer: 2
    - slug: appsych-u04-w23-q04
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.B"
      points: 1
      prompt: |
        On a field trip to a foreign city, a student is unsure how to pay on a tram, so she watches what local riders do and copies them. This is an example of
      options:
        - "normative social influence"
        - "informational social influence"
        - "obedience"
        - "deindividuation"
      option_explanations:
        - |
          Normative influence is going along to be liked or accepted; she is copying because the locals know the correct procedure.
        - |
          Correct. In an uncertain situation she treats others' behavior as information about the right thing to do.
        - |
          Obedience follows an authority's command; no one ordered her to pay a certain way.
        - |
          Deindividuation is loss of self-restraint in anonymous, aroused groups; she is carefully trying to act correctly.
      answer: 1
    - slug: appsych-u04-w23-q05
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.A"
      points: 1
      prompt: |
        In Asch's line-judgment studies, which change most sharply reduced conformity?
      options:
        - "One confederate giving the correct answer, breaking the group's unanimity"
        - "Increasing the group of confederates from 4 to 12"
        - "Making the lines harder to tell apart"
        - "Having participants announce their answers aloud to the group"
      option_explanations:
        - |
          Correct. A single ally who broke unanimity sharply cut conformity, showing how much the group's power depends on agreement.
        - |
          Conformity rose as the group grew to about three or four and then leveled off; a larger group did not reduce it.
        - |
          Harder judgments make people less certain and so more likely to rely on others (informational influence), increasing conformity.
        - |
          Public answers were the standard procedure; answering privately is what reduced conformity.
      answer: 0
    - slug: appsych-u04-w23-q06
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.A"
      points: 1
      prompt: |
        Which variation of Milgram's procedure produced the lowest obedience?
      options:
        - "Running the study at Yale rather than in an office building"
        - "Having the experimenter in the same room as the teacher"
        - "Keeping the learner out of sight in another room"
        - "Having two other teachers, actually confederates, refuse to continue"
      option_explanations:
        - |
          The prestigious Yale setting was the baseline; moving to an office building lowered obedience somewhat, so Yale was associated with higher obedience.
        - |
          The experimenter's physical presence was the standard condition; giving orders by phone lowered obedience.
        - |
          The learner in another room was the baseline arrangement; bringing the learner closer reduced obedience.
        - |
          Correct. Seeing peers defy the experimenter gave participants models of disobedience, and obedience fell dramatically.
      answer: 3
    - slug: appsych-u04-w23-q07
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 2.D"
      points: 1
      prompt: |
        Which criticism of the Stanford prison study concerns demand characteristics?
      options:
        - "The sample was 24 young men, all college students."
        - "Some participants suffered real distress."
        - "Guards were briefed on creating fear and some later said they acted as they thought the researchers wanted."
        - "A later televised study did not produce the same results."
      option_explanations:
        - |
          A small, narrow sample limits generalizability, but it is not a cue telling participants how to behave.
        - |
          Distress is an ethical criticism (harm to participants), not a demand characteristic.
        - |
          Correct. Cues and instructions that signal what the researcher expects are demand characteristics, and they undercut the claim that the role alone produced cruelty.
        - |
          A failed replication weakens confidence in the finding but is a separate criticism from demand characteristics.
      answer: 2
    - slug: appsych-u04-w23-q08
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.B"
      points: 1
      prompt: |
        An experienced typist types faster when coworkers are watching, while a new typist makes more errors when watched. Which concept explains both results?
      options:
        - "Social loafing"
        - "Social facilitation"
        - "Group polarization"
        - "The false consensus effect"
      option_explanations:
        - |
          Social loafing is reduced effort when contributions are pooled; each typist works individually and is being watched, which is the opposite situation.
        - |
          Correct. An audience raises arousal, strengthening the dominant response: correct for the experienced typist, error-prone for the beginner.
        - |
          Group polarization is the strengthening of a group's attitudes through discussion, not performance with an audience.
        - |
          The false consensus effect is overestimating agreement with our views; it does not predict typing performance.
      answer: 1
    - slug: appsych-u04-w23-q09
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.B"
      points: 1
      prompt: |
        A student council already leans toward canceling the spring dance. After an hour of discussion among themselves, they vote unanimously and with great certainty to cancel it. This best illustrates
      options:
        - "social facilitation"
        - "the reciprocity norm"
        - "deindividuation"
        - "group polarization"
      option_explanations:
        - |
          Social facilitation concerns task performance in front of others, not a shift in a group's attitude.
        - |
          The reciprocity norm is about returning help; it does not explain an attitude becoming more extreme.
        - |
          Deindividuation involves anonymity and arousal lowering restraint, as in crowds; a council discussion is neither anonymous nor impulsive.
        - |
          Correct. Discussion among like-minded members strengthened their existing leaning into a more extreme, confident position.
      answer: 3
    - slug: appsych-u04-w23-q10
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.B"
      points: 1
      prompt: |
        Two rival neighborhoods must work together to rebuild a park both use after a storm, and relations between them improve. Which concept explains the improvement?
      options:
        - "A superordinate goal"
        - "A social trap"
        - "Groupthink"
        - "Out-group homogeneity"
      option_explanations:
        - |
          Correct. A shared goal that neither group can achieve alone requires cooperation, which reduced hostility at Robbers Cave and here.
        - |
          A social trap is when self-interest leads to a worse outcome for all; here cooperation produced a better outcome.
        - |
          Groupthink is faulty decision-making from suppressed dissent; nothing describes a decision process.
        - |
          Out-group homogeneity is seeing the other group as all alike, which tends to worsen relations rather than improve them.
      answer: 0
    # ---- Spiral review
    - slug: appsych-u04-w23-q11
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 4.A (spiral review)"
      points: 1
      prompt: |
        People who learn about Milgram's results often say, "The teachers must have been cruel people." This reaction shows which bias, which Milgram's variations directly challenge?
      options:
        - "The self-serving bias"
        - "The fundamental attribution error"
        - "Relative deprivation"
        - "The mere exposure effect"
      option_explanations:
        - |
          The self-serving bias concerns one's own successes and failures; this is a judgment about other people.
        - |
          Correct. Blaming the teachers' character underestimates the situation; the variations show obedience rising and falling with situational changes while the type of person stayed the same.
        - |
          Relative deprivation is a feeling of having less than a comparison group; it is not an explanation of others' behavior.
        - |
          The mere exposure effect concerns liking from repeated exposure, unrelated to explaining the teachers' behavior.
      answer: 1
    - slug: appsych-u04-w23-q12
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        A participant who shocked the learner up to 300 volts later tells himself, "The learner probably deserved it for not paying attention." This thought is best explained by
      options:
        - "the foot-in-the-door technique"
        - "out-group homogeneity bias"
        - "cognitive dissonance reduction"
        - "the peripheral route to persuasion"
      option_explanations:
        - |
          Foot-in-the-door describes how small steps lead to larger compliance, which fits the gradual voltage increase, but this thought is a justification after the act.
        - |
          Out-group homogeneity is perceiving another group's members as all alike; the thought concerns one learner's deservingness.
        - |
          Correct. “I hurt someone” conflicts with “I'm a decent person”; blaming the learner changes an attitude to reduce the tension (also echoing the just-world phenomenon).
        - |
          The peripheral route concerns persuasion by surface cues; the participant is justifying his own behavior.
      answer: 2
    - slug: appsych-u04-w23-q13
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        Peer conformity is often strongest in adolescence. In Erikson's theory, adolescence is the stage of
      options:
        - "identity versus role confusion"
        - "trust versus mistrust"
        - "industry versus inferiority"
        - "intimacy versus isolation"
      option_explanations:
        - |
          Correct. Adolescents work to form a coherent sense of who they are, often trying on roles and looking to peers for cues.
        - |
          Trust versus mistrust is the infant's stage, centered on whether caregivers reliably meet needs.
        - |
          Industry versus inferiority is the school-age stage, about competence at tasks.
        - |
          Intimacy versus isolation is the young-adult stage, about forming close relationships.
      answer: 0
    - slug: appsych-u04-w23-q14
      type: multi_select
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which are recognized symptoms or causes of groupthink? Select all that apply.
      options:
        - "Members keep their doubts to themselves to preserve harmony."
        - "A leader invites outside experts to challenge the plan."
        - "The group feels invulnerable and morally right."
        - "One member is assigned to argue against every proposal."
        - "Warnings that contradict the plan are dismissed."
      option_explanations:
        - |
          Correct. Self-censorship to protect unity is a core symptom of groupthink.
        - |
          Inviting outside critics is a remedy for groupthink, not a symptom.
        - |
          Correct. An illusion of invulnerability and of moral rightness are classic symptoms.
        - |
          A devil's advocate is a remedy that brings dissent into the discussion.
        - |
          Correct. Rationalizing away contrary warnings is a symptom that leads to poor decisions.
      answer: [0, 2, 4]
    - slug: appsych-u04-w23-q15
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.D (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        A researcher proposes repeating Milgram's procedure exactly as it was first run. Under current ethical guidelines, which features would an institutional review board object to? Select all that apply.
      options:
        - "Prods that pressure participants to continue after they say they want to stop"
        - "Debriefing participants at the end"
        - "Exposing participants to severe, avoidable stress"
        - "Obtaining informed consent before the study"
        - "Keeping participants' identities confidential"
      option_explanations:
        - |
          Correct. Participants must be free to withdraw at any time; prods that pressure them to continue violate that right.
        - |
          Debriefing is required after deception; an IRB would require it, not object to it.
        - |
          Correct. Researchers must protect participants from undue harm, and the original procedure caused severe distress.
        - |
          Informed consent is a requirement, not a problem.
        - |
          Confidentiality is a requirement that protects participants.
      answer: [0, 2]
    - slug: appsych-u04-w23-q16
      type: true_false
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.A"
      points: 1
      prompt: |
        True or false: Social loafing is reduced when each group member's contribution can be identified and evaluated.
      answer: true
      explanation: |
        True. Loafing happens when effort is pooled and individuals feel unaccountable; making contributions identifiable restores individual accountability and effort.
    - slug: appsych-u04-w23-q17
      type: true_false
      topic_code: "2.6"
      source: "Original item; CED Topic 2.6, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: Eyewitnesses who discuss an event with each other before giving statements can come to report details that only another witness mentioned, which is one form of the misinformation effect.
      answer: true
      explanation: |
        True. Information encountered after an event, including from co-witnesses, can be incorporated into a person's memory of it. This "memory conformity" is why investigators try to interview witnesses separately.
    - slug: appsych-u04-w23-q18
      type: fill_blank
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.A"
      points: 1
      prompt: |
        Loss of self-awareness and self-restraint in a group that offers arousal and anonymity, such as a masked crowd, is called ____.
      answer: ["deindividuation", "de-individuation"]
      explanation: |
        Deindividuation occurs when anonymity and arousal in groups reduce self-awareness, making impulsive behavior more likely.
    - slug: appsych-u04-w23-q19
      type: fill_blank
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.A"
      points: 1
      prompt: |
        The tendency to overestimate how many other people share our opinions and behaviors is called the false ____ effect.
      answer: ["consensus"]
      explanation: |
        The false consensus effect leads people to assume their views and habits are more common than they are.
    - slug: appsych-u04-w23-q20
      type: short_answer
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skills 1.B and 4.A"
      points: 3
      prompt: |
        A student collapses in a crowded hallway between classes, and dozens of students walk past.

        (a) Use diffusion of responsibility to explain why no one helps.
        (b) Explain how informational social influence could also reduce helping.
        (c) Describe one specific thing a bystander could do to make help more likely.
      answer: |
        (a) With so many people present, each student feels less personally responsible; each assumes someone else will act or already has.
        (b) Students look to others to decide whether it is an emergency; seeing everyone walk calmly by, each concludes it must not be serious.
        (c) Point to one specific person and say, “You, in the red jacket, call the nurse,” which places responsibility on one person; or act first, which models helping.
      explanation: |
        Three points, one per part. (a) responsibility spread across many bystanders. (b) others' calm behavior used as information that there is no emergency. (c) a specific action that assigns responsibility or models helping.
    - slug: appsych-u04-w23-q21
      type: short_answer
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Skill 1.B (spiral review)"
      points: 2
      prompt: |
        Many of Milgram's participants sweated, trembled and had a racing heart while deciding whether to continue.

        (a) Which division of the autonomic nervous system produced these responses?
        (b) Which division would return the body to a calm state afterward?
      answer: |
        (a) The sympathetic division (fight-or-flight arousal).
        (b) The parasympathetic division (rest and digest).
      explanation: |
        Two points. (a) sympathetic. (b) parasympathetic.
    - slug: appsych-u04-w23-q22
      type: short_answer
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 1.B (spiral review)"
      points: 2
      prompt: |
        Milgram's teachers began at 15 volts and moved up in small 15-volt steps.

        (a) Name the compliance technique from week 22 that this gradual increase resembles.
        (b) Explain how it could have contributed to obedience.
      answer: |
        (a) The foot-in-the-door technique.
        (b) Agreeing to each small step made the next small step easier; having already given 300 volts, refusing 315 would mean admitting the earlier shocks were wrong, so each step committed participants further.
      explanation: |
        Two points. (a) foot-in-the-door. (b) explains that early small compliance increased later compliance (commitment or self-justification).
    - slug: appsych-u04-w23-q23
      type: long_answer
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skills 2.A, 2.D and 4.A (mini-AAQ)"
      points: 6
      stimulus: |
        **A hypothetical study (invented for this course).** Researchers recruited 60 students from three high schools in one city. Each sat with four confederates and judged the length of lines on 18 trials; on 12 critical trials the confederates unanimously gave the same wrong answer. Participants were randomly assigned to answer aloud (public) or by typing into a tablet the confederates could not see (private). Conformity was the number of critical trials (0–12) on which the participant matched the wrong answer. Public: mean 3.9, SD 2.4. Private: mean 1.1, SD 1.3. The difference was statistically significant (p under 0.001). The study was approved by a review board, parents and students gave consent, and everyone was debriefed.
      prompt: |
        (A) Identify the research method used.
        (B) State the operational definition of conformity.
        (C) Describe what the standard deviations show about the two groups.
        (D) Identify one ethical guideline the researchers followed.
        (E) Explain one limit on generalizing these results.
        (F) Explain whether the results support the claim that most conformity in this situation is due to normative rather than informational social influence.
      answer: |
        (A) An experiment: the answer format was manipulated and participants were randomly assigned.
        (B) The number of critical trials, out of 12, on which the participant gave the same wrong answer as the confederates.
        (C) Scores in the public group were more spread out than in the private group (SD 2.4 versus 1.3); private answers clustered closer to their low mean.
        (D) Informed consent (parents and students), IRB approval, or debriefing after deception.
        (E) Only 60 students from one city's high schools, on a simple line task; results may not apply to adults, other cultures or real-world opinions.
        (F) Supports it: conformity dropped sharply when others could not see the answer. If people truly believed the group was right (informational influence), private answers would conform as much; the drop shows conformity was largely about public acceptance (normative influence).
      explanation: |
        Six points, one per part. (A) experiment, with a reason (manipulation or random assignment). (B) number of critical trials matching the wrong answer. (C) correctly compares variability (public more variable). (D) a guideline named and tied to the stimulus. (E) a sample or task limit with a reason. (F) uses the public-private difference to argue for normative influence, explaining why informational influence would predict no drop.
