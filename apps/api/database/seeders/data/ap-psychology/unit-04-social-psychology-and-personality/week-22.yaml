      prompt: |
        Central-route persuasion resembles the deep, meaning-based processing that improves memory. Linking new information to what you already know is called ____ rehearsal.
      answer: ["elaborative", "elaboration"]
      explanation: |
        Elaborative rehearsal connects new information to existing knowledge, producing deeper encoding than maintenance (rote) rehearsal; thoughtful central-route processing is similarly deep and its effects last longer.
    - slug: appsych-u04-w22-q20
      type: short_answer
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skills 1.B and 4.A"
      points: 3
      prompt: |
        Malia spent $180 on concert tickets, then learned the band was disappointing live.

        (a) Explain why Malia might experience cognitive dissonance.
        (b) Describe one way she could reduce it by changing an attitude.
        (c) Explain why someone who got a free ticket would probably feel less dissonance.
      answer: |
        (a) Her thought “I spent a lot on this” conflicts with “the show was disappointing” (or “I make good choices”), creating uncomfortable tension.
        (b) She could decide the show was better than it seemed (“the energy was amazing anyway”) or that the band's music matters less to her.
        (c) A free ticket means less investment to justify; there is little conflict between “it cost me nothing” and “it was disappointing,” so less need to change her attitude.
      explanation: |
        Three points, one per part. (a) names the two conflicting cognitions. (b) an attitude change that reduces the conflict (behavior change alone does not earn the point). (c) links lower cost or effort to less need for justification and so less dissonance.
    - slug: appsych-u04-w22-q21
      type: short_answer
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.B (spiral review)"
      points: 2
      prompt: |
        A store gives customers a stamp each time they buy coffee and a free coffee after every tenth stamp.

        (a) Name the schedule of reinforcement.
        (b) Describe the pattern of responding this schedule typically produces.
      answer: |
        (a) A fixed-ratio schedule (reinforcement after a set number of responses).
        (b) A high, steady rate of responding, often with a brief pause just after each reward.
      explanation: |
        Two points. (a) fixed ratio. (b) a high response rate with a short post-reinforcement pause.
    - slug: appsych-u04-w22-q22
      type: long_answer
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skills 1.B and 4.B"
      points: 5
      prompt: |
        A school wants more students to sign up to tutor younger children after school.

        (A) Describe how the school could use the foot-in-the-door technique.
        (B) Describe how the school could use the door-in-the-face technique.
        (C) Explain how a central-route message would differ from a peripheral-route message for this goal, with an example of each.
        (D) Explain which route is likely to produce longer-lasting commitment, and why.
        (E) Explain how cognitive dissonance could make students who start tutoring more positive about it.
      answer: |
        (A) First ask students to do something small, such as signing a pledge or reading to a child for ten minutes once; later ask those who agreed to tutor weekly.
        (B) First ask for a large commitment that most will refuse, such as tutoring every day for the year; then ask for one afternoon a week.
        (C) Central: data and reasons on how tutoring helps younger students and builds tutors' skills, aimed at students who care and have time to think. Peripheral: a popular student or athlete in a poster saying “Be a tutor!” with music and smiling faces.
        (D) The central route, because attitudes formed by careful thought about arguments are stronger, more resistant to counterarguments and better predict behavior.
        (E) Students who give up free time to tutor, with no pay, have little external justification; to reduce dissonance between “I'm spending my time on this” and any doubts, they come to value tutoring more.
      explanation: |
        Five points, one per part. (A) small request then larger one. (B) large refused request then smaller target request. (C) correctly distinguishes argument quality (central) from surface cues (peripheral) with an example of each. (D) central, with a reason about durability or predicting behavior. (E) links low external justification for effort to attitude change toward tutoring.
