week: 22
unit: 4
title: "Attitudes: How They Form and How They Change"
topics: ["4.2"]
guide: guides/week-22.md
guide_description: |
  Stereotypes, prejudice and discrimination as belief, feeling and behavior; explicit and implicit attitudes and
  the reliability and validity problems of the Implicit Association Test; in-group bias (with Tajfel's minimal
  groups), out-group homogeneity bias, ethnocentrism, the just-world phenomenon and belief perseverance;
  cognitive dissonance and Festinger and Carlsmith's $1 and $20 study; persuasion through the central and
  peripheral routes of the elaboration likelihood model and the halo effect; and the foot-in-the-door and
  door-in-the-face techniques. Worked examples show three ways to reduce dissonance and sort two voters by
  persuasion route; the research section covers self-report, social desirability and a factorial design.
flashcards_description: |
  30 cards on attitudes, stereotypes, prejudice and discrimination, implicit attitudes and the IAT, in-group
  and out-group biases, ethnocentrism, the just-world phenomenon, belief perseverance, cognitive dissonance,
  the elaboration likelihood model, the halo effect and compliance techniques.

flashcards:
  - front: "Attitude (social psychology) → definition"
    back: |
      A learned evaluation of a person, group, object or idea that predisposes a person to respond favorably or unfavorably.
    topic_code: "4.2"
  - front: "Stereotype → definition"
    back: |
      A generalized belief about the members of a group. The cognitive (thinking) part of a group attitude; it may be positive or negative.
    topic_code: "4.2"
  - front: "Prejudice → definition"
    back: |
      An unjustified, usually negative attitude toward a group and its members. The emotional (feeling) part.
    topic_code: "4.2"
  - front: "Discrimination → definition"
    back: |
      Unjustified negative behavior toward a group or its members, such as refusing to hire or include them. The behavioral (acting) part.
    topic_code: "4.2"
  - front: "Stereotype, prejudice, discrimination → memory hook"
    back: |
      Think, feel, act. A stereotype is a belief, prejudice is a feeling, discrimination is a behavior.
    topic_code: "4.2"
  - front: "Explicit attitude → definition"
    back: |
      An attitude a person is consciously aware of and can report, for example on a survey.
    topic_code: "4.2"
  - front: "Implicit attitude → definition"
    back: |
      An automatic, often unconscious association, inferred from indirect measures such as reaction times rather than from what people say.
    topic_code: "4.2"
  - front: "Implicit Association Test (IAT) → how it works"
    back: |
      People sort words and images with shared response keys; faster sorting when two concepts share a key is taken as a stronger association.
    topic_code: "4.2"
  - front: "IAT → research-methods caution"
    back: |
      Individual scores show limited test-retest reliability and predict individual behavior only weakly (limited predictive validity), so it is used to study groups, not to label individuals.
    topic_code: "4.2"
  - front: "In-group bias → definition"
    back: |
      The tendency to favor one's own group. Appears even in minimal groups formed on trivial grounds (Tajfel).
    topic_code: "4.2"
  - front: "Minimal group studies (Tajfel) → finding"
    back: |
      People assigned to groups on trivial grounds (such as a supposed preference for one abstract painter) still gave more rewards to their own group.
    topic_code: "4.2"
  - front: "Out-group homogeneity bias → definition"
    back: |
      Seeing members of other groups as more alike than members of one's own group: “they're all the same; we're all different.”
    topic_code: "4.2"
  - front: "Ethnocentrism → definition"
    back: |
      Judging other cultures by the standards of one's own and regarding one's own culture as superior.
    topic_code: "4.2"
  - front: "Just-world phenomenon → definition and consequence"
    back: |
      The belief that the world is fair and people get what they deserve. It leads people to blame victims for their misfortune.
    topic_code: "4.2"
  - front: "Belief perseverance (attitudes) → definition and remedy"
    back: |
      Clinging to a belief even after the evidence it was built on has been discredited. Explaining why the opposite might be true can weaken it.
    topic_code: "4.2"
  - front: "Cognitive dissonance → definition"
    back: |
      The uncomfortable tension felt when two thoughts, or a thought and a behavior, conflict. People reduce it, often by changing the attitude to match the behavior.
    topic_code: "4.2"
  - front: "Festinger and Carlsmith (1959) → procedure"
    back: |
      Students did an hour of dull tasks, then were paid $1 or $20 to tell the next participant the tasks were enjoyable; a control group told no one.
    topic_code: "4.2"
  - front: "Festinger and Carlsmith (1959) → result and explanation"
    back: |
      The $1 group later rated the tasks as more enjoyable than the $20 or control groups. With too little justification for lying, they reduced dissonance by changing their attitude.
    topic_code: "4.2"
  - front: "Insufficient justification → principle"
    back: |
      A small incentive for a behavior produces more attitude change than a large one, because a large incentive explains the behavior away.
    topic_code: "4.2"
  - front: "Post-decision dissonance → example"
    back: |
      After choosing between two similar colleges, people rate the chosen one more highly and the rejected one lower than they did before choosing.
    topic_code: "4.2"
  - front: "Elaboration likelihood model → two routes"
    back: |
      Central route: careful thought about arguments and evidence. Peripheral route: response to surface cues such as attractiveness, fame or music. (Petty and Cacioppo)
    topic_code: "4.2"
  - front: "Central route → when it happens and what results"
    back: |
      When the audience is motivated (the issue matters) and able (time, knowledge, attention). The attitude change lasts longer and better predicts behavior.
    topic_code: "4.2"
  - front: "Peripheral route → when it happens and what results"
    back: |
      When the audience is distracted, uninterested or lacks knowledge. Change is quicker but weaker and less durable.
    topic_code: "4.2"
  - front: "Halo effect → definition and persuasion link"
    back: |
      One positive trait (such as attractiveness or fame) colors judgments of unrelated traits. Celebrity endorsements use it as a peripheral cue.
    topic_code: "4.2"
  - front: "Foot-in-the-door → definition"
    back: |
      Getting agreement to a small request first makes agreement to a later, larger request more likely.
    topic_code: "4.2"
  - front: "Freedman and Fraser (1966) → finding"
    back: |
      Homeowners who first agreed to a small safe-driving request were far more likely to later accept a large, unattractive “drive carefully” sign in their yard than those asked only the large request.
    topic_code: "4.2"
  - front: "Door-in-the-face → definition"
    back: |
      Making a large request that is refused, then a smaller one; the retreat feels like a concession, so the smaller request is more likely to be accepted.
    topic_code: "4.2"
  - front: "Cialdini and colleagues (1975) chaperone study → finding"
    back: |
      Students who first refused a huge request (two years of weekly volunteer counseling) more often agreed to a one-time two-hour zoo chaperone trip than students asked only the small request.
    topic_code: "4.2"
  - front: "Social desirability bias in attitude surveys → definition"
    back: |
      Answering self-report questions in the way that seems socially acceptable rather than truthfully, a threat to the validity of attitude surveys.
    topic_code: "4.2"
  - front: "Error-spot → “In Festinger and Carlsmith's study, the $20 group liked the task more”"
    back: |
      Reversed. The $1 group rated the task as more enjoyable, because $20 was enough justification for the lie and created little dissonance.
    topic_code: "4.2"

quiz:
  description: |
    22 questions · about 35 minutes · mostly on this week (topic 4.2: stereotypes, prejudice and discrimination,
    implicit attitudes, in-group and out-group biases, the just-world phenomenon, belief perseverance, cognitive
    dissonance, the elaboration likelihood model and compliance techniques), with 8 questions (36%) reviewing
    earlier weeks (attribution from week 21, heuristics, encoding, classical conditioning, the autonomic nervous
    system and research methods). Includes a three-question set on one invented persuasion study. Multiple
    choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented persuasion experiment (4.2)
    - slug: appsych-u04-w22-q01
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 2.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team randomly assigned 160 high school juniors to four groups. Each heard a recorded message arguing for a required year of community service before graduation. The message used either *strong* arguments (data on job skills and college admissions) or *weak* arguments (slogans and personal opinions). Half the students were told the requirement would begin *next year at their school*; half were told it *might* begin *in ten years in another state*. Agreement was measured on a 1 (strongly disagree) to 9 (strongly agree) scale.

        | Group | Mean agreement |
        |---|---|
        | Next year, strong arguments | 7.1 |
        | Next year, weak arguments | 3.4 |
        | Ten years, strong arguments | 5.3 |
        | Ten years, weak arguments | 5.0 |
      prompt: |
        Which conclusion about the students told the requirement would begin next year is best supported?
      options:
        - "They ignored the arguments and were persuaded equally by both messages."
        - "Their agreement depended strongly on argument quality, consistent with central-route processing."
        - "They were persuaded mainly by peripheral cues such as the speaker's voice."
        - "They agreed more with weak arguments because of cognitive dissonance."
      option_explanations:
        - |
          Their means were 7.1 for strong and 3.4 for weak arguments, a large difference, so they did not respond equally to both messages.
        - |
          Correct. High personal relevance motivates careful thought; these students agreed far more with strong arguments (7.1) than weak ones (3.4), the signature of the central route.
        - |
          If peripheral cues dominated, argument quality would matter little; for these students it mattered a great deal.
        - |
          They agreed less with weak arguments (3.4 versus 7.1), and nothing in the design creates a conflict between their behavior and attitudes.
      answer: 1
    - slug: appsych-u04-w22-q02
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 3.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team randomly assigned 160 high school juniors to four groups. Each heard a recorded message arguing for a required year of community service before graduation. The message used either *strong* arguments (data on job skills and college admissions) or *weak* arguments (slogans and personal opinions). Half the students were told the requirement would begin *next year at their school*; half were told it *might* begin *in ten years in another state*. Agreement was measured on a 1 (strongly disagree) to 9 (strongly agree) scale.

        | Group | Mean agreement |
        |---|---|
        | Next year, strong arguments | 7.1 |
        | Next year, weak arguments | 3.4 |
        | Ten years, strong arguments | 5.3 |
        | Ten years, weak arguments | 5.0 |
      prompt: |
        The effect of argument strength was large in one relevance condition and small in the other. In a design with two independent variables, this pattern is called
      options:
        - "a confounding variable"
        - "a placebo effect"
        - "an interaction"
        - "a negative correlation"
      option_explanations:
        - |
          A confound is an uncontrolled variable that varies with the independent variable; here both variables were manipulated and randomly assigned.
        - |
          A placebo effect is improvement caused by expectations about an inactive treatment; no placebo was used here.
        - |
          Correct. When the effect of one independent variable (argument strength) depends on the level of another (relevance), the variables interact.
        - |
          A correlation describes how two measured variables move together; this is an experiment comparing group means.
      answer: 2
    - slug: appsych-u04-w22-q03
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 2.B"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team randomly assigned 160 high school juniors to four groups. Each heard a recorded message arguing for a required year of community service before graduation. The message used either *strong* arguments (data on job skills and college admissions) or *weak* arguments (slogans and personal opinions). Half the students were told the requirement would begin *next year at their school*; half were told it *might* begin *in ten years in another state*. Agreement was measured on a 1 (strongly disagree) to 9 (strongly agree) scale.

        | Group | Mean agreement |
        |---|---|
        | Next year, strong arguments | 7.1 |
        | Next year, weak arguments | 3.4 |
        | Ten years, strong arguments | 5.3 |
        | Ten years, weak arguments | 5.0 |
      prompt: |
        Students in the "next year" groups were told something untrue about their own school. Which step is most important for the researchers to take before the students leave?
      options:
        - "Ask the students to keep the false information secret from their parents"
        - "Debrief the students, explaining that the requirement is not real and why the deception was used"
        - "Repeat the message so the students' attitudes stay the same"
        - "Remove the students' data so the deception does not count"
      option_explanations:
        - |
          Asking participants to hide a deception from parents would add harm and undermine informed consent for minors; it is not an accepted ethical step.
        - |
          Correct. Deception requires debriefing: participants must learn the true purpose and that the requirement is not real, so they do not leave misinformed or anxious.
        - |
          Reinforcing a false belief is the opposite of what ethics require; the aim is to remove any lasting effect of the deception.
        - |
          Deleting data does not undo the deception for the participants; they still need to be told the truth.
      answer: 1
    - slug: appsych-u04-w22-q04
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 1.B"
      points: 1
      prompt: |
        A restaurant owner believes that teenagers are rude, feels irritated whenever a group of teens walks in, and seats them at the worst table. Seating them at the worst table is an example of
      options:
        - "discrimination"
        - "a stereotype"
        - "prejudice"
        - "ethnocentrism"
      option_explanations:
        - |
          Correct. Seating teens at the worst table is an action taken against members of a group, which is discrimination (the behavioral part).
        - |
          The stereotype is the belief that teenagers are rude; the question asks about the seating, which is a behavior.
        - |
          Prejudice is the negative feeling (the irritation); the seating is the behavior that follows from it.
        - |
          Ethnocentrism is judging other cultures by one's own culture's standards; this concerns an age group and a specific action.
      answer: 0
    - slug: appsych-u04-w22-q05
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 1.A"
      points: 1
      prompt: |
        In Festinger and Carlsmith's classic study, participants paid $1 to tell someone a dull task was enjoyable later rated the task as more enjoyable than participants paid $20. Which explanation fits cognitive dissonance theory?
      options:
        - "The $1 participants were reinforced more strongly for lying."
        - "The $20 participants felt more dissonance and so changed their attitudes more."
        - "The $1 participants were simply more honest people."
        - "The $1 participants lacked enough external justification for the lie, so they reduced dissonance by changing their attitude."
      option_explanations:
        - |
          $1 is a smaller reward than $20; a reinforcement account would predict more liking in the $20 group, the opposite of what was found.
        - |
          The $20 was enough justification ("I did it for the money"), so those participants felt little dissonance and changed their attitudes less.
        - |
          Participants were assigned to payment amounts, so personality differences are not the explanation; the payment amount is.
        - |
          Correct. With only $1, “I told someone a boring task was fun” clashed with “the task was boring,” and changing the attitude toward the task reduced the tension.
      answer: 3
    - slug: appsych-u04-w22-q06
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 1.B"
      points: 1
      prompt: |
        A volunteer first asks neighbors to sign a petition for a crosswalk. A week later, she asks those who signed to spend a Saturday painting crosswalk signs. Which technique is she using?
      options:
        - "Door-in-the-face"
        - "The halo effect"
        - "Foot-in-the-door"
        - "The peripheral route"
      option_explanations:
        - |
          Door-in-the-face starts with a large request that is refused; here the first request is small and accepted.
        - |
          The halo effect is one positive trait coloring other judgments; this is a sequence of requests, not a judgment about a person.
        - |
          Correct. A small request (signing) that people accept makes a larger later request (a Saturday of work) more likely to be accepted.
        - |
          The peripheral route is persuasion through surface cues; this scenario is about the order of requests.
      answer: 2
    - slug: appsych-u04-w22-q07
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 1.B"
      points: 1
      prompt: |
        After hearing that a classmate's bike was stolen, Leo says, "He probably left it unlocked. Things like that don't happen to careful people." Leo's reaction best illustrates
      options:
        - "the just-world phenomenon"
        - "out-group homogeneity bias"
        - "the door-in-the-face technique"
        - "the mere exposure effect"
      option_explanations:
        - |
          Correct. Believing that people get what they deserve leads Leo to blame the victim for the theft without any evidence.
        - |
          Out-group homogeneity is seeing members of another group as all alike; Leo is judging one person's misfortune.
        - |
          Door-in-the-face is a compliance technique using a large then a small request; it does not apply here.
        - |
          Mere exposure concerns liking after repeated exposure; Leo is explaining a misfortune, not forming a liking.
      answer: 0
    - slug: appsych-u04-w22-q08
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 1.B"
      points: 1
      prompt: |
        A student is told a study shows that early risers earn better grades and spends ten minutes explaining why that might be. Later she learns the study was faked, yet she still believes early risers do better. This is
      options:
        - "cognitive dissonance"
        - "belief perseverance"
        - "the halo effect"
        - "ethnocentrism"
      option_explanations:
        - |
          Dissonance is tension from conflicting thoughts or actions, usually reduced by changing an attitude; here the belief simply survives the loss of its evidence.
        - |
          Correct. Once she built her own explanation, the belief outlasted the discrediting of the evidence it rested on.
        - |
          The halo effect is a positive trait spreading to other judgments of a person; no person is being judged here.
        - |
          Ethnocentrism is judging other cultures by one's own; it is unrelated to this belief about sleep.
      answer: 1
    - slug: appsych-u04-w22-q09
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 2.C"
      points: 1
      prompt: |
        A researcher measures attitudes toward a minority group only by asking people, "How positively do you feel about this group?" Which problem most threatens the validity of the results?
      options:
        - "Random assignment cannot be used with surveys."
        - "The measure has too many items to be reliable."
        - "Experimenter bias from a double-blind design"
        - "Social desirability bias may lead people to report more positive attitudes than they hold."
      option_explanations:
        - |
          Random assignment is a feature of experiments; its absence does not threaten whether a survey measures what it claims.
        - |
          The measure described is a single item; more items usually increase reliability rather than reduce it.
        - |
          A double-blind design reduces experimenter bias; it does not create it, and none is described here.
        - |
          Correct. On sensitive topics people may answer in socially acceptable ways, so the self-report may not measure their true attitude.
      answer: 3
    # ---- Spiral review
    - slug: appsych-u04-w22-q10
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        A voter decides a candidate who stumbled over a question in a debate must be unintelligent, ignoring that the moderator interrupted three times. This judgment illustrates
      options:
        - "the self-serving bias"
        - "relative deprivation"
        - "upward social comparison"
        - "the fundamental attribution error"
      option_explanations:
        - |
          The self-serving bias is about explaining one's own successes and failures; the voter is explaining someone else's performance.
        - |
          Relative deprivation is feeling deprived compared with others; the voter is explaining a behavior.
        - |
          Upward comparison is evaluating oneself against someone better off; the voter is not evaluating himself.
        - |
          Correct. The voter overweights a disposition (intelligence) and underweights a clear situational cause (the interruptions) for another person's behavior.
      answer: 3
    - slug: appsych-u04-w22-q11
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        A worker believes, "If I learn new skills, I'll get promoted; it's up to me." This worker has
      options:
        - "an external locus of control"
        - "an internal locus of control"
        - "a pessimistic explanatory style"
        - "out-group homogeneity bias"
      option_explanations:
        - |
          An external locus attributes outcomes to luck or powerful others; this worker credits her own actions.
        - |
          Correct. Believing outcomes follow from one's own actions is an internal locus of control.
        - |
          A pessimistic style explains bad events as internal, stable and global; this statement is a hopeful expectation, not an explanation of a bad event.
        - |
          Out-group homogeneity is about perceiving other groups as alike; this is a belief about personal control.
      answer: 1
    - slug: appsych-u04-w22-q12
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        An ad repeatedly pairs a new soda with upbeat music that viewers already enjoy, until the soda alone produces good feelings. In classical conditioning terms, the soda has become
      options:
        - "an unconditioned stimulus"
        - "a negative reinforcer"
        - "a conditioned stimulus"
        - "an unconditioned response"
      option_explanations:
        - |
          The unconditioned stimulus is the music, which already produced good feelings without learning; the soda gained its effect through pairing.
        - |
          A negative reinforcer removes something unpleasant to increase a behavior (operant conditioning); this is pairing of stimuli.
        - |
          Correct. A once-neutral stimulus (the soda) paired with an unconditioned stimulus (enjoyed music) comes to trigger the response by itself, so it is a conditioned stimulus. This is one way attitudes form.
        - |
          A response is something the viewer does or feels, not the soda; the good feeling to the soda alone is the conditioned response.
      answer: 2
    - slug: appsych-u04-w22-q13
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        Told that a quiet student who loves chess and reads physics books is either a football player or a debate team member, most people guess "debate team" even though the school has five times as many football players. This judgment relies on
      options:
        - "the representativeness heuristic"
        - "an algorithm"
        - "the availability heuristic"
        - "functional fixedness"
      option_explanations:
        - |
          Correct. People judge by how well the student matches their prototype of a debater and ignore base rates; the same shortcut underlies stereotyping.
        - |
          An algorithm is a step-by-step procedure that guarantees a solution; this is a quick, error-prone guess.
        - |
          The availability heuristic judges likelihood by how easily examples come to mind; here the judgment rests on resemblance to a prototype.
        - |
          Functional fixedness is failing to see new uses for objects; it does not concern judging category membership.
      answer: 0
    - slug: appsych-u04-w22-q14
      type: multi_select
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 1.B"
      points: 2
      partial_credit: true
      prompt: |
        Which situations make central-route processing of a persuasive message more likely? Select all that apply.
      options:
        - "The listener will personally be affected by the issue."
        - "The listener is distracted by a loud room while the message plays."
        - "The listener has background knowledge to evaluate the evidence."
        - "The listener has plenty of time to think about the message."
        - "The message features a famous athlete with no expertise on the issue."
      option_explanations:
        - |
          Correct. Personal relevance raises motivation to think carefully, a condition for the central route.
        - |
          Distraction reduces the ability to process arguments, pushing people toward the peripheral route.
        - |
          Correct. Knowledge gives the ability to judge argument quality, a condition for the central route.
        - |
          Correct. Time to think increases ability to elaborate on the arguments.
        - |
          A famous but non-expert endorser is a peripheral cue, working through the halo effect rather than careful thought.
      answer: [0, 2, 3]
    - slug: appsych-u04-w22-q15
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.C (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        A hypothetical team finds that the same people's scores on an implicit attitude test change a lot from one week to the next, and that the scores barely predict how those people behave. Which statements are accurate? Select all that apply.
      options:
        - "The test shows low test-retest reliability."
        - "The scores show weak predictive validity."
        - "A measure can be valid even if it is not reliable."
        - "Low reliability limits how valid the measure can be."
        - "The findings prove that implicit attitudes do not exist."
      option_explanations:
        - |
          Correct. Reliability is consistency; scores that change a lot over a week for the same people have low test-retest reliability.
        - |
          Correct. Predictive validity is how well scores predict a related outcome; scores that barely predict behavior show weak predictive validity.
        - |
          An unreliable measure gives inconsistent results, so it cannot consistently measure what it claims; reliability is necessary for validity.
        - |
          Correct. Because inconsistent scores contain a lot of random error, they cannot correlate strongly with anything, which caps validity.
        - |
          Problems with one measure do not show that the thing measured is absent; they show the measure is noisy.
      answer: [0, 1, 3]
    - slug: appsych-u04-w22-q16
      type: true_false
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 1.A"
      points: 1
      prompt: |
        True or false: Out-group homogeneity bias is the tendency to see members of one's own group as all alike.
      answer: false
      explanation: |
        False. It is the reverse: people see members of *other* groups as all alike ("they're all the same") while seeing their own group as made of varied individuals.
    - slug: appsych-u04-w22-q17
      type: true_false
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: The physical tension that can accompany cognitive dissonance, such as a racing heart, is driven by the sympathetic division of the autonomic nervous system.
      answer: true
      explanation: |
        True. The sympathetic division arouses the body (raising heart rate and sweating) in response to stress; dissonance is a mildly stressful state, and the parasympathetic division calms the body afterward.
