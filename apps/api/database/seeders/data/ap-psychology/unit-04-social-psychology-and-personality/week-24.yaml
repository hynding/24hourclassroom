week: 24
unit: 4
title: "Personality: Four Ways to Describe a Person"
topics: ["4.4", "4.5"]
guide: guides/week-24.md
guide_description: |
  Four perspectives on personality. Psychodynamic: Freud's unconscious, id, ego and superego, eight defense
  mechanisms with examples, the neo-Freudians, and why projective tests (Rorschach, TAT) are criticized for
  reliability and validity. Humanistic: Maslow's self-actualization and Rogers' genuineness, acceptance,
  empathy, self-concept and unconditional positive regard. Social-cognitive: Bandura's reciprocal determinism,
  self-efficacy and locus of control. Trait: factor analysis, the Big Five, the MMPI and personality
  inventories, and the person-situation debate. Worked examples trace reciprocal determinism and explain one
  student's test anxiety from all four perspectives.
flashcards_description: |
  32 cards on personality: psychodynamic structure and defense mechanisms, projective tests, humanistic
  concepts, reciprocal determinism and self-efficacy, the Big Five, factor analysis, personality inventories
  and how each theory is evaluated.

flashcards:
  - front: "Personality (Unit 4) → definition"
    back: |
      A person's characteristic pattern of thinking, feeling and acting that is fairly consistent across situations and time.
    topic_code: "4.4"
  - front: "Freud's view of the unconscious → main claim"
    back: |
      Most of the mind lies outside awareness (the iceberg image); unacceptable wishes and memories there still shape behavior, dreams and slips of the tongue.
    topic_code: "4.4"
  - front: "Id → definition"
    back: |
      Freud's unconscious reservoir of basic drives, present from birth, operating on the pleasure principle: it seeks immediate gratification.
    topic_code: "4.4"
  - front: "Ego → definition"
    back: |
      The largely conscious mediator operating on the reality principle: it satisfies the id in realistic ways and balances id, superego and reality.
    topic_code: "4.4"
  - front: "Superego → definition"
    back: |
      The internalized moral standards of parents and society: the conscience, producing guilt and pride.
    topic_code: "4.4"
  - front: "Defense mechanism → definition"
    back: |
      An unconscious strategy the ego uses to reduce anxiety by distorting or disguising reality.
    topic_code: "4.4"
  - front: "Repression → definition"
    back: |
      Pushing anxiety-arousing thoughts, feelings and memories out of conscious awareness; Freud saw it as the basis of other defenses.
    topic_code: "4.4"
  - front: "Displacement → definition and example"
    back: |
      Redirecting an impulse toward a safer target. Yelled at by a coach, a player snaps at a younger sibling.
    topic_code: "4.4"
  - front: "Projection → definition and example"
    back: |
      Attributing one's own unacceptable feelings to others. A person who feels jealous accuses a friend of being jealous.
    topic_code: "4.4"
  - front: "Reaction formation → definition and example"
    back: |
      Turning an unacceptable impulse into its opposite. Being exaggeratedly sweet to someone you resent.
    topic_code: "4.4"
  - front: "Rationalization → definition and example"
    back: |
      Offering a self-justifying explanation in place of the real, more threatening reason. “I didn't get the job because I didn't really want it.”
    topic_code: "4.4"
  - front: "Sublimation → definition and example"
    back: |
      Channeling an unacceptable impulse into a socially valued activity. Turning aggression into competitive sport.
    topic_code: "4.4"
  - front: "Regression and denial → definitions"
    back: |
      Regression: retreating to more childlike behavior under stress. Denial: refusing to acknowledge a painful reality.
    topic_code: "4.4"
  - front: "Neo-Freudians → three names and ideas"
    back: |
      Adler: striving to overcome inferiority. Horney: anxiety in relationships, challenged Freud's views of women. Jung: the collective unconscious and archetypes.
    topic_code: "4.4"
  - front: "Projective test → definition and two examples"
    back: |
      A test using ambiguous stimuli so people project inner motives onto them: the Rorschach inkblot test and the Thematic Apperception Test (TAT).
    topic_code: "4.4"
  - front: "Projective tests → main criticism"
    back: |
      Weak inter-rater reliability (scorers disagree) and weak validity (scores predict real-world outcomes poorly).
    topic_code: "4.4"
  - front: "Psychodynamic theory → main scientific criticism"
    back: |
      Many claims are not falsifiable: they explain any outcome after the fact but predict little. They were based on a small, unrepresentative set of patients.
    topic_code: "4.4"
  - front: "Humanistic theory → core emphasis"
    back: |
      Free will, conscious experience and the drive toward personal growth and self-actualization (Maslow, Rogers).
    topic_code: "4.4"
  - front: "Self-actualization → definition"
    back: |
      Fulfilling one's potential; Maslow's highest motive, pursued once more basic needs are met.
    topic_code: "4.4"
  - front: "Rogers' growth-promoting climate → three conditions"
    back: |
      Genuineness (openness), acceptance through unconditional positive regard, and empathy.
    topic_code: "4.4"
  - front: "Unconditional positive regard → definition"
    back: |
      Accepting and valuing a person without conditions, even when disapproving of a behavior. Conditional regard can distort the self-concept.
    topic_code: "4.4"
  - front: "Self-concept (Rogers) → definition"
    back: |
      All of a person's thoughts and feelings about who they are; central to Rogers' theory. Self-esteem is the overall value placed on oneself.
    topic_code: "4.4"
  - front: "Reciprocal determinism → definition"
    back: |
      Bandura's idea that behavior, personal/cognitive factors and environment all influence each other.
    topic_code: "4.5"
  - front: "Self-efficacy → definition and sources"
    back: |
      Belief in one's ability to succeed at a specific task. Built by past mastery, watching similar others succeed, encouragement, and reading arousal as readiness.
    topic_code: "4.5"
  - front: "Self-efficacy versus self-esteem → difference"
    back: |
      Self-efficacy is task-specific confidence (“I can solve this equation”); self-esteem is overall self-worth (“I am a worthwhile person”).
    topic_code: "4.5"
  - front: "Personality trait → definition"
    back: |
      A stable, characteristic tendency to think, feel and behave in certain ways across situations.
    topic_code: "4.5"
  - front: "Factor analysis → role in trait theory"
    back: |
      A statistical method that finds clusters of correlated items; it reduced thousands of trait words to a few dimensions such as the Big Five.
    topic_code: "4.5"
  - front: "Big Five → the five factors (OCEAN)"
    back: |
      Openness to experience, Conscientiousness, Extraversion, Agreeableness, Neuroticism (low emotional stability). Each is a continuum.
    topic_code: "4.5"
  - front: "Big Five → evidence for them"
    back: |
      Found across many cultures, moderately heritable in twin studies, increasingly stable through adulthood, and predictive of outcomes (conscientiousness predicts school and job performance).
    topic_code: "4.5"
  - front: "Personality inventory → definition"
    back: |
      A questionnaire with many items measuring traits, objectively scored; generally more reliable and valid than projective tests.
    topic_code: "4.5"
  - front: "MMPI → how it was built"
    back: |
      Empirically: items were kept if they distinguished between groups (such as people with and without a diagnosed condition), whatever their content. It includes validity scales to detect faking.
    topic_code: "4.5"
  - front: "Person-situation debate → resolution"
    back: |
      Traits predict any single behavior weakly (Mischel) but predict average behavior across many situations well; situations shape individual acts.
    topic_code: "4.5"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 4.4 and 4.5: psychodynamic theory and defense
    mechanisms, projective tests, humanistic theory, social-cognitive theory and self-efficacy, the Big Five and
    personality inventories), with 7 questions (30%) reviewing earlier weeks (attribution, conformity and
    attitudes from weeks 21–23, observational learning, twin studies, test reliability and implicit memory).
    Includes a three-question set on one invented trait study. Multiple choice, select-all and true/false items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented Big Five study (4.5)
    - slug: appsych-u04-w24-q01
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; CED Topic 4.5, Skill 2.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team asked 500 eleventh graders at 10 high schools to complete a 60-item Big Five inventory (each factor scored 12–60). At the end of the year, schools reported each consenting student's percentage of homework assignments turned in on time. Correlations with on-time homework:

        | Big Five factor | r with on-time homework |
        |---|---|
        | Openness | 0.08 |
        | Conscientiousness | 0.42 |
        | Extraversion | −0.05 |
        | Agreeableness | 0.12 |
        | Neuroticism | −0.18 |

        The correlations for conscientiousness and neuroticism were statistically significant.
      prompt: |
        Which research method did the team use?
      options:
        - "A correlational study"
        - "An experiment"
        - "A case study"
        - "A longitudinal experiment with random assignment"
      option_explanations:
        - |
          Correct. The team measured two existing variables (trait scores and homework completion) and computed correlations, without manipulating anything.
        - |
          An experiment requires manipulating an independent variable and randomly assigning participants; traits cannot be assigned.
        - |
          A case study examines one person or a few in depth; this study measured 500 students on the same variables.
        - |
          Although homework was tracked over a year, nothing was manipulated and no one was randomly assigned, so it is not an experiment of any kind.
      answer: 0
    - slug: appsych-u04-w24-q02
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; CED Topic 4.5, Skill 3.B"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team asked 500 eleventh graders at 10 high schools to complete a 60-item Big Five inventory (each factor scored 12–60). At the end of the year, schools reported each consenting student's percentage of homework assignments turned in on time. Correlations with on-time homework:

        | Big Five factor | r with on-time homework |
        |---|---|
        | Openness | 0.08 |
        | Conscientiousness | 0.42 |
        | Extraversion | −0.05 |
        | Agreeableness | 0.12 |
        | Neuroticism | −0.18 |

        The correlations for conscientiousness and neuroticism were statistically significant.
      prompt: |
        Which statement correctly interprets the results?
      options:
        - "Extraversion has the strongest relationship with homework because its correlation is negative."
        - "Being conscientious causes students to turn in more homework on time."
        - "Students higher in conscientiousness tended to turn in more homework on time, the strongest relationship in the table."
        - "Students higher in neuroticism tended to turn in more homework on time."
      option_explanations:
        - |
          Strength depends on the absolute value of r; −0.05 is close to zero, the weakest relationship in the table.
        - |
          A correlation does not show causation; for example, a home environment with structure could raise both conscientiousness scores and homework completion.
        - |
          Correct. r = 0.42 is a moderate positive correlation and the largest in absolute value.
        - |
          The neuroticism correlation is negative (−0.18), so higher neuroticism went with slightly less on-time homework.
      answer: 2
    - slug: appsych-u04-w24-q03
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; CED Topic 4.5, Skill 2.C"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team asked 500 eleventh graders at 10 high schools to complete a 60-item Big Five inventory (each factor scored 12–60). At the end of the year, schools reported each consenting student's percentage of homework assignments turned in on time. Correlations with on-time homework:

        | Big Five factor | r with on-time homework |
        |---|---|
        | Openness | 0.08 |
        | Conscientiousness | 0.42 |
        | Extraversion | −0.05 |
        | Agreeableness | 0.12 |
        | Neuroticism | −0.18 |

        The correlations for conscientiousness and neuroticism were statistically significant.
      prompt: |
        Students retook the inventory four weeks later, and their scores correlated r = 0.85 with their first scores. This result is evidence of the inventory's
      options:
        - "predictive validity"
        - "test-retest reliability"
        - "standardization"
        - "statistical significance"
      option_explanations:
        - |
          Predictive validity is whether scores predict a related outcome (like homework); this result compares the test with itself over time.
        - |
          Correct. A high correlation between the same people's scores on two occasions shows the test gives consistent results: test-retest reliability.
        - |
          Standardization is giving and scoring a test the same way and comparing to a norm group; it is not shown by a retest correlation.
        - |
          Statistical significance says a result is unlikely to be due to chance; the retest correlation specifically measures consistency.
      answer: 1
    - slug: appsych-u04-w24-q04
      type: multiple_choice
      topic_code: "4.4"
      source: "Original item; CED Topic 4.4, Skill 1.B"
      points: 1
      prompt: |
        After being criticized by her manager, Jada comes home and yells at her dog. Which defense mechanism does this illustrate?
      options:
        - "Projection"
        - "Sublimation"
        - "Reaction formation"
        - "Displacement"
      option_explanations:
        - |
          Projection attributes one's own feelings to someone else; Jada is redirecting her anger, not claiming the dog is angry.
        - |
          Sublimation channels impulses into socially valued activities; yelling at a dog is not socially valued.
        - |
          Reaction formation turns an impulse into its opposite (being extra kind to the manager); Jada expresses anger openly.
        - |
          Correct. She redirects anger from a threatening target (her manager) to a safer one (her dog).
      answer: 3
    - slug: appsych-u04-w24-q05
      type: multiple_choice
      topic_code: "4.4"
      source: "Original item; CED Topic 4.4, Skill 1.B"
      points: 1
      prompt: |
        A student who feels intense rivalry toward a classmate goes out of his way to praise her loudly and constantly. Freud would call this
      options:
        - "rationalization"
        - "regression"
        - "denial"
        - "reaction formation"
      option_explanations:
        - |
          Rationalization is a self-justifying excuse for behavior; the student is not explaining anything away.
        - |
          Regression is a retreat to childlike behavior; exaggerated praise is not childlike.
        - |
          Denial refuses to acknowledge a reality; the student is acting out the opposite of his feeling, a different mechanism.
        - |
          Correct. Turning an unacceptable impulse (hostility) into its exaggerated opposite (praise) is reaction formation.
      answer: 3
    - slug: appsych-u04-w24-q06
      type: multiple_choice
      topic_code: "4.4"
      source: "Original item; CED Topic 4.4, Skill 1.A"
      points: 1
      prompt: |
        A hungry child wants to grab a cookie from the counter, but decides to ask her parent whether she may have one after dinner. In Freud's terms, which part of personality produced the decision to ask?
      options:
        - "The id"
        - "The ego"
        - "The collective unconscious"
        - "The pleasure principle"
      option_explanations:
        - |
          The id demands immediate gratification (grab the cookie now); it does not delay or seek a realistic route.
        - |
          Correct. The ego operates on the reality principle, finding a realistic way to satisfy the id's desire.
        - |
          The collective unconscious is Jung's concept of shared archetypes, not a part of Freud's personality structure.
        - |
          The pleasure principle is how the id operates; asking and waiting reflects the reality principle instead.
      answer: 1
    - slug: appsych-u04-w24-q07
      type: multiple_choice
      topic_code: "4.4"
      source: "Original item; CED Topic 4.4, Skill 2.C"
      points: 1
      prompt: |
        Two trained psychologists score the same person's Rorschach responses and reach very different conclusions. This is evidence of the test's weak
      options:
        - "inter-rater reliability"
        - "standardization sample"
        - "effect size"
        - "random assignment"
      option_explanations:
        - |
          Correct. Inter-rater reliability is agreement between scorers; when scorers disagree about the same responses, it is low.
        - |
          A standardization sample is the norm group used to interpret scores; the problem here is disagreement between scorers.
        - |
          Effect size describes how large a difference or relationship is in a study; it does not describe scorer agreement.
        - |
          Random assignment is a feature of experiments, not a property of a test's scoring.
      answer: 0
    - slug: appsych-u04-w24-q08
      type: multiple_choice
      topic_code: "4.4"
      source: "Original item; CED Topic 4.4, Skill 1.B"
      points: 1
      prompt: |
        A parent tells a teen, "I'll always love you and value you, even though I'm upset about the curfew you broke." Which humanistic concept does this express?
      options:
        - "Self-efficacy"
        - "Reciprocal determinism"
        - "Unconditional positive regard"
        - "Sublimation"
      option_explanations:
        - |
          Self-efficacy is a person's belief in their ability to succeed at a task; the parent is expressing acceptance.
        - |
          Reciprocal determinism is Bandura's interaction of behavior, person and environment, a social-cognitive idea.
        - |
          Correct. Rogers' unconditional positive regard values the person while still disapproving of a behavior.
        - |
          Sublimation is a Freudian defense mechanism that channels impulses into valued activities, not a statement of acceptance.
      answer: 2
    - slug: appsych-u04-w24-q09
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; CED Topic 4.5, Skill 1.B"
      points: 1
      prompt: |
        Marco believes he is good at music, so he joins the school band. Playing with skilled musicians improves his playing, and his growing skill makes him confident enough to audition for a regional orchestra. Which concept does this sequence best illustrate?
      options:
        - "The pleasure principle"
        - "Reciprocal determinism"
        - "Projection"
        - "Factor analysis"
      option_explanations:
        - |
          The pleasure principle is how Freud's id seeks immediate gratification; it does not describe a cycle of beliefs, choices and settings.
        - |
          Correct. His beliefs (personal), choices (behavior) and the band (environment) influence each other in a continuing cycle.
        - |
          Projection attributes one's own feelings to others; nothing like that occurs here.
        - |
          Factor analysis is a statistical technique for finding clusters of correlated items, not a process in a person's life.
      answer: 1
    - slug: appsych-u04-w24-q10
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; CED Topic 4.5, Skill 1.B"
      points: 1
      prompt: |
        A person who is talkative, energized by parties and seeks out social contact would most likely score high on which Big Five factor?
      options:
        - "Extraversion"
        - "Openness"
        - "Agreeableness"
        - "Conscientiousness"
      option_explanations:
        - |
          Correct. Extraversion describes sociability, talkativeness and drawing energy from others.
        - |
          Openness concerns curiosity, imagination and interest in new experiences, not sociability.
        - |
          Agreeableness concerns being trusting, cooperative and kind; a person can be agreeable and quiet.
        - |
          Conscientiousness concerns organization and dependability, not social energy.
      answer: 0
    # ---- Spiral review
    - slug: appsych-u04-w24-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.A (spiral review)"
      points: 1
      prompt: |
        Which finding would most strongly suggest that a personality trait is influenced by genes?
      options:
        - "Adopted children resemble their adoptive parents on the trait more than their biological parents."
        - "Siblings raised together are similar on the trait."
        - "Fraternal twins raised together resemble each other more than identical twins raised together."
        - "Identical twins reared apart resemble each other on the trait more than fraternal twins reared apart."
      option_explanations:
        - |
          Resemblance to adoptive parents points to environmental influence, not genetic influence.
        - |
          Siblings raised together share both genes and environment, so their similarity cannot separate the two.
        - |
          This is the opposite of what a genetic influence would predict; identical twins share more genes.
        - |
          Correct. Identical twins share nearly all their genes; their greater similarity despite separate environments points to heritability.
      answer: 3
    - slug: appsych-u04-w24-q12
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        One source of self-efficacy is watching someone similar to you succeed. That source draws on which learning process from Unit 3?
      options:
        - "Operant shaping"
        - "Habituation"
        - "Observational learning"
        - "Classical conditioning"
      option_explanations:
        - |
          Shaping reinforces successive approximations of one's own behavior; seeing someone else succeed is learning by observation.
        - |
          Habituation is a decreasing response to a repeated stimulus; it does not build confidence from a model.
        - |
          Correct. Bandura's observational learning, including vicarious reinforcement, lets people learn what they can do by watching models like themselves.
        - |
          Classical conditioning links stimuli to automatic responses; self-efficacy is a belief built through observing models.
      answer: 2
    - slug: appsych-u04-w24-q13
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 4.A (spiral review)"
      points: 1
      prompt: |
        A trait theorist predicts that an extraverted student will speak up in every class. She speaks constantly in drama but hardly at all in a lecture hall of 300. Which week 23 idea best explains the difference?
      options:
        - "Strong situations, with clear norms, can override traits in any one setting."
        - "Group polarization makes extraverts quieter."
        - "Superordinate goals reduce extraversion."
        - "Deindividuation increases talking in large groups."
      option_explanations:
        - |
          Correct. A large lecture hall has strong norms for quiet listening; situations shape single acts, while traits predict behavior averaged across settings.
        - |
          Group polarization strengthens a group's attitudes through discussion; it does not explain a person being quieter in one setting.
        - |
          Superordinate goals reduce conflict between groups; they do not alter a person's trait.
        - |
          Deindividuation would predict less restraint, not quieter behavior, and a lecture is not an aroused, anonymous crowd.
      answer: 0
    - slug: appsych-u04-w24-q14
      type: multi_select
      topic_code: "4.4"
      source: "Original item; CED Topic 4.4, Skill 4.B"
      points: 2
      partial_credit: true
      prompt: |
        Which are common scientific criticisms of Freud's psychodynamic theory? Select all that apply.
      options:
        - "Many of its claims are hard to falsify, explaining outcomes after the fact."
        - "It ignores the unconscious mind."
        - "It was based largely on a small, unrepresentative group of patients."
        - "Its psychosexual stage claims have little scientific support."
        - "It relies entirely on controlled laboratory experiments."
      option_explanations:
        - |
          Correct. A theory that can explain any outcome but predict few in advance cannot be tested well.
        - |
          The unconscious is central to Freud's theory; ignoring it is the opposite of the actual criticism.
        - |
          Correct. Freud built his theory from case studies of a limited set of patients, limiting generalizability.
        - |
          Correct. Research has not supported the specific claims about oral, anal and phallic fixations.
        - |
          Freud relied on clinical case studies, not controlled experiments; the criticism is the lack of experimental testing.
      answer: [0, 2, 3]
    - slug: appsych-u04-w24-q15
      type: multi_select
      topic_code: "4.5"
      source: "Original item; CED Topic 4.5, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the Big Five are accurate? Select all that apply.
      options:
        - "Each factor is a continuum on which people vary by degree."
        - "The factors were identified partly through factor analysis."
        - "People are classified into exactly one of five personality types."
        - "Twin studies suggest the factors are moderately heritable."
        - "The factors were derived from Freud's psychosexual stages."
      option_explanations:
        - |
          Correct. Scores fall along a dimension, roughly normally distributed, not into categories.
        - |
          Correct. Factor analysis grouped correlated trait items into a small number of broad dimensions.
        - |
          Each person has a score on all five factors; they are dimensions, not types.
        - |
          Correct. Identical twins are more similar on the factors than fraternal twins, indicating genetic influence.
        - |
          The Big Five come from statistical analysis of trait descriptions, not from psychodynamic theory.
      answer: [0, 1, 3]
    - slug: appsych-u04-w24-q16
      type: true_false
      topic_code: "4.5"
      source: "Original item; CED Topic 4.5, Skill 1.A"
      points: 1
      prompt: |
        True or false: Self-efficacy and self-esteem mean the same thing.
      answer: false
      explanation: |
        False. Self-efficacy is confidence about succeeding at a specific task ("I can pass this driving test"); self-esteem is a person's overall sense of their own worth.
    - slug: appsych-u04-w24-q17
      type: true_false
      topic_code: "2.3"
      source: "Original item; CED Topic 2.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: Implicit memories, such as knowing how to ride a bike, can influence behavior without conscious recollection, which is one modern finding consistent with Freud's broad claim that much mental activity happens outside awareness.
      answer: true
      explanation: |
        True. Implicit (nondeclarative) memories, such as procedural skills and priming effects, operate without conscious recall. This supports the general idea of non-conscious processing, though not Freud's specific claims about repressed wishes.
    - slug: appsych-u04-w24-q18
      type: fill_blank
      topic_code: "4.4"
      source: "Original item; CED Topic 4.4, Skill 1.A"
      points: 1
      prompt: |
        In Freud's theory, the part of personality that acts as the conscience, holding internalized moral standards, is the ____.
      answer: ["superego", "super-ego", "super ego"]
      explanation: |
        The superego holds internalized standards from parents and society and produces guilt and pride.
    - slug: appsych-u04-w24-q19
      type: fill_blank
      topic_code: "2.8"
      source: "Original item; CED Topic 2.8, Skill 2.C (spiral review)"
      points: 1
      prompt: |
        The statistical technique that Spearman used to identify a general intelligence factor, and that trait researchers used to find the Big Five, is called factor ____.
      answer: ["analysis"]
      explanation: |
        Factor analysis finds clusters of items that correlate with each other, revealing underlying dimensions such as g in intelligence or the Big Five in personality.
    - slug: appsych-u04-w24-q20
      type: short_answer
      topic_code: "4.4"
      source: "Original item; CED Topic 4.4, Skill 1.B"
      points: 3
      prompt: |
        Ben failed his driver's test. Identify the defense mechanism in each response.

        (a) "I didn't really want to drive yet anyway; gas is expensive."
        (b) Ben spends the afternoon furiously practicing drum solos, turning his frustration into music his band later performs.
        (c) Ben insists the examiner was the nervous one and that he was perfectly calm.
      answer: |
        (a) Rationalization: a self-justifying explanation replaces the real, painful reason.
        (b) Sublimation: frustration is channeled into a socially valued activity.
        (c) Projection: Ben attributes his own nervousness to the examiner.
      explanation: |
        Three points, one per part. (a) rationalization. (b) sublimation. (c) projection.
    - slug: appsych-u04-w24-q21
      type: short_answer
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.B (spiral review)"
      points: 2
      prompt: |
        Locus of control is part of social-cognitive personality theory.

        (a) Describe what a student with an internal locus of control believes about grades.
        (b) Explain how that belief could affect one element of Bandura's reciprocal determinism.
      answer: |
        (a) That grades depend mainly on her own effort and choices rather than luck or the teacher.
        (b) The belief (personal factor) leads to more studying (behavior), which can change her environment, for example by placing her in an honors class.
      explanation: |
        Two points. (a) outcomes controlled by own actions. (b) links the belief to behavior or environment in a reciprocal way.
    - slug: appsych-u04-w24-q22
      type: short_answer
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 2.C (spiral review)"
      points: 2
      prompt: |
        A job applicant completes a personality inventory and answers every item in the way that makes her look most dependable.

        (a) Name this source of bias in self-report.
        (b) Describe one way inventories such as the MMPI try to detect it.
      answer: |
        (a) Social desirability bias (faking good).
        (b) Validity scales: items that almost no honest person would endorse, or pairs of inconsistent items, flag answers that are distorted.
      explanation: |
        Two points. (a) social desirability bias or faking. (b) validity scales or another detection method such as consistency checks.
    - slug: appsych-u04-w24-q23
      type: long_answer
      topic_code: "4.5"
      source: "Original item; CED Topics 4.4 and 4.5, Skills 1.B and 4.B"
      points: 6
      prompt: |
        Priya is shy and avoids speaking in class.

        (A) Explain Priya's shyness from the psychodynamic perspective.
        (B) Explain it from the humanistic perspective.
        (C) Explain it from the social-cognitive perspective, using self-efficacy.
        (D) Explain it from the trait perspective, naming a Big Five factor.
        (E) Choose one perspective and describe one scientific strength of its evidence.
        (F) Choose a different perspective and describe one scientific weakness.
      answer: |
        (A) Unconscious conflicts or anxieties from early childhood (for example, fear of disapproval from a critical parent) are kept out of awareness, and avoiding speaking protects her ego from anxiety.
        (B) Priya may have received conditional positive regard, so her self-concept depends on not making mistakes; a gap between real and ideal self makes speaking feel risky.
        (C) Past embarrassing experiences or watching classmates get laughed at gave her low self-efficacy for speaking, so she avoids it, which keeps her from gaining the mastery that would raise it.
        (D) She scores low on extraversion (and perhaps high on neuroticism), a stable, partly heritable trait.
        (E) Trait theory: Big Five measures are reliable, found across cultures and predict outcomes; or social-cognitive theory: built on testable experiments.
        (F) Psychodynamic: claims are hard to falsify; or humanistic: concepts like self-actualization are vague and hard to measure.
      explanation: |
        Six points, one per part. (A) unconscious conflict or defense. (B) self-concept, conditional regard or blocked growth. (C) self-efficacy correctly applied. (D) a correct Big Five factor (low extraversion or high neuroticism). (E) an accurate strength for the chosen theory. (F) an accurate weakness for a different theory.
