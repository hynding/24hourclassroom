week: 25
unit: 4
title: "Motivation: What Gets Us Moving"
topics: ["4.6"]
guide: guides/week-25.md
guide_description: |
  Theories of motivation and what each explains: instinct, drive-reduction and homeostasis, arousal theory and
  the Yerkes-Dodson law, incentives, Maslow's hierarchy (as a description, not a law) and self-determination
  theory's competence, autonomy and relatedness; intrinsic and extrinsic motivation and the overjustification
  effect in Lepper, Greene and Nisbett's marker study; Lewin's motivational conflicts; sensation seeking; and
  hunger, from ghrelin, leptin, insulin and the hypothalamus to portion size, social facilitation and culture.
  Worked examples read an inverted-U table of arousal and quiz scores and match four behaviors to theories.
flashcards_description: |
  30 cards on motivation theories, homeostasis, the Yerkes-Dodson law, self-determination theory, intrinsic
  and extrinsic motivation, the overjustification effect, Lewin's conflicts, sensation seeking, and the
  biological, social and cultural control of hunger.

flashcards:
  - front: "Motivation (Unit 4) → definition"
    back: |
      A need or desire that energizes behavior and directs it toward a goal.
    topic_code: "4.6"
  - front: "Instinct theory → idea and problem"
    back: |
      Behavior is driven by unlearned, species-wide instincts. It declined because naming an instinct for each behavior described rather than explained it.
    topic_code: "4.6"
  - front: "Drive-reduction theory → idea"
    back: |
      A physiological need creates an aroused tension state (drive) that motivates behavior to reduce the need and restore homeostasis (Hull).
    topic_code: "4.6"
  - front: "Homeostasis in motivation → definition and drive link"
    back: |
      The body's tendency to maintain a balanced, steady internal state, like a thermostat holding a set temperature. In drive-reduction theory, a need upsets it and the drive pushes behavior that restores it.
    topic_code: "4.6"
  - front: "Primary versus secondary drives → difference"
    back: |
      Primary drives are unlearned and biological (hunger, thirst). Secondary drives are learned (the desire for money or grades).
    topic_code: "4.6"
  - front: "Drive-reduction theory → main weakness"
    back: |
      It cannot explain why people seek stimulation and tension when their needs are met, such as riding roller coasters or solving puzzles for fun.
    topic_code: "4.6"
  - front: "Arousal theory → idea"
    back: |
      People are motivated to maintain an optimal level of arousal: seeking stimulation when under-aroused and calm when over-aroused.
    topic_code: "4.6"
  - front: "Yerkes-Dodson law → statement"
    back: |
      Performance rises with arousal up to an optimal point, then falls (an inverted U). Easy tasks are done best at higher arousal, difficult tasks at lower arousal.
    topic_code: "4.6"
  - front: "Curvilinear relationship → why r can mislead"
    back: |
      A correlation coefficient measures linear relationships, so an inverted-U relationship such as arousal and performance can give an r near 0 despite a strong pattern.
    topic_code: "4.6"
  - front: "Incentive theory → idea"
    back: |
      External stimuli (incentives) pull behavior: food smells, money, grades. Drives push from within; incentives pull from outside.
    topic_code: "4.6"
  - front: "Maslow's hierarchy of needs → levels"
    back: |
      Physiological, safety, belongingness and love, esteem, self-actualization (later self-transcendence); lower needs generally take priority, though research shows the order is not fixed.
    topic_code: "4.6"
  - front: "Self-determination theory → three needs"
    back: |
      Competence, autonomy and relatedness (Deci and Ryan). Meeting them fosters intrinsic motivation and well-being.
    topic_code: "4.6"
  - front: "Intrinsic motivation → definition"
    back: |
      Doing something for its own sake because it is interesting, enjoyable or satisfying.
    topic_code: "4.6"
  - front: "Extrinsic motivation → definition"
    back: |
      Doing something to earn an external reward or avoid a punishment.
    topic_code: "4.6"
  - front: "Overjustification effect → definition"
    back: |
      Offering an expected reward for an activity people already enjoy can reduce their intrinsic motivation to do it.
    topic_code: "4.6"
  - front: "Lepper, Greene and Nisbett (1973) markers study → finding"
    back: |
      Preschoolers who expected and got a “good player” award for drawing later drew less in free time than children given no award or an unexpected one.
    topic_code: "4.6"
  - front: "Rewards that do not undermine interest → which kind"
    back: |
      Unexpected rewards and rewards that inform people of their competence, rather than control their behavior, tend not to reduce intrinsic motivation.
    topic_code: "4.6"
  - front: "Approach-approach conflict → definition and example"
    back: |
      A choice between two attractive options. Two good colleges both offer admission.
    topic_code: "4.6"
  - front: "Avoidance-avoidance conflict → definition and example"
    back: |
      A choice between two unattractive options. Study for a dreaded exam or fail it.
    topic_code: "4.6"
  - front: "Approach-avoidance conflict → definition and example"
    back: |
      One goal with both attractive and unattractive features. A well-paid job with a long commute. It often causes wavering.
    topic_code: "4.6"
  - front: "Multiple approach-avoidance conflict → definition"
    back: |
      Several options, each with good and bad features, such as choosing among three phones with different trade-offs.
    topic_code: "4.6"
  - front: "Sensation seeking → definition"
    back: |
      A trait (Zuckerman) involving the search for varied, novel, intense experiences and willingness to take risks for them; partly heritable.
    topic_code: "4.6"
  - front: "Cannon and Washburn balloon study (1912) → finding and limit"
    back: |
      Stomach contractions coincided with reported hunger. But people without stomachs still feel hunger, so stomach signals are not the whole story.
    topic_code: "4.6"
  - front: "Ghrelin → source and effect"
    back: |
      A hormone released by an empty stomach that signals the brain to increase hunger.
    topic_code: "4.6"
  - front: "Leptin → source and effect"
    back: |
      A hormone released by fat cells that signals the brain to reduce appetite when fat stores are adequate.
    topic_code: "4.6"
  - front: "Hypothalamus in hunger → classic rat lesion findings"
    back: |
      Lesions in the lateral hypothalamus reduced eating; lesions in the ventromedial hypothalamus produced overeating. Modern work describes interacting circuits.
    topic_code: "4.6"
  - front: "Set point → definition"
    back: |
      A weight the body seems to defend by adjusting hunger and metabolism, which helps explain why lost weight is often regained.
    topic_code: "4.6"
  - front: "Social and cultural influences on eating → examples"
    back: |
      Larger portions and unit bias increase intake; people eat more in groups; culture shapes which foods appeal, meal times and body ideals.
    topic_code: "4.6"
  - front: "Operational definition of intrinsic motivation → example"
    back: |
      Minutes spent on an activity during an unrewarded free-choice period, observed by raters who do not know the participant's condition.
    topic_code: "4.6"
  - front: "Error-spot → “Under Yerkes-Dodson, hard tasks are done best at very high arousal”"
    back: |
      Reversed. Difficult or unfamiliar tasks are done best at relatively low arousal; easy or well-learned tasks tolerate higher arousal.
    topic_code: "4.6"

quiz:
  description: |
    22 questions · about 35 minutes · mostly on this week (topic 4.6: theories of motivation, the Yerkes-Dodson
    law, self-determination theory, intrinsic and extrinsic motivation and the overjustification effect, Lewin's
    conflicts, sensation seeking and hunger), with 7 questions (32%) reviewing earlier weeks (hormones and the
    hypothalamus, operant and classical conditioning, Maslow's humanistic theory, and the mere exposure
    effect). Includes a three-question set on one invented reward study. Multiple choice, select-all
    and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented reward experiment (4.6)
    - slug: appsych-u04-w25-q01
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 2.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** Researchers identified 90 middle school students who said they enjoyed solving logic puzzles. Students were randomly assigned to three groups for a 20-minute puzzle session: told in advance they would earn $5 for each puzzle solved (expected reward), given $5 at the end without warning (unexpected reward), or given no reward. A week later, each student was left alone for 10 minutes with puzzles, magazines and a tablet; observers who did not know the students' groups recorded minutes spent on puzzles.

        | Group | n | Mean minutes on puzzles (of 10) | SD |
        |---|---|---|---|
        | Expected reward | 30 | 3.1 | 2.0 |
        | Unexpected reward | 30 | 6.4 | 2.2 |
        | No reward | 30 | 6.8 | 1.9 |

        The expected-reward group's mean differed significantly from both other groups (p under 0.01); the other two did not differ significantly.
      prompt: |
        Which result is the clearest sign of the overjustification effect?
      options:
        - "The unexpected-reward group spent about as much time on puzzles as the no-reward group."
        - "The expected-reward group spent much less free time on puzzles than the other two groups."
        - "All three groups spent at least some free time on puzzles."
        - "The no-reward group had the smallest standard deviation."
      option_explanations:
        - |
          This shows that an unexpected reward did not harm interest, a useful comparison, but the effect itself is the drop in the expected-reward group.
        - |
          Correct. Students who already enjoyed puzzles but expected payment later chose puzzles far less (3.1 versus 6.4 and 6.8 minutes), as if puzzles had become work done for money.
        - |
          Some time on puzzles in every group says nothing about whether the expected reward reduced interest.
        - |
          The smallest SD means the no-reward group's times were the most consistent, which is unrelated to the overjustification effect.
      answer: 1
    - slug: appsych-u04-w25-q02
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 2.B"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** Researchers identified 90 middle school students who said they enjoyed solving logic puzzles. Students were randomly assigned to three groups for a 20-minute puzzle session: told in advance they would earn $5 for each puzzle solved (expected reward), given $5 at the end without warning (unexpected reward), or given no reward. A week later, each student was left alone for 10 minutes with puzzles, magazines and a tablet; observers who did not know the students' groups recorded minutes spent on puzzles.

        | Group | n | Mean minutes on puzzles (of 10) | SD |
        |---|---|---|---|
        | Expected reward | 30 | 3.1 | 2.0 |
        | Unexpected reward | 30 | 6.4 | 2.2 |
        | No reward | 30 | 6.8 | 1.9 |

        The expected-reward group's mean differed significantly from both other groups (p under 0.01); the other two did not differ significantly.
      prompt: |
        Why did the researchers use observers who did not know each student's group?
      options:
        - "To make sure the sample was representative of all middle school students"
        - "To create a placebo condition"
        - "To increase the effect size"
        - "To prevent the observers' expectations from biasing how they recorded behavior"
      option_explanations:
        - |
          Representativeness depends on how participants are sampled, not on what observers know.
        - |
          A placebo is an inactive treatment for participants; keeping observers unaware is about measurement, not treatment.
        - |
          Keeping observers blind protects accuracy; it is not a way to make the difference bigger, and doing so deliberately would be bias.
        - |
          Correct. Observers who know the hypothesis might, without meaning to, record times that fit it; keeping them blind prevents this experimenter bias.
      answer: 3
    - slug: appsych-u04-w25-q03
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 3.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** Researchers identified 90 middle school students who said they enjoyed solving logic puzzles. Students were randomly assigned to three groups for a 20-minute puzzle session: told in advance they would earn $5 for each puzzle solved (expected reward), given $5 at the end without warning (unexpected reward), or given no reward. A week later, each student was left alone for 10 minutes with puzzles, magazines and a tablet; observers who did not know the students' groups recorded minutes spent on puzzles.

        | Group | n | Mean minutes on puzzles (of 10) | SD |
        |---|---|---|---|
        | Expected reward | 30 | 3.1 | 2.0 |
        | Unexpected reward | 30 | 6.4 | 2.2 |
        | No reward | 30 | 6.8 | 1.9 |

        The expected-reward group's mean differed significantly from both other groups (p under 0.01); the other two did not differ significantly.
      prompt: |
        Which statement about the unexpected-reward and no-reward groups is supported?
      options:
        - "The unexpected reward greatly increased interest in puzzles."
        - "The unexpected reward reduced interest as much as the expected reward."
        - "The 0.4-minute difference between them may be due to chance, so the study gives no evidence that an unexpected reward changed interest."
        - "The no-reward group was the control group, so its mean must be the highest."
      option_explanations:
        - |
          The unexpected-reward mean (6.4) was slightly below the no-reward mean (6.8), and the difference was not significant, so there is no evidence of an increase.
        - |
          The unexpected-reward group averaged 6.4 minutes, far above the expected-reward group's 3.1, so its interest was not reduced in the same way.
        - |
          Correct. A non-significant difference of 0.4 minutes could easily arise by chance, so the data do not show that an unexpected reward affected later interest.
        - |
          A control group is a comparison baseline; nothing requires its mean to be the highest.
      answer: 2
    - slug: appsych-u04-w25-q04
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.B"
      points: 1
      prompt: |
        After a long run, Dev drinks water until he no longer feels thirsty. Which theory best explains his behavior?
      options:
        - "Drive-reduction theory"
        - "Arousal theory"
        - "Incentive theory"
        - "Instinct theory"
      option_explanations:
        - |
          Correct. Fluid loss creates a need and an aroused drive (thirst); drinking reduces the drive and restores homeostasis.
        - |
          Arousal theory explains seeking an optimal level of stimulation, not satisfying a physiological need like thirst.
        - |
          Incentive theory emphasizes external pulls such as an appealing drink; Dev's behavior is driven by an internal need.
        - |
          Instinct theory explains complex unlearned species-wide patterns; drinking to quench thirst is better described as reducing a drive.
      answer: 0
    - slug: appsych-u04-w25-q05
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.B"
      points: 1
      prompt: |
        According to the Yerkes-Dodson law, a student learning a difficult new piano piece would perform best with
      options:
        - "the highest possible arousal"
        - "no arousal at all"
        - "relatively low to moderate arousal"
        - "arousal that increases steadily throughout the performance"
      option_explanations:
        - |
          Very high arousal impairs performance on difficult tasks; it suits easy, well-learned tasks better.
        - |
          With no arousal, performance suffers from lack of alertness; the relationship is an inverted U, not a straight line.
        - |
          Correct. Difficult or unfamiliar tasks are performed best at lower arousal than easy ones.
        - |
          The law describes an optimal level, not a steady increase; rising arousal would eventually push performance down.
      answer: 2
    - slug: appsych-u04-w25-q06
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.B"
      points: 1
      prompt: |
        A teacher lets students choose their research topics, sets challenges they can master, and builds a supportive class community. According to self-determination theory, she is supporting
      options:
        - "drive reduction, arousal and incentives"
        - "autonomy, competence and relatedness"
        - "the id, ego and superego"
        - "approach, avoidance and approach-avoidance"
      option_explanations:
        - |
          These are separate theories of motivation, not the needs named by self-determination theory.
        - |
          Correct. Choice supports autonomy, masterable challenges support competence, and community supports relatedness, the three needs that foster intrinsic motivation.
        - |
          These are Freud's personality structures, unrelated to self-determination theory.
        - |
          These are Lewin's types of motivational conflict, not psychological needs.
      answer: 1
    - slug: appsych-u04-w25-q07
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.B"
      points: 1
      prompt: |
        Lina is offered a spot on a traveling soccer team she would love to join, but it would mean giving up weekends with her friends. Which conflict is she facing?
      options:
        - "Approach-approach"
        - "Avoidance-avoidance"
        - "Multiple approach-avoidance"
        - "Approach-avoidance"
      option_explanations:
        - |
          Approach-approach is a choice between two attractive options; here a single goal has both appealing and costly features.
        - |
          Avoidance-avoidance is a choice between two unattractive options; joining the team is attractive to her.
        - |
          Multiple approach-avoidance involves several options each with pros and cons; Lina is weighing one option.
        - |
          Correct. One goal, the team, has both an attractive feature (playing) and an unattractive one (losing weekends).
      answer: 3
    - slug: appsych-u04-w25-q08
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.A"
      points: 1
      prompt: |
        Which person most clearly shows high sensation seeking?
      options:
        - "Ivan, who books a skydiving trip and wants to try street food in a country he has never visited"
        - "Mei, who orders the same meal at the same restaurant every week"
        - "Sam, who studies hard to avoid a bad grade"
        - "Tara, who eats when her stomach growls"
      option_explanations:
        - |
          Correct. Seeking novel, intense experiences and accepting risk to get them defines high sensation seeking.
        - |
          Preferring routine and familiar experiences is typical of low sensation seeking.
        - |
          Studying to avoid a bad grade is extrinsic motivation, not a search for novel thrills.
        - |
          Eating when hungry reflects a biological drive, not the pursuit of intense experiences.
      answer: 0
    - slug: appsych-u04-w25-q09
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.A"
      points: 1
      prompt: |
        Which statement about hunger signals is correct?
      options:
        - "Leptin is released by an empty stomach and increases hunger."
        - "Ghrelin is released by an empty stomach and increases hunger."
        - "Stomach contractions are the only source of hunger signals."
        - "The cerebellum is the main brain area that integrates hunger signals."
      option_explanations:
        - |
          Leptin comes from fat cells and reduces appetite; the hormone from an empty stomach that raises hunger is ghrelin.
        - |
          Correct. Ghrelin, secreted by an empty stomach, signals the brain to increase hunger.
        - |
          People whose stomachs have been removed still feel hungry, so hormones, glucose and brain signals also matter.
        - |
          The hypothalamus integrates hunger signals; the cerebellum coordinates movement.
      answer: 1
    - slug: appsych-u04-w25-q10
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.B"
      points: 1
      prompt: |
        Although she just finished a large dinner, Keisha orders cheesecake after the server brings the dessert tray to the table. Which theory best explains this?
      options:
        - "Drive-reduction theory"
        - "Instinct theory"
        - "Incentive theory"
        - "Self-determination theory"
      option_explanations:
        - |
          Keisha has no physiological need for food after a large dinner, so drive reduction does not explain this.
        - |
          Ordering a specific dessert is not a fixed, unlearned, species-wide behavior.
        - |
          Correct. An appealing external stimulus (the dessert tray) pulls behavior even without an internal need.
        - |
          Self-determination theory concerns competence, autonomy and relatedness, not the pull of an appealing dessert.
      answer: 2
    # ---- Spiral review
    - slug: appsych-u04-w25-q11
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Which brain structure, which also regulates body temperature and the pituitary gland, plays a central role in hunger and thirst?
      options:
        - "The hippocampus"
        - "The medulla"
        - "The occipital lobe"
        - "The hypothalamus"
      option_explanations:
        - |
          The hippocampus is crucial for forming new explicit memories, not for regulating hunger or temperature.
        - |
          The medulla controls automatic survival functions such as heartbeat and breathing, not hunger.
        - |
          The occipital lobe processes visual information.
        - |
          Correct. The hypothalamus regulates hunger, thirst, body temperature and, through the pituitary, much of the endocrine system.
      answer: 3
    - slug: appsych-u04-w25-q12
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; CED Topic 3.8, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        A parent stops nagging a teen as soon as the teen cleans her room, and the teen cleans more often. In operant terms, the end of the nagging is
      options:
        - "negative reinforcement"
        - "positive punishment"
        - "positive reinforcement"
        - "negative punishment"
      option_explanations:
        - |
          Correct. Removing an unpleasant stimulus (nagging) after a behavior, which increases that behavior, is negative reinforcement, a form of extrinsic motivation.
        - |
          Positive punishment adds something unpleasant to decrease a behavior; here something unpleasant is removed and cleaning increases.
        - |
          Positive reinforcement adds something pleasant; here an unpleasant thing is taken away.
        - |
          Negative punishment removes something pleasant to decrease a behavior; cleaning increased.
      answer: 0
    - slug: appsych-u04-w25-q13
      type: multiple_choice
      topic_code: "4.4"
      source: "Original item; CED Topic 4.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        The top of Maslow's hierarchy of needs is also central to the humanistic theory of personality. What is it?
      options:
        - "Safety"
        - "Esteem"
        - "Self-actualization"
        - "Belongingness"
      option_explanations:
        - |
          Safety is a lower, basic level of the hierarchy, just above physiological needs.
        - |
          Esteem is the level just below the top in the original hierarchy.
        - |
          Correct. Self-actualization, fulfilling one's potential, tops the original hierarchy and is the growth goal humanistic psychologists emphasize.
        - |
          Belongingness and love is a middle level of the hierarchy.
      answer: 2
    - slug: appsych-u04-w25-q14
      type: multi_select
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which factors tend to increase how much people eat? Select all that apply.
      options:
        - "Being served a larger portion"
        - "A rise in leptin from adequate fat stores"
        - "Eating with a group of friends"
        - "A rise in ghrelin from an empty stomach"
        - "Damage to the lateral hypothalamus in rats"
      option_explanations:
        - |
          Correct. Larger portions increase intake, partly through unit bias.
        - |
          Leptin signals that fat stores are adequate and reduces appetite.
        - |
          Correct. People usually eat more in groups, an example of social facilitation.
        - |
          Correct. Ghrelin signals hunger and increases the drive to eat.
        - |
          In classic rat studies, lateral hypothalamus damage reduced eating; ventromedial damage increased it.
      answer: [0, 2, 3]
    - slug: appsych-u04-w25-q15
      type: multi_select
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 4.B"
      points: 2
      partial_credit: true
      prompt: |
        Which behaviors are hard for drive-reduction theory to explain but fit arousal theory? Select all that apply.
      options:
        - "Riding a roller coaster on a day when all needs are met"
        - "Eating when hungry"
        - "Watching a horror movie for fun"
        - "Sleeping when exhausted"
        - "Exploring an unfamiliar city just out of curiosity"
      option_explanations:
        - |
          Correct. The ride increases tension rather than reducing a need, which fits seeking an optimal arousal level.
        - |
          Eating when hungry reduces a biological drive, the core case for drive-reduction theory.
        - |
          Correct. Seeking fear for entertainment raises arousal, which drive-reduction cannot explain.
        - |
          Sleeping when exhausted restores a physiological balance, consistent with drive reduction.
        - |
          Correct. Curiosity-driven exploration seeks stimulation, not reduction of a need.
      answer: [0, 2, 4]
    - slug: appsych-u04-w25-q16
      type: true_false
      topic_code: "4.4"
      source: "Original item; CED Topics 4.4 and 4.6, Skill 4.B (spiral review)"
      points: 1
      prompt: |
        True or false: Research supports Maslow's claim that people always fully satisfy lower needs before pursuing higher ones such as belonging and meaning.
      answer: false
      explanation: |
        False. Research has found the order is not fixed: people often seek belonging, esteem and meaning even when physiological or safety needs are unmet. The hierarchy is a useful description, not a strict law.
    - slug: appsych-u04-w25-q17
      type: true_false
      topic_code: "3.7"
      source: "Original item; CED Topic 3.7, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: A taste aversion can form after a single pairing of a food with illness, even when the illness begins hours after eating.
      answer: true
      explanation: |
        True. Garcia's research showed taste aversions can be learned in one trial with a long delay, an exception to the usual need for close timing in classical conditioning and a learned influence on eating.
    - slug: appsych-u04-w25-q18
      type: fill_blank
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.A"
      points: 1
      prompt: |
        The body's tendency to maintain a stable, balanced internal state, such as a steady temperature, is called ____.
      answer: ["homeostasis", "homoeostasis"]
      explanation: |
        Homeostasis is the goal of drive reduction: needs create drives, and behavior that meets the need restores balance.
    - slug: appsych-u04-w25-q19
      type: fill_blank
      topic_code: "1.3"
      source: "Original item; CED Topic 1.3, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Hormones such as ghrelin and leptin are chemical messengers carried in the bloodstream, part of the body's ____ system.
      answer: ["endocrine"]
      explanation: |
        The endocrine system uses hormones carried in the blood; it is slower than neural signaling but its effects last longer.
    - slug: appsych-u04-w25-q20
      type: short_answer
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skills 1.B and 4.A"
      points: 3
      prompt: |
        A library wants children to read more over the summer and plans to give a prize for every book read.

        (a) Explain how the overjustification effect could make this plan backfire for children who already love reading.
        (b) Describe a reward approach less likely to backfire.
        (c) Explain how the plan could still help children who rarely read.
      answer: |
        (a) Children who read for enjoyment may start to see reading as something done for prizes; when the prizes stop, their intrinsic motivation may be lower than before.
        (b) Unexpected rewards, or rewards that recognize competence (a certificate celebrating progress) rather than paying per book; or offering choice of books to support autonomy.
        (c) For children with little intrinsic interest, extrinsic rewards can start the behavior; as they read and gain skill, they may discover enjoyment of their own.
      explanation: |
        Three points, one per part. (a) expected rewards for an enjoyed activity reduce intrinsic motivation. (b) unexpected, informational or autonomy-supporting reward. (c) extrinsic rewards can initiate a behavior when intrinsic motivation is low.
    - slug: appsych-u04-w25-q21
      type: short_answer
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.B (spiral review)"
      points: 2
      prompt: |
        Many children dislike a new vegetable at first but come to like it after it is served many times.

        (a) Name the week 21 concept that explains this.
        (b) Explain how it applies.
      answer: |
        (a) The mere exposure effect.
        (b) Repeated exposure to the vegetable makes it more familiar, and familiarity with an initially neutral or mildly disliked stimulus increases liking.
      explanation: |
        Two points. (a) mere exposure effect. (b) repeated exposure increases liking.
    - slug: appsych-u04-w25-q22
      type: long_answer
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skills 1.B, 2.A and 3.A (mini-AAQ)"
      points: 6
      stimulus: |
        **A hypothetical study (invented for this course).** Researchers recruited 72 adult volunteers. On arrival, each was randomly assigned to a low-, moderate- or high-pressure condition: participants were told their performance would be shown to no one, to the researcher, or live on screen to an audience of 30 people. All then completed an easy typing task and a difficult logic task. Arousal was checked by heart rate.

        | Condition | Mean heart rate (bpm) | Easy task score | Difficult task score |
        |---|---|---|---|
        | Low pressure | 72 | 61 | 58 |
        | Moderate pressure | 84 | 74 | 70 |
        | High pressure | 101 | 79 | 49 |

        Participants were told they could stop at any time and were debriefed afterward.
      prompt: |
        (A) Identify the independent variable.
        (B) Explain why the researchers measured heart rate.
        (C) Describe the pattern for the difficult task.
        (D) Explain how the results support the Yerkes-Dodson law.
        (E) Identify one ethical guideline the researchers followed.
        (F) Explain why a correlation coefficient between heart rate and difficult-task score could understate the relationship.
      answer: |
        (A) The level of performance pressure (low, moderate or high audience).
        (B) As a manipulation check and operational definition of arousal: to confirm the pressure conditions actually produced different arousal.
        (C) Difficult-task scores rose from low (58) to moderate (70) pressure, then fell sharply under high pressure (49): an inverted U.
        (D) Performance rose with arousal up to a moderate level and then fell for the difficult task, while the easy task kept improving at high arousal (79). This matches the law: easy tasks are performed best at higher arousal, difficult ones at moderate arousal.
        (E) Right to withdraw (told they could stop at any time), or debriefing.
        (F) A correlation measures linear relationships; the difficult-task relationship rises then falls, so a straight line fits poorly and r could be near zero even though arousal strongly affects performance.
      explanation: |
        Six points, one per part. (A) pressure condition. (B) heart rate as the measure of arousal or a manipulation check. (C) rise then fall, with numbers. (D) contrasts easy and difficult tasks with the law's prediction. (E) right to withdraw or debriefing, tied to the stimulus. (F) linear versus curvilinear relationship.
