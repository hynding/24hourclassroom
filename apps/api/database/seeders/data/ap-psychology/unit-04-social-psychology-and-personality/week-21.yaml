week: 21
unit: 4
title: "Explaining Other People: Attribution and Person Perception"
topics: ["4.1"]
guide: guides/week-21.md
guide_description: |
  How people explain behavior and form impressions: dispositional and situational attributions, the
  fundamental attribution error (with Jones and Harris's assigned-essay demonstration and the role of culture),
  the actor-observer bias and the self-serving bias, explanatory style (internal, stable, global) and locus of
  control, then person perception: the mere exposure effect, the self-fulfilling prophecy, upward and downward
  social comparison, and relative deprivation. Worked examples name the bias in three scenarios and trace
  person-perception effects through one summer job; a research-methods section designs an attribution
  experiment and interprets a correlation between explanatory style and exercise.
flashcards_description: |
  30 cards on attributions, the fundamental attribution error, actor-observer and self-serving biases,
  explanatory style, locus of control, the mere exposure effect, the self-fulfilling prophecy, social
  comparison and relative deprivation, with research-methods cards on studying attributions.

flashcards:
  - front: "Attribution → definition"
    back: |
      An explanation of the cause of a behavior or event. Attribution theory (Fritz Heider) treats people as everyday scientists sorting causes into the person or the situation.
    topic_code: "4.1"
  - front: "Dispositional attribution → definition and example"
    back: |
      Explaining behavior by something inside the person: a trait, ability, effort or motive. “She was late because she is disorganized.”
    topic_code: "4.1"
  - front: "Situational attribution → definition and example"
    back: |
      Explaining behavior by circumstances outside the person. “She was late because the bus broke down.”
    topic_code: "4.1"
  - front: "Fundamental attribution error → definition"
    back: |
      The tendency, when explaining other people's behavior, to overestimate dispositional causes and underestimate situational ones.
    topic_code: "4.1"
  - front: "Jones and Harris (1967) assigned essays → finding"
    back: |
      Readers judged an essay writer's true attitude toward Castro's Cuba from the essay's side even when told a debate coach had assigned the side: an early demonstration of the fundamental attribution error.
    topic_code: "4.1"
  - front: "Fundamental attribution error → why it happens"
    back: |
      The person is vivid and visible; the situation is often invisible or unknown. Correcting for the situation takes extra information and effort.
    topic_code: "4.1"
  - front: "Fundamental attribution error and culture → pattern"
    back: |
      Strongest in individualist cultures; people in more collectivist cultures tend to weigh situations and roles more, especially when the situation is made obvious.
    topic_code: "4.1"
  - front: "Actor-observer bias → definition"
    back: |
      Explaining our own actions by the situation but the same actions by others in terms of their dispositions. “I skipped because I was sick; he skipped because he is lazy.”
    topic_code: "4.1"
  - front: "Self-serving bias → definition"
    back: |
      Taking personal credit for successes (internal) and blaming failures on the situation (external). It protects self-esteem.
    topic_code: "4.1"
  - front: "Actor-observer bias versus self-serving bias → how to tell them apart"
    back: |
      Actor-observer depends on whose behavior it is (mine versus yours). Self-serving depends on whether the outcome was good or bad (credit versus blame).
    topic_code: "4.1"
  - front: "Explanatory style → definition"
    back: |
      A person's habitual way of explaining bad events, described on three dimensions: internal or external, stable or unstable, global or specific.
    topic_code: "4.1"
  - front: "Pessimistic explanatory style → the three dimensions"
    back: |
      Internal, stable and global: “It's my fault, it will always be this way, and it ruins everything.” Correlated with lower persistence and higher risk of depression.
    topic_code: "4.1"
  - front: "Optimistic explanatory style → the three dimensions"
    back: |
      External, unstable and specific: “The circumstances were unusual, it's temporary, and it affects only this one thing.”
    topic_code: "4.1"
  - front: "Locus of control → definition"
    back: |
      A general belief about who controls life outcomes: oneself (internal locus) or luck, fate and powerful others (external locus). Associated with Julian Rotter.
    topic_code: "4.1"
  - front: "Internal locus of control → example"
    back: |
      “If I practice every day, I'll make the team.” Outcomes are seen as following from one's own actions.
    topic_code: "4.1"
  - front: "External locus of control → example"
    back: |
      “It doesn't matter how hard I practice; the coach just picks his favorites.” Outcomes are seen as controlled by outside forces.
    topic_code: "4.1"
  - front: "Locus of control versus explanatory style → difference"
    back: |
      Locus of control is a general expectation about control over outcomes. Explanatory style is how a person explains bad events after they happen.
    topic_code: "4.1"
  - front: "Mere exposure effect → definition"
    back: |
      Repeated exposure to a neutral stimulus increases liking for it. Shown by Robert Zajonc with unfamiliar words, faces and characters.
    topic_code: "4.1"
  - front: "Mere exposure effect → limit"
    back: |
      It works best for stimuli that start out neutral; repeated exposure to something disliked from the start does not reliably increase liking.
    topic_code: "4.1"
  - front: "Self-fulfilling prophecy → definition"
    back: |
      An expectation that leads a person to act in ways that make the expectation come true.
    topic_code: "4.1"
  - front: "Teacher expectancy (Rosenthal and Jacobson) → finding and caution"
    back: |
      Students randomly labelled as “about to bloom” showed larger IQ gains in some grades. The study was criticized, and later research finds expectation effects real but usually small.
    topic_code: "4.1"
  - front: "Social comparison theory → idea"
    back: |
      Without an objective standard, people judge their abilities and opinions by comparing themselves with others (Leon Festinger, 1954).
    topic_code: "4.1"
  - front: "Upward social comparison → definition and effect"
    back: |
      Comparing yourself with someone better off or more skilled. Can motivate improvement but often lowers satisfaction.
    topic_code: "4.1"
  - front: "Downward social comparison → definition and effect"
    back: |
      Comparing yourself with someone worse off. Usually boosts self-esteem and mood.
    topic_code: "4.1"
  - front: "Relative deprivation → definition"
    back: |
      Feeling deprived because you have less than your comparison group, regardless of your absolute situation. A raise can feel like a loss if coworkers got bigger ones.
    topic_code: "4.1"
  - front: "Social psychology as a field → definition"
    back: |
      The scientific study of how people think about, influence and relate to one another.
    topic_code: "4.1"
  - front: "Attribution experiment → independent and dependent variables"
    back: |
      IV: what participants learn about the situation (for example, situational detail present or absent). DV: the attribution, operationally defined as a rating such as 1 (all situation) to 7 (all disposition).
    topic_code: "4.1"
  - front: "Deception in an attribution study → what ethics require"
    back: |
      IRB approval that deception is necessary and low-risk, informed consent to the parts that can be disclosed, confidentiality, and a full debriefing afterward.
    topic_code: "4.1"
  - front: "r = −0.32 between pessimism and weeks of exercise → interpretation"
    back: |
      A moderate negative correlation: more pessimistic people tended to quit sooner. It does not show causation; a third variable such as stress could drive both.
    topic_code: "4.1"
  - front: "Error-spot → “Every time we blame a person, we commit the fundamental attribution error”"
    back: |
      Wrong. The error is underweighting the situation. Sometimes a dispositional explanation is correct; the bias is the systematic tilt toward it.
    topic_code: "4.1"

quiz:
  description: |
    22 questions · about 35 minutes · mostly on this week (topic 4.1: attributions, the fundamental attribution
    error, actor-observer and self-serving biases, explanatory style, locus of control, mere exposure, the
    self-fulfilling prophecy, social comparison and relative deprivation), with 7 questions (32%) reviewing
    Units 1–3 (heuristics and confirmation bias, schemas, the amygdala, attachment, observational learning and
    research methods). Includes a three-question set on one invented study. Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented attribution experiment (4.1)
    - slug: appsych-u04-w21-q01
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 2.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team recruited 90 high school students and randomly assigned them to one of two conditions. All read a short story about a student, Riley, who failed a history test. In the *situation* condition the story mentioned that Riley had worked a late shift the night before because a coworker quit. In the *no-situation* condition that sentence was left out. Participants then rated "How much was Riley's failure caused by Riley's own ability or effort?" from 1 (not at all) to 7 (completely). Participants gave informed consent to "a study of first impressions" and were debriefed at the end.

        | Condition | n | Mean rating | Standard deviation |
        |---|---|---|---|
        | No-situation | 45 | 5.6 | 1.1 |
        | Situation | 45 | 4.2 | 1.3 |

        The difference between the means was statistically significant (p = 0.002).
      prompt: |
        What is the dependent variable in this study?
      options:
        - "Whether the story mentioned Riley's late shift"
        - "The 90 high school students who took part"
        - "Participants' rating of how much Riley's own ability or effort caused the failure"
        - "Whether participants were debriefed at the end"
      option_explanations:
        - |
          Whether the late shift was mentioned is what the researchers manipulated, so it is the independent variable, not the dependent variable.
        - |
          The students are the participants (the sample). A variable is something measured or manipulated about them, not the people themselves.
        - |
          Correct. The dependent variable is what is measured to see the manipulation's effect: the 1-to-7 rating of dispositional cause, which is also its operational definition.
        - |
          Debriefing is an ethical procedure everyone received; it does not vary across conditions and is not a variable in the design.
      answer: 2
    - slug: appsych-u04-w21-q02
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 3.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team recruited 90 high school students and randomly assigned them to one of two conditions. All read a short story about a student, Riley, who failed a history test. In the *situation* condition the story mentioned that Riley had worked a late shift the night before because a coworker quit. In the *no-situation* condition that sentence was left out. Participants then rated "How much was Riley's failure caused by Riley's own ability or effort?" from 1 (not at all) to 7 (completely). Participants gave informed consent to "a study of first impressions" and were debriefed at the end.

        | Condition | n | Mean rating | Standard deviation |
        |---|---|---|---|
        | No-situation | 45 | 5.6 | 1.1 |
        | Situation | 45 | 4.2 | 1.3 |

        The difference between the means was statistically significant (p = 0.002).
      prompt: |
        Which conclusion is best supported by the results?
      options:
        - "Learning about the late shift caused participants to blame Riley's ability or effort less, and the difference is unlikely to be due to chance alone."
        - "Because both means are above the scale's midpoint of 4, no participants made situational attributions."
        - "Participants in the situation condition were more variable, so their mean cannot be compared with the other group's."
        - "The study shows that people in all cultures commit the fundamental attribution error to the same degree."
      option_explanations:
        - |
          Correct. With random assignment and a manipulated variable, the lower mean (4.2 versus 5.6) can be attributed to the situational information, and p = 0.002 means a difference this large would be very unlikely by chance.
        - |
          Means describe the center of each group, not every individual. Some participants surely gave ratings below 4, and the situation group's mean is only just above the midpoint.
        - |
          A slightly larger standard deviation (1.3 versus 1.1) does not prevent comparing the means; the significance test already takes variability into account.
        - |
          The sample was 90 high school students from one setting; nothing in the design compares cultures, so a claim about all cultures goes far beyond the data.
      answer: 0
    - slug: appsych-u04-w21-q03
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 2.C"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** A research team recruited 90 high school students and randomly assigned them to one of two conditions. All read a short story about a student, Riley, who failed a history test. In the *situation* condition the story mentioned that Riley had worked a late shift the night before because a coworker quit. In the *no-situation* condition that sentence was left out. Participants then rated "How much was Riley's failure caused by Riley's own ability or effort?" from 1 (not at all) to 7 (completely). Participants gave informed consent to "a study of first impressions" and were debriefed at the end.

        | Condition | n | Mean rating | Standard deviation |
        |---|---|---|---|
        | No-situation | 45 | 5.6 | 1.1 |
        | Situation | 45 | 4.2 | 1.3 |

        The difference between the means was statistically significant (p = 0.002).
      prompt: |
        Telling participants the study was about "first impressions" rather than attributions is an example of which research practice, and what must follow it?
      options:
        - "Confidentiality, which must be followed by publishing participants' names only with permission"
        - "Random sampling, which must be followed by a check that the sample matches the population"
        - "A placebo, which must be followed by a double-blind procedure"
        - "Deception, which must be followed by a debriefing that explains the true purpose"
      option_explanations:
        - |
          Confidentiality means keeping participants' data private. Disguising the study's purpose is a different practice, and confidential data are never published with names.
        - |
          Random sampling is about how participants are selected from a population; the cover story is about what participants were told, not how they were chosen.
        - |
          A placebo is an inactive treatment given to a control group; the cover story is a description of the study, not a treatment.
        - |
          Correct. Misleading participants about the study's purpose is deception, which an IRB must approve as necessary, and participants must then be debriefed: told the true purpose and why it was hidden.
      answer: 3
    - slug: appsych-u04-w21-q04
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.B"
      points: 1
      prompt: |
        A shopper sees a cashier fumble with change and thinks, "What an incompetent person." She does not know the cashier is on the first hour of a first shift. The shopper's judgment best illustrates
      options:
        - "the self-serving bias"
        - "the fundamental attribution error"
        - "the mere exposure effect"
        - "downward social comparison"
      option_explanations:
        - |
          The self-serving bias concerns explaining one's own successes and failures; the shopper is explaining someone else's behavior.
        - |
          Correct. The shopper explains another person's behavior by disposition (incompetence) and underweights a powerful situational cause she cannot see: it is the cashier's first hour on the job.
        - |
          The mere exposure effect is about liking increasing with repeated exposure; this is a single judgment about the cause of a behavior.
        - |
          Downward comparison means comparing oneself with someone worse off to feel better; the shopper is explaining a behavior, not evaluating herself.
      answer: 1
    - slug: appsych-u04-w21-q05
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.B"
      points: 1
      prompt: |
        Kofi says his team lost the robotics match because the judges were biased, but says they won the previous match because of his brilliant design. Kofi is showing
      options:
        - "the actor-observer bias"
        - "an external locus of control"
        - "the self-serving bias"
        - "a self-fulfilling prophecy"
      option_explanations:
        - |
          The actor-observer bias contrasts explanations of one's own behavior with explanations of others' identical behavior; here Kofi explains his own outcomes differently depending on whether they were good or bad.
        - |
          An external locus of control would attribute both outcomes to outside forces; Kofi takes credit for the win, which is internal.
        - |
          Correct. He takes personal credit for success (internal) and blames failure on the situation (external), the pattern that defines the self-serving bias.
        - |
          A self-fulfilling prophecy requires an expectation that causes behavior that makes it come true; Kofi is explaining outcomes after the fact.
      answer: 2
    - slug: appsych-u04-w21-q06
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.B"
      points: 1
      prompt: |
        After failing a driving test, which statement shows a pessimistic explanatory style?
      options:
        - "The examiner was having a bad day, and the route was unfamiliar."
        - "I was nervous today, but I'll be calmer next time."
        - "Parallel parking is my weak spot; the rest went fine."
        - "I'm hopeless; I mess up everything I try and always will."
      option_explanations:
        - |
          Blaming the examiner and the route is an external explanation, typical of an optimistic style, not a pessimistic one.
        - |
          Calling nervousness temporary makes the cause unstable, which is an optimistic feature.
        - |
          Limiting the problem to one skill makes the cause specific rather than global, an optimistic feature.
        - |
          Correct. The explanation is internal (“I'm hopeless”), global (“everything”) and stable (“always will”): the three dimensions of a pessimistic explanatory style.
      answer: 3
    - slug: appsych-u04-w21-q07
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.A"
      points: 1
      prompt: |
        Over the semester, Ana grows to like a new classmate she sits beside every day, even though they rarely talk. Which concept best explains this?
      options:
        - "The mere exposure effect"
        - "Relative deprivation"
        - "The actor-observer bias"
        - "Upward social comparison"
      option_explanations:
        - |
          Correct. Repeated exposure to an initially neutral person increases liking, even without much interaction.
        - |
          Relative deprivation is feeling deprived compared with a reference group; it says nothing about growing to like someone.
        - |
          The actor-observer bias concerns how we explain our own versus others' behavior, not liking.
        - |
          Upward social comparison means measuring yourself against someone better off; nothing here involves Ana evaluating herself.
      answer: 0
    - slug: appsych-u04-w21-q08
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.B"
      points: 1
      prompt: |
        A coach believes a new player is unathletic, so she gives him little playing time and no feedback. His skills stall, and the coach feels proven right. This is an example of
      options:
        - "the mere exposure effect"
        - "a self-fulfilling prophecy"
        - "an internal locus of control"
        - "the self-serving bias"
      option_explanations:
        - |
          Mere exposure concerns liking from repeated exposure; the coach's expectation is changing her behavior toward the player, which is a different process.
        - |
          Correct. The coach's expectation led her to act in a way (no playing time, no feedback) that produced the outcome she expected.
        - |
          Locus of control describes a person's belief about control over their own outcomes; this scenario is about an expectation shaping someone else's performance.
        - |
          The self-serving bias concerns explaining one's own successes and failures; here the coach shapes another person's outcome through her expectations.
      answer: 1
    - slug: appsych-u04-w21-q09
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.B"
      points: 1
      prompt: |
        Rosa got a 6% raise and was pleased until she learned every coworker received 10%. Now she feels cheated. Which concept best explains her change in feeling?
      options:
        - "Downward social comparison"
        - "The fundamental attribution error"
        - "The mere exposure effect"
        - "Relative deprivation"
      option_explanations:
        - |
          Downward comparison is comparing with someone worse off, which usually improves mood; Rosa compared herself with people who did better.
        - |
          The fundamental attribution error is about explaining other people's behavior; Rosa's feeling comes from comparing outcomes.
        - |
          Mere exposure concerns liking after repeated exposure; it has nothing to do with feeling short-changed by a raise.
        - |
          Correct. Her absolute situation improved, but compared with her reference group she has less, and that comparison produces the sense of being deprived.
      answer: 3
    - slug: appsych-u04-w21-q10
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 3.B"
      points: 1
      prompt: |
        A hypothetical survey of 250 adults found r = −0.41 between scores on an external locus of control scale and the number of hours they spent preparing for job interviews. Which interpretation is correct?
      options:
        - "Having an external locus of control causes people to prepare less."
        - "People who scored higher on external locus of control tended to spend fewer hours preparing."
        - "Because the correlation is negative, the two variables are unrelated."
        - "About 41% of the adults had an external locus of control."
      option_explanations:
        - |
          A correlation alone cannot show causation; a third variable (such as past job success or time available) could affect both, or preparation could shape beliefs.
        - |
          Correct. A negative r means that as one variable goes up the other tends to go down; −0.41 is a moderate relationship.
        - |
          A negative correlation is still a relationship; only an r near 0 would indicate little linear relationship.
        - |
          A correlation coefficient measures the strength and direction of a relationship; it is not a percentage of people.
      answer: 1
    # ---- Spiral review
    - slug: appsych-u04-w21-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; CED Topic 2.2, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        Once Theo decides a new classmate is arrogant, he notices every time she boasts and overlooks the times she is modest. Which Unit 2 concept does this illustrate?
      options:
        - "Functional fixedness"
        - "The availability heuristic"
        - "Confirmation bias"
        - "Framing"
      option_explanations:
        - |
          Functional fixedness is the inability to see new uses for an object in problem-solving; it is not about selectively noticing evidence about people.
        - |
          The availability heuristic judges likelihood by how easily examples come to mind; Theo's problem is searching for evidence that fits his belief.
        - |
          Correct. Confirmation bias is the tendency to seek and notice information that supports an existing belief and to ignore what contradicts it, which keeps first impressions alive.
        - |
          Framing is how the wording of a choice affects decisions; nothing here depends on how information is worded.
      answer: 2
    - slug: appsych-u04-w21-q12
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; CED Topic 3.9, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        A child watches an older sibling get praised for sharing toys and then begins sharing too. Which explanation from Unit 3 fits best?
      options:
        - "Habituation to the sibling's behavior"
        - "Classical conditioning of a reflex"
        - "Insight learning"
        - "Observational learning with vicarious reinforcement"
      option_explanations:
        - |
          Habituation is a decrease in response to a repeated stimulus; the child's behavior increased after watching.
        - |
          Classical conditioning pairs stimuli to trigger involuntary responses; sharing is a voluntary behavior copied from a model.
        - |
          Insight learning is a sudden solution to a problem; the child is imitating a behavior after seeing it rewarded.
        - |
          Correct. The child learns by watching a model, and seeing the model rewarded (vicarious reinforcement) makes imitation more likely, as in Bandura's research.
      answer: 3
    - slug: appsych-u04-w21-q13
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        Forming a snap judgment that a stranger's face looks threatening relies heavily on which brain structure, part of the limbic system?
      options:
        - "The amygdala"
        - "The cerebellum"
        - "Broca's area"
        - "The occipital lobe's primary visual cortex alone"
      option_explanations:
        - |
          Correct. The amygdala responds rapidly to emotionally significant stimuli, including faces that look threatening, and is central to fear-related processing.
        - |
          The cerebellum coordinates movement and balance and plays roles in some learning; it is not the main structure for judging threat.
        - |
          Broca's area, in the frontal lobe, is involved in producing speech, not in evaluating whether a face is threatening.
        - |
          The visual cortex processes the image, but judging that a face is threatening depends on emotional evaluation, which involves the amygdala.
      answer: 0
    - slug: appsych-u04-w21-q14
      type: multi_select
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.B"
      points: 2
      partial_credit: true
      prompt: |
        Which statements are situational attributions? Select all that apply.
      options:
        - "He tripped because the stair was wet."
        - "She won because she is a determined person."
        - "They argued because both had been awake for 30 hours."
        - "He forgot because he is careless."
        - "She was quiet because the meeting was in a language she was still learning."
      option_explanations:
        - |
          Correct. A wet stair is a feature of the circumstances, so this explains the behavior situationally.
        - |
          Determination is a trait of the person, so this is a dispositional attribution.
        - |
          Correct. Sleep deprivation from a long shift is a circumstance that explains the argument, a situational attribution.
        - |
          Carelessness is a personal trait, so this is a dispositional attribution.
        - |
          Correct. The language of the meeting is an external circumstance that explains her quietness.
      answer: [0, 2, 4]
    - slug: appsych-u04-w21-q15
      type: multi_select
      topic_code: "1.1"
      source: "Original item; CED Topic 1.1, Skill 2.A (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        A research team wants to test whether reading about someone's difficult circumstances reduces blame. Which features would let them draw a cause-and-effect conclusion? Select all that apply.
      options:
        - "Random assignment of participants to read the circumstances or not"
        - "Measuring blame with a clearly defined rating scale"
        - "Letting participants choose which version of the story to read"
        - "Keeping everything else in the two stories identical"
        - "Recruiting only participants who already believe in luck"
      option_explanations:
        - |
          Correct. Random assignment spreads participant differences evenly across groups, the key requirement for a causal conclusion in an experiment.
        - |
          Correct. A clear operational definition of the dependent variable makes the measure consistent and the study replicable.
        - |
          Letting participants choose creates self-selection: people who choose each version may already differ, a confound that blocks a causal conclusion.
        - |
          Correct. Holding everything else constant means the circumstances are the only difference, so they are the likely cause of any difference in blame.
        - |
          Restricting the sample this way limits generalizability and could bias results; it does not help establish cause and effect.
      answer: [0, 1, 3]
    - slug: appsych-u04-w21-q16
      type: true_false
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skill 1.A"
      points: 1
      prompt: |
        True or false: The actor-observer bias predicts that people explain their own lateness situationally but another person's identical lateness dispositionally.
      answer: true
      explanation: |
        True. As actors we see the situation we are responding to; as observers we see the person, so the same behavior gets different explanations depending on whose it is.
    - slug: appsych-u04-w21-q17
      type: true_false
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: In Ainsworth's Strange Situation, a securely attached infant typically shows no distress at all when the caregiver leaves the room.
      answer: false
      explanation: |
        False. A securely attached infant often shows some distress at separation but is readily comforted on the caregiver's return and uses the caregiver as a secure base for exploration. Showing little reaction to separation or reunion is more typical of avoidant attachment.
    - slug: appsych-u04-w21-q18
