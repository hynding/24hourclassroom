      points: 1
      prompt: |
        A mental framework that organizes knowledge and guides how we interpret new information, such as our idea of what a "typical teacher" is like, is called a ____.
      answer: ["schema", "schemas", "schemata", "a schema"]
      explanation: |
        A schema is an organized mental framework. Schemas about people and groups guide first impressions and make attribution fast but error-prone, which connects Unit 2 perception and cognition to social thinking.
    - slug: appsych-u04-w21-q20
      type: short_answer
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skills 1.B and 4.A"
      points: 3
      prompt: |
        Jamal earned a C on a group project.

        (a) Give one statement Jamal might make that shows the self-serving bias.
        (b) Give one statement Jamal's teacher might make that shows the fundamental attribution error.
        (c) Explain how Jamal's locus of control could affect how he prepares for the next project.
      answer: |
        (a) “We got a C because my group members didn't do their parts” (failure blamed on the situation), possibly alongside taking credit for parts that went well.
        (b) “Jamal got a C because he is lazy,” ignoring situational factors such as the group's problems or his work schedule.
        (c) With an internal locus of control he is likely to believe his effort matters and prepare harder or organize the group earlier; with an external locus he may believe the grade depends on others or luck and put in less effort.
      explanation: |
        Three points, one per part. (a) a statement blaming the C on external factors (or crediting self for success). (b) a dispositional explanation by an observer that ignores the situation. (c) correctly links internal or external locus to more or less preparation, with a reason.
    - slug: appsych-u04-w21-q21
      type: short_answer
      topic_code: "3.1"
      source: "Original item; CED Topic 3.1, Skill 2.B (spiral review)"
      points: 2
      prompt: |
        A hypothetical team wants to know whether the fundamental attribution error changes between ages 8 and 18. They test groups of 8-, 12-, 15- and 18-year-olds all in the same month.

        (a) Name this research design.
        (b) Identify one disadvantage of this design for answering the question.
      answer: |
        (a) A cross-sectional design.
        (b) The age groups are different people born in different years, so differences could reflect cohort effects (different schooling, media, experiences) rather than development.
      explanation: |
        Two points. (a) cross-sectional. (b) cohort effects or any valid limitation such as not tracking change within the same individuals; a longitudinal study would follow one group over time.
    - slug: appsych-u04-w21-q22
      type: long_answer
      topic_code: "4.1"
      source: "Original item; CED Topic 4.1, Skills 2.A, 3.A and 4.A (mini-AAQ)"
      points: 5
      stimulus: |
        **A hypothetical study (invented for this course).** Researchers surveyed 400 first-year college students at four public universities in one U.S. state. Participants completed a 20-item explanatory-style questionnaire; "pessimism" was the average of items rating bad events as internal, stable and global (1–7). At the end of the year the registrar provided each consenting student's grade point average. The correlation between pessimism and GPA was r = −0.28 (p under 0.001). Students' names were replaced with code numbers before analysis.
      prompt: |
        (A) Identify the research method used.
        (B) State the operational definition of pessimism in this study.
        (C) Describe what the correlation r = −0.28 shows.
        (D) Identify one ethical guideline the researchers followed.
        (E) A dean claims, "Teaching students to be optimistic will raise their grades." Explain whether these findings support that claim.
      answer: |
        (A) Correlational study (survey with archival records), with no manipulated variable.
        (B) The average rating (1–7) on the questionnaire items rating bad events as internal, stable and global.
        (C) A weak-to-moderate negative relationship: students with higher pessimism scores tended to have lower GPAs. It is statistically significant, so unlikely to be chance alone.
        (D) Confidentiality: names were replaced with code numbers. (Informed consent is also mentioned: only consenting students' GPAs were obtained.)
        (E) The findings do not establish the claim. A correlation cannot show that pessimism causes lower grades; low grades might cause pessimism, or a third variable (such as stress or depression) might affect both. An experiment randomly assigning students to optimism training would be needed.
      explanation: |
        Five points, one per part. (A) correlational (survey) method. (B) the questionnaire average for internal, stable, global ratings. (C) negative direction and an interpretation in context (higher pessimism, lower GPA); calling it causal loses the point. (D) confidentiality or informed consent, tied to the description. (E) states the data do not support a causal claim and gives a reason (correlation, reverse causation or a third variable).
