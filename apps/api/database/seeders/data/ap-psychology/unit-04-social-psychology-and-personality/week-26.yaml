week: 26
unit: 4
title: "Emotion: Body, Mind and Face"
topics: ["4.7"]
guide: guides/week-26.md
guide_description: |
  The three components of emotion; the James-Lange, Cannon-Bard and Schachter-Singer two-factor theories, with
  Schachter and Singer's epinephrine study and Dutton and Aron's bridge study of misattributed arousal;
  cognitive appraisal and the fast thalamus-to-amygdala "low road"; the facial-feedback hypothesis and the
  failed multi-lab replication of the pen study; Ekman's evidence for universal expressions of basic emotions,
  cultural display rules and elicitors; and Fredrickson's broaden-and-build theory. Worked examples explain one
  startling bang through four theories and contrast broadened and narrowed attention.
flashcards_description: |
  30 cards on the components of emotion, the James-Lange, Cannon-Bard and two-factor theories, misattribution
  of arousal, cognitive appraisal and the low road, facial feedback and its replication, universal expressions,
  display rules and broaden-and-build theory.

flashcards:
  - front: "Emotion → three components"
    back: |
      Physiological arousal, expressive behavior and conscious experience (the feeling and related thoughts).
    topic_code: "4.7"
  - front: "James-Lange theory → sequence"
    back: |
      Stimulus → bodily response → awareness of the bodily response, which is the emotion. “We feel afraid because we run.”
    topic_code: "4.7"
  - front: "James-Lange theory → supporting evidence"
    back: |
      Some people with high spinal cord injuries, who feel less from the body, report less intense emotion; changing the body can nudge feelings.
    topic_code: "4.7"
  - front: "Cannon-Bard theory → sequence"
    back: |
      The stimulus triggers bodily arousal and the conscious feeling at the same time and independently, relayed by the thalamus.
    topic_code: "4.7"
  - front: "Cannon-Bard's critique of James-Lange → two points"
    back: |
      Bodily responses are too similar across emotions (a racing heart in fear, anger and excitement) and too slow to be the emotion itself.
    topic_code: "4.7"
  - front: "Two-factor theory (Schachter-Singer) → sequence"
    back: |
      Emotion = physiological arousal + a cognitive label explaining it. The same arousal can become fear, anger or joy depending on the label.
    topic_code: "4.7"
  - front: "Schachter and Singer (1962) → procedure"
    back: |
      Participants were injected with epinephrine under a vitamin cover story; some were told to expect arousal, others were not; each waited with a confederate acting euphoric or angry.
    topic_code: "4.7"
  - front: "Schachter and Singer (1962) → finding"
    back: |
      Participants with unexplained arousal tended to take on the confederate's mood more than those told to expect the drug's effects. Replications have been mixed.
    topic_code: "4.7"
  - front: "Misattribution of arousal → definition"
    back: |
      Labeling arousal from one source as an emotion caused by another source, as two-factor theory predicts (also called spillover).
    topic_code: "4.7"
  - front: "Dutton and Aron (1974) suspension bridge → finding"
    back: |
      Men approached by a female interviewer on a high, swaying bridge were more likely to call her later than men on a low, stable bridge: arousal from the bridge labeled as attraction.
    topic_code: "4.7"
  - front: "Cognitive appraisal (Lazarus) → idea"
    back: |
      Our interpretation of a situation shapes the emotion: the same test appraised as a threat brings anxiety, as a challenge brings excitement.
    topic_code: "4.7"
  - front: "Zajonc versus Lazarus → the debate"
    back: |
      Zajonc: some emotional reactions occur before any cognition. Lazarus: appraisal, even fast and unconscious, always comes first.
    topic_code: "4.7"
  - front: "Low road and high road (LeDoux) → routes"
    back: |
      Low road: thalamus → amygdala, fast and crude, triggering fear before conscious analysis. High road: thalamus → cortex → amygdala, slower and detailed.
    topic_code: "4.7"
  - front: "Amygdala in emotion → role"
    back: |
      Limbic structure that rapidly detects threats and triggers fear responses; central to the fast low road.
    topic_code: "4.7"
  - front: "Facial-feedback hypothesis → definition"
    back: |
      Facial expressions can influence the emotions people feel: smiling can make you feel slightly happier.
    topic_code: "4.7"
  - front: "Strack's pen study (1988) → procedure and claim"
    back: |
      Holding a pen in the teeth (smile-like) versus the lips (no smile) while rating cartoons; the smile-like group reportedly rated them funnier.
    topic_code: "4.7"
  - front: "Facial feedback → replication status"
    back: |
      A 2016 preregistered replication in 17 labs found no reliable pen-study effect; later meta-analyses suggest a real but small facial-feedback effect.
    topic_code: "4.7"
  - front: "Basic emotions (Ekman) → commonly listed six"
    back: |
      Happiness, sadness, fear, anger, surprise and disgust: expressions widely produced and recognized across cultures.
    topic_code: "4.7"
  - front: "Evidence for universal expressions → examples"
    back: |
      People in many cultures, including a remote group in Papua New Guinea with little Western media exposure, matched the same faces to the same emotions; children born blind make typical expressions.
    topic_code: "4.7"
  - front: "Universal expressions → caution"
    back: |
      Recognition rates vary across cultures more than early studies suggested, and context strongly shapes how a face is read.
    topic_code: "4.7"
  - front: "Display rules → definition"
    back: |
      Cultural norms for when, where and how intensely emotions should be shown.
    topic_code: "4.7"
  - front: "Japanese and American students watching an unpleasant film → display-rule finding"
    back: |
      Alone, both showed similar disgust; with an experimenter present, Japanese students more often masked their expressions with smiles.
    topic_code: "4.7"
  - front: "Emotional elicitors → definition and culture"
    back: |
      The events or stimuli that trigger an emotion. They vary by culture: the same gesture can be friendly in one place and offensive in another.
    topic_code: "4.7"
  - front: "Broaden-and-build theory → idea"
    back: |
      Positive emotions broaden attention and thinking; over time they build lasting resources such as friendships, skills and resilience (Fredrickson).
    topic_code: "4.7"
  - front: "Negative emotions and attention → broaden-and-build view"
    back: |
      Negative emotions narrow attention toward specific, urgent actions such as fighting or fleeing.
    topic_code: "4.7"
  - front: "Sympathetic arousal in emotion → signs"
    back: |
      Faster heart rate and breathing, sweating, dilated pupils, slowed digestion; adrenaline released by the adrenal glands.
    topic_code: "4.7"
  - front: "Operational definitions of emotion → three kinds"
    back: |
      Self-report ratings, coded facial expressions, and physiological measures such as heart rate and skin conductance.
    topic_code: "4.7"
  - front: "Stick on a path mistaken for a snake → which theory"
    back: |
      The low road: the thalamus sends the crude image straight to the amygdala, triggering a jump before the cortex identifies the stick.
    topic_code: "4.7"
  - front: "Theory match → “I'm shaking and sweating, and the crowd is cheering, so this must be excitement”"
    back: |
      Two-factor theory: arousal plus a cognitive label taken from the situation.
    topic_code: "4.7"
  - front: "Error-spot → “Cannon-Bard says the body's reaction causes the feeling”"
    back: |
      That is James-Lange. Cannon-Bard says arousal and feeling happen at the same time and independently.
    topic_code: "4.7"

quiz:
  description: |
    22 questions · about 35 minutes · mostly on this week (topic 4.7: components of emotion, the James-Lange,
    Cannon-Bard and two-factor theories, cognitive appraisal and the low road, facial feedback, universal
    expressions, display rules and broaden-and-build theory), with 7 questions (32%) reviewing earlier weeks (the
    autonomic nervous system, the limbic system, temperament, motivation, conformity, attitudes and personality).
    Includes a three-question set on one invented arousal study. Multiple choice, select-all and true/false
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: an invented misattribution study (4.7)
    - slug: appsych-u04-w26-q01
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 2.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** Researchers randomly assigned 96 college students to pedal an exercise bike for 2 minutes (arousal) or sit quietly for 2 minutes (no arousal). Half of each group was told, "Exercise raises your heart rate for several minutes" (explanation); half were told nothing about effects (no explanation). Five minutes later every student watched the same short comedy clip and rated how funny it was from 1 to 10.

        | Condition | Mean funniness rating |
        |---|---|
        | Arousal, no explanation | 7.6 |
        | Arousal, explanation | 5.9 |
        | No arousal, no explanation | 5.7 |
        | No arousal, explanation | 5.8 |

        Only the "arousal, no explanation" group differed significantly from the others. Students were told the study was about "exercise and attention" and were debriefed afterward.
      prompt: |
        Which theory of emotion do these results most directly support?
      options:
        - "The two-factor theory"
        - "The Cannon-Bard theory"
        - "The broaden-and-build theory"
        - "The James-Lange theory, because exercise had no effect"
      option_explanations:
        - |
          Correct. Arousal raised funniness ratings only when students had no other explanation for it, so they labeled leftover arousal as amusement: arousal plus a cognitive label.
        - |
          Cannon-Bard says arousal and feeling arise independently; here the arousal changed the feeling only when it was unexplained, which points to labeling.
        - |
          Broaden-and-build concerns how positive emotions widen thinking and build resources; the study manipulated arousal and its explanation instead.
        - |
          Exercise did have an effect in the no-explanation condition, and the explanation removed it, a pattern that depends on interpretation, not on the body alone.
      answer: 0
    - slug: appsych-u04-w26-q02
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 2.A"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** Researchers randomly assigned 96 college students to pedal an exercise bike for 2 minutes (arousal) or sit quietly for 2 minutes (no arousal). Half of each group was told, "Exercise raises your heart rate for several minutes" (explanation); half were told nothing about effects (no explanation). Five minutes later every student watched the same short comedy clip and rated how funny it was from 1 to 10.

        | Condition | Mean funniness rating |
        |---|---|
        | Arousal, no explanation | 7.6 |
        | Arousal, explanation | 5.9 |
        | No arousal, no explanation | 5.7 |
        | No arousal, explanation | 5.8 |

        Only the "arousal, no explanation" group differed significantly from the others. Students were told the study was about "exercise and attention" and were debriefed afterward.
      prompt: |
        How many independent variables does this study have, and what is the dependent variable?
      options:
        - "One independent variable (exercise); the dependent variable is heart rate."
        - "Two independent variables (arousal and explanation); the dependent variable is the funniness rating."
        - "Four independent variables, one per condition; the dependent variable is the comedy clip."
        - "Two independent variables (funniness and arousal); the dependent variable is the explanation."
      option_explanations:
        - |
          The study manipulated both arousal and whether an explanation was given, and heart rate was not reported as the measured outcome.
        - |
          Correct. Arousal (exercise or rest) and explanation (given or not) were both manipulated, a 2 × 2 design; the funniness rating (1–10) was measured.
        - |
          The four conditions are combinations of two variables with two levels each; the clip was the same for everyone, so it is held constant, not measured.
        - |
          Funniness was measured, not manipulated, so it is the dependent variable; the explanation was manipulated.
      answer: 1
    - slug: appsych-u04-w26-q03
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 2.D"
      points: 1
      stimulus: |
        **A hypothetical study (invented for this course).** Researchers randomly assigned 96 college students to pedal an exercise bike for 2 minutes (arousal) or sit quietly for 2 minutes (no arousal). Half of each group was told, "Exercise raises your heart rate for several minutes" (explanation); half were told nothing about effects (no explanation). Five minutes later every student watched the same short comedy clip and rated how funny it was from 1 to 10.

        | Condition | Mean funniness rating |
        |---|---|
        | Arousal, no explanation | 7.6 |
        | Arousal, explanation | 5.9 |
        | No arousal, no explanation | 5.7 |
        | No arousal, explanation | 5.8 |

        Only the "arousal, no explanation" group differed significantly from the others. Students were told the study was about "exercise and attention" and were debriefed afterward.
      prompt: |
        Telling students the study was about "exercise and attention" is justified mainly because
      options:
        - "it guarantees the sample is representative of all college students"
        - "it removes the need for informed consent"
        - "knowing the real hypothesis could change how students rate the clip, creating demand characteristics"
        - "it lets researchers skip the debriefing"
      option_explanations:
        - |
          A cover story affects what participants know, not who is in the sample; representativeness depends on sampling.
        - |
          Deception never removes the need for informed consent to the procedures participants will experience.
        - |
          Correct. If students knew the study tested whether arousal makes things seem funnier, their ratings might reflect the hypothesis rather than their experience; the cover story protects validity, and debriefing must follow.
        - |
          Deception makes debriefing required, not optional.
      answer: 2
    - slug: appsych-u04-w26-q04
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 1.B"
      points: 1
      prompt: |
        After a near-miss on her bike, Zoe notices her heart pounding and her hands shaking, and only then realizes, "I'm terrified." Which theory does her account fit best?
      options:
        - "Cannon-Bard theory"
        - "Broaden-and-build theory"
        - "Two-factor theory"
        - "James-Lange theory"
      option_explanations:
        - |
          Cannon-Bard says arousal and feeling occur at the same time and independently; Zoe describes the feeling following awareness of her body.
        - |
          Broaden-and-build is about positive emotions widening attention, not the order of arousal and fear.
        - |
          Two-factor theory requires a cognitive label drawn from the situation; Zoe's account emphasizes noticing her body first, with no search for an explanation.
        - |
          Correct. James-Lange holds that emotion is our awareness of the body's response: she feels terror after noticing her pounding heart and shaking hands.
      answer: 3
    - slug: appsych-u04-w26-q05
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 1.A"
      points: 1
      prompt: |
        Cannon and Bard criticized the James-Lange theory partly because
      options:
        - "emotions never involve bodily arousal"
        - "very different emotions such as fear and anger involve similar bodily arousal"
        - "facial expressions differ completely across cultures"
        - "positive emotions narrow attention"
      option_explanations:
        - |
          Cannon and Bard agreed that emotions involve arousal; they disputed that arousal comes first and defines the emotion.
        - |
          Correct. If a racing heart accompanies fear, anger and excitement alike, bodily responses alone cannot tell us which emotion we feel.
        - |
          Cross-cultural expression research came later, and it found expressions of basic emotions are widely shared.
        - |
          Broaden-and-build, a much later theory, says positive emotions broaden rather than narrow attention.
      answer: 1
    - slug: appsych-u04-w26-q06
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 1.B"
      points: 1
      prompt: |
        Hiking at dusk, Omar leaps back from a curved shape on the trail before realizing it is a stick. Which explanation fits best?
      options:
        - "The facial-feedback hypothesis"
        - "Display rules"
        - "A fast thalamus-to-amygdala pathway triggered fear before the cortex identified the object"
        - "Broaden-and-build theory"
      option_explanations:
        - |
          Facial feedback concerns expressions influencing feelings; Omar's reaction happened before any expression or appraisal.
        - |
          Display rules are cultural norms for showing emotion; nothing here involves social norms.
        - |
          Correct. LeDoux's low road sends crude sensory information directly to the amygdala, producing a fear reaction before slower cortical processing recognizes the stick.
        - |
          Broaden-and-build is about positive emotions; this is a split-second fear response.
      answer: 2
    - slug: appsych-u04-w26-q07
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 1.B"
      points: 1
      prompt: |
        At a formal awards ceremony, the second-place finisher smiles and applauds the winner although she feels disappointed. Her behavior best illustrates
      options:
        - "cultural display rules"
        - "the James-Lange theory"
        - "the low road to the amygdala"
        - "misattribution of arousal"
      option_explanations:
        - |
          Correct. Norms about which emotions are appropriate to show in a setting lead her to mask disappointment with a smile.
        - |
          James-Lange explains how feelings arise from bodily responses; it does not explain hiding a feeling to meet social expectations.
        - |
          The low road explains rapid fear responses, not choosing which emotion to display at a ceremony.
        - |
          Misattribution of arousal is mislabeling the source of arousal; she knows exactly why she feels disappointed.
      answer: 0
    - slug: appsych-u04-w26-q08
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 2.D"
      points: 1
      prompt: |
        A famous early study supported the facial-feedback hypothesis, but a large preregistered replication across 17 laboratories did not find the effect. What is the most reasonable conclusion?
      options:
        - "The original researchers must have committed fraud."
        - "Facial expressions have no connection to emotion at all."
        - "Replications are unreliable and should be ignored."
        - "The effect in that procedure is probably much smaller than first reported, which shows why replication matters."
      option_explanations:
        - |
          A failed replication does not by itself show misconduct; small samples, chance and differences in procedure can produce an initial result that does not hold up.
        - |
          One failed replication of one procedure does not show that expressions never affect emotion; meta-analyses suggest a small effect.
        - |
          Large, preregistered replications are among the strongest evidence available; ignoring them would make science less reliable.
        - |
          Correct. Replication tests whether findings hold; a large replication that fails suggests the original effect was overestimated, and later reviews point to a small effect.
      answer: 3
    - slug: appsych-u04-w26-q09
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 1.A"
      points: 1
      prompt: |
        Which finding is the strongest evidence that some facial expressions of emotion are biologically based?
      options:
        - "People in a culture with little exposure to outside media matched faces to emotions much as other cultures did."
        - "People in different countries hold different rules about expressing anger at work."
        - "A smile can be polite rather than happy."
        - "Emotional elicitors differ from culture to culture."
      option_explanations:
        - |
          Correct. Recognition in a culture that could not have learned the expressions from shared media points to a shared, biological basis.
        - |
          Differences in rules for expressing anger are display rules, which show cultural influence rather than biology.
        - |
          A polite smile shows that expressions can be controlled to meet social norms, which does not show a biological basis.
        - |
          Differences in what triggers emotions show cultural learning, not universality of expression.
      answer: 0
    - slug: appsych-u04-w26-q10
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 1.B"
      points: 1
      prompt: |
        A coach notices that after a fun team-building game, players come up with more creative strategies and form closer friendships over the season. Which theory explains this?
      options:
        - "Cannon-Bard theory"
        - "Two-factor theory"
        - "Broaden-and-build theory"
        - "The low-road pathway"
      option_explanations:
        - |
          Cannon-Bard explains the timing of arousal and feeling, not lasting benefits of positive emotion.
        - |
          Two-factor theory explains how arousal is labeled as an emotion, not how positive emotion widens thinking.
        - |
          Correct. Positive emotions broaden thinking (creative strategies) and build lasting resources (friendships).
        - |
          The low road explains fast fear responses through the amygdala.
      answer: 2
    # ---- Spiral review
    - slug: appsych-u04-w26-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; CED Topic 1.2, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        The racing heart, faster breathing and sweating of fear are produced mainly by
      options:
        - "the parasympathetic division of the autonomic nervous system"
        - "the somatic nervous system"
        - "the central nervous system's spinal reflexes"
        - "the sympathetic division of the autonomic nervous system"
      option_explanations:
        - |
          The parasympathetic division calms the body after arousal, slowing the heart rather than speeding it.
        - |
          The somatic nervous system controls voluntary skeletal muscles, not automatic responses such as heart rate and sweating.
        - |
          Spinal reflexes are quick automatic movements such as pulling away from heat; they do not produce the whole-body arousal of fear.
        - |
          Correct. The sympathetic division produces fight-or-flight arousal: faster heart and breathing, sweating, slowed digestion.
      answer: 3
    - slug: appsych-u04-w26-q12
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; CED Topic 4.6, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        A gymnast performs a routine she has practiced for years best in the high-pressure final, while a teammate trying a new skill falls. Which principle from week 25 explains the difference?
      options:
        - "The overjustification effect"
        - "The Yerkes-Dodson law"
        - "Drive-reduction theory"
        - "An avoidance-avoidance conflict"
      option_explanations:
        - |
          The overjustification effect concerns rewards reducing intrinsic motivation, not performance under pressure.
        - |
          Correct. High arousal helps well-learned tasks but hurts new or difficult ones.
        - |
          Drive-reduction theory explains behavior that satisfies a physiological need, not how arousal affects performance.
        - |
          An avoidance-avoidance conflict is a choice between two unpleasant options; neither gymnast faces such a choice.
      answer: 1
    - slug: appsych-u04-w26-q13
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; CED Topic 4.3, Skill 1.B (spiral review)"
      points: 1
      prompt: |
        Seeing a calm crowd around a smoking vending machine, a student decides there is nothing to fear and stays seated. This most directly reflects
      options:
        - "informational social influence shaping her appraisal of the situation"
        - "the facial-feedback hypothesis"
        - "group polarization"
        - "the James-Lange theory"
      option_explanations:
        - |
          Correct. She uses others' calm behavior as information about whether there is danger, which shapes her appraisal and her emotional response (and is part of why bystanders fail to act).
        - |
          Facial feedback is about one's own expression shaping one's feeling; she is reading others' behavior.
        - |
          Group polarization is the strengthening of shared attitudes through discussion; no discussion is described.
        - |
          James-Lange concerns perceiving one's own bodily responses; here the key is how others' behavior is interpreted.
      answer: 0
    - slug: appsych-u04-w26-q14
      type: multi_select
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 1.A"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the two-factor theory are accurate? Select all that apply.
      options:
        - "It holds that emotion requires both physiological arousal and a cognitive label."
        - "It predicts that the same arousal can be experienced as different emotions in different contexts."
        - "It holds that the thalamus sends simultaneous signals to cortex and body."
        - "It is illustrated by Schachter and Singer's epinephrine study."
        - "It holds that facial expressions are identical across all cultures."
      option_explanations:
        - |
          Correct. Arousal and a label are the theory's two factors.
        - |
          Correct. Because the label comes from the situation, the same arousal could be felt as fear, anger or joy.
        - |
          That is the Cannon-Bard theory, not the two-factor theory.
        - |
          Correct. Participants with unexplained arousal took on a confederate's mood, the theory's classic illustration.
        - |
          Universality of expressions is Ekman's research area, not a claim of the two-factor theory.
      answer: [0, 1, 3]
    - slug: appsych-u04-w26-q15
      type: multi_select
      topic_code: "1.4"
      source: "Original item; CED Topic 1.4, Skill 1.A (spiral review)"
      points: 2
      partial_credit: true
      prompt: |
        Which brain structures play a central role in emotion? Select all that apply.
      options:
        - "The amygdala, which rapidly evaluates threats"
        - "The thalamus, which relays sensory information"
        - "The cerebellum, which is the main center for emotional feeling"
        - "The prefrontal cortex, which helps regulate emotional responses"
        - "The occipital lobe, which generates fear"
      option_explanations:
        - |
          Correct. The amygdala is central to detecting threat and producing fear responses.
        - |
          Correct. The thalamus relays sensory input both to the amygdala (low road) and to the cortex (high road).
        - |
          The cerebellum coordinates movement and balance; it is not the main center of emotional feeling.
        - |
          Correct. The prefrontal cortex is involved in appraising and regulating emotion, for example calming fear once a threat is judged harmless.
        - |
          The occipital lobe processes vision; seeing a threat involves it, but fear is generated by limbic structures such as the amygdala.
      answer: [0, 1, 3]
    - slug: appsych-u04-w26-q16
      type: true_false
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 1.A"
      points: 1
      prompt: |
        True or false: According to broaden-and-build theory, negative emotions such as fear tend to narrow attention toward specific actions.
      answer: true
      explanation: |
        True. Fredrickson contrasts negative emotions, which narrow attention toward urgent actions such as fleeing, with positive emotions, which broaden attention and build lasting resources.
    - slug: appsych-u04-w26-q17
      type: true_false
      topic_code: "3.6"
      source: "Original item; CED Topic 3.6, Skill 1.A (spiral review)"
      points: 1
      prompt: |
        True or false: Temperament, a person's characteristic emotional reactivity and intensity, is visible early in infancy and is partly influenced by genes.
      answer: true
      explanation: |
        True. Differences in temperament (for example, easy, difficult or slow-to-warm-up infants) appear early, are fairly stable, and show genetic influence in twin studies, a biological starting point for later emotional style.
    - slug: appsych-u04-w26-q18
      type: fill_blank
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skill 1.A"
      points: 1
      prompt: |
        The hypothesis that making a facial expression can influence the emotion you feel is called the facial-____ hypothesis.
      answer: ["feedback"]
      explanation: |
        The facial-feedback hypothesis proposes that expressions influence feelings; large replications suggest the effect is small.
    - slug: appsych-u04-w26-q19
      type: fill_blank
