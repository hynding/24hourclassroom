      prompt: |
        The Big Five factor describing a tendency to experience anxiety, moodiness and frequent negative emotion (the opposite of emotional stability) is ____.
      answer: ["neuroticism", "high neuroticism"]
      explanation: |
        Neuroticism is the Big Five factor for emotional instability; people high in it experience negative emotions more often and more intensely.
    - slug: appsych-u04-w26-q20
      type: short_answer
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skills 1.B and 4.A"
      points: 3
      prompt: |
        Before a championship game, Nia feels her heart pounding.

        (a) Explain how the two-factor theory predicts she could feel either anxiety or excitement.
        (b) Explain how cognitive appraisal could help her perform well.
        (c) Explain how the Cannon-Bard theory would describe her experience differently from the two-factor theory.
      answer: |
        (a) The arousal is the same either way; if she labels it using cues like "everyone's watching, I might fail," she feels anxiety, while "this is the game I've trained for" leads her to feel excitement.
        (b) Appraising the game as a challenge rather than a threat changes the emotion to excitement and confidence, which supports focus rather than worry.
        (c) Cannon-Bard says the pounding heart and the emotion arise at the same time and independently from the thalamus; no labeling of arousal is needed.
      explanation: |
        Three points, one per part. (a) same arousal, different labels from cues. (b) appraisal as challenge versus threat linked to performance. (c) simultaneous, independent arousal and feeling, contrasted with labeling.
    - slug: appsych-u04-w26-q21
      type: short_answer
      topic_code: "4.2"
      source: "Original item; CED Topic 4.2, Skill 1.B (spiral review)"
      points: 2
      prompt: |
        A charity ad shows smiling, attractive celebrities and upbeat music but gives little information about how donations are used.

        (a) Which route to persuasion does the ad rely on?
        (b) Explain how the ad's use of emotion relates to that route.
      answer: |
        (a) The peripheral route.
        (b) The ad uses positive emotional cues (attractive celebrities, music) rather than arguments; viewers who feel good may be persuaded without evaluating evidence, so the attitude change is likely to be weaker and short-lived.
      explanation: |
        Two points. (a) peripheral route. (b) emotional or surface cues substitute for argument quality.
    - slug: appsych-u04-w26-q22
      type: long_answer
      topic_code: "4.7"
      source: "Original item; CED Topic 4.7, Skills 1.A, 4.A and 4.B (EBQ-style)"
      points: 7
      stimulus: |
        **Three hypothetical studies (invented for this course).**

        **Source A.** Researchers showed photographs of six posed facial expressions to 300 adults in three countries. Across countries, 82–94% of participants matched each happy, sad, surprised and angry face to the intended emotion; matching rates for fear and disgust were lower (61–78%) and varied more by country.

        **Source B.** A research team filmed 40 teenagers in two cultures watching an embarrassing video alone and then with an older adult present. Alone, both groups showed similar expressions. With the adult present, teens in one culture more often hid their expressions behind neutral faces.

        **Source C.** Researchers coded the facial expressions of 25 children born blind and 25 sighted children opening a surprise gift. Both groups produced similar expressions of happiness and surprise, though the blind children's expressions were somewhat less intense.
      prompt: |
        Using the sources, develop an argument about whether emotional expression is shaped more by biology or by culture.

        (A) Propose a specific and defensible claim.
        (B)(i) Support your claim using at least one piece of specific evidence from one of the sources.
        (B)(ii) Explain how the evidence from (B)(i) supports your claim using a psychological concept from this unit.
        (C)(i) Support your claim using an additional piece of specific evidence from a different source.
        (C)(ii) Explain how the evidence from (C)(i) supports your claim using a different psychological concept from this unit.
      answer: |
        (A) Claim: Basic facial expressions of emotion are largely biological, but culture shapes when and how they are shown.
        (B)(i) Source C: children born blind produced expressions of happiness and surprise similar to sighted children's.
        (B)(ii) Because blind children could not learn expressions by watching others, this supports universal expressions of basic emotions with a biological basis, as Ekman's research proposes.
        (C)(i) Source B: teens in one culture hid their expressions with an older adult present but not when alone.
        (C)(ii) This shows display rules: cultural norms about when to show emotion modify the expression of an emotion that both cultures showed alike when alone.
      explanation: |
        Seven points. (A) 1 point: a defensible claim that takes a position on biology and/or culture. (B)(i) 1 point: accurate, specific evidence from one source. (B)(ii) 2 points: 1 for naming a relevant concept (universal expressions, basic emotions, biological basis), 1 for explaining how the evidence supports the claim through that concept. (C)(i) 1 point: accurate evidence from a different source. (C)(ii) 2 points: 1 for a different relevant concept (display rules, elicitors, cultural influence, observational learning), 1 for explaining how it supports the claim. Source A can support either side: high cross-cultural matching for happy, sad, surprised and angry faces (universality) or variation for fear and disgust (cultural influence on recognition).
