unit: 4
description: |
  46 questions · about 90 minutes · every topic of Unit 4 (4.1 to 4.7): attribution and person perception,
  attitudes and persuasion, conformity, obedience, group behavior and helping, psychodynamic, humanistic,
  social-cognitive and trait theories of personality, motivation and hunger, and emotion. Includes three
  shared-context sets (three questions on an invented online-ratings conformity study, three on one counseling
  scenario, three on an invented arousal and performance table), select-all, true/false and fill-in-the-blank
  items, two short-answer questions, and the two free-response types of the AP exam (7 points each): an Article
  Analysis Question on an invented study of social loafing and an Evidence-Based Question on three invented
  studies of rewards and motivation. Multiple choice, select-all and true/false items are graded at once;
  fill-in-the-blank items are matched automatically; the short answers and free-response questions are graded
  by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: online ratings and conformity (4.3)
  - slug: appsych-u04-exam-q01
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; CED Topic 4.3, Skill 2.A"
    points: 1
    stimulus: |
      **A hypothetical study (invented for this course).** A research team recruited 180 adults online and randomly assigned them to one of three conditions before they listened to the same unfamiliar 30-second song. Participants saw that earlier listeners had given the song an average of 2 stars (low), 4.5 stars (high), or saw no earlier ratings (control). Each participant then rated the song from 1 to 5 stars, publicly in one half of each condition (their name shown beside the rating) and privately in the other half.

      | Earlier ratings shown | Mean rating, public | Mean rating, private |
      |---|---|---|
      | Low (2 stars) | 2.6 | 3.0 |
      | Control (none) | 3.3 | 3.2 |
      | High (4.5 stars) | 4.0 | 3.6 |

      Participants were told the study was about "music and mood" and were debriefed afterward.
    prompt: |
      Which pattern in the table shows conformity?
    options:
      - "Ratings in the control condition were about the same publicly and privately."
      - "Every mean rating fell between 2 and 4 stars."
      - "Participants' ratings moved toward the earlier listeners' average, more so when ratings were public."
      - "Private ratings were always higher than public ratings."
    option_explanations:
      - |
        The control condition is the baseline with no group information; its stability is useful for comparison but is not itself evidence of conformity.
      - |
        The range of the means says nothing about whether participants were influenced by others' ratings.
      - |
        Correct. Compared with control (about 3.2–3.3), ratings fell after low earlier ratings and rose after high ones, and the shift was larger in public, a sign of conformity.
      - |
        Private ratings were higher than public ones in the low condition but lower in the high condition, so this statement is false.
    answer: 2
  - slug: appsych-u04-exam-q02
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; CED Topic 4.3, Skill 4.A"
    points: 1
    stimulus: |
      **A hypothetical study (invented for this course).** A research team recruited 180 adults online and randomly assigned them to one of three conditions before they listened to the same unfamiliar 30-second song. Participants saw that earlier listeners had given the song an average of 2 stars (low), 4.5 stars (high), or saw no earlier ratings (control). Each participant then rated the song from 1 to 5 stars, publicly in one half of each condition (their name shown beside the rating) and privately in the other half.

      | Earlier ratings shown | Mean rating, public | Mean rating, private |
      |---|---|---|
      | Low (2 stars) | 2.6 | 3.0 |
      | Control (none) | 3.3 | 3.2 |
      | High (4.5 stars) | 4.0 | 3.6 |

      Participants were told the study was about "music and mood" and were debriefed afterward.
    prompt: |
      Private ratings still shifted somewhat toward the earlier listeners' average. Which concept best explains the private shift?
    options:
      - "Informational social influence: participants took others' ratings as evidence about the song's quality."
      - "Normative social influence: participants wanted the other listeners to accept them."
      - "Obedience: an authority told participants how to rate the song."
      - "Social loafing: participants put less effort into rating."
    option_explanations:
      - |
        Correct. Since no one could see private ratings, the remaining shift suggests participants genuinely believed others' ratings told them something about the unfamiliar song.
      - |
        Normative influence depends on being seen by others; it explains the extra shift in public, not a shift in ratings no one could see.
      - |
        No one ordered participants to give a particular rating; seeing others' ratings is social information, not a command.
      - |
        Social loafing is reduced effort when contributions are pooled; each participant rated alone and was identifiable or not by condition.
    answer: 0
  - slug: appsych-u04-exam-q03
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; CED Topic 4.3, Skill 2.D"
    points: 1
    stimulus: |
      **A hypothetical study (invented for this course).** A research team recruited 180 adults online and randomly assigned them to one of three conditions before they listened to the same unfamiliar 30-second song. Participants saw that earlier listeners had given the song an average of 2 stars (low), 4.5 stars (high), or saw no earlier ratings (control). Each participant then rated the song from 1 to 5 stars, publicly in one half of each condition (their name shown beside the rating) and privately in the other half.

      | Earlier ratings shown | Mean rating, public | Mean rating, private |
      |---|---|---|
      | Low (2 stars) | 2.6 | 3.0 |
      | Control (none) | 3.3 | 3.2 |
      | High (4.5 stars) | 4.0 | 3.6 |

      Participants were told the study was about "music and mood" and were debriefed afterward.
    prompt: |
      What is the main purpose of the control condition?
    options:
      - "To make sure participants were debriefed"
      - "To increase the sample size of the high condition"
      - "To show which participants were most likely to conform"
      - "To provide a baseline rating of the song without social information, so shifts in the other conditions can be measured"
    option_explanations:
      - |
        Debriefing is an ethical step for all participants; it is not the function of a control condition.
      - |
        Control participants are a separate group; they do not add to the high condition's sample.
      - |
        The design compares group means; it does not identify which individuals conform most.
      - |
        Correct. Without earlier ratings, the control mean (about 3.2–3.3) shows how people rate the song on its own, the baseline against which the low and high conditions are compared.
    answer: 3
  # ---- Attribution and person perception (4.1)
  - slug: appsych-u04-exam-q04
    type: multiple_choice
    topic_code: "4.1"
    source: "Original item; CED Topic 4.1, Skill 1.B"
    points: 1
    prompt: |
      A teacher says, "I yelled because the class was out of control," but says a colleague who yelled "has a terrible temper." The teacher is showing
    options:
      - "the self-serving bias"
      - "the actor-observer bias"
      - "the just-world phenomenon"
      - "downward social comparison"
    option_explanations:
      - |
        The self-serving bias contrasts successes and failures; here the same behavior is explained differently depending on whether it is the teacher's or a colleague's.
      - |
        Correct. The teacher explains his own yelling situationally and the colleague's identical yelling dispositionally.
      - |
        The just-world phenomenon is the belief that people get what they deserve; no misfortune is being justified here.
      - |
        Downward social comparison means comparing oneself with someone worse off to feel better; the teacher is explaining behavior.
    answer: 1
  - slug: appsych-u04-exam-q05
    type: multiple_choice
    topic_code: "4.1"
    source: "Original item; CED Topic 4.1, Skill 1.B"
    points: 1
    prompt: |
      Which statement reflects an optimistic explanatory style after losing a tennis match?
    options:
      - "I'm just not athletic, and I never will be."
      - "I lose at everything I try."
      - "It's my fault, and it ruins my whole season."
      - "My serve was off today because of the wind; I'll practice it this week."
    option_explanations:
      - |
        "Not athletic" and "never will be" are internal and stable explanations, typical of a pessimistic style.
      - |
        "Everything I try" is a global explanation, typical of a pessimistic style.
      - |
        "My fault" is internal and "ruins my whole season" is global, both pessimistic features.
      - |
        Correct. The cause is external (wind), unstable (today) and specific (the serve), the features of an optimistic explanatory style.
    answer: 3
  - slug: appsych-u04-exam-q06
    type: multiple_choice
    topic_code: "4.1"
    source: "Original item; CED Topic 4.1, Skill 1.B"
    points: 1
    prompt: |
      A student who earned a B feels great after hearing that most of her friends got Cs, but would have felt disappointed if they had all gotten As. Her feelings depend most on
    options:
      - "social comparison"
      - "the mere exposure effect"
      - "the fundamental attribution error"
      - "an internal locus of control"
    option_explanations:
      - |
        Correct. She evaluates her grade by comparing it with her friends' grades; downward comparison raises her mood, and upward comparison would lower it.
      - |
        The mere exposure effect concerns liking after repeated exposure, not judging one's grade against others.
      - |
        The fundamental attribution error concerns explaining others' behavior; she is evaluating her own result.
      - |
        Locus of control is a belief about who controls outcomes; her feelings change with others' grades, not with her beliefs about control.
    answer: 0
  - slug: appsych-u04-exam-q07
    type: multiple_choice
    topic_code: "4.1"
    source: "Original item; CED Topic 4.1, Skill 1.A"
    points: 1
    prompt: |
      In a classic study, readers judged that essay writers truly held the views in their essays even when told the writers had been assigned their positions. This finding is evidence for
    options:
      - "the self-serving bias"
      - "relative deprivation"
      - "the fundamental attribution error"
      - "the self-fulfilling prophecy"
    option_explanations:
      - |
        The self-serving bias concerns explaining one's own outcomes; readers here were judging other people.
      - |
        Relative deprivation is feeling deprived compared with others; it is not about explaining someone's behavior.
      - |
        Correct. Readers attributed the essays to the writers' attitudes (disposition) despite knowing about a strong situational cause, the assignment.
      - |
        A self-fulfilling prophecy requires an expectation that changes behavior to make itself true; readers simply made judgments.
    answer: 2
  - slug: appsych-u04-exam-q08
    type: multiple_choice
    topic_code: "4.1"
    source: "Original item; CED Topic 4.1, Skill 2.A"
    points: 1
    prompt: |
      A hypothetical team wants to test whether teacher expectations affect student performance. Which design would allow a causal conclusion?
    options:
      - "Surveying teachers about which students they expect to do well and correlating those answers with grades"
      - "Randomly selecting some students, telling teachers those students are likely to excel, and comparing their end-of-year scores with classmates'"
      - "Interviewing students who did well about their relationships with teachers"
      - "Studying one teacher's classroom in depth for a year"
    option_explanations:
      - |
        This is correlational; teachers may expect more from students who are already doing well, so expectations might be a result rather than a cause.
      - |
        Correct. Because the "likely to excel" students were chosen at random, differences in later scores can be attributed to the manipulated expectation rather than to prior ability.
      - |
        Interviews of successful students are self-report from a selected group, with no comparison and no manipulation.
      - |
        A case study gives rich detail but cannot isolate the effect of expectations or generalize widely.
    answer: 1
  # ---- Attitudes (4.2)
  - slug: appsych-u04-exam-q09
    type: multiple_choice
    topic_code: "4.2"
    source: "Original item; CED Topic 4.2, Skill 1.B"
    points: 1
    prompt: |
      A voter who strongly cares about a ballot measure reads both sides' evidence carefully before deciding. According to the elaboration likelihood model, she is using
    options:
      - "the central route, which tends to produce durable attitude change"
      - "the peripheral route, which tends to produce durable attitude change"
      - "the central route, which tends to produce fragile attitude change"
      - "the halo effect"
    option_explanations:
      - |
        Correct. Motivated, careful evaluation of arguments is central-route processing, and attitudes formed this way tend to last and predict behavior.
      - |
        The peripheral route relies on surface cues, not careful reading of evidence, and its effects tend to be fragile.
      - |
        She is using the central route, but its attitude changes tend to be durable, not fragile.
      - |
        The halo effect is one positive trait coloring other judgments, a peripheral cue; she is weighing evidence.
    answer: 0
  - slug: appsych-u04-exam-q10
    type: multiple_choice
    topic_code: "4.2"
    source: "Original item; CED Topic 4.2, Skill 1.B"
    points: 1
    prompt: |
      Fans of one team describe themselves as varied individuals but say fans of their rival "all act the same." This is an example of
    options:
      - "the just-world phenomenon"
      - "cognitive dissonance"
      - "belief perseverance"
      - "out-group homogeneity bias"
    option_explanations:
      - |
        The just-world phenomenon is the belief that people get what they deserve; the fans are not explaining misfortune.
      - |
        Cognitive dissonance is tension from conflicting cognitions; nothing here describes such a conflict.
      - |
        Belief perseverance is holding onto a belief after its evidence is discredited; no evidence was discredited.
      - |
        Correct. Seeing members of the out-group as all alike while seeing one's own group as diverse is out-group homogeneity bias.
    answer: 3
  - slug: appsych-u04-exam-q11
    type: multiple_choice
    topic_code: "4.2"
    source: "Original item; CED Topic 4.2, Skill 1.B"
    points: 1
    prompt: |
      A fundraiser asks a donor to sponsor an entire new gym. When the donor declines, the fundraiser asks for a donation toward new basketballs instead. This tactic is
    options:
      - "foot-in-the-door"
      - "the mere exposure effect"
      - "door-in-the-face"
      - "the peripheral route"
    option_explanations:
      - |
        Foot-in-the-door begins with a small request that is accepted; here the first request is large and refused.
      - |
        The mere exposure effect is increased liking through repeated exposure, not a sequence of requests.
      - |
        Correct. A large request that is refused followed by a smaller one makes the smaller request seem like a concession that invites agreement.
      - |
        The peripheral route is persuasion by surface cues; this tactic depends on the order of requests.
    answer: 2
  - slug: appsych-u04-exam-q12
    type: multiple_choice
    topic_code: "4.2"
    source: "Original item; CED Topic 4.2, Skill 1.B"
    points: 1
    prompt: |
      Jae worked hard for weeks to earn a spot in an exclusive club with a tough tryout. Although club meetings turn out to be dull, he insists they are fascinating. Which concept best explains his attitude?
    options:
      - "Relative deprivation"
      - "Cognitive dissonance"
      - "Out-group homogeneity bias"
      - "Door-in-the-face"
    option_explanations:
      - |
        Relative deprivation concerns feeling deprived compared with others; Jae is justifying his own effort.
      - |
        Correct. "I worked hard to join" conflicts with "the club is dull"; changing his attitude toward the club reduces the dissonance.
      - |
        Out-group homogeneity bias concerns seeing other groups as alike; it does not explain liking a dull club.
      - |
        Door-in-the-face is a compliance technique involving requests, which does not apply here.
    answer: 1
  - slug: appsych-u04-exam-q13
    type: multiple_choice
    topic_code: "4.2"
    source: "Original item; CED Topic 4.2, Skill 2.C"
    points: 1
    prompt: |
      A person reports no bias toward older adults on a survey, but a reaction-time test shows faster pairing of "old" with negative words. Which statement is most accurate?
    options:
      - "The person is lying on the survey."
      - "The survey measures an explicit attitude, and the reaction-time test is meant to measure an implicit one; the two can differ."
      - "The reaction-time test proves the person will discriminate against older adults."
      - "The survey has perfect validity, so the reaction-time test must be wrong."
    option_explanations:
      - |
        A difference between explicit and implicit measures need not mean lying; people may be unaware of automatic associations.
      - |
        Correct. Explicit attitudes are consciously reported; implicit associations are inferred from indirect measures, and the two often diverge.
      - |
        Implicit measures predict individual behavior only weakly, so they cannot prove that one person will discriminate.
      - |
        Self-report surveys are vulnerable to social desirability bias, so they do not have perfect validity.
    answer: 1
  # ---- Social situations (4.3)
  - slug: appsych-u04-exam-q14
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; CED Topic 4.3, Skill 1.A"
    points: 1
    prompt: |
      In Milgram's best-known obedience study, about what percentage of participants continued to the maximum 450-volt level?
    options:
      - "About 5%"
      - "About 20%"
      - "About 40%"
      - "About 65%"
    option_explanations:
      - |
        Psychiatrists asked beforehand predicted that only a tiny fraction would go to the end, but the actual figure was far higher.
      - |
        About 20% is far below the actual result in the best-known version.
      - |
        About 40% is below the reported result; 26 of 40 is 65%.
      - |
        Correct. 26 of the 40 men (65%) continued to the maximum shock in the best-known version.
    answer: 3
  - slug: appsych-u04-exam-q15
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; CED Topic 4.3, Skill 1.B"
    points: 1
    prompt: |
      In a tug-of-war, each person on an eight-person team pulls with less force than when pulling alone. This is
    options:
      - "social loafing"
      - "social facilitation"
      - "groupthink"
      - "deindividuation"
    option_explanations:
      - |
        Correct. When effort is pooled and individual contributions cannot be identified, people tend to exert less effort.
      - |
        Social facilitation is improved performance on simple tasks when observed; here individual effort decreases in a group.
      - |
        Groupthink is faulty group decision-making, not reduced physical effort.
      - |
        Deindividuation is reduced self-restraint in anonymous, aroused groups; the issue here is effort.
    answer: 0
  - slug: appsych-u04-exam-q16
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; CED Topic 4.3, Skill 1.B"
    points: 1
    prompt: |
      In an advisory board, members who have doubts about a plan stay silent so as not to upset the friendly atmosphere, and the board ignores outside warnings. Which concept does this illustrate?
    options:
      - "Social facilitation"
      - "The bystander effect"
      - "Groupthink"
      - "The reciprocity norm"
    option_explanations:
      - |
        Social facilitation concerns performance in the presence of others, not suppressed dissent in decisions.
      - |
        The bystander effect is reduced helping in emergencies when others are present.
      - |
        Correct. Self-censorship to preserve harmony and dismissal of warnings are classic symptoms of groupthink.
      - |
        The reciprocity norm is the expectation to return help; it does not describe this decision process.
    answer: 2
  # ---- Stimulus set B: a counseling scenario (4.4, 4.5)
  - slug: appsych-u04-exam-q17
    type: multiple_choice
    topic_code: "4.4"
    source: "Original item; CED Topic 4.4, Skill 1.B"
    stimulus: |
      **A scenario (invented for this course).** A school counselor writes these notes about a student, Jordan.

      1. Jordan says his parents "only seem proud when I win." He says he feels like a fake when he isn't the best.
      2. After losing the debate final, Jordan said he "never cared about debate anyway."
      3. Jordan avoids trying out for the school play because he doubts he could ever learn to act.
      4. On a personality inventory Jordan scored very high on conscientiousness and low on extraversion.
    points: 1
    prompt: |
      In note 1, a humanistic psychologist would say Jordan has received
    options:
      - "too much unconditional positive regard"
      - "a superordinate goal"
      - "an internal locus of control"
      - "conditional positive regard, which can distort his self-concept"
    option_explanations:
      - |
        Unconditional positive regard is acceptance regardless of performance; Jordan describes the opposite.
      - |
        A superordinate goal is a shared goal requiring cooperation between groups, unrelated to parental approval.
      - |
        Locus of control concerns beliefs about who controls outcomes; note 1 is about the conditions placed on approval.
      - |
        Correct. Approval given only when he wins is conditional; Rogers argued this leads people to feel worthy only when meeting others' conditions, creating a gap between real and ideal self.
    answer: 3
  - slug: appsych-u04-exam-q18
    type: multiple_choice
    topic_code: "4.4"
    source: "Original item; CED Topic 4.4, Skill 1.B"
    stimulus: |
      **A scenario (invented for this course).** A school counselor writes these notes about a student, Jordan.

      1. Jordan says his parents "only seem proud when I win." He says he feels like a fake when he isn't the best.
      2. After losing the debate final, Jordan said he "never cared about debate anyway."
      3. Jordan avoids trying out for the school play because he doubts he could ever learn to act.
      4. On a personality inventory Jordan scored very high on conscientiousness and low on extraversion.
    points: 1
    prompt: |
      Note 2 best illustrates which defense mechanism?
    options:
      - "Projection"
      - "Rationalization"
      - "Sublimation"
      - "Regression"
    option_explanations:
      - |
        Projection attributes one's own feelings to others; Jordan is not claiming someone else did not care.
      - |
        Correct. He offers a self-protective explanation ("I never cared") in place of the painful reality of a loss he cared about.
      - |
        Sublimation channels impulses into a socially valued activity; Jordan is explaining away the loss.
      - |
        Regression is retreating to childlike behavior; nothing childlike is described.
    answer: 1
  - slug: appsych-u04-exam-q19
    type: multiple_choice
    topic_code: "4.5"
    source: "Original item; CED Topic 4.5, Skill 1.B"
    stimulus: |
      **A scenario (invented for this course).** A school counselor writes these notes about a student, Jordan.

      1. Jordan says his parents "only seem proud when I win." He says he feels like a fake when he isn't the best.
      2. After losing the debate final, Jordan said he "never cared about debate anyway."
      3. Jordan avoids trying out for the school play because he doubts he could ever learn to act.
      4. On a personality inventory Jordan scored very high on conscientiousness and low on extraversion.
    points: 1
    prompt: |
      Which concept from social-cognitive theory best describes note 3?
    options:
      - "Low self-efficacy for acting"
      - "Reaction formation"
      - "High neuroticism"
      - "The collective unconscious"
    option_explanations:
      - |
        Correct. Doubting his ability to succeed at a specific task (acting) is low self-efficacy, which leads him to avoid trying.
      - |
        Reaction formation turns an impulse into its opposite, a Freudian defense; note 3 describes a belief about ability.
      - |
        Neuroticism is a broad Big Five trait; the note describes a task-specific belief, the social-cognitive concept of self-efficacy.
      - |
        The collective unconscious is Jung's idea of shared archetypes, unrelated to Jordan's doubts about acting.
    answer: 0
  - slug: appsych-u04-exam-q20
    type: multiple_choice
    topic_code: "4.4"
    source: "Original item; CED Topic 4.4, Skill 1.A"
    points: 1
    prompt: |
      According to Freud, which part of personality operates on the pleasure principle?
    options:
      - "The ego"
      - "The superego"
      - "The id"
      - "The self-concept"
    option_explanations:
      - |
        The ego operates on the reality principle, finding realistic ways to satisfy desires.
      - |
        The superego holds internalized moral standards and produces guilt; it does not seek immediate pleasure.
      - |
        Correct. The id seeks immediate gratification of basic drives, the pleasure principle.
      - |
        The self-concept is Rogers' humanistic idea, not part of Freud's structure.
    answer: 2
  - slug: appsych-u04-exam-q21
    type: multiple_choice
    topic_code: "4.4"
    source: "Original item; CED Topic 4.4, Skill 2.C"
    points: 1
    prompt: |
      Which is the strongest scientific criticism of projective tests such as the Rorschach?
    options:
      - "They take too little time to administer."
      - "They rely on multiple-choice answers."
      - "Different scorers often interpret the same responses differently, and scores predict behavior poorly."
      - "They measure only the Big Five."
    option_explanations:
      - |
        Administration time is not the central scientific problem; reliability and validity are.
      - |
        Projective tests use open-ended responses to ambiguous stimuli, not multiple-choice answers.
      - |
        Correct. Weak inter-rater reliability and weak predictive validity are the main criticisms.
      - |
        Projective tests aim to reveal unconscious motives; Big Five traits are measured by inventories.
    answer: 2
  - slug: appsych-u04-exam-q22
    type: multiple_choice
    topic_code: "4.5"
    source: "Original item; CED Topic 4.5, Skill 1.A"
    points: 1
    prompt: |
      Trait researchers reduced thousands of personality words to a handful of broad dimensions by identifying which descriptions tend to occur together. Which statistical method did they use?
    options:
      - "Random assignment"
      - "A double-blind procedure"
      - "Percentile ranks"
      - "Factor analysis"
    option_explanations:
      - |
        Random assignment is an experimental technique for creating equivalent groups, not a way to find clusters of traits.
      - |
        A double-blind procedure controls expectations in experiments; it does not group trait words.
      - |
        Percentile ranks describe a score's standing in a distribution; they do not identify underlying dimensions.
      - |
        Correct. Factor analysis finds clusters of correlated items, revealing underlying dimensions such as the Big Five.
    answer: 3
  - slug: appsych-u04-exam-q23
    type: multiple_choice
    topic_code: "4.5"
    source: "Original item; CED Topic 4.5, Skill 1.B"
    points: 1
    prompt: |
      A student's confidence leads her to join the math team; practicing with strong teammates raises her skills; and her success leads her teacher to give her harder problems. Which concept does this best illustrate?
    options:
      - "Reciprocal determinism"
      - "The pleasure principle"
      - "Projection"
      - "Approach-avoidance conflict"
    option_explanations:
      - |
        Correct. Her beliefs, behavior and environment keep influencing one another, the core of Bandura's reciprocal determinism.
      - |
        The pleasure principle is the id's demand for immediate gratification, unrelated to this cycle.
      - |
        Projection is attributing one's feelings to others; nothing of the kind occurs here.
      - |
        An approach-avoidance conflict is one goal with good and bad features; the scenario describes interacting influences instead.
    answer: 0
  # ---- Stimulus set C: arousal and performance (4.6)
  - slug: appsych-u04-exam-q24
    type: multiple_choice
    topic_code: "4.6"
    source: "Original item; CED Topic 4.6, Skill 3.A"
    points: 1
    stimulus: |
