  - slug: appsych-u04-exam-q43
    type: short_answer
    topic_code: "4.3"
    source: "Original item; CED Topic 4.3, Skills 1.B and 4.A"
    points: 3
    prompt: |
      A class is assigned a group presentation with one shared grade.

      (a) Explain how social loafing could affect the group.
      (b) Explain how social facilitation could affect a well-practiced presenter on presentation day.
      (c) Propose one change to the assignment that would reduce social loafing, and explain why it works.
    answer: |
      (a) Because only the group's work is graded, some members may put in less effort, believing their individual contribution won't be noticed and others will compensate.
      (b) The audience raises arousal, strengthening the dominant response; for a well-practiced presenter that response is correct, so she is likely to perform better than in rehearsal.
      (c) Grade each member's identifiable part (or have peers evaluate individual contributions), which restores individual accountability.
    explanation: |
      Three points, one per part. (a) reduced effort when contributions are pooled. (b) improved performance on a well-learned task with an audience, with arousal or dominant response. (c) a change that makes individual contributions identifiable, with the reason.
