  # ---- Free response: Article Analysis Question
  - slug: appsych-u04-exam-q45
    type: long_answer
    topic_code: "4.3"
    source: "Original item; CED Topic 4.3, Skills 2.A, 2.B, 3.A, 2.D and 4.A (AAQ)"
    points: 7
    stimulus: |
      **A hypothetical study (invented for this course), summarized as a journal article would report it.**

      *Participants.* 120 undergraduate students (66 women, 54 men; ages 18–22) at one large public university in the Midwestern United States volunteered for course credit.

      *Method.* Participants were randomly assigned to one of two conditions. In the *pooled* condition, each participant was told that their ideas for uses of a brick would be combined with those of four other students and only the group's total would be counted. In the *identifiable* condition, each participant was told their own ideas would be counted and their name recorded. In both conditions, participants actually worked alone for 10 minutes. The dependent variable was the number of distinct, sensible uses each participant wrote.

      *Results.* Pooled condition: mean 9.2 uses (SD 3.1). Identifiable condition: mean 13.6 uses (SD 3.4). The difference was statistically significant (p under 0.001), with a large effect size (Cohen's d = 1.35).

      *Ethics.* The study was approved by the university's institutional review board. Participants gave informed consent, were told the true purpose afterward, and their responses were stored under code numbers.
    prompt: |
      (A) Identify the research method used in the study.
      (B) State the operational definition of effort in the study.
      (C) Describe what the effect size of d = 1.35 indicates about the results.
      (D) Identify at least one ethical guideline applied by the researchers.
      (E) Explain the extent to which the research findings may or may not be generalizable, using specific and relevant evidence from the study.
      (F) Explain how at least one of the research findings supports or refutes the claim that people work less hard when their individual effort cannot be identified. Use social loafing in your explanation.
    answer: |
      (A) An experiment: the researchers manipulated whether contributions were pooled or identifiable and randomly assigned participants.
      (B) The number of distinct, sensible uses for a brick a participant wrote in 10 minutes.
      (C) A large difference between the conditions: the identifiable group's mean was about 1.35 standard deviations higher than the pooled group's, so the manipulation had a substantial practical effect, not just a statistically significant one.
      (D) IRB approval, informed consent, debriefing (told the true purpose afterward), or confidentiality (code numbers).
      (E) Limited: all participants were undergraduates aged 18–22 at one Midwestern university earning course credit, and the task was a brief lab task; results may not apply to older adults, other cultures or real workplace teams. Random assignment supports the causal conclusion within this sample, but not wider generalization.
      (F) Supports the claim: participants who believed their ideas were pooled produced fewer uses (9.2) than those whose ideas were identifiable (13.6). This is social loafing: when individual contributions cannot be evaluated, people feel less accountable and exert less effort.
    explanation: |
      Seven points, one per part (F worth 2).
      (A) 1 point: experiment, or an answer that names manipulation and random assignment.
      (B) 1 point: number of distinct, sensible uses written in 10 minutes. "Effort" alone or "the task" earns no point.
      (C) 1 point: the size of the difference is large (about 1.35 SDs) or practically meaningful. Restating only that it is significant earns no point.
      (D) 1 point: names IRB approval, informed consent, debriefing or confidentiality, consistent with the study.
      (E) 1 point: a judgment about generalizability supported by specific features (undergraduates, one university, ages 18–22, course credit, lab task).
      (F) 2 points: 1 for stating that the results support the claim with evidence from the study (9.2 versus 13.6, or the significant difference); 1 for explaining the result with social loafing (reduced accountability when contributions are pooled).
  # ---- Free response: Evidence-Based Question
  - slug: appsych-u04-exam-q46
    type: long_answer
    topic_code: "4.6"
    source: "Original item; CED Topic 4.6, Skills 4.A and 4.B (EBQ)"
    points: 7
    stimulus: |
      **Three hypothetical studies (invented for this course) on rewards and motivation.**

      **Source A.** Researchers randomly assigned 90 fourth graders who enjoyed a science puzzle app to receive a sticker for every puzzle solved for two weeks or to use the app with no stickers. In the week after stickers stopped, the sticker group used the app an average of 22 minutes, compared with 41 minutes for the no-sticker group (p under 0.01).

      **Source B.** A survey of 1,200 employees at 40 companies found that workers who said they had choices about how to do their work and felt close to coworkers reported higher job satisfaction and stayed with their companies longer (r = 0.38 between a combined autonomy-and-relatedness score and years at the company).

      **Source C.** Researchers gave 60 students who rarely read for pleasure a small gift card for each book read for six weeks. During the program, they read an average of 4.1 books, compared with 0.6 books for a comparison group. Six weeks after the program ended, the reward group read an average of 1.4 books, compared with 0.5 for the comparison group.
    prompt: |
      Using the sources, develop and justify an argument about how external rewards affect motivation.

      (A) Propose a specific and defensible claim based in psychological science that responds to the question.
      (B)(i) Support your claim using at least one piece of specific and relevant evidence from one of the sources.
      (B)(ii) Explain how the evidence from (B)(i) supports your claim using a psychological concept or theory from this unit.
      (C)(i) Support your claim using an additional piece of specific and relevant evidence from a different source.
      (C)(ii) Explain how the evidence from (C)(i) supports your claim using a different psychological concept or theory from this unit.
    answer: |
      (A) Claim: External rewards can undermine motivation for activities people already enjoy, but they can help start behaviors people do not yet find rewarding, and settings that meet psychological needs sustain motivation better than rewards.
      (B)(i) Source A: children who already enjoyed the app and received stickers used it 22 minutes after the stickers stopped, versus 41 minutes for children who never got stickers.
      (B)(ii) This is the overjustification effect: an expected reward for an already enjoyable activity shifted the children's reason for playing from interest to stickers, so intrinsic motivation fell when the reward ended.
      (C)(i) Source B: employees with more autonomy and closer coworkers were more satisfied and stayed longer (r = 0.38).
      (C)(ii) Self-determination theory: meeting the needs for autonomy and relatedness fosters intrinsic motivation, which sustains effort without relying on external rewards. (Alternatively, Source C: rewards raised reading among reluctant readers, and some effect persisted, showing extrinsic motivation can start a behavior, consistent with operant reinforcement.)
    explanation: |
      Seven points.
      (A) 1 point: a defensible claim about how external rewards affect motivation (it may be qualified). A restatement of the question earns no point.
      (B)(i) 1 point: accurate, specific evidence from one source (numbers or a precise description).
      (B)(ii) 2 points: 1 for a relevant concept (overjustification effect, intrinsic versus extrinsic motivation, self-determination theory, incentive theory, operant reinforcement); 1 for explaining how the evidence supports the claim through that concept.
      (C)(i) 1 point: accurate evidence from a different source.
      (C)(ii) 2 points: 1 for a different relevant concept; 1 for explaining how it supports the claim.
      Note: Source B is correlational; an explanation that treats it as proof of causation can still earn the points if the concept is applied correctly, but stronger answers note the limitation.
