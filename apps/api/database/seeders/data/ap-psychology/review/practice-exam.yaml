  # Stimulus set: a hypothetical treatment trial (q70-q73).
  - slug: appsych-final-q70
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; AP Psychology CED, Topic 5.4"
    points: 1
    stimulus: |
      A hypothetical clinical trial, invented for this course: 150 adults who met DSM-5-TR criteria for major depressive disorder volunteered at three clinics and were randomly assigned to 12 weeks of cognitive behavioral therapy (CBT), 12 weeks of an antidepressant medication, or a waitlist (offered treatment after the study). Symptoms were rated on a 0–60 scale, where higher scores mean more severe symptoms, by clinicians who did not know which group each person was in.

      | Group | n | Mean at start | Mean at 12 weeks (SD) |
      |---|---|---|---|
      | CBT | 50 | 34 | 18 (8) |
      | Medication | 50 | 35 | 19 (9) |
      | Waitlist | 50 | 34 | 29 (8) |

      Each treatment group differed significantly from the waitlist at 12 weeks (p = .002 for both comparisons). CBT and medication did not differ significantly (p = .58).
    prompt: |
      Which description fits the DSM-5-TR picture of major depressive disorder that participants had to meet?
    options:
      - "Alternating periods of mania and depression"
      - "A persistently low mood lasting at least two years, with no other symptoms required"
      - "At least two weeks of depressed mood or loss of interest or pleasure, with other symptoms such as changes in sleep, appetite, energy or concentration"
      - "Hallucinations and delusions as the main symptoms"
    option_explanations:
      - |
        Episodes of mania, often alternating with periods of depression, describe a bipolar disorder, which the DSM-5-TR classifies separately from major depressive disorder.
      - |
        A low mood lasting two years or more describes persistent depressive disorder, and it too requires additional symptoms; it is not major depressive disorder.
      - |
        Correct. Major depressive disorder involves a period of at least two weeks with depressed mood or loss of interest or pleasure, along with several other symptoms that impair functioning.
      - |
        Hallucinations and delusions as the central symptoms describe schizophrenia spectrum disorders.
    answer: 2
  - slug: appsych-final-q71
    type: multiple_choice
    topic_code: "5.5"
    source: "Original item; AP Psychology CED, Topic 5.5"
    points: 1
    stimulus: |
      A hypothetical clinical trial, invented for this course: 150 adults who met DSM-5-TR criteria for major depressive disorder volunteered at three clinics and were randomly assigned to 12 weeks of cognitive behavioral therapy (CBT), 12 weeks of an antidepressant medication, or a waitlist (offered treatment after the study). Symptoms were rated on a 0–60 scale, where higher scores mean more severe symptoms, by clinicians who did not know which group each person was in.

      | Group | n | Mean at start | Mean at 12 weeks (SD) |
      |---|---|---|---|
      | CBT | 50 | 34 | 18 (8) |
      | Medication | 50 | 35 | 19 (9) |
      | Waitlist | 50 | 34 | 29 (8) |

      Each treatment group differed significantly from the waitlist at 12 weeks (p = .002 for both comparisons). CBT and medication did not differ significantly (p = .58).
    prompt: |
      Which conclusion is best supported by the results?
    options:
      - "CBT is proven to be better than medication, because its mean was 1 point lower."
      - "For adults like these volunteers, both treatments reduced symptoms more than waiting, and there is no convincing evidence that either treatment beat the other."
      - "Symptoms in the waitlist group became more severe over the 12 weeks."
      - "The results apply to everyone with any psychological disorder."
    option_explanations:
      - |
        The CBT-medication difference was not statistically significant (p = .58), so a 1-point gap could easily arise by chance; nothing here is proven.
      - |
        Correct. Both treatment groups ended well below the waitlist, with significant differences, while the two treatments did not differ significantly; the volunteers limit how far the results generalize.
      - |
        The waitlist mean fell from 34 to 29, so symptoms eased somewhat even without treatment; they did not become more severe.
      - |
        Participants all had major depressive disorder and volunteered at three clinics; the findings cannot be stretched to every disorder or every person.
    answer: 1
  - slug: appsych-final-q72
    type: multiple_choice
    topic_code: "5.5"
    source: "Original item; AP Psychology CED, Topic 5.5"
    points: 1
    stimulus: |
      A hypothetical clinical trial, invented for this course: 150 adults who met DSM-5-TR criteria for major depressive disorder volunteered at three clinics and were randomly assigned to 12 weeks of cognitive behavioral therapy (CBT), 12 weeks of an antidepressant medication, or a waitlist (offered treatment after the study). Symptoms were rated on a 0–60 scale, where higher scores mean more severe symptoms, by clinicians who did not know which group each person was in.

      | Group | n | Mean at start | Mean at 12 weeks (SD) |
      |---|---|---|---|
      | CBT | 50 | 34 | 18 (8) |
      | Medication | 50 | 35 | 19 (9) |
      | Waitlist | 50 | 34 | 29 (8) |

      Each treatment group differed significantly from the waitlist at 12 weeks (p = .002 for both comparisons). CBT and medication did not differ significantly (p = .58).
    prompt: |
      What is the main benefit of randomly assigning participants to the three groups?
    options:
      - "It allows the results to be generalized to all adults in the country."
      - "It eliminates placebo effects in the medication group."
      - "It ensures participants know which treatment they are receiving."
      - "It spreads pre-existing differences, such as symptom severity, evenly across groups on average, so differences in outcome can be attributed to the treatments."
    option_explanations:
      - |
        Generalizing to a population requires random sampling from it; random assignment of volunteers supports cause-and-effect conclusions, not wider generalization.
      - |
        Random assignment does not remove placebo effects; a placebo control group would be needed to separate the drug's effect from expectations.
      - |
        Random assignment concerns which group a person is placed in, not what they know about it.
      - |
        Correct. Because chance decides group membership, groups start out similar on average (note the nearly equal starting means), which lets researchers attribute later differences to the treatments.
    answer: 3
