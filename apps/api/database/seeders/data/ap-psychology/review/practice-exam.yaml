      - "Initiative versus guilt"
      - "Generativity versus stagnation"
    option_explanations:
      - |
        Correct. Erikson described adolescence as the time of identity versus role confusion, when young people test roles and values to form a consistent sense of self.
      - |
        Intimacy versus isolation is the young-adult task of forming close, committed relationships, which Erikson placed after identity formation.
      - |
        Initiative versus guilt belongs to the preschool years, when children learn to start activities and carry out plans.
      - |
        Generativity versus stagnation is the middle-adulthood task of contributing to others and the next generation.
    answer: 0
