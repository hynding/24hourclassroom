    topic_code: "5.2"
    source: "Original item; AP Psychology CED, Topic 5.2"
    points: 1
    prompt: |
      Which research question is most typical of positive psychology?
    options:
      - "Which character strengths, such as gratitude and kindness, are linked to people's well-being?"
      - "How do unconscious childhood conflicts produce anxiety?"
      - "Which brain areas are damaged in people with memory loss?"
      - "How quickly do rats learn a maze when rewarded with food?"
    option_explanations:
      - |
        Correct. Positive psychology studies human strengths, positive emotions and what helps people and communities flourish.
      - |
        Unconscious conflicts are the focus of the psychodynamic perspective, which centers on sources of distress rather than strengths.
      - |
        Locating damage linked to memory loss is a biological question; positive psychology focuses on what goes right in people's lives.
      - |
        Maze learning with food rewards is a behavioral research question about conditioning, not about strengths or well-being.
    answer: 0
  - slug: appsych-final-q67
    type: multiple_choice
    topic_code: "5.2"
    source: "Original item; AP Psychology CED, Topic 5.2"
    points: 1
    prompt: |
      A year after surviving a house fire, a teenager says the experience made her closer to her family and gave her a clearer sense of what she values. Positive psychologists would describe this as
    options:
      - "the exhaustion phase of stress"
      - "learned helplessness"
      - "posttraumatic growth"
      - "the overjustification effect"
    option_explanations:
      - |
        The exhaustion phase is depletion after long-term stress; she describes positive change, not depleted resources.
      - |
        Learned helplessness is giving up after repeated uncontrollable events; she describes gaining strengths and clearer values.
      - |
        Correct. Posttraumatic growth is positive psychological change, such as closer relationships and new priorities, that some people report after struggling with a highly challenging event.
      - |
        The overjustification effect concerns rewards reducing intrinsic motivation, which is unrelated to how she responded to the fire.
    answer: 2
  - slug: appsych-final-q68
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; AP Psychology CED, Topic 5.3"
    points: 1
    prompt: |
      Two siblings both carry a genetic vulnerability to depression. Only the one who later experiences a series of major losses develops a depressive disorder. Which model best explains this difference?
    options:
      - "The medical model alone, because disorders are purely physical illnesses"
      - "The psychodynamic model, because the cause must lie in unconscious conflicts"
      - "The behavioral model alone, because only learning matters"
      - "The diathesis-stress model, in which a predisposition interacts with environmental stressors"
    option_explanations:
      - |
        The medical model alone does not explain why two siblings with the same vulnerability have different outcomes; the difference lies in their experiences.
      - |
        Nothing in the scenario points to unconscious conflicts; the key difference between the siblings is their life events.
      - |
        Both siblings share a genetic vulnerability, so an account that considers only learning leaves out part of the picture.
      - |
        Correct. The diathesis-stress model holds that a predisposition (diathesis) makes a disorder more likely only when combined with sufficient stress, which fits the sibling who faced major losses.
    answer: 3
  - slug: appsych-final-q69
