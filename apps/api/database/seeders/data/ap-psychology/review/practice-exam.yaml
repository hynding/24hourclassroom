    prompt: |
      A dog learned to salivate to a bell paired with food. The bell is then rung many times without food until salivation stops. A day later, the bell is rung again and the dog salivates weakly. This weak return of the response is called
    options:
      - "stimulus generalization"
      - "spontaneous recovery"
      - "second-order conditioning"
      - "acquisition"
    option_explanations:
      - |
        Generalization is responding to stimuli similar to the conditioned stimulus, such as a different bell; here it is the same bell after a rest.
      - |
        Correct. After extinction and a pause, a weakened conditioned response can reappear, which shows the original learning was suppressed rather than erased.
      - |
        Second-order conditioning pairs a new neutral stimulus with an already conditioned stimulus; no new stimulus is introduced here.
      - |
        Acquisition is the initial learning phase, when the bell is paired with food; the response here returns without any new pairing.
