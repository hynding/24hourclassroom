      - |
        The self-serving bias concerns explaining one's own successes and failures, taking credit for good outcomes and blaming the situation for bad ones.
      - |
        The just-world phenomenon is believing people get what they deserve; the driver is explaining a behavior, not judging a victim's fate.
      - |
        The mere-exposure effect is liking things more after repeated exposure to them; it is unrelated to explaining a single action.
