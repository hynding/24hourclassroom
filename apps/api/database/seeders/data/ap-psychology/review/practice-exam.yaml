  - slug: appsych-final-q75
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; AP Psychology CED, Topic 5.4"
    points: 1
    prompt: |
      A person has unwanted, intrusive thoughts about contamination and feels driven to wash her hands many times an hour to relieve the distress, which takes up hours of each day. In the DSM-5-TR, this pattern is most consistent with
    options:
      - "generalized anxiety disorder"
      - "obsessive-compulsive disorder"
      - "a specific phobia"
      - "dissociative identity disorder"
    option_explanations:
      - |
        Generalized anxiety disorder involves persistent, wide-ranging worry, not specific intrusive thoughts paired with repetitive behaviors done to relieve them.
