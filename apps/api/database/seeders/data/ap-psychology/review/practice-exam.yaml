  # ---- Section II: free response (q76-q77), 7 points each.
  - slug: appsych-final-q76
    type: long_answer
    topic_code: "1.5"
    source: "Original item (Article Analysis Question); AP Psychology CED, Topic 1.5"
    points: 7
    stimulus: |
      The following is a summary of a hypothetical study, invented for this course. The researchers, journal and data are not real.

      Title: A Short Nap After Learning and Memory for Word Pairs in High School Students

      Participants: 96 students aged 15 to 18 from two public high schools in one U.S. state volunteered, with written permission from a parent or guardian and their own written agreement. Of them, 58 identified as female and 38 as male. Students with a diagnosed sleep disorder were excluded.

      Method: Each student was randomly assigned to a nap group (48 students) or a rest group (48 students). At 1:00 p.m. all students studied 40 pairs of unrelated words (such as lamp and river) until they could recall every pair once. The nap group then slept for up to 30 minutes in a quiet, dark room, with sleep confirmed by a wristband sleep monitor; the rest group watched a silent nature video for 30 minutes in the same kind of room. At 4:00 p.m. a researcher who did not know which group each student was in showed the first word of each pair and recorded how many second words the student recalled correctly (from 0 to 40).

      Results: The nap group recalled a mean of 27.5 pairs (SD = 5.0); the rest group recalled a mean of 23.0 pairs (SD = 5.5). The difference was statistically significant (p = .001), and the effect size was d = 0.85.

      Ethics: After the final test, students were told the full purpose of the study. They could withdraw at any time, and their data were stored under code numbers rather than names.

      Discussion: The researchers concluded that a short nap after learning helps students hold on to newly learned material.
    prompt: |
      Article Analysis Question. Using the summary above, answer every part.

      (A) Identify the research method used in the study.

      (B) State the operational definition of memory performance in the study.

      (C) Describe what the p-value of .001 indicates about the difference between the two groups.

      (D) Identify at least one ethical guideline that the researchers followed.

      (E) Explain the extent to which the findings may or may not be generalizable, using specific and relevant evidence from the study.

      (F) Explain how at least one of the findings supports or refutes the claim that sleep after learning helps the brain consolidate new memories, using a psychological concept. (2 points)
    answer: |
      (A) An experiment: students were randomly assigned to a nap condition or a rest condition (the independent variable) and recall was compared.
      (B) Memory performance was the number of word pairs (from 0 to 40) for which the student correctly gave the second word when shown the first, at 4:00 p.m.
      (C) A p-value of .001 means that, if napping had no effect, a difference in means as large as 4.5 pairs would be very unlikely (about 1 chance in 1,000) to occur by chance alone; the difference is statistically significant.
      (D) Informed consent (with parental permission and the students' own agreement for minors); debriefing (students were told the purpose afterwards); right to withdraw; confidentiality (data stored under code numbers).
      (E) Limited generalizability: the 96 students were volunteers from two schools in one state, aged 15 to 18 and without sleep disorders, so results may not apply to younger or older people, people with sleep disorders, or students elsewhere. On the other hand, the sample included both sexes and two schools, which supports some generalization to similar high school students. The lab-style word-pair task may also not reflect real schoolwork.
      (F) The findings support the claim. The nap group recalled significantly more pairs (27.5 versus 23.0, a large effect of d = 0.85) than the rest group, which spent the same time awake in the same kind of room. Sleep is thought to support memory consolidation, the process in which newly encoded memories are stabilized for long-term storage (with the hippocampus replaying recent learning during sleep). Because only sleep differed between the groups, the better recall is consistent with consolidation during the nap.
    explanation: |
      Seven points, one each for parts A–E and two for part F.
      (A) 1 point: identifies the method as an experiment. "Correlational study" or "case study" earns no point; mentioning random assignment is not required.
      (B) 1 point: states the operational definition as the number of word pairs correctly recalled (out of 40) when cued with the first word. "How well they remembered" without the measure earns no point.
      (C) 1 point: explains that p = .001 indicates the difference between the group means is statistically significant, meaning it is very unlikely to be due to chance alone. Saying p = .001 means "the effect is small" or "0.1% of students improved" earns no point.
      (D) 1 point: identifies an ethical guideline the researchers followed: informed consent (or parental consent and assent for minors), debriefing, right to withdraw, or confidentiality. Naming a guideline that was violated, or one not described in the study, earns no point.
      (E) 1 point: explains the extent of generalizability with specific evidence from the study, such as volunteers from only two schools in one state, ages 15 to 18 only, or exclusion of students with sleep disorders. A general statement ("the sample was small") without evidence from the study earns no point.
      (F) 2 points: 1 point for using a specific finding to state that the results support (or refute, if well argued) the claim, such as the nap group recalling 27.5 pairs versus 23.0 for the rest group, a significant difference; 1 point for explaining the link using a relevant psychological concept, such as memory consolidation, the hippocampus's role in consolidation, or sleep stages during the nap. Restating the claim without a finding, or naming a concept without connecting it to the finding, earns at most 1 point.
  - slug: appsych-final-q77
    type: long_answer
    topic_code: "5.1"
    source: "Original item (Evidence-Based Question); AP Psychology CED, Topic 5.1"
    points: 7
    stimulus: |
      The three sources below summarize hypothetical studies, invented for this course. The researchers and data are not real. All three concern physical activity and stress in adolescents.

      Source A (experiment). 120 high school volunteers were randomly assigned either to 20 minutes of brisk walking or to 20 minutes of seated video watching, three times a week for six weeks. Perceived stress was measured with a 0–40 questionnaire (higher means more stress) before and after. The walking group's mean score fell from 22 to 16; the video group's mean fell from 22 to 21. The difference in change between the groups was statistically significant (p = .004).

      Source B (correlational survey). 1,450 students aged 13 to 18 from 12 schools reported the number of days per week on which they were physically active for at least 60 minutes, and completed the same stress questionnaire. The correlation between active days and stress score was r = −0.31, which was statistically significant. Students on sports teams reported lower stress than other students, but they also reported more hours of sleep and more close friends.

      Source C (physiological study). 40 volunteers aged 16 to 19 who exercised regularly and 40 who did not completed a stressful task: a timed arithmetic test while a researcher watched and took notes. Heart rate and the stress hormone cortisol (measured in saliva) were recorded before and after the task. Both groups' heart rate and cortisol rose during the task, but in the regular exercisers both returned to their starting levels about 15 minutes sooner, on average.
    prompt: |
      Evidence-Based Question. Using the sources, develop and justify an argument about whether physical activity reduces stress in adolescents.

      (A) Propose a specific and defensible claim, based on at least one of the sources, that responds to the question.

      (B)(i) Support your claim with at least one specific and relevant piece of evidence from one of the sources.
      (B)(ii) Explain how the evidence from (B)(i) supports your claim, using a psychological concept, theory or research finding. (2 points)

      (C)(i) Support your claim with at least one specific and relevant piece of evidence from a different source than the one used in (B)(i).
      (C)(ii) Explain how the evidence from (C)(i) supports your claim, using a different psychological concept, theory or research finding from the one used in (B)(ii). (2 points)
    answer: |
      (A) Regular physical activity reduces adolescents' perceived stress and helps the body recover faster from stressful events.
      (B)(i) In Source A, students randomly assigned to brisk walking three times a week saw their mean stress score fall from 22 to 16, compared with a fall from 22 to 21 for the video group, a statistically significant difference.
      (B)(ii) Because Source A is an experiment with random assignment, pre-existing differences in stress were spread evenly across the groups, so the larger drop can be attributed to the walking itself, which supports a cause-and-effect claim. Exercise can also work as emotion-focused coping: it does not remove the stressors themselves, but it gives students a regular, controllable way to reduce the tension and distress they cause.
      (C)(i) In Source C, regular exercisers' heart rate and cortisol returned to baseline about 15 minutes sooner after a stressful arithmetic task than non-exercisers'.
      (C)(ii) A stressor triggers the sympathetic nervous system and the release of cortisol (the alarm reaction of Selye's general adaptation syndrome). Faster recovery means the body spends less time in this aroused state, so regular activity may protect against the wear of prolonged stress, which can weaken immune functioning. Because Source C did not randomly assign exercise, this evidence is supportive rather than conclusive.
    explanation: |
      Seven points: 1 for part A, 3 for part B, 3 for part C.
      (A) 1 point: a specific, defensible claim that answers the question about physical activity and stress, such as "Regular physical activity reduces stress in adolescents." Restating the question or making a claim the sources cannot support ("exercise cures all anxiety disorders") earns no point.
      (B)(i) 1 point: cites specific, relevant evidence from one source that supports the claim, such as the walking group's drop from 22 to 16 in Source A, the correlation r = −0.31 in Source B, or the faster cortisol recovery in Source C. Naming a source without stating its finding earns no point.
      (B)(ii) 2 points: 1 point for using an appropriate psychological concept, theory or research finding (for example random assignment and causation, emotion-focused coping, the sympathetic nervous system, cortisol and the general adaptation syndrome, or correlation); 1 point for explaining how that concept connects the evidence to the claim. A concept named without an explanation of the link earns at most 1 point.
      (C)(i) 1 point: cites specific, relevant evidence from a different source than the one used in (B)(i).
      (C)(ii) 2 points: as for (B)(ii), with a different concept from the one used in (B)(ii). If Source B is used, a response that notes the third variables (sleep, friendships) as possible confounds while explaining why the negative correlation is still consistent with the claim is fully acceptable; a response that treats the correlation as proof of causation earns at most 1 point.
  # ---- Beyond the AP format (q78-q91): the other item types, all five units.
  - slug: appsych-final-q78
    type: multi_select
    topic_code: "2.7"
    source: "Original item; AP Psychology CED, Topic 2.7"
    points: 1
    partial_credit: true
    prompt: |
      In a hypothetical study, invented for this course, participants watch a short video of a bicycle theft. Afterwards half read a summary that wrongly says the thief wore a red cap (no cap appears in the video); the other half read an accurate summary. A week later, 40% of the first group and 8% of the second group report that the thief wore a red cap. Which statements are true? Select all that apply.
    options:
      - "The result illustrates the misinformation effect: misleading information after an event can alter memory of the event."
      - "Some participants may show source amnesia, remembering the cap but not that it came from the summary rather than the video."
      - "The result shows that the participants who reported a cap were deliberately lying."
      - "Classic research by Loftus and Palmer found that the verb used in a question about a filmed car crash affected people's estimates of the cars' speed."
      - "Because 40% reported the cap, the study shows that 40% of all courtroom eyewitnesses give false testimony."
    option_explanations:
      - |
        Correct. Post-event information that is misleading becomes blended into the memory, so people recall details that never happened.
      - |
        Correct. Source amnesia (a source-monitoring error) is attributing a memory to the wrong source, here to the video instead of the summary.
      - |
        Misinformation effects reflect genuine memory distortion, not deliberate deception; participants usually believe what they report.
      - |
        Correct. In Loftus and Palmer's study, people asked how fast cars were going when they "smashed" gave higher speed estimates than those asked with milder verbs such as "hit" or "contacted".
      - |
        A single laboratory study with an invented scenario cannot estimate the rate of false testimony among all courtroom eyewitnesses.
    answer: [0, 1, 3]
  - slug: appsych-final-q79
    type: true_false
    topic_code: "1.3"
    source: "Original item; AP Psychology CED, Topic 1.3"
    points: 1
    prompt: |
      True or false: The myelin sheath speeds the conduction of action potentials along an axon.
    answer: true
    explanation: |
      True. Myelin is a fatty layer that insulates segments of the axon, so the impulse jumps between the gaps (nodes of Ranvier) and travels much faster. Loss of myelin, as in multiple sclerosis, slows or disrupts neural communication.
  - slug: appsych-final-q80
    type: fill_blank
    topic_code: "1.4"
    source: "Original item; AP Psychology CED, Topic 1.4"
    points: 1
    prompt: |
      Visual information from the eyes is first processed in the primary visual cortex, which lies in the ____ lobe at the back of the brain. (One word.)
    answer: ["occipital"]
    explanation: |
      The occipital lobes, at the back of the cerebral cortex, contain the primary visual cortex. The temporal lobes process sound, the parietal lobes touch and body position, and the frontal lobes planning, judgment and movement.
  - slug: appsych-final-q81
    type: short_answer
    topic_code: "4.3"
    source: "Original item; AP Psychology CED, Topic 4.3"
    points: 3
    prompt: |
      A hypothetical study, invented for this course, tells participants that it is about taste preferences, while the real aim is to see whether they conform to confederates' ratings of a new drink.
      (a) Explain why an institutional review board (IRB) might approve this use of deception.
      (b) Describe what the researchers must do after each session to meet ethical guidelines.
      (c) Identify one way the researchers should protect participants' confidentiality.
    answer: |
      (a) Knowing the real purpose would likely change participants' behavior (they might resist conforming), so the study could not test conformity without deception; the deception is mild, poses minimal risk and no other method would work as well, so its scientific value can justify it.
      (b) Debrief each participant: explain the true purpose and the deception, answer questions, make sure they leave no worse off, and offer them the chance to withdraw their data.
      (c) Store data under code numbers instead of names (or keep identifying information locked and separate) and report only group results.
    explanation: |
      Three points, one per part. (a) 1 point for explaining that the study needs deception because knowing the purpose would change behavior, with minimal risk or no alternative method. (b) 1 point for debriefing: revealing the true purpose and the deception after participation (offering withdrawal of data is a good addition). (c) 1 point for a specific confidentiality safeguard, such as anonymous codes, secure storage or reporting only group results. Naming "informed consent" for (b) earns no point, since consent comes before the study.
  - slug: appsych-final-q82
    type: multi_select
    topic_code: "3.8"
    source: "Original item; AP Psychology CED, Topic 3.8"
    points: 1
    partial_credit: true
    prompt: |
      Which of these are examples of negative reinforcement? Select all that apply.
    options:
      - "A driver buckles her seatbelt to stop the car's warning beep, and on later trips she buckles up sooner."
      - "A student loses phone privileges for breaking curfew and breaks curfew less often."
      - "A man with a headache takes a pain reliever, the pain goes away, and next time he takes the pain reliever sooner."
      - "A dog gets a treat for sitting and sits more often."
      - "A child is scolded for hitting and hits less often."
    option_explanations:
      - |
        Correct. Buckling removes an unpleasant stimulus (the beep), and the behavior increases: negative reinforcement.
      - |
        Taking away something pleasant (phone privileges) to decrease a behavior is negative punishment, not reinforcement.
      - |
        Correct. Taking the pain reliever removes an unpleasant state (the pain), which strengthens the behavior of taking it.
      - |
        Adding something pleasant (a treat) to increase a behavior is positive reinforcement.
      - |
        Adding something unpleasant (a scolding) to decrease a behavior is positive punishment.
    answer: [0, 2]
  - slug: appsych-final-q83
    type: true_false
    topic_code: "2.8"
    source: "Original item; AP Psychology CED, Topic 2.8"
    points: 1
    prompt: |
      True or false: A test can be highly reliable without being valid.
    answer: true
    explanation: |
      True. Reliability is consistency; validity is measuring what the test claims to measure. A test of head circumference used as an intelligence test would give the same results every time (reliable) but would not measure intelligence (not valid). Validity, however, requires reasonable reliability.
  - slug: appsych-final-q84
    type: fill_blank
    topic_code: "3.7"
    source: "Original item; AP Psychology CED, Topic 3.7"
    points: 1
    prompt: |
      In classical conditioning, a previously neutral stimulus that comes to trigger a response after being paired with an unconditioned stimulus is called the conditioned ____. (One word.)
    answer: ["stimulus"]
    explanation: |
      A neutral stimulus (such as a tone) paired repeatedly with an unconditioned stimulus (such as food) becomes a conditioned stimulus, which then triggers a conditioned response (such as salivation) on its own.
  - slug: appsych-final-q85
    type: short_answer
    topic_code: "5.1"
    source: "Original item; AP Psychology CED, Topic 5.1"
    points: 3
    prompt: |
      A hypothetical stress questionnaire, invented for this course, gave these scores (0 to 40) for nine students: 12, 14, 15, 15, 16, 18, 19, 20, 38.
      (a) Calculate the mean and the median.
      (b) State which of the two better describes a typical student in this group, and explain why.
      (c) Identify the mode.
    answer: |
      (a) Mean = 167 ÷ 9 ≈ 18.6. Median = 16 (the fifth of the nine ordered scores).
      (b) The median, because the score of 38 is an outlier that pulls the mean upward; eight of the nine students scored 20 or below, and the median is not affected by the extreme score.
      (c) The mode is 15, the only score that appears twice.
    explanation: |
      Three points. (a) 1 point for both the mean (about 18.6; accept 18.5 to 18.6) and the median (16). (b) 1 point for choosing the median with the reason that the outlier (38) skews the distribution and raises the mean. (c) 1 point for the mode, 15.
  - slug: appsych-final-q86
    type: multi_select
    topic_code: "5.4"
    source: "Original item; AP Psychology CED, Topic 5.4"
    points: 1
    partial_credit: true
    prompt: |
      In the DSM-5-TR, which of these disorders are classified in the chapter on anxiety disorders? Select all that apply.
    options:
      - "Generalized anxiety disorder"
      - "Panic disorder"
      - "Obsessive-compulsive disorder"
      - "Posttraumatic stress disorder"
      - "Specific phobia"
    option_explanations:
      - |
        Correct. Generalized anxiety disorder, persistent and excessive worry about many things, is an anxiety disorder in the DSM-5-TR.
      - |
        Correct. Panic disorder, recurrent unexpected panic attacks with worry about further attacks, is an anxiety disorder.
      - |
        Obsessive-compulsive disorder has its own chapter, obsessive-compulsive and related disorders, separate from the anxiety disorders.
      - |
        Posttraumatic stress disorder is classified with the trauma- and stressor-related disorders, not the anxiety disorders.
      - |
        Correct. A specific phobia, an intense, persistent fear of a particular object or situation, is an anxiety disorder.
    answer: [0, 1, 4]
  - slug: appsych-final-q87
    type: true_false
    topic_code: "4.5"
    source: "Original item; AP Psychology CED, Topic 4.5"
    points: 1
    prompt: |
      True or false: In a hypothetical study, invented for this course, extraversion scores correlate r = −0.60 with hours spent alone and r = +0.40 with number of close friends. The relationship with number of close friends is the stronger of the two.
    answer: false
    explanation: |
      False. The strength of a correlation is shown by its distance from zero, not its sign: |−0.60| = 0.60 is larger than 0.40, so the negative relationship with hours spent alone is the stronger one. The sign shows only the direction.
  - slug: appsych-final-q88
    type: fill_blank
    topic_code: "1.5"
    source: "Original item; AP Psychology CED, Topic 1.5"
    points: 1
    prompt: |
      The roughly 24-hour cycle of alertness, body temperature and hormone release, regulated by the suprachiasmatic nucleus of the hypothalamus, is called the ____ rhythm. (One word.)
    answer: ["circadian"]
    explanation: |
      The circadian rhythm is the body's internal daily clock. The suprachiasmatic nucleus responds to light signals from the eyes and influences the pineal gland's release of melatonin, which promotes sleepiness in the evening.
  - slug: appsych-final-q89
    type: short_answer
    topic_code: "3.1"
    source: "Original item; AP Psychology CED, Topic 3.1"
    points: 3
    prompt: |
      A hypothetical cross-sectional study, invented for this course, finds that 70-year-olds score lower than 30-year-olds on a timed reasoning test taken on a computer.
      (a) Identify one variable other than age that could explain the difference.
      (b) Explain how a longitudinal design would address that problem.
      (c) Describe one drawback of a longitudinal design.
    answer: |
      (a) Familiarity with computers (a cohort difference): the 70-year-olds may have grown up with less computer experience, which would slow them on a computer-based timed test regardless of reasoning ability. Differences in education between generations would also work.
      (b) A longitudinal study tests the same people repeatedly as they age, so each person is compared with themselves and cohort differences such as computer experience or schooling are held constant.
      (c) It takes many years and is costly, and participants drop out over time (attrition), which can bias the remaining sample; repeated testing can also produce practice effects.
    explanation: |
      Three points, one per part. (a) 1 point for a plausible confounding variable linked to the age groups, such as computer familiarity, education or other cohort experiences. (b) 1 point for explaining that following the same individuals over time removes differences between cohorts. (c) 1 point for a drawback: time, cost, attrition or practice effects.
  - slug: appsych-final-q90
    type: true_false
    topic_code: "5.5"
    source: "Original item; AP Psychology CED, Topic 5.5"
    points: 1
    prompt: |
      True or false: In a double-blind drug trial, neither the participants nor the researchers who interact with them know who received the medication and who received the placebo.
    answer: true
    explanation: |
      True. Keeping both participants and researchers unaware of group assignment controls for participants' expectations (the placebo effect) and for experimenter bias in how symptoms are rated or how participants are treated.
  - slug: appsych-final-q91
    type: multi_select
    topic_code: "1.5"
    source: "Original item; AP Psychology CED, Topic 1.5"
    points: 1
    partial_credit: true
    prompt: |
      A hypothetical survey of 300 high school students, invented for this course, found r = −0.48 between minutes of phone use after 10 p.m. and hours of sleep. Which statements are true? Select all that apply.
    options:
      - "Students who used their phones more late at night tended to sleep less."
      - "The survey shows that late-night phone use causes shorter sleep."
      - "A correlation of −0.48 indicates a moderate negative relationship."
      - "Because r is negative, the relationship is weaker than one with r = +0.20."
      - "A third variable, such as homework load, could be related to both phone use and sleep."
    option_explanations:
      - |
        Correct. A negative correlation means that as one variable increases, the other tends to decrease.
      - |
        A survey that measures two variables without manipulating either cannot establish cause and effect.
      - |
        Correct. An r of about 0.5 in size is usually described as a moderate relationship, and the negative sign shows the variables move in opposite directions.
      - |
        Strength depends on distance from zero, not on the sign; 0.48 is farther from zero than 0.20, so this relationship is stronger.
      - |
        Correct. A third variable may influence both measures, which is one reason correlation does not imply causation.
    answer: [0, 2, 4]
