    source: "Original item; AP Psychology CED, Topic 3.9"
    points: 1
    prompt: |
      After repeatedly failing quizzes no matter how much she studied, a student stops studying even in a new class where effort would clearly pay off. Which concept best explains her behavior?
    options:
      - "Spontaneous recovery"
      - "Vicarious reinforcement"
      - "Learned helplessness"
      - "Shaping"
    option_explanations:
      - |
        Spontaneous recovery is the reappearance of an extinguished conditioned response after a pause; she is not showing an old response returning.
      - |
