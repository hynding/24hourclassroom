    points: 1
    prompt: |
      A hypothetical study, invented for this course, trains four groups of pigeons to peck a key under different reinforcement schedules and then stops all reinforcement. Which group will most likely keep pecking the longest?
    options:
      - "The group reinforced after every peck"
      - "The group reinforced for the first peck after every 30 seconds"
      - "The group reinforced after exactly every 10th peck"
      - "The group reinforced after an unpredictable number of pecks averaging 10"
    option_explanations:
      - |
        Continuous reinforcement produces fast learning but quick extinction, because the absence of reward is noticed at once.
      - |
        A fixed-interval schedule produces a pause after each reward and a burst near the end of the interval; it is less resistant to extinction than a variable-ratio schedule.
      - |
        A fixed-ratio schedule yields high rates, but the predictable pattern makes it easier to notice that rewards have stopped.
      - |
        Correct. On a variable-ratio schedule any peck might be the rewarded one, so behavior is highly persistent and most resistant to extinction.
    answer: 3
