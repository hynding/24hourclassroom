        Correct. The DSM-5-TR, published by the American Psychiatric Association, lists symptoms and criteria so different clinicians can classify disorders consistently.
      - |
        The manual is mainly descriptive; it classifies disorders by symptoms and generally does not claim a single cause for each.
      - |
        The DSM-5-TR is a classification system; it does not prescribe treatments.
