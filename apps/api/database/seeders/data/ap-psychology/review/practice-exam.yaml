  # Stimulus set: a hypothetical helping experiment (q52-q54).
  - slug: appsych-final-q52
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; AP Psychology CED, Topic 4.3"
    points: 1
    stimulus: |
      A hypothetical field experiment, invented for this course: in a university library, a research assistant posing as a student "accidentally" dropped a stack of 30 papers beside a table where one student (the participant) was working. On each trial, 1, 3 or 6 other people sat at the table; they were confederates who had been told not to help. The number of confederates was randomly assigned to each trial. Helping was recorded as picking up at least one paper within 10 seconds of the drop. Participants did not know about the study beforehand; afterwards a researcher explained it to each of them and offered to delete their data.

      | Confederates present | Trials | Participants who helped |
      |---|---|---|
      | 1 | 40 | 70% |
      | 3 | 40 | 45% |
      | 6 | 40 | 20% |
    prompt: |
      Which concept best explains the pattern in the results?
    options:
      - "Social facilitation"
      - "Diffusion of responsibility"
      - "Group polarization"
      - "Deindividuation"
    option_explanations:
      - |
        Social facilitation is better performance on simple or well-practised tasks when others are present; it predicts more, not less, action in a group.
      - |
        Correct. The more people present, the less responsible each person feels for helping, so helping drops as the number of bystanders rises: the bystander effect.
      - |
        Group polarization is the strengthening of a group's shared views through discussion; no one discussed anything here.
      - |
        Deindividuation is the loss of self-awareness and restraint in an anonymous group, usually linked to disinhibited behavior, not a failure to help.
    answer: 1
