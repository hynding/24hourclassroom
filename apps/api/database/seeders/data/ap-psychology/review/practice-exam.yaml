    source: "Original item; AP Psychology CED, Topic 4.1"
    points: 1
    prompt: |
      After winning a debate, a student says it was because she is a skilled speaker; after losing the next one, she says the judges were unfair. This pattern is called
    options:
      - "the actor-observer bias"
      - "the false consensus effect"
      - "the self-serving bias"
      - "a self-fulfilling prophecy"
