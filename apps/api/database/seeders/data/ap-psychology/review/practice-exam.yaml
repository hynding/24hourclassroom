    prompt: |
      In Bandura's classic Bobo doll research, children who watched an adult hit and kick an inflatable doll later behaved more aggressively toward the doll than children who had not seen this. Which concept does this research best demonstrate?
    options:
      - "Latent learning"
      - "Observational learning"
      - "Insight learning"
      - "Instinctive drift"
    option_explanations:
      - |
        Latent learning is learning that stays hidden until there is a reason to show it, as in Tolman's maze studies with rats; the Bobo doll research concerns learning by watching.
      - |
