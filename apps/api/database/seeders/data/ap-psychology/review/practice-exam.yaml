week: 34
description: |
  A full practice final: 91 questions · about 3 hours · all five units. Questions 1–77 are a mock AP
  Psychology exam in the May 2027 format. The real exam is on Friday, May 14, 2027 (2027-05-14), and is
  fully digital in the Bluebook app: multiple-choice answers are selected and free responses are typed.
  Section I, questions 1–75, is 75 four-option multiple-choice questions in 1 hour 30 minutes, in roughly
  equal unit shares (14 on Unit 1, 16 on Unit 2, 17 on Unit 3, 15 on Unit 4, 13 on Unit 5; every unit is
  15–25% of the section), and includes seven sets of three or four questions on one shared stimulus (a
  data table, a study summary or a scenario): questions 5–7, 12–14, 19–21, 28–30, 33–35, 52–54 and 70–73.
  Section II, questions 76–77, is two free-response questions in 1 hour 10 minutes, 7 points each:
  question 76 is an Article Analysis Question (AAQ) on one study summary, and question 77 is an
  Evidence-Based Question (EBQ) built on three study summaries. Every study in a stimulus is hypothetical,
  invented for this course. Questions 78–91 (about 30 minutes) are not AP format: select-all, true/false,
  fill-in-the-blank and short-answer practice across all five units, so that the final also rehearses
  every other item type in the course. Multiple choice, select-all and true/false items are graded at
  once; fill-in-the-blank items are matched automatically; the short answers (3 points each) and the two
  free-response questions (7 points each, scored against a point-by-point guide in the AP style) are
  graded by your teacher. As on the AP exam, no calculator is allowed or needed: any arithmetic is simple enough to do by hand.
questions:
  # ---- Section I: multiple choice (q01-q75). Unit 1: q01-q14.
  - slug: appsych-final-q01
    type: multiple_choice
    topic_code: "1.2"
    source: "Original item; AP Psychology CED, Topic 1.2"
    points: 1
    prompt: |
      A cyclist swerves to avoid a car door that suddenly opens. Seconds later her heart is pounding, her breathing is fast and her mouth is dry. Which part of the nervous system is mainly responsible for these changes?
    options:
      - "The somatic nervous system"
      - "The parasympathetic division of the autonomic nervous system"
      - "The sympathetic division of the autonomic nervous system"
      - "The central nervous system's spinal reflex arc alone"
    option_explanations:
      - |
        The somatic system controls voluntary skeletal muscles, such as the steering movement; it does not raise heart rate or dry the mouth.
      - |
        The parasympathetic division calms the body after a threat, slowing the heart and restoring digestion, the opposite of what is described.
      - |
        Correct. The sympathetic division prepares the body for fight or flight: it speeds the heart and breathing and slows salivation and digestion.
      - |
        A spinal reflex can produce a quick withdrawal, but sustained arousal of the heart, lungs and glands is the autonomic system's sympathetic work.
    answer: 2
  - slug: appsych-final-q02
    type: multiple_choice
    topic_code: "1.2"
    source: "Original item; AP Psychology CED, Topic 1.2"
    points: 1
    prompt: |
      A cook touches a hot pan and jerks her hand away before she feels any pain. Which explanation best accounts for the order of these events?
    options:
      - "Sensory neurons carry the signal to the spinal cord, where interneurons trigger motor neurons before the pain message reaches the brain."
      - "The brain's motor cortex decides to move the hand before sensory neurons fire."
      - "Motor neurons carry the heat signal from the skin directly to the brain."
      - "The endocrine system releases hormones that move the hand faster than neurons can."
    option_explanations:
      - |
        Correct. This is a reflex arc: the spinal cord routes the signal from sensory neurons through interneurons to motor neurons, so the hand moves while the message is still travelling up to the brain.
      - |
        The withdrawal does not wait for the brain; in a reflex the spinal cord produces the movement, and the cortex learns of it afterwards.
      - |
        Motor neurons carry messages out to muscles; sensory (afferent) neurons carry information from the skin inward.
      - |
        Hormones travel in the bloodstream and act over seconds to hours, far too slowly for a withdrawal that takes a fraction of a second.
    answer: 0
  - slug: appsych-final-q03
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; AP Psychology CED, Topic 1.3"
    points: 1
    prompt: |
      A medication blocks the reuptake of serotonin into the presynaptic neuron. What is the most direct effect of this action at the synapse?
    options:
      - "Serotonin is broken down faster, so less of it reaches the receptors."
      - "The presynaptic neuron stops producing action potentials."
      - "The drug occupies serotonin receptors and blocks them, acting as an antagonist."
      - "Serotonin remains in the synaptic gap longer, so it can keep binding to receptors on the postsynaptic neuron."
    option_explanations:
      - |
        Blocking reuptake does not speed breakdown; it keeps the neurotransmitter available longer, the opposite of what this option says.
      - |
        Reuptake happens after the neuron has fired; blocking it does not stop the presynaptic neuron from producing action potentials.
      - |
        An antagonist that blocks receptors would reduce serotonin's effect; a reuptake inhibitor works by leaving more serotonin in the synapse instead.
      - |
        Correct. Reuptake normally recycles neurotransmitter into the sending neuron; blocking it leaves serotonin in the synapse longer, increasing its effect.
    answer: 3
  - slug: appsych-final-q04
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; AP Psychology CED, Topic 1.3"
    points: 1
    prompt: |
      In a lab demonstration, a neuron is stimulated first weakly but above its threshold, then much more strongly. Which outcome is consistent with the all-or-none principle?
    options:
      - "The strong stimulus produces action potentials twice as large as the weak one."
      - "Each action potential is the same size, but the strong stimulus makes the neuron fire more often."
      - "The weak stimulus produces a partial action potential that fades halfway down the axon."
      - "Neither stimulus produces an action potential, because neurons fire only when they are at rest."
    option_explanations:
      - |
        Once threshold is reached, an action potential has a fixed size; a stronger stimulus does not make an individual action potential bigger.
      - |
        Correct. A neuron either fires completely or not at all; stimulus intensity is signalled by how frequently it fires and by how many neurons fire.
      - |
        A stimulus above threshold triggers a full action potential that travels the length of the axon without fading.
      - |
        Both stimuli are above threshold, so both trigger action potentials; the resting state is when the neuron is ready to fire, not the only time it can.
    answer: 1
  # Stimulus set: a hypothetical family study (q05-q07).
  - slug: appsych-final-q05
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; AP Psychology CED, Topic 1.1"
    points: 1
    stimulus: |
      A research team (a hypothetical study, invented for this course) measured sensation seeking with a 40-item questionnaire in pairs of relatives and computed the correlation between the two members' scores for each kind of pair.

      | Pair type | Number of pairs | Correlation (r) |
      |---|---|---|
      | Identical twins raised together | 210 | +0.62 |
      | Identical twins raised apart | 48 | +0.57 |
      | Fraternal twins raised together | 195 | +0.31 |
      | Biological siblings raised together | 260 | +0.27 |
      | Adoptive siblings raised together | 120 | +0.06 |
    prompt: |
      Which conclusion is best supported by the data?
    options:
      - "Growing up in the same household explains most of the similarity in sensation seeking between relatives."
      - "Genetic relatedness is associated with similarity in sensation seeking."
      - "Sensation seeking is determined entirely by genes."
      - "Fraternal twins are more alike in sensation seeking than identical twins."
    option_explanations:
      - |
        Adoptive siblings share a household but not genes, and their correlation is close to zero (+0.06), so a shared home explains little of the similarity here.
      - |
        Correct. The more genes a pair shares, the higher the correlation: identical twins (about +0.6) are more alike than fraternal twins or siblings (about +0.3), who are more alike than adoptive siblings (about 0).
      - |
        Even identical twins correlate only +0.62, well short of +1.00, so environment and measurement error also matter; a heritability pattern never means "entirely".
      - |
        The fraternal-twin correlation (+0.31) is about half the identical-twin correlation (+0.62), so identical twins are the more alike.
    answer: 1
  - slug: appsych-final-q06
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; AP Psychology CED, Topic 1.1"
    points: 1
    stimulus: |
      A research team (a hypothetical study, invented for this course) measured sensation seeking with a 40-item questionnaire in pairs of relatives and computed the correlation between the two members' scores for each kind of pair.

      | Pair type | Number of pairs | Correlation (r) |
      |---|---|---|
      | Identical twins raised together | 210 | +0.62 |
      | Identical twins raised apart | 48 | +0.57 |
      | Fraternal twins raised together | 195 | +0.31 |
      | Biological siblings raised together | 260 | +0.27 |
      | Adoptive siblings raised together | 120 | +0.06 |
    prompt: |
      Identical twins raised together correlate +0.62, not +1.00. What does this most likely indicate?
    options:
      - "The questionnaire cannot measure sensation seeking at all."
      - "Identical twins share only about half of their genes."
      - "Sensation seeking has no genetic basis."
      - "Experiences the twins do not share, along with measurement error, also contribute to differences in their scores."
    option_explanations:
      - |
        A correlation of +0.62 shows the questionnaire captures something consistent; imperfect reliability can lower a correlation but does not mean the test measures nothing.
      - |
        Identical (monozygotic) twins come from one fertilized egg and share essentially all their genes; fraternal twins share about half.
      - |
        The pattern across pair types (higher correlations with more shared genes) points to a genetic contribution, so "no genetic basis" contradicts the data.
      - |
        Correct. If genes alone determined the trait, identical twins would match perfectly; non-shared environment (different friends, experiences) and error in measurement lower the correlation.
    answer: 3
  - slug: appsych-final-q07
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; AP Psychology CED, Topic 1.1"
    points: 1
    stimulus: |
      A research team (a hypothetical study, invented for this course) measured sensation seeking with a 40-item questionnaire in pairs of relatives and computed the correlation between the two members' scores for each kind of pair.

      | Pair type | Number of pairs | Correlation (r) |
      |---|---|---|
      | Identical twins raised together | 210 | +0.62 |
      | Identical twins raised apart | 48 | +0.57 |
      | Fraternal twins raised together | 195 | +0.31 |
      | Biological siblings raised together | 260 | +0.27 |
      | Adoptive siblings raised together | 120 | +0.06 |
    prompt: |
      Why can these data alone not establish that particular genes cause high sensation seeking?
    options:
      - "The study is correlational: kinship was not assigned by the researchers, and other differences between kinds of pairs, such as how alike they are treated, could contribute to the pattern."
      - "The samples are too large for a correlation to be meaningful."
      - "Correlation coefficients can be calculated only from experiments with random assignment."
      - "A positive correlation means that one twin's score causes the other twin's score."
    option_explanations:
      - |
        Correct. Twin and adoption studies compare naturally occurring groups; they estimate how much variation is linked to genetic relatedness but do not identify specific genes or rule out environmental differences between pair types.
      - |
        Larger samples make correlations more stable, not less meaningful; sample size is not the reason causal conclusions are limited.
      - |
        Correlations can be computed from any paired measurements, including surveys and observational studies like this one.
      - |
        A correlation describes how two sets of scores vary together; it never shows that one person's score causes another's.
    answer: 0
  - slug: appsych-final-q08
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; AP Psychology CED, Topic 1.4"
    points: 1
    prompt: |
      After a stroke, a patient understands spoken questions and follows instructions, but speaks slowly in short, effortful phrases that leave out small words. Damage to which area is most likely?
    options:
      - "Wernicke's area in the temporal lobe"
      - "The occipital lobe"
      - "Broca's area in the frontal lobe"
      - "The cerebellum"
    option_explanations:
      - |
        Damage to Wernicke's area typically impairs comprehension, with fluent speech that makes little sense; this patient understands well.
      - |
        The occipital lobe processes vision; damage there causes visual problems, not effortful speech.
      - |
        Correct. Broca's area, usually in the left frontal lobe, supports speech production; damage leaves comprehension largely intact but makes speech slow and halting.
      - |
        The cerebellum coordinates movement and balance; damage can slur speech, but the pattern of intact comprehension with missing small words points to Broca's area.
    answer: 2
  - slug: appsych-final-q09
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; AP Psychology CED, Topic 1.4"
    points: 1
    prompt: |
      A person whose corpus callosum has been surgically cut stares at a dot while the word KEY is flashed briefly to the left of the dot (the left visual field). What is the most likely result?
    options:
      - "She cannot say what she saw, but she can pick out a key by touch with her left hand."
      - "She can say 'key' aloud but cannot pick out a key with either hand."
      - "She can both say 'key' and pick it out with her right hand."
      - "She sees nothing, because the left visual field goes to no hemisphere."
    option_explanations:
      - |
        Correct. The left visual field projects to the right hemisphere, which controls the left hand; with the corpus callosum cut, the information cannot reach the left hemisphere's language areas, so she cannot name it.
      - |
        Naming requires the left hemisphere's language areas, which do not receive the word when it appears only in the left visual field and the hemispheres cannot communicate.
      - |
        The right hand is controlled by the left hemisphere, which did not see the word; she could neither name it nor reliably pick it out with that hand.
      - |
        Each visual field projects to the opposite hemisphere; the left visual field goes to the right hemisphere, so the word is seen, just not named.
    answer: 0
  - slug: appsych-final-q10
    type: multiple_choice
    topic_code: "1.5"
    source: "Original item; AP Psychology CED, Topic 1.5"
    points: 1
    prompt: |
      In a sleep lab, a participant's EEG shows large, slow delta waves, and he is hard to wake. Later that night he walks around the room without remembering it in the morning. Which statement best fits these observations?
    options:
      - "Both observations come from REM sleep, when the body's muscles are most active."
      - "The delta waves show he is in stage N1, the lightest stage of sleep."
      - "Delta waves mark N3 (deep sleep), the stage in which sleepwalking usually occurs."
      - "Sleepwalking shows he has narcolepsy, which begins in delta-wave sleep."
    option_explanations:
      - |
        During REM sleep the major voluntary muscles are largely paralyzed, and the EEG looks like waking activity, not slow delta waves; sleepwalking occurs outside REM.
      - |
        N1 is the light transition into sleep, with theta waves and easy waking; large, slow delta waves and difficulty waking mark N3.
      - |
        Correct. Deep N3 sleep is dominated by delta waves and the sleeper is hard to rouse; sleepwalking and night terrors typically happen in this stage.
      - |
        Narcolepsy involves sudden sleep attacks with a quick entry into REM sleep; sleepwalking alone does not indicate it.
    answer: 2
  - slug: appsych-final-q11
    type: multiple_choice
    topic_code: "1.5"
    source: "Original item; AP Psychology CED, Topic 1.5"
    points: 1
    prompt: |
      A hypothetical survey of 500 teenagers, invented for this course, finds a correlation of r = −0.35 between minutes spent on a screen in bed and minutes of sleep. Which interpretation is most appropriate?
    options:
      - "Screen use in bed causes teenagers to lose about 35 minutes of sleep."
      - "Teens who use screens longer in bed tend to sleep somewhat less, but other variables could explain the relationship."
      - "There is no meaningful relationship, because the correlation is negative."
      - "About 35% of teens who use screens in bed sleep less than teens who do not."
    option_explanations:
      - |
        A correlation is not a number of minutes and does not show causation; the survey assigned no treatment.
      - |
        Correct. A negative r means higher screen time goes with less sleep; −0.35 is a modest relationship, and a third variable (such as stress or homework) could affect both.
      - |
        The sign shows direction, not strength; −0.35 indicates a modest relationship in which the variables move in opposite directions.
      - |
        r is not a percentage of people; it summarizes the direction and strength of the linear relationship across the whole sample.
    answer: 1
  # Stimulus set: a hypothetical listening study (q12-q14).
  - slug: appsych-final-q12
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; AP Psychology CED, Topic 1.6"
    points: 1
    stimulus: |
      In a hypothetical listening study, invented for this course, participants wore headphones playing steady background noise and pressed a key whenever they thought they heard a faint tone. A tone was present on half of 200 trials. The table gives each participant's hit rate (the percentage of tone trials answered "yes") and false-alarm rate (the percentage of no-tone trials answered "yes").

      | Participant | Hits | False alarms |
      |---|---|---|
      | P1 | 90% | 45% |
      | P2 | 60% | 5% |
      | P3 | 85% | 10% |
    prompt: |
      Which statement best describes P1's responses?
    options:
      - "P1 detects the tone best, because P1 has the most hits."
      - "P1 used a strict criterion, answering 'yes' only when certain."
      - "P1 never actually heard the tone."
      - "P1 used a liberal criterion, often answering 'yes' even when no tone was played."
    option_explanations:
      - |
        Hits alone do not measure sensitivity; P1 also says "yes" on nearly half of the no-tone trials, so P1 separates tone from noise poorly.
      - |
        A strict criterion produces few false alarms; P1's 45% false-alarm rate shows the opposite.
      - |
        A 90% hit rate is well above P1's false-alarm rate, so P1 heard the tone on some trials; the problem is many "yes" answers to noise.
      - |
        Correct. In signal detection theory, a high false-alarm rate alongside a high hit rate reflects a liberal response criterion, a readiness to report a signal.
    answer: 3
  - slug: appsych-final-q13
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; AP Psychology CED, Topic 1.6"
    points: 1
    stimulus: |
      In a hypothetical listening study, invented for this course, participants wore headphones playing steady background noise and pressed a key whenever they thought they heard a faint tone. A tone was present on half of 200 trials. The table gives each participant's hit rate (the percentage of tone trials answered "yes") and false-alarm rate (the percentage of no-tone trials answered "yes").

      | Participant | Hits | False alarms |
      |---|---|---|
      | P1 | 90% | 45% |
      | P2 | 60% | 5% |
      | P3 | 85% | 10% |
    prompt: |
      Which participant shows the greatest sensitivity, the best ability to tell the tone from the noise?
    options:
      - "P1"
      - "P2"
      - "P1 and P2 equally"
      - "P3"
    option_explanations:
      - |
        P1's hits (90%) are high, but so are false alarms (45%), a gap of only 45 points between "yes" to tones and "yes" to noise.
      - |
        P2 rarely false-alarms (5%) but also misses 40% of tones; the gap between hits and false alarms is 55 points, smaller than P3's.
      - |
        The two participants differ in both rates, and neither matches P3's combination of many hits and few false alarms.
      - |
        Correct. P3 says "yes" to 85% of tones but only 10% of noise trials, the largest separation (75 points) between hits and false alarms.
    answer: 3
  - slug: appsych-final-q14
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; AP Psychology CED, Topic 1.6"
    points: 1
    stimulus: |
      In a hypothetical listening study, invented for this course, participants wore headphones playing steady background noise and pressed a key whenever they thought they heard a faint tone. A tone was present on half of 200 trials. The table gives each participant's hit rate (the percentage of tone trials answered "yes") and false-alarm rate (the percentage of no-tone trials answered "yes").

      | Participant | Hits | False alarms |
      |---|---|---|
      | P1 | 90% | 45% |
      | P2 | 60% | 5% |
      | P3 | 85% | 10% |
    prompt: |
      In a second session, participants earn a bonus for every tone they report and lose nothing for false alarms. According to signal detection theory, what is the most likely change?
    options:
      - "Their absolute thresholds fall, so they physically hear quieter tones."
      - "Both hits and false alarms rise, because the reward shifts participants toward a more liberal criterion."
      - "False alarms drop to zero, because participants become more careful."
      - "Sensory adaptation makes the tone impossible to hear."
    option_explanations:
      - |
        A reward changes the decision about when to say "yes", not the sensitivity of the ear; the absolute threshold reflects sensory ability under fixed conditions.
      - |
        Correct. Signal detection theory says expectations and payoffs shift the response criterion: rewarding hits with no cost for false alarms makes people say "yes" more often.
      - |
        With no penalty for false alarms, participants have every reason to say "yes" more, so false alarms rise rather than fall.
      - |
        Sensory adaptation reduces response to an unchanging stimulus; a brief, intermittent tone is not affected that way, and the payoff has nothing to do with adaptation.
    answer: 1
  # ---- Unit 2: q15-q30.
  - slug: appsych-final-q15
    type: multiple_choice
    topic_code: "2.1"
    source: "Original item; AP Psychology CED, Topic 2.1"
    points: 1
    prompt: |
      Students who first look at several pictures of animals are more likely to see an ambiguous drawing as a rabbit, while students who first look at pictures of birds tend to see the same drawing as a duck. This best illustrates which concept?
    options:
      - "Bottom-up processing"
      - "Sensory adaptation"
      - "Perceptual set, a form of top-down processing"
      - "Retinal disparity"
    option_explanations:
      - |
        Bottom-up processing builds perception from the raw features of the stimulus; here the stimulus is identical, and what changes is the viewers' expectations.
      - |
        Sensory adaptation is reduced sensitivity to an unchanging stimulus; it does not explain why earlier pictures change the interpretation.
      - |
        Correct. Earlier experiences create a perceptual set, an expectation that guides how ambiguous input is interpreted: top-down processing.
      - |
        Retinal disparity is a binocular depth cue based on the difference between the two eyes' images; it is unrelated to interpreting an ambiguous figure.
    answer: 2
  - slug: appsych-final-q16
    type: multiple_choice
    topic_code: "2.1"
    source: "Original item; AP Psychology CED, Topic 2.1"
    points: 1
    prompt: |
      A person who has lost the sight of one eye still judges that a distant tree is farther away than a nearby fence because the fence partly blocks the view of the tree. Which depth cue is she using?
    options:
      - "Interposition, a monocular cue"
      - "Retinal disparity, a binocular cue"
      - "Convergence, a binocular cue"
      - "The phi phenomenon"
    option_explanations:
      - |
        Correct. Interposition (overlap) is a monocular cue: an object that blocks part of another is seen as closer, and it works with one eye.
      - |
        Retinal disparity compares the two eyes' slightly different images, so it is unavailable to someone with sight in only one eye.
      - |
        Convergence relies on the inward turning of both eyes for near objects; it requires two working eyes.
      - |
        The phi phenomenon is an illusion of movement created by lights flashing in sequence, not a cue for depth.
    answer: 0
  - slug: appsych-final-q17
    type: multiple_choice
    topic_code: "2.2"
    source: "Original item; AP Psychology CED, Topic 2.2"
    points: 1
    prompt: |
      After seeing several news reports about plane crashes, a family decides to drive 900 miles rather than fly, even though driving is statistically far riskier per mile. Which concept best explains their choice?
    options:
      - "The representativeness heuristic"
      - "Functional fixedness"
      - "The availability heuristic"
      - "An algorithm"
    option_explanations:
      - |
        Representativeness is judging likelihood by how well something matches a prototype; the family is judging risk by how easily vivid examples come to mind.
      - |
        Functional fixedness is seeing objects only in their usual use; it does not concern estimating risk.
      - |
        Correct. Vivid, recent events are easy to recall, so people overestimate their likelihood; the availability heuristic distorts the family's risk judgment.
      - |
        An algorithm is a step-by-step procedure that guarantees a solution; comparing actual accident rates would be closer to an algorithm than this choice was.
    answer: 2
  - slug: appsych-final-q18
    type: multiple_choice
    topic_code: "2.2"
    source: "Original item; AP Psychology CED, Topic 2.2"
    points: 1
    prompt: |
      Needing to hold a door open, a student searches the room for a doorstop and never thinks of using his heavy textbook, even though it is in his hand. This is an example of which obstacle to problem solving?
    options:
      - "Functional fixedness"
      - "Confirmation bias"
      - "Belief perseverance"
      - "The framing effect"
    option_explanations:
      - |
        Correct. Functional fixedness is the tendency to think of objects only in terms of their usual function, so a textbook is not seen as a doorstop.
      - |
        Confirmation bias is seeking evidence that supports what we already believe; the student is not testing a belief.
      - |
        Belief perseverance is clinging to a belief after the evidence for it has been discredited; no belief is being defended here.
      - |
        The framing effect is the way the wording of a choice changes decisions; nothing here is worded or framed.
    answer: 0
  # Stimulus set: a hypothetical depth-of-processing experiment (q19-q21).
  - slug: appsych-final-q19
    type: multiple_choice
    topic_code: "2.4"
    source: "Original item; AP Psychology CED, Topic 2.4"
    points: 1
    stimulus: |
      In a hypothetical experiment, invented for this course, 90 volunteers were randomly assigned to three groups and shown the same 40 words, one at a time. The structural group judged whether each word was printed in capital letters, the phonemic group judged whether it rhymed with a given word, and the semantic group judged whether it fit into a given sentence. No one was told there would be a memory test. Free recall was tested 10 minutes later and again one week later.

      | Group | Mean words recalled at 10 minutes (SD) | Mean words recalled after one week (SD) |
      |---|---|---|
      | Structural | 6.1 (2.0) | 2.3 (1.4) |
      | Phonemic | 9.4 (2.6) | 3.9 (1.8) |
      | Semantic | 15.8 (3.1) | 8.7 (2.9) |
    prompt: |
      What is the independent variable that the researchers randomly assigned?
    options:
      - "The number of words recalled"
      - "The list of 40 words"
      - "The delay before the recall test"
      - "The kind of judgment made about each word"
    option_explanations:
      - |
        The number of words recalled is what the researchers measured: the dependent variable.
      - |
        Every group saw the same 40 words, so the list is held constant (a controlled variable), not manipulated.
      - |
        Every participant was tested at both delays, so delay was not randomly assigned between groups; it is a within-subjects factor.
      - |
        Correct. Each participant was randomly placed in one of three judgment conditions (structural, phonemic, semantic), which manipulates the depth of processing.
    answer: 3
  - slug: appsych-final-q20
    type: multiple_choice
    topic_code: "2.4"
    source: "Original item; AP Psychology CED, Topic 2.4"
    points: 1
    stimulus: |
      In a hypothetical experiment, invented for this course, 90 volunteers were randomly assigned to three groups and shown the same 40 words, one at a time. The structural group judged whether each word was printed in capital letters, the phonemic group judged whether it rhymed with a given word, and the semantic group judged whether it fit into a given sentence. No one was told there would be a memory test. Free recall was tested 10 minutes later and again one week later.

      | Group | Mean words recalled at 10 minutes (SD) | Mean words recalled after one week (SD) |
      |---|---|---|
      | Structural | 6.1 (2.0) | 2.3 (1.4) |
      | Phonemic | 9.4 (2.6) | 3.9 (1.8) |
      | Semantic | 15.8 (3.1) | 8.7 (2.9) |
    prompt: |
      Which explanation best accounts for the semantic group's higher recall?
    options:
      - "The semantic group expected a test and so rehearsed the words more."
      - "Thinking about each word's meaning is deeper processing, which forms more elaborate, better-connected memories."
      - "The semantic group's words stayed in sensory memory for a full week."
      - "The structural group's short-term memory was full after seven words."
    option_explanations:
      - |
        No group was told about the test, so this was incidental learning; differences in deliberate rehearsal for an expected test cannot explain the result.
      - |
        Correct. The levels-of-processing idea holds that encoding meaning (semantic processing) links new items to existing knowledge, so they are better remembered than items processed only for appearance or sound.
      - |
        Sensory memory lasts only a fraction of a second to a few seconds; recall a week later depends on long-term memory.
      - |
        All groups saw words one at a time, and the structural group still averaged about six words; short-term capacity does not explain why judging meaning helps.
    answer: 1
