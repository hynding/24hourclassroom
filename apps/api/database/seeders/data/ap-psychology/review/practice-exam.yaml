    points: 1
    prompt: |
      Participants hear a list of 15 words and immediately write down as many as they can, in any order. They recall the last few words best. Which explanation fits this recency effect?
    options:
      - "The last words have been rehearsed the most and moved into long-term memory."
      - "The last words are still in short-term memory when recall begins."
      - "The last words were encoded semantically and the first words were not."
      - "The last words cause retroactive interference with the middle words only."
    option_explanations:
      - |
        Extra rehearsal and transfer to long-term memory explain the primacy effect for the first words; the last words had the least time to be rehearsed.
      - |
        Correct. With immediate recall, the most recent items are still active in short-term memory and can be reported first; a delay before recall usually removes the recency effect.
      - |
        Nothing in the procedure makes the last words more meaningful than the first; the recency effect depends on timing.
      - |
        Interference may hurt middle items, but it does not explain why the last items themselves are recalled so well.
    answer: 1
  # Stimulus set: a hypothetical new reasoning test (q28-q30).
  - slug: appsych-final-q28
    type: multiple_choice
    topic_code: "2.8"
    source: "Original item; AP Psychology CED, Topic 2.8"
    points: 1
    stimulus: |
      A school district (hypothetical, invented for this course) pilots a new 30-minute reasoning test. Scores were standardized on a large, representative sample to a mean of 100 and a standard deviation of 15, and they are roughly normally distributed. The developers report three findings:
      - 200 students took the test twice, four weeks apart; the correlation between their two scores was r = +0.89.
      - For 500 students, the correlation between test score and end-of-year grade point average was r = +0.42.
      - Students tested in a hot, noisy gym scored, on average, 6 points lower than students tested in quiet classrooms.
    prompt: |
      The correlation of +0.89 between the two testings is evidence of the test's
    options:
      - "predictive validity"
      - "content validity"
      - "standardization"
      - "test-retest reliability"
    option_explanations:
      - |
        Predictive validity is how well scores forecast a later outcome, such as grades; that is the +0.42 finding, not the retest correlation.
      - |
        Content validity is whether the items sample the full range of the ability being measured; a retest correlation says nothing about item content.
      - |
        Standardization is giving and scoring a test the same way and comparing scores with a norm group; consistency across two testings is a separate property.
      - |
        Correct. A high correlation between scores from the same people on two occasions shows the test gives consistent results: test-retest reliability.
    answer: 3
  - slug: appsych-final-q29
    type: multiple_choice
    topic_code: "2.8"
    source: "Original item; AP Psychology CED, Topic 2.8"
    points: 1
    stimulus: |
      A school district (hypothetical, invented for this course) pilots a new 30-minute reasoning test. Scores were standardized on a large, representative sample to a mean of 100 and a standard deviation of 15, and they are roughly normally distributed. The developers report three findings:
      - 200 students took the test twice, four weeks apart; the correlation between their two scores was r = +0.89.
      - For 500 students, the correlation between test score and end-of-year grade point average was r = +0.42.
