    type: multiple_choice
    topic_code: "3.2"
    source: "Original item; AP Psychology CED, Topic 3.2"
    points: 1
    prompt: |
      Which statement about brain development in adolescence is most accurate?
    options:
      - "The prefrontal cortex, involved in planning and impulse control, is among the last areas to finish maturing, into the early or mid-twenties."
      - "The brain stops forming and pruning connections at puberty."
      - "The limbic system matures last, which is why adolescents show little emotion."
      - "Myelination is complete by age five."
    option_explanations:
      - |
        Correct. Frontal regions continue developing (including myelination and synaptic pruning) into early adulthood, which helps explain why planning and impulse control keep improving through adolescence.
      - |
        Pruning of unused connections is especially active in adolescence and plasticity continues throughout life; it does not stop at puberty.
      - |
        Emotion-related limbic areas develop earlier than the prefrontal cortex; the gap between them is often linked to adolescents' emotional intensity, not to a lack of emotion.
      - |
        Myelination continues for many years, especially in frontal areas, well into adolescence and early adulthood.
    answer: 0
