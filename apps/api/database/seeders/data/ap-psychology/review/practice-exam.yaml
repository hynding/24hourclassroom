      Children who loved drawing are paid a dollar for each drawing for two weeks. When the payments stop, they draw less than they did before payments began. Which concept best explains this?
    options:
      - "Homeostasis"
      - "The Yerkes-Dodson law"
      - "Approach-approach conflict"
