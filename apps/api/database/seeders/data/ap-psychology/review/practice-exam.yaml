    prompt: |
      About what percentage of the standardization sample scored between 85 and 115?
    options:
      - "About 95%"
      - "About 50%"
      - "About 34%"
      - "About 68%"
    option_explanations:
      - |
        About 95% of a normal distribution lies within two standard deviations of the mean, from 70 to 130, not from 85 to 115.
      - |
        Half the scores lie on each side of the mean; the band from 85 to 115 covers more than half.
      - |
        About 34% lies between the mean and one standard deviation on one side (100 to 115); the question spans both sides.
      - |
        Correct. 85 and 115 are one standard deviation below and above the mean, and about 68% of a normal distribution lies within one standard deviation of the mean.
    answer: 3
  - slug: appsych-final-q30
    type: multiple_choice
    topic_code: "2.8"
    source: "Original item; AP Psychology CED, Topic 2.8"
    points: 1
    stimulus: |
      A school district (hypothetical, invented for this course) pilots a new 30-minute reasoning test. Scores were standardized on a large, representative sample to a mean of 100 and a standard deviation of 15, and they are roughly normally distributed. The developers report three findings:
      - 200 students took the test twice, four weeks apart; the correlation between their two scores was r = +0.89.
      - For 500 students, the correlation between test score and end-of-year grade point average was r = +0.42.
      - Students tested in a hot, noisy gym scored, on average, 6 points lower than students tested in quiet classrooms.
    prompt: |
      What does the 6-point gap between the gym and the classrooms most directly suggest?
    options:
      - "The test has strong construct validity."
      - "The testing conditions were not standardized, so differences in conditions, not only ability, may explain some score differences."
      - "Students who were tested in the gym have lower intelligence."
      - "The Flynn effect is raising scores in quiet classrooms."
    option_explanations:
      - |
        Construct validity is whether the test measures the intended ability; a gap caused by noise and heat is a threat to fair measurement, not evidence for it.
      - |
        Correct. Standardized tests are meant to be given under uniform conditions; a gap linked to the room shows conditions affected scores, so comparisons across rooms are unfair.
      - |
        Students were not randomly assigned to rooms, and a hot, noisy room plausibly lowers performance itself; the gap cannot be read as a difference in ability.
      - |
        The Flynn effect is the rise in average raw intelligence-test scores across generations; it has nothing to do with rooms on one test day.
    answer: 1
