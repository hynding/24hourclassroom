    prompt: |
      A hiker's heart pounds after a steep climb. Seeing a bear on the trail, she interprets the arousal as fear; at the summit, seeing a breathtaking view, she interprets similar arousal as excitement. Which theory of emotion best fits this account?
    options:
      - "The James-Lange theory"
      - "The Cannon-Bard theory"
      - "The facial feedback hypothesis"
      - "The Schachter-Singer two-factor theory"
    option_explanations:
