    stimulus: |
      In a hypothetical study, invented for this course, researchers tested 40 children at each of four ages, all from the same city, during the same month. Each child watched water being poured from a short, wide glass into a tall, thin glass and was asked whether the amount of water had changed. The table gives the percentage in each age group who said the amount was the same and explained why.

      | Age | Children | Correct answer with a reason |
      |---|---|---|
      | 4 years | 40 | 10% |
      | 6 years | 40 | 35% |
      | 8 years | 40 | 80% |
      | 10 years | 40 | 95% |
    prompt: |
      Which research design did the researchers use?
    options:
      - "A longitudinal design"
      - "A case study"
      - "A cross-sectional design"
      - "An experiment in which age was randomly assigned"
    option_explanations:
      - |
        A longitudinal design follows the same people over time; here, different children of different ages were tested once.
      - |
        A case study examines one person or a small group in depth; this study compares 160 children across four groups.
      - |
        Correct. Comparing different age groups at a single point in time is a cross-sectional design.
      - |
        Age cannot be randomly assigned; it is a participant characteristic, so age comparisons are not true experiments.
