  - slug: alg2-final-q66
    type: multiple_choice
    topic_code: "7.2"
    source: "IM Algebra 2, Unit 7, Lesson 2"
    points: 1
    prompt: |
      A researcher wants to know whether a new fertilizer increases tomato yield. She randomly assigns 40 plants to receive the fertilizer and 40 plants to receive none, then compares the yields. What kind of study is this, and what does it allow her to conclude?
    options:
      - "A sample survey; she can generalize to all tomato plants but not claim causation"
      - "An observational study; she can describe an association but cannot claim the fertilizer caused it"
      - "An experiment; but because only 80 plants were used, nothing can be concluded"
      - "An experiment; because the treatment was randomly assigned, a large difference can be attributed to the fertilizer"
    option_explanations:
      - |
        A survey collects responses from a sample of a population; no treatment is given. Random assignment of a treatment is the hallmark of an experiment.
      - |
        An observational study records what already happens without assigning a treatment. Here the researcher chose at random which plants got fertilizer, so this is an experiment.
      - |
        Sample size affects how large a difference must be to stand out from chance, but 80 randomly assigned plants is a perfectly usable experiment.
      - |
        Correct. The researcher imposed the treatment and assigned it at random, which balances other influences between the groups; a difference larger than random assignment alone would produce supports a causal claim.
    answer: 3
  - slug: alg2-final-q67
    type: true_false
    topic_code: "7.10"
    source: "IM Algebra 2, Unit 7, Lesson 10"
    points: 1
    prompt: |
      True or false: in this course, the margin of error for an estimate is taken to be twice the standard deviation of the sample statistics from many random samples of the same size, so that about 95% of such samples give a statistic within the margin of error of the population value.
    answer: true
    explanation: |
      True. The sample proportions (or means) from repeated random samples are approximately normal, and about 95% of a normal distribution lies within two standard deviations of its center, which is the population value.
  - slug: alg2-final-q68
    type: numeric
    topic_code: "7.11"
    source: "IM Algebra 2, Unit 7, Lesson 11"
    points: 1
    prompt: |
      Random samples of 100 students give sample proportions whose margin of error is 0.12. If the sample size is increased to 400 students, what is the new margin of error? Give your answer as a decimal to two places.
    answer: { value: 0.06, tolerance: 0.005 }
    explanation: |
      The standard deviation of sample proportions shrinks in proportion to the square root of the sample size. Quadrupling the sample size (100 → 400) multiplies the spread by 1/√4 = 1/2, so the margin of error halves from 0.12 to 0.06.
