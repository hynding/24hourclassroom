  - slug: alg2-final-q60
    type: multi_select
    topic_code: "6.14"
    source: "IM Algebra 2, Unit 6, Lesson 14"
    points: 2
    partial_credit: true
    prompt: |
      Consider the function g(θ) = −4 sin(3θ) + 2. Which statements about its graph are true? Select all that apply.
    options:
      - "Its maximum value is 4"
      - "Its period is 2π/3"
      - "At θ = 0 the graph is at its minimum"
      - "Its midline is y = 2"
      - "Its amplitude is 4"
    option_explanations:
      - |
        The maximum is midline plus amplitude, 2 + 4 = 6, not 4.
      - |
        Correct. Multiplying θ by 3 compresses the period from 2π to 2π/3.
      - |
        At θ = 0, sin(0) = 0, so g(0) = 2, the midline value; the graph is falling through the midline there because of the negative coefficient, not at its minimum.
      - |
        Correct. The constant +2 raises the midline from y = 0 to y = 2.
      - |
        Correct. The amplitude is the absolute value of the coefficient of the sine, |−4| = 4; the sign only reflects the graph.
    answer: [1, 3, 4]
  - slug: alg2-final-q61
    type: true_false
    topic_code: "6.17"
    source: "IM Algebra 2, Unit 6, Lesson 17"
