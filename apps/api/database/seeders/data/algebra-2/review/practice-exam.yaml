  - slug: alg2-final-q70
    type: long_answer
    topic_code: "7.14"
    source: "IM Algebra 2, Unit 7, Lesson 14"
    points: 6
    prompt: |
      Thirty volunteers with mild headaches were randomly assigned to two groups of 15. One group took a new pain reliever and the other took a placebo pill that looked identical; neither the volunteers nor the nurse recording results knew who had which. After an hour each person rated their pain relief on a 0–10 scale. The treatment group's mean rating was 6.4 and the placebo group's was 4.6, a difference of 1.8. The researchers then re-randomized the 30 ratings into two groups of 15 many times with a computer and recorded the difference in means each time; those differences were approximately normal with mean 0 and standard deviation 1.1.
      Write a full response that (1) explains why this is an experiment and what the random assignment, the placebo and the blinding each accomplish, (2) explains what the re-randomization distribution represents, (3) uses the standard deviation of 1.1 to decide whether the observed difference of 1.8 is unusual enough to attribute to the pain reliever, showing your reasoning, and (4) states the conclusion carefully, including one limitation of the study.
    answer: |
      (1) It is an experiment because the researchers imposed a treatment and chose at random who received it. Random assignment spreads other influences (age, headache severity, expectations) evenly across the groups so that the only systematic difference is the pill. The placebo makes the two groups' experiences identical except for the active ingredient, so any difference is not just the effect of taking a pill. Blinding both the volunteers and the nurse keeps expectations from shaping the ratings or the recording.
      (2) The re-randomization distribution shows what differences in means arise from the random grouping alone when the treatment has no effect: if the pill did nothing, the 30 ratings would be the same whichever group each person landed in, so shuffling them into two groups of 15 shows the spread of differences that chance alone produces. It is centered at 0 with standard deviation 1.1.
      (3) The observed difference of 1.8 is 1.8/1.1 ≈ 1.6 standard deviations above 0. Using the usual cutoff of about two standard deviations (roughly the middle 95% of a normal distribution), 1.8 is inside the range that random assignment alone could produce fairly often (a difference at least this large in either direction would occur in roughly 10% of random groupings). So the result is suggestive but not strong enough to attribute to the pain reliever.
      (4) Conclusion: the treatment group reported more relief on average, but the difference is not large enough, compared with the variation from random assignment, to rule out chance; the study does not establish that the pain reliever works better than a placebo. Limitations: only 15 people per group gives a wide chance distribution, so a real but modest effect could easily be missed; the volunteers were self-selected with mild headaches, so the result may not generalize; self-reported pain ratings are subjective.
    explanation: |
      Six points: 1 for identifying an experiment with the roles of random assignment, placebo and blinding in (1); 1 for explaining the re-randomization distribution as the chance-only differences in (2); 2 for comparing 1.8 with 1.1 (about 1.6 standard deviations, under the two-standard-deviation cutoff) and concluding that chance is not ruled out in (3); 2 for a carefully worded conclusion that does not overclaim plus at least one sensible limitation in (4). A response that uses a different stated cutoff consistently and reaches a defensible conclusion earns full credit for (3).
