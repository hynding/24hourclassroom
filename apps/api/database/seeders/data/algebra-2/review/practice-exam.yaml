week: 34
description: |
  A full practice final: 70 questions · about 2 hours 15 minutes · all seven units in course order,
  weighted as the units are (Unit 2 heaviest; Units 1 and 5 lightest). Each unit's block opens with a
  shared-context set of three questions (a sequence, an open box, two complex numbers, a growing population,
  a function given by points, a Ferris wheel, and battery lifetimes with the normal-table values you need).
  Multiple choice, select-all, true/false and numeric items (1 point each; select-all 2 points with partial
  credit) are graded at once; fill-in-the-blank items are matched automatically; the three short-answer
  questions (3 points each) and the two extended responses (6 points each) are graded by your teacher against
  the scoring notes. A scientific calculator is allowed; keep it in radian mode for the trigonometry items.
questions:
  # ======================================================================
  # Unit 1 (6 items): q01-q06 · Unit 2 (16): q07-q22 · Unit 3 (11): q23-q33
  # Unit 4 (11): q34-q44 · Unit 5 (6): q45-q50 · Unit 6 (12): q51-q62 · Unit 7 (8): q63-q70
  # ======================================================================
  # ---- Unit 1 set: the sequence 5, 8, 11, 14, … (1.3, 1.8, 1.11)
  - slug: alg2-final-q01
    type: multiple_choice
    topic_code: "1.3"
    source: "IM Algebra 2, Unit 1, Lesson 3"
    points: 1
    stimulus: |
      A sequence begins 5, 8, 11, 14, … and continues with the same pattern.
    prompt: |
      What kind of sequence is it, and what is its constant?
    options:
      - "Geometric, with common ratio 8/5"
      - "Geometric, with common ratio 3"
      - "Arithmetic, with common difference 3"
      - "Arithmetic, with common difference 5"
    option_explanations:
      - |
        The ratios of consecutive terms change, so there is no common ratio.
      - |
        A geometric sequence multiplies by a constant; 8/5, 11/8 and 14/11 are not equal.
      - |
        Correct. Each term is the previous term plus 3, the mark of an arithmetic sequence.
      - |
        5 is the first term, not the difference between terms.
    answer: 2
  - slug: alg2-final-q02
    type: multiple_choice
    topic_code: "1.8"
    source: "IM Algebra 2, Unit 1, Lesson 8"
    points: 1
    stimulus: |
      A sequence begins 5, 8, 11, 14, … and continues with the same pattern.
    prompt: |
      Which rule gives the nth term a(n) for n ≥ 1?
    options:
      - "a(n) = 3n + 5"
      - "a(n) = 3n + 2"
      - "a(n) = 5 · 3^(n−1)"
      - "a(n) = 5n + 3"
    option_explanations:
      - |
        This gives a(1) = 8; the first term must be 5.
      - |
        Correct. a(n) = 5 + 3(n − 1) = 3n + 2; check a(1) = 5, a(2) = 8.
      - |
        That is a geometric rule, tripling each step: 5, 15, 45.
      - |
        This gives a(1) = 8 and grows by 5 each step; the sequence grows by 3.
    answer: 1
  - slug: alg2-final-q03
    type: multiple_choice
    topic_code: "1.11"
    source: "IM Algebra 2, Unit 1, Lesson 11"
    points: 1
    stimulus: |
      A sequence begins 5, 8, 11, 14, … and continues with the same pattern.
    prompt: |
      What is the sum of the first 20 terms?
    options:
      - "335"
      - "1,340"
      - "620"
      - "670"
    option_explanations:
      - |
        335 is half of the correct sum 670: the formula is 20 · (5 + 62)/2 = 20 · 67/2 = 670, and halving a second time is the error.
      - |
        1,340 forgets to halve: the sum is the number of terms times the average of the first and last.
      - |
        620 is 20 · 31, using the 9th term instead of averaging the first and last.
      - |
        Correct. The 20th term is 3(20) + 2 = 62, and the sum is 20 · (5 + 62)/2 = 670.
    answer: 3
  - slug: alg2-final-q04
    type: multiple_choice
    topic_code: "1.2"
    source: "IM Algebra 2, Unit 1, Lesson 2"
    points: 1
    prompt: |
      A geometric sequence begins 2, 6, 18, … Which expression gives its nth term?
    options:
      - "2 · 3^(n−1)"
      - "2 + 4(n − 1)"
      - "2 · 3ⁿ"
      - "3 · 2^(n−1)"
    option_explanations:
      - |
        Correct. The ratio is 3 and the first term is 2; n − 1 multiplications by 3 reach the nth term.
      - |
        That is an arithmetic rule with difference 4: 2, 6, 10.
      - |
        2 · 3ⁿ gives 6 for n = 1; the first term must be 2.
      - |
        This formula starts at 3 and doubles: 3, 6, 12, …, which matches neither the first term nor the ratio of the given sequence.
    answer: 0
  - slug: alg2-final-q05
    type: true_false
    topic_code: "1.5"
    source: "IM Algebra 2, Unit 1, Lesson 5"
    points: 1
    prompt: |
      True or false: a sequence can be thought of as a function whose domain is the positive integers (or whole numbers), with the term number as input and the term as output.
    answer: true
    explanation: |
      True. Writing a(n) for the nth term is function notation; the inputs are the positions 1, 2, 3, … and the graph is a set of separate points.
  - slug: alg2-final-q06
    type: numeric
    topic_code: "1.10"
    source: "IM Algebra 2, Unit 1, Lesson 10"
    points: 1
    prompt: |
      A ball dropped from 200 cm rebounds to 60% of its previous height on each bounce. How high does it rise after the third bounce? Give one decimal place in centimetres.
    answer: { value: 43.2, tolerance: 0.05 }
    explanation: |
      Geometric with ratio 0.6: 200 · 0.6³ = 200 · 0.216 = 43.2 cm.
  # ---- Unit 2 set: the open box (2.1, 2.3, 2.8)
  - slug: alg2-final-q07
    type: multiple_choice
    topic_code: "2.1"
    source: "IM Algebra 2, Unit 2, Lesson 1"
    points: 1
    stimulus: |
      An open-top box is made from a 20 cm by 30 cm sheet of card by cutting a square of side x cm from each corner and folding up the sides.
    prompt: |
      Which expression gives the volume of the box in cubic centimetres?
    options:
      - "V(x) = (20 − 2x)(30 − 2x)"
      - "V(x) = x(20 − x)(30 − x)"
      - "V(x) = 600x"
      - "V(x) = x(20 − 2x)(30 − 2x)"
    option_explanations:
      - |
        This is the area of the base; the volume also multiplies by the height x.
      - |
        Each dimension loses x at both ends, so 2x is removed from each.
      - |
        600x would be the volume if the base stayed 20 by 30, but folding shrinks it.
      - |
        Correct. Each side loses two squares of side x, and the height is x.
    answer: 3
  - slug: alg2-final-q08
    type: multiple_choice
    topic_code: "2.3"
    source: "IM Algebra 2, Unit 2, Lesson 3"
    points: 1
    stimulus: |
      An open-top box is made from a 20 cm by 30 cm sheet of card by cutting a square of side x cm from each corner and folding up the sides.
    prompt: |
      For which values of x does the box make sense, and what is the degree of the volume polynomial?
    options:
      - "0 < x < 20; degree 2"
      - "0 < x < 15; degree 3"
      - "0 < x < 10; degree 3"
      - "x > 0; degree 1"
    option_explanations:
      - |
        Three factors of x each give a cubic, not a quadratic, and x must stay under 10.
      - |
        At x = 12 the side 20 − 2x is negative; the 20 cm side is the limit, not the 30 cm side.
      - |
        Correct. The shorter side, 20 − 2x, must stay positive, so x < 10; multiplying three linear factors gives degree 3.
      - |
        The volume is a product of three factors in x, and large x destroys the box.
    answer: 2
  - slug: alg2-final-q09
    type: multiple_choice
    topic_code: "2.8"
    source: "IM Algebra 2, Unit 2, Lesson 8"
    points: 1
    stimulus: |
      An open-top box is made from a 20 cm by 30 cm sheet of card by cutting a square of side x cm from each corner and folding up the sides.
    prompt: |
      Multiplied out, V(x) = 4x³ − 100x² + 600x. What is its end behavior?
    options:
      - "As x → ∞, V → ∞; as x → −∞, V → −∞"
      - "Both ends go to −∞"
      - "As x → ∞, V → −∞; as x → −∞, V → ∞"
      - "Both ends go to ∞"
    option_explanations:
      - |
        Correct. The leading term 4x³ has odd degree and a positive coefficient, so the ends go in opposite directions, up on the right.
      - |
        Both ends down needs even degree and a negative leading coefficient.
      - |
        That would need a negative leading coefficient.
      - |
        Both ends up is the behavior of an even-degree polynomial with positive leading coefficient.
    answer: 0
  - slug: alg2-final-q10
    type: multiple_choice
    topic_code: "2.4"
    source: "IM Algebra 2, Unit 2, Lesson 4"
    points: 1
    prompt: |
      What is (x + 3)(x² − 2x + 5)?
    options:
      - "x³ − 2x² + 5x + 15"
      - "x³ + x² − x + 15"
      - "x³ + x² + 11x + 15"
      - "x³ + 5x² − x + 15"
    option_explanations:
      - |
        This multiplies only by x and adds 15; the 3 must multiply every term of the quadratic.
      - |
        Correct. x³ − 2x² + 5x + 3x² − 6x + 15 = x³ + x² − x + 15.
      - |
        The x terms combine as 5x − 6x = −x, not 11x; subtracting a negative term is the sign slip here.
      - |
        The x² terms are −2x² + 3x² = x², not 5x².
    answer: 1
  - slug: alg2-final-q11
    type: multiple_choice
    topic_code: "2.7"
    source: "IM Algebra 2, Unit 2, Lesson 7"
    points: 1
    prompt: |
      A cubic polynomial has zeros at x = −2, 1 and 3 and y-intercept 12. Which is it?
    options:
      - "p(x) = (x + 2)(x − 1)(x − 3)"
      - "p(x) = 12(x + 2)(x − 1)(x − 3)"
      - "p(x) = 2(x + 2)(x − 1)(x − 3)"
      - "p(x) = 2(x − 2)(x + 1)(x + 3)"
    option_explanations:
      - |
        This has the right zeros but p(0) = 6, not 12.
      - |
        This polynomial gives p(0) = 12 · (2)(−1)(−3) = 12 · 6 = 72, which does not match the required y-intercept; the leading coefficient must be 2, not 12.
      - |
        Correct. At x = 0 the factors give (2)(−1)(−3) = 6, so the leading coefficient must be 2 to make p(0) = 12.
      - |
        These factors have zeros at 2, −1 and −3, the opposites of the required ones.
    answer: 2
  - slug: alg2-final-q12
    type: multiple_choice
    topic_code: "2.9"
    source: "IM Algebra 2, Unit 2, Lesson 9"
    points: 1
    prompt: |
      What is the end behavior of q(x) = −x⁴ + 3x?
    options:
      - "Both ends go up."
      - "Left end down, right end up."
      - "Left end up, right end down."
      - "Both ends go down (q → −∞ as x → ∞ and as x → −∞)."
    option_explanations:
      - |
        That would need a positive leading coefficient with even degree.
      - |
        Opposite ends require odd degree; x⁴ is even.
      - |
        Opposite ends require odd degree; x⁴ is even.
      - |
        Correct. The leading term −x⁴ has even degree and a negative coefficient; the 3x cannot compete for large |x|.
    answer: 3
  - slug: alg2-final-q13
    type: multiple_choice
    topic_code: "2.10"
    source: "IM Algebra 2, Unit 2, Lesson 10"
    points: 1
    prompt: |
      How does the graph of r(x) = (x + 1)³(x − 2)² behave at its zeros?
    options:
      - "Touches and turns at −1; crosses at 2."
      - "Crosses the x-axis at −1, flattening as it crosses; touches and turns at 2."
      - "Touches and turns at both −1 and 2."
      - "Crosses in a straight line at both −1 and 2."
    option_explanations:
      - |
        The even multiplicity is at 2, not at −1.
      - |
        Correct. Multiplicity 3 (odd, above 1) crosses with a flattening; multiplicity 2 (even) bounces.
      - |
        The zero at −1 has odd multiplicity, so the graph crosses there.
      - |
        Neither zero has multiplicity 1, so neither crossing is straight.
    answer: 1
  - slug: alg2-final-q14
    type: multiple_choice
    topic_code: "2.13"
    source: "IM Algebra 2, Unit 2, Lesson 13"
    points: 1
    prompt: |
      What is (x³ − 7x + 6) ÷ (x − 2)?
    options:
      - "x² + 2x − 3"
      - "x² − 7 with remainder 6"
      - "x² − 2x − 3"
      - "x² + 2x + 3"
    option_explanations:
      - |
        Correct. (x − 2)(x² + 2x − 3) = x³ + 2x² − 3x − 2x² − 4x + 6 = x³ − 7x + 6.
      - |
        x − 2 is a factor (p(2) = 8 − 14 + 6 = 0), so the remainder is 0, and the quotient must be found by division.
      - |
        (x − 2)(x² − 2x − 3) = x³ − 4x² + x + 6, not the given polynomial.
      - |
        (x − 2)(x² + 2x + 3) = x³ − x − 6, not the given polynomial.
    answer: 0
  - slug: alg2-final-q15
    type: multiple_choice
    topic_code: "2.15"
    source: "IM Algebra 2, Unit 2, Lesson 15"
    points: 1
    prompt: |
      What is the remainder when p(x) = x³ − 7x + 6 is divided by x − 3?
    options:
      - "3"
      - "12"
      - "−6"
      - "0"
    option_explanations:
      - |
        3 is the value substituted, not the remainder.
      - |
        Correct. By the remainder theorem the remainder is p(3) = 27 − 21 + 6 = 12.
      - |
        p(−3) = −27 + 21 + 6 = 0 is the value at −3, which answers a question about x + 3.
      - |
        0 would mean x − 3 is a factor; p(3) is not 0 (the zeros are 1, 2 and −3).
    answer: 1
  - slug: alg2-final-q16
    type: multiple_choice
    topic_code: "2.18"
    source: "IM Algebra 2, Unit 2, Lesson 18"
    points: 1
    prompt: |
      For f(x) = (2x − 4)/(x + 1), what are the vertical asymptote, the zero and the horizontal asymptote?
    options:
      - "x = −1; x = 2; y = 0"
      - "x = 2; x = −1; y = 2"
      - "x = −1; x = −4; y = −4"
      - "x = −1; x = 2; y = 2"
    option_explanations:
      - |
        y = 0 would need the denominator's degree to exceed the numerator's; here they are equal.
      - |
        The asymptote comes from the denominator and the zero from the numerator, not the reverse.
      - |
        −4 is the y-intercept, f(0); it is neither a zero nor an asymptote.
      - |
        Correct. Denominator 0 at x = −1; numerator 0 at x = 2; equal degrees give y = 2/1.
    answer: 3
  - slug: alg2-final-q17
    type: multiple_choice
    topic_code: "2.19"
    source: "IM Algebra 2, Unit 2, Lesson 19"
    points: 1
    prompt: |
      What is the end behavior of g(x) = (x² + 1)/(x − 3)?
    options:
      - "No horizontal asymptote; for large |x| the graph behaves like y = x."
      - "Horizontal asymptote y = 0."
      - "Horizontal asymptote y = 3."
      - "Horizontal asymptote y = 1."
    option_explanations:
      - |
        Correct. The numerator's degree is one more than the denominator's, so the quotient grows like x.
      - |
        y = 0 happens when the denominator has the larger degree; here the numerator does.
      - |
        x = 3 is the vertical asymptote; there is no horizontal one.
      - |
        y = 1 would need equal degrees with leading coefficients 1 and 1.
    answer: 0
  - slug: alg2-final-q18
    type: multiple_choice
    topic_code: "2.22"
    source: "IM Algebra 2, Unit 2, Lesson 22"
    points: 1
    prompt: |
      Solve 1/(x − 1) + 1/2 = 3/(x − 1).
    options:
      - "x = 1"
      - "x = 3"
      - "x = 5"
      - "x = −3"
    option_explanations:
      - |
        x = 1 makes both denominators zero; it is excluded from the start.
      - |
        At x = 3: 1/2 + 1/2 = 1 but 3/2 on the right; not a solution.
      - |
        Correct. Multiplying by 2(x − 1): 2 + (x − 1) = 6, so x = 5; check: 1/4 + 1/2 = 3/4 ✓.
      - |
        At x = −3: −1/4 + 1/2 = 1/4 but −3/4 on the right; not a solution.
    answer: 2
  - slug: alg2-final-q19
    type: true_false
    topic_code: "2.23"
    source: "IM Algebra 2, Unit 2, Lesson 23"
    points: 1
    prompt: |
      True or false: (a + b)² − (a − b)² = 4ab for all a and b.
    answer: true
    explanation: |
      True. (a² + 2ab + b²) − (a² − 2ab + b²) = 4ab; it holds for every a and b, so it is an identity.
  - slug: alg2-final-q20
    type: numeric
    topic_code: "2.25"
    source: "IM Algebra 2, Unit 2, Lesson 25"
    points: 1
    prompt: |
      Find the sum 1 + 3 + 9 + 27 + 81 + 243 + 729.
    answer: { value: 1093, tolerance: 0 }
    explanation: |
      Seven terms of a geometric sequence with ratio 3: (3⁷ − 1)/(3 − 1) = 2186/2 = 1093.
  - slug: alg2-final-q21
    type: short_answer
    topic_code: "2.6"
    source: "IM Algebra 2, Unit 2, Lesson 6"
    points: 3
    prompt: |
      Let p(x) = x³ − x² − 6x.
      (a) Write p(x) in factored form.
      (b) Give the zeros of p and the y-intercept.
      (c) Describe the graph: its end behavior and where it is above the x-axis.
    answer: |
      (a) p(x) = x(x² − x − 6) = x(x − 3)(x + 2).
      (b) Zeros at x = −2, 0 and 3; y-intercept 0 (the graph passes through the origin).
      (c) Odd degree with positive leading coefficient: down on the left, up on the right. Testing a point in each interval, p is positive on (−2, 0) and on (3, ∞), negative on (−∞, −2) and (0, 3); each zero has multiplicity 1, so the graph crosses at all three.
    explanation: |
      Three points, one per part. (a) x(x − 3)(x + 2). (b) −2, 0, 3 and intercept 0. (c) end behavior and the positive intervals (−2, 0) and (3, ∞).
  - slug: alg2-final-q22
    type: long_answer
    topic_code: "2.21"
    source: "IM Algebra 2, Unit 2, Lesson 21"
    points: 6
    prompt: |
      A small workshop pays $500 a month in fixed costs and $3 in materials for each candle it makes. The average cost per candle when it makes x candles in a month is C(x) = (500 + 3x)/x. Write a full response that (1) explains where each part of the formula comes from, (2) finds C(100) and C(500) and describes what happens to the average cost as x grows, naming the horizontal asymptote and interpreting it, (3) finds how many candles must be made for the average cost to be $4, showing the equation you solve and checking the answer, and (4) explains why the graph has a vertical asymptote at x = 0 and what the domain of the model is in context.
    answer: |
      (1) Total cost for x candles is 500 + 3x (fixed plus $3 each); dividing by the number of candles gives the average cost per candle.
      (2) C(100) = 800/100 = $8; C(500) = 2,000/500 = $4. As x grows the fixed $500 is spread over more candles and C(x) = 3 + 500/x falls toward 3: the horizontal asymptote y = 3 means the average cost can approach but never reach the $3 materials cost per candle.
      (3) (500 + 3x)/x = 4 gives 500 + 3x = 4x, so x = 500. Check: (500 + 1,500)/500 = 4 ✓.
      (4) At x = 0 the denominator is 0 while the numerator is 500: making no candles gives no average cost, and as x approaches 0 the average cost grows without bound because the fixed cost is spread over almost nothing. In context the domain is positive whole numbers of candles, x = 1, 2, 3, …
    explanation: |
      Six points: 1 for the total-cost-over-count explanation in (1); 2 for C(100) = 8, C(500) = 4 and the asymptote y = 3 with its meaning in (2); 2 for the equation and x = 500 with a check in (3); 1 for the vertical asymptote reason and the positive-integer domain in (4).
  # ---- Unit 3: Complex Numbers and Rational Exponents (q23–q33) ----
  - slug: alg2-final-q23
    type: multiple_choice
    topic_code: "3.12"
    source: "IM Algebra 2, Unit 3, Lesson 12"
    points: 1
    stimulus: |
      Let z = 3 − 2i and w = 1 + 4i.
    prompt: |
      What is z + w?
    options:
      - "3 − 8i"
      - "4 − 6i"
      - "2 − 6i"
      - "4 + 2i"
    option_explanations:
      - |
        This multiplies the imaginary parts (−2 · 4 = −8) instead of adding them; addition never multiplies coefficients.
      - |
        The imaginary parts are −2 and 4; their sum is +2, not −6. Subtracting instead of adding gives −6.
      - |
        This subtracts w from z: (3 − 1) + (−2 − 4)i = 2 − 6i. The question asks for the sum.
      - |
        Correct. Add real parts and imaginary parts separately: (3 + 1) + (−2 + 4)i = 4 + 2i.
    answer: 3
  - slug: alg2-final-q24
    type: multiple_choice
    topic_code: "3.13"
    source: "IM Algebra 2, Unit 3, Lesson 13"
    points: 1
    stimulus: |
      Let z = 3 − 2i and w = 1 + 4i.
    prompt: |
      What is the product zw?
    options:
      - "11 + 10i"
      - "3 + 10i − 8i²"
      - "−5 + 10i"
      - "3 − 8i"
    option_explanations:
      - |
        Correct. (3 − 2i)(1 + 4i) = 3 + 12i − 2i − 8i² = 3 + 10i + 8 = 11 + 10i, since i² = −1.
      - |
        This is a correct intermediate step, but it is not simplified: replace i² with −1 and combine the real parts.
      - |
        This uses i² = +1 and gets 3 + 10i − 8 = −5 + 10i. The defining property of i is i² = −1, so −8i² = +8.
      - |
        This multiplies only the real parts (3 · 1) and only the imaginary parts (−2i · 4i, wrongly kept as −8i). Use the distributive property on all four pairs.
    answer: 0
  - slug: alg2-final-q25
    type: multiple_choice
    topic_code: "3.14"
    source: "IM Algebra 2, Unit 3, Lesson 14"
    points: 1
    stimulus: |
      Let z = 3 − 2i and w = 1 + 4i.
    prompt: |
      What is z², written in the form a + bi?
    options:
      - "9 − 4i"
      - "5 − 12i"
      - "9 + 4i"
      - "13 − 12i"
    option_explanations:
      - |
        This squares each part separately and keeps the sign of the imaginary part; the middle term −12i and the −4 from (−2i)² are both missing.
      - |
        Correct. (3 − 2i)² = 9 − 12i + 4i² = 9 − 12i − 4 = 5 − 12i.
      - |
        This squares 3 and squares 2i as if (a + b)² = a² + b² and drops the sign; squaring a binomial produces a middle term 2ab.
      - |
        This gets the middle term −12i right but uses (−2i)² = +4; since i² = −1, (−2i)² = −4 and the real part is 9 − 4 = 5.
    answer: 1
  - slug: alg2-final-q26
    type: numeric
    topic_code: "3.4"
    source: "IM Algebra 2, Unit 3, Lesson 4"
    points: 1
    prompt: |
      Evaluate 32^(3/5) without a calculator. Give the exact whole-number value.
    answer: { value: 8, tolerance: 0 }
    explanation: |
      32 = 2⁵, so 32^(3/5) = (2⁵)^(3/5) = 2³ = 8. Equivalently, the fifth root of 32 is 2 and 2³ = 8.
  - slug: alg2-final-q27
    type: multiple_choice
    topic_code: "3.5"
    source: "IM Algebra 2, Unit 3, Lesson 5"
    points: 1
    prompt: |
      Which value equals 9^(−3/2)?
    options:
      - "1/6"
      - "−1/27"
      - "1/27"
      - "−27"
    option_explanations:
      - |
        This multiplies 9 by 3/2 and then takes a reciprocal in some form; exponents are not multiplied into the base. The exponent 3/2 means square root, then cube.
      - |
        The negative sign in the exponent does not make the answer negative; a positive base to any real power is positive.
      - |
        Correct. 9^(3/2) = (√9)³ = 3³ = 27, and the negative exponent takes the reciprocal: 1/27.
      - |
        A negative exponent means a reciprocal, not a negative result: 9^(−3/2) = 1/9^(3/2), and 9^(3/2) = 27.
    answer: 2
  - slug: alg2-final-q28
    type: multiple_choice
    topic_code: "3.9"
