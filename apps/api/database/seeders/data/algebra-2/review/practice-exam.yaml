      - "(√2/2, √2/2)"
      - "(−1/2, √3/2)"
      - "(−√2/2, √2/2)"
      - "(−√2/2, −√2/2)"
    option_explanations:
      - |
        This is the point at π/4, in the first quadrant. 3π/4 is in the second quadrant, where x is negative.
      - |
        This is the point at 2π/3 (120°), whose reference angle is π/3. The reference angle of 3π/4 is π/4, which gives equal magnitudes √2/2.
      - |
        Correct. 3π/4 is 135°, in the second quadrant with reference angle π/4, so x = −√2/2 and y = √2/2.
      - |
        Both coordinates negative is the third quadrant, the point at 5π/4. At 3π/4 the y-coordinate is still positive.
    answer: 2
  - slug: alg2-final-q56
    type: fill_blank
    topic_code: "6.5"
    source: "IM Algebra 2, Unit 6, Lesson 5"
    points: 1
    prompt: |
      If sin θ = −3/5 and θ is in the third quadrant, then cos θ = ____.
    answer: ["-4/5", "−4/5", "-0.8", "−0.8", "cos θ = -4/5"]
    explanation: |
      cos²θ = 1 − sin²θ = 1 − 9/25 = 16/25, so cos θ = ±4/5. In the third quadrant the x-coordinate is negative, so cos θ = −4/5.
  - slug: alg2-final-q57
    type: numeric
    topic_code: "6.7"
    source: "IM Algebra 2, Unit 6, Lesson 7"
    points: 1
    prompt: |
      A point moves counterclockwise around a circle of radius 25 centered at the origin, starting from (25, 0). What angle in radians, between 0 and 2π, has it turned through when it reaches (−7, 24)? Give your answer to two decimal places.
    answer: { value: 1.85, tolerance: 0.02 }
    explanation: |
      The point is in the second quadrant (x < 0, y > 0). Its reference angle satisfies tan(α) = 24/7, so α = arctan(24/7) ≈ 1.287, and the angle is π − 1.287 ≈ 1.85 radians. (Check: 25 cos(1.85) ≈ −6.9 and 25 sin(1.85) ≈ 24.0.)
  - slug: alg2-final-q58
