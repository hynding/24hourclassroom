    prompt: |
      True or false: the graph of y = cos θ is the graph of y = sin θ shifted π/2 to the left, so cos θ = sin(θ + π/2) for every θ.
    answer: true
    explanation: |
      True. Sine reaches its maximum at π/2 and cosine at 0, so moving the sine graph π/2 to the left lines the two up; check θ = 0: sin(π/2) = 1 = cos(0).
  - slug: alg2-final-q62
    type: short_answer
    topic_code: "6.19"
    source: "IM Algebra 2, Unit 6, Lesson 19"
    points: 3
    prompt: |
      In a certain city the longest day of the year has about 14.6 hours of daylight (day 172) and the shortest has about 9.4 hours (day 355). Let D(t) be the hours of daylight on day t of the year, modeled by a cosine function with a period of 365 days.
      (a) Find the midline and amplitude of the model.
      (b) Write a formula for D(t) that reaches its maximum on day 172.
      (c) Use your model to estimate the daylight on day 0 (January 1), to one decimal place.
    answer: |
      (a) Midline (14.6 + 9.4)/2 = 12 hours; amplitude (14.6 − 9.4)/2 = 2.6 hours.
      (b) D(t) = 12 + 2.6 cos(2π(t − 172)/365). The cosine is at its maximum when t = 172 and the period is 365.
      (c) D(0) = 12 + 2.6 cos(−2π · 172/365) = 12 + 2.6 cos(−2.961) ≈ 12 + 2.6(−0.984) ≈ 9.4 hours, close to the shortest day, as expected for early January.
    explanation: |
      Three points, one per part. (a) midline 12, amplitude 2.6. (b) a cosine with amplitude 2.6, midline 12, period 365 and a horizontal shift of 172 (an equivalent sine form with the correct shift earns the point). (c) about 9.4 hours (accept 9.3–9.5), computed in radian mode.
  # ---- Unit 7: Statistical Inferences (q63–q70) ----
  - slug: alg2-final-q63
    type: multiple_choice
    topic_code: "7.5"
    source: "IM Algebra 2, Unit 7, Lesson 5"
    points: 1
    stimulus: |
      The lifetimes of a brand of battery are approximately normally distributed with mean 50 hours and standard deviation 4 hours. Use these areas under the standard normal curve to the left of z: z = −1 → 0.159, z = 1.5 → 0.933, z = 2 → 0.977.
    prompt: |
      About what percent of these batteries last between 42 and 58 hours?
    options:
      - "About 95%"
      - "About 68%"
      - "About 50%"
      - "About 99.7%"
    option_explanations:
      - |
        Correct. 42 = 50 − 2(4) and 58 = 50 + 2(4), and about 95% of a normal distribution lies within two standard deviations of the mean (0.977 − 0.023 = 0.954).
      - |
        68% is the share within one standard deviation, 46 to 54 hours. The interval 42 to 58 is two standard deviations on each side.
      - |
        Half the batteries last longer than the mean of 50, but the question asks for a symmetric interval around it, which captures much more than half.
      - |
        99.7% is the share within three standard deviations, 38 to 62 hours.
    answer: 0
  - slug: alg2-final-q64
    type: multiple_choice
    topic_code: "7.7"
    source: "IM Algebra 2, Unit 7, Lesson 7"
    points: 1
    stimulus: |
      The lifetimes of a brand of battery are approximately normally distributed with mean 50 hours and standard deviation 4 hours. Use these areas under the standard normal curve to the left of z: z = −1 → 0.159, z = 1.5 → 0.933, z = 2 → 0.977.
    prompt: |
      What proportion of the batteries last less than 46 hours?
    options:
      - "0.841"
      - "0.159"
      - "0.067"
      - "0.341"
    option_explanations:
      - |
        0.841 is the area to the left of z = +1, that is, the share lasting less than 54 hours. For 46 hours the z-score is −1.
      - |
        Correct. 46 hours is z = (46 − 50)/4 = −1, and the area to the left of z = −1 is 0.159, so about 15.9% of batteries fail before 46 hours.
      - |
        0.067 is the area beyond 1.5 standard deviations (below 44 hours), not below 46.
      - |
        0.341 is the area between the mean and one standard deviation below it; the question asks for everything below 46, which is the left tail.
    answer: 1
