    - slug: alg2-u02-w10-q22
      type: short_answer
      topic_code: "2.23"
      source: "IM Algebra 2, Unit 2, Lesson 23"
      points: 3
      prompt: |
        (a) Prove that (x + 2)² − (x − 2)² = 8x is an identity.
        (b) Use the identity to compute 102² − 98² without squaring either number.
        (c) Explain why checking the equation at x = 3 alone would not have been a proof.
      answer: |
        (a) (x² + 4x + 4) − (x² − 4x + 4) = 8x.
        (b) Take x = 100: 102² − 98² = 8 · 100 = 800.
        (c) A check at one value shows the two sides agree there, but an identity must hold for every x; a false equation such as (x + 5)² = x² + 25 also holds at x = 0. Only rewriting one side into the other proves it for all x.
      explanation: |
        Three points, one per part. (a) a full expansion. (b) 800 with the identity used. (c) the distinction between checking and proving.
    - slug: alg2-u02-w10-q23
      type: short_answer
      topic_code: "2.26"
      source: "IM Algebra 2, Unit 2, Lesson 26"
      points: 3
      prompt: |
        A student borrows $5,000 at 1% interest per month and will repay it with 12 equal monthly payments of P dollars, the first one month after borrowing.

        (a) Write an expression for what the loan has grown to after 12 months if nothing were paid.
        (b) Write the total value of the 12 payments at the end of month 12 as a geometric series and as a closed-form expression.
        (c) Set the two equal and find P to the nearest cent.
      answer: |
        (a) 5000 · 1.01¹².
        (b) The last payment has grown 0 months and the first 11 months: P + P(1.01) + … + P(1.01)¹¹ = P(1.01¹² − 1)/0.01.
        (c) 5000 · 1.01¹² ≈ 5634.13 and (1.01¹² − 1)/0.01 ≈ 12.6825, so P ≈ 5634.13/12.6825 ≈ $444.24.
      explanation: |
        Three points, one per part. (a) the grown loan. (b) the series and the closed form with n = 12. (c) P ≈ 444.24 (accept 444.20 to 444.30).
    - slug: alg2-u02-w10-q24
      type: long_answer
      topic_code: "2.25"
      source: "IM Algebra 2, Unit 2, Lesson 25"
      points: 6
      prompt: |
        Write a full response that (1) expands (x − 1)(x³ + x² + x + 1) and explains why the middle terms cancel, (2) uses the result to write 1 + x + x² + x³ as a single fraction and states the value of x for which the fraction is not allowed, (3) explains how the same idea gives the formula a + ar + … + arⁿ⁻¹ = a(rⁿ − 1)/(r − 1), and (4) uses the formula to find 4 + 12 + 36 + … + 4 · 3⁸ and checks the answer another way for the first three terms.
      answer: |
        (1) x⁴ + x³ + x² + x − x³ − x² − x − 1 = x⁴ − 1. Each middle power appears once from multiplying by x and once, negated, from multiplying by −1, so they cancel in pairs.
        (2) 1 + x + x² + x³ = (x⁴ − 1)/(x − 1), valid for x ≠ 1 (at x = 1 the sum is just 4).
        (3) The same cancellation gives (x − 1)(1 + x + … + xⁿ⁻¹) = xⁿ − 1 for any n, so 1 + x + … + xⁿ⁻¹ = (xⁿ − 1)/(x − 1). Replacing x by r and multiplying every term by a gives a + ar + … + arⁿ⁻¹ = a(rⁿ − 1)/(r − 1).
        (4) a = 4, r = 3, n = 9 (exponents 0 to 8): S = 4(3⁹ − 1)/2 = 2(19683 − 1) = 39,364. Check on the first three terms: 4 + 12 + 36 = 52, and the formula with n = 3 gives 4(27 − 1)/2 = 52.
      explanation: |
        Six points: 1 for the expansion with the cancellation explanation; 1 for the fraction and the exclusion x ≠ 1; 2 for the general derivation (1 for stating the formula without the link to the identity); 2 for the sum 39,364 with n = 9 and the three-term check (1 if n is miscounted but the method is right).
