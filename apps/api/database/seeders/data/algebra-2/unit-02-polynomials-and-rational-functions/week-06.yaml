week: 6
unit: 2
title: "End Behaviour, Multiplicity and Intersections"
topics: ["2.9", "2.10", "2.11"]
guide: guides/week-06.md
guide_description: |
  End behaviour for any leading coefficient (the sign fixes the right end, the degree decides whether the left
  end matches), reading degree and sign from a graph; what a repeated factor does at its zero (odd multiplicity
  crosses, even multiplicity bounces, higher multiplicity flattens) and writing equations for bouncing graphs;
  and finding intersections of two graphs by solving f(x) = g(x) as a zeros problem. Worked examples: a cubic
  with a double zero, a break-even problem, and a cubic solved by grouping.
flashcards_description: |
  27 cards on end behaviour with negative leading coefficients, reading graphs, multiplicity and its effect on
  the graph, and solving f(x) = g(x) for intersections.

flashcards:
  - front: Negative leading coefficient → effect on end behaviour
    back: |
      It flips both ends compared with the positive case, because every output is multiplied by a negative number. Even degree: both ends down. Odd degree: left up, right down.
    topic_code: "2.9"
  - front: Right end of a polynomial graph → what decides it
    back: |
      Only the sign of the leading coefficient: positive means the right end goes up, negative means it goes down, whatever the degree.
    topic_code: "2.9"
  - front: Left end of a polynomial graph → what decides it
    back: |
      The degree, once the right end is known: even degree makes the left end match the right end; odd degree makes it opposite.
    topic_code: "2.9"
  - front: End behaviour table → the four cases
    back: |
      Even, positive: ↑ ↑. Even, negative: ↓ ↓. Odd, positive: ↓ ↑. Odd, negative: ↑ ↓ (left end first, then right end).
    topic_code: "2.9"
  - front: End behaviour of −2x⁵ + 40x⁴ − 1 → describe
    back: |
      Leading term −2x⁵: odd degree, negative coefficient. As x → −∞ the outputs go to ∞; as x → ∞ they go to −∞.
    topic_code: "2.9"
  - front: End behaviour of 7 − x² − x⁶ → describe
    back: |
      Leading term −x⁶: even degree, negative coefficient, so both ends go down.
    topic_code: "2.9"
  - front: Graph with both ends going down → what you know about the equation
    back: |
      Even degree and a negative leading coefficient. The number of turning points plus one is a lower bound on the degree.
    topic_code: "2.9"
  - front: Graph rising on the left and falling on the right → what you know
    back: |
      Odd degree and a negative leading coefficient.
    topic_code: "2.9"
  - front: Turning points and degree → the bound
    back: |
      A polynomial of degree n has at most n − 1 turning points. A graph with 4 turning points has degree at least 5; it cannot be a quartic.
    topic_code: "2.9"
  - front: End behaviour of −(x + 3)(x − 1)(x − 2)(x − 5) → describe
    back: |
      Four linear factors and a minus sign give leading term −x⁴: both ends go down. Its vertical intercept is −(3)(−1)(−2)(5) = −30.
    topic_code: "2.9"
  - front: Multiplicity of a zero → definition
    back: |
      The exponent on its factor in the factored form. In (x − 5)³(x + 2)²x the zero 5 has multiplicity 3, −2 has multiplicity 2 and 0 has multiplicity 1.
    topic_code: "2.10"
  - front: Odd multiplicity at a zero → what the graph does
    back: |
      The graph crosses the x-axis and the sign changes. Multiplicity 1 crosses like a line; multiplicity 3 crosses but flattens out at the intercept.
    topic_code: "2.10"
  - front: Even multiplicity at a zero → what the graph does
    back: |
      The graph touches the axis and turns back (bounces) without crossing; the sign does not change. Near the zero it looks like a parabola with vertex on the axis.
    topic_code: "2.10"
  - front: Why (x − 2)²(x + 1) bounces at 2 → local reasoning
    back: |
      Near x = 2 the factor (x + 1) is about 3, so the function behaves like 3(x − 2)², a parabola with vertex (2, 0) that never goes below the axis there.
    topic_code: "2.10"
  - front: Sign table with a double zero → the rule
    back: |
      Do not flip the sign at a zero of even multiplicity. For (x + 1)²(x − 3): negative for x < −1, still negative on (−1, 3), positive for x > 3.
    topic_code: "2.10"
  - front: Graph bouncing at −4, crossing at 1, through (0, 8) → equation
    back: |
      k(x + 4)²(x − 1) with k · 16 · (−1) = 8 gives k = −1/2: p(x) = −(1/2)(x + 4)²(x − 1).
    topic_code: "2.10"
  - front: Counting zeros with multiplicity → the bound
    back: |
      A degree-n polynomial has at most n zeros counting multiplicity, so at most n distinct x-intercepts, often fewer. (x − 2)²(x + 1) has degree 3 and two distinct intercepts.
    topic_code: "2.10"
  - front: Quartic with double zero at 0, simple zeros at ±3, leading coefficient 2 → write it
    back: |
      2x²(x − 3)(x + 3), which expands to 2x⁴ − 18x².
    topic_code: "2.10"
  - front: Finding where two graphs intersect → the four steps
    back: |
      Set f(x) = g(x); move everything to one side to get (polynomial) = 0; solve by factoring, the quadratic formula or technology; substitute back for the y-coordinates and interpret.
    topic_code: "2.11"
  - front: Why rewrite f(x) = g(x) as f(x) − g(x) = 0 → reason
    back: |
      It turns an intersection problem into a zeros problem: the zeros of f − g are exactly the x-coordinates where the graphs meet, so factoring and sign tools apply.
    topic_code: "2.11"
  - front: Intersections of x³ − 4x and 3x² − 12 → solve
    back: |
      x³ − 3x² − 4x + 12 = 0; group: x²(x − 3) − 4(x − 3) = (x − 3)(x − 2)(x + 2). Points (3, 15), (2, 0), (−2, 0).
    topic_code: "2.11"
  - front: Factoring by grouping → when and how
    back: |
      For four terms where the first pair and the second pair share a common factor after factoring each: x³ − 3x² − 4x + 12 = x²(x − 3) − 4(x − 3) = (x − 3)(x² − 4).
    topic_code: "2.11"
  - front: Break-even for revenue 60x − x² and cost 8x + 240 → solve
    back: |
      60x − x² = 8x + 240 gives x² − 52x + 240 = 0, so (x − 6)(x − 46) = 0. Break-even at 6 and 46 thousand units; revenue exceeds cost in between.
    topic_code: "2.11"
  - front: Solving x³ = 9x → the trap and the fix
    back: |
      Dividing by x loses the solution x = 0. Instead write x³ − 9x = x(x − 3)(x + 3) = 0, giving x = 0, 3, −3.
    topic_code: "2.11"
  - front: Intersection equation with no rational zeros → what to do
    back: |
      Graph both functions (or f − g) and read the crossing with technology, reporting an approximation such as x ≈ 1.52 for x³ − x − 2 = 0, and say how you found it.
    topic_code: "2.11"
  - front: Why x⁴ + 1 and −x² never intersect → argument
    back: |
      Setting them equal gives x⁴ + x² + 1 = 0, but x⁴ + x² ≥ 0 so the left side is at least 1 and never 0. No real intersection.
    topic_code: "2.11"
  - front: Error-spot → "the sign changes at every zero in a sign table"
    back: |
      Only at zeros of odd multiplicity. At a double zero the graph touches and turns back, so the sign on both sides is the same.
    topic_code: "2.10"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (lessons 2.9 to 2.11: end behaviour with any leading
    coefficient, multiplicity, and intersections), with about a third reviewing weeks 4 and 5 and Unit 1
    (polynomial arithmetic, factors and zeros, sequences). Includes a shared-context set on one factored
    polynomial. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against
    the scoring notes.
  questions:
    # ---- Stimulus set: one polynomial with a repeated factor (2.10, 2.9, 2.6)
    - slug: alg2-u02-w06-q01
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 1
      stimulus: |
        Let f(x) = −2(x − 3)²(x + 1)(x − 6).
      prompt: |
        What does the graph of f do at x = 3?
      options:
        - "It crosses the x-axis and changes sign."
        - "It touches the x-axis and turns back without changing sign."
        - "It has a vertical asymptote."
        - "It passes through (3, −2)."
      option_explanations:
        - |
          Crossing happens at zeros of odd multiplicity; the factor (x − 3) appears twice.
        - |
          Correct. The factor (x − 3)² has even multiplicity, so the graph bounces off the axis at (3, 0).
        - |
          Polynomials never have asymptotes; those belong to rational functions.
        - |
          f(3) = 0 because (x − 3) is a factor; the point on the graph is (3, 0).
      answer: 1
    - slug: alg2-u02-w06-q02
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Algebra 2, Unit 2, Lesson 9"
      points: 1
      stimulus: |
        Let f(x) = −2(x − 3)²(x + 1)(x − 6).
      prompt: |
        What is the end behaviour of f?
      options:
        - "Both ends go up."
        - "Both ends go down."
        - "Left end down, right end up."
        - "Left end up, right end down."
      option_explanations:
        - |
          Both ends up would need a positive leading coefficient; the factor −2 makes it negative.
        - |
          Correct. The degree is 2 + 1 + 1 = 4 (even) and the leading coefficient is −2 (negative), so both ends go down.
        - |
          That pattern belongs to odd degree with a positive leading coefficient.
        - |
          That pattern belongs to odd degree with a negative leading coefficient; the degree here is 4.
      answer: 1
    - slug: alg2-u02-w06-q03
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Algebra 2, Unit 2, Lesson 6"
      points: 1
      stimulus: |
        Let f(x) = −2(x − 3)²(x + 1)(x − 6).
      prompt: |
        What is the vertical intercept of the graph of f?
      options:
        - "(0, 108)"
        - "(0, −108)"
        - "(0, 36)"
        - "(0, −18)"
      option_explanations:
        - |
          Correct. f(0) = −2 · (−3)² · (1) · (−6) = −2 · 9 · (−6) = 108.
        - |
          The product has two negative factors (−2 and −6), so it is positive.
        - |
          36 is 9 · 4; the constants to multiply are −2, 9, 1 and −6.
        - |
          −18 is −2 · 9; the factors (x + 1) and (x − 6) contribute 1 and −6 as well.
      answer: 0
    - slug: alg2-u02-w06-q04
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Algebra 2, Unit 2, Lesson 11"
      points: 1
      prompt: |
        At which x-values do the graphs of y = x³ and y = 16x intersect?
      options:
        - "x = 4 only"
        - "x = 4 and x = −4"
        - "x = 0, 4 and −4"
        - "x = 0 and 16"
      option_explanations:
        - |
          Dividing both sides by x and taking only the positive root misses two solutions.
        - |
          These two are right, but x = 0 is also a solution: 0³ = 16 · 0.
        - |
          Correct. x³ − 16x = x(x − 4)(x + 4) = 0 gives x = 0, 4, −4.
        - |
          At x = 16, 16³ = 4096 but 16 · 16 = 256; they are not equal.
      answer: 2
    - slug: alg2-u02-w06-q05
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 1
      prompt: |
        Graph description: a curve comes down from the top left, touches the x-axis at −2 and turns back up, rises to a hill, then crosses down through the x-axis at 4 and continues to the bottom right. Which equation could describe it?
      options:
        - "y = (x + 2)²(x − 4)"
        - "y = −(x + 2)²(x − 4)"
        - "y = −(x + 2)(x − 4)²"
        - "y = (x − 2)²(x + 4)"
      option_explanations:
        - |
          This has the right zeros and bounce, but its leading coefficient is positive, so the right end would go up.
        - |
          Correct. The bounce at −2 needs (x + 2)², the crossing at 4 needs (x − 4), and the top-left to bottom-right ends need an odd degree with a negative leading coefficient.
        - |
          This bounces at 4 and crosses at −2, the reverse of the graph described.
        - |
          The zeros here are 2 (double) and −4, in the wrong places.
      answer: 1
    - slug: alg2-u02-w06-q06
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Algebra 2, Unit 2, Lesson 9"
      points: 1
      prompt: |
        Graph description: a polynomial graph rises on the far left, falls on the far right, and has exactly four turning points. Which statement must be true?
      options:
        - "The degree is 4 and the leading coefficient is positive."
        - "The degree is odd and at least 5, and the leading coefficient is negative."
        - "The degree is even and the leading coefficient is negative."
        - "The degree is exactly 5 and the leading coefficient is positive."
      option_explanations:
        - |
          Four turning points need degree at least 5, and opposite ends mean odd degree.
        - |
          Correct. Opposite ends mean odd degree; a falling right end means a negative leading coefficient; four turning points require degree at least 5.
        - |
          Even degree would make both ends behave the same way, but here they differ.
        - |
          The leading coefficient must be negative for the right end to fall, and the degree could be 7 or more.
      answer: 1
    - slug: alg2-u02-w06-q07
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Algebra 2, Unit 2, Lesson 11"
      points: 1
      prompt: |
        The graphs of f(x) = x² + 3x and g(x) = 5x + 8 intersect at two points. What are they?
      options:
        - "(4, 28) and (−2, −2)"
        - "(4, 28) and (2, 18)"
        - "(−4, 4) and (2, 10)"
        - "(4, 12) and (−2, −18)"
      option_explanations:
        - |
          Correct. x² + 3x = 5x + 8 gives x² − 2x − 8 = (x − 4)(x + 2) = 0, so x = 4 or −2; g(4) = 28 and g(−2) = −2.
        - |
          x = 2 gives f(2) = 10 and g(2) = 18, which are not equal.
        - |
          x = −4 gives f = 4 and g = −12; the factors of x² − 2x − 8 are (x − 4)(x + 2).
        - |
          The x-values are right but the y-values are not: substitute back to get 28 and −2.
      answer: 0
    - slug: alg2-u02-w06-q08
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 1
      prompt: |
        How many distinct x-intercepts does the graph of p(x) = x²(x − 1)³(x + 5) have, and what is the degree of p?
      options:
        - "3 intercepts; degree 3"
        - "3 intercepts; degree 6"
        - "6 intercepts; degree 6"
        - "2 intercepts; degree 6"
      option_explanations:
        - |
          The degree counts every factor with multiplicity: 2 + 3 + 1 = 6.
        - |
          Correct. The distinct zeros are 0, 1 and −5, while the degree is 2 + 3 + 1 = 6.
        - |
          Repeated factors do not create new intercepts; 0 and 1 are each counted once on the graph.
        - |
          There are three distinct zeros: 0, 1 and −5.
      answer: 1
    - slug: alg2-u02-w06-q09
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Algebra 2, Unit 2, Lesson 5"
      points: 1
      prompt: |
        Which polynomial has zeros at exactly x = 0, x = 3/2 and x = −7?
      options:
        - "x(2x − 3)(x + 7)"
        - "x(2x + 3)(x − 7)"
        - "(x − 3/2)(x + 7)"
        - "x(x − 3)(x + 7)"
      option_explanations:
        - |
          Correct. x = 0 from the factor x, 2x − 3 = 0 at x = 3/2, and x + 7 = 0 at x = −7.
        - |
          The zeros here are 0, −3/2 and 7, the wrong signs.
        - |
          This has no factor of x, so 0 is not a zero.
        - |
          (x − 3) gives the zero 3, not 3/2; the factor for 3/2 is (2x − 3).
      answer: 0
    - slug: alg2-u02-w06-q10
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Algebra 2, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Which term controls the end behaviour of 5x² − x⁷ + 200x⁵?
      options:
        - "5x²"
        - "200x⁵"
        - "−x⁷"
        - "The largest coefficient, 200"
      option_explanations:
        - |
          The lowest-degree term matters least for large |x|.
        - |
          200x⁵ is big for moderate x, but x⁷ grows faster and eventually dominates.
        - |
          Correct. The highest-degree term, −x⁷, controls the ends: odd degree with a negative coefficient, so left up and right down.
        - |
          The size of a coefficient does not matter in the long run; the degree does.
      answer: 2
    - slug: alg2-u02-w06-q11
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 1
      prompt: |
        What is (2x − 1)(x² + x − 3) in standard form?
      options:
        - "2x³ + x² − 7x + 3"
        - "2x³ + 2x² − 6x − 3"
        - "2x³ − x² − 7x + 3"
        - "2x³ + x² − 5x + 3"
      option_explanations:
        - |
          Correct. 2x³ + 2x² − 6x − x² − x + 3 = 2x³ + x² − 7x + 3.
        - |
          This multiplies by 2x only; the −1 must also multiply every term of the quadratic.
        - |
          The x² terms are 2x² and −x², which combine to +x².
        - |
          The x terms are −6x and −x, which combine to −7x.
      answer: 0
    - slug: alg2-u02-w06-q12
      type: multiple_choice
      topic_code: "1.10"
      source: "IM Algebra 2, Unit 1, Lesson 10"
      points: 1
      prompt: |
        A forest has 5,000 trees. Each year 4% of the trees are cut down and no new trees are planted. Which equation gives the number of trees T(n) after n years?
      options:
        - "T(n) = 5000 − 200n"
        - "T(n) = 5000 · 0.96ⁿ"
        - "T(n) = 5000 · 0.04ⁿ"
        - "T(n) = 5000 · 1.04ⁿ"
      option_explanations:
        - |
          Cutting 4% of the current number is not a fixed 200 trees a year; only the first year removes 200.
        - |
          Correct. Losing 4% each year keeps 96%, a constant factor, so the sequence is geometric.
        - |
          Multiplying by 0.04 would keep only 4% of the trees each year.
        - |
          1.04 would be 4% growth, but the forest is shrinking.
      answer: 1
    - slug: alg2-u02-w06-q13
      type: multi_select
      topic_code: "2.9"
      source: "IM Algebra 2, Unit 2, Lesson 9"
      points: 2
      partial_credit: true
      prompt: |
        Which polynomials have a graph whose left end goes up and right end goes down? Select all that apply.
      options:
        - "−x³ + 5x"
        - "−(x − 1)(x + 2)(x − 4)"
        - "−x⁴ + 3"
        - "4 − 2x⁵"
        - "x³ − 2x²"
      option_explanations:
        - |
          Correct. Odd degree with a negative leading coefficient gives left up, right down.
        - |
          Correct. Three linear factors with a minus sign give leading term −x³.
        - |
          Even degree with a negative leading coefficient makes both ends go down.
        - |
          Correct. The leading term is −2x⁵: odd degree, negative coefficient.
        - |
          Positive leading coefficient: the right end goes up.
      answer: [0, 1, 3]
    - slug: alg2-u02-w06-q14
      type: multi_select
      topic_code: "2.11"
      source: "IM Algebra 2, Unit 2, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        To find where the graphs of f(x) = x³ − 2x² and g(x) = 4x − 8 intersect, a student writes x³ − 2x² − 4x + 8 = 0. Which statements are true? Select all that apply.
      options:
        - "The equation factors as (x − 2)(x² − 4) = 0."
        - "The graphs intersect at x = 2 and x = −2 only."
        - "The graphs intersect at (2, 0) and (−2, −16)."
        - "The x-coordinates of the intersections are the zeros of f − g."
        - "x = 0 is a solution because f(0) = 0."
      option_explanations:
        - |
          Correct. Grouping: x²(x − 2) − 4(x − 2) = (x − 2)(x² − 4) = (x − 2)²(x + 2).
        - |
          Correct. (x − 2)²(x + 2) = 0 gives x = 2 (a double zero) and x = −2.
        - |
          Correct. g(2) = 0 and g(−2) = −16, so the points are (2, 0) and (−2, −16).
        - |
          Correct. f(x) = g(x) exactly when f(x) − g(x) = 0.
        - |
          f(0) = 0 but g(0) = −8, so the graphs do not meet at x = 0.
      answer: [0, 1, 2, 3]
    - slug: alg2-u02-w06-q15
      type: true_false
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 1
      prompt: |
        True or false: The graph of y = (x + 5)³(x − 2) crosses the x-axis at x = −5.
      answer: true
      explanation: |
        True. The zero −5 has multiplicity 3, which is odd, so the graph crosses the axis there (flattening as it does so) and the sign of y changes. Only even multiplicities produce a bounce.
    - slug: alg2-u02-w06-q16
      type: true_false
      topic_code: "2.9"
      source: "IM Algebra 2, Unit 2, Lesson 9"
      points: 1
      prompt: |
        True or false: If the leading coefficient of a polynomial is negative, the right end of its graph goes down regardless of the degree.
      answer: true
      explanation: |
        True. For large positive x the leading term dominates and a negative coefficient makes it negative, so the right end goes down. The degree decides only whether the left end matches (even) or opposes (odd).
    - slug: alg2-u02-w06-q17
      type: fill_blank
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 1
      prompt: |
        In the polynomial (x − 4)⁵(x + 1)², the multiplicity of the zero x = 4 is ____.
      answer: ["5", "five"]
      explanation: |
        The factor (x − 4) appears with exponent 5, so the zero 4 has multiplicity 5; the graph crosses there and flattens strongly.
    - slug: alg2-u02-w06-q18
      type: fill_blank
      topic_code: "2.3"
      source: "IM Algebra 2, Unit 2, Lesson 3"
      points: 1
      prompt: |
        The constant term of the polynomial 3x⁴ − x³ + 2x − 11 is ____.
      answer: ["-11", "−11"]
      explanation: |
        The constant term is the term with no variable, −11, which is also the polynomial's value at x = 0.
    - slug: alg2-u02-w06-q19
      type: numeric
      topic_code: "2.11"
      source: "IM Algebra 2, Unit 2, Lesson 11"
      points: 1
      prompt: |
        The graphs of y = x² − 6x and y = 2x − 16 intersect at exactly one point. What is the x-coordinate of that point? Give the exact value.
      answer: { value: 4, tolerance: 0 }
      explanation: |
        x² − 6x = 2x − 16 gives x² − 8x + 16 = 0, which is (x − 4)² = 0. The double zero at x = 4 means the line is tangent to the parabola there, at the single point (4, −8).
    - slug: alg2-u02-w06-q20
      type: numeric
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 1
      prompt: |
        A cubic has the form p(x) = k(x + 2)²(x − 1) and passes through (2, 32). What is k? Give the exact value.
      answer: { value: 2, tolerance: 0 }
      explanation: |
        p(2) = k · 4² · 1 = 16k = 32, so k = 2.
    - slug: alg2-u02-w06-q21
      type: numeric
      topic_code: "1.11"
      source: "IM Algebra 2, Unit 1, Lesson 11"
      points: 1
      prompt: |
        What is the sum of the first 12 terms of the arithmetic sequence 50, 46, 42, …? Give the exact value.
      answer: { value: 336, tolerance: 0 }
      explanation: |
        a(12) = 50 − 4 · 11 = 6, so S(12) = 12 · (50 + 6)/2 = 12 · 28 = 336.
    - slug: alg2-u02-w06-q22
      type: short_answer
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 3
      prompt: |
        Let p(x) = (x − 2)²(x + 3).

        (a) Give the zeros of p with their multiplicities and say what the graph does at each.
        (b) Give the end behaviour and the vertical intercept.
        (c) Make a sign table for p and explain why the sign does not change at one of the zeros.
      answer: |
