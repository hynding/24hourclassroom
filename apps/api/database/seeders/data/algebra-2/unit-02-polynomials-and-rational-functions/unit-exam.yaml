  - slug: alg2-u02-exam-q43
    type: short_answer
    topic_code: "2.12"
    source: "IM Algebra 2, Unit 2, Lesson 12"
    points: 3
    prompt: |
      Let f(x) = x³ − 7x − 6.

      (a) Show that (x + 1) is a factor of f(x).
      (b) Divide f(x) by (x + 1) and factor f(x) completely.
      (c) Describe the graph of f: zeros, vertical intercept, end behaviour and the sign of f between the zeros.
    answer: |
      (a) f(−1) = −1 + 7 − 6 = 0, so by the Factor Theorem (x + 1) is a factor.
      (b) Dividing (remember the 0x² placeholder) gives x² − x − 6 = (x − 3)(x + 2), so f(x) = (x + 1)(x − 3)(x + 2).
      (c) Zeros −2, −1, 3; f(0) = −6; degree 3 with positive leading coefficient, so down-left and up-right. Sign: negative for x < −2, positive on (−2, −1), negative on (−1, 3), positive for x > 3.
    explanation: |
      Three points, one per part. (a) the evaluation. (b) the division and the complete factorisation. (c) all four features (zeros, intercept, ends, signs).
  - slug: alg2-u02-exam-q44
    type: long_answer
    topic_code: "2.19"
    source: "IM Algebra 2, Unit 2, Lesson 19"
    points: 6
    prompt: |
      Let g(x) = (2x² − 8)/(x² − 1).

      Write a full response that (1) factors numerator and denominator and states the domain, (2) finds all intercepts, (3) finds the vertical asymptotes and, by testing points, the direction of the graph on each side of x = 1, (4) finds the horizontal asymptote with a reason, and (5) describes the graph in words, including where it is above or below the horizontal asymptote.
    answer: |
      (1) g(x) = 2(x − 2)(x + 2)/((x − 1)(x + 1)); domain x ≠ ±1. Nothing cancels, so there are no holes.
      (2) x-intercepts at 2 and −2; g(0) = −8/(−1) = 8, so the vertical intercept is (0, 8).
      (3) Vertical asymptotes x = 1 and x = −1. At x = 0.9: numerator 2(0.81 − 4) = −6.38, denominator 0.81 − 1 = −0.19, so g ≈ 33.6, up on the left of 1. At x = 1.1: numerator 2(1.21 − 4) = −5.58, denominator 0.21, so g ≈ −26.6, down on the right of 1.
      (4) Equal degrees with leading coefficients 2 and 1, so y = 2. (Division: 2x² − 8 = 2(x² − 1) − 6, so g(x) = 2 − 6/(x² − 1).)
      (5) Because g(x) = 2 − 6/(x² − 1), the graph is below y = 2 wherever |x| > 1 and above it wherever |x| < 1. For x < −1 the graph starts just under 2 at the far left, descends through (−2, 0) and plunges to −∞ as x approaches −1 from the left. Between −1 and 1 it comes down from +∞ at both asymptotes to a lowest point at (0, 8), always above 2. For x > 1 it rises from −∞, crosses the axis at (2, 0) and climbs toward y = 2 from below. The graph is symmetric about the y-axis.
    explanation: |
      Six points: 1 for factoring and the domain; 1 for all three intercepts; 1 for the asymptotes with correct directions at x = 1; 1 for y = 2 with a reason; 2 for a coherent description that places the graph above y = 2 between the asymptotes and below it outside (1 if the description is right but the above/below analysis is missing).
