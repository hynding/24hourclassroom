    - slug: alg2-u02-w07-q22
      type: short_answer
      topic_code: "2.12"
      source: "IM Algebra 2, Unit 2, Lesson 12"
      points: 3
      prompt: |
        Let p(x) = x³ + 3x² − 10x − 24.

        (a) Show that x = 3 is a zero of p.
        (b) Divide p(x) by (x − 3) using a grid or long division, showing your work, and state the quotient.
        (c) Factor p(x) completely and list all of its zeros.
      answer: |
        (a) p(3) = 27 + 27 − 30 − 24 = 0.
        (b) Grid with (x − 3) down the side: x · x² = x³ and −3 · x² = −3x², so the x² column needs +6x², giving the quotient term 6x; −3 · 6x = −18x, so the x column needs +8x, giving the quotient term 8; −3 · 8 = −24 matches the constant. Quotient x² + 6x + 8, remainder 0.
        (c) x² + 6x + 8 = (x + 2)(x + 4), so p(x) = (x − 3)(x + 2)(x + 4) with zeros 3, −2, −4.
      explanation: |
        Three points, one per part. (a) the evaluation shown. (b) the division work and the quotient x² + 6x + 8. (c) the complete factorisation and all three zeros.
    - slug: alg2-u02-w07-q23
      type: short_answer
      topic_code: "2.15"
      source: "IM Algebra 2, Unit 2, Lesson 15"
      points: 3
      prompt: |
        (a) State the Remainder Theorem.
        (b) Use it to find the remainder when x⁵⁰ − 2x + 3 is divided by (x − 1), and explain why long division would be a poor choice here.
        (c) Explain how the Remainder Theorem shows that a is a zero of p exactly when (x − a) is a factor of p(x).
      answer: |
        (a) When a polynomial p(x) is divided by (x − a), the remainder equals p(a).
        (b) p(1) = 1 − 2 + 3 = 2, so the remainder is 2. Long division would need 50 steps with mostly zero coefficients; evaluation takes one line.
        (c) Write p(x) = (x − a) q(x) + r with r = p(a). If p(a) = 0 then r = 0 and p(x) = (x − a) q(x), so (x − a) is a factor. Conversely, if (x − a) is a factor then p(a) = (a − a) q(a) = 0.
      explanation: |
        Three points, one per part. (a) a correct statement. (b) remainder 2 with the efficiency comment. (c) both directions of the argument, using the division statement.
    - slug: alg2-u02-w07-q24
      type: long_answer
      topic_code: "2.14"
      source: "IM Algebra 2, Unit 2, Lesson 14"
      points: 6
      prompt: |
        A polynomial p of degree 4 has leading coefficient 1, zeros at −2, 1 and 3, and p(0) = −18. It is known that one of the zeros is a double zero.

        Write a full response that (1) explains why the degree and the three listed zeros force exactly one zero to be repeated, (2) tests each possibility for the double zero against p(0) = −18 and determines which one is consistent, (3) writes p(x) in factored form and expands it to standard form, and (4) describes the graph: intercepts, behaviour at each zero, and end behaviour.
      answer: |
        (1) A degree-4 polynomial has four zeros counting multiplicity. Three distinct zeros are listed, so the fourth must repeat one of them: exactly one zero has multiplicity 2 and the other two are simple.
        (2) Double zero at −2: p(x) = (x + 2)²(x − 1)(x − 3), p(0) = 4 · (−1)(−3) = 12. Double zero at 1: (x + 2)(x − 1)²(x − 3), p(0) = 2 · 1 · (−3) = −6. Double zero at 3: (x + 2)(x − 1)(x − 3)², p(0) = 2 · (−1) · 9 = −18. Only the double zero at 3 matches.
        (3) p(x) = (x + 2)(x − 1)(x − 3)². (x + 2)(x − 1) = x² + x − 2 and (x − 3)² = x² − 6x + 9; the product is x⁴ − 6x³ + 9x² + x³ − 6x² + 9x − 2x² + 12x − 18 = x⁴ − 5x³ + x² + 21x − 18.
        (4) x-intercepts at −2 (crosses), 1 (crosses) and 3 (touches and turns back); vertical intercept (0, −18). Degree 4 with leading coefficient 1, so both ends go up. The graph is negative between −2 and 1 (it passes through (0, −18)), positive between 1 and 3, and stays positive after bouncing at 3.
      explanation: |
        Six points: 1 for the multiplicity argument; 2 for testing the three cases with correct values (12, −6, −18) and choosing 3; 2 for the factored form and a correct expansion (1 if the expansion has one slip); 1 for the graph description including the bounce at 3 and both ends up.
