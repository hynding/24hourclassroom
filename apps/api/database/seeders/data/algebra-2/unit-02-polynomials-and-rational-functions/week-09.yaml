week: 9
unit: 2
title: "Rational Equations"
topics: ["2.20", "2.21", "2.22"]
guide: guides/week-09.md
guide_description: |
  Writing rational equations from averages, speeds with a current or wind, concentrations and shared jobs;
  solving them by recording restrictions, multiplying every term by the least common denominator and factoring;
  and recognising extraneous solutions, with an explanation of why multiplying by an expression that can be
  zero creates them. Worked examples: a boat on a river, a free-throw percentage, and three equations whose
  only candidate solution turns out to be extraneous.
flashcards_description: |
  27 cards on setting up rational equations, the clearing-denominators method, LCDs, restrictions and
  extraneous solutions.

flashcards:
  - front: Rational equation → definition
    back: |
      An equation with at least one fraction whose denominator contains the variable, such as 3/x + 1/(x − 2) = 2 or 24/(s − 2) + 24/(s + 2) = 5.
    topic_code: "2.20"
  - front: Free throws 18 of 30, how many more to reach 75% → the equation
    back: |
      If x more are made, the fraction is (18 + x)/(30 + x) = 0.75. Clearing gives 18 + x = 22.5 + 0.75x, so x = 18. Check: 36/48 = 0.75.
    topic_code: "2.20"
  - front: Time for a trip at a given speed → the fraction to use
    back: |
      time = distance/speed. Going 24 km upstream against a 2 km/h current at still-water speed s takes 24/(s − 2) hours; downstream takes 24/(s + 2).
    topic_code: "2.20"
  - front: Boat 24 km each way, current 2 km/h, 5 hours total → equation and answer
    back: |
      24/(s − 2) + 24/(s + 2) = 5. Clearing gives 5s² − 48s − 20 = 0, so (5s + 2)(s − 10) = 0 and s = 10 km/h (the negative root is not a speed).
    topic_code: "2.20"
  - front: Diluting a 20% solution to 8% by adding water → the equation
    back: |
      10 litres at 20% hold 2 litres of salt. Adding w litres of water: 2/(10 + w) = 0.08, so 10 + w = 25 and w = 15 litres.
    topic_code: "2.20"
  - front: Graphing as a way to solve a rational equation → how
    back: |
      Graph each side as a function and read the x-coordinates of the intersections. It is a reliable check on the algebra and shows at a glance when there is no solution.
    topic_code: "2.20"
  - front: Method for solving a rational equation → four steps
    back: |
      Record the restrictions (denominator zeros); multiply every term on both sides by the LCD; solve the resulting polynomial equation; check each candidate against the restrictions and in the original equation.
    topic_code: "2.21"
  - front: Least common denominator (LCD) → how to find it
    back: |
      The smallest expression every denominator divides into. For 3/x and 1/(x − 2) it is x(x − 2); for 6/(x² − 9) and 1/(x − 3) it is (x − 3)(x + 3).
    topic_code: "2.21"
  - front: Multiplying by the LCD → the rule people break
    back: |
      Every term on both sides is multiplied, including plain numbers. In 3/x + 1/(x − 2) = 2 the right side becomes 2x(x − 2), not 2.
    topic_code: "2.21"
  - front: Solve 3/x + 1/(x − 2) = 2 → result
    back: |
      Restrictions x ≠ 0, 2. Clearing: 3(x − 2) + x = 2x(x − 2), so 2x² − 8x + 6 = 0, x² − 4x + 3 = 0, (x − 1)(x − 3) = 0. Solutions x = 1 and x = 3, both allowed.
    topic_code: "2.21"
  - front: Cross-multiplying → when it is valid
    back: |
      When the equation is a single fraction equal to a single fraction: 2/(x + 1) = (x − 1)/4 becomes 8 = (x + 1)(x − 1). It is just clearing both denominators at once; restrictions still apply.
    topic_code: "2.21"
  - front: Solve 2/(x + 1) = (x − 1)/4 → result
    back: |
      8 = x² − 1, so x² = 9 and x = ±3. Restriction x ≠ −1; both survive. x = −3 is a valid solution even though it is negative.
    topic_code: "2.21"
  - front: Solve 1/x + 1/(x + 1) = 7/12 → result
    back: |
      Multiply by 12x(x + 1): 12(x + 1) + 12x = 7x(x + 1), so 7x² − 17x − 12 = 0, (7x + 4)(x − 3) = 0, x = 3 or x = −4/7.
    topic_code: "2.21"
  - front: Rational equation leading to a quadratic → what to expect
    back: |
      Up to two solutions, some of which may be extraneous or rejected by the context (a negative speed). Always factor fully and test each candidate.
    topic_code: "2.21"
  - front: Extraneous solution → definition
    back: |
      A value produced by solving the cleared polynomial equation that is not a solution of the original equation because it makes an original denominator zero.
    topic_code: "2.22"
  - front: Why clearing denominators can create extraneous solutions → the reason
    back: |
      Multiplying both sides by a nonzero number preserves solutions, but x − 3 is zero at x = 3, and multiplying by zero turns any statement into 0 = 0. So the cleared equation may gain exactly the values that make the multiplier zero.
    topic_code: "2.22"
  - front: Solve (x + 1)/(x − 3) = 4/(x − 3) + 2 → result
    back: |
      Restriction x ≠ 3. Clearing: x + 1 = 4 + 2(x − 3), so x = 3, which is restricted. No solution. The graphs of the two sides never meet.
    topic_code: "2.22"
  - front: Solve x/(x − 4) − 2 = 4/(x − 4) → result
    back: |
      Restriction x ≠ 4. Clearing: x − 2(x − 4) = 4 gives x = 4, extraneous. No solution.
    topic_code: "2.22"
  - front: Solve (x² − 4)/(x − 2) = 5 → result
    back: |
      Restriction x ≠ 2. Clearing: x² − 5x + 6 = 0, so x = 2 or 3. Reject x = 2 (extraneous); the solution is x = 3. Simplifying the left side to x + 2 first gives x + 2 = 5 directly.
    topic_code: "2.22"
  - front: Solve 6/(x² − 9) = 1/(x − 3) + 1/(x + 3) → result
    back: |
      Restrictions x ≠ ±3. Clearing by (x − 3)(x + 3): 6 = (x + 3) + (x − 3) = 2x, so x = 3, extraneous. No solution.
    topic_code: "2.22"
  - front: How to catch an extraneous solution automatically → the habit
    back: |
      Write the restrictions before clearing denominators. Any candidate equal to a restricted value is rejected on sight; then substitute the survivors into the original equation.
    topic_code: "2.22"
  - front: Extraneous versus rejected by context → the difference
    back: |
      Extraneous: makes a denominator zero, never a solution of the original equation. Rejected by context: a genuine solution of the equation that the situation forbids, such as a negative speed or a fractional number of people.
    topic_code: "2.22"
  - front: Number of solutions of a rational equation → the possibilities
    back: |
      Two, one or none. 2/(x + 1) = (x − 1)/4 has two; (x² − 4)/(x − 2) = 5 has one; x/(x − 4) − 2 = 4/(x − 4) has none.
    topic_code: "2.22"
  - front: Shared-job equations → the setup
    back: |
      If one pipe fills a tank in 6 hours it fills 1/6 of the tank per hour. Two pipes that take 6 and x hours fill 1/6 + 1/x per hour; if together they take 4 hours, 1/6 + 1/x = 1/4.
    topic_code: "2.20"
  - front: Error-spot → "I multiplied by the LCD and got x = 2, so x = 2 is the answer"
    back: |
      Not until you check it against the restrictions. If x = 2 makes an original denominator zero it is extraneous and must be rejected, possibly leaving no solution.
    topic_code: "2.22"
  - front: Error-spot → "time = speed/distance"
    back: |
      Time is distance divided by speed. A 24 km leg at 8 km/h takes 24/8 = 3 hours, not 8/24.
    topic_code: "2.20"
  - front: Cancelling a common factor before solving → what still applies
    back: |
      (x² − 4)/(x − 2) simplifies to x + 2 only for x ≠ 2. The restriction from the original denominator stays in force after cancelling.
    topic_code: "2.22"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (lessons 2.20 to 2.22: setting up and solving rational
    equations and extraneous solutions), with about a third reviewing weeks 4 to 8 and Unit 1. Includes a
    shared-context set on a kayak trip. Multiple choice, select-all, true/false and numeric items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded
    by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: the kayak trip (2.20, 2.21, 2.22)
    - slug: alg2-u02-w09-q01
      type: multiple_choice
      topic_code: "2.20"
      source: "IM Algebra 2, Unit 2, Lesson 20"
      points: 1
      stimulus: |
        A kayaker paddles 12 km upstream and then 12 km back downstream. The river's current is 1 km/h, and the whole trip takes 5 hours. Let s be the kayaker's speed in still water, in km/h.
      prompt: |
        Which equation describes the trip?
      options:
        - "12(s − 1) + 12(s + 1) = 5"
        - "12/(s − 1) + 12/(s + 1) = 5"
        - "24/s = 5"
        - "12/(s + 1) − 12/(s − 1) = 5"
      option_explanations:
        - |
          Time is distance divided by speed, not multiplied by it.
        - |
          Correct. Upstream speed is s − 1 and downstream s + 1; the two times 12/(s − 1) and 12/(s + 1) add to 5 hours.
        - |
          This ignores the current; the two legs are at different speeds, so their times differ.
        - |
          The two times add up to the total; they are not subtracted.
      answer: 1
    - slug: alg2-u02-w09-q02
      type: multiple_choice
      topic_code: "2.21"
      source: "IM Algebra 2, Unit 2, Lesson 21"
      points: 1
      stimulus: |
        A kayaker paddles 12 km upstream and then 12 km back downstream. The river's current is 1 km/h, and the whole trip takes 5 hours. Let s be the kayaker's speed in still water, in km/h.
      prompt: |
        What is the kayaker's speed in still water?
      options:
        - "4 km/h"
        - "4.8 km/h"
        - "5 km/h"
        - "6 km/h"
      option_explanations:
        - |
          At 4 km/h the trip would take 12/3 + 12/5 = 6.4 hours, longer than 5.
        - |
          4.8 is 24/5, the answer if there were no current; with the current the slower leg costs extra time.
        - |
          Correct. Clearing denominators: 12(s + 1) + 12(s − 1) = 5(s² − 1), so 5s² − 24s − 5 = 0, (5s + 1)(s − 5) = 0, s = 5. Check: 12/4 + 12/6 = 3 + 2 = 5 hours.
        - |
          At 6 km/h the trip would take 12/5 + 12/7 ≈ 4.1 hours, less than 5.
      answer: 2
    - slug: alg2-u02-w09-q03
      type: multiple_choice
      topic_code: "2.22"
      source: "IM Algebra 2, Unit 2, Lesson 22"
      points: 1
      stimulus: |
        A kayaker paddles 12 km upstream and then 12 km back downstream. The river's current is 1 km/h, and the whole trip takes 5 hours. Let s be the kayaker's speed in still water, in km/h.
      prompt: |
        Solving the cleared equation gives s = 5 and s = −1/5. Which statement about s = −1/5 is correct?
      options:
        - "It is extraneous because it makes a denominator in the original equation zero."
        - "It is a genuine solution of the equation but is rejected because a speed cannot be negative."
        - "It is the speed of the current."
        - "It shows the equation was set up incorrectly."
      option_explanations:
        - |
          The denominators are s − 1 and s + 1, which are −6/5 and 4/5 at s = −1/5, not zero; the value does satisfy the equation.
        - |
          Correct. −1/5 satisfies the rational equation, but the situation requires a positive speed, so it is rejected on contextual grounds rather than as extraneous.
        - |
          The current is given as 1 km/h; the quadratic's second root has no physical meaning here.
        - |
          A quadratic naturally has two roots; one being unusable does not mean the setup was wrong.
      answer: 1
    - slug: alg2-u02-w09-q04
      type: multiple_choice
      topic_code: "2.21"
      source: "IM Algebra 2, Unit 2, Lesson 21"
      points: 1
      prompt: |
        What is the solution of 3/x + 2 = 5/x?
      options:
        - "x = 1"
        - "x = 2"
        - "x = 4"
        - "No solution"
      option_explanations:
        - |
          Correct. Multiplying by x gives 3 + 2x = 5, so x = 1; it is not restricted (x ≠ 0) and checks: 3 + 2 = 5.
        - |
          At x = 2 the left side is 1.5 + 2 = 3.5 and the right side is 2.5.
        - |
          At x = 4 the left side is 0.75 + 2 = 2.75 and the right side is 1.25.
        - |
          The only restriction is x ≠ 0, and the candidate x = 1 is allowed.
      answer: 0
    - slug: alg2-u02-w09-q05
      type: multiple_choice
      topic_code: "2.22"
      source: "IM Algebra 2, Unit 2, Lesson 22"
      points: 1
      prompt: |
        What is the solution set of (x + 2)/(x − 5) = 7/(x − 5)?
      options:
        - "x = 5"
        - "x = −2"
        - "No solution"
        - "All real numbers except 5"
      option_explanations:
        - |
          Clearing gives x + 2 = 7, so x = 5, but 5 makes both denominators zero; it is extraneous.
        - |
          At x = −2 the left side is 0 and the right side is −1.
        - |
          Correct. The only candidate, x = 5, is restricted, so the equation has no solution.
        - |
          The two sides are equal only where x + 2 = 7, which happens nowhere in the domain.
      answer: 2
    - slug: alg2-u02-w09-q06
      type: multiple_choice
      topic_code: "2.20"
      source: "IM Algebra 2, Unit 2, Lesson 20"
      points: 1
      prompt: |
        A player has made 15 of 25 free throws. How many consecutive free throws must she make to raise her percentage to exactly 80%?
      options:
        - "5"
        - "10"
        - "20"
        - "25"
      option_explanations:
        - |
          After 5 makes she is 20 of 30, which is about 67%.
        - |
          After 10 makes she is 25 of 35, about 71%.
        - |
          After 20 makes she is 35 of 45, about 78%.
        - |
          Correct. (15 + x)/(25 + x) = 0.8 gives 15 + x = 20 + 0.8x, so 0.2x = 5 and x = 25. Check: 40/50 = 0.8.
      answer: 3
    - slug: alg2-u02-w09-q07
      type: multiple_choice
      topic_code: "2.21"
      source: "IM Algebra 2, Unit 2, Lesson 21"
      points: 1
      prompt: |
        What is the least common denominator for the equation 1/(x² − 4) + 3/(x + 2) = 1?
      options:
        - "(x² − 4)(x + 2)"
        - "(x − 2)(x + 2)"
        - "x + 2"
        - "x² − 4 + x + 2"
      option_explanations:
        - |
          This is a common denominator but not the least one; (x + 2) is already a factor of x² − 4.
        - |
          Correct. x² − 4 = (x − 2)(x + 2) already contains (x + 2), so the LCD is (x − 2)(x + 2).
        - |
          x + 2 is a factor of x² − 4, but x² − 4 does not divide x + 2, so x + 2 alone is not a common denominator of both fractions.
        - |
          Denominators are combined by finding common factors, not by adding them.
      answer: 1
    - slug: alg2-u02-w09-q08
      type: multiple_choice
      topic_code: "2.21"
      source: "IM Algebra 2, Unit 2, Lesson 21"
      points: 1
      prompt: |
        What are the solutions of 6/(x + 1) = (x + 2)/2?
      options:
        - "x = 2 only"
        - "x = 2 and x = −5"
        - "x = −2 and x = 5"
        - "x = 1 and x = −6"
      option_explanations:
        - |
          x = 2 works, but so does x = −5: 6/(−4) = −1.5 and (−3)/2 = −1.5.
        - |
          Correct. Cross-multiplying: 12 = (x + 1)(x + 2) = x² + 3x + 2, so x² + 3x − 10 = (x + 5)(x − 2) = 0. Neither value is restricted (x ≠ −1).
        - |
          At x = 5, 6/6 = 1 but 7/2 = 3.5; these are the roots with the wrong signs.
        - |
          At x = 1 the left side is 6/2 = 3 but the right side is 3/2 = 1.5, so it is not a solution.
      answer: 1
    - slug: alg2-u02-w09-q09
      type: multiple_choice
      topic_code: "2.20"
      source: "IM Algebra 2, Unit 2, Lesson 20"
      points: 1
      prompt: |
        A 4-litre container holds a 25% acid solution. How much pure water must be added to make the solution 10% acid?
      options:
        - "1.5 litres"
        - "6 litres"
        - "10 litres"
        - "15 litres"
      option_explanations:
        - |
          Adding 1.5 litres gives 1/5.5 ≈ 18%, still too strong.
        - |
          Correct. The container holds 1 litre of acid. Adding w litres of water: 1/(4 + w) = 0.1, so 4 + w = 10 and w = 6.
        - |
          10 is the total volume after dilution, not the amount of water added.
        - |
          Adding 15 litres gives 1/19 ≈ 5%, too weak.
      answer: 1
    - slug: alg2-u02-w09-q10
      type: multiple_choice
      topic_code: "2.22"
      source: "IM Algebra 2, Unit 2, Lesson 22"
      points: 1
      prompt: |
        Why can multiplying both sides of a rational equation by (x − 3) introduce a solution that does not satisfy the original equation?
      options:
        - "Because multiplying by a negative number reverses the equation."
        - "Because (x − 3) equals zero when x = 3, and multiplying by zero makes any equation true at that value."
        - "Because polynomials are not closed under division."
        - "Because rational equations always have exactly one solution."
      option_explanations:
        - |
          Multiplying by a negative number reverses inequalities, not equations, and it does not change the solution set of an equation.
        - |
          Correct. For x = 3 the multiplier is 0, so both sides become 0 regardless of whether the original sides were equal or even defined.
        - |
          Closure is about whether a quotient is a polynomial; it has nothing to do with solution sets.
        - |
          Rational equations can have zero, one or several solutions.
      answer: 1
    - slug: alg2-u02-w09-q11
      type: multiple_choice
      topic_code: "2.17"
      source: "IM Algebra 2, Unit 2, Lesson 17"
      points: 1
      prompt: |
        Which function has vertical asymptotes at x = −3 and x = 2 and an x-intercept at x = 0?
      options:
        - "y = x/((x + 3)(x − 2))"
        - "y = (x + 3)(x − 2)/x"
        - "y = x/((x − 3)(x + 2))"
        - "y = (x − 2)/(x(x + 3))"
      option_explanations:
        - |
          Correct. The denominator is zero at −3 and 2, and the numerator is zero at 0.
        - |
          This has its asymptote at x = 0 and intercepts at −3 and 2, the reverse.
        - |
          The asymptotes here are at x = 3 and x = −2, the wrong signs.
        - |
          This has asymptotes at 0 and −3 and an intercept at 2.
      answer: 0
    - slug: alg2-u02-w09-q12
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 1
      prompt: |
        Which polynomial has a graph that bounces off the x-axis at x = 1 and crosses it at x = −2?
      options:
        - "(x − 1)(x + 2)²"
        - "(x − 1)²(x + 2)"
        - "(x + 1)²(x − 2)"
        - "(x − 1)(x + 2)"
      option_explanations:
        - |
          This bounces at −2 and crosses at 1, the reverse.
        - |
          Correct. The double factor (x − 1)² gives a bounce at 1 and the single factor (x + 2) a crossing at −2.
        - |
          The zeros here are −1 (double) and 2, not 1 and −2 as required.
        - |
          Both zeros are simple, so the graph crosses at both.
      answer: 1
    - slug: alg2-u02-w09-q13
      type: multi_select
      topic_code: "2.22"
      source: "IM Algebra 2, Unit 2, Lesson 22"
      points: 2
      partial_credit: true
      prompt: |
        Consider the equation x/(x − 2) = 2/(x − 2) + 3. Which statements are true? Select all that apply.
      options:
        - "The restriction is x ≠ 2."
        - "Clearing the denominator gives x = 2 + 3(x − 2), whose solution is x = 2."
        - "x = 2 is a solution of the original equation."
        - "The original equation has no solution."
        - "The graphs of the two sides intersect at x = 2."
      option_explanations:
        - |
          Correct. The only denominator, x − 2, is zero at 2.
        - |
          Correct. x = 2 + 3x − 6 gives −2x = −4, so x = 2.
        - |
          Both sides are undefined at x = 2, so it cannot be a solution; it is extraneous.
        - |
          Correct. The only candidate is extraneous, so there is no solution.
        - |
          Both graphs have a vertical asymptote at x = 2; neither has a point there.
      answer: [0, 1, 3]
    - slug: alg2-u02-w09-q14
      type: multi_select
      topic_code: "2.21"
      source: "IM Algebra 2, Unit 2, Lesson 21"
      points: 2
      partial_credit: true
      prompt: |
        For which of these equations is x = 3 a solution? Select all that apply.
      options:
        - "1/x + 1/(x + 3) = 1/2"
        - "(x + 1)/(x − 3) = 4/(x − 3)"
        - "9/x = x"
        - "2/(x − 1) = 1"
        - "5/(x + 2) = 2"
      option_explanations:
        - |
          Correct. Substituting x = 3: 1/3 + 1/6 = 2/6 + 1/6 = 1/2, as required.
        - |
          Both sides are undefined at x = 3, so it is not a solution; the equation has no solution at all.
        - |
          Correct. 9/3 = 3; the other solution is x = −3.
        - |
          Correct. Substituting x = 3: 2/(3 − 1) = 2/2 = 1, so the equation holds.
        - |
          At x = 3 the left side is 5/5 = 1, not 2; the solution is x = 0.5.
      answer: [0, 2, 3]
    - slug: alg2-u02-w09-q15
      type: true_false
      topic_code: "2.22"
      source: "IM Algebra 2, Unit 2, Lesson 22"
      points: 1
      prompt: |
        True or false: Every solution of the polynomial equation obtained by clearing denominators is also a solution of the original rational equation.
      answer: false
      explanation: |
        False. Clearing denominators multiplies by an expression that is zero at the restricted values, which can add those values as solutions of the new equation. Any candidate that makes an original denominator zero is extraneous and must be discarded.
    - slug: alg2-u02-w09-q16
      type: true_false
      topic_code: "2.15"
      source: "IM Algebra 2, Unit 2, Lesson 15"
      points: 1
      prompt: |
        True or false: The remainder when x³ + 1 is divided by (x + 1) is 0.
      answer: true
      explanation: |
        True. By the Remainder Theorem the remainder is p(−1) = (−1)³ + 1 = 0, so (x + 1) is a factor: x³ + 1 = (x + 1)(x² − x + 1).
    - slug: alg2-u02-w09-q17
      type: fill_blank
      topic_code: "2.18"
      source: "IM Algebra 2, Unit 2, Lesson 18"
      points: 1
      prompt: |
        The horizontal asymptote of y = (4x² + 1)/(x² − 3) is the line y = ____.
      answer: ["4", "y = 4"]
      explanation: |
        The degrees are equal, so the asymptote is the ratio of the leading coefficients, 4/1 = 4.
    - slug: alg2-u02-w09-q18
      type: fill_blank
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 1
      prompt: |
        When (x + 3)² is expanded, the coefficient of x is ____.
      answer: ["6"]
      explanation: |
        (x + 3)² = x² + 6x + 9; the cross term 3x appears twice, giving 6x.
    - slug: alg2-u02-w09-q19
      type: numeric
      topic_code: "2.21"
      source: "IM Algebra 2, Unit 2, Lesson 21"
      points: 1
      prompt: |
        Solve 4/(x − 2) = 1/(x + 4). Give the exact value of x.
      answer: { value: -6, tolerance: 0 }
      explanation: |
        Cross-multiplying: 4(x + 4) = x − 2, so 4x + 16 = x − 2, 3x = −18, x = −6. Neither restriction (x ≠ 2, −4) is hit. Check: 4/(−8) = −0.5 and 1/(−2) = −0.5.
    - slug: alg2-u02-w09-q20
      type: numeric
      topic_code: "2.20"
      source: "IM Algebra 2, Unit 2, Lesson 20"
      points: 1
      prompt: |
        A student has earned 45 of 70 possible points on quizzes. Each remaining quiz is worth 10 points. How many consecutive perfect quizzes would bring the overall percentage to exactly 75%? Give a whole number.
      answer: { value: 3, tolerance: 0 }
      explanation: |
        (45 + 10n)/(70 + 10n) = 0.75 gives 45 + 10n = 52.5 + 7.5n, so 2.5n = 7.5 and n = 3. Check: 75/100 = 0.75.
    - slug: alg2-u02-w09-q21
      type: numeric
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 1
      prompt: |
        For the geometric sequence a(n) = 2 · 3ⁿ⁻¹, which term number n gives a(n) = 1458? Give a whole number.
      answer: { value: 7, tolerance: 0 }
      explanation: |
        2 · 3ⁿ⁻¹ = 1458 gives 3ⁿ⁻¹ = 729 = 3⁶, so n − 1 = 6 and n = 7.
    - slug: alg2-u02-w09-q22
      type: short_answer
      topic_code: "2.21"
      source: "IM Algebra 2, Unit 2, Lesson 21"
      points: 3
      prompt: |
        Solve 1/x + 1/(x + 2) = 3/4.

        (a) State the restrictions and the least common denominator.
        (b) Clear the denominators and solve the resulting equation, showing your factoring.
        (c) Check both solutions in the original equation.
      answer: |
        (a) Restrictions x ≠ 0, −2. LCD 4x(x + 2).
        (b) 4(x + 2) + 4x = 3x(x + 2), so 8x + 8 = 3x² + 6x, giving 3x² − 2x − 8 = 0, (3x + 4)(x − 2) = 0, x = 2 or x = −4/3.
        (c) x = 2: 1/2 + 1/4 = 3/4. x = −4/3: 1/(−4/3) = −3/4 and 1/(−4/3 + 2) = 1/(2/3) = 3/2; sum −3/4 + 3/2 = 3/4. Both check.
      explanation: |
        Three points, one per part. (a) restrictions and LCD. (b) correct clearing, the quadratic and its factoring, both roots. (c) both checks shown.
    - slug: alg2-u02-w09-q23
      type: short_answer
      topic_code: "2.20"
      source: "IM Algebra 2, Unit 2, Lesson 20"
      points: 3
      prompt: |
        One pipe can fill a tank in 6 hours. When a second pipe is opened as well, the tank fills in 4 hours.

        (a) Explain why the first pipe fills 1/6 of the tank per hour, and write an equation involving x, the number of hours the second pipe would need alone.
        (b) Solve the equation.
        (c) Explain how you know the answer is reasonable without re-solving.
      answer: |
        (a) In 6 hours it fills the whole tank, so in 1 hour it fills one sixth. Together the pipes fill 1/4 of the tank per hour: 1/6 + 1/x = 1/4.
        (b) Multiply by 12x: 2x + 12 = 3x, so x = 12 hours.
        (c) The second pipe alone must be slower than both together (12 > 4) and, since the pair is faster than the first pipe alone, the second pipe contributes something but less than the first (12 > 6). Both checks pass; also 1/6 + 1/12 = 3/12 = 1/4.
      explanation: |
        Three points, one per part. (a) the rate reasoning and the equation. (b) x = 12. (c) a sensible reasonableness check.
    - slug: alg2-u02-w09-q24
      type: long_answer
      topic_code: "2.22"
      source: "IM Algebra 2, Unit 2, Lesson 22"
      points: 6
      prompt: |
        A plane flies 600 km from one city to another with a 50 km/h tailwind and then flies back against the same wind. The round trip takes 5 hours of flying time. Let s be the plane's speed in still air, in km/h.

        Write a full response that (1) writes the rational equation for the trip and states its restrictions, (2) clears the denominators and solves the resulting quadratic, (3) decides which solutions are extraneous, which are rejected by the context and which is the answer, with reasons, and (4) checks the answer by computing both flight times.
      answer: |
        (1) 600/(s + 50) + 600/(s − 50) = 5, with s ≠ ±50.
        (2) Multiply by (s + 50)(s − 50): 600(s − 50) + 600(s + 50) = 5(s² − 2500), so 1200s = 5s² − 12500, giving s² − 240s − 2500 = 0. The quadratic formula: s = (240 ± √(57600 + 10000))/2 = (240 ± 260)/2, so s = 250 or s = −10.
        (3) Neither value makes a denominator zero, so neither is extraneous. s = −10 is a genuine solution of the equation but a negative airspeed is impossible, so it is rejected by the context. The answer is s = 250 km/h.
        (4) With the wind: 600/300 = 2 hours. Against it: 600/200 = 3 hours. Total 5 hours, as required.
      explanation: |
        Six points: 1 for the equation and restrictions; 2 for correctly clearing and solving the quadratic (both roots); 2 for the distinction between extraneous and context-rejected with the right conclusion (1 if 250 is chosen without the distinction); 1 for the check of 2 + 3 = 5 hours.
